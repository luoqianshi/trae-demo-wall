<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPilot - AI桌面宠物</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-glow"></div>
    <div class="app-glow-2"></div>
    
    <div class="app-container">
        <header class="app-header">
            <div class="logo-wrapper">
                <span class="logo-icon">🐱</span>
                <h1>PetPilot</h1>
            </div>
            <p class="subtitle">你的AI桌面宠物</p>
        </header>

        <main class="main-content">
            <div class="pet-section">
                <div class="pet-card">
                    <div class="pet-glow"></div>
                    <div class="pet-container" id="petContainer">
                        <div class="pet-emoji" id="petEmoji">🐱</div>
                        <div class="pet-status" id="petStatus">等待主人召唤~</div>
                        <div class="pet-action-hint">点击互动</div>
                    </div>
                </div>
                
                <div class="trial-card">
                    <div class="trial-badge">免费体验</div>
                    <div class="trial-progress">
                        <div class="trial-progress-bar" id="trialProgressBar"></div>
                    </div>
                    <div class="trial-count-wrap">
                        <span class="trial-count" id="trialCount">0</span>
                        <span class="trial-total">/ 100</span>
                    </div>
                </div>
            </div>

            <div class="chat-section">
                <div class="chat-card">
                    <div class="chat-header">
                        <div class="chat-title">
                            <span class="chat-icon">💬</span>
                            <h2>与宠物聊天</h2>
                        </div>
                        <div class="chat-status">
                            <span class="online-dot"></span>
                            <span>在线</span>
                        </div>
                    </div>
                    
                    <div class="chat-messages" id="chatMessages">
                        <div class="welcome-message">
                            <div class="avatar ai">🐱</div>
                            <div class="message-content">
                                <div class="message-bubble ai">喵~你好呀！我是你的AI宠物PetPilot！点击我可以互动哦~ 🐾</div>
                            </div>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <div class="input-wrapper">
                            <input type="text" id="messageInput" placeholder="和你的宠物聊天吧..." autocomplete="off">
                            <button id="sendButton" class="send-btn">
                                <span class="send-icon">➤</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2024 PetPilot - AI Desktop Pet</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
