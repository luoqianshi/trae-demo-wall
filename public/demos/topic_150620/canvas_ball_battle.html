<meta charset="utf-8">
<style>
  :root {
    --bg: #08111f;
    --panel: #111a2b;
    --panel-2: #172238;
    --line: #26344f;
    --text: #eef4ff;
    --muted: #93a4bf;
    --accent: #40c4ff;
    --accent-2: #ff4d6d;
    --good: #47d18c;
    --warn: #ffd166;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 10%, #16365b 0, #08111f 34%, #050912 100%);
    color: var(--text);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  .app {
    min-height: 100vh;
  }

  .view {
    min-height: 100vh;
  }

  .app[data-view="game"] .settings-view {
    display: none;
  }

  .app[data-view="settings"] .game-view {
    display: none;
  }

  .stage-wrap {
    position: relative;
    display: grid;
    place-items: center;
    height: 100vh;
    padding: 24px;
    overflow: hidden;
  }

  .canvas-shell {
    position: relative;
    width: 824px;
    height: 824px;
    transform: scale(var(--stage-scale, 1));
    transform-origin: center;
  }

  .stage-controls {
    position: absolute;
    right: 24px;
    bottom: 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 2;
  }

  .stage-controls button {
    width: auto;
    min-width: 104px;
    margin-top: 0;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
  }

  .settings-view {
    height: 100vh;
    overflow: auto;
    padding: 24px;
  }

  .settings-panel {
    max-width: 860px;
    margin: 0 auto;
    background: rgba(10, 16, 29, .92);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px;
    backdrop-filter: blur(16px);
  }

  .settings-header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
  }

  .settings-header button {
    width: auto;
    margin-top: 0;
    white-space: nowrap;
  }

  .settings-header h2 {
    margin: 0 0 14px;
    font-size: 18px;
  }

  canvas {
    display: block;
    width: 800px;
    height: 800px;
    aspect-ratio: 1 / 1;
    background: #0b8ed8;
    border: 12px solid #05070d;
    box-shadow: 0 24px 80px rgba(0, 0, 0, .42);
    cursor: default;
  }

  .hint {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .group {
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }

  .group h3 {
    margin: 0 0 12px;
    font-size: 14px;
    color: #cfe4ff;
  }

  label {
    display: block;
    margin: 12px 0;
    font-size: 13px;
    color: var(--muted);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .checkline {
    display: flex;
    gap: 10px;
    align-items: center;
    color: var(--text);
  }

  .checkline input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }

  input[type="number"] {
    width: 100%;
    margin-top: 8px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    font: 600 13px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
  }

  input[type="number"]:disabled {
    opacity: .45;
  }

  input[type="text"],
  input[type="color"],
  input[type="file"],
  select {
    width: 100%;
    margin-top: 8px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
  }

  .value {
    min-width: 54px;
    text-align: right;
    font: 600 13px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    color: var(--text);
  }

  button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 10px;
    color: #06101c;
    background: var(--accent);
    font-weight: 700;
    cursor: pointer;
  }

  button.secondary {
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
  }

  /* ── 设置子导航 ── */
  .settings-nav {
    display: flex;
    gap: 8px;
    margin: 16px 0 0;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
  }

  .settings-nav-btn {
    width: auto;
    margin-top: 0;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--line);
    color: var(--muted);
    background: transparent;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  .settings-nav-btn.active {
    color: var(--text);
    background: var(--panel-2);
    border-color: var(--accent);
  }

  /* ── 子视图切换 ── */
  .settings-subview {
    display: none;
  }

  .settings-panel[data-subview="library"] .settings-subview[data-subview="library"],
.settings-panel[data-subview="edit-role"] .settings-subview[data-subview="edit-role"],
.settings-panel[data-subview="map"] .settings-subview[data-subview="map"],
.settings-panel[data-subview="edit-map"] .settings-subview[data-subview="edit-map"],
.settings-panel[data-subview="battle"] .settings-subview[data-subview="battle"],
.settings-panel[data-subview="workshop"] .settings-subview[data-subview="workshop"],
.settings-panel[data-subview="edit-skill"] .settings-subview[data-subview="edit-skill"] {
  display: block;
}

  /* ── 角色编辑页 ── */
  .role-edit-page {
    padding: 4px 0;
  }

  .role-edit-page h3 {
    margin: 0 0 16px;
    font-size: 15px;
    color: #cfe4ff;
  }

  .back-btn {
    width: auto;
    margin-top: 0;
    margin-bottom: 14px;
    padding: 8px 14px;
    font-size: 13px;
  }

  .role-edit-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }

  .role-edit-actions button {
    margin-top: 0;
  }

  button.danger {
    color: var(--accent-2);
    background: var(--panel-2);
    border: 1px solid var(--accent-2);
  }

  /* ── 角色库缩略图布局 ── */
  .role-library-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
    padding-top: 8px;
  }

  .role-card {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 12px 10px 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, transform .12s;
  }

  .role-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .role-card.is-selected {
    border-color: var(--good);
    box-shadow: 0 0 0 2px rgba(71, 209, 140, .25);
  }

  .role-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    margin: 0 auto 8px;
    background-size: cover;
    background-position: center;
  }

  .role-info b {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .role-info span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .role-picked {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: var(--good);
    background: rgba(71, 209, 140, .12);
    border-radius: 6px;
    padding: 2px 8px;
  }

  .role-card-actions {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 8px;
  }

  .role-card-actions button {
    width: auto;
    margin-top: 0;
    padding: 6px 10px;
    font-size: 11px;
    border-radius: 8px;
  }

  /* ── 地图库缩略图布局 ── */
  .map-library-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    padding-top: 8px;
  }

  .map-card {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 10px 8px 8px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, transform .12s;
    min-width: 160px;
  }

  .map-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .map-card.is-selected {
    border-color: var(--good);
    box-shadow: 0 0 0 2px rgba(71, 209, 140, .25);
  }

  .map-preview {
    display: block;
    width: 120px;
    height: 120px;
    border-radius: 10px;
    margin: 0 auto 8px;
    background: var(--panel-2);
    image-rendering: pixelated;
  }

  .map-info b {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .map-picked {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: var(--good);
    background: rgba(71, 209, 140, .12);
    border-radius: 6px;
    padding: 2px 8px;
  }

  .map-card-actions {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 8px;
  }

  .map-card-actions button {
    width: auto;
    margin-top: 0;
    padding: 6px 10px;
    font-size: 11px;
    border-radius: 8px;
  }

  /* ── 墙体编辑表格 ── */
  .wall-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 12px;
  }

  .wall-table th,
  .wall-table td {
    padding: 6px 4px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  .wall-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
  }

  .wall-table input[type="number"] {
    width: 100%;
    margin-top: 0;
    padding: 6px;
    font-size: 12px;
  }

  .wall-table .del-btn {
    width: auto;
    margin-top: 0;
    padding: 4px 8px;
    font-size: 11px;
  }

  /* ── 技能库布局 ── */
  .skill-library-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    padding-top: 8px;
  }

  .skill-card {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, transform .12s;
  }

  .skill-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .skill-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin: 0 auto 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .skill-info b {
    display: block;
    font-size: 12px;
    margin-bottom: 2px;
  }

  .skill-info span {
    display: block;
    font-size: 10px;
    color: var(--muted);
  }

  .skill-card-actions {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 8px;
  }

  .skill-card-actions button {
    width: auto;
    margin-top: 0;
    padding: 4px 8px;
    font-size: 10px;
    border-radius: 6px;
  }

  /* ── 技能装配区 ── */
  .skill-slot {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
    margin: 8px 0;
  }

  .skill-slot select {
    margin-top: 0;
  }

  .skill-slot button {
    width: auto;
    margin-top: 0;
    padding: 8px 12px;
    font-size: 12px;
  }

  /* ── 主页面下拉选择器 ── */
  .role-select-group select {
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  @media (max-width: 900px) {
    body {
      overflow: auto;
    }

    .game-view .stage-wrap {
      min-height: 100vh;
      padding: 16px;
      align-content: start;
    }

    .settings-view {
      height: auto;
      min-height: 100vh;
      padding: 16px;
    }

    .settings-header {
      display: block;
    }

    .stage-controls {
      right: 18px;
      bottom: 18px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stage-controls button {
      min-width: 84px;
      padding: 10px 12px;
    }

    .role-edit-actions {
      grid-template-columns: 1fr 1fr;
    }
  }
</style>

<div class="app" data-view="game">
  <!-- ══════════ 游戏页面 ══════════ -->
  <section class="view game-view">
    <main class="stage-wrap">
      <div class="canvas-shell">
        <canvas id="game" width="800" height="800"></canvas>
        <div class="stage-controls">
          <button id="startBattle">开始对战</button>
          <button id="reset" class="secondary">重置本局</button>
          <button id="goSettings" class="secondary">设置</button>
        </div>
      </div>
    </main>
  </section>

  <!-- ══════════ 设置页面 ══════════ -->
  <section class="view settings-view">
    <aside class="settings-panel" data-subview="library">
      <header class="settings-header">
        <div>
          <h2>设置</h2>
          <p class="hint">管理角色库、战斗参数和显示选项。</p>
        </div>
        <button id="backToGame" class="secondary">返回游戏</button>
      </header>

      <nav class="settings-nav">
        <button class="settings-nav-btn active" data-subview="library">角色库</button>
        <button class="settings-nav-btn" data-subview="map">地图</button>
        <button class="settings-nav-btn" data-subview="battle">战斗参数</button>
        <button class="settings-nav-btn" data-subview="workshop">创意工坊</button>
      </nav>

      <!-- 角色库列表 -->
      <div class="settings-subview" data-subview="library">
        <div id="roleLibraryList" class="role-library-list"></div>
      </div>

      <!-- 地图库 -->
      <div class="settings-subview" data-subview="map">
        <section class="group">
          <h3>地图库</h3>
          <div id="mapLibraryList" class="map-library-list"></div>
          <button id="createCustomMap" style="margin-top:16px">+ 创建自定义地图</button>
        </section>
      </div>

      <!-- 地图编辑页 -->
      <div class="settings-subview" data-subview="edit-map">
        <div class="role-edit-page">
          <button id="backToMapLibrary" class="secondary back-btn">← 返回地图库</button>
          <h3>编辑地图</h3>
          <label>
            地图名称
            <input id="editMapName" type="text" placeholder="输入地图名称">
          </label>
          <label>
            背景颜色
            <input id="editMapBgColor" type="color" value="#0b8ed8">
          </label>
          <label>
            背景图片（可选）
            <input id="editMapImage" type="file" accept="image/*">
          </label>
          <label>
            墙体列表
            <table class="wall-table" id="wallTable">
              <thead>
                <tr>
                  <th>X</th>
                  <th>Y</th>
                  <th>宽</th>
                  <th>高</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="wallTableBody"></tbody>
            </table>
          </label>
          <button id="addWallBtn" class="secondary">+ 添加墙体</button>
          <div class="role-edit-actions" style="grid-template-columns:1fr 1fr 1fr">
            <button id="saveEditedMap">保存</button>
            <button id="cancelEditMap" class="secondary">取消</button>
            <button id="deleteEditedMap" class="secondary danger">删除地图</button>
          </div>
        </div>
      </div>

      <!-- 角色编辑页 -->
      <div class="settings-subview" data-subview="edit-role">
        <div class="role-edit-page">
          <button id="backToLibrary" class="secondary back-btn">← 返回角色库</button>
          <h3>编辑角色</h3>
          <label>
            角色名称
            <input id="editRoleName" type="text" placeholder="输入角色名称">
          </label>
          <label>
            角色颜色
            <input id="editRoleColor" type="color" value="#40c4ff">
          </label>
          <label>
            角色图片
            <input id="editRoleImage" type="file" accept="image/*">
          </label>
          <label class="row">
            <span>血量</span>
            <input id="editRoleHp" type="number" min="20" max="600" value="200">
          </label>
          <label class="row">
            <span>大小</span>
            <input id="editRoleRadius" type="number" min="16" max="90" value="34">
          </label>
          <label class="row">
            <span>伤害</span>
            <input id="editRoleDamage" type="number" min="5" max="100" value="24">
          </label>
          <label class="row">
            <span>冷却</span>
            <input id="editRoleHitCooldown" type="number" min="6" max="60" value="24">
          </label>
          <label class="row">
            <span>速度</span>
            <input id="editRoleSpeed" type="number" min="1" max="8" step="0.1" value="2.8">
          </label>
          <label>
            攻击模式
            <select id="editRoleAttackType">
              <option value="melee">碰撞</option>
              <option value="ranged">远程</option>
              <option value="areamelee">范围近战</option>
            </select>
          </label>
          <label class="row" id="editAreaRadiusRow" style="display:none">
            <span>攻击范围</span>
            <input id="editRoleAreaRadius" type="number" min="30" max="200" value="80">
          </label>
          <label class="row" id="editAreaDamageRow" style="display:none">
            <span>范围伤害</span>
            <input id="editRoleAreaDamage" type="number" min="5" max="100" value="20">
          </label>
          <label>
            技能装配（最多3个）
          </label>
          <div id="editSkillSlots">
            <div class="skill-slot">
              <select data-slot-idx="0" class="edit-skill-select">
                <option value="">未装配</option>
              </select>
              <button class="secondary" data-remove-slot="0">移除</button>
            </div>
            <div class="skill-slot">
              <select data-slot-idx="1" class="edit-skill-select">
                <option value="">未装配</option>
              </select>
              <button class="secondary" data-remove-slot="1">移除</button>
            </div>
            <div class="skill-slot">
              <select data-slot-idx="2" class="edit-skill-select">
                <option value="">未装配</option>
              </select>
              <button class="secondary" data-remove-slot="2">移除</button>
            </div>
          </div>
           <div class="role-edit-actions">
            <button id="saveEditedRole">保存</button>
            <button id="cancelEditRole" class="secondary">取消</button>
            <button id="deleteEditedRole" class="secondary danger">删除角色</button>
          </div>
        </div>
      </div>

      <!-- 战斗参数 -->
      <div class="settings-subview" data-subview="battle">
        <section class="group">
          <h3>角色</h3>
          <label>
            角色 A
            <select id="roleSelectA"></select>
          </label>
          <label>
            角色 B
            <select id="roleSelectB"></select>
          </label>
        </section>

        <section class="group">
          <h3>显示</h3>
          <label class="checkline">
            <input id="battleHintEnabled" type="checkbox" checked>
            <span>开启战斗提示</span>
          </label>
        </section>
      </div>

      <!-- 创意工坊 -->
      <div class="settings-subview" data-subview="workshop">
        <section class="group">
          <h3>创建自定义角色</h3>
          <label>
            角色名称
            <input id="wsRoleName" type="text" placeholder="输入角色名称" value="自定义角色">
          </label>
          <label>
            角色颜色
            <input id="wsRoleColor" type="color" value="#40c4ff">
          </label>
          <label>
            角色图片（可选）
            <input id="wsRoleImage" type="file" accept="image/*">
          </label>
          <label class="row">
            <span>血量</span>
            <input id="wsRoleHp" type="number" min="20" max="600" value="200">
          </label>
          <label class="row">
            <span>大小</span>
            <input id="wsRoleRadius" type="number" min="16" max="90" value="34">
          </label>
          <label>
            攻击模式
            <select id="wsAttackType">
              <option value="melee">碰撞</option>
              <option value="ranged">远程</option>
              <option value="areamelee">范围近战</option>
            </select>
          </label>
          <label class="row" id="wsAreaRadiusRow" style="display:none">
            <span>攻击范围</span>
            <input id="wsRoleAreaRadius" type="number" min="30" max="200" value="80">
          </label>
          <label class="row" id="wsAreaDamageRow" style="display:none">
            <span>范围伤害</span>
            <input id="wsRoleAreaDamage" type="number" min="5" max="100" value="20">
          </label>
          <label class="row">
            <span>速度</span>
            <input id="wsRoleSpeed" type="number" min="1" max="8" step="0.1" value="2.8">
          </label>
          <label class="row">
            <span>伤害</span>
            <input id="wsRoleDamage" type="number" min="5" max="100" value="24">
          </label>
          <label class="row">
            <span>冷却</span>

  /* ──────────── 角色库持久化 ──────────── */

  function normalizeRole(role) {
    return {
      ...role,
      speed: role.speed || BALL_SPEED,
      moveSpeed: role.moveSpeed || role.speed || BALL_SPEED,
      attackType: role.attackType || "melee",
      specialSkill: role.specialSkill || "",
      projectileSpeed: role.projectileSpeed || 8,
      projectileRadius: role.projectileRadius || 5,
      aimDuration: role.aimDuration || 36,
      maxProjectileDistance: role.maxProjectileDistance || 520,
      skills: role.skills || [null, null, null],
      areaRadius: role.areaRadius || 80,
      areaDamage: role.areaDamage || 20
    };
  }

  function createDefaultRoleLibrary() {
    return Object.entries(ROLE_PRESETS).map(([id, preset]) => normalizeRole({
      id,
      name: preset.label,
      hp: preset.hp,
      radius: preset.radius,
      speed: preset.speed || BALL_SPEED,

      maxProjectileDistance: preset.maxProjectileDistance || 520,
      color: preset.color,
      imageDataUrl: "",
      image: null,
      builtin: true,
      skills: [null, null, null],
      areaRadius: 80,
      areaDamage: 20
    }));
  }

  function createImageFromDataUrl(imageDataUrl) {
    if (!imageDataUrl) return null;
    const img = new Image();
    img.src = imageDataUrl;
    return img;
  }

  function loadRoleLibrary() {
    const defaults = createDefaultRoleLibrary();
    try {
      const raw = localStorage.getItem(ROLE_LIBRARY_STORAGE_KEY);
      if (!raw) return defaults;
      const saved = JSON.parse(raw);
      const customs = saved
        .filter(r => !r.builtin)
        .map(r => normalizeRole({ ...r, image: createImageFromDataUrl(r.imageDataUrl || "") }));
      return [...defaults, ...customs];
    } catch {
      return defaults;
    }
  }

  function saveRoleLibrary() {
    const data = roleLibrary.map(({ image, ...serializable }) => serializable);
    localStorage.setItem(ROLE_LIBRARY_STORAGE_KEY, JSON.stringify(data));
  }

  function getRoleById(roleId) {
    return roleLibrary.find(role => role.id === roleId);
  }

  function createDefaultMapLibrary() {

      builtin: true,
      bgColor: preset.bgColor,

  function saveMapLibrary() {

  /* ──────────── UI 渲染 ──────────── */

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));
  }

  function roleAvatarStyle(role) {
    if (role.imageDataUrl) {
      return `background-image:url('${role.imageDataUrl.replace(/'/g, "%27")}')`;
    }
    return `background:${role.color}`;
  }

  function renderRoleCard(role) {
    const picked = [
      selectedRoleIds.a === role.id ? '<span class="role-picked">A</span>' : "",
      selectedRoleIds.b === role.id ? '<span class="role-picked">B</span>' : ""
    ].join("");
    const selectedClass = selectedRoleIds.a === role.id || selectedRoleIds.b === role.id ? " is-selected" : "";

    return `
      <div class="role-card${selectedClass}">
        <div class="role-avatar" style="${roleAvatarStyle(role)}"></div>
        <div class="role-info">
          <b>${escapeHtml(role.name)}</b>
          <span>${role.attackType === "ranged" ? "远程" : "碰撞"}</span>

  /* ──────────── 地图库渲染 ──────────── */

  function drawMapPreview(canvas, map) {
    const pctx = canvas.getContext("2d");
    const size = 120;
    const scale = size / 800;
    canvas.width = size;
    canvas.height = size;

    pctx.clearRect(0, 0, size, size);
    pctx.fillStyle = map.bgColor || "#0b8ed8";
    pctx.fillRect(0, 0, size, size);

    pctx.fillStyle = "#05070d";
    for (const wall of map.walls) {
      pctx.fillRect(wall.x * scale, wall.y * scale, wall.w * scale, wall.h * scale);
    }
  }

  function renderMapCard(map) {
    const selected = currentMapId === map.id ? " is-selected" : "";
    const picked = currentMapId === map.id ? '<span class="map-picked">已选</span>' : "";
    return `
      <div class="map-card${selected}" data-map-id="${map.id}">
        <canvas class="map-preview" data-map-preview="${map.id}"></canvas>
        <div class="map-info">
          <b>${escapeHtml(map.name)}</b>
          ${picked}
        </div>
        <div class="map-card-actions">
          <button data-action="edit-map" data-map-id="${map.id}">编辑</button>
          <button class="secondary" data-action="delete-map" data-map-id="${map.id}" ${map.builtin ? "disabled" : ""}>删除</button>
        </div>
      </div>
    `;
  }

    ui.mapLibraryList.innerHTML = mapLibrary.map(map => renderMapCard(map)).join("");

      for (const map of mapLibrary) {
        const canvas = document.querySelector(`[data-map-preview="${map.id}"]`);
        if (canvas) drawMapPreview(canvas, map);

  /* ──────────── 角色应用 ──────────── */

  function applyRoleToSide(side, roleId) {
    const role = getRoleById(roleId);
    if (!role) return;

    if (battleState === "running") {
      battleState = "paused";
      message = "已暂停，角色已切换";
    }

    selectedRoleIds[side] = roleId;
    const fighter = side === "a" ? fighters[0] : fighters[1];
    const oldMaxHp = fighter.maxHp || role.hp;

    fighter.name = "角色 " + side.toUpperCase() + " · " + role.name;
    fighter.color = role.color;
    fighter.maxHp = role.hp;
    fighter.radius = role.radius;
    fighter.speed = role.speed || BALL_SPEED;
    fighter.baseMoveSpeed = role.moveSpeed || role.speed || BALL_SPEED;
    fighter.moveSpeed = fighter.baseMoveSpeed;
    fighter.damage = role.damage;
    fighter.hitCooldown = role.hitCooldown;
    fighter.attackType = role.attackType || "melee";
    fighter.specialSkill = role.specialSkill || "";
    fighter.projectileSpeed = role.projectileSpeed || 8;
    fighter.projectileRadius = role.projectileRadius || 5;
    fighter.aimDuration = role.aimDuration || 36;
    fighter.maxProjectileDistance = role.maxProjectileDistance || 520;
    fighter.attackCooldown = 0;
    fighter.aimTimer = 0;
    fighter.aimDirection = null;
    fighter.aimTargetId = null;
    fighter.assassinTrackingActive = false;
    fighter.assassinTrackingLock = 0;
    fighter.image = role.image || null;
    fighter.areaRadius = role.areaRadius || 80;
    fighter.areaDamage = role.areaDamage || 20;
    fighter.skills = initFighterSkills(role.skills || [null, null, null]);

    if (battleState === "ready") {
      fighter.hp = role.hp;
    } else {
      const ratio = oldMaxHp > 0 ? fighter.hp / oldMaxHp : 1;
      fighter.hp = Math.min(role.hp, Math.max(1, Math.round(ratio * role.hp)));
    }

  /* ──────────── 技能系统 ──────────── */

  function initFighterSkills(skillIds) {
    return skillIds.map(skillId => {
      if (!skillId) return null;
      return {
        skillId,
        cooldownTimer: 0,
        periodicTimer: 0,
        active: true,
        buffs: {
          speed: { multiplier: 1, remaining: 0 },
          damage: { multiplier: 1, remaining: 0 },
          shield: 0
        }
      };
    });
  }

  function updateFighterSkills(fighter) {
    if (!fighter.skills || fighter.hp <= 0) return;

    for (let i = 0; i < fighter.skills.length; i++) {
      const slot = fighter.skills[i];
      if (!slot || !slot.active) continue;

      const skill = getSkillById(slot.skillId);
      if (!skill) continue;

      if (slot.cooldownTimer > 0) {
        slot.cooldownTimer--;
      }

      if (slot.cooldownTimer > 0) continue;
      if (!checkSkillTrigger(fighter, skill, slot)) continue;

      executeSkillEffect(fighter, skill, slot);
      slot.cooldownTimer = skill.trigger.cooldown || skill.trigger.interval || 60;
    }

    updateFighterBuffs(fighter);
  }

  function checkSkillTrigger(fighter, skill, slot) {
    const trigger = skill.trigger;
    switch (trigger.type) {
      case "periodic":
        slot.periodicTimer = (slot.periodicTimer || 0) + 1;
        if (slot.periodicTimer >= trigger.interval) {
          slot.periodicTimer = 0;
          return checkHpThreshold(fighter, trigger);
        }
        return false;
      case "onCooldown":
        return checkHpThreshold(fighter, trigger);
      default:
        return false;
    }
  }

  function checkHpThreshold(fighter, trigger) {
    if (!trigger.hpThreshold || trigger.hpThreshold <= 0) return true;
    const hpRatio = fighter.hp / fighter.maxHp;
    return hpRatio <= trigger.hpThreshold;
  }

  function triggerSkillsOnHit(fighter, target) {
    if (!fighter.skills) return;
    for (const slot of fighter.skills) {
      if (!slot || !slot.active || slot.cooldownTimer > 0) continue;
      const skill = getSkillById(slot.skillId);
      if (!skill || skill.trigger.type !== "onHit") continue;
      if (!checkHpThreshold(fighter, skill.trigger)) continue;
      executeSkillEffect(fighter, skill, slot, { target });
      slot.cooldownTimer = skill.trigger.cooldown || 60;
    }
  }

  function triggerSkillsOnDamaged(fighter, source) {
    if (!fighter.skills) return;
    for (const slot of fighter.skills) {
      if (!slot || !slot.active || slot.cooldownTimer > 0) continue;
      const skill = getSkillById(slot.skillId);
      if (!skill || skill.trigger.type !== "onDamaged") continue;
      if (!checkHpThreshold(fighter, skill.trigger)) continue;
      executeSkillEffect(fighter, skill, slot, { source });
      slot.cooldownTimer = skill.trigger.cooldown || 60;
    }
  }

  function executeSkillEffect(fighter, skill, slot, context) {
    const effect = skill.effect;
    const params = skill.params || {};

    switch (effect.type) {
      case "heal":
        const healAmount = params.healAmount || 5;
        fighter.hp = Math.min(fighter.maxHp, fighter.hp + healAmount);
        addDamageText(fighter, -healAmount);
        break;
      case "buff_speed":
        slot.buffs.speed = {
          multiplier: params.speedMultiplier || 1.5,
          remaining: params.duration || 180
        };
        recalcFighterSpeed(fighter);
        break;
      case "buff_damage":
        slot.buffs.damage = {
          multiplier: params.damageMultiplier || 1.5,
          remaining: params.duration || 180
        };
        break;
      case "shield":
        slot.buffs.shield = (slot.buffs.shield || 0) + (params.shieldAmount || 20);
        break;
      case "area_melee":
        executeAreaMelee(fighter, params);
        break;
      case "summon_minion":
        executeSummonMinion(fighter, params);
        break;
    }

    message = fighter.name + " 触发 " + skill.name;
  }

  function updateFighterBuffs(fighter) {
    if (!fighter.skills) return;
    for (const slot of fighter.skills) {
      if (!slot || !slot.buffs) continue;
      if (slot.buffs.speed && slot.buffs.speed.remaining > 0) {
        slot.buffs.speed.remaining--;
        if (slot.buffs.speed.remaining <= 0) {
          slot.buffs.speed.multiplier = 1;
          recalcFighterSpeed(fighter);
        }
      }
      if (slot.buffs.damage && slot.buffs.damage.remaining > 0) {
        slot.buffs.damage.remaining--;
        if (slot.buffs.damage.remaining <= 0) {
          slot.buffs.damage.multiplier = 1;
        }
      }
    }
  }

  function getFighterDamageMultiplier(fighter) {
    if (!fighter.skills) return 1;
    let mult = 1;
    for (const slot of fighter.skills) {
      if (slot && slot.buffs && slot.buffs.damage && slot.buffs.damage.remaining > 0) {
        mult = Math.max(mult, slot.buffs.damage.multiplier);
      }
    }
    return mult;
  }

  function recalcFighterSpeed(fighter) {
    if (!fighter.skills) {
      fighter.moveSpeed = fighter.baseMoveSpeed;
      return;
    }
    let mult = 1;
    for (const slot of fighter.skills) {
      if (slot && slot.buffs && slot.buffs.speed && slot.buffs.speed.remaining > 0) {
        mult = Math.max(mult, slot.buffs.speed.multiplier);
      }
    }
    fighter.moveSpeed = (fighter.baseMoveSpeed || BALL_SPEED) * mult;
    normalizeFighterSpeed(fighter);
  }

  function applyDamageToFighter(fighter, damage) {
    if (fighter.skills) {
      for (const slot of fighter.skills) {
        if (slot && slot.buffs && slot.buffs.shield > 0) {
          const absorbed = Math.min(slot.buffs.shield, damage);
          slot.buffs.shield -= absorbed;
          damage -= absorbed;
          if (damage <= 0) return 0;
        }
      }
    }
    fighter.hp = Math.max(0, fighter.hp - damage);
    return damage;
  }

  /* ──────────── 范围近战 ──────────── */

  function findEnemiesOf(fighter) {
    const enemies = [];
    for (const f of fighters) {
      if (f.id !== fighter.id && f.hp > 0) enemies.push(f);
    }
    for (const m of minions) {
      if (m.ownerId !== fighter.id && m.hp > 0) enemies.push(m);
    }
    return enemies;
  }

  function executeAreaMelee(fighter, params) {
    const radius = params.radius || fighter.areaRadius || 80;
    const baseDamage = params.damage || fighter.areaDamage || fighter.damage;
    const damageMult = getFighterDamageMultiplier(fighter);
    const damage = Math.max(1, Math.round(baseDamage * damageMult));
    const enemies = findEnemiesOf(fighter);

    for (const enemy of enemies) {
      if (enemy.hp <= 0) continue;
      const dx = enemy.x - fighter.x;
      const dy = enemy.y - fighter.y;
      const dist = Math.hypot(dx, dy);
      const hitDist = radius + enemy.radius;

      if (dist <= hitDist) {
        if (enemy.invincible <= 0) {
          applyDamageToFighter(enemy, damage);
          enemy.invincible = enemy.hitCooldown || 20;
          addDamageText(enemy, damage);
          triggerSkillsOnDamaged(enemy, fighter);
        }
        if (dist > 0) {
          const knockback = 8;
          enemy.vx += (dx / dist) * knockback;
          enemy.vy += (dy / dist) * knockback;
        }
      }
    }

    addAreaMeleeEffect(fighter.x, fighter.y, radius, fighter.color);
    hitCount++;
    checkBattleResult();
    updateStats();
  }

  function addAreaMeleeEffect(x, y, radius, color) {
    shockwaves.push({ x, y, radius, maxRadius: radius, life: 20, maxLife: 20, color });
    for (let i = 0; i < 16; i++) {
      const angle = (i / 16) * Math.PI * 2;
      particles.push({
        x: x + Math.cos(angle) * radius * 0.3,
        y: y + Math.sin(angle) * radius * 0.3,
        vx: Math.cos(angle) * 4,
        vy: Math.sin(angle) * 4,
        life: 24
      });
    }
  }

  function updateAreaMeleeAttack(attacker) {
    if (attacker.attackType !== "areamelee") return;
    if (attacker.hp <= 0 || battleState !== "running") return;
    if (attacker.attackCooldown > 0) return;

    executeAreaMelee(attacker, { radius: attacker.areaRadius, damage: attacker.areaDamage });
    attacker.attackCooldown = attacker.hitCooldown;
  }

  function drawShockwaves() {
    shockwaves = shockwaves.filter(sw => {
      sw.life--;
      if (sw.life <= 0) return false;

      const progress = 1 - sw.life / sw.maxLife;
      const currentRadius = sw.maxRadius * (0.3 + progress * 0.7);

      ctx.save();
      ctx.globalAlpha = (1 - progress) * 0.6;
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, currentRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      return true;
    });
  }

  /* ──────────── 分身系统 ──────────── */

  function executeSummonMinion(fighter, params) {
    const ownerMinions = minions.filter(m => m.ownerId === fighter.id);
    const maxMinions = params.maxMinions || 3;
    if (ownerMinions.length >= maxMinions) {
      ownerMinions[0].lifeTime = 1;
    }

    const angle = Math.random() * Math.PI * 2;
    const minionRadius = params.radius || Math.max(12, fighter.radius * 0.6);
    const spawnDist = fighter.radius + minionRadius + 8;
    const spawnX = fighter.x + Math.cos(angle) * spawnDist;
    const spawnY = fighter.y + Math.sin(angle) * spawnDist;

    const minion = {
      id: "minion_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
      ownerId: fighter.id,
      name: params.name || "分身",
      x: spawnX,
      y: spawnY,
      vx: 0,
      vy: 0,
      radius: minionRadius,
      hp: params.hp || Math.round(fighter.maxHp * 0.2),
      maxHp: params.hp || Math.round(fighter.maxHp * 0.2),
      lifeTime: params.lifeTime || 600,
      maxLifeTime: params.lifeTime || 600,
      damage: params.damage || Math.round(fighter.damage * 0.3),
      speed: params.speed || (fighter.baseMoveSpeed || BALL_SPEED) * 0.8,
      attackType: params.attackType || "melee",
      hitCooldown: params.hitCooldown || 20,
      attackCooldown: 0,
      invincible: 0,
      behavior: params.behavior || "chase",
      orbitRadius: params.orbitRadius || 60,
      orbitSpeed: params.orbitSpeed || 0.03,
      orbitAngle: Math.random() * Math.PI * 2,
      color: fighter.color,
      image: fighter.image,
      aimTimer: 0,
      aimDirection: null,
      projectileSpeed: params.projectileSpeed || 6,
      projectileRadius: params.projectileRadius || 4,
      aimDuration: params.aimDuration || 40,
      maxProjectileDistance: params.maxProjectileDistance || 350
    };

    const v = randomVelocity(minion.speed);
    minion.vx = v.vx;
    minion.vy = v.vy;

    minions.push(minion);
    message = fighter.name + " 召唤了分身";
  }

  function updateMinions() {
    minions = minions.filter(minion => {
      if (minion.lifeTime > 0) {
        minion.lifeTime--;
        if (minion.lifeTime <= 0) {
          addHitParticles(minion.x, minion.y);
          return false;
        }
      }

      if (minion.hp !== undefined && minion.hp <= 0) {
        addHitParticles(minion.x, minion.y);
        return false;
      }

      const owner = fighters.find(f => f.id === minion.ownerId);
      const enemies = findEnemiesOf(owner || minion);
      const target = enemies.find(e => e.hp > 0);

      switch (minion.behavior) {
        case "chase":
          updateMinionChase(minion, target);
          break;
        case "orbit":
          updateMinionOrbit(minion, owner);
          break;
        case "stationary":
          minion.vx *= 0.9;
          minion.vy *= 0.9;
          break;
        case "patrol":
          if (Math.random() < 0.02) {
            const v = randomVelocity(minion.speed);
            minion.vx = v.vx;
            minion.vy = v.vy;
          }
          break;
      }

      updateBall(minion);

      if (minion.attackType === "ranged" && target) {
        updateRangedAiming(minion, target);
      }

      if (minion.attackCooldown > 0) minion.attackCooldown--;
      if (minion.invincible > 0) minion.invincible--;

      return true;
    });
  }

  function updateMinionChase(minion, target) {
    if (!target || target.hp <= 0) {
      minion.vx *= 0.95;
      minion.vy *= 0.95;
      return;
    }
    const dx = target.x - minion.x;
    const dy = target.y - minion.y;
    const dist = Math.hypot(dx, dy);
    if (dist <= 0) return;
    minion.vx = (dx / dist) * minion.speed;
    minion.vy = (dy / dist) * minion.speed;
  }

  function updateMinionOrbit(minion, owner) {
    if (!owner) return;
    minion.orbitAngle += minion.orbitSpeed;
    const targetX = owner.x + Math.cos(minion.orbitAngle) * minion.orbitRadius;
    const targetY = owner.y + Math.sin(minion.orbitAngle) * minion.orbitRadius;
    const dx = targetX - minion.x;
    const dy = targetY - minion.y;
    const dist = Math.hypot(dx, dy);
    if (dist <= 0) return;
    const moveSpeed = Math.min(minion.speed, dist);
    minion.vx = (dx / dist) * moveSpeed;
    minion.vy = (dy / dist) * moveSpeed;
  }

  function resolveMinionMeleeDamage(minion, fighter) {
    if (battleState !== "running" || minion.hp <= 0 || fighter.hp <= 0) return;
    if (fighter.invincible > 0) return;

    const damage = Math.max(1, Math.round(minion.damage));
    applyDamageToFighter(fighter, damage);
    fighter.invincible = fighter.hitCooldown;
    addDamageText(fighter, damage);
    triggerSkillsOnDamaged(fighter, minion);

    hitCount++;
    checkBattleResult();
    updateStats();
  }

  function drawMinion(minion) {
    ctx.save();
    ctx.globalAlpha = minion.invincible > 0 && minion.invincible % 6 < 3 ? 0.6 : 0.85;

    if (minion.image) {
      drawRoundImage(minion.image, minion.x, minion.y, minion.radius);
    } else {
      ctx.fillStyle = minion.color;
      ctx.beginPath();
      ctx.arc(minion.x, minion.y, minion.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#05070d";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(minion.x, minion.y, minion.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawMinionHealthBar(minion) {
    if (!minion.maxHp || minion.maxHp <= 0) return;
    const width = Math.max(40, minion.radius * 2);
    const height = 6;
    const x = minion.x - width / 2;
    const y = minion.y - minion.radius - 18;
    const ratio = Math.max(0, minion.hp / minion.maxHp);

    ctx.fillStyle = "rgba(5, 7, 13, .7)";
    ctx.fillRect(x, y, width, height);
    ctx.fillStyle = ratio > .45 ? "#47d18c" : ratio > .2 ? "#ffd166" : "#ff4d6d";
    ctx.fillRect(x, y, width * ratio, height);
  }

  /* ──────────── 关卡生成 ──────────── */

  function makeLevel() {
    loadMap(currentMapId);
  }

  function randomVelocity(speed) {
    const angle = Math.random() * Math.PI * 2;
    return {
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed
    };
  }

  /* ──────────── 游戏流程 ──────────── */

  function prepareGame() {
    makeLevel();
    fighters[0].x = 230;
    fighters[0].y = 400;
    fighters[1].x = 570;
    fighters[1].y = 400;

    for (const fighter of fighters) {
      fighter.hp = fighter.maxHp;
      fighter.invincible = 0;
      fighter.attackCooldown = 0;
      fighter.aimTimer = 0;
      fighter.aimDirection = null;
      fighter.aimTargetId = null;
      fighter.assassinTrackingActive = false;
      fighter.assassinTrackingLock = 0;
      fighter.moveSpeed = fighter.baseMoveSpeed || fighter.speed || BALL_SPEED;
      fighter.vx = 0;
      fighter.vy = 0;
    }

    hitCount = 0;
    projectiles = [];
    particles = [];
    damageTexts = [];
    minions = [];
    shockwaves = [];
    winner = null;
    battleState = "ready";
    message = "请选择角色并点击开始";
    updateStats();
  }

  function startBattle() {
    if (battleState === "running") {
      battleState = "paused";
      message = "已暂停";
      updateStats();
      return;
    }
    if (battleState === "paused") {
      battleState = "running";
      message = "继续对战";
      updateStats();
      return;
    }
    if (battleState === "ended") {
      prepareGame();
    }

    applyRoleToSide("a", selectedRoleIds.a);
    applyRoleToSide("b", selectedRoleIds.b);

    for (const fighter of fighters) {
      const velocity = randomVelocity(fighter.moveSpeed || BALL_SPEED);
      fighter.vx = velocity.vx;
      fighter.vy = velocity.vy;
      fighter.invincible = 0;
      fighter.attackCooldown = 0;
      fighter.aimTimer = 0;
      fighter.aimDirection = null;
      fighter.aimTargetId = null;
      fighter.assassinTrackingActive = false;
      fighter.assassinTrackingLock = 0;
    }

    projectiles = [];
    winner = null;
    battleState = "running";
    message = "自动对战开始";
    updateStats();
  }

  function readImageFile(input, callback) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const imageDataUrl = reader.result;
      const img = new Image();
      img.onload = () => callback({ imageDataUrl, image: img });
      img.src = imageDataUrl;
    };
    reader.readAsDataURL(file);
  }

  /* ──────────── 碰撞检测 ──────────── */

  function circleRectCollision(circle, radius, rect) {
    const nearX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
    const nearY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
    const dx = circle.x - nearX;
    const dy = circle.y - nearY;
    return dx * dx + dy * dy < radius * radius;
  }

  function resolveWallCollision(ball, radius, rect) {
    const nearestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.w));
    const nearestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.h));
    let nx = ball.x - nearestX;
    let ny = ball.y - nearestY;
    let distance = Math.hypot(nx, ny);

    if (distance === 0) {
      const left = Math.abs(ball.x - rect.x);
      const right = Math.abs(ball.x - (rect.x + rect.w));
      const top = Math.abs(ball.y - rect.y);
      const bottom = Math.abs(ball.y - (rect.y + rect.h));
      const min = Math.min(left, right, top, bottom);
      if (min === left) {
        nx = -1;
        ny = 0;
      } else if (min === right) {
        nx = 1;
        ny = 0;
      } else if (min === top) {
        nx = 0;
        ny = -1;
      } else {
        nx = 0;
        ny = 1;
      }
      distance = 1;
    }

    nx /= distance;
    ny /= distance;
    const overlap = radius - distance + 1;
    ball.x += nx * overlap;
    ball.y += ny * overlap;

    const dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0) {
      ball.vx = ball.vx - 2 * dot * nx;
      ball.vy = ball.vy - 2 * dot * ny;
      triggerAssassinTracking(ball);
    }
  }

  function updateBall(ball) {
    updateAssassinTracking(ball);
    ball.x += ball.vx;
    ball.y += ball.vy;

    for (const wall of walls) {
      if (circleRectCollision(ball, ball.radius, wall)) {
        resolveWallCollision(ball, ball.radius, wall);
      }
    }

    if (ball.invincible > 0) {
      ball.invincible--;
    }
    if (ball.attackCooldown > 0) {
      ball.attackCooldown--;
    }
    if (ball.assassinTrackingLock > 0) {
      ball.assassinTrackingLock--;
    }
  }

  function resolveBallCollision(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    let dist = Math.hypot(dx, dy);
    const minDist = a.radius + b.radius;
    if (dist >= minDist) return false;

    let nx = dx / (dist || 1);
    let ny = dy / (dist || 1);
    if (dist === 0) {
      nx = 1;
      ny = 0;
      dist = 1;
    }

    const overlap = minDist - dist + 1;
    a.x -= nx * overlap / 2;
    a.y -= ny * overlap / 2;
    b.x += nx * overlap / 2;
    b.y += ny * overlap / 2;

    const avn = a.vx * nx + a.vy * ny;
    const bvn = b.vx * nx + b.vy * ny;
    const impulse = bvn - avn;
    a.vx += impulse * nx;
    a.vy += impulse * ny;
    b.vx -= impulse * nx;
    b.vy -= impulse * ny;
    normalizeFighterSpeed(a);
    normalizeFighterSpeed(b);
    triggerAssassinTracking(a, b);
    triggerAssassinTracking(b, a);
    return true;
  }

  function triggerAssassinTracking(fighter, target = null) {
    if (fighter.specialSkill !== "assassinTracking" || fighter.hp <= 0 || battleState !== "running") return;
    if (fighter.assassinTrackingLock > 0) return;

    fighter.assassinTrackingActive = true;
    updateAssassinTracking(fighter, target);
    message = fighter.name + " 反弹追踪";
  }

  function updateAssassinTracking(fighter, target = null) {
    if (!fighter.assassinTrackingActive || fighter.specialSkill !== "assassinTracking" || fighter.hp <= 0 || battleState !== "running") return;

    const enemy = target || fighters.find(other => other.id !== fighter.id && other.hp > 0);
    if (!enemy || enemy.hp <= 0) return;

    const dx = enemy.x - fighter.x;
    const dy = enemy.y - fighter.y;
    const dist = Math.hypot(dx, dy);
    if (dist <= 0) return;

    const speed = fighter.moveSpeed || fighter.baseMoveSpeed || fighter.speed || BALL_SPEED;
    fighter.vx = dx / dist * speed;
    fighter.vy = dy / dist * speed;
  }

  function endAssassinTracking(fighter) {
    if (fighter.specialSkill !== "assassinTracking") return;
    fighter.assassinTrackingActive = false;
    fighter.assassinTrackingLock = Math.max(fighter.assassinTrackingLock || 0, fighter.hitCooldown || 20);
  }

  function normalizeFighterSpeed(fighter) {
    if (fighter.hp <= 0) return;

    const currentSpeed = Math.hypot(fighter.vx, fighter.vy);
    const targetSpeed = fighter.moveSpeed || BALL_SPEED;
    if (currentSpeed <= 0 || targetSpeed <= 0) return;

    const scale = targetSpeed / currentSpeed;
    fighter.vx *= scale;
    fighter.vy *= scale;
  }

  function resolveMeleeCollisionDamage(a, b) {
    if (battleState !== "running" || a.hp <= 0 || b.hp <= 0) return;

    const aCanDamage = a.attackType === "melee" && a.invincible <= 0;
    const bCanDamage = b.attackType === "melee" && b.invincible <= 0;
    if (!aCanDamage && !bCanDamage) return;

    const relativeSpeed = Math.hypot(a.vx - b.vx, a.vy - b.vy);
    const speedFactor = Math.max(0.5, relativeSpeed / 8);
    let damageToA = 0;
    let damageToB = 0;

    if (bCanDamage) damageToA = Math.max(1, Math.round(b.damage * speedFactor));
    if (aCanDamage) damageToB = Math.max(1, Math.round(a.damage * speedFactor));

    if (damageToA > 0) {
      applyDamageToFighter(a, damageToA);
      addDamageText(a, damageToA);
      endAssassinTracking(b);
      triggerSkillsOnHit(b, a);
      triggerSkillsOnDamaged(a, b);
    }

    if (damageToB > 0) {
      applyDamageToFighter(b, damageToB);
      addDamageText(b, damageToB);
      endAssassinTracking(a);
      triggerSkillsOnHit(a, b);
      triggerSkillsOnDamaged(b, a);
    }

    if (aCanDamage) {
      a.invincible = a.hitCooldown;
      growMeleeFighter(a);
    }
    if (bCanDamage) {
      b.invincible = b.hitCooldown;
      growMeleeFighter(b);
    }

    hitCount++;
    message = "近战碰撞命中，力量提升";
    addHitParticles((a.x + b.x) / 2, (a.y + b.y) / 2);
    checkBattleResult();
    updateStats();
  }

  function growMeleeFighter(fighter) {
    if (fighter.attackType !== "melee") return;

    const baseSpeed = fighter.baseMoveSpeed || fighter.speed || BALL_SPEED;
    const maxSpeed = baseSpeed * 2.2;
    fighter.moveSpeed = Math.min(maxSpeed, (fighter.moveSpeed || baseSpeed) * 1.08);
    normalizeFighterSpeed(fighter);

    fighter.damage = Math.min(90, Math.round(fighter.damage * 1.1));
  }

  function updateRangedAiming(attacker, target) {
    if (attacker.attackType !== "ranged") return;
    if (attacker.hp <= 0 || target.hp <= 0 || battleState !== "running") return;
    if (attacker.attackCooldown > 0) return;

    const dx = target.x - attacker.x;
    const dy = target.y - attacker.y;
    const dist = Math.hypot(dx, dy);
    if (dist <= 0) return;

    attacker.aimDirection = { x: dx / dist, y: dy / dist };
    attacker.aimTargetId = target.id;

    if (attacker.aimTimer <= 0) {
      attacker.aimTimer = attacker.aimDuration || 36;
      message = attacker.name + " 正在瞄准";
      return;
    }

    attacker.aimTimer--;
    if (attacker.aimTimer <= 0) {
      fireAimedProjectile(attacker);
      attacker.attackCooldown = attacker.hitCooldown;
      attacker.aimDirection = null;
      attacker.aimTargetId = null;
    }
  }

  function fireAimedProjectile(attacker) {
    const dir = attacker.aimDirection;
    if (!dir) return;

    const speed = attacker.projectileSpeed || 8;
    const radius = attacker.projectileRadius || 5;

    projectiles.push({
      ownerId: attacker.id,
      x: attacker.x + dir.x * (attacker.radius + radius + 2),
      y: attacker.y + dir.y * (attacker.radius + radius + 2),
      vx: dir.x * speed,
      vy: dir.y * speed,
      radius,
      damage: attacker.damage,
      distanceLeft: attacker.maxProjectileDistance || 520,
      color: attacker.color
    });

    message = attacker.name + " 发射箭矢";
  }

  function updateProjectiles() {
    projectiles = projectiles.filter(projectile => {
      projectile.x += projectile.vx;
      projectile.y += projectile.vy;

      const step = Math.hypot(projectile.vx, projectile.vy);
      projectile.distanceLeft -= step;
      if (projectile.distanceLeft <= 0) return false;
      if (projectile.x < 0 || projectile.x > canvas.width || projectile.y < 0 || projectile.y > canvas.height) return false;

      for (const wall of walls) {
        if (circleRectCollision(projectile, projectile.radius, wall)) {
          return false;
        }
      }

      const target = fighters.find(fighter => fighter.id !== projectile.ownerId && fighter.hp > 0);
      if (!target) return false;

      const dx = target.x - projectile.x;
      const dy = target.y - projectile.y;
      const hitDist = target.radius + projectile.radius;
      if (dx * dx + dy * dy <= hitDist * hitDist) {
        applyProjectileDamage(projectile, target);
        return false;
      }

      return true;
    });
  }

  function applyProjectileDamage(projectile, target) {
    if (target.invincible > 0 || battleState !== "running") return;

    const damage = Math.max(1, Math.round(projectile.damage));
    applyDamageToFighter(target, damage);
    target.invincible = target.hitCooldown;
    hitCount++;
    message = "远程命中！";

    addDamageText(target, damage);
    addHitParticles(projectile.x, projectile.y);
    triggerSkillsOnDamaged(target, projectile);
    checkBattleResult();
    updateStats();
  }

  function addDamageText(fighter, damage) {
    damageTexts.push({
      x: fighter.x,
      y: fighter.y - fighter.radius - 12,
      text: "-" + damage,
      color: fighter.color,
      life: 46
    });
  }

  function addHitParticles(x, y) {
    for (let i = 0; i < 10; i++) {
      particles.push({
        x,
        y,
        vx: (Math.random() - .5) * 7,
        vy: (Math.random() - .5) * 7,
        life: 24
      });
    }
  }

  function checkBattleResult() {
    const alive = fighters.filter(fighter => fighter.hp > 0);
    if (alive.length === 1) {
      battleState = "ended";
      winner = alive[0];
      message = winner.name + " 胜利";
      stopFighters();
    } else if (alive.length === 0) {
      battleState = "ended";
      winner = null;
      message = "平局";
      stopFighters();
    }
  }

  function stopFighters() {
    for (const fighter of fighters) {
      fighter.vx = 0;
      fighter.vy = 0;
    }
  }

  /* ──────────── 状态与渲染 ──────────── */

  function updateStats() {
    ui.startBattle.textContent =
      battleState === "ended" ? "再战一局" :
      battleState === "paused" ? "继续对战" :
      battleState === "running" ? "暂停" :
      "开始对战";
  }

  function update() {
    if (battleState !== "running") {
      return;
    }

    for (const fighter of fighters) {
      updateBall(fighter);
      updateFighterSkills(fighter);
    }
    const didCollide = resolveBallCollision(fighters[0], fighters[1]);
    if (didCollide) {
      resolveMeleeCollisionDamage(fighters[0], fighters[1]);
    }
    updateRangedAiming(fighters[0], fighters[1]);
    updateRangedAiming(fighters[1], fighters[0]);
    updateAreaMeleeAttack(fighters[0]);
    updateAreaMeleeAttack(fighters[1]);
    updateProjectiles();

    // 分身更新
    updateMinions();

    // 分身与主角色碰撞
    for (const minion of minions) {
      for (const fighter of fighters) {
        if (fighter.hp <= 0) continue;
        if (minion.ownerId === fighter.id) continue;
        const didCollide2 = resolveBallCollision(minion, fighter);
        if (didCollide2 && minion.attackType === "melee") {
          resolveMinionMeleeDamage(minion, fighter);
        }
      }
    }

    // 分身之间碰撞
    for (let i = 0; i < minions.length; i++) {
      for (let j = i + 1; j < minions.length; j++) {
        if (minions[i].ownerId === minions[j].ownerId) continue;
        resolveBallCollision(minions[i], minions[j]);
      }
    }

    // 弹幕与分身碰撞
    for (const projectile of projectiles) {
      for (const minion of minions) {
        if (minion.hp <= 0) continue;
        if (projectile.ownerId === minion.ownerId) continue;
        const dx = minion.x - projectile.x;
        const dy = minion.y - projectile.y;
        const hitDist = minion.radius + projectile.radius;
        if (dx * dx + dy * dy <= hitDist * hitDist) {
          if (minion.invincible <= 0) {
            applyDamageToFighter(minion, projectile.damage);
            minion.invincible = minion.hitCooldown;
            addDamageText(minion, projectile.damage);
          }
          projectile.distanceLeft = 0;
          break;
        }
      }
    }

    particles = particles.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= .92;
      p.vy *= .92;
      p.life--;
      return p.life > 0;
    });

    damageTexts = damageTexts.filter(d => {
      d.y -= 0.8;
      d.life--;
      return d.life > 0;
    });
  }

  function drawRoundImage(img, x, y, r) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
    ctx.restore();
  }

  function drawFighter(fighter) {
    ctx.save();
    ctx.globalAlpha = fighter.invincible > 0 && fighter.invincible % 6 < 3 ? 0.72 : 1;

    if (fighter.image) {
      drawRoundImage(fighter.image, fighter.x, fighter.y, fighter.radius);
    } else {
      ctx.fillStyle = fighter.color;
      ctx.beginPath();
      ctx.arc(fighter.x, fighter.y, fighter.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(5, 7, 13, .75)";
      ctx.beginPath();
      ctx.arc(fighter.x - fighter.radius * .28, fighter.y - fighter.radius * .18, fighter.radius * .12, 0, Math.PI * 2);
      ctx.arc(fighter.x + fighter.radius * .28, fighter.y - fighter.radius * .18, fighter.radius * .12, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(5, 7, 13, .7)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(fighter.x, fighter.y + fighter.radius * .15, fighter.radius * .32, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#05070d";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(fighter.x, fighter.y, fighter.radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "rgba(5, 7, 13, .72)";
    ctx.beginPath();
    ctx.arc(fighter.x + fighter.radius * .56, fighter.y + fighter.radius * .56, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#eef4ff";
    ctx.font = "800 13px Inter, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(fighter.id.toUpperCase(), fighter.x + fighter.radius * .56, fighter.y + fighter.radius * .56 + 5);
    ctx.restore();
  }

  function drawHealthBar(fighter) {
    const width = Math.max(70, fighter.radius * 2.25);
    const height = 10;
    const x = fighter.x - width / 2;
    const y = fighter.y - fighter.radius - 30;
    const ratio = Math.max(0, fighter.hp / fighter.maxHp);

    ctx.fillStyle = "rgba(5, 7, 13, .8)";
    ctx.fillRect(x, y, width, height);
    ctx.fillStyle = ratio > .45 ? "#47d18c" : ratio > .2 ? "#ffd166" : "#ff4d6d";
    ctx.fillRect(x, y, width * ratio, height);
    ctx.strokeStyle = "#05070d";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, width, height);

    ctx.fillStyle = "#eef4ff";
    ctx.font = "700 16px ui-monospace, Consolas, monospace";
    ctx.textAlign = "center";
    ctx.fillText(Math.ceil(fighter.hp), fighter.x, y - 6);
  }

  function drawAimPreview(fighter) {
    if (fighter.attackType !== "ranged") return;
    if (!fighter.aimDirection || fighter.aimTimer <= 0 || fighter.hp <= 0) return;

    const maxLen = fighter.maxProjectileDistance || 520;
    const startX = fighter.x + fighter.aimDirection.x * fighter.radius;
    const startY = fighter.y + fighter.aimDirection.y * fighter.radius;
    const endX = startX + fighter.aimDirection.x * maxLen;
    const endY = startY + fighter.aimDirection.y * maxLen;
    const progress = 1 - fighter.aimTimer / (fighter.aimDuration || 36);

    ctx.save();
    ctx.strokeStyle = fighter.color;
    ctx.globalAlpha = 0.25 + progress * 0.45;
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = fighter.color;
    ctx.beginPath();
    ctx.arc(startX, startY, 4 + progress * 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const currentMap = getMapById(currentMapId);
    if (mapBgImage) {
      ctx.drawImage(mapBgImage, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.fillStyle = currentMap?.bgColor || "#0b8ed8";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.fillStyle = "rgba(255,255,255,.035)";
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.fillRect(x, 0, 1, canvas.height);
      ctx.fillRect(0, x, canvas.width, 1);
    }

    ctx.fillStyle = "#05070d";
    for (const wall of walls) {
      ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    }

    for (const fighter of fighters) {
      if (fighter.hp > 0) {
        drawFighter(fighter);
        drawHealthBar(fighter);
      }
    }

    // 渲染分身
    for (const minion of minions) {
      if (minion.hp > 0 || minion.hp === undefined) {
        drawMinion(minion);
        drawMinionHealthBar(minion);
      }
    }

    for (const fighter of fighters) {
      drawAimPreview(fighter);
    }

    // 渲染冲击波
    drawShockwaves();

    for (const projectile of projectiles) {
      ctx.save();
      ctx.strokeStyle = projectile.color;
      ctx.fillStyle = projectile.color;
      ctx.lineWidth = 3;

      const angle = Math.atan2(projectile.vy, projectile.vx);
      const len = 18;

      ctx.beginPath();
      ctx.moveTo(projectile.x - Math.cos(angle) * len * 0.5, projectile.y - Math.sin(angle) * len * 0.5);
      ctx.lineTo(projectile.x + Math.cos(angle) * len * 0.5, projectile.y + Math.sin(angle) * len * 0.5);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const p of particles) {
      ctx.globalAlpha = p.life / 24;
      ctx.fillStyle = "#fff1a8";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (const d of damageTexts) {
      ctx.globalAlpha = d.life / 46;
      ctx.fillStyle = d.color;
      ctx.font = "800 24px ui-monospace, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText(d.text, d.x, d.y);
      ctx.globalAlpha = 1;
    }

    if (battleHintEnabled) {
      const hintX = 24;
      const hintY = canvas.height - 68;
      ctx.fillStyle = "rgba(5, 7, 13, .72)";
      ctx.fillRect(hintX, hintY, 260, 44);
      ctx.fillStyle = "#eef4ff";
      ctx.font = "700 18px Inter, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(message, hintX + 18, hintY + 28);
    }

    if (battleState === "ended") {
      ctx.fillStyle = "rgba(5, 7, 13, .82)";
      ctx.fillRect(250, 360, 300, 80);
      ctx.strokeStyle = winner ? winner.color : "#ffd166";
      ctx.lineWidth = 3;
      ctx.strokeRect(250, 360, 300, 80);
      ctx.fillStyle = "#eef4ff";
      ctx.font = "800 30px Inter, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(message, 400, 410);
    }
  }

  function loop() {
    update();
    render();
    updateStats();
    requestAnimationFrame(loop);
  }

  /* ──────────── 事件绑定 ──────────── */

  const app = document.querySelector(".app");
  const goSettings = document.getElementById("goSettings");
  const backToGame = document.getElementById("backToGame");

  function showView(view) {
    app.dataset.view = view;
  }

  function updateStageScale() {
    const shell = document.querySelector(".canvas-shell");
    if (!shell) return;

    const baseSize = 824;
    const availableWidth = Math.max(240, window.innerWidth - 48);
    const availableHeight = Math.max(240, window.innerHeight - 48);
    const scale = Math.max(0.25, Math.min(1, availableWidth / baseSize, availableHeight / baseSize));
    shell.style.setProperty("--stage-scale", scale.toFixed(4));
  }

  window.addEventListener("resize", updateStageScale);

  // 战斗参数角色选择
  ui.roleSelectA.addEventListener("change", () => applyRoleToSide("a", ui.roleSelectA.value));
  ui.roleSelectB.addEventListener("change", () => applyRoleToSide("b", ui.roleSelectB.value));

  // 角色库列表操作
  ui.roleLibraryList.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    handleRoleAction(button.dataset.action, button.dataset.roleId);
  });

  // 地图库列表操作
  ui.mapLibraryList.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    const card = event.target.closest(".map-card");
    if (button) {
      event.stopPropagation();
      handleMapAction(button.dataset.action, button.dataset.mapId);
      return;
    }
    if (card && card.dataset.mapId) {
      currentMapId = card.dataset.mapId;
      loadMap(currentMapId);
      renderMapLibraryList();
      message = "已切换地图：" + (getMapById(currentMapId)?.name || "");
    }
  });

  ui.createCustomMap.addEventListener("click", () => openMapEditPage(null));
  ui.backToMapLibrary.addEventListener("click", closeMapEditPage);
  ui.saveEditedMap.addEventListener("click", saveEditedMap);
  ui.cancelEditMap.addEventListener("click", closeMapEditPage);
  ui.deleteEditedMap.addEventListener("click", deleteEditedMap);
  ui.addWallBtn.addEventListener("click", () => {
    editingWalls.push({ x: 300, y: 300, w: 100, h: 18 });
    renderWallTable();
  });

  ui.wallTableBody.addEventListener("input", event => {
    const input = event.target.closest("input[data-wall-field]");
    if (!input) return;
    const row = input.closest("tr[data-wall-idx]");
    if (!row) return;
    const idx = Number(row.dataset.wallIdx);
    const field = input.dataset.wallField;
    if (editingWalls[idx]) {
      editingWalls[idx][field] = Number(input.value) || 0;
    }
  });

  ui.wallTableBody.addEventListener("click", event => {
    const btn = event.target.closest("button[data-action='delete-wall']");
    if (!btn) return;
    const idx = Number(btn.dataset.wallIdx);
    editingWalls.splice(idx, 1);
    renderWallTable();
  });

  ui.editMapImage.addEventListener("change", () => {
    readImageFile(ui.editMapImage, ({ imageDataUrl, image }) => {
      editMapImageDraft = { imageDataUrl, image };
    });
  });

  // 角色编辑页
  ui.editRoleImage.addEventListener("change", () => {
    readImageFile(ui.editRoleImage, ({ imageDataUrl, image }) => {
      editRoleImageDraft = { imageDataUrl, image };
    });
  });
  ui.saveEditedRole.addEventListener("click", saveEditedRole);
  ui.cancelEditRole.addEventListener("click", closeRoleEditPage);
  ui.deleteEditedRole.addEventListener("click", deleteEditedRole);
  ui.backToLibrary.addEventListener("click", closeRoleEditPage);

  // 创意工坊攻击模式切换默认值
  ui.wsAttackType.addEventListener("change", () => {
    updateAreaParamVisibility(ui.wsAttackType.value, "ws");
    if (ui.wsAttackType.value === "ranged") {
      ui.wsRoleHitCooldown.value = 120;
    } else if (ui.wsAttackType.value === "areamelee") {
      ui.wsRoleHitCooldown.value = 90;
    } else {
      ui.wsRoleHitCooldown.value = 30;
    }
  });

  // 角色编辑页攻击模式切换
  ui.editRoleAttackType.addEventListener("change", () => {
    updateAreaParamVisibility(ui.editRoleAttackType.value, "edit");
  });

  // 创意工坊创建角色
  let wsImageDraft = { imageDataUrl: "", image: null };

  ui.wsRoleImage.addEventListener("change", () => {
    readImageFile(ui.wsRoleImage, result => {
      wsImageDraft = result;
    });
  });

  function resetWorkshopForm() {
    ui.wsRoleName.value = "自定义角色";
    ui.wsRoleColor.value = "#40c4ff";
    ui.wsRoleImage.value = "";
    ui.wsRoleHp.value = 200;
    ui.wsRoleRadius.value = 34;
    ui.wsAttackType.value = "melee";
    ui.wsRoleSpeed.value = 2.8;
    ui.wsRoleDamage.value = 24;
    ui.wsRoleHitCooldown.value = 30;
    ui.wsRoleAreaRadius.value = 80;
    ui.wsRoleAreaDamage.value = 20;
    updateAreaParamVisibility("melee", "ws");
    // 重置技能选择
    document.querySelectorAll(".ws-skill-select").forEach(sel => {
      sel.value = "";
    });
    wsImageDraft = { imageDataUrl: "", image: null };
  }

  ui.wsResetForm.addEventListener("click", resetWorkshopForm);

  // 创意工坊技能库操作
  ui.wsSkillLibraryList.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (button) {
      event.stopPropagation();
      handleSkillAction(button.dataset.action, button.dataset.skillId);
    }
  });

  ui.wsCreateSkill.addEventListener("click", () => openSkillEditPage(null));
  ui.backToWorkshop.addEventListener("click", closeSkillEditPage);
  ui.saveEditedSkill.addEventListener("click", saveEditedSkill);
  ui.cancelEditSkill.addEventListener("click", closeSkillEditPage);
  ui.deleteEditedSkill.addEventListener("click", deleteEditedSkill);

  ui.editSkillTriggerType.addEventListener("change", updateTriggerParamVisibility);
  ui.editSkillEffectType.addEventListener("change", () => {
    renderSkillEffectParamsForm(ui.editSkillEffectType.value, {});
  });

  // 技能槽移除按钮
  document.addEventListener("click", event => {
    const removeBtn = event.target.closest("[data-remove-slot]");
    if (removeBtn) {
      const idx = Number(removeBtn.dataset.removeSlot);
      const sel = document.querySelector(`.edit-skill-select[data-slot-idx="${idx}"]`);
      if (sel) sel.value = "";
    }
    const wsRemoveBtn = event.target.closest("[data-ws-remove-slot]");
    if (wsRemoveBtn) {
      const idx = Number(wsRemoveBtn.dataset.wsRemoveSlot);
      const sel = document.querySelector(`.ws-skill-select[data-ws-slot-idx="${idx}"]`);
      if (sel) sel.value = "";
    }
  });

  ui.wsCreateRole.addEventListener("click", () => {
    const name = ui.wsRoleName.value.trim() || "自定义角色";
    const skills = [null, null, null];
    document.querySelectorAll(".ws-skill-select").forEach(sel => {
      const idx = Number(sel.dataset.wsSlotIdx);
      skills[idx] = sel.value || null;
    });
    const newRole = normalizeRole({
      id: "custom_" + Date.now(),
      name,
      hp: Number(ui.wsRoleHp.value),
      radius: Number(ui.wsRoleRadius.value),
      speed: Number(ui.wsRoleSpeed.value),
      moveSpeed: Number(ui.wsRoleSpeed.value),
      damage: Number(ui.wsRoleDamage.value),
      hitCooldown: Number(ui.wsRoleHitCooldown.value),
      attackType: ui.wsAttackType.value,
      areaRadius: Number(ui.wsRoleAreaRadius.value),
      areaDamage: Number(ui.wsRoleAreaDamage.value),
      color: ui.wsRoleColor.value,
      imageDataUrl: wsImageDraft.imageDataUrl || "",
      image: wsImageDraft.image || null,
      builtin: false,
      specialSkill: "",
      skills
    });
    roleLibrary.push(newRole);
    saveRoleLibrary();
    renderRoleLibraryList();
    renderRoleSelects();
    resetWorkshopForm();
    message = "角色「" + name + "」已创建";
  });

  // 设置子导航
  document.querySelector(".settings-nav").addEventListener("click", event => {
    const btn = event.target.closest("[data-subview]");
    if (!btn) return;
    const subview = btn.dataset.subview;

    document.querySelectorAll(".settings-nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    document.querySelector(".settings-panel").dataset.subview = subview;
  });

  // 游戏控制
  ui.battleHintEnabled.checked = battleHintEnabled;
  ui.battleHintEnabled.addEventListener("change", () => {
    battleHintEnabled = ui.battleHintEnabled.checked;
    localStorage.setItem(BATTLE_HINT_STORAGE_KEY, String(battleHintEnabled));
  });

  ui.startBattle.addEventListener("click", startBattle);
  ui.reset.addEventListener("click", prepareGame);
  goSettings.addEventListener("click", () => {
    if (battleState === "running") {
      battleState = "paused";
      message = "已暂停";
      updateStats();
    }
    showView("settings");
    renderRoleLibraryList();
    renderMapLibraryList();
    renderWsSkillLibrary();
    refreshAllSkillSelects();
  });

  backToGame.addEventListener("click", () => {
    showView("game");
  });

  /* ──────────── 初始化 ──────────── */

  roleLibrary = loadRoleLibrary();
  mapLibrary = loadMapLibrary();
  skillLibrary = loadSkillLibrary();
  renderRoleLibraryList();
  renderMapLibraryList();
  renderRoleSelects();
  applyRoleToSide("a", selectedRoleIds.a);
  applyRoleToSide("b", selectedRoleIds.b);
  prepareGame();
  updateStageScale();
  loop();
</script>
