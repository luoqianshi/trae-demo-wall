<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专业术语翻译小助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f7f8fa;
    color: #1a1a2e;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: #fff;
    border-bottom: 1px solid #e8e8ed;
    padding: 20px 0;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a2e;
    letter-spacing: 0.5px;
  }
  .header p {
    font-size: 13px;
    color: #8e8ea0;
    margin-top: 4px;
  }

  /* Search */
  .search-wrap {
    max-width: 580px;
    margin: 32px auto 0;
    padding: 0 20px;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1px solid #dcdce0;
    border-radius: 10px;
    padding: 0 4px 0 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box:focus-within {
    border-color: #4f6ef7;
    box-shadow: 0 0 0 3px rgba(79,110,247,0.1);
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    padding: 14px 0;
    background: transparent;
    color: #1a1a2e;
  }
  .search-box input::placeholder { color: #b0b0be; }
  .search-btn {
    background: #4f6ef7;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .search-btn:hover { background: #3b5de7; }
  .search-btn:disabled { background: #b0b0be; cursor: not-allowed; }
  .random-btn {
    background: none;
    border: 1px solid #dcdce0;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #6e6e80;
    cursor: pointer;
    margin-left: 8px;
    transition: border-color 0.2s, color 0.2s;
  }
  .random-btn:hover { border-color: #4f6ef7; color: #4f6ef7; }

  /* Categories */
  .categories {
    max-width: 580px;
    margin: 24px auto 0;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .cat-tag {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    background: #fff;
    border: 1px solid #e8e8ed;
    color: #6e6e80;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-tag:hover, .cat-tag.active {
    background: #4f6ef7;
    color: #fff;
    border-color: #4f6ef7;
  }

  /* Result */
  .result-area {
    max-width: 580px;
    margin: 28px auto 40px;
    padding: 0 20px;
  }

  .term-card {
    background: #fff;
    border-radius: 12px;
    padding: 28px;
    border: 1px solid #e8e8ed;
    animation: fadeUp 0.35s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .term-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .term-title h2 {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a2e;
  }
  .term-field {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    background: #eef0ff;
    color: #4f6ef7;
    font-weight: 500;
  }

  .term-section {
    margin-bottom: 18px;
  }
  .term-section:last-child { margin-bottom: 0; }
  .term-section h3 {
    font-size: 12px;
    font-weight: 600;
    color: #8e8ea0;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .term-section p {
    font-size: 15px;
    line-height: 1.7;
    color: #3d3d56;
  }

  .hint-text {
    text-align: center;
    color: #b0b0be;
    font-size: 14px;
    padding: 40px 0;
  }

  /* Loading */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 0;
    gap: 12px;
  }
  .loading-dots {
    display: flex;
    gap: 6px;
  }
  .loading-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4f6ef7;
    animation: bounce 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }
  .loading p {
    font-size: 13px;
    color: #8e8ea0;
  }

  /* API Settings Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 28px;
    width: 420px;
    max-width: 90vw;
  }
  .modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: #8e8ea0; margin-bottom: 18px; line-height: 1.6; }
  .modal label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #3d3d56;
    margin-bottom: 6px;
  }
  .modal input, .modal select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #dcdce0;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal input:focus, .modal select:focus { border-color: #4f6ef7; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
  }
  .modal-actions button {
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel { background: #f0f0f3; border: none; color: #6e6e80; }
  .btn-cancel:hover { background: #e4e4e8; }
  .btn-save { background: #4f6ef7; border: none; color: #fff; }
  .btn-save:hover { background: #3b5de7; }

  /* Settings trigger */
  .settings-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #e8e8ed;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    color: #8e8ea0;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .settings-btn:hover { color: #4f6ef7; border-color: #4f6ef7; }

  /* Mode indicator */
  .mode-bar {
    max-width: 580px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    justify-content: center;
  }
  .mode-tag {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 12px;
    font-weight: 500;
  }
  .mode-tag.offline { background: #fff3e0; color: #e65100; }
  .mode-tag.online { background: #e8f5e9; color: #2e7d32; }

  /* Responsive */
  @media (max-width: 480px) {
    .search-box { padding: 0 2px 0 12px; }
    .search-btn { padding: 10px 14px; font-size: 13px; }
    .random-btn { padding: 10px 10px; font-size: 12px; }
    .term-card { padding: 20px; }
    .term-title h2 { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>专业术语翻译小助手</h1>
  <p>输入术语，用通俗语言帮你秒懂</p>
</div>

<div class="search-wrap">
  <div style="display:flex; align-items:center;">
    <div class="search-box" style="flex:1;">
      <input type="text" id="termInput" placeholder="输入专业术语，如：区块链、量子纠缠、市盈率..." 
             onkeydown="if(event.key==='Enter')searchTerm()">
      <button class="search-btn" id="searchBtn" onclick="searchTerm()">翻译</button>
    </div>
    <button class="random-btn" onclick="randomTerm()">随机一词</button>
  </div>
</div>

<div class="categories" id="categories">
  <!-- Dynamically generated -->
</div>

<div class="mode-bar" id="modeBar">
  <!-- Dynamically generated -->
</div>

<div class="result-area" id="resultArea">
  <div class="hint-text">输入一个术语开始探索，或点击"随机一词"</div>
</div>

<!-- Settings Button -->
<div class="settings-btn" onclick="openSettings()" title="API 设置">⚙</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>AI 接口设置</h2>
    <p>本工具需要接入 AI 大模型来生成通俗解释。请填入你的 API Key（密钥仅保存在本地浏览器中，不会上传）。</p>
    <label>选择服务商</label>
    <select id="apiProvider">
      <option value="deepseek">DeepSeek</option>
      <option value="zhipu">智谱 AI（GLM）</option>
      <option value="qwen">通义千问</option>
      <option value="custom">自定义 OpenAI 兼容接口</option>
    </select>
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-..." />
    <label id="customBaseLabel" style="display:none;">自定义接口地址（Base URL）</label>
    <input type="text" id="customBase" placeholder="https://api.example.com/v1" style="display:none;" />
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSettings()">取消</button>
      <button class="btn-save" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ============ Data ============
const CATEGORIES = [
  { id: 'all', name: '全部' },
  { id: 'cs', name: '计算机/IT' },
  { id: 'science', name: '自然科学' },
  { id: 'finance', name: '金融/经济' },
  { id: 'law', name: '法律' },
  { id: 'psychology', name: '心理' },
  { id: 'car', name: '汽车/出行' },
  { id: 'life', name: '生活' },
  { id: 'study', name: '学习' },
  { id: 'entertainment', name: '娱乐' },
  { id: 'tool', name: '日常工具' },
];

const EXAMPLE_TERMS = {
  cs: ['API', 'DNS', 'TCP/IP', '云计算', '开源', '前端', '后端', '容器化', '微服务', '负载均衡', 'CDN', '防火墙', '面向对象', '数据库索引', 'HTTP与HTTPS', '版本控制', '机器学习', '深度学习', '神经网络', '大语言模型', '自然语言处理', 'Transformer', '强化学习', '提示词工程', '多模态'],
  science: ['CT扫描', 'MRI', '抗生素', '新陈代谢', '免疫系统', '基因编辑', '临床试验', '靶向治疗', '胰岛素', '血压', '量子纠缠', '相对论', '熵', '光合作用', '牛顿第三定律', '波粒二象性', '暗物质', '测不准原理'],
  finance: ['GDP', '通货膨胀', '市盈率', '杠杆', '对冲基金', '量化交易', 'ETF', '期权', '复利', '区块链'],
  law: ['诉讼时效', '举证责任', '知识产权', '仲裁', '合同违约', '善意第三人', '法人', '不可抗力'],
  psychology: ['PUA', '煤气灯效应', '原生家庭', '社恐', '拖延症', '习得性无助', '群体思维', '旁观者效应'],
  car: ['ABS', '涡轮增压', '底盘悬挂', '扭矩', '马力', '百公里加速', '四驱系统', '混合动力'],
  life: ['汇率', '物业费', '公摊面积', '五险一金', '信用卡账单', '公积金', '个税专项扣除', '房贷利率', '社保', '医保报销'],
  study: ['费曼学习法', '艾宾浩斯遗忘曲线', '番茄工作法', '思维导图', '刻意练习'],
  entertainment: ['番剧', '大逃杀', 'MOBA', '开放世界', '抽卡', '弹幕', '二创', '剧本杀'],
  tool: ['游标卡尺', '万用表', '电钻', '激光测距仪', '热熔胶枪'],
};

let currentCategory = 'all';
let searchHistory = JSON.parse(localStorage.getItem('term_history') || '[]');

// ============ Init ============
function init() {
  renderCategories();
  loadSettings();
}

function renderCategories() {
  const container = document.getElementById('categories');
  container.innerHTML = CATEGORIES.map(c =>
    `<span class="cat-tag ${c.id === currentCategory ? 'active' : ''}" onclick="selectCategory('${c.id}')">${c.name}</span>`
  ).join('');
}

function selectCategory(id) {
  currentCategory = id;
  renderCategories();
  // Clear result when switching category
  document.getElementById('resultArea').innerHTML =
    `<div class="hint-text">${id === 'all' ? '输入一个术语开始探索，或点击"随机一词"' : '已选择：' + CATEGORIES.find(c=>c.id===id).name + '，输入术语或点击"随机一词"'}</div>`;
}

// ============ Search ============
async function searchTerm() {
  const input = document.getElementById('termInput').value.trim();
  if (!input) return;

  const apiKey = localStorage.getItem('api_key');
  const resultArea = document.getElementById('resultArea');

  // Offline mode: no API key configured
  if (!apiKey) {
    const local = searchLocal(input);
    if (local) {
      resultArea.innerHTML = renderCard(local);
      saveToHistory(input);
    } else {
      resultArea.innerHTML = `
        <div class="term-card">
          <p style="text-align:center; color:#e65100;">本地词库中未找到「${escHtml(input)}」</p>
          <p style="text-align:center; font-size:13px; color:#8e8ea0; margin-top:8px;">当前为离线模式，仅支持内置术语查询。点击右下角 ⚙ 配置 AI 接口可查询任意术语。</p>
        </div>`;
    }
    return;
  }

  // Online mode: call AI
  resultArea.innerHTML = `
    <div class="loading">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <p>AI 正在为你翻译「${escHtml(input)}」...</p>
    </div>`;

  try {
    const result = await callAI(input);
    resultArea.innerHTML = renderCard(result);
    saveToHistory(input);
  } catch (err) {
    // Fallback to local if AI fails
    const local = searchLocal(input);
    if (local) {
      resultArea.innerHTML = `
        <div class="term-card" style="margin-bottom:12px;">
          <p style="text-align:center; color:#e65100; font-size:13px;">AI 查询失败，已切换到离线结果</p>
        </div>` + renderCard(local);
    } else {
      resultArea.innerHTML = `
        <div class="term-card">
          <p style="color:#e74c3c; text-align:center;">查询失败：${escHtml(err.message)}</p>
          <p style="color:#8e8ea0; text-align:center; font-size:13px; margin-top:8px;">请检查 API Key 设置是否正确</p>
        </div>`;
    }
  }
}

// ============ Random ============
function randomTerm() {
  const term = getRandomTermByCategory(currentCategory);
  if (term) {
    document.getElementById('termInput').value = term;
    searchTerm();
  }
}

// ============ AI Call ============
async function callAI(term) {
  const provider = localStorage.getItem('api_provider') || 'deepseek';
  const apiKey = localStorage.getItem('api_key');

  const prompt = `你是一个专业术语翻译助手。请用通俗语言解释以下术语，严格按照 JSON 格式返回，不要有任何其他文字。

术语：${term}

返回格式（严格 JSON）：
{
  "term": "${term}",
  "field": "所属领域（如：计算机、医学、金融、法律、物理等）",
  "short": "一句话通俗解释（20字以内）",
  "explanation": "用大白话详细解释这个术语（100-200字），不要用其他专业术语，要像一个懂行的朋友在跟朋友聊天",
  "analogy": "用一个生活中的比喻来解释这个概念（50-100字），比喻要生动有趣",
  "example": "一个简短的实际应用场景或例子（50字以内）"
}`;

  let url, headers, body;

  if (provider === 'deepseek') {
    url = 'https://api.deepseek.com/chat/completions';
    headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
    body = {
      model: 'deepseek-chat',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.7,
      max_tokens: 500,
    };
  } else if (provider === 'zhipu') {
    url = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
    headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
    body = {
      model: 'glm-4-flash',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.7,
      max_tokens: 500,
    };
  } else if (provider === 'qwen') {
    url = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
    headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
    body = {
      model: 'qwen-turbo',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.7,
    };
  } else {
    const baseUrl = localStorage.getItem('custom_base') || 'https://api.openai.com/v1';
    url = baseUrl.replace(/\/+$/, '') + '/chat/completions';
    headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
    body = {
      model: 'gpt-3.5-turbo',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.7,
    };
  }

  const resp = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
  if (!resp.ok) {
    const errData = await resp.json().catch(() => ({}));
    throw new Error(errData.error?.message || `API 请求失败 (${resp.status})`);
  }

  const data = await resp.json();
  const content = data.choices?.[0]?.message?.content || '';

  // Parse JSON from response
  try {
    // Try to extract JSON from possible markdown code blocks
    const jsonMatch = content.match(/\{[\s\S]*\}/);
    if (jsonMatch) return JSON.parse(jsonMatch[0]);
    return JSON.parse(content);
  } catch (e) {
    // Fallback: construct from raw text
    return {
      term,
      field: '未知领域',
      short: content.slice(0, 50),
      explanation: content,
      analogy: '',
      example: '',
    };
  }
}

// ============ Render ============
function renderCard(data) {
  const fieldColor = getFieldColor(data.field);
  return `
    <div class="term-card">
      <div class="term-title">
        <h2>${escHtml(data.term || '')}</h2>
        ${data.field ? `<span class="term-field" style="background:${fieldColor.bg};color:${fieldColor.fg}">${escHtml(data.field)}</span>` : ''}
      </div>
      ${data.short ? `
      <div class="term-section">
        <h3>一句话解释</h3>
        <p>${escHtml(data.short)}</p>
      </div>` : ''}
      ${data.explanation ? `
      <div class="term-section">
        <h3>通俗解释</h3>
        <p>${escHtml(data.explanation)}</p>
      </div>` : ''}
      ${data.analogy ? `
      <div class="term-section">
        <h3>生活比喻</h3>
        <p>💡 ${escHtml(data.analogy)}</p>
      </div>` : ''}
      ${data.example ? `
      <div class="term-section">
        <h3>实际例子</h3>
        <p>📌 ${escHtml(data.example)}</p>
      </div>` : ''}
    </div>`;
}

function getFieldColor(field) {
  const map = {
    '计算机': { bg: '#e8f5e9', fg: '#2e7d32' },
    '自然科学': { bg: '#e3f2fd', fg: '#1565c0' },
    '金融': { bg: '#fff3e0', fg: '#e65100' },
    '经济': { bg: '#fff3e0', fg: '#e65100' },
    '法律': { bg: '#ede7f6', fg: '#4527a0' },
    '心理': { bg: '#fce4ec', fg: '#c62828' },
    '汽车': { bg: '#f3e5f5', fg: '#6a1b9a' },
    '生活': { bg: '#e0f2f1', fg: '#00695c' },
    '学习': { bg: '#fff8e1', fg: '#f57f17' },
    '娱乐': { bg: '#fce4ec', fg: '#ad1457' },
    '日常工具': { bg: '#efebe9', fg: '#4e342e' },
  };
  for (const key in map) {
    if ((field || '').includes(key)) return map[key];
  }
  return { bg: '#eef0ff', fg: '#4f6ef7' };
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============ Settings ============
function openSettings() {
  document.getElementById('settingsModal').classList.add('show');
  document.getElementById('apiProvider').value = localStorage.getItem('api_provider') || 'deepseek';
  document.getElementById('apiKey').value = localStorage.getItem('api_key') || '';
  document.getElementById('customBase').value = localStorage.getItem('custom_base') || '';
  toggleCustomBase();
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
}

function saveSettings() {
  const provider = document.getElementById('apiProvider').value;
  const apiKey = document.getElementById('apiKey').value.trim();
  const customBase = document.getElementById('customBase').value.trim();

  localStorage.setItem('api_provider', provider);
  if (apiKey) {
    localStorage.setItem('api_key', apiKey);
  } else {
    localStorage.removeItem('api_key');
  }
  if (customBase) localStorage.setItem('custom_base', customBase);

  closeSettings();
  updateModeBar();
}

function toggleCustomBase() {
  const v = document.getElementById('apiProvider').value;
  const isCustom = v === 'custom';
  document.getElementById('customBaseLabel').style.display = isCustom ? 'block' : 'none';
  document.getElementById('customBase').style.display = isCustom ? 'block' : 'none';
}

document.getElementById('apiProvider').addEventListener('change', toggleCustomBase);

// ============ History ============
function saveToHistory(term) {
  searchHistory = searchHistory.filter(t => t !== term);
  searchHistory.unshift(term);
  if (searchHistory.length > 30) searchHistory = searchHistory.slice(0, 30);
  localStorage.setItem('term_history', JSON.stringify(searchHistory));
}

    analogy: '胰岛素就像钥匙，细胞就像房子，血糖就像燃料。没有钥匙，打不开门，燃料就进不了房子，只能堆在外面。',
    example: '糖尿病患者需要注射胰岛素来帮助降低血糖，因为他们的身体自己已经不够用了。' },
  { term: '血压', aliases: ['blood pressure','高血压','低血压'], field: '自然科学',
    short: '血液对血管壁的压力，过高过低都不好',
    explanation: '血压是血液在血管中流动时对血管壁产生的侧压力。通常用两个数字表示，如120/80mmHg。第一个是收缩压（心脏收缩时的压力），第二个是舒张压（心脏放松时的压力）。长期血压过高会损伤血管和器官。',
    analogy: '像自来水管的水压：压力太大，水管可能爆裂（血管破裂）；压力太小，水又送不到三楼（器官缺血）。',
    example: '正常血压约120/80。如果你的血压经常超过140/90，就被认为是高血压，需要控制饮食或吃药。' },

  // ---- 金融/经济 ----
  { term: 'GDP', aliases: ['gdp','国内生产总值'], field: '经济',
    short: '一个国家一年内生产的所有东西的总价值',
    explanation: 'GDP（国内生产总值）衡量的是一个国家或地区在一年内所有经济活动产生的最终产品和服务的总价值。它被广泛用来衡量一个国家的经济实力和发展水平。GDP增长说明经济在扩张，GDP下降说明经济在萎缩。',
    analogy: '就像一个人一年赚的总收入：工资+兼职+投资收益全部加起来。GDP就是整个国家一年"赚"的总量。',
    example: '2023年中国GDP约126万亿元，表示全国所有企业、个人在这一年创造的经济成果总和。' },
  { term: '通货膨胀', aliases: ['通胀','inflation','物价上涨'], field: '经济',
    short: '钱越来越不值钱，同样的钱能买到的东西变少了',
    explanation: '通货膨胀是指整体物价持续上涨、货币购买力下降的现象。简单说就是"钱变毛了"。原因很多：印钱太多、需求大于供给、成本上升等。适度的通胀（2-3%）被认为是正常的，太高则会严重影响生活。',
    analogy: '10年前一碗牛肉面10块钱，现在要20块。面条没多，但钱"缩水"了——这就是通胀。',
    example: '如果你有100万现金存了10年不动，虽然数字没变，但由于通胀，实际能买到的东西可能只有原来的一半。' },
  { term: '市盈率', aliases: ['PE','市盈率','本益比'], field: '金融',
    short: '股价除以每股收益，衡量股票贵不贵',
    explanation: '市盈率（P/E）是股票价格除以每股收益得出的比率。比如一只股票股价100元，每股赚10元，市盈率就是10倍。意思是按现在的盈利水平，你投资的钱需要10年才能"回本"。市盈率越高，市场对公司未来越看好（或越贵）。',
    analogy: '像买房的"回本年限"：一套房500万，每年租金25万，需要20年租金才能回本，"房产市盈率"就是20倍。',
    example: '银行股市盈率通常5-6倍（便宜），科技股可能50-100倍（贵但增长快）。市盈率帮你判断股票是否合理。' },
  { term: '杠杆', aliases: ['杠杆交易','杠杆率','leverage'], field: '金融',
    short: '借钱投资以放大收益（同时放大风险）',
    explanation: '杠杆就是用借来的钱来投资，从而放大你的投资金额。比如你只有1万块，借了9万共10万去投资。涨10%就赚1万（本金翻倍），但跌10%也亏1万（本金全没）。杠杆是一把双刃剑，收益和风险都同比例放大。',
    analogy: '像翘翘板原理：用一个小力撬动大物体。金融杠杆就是用少量本金撬动大额投资——撬对了赚大钱，撬错了血本无归。',
    example: '买房其实就是加杠杆：你付30万首付贷70万买100万的房子，房价涨10万你就赚了33%，远超只用自己的钱投资。' },
  { term: '对冲基金', aliases: ['对冲','hedge fund'], field: '金融',
    short: '用各种高难度策略追求绝对收益的私募基金',
    explanation: '对冲基金是一种面向富裕投资者和机构的私募基金，操作策略比普通基金灵活得多——可以做空、用杠杆、投资衍生品等。"对冲"的意思是同时做多和做空来降低风险。但现在的对冲基金策略五花八门，核心特征是追求"不管市场涨跌都赚钱"。',
    analogy: '像赌场里的"老千"：普通基金只能押涨，对冲基金涨跌都能押，还能两边对冲来降低风险。',
    example: '一个对冲基金可能同时做多优质科技股、做空劣质科技股，这样不管科技行业整体涨跌，只要选对了股票就能赚钱。' },
  { term: '量化交易', aliases: ['量化','程序化交易','quant'], field: '金融',
    short: '用计算机程序按预设规则自动买卖股票',
    explanation: '量化交易就是用数学模型和计算机程序来做投资决策。程序会根据历史数据和预设策略，自动分析市场信号并执行买卖操作。速度快、纪律性强，能在毫秒内完成交易。但也存在模型失效或"黑天鹅"事件的风险。',
    analogy: '像请了一个从不睡觉、情绪稳定的机器人帮你炒股——它只按你设定好的策略买卖，不受贪婪和恐惧影响。',
    example: '华尔街的高频交易公司，其计算机程序在股票价格变动0.01元时就能在几毫秒内完成上百万股的交易。' },
  { term: 'ETF', aliases: ['etf','交易型开放式指数基金'], field: '金融',
    short: '像买一只股票一样买一篮子股票',
    explanation: 'ETF（Exchange Traded Fund）是一种可以在交易所像股票一样买卖的基金。一只ETF通常包含几十甚至几百只股票，买ETF就等于一次性买入一篮子股票。比如买沪深300ETF就等于买了中国最大的300家公司的一小部分。',
    analogy: '像买水果拼盘：你不需要一个一个挑苹果、香蕉、橙子，买一个拼盘就全有了。ETF就是"股票拼盘"。',
    example: '你想投资A股但不知道买哪只，买一只"沪深300ETF"就相当于同时投资了中国最大的300家公司。' },
  { term: '期权', aliases: ['option','看涨期权','看跌期权'], field: '金融',
    short: '花小钱买一个"未来可以按约定价格买卖"的权利',
    explanation: '期权是一种金融合约，给你一个在未来某个时间以约定价格买入或卖出某资产的权利（但不是义务）。看涨期权给你买的权利，看跌期权给你卖的权利。你只需付少量"权利金"就能获得这个权利。',
    analogy: '像交定金锁优惠：你交1000元定金，约定一个月后可以按今天的价格买车。如果一个月后车涨价了你就赚了，跌了你可以放弃定金。',
    example: '你花2000元买了一份"一个月后以5万元买入某股票"的权利。一个月后股票涨到6万，你执行期权赚1万（扣除2000成本净赚8000）。' },
  { term: '复利', aliases: ['compound interest','利滚利','复利效应'], field: '金融',
    short: '利滚利，让钱自己生出更多的钱',
    explanation: '复利是把赚到的利息也加入本金，下一期的利息就在更大的本金上计算。时间越长，效果越惊人。比如年化10%，10万块钱10年后变成25.9万，30年后变成174.5万——这就是复利的魔力。爱因斯坦据说称其为"世界第八大奇迹"。',
    analogy: '像滚雪球：一个小雪球从山顶滚下来，越滚越大。前面滚的过程中沾的雪，后面都成了更大的球体的一部分。',
    example: '你每月定投1000元到年化8%的基金，30年后你会投入36万，但最终总额超过140万——多出来的都是复利赚的。' },
  { term: '区块链', aliases: ['blockchain','区块链技术','链'], field: '计算机',
    short: '一种去中心化的、不可篡改的公共账本技术',
    explanation: '区块链是一种分布式数据库技术。它把数据打包成一个个"区块"，然后像链条一样一个接一个连起来。每个区块都包含前一个区块的"指纹"，一旦有人想篡改历史记录，后面所有的"指纹"都对不上，所以数据几乎不可能被篡改。',
    analogy: '像全村人一起记账：每笔交易全村人都记一份，想偷偷改账是不可能的，因为其他人手里还有原始记录。',
    example: '比特币就是区块链技术的第一个应用，它的所有交易记录都公开保存在全球无数台电脑上，无法被任何人篡改。' },

  // ---- 法律 ----
  { term: '诉讼时效', aliases: ['时效','诉讼时效期间'], field: '法律',
    short: '打官司的有效期限，过期就不能告了',
    explanation: '诉讼时效是法律规定的你向法院起诉的有效时间限制。一般为三年（从你知道自己权利被侵害那天算起）。超过这个期限虽然还能去法院立案，但对方如果提出"超过时效"的抗辩，法院就会驳回你的诉求。法律设置这个是为了避免纠纷悬而未决。',
    analogy: '像超市的退货期限：商品只能在7天内退。过了7天你再去找超市，超市有权拒绝。',
    example: '别人欠你钱，约定2024年1月1日还但一直没还。你有3年时间起诉，到2027年1月1日之后就超过时效了。' },
  { term: '举证责任', aliases: ['举证','谁主张谁举证'], field: '法律',
    short: '谁说谁有理，谁就负责拿出证据',
    explanation: '举证责任是法律规定"谁提出主张，谁就要负责证明"的原则。比如你说别人欠你钱，你就需要拿出借条、转账记录等证据来证明。如果拿不出证据，即使事实真的如此，法院也可能不支持你的诉求。',
    analogy: '像同学之间吵架："你说我偷了你的笔？你有什么证据？"——谁指控，谁举证。',
    example: '你起诉邻居噪音扰民，你需要拿出录音、检测报告等证据。如果你拿不出证据证明邻居确实扰民，法院就无法支持你。' },
  { term: '知识产权', aliases: ['IP','知识产权','著作权','专利权','商标权'], field: '法律',
    short: '对创作和发明享有的独占权利',
    explanation: '知识产权是创作者对其智力成果享有的专有权利。主要包括：著作权（文章、音乐、软件）、专利权（发明、实用新型）、商标权（品牌名、logo）。有了知识产权，别人就不能未经许可随便用你的作品或发明。',
    analogy: '像给你的创意上锁：你写了一首歌、发明了一个东西，知识产权就是法律给你的"独家锁"，别人不能偷用。',
    example: '你画了一个原创卡通形象并注册了著作权，如果有商家未经允许把它印在T恤上卖，你就可以起诉他们侵权。' },
  { term: '仲裁', aliases: ['arbitration','仲裁机构'], field: '法律',
    short: '双方约定让第三方来裁决纠纷',
    explanation: '仲裁是解决纠纷的一种方式。双方当事人约定把争议交给一个双方都认可的第三方（仲裁委员会）来裁决。仲裁一裁终局，不像法院诉讼还能上诉。仲裁过程不公开，保密性好，而且对双方来说效率更高、更灵活。',
    analogy: '像两个人吵架，不找警察不找法院，而是请一个双方都信任的长辈来评理并做最终决定。',
    example: '很多劳动合同里会写"劳动争议提交某某仲裁委员会仲裁"。员工和公司有纠纷时，就去约定的仲裁机构解决。' },
  { term: '合同违约', aliases: ['违约','breach of contract'], field: '法律',
    short: '签了合同但不按约定履行，要承担责任',
    explanation: '合同违约是指一方没有按照合同约定的内容履行自己的义务。违约方需要承担违约责任，通常包括：继续履行（做完该做的事）、赔偿损失、支付违约金等。违约金是双方在合同里提前约定的一个金额。',
    analogy: '像约好周六一起吃饭你放鸽子——你"违约"了，朋友可以要求你补偿（比如下次你请客）。',
    example: '装修公司签了合同3个月完工，结果拖了5个月还没弄好。业主可以要求装修公司赔偿延期违约金。' },
  { term: '善意第三人', aliases: ['善意取得','善意第三人'], field: '法律',
    short: '不知情的、诚实的交易对手受法律保护',
    explanation: '善意第三人是法律中的一个重要概念。指在交易中不知道交易有瑕疵、出于善意（诚实）进行交易的第三方。比如小偷偷了你的手机卖给不知情的路人，这个路人就是善意第三人，法律保护他，他不需要把手机还给你（但你可以找小偷赔偿）。',
    analogy: '像你在二手市场买了一个手机，不知道那是赃物。你属于"善意买家"，法律不会让你把手机还回去。',
    example: '甲冒充房东把房子卖给了不知情的乙。乙已经付钱并过户了。乙就是善意第三人，真正的房东不能要求乙搬走，只能追究甲。' },
  { term: '法人', aliases: ['法定代表人','法人代表','legal person'], field: '法律',
    short: '在法律上被当作一个"人"来看待的组织',
    explanation: '法人是法律赋予某种组织以"人"的资格，使它能像自然人一样拥有财产、签订合同、打官司。注意法人和法定代表人是不同的概念：法人是一个组织（如公司），法定代表人是代表这个组织的具体个人（如公司的董事长或总经理）。',
    analogy: '法人就像公司穿了一件"人"的衣服，在社会上可以像一个真正的人一样做事。但穿这件衣服的是"公司"这个组织，不是某个人。',
    example: '张三是ABC公司的法定代表人。ABC公司因为合同纠纷被告上法庭——被告是"ABC公司"这个法人，不是张三个人。' },
  { term: '不可抗力', aliases: ['force majeure','不可抗力条款'], field: '法律',
    short: '发生了无法预见、无法避免的天灾人祸，可以免责',
    explanation: '不可抗力是指不能预见、不能避免且不能克服的客观情况，如地震、台风、战争等。因不可抗力导致合同无法履行时，违约方可以部分或全部免除责任。但不是什么情况都能算不可抗力，法院会严格审查。',
    analogy: '像约好去野餐结果刮台风——这不是你故意放鸽子，是老天爷不配合，属于"不可抗力"。',
    example: '快递公司承诺3天送到，但因为暴雨导致道路中断，迟到了2天。快递公司可以主张不可抗力免责，不赔偿延误费。' },

  // ---- 自然科学（物理，已合并到上方自然科学板块） ----
  { term: '量子纠缠', aliases: ['量子纠缠','entanglement','量子'], field: '自然科学',
    short: '两个粒子不论隔多远，一个变化另一个瞬间响应',
    explanation: '量子纠缠是量子力学中的一种奇妙现象。两个粒子在特定条件下形成"纠缠态"后，无论相隔多远，测量其中一个粒子的状态，另一个粒子的状态就会瞬间确定。爱因斯坦称之为"鬼魅般的超距作用"。这并不是用来传递信息，因为结果是不可控的。',
    analogy: '像一对神奇的双胞胎骰子：一个在北京掷出6，远在纽约的另一个瞬间变成6。不管多远，永远同步。',
    example: '中国的"墨子号"量子卫星在1200公里的距离上实现了量子纠缠分发，这是量子通信的重要里程碑。' },
  { term: '相对论', aliases: ['爱因斯坦','相对论','einstein'], field: '自然科学',
    short: '时间、空间和引力之间的关系——速度越快时间越慢',
    explanation: '爱因斯坦的相对论分两部分：狭义相对论说，运动速度越快，时间流逝越慢（接近光速时最明显）；广义相对论说，引力其实是时空弯曲的表现——大质量物体会让周围的空间"凹陷"。GPS卫星每天都要修正相对论带来的时间误差，否则定位会偏差好几公里。',
    analogy: '像坐在弹簧床上：一个很重的人坐在中间，床面凹陷了，旁边的小球会滚向那个人——引力就是这么回事。',
    example: '你用的手机GPS导航，卫星每天要修正相对论效应带来的百万分之一秒误差，否则你的位置会偏差好几公里。' },
  { term: '熵', aliases: ['entropy','热力学第二定律','熵增'], field: '自然科学',
    short: '衡量混乱程度的量，事物总是趋向于越来越混乱',
    explanation: '熵是物理学中衡量一个系统混乱程度的概念。热力学第二定律告诉我们：封闭系统的熵只会增加不会减少——就是说事情总是自然而然变得越来越混乱。房间不收拾会越来越乱（熵增），要变整洁（熵减）就需要消耗能量。这被称为"时间之箭"。',
    analogy: '你的房间：不收拾的话只会越来越乱，永远不会自己变整齐。这个"越来越乱的趋势"就是熵增。',
    example: '热水自然变凉、铁器自然生锈、墨水滴入水中自然扩散——这些过程都是熵增，都是不可逆的。' },
  { term: '光合作用', aliases: ['photosynthesis','光合作用'], field: '自然科学',
    short: '植物用阳光把水和二氧化碳变成食物和氧气',
    explanation: '光合作用是绿色植物利用太阳光的能量，把水和二氧化碳转化成葡萄糖（食物）和氧气的过程。这个过程发生在植物叶片的叶绿体中。光合作用是地球上几乎所有食物链的基础，也是大气中氧气的主要来源。',
    analogy: '像太阳能厨房：植物是厨师，阳光是能源，水和二氧化碳是原料，做出来的是糖（自己的食物）和氧气（副产品送给我们）。',
    example: '树上的叶子在阳光下，不断吸收空气中的CO2和根部的水分，制造养分给自己"吃饭"，同时释放氧气给我们呼吸。' },
  { term: '牛顿第三定律', aliases: ['作用力与反作用力','牛顿定律'], field: '自然科学',
    short: '你推墙，墙也在推你——力总是成对出现',
    explanation: '牛顿第三定律告诉我们：任何力都是成对出现的，一个物体对另一个物体施加力的同时，另一个物体也会对它施加一个大小相等、方向相反的力。你推墙的时候，墙也在用同样大小的力推你。走路、游泳、火箭发射都利用了这个原理。',
    analogy: '你拍桌子手会疼——你给桌子一个力，桌子也还你一个同样大小的力。力的作用永远是相互的。',
    example: '火箭往下喷射高速气体（作用力），气体就往上推火箭（反作用力），火箭就能飞上天了。' },
  { term: '波粒二象性', aliases: ['wave particle duality','波粒二象性'], field: '自然科学',
    short: '光和微观粒子既是波又是粒子，看你怎么观测',
    explanation: '波粒二象性是量子力学的核心发现之一。微观粒子（如光子、电子）同时具有"波"和"粒子"两种性质。当你在某些实验中观测它，它表现得像粒子（一颗一颗的弹珠）；换一种实验方式，它表现得像波（扩散的水波）。这取决于你怎么观测它。',
    analogy: '像一个既像圆柱又像长方体的物体：从侧面看是长方形，从上面看是圆形。你从哪个角度看，它就呈现什么形状。',
    example: '在双缝实验中，让电子一个一个通过两条缝隙，结果竟然出现了干涉条纹——这说明单个电子像波一样同时穿过了两条缝。' },
  { term: '暗物质', aliases: ['dark matter','暗物质','暗能量'], field: '自然科学',
    short: '看不见摸不着但占据了宇宙大部分质量的神秘物质',
    explanation: '暗物质是一种不发光、不吸收光、不与电磁波相互作用的物质，所以任何望远镜都看不到它。但科学家通过观测星系旋转速度等证据，发现宇宙中存在大量我们看不见的物质——它们的引力影响着可见天体的运动。暗物质约占宇宙总质能的27%，而我们能看到的所有物质只占5%。',
    analogy: '像一间房间里有隐形人在搬家具：你虽然看不到他们，但看到家具在移动，就知道肯定有什么东西在那儿。',
    example: '科学家发现银河系边缘的星星转得比预想的快——如果没有暗物质的额外引力拉着，这些星星早就飞走了。' },
  { term: '测不准原理', aliases: ['不确定性原理','海森堡','heisenberg'], field: '自然科学',
    short: '不可能同时精确知道粒子的位置和速度',
    explanation: '海森堡的不确定性原理指出：你不可能同时精确测量一个微观粒子的位置和速度（动量）。你测位置越准，速度就越模糊；测速度越准，位置就越模糊。这不是仪器不够好，而是宇宙本身的根本规律。',
    analogy: '像给高速运动的赛车拍照：快门快了，照片清晰但看不出运动方向；快门慢了，能看到运动轨迹但照片模糊。两者不可兼得。',
    example: '科学家想精确定位一个电子的位置，结果电子的速度就变得完全不确定了。这不是测量误差，是宇宙的基本法则。' },

  // ---- 计算机/IT（人工智能，已合并到上方计算机板块） ----
  { term: '机器学习', aliases: ['machine learning','ML','机器学习'], field: '计算机',
    short: '让电脑通过大量数据自己"学习规律"，而不是人工编程',
    explanation: '机器学习是AI的核心方法。传统编程是人写规则让电脑执行，机器学习是人给电脑大量数据，让电脑自己从中发现规律。比如你要教电脑识别猫，不需要写"有尖耳朵有胡须就是猫"的规则，而是给它看几万张猫的照片，它自己学会分辨。',
    analogy: '像教小孩认水果：你不会给他念"苹果是红色圆形的"，而是直接给他看一堆苹果，他自己就学会了什么是苹果。',
    example: '抖音的推荐算法通过机器学习你的观看习惯，越用越了解你喜欢的视频类型，推荐越来越准。' },
  { term: '深度学习', aliases: ['deep learning','深度神经网络'], field: '计算机',
    short: '用多层"人工神经网络"处理复杂数据的机器学习方法',
    explanation: '深度学习是机器学习的一种高级形式，使用多层的"人工神经网络"来处理数据。每一层负责提取不同层次的特征。比如识别一张人脸：第一层识别线条，第二层识别轮廓，第三层识别眼睛鼻子，最后一层识别人脸。层数越多越"深"，所以叫深度学习。',
    analogy: '像一个质检流水线：第一个工人检查零件，第二个检查组装，第三个检查功能...经过层层筛选，最终判定合格。',
    example: '人脸识别手机解锁就用深度学习：从拍照到识别你的面部特征，经过了数十层神经网络的处理。' },
  { term: '神经网络', aliases: ['neural network','人工神经网络','神经网络'], field: '计算机',
    short: '模仿人脑神经元连接结构的计算模型',
    explanation: '人工神经网络是模仿人脑中神经元连接方式的计算模型。人脑由大量神经元互相连接组成，人工神经网络则由大量"节点"互相连接组成。每个连接都有一个"权重"（重要程度），通过反复训练调整这些权重，网络就能学会识别模式。',
    analogy: '像一张渔网：节点是交叉点，连线是网线。信号从一端输入，经过网中的层层传递和加权，从另一端输出结果。',
    example: '语音助手（如Siri）用神经网络来理解你说的话：声音信号经过多层处理后，输出你说的文字。' },
  { term: '大语言模型', aliases: ['LLM','大模型','large language model','GPT'], field: '计算机',
    short: '读过海量文本的AI，能像人一样理解和生成语言',
    explanation: '大语言模型（LLM）是用海量文本数据训练出来的AI模型，比如ChatGPT、文心一言等。它通过学习数万亿字的文本，掌握了语言规律和大量知识。你问它问题，它不是在数据库里"搜索"答案，而是一个字一个字"预测"最可能的下一句话，从而生成通顺的回答。',
    analogy: '像读了整个图书馆的书的人：你问他任何问题，他都能根据自己的阅读"理解"来回答，虽然不是逐字背诵。',
    example: 'ChatGPT能帮你写邮件、写代码、翻译文章、回答问题，就是因为它作为大语言模型，已经"读"过了互联网上的海量文本。' },
  { term: '自然语言处理', aliases: ['NLP','自然语言处理','natural language processing'], field: '计算机',
    short: '让电脑理解和处理人类语言的技术',
    explanation: '自然语言处理（NLP）是AI中专门研究如何让电脑理解人类语言的领域。包括文字和语音两个方面：语音识别（语音转文字）、机器翻译、情感分析、文本摘要、问答系统等都是NLP的应用。它的目标是让电脑像人一样"听懂、看懂"语言。',
    analogy: '像教一个外国人中文：他需要学会拼音、语法、成语、方言...NLP就是教电脑这些"语言知识"。',
    example: '你用微信语音转文字功能，就是NLP在工作——它要把你的语音识别成文字，还要理解意思。' },
  { term: 'Transformer', aliases: ['transformer','注意力机制'], field: '计算机',
    short: '当前AI最核心的架构设计，是GPT和Bert的基础',
    explanation: 'Transformer是2017年Google提出的一种神经网络架构，目前几乎所有大语言模型都基于它。它的核心创新是"自注意力机制"——能让模型在处理一段文字时，关注到每一个词和其他所有词的关系，从而更好地理解上下文含义。',
    analogy: '像你读一句话"银行"时，你会根据上下文判断是"河边的银行"还是"存钱的银行"——Transformer的注意力机制就是在做这件事。',
    example: 'GPT-4、文心一言、通义千问等所有主流大模型，底层都是基于Transformer架构构建的。' },
  { term: '强化学习', aliases: ['reinforcement learning','RL','强化学习'], field: '计算机',
    short: 'AI通过不断试错来学习最优策略',
    explanation: '强化学习是让AI通过"试错"来学习的一种方法。AI在某个环境中做动作，做对了得奖励，做错了受惩罚。经过大量尝试，AI会学会什么样的策略能获得最多奖励。就像训练宠物：表现好给零食，表现不好不理它。',
    analogy: '像训练小狗：你让它坐下，它做到了你就给零食（奖励）。重复很多次后，小狗就学会了"坐下=有零食"。',
    example: 'AlphaGo就是用强化学习的——它和自己下了几千万盘棋，不断从胜负中学习，最终打败了世界围棋冠军。' },
  { term: '提示词工程', aliases: ['prompt engineering','提示词','prompt'], field: '计算机',
    short: '设计好的"提问方式"，让AI给出更好的回答',
    explanation: '提示词工程是指设计、优化给AI的指令（提示词），以获得更准确、更高质量的回答。同一个问题，不同的提问方式会导致截然不同的答案。好的提示词会明确角色、具体要求、输出格式等，让AI更精准地理解你的需求。',
    analogy: '像点菜：说"随便来个菜"和"来一份少油少盐的宫保鸡丁"，厨师给出的结果完全不同。提示词就是你的"精确点单"。',
    example: '问AI"写篇文章"vs"你是一个科技博主，写一篇500字通俗易懂地解释量子计算的文章，面向初中生"——后者就是好的提示词工程。' },
  { term: '多模态', aliases: ['multimodal','多模态AI','多模态模型'], field: '计算机',
    short: 'AI能同时处理文字、图片、声音、视频等多种类型的信息',
    explanation: '多模态AI是指能同时理解和处理多种类型数据（模态）的人工智能。传统的AI只能处理文字或只能处理图片，而多模态AI可以同时看图、读文、听声音。比如你可以给它一张照片问"这张图里发生了什么"，它能理解图片内容并用文字回答。',
    analogy: '像一个人能同时看、听、说、读。多模态AI就像这种"全感官"的人，而不是只能看或只能听的残障人士。',
    example: 'GPT-4o可以同时看你的屏幕截图、听你的语音、生成文字回答——这就是多模态能力。' },

  // ---- 心理 ----
  { term: 'PUA', aliases: ['pua','情感操控','精神控制'], field: '心理',
    short: '通过心理操控让对方对自己言听计从',
    explanation: 'PUA（Pick-Up Artist）原意是"搭讪艺术家"，后来泛指通过精神打压、情感操控来控制他人的行为。常见手段包括：不断否定你的价值→让你产生自我怀疑→让你觉得只有他/她能接受你→你变得完全依赖对方。本质是一种心理虐待，不仅限于恋爱关系。',
    analogy: '像温水煮青蛙：对方一开始对你特别好，慢慢开始挑毛病、贬低你，等你习惯了被否定，就觉得自己真的很差劲。',
    example: '老板总说你"能力不行、公司不缺你"，让你不敢提加薪也不敢辞职——这就是职场PUA。' },
  { term: '煤气灯效应', aliases: ['煤气灯','gaslighting','精神操控'], field: '心理',
    short: '通过不断歪曲事实让对方怀疑自己的记忆和判断力',
    explanation: '煤气灯效应是一种心理操控手段，源自一部老电影：丈夫偷偷调暗煤气灯，却告诉妻子"灯没变暗，是你记错了"。操控者不断否认事实、扭曲真相，让受害者逐渐怀疑自己的记忆、感知甚至理智，最终完全依赖操控者的"判断"。',
    analogy: '像有人把你手机时间偷偷调了1小时，然后坚持说"你的表坏了，现在就是10点"——反复这样，你真的会开始怀疑自己。',
    example: '伴侣明明说过"周六一起去吃饭"，到时却说"我从来没说过，你是不是记错了"——反复如此就是煤气灯效应。' },
  { term: '原生家庭', aliases: ['原生家庭创伤','原生家庭问题'], field: '心理',
    short: '一个人出生和成长的家庭，深刻影响性格和行为模式',
    explanation: '原生家庭指你出生和成长的家庭。心理学认为，一个人在原生家庭中与父母的互动方式，会深刻影响他日后的性格、婚恋观、人际交往模式。比如在缺爱环境中长大的孩子，成年后可能更容易焦虑型依恋。意识到原生家庭的影响，是改变不良模式的第一步。',
    analogy: '像你的出厂设置：手机出厂时预装的系统和默认设置，会影响你以后用手机的所有习惯。原生家庭就是你人生的"出厂设置"。',
    example: '小时候父母经常吵架的人，成年后在亲密关系中更容易对冲突感到恐惧——这就是原生家庭的影响。' },
  { term: '社恐', aliases: ['社交恐惧','社交恐惧症','social anxiety'], field: '心理',
    short: '在社交场合过度紧张害怕，怕被别人评价',
    explanation: '社恐（社交恐惧症）是指在与他人交往时产生强烈的焦虑和恐惧。核心症状是害怕被别人评价、怕出丑、怕被注视。程度轻的可能只是不喜欢当众发言，程度重的可能完全不敢出门。注意：普通人的"社恐"通常是性格内向或社交技能不足，和临床诊断的社交恐惧症不同。',
    analogy: '像站在聚光灯下：你觉得所有人都在看你、评判你的一举一动，其实大多数人根本没在意你。',
    example: '开会时老师突然叫你回答问题，你心跳加速、手心出汗、脑子一片空白——这就是社恐的典型反应。' },
  { term: '拖延症', aliases: ['拖延','procrastination'], field: '心理',
    short: '明知道该做但就是不想开始，总是拖到最后',
    explanation: '拖延症不是"懒"，而是一种情绪管理问题。研究表明，拖延的本质是回避与任务相关的负面情绪（焦虑、无聊、挫败感）。当你想到要写论文就焦虑，于是先刷手机缓解焦虑——但问题更严重了。打破拖延的关键是降低启动门槛（"只做5分钟"）。',
    analogy: '像推开一扇很重的门：站在门前觉得门特别沉不想推，但真正一推发现其实没那么重。拖延就是被想象中的困难吓住了。',
    example: '论文下周交，你每天都在想"明天一定开始写"，结果一直刷手机到最后一天晚上才通宵赶。' },
  { term: '习得性无助', aliases: ['learned helplessness','习得性无助'], field: '心理',
    short: '经历过反复失败后，变得消极放弃，即使有机会也不尝试',
    explanation: '习得性无助是心理学家塞利格曼通过实验发现的：被反复电击但无法逃脱的狗，后来即使打开了门，也不再尝试逃跑。在人类身上表现为：多次努力但都失败后，人会变得"无所谓"——不是真的不在乎，而是"觉得努力也没用"。',
    analogy: '像打游戏时被某个关卡虐了100次都没过，第101次你甚至懒得认真打了——因为你觉得"怎么努力都是输"。',
    example: '一个学生数学考试一直不及格，后来即使有了辅导老师，他也不再认真听课——因为他已经"习得"了"我学不会"的想法。' },
  { term: '旁观者效应', aliases: ['旁观者','bystander effect'], field: '心理',
    short: '人越多，每个人越觉得"会有别人去帮忙"，结果谁都没帮',
    explanation: '旁观者效应指在紧急情况下，在场人数越多，每个人主动帮忙的可能性反而越低。因为每个人都在想"这么多人，总有人会帮忙的"，结果所有人都这么想，导致没人行动。这也叫"责任分散效应"。',
    analogy: '像小组作业：5个人一组，每个人都觉得"其他人会做的"，结果没人动手，最后大家一起挂科。',
    example: '大街上有人晕倒了，围观的人很多但没人上前帮忙。不是因为冷漠，而是每个人都在想"别人会帮忙的"。' },
  { term: '群体思维', aliases: ['群体思维','groupthink','从众心理'], field: '心理',
    short: '为了维持团队和谐，大家不约而同地压制不同意见',
    explanation: '群体思维是指当一群人在做决策时，为了保持团结和一致性，大家会不自觉地压抑自己的不同意见，不去质疑"主流观点"。结果往往是做出糟糕的决定。这种现象在凝聚力强的团队、强势领导面前更容易发生。',
    analogy: '像全班同学都觉得老师说的答案是对的，你明明觉得不对但也不敢举手——怕被当成"异类"。全班一起交了错误答案就是群体思维。',
    example: '1961年美国"猪湾事件"中，总统顾问团中有人觉得计划有漏洞，但为了保持一致沉默了，导致入侵古巴行动惨败。' },

  // ---- 汽车/出行 ----
  { term: 'ABS', aliases: ['abs','防抱死系统','防抱死制动'], field: '汽车',
    short: '急刹车时防止车轮锁死，让你还能打方向盘',
    explanation: 'ABS（Anti-lock Braking System）是防抱死制动系统。当你急刹车时，没有ABS的车轮会"抱死"（停止转动并开始打滑），此时你无法控制方向。ABS会在刹车时快速"一松一紧"（每秒几十次），保持车轮边滚边刹，既缩短刹车距离又让你还能打方向盘避让。',
    analogy: '像跑步时急停：如果没有ABS就像整个人往前滑，控制不住方向；有ABS就像你还能在减速时拐弯避障。',
    example: '雨天开车突然遇到行人冲出来，你猛踩刹车并打方向盘避让——ABS确保你在刹车的同时还能转向。' },
  { term: '涡轮增压', aliases: ['turbo','涡轮','涡轮增压器'], field: '汽车',
    short: '利用废气推动涡轮，给发动机"额外充氧"提升动力',
    explanation: '涡轮增压是一种利用发动机排出的废气来驱动涡轮的技术。涡轮压缩更多空气送入发动机燃烧室，更多空气意味着可以燃烧更多燃料，从而产生更大动力。简单说就是"用废气当免费动力，给发动机加氧"，让小排量发动机也能输出大排量的动力。',
    analogy: '像给跑步运动员一个"氧气面罩"：有了额外氧气，他就能跑得更快更久。涡轮增压就是给发动机"加氧"。',
    example: '一台1.5T涡轮增压发动机的动力输出，可以接近甚至超过2.0L自然吸气发动机，而且日常驾驶更省油。' },
  { term: '底盘悬挂', aliases: ['悬挂','底盘','suspension'], field: '汽车',
    short: '连接车轮和车身的"弹簧系统"，决定舒适性和操控性',
    explanation: '底盘悬挂是连接车轮和车身的一套系统（弹簧+减震器），主要作用是吸收路面颠簸、保持车身稳定。悬挂偏软则舒适（过减速带不颠），但转弯时车身倾斜大；悬挂偏硬则操控好（转弯稳），但路面颠簸时比较颠。独立悬挂比非独立悬挂更好。',
    analogy: '像椅子的"弹簧坐垫"：好坐垫让你坐着舒服（过坑不颠），同时还能稳稳承重（转弯不晃）。悬挂就是汽车的"坐垫"。',
    example: '豪华车的悬挂偏软，过坑洼路面很舒服；运动车型的悬挂偏硬，过弯非常稳但颠簸感明显。' },
  { term: '扭矩', aliases: ['扭矩','torque','扭力'], field: '汽车',
    short: '发动机输出的"旋转力量"，决定起步和爬坡的劲',
    explanation: '扭矩是发动机曲轴输出的旋转力矩，单位是牛·米（N·m）。简单说就是"有多大的力气让轮子转起来"。扭矩越大，起步加速越猛、爬坡越有劲。马力决定最高速度，扭矩决定"爆发力"。买SUV看重扭矩（拉人拉货需要力气），买跑车看重马力（追求速度）。',
    analogy: '像搬重物：扭矩大的人能轻松搬起200斤（起步快、爬坡猛），马力大的人能持续跑得很快（高速快）。',
    example: '一台越野车扭矩400N·m，即使满载爬陡坡也毫不费力；一台小轿车扭矩150N·m，起步和爬坡就明显吃力。' },
  { term: '马力', aliases: ['马力','horsepower','功率'], field: '汽车',
    short: '衡量发动机功率的单位，马力越大最高速度越快',
    explanation: '马力是衡量发动机功率的传统单位（1马力≈735瓦）。简单说就是发动机能持续输出的"总能量"。马力越大，汽车的最高速度越快、高速超车越轻松。和扭矩的关系是：扭矩决定加速（爆发力），马力决定极速（持久力）。就像短跑看爆发力（扭矩），长跑看耐力（马力）。',
    analogy: '像人的体能：扭矩是"能跳多远"，马力是"能跑多久多快"。跳远选手扭矩大，马拉松选手马力大。',
    example: '家用车一般100-200马力够用，跑车300-500马力，超跑700马力以上。马力越大，高速公路上的后段加速越猛。' },
  { term: '百公里加速', aliases: ['零百加速','0-100加速','百公里加速'], field: '汽车',
    short: '从静止加速到100km/h所需时间，衡量汽车加速性能',
    explanation: '百公里加速是指汽车从静止状态（0km/h）加速到100km/h所需的时间，单位是秒。这是衡量汽车加速性能最常用的指标。数值越小越快：家用轿车一般8-12秒，性能车5-7秒，跑车3-4秒，超级跑车2-3秒，电动超跑（如特斯拉Model S Plaid）可以做到2秒出头。',
    analogy: '像百米赛跑成绩：用时越短说明爆发力越强。百公里加速就是汽车的"百米成绩"。',
    example: '一辆比亚迪秦PLUS百公里加速7.3秒，在红绿灯起步时能轻松甩开大部分普通家用车。' },
  { term: '四驱系统', aliases: ['四驱','4WD','AWD','四轮驱动'], field: '汽车',
    short: '四个轮子同时驱动，越野和雨雪路面更稳',
    explanation: '四驱系统是让汽车四个车轮都有驱动力的技术。普通两驱车只有两个轮子发力（前驱或后驱），四驱车四个轮子一起发力，抓地力更强。适合雨雪、泥泞、山路等复杂路况。分为分时四驱（可以手动切换两驱/四驱）、全时四驱（始终四轮驱动）和适时四驱（系统自动判断何时需要四驱）。',
    analogy: '像推桌子：两个人推（两驱）vs四个人推（四驱），四个人推肯定更稳、推力更大。四驱就是四个轮子一起出力。',
    example: '去东北雪地自驾，四驱SUV能稳稳行驶在积雪路面上，而两驱车很容易打滑失控。' },
  { term: '混合动力', aliases: ['混动','hybrid','混合动力车'], field: '汽车',
    short: '同时有燃油发动机和电动机，省油又没续航焦虑',
    explanation: '混合动力汽车同时搭载燃油发动机和电动机两种动力源。根据工作方式分为：油电混动（HEV，如丰田卡罗拉双擎，靠发动机和电机配合工作，不需要充电），插电混动（PHEV，可以外接充电，纯电续航通常50-150公里，没电了用油）。混动车市区堵车时用电机（省油且安静），高速时用发动机（效率高），两者互补。',
    analogy: '像一个运动员同时装备了两种"武器"：近战用刀（发动机），远程用弓（电动机）。根据场景选最合适的武器，效率最高。',
    example: '丰田凯美瑞混动版，百公里油耗仅4-5升，比纯燃油版省油40%，而且不需要找充电桩。' },

  // ---- 日常工具 ----
  { term: '游标卡尺', aliases: ['卡尺','游标卡尺'], field: '日常工具',
    short: '一种能精确测量长度和内外直径的量具',
    explanation: '游标卡尺是一种精密测量工具，可以测量物体的外径、内径、深度和台阶高度。它由主尺和游标尺两部分组成，通过两者的刻度差来实现比普通直尺更高的精度。常见的游标卡尺精度可达0.02毫米，比一张A4纸的厚度还细。',
    analogy: '像一把会读"小数点后两位"的超级尺子。普通尺子最小刻度是1毫米，它可以看到0.02毫米的细微差别。',
    example: '精密机械加工中，工人用游标卡尺测量零件直径是否在2.50mm到2.52mm的标准范围内。' },
  { term: '万用表', aliases: ['万能表','数字万用表','电表'], field: '日常工具',
    short: '能测电压、电流、电阻等多种电参数的仪表',
    explanation: '万用表是一种多功能电子测量仪器，最基本的功能是测电压（多少伏）、测电流（多少安）和测电阻（多少欧）。高级型号还能测电容、频率、温度等。分为指针式和数字式两种，现在普遍使用数字万用表，读数直观方便。',
    analogy: '像医生用的听诊器：听诊器能听心跳、呼吸，万用表能"听"电路中的电压、电流——是电工和电子爱好者的"诊断工具"。',
    example: '手机充不上电，用万用表测量充电线两端电压，就能判断是充电器坏了还是线断了。' },
  { term: '电钻', aliases: ['手电钻','冲击钻','电钻'], field: '日常工具',
    short: '用电机驱动的钻孔和拧螺丝工具',
    explanation: '电钻是以电动机为动力源的钻孔工具。家用电钻通常可以更换多种钻头（钻木头、金属、瓷砖）和批头（拧螺丝）。冲击钻功能更强的型号还能钻水泥墙。电钻让原本需要很大力气的手动钻孔工作变得轻松高效。',
    analogy: '像一台小型"挖掘机器人"：你轻轻按住开关，它自己就在墙上、木板上快速打出一个整齐的洞。',
    example: '家里挂装饰画时，用电钻在墙上打两个洞，装上膨胀螺丝，比用手拧螺丝轻松十倍。' },
  { term: '激光测距仪', aliases: ['测距仪','激光尺','激光测距'], field: '日常工具',
    short: '用激光光束精确测量两点间距离的工具',
    explanation: '激光测距仪通过发射一束不可见的激光，激光遇到目标后反射回来，仪器计算激光往返的时间来精确测出距离。精度可达毫米级，测量范围从几厘米到上百米。比传统卷尺更快、更准，尤其测远距离时优势巨大。',
    analogy: '像一个会"算数"的手电筒：你照向对面墙壁，它立刻告诉你距离有多远——不需要走过去量。',
    example: '装修量房时，站在房间一头，用激光测距仪对准对面墙壁一按，立刻显示房间长5.32米。' },
  { term: '热熔胶枪', aliases: ['胶枪','热熔胶','热熔枪'], field: '日常工具',
    short: '用电加热融化胶棒，挤出来就能粘东西的便携工具',
    explanation: '热熔胶枪是一种便携式的粘接工具。它通过电加热把固态的胶棒融化成液态胶，从枪嘴挤出来后涂在需要粘合的物体上。胶在几秒钟内冷却凝固，就能把两个东西牢牢粘在一起。粘得牢、速度快、不用等，而且不留痕迹。',
    analogy: '像一个会"吐泡泡糖"的笔：按下扳机挤出融化的胶，涂在两个东西之间，几秒钟后胶变硬，就把它们粘在一起了。',
    example: '手工DIY时，用热熔胶枪可以快速把纽扣、丝带、装饰花固定在发卡或相框上。' },

  // ---- 学习 ----
  { term: '费曼学习法', aliases: ['费曼技巧','费曼方法','feynman technique'], field: '学习',
    short: '用"教给别人"的方式来检验自己是否真的学会了',
    explanation: '费曼学习法是诺贝尔物理学奖得主理查德·费曼提出的学习方法。核心理念是：如果你不能用简单直白的语言把一个概念讲给完全不懂的人听，说明你自己也没真正理解。通过"讲给别人听→发现盲区→回去学→再讲"的循环，实现深度理解。',
    analogy: '像给8岁小孩讲股票：你讲着讲着发现自己卡住了——那说明你自己也没搞懂。卡住的地方就是你的学习盲区。',
    example: '学完了相对论，试着给朋友讲清楚"为什么速度越快时间越慢"。讲不通的地方就是你还需要再学的地方。' },
  { term: '艾宾浩斯遗忘曲线', aliases: ['遗忘曲线','艾宾浩斯','ebbinghaus'], field: '学习',
    short: '揭示了人学完后会快速遗忘，间隔复习才能记住的规律',
    explanation: '艾宾浩斯遗忘曲线是心理学家艾宾浩斯发现的记忆规律。他发现：刚学完的东西，20分钟后大约忘记40%，1小时后忘记56%，1天后忘记74%，1个月后忘记79%。但这个遗忘是可以对抗的——在遗忘的关键时间点（1天、3天、7天、15天）进行复习，就能把短期记忆转化为长期记忆。',
    analogy: '像往一个有漏洞的桶里倒水：刚倒进去的水漏得最快。每隔一段时间补一点水，桶里的水就能保持满的状态。',
    example: '背单词App（如墨墨背单词）就是根据艾宾浩斯曲线，在你快要忘记某个单词时自动弹出复习。' },
  { term: '番茄工作法', aliases: ['番茄钟','pomodoro','番茄工作法'], field: '学习',
    short: '工作25分钟休息5分钟，用计时器保持专注的时间管理方法',
    explanation: '番茄工作法是一种简单有效的时间管理技术。设定一个25分钟的计时器，在这25分钟内只做一件事（不被手机、消息打断），计时器响后休息5分钟。每完成4个"番茄"（约2小时），进行一次15-30分钟的长休息。它能帮你克服拖延、保持专注。',
    analogy: '像短跑比赛：全力冲刺25米（专注工作），然后停下来喘口气（休息5分钟），再冲刺下一段。比一直慢跑效率高得多。',
    example: '写作业时，设一个25分钟番茄钟，期间手机放另一个房间。25分钟后站起来喝杯水、伸个懒腰，再开始下一个番茄。' },
  { term: '思维导图', aliases: ['mind map','思维导图','脑图'], field: '学习',
    short: '用中心主题+分支节点的图形方式来整理和记忆知识',
    explanation: '思维导图是一种图形化的知识整理工具。以一个核心概念为中心，向外辐射出多个分支，每个分支再细分出子分支。用关键词、颜色、图像来呈现信息，符合人脑联想记忆的特点。它比线性笔记更直观，更容易建立知识之间的联系。',
    analogy: '像一棵树：树干是核心主题，大枝是主要分类，小枝是具体知识点。一眼就能看到整棵树的结构和每片叶子（知识点）长在哪儿。',
    example: '复习历史时，以"第二次世界大战"为中心，分出"起因""主要战役""关键人物""结果与影响"四个分支，每个分支再展开细节。' },
  { term: '刻意练习', aliases: ['deliberate practice','刻意训练'], field: '学习',
    short: '有明确目标、有反馈、不断挑战舒适区的练习方式',
    explanation: '刻意练习是心理学家安德斯·艾利克森提出的概念。它不是简单的"重复做"，而是：1)有清晰的目标；2)全身心专注；3)及时获得反馈；4)不断挑战略高于当前能力的任务。普通练习只是重复已知，刻意练习是不断突破边界。',
    analogy: '像运动员训练：不是每天跑一样的圈数，而是每天把速度提高一点点、增加负重一点点，教练在旁指出动作哪里不对。',
    example: '练钢琴不是每天弹同一首曲子10遍，而是专门攻克最困难的几个小节，录音对比大师版本找差距。' },

  // ---- 生活 ----
  { term: '五险一金', aliases: ['社保','五险一金','社保公积金'], field: '生活',
    short: '工作单位帮你缴纳的五种保险+住房公积金',
    explanation: '"五险"指的是五种社会保险：养老保险（退休后领养老金）、医疗保险（看病报销）、失业保险（失业领补助）、工伤保险（工伤赔偿）、生育保险（产假津贴）。"一金"是住房公积金，可以低利率贷款买房。这"五险一金"通常由单位和个人共同缴纳。',
    analogy: '像每个月存一笔"安全基金"：养老保险是"退休存钱罐"，医保是"看病省钱卡"，公积金是"买房专用账户"。',
    example: '小王月薪1万，每月五险一金个人部分约扣2000元，单位还要额外再交3000元左右。' },
  { term: '公摊面积', aliases: ['公摊','公摊面积'], field: '生活',
    short: '你买的房子里，电梯、走廊等公共区域分摊到你家的面积',
    explanation: '公摊面积是指商品房中，整栋楼的公共部分（如电梯井、楼梯间、走廊、大堂、设备间等）按比例分摊到每户的建筑面积。你房产证上的面积=套内面积（你实际住的）+公摊面积。公摊比例越低越划算，一般高层住宅公摊在20-25%左右。',
    analogy: '像合租房子里的客厅和厨房：你虽然不住在客厅里，但你也得为客厅的面积付房租。公摊就是"你为这个楼的公共空间付的面积费"。',
    example: '你买的房子建筑面积100平米，套内面积78平米，那公摊面积就是22平米（公摊率22%）。' },
  { term: '信用卡账单日', aliases: ['账单日','还款日','信用卡账单'], field: '生活',
    short: '银行每月生成账单和计算还款日的固定日期',
    explanation: '信用卡有两个重要日期：账单日是银行每月统计你这期消费金额的日期；还款日是你必须还清（或最低还款）的截止日期。两个日期间通常有20天左右。在账单日第二天消费，可以享受最长的免息期（约50天）。聪明用卡能最大化资金利用率。',

// Build lookup index
const LOCAL_INDEX = {};
LOCAL_DB.forEach(entry => {
  const keys = [entry.term.toLowerCase(), ...entry.aliases.map(a => a.toLowerCase())];
  keys.forEach(k => { LOCAL_INDEX[k] = entry; });
});

// Build category -> field mapping and field -> entries index
const CATEGORY_FIELD_MAP = {
  cs: '计算机', science: '自然科学', finance: '金融',
  law: '法律', psychology: '心理', car: '汽车',
  life: '生活', study: '学习', entertainment: '娱乐', tool: '日常工具',
};
const LOCAL_BY_FIELD = {};
LOCAL_DB.forEach(entry => {
  const f = entry.field || '未知';
  if (!LOCAL_BY_FIELD[f]) LOCAL_BY_FIELD[f] = [];
  LOCAL_BY_FIELD[f].push(entry.term);
});

function searchLocal(term) {
  const key = term.toLowerCase().trim();
  return LOCAL_INDEX[key] || null;
}

function getRandomTermByCategory(catId) {
  let pool = [];
  if (catId === 'all') {
    pool = LOCAL_DB.map(e => e.term);
  } else {
    const fieldName = CATEGORY_FIELD_MAP[catId];
    if (fieldName && LOCAL_BY_FIELD[fieldName]) {
      pool = LOCAL_BY_FIELD[fieldName];
    }
  }
  return pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : null;
}

// ============ Load Settings ============
function loadSettings() {
  updateModeBar();
}

function updateModeBar() {
  const bar = document.getElementById('modeBar');
  const apiKey = localStorage.getItem('api_key');
  if (apiKey) {
    bar.innerHTML = '<span class="mode-tag online">联网模式（AI 驱动）</span>';
  } else {
    bar.innerHTML = '<span class="mode-tag offline">离线模式（内置词库 ' + LOCAL_DB.length + ' 个术语）</span>';
  }
}
