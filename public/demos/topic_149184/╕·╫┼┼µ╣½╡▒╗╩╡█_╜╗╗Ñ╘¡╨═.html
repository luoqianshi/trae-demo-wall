function circleRectIntersect(cx,cy,radius,rx,ry,rw,rh){
  const closestX=Math.max(rx,Math.min(cx,rx+rw));
  const closestY=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-closestX,dy=cy-closestY;
  return dx*dx+dy*dy<radius*radius;
}

function getGridPos(clientX,clientY){
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width;
  const scaleY=canvas.height/rect.height;
  return {col:Math.floor((clientX-rect.left)*scaleX/CW),row:Math.floor((clientY-rect.top)*scaleY/CH)};
}

function isValidPlacement(col,row,exclude,unitType){
  if(col<0||col>=COLS||row<0||row>=ROWS)return false;
  const type=unitType||(exclude?exclude.type:null)||selectedUnit;
  const isWeapon=type==='weapon';
  const size=(!isWeapon&&type&&unitTypes[type])?(unitTypes[type].size||1):1;
  if(col+size>COLS||row+size>ROWS)return false;
  for(let r=row;r<row+size;r++){
    for(let c=col;c<col+size;c++){
      if(levels[currentLevel].path.some(p=>p[0]===c&&p[1]===r))return false;
      if(units.find(u=>{
        if(u===exclude)return false;
        const uSize=unitTypes[u.type]?.size||1;
        return r>=u.row&&r<u.row+uSize&&c>=u.col&&c<u.col+uSize;
      }))return false;
      if(placedWeapons.find(w=>w.col===c&&w.row===r))return false;
    }
  }
  return true;
}

function placeUnit(col,row,type){
  const cfg=unitTypes[type];
  const size=cfg.size||1;
  units.push({type,col,row,x:col*CW+CW*size/2,y:row*CH+CH*size/2,cooldown:0,hp:cfg.hp,maxHp:cfg.hp,hasCrit:false});
}

function placeWeapon(col,row,weaponName){
  const wDef=weaponTypes[weaponName];
  if(!wDef)return false;
  const generalOnField=units.find(u=>unitTypes[u.type]?.isGeneral&&u.type===wDef.general);
  if(!generalOnField)return false;
  const existing=placedWeapons.find(w=>w.generalName===wDef.general);
  if(existing)return false;
  const dc=Math.abs(col-generalOnField.col);
  const dr=Math.abs(row-generalOnField.row);
  if(!((dc===1&&dr===0)||(dc===0&&dr===1)))return false;
  if(!isValidPlacement(col,row,null,'weapon'))return false;
  placedWeapons.push({weaponName:weaponName,rank:wDef.rank,generalName:wDef.general,effectType:wDef.effectType,col:col,row:row,x:col*CW+CW/2,y:row*CH+CH/2,color:wDef.color});
  return true;
}

// --- Input ---
function handleMouseDown(e){
  if(gameState!=='deploy'&&gameState!=='wavePause'&&gameState!=='battle')return;
  const pos=getGridPos(e.clientX,e.clientY);
  if(pos.col<0||pos.col>=COLS||pos.row<0||pos.row>=ROWS)return;
  const existing=units.find(u=>{
    const uSize=unitTypes[u.type]?.size||1;
    return pos.col>=u.col&&pos.col<u.col+uSize&&pos.row>=u.row&&pos.row<u.row+uSize;
  });
  if(existing){dragUnit=existing;dragStartCol=existing.col;dragStartRow=existing.row;isDragging=true;return;}
  // 武器放置
  if(selectedWeapon&&!existing){
    const placed=placeWeapon(pos.col,pos.row,selectedWeapon);
    if(placed){selectedWeapon=null;updateWeaponButtons();render();return;}
  }
  // 武器拖拽检测
  const clickedWeapon=placedWeapons.find(w=>w.col===pos.col&&w.row===pos.row);
  if(clickedWeapon&&!existing){dragWeapon=clickedWeapon;dragStartCol=clickedWeapon.col;dragStartRow=clickedWeapon.row;isDragging=true;return;}
  if(!selectedUnit)return;
  if(!isValidPlacement(pos.col,pos.row,null))return;
  const cfg=unitTypes[selectedUnit];
  if(money<cfg.cost)return;
  money-=cfg.cost;
  document.getElementById('game-money').textContent=money;
  placeUnit(pos.col,pos.row,selectedUnit);
  updateUnitButtons();
  render();
}

function handleMouseMove(e){
  const pos=getGridPos(e.clientX,e.clientY);
  hoverCol=pos.col;hoverRow=pos.row;
  if(isDragging&&dragWeapon&&isValidPlacement(pos.col,pos.row,null,'weapon')){
    dragWeapon.col=pos.col;dragWeapon.row=pos.row;
    dragWeapon.x=pos.col*CW+CW/2;dragWeapon.y=pos.row*CH+CH/2;
  }
  if(isDragging&&dragUnit&&isValidPlacement(pos.col,pos.row,dragUnit)){
    dragUnit.col=pos.col;dragUnit.row=pos.row;
    const cfg=unitTypes[dragUnit.type];
    const size=cfg.size||1;
    dragUnit.x=pos.col*CW+CW*size/2;dragUnit.y=pos.row*CH+CH*size/2;
  }
  render();
}

function handleMouseUp(e){
  if(isDragging&&dragWeapon){
    const generalUnit=units.find(u=>u.type===dragWeapon.generalName);
    if(generalUnit){
      const dc=Math.abs(dragWeapon.col-generalUnit.col);
      const dr=Math.abs(dragWeapon.row-generalUnit.row);
      const isAdj=(dc===1&&dr===0)||(dc===0&&dr===1);
      if(!isAdj||!isValidPlacement(dragWeapon.col,dragWeapon.row,null,'weapon')){
        dragWeapon.col=dragStartCol;dragWeapon.row=dragStartRow;
        dragWeapon.x=dragStartCol*CW+CW/2;dragWeapon.y=dragStartRow*CH+CH/2;
      }
    }
    isDragging=false;dragWeapon=null;render();return;
  }
  if(!isDragging||!dragUnit){isDragging=false;dragUnit=null;render();return;}
  const pos=getGridPos(e.clientX,e.clientY);
  if(pos.col===dragStartCol&&pos.row===dragStartRow||!isValidPlacement(pos.col,pos.row,dragUnit)){
    dragUnit.col=dragStartCol;dragUnit.row=dragStartRow;
    const cfg=unitTypes[dragUnit.type];const size=cfg.size||1;
    dragUnit.x=dragStartCol*CW+CW*size/2;dragUnit.y=dragStartRow*CH+CH*size/2;
  }
  isDragging=false;dragUnit=null;
  render();
}

function handleTouchStart(e){
  e.preventDefault();
  if(gameState!=='deploy'&&gameState!=='wavePause'&&gameState!=='battle')return;
  const t=e.touches[0];const pos=getGridPos(t.clientX,t.clientY);
  if(pos.col<0||pos.col>=COLS||pos.row<0||pos.row>=ROWS)return;
  const existing=units.find(u=>{
    const uSize=unitTypes[u.type]?.size||1;
    return pos.col>=u.col&&pos.col<u.col+uSize&&pos.row>=u.row&&pos.row<u.row+uSize;
  });
  if(existing){dragUnit=existing;dragStartCol=existing.col;dragStartRow=existing.row;isDragging=true;return;}
  // 武器放置
  if(selectedWeapon&&!existing){
    const placed=placeWeapon(pos.col,pos.row,selectedWeapon);
    if(placed){selectedWeapon=null;updateWeaponButtons();render();return;}
  }
  // 武器拖拽检测
  const clickedWeapon=placedWeapons.find(w=>w.col===pos.col&&w.row===pos.row);
  if(clickedWeapon&&!existing){dragWeapon=clickedWeapon;dragStartCol=clickedWeapon.col;dragStartRow=clickedWeapon.row;isDragging=true;return;}
  if(!selectedUnit)return;
  if(!isValidPlacement(pos.col,pos.row,null))return;
  const cfg=unitTypes[selectedUnit];
  if(money<cfg.cost)return;
  money-=cfg.cost;document.getElementById('game-money').textContent=money;
  placeUnit(pos.col,pos.row,selectedUnit);
  updateUnitButtons();
  render();
}

// --- UI ---
function updateUnitButtons(){
  const bar=document.getElementById('game-unit-bar');bar.innerHTML='';
  const lv=currentLevel;
  const baseUnits=lv===1?['兵','弓']:lv===2?['兵','弓','弩']:['兵','弓','弩','骑'];
  const unlockedGenerals=GAME_DATA.generals.filter(g=>g.name!=='刘邦'&&g.unlock<=lv).map(g=>g.name);
  const available=[...baseUnits,...unlockedGenerals];
  available.forEach(name=>{
    const cfg=unitTypes[name];
    if(!cfg)return;
    const btn=document.createElement('button');
    btn.className='game-unit-btn'+(selectedUnit===name?' active':'')+(money<cfg.cost?' disabled':'');
    btn.textContent=name+' ('+cfg.cost+'💰)';
    btn.onclick=()=>{selectedUnit=selectedUnit===name?null:name;updateUnitButtons();};
    bar.appendChild(btn);
  });
}

function updateWeaponButtons(){
  const bar=document.getElementById('game-weapon-bar');
  if(!bar)return;
  bar.innerHTML='';
  placedWeapons.forEach(w=>{
    const btn=document.createElement('span');
    btn.className='game-weapon-tag rank-'+w.rank;
    btn.textContent=w.weaponName;
    bar.appendChild(btn);
  });
  units.forEach(u=>{
    if(!unitTypes[u.type]?.isGeneral)return;
    const gd=GAME_DATA.generals.find(g=>g.name===u.type);
    if(!gd)return;
    const placed=placedWeapons.find(w=>w.generalName===u.type);
    if(placed)return;
    gd.weapons.forEach(w=>{
      const btn=document.createElement('button');
      btn.className='game-weapon-btn'+(selectedWeapon===w.name?' active':'');
      btn.innerHTML='<span class="weapon-rank-dot rank-'+w.rank+'">'+w.rank+'</span> '+w.name;
      btn.onclick=()=>{selectedWeapon=selectedWeapon===w.name?null:w.name;updateWeaponButtons();};
      bar.appendChild(btn);
    });
  });
}

function updateWavesUI(){
  const info=document.getElementById('game-waves-info');info.innerHTML='';
  for(let i=0;i<totalWaves;i++){
    const dot=document.createElement('div');
    dot.className='game-wave-dot'+(i<currentWave?' done':'')+(i===currentWave?' current':'');
    dot.textContent=i+1;info.appendChild(dot);
  }
}

// --- Game Loop ---
function startBattle(){
  if(units.length===0)return;
  gameState='battle';currentWave=0;gameOver=false;
  document.getElementById('btn-start-battle').disabled=true;
  document.getElementById('btn-start-battle').textContent='⚔️ 战斗中...';
  updateWavesUI();
  lastTime=Date.now();
  gameLoop();
}

function gameLoop(){
  if(gameState==='victory'||gameState==='defeat')return;
  const now=Date.now();
  const dt=Math.min(now-lastTime,100);
  lastTime=now;
  try{
    update(dt);
    render();
  }catch(err){
    console.error('GAME LOOP ERROR:',err.message,err.stack);
    return;
  }
  setTimeout(gameLoop,16);
}

function update(dt){
  if(gameState!=='battle'||gameOver)return;
  if(!isSpawning&&currentWave<totalWaves&&enemies.length===0){
    isSpawning=true;spawnTimer=0;
  }
  if(isSpawning){
    spawnTimer+=dt;
    const wave=levels[currentLevel].waves[currentWave];
    if(!spawnTracker[currentWave])spawnTracker[currentWave]=new Array(wave.length).fill(false);
    const groups=spawnTracker[currentWave];
    let spawnIdx=0;
    let globalSpawnCount=0;
    for(let i=0;i<wave.length;i++){
      spawnIdx+=wave[i].n*800;
      if(spawnTimer<spawnIdx)break;
      if(!groups[i]){
        groups[i]=true;
        const path=levels[currentLevel].path;
        for(let k=0;k<wave[i].n;k++){
          enemies.push({
            ...enemyTypes[wave[i].t],
            type:wave[i].t,
            x:path[0][0]*CW+CW/2,
            y:path[0][1]*CH+CH/2 - (globalSpawnCount)*CH*1.5,
            pathIndex:0,
            progress:-globalSpawnCount*3.0,
            spawnDelay:0,
            hp:enemyTypes[wave[i].t].hp
          });
          globalSpawnCount++;
        }
      }
    }
    if(groups.every(Boolean)){
      isSpawning=false;
      if(currentWave<totalWaves-1){
        gameState='wavePause';
        setTimeout(()=>{currentWave++;gameState='battle';updateWavesUI();},1000);
      }else{currentWave++;updateWavesUI();}
    }
  }

  updateEnemies(dt);
  updateUnits(dt);
  checkWinLose();
}

function updateEnemies(dt){
  const path=levels[currentLevel].path;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    // progress < 0 means waiting to enter path
    if(e.progress<0){
      e.progress+=e.speed*dt/1000;
      // Position above path start, spaced by order
      const waitOrder=Math.abs(Math.ceil(e.progress));
      e.x=path[0][0]*CW+CW/2;
      e.y=path[0][1]*CH+CH/2 - (waitOrder+1)*CH*1.5;
      e.pathIndex=0;
      continue;
    }
    // ---- Debuff state decay ----
    if(e.slowTimer>0){e.slowTimer-=dt;}else{e.slowFactor=1.0;}
    if(e.vulnTimer>0){e.vulnTimer-=dt;}else{e.vulnFactor=1.0;}
    if(e.armorTimer>0){e.armorTimer-=dt;}else{e.armorDebuff=undefined;e.armorTimer=undefined;}
    if(e.stunTimer>0){e.stunTimer-=dt;}
    if(e.confuseTimer>0){e.confuseTimer-=dt;}
    if(e.bleedTimer>0){
      e.bleedTimer-=dt;
      if(!e.bleedTick)e.bleedTick=0;
      e.bleedTick+=dt;
      if(e.bleedTick>=1000){e.hp-=e.bleedDmg||0;e.bleedTick-=1000;}
    }
    // ---- Movement with debuff effects ----
    if(e.stunTimer>0){
      // 眩晕/冻结：不移动
    }else{
      const spdMul=e.slowFactor||1.0;
      if(e.confuseTimer>0){
        e.progress-=e.speed*spdMul*dt/1000; // 混乱：反向移动
      }else{
        e.progress+=e.speed*spdMul*dt/1000;
      }
    }
    const totalCells=path.length;
    if(e.progress>=totalCells){
      enemies.splice(i,1);
      if(!gameOver){gameState='defeat';showResult(false);}
      continue;
    }
    if(e.progress<0){e.progress=0;e.pathIndex=0;continue;}
    const idx=Math.floor(e.progress);
    const frac=e.progress-idx;
    const from=path[Math.min(idx,totalCells-1)];
    let to;
    if(idx>=totalCells-1){
      const last=path[totalCells-1];
      const prev=path[totalCells-2];
      to=[last[0]+(last[0]-prev[0]),last[1]+(last[1]-prev[1])];
    }else{
      to=path[idx+1];
    }
    e.x=(from[0]+(to[0]-from[0])*frac)*CW+CW/2;
    e.y=(from[1]+(to[1]-from[1])*frac)*CH+CH/2;
    e.pathIndex=idx;
  }
  // Anti-overlap: sort by progress, enforce minimum gap
  const activeEnemies=enemies.filter(e=>e.progress>=0);
  activeEnemies.sort((a,b)=>a.progress-b.progress);
  for(let i=1;i<activeEnemies.length;i++){
    const prev=activeEnemies[i-1];
    const curr=activeEnemies[i];
    const minGap=1.0; // minimum 1 cell gap between enemies
    if(curr.progress-prev.progress<minGap){
      curr.progress=prev.progress+minGap;
      // Recalculate position
      const totalCells=path.length;
      if(curr.progress>=totalCells){
        // Don't splice here, will be caught next frame
      }else{
        const idx=Math.floor(curr.progress);
        const frac=curr.progress-idx;
        const from=path[Math.min(idx,totalCells-1)];
        let to;
        if(idx>=totalCells-1){
          const last=path[totalCells-1];
          const prevp=path[totalCells-2];
          to=[last[0]+(last[0]-prevp[0]),last[1]+(last[1]-prevp[1])];
        }else{
          to=path[idx+1];
        }
        curr.x=(from[0]+(to[0]-from[0])*frac)*CW+CW/2;
        curr.y=(from[1]+(to[1]-from[1])*frac)*CH+CH/2;
        curr.pathIndex=idx;
      }
    }
  }
}

function getUnitWeaponBonus(unitType){
  const cfg=unitTypes[unitType];
  if(!cfg||!cfg.isGeneral)return {atkMul:1.0,rangeAdd:0,speedMul:1.0,hasWeapon:false};
  // Find the unit on the battlefield
  const generalUnit=units.find(u=>u.type===unitType);
  if(!generalUnit)return {atkMul:1.0,rangeAdd:0,speedMul:1.0,hasWeapon:false};
  // Check if any placed weapon is adjacent (4-direction)
  const weapon=placedWeapons.find(w=>{
    const dc=Math.abs(w.col-generalUnit.col);
    const dr=Math.abs(w.row-generalUnit.row);
    return (dc===1&&dr===0)||(dc===0&&dr===1);
  });
  if(!weapon)return {atkMul:1.0,rangeAdd:0,speedMul:1.0,hasWeapon:false};
  const rankBonus=WEAPON_RANK_BONUS[weapon.rank]||{speedMul:1.0};
  return {
    atkMul:WEAPON_ADJACENT_BUFF.atkMul,
    rangeAdd:cfg.range, // range equals base range to achieve double
    speedMul:rankBonus.speedMul,
    hasWeapon:true,
    weapon:weapon
  };
}

function getUnitWeaponColor(unitType){
  const cfg=unitTypes[unitType];
  if(!cfg||!cfg.isGeneral)return {rank:'白',color:'#c0c0c0',glow:'rgba(192,192,192,0.3)'};
  const generalUnit=units.find(u=>u.type===unitType);
  if(!generalUnit)return {rank:'白',color:'#c0c0c0',glow:'rgba(192,192,192,0.3)'};
  const weapon=placedWeapons.find(w=>{
    const dc=Math.abs(w.col-generalUnit.col);
    const dr=Math.abs(w.row-generalUnit.row);
    return (dc===1&&dr===0)||(dc===0&&dr===1);
  });
  if(!weapon)return {rank:'白',color:'#c0c0c0',glow:'rgba(192,192,192,0.3)'};
  if(weapon.rank==='金')return {rank:'金',color:'#d4a843',glow:'rgba(212,168,67,0.4)'};
  if(weapon.rank==='绿')return {rank:'绿',color:'#6b9e6b',glow:'rgba(107,158,107,0.35)'};
  return {rank:'白',color:'#c0c0c0',glow:'rgba(192,192,192,0.3)'};
}

function updateUnits(dt){
  units.forEach(unit=>{
    if(unit.cooldown>0)unit.cooldown-=dt;
    const cfg=unitTypes[unit.type];
    const bonus=getUnitWeaponBonus(unit.type);
    let effectiveAttack=Math.round(cfg.attack*bonus.atkMul);
    let effectiveRange=cfg.range+bonus.rangeAdd;
    let effectiveSpeed=Math.round(cfg.speed*bonus.speedMul);
    // Find all enemies in attack range
    const targets=[];
    enemies.forEach(enemy=>{
      const range=effectiveRange*Math.min(CW,CH);
      const dx=enemy.x-unit.x;
      const dy=enemy.y-unit.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<=range+Math.min(CW,CH)*0.8)targets.push(enemy);
    });
    if(targets.length>0&&unit.cooldown<=0){
      const closest=targets.reduce((a,b)=>{
        const da=(a.x-unit.x)**2+(a.y-unit.y)**2;
        const db=(b.x-unit.x)**2+(b.y-unit.y)**2;
        return da<db?a:b;
      });
      unit.attackAngle=Math.atan2(closest.y-unit.y,closest.x-unit.x);
      const singleTargetTypes=['弓','兵'];
      const attackTargets=singleTargetTypes.includes(unit.type)?[closest]:targets;
      attackTargets.forEach(target=>{
        let dmg=effectiveAttack;
        // 曹参：首击倍率
        if(cfg.effectType==='crit_flash'&&bonus.hasWeapon&&!unit.hasCrit){dmg*=3;unit.hasCrit=true;}
        else if(cfg.effectType==='crit_flash'&&!unit.hasCrit){dmg*=2;unit.hasCrit=true;}

        // ===== 武将被动：对敌人效果（仅当佩戴武器时触发）=====
        if(cfg.isGeneral && bonus.hasWeapon){
          switch(cfg.effectType){
            case 'sword_arc': // 刘邦：减速30%，2秒
              target.slowFactor = 0.7; target.slowTimer = 2000;
              break;
            case 'rune_circle': // 萧何：易伤+25%，3秒
              target.vulnFactor = 1.25; target.vulnTimer = 3000;
              break;
            case 'quake_slam': // 樊哙：25%眩晕0.8秒
              if(Math.random() < 0.25) target.stunTimer = 800;
              break;
            case 'crit_flash': // 曹参：首次攻击命中破甲-40%，持续4秒
              if(!unit.hasCritApplied){ target.armorDebuff = 1.4; target.armorTimer = 4000; unit.hasCritApplied = true; }
              break;
            case 'rain_of_blades': // 韩信：30%溅射伤害50%
              if(Math.random() < 0.3){
                enemies.forEach(e => {
                  if(e !== target && e.hp > 0){
                    const dxe = e.x - target.x, dye = e.y - target.y;
                    if(Math.sqrt(dxe*dxe + dye*dye) < Math.min(CW, CH) * 1.5){
                      e.hp -= Math.round(dmg * 0.5);
                    }
                  }
                });
              }
              break;
            case 'scroll_wisdom': // 张良：30%混乱（反向移动），1.5秒
              if(Math.random() < 0.3){
                target.armorDebuff = 1.2; target.armorTimer = 3000;
                target.confuseTimer = 1500;
              }
              break;
            case 'smash_burst': // 周勃：减速40%，2.5秒
              target.slowFactor = 0.6; target.slowTimer = 2500;
              break;
            case 'cavalry_charge': // 灌婴：流血（每秒15%攻击伤害），3秒
              target.bleedDmg = Math.round(effectiveAttack * 0.15);
              target.bleedTimer = 3000;
              break;
            case 'arrow_volley': // 彭越：20%冻结1秒
              if(Math.random() < 0.2) target.stunTimer = 1000;
              break;
            case 'blood_whirl': // 英布：击杀冲击波（后文处理）
              break;
          }
        }

        // Apply armor debuff (破甲)
        if(target.armorDebuff && target.armorTimer > 0) dmg = Math.round(dmg * target.armorDebuff);
        // Apply vulnerability (易伤)
        if(target.vulnFactor && target.vulnTimer > 0) dmg = Math.round(dmg * target.vulnFactor);
        target.hp -= dmg;

        // 英布：击杀冲击波（对周围敌人80%伤害）
        if(target.hp <= 0 && cfg.effectType === 'blood_whirl' && bonus.hasWeapon){
          enemies.forEach(e => {
            if(e !== target && e.hp > 0){
              const dxe = e.x - target.x, dye = e.y - target.y;
              if(Math.sqrt(dxe*dxe + dye*dye) < Math.min(CW, CH) * 2.0){
                e.hp -= Math.round(dmg * 0.8);
              }
            }
          });
        }
      });
      unit.cooldown=effectiveSpeed;
      // Attack trails
      attackTargets.forEach(target=>{
        attackTrails.push({
          fromX:unit.x,fromY:unit.y,toX:target.x,toY:target.y,
          weaponType:effectTypeToWeapon[cfg.effectType]||'sword',
          progress:0,duration:12,color:cfg.color
        });
      });
      // Weapon swing animation
      const wType=effectTypeToWeapon[cfg.effectType]||'sword';
      const wqSwing=getUnitWeaponColor(unit.type);
      weaponSwings.push({
        x:unit.x,y:unit.y,weaponType:wType,
        angle:Math.atan2(closest.y-unit.y,closest.x-unit.x),
        progress:0,duration:18,color:wqSwing.color,glow:wqSwing.glow
      });
      // Attack effect particles
      attackTargets.forEach(target=>{
        for(let j=0;j<6;j++){
          const angle=Math.random()*Math.PI*2;
          const speed=3+Math.random()*4;
          particles.push(new Particle(target.x,target.y,{
            vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
            life:35,size:3+Math.random()*2,color:'#ffcc00',type:'dot',drag:0.9
          }));
        }
        particles.push(new Particle(target.x,target.y-10,{
          vx:0,vy:-1.5,life:40,size:4,color:'#ff4444',type:'dot',drag:1
        }));
      });
      if(typeof EFFECTS!=='undefined'&&EFFECTS[cfg.effectType]){
        EFFECTS[cfg.effectType]({emit:(x,y,c,cfg2)=>particles.push(new Particle(x,y,cfg2))},closest.x,closest.y,'白');
      }
    }
  });
  enemies=enemies.filter(e=>e.hp>0);
}

function checkWinLose(){
  if(gameState==='defeat'||gameState==='victory')return;
  if(currentWave>=totalWaves&&enemies.length===0){
    gameState='victory';showResult(true);
  }
}

function showResult(win){
  const overlay=document.getElementById('game-result-overlay');
  const title=document.getElementById('game-result-title');
  const sub=document.getElementById('game-result-sub');
  if(win){title.textContent='大获全胜';title.style.color='#d4a843';sub.textContent='沛公鸿运，汉室可兴！';}
  else{title.textContent='兵败城破';title.style.color='#b83a2a';sub.textContent='重整旗鼓，卷土重来...';}
  overlay.classList.add('show');
}

function restartGame(){loadLevel(currentLevel);}

// --- Render ---
function render(){
  if(!ctx)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const level=levels[currentLevel];
  const isDarkBg=false;

  // Draw grid
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const isPath=level.path.some(p=>p[0]===c&&p[1]===r);
    ctx.fillStyle=isPath?'rgba(140,120,70,0.5)':'rgba(248,240,224,0.6)';
    ctx.fillRect(c*CW,r*CH,CW,CH);
    ctx.strokeStyle='rgba(107,91,79,0.2)';
    ctx.lineWidth=0.5;
    ctx.strokeRect(c*CW,r*CH,CW,CH);
  }

  // Draw deploy highlight
  if((gameState==='deploy'||gameState==='wavePause')&&hoverCol>=0&&hoverRow>=0){
    const isValid=isValidPlacement(hoverCol,hoverRow,null)&&selectedUnit&&unitTypes[selectedUnit]&&money>=unitTypes[selectedUnit].cost;
    ctx.fillStyle=isValid?'rgba(74,124,89,0.25)':'rgba(184,58,42,0.2)';
    ctx.fillRect(hoverCol*CW,hoverRow*CH,CW,CH);
  }

  // Draw units
  units.forEach(unit=>{
    const cfg=unitTypes[unit.type];
    const size=cfg.size||1;
    const cx=unit.x;const cy=unit.y;
    // Attack range circle (hover)
    if(hoverCol>=0&&hoverRow>=0){
      const u=units.find(u=>{
        const uSize=unitTypes[u.type]?.size||1;
        return hoverCol>=u.col&&hoverCol<u.col+uSize&&hoverRow>=u.row&&hoverRow<u.row+uSize;
      });
      if(u===unit){
        const extra=(cfg.size||1)>1||cfg.range>=3?0.5:0;
        const range=(cfg.range+extra)*Math.min(CW,CH);
        ctx.beginPath();ctx.arc(cx,cy,range,0,Math.PI*2);
        ctx.fillStyle='rgba(212,168,67,0.08)';
        ctx.fill();ctx.strokeStyle='rgba(212,168,67,0.4)';ctx.lineWidth=1;ctx.stroke();
      }
    }
    // Body
    const w=size*CW-4;const h=CH-4;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
    ctx.fillStyle=size>1?'rgba(184,58,42,0.9)':cfg.color;
    ctx.fillRect(cx-w/2,cy-h/2,w,h);
    ctx.restore();
    ctx.strokeStyle='rgba(44,24,16,0.5)';ctx.lineWidth=1.5;
    ctx.strokeRect(cx-w/2,cy-h/2,w,h);
    // Name / Portrait
    const portrait=getUnitPortrait(unit.type);
    if(portrait){
      const pSize=Math.min(w,h);
      ctx.drawImage(portrait,cx-pSize/2,cy-pSize/2,pSize,pSize);
    }else{
      ctx.fillStyle='#fff';ctx.font='bold 12px "Noto Serif SC",serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(unit.type,cx,cy);
    }
    // HP bar
    const hpW=w*0.8;const hpH=3;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(cx-hpW/2,cy-h/2-6,hpW,hpH);
    ctx.fillStyle=unit.hp/unit.maxHp>0.5?'#4a7c59':unit.hp/unit.maxHp>0.25?'#d4a843':'#b83a2a';
    ctx.fillRect(cx-hpW/2,cy-h/2-6,hpW*(unit.hp/unit.maxHp),hpH);
    // Weapon icon (floating / attacking)
    const wType=effectTypeToWeapon[cfg.effectType];
    if(wType&&WEAPON_ICONS[wType]){
      const wSize=Math.min(CW,CH)*0.45;
      const bonus=getUnitWeaponBonus(unit.type);
      const effectiveSpeed=Math.round(cfg.speed*bonus.speedMul);
      const isAttacking=unit.attackAngle!==undefined&&unit.cooldown>effectiveSpeed*0.25;
      const badgeR=wSize*0.55;
      const maxOffX=w/2-badgeR-2;
      const offX=Math.min(cfg.size>1?w*0.42:w*0.15,maxOffX);
      const offY=-h*0.18;
      const wx=cx+offX;
      const wy=cy+offY+(isAttacking?0:Math.sin(Date.now()/350+unit.col*0.7)*2);
      const wq=getUnitWeaponColor(unit.type);
      ctx.save();
      ctx.translate(wx,wy);
      if(isAttacking){
        ctx.rotate(unit.attackAngle);
        ctx.fillStyle='rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.arc(0,0,wSize*0.55,0,Math.PI*2);
        ctx.fill();
        ctx.shadowColor=wq.glow;
        ctx.shadowBlur=8;
        WEAPON_ICONS[wType](ctx,wSize*0.25,0,wSize,wq.color);
      }else{
        ctx.fillStyle='rgba(0,0,0,0.55)';
        ctx.beginPath();
        ctx.arc(0,0,wSize*0.55,0,Math.PI*2);
        ctx.fill();
        ctx.shadowColor=wq.glow;
        ctx.shadowBlur=6;
        WEAPON_ICONS[wType](ctx,0,0,wSize,wq.color);
      }
      ctx.restore();
    }
  });

  // Draw placed weapons
  placedWeapons.forEach(w=>{
    const sz=Math.min(CW,CH)*0.5;
    const cx=w.x;const cy=w.y;
    ctx.save();
    ctx.shadowColor=w.rank==='金'?'rgba(212,168,67,0.5)':w.rank==='绿'?'rgba(74,124,89,0.4)':'rgba(150,150,150,0.3)';
    ctx.shadowBlur=10;
    ctx.fillStyle=w.rank==='金'?'rgba(212,168,67,0.15)':w.rank==='绿'?'rgba(74,124,89,0.15)':'rgba(150,150,150,0.1)';
    ctx.beginPath();ctx.arc(cx,cy,sz*0.7,0,Math.PI*2);ctx.fill();
    ctx.restore();
    const wType=effectTypeToWeapon[w.effectType]||'sword';
    if(WEAPON_ICONS[wType]){
      ctx.save();
      ctx.shadowColor=w.rank==='金'?'rgba(212,168,67,0.6)':w.rank==='绿'?'rgba(74,124,89,0.5)':'rgba(150,150,150,0.3)';
      ctx.shadowBlur=6;
      WEAPON_ICONS[wType](ctx,cx,cy,sz,w.color);
      ctx.restore();
    }
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='8px "Noto Serif SC",serif';
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(w.weaponName,cx,cy+sz*0.5);
    // Connection line to general
    const generalUnit=units.find(u=>u.type===w.generalName);
    if(generalUnit){
      ctx.save();
      ctx.strokeStyle=w.rank==='金'?'rgba(212,168,67,0.25)':w.rank==='绿'?'rgba(74,124,89,0.2)':'rgba(150,150,150,0.15)';
      ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(generalUnit.x,generalUnit.y);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    }
  });
  // Weapon placement highlight
  if(selectedWeapon&&(gameState==='deploy'||gameState==='wavePause')){
    const wDef=weaponTypes[selectedWeapon];
    const generalUnit=units.find(u=>u.type===wDef.general);
    if(generalUnit){
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dc,dr])=>{
        const nc=generalUnit.col+dc;const nr=generalUnit.row+dr;
        if(nc>=0&&nc<COLS&&nr>=0&&nr<ROWS){
          const isValid=isValidPlacement(nc,nr,null,'weapon');
          ctx.fillStyle=isValid?'rgba(212,168,67,0.25)':'rgba(184,58,42,0.15)';
          ctx.fillRect(nc*CW,nr*CH,CW,CH);
          if(isValid){ctx.strokeStyle='rgba(212,168,67,0.5)';ctx.lineWidth=2;ctx.strokeRect(nc*CW+2,nr*CH+2,CW-4,CH-4);}
        }
      });
    }
  }
  // Passive aura for generals with adjacent weapon
  units.forEach(u=>{
    if(!unitTypes[u.type]?.isGeneral)return;
    const bn=getUnitWeaponBonus(u.type);
    if(!bn.hasWeapon)return;
    const pulse=Math.sin(Date.now()/500)*0.15+0.85;
    ctx.save();ctx.globalAlpha=0.1*pulse;
    const col=getUnitWeaponColor(u.type);
    const grad=ctx.createRadialGradient(u.x,u.y,0,u.x,u.y,Math.min(CW,CH)*0.7);
    grad.addColorStop(0,col.color);grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(u.x,u.y,Math.min(CW,CH)*0.7,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  // Draw enemies
  enemies.forEach(e=>{
    const sz=Math.min(CW,CH)*e.size;
    // Outer glow ring
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath();ctx.arc(e.x,e.y,sz/2+6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.beginPath();ctx.arc(e.x,e.y,sz/2+10,0,Math.PI*2);ctx.fill();
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
    ctx.fillStyle=e.type==='BOSS'?'#c41e1e':e.color;
    ctx.beginPath();ctx.arc(e.x,e.y,sz/2,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2.5;ctx.stroke();
    // Enemy HP
    const hpW=sz*1.2;const hpH=3;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(e.x-hpW/2,e.y-sz/2-7,hpW,hpH);
    ctx.fillStyle=e.type==='BOSS'?'#ff4444':'#b83a2a';
    ctx.fillRect(e.x-hpW/2,e.y-sz/2-7,hpW*(e.hp/enemyTypes[e.type].hp),hpH);
    // Enemy type label
    ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const label=e.type==='BOSS'?'BOSS':e.type==='步兵'?'步':e.type==='弓手'?'弓':e.type==='骑兵'?'骑':'?';
    ctx.fillText(label,e.x,e.y);
  });

  // Draw attack trails
  attackTrails.forEach(trail=>{
    const t=trail.progress/trail.duration;
    ctx.save();
    ctx.strokeStyle='#fff';
    ctx.shadowColor=trail.color;
    ctx.shadowBlur=8;
    ctx.globalAlpha=1-t;
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(trail.fromX,trail.fromY);
    const currX=trail.toX+(trail.fromX-trail.toX)*(1-t);
    const currY=trail.toY+(trail.fromY-trail.toY)*(1-t);
    ctx.lineTo(currX,currY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
    ctx.restore();
    trail.progress++;
  });
  attackTrails=attackTrails.filter(t=>t.progress<t.duration);

  // Draw weapon swing animations
  weaponSwings.forEach(swing=>{
    const t=swing.progress/swing.duration;
    ctx.save();
    ctx.translate(swing.x,swing.y);
    ctx.shadowColor=swing.glow||'rgba(255,255,255,0.3)';
    ctx.shadowBlur=8;
    if(swing.weaponType==='sword'||swing.weaponType==='hammer'||swing.weaponType==='cavalry_blade'){
      const startA=swing.angle-Math.PI*0.45;
      const endA=swing.angle+Math.PI*0.45;
      const curA=startA+(endA-startA)*Math.sin(t*Math.PI);
      ctx.rotate(curA);
      const sz=Math.min(CW,CH)*0.45*(1-t*0.25);
      WEAPON_ICONS[swing.weaponType](ctx,sz*0.4,0,sz,swing.color);
    }else if(swing.weaponType==='spear'||swing.weaponType==='halberd'||swing.weaponType==='trident'){
      const thrust=Math.sin(t*Math.PI)*Math.min(CW,CH)*0.55;
      ctx.rotate(swing.angle);
      ctx.translate(thrust,0);
      const sz=Math.min(CW,CH)*0.42;
      WEAPON_ICONS[swing.weaponType](ctx,0,0,sz,swing.color);
    }else if(swing.weaponType==='bow'||swing.weaponType==='crossbow'){
      const drawB=Math.sin(t*Math.PI*0.5)*0.25;
      ctx.rotate(swing.angle);
      ctx.scale(1+drawB,1);
      const sz=Math.min(CW,CH)*0.38;
      WEAPON_ICONS[swing.weaponType](ctx,0,0,sz,swing.color);
    }else{
      ctx.rotate(swing.angle+Math.sin(t*Math.PI*2)*0.15);
      const sz=Math.min(CW,CH)*0.35;
      WEAPON_ICONS[swing.weaponType](ctx,0,0,sz,swing.color);
    }
    ctx.restore();
    swing.progress++;
  });
  weaponSwings=weaponSwings.filter(s=>s.progress<s.duration);

  // Draw particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(!p.update()){particles.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=(p.life/p.maxLife)*p.alpha;
    ctx.translate(p.x,p.y);ctx.rotate(p.rotation||0);
    ctx.fillStyle=p.color;ctx.beginPath();
    ctx.arc(0,0,p.size*(p.life/p.maxLife),0,Math.PI*2);
    ctx.fill();ctx.restore();
  }

  // Draw start/end markers
  const start=level.path[0];
  ctx.fillStyle='rgba(74,124,89,0.6)';ctx.fillRect(start[0]*CW+2,start[1]*CH+2,CW-4,CH-4);
  ctx.strokeStyle='#4a7c59';ctx.lineWidth=2;
  ctx.strokeRect(start[0]*CW+2,start[1]*CH+2,CW-4,CH-4);
  ctx.fillStyle='#fff';ctx.font='bold 13px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('入',start[0]*CW+CW/2,start[1]*CH+CH/2);

  const end=level.path[level.path.length-1];
  ctx.fillStyle='rgba(184,58,42,0.6)';ctx.fillRect(end[0]*CW+2,end[1]*CH+2,CW-4,CH-4);
  ctx.strokeStyle='#b83a2a';ctx.lineWidth=2;
  ctx.strokeRect(end[0]*CW+2,end[1]*CH+2,CW-4,CH-4);
  ctx.fillStyle='#fff';ctx.font='bold 13px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('沛',end[0]*CW+CW/2,end[1]*CH+CH/2);
}

// --- Init Game ---
function initGame(){
  canvas=document.getElementById('game-canvas');
  if(!canvas)return;
  ctx=canvas.getContext('2d');
  resizeCanvas();
  canvas.addEventListener('mousedown',handleMouseDown);
  canvas.addEventListener('mousemove',handleMouseMove);
  canvas.addEventListener('mouseup',handleMouseUp);
  canvas.addEventListener('mouseleave',handleMouseUp);
  canvas.addEventListener('touchstart',handleTouchStart,{passive:false});
  canvas.addEventListener('touchmove',handleTouchMove,{passive:false});
  canvas.addEventListener('touchend',handleTouchEnd,{passive:false});
  loadLevel(1);
  updateUnitButtons();
  updateWavesUI();
  window.addEventListener('resize',()=>{resizeCanvas();render();});
}

// ============================================
// Init
// ============================================
document.addEventListener('DOMContentLoaded', () => {
  buildGenerals();
  buildUnits();
  buildWeapons();
  buildLevels();
  // 点击空白关闭弹框
  document.addEventListener('click', () => {
    document.querySelectorAll('.level-node.active').forEach(n => n.classList.remove('active'));
  });
  initBattlefield();
  initObservers();
  initNavigation();

  // Init game demo
  initGame();

  // Auto-play hero particles
  setTimeout(() => {
    const heroSection = document.getElementById('hero');
    if (heroSection) {
      const rect = heroSection.getBoundingClientRect();
      // Subtle ambient particles could be added here
    }
  }, 2000);
});

window.addEventListener('resize', () => {
  generalSystems.forEach(ps => ps.resize());
  unitSystems.forEach(ps => ps.resize());
  if (weaponSystem) weaponSystem.resize();
  if (battlefieldSystem) battlefieldSystem.resize();
});
</script>
