<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>跟着沛公当皇帝 - 游戏演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================
   CSS Variables & Reset
   ============================================ */
:root {
  --parchment: #f3e9d2;
  --parchment-dark: #e8dcc0;
  --ink-deep: #2c1810;
  --ink-mid: #4a3728;
  --ink-light: #6b5b4f;
  --cinnabar: #b83a2a;
  --cinnabar-light: #d44433;
  --bronze: #4a7c59;
  --bronze-light: #5a9a6a;
  --gold: #d4a843;
  --gold-light: #e8c866;
  --gold-glow: rgba(212, 168, 67, 0.4);
  --flame: #e07a2e;
  --shadow: rgba(44, 24, 16, 0.15);
  --shadow-heavy: rgba(44, 24, 16, 0.35);
  --section-gap: 80px;
  --card-radius: 6px;
  --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);

  /* === 弹性曲线族（hyperframes 统一时间线） === */
  --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elastic-soft: cubic-bezier(0.22, 1.2, 0.36, 1);
  --ease-elastic-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-dramatic: cubic-bezier(0.87, 0, 0.13, 1);

  /* === 漆器织锦系统色 === */
  --lacquer-black: #1a1a1a;
  --lacquer-dark: #2a2020;
  --cinnabar-red: #c23a30;
  --cinnabar-dark: #8b2018;
  --gold-leaf: #c89f3d;
  --gold-light: #e8c866;
  --cloud-grey: #4a4a4a;
  --porcelain: #e8e3d9;
  --terracotta: #b8735a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 40px;
}

body {
  font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--parchment);
  color: var(--ink-deep);
  line-height: 1.7;
  overflow-x: hidden;
}

/* ============================================
   Paper Texture Background
   ============================================ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139,119,95,0.03) 2px, rgba(139,119,95,0.03) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(139,119,95,0.02) 2px, rgba(139,119,95,0.02) 4px);
  pointer-events: none;
  z-index: 9999;
}

/* ============================================
   Typography
   ============================================ */
h1, h2, h3, .display-font {
  font-family: "Noto Serif SC", "SimSun", "STSong", "FangSong", serif;
  font-weight: 700;
  letter-spacing: 0.08em;
}

h1 { font-size: clamp(2.2rem, 5vw, 3.5rem); }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
h3 { font-size: 1.1rem; }

/* ============================================
   Section Base
   ============================================ */
section {
  position: relative;
  width: 100%;
  padding: var(--section-gap) 5vw;
}

.section-title {
  text-align: center;
  margin-bottom: 48px;
  position: relative;
}

.section-title h2 {
  color: var(--ink-deep);
  display: inline-block;
  padding: 0 24px;
  position: relative;
}

.section-title h2::before,
.section-title h2::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--ink-light), transparent);
}

.section-title h2::before { right: 100%; }
.section-title h2::after { left: 100%; }

.section-subtitle {
  color: var(--ink-light);
  font-size: 0.9rem;
  margin-top: 8px;
  letter-spacing: 0.15em;
}

/* ============================================
   Reveal Animation
   ============================================ */
.reveal {
  opacity: 0;
  transform: translateY(50px) scaleX(0.92);
  transition: opacity 0.65s var(--ease-smooth), transform 0.65s var(--ease-elastic-soft);
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0) scaleX(1);
}

.reveal-delay-1 { --reveal-delay: 0.1s; transition-delay: 0.1s; }
.reveal-delay-2 { --reveal-delay: 0.2s; transition-delay: 0.2s; }
.reveal-delay-3 { --reveal-delay: 0.3s; transition-delay: 0.3s; }
.reveal-delay-4 { --reveal-delay: 0.4s; transition-delay: 0.4s; }
.reveal-delay-5 { --reveal-delay: 0.5s; transition-delay: 0.5s; }

/* ===== 入场编排（卡片内部子动画） ===== */
.general-card.visible .general-canvas canvas {
  animation: totemPop 0.6s var(--ease-elastic) forwards;
  animation-delay: calc(var(--reveal-delay, 0s) + 0.18s);
  opacity: 0;
}

.general-card.visible .scroll-tassel {
  animation: tasselDrop 0.45s var(--ease-elastic-bounce) forwards,
             tasselSway 3s var(--ease-smooth) infinite;
  animation-delay: calc(var(--reveal-delay, 0s) + 0.35s), calc(var(--reveal-delay, 0s) + 0.8s);
}

.general-card.visible .general-skill {
  animation: skillSlide 0.5s var(--ease-elastic-soft) forwards;
  animation-delay: calc(var(--reveal-delay, 0s) + 0.45s);
  opacity: 0;
}

/* ============================================
   Scrollbar
   ============================================ */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--parchment-dark); }
::-webkit-scrollbar-thumb { background: var(--ink-light); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-mid); }

/* ============================================
   Side Navigation
   ============================================ */
#side-nav {
  position: fixed;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 12px;
  opacity: 0;
  transition: opacity 0.5s ease;
}

#side-nav.visible { opacity: 1; }

.nav-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--ink-light);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}

.nav-dot:hover,
.nav-dot.active {
  background: var(--cinnabar);
  transform: scale(1.4);
}

.nav-dot::after {
  content: attr(data-label);
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--ink-light);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
  font-family: "Noto Serif SC", serif;
}

.nav-dot:hover::after { opacity: 1; }

/* ============================================
   Hero Section
   ============================================ */
#hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

#hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 50%, rgba(184,58,42,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 50%, rgba(212,168,67,0.06) 0%, transparent 60%);
  pointer-events: none;
}

.hero-scroll {
  position: absolute;
  width: 80%;
  max-width: 800px;
  height: 70vh;
  border: 2px solid var(--ink-light);
  border-radius: 4px;
  background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  box-shadow:
    0 4px 20px var(--shadow),
    inset 0 0 60px rgba(139,119,95,0.08);
  animation: scrollUnroll 1.5s ease-out forwards;
  opacity: 0;
}

@keyframes scrollUnroll {
  0% { clip-path: inset(0 50% 0 50%); opacity: 0; }
  100% { clip-path: inset(0 0 0 0); opacity: 1; }
}

.hero-content {
  position: relative;
  z-index: 2;
  padding: 60px 40px;
}

.hero-title {
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  color: var(--ink-deep);
  margin-bottom: 16px;
  text-shadow: 2px 2px 0 rgba(139,119,95,0.15);
  animation: inkSpread 1.2s ease-out 0.5s both;
}

.hero-subtitle {
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: var(--ink-light);
  letter-spacing: 0.3em;
  margin-bottom: 24px;
  animation: inkSpread 1s ease-out 0.8s both;
}

.hero-badge {
  display: inline-block;
  padding: 6px 20px;
  border: 1px solid var(--cinnabar);
  color: var(--cinnabar);
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  border-radius: 20px;
  animation: inkSpread 0.8s ease-out 1.1s both;
}

.hero-cta {
  margin-top: 40px;
  animation: inkSpread 0.8s ease-out 1.4s both;
}

.hero-cta a {
  display: inline-block;
  padding: 12px 36px;
  background: var(--cinnabar);
  color: var(--parchment);
  text-decoration: none;
  border-radius: var(--card-radius);
  font-size: 1rem;
  letter-spacing: 0.1em;
  transition: all var(--transition);
  box-shadow: 0 4px 12px rgba(184,58,42,0.3);
}

.hero-cta a:hover {
  background: var(--cinnabar-light);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(184,58,42,0.4);
}

.scroll-hint {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--ink-light);
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  animation: floatDown 2s ease-in-out infinite;
}

@keyframes floatDown {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.6; }
  50% { transform: translateX(-50%) translateY(8px); opacity: 1; }
}

@keyframes inkSpread {
  0% { filter: blur(12px); opacity: 0; transform: scale(0.95); }
  100% { filter: blur(0); opacity: 1; transform: scale(1); }
}

/* ============================================
   Generals Section — 汉宫陶俑Q版
   ============================================ */
#generals {
  background: linear-gradient(180deg, #f5f0e8 0%, #e8e0d4 100%);
  position: relative;
}

#generals::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0c16.569 0 30 13.431 30 30 0 16.569-13.431 30-30 30C13.431 60 0 46.569 0 30 0 13.431 13.431 0 30 0zm0 4C15.641 4 4 15.641 4 30c0 14.359 11.641 26 26 26 14.359 0 26-11.641 26-26C56 15.641 44.359 4 30 4z' fill='%23c23a30' fill-opacity='0.03'/%3E%3C/svg%3E");
  opacity: 0.5;
  pointer-events: none;
}

.generals-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 32px;
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* ===== 玄漆织锦卡片 ===== */
.general-card {
  border-radius: 16px;
  padding: 28px 24px 22px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  background: linear-gradient(165deg, #2a2020 0%, #1a1a1a 50%, #0f0a0a 100%);
  border: 2px solid transparent;
  background-clip: padding-box;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 -1px 0 rgba(0,0,0,0.3);
  transition: transform 0.5s var(--ease-elastic), box-shadow 0.4s var(--ease-smooth);
  transform-origin: center bottom;
}

/* 云气纹角饰 — 伪元素实现 */
.general-card::before {
  content: '';
  position: absolute;
  top: -2px; left: -2px;
  width: 48px; height: 48px;
  border-top: 3px solid var(--card-accent, var(--cinnabar-red));
  border-left: 3px solid var(--card-accent, var(--cinnabar-red));
  border-radius: 16px 0 0 0;
  opacity: 0.7;
  transition: opacity 0.3s ease;
}
.general-card::after {
  content: '';
  position: absolute;
  bottom: -2px; right: -2px;
  width: 48px; height: 48px;
  border-bottom: 3px solid var(--card-accent, var(--cinnabar-red));
  border-right: 3px solid var(--card-accent, var(--cinnabar-red));
  border-radius: 0 0 16px 0;
  opacity: 0.7;
  transition: opacity 0.3s ease;
}

/*  hover时角饰发光  */
.general-card:hover::before,
.general-card:hover::after {
  opacity: 1;
  box-shadow: 0 0 12px var(--card-accent-glow, rgba(194,58,48,0.3));
}

.general-card:hover {
  transform: translateY(-8px) scale(1.03) rotate(-0.5deg);
  box-shadow:
    0 20px 60px rgba(0,0,0,0.5),
    0 0 0 1px var(--card-accent-glow, rgba(194,58,48,0.15)),
    inset 0 1px 0 rgba(255,255,255,0.1);
}

/* ===== 头像容器 ===== */
.general-canvas {
  width: 100%;
  height: 160px;
  margin-bottom: 18px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.general-canvas canvas {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #3a3030 0%, #1a1a1a 70%, #0f0a0a 100%);
  box-shadow:
    0 6px 20px rgba(0,0,0,0.5),
    inset 0 2px 4px rgba(255,255,255,0.05),
    0 0 0 3px var(--card-accent, var(--cinnabar-red));
  transition: transform 0.5s var(--ease-elastic), box-shadow 0.3s ease;
}

.general-card:hover .general-canvas canvas {
  transform: scale(1.12) rotate(3deg);
  box-shadow:
    0 8px 28px rgba(0,0,0,0.6),
    inset 0 2px 4px rgba(255,255,255,0.08),
    0 0 0 4px var(--card-accent, var(--cinnabar-red)),
    0 0 20px var(--card-accent-glow, rgba(194,58,48,0.2));
}

.general-equip-indicator {
  position: absolute;
  top: 8px;
  right: calc(50% - 65px);
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--gold-leaf);
  box-shadow: 0 0 10px rgba(200,159,61,0.6);
  opacity: 0;
  transition: opacity 0.3s ease;
}

/* ===== 文字排版 ===== */
.general-name {
  font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", cursive;
  font-size: 1.8rem;
  color: var(--gold-leaf);
  margin-bottom: 4px;
  letter-spacing: 0.12em;
  text-align: center;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.general-header {
  text-align: center;
}

.general-meta {
  font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
  font-size: 0.8rem;
  color: #a09080;
  margin-bottom: 12px;
  letter-spacing: 0.04em;
  text-align: center;
}

.general-skill {
  font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
  display: inline-block;
  padding: 5px 18px;
  font-size: 0.82rem;
  border-radius: 20px;
  color: #1a1a1a;
  background: linear-gradient(135deg, var(--card-accent, var(--cinnabar-red)) 0%, var(--card-accent-dark, var(--cinnabar-dark)) 100%);
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  letter-spacing: 0.06em;
  font-weight: 600;
  transition: box-shadow 0.35s var(--ease-smooth), transform 0.3s var(--ease-elastic);
}

.general-skill-desc {
  font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
  font-size: 0.85rem;
  color: #908070;
  margin-top: 10px;
  line-height: 1.6;
  text-align: center;
}

.general-equip-name {
  font-family: "ZCOOL XiaoWei", serif;
  font-size: 0.75rem;
  color: var(--gold-light);
  margin-left: 8px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

/* ===== 刘邦 - 帝王金龙 ===== */
.theme-emperor { --card-accent: #d4a843; --card-accent-dark: #b08d30; --card-accent-glow: rgba(212,168,67,0.35); }
.theme-emperor:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); }

/* ===== 萧何 - 策卷墨印 ===== */
.theme-strategist { --card-accent: #5a7a8a; --card-accent-dark: #4a5a6a; --card-accent-glow: rgba(90,122,138,0.35); }
.theme-strategist:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); }

/* ===== 樊哙 - 血斧狂战 ===== */
.theme-berserker { --card-accent: #c4302b; --card-accent-dark: #8b2018; --card-accent-glow: rgba(196,48,43,0.4); }
.theme-berserker:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); transform: translateY(-8px) scale(1.03) rotate(-1deg); }

/* ===== 曹参 - 青铜先锋 ===== */
.theme-vanguard { --card-accent: #8b6914; --card-accent-dark: #6b5010; --card-accent-glow: rgba(139,105,20,0.35); }
.theme-vanguard:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); }

/* ===== 韩信 - 帅剑风云 ===== */
.theme-commander { --card-accent: #3a6ea5; --card-accent-dark: #2a5080; --card-accent-glow: rgba(58,110,165,0.35); }
.theme-commander:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); }

/* ===== 张良 - 鹤羽兵法 ===== */
.theme-advisor { --card-accent: #4a7c59; --card-accent-dark: #3a5c39; --card-accent-glow: rgba(74,124,89,0.35); }
.theme-advisor:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); transform: translateY(-8px) scale(1.03) rotate(0.5deg); }

/* ===== 周勃 - 重戟破城 ===== */
.theme-siege { --card-accent: #6a6a6a; --card-accent-dark: #4a4a4a; --card-accent-glow: rgba(106,106,106,0.35); }
.theme-siege:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); }

/* ===== 灌婴 - 银枪铁骑 ===== */
.theme-cavalry { --card-accent: #7a8a9a; --card-accent-dark: #5a6a7a; --card-accent-glow: rgba(122,138,154,0.35); }
.theme-cavalry:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); transform: translateY(-8px) scale(1.03) skewX(-1deg); }

/* ===== 彭越 - 猎弓游击 ===== */
.theme-guerrilla { --card-accent: #5a8a4a; --card-accent-dark: #3a6a2a; --card-accent-glow: rgba(90,138,74,0.35); }
.theme-guerrilla:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); }

/* ===== 英布 - 烈焰金锤 ===== */
.theme-rebel { --card-accent: #e07a2e; --card-accent-dark: #b85a1a; --card-accent-glow: rgba(224,122,46,0.4); }
.theme-rebel:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--card-accent-glow); }

/* ===== 点击脉冲动效（拍击弹性） ===== */
@keyframes cardPulse {
  0% { transform: scale(1) translateY(0); }
  35% { transform: scale(0.94) translateY(3px); }
  70% { transform: scale(1.04) translateY(-3px); }
  100% { transform: scale(1) translateY(0); }
}
.general-card.effect-pulse {
  animation: cardPulse 0.5s var(--ease-elastic-bounce);
}

/* ===== 陶俑弹跳入场 ===== */
@keyframes figurePop {
  0% { opacity: 0; transform: scale(0.5) translateY(30px); }
  60% { opacity: 1; transform: scale(1.1) translateY(-5px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

/* ===== 光环展开 ===== */
@keyframes ringExpand {
  0% { opacity: 0; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1); }
}

/* ===== 姓名淡入 + 上浮 ===== */
@keyframes nameReveal {
  0% { opacity: 0; transform: translateY(12px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* ===== 技能标签滑入 ===== */
@keyframes skillSlide {
  0% { opacity: 0; transform: translateY(16px) scale(0.9); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== 角饰描边动画 ===== */
@keyframes cornerDraw {
  0% { opacity: 0; clip-path: inset(0 100% 100% 0); }
  100% { opacity: 0.7; clip-path: inset(0 0 0 0); }
}

/* ===== 入场编排（依赖 .visible 类） ===== */
.reveal {
  opacity: 0;
  transform: translateY(60px) scale(0.95);
  transition: opacity 0.7s var(--ease-smooth), transform 0.7s var(--ease-elastic-soft);
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.reveal-delay-1 { transition-delay: 0.08s; }
.reveal-delay-2 { transition-delay: 0.16s; }
.reveal-delay-3 { transition-delay: 0.24s; }
.reveal-delay-4 { transition-delay: 0.32s; }
.reveal-delay-5 { transition-delay: 0.40s; }

/* 卡片visible后，内部子元素依次动画 */
.general-card.visible .general-canvas canvas {
  animation: figurePop 0.7s var(--ease-elastic-bounce) forwards;
  animation-delay: calc(var(--reveal-delay, 0s) + 0.15s);
  opacity: 0;
}

.general-card.visible .general-name {
  animation: nameReveal 0.5s var(--ease-elastic-soft) forwards;
  animation-delay: calc(var(--reveal-delay, 0s) + 0.35s);
  opacity: 0;
}

.general-card.visible .general-meta {
  animation: nameReveal 0.45s var(--ease-smooth) forwards;
  animation-delay: calc(var(--reveal-delay, 0s) + 0.45s);
  opacity: 0;
}

.general-card.visible .general-skill {
  animation: skillSlide 0.55s var(--ease-elastic) forwards;
  animation-delay: calc(var(--reveal-delay, 0s) + 0.55s);
  opacity: 0;
}

.general-card.visible .general-skill-desc {
  animation: nameReveal 0.5s var(--ease-smooth) forwards;
  animation-delay: calc(var(--reveal-delay, 0s) + 0.65s);
  opacity: 0;
}

.general-card.visible::before,
.general-card.visible::after {
  animation: cornerDraw 0.6s var(--ease-smooth) forwards;
  animation-delay: calc(var(--reveal-delay, 0s) + 0.25s);
}

/* ===== 装备状态 ===== */
.general-card.equipped .general-equip-indicator {
  opacity: 1;
}
.general-card.equipped .general-equip-name {
  opacity: 1;
}

.effect-preview {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

/* ============================================
   Units Section
   ============================================ */
#units {
  background: linear-gradient(180deg, rgba(232,220,192,0.5) 0%, var(--parchment) 100%);
}

.units-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px;
  max-width: 1000px;
  margin: 0 auto;
}

.unit-card {
  background: var(--parchment);
  border: 1px solid rgba(107,91,79,0.15);
  border-radius: var(--card-radius);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
}

.unit-card:hover {
  border-color: var(--bronze);
  box-shadow: 0 8px 20px var(--shadow);
  transform: translateY(-3px);
}

.unit-canvas {
  width: 100%;
  height: 120px;
  background: rgba(44,24,16,0.03);
  border-radius: 4px;
  margin-bottom: 10px;
}

.unit-name {
  font-size: 1.1rem;
  color: var(--ink-deep);
  font-family: "Noto Serif SC", serif;
  margin-bottom: 4px;
}

.unit-meta {
  font-size: 0.75rem;
  color: var(--ink-light);
  margin-bottom: 6px;
}

.unit-feature {
  font-size: 0.8rem;
  color: var(--bronze);
}

/* ============================================
   Weapons Section
   ============================================ */
#weapons {
  background: linear-gradient(180deg, var(--parchment) 0%, rgba(232,220,192,0.5) 100%);
}

.weapons-container {
  max-width: 900px;
  margin: 0 auto;
}

.weapon-row {
  display: grid;
  grid-template-columns: 120px repeat(3, 1fr);
  gap: 12px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid rgba(107,91,79,0.1);
}

.weapon-row:first-child {
  border-top: 1px solid rgba(107,91,79,0.1);
}

.weapon-general {
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  color: var(--ink-deep);
  font-size: 1rem;
}

.weapon-slot {
  padding: 10px 14px;
  border-radius: var(--card-radius);
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  border: 1px solid transparent;
}

.weapon-slot:hover { transform: translateY(-2px); }

.weapon-slot.rank-white {
  background: rgba(180,180,180,0.15);
  border-color: rgba(180,180,180,0.3);
}

.weapon-slot.rank-white:hover {
  background: rgba(180,180,180,0.25);
  box-shadow: 0 4px 12px rgba(180,180,180,0.2);
}

.weapon-slot.rank-green {
  background: rgba(74,124,89,0.12);
  border-color: rgba(74,124,89,0.3);
}

.weapon-slot.rank-green:hover {
  background: rgba(74,124,89,0.2);
  box-shadow: 0 4px 12px rgba(74,124,89,0.2);
}

.weapon-slot.rank-gold {
  background: rgba(212,168,67,0.12);
  border-color: rgba(212,168,67,0.4);
}

.weapon-slot.rank-gold:hover {
  background: rgba(212,168,67,0.2);
  box-shadow: 0 4px 16px rgba(212,168,67,0.3);
}

.weapon-icon-canvas {
  display: block;
  margin: 0 auto 4px;
  width: 28px;
  height: 28px;
}

.weapon-name {
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 2px;
}

.weapon-slot.rank-white .weapon-name { color: #777; }
.weapon-slot.rank-green .weapon-name { color: var(--bronze); }
.weapon-slot.rank-gold .weapon-name { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }

.weapon-rank-label {
  font-size: 0.7rem;
  opacity: 0.7;
}

.weapon-preview-area {
  width: 100%;
  height: 300px;
  background: rgba(44,24,16,0.04);
  border-radius: 8px;
  margin-top: 32px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(107,91,79,0.15);
}

.weapon-preview-area canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.weapon-preview-label {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.85rem;
  color: var(--ink-light);
  pointer-events: none;
  background: rgba(243,233,210,0.9);
  padding: 4px 16px;
  border-radius: 20px;
}

/* ============================================
   Battlefield Section
   ============================================ */
#battlefield {
  background: linear-gradient(180deg, rgba(232,220,192,0.5) 0%, var(--parchment) 100%);
}

.battlefield-stage {
  max-width: 900px;
  margin: 0 auto;
  position: relative;
}

.battlefield-canvas {
  width: 100%;
  height: 500px;
  background: linear-gradient(180deg, rgba(44,24,16,0.06) 0%, rgba(44,24,16,0.03) 100%);
  border-radius: 8px;
  border: 1px solid rgba(107,91,79,0.2);
  position: relative;
  overflow: hidden;
}

.battlefield-canvas canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.battlefield-controls {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 20px;
}

.battle-btn {
  padding: 10px 28px;
  border: 1px solid var(--cinnabar);
  background: transparent;
  color: var(--cinnabar);
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  border-radius: var(--card-radius);
  transition: all var(--transition);
  font-family: "Noto Serif SC", serif;
}

.battle-btn:hover {
  background: var(--cinnabar);
  color: var(--parchment);
}

/* ============================================
   Levels Section
   ============================================ */
#levels {
  background: linear-gradient(180deg, var(--parchment) 0%, rgba(232,220,192,0.5) 100%);
}

.levels-timeline {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  max-width: 1300px;
  margin: 0 auto;
  position: relative;
  padding: 200px 80px 200px;
  gap: 0;
}

/* 主干鱼脊骨 */
.levels-timeline::before {
  content: '';
  position: absolute;
  top: calc(200px + 120px);
  left: 50px;
  right: 50px;
  height: 5px;
  background: linear-gradient(90deg, #b83a2a 0%, #c97b2a 28%, #4a7c59 60%, #3a6ea5 100%);
  border-radius: 3px;
  z-index: 0;
}

/* 鱼头 SVG */
.timeline-head {
  position: absolute;
  top: calc(200px + 120px);
  right: 0;
  transform: translateY(-50%);
  z-index: 1;
}

/* 鱼尾 SVG */
.timeline-tail {
  position: absolute;
  top: calc(200px + 120px);
  left: 0;
  transform: translateY(-50%);
  z-index: 1;
}

/* 阶段颜色变量 */
.phase-1 { --phase-color: #b83a2a; }
.phase-2 { --phase-color: #c97b2a; }
.phase-3 { --phase-color: #4a7c59; }
.phase-4 { --phase-color: #3a6ea5; }

/* 节点 - 固定高度容纳分支 */
.level-node {
  position: relative;
  height: 240px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

.level-node.active {
  z-index: 100;
}

/* 圆点 - 在节点中心（主干位置） */
.level-dot {
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--parchment);
  border: 3px solid var(--phase-color, var(--cinnabar));
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  transition: all 0.3s ease;
}

.level-node:hover .level-dot,
.level-node.active .level-dot {
  background: var(--phase-color, var(--cinnabar));
  box-shadow: 0 0 0 5px rgba(0,0,0,0.08);
}

/* 分支容器：大骨 + 卡片，整体旋转 */
.level-branch {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* 奇数节点：分支在圆点上方，向右上斜 */
.level-node:nth-child(odd) .level-branch {
  bottom: 50%;
  left: 50%;
  transform: translateX(-50%) rotate(-32deg);
  transform-origin: bottom center;
  flex-direction: column;
}

/* 偶数节点：分支在圆点下方，向右下斜 */
.level-node:nth-child(even) .level-branch {
  top: 50%;
  left: 50%;
  transform: translateX(-50%) rotate(-32deg);
  transform-origin: top center;
  flex-direction: column-reverse;
}

/* 大骨 */
.level-bone {
  width: 2px;
  height: 48px;
  background: var(--phase-color, var(--cinnabar));
  flex-shrink: 0;
  position: relative;
}

/* 大骨末端小圆点 */
.level-bone::after {
  content: '';
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--phase-color);
  left: 50%;
  transform: translateX(-50%);
}

.level-node:nth-child(odd) .level-bone::after { bottom: -4px; }
.level-node:nth-child(even) .level-bone::after { top: -4px; }

/* 卡片 - 反向旋转保持文字水平 */
.level-card {
  width: 74px;
  background: var(--parchment);
  border: 2px solid var(--phase-color, rgba(107,91,79,0.2));
  border-radius: 10px;
  padding: 7px 8px;
  text-align: center;
  transform: rotate(32deg);
  transition: all 0.3s ease;
  flex-shrink: 0;
}

.level-node:hover .level-card {
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}

.level-num {
  font-size: 0.58rem;
  color: var(--phase-color, var(--cinnabar));
  font-weight: bold;
  margin-bottom: 1px;
}

.level-name {
  font-size: 0.72rem;
  color: var(--ink-deep);
  font-family: "Noto Serif SC", serif;
  line-height: 1.25;
  font-weight: 600;
}

.level-year {
  font-size: 0.55rem;
  color: var(--ink-light);
  margin-top: 2px;
}

/* 展开的典故面板 */
.level-detail {
  position: absolute;
  left: 50%;
  transform: translateX(-50%) scaleY(0);
  background: var(--parchment);
  border: 2px solid var(--phase-color, rgba(107,91,79,0.15));
  border-radius: 10px;
  padding: 0;
  width: 220px;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 10;
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  pointer-events: none;
}

/* 奇数节点：卡片在上，弹框从节点顶部向上展开 */
.level-node:nth-child(odd) .level-detail {
  bottom: 100%;
  transform-origin: bottom center;
  margin-bottom: 8px;
}

/* 偶数节点：卡片在下，弹框从节点底部向下展开 */
.level-node:nth-child(even) .level-detail {
  top: 100%;
  transform-origin: top center;
  margin-top: 8px;
}

.level-node.active .level-detail {
  transform: translateX(-50%) scaleY(1);
  max-height: 320px;
  padding: 14px 16px;
  opacity: 1;
  pointer-events: auto;
}

.level-detail-title {
  font-size: 0.85rem;
  color: var(--phase-color, var(--cinnabar));
  font-weight: bold;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(107,91,79,0.1);
  font-family: "Noto Serif SC", serif;
}

.level-detail-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 0.75rem;
  line-height: 1.5;
}

.level-detail-item:last-child { margin-bottom: 0; }

.detail-icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  flex-shrink: 0;
  margin-top: 1px;
}

.detail-icon.battle {
  background: rgba(184,58,42,0.1);
  color: var(--cinnabar);
}

.detail-icon.event {
  background: rgba(74,124,89,0.1);
  color: #4a7c59;
}

.detail-text { color: var(--ink-deep); }

.detail-name { font-weight: 600; }

.detail-desc {
  color: var(--ink-light);
  font-size: 0.7rem;
  margin-top: 2px;
}

/* ============================================
   Footer
   ============================================ */
#footer {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-light);
  font-size: 0.85rem;
  letter-spacing: 0.1em;
}

#footer p { margin-bottom: 8px; }

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 1024px) {
  .levels-timeline {
    grid-template-columns: repeat(6, 160px);
    overflow-x: auto;
    justify-content: flex-start;
    padding: 180px 20px 180px;
  }
  .levels-timeline::before {
    left: 20px;
    right: 20px;
  }
  .timeline-head { right: 10px; border-left-width: 24px; }
  .timeline-tail { left: 10px; border-right-width: 16px; }
}

@media (max-width: 768px) {
  section { padding: 50px 4vw; }
  .generals-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .general-card { padding: 22px 16px 18px; border-radius: 14px; }
  .general-canvas { height: 140px; }
  .general-canvas canvas { width: 120px; height: 120px; }
  .general-name { font-size: 1.5rem; }
  .units-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .weapon-row { grid-template-columns: 80px repeat(3, 1fr); gap: 6px; }
  .weapon-slot { padding: 8px 6px; }
  .weapon-name { font-size: 0.75rem; }
  .levels-timeline {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 20px 0;
    overflow-x: visible;
  }
  .levels-timeline::before {
    top: 0;
    bottom: 0;
    left: 50%;
    right: auto;
    width: 3px;
    height: auto;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #b83a2a 0%, #c97b2a 33%, #4a7c59 66%, #3a6ea5 100%);
  }
  .timeline-head, .timeline-tail { display: none; }
  .level-node {
    flex-direction: row;
    width: 100%;
    max-width: 400px;
    height: auto;
    padding: 12px 0;
  }
  .level-node:nth-child(odd),
  .level-node:nth-child(even) {
    grid-row: auto;
    justify-content: center;
    padding: 12px 0;
  }
  .level-branch {
    position: static;
    flex-direction: row !important;
    transform: none !important;
    gap: 12px;
  }
  .level-node:nth-child(odd) .level-branch,
  .level-node:nth-child(even) .level-branch {
    transform: none;
    flex-direction: row;
  }
  .level-node:nth-child(odd) .level-card { order: -1; margin: 0; transform: none; }
  .level-node:nth-child(even) .level-card { order: -1; margin: 0; transform: none; }
  .level-bone { display: none; }
  .level-dot { position: static; transform: none; margin: 0; }
  .level-card { width: auto; max-width: 140px; transform: none !important; }
  .level-detail {
    left: 50%;
    top: 100%;
    bottom: auto;
    transform: translateX(-50%) scaleY(0);
    transform-origin: top center;
    margin-top: 8px;
    margin-bottom: 0;
  }
  .level-node.active .level-detail {
    transform: translateX(-50%) scaleY(1);
  }
  #side-nav { display: none; }
}

@media (max-width: 480px) {
  .generals-grid { grid-template-columns: 1fr; }
  .general-card { padding: 26px 20px 22px; }
  .general-canvas { height: 160px; }
  .general-canvas canvas { width: 140px; height: 140px; }
  .general-name { font-size: 1.7rem; }
  .units-grid { grid-template-columns: repeat(2, 1fr); }
  .weapon-row { grid-template-columns: 60px repeat(3, 1fr); }
  .level-node:nth-child(odd) .level-card,
  .level-node:nth-child(even) .level-card {
    margin: 0 10px;
    max-width: 120px;
  }
}

.game-battle-btn {
  padding: 10px 28px;
  background: var(--cinnabar);
  color: var(--parchment);
  border: none;
  border-radius: var(--card-radius);
  cursor: pointer;
  font-size: 15px;
  font-family: "Noto Serif SC", serif;
  letter-spacing: 0.1em;
  transition: all var(--transition);
}
.game-battle-btn:hover { background: var(--cinnabar-light); transform: translateY(-2px); }
.game-battle-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.game-battle-btn.btn-ready { background: var(--bronze); }
.game-battle-btn.btn-ready:hover { background: var(--bronze-light); }

.game-result-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(44,24,16,0.7);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s;
}
.game-result-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.game-result-overlay h2 {
  font-size: 32px;
  margin-bottom: 10px;
  letter-spacing: 0.15em;
}
.game-result-overlay .sub {
  font-size: 16px;
  color: #c9a96e;
  margin-bottom: 20px;
}
.game-result-overlay .btn {
  padding: 10px 24px;
  background: var(--cinnabar);
  color: var(--parchment);
  border: none;
  border-radius: var(--card-radius);
  cursor: pointer;
  font-size: 14px;
  font-family: "Noto Serif SC", serif;
  letter-spacing: 0.1em;
}

.game-waves-info {
  width: 100%;
  display: flex;
  gap: 6px;
  justify-content: center;
  padding: 6px;
}
.game-wave-dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--ink-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--ink-light);
  background: var(--parchment-dark);
  transition: all 0.3s;
}
.game-wave-dot.done { border-color: var(--bronze); background: var(--bronze); color: #fff; }
.game-wave-dot.current { border-color: var(--cinnabar); color: var(--cinnabar); font-weight: bold; }

// ============================================
// Particle System
// ============================================
class Particle {
  constructor(x, y, config) {
    this.x = x;
    this.y = y;
    this.vx = config.vx || 0;
    this.vy = config.vy || 0;
    this.life = config.life || 60;
    this.maxLife = this.life;
    this.size = config.size || 3;
    this.color = config.color || '#d4a843';
    this.type = config.type || 'dot';
    this.gravity = config.gravity || 0;
    this.drag = config.drag || 1;
    this.rotation = config.rotation || 0;
    this.rotSpeed = config.rotSpeed || 0;
    this.alpha = config.alpha || 1;
  }

  update() {
    this.vx *= this.drag;
    this.vy *= this.drag;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    this.rotation += this.rotSpeed;
    return this.life > 0;
  }

  render(ctx) {
    const a = (this.life / this.maxLife) * this.alpha;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    switch(this.type) {
      case 'dot':
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * (this.life / this.maxLife), 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'square':
        ctx.fillStyle = this.color;
        const s = this.size * (this.life / this.maxLife);
        ctx.fillRect(-s/2, -s/2, s, s);
        break;
      case 'sword':
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.size;
        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(8, 0);
        ctx.stroke();
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(4, -3);
        ctx.lineTo(4, 3);
        ctx.fill();
        break;
      case 'arrow':
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.lineTo(6, 0);
        ctx.stroke();
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(6, 0);
        ctx.lineTo(2, -3);
        ctx.lineTo(2, 3);
        ctx.fill();
        break;
      case 'spark':
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'smoke':
        ctx.fillStyle = this.color;
        const sm = this.size * (1 + (1 - this.life/this.maxLife) * 2);
        ctx.beginPath();
        ctx.arc(0, 0, sm, 0, Math.PI * 2);
        ctx.fill();
        break;
    }
    ctx.restore();
  }
}

class ParticleSystem {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particles = [];
    this.running = false;
    this.resize();
  }

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = rect.width * Math.min(window.devicePixelRatio, 2);
    this.canvas.height = rect.height * Math.min(window.devicePixelRatio, 2);
    this.ctx.scale(Math.min(window.devicePixelRatio, 2), Math.min(window.devicePixelRatio, 2));
    this.w = rect.width;
    this.h = rect.height;
  }

  emit(x, y, count, config) {
    for (let i = 0; i < count; i++) {
      const cfg = { ...config };
      if (cfg.angle !== undefined) {
        const spread = cfg.spread || 0.5;
        const angle = cfg.angle + (Math.random() - 0.5) * spread;
        const speed = cfg.speed || 3;
        cfg.vx = Math.cos(angle) * speed * (0.5 + Math.random() * 0.5);
        cfg.vy = Math.sin(angle) * speed * (0.5 + Math.random() * 0.5);
      }
      if (cfg.randomColor && Array.isArray(cfg.randomColor)) {
        cfg.color = cfg.randomColor[Math.floor(Math.random() * cfg.randomColor.length)];
      }
      this.particles.push(new Particle(x, y, cfg));
    }
  }

  clear() {
    this.particles = [];
    this.ctx.clearRect(0, 0, this.w, this.h);
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.loop();
  }

  stop() {
    this.running = false;
  }

  loop() {
    if (!this.running) return;
    this.ctx.clearRect(0, 0, this.w, this.h);
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      if (!p.update()) {
        this.particles.splice(i, 1);
      } else {
        p.render(this.ctx);
      }
    }
    requestAnimationFrame(() => this.loop());
  }
}

const WEAPON_ICONS = {
  sword(ctx, x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1.2, size * 0.1);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // 细长剑身（柳叶形）
    ctx.beginPath();
    ctx.moveTo(x, y - size * 0.55);
    ctx.quadraticCurveTo(x + size * 0.06, y - size * 0.15, x + size * 0.1, y + size * 0.08);
    ctx.lineTo(x + size * 0.1, y + size * 0.12);
    ctx.lineTo(x - size * 0.1, y + size * 0.12);
    ctx.lineTo(x - size * 0.1, y + size * 0.08);
    ctx.quadraticCurveTo(x - size * 0.06, y - size * 0.15, x, y - size * 0.55);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 剑脊高光
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = Math.max(0.8, size * 0.04);
    ctx.beginPath();
    ctx.moveTo(x, y - size * 0.48);
    ctx.lineTo(x, y + size * 0.08);
    ctx.stroke();
    // 十字护手（加宽增强辨识度）
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, size * 0.15);
    ctx.beginPath();
    ctx.moveTo(x - size * 0.32, y + size * 0.1);
    ctx.lineTo(x + size * 0.32, y + size * 0.1);
    ctx.stroke();
    // 短柄
    ctx.lineWidth = Math.max(1.2, size * 0.1);
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.1);
    ctx.lineTo(x, y + size * 0.38);
    ctx.stroke();
    // 圆剑首
    ctx.beginPath();
    ctx.arc(x, y + size * 0.42, size * 0.08, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  },
  bow(ctx, x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineCap = 'round';
    // 大弯弓
    ctx.lineWidth = Math.max(1.5, size * 0.12);
    ctx.beginPath();
    ctx.arc(x, y, size * 0.4, -Math.PI * 0.65, Math.PI * 0.65);
    ctx.stroke();

    ctx.lineWidth = Math.max(1, size * 0.08);

    ctx.lineTo(x - size * 0.12, y);
    ctx.lineTo(x + size * 0.4 * Math.cos(Math.PI * 0.65), y + size * 0.4 * Math.sin(Math.PI * 0.65));
    ctx.stroke();
    // 箭矢
    ctx.lineWidth = Math.max(1, size * 0.1);
    ctx.beginPath();
    ctx.moveTo(x - size * 0.1, y);
    ctx.lineTo(x + size * 0.35, y);
    ctx.stroke();
    // 箭头
    ctx.beginPath();
    ctx.moveTo(x + size * 0.38, y);
    ctx.lineTo(x + size * 0.3, y - size * 0.06);
    ctx.lineTo(x + size * 0.3, y + size * 0.06);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 箭羽
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(x - size * 0.08, y);
    ctx.lineTo(x - size * 0.15, y - size * 0.06);
    ctx.lineTo(x - size * 0.12, y);
    ctx.lineTo(x - size * 0.15, y + size * 0.06);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  },
  spear(ctx, x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineCap = 'round';
    // 超长细杆
    ctx.lineWidth = Math.max(1, size * 0.09);
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.45);
    ctx.lineTo(x, y - size * 0.4);

    // 菱形枪尖（加宽增强辨识度）
    ctx.lineWidth = Math.max(1.2, size * 0.1);

    ctx.moveTo(x, y - size * 0.55);

    ctx.lineTo(x, y - size * 0.12);
    ctx.lineTo(x + size * 0.12, y - size * 0.22);

    ctx.globalAlpha = 1;
    ctx.restore();
  },
  halberd(ctx, x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // 长杆
    ctx.lineWidth = Math.max(1, size * 0.09);
    ctx.beginPath();

    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 枪尖（缩小，避免与斧刃争夺视觉焦点）
    ctx.lineWidth = Math.max(1, size * 0.09);
    ctx.beginPath();
    ctx.moveTo(x, y - size * 0.55);
    ctx.lineTo(x - size * 0.06, y - size * 0.28);
    ctx.lineTo(x + size * 0.06, y - size * 0.28);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 挂饰（简化为实心小圆点）
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(x + size * 0.04, y + size * 0.1, size * 0.05, 0, Math.PI * 2);

    ctx.restore();
  },
  hammer(ctx, x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color;

    ctx.lineWidth = Math.max(1.2, size * 0.1);

      ctx.beginPath();
      ctx.moveTo(x + dx * size * 0.24, y - size * 0.22);

      ctx.fill(); ctx.stroke();

    // 锤头中心装饰线
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = Math.max(0.8, size * 0.04);
    ctx.beginPath();
    ctx.arc(x, y - size * 0.18, size * 0.1, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  },
  scroll(ctx, x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1.5, size * 0.1);
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(x - size * 0.27, y + size * 0.34);
    ctx.lineTo(x + size * 0.27, y + size * 0.34);
    ctx.stroke();
    // 文字线
    ctx.lineWidth = Math.max(0.8, size * 0.04);
    ctx.globalAlpha = 0.5;
    for (let i = -1; i <= 1; i++) {

      ctx.moveTo(x - size * 0.18, y + i * size * 0.1);

    ctx.lineWidth = Math.max(1.8, size * 0.12);

    // 弩臂
    ctx.beginPath();
    ctx.arc(x + size * 0.08, y + size * 0.08, size * 0.28, -Math.PI * 0.6, Math.PI * 0.6);
    ctx.stroke();
    // 弩弦
    ctx.lineWidth = Math.max(1, size * 0.07);
    ctx.beginPath();
    ctx.moveTo(x + size * 0.08 + size * 0.28 * Math.cos(-Math.PI * 0.6), y + size * 0.08 + size * 0.28 * Math.sin(-Math.PI * 0.6));
    ctx.lineTo(x - size * 0.08, y + size * 0.08);
    ctx.lineTo(x + size * 0.08 + size * 0.28 * Math.cos(Math.PI * 0.6), y + size * 0.08 + size * 0.28 * Math.sin(Math.PI * 0.6));
    ctx.stroke();
    // 弩箭
    ctx.lineWidth = Math.max(1, size * 0.08);
    ctx.beginPath();
    ctx.moveTo(x - size * 0.18, y + size * 0.08);
    ctx.lineTo(x + size * 0.28, y + size * 0.08);
    ctx.stroke();
    // 箭头
    ctx.beginPath();
    ctx.moveTo(x + size * 0.32, y + size * 0.08);
    ctx.lineTo(x + size * 0.24, y + size * 0.02);
    ctx.lineTo(x + size * 0.24, y + size * 0.14);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 扳机/握把（实心矩形块，小尺寸下仍可辨）
    ctx.fillStyle = color;
    ctx.fillRect(x - size * 0.1, y + size * 0.1, size * 0.1, size * 0.18);
    ctx.strokeRect(x - size * 0.1, y + size * 0.1, size * 0.1, size * 0.18);
    ctx.restore();
  },
  cavalry_blade(ctx, x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // 弯刀刀身（加大弯曲度）
    ctx.lineWidth = Math.max(1.2, size * 0.11);
    ctx.beginPath();
    ctx.moveTo(x - size * 0.06, y + size * 0.4);
    ctx.quadraticCurveTo(x + size * 0.32, y + size * 0.1, x + size * 0.02, y - size * 0.48);
    ctx.quadraticCurveTo(x - size * 0.18, y + size * 0.05, x - size * 0.06, y + size * 0.4);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 刀背脊线
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = Math.max(0.8, size * 0.04);
    ctx.beginPath();
    ctx.moveTo(x + size * 0.15, y + size * 0.18);
    ctx.quadraticCurveTo(x + size * 0.22, y - size * 0.15, x - size * 0.02, y - size * 0.38);
    ctx.stroke();
    // 弧形护手（半圆，与 sword 的直十字形成强烈对比）
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.5, size * 0.12);
    ctx.beginPath();
    ctx.arc(x - size * 0.04, y + size * 0.3, size * 0.14, Math.PI * 0.1, Math.PI * 0.9);
    ctx.stroke();
    // 短柄
    ctx.beginPath();
    ctx.moveTo(x - size * 0.04, y + size * 0.42);
    ctx.lineTo(x - size * 0.04, y + size * 0.48);
    ctx.stroke();
    ctx.restore();
  },
  trident(ctx, x, y, size, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineCap = 'round';
    // 螺旋纹理杆
    ctx.lineWidth = Math.max(1, size * 0.09);
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.44);
    ctx.lineTo(x, y - size * 0.37);
    ctx.stroke();
    // 螺旋纹理
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = Math.max(0.6, size * 0.03);
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(x - size * 0.04, y + size * 0.3 - i * size * 0.14);
      ctx.lineTo(x + size * 0.04, y + size * 0.22 - i * size * 0.14);
      ctx.stroke();
    }
    ctx.strokeStyle = color;
    // 三尖（中间长、两侧短的阶梯造型）
    ctx.lineWidth = Math.max(1.2, size * 0.1);
    const prongHeights = [y - size * 0.48, y - size * 0.55, y - size * 0.48];
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * size * 0.15, y - size * 0.37);
      ctx.lineTo(x + i * size * 0.15, prongHeights[i + 1]);
      ctx.stroke();
    }
    // crossbar（加粗，确保与 spear/halberd 的绝对区别）
    ctx.lineWidth = Math.max(1.4, size * 0.12);
    ctx.beginPath();
    ctx.moveTo(x - size * 0.22, y - size * 0.37);
    ctx.lineTo(x + size * 0.22, y - size * 0.37);
    ctx.stroke();
    ctx.restore();
  }
};

const generalSystems = new Map();

function buildGenerals() {
  const grid = document.getElementById('generals-grid');
  GAME_DATA.generals.forEach((g, i) => {
    const card = document.createElement('div');
    card.className = `general-card reveal theme-${g.theme.key}`;
    if (i < 5) card.classList.add('reveal-delay-' + (i + 1));
    card.style.setProperty('--reveal-delay', (i * 0.08) + 's');
    card.dataset.index = i;
    card.innerHTML = `
      <div class="general-canvas">
        <canvas id="gen-canvas-${i}"></canvas>
        <div class="general-equip-indicator"></div>
      </div>
      <div class="general-header">
        <span class="general-name">${g.name}</span>
        <span class="general-equip-name" id="gen-equip-name-${i}"></span>
      </div>
      <div class="general-meta">${g.grid}格 · 攻击${g.atk} · 第${g.unlock}关解锁</div>
      <span class="general-skill">${g.skill}</span>
      <div class="general-skill-desc">${g.skillDesc}</div>
    `;
    card.addEventListener('click', () => triggerGeneralEffect(i, g));
    grid.appendChild(card);

    setTimeout(() => {
      const canvas = document.getElementById(`gen-canvas-${i}`);
      if (canvas) {
        const ps = new ParticleSystem(canvas);
        generalSystems.set(i, ps);
        drawGeneralPortrait(ps.ctx, g, ps.w, ps.h, 0);
      }
    }, 100);
  });

  GAME_DATA.generals.forEach(g => updateGeneralEquipUI(g.name));

  // 启动全局 idle 呼吸动画
  startGeneralIdleAnimations();
}

function drawGeneralPortrait(ctx, general, w, h, time = 0) {
  ctx.clearRect(0, 0, w, h);
  const theme = general.theme;
  const cx = w / 2, cy = h / 2;
  const r = Math.min(w, h) * 0.44;

  // 1. 徽章底牌
  drawBadgeBase(ctx, cx, cy, r, theme);

  // 2. 专属象形图腾
  const drawers = {
    '刘邦': drawPortraitEmperor,
    '萧何': drawPortraitStrategist,
    '樊哙': drawPortraitBerserker,
    '曹参': drawPortraitVanguard,
    '韩信': drawPortraitCommander,
    '张良': drawPortraitAdvisor,
    '周勃': drawPortraitSiege,
    '灌婴': drawPortraitCavalry,
    '彭越': drawPortraitGuerrilla,
    '英布': drawPortraitRebel
  };
  const drawer = drawers[general.name] || drawPortraitEmperor;
  drawer(ctx, cx, cy, theme, time);
}

/* ===== 陶俑Q版通用辅助函数 ===== */

function drawBadgeBase(ctx, cx, cy, r, theme) {
  // 深色陶土底晕
  const grd = ctx.createRadialGradient(cx - r*0.2, cy - r*0.2, 2, cx, cy, r);
  grd.addColorStop(0, theme.canvasBg || '#2a2020');
  grd.addColorStop(0.6, '#1a1a1a');
  grd.addColorStop(1, '#0f0a0a');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

  // 朱砂红光环
  ctx.strokeStyle = theme.accentColor || '#c23a30';
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawRoundFace(ctx, cx, cy, rx, ry, faceColor, inkColor) {
  // 胖圆脸（陶俑特征）
  ctx.fillStyle = faceColor;
  ctx.strokeStyle = inkColor || '#2c1810';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // 腮红（Q版特征）
  ctx.fillStyle = 'rgba(194,58,48,0.15)';
  ctx.beginPath(); ctx.ellipse(cx - rx*0.55, cy + ry*0.25, rx*0.22, ry*0.18, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + rx*0.55, cy + ry*0.25, rx*0.22, ry*0.18, 0, 0, Math.PI*2); ctx.fill();
}

function drawDotEye(ctx, x, y, size, inkColor, time, blinkOffset) {
  // 豆豆眼（Q版特征），带眨眼
  ctx.fillStyle = inkColor;
  const blink = Math.max(0.15, Math.sin(time * 1.8 + blinkOffset));
  ctx.beginPath();
  ctx.ellipse(x, y, size * 0.5 * blink, size * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();

  // 高光点
  if (blink > 0.5) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(x - size*0.15, y - size*0.15, size*0.18, 0, Math.PI*2); ctx.fill();
  }
}

function drawSmile(ctx, cx, cy, width, inkColor, time) {
  // 弯月笑嘴（陶俑笑容）
  ctx.strokeStyle = inkColor;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  const smile = Math.sin(time * 0.8) * 1.5; // 微微起伏
  ctx.beginPath();
  ctx.arc(cx, cy + smile, width, 0.15, Math.PI - 0.15);
  ctx.stroke();
}

function drawCrown(ctx, cx, cy, w, h, color, inkColor, time, beadCount) {
  // 平顶冕冠（如"冖"加宽，Q版占头高1/2）
  ctx.fillStyle = color;
  ctx.strokeStyle = inkColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - w/2, cy);
  ctx.lineTo(cx + w/2, cy);
  ctx.lineTo(cx + w/2 - 4, cy + h);
  ctx.lineTo(cx - w/2 + 4, cy + h);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 冕旒珠子
  ctx.fillStyle = '#d4a843';
  const sway = Math.sin(time * 2) * 2;
  for (let i = 0; i < beadCount; i++) {
    const bx = cx - w/2 + 6 + i * ((w - 12) / (beadCount - 1));
    ctx.beginPath();
    ctx.arc(bx + sway * (i - beadCount/2) * 0.15, cy + h + 4, 2.5, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawHelmet(ctx, cx, cy, w, h, color, inkColor, time) {
  // 圆顶头盔（陶俑Q版）
  ctx.fillStyle = color;
  ctx.strokeStyle = inkColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(cx, cy + h*0.3, w/2, h*0.6, 0, Math.PI, 0);
  ctx.lineTo(cx + w/2, cy + h);
  ctx.lineTo(cx - w/2, cy + h);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawSealMark(ctx, cx, cy, text, color) {
  // 右下角朱砂印章（位置上移，避开腿部）
  ctx.save();
  ctx.translate(cx + 38, cy + 18);
  ctx.rotate(0.15);
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.roundRect(-10, -10, 20, 20, 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#f8f0e0';
  ctx.font = 'bold 12px "Ma Shan Zheng", cursive';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

/* ===== 刘邦 - 帝王金龙 ===== */
function drawPortraitEmperor(ctx, cx, cy, theme, time) {
  const ink = theme.inkColor || '#2c1810';
  const face = theme.faceColor || '#f5d0a8';
  const hair = theme.hairColor || '#1a1a1a';
  const accent = theme.accentColor || '#b83a2a';
  const r = 56;
  const sway = Math.sin(time * 1.2) * 1.5;

  drawBadgeBase(ctx, cx, cy, r, theme);

  // ==== 身体：完整袍服+腰带+下摆+靴 ====
  // 躯干（A字形）
  ctx.fillStyle = '#8b2018';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 14, cy - 10);
  ctx.lineTo(cx + 14, cy - 10);
  ctx.lineTo(cx + 22, cy + 18);
  ctx.lineTo(cx - 22, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 交领Y字
  ctx.strokeStyle = '#f0ece0';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx - 6, cy + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 6, cy + 2); ctx.stroke();

  // 腰带
  ctx.fillStyle = '#d4a843';
  ctx.fillRect(cx - 20, cy + 10, 40, 4);

  // 下摆（波浪底边）
  ctx.fillStyle = '#8b2018';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 22, cy + 18);
  ctx.lineTo(cx + 22, cy + 18);
  ctx.quadraticCurveTo(cx + 26, cy + 30, cx + 18, cy + 38);
  ctx.lineTo(cx - 18, cy + 38);
  ctx.quadraticCurveTo(cx - 26, cy + 30, cx - 22, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 靴子
  ctx.fillStyle = '#2c1810';
  ctx.beginPath(); ctx.ellipse(cx - 10, cy + 44, 7, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 10, cy + 44, 7, 5, 0, 0, Math.PI*2); ctx.fill();

  // ==== 脖子 ====
  ctx.fillStyle = face;
  ctx.fillRect(cx - 5, cy - 16, 10, 8);

  // ==== 脸型（小巧胖圆） ====
  drawRoundFace(ctx, cx + sway*0.2, cy - 26, 10, 11, face, ink);

  // ==== 冕冠（缩小） ====
  drawCrown(ctx, cx + sway*0.2, cy - 42, 36, 14, hair, ink, time, 5);

  // ==== 豆豆眼（缩小） ====
  drawDotEye(ctx, cx - 5 + sway*0.2, cy - 28, 4, ink, time, 0);
  drawDotEye(ctx, cx + 5 + sway*0.2, cy - 28, 4, ink, time, 0.5);

  // ==== 弯月笑嘴（缩小） ====
  drawSmile(ctx, cx + sway*0.2, cy - 20, 7, ink, time);

  // ==== 八字小胡须 ====
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(cx - 4 + sway*0.2, cy - 18); ctx.quadraticCurveTo(cx - 2 + sway*0.2, cy - 14, cx + sway*0.2, cy - 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 4 + sway*0.2, cy - 18); ctx.quadraticCurveTo(cx + 2 + sway*0.2, cy - 14, cx + sway*0.2, cy - 16); ctx.stroke();

  drawSealMark(ctx, cx, cy, '刘', theme.badgeColor || '#d4a843');
}

/* ===== 萧何 - 策卷墨印 ===== */
function drawPortraitStrategist(ctx, cx, cy, theme, time) {
  const ink = theme.inkColor || '#2c1810';
  const face = theme.faceColor || '#f0e0d0';
  const hair = theme.hairColor || '#2a2a2a';
  const accent = theme.accentColor || '#5a7a8a';
  const r = 56;
  const scrollShift = Math.sin(time * 1.5) * 1.5;

  drawBadgeBase(ctx, cx, cy, r, theme);

  // ==== 身体 ====
  ctx.fillStyle = '#4a5a6a';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 13, cy - 10);
  ctx.lineTo(cx + 13, cy - 10);
  ctx.lineTo(cx + 20, cy + 18);
  ctx.lineTo(cx - 20, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.strokeStyle = '#f0ece0';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx - 5, cy + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 5, cy + 2); ctx.stroke();

  ctx.fillStyle = '#5a7a8a';
  ctx.fillRect(cx - 18, cy + 10, 36, 4);

  ctx.fillStyle = '#4a5a6a';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 20, cy + 18);
  ctx.lineTo(cx + 20, cy + 18);
  ctx.quadraticCurveTo(cx + 24, cy + 30, cx + 16, cy + 38);
  ctx.lineTo(cx - 16, cy + 38);
  ctx.quadraticCurveTo(cx - 24, cy + 30, cx - 20, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#2c1810';
  ctx.beginPath(); ctx.ellipse(cx - 9, cy + 44, 6, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 9, cy + 44, 6, 5, 0, 0, Math.PI*2); ctx.fill();

  // ==== 脖子 ====
  ctx.fillStyle = face;
  ctx.fillRect(cx - 4, cy - 16, 8, 8);

  // ==== 脸型 ====
  drawRoundFace(ctx, cx, cy - 26, 10, 11, face, ink);

  // ==== 幞头（缩小紧凑） ====
  ctx.fillStyle = hair;
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 18, cy - 36);
  ctx.lineTo(cx - 22, cy - 28);
  ctx.lineTo(cx + 22, cy - 28);
  ctx.lineTo(cx + 18, cy - 36);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // ==== 豆豆眼 ====
  drawDotEye(ctx, cx - 5, cy - 28, 4, ink, time, 0.5);
  drawDotEye(ctx, cx + 5, cy - 28, 4, ink, time, 0.8);

  // ==== 笑嘴 ====
  drawSmile(ctx, cx, cy - 20, 7, ink, time);

  // ==== 山羊胡 ====
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(cx - 4, cy - 18); ctx.quadraticCurveTo(cx, cy - 14, cx + 4, cy - 18); ctx.stroke();

  // ==== 卷轴（左手） ====
  ctx.fillStyle = '#f0ece0';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.2;
  ctx.fillRect(cx - 16, cy + 2 + scrollShift, 10, 14);
  ctx.strokeRect(cx - 16, cy + 2 + scrollShift, 10, 14);
  ctx.beginPath(); ctx.moveTo(cx - 14, cy + 6 + scrollShift); ctx.lineTo(cx - 8, cy + 6 + scrollShift); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 14, cy + 12 + scrollShift); ctx.lineTo(cx - 10, cy + 12 + scrollShift); ctx.stroke();

  drawSealMark(ctx, cx, cy, '萧', theme.badgeColor || '#5a7a8a');
}

/* ===== 樊哙 - 血斧狂战 ===== */
function drawPortraitBerserker(ctx, cx, cy, theme, time) {
  const ink = theme.inkColor || '#2c1810';
  const face = theme.faceColor || '#e8c8a8';
  const hair = theme.hairColor || '#3a2018';
  const accent = theme.accentColor || '#c4302b';
  const r = 56;
  const shake = Math.sin(time * 10) * 0.8;

  drawBadgeBase(ctx, cx, cy, r, theme);

  // ==== 身体 ====
  ctx.fillStyle = '#6b2018';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 14 + shake, cy - 10);
  ctx.lineTo(cx + 14 + shake, cy - 10);
  ctx.lineTo(cx + 22 + shake, cy + 18);
  ctx.lineTo(cx - 22 + shake, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.strokeStyle = '#f0ece0';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx + shake, cy - 10); ctx.lineTo(cx - 5 + shake, cy + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + shake, cy - 10); ctx.lineTo(cx + 5 + shake, cy + 2); ctx.stroke();

  ctx.fillStyle = '#c4302b';
  ctx.fillRect(cx - 20 + shake, cy + 10, 40, 4);

  ctx.fillStyle = '#6b2018';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 22 + shake, cy + 18);
  ctx.lineTo(cx + 22 + shake, cy + 18);
  ctx.quadraticCurveTo(cx + 26 + shake, cy + 30, cx + 18 + shake, cy + 38);
  ctx.lineTo(cx - 18 + shake, cy + 38);
  ctx.quadraticCurveTo(cx - 26 + shake, cy + 30, cx - 22 + shake, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#3a2018';
  ctx.beginPath(); ctx.ellipse(cx - 10 + shake, cy + 44, 7, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 10 + shake, cy + 44, 7, 5, 0, 0, Math.PI*2); ctx.fill();

  // ==== 脖子 ====
  ctx.fillStyle = face;
  ctx.fillRect(cx - 5 + shake, cy - 16, 10, 8);

  // ==== 脸型（方中带圆，缩小） ====
  ctx.fillStyle = face;
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(cx - 10 + shake, cy - 28, 20, 18, 5);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = 'rgba(196,48,43,0.15)';
  ctx.beginPath(); ctx.ellipse(cx - 7 + shake, cy - 20, 3.5, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 7 + shake, cy - 20, 3.5, 3, 0, 0, Math.PI*2); ctx.fill();

  // ==== 蓬发（紧凑） ====
  ctx.fillStyle = hair;
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 7; i++) {
    const ang = (i / 7) * Math.PI + Math.PI * 0.15;
    const len = 8 + Math.sin(time * 3 + i) * 1.5;
    const sx = cx + Math.cos(ang) * 8;
    const sy = cy - 24 + Math.sin(ang) * 5;
    const ex = cx + Math.cos(ang) * (8 + len);
    const ey = cy - 24 + Math.sin(ang) * (5 + len * 0.4);
    ctx.beginPath(); ctx.moveTo(sx + shake, sy); ctx.lineTo(ex + shake, ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex + shake, ey, 2, 0, Math.PI*2); ctx.fill();
  }

  // ==== 粗眉倒竖 ====
  ctx.strokeStyle = hair;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 6 + shake, cy - 24); ctx.lineTo(cx - 4 + shake, cy - 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 4 + shake, cy - 30); ctx.lineTo(cx + 6 + shake, cy - 24); ctx.stroke();

  // ==== 瞪眼 ====
  drawDotEye(ctx, cx - 5 + shake, cy - 24, 4.5, ink, time, 0);
  drawDotEye(ctx, cx + 5 + shake, cy - 24, 4.5, ink, time, 0.3);

  // ==== 嘴角下撇 ====
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 5 + shake, cy - 16);
  ctx.quadraticCurveTo(cx + shake, cy - 18, cx + 5 + shake, cy - 16);
  ctx.stroke();

  drawSealMark(ctx, cx, cy, '樊', theme.badgeColor || '#c4302b');
}

/* ===== 曹参 - 青铜先锋 ===== */
function drawPortraitVanguard(ctx, cx, cy, theme, time) {
  const ink = theme.inkColor || '#2c1810';
  const face = theme.faceColor || '#f0d8b0';
  const hair = theme.hairColor || '#5a4a30';
  const accent = theme.accentColor || '#8b6914';
  const r = 56;
  const sway = Math.sin(time * 1.5) * 1.5;

  drawBadgeBase(ctx, cx, cy, r, theme);

  // ==== 身体：完整袍服+腰带+下摆+靴 ====
  ctx.fillStyle = '#6b5010';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 14, cy - 10);
  ctx.lineTo(cx + 14, cy - 10);
  ctx.lineTo(cx + 22, cy + 18);
  ctx.lineTo(cx - 22, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.strokeStyle = '#f0ece0';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx - 6, cy + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 6, cy + 2); ctx.stroke();

  ctx.fillStyle = '#8b6914';
  ctx.fillRect(cx - 20, cy + 10, 40, 4);

  ctx.fillStyle = '#6b5010';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 22, cy + 18);
  ctx.lineTo(cx + 22, cy + 18);
  ctx.quadraticCurveTo(cx + 26, cy + 30, cx + 18, cy + 38);
  ctx.lineTo(cx - 18, cy + 38);
  ctx.quadraticCurveTo(cx - 26, cy + 30, cx - 22, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#2c1810';
  ctx.beginPath(); ctx.ellipse(cx - 10, cy + 44, 7, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 10, cy + 44, 7, 5, 0, 0, Math.PI*2); ctx.fill();

  // ==== 脖子 ====
  ctx.fillStyle = face;
  ctx.fillRect(cx - 5, cy - 16, 10, 8);

  // ==== 脸型（小巧胖圆） ====
  drawRoundFace(ctx, cx + sway*0.2, cy - 26, 10, 11, face, ink);

  // ==== 青铜圆顶盔+护额 ====
  drawHelmet(ctx, cx + sway*0.2, cy - 40, 32, 16, hair, ink, time);
  ctx.fillStyle = accent;
  ctx.fillRect(cx - 14 + sway*0.2, cy - 30, 28, 4);

  // ==== 盔顶单翎羽 ====
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx + sway*0.2, cy - 46);
  ctx.quadraticCurveTo(cx + 3 + sway*0.2, cy - 56, cx + sway*0.3, cy - 60 + Math.abs(sway)*0.1);
  ctx.stroke();
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.ellipse(cx + sway*0.3, cy - 60, 2.5, 5, sway*0.03, 0, Math.PI*2); ctx.fill();

  // ==== 浓眉大眼 ====
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cx - 8 + sway*0.2, cy - 30); ctx.lineTo(cx - 4 + sway*0.2, cy - 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 4 + sway*0.2, cy - 30); ctx.lineTo(cx + 8 + sway*0.2, cy - 30); ctx.stroke();
  drawDotEye(ctx, cx - 5 + sway*0.2, cy - 28, 4, ink, time, 0);
  drawDotEye(ctx, cx + 5 + sway*0.2, cy - 28, 4, ink, time, 0.3);

  // ==== 弯月笑嘴 ====
  drawSmile(ctx, cx + sway*0.2, cy - 20, 7, ink, time);

  drawSealMark(ctx, cx, cy, '曹', theme.badgeColor || '#8b6914');
}

/* ===== 韩信 - 帅剑风云 ===== */
function drawPortraitCommander(ctx, cx, cy, theme, time) {

  ctx.lineTo(cx - 22, cy + 18);

  ctx.strokeStyle = '#f0ece0';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx - 6, cy + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 6, cy + 2); ctx.stroke();

/* ===== 张良 - 鹤羽兵法 ===== */
function drawPortraitAdvisor(ctx, cx, cy, theme, time) {

  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;

  ctx.moveTo(cx - 22, cy + 18);
  ctx.lineTo(cx + 22, cy + 18);
  ctx.quadraticCurveTo(cx + 26, cy + 30, cx + 18, cy + 38);
  ctx.lineTo(cx - 18, cy + 38);

  drawRoundFace(ctx, cx, cy - 26, 10, 11, face, ink);

/* ===== 英布 - 烈焰金锤 ===== */
function drawPortraitRebel(ctx, cx, cy, theme, time) {
  const ink = theme.inkColor || '#2c1810';
  const face = theme.faceColor || '#f0c8a0';
  const hair = theme.hairColor || '#5a3018';
  const accent = theme.accentColor || '#e07a2e';
  const r = 56;
  const flicker = Math.sin(time * 4) * 1.2;

  drawBadgeBase(ctx, cx, cy, r, theme);

  // ==== 身体 ====
  ctx.fillStyle = '#8b4a1a';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 14, cy - 10);
  ctx.lineTo(cx + 14, cy - 10);
  ctx.lineTo(cx + 22, cy + 18);
  ctx.lineTo(cx - 22, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.strokeStyle = '#f0ece0';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx - 6, cy + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 6, cy + 2); ctx.stroke();

  ctx.fillStyle = '#e07a2e';
  ctx.fillRect(cx - 20, cy + 10, 40, 4);

  ctx.fillStyle = '#8b4a1a';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 22, cy + 18);
  ctx.lineTo(cx + 22, cy + 18);
  ctx.quadraticCurveTo(cx + 26, cy + 30, cx + 18, cy + 38);
  ctx.lineTo(cx - 18, cy + 38);
  ctx.quadraticCurveTo(cx - 26, cy + 30, cx - 22, cy + 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#3a2018';
  ctx.beginPath(); ctx.ellipse(cx - 10, cy + 44, 6, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 10, cy + 44, 6, 5, 0, 0, Math.PI*2); ctx.fill();

  // ==== 脖子 ====
  ctx.fillStyle = face;
  ctx.fillRect(cx - 5, cy - 16, 10, 8);

  // ==== 脸型 ====
  drawRoundFace(ctx, cx, cy - 26, 10, 11, face, ink);

  // ==== 额前火焰纹（三焰） ====
  for (let i = -1; i <= 1; i++) {
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.7 + Math.sin(time * 4 + i) * 0.3;
    ctx.beginPath();
    ctx.moveTo(cx + i * 6, cy - 36);
    ctx.quadraticCurveTo(cx + i * 6 + 3, cy - 44 + flicker, cx + i * 6, cy - 48 + flicker);
    ctx.quadraticCurveTo(cx + i * 6 - 3, cy - 44 + flicker, cx + i * 6, cy - 36);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ==== 头发上竖如火焰 ====
  ctx.fillStyle = hair;
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  for (let i = 0; i < 7; i++) {
    const ang = (i / 7) * Math.PI + Math.PI * 0.15;
    const len = 10 + Math.sin(time * 4 + i) * 2;
    const sx = cx + Math.cos(ang) * 8;
    const sy = cy - 34 + Math.sin(ang) * 3;
    const ex = cx + Math.cos(ang) * (8 + len * 0.5);
    const ey = cy - 34 + Math.sin(ang) * (3 - len);
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex, ey, 2, 0, Math.PI*2); ctx.fill();
  }

  // ==== 咧嘴大笑 ====
  drawSmile(ctx, cx, cy - 20, 7, ink, time);

  // ==== 豆豆眼 ====
  drawDotEye(ctx, cx - 5, cy - 28, 4, ink, time, 0);
  drawDotEye(ctx, cx + 5, cy - 28, 4, ink, time, 0.3);

  drawSealMark(ctx, cx, cy, '英', theme.badgeColor || '#e07a2e');
}

let idleAnimationId = null;

function startGeneralIdleAnimations() {
  const animate = (now) => {
    const time = now * 0.001;
    generalSystems.forEach((ps, index) => {
      const general = GAME_DATA.generals[index];
      if (!general || ps.running) return;
      drawGeneralPortrait(ps.ctx, general, ps.w, ps.h, time);
    });
    idleAnimationId = requestAnimationFrame(animate);
  };
  idleAnimationId = requestAnimationFrame(animate);
}

function triggerGeneralEffect(index, general) {
  const ps = generalSystems.get(index);
  if (!ps) return;

  // 卡片拍击反馈
  const card = document.querySelector(`.general-card[data-index="${index}"]`);
  if (card) {
    card.classList.add('effect-pulse');
    setTimeout(() => card.classList.remove('effect-pulse'), 500);
  }

  ps.clear();
  const rank = Math.random() > 0.6 ? '金' : Math.random() > 0.5 ? '绿' : '白';
  const effectFn = EFFECTS[general.effectType];
  if (effectFn) {
    effectFn(ps, ps.w / 2, ps.h / 2, rank);
    ps.start();
    setTimeout(() => {
      ps.stop();
      // 停止后由 idle 循环自动重绘肖像
    }, 2000);
  }
}

function updateGeneralEquipUI(generalName) {
  const generalIndex = GAME_DATA.generals.findIndex(g => g.name === generalName);
  if (generalIndex === -1) return;
  const card = document.querySelector(`.general-card[data-index="${generalIndex}"]`);
  const equipNameEl = document.getElementById(`gen-equip-name-${generalIndex}`);
  const equip = equippedWeapons.get(generalName);

  if (card) {
    card.classList.toggle('equipped', !!equip);
  }
  if (equipNameEl) {
    equipNameEl.textContent = equip ? equip.weaponName : '';
  }
}

function buildUnits() {
  const grid = document.getElementById('units-grid');
  GAME_DATA.units.forEach((u, i) => {
    const card = document.createElement('div');
    card.className = 'unit-card reveal';
    if (i < 6) card.classList.add('reveal-delay-' + ((i % 5) + 1));
    card.innerHTML = `
      <div class="unit-canvas">
        <canvas id="unit-canvas-${i}"></canvas>
      </div>
      <div class="unit-name">${u.name}</div>
      <div class="unit-meta">${u.grid}格 · ${u.range}</div>
      <div class="unit-feature">${u.feature}</div>
    `;
    card.addEventListener('click', () => triggerUnitEffect(i, u));
    grid.appendChild(card);

    setTimeout(() => {
      const canvas = document.getElementById(`unit-canvas-${i}`);
      if (canvas) {
        const ps = new ParticleSystem(canvas);
        unitSystems.set(i, ps);
        drawUnitIcon(ps.ctx, u, ps.w, ps.h);
      }
    }, 100);
  });
}

function drawUnitIcon(ctx, unit, w, h) {
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2;
  const cy = h / 2;

  ctx.fillStyle = 'rgba(74,124,89,0.1)';
  ctx.beginPath();
  ctx.arc(cx, cy, 35, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#4a7c59';
  ctx.font = 'bold 22px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(getUnitSymbol(unit.name), cx, cy);
}

function getUnitSymbol(name) {
  const map = { '兵': '卒', '刀盾': '盾', '弓': '弓', '弩': '弩', '骑': '骑',
                '轻骑': '轻', '重骑': '重', '弩骑': '弩', '长枪': '枪', '戟兵': '戟',
                '车弩': '车', '水军': '水' };
  return map[name] || '兵';
}

function triggerUnitEffect(index, unit) {
  const ps = unitSystems.get(index);
  if (!ps) return;
  ps.clear();
  const effectFn = EFFECTS[unit.effectType];
  if (effectFn) {
    effectFn(ps, ps.w / 2, ps.h / 2);
    ps.start();
    setTimeout(() => ps.stop(), 1500);
    setTimeout(() => drawUnitIcon(ps.ctx, unit, ps.w, ps.h), 2000);
  }

    list.appendChild(row);
  });
  // Draw weapon icons on slot canvases
  document.querySelectorAll('.weapon-icon-canvas').forEach(cvs => {
    const wName = cvs.dataset.weapon;
    const effect = cvs.dataset.effect;
    const wType = effectTypeToWeapon[effect] || 'sword';
    const wCtx = cvs.getContext('2d');
    wCtx.clearRect(0, 0, 28, 28);
    if (WEAPON_ICONS[wType]) {
      const iconColor = wName.includes('金') || wName.includes('天子') || wName.includes('国士') ? '#d4a843' :
                        wName.includes('绿') || wName.includes('青') ? '#4a7c59' : '#9a9a9a';
      wCtx.shadowColor = 'rgba(0,0,0,0.25)';
      wCtx.shadowBlur = 3;
      WEAPON_ICONS[wType](wCtx, 14, 14, 24, iconColor);
      wCtx.shadowBlur = 0;
    }
  });

  // Weapon preview canvas
  const canvas = document.getElementById('weapon-preview-canvas');
  weaponSystem = new ParticleSystem(canvas);

  document.querySelectorAll('.weapon-slot').forEach(slot => {
    slot.addEventListener('click', () => {
      const general = slot.dataset.general;
      const weapon = slot.dataset.weapon;
      const rank = slot.dataset.rank;
      const effectType = slot.dataset.effect;

      // Toggle equip/unequip
      const current = equippedWeapons.get(general);
      if(current && current.weaponName === weapon){
        equippedWeapons.delete(general);
        slot.style.boxShadow='';
        slot.style.transform='';
        document.getElementById('weapon-preview-label').textContent = `${general} · ${weapon} (${rank}阶) - 已卸下`;
        updateGeneralEquipUI(general);
      }else{
        // Unequip previous weapon for this general
        document.querySelectorAll('.weapon-slot').forEach(s => {
          if(s.dataset.general === general){
            s.style.boxShadow='';
            s.style.transform='';
          }
        });
        equippedWeapons.set(general, {weaponName:weapon, rank:rank});
        slot.style.boxShadow='0 0 12px ' + (rank==='金'?'#d4a843':rank==='绿'?'#4a7c59':'#9a9a9a');
        slot.style.transform='scale(1.05)';
        document.getElementById('weapon-preview-label').textContent = `${general} · ${weapon} (${rank}阶) - 已装备`;
        updateGeneralEquipUI(general);
      }

      // Show effect preview
      weaponSystem.clear();
      const effectFn = EFFECTS[effectType];
      if (effectFn) {
        effectFn(weaponSystem, weaponSystem.w / 2, weaponSystem.h / 2, rank);
        weaponSystem.start();
        setTimeout(() => weaponSystem.stop(), 2500);
      }
    });
  });
}

// ============================================
// Intersection Observer
// ============================================
function initObservers() {
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

  // Nav highlight
  const sections = ['hero', 'generals', 'units', 'weapons', 'battlefield', 'levels'];
  const navObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        document.querySelectorAll('.nav-dot').forEach(dot => dot.classList.remove('active'));
        const active = document.querySelector(`.nav-dot[data-target="${entry.target.id}"]`);
        if (active) active.classList.add('active');
      }
    });
  }, { threshold: 0.3 });

  sections.forEach(id => {
    const el = document.getElementById(id);
    if (el) navObserver.observe(el);
  });
}
