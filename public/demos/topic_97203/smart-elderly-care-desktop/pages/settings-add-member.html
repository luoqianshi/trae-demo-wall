<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云守护·心相伴</title>
    <style id="theme-vars">
:root {
  --brand-primary: #D4763C;
  --brand-primary-light: #E89B6A;
  --brand-primary-lighter: #F2C9A3;
  --brand-primary-lightest: #FAF0E6;
  --brand-primary-dark: #B55E2A;
  --brand-primary-darker: #8F4720;
  --color-bg: #FFFCF9;
  --color-bg-secondary: #FFF8F2;
  --color-bg-tertiary: #F5EDE6;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-border: #E8DDD4;
  --color-border-light: #F0E8E0;
  --color-text-primary: #3D2E23;
  --color-text-secondary: #7A6B5E;
  --color-text-tertiary: #A99A8D;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;
  --state-success: #4A9D6E;
  --state-success-bg: #EDF7F1;
  --state-warning: #E6A23C;
  --state-warning-bg: #FEF6E6;
  --state-error: #D04848;
  --state-error-bg: #FDEEEE;
  --state-info: #5B8DC9;
  --state-info-bg: #EDF3FA;
  --font-display: 'Outfit', 'Noto Sans SC', system-ui, sans-serif;
  --font-body: 'Outfit', 'Noto Sans SC', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(61, 46, 35, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 46, 35, 0.05);
  --shadow-lg: 0 4px 16px rgba(61, 46, 35, 0.05);
  --shadow-float: 0 8px 24px rgba(61, 46, 35, 0.08);
  --transition-fast: 150ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 300ms ease;
}
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }
.text-xs { font-size: var(--text-xs); line-height: var(--leading-normal); }
.text-sm { font-size: var(--text-sm); line-height: var(--leading-normal); }
.text-base { font-size: var(--text-base); line-height: var(--leading-normal); }
.text-lg { font-size: var(--text-lg); line-height: var(--leading-normal); }
.text-xl { font-size: var(--text-xl); line-height: var(--leading-normal); }
.text-2xl { font-size: var(--text-2xl); line-height: var(--leading-tight); }
.text-3xl { font-size: var(--text-3xl); line-height: var(--leading-tight); }
.text-4xl { font-size: var(--text-4xl); line-height: var(--leading-tight); }
.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-tertiary { color: var(--color-text-tertiary); }
.text-brand { color: var(--brand-primary); }
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error { color: var(--state-error); }
.text-info { color: var(--state-info); }
.bg-brand { background-color: var(--brand-primary); }
.bg-brand-light { background-color: var(--brand-primary-light); }
.bg-brand-lighter { background-color: var(--brand-primary-lighter); }
.bg-brand-lightest { background-color: var(--brand-primary-lightest); }
.bg-page { background-color: var(--color-bg); }
.bg-page-secondary { background-color: var(--color-bg-secondary); }
.bg-surface { background-color: var(--color-surface); }
.border-default { border-color: var(--color-border); }
.border-light { border-color: var(--color-border-light); }
.shadow-sm { box-shadow: var(--shadow-sm); }
.shadow-md { box-shadow: var(--shadow-md); }
.shadow-lg { box-shadow: var(--shadow-lg); }
.shadow-float { box-shadow: var(--shadow-float); }
.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--brand-primary);
    --color-primary-light: var(--brand-primary-light);
    --color-primary-lighter: var(--brand-primary-lighter);
    --color-primary-lightest: var(--brand-primary-lightest);
    --color-primary-dark: var(--brand-primary-dark);
    --color-page-bg: var(--color-bg);
    --color-page-bg-secondary: var(--color-bg-secondary);
    --color-page-surface: var(--color-surface);
    --color-page-border: var(--color-border);
    --color-page-border-light: var(--color-border-light);
    --color-text-primary: var(--color-text-primary);
    --color-text-secondary: var(--color-text-secondary);
    --color-text-tertiary: var(--color-text-tertiary);
    --color-state-success: var(--state-success);
    --color-state-warning: var(--state-warning);
    --color-state-error: var(--state-error);
    --color-state-info: var(--state-info);
    --color-state-success-bg: var(--state-success-bg);
    --color-state-warning-bg: var(--state-warning-bg);
    --color-state-error-bg: var(--state-error-bg);
    --color-state-info-bg: var(--state-info-bg);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); font-family: var(--font-body); }
    td, th { word-break: auto-phrase; }
    th { white-space: nowrap; }
  }
  @layer components {
    .nav-item { @apply flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors duration-200 cursor-pointer; }
    .nav-item:hover { background-color: var(--color-bg-secondary); color: var(--brand-primary); }
    .nav-item[data-active="true"] { background-color: var(--brand-primary); color: var(--color-text-on-primary); }
    .nav-item[data-active="true"]:hover { background-color: var(--brand-primary-dark); }
    .status-dot { width: 8px; height: 8px; border-radius: 9999px; flex-shrink: 0; }
    .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
    .card-hover { transition: box-shadow var(--transition-fast), border-color var(--transition-fast); }
    .card-hover:hover { box-shadow: var(--shadow-md); border-color: var(--brand-primary-lighter); }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 9999px; font-size: var(--text-xs); font-weight: var(--weight-medium); }
    .btn-primary { @apply inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg text-sm font-semibold text-white transition-all duration-200 cursor-pointer; background-color: var(--brand-primary); }
    .btn-primary:hover { background-color: var(--brand-primary-dark); }
    .btn-secondary { @apply inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 cursor-pointer; background-color: var(--color-bg-tertiary); color: var(--color-text-primary); }
    .btn-secondary:hover { background-color: var(--color-bg-secondary); }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0 0 rgba(74, 157, 110, 0.4); } 50% { box-shadow: 0 0 0 6px rgba(74, 157, 110, 0); } }
      .pulse-safe { animation: pulse-green 2s ease-in-out infinite; }
      @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.4); opacity: 0; } }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="flex h-screen overflow-hidden">
    <!-- SLOT: sidebar (shared) -->
    <aside class="w-64 flex-shrink-0 border-r flex flex-col" style="background: var(--color-surface); border-color: var(--color-border);">
      <!-- Brand -->
      <div class="px-6 py-5 border-b" style="border-color: var(--color-border-light);">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background-color: var(--brand-primary-lightest);">
            <i data-lucide="heart-handshake" class="w-5 h-5" style="color: var(--brand-primary);"></i>
          </div>
          <div>
            <div class="text-sm font-semibold" style="color: var(--color-text-primary);">云守护·心相伴</div>
            <div class="text-xs" style="color: var(--color-text-tertiary);">让关爱永不缺席</div>
          </div>
        </div>
      </div>
      <!-- User Info -->
      <div class="px-6 py-4 border-b" style="border-color: var(--color-border-light);">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-semibold" style="background-color: var(--brand-primary-light);">张</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium truncate" style="color: var(--color-text-primary);">张明</div>
            <div class="text-xs" style="color: var(--color-text-tertiary);">照护中: 王淑芬(妈妈)</div>
          </div>
        </div>
      </div>
      <!-- Navigation -->
      <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto no-scrollbar">
        <div class="nav-item" data-nav-key="dashboard" data-active="false" data-dom-id="nav-dashboard">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span>首页概览</span>
        </div>
        <div class="nav-item" data-nav-key="safety" data-active="false" data-dom-id="nav-safety">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
          <span>安全守护</span>
        </div>
        <div class="nav-item" data-nav-key="health" data-active="false" data-dom-id="nav-health">
          <i data-lucide="heart-pulse" class="w-5 h-5"></i>
          <span>健康管理</span>
        </div>
        <div class="nav-item" data-nav-key="services" data-active="false" data-dom-id="nav-services">
          <i data-lucide="hand-helping" class="w-5 h-5"></i>
          <span>生活服务</span>
        </div>
        <div class="nav-item" data-nav-key="family" data-active="false" data-dom-id="nav-family">
          <i data-lucide="message-circle-heart" class="w-5 h-5"></i>
          <span>情感陪伴</span>
        </div>
        <div class="mt-6 px-2">
          <div class="text-xs font-medium uppercase tracking-wider mb-2" style="color: var(--color-text-tertiary);">系统</div>
        </div>
        <div class="nav-item" data-nav-key="settings" data-active="true" data-dom-id="nav-settings">
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span>个人设置</span>
        </div>
      </nav>
      <!-- Footer -->
      <div class="px-6 py-4 border-t" style="border-color: var(--color-border-light);">
        <div class="flex items-center gap-2 text-xs" style="color: var(--color-text-tertiary);">
          <i data-lucide="wifi" class="w-3.5 h-3.5" style="color: var(--state-success);"></i>
          <span>所有设备在线</span>
        </div>
      </div>
    </aside>

    <!-- SLOT: main-wrapper (shared) -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Topbar -->
      <header class="h-16 flex items-center justify-between px-8 border-b flex-shrink-0" style="background: var(--color-surface); border-color: var(--color-border);">
        <!-- SLOT: pageTitle -->
        <h1 class="text-lg font-semibold" style="color: var(--color-text-primary);">添加家庭成员</h1>
        <div class="flex items-center gap-4">
          <!-- Notification bell -->
          <button class="relative p-2 rounded-lg transition-colors duration-200 cursor-pointer" style="color: var(--color-text-secondary);" onmouseover="this.style.backgroundColor='var(--color-bg-secondary)'" onmouseout="this.style.backgroundColor='transparent'">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full" style="background-color: var(--state-error);"></span>
          </button>
          <!-- Emergency button -->
          <button class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold text-white transition-colors duration-200 cursor-pointer" style="background-color: var(--state-error);">
            <i data-lucide="phone-call" class="w-4 h-4"></i>
            <span>紧急呼叫</span>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <main class="flex-1 overflow-y-auto" style="background: var(--color-bg);">
        <div class="p-8">
          <div class="max-w-[560px] mx-auto">
            <!-- Back link -->
            <a href="#" data-dom-id="btn-back-to-settings" class="inline-flex items-center gap-1.5 text-sm font-medium mb-6 transition-colors duration-200 cursor-pointer" style="color: var(--brand-primary);">
              <span>&larr;</span>
              <span>返回个人设置</span>
            </a>

            <!-- Form card -->
            <div class="card p-6">
              <!-- 姓名 -->
              <div class="mb-5">
                <label class="block text-sm font-medium mb-1.5" style="color: var(--color-text-primary);">姓名</label>
                <input type="text" placeholder="请输入成员姓名" class="w-full px-4 py-2.5 rounded-lg text-sm transition-colors duration-200 outline-none" style="background: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-text-primary);" onfocus="this.style.borderColor='var(--brand-primary)';this.style.boxShadow='0 0 0 3px var(--brand-primary-lightest)'" onblur="this.style.borderColor='var(--color-border)';this.style.boxShadow='none'">
              </div>

              <!-- 手机号 -->
              <div class="mb-5">
                <label class="block text-sm font-medium mb-1.5" style="color: var(--color-text-primary);">手机号</label>
                <div class="flex items-center gap-0">
                  <div class="flex items-center px-3 py-2.5 rounded-l-lg text-sm font-medium" style="background: var(--color-bg-tertiary); border: 1px solid var(--color-border); border-right: none; color: var(--color-text-secondary);">+86</div>
                  <input type="tel" placeholder="请输入手机号" class="flex-1 px-4 py-2.5 rounded-r-lg text-sm transition-colors duration-200 outline-none" style="background: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-text-primary);" onfocus="this.style.borderColor='var(--brand-primary)';this.style.boxShadow='0 0 0 3px var(--brand-primary-lightest)'" onblur="this.style.borderColor='var(--color-border)';this.style.boxShadow='none'">
                </div>
              </div>

              <!-- 与您的关系 -->
              <div class="mb-5">
                <label class="block text-sm font-medium mb-1.5" style="color: var(--color-text-primary);">与您的关系</label>
                <select class="w-full px-4 py-2.5 rounded-lg text-sm transition-colors duration-200 outline-none appearance-none cursor-pointer" style="background: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-text-primary); background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23A99A8D%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><polyline points=%226 9 12 15 18 9%22/></svg>'); background-repeat: no-repeat; background-position: right 12px center; padding-right: 2.5rem;" onfocus="this.style.borderColor='var(--brand-primary)';this.style.boxShadow='0 0 0 3px var(--brand-primary-lightest)'" onblur="this.style.borderColor='var(--color-border)';this.style.boxShadow='none'">
                  <option value="" disabled selected style="color: var(--color-text-tertiary);">请选择关系</option>
                  <option value="parent">父母</option>
                  <option value="spouse">配偶</option>
                  <option value="child">子女</option>
                  <option value="sibling">兄弟姐妹</option>
                  <option value="other">其他</option>
                </select>
              </div>

              <!-- 角色 -->
              <div class="mb-5">
                <label class="block text-sm font-medium mb-3" style="color: var(--color-text-primary);">角色</label>
                <div class="grid grid-cols-2 gap-3">
                  <!-- 管理员 (selected) -->
                  <div class="flex flex-col items-center gap-2.5 p-4 rounded-lg cursor-pointer transition-all duration-200" style="border: 2px solid var(--brand-primary); background: var(--brand-primary-lightest);">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--brand-primary-lightest);">
                      <i data-lucide="shield" class="w-5 h-5" style="color: var(--brand-primary);"></i>
                    </div>
                    <div class="text-sm font-semibold text-center" style="color: var(--color-text-primary);">管理员</div>
                    <div class="text-xs text-center" style="color: var(--color-text-secondary);">可查看所有数据并管理设置</div>
                  </div>
                  <!-- 协助者 (unselected) -->
                  <div class="flex flex-col items-center gap-2.5 p-4 rounded-lg cursor-pointer transition-all duration-200" style="border: 1px solid var(--color-border); background: var(--color-surface);">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-bg-tertiary);">
                      <i data-lucide="eye" class="w-5 h-5" style="color: var(--color-text-tertiary);"></i>
                    </div>
                    <div class="text-sm font-medium text-center" style="color: var(--color-text-primary);">协助者</div>
                    <div class="text-xs text-center" style="color: var(--color-text-tertiary);">可查看数据，不可修改设置</div>
                  </div>
                </div>
                <!-- 权限说明 -->
                <p class="mt-3 text-xs" style="color: var(--color-text-tertiary);">管理员可以管理被照护人的所有设备和设置，协助者仅能查看数据。</p>
              </div>

              <!-- Divider -->
              <div class="my-6" style="border-top: 1px solid var(--color-border-light);"></div>

              <!-- 邀请方式 -->
              <div class="mb-6">
                <label class="block text-sm font-medium mb-3" style="color: var(--color-text-primary);">邀请方式</label>
                <div class="grid grid-cols-2 gap-3">
                  <!-- 短信邀请 (selected) -->
                  <div class="flex items-center gap-3 p-4 rounded-lg cursor-pointer transition-all duration-200" style="border: 2px solid var(--brand-primary); background: var(--brand-primary-lightest);">
                    <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background: var(--brand-primary-lightest);">
                      <i data-lucide="message-square" class="w-4.5 h-4.5" style="color: var(--brand-primary);"></i>
                    </div>
                    <div>
                      <div class="text-sm font-semibold" style="color: var(--color-text-primary);">短信邀请</div>
                      <div class="text-xs mt-0.5" style="color: var(--color-text-secondary);">向对方手机号发送邀请链接</div>
                    </div>
                  </div>
                  <!-- 微信邀请 (unselected) -->
                  <div class="flex items-center gap-3 p-4 rounded-lg cursor-pointer transition-all duration-200" style="border: 1px solid var(--color-border); background: var(--color-surface);">
                    <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background: var(--color-bg-tertiary);">
                      <i data-lucide="qr-code" class="w-4.5 h-4.5" style="color: var(--color-text-tertiary);"></i>
                    </div>
                    <div>
                      <div class="text-sm font-medium" style="color: var(--color-text-primary);">微信邀请</div>
                      <div class="text-xs mt-0.5" style="color: var(--color-text-tertiary);">生成微信分享二维码</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Submit button -->
              <button class="btn-primary w-full" style="height: 44px;" data-dom-id="btn-submit-member">
                <i data-lucide="send" class="w-4 h-4"></i>
                <span>发送邀请</span>
              </button>

              <!-- Note -->
              <p class="mt-4 text-xs text-center" style="color: var(--color-text-tertiary);">对方接受邀请后将自动加入家庭圈</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
