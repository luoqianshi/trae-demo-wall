<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 云守护·心相伴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style id="theme-vars">
:root {
  --brand-primary: #D4763C;
  --brand-primary-light: #E89B6A;
  --brand-primary-lighter: #F2C9A3;
  --brand-primary-lightest: #FAF0E6;
  --brand-primary-dark: #B55E2A;
  --brand-primary-darker: #8F4720;
  --color-bg: #FFFCF9;
  --color-bg-secondary: #FFF8F2;
  --color-bg-tertiary: #F5EDE6;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-border: #E8DDD4;
  --color-border-light: #F0E8E0;
  --color-text-primary: #3D2E23;
  --color-text-secondary: #7A6B5E;
  --color-text-tertiary: #A99A8D;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;
  --state-success: #4A9D6E;
  --state-success-bg: #EDF7F1;
  --state-warning: #E6A23C;
  --state-warning-bg: #FEF6E6;
  --state-error: #D04848;
  --state-error-bg: #FDEEEE;
  --state-info: #5B8DC9;
  --state-info-bg: #EDF3FA;
  --font-display: 'Outfit', 'Noto Sans SC', system-ui, sans-serif;
  --font-body: 'Outfit', 'Noto Sans SC', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(61, 46, 35, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 46, 35, 0.05);
  --shadow-lg: 0 4px 16px rgba(61, 46, 35, 0.05);
  --shadow-float: 0 8px 24px rgba(61, 46, 35, 0.08);
  --transition-fast: 150ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 300ms ease;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <style type="text/tailwindcss">
@theme inline {
  --color-brand-primary: var(--brand-primary);
  --color-brand-primary-light: var(--brand-primary-light);
  --color-brand-primary-lighter: var(--brand-primary-lighter);
  --color-brand-primary-lightest: var(--brand-primary-lightest);
  --color-brand-primary-dark: var(--brand-primary-dark);
  --color-brand-primary-darker: var(--brand-primary-darker);
  --color-bg-page: var(--color-bg);
  --color-bg-secondary: var(--color-bg-secondary);
  --color-bg-tertiary: var(--color-bg-tertiary);
  --color-surface: var(--color-surface);
  --color-surface-elevated: var(--color-surface-elevated);
  --color-border-default: var(--color-border);
  --color-border-light: var(--color-border-light);
  --color-text-primary: var(--color-text-primary);
  --color-text-secondary: var(--color-text-secondary);
  --color-text-tertiary: var(--color-text-tertiary);
  --color-text-inverse: var(--color-text-inverse);
  --color-state-success: var(--state-success);
  --color-state-success-bg: var(--state-success-bg);
  --color-state-warning: var(--state-warning);
  --color-state-error: var(--state-error);
  --color-state-info: var(--state-info);
  --font-family-display: var(--font-display);
  --font-family-body: var(--font-body);
}

@layer base {
  *, *::before, *::after {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--font-body);
    color: var(--color-text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
}

@layer components {
  .login-input {
    width: 100%;
    height: 44px;
    padding: 0 2.5rem 0 2.75rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    color: var(--color-text-primary);
    font-size: var(--text-sm);
    font-family: var(--font-body);
    outline: none;
    transition: border-color var(--transition-base), box-shadow var(--transition-base);
  }
  .login-input::placeholder {
    color: var(--color-text-tertiary);
  }
  .login-input:focus {
    border-color: var(--brand-primary);
    box-shadow: 0 0 0 3px rgba(212, 118, 60, 0.1);
  }
  .login-input-icon {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-text-tertiary);
    pointer-events: none;
  }
  .login-input-action {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-text-tertiary);
    cursor: pointer;
    transition: color var(--transition-fast);
  }
  .login-input-action:hover {
    color: var(--color-text-secondary);
  }
  .btn-login {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--brand-primary);
    color: var(--color-text-on-primary);
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    font-family: var(--font-body);
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background-color var(--transition-base), box-shadow var(--transition-base), transform var(--transition-fast);
  }
  .btn-login:hover {
    background: var(--brand-primary-dark);
    box-shadow: 0 4px 12px rgba(212, 118, 60, 0.3);
  }
  .btn-login:active {
    transform: scale(0.98);
  }
  .social-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-full);
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    cursor: pointer;
    transition: background-color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .social-btn:hover {
    border-color: var(--brand-primary-lighter);
    box-shadow: var(--shadow-md);
  }
}
    </style>
</head>
<body class="min-h-screen bg-surface">
    <div class="flex min-h-screen">
        <!-- ===== Left Side: Brand Visual Area (55%) ===== -->
        <div class="relative w-[55%] min-h-screen flex flex-col overflow-hidden" style="background: linear-gradient(165deg, #FFFCF9 0%, #FFF8F2 25%, #FAF0E6 55%, #F2C9A3 85%, #E89B6A 100%);">

            <!-- Soft decorative background elements -->
            <div class="absolute w-[500px] h-[500px] rounded-full" style="background: var(--brand-primary); opacity: 0.06; top: -150px; right: -200px;"></div>
            <div class="absolute w-[300px] h-[300px] rounded-full" style="background: var(--brand-primary-light); opacity: 0.08; bottom: 80px; left: -100px;"></div>

            <!-- Brand Logo Area -->
            <div class="relative z-10 flex items-center gap-3 px-12 pt-10">
                <div class="flex items-center justify-center w-11 h-11 rounded-full" style="background: var(--brand-primary);">
                    <i data-lucide="heart-handshake" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight" style="color: var(--color-text-primary); font-family: var(--font-display);">云守护·心相伴</h1>
                    <p class="text-xs mt-0.5" style="color: var(--color-text-tertiary);">让关爱永不缺席</p>
                </div>
            </div>

            <!-- Hero Illustration: Product Value Visual -->
            <div class="relative z-10 flex-1 flex items-center justify-center px-12">
                <div class="relative w-full">
                    <!-- Multi-layered frame effect -->
                    <div class="absolute inset-0 rounded-3xl translate-x-2 translate-y-2" style="background: rgba(212, 118, 60, 0.08);"></div>
                    <div class="absolute inset-0 rounded-3xl translate-x-1 translate-y-1" style="background: rgba(212, 118, 60, 0.06);"></div>
                    <!-- Main image with object-fit cover and proper aspect ratio -->
                    <div class="relative rounded-3xl overflow-hidden" style="aspect-ratio: 4/3; box-shadow: 0 12px 40px rgba(61, 46, 35, 0.12), 0 4px 12px rgba(61, 46, 35, 0.06);">
                        <img src="../assets/login-hero.jpg" alt="子女远程守护父母" class="w-full h-full object-cover" style="display: block;">
                        <!-- Warm gradient overlay at bottom for depth -->
                        <div class="absolute inset-x-0 bottom-0 h-24" style="background: linear-gradient(to top, rgba(255, 248, 242, 0.5), transparent);"></div>
                    </div>
                    <!-- Floating accent elements -->
                    <div class="absolute -top-3 -right-3 w-10 h-10 rounded-xl flex items-center justify-center" style="background: var(--color-surface); box-shadow: 0 4px 12px rgba(61, 46, 35, 0.08);">
                        <i data-lucide="shield-check" class="w-5 h-5" style="color: var(--state-success);"></i>
                    </div>
                    <div class="absolute -bottom-2 -left-2 w-10 h-10 rounded-xl flex items-center justify-center" style="background: var(--color-surface); box-shadow: 0 4px 12px rgba(61, 46, 35, 0.08);">
                        <i data-lucide="heart-pulse" class="w-5 h-5" style="color: var(--brand-primary);"></i>
                    </div>
                </div>
            </div>

            <!-- Feature Highlights -->
            <div class="relative z-10 px-12 pb-10">
                <div class="flex gap-8">
                    <!-- 安全守护 -->
                    <div class="flex items-start gap-3 flex-1">
                        <div class="flex items-center justify-center w-9 h-9 rounded-lg flex-shrink-0" style="background: var(--color-surface); box-shadow: 0 2px 8px rgba(61, 46, 35, 0.06);">
                            <i data-lucide="shield-check" class="w-4 h-4" style="color: var(--state-success);"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold leading-tight" style="color: var(--color-text-primary);">安全守护</p>
                            <p class="text-xs mt-1 leading-relaxed" style="color: var(--color-text-secondary);">24小时智能监护，异常即时告警</p>
                        </div>
                    </div>
                    <!-- 健康管理 -->
                    <div class="flex items-start gap-3 flex-1">
                        <div class="flex items-center justify-center w-9 h-9 rounded-lg flex-shrink-0" style="background: var(--color-surface); box-shadow: 0 2px 8px rgba(61, 46, 35, 0.06);">
                            <i data-lucide="heart-pulse" class="w-4 h-4" style="color: var(--state-warning);"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold leading-tight" style="color: var(--color-text-primary);">健康管理</p>
                            <p class="text-xs mt-1 leading-relaxed" style="color: var(--color-secondary);">用药提醒、体征监测、健康报告</p>
                        </div>
                    </div>
                    <!-- 情感陪伴 -->
                    <div class="flex items-start gap-3 flex-1">
                        <div class="flex items-center justify-center w-9 h-9 rounded-lg flex-shrink-0" style="background: var(--color-surface); box-shadow: 0 2px 8px rgba(61, 46, 35, 0.06);">
                            <i data-lucide="message-circle-heart" class="w-4 h-4" style="color: var(--brand-primary);"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold leading-tight" style="color: var(--color-text-primary);">情感陪伴</p>
                            <p class="text-xs mt-1 leading-relaxed" style="color: var(--color-text-secondary);">视频通话、家庭圈动态，亲情不断联</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Right Side: Login Form (45%) ===== -->
        <div class="w-[45%] min-h-screen flex items-center justify-center" style="background: var(--color-surface);">
            <div class="w-full max-w-[400px] px-8">
                <!-- Welcome -->
                <h2 class="text-2xl font-semibold leading-tight" style="color: var(--color-text-primary); font-family: var(--font-display);">欢迎回来</h2>
                <p class="text-sm mt-2" style="color: var(--color-text-secondary);">登录账号，开始守护家人</p>

                <!-- Phone Input -->
                <div class="mt-8">
                    <label class="block text-sm font-medium mb-2" style="color: var(--color-text-primary);">手机号</label>
                    <div class="relative">
                        <i data-lucide="phone" class="login-input-icon w-4 h-4"></i>
                        <input type="tel" class="login-input" placeholder="请输入手机号" autocomplete="tel">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mt-4">
                    <label class="block text-sm font-medium mb-2" style="color: var(--color-text-primary);">密码</label>
                    <div class="relative">
                        <i data-lucide="lock" class="login-input-icon w-4 h-4"></i>
                        <input id="password-input" type="password" class="login-input" placeholder="请输入密码" style="padding-right: 2.75rem;" autocomplete="current-password">
                        <button type="button" class="login-input-action" onclick="togglePassword()" aria-label="切换密码可见性">
                            <i data-lucide="eye-off" id="eye-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="mt-3 flex justify-end">
                    <a href="#" class="text-sm hover:underline" style="color: var(--brand-primary);">忘记密码?</a>
                </div>

                <!-- Login Button -->
                <div class="mt-6">
                    <button type="button" class="btn-login" data-dom-id="btn-login">登 录</button>
                </div>

                <!-- Divider -->
                <div class="flex items-center gap-3 mt-8">
                    <div class="flex-1 h-px" style="background: var(--color-border-light);"></div>
                    <span class="text-xs" style="color: var(--color-text-tertiary);">其他登录方式</span>
                    <div class="flex-1 h-px" style="background: var(--color-border-light);"></div>
                </div>

                <!-- Social Login -->
                <div class="flex items-center justify-center gap-5 mt-6">
                    <!-- WeChat -->
                    <button type="button" class="social-btn" title="微信登录">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#07C160">
                            <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.045c.133 0 .241-.11.241-.245 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-7.062-6.122zM14.84 13.186c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982z"/>
                        </svg>
                    </button>
                    <!-- SMS -->
                    <button type="button" class="social-btn" title="短信验证码登录" style="background: var(--brand-primary-lightest); border-color: var(--brand-primary-lighter);">
                        <i data-lucide="message-square" class="w-5 h-5" style="color: var(--brand-primary);"></i>
                    </button>
                    <!-- Alipay -->
                    <button type="button" class="social-btn" title="支付宝登录" style="background: var(--state-info-bg); border-color: #C5D8EE;">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#1677FF">
                            <path d="M21.422 15.358c-1.098-.487-5.206-2.359-6.044-2.704.648-1.238 1.13-2.586 1.38-4.014h-4.2v-1.2h5.16v-.84h-5.16V4.694h-2.04s-.036.036-.036.06v1.756H5.376v.84h5.16v1.2H6.336v.84h8.22c-.192.924-.504 1.8-.924 2.604-1.992-.684-4.548-1.14-6.972-.648-2.916.588-4.788 2.628-4.248 4.776.54 2.148 3.456 3.108 6.324 2.52 2.04-.42 3.804-1.56 5.076-3.18 1.548.78 5.4 2.616 5.4 2.616V21H24V15.96c0-.372-.228-.768-.578-.602zM7.596 19.186c-2.604.6-5.076-.3-5.436-2.16-.36-1.86 1.56-3.78 4.164-4.38 1.944-.456 4.104-.192 5.94.528-1.332 2.064-3.348 3.636-4.668 6.012z"/>
                        </svg>
                    </button>
                </div>

                <!-- Register Link -->
                <div class="mt-8 text-center text-sm" style="color: var(--color-text-secondary);">
                    还没有账号？
                    <a href="#" class="font-medium hover:underline" style="color: var(--brand-primary);" data-dom-id="link-register">立即注册</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Toggle password visibility
        function togglePassword() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
