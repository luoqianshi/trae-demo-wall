<header class="topbar">
  <div class="title-area">
    <button *ngIf="showBack" class="back-btn" (click)="onBack()" aria-label="返回">
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
    </button>
    <h1 class="title">{{ pageTitle }}</h1>
  </div>
  <div class="actions-area">
    <ng-content></ng-content>
    <button class="bell-btn" aria-label="通知" *ngIf="!showBack">
      <span nz-icon nzType="bell" nzTheme="outline"></span>
      <span class="bell-dot"></span>
    </button>
    <button class="emergency-btn" *ngIf="!showBack">
      <span nz-icon nzType="phone" nzTheme="outline"></span>
      <span>紧急呼叫</span>
    </button>
  </div>
</header>
