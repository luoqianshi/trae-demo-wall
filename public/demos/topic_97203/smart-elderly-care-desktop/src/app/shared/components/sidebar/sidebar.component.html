<aside class="sidebar">
  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo">
      <span nz-icon nzType="heart" nzTheme="outline"></span>
    </div>
    <div class="brand-text">
      <div class="brand-title">云守护·心相伴</div>
      <div class="brand-subtitle">让关爱永不缺席</div>
    </div>
  </div>

  <!-- User Info -->
  <div class="user-info">
    <div class="user-avatar">张</div>
    <div class="user-meta">
      <div class="user-name">张明</div>
      <div class="user-relation">照护中: 王淑芬(妈妈)</div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav">
    <a *ngFor="let item of navItems"
       class="nav-item"
       [class.active]="activeKey === item.key"
       [routerLink]="['/' + item.key]">
      <span nz-icon [nzType]="item.icon" nzTheme="outline"></span>
      <span>{{ item.label }}</span>
    </a>
    <div class="nav-divider">
      <span>系统</span>
    </div>
    <a *ngFor="let item of systemItems"
       class="nav-item"
       [class.active]="activeKey === item.key"
       [routerLink]="['/' + item.key]">
      <span nz-icon [nzType]="item.icon" nzTheme="outline"></span>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <!-- Footer -->
  <div class="footer">
    <span nz-icon nzType="wifi" nzTheme="outline" class="wifi-icon"></span>
    <span>所有设备在线</span>
  </div>
</aside>
