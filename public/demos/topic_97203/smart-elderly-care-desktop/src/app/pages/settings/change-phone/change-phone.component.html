<div class="page">
  <div class="back-bar">
    <button class="back-btn" (click)="goBack()">
      <span nz-icon nzType="left" nzTheme="outline"></span>
      <span>返回</span>
    </button>
    <h1 class="page-title">修改手机号</h1>
  </div>

  <div class="card">
    <div class="info-bar">
      <span nz-icon nzType="safety" nzTheme="outline"></span>
      <span>修改手机号后，需使用新手机号登录，原手机号将不再可用</span>
    </div>

    <div class="current-phone">
      <span class="cp-label">当前手机号</span>
      <span class="cp-value">{{ currentPhoneMasked }}</span>
    </div>

    <nz-steps *ngIf="step !== 'done'" class="stepper" [nzCurrent]="stepIndex" [nzSize]="'small'">
      <nz-step nzTitle="验证原手机"></nz-step>
      <nz-step nzTitle="输入新手机"></nz-step>
      <nz-step nzTitle="验证新手机"></nz-step>
    </nz-steps>

    <ng-container [ngSwitch]="step">
      <div *ngSwitchCase="'verify-current'" class="step-body">
        <h3 class="step-title">请输入原手机号验证码</h3>
        <p class="step-desc">验证码已发送至 {{ currentPhoneMasked }}</p>
        <app-otp-input (completed)="onCurrentCodeCompleted($event)"></app-otp-input>
        <div class="resend-row">
          <button
            class="resend-btn"
            [disabled]="currentCountdown > 0"
            (click)="sendCurrentCode()">
            <ng-container *ngIf="currentCountdown > 0; else resendCurrent">
              {{ currentCountdown }}s 后重新获取
            </ng-container>
            <ng-template #resendCurrent>重新获取验证码</ng-template>
          </button>
        </div>
        <div class="form-actions">
          <button class="btn-secondary" (click)="goBack()">取消</button>
          <button class="btn-primary" (click)="goToEnterNew()">下一步</button>
        </div>
      </div>

      <div *ngSwitchCase="'enter-new'" class="step-body">
        <h3 class="step-title">请输入新手机号</h3>
        <p class="step-desc">新手机号将作为您的登录账号</p>
        <input
          class="form-input"
          type="tel"
          inputmode="numeric"
          maxlength="11"
          placeholder="请输入新手机号"
          [(ngModel)]="newPhone" />
        <div class="form-actions">
          <button class="btn-secondary" (click)="step = 'verify-current'">上一步</button>
          <button class="btn-primary" (click)="goToVerifyNew()">下一步</button>
        </div>
      </div>

      <div *ngSwitchCase="'verify-new'" class="step-body">
        <h3 class="step-title">请输入新手机号验证码</h3>
        <p class="step-desc">验证码已发送至 {{ newPhone }}</p>
        <app-otp-input (completed)="onNewCodeCompleted($event)"></app-otp-input>
        <div class="resend-row">
          <button
            class="resend-btn"
            [disabled]="newCountdown > 0"
            (click)="sendNewCode()">
            <ng-container *ngIf="newCountdown > 0; else resendNew">
              {{ newCountdown }}s 后重新获取
            </ng-container>
            <ng-template #resendNew>重新获取验证码</ng-template>
          </button>
        </div>
        <div class="form-actions">
          <button class="btn-secondary" (click)="step = 'enter-new'">上一步</button>
          <button class="btn-primary" [disabled]="submitting" (click)="submit()">
            {{ submitting ? '提交中...' : '完成' }}
          </button>
        </div>
      </div>

      <div *ngSwitchCase="'done'" class="step-body success">
        <div class="success-icon">
          <span nz-icon nzType="check-circle" nzTheme="fill"></span>
        </div>
        <h3 class="success-title">手机号修改成功</h3>
        <p class="success-desc">即将返回设置页...</p>
      </div>
    </ng-container>

    <div class="safety-tip">
      <span nz-icon nzType="phone" nzTheme="outline"></span>
      <span>遇到问题？请联系客服 <strong>400-888-1234</strong></span>
    </div>
  </div>
</div>
