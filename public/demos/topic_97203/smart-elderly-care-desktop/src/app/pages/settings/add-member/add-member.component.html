<div class="page">
  <div class="back-bar">
    <button class="back-btn" (click)="goBack()">
      <span nz-icon nzType="left" nzTheme="outline"></span>
      <span>返回</span>
    </button>
    <h1 class="page-title">添加家庭成员</h1>
  </div>

  <div class="card">
    <div class="form-section">
      <label class="form-label">姓名</label>
      <input
        class="form-input"
        type="text"
        placeholder="请输入成员姓名"
        maxlength="20"
        [(ngModel)]="name" />
    </div>

    <div class="form-section">
      <label class="form-label">手机号</label>
      <div class="phone-row">
        <span class="phone-prefix">{{ phonePrefix }}</span>
        <input
          class="form-input phone-input"
          type="tel"
          inputmode="numeric"
          maxlength="11"
          placeholder="请输入手机号"
          [(ngModel)]="phone" />
      </div>
    </div>

    <div class="form-section">
      <label class="form-label">关系</label>
      <nz-select
        class="full-width"
        nzPlaceHolder="请选择关系"
        [(ngModel)]="relation">
        <nz-option
          *ngFor="let r of relations"
          [nzValue]="r"
          [nzLabel]="r">
        </nz-option>
      </nz-select>
    </div>

    <div class="form-section">
      <label class="form-label">角色</label>
      <div class="role-grid">
        <div
          *ngFor="let r of roleOptions"
          class="role-card"
          [class.active]="role === r.value"
          (click)="selectRole(r.value)">
          <div class="role-icon">
            <span nz-icon [nzType]="r.icon" nzTheme="outline"></span>
          </div>
          <div class="role-info">
            <div class="role-title">{{ r.title }}</div>
            <div class="role-desc">{{ r.desc }}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <label class="form-label">邀请方式</label>
      <div class="invite-grid">
        <div
          *ngFor="let m of inviteOptions"
          class="invite-card"
          [class.active]="inviteMethod === m.value"
          (click)="selectInviteMethod(m.value)">
          <div class="invite-icon">
            <span nz-icon [nzType]="m.icon" nzTheme="outline"></span>
          </div>
          <div class="invite-info">
            <div class="invite-title">{{ m.title }}</div>
            <div class="invite-desc">{{ m.desc }}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="tip-bar">
      <span nz-icon nzType="info-circle" nzTheme="outline"></span>
      <span>对方接受邀请后将自动加入家庭圈</span>
    </div>

    <div class="form-actions">
      <button class="btn-secondary" (click)="goBack()">取消</button>
      <button class="btn-primary" [disabled]="loading" (click)="submit()">
        {{ loading ? '发送中...' : '发送邀请' }}
      </button>
    </div>
  </div>
</div>
