<div class="page">
  <div class="back-bar">
    <button class="back-btn" (click)="goBack()">
      <span nz-icon nzType="left" nzTheme="outline"></span>
      <span>返回</span>
    </button>
    <h1 class="page-title">编辑紧急联系人</h1>
  </div>

  <div class="card">
    <div class="warn-bar">
      <span nz-icon nzType="alert" nzTheme="outline"></span>
      <div>
        <div class="warn-title">SOS 告警说明</div>
        <div class="warn-text">
          当检测到跌倒、长时间无活动等紧急情况时，系统将自动向该联系人发送 SOS 通知与定位信息
        </div>
      </div>
    </div>

    <div class="form-section">
      <label class="form-label">姓名</label>
      <input
        class="form-input"
        type="text"
        maxlength="20"
        placeholder="请输入紧急联系人姓名"
        [(ngModel)]="name" />
    </div>

    <div class="form-section">
      <label class="form-label">关系</label>
      <nz-select
        class="full-width"
        nzPlaceHolder="请选择关系"
        [(ngModel)]="relation">
        <nz-option
          *ngFor="let r of relations"
          [nzValue]="r"
          [nzLabel]="r">
        </nz-option>
      </nz-select>
    </div>

    <div class="form-section">
      <label class="form-label">手机号</label>
      <input
        class="form-input"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        placeholder="请输入手机号"
        [(ngModel)]="phone" />
    </div>

    <div class="form-section">
      <label class="form-label">备用电话 <span class="optional">(选填)</span></label>
      <input
        class="form-input"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        placeholder="请输入备用电话号码"
        [(ngModel)]="backupPhone" />
    </div>

    <div class="form-actions">
      <button class="btn-danger" [disabled]="deleting" (click)="remove()">
        <span nz-icon nzType="delete" nzTheme="outline"></span>
        {{ deleting ? '删除中...' : '删除' }}
      </button>
      <button class="btn-primary" [disabled]="saving" (click)="save()">
        {{ saving ? '保存中...' : '保存' }}
      </button>
    </div>
  </div>
</div>
