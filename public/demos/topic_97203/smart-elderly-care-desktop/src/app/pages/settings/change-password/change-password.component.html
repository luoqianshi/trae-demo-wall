<div class="page">
  <div class="back-bar">
    <button class="back-btn" (click)="goBack()">
      <span nz-icon nzType="left" nzTheme="outline"></span>
      <span>返回</span>
    </button>
    <h1 class="page-title">修改登录密码</h1>
  </div>

  <div class="card">
    <div class="info-bar">
      <span nz-icon nzType="info-circle" nzTheme="outline"></span>
      <div>
        <div class="info-title">密码要求</div>
        <div class="info-text">为了您的账户安全，密码需同时满足以下 4 个条件：</div>
      </div>
    </div>

    <div class="form-section">
      <label class="form-label">当前密码</label>
      <div class="input-wrap">
        <input
          [type]="showCurrent ? 'text' : 'password'"
          class="form-input"
          placeholder="请输入当前密码"
          autocomplete="current-password"
          [(ngModel)]="currentPassword" />
        <button
          class="eye-btn"
          type="button"
          (click)="toggleVisibility('current')">
          <span [nzType]="showCurrent ? 'eye' : 'eye-invisible'" nz-icon nzTheme="outline"></span>
        </button>
      </div>
    </div>

    <div class="form-section">
      <label class="form-label">新密码</label>
      <div class="input-wrap">
        <input
          [type]="showNew ? 'text' : 'password'"
          class="form-input"
          placeholder="请输入新密码"
          autocomplete="new-password"
          [ngModel]="newPassword"
          (ngModelChange)="onNewPasswordChange($event)" />
        <button
          class="eye-btn"
          type="button"
          (click)="toggleVisibility('new')">
          <span [nzType]="showNew ? 'eye' : 'eye-invisible'" nz-icon nzTheme="outline"></span>
        </button>
      </div>
      <ul class="strength-list">
        <li
          *ngFor="let r of strengthRules"
          class="strength-item"
          [class.passed]="r.passed">
          <span
            class="strength-dot"
            [class.passed]="r.passed">
            <span
              *ngIf="r.passed"
              nz-icon
              nzType="check"
              nzTheme="outline"></span>
          </span>
          <span>{{ r.label }}</span>
        </li>
      </ul>
    </div>

    <div class="form-section">
      <label class="form-label">确认新密码</label>
      <div class="input-wrap">
        <input
          [type]="showConfirm ? 'text' : 'password'"
          class="form-input"
          placeholder="请再次输入新密码"
          autocomplete="new-password"
          [(ngModel)]="confirmPassword" />
        <button
          class="eye-btn"
          type="button"
          (click)="toggleVisibility('confirm')">
          <span [nzType]="showConfirm ? 'eye' : 'eye-invisible'" nz-icon nzTheme="outline"></span>
        </button>
      </div>
      <div
        *ngIf="confirmPassword && newPassword !== confirmPassword"
        class="form-error">
        <span nz-icon nzType="close-circle" nzTheme="outline"></span>
        两次输入的密码不一致
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-secondary" (click)="goBack()">取消</button>
      <button
        class="btn-primary"
        [disabled]="submitting || !allRulesPassed() || newPassword !== confirmPassword"
        (click)="submit()">
        {{ submitting ? '提交中...' : '确认修改' }}
      </button>
    </div>
  </div>
</div>
