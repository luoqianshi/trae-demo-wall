<div class="page">
  <h2 class="section-title">健康指标</h2>
  <div class="metrics-grid">
    <app-health-metric-card *ngFor="let m of metrics" [metric]="m"></app-health-metric-card>
  </div>

  <div class="grid">
    <div class="card card-hover">
      <div class="card-header">
        <h2>今日用药</h2>
        <span class="badge">{{ takenCount }} / {{ medications.length }} 已服用</span>
      </div>
      <app-medication-item
        *ngFor="let med of medications"
        [medication]="med"
        (toggleTaken)="toggleMedication($event)">
      </app-medication-item>
    </div>

    <div class="right-col">
      <div class="card card-hover">
        <div class="card-header">
          <h2>本周趋势</h2>
        </div>
        <div class="summary-list">
          <div class="summary-item">
            <div class="summary-label">平均血压</div>
            <div class="summary-value">{{ weeklySummary.avgBp }} mmHg</div>
            <div class="summary-trend" style="color: var(--state-warning);">{{ weeklySummary.bpChange }}</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">平均血糖</div>
            <div class="summary-value">{{ weeklySummary.avgSugar }} mmol/L</div>
            <div class="summary-trend" style="color: var(--state-success);">稳定</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">本周步数</div>
            <div class="summary-value">{{ weeklySummary.steps }}</div>
            <div class="summary-trend" style="color: var(--state-success);">{{ weeklySummary.stepsChange }}</div>
          </div>
        </div>
        <button class="btn-primary full" (click)="viewReport()">
          <span nz-icon nzType="file-text" nzTheme="outline"></span>
          查看完整报告
        </button>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>快捷操作</h2>
        </div>
        <div class="quick-actions">
          <button class="quick-action">
            <span nz-icon nzType="medicine-box" nzTheme="outline"></span>
            <span>在线问诊</span>
          </button>
          <button class="quick-action">
            <span nz-icon nzType="calendar" nzTheme="outline"></span>
            <span>预约体检</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
