<div class="page">
  <div class="actions-row">
    <button class="btn-secondary" (click)="back()">
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      返回
    </button>
    <div class="right-actions">
      <button class="btn-secondary" (click)="exportPdf()">
        <span nz-icon nzType="download" nzTheme="outline"></span>
        导出 PDF
      </button>
      <button class="btn-primary" (click)="shareToDoctor()">
        <span nz-icon nzType="share-alt" nzTheme="outline"></span>
        分享给医生
      </button>
    </div>
  </div>

  <app-health-score
    [totalScore]="score.total"
    [bpScore]="score.bp"
    [bsScore]="score.bs"
    [activityScore]="score.activity"
    [medicationAdherence]="score.medication">
  </app-health-score>

  <div class="card card-hover chart-card">
    <div class="card-header">
      <h2>血压趋势</h2>
      <div class="period-tabs">
        <button [class.active]="period === 'week'" (click)="setPeriod('week')">本周</button>
        <button [class.active]="period === 'month'" (click)="setPeriod('month')">本月</button>
        <button [class.active]="period === 'quarter'" (click)="setPeriod('quarter')">三月</button>
      </div>
    </div>
    <app-bp-chart [data]="bpData" [period]="period"></app-bp-chart>
    <div class="insight">
      <span nz-icon nzType="info-circle" nzTheme="outline" style="color: var(--brand-primary);"></span>
      本周血压波动较小，平均 135/85 mmHg，建议继续按时服用降压药。
    </div>
  </div>

  <div class="card card-hover chart-card">
    <div class="card-header">
      <h2>血糖趋势</h2>
    </div>
    <app-bs-chart [data]="bsData"></app-bs-chart>
    <div class="insight">
      <span nz-icon nzType="info-circle" nzTheme="outline" style="color: var(--brand-primary);"></span>
      血糖稳定在 5.5-6.2 mmol/L 范围内，控制在理想区间。
    </div>
  </div>

  <app-medication-table [medications]="medicationAdherence"></app-medication-table>

  <div class="grid">
    <div class="card">
      <div class="card-header">
        <h2>活动数据</h2>
      </div>
      <div class="kv-list">
        <div class="kv">
          <span class="kv-label">每日步数</span>
          <span class="kv-value">{{ sleep.steps }} 步</span>
        </div>
        <div class="kv">
          <span class="kv-label">活动时长</span>
          <span class="kv-value">{{ sleep.activeMinutes }} 分钟</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>睡眠数据</h2>
      </div>
      <div class="kv-list">
        <div class="kv">
          <span class="kv-label">入睡时间</span>
          <span class="kv-value">{{ sleep.bedTime }}</span>
        </div>
        <div class="kv">
          <span class="kv-label">起床时间</span>
          <span class="kv-value">{{ sleep.wakeTime }}</span>
        </div>
        <div class="kv">
          <span class="kv-label">深睡时长</span>
          <span class="kv-value">{{ sleep.deepSleep }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>医生建议</h2>
    </div>
    <ol class="advice-list">
      <li *ngFor="let a of advice">{{ a }}</li>
    </ol>
  </div>
</div>
