<div class="login-page">
  <!-- Left brand area (55%) -->
  <div class="brand-side">
    <div class="bg-blob bg-blob--1"></div>
    <div class="bg-blob bg-blob--2"></div>

    <div class="brand-header">
      <div class="brand-mark">
        <span nz-icon nzType="heart" nzTheme="outline"></span>
      </div>
      <div>
        <h1 class="brand-name">云守护·心相伴</h1>
        <p class="brand-tagline">让关爱永不缺席</p>
      </div>
    </div>

    <div class="hero">
      <div class="hero-frame hero-frame--back"></div>
      <div class="hero-frame hero-frame--middle"></div>
      <div class="hero-frame hero-frame--front">
        <img src="assets/images/login-hero.jpg" alt="子女远程守护父母" />
        <div class="hero-overlay"></div>
      </div>
      <div class="hero-float hero-float--top">
        <span nz-icon nzType="safety" nzTheme="outline" style="color: var(--state-success);"></span>
      </div>
      <div class="hero-float hero-float--bottom">
        <span nz-icon nzType="heart" nzTheme="outline" style="color: var(--brand-primary);"></span>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">
          <span nz-icon nzType="safety" nzTheme="outline" style="color: var(--state-success);"></span>
        </div>
        <div>
          <p class="feature-title">安全守护</p>
          <p class="feature-desc">24小时智能监护，异常即时告警</p>
        </div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <span nz-icon nzType="heart" nzTheme="outline" style="color: var(--state-warning);"></span>
        </div>
        <div>
          <p class="feature-title">健康管理</p>
          <p class="feature-desc">用药提醒、体征监测、健康报告</p>
        </div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <span nz-icon nzType="message" nzTheme="outline" style="color: var(--brand-primary);"></span>
        </div>
        <div>
          <p class="feature-title">情感陪伴</p>
          <p class="feature-desc">视频通话、家庭圈动态，亲情不断联</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Right form area (45%) -->
  <div class="form-side">
    <div class="form-card">
      <h2 class="form-title">欢迎回来</h2>
      <p class="form-subtitle">登录账号，开始守护家人</p>

      <div class="field">
        <label class="label">手机号</label>
        <div class="input-wrap">
          <span class="input-icon" nz-icon nzType="mobile" nzTheme="outline"></span>
          <input
            type="tel"
            class="input"
            placeholder="请输入手机号"
            autocomplete="tel"
            [(ngModel)]="phone"
            (keydown.enter)="submit()" />
        </div>
      </div>

      <div class="field">
        <label class="label">密码</label>
        <div class="input-wrap">
          <span class="input-icon" nz-icon nzType="lock" nzTheme="outline"></span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="input"
            placeholder="请输入密码"
            style="padding-right: 2.75rem;"
            autocomplete="current-password"
            [(ngModel)]="password"
            (keydown.enter)="submit()" />
          <button type="button" class="input-action" (click)="togglePassword()" aria-label="切换密码可见性">
            <span nz-icon [nzType]="showPassword ? 'eye' : 'eye-invisible'" nzTheme="outline"></span>
          </button>
        </div>
      </div>

      <div class="forgot-row">
        <a class="link">忘记密码?</a>
      </div>

      <button class="login-btn" [disabled]="loading" (click)="submit()">
        <span *ngIf="!loading">登 录</span>
        <span *ngIf="loading">登录中...</span>
      </button>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">其他登录方式</span>
        <span class="divider-line"></span>
      </div>

      <div class="socials">
        <button class="social-btn" title="微信登录" aria-label="微信登录">
          <svg viewBox="0 0 24 24" fill="#07C160" width="20" height="20">
            <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.045c.133 0 .241-.11.241-.245 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-7.062-6.122zM14.84 13.186c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982z"/>
          </svg>
        </button>
        <button class="social-btn social-btn--sms" title="短信验证码登录" aria-label="短信验证码登录">
          <span nz-icon nzType="message" nzTheme="outline"></span>
        </button>
        <button class="social-btn social-btn--alipay" title="支付宝登录" aria-label="支付宝登录">
          <svg viewBox="0 0 24 24" fill="#1677FF" width="20" height="20">
            <path d="M21.422 15.358c-1.098-.487-5.206-2.359-6.044-2.704.648-1.238 1.13-2.586 1.38-4.014h-4.2v-1.2h5.16v-.84h-5.16V4.694h-2.04s-.036.036-.036.06v1.756H5.376v.84h5.16v1.2H6.336v.84h8.22c-.192.924-.504 1.8-.924 2.604-1.992-.684-4.548-1.14-6.972-.648-2.916.588-4.788 2.628-4.248 4.776.54 2.148 3.456 3.108 6.324 2.52 2.04-.42 3.804-1.56 5.076-3.18 1.548.78 5.4 2.616 5.4 2.616V21H24V15.96c0-.372-.228-.768-.578-.602zM7.596 19.186c-2.604.6-5.076-.3-5.436-2.16-.36-1.86 1.56-3.78 4.164-4.38 1.944-.456 4.104-.192 5.94.528-1.332 2.064-3.348 3.636-4.668 6.012z"/>
          </svg>
        </button>
      </div>

      <p class="register-tip">
        还没有账号？
        <a class="link link--strong">立即注册</a>
      </p>
    </div>
  </div>
</div>
