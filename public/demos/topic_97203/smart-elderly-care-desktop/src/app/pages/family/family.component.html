<div class="page">
  <div class="actions-bar">
    <button class="action-btn action-btn--voice">
      <span nz-icon nzType="audio" nzTheme="outline"></span>
      <span>语音留言</span>
    </button>
    <div class="video-wrap">
      <div class="pulse-ring"></div>
      <button class="action-btn action-btn--video">
        <span nz-icon nzType="video-camera" nzTheme="outline"></span>
        <span>视频通话</span>
      </button>
    </div>
    <button class="action-btn action-btn--photo">
      <span nz-icon nzType="picture" nzTheme="outline"></span>
      <span>分享照片</span>
    </button>
  </div>

  <div class="grid">
    <div class="feed-card card card-hover">
      <div class="card-header">
        <h2>家庭圈</h2>
      </div>
      <div class="feed-list">
        <app-feed-item *ngFor="let f of feeds" [feed]="f"></app-feed-item>
      </div>
      <div class="composer">
        <input class="composer-input" placeholder="说点什么..." [(ngModel)]="draftText" (keydown.enter)="sendMessage()" />
        <button class="send-btn" (click)="sendMessage()">
          <span nz-icon nzType="send" nzTheme="outline"></span>
        </button>
      </div>
    </div>

    <div class="right-col">
      <div class="card">
        <div class="card-header">
          <h2>共同活动</h2>
        </div>
        <app-activity-card *ngFor="let a of commonActivities" [activity]="a"></app-activity-card>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>社区活动推荐</h2>
        </div>
        <app-activity-card
          *ngFor="let a of communityActivities"
          [activity]="a"
          (remind)="remindActivity(a)">
        </app-activity-card>
      </div>
    </div>
  </div>
</div>
