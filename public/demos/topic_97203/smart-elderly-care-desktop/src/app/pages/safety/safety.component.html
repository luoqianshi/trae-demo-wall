<div class="page">
  <h2 class="section-title">设备状态</h2>
  <div class="device-grid">
    <app-device-card *ngFor="let d of devices" [device]="d"></app-device-card>
  </div>

  <div class="grid">
    <div class="card card-hover">
      <div class="card-header">
        <h2>近期活动</h2>
      </div>
      <div class="timeline">
        <div *ngFor="let e of events" class="timeline-item">
          <div class="timeline-dot" [style.background-color]="dotBg(e)">
            <span nz-icon [nzType]="e.icon || 'info'" nzTheme="outline" [style.color]="dotColor(e)"></span>
          </div>
          <div class="content">
            <div class="title">{{ e.title }}</div>
            <div class="desc">{{ e.description }}</div>
          </div>
          <div class="time">{{ formatTime(e.recordedAt) }}</div>
        </div>
      </div>
    </div>

    <div class="card card-hover">
      <div class="card-header">
        <h2>告警历史</h2>
        <span class="count">{{ alerts.length }}</span>
      </div>
      <app-alert-item *ngFor="let a of alerts" [alert]="a"></app-alert-item>
    </div>
  </div>
</div>
