<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileBridge - 企业级安全文件共享平台 Demo</title>
<style>
:root {
  --primary: #3B82F6;
  --primary-hover: #2563EB;
  --primary-light: #DBEAFE;
  --primary-50: #EFF6FF;
  --success: #10B981;
  --success-hover: #059669;
  --success-light: #D1FAE5;
  --warning: #F59E0B;
  --warning-hover: #D97706;
  --warning-light: #FEF3C7;
  --danger: #EF4444;
  --danger-hover: #DC2626;
  --danger-light: #FEE2E2;
  --purple: #8B5CF6;
  --cyan: #06B6D4;
  --text-900: #0F172A;
  --text-700: #334155;
  --text-500: #64748B;
  --text-400: #94A3B8;
  --border: #E2E8F0;
  --border-light: #F1F5F9;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text-700); line-height: 1.6; overflow-x: hidden;
}
button { cursor: pointer; border: none; font-family: inherit; font-size: 14px; }
input { font-family: inherit; }
.page { display: none; } .page.active { display: block; }

/* LOGIN */
#loginPage {
  min-height: 100vh;
  background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 40%, #1D4ED8 70%, #2563EB 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.login-circle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.03); animation: fc 12s ease-in-out infinite; }
.login-circle:nth-child(1) { width: 400px; height: 400px; top: -100px; right: -80px; }
.login-circle:nth-child(2) { width: 300px; height: 300px; bottom: -60px; left: -60px; animation-delay: -4s; }
.login-circle:nth-child(3) { width: 200px; height: 200px; top: 40%; left: 10%; animation-delay: -8s; }
@keyframes fc { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
.login-card {
  background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
  border-radius: 24px; padding: 48px 40px; width: 440px; max-width: 90vw;
  position: relative; z-index: 1; animation: ci 0.6s ease;
}
@keyframes ci { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.login-logo { width:64px;height:64px;background:linear-gradient(135deg,var(--primary),var(--primary-hover));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;color:white; }
.login-card h1 { text-align:center;font-size:26px;font-weight:700;color:var(--text-900);margin-bottom:6px; }
.login-card .sub { text-align:center;font-size:14px;color:var(--text-400);margin-bottom:36px; }
.form-group { margin-bottom:18px; }
.form-group label { display:block;font-size:13px;font-weight:600;color:var(--text-700);margin-bottom:6px; }
.form-input { width:100%;height:48px;border:1.5px solid var(--border);border-radius:12px;padding:0 16px 0 44px;font-size:15px;color:var(--text-700);transition:all .2s;background:white;outline:none; }
.form-input:focus { border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,0.12); }
.input-wrap { position:relative; }
.input-wrap .icon { position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-400);font-size:18px; }
.login-btn { width:100%;height:52px;background:linear-gradient(135deg,var(--primary),var(--primary-hover));color:white;border-radius:12px;font-size:16px;font-weight:600;letter-spacing:1px;margin-top:8px;transition:all .2s; }
.login-btn:hover { transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,0.35); }
.login-footer { text-align:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--border-light);font-size:12px;color:var(--text-400); }
.login-hint { text-align:center;margin-top:12px;font-size:12px;color:var(--text-400);background:var(--primary-50);padding:8px 12px;border-radius:8px; }

/* CLIENT */
.client-header { height:60px;background:white;border-bottom:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:100; }
.brand { display:flex;align-items:center;gap:10px;flex-shrink:0; }
.brand-icon { width:34px;height:34px;background:linear-gradient(135deg,var(--primary),var(--primary-hover));border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px; }
.brand-text { font-size:16px;font-weight:700;color:var(--text-900); }
.header-tabs { display:flex;gap:4px;margin:0 auto;background:var(--bg);border-radius:10px;padding:3px; }
.header-tab { padding:7px 20px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text-500);background:transparent;transition:all .2s; }
.header-tab.active { background:var(--primary);color:white; }
.header-tab:hover:not(.active) { color:var(--text-700);background:var(--border-light); }
.header-right { display:flex;align-items:center;gap:16px;flex-shrink:0; }
.notif-btn { position:relative;background:none;font-size:20px;color:var(--text-500);padding:6px;border-radius:8px;transition:all .15s; }
.notif-btn:hover { background:var(--bg);color:var(--text-700); }
.notif-badge { position:absolute;top:0;right:0;background:var(--danger);color:white;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px; }
.user-chip { display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px 4px 4px;border-radius:20px;transition:background .15s; }
.user-chip:hover { background:var(--bg); }
.avatar { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;font-weight:600;flex-shrink:0; }
.admin-enter-btn { padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--primary);background:var(--primary-50);border:1px solid var(--primary-light);transition:all .15s; }
.admin-enter-btn:hover { background:var(--primary-light); }
.client-content { max-width:1400px;margin:0 auto;padding:24px; }

/* PROJECT CARDS */
.section-header { margin-bottom:24px; }
.section-header h2 { font-size:24px;font-weight:700;color:var(--text-900); }
.section-header p { font-size:14px;color:var(--text-400);margin-top:4px; }
.project-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px; }
.project-card { background:var(--card);border:1px solid var(--border-light);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:all .25s; }
.project-card:hover { transform:translateY(-4px);box-shadow:var(--shadow-lg); }
.project-cover { height:120px;display:flex;align-items:center;justify-content:center;font-size:44px;color:rgba(255,255,255,0.85); }
.project-body { padding:18px 20px; }
.project-body h3 { font-size:16px;font-weight:600;color:var(--text-900);margin-bottom:6px; }
.project-body .desc { font-size:13px;color:var(--text-400);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px; }
.storage-bar-wrap { margin-top:14px; }
.storage-bar { height:6px;background:var(--border-light);border-radius:3px;overflow:hidden; }
.storage-fill { height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),#60A5FA);transition:width .5s ease; }
.storage-text { font-size:12px;color:var(--text-400);margin-top:6px; }

/* FILE BROWSER */
.file-toolbar { display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap; }
.toolbar-left { display:flex;align-items:center;gap:8px; }
.toolbar-right { display:flex;align-items:center;gap:8px;margin-left:auto; }
.btn-back { width:38px;height:38px;border-radius:var(--radius-md);background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-500);transition:all .15s; }
.btn-back:hover { background:var(--bg);color:var(--text-700); }
.search-input { width:260px;height:38px;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:0 14px;font-size:13px;outline:none;transition:all .2s; }
.search-input:focus { border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,0.1); }
.btn { padding:8px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px; }
.btn-primary { background:var(--primary);color:white; } .btn-primary:hover { background:var(--primary-hover); }
.btn-success { background:var(--success);color:white; } .btn-success:hover { background:var(--success-hover); }
.btn-outline { background:var(--card);color:var(--text-700);border:1px solid var(--border); } .btn-outline:hover { background:var(--bg); }
.btn-danger-outline { background:var(--card);color:var(--danger);border:1px solid var(--border); } .btn-danger-outline:hover { background:var(--danger-light);border-color:var(--danger); }
.btn-sm { padding:5px 12px;font-size:12px; }

/* TABLE */
.data-table-wrap { background:var(--card);border:1px solid var(--border-light);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden; }
.data-table { width:100%;border-collapse:collapse; }
.data-table th { background:var(--bg);padding:12px 16px;text-align:left;font-size:13px;font-weight:600;color:var(--text-700);border-bottom:1px solid var(--border-light);white-space:nowrap; }
.data-table td { padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border-light);vertical-align:middle; }
.data-table tr:last-child td { border-bottom:none; }
.data-table tbody tr { transition:background .12s; }
.data-table tbody tr:hover { background:var(--primary-50); }
.file-name-cell { display:flex;align-items:center;gap:10px; }
.file-icon { width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0; }
.file-icon.folder{background:#FEF3C7;color:#F7BA1E} .file-icon.image{background:#CCFBF1;color:#0FC6C2} .file-icon.video{background:#EDE9FE;color:#722ED1} .file-icon.pdf{background:#FEE2E2;color:#F53F3F} .file-icon.word{background:#DBEAFE;color:#165DFF} .file-icon.excel{background:#D1FAE5;color:#00B42A} .file-icon.zip{background:#FFEDD5;color:#FF7D00} .file-icon.other{background:var(--bg);color:#86909C}
.file-name-text { font-weight:500;color:var(--text-900); }
.tag { display:inline-block;padding:2px 10px;border-radius:50px;font-size:12px;font-weight:500; }
.tag-pending{background:var(--warning-light);color:var(--warning-hover)} .tag-approved{background:var(--success-light);color:var(--success-hover)} .tag-rejected{background:var(--danger-light);color:var(--danger-hover)} .tag-blue{background:var(--primary-light);color:var(--primary-hover)} .tag-gray{background:var(--bg);color:var(--text-400)}
.action-btns { display:flex;gap:4px; }
.action-btn { width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:none;color:var(--text-400);transition:all .15s; }
.action-btn:hover { background:var(--bg);color:var(--primary); }
.action-btn.danger:hover { background:var(--danger-light);color:var(--danger); }

/* ADMIN */
.admin-wrap { display:flex;min-height:100vh; }
.admin-sidebar { width:240px;background:linear-gradient(180deg,#0F172A 0%,#1E293B 100%);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:200; }
.sidebar-brand { display:flex;align-items:center;gap:10px;padding:20px 20px 24px; }
.sidebar-brand-icon { width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--primary-hover));border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px; }
.sidebar-brand-text { font-size:15px;font-weight:700;color:white; }
.sidebar-menu { flex:1;padding:0 10px; }
.sidebar-item { display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:14px;color:rgba(255,255,255,0.6);cursor:pointer;transition:all .15s;margin-bottom:2px;position:relative;background:none;width:100%;text-align:left; }
.sidebar-item:hover { color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.05); }
.sidebar-item.active { color:#60A5FA;background:rgba(59,130,246,0.18); }
.sidebar-item.active::before { content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:#60A5FA;border-radius:0 2px 2px 0; }
.sidebar-item .si-icon { font-size:19px;width:22px;text-align:center; }
.sidebar-footer { padding:16px;border-top:1px solid rgba(255,255,255,0.08); }
.sidebar-footer-btn { width:100%;padding:10px;border-radius:10px;font-size:13px;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s; }
.sidebar-footer-btn:hover { background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8); }
.admin-main { margin-left:240px;flex:1;display:flex;flex-direction:column; }
.admin-header { height:64px;background:white;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:100; }
.admin-header h2 { font-size:18px;font-weight:700;color:var(--text-900); }
.admin-header-right { display:flex;align-items:center;gap:12px; }
.logout-btn { padding:6px 14px;border-radius:8px;font-size:13px;color:var(--text-500);background:none;transition:all .15s; }
.logout-btn:hover { background:var(--danger-light);color:var(--danger); }
.admin-content { flex:1;padding:28px;background:var(--bg); }

/* DASHBOARD */
.stat-row { display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:24px; }
.stat-card { background:var(--card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px; }
.stat-icon { width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:white;flex-shrink:0; }
.stat-icon.blue{background:linear-gradient(135deg,#3B82F6,#2563EB)} .stat-icon.green{background:linear-gradient(135deg,#10B981,#059669)} .stat-icon.purple{background:linear-gradient(135deg,#8B5CF6,#7C3AED)} .stat-icon.amber{background:linear-gradient(135deg,#F59E0B,#D97706)}
.stat-info .label { font-size:13px;color:var(--text-400); }
.stat-info .value { font-size:26px;font-weight:700;color:var(--text-900); }
.pending-alert { background:var(--warning-light);border:1px solid #FDE68A;border-radius:var(--radius-md);padding:14px 20px;display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:14px;color:var(--warning-hover); }
.pending-alert .alert-icon { font-size:22px; }
.pending-alert .alert-btn { margin-left:auto;padding:6px 16px;background:var(--warning);color:white;border-radius:8px;font-size:13px;font-weight:500; }
.two-col { display:grid;grid-template-columns:1fr 1fr;gap:20px; }
.card-box { background:var(--card);border:1px solid var(--border-light);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden; }
.card-box-header { padding:18px 22px;border-bottom:1px solid var(--border-light);font-size:15px;font-weight:600;color:var(--text-900); }
.card-box-body { padding:18px 22px; }
.storage-item { display:flex;align-items:center;gap:12px;padding:10px 0; }
.storage-item+.storage-item { border-top:1px solid var(--border-light); }
.storage-dot { width:10px;height:10px;border-radius:50%;flex-shrink:0; }
.storage-name { width:120px;font-size:13px;font-weight:500;color:var(--text-700);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.storage-bar-sm { flex:1;height:10px;background:var(--border-light);border-radius:5px;overflow:hidden; }
.storage-bar-sm .fill { height:100%;border-radius:5px;background:linear-gradient(90deg,var(--primary),#60A5FA); }
.storage-size { font-size:12px;color:var(--text-400);width:100px;text-align:right;flex-shrink:0; }
.timeline-item { display:flex;gap:14px;padding:10px 0;position:relative; }
.timeline-item+.timeline-item { border-top:1px solid var(--border-light); }
.timeline-dot { width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px; }
.timeline-body { flex:1; }
.timeline-body .tl-text { font-size:13px;color:var(--text-700); }
.timeline-body .tl-time { font-size:12px;color:var(--text-400);margin-top:2px; }

/* MODAL */
.modal-overlay { position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fi .2s; }
@keyframes fi { from{opacity:0} to{opacity:1} }
.modal { background:white;border-radius:18px;box-shadow:0 25px 50px rgba(0,0,0,0.15);width:500px;max-width:90vw;max-height:85vh;overflow-y:auto;animation:su .25s ease; }
@keyframes su { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.modal-header { padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between; }
.modal-header h3 { font-size:18px;font-weight:700;color:var(--text-900); }
.modal-close { width:32px;height:32px;border-radius:8px;background:none;font-size:20px;color:var(--text-400);display:flex;align-items:center;justify-content:center; }
.modal-close:hover { background:var(--bg); }
.modal-body { padding:20px 24px; }
.modal-footer { padding:0 24px 22px;display:flex;justify-content:flex-end;gap:10px; }
.upload-zone { border:2px dashed var(--border);border-radius:var(--radius-lg);padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s; }
.upload-zone:hover { border-color:var(--primary);background:var(--primary-50); }
.upload-zone .uz-icon { font-size:44px;color:var(--primary);margin-bottom:12px; }
.upload-zone .uz-text { font-size:15px;color:var(--text-700);font-weight:500; }
.upload-zone .uz-hint { font-size:12px;color:var(--text-400);margin-top:6px; }
.upload-file-item { display:flex;align-items:center;gap:12px;padding:10px 0; }
.upload-file-item+.upload-file-item { border-top:1px solid var(--border-light); }
.ufi-icon { font-size:24px; }
.ufi-info { flex:1; }
.ufi-name { font-size:13px;font-weight:500;color:var(--text-700); }
.ufi-bar { height:6px;background:var(--border-light);border-radius:3px;margin-top:6px;overflow:hidden; }
.ufi-bar .fill { height:100%;background:linear-gradient(90deg,var(--primary),var(--success));border-radius:3px;transition:width .5s; }
.ufi-pct { font-size:12px;color:var(--text-400);width:40px;text-align:right; }
.reject-textarea { width:100%;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:12px;font-size:14px;font-family:inherit;resize:vertical;min-height:80px;outline:none; }
.reject-textarea:focus { border-color:var(--primary); }

/* TOAST */
.toast { position:fixed;top:24px;right:24px;z-index:2000;padding:14px 24px;border-radius:var(--radius-md);color:white;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);animation:ti .3s ease,to .3s ease 2.2s forwards; }
.toast.success{background:var(--success)} .toast.error{background:var(--danger)} .toast.info{background:var(--primary)}
@keyframes ti { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }
@keyframes to { from{opacity:1} to{opacity:0;transform:translateY(-10px)} }

@media(max-width:900px){ .stat-row{grid-template-columns:repeat(2,1fr)} .two-col{grid-template-columns:1fr} .admin-sidebar{width:60px} .admin-sidebar .sidebar-brand-text,.admin-sidebar .sidebar-item span:not(.si-icon){display:none} .admin-main{margin-left:60px} }
@media(max-width:640px){ .stat-row{grid-template-columns:1fr} .project-grid{grid-template-columns:1fr} .header-tabs{display:none} }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="page active">
  <div class="login-circle"></div><div class="login-circle"></div><div class="login-circle"></div>
  <div class="login-card">
    <div class="login-logo">&#x1F4C1;</div>
    <h1>FileBridge</h1>
    <p class="sub">企业级安全文件共享平台</p>
    <div class="form-group"><label>用户名</label><div class="input-wrap"><span class="icon">&#x1F464;</span><input type="text" class="form-input" id="loginUser" value="admin" placeholder="请输入用户名"></div></div>
    <div class="form-group"><label>密码</label><div class="input-wrap"><span class="icon">&#x1F512;</span><input type="password" class="form-input" id="loginPass" value="admin123" placeholder="请输入密码"></div></div>

  const sm={active:{t:'正常',c:'tag-approved'},locked:{t:'锁定',c:'tag-pending'},disabled:{t:'禁用',c:'tag-rejected'}};
  const ac=['#3B82F6','#10B981','#8B5CF6','#F59E0B','#EF4444'];
  return `<div style="display:flex;gap:12px;margin-bottom:20px;"><input type="text" class="search-input" placeholder="&#x1F50D; 搜索用户..." style="width:300px;"><button class="btn btn-primary" style="margin-left:auto;" onclick="showToast('info','创建用户功能需要完整后端环境')">+ 创建用户</button></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>用户</th><th>邮箱</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>${users.map((u,i)=>`<tr><td>#${u.id}</td><td><div class="file-name-cell"><div class="avatar" style="background:${ac[i]};width:32px;height:32px;font-size:13px;">${u.name[0]}</div><div><div style="font-weight:500;color:var(--text-900);">${u.name}</div><div style="font-size:12px;color:var(--text-400);">@${u.username}</div></div></div></td><td>${u.email}</td><td><span class="tag ${rm[u.role].c}">${rm[u.role].t}</span></td><td><span class="tag ${sm[u.status].c}">${sm[u.status].t}</span></td><td><div class="action-btns"><button class="action-btn" title="编辑" onclick="showToast('info','编辑功能需要完整后端')">&#x270F;</button><button class="action-btn" title="重置密码" onclick="showToast('info','密码重置功能需要完整后端')">&#x1F511;</button><button class="action-btn danger" title="删除" onclick="showToast('error','删除功能需要完整后端')">&#x1F5D1;</button></div></td></tr>`).join('')}</tbody></table></div>`;
}
function renderApprovals(){
  if(!pendingApprovals.length)return '<div style="text-align:center;padding:60px;"><div style="font-size:64px;color:var(--text-400);margin-bottom:16px;">&#x2705;</div><p style="font-size:16px;color:var(--text-400);">暂无待审批文件</p></div>';
  return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;"><span style="font-size:22px;">&#x2705;</span><span style="font-size:16px;font-weight:600;color:var(--text-900);">文件审批</span><span class="tag tag-blue" style="margin-left:8px;">${pendingApprovals.length} 待处理</span></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th style="width:260px;">文件名</th><th>项目</th><th>上传者</th><th>大小</th><th>上传时间</th><th style="width:180px;">操作</th></tr></thead><tbody>${pendingApprovals.map((a,i)=>`<tr><td><div class="file-name-cell"><div class="file-icon ${a.type}">${a.icon}</div><span class="file-name-text">${a.name}</span></div></td><td><span class="tag tag-blue">${a.project}</span></td><td>${a.uploader}</td><td>${a.size}</td><td>${a.time}</td><td><div class="action-btns" style="gap:8px;"><button class="btn btn-success btn-sm" onclick="approveFile(${i})">&#x2714; 通过</button><button class="btn btn-danger-outline btn-sm" onclick="showRejectModal(${i})">&#x2716; 驳回</button></div></td></tr>`).join('')}</tbody></table></div>`;
}
function approveFile(i){pendingApprovals.splice(i,1);showAdminTab('approvals',document.querySelectorAll('.sidebar-item')[2]);showToast('success','文件已审批通过');}
function showRejectModal(i){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-overlay" onclick="closeModal(event)"><div class="modal" style="width:420px;" onclick="event.stopPropagation()"><div class="modal-header"><h3>驳回文件</h3><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body"><p style="font-size:13px;color:var(--text-500);margin-bottom:10px;">请填写驳回理由（将通知上传者）：</p><textarea class="reject-textarea" id="rejectReason" placeholder="例如：文件内容需要更新至最新版本..."></textarea></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-sm" style="background:var(--danger);color:white;padding:8px 18px;" onclick="rejectFile(${i})">确认驳回</button></div></div></div>`;
}
function rejectFile(i){const r=document.getElementById('rejectReason')?.value||'未填写理由';pendingApprovals.splice(i,1);closeModal();showAdminTab('approvals',document.querySelectorAll('.sidebar-item')[2]);showToast('error','文件已驳回：'+r);}
function renderAudit(){
  return `<div style="display:flex;gap:12px;margin-bottom:20px;"><select class="search-input" style="width:160px;cursor:pointer;"><option value="">全部操作</option><option>登录</option><option>上传</option><option>下载</option><option>审批</option><option>删除</option></select><button class="btn btn-outline" onclick="showToast('info','已刷新')">&#x1F504; 刷新</button></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th style="width:170px;">时间</th><th style="width:70px;">用户</th><th style="width:90px;">操作</th><th style="width:90px;">资源类型</th><th>详情</th><th style="width:130px;">IP</th></tr></thead><tbody>${auditLogs.map(l=>`<tr><td style="color:var(--text-400);font-size:12px;">${l.time}</td><td>#${l.uid}</td><td><span class="tag" style="background:${l.actionColor}18;color:${l.actionColor};">${l.action}</span></td><td>${l.resource}</td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.detail}</td><td style="font-family:monospace;font-size:12px;color:var(--text-400);">${l.ip}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderSettings(){
  return `<div class="card-box" style="max-width:800px;"><div class="card-box-header">&#x2699; 站点设置</div><div class="card-box-body"><div class="form-group"><label>站点名称</label><input class="form-input" style="padding-left:14px;" value="FileBridge 文件共享平台"></div><div class="form-group"><label>登录标题</label><input class="form-input" style="padding-left:14px;" value="FileBridge"></div><div class="form-group"><label>登录副标题</label><input class="form-input" style="padding-left:14px;" value="企业级安全文件共享平台"></div></div></div><div class="card-box" style="max-width:800px;margin-top:20px;"><div class="card-box-header">&#x1F4C4; 文件设置</div><div class="card-box-body"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;"><div class="form-group"><label>最大文件大小 (MB)</label><input class="form-input" style="padding-left:14px;" value="2048"></div><div class="form-group"><label>默认存储配额 (GB)</label><input class="form-input" style="padding-left:14px;" value="50"></div><div class="form-group"><label>默认过期天数</label><input class="form-input" style="padding-left:14px;" value="90"></div><div class="form-group"><label>到期提醒天数</label><input class="form-input" style="padding-left:14px;" value="3"></div></div><div class="form-group"><label>允许的文件类型</label><input class="form-input" style="padding-left:14px;" value="pdf,doc,docx,xls,xlsx,ppt,pptx,jpg,png,gif,mp4,zip,rar,dwg,psd,ai"></div></div></div><div style="margin-top:24px;display:flex;gap:12px;"><button class="btn btn-primary" onclick="showToast('success','设置已保存')">保存设置</button><button class="btn btn-outline" onclick="showToast('info','已恢复默认值')">恢复默认</button></div>`;
}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modalRoot').innerHTML='';}
function showToast(t,m){const el=document.createElement('div');el.className='toast '+t;el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}
</script>
</body>
</html>
