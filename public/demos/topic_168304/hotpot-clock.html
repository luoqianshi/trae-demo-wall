<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>火锅时钟 HotPot Clock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --red:#D94F3B;--red-light:#F5DED9;--red-dark:#B33D2D;
  --amber:#F5A623;--black:#2D2D2D;--white:#FAF6F0;
  --green:#4CAF50;--blue:#5B7FFF;
  --text-p:#2D2D2D;--text-s:#666;--text-l:#999;
  --border:#E8D5D0;--bg:#FAF6F0;
  --rl:12px;--rm:8px;--rs:4px;
  --font:'Noto Sans SC','Noto Sans JP','Noto Sans',system-ui,sans-serif;
}
html{font-size:14px;}
html[lang="en"],html[lang="ja"]{font-size:13px;}
body{font-family:var(--font);background:var(--bg);margin:0;min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;}
.app{width:100%;max-width:375px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;}
@media(min-width:430px){
  body{padding:20px 0;}
  .app{min-height:812px;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,.2),0 0 0 3px #1a1a1a,0 0 0 6px #333;}
}

/* ===== 状态栏 ===== */
.status-bar{height:44px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;font-weight:600;color:var(--black);position:relative;z-index:10;}
.status-bar::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:28px;background:#1a1a1a;border-radius:20px;}
.status-bar span{z-index:1;}

/* ===== 导航栏 ===== */
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg);}
.nav-title{font-size:18px;font-weight:800;color:var(--text-p);display:flex;align-items:center;gap:4px;}
.nav-title .logo{font-size:20px;}
.lang-seg{display:flex;background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.lang-seg span{padding:4px 12px;font-size:12px;cursor:pointer;transition:all .2s;color:var(--text-s);}
.lang-seg span.active{background:var(--red);color:#fff;font-weight:600;}

/* ===== 顶部状态区 ===== */
.top-status{padding:8px 16px;transition:all .3s;}
.top-msg{text-align:center;font-size:14px;color:var(--text-s);min-height:20px;line-height:20px;}
.top-msg.highlight{color:var(--red);font-weight:700;}
.top-counts{display:flex;justify-content:center;gap:20px;margin-top:4px;}
.top-count{font-size:12px;color:var(--text-l);}
.top-count b{color:var(--text-p);font-weight:700;}

/* ===== Tips（空闲展开 / 计时收缩） ===== */
.tips-area{overflow:hidden;transition:max-height .4s ease;max-height:120px;margin:0 16px 8px;}
.tips-area.collapsed{max-height:28px;}
.tips-card{background:linear-gradient(135deg,var(--red),var(--amber));border-radius:var(--rl);padding:14px 16px;color:#fff;position:relative;}
.tips-card .t-text{font-size:13px;line-height:1.5;transition:opacity .3s;}
.tips-area.collapsed .t-text{opacity:0;height:0;overflow:hidden;}
.tips-card .t-dot{display:flex;justify-content:center;gap:4px;margin-top:8px;transition:all .3s;}
.tips-area.collapsed .t-dot{margin-top:0;opacity:0;height:0;overflow:hidden;}
.tips-card .t-dot i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);}
.tips-card .t-dot i.on{width:14px;border-radius:3px;background:#fff;}
.tips-mini{font-size:11px;color:var(--text-l);text-align:center;padding:6px 0;cursor:pointer;}
.tips-mini::after{content:' ▼';font-size:9px;}

/* ===== 搜索栏 ===== */
.search-row{display:flex;gap:8px;padding:4px 16px;align-items:center;}
.search-box{flex:1;display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:20px;padding:8px 14px;gap:6px;}
.search-box input{border:none;outline:none;background:none;font-size:13px;font-family:var(--font);flex:1;color:var(--text-p);}
.search-box input::placeholder{color:var(--text-l);}
.search-box .s-icon{color:var(--text-l);font-size:14px;}
.scan-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:all .2s;}
.scan-btn:hover{border-color:var(--red);}

/* ===== 分类标签 ===== */
.cat-row{display:flex;overflow-x:auto;padding:6px 16px;gap:6px;-ms-overflow-style:none;scrollbar-width:none;}
.cat-row::-webkit-scrollbar{display:none;}
.cat-tag{flex-shrink:0;padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;transition:all .2s;background:#fff;border:1px solid var(--border);color:var(--text-s);}
.cat-tag.active{background:var(--red);color:#fff;border-color:var(--red);font-weight:600;}

/* ===== "可以吃了" 区域 ===== */
.section-head{padding:10px 16px 6px;display:flex;align-items:center;justify-content:space-between;}
.section-head h3{font-size:14px;font-weight:700;color:var(--text-p);}
.section-head .badge{background:var(--green);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.section-head .badge.cooking{background:var(--amber);}
.scroll-row{display:flex;overflow-x:auto;padding:4px 16px 8px;gap:10px;-ms-overflow-style:none;scrollbar-width:none;scroll-snap-type:x mandatory;}
.scroll-row::-webkit-scrollbar{display:none;}
.scroll-row.snap .cook-card{scroll-snap-align:start;}

/* ===== 菜品卡片（未下锅） ===== */
.dish-card{flex-shrink:0;width:100px;background:#fff;border:1px solid var(--border);border-radius:var(--rl);padding:10px 8px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
.dish-card:active{transform:scale(.96);}
.dish-card .d-icon{font-size:28px;}
.dish-card .d-name{font-size:12px;font-weight:600;margin-top:6px;color:var(--text-p);line-height:1.3;word-break:break-all;}
.dish-card .d-time{font-size:10px;color:var(--text-l);margin-top:2px;}
.dish-card .d-ops{display:flex;gap:4px;justify-content:center;margin-top:8px;}
.dish-card .d-ops button{border:none;border-radius:14px;font-size:11px;padding:4px 10px;cursor:pointer;font-family:var(--font);transition:all .15s;}
.dish-card .d-ops .btn-start{background:var(--red);color:#fff;}
.dish-card .d-ops .btn-start:active{background:var(--red-dark);}
.dish-card .d-ops .btn-queue{background:rgba(91,127,255,.08);color:var(--blue);}
.dish-card .d-ops .btn-queue:active{background:rgba(91,127,255,.18);}

/* ===== 计时卡片（可以吃了） ===== */
.cook-card{flex-shrink:0;width:calc((100% - 20px)/3);min-width:100px;background:#fff;border:2px solid var(--green);border-radius:var(--rl);padding:12px 8px;text-align:center;position:relative;animation:popIn .4s;}
@keyframes popIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:none;}}
.cook-card .c-icon{font-size:32px;}
.cook-card .c-name{font-size:12px;font-weight:600;margin-top:4px;color:var(--text-p);}
.cook-card .c-label{font-size:11px;color:var(--green);font-weight:600;margin-top:6px;padding:4px 12px;border:1px solid var(--green);border-radius:14px;cursor:pointer;transition:all .15s;display:inline-block;}
.cook-card .c-label:hover{background:var(--green);color:#fff;}
.cook-card .c-label:active{transform:scale(.95);}
.cook-card .c-count{position:absolute;top:6px;right:8px;background:var(--green);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600;}

/* ===== 计时卡片（还在煮） ===== */
.cook-card.cooking{width:calc((100% - 10px)/2);min-width:130px;border-color:var(--amber);border-width:1px;}
.cook-card.cooking .c-icon{font-size:28px;}
.cook-card .c-time{font-size:22px;font-weight:700;color:var(--red);margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
.cook-card .c-time.paused{color:var(--amber);}
.cook-card.cooking .c-actions{display:flex;gap:6px;justify-content:center;margin-top:8px;}
.cook-card .c-actions button{border:none;border-radius:14px;font-size:11px;padding:4px 10px;cursor:pointer;font-family:var(--font);transition:all .15s;}
.cook-card .c-actions .btn-again{background:rgba(217,79,59,.08);color:var(--red);}
.cook-card .c-actions .btn-again:active{background:rgba(217,79,59,.18);}
.cook-card .c-pause{position:absolute;top:6px;right:6px;display:flex;gap:4px;}
.cook-card .c-pause button{border:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;transition:all .15s;}
.cook-card .c-pause .btn-p{background:rgba(245,166,35,.1);color:var(--amber);}
.cook-card .c-pause .btn-x{background:rgba(0,0,0,.04);color:var(--text-l);}
.cook-card .c-pause .btn-x:hover{color:var(--red);}

/* ===== 快速计时 ===== */
.quick-bar{padding:8px 16px;display:flex;gap:8px;justify-content:center;}
.quick-btn{flex:1;padding:10px;background:#fff;border:1px solid var(--border);border-radius:var(--rm);text-align:center;cursor:pointer;transition:all .2s;font-family:var(--font);}
.quick-btn:active{transform:scale(.96);border-color:var(--red);}
.quick-btn .q-time{font-size:16px;font-weight:700;color:var(--text-p);}
.quick-btn .q-label{font-size:10px;color:var(--text-l);margin-top:2px;}

/* ===== 待下锅队列 ===== */
.queue-section{margin:4px 16px;}
.queue-section .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.queue-section .q-head h4{font-size:13px;font-weight:600;color:var(--text-p);}
.queue-section .q-head .q-clear{font-size:11px;color:var(--text-l);cursor:pointer;}
.queue-tags{display:flex;flex-wrap:wrap;gap:6px;}
.q-tag{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:5px 10px 5px 8px;font-size:12px;color:var(--text-p);cursor:pointer;transition:all .15s;}
.q-tag:active{border-color:var(--red);transform:scale(.96);}
.q-tag .q-emoji{font-size:16px;}
.q-tag .q-count{background:var(--red);color:#fff;font-size:10px;padding:0 5px;border-radius:8px;font-weight:600;min-width:16px;text-align:center;}

/* ===== 空状态 ===== */
.empty-msg{text-align:center;padding:20px 16px;color:var(--text-l);font-size:13px;line-height:1.6;}

/* ===== 扫描弹层 ===== */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:375px;background:var(--white);border-radius:20px 20px 0 0;padding:0 20px 30px;transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:301;}
.modal.show{transform:translateX(-50%) translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 16px;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:12px;}
.scan-anim{width:100%;aspect-ratio:16/9;background:#f5f0eb;border-radius:var(--rl);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:16px;position:relative;overflow:hidden;}
.scan-anim .scan-frame{width:70%;height:60%;border:2px dashed var(--red);border-radius:var(--rm);position:relative;overflow:hidden;}
.scan-anim .scan-bar{position:absolute;top:0;left:0;width:100%;height:2px;background:var(--red);box-shadow:0 0 8px var(--red);animation:sBar 1.2s ease-in-out infinite;}
@keyframes sBar{0%,100%{top:0}50%{top:100%}}
.scan-anim.done .scan-bar{animation:none;opacity:0;}
.scan-anim .scan-st{font-size:12px;color:var(--text-s);margin-top:8px;}
.scan-list{margin-bottom:16px;}
.scan-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.scan-item:last-child{border-bottom:none;}
.scan-item .si-left{display:flex;align-items:center;gap:8px;}
.scan-item .si-icon{font-size:20px;}
.scan-item .si-name{font-size:13px;font-weight:500;color:var(--text-p);}
.scan-item .si-qty{font-size:13px;font-weight:700;color:var(--red);}

/* ===== Toast ===== */
.toast-container{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:375px;width:90%;}
.toast{background:rgba(45,45,45,.88);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;text-align:center;animation:toastIn .3s,toastOut .3s 1.7s forwards;pointer-events:auto;}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px);}}

/* ===== 英文/日文宽度适配 ===== */
html[lang="en"] .cook-card{min-width:110px;}
html[lang="en"] .cook-card.cooking{min-width:150px;}
html[lang="ja"] .cook-card{min-width:108px;}
html[lang="ja"] .cook-card.cooking{min-width:140px;}
html[lang="en"] .dish-card{width:110px;}
html[lang="ja"] .dish-card{width:106px;}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 状态栏 -->
  <div class="status-bar"><span>9:41</span><span></span><span>100%</span></div>

  <!-- 导航栏 -->
  <div class="nav">
    <div class="nav-title"><span class="logo">🍲</span><span data-t="appName">火锅时钟</span></div>
    <div class="lang-seg" id="langSeg">
      <span data-lang="zh" class="active">中</span>
      <span data-lang="en">EN</span>
      <span data-lang="ja">日</span>
    </div>
  </div>

  <!-- 顶部状态区 -->
  <div class="top-status">
    <div class="top-msg" id="topMsg" data-t="idleMsg">选择菜品，开始涮煮计时</div>
    <div class="top-counts" id="topCounts" style="display:none">
      <span class="top-count"><b id="cntCooking">0</b> <span data-t="cookingLabel">还在煮</span></span>
      <span class="top-count"><b id="cntReady">0</b> <span data-t="readyLabel">可以吃了</span></span>
    </div>
  </div>

  <!-- Tips -->
  <div class="tips-area" id="tipsArea">
    <div class="tips-card">
      <div class="t-text" id="tipText"></div>
      <div class="t-dot" id="tipDots"></div>
    </div>
  </div>
  <div class="tips-mini" id="tipsMini" style="display:none" data-t="expandTips">展开小贴士</div>

  <!-- 主内容区（下滑后的工作台） -->
  <div id="workspace">
    <!-- 搜索栏 -->
    <div class="search-row">
      <div class="search-box">
        <span class="s-icon">🔍</span>
        <input id="searchInput" data-t-placeholder="searchPlaceholder" placeholder="搜索菜品...">
      </div>
      <div class="scan-btn" id="scanBtn" title="Scan">📷</div>
    </div>

    <!-- 分类标签 -->
    <div class="cat-row" id="catRow"></div>

    <!-- "可以吃了" -->
    <div id="readySection" style="display:none">
      <div class="section-head"><h3 data-t="readyTitle">🍲 可以吃了</h3><span class="badge" id="readyBadge">0</span></div>
      <div class="scroll-row snap" id="readyRow"></div>
    </div>

    <!-- "还在煮" -->
    <div id="cookingSection" style="display:none">
      <div class="section-head"><h3 data-t="cookingTitle">🔥 还在煮</h3><span class="badge cooking" id="cookingBadge">0</span></div>
      <div class="scroll-row snap" id="cookingRow"></div>
    </div>

    <!-- 待下锅队列 -->
    <div class="queue-section" id="queueSection" style="display:none">
      <div class="q-head">
        <h4 data-t="queueTitle">🧺 待下锅</h4>
        <span class="q-clear" id="queueClear" data-t="queueClear">清空</span>
      </div>
      <div class="queue-tags" id="queueTags"></div>
    </div>

    <!-- 菜品网格 -->
    <div class="section-head" style="padding-top:12px"><h3 data-t="dishTitle">📋 菜品列表</h3></div>
    <div class="scroll-row" id="dishRow" style="flex-wrap:wrap;padding-bottom:12px;"></div>

    <!-- 快速计时 -->
    <div class="section-head"><h3 data-t="quickTitle">⏱ 快速计时</h3></div>
    <div class="quick-bar" id="quickBar"></div>

    <!-- 底部留白 -->
    <div style="height:40px"></div>
  </div>
</div>

<!-- 扫描弹层 -->
<div class="modal-overlay" id="scanOverlay"></div>
<div class="modal" id="scanModal">
  <div class="modal-handle"></div>
  <div class="modal-title" data-t="scanTitle">📷 扫描菜单</div>
  <div class="scan-anim" id="scanAnim">
    <div class="scan-frame"><div class="scan-bar"></div></div>
    <div class="scan-st" data-t="scanning">扫描中...</div>
  </div>
  <div class="scan-list" id="scanList"></div>
  <button class="cta-btn" id="scanConfirm" style="width:100%;padding:14px;background:var(--red);color:#fff;font-size:14px;font-weight:700;border:none;border-radius:28px;cursor:pointer;box-shadow:0 4px 12px rgba(217,79,59,.3);" data-t="scanConfirm">加入待下锅</button>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastBox"></div>

<script>
/* ===== 多语种 ===== */
const L={
zh:{
  appName:'火锅时钟',idleMsg:'选择菜品，开始涮煮计时',
  cookingLabel:'还在煮',readyLabel:'可以吃了',
  expandTips:'展开小贴士',searchPlaceholder:'搜索菜品...',
  readyTitle:'🍲 可以吃了',cookingTitle:'🔥 还在煮',
  queueTitle:'🧺 待下锅',queueClear:'清空',dishTitle:'📋 菜品列表',
  quickTitle:'⏱ 快速计时',scanTitle:'📷 扫描菜单',scanning:'扫描中...',
  scanDone:'识别到 {n} 种菜品',scanConfirm:'加入待下锅',
  startCook:'下锅',addQueue:'待下锅',cook:'下锅',doneLabel:'已捞出',

  toastDone:'{name} 可以吃了！',toastQueueCleared:'待下锅已清空',

  second:'秒',minute:'分钟',

  expandTips:'ヒントを表示',searchPlaceholder:'具材を検索...',

  queueTitle:'🧆 待機中',queueClear:'クリア',dishTitle:'📋 具材リスト',
  quickTitle:'⏱ クイックタイマー',scanTitle:'📷 スキャン',scanning:'スキャン中...',
  scanDone:'{n}品を検出',scanConfirm:'待機に追加',
  startCook:'茹でる',addQueue:'待機',cook:'茹でる',doneLabel:'完成',
  againLabel:'もう一回',pauseLabel:'一時停止',resumeLabel:'再開',
  topCooking:'{n}品茹で中',topReady:'{n}品茹で上がり！',

  toastStarted:'{name} 茹で開始',toastAdded:'{name} 待機に追加',

  queueTitle:'🧧 Queued',queueClear:'Clear',dishTitle:'📋 Ingredients',
  quickTitle:'⏱ Quick Timer',scanTitle:'📷 Scan Menu',scanning:'Scanning...',
  scanDone:'{n} items detected',scanConfirm:'Add to Queue',
  startCook:'Cook',addQueue:'Queue',cook:'Cook',doneLabel:'Served',
  againLabel:'One More',pauseLabel:'Pause',resumeLabel:'Resume',
  topCooking:'{n} still cooking',topReady:'{n} ready to eat!',
  topBoth:'{c} cooking, {r} ready',
  toastStarted:'{name} started cooking',toastAdded:'{name} added to queue',
  toastDone:'{name} is ready!',toastQueueCleared:'Queue cleared',
  allCat:'Favorites',customCat:'Custom',
  second:'sec',minute:'min',
}};
const t=(k,vars)=>{let v=L[S.lang][k]||L.zh[k]||k;if(vars)Object.entries(vars).forEach(([key,val])=>{v=v.replace(`{${key}}`,val);});return v;};

/* ===== Tips ===== */

  {zh:'嫩牛肉变色即熟，别煮太老 🥩',ja:'嫩牛は色が変わったらOK 🥩',en:'Tender beef: color change = done 🥩'},
  {zh:'冻豆腐越煮越香，吸满汤汁超满足 🧊',ja:'凍り豆腐は煮込むほど美味 🧊',en:'Frozen tofu gets better with time 🧊'},
  {zh:'生菜烫软就好，清爽解腻担当 🥬',ja:'レタスはしんなりしたら 🥬',en:'Lettuce: quick wilt refreshes 🥬'},

/* ===== 模拟扫描数据 ===== */
const SCAN_DATA=[
  {dishId:'beef-tripe',qty:2},{dishId:'duck-intestine',qty:1},
  {dishId:'lamb-slice',qty:1},{dishId:'shrimp-paste',qty:1},
  {dishId:'lettuce',qty:1},
];

/* ===== 状态 ===== */
const S={
  lang:'zh',
  activeCat:'common',
  search:'',
  tipIdx:0,
  tipTimer:null,
  // 待下锅队列：{ dishId, qty }
  queue:[],
  // 计时任务：{ id, dishId, totalSec, remainSec, status:'cooking'|'paused'|'done' }
  timers:[],
  timerRAF:null,
  lastTick:0,
  audioCtx:null,
  audioInited:false,
};

/* ===== 工具 ===== */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const fmt=s=>{const m=Math.floor(s/60),sec=s%60;return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;};
const dName=d=>d.name[S.lang]||d.name.zh;
const cName=c=>c.name[S.lang]||c.name.zh;
const findDish=id=>DISHES.find(d=>d.id===id);

/* ===== 音频 ===== */
function initAudio(){if(S.audioInited)return;try{S.audioCtx=new(window.AudioContext||window.webkitAudioContext)();S.audioInited=true;}catch(e){}}
function playDone(){
  if(!S.audioCtx)initAudio();
  if(!S.audioCtx)return;
  try{
    const o=S.audioCtx.createOscillator(),g=S.audioCtx.createGain();
    o.connect(g);g.connect(S.audioCtx.destination);
    o.frequency.setValueAtTime(880,S.audioCtx.currentTime);
    o.frequency.setValueAtTime(1100,S.audioCtx.currentTime+.12);
    o.frequency.setValueAtTime(1320,S.audioCtx.currentTime+.24);
    g.gain.setValueAtTime(.25,S.audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.01,S.audioCtx.currentTime+.45);
    o.start(S.audioCtx.currentTime);o.stop(S.audioCtx.currentTime+.45);
  }catch(e){}
  // 振动
  if(navigator.vibrate)navigator.vibrate([100,50,100]);
}

/* ===== Toast ===== */
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  $('#toastBox').appendChild(el);
  setTimeout(()=>el.remove(),2100);
}

/* ===== 多语种切换 ===== */
function setLang(lang){
  S.lang=lang;document.documentElement.lang=lang;
  $$('.lang-seg span').forEach(s=>s.classList.toggle('active',s.dataset.lang===lang));
  $$('.data-t').length;// trigger re-render
  $$('.section-head h3[data-t]').forEach(el=>{const k=el.dataset.t;if(L[S.lang][k])el.textContent=L[S.lang][k];});
  render();
}
$('#langSeg').addEventListener('click',e=>{const s=e.target.closest('[data-lang]');if(s){initAudio();setLang(s.dataset.lang);}});

/* ===== Tips ===== */
function startTips(){
  clearInterval(S.tipTimer);
  renderTip();
  S.tipTimer=setInterval(()=>{S.tipIdx=(S.tipIdx+1)%TIPS.length;renderTip();},4000);
}
function renderTip(){
  $('#tipText').textContent=TIPS[S.tipIdx][S.lang];
  $('#tipDots').innerHTML=TIPS.map((_,i)=>`<i class="${i===S.tipIdx?'on':''}"></i>`).join('');
}
$('#tipsMini').addEventListener('click',()=>{
  $('#tipsArea').classList.remove('collapsed');$('#tipsMini').style.display='none';
});

/* ===== 顶部状态 ===== */
function renderStatus(){
  const cooking=S.timers.filter(t=>t.status==='cooking').length;
  const paused=S.timers.filter(t=>t.status==='paused').length;
  const ready=S.timers.filter(t=>t.status==='done').length;
  const msg=$('#topMsg'),counts=$('#topCounts');
  if(cooking===0&&ready===0){
    msg.textContent=t('idleMsg');msg.className='top-msg';
    counts.style.display='none';
    $('#tipsArea').classList.remove('collapsed');$('#tipsMini').style.display='none';
  }else{
    $('#tipsArea').classList.add('collapsed');$('#tipsMini').style.display='block';
    counts.style.display='flex';
    $('#cntCooking').textContent=cooking+paused;
    $('#cntReady').textContent=ready;
    if(ready>0){msg.textContent=t('topReady',{n:ready});msg.className='top-msg highlight';}
    else{msg.textContent=t('topCooking',{n:cooking+paused});msg.className='top-msg';}
  }
}

/* ===== 分类 ===== */
function renderCats(){
  const row=$('#catRow');
  row.innerHTML=CATS.map(c=>{
    const icon=c.icon||'⭐';
    return `<div class="cat-tag${S.activeCat===c.id?' active':''}" data-cat="${c.id}">${icon} ${cName(c)}</div>`;
  }).join('');
  row.querySelectorAll('.cat-tag').forEach(el=>el.addEventListener('click',()=>{S.activeCat=el.dataset.cat;S.search='';$('#searchInput').value='';renderCats();renderDishes();}));
}
function getFilteredDishes(){
  let list=S.activeCat==='common'?DISHES.filter(d=>d.isCommon):DISHES.filter(d=>d.cat===S.activeCat);
  if(S.search){
    const q=S.search.toLowerCase();
    list=list.filter(d=>Object.values(d.name).some(n=>n.toLowerCase().includes(q)));
  }
  return list;
}

/* ===== 搜索 ===== */
$('#searchInput').addEventListener('input',e=>{S.search=e.target.value.trim();renderDishes();});

/* ===== 菜品卡片 ===== */
function renderDishes(){
  const row=$('#dishRow');
  const list=getFilteredDishes();
  if(list.length===0){row.innerHTML=`<div class="empty-msg">${S.search?'未找到匹配菜品':'暂无菜品'}</div>`;return;}
  row.innerHTML=list.map(d=>{
    const q=S.queue.find(q=>q.dishId===d.id);
    return `<div class="dish-card" data-id="${d.id}">
      <div class="d-icon">${d.icon}</div>
      <div class="d-name">${dName(d)}</div>
      <div class="d-time">${fmt(d.sec)}</div>
      <div class="d-ops">
        <button class="btn-start" data-act="start">${t('startCook')}</button>
        <button class="btn-queue" data-act="queue">${t('addQueue')}</button>
      </div>
    </div>`;
  }).join('');
  row.querySelectorAll('.dish-card button').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();initAudio();
    const card=btn.closest('.dish-card'),id=card.dataset.id,act=btn.dataset.act;
    if(act==='start')startCooking(id);
    else if(act==='queue')addToQueue(id);
  }));
}

/* ===== 快速计时 ===== */
function renderQuick(){
  const bar=$('#quickBar');
  const items=[{sec:30,label:t('second','30')},{sec:60,label:t('minute','1')},{sec:180,label:t('minute','3')}];
  bar.innerHTML=items.map(i=>`<div class="quick-btn" data-sec="${i.sec}"><div class="q-time">${fmt(i.sec)}</div><div class="q-label">${i.label}</div></div>`).join('');
  bar.querySelectorAll('.quick-btn').forEach(el=>el.addEventListener('click',()=>{
    initAudio();
    S.timers.push({id:'_q'+Date.now(),dishId:null,totalSec:parseInt(el.dataset.sec),remainSec:parseInt(el.dataset.sec),status:'cooking',custom:true});
    render();startTimerLoop();
    toast(t('toastStarted',{name:fmt(parseInt(el.dataset.sec))}));
  }));
}

/* ===== 待下锅队列 ===== */
function addToQueue(dishId,qty=1){
  const existing=S.queue.find(q=>q.dishId===dishId);
  if(existing){existing.qty+=qty;}
  else{S.queue.push({dishId,qty});}
  const d=findDish(dishId);
  toast(t('toastAdded',{name:d?dName(d):dishId}));
  render();
}
function renderQueue(){
  const sec=$('#queueSection');
  if(S.queue.length===0){sec.style.display='none';return;}
  sec.style.display='block';
  $('#queueTags').innerHTML=S.queue.map(q=>{
    const d=findDish(q.dishId);
    return `<div class="q-tag" data-id="${q.dishId}"><span class="q-emoji">${d?d.icon:'🍽️'}</span>${d?dName(d):q.dishId}<span class="q-count">×${q.qty}</span></div>`;
  }).join('');
  sec.querySelectorAll('.q-tag').forEach(tag=>tag.addEventListener('click',()=>{
    initAudio();const id=tag.dataset.id;startCooking(id);
  }));
}
$('#queueClear').addEventListener('click',()=>{S.queue=[];toast(t('queueQueueCleared'));render();});

/* ===== 计时逻辑 ===== */
function startCooking(dishId){
  const d=findDish(dishId);
  const sec=d?d.sec:30;
  // 先检查待下锅队列，核销一份
  const qi=S.queue.find(q=>q.dishId===dishId);
  if(qi){qi.qty--;if(qi.qty<=0)S.queue=S.queue.filter(q=>q.dishId!==dishId);}
  S.timers.push({id:'t'+Date.now()+Math.random(),dishId,totalSec:sec,remainSec:sec,status:'cooking'});
  render();startTimerLoop();
  if(d)toast(t('toastStarted',{name:dName(d)}));
}

function timerTick(){
  const now=performance.now();
  if(now-S.lastTick>=1000){
    S.lastTick=now;
    let anyStatusChange=false;
    S.timers.forEach(timer=>{
      if(timer.status==='cooking'&&timer.remainSec>0){
        timer.remainSec--;
        if(timer.remainSec===0){
          timer.status='done';
          anyStatusChange=true;
          playDone();
          const d=findDish(timer.dishId);
          if(d)toast(t('toastDone',{name:dName(d)}));
        }
      }
    });
    tickTimerDisplays();
    if(anyStatusChange){renderTimers();renderStatus();}
  }
  if(S.timers.some(t=>t.status==='cooking'&&t.remainSec>0)){
    S.timerRAF=requestAnimationFrame(timerTick);
  }else{S.timerRAF=null;}
}
function startTimerLoop(){
  if(S.timerRAF)return;
  S.lastTick=performance.now();
  S.timerRAF=requestAnimationFrame(timerTick);
}

/* ===== 轻量倒计时刷新（不重建 DOM）===== */
function tickTimerDisplays(){
  S.timers.forEach(timer=>{
    const card=$(`.cook-card[data-tid="${timer.id}"]`);
    if(!card)return;
    const timeEl=card.querySelector('.c-time');
    if(timeEl){
      const paused=timer.status==='paused';
      timeEl.className='c-time'+(paused?' paused':'');
      timeEl.textContent=(paused?'⏸ ':'')+fmt(timer.remainSec);
    }
  });
}

/* ===== 计时卡片渲染 ===== */
function renderTimers(){
  // 可以吃了
  const ready=S.timers.filter(t=>t.status==='done');
  const cooking=S.timers.filter(t=>t.status==='cooking'||t.status==='paused');
  const readySec=$('#readySection'),cookingSec=$('#cookingSection');
  if(ready.length>0){
    readySec.style.display='block';$('#readyBadge').textContent=ready.length;
    $('#readyRow').innerHTML=ready.map(timer=>{
      const d=findDish(timer.dishId);
      return `<div class="cook-card" data-tid="${timer.id}">
        <div class="c-icon">${d?d.icon:'⏱'}</div>
        <div class="c-name">${d?dName(d):t('quickTitle')}</div>
        <div class="c-label" data-act="served">${t('doneLabel')}</div>
      </div>`;
    }).join('');
    $('#readyRow').querySelectorAll('.c-label[data-act="served"]').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const card=btn.closest('.cook-card'),tid=card.dataset.tid;
        S.timers=S.timers.filter(t=>t.id!==tid);
        render();
      });
    });
  }else{readySec.style.display='none';}

  // 还在煮
  if(cooking.length>0){
    cookingSec.style.display='block';$('#cookingBadge').textContent=cooking.length;
    $('#cookingRow').innerHTML=cooking.map(timer=>{
      const d=findDish(timer.dishId);
      const paused=timer.status==='paused';
      return `<div class="cook-card cooking" data-tid="${timer.id}">
        <div class="c-pause">
          <button class="btn-p" data-act="toggle" title="${paused?t('resumeLabel'):t('pauseLabel')}">${paused?'▶':'⏸'}</button>
          <button class="btn-x" data-act="remove" title="Remove">✕</button>
        </div>
        <div class="c-icon">${d?d.icon:'⏱'}</div>
        <div class="c-name">${d?dName(d):t('quickTitle')}</div>
        <div class="c-time${paused?' paused':''}">${paused?'⏸ ':''}${fmt(timer.remainSec)}</div>
        <div class="c-actions">
          <button class="btn-again" data-act="again">${t('againLabel')}</button>
        </div>
      </div>`;
    }).join('');
    cookingSec.querySelectorAll('.cook-card button').forEach(btn=>btn.addEventListener('click',e=>{
      e.stopPropagation();initAudio();
      const card=btn.closest('.cook-card'),tid=card.dataset.tid,act=btn.dataset.act;
      const timer=S.timers.find(t=>t.id===tid);if(!timer)return;
      if(act==='toggle'){timer.status=timer.status==='paused'?'cooking':'paused';startTimerLoop();render();}
      if(act==='remove'){S.timers=S.timers.filter(t=>t.id!==tid);render();}
      if(act==='again'){timer.remainSec=timer.totalSec;timer.status='cooking';startTimerLoop();toast(t('toastStarted',{name:findDish(timer.dishId)?dName(findDish(timer.dishId)):fmt(timer.totalSec)}));render();}
    }));
  }else{cookingSec.style.display='none';}
}

/* ===== 扫描 ===== */
$('#scanBtn').addEventListener('click',()=>{initAudio();openScan();});
function openScan(){
  const overlay=$('#scanOverlay'),modal=$('#scanModal'),anim=$('#scanAnim'),list=$('#scanList');
  anim.classList.remove('done');anim.querySelector('.scan-st').textContent=t('scanning');
  anim.querySelector('.scan-bar').style.animationPlayState='running';
  list.innerHTML='';list.style.display='none';
  $('#scanConfirm').style.display='none';
  overlay.classList.add('show');modal.classList.add('show');
  // 模拟扫描
  setTimeout(()=>{
    anim.classList.add('done');anim.querySelector('.scan-st').textContent=t('scanDone',{n:SCAN_DATA.length});
    list.style.display='block';
    list.innerHTML=SCAN_DATA.map(item=>{
      const d=findDish(item.dishId);
      return `<div class="scan-item"><div class="si-left"><span class="si-icon">${d?d.icon:'🍽️'}</span><span class="si-name">${d?dName(d):item.dishId}</span></div><span class="si-qty">×${item.qty}</span></div>`;
    }).join('');
    $('#scanConfirm').style.display='block';
  },1500);
}
$('#scanConfirm').addEventListener('click',()=>{
  SCAN_DATA.forEach(item=>addToQueue(item.dishId,item.qty));
  closeScan();
});
$('#scanOverlay').addEventListener('click',closeScan);
function closeScan(){$('#scanOverlay').classList.remove('show');$('#scanModal').classList.remove('show');}

/* ===== 总渲染 ===== */
function render(){
  renderStatus();renderCats();renderQueue();renderDishes();renderQuick();renderTimers();
  // 多语种静态文案
  document.querySelectorAll('[data-t]').forEach(el=>{
    if(L[S.lang][el.dataset.t])el.textContent=L[S.lang][el.dataset.t];
  });
  document.querySelectorAll('[data-t-placeholder]').forEach(el=>{
    if(L[S.lang][el.dataset.tPlaceholder])el.placeholder=L[S.lang][el.dataset.tPlaceholder];
  });
  // Tips
  renderTip();
}

/* ===== 初始化 ===== */
render();
startTips();
</script>
