<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片裁剪</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mingcute_icon@2.9.72/font/Mingcute.min.css">
<link rel="stylesheet" href="../css/common.css">
<style>
  .crop-container {
    position: relative;
    width: 100%;
    background: var(--bg-page-2);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    max-height: 450px;
  }
  .crop-container img {
    max-width: 100%;
    max-height: 450px;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  .crop-box {
    position: absolute;
    border: 2px solid var(--color-brand);
    box-sizing: border-box;
    cursor: move;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    background: transparent;
  }
  .crop-handle {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #fff;
    border: 2px solid var(--color-brand);
    border-radius: 2px;
    box-sizing: border-box;
    z-index: 1;
  }
  .crop-handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
  .crop-handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
  .crop-handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
  .crop-handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
  .crop-handle.n { top: -6px; left: 50%; margin-left: -6px; cursor: n-resize; }
  .crop-handle.s { bottom: -6px; left: 50%; margin-left: -6px; cursor: s-resize; }
  .crop-handle.w { top: 50%; left: -6px; margin-top: -6px; cursor: w-resize; }
  .crop-handle.e { top: 50%; right: -6px; margin-top: -6px; cursor: e-resize; }
  .ratio-btns {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .ratio-btns .btn {
    padding: 6px 12px;
    font-size: var(--text-sm);
  }
  .ratio-btns .btn.active {
    background: var(--color-brand);
    color: #fff;
    border-color: var(--color-brand);
  }
  .crop-info {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-4);
    font-size: var(--text-sm);
    color: var(--fg-muted);
  }
  .crop-info span strong {
    color: var(--fg-base);
    font-weight: 600;
  }
  .preview-section {
    display: none;
  }
  .preview-section.show { display: block; }
  .preview-box {
    background: var(--bg-page-2);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 150px;
  }
  .preview-box img {
    max-width: 100%;
    max-height: 300px;
    border-radius: var(--radius-sm);
  }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="tool-header">
      <h2><i class="mgc_scissors_line"></i> 图片裁剪</h2>
      <p>在浏览器本地裁剪图片，支持自由比例和预设比例，不上传服务器</p>
    </div>

    <div class="dropzone" id="dropzone">
      <div class="icon"><i class="mgc_folder_2_line"></i></div>
      <div>点击选择图片，或拖拽图片到此处</div>
      <div class="hint">支持 PNG、JPG、WEBP、BMP 等格式</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">

    <div class="crop-section" id="cropSection" style="display:none;">
      <div class="field">
        <label>裁剪比例</label>
        <div class="ratio-btns">
          <button class="btn active" data-ratio="free">自由</button>
          <button class="btn" data-ratio="1:1">1:1</button>
          <button class="btn" data-ratio="4:3">4:3</button>
          <button class="btn" data-ratio="3:4">3:4</button>
          <button class="btn" data-ratio="16:9">16:9</button>
          <button class="btn" data-ratio="9:16">9:16</button>
          <button class="btn" data-ratio="3:2">3:2</button>
          <button class="btn" data-ratio="2:3">2:3</button>
        </div>
      </div>

      <div class="field">
        <div class="crop-container" id="cropContainer">
          <img id="sourceImg" alt="源图片">
          <div class="crop-box" id="cropBox">
            <div class="crop-handle nw" data-handle="nw"></div>
            <div class="crop-handle n" data-handle="n"></div>
            <div class="crop-handle ne" data-handle="ne"></div>
            <div class="crop-handle w" data-handle="w"></div>
            <div class="crop-handle e" data-handle="e"></div>
            <div class="crop-handle sw" data-handle="sw"></div>
            <div class="crop-handle s" data-handle="s"></div>
            <div class="crop-handle se" data-handle="se"></div>
          </div>
        </div>
      </div>

      <div class="field">
        <div class="crop-info">
          <span>X: <strong id="infoX">0</strong>px</span>
          <span>Y: <strong id="infoY">0</strong>px</span>
          <span>W: <strong id="infoW">0</strong>px</span>
          <span>H: <strong id="infoH">0</strong>px</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="cropBtn"><i class="mgc_scissors_line"></i> 裁剪并下载</button>
        <button class="btn secondary" id="resetBtn"><i class="mgc_refresh_1_line"></i> 重置</button>
        <button class="btn secondary" id="clearBtn"><i class="mgc_delete_2_line"></i> 清空</button>
      </div>

      <div class="preview-section" id="previewSection">
        <div class="field">
          <label>裁剪预览</label>
          <div class="preview-box">
            <img id="previewImg" alt="裁剪预览">
          </div>
        </div>
      </div>
    </div>

    <div class="error" id="error"></div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
(function() {
  'use strict';

  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('fileInput');
  var cropSection = document.getElementById('cropSection');
  var cropContainer = document.getElementById('cropContainer');
  var sourceImg = document.getElementById('sourceImg');
  var cropBox = document.getElementById('cropBox');
  var error = document.getElementById('error');
  var infoX = document.getElementById('infoX');
  var infoY = document.getElementById('infoY');
  var infoW = document.getElementById('infoW');
  var infoH = document.getElementById('infoH');
  var previewSection = document.getElementById('previewSection');
  var previewImg = document.getElementById('previewImg');

  var currentRatio = 'free';
  var naturalW = 0;
  var naturalH = 0;
  var displayScale = 1;

  var isDragging = false;
  var isResizing = false;
  var activeHandle = '';
  var dragStartX = 0;
  var dragStartY = 0;
  var boxStartX = 0;
  var boxStartY = 0;
  var boxStartW = 0;
  var boxStartH = 0;

  dropzone.addEventListener('click', function() { fileInput.click(); });
  fileInput.addEventListener('change', function(e) {
    if (e.target.files && e.target.files[0]) loadImage(e.target.files[0]);
  });

  dropzone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
  dropzone.addEventListener('dragleave', function() {
    dropzone.classList.remove('dragover');
  });
  dropzone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
  });

  function loadImage(file) {
    if (!file.type.startsWith('image/')) {
      Toolbox.showToast('请选择图片文件');
      return;
    }
    error.textContent = '';
    var reader = new FileReader();
    reader.onload = function(ev) {
      sourceImg.onload = function() {
        naturalW = sourceImg.naturalWidth;
        naturalH = sourceImg.naturalHeight;
        // 等待图片渲染完成
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            initCrop();
          });
        });
      };
      sourceImg.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function initCrop() {
    var imgW = sourceImg.offsetWidth;
    var imgH = sourceImg.offsetHeight;
    // scale: 原图尺寸 / 显示尺寸，用于将显示坐标转换为原图坐标
    displayScale = naturalW / imgW;

    // 默认裁剪框：图片中央，70% 大小
    var cropW = imgW * 0.7;
    var cropH = imgH * 0.7;
    var cropX = (imgW - cropW) / 2;
    var cropY = (imgH - cropH) / 2;

    // 使用 transform 更稳定
    cropBox.style.left = '0';
    cropBox.style.top = '0';
    cropBox.style.width = cropW + 'px';
    cropBox.style.height = cropH + 'px';
    cropBox.style.transform = 'translate(' + cropX + 'px, ' + cropY + 'px)';

    cropSection.style.display = '';
    dropzone.style.display = 'none';
    previewSection.classList.remove('show');
    updateInfo();
  }

  function updateInfo() {
    var rect = getCropRect();
    infoX.textContent = Math.round(rect.x * displayScale);
    infoY.textContent = Math.round(rect.y * displayScale);
    infoW.textContent = Math.round(rect.w * displayScale);
    infoH.textContent = Math.round(rect.h * displayScale);
  }

  function getCropRect() {
    var transform = cropBox.style.transform;
    var match = transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
    if (!match) return { x: 0, y: 0, w: 0, h: 0 };

    var x = parseFloat(match[1]);
    var y = parseFloat(match[2]);
    var w = parseFloat(cropBox.style.width);
    var h = parseFloat(cropBox.style.height);
    return { x: x, y: y, w: w, h: h };
  }

  function setCropRect(x, y, w, h) {
    cropBox.style.width = w + 'px';
    cropBox.style.height = h + 'px';
    cropBox.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function getRatioValue() {
    if (currentRatio === 'free') return null;
    var parts = currentRatio.split(':');
    return parseInt(parts[0]) / parseInt(parts[1]);
  }

  // 拖动裁剪框
  cropBox.addEventListener('mousedown', function(e) {
    if (e.target.classList.contains('crop-handle')) return;
    e.preventDefault();
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    var rect = getCropRect();
    boxStartX = rect.x;
    boxStartY = rect.y;
  });

  // 缩放句柄
  document.querySelectorAll('.crop-handle').forEach(function(handle) {
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      isResizing = true;
      activeHandle = handle.dataset.handle;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      var rect = getCropRect();
      boxStartX = rect.x;
      boxStartY = rect.y;
      boxStartW = rect.w;
      boxStartH = rect.h;
    });
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging && !isResizing) return;

    var imgW = sourceImg.offsetWidth;
    var imgH = sourceImg.offsetHeight;
    var dx = e.clientX - dragStartX;
    var dy = e.clientY - dragStartY;
    var ratio = getRatioValue();

    if (isDragging) {
      // 拖动：移动整个裁剪框
      var newX = boxStartX + dx;
      var newY = boxStartY + dy;
      var rect = getCropRect();
      newX = clamp(newX, 0, imgW - rect.w);
      newY = clamp(newY, 0, imgH - rect.h);
      setCropRect(newX, newY, rect.w, rect.h);
    } else if (isResizing) {
      var x = boxStartX;
      var y = boxStartY;
      var w = boxStartW;
      var h = boxStartH;

      // 根据句柄调整大小
      if (activeHandle.includes('e')) {
        w = clamp(boxStartW + dx, 20, imgW - boxStartX);
      }
      if (activeHandle.includes('w')) {
        var newW = clamp(boxStartW - dx, 20, boxStartX + boxStartW);
        x = boxStartX + (boxStartW - newW);
        w = newW;
      }
      if (activeHandle.includes('s')) {
        h = clamp(boxStartH + dy, 20, imgH - boxStartY);
      }
      if (activeHandle.includes('n')) {
        var newH = clamp(boxStartH - dy, 20, boxStartY + boxStartH);
        y = boxStartY + (boxStartH - newH);
        h = newH;
      }

      // 比例约束
      if (ratio && (activeHandle === 'e' || activeHandle === 'w' || activeHandle === 'n' || activeHandle === 's')) {
        if (activeHandle === 'e' || activeHandle === 'w') {
          h = w / ratio;
        } else {
          w = h * ratio;
        }
      } else if (ratio) {
        // 四角句柄：保持比例
        var targetRatio = ratio;
        if (w / h > targetRatio) {
          w = h * targetRatio;
        } else {
          h = w / targetRatio;
        }
        if (activeHandle.includes('w')) x = boxStartX + boxStartW - w;
        if (activeHandle.includes('n')) y = boxStartY + boxStartH - h;
      }

      // 确保不超出边界
      x = clamp(x, 0, imgW - w);
      y = clamp(y, 0, imgH - h);
      w = clamp(w, 20, imgW - x);
      h = clamp(h, 20, imgH - y);

      setCropRect(x, y, w, h);
    }

    updateInfo();
  });

  document.addEventListener('mouseup', function() {
    isDragging = false;
    isResizing = false;
  });

  // 比例按钮
  document.querySelectorAll('.ratio-btns .btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.ratio-btns .btn').forEach(function(b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      currentRatio = btn.dataset.ratio;
      applyRatio();
    });
  });

  function applyRatio() {
    var ratio = getRatioValue();
    var imgW = sourceImg.offsetWidth;
    var imgH = sourceImg.offsetHeight;

    if (ratio) {
      var w, h;
      if (imgW / imgH > ratio) {
        h = imgH * 0.7;
        w = h * ratio;
      } else {
        w = imgW * 0.7;
        h = w / ratio;
      }
      var x = (imgW - w) / 2;
      var y = (imgH - h) / 2;
      setCropRect(x, y, w, h);
    }
    updateInfo();
  }

  // 裁剪并下载
  document.getElementById('cropBtn').addEventListener('click', function() {
    error.textContent = '';
    if (!sourceImg.src) {
      Toolbox.showToast('请先选择图片');
      return;
    }

    var rect = getCropRect();
    var sx = rect.x * displayScale;
    var sy = rect.y * displayScale;
    var sw = rect.w * displayScale;
    var sh = rect.h * displayScale;

    var canvas = document.createElement('canvas');
    canvas.width = Math.round(sw);
    canvas.height = Math.round(sh);
    var ctx = canvas.getContext('2d');
    ctx.drawImage(sourceImg, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

    var dataUrl = canvas.toDataURL('image/png', 0.95);

    previewImg.src = dataUrl;
    previewSection.classList.add('show');

    var a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'cropped-image.png';
    a.click();

    Toolbox.showToast('裁剪完成，已开始下载');
  });

  // 重置
  document.getElementById('resetBtn').addEventListener('click', function() {
    initCrop();
    Toolbox.showToast('已重置');
  });

  // 清空
  document.getElementById('clearBtn').addEventListener('click', function() {
    sourceImg.src = '';
    cropSection.style.display = 'none';
    dropzone.style.display = '';
    fileInput.value = '';
    error.textContent = '';
    previewSection.classList.remove('show');
    Toolbox.showToast('已清空');
  });

  // 窗口调整
  window.addEventListener('resize', function() {
    if (sourceImg.src && cropSection.style.display !== 'none') {
      var oldRect = getCropRect();
      var oldImgW = naturalW / displayScale; // 旧的显示宽度
      displayScale = naturalW / sourceImg.offsetWidth;
      var newImgW = sourceImg.offsetWidth;
      var newImgH = sourceImg.offsetHeight;

      // 按比例调整裁剪框位置和大小
      var ratioW = newImgW / oldImgW;
      var newX = oldRect.x * ratioW;
      var newY = oldRect.y * ratioW;
      var newW = oldRect.w * ratioW;
      var newH = oldRect.h * ratioW;

      // Clamp
      newX = clamp(newX, 0, newImgW - newW);
      newY = clamp(newY, 0, newImgH - newH);
      newW = clamp(newW, 20, newImgW - newX);
      newH = clamp(newH, 20, newImgH - newY);

      setCropRect(newX, newY, newW, newH);
      updateInfo();
    }
  });
})();
</script>
</body>
</html>
