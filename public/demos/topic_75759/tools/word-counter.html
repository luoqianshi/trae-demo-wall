<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字数统计</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mingcute_icon@2.9.72/font/Mingcute.min.css">
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="container">
  <div class="card">
    <div class="tool-header">
      <h2><i class="mgc_text_line"></i> 字数统计</h2>
      <p>输入文本，实时统计字符数、字数、行数与段落数</p>
    </div>
    <textarea id="input" placeholder="在此输入或粘贴文本…"></textarea>
    <div class="actions">
      <button class="btn" id="copyBtn"><i class="mgc_copy_2_line"></i> 复制文本</button>
      <button class="btn secondary" id="clearBtn"><i class="mgc_delete_2_line"></i> 清空</button>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="num" id="charCount">0</div><div class="label">字符数</div></div>
      <div class="stat-box"><div class="num" id="wordCount">0</div><div class="label">字数（中文/英文词）</div></div>
      <div class="stat-box"><div class="num" id="lineCount">0</div><div class="label">行数</div></div>
      <div class="stat-box"><div class="num" id="paraCount">0</div><div class="label">段落数</div></div>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
(function() {
  'use strict';
  var input = document.getElementById('input');
  var charCount = document.getElementById('charCount');
  var wordCount = document.getElementById('wordCount');
  var lineCount = document.getElementById('lineCount');
  var paraCount = document.getElementById('paraCount');

  function updateStats() {
    var text = input.value;
    charCount.textContent = text.length;
    var cn = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
    var en = (text.match(/[a-zA-Z]+/g) || []).length;
    wordCount.textContent = cn + en;
    lineCount.textContent = text.length === 0 ? 0 : text.split(/\r\n|\r|\n/).length;
    paraCount.textContent = text.length === 0 ? 0 : text.split(/\n\s*\n/).filter(function(s) { return s.trim().length > 0; }).length;
  }

  input.addEventListener('input', updateStats);

  document.getElementById('copyBtn').addEventListener('click', function() {
    Toolbox.copyText(input.value, '已复制到剪贴板');
  });

  document.getElementById('clearBtn').addEventListener('click', function() {
    input.value = ''; updateStats(); Toolbox.showToast('已清空');
  });
})();
</script>
</body>
</html>
