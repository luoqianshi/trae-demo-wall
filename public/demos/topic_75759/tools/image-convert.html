<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片格式转换</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mingcute_icon@2.9.72/font/Mingcute.min.css">
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="container">
  <div class="card">
    <div class="tool-header">
      <h2><i class="mgc_pic_line"></i> 图片格式转换</h2>
      <p>在浏览器本地将图片转换为其他格式，不上传服务器</p>
    </div>
    <div class="dropzone" id="dropzone">
      <div class="icon"><i class="mgc_folder_2_line"></i></div>
      <div>点击选择图片，或拖拽图片到此处</div>
      <div class="hint">支持 PNG、JPG、WEBP、BMP、GIF 等格式</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <div class="preview" id="preview" style="display:none;">
      <img id="previewImg" alt="预览">
    </div>
    <div class="field">
      <label>输出格式</label>
      <select id="formatSelect">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WEBP</option>
      </select>
    </div>
    <div class="actions">
      <button class="btn" id="convertBtn"><i class="mgc_sparkles_line"></i> 转换并下载</button>
      <button class="btn secondary" id="clearBtn"><i class="mgc_delete_2_line"></i> 清空</button>
    </div>
    <div class="error" id="error"></div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
(function() {
  'use strict';
  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('fileInput');
  var preview = document.getElementById('preview');
  var previewImg = document.getElementById('previewImg');
  var formatSelect = document.getElementById('formatSelect');
  var error = document.getElementById('error');
  var currentFile = null;

  dropzone.addEventListener('click', function() { fileInput.click(); });
  fileInput.addEventListener('change', function(e) { if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]); });

  dropzone.addEventListener('dragover', function(e) { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', function() { dropzone.classList.remove('dragover'); });
  dropzone.addEventListener('drop', function(e) {
    e.preventDefault(); dropzone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) { Toolbox.showToast('请选择图片文件'); return; }
    currentFile = file;
    var reader = new FileReader();
    reader.onload = function(ev) {
      previewImg.src = ev.target.result;
      preview.style.display = '';
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('convertBtn').addEventListener('click', function() {
    error.textContent = '';
    if (!currentFile) { Toolbox.showToast('请先选择图片'); return; }
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var mime = formatSelect.value;
      var ext = mime.split('/')[1];
      var dataUrl = canvas.toDataURL(mime, 0.92);
      var a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'converted.' + ext;
      a.click();
      Toolbox.showToast('转换完成，已开始下载');
    };
    img.src = previewImg.src;
  });

  document.getElementById('clearBtn').addEventListener('click', function() {
    currentFile = null; previewImg.src = ''; preview.style.display = 'none'; fileInput.value = ''; error.textContent = ''; Toolbox.showToast('已清空');
  });
})();
</script>
</body>
</html>
