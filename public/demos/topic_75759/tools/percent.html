<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百分比计算器</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mingcute_icon@2.9.72/font/Mingcute.min.css">
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="container">
  <div class="card">
    <div class="tool-header">
      <h2><i class="mgc_percentage_line"></i> 百分比计算器</h2>
      <p>占比计算、增长百分比、减少百分比</p>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="tool-header"><h3><i class="mgc_chart_pie_line"></i> 占比计算</h3><p>部分 / 整体 = 百分比</p></div>
      <div class="field"><label>部分数值</label><input type="number" id="p1" placeholder="例如 25"></div>
      <div class="field"><label>整体数值</label><input type="number" id="p2" placeholder="例如 100"></div>
      <div class="actions"><button class="btn" id="calcRatio"><i class="mgc_arrow_right_circle_line"></i> 计算占比</button></div>
      <div class="result-box" id="resRatio" style="display:none;"><span class="big" id="valRatio"></span></div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="tool-header"><h3><i class="mgc_trending_up_line"></i> 增长百分比</h3><p>(新值 - 旧值) / 旧值 × 100%</p></div>
      <div class="field"><label>旧值</label><input type="number" id="g1" placeholder="例如 80"></div>
      <div class="field"><label>新值</label><input type="number" id="g2" placeholder="例如 100"></div>
      <div class="actions"><button class="btn" id="calcGrowth"><i class="mgc_arrow_right_circle_line"></i> 计算增长</button></div>
      <div class="result-box" id="resGrowth" style="display:none;"><span class="big" id="valGrowth"></span></div>
    </div>

    <div class="card" style="margin-bottom:0;">
      <div class="tool-header"><h3><i class="mgc_trending_down_line"></i> 减少百分比</h3><p>(旧值 - 新值) / 旧值 × 100%</p></div>
      <div class="field"><label>旧值</label><input type="number" id="d1" placeholder="例如 100"></div>
      <div class="field"><label>新值</label><input type="number" id="d2" placeholder="例如 75"></div>
      <div class="actions"><button class="btn" id="calcDecline"><i class="mgc_arrow_right_circle_line"></i> 计算减少</button></div>
      <div class="result-box" id="resDecline" style="display:none;"><span class="big" id="valDecline"></span></div>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
(function() {
  'use strict';

  function getNum(id) { var v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; }

  document.getElementById('calcRatio').addEventListener('click', function() {
    var a = getNum('p1'), b = getNum('p2');
    if (a === null || b === null || b === 0) { Toolbox.showToast('请输入有效的数值（整体不能为0）'); return; }
    var r = Toolbox.fmtNum(a / b * 100);
    document.getElementById('valRatio').textContent = r + '%';
    document.getElementById('resRatio').style.display = '';
  });

  document.getElementById('calcGrowth').addEventListener('click', function() {
    var oldv = getNum('g1'), newv = getNum('g2');
    if (oldv === null || newv === null || oldv === 0) { Toolbox.showToast('请输入有效的数值（旧值不能为0）'); return; }
    var r = Toolbox.fmtNum((newv - oldv) / oldv * 100);
    document.getElementById('valGrowth').textContent = (r > 0 ? '+' : '') + r + '%';
    document.getElementById('resGrowth').style.display = '';
  });

  document.getElementById('calcDecline').addEventListener('click', function() {
    var oldv = getNum('d1'), newv = getNum('d2');
    if (oldv === null || newv === null || oldv === 0) { Toolbox.showToast('请输入有效的数值（旧值不能为0）'); return; }
    var r = Toolbox.fmtNum((oldv - newv) / oldv * 100);
    document.getElementById('valDecline').textContent = r + '%';
    document.getElementById('resDecline').style.display = '';
  });
})();
</script>
</body>
</html>
