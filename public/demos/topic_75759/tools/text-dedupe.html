<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本去重</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mingcute_icon@2.9.72/font/Mingcute.min.css">
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="container">
  <div class="card">
    <div class="tool-header">
      <h2><i class="mgc_scissors_line"></i> 文本去重</h2>
      <p>按行去重，保留原始出现顺序</p>
    </div>
    <textarea id="input" placeholder="每行一条内容，重复行将被保留首次出现…"></textarea>
    <div class="actions">
      <button class="btn" id="dedupeBtn"><i class="mgc_sparkles_line"></i> 去重</button>
      <button class="btn secondary" id="clearBtn"><i class="mgc_delete_2_line"></i> 清空</button>
    </div>
    <div class="info" id="info"></div>
  </div>
  <div class="card" id="resultCard" style="display:none;">
    <div class="tool-header">
      <h2><i class="mgc_copy_2_line"></i> 去重结果</h2>
    </div>
    <textarea id="output" readonly></textarea>
    <div class="actions">
      <button class="btn" id="copyBtn"><i class="mgc_copy_2_line"></i> 复制结果</button>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
(function() {
  'use strict';
  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var resultCard = document.getElementById('resultCard');
  var info = document.getElementById('info');

  document.getElementById('dedupeBtn').addEventListener('click', function() {
    var text = input.value;
    if (!text.trim()) { Toolbox.showToast('请输入内容'); return; }
    var lines = text.split(/\r\n|\r|\n/);
    var seen = {};
    var out = [];
    lines.forEach(function(line) {
      if (!seen.hasOwnProperty(line)) { seen[line] = true; out.push(line); }
    });
    output.value = out.join('\n');
    resultCard.style.display = '';
    info.textContent = '原 ' + lines.length + ' 行 → 去重后 ' + out.length + ' 行，合并 ' + (lines.length - out.length) + ' 行';
  });

  document.getElementById('clearBtn').addEventListener('click', function() {
    input.value = ''; output.value = ''; resultCard.style.display = 'none'; info.textContent = ''; Toolbox.showToast('已清空');
  });

  document.getElementById('copyBtn').addEventListener('click', function() {
    Toolbox.copyText(output.value, '已复制到剪贴板');
  });
})();
</script>
</body>
</html>
