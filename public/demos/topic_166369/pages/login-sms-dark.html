<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录-短信验证码 - 深色模式</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

/* @group-priority: primary, success, warning, error, info */

:root {
  /* primary */
  --tuke-v52-primary-50: #f0faf9; /* AI-generated */
  --tuke-v52-primary-100: #d9f0ee; /* AI-generated */
  --tuke-v52-primary-200: #b3e0dc; /* AI-generated */
  --tuke-v52-primary-300: #85c9c3; /* AI-generated */
  --tuke-v52-primary-400: #57aaa3; /* AI-generated */
  --tuke-v52-primary-500: #3a8a85; /* AI-generated */
  --tuke-v52-primary-600: #2d716c; /* AI-generated */ /* @primary */
  --tuke-v52-primary-700: #245a56; /* AI-generated */
  --tuke-v52-primary-800: #1a403d; /* AI-generated */
  --tuke-v52-primary-900: #0a1f1e; /* AI-generated */

  /* neutral */
  --tuke-v52-neutral-50: #fdfcfa; /* AI-generated */
  --tuke-v52-neutral-100: #f8f5f0; /* AI-generated */
  --tuke-v52-neutral-200: #ede8e0; /* AI-generated */
  --tuke-v52-neutral-300: #d9d2c7; /* AI-generated */
  --tuke-v52-neutral-400: #b5aba0; /* AI-generated */
  --tuke-v52-neutral-500: #928a80; /* AI-generated */ /* @primary */
  --tuke-v52-neutral-600: #756e65; /* AI-generated */
  --tuke-v52-neutral-700: #5c5650; /* AI-generated */
  --tuke-v52-neutral-800: #3d3936; /* AI-generated */
  --tuke-v52-neutral-900: #2a2725; /* AI-generated */

  /* success */
  --tuke-v52-success-50: #f0f5f0; /* AI-generated */
  --tuke-v52-success-100: #dce8dc; /* AI-generated */
  --tuke-v52-success-200: #b8d2b8; /* AI-generated */
  --tuke-v52-success-300: #90b890; /* AI-generated */
  --tuke-v52-success-400: #6a9a6a; /* AI-generated */
  --tuke-v52-success-500: #4d7d4d; /* AI-generated */
  --tuke-v52-success-600: #3a663a; /* AI-generated */ /* @primary */
  --tuke-v52-success-700: #2d4f2d; /* AI-generated */
  --tuke-v52-success-800: #243a2c; /* AI-generated */
  --tuke-v52-success-900: #1a3d2e; /* AI-generated */

  /* warning */
  --tuke-v52-warning-50: #faf6f0; /* AI-generated */
  --tuke-v52-warning-100: #f0e6d4; /* AI-generated */
  --tuke-v52-warning-200: #e0cca8; /* AI-generated */
  --tuke-v52-warning-300: #cbae78; /* AI-generated */
  --tuke-v52-warning-400: #b08d4e; /* AI-generated */
  --tuke-v52-warning-500: #94743a; /* AI-generated */
  --tuke-v52-warning-600: #785c2e; /* AI-generated */ /* @primary */
  --tuke-v52-warning-700: #5e4825; /* AI-generated */
  --tuke-v52-warning-800: #523d20; /* AI-generated */
  --tuke-v52-warning-900: #4a3520; /* AI-generated */

  /* error */
  --tuke-v52-error-50: #f8f2f0; /* AI-generated */
  --tuke-v52-error-100: #ecd9d3; /* AI-generated */
  --tuke-v52-error-200: #d8b3a8; /* AI-generated */
  --tuke-v52-error-300: #c08a7c; /* AI-generated */
  --tuke-v52-error-400: #a36656; /* AI-generated */
  --tuke-v52-error-500: #884d3e; /* AI-generated */
  --tuke-v52-error-600: #6e3d31; /* AI-generated */ /* @primary */
  --tuke-v52-error-700: #582f26; /* AI-generated */
  --tuke-v52-error-800: #48271f; /* AI-generated */
  --tuke-v52-error-900: #3d1f1a; /* AI-generated */

  /* info */
  --tuke-v52-info-50: #f0f4f8; /* AI-generated */
  --tuke-v52-info-100: #d4dfeb; /* AI-generated */
  --tuke-v52-info-200: #a8bfd6; /* AI-generated */
  --tuke-v52-info-300: #7c9bbe; /* AI-generated */
  --tuke-v52-info-400: #5478a3; /* AI-generated */
  --tuke-v52-info-500: #3a5e88; /* AI-generated */
  --tuke-v52-info-600: #2e4a6e; /* AI-generated */ /* @primary */
  --tuke-v52-info-700: #263a58; /* AI-generated */
  --tuke-v52-info-800: #1f3045; /* AI-generated */
  --tuke-v52-info-900: #1a2a3d; /* AI-generated */

  /* text */
  --foreground: #2a2725; /* AI-generated */ /* @primary */
  --foreground-secondary: #5c5650; /* AI-generated */
  --foreground-tertiary: #b5aba0; /* AI-generated */
  --muted-foreground: #928a80; /* AI-generated */

  /* surface */
  --background: #fdfcfa; /* AI-generated */ /* @primary */
  --surface: #ffffff; /* AI-generated */
  --surface-dim: #f8f5f0; /* AI-generated */
  --surface-container-low: #f8f5f0; /* AI-generated */
  --surface-container: #f2eee8; /* AI-generated */
  --surface-container-high: #ede8e0; /* AI-generated */
  --card: #ffffff; /* AI-generated */

  /* border */
  --border-light: #f2eee8; /* AI-generated */
  --border: #ede8e0; /* AI-generated */ /* @primary */
  --border-strong: #d9d2c7; /* AI-generated */

  /* Semantic aliases */
  --primary: var(--tuke-v52-primary-600); /* AI-generated */
  --primary-foreground: #ffffff; /* AI-generated */
  --accent: var(--tuke-v52-primary-500); /* AI-generated */
  --accent-hover: var(--tuke-v52-primary-700); /* AI-generated */
  --bg: var(--background); /* AI-generated */
  --fg: var(--foreground); /* AI-generated */
  --muted: var(--tuke-v52-neutral-400); /* AI-generated */
  --rule: var(--border); /* AI-generated */
  --link: var(--tuke-v52-primary-600); /* AI-generated */
  --ring: #3a8a85; /* AI-generated */
  --error: var(--tuke-v52-error-600); /* AI-generated */
  --success: var(--tuke-v52-success-600); /* AI-generated */
  --warning: var(--tuke-v52-warning-600); /* AI-generated */
  --info: var(--tuke-v52-info-600); /* AI-generated */

  /* Typography */
  --font-display: 'Outfit', 'Noto Sans SC', sans-serif;
  --font-heading: 'Outfit', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', 'Outfit', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-size-display: 48px; --font-size-h1: 36px; --font-size-h2: 28px; --font-size-h3: 22px;
  --font-size-h4: 18px; --font-size-body: 14px; --font-size-lead: 16px; --font-size-caption: 12px;
  --font-size-eyebrow: 11px; --font-size-mono: 13px;
  --font-weight-display: 600; --font-weight-h1: 600; --font-weight-h2: 600; --font-weight-h3: 500;
  --font-weight-h4: 500; --font-weight-body: 400; --font-weight-lead: 400; --font-weight-caption: 400;
  --font-weight-eyebrow: 600; --font-weight-mono: 400;
  --line-height-display: 1.15; --line-height-h1: 1.25; --line-height-h2: 1.3; --line-height-h3: 1.4;
  --line-height-h4: 1.45; --line-height-body: 1.6; --line-height-lead: 1.6; --line-height-caption: 1.5;
  --line-height-eyebrow: 1.4; --line-height-mono: 1.6;

  /* Spacing */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;

  /* Size */
  --size-button-sm: 32px; --size-button-md: 40px; --size-button-lg: 48px; --size-input: 36px;
  --size-icon-sm: 16px; --size-icon-md: 20px; --size-icon-lg: 24px;

  /* Radius */
  --radius-sm: 2px; --radius-md: 4px; --radius-lg: 6px; --radius-xl: 8px; --radius-full: 9999px;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(42,39,37,0.06); /* Card */
  --shadow-2: 0 2px 6px -1px rgba(42,39,37,0.08); /* Card Hover */
  --shadow-3: 0 6px 16px -4px rgba(42,39,37,0.12); /* Float */
  --shadow-4: 0 12px 32px -8px rgba(42,39,37,0.18); /* Modal */
  --shadow-5: 0 20px 48px -12px rgba(42,39,37,0.24); /* Overlay */

  /* Layout */
  --sidebar-width: 240px; --nav-height: 56px; --max-content: 1280px;

  /* Portable aliases */
  --color-primary: var(--primary); --color-primary-hover: var(--accent-hover); --color-on-primary: var(--primary-foreground);
  --color-background: var(--background); --color-foreground: var(--foreground); --color-surface: var(--surface);
  --color-surface-dim: var(--surface-dim); --color-surface-container: var(--surface-container); --color-card: var(--card);
  --color-muted-foreground: var(--muted-foreground); --color-border: var(--border); --color-border-strong: var(--border-strong);
  --color-success: var(--success); --color-warning: var(--warning); --color-error: var(--error); --color-info: var(--info);
  --color-ring: var(--ring); --type-display: var(--font-size-display); --type-h1: var(--font-size-h1);
  --type-body: var(--font-size-body); --font-family-base: var(--font-body);
}

.dark {
  --foreground: #f0ece6; /* AI-generated */
  --foreground-secondary: #d9d2c7; /* AI-generated */
  --foreground-tertiary: #928a80; /* AI-generated */
  --muted-foreground: #b5aba0; /* AI-generated */
  --background: #1a1816; /* AI-generated */
  --surface: #242120; /* AI-generated */
  --surface-dim: #0d0d0d; /* AI-generated */
  --surface-container-low: #2a2725; /* AI-generated */
  --surface-container: #322f2c; /* AI-generated */
  --surface-container-high: #3d3936; /* AI-generated */
  --card: #242120; /* AI-generated */
  --border-light: #2a2725; /* AI-generated */
  --border: #3d3a37; /* AI-generated */
  --border-strong: #5c5650; /* AI-generated */
  --ring: #5ba8a3; /* AI-generated */
  --primary: var(--tuke-v52-primary-500); --accent: var(--tuke-v52-primary-400);
  --bg: var(--background); --fg: var(--foreground); --muted: var(--tuke-v52-neutral-600); --rule: var(--border);
  --shadow-1: 0 1px 2px rgba(0,0,0,0.40); /* Card */
  --shadow-2: 0 2px 6px -1px rgba(0,0,0,0.48); /* Card Hover */
  --shadow-3: 0 6px 16px -4px rgba(0,0,0,0.56); /* Float */
  --shadow-4: 0 12px 32px -8px rgba(0,0,0,0.64); /* Modal */
  --shadow-5: 0 20px 48px -12px rgba(0,0,0,0.72); /* Overlay */
}

.tuke-display { font-family: var(--font-display); font-size: 3rem; font-weight: var(--font-weight-display); line-height: var(--line-height-display); letter-spacing: -0.01em; }
.tuke-h1 { font-family: var(--font-heading); font-size: 2.25rem; font-weight: var(--font-weight-h1); line-height: var(--line-height-h1); }
.tuke-h2 { font-family: var(--font-heading); font-size: 1.75rem; font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); }
.tuke-h3 { font-family: var(--font-heading); font-size: 1.375rem; font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); }
.tuke-h4 { font-family: var(--font-heading); font-size: 1.125rem; font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); }
.tuke-body { font-family: var(--font-body); font-size: 1rem; font-weight: var(--font-weight-body); line-height: var(--line-height-body); }
.tuke-lead { font-family: var(--font-body); font-size: 1.125rem; font-weight: var(--font-weight-lead); line-height: var(--line-height-lead); }
.tuke-caption { font-family: var(--font-body); font-size: 0.75rem; font-weight: var(--font-weight-caption); line-height: var(--line-height-caption); }
.tuke-eyebrow { font-family: var(--font-body); font-size: 0.6875rem; font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; }
.tuke-mono { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: var(--font-weight-mono); line-height: var(--line-height-mono); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--muted-foreground);
  }
  @layer base {
    body { background: var(--muted-background); color: var(--muted-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="flex min-h-screen w-screen flex-col overflow-y-auto md:h-screen md:flex-row md:overflow-hidden" style="background: var(--background);">
      <!-- LEFT PANEL: Brand area (45%) -->
      <div class="relative hidden md:flex md:flex-col md:justify-center md:overflow-hidden md:w-[45%]" style="background: linear-gradient(135deg, var(--tuke-v52-primary-600) 0%, var(--tuke-v52-primary-800) 100%);">
        <!-- Decorative blueprint line pattern -->
        <svg class="pointer-events-none absolute inset-0 h-full w-full" style="opacity: 0.1;">
          <defs>
            <pattern id="blueprintPattern" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
              <path d="M0,48 L48,0" fill="none" style="stroke: var(--primary-foreground); stroke-width: 0.5;"/>
              <path d="M0,0 L48,48" fill="none" style="stroke: var(--primary-foreground); stroke-width: 0.5;"/>
              <path d="M24,0 L24,48" fill="none" style="stroke: var(--primary-foreground); stroke-width: 0.5;"/>
              <path d="M0,24 L48,24" fill="none" style="stroke: var(--primary-foreground); stroke-width: 0.5;"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#blueprintPattern)"/>
        </svg>

        <!-- V5.2 badge -->
        <div class="absolute" style="top: 32px; right: 32px;">
          <span class="badge" style="background: rgba(255,255,255,0.15); color: var(--primary-foreground);">V5.2</span>
        </div>

        <!-- Brand content -->
        <div class="relative px-12">
          <!-- Logo (white) -->
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" class="mb-8">
            <rect x="3" y="3" width="15" height="15" rx="2" style="stroke: var(--primary-foreground); stroke-width: 2;"/>
            <rect x="22" y="3" width="15" height="15" rx="2" style="stroke: var(--primary-foreground); stroke-width: 2;"/>
            <rect x="3" y="22" width="15" height="15" rx="2" style="stroke: var(--primary-foreground); stroke-width: 2;"/>
            <rect x="22" y="22" width="15" height="15" rx="2" style="fill: var(--primary-foreground); fill-opacity: 0.2; stroke: var(--primary-foreground); stroke-width: 2;"/>
          </svg>

          <!-- Brand name -->
          <h1 style="font-family: var(--font-display); font-size: 48px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; color: var(--primary-foreground);">图客</h1>

          <!-- Tagline -->
          <p style="font-family: var(--font-body); font-size: var(--font-size-lead); color: var(--primary-foreground); margin-top: var(--space-3); line-height: 1.6; opacity: 0.9;">设计师的沟通协作平台</p>

          <!-- Accent line -->
          <div style="width: 40px; height: 2px; background: var(--primary-foreground); margin-top: var(--space-6); border-radius: var(--radius-sm); opacity: 0.6;"></div>
        </div>

        <!-- Footer -->
        <div class="absolute bottom-8 left-12 right-12">
          <p style="font-family: var(--font-body); font-size: var(--font-size-caption); color: var(--primary-foreground); opacity: 0.6;">图客 V5.2 · 设计师沟通协作 SaaS 平台</p>
        </div>
      </div>

      <!-- RIGHT PANEL: Login form (55%) -->
      <div class="flex w-full items-center justify-center md:w-[55%]" style="background: var(--surface); padding: var(--space-8);">
        <!-- Login form card -->
        <div style="width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-1); padding: var(--space-8);">
          <!-- Title -->
          <h2 style="font-family: var(--font-heading); font-size: var(--font-size-h2); font-weight: 600; line-height: 1.3; color: var(--foreground); margin-bottom: var(--space-6);">欢迎回来</h2>

          <!-- Tab switch -->
          <div class="flex gap-8" style="border-bottom: 1px solid var(--border); margin-bottom: var(--space-6);">
            <button class="pb-3 transition-colors motion-reduce:transition-none" style="font-family: var(--font-body); font-size: var(--font-size-body); font-weight: 500; color: var(--primary); background: transparent; cursor: pointer; border: none; border-bottom: 2px solid var(--primary); margin-bottom: -1px;">短信验证码</button>
            <button data-dom-id="tab-invite" class="pb-3 transition-colors motion-reduce:transition-none" style="font-family: var(--font-body); font-size: var(--font-size-body); font-weight: 400; color: var(--muted-foreground); background: transparent; cursor: pointer; border: none;">邀请码</button>
          </div>

          <!-- Phone input -->
          <div style="margin-bottom: var(--space-4);">
            <label style="display: block; font-family: var(--font-body); font-size: var(--font-size-caption); color: var(--foreground-secondary); margin-bottom: var(--space-2);">手机号</label>
            <div class="field-focus flex items-center transition-colors motion-reduce:transition-none" style="height: var(--size-input); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);">
              <span class="inline-flex shrink-0 items-center" style="padding: 0 var(--space-3); height: 100%; color: var(--foreground-secondary); font-family: var(--font-body); font-size: var(--font-size-body); border-right: 1px solid var(--border); white-space: nowrap;">+86</span>
              <input type="tel" placeholder="请输入手机号" maxlength="11" autocomplete="tel" class="min-w-0 flex-1 border-0 bg-transparent focus:outline-none" style="height: 100%; padding: 0 var(--space-3); font-family: var(--font-body); font-size: var(--font-size-body); color: var(--foreground);" />
            </div>
          </div>

          <!-- SMS code input -->
          <div style="margin-bottom: var(--space-6);">
            <label style="display: block; font-family: var(--font-body); font-size: var(--font-size-caption); color: var(--foreground-secondary); margin-bottom: var(--space-2);">验证码</label>
            <div class="flex items-center gap-2">
              <input type="text" placeholder="请输入验证码" maxlength="6" autocomplete="one-time-code" class="field-focus min-w-0 flex-1 transition-colors motion-reduce:transition-none" style="height: var(--size-input); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); padding: 0 var(--space-3); font-family: var(--font-body); font-size: var(--font-size-body); color: var(--foreground);" />
              <button class="btn-sms shrink-0 bg-transparent transition-colors motion-reduce:transition-none" style="height: var(--size-input); padding: 0 var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--info); font-family: var(--font-body); font-size: var(--font-size-caption); white-space: nowrap; cursor: pointer;" onmouseover="this.style.background='var(--surface-container)'" onmouseout="this.style.background='transparent'">获取验证码</button>
            </div>
          </div>

          <!-- Login button -->
          <button data-dom-id="btn-login" class="w-full transition-colors motion-reduce:transition-none" style="height: var(--size-button-md); border: none; border-radius: var(--radius-sm); background: var(--primary); color: var(--primary-foreground); font-family: var(--font-body); font-size: var(--font-size-body); font-weight: 500; cursor: pointer;" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--primary)'">登录</button>

          <!-- Footer -->
          <div class="text-center" style="margin-top: var(--space-6);">
            <span style="font-family: var(--font-body); font-size: var(--font-size-caption); color: var(--muted-foreground);">还没账号？</span>
            <a href="#" class="transition-colors motion-reduce:transition-none" style="font-family: var(--font-body); font-size: var(--font-size-caption); color: var(--link); text-decoration: none; margin-left: var(--space-1);" onmouseover="this.style.color='var(--accent-hover)'" onmouseout="this.style.color='var(--link)'">立即注册</a>
          </div>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-sm); font-family: var(--font-body); font-size: var(--font-size-caption); font-weight: 500; line-height: 1.5; white-space: nowrap; }
      .badge-success { background: var(--tuke-v52-success-100); color: var(--success); }
      .badge-warning { background: var(--tuke-v52-warning-100); color: var(--warning); }
