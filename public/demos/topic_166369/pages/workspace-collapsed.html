.nav-item:hover { background: var(--surface-container-low); }
.nav-item.active { background: var(--surface-container-low); color: var(--color-foreground); border-left-color: var(--color-primary); }
.nav-item:focus-visible { outline: 2px solid var(--color-ring); outline-offset: -2px; }
.nav-tabs { flex: 1; display: flex; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.nav-tab { display: flex; align-items: center; padding: var(--space-3) var(--space-4); font-size: var(--font-size-body); color: var(--foreground-secondary); border-bottom: 2px solid transparent; transition: background .15s; cursor: pointer; white-space: nowrap; text-decoration: none; margin-bottom: -1px; }
.nav-tab:hover { background: var(--surface-container-low); }
.nav-tab.active { color: var(--color-foreground); border-bottom-color: var(--color-primary); }
.nav-tab:focus-visible { outline: 2px solid var(--color-ring); outline-offset: -2px; }

/* ── Table ─────────────────────────────────────────────────── */
/* @anatomy
   <span class="label">默认</span>
*/
.tbl { width: 100%; border-collapse: collapse; font-size: var(--font-size-body); }
.tbl th { text-align: left; font-weight: 500; color: var(--foreground-secondary); background: var(--surface-container-low); padding: var(--space-3) var(--space-4); white-space: nowrap; }
.tbl td { text-align: left; color: var(--foreground); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-light); white-space: nowrap; }
.tbl tbody tr:hover td { background: var(--surface-container-low); }
.tbl .col-check { width: 40px; }
.tbl .row-selected td:first-child { box-shadow: inset 2px 0 0 var(--primary); }
.badge { display: inline-block; font-size: var(--font-size-caption); padding: 2px var(--space-2); border-radius: var(--radius-sm); line-height: 1.4; white-space: nowrap; }
.badge-success { color: var(--success); background: color-mix(in srgb, var(--success) 12%, var(--surface)); }
.badge-warning { color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, var(--surface)); }
.action-link { color: var(--link); background: none; border: none; cursor: pointer; font-size: var(--font-size-body); padding: 0; font-family: inherit; transition: color .15s; }
.action-link:hover { color: var(--accent-hover); }
.action-link + .action-link { margin-left: var(--space-3); }
.checkbox { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; margin: 0; }

<body class="min-h-screen font-sans antialiased">

              </button>
              <!-- Inactive: voice -->
              <button data-dom-id="ann-voice" data-hover="tool" class="flex items-center justify-center" style="width: 36px; height: 36px; background: transparent; color: var(--foreground-secondary); border-radius: var(--radius-sm); border: none; cursor: pointer; flex-shrink: 0;" aria-label="语音">
                <i data-lucide="mic" style="width: var(--size-icon-md); height: var(--size-icon-md);"></i>
              </button>
              <!-- Inactive: pan -->
              <button data-dom-id="ann-pan" data-hover="tool" class="flex items-center justify-center" style="width: 36px; height: 36px; background: transparent; color: var(--foreground-secondary); border-radius: var(--radius-sm); border: none; cursor: pointer; flex-shrink: 0;" aria-label="平移">
                <i data-lucide="hand" style="width: var(--size-icon-md); height: var(--size-icon-md);"></i>
              </button>
            </div>
          </div>

          <!-- Bottom status bar (32px) -->
          <div class="flex items-center justify-between flex-shrink-0" style="height: 32px; border-top: 1px solid var(--border); background: var(--surface); padding: 0 var(--space-4);">
            <span style="font-family: var(--font-mono); font-size: var(--font-size-caption); color: var(--muted-foreground); white-space: nowrap;">X: 1024.5  Y: 768.3</span>
            <span style="font-family: var(--font-mono); font-size: var(--font-size-caption); color: var(--muted-foreground); white-space: nowrap;">100%</span>
          </div>
        </div>

        <!-- ==================== COLUMN 3: RIGHT DRAWER (320px) ==================== -->
        <aside class="flex flex-col flex-shrink-0" style="width: 320px; background: var(--surface); border-left: 1px solid var(--border);">

          <!-- Tab bar (40px): 消息 | 待办 | 人才库 | 选型 -->
          <nav class="flex" style="height: 40px; border-bottom: 1px solid var(--border);">
            <a class="nav-tab active" style="flex: 1; justify-content: center; height: 40px; padding: 0;">消息</a>
            <a class="nav-tab" data-dom-id="tab-todo" style="flex: 1; justify-content: center; height: 40px; padding: 0;">待办</a>
            <a class="nav-tab" data-dom-id="tab-talent" style="flex: 1; justify-content: center; height: 40px; padding: 0;">人才库</a>
            <a class="nav-tab" data-dom-id="tab-selection" style="flex: 1; justify-content: center; height: 40px; padding: 0;">选型</a>
          </nav>

          <!-- Message list (scrollable, flex-1) -->
          <div class="flex-1 overflow-y-auto no-scrollbar" style="padding: var(--space-2);">

            <!-- Message 1: 李总 -->
            <div data-hover="row" style="padding: var(--space-3); border-radius: var(--radius-md); border-left: 2px solid var(--primary);">
              <div class="flex items-center" style="gap: var(--space-2); margin-bottom: var(--space-1);">
                <div class="flex items-center justify-center flex-shrink-0" style="width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--surface-container); border: 1px solid var(--border);">
                  <span style="font-size: var(--font-size-caption); color: var(--foreground-secondary); font-weight: 600;">李</span>
                </div>
                <span class="truncate flex-1 min-w-0" style="font-size: var(--font-size-body); color: var(--foreground);">李总</span>
                <span class="flex-shrink-0" style="font-size: var(--font-size-caption); color: var(--muted-foreground);">09:32</span>
              </div>
              <p class="truncate" style="font-size: var(--font-size-caption); color: var(--foreground-secondary); padding-left: 36px; margin: 0;">这个区域的设备需要调整</p>
            </div>

            <!-- Message 2: 王工 -->
            <div data-hover="row" style="padding: var(--space-3); border-radius: var(--radius-md); border-left: 2px solid var(--info);">
              <div class="flex items-center" style="gap: var(--space-2); margin-bottom: var(--space-1);">
                <div class="flex items-center justify-center flex-shrink-0" style="width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--surface-container); border: 1px solid var(--border);">
                  <span style="font-size: var(--font-size-caption); color: var(--foreground-secondary); font-weight: 600;">王</span>
                </div>
                <span class="truncate flex-1 min-w-0" style="font-size: var(--font-size-body); color: var(--foreground);">王工</span>
                <span class="flex-shrink-0" style="font-size: var(--font-size-caption); color: var(--muted-foreground);">08:15</span>
              </div>
              <p class="truncate" style="font-size: var(--font-size-caption); color: var(--foreground-secondary); padding-left: 36px; margin: 0;">图纸已更新到V3版本</p>
            </div>

            <!-- Message 3: 系统 -->
            <div data-hover="row" style="padding: var(--space-3); border-radius: var(--radius-md); border-left: 2px solid var(--primary);">
              <div class="flex items-center" style="gap: var(--space-2); margin-bottom: var(--space-1);">
                <div class="flex items-center justify-center flex-shrink-0" style="width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--surface-container); border: 1px solid var(--border);">
                  <span style="font-size: var(--font-size-caption); color: var(--foreground-secondary); font-weight: 600;">系</span>
                </div>
                <span class="truncate flex-1 min-w-0" style="font-size: var(--font-size-body); color: var(--foreground);">系统</span>
                <span class="flex-shrink-0" style="font-size: var(--font-size-caption); color: var(--muted-foreground);">07:50</span>
              </div>
              <p class="truncate" style="font-size: var(--font-size-caption); color: var(--foreground-secondary); padding-left: 36px; margin: 0;">项目会议15分钟后开始</p>
            </div>

            <!-- Message 4: 赵工 -->
            <div data-hover="row" style="padding: var(--space-3); border-radius: var(--radius-md); border-left: 2px solid var(--info);">
              <div class="flex items-center" style="gap: var(--space-2); margin-bottom: var(--space-1);">
                <div class="flex items-center justify-center flex-shrink-0" style="width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--surface-container); border: 1px solid var(--border);">
                  <span style="font-size: var(--font-size-caption); color: var(--foreground-secondary); font-weight: 600;">赵</span>
                </div>
                <span class="truncate flex-1 min-w-0" style="font-size: var(--font-size-body); color: var(--foreground);">赵工</span>
                <span class="flex-shrink-0" style="font-size: var(--font-size-caption); color: var(--muted-foreground);">昨日</span>
              </div>
              <p class="truncate" style="font-size: var(--font-size-caption); color: var(--foreground-secondary); padding-left: 36px; margin: 0;">选型报告已生成</p>
            </div>

            <!-- Message 5: 陈工 -->
            <div data-hover="row" style="padding: var(--space-3); border-radius: var(--radius-md); border-left: 2px solid var(--primary);">
              <div class="flex items-center" style="gap: var(--space-2); margin-bottom: var(--space-1);">
                <div class="flex items-center justify-center flex-shrink-0" style="width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--surface-container); border: 1px solid var(--border);">
                  <span style="font-size: var(--font-size-caption); color: var(--foreground-secondary); font-weight: 600;">陈</span>
                </div>
                <span class="truncate flex-1 min-w-0" style="font-size: var(--font-size-body); color: var(--foreground);">陈工</span>
                <span class="flex-shrink-0" style="font-size: var(--font-size-caption); color: var(--muted-foreground);">昨日</span>
              </div>
              <p class="truncate" style="font-size: var(--font-size-caption); color: var(--foreground-secondary); padding-left: 36px; margin: 0;">新增了3个待审核设备</p>
            </div>

          </div>

          <!-- Bottom action bar (56px): 会议 | 比选 -->
          <div class="flex items-center flex-shrink-0" style="height: var(--nav-height); border-top: 1px solid var(--border); padding: 0 var(--space-4); gap: var(--space-2);">
            <button class="btn btn-primary" data-dom-id="btn-meeting" style="flex: 1; box-sizing: border-box;">会议</button>
            <button class="btn btn-secondary" data-dom-id="btn-compare" style="flex: 1; box-sizing: border-box; background: var(--tuke-v52-primary-50);">比选</button>

          </div>
        </aside>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
