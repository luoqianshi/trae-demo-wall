<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端-首页</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

/* @group-priority: primary, success, warning, error, info */

:root {
  /* primary */
  --tuke-v52-primary-50: #f0faf9; /* AI-generated */
  --tuke-v52-primary-100: #d9f0ee; /* AI-generated */
  --tuke-v52-primary-200: #b3e0dc; /* AI-generated */
  --tuke-v52-primary-300: #85c9c3; /* AI-generated */
  --tuke-v52-primary-400: #57aaa3; /* AI-generated */
  --tuke-v52-primary-500: #3a8a85; /* AI-generated */
  --tuke-v52-primary-600: #2d716c; /* AI-generated */ /* @primary */
  --tuke-v52-primary-700: #245a56; /* AI-generated */
  --tuke-v52-primary-800: #1a403d; /* AI-generated */
  --tuke-v52-primary-900: #0a1f1e; /* AI-generated */

  /* neutral */
  --tuke-v52-neutral-50: #fdfcfa; /* AI-generated */
  --tuke-v52-neutral-100: #f8f5f0; /* AI-generated */
  --tuke-v52-neutral-200: #ede8e0; /* AI-generated */
  --tuke-v52-neutral-300: #d9d2c7; /* AI-generated */
  --tuke-v52-neutral-400: #b5aba0; /* AI-generated */
  --tuke-v52-neutral-500: #928a80; /* AI-generated */ /* @primary */
  --tuke-v52-neutral-600: #756e65; /* AI-generated */
  --tuke-v52-neutral-700: #5c5650; /* AI-generated */
  --tuke-v52-neutral-800: #3d3936; /* AI-generated */
  --tuke-v52-neutral-900: #2a2725; /* AI-generated */

  /* success */
  --tuke-v52-success-50: #f0f5f0; /* AI-generated */
  --tuke-v52-success-100: #dce8dc; /* AI-generated */
  --tuke-v52-success-200: #b8d2b8; /* AI-generated */
  --tuke-v52-success-300: #90b890; /* AI-generated */
  --tuke-v52-success-400: #6a9a6a; /* AI-generated */
  --tuke-v52-success-500: #4d7d4d; /* AI-generated */
  --tuke-v52-success-600: #3a663a; /* AI-generated */ /* @primary */
  --tuke-v52-success-700: #2d4f2d; /* AI-generated */
  --tuke-v52-success-800: #243a2c; /* AI-generated */
  --tuke-v52-success-900: #1a3d2e; /* AI-generated */

  /* warning */
  --tuke-v52-warning-50: #faf6f0; /* AI-generated */
  --tuke-v52-warning-100: #f0e6d4; /* AI-generated */
  --tuke-v52-warning-200: #e0cca8; /* AI-generated */
  --tuke-v52-warning-300: #cbae78; /* AI-generated */
  --tuke-v52-warning-400: #b08d4e; /* AI-generated */
  --tuke-v52-warning-500: #94743a; /* AI-generated */
  --tuke-v52-warning-600: #785c2e; /* AI-generated */ /* @primary */
  --tuke-v52-warning-700: #5e4825; /* AI-generated */
  --tuke-v52-warning-800: #523d20; /* AI-generated */
  --tuke-v52-warning-900: #4a3520; /* AI-generated */

  /* error */
  --tuke-v52-error-50: #f8f2f0; /* AI-generated */
  --tuke-v52-error-100: #ecd9d3; /* AI-generated */
  --tuke-v52-error-200: #d8b3a8; /* AI-generated */
  --tuke-v52-error-300: #c08a7c; /* AI-generated */
  --tuke-v52-error-400: #a36656; /* AI-generated */
  --tuke-v52-error-500: #884d3e; /* AI-generated */
  --tuke-v52-error-600: #6e3d31; /* AI-generated */ /* @primary */
  --tuke-v52-error-700: #582f26; /* AI-generated */
  --tuke-v52-error-800: #48271f; /* AI-generated */
  --tuke-v52-error-900: #3d1f1a; /* AI-generated */

  /* info */
  --tuke-v52-info-50: #f0f4f8; /* AI-generated */
  --tuke-v52-info-100: #d4dfeb; /* AI-generated */
  --tuke-v52-info-200: #a8bfd6; /* AI-generated */
  --tuke-v52-info-300: #7c9bbe; /* AI-generated */
  --tuke-v52-info-400: #5478a3; /* AI-generated */
  --tuke-v52-info-500: #3a5e88; /* AI-generated */
  --tuke-v52-info-600: #2e4a6e; /* AI-generated */ /* @primary */
  --tuke-v52-info-700: #263a58; /* AI-generated */
  --tuke-v52-info-800: #1f3045; /* AI-generated */
  --tuke-v52-info-900: #1a2a3d; /* AI-generated */

  /* text */
  --foreground: #2a2725; /* AI-generated */ /* @primary */
  --foreground-secondary: #5c5650; /* AI-generated */
  --foreground-tertiary: #b5aba0; /* AI-generated */
  --muted-foreground: #928a80; /* AI-generated */

  /* surface */
  --background: #fdfcfa; /* AI-generated */ /* @primary */
  --surface: #ffffff; /* AI-generated */
  --surface-dim: #f8f5f0; /* AI-generated */
  --surface-container-low: #f8f5f0; /* AI-generated */
  --surface-container: #f2eee8; /* AI-generated */
  --surface-container-high: #ede8e0; /* AI-generated */
  --card: #ffffff; /* AI-generated */

  /* border */
  --border-light: #f2eee8; /* AI-generated */
  --border: #ede8e0; /* AI-generated */ /* @primary */
  --border-strong: #d9d2c7; /* AI-generated */

  /* Semantic aliases */
  --primary: var(--tuke-v52-primary-600); /* AI-generated */
  --primary-foreground: #ffffff; /* AI-generated */
  --accent: var(--tuke-v52-primary-500); /* AI-generated */
  --accent-hover: var(--tuke-v52-primary-700); /* AI-generated */
  --bg: var(--background); /* AI-generated */
  --fg: var(--foreground); /* AI-generated */
  --muted: var(--tuke-v52-neutral-400); /* AI-generated */
  --rule: var(--border); /* AI-generated */
  --link: var(--tuke-v52-primary-600); /* AI-generated */
  --ring: #3a8a85; /* AI-generated */
  --error: var(--tuke-v52-error-600); /* AI-generated */
  --success: var(--tuke-v52-success-600); /* AI-generated */
  --warning: var(--tuke-v52-warning-600); /* AI-generated */
  --info: var(--tuke-v52-info-600); /* AI-generated */

  /* Typography */
  --font-display: 'Outfit', 'Noto Sans SC', sans-serif;
  --font-heading: 'Outfit', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', 'Outfit', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-size-display: 48px; --font-size-h1: 36px; --font-size-h2: 28px; --font-size-h3: 22px;
  --font-size-h4: 18px; --font-size-body: 14px; --font-size-lead: 16px; --font-size-caption: 12px;
  --font-size-eyebrow: 11px; --font-size-mono: 13px;
  --font-weight-display: 600; --font-weight-h1: 600; --font-weight-h2: 600; --font-weight-h3: 500;
  --font-weight-h4: 500; --font-weight-body: 400; --font-weight-lead: 400; --font-weight-caption: 400;
  --font-weight-eyebrow: 600; --font-weight-mono: 400;
  --line-height-display: 1.15; --line-height-h1: 1.25; --line-height-h2: 1.3; --line-height-h3: 1.4;
  --line-height-h4: 1.45; --line-height-body: 1.6; --line-height-lead: 1.6; --line-height-caption: 1.5;
  --line-height-eyebrow: 1.4; --line-height-mono: 1.6;

  /* Spacing */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;

  /* Size */
  --size-button-sm: 32px; --size-button-md: 40px; --size-button-lg: 48px; --size-input: 36px;
  --size-icon-sm: 16px; --size-icon-md: 20px; --size-icon-lg: 24px;

  /* Radius */
  --radius-sm: 2px; --radius-md: 4px; --radius-lg: 6px; --radius-xl: 8px; --radius-full: 9999px;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(42,39,37,0.06); /* Card */
  --shadow-2: 0 2px 6px -1px rgba(42,39,37,0.08); /* Card Hover */
  --shadow-3: 0 6px 16px -4px rgba(42,39,37,0.12); /* Float */
  --shadow-4: 0 12px 32px -8px rgba(42,39,37,0.18); /* Modal */
  --shadow-5: 0 20px 48px -12px rgba(42,39,37,0.24); /* Overlay */

  /* Layout */
  --sidebar-width: 240px; --nav-height: 56px; --max-content: 1280px;

  /* Portable aliases */
  --color-primary: var(--primary); --color-primary-hover: var(--accent-hover); --color-on-primary: var(--primary-foreground);
  --color-background: var(--background); --color-foreground: var(--foreground); --color-surface: var(--surface);
  --color-surface-dim: var(--surface-dim); --color-surface-container: var(--surface-container); --color-card: var(--card);
  --color-muted-foreground: var(--muted-foreground); --color-border: var(--border); --color-border-strong: var(--border-strong);
  --color-success: var(--success); --color-warning: var(--warning); --color-error: var(--error); --color-info: var(--info);
  --color-ring: var(--ring); --type-display: var(--font-size-display); --type-h1: var(--font-size-h1);
  --type-body: var(--font-size-body); --font-family-base: var(--font-body);
}

.dark {
  --foreground: #f0ece6; /* AI-generated */
  --foreground-secondary: #d9d2c7; /* AI-generated */
  --foreground-tertiary: #928a80; /* AI-generated */
  --muted-foreground: #b5aba0; /* AI-generated */
  --background: #1a1816; /* AI-generated */
  --surface: #242120; /* AI-generated */
  --surface-dim: #0d0d0d; /* AI-generated */
  --surface-container-low: #2a2725; /* AI-generated */
  --surface-container: #322f2c; /* AI-generated */
  --surface-container-high: #3d3936; /* AI-generated */
  --card: #242120; /* AI-generated */
  --border-light: #2a2725; /* AI-generated */
  --border: #3d3a37; /* AI-generated */
  --border-strong: #5c5650; /* AI-generated */
  --ring: #5ba8a3; /* AI-generated */
  --primary: var(--tuke-v52-primary-500); --accent: var(--tuke-v52-primary-400);
  --bg: var(--background); --fg: var(--foreground); --muted: var(--tuke-v52-neutral-600); --rule: var(--border);
  --shadow-1: 0 1px 2px rgba(0,0,0,0.40); /* Card */
  --shadow-2: 0 2px 6px -1px rgba(0,0,0,0.48); /* Card Hover */
  --shadow-3: 0 6px 16px -4px rgba(0,0,0,0.56); /* Float */
  --shadow-4: 0 12px 32px -8px rgba(0,0,0,0.64); /* Modal */
  --shadow-5: 0 20px 48px -12px rgba(0,0,0,0.72); /* Overlay */
}

.tuke-display { font-family: var(--font-display); font-size: 3rem; font-weight: var(--font-weight-display); line-height: var(--line-height-display); letter-spacing: -0.01em; }
.tuke-h1 { font-family: var(--font-heading); font-size: 2.25rem; font-weight: var(--font-weight-h1); line-height: var(--line-height-h1); }
.tuke-h2 { font-family: var(--font-heading); font-size: 1.75rem; font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); }
.tuke-h3 { font-family: var(--font-heading); font-size: 1.375rem; font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); }
.tuke-h4 { font-family: var(--font-heading); font-size: 1.125rem; font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); }
.tuke-body { font-family: var(--font-body); font-size: 1rem; font-weight: var(--font-weight-body); line-height: var(--line-height-body); }
.tuke-lead { font-family: var(--font-body); font-size: 1.125rem; font-weight: var(--font-weight-lead); line-height: var(--line-height-lead); }
.tuke-caption { font-family: var(--font-body); font-size: 0.75rem; font-weight: var(--font-weight-caption); line-height: var(--line-height-caption); }
.tuke-eyebrow { font-family: var(--font-body); font-size: 0.6875rem; font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; }
.tuke-mono { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: var(--font-weight-mono); line-height: var(--line-height-mono); }

    </style>
    <style id="component-vars">
.badge { display: inline-block; font-size: var(--font-size-caption); padding: 2px var(--space-2); border-radius: var(--radius-sm); line-height: 1.4; white-space: nowrap; }
.badge-success { color: var(--success); background: color-mix(in srgb, var(--success) 12%, var(--surface)); }
.badge-warning { color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, var(--surface)); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">

  @layer base {
    body { background: var(--background); color: var(--foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen overflow-x-hidden pb-20" style="background: var(--background);">
      <!-- HEADER: Teal gradient with user info, greeting, stat cards -->
      <header class="pt-6 px-4 pb-10" style="background: linear-gradient(135deg, var(--tuke-v52-primary-600), var(--tuke-v52-primary-800));">
        <!-- Top row: avatar + name + role -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background: var(--primary-foreground); border: 2px solid var(--primary-foreground);">
            <span style="font-family: var(--font-heading); font-size: var(--font-size-body); font-weight: 500; color: var(--primary);">张</span>
          </div>
          <div class="flex flex-col min-w-0 gap-1">
            <span class="truncate" style="font-size: var(--font-size-body); color: var(--primary-foreground); font-weight: 500;">张工</span>
            <span class="truncate" style="font-size: var(--font-size-caption); color: color-mix(in srgb, var(--primary-foreground) 80%, transparent);">建筑师</span>
          </div>
        </div>
        <!-- Greeting -->
        <h1 class="mt-4" style="font-family: var(--font-display); font-size: var(--font-size-h3); font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); color: var(--primary-foreground); text-wrap: balance; word-break: keep-all;">下午好</h1>
        <!-- Stat cards row -->
        <div class="flex gap-3 mt-4">
          <div class="flex-1 flex flex-col rounded-[var(--radius-md)] p-3" style="background: color-mix(in srgb, var(--primary-foreground) 15%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border-left: 3px solid var(--primary);">
            <span style="font-family: var(--font-display); font-size: var(--font-size-h3); font-weight: var(--font-weight-h3); line-height: 1.2; color: var(--primary-foreground); font-variant-numeric: tabular-nums;">12</span>
            <span style="font-size: var(--font-size-caption); color: color-mix(in srgb, var(--primary-foreground) 80%, transparent);">协作记录</span>
          </div>
          <div class="flex-1 flex flex-col rounded-[var(--radius-md)] p-3" style="background: color-mix(in srgb, var(--primary-foreground) 15%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border-left: 3px solid var(--warning);">
            <span style="font-family: var(--font-display); font-size: var(--font-size-h3); font-weight: var(--font-weight-h3); line-height: 1.2; color: var(--primary-foreground); font-variant-numeric: tabular-nums;">3</span>
            <span style="font-size: var(--font-size-caption); color: color-mix(in srgb, var(--primary-foreground) 80%, transparent);">待办</span>
          </div>
        </div>
      </header>

      <!-- QUICK ACTIONS: 2x2 grid overlapping header bottom -->
      <section class="px-4 -mt-6 relative z-10">
        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="flex flex-col items-center justify-center gap-2 rounded-[var(--radius-md)] p-4 bg-[var(--card)] border border-[var(--border)] shadow-[var(--shadow-1)] transition-shadow motion-reduce:transition-none hover:shadow-[var(--shadow-2)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" data-dom-id="action-new-selection">
            <div class="w-10 h-10 rounded-[var(--radius-md)] flex items-center justify-center" style="background: var(--tuke-v52-primary-50); color: var(--primary);">
              <i data-lucide="plus-circle" class="w-6 h-6"></i>
            </div>
            <span style="font-size: var(--font-size-body); color: var(--foreground);">新建协作</span>
          </button>
          <button type="button" class="flex flex-col items-center justify-center gap-2 rounded-[var(--radius-md)] p-4 bg-[var(--card)] border border-[var(--border)] shadow-[var(--shadow-1)] transition-shadow motion-reduce:transition-none hover:shadow-[var(--shadow-2)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" data-dom-id="action-drawings">
            <div class="w-10 h-10 rounded-[var(--radius-md)] flex items-center justify-center" style="background: var(--tuke-v52-info-50); color: var(--info);">
              <i data-lucide="file-text" class="w-6 h-6"></i>
            </div>
            <span style="font-size: var(--font-size-body); color: var(--foreground);">图纸管理</span>
          </button>
          <button type="button" class="flex flex-col items-center justify-center gap-2 rounded-[var(--radius-md)] p-4 bg-[var(--card)] border border-[var(--border)] shadow-[var(--shadow-1)] transition-shadow motion-reduce:transition-none hover:shadow-[var(--shadow-2)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" data-dom-id="action-meeting">
            <div class="w-10 h-10 rounded-[var(--radius-md)] flex items-center justify-center" style="background: var(--tuke-v52-warning-50); color: var(--warning);">
              <i data-lucide="video" class="w-6 h-6"></i>
            </div>
            <span style="font-size: var(--font-size-body); color: var(--foreground);">项目会议</span>
          </button>
          <button type="button" class="flex flex-col items-center justify-center gap-2 rounded-[var(--radius-md)] p-4 bg-[var(--card)] border border-[var(--border)] shadow-[var(--shadow-1)] transition-shadow motion-reduce:transition-none hover:shadow-[var(--shadow-2)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" data-dom-id="action-equipment">
            <div class="w-10 h-10 rounded-[var(--radius-md)] flex items-center justify-center" style="background: var(--tuke-v52-success-50); color: var(--success);">
              <i data-lucide="database" class="w-6 h-6"></i>
            </div>
            <span style="font-size: var(--font-size-body); color: var(--foreground);">设备库</span>
          </button>
        </div>
      </section>

      <!-- RECENT RECORDS: title + 3 record items -->
      <section class="px-4 mt-4">
        <div class="flex items-center justify-between mb-3">
          <h2 style="font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); color: var(--foreground);">最近协作</h2>
          <a href="#" class="transition-opacity motion-reduce:transition-none hover:opacity-70 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" style="font-size: var(--font-size-caption); color: var(--primary);">查看全部</a>
        </div>
        <div class="flex flex-col gap-2">
          <!-- Record 1 -->
          <a href="#" class="flex items-center gap-3 rounded-[var(--radius-md)] p-3 bg-[var(--card)] border border-[var(--border)] transition-shadow motion-reduce:transition-none hover:shadow-[var(--shadow-1)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" data-dom-id="record-1">
            <div class="w-8 h-8 rounded-[var(--radius-sm)] flex items-center justify-center shrink-0" style="background: var(--surface-container-low); color: var(--foreground-secondary);">
              <i data-lucide="wind" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0 flex flex-col gap-1">
              <span class="truncate" style="font-size: var(--font-size-body); color: var(--foreground);">中央空调机组</span>
              <span class="truncate" style="font-size: var(--font-size-caption); color: var(--muted-foreground);">阳光商务中心</span>
            </div>
            <span class="badge badge-success shrink-0" style="border-radius: var(--radius-full);">已完成</span>
          </a>
          <!-- Record 2 -->
          <a href="#" class="flex items-center gap-3 rounded-[var(--radius-md)] p-3 bg-[var(--card)] border border-[var(--border)] transition-shadow motion-reduce:transition-none hover:shadow-[var(--shadow-1)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" data-dom-id="record-2">
            <div class="w-8 h-8 rounded-[var(--radius-sm)] flex items-center justify-center shrink-0" style="background: var(--surface-container-low); color: var(--foreground-secondary);">
              <i data-lucide="droplets" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0 flex flex-col gap-1">
              <span class="truncate" style="font-size: var(--font-size-body); color: var(--foreground);">消防水泵</span>
              <span class="truncate" style="font-size: var(--font-size-caption); color: var(--muted-foreground);">滨江一号</span>
            </div>
            <span class="badge badge-warning shrink-0" style="border-radius: var(--radius-full);">进行中</span>
          </a>
          <!-- Record 3 -->
          <a href="#" class="flex items-center gap-3 rounded-[var(--radius-md)] p-3 bg-[var(--card)] border border-[var(--border)] transition-shadow motion-reduce:transition-none hover:shadow-[var(--shadow-1)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" data-dom-id="record-3">
            <div class="w-8 h-8 rounded-[var(--radius-sm)] flex items-center justify-center shrink-0" style="background: var(--surface-container-low); color: var(--foreground-secondary);">
              <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0 flex flex-col gap-1">
              <span class="truncate" style="font-size: var(--font-size-body); color: var(--foreground);">电梯设备</span>
              <span class="truncate" style="font-size: var(--font-size-caption); color: var(--muted-foreground);">科技园区B栋</span>
            </div>
            <span class="badge shrink-0" style="border-radius: var(--radius-full); color: var(--muted-foreground); background: var(--surface-container);">已取消</span>
          </a>
        </div>
      </section>

      <!-- FAB: floating action button above tab bar -->
      <button type="button" class="fixed flex items-center justify-center rounded-full z-30 transition-transform motion-reduce:transition-none hover:scale-105 active:scale-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" style="width: 48px; height: 48px; bottom: calc(56px + var(--space-4)); right: var(--space-4); background: var(--primary); box-shadow: var(--shadow-3); color: var(--primary-foreground);" data-dom-id="fab" aria-label="新建">
        <i data-lucide="plus" class="w-6 h-6"></i>
      </button>

      <!-- BOTTOM TAB BAR: 3 tabs, 首页 active -->
      <nav class="fixed bottom-0 inset-x-0 flex items-stretch z-20" style="height: 56px; background: var(--surface); border-top: 1px solid var(--border);">
        <a href="#" class="flex-1 flex flex-col items-center justify-center gap-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" style="color: var(--primary);" aria-current="page">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span style="font-size: var(--font-size-caption);">首页</span>
        </a>
        <a href="#" class="flex-1 flex flex-col items-center justify-center gap-1 transition-colors motion-reduce:transition-none hover:text-[var(--foreground)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" style="color: var(--muted-foreground);">
          <i data-lucide="list-checks" class="w-5 h-5"></i>
          <span style="font-size: var(--font-size-caption);">选型</span>
        </a>
        <a href="#" class="flex-1 flex flex-col items-center justify-center gap-1 transition-colors motion-reduce:transition-none hover:text-[var(--foreground)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ring)]" style="color: var(--muted-foreground);">
          <i data-lucide="user" class="w-5 h-5"></i>
          <span style="font-size: var(--font-size-caption);">我的</span>
        </a>
      </nav>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
