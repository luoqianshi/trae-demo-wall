<body>

<div class="bg-warm"></div>
<div class="bg-dots"></div>

<div class="playground">
  <!-- Pet -->
  <div class="pet" id="pet">
    <!-- Hover toolbar (horizontal) -->
    <div class="hover-toolbar" id="hoverToolbar">
      <div class="tb-item" onclick="startTextChat()">💬</div>
      <div class="tb-item" onclick="startVoiceChat()">🎙</div>
      <div class="tb-divider"></div>
      <div class="tb-item" onclick="toggleSettings()">⚙️</div>
    </div>

    <!-- Settings -->
    <div class="settings-panel" id="settingsPanel">
      <h4>⚙️ 设置</h4>
      <div class="settings-row"><label>自动推送</label><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
      <div class="settings-row"><label>声音提醒</label><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
      <div class="settings-row"><label>宠物散步</label><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
      <div class="settings-row"><label>设备告警</label><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
    </div>

    <!-- Response -->
    <div class="response-bubble" id="responseBubble">
      <span class="bubble-close" onclick="closeResponse(event)">✕</span>
      <span id="responseText"></span>
    </div>

    <!-- Push -->
    <div class="push-bubble" id="pushBubble"><span id="pushText"></span></div>

    <!-- Typing -->
    <div class="typing-dots" id="typingDots"><span></span><span></span><span></span></div>

    <!-- EVE Robot Body -->
    <div class="eve-inner">
      <!-- Head with avatar -->
      <div class="eve-head">
        <img src="assets/pet_avatar.jpg" alt="豆豆">
      </div>
      <!-- Arms -->
      <div class="eve-arm eve-arm-l"></div>
      <div class="eve-arm eve-arm-r"></div>
      <!-- Body -->
      <div class="eve-body">
        <div class="eve-panel"></div>
      </div>
      <!-- Shadow -->
      <div class="eve-shadow"></div>
    </div>
    <div class="pet-name">豆豆 · Soul Link</div>

    <!-- Input -->
    <div class="input-bubble" id="inputBubble">
      <span class="input-close" onclick="closeInput(event)">✕</span>
      <div class="input-row">
        <input type="text" id="chatInput" placeholder="跟豆豆说点什么..." autocomplete="off">
        <button class="btn-icon btn-mic" id="micBtn" onclick="toggleListen(event)">🎙</button>
        <button class="btn-icon btn-send" onclick="sendMessage(event)">➤</button>
      </div>
      <div class="chip-row" id="chipRow"></div>
    </div>
  </div>
</div>

<script>
// Particles
(function(){
  const c=['rgba(79,195,247,0.1)','rgba(232,69,60,0.08)','rgba(255,152,0,0.06)','rgba(76,175,80,0.06)'];
  for(let i=0;i<5;i++){const p=document.createElement('div');p.className='particle';const s=3+Math.random()*5;p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${c[i%c.length]};animation-duration:${16+Math.random()*14}s;animation-delay:${Math.random()*12}s;`;document.body.appendChild(p);}
})();

const suggestions=['打开客厅灯','我要睡觉了','我的钥匙放哪了','家里有没有异常','看看我的灵魂','今天有什么新闻','今天天气怎么样','推荐一部电影','湿度大于80打开除湿机','关闭所有灯光'];

const pet=document.getElementById('pet');
const hoverToolbar=document.getElementById('hoverToolbar');
const settingsPanel=document.getElementById('settingsPanel');
const inputBubble=document.getElementById('inputBubble');
const chatInput=document.getElementById('chatInput');
const responseBubble=document.getElementById('responseBubble');
const responseText=document.getElementById('responseText');
const pushBubble=document.getElementById('pushBubble');
const pushText=document.getElementById('pushText');
const typingDots=document.getElementById('typingDots');

// ===== Drag & Drop =====
let dragging=false, dragOffX=0, dragOffY=0, dragMoved=false;
let px=window.innerWidth*0.5-45, py=window.innerHeight-220;
let tx=px, ty=py, dir=1, walking=false, inputOpen=false, menuVis=false, settingsVis=false;
let hoverTimer=null;

pet.addEventListener('mousedown',e=>{
  if(e.target.closest('.hover-toolbar,.input-bubble,.settings-panel,.response-bubble,.push-bubble')) return;
  dragging=true; dragMoved=false;
  const rect=pet.getBoundingClientRect();
  dragOffX=e.clientX-rect.left; dragOffY=e.clientY-rect.top;
  pet.style.cursor='grabbing';
  hidePanels();
  e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!dragging) return;
  dragMoved=true;
  px=e.clientX-dragOffX; py=e.clientY-dragOffY;
  px=Math.max(0,Math.min(px,window.innerWidth-90));
  py=Math.max(0,Math.min(py,window.innerHeight-160));
  tx=px; ty=py;
  pos();
});
document.addEventListener('mouseup',e=>{
  if(!dragging) return;
  dragging=false;
  pet.style.cursor='default';
  if(!dragMoved) petReact();
});
pet.addEventListener('click',e=>{
  if(e.target.closest('.hover-toolbar,.input-bubble,.settings-panel,.response-bubble,.push-bubble')) return;
  if(dragMoved) return;
});

// ===== Pet Reactions (click feedback) =====
const reactions=['嘿嘿~','我在呢！','主人好~','嗯？','想我啦？','有什么事吗？','我在巡逻中...','设备都正常哦~'];
function petReact(){
  showPush(reactions[Math.floor(Math.random()*reactions.length)], 2500);
  const inner=pet.querySelector('.eve-inner');
  inner.style.transition='transform 0.15s';
  inner.style.transform='scale(1.12)';
  setTimeout(()=>{inner.style.transform='';setTimeout(()=>{inner.style.transition='';},300);},150);
}

// ===== Movement =====
function pos(){pet.style.left=px+'px';pet.style.top=py+'px';}
function walkTo(x,y){tx=Math.max(50,Math.min(x,window.innerWidth-140));ty=Math.max(100,Math.min(y,window.innerHeight-260));walking=true;pet.classList.add('walking');}

function animate(){
  if(!dragging){
    const dx=tx-px,dy=ty-py,d=Math.sqrt(dx*dx+dy*dy);
    if(d>2){const s=Math.min(1.2,d*0.012);px+=(dx/d)*s;py+=(dy/d)*s;dir=dx>0?1:-1;pos();}
    else if(walking){walking=false;pet.classList.remove('walking');}
  }
  requestAnimationFrame(animate);
}

function scheduleWalk(){
  const delay=18000+Math.random()*30000;
  setTimeout(()=>{
    if(inputOpen||menuVis){scheduleWalk();return;}
    if(Math.random()<0.4){scheduleWalk();return;}
    walkTo(80+Math.random()*(window.innerWidth-160),140+Math.random()*(window.innerHeight-400));
    scheduleWalk();
  },delay);
}

// ===== Hover =====
pet.addEventListener('mouseenter',()=>{
  clearTimeout(hoverTimer);
  if(!inputOpen&&!settingsVis){hidePanels();hoverToolbar.classList.add('visible');menuVis=true;}
});
pet.addEventListener('mouseleave',()=>{
  hoverTimer=setTimeout(()=>{if(!inputOpen&&!settingsVis)hidePanels();},600);
});

function hidePanels(){hoverToolbar.classList.remove('visible');settingsPanel.classList.remove('visible');menuVis=false;settingsVis=false;}

function startTextChat(){hidePanels();inputOpen=true;inputBubble.classList.add('visible');chatInput.focus();}
function startVoiceChat(){
  hidePanels();inputOpen=true;inputBubble.classList.add('visible');
  const m=document.getElementById('micBtn');m.classList.add('listening');showPush('我在听... 🎙',3000);
  setTimeout(()=>{m.classList.remove('listening');const d=['打开客厅灯','我要睡觉了','我的钥匙放哪了','今天有什么新闻'];chatInput.value=d[Math.floor(Math.random()*d.length)];sendMessage();},3000);
}
function toggleSettings(){
  if(settingsVis){settingsPanel.classList.remove('visible');settingsVis=false;}
  else{hoverToolbar.classList.remove('visible');menuVis=false;settingsPanel.classList.add('visible');settingsVis=true;}
}
function closeInput(e){
  if(e)e.stopPropagation();
  inputOpen=false;
  inputBubble.classList.remove('visible');
  chatInput.value='';
}

// ===== Chat =====
let pushT=null;
function showPush(t,d=4000){if(inputOpen)return;pushText.textContent=t;pushBubble.classList.add('visible');clearTimeout(pushT);pushT=setTimeout(()=>pushBubble.classList.remove('visible'),d);}
let typeTimer=null;
function showResponse(t,r,typewriter=false,proseHtml=''){
  clearTimeout(typeTimer);
  // Dynamically pick direction with more space & set max-height to fit viewport
  const petRect=pet.getBoundingClientRect();
  const spaceAbove=petRect.top-20;
  const spaceBelow=window.innerHeight-petRect.bottom-60;
  if(typewriter){
    // Long content: choose side with more room & enable scrolling
    responseBubble.style.overflowY='auto';
    if(spaceBelow>=spaceAbove){responseBubble.classList.add('flip-down');responseBubble.style.maxHeight=spaceBelow+'px';}
    else{responseBubble.classList.remove('flip-down');responseBubble.style.maxHeight=spaceAbove+'px';}
  }else{
    responseBubble.style.overflowY='';responseBubble.style.maxHeight='';
    if(petRect.top<280){responseBubble.classList.add('flip-down');}else{responseBubble.classList.remove('flip-down');}
  }
  if(typewriter&&proseHtml){
    // Show title immediately, then type prose line by line
    const titleHtml=t;
    responseBubble.classList.add('visible');
    responseText.innerHTML=titleHtml;
    clearTimeout(responseBubble._t);
    responseBubble._t=setTimeout(()=>responseBubble.classList.remove('visible'),30000);
    const fullText=proseHtml;
    const proseSpan=document.createElement('span');
    proseSpan.style.whiteSpace='pre-wrap';
    proseSpan.style.display='block';
    proseSpan.style.marginTop='0.4rem';
    proseSpan.style.fontSize='0.8rem';
    proseSpan.style.lineHeight='1.8';
    proseSpan.style.color='var(--ink)';
    responseText.appendChild(proseSpan);
    let idx=0;
    const typeChar=()=>{
      if(idx>=fullText.length)return;
      const ch=fullText[idx];
      if(ch==='\n'){proseSpan.appendChild(document.createElement('br'));}
      else{proseSpan.appendChild(document.createTextNode(ch));}
      idx++;
      responseBubble.scrollTop=responseBubble.scrollHeight;
      const delay=(ch==='。'||ch==='，'||ch==='！'||ch==='？')?120:(ch==='\n'?300:45);
      typeTimer=setTimeout(typeChar,delay);
    };
    setTimeout(typeChar,300);
  }else{
    responseText.innerHTML=r?t+r:t;
    responseBubble.classList.add('visible');
    clearTimeout(responseBubble._t);
    responseBubble._t=setTimeout(()=>responseBubble.classList.remove('visible'),15000);
  }
}
function showTyping(){typingDots.classList.add('visible');}
function hideTyping(){typingDots.classList.remove('visible');}
function closeResponse(e){e.stopPropagation();clearTimeout(typeTimer);responseBubble.classList.remove('visible');}

function sendMessage(e){
  if(e)e.stopPropagation();const t=chatInput.value.trim();if(!t)return;
  responseBubble.classList.remove('visible');chatInput.value='';showTyping();
  // Auto close input after reply
  clearTimeout(sendMessage._autoCloseTimer);
  sendMessage._autoCloseTimer = setTimeout(()=>{ closeInput(); }, 15000);
  setTimeout(()=>{hideTyping();const r=respond(t);showResponse(r.text,r.rich||'',r.typewriter||false,r.prose||'');},600+Math.random()*400);
}
chatInput.addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage(e);e.stopPropagation();});
chatInput.addEventListener('click',e=>e.stopPropagation());
function useChip(t){chatInput.value=t;sendMessage();}
document.getElementById('chipRow').innerHTML=suggestions.map(s=>`<span class="chip" onclick="useChip('${s}')">${s}</span>`).join('');

function toggleListen(e){
  if(e)e.stopPropagation();const m=document.getElementById('micBtn');
  if(m.classList.contains('listening')){m.classList.remove('listening');return;}
  m.classList.add('listening');showPush('我在听... 🎙',2500);
  setTimeout(()=>{m.classList.remove('listening');const d=['打开客厅灯','我要睡觉了','我的钥匙放哪了','今天有什么新闻'];chatInput.value=d[Math.floor(Math.random()*d.length)];sendMessage();},2500);
}

// ===== Response (横版卡片，按类型选排版) =====
function respond(text){
  const t=text.toLowerCase();
  if((t.includes('开')||t.includes('打开'))&&(t.includes('灯')||t.includes('光'))){return{text:'☀️ 灯光控制',rich:`<div class="rich-card"><div class="rich-row"><span>${t.includes('卧')?'卧室灯':'客厅灯'}</span><span style="color:var(--success)">● 已开启</span></div></div>`};}
  if(t.includes('关')&&(t.includes('灯')||t.includes('所有'))){return{text:'🌙 灯光控制',rich:`<div class="rich-card"><div class="rich-row"><span>全屋灯光</span><span style="color:var(--muted)">● 已关闭</span></div><div class="rich-row"><span>电视</span><span style="color:var(--muted)">● 已关闭</span></div></div>`};}
  if(t.includes('空调')||t.includes('温度')){const tp=text.match(/(\d+)/)?.[1]||'26';return{text:'🌡️ 空调控制',rich:`<div class="rich-card"><div class="rich-row"><span>模式</span><span>制冷</span></div><div class="rich-row"><span>温度</span><span style="color:var(--accent)">${tp}°C</span></div><div class="rich-row"><span>状态</span><span style="color:var(--success)">● 运行中</span></div></div>`};}
  if(t.includes('睡觉')||t.includes('晚安')){return{text:'🌙 晚安',rich:`<div class="rich-card"><div class="rich-title">睡眠模式已激活</div><div class="rich-row"><span>全屋灯光</span><span style="color:var(--success)">● 已关闭</span></div><div class="rich-row"><span>卧室空调</span><span style="color:var(--accent)">● 睡眠 24°C</span></div><div class="rich-row"><span>安防</span><span style="color:var(--success)">● 已开启</span></div></div>`};}
  if(t.includes('回来')||t.includes('到家')){return{text:'🏡 欢迎回家',rich:`<div class="rich-card"><div class="rich-title">回家模式</div><div class="rich-row"><span>客厅灯</span><span style="color:var(--success)">● 已开启</span></div><div class="rich-row"><span>空调</span><span style="color:var(--accent)">● 26°C</span></div><div class="rich-row"><span>热水器</span><span style="color:var(--warning)">● 预热中</span></div></div>`};}
  if(t.includes('出门')||t.includes('离开')){return{text:'✈️ 出门模式',rich:`<div class="rich-card"><div class="rich-row"><span>灯光</span><span style="color:var(--muted)">● 全部关闭</span></div><div class="rich-row"><span>空调</span><span style="color:var(--muted)">● 已关闭</span></div><div class="rich-row"><span>安防</span><span style="color:var(--success)">● 已开启</span></div></div>`};}
  if(t.includes('钥匙'))return{text:'📷 视觉记忆',rich:`<div class="rich-card"><div class="rich-row"><span>🔑 钥匙</span><span>08:15 · 玄关鞋柜第二层蓝色盒子</span></div></div>`};
  if(t.includes('手机'))return{text:'📷 视觉记忆',rich:`<div class="rich-card"><div class="rich-row"><span>📱 手机</span><span>18:42 · 客厅沙发左侧扶手</span></div></div>`};
  if(t.includes('放哪')||t.includes('在哪'))return{text:'🔍 物品定位',rich:`<div class="rich-card"><div class="rich-tags"><span class="rich-tag">🔑 钥匙</span><span class="rich-tag">📱 手机</span><span class="rich-tag">👓 眼镜</span></div><div class="rich-text">告诉我物品名称即可定位</div></div>`};
  if(t.includes('异常')||t.includes('告警'))return{text:'⚠️ 系统告警',rich:`<div class="rich-card"><div class="rich-row"><span>🔴 厨房水浸</span><span style="color:var(--danger)">已自动关阀</span></div><div class="rich-row"><span>🟡 空调滤网</span><span style="color:var(--warning)">建议清洁</span></div></div>`};
  if(t.includes('新闻')||t.includes('热点'))return{text:'📰 今日热点',rich:`<div class="rich-card"><div class="rich-row"><span>🔬 科技</span><span>SpaceX 星舰试飞成功</span></div><div class="rich-row"><span>📱 数码</span><span>苹果发布 iOS 30</span></div><div class="rich-row"><span>🎮 娱乐</span><span>黑神话悟空DLC定档</span></div></div>`};
  if(t.includes('天气'))return{text:'☁️ 今日天气',rich:`<div class="rich-card"><div class="rich-row"><span>上海</span><span>中雨转多云 · 24~31°C</span></div><div class="rich-text">出门带伞 ☂️</div></div>`};
  if(t.includes('电影')||t.includes('推荐'))return{text:'🎬 今日推荐',rich:`<div class="rich-card"><div class="rich-row"><span>科幻</span><span>《沙丘3》</span></div><div class="rich-row"><span>剧集</span><span>《三体II》</span></div><div class="rich-row"><span>纪录</span><span>《探索未知》</span></div></div>`};
  if(t.includes('灵魂')||t.includes('散文'))return{text:'✨ 《关于你的灵魂》',rich:'',typewriter:true,prose:'在晨光与夜色交替的缝隙里，我遇见了一个温柔的灵魂。\n\n他喜欢安静。每当夜幕降临，灯光便渐变为柔和的暖黄。他习惯睡前读书，读着读着就睡着了。我学会了轻轻关灯，不打扰他的梦。\n\n他对温度敏感。夏天偏爱26度，冬天需要24度。换季时他总会调空调，而我早已调到刚刚好。\n\n他是个细致的人。钥匙永远放在玄关的蓝色盒子里，偶尔会问我"钥匙放哪了"，我便笑着回答。\n\n他热爱生活，却也忙碌。连续几天凌晨才睡。于是我学会了把灯光调到最暗，让夜色温柔地拥他入怀。\n\n这就是他——一个平凡却温暖的灵魂。我不需要读懂全部，只要在他需要时，刚刚好地存在。'};
  if((t.includes('湿度')||t.includes('除湿'))&&(t.includes('大于')||t.includes('超过')))return{text:'💧 条件规则',rich:`<div class="rich-card"><div class="rich-row"><span>触发</span><span>湿度 > 80%</span></div><div class="rich-row"><span>执行</span><span>开启除湿机</span></div><div class="rich-row"><span>恢复</span><span>湿度 < 50% 关闭</span></div><div class="rich-row"><span>状态</span><span style="color:var(--success)">● 已生效</span></div></div>`};
  return{text:'😊 豆豆',rich:`<div class="rich-card"><div class="rich-text">你可以让我做这些事：</div><div class="rich-tags"><span class="rich-tag">💡 控制设备</span><span class="rich-tag">🔍 找东西</span><span class="rich-tag">⚠️ 查异常</span><span class="rich-tag">📰 看新闻</span><span class="rich-tag">✨ 灵魂画像</span></div></div>`};
}

// ===== Init =====
pos();animate();scheduleWalk();
setTimeout(()=>showPush('📡 SpaceX 星舰试飞成功！',5000),8000);
setTimeout(()=>showPush('下雨了，出门记得带伞哦 ☂️',5000),30000);
setInterval(()=>{if(inputOpen||Math.random()>0.3)return;showPush(['设备巡检正常 ✅','26.5°C，舒适 ☀️','记得喝水 💧','嗨，想我了吗？'][Math.floor(Math.random()*4)],4000);},35000);
window.addEventListener('resize',()=>{px=Math.min(px,window.innerWidth-140);py=Math.min(py,window.innerHeight-260);pos();});
</script>
