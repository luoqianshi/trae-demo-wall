<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>知识助眠</title>
<style id="app-css">
/* ═══ app.ttss 全局样式 ═══ */
html, body {
  background-color: #E8F6F8;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
  color: #1A3430;
  font-size: 14px;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}
.container { display: flex; flex-direction: column; height: 100vh; background-color: #E8F6F8; }
.scroll-hidden::-webkit-scrollbar { display: none; }
.text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.text-clamp-2 { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.text-clamp-1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.color-gold { color: #3A8B7A; }
.color-text { color: #1A3430; }
.color-muted { color: rgba(40, 90, 82, 0.50); }
.bg-card { background-color: rgba(255, 255, 255, 0.46); }
.bg-card2 { background-color: rgba(255, 255, 255, 0.28); }
.bg-gold { background-color: #3A8B7A; }
.bg-gold-dim { background-color: rgba(58, 139, 122, 0.18); }
.rounded-xl { border-radius: 24rpx; }
.rounded-2xl { border-radius: 32rpx; }
.rounded-full { border-radius: 9999rpx; }
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.flex-1 { flex: 1; }
.flex-shrink-0 { flex-shrink: 0; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.justify-around { justify-content: space-around; }
.text-center { text-align: center; }
.px-4 { padding-left: 32rpx; padding-right: 32rpx; }
.px-5 { padding-left: 40rpx; padding-right: 40rpx; }
.pt-12 { padding-top: 96rpx; }
.pb-4 { padding-bottom: 32rpx; }
.mb-3 { margin-bottom: 24rpx; }
.mb-4 { margin-bottom: 32rpx; }
.mb-5 { margin-bottom: 40rpx; }
.relative { position: relative; }
.absolute { position: absolute; }
.overflow-hidden { overflow: hidden; }

/* ═══ index.ttss 主页面样式 ═══ */
html, body {
  --bg-grad: radial-gradient(ellipse at 15% 0%, rgba(120,220,180,0.55) 0%, transparent 50%),
             radial-gradient(ellipse at 85% 5%, rgba(100,190,230,0.40) 0%, transparent 48%),
             radial-gradient(ellipse at 50% 95%, rgba(140,210,200,0.35) 0%, transparent 52%),
             linear-gradient(148deg, #A8DECE 0%, #B4D8EE 22%, #C2E4F2 42%, #D4EEF7 62%, #E4F6F8 82%, #F0FAFB 100%);
  /* 电脑访问时两侧露出黑色，模拟小程序居中展示效果 */
  background: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
}
.app-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000000; }
.phone-frame {
  --anim-scale: 1.5; /* 动画速度乘数，CSS 与 JS 保持一致 */
  /* 按手机宽高比 1220:2712 根据屏幕高度计算宽度，完美模仿小程序效果 */
  width: min(100vw, calc(100vh * 1220 / 2712));
  height: min(100vh, calc(100vw * 2712 / 1220));
  background: var(--bg-grad, #E8F6F8);
  border-radius: 0; display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.page-content-area { flex: 1; position: relative; overflow: hidden; }
.page-layer {
  position: absolute; inset: 0; background: var(--bg-grad, #E8F6F8);
  display: flex; flex-direction: column; overflow: hidden;
}
.page-active { visibility: visible; z-index: 1; transform: translateX(0); opacity: 1; }
.page-hidden { visibility: hidden; pointer-events: none; z-index: 0; }
.page-exit-forward { visibility: visible; z-index: 2; pointer-events: none; animation: exitForward calc(390ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards; }
@keyframes exitForward { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-28%); opacity: 0.4; } }
.page-exit-back { visibility: visible; z-index: 2; pointer-events: none; animation: exitBack calc(390ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards; }
@keyframes exitBack { from { transform: translateX(0); } to { transform: translateX(100%); } }
.page-exit-tab { visibility: visible; z-index: 2; pointer-events: none; animation: exitTab calc(350ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards; }
@keyframes exitTab { from { opacity: 1; } to { opacity: 0; } }
.page-enter-forward { visibility: visible; z-index: 3; animation: enterForward calc(390ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards; }
@keyframes enterForward { from { transform: translateX(100%); } to { transform: translateX(0); } }
.page-enter-back { visibility: visible; z-index: 3; animation: enterBack calc(390ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards; }
@keyframes enterBack { from { transform: translateX(-100%); } to { transform: translateX(0); } }
.page-enter-tab { visibility: visible; z-index: 3; animation: enterTab calc(340ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards; }
@keyframes enterTab { from { opacity: 0; } to { opacity: 1; } }

/* 迷你播放器 */
.mini-player-container {
  position: relative; flex-shrink: 0; background: rgba(255, 255, 255, 0.28);
  border-top: 1rpx solid rgba(26, 90, 70, 0.06); padding: 20rpx 24rpx; overflow: hidden;
  transform: translateY(100%); opacity: 0;
  transition: transform calc(380ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1), opacity calc(300ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1);
}
.mini-player-visible { transform: translateY(0); opacity: 1; }
.mp-bar { position: absolute; top: 0; left: 0; height: 4rpx; background: #3A8B7A; transition: width calc(300ms * var(--anim-scale, 1)); }
.mp-content { display: flex; align-items: center; }
.mp-cover { width: 80rpx; height: 80rpx; border-radius: 24rpx; flex-shrink: 0; background: rgba(255, 255, 255, 0.46); object-fit: cover; }
.mp-info { flex: 1; margin-left: 24rpx; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.mp-title { color: #1A3430; font-size: 24rpx; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-meta { color: rgba(40, 90, 82, 0.50); font-size: 20rpx; margin-top: 4rpx; }
.mp-btn { padding: 16rpx; border-radius: 50%; cursor: pointer; }
.mp-btn-icon { width: 36rpx; height: 36rpx; }
.mp-close { padding: 12rpx; border-radius: 50%; cursor: pointer; }
.mp-close-icon { width: 28rpx; height: 28rpx; }

/* 底部导航 */
.bottom-nav { display: flex; align-items: center; justify-content: space-around; padding: 16rpx 32rpx 32rpx; flex-shrink: 0; background: rgba(255, 255, 255, 0.36); border-top: 1rpx solid rgba(26, 90, 70, 0.06); }
.bn-item { display: flex; flex-direction: column; align-items: center; padding: 8rpx 40rpx; cursor: pointer; }
.bn-icon { width: 40rpx; height: 40rpx; margin-bottom: 4rpx; }
.bn-label { color: rgba(40, 90, 82, 0.50); font-size: 20rpx; font-weight: 500; }
.bn-active { color: #3A8B7A; }

/* 首页 */
.home-wrapper { height: 100%; background: var(--bg-grad, #E8F6F8); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.home-wrapper::-webkit-scrollbar { display: none; }
.home-greet { padding: 96rpx 40rpx 32rpx; }
.home-greet-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8rpx; }
.home-greet-sub { color: rgba(40, 90, 82, 0.50); font-size: 24rpx; }
.home-greet-title { color: #1A3430; font-size: 48rpx; font-weight: 600; line-height: 1.25; display: block; }
.home-greet-sub2 { color: rgba(40, 90, 82, 0.50); font-size: 28rpx; margin-top: 8rpx; display: block; }
.home-section { margin-bottom: 40rpx; }
.home-section-last { padding-bottom: 120rpx; }
.home-section-row { display: flex; align-items: center; justify-content: space-between; padding: 0 40rpx; margin-bottom: 24rpx; }
.home-section-title { color: #1A3430; font-size: 28rpx; font-weight: 600; }
.home-section-title-mb { display: block; margin-bottom: 52rpx; padding: 0 40rpx; }
.home-section-action { display: flex; align-items: center; gap: 4rpx; }
.home-section-action-text { color: #3A8B7A; font-size: 24rpx; }
.home-section-action-arrow { width: 28rpx; height: 28rpx; }

/* 轮播 */
.home-picks-swiper { width: 100%; aspect-ratio: 750/350; position: relative; overflow: hidden; }
.swiper-track { display: flex; height: 100%; transition: transform linear; }
.swiper-slide { width: 100%; height: 100%; flex-shrink: 0; }
.home-pick-card { position: relative; width: calc(100% - 40rpx); height: 100%; margin: 0 20rpx; border-radius: 32rpx; overflow: hidden; cursor: pointer; }
.home-pick-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.home-pick-img-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, rgba(10, 8, 40, 0.45)); }
.home-pick-cat-tag { position: absolute; bottom: 120rpx; left: 16rpx; font-size: 20rpx; padding: 4rpx 16rpx; border-radius: 9999rpx; background: rgba(255, 255, 255, 0.22); color: #FFFFFF; border: 1rpx solid rgba(255, 255, 255, 0.35); font-weight: 500; }
.home-pick-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 20rpx 24rpx; background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.home-pick-title { color: #1A3430; font-size: 24rpx; font-weight: 500; line-height: 1.375; margin-bottom: 16rpx; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.home-pick-dur { display: flex; align-items: center; color: rgba(40, 90, 82, 0.50); }
.home-pick-dur-icon { width: 20rpx; height: 20rpx; margin-right: 8rpx; }
.home-pick-dur-text { font-size: 20rpx; }
.swiper-dots { display: flex; justify-content: center; gap: 8rpx; padding: 16rpx 0; }
.swiper-dot { width: 16rpx; height: 16rpx; border-radius: 50%; background: rgba(40, 90, 82, 0.20); transition: background 0.3s; }
.swiper-dot-active { background: #3A8B7A; }

/* 分类网格 */
.home-cats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20rpx; padding: 0 40rpx; }
.home-cat-card { display: flex; align-items: center; background: rgba(255, 255, 255, 0.46); border: 1rpx solid rgba(26, 90, 70, 0.06); border-radius: 32rpx; padding: 28rpx; cursor: pointer; }
.home-cat-icon { width: 72rpx; height: 72rpx; border-radius: 24rpx; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.home-cat-icon-char { width: 36rpx; height: 36rpx; }
.home-cat-info { margin-left: 24rpx; display: flex; flex-direction: column; }
.home-cat-name { color: #1A3430; font-size: 24rpx; font-weight: 500; }
.home-cat-count { color: rgba(40, 90, 82, 0.50); font-size: 20rpx; margin-top: 4rpx; }
.home-cat-card-disabled { opacity: 0.65; }
.home-cat-card-disabled .home-cat-count { color: #3A8B7A; }

/* 分类页 */
.cat-wrapper { display: flex; flex-direction: column; height: 100%; background: var(--bg-grad, #E8F6F8); }
.cat-nav { display: flex; align-items: center; padding: 96rpx 32rpx 24rpx; gap: 24rpx; }
.cat-back { padding: 16rpx; border-radius: 50%; cursor: pointer; }
.cat-back-icon { width: 48rpx; height: 48rpx; }
.cat-title { flex: 1; color: #1A3430; font-size: 32rpx; font-weight: 600; }
.cat-subcats-scroll { white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cat-subcats-scroll::-webkit-scrollbar { display: none; }
.cat-subcats-row { display: inline-flex; gap: 16rpx; padding: 0 32rpx 24rpx; }
.cat-subcat { display: inline-block; flex-shrink: 0; padding: 12rpx 32rpx; border-radius: 9999rpx; font-size: 24rpx; font-weight: 500; color: rgba(40, 90, 82, 0.50); background: rgba(255, 255, 255, 0.20); border: 1rpx solid rgba(26, 90, 70, 0.06); cursor: pointer; }
.cat-subcat-active { color: #1A3430; background: rgba(58, 139, 122, 0.25); border: 1rpx solid rgba(58, 139, 122, 0.40); }
.cat-items-scroll { flex: 1; padding: 0 32rpx; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.cat-items-scroll::-webkit-scrollbar { display: none; }
.cat-item { display: flex; align-items: center; padding: 24rpx 0; border-bottom: 1rpx solid rgba(26, 90, 70, 0.06); cursor: pointer; }
.cat-item-img { width: 128rpx; height: 128rpx; border-radius: 24rpx; flex-shrink: 0; background: rgba(255, 255, 255, 0.28); object-fit: cover; }
.cat-item-info { flex: 1; width: 0; margin-left: 24rpx; overflow: hidden; }
.cat-item-title { color: #1A3430; font-size: 28rpx; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8rpx; }
.cat-item-desc { color: rgba(40, 90, 82, 0.50); font-size: 24rpx; line-height: 1.375; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; margin-bottom: 16rpx; }
.cat-item-meta { display: flex; align-items: center; gap: 24rpx; }
.cat-item-meta-item { display: flex; align-items: center; gap: 4rpx; color: rgba(40, 90, 82, 0.50); font-size: 20rpx; }
.cat-item-meta-icon { width: 20rpx; height: 20rpx; }
.cat-item-play { width: 64rpx; height: 64rpx; border-radius: 50%; background: rgba(58, 139, 122, 0.18); border: 1rpx solid rgba(58, 139, 122, 0.20); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 16rpx; margin-right: 37rpx; }
.cat-item-play-icon { width: 28rpx; height: 28rpx; margin-left: 4rpx; }
.cat-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 320rpx; gap: 16rpx; }
.cat-empty-text { color: rgba(40, 90, 82, 0.50); font-size: 28rpx; }

/* 播放器 */
.player-wrapper { display: flex; flex-direction: column; height: 100%; background: var(--bg-grad, #E8F6F8); position: relative; }
.player-header { display: flex; align-items: center; padding: 96rpx 32rpx 16rpx; gap: 16rpx; flex-shrink: 0; position: relative; z-index: 10; }
.player-back { padding: 16rpx; border-radius: 50%; cursor: pointer; }
.player-back-icon { width: 48rpx; height: 48rpx; }
.player-header-center { flex: 1; text-align: center; min-width: 0; padding: 0 16rpx; }
.player-header-cat { display: inline-block; font-size: 20rpx; padding: 4rpx 16rpx; border-radius: 9999rpx; background: rgba(58, 139, 122, 0.18); color: #3A8B7A; }
.player-header-cat-row { display: flex; align-items: center; justify-content: center; gap: 6rpx; margin-bottom: 4rpx; }
.player-header-ep-info { color: rgba(40, 90, 82, 0.50); font-size: 20rpx; }
.player-header-title { color: #1A3430; font-size: 24rpx; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.player-more { padding: 16rpx; }
.player-more-icon { width: 40rpx; height: 40rpx; }
.player-text-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.player-text-scroll::-webkit-scrollbar { display: none; }
.player-controls { position: relative; z-index: 10; flex-shrink: 0; }
.player-controls-panel { background: rgba(255, 255, 255, 0.46); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1rpx solid rgba(58, 139, 122, 0.15); border-radius: 48rpx 48rpx 0 0; margin-top: 12rpx; }
.player-text-inner { padding: 16rpx 40rpx; }
.player-para { display: block; line-height: 1.625; margin-bottom: 40rpx; color: #1A3430; }
.player-font-ctrl { display: flex; justify-content: flex-end; gap: 16rpx; padding: 0 40rpx 8rpx; flex-shrink: 0; }
.player-font-btn { width: 56rpx; height: 56rpx; border-radius: 50%; background: rgba(255, 255, 255, 0.46); color: rgba(40, 90, 82, 0.50); font-size: 26rpx; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.player-progress { padding: 0 40rpx; margin-bottom: 24rpx; margin-top: 16rpx; flex-shrink: 0; }
.player-progress-touch-area { padding: 16rpx 0; cursor: pointer; }
.player-progress-track { position: relative; height: 8rpx; border-radius: 9999rpx; background: rgba(58, 139, 122, 0.18); margin-bottom: 12rpx; }
.player-progress-fill { height: 100%; border-radius: 9999rpx; background: #3A8B7A; }
.player-progress-thumb { position: absolute; top: 50%; transform: translateY(-50%); width: 24rpx; height: 24rpx; border-radius: 50%; background: #3A8B7A; border: 4rpx solid rgba(255, 255, 255, 0.9); transition: box-shadow calc(200ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1); }
.thumb-active { box-shadow: 0 0 16rpx 6rpx rgba(58, 139, 122, 0.5); }
.player-progress-time { display: flex; justify-content: space-between; }
.player-progress-time-text { color: rgba(40, 90, 82, 0.50); font-size: 20rpx; }
.player-main-ctrl { display: flex; align-items: center; justify-content: center; gap: 80rpx; padding: 0 64rpx; flex-shrink: 0; margin-bottom: 40rpx; }
.player-ep-btn { display: flex; flex-direction: column; align-items: center; gap: 8rpx; width: 112rpx; color: rgba(40, 90, 82, 0.50); cursor: pointer; }
.player-ep-icon { width: 40rpx; height: 40rpx; }
.player-ep-label { font-size: 18rpx; }
.player-ep-btn-disabled { opacity: 0.35; }
.player-play-btn { width: 128rpx; height: 128rpx; border-radius: 50%; background: #3A8B7A; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 32rpx 8rpx rgba(58, 139, 122, 0.2); transition: transform calc(200ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1); cursor: pointer; }
.player-play-btn:active { transform: scale(0.9); }
.player-play-glow { box-shadow: 0 0 64rpx 16rpx rgba(58, 139, 122, 0.45); }
.player-play-btn-icon { width: 52rpx; height: 52rpx; }
.player-aux-ctrl { display: flex; align-items: center; justify-content: space-around; background: rgba(255, 255, 255, 0.46); border: 1rpx solid rgba(26, 90, 70, 0.06); border-radius: 32rpx; padding: 24rpx 48rpx; margin: 0 32rpx 32rpx; flex-shrink: 0; }
.player-aux-item { display: flex; flex-direction: column; align-items: center; gap: 8rpx; cursor: pointer; }
.player-aux-icon { width: 32rpx; height: 32rpx; }
.player-aux-label { color: rgba(40, 90, 82, 0.50); font-size: 18rpx; }
.color-warning { color: #E07040; }

/* 弹窗 */
.modal-overlay { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(20, 60, 52, 0.25); animation: modalOverlayIn calc(300ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards; }
.modal-panel { background: rgba(225, 248, 244, 0.94); border-radius: 48rpx 48rpx 0 0; padding: 16rpx 40rpx 64rpx; animation: modalPanelIn calc(380ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards; }
.modal-drag-handle { width: 64rpx; height: 8rpx; border-radius: 9999rpx; margin: 24rpx auto 40rpx; background: rgba(58, 139, 122, 0.2); }
@keyframes modalOverlayIn { from { background: rgba(20, 60, 52, 0); } to { background: rgba(20, 60, 52, 0.25); } }
@keyframes modalPanelIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes modalOverlayOut { from { background: rgba(20, 60, 52, 0.25); } to { background: rgba(20, 60, 52, 0); } }
@keyframes modalPanelOut { from { transform: translateY(0); } to { transform: translateY(100%); } }
.modal-overlay-closing { animation: modalOverlayOut calc(300ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards !important; }
.modal-panel-closing { animation: modalPanelOut calc(380ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1) forwards !important; }

/* 定时弹窗 */
.timer-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40rpx; }
.timer-toggle-info { flex: 1; min-width: 0; }
.timer-toggle-title { color: #1A3430; font-size: 28rpx; font-weight: 600; display: block; }
.timer-toggle-desc { color: rgba(40, 90, 82, 0.50); font-size: 24rpx; margin-top: 4rpx; display: block; }
.timer-toggle-actions { display: flex; align-items: center; gap: 24rpx; }
.timer-toggle { position: relative; width: 96rpx; height: 48rpx; border-radius: 9999rpx; background: rgba(40, 90, 82, 0.25); transition: background calc(300ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1); flex-shrink: 0; cursor: pointer; }
.timer-toggle-on { background: #3A8B7A; }
.timer-toggle-knob { position: absolute; top: 4rpx; left: 4rpx; width: 40rpx; height: 40rpx; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2rpx 8rpx rgba(0, 0, 0, 0.25); transition: left calc(300ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1); }
.timer-toggle-on .timer-toggle-knob { left: 52rpx; }
.timer-close-btn { padding: 8rpx; cursor: pointer; }
.timer-close-icon { width: 36rpx; height: 36rpx; }
.timer-slider-section { transition: opacity calc(300ms * var(--anim-scale, 1)) cubic-bezier(0.165, 0.84, 0.44, 1); }
.timer-slider-disabled { opacity: 0.35; pointer-events: none; }
.timer-time-display { display: flex; align-items: baseline; justify-content: center; gap: 8rpx; margin-bottom: 48rpx; }
.timer-time-num { color: #3A8B7A; font-size: 72rpx; font-weight: 600; line-height: 1; }

<script>
// ════════════════════════════════════════════════════════════
// 知识助眠 HTML版 — 完整还原抖音小程序功能/设计/动画
// ════════════════════════════════════════════════════════════
(function() {
'use strict';

// ── 配置 ──────────────────────────────────────────────────
var ANIM_SCALE = 1.5; // 动画速度乘数（与 anim-config.js 一致）

// ── 图标路径辅助 ──────────────────────────────────────────
function icon(name) { return 'assets/icons/' + name + '.svg'; }

// 图标映射 — 分类ID → SVG路径
var ICON_MAP = {
  misc: icon('cat-misc'), english: icon('cat-english'), history: icon('cat-history'),
  politics: icon('cat-politics'), literature: icon('cat-literature'), philosophy: icon('cat-philosophy'),
  science: icon('cat-science'), geography: icon('cat-geography'), art: icon('cat-art'),
  economics: icon('cat-economics'), psychology: icon('cat-psychology')
};

// 倍速列表
var SPEEDS = [0.75, 1.0, 1.25, 1.5, 2.0];

// 页面类型常量
var TAB_PAGES = { home: true, search: true, profile: true };
var ALL_PAGES = ['home', 'category', 'player', 'search', 'profile'];

// 睡眠数据
var sleepData = [
  { day: '一', minutes: 42 }, { day: '二', minutes: 35 },
  { day: '三', minutes: 51 }, { day: '四', minutes: 28 },
  { day: '五', minutes: 47 }, { day: '六', minutes: 63 },
  { day: '日', minutes: 38 }
];


// ═══ API 函数层（从 utils/api.js 迁移） ═══

// 获取所有可见分类（state !== -1）
function getCategories() {
  return categoriesDB.filter(function (c) { return c.state !== -1; });
}
// 根据 ID 获取单个分类
function getCategoryById(id) {
  return categoriesDB.find(function (c) { return c.id === id; });
}
// 获取指定分类下的内容数量
function getContentCountByCategory(categoryId) {
  return contentDB.filter(function (item) { return item.categoryId === categoryId; }).length;
}
// 获取指定分类下的内容（可按子分类过滤）
function getContentByCategory(categoryId, subcategory) {
  return contentDB.filter(function (item) {
    if (item.categoryId !== categoryId) return false;
    if (subcategory && subcategory !== '全部') return item.subcategory === subcategory;
    return true;
  });
}
// 根据 ID 获取单个内容
function getContentById(id) {
  return contentDB.find(function (item) { return item.id === id; });
}
// 获取每日精选
function getDailyPicks(count) {
  count = count || 4;
  var featured = contentDB.filter(function (item) { return item.featured; });
  return featured.slice(0, count);
}
// 全文搜索（标题、描述、分类ID）
function searchContent(query) {
  if (!query || !query.trim()) return [];
  var q = query.toLowerCase();
  return contentDB.filter(function (item) {
    return item.title.toLowerCase().indexOf(q) !== -1 ||
      (item.description || '').toLowerCase().indexOf(q) !== -1 ||
      item.categoryId.toLowerCase().indexOf(q) !== -1;
  });
}
// 获取指定分类的子分类列表
function getSubcategories(categoryId) {
  var cat = getCategoryById(categoryId);
  return cat ? cat.subcategories : ['全部'];
}
// 获取内容项在其分类中的 0-based 位置
function getEpisodeIndex(contentId) {
  var item = getContentById(contentId);
  if (!item) return 0;
  var sameCat = contentDB.filter(function (c) { return c.categoryId === item.categoryId; });
  return sameCat.findIndex(function (c) { return c.id === contentId; });
}
// 获取同分类下的总集数
function getEpisodeCount(contentId) {
  var item = getContentById(contentId);
  if (!item) return 0;
  return contentDB.filter(function (c) { return c.categoryId === item.categoryId; }).length;
}
// 获取下一集
function getNextEpisode(contentId) {
  var item = getContentById(contentId);
  if (!item) return undefined;
  var all = contentDB.filter(function (c) { return c.categoryId === item.categoryId; });
  var idx = all.findIndex(function (c) { return c.id === contentId; });
  return all[idx + 1];
}
// 获取上一集
function getPrevEpisode(contentId) {
  var item = getContentById(contentId);
  if (!item) return undefined;
  var all = contentDB.filter(function (c) { return c.categoryId === item.categoryId; });
  var idx = all.findIndex(function (c) { return c.id === contentId; });
  return idx > 0 ? all[idx - 1] : undefined;
}
// 获取同分类下的所有集列表
function getEpisodes(contentId) {
  var item = getContentById(contentId);
  if (!item) return [];
  return contentDB.filter(function (c) { return c.categoryId === item.categoryId; });
}
// 判断分类是否被禁用（state===0 或 内容为空）
function isCategoryDisabled(categoryId) {
  var cat = getCategoryById(categoryId);
  if (!cat) return true;
  if (cat.state === -1) return true;
  if (cat.state === 0) return true;
  return getContentCountByCategory(categoryId) === 0;
}
// 格式化时长（如 "1小时30分钟"）
function formatDuration(seconds) {
  if (!seconds) return '0分钟';
  var m = Math.floor(seconds / 60);
  if (m >= 60) {
    var h = Math.floor(m / 60);
    var rem = m % 60;
    return rem > 0 ? h + '小时' + rem + '分钟' : h + '小时';
  }
  return m + '分钟';
}
// 格式化时间（MM:SS）
function formatTime(seconds) {
  seconds = Math.floor(seconds || 0);
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}
// 生成 Unsplash 图片 URL
function imgUrl(photoId, w, h) {
  w = w || 200; h = h || 200;
  return 'https://images.unsplash.com/photo-' + photoId + '?w=' + w + '&h=' + h + '&fit=crop&auto=format';
}

// setData — 更新 data 并触发渲染（仿小程序 setData）
function setData(updates) {
  Object.assign(data, updates);
  renderAll();
}

// renderAll — 智能渲染：根据当前页面状态调用对应渲染函数
function renderAll() {
  // 更新页面层状态 class
  ALL_PAGES.forEach(function (p) {
    var el = document.getElementById('page-' + p);
    if (el) {
      el.className = 'page-layer ' + (data.pageStates[p] || 'page-hidden');
    }
  });
  // 惰性渲染：仅渲染已挂载的页面
  if (data.renderedPages.home) renderHome();
  if (data.renderedPages.category) renderCategory();
  if (data.renderedPages.player) renderPlayer();
  if (data.renderedPages.search) renderSearch();
  if (data.renderedPages.profile) renderProfile();
  // 迷你播放器
  renderMiniPlayer();
  // 底部导航
  renderBottomNav();
  // toast
  renderToast();
  // 弹窗（持久化容器 #playerModals 位于 page-content-area，离开播放器页时整体隐藏，避免浮于其他页面之上）
  var _modalsEl = document.getElementById('playerModals');
  if (_modalsEl) _modalsEl.style.display = (data.page === 'player') ? '' : 'none';
  if (data.renderedPages.player && data.page === 'player') {
    renderTimerModal();
    renderPlayModeModal();
    renderEpisodeModal();
    renderAdvanceModal();
  }
}
// ═══ rpx 转换器：将 CSS 中的 rpx 替换为 px（1rpx = 0.5px） ═══
function convertRpx() {
  var styleEl = document.getElementById('app-css');
  var css = styleEl.textContent;
  css = css.replace(/(\d+)rpx/g, function (match, num) {
    return (parseInt(num, 10) * 0.5) + 'px';
  });
  styleEl.textContent = css;
}

// 转义 HTML 防止 XSS
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// 加载本地存储（收藏、播放历史、搜索历史、收听进度）
function loadStorage() {
  try {
    var wp = localStorage.getItem('watchedProgress');
    if (wp) data.watchedProgress = JSON.parse(wp);
    var sh = localStorage.getItem('searchHistory');
    if (sh) data.searchHistory = JSON.parse(sh);
  } catch (e) { /* 忽略解析错误 */ }
}
// 保存收听进度到本地
function saveWatchedProgress() {
  try { localStorage.setItem('watchedProgress', JSON.stringify(data.watchedProgress)); } catch (e) {}
}
// 保存搜索历史到本地
function saveSearchHistory() {
  try { localStorage.setItem('searchHistory', JSON.stringify(data.searchHistory)); } catch (e) {}
}

// 设置页面 CSS 状态（生成 pageStates 对象）
function _makePageStates(exitPage, enterPage, direction) {
  var states = {};
  ALL_PAGES.forEach(function (p) {
    if (p === enterPage && direction) states[p] = 'page-enter-' + direction;
    else if (p === enterPage) states[p] = 'page-active';
    else if (p === exitPage && direction) states[p] = 'page-exit-' + direction;
    else states[p] = 'page-hidden';
  });
  return states;
}

// 轻量级页面状态更新（仅切换 CSS class，不触发 renderAll，避免重渲染卡顿）
function _applyPageStatesLight(states) {
  Object.assign(data, { pageStates: states, isTransitioning: false });
  ALL_PAGES.forEach(function (p) {
    var el = document.getElementById('page-' + p);
    if (el) el.className = 'page-layer ' + (states[p] || 'page-hidden');
  });
}

// 页面导航（核心方法）
function navigate(to, dir) {
  if (data.isTransitioning) return;
  var from = data.page;
  var direction = dir || (TAB_PAGES[from] && TAB_PAGES[to] ? 'tab' : 'forward');
  var history = data.history.slice();
  // 设置转场状态并标记目标页面为已渲染
  var navUpdate = {
    page: to,
    pageStates: _makePageStates(from, to, direction),
    isTransitioning: true
  };
  data.renderedPages[to] = true;
  history.push(from);
  data.history = history;
  setData(navUpdate);
  // 加载目标页面数据
  if (to === 'home') loadHomeData();
  if (to === 'profile') setTimeout(drawSleepChart, 200);
  updateBottomNav(to);
  // 动画结束后设置最终状态（轻量级更新，不触发 renderAll，避免卡顿）
  setTimeout(function () {
    _applyPageStatesLight(_makePageStates(null, to, null));
    if (to === 'profile') setTimeout(drawSleepChart, 100);
  }, Math.ceil(420 * ANIM_SCALE));
}

// 后退导航
function goBack() {
  if (data.isTransitioning) return;
  var history = data.history.slice();
  if (history.length === 0) return;
  var prev = history.pop();
  var from = data.page;
  data.history = history;
  var backUpdate = {
    page: prev,
    pageStates: _makePageStates(from, prev, 'back'),
    isTransitioning: true
  };
  data.renderedPages[prev] = true;
  setData(backUpdate);
  if (prev === 'home') loadHomeData();
  updateBottomNav(prev);
  setTimeout(function () {
    _applyPageStatesLight(_makePageStates(null, prev, null));
    if (prev === 'profile') setTimeout(drawSleepChart, 100);
  }, Math.ceil(420 * ANIM_SCALE));
}

// 加载首页数据
function loadHomeData() {
  var picks = getDailyPicks(4).map(function (item) {
    var cat = getCategoryById(item.categoryId);
    return {
      id: item.id, title: item.title, thumbnail: item.thumbnail,
      durationStr: formatDuration(item.durationSeconds),
      catName: cat ? cat.name : ''
    };
  });
  var categories = getCategories().map(function (cat) {
    var count = getContentCountByCategory(cat.id);
    var disabled = isCategoryDisabled(cat.id);
    return {
      id: cat.id, name: cat.name, color: cat.color,
      iconChar: ICON_MAP[cat.id] || icon('cat-misc'),
      contentCount: count, disabled: disabled,
      countText: disabled ? '待完成' : count + '个内容'
    };
  });
  setData({ dailyPicks: picks, categories: categories });
}
// ═══ 轮播图状态（自定义 transform 轮播替代 swiper） ═══
var carousel = {
  current: 0,          // 当前索引
  timer: null,         // 自动播放定时器
  interval: 5000,      // 自动播放间隔（5秒）
  duration: 500,       // 切换动画时长
  transitioning: false // 是否正在切换
};

// 轮播跳转到指定索引（循环）
function carouselGoTo(index) {
  var picks = data.dailyPicks;
  if (picks.length === 0 || carousel.transitioning) return;
  var len = picks.length;
  carousel.current = ((index % len) + len) % len;
  var track = document.querySelector('#page-home .swiper-track');
  if (!track) return;
  carousel.transitioning = true;
  // 使用 OutQuart 缓动曲线
  track.style.transition = 'transform ' + carousel.duration + 'ms cubic-bezier(0.165, 0.84, 0.44, 1)';
  track.style.transform = 'translateX(-' + (carousel.current * 100) + '%)';
  // 更新指示点
  var dots = document.querySelectorAll('#page-home .swiper-dot');
  dots.forEach(function (dot, i) {
    dot.className = 'swiper-dot' + (i === carousel.current ? ' swiper-dot-active' : '');
  });
  setTimeout(function () { carousel.transitioning = false; }, carousel.duration);
}

// 轮播自动播放
function carouselStartAuto() {
  carouselStopAuto();
  if (data.dailyPicks.length <= 1) return;
  carousel.timer = setInterval(function () {
    carouselGoTo(carousel.current + 1);
  }, carousel.interval);
}
// 轮播停止自动播放
function carouselStopAuto() {
  if (carousel.timer) { clearInterval(carousel.timer); carousel.timer = null; }
}
// 初始化轮播
function initCarousel() {
  carousel.current = 0;
  carouselStartAuto();
}

// 自定义 toast 方法
var _toastTimer = null;
function showCustomToast(text, duration) {
  duration = duration || 2000;
  if (_toastTimer) clearTimeout(_toastTimer);
  setData({ toastVisible: true, toastText: text, toastClosing: false });
  _toastTimer = setTimeout(function () {
    setData({ toastClosing: true });
    setTimeout(function () {
      setData({ toastVisible: false, toastClosing: false });
    }, Math.ceil(300 * ANIM_SCALE));
  }, duration);
}

// ═══ 渲染定时弹窗 ═══
// 签名幂等：状态未变化时跳过重建，避免 setData 频繁触发导致入场动画反复重启
var _timerModalSig = null;
function renderTimerModal() {
  var container = document.getElementById('playerModals');
  if (!container) return;
  // 签名涵盖所有影响弹窗结构/动画/文本的状态
  var sig = data.showTimer + '|' + data.timerClosing + '|' + data.timerEnabled + '|' +
    data.timerMinutes + '|' + data.timerHours + '|' + data.timerMinsPart + '|' +
    data.timerDescText + '|' + data.timerConfirmText;
  if (_timerModalSig === sig) return; // 状态未变，跳过
  _timerModalSig = sig;
  // 移除已存在的定时弹窗（避免重复堆积）
  var existing = container.querySelector('[data-modal="timer"]');
  if (existing) existing.remove();
  if (!data.showTimer) return; // 弹窗隐藏时不渲染
  var marksHtml = data.timerMarks.map(function (m) {
    var left = ((m.val - 30) / 150 * 100).toFixed(2);
    return '<span class="timer-mark' + (data.timerMinutes === m.val ? ' timer-mark-active' : '') + '"' +
      ' style="left: ' + left + '%;" data-action="onSelectTimerMark" data-mins="' + m.val + '" data-catch="true">' + escapeHtml(m.label) + '</span>';
  }).join('');
  var timeDisplayHtml = '';
  if (data.timerHours > 0) {
    timeDisplayHtml += '<span class="timer-time-num">' + data.timerHours + '</span><span class="timer-time-unit">小时</span>';
  }
  if (data.timerMinsPart > 0) {
    timeDisplayHtml += '<span class="timer-time-num">' + data.timerMinsPart + '</span><span class="timer-time-unit">分钟</span>';
  }
  var sliderDisabled = !data.timerEnabled;
  var modalHtml =
    '<div class="modal-overlay' + (data.timerClosing ? ' modal-overlay-closing' : '') + '" data-modal="timer" data-action="onCloseTimer">' +
      '<div class="modal-panel' + (data.timerClosing ? ' modal-panel-closing' : '') + '" data-catch="true">' +
        '<div class="modal-drag-handle"></div>' +
        '<div class="timer-toggle-row">' +
          '<div class="timer-toggle-info">' +
            '<span class="timer-toggle-title">定时关闭</span>' +
            '<span class="timer-toggle-desc">' + escapeHtml(data.timerEnabled ? data.timerDescText : '一直播放，不自动停止') + '</span>' +
          '</div>' +
          '<div class="timer-toggle-actions">' +
            '<div class="timer-toggle' + (data.timerEnabled ? ' timer-toggle-on' : '') + '" data-action="onToggleTimerEnabled" data-catch="true">' +
              '<div class="timer-toggle-knob"></div>' +
            '</div>' +
            '<div class="timer-close-btn" data-action="onCloseTimer" data-catch="true">' +
              '<img class="timer-close-icon" src="' + icon('x') + '" />' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="timer-slider-section' + (sliderDisabled ? ' timer-slider-disabled' : '') + '">' +
          '<div class="timer-time-display">' + timeDisplayHtml + '</div>' +
          '<div class="timer-slider-wrap">' +
            '<input type="range" class="timer-slider" id="timerSlider" min="30" max="180" step="5" value="' + data.timerMinutes + '"' +
              (sliderDisabled ? ' disabled' : '') + ' />' +
          '</div>' +
          '<div class="timer-marks">' + marksHtml + '</div>' +
        '</div>' +
        '<div class="timer-confirm-btn' + (data.timerEnabled ? ' timer-confirm-active' : '') + '" data-action="onConfirmTimer" data-catch="true">' +
          escapeHtml(data.timerConfirmText) +
        '</div>' +
      '</div>' +
    '</div>';
  container.insertAdjacentHTML('beforeend', modalHtml);
  // 绑定滑块事件：拖动时直接更新 data 与 DOM，不触发 setData，避免重建弹窗中断拖动
  var slider = document.getElementById('timerSlider');
  if (slider) {
    slider.addEventListener('input', function (e) {
      data.timerMinutes = parseInt(e.target.value, 10);
      // 重新计算派生显示值并写入 data（不调用 setData，避免重建弹窗中断拖动）
      _recomputeTimerDisplayData();
      // 直接刷新弹窗内显示文本（不重建 DOM，滑块保持拖动状态）
      _applyTimerDisplayDOM();
    });
  }
}

// 根据当前 timerMinutes/timerEnabled 重新计算派生显示值并写入 data（不触发渲染）
function _recomputeTimerDisplayData() {
  var v = _computeTimerDisplayValues(data.timerMinutes, data.timerEnabled);
  data.timerHours = v.timerHours;
  data.timerMinsPart = v.timerMinsPart;
  data.timerDescText = v.timerDescText;
  data.timerConfirmText = v.timerConfirmText;
  // 同步签名，避免下次 renderTimerModal 误判为状态变化而重建
  _timerModalSig = data.showTimer + '|' + data.timerClosing + '|' + data.timerEnabled + '|' +
    data.timerMinutes + '|' + data.timerHours + '|' + data.timerMinsPart + '|' +
    data.timerDescText + '|' + data.timerConfirmText;
}

// 直接更新定时弹窗内的显示文本（不重建 DOM，供滑块拖动时使用）
function _applyTimerDisplayDOM() {
  var overlay = document.querySelector('#playerModals [data-modal="timer"]');
  if (!overlay) return;
  // 更新时间显示
  var dispEl = overlay.querySelector('.timer-time-display');
  if (dispEl) {
    var html = '';
    if (data.timerHours > 0) html += '<span class="timer-time-num">' + data.timerHours + '</span><span class="timer-time-unit">小时</span>';
    if (data.timerMinsPart > 0) html += '<span class="timer-time-num">' + data.timerMinsPart + '</span><span class="timer-time-unit">分钟</span>';
    dispEl.innerHTML = html;
  }
  // 更新刻度高亮
  var marks = overlay.querySelectorAll('.timer-mark');
  marks.forEach(function (mk) {
    var isActive = parseInt(mk.getAttribute('data-mins'), 10) === data.timerMinutes;
    mk.className = 'timer-mark' + (isActive ? ' timer-mark-active' : '');
  });
  // 更新确认按钮（含启用态高亮 class）
  var confirmBtn = overlay.querySelector('.timer-confirm-btn');
  if (confirmBtn) {
    confirmBtn.textContent = data.timerConfirmText;
    confirmBtn.className = 'timer-confirm-btn' + (data.timerEnabled ? ' timer-confirm-active' : '');
  }
  // 更新描述文本（启用时显示）
  var descEl = overlay.querySelector('.timer-toggle-desc');
  if (descEl) {
    descEl.textContent = data.timerEnabled ? data.timerDescText : '一直播放，不自动停止';
  }
  // 更新 toggle 开关 class（启用/禁用态切换）
  var toggleEl = overlay.querySelector('.timer-toggle');
  if (toggleEl) {
    toggleEl.className = 'timer-toggle' + (data.timerEnabled ? ' timer-toggle-on' : '');
  }
  // 更新滑块禁用状态
  var slider = overlay.querySelector('.timer-slider');
  if (slider) {
    slider.disabled = !data.timerEnabled;
  }
  // 更新滑块区域禁用样式
  var sliderSection = overlay.querySelector('.timer-slider-section');
  if (sliderSection) {
    sliderSection.className = 'timer-slider-section' + (data.timerEnabled ? '' : ' timer-slider-disabled');
  }
}

// ═══ 进度条拖动事件绑定 ═══
var _progressRect = null;
function bindProgressEvents() {
  var touchArea = document.getElementById('progressTouchArea');
  if (!touchArea) return;
  var startDrag = function (clientX) {
    var track = touchArea.querySelector('.player-progress-track');
    if (!track) return;
    _progressRect = track.getBoundingClientRect();
    if (_progressRect.width <= 0) return;
    data.isDraggingProgress = true;
    updateProgressFromX(clientX);
  };
  var moveDrag = function (clientX) {
    if (!data.isDraggingProgress) return;
    updateProgressFromX(clientX);
  };
  var endDrag = function () {
    if (!data.isDraggingProgress) return;
    var duration = (audio && audio.duration) || data.playerDuration;
    var newTime = data.playerProgress * duration;
    if (audio && audio.src && duration > 0) {
      audio.currentTime = newTime;
    }
    data.isDraggingProgress = false;
    data.playerCurrentTime = newTime;
    data.playerCurrentTimeStr = formatTime(newTime);
    // 直接更新DOM避免完整重渲染
    updateProgressDOM();
  };
  // 鼠标事件
  touchArea.addEventListener('mousedown', function (e) { e.preventDefault(); startDrag(e.clientX); });
  document.addEventListener('mousemove', function (e) { if (data.isDraggingProgress) moveDrag(e.clientX); });
  document.addEventListener('mouseup', function () { if (data.isDraggingProgress) endDrag(); });
  // 触摸事件
  touchArea.addEventListener('touchstart', function (e) { startDrag(e.touches[0].clientX); }, { passive: true });
  document.addEventListener('touchmove', function (e) { if (data.isDraggingProgress && e.touches[0]) moveDrag(e.touches[0].clientX); }, { passive: true });
  document.addEventListener('touchend', function () { if (data.isDraggingProgress) endDrag(); });
}

// 根据X坐标计算进度并更新
function updateProgressFromX(clientX) {
  if (!_progressRect) return;
  var x = clientX - _progressRect.left;
  var progress = Math.max(0, Math.min(1, x / _progressRect.width));
  var duration = (audio && audio.duration) || data.playerDuration;
  var newTime = progress * duration;
  data.playerProgress = progress;
  data.playerCurrentTime = newTime;
  data.playerCurrentTimeStr = formatTime(newTime);
  updateProgressDOM();
}

// 仅更新进度条DOM（避免完整重渲染）
function updateProgressDOM() {
  var el = document.getElementById('page-player');
  if (!el) return;
  var fill = el.querySelector('.player-progress-fill');
  var thumb = el.querySelector('.player-progress-thumb');
  var timeEls = el.querySelectorAll('.player-progress-time-text');
  var pct = (data.playerProgress * 100).toFixed(2);
  if (fill) fill.style.width = pct + '%';
  if (thumb) {
    thumb.style.left = 'calc(' + pct + '% - 6px)';
    thumb.className = 'player-progress-thumb' + (data.isDraggingProgress ? ' thumb-active' : '');
  }
  if (timeEls.length >= 2) {
    timeEls[0].textContent = data.playerCurrentTimeStr;
  }
}
// ═══ 播放器业务逻辑 ═══

// 打开播放器并播放指定内容
function openContent(contentId) {
  var content = getContentById(contentId);
  if (!content) return;
  var cat = getCategoryById(content.categoryId);
  setData({
    playerContentId: contentId,
    playerAudioUrl: content.audioUrl || '',
    playerCategory: cat ? cat.name : '',
    playerTitle: content.title,
    playerParagraphs: content.paragraphs || [],
    playerDuration: content.durationSeconds,
    playerCurrentTime: 0, playerProgress: 0, playerCurrentPara: 0,
    playerCurrentTimeStr: '00:00',
    playerDurationStr: formatTime(content.durationSeconds),
    isPlaying: true, playerSpeed: 1.0, playerFontSize: 15,
    currentEpisodePlays: 0, autoAdvanceCountdown: null
  });
  updateEpisodeInfo(contentId);
  updateReplayLabel();
  navigate('player', 'forward');
  playAudio(content);
  updateMiniPlayer(true);
  if (data.timerSecondsLeft !== null) startTimerCountdown();
}

// 播放音频
function playAudio(content) {
  if (!audio) return;
  audio.title = content.title;
  audio.src = content.audioUrl;
  audio.playbackRate = data.playerSpeed;
  // 调用 play() 实际开始播放（浏览器自动播放策略要求用户交互，此时已有点击交互）
  var playPromise = audio.play();
  if (playPromise && typeof playPromise.then === 'function') {
    playPromise.catch(function () {
      // 自动播放被阻止，更新 UI 为暂停状态
      data.isPlaying = false;
      updatePlayBtnDOM();
    });
  }
}

// 切换集数
function switchEpisode(contentId) {
  var content = getContentById(contentId);
  if (!content) return;
  var cat = getCategoryById(content.categoryId);
  // 计算集数信息（内联，避免调用 updateEpisodeInfo 触发 setData 重渲染）
  var epIndex = getEpisodeIndex(contentId);
  var epTotal = getEpisodeCount(contentId);
  var prevEp = getPrevEpisode(contentId);
  var nextEp = getNextEpisode(contentId);
  // 计算重播标签（内联，避免调用 updateReplayLabel 触发 setData 重渲染）
  var rc = data.replayCount;
  var replayLabel;
  if (rc === 0) replayLabel = '一直重播';
  else if (rc === 1) replayLabel = '不重播';
  else replayLabel = '重播' + (rc - 1) + '次';
  // 直接更新 data，不触发完整重渲染（避免闪动）
  Object.assign(data, {
    playerContentId: contentId,
    playerAudioUrl: content.audioUrl || '',
    playerCategory: cat ? cat.name : '',
    playerTitle: content.title,
    playerParagraphs: content.paragraphs || [],
    playerDuration: content.durationSeconds,
    playerCurrentTime: 0, playerProgress: 0, playerCurrentPara: 0,
    playerCurrentTimeStr: '00:00',
    playerDurationStr: formatTime(content.durationSeconds),
    isPlaying: true, currentEpisodePlays: 0, autoAdvanceCountdown: null,
    epIndex: epIndex, epTotal: epTotal,
    hasPrevEp: !!prevEp, hasNextEp: !!nextEp,
    nextEpTitle: nextEp ? nextEp.title : '',
    nextEpIndex: nextEp ? epIndex + 2 : 0,
    replayLabel: replayLabel
  });
  // 播放新音频
  playAudio(content);
  // 轻量级 DOM 更新（不重新生成 innerHTML，避免图片重新加载导致闪动）
  updatePlayerDOMForSwitch();
  // 更新迷你播放器
  updateMiniPlayer(true);
  // 如果选集弹窗打开，刷新列表
  if (data.showEpisodeList) refreshEpisodeList();
}

// 切换集数时的轻量级 DOM 更新（仅更新文本和状态，不重建 innerHTML）
function updatePlayerDOMForSwitch() {
  var el = document.getElementById('page-player');
  if (!el) return;
  // 更新标题
  var titleEl = el.querySelector('.player-header-title');
  if (titleEl) titleEl.textContent = data.playerTitle;
  // 更新分类标签
  var catEl = el.querySelector('.player-header-cat');
  if (catEl) catEl.textContent = data.playerCategory;
  // 更新集数信息
  var epInfoEl = el.querySelector('.player-header-ep-info');
  if (epInfoEl) epInfoEl.textContent = '第' + (data.epIndex + 1) + '集 / 共' + data.epTotal + '集';
  // 更新文稿段落
  var textInner = el.querySelector('.player-text-inner');
  if (textInner) {
    textInner.innerHTML = data.playerParagraphs.map(function (p) {
      return '<span class="player-para" style="font-size: ' + data.playerFontSize + 'px">' + escapeHtml(p) + '</span>';
    }).join('');
  }
  // 重置文稿滚动位置到顶部
  var textScroll = el.querySelector('.player-text-scroll');
  if (textScroll) textScroll.scrollTop = 0;
  // 重置进度条
  var fillEl = el.querySelector('.player-progress-fill');
  if (fillEl) fillEl.style.width = '0%';
  var thumbEl = el.querySelector('.player-progress-thumb');
  if (thumbEl) thumbEl.style.left = 'calc(0% - 6px)';
  var timeTexts = el.querySelectorAll('.player-progress-time-text');
  if (timeTexts[0]) timeTexts[0].textContent = '00:00';
  if (timeTexts[1]) timeTexts[1].textContent = data.playerDurationStr;
  // 更新重播标签

  if (replayLabelEl) replayLabelEl.textContent = data.replayLabel;
  // 更新上一集/下一集按钮禁用状态
  var prevBtn = el.querySelector('[data-action="onPrevEp"]');
  if (prevBtn) prevBtn.className = 'player-ep-btn' + (!data.hasPrevEp ? ' player-ep-btn-disabled' : '');
  var nextBtn = el.querySelector('[data-action="onNextEp"]');
  if (nextBtn) nextBtn.className = 'player-ep-btn' + (!data.hasNextEp ? ' player-ep-btn-disabled' : '');
  // 更新播放按钮状态
  updatePlayBtnDOM();

// 更新集数导航信息
function updateEpisodeInfo(contentId) {
  var epIndex = getEpisodeIndex(contentId);
  var epTotal = getEpisodeCount(contentId);
  var prevEp = getPrevEpisode(contentId);
  var nextEp = getNextEpisode(contentId);
  setData({
    epIndex: epIndex, epTotal: epTotal,
    hasPrevEp: !!prevEp, hasNextEp: !!nextEp,
    nextEpTitle: nextEp ? nextEp.title : '',
    nextEpIndex: nextEp ? epIndex + 2 : 0
  });
}

// 更新重播按钮标签
function updateReplayLabel() {
  var rc = data.replayCount;
  var plays = data.currentEpisodePlays;
  var label;
  if (plays > 0 && rc !== 1) {
    label = (plays + 1) + '/' + (rc === 0 ? '∞' : rc);
  } else if (rc === 0) label = '一直重播';
  else if (rc === 1) label = '不重播';
  else label = '重播' + (rc - 1) + '次';
  setData({ replayLabel: label });
}

// 更新定时按钮标签和警告状态
function updateTimerLabel() {
  var secs = data.timerSecondsLeft;
  if (secs !== null && secs !== undefined) {
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    setData({ timerLabel: m + ':' + (s < 10 ? '0' + s : s), timerWarning: secs < 120 });
  } else {
    setData({ timerLabel: '定时', timerWarning: false });
  }
}

// 计算定时弹窗派生显示值（纯函数，不触发渲染）
function _computeTimerDisplayValues(mins, enabled) {
  var h = Math.floor(mins / 60);
  var m = mins % 60;
  var desc, confirm;
  if (mins < 60) desc = mins + '分钟后自动停止';
  else if (m === 0) desc = h + '小时后自动停止';
  else desc = h + '小时' + m + '分后自动停止';
  if (enabled) {
    if (mins < 60) confirm = mins + '分钟后停止';
    else if (m === 0) confirm = h + '小时后停止';
    else confirm = h + '小时' + m + '分后停止';
  } else confirm = '不设定时';
  return { timerHours: h, timerMinsPart: m, timerDescText: desc, timerConfirmText: confirm };
}

// 处理音频播放结束 — 重播/连播逻辑
function handleTrackEnd() {
  var newPlayCount = data.currentEpisodePlays + 1;
  var replayCount = data.replayCount;
  // ① 一直循环或还没到次数 → 重播当前集
  if (replayCount === 0 || newPlayCount < replayCount) {
    setData({
      currentEpisodePlays: newPlayCount,
      playerCurrentTime: 0, playerProgress: 0, playerCurrentPara: 0,
      playerCurrentTimeStr: '00:00', isPlaying: true
    });
    updateReplayLabel();
    if (audio) { audio.currentTime = 0; audio.play(); }
    updateMiniPlayer(false);
    return;
  }
  // ② 本集播完 → 进入下一集
  setData({
    currentEpisodePlays: 0, isPlaying: false, playerProgress: 1,
    playerCurrentTime: data.playerDuration,
    playerCurrentPara: Math.max(0, data.playerParagraphs.length - 1)
  });
  updateReplayLabel();
  updateMiniPlayer(false);
  var wp = data.watchedProgress;
  wp[data.playerContentId] = 1;
  data.watchedProgress = wp;
  saveWatchedProgress();
  var nextEp = getNextEpisode(data.playerContentId);
  if (nextEp) startAutoAdvance();
}

// 启动自动连播5秒倒计时
var _advanceInterval = null;
function startAutoAdvance() {
  stopAutoAdvance();
  setData({ autoAdvanceCountdown: 5 });
  setTimeout(function () { drawCountdownRing(5); }, 100);
  _advanceInterval = setInterval(function () {
    var c = data.autoAdvanceCountdown;
    if (c === null) { stopAutoAdvance(); return; }
    if (c <= 1) {
      stopAutoAdvance();
      var nextEp = getNextEpisode(data.playerContentId);
      if (nextEp) switchEpisode(nextEp.id);
    } else {
      setData({ autoAdvanceCountdown: c - 1 });
      drawCountdownRing(c - 1);
    }
  }, 1000);
}
function stopAutoAdvance() {
  if (_advanceInterval) { clearInterval(_advanceInterval); _advanceInterval = null; }
  setData({ autoAdvanceCountdown: null });
}

// 定时器倒计时
var _timerInterval = null;
function startTimerCountdown() {
  stopTimerCountdown();
  _timerInterval = setInterval(function () {
    if (!data.isPlaying) return;
    var secs = data.timerSecondsLeft;
    if (secs === null || secs === undefined) return;
    if (secs <= 1) {
      if (audio) audio.pause();
      data.timerSecondsLeft = null;
      stopTimerCountdown();
      updateTimerLabel();
    } else {
      data.timerSecondsLeft = secs - 1;
      updateTimerLabel();
    }
  }, 1000);
}
function stopTimerCountdown() {
  if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
}

// 刷新选集列表
function refreshEpisodeList() {
  var contentId = data.playerContentId;
  if (!contentId) return;
  var content = getContentById(contentId);
  if (!content) return;
  var cat = getCategoryById(content.categoryId);
  var episodes = getEpisodes(contentId);
  var wp = data.watchedProgress;
  var list = episodes.map(function (ep, idx) {
    // 当前播放项使用实时进度，其他项使用已保存的观看进度
    var prog = (ep.id === contentId) ? data.playerProgress : (wp[ep.id] || 0);
    var done = prog >= 0.95;
    var started = prog > 0.02 && !done;
    return {
      id: ep.id, index: idx + 1, title: ep.title, description: ep.description,
      thumbnail: ep.thumbnail, durationStr: formatDuration(ep.durationSeconds),
      progress: prog, isActive: ep.id === contentId, isDone: done, isStarted: started,
      progressPercent: Math.round(prog * 100)
    };
  });
  setData({
    episodeList: list,
    episodeListCatName: cat ? cat.name : '',
    episodeListCurrentIndex: getEpisodeIndex(contentId) + 1,
    episodeListTotal: episodes.length
  });
}

// 更新迷你播放器
function updateMiniPlayer(withAnim) {
  var contentId = data.playerContentId;
  if (!contentId) {
    setData({ showMiniPlayer: false, miniPlayerVisible: false });
    return;
  }
  var content = getContentById(contentId);
  if (!content) return;
  var cat = getCategoryById(content.categoryId);
  var progress = data.playerProgress;
  var duration = (audio && audio.duration) || content.durationSeconds;
  var currentTime = progress * duration;
  setData({
    showMiniPlayer: true,
    miniTitle: content.title,
    miniMeta: (cat ? cat.name : '') + ' · ' + formatTime(currentTime) + ' / ' + formatTime(duration),
    miniImg: content.thumbnail || imgUrl(content.imageId, 80, 80),
    miniProgress: progress
  });
  if (withAnim) {
    setTimeout(function () { setData({ miniPlayerVisible: true }); }, 50);
  }
}

// 搜索核心逻辑
function doSearch(q) {
  var history = data.searchHistory.slice();
  if (history.indexOf(q) === -1) history = [q].concat(history).slice(0, 8);
  var results = searchContent(q).map(function (item) {
    var cat = getCategoryById(item.categoryId);
    return {
      id: item.id, title: item.title, description: item.description,
      imageId: item.imageId, thumbnail: item.thumbnail,
      durationStr: formatDuration(item.durationSeconds),
      catName: cat ? cat.name : ''
    };
  });
  setData({ searchQuery: q, searchSearched: true, searchResults: results, searchHistory: history });
  saveSearchHistory();
}
// ═══ Canvas 绘制 ═══

// 绘制睡眠趋势折线图
function drawSleepChart() {
  var canvas = document.getElementById('sleepChart');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var width = canvas.clientWidth || 300;
  var height = canvas.clientHeight || 80;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  var padding = { top: 10, right: 20, bottom: 22, left: 10 };
  var chartW = width - padding.left - padding.right;
  var chartH = height - padding.top - padding.bottom;
  var len = sleepData.length;
  var maxVal = 70, minVal = 0;
  var points = sleepData.map(function (item, i) {
    var x = padding.left + (i / (len - 1)) * chartW;
    var y = padding.top + chartH - ((item.minutes - minVal) / (maxVal - minVal)) * chartH;
    return { x: x, y: y, day: item.day, minutes: item.minutes };
  });
  // 绘制折线
  ctx.beginPath();
  ctx.strokeStyle = '#3A8B7A';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  points.forEach(function (p, i) {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();
  // 绘制数据点和标签
  points.forEach(function (p) {
    ctx.fillStyle = '#9A8EAF';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.day, p.x, height - 2);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, 2 * Math.PI);
    ctx.fillStyle = '#3A8B7A';
    ctx.fill();
  });
}

// 绘制倒计时圆环
function drawCountdownRing(countdown) {
  var canvas = document.getElementById('countdownCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var width = 64, height = 64; // 128rpx = 64px
  var dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  var centerX = width / 2;
  var centerY = height / 2;
  var radius = Math.min(width, height) / 2 - 4;
  ctx.clearRect(0, 0, width, height);
  // 背景圆环
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(58,139,122,0.15)';
  ctx.lineWidth = 3;
  ctx.stroke();
  // 进度圆弧
  var progress = (5 - countdown) / 5;
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * progress);
  ctx.strokeStyle = '#3A8B7A';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.stroke();
}

// ═══ 事件处理函数（actionHandlers） ═══
var actionHandlers = {
  // 底部导航
  onTabTap: function (e, el) {
    var id = el.getAttribute('data-id');
    if (id === data.page) return;
    navigate(id, 'tab');
  },
  // 后退
  onBack: function () { goBack(); },
  // 点击分类
  onCatTap: function (e, el) {
    if (el.getAttribute('data-disabled') === 'true') {
      showCustomToast('内容筹备中，敬请期待');
      return;
    }
    var catId = el.getAttribute('data-id');
    var cat = getCategoryById(catId);
    var subcats = getSubcategories(catId);
    var wp = data.watchedProgress;
    var items = getContentByCategory(catId, '全部').map(function (item) {
      var prog = wp[item.id] || 0;
      return {
        id: item.id, title: item.title, description: item.description,
        imageId: item.imageId, thumbnail: item.thumbnail,
        durationStr: formatDuration(item.durationSeconds),
        playsWan: item.playsWan, isStarted: prog > 0.02 && prog < 0.95
      };
    });
    setData({
      catId: catId, catName: cat ? cat.name : '',
      catSubcats: subcats, catSubcat: '全部', catItems: items
    });
    navigate('category', 'forward');
  },
  // 切换子分类
  onCatSubcatTap: function (e, el) {
    var subcat = el.getAttribute('data-s');
    var wp = data.watchedProgress;
    var items = getContentByCategory(data.catId, subcat).map(function (item) {
      var prog = wp[item.id] || 0;
      return {
        id: item.id, title: item.title, description: item.description,
        imageId: item.imageId, thumbnail: item.thumbnail,
        durationStr: formatDuration(item.durationSeconds),
        playsWan: item.playsWan, isStarted: prog > 0.02 && prog < 0.95
      };
    });
    setData({ catSubcat: subcat, catItems: items });
  },
  // 点击内容条目 → 进入播放器
  onPickTap: function (e, el) {
    var id = el.getAttribute('data-id');
    openContent(id);
  },
  // 迷你播放器
  onMiniOpen: function () { navigate('player', 'forward'); },
  onMiniPlayPause: function () { actionHandlers.onPlayPause(); },
  onMiniClose: function () {
    if (audio) {
      audio.pause();
      _suppressAudioError = true;  // 抑制清空 src 触发的预期 error
      audio.src = '';
    }
    setData({ isPlaying: false, playerContentId: '', showMiniPlayer: false, miniPlayerVisible: false });
  },
  // 播放/暂停
  onPlayPause: function () {
    if (!audio) return;
    if (data.isPlaying) {
      audio.pause();
    } else {
      if (!audio.src && data.playerAudioUrl) {
        audio.src = data.playerAudioUrl;
      }
      audio.play();
    }
  },
  // 上一集/下一集
  onPrevEp: function () {
    if (!data.playerContentId) return;
    var prev = getPrevEpisode(data.playerContentId);
    if (prev) switchEpisode(prev.id);
  },
  onNextEp: function () {
    if (!data.playerContentId) return;
    var next = getNextEpisode(data.playerContentId);
    if (next) switchEpisode(next.id);
  },
  // 倍速
  onCycleSpeed: function () {
    var idx = SPEEDS.indexOf(data.playerSpeed);
    var nextIdx = (idx + 1) % SPEEDS.length;
    var speed = SPEEDS[nextIdx];
    setData({ playerSpeed: speed });
    if (audio) audio.playbackRate = speed;
  },
  // 字号
  onFontDown: function () { setData({ playerFontSize: Math.max(12, data.playerFontSize - 1) }); },
  onFontUp: function () { setData({ playerFontSize: Math.min(20, data.playerFontSize + 1) }); },
  // 功能入口
  onFeatureTap: function (e, el) {
    showCustomToast(el.getAttribute('data-label') + '功能开发中', 1500);
  },
  noop: function () {},
  // ── 定时器弹窗 ──
  onOpenTimer: function () {
    var secs = data.timerSecondsLeft;
    var enabled = secs !== null && secs !== undefined;
    var minutes = enabled ? Math.max(30, Math.min(180, Math.round(secs / 60 / 5) * 5)) : 60;
    // 合并显示值到单次 setData，避免二次渲染导致弹窗入场动画重启
    var disp = _computeTimerDisplayValues(minutes, enabled);
    setData(Object.assign({ showTimer: true, timerEnabled: enabled, timerMinutes: minutes }, disp));
  },
  onCloseTimer: function () {
    if (data.timerClosing) return;
    setData({ timerClosing: true });
    setTimeout(function () { setData({ showTimer: false, timerClosing: false }); }, Math.ceil(380 * ANIM_SCALE));
  },
  onToggleTimerEnabled: function () {
    // 直接更新 data 与 DOM，不触发 setData，避免签名变化导致弹窗重建闪烁
    data.timerEnabled = !data.timerEnabled;
    _recomputeTimerDisplayData();
    _applyTimerDisplayDOM();
  },
  onSelectTimerMark: function (e, el) {
    // 直接更新 data 与 DOM，不触发 setData，避免签名变化导致弹窗重建闪烁
    data.timerMinutes = parseInt(el.getAttribute('data-mins'), 10);
    _recomputeTimerDisplayData();
    _applyTimerDisplayDOM();
  },
  onConfirmTimer: function () {
    if (data.timerClosing) return;
    var enabled = data.timerEnabled;
    var minutes = data.timerMinutes;
    setData({ timerSecondsLeft: enabled ? minutes * 60 : null, timerClosing: true });
    if (enabled) startTimerCountdown(); else stopTimerCountdown();
    updateTimerLabel();
    setTimeout(function () { setData({ showTimer: false, timerClosing: false }); }, Math.ceil(380 * ANIM_SCALE));
  },
  // ── 重播弹窗 ──
  onShowPlayMode: function () { setData({ showPlayMode: true }); },
  onClosePlayMode: function () {
    if (data.playModeClosing) return;
    setData({ playModeClosing: true });
    setTimeout(function () { setData({ showPlayMode: false, playModeClosing: false }); }, Math.ceil(380 * ANIM_SCALE));
  },
  onSelectReplay: function (e, el) {
    // 直接更新 data 与 DOM，不触发 setData，避免签名变化导致弹窗重建闪烁
    var newVal = parseInt(el.getAttribute('data-val'), 10);
    if (data.replayCount === newVal) return;
    data.replayCount = newVal;
    var container = document.getElementById('playerModals');
    if (!container) return;
    var modal = container.querySelector('[data-modal="playmode"]');
    if (!modal) return;
    // 仅替换选项列表的 innerHTML，弹窗本身不重建
    var optsHtml = data.replayOptions.map(function (opt) {
      var active = data.replayCount === opt.val;
      return '<div class="playmode-opt' + (active ? ' playmode-opt-active' : '') + '"' +
        ' data-action="onSelectReplay" data-val="' + opt.val + '" data-catch="true">' +
        '<div class="playmode-radio' + (active ? ' playmode-radio-active' : '') + '">' +
          (active ? '<div class="playmode-radio-dot"></div>' : '') +
        '</div>' +
        '<div class="playmode-opt-text">' +
          '<span class="playmode-opt-label' + (active ? ' playmode-opt-label-active' : '') + '">' + escapeHtml(opt.label) + '</span>' +
          '<span class="playmode-opt-sub">' + escapeHtml(opt.sub) + '</span>' +
        '</div>' +
        (active ? '<span class="playmode-opt-check">✓</span>' : '') +
      '</div>';
    }).join('');
    var optsContainer = modal.querySelector('.playmode-options');
    if (optsContainer) optsContainer.innerHTML = optsHtml;
  },
  onConfirmPlayMode: function () {
    if (data.playModeClosing) return;
    setData({ currentEpisodePlays: 0, playModeClosing: true });
    updateReplayLabel();
    setTimeout(function () { setData({ showPlayMode: false, playModeClosing: false }); }, Math.ceil(380 * ANIM_SCALE));
  },
  // ── 选集面板 ──
  onShowEpisodeList: function () {
    refreshEpisodeList();
    setData({ showEpisodeList: true });
  },
  onCloseEpisodeList: function () {
    if (data.episodeListClosing) return;
    setData({ episodeListClosing: true });
    setTimeout(function () { setData({ showEpisodeList: false, episodeListClosing: false }); }, Math.ceil(380 * ANIM_SCALE));
  },
  onPlayEpisode: function (e, el) {
    if (data.episodeListClosing) return;
    var id = el.getAttribute('data-id');
    setData({ episodeListClosing: true });
    setTimeout(function () {
      setData({ showEpisodeList: false, episodeListClosing: false });
      if (id !== data.playerContentId) switchEpisode(id);
    }, Math.ceil(380 * ANIM_SCALE));
  },
  // ── 自动连播 ──
  onCancelAdvance: function () { stopAutoAdvance(); },
  // ── 搜索 ──
  onSearchInput: function (e) {
    data.searchQuery = e.target.value;
  },
  onSearchConfirm: function () {
    var q = data.searchQuery;
    if (q) doSearch(q);
  },
  onSearchClear: function () {
    setData({ searchQuery: '', searchSearched: false, searchResults: [] });
  },
  onSearchDo: function (e, el) {
    doSearch(el.getAttribute('data-q'));
  },
  onSearchClearHistory: function () {
    setData({ searchHistory: [] });
    saveSearchHistory();
  }
};
// ═══ 音频初始化（替代 BackgroundAudioManager） ═══
var audio = new Audio();
// 标志位：抑制关闭迷你播放器时 audio.src='' 触发的预期 error 事件
var _suppressAudioError = false;
// 播放进度更新
audio.addEventListener('timeupdate', function () {
  if (data.isDraggingProgress) return;
  var current = audio.currentTime || 0;
  var duration = audio.duration || data.playerDuration;
  if (duration <= 0) return;
  var progress = Math.min(current / duration, 1);
  var paras = data.playerParagraphs;
  var currentPara = Math.min(Math.floor(progress * paras.length), Math.max(0, paras.length - 1));
  // 预先计算迷你播放器文案（与 data.miniMeta 保持同步，避免 renderMiniPlayer 用陈旧值覆盖导致进度条乱跳）
  var mpContent = getContentById(data.playerContentId);
  var mpCat = mpContent ? getCategoryById(mpContent.categoryId) : null;
  var miniMetaText = (mpCat ? mpCat.name : '') + ' · ' + formatTime(current) + ' / ' + formatTime(duration);
  var updates = {
    playerCurrentTime: current,
    playerProgress: progress,
    playerCurrentPara: currentPara,
    playerCurrentTimeStr: formatTime(current),
    // 同步迷你播放器状态，防止 renderMiniPlayer 在其他 setData 触发时用旧值回退进度条
    miniProgress: progress,
    miniMeta: miniMetaText
  };
  if (Math.abs(duration - data.playerDuration) > 0.5) {
    updates.playerDuration = duration;
    updates.playerDurationStr = formatTime(duration);
  }
  // 直接更新 data，避免频繁 setData 导致完整重渲染
  Object.assign(data, updates);
  // 仅更新进度条相关 DOM
  updateProgressDOM();
  // 每10秒保存收听进度
  var secs = Math.floor(current);
  if (secs > 0 && secs % 10 === 0) {
    data.watchedProgress[data.playerContentId] = progress;
  }
  // 更新迷你播放器进度条（即时 DOM 更新）
  var mpBar = document.getElementById('mpBar');
  if (mpBar) mpBar.style.width = (progress * 100) + '%';
  var mpMeta = document.getElementById('mpMeta');
  if (mpMeta) mpMeta.textContent = miniMetaText;
  // 更新选集弹窗中当前播放项的进度条（即时 DOM 更新）
  if (data.showEpisodeList) {
    var epModal = document.querySelector('[data-modal="episode"]');
    if (epModal) {
      var epFill = epModal.querySelector('.episode-item-progress-fill');
      if (epFill) epFill.style.width = (progress * 100) + '%';
    }
  }
});
// 播放结束
audio.addEventListener('ended', function () { handleTrackEnd(); });
// 播放开始
audio.addEventListener('play', function () { data.isPlaying = true; updatePlayBtnDOM(); });
// 播放暂停
audio.addEventListener('pause', function () { data.isPlaying = false; updatePlayBtnDOM(); });
// 播放错误
audio.addEventListener('error', function () {
  // 关闭迷你播放器时主动清空 src 会触发 error，此时不提示
  if (_suppressAudioError) { _suppressAudioError = false; return; }
  showCustomToast('音频加载失败', 2000);
  data.isPlaying = false;
  updatePlayBtnDOM();
});

// 更新播放按钮 DOM（避免完整重渲染）
function updatePlayBtnDOM() {
  var el = document.getElementById('page-player');
  if (!el) return;
  var playBtn = el.querySelector('.player-play-btn');
  var playIcon = el.querySelector('.player-play-btn-icon');
  if (playBtn) {
    playBtn.className = 'player-play-btn' + (data.isPlaying ? ' player-play-glow' : '');
  }
  // 仅在 src 变化时更新，避免重复加载
  var newPlaySrc = data.isPlaying ? icon('pause-white') : icon('play-white');
  if (playIcon && playIcon.getAttribute('src') !== newPlaySrc) playIcon.src = newPlaySrc;
  // 迷你播放器图标
  var mpPlayIcon = document.getElementById('mpPlayIcon');
  var newMpSrc = data.isPlaying ? icon('pause-gold') : icon('play-gold');
  if (mpPlayIcon && mpPlayIcon.getAttribute('src') !== newMpSrc) mpPlayIcon.src = newMpSrc;
}

// ═══ 事件委托（data-action + data-catch） ═══
function initEvents() {
  document.addEventListener('click', function (e) {
    // 检查 data-catch 阻止冒泡（弹窗内部点击不触发关闭）
    var catchEl = e.target.closest('[data-catch]');
    if (catchEl) {
      // 阻止冒泡到 overlay 的关闭动作
      e.stopPropagation();
      // 但仍需执行该元素自身的 action
      var actionElCatch = catchEl.closest('[data-action]');
      if (actionElCatch && actionElCatch === catchEl) {
        var actionCatch = actionElCatch.getAttribute('data-action');
        var handlerCatch = actionHandlers[actionCatch];
        if (handlerCatch) handlerCatch(e, actionElCatch);
      }
      e.stopPropagation();
      return;
    }
    // 查找最近的 action 元素
    var actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    var handler = actionHandlers[action];
    if (handler) handler(e, actionEl);
  }, true); // 使用捕获阶段以便 data-catch 优先处理
}

// ═══ 初始化 ═══
function init() {
  convertRpx();       // rpx 转 px
  loadStorage();      // 加载本地存储
  loadHomeData();     // 加载首页数据
  renderAll();        // 首次渲染
  initCarousel();     // 初始化轮播自动播放
  initEvents();       // 初始化事件委托
}
init();

})(); // IIFE 闭合
</script>
