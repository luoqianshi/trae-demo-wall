<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骰子淘汰游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a; color: #fff; font-family: 'Microsoft YaHei', sans-serif;
  display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  padding: 20px; overflow-x: hidden;
}
#particles {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.particle {
  position: absolute; border-radius: 50%;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
h1 {
  margin: 10px 0 5px; font-size: 2.5em; font-weight: 900;
  background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6b6b);
  background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: gradientShift 4s ease infinite;
  text-shadow: none; letter-spacing: 4px; position: relative; z-index: 1;
}
@keyframes gradientShift {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.info { text-align: center; margin: 5px 0; position: relative; z-index: 1; }
.round-info {
  font-size: 1.1em; color: #ffd93d; text-shadow: 0 0 10px rgba(255,217,61,0.5);
  background: rgba(0,0,0,0.4); padding: 8px 20px; border-radius: 20px;
  display: inline-block; margin-bottom: 10px;
  border: 1px solid rgba(255,217,61,0.3);
}
.dice-area { display: flex; gap: 24px; justify-content: center; align-items: center; min-height: 130px; margin: 10px 0; position: relative; z-index: 1; }
.dice-stage { perspective: 800px; }
.dice-cube { width: 80px; height: 80px; position: relative; transform-style: preserve-3d; }
.dice-cube.rolling { animation: diceRoll 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
.dice-cube .face {
  position: absolute; width: 80px; height: 80px; border-radius: 14px;
  background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
  border: 2px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(100,100,255,0.3);
  backface-visibility: hidden;
}
.dice-cube .face .dot {
  position: absolute; width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #fff, #ff6b6b);
  box-shadow: 0 0 8px rgba(255,107,107,0.8);
}
.dice-cube .face.front  { transform: translateZ(40px); }
.dice-cube .face.back   { transform: rotateY(180deg) translateZ(40px); }
.dice-cube .face.right  { transform: rotateY(90deg) translateZ(40px); }
.dice-cube .face.left   { transform: rotateY(-90deg) translateZ(40px); }
.dice-cube .face.top    { transform: rotateX(90deg) translateZ(40px); }
.dice-cube .face.bottom { transform: rotateX(-90deg) translateZ(40px); }

@keyframes diceRoll {
  0%   { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1); }
  20%  { transform: rotateX(200deg) rotateY(120deg) rotateZ(40deg) scale(1.15); }
  40%  { transform: rotateX(400deg) rotateY(240deg) rotateZ(80deg) scale(0.95); }
  60%  { transform: rotateX(600deg) rotateY(360deg) rotateZ(120deg) scale(1.1); }
  80%  { transform: rotateX(800deg) rotateY(480deg) rotateZ(160deg) scale(0.98); }
  100% { transform: rotateX(1080deg) rotateY(720deg) rotateZ(0deg) scale(1); }
}

.dice-final {
  font-size: 3em; font-weight: 900; letter-spacing: 8px;
  background: linear-gradient(135deg, #ff6b6b, #ffd93d);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  text-shadow: none; filter: drop-shadow(0 0 20px rgba(255,107,107,0.6));
}
@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}

.result-text {
  font-size: 1.1em; color: #ff6b6b; margin-top: 10px;
  text-shadow: 0 0 10px rgba(255,107,107,0.5); min-height: 24px;
  position: relative; z-index: 1;
}
.result-text.win {
  font-size: 1.5em; color: #ffd93d;
  text-shadow: 0 0 20px rgba(255,217,61,0.8);
  animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}

.grids { display: flex; gap: 16px; margin: 15px 0; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
.grid {
  background: rgba(20, 20, 50, 0.8); border: 2px solid rgba(100, 100, 255, 0.3);
  border-radius: 16px; width: 185px; min-height: 220px; padding: 14px;
  transition: all 0.5s ease; backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.grid:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(100,100,255,0.2); }
.grid.active { border-color: rgba(100,200,100,0.5); box-shadow: 0 0 20px rgba(100,200,100,0.15); }
.grid.eliminated {
  background: rgba(30, 5, 5, 0.8); border-color: rgba(255,80,80,0.4);
  animation: gridShake 0.5s ease;
}
@keyframes gridShake {
  0%,100% { transform: translateX(0); }
  10% { transform: translateX(-8px); }
  20% { transform: translateX(8px); }
  30% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  50% { transform: translateX(-4px); }
  60% { transform: translateX(4px); }
  70% { transform: translateX(-2px); }
  80% { transform: translateX(2px); }
}
.grid h3 { text-align: center; font-size: 1.3em; margin-bottom: 6px; letter-spacing: 2px; }
.grid:nth-child(1) h3 { color: #ff6b6b; }
.grid:nth-child(2) h3 { color: #ffd93d; }
.grid:nth-child(3) h3 { color: #6bcb77; }
.grid:nth-child(4) h3 { color: #4d96ff; }
.grid:nth-child(5) h3 { color: #ff922b; }
.grid .count { text-align: center; color: #aaa; font-size: 0.85em; margin-bottom: 8px; }
.grid .people { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.grid .person {
  width: 22px; height: 22px; border-radius: 50%; font-size: 9px;
  display: flex; align-items: center; justify-content: center; color: #fff;
  font-weight: bold; transition: all 0.3s ease;
}
.grid:nth-child(1) .person { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); box-shadow: 0 0 6px rgba(255,107,107,0.5); }
.grid:nth-child(2) .person { background: linear-gradient(135deg, #ffd93d, #f0c000); box-shadow: 0 0 6px rgba(255,217,61,0.5); }
.grid:nth-child(3) .person { background: linear-gradient(135deg, #6bcb77, #4aaf5a); box-shadow: 0 0 6px rgba(107,203,119,0.5); }
.grid:nth-child(4) .person { background: linear-gradient(135deg, #4d96ff, #3a7fe0); box-shadow: 0 0 6px rgba(77,150,255,0.5); }
.grid:nth-child(5) .person { background: linear-gradient(135deg, #ff922b, #e07a20); box-shadow: 0 0 6px rgba(255,146,43,0.5); }

.controls { margin: 15px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
.btn {
  padding: 12px 28px; font-size: 1em; font-weight: bold; border: none; border-radius: 30px;
  cursor: pointer; color: #fff; letter-spacing: 1px; transition: all 0.3s ease;
  position: relative; overflow: hidden;
}
.btn::after {
  content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
  border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.5s;
  transform: translate(-50%, -50%);
}
.btn:active::after { width: 300px; height: 300px; }
.btn-next { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); box-shadow: 0 4px 15px rgba(255,107,107,0.4); }
.btn-next:hover { box-shadow: 0 6px 25px rgba(255,107,107,0.6); transform: translateY(-2px); }
.btn-auto { background: linear-gradient(135deg, #6bcb77, #4aaf5a); box-shadow: 0 4px 15px rgba(107,203,119,0.4); }
.btn-auto:hover { box-shadow: 0 6px 25px rgba(107,203,119,0.6); transform: translateY(-2px); }
.btn-reset { background: linear-gradient(135deg, #4d96ff, #3a7fe0); box-shadow: 0 4px 15px rgba(77,150,255,0.4); }
.btn-reset:hover { box-shadow: 0 6px 25px rgba(77,150,255,0.6); transform: translateY(-2px); }
.btn:disabled { background: #444 !important; box-shadow: none !important; cursor: not-allowed; transform: none !important; }

.speed-control { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.9em; }
.speed-control input[type=range] {
  width: 100px; height: 4px; -webkit-appearance: none; background: rgba(255,255,255,0.15);
  border-radius: 2px; outline: none;
}
.speed-control input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: #ff6b6b; cursor: pointer; box-shadow: 0 0 10px rgba(255,107,107,0.5);
}

#sparkContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
.spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; animation: sparkFly 0.8s ease-out forwards; }
@keyframes sparkFly {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="sparkContainer"></div>
<h1>DICE ROYALE</h1>
<div class="info">
  <div class="round-info" id="roundInfo">第 1 局 · 1 个骰子</div>
  <div class="dice-area" id="diceArea"></div>
  <div class="result-text" id="resultText"></div>
</div>
<div class="grids" id="grids"></div>
<div class="controls">
  <button class="btn btn-next" id="btnNext" onclick="nextRound()">下一局</button>
  <button class="btn btn-auto" id="btnAuto" onclick="autoPlay()">自动播放</button>
  <button class="btn btn-reset" id="btnReset" onclick="reset()">重置</button>
  <div class="speed-control">
    <span>速度</span>
    <input type="range" id="speed" min="300" max="2000" value="800" step="50">
    <span id="speedVal">800ms</span>
  </div>
</div>
<script>
let grids = { 1: [], 2: [], 3: [], 4: [], 5: [] };
let round = 0;
let gameOver = false;
let autoTimer = null;
let animating = false;

const dotPositions = {
  1: [[50,50]],
  2: [[25,25],[75,75]],
  3: [[25,25],[50,50],[75,75]],
  4: [[25,25],[25,75],[75,25],[75,75]],
  5: [[25,25],[25,75],[50,50],[75,25],[75,75]]
};

function getDotsHTML(n) {
  let dots = dotPositions[n] || [];
  return dots.map(([x,y]) => `<div class="dot" style="left:${x-7}px;top:${y-7}px"></div>`).join('');
}

function getFaceRotation(n) {
  const map = {
    1: 'rotateX(0deg) rotateY(0deg)',
    2: 'rotateX(0deg) rotateY(90deg)',
    3: 'rotateX(-90deg)',
    4: 'rotateX(90deg)',
    5: 'rotateX(0deg) rotateY(-90deg)'
  };
  return map[n] || '';
}

function init() {
  grids = { 1: [], 2: [], 3: [], 4: [], 5: [] };
  for (let i = 1; i <= 100; i++) {
    let n = Math.floor(Math.random() * 5) + 1;
    grids[n].push(i);
  }
  round = 0;
  gameOver = false;
  animating = false;
  document.getElementById('btnNext').disabled = false;
  document.getElementById('btnAuto').disabled = false;
  document.getElementById('diceArea').innerHTML = '';
  document.getElementById('resultText').innerHTML = '';
  document.getElementById('resultText').className = 'result-text';
  document.getElementById('roundInfo').innerHTML = '第 1 局 · 1 个骰子';
  render();
}

function render() {
  let container = document.getElementById('grids');
  let html = '';
  for (let g = 1; g <= 5; g++) {
    let eliminated = grids[g].length === 0;
    let cls = 'grid';
    if (eliminated) cls += ' eliminated';
    else if (grids[g].length > 0) cls += ' active';
    html += `<div class="${cls}" id="grid${g}"><h3>格子 ${g}</h3>`;
    html += `<div class="count">${grids[g].length} 人</div><div class="people">`;
    for (let id of grids[g]) {
      html += `<div class="person">${id}</div>`;
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

function rollDiceResult(count) {
  let results = [];
  for (let i = 0; i < count; i++) {
    results.push(Math.floor(Math.random() * 5) + 1);
  }
  return results;
}

function animateDice(diceResults, callback) {
  let diceCount = diceResults.length;
  let html = '';
  for (let i = 0; i < diceCount; i++) {
    html += `<div class="dice-stage"><div class="dice-cube" id="dice${i}">
      <div class="face front">${getDotsHTML(1)}</div>
      <div class="face right">${getDotsHTML(2)}</div>
      <div class="face top">${getDotsHTML(3)}</div>
      <div class="face bottom">${getDotsHTML(4)}</div>
      <div class="face left">${getDotsHTML(5)}</div>
      <div class="face back"></div>
    </div></div>`;
  }
  document.getElementById('diceArea').innerHTML = html;

  requestAnimationFrame(() => {
    let cubes = [];
    for (let i = 0; i < diceCount; i++) {
      cubes.push(document.getElementById('dice' + i));
    }
    cubes.forEach(c => c.classList.add('rolling'));

    setTimeout(() => {
      cubes.forEach((c, i) => {
        c.classList.remove('rolling');
        c.style.transform = getFaceRotation(diceResults[i]);
      });
      setTimeout(() => {
        let nums = diceResults.map(n => `<span style="--i:${n-1}">${n}</span>`).join('');
        document.getElementById('diceArea').innerHTML = `<div class="dice-final">${nums}</div>`;
        callback();
      }, 350);
    }, 800);
  });
}

function spawnSparks(gridNum) {
  let el = document.getElementById('grid' + gridNum);
  if (!el) return;
  let rect = el.getBoundingClientRect();
  let cx = rect.left + rect.width / 2;
  let cy = rect.top + rect.height / 2;
  let container = document.getElementById('sparkContainer');
  let colors = ['#ff6b6b','#ffd93d','#ff922b','#ff4444','#ffaa00'];
  for (let i = 0; i < 20; i++) {
    let spark = document.createElement('div');
    spark.className = 'spark';
    let angle = Math.random() * Math.PI * 2;
    let dist = 40 + Math.random() * 80;
    spark.style.cssText = `
      left:${cx}px; top:${cy}px;
      --sx:${Math.cos(angle)*dist}px;
      --sy:${Math.sin(angle)*dist}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-delay:${Math.random()*0.2}s;
      width:${4+Math.random()*8}px;
      height:${4+Math.random()*8}px;
    `;
    container.appendChild(spark);
    setTimeout(() => spark.remove(), 1000);
  }
}

function redistribute() {
  let allSurvivors = [];
  for (let g = 1; g <= 5; g++) {
    allSurvivors.push(...grids[g]);
    grids[g] = [];
  }
  for (let id of allSurvivors) {
    let n = Math.floor(Math.random() * 5) + 1;
    grids[n].push(id);
  }
}

function nextRound() {
  if (gameOver || animating) return;
  let totalPeople = Object.values(grids).reduce((s, a) => s + a.length, 0);
  if (totalPeople <= 1) { endGame(); return; }

  animating = true;
  document.getElementById('btnNext').disabled = true;
  document.getElementById('btnAuto').disabled = true;

  round++;
  let diceCount = ((round - 1) % 5) + 1;
  let diceResults = rollDiceResult(diceCount);

  document.getElementById('roundInfo').innerHTML = `第 ${round} 局 · ${diceCount} 个骰子`;

  animateDice(diceResults, () => {
    let eliminated = new Set(diceResults);
    for (let n of eliminated) {
      if (grids[n].length > 0) spawnSparks(n);
      grids[n] = [];
    }
    let remaining = Object.values(grids).reduce((s, a) => s + a.length, 0);
    if (remaining > 1) redistribute();
    document.getElementById('resultText').innerHTML = `格子 ${[...eliminated].join(', ')} 出局 · 剩余 ${remaining} 人`;
    render();
    animating = false;
    if (!gameOver) {
      document.getElementById('btnNext').disabled = false;
      document.getElementById('btnAuto').disabled = false;
    }
    if (remaining <= 1) endGame();
  });
}

function endGame() {
  gameOver = true;
  animating = false;
  document.getElementById('btnNext').disabled = true;
  document.getElementById('btnAuto').disabled = true;
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  let survivors = [];
  for (let g = 1; g <= 5; g++) {
    if (grids[g].length > 0) survivors.push(...grids[g]);
  }
  let el = document.getElementById('resultText');
  el.className = 'result-text win';
  if (survivors.length === 1) {
    el.innerHTML = `🏆 获胜者：第 ${survivors[0]} 号`;
  } else {
    el.innerHTML = '无人幸存';
  }
}

function autoPlay() {
  if (autoTimer) {
    clearTimeout(autoTimer);
    autoTimer = null;
    document.getElementById('btnAuto').textContent = '自动播放';
    return;
  }
  document.getElementById('btnAuto').textContent = '停止';
  let speed = parseInt(document.getElementById('speed').value);
  function run() {
    if (gameOver) { clearTimeout(autoTimer); autoTimer = null; document.getElementById('btnAuto').textContent = '自动播放'; return; }
    if (animating) return;
    nextRound();
    if (!gameOver) autoTimer = setTimeout(run, speed);
  }
  autoTimer = setTimeout(run, speed);
}

function reset() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  document.getElementById('btnAuto').textContent = '自动播放';
  init();
}

document.getElementById('speed').addEventListener('input', function() {
  document.getElementById('speedVal').textContent = this.value + 'ms';
});

(function bgParticles() {
  let canvas = document.getElementById('particles');
  let ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  let particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      r: 1 + Math.random() * 2, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
      alpha: 0.3 + Math.random() * 0.5
    });
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(100,140,255,${p.alpha})`;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    }
    let lines = [];
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        let dx = particles[i].x - particles[j].x;
        let dy = particles[i].y - particles[j].y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) lines.push({i, j, dist});
      }
    }
    for (let l of lines) {
      ctx.beginPath();
      ctx.moveTo(particles[l.i].x, particles[l.i].y);
      ctx.lineTo(particles[l.j].x, particles[l.j].y);
      ctx.strokeStyle = `rgba(100,140,255,${0.08 * (1 - l.dist / 120)})`;
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
})();

init();
</script>
</body>
</html>
