<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系八大行星 - 小朋友学天文</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0d0d2d 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-align: center;
            z-index: 10;
        }

        .subtitle {
            color: #a0a0ff;
            font-size: 1.1rem;
            margin-bottom: 30px;
            z-index: 10;
        }

        canvas {
            display: block;
            border-radius: 10px;
            cursor: grab;
            box-shadow: 0 0 50px rgba(100, 100, 255, 0.3);
        }

        .controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 10;
        }

        .control-btn {
            background: linear-gradient(135deg, #4a90d9, #357abd);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(74, 144, 217, 0.6);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .speed-control label {
            font-size: 0.9rem;
        }

        .speed-control input[type="range"] {
            width: 100px;
            accent-color: #4a90d9;
        }

        .speed-value {
            min-width: 30px;
            text-align: center;
        }

        .planet-card {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            max-width: 300px;
            color: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.3s ease;
            z-index: 100;
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .planet-card.show {
            display: block;
        }

        .planet-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .planet-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: 0 0 20px currentColor;
        }

        .planet-name {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .planet-name-en {
            font-size: 0.9rem;
            color: #aaa;
        }

        .planet-info {
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-label {
            color: #888;
            font-size: 0.85rem;
        }

        .info-value {
            color: #fff;
            font-weight: 500;
        }

        .planet-description {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #ddd;
        }

        .fun-fact {
            background: rgba(255, 215, 0, 0.1);
            border-left: 3px solid #ffd700;
            padding: 12px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #ffd700;
            font-style: italic;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .legend {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            color: white;
            z-index: 10;
        }

        .legend-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffd700;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .legend-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .legend-item:hover .legend-dot {
            transform: scale(1.3);
            box-shadow: 0 0 10px currentColor;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 0.9rem;
            }

            .controls {
                flex-wrap: wrap;
                justify-content: center;
                padding: 10px 20px;
                bottom: 15px;
            }

            .legend {
                display: none;
            }

            .planet-card {
                max-width: 90%;
                left: 5%;
                right: 5%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌 太阳系八大行星</h1>
        <p class="subtitle">点击行星了解更多知识哦！</p>
        
        <canvas id="solarSystem"></canvas>
        
        <div class="controls">
            <button class="control-btn" id="playBtn">
                ▶️ 播放
            </button>
            <div class="speed-control">
                <label for="speedSlider">速度:</label>
                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1">
                <span class="speed-value" id="speedValue">1x</span>
            </div>
            <button class="control-btn" id="fullscreenBtn">
                ⛶ 全屏
            </button>
        </div>

        <div class="legend">
            <div class="legend-title">太阳系天体</div>
            <div class="legend-item" data-planet="太阳"><div class="legend-dot" style="background: #ffd700; box-shadow: 0 0 8px #ffd700;"></div>太阳</div>
            <div class="legend-item" data-planet="水星"><div class="legend-dot" style="background: #8c8c8c;"></div>水星</div>
            <div class="legend-item" data-planet="金星"><div class="legend-dot" style="background: #e6c87a;"></div>金星</div>
            <div class="legend-item" data-planet="地球"><div class="legend-dot" style="background: #4a90d9;"></div>地球</div>
            <div class="legend-item" data-planet="火星"><div class="legend-dot" style="background: #e67a5d;"></div>火星</div>
            <div class="legend-item" data-planet="木星"><div class="legend-dot" style="background: #d4a574;"></div>木星</div>
            <div class="legend-item" data-planet="土星"><div class="legend-dot" style="background: #f0d078;"></div>土星</div>
            <div class="legend-item" data-planet="天王星"><div class="legend-dot" style="background: #7dd3d8;"></div>天王星</div>
            <div class="legend-item" data-planet="海王星"><div class="legend-dot" style="background: #4a6cf7;"></div>海王星</div>
        </div>

        <div class="planet-card" id="planetCard">
            <button class="close-btn" id="closeCardBtn">×</button>
            <div class="planet-header">
                <div class="planet-icon" id="cardIcon"></div>
                <div>
                    <div class="planet-name" id="cardName"></div>
                    <div class="planet-name-en" id="cardNameEn"></div>
                </div>
            </div>
            <div class="planet-info">
                <div class="info-row">
                    <span class="info-label">直径</span>
                    <span class="info-value" id="cardDiameter"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">距离太阳</span>
                    <span class="info-value" id="cardDistance"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">公转周期</span>
                    <span class="info-value" id="cardPeriod"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">自转周期</span>
                    <span class="info-value" id="cardRotation"></span>
                </div>
            </div>
            <div class="planet-description" id="cardDescription"></div>
            <div class="fun-fact" id="cardFunFact"></div>
        </div>
    </div>

    <script>
        const sunData = {

        const planets = [

                description: '金星是太阳系中最热的行星，表面温度高达465°C。它被厚厚的二氧化碳大气层包围。',
                funFact: '金星是唯一逆向自转的行星，太阳从西边升起，东边落下！'
            },
            {
                name: '地球',
                nameEn: 'Earth',
                diameter: 12742,
                distance: 1,
                orbitRadius: 1.85,
                eccentricity: 0.017,
                color: '#4a90d9',

                speed: 1,
                size: 9,
                period: '365天',
                rotation: '24小时',
                description: '地球是我们的家园，是太阳系中唯一已知存在生命的行星。它有71%的表面被水覆盖。',
                funFact: '地球并不是完美的球体，赤道略微隆起，两极稍扁。'
            },
            {
                name: '火星',
                nameEn: 'Mars',
                diameter: 6779,
                distance: 1.52,
                orbitRadius: 2.35,
                eccentricity: 0.093,
                color: '#e67a5d',
                glowColor: 'rgba(230, 122, 93, 0.5)',
                speed: 0.53,
                size: 7,
                period: '687天',
                rotation: '24.6小时',
                description: '火星被称为"红色星球"，因为它的表面覆盖着氧化铁。火星上有太阳系中最大的火山和峡谷。',
                funFact: '火星上的奥林帕斯山是太阳系最高的火山，高度达到了21公里！'
            },
            {
                name: '木星',
                nameEn: 'Jupiter',
                diameter: 139820,
                distance: 5.20,
                orbitRadius: 3.3,
                eccentricity: 0.049,
                color: '#d4a574',
                glowColor: 'rgba(212, 165, 116, 0.5)',

                size: 20,
                period: '12年',
                rotation: '10小时',
                description: '木星是太阳系中最大的行星，它的体积是地球的1300倍。木星上有著名的大红斑风暴。',
                funFact: '木星自转速度最快，一天只有大约10小时！'
            },
            {
                name: '土星',
                nameEn: 'Saturn',
                diameter: 116460,
                distance: 9.54,
                orbitRadius: 4.2,
                eccentricity: 0.057,
                color: '#f0d078',
                glowColor: 'rgba(240, 208, 120, 0.5)',
                speed: 0.03,
                size: 18,
                hasRings: true,
                period: '29年',
                rotation: '10.7小时',
                description: '土星以其美丽的光环而闻名。这些光环主要由冰块和岩石碎片组成。',
                funFact: '土星的密度比水还小，如果有一个足够大的海洋，土星会漂浮在水面上！'
            },
            {
                name: '天王星',
                nameEn: 'Uranus',
                diameter: 50724,
                distance: 19.22,
                orbitRadius: 5.1,
                eccentricity: 0.046,
                color: '#7dd3d8',
                glowColor: 'rgba(125, 211, 216, 0.5)',
                speed: 0.01,
                size: 13,
                period: '84年',
                rotation: '17.2小时',
                description: '天王星是一颗冰巨星，它几乎是躺在轨道上运行的，自转轴倾斜角度达98度。',
                funFact: '天王星是最冷的行星，表面温度低至-224°C！'
            },
            {
                name: '海王星',
                nameEn: 'Neptune',
                diameter: 49244,
                distance: 30.06,
                orbitRadius: 6,
                eccentricity: 0.010,
                color: '#4a6cf7',
                glowColor: 'rgba(74, 108, 247, 0.5)',
                speed: 0.006,
                size: 12,
                period: '165年',
                rotation: '16.1小时',
                description: '海王星是太阳系最远的行星，它有太阳系最强的风暴，风速可达2100公里/小时。',
                funFact: '海王星是唯一通过数学计算预测发现的行星！'
            }
        ];

        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const planetCard = document.getElementById('planetCard');
        const closeCardBtn = document.getElementById('closeCardBtn');

        let isPlaying = true;
        let animationId;
        let time = 0;
        let scale = 1;
        let zoom = 1;
        let offsetX = 0;
        let offsetY = 0;
        let stars = [];
        let nebulae = [];
        let milkyWayDust = [];
        let shootingStars = [];
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let dragStartX = 0;
        let dragStartY = 0;
        let planetTrails = {};
        let hoveredPlanet = null;

        function resizeCanvas() {
            const isFullscreen = document.fullscreenElement;
            const padding = isFullscreen ? 20 : 100;
            const verticalPadding = isFullscreen ? 20 : 200;
            const maxWidth = isFullscreen ? window.innerWidth - padding : Math.min(window.innerWidth - padding, 1200);
            const maxHeight = isFullscreen ? window.innerHeight - verticalPadding : Math.min(window.innerHeight - verticalPadding, 800);
            canvas.width = maxWidth;
            canvas.height = maxHeight;
            
            if (isFullscreen) {
                document.querySelector('h1').style.display = 'none';
                document.querySelector('.subtitle').style.display = 'none';
            } else {
                document.querySelector('h1').style.display = 'block';
                document.querySelector('.subtitle').style.display = 'block';
            }
            
            calculateScale();
            initStars();
        }

        function calculateScale() {
            const maxOrbit = planets[planets.length - 1].orbitRadius;
            const availableWidth = canvas.width - 100;
            const availableHeight = canvas.height - 100;
            scale = Math.min(availableWidth, availableHeight) / (maxOrbit * 2 + 1);
        }

        function initStars() {
            stars = [];
            const starCount = 800;
            for (let i = 0; i < starCount; i++) {
                const colorType = Math.random();
                let color = '#ffffff';
                if (colorType < 0.1) {
                    color = '#ffd700';
                } else if (colorType < 0.25) {
                    color = '#add8e6';
                } else if (colorType < 0.4) {
                    color = '#ffb6c1';
                } else if (colorType < 0.55) {
                    color = '#98fb98';
                }
                
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.3,
                    baseAlpha: Math.random() * 0.5 + 0.2,
                    twinkleSpeed: Math.random() * 0.03 + 0.005,
                    twinkleOffset: Math.random() * Math.PI * 2,
                    color: color
                });
            }
            
            initNebulae();
            initMilkyWayDust();
            initPlanetTrails();
        }

        function initMilkyWayDust() {
            milkyWayDust = [];
            const dustCount = 300;
            for (let i = 0; i < dustCount; i++) {
                milkyWayDust.push({
                    baseX: Math.random() * canvas.width,
                    baseY: Math.random() * 200 - 100,
                    size: Math.random() * 1.5 + 0.3,
                    baseAlpha: Math.random() * 0.2 + 0.05,
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    twinkleOffset: Math.random() * Math.PI * 2,
                    driftX: (Math.random() - 0.5) * 0.2,
                    driftY: (Math.random() - 0.5) * 0.1
                });
            }
        }

        function initNebulae() {
            nebulae = [];
            const colors = [
                'rgba(100, 50, 150, 0.08)',
                'rgba(50, 100, 150, 0.06)',
                'rgba(150, 50, 100, 0.07)',
                'rgba(50, 150, 100, 0.05)',
                'rgba(150, 100, 50, 0.06)',
                'rgba(100, 150, 50, 0.05)'
            ];
            
            for (let i = 0; i < 6; i++) {
                nebulae.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 200 + 100,
                    color: colors[i % colors.length],
                    pulseSpeed: Math.random() * 0.02 + 0.005,
                    pulseOffset: Math.random() * Math.PI * 2
                });
            }
        }

        function initPlanetTrails() {
            planetTrails = {};
            planets.forEach(planet => {
                planetTrails[planet.name] = [];
            });
        }

        function getPlanetPosition(planet, t) {
            const centerX = canvas.width / 2 + offsetX;
            const centerY = canvas.height / 2 + offsetY;
            const a = planet.orbitRadius * scale * zoom;
            const e = planet.eccentricity || 0;
            const b = a * Math.sqrt(1 - e * e);
            const c = a * e;
            
            const angle = t * planet.speed;
            const x = centerX + c + Math.cos(angle) * a;
            const y = centerY + Math.sin(angle) * b;
            
            return {
                x: x,
                y: y,
                angle: angle,
                a: a,
                b: b,
                c: c
            };
        }

        function drawStarBackground() {
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#050510');
            gradient.addColorStop(0.3, '#0a0a20');
            gradient.addColorStop(0.5, '#101030');
            gradient.addColorStop(0.7, '#0a0a20');
            gradient.addColorStop(1, '#050510');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (const nebula of nebulae) {
                const pulseAlpha = Math.sin(time * nebula.pulseSpeed + nebula.pulseOffset) * 0.3 + 0.7;
                const rgb = nebula.color.match(/(\d+)/g);
                const color = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${parseFloat(rgb[3]) * pulseAlpha})`;
                
                const gradient = ctx.createRadialGradient(nebula.x, nebula.y, 0, nebula.x, nebula.y, nebula.radius);
                gradient.addColorStop(0, color);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(nebula.x - nebula.radius, nebula.y - nebula.radius, nebula.radius * 2, nebula.radius * 2);
            }

            const milkyWayY = canvas.height * 0.5;
            const milkyWayGradient = ctx.createLinearGradient(0, milkyWayY - 100, 0, milkyWayY + 100);
            milkyWayGradient.addColorStop(0, 'transparent');
            milkyWayGradient.addColorStop(0.3, 'rgba(100, 100, 200, 0.1)');
            milkyWayGradient.addColorStop(0.5, 'rgba(150, 100, 255, 0.15)');
            milkyWayGradient.addColorStop(0.7, 'rgba(100, 100, 200, 0.1)');
            milkyWayGradient.addColorStop(1, 'transparent');
            ctx.fillStyle = milkyWayGradient;
            ctx.fillRect(0, milkyWayY - 150, canvas.width, 300);

            for (const dust of milkyWayDust) {
                const mwX = dust.baseX + time * dust.driftX;
                const mwY = milkyWayY + dust.baseY;
                const alpha = dust.baseAlpha + Math.sin(time * dust.twinkleSpeed + dust.twinkleOffset) * 0.1;
                ctx.beginPath();
                ctx.arc(mwX, mwY, dust.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 180, 255, ${alpha})`;
                ctx.fill();
            }

            for (const star of stars) {
                const alpha = star.baseAlpha + Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.3;
                
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                
                if (star.color === '#ffffff') {
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                } else {
                    const hex = star.color.replace('#', '');
                    const r = parseInt(hex.substring(0, 2), 16);
                    const g = parseInt(hex.substring(2, 4), 16);
                    const b = parseInt(hex.substring(4, 6), 16);
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                }
                ctx.fill();
            }

            if (Math.random() < 0.005) {
                shootingStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.5,
                    length: Math.random() * 80 + 40,
                    speed: Math.random() * 15 + 10,
                    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3
                });
            }

            shootingStars = shootingStars.filter(ss => {
                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                
                const gradient = ctx.createLinearGradient(
                    ss.x - Math.cos(ss.angle) * ss.length,
                    ss.y - Math.sin(ss.angle) * ss.length,
                    ss.x,
                    ss.y
                );
                gradient.addColorStop(0, 'transparent');
                gradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.8)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 1)');
                
                ctx.beginPath();
                ctx.moveTo(ss.x - Math.cos(ss.angle) * ss.length, ss.y - Math.sin(ss.angle) * ss.length);
                ctx.lineTo(ss.x, ss.y);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                return ss.x < canvas.width && ss.y < canvas.height;
            });
        }

        function drawSun() {
            const centerX = canvas.width / 2 + offsetX;
            const centerY = canvas.height / 2 + offsetY;
            const sunSize = 35 * zoom;

            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, sunSize * 2);
            gradient.addColorStop(0, 'rgba(255, 255, 200, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 223, 0, 0.9)');
            gradient.addColorStop(0.6, 'rgba(255, 165, 0, 0.6)');
            gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');

            ctx.beginPath();
            ctx.arc(centerX, centerY, sunSize * 2, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, sunSize);
            coreGradient.addColorStop(0, '#fff');
            coreGradient.addColorStop(0.5, '#ffd700');
            coreGradient.addColorStop(1, '#ff8c00');

            ctx.beginPath();
            ctx.arc(centerX, centerY, sunSize, 0, Math.PI * 2);
            ctx.fillStyle = coreGradient;
            ctx.fill();

            const glowPulse = Math.sin(time * 2) * 5 + 5;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 30 + glowPulse;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunSize, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawOrbit(planet) {
            const centerX = canvas.width / 2 + offsetX;
            const centerY = canvas.height / 2 + offsetY;
            const a = planet.orbitRadius * scale * zoom;
            const e = planet.eccentricity || 0;
            const b = a * Math.sqrt(1 - e * e);
            const c = a * e;

            ctx.beginPath();
            ctx.ellipse(centerX + c, centerY, a, b, 0, 0, Math.PI * 2);
            
            ctx.setLineDash([8, 4]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]);
        }

        

        function drawPlanet(planet, t) {
            const pos = getPlanetPosition(planet, t);
            const isHovered = hoveredPlanet === planet.name;
            const baseSize = planet.size * zoom;
            const displaySize = isHovered ? baseSize * 1.3 : baseSize;

            if (isHovered) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, displaySize * 2, 0, Math.PI * 2);
                ctx.fillStyle = planet.glowColor;
                ctx.fill();
            }

            ctx.shadowColor = planet.glowColor;
            ctx.shadowBlur = isHovered ? 25 : 15;

            const gradient = ctx.createRadialGradient(pos.x - displaySize * 0.3, pos.y - displaySize * 0.3, 0, pos.x, pos.y, displaySize);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(0.3, planet.color);
            gradient.addColorStop(1, planet.color);

            ctx.beginPath();
            ctx.arc(pos.x, pos.y, displaySize, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.shadowBlur = 0;

            if (planet.hasRings) {
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y, displaySize * 2, displaySize * 0.3, 0, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y, displaySize * 1.5, displaySize * 0.25, 0, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(220, 200, 170, 0.8)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            const fontSize = Math.max(10, 12 * zoom);
            ctx.font = `${fontSize}px Arial`;
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.fillText(planet.name, pos.x, pos.y + displaySize + 15);
        }

        function draw() {
            drawStarBackground();

            planets.forEach(planet => drawOrbit(planet));

            

            drawSun();

            planets.forEach(planet => drawPlanet(planet, time));

            if (isPlaying) {
                time += 0.01 * parseFloat(speedSlider.value);
            }

            animationId = requestAnimationFrame(draw);
        }

        function showPlanetCard(planet, fromLegend = false) {
            document.getElementById('cardIcon').style.backgroundColor = planet.color;
            document.getElementById('cardIcon').style.color = planet.color;
            document.getElementById('cardName').textContent = planet.name;
            document.getElementById('cardNameEn').textContent = planet.nameEn;
            document.getElementById('cardDiameter').textContent = planet.diameter.toLocaleString() + ' km';
            document.getElementById('cardDistance').textContent = planet.distance + ' AU';
            document.getElementById('cardPeriod').textContent = planet.period;
            document.getElementById('cardRotation').textContent = planet.rotation;
            document.getElementById('cardDescription').textContent = planet.description;
            document.getElementById('cardFunFact').textContent = '🌟 ' + planet.funFact;

            let cardX, cardY;

            if (fromLegend) {
                const legend = document.querySelector('.legend');
                const legendRect = legend.getBoundingClientRect();
                cardX = legendRect.left - 320;
                cardY = legendRect.top;
            } else {
                const rect = canvas.getBoundingClientRect();
                const pos = getPlanetPosition(planet, time);
                cardX = rect.left + pos.x - 150;
                cardY = rect.top + pos.y - 200;
            }

            if (cardX < 20) cardX = 20;
            if (cardX > window.innerWidth - 320) cardX = window.innerWidth - 320;
            if (cardY < 20) cardY = 20;
            if (cardY > window.innerHeight - 350) cardY = window.innerHeight - 350;

            planetCard.style.left = cardX + 'px';
            planetCard.style.top = cardY + 'px';
            planetCard.classList.add('show');
        }

        function hidePlanetCard() {
            planetCard.classList.remove('show');
        }

        canvas.addEventListener('click', (e) => {
            const dragDistance = Math.sqrt(
                Math.pow(e.clientX - dragStartX, 2) + 
                Math.pow(e.clientY - dragStartY, 2)
            );
            
            if (dragDistance > 5) {
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const sunX = canvas.width / 2 + offsetX;
            const sunY = canvas.height / 2 + offsetY;
            const sunDistance = Math.sqrt((clickX - sunX) ** 2 + (clickY - sunY) ** 2);
            if (sunDistance < sunData.size * zoom + 10) {
                showPlanetCard(sunData);
                return;
            }

            for (const planet of planets) {
                const pos = getPlanetPosition(planet, time);
                const distance = Math.sqrt((clickX - pos.x) ** 2 + (clickY - pos.y) ** 2);
                if (distance < planet.size * zoom + 10) {
                    showPlanetCard(planet);
                    return;
                }
            }

            hidePlanetCard();
        });

        const legendItems = document.querySelectorAll('.legend-item');
        legendItems.forEach(item => {
            item.addEventListener('click', () => {
                const planetName = item.dataset.planet;
                if (planetName === '太阳') {
                    showPlanetCard(sunData, true);
                } else {
                    const planet = planets.find(p => p.name === planetName);
                    if (planet) {
                        showPlanetCard(planet, true);
                    }
                }
            });
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                canvas.style.cursor = 'grabbing';
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                offsetX += deltaX;
                offsetY += deltaY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            } else {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                let foundPlanet = null;
                for (const planet of planets) {
                    const pos = getPlanetPosition(planet, time);
                    const distance = Math.sqrt((mouseX - pos.x) ** 2 + (mouseY - pos.y) ** 2);
                    if (distance < planet.size * zoom + 10) {
                        foundPlanet = planet;
                        break;
                    }
                }

                hoveredPlanet = foundPlanet ? foundPlanet.name : null;
                canvas.style.cursor = foundPlanet ? 'pointer' : 'grab';
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'default';
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'default';
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const centerX = canvas.width / 2 + offsetX;
            const centerY = canvas.height / 2 + offsetY;
            
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            const newZoom = Math.max(0.2, Math.min(5, zoom * zoomFactor));
            
            const worldX = (mouseX - centerX) / zoom;
            const worldY = (mouseY - centerY) / zoom;
            
            offsetX = mouseX - worldX * newZoom - canvas.width / 2;
            offsetY = mouseY - worldY * newZoom - canvas.height / 2;
            
            zoom = newZoom;
        }, { passive: false });

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.innerHTML = isPlaying ? '⏸️ 暂停' : '▶️ 播放';
        });

        speedSlider.addEventListener('input', () => {
            speedValue.textContent = parseFloat(speedSlider.value).toFixed(1) + 'x';
        });

        closeCardBtn.addEventListener('click', hidePlanetCard);

        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenBtn.innerHTML = '⛶ 退出全屏';
                }).catch(err => {
                    console.log('全屏模式不可用:', err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        fullscreenBtn.innerHTML = '⛶ 全屏';
                    });
                }
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.innerHTML = '⛶ 退出全屏';
            } else {
                fullscreenBtn.innerHTML = '⛶ 全屏';
            }
            resizeCanvas();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        resizeCanvas();
        draw();
    </script>
</body>
</html>
