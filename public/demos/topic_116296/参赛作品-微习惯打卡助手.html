<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日微习惯打卡助手</title>
<style>
/* ========== CSS 变量：深色/浅色主题 ========== */
:root {
  --bg: #f5f0eb;
  --bg-card: #ffffff;
  --bg-input: #f0ece6;
  --bg-hover: #e8e2d9;
  --text: #3d3226;
  --text-secondary: #7a6e60;
  --text-muted: #a09888;
  --border: #d9cfc0;
  --accent: #e07b5a;
  --accent-hover: #c96a4d;
  --accent-light: #fce8e0;
  --success: #5a9e6f;
  --success-light: #e0f5e6;
  --warning: #d4a843;
  --danger: #c05050;
  --shadow: 0 2px 12px rgba(61,50,38,0.08);
  --shadow-lg: 0 8px 30px rgba(61,50,38,0.12);
  --gradient: linear-gradient(135deg, #e07b5a, #d4a843);
  --heatmap-0: #f0ece6;
  --heatmap-1: #fce0d4;
  --heatmap-2: #f5b895;
  --heatmap-3: #e89060;
  --heatmap-4: #d46a3a;
  --badge-locked: #ddd8cf;
  --badge-locked-border: #c8c0b4;
  --radius: 14px;
  --radius-sm: 8px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dark"] {
  --bg: #1a1a1f;
  --bg-card: #25252b;
  --bg-input: #2a2a32;
  --bg-hover: #303038;
  --text: #e0dcd5;
  --text-secondary: #a8a29a;
  --text-muted: #6e6860;
  --border: #3a3a42;
  --accent: #f09070;
  --accent-hover: #e07b5a;
  --accent-light: #3a2520;
  --success: #6aae80;
  --success-light: #1a3025;
  --warning: #e0b860;
  --danger: #d07070;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
  --gradient: linear-gradient(135deg, #f09070, #e0b860);
  --heatmap-0: #2a2a32;
  --heatmap-1: #4a3028;
  --heatmap-2: #7a4030;
  --heatmap-3: #b05540;
  --heatmap-4: #e07050;
  --badge-locked: #353540;
  --badge-locked-border: #4a4a55;
}
/* ========== 全局样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  line-height: 1.6;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}
/* ========== 头部 ========== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 20px 24px;
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  transition: background var(--transition), box-shadow var(--transition);
}
.header-title {
  font-size: 1.5rem;
  font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text);
  font-size: 0.875rem;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  font-family: inherit;
}
.btn:hover { background: var(--bg-hover); }
.btn-accent {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-accent:hover { background: var(--accent-hover); }
.btn-icon {
  width: 36px; height: 36px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 1.1rem;
}
.btn-sm { padding: 5px 10px; font-size: 0.8rem; }
/* ========== 卡片通用 ========== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 24px;
  margin-bottom: 20px;
  transition: background var(--transition), box-shadow var(--transition);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  font-size: 1.1rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
/* ========== 添加习惯区域 ========== */
.add-habit-form {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.form-group label {
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-weight: 500;
}
.form-group input {
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  color: var(--text);
  font-size: 0.9rem;
  font-family: inherit;
  transition: all var(--transition);
  outline: none;
}
.form-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.input-emoji { width: 70px; text-align: center; font-size: 1.3rem; }
.input-name { width: 200px; }
.input-target { width: 80px; }
/* ========== 习惯列表 ========== */
.habit-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg-input);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  transition: all var(--transition);
  flex-wrap: wrap;
}
.habit-item:hover { background: var(--bg-hover); }
.habit-emoji {
  font-size: 1.8rem;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-card);
  border-radius: 50%;
  flex-shrink: 0;
}
.habit-info { flex: 1; min-width: 150px; }
.habit-name {
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 4px;
}
.habit-meta {
  font-size: 0.8rem;
  color: var(--text-secondary);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.habit-meta span { display: flex; align-items: center; gap: 3px; }
.progress-bar-wrap {
  flex: 0 0 120px;
  height: 8px;
  background: var(--bg-card);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--gradient);
  border-radius: 4px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.habit-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.checkin-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  font-size: 1.3rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}
.checkin-btn:hover { border-color: var(--success); background: var(--success-light); }
.checkin-btn.checked {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
  animation: pop 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
.habit-empty {
  text-align: center;
  color: var(--text-muted);
  padding: 40px 20px;
  font-size: 0.95rem;
}
.habit-empty .big-emoji { font-size: 3rem; display: block; margin-bottom: 12px; }
/* ========== 热力图 ========== */
.heatmap-nav {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.heatmap-nav .month-label {
  font-size: 1rem;
  font-weight: 600;
  min-width: 100px;
  text-align: center;
}
.heatmap-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.heatmap-day-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-align: center;
  padding: 2px 0;
}
.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 3px;
  cursor: pointer;
  transition: transform 0.15s;
  position: relative;
}
.heatmap-cell:hover { transform: scale(1.15); }
.heatmap-cell.empty { background: transparent; }
.heatmap-tooltip {
  position: absolute;
  bottom: 120%;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 10;
}
.heatmap-cell:hover .heatmap-tooltip { opacity: 1; }
.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  font-size: 0.75rem;
  color: var(--text-muted);
  justify-content: flex-end;
}
.heatmap-legend-cell {
  width: 14px; height: 14px;
  border-radius: 2px;
}
/* ========== 成就徽章 ========== */
.achievements-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 12px;
}
.achievement-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 14px 8px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--badge-locked-border);
  background: var(--badge-locked);
  transition: all var(--transition);
  cursor: default;
  opacity: 0.5;
  position: relative;
  text-align: center;
}
.achievement-badge.unlocked {
  opacity: 1;
  border-color: var(--warning);
  background: var(--bg-card);
  box-shadow: 0 0 20px rgba(212,168,67,0.15);
  animation: unlockGlow 2s ease-in-out;
}
@keyframes unlockGlow {
  0% { box-shadow: 0 0 0px rgba(212,168,67,0); }
  50% { box-shadow: 0 0 30px rgba(212,168,67,0.4); }
  100% { box-shadow: 0 0 20px rgba(212,168,67,0.15); }
}
.achievement-icon {
  font-size: 2rem;
  transition: transform var(--transition);
}
.achievement-badge.unlocked .achievement-icon {
  animation: badgeBounce 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
@keyframes badgeBounce {
  0% { transform: scale(0.3) rotate(-10deg); }
  50% { transform: scale(1.3) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.achievement-name {
  font-size: 0.7rem;
  font-weight: 600;
}
.achievement-desc {
  font-size: 0.65rem;
  color: var(--text-muted);
}
/* ========== 庆祝动画遮罩 ========== */
.celebrate-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.celebrate-modal {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 32px 40px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  max-width: 360px;
  width: 90%;
}
@keyframes modalIn {
  from { transform: scale(0.5) translateY(40px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}
.celebrate-icon {
  font-size: 4rem;
  animation: celebrateSpin 0.8s ease;
}
@keyframes celebrateSpin {
  0% { transform: scale(0) rotate(-180deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.celebrate-title {
  font-size: 1.4rem;
  font-weight: 700;
  margin: 12px 0 6px;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.celebrate-desc { color: var(--text-secondary); margin-bottom: 20px; }
/* 彩带粒子 */
.confetti-container {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 1001;
}
.confetti-piece {
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 2px;
  animation: confettiFall 2.5s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}
/* ========== Canvas 图表区 ========== */
.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.chart-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}
.chart-card canvas {
  width: 100% !important;
  height: auto !important;
}
/* ========== 响应式 ========== */
@media (max-width: 768px) {
  .container { padding: 12px; }
  .header { padding: 14px 16px; }
  .header-title { font-size: 1.2rem; }
  .card { padding: 14px 16px; }
  .chart-row { grid-template-columns: 1fr; }
  .add-habit-form { flex-direction: column; }
  .input-name { width: 100%; }
  .input-target { width: 100%; }
  .achievements-grid { grid-template-columns: repeat(4, 1fr); }
  .heatmap-grid { gap: 2px; }
  .habit-item { gap: 8px; padding: 10px 12px; }
  .progress-bar-wrap { flex: 0 0 80px; }
}
@media (max-width: 480px) {
  .achievements-grid { grid-template-columns: repeat(3, 1fr); }
  .header-actions { gap: 4px; }
  .btn { padding: 6px 10px; font-size: 0.78rem; }
  .habit-meta { font-size: 0.7rem; gap: 6px; }
}
</style>
</head>
<body>
<div class="container">
  <!-- ========== 头部 ========== -->
  <div class="header">
    <div class="header-title">&#127793; 每日微习惯打卡助手</div>
    <div class="header-actions">
      <button class="btn btn-icon" id="btnTheme" title="切换深色/浅色模式">&#9788;</button>
      <button class="btn btn-icon" id="btnNotify" title="开启/关闭通知提醒">&#128276;</button>
      <button class="btn btn-sm" id="btnExport" title="导出数据">&#128229; 导出</button>
      <button class="btn btn-sm" id="btnImport" title="导入数据">&#128228; 导入</button>
      <button class="btn btn-sm" id="btnClear" title="清空所有数据" style="color:var(--danger);border-color:var(--danger);">&#128465; 清空</button>
    </div>
  </div>

  <!-- ========== 添加习惯 ========== -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">&#10133; 添加新习惯</div>
    </div>
    <div class="add-habit-form" id="addForm">
      <div class="form-group">
        <label>图标</label>
        <input type="text" class="input-emoji" id="inputEmoji" value="&#127942;" maxlength="2" placeholder="&#127942;">
      </div>
      <div class="form-group">
        <label>习惯名称</label>
        <input type="text" class="input-name" id="inputName" placeholder="例如：早起喝水" maxlength="20">
      </div>
      <div class="form-group">
        <label>每日目标(次)</label>
        <input type="number" class="input-target" id="inputTarget" value="1" min="1" max="99">
      </div>
      <button class="btn btn-accent" id="btnAdd" style="height:40px;">&#10003; 添加</button>
      <input type="hidden" id="editingId" value="">
    </div>
  </div>

  <!-- ========== 习惯列表 ========== -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">&#128203; 我的习惯</div>
      <span style="font-size:0.85rem;color:var(--text-secondary);" id="todayLabel"></span>
    </div>
    <div id="habitsList"></div>
  </div>

  <!-- ========== 月度热力图 ========== -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">&#128197; 月度打卡热力图</div>
      <div class="heatmap-nav">
        <button class="btn btn-sm" id="btnPrevMonth">&#9664;</button>
        <span class="month-label" id="heatmapMonthLabel"></span>
        <button class="btn btn-sm" id="btnNextMonth">&#9654;</button>
      </div>
    </div>
    <div class="heatmap-grid" id="heatmapGrid"></div>
    <div class="heatmap-legend">
      <span>少</span>
      <div class="heatmap-legend-cell" style="background:var(--heatmap-0)"></div>
      <div class="heatmap-legend-cell" style="background:var(--heatmap-1)"></div>
      <div class="heatmap-legend-cell" style="background:var(--heatmap-2)"></div>
      <div class="heatmap-legend-cell" style="background:var(--heatmap-3)"></div>
      <div class="heatmap-legend-cell" style="background:var(--heatmap-4)"></div>
      <span>多</span>
    </div>
  </div>

  <!-- ========== 成就徽章 ========== -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">&#127942; 成就徽章</div>
      <span style="font-size:0.85rem;color:var(--text-secondary);" id="achievementCount"></span>
    </div>
    <div class="achievements-grid" id="achievementsGrid"></div>
  </div>

  <!-- ========== Canvas 图表区 ========== -->
  <div class="chart-row">
    <div class="chart-card">
      <div class="card-title" style="margin-bottom:10px;">&#128200; 7天完成率趋势</div>
      <canvas id="canvasLine" width="400" height="220"></canvas>
    </div>
    <div class="chart-card">
      <div class="card-title" style="margin-bottom:10px;">&#128202; 各习惯打卡次数对比</div>
      <canvas id="canvasBar" width="400" height="220"></canvas>
    </div>
  </div>
</div>

<!-- 隐藏文件选择器 -->
<input type="file" id="importFileInput" accept=".json" style="display:none;">

<script>
// ==================== Canvas roundRect polyfill ====================
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
    else if (Array.isArray(r)) r = { tl: r[0]||0, tr: r[1]||0, br: r[2]||0, bl: r[3]||0 };
    else r = r || { tl: 0, tr: 0, br: 0, bl: 0 };
    this.moveTo(x + r.tl, y);
    this.lineTo(x + w - r.tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
    this.lineTo(x + w, y + h - r.br);
    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
    this.lineTo(x + r.bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
    this.lineTo(x, y + r.tl);
    this.quadraticCurveTo(x, y, x + r.tl, y);
  };
}

// ==================== 数据管理 ====================
const STORAGE_KEY_HABITS = 'microHabit_habits';
const STORAGE_KEY_THEME = 'microHabit_theme';
const STORAGE_KEY_ACHIEVEMENTS = 'microHabit_achievements';

function loadData(key, fallback) {
  try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : fallback; }
  catch (e) { return fallback; }
}
function saveData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

let habits = loadData(STORAGE_KEY_HABITS, null) || [
  { id: 's1', name: '晨跑', emoji: '\u{1F3C3}', target: 1, checkins: { '2026-07-07':1,'2026-07-08':1,'2026-07-09':1,'2026-07-10':1,'2026-07-11':1,'2026-07-12':1,'2026-07-13':1 } },
  { id: 's2', name: '阅读30分钟', emoji: '\u{1F4D6}', target: 1, checkins: { '2026-07-07':1,'2026-07-08':1,'2026-07-09':1,'2026-07-10':1,'2026-07-11':1,'2026-07-12':1,'2026-07-13':1 } },
  { id: 's3', name: '早起喝水', emoji: '\u{1F4A7}', target: 3, checkins: { '2026-07-07':3,'2026-07-08':3,'2026-07-09':3,'2026-07-10':3,'2026-07-11':3,'2026-07-12':3,'2026-07-13':3 } },
  { id: 's4', name: '冥想10分钟', emoji: '\u{1F9D8}', target: 1, checkins: { '2026-07-07':1,'2026-07-09':1,'2026-07-10':1,'2026-07-12':1,'2026-07-13':1 } },
  { id: 's5', name: '运动20分钟', emoji: '\u{1F3CB}\u{FE0F}', target: 1, checkins: { '2026-07-08':1,'2026-07-10':1,'2026-07-11':1,'2026-07-13':1 } },

// ==================== 工具函数 ====================
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dateStr(y, m, d) {
  return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function daysBetween(d1, d2) {
  return Math.round((d2 - d1) / 86400000);
}
function getTodayCheckins() {
  const today = todayStr();
  return habits.filter(h => h.checkins && h.checkins[today]).length;
}

// ==================== 习惯操作 ====================
function addHabit(name, emoji, target) {
  const habit = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: name.trim(),
    emoji: emoji || '\u{1F3C6}',
    target: Math.max(1, parseInt(target) || 1),
    checkins: {}
  };
  habits.push(habit);
  saveData(STORAGE_KEY_HABITS, habits);
  renderAll();
}

function updateHabit(id, name, emoji, target) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  h.name = name.trim();
  h.emoji = emoji || '\u{1F3C6}';
  h.target = Math.max(1, parseInt(target) || 1);
  saveData(STORAGE_KEY_HABITS, habits);
  renderAll();
}

function deleteHabit(id) {
  if (!confirm('确定要删除这个习惯吗？相关打卡数据也会被清除。')) return;
  habits = habits.filter(h => h.id !== id);
  saveData(STORAGE_KEY_HABITS, habits);
  renderAll();
}

function toggleCheckin(id) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  if (!h.checkins) h.checkins = {};
  const today = todayStr();
  if (h.checkins[today]) {
    delete h.checkins[today];
  } else {
    h.checkins[today] = true;
  }
  saveData(STORAGE_KEY_HABITS, habits);
  checkAchievements();
  renderAll();
}

// ==================== 统计计算 ====================
function getHabitStreak(habit) {
  if (!habit.checkins || Object.keys(habit.checkins).length === 0) return 0;
  const today = parseDate(todayStr());
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ds = dateStr(d.getFullYear(), d.getMonth()+1, d.getDate());
    if (habit.checkins[ds]) {
      streak++;
    } else {
      break;
    }
  }
  return streak;
}

function getHabitLongestStreak(habit) {
  if (!habit.checkins || Object.keys(habit.checkins).length === 0) return 0;
  const dates = Object.keys(habit.checkins).sort();
  let maxStreak = 0, currentStreak = 1;
  for (let i = 1; i < dates.length; i++) {
    const diff = daysBetween(parseDate(dates[i-1]), parseDate(dates[i]));
    if (diff === 1) {
      currentStreak++;
    } else {
      maxStreak = Math.max(maxStreak, currentStreak);
      currentStreak = 1;
    }
  }
  return Math.max(maxStreak, currentStreak);
}

function getHabitTotalCheckins(habit) {
  return habit.checkins ? Object.keys(habit.checkins).length : 0;
}

function getOverallStreak() {
  if (habits.length === 0) return 0;
  const today = parseDate(todayStr());
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ds = dateStr(d.getFullYear(), d.getMonth()+1, d.getDate());
    const anyChecked = habits.some(h => h.checkins && h.checkins[ds]);
    if (anyChecked) streak++;
    else break;
  }
  return streak;
}

function getTotalUniqueDays() {
  const allDays = new Set();
  habits.forEach(h => {
    if (h.checkins) Object.keys(h.checkins).forEach(d => allDays.add(d));
  });
  return allDays.size;
}

function getTotalCheckinsAll() {
  return habits.reduce((sum, h) => sum + getHabitTotalCheckins(h), 0);
}

function getAllHabitsCompletedToday() {
  if (habits.length === 0) return false;
  const today = todayStr();
  return habits.every(h => h.checkins && h.checkins[today]);
}

// ==================== 热力图 ====================
function renderHeatmap() {
  const grid = document.getElementById('heatmapGrid');
  const label = document.getElementById('heatmapMonthLabel');
  label.textContent = heatmapYear + '年' + heatmapMonth + '月';

  // 计算该月每天的总打卡次数
  const daysInMonth = new Date(heatmapYear, heatmapMonth, 0).getDate();
  const firstDayOfWeek = new Date(heatmapYear, heatmapMonth - 1, 1).getDay(); // 0=周日

  const dayCounts = {};
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = dateStr(heatmapYear, heatmapMonth, d);
    let count = 0;
    habits.forEach(h => { if (h.checkins && h.checkins[ds]) count++; });
    dayCounts[ds] = count;
  }

  const maxCount = Math.max(1, ...Object.values(dayCounts));

  const dayLabels = ['日','一','二','三','四','五','六'];
  let html = dayLabels.map(l => '<div class="heatmap-day-label">'+l+'</div>').join('');

  // 填充空白格
  for (let i = 0; i < firstDayOfWeek; i++) {
    html += '<div class="heatmap-cell empty"></div>';
  }
  // 日期格子
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = dateStr(heatmapYear, heatmapMonth, d);
    const count = dayCounts[ds] || 0;
    let level = 0;
    if (count > 0 && maxCount > 0) {
      level = Math.ceil((count / maxCount) * 4);
    }
    const colorVar = '--heatmap-' + level;
    const today = todayStr();
    const isToday = ds === today;
    html += '<div class="heatmap-cell" style="background:var('+colorVar+');'+(isToday?'outline:2px solid var(--accent);outline-offset:-1px;':'')+'">'
      + '<div class="heatmap-tooltip">'+heatmapMonth+'月'+d+'日: '+count+'次打卡</div>'
      + '</div>';
  }
  grid.innerHTML = html;
}

// ==================== Canvas 图表 ====================
function drawLineChart() {
  const canvas = document.getElementById('canvasLine');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width - 32;
  const h = 220;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  // 背景
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim();
  ctx.fillRect(0, 0, w, h);

  const padding = { top: 20, right: 20, bottom: 35, left: 40 };
  const plotW = w - padding.left - padding.right;
  const plotH = h - padding.top - padding.bottom;

  // 数据：最近7天
  const days = [];
  const today = parseDate(todayStr());
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ds = dateStr(d.getFullYear(), d.getMonth()+1, d.getDate());
    let completed = 0;
    habits.forEach(h => { if (h.checkins && h.checkins[ds]) completed++; });
    const rate = habits.length > 0 ? (completed / habits.length) * 100 : 0;
    days.push({ label: (d.getMonth()+1)+'/'+d.getDate(), rate });
  }

  // 网格
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (plotH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(w - padding.right, y);
    ctx.stroke();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText((100 - i * 25) + '%', padding.left - 6, y + 4);
  }

  // 折线
  ctx.beginPath();
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const points = [];
  days.forEach((day, i) => {
    const x = padding.left + (plotW / (days.length - 1 || 1)) * i;
    const y = padding.top + plotH - (day.rate / 100) * plotH;
    points.push({ x, y, ...day });
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // 渐变填充
  const grad = ctx.createLinearGradient(0, padding.top, 0, padding.top + plotH);
  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  grad.addColorStop(0, accentColor + '40');
  grad.addColorStop(1, accentColor + '05');
  ctx.lineTo(points[points.length-1].x, padding.top + plotH);
  ctx.lineTo(points[0].x, padding.top + plotH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // 数据点
  points.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = accentColor;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 标签
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim();
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.label, p.x, padding.top + plotH + 16);
    ctx.fillText(Math.round(p.rate) + '%', p.x, p.y - 10);
  });
}

function drawBarChart() {
  const canvas = document.getElementById('canvasBar');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width - 32;
  const h = 220;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim();
  ctx.fillRect(0, 0, w, h);

  const padding = { top: 20, right: 20, bottom: 45, left: 40 };
  const plotW = w - padding.left - padding.right;
  const plotH = h - padding.top - padding.bottom;

  const data = habits.map(h => ({
    name: h.emoji + ' ' + (h.name.length > 4 ? h.name.slice(0,4)+'..' : h.name),
    count: getHabitTotalCheckins(h)
  }));

  if (data.length === 0) {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无习惯数据', w/2, h/2);
    return;
  }

  const maxCount = Math.max(1, ...data.map(d => d.count));

  // 网格
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  ctx.lineWidth = 0.5;
  const gridLines = 4;
  for (let i = 0; i <= gridLines; i++) {
    const y = padding.top + (plotH / gridLines) * i;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(w - padding.right, y);
    ctx.stroke();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxCount - (maxCount / gridLines) * i), padding.left - 6, y + 4);
  }

  // 柱状图
  const barW = Math.min(40, (plotW / data.length) * 0.6);
  const gap = plotW / data.length;

  data.forEach((d, i) => {
    const x = padding.left + gap * i + (gap - barW) / 2;
    const barH = (d.count / maxCount) * plotH;
    const y = padding.top + plotH - barH;

    // 渐变柱
    const grad = ctx.createLinearGradient(x, y, x, padding.top + plotH);
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    grad.addColorStop(0, accentColor);
    grad.addColorStop(1, accentColor + '40');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, [4, 4, 0, 0]);
    ctx.fill();

    // 数值
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim();
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.count, x + barW/2, y - 4);

    // 标签
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim();
    ctx.font = '9px sans-serif';
    ctx.save();
    ctx.translate(x + barW/2, padding.top + plotH + 10);
    ctx.rotate(-0.5);
    ctx.fillText(d.name, 0, 0);
    ctx.restore();
  });
}

function renderHabits() {

          + '<span>&#127942; 最长 ' + longest + ' 天</span>'
          + '<span>&#128221; 共 ' + total + ' 次</span>'

      + '</div>'
      + '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + progress + '%"></div></div>'
      + '<div class="habit-actions">'
        + '<button class="checkin-btn' + (checked ? ' checked' : '') + '" onclick="toggleCheckin(\'' + h.id + '\')" title="' + (checked ? '取消打卡' : '打卡') + '">' + (checked ? '&#10003;' : '&#9675;') + '</button>'

// ==================== 通知 ====================
function toggleNotify() {
  if (!notifyEnabled) {
    if (!('Notification' in window)) {
      alert('您的浏览器不支持通知功能。');
      return;
    }
    if (Notification.permission === 'granted') {
      notifyEnabled = true;
    } else if (Notification.permission === 'denied') {
      alert('通知权限已被拒绝，请在浏览器设置中允许通知。');
      return;
    } else {
      Notification.requestPermission().then(perm => {
        notifyEnabled = (perm === 'granted');
        updateNotifyBtn();
        if (notifyEnabled) scheduleNotification();
      });
      return;
    }
  } else {
    notifyEnabled = false;
  }
  updateNotifyBtn();
  if (notifyEnabled) scheduleNotification();
}

function updateNotifyBtn() {
  document.getElementById('btnNotify').innerHTML = notifyEnabled ? '&#128276;' : '&#128264;';
  document.getElementById('btnNotify').title = notifyEnabled ? '通知已开启' : '通知已关闭';
}

function scheduleNotification() {
  if (!notifyEnabled) return;
  const now = new Date();
  const target = new Date(now);
  target.setHours(21, 0, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  const delay = target - now;
  setTimeout(() => {
    if (!notifyEnabled) return;
    const undone = habits.filter(h => !h.checkins || !h.checkins[todayStr()]);
    if (undone.length > 0) {
      new Notification('微习惯打卡提醒', {
        body: '还有 ' + undone.length + ' 个习惯未完成，快去打卡吧！',
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23e07b5a"/><text x="50" y="68" text-anchor="middle" font-size="50" fill="white">!</text></svg>',
        requireInteraction: true
      });
    }
    scheduleNotification();
  }, delay);
}

// ==================== 数据导入导出 ====================
function exportData() {
  const data = {
    habits: habits,
    achievements: unlockedAchievements,
    theme: currentTheme,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '微习惯打卡数据_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.habits || !Array.isArray(data.habits)) throw new Error('无效数据格式');
      if (!confirm('即将导入 ' + data.habits.length + ' 个习惯和 ' + (data.achievements ? data.achievements.length : 0) + ' 个成就。当前数据将被覆盖，确定继续？')) return;
      habits = data.habits;
      unlockedAchievements = data.achievements || [];
      if (data.theme) { currentTheme = data.theme; applyTheme(); }
      saveData(STORAGE_KEY_HABITS, habits);
      saveData(STORAGE_KEY_ACHIEVEMENTS, unlockedAchievements);
      renderAll();
      alert('数据导入成功！');
    } catch (err) {
      alert('导入失败：文件格式不正确。');
    }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm('确定要清空所有数据吗？此操作不可恢复！')) return;
  if (!confirm('再次确认：真的要删除所有习惯、打卡记录和成就吗？')) return;
  habits = [];
  unlockedAchievements = [];
  saveData(STORAGE_KEY_HABITS, habits);
  saveData(STORAGE_KEY_ACHIEVEMENTS, unlockedAchievements);
  renderAll();
}

// ==================== 事件绑定 ====================
document.getElementById('btnAdd').addEventListener('click', function() {
  const name = document.getElementById('inputName').value.trim();
  if (!name) { alert('请输入习惯名称'); return; }
  const emoji = document.getElementById('inputEmoji').value.trim() || '\u{1F3C6}';
  const target = parseInt(document.getElementById('inputTarget').value) || 1;
  const editingId = document.getElementById('editingId').value;
  if (editingId) {
    updateHabit(editingId, name, emoji, target);
    document.getElementById('editingId').value = '';
    document.getElementById('btnAdd').textContent = '\u2713 添加';
  } else {
    addHabit(name, emoji, target);
  }
  document.getElementById('inputName').value = '';
  document.getElementById('inputEmoji').value = '\u{1F3C6}';
  document.getElementById('inputTarget').value = '1';
  checkAchievements();
});

document.getElementById('inputName').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('btnAdd').click();
});

document.getElementById('btnTheme').addEventListener('click', function() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme();
});

document.getElementById('btnNotify').addEventListener('click', toggleNotify);

document.getElementById('btnExport').addEventListener('click', exportData);

document.getElementById('btnImport').addEventListener('click', function() {
  document.getElementById('importFileInput').click();
});

document.getElementById('importFileInput').addEventListener('change', function(e) {
  if (e.target.files && e.target.files[0]) {
    importData(e.target.files[0]);
    e.target.value = '';
  }
});

document.getElementById('btnClear').addEventListener('click', clearAllData);

document.getElementById('btnPrevMonth').addEventListener('click', function() {
  heatmapMonth--;
  if (heatmapMonth < 1) { heatmapMonth = 12; heatmapYear--; }
  renderHeatmap();
});

document.getElementById('btnNextMonth').addEventListener('click', function() {
  heatmapMonth++;
  if (heatmapMonth > 12) { heatmapMonth = 1; heatmapYear++; }
  renderHeatmap();
});

// 窗口大小变化重绘图表
let resizeTimeout;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(function() {
    drawLineChart();
    drawBarChart();
  }, 200);
});

// ==================== 初始化 ====================
function init() {
  const now = new Date();
  heatmapYear = now.getFullYear();
  heatmapMonth = now.getMonth() + 1;
  applyTheme();
  updateNotifyBtn();
  renderAll();
  checkAchievements();
  // 尝试恢复通知
  if ('Notification' in window && Notification.permission === 'granted') {
    notifyEnabled = true;
    updateNotifyBtn();
    scheduleNotification();
  }
}

init();
</script>
