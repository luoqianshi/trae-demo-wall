function fmtMoney(n, d) { n = Number(n) || 0; d = d == null ? 2 : d; const parts = n.toFixed(d).split('.'); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return parts.join('.'); }
function fmtSignedMoney(n) { n = Number(n) || 0; if (n > 0) return '+' + fmtMoney(n); if (n < 0) return '-' + fmtMoney(-n); return fmtMoney(0); }
function fmtSignedRate(n) { n = Number(n) || 0; return (n > 0 ? '+' : '') + n.toFixed(2) + '%'; }
function colorClass(n) { n = Number(n) || 0; return n > 0 ? 'up' : n < 0 ? 'down' : 'flat'; }
function fmtUpdate(ts) { if (!ts) return '--'; const parts = ts.split(' '); return parts.length > 1 ? parts[1].substring(0, 5) : ts.substring(0, 5); }

function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

function navigateTo(pageId, title, params) {
  const currentPageId = pageStack[pageStack.length - 1];
  const currentPage = document.getElementById(`page${currentPageId.charAt(0).toUpperCase() + currentPageId.slice(1)}`);
  const nextPage = document.getElementById(`page${pageId.charAt(0).toUpperCase() + pageId.slice(1)}`);
  
  currentPage.classList.remove('active');
  currentPage.classList.add('back');
  nextPage.classList.remove('hidden', 'back');
  nextPage.classList.add('active');
  
  pageStack.push(pageId);
  document.getElementById('navTitle').textContent = title;
  document.getElementById('backBtn').classList.add('show');
  
  if (params) {
    window._pageParams = params;
    if (pageId === 'detail') renderDetail(params.code);
  }
}

function navigateBack() {
  if (pageStack.length <= 1) return;
  
  const currentPageId = pageStack.pop();
  const prevPageId = pageStack[pageStack.length - 1];
  
  const currentPage = document.getElementById(`page${currentPageId.charAt(0).toUpperCase() + currentPageId.slice(1)}`);
  const prevPage = document.getElementById(`page${prevPageId.charAt(0).toUpperCase() + prevPageId.slice(1)}`);
  
  currentPage.classList.remove('active');
  currentPage.classList.add('hidden');
  prevPage.classList.remove('back');
  prevPage.classList.add('active');
  
  document.getElementById('navTitle').textContent = getTabTitle(prevPageId);
  if (pageStack.length === 1) {
    document.getElementById('backBtn').classList.remove('show');
  }
}

function getTabTitle(tab) {
  const titles = { search: '搜索基金', holdings: '记账养基助手', favorites: '自选基金', market: '行情中心', me: '我的' };
  return titles[tab] || '记账养基助手';
}

function switchTab(tab) {
  pageStack = [tab];
  currentTab = tab;
  
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
  
  document.querySelectorAll('.page').forEach(el => {
    el.classList.remove('active', 'back', 'hidden');
    el.classList.add('hidden');
  });
  
  const page = document.getElementById(`page${tab.charAt(0).toUpperCase() + tab.slice(1)}`);
  page.classList.remove('hidden');
  page.classList.add('active');
  
  document.getElementById('navTitle').textContent = getTabTitle(tab);
  document.getElementById('backBtn').classList.remove('show');
  
  renderPage(tab);
}

    selectedCodes.clear();
  } else {
    favorites.forEach(code => selectedCodes.add(code));
  }
  renderFavorites();
}

function deleteSelected() {
  const deletedCount = selectedCodes.size;
  favorites = favorites.filter(code => !selectedCodes.has(code));
  selectedCodes.clear();
  editingMode = false;
  showToast(`已删除 ${deletedCount} 只基金`);
  renderFavorites();
}

function pinTop(code) {
  favorites = [code, ...favorites.filter(c => c !== code)];
  showToast('已置顶');
  renderFavorites();
}

function renderMarket() {
  const now = new Date();
  const hour = now.getHours();
  const weekday = now.getDay();
  
  const aShareStatus = weekday >= 1 && weekday <= 5 && hour >= 9 && hour <= 15 ? 'trading' : 'closed';
  const hkStatus = weekday >= 1 && weekday <= 5 && hour >= 9 && hour <= 16 ? 'trading' : 'closed';
  const usStatus = weekday >= 1 && weekday <= 5 && (hour >= 21 || hour < 4) ? 'trading' : 'closed';

  document.getElementById('marketPage').innerHTML = `
    <div class="market-title">行情中心</div>
    ${Object.entries(mockMarket).map(([name, items]) => {
      const status = name === 'A股' ? aShareStatus : name === '港股' ? hkStatus : usStatus;
      return `
      <div class="market-group">
        <div class="market-group-name">${name}<span class="status ${status}">${status === 'trading' ? '交易中' : '已收盘'}</span></div>
        <div class="market-grid">
          ${items.map(it => `
            <div class="market-cell" onclick="openFundDetail('${it.code}')">
              <div class="idx-name">${it.name}</div>
              <div class="idx-price ${colorClass(it.changePct)}">${it.price.toLocaleString()}</div>
              <div class="idx-rate ${colorClass(it.changePct)}">${fmtSignedRate(it.changePct)}</div>
              <div class="idx-update">更新 ${it.updateAt}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
    }).join('')}
  `;
}

function openFundDetail(code) {
  navigateTo('detail', '基金详情', { code });
}

function renderDetail(code) {
  const f = mockFunds[code];
  if (!f) {
    document.getElementById('detailPage').innerHTML = '<div class="empty"><div class="empty-title">暂无估值数据</div></div>';
    return;
  }
  const sector = mockSectors[code];
  const isFav = favorites.includes(code);

  document.getElementById('detailPage').innerHTML = `
    <div class="detail-card">
      <div class="title">${f.name} (${f.code})</div>
      <div class="sub">${f.type}</div>
      <div class="detail-nav">
        <div class="nav-value">${fmtMoney(f.estimateNav)}</div>
        <div class="nav-rate ${colorClass(f.estimateRate)}">${fmtSignedRate(f.estimateRate)}</div>
      </div>
      <div class="detail-meta">昨日净值: ${fmtMoney(f.lastNav)} · 更新: ${f.updateAt}</div>
      ${sector ? `<div class="detail-meta">关联板块: ${sector.name} <span class="${colorClass(sector.rate)}">${fmtSignedRate(sector.rate)}</span></div>` : ''}
      <div class="detail-source">来源: ${f.source}</div>
    </div>
    <div class="detail-actions">
      <button class="btn ${isFav ? 'outline' : 'primary'}" onclick="toggleFavorite('${code}')">${isFav ? '移除自选' : '加入自选'}</button>
      <button class="btn outline" onclick="showToast('跳转到持仓编辑')">加入持有</button>
    </div>
  `;
}

function toggleFavorite(code) {
  if (favorites.includes(code)) {
    favorites = favorites.filter(c => c !== code);
    showToast('已移除自选');
  } else {
    favorites.push(code);
    showToast('已加入自选');
  }
  renderDetail(code);
}

function renderMe() {
  document.getElementById('mePage').innerHTML = `
    <div class="me-stats">
      <div class="me-stat">
        <div class="num">3</div>
        <div class="lbl">分组</div>
      </div>
      <div class="me-stat">
        <div class="num">9</div>
        <div class="lbl">持有</div>
      </div>
      <div class="me-stat">
        <div class="num">${favorites.length}</div>
        <div class="lbl">自选</div>
      </div>
    </div>
    <div class="me-card">
      <div class="me-row" onclick="showToast('数据已复制到剪贴板')"><span>导出数据（复制到剪贴板）</span><span class="arrow">›</span></div>
      <div class="me-row" onclick="showToast('自选已清空')"><span>清空自选</span><span class="arrow">›</span></div>
      <div class="me-row" onclick="showToast('持有已清空')"><span>清空持有</span><span class="arrow">›</span></div>
    </div>
    <div class="me-tips">v1.0 · 记账养基助手 · 本地存储，数据不上传服务器</div>
  `;
}

document.getElementById('tabBar').addEventListener('click', function(e) {
  const tabItem = e.target.closest('.tab-item');
  if (!tabItem) return;
  const tab = tabItem.dataset.tab;
  if (tab) switchTab(tab);
});

document.getElementById('backBtn').addEventListener('click', navigateBack);

renderHoldings();
document.getElementById('navTitle').textContent = getTabTitle('holdings');

setInterval(() => {
  mockMarket['A股'][0].price += (Math.random() - 0.5) * 2;
  mockMarket['A股'][0].changePct = ((mockMarket['A股'][0].price - mockMarket['A股'][0].prevClose) / mockMarket['A股'][0].prevClose * 100);
  mockMarket['A股'][1].price += (Math.random() - 0.5) * 3;
  mockMarket['A股'][1].changePct = ((mockMarket['A股'][1].price - mockMarket['A股'][1].prevClose) / mockMarket['A股'][1].prevClose * 100);
  if (currentTab === 'market') renderMarket();
}, 5000);

console.log('记账养基助手 Demo 已就绪');
</script>
</body>
