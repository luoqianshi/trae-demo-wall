<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轨迹地图 · 人生轨迹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .map-section {
      position: relative;
      width: 100%;
      height: calc(100vh - 64px);
      min-height: 500px;
      margin-top: 64px;
      overflow: hidden;
      background: var(--color-neutral-100);
    }

    .map-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/map-view.jpg');
      background-size: cover;
      background-position: center;
      filter: sepia(0.15) saturate(0.9) brightness(1.05);
    }

    .map-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,252,248,0.1) 0%, rgba(255,252,248,0.3) 100%);
    }

    .map-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .map-path-line {
      fill: none;
      stroke: var(--color-primary);
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      stroke-linecap: round;
      opacity: 0.8;
      animation: dashMove 20s linear infinite;
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -280; }
    }

    .map-point {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
    }

    .map-point-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 3px solid var(--color-surface-elevated);
      box-shadow: 0 0 0 4px rgba(196, 135, 59, 0.3), 0 0 20px rgba(196, 135, 59, 0.5);
      position: relative;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }

    .map-point:hover .map-point-dot {
      transform: scale(1.3);
      box-shadow: 0 0 0 6px rgba(196, 135, 59, 0.4), 0 0 30px rgba(196, 135, 59, 0.7);
    }

    .map-point.active .map-point-dot {
      transform: scale(1.4);
      box-shadow: 0 0 0 8px rgba(196, 135, 59, 0.35), 0 0 40px rgba(196, 135, 59, 0.8);
    }

    .map-point-pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(196, 135, 59, 0.4);
      animation: pulse 2s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }

    .city-card {
      position: absolute;
      background: var(--color-surface-elevated);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow-floating);
      border: 1px solid var(--color-border);
      min-width: 180px;
      z-index: 20;
      transform: translate(-50%, -120%);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      cursor: pointer;
    }

    .city-card:hover {
      transform: translate(-50%, -120%) translateY(-4px);
      box-shadow: 0 12px 40px rgba(30, 27, 23, 0.15);
    }

    .city-card::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid var(--color-surface-elevated);
      filter: drop-shadow(0 2px 1px rgba(30, 27, 23, 0.05));
    }

    .city-card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.375rem;
    }

    .city-card-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .city-card-country {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      background: var(--color-primary-lightest);
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    .city-card-date {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-bottom: 0.375rem;
    }

    .city-card-desc {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      line-height: 1.5;
    }

    .city-card-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 0.5rem;
      font-size: var(--text-xs);
      color: var(--color-primary);
      font-weight: 500;
    }

    .stats-section {
      padding: var(--space-3xl) 0;
      background: var(--color-surface);
    }

    .stats-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-lg);
    }

    .stat-card {
      background: var(--color-surface-elevated);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      border: 1px solid var(--color-border);
      text-align: center;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-md);
      border-radius: var(--radius-lg);
      background: var(--color-primary-lightest);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-number {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      font-weight: 700;
      color: var(--color-text-primary);
      line-height: 1.1;
      margin-bottom: 0.25rem;
    }

    .stat-label {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
    }

    .timeline-section {
      padding: var(--space-3xl) 0;
      background: var(--color-neutral-50);
      border-top: 1px solid var(--color-border);
    }

    .timeline-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .section-header {
      text-align: center;
      margin-bottom: var(--space-2xl);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--space-sm);
    }

    .section-subtitle {
      font-size: var(--text-base);
      color: var(--color-text-tertiary);
    }

    .timeline-control {
      background: var(--color-surface-elevated);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
      margin-bottom: var(--space-2xl);
    }

    .timeline-play-bar {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      margin-bottom: var(--space-lg);
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--color-primary);
      color: var(--color-text-inverse);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 16px rgba(196, 135, 59, 0.3);
    }

    .play-btn:hover {
      background: var(--color-primary-hover);
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(196, 135, 59, 0.4);
    }

    .play-btn.playing {
      background: var(--color-success);
      box-shadow: 0 4px 16px rgba(90, 143, 90, 0.3);
    }

    .timeline-info {
      flex: 1;
    }

    .timeline-year {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .timeline-city {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    .timeline-track {
      position: relative;
      height: 4px;
      background: var(--color-neutral-200);
      border-radius: var(--radius-full);
      margin: 0 28px;
    }

    .timeline-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--color-primary);
      border-radius: var(--radius-full);
      width: 0%;
      transition: width 0.5s ease;
    }

    .timeline-nodes {
      position: relative;
      display: flex;
      justify-content: space-between;
      margin-top: -14px;
      padding: 0 28px;
    }

    .timeline-node {
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timeline-node-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--color-surface-elevated);
      border: 3px solid var(--color-neutral-300);
      position: relative;
      z-index: 2;
      transition: all var(--transition-fast);
    }

    .timeline-node:hover .timeline-node-dot {
      border-color: var(--color-primary);
      transform: scale(1.1);
    }

    .timeline-node.active .timeline-node-dot {
      border-color: var(--color-primary);
      background: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(196, 135, 59, 0.25);
    }

    .timeline-node.completed .timeline-node-dot {
      border-color: var(--color-primary);
      background: var(--color-primary);
    }

    .timeline-node-label {
      margin-top: 10px;
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
      font-weight: 500;
      white-space: nowrap;
      transition: color var(--transition-fast);
    }

    .timeline-node:hover .timeline-node-label,
    .timeline-node.active .timeline-node-label {
      color: var(--color-primary);
    }

    .timeline-node-year {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-top: 2px;
    }

    .footprints-section {
      padding: var(--space-3xl) 0;
      background: var(--color-surface);
    }

    .footprints-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .footprints-scroll {
      display: flex;
      gap: var(--space-lg);
      overflow-x: auto;
      padding-bottom: var(--space-lg);
      scroll-snap-type: x mandatory;
    }

    .footprints-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .footprints-scroll::-webkit-scrollbar-track {
      background: var(--color-neutral-100);
      border-radius: var(--radius-full);
    }

    .footprints-scroll::-webkit-scrollbar-thumb {
      background: var(--color-neutral-300);
      border-radius: var(--radius-full);
    }

    .footprint-card {
      flex: 0 0 280px;
      scroll-snap-align: start;
      background: var(--color-surface-elevated);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--color-border);
      cursor: pointer;
      transition: all var(--transition-base);
    }

    .footprint-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--color-primary-light);
    }

    .footprint-card.active {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(196, 135, 59, 0.15);
    }

    .footprint-cover {
      height: 160px;
      background: linear-gradient(135deg, var(--color-primary-lightest) 0%, var(--color-primary-lighter) 100%);
      position: relative;
      overflow: hidden;
    }

    .footprint-cover::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      opacity: 0.3;
    }

    .footprint-cover.beijing::before { content: '🏯'; }
    .footprint-cover.tokyo::before { content: '🗼'; }
    .footprint-cover.dali::before { content: '🏔️'; }
    .footprint-cover.chengdu::before { content: '🐼'; }
    .footprint-cover.shanghai::before { content: '🌃'; }
    .footprint-cover.xian::before { content: '🏛️'; }
    .footprint-cover.xiamen::before { content: '🏝️'; }
    .footprint-cover.lhasa::before { content: '⛩️'; }

    .footprint-season {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 252, 248, 0.9);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-primary-dark);
    }

    .footprint-content {
      padding: var(--space-md) var(--space-lg) var(--space-lg);
    }

    .footprint-city {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 4px;
    }

    .footprint-country {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-sm);
    }

    .footprint-desc {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      line-height: 1.5;
      margin-bottom: var(--space-sm);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .footprint-meta {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
    }

    .footprint-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .city-card {
        min-width: 150px;
        padding: 0.75rem 1rem;
      }

      .city-card-title {
        font-size: var(--text-base);
      }
    }

    @media (max-width: 768px) {
      .map-section {
        height: 60vh;
        min-height: 400px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-md);
      }

      .stat-card {
        padding: var(--space-md);
      }

      .stat-number {
        font-size: var(--text-2xl);
      }

      .stat-icon {
        width: 40px;
        height: 40px;
      }

      .section-title {
        font-size: var(--text-2xl);
      }

      .timeline-control {
        padding: var(--space-md);
      }

      .timeline-play-bar {
        gap: var(--space-md);
      }

      .play-btn {
        width: 48px;
        height: 48px;
      }

      .timeline-year {
        font-size: var(--text-xl);
      }

      .timeline-track {
        margin: 0 12px;
      }

      .timeline-nodes {
        padding: 0 12px;
        overflow-x: auto;
        gap: 2rem;
        justify-content: flex-start;
      }

      .timeline-node {
        flex-shrink: 0;
      }

      .city-card {
        display: none;
      }

      .map-point-dot {
        width: 14px;
        height: 14px;
      }

      .footprint-card {
        flex: 0 0 240px;
      }
    }

    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: var(--space-sm);
      }

      .stat-number {
        font-size: var(--text-xl);
      }

      .stat-label {
        font-size: var(--text-xs);
      }

      .footprint-card {
        flex: 0 0 220px;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="nav-container"></div>

    <section class="map-section" id="mapSection">
      <div class="map-bg"></div>
      <div class="map-overlay"></div>

      <svg class="map-svg" id="mapSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path id="routePath" class="map-path-line" d="" />
      </svg>

      <div id="mapPoints"></div>
      <div id="cityCards"></div>
    </section>

    <section class="stats-section">
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <section class="timeline-section">
      <div class="timeline-container">
        <div class="section-header">
          <h2 class="section-title">旅途时间轴</h2>
          <p class="section-subtitle">点击节点或播放按钮，重温每一段旅程</p>
        </div>

        <div class="timeline-control">
          <div class="timeline-play-bar">
            <button class="play-btn" id="playBtn" onclick="togglePlay()">
              <i data-lucide="play" id="playIcon"></i>
            </button>
            <div class="timeline-info">
              <div class="timeline-year" id="currentYear">2019</div>
              <div class="timeline-city" id="currentCity">北京 · 春</div>
            </div>
          </div>
          <div class="timeline-track">
            <div class="timeline-progress" id="timelineProgress"></div>
          </div>
          <div class="timeline-nodes" id="timelineNodes"></div>
        </div>
      </div>
    </section>

    <section class="footprints-section">
      <div class="footprints-container">
        <div class="section-header">
          <h2 class="section-title">旅途足迹</h2>
          <p class="section-subtitle">每一座城市，都有独特的故事</p>
        </div>
        <div class="footprints-scroll no-scrollbar" id="footprintsList"></div>
      </div>
    </section>

    <div id="footer-container"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentActiveIndex = 0;
    let isPlaying = false;
    let playInterval = null;

    function renderStats() {
      const stats = getStats();
      const statsGrid = document.getElementById('statsGrid');
      
      const statItems = [
        { icon: 'map-pin', number: stats.totalCities, label: '走过的城市' },
        { icon: 'plane', number: stats.totalTrips, label: '旅行次数' },
        { icon: 'route', number: stats.totalDistance + ' km', label: '总行程' },
        { icon: 'camera', number: stats.totalPhotos, label: '旅途照片' }
      ];

      statsGrid.innerHTML = statItems.map(item => `
        <div class="stat-card">
          <div class="stat-icon">
            <i data-lucide="${item.icon}" style="width: 24px; height: 24px;"></i>
          </div>
          <div class="stat-number">${item.number}</div>
          <div class="stat-label">${item.label}</div>
        </div>
      `).join('');
    }

    function renderMapPoints() {
      const mapPoints = document.getElementById('mapPoints');
      const cityCards = document.getElementById('cityCards');

      const displayTrips = TRIP_DATA.filter(t => ['beijing', 'tokyo', 'dali'].includes(t.id));

      mapPoints.innerHTML = TRIP_DATA.map((trip, index) => `
        <div class="map-point ${index === 0 ? 'active' : ''}" 
             id="point-${trip.id}"
             data-id="${trip.id}"
             style="top: ${trip.position.top}; left: ${trip.position.left};"
             onclick="selectTrip('${trip.id}')">
          <div class="map-point-pulse"></div>
          <div class="map-point-dot"></div>
        </div>
      `).join('');

      cityCards.innerHTML = displayTrips.map(trip => `
        <div class="city-card" 
             id="card-${trip.id}"
             data-id="${trip.id}"
             style="top: ${trip.position.top}; left: ${trip.position.left};"
             onclick="selectTrip('${trip.id}')">
          <div class="city-card-header">
            <span class="city-card-title">${trip.city}</span>
            <span class="city-card-country">${trip.country}</span>
          </div>
          <div class="city-card-date">${getYearMonth(trip.startDate)} · ${trip.duration}天</div>
          <div class="city-card-desc">${trip.description}</div>
          <div class="city-card-tag">
            <i data-lucide="image" style="width: 12px; height: 12px;"></i>
            ${trip.photos} 张照片
          </div>
        </div>
      `).join('');
    }

    function renderRoutePath() {
      const routePath = document.getElementById('routePath');
      const points = TRIP_DATA.map(trip => {
        const top = parseFloat(trip.position.top) / 100 * 100;
        const left = parseFloat(trip.position.left) / 100 * 100;
        return `${left},${top}`;
      });
      
      let d = `M ${points[0]}`;
      for (let i = 1; i < points.length; i++) {
        const [x1, y1] = points[i - 1].split(',').map(Number);
        const [x2, y2] = points[i].split(',').map(Number);
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const cx = mx - dy * 0.1;
        const cy = my + dx * 0.1;
        d += ` Q ${cx},${cy} ${x2},${y2}`;
      }
      
      routePath.setAttribute('d', d);
    }

    function renderTimelineNodes() {
      const timelineNodes = document.getElementById('timelineNodes');
      
      timelineNodes.innerHTML = TRIP_DATA.map((trip, index) => `
        <div class="timeline-node ${index === 0 ? 'active' : ''} ${index === 0 ? 'completed' : ''}"
             id="timeline-${trip.id}"
             data-id="${trip.id}"
             data-index="${index}"
             onclick="selectTrip('${trip.id}')">
          <div class="timeline-node-dot"></div>
          <div class="timeline-node-label">${trip.city}</div>
          <div class="timeline-node-year">${trip.year}</div>
        </div>
      `).join('');
    }

    function renderFootprints() {
      const footprintsList = document.getElementById('footprintsList');
      
      footprintsList.innerHTML = TRIP_DATA.map(trip => `
        <div class="footprint-card ${trip.id === TRIP_DATA[0].id ? 'active' : ''}"
             id="footprint-${trip.id}"
             data-id="${trip.id}"
             onclick="selectTrip('${trip.id}')">
          <div class="footprint-cover ${trip.id}">
            <span class="footprint-season">${trip.season}季</span>
          </div>
          <div class="footprint-content">
            <div class="footprint-city">${trip.city}</div>
            <div class="footprint-country">${trip.country} · ${trip.year}</div>
            <div class="footprint-desc">${trip.description}</div>
            <div class="footprint-meta">
              <span class="footprint-meta-item">
                <i data-lucide="calendar" style="width: 12px; height: 12px;"></i>
                ${trip.duration}天
              </span>
              <span class="footprint-meta-item">
                <i data-lucide="image" style="width: 12px; height: 12px;"></i>
                ${trip.photos}张
              </span>
              <span class="footprint-meta-item">
                <i data-lucide="${trip.transport === 'plane' ? 'plane' : 'train'}" style="width: 12px; height: 12px;"></i>
                ${trip.transportLabel}
              </span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function selectTrip(tripId) {
      const tripIndex = TRIP_DATA.findIndex(t => t.id === tripId);
      if (tripIndex === -1) return;
      
      currentActiveIndex = tripIndex;
      const trip = TRIP_DATA[tripIndex];

      document.querySelectorAll('.map-point').forEach(p => p.classList.remove('active'));
      document.getElementById(`point-${tripId}`)?.classList.add('active');

      document.querySelectorAll('.timeline-node').forEach(n => {
        n.classList.remove('active');
        const idx = parseInt(n.dataset.index);
        if (idx <= tripIndex) {
          n.classList.add('completed');
        } else {
          n.classList.remove('completed');
        }
      });
      document.getElementById(`timeline-${tripId}`)?.classList.add('active');

      document.querySelectorAll('.footprint-card').forEach(c => c.classList.remove('active'));
      document.getElementById(`footprint-${tripId}`)?.classList.add('active');

      document.getElementById('currentYear').textContent = trip.year;
      document.getElementById('currentCity').textContent = `${trip.city} · ${trip.season}季`;

      const progress = (tripIndex / (TRIP_DATA.length - 1)) * 100;
      document.getElementById('timelineProgress').style.width = `${progress}%`;

      const footprintCard = document.getElementById(`footprint-${tripId}`);
      if (footprintCard) {
        footprintCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const playBtn = document.getElementById('playBtn');
      const playIcon = document.getElementById('playIcon');

      if (isPlaying) {
        playBtn.classList.add('playing');
        playIcon.setAttribute('data-lucide', 'pause');
        startAutoPlay();
      } else {
        playBtn.classList.remove('playing');
        playIcon.setAttribute('data-lucide', 'play');
        stopAutoPlay();
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function startAutoPlay() {
      playInterval = setInterval(() => {
        let nextIndex = currentActiveIndex + 1;
        if (nextIndex >= TRIP_DATA.length) {
          nextIndex = 0;
        }
        selectTrip(TRIP_DATA[nextIndex].id);
      }, 2500);
    }

    function stopAutoPlay() {
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
      }
    }

    function init() {
      initPage('nav-map');
      renderStats();
      renderMapPoints();
      renderRoutePath();
      renderTimelineNodes();
      renderFootprints();
      
      if (window.lucide) {
        lucide.createIcons();
      }

      window.addEventListener('resize', renderRoutePath);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
