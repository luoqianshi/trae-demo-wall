<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光回放 · 人生轨迹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      color: #FAF8F5;
      background: #1E1B17;
    }

    .playback-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      background-image: url('assets/playback-cinematic.jpg');
      background-size: cover;
      background-position: center;
      filter: saturate(0.8) brightness(0.7);
      transform: scale(1.05);
      transition: transform 8s ease;
    }

    .bg-gradient {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(180deg, rgba(30, 27, 23, 0.4) 0%, rgba(30, 27, 23, 0.2) 30%, rgba(30, 27, 23, 0.5) 70%, rgba(30, 27, 23, 0.85) 100%),
        linear-gradient(90deg, rgba(30, 27, 23, 0.6) 0%, rgba(30, 27, 23, 0.1) 30%, rgba(30, 27, 23, 0.1) 70%, rgba(30, 27, 23, 0.6) 100%);
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(30, 27, 23, 0.5) 0%, transparent 100%);
    }

    .top-bar-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 252, 248, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 252, 248, 0.15);
      color: #FAF8F5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-base);
    }

    .top-bar-btn:hover {
      background: rgba(255, 252, 248, 0.18);
      border-color: rgba(255, 252, 248, 0.25);
      transform: scale(1.05);
    }

    .top-bar-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 600;
      color: #FAF8F5;
      letter-spacing: 0.05em;
    }

    .top-bar-title span {
      color: var(--color-primary);
    }

    .sidebar {
      position: absolute;
      left: 2rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 90;
      width: 260px;
      background: rgba(30, 27, 23, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 252, 248, 0.1);
      border-radius: var(--radius-lg);
      padding: 1.5rem 1rem;
      max-height: 70vh;
      overflow-y: auto;
    }

    .sidebar-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 600;
      color: #FAF8F5;
      margin-bottom: 1rem;
      padding: 0 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-title i {
      color: var(--color-primary);
    }

    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chapter-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
    }

    .chapter-item:hover {
      background: rgba(255, 252, 248, 0.06);
    }

    .chapter-item.active {
      background: rgba(196, 135, 59, 0.15);
      border: 1px solid rgba(196, 135, 59, 0.3);
    }

    .chapter-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: var(--color-primary);
      border-radius: 0 2px 2px 0;
    }

    .chapter-status {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .chapter-status.completed {
      background: rgba(90, 143, 90, 0.2);
      color: #7CB87C;
    }

    .chapter-status.active {
      background: rgba(196, 135, 59, 0.25);
      color: var(--color-primary);
    }

    .chapter-status.pending {
      background: rgba(255, 252, 248, 0.08);
      color: rgba(255, 252, 248, 0.4);
    }

    .chapter-info {
      flex: 1;
      min-width: 0;
    }

    .chapter-year {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 600;
      color: #FAF8F5;
      line-height: 1.2;
    }

    .chapter-city {
      font-size: var(--text-xs);
      color: rgba(255, 252, 248, 0.6);
      margin-top: 2px;
    }

    .chapter-item.active .chapter-city {
      color: var(--color-primary-light);
    }

    .chapter-season {
      font-size: var(--text-xs);
      color: rgba(255, 252, 248, 0.4);
      font-family: var(--font-display);
    }

    .center-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      text-align: center;
      max-width: 600px;
      padding: 0 2rem;
    }

    .chapter-label {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      color: var(--color-primary);
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeInDown 1s ease forwards;
      animation-delay: 0.2s;
    }

    .chapter-main-title {
      font-family: var(--font-display);
      font-size: var(--text-6xl);
      font-weight: 800;
      color: #FAF8F5;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeInUp 1.2s ease forwards;
      animation-delay: 0.4s;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .chapter-main-title .year {
      color: var(--color-primary);
    }

    .chapter-quote {
      font-size: var(--text-lg);
      color: rgba(255, 252, 248, 0.75);
      line-height: var(--leading-relaxed);
      font-style: italic;
      opacity: 0;
      animation: fadeInUp 1.2s ease forwards;
      animation-delay: 0.6s;
    }

    .polaroid-card {
      position: absolute;
      right: 4rem;
      top: 50%;
      transform: translateY(-50%) rotate(4deg);
      z-index: 80;
      width: 280px;
      background: #FFFCF8;
      padding: 1rem 1rem 3.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      transition: transform var(--transition-slow), box-shadow var(--transition-slow);
      cursor: pointer;
    }

    .polaroid-card:hover {
      transform: translateY(-50%) rotate(0deg) scale(1.03);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }

    .polaroid-photo {
      width: 100%;
      aspect-ratio: 1;
      background: var(--color-neutral-200);
      overflow: hidden;
      position: relative;
    }

    .polaroid-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .polaroid-caption {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      right: 1rem;
      text-align: center;
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      color: var(--color-neutral-700);
    }

    .polaroid-caption .date {
      font-weight: 600;
    }

    .polaroid-caption .location {
      font-size: 1rem;
      color: var(--color-neutral-500);
      margin-top: 2px;
    }

    .bottom-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding-bottom: 1.5rem;
    }

    .timeline-section {
      padding: 0 3rem 1.5rem;
    }

    .timeline-track {
      position: relative;
      height: 60px;
      display: flex;
      align-items: center;
    }

    .timeline-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 2px;
      background: rgba(255, 252, 248, 0.15);
    }

    .timeline-progress {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 2px;
      background: linear-gradient(90deg, var(--color-primary-dark), var(--color-primary), var(--color-primary-light));
      transition: width var(--transition-slow);
      box-shadow: 0 0 10px rgba(196, 135, 59, 0.5);
    }

    .timeline-nodes {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timeline-node {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 10;
    }

    .timeline-node-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--color-neutral-500);
      border: 2px solid rgba(30, 27, 23, 0.8);
      transition: all var(--transition-base);
    }

    .timeline-node.completed .timeline-node-dot {
      background: var(--color-success);
      box-shadow: 0 0 8px rgba(90, 143, 90, 0.5);
    }

    .timeline-node.active .timeline-node-dot {
      width: 20px;
      height: 20px;
      background: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(196, 135, 59, 0.25), 0 0 20px rgba(196, 135, 59, 0.6);
      animation: nodePulse 2s ease-in-out infinite;
    }

    .timeline-node.pending .timeline-node-dot {
      background: rgba(255, 252, 248, 0.3);
    }

    .timeline-node:hover .timeline-node-dot {
      transform: scale(1.3);
    }

    .timeline-node-label {
      position: absolute;
      bottom: -28px;
      font-size: var(--text-xs);
      color: rgba(255, 252, 248, 0.6);
      white-space: nowrap;
      font-family: var(--font-display);
      opacity: 0;
      transform: translateY(-4px);
      transition: all var(--transition-base);
    }

    .timeline-node:hover .timeline-node-label,
    .timeline-node.active .timeline-node-label {
      opacity: 1;
      transform: translateY(0);
    }

    .timeline-node.active .timeline-node-label {
      color: var(--color-primary);
      font-weight: 600;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 252, 248, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 252, 248, 0.12);
      color: #FAF8F5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-base);
    }

    .control-btn:hover {
      background: rgba(255, 252, 248, 0.15);
      border-color: rgba(255, 252, 248, 0.25);
      transform: scale(1.08);
    }

    .play-btn {
      width: 68px;
      height: 68px;
      background: var(--color-primary);
      border: none;
      color: #1E1B17;
      box-shadow: 0 8px 30px rgba(196, 135, 59, 0.4);
    }

    .play-btn:hover {
      background: var(--color-primary-light);
      transform: scale(1.1);
      box-shadow: 0 12px 40px rgba(196, 135, 59, 0.5);
    }

    .keyboard-hint {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255, 252, 248, 0.08);
    }

    .key-hint {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: var(--text-xs);
      color: rgba(255, 252, 248, 0.4);
    }

    .key-cap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      background: rgba(255, 252, 248, 0.08);
      border: 1px solid rgba(255, 252, 248, 0.15);
      border-radius: 4px;
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: rgba(255, 252, 248, 0.7);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes nodePulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(196, 135, 59, 0.25), 0 0 20px rgba(196, 135, 59, 0.6); }
      50% { box-shadow: 0 0 0 8px rgba(196, 135, 59, 0.15), 0 0 30px rgba(196, 135, 59, 0.8); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .chapter-item {
      animation: slideInLeft 0.5s ease both;
    }

    .chapter-item:nth-child(1) { animation-delay: 0.1s; }
    .chapter-item:nth-child(2) { animation-delay: 0.2s; }
    .chapter-item:nth-child(3) { animation-delay: 0.3s; }
    .chapter-item:nth-child(4) { animation-delay: 0.4s; }
    .chapter-item:nth-child(5) { animation-delay: 0.5s; }

    @media (max-width: 1024px) {
      .sidebar {
        display: none;
      }

      .polaroid-card {
        right: 2rem;
        width: 220px;
      }

      .center-content {
        padding: 0 1.5rem;
      }

      .chapter-main-title {
        font-size: var(--text-5xl);
      }
    }

    @media (max-width: 768px) {
      .top-bar {
        padding: 1rem 1.25rem;
      }

      .top-bar-title {
        font-size: var(--text-base);
      }

      .polaroid-card {
        position: absolute;
        right: auto;
        left: 50%;
        top: auto;
        bottom: 140px;
        transform: translateX(-50%) rotate(2deg);
        width: 200px;
        padding: 0.75rem 0.75rem 2.5rem;
      }

      .polaroid-card:hover {
        transform: translateX(-50%) rotate(0deg) scale(1.03);
      }

      .polaroid-caption {
        font-size: 1rem;
        bottom: 0.75rem;
      }

      .center-content {
        top: 35%;
        max-width: 90%;
      }

      .chapter-label {
        font-size: var(--text-base);
      }

      .chapter-main-title {
        font-size: var(--text-4xl);
      }

      .chapter-quote {
        font-size: var(--text-base);
      }

      .timeline-section {
        padding: 0 1.5rem 1rem;
      }

      .timeline-node-label {
        display: none;
      }

      .controls-row {
        gap: 1rem;
        margin-bottom: 0.75rem;
      }

      .control-btn {
        width: 40px;
        height: 40px;
      }

      .play-btn {
        width: 56px;
        height: 56px;
      }

      .keyboard-hint {
        display: none;
      }

      .bottom-section {
        padding-bottom: 1rem;
      }
    }

    .sidebar::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 252, 248, 0.15);
      border-radius: 2px;
    }

    .chapter-content-enter {
      animation: fadeInUp 0.8s ease both;
    }

    .polaroid-enter {
      animation: polaroidIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes polaroidIn {
      from {
        opacity: 0;
        transform: translateY(-50%) rotate(8deg) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translateY(-50%) rotate(4deg) scale(1);
      }
    }

    @media (max-width: 768px) {
      @keyframes polaroidIn {
        from {
          opacity: 0;
          transform: translateX(-50%) rotate(6deg) scale(0.8);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) rotate(2deg) scale(1);
        }
      }
    }
  </style>
</head>
<body>
  <div class="playback-container">
    <div class="bg-image" id="bgImage"></div>
    <div class="bg-gradient"></div>

    <div class="top-bar">
      <button class="top-bar-btn" onclick="goBack()" title="返回">
        <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
      </button>
      <div class="top-bar-title">
        <span>时光</span>回放
      </div>
      <button class="top-bar-btn" onclick="toggleSettings()" title="设置">
        <i data-lucide="settings" style="width: 20px; height: 20px;"></i>
      </button>
    </div>

    <aside class="sidebar">
      <div class="sidebar-title">
        <i data-lucide="book-open" style="width: 18px; height: 18px;"></i>
        旅行章节
      </div>
      <div class="chapter-list" id="chapterList"></div>
    </aside>

    <div class="center-content" id="centerContent">
      <div class="chapter-label" id="chapterLabel">第 2 章</div>
      <h1 class="chapter-main-title" id="chapterTitle">
        <span class="year">2019</span>·夏·东京
      </h1>
      <p class="chapter-quote" id="chapterQuote">夏日祭的烟火照亮了整个夜空</p>
    </div>

    <div class="polaroid-card" id="polaroidCard">
      <div class="polaroid-photo">
        <img src="assets/album-samples.jpg" alt="旅行照片" id="polaroidImg">
      </div>
      <div class="polaroid-caption">
        <div class="date" id="polaroidDate">2019.08.01</div>
        <div class="location" id="polaroidLocation">东京 · 日本</div>
      </div>
    </div>

    <div class="bottom-section">
      <div class="timeline-section">
        <div class="timeline-track">
          <div class="timeline-line"></div>
          <div class="timeline-progress" id="timelineProgress"></div>
          <div class="timeline-nodes" id="timelineNodes"></div>
        </div>
      </div>

      <div class="controls-row">
        <button class="control-btn" onclick="prevChapter()" title="上一章节">
          <i data-lucide="skip-back" style="width: 20px; height: 20px;"></i>
        </button>
        <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">
          <i data-lucide="play" style="width: 28px; height: 28px;" id="playIcon"></i>
        </button>
        <button class="control-btn" onclick="nextChapter()" title="下一章节">
          <i data-lucide="skip-forward" style="width: 20px; height: 20px;"></i>
        </button>
      </div>

      <div class="keyboard-hint">
        <div class="key-hint">
          <span class="key-cap">Space</span>
          <span>播放/暂停</span>
        </div>
        <div class="key-hint">
          <span class="key-cap">←</span>
          <span>上一章节</span>
        </div>
        <div class="key-hint">
          <span class="key-cap">→</span>
          <span>下一章节</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentChapterIndex = 0;
    let isPlaying = false;
    let autoPlayTimer = null;
    const CHAPTER_DURATION = 5000;

    function init() {
      const activeIndex = PLAYBACK_CHAPTERS.findIndex(c => c.isActive);
      currentChapterIndex = activeIndex >= 0 ? activeIndex : 0;

      renderChapterList();
      renderTimelineNodes();
      updateChapter(currentChapterIndex);
      updateTimelineProgress();

      if (window.lucide) {
        lucide.createIcons();
      }

      document.addEventListener('keydown', handleKeydown);
    }

    function renderChapterList() {
      const list = document.getElementById('chapterList');
      list.innerHTML = PLAYBACK_CHAPTERS.map((chapter, index) => {
        let status = 'pending';
        let icon = 'circle';
        if (chapter.isCompleted) {
          status = 'completed';
          icon = 'check-circle-2';
        } else if (chapter.isActive) {
          status = 'active';
          icon = 'play-circle';
        }

        return `
          <div class="chapter-item ${index === currentChapterIndex ? 'active' : ''}" 
               onclick="goToChapter(${index})"
               data-index="${index}">
            <div class="chapter-status ${status}">
              <i data-lucide="${icon}" style="width: 14px; height: 14px;"></i>
            </div>
            <div class="chapter-info">
              <div class="chapter-year">${chapter.year} · ${chapter.season}</div>
              <div class="chapter-city">${chapter.city}</div>
            </div>
            <div class="chapter-season">第${chapter.id}章</div>
          </div>
        `;
      }).join('');
    }

    function renderTimelineNodes() {
      const container = document.getElementById('timelineNodes');
      container.innerHTML = PLAYBACK_CHAPTERS.map((chapter, index) => {
        let status = 'pending';
        if (chapter.isCompleted) status = 'completed';
        else if (chapter.isActive || index === currentChapterIndex) status = 'active';

        return `
          <div class="timeline-node ${status}" onclick="goToChapter(${index})" data-index="${index}">
            <div class="timeline-node-dot"></div>
            <div class="timeline-node-label">${chapter.city}</div>
          </div>
        `;
      }).join('');
    }

    function updateChapter(index) {
      const chapter = PLAYBACK_CHAPTERS[index];
      if (!chapter) return;

      const centerContent = document.getElementById('centerContent');
      const polaroidCard = document.getElementById('polaroidCard');

      centerContent.style.animation = 'none';
      polaroidCard.style.animation = 'none';
      polaroidCard.offsetHeight;
      centerContent.offsetHeight;

      document.getElementById('chapterLabel').textContent = `第 ${chapter.id} 章`;
      document.getElementById('chapterTitle').innerHTML = `
        <span class="year">${chapter.year}</span>·${chapter.season}·${chapter.city}
      `;
      document.getElementById('chapterQuote').textContent = chapter.quote;

      const trip = TRIP_DATA.find(t => t.id === chapter.tripId);
      if (trip) {
        document.getElementById('polaroidDate').textContent = formatDate(trip.startDate);
        document.getElementById('polaroidLocation').textContent = `${trip.city} · ${trip.country}`;
      } else {
        document.getElementById('polaroidDate').textContent = `${chapter.year}.${chapter.month}`;
        document.getElementById('polaroidLocation').textContent = chapter.city;
      }

      centerContent.querySelectorAll('.chapter-label, .chapter-main-title, .chapter-quote').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });

      polaroidCard.classList.remove('polaroid-enter');
      void polaroidCard.offsetWidth;
      polaroidCard.classList.add('polaroid-enter');

      document.querySelectorAll('.chapter-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });

      PLAYBACK_CHAPTERS.forEach((c, i) => {
        c.isActive = i === index;
      });

      renderTimelineNodes();
      updateTimelineProgress();

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function updateTimelineProgress() {
      const total = PLAYBACK_CHAPTERS.length - 1;
      const progress = total > 0 ? (currentChapterIndex / total) * 100 : 0;
      document.getElementById('timelineProgress').style.width = progress + '%';
    }

    function goToChapter(index) {
      if (index < 0 || index >= PLAYBACK_CHAPTERS.length) return;
      currentChapterIndex = index;
      updateChapter(index);
    }

    function nextChapter() {
      if (currentChapterIndex < PLAYBACK_CHAPTERS.length - 1) {
        goToChapter(currentChapterIndex + 1);
      } else {
        isPlaying = false;
        updatePlayButton();
        clearInterval(autoPlayTimer);
      }
    }

    function prevChapter() {
      if (currentChapterIndex > 0) {
        goToChapter(currentChapterIndex - 1);
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      updatePlayButton();

      if (isPlaying) {
        startAutoPlay();
      } else {
        stopAutoPlay();
      }
    }

    function updatePlayButton() {
      const icon = document.getElementById('playIcon');
      if (isPlaying) {
        icon.setAttribute('data-lucide', 'pause');
      } else {
        icon.setAttribute('data-lucide', 'play');
      }
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function startAutoPlay() {
      stopAutoPlay();
      autoPlayTimer = setInterval(() => {
        if (currentChapterIndex < PLAYBACK_CHAPTERS.length - 1) {
          nextChapter();
        } else {
          isPlaying = false;
          updatePlayButton();
          stopAutoPlay();
        }
      }, CHAPTER_DURATION);
    }

    function stopAutoPlay() {
      if (autoPlayTimer) {
        clearInterval(autoPlayTimer);
        autoPlayTimer = null;
      }
    }

    function handleKeydown(e) {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        nextChapter();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        prevChapter();
      }
    }

    function goBack() {
      stopAutoPlay();
      window.history.back();
    }

    function toggleSettings() {
      console.log('Settings clicked');
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
