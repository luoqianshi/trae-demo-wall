<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅途相册 · 人生轨迹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Caveat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .album-hero {
      margin-top: 64px;
      padding: var(--space-4xl) 0 var(--space-2xl);
      background: linear-gradient(180deg, var(--color-primary-lightest) 0%, var(--color-surface) 100%);
    }

    .album-hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .album-title {
      font-family: var(--font-display);
      font-size: var(--text-5xl);
      font-weight: 800;
      color: var(--color-text-primary);
      margin-bottom: var(--space-md);
      line-height: var(--leading-tight);
    }

    .album-title span {
      color: var(--color-primary);
      font-style: italic;
    }

    .album-subtitle {
      font-family: 'Caveat', cursive;
      font-size: var(--text-2xl);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-xl);
    }

    .album-stats {
      display: flex;
      gap: var(--space-2xl);
      flex-wrap: wrap;
    }

    .album-stat-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .album-stat-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-lg);
      background: var(--color-primary-lightest);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .album-stat-number {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      color: var(--color-text-primary);
      line-height: 1.1;
    }

    .album-stat-label {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
    }

    .featured-banner {
      max-width: 1200px;
      margin: 0 auto var(--space-3xl);
      padding: 0 1.5rem;
    }

    .featured-banner-inner {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-floating);
    }

    .featured-banner img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .featured-banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(196, 135, 59, 0.2) 0%, rgba(30, 27, 23, 0.4) 100%);
      pointer-events: none;
    }

    .featured-banner-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: var(--space-2xl);
      color: var(--color-text-inverse);
    }

    .featured-banner-tag {
      display: inline-block;
      background: var(--color-primary);
      color: var(--color-text-inverse);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 600;
      margin-bottom: var(--space-sm);
    }

    .featured-banner-title {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 700;
      margin-bottom: var(--space-xs);
    }

    .featured-banner-desc {
      font-family: 'Caveat', cursive;
      font-size: var(--text-xl);
      opacity: 0.9;
    }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem var(--space-4xl);
      flex: 1;
    }

    .content-layout {
      display: flex;
      gap: var(--space-2xl);
      align-items: flex-start;
    }

    .filter-sidebar {
      flex: 0 0 240px;
      position: sticky;
      top: 88px;
    }

    .filter-card {
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
    }

    .filter-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .filter-options {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 8px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }

    .filter-option:hover {
      background: var(--color-primary-lightest);
      color: var(--color-primary);
    }

    .filter-option.active {
      background: var(--color-primary-lightest);
      color: var(--color-primary);
      font-weight: 600;
    }

    .filter-option-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-neutral-300);
      flex-shrink: 0;
    }

    .filter-option.active .filter-option-dot {
      background: var(--color-primary);
    }

    .sort-select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      color: var(--color-text-primary);
      font-size: var(--text-sm);
      font-family: var(--font-body);
      cursor: pointer;
      transition: border-color var(--transition-fast);
    }

    .sort-select:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .album-main {
      flex: 1;
      min-width: 0;
    }

    .album-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-xl);
      gap: var(--space-lg);
      flex-wrap: wrap;
    }

    .view-toggle {
      display: flex;
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 4px;
    }

    .view-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      background: transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      transition: all var(--transition-fast);
      font-family: var(--font-body);
    }

    .view-toggle-btn:hover {
      color: var(--color-primary);
    }

    .view-toggle-btn.active {
      background: var(--color-primary);
      color: var(--color-text-inverse);
    }

    .album-result-count {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
    }

    .album-result-count strong {
      color: var(--color-primary);
      font-family: var(--font-display);
      font-size: var(--text-lg);
    }

    .masonry-grid {
      column-count: 3;
      column-gap: var(--space-lg);
    }

    .polaroid-card {
      break-inside: avoid;
      margin-bottom: var(--space-lg);
      background: var(--color-surface-elevated);
      border-radius: var(--radius-md);
      padding: 10px 10px 16px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
    }

    .polaroid-card:hover {
      transform: translateY(-6px) rotate(-0.5deg);
      box-shadow: var(--shadow-floating);
      border-color: var(--color-primary-light);
    }

    .polaroid-card:nth-child(even):hover {
      transform: translateY(-6px) rotate(0.5deg);
    }

    .polaroid-image {
      width: 100%;
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }

    .polaroid-image img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .polaroid-image-placeholder {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      background: linear-gradient(135deg, var(--color-primary-lightest) 0%, var(--color-primary-lighter) 100%);
    }

    .polaroid-caption {
      text-align: center;
    }

    .polaroid-city {
      font-family: 'Caveat', cursive;
      font-size: var(--text-xl);
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 2px;
    }

    .polaroid-date {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
    }

    .polaroid-tag {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 252, 248, 0.9);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--color-primary-dark);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .timeline-view {
      display: none;
    }

    .timeline-view.active {
      display: block;
    }

    .masonry-view.active {
      display: block;
    }

    .masonry-view {
      display: none;
    }

    .timeline-group {
      margin-bottom: var(--space-2xl);
    }

    .timeline-group-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .timeline-year {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 700;
      color: var(--color-primary);
    }

    .timeline-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--color-primary-light) 0%, transparent 100%);
      border-radius: var(--radius-full);
    }

    .timeline-items {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-lg);
    }

    .bottom-bar {
      background: var(--color-surface-elevated);
      border-top: 1px solid var(--color-border);
      padding: var(--space-xl) 0;
    }

    .bottom-bar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-xl);
      flex-wrap: wrap;
    }

    .bottom-stats {
      display: flex;
      gap: var(--space-2xl);
      flex-wrap: wrap;
    }

    .bottom-stat {
      text-align: center;
    }

    .bottom-stat-number {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      color: var(--color-text-primary);
      line-height: 1.1;
    }

    .bottom-stat-label {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-top: 2px;
    }

    .playback-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: var(--color-text-inverse);
      padding: 0.875rem 1.75rem;
      border-radius: var(--radius-lg);
      border: none;
      cursor: pointer;
      font-size: var(--text-base);
      font-weight: 600;
      transition: all var(--transition-fast);
      font-family: var(--font-body);
      box-shadow: 0 4px 16px rgba(196, 135, 59, 0.3);
    }

    .playback-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(196, 135, 59, 0.4);
    }

    .city-emoji-map {
      display: none;
    }

    @media (max-width: 1024px) {
      .masonry-grid {
        column-count: 2;
      }

      .filter-sidebar {
        flex: 0 0 200px;
      }
    }

    @media (max-width: 768px) {
      .album-title {
        font-size: var(--text-3xl);
      }

      .album-subtitle {
        font-size: var(--text-xl);
      }

      .featured-banner img {
        height: 220px;
      }

      .featured-banner-title {
        font-size: var(--text-2xl);
      }

      .content-layout {
        flex-direction: column;
      }

      .filter-sidebar {
        flex: 0 0 auto;
        width: 100%;
        position: static;
        order: -1;
      }

      .filter-card-row {
        display: flex;
        gap: var(--space-md);
        overflow-x: auto;
        padding-bottom: var(--space-sm);
      }

      .filter-card {
        flex: 0 0 auto;
        min-width: 160px;
        margin-bottom: 0;
      }

      .masonry-grid {
        column-count: 1;
      }

      .timeline-items {
        grid-template-columns: 1fr;
      }

      .album-stats {
        gap: var(--space-lg);
      }

      .album-stat-icon {
        width: 36px;
        height: 36px;
      }

      .album-stat-number {
        font-size: var(--text-xl);
      }

      .bottom-bar-inner {
        flex-direction: column;
        text-align: center;
      }

      .bottom-stats {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .album-hero {
        padding: var(--space-2xl) 0 var(--space-xl);
      }

      .featured-banner img {
        height: 180px;
      }

      .featured-banner-content {
        padding: var(--space-lg);
      }

      .polaroid-card:hover {
        transform: translateY(-4px);
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="nav-container"></div>

    <section class="album-hero">
      <div class="album-hero-inner">
        <h1 class="album-title">旅途<span>相册</span></h1>
        <p class="album-subtitle">每一张照片，都是时光的标本</p>
        <div class="album-stats">
          <div class="album-stat-item">
            <div class="album-stat-icon">
              <i data-lucide="camera" style="width: 20px; height: 20px;"></i>
            </div>
            <div>
              <div class="album-stat-number">365</div>
              <div class="album-stat-label">张照片</div>
            </div>
          </div>
          <div class="album-stat-item">
            <div class="album-stat-icon">
              <i data-lucide="map-pin" style="width: 20px; height: 20px;"></i>
            </div>
            <div>
              <div class="album-stat-number">12</div>
              <div class="album-stat-label">座城市</div>
            </div>
          </div>
          <div class="album-stat-item">
            <div class="album-stat-icon">
              <i data-lucide="calendar" style="width: 20px; height: 20px;"></i>
            </div>
            <div>
              <div class="album-stat-number">6</div>
              <div class="album-stat-label">年时光</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="featured-banner">
      <div class="featured-banner-inner">
        <img src="assets/album-samples.jpg" alt="精选照片">
        <div class="featured-banner-overlay"></div>
        <div class="featured-banner-content">
          <span class="featured-banner-tag">
            <i data-lucide="star" style="width: 12px; height: 12px; display: inline-block; vertical-align: middle;"></i>
            精选推荐
          </span>
          <h2 class="featured-banner-title">光影中的旅行故事</h2>
          <p class="featured-banner-desc">用镜头记录每一段难忘的旅程</p>
        </div>
      </div>
    </section>

    <div class="main-content">
      <div class="content-layout">
        <aside class="filter-sidebar">
          <div class="filter-card-row" id="filterCardsRow">
            <div class="filter-card">
              <h3 class="filter-title">
                <i data-lucide="calendar" style="width: 18px; height: 18px;"></i>
                年份
              </h3>
              <div class="filter-options" id="yearFilter">
                <div class="filter-option active" data-value="all">
                  <span class="filter-option-dot"></span>
                  全部年份
                </div>
                <div class="filter-option" data-value="2024">
                  <span class="filter-option-dot"></span>
                  2024年
                </div>
                <div class="filter-option" data-value="2023">
                  <span class="filter-option-dot"></span>
                  2023年
                </div>
                <div class="filter-option" data-value="2022">
                  <span class="filter-option-dot"></span>
                  2022年
                </div>
                <div class="filter-option" data-value="2021">
                  <span class="filter-option-dot"></span>
                  2021年
                </div>
                <div class="filter-option" data-value="2020">
                  <span class="filter-option-dot"></span>
                  2020年
                </div>
                <div class="filter-option" data-value="2019">
                  <span class="filter-option-dot"></span>
                  2019年
                </div>
              </div>
            </div>

            <div class="filter-card">
              <h3 class="filter-title">
                <i data-lucide="map-pin" style="width: 18px; height: 18px;"></i>
                城市
              </h3>
              <div class="filter-options" id="cityFilter">
                <div class="filter-option active" data-value="all">
                  <span class="filter-option-dot"></span>
                  全部城市
                </div>
                <div class="filter-option" data-value="北京">
                  <span class="filter-option-dot"></span>
                  北京
                </div>
                <div class="filter-option" data-value="东京">
                  <span class="filter-option-dot"></span>
                  东京
                </div>
                <div class="filter-option" data-value="大理">
                  <span class="filter-option-dot"></span>
                  大理
                </div>
                <div class="filter-option" data-value="成都">
                  <span class="filter-option-dot"></span>
                  成都
                </div>
                <div class="filter-option" data-value="西安">
                  <span class="filter-option-dot"></span>
                  西安
                </div>
                <div class="filter-option" data-value="厦门">
                  <span class="filter-option-dot"></span>
                  厦门
                </div>
                <div class="filter-option" data-value="拉萨">
                  <span class="filter-option-dot"></span>
                  拉萨
                </div>
              </div>
            </div>

            <div class="filter-card">
              <h3 class="filter-title">
                <i data-lucide="plane" style="width: 18px; height: 18px;"></i>
                交通方式
              </h3>
              <div class="filter-options" id="transportFilter">
                <div class="filter-option active" data-value="all">
                  <span class="filter-option-dot"></span>
                  全部方式
                </div>
                <div class="filter-option" data-value="plane">
                  <span class="filter-option-dot"></span>
                  ✈️ 飞机
                </div>
                <div class="filter-option" data-value="train">
                  <span class="filter-option-dot"></span>
                  🚄 高铁
                </div>
                <div class="filter-option" data-value="car">
                  <span class="filter-option-dot"></span>
                  🚗 自驾
                </div>
              </div>
            </div>

            <div class="filter-card">
              <h3 class="filter-title">
                <i data-lucide="sliders-horizontal" style="width: 18px; height: 18px;"></i>
                排序
              </h3>
              <select class="sort-select" id="sortSelect">
                <option value="date-desc">日期从新到旧</option>
                <option value="date-asc">日期从旧到新</option>
                <option value="city">按城市排序</option>
              </select>
            </div>
          </div>
        </aside>

        <main class="album-main">
          <div class="album-toolbar">
            <div class="view-toggle">
              <button class="view-toggle-btn active" data-view="masonry" onclick="switchView('masonry')">
                <i data-lucide="grid-3x3" style="width: 16px; height: 16px;"></i>
                网格视图
              </button>
              <button class="view-toggle-btn" data-view="timeline" onclick="switchView('timeline')">
                <i data-lucide="list" style="width: 16px; height: 16px;"></i>
                时间轴视图
              </button>
            </div>
            <div class="album-result-count">
              共 <strong id="resultCount">12</strong> 张照片
            </div>
          </div>

          <div class="masonry-view active" id="masonryView">
            <div class="masonry-grid" id="masonryGrid"></div>
          </div>

          <div class="timeline-view" id="timelineView">
            <div id="timelineContent"></div>
          </div>
        </main>
      </div>
    </div>

    <section class="bottom-bar">
      <div class="bottom-bar-inner">
        <div class="bottom-stats">
          <div class="bottom-stat">
            <div class="bottom-stat-number">365</div>
            <div class="bottom-stat-label">照片总数</div>
          </div>
          <div class="bottom-stat">
            <div class="bottom-stat-number">12</div>
            <div class="bottom-stat-label">城市数量</div>
          </div>
          <div class="bottom-stat">
            <div class="bottom-stat-number">8</div>
            <div class="bottom-stat-label">旅行次数</div>
          </div>
          <div class="bottom-stat">
            <div class="bottom-stat-number">23,450 km</div>
            <div class="bottom-stat-label">总行程</div>
          </div>
        </div>
        <button class="playback-btn" onclick="goToPlayback()">
          <i data-lucide="play-circle" style="width: 20px; height: 20px;"></i>
          时光回放
        </button>
      </div>
    </section>

    <div id="footer-container"></div>
  </div>

  <div class="city-emoji-map">
    <span data-city="北京">🏯</span>
    <span data-city="东京">🗼</span>
    <span data-city="大理">🏔️</span>
    <span data-city="巴黎">🗼</span>
    <span data-city="首尔">🏙️</span>
    <span data-city="成都">🐼</span>
    <span data-city="西安">🏛️</span>
    <span data-city="厦门">🏝️</span>
    <span data-city="拉萨">⛩️</span>
    <span data-city="上海">🌃</span>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentView = 'masonry';
    let currentFilters = {
      year: 'all',
      city: 'all',
      transport: 'all',
      sort: 'date-desc'
    };

    function getCityEmoji(city) {
      const emojiMap = {
        '北京': '🏯',
        '东京': '🗼',
        '大理': '🏔️',
        '巴黎': '🗼',
        '首尔': '🏙️',
        '成都': '🐼',
        '西安': '🏛️',
        '厦门': '🏝️',
        '拉萨': '⛩️',
        '上海': '🌃'
      };
      return emojiMap[city] || '📷';
    }

    function getPhotoTrip(photo) {
      return TRIP_DATA.find(t => t.id === photo.tripId);
    }

    function filterPhotos() {
      let photos = [...PHOTO_SAMPLES];

      if (currentFilters.year !== 'all') {
        photos = photos.filter(p => {
          const trip = getPhotoTrip(p);
          return trip && trip.year == currentFilters.year;
        });
      }

      if (currentFilters.city !== 'all') {
        photos = photos.filter(p => p.city === currentFilters.city);
      }

      if (currentFilters.transport !== 'all') {
        photos = photos.filter(p => {
          const trip = getPhotoTrip(p);
          return trip && trip.transport === currentFilters.transport;
        });
      }

      switch (currentFilters.sort) {
        case 'date-desc':
          photos.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case 'date-asc':
          photos.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case 'city':
          photos.sort((a, b) => a.city.localeCompare(b.city, 'zh-CN'));
          break;
      }

      return photos;
    }

    function renderMasonry() {
      const photos = filterPhotos();
      const grid = document.getElementById('masonryGrid');
      const resultCount = document.getElementById('resultCount');

      resultCount.textContent = photos.length;

      grid.innerHTML = photos.map(photo => {
        const trip = getPhotoTrip(photo);
        const emoji = getCityEmoji(photo.city);
        return `
          <div class="polaroid-card" data-id="${photo.id}">
            <div class="polaroid-tag">
              <i data-lucide="map-pin" style="width: 12px; height: 12px;"></i>
              ${photo.city}
            </div>
            <div class="polaroid-image">
              <div class="polaroid-image-placeholder" style="height: ${photo.height}px;">
                ${emoji}
              </div>
            </div>
            <div class="polaroid-caption">
              <div class="polaroid-city">${photo.city}</div>
              <div class="polaroid-date">${photo.date}</div>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function renderTimeline() {
      const photos = filterPhotos();
      const content = document.getElementById('timelineContent');
      const resultCount = document.getElementById('resultCount');

      resultCount.textContent = photos.length;

      const grouped = {};
      photos.forEach(photo => {
        const year = photo.date.split('.')[0];
        if (!grouped[year]) {
          grouped[year] = [];
        }
        grouped[year].push(photo);
      });

      const years = Object.keys(grouped).sort((a, b) => b - a);

      content.innerHTML = years.map(year => `
        <div class="timeline-group">
          <div class="timeline-group-header">
            <span class="timeline-year">${year}</span>
            <div class="timeline-line"></div>
          </div>
          <div class="timeline-items">
            ${grouped[year].map(photo => {
              const emoji = getCityEmoji(photo.city);
              return `
                <div class="polaroid-card" data-id="${photo.id}">
                  <div class="polaroid-tag">
                    <i data-lucide="map-pin" style="width: 12px; height: 12px;"></i>
                    ${photo.city}
                  </div>
                  <div class="polaroid-image">
                    <div class="polaroid-image-placeholder" style="height: ${Math.min(photo.height, 200)}px;">
                      ${emoji}
                    </div>
                  </div>
                  <div class="polaroid-caption">
                    <div class="polaroid-city">${photo.city}</div>
                    <div class="polaroid-date">${photo.date}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function switchView(view) {
      currentView = view;

      document.querySelectorAll('.view-toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });

      document.getElementById('masonryView').classList.toggle('active', view === 'masonry');
      document.getElementById('timelineView').classList.toggle('active', view === 'timeline');

      if (view === 'masonry') {
        renderMasonry();
      } else {
        renderTimeline();
      }
    }

    function initFilters() {
      const filterGroups = [
        { container: 'yearFilter', key: 'year' },
        { container: 'cityFilter', key: 'city' },
        { container: 'transportFilter', key: 'transport' }
      ];

      filterGroups.forEach(group => {
        const container = document.getElementById(group.container);
        const options = container.querySelectorAll('.filter-option');

        options.forEach(option => {
          option.addEventListener('click', () => {
            options.forEach(o => o.classList.remove('active'));
            option.classList.add('active');
            currentFilters[group.key] = option.dataset.value;

            if (currentView === 'masonry') {
              renderMasonry();
            } else {
              renderTimeline();
            }
          });
        });
      });

      const sortSelect = document.getElementById('sortSelect');
      sortSelect.addEventListener('change', (e) => {
        currentFilters.sort = e.target.value;
        if (currentView === 'masonry') {
          renderMasonry();
        } else {
          renderTimeline();
        }
      });
    }

    function goToPlayback() {
      window.location.href = 'playback.html';
    }

    function init() {
      initPage('nav-album');
      initFilters();
      renderMasonry();

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
