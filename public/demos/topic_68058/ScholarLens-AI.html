<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScholarLens AI - 文献智能分析平台</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    color: #333;
    line-height: 1.6;
  }
  .header {
    background: linear-gradient(135deg, #1890ff 0%, #0052cc 100%);
    color: white;
    padding: 18px 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
  }
  .header .subtitle {
    font-size: 13px;
    opacity: 0.85;
    margin-left: auto;
  }
  .container {
    max-width: 1600px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    height: calc(100vh - 64px - 60px);
    min-height: 600px;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #1a1a1a;
    border-left: 4px solid #1890ff;
    padding-left: 10px;
  }
  /* 上传区 */
  .upload-zone {
    border: 2px dashed #d9d9d9;
    border-radius: 8px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: #fafafa;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: #1890ff;
    background: #e6f7ff;
  }
  .upload-zone .upload-icon {
    font-size: 48px;
    color: #1890ff;
    margin-bottom: 12px;
  }
  .upload-zone .upload-text {
    font-size: 15px;
    color: #333;
    margin-bottom: 6px;
  }
  .upload-zone .upload-hint {
    font-size: 12px;
    color: #999;
  }
  /* 摘要 */
  .summary-text {
    color: #555;
    line-height: 1.8;
    font-size: 14px;
    max-height: calc(100vh - 460px);
    overflow-y: auto;
    padding-right: 8px;
  }
  /* 聊天 */
  .chat-card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;  /* 内容溢出时才显示滚动条 */
    padding-right: 8px;
    margin-bottom: 12px;
    min-height: 400px;
  }
  .msg {
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
  }
  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    flex-shrink: 0;
    font-size: 13px;
  }
  .msg.ai .msg-avatar { background: #1890ff; }
  .msg.user .msg-avatar { background: #52c41a; }
  .msg-content { flex: 1; min-width: 0; }
  .msg-name {
    font-size: 12px;
    color: #999;
    margin-bottom: 4px;
  }
  .msg-bubble {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.ai .msg-bubble {
    background: #f0f5ff;
    color: #1a1a1a;
  }
  .msg.user .msg-bubble {
    background: #f6ffed;
    color: #1a1a1a;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
  }
  .chat-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s;
  }
  .chat-input:focus {
    border-color: #1890ff;
    box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
  }
  .chat-input:disabled {
    background: #f5f5f5;
    cursor: not-allowed;
  }
  .btn {
    padding: 12px 22px;
    background: #1890ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
  }
  .btn:hover:not(:disabled) {
    background: #0052cc;
  }
  .btn:disabled {
    background: #b3d8ff;
    cursor: not-allowed;
  }
  /* Key 配置 */
  .key-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    padding: 10px;
    background: #fffbe6;
    border: 1px solid #ffe58f;
    border-radius: 6px;
    font-size: 12px;
  }
  .key-row input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    font-size: 12px;
    font-family: monospace;
  }
  .key-status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .key-status.ok { background: #f6ffed; color: #52c41a; }
  .key-status.no { background: #fff1f0; color: #f5222d; }
  .loading {
    text-align: center;
    padding: 30px;
    color: #1890ff;
  }
  .spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #1890ff;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .empty {
    text-align: center;
    padding: 50px 20px;
    color: #999;
  }
  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }
  /* 滚动条(对话区单独显眼样式) */
  .chat-messages::-webkit-scrollbar { width: 12px; }
  .chat-messages::-webkit-scrollbar-track {
    background: #f0f0f0;
    border-radius: 6px;
    margin: 4px 0;
    border: 1px solid #e8e8e8;
  }
  .chat-messages::-webkit-scrollbar-thumb {
    background: #1890ff;
    border-radius: 6px;
    border: 2px solid #f0f0f0;
    min-height: 50px;
  }
  .chat-messages::-webkit-scrollbar-thumb:hover {
    background: #0052cc;
  }
  /* 通用滚动条 */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
  .footer {
    text-align: center;
    padding: 20px;
    color: #999;
    font-size: 12px;
    background: white;
    border-top: 1px solid #f0f0f0;
  }
  .status-hint {
    font-size: 11px;
    color: #999;
    margin-top: 8px;
    font-style: italic;
  }
  @media (max-width: 1024px) {
    .container {
      grid-template-columns: 1fr;
      height: auto;
    }
    .chat-messages { min-height: 300px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📚 ScholarLens AI</h1>
  <div class="subtitle">文献智能分析平台</div>
</div>

<div class="container">
  <!-- 左侧:上传 + 分析报告 -->
  <div style="display:flex; flex-direction:column; gap:16px;">
    <!-- Key 配置 -->
    <div class="card">
      <div class="card-title">🔑 AI 对话密钥配置(可选)</div>
      <div class="key-row">
        <input type="password" id="apiKey" placeholder="填入阿里云百炼 DashScope API Key(sk-xxx,可选,不填则仅体验本地分析功能)">
        <span class="key-status no" id="keyStatus">未配置</span>
      </div>
      <div style="font-size:11px;color:#999;">
        申请地址:<a href="https://bailian.console.aliyun.com/?tab=model#/api-key" target="_blank">阿里云百炼平台</a> · 用通义千问 key 即可调用 DeepSeek-V4-Pro · key 仅存浏览器本地,不会上传
      </div>
    </div>

    <!-- 上传 -->
    <div class="card">
      <div class="card-title">📄 论文上传与分析</div>
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击或拖拽 PDF 文件到此区域上传</div>
        <div class="upload-hint">支持 PDF 文档,浏览器端解析,无需后端</div>
        <input type="file" id="fileInput" accept=".pdf" style="display:none;">
      </div>
      <div id="loadingBox" style="display:none;" class="loading">
        <div class="spinner"></div>
        <div id="loadingText">正在解析 PDF 并分析...</div>
      </div>
    </div>

    <!-- 分析报告 -->
    <div class="card" id="reportCard" style="display:none; flex:1; overflow:hidden; display:none; flex-direction:column;">
      <div class="card-title">📊 分析报告</div>
      <div id="summary" class="summary-text"></div>
      <div id="reportHint" class="status-hint"></div>
    </div>

    <div class="card empty" id="emptyBox">
      <div class="empty-icon">📝</div>
      <div>暂无分析数据,请上传论文以查看分析结果</div>
    </div>
  </div>

  <!-- 右侧:AI 对话(放大) -->
  <div class="chat-card">
    <div class="card-title">🤖 AI 研究助手</div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg ai">
        <div class="msg-avatar">AI</div>
        <div class="msg-content">
          <div class="msg-name">ScholarLens AI</div>
          <div class="msg-bubble">你好!我是你的 AI 研究助手。请上传论文并(可选)填入 API Key,即可开始基于论文内容的智能问答。</div>
        </div>
      </div>
    </div>
    <div class="chat-input-row">
      <input type="text" class="chat-input" id="chatInput" placeholder="就论文内容提问..." disabled>
      <button class="btn" id="chatBtn" disabled>发送</button>
    </div>
  </div>
</div>



<!-- 依赖 CDN -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jieba-js@1.0.7/dist/jieba.js"></script>

<script>
// pdf.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

// 全局状态
let currentPaperContent = '';
let currentSummary = '';
let currentKeywords = [];

// LLM 配置
const LLM_BASE_URL = 'https://dashscope.aliyuncs.com/compatible-mode/v1';
const LLM_MODEL = 'deepseek-v4-pro';

// 停用词表
const STOP_WORDS = new Set([
  'the','and','of','to','a','in','is','that','for','it','as','was','with','on','by','at','an','be','this','which','from','or','but','not','are','can','has','have','had','were','their','its','if','will','would','should','could','about','after','before','under','over','into','out','up','down','all','any','no','only','very','so','than','then','now','just','where','when','why','how','what','who','whom','whose','while','do','does','did','done','doing',
  '的','了','和','是','就','都','而','及','与','着','或','一个','没有','我们','你们','他们','它','它们','在','有','为','以','等','对','也','要','会','可','可以','通过','进行','基于','使用','本文','本研究','研究','提出','方法','结果','表明','实验','数据','模型','系统','问题','分析','中','上','下'
]);

function isChineseText(text) {
  if (!text) return false;
  const cnChars = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  return cnChars / Math.max(text.length, 1) > 0.10;
}

// 中文分词
function tokenizeChinese(text) {
  try {
    if (typeof jieba !== 'undefined' && jieba.cut) {
      return jieba.cut(text);
    }
  } catch (e) { console.warn('jieba 不可用,退化为字符切分', e); }
  const tokens = [];
  const regex = /[\u4e00-\u9fff]+|[a-zA-Z]+|[0-9]+/g;
  let match;
  while ((match = regex.exec(text)) !== null) {
    if (/^[\u4e00-\u9fff]+$/.test(match[0])) {
      const s = match[0];
      for (let i = 0; i < s.length - 1; i++) {
        tokens.push(s.substring(i, i + 2));
      }
      if (s.length === 1) tokens.push(s);
    } else {
      tokens.push(match[0]);
    }
  }
  return tokens;
}

// 关键词抽取(用于对话上下文,不显示)
function extractKeywords(text, topK = 50) {
  const cleaned = text.replace(/[^\w\s\u4e00-\u9fff]/g, ' ');
  const tokens = tokenizeChinese(cleaned);
  const counter = {};
  for (let w of tokens) {
    w = w.trim();
    if (!w || w.length < 2) continue;
    if (STOP_WORDS.has(w.toLowerCase())) continue;
    if (/^\d+$/.test(w)) continue;
    const finalW = /^[a-zA-Z]+$/.test(w) ? w.toLowerCase() : w;
    counter[finalW] = (counter[finalW] || 0) + 1;
  }
  return Object.entries(counter)
    .sort((a, b) => b[1] - a[1])
    .slice(0, topK)
    .map(([name, value]) => ({ name, value }));
}

// 摘要提取
function generateSummary(text, length = 800) {
  const textOneline = text.replace(/\s+/g, ' ');
  const textLower = textOneline.toLowerCase();

  // 英文 Abstract
  let m = textLower.match(/abstract[:\s\.]+(.*?)(?:introduction|1\.\s+introduction)/);
  if (m && m[1] && m[1].trim().length > 20) {
    let s = m[1].trim();
    return s.length > length ? s.substring(0, length) + '...' : s;
  }
  // 中文"摘要"
  m = textOneline.match(/摘\s*要[:：\s]*(.*?)(?:关键词|introduction|1\.\s*)/);
  if (m && m[1] && m[1].trim().length > 20) {
    let s = m[1].trim();
    return s.length > length ? s.substring(0, length) + '...' : s;
  }
  // 仅 Abstract
  const idxEn = textLower.indexOf('abstract');
  if (idxEn !== -1) {
    let s = textOneline.substring(idxEn + 8).trim();
    return s.length > length ? s.substring(0, length) + '...' : s;
  }
  // 仅"摘要"
  const idxCn = textOneline.indexOf('摘要');
  if (idxCn !== -1) {
    let s = textOneline.substring(idxCn + 2).trim();
    return s.length > length ? s.substring(0, length) + '...' : s;
  }
  // 兜底:跳过前 200 字符
  if (textOneline.length > 200) {
    let s = textOneline.substring(200).trim();
    return s.length > length ? s.substring(0, length) + '...' : s;
  }
  return textOneline.substring(0, length) + '...';
}

// 翻译摘要成中文(调 LLM)
async function translateSummaryToChinese(summary) {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) return { text: summary, translated: false };
  if (isChineseText(summary)) return { text: summary, translated: true };

  try {
    const resp = await fetch(LLM_BASE_URL + '/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: LLM_MODEL,
        messages: [
          { role: 'system', content: '你是专业的学术论文翻译。把用户提供的英文摘要翻译成流畅的中文,保留学术术语,直接输出译文,不要任何解释。' },
          { role: 'user', content: summary }
        ],
        temperature: 0.3, max_tokens: 1000
      })
    });
    if (resp.ok) {
      const data = await resp.json();
      const t = data.choices[0].message.content.trim();
      if (t) return { text: t, translated: true };
    }
    return { text: summary, translated: false };
  } catch (e) {
    console.warn('摘要翻译失败', e);
    return { text: summary, translated: false };
  }
}

// PDF 解析
async function parsePDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let content = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    const pageText = textContent.items.map(item => item.str).join(' ');
    content += pageText + '\n';
  }
  return content;
}

// 分析 + 渲染
async function analyzeAndRender(file) {
  const loadingBox = document.getElementById('loadingBox');
  const reportCard = document.getElementById('reportCard');
  const emptyBox = document.getElementById('emptyBox');
  const chatInput = document.getElementById('chatInput');
  const chatBtn = document.getElementById('chatBtn');
  const loadingText = document.getElementById('loadingText');

  loadingBox.style.display = 'block';
  reportCard.style.display = 'none';
  emptyBox.style.display = 'none';
  chatInput.disabled = true;
  chatBtn.disabled = true;

  try {
    // 1. 解析 PDF
    loadingText.textContent = '正在解析 PDF...';
    const content = await parsePDF(file);
    currentPaperContent = content.replace(/\s+/g, ' ');

    // 2. 本地分析
    loadingText.textContent = '正在提取摘要...';
    let summary = generateSummary(content);
    currentKeywords = extractKeywords(content);
    currentSummary = summary;

    // 3. 英文论文 → 翻译摘要成中文
    if (!isChineseText(content)) {
      loadingText.textContent = '正在翻译为中文...';
      const result = await translateSummaryToChinese(summary);
      summary = result.text;
      currentSummary = summary;
      const hint = document.getElementById('reportHint');
      if (result.translated) {
        hint.textContent = '✓ 摘要已通过 DeepSeek-V4-Pro 翻译为中文';
      } else {
        hint.textContent = '⚠ 未配置 API Key,显示英文原文摘要';
      }
    } else {
      document.getElementById('reportHint').textContent = '✓ 中文论文摘要';
    }

    // 4. 渲染
    document.getElementById('summary').textContent = summary;

    loadingBox.style.display = 'none';
    reportCard.style.display = 'flex';

    // 启用对话
    chatInput.disabled = false;
    chatBtn.disabled = false;

    addChatMessage('ai', '我已完成对 **' + file.name + '** 的分析。现在你可以就论文的研究方法、实验结果或具体内容进行提问。');
  } catch (e) {
    console.error(e);
    alert('PDF 解析失败:' + e.message);
    loadingBox.style.display = 'none';
    emptyBox.style.display = 'block';
  }
}

// AI 对话
async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  addChatMessage('user', msg);
  input.value = '';
  input.disabled = true;
  document.getElementById('chatBtn').disabled = true;

  const thinkingId = 'thinking-' + Date.now();
  addChatMessage('ai', '思考中...', thinkingId);

  const apiKey = document.getElementById('apiKey').value.trim();
  let reply;

  if (!apiKey) {
    reply = localSearch(msg, currentPaperContent);
  } else {
    try {
      reply = await callLLM(msg, apiKey);
    } catch (e) {
      console.error(e);
      reply = '抱歉,AI 服务暂时不可用(' + e.message + ')。以下是来自论文原文的相关片段:\n\n' + localSearch(msg, currentPaperContent);
    }
  }

  removeChatMessage(thinkingId);
  addChatMessage('ai', reply);

  input.disabled = false;
  document.getElementById('chatBtn').disabled = false;
  input.focus();
}

// 调 LLM
async function callLLM(userMsg, apiKey) {
  const context = currentPaperContent.substring(0, 6000);
  let systemPrompt = '你是 ScholarLens AI,一个专业的文献研究助手。用户会上传一篇论文,你需要基于论文内容回答用户的问题。';
  if (context) {
    systemPrompt += '\n\n以下是用户上传的论文内容(节选):\n\n\'\'\'\n' + context + '\n\'\'\'\n\n请严格基于上述论文内容回答问题。如果问题超出论文范围,请诚实说明并尝试结合论文给出相关见解。回答使用中文,简洁专业。';
  } else {
    systemPrompt += '\n\n用户尚未上传论文,请提示其先上传论文。';
  }

  const resp = await fetch(LLM_BASE_URL + '/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + apiKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: LLM_MODEL,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userMsg }
      ],
      temperature: 0.3,
      max_tokens: 1000
    })
  });

  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error('HTTP ' + resp.status + ': ' + errText.substring(0, 200));
  }

  const data = await resp.json();
  return data.choices[0].message.content.trim();
}

// 本地搜索(fallback)
function localSearch(query, text) {
  if (!text) return '请先上传论文。';
  const queryClean = query.toLowerCase().replace(/[^\w\s\u4e00-\u9fff]/g, '');
  const queryWords = queryClean.split(/\s+/).filter(w => w.length > 1 && !STOP_WORDS.has(w.toLowerCase()));
  if (queryWords.length === 0) return '我在听,请问你想了解论文的什么内容?';

  const sentences = text.split(/(?<=[.!?。])\s+/);
  const windows = [];
  for (let i = 0; i < sentences.length; i++) {
    const chunk = sentences.slice(i, i + 3).join(' ');
    const chunkLower = chunk.toLowerCase();
    let score = 0;
    for (const w of queryWords) {
      if (chunkLower.includes(w.toLowerCase())) score++;
    }
    if (score > 0) windows.push({ score, chunk });
  }
  windows.sort((a, b) => b.score - a.score);
  if (windows.length === 0) return '论文中未找到与问题直接相关的内容。';

  let response = '⚠ 未配置 API Key,以下为论文原文相关片段(填入 Key 可获得 AI 智能回答):\n\n"' + windows[0].chunk.trim() + '"';
  if (windows.length > 1 && windows[1].score >= windows[0].score * 0.5) {
    response += '\n\n另外:\n"' + windows[1].chunk.trim() + '"';
  }
  return response;
}

// 聊天消息
function addChatMessage(role, content, id) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (id) div.id = id;
  div.innerHTML = '<div class="msg-avatar">' + (role === 'ai' ? 'AI' : '我') + '</div>' +
    '<div class="msg-content">' +
    '<div class="msg-name">' + (role === 'ai' ? 'ScholarLens AI' : '我') + '</div>' +
    '<div class="msg-bubble">' + escapeHtml(content) + '</div>' +
    '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeChatMessage(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 事件绑定
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadZone.classList.add('dragover');
});
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) analyzeAndRender(file);
});
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) analyzeAndRender(file);
});

document.getElementById('chatBtn').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});

document.getElementById('apiKey').addEventListener('input', (e) => {
  const v = e.target.value.trim();
  const status = document.getElementById('keyStatus');
  if (v) {
    status.textContent = '已配置';
    status.className = 'key-status ok';
  } else {
    status.textContent = '未配置';
    status.className = 'key-status no';
  }
});
</script>
