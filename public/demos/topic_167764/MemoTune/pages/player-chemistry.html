<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoTune - 播放页 - 化合价口诀歌</title>
    <style id="theme-vars">
:root {
  /* === Color System — Music App High-Fidelity Replication === */
  --color-bg-primary: #FFFFFF;
  --color-bg-secondary: #F5F5F7;
  --color-bg-dark: #1A1A2E;
  --color-bg-dark-secondary: #16213E;

  /* Purple-pink gradient palette (dominant across all screens) */
  --color-purple-deep: #5B2C8E;
  --color-purple-mid: #7B4FBF;
  --color-purple-light: #A78BDB;
  --color-purple-pale: #E8DFF5;
  --color-pink-deep: #D63384;
  --color-pink-mid: #E8668D;
  --color-pink-light: #F9A8C9;
  --color-pink-pale: #FDE8F0;

  /* Accent colors */
  --color-teal: #20C9B0;
  --color-blue: #4A90D9;
  --color-cyan: #38BDF8;
  --color-green: #34D399;
  --color-orange: #F59E0B;
  --color-red: #EF4444;
  --color-liked: #FF6B6B;

  /* Text */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-on-dark: #FFFFFF;
  --color-text-on-dark-secondary: rgba(255, 255, 255, 0.7);
  --color-text-on-dark-tertiary: rgba(255, 255, 255, 0.4);

  /* Border & Divider */
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F2;

  /* Surface */
  --color-surface-card: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-surface-overlay: rgba(0, 0, 0, 0.5);
  --color-surface-glass: rgba(255, 255, 255, 0.15);

  /* Gradient presets */
  --gradient-purple-pink: linear-gradient(135deg, #5B2C8E 0%, #D63384 100%);
  --gradient-purple-pink-soft: linear-gradient(135deg, #A78BDB 0%, #F9A8C9 100%);
  --gradient-purple-dark: linear-gradient(180deg, #2D1B69 0%, #1A1A2E 100%);
  --gradient-pink-teal: linear-gradient(135deg, #D63384 0%, #20C9B0 100%);
  --gradient-light-blue: linear-gradient(180deg, #E0ECFF 0%, #F5F5F7 100%);
  --gradient-warm-pastel: linear-gradient(180deg, #FDE8F0 0%, #E8DFF5 50%, #D0E8FF 100%);
  --gradient-sunset: linear-gradient(135deg, #FC8D6A 0%, #E8668D 50%, #7B4FBF 100%);

  /* === Typography === */
  --font-primary: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  --font-serif: 'Georgia', 'Times New Roman', serif;

  /* Type scale */
  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-4xl: 34px;

  /* Font weights */
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* Line heights */
  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* === Border Radius === */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-glow-purple: 0 8px 32px rgba(91, 44, 142, 0.3);
  --shadow-glow-pink: 0 8px 32px rgba(214, 51, 132, 0.25);
  --shadow-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.1);

  /* === Animation === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease-out;

  /* === Z-Index === */
  --z-base: 0;
  --z-elevated: 10;
  --z-sticky: 20;
  --z-overlay: 100;
  --z-modal: 200;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-bg-primary);
    --color-foreground: var(--color-text-primary);
    --color-card: var(--color-surface-card);
    --color-card-foreground: var(--color-text-primary);
    --color-primary: var(--color-purple-mid);
    --color-primary-foreground: var(--color-text-on-dark);
    --color-secondary: var(--color-purple-pale);
    --color-secondary-foreground: var(--color-text-primary);
    --color-muted: var(--color-bg-secondary);
    --color-muted-foreground: var(--color-text-secondary);
    --color-accent: var(--color-pink-pale);
    --color-accent-foreground: var(--color-text-primary);
    --color-destructive: var(--color-red);
    --color-destructive-foreground: var(--color-text-on-dark);
    --color-border: var(--color-border);
    --color-input: var(--color-border);
    --color-ring: var(--color-purple-mid);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-bg-dark); color: var(--color-text-on-dark); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen antialiased" style="font-family: var(--font-primary); max-width: 430px; margin: 0 auto; background: linear-gradient(180deg, #2D1B69 0%, #1A1A2E 100%);">

    <main class="min-h-screen flex flex-col">

        <!-- 1. Top bar: back arrow, "正在播放", share icon -->
        <header class="flex items-center justify-between px-4 pt-3 pb-2">
            <button data-dom-id="chem-player-back" class="w-9 h-9 flex items-center justify-center" aria-label="返回" style="color: var(--color-text-on-dark);">
                <i data-lucide="chevron-left" class="w-[22px] h-[22px]"></i>
            </button>
            <span class="text-[15px] font-medium" style="color: var(--color-text-on-dark);">正在播放</span>
            <button data-dom-id="chem-player-share" class="w-9 h-9 flex items-center justify-center" aria-label="分享" style="color: var(--color-text-on-dark);">
                <i data-lucide="share-2" class="w-[20px] h-[20px]"></i>
            </button>
        </header>

        <!-- 2. Heart/favorite icon (outline, white) -->
        <div class="flex justify-end px-4 mt-1">
            <button class="w-9 h-9 flex items-center justify-center" aria-label="收藏" style="color: var(--color-text-on-dark);">
                <i data-lucide="heart" class="w-[22px] h-[22px]"></i>
            </button>
        </div>

        <!-- 3. Large circular album art -->
        <div class="flex flex-col items-center" style="margin-top: 28px;">
            <img src="../assets/cover-chemistry.jpg" alt="化合价口诀歌 封面" class="w-[220px] h-[220px] rounded-full object-cover" style="box-shadow: var(--shadow-glow-purple);">
            <!-- Tag row below circle -->
            <div class="flex items-center gap-2 mt-[10px]">
                <span class="text-[10px] font-medium tracking-wider" style="color: rgba(255, 255, 255, 0.5); text-transform: uppercase;">歌曲改编</span>
                <span class="text-[10px]" style="color: rgba(255, 255, 255, 0.5);">&middot;</span>
                <span class="text-[10px] font-medium" style="color: rgba(255, 255, 255, 0.5);">蜜雪冰城主题曲</span>
            </div>
        </div>

        <!-- 4. Song title area -->
        <div class="flex flex-col items-center" style="margin-top: var(--space-2xl);">
            <h1 class="text-[22px] font-bold text-center" style="color: var(--color-text-on-dark); text-wrap: balance;">化合价口诀歌</h1>
            <p class="text-[14px] text-center" style="color: rgba(255, 255, 255, 0.6);">MemoTune &middot; 蜜雪冰城主题曲旋律</p>
        </div>

        <!-- 5. Lyrics display — scrollable card with active line highlighting -->
        <div class="mx-5 mt-4 no-scrollbar" style="max-height: 200px; overflow-y: auto;">
            <!-- Line 1: dimmed -->
            <p class="text-center text-[16px]" style="color: rgba(255, 255, 255, 0.5); line-height: 2.4;">一价氢氯钾钠银，</p>
            <!-- Line 2: dimmed -->
            <p class="text-center text-[16px]" style="color: rgba(255, 255, 255, 0.5); line-height: 2.4;">二价氧钙钡镁锌，</p>
            <!-- Line 3: dimmed -->
            <p class="text-center text-[16px]" style="color: rgba(255, 255, 255, 0.5); line-height: 2.4;">三铝四硅五价磷，</p>
            <!-- Line 4: ACTIVE — currently playing -->
            <p class="text-center text-[16px] font-bold" style="color: #FFFFFF; line-height: 2.4; text-shadow: 0 0 16px rgba(91, 44, 142, 0.6);">二三铁、二四碳，</p>
            <!-- Line 5: dimmed -->
            <p class="text-center text-[16px]" style="color: rgba(255, 255, 255, 0.5); line-height: 2.4;">二四六硫都齐全，</p>
            <!-- Line 6: dimmed -->
            <p class="text-center text-[16px]" style="color: rgba(255, 255, 255, 0.5); line-height: 2.4;">铜汞二价最常见，</p>
            <!-- Line 7: punchline — special purple color -->
            <p class="text-center text-[16px]" style="color: var(--color-pink-deep); line-height: 2.4;">单质零价永不变。</p>
        </div>

        <!-- 6. Progress bar -->
        <div class="mx-6 mt-4">
            <div class="relative w-full" style="height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px;">
                <!-- Gradient track filled ~55% -->
                <div class="absolute left-0 top-0 h-full" style="width: 55%; background: linear-gradient(90deg, var(--color-purple-mid), var(--color-pink-deep)); border-radius: 2px;"></div>
                <!-- Handle at 55% -->
                <div class="absolute top-1/2 -translate-y-1/2" style="left: 55%; width: 10px; height: 10px; background: var(--color-text-on-dark); border-radius: 50%; margin-left: -5px;"></div>
            </div>
            <div class="flex justify-between mt-2">
                <span class="text-[12px]" style="color: rgba(255, 255, 255, 0.5);">0:18</span>
                <span class="text-[12px]" style="color: rgba(255, 255, 255, 0.5);">0:45</span>
            </div>
        </div>

        <!-- 7. Playback controls -->
        <div class="flex items-center justify-center gap-5 mt-4 px-4">
            <button class="w-9 h-9 flex items-center justify-center" aria-label="随机播放" style="color: rgba(255, 255, 255, 0.5);">
                <i data-lucide="shuffle" class="w-[20px] h-[20px]"></i>
            </button>
            <button class="w-10 h-10 flex items-center justify-center" aria-label="上一首" style="color: var(--color-text-on-dark);">
                <i data-lucide="skip-back" class="w-[24px] h-[24px]"></i>
            </button>
            <!-- Play/Pause: large circle, currently playing (showing pause icon) -->
            <button class="w-14 h-14 rounded-full flex items-center justify-center" aria-label="暂停" style="background: var(--color-text-on-dark);">
                <i data-lucide="pause" class="w-[24px] h-[24px]" style="color: var(--color-bg-dark);"></i>
            </button>
            <button class="w-10 h-10 flex items-center justify-center" aria-label="下一首" style="color: var(--color-text-on-dark);">
                <i data-lucide="skip-forward" class="w-[24px] h-[24px]"></i>
            </button>
            <button class="w-9 h-9 flex items-center justify-center" aria-label="循环播放" style="color: rgba(255, 255, 255, 0.5);">
                <i data-lucide="repeat" class="w-[20px] h-[20px]"></i>
            </button>
        </div>

        <!-- 8. Bottom action row -->
        <div class="flex items-center justify-center gap-3 mt-5 px-4 pb-8 flex-wrap">
            <button data-dom-id="chem-set-ringtone" class="whitespace-nowrap text-[13px] font-medium" style="color: var(--color-text-on-dark); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: var(--radius-full); padding: 8px 16px; background: transparent; cursor: pointer;">设为铃声</button>
            <button data-dom-id="chem-set-reminder" class="whitespace-nowrap text-[13px] font-medium" style="color: var(--color-text-on-dark); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: var(--radius-full); padding: 8px 16px; background: transparent; cursor: pointer;">设置提醒</button>
            <button data-dom-id="chem-share-lyrics" class="whitespace-nowrap text-[13px] font-medium" style="color: var(--color-text-on-dark); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: var(--radius-full); padding: 8px 16px; background: transparent; cursor: pointer;">分享歌词</button>
        </div>

    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
