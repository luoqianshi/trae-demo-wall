<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲目库 - MemoTune</title>
    <style id="theme-vars">
:root {
  /* === Color System — Music App High-Fidelity Replication === */
  --color-bg-primary: #FFFFFF;
  --color-bg-secondary: #F5F5F7;
  --color-bg-dark: #1A1A2E;
  --color-bg-dark-secondary: #16213E;

  /* Purple-pink gradient palette (dominant across all screens) */
  --color-purple-deep: #5B2C8E;
  --color-purple-mid: #7B4FBF;
  --color-purple-light: #A78BDB;
  --color-purple-pale: #E8DFF5;
  --color-pink-deep: #D63384;
  --color-pink-mid: #E8668D;
  --color-pink-light: #F9A8C9;
  --color-pink-pale: #FDE8F0;

  /* Accent colors */
  --color-teal: #20C9B0;
  --color-blue: #4A90D9;
  --color-cyan: #38BDF8;
  --color-green: #34D399;
  --color-orange: #F59E0B;
  --color-red: #EF4444;
  --color-liked: #FF6B6B;

  /* Text */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-on-dark: #FFFFFF;
  --color-text-on-dark-secondary: rgba(255, 255, 255, 0.7);
  --color-text-on-dark-tertiary: rgba(255, 255, 255, 0.4);

  /* Border & Divider */
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F2;

  /* Surface */
  --color-surface-card: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-surface-overlay: rgba(0, 0, 0, 0.5);
  --color-surface-glass: rgba(255, 255, 255, 0.15);

  /* Gradient presets */
  --gradient-purple-pink: linear-gradient(135deg, #5B2C8E 0%, #D63384 100%);
  --gradient-purple-pink-soft: linear-gradient(135deg, #A78BDB 0%, #F9A8C9 100%);
  --gradient-purple-dark: linear-gradient(180deg, #2D1B69 0%, #1A1A2E 100%);
  --gradient-pink-teal: linear-gradient(135deg, #D63384 0%, #20C9B0 100%);
  --gradient-light-blue: linear-gradient(180deg, #E0ECFF 0%, #F5F5F7 100%);
  --gradient-warm-pastel: linear-gradient(180deg, #FDE8F0 0%, #E8DFF5 50%, #D0E8FF 100%);
  --gradient-sunset: linear-gradient(135deg, #FC8D6A 0%, #E8668D 50%, #7B4FBF 100%);

  /* === Typography === */
  --font-primary: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  --font-serif: 'Georgia', 'Times New Roman', serif;

  /* Type scale */
  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-4xl: 34px;

  /* Font weights */
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* Line heights */
  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* === Border Radius === */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-glow-purple: 0 8px 32px rgba(91, 44, 142, 0.3);
  --shadow-glow-pink: 0 8px 32px rgba(214, 51, 132, 0.25);
  --shadow-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.1);

  /* === Animation === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease-out;

  /* === Z-Index === */
  --z-base: 0;
  --z-elevated: 10;
  --z-sticky: 20;
  --z-overlay: 100;
  --z-modal: 200;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-primary); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-primary);">
    <main class="pb-24">
      <!-- Header -->
      <header class="flex items-center justify-between px-4 pt-4 pb-2">
        <h1 class="text-[22px] font-bold leading-tight" style="color: var(--color-text-primary);">我的曲目</h1>
        <button class="inline-flex items-center justify-center w-10 h-10 rounded-lg" style="color: var(--color-text-secondary);" aria-label="搜索">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
      </header>

      <!-- Filter Tabs -->
      <nav class="px-4 mt-1">
        <div class="flex gap-4 border-b" style="border-color: var(--color-divider);">
          <button class="pb-2 text-sm font-semibold truncate" style="color: var(--color-purple-mid); border-bottom: 2px solid var(--color-purple-mid);">全部</button>
          <button class="pb-2 text-sm font-medium truncate" style="color: var(--color-text-tertiary); border-bottom: 2px solid transparent;">洗脑模板</button>
          <button class="pb-2 text-sm font-medium truncate" style="color: var(--color-text-tertiary); border-bottom: 2px solid transparent;">歌曲改编</button>
          <button class="pb-2 text-sm font-medium truncate" style="color: var(--color-text-tertiary); border-bottom: 2px solid transparent;">自由生成</button>
        </div>
      </nav>

      <!-- Song List -->
      <section class="px-4 mt-3">
        <!-- Track 1 -->
        <div class="flex items-center gap-3 py-3.5 border-b" style="border-color: var(--color-divider);" data-dom-id="track-key">
          <img src="../assets/cover-template.jpg" alt="出门带钥匙" class="w-12 h-12 rounded-full object-cover shrink-0">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold truncate" style="color: var(--color-text-primary);">出门带钥匙</p>
            <p class="text-xs truncate mt-0.5" style="color: var(--color-text-tertiary);">洗脑模板 · 0:32 · 已复习 3 次</p>
          </div>
          <button class="inline-flex items-center justify-center w-8 h-8 shrink-0" style="color: var(--color-text-tertiary);" aria-label="更多操作">
            <i data-lucide="ellipsis-vertical" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Track 2 -->
        <div class="flex items-center gap-3 py-3.5 border-b" style="border-color: var(--color-divider);" data-dom-id="track-english">
          <img src="../assets/cover-adapt.jpg" alt="英语单词 Unit 5" class="w-12 h-12 rounded-full object-cover shrink-0">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold truncate" style="color: var(--color-text-primary);">英语单词 Unit 5</p>
            <p class="text-xs truncate mt-0.5" style="color: var(--color-text-tertiary);">歌曲改编 · 2:15 · 已复习 1 次</p>
          </div>
          <button class="inline-flex items-center justify-center w-8 h-8 shrink-0" style="color: var(--color-text-tertiary);" aria-label="更多操作">
            <i data-lucide="ellipsis-vertical" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Track 3 -->
        <div class="flex items-center gap-3 py-3.5 border-b" style="border-color: var(--color-divider);">
          <img src="../assets/cover-free.jpg" alt="历史朝代歌" class="w-12 h-12 rounded-full object-cover shrink-0">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold truncate" style="color: var(--color-text-primary);">历史朝代歌</p>
            <p class="text-xs truncate mt-0.5" style="color: var(--color-text-tertiary);">自由生成 · 1:48 · 已复习 5 次</p>
          </div>
          <button class="inline-flex items-center justify-center w-8 h-8 shrink-0" style="color: var(--color-text-tertiary);" aria-label="更多操作">
            <i data-lucide="ellipsis-vertical" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Track 4 -->
        <div class="flex items-center gap-3 py-3.5">
          <img src="../assets/cover-template.jpg" alt="每天晚八点吃药" class="w-12 h-12 rounded-full object-cover shrink-0">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold truncate" style="color: var(--color-text-primary);">每天晚八点吃药</p>
            <p class="text-xs truncate mt-0.5" style="color: var(--color-text-tertiary);">洗脑模板 · 0:28 · 已复习 7 次</p>
          </div>
          <button class="inline-flex items-center justify-center w-8 h-8 shrink-0" style="color: var(--color-text-tertiary);" aria-label="更多操作">
            <i data-lucide="ellipsis-vertical" class="w-4 h-4"></i>
          </button>
        </div>
      </section>

      <!-- Bottom Tab Navigation -->
      <nav class="fixed bottom-0 inset-x-0 z-20 border-t flex items-center justify-around" style="height: 56px; border-color: var(--color-divider); background: var(--color-bg-primary);">
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-tertiary);" data-dom-id="tab-home">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="text-[10px]">首页</span>
        </button>
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-tertiary);" data-dom-id="tab-create">
          <i data-lucide="plus-circle" class="w-5 h-5"></i>
          <span class="text-[10px]">创作</span>
        </button>
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-purple-mid);">
          <i data-lucide="music" class="w-5 h-5"></i>
          <span class="text-[10px] font-semibold">曲目</span>
        </button>
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-tertiary);">
          <i data-lucide="layout-grid" class="w-5 h-5"></i>
          <span class="text-[10px]">场景</span>
        </button>
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-tertiary);">
          <i data-lucide="user" class="w-5 h-5"></i>
          <span class="text-[10px]">我的</span>
        </button>
      </nav>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
