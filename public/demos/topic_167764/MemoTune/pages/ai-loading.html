<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoTune - AI 创作</title>
    <style id="theme-vars">
:root {
  /* === Color System — Music App High-Fidelity Replication === */
  --color-bg-primary: #FFFFFF;
  --color-bg-secondary: #F5F5F7;
  --color-bg-dark: #1A1A2E;
  --color-bg-dark-secondary: #16213E;

  /* Purple-pink gradient palette (dominant across all screens) */
  --color-purple-deep: #5B2C8E;
  --color-purple-mid: #7B4FBF;
  --color-purple-light: #A78BDB;
  --color-purple-pale: #E8DFF5;
  --color-pink-deep: #D63384;
  --color-pink-mid: #E8668D;
  --color-pink-light: #F9A8C9;
  --color-pink-pale: #FDE8F0;

  /* Accent colors */
  --color-teal: #20C9B0;
  --color-blue: #4A90D9;
  --color-cyan: #38BDF8;
  --color-green: #34D399;
  --color-orange: #F59E0B;
  --color-red: #EF4444;
  --color-liked: #FF6B6B;

  /* Text */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-on-dark: #FFFFFF;
  --color-text-on-dark-secondary: rgba(255, 255, 255, 0.7);
  --color-text-on-dark-tertiary: rgba(255, 255, 255, 0.4);

  /* Border & Divider */
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F2;

  /* Surface */
  --color-surface-card: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-surface-overlay: rgba(0, 0, 0, 0.5);
  --color-surface-glass: rgba(255, 255, 255, 0.15);

  /* Gradient presets */
  --gradient-purple-pink: linear-gradient(135deg, #5B2C8E 0%, #D63384 100%);
  --gradient-purple-pink-soft: linear-gradient(135deg, #A78BDB 0%, #F9A8C9 100%);
  --gradient-purple-dark: linear-gradient(180deg, #2D1B69 0%, #1A1A2E 100%);
  --gradient-pink-teal: linear-gradient(135deg, #D63384 0%, #20C9B0 100%);
  --gradient-light-blue: linear-gradient(180deg, #E0ECFF 0%, #F5F5F7 100%);
  --gradient-warm-pastel: linear-gradient(180deg, #FDE8F0 0%, #E8DFF5 50%, #D0E8FF 100%);
  --gradient-sunset: linear-gradient(135deg, #FC8D6A 0%, #E8668D 50%, #7B4FBF 100%);

  /* === Typography === */
  --font-primary: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  --font-serif: 'Georgia', 'Times New Roman', serif;

  /* Type scale */
  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-4xl: 34px;

  /* Font weights */
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* Line heights */
  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* === Border Radius === */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-glow-purple: 0 8px 32px rgba(91, 44, 142, 0.3);
  --shadow-glow-pink: 0 8px 32px rgba(214, 51, 132, 0.25);
  --shadow-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.1);

  /* === Animation === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease-out;

  /* === Z-Index === */
  --z-base: 0;
  --z-elevated: 10;
  --z-sticky: 20;
  --z-overlay: 100;
  --z-modal: 200;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-bg-primary);
    --color-foreground: var(--color-text-primary);
    --color-card: var(--color-surface-card);
    --color-card-foreground: var(--color-text-primary);
    --color-primary: var(--color-purple-mid);
    --color-primary-foreground: var(--color-text-on-dark);
    --color-secondary: var(--color-purple-pale);
    --color-secondary-foreground: var(--color-text-primary);
    --color-muted: var(--color-bg-secondary);
    --color-muted-foreground: var(--color-text-secondary);
    --color-accent: var(--color-pink-pale);
    --color-accent-foreground: var(--color-text-primary);
    --color-destructive: var(--color-red);
    --color-destructive-foreground: var(--color-text-on-dark);
    --color-border: var(--color-border);
    --color-input: var(--color-border);
    --color-ring: var(--color-purple-mid);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-bg-secondary); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen antialiased" style="font-family: var(--font-primary); max-width: 430px; margin: 0 auto; background: var(--gradient-purple-dark);">

    <main class="min-h-screen flex flex-col">

        <!-- 1. Top bar -->
        <header class="flex items-center justify-center px-4 pt-3 pb-2 relative">
            <button data-dom-id="ai-back" class="absolute left-4 w-9 h-9 flex items-center justify-center" aria-label="返回" style="color: var(--color-text-on-dark);">
                <i data-lucide="chevron-left" class="w-[22px] h-[22px]"></i>
            </button>
            <span class="text-[15px] font-medium" style="color: var(--color-text-on-dark);">AI 创作</span>
        </header>

        <!-- 2. Centered loading content -->
        <div class="flex-1 flex flex-col items-center justify-center px-6">

            <!-- Animated pulsing circle with sparkle icon -->
            <div class="ai-pulse-circle" style="width: 120px; height: 120px; border-radius: 50%; background: var(--gradient-purple-pink); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-glow-purple);">
                <svg class="ai-sparkle-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/>
                </svg>
            </div>

            <!-- Main loading text -->
            <p class="mt-6 text-[16px] font-medium text-center" style="color: var(--color-text-on-dark);">AI 正在创作旋律...</p>

            <!-- Subtitle text -->
            <p class="mt-2 text-[13px] text-center" style="color: rgba(255, 255, 255, 0.5);">将「出门带钥匙」转化为洗脑记忆口诀</p>

            <!-- Progress steps -->
            <div class="flex items-center justify-center mt-10 gap-0">
                <!-- Step 1: Complete -->
                <div class="flex flex-col items-center" style="min-width: 64px;">
                    <div class="w-6 h-6 rounded-full flex items-center justify-center" style="background: var(--color-green);">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <span class="mt-2 text-[12px] text-center" style="color: var(--color-text-on-dark);">分析内容</span>
                </div>

                <!-- Connector line -->
                <div class="mx-2" style="width: 32px; height: 1px; background: rgba(255, 255, 255, 0.2);"></div>

                <!-- Step 2: In progress -->
                <div class="flex flex-col items-center" style="min-width: 64px;">
                    <div class="ai-spin-icon w-6 h-6 rounded-full flex items-center justify-center" style="background: var(--color-purple-mid);">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 11-6.22-8.56"/>
                        </svg>
                    </div>
                    <span class="mt-2 text-[12px] text-center" style="color: var(--color-text-on-dark);">生成歌词</span>
                </div>

                <!-- Connector line -->
                <div class="mx-2" style="width: 32px; height: 1px; background: rgba(255, 255, 255, 0.2);"></div>

                <!-- Step 3: Pending -->
                <div class="flex flex-col items-center" style="min-width: 64px;">
                    <div class="w-6 h-6 rounded-full flex items-center justify-center" style="border: 1.5px solid rgba(255, 255, 255, 0.3); background: transparent;"></div>
                    <span class="mt-2 text-[12px] text-center" style="color: rgba(255, 255, 255, 0.4);">谱曲配乐</span>
                </div>
            </div>

        </div>

        <!-- 3. Bottom estimate + tap to complete -->
        <div class="pb-20 flex flex-col items-center gap-3">
            <div data-dom-id="ai-complete" class="cursor-pointer px-6 py-2.5 rounded-full" style="background: linear-gradient(135deg, #5B2C8E 0%, #D63384 100%);">
                <span class="text-[13px] font-semibold" style="color: #FFFFFF;">查看生成结果</span>
            </div>
            <p class="text-[12px]" style="color: rgba(255, 255, 255, 0.3);">预计还需 15 秒</p>
        </div>

    </main>

    <style>
        @keyframes ai-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
        @keyframes ai-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .ai-pulse-circle {
            animation: ai-pulse 2s ease-in-out infinite;
        }
        .ai-sparkle-icon {
            animation: ai-spin 6s linear infinite;
        }
        .ai-spin-icon svg {
            animation: ai-spin 1.2s linear infinite;
            transform-origin: center;
        }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
