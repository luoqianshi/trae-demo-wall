<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - MemoTune</title>
    <style id="theme-vars">
:root {
  /* === Color System — Music App High-Fidelity Replication === */
  --color-bg-primary: #FFFFFF;
  --color-bg-secondary: #F5F5F7;
  --color-bg-dark: #1A1A2E;
  --color-bg-dark-secondary: #16213E;

  /* Purple-pink gradient palette (dominant across all screens) */
  --color-purple-deep: #5B2C8E;
  --color-purple-mid: #7B4FBF;
  --color-purple-light: #A78BDB;
  --color-purple-pale: #E8DFF5;
  --color-pink-deep: #D63384;
  --color-pink-mid: #E8668D;
  --color-pink-light: #F9A8C9;
  --color-pink-pale: #FDE8F0;

  /* Accent colors */
  --color-teal: #20C9B0;
  --color-blue: #4A90D9;
  --color-cyan: #38BDF8;
  --color-green: #34D399;
  --color-orange: #F59E0B;
  --color-red: #EF4444;
  --color-liked: #FF6B6B;

  /* Text */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-on-dark: #FFFFFF;
  --color-text-on-dark-secondary: rgba(255, 255, 255, 0.7);
  --color-text-on-dark-tertiary: rgba(255, 255, 255, 0.4);

  /* Border & Divider */
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F2;

  /* Surface */
  --color-surface-card: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-surface-overlay: rgba(0, 0, 0, 0.5);
  --color-surface-glass: rgba(255, 255, 255, 0.15);

  /* Gradient presets */
  --gradient-purple-pink: linear-gradient(135deg, #5B2C8E 0%, #D63384 100%);
  --gradient-purple-pink-soft: linear-gradient(135deg, #A78BDB 0%, #F9A8C9 100%);
  --gradient-purple-dark: linear-gradient(180deg, #2D1B69 0%, #1A1A2E 100%);
  --gradient-pink-teal: linear-gradient(135deg, #D63384 0%, #20C9B0 100%);
  --gradient-light-blue: linear-gradient(180deg, #E0ECFF 0%, #F5F5F7 100%);
  --gradient-warm-pastel: linear-gradient(180deg, #FDE8F0 0%, #E8DFF5 50%, #D0E8FF 100%);
  --gradient-sunset: linear-gradient(135deg, #FC8D6A 0%, #E8668D 50%, #7B4FBF 100%);

  /* === Typography === */
  --font-primary: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  --font-serif: 'Georgia', 'Times New Roman', serif;

  /* Type scale */
  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-4xl: 34px;

  /* Font weights */
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* Line heights */
  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* === Border Radius === */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-glow-purple: 0 8px 32px rgba(91, 44, 142, 0.3);
  --shadow-glow-pink: 0 8px 32px rgba(214, 51, 132, 0.25);
  --shadow-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.1);

  /* === Animation === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease-out;

  /* === Z-Index === */
  --z-base: 0;
  --z-elevated: 10;
  --z-sticky: 20;
  --z-overlay: 100;
  --z-modal: 200;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-primary); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen pb-20" style="background: var(--color-bg-secondary);">

      <!-- Profile Header Card -->
      <section class="relative" style="background: var(--gradient-purple-pink); padding: 32px 20px 40px; border-radius: 0 0 24px 24px;">
        <!-- Avatar -->
        <div class="flex justify-center">
          <div class="flex items-center justify-center" style="width: 72px; height: 72px; border-radius: var(--radius-full); background: var(--gradient-purple-pink-soft); border: 3px solid rgba(255,255,255,0.3);">
            <i data-lucide="music" style="width: 32px; height: 32px; color: var(--color-text-on-dark);"></i>
          </div>
        </div>
        <!-- Name -->
        <p class="text-center mt-3 truncate" style="font-size: 18px; font-weight: var(--font-bold); color: var(--color-text-on-dark);">音乐记忆达人</p>
        <!-- Subtitle -->
        <p class="text-center mt-1 truncate" style="font-size: 14px; color: var(--color-text-on-dark-secondary);">已创作 12 首记忆旋律</p>
        <!-- Stats Row -->
        <div class="flex justify-between mt-5" style="padding: 0 20px;">
          <div class="text-center flex-1">
            <p class="whitespace-nowrap" style="font-size: 20px; font-weight: var(--font-bold); color: var(--color-text-on-dark);">28 天连续</p>
            <p class="whitespace-nowrap mt-1" style="font-size: 12px; color: var(--color-text-on-dark-tertiary);">连续记忆</p>
          </div>
          <div class="text-center flex-1">
            <p class="whitespace-nowrap" style="font-size: 20px; font-weight: var(--font-bold); color: var(--color-text-on-dark);">86 首</p>
            <p class="whitespace-nowrap mt-1" style="font-size: 12px; color: var(--color-text-on-dark-tertiary);">总复习次数</p>
          </div>
          <div class="text-center flex-1">
            <p class="whitespace-nowrap" style="font-size: 20px; font-weight: var(--font-bold); color: var(--color-text-on-dark);">95%</p>
            <p class="whitespace-nowrap mt-1" style="font-size: 12px; color: var(--color-text-on-dark-tertiary);">记忆留存率</p>
          </div>
        </div>
      </section>

      <!-- Menu Sections -->
      <div class="relative" style="margin-top: -16px; z-index: var(--z-elevated); padding: 0 16px;">

        <!-- Section 1: 记忆管理 -->
        <section style="background: var(--color-surface-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
          <p class="truncate" style="font-size: 12px; color: var(--color-text-tertiary); padding: 14px 16px 0;">记忆管理</p>

          <!-- 复习计划 -->
          <div data-dom-id="menu-review-plan" class="flex items-center" style="padding: 14px 16px; border-bottom: 1px solid var(--color-divider);">
            <div class="flex items-center justify-center shrink-0" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-purple-deep);">
              <i data-lucide="book-open" style="width: 18px; height: 18px; color: var(--color-text-on-dark);"></i>
            </div>
            <span class="flex-1 min-w-0 ml-3 truncate" style="font-size: 14px; color: var(--color-text-primary);">复习计划</span>
            <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-tertiary);"></i>
          </div>

          <!-- 定时提醒 -->
          <div class="flex items-center" style="padding: 14px 16px; border-bottom: 1px solid var(--color-divider);">
            <div class="flex items-center justify-center shrink-0" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-pink-deep);">
              <i data-lucide="clock" style="width: 18px; height: 18px; color: var(--color-text-on-dark);"></i>
            </div>
            <span class="flex-1 min-w-0 ml-3 truncate" style="font-size: 14px; color: var(--color-text-primary);">定时提醒</span>
            <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-tertiary);"></i>
          </div>

          <!-- 学习统计 -->
          <div class="flex items-center" style="padding: 14px 16px;">
            <div class="flex items-center justify-center shrink-0" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-purple-mid);">
              <i data-lucide="bar-chart-3" style="width: 18px; height: 18px; color: var(--color-text-on-dark);"></i>
            </div>
            <span class="flex-1 min-w-0 ml-3 truncate" style="font-size: 14px; color: var(--color-text-primary);">学习统计</span>
            <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-tertiary);"></i>
          </div>
        </section>

        <!-- Section 2: 内容管理 -->
        <section class="mt-3" style="background: var(--color-surface-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
          <p class="truncate" style="font-size: 12px; color: var(--color-text-tertiary); padding: 14px 16px 0;">内容管理</p>

          <!-- 本地歌单 -->
          <div data-dom-id="menu-local-playlist" class="flex items-center" style="padding: 14px 16px; border-bottom: 1px solid var(--color-divider);">
            <div class="flex items-center justify-center shrink-0" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-teal);">
              <i data-lucide="music" style="width: 18px; height: 18px; color: var(--color-text-on-dark);"></i>
            </div>
            <span class="flex-1 min-w-0 ml-3 truncate" style="font-size: 14px; color: var(--color-text-primary);">本地歌单</span>
            <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-tertiary);"></i>
          </div>

          <!-- 导出记录 -->
          <div class="flex items-center" style="padding: 14px 16px; border-bottom: 1px solid var(--color-divider);">
            <div class="flex items-center justify-center shrink-0" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-blue);">
              <i data-lucide="download" style="width: 18px; height: 18px; color: var(--color-text-on-dark);"></i>
            </div>
            <span class="flex-1 min-w-0 ml-3 truncate" style="font-size: 14px; color: var(--color-text-primary);">导出记录</span>
            <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-tertiary);"></i>
          </div>

          <!-- 分享历史 -->
          <div class="flex items-center" style="padding: 14px 16px;">
            <div class="flex items-center justify-center shrink-0" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-pink-mid);">
              <i data-lucide="share-2" style="width: 18px; height: 18px; color: var(--color-text-on-dark);"></i>
            </div>
            <span class="flex-1 min-w-0 ml-3 truncate" style="font-size: 14px; color: var(--color-text-primary);">分享历史</span>
            <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-tertiary);"></i>
          </div>
        </section>

        <!-- Section 3: 系统 -->
        <section class="mt-3" style="background: var(--color-surface-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
          <p class="truncate" style="font-size: 12px; color: var(--color-text-tertiary); padding: 14px 16px 0;">系统</p>

          <!-- 设置 -->
          <div class="flex items-center" style="padding: 14px 16px; border-bottom: 1px solid var(--color-divider);">
            <div class="flex items-center justify-center shrink-0" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-text-tertiary);">
              <i data-lucide="settings" style="width: 18px; height: 18px; color: var(--color-text-on-dark);"></i>
            </div>
            <span class="flex-1 min-w-0 ml-3 truncate" style="font-size: 14px; color: var(--color-text-primary);">设置</span>
            <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-tertiary);"></i>
          </div>

          <!-- 升级 Pro -->
          <div class="flex items-center" style="padding: 14px 16px; border-bottom: 1px solid var(--color-divider);">
            <div class="flex items-center justify-center shrink-0" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--gradient-purple-pink);">
              <i data-lucide="crown" style="width: 18px; height: 18px; color: var(--color-text-on-dark);"></i>
            </div>
            <span class="flex-1 min-w-0 ml-3 truncate" style="font-size: 14px; color: var(--color-text-primary);">升级 Pro</span>
            <span class="shrink-0 whitespace-nowrap" style="font-size: 11px; font-weight: var(--font-semibold); color: var(--color-text-on-dark); background: var(--gradient-purple-pink); padding: 2px 10px; border-radius: var(--radius-full);">Pro</span>
          </div>

          <!-- 帮助与反馈 -->
          <div class="flex items-center" style="padding: 14px 16px;">
            <div class="flex items-center justify-center shrink-0" style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-orange);">
              <i data-lucide="help-circle" style="width: 18px; height: 18px; color: var(--color-text-on-dark);"></i>
            </div>
            <span class="flex-1 min-w-0 ml-3 truncate" style="font-size: 14px; color: var(--color-text-primary);">帮助与反馈</span>
            <i data-lucide="chevron-right" class="shrink-0" style="width: 18px; height: 18px; color: var(--color-text-tertiary);"></i>
          </div>
        </section>

      </div>

      <!-- Bottom Tab Navigation -->
      <nav class="fixed bottom-0 left-0 right-0 flex items-center justify-around" style="height: 56px; background: var(--color-surface-card); border-top: 1px solid var(--color-border-light); z-index: var(--z-sticky);">
        <!-- 首页 -->
        <a data-dom-id="tab-home" class="flex flex-col items-center justify-center flex-1" href="home.html" style="color: var(--color-text-tertiary);">
          <i data-lucide="home" style="width: 22px; height: 22px;"></i>
          <span class="mt-1" style="font-size: 10px;">首页</span>
        </a>
        <!-- 创作 -->
        <a class="flex flex-col items-center justify-center flex-1" href="create.html" style="color: var(--color-text-tertiary);">
          <i data-lucide="plus-circle" style="width: 22px; height: 22px;"></i>
          <span class="mt-1" style="font-size: 10px;">创作</span>
        </a>
        <!-- 曲目 -->
        <a class="flex flex-col items-center justify-center flex-1" href="library.html" style="color: var(--color-text-tertiary);">
          <i data-lucide="list-music" style="width: 22px; height: 22px;"></i>
          <span class="mt-1" style="font-size: 10px;">曲目</span>
        </a>
        <!-- 场景 -->
        <a class="flex flex-col items-center justify-center flex-1" href="#" style="color: var(--color-text-tertiary);">
          <i data-lucide="layout-grid" style="width: 22px; height: 22px;"></i>
          <span class="mt-1" style="font-size: 10px;">场景</span>
        </a>
        <!-- 我的 (ACTIVE) -->
        <a class="flex flex-col items-center justify-center flex-1" href="profile.html" style="color: var(--color-purple-deep);">
          <i data-lucide="user" style="width: 22px; height: 22px;"></i>
          <span class="mt-1" style="font-size: 10px; font-weight: var(--font-semibold);">我的</span>
        </a>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
