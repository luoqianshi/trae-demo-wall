<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoTune - 首页</title>
    <style id="theme-vars">
:root {
  /* === Color System — Music App High-Fidelity Replication === */
  --color-bg-primary: #FFFFFF;
  --color-bg-secondary: #F5F5F7;
  --color-bg-dark: #1A1A2E;
  --color-bg-dark-secondary: #16213E;

  /* Purple-pink gradient palette (dominant across all screens) */
  --color-purple-deep: #5B2C8E;
  --color-purple-mid: #7B4FBF;
  --color-purple-light: #A78BDB;
  --color-purple-pale: #E8DFF5;
  --color-pink-deep: #D63384;
  --color-pink-mid: #E8668D;
  --color-pink-light: #F9A8C9;
  --color-pink-pale: #FDE8F0;

  /* Accent colors */
  --color-teal: #20C9B0;
  --color-blue: #4A90D9;
  --color-cyan: #38BDF8;
  --color-green: #34D399;
  --color-orange: #F59E0B;
  --color-red: #EF4444;
  --color-liked: #FF6B6B;

  /* Text */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-on-dark: #FFFFFF;
  --color-text-on-dark-secondary: rgba(255, 255, 255, 0.7);
  --color-text-on-dark-tertiary: rgba(255, 255, 255, 0.4);

  /* Border & Divider */
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F2;

  /* Surface */
  --color-surface-card: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-surface-overlay: rgba(0, 0, 0, 0.5);
  --color-surface-glass: rgba(255, 255, 255, 0.15);

  /* Gradient presets */
  --gradient-purple-pink: linear-gradient(135deg, #5B2C8E 0%, #D63384 100%);
  --gradient-purple-pink-soft: linear-gradient(135deg, #A78BDB 0%, #F9A8C9 100%);
  --gradient-purple-dark: linear-gradient(180deg, #2D1B69 0%, #1A1A2E 100%);
  --gradient-pink-teal: linear-gradient(135deg, #D63384 0%, #20C9B0 100%);
  --gradient-light-blue: linear-gradient(180deg, #E0ECFF 0%, #F5F5F7 100%);
  --gradient-warm-pastel: linear-gradient(180deg, #FDE8F0 0%, #E8DFF5 50%, #D0E8FF 100%);
  --gradient-sunset: linear-gradient(135deg, #FC8D6A 0%, #E8668D 50%, #7B4FBF 100%);

  /* === Typography === */
  --font-primary: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  --font-serif: 'Georgia', 'Times New Roman', serif;

  /* Type scale */
  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-4xl: 34px;

  /* Font weights */
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* Line heights */
  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* === Border Radius === */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-glow-purple: 0 8px 32px rgba(91, 44, 142, 0.3);
  --shadow-glow-pink: 0 8px 32px rgba(214, 51, 132, 0.25);
  --shadow-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.1);

  /* === Animation === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease-out;

  /* === Z-Index === */
  --z-base: 0;
  --z-elevated: 10;
  --z-sticky: 20;
  --z-overlay: 100;
  --z-modal: 200;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-bg-primary);
    --color-foreground: var(--color-text-primary);
    --color-card: var(--color-surface-card);
    --color-card-foreground: var(--color-text-primary);
    --color-primary: var(--color-purple-mid);
    --color-primary-foreground: var(--color-text-on-dark);
    --color-secondary: var(--color-purple-pale);
    --color-secondary-foreground: var(--color-text-primary);
    --color-muted: var(--color-bg-secondary);
    --color-muted-foreground: var(--color-text-secondary);
    --color-accent: var(--color-pink-pale);
    --color-accent-foreground: var(--color-text-primary);
    --color-destructive: var(--color-red);
    --color-destructive-foreground: var(--color-text-on-dark);
    --color-border: var(--color-border);
    --color-input: var(--color-border);
    --color-ring: var(--color-purple-mid);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-bg-secondary); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen antialiased" style="font-family: var(--font-primary); max-width: 430px; margin: 0 auto; background: var(--color-bg-secondary);">

    <main class="pb-[132px]">

        <!-- 1. Status bar spacer -->
        <div style="height: 20px;"></div>

        <!-- 2. Header row -->
        <header class="flex items-center justify-between px-4 pt-1 pb-2">
            <h1 class="text-[22px] font-bold" style="color: var(--color-text-primary);">MemoTune</h1>
            <div data-dom-id="header-avatar" class="w-8 h-8 rounded-full flex-shrink-0" style="background: var(--gradient-purple-pink);"></div>
        </header>

        <!-- 3. Hero illustration card -->
        <section class="mx-4 rounded-[20px] overflow-hidden" style="height: 180px; background: linear-gradient(135deg, #F3E8FF 0%, #FDE8F0 100%);">
            <div class="flex flex-col items-center justify-center h-full pt-2">
                <img src="../assets/hero-illustration.jpg" alt="Hero Illustration" class="w-[120px] h-auto object-contain" loading="eager">
                <p class="text-[18px] font-bold mt-2 text-center px-4 truncate" style="color: var(--color-text-primary); text-wrap: balance;">旋律记忆，过耳不忘</p>
                <p class="text-[13px] mt-1 text-center px-6 truncate" style="color: var(--color-text-secondary);">用音乐的力量，让知识主动找到你</p>
            </div>
        </section>

        <!-- 4. Quick action buttons -->
        <section class="flex gap-3 px-4 mt-5">
            <button data-dom-id="quick-create" class="flex-1 flex items-center justify-center gap-2 text-white font-semibold text-[15px]" style="background: var(--gradient-purple-pink); border-radius: var(--radius-full); padding: 14px 0; border: none; cursor: pointer;">
                <i data-lucide="music" class="w-[18px] h-[18px]"></i>
                <span>快速创作</span>
            </button>
            <button data-dom-id="import-playlist" class="flex-1 flex items-center justify-center gap-2 font-semibold text-[15px]" style="background: transparent; border: 1.5px solid var(--color-border); border-radius: var(--radius-full); padding: 14px 0; color: var(--color-text-primary); cursor: pointer;">
                <i data-lucide="import" class="w-[18px] h-[18px]"></i>
                <span>导入歌单</span>
            </button>
        </section>

        <!-- 5. 今日复习 section -->
        <section class="mt-6 px-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-[16px] font-semibold" style="color: var(--color-text-primary);">今日复习</h2>
                <a href="#" data-dom-id="review-all" class="text-[13px]" style="color: var(--color-purple-mid);">查看全部 &gt;</a>
            </div>
            <div class="flex flex-col gap-3">
                <!-- Review card 1 -->
                <div data-dom-id="review-key" class="flex items-center gap-3 p-[14px] rounded-[16px]" style="background: var(--color-surface-card); box-shadow: var(--shadow-card);">
                    <img src="../assets/cover-template.jpg" alt="Cover" class="w-[44px] h-[44px] rounded-full flex-shrink-0 object-cover">
                    <div class="flex-1 min-w-0">
                        <p class="text-[14px] font-semibold truncate" style="color: var(--color-text-primary);">出门带钥匙</p>
                        <p class="text-[12px] truncate" style="color: var(--color-text-secondary);">洗脑模板 · 已复习 3 次</p>
                    </div>
                    <button class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background: var(--gradient-purple-pink);" aria-label="播放">
                        <i data-lucide="play" class="w-[16px] h-[16px] text-white ml-0.5"></i>
                    </button>
                </div>
                <!-- Review card 2 -->
                <div data-dom-id="review-english" class="flex items-center gap-3 p-[14px] rounded-[16px]" style="background: var(--color-surface-card); box-shadow: var(--shadow-card);">
                    <img src="../assets/cover-adapt.jpg" alt="Cover" class="w-[44px] h-[44px] rounded-full flex-shrink-0 object-cover">
                    <div class="flex-1 min-w-0">
                        <p class="text-[14px] font-semibold truncate" style="color: var(--color-text-primary);">英语单词 Unit 5</p>
                        <p class="text-[12px] truncate" style="color: var(--color-text-secondary);">歌曲改编 · 已复习 1 次</p>
                    </div>
                    <button class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background: var(--gradient-purple-pink);" aria-label="播放">
                        <i data-lucide="play" class="w-[16px] h-[16px] text-white ml-0.5"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 6. 场景提醒 section -->
        <section class="mt-6 px-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-[16px] font-semibold" style="color: var(--color-text-primary);">场景提醒</h2>
                <a href="#" data-dom-id="scene-manage" class="text-[13px]" style="color: var(--color-purple-mid);">管理 &gt;</a>
            </div>
            <div class="flex flex-col gap-3">
                <!-- Scene item 1 -->
                <div class="flex items-center gap-3 p-[14px] rounded-[16px]" style="background: var(--color-surface-card); box-shadow: var(--shadow-card);">
                    <div class="w-12 h-12 rounded-[12px] overflow-hidden flex-shrink-0">
                        <img src="../assets/scene-doorway.jpg" alt="玄关" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[14px] font-semibold truncate" style="color: var(--color-text-primary);">玄关 · 出门提醒</p>
                        <p class="text-[12px] truncate" style="color: var(--color-text-secondary);">绑定 1 首旋律</p>
                    </div>
                    <i data-lucide="map-pin" class="w-[18px] h-[18px] flex-shrink-0" style="color: var(--color-purple-mid);"></i>
                </div>
                <!-- Scene item 2 -->
                <div class="flex items-center gap-3 p-[14px] rounded-[16px]" style="background: var(--color-surface-card); box-shadow: var(--shadow-card);">
                    <div class="w-12 h-12 rounded-[12px] overflow-hidden flex-shrink-0">
                        <img src="../assets/scene-desk.jpg" alt="书桌" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[14px] font-semibold truncate" style="color: var(--color-text-primary);">书桌 · 学习提醒</p>
                        <p class="text-[12px] truncate" style="color: var(--color-text-secondary);">绑定 2 首旋律</p>
                    </div>
                    <i data-lucide="map-pin" class="w-[18px] h-[18px] flex-shrink-0" style="color: var(--color-purple-mid);"></i>
                </div>
            </div>
        </section>

    </main>

    <!-- 7. Floating now-playing mini bar -->
    <div class="fixed left-1/2 -translate-x-1/2 w-full max-w-[430px] z-[var(--z-sticky)]" style="bottom: 56px;">
        <div class="flex items-center gap-3 px-4" style="background: var(--color-surface-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-elevated); height: 64px;">
            <img src="../assets/cover-template.jpg" alt="Now playing" class="w-10 h-10 rounded-full flex-shrink-0 object-cover">
            <div class="flex-1 min-w-0">
                <p class="text-[13px] font-semibold truncate" style="color: var(--color-text-primary);">出门带钥匙</p>
                <p class="text-[11px] truncate" style="color: var(--color-text-tertiary);">洗脑模板</p>
            </div>
            <div class="flex items-center gap-3 flex-shrink-0">
                <button aria-label="喜欢" class="w-8 h-8 flex items-center justify-center">
                    <i data-lucide="heart" class="w-[18px] h-[18px]" style="color: var(--color-liked);"></i>
                </button>
                <button aria-label="播放/暂停" class="w-8 h-8 flex items-center justify-center">
                    <i data-lucide="play" class="w-[20px] h-[20px]" style="color: var(--color-text-primary);"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 8. Bottom tab navigation -->
    <nav class="fixed left-1/2 -translate-x-1/2 w-full max-w-[430px] z-[var(--z-sticky)]" style="bottom: 0;">
        <div class="flex items-center justify-around px-2" style="height: 56px; background: var(--color-surface-card); border-top: 1px solid var(--color-border-light);">
            <!-- Tab: 首页 (active) -->
            <button class="flex flex-col items-center justify-center gap-0.5 py-1 px-3" style="color: var(--color-purple-mid);" aria-label="首页" aria-current="page">
                <i data-lucide="home" class="w-[20px] h-[20px]"></i>
                <span class="text-[10px] font-medium">首页</span>
            </button>
            <!-- Tab: 创作 -->
            <button data-dom-id="tab-create" class="flex flex-col items-center justify-center gap-0.5 py-1 px-3" style="color: var(--color-text-tertiary);" aria-label="创作">
                <i data-lucide="plus-circle" class="w-[20px] h-[20px]"></i>
                <span class="text-[10px] font-medium">创作</span>
            </button>
            <!-- Tab: 曲目 -->
            <button data-dom-id="tab-library" class="flex flex-col items-center justify-center gap-0.5 py-1 px-3" style="color: var(--color-text-tertiary);" aria-label="曲目">
                <i data-lucide="library" class="w-[20px] h-[20px]"></i>
                <span class="text-[10px] font-medium">曲目</span>
            </button>
            <!-- Tab: 场景 -->
            <button data-dom-id="tab-scene" class="flex flex-col items-center justify-center gap-0.5 py-1 px-3" style="color: var(--color-text-tertiary);" aria-label="场景">
                <i data-lucide="map-pin" class="w-[20px] h-[20px]"></i>
                <span class="text-[10px] font-medium">场景</span>
            </button>
            <!-- Tab: 我的 -->
            <button data-dom-id="tab-profile" class="flex flex-col items-center justify-center gap-0.5 py-1 px-3" style="color: var(--color-text-tertiary);" aria-label="我的">
                <i data-lucide="user" class="w-[20px] h-[20px]"></i>
                <span class="text-[10px] font-medium">我的</span>
            </button>
        </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
