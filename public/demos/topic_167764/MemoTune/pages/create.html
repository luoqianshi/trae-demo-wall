<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创作页 - MemoTune</title>
    <style id="theme-vars">
:root {
  /* === Color System — Music App High-Fidelity Replication === */
  --color-bg-primary: #FFFFFF;
  --color-bg-secondary: #F5F5F7;
  --color-bg-dark: #1A1A2E;
  --color-bg-dark-secondary: #16213E;

  /* Purple-pink gradient palette (dominant across all screens) */
  --color-purple-deep: #5B2C8E;
  --color-purple-mid: #7B4FBF;
  --color-purple-light: #A78BDB;
  --color-purple-pale: #E8DFF5;
  --color-pink-deep: #D63384;
  --color-pink-mid: #E8668D;
  --color-pink-light: #F9A8C9;
  --color-pink-pale: #FDE8F0;

  /* Accent colors */
  --color-teal: #20C9B0;
  --color-blue: #4A90D9;
  --color-cyan: #38BDF8;
  --color-green: #34D399;
  --color-orange: #F59E0B;
  --color-red: #EF4444;
  --color-liked: #FF6B6B;

  /* Text */
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-on-dark: #FFFFFF;
  --color-text-on-dark-secondary: rgba(255, 255, 255, 0.7);
  --color-text-on-dark-tertiary: rgba(255, 255, 255, 0.4);

  /* Border & Divider */
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F2;

  /* Surface */
  --color-surface-card: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-surface-overlay: rgba(0, 0, 0, 0.5);
  --color-surface-glass: rgba(255, 255, 255, 0.15);

  /* Gradient presets */
  --gradient-purple-pink: linear-gradient(135deg, #5B2C8E 0%, #D63384 100%);
  --gradient-purple-pink-soft: linear-gradient(135deg, #A78BDB 0%, #F9A8C9 100%);
  --gradient-purple-dark: linear-gradient(180deg, #2D1B69 0%, #1A1A2E 100%);
  --gradient-pink-teal: linear-gradient(135deg, #D63384 0%, #20C9B0 100%);
  --gradient-light-blue: linear-gradient(180deg, #E0ECFF 0%, #F5F5F7 100%);
  --gradient-warm-pastel: linear-gradient(180deg, #FDE8F0 0%, #E8DFF5 50%, #D0E8FF 100%);
  --gradient-sunset: linear-gradient(135deg, #FC8D6A 0%, #E8668D 50%, #7B4FBF 100%);

  /* === Typography === */
  --font-primary: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  --font-serif: 'Georgia', 'Times New Roman', serif;

  /* Type scale */
  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-4xl: 34px;

  /* Font weights */
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* Line heights */
  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* === Border Radius === */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-glow-purple: 0 8px 32px rgba(91, 44, 142, 0.3);
  --shadow-glow-pink: 0 8px 32px rgba(214, 51, 132, 0.25);
  --shadow-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.1);

  /* === Animation === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease-out;

  /* === Z-Index === */
  --z-base: 0;
  --z-elevated: 10;
  --z-sticky: 20;
  --z-overlay: 100;
  --z-modal: 200;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-primary); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen" style="background-color: var(--color-bg-secondary); font-family: var(--font-primary); color: var(--color-text-primary);">

  <main class="pb-24">

    <!-- 1. Header -->
    <header class="sticky top-0 z-20 flex items-center justify-between px-4 h-12" style="background-color: var(--color-bg-secondary);">
      <button data-dom-id="create-back" class="inline-flex items-center justify-center w-8 h-8 rounded-lg" style="color: var(--color-text-primary);" aria-label="返回">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <h1 class="text-[17px] font-bold" style="color: var(--color-text-primary);">创建记忆旋律</h1>
      <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg" style="color: var(--color-text-secondary);" aria-label="分享">
        <i data-lucide="share-2" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- 2. Three creation mode tabs -->
    <div class="flex justify-center mt-4">
      <div class="inline-flex">
        <button class="px-4 py-2 text-[14px] font-medium" style="color: var(--color-purple-mid); border-bottom: 2px solid var(--color-purple-mid);">
          洗脑模板
        </button>
        <button class="px-4 py-2 text-[14px] font-medium" style="color: var(--color-text-tertiary); border-bottom: 2px solid transparent;">
          歌曲改编
        </button>
        <button class="px-4 py-2 text-[14px] font-medium" style="color: var(--color-text-tertiary); border-bottom: 2px solid transparent;">
          自由生成
        </button>
      </div>
    </div>

    <!-- 3. Mode description card -->
    <div class="mx-4 mt-4 p-4" style="background-color: var(--color-surface-card); border-radius: var(--radius-lg);">
      <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">洗脑模板</h2>
      <p class="mt-1 text-[13px]" style="color: var(--color-text-secondary); line-height: var(--leading-relaxed);">输入你要记住的内容，AI 自动生成押韵歌词和洗脑旋律</p>
    </div>

    <!-- 4. Input area -->
    <div class="mx-4 mt-3 relative">
      <div class="w-full p-4" style="background-color: var(--color-surface-card); border-radius: var(--radius-lg); border: 1.5px solid var(--color-border); min-height: 120px;">
        <p class="text-[14px]" style="color: var(--color-text-tertiary);">输入你要记忆的内容...</p>
      </div>
      <span class="absolute bottom-3 right-5 text-[12px]" style="color: var(--color-text-tertiary);">0/500</span>
    </div>

    <!-- 5. Multi-input toolbar -->
    <div class="flex gap-3 mx-4 mt-3">
      <div class="flex flex-col items-center">
        <div class="flex items-center justify-center w-12 h-12" style="background-color: var(--color-surface-card); border-radius: var(--radius-md); box-shadow: var(--shadow-card);">
          <i data-lucide="camera" class="w-5 h-5" style="color: var(--color-text-secondary);"></i>
        </div>
        <span class="mt-1 text-[11px]" style="color: var(--color-text-secondary);">拍照</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="flex items-center justify-center w-12 h-12" style="background-color: var(--color-surface-card); border-radius: var(--radius-md); box-shadow: var(--shadow-card);">
          <i data-lucide="mic" class="w-5 h-5" style="color: var(--color-text-secondary);"></i>
        </div>
        <span class="mt-1 text-[11px]" style="color: var(--color-text-secondary);">语音</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="flex items-center justify-center w-12 h-12" style="background-color: var(--color-surface-card); border-radius: var(--radius-md); box-shadow: var(--shadow-card);">
          <i data-lucide="image" class="w-5 h-5" style="color: var(--color-text-secondary);"></i>
        </div>
        <span class="mt-1 text-[11px]" style="color: var(--color-text-secondary);">图片</span>
      </div>
    </div>

    <!-- 6. AI generate CTA button -->
    <div class="mx-4 mt-6">
      <button data-dom-id="ai-generate" class="w-full h-[52px] flex items-center justify-center gap-2 text-[16px] font-bold" style="background: var(--gradient-purple-pink); color: var(--color-text-on-dark); border-radius: var(--radius-full); border: none;">
        <i data-lucide="sparkles" class="w-5 h-5"></i>
        <span>AI 生成旋律</span>
      </button>
    </div>

    <!-- 7. Recent creations section -->
    <div class="mt-2 px-4">
      <h3 class="text-[14px]" style="color: var(--color-text-secondary);">最近创作</h3>
      <div class="flex gap-2.5 mt-3">
        <!-- Item a -->
        <div class="flex items-center gap-2.5">
          <img src="../assets/cover-template.jpg" alt="带伞出门" class="w-10 h-10 rounded-full object-cover" loading="lazy">
          <div class="flex flex-col">
            <span class="text-[12px] font-medium" style="color: var(--color-text-primary);">带伞出门</span>
            <span class="text-[11px]" style="color: var(--color-text-tertiary);">洗脑模板</span>
          </div>
        </div>
        <!-- Item b -->
        <div class="flex items-center gap-2.5">
          <img src="../assets/cover-free.jpg" alt="历史朝代" class="w-10 h-10 rounded-full object-cover" loading="lazy">
          <div class="flex flex-col">
            <span class="text-[12px] font-medium" style="color: var(--color-text-primary);">历史朝代</span>
            <span class="text-[11px]" style="color: var(--color-text-tertiary);">自由生成</span>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- 8. Bottom tab navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-20 border-t" style="background-color: var(--color-surface-card); border-color: var(--color-border);">
    <div class="flex items-center justify-around h-[52px]">
      <!-- 首页 -->
      <button data-dom-id="tab-home" class="flex flex-col items-center gap-0.5" style="color: var(--color-text-tertiary);">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px]">首页</span>
      </button>
      <!-- 创作 (ACTIVE) -->
      <button class="flex flex-col items-center gap-0.5" style="color: var(--color-purple-mid);">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">创作</span>
      </button>
      <!-- 曲目 -->
      <button data-dom-id="tab-library" class="flex flex-col items-center gap-0.5" style="color: var(--color-text-tertiary);">
        <i data-lucide="music" class="w-5 h-5"></i>
        <span class="text-[10px]">曲目</span>
      </button>
      <!-- 场景 -->
      <button class="flex flex-col items-center gap-0.5" style="color: var(--color-text-tertiary);">
        <i data-lucide="map-pin" class="w-5 h-5"></i>
        <span class="text-[10px]">场景</span>
      </button>
      <!-- 我的 -->
      <button class="flex flex-col items-center gap-0.5" style="color: var(--color-text-tertiary);">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px]">我的</span>
      </button>
    </div>
    <!-- Safe area bottom for iOS -->
    <div class="h-[env(safe-area-inset-bottom,0px)]" style="background-color: var(--color-surface-card);"></div>
  </nav>

  <script>lucide.createIcons();</script>
</body>
</html>
