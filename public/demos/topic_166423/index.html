<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>维他命日记</title>
  <style>
    /* ===== 重置与基础 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5;
      color: #333;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fafafa;
      position: relative;
      padding-bottom: 64px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    /* ===== 底部Tab导航 ===== */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 0;
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.2s;
    }
    .tab-item .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }
    .tab-item .tab-label {
      font-size: 11px;
      color: #999;
      font-weight: 500;
    }
    .tab-item.active .tab-icon,
    .tab-item.active .tab-label {
      color: #10b981;
    }
    .tab-item:active { transform: scale(0.95); }

    /* ===== 页面通用 ===== */
    .page { display: none; padding: 20px; animation: fadeIn 0.2s ease-out; }
    .page.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 卡片 ===== */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
    }

    /* ===== 首页：日期选择 ===== */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .date-bar .date-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #666;
      transition: all 0.2s;
    }
    .date-bar .date-btn:active { transform: scale(0.9); }
    .date-bar .date-text {
      font-size: 17px;
      font-weight: 600;
      color: #333;
    }
    .today-btn {
      font-size: 12px;
      color: #10b981;
      background: #ecfdf5;
      border: none;
      padding: 4px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
    }

    /* ===== 营养评分卡片 ===== */
    .score-card {
      background: linear-gradient(135deg, #10b981, #14b8a6);
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(16,185,129,0.2);
    }
    .score-card .score-label { font-size: 13px; opacity: 0.9; margin-bottom: 8px; }
    .score-card .score-value { font-size: 48px; font-weight: 700; line-height: 1; }
    .score-card .score-unit { font-size: 13px; opacity: 0.9; margin-top: 4px; }
    .score-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
      margin-top: 16px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      background: #fff;
      border-radius: 3px;
      transition: width 0.5s ease-out;
    }

    /* ===== 维生素进度条 ===== */
    .vitamin-list { display: flex; flex-direction: column; gap: 16px; }
    .vitamin-item { }
    .vitamin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .vitamin-name { font-size: 14px; font-weight: 500; color: #555; }
    .vitamin-percent { font-size: 13px; font-weight: 600; }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #f0f0f0;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.5s ease-out;
    }
    .status-sufficient .progress-fill { background: linear-gradient(90deg, #34d399, #10b981); }
    .status-sufficient .vitamin-percent { color: #10b981; }
    .status-normal .progress-fill { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
    .status-normal .vitamin-percent { color: #3b82f6; }
    .status-mild .progress-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
    .status-mild .vitamin-percent { color: #f59e0b; }
    .status-severe .progress-fill { background: linear-gradient(90deg, #f87171, #ef4444); }
    .status-severe .vitamin-percent { color: #ef4444; }

    /* ===== 快速记录按钮 ===== */
    .quick-record-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #10b981, #14b8a6);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(16,185,129,0.25);
    }
    .quick-record-btn:active { transform: scale(0.98); }

    /* ===== 餐次概览 ===== */
    .meal-overview { display: flex; gap: 12px; }
    .meal-dot {
      flex: 1;
      text-align: center;
      padding: 12px 4px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .meal-dot .meal-emoji { font-size: 20px; }
    .meal-dot .meal-name { font-size: 11px; color: #999; margin-top: 4px; }
    .meal-dot .meal-count { font-size: 12px; font-weight: 600; color: #ccc; }
    .meal-dot.has-records .meal-count { color: #10b981; }

    /* ===== 记录页：餐次区域 ===== */
    .meal-section {
      background: #fff;
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .meal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }
    .meal-header-left { display: flex; align-items: center; gap: 8px; }
    .meal-header-left .meal-emoji { font-size: 18px; }
    .meal-header-left .meal-label { font-size: 15px; font-weight: 600; color: #333; }
    .meal-header-left .meal-badge {
      font-size: 11px;
      color: #999;
      background: #f5f5f5;
      padding: 2px 8px;
      border-radius: 8px;
    }
    .meal-toggle { font-size: 14px; color: #ccc; transition: transform 0.2s; }
    .meal-section.collapsed .meal-toggle { transform: rotate(-90deg); }
    .meal-records { padding: 0 16px 12px; }
    .meal-section.collapsed .meal-records { display: none; }

    .food-record {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f9fafb;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .food-record-left { display: flex; align-items: center; gap: 8px; }
    .food-record-left .food-emoji { font-size: 18px; }
    .food-record-left .food-name { font-size: 14px; color: #333; }
    .food-record-left .food-portion { font-size: 12px; color: #999; }
    .delete-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: #fef2f2;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      font-size: 14px;
      transition: all 0.2s;
    }
    .delete-btn:active { transform: scale(0.9); }

    .add-food-btn {
      width: 100%;
      padding: 10px;
      border: 1.5px dashed #d1d5db;
      background: transparent;
      border-radius: 12px;
      color: #10b981;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .add-food-btn:active { background: #ecfdf5; }

    .empty-state {
      text-align: center;
      padding: 12px;
      color: #ccc;
      font-size: 13px;
    }

    /* ===== 添加食物面板 ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      display: none;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .overlay.show { display: block; opacity: 1; }

    .food-panel {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background: #fff;
      border-radius: 24px 24px 0 0;
      z-index: 201;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .food-panel.show { transform: translateX(-50%) translateY(0); }
    .panel-handle {
      width: 36px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 10px auto 6px;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 12px;
    }
    .panel-title { font-size: 17px; font-weight: 600; color: #333; }
    .panel-close {
      width: 28px; height: 28px;
      border: none; background: #f5f5f5;
      border-radius: 50%; cursor: pointer;
      font-size: 16px; color: #999;
    }
    .search-box {
      margin: 0 20px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f5f5f5;
      border-radius: 12px;
      padding: 10px 14px;
    }
    .search-box input {
      flex: 1;
      border: none; background: none; outline: none;
      font-size: 15px; color: #333;
    }
    .search-box .search-icon { color: #999; font-size: 16px; }

    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 0 20px 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      padding: 6px 14px;
      border: none;
      background: #f5f5f5;
      border-radius: 20px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-tab.active {
      background: #10b981;
      color: #fff;
      font-weight: 500;
    }

    .food-grid {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 20px 80px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      align-content: start;
    }
    /* 滚动条样式 */
    .food-grid::-webkit-scrollbar { width: 4px; }
    .food-grid::-webkit-scrollbar-track { background: transparent; }
    .food-grid::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
    .food-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      background: #f9fafb;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      overflow: hidden;
    }
    .food-card:active {
      transform: scale(0.96);
      border-color: #10b981;
    }
    .food-card .food-emoji { font-size: 24px; flex-shrink: 0; }
    .food-card .food-name { font-size: 14px; color: #333; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ===== 份量选择器 ===== */
    .portion-selector {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      padding: 16px 20px 20px;
      z-index: 10;
    }
    .portion-selector.show { display: block; animation: slideUp 0.25s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .portion-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      text-align: center;
    }
    .portion-options { display: flex; gap: 10px; }
    .portion-opt {
      flex: 1;
      padding: 14px 8px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
    }
    .portion-opt.selected {
      border-color: #10b981;
      background: #ecfdf5;
    }
    .portion-opt .opt-label { font-size: 14px; font-weight: 600; color: #333; }
    .portion-opt .opt-grams { font-size: 12px; color: #999; margin-top: 2px; }
    .confirm-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .confirm-btn:active { transform: scale(0.98); }

    /* ===== 分析页 ===== */
    .analysis-bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      height: 160px;
      padding-top: 20px;
    }
    .bar-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .bar-pair {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 120px;
    }
    .bar-actual, .bar-recommended {
      width: 12px;
      border-radius: 4px 4px 0 0;
      transition: height 0.5s ease-out;
    }
    .bar-actual { background: #10b981; }
    .bar-recommended { background: #e5e7eb; }
    .bar-label { font-size: 10px; color: #999; text-align: center; line-height: 1.2; }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-left { display: flex; align-items: center; gap: 8px; }
    .detail-name { font-size: 14px; color: #333; font-weight: 500; }
    .detail-value { font-size: 12px; color: #999; }
    .detail-right { display: flex; align-items: center; gap: 8px; }
    .detail-gap { font-size: 12px; color: #999; }
    .status-badge {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: 500;
    }
    .badge-sufficient { background: #d1fae5; color: #059669; }
    .badge-normal { background: #dbeafe; color: #2563eb; }
    .badge-mild { background: #fef3c7; color: #d97706; }
    .badge-severe { background: #fee2e2; color: #dc2626; }

    .top-deficient {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .top-deficient-title {
      font-size: 14px;
      font-weight: 600;
      color: #92400e;
      margin-bottom: 10px;
    }
    .deficient-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .deficient-name { font-size: 13px; color: #78350f; }
    .deficient-gap { font-size: 13px; color: #b45309; font-weight: 600; }

    .empty-analysis {
      text-align: center;
      padding: 60px 20px;
      color: #ccc;
    }
    .empty-analysis .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-analysis .empty-text { font-size: 15px; margin-bottom: 4px; }
    .empty-analysis .empty-hint { font-size: 13px; }

    /* ===== 页面标题 ===== */
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }
    .page-subtitle {
      font-size: 13px;
      color: #999;
      margin-bottom: 20px;
    }

    /* ===== 5Tab底部导航适配 ===== */
    .tab-item .tab-label { font-size: 10px; }

    /* ===== 膳食建议卡片 ===== */
    .recommend-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      border-left: 4px solid #10b981;
    }
    .recommend-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .recommend-vitamin {
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }
    .recommend-gap {
      font-size: 12px;
      color: #ef4444;
      font-weight: 500;
    }
    .recommend-desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .recommend-foods {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .recommend-food-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f9fafb;
      border-radius: 12px;
    }
    .recommend-food-tag {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: #ecfdf5;
      border-radius: 16px;
      font-size: 13px;
      color: #059669;
      font-weight: 500;
    }
    .recommend-food-tag .tag-emoji { font-size: 15px; }
    .recommend-food-amount {
      font-size: 12px;
      color: #4b5563;
      font-weight: 500;
    }
    .recommend-food-scene {
      font-size: 11px;
      color: #6b7280;
      background: #f3f4f6;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: auto;
    }

    /* ===== 食物维生素明细 ===== */
    .fvd-meal { margin-bottom: 16px; }
    .fvd-meal:last-child { margin-bottom: 0; }
    .fvd-meal-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #e5e7eb;
    }
    .fvd-meal-emoji { font-size: 15px; }
    .fvd-item {
      background: #f9fafb;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .fvd-item:last-child { margin-bottom: 0; }
    .fvd-item-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .fvd-emoji { font-size: 18px; }
    .fvd-name { font-size: 14px; color: #333; font-weight: 500; }
    .fvd-portion {
      font-size: 11px;
      color: #6b7280;
      background: #f3f4f6;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: auto;
    }
    .fvd-vtags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .fvd-vtag {
      font-size: 11px;
      color: #059669;
      background: #ecfdf5;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 500;
    }
    .fvd-vtag-none {
      color: #9ca3af;
      background: #f3f4f6;
    }

    /* ===== 亚健康症状 ===== */
    .symptom-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .symptom-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 16px 8px;
      background: #fff;
      border: 2px solid #f0f0f0;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .symptom-card.selected {
      border-color: #10b981;
      background: #ecfdf5;
    }
    .symptom-card:active { transform: scale(0.96); }
    .symptom-card .symptom-emoji { font-size: 28px; }
    .symptom-card .symptom-name { font-size: 13px; color: #555; font-weight: 500; }

    .symptom-result {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .symptom-result-title {
      font-size: 15px;
      font-weight: 600;

// ===== 工具函数 =====
function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return formatDate(d);
}

function isToday(dateStr) {
  return dateStr === formatDate(new Date());
}

function getDateDisplay(dateStr) {
  const d = new Date(dateStr);
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return `${d.getMonth() + 1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;
}

function getFoodById(id) {
  return FOODS.find(f => f.id === id);
}

// ===== localStorage =====
const STORAGE_KEY = 'vitamin_diary_records';

function getAllRecords() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch { return {}; }
}

function getDailyRecord(date) {
  const all = getAllRecords();
  return all[date] || { date, records: [] };
}

function saveDailyRecord(date, record) {
  const all = getAllRecords();
  all[date] = record;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
}

function addRecord(date, foodId, foodName, mealType, portionSize, grams) {
  const record = getDailyRecord(date);
  record.records.push({
    id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    foodId, foodName, mealType, portionSize, grams,
    createdAt: new Date().toISOString()
  });
  saveDailyRecord(date, record);
}

function removeRecord(date, recordId) {
  const record = getDailyRecord(date);
  record.records = record.records.filter(r => r.id !== recordId);
  saveDailyRecord(date, record);
}

// ===== 维生素计算 =====
function calculateTotalVitamins(records) {
  const totals = {};
  VITAMIN_KEYS.forEach(k => totals[k] = 0);
  records.forEach(r => {
    const food = getFoodById(r.foodId);
    if (food) {
      VITAMIN_KEYS.forEach(k => {
        totals[k] += food.v[k] * (r.grams / 100);
      });
    }
  });
  return totals;
}

function getStatus(percentage) {
  if (percentage >= 100) return 'sufficient';
  if (percentage >= 80) return 'normal';
  if (percentage >= 50) return 'mild';
  return 'severe';
}

function getStatusText(status) {
  const map = { sufficient: '充足', normal: '正常', mild: '轻微缺乏', severe: '严重缺乏' };
  return map[status] || '';
}

function getBadgeClass(status) {
  const map = { sufficient: 'badge-sufficient', normal: 'badge-normal', mild: 'badge-mild', severe: 'badge-severe' };
  return map[status] || '';
}

function calculateAnalysis(records) {
  const totals = calculateTotalVitamins(records);
  const analysis = {};
  VITAMIN_KEYS.forEach(k => {
    const actual = totals[k];
    const recommended = RECOMMENDED_INTAKE[k];
    const percentage = recommended > 0 ? Math.round((actual / recommended) * 1000) / 10 : 0;
    const status = getStatus(percentage);
    const gap = Math.max(0, recommended - actual);
    analysis[k] = { actual, recommended, percentage, status, gap };
  });
  return analysis;
}

function calculateOverallScore(analysis) {
  let sum = 0;
  VITAMIN_KEYS.forEach(k => {
    sum += Math.min(100, analysis[k].percentage);
  });
  return Math.round(sum / VITAMIN_KEYS.length);
}

function getTopDeficient(analysis) {
  return VITAMIN_KEYS
    .map(k => ({ key: k, ...analysis[k] }))
    .sort((a, b) => b.gap - a.gap)
    .slice(0, 3);
}

  currentDate = formatDate(new Date());
  renderPage();
}

function renderPage() {
  if (currentTab === 'home') renderHome();
  else if (currentTab === 'record') renderRecord();
  else if (currentTab === 'analysis') renderAnalysis();
  else if (currentTab === 'advice') renderAdvice();
  else if (currentTab === 'history') renderHistory();
}

// --- 首页 ---
function renderHome() {
  const record = getDailyRecord(currentDate);
  const analysis = calculateAnalysis(record.records);
  const score = calculateOverallScore(analysis);

  // 日期
  document.getElementById('home-date-text').textContent = getDateDisplay(currentDate);
  document.getElementById('home-today-btn').style.display = isToday(currentDate) ? 'none' : 'inline';

  // 评分
  document.getElementById('home-score').textContent = score;
  document.getElementById('home-score-bar').style.width = score + '%';

  // 维生素列表
  const listEl = document.getElementById('home-vitamin-list');
  listEl.innerHTML = VITAMIN_KEYS.map(k => {
    const a = analysis[k];
    const pct = Math.min(100, a.percentage);
    return `
      <div class="vitamin-item status-${a.status}">
        <div class="vitamin-header">
          <span class="vitamin-name">${VITAMIN_NAMES[k]}</span>
          <span class="vitamin-percent">${a.percentage}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%"></div>

  // 餐次概览

  mealEl.innerHTML = MEAL_TYPES.map(m => {
    const count = record.records.filter(r => r.mealType === m.key).length;
    return `
      <div class="meal-dot ${count > 0 ? 'has-records' : ''}">
        <div class="meal-emoji">${m.emoji}</div>
        <div class="meal-name">${m.name}</div>
        <div class="meal-count">${count > 0 ? count + '项' : '—'}</div>
      </div>

}

// --- 分析页 ---
function renderAnalysis() {
  document.getElementById('analysis-date-text').textContent = getDateDisplay(currentDate);
  const record = getDailyRecord(currentDate);
  const contentEl = document.getElementById('analysis-content');

  if (record.records.length === 0) {
    contentEl.innerHTML = `
      <div class="empty-analysis">
        <div class="empty-icon">📊</div>
        <div class="empty-text">还没有饮食记录</div>
        <div class="empty-hint">去记录页添加你的第一餐吧</div>
      </div>
    `;
    return;
  }

  const analysis = calculateAnalysis(record.records);
  const score = calculateOverallScore(analysis);
  const topDef = getTopDeficient(analysis);

  // 柱状图
  const maxPct = 120;
  const barChartHtml = `
    <div class="card">
      <div class="card-title">维生素摄入对比</div>
      <div class="analysis-bar-chart">
        ${VITAMIN_KEYS.map(k => {
          const a = analysis[k];
          const actualH = Math.min(100, (a.percentage / maxPct) * 100);
          const recH = (100 / maxPct) * 100;
          return `
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar-actual" style="height:${actualH}%" title="实际: ${a.actual.toFixed(1)}"></div>
                <div class="bar-recommended" style="height:${recH}%" title="推荐: ${a.recommended}"></div>
              </div>
              <div class="bar-label">${VITAMIN_NAMES[k].replace('维生素','')}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div style="display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px;color:#999">
        <span><span style="display:inline-block;width:10px;height:10px;background:#10b981;border-radius:2px;vertical-align:middle"></span> 实际摄入</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#e5e7eb;border-radius:2px;vertical-align:middle"></span> 推荐摄入</span>
      </div>
    </div>
  `;

  // 评分卡片
  const scoreHtml = `
    <div class="score-card">
      <div class="score-label">今日营养均衡度</div>
      <div class="score-value">${score}</div>
      <div class="score-unit">综合评分</div>
      <div class="score-bar">
        <div class="score-bar-fill" style="width:${score}%"></div>
      </div>
    </div>
  `;

  // Top 3 缺乏
  const topDefHtml = topDef.some(d => d.gap > 0) ? `
    <div class="top-deficient">
      <div class="top-deficient-title">⚠️ 最需要补充的维生素</div>
      ${topDef.filter(d => d.gap > 0).map(d => `
        <div class="deficient-item">
          <span class="deficient-name">${VITAMIN_NAMES[d.key]}</span>
          <span class="deficient-gap">缺口 ${d.gap.toFixed(1)}${VITAMIN_UNITS[d.key]}</span>
        </div>
      `).join('')}
    </div>
  ` : '';

  // 详细数据
  const detailHtml = `
    <div class="card">
      <div class="card-title">详细数据</div>
      ${VITAMIN_KEYS.map(k => {
        const a = analysis[k];
        return `
          <div class="detail-row">
            <div class="detail-left">
              <span class="detail-name">${VITAMIN_NAMES[k]}</span>
              <span class="detail-value">${a.actual.toFixed(1)}/${a.recommended}${VITAMIN_UNITS[k]}</span>
            </div>
            <div class="detail-right">
              <span class="detail-gap">${a.percentage}%</span>
              <span class="status-badge ${getBadgeClass(a.status)}">${getStatusText(a.status)}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  // 食物维生素明细
  const foodDetailHtml = renderFoodVitaminDetail(record.records);

  contentEl.innerHTML = scoreHtml + topDefHtml + barChartHtml + detailHtml + foodDetailHtml + renderWeeklyAnalysis();
}

// --- 食物维生素明细 ---
function renderFoodVitaminDetail(records) {
  if (!records || records.length === 0) return '';

  let html = '<div class="card"><div class="card-title">食物维生素明细</div>';

  MEAL_TYPES.forEach(m => {
    const mealRecords = records.filter(r => r.mealType === m.key);
    if (mealRecords.length === 0) return;

    html += `
      <div class="fvd-meal">
        <div class="fvd-meal-title"><span class="fvd-meal-emoji">${m.emoji}</span>${m.name}</div>
    `;

    mealRecords.forEach(r => {
      const food = getFoodById(r.foodId);
      const emoji = food ? food.emoji : '🍽️';
      // 计算该份量下各维生素含量
      const factor = r.grams / 100;
      const vitaminTags = VITAMIN_KEYS.map(k => {
        if (!food) return null;
        const val = food.v[k] * factor;
        if (val <= 0) return null;
        return { key: k, val };
      }).filter(Boolean);

      const tagsHtml = vitaminTags.length > 0
        ? vitaminTags.map(t => `<span class="fvd-vtag">${VITAMIN_NAMES[t.key].replace('维生素','维').replace('族','')} ${t.val.toFixed(1)}${VITAMIN_UNITS[t.key]}</span>`).join('')
        : '<span class="fvd-vtag fvd-vtag-none">暂无数据</span>';

      html += `
        <div class="fvd-item">
          <div class="fvd-item-head">
            <span class="fvd-emoji">${emoji}</span>
            <span class="fvd-name">${r.foodName}</span>
            <span class="fvd-portion">${PORTION_LABELS[r.portionSize]} · ${r.grams}g</span>
          </div>
          <div class="fvd-vtags">${tagsHtml}</div>
        </div>
      `;
    });

    html += '</div>';
  });

  html += '</div>';
  return html;
}

// --- 一周维生素聚合分析 ---
function renderWeeklyAnalysis() {
  const all = getAllRecords();
  const today = formatDate(new Date());

  // 获取近7天日期（含今天）
  const dates = [];
  for (let i = 6; i >= 0; i--) {
    dates.push(addDays(today, -i));
  }

  // 统计有记录的天数和各项数据
  let hasDataDays = 0;
  let totalScore = 0;
  const vitaminSums = {};
  VITAMIN_KEYS.forEach(k => vitaminSums[k] = { sum: 0, deficientDays: 0 });
  const dayScores = [];

  dates.forEach(d => {
    const record = all[d];
    if (record && record.records.length > 0) {
      hasDataDays++;
      const analysis = calculateAnalysis(record.records);
      const score = calculateOverallScore(analysis);
      totalScore += score;
      dayScores.push({ date: d, score, hasData: true });
      VITAMIN_KEYS.forEach(k => {
        vitaminSums[k].sum += analysis[k].percentage;
        if (analysis[k].gap > 0) vitaminSums[k].deficientDays++;
      });
    } else {
      dayScores.push({ date: d, score: 0, hasData: false });
    }
  });

  if (hasDataDays === 0) {
    return `
      <div class="weekly-card">
        <div class="weekly-header">
          <div class="weekly-title">一周维生素总览</div>
          <div class="weekly-subtitle">近7天</div>
        </div>
        <div class="empty-state" style="padding:24px">近7天暂无饮食记录</div>
      </div>
    `;
  }

  const avgScore = Math.round(totalScore / hasDataDays);
  const scoreColor = avgScore >= 60 ? '#10b981' : avgScore >= 40 ? '#f59e0b' : '#ef4444';

  // 各维生素一周平均
  const vitaminRowsHtml = VITAMIN_KEYS.map(k => {
    const avg = Math.round(vitaminSums[k].sum / hasDataDays);
    const status = getStatus(avg);
    const barColor = status === 'sufficient' ? '#10b981' : status === 'normal' ? '#3b82f6' : status === 'mild' ? '#f59e0b' : '#ef4444';
    const defDays = vitaminSums[k].deficientDays;
    return `
      <div class="weekly-vitamin-row">
        <span class="weekly-vitamin-name">${VITAMIN_NAMES[k]}</span>
        <div class="weekly-vitamin-bar-wrap">
          <div class="weekly-vitamin-bar-fill" style="width:${Math.min(100, avg)}%;background:${barColor}"></div>
        </div>
        <span class="weekly-vitamin-percent" style="color:${barColor}">${avg}%</span>
      </div>
    `;
  }).join('');

  // 7天每日评分
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const dayScoresHtml = dayScores.map(d => {
    const wd = weekdays[new Date(d.date).getDay()];
    const isToday = d.date === today;
    return `
      <div class="weekly-day-score ${d.hasData ? '' : 'no-data'} ${isToday ? 'today' : ''}">
        <div class="wds-day">${wd}</div>
        <div class="wds-score">${d.hasData ? d.score : '—'}</div>
      </div>
    `;
  }).join('');

  // 高频缺乏
  const frequentDef = VITAMIN_KEYS
    .map(k => ({ key: k, days: vitaminSums[k].deficientDays }))
    .filter(d => d.days >= 2)
    .sort((a, b) => b.days - a.days);

  const frequentDefHtml = frequentDef.length > 0 ? `
    <div class="top-deficient" style="margin-top:16px">
      <div class="top-deficient-title">⚠️ 本周高频缺乏</div>
      ${frequentDef.map(d => `
        <div class="deficient-item">
          <span class="deficient-name">${VITAMIN_NAMES[d.key]}</span>
          <span class="deficient-gap">${d.days}/${hasDataDays}天不足</span>
        </div>
      `).join('')}
    </div>
  ` : '';

  return `
    <div class="weekly-card">
      <div class="weekly-header">
        <div class="weekly-title">一周维生素总览</div>
        <div class="weekly-subtitle">近7天 · ${hasDataDays}天有记录</div>
      </div>
      <div class="weekly-score-row">
        <div class="weekly-score-item">
          <div class="wsi-value" style="color:${scoreColor}">${avgScore}</div>
          <div class="wsi-label">平均评分</div>
        </div>
        <div class="weekly-score-item">
          <div class="wsi-value" style="color:#3b82f6">${hasDataDays}</div>
          <div class="wsi-label">记录天数</div>
        </div>
        <div class="weekly-score-item">
          <div class="wsi-value" style="color:#f59e0b">${frequentDef.length}</div>
          <div class="wsi-label">高频缺乏</div>
        </div>
      </div>
      <div>${vitaminRowsHtml}</div>
      ${frequentDefHtml}
      <div class="weekly-day-scores">${dayScoresHtml}</div>
    </div>
  `;
}

// --- 建议页（个性化膳食补充建议 + 亚健康症状溯源）---
function renderAdvice() {
  const record = getDailyRecord(currentDate);
  const contentEl = document.getElementById('advice-content');
  let html = '';

  // 日期提示
  html += `<div class="page-subtitle" style="margin-bottom:16px">${getDateDisplay(currentDate)} 的饮食建议</div>`;

  // === 个性化膳食补充建议 ===
  if (record.records.length === 0) {
    html += `
      <div class="empty-state-large">
        <div class="empty-icon">🥗</div>
        <div class="empty-text">今天还没有饮食记录</div>
        <div class="empty-hint">去记录页添加你的饮食，即可获得个性化建议</div>
      </div>
    `;
  } else {
    const analysis = calculateAnalysis(record.records);
    const deficientVitamins = VITAMIN_KEYS
      .filter(k => analysis[k].gap > 0)
      .sort((a, b) => analysis[b].gap - analysis[a].gap);

    if (deficientVitamins.length === 0) {
      html += `
        <div class="card" style="text-align:center;padding:30px">
          <div style="font-size:40px;margin-bottom:12px">🎉</div>
          <div style="font-size:16px;font-weight:600;color:#10b981;margin-bottom:4px">营养均衡！</div>
          <div style="font-size:13px;color:#888">今日各类维生素摄入均已达标，继续保持！</div>
        </div>
      `;
    } else {
      html += '<div class="card-title" style="margin-bottom:12px">针对性膳食补充方案</div>';
      deficientVitamins.forEach(k => {
        const a = analysis[k];
        const rec = VITAMIN_FOOD_RECOMMENDATIONS[k];
        const foodTags = rec.foods.map(item => {
          const food = getFoodById(item.id);
          return food ? `
            <div class="recommend-food-item">
              <span class="recommend-food-tag"><span class="tag-emoji">${food.emoji}</span>${food.name}</span>
              <span class="recommend-food-amount">${item.amount}</span>
              <span class="recommend-food-scene">${item.scene}</span>
            </div>
          ` : '';
        }).join('');

        html += `
          <div class="recommend-card">
            <div class="recommend-header">
              <span class="recommend-vitamin">${VITAMIN_NAMES[k]}</span>
              <span class="recommend-gap">缺口 ${a.gap.toFixed(1)}${VITAMIN_UNITS[k]}</span>
            </div>
            <div class="recommend-desc">${rec.desc}。建议补充以下食材：</div>
            <div class="recommend-foods">${foodTags}</div>
          </div>
        `;
      });
    }
  }

  // === 亚健康症状智能溯源 ===
  html += '<div class="card-title" style="margin:24px 0 12px">亚健康症状溯源</div>';
  html += '<div style="font-size:13px;color:#888;margin-bottom:12px">选择你近期出现的症状，系统将分析可能的维生素缺乏原因</div>';
  html += '<div class="symptom-grid" id="symptom-grid">';
  SYMPTOMS.forEach(s => {
    const isSelected = selectedSymptoms.includes(s.key);
    html += `
      <div class="symptom-card ${isSelected ? 'selected' : ''}" onclick="toggleSymptom('${s.key}')">
        <span class="symptom-emoji">${s.emoji}</span>
        <span class="symptom-name">${s.name}</span>
      </div>
    `;
  });
  html += '</div>';

  // 症状分析结果
  if (selectedSymptoms.length > 0) {
    const linkedVitamins = {};
    selectedSymptoms.forEach(symKey => {
      const symptom = SYMPTOMS.find(s => s.key === symKey);
      if (symptom) {
        symptom.vitamins.forEach(vk => {
          if (!linkedVitamins[vk]) linkedVitamins[vk] = [];
          linkedVitamins[vk].push(symptom);
        });
      }
    });

    const sortedVitamins = Object.keys(linkedVitamins).sort((a, b) => linkedVitamins[b].length - linkedVitamins[a].length);

    html += '<div class="symptom-result">';
    html += '<div class="symptom-result-title">🔍 可能的维生素缺乏分析</div>';

    // 如果有饮食记录，结合实际数据
    let hasData = record.records.length > 0;
    sortedVitamins.forEach(vk => {
      const symptoms = linkedVitamins[vk];
      const actualStatus = hasData ? calculateAnalysis(record.records)[vk] : null;
      const statusText = actualStatus ? `（实际摄入${actualStatus.percentage}%）` : '';
      html += `
        <div class="symptom-vitamin-link">
          <span class="symptom-link-name">${VITAMIN_NAMES[vk]}</span>
          <span class="symptom-link-desc">${symptoms.map(s => s.name).join('、')}${statusText}</span>
        </div>
      `;
    });
    html += '</div>';

    // 推荐食物
    html += '<div class="card-title" style="margin:16px 0 12px">建议补充食材</div>';
    sortedVitamins.forEach(vk => {
      const rec = VITAMIN_FOOD_RECOMMENDATIONS[vk];
      const foodTags = rec.foods.map(item => {
        const food = getFoodById(item.id);
        return food ? `
          <div class="recommend-food-item">
            <span class="recommend-food-tag"><span class="tag-emoji">${food.emoji}</span>${food.name}</span>
            <span class="recommend-food-amount">${item.amount}</span>
            <span class="recommend-food-scene">${item.scene}</span>
          </div>
        ` : '';
      }).join('');
      html += `
        <div class="recommend-card">
          <div class="recommend-header">
            <span class="recommend-vitamin">${VITAMIN_NAMES[vk]}</span>
          </div>
          <div class="recommend-desc">${rec.desc}</div>
          <div class="recommend-foods">${foodTags}</div>
        </div>
      `;
    });
  }

  contentEl.innerHTML = html;
}

function toggleSymptom(key) {
  const idx = selectedSymptoms.indexOf(key);
  if (idx >= 0) {
    selectedSymptoms.splice(idx, 1);
  } else {
    selectedSymptoms.push(key);
  }
  renderAdvice();
}

// --- 历史页 ---
function renderHistory() {
  renderPeriodAnalysis();
  renderTrendChart();
  renderHistoryList();
}

function selectPeriod(period) {
  selectedPeriod = period;
  document.querySelectorAll('.period-btn').forEach(btn => {
    const btnVal = btn.dataset.period;
    const isActive = (period === 'all' && btnVal === 'all') || (period !== 'all' && parseInt(btnVal) === period);
    btn.classList.toggle('active', isActive);
  });
  renderPeriodAnalysis();
}

function renderPeriodAnalysis() {
  const el = document.getElementById('period-analysis');
  const all = getAllRecords();
  const allDates = Object.keys(all).sort().reverse();

  // 筛选日期范围
  let dates;
  if (selectedPeriod === 'all') {
    dates = allDates;
  } else {
    const days = selectedPeriod;
    const cutoff = addDays(formatDate(new Date()), -days + 1);
    dates = allDates.filter(d => d >= cutoff);
  }

  if (dates.length === 0) {
    el.innerHTML = `
      <div class="empty-state-large" style="padding:30px">
        <div class="empty-icon" style="font-size:36px">📅</div>
        <div class="empty-text" style="font-size:14px">该时间段暂无记录</div>
      </div>
    `;
    return;
  }

  // 聚合计算
  const dayCount = dates.length;
  let totalScores = 0;
  const vitaminAverages = {};
  VITAMIN_KEYS.forEach(k => vitaminAverages[k] = { sum: 0, deficientDays: 0 });

  dates.forEach(d => {
    const record = all[d];
    if (record && record.records.length > 0) {
      const analysis = calculateAnalysis(record.records);
      totalScores += calculateOverallScore(analysis);
      VITAMIN_KEYS.forEach(k => {
        vitaminAverages[k].sum += analysis[k].percentage;
        if (analysis[k].gap > 0) vitaminAverages[k].deficientDays++;
      });
    }
  });

  const avgScore = Math.round(totalScores / dayCount);

  let html = `
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">周期概览</div>
      <div style="display:flex;gap:16px;margin-bottom:12px">
        <div style="flex:1;text-align:center">
          <div style="font-size:28px;font-weight:700;color:#10b981">${dayCount}</div>
          <div style="font-size:12px;color:#999">记录天数</div>
        </div>
        <div style="flex:1;text-align:center">
          <div style="font-size:28px;font-weight:700;color:${avgScore >= 60 ? '#10b981' : avgScore >= 40 ? '#f59e0b' : '#ef4444'}">${avgScore}</div>
          <div style="font-size:12px;color:#999">平均评分</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">维生素平均摄入</div>
  `;

  VITAMIN_KEYS.forEach(k => {
    const avg = Math.round(vitaminAverages[k].sum / dayCount);
    const defDays = vitaminAverages[k].deficientDays;
    const status = getStatus(avg);
    const barColor = status === 'sufficient' ? '#10b981' : status === 'normal' ? '#3b82f6' : status === 'mild' ? '#f59e0b' : '#ef4444';

    html += `
      <div class="period-stat">
        <span class="period-stat-name">${VITAMIN_NAMES[k]}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="period-stat-value">${avg}%</span>
          <div class="period-stat-bar">
            <div class="period-stat-bar-fill" style="width:${Math.min(100, avg)}%;background:${barColor}"></div>
          </div>
        </div>
      </div>
    `;
  });

  // 高频缺乏提醒
  const frequentDeficient = VITAMIN_KEYS
    .map(k => ({ key: k, days: vitaminAverages[k].deficientDays, total: dayCount }))
    .filter(d => d.days > 0)
    .sort((a, b) => b.days - a.days);

  if (frequentDeficient.length > 0 && frequentDeficient[0].days >= 2) {
    html += `
      <div class="top-deficient" style="margin-top:12px">
        <div class="top-deficient-title">⚠️ 高频缺乏营养</div>
        ${frequentDeficient.filter(d => d.days >= 2).map(d => `
          <div class="deficient-item">
            <span class="deficient-name">${VITAMIN_NAMES[d.key]}</span>
            <span class="deficient-gap">${d.days}/${d.total}天缺乏</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  html += '</div>';
  el.innerHTML = html;
}

function renderHistoryList() {
  const el = document.getElementById('history-list');
  const all = getAllRecords();
  const dates = Object.keys(all).sort().reverse();

  if (dates.length === 0) {
    el.innerHTML = '<div class="empty-state" style="padding:30px">暂无历史记录</div>';
    return;
  }

  el.innerHTML = dates.map(d => {
    const record = all[d];
    const recordCount = record.records.length;
    const analysis = calculateAnalysis(record.records);
    const score = calculateOverallScore(analysis);
    const scoreClass = score >= 60 ? '' : score >= 40 ? 'low' : 'very-low';

    const dateObj = new Date(d);
    const day = dateObj.getDate();
    const month = (dateObj.getMonth() + 1) + '月';
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const weekday = weekdays[dateObj.getDay()];

    return `
      <div class="history-item" onclick="jumpToDate('${d}')">
        <div class="history-left">
          <div class="history-date">
            <div class="hd-day">${day}</div>
            <div class="hd-month">${month}</div>
          </div>
          <div class="history-info">
            <div class="hi-date">${weekday}</div>
            <div class="hi-summary">${recordCount}项记录</div>
          </div>
        </div>
        <div class="history-score ${scoreClass}">${score}</div>
      </div>
    `;
  }).join('');
}

function handleQuickInput() {
  const textarea = document.getElementById('quick-input-text');
  const text = textarea.value.trim();
  if (!text) return;

  // 分割食材：支持逗号、空格、顿号
  const items = text.split(/[,，、\s]+/).filter(s => s.length > 0);
  let matched = 0;
  let unmatched = [];

  items.forEach(item => {
    // 模糊匹配食材
    const food = FOODS.find(f => f.name === item) || FOODS.find(f => f.name.includes(item) || item.includes(f.name));
    if (food) {
      addRecord(currentDate, food.id, food.name, quickInputMeal, quickInputPortion, PORTION_GRAMS[quickInputPortion]);
      matched++;
    } else {
      unmatched.push(item);
    }
  });

  // 清空输入框
  textarea.value = '';

  if (matched > 0) {
    // 展开对应餐次
    collapsedMeals[quickInputMeal] = false;
  }

  // 重新渲染
  renderPage();

  // 提示结果
  if (unmatched.length > 0 && matched === 0) {
    showToast(`未找到"${unmatched.join('、')}"，请用食材选择按钮添加`);
  } else if (unmatched.length > 0) {
    showToast(`已添加${matched}项，"${unmatched.join('、')}"未匹配到`);
  } else {
    showToast(`已添加${matched}项食材到${MEAL_TYPES.find(m => m.key === quickInputMeal).name}`);
  }
}

// ===== Toast 提示 =====
let toastTimer = null;
function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;z-index:999;transition:opacity 0.3s;pointer-events:none;max-width:80%;text-align:center';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2500);
}

// ===== 营养评分趋势折线图 =====
function renderTrendChart() {
  const all = getAllRecords();
  const card = document.getElementById('trend-chart-card');
  const canvas = document.getElementById('trend-chart');

  // 获取选中时间段内的日期
  let dates;
  const allDates = Object.keys(all).sort();
  if (selectedPeriod === 'all') {
    dates = allDates;
  } else {
    const cutoff = addDays(formatDate(new Date()), -selectedPeriod + 1);
    dates = allDates.filter(d => d >= cutoff);
  }

  if (dates.length < 2) {
    card.style.display = 'none';
    return;
  }

  card.style.display = 'block';

  // 计算每日评分
  const scores = dates.map(d => {
    const record = all[d];
    if (record && record.records.length > 0) {
      return { date: d, score: calculateOverallScore(calculateAnalysis(record.records)) };
    }
    return { date: d, score: 0 };
  }).filter(s => s.score > 0);

  if (scores.length < 2) {
    card.style.display = 'none';
    return;
  }

  // 绘制 Canvas
  const dpr = window.devicePixelRatio || 1;
  const containerWidth = canvas.parentElement.offsetWidth - 40; // 减去padding
  const chartWidth = Math.max(containerWidth, scores.length * 40);
  const chartHeight = 140;
  const padding = { top: 20, right: 20, bottom: 30, left: 30 };
  const innerW = chartWidth - padding.left - padding.right;
  const innerH = chartHeight - padding.top - padding.bottom;

  canvas.width = chartWidth * dpr;
  canvas.height = chartHeight * dpr;
  canvas.style.width = chartWidth + 'px';
  canvas.style.height = chartHeight + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, chartWidth, chartHeight);

  // 网格线
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (innerH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(padding.left + innerW, y);
    ctx.stroke();
  }

  // Y轴标签
  ctx.fillStyle = '#bbb';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (innerH / 4) * i;
    const val = 100 - (100 / 4) * i;
    ctx.fillText(val, padding.left - 6, y + 3);
  }

  // 坐标点
  const points = scores.map((s, i) => {
    const x = padding.left + (innerW / Math.max(1, scores.length - 1)) * i;
    const y = padding.top + innerH - (s.score / 100) * innerH;
    return { x, y, ...s };
  });

  // 渐变填充区域
  const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + innerH);
  gradient.addColorStop(0, 'rgba(16,185,129,0.25)');
  gradient.addColorStop(1, 'rgba(16,185,129,0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.moveTo(points[0].x, padding.top + innerH);
  points.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(points[points.length - 1].x, padding.top + innerH);
  ctx.closePath();
  ctx.fill();

  // 折线
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  points.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();

  // 数据点
  points.forEach(p => {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // X轴日期标签
  ctx.fillStyle = '#999';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  const labelStep = Math.ceil(scores.length / 7);
  points.forEach((p, i) => {
    if (i % labelStep === 0 || i === points.length - 1) {
      const d = new Date(p.date);
      const label = `${d.getMonth() + 1}/${d.getDate()}`;
      ctx.fillText(label, p.x, padding.top + innerH + 16);
    }
  });

  // 存储点位用于交互
  canvas._points = points;
  canvas.onmousemove = function(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    let closest = null;
    let minDist = Infinity;
    points.forEach(p => {
      const dist = Math.abs(p.x - mx);
      if (dist < minDist) { minDist = dist; closest = p; }
    });
    if (closest && minDist < 30) {
      canvas.style.cursor = 'pointer';
      canvas.title = `${closest.date}: ${closest.score}分`;
    } else {
      canvas.style.cursor = 'default';
      canvas.title = '';
    }
  };
  canvas.onclick = function(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    let closest = null;
    let minDist = Infinity;
    points.forEach(p => {
      const dist = Math.abs(p.x - mx);
      if (dist < minDist) { minDist = dist; closest = p; }
    });
    if (closest && minDist < 30) {
      jumpToDate(closest.date);
    }
  };
}

// ===== 日历选择器 =====
function openCalendar() {
  calendarMonth = new Date(currentDate);
  renderCalendar();
  document.getElementById('calendar-overlay').classList.add('show');
}

function closeCalendar() {
  document.getElementById('calendar-overlay').classList.remove('show');
}

function calendarNav(delta) {
  calendarMonth.setMonth(calendarMonth.getMonth() + delta);
  renderCalendar();
}

function renderCalendar() {
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
  document.getElementById('calendar-title').textContent = `${year}年${monthNames[month]}`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();

  // 上月填充
  const prevLastDay = new Date(year, month, 0).getDate();
  const todayStr = formatDate(new Date());
  const all = getAllRecords();

  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  let html = weekdays.map(w => `<div class="calendar-weekday">${w}</div>`).join('');

  // 上月日期
  for (let i = startWeekday - 1; i >= 0; i--) {
    html += `<button class="calendar-day other-month" disabled>${prevLastDay - i}</button>`;
  }

  // 当月日期
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const hasData = all[dateStr] && all[dateStr].records && all[dateStr].records.length > 0;
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === currentDate;
    const classes = ['calendar-day'];
    if (hasData) classes.push('has-data');
    if (isToday) classes.push('today');
    if (isSelected) classes.push('selected');
    html += `<button class="${classes.join(' ')}" onclick="selectCalendarDate('${dateStr}')">${d}</button>`;
  }

  // 下月填充
  const totalCells = startWeekday + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= remaining; d++) {
    html += `<button class="calendar-day other-month" disabled>${d}</button>`;
  }

  document.getElementById('calendar-grid').innerHTML = html;
}

function selectCalendarDate(dateStr) {
  currentDate = dateStr;
  closeCalendar();
  renderPage();
}

  selectedPortion = 'medium';

}

function closeFoodPanel() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('food-panel').classList.remove('show');

  selectedPortion = 'medium';

}

function renderFoodGrid() {

  document.querySelectorAll('.portion-opt').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.portion === portion);
  });
}

function confirmAddFood() {
  if (!selectedFood) return;

  const grams = PORTION_GRAMS[selectedPortion];
  addRecord(currentDate, selectedFood.id, selectedFood.name, currentMealType, selectedPortion, grams);

  closeFoodPanel();
  document.getElementById('food-grid').style.display = '';

}
