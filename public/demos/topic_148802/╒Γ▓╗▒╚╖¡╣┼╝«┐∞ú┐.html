<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这不比翻古籍快？·赛博炼丹炉</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-purple: #bf00ff;
            --neon-gold: #ffd700;
            --neon-pink: #ff00ff;
            --dark-bg: #0a0a0f;
            --dark-card: #12121a;
            --dark-border: #1a1a2e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--dark-bg);
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0; pointer-events: none;
        }

        .bg-glow {
            position: fixed; top: -200px; left: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(191, 0, 255, 0.15) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
            animation: pulse-glow 8s ease-in-out infinite;
        }

        .bg-glow-2 {
            position: fixed; bottom: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
            animation: pulse-glow 10s ease-in-out infinite reverse;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
            z-index: 100; pointer-events: none;
        }

        .floating-symbol {
            position: fixed;
            font-size: 48px;
            opacity: 0.05;
            z-index: 0;
            pointer-events: none;
            animation: float-symbol 20s linear infinite;
        }

        .floating-symbol:nth-child(1) { top: 10%; left: 5%; animation-duration: 25s; }
        .floating-symbol:nth-child(2) { top: 30%; right: 10%; animation-duration: 30s; animation-direction: reverse; }
        .floating-symbol:nth-child(3) { top: 60%; left: 15%; animation-duration: 22s; }
        .floating-symbol:nth-child(4) { bottom: 20%; right: 5%; animation-duration: 28s; animation-direction: reverse; }

        @keyframes float-symbol {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .nav-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            opacity: 0;
            animation: particle-float 8s ease-in-out infinite;
        }

        @keyframes particle-float {
            0%, 100% { opacity: 0; transform: translateY(100vh); }
            10% { opacity: 0.5; }
            50% { opacity: 0.8; }
            90% { opacity: 0.3; }
        }

        .hero-section {
            text-align: center;
            padding: 80px 20px 60px;
            position: relative;
            z-index: 1;
        }

        .hero-title-wrapper {
            position: relative;
            display: inline-block;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-shadow: 
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-purple),
                0 0 40px var(--neon-gold);
            animation: title-glow 3s ease-in-out infinite;
            letter-spacing: 4px;
            line-height: 1.3;
        }

        @keyframes title-glow {
            0%, 100% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-purple), 0 0 40px var(--neon-gold); }
            50% { text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-purple), 0 0 80px var(--neon-gold); }
        }

        .hero-title-outline {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            font-family: 'Orbitron', sans-serif;
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1.3;
            -webkit-text-stroke: 1px var(--neon-cyan);
            -webkit-text-fill-color: transparent;
            opacity: 0.5;
            animation: outline-glow 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes outline-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .hero-subtitle {
            font-size: 22px;
            color: #aaa;
            margin-bottom: 40px;
            letter-spacing: 8px;
            font-family: 'Orbitron', sans-serif;
        }

        .hero-tagline {
            font-size: 16px;
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            padding: 15px 30px;
            border: 2px solid var(--neon-cyan);
            display: inline-block;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 40px;
        }

        .hero-tagline:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 30px var(--neon-cyan);
            transform: translateY(-3px);
        }

        .hero-tagline::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,255,0.2), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .pill-furnace {
            width: 160px; height: 160px;
            margin: 0 auto 50px;
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .furnace-body {
            width: 80px; height: 100px;
            background: linear-gradient(180deg, #2a2a3a, #1a1a2e);
            border: 3px solid var(--neon-gold);
            border-radius: 15px 15px 35px 35px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 20px var(--neon-gold), inset 0 0 30px rgba(255,215,0,0.1);
        }

        .furnace-lid {
            width: 65px; height: 22px;
            background: linear-gradient(180deg, #3a3a4a, #2a2a3a);
            border: 2px solid var(--neon-gold);
            border-radius: 8px;
            position: absolute; top: -12px; left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px var(--neon-gold);
        }

        .furnace-fire {
            width: 55px; height: 30px;
            background: linear-gradient(180deg, var(--neon-purple), var(--neon-pink));
            border-radius: 50% 50% 0 0;
            position: absolute; bottom: -22px; left: 50%;
            transform: translateX(-50%);
            filter: blur(6px);
            animation: flicker 0.5s ease-in-out infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.8; transform: translateX(-50%) scale(1); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }

        .runes {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--neon-gold);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .main-container {
            position: relative; z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .selector-section {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            position: relative;
        }

        .selector-section::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-gold));
            border-radius: 20px 20px 0 0;
        }

        .selector-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--neon-cyan);
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .selector-header::before, .selector-header::after {
            content: '';
            width: 40px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan));
        }

        .selector-header::after {
            background: linear-gradient(90deg, var(--neon-cyan), transparent);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .option-item {
            text-align: center;
        }

        .option-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: var(--neon-gold);
            margin-bottom: 12px;
            letter-spacing: 2px;
            display: block;
        }

        .option-button {
            display: block;
            width: 100%;
            padding: 12px 15px;
            background: var(--dark-bg);
            border: 2px solid var(--dark-border);
            border-radius: 8px;
            color: #ccc;
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .option-button:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }

        .option-button.active {
            border-color: var(--neon-gold);
            color: var(--neon-gold);
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
            background: rgba(255,215,0,0.05);
        }

        .option-button.active::after {
            content: '✓';
            position: absolute; right: 10px; top: 50%;
            transform: translateY(-50%);
            color: var(--neon-gold);
            font-family: 'Orbitron', sans-serif;
        }

        .option-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--dark-bg);
            border: 1px solid var(--dark-border);
            border-radius: 4px;
            color: var(--neon-cyan);
            font-family: 'Noto Serif SC', serif;
            font-size: 12px;
            margin-top: 8px;
            transition: all 0.3s ease;
        }

        .option-input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }

        .custom-input-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .custom-input-group {
            position: relative;
        }

        .custom-input-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: var(--neon-gold);
            margin-bottom: 10px;
            letter-spacing: 2px;
            display: block;
        }

        .custom-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: var(--dark-bg);
            border: 2px solid var(--dark-border);
            border-radius: 8px;
            color: var(--neon-gold);
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }

        .random-btn {
            position: absolute;
            right: 8px; top: 50%;
            transform: translateY(-50%);
            padding: 6px 10px;
            background: rgba(191,0,255,0.2);
            border: 1px solid var(--neon-purple);
            border-radius: 4px;
            color: var(--neon-purple);
            font-size: 12px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s ease;
        }

        .random-btn:hover {
            background: rgba(191,0,255,0.4);
            box-shadow: 0 0 15px rgba(191,0,255,0.3);
        }

        .toggle-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .toggle-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: var(--neon-cyan);
        }

        .toggle-switch {
            width: 40px; height: 20px;
            background: var(--dark-border);
            border-radius: 10px;
            position: relative;
            transition: all 0.3s ease;
        }

        .toggle-switch::after {
            content: '';
            position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px;
            background: #888;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .toggle-item.active .toggle-switch {
            background: var(--neon-purple);
        }

        .toggle-item.active .toggle-switch::after {
            left: 22px;
            background: #fff;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 15px 40px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            color: #fff;
            box-shadow: 0 0 20px rgba(191,0,255,0.4);
        }

        .btn-generate:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(191,0,255,0.6);
        }

        .btn-random-all {
            background: rgba(0,255,255,0.1);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .btn-random-all:hover {
            background: rgba(0,255,255,0.2);
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }

        .btn-clear {
            background: rgba(255,0,0,0.1);
            border: 2px solid rgba(255,0,0,0.3);
            color: #ff6666;
        }

        .btn-clear:hover {
            background: rgba(255,0,0,0.2);
            box-shadow: 0 0 20px rgba(255,0,0,0.2);
        }

        .result-section {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px;
            align-items: start;
        }

        .cyber-character {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            position: sticky;
            top: 20px;
        }

        .cyber-character-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: var(--neon-purple);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .character-stage {
            width: 140px; height: 200px;
            margin: 0 auto;
            position: relative;
            background: rgba(0,255,255,0.03);
            border: 1px solid rgba(0,255,255,0.1);
            border-radius: 8px;
        }

        .pixel-person {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .person-head {
            width: 20px; height: 20px;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            margin: 0 auto;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .person-body {
            width: 16px; height: 24px;
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            margin: 4px auto 0;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .person-arm {
            width: 6px; height: 20px;
            background: var(--neon-cyan);
            position: absolute;
            top: 24px;
            box-shadow: 0 0 8px var(--neon-cyan);
            transition: transform 0.5s ease;
        }

        .arm-left {
            left: 42px;
            transform-origin: top center;
        }

        .arm-right {
            right: 42px;
            transform-origin: top center;
        }

        .person-leg {
            width: 6px; height: 20px;
            background: var(--neon-cyan);
            position: absolute;
            bottom: 10px;
            box-shadow: 0 0 8px var(--neon-cyan);
            transition: transform 0.5s ease;
        }

        .leg-left {
            left: 52px;
            transform-origin: top center;
        }

        .leg-right {
            right: 52px;
            transform-origin: top center;
        }

        .pose-jianzhi .arm-left { animation: jianzhi-left 3s ease-in-out infinite; }
        .pose-jianzhi .arm-right { animation: jianzhi-right 3s ease-in-out infinite; }

        @keyframes jianzhi-left {
            0%, 100% { transform: rotate(-45deg); }
            50% { transform: rotate(-60deg) translateX(3px); }
        }
        @keyframes jianzhi-right {
            0%, 100% { transform: rotate(45deg); }
            50% { transform: rotate(60deg) translateX(-3px); }
        }

        .pose-jieyin .arm-left { animation: jieyin-left 4s ease-in-out infinite; }
        .pose-jieyin .arm-right { animation: jieyin-right 4s ease-in-out infinite; }

        @keyframes jieyin-left {
            0%, 100% { transform: rotate(-30deg) translateY(-5px); }
            25% { transform: rotate(-20deg) translateY(-10px); }
            50% { transform: rotate(-30deg) translateY(-5px); }
            75% { transform: rotate(-40deg) translateY(-8px); }
        }
        @keyframes jieyin-right {
            0%, 100% { transform: rotate(30deg) translateY(-5px); }
            25% { transform: rotate(20deg) translateY(-10px); }
            50% { transform: rotate(30deg) translateY(-5px); }
            75% { transform: rotate(40deg) translateY(-8px); }
        }

        .pose-tuotian .arm-left { animation: tuotian-left 5s ease-in-out infinite; }
        .pose-tuotian .arm-right { animation: tuotian-right 5s ease-in-out infinite; }

        @keyframes tuotian-left {
            0%, 100% { transform: rotate(-10deg) translateY(-15px); }
            50% { transform: rotate(-5deg) translateY(-25px); }
        }
        @keyframes tuotian-right {
            0%, 100% { transform: rotate(10deg) translateY(-15px); }
            50% { transform: rotate(5deg) translateY(-25px); }
        }

        .pose-tuizhang .arm-left { animation: tuizhang-left 3s ease-in-out infinite; }
        .pose-tuizhang .arm-right { animation: tuizhang-right 3s ease-in-out infinite; }

        @keyframes tuizhang-left {
            0%, 100% { transform: rotate(-20deg) translateY(5px); }
            50% { transform: rotate(-30deg) translateY(15px); }
        }
        @keyframes tuizhang-right {
            0%, 100% { transform: rotate(20deg) translateY(5px); }
            50% { transform: rotate(30deg) translateY(15px); }
        }

        .pose-quan .arm-left { animation: quan-left 2s ease-in-out infinite; }
        .pose-quan .arm-right { animation: quan-right 2s ease-in-out infinite; }
        .pose-quan .leg-left { animation: quan-leg 2s ease-in-out infinite; }
        .pose-quan .leg-right { animation: quan-leg 2s ease-in-out infinite 0.5s; }

        @keyframes quan-left {
            0%, 100% { transform: rotate(30deg); }
            50% { transform: rotate(50deg) translateX(5px); }
        }
        @keyframes quan-right {
            0%, 100% { transform: rotate(-30deg); }
            50% { transform: rotate(-50deg) translateX(-5px); }
        }
        @keyframes quan-leg {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-5deg); }
        }

        .pose-qiajue .arm-left { animation: qiajue-left 4s ease-in-out infinite; }
        .pose-qiajue .arm-right { animation: qiajue-right 4s ease-in-out infinite; }

        @keyframes qiajue-left {
            0%, 100% { transform: rotate(-60deg); }
            33% { transform: rotate(-50deg) translateY(-3px); }
            66% { transform: rotate(-70deg) translateY(3px); }
        }
        @keyframes qiajue-right {
            0%, 100% { transform: rotate(60deg) translateY(-5px); }
            33% { transform: rotate(50deg) translateY(-8px); }
            66% { transform: rotate(70deg) translateY(-2px); }
        }

        .pose-heshi .arm-left { animation: heshi-left 5s ease-in-out infinite; }
        .pose-heshi .arm-right { animation: heshi-right 5s ease-in-out infinite; }

        @keyframes heshi-left {
            0%, 100% { transform: rotate(30deg) translateY(-10px); }
            50% { transform: rotate(25deg) translateY(-15px); }
        }
        @keyframes heshi-right {
            0%, 100% { transform: rotate(-30deg) translateY(-10px); }
            50% { transform: rotate(-25deg) translateY(-15px); }
        }

        .pose-zhitian .arm-left { animation: zhitian-left 3s ease-in-out infinite; }
        .pose-zhitian .arm-right { animation: zhitian-right 3s ease-in-out infinite; }

        @keyframes zhitian-left {
            0%, 100% { transform: rotate(-80deg); }
            50% { transform: rotate(-90deg) translateY(-5px); }
        }
        @keyframes zhitian-right {
            0%, 100% { transform: rotate(45deg); }
            50% { transform: rotate(30deg) translateY(5px); }
        }

        .pose-dance .arm-left { animation: dance-arm-left 1.5s ease-in-out infinite; }
        .pose-dance .arm-right { animation: dance-arm-right 1.5s ease-in-out infinite; }
        .pose-dance .leg-left { animation: dance-leg 1.5s ease-in-out infinite; }
        .pose-dance .leg-right { animation: dance-leg 1.5s ease-in-out infinite 0.75s; }

        @keyframes dance-arm-left {
            0%, 100% { transform: rotate(-30deg); }
            50% { transform: rotate(30deg); }
        }

        function renderResults(mantraData, effectDesc) {
            let resultHtml = '<div class="results-container">';

                let contentHtml = '';
                data.content.forEach(section => {
                    contentHtml += `
                        <div class="mantra-section">
                            <div class="mantra-section-label">${section.title}</div>
                            <div class="mantra-section-content">
                                ${section.content.map(line => `<p>${line}</p>`).join('')}
                            </div>
                        </div>
                    `;
                });
                
                resultHtml += `
                    <div class="result-card" onclick="selectResult(this)">
                        <div class="result-number">${index + 1}</div>
                        <div class="mantra-card-title">《${data.title}》</div>
                        ${contentHtml}
                        <div class="mantra-details">
                            <div class="mantra-detail-row">
                                <span class="mantra-detail-label">类型：</span>
                                <span class="mantra-detail-value">${data.type}</span>
                            </div>
                            <div class="mantra-detail-row">
                                <span class="mantra-detail-label">核心功能：</span>
                                <span class="mantra-detail-value">${data.coreFunc}</span>
                            </div>
                            <div class="mantra-detail-row">
                                <span class="mantra-detail-label">风格：</span>
                                <span class="mantra-detail-value">${data.style}</span>
                            </div>
                            <div class="mantra-detail-row">
                                <span class="mantra-detail-label">代价：</span>
                                <span class="mantra-detail-value">${data.cost}</span>
                            </div>
                        </div>
                        <div class="mantra-review">
                            <strong>点评：</strong>${data.review}

                `;
            });
            
            resultHtml += '</div>';
            
            if (effectDesc) {
                resultHtml += `<div class="effect-desc">效果：${effectDesc}</div>`;
            }

            document.getElementById('mantraResult').innerHTML = resultHtml;
        }

        function selectResult(card) {
            document.querySelectorAll('.result-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');

                id: Date.now(),
                mantras: mantras,
                element: element,
                realm: realm,
                skillType: skillType,
                style: style,
                time: new Date().toLocaleString()
            };
            historyRecords.unshift(record);
            if (historyRecords.length > 10) {
                historyRecords.pop();
            }
            renderHistory();
        }

        function renderHistory() {
            const historyEl = document.getElementById('historyList');
            if (historyRecords.length === 0) {
                historyEl.innerHTML = '<div class="history-empty">暂无历史记录</div>';
                return;
            }
            
            let html = '';
            historyRecords.forEach(record => {
                const title = record.mantras[0] && record.mantras[0].title ? record.mantras[0].title : '未知功法';
                const preview = title.substring(0, 20);
                html += `
                    <div class="history-item" onclick="loadHistory(${record.id})">
                        <div class="history-time">${record.time}</div>
                        <div class="history-preview">《${preview}》</div>
                        <div class="history-tags">
                            ${record.element ? `<span>${record.element}</span>` : ''}
                            ${record.realm ? `<span>${record.realm}</span>` : ''}
                            ${record.skillType ? `<span>${record.skillType}</span>` : ''}
                        </div>
                    </div>
                `;
            });
            historyEl.innerHTML = html;
        }

        function loadHistory(id) {
            const record = historyRecords.find(r => r.id === id);
            if (record) {
                renderResults(record.mantras, '');
                const resultSection = document.getElementById('mantraResult');
                if (resultSection) {
                    resultSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function clearHistory() {
            historyRecords = [];
            renderHistory();
        }

        function generateMantra() {
            const skillName = document.getElementById('skillName').value;
            const keywords = document.getElementById('keywords').value.split(',').map(k => k.trim()).filter(k => k);
            const effectDesc = document.getElementById('effectDesc').value;

            const element = selectedOptions.element;
            const realm = selectedOptions.realm;
            const skillType = selectedOptions.skillType;
            const target = selectedOptions.target;
            const purpose = selectedOptions.purpose;
            const cost = selectedOptions.cost;
            const style = selectedOptions.style;

            let fragmentPool = { ...fragments };
            
            if (style === '仙气') {
                fragmentPool.opening = [...fragmentPool.opening, '仙气缭绕', '瑞气千条', '霞光万道', '云蒸霞蔚'];
                fragmentPool.ending = [...fragmentPool.ending, '羽化登仙', '超凡脱俗', '飘然欲仙'];
            } else if (style === '魔气') {
                fragmentPool.opening = [...fragmentPool.opening, '魔气滔天', '血雨腥风', '九幽炼狱', '修罗降世'];
                fragmentPool.ending = [...fragmentPool.ending, '魔焰滔天', '万劫不复', '永堕轮回'];
            } else if (style === '古拙') {
                fragmentPool.opening = [...fragmentPool.opening, '盘古开天', '女娲造人', '三皇治世', '五帝定伦'];
                fragmentPool.ending = [...fragmentPool.ending, '亘古长存', '源远流长', '历久弥新'];
            } else if (style === '霸道') {
                fragmentPool.opening = [...fragmentPool.opening, '唯我独尊', '天下无敌', '霸气外露', '横扫千军'];
                fragmentPool.ending = [...fragmentPool.ending, '威震寰宇', '雄霸天下', '唯吾独尊'];
            } else if (style === '温婉') {
                fragmentPool.opening = [...fragmentPool.opening, '柔情似水', '温婉如玉', '春风化雨', '润物无声'];
                fragmentPool.ending = [...fragmentPool.ending, '柔情万种', '温婉动人', '柔情似水'];
            } else if (style === '诡谲') {
                fragmentPool.opening = [...fragmentPool.opening, '诡异莫测', '变幻无常', '神出鬼没', '鬼斧神工'];
                fragmentPool.ending = [...fragmentPool.ending, '神秘莫测', '变幻无穷', '鬼使神差'];
            }

            const mantraData = [];
            for (let i = 0; i < 1; i++) {
                const title = skillName || generateSkillTitle(style, skillType, element);
                const content = generateMantraContent(fragmentPool, style, skillType, element);
                
                const totalOutline = content.length > 0 ? content[0].content.join('') : '';
                
                const typeDesc = generateTypeDesc(skillType, purpose, element);
                const coreFunc = generateCoreFunc(skillType, purpose, element);
                const styleDesc = generateStyleDesc(style, skillType);
                const costDesc = generateCostDesc(cost, style, skillType);

                const mantra = {
                    title: title,
                    totalOutline: totalOutline,
                    content: content,
                    type: typeDesc,
                    coreFunc: coreFunc,
                    style: styleDesc,
                    cost: costDesc
                };

                const review = generateReview(mantra);
                mantra.review = review;

                mantraData.push(mantra);
            }

            renderResults(mantraData, effectDesc);
            addToHistory(mantraData, element, realm, skillType, style);

            if (showGesture && skillType) {
                updatePose();
            }
        }

        function copyMantra() {
            const text = document.getElementById('mantraResult').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✓ 已复制';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 复制口诀';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        document.getElementById('protagonistName').addEventListener('input', function() {
            if (autoFillEnabled) {
                autoFillFromName();
            }
        });

        initParticles();
    </script>
</body>
</html>
