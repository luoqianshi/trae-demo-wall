<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>顺毛 - 让聊天更轻松</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="demo-page">
        <div class="demo-bg-decoration">
            <div class="demo-circle demo-circle-1"></div>
            <div class="demo-circle demo-circle-2"></div>
            <div class="demo-circle demo-circle-3"></div>
        </div>
        <div class="demo-title-area">
            <h2 class="demo-title">顺毛</h2>
            <p class="demo-subtitle">让对话更有温度</p>
        </div>
        <div class="phone-frame">
            <div class="phone-body">
                <div class="phone-notch">
                    <div class="notch-camera"></div>
                    <div class="notch-speaker"></div>
                </div>
                <div class="phone-screen">
                    <div class="phone-status-bar">
                        <span class="status-time">9:41</span>
                        <div class="status-icons">
                            <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 8.5C1 8.5 3.5 11 8 11C12.5 11 15 8.5 15 8.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/><path d="M3.5 6C3.5 6 5 7.5 8 7.5C11 7.5 12.5 6 12.5 6" stroke="white" stroke-width="1.5" stroke-linecap="round"/><path d="M6 3.5C6 3.5 7 4 8 4C9 4 10 3.5 10 3.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="1.5" r="1" fill="white"/></svg>
                            <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="1" y="3" width="3" height="9" rx="0.5" fill="white"/><rect x="5" y="2" width="3" height="10" rx="0.5" fill="white"/><rect x="9" y="0.5" width="3" height="11.5" rx="0.5" fill="white"/><rect x="13" y="0" width="2.5" height="12" rx="0.5" fill="white" opacity="0.3"/></svg>
                            <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="15" height="7" rx="1" fill="white"/><path d="M22 4V8C22.5 7.5 22.5 4.5 22 4Z" fill="white" opacity="0.4"/></svg>
                        </div>
                    </div>
                    <div class="app-container">
        <header class="app-header">
            <div class="header-bg">
                <div class="header-cloud cloud-1"></div>
                <div class="header-cloud cloud-2"></div>
                <div class="header-cloud cloud-3"></div>
                <div class="header-hills">
                    <svg viewBox="0 0 390 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 50 Q60 20 130 45 Q200 70 260 35 Q320 10 390 40 L390 80 L0 80 Z" fill="#C5D4C5" opacity="0.5"/>
                        <path d="M0 60 Q80 35 160 55 Q240 75 320 45 Q360 30 390 50 L390 80 L0 80 Z" fill="#B5C8B5" opacity="0.6"/>
                    </svg>
                </div>
            </div>
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <svg viewBox="0 0 80 80" fill="none">
                            <circle cx="40" cy="40" r="36" fill="white" opacity="0.6"/>
                            <circle cx="40" cy="40" r="30" fill="#F5F3F0"/>
                            <path d="M40 20 C30 28, 22 32, 22 42 C22 52, 30 58, 40 58 C50 58, 58 52, 58 42 C58 32, 50 28, 40 20" fill="#B4A5A5"/>
                            <path d="M28 30 L24 18 L34 26 Z" fill="#B4A5A5"/>
                            <path d="M52 30 L56 18 L46 26 Z" fill="#B4A5A5"/>
                            <path d="M29 28 L27 22 L32 26 Z" fill="#E8D4D4"/>
                            <path d="M51 28 L53 22 L48 26 Z" fill="#E8D4D4"/>
                            <circle cx="33" cy="40" r="2.5" fill="#5C5552"/>
                            <circle cx="47" cy="40" r="2.5" fill="#5C5552"/>
                            <path d="M36 46 Q40 49 44 46" stroke="#5C5552" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                            <path d="M40 43 L38 46 L42 46 Z" fill="#5C5552"/>
                        </svg>
                    </div>
                    <h1 class="app-title">顺毛</h1>
                    <p class="app-subtitle">让对话更有温度</p>
                </div>
                <div class="illustration">
                    <div class="illu-windmill">
                        <svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
                            <rect x="27" y="35" width="6" height="50" rx="2" fill="#D4CCC4"/>
                            <rect x="27" y="35" width="6" height="50" rx="2" fill="none" stroke="#B4A5A5" stroke-width="1"/>
                            <g class="windmill-blades" style="transform-origin: 30px 35px">
                                <path d="M30 35 L30 8 Q34 12 33 20 Q32 28 30 35 Z" fill="#E8E4C5" stroke="#C8C0B0" stroke-width="0.8"/>
                                <path d="M30 35 L52 30 Q48 35 42 36 Q35 37 30 35 Z" fill="#E8D4D4" stroke="#D4B4B4" stroke-width="0.8"/>
                                <path d="M30 35 L30 62 Q26 58 27 50 Q28 42 30 35 Z" fill="#C5D5E4" stroke="#A8C0D4" stroke-width="0.8"/>
                                <path d="M30 35 L8 40 Q12 35 18 34 Q25 33 30 35 Z" fill="#C5D4C5" stroke="#A8C0A8" stroke-width="0.8"/>
                            </g>
                            <circle cx="30" cy="35" r="3" fill="#8B7355"/>
                        </svg>
                    </div>
                    <div class="illu-balloon">
                        <svg viewBox="0 0 50 75" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="25" cy="25" rx="20" ry="22" fill="#E8D4D4"/>
                            <ellipse cx="25" cy="25" rx="20" ry="22" fill="none" stroke="#D4B4B4" stroke-width="1"/>
                            <path d="M25 3 Q15 25 25 47" fill="none" stroke="#D4B4B4" stroke-width="0.8" opacity="0.5"/>
                            <path d="M25 3 Q35 25 25 47" fill="none" stroke="#D4B4B4" stroke-width="0.8" opacity="0.5"/>
                            <ellipse cx="18" cy="18" rx="5" ry="7" fill="white" opacity="0.4"/>
                            <line x1="18" y1="47" x2="18" y2="56" stroke="#B4A5A5" stroke-width="1"/>
                            <line x1="32" y1="47" x2="32" y2="56" stroke="#B4A5A5" stroke-width="1"/>
                            <rect x="15" y="56" width="20" height="12" rx="2" fill="#E8D4B5" stroke="#D4B495" stroke-width="0.8"/>
                        </svg>
                    </div>
                    <div class="illu-tree illu-tree-1">
                        <svg viewBox="0 0 55 80" xmlns="http://www.w3.org/2000/svg">
                            <rect x="25" y="50" width="6" height="25" rx="1" fill="#A08866"/>
                            <ellipse cx="28" cy="40" rx="22" ry="24" fill="#C5D4C5"/>
                            <ellipse cx="28" cy="40" rx="22" ry="24" fill="none" stroke="#A8C0A8" stroke-width="1" opacity="0.5"/>
                            <ellipse cx="20" cy="32" rx="8" ry="10" fill="#D4E0D4" opacity="0.5"/>
                            <circle cx="35" cy="45" r="4" fill="#D4E0D4" opacity="0.4"/>
                        </svg>
                    </div>
                    <div class="illu-tree illu-tree-2">
                        <svg viewBox="0 0 45 65" xmlns="http://www.w3.org/2000/svg">
                            <rect x="20" y="40" width="5" height="20" rx="1" fill="#A08866"/>
                            <ellipse cx="22" cy="32" rx="18" ry="20" fill="#B8C8B8"/>
                            <ellipse cx="22" cy="32" rx="18" ry="20" fill="none" stroke="#A0B8A0" stroke-width="1" opacity="0.5"/>
                            <ellipse cx="16" cy="26" rx="6" ry="8" fill="#C8D8C8" opacity="0.5"/>
                        </svg>
                    </div>
                    <div class="illu-flower illu-flower-1">
                        <svg viewBox="0 0 20 25" xmlns="http://www.w3.org/2000/svg">
                            <line x1="10" y1="25" x2="10" y2="15" stroke="#A0B8A0" stroke-width="1.2"/>
                            <circle cx="10" cy="10" r="3" fill="#E8E4C5"/>
                            <circle cx="5" cy="12" r="3" fill="#E8D4D4"/>
                            <circle cx="15" cy="12" r="3" fill="#E8D4D4"/>
                            <circle cx="7" cy="7" r="3" fill="#E8D4B5"/>
                            <circle cx="13" cy="7" r="3" fill="#E8D4B5"/>
                            <circle cx="10" cy="10" r="2" fill="#D4A444"/>
                        </svg>
                    </div>
                    <div class="illu-flower illu-flower-2">
                        <svg viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                            <line x1="8" y1="20" x2="8" y2="12" stroke="#A0B8A0" stroke-width="1"/>
                            <circle cx="8" cy="8" r="2.5" fill="#E8D4D4"/>
                            <circle cx="4" cy="10" r="2.5" fill="#E8E4C5"/>
                            <circle cx="12" cy="10" r="2.5" fill="#E8E4C5"/>
                            <circle cx="6" cy="6" r="2.5" fill="#E8D4B5"/>
                            <circle cx="10" cy="6" r="2.5" fill="#E8D4B5"/>
                            <circle cx="8" cy="8" r="1.5" fill="#D4A444"/>
                        </svg>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="step-section" id="step-1">
                <div class="step-header">
                    <div class="step-number">1</div>
                    <h2>定义关系</h2>
                    <p class="step-desc">选择或自定义你们的关系</p>
                </div>
                <div class="relation-grid">
                    <button class="relation-card" data-relation="上下级">
                        <div class="relation-icon boss"></div>
                        <span>上下级</span>
                    </button>
                    <button class="relation-card" data-relation="情侣">
                        <div class="relation-icon couple"></div>
                        <span>情侣</span>
                    </button>
                    <button class="relation-card" data-relation="兄弟">
                        <div class="relation-icon brother"></div>
                        <span>兄弟</span>
                    </button>
                    <button class="relation-card" data-relation="姐妹">
                        <div class="relation-icon sister"></div>
                        <span>姐妹</span>
                    </button>
                    <button class="relation-card" data-relation="父母">
                        <div class="relation-icon parent"></div>
                        <span>父母</span>
                    </button>
                    <button class="relation-card" data-relation="朋友">
                        <div class="relation-icon friend"></div>
                        <span>朋友</span>
                    </button>
                </div>
                <div class="custom-relation">
                    <input type="text" id="custom-relation" placeholder="自定义关系...">
                    <button class="custom-btn">确认</button>
                </div>
                <div class="selected-relation" id="selected-relation" style="display: none;">
                    <span>已选择：</span>
                    <span class="relation-name"></span>
                </div>
            </div>

            <div class="step-section" id="step-2">
                <div class="step-header">
                    <div class="step-number">2</div>
                    <h2>上传聊天截图</h2>
                    <p class="step-desc">AI帮你读懂事件，分析情绪</p>
                </div>
                <div class="upload-area" id="upload-area">
                    <input type="file" id="upload-input" accept="image/*" hidden>
                    <div class="upload-icon">
                        <svg viewBox="0 0 48 48" fill="none">
                            <circle cx="24" cy="24" r="20" stroke="#B4A5A5" stroke-width="2"/>
                            <path d="M24 16 L24 32 M16 24 L32 24" stroke="#B4A5A5" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <p>点击上传聊天截图</p>
                    <p class="upload-hint">支持 jpg, png, gif</p>
                </div>
                <div class="preview-area" id="preview-area" style="display: none;">
                    <img id="preview-img" src="" alt="预览">
                    <button class="remove-btn" id="remove-img">移除</button>
                </div>
                <div class="analysis-result" id="analysis-result" style="display: none;">
                    <h3>AI分析结果</h3>
                    <div class="emotion-tags">
                        <span class="emotion-tag" id="emotion-tag-1">😊</span>
                        <span class="emotion-tag" id="emotion-tag-2">🤔</span>
                        <span class="emotion-tag" id="emotion-tag-3">💬</span>
                    </div>
                    <p class="analysis-text" id="analysis-text">对方似乎有些困惑，需要你更耐心地解释...</p>
                </div>
            </div>

            <div class="step-section" id="step-3">
                <div class="step-header">
                    <div class="step-number">3</div>
                    <h2>真实想法</h2>
                    <p class="step-desc">输入你想表达的真实想法</p>
                </div>
                <textarea id="real-thought" placeholder="比如：其实我觉得这个方案不太好，但是不知道怎么开口..."></textarea>
            </div>

            <div class="step-section" id="step-4">
                <div class="step-header">
                    <div class="step-number">4</div>
                    <h2>生成回答</h2>
                    <p class="step-desc">选择风格，生成多种回答</p>
                </div>
                <div class="style-tabs">
                    <button class="style-tab active" data-style="温柔">温柔</button>
                    <button class="style-tab" data-style="搞笑">搞笑</button>
                    <button class="style-tab" data-style="诚恳">诚恳</button>
                    <button class="style-tab" data-style="委婉">委婉</button>
                </div>
                <div class="answer-list" id="answer-list">
                    <div class="answer-card">
                        <p class="answer-text">别担心，我理解你的想法。或许我们可以换一种方式来沟通？</p>
                        <button class="copy-btn" data-text="别担心，我理解你的想法。或许我们可以换一种方式来沟通？">复制</button>
                    </div>
                    <div class="answer-card">
                        <p class="answer-text">嗯嗯，我明白你的意思了，我们慢慢商量～</p>
                        <button class="copy-btn" data-text="嗯嗯，我明白你的意思了，我们慢慢商量～">复制</button>
                    </div>
                    <div class="answer-card">
                        <p class="answer-text">我觉得你的想法很有道理，我们可以试试看！</p>
                        <button class="copy-btn" data-text="我觉得你的想法很有道理，我们可以试试看！">复制</button>
                    </div>
                </div>
            </div>

            <div class="step-section" id="step-5">
                <div class="step-header">
                    <div class="step-number">5</div>
                    <h2>生成表情包</h2>
                    <p class="step-desc">文字是坚硬的，表情包是对话的缓和</p>
                </div>
                <div class="pet-selector">
                    <button class="pet-btn cat-btn active" data-pet="cat">
                        <div class="pet-preview" id="cat-preview"></div>
                        <div class="pet-info">
                            <span class="pet-label">高冷猫</span>
                            <span class="pet-desc">黑白插画 · 高冷系</span>
                        </div>
                    </button>
                    <button class="pet-btn dog-btn" data-pet="dog">
                        <div class="pet-preview" id="dog-preview"></div>
                        <div class="pet-info">
                            <span class="pet-label">暖萌狗</span>
                            <span class="pet-desc">暖橙插画 · 热情系</span>
                        </div>
                    </button>
                </div>
                <div class="emoji-grid" id="emoji-grid"></div>
            </div>
        </main>

        <footer class="app-footer">
            <button class="generate-btn" id="generate-btn">一键生成</button>
        </footer>

                    <div class="toast" id="toast"></div>
                </div>
                <div class="phone-home-indicator"></div>
            </div>
            <div class="phone-btn phone-btn-right"></div>
            <div class="phone-btn phone-btn-left-1"></div>
            <div class="phone-btn phone-btn-left-2"></div>
            <div class="phone-btn phone-btn-left-3"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
