<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能学习便签 - Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90D9;
            --primary-dark: #3A7BC8;
            --primary-light: #E8F1FB;
            --accent: #FF6B6B;
            --success: #2ECC71;
            --success-light: #E8F8EF;
            --warning: #F39C12;
            --warning-light: #FEF5E7;
            --purple: #9B59B6;
            --purple-light: #F4ECF7;
            --bg: #F0F4F8;
            --bg-card: #FFFFFF;
            --text-primary: #2C3E50;
            --text-secondary: #6B7C8D;
            --text-light: #95A5A6;
            --border: #E4E9F0;
            --shadow-sm: 0 2px 8px rgba(74, 144, 217, 0.06);
            --shadow: 0 4px 20px rgba(74, 144, 217, 0.1);
            --shadow-hover: 0 8px 30px rgba(74, 144, 217, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --sidebar-w: 240px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow: hidden;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: var(--transition);
        }

        .sidebar-header {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, #67B26F 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .sidebar-subtitle {
            font-size: 0.7rem;
            color: var(--text-light);
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
        }

        .nav-section-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 12px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
            margin-bottom: 2px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.3);
        }

        .nav-item .nav-icon { font-size: 1.2rem; width: 24px; text-align: center; flex-shrink: 0; }
        .nav-item .nav-badge {
            margin-left: auto;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
        }
        .nav-item.active .nav-badge { background: rgba(255,255,255,0.25); }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-light);
        }

        /* ===== 主内容区 ===== */
        .main {
            margin-left: var(--sidebar-w);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .topbar-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .topbar-actions { display: flex; gap: 12px; align-items: center; }

        .search-box {
            position: relative;
            width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            background: var(--bg);
            transition: var(--transition);
            font-family: inherit;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.1);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.5;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(74, 144, 217, 0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(74, 144, 217, 0.4); }

        .btn-ghost {
            background: var(--bg);
            color: var(--text-secondary);
        }
        .btn-ghost:hover { background: var(--primary-light); color: var(--primary); }

        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, #27AE60 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(46, 204, 113, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning) 0%, #E67E22 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent) 0%, #E74C3C 100%);
            color: white;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
        }

        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-track { background: transparent; }
        .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ===== 页面切换 ===== */
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 仪表盘 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: var(--transition);
            border: 1px solid var(--border);
        }

        .stat-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); }

        .stat-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .stat-info { flex: 1; min-width: 0; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }
        .stat-trend { font-size: 0.7rem; margin-top: 6px; font-weight: 600; }
        .stat-trend.up { color: var(--success); }
        .stat-trend.down { color: var(--accent); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-link {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .panel-link:hover { text-decoration: underline; }

        /* 复习列表 */
        .review-list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
            margin-bottom: 8px;
        }

        .review-list-item:hover { background: var(--primary-light); border-color: var(--primary); }

        .review-tag {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .review-info { flex: 1; min-width: 0; }
        .review-title { font-weight: 600; font-size: 0.9rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .review-meta { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }

        .review-due {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .review-due.now { background: var(--accent); color: white; }
        .review-due.soon { background: var(--warning-light); color: var(--warning); }
        .review-due.later { background: var(--success-light); color: var(--success); }

        /* 学习活动 */
        .activity-chart {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 140px;
            padding: 10px 0;
        }

        .activity-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            height: 100%;
            justify-content: flex-end;
        }

        .activity-bar {
            width: 100%;
            max-width: 32px;
            background: linear-gradient(180deg, var(--primary) 0%, #67B26F 100%);
            border-radius: 6px 6px 0 0;
            transition: height 0.6s ease;
            min-height: 4px;
            position: relative;
        }

        .activity-bar:hover { filter: brightness(1.1); }

        .activity-bar-label { font-size: 0.65rem; color: var(--text-light); }

        /* 分类分布 */
        .category-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .category-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .category-name { font-size: 0.85rem; font-weight: 500; width: 60px; }
        .category-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .category-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
        .category-count { font-size: 0.8rem; color: var(--text-secondary); width: 30px; text-align: right; font-weight: 600; }

        /* ===== 笔记编辑 ===== */
        .note-editor {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            max-width: 800px;
        }

        .form-group { margin-bottom: 24px; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: inherit;
            transition: var(--transition);
            background: var(--bg);
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.1);
        }

        .form-textarea { min-height: 160px; resize: vertical; line-height: 1.7; }

        .ai-result {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--success-light) 100%);
            border: 1px solid rgba(74, 144, 217, 0.2);
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-top: 16px;
            display: none;
        }

        .ai-result.show { display: block; animation: fadeIn 0.4s ease; }

        .ai-result-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .ai-result-body { display: flex; flex-wrap: wrap; gap: 12px; }

        .ai-field {
            background: white;
            padding: 10px 14px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
        }

        .ai-field-label { font-size: 0.7rem; color: var(--text-light); margin-bottom: 2px; }
        .ai-field-value { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }

        .keyword-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

        .keyword-tag {
            background: var(--primary);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .editor-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        /* ===== 知识库列表 ===== */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-chip {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .filter-chip:hover { border-color: var(--primary); color: var(--primary); }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .note-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .note-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--primary);
        }

        .note-item:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); }

        .note-item-tag {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .note-item-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .note-item-excerpt {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .note-item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--text-light);
        }

        .note-item-keywords { display: flex; gap: 4px; flex-wrap: wrap; }
        .note-item-keyword { background: var(--bg); padding: 2px 8px; border-radius: 8px; color: var(--text-secondary); }

        .mastery-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 600;
        }
        .mastery-low { background: #FDECEC; color: var(--accent); }
        .mastery-mid { background: var(--warning-light); color: var(--warning); }
        .mastery-high { background: var(--success-light); color: var(--success); }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-light);
        }
        .empty-state-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.3; }
        .empty-state-text { font-size: 0.95rem; margin-bottom: 16px; }

        /* ===== 复习卡片 ===== */
        .review-container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .review-progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .review-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--success) 100%);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .review-card-wrap {
            width: 100%;
            perspective: 1200px;
            margin-bottom: 32px;
        }

        .review-card {
            width: 100%;
            min-height: 320px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .review-card.flipped { transform: rotateY(180deg); }

        .review-card-face {
            position: absolute;
            width: 100%;
            min-height: 320px;
            backface-visibility: hidden;
            border-radius: var(--radius);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .review-card-front { background: var(--bg-card); }
        .review-card-back {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--success-light) 100%);
            transform: rotateY(180deg);
        }

        .review-card-category {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .review-card-question {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .review-card-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 20px;
        }

        .review-card-answer {
            font-size: 1rem;
            color: var(--text-primary);
            text-align: center;
            line-height: 1.8;
        }

        .review-rating-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .rating-btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 90px;
        }
        .rating-btn:hover { transform: translateY(-2px); }
        .rating-btn .rating-label { font-size: 0.7rem; opacity: 0.8; }

        .rating-again { background: #FDECEC; color: var(--accent); }
        .rating-hard { background: var(--warning-light); color: var(--warning); }
        .rating-good { background: var(--primary-light); color: var(--primary); }
        .rating-easy { background: var(--success-light); color: var(--success); }

        .review-complete {
            text-align: center;
            padding: 60px;
        }
        .review-complete-icon { font-size: 4rem; margin-bottom: 16px; }
        .review-complete-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        .review-complete-desc { color: var(--text-secondary); margin-bottom: 24px; }

        /* ===== 知识图谱 ===== */
        .graph-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .graph-svg {
            width: 100%;
            height: 520px;
            display: block;
        }

        .graph-node {
            cursor: pointer;
            transition: var(--transition);
        }
        .graph-node:hover { filter: brightness(1.2); }

        .graph-node-circle {
            transition: var(--transition);
        }
        .graph-node:hover .graph-node-circle { r: 28; }

        .graph-node-label {
            font-size: 11px;
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
            fill: var(--text-primary);
        }

        .graph-edge {
            stroke: var(--border);
            stroke-width: 2;
            fill: none;
            transition: var(--transition);
        }

        .graph-legend {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            flex-wrap: wrap;

            display: flex;

            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);

        .graph-info-panel {
            position: absolute;
            top: 24px;
            right: 24px;

            border-radius: var(--radius-sm);

        .graph-info-meta { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 4px; }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: var(--text-primary);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-sm);

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(44, 62, 80, 0.5);

            z-index: 2000;
            display: none;
            align-items: center;

        /* ===== 响应式 ===== */

    <script>
        // ===== 数据层 =====
        const STORAGE_KEY = 'smart_study_notes_v1';

        const CATEGORY_META = {
            concept: { label: '概念定义', icon: '📘', color: '#4A90D9', bg: '#E8F1FB' },
            formula: { label: '公式定理', icon: '🔢', color: '#2ECC71', bg: '#E8F8EF' },
            case: { label: '案例分析', icon: '📌', color: '#FF6B6B', bg: '#FDECEC' },
            thinking: { label: '思考总结', icon: '💡', color: '#9B59B6', bg: '#F4ECF7' }
        };

        // 简易AI分类规则
        const AI_RULES = {
            formula: { keywords: ['公式', '定理', '等于', '方程', '计算', '推导', '证明', '=', '∑', '∫', 'Δ', 'sin', 'cos', 'log'], difficulty: '高' },
            concept: { keywords: ['定义', '概念', '是指', '是指', '本质', '特征', '分类', '原理', '是什么', '什么是'], difficulty: '中' },
            case: { keywords: ['例子', '案例', '例如', '比如', '实例', '应用', '实际', '故事', '发生了'], difficulty: '中' },
            thinking: { keywords: ['认为', '思考', '理解', '感悟', '总结', '启发', '反思', '观点', '想法', '应该'], difficulty: '低' }
        };

        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try { return JSON.parse(raw); } catch(e) {}
            }
            return seedData();
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function seedData() {
            const now = Date.now();
            const day = 86400000;
            const data = {
                notes: [
                    {
                        id: 'n1', title: '牛顿第二定律', content: '物体的加速度与所受合外力成正比，与质量成反比。公式：F=ma，其中F为合外力，m为质量，a为加速度。这是经典力学的核心定律之一。',
                        category: 'formula', keywords: ['牛顿', '加速度', '合外力', '质量', '力学'],
                        difficulty: '高', importance: '核心',
                        createdAt: now - day*5, reviews: 2, mastery: 0.4, nextReview: now - day*0.5, interval: 1, easeFactor: 2.3
                    },
                    {
                        id: 'n2', title: '光合作用', content: '光合作用是指绿色植物利用光能，将二氧化碳和水转化为有机物并释放氧气的过程。方程式：6CO₂+6H₂O→C₆H₁₂O₆+6O₂。分为光反应和暗反应两个阶段。',
                        category: 'concept', keywords: ['光合作用', '光反应', '暗反应', '叶绿体', '氧气'],
                        difficulty: '中', importance: '重要',
                        createdAt: now - day*4, reviews: 1, mastery: 0.3, nextReview: now + day*0.5, interval: 1, easeFactor: 2.5
                    },
                    {
                        id: 'n3', title: '秦始皇统一六国', content: '公元前221年，秦始皇完成统一六国的大业，建立了中国历史上第一个统一的多民族中央集权国家。推行郡县制，统一度量衡、文字和货币。',
                        category: 'case', keywords: ['秦始皇', '统一', '郡县制', '度量衡', '中央集权'],
                        difficulty: '中', importance: '重要',
                        createdAt: now - day*3, reviews: 3, mastery: 0.8, nextReview: now + day*3, interval: 4, easeFactor: 2.6
                    },
                    {
                        id: 'n4', title: '什么是机器学习', content: '机器学习是人工智能的一个分支，它使计算机系统能够从数据中学习并改进，而无需显式编程。核心思想是通过算法分析数据，自动发现模式并做出预测或决策。',
                        category: 'concept', keywords: ['机器学习', '人工智能', '算法', '数据', '模式识别'],
                        difficulty: '高', importance: '核心',
                        createdAt: now - day*2, reviews: 0, mastery: 0, nextReview: now - day*0.2, interval: 1, easeFactor: 2.5
                    },
                    {
                        id: 'n5', title: '勾股定理', content: '在直角三角形中，两条直角边的平方和等于斜边的平方。公式：a²+b²=c²。这是几何学中最基本的定理之一，由古希腊数学家毕达哥拉斯发现。',
                        category: 'formula', keywords: ['勾股定理', '直角三角形', '毕达哥拉斯', '几何'],
                        difficulty: '中', importance: '核心',
                        createdAt: now - day*1, reviews: 1, mastery: 0.6, nextReview: now + day*2, interval: 2, easeFactor: 2.5
                    },
                    {
                        id: 'n6', title: '学习反思：费曼技巧', content: '费曼技巧的核心是用简单的语言向别人解释一个概念。如果你解释不清楚，说明你还没真正理解。这种方法能帮助发现知识盲区，加深理解。我认为这是最高效的学习方法之一。',
                        category: 'thinking', keywords: ['费曼技巧', '学习方法', '理解', '知识盲区'],
                        difficulty: '低', importance: '一般',
                        createdAt: now - day*0.5, reviews: 0, mastery: 0, nextReview: now + day*0.5, interval: 1, easeFactor: 2.5
                    }
                ],
                reviewHistory: [],
                streak: 5,
                lastStudyDate: new Date().toDateString()
            };
            saveData(data);
            return data;
        }

        let appData = loadData();

        // ===== AI 分析 =====
        function aiAnalyze(title, content) {
            const text = (title + ' ' + content).toLowerCase();
            const scores = {};

            for (const [cat, rule] of Object.entries(AI_RULES)) {
                scores[cat] = rule.keywords.reduce((sum, kw) => {
                    return sum + (text.includes(kw.toLowerCase()) ? 1 : 0);
                }, 0);
            }

            let bestCat = 'concept';
            let maxScore = 0;
            for (const [cat, score] of Object.entries(scores)) {
                if (score > maxScore) { maxScore = score; bestCat = cat; }
            }
            if (maxScore === 0) bestCat = 'concept';

            // 提取关键词（简单实现：取较长的中文词组）
            const keywords = extractKeywords(title, content);

            const difficulty = AI_RULES[bestCat].difficulty;
            const importance = maxScore >= 3 ? '核心' : maxScore >= 1 ? '重要' : '一般';

            return { category: bestCat, keywords, difficulty, importance };
        }

        function extractKeywords(title, content) {
            const text = title + ' ' + content;
            // 预设关键词库匹配
            const keywordBank = [
                '牛顿', '加速度', '合外力', '质量', '力学', '光合作用', '光反应', '暗反应', '叶绿体',
                '氧气', '秦始皇', '统一', '郡县制', '度量衡', '中央集权', '机器学习', '人工智能',
                '算法', '数据', '模式识别', '勾股定理', '直角三角形', '毕达哥拉斯', '几何',
                '费曼技巧', '学习方法', '理解', '知识盲区', '公式', '定理', '定义', '概念',
                '案例', '思考', '总结', '能量', '细胞', 'DNA', 'RNA', '蛋白质', '酶',
                '化学反应', '氧化', '还原', '电子', '质子', '中子', '原子', '分子',
                '微积分', '导数', '积分', '函数', '极限', '概率', '统计',
                '历史', '地理', '政治', '经济', '哲学', '逻辑'
            ];
            const found = keywordBank.filter(kw => text.includes(kw));
            // 如果没匹配到，从标题提取
            if (found.length === 0 && title.length > 0) {
                return [title.slice(0, 4)];
            }
            return found.slice(0, 6);
        }

        // ===== SM-2 遗忘曲线算法 =====
        function calculateNextReview(rating, note) {
            // rating: 1=重来 2=困难 3=良好 4=简单
            let { interval, easeFactor, mastery } = note;

            if (rating <= 1) {
                interval = 1;
                easeFactor = Math.max(1.3, easeFactor - 0.2);
                mastery = Math.max(0, mastery - 0.2);
            } else if (rating === 2) {
                interval = Math.max(1, interval);
                easeFactor = Math.max(1.3, easeFactor - 0.15);
                mastery = Math.max(0, Math.min(1, mastery + 0.1));
            } else if (rating === 3) {
                interval = interval === 0 ? 1 : Math.round(interval * easeFactor);
                easeFactor = Math.min(2.8, easeFactor + 0.1);
                mastery = Math.min(1, mastery + 0.2);
            } else {
                interval = interval === 0 ? 2 : Math.round(interval * easeFactor * 1.3);
                easeFactor = Math.min(2.8, easeFactor + 0.15);
                mastery = Math.min(1, mastery + 0.3);
            }

            const nextReview = Date.now() + interval * 86400000;
            return { interval, easeFactor, mastery, nextReview, reviews: note.reviews + 1 };
        }

        // ===== 页面导航 =====
        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById('page-' + page).classList.add('active');
            document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');

            const titles = {
                dashboard: '仪表盘', create: '新建笔记', library: '知识库',
                review: '复习中心', graph: '知识图谱'
            };
            document.getElementById('page-title').textContent = titles[page];

            if (page === 'dashboard') renderDashboard();
            if (page === 'library') renderLibrary();
            if (page === 'review') renderReview();
            if (page === 'graph') renderGraph();
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => navigateTo(item.dataset.page));
        });

        // ===== 仪表盘渲染 =====
        function renderDashboard() {
            const notes = appData.notes;
            const now = Date.now();

            document.getElementById('stat-total').textContent = notes.length;

            const dueReviews = notes.filter(n => n.nextReview <= now);
            document.getElementById('stat-review').textContent = dueReviews.length;
            document.getElementById('review-badge').textContent = dueReviews.length;
            document.getElementById('review-badge').style.display = dueReviews.length > 0 ? '' : 'none';

            const mastered = notes.filter(n => n.mastery >= 0.7).length;
            document.getElementById('stat-mastered').textContent = mastered;

            document.getElementById('stat-streak').textContent = appData.streak;

            // 待复习列表
            const reviewList = document.getElementById('review-list');
            if (dueReviews.length === 0) {
                reviewList.innerHTML = '<div class="empty-state" style="padding:40px"><div class="empty-state-icon">🎉</div><div class="empty-state-text">暂无待复习内容，太棒了！</div></div>';
            } else {
                reviewList.innerHTML = dueReviews.slice(0, 5).map(n => {
                    const meta = CATEGORY_META[n.category];
                    const diff = (n.nextReview - now) / 86400000;
                    const dueClass = diff < 0 ? 'now' : diff < 0.5 ? 'soon' : 'later';
                    const dueText = diff < 0 ? '已逾期' : diff < 0.5 ? '即将到期' : '今天';
                    return `
                        <div class="review-list-item" onclick="navigateTo('review')">
                            <div class="review-tag" style="background:${meta.bg}">${meta.icon}</div>
                            <div class="review-info">
                                <div class="review-title">${n.title}</div>
                                <div class="review-meta">${meta.label} · 复习${n.reviews}次</div>
                            </div>
                            <div class="review-due ${dueClass}">${dueText}</div>
                        </div>
                    `;
                }).join('');
            }

            // 学习活动图表
            const activityChart = document.getElementById('activity-chart');
            const days = ['一','二','三','四','五','六','日'];
            const activities = [3, 5, 2, 7, 4, 6, 3];
            activityChart.innerHTML = activities.map((v, i) => `
                <div class="activity-bar-wrap">
                    <div class="activity-bar" style="height:${v * 18}px" title="${v}条笔记"></div>
                    <div class="activity-bar-label">${days[i]}</div>
                </div>
            `).join('');

            // 分类分布
            const catDist = document.getElementById('category-distribution');
            const counts = {};
            Object.keys(CATEGORY_META).forEach(k => counts[k] = 0);
            notes.forEach(n => counts[n.category] = (counts[n.category] || 0) + 1);
            const maxCount = Math.max(...Object.values(counts), 1);

            catDist.innerHTML = Object.entries(CATEGORY_META).map(([key, meta]) => {
                const count = counts[key];
                const pct = (count / maxCount) * 100;
                return `
                    <div class="category-bar">
                        <div class="category-dot" style="background:${meta.color}"></div>
                        <div class="category-name">${meta.label}</div>
                        <div class="category-track">
                            <div class="category-fill" style="width:${pct}%;background:${meta.color}"></div>
                        </div>
                        <div class="category-count">${count}</div>
                    </div>
                `;
            }).join('');
        }

        // ===== 笔记编辑 =====
        function analyzeNote() {
            const title = document.getElementById('note-title').value.trim();
            const content = document.getElementById('note-content').value.trim();

            if (!title && !content) {
                showToast('请先输入笔记内容', 'error');
                return;
            }

            // 模拟AI分析延迟
            showToast('🤖 AI分析中...', '');
            setTimeout(() => {
                const result = aiAnalyze(title, content);
                const meta = CATEGORY_META[result.category];

                document.getElementById('ai-type').textContent = `${meta.icon} ${meta.label}`;
                document.getElementById('ai-difficulty').textContent = result.difficulty;
                document.getElementById('ai-importance').textContent = result.importance;
                document.getElementById('ai-keywords').innerHTML = result.keywords.map(kw =>
                    `<span class="keyword-tag">${kw}</span>`
                ).join('');

                document.getElementById('ai-result').classList.add('show');
                document.getElementById('note-category').value = result.category;
                showToast('AI分析完成！', 'success');
            }, 800);
        }

        function saveNote() {
            const title = document.getElementById('note-title').value.trim();
            const content = document.getElementById('note-content').value.trim();
            const category = document.getElementById('note-category').value;

            if (!title || !content) {
                showToast('请填写标题和内容', 'error');
                return;
            }

            const aiResult = aiAnalyze(title, content);
            const finalCategory = category || aiResult.category;

            const note = {
                id: 'n' + Date.now(),
                title, content,
                category: finalCategory,
                keywords: aiResult.keywords,
                difficulty: aiResult.difficulty,
                importance: aiResult.importance,
                createdAt: Date.now(),
                reviews: 0,
                mastery: 0,
                nextReview: Date.now(),
                interval: 0,
                easeFactor: 2.5
            };

            appData.notes.unshift(note);
            saveData(appData);
            clearEditor();
            showToast('笔记保存成功！已生成复习计划', 'success');
            navigateTo('library');
        }

        function clearEditor() {
            document.getElementById('note-title').value = '';
            document.getElementById('note-content').value = '';
            document.getElementById('note-category').value = '';
            document.getElementById('ai-result').classList.remove('show');
        }

        // ===== 知识库 =====
        let currentFilter = 'all';
        let searchQuery = '';

        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.filter;
                renderLibrary();
            });
        });

        document.getElementById('global-search').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            if (document.getElementById('page-library').classList.contains('active')) {
                renderLibrary();
            }
        });

        function renderLibrary() {
            const grid = document.getElementById('notes-grid');
            let notes = appData.notes;

            if (currentFilter !== 'all') {
                notes = notes.filter(n => n.category === currentFilter);
            }
            if (searchQuery) {
                notes = notes.filter(n =>
                    n.title.toLowerCase().includes(searchQuery) ||
                    n.content.toLowerCase().includes(searchQuery) ||
                    n.keywords.some(kw => kw.toLowerCase().includes(searchQuery))
                );
            }

            if (notes.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">暂无笔记，去创建第一篇吧！</div>
                        <button class="btn btn-primary" onclick="navigateTo('create')">＋ 新建笔记</button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = notes.map(n => {
                const meta = CATEGORY_META[n.category];
                const excerpt = n.content.slice(0, 100) + (n.content.length > 100 ? '...' : '');
                const masteryClass = n.mastery >= 0.7 ? 'mastery-high' : n.mastery >= 0.3 ? 'mastery-mid' : 'mastery-low';
                const masteryLabel = n.mastery >= 0.7 ? '已掌握' : n.mastery >= 0.3 ? '学习中' : '待巩固';
                const date = new Date(n.createdAt).toLocaleDateString('zh-CN');

                return `
                    <div class="note-item" style="border-left-color:${meta.color}" onclick="showNoteDetail('${n.id}')">
                        <span class="note-item-tag" style="background:${meta.bg};color:${meta.color}">${meta.icon} ${meta.label}</span>
                        <div class="note-item-title">${n.title}</div>
                        <div class="note-item-excerpt">${excerpt}</div>
                        <div class="note-item-keywords">
                            ${n.keywords.slice(0, 3).map(kw => `<span class="note-item-keyword">${kw}</span>`).join('')}
                        </div>
                        <div class="note-item-footer" style="margin-top:12px">
                            <span>${date}</span>
                            <span class="mastery-indicator ${masteryClass}">${masteryLabel} ${Math.round(n.mastery*100)}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showNoteDetail(id) {
            const note = appData.notes.find(n => n.id === id);
            if (!note) return;
            const meta = CATEGORY_META[note.category];
            const date = new Date(n.createdAt).toLocaleString('zh-CN');

            document.getElementById('modal-title').textContent = note.title;
            document.getElementById('modal-body').innerHTML = `
                <span class="note-item-tag" style="background:${meta.bg};color:${meta.color}">${meta.icon} ${meta.label}</span>
                <div style="margin:16px 0;padding:16px;background:var(--bg);border-radius:10px;line-height:1.8;">${note.content}</div>
                <h4>📊 学习数据</h4>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px">
                    <div class="ai-field"><div class="ai-field-label">难度</div><div class="ai-field-value">${note.difficulty}</div></div>
                    <div class="ai-field"><div class="ai-field-label">重要程度</div><div class="ai-field-value">${note.importance}</div></div>
                    <div class="ai-field"><div class="ai-field-label">掌握度</div><div class="ai-field-value">${Math.round(note.mastery*100)}%</div></div>
                </div>
                <h4>🏷️ 关键词</h4>
                <div class="note-keywords">
                    ${note.keywords.map(kw => `<span class="keyword-tag">${kw}</span>`).join('')}
                </div>
                <h4>🔄 复习记录</h4>
                <p>已复习 ${note.reviews} 次 · 下次复习：${new Date(note.nextReview).toLocaleDateString('zh-CN')}</p>
                <p style="margin-top:8px;color:var(--text-light);font-size:0.8rem">创建于 ${date}</p>
                <div style="margin-top:24px;display:flex;gap:12px">
                    <button class="btn btn-danger" onclick="deleteNote('${note.id}')">🗑️ 删除</button>
                    <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('show');
        }

        function deleteNote(id) {
            appData.notes = appData.notes.filter(n => n.id !== id);
            saveData(appData);
            closeModal();
            renderLibrary();
            showToast('笔记已删除', 'success');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        });

        // ===== 复习中心 =====
        let reviewQueue = [];
        let reviewIndex = 0;

        function renderReview() {
            const now = Date.now();
            reviewQueue = appData.notes.filter(n => n.nextReview <= now);
            reviewIndex = 0;
            showReviewCard();
        }

        function showReviewCard() {
            const container = document.getElementById('review-container');

            if (reviewQueue.length === 0) {
                container.innerHTML = `
                    <div class="review-complete">
                        <div class="review-complete-icon">🎉</div>
                        <div class="review-complete-title">今日复习已完成！</div>
                        <div class="review-complete-desc">太棒了，继续保持学习节奏！</div>
                        <button class="btn btn-primary" onclick="navigateTo('dashboard')">返回仪表盘</button>
                    </div>
                `;
                return;
            }

            if (reviewIndex >= reviewQueue.length) {
                container.innerHTML = `
                    <div class="review-complete">
                        <div class="review-complete-icon">🎉</div>
                        <div class="review-complete-title">复习完成！</div>
                        <div class="review-complete-desc">本次复习了 ${reviewQueue.length} 个知识点</div>
                        <button class="btn btn-primary" onclick="navigateTo('dashboard')">返回仪表盘</button>
                    </div>
                `;
                renderDashboard();
                return;
            }

            const note = reviewQueue[reviewIndex];
            const meta = CATEGORY_META[note.category];
            const progress = ((reviewIndex) / reviewQueue.length) * 100;

            container.innerHTML = `
                <div style="width:100%;margin-bottom:16px;text-align:center">
                    <span style="font-size:0.85rem;color:var(--text-secondary)">
                        第 ${reviewIndex + 1} / ${reviewQueue.length} 张
                    </span>
                </div>
                <div class="review-progress-bar">
                    <div class="review-progress-fill" style="width:${progress}%"></div>
                </div>
                <div class="review-card-wrap">
                    <div class="review-card" id="review-card" onclick="flipCard()">
                        <div class="review-card-face review-card-front">
                            <span class="review-card-category" style="background:${meta.bg};color:${meta.color}">${meta.icon} ${meta.label}</span>
                            <div class="review-card-question">${note.title}</div>
                            <div class="review-card-hint">👆 点击卡片查看答案</div>
                        </div>
                        <div class="review-card-face review-card-back">
                            <div class="review-card-answer">${note.content}</div>
                        </div>
                    </div>
                </div>
                <div class="review-rating-buttons" id="rating-buttons" style="display:none">
                    <button class="rating-btn rating-again" onclick="rateReview(1)">
                        😵 <span>重来</span><span class="rating-label">&lt;1天</span>
                    </button>
                    <button class="rating-btn rating-hard" onclick="rateReview(2)">
                        😅 <span>困难</span><span class="rating-label">1天</span>
                    </button>
                    <button class="rating-btn rating-good" onclick="rateReview(3)">
                        🙂 <span>良好</span><span class="rating-label">${note.interval > 0 ? Math.round(note.interval * note.easeFactor) : 2}天</span>
                    </button>
                    <button class="rating-btn rating-easy" onclick="rateReview(4)">
                        😎 <span>简单</span><span class="rating-label">${note.interval > 0 ? Math.round(note.interval * note.easeFactor * 1.3) : 4}天</span>
                    </button>
                </div>
            `;
        }

        function flipCard() {
            const card = document.getElementById('review-card');
            card.classList.toggle('flipped');
            if (card.classList.contains('flipped')) {
                document.getElementById('rating-buttons').style.display = 'flex';
            }
        }

        function rateReview(rating) {
            const note = reviewQueue[reviewIndex];
            const result = calculateNextReview(rating, note);

            Object.assign(note, result);
            saveData(appData);

            reviewIndex++;
            showReviewCard();
        }

        // ===== 知识图谱 =====
        function renderGraph() {
            const svg = document.getElementById('graph-svg');
            const notes = appData.notes;

            if (notes.length === 0) {
                svg.innerHTML = '<text x="400" y="260" text-anchor="middle" fill="#95A5A6" font-size="16">暂无笔记数据</text>';
                return;
            }

            // 构建节点 - 按分类分组排列
            const categories = Object.keys(CATEGORY_META);
            const centerX = 400, centerY = 260;
            const radius = 180;

            const nodes = notes.map((note, i) => {
                const catIndex = categories.indexOf(note.category);
                const catCount = notes.filter(n => n.category === note.category).length;
                const catNotes = notes.filter(n => n.category === note.category);
                const indexInCat = catNotes.indexOf(note);

                const angleStep = (Math.PI * 2) / 4;
                const baseAngle = catIndex * angleStep - Math.PI / 2;
                const spread = (indexInCat - (catCount - 1) / 2) * 0.3;
                const angle = baseAngle + spread;

                const r = radius + (indexInCat % 2) * 40;
                return {
                    id: note.id,
                    label: note.title.slice(0, 6),
                    x: centerX + Math.cos(angle) * r,
                    y: centerY + Math.sin(angle) * r,
                    category: note.category,
                    mastery: note.mastery,
                    note: note
                };
            });

            // 构建边 - 基于关键词关联
            const edges = [];
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const shared = nodes[i].note.keywords.filter(kw =>
                        nodes[j].note.keywords.includes(kw)
                    );
                    if (shared.length > 0) {
                        edges.push({ source: i, target: j, strength: shared.length });
                    }
                }
            }

            // 渲染SVG
            let html = '';

            // 中心节点
            html += `
                <circle cx="${centerX}" cy="${centerY}" r="40" fill="url(#centerGrad)" opacity="0.9"/>
                <text x="${centerX}" y="${centerY-5}" class="graph-node-label" fill="white" font-size="14" font-weight="700">我的</text>
                <text x="${centerX}" y="${centerY+12}" class="graph-node-label" fill="white" font-size="14" font-weight="700">知识库</text>
            `;

            // 中心到各分类的连线
            categories.forEach((cat, i) => {
                const angle = (i * Math.PI * 2 / 4) - Math.PI / 2;
                const x = centerX + Math.cos(angle) * 80;
                const y = centerY + Math.sin(angle) * 80;
                const meta = CATEGORY_META[cat];
                html += `<line x1="${centerX}" y1="${centerY}" x2="${x}" y2="${y}" stroke="${meta.color}" stroke-width="2" opacity="0.3" stroke-dasharray="4,4"/>`;
                html += `<circle cx="${x}" cy="${y}" r="6" fill="${meta.color}" opacity="0.5"/>`;
            });

            // 边
            edges.forEach(edge => {
                const s = nodes[edge.source];
                const t = nodes[edge.target];
                html += `<line class="graph-edge" x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}" stroke-width="${1 + edge.strength}" opacity="${0.2 + edge.strength * 0.1}"/>`;
            });

            // 中心到节点的连线
            nodes.forEach(node => {
                const meta = CATEGORY_META[node.category];
                html += `<line x1="${centerX}" y1="${centerY}" x2="${node.x}" y2="${node.y}" stroke="${meta.color}" stroke-width="1.5" opacity="0.15"/>`;
            });

            // 节点
            nodes.forEach((node, i) => {
                const meta = CATEGORY_META[node.category];
                const isWeak = node.mastery < 0.3;
                const color = isWeak ? '#F39C12' : meta.color;
                const size = 20 + node.note.mastery * 8;

                html += `
                    <g class="graph-node" onclick="showGraphNodeInfo(${i})">
                        <circle class="graph-node-circle" cx="${node.x}" cy="${node.y}" r="${size}" fill="${color}" opacity="0.85"/>
                        <text x="${node.x}" y="${node.y+4}" class="graph-node-label" fill="white" font-size="10">${node.label}</text>
                    </g>
                `;
            });

            // 渐变定义
            html = `
                <defs>
                    <radialGradient id="centerGrad">
                        <stop offset="0%" stop-color="#4A90D9"/>
                        <stop offset="100%" stop-color="#67B26F"/>
                    </radialGradient>
                </defs>
            ` + html;

            // 保存节点数据用于交互
            window._graphNodes = nodes;
            svg.innerHTML = html;
        }

        function showGraphNodeInfo(index) {
            const node = window._graphNodes[index];
            if (!node) return;
            const meta = CATEGORY_META[node.category];
            const note = node.note;
            const panel = document.getElementById('graph-info-panel');

            document.getElementById('gi-title').textContent = note.title;
            document.getElementById('gi-type').textContent = `${meta.icon} ${meta.label} · ${note.difficulty}难度`;
            document.getElementById('gi-mastery').textContent = `掌握度：${Math.round(note.mastery * 100)}%${node.mastery < 0.3 ? ' ⚠️ 薄弱' : ''}`;
            document.getElementById('gi-review').textContent = `下次复习：${new Date(note.nextReview).toLocaleDateString('zh-CN')}`;

            panel.classList.add('show');
        }

        // ===== Toast =====
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ===== 初始化 =====
        renderDashboard();
    </script>
</body>
</html>
