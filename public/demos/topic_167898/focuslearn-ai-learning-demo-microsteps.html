      {

        desc: "解释 super()、父类复用和常见混乱点。",

      },
      {
        title: "ADHD 学习策略",
        category: "学习方法",
        desc: "把注意力困难、信息量和进度反馈拆开。",
        prompt: "请把 Markdown 文章按大标题和小标题拆成知识卡片：# ADHD 学习策略 ## 为什么长内容困难 ## 怎么减少信息量 ## 怎么用进度反馈保持专注"
      },
      {
        title: "英语单词记忆",
        category: "语言",
        desc: "把单词含义、例句和记忆方式变成卡片。",

      },
      {
        title: "通货膨胀入门",
        category: "经济学",
        desc: "把概念、原因、影响和生活例子拆成卡片。",

      }
    ];

    let currentDeck = null;
    let currentIndex = 0;
    let currentView = "single";
    let masteredCards = new Set();
    let reviewCards = new Set();

    const userInput = document.getElementById("userInput");
    const jsonBox = document.getElementById("jsonBox");
    const cardsStage = document.getElementById("cardsStage");
    const toast = document.getElementById("toast");
    const caseGrid = document.getElementById("caseGrid");

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function resetLearningState() {
      masteredCards = new Set();
      reviewCards = new Set();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getLearningFields(card) {
      return {
        question: card.question || `你能用自己的话解释“${card.title}”吗？`,
        check: card.checkYourself || card.focusHint || "先停 10 秒，用一句话复述这张卡的重点。",
        estimatedTime: card.estimatedTime || "约 45 秒"
      };
    }

    function inferTopic(text) {
      const clean = text.replace(/[#*`"“”]/g, "").trim();
      if (/Agent|智能体|工具/.test(clean)) return "AI Agent 核心概念";
      if (/super|Python|继承/.test(clean)) return "Python super() 继承";
      if (/MVP|产品经理|最小可行/.test(clean)) return "MVP 产品概念";
      if (/ADHD|注意力|专注/.test(clean)) return "ADHD 学习策略";
      if (/英语|单词|procrastination|词根|例句/.test(clean)) return "英语单词记忆";
      if (/通货膨胀|经济|价格|物价/.test(clean)) return "通货膨胀入门";
      const firstSentence = clean.split(/[。！？\n]/)[0] || "新知识主题";
      return firstSentence.slice(0, 22);
    }

    function extractHeadings(text) {
      return text
        .split(/\n/)
        .map((line) => line.trim())
        .filter((line) => /^#{1,3}\s+/.test(line))
        .map((line) => line.replace(/^#{1,3}\s+/, "").trim())
        .filter(Boolean);
    }

    function makeCardsFromHeadings(topic, headings) {
      return headings
        .filter((heading) => heading !== topic)
        .slice(0, 8)
        .map((heading, index) => ({
          id: `card_${index + 1}`,
          type: index === 0 ? "concept" : "explain",
          title: heading,
          summary: `这一张只处理“${heading}”这个知识点。`,
          detail: `AI 会把该标题下的内容压缩成一个独立学习任务，避免用户一次面对整篇长文。用户读完这一张，再进入下一张。`,
          tags: [topic, "Markdown 分卡"],
          focusHint: "只需要理解当前卡片，不需要同时记住整篇文章。"
        }));
    }

    function makeAICards(topic, text) {
      if (/Agent|智能体|工具/.test(text)) {
        return [
          {
            id: "card_1",
            type: "definition",
            title: "Agent 是什么？",
            summary: "Agent 是能围绕目标进行理解、推理，并调用工具完成任务的智能体。",
            detail: "可以把 Agent 理解成“有大脑也有手脚”的 AI：LLM 负责思考，工具负责行动，反馈负责修正下一步。",
            code: "{ \"brain\": \"LLM\", \"body\": \"Tools\", \"loop\": \"Plan → Act → Observe\" }",
            tags: ["定义", "智能体"],
            focusHint: "先记住一句话：Agent = 会思考 + 会行动的 AI。"
          },
          {
            id: "card_2",
            type: "why",
            title: "为什么需要工具？",
            summary: "LLM 本身只能生成文本，工具让它能真正执行操作。",
            detail: "比如搜索网页、读取文件、调用 API、写代码、操作数据库，这些都需要工具完成。没有工具，Agent 只能“说”，不能“做”。",
            tags: ["工具", "行动"],
            focusHint: "把工具想象成 Agent 的手脚。"
          },
          {
            id: "card_3",
            type: "process",
            title: "Agent 怎么工作？",
            summary: "典型流程是：理解目标 → 制定计划 → 调用工具 → 观察结果 → 调整下一步。",
            detail: "这个循环让 Agent 不只是一次性回答，而是可以根据执行结果持续推进任务，直到接近目标。",
            tags: ["流程", "反馈"],
            focusHint: "只记住四个词：目标、计划、行动、反馈。"
          },
          {
            id: "card_4",
            type: "review",
            title: "怎样算理解了？",
            summary: "如果你能解释 LLM、工具和反馈循环之间的关系，就掌握了 Agent 的基础概念。",
            detail: "复述时可以用一句话：Agent 用 LLM 做决策，用工具做动作，再根据结果继续调整。",
            tags: ["复习", "自测"],
            focusHint: "用自己的话复述一遍，比继续看更多内容更重要。"
          }
        ];
      }

      if (/super|Python|继承/.test(text)) {
        return [
          {
            id: "card_1",
            type: "definition",
            title: "super() 是什么？",
            summary: "super() 让子类可以调用父类的方法。",
            detail: "它常用于在保留父类逻辑的基础上，给子类增加自己的行为，避免重复写同样的代码。",
            code: "class Child(Parent):\n    def __init__(self):\n        super().__init__()",
            tags: ["Python", "继承"],
            focusHint: "先把 super() 理解成“问上一层怎么做”。"
          },
          {
            id: "card_2",
            type: "why",
            title: "为什么要用 super()？",
            summary: "它能复用父类逻辑，让代码更少、更清楚。",
            detail: "当父类已经写好了初始化、校验或公共流程，子类只需要调用 super()，再补充自己的特殊逻辑。",
            tags: ["复用", "父类"],
            focusHint: "不要同时想多重继承，先理解单继承场景。"
          },
          {
            id: "card_3",
            type: "mistake",
            title: "什么时候容易混乱？",
            summary: "多重继承时，super() 会按照 MRO 顺序查找下一个类。",
            detail: "如果还没理解 MRO，可以先记住：super() 不一定等于直接调用某个固定父类，而是调用继承链上的下一个实现。",
            tags: ["MRO", "易错点"],
            focusHint: "把难点拆开：今天只学 super()，下次再学 MRO。"
          }
        ];
      }

      if (/MVP|产品经理|最小可行/.test(text)) {
        return [
          {
            id: "card_1",
            type: "definition",
            title: "MVP 是什么？",
            summary: "MVP 是用最小成本验证核心假设的产品版本。",
            detail: "它不是粗糙版本，也不是功能越少越好，而是只保留验证用户需求所必需的功能。",
            tags: ["产品", "定义"],
            focusHint: "先记住：MVP 的目标是验证，不是炫技。"
          },
          {
            id: "card_2",
            type: "value",
            title: "MVP 的价值",
            summary: "它能更早获得用户反馈，减少无效开发。",
            detail: "团队不用先做完整产品，而是先验证用户是否真的需要、是否愿意使用、是否愿意付费。",
            tags: ["验证", "效率"],
            focusHint: "思考一个问题：我要验证什么假设？"
          },
          {
            id: "card_3",
            type: "mistake",
            title: "常见误区",
            summary: "MVP 不是低质量，也不是随便删功能。",
            detail: "如果删掉的功能会影响核心价值验证，那就不是合格的 MVP。真正的 MVP 应该小，但完整表达核心价值。",
            tags: ["误区", "产品判断"],
            focusHint: "小不等于差，小是为了更快验证。"
          }
        ];
      }

      if (/英语|单词|procrastination|词根|例句/.test(text)) {
        return [
          {
            id: "card_1",
            type: "meaning",
            title: "procrastination 是什么？",
            summary: "procrastination 指拖延、延迟做本该完成的事情。",
            detail: "它常用于学习、工作和任务管理场景，强调不是单纯休息，而是明知道该做却一直往后推。",
            tags: ["英语", "含义"],
            focusHint: "先记住中文核心：拖延。"
          },
          {
            id: "card_2",
            type: "example",
            title: "一个场景例句",
            summary: "Procrastination made me start the report at midnight.",
            detail: "这句话的意思是：拖延让我到半夜才开始写报告。例句能把单词放回真实情境里，比只背中文更容易记住。",
            tags: ["例句", "语境"],
            focusHint: "只读这一句，不用一次背多个例句。"
          },
          {
            id: "card_3",
            type: "memory",
            title: "怎么联想记忆？",
            summary: "可以把它和 procrastinate 联系起来：procrastinate 是动词，procrastination 是名词。",
            detail: "记忆时可以用“动词动作 → 名词状态”的方式：I procrastinate. This is procrastination.",
            tags: ["词形", "记忆"],
            focusHint: "今天只记一组词形变化。"
          },
          {
            id: "card_4",
            type: "review",
            title: "复习提醒",
            summary: "用一句自己的经历造句，记忆会更稳。",
            detail: "例如：Procrastination makes studying harder. 把单词和自己的生活经验绑定起来，之后更容易想起。",
            tags: ["复习", "输出"],
            focusHint: "写一句自己的例句就够了。"
          }
        ];
      }

      if (/通货膨胀|经济|价格|物价/.test(text)) {
        return [
          {
            id: "card_1",
            type: "definition",
            title: "通货膨胀是什么？",
            summary: "通货膨胀是整体物价持续上涨，钱的购买力下降。",
            detail: "重点不是某一个商品涨价，而是很多商品和服务的价格都在一段时间里普遍上涨。",
            tags: ["经济学", "定义"],
            focusHint: "先记住：物价涨，钱变不经花。"
          },
          {
            id: "card_2",
            type: "cause",
            title: "为什么会发生？",
            summary: "可能因为需求太旺、成本上升，或市场上的钱变多。",
            detail: "比如大家都想买同样的东西，供给跟不上，价格就会上涨；如果原材料和工资上涨，商品价格也可能上涨。",
            tags: ["原因", "供需"],
            focusHint: "只先理解两类原因：需求多、成本高。"
          },
          {
            id: "card_3",
            type: "impact",
            title: "会影响谁？",
            summary: "它会影响消费者、企业、储蓄者和借款人。",
            detail: "消费者会感觉生活成本上升；企业成本可能变高；持有现金的人购买力下降；固定利率借款人可能相对受益。",
            tags: ["影响", "生活"],
            focusHint: "想一个问题：同样 100 元还能买多少东西？"
          },
          {
            id: "card_4",
            type: "example",
            title: "生活例子",
            summary: "去年一杯咖啡 20 元，今年变成 24 元，如果很多商品都类似上涨，就可能是通胀。",
            detail: "单个商品涨价不一定代表通胀，但如果食品、交通、房租、服务都持续上涨，就说明整体价格水平在变化。",
            tags: ["例子", "理解"],
            focusHint: "用生活价格变化来理解抽象概念。"
          }
        ];
      }

      return [
        {
          id: "card_1",
          type: "goal",
          title: "你真正想学什么？",
          summary: `这个问题的核心主题是“${topic}”。`,
          detail: "AI 会先把用户的问题改写成一个清晰学习目标，然后围绕目标拆解知识点。",
          tags: ["目标识别"],
          focusHint: "先确认目标，再开始学习。"
        },
        {
          id: "card_2",
          type: "breakdown",
          title: "拆成 3 个小问题",
          summary: "把大问题拆成：它是什么、为什么重要、怎么应用。",
          detail: "这种结构适合注意力容易中断的用户，因为每张卡片都有独立边界，不需要一次处理全部内容。",
          tags: ["拆解", "ADHD 友好"],
          focusHint: "一张卡只回答一个问题。"
        },
        {
          id: "card_3",
          type: "review",
          title: "最后做一次复述",
          summary: "学完后，用一句话复述这组卡片的核心意思。",
          detail: "复述能帮助用户检查自己是否真正理解，也能形成一次清晰的学习闭环。",
          tags: ["复习", "自测"],
          focusHint: "复述比继续堆更多内容更有效。"
        }
      ];
    }

    function analyzeWithAI(text) {
      const topic = inferTopic(text);
      const headings = extractHeadings(text);
      const cards = headings.length > 1 ? makeCardsFromHeadings(topic, headings) : makeAICards(topic, text);

      return {
        schemaVersion: "focuslearn.cardDeck.v1",
        generatedBy: "AI Analyzer",
        meta: {
          title: topic,
          sourceType: headings.length > 1 ? "markdown" : "question",
          targetUser: "ADHD 学习者 / 容易被长内容打断的学习者",
          renderMode: "flashcard",
          cardCount: cards.length
        },
        cards,
        uiRules: {
          defaultView: "single-card",
          showOneCardAtATime: true,
          allowOverview: true,
          emphasizeFocusHint: true
        }
      };
    }

    function syntaxHighlightJson(obj) {
      const json = JSON.stringify(obj, null, 2)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (match) => {
        let cls = "num";
        if (/^"/.test(match)) cls = /:$/.test(match) ? "key" : "str";
        return `<span class="${cls}">${match}</span>`;
      });
    }

    function renderJson(deck) {
      jsonBox.innerHTML = syntaxHighlightJson(deck);
    }

    function renderCompletion() {
      const total = currentDeck.cards.length;
      const mastered = masteredCards.size;
      const needsReview = reviewCards.size;
      const reviewTitles = currentDeck.cards
        .filter((card) => reviewCards.has(card.id))
        .map((card) => card.title);

      cardsStage.innerHTML = `
        <section class="completion">
          <span class="badge">学习完成</span>
          <h3>你完成了 ${total} 张卡片</h3>
          <p>这次学习已经形成闭环：先思考，往下阅读解释，最后标记掌握状态。建议稍后优先复习“不太懂”的卡片，而不是立刻增加新内容。</p>
          <div class="completion-grid">
            <div class="completion-stat"><small>已完成</small><strong>${total}</strong></div>
            <div class="completion-stat"><small>我懂了</small><strong>${mastered}</strong></div>
            <div class="completion-stat"><small>待复习</small><strong>${needsReview}</strong></div>
          </div>
          ${reviewTitles.length ? `<div class="review-list">${reviewTitles.map((title) => `<span>${escapeHtml(title)}</span>`).join("")}</div>` : `<p>没有标记待复习的卡片。可以休息一下，稍后再回来快速扫一遍。</p>`}
          <nav class="nav">
            <button id="restartDeck">重新学习</button>
            <button class="primary" id="finishHome">回到案例</button>
          </nav>
        </section>
      `;

      document.getElementById("restartDeck").addEventListener("click", () => {
        currentIndex = 0;
        currentView = "single";
        resetLearningState();
        updateViewChips();
        renderCards();
      });

      document.getElementById("finishHome").addEventListener("click", () => {
        goHome("这组卡片已学习完成");
      });
    }

    function renderCards() {
      if (!currentDeck) return;
      if (currentView === "grid") {
        cardsStage.innerHTML = `<div class="grid-view">${currentDeck.cards.map((card, index) => `
          <button class="grid-card" data-index="${index}">
            <small>${String(index + 1).padStart(2, "0")} · ${escapeHtml(card.type)} · ${masteredCards.has(card.id) ? "已懂" : reviewCards.has(card.id) ? "待复习" : "未学"}</small>
            <h3>${escapeHtml(card.title)}</h3>
            <p>${escapeHtml(card.summary)}</p>
          </button>
        `).join("")}</div>`;

        cardsStage.querySelectorAll(".grid-card").forEach((item) => {
          item.addEventListener("click", () => {
            currentIndex = Number(item.dataset.index);
            currentView = "single";
            updateViewChips();
            renderCards();
          });
        });
        return;
      }

      const card = currentDeck.cards[currentIndex];
      const learning = getLearningFields(card);
      const progress = Math.round(((currentIndex + 1) / currentDeck.cards.length) * 100);
      cardsStage.innerHTML = `
        <article class="study-card">
          <div>
            <div class="card-top">
              <span class="badge">${escapeHtml(card.type)}</span>
              <span class="counter">${currentIndex + 1} / ${currentDeck.cards.length}</span>
            </div>
            <div class="progress-wrap" aria-label="学习进度">
              <div class="progress-meta">
                <span>当前只学这一张</span>
                <span>${progress}% · ${escapeHtml(learning.estimatedTime)}</span>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
            </div>
          </div>
          <h3>${escapeHtml(card.title)}</h3>
          <div class="learn-prompt">
            <span class="micro-label">先想 10 秒</span>
            <p>${escapeHtml(learning.question)}</p>
          </div>
          <div class="answer-panel">
            <p class="summary">${escapeHtml(card.summary)}</p>
            <div class="detail">
              ${card.code ? `<pre class="json-box" style="min-height:auto;max-height:none;margin:0 0 18px;">${escapeHtml(card.code)}</pre>` : ""}
              ${escapeHtml(card.detail)}
              <div class="hint">${escapeHtml(card.focusHint)}</div>
            </div>
            <div class="self-check">
              <strong>自测一下</strong>
              <p>${escapeHtml(learning.check)}</p>
            </div>
            <div class="status-actions">
              <button class="status-btn ${masteredCards.has(card.id) ? "is-mastered" : ""}" id="markMastered">我懂了</button>
              <button class="status-btn ${reviewCards.has(card.id) ? "is-review" : ""}" id="markReview">还不懂，稍后复习</button>
            </div>
          </div>
          <nav class="nav">
            <button id="prevCard" ${currentIndex === 0 ? "disabled" : ""}>上一张</button>
            <button class="primary" id="nextCard">${currentIndex === currentDeck.cards.length - 1 ? "完成" : "下一张"}</button>
          </nav>
        </article>
      `;

      const markMastered = document.getElementById("markMastered");
      if (markMastered) {
        markMastered.addEventListener("click", () => {
          masteredCards.add(card.id);
          reviewCards.delete(card.id);
          showToast("已标记为懂了");
          renderCards();
        });
      }

      const markReview = document.getElementById("markReview");
      if (markReview) {
        markReview.addEventListener("click", () => {
          reviewCards.add(card.id);
          masteredCards.delete(card.id);
          showToast("已加入稍后复习");
          renderCards();
        });
      }

      document.getElementById("prevCard").addEventListener("click", () => {
        if (currentIndex === 0) return;
        currentIndex -= 1;
        renderCards();
      });

      document.getElementById("nextCard").addEventListener("click", () => {
        if (currentIndex === currentDeck.cards.length - 1) {
          renderCompletion();
        } else {
          currentIndex += 1;
          renderCards();
        }
      });
    }

    function updateViewChips() {
      document.querySelectorAll("[data-view]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === currentView);
      });
    }

    function goHome(message) {
      document.body.classList.remove("study-mode");
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (message) showToast(message);
    }

    function openSavedDeck(item) {
      userInput.value = item.prompt;
      currentDeck = analyzeWithAI(item.prompt);
      currentIndex = 0;
      currentView = "single";
      resetLearningState();
      renderJson(currentDeck);
      updateViewChips();
      renderCards();
      document.body.classList.add("study-mode");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderCaseGrid() {
      caseGrid.innerHTML = examples.map((item, index) => `
        <button class="case-card" data-index="${index}">
          <small>${item.category}</small>
          <strong>${item.title}</strong>
          <span>${item.desc}</span>
        </button>
      `).join("");

      caseGrid.querySelectorAll(".case-card").forEach((card) => {
        card.addEventListener("click", () => {
          const item = examples[Number(card.dataset.index)];
          openSavedDeck(item);
        });
      });
    }

    function runAnalysis() {
      const text = userInput.value.trim();
      if (!text) {
        showToast("请先输入一个问题");
        return;
      }

      const btn = document.getElementById("analyzeBtn");
      btn.textContent = "AI 正在分析...";
      btn.style.opacity = "0.72";

      setTimeout(() => {
        currentDeck = analyzeWithAI(text);
        currentIndex = 0;
        currentView = "single";
        resetLearningState();
        renderJson(currentDeck);
        updateViewChips();
        renderCards();
        document.body.classList.add("study-mode");
        window.scrollTo({ top: 0, behavior: "smooth" });
        btn.textContent = "AI 分析并生成卡片";
        btn.style.opacity = "1";
        showToast("卡片已生成");
      }, 520);
    }

    document.getElementById("analyzeBtn").addEventListener("click", runAnalysis);

    document.getElementById("sampleBtn").addEventListener("click", () => {
      const current = examples.findIndex((item) => item.prompt === userInput.value);
      const next = examples[(current + 1 + examples.length) % examples.length] || examples[0];
      userInput.value = next.prompt;
      showToast("已切换问题示例");
    });

    document.getElementById("backHomeBtn").addEventListener("click", () => {
      goHome();
    });

    document.querySelectorAll("[data-view]").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentView = btn.dataset.view;
        updateViewChips();
        renderCards();
      });
    });

    document.getElementById("copyJsonBtn").addEventListener("click", async () => {
      if (!currentDeck) {
        showToast("还没有 JSON");
        return;
      }
      await navigator.clipboard.writeText(JSON.stringify(currentDeck, null, 2));
      showToast("JSON 已复制");
    });

    document.getElementById("downloadJsonBtn").addEventListener("click", () => {
      if (!currentDeck) {
        showToast("还没有 JSON");
        return;
      }
      const blob = new Blob([JSON.stringify(currentDeck, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "focuslearn-card-deck.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("JSON 已导出");
    });

    renderCaseGrid();
  </script>
</body>
</html>
