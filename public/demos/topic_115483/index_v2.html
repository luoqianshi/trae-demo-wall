<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>MallInsight v2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { background: #000; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background: #000; color: #f5f5f7;
            -webkit-font-smoothing: antialiased;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 顶部导航栏（浮动） ===== */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: env(safe-area-inset-top, 12px) 16px 8px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 70%, transparent 100%);
            pointer-events: none;
        }
        .nav-row { display: flex; align-items: center; justify-content: center; gap: 10px; pointer-events: auto; }
        .nav-logo { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
        .nav-logo span { color: #3b82f6; }

        .nav-perspectives {
            display: flex; gap: 8px; pointer-events: auto;
            margin: 12px auto 0; width: fit-content;
        }
        .nav-perspective {
            padding: 7px 18px; border: none; border-radius: 18px;
            font-size: 13px; font-weight: 700; cursor: pointer;
            white-space: nowrap;
            background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45);
            transition: all 0.25s ease;
        }
        .nav-perspective[data-p="public"].active { background: #3b82f6; color: #fff; }
        .nav-perspective[data-p="designer"].active { background: #8b5cf6; color: #fff; }
        .nav-perspective[data-p="operator"].active { background: #10b981; color: #fff; }

        /* ===== 搜索栏 ===== */
        .search-row {
            display: flex; align-items: center; gap: 8px;
            pointer-events: auto; margin-top: 8px;
        }
        .search-bar {
            flex: 1; display: flex; align-items: center;
            background: rgba(255,255,255,0.08); border-radius: 20px;
            padding: 8px 14px; gap: 8px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .search-bar i { color: rgba(255,255,255,0.3); font-size: 13px; }
        .search-bar input {
            flex: 1; background: none; border: none; outline: none;
            color: #fff; font-size: 14px; font-family: inherit;
        }
        .search-bar input::placeholder { color: rgba(255,255,255,0.25); }
        .search-filter {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5);
            font-size: 14px; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .search-filter.active { background: #3b82f6; color: #fff; }

        /* ===== 筛选面板 ===== */
        .filter-overlay {
            position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6);
            display: none; align-items: flex-end;
        }
        .filter-overlay.open { display: flex; }
        .filter-panel {
            width: 100%; background: #1c1c1e; border-radius: 16px 16px 0 0;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            max-height: 70vh; overflow-y: auto;
        }
        .filter-panel h3 { font-size: 16px; margin-bottom: 16px; color: #fff; text-align: center; }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .filter-item { display: flex; flex-direction: column; gap: 4px; }
        .filter-item label { font-size: 11px; color: rgba(255,255,255,0.4); }
        .filter-item select {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; padding: 8px; color: #fff; font-size: 13px;
            font-family: inherit; outline: none;
        }
        .filter-item select option {
            background: #1a1a1a; color: #fff;
        }
        .filter-actions { display: flex; gap: 8px; }
        .filter-actions button {
            flex: 1; padding: 10px; border-radius: 10px; border: none;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .filter-reset { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); }
        .filter-apply { background: #3b82f6; color: #fff; }

        /* ===== 主内容：今日推荐 & 社区 ===== */
        .main-view {
            height: 100vh; height: 100dvh;
            overflow-y: scroll; overflow-x: hidden;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .main-view::-webkit-scrollbar { display: none; }

        /* 今日推荐卡片 */
        .daily-card {
            height: 100vh; height: 100dvh;
            scroll-snap-align: start;
            position: relative; overflow: hidden;
        }
        .daily-card-bg {
            width: 100%; height: 100%; object-fit: cover;
            display: block; position: absolute; top: 0; left: 0;
        }
        .daily-card-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 120px 24px 0;
            padding-bottom: calc(60px + 56px + env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
        }
        .daily-card-city {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 12px;
        }
        .daily-card-name {
            font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.85);
        }
        .daily-card-sub {
            font-size: 22px; font-weight: 700; color: #fff;
            line-height: 1.3; margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .daily-card-author {
            display: flex; align-items: center; gap: 5px;
            margin-bottom: 14px; font-size: 12px;
        }
        .daily-card-author-avatar {
            width: 20px; height: 20px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .daily-card-author-name {
            color: rgba(255,255,255,0.7); font-weight: 500;
        }
        .daily-card-author-title {
            padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 600;
            background: rgba(59,130,246,0.15); color: #60a5fa;
            border: 1px solid rgba(59,130,246,0.25);
        }
        .daily-card-author-title.designer {
            background: rgba(167,139,250,0.15); color: #a78bfa; border-color: rgba(167,139,250,0.25);
        }
        .daily-card-author-title.operator {
            background: rgba(52,211,153,0.15); color: #34d399; border-color: rgba(52,211,153,0.25);
        }
        .daily-card-rating {
            display: flex; gap: 20px; align-items: center;
        }
        .daily-r-item { display: flex; align-items: center; gap: 6px; }
        .daily-r-dot { width: 8px; height: 8px; border-radius: 50%; }
        .daily-r-dot.public { background: #60a5fa; }
        .daily-r-dot.designer { background: #a78bfa; }
        .daily-r-dot.operator { background: #34d399; }
        .daily-r-label { font-size: 11px; color: rgba(255,255,255,0.35); }
        .daily-r-score { font-size: 18px; font-weight: 700; }
        .daily-r-score.public { color: #60a5fa; }
        .daily-r-score.designer { color: #a78bfa; }
        .daily-r-score.operator { color: #34d399; }

        .daily-card-tap {
            position: absolute; bottom: calc(20px + 56px); right: 24px;
            padding: 8px 16px; border-radius: 20px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 12px; color: #fff; font-weight: 600;
            cursor: pointer; pointer-events: auto;
        }

        /* 社区帖子卡片 */
        .community-card {
            height: 100vh; height: 100dvh;
            scroll-snap-align: start;
            position: relative; overflow: hidden;
        }
        .community-card-bg {
            width: 100%; height: 100%; object-fit: cover;
            display: block; position: absolute; top: 0; left: 0;
        }
        .community-card-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 200px 24px 48px;
            padding-bottom: calc(48px + 56px + env(safe-area-inset-bottom));
            background: linear-gradient(transparent 0%, rgba(0,0,0,0.3) 25%, rgba(0,0,0,0.7) 55%, rgba(0,0,0,0.95) 85%);
        }
        .community-user {
            display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
        }
        .community-avatar {
            width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
        }
        .community-username { font-size: 14px; font-weight: 600; color: #fff; }
        .community-role {
            padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
            color: #fff; margin-left: 6px;
        }
        .community-comment {
            font-size: 18px; font-weight: 500; color: #fff; line-height: 1.5;
            margin-bottom: 12px;
        }
        .community-tags { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .community-tag {
            padding: 4px 10px; border-radius: 12px; font-size: 11px;
            background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6);
        }
        .community-actions {
            display: flex; gap: 20px; align-items: center;
        }
        .community-action {
            display: flex; align-items: center; gap: 4px;
            font-size: 13px; color: rgba(255,255,255,0.5); cursor: pointer;
        }
        .community-action i { font-size: 16px; }
        .community-action.liked i { color: #ef4444; }

        /* 滑动指示器 */
        .swipe-indicator {
            position: absolute; bottom: calc(50% + 28px); left: 50%; transform: translate(-50%, 50%);
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            opacity: 0; animation: fadeInOut 2.5s ease-in-out forwards;
        }
        .swipe-indicator i { font-size: 24px; color: rgba(255,255,255,0.5); }
        .swipe-indicator span { font-size: 11px; color: rgba(255,255,255,0.4); }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translate(-50%, 50%) translateY(0); }
            30% { opacity: 1; }
            60% { opacity: 1; transform: translate(-50%, 50%) translateY(8px); }
        }

        /* 空状态 */
        .empty-state {
            height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            color: rgba(255,255,255,0.2);
        }
        .empty-state i { font-size: 40px; }
        .empty-state span { font-size: 14px; }

        /* ===== 底部Sheet详情 ===== */
        .sheet-backdrop {
            position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.5);
            display: none;
        }
        .sheet-backdrop.open { display: block; }
        .detail-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 301;
            background: #1c1c1e; border-radius: 20px 20px 0 0;
            max-height: 85vh; overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .detail-sheet.open { transform: translateY(0); }
        .detail-sheet::-webkit-scrollbar { display: none; }

        .sheet-handle {
            display: flex; justify-content: center; padding: 12px 0 8px;
        }
        .sheet-handle-bar {
            width: 36px; height: 4px; border-radius: 2px;
            background: rgba(255,255,255,0.2);
        }
        .sheet-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px 12px;
        }
        .sheet-title { font-size: 20px; font-weight: 700; color: #fff; }
        .sheet-close {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5);
            font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .sheet-content { padding: 0 20px 20px; }
        .sheet-featured-post {
            background: rgba(255,255,255,0.06); border-radius: 14px;
            padding: 16px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .sheet-featured-post-header {
            display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
        }
        .sheet-featured-post-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .sheet-featured-post-user {
            font-size: 14px; font-weight: 600; color: #fff;
        }
        .sheet-featured-post-title-tag {
            padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 600;
        }
        .sheet-featured-post-title-tag.public { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .sheet-featured-post-title-tag.designer { background: rgba(167,139,250,0.15); color: #a78bfa; }
        .sheet-featured-post-title-tag.operator { background: rgba(52,211,153,0.15); color: #34d399; }
        .sheet-featured-post-title {
            font-size: 17px; font-weight: 700; color: #fff; line-height: 1.4; margin-bottom: 8px;
        }
        .sheet-featured-post-excerpt {
            font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 12px;
        }
        .sheet-featured-post-stats {
            display: flex; gap: 20px; font-size: 13px; color: rgba(255,255,255,0.5);
        }
        .sheet-featured-post-stats span { display: flex; align-items: center; gap: 4px; }
        .sheet-meta { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .sheet-meta-tag {
            padding: 4px 10px; border-radius: 12px; font-size: 11px;
            background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .sheet-desc { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 20px; }

        .sheet-rating-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sheet-rating-label {
            display: flex; align-items: center; gap: 8px;
            font-size: 15px; font-weight: 600; color: #fff;
        }
        .sheet-rating-dot { width: 8px; height: 8px; border-radius: 50%; }
        .sheet-rating-dot.public { background: #60a5fa; }
        .sheet-rating-dot.designer { background: #a78bfa; }
        .sheet-rating-dot.operator { background: #34d399; }
        .sheet-rating-value { font-size: 24px; font-weight: 700; }
        .sheet-rating-value.public { color: #60a5fa; }
        .sheet-rating-value.designer { color: #a78bfa; }
        .sheet-rating-value.operator { color: #34d399; }

        /* 滑块评分 */
        .sheet-rate-section { margin-top: 20px; }
        .sheet-rate-header {
            display: flex; align-items: center; gap: 6px;
            font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 12px;
        }
        .sheet-rate-identity {
            font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 400;
        }
        .sheet-rate-slider-wrap {
            display: flex; align-items: center; gap: 12px;
        }
        .sheet-rate-slider {
            flex: 1; -webkit-appearance: none; appearance: none;
            height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1);
            outline: none;
        }
        .sheet-rate-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 28px; height: 28px; border-radius: 50%;
            background: #3b82f6; cursor: pointer;
            box-shadow: 0 0 12px rgba(59,130,246,0.4);
        }
        .sheet-rate-value {
            font-size: 22px; font-weight: 700; color: #3b82f6;
            min-width: 36px; text-align: center;
        }
        .sheet-rate-submit {
            margin-top: 16px; width: 100%; padding: 12px; border-radius: 12px;
            border: none; background: #3b82f6; color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .sheet-rate-submit:active { opacity: 0.8; }

        /* 详情Sheet内相关帖子 */
        .sheet-posts-section { margin-top: 20px; }
        .sheet-posts-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 0 12px; border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 12px;
        }
        .sheet-posts-title {
            font-size: 14px; font-weight: 600; color: #fff;
        }
        .sheet-posts-count {
            font-size: 11px; color: rgba(255,255,255,0.3);
        }
        .sheet-post-item {
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
        }
        .sheet-post-item:last-child { border-bottom: none; }
        .sheet-post-user {
            display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
        }
        .sheet-post-avatar {
            width: 22px; height: 22px; border-radius: 50%;
        }
        .sheet-post-username { font-size: 12px; font-weight: 600; color: #fff; }
        .sheet-post-role {
            padding: 1px 6px; border-radius: 8px; font-size: 9px; font-weight: 600; color: #fff;
        }
        .sheet-post-text {
            font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .sheet-post-empty {
            font-size: 12px; color: rgba(255,255,255,0.2); text-align: center; padding: 20px 0;
        }

        /* 地图定位 + 导航 */
        .sheet-map {
            margin: 0 -20px 20px; height: 160px; position: relative; overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .sheet-map-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .sheet-map-pin {
            position: relative; z-index: 2; width: 28px; height: 28px;
            background: #3b82f6; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 0 20px rgba(59,130,246,0.5);
            animation: pinBounce 1.5s ease-in-out infinite;
        }
        @keyframes pinBounce {
            0%, 100% { transform: rotate(-45deg) translateY(0); }
            50% { transform: rotate(-45deg) translateY(-6px); }
        }
        .sheet-map-label {
            position: absolute; bottom: 12px; left: 0; right: 0; text-align: center;
            font-size: 11px; color: rgba(255,255,255,0.35); z-index: 2;
        }
        .sheet-nav-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px; border-radius: 12px; border: none;
            background: rgba(59,130,246,0.15); color: #60a5fa;
            font-size: 14px; font-weight: 600; cursor: pointer;
            margin-bottom: 20px;
        }
        .sheet-nav-btn:active { background: rgba(59,130,246,0.25); }

        .sheet-bookmark-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 10px; border-radius: 12px; border: none;
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6);
            font-size: 13px; font-weight: 600; cursor: pointer;
            margin-bottom: 12px; font-family: inherit;
        }
        .sheet-bookmark-btn:active { background: rgba(255,255,255,0.1); }
        .sheet-bookmark-btn.bookmarked { color: #f59e0b; background: rgba(245,158,11,0.1); }

        /* ===== 搜索覆盖层 ===== */
        .search-overlay {
            position: fixed; inset: 0; z-index: 150; background: #0a0a0a;
            display: none; flex-direction: column;
        }
        .search-overlay.open { display: flex; }
        .search-overlay-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .search-overlay-back {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
            font-size: 14px; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .search-overlay-input {
            flex: 1; display: flex; align-items: center;
            background: rgba(255,255,255,0.08); border-radius: 20px;
            padding: 8px 14px; gap: 8px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .search-overlay-input i { color: rgba(255,255,255,0.3); font-size: 13px; }
        .search-overlay-input input {
            flex: 1; background: none; border: none; outline: none;
            color: #fff; font-size: 15px; font-family: inherit;
        }
        .search-overlay-input input::placeholder { color: rgba(255,255,255,0.25); }
        .search-overlay-body {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .search-overlay-body::-webkit-scrollbar { display: none; }

        /* 搜索结果：官方商场卡片 */
        .search-mall-card {
            margin: 12px 16px; border-radius: 12px;
            background: #1c1c1e; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .search-mall-card-img {
            width: 100%; height: 140px; object-fit: cover; display: block;
        }
        .search-mall-card-body { padding: 14px 16px; }
        .search-mall-card-name {

// ===== 用户数据（localStorage持久化） =====
function loadUserData() {
    try {
        const d = JSON.parse(localStorage.getItem('mallinsight_user'));
        return d || { bookmarks: [], ratings: {} };
    } catch(e) { return { bookmarks: [], ratings: {} }; }
}
function saveUserData(d) {
    localStorage.setItem('mallinsight_user', JSON.stringify(d));
}
let userData = loadUserData();

function toggleBookmark(mallId) {
    const idx = userData.bookmarks.indexOf(mallId);
    if (idx >= 0) userData.bookmarks.splice(idx, 1);
    else userData.bookmarks.push(mallId);
    saveUserData(userData);
    // 如果当前在"我的"页，刷新
    if (viewMode === 'me') renderMe();
}
function isBookmarked(mallId) { return userData.bookmarks.includes(mallId); }

function saveRating(mallId, rating) {
    userData.ratings[mallId] = { score: rating, date: new Date().toISOString().slice(0,10) };
    saveUserData(userData);
}

function generatePosts() {
    const posts = [];
    // 只为有精选帖子的商场生成社区帖子
    const featuredMallIds = [...new Set(FEATURED_POSTS.map(p=>p.mallId))];
    const featuredMalls = MALLS_DATA.filter(m => featuredMallIds.includes(m.id));
    const shuffled = [...featuredMalls].sort(()=>Math.random()-0.5);
    shuffled.forEach((m,idx)=>{
        const u = MOCK_USERS[idx%MOCK_USERS.length];
        // 为每个帖子生成 2-4 条随机回复
        const replyCount = 2 + Math.floor(Math.random() * 3);
        const shuffledReplies = [...MOCK_REPLIES].sort(()=>Math.random()-0.5);
        const replies = shuffledReplies.slice(0, replyCount).map(r => ({
            ...r,
            avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${r.user}`
        }));
        posts.push({
            mallId:m.id, user:u.name, role:u.role,
            avatar:`https://api.dicebear.com/7.x/avataaars/svg?seed=${u.name}`,
            title: MOCK_TITLES[idx%MOCK_TITLES.length],
            comment:MOCK_COMMENTS[idx%MOCK_COMMENTS.length],
            replies: replies,
            likes:Math.floor(Math.random()*500)+20,
            comments: replies.length,
            image:getMallImage(m.id)
        });
    });
    // 合入精选帖子（带官方身份）
    FEATURED_POSTS.forEach(fp => {
        const m = MALLS_DATA.find(x=>x.id===fp.mallId);
        posts.unshift({
            mallId:fp.mallId, user:fp.user, role:fp.role,
            userTitle: fp.userTitle, verified: fp.verified, featured: true,
            avatar:`https://api.dicebear.com/7.x/avataaars/svg?seed=${fp.user}`,
            title: fp.title, comment: fp.excerpt,
            replies: [], likes: fp.likes, comments: fp.comments,
            image: getCardImage(fp.mallId, fp.role, getMallImage(fp.mallId))
        });
    });
    return posts;
}

function getFilterCity() { return document.getElementById('filterCity').value; }
function getFilterType() { return document.getElementById('filterType').value; }
function getFilterBrand() { return document.getElementById('filterBrand').value; }
function getFilterRating() { return parseFloat(document.getElementById('filterRating').value); }

function getMalls() {
    let list = MALLS_DATA;
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const fc = getFilterCity(), ft = getFilterType(), fb = getFilterBrand(), fr = getFilterRating();
    if(q) list = list.filter(m=>m.name.toLowerCase().includes(q)||m.city.toLowerCase().includes(q));
    if(fc) list = list.filter(m=>m.city===fc);
    if(ft) list = list.filter(m=>m.type===ft);
    if(fb) list = list.filter(m=>m.brand===fb);
    if(fr>0) list = list.filter(m=>((m.publicRating+m.designerRating+m.operatorRating)/3)>=fr);
    return list;
}

function getDaily() {
    const featuredMallIds = [...new Set(FEATURED_POSTS.map(p=>p.mallId))];
    const all = getMalls().filter(m => featuredMallIds.includes(m.id));
    let getScore;
    if(perspective==='designer') getScore = m=>m.designerRating*5+(m.publicRating+m.designerRating+m.operatorRating);
    else if(perspective==='operator') getScore = m=>m.operatorRating*5+(m.publicRating+m.designerRating+m.operatorRating);
    else getScore = m=>m.publicRating*5+(m.publicRating+m.designerRating+m.operatorRating);
    return [...all].sort((a,b)=>getScore(b)-getScore(a)).slice(0,8);
}

function getSubInfo(m, p) {
    const post = getFeaturedPost(m.id, p);
    if(post) return post.title;
    const upd = MALL_UPDATES[m.id];
    if(upd) {
        if(p==='designer') return upd.designer;
        if(p==='operator') return upd.operator;
        return upd.public;
    }
    if(p==='designer') return `${m.type} · ${m.area}万㎡ · ${m.openedYear}年开业`;
    if(p==='operator') {
        const t = m.trend==='up'?'人气上升':m.trend==='down'?'人气下降':'趋势平稳';
        return `${m.brand||'独立运营'}运营 · 日均${m.dailyVisitors}万人次 · ${t}`;
    }
    return (m.tags||[]).map(t=>'#'+t).join(' ');
}

}

            }
            return `
            <div class="daily-card" onclick="openSheet(${m.id})">
                <img class="daily-card-bg" src="${img}" alt="${m.name}" loading="lazy"/>
                <div class="daily-card-overlay">
                    <div class="daily-card-sub">${getSubInfo(m, perspective)}</div>
                    <div class="daily-card-city"><span class="daily-card-name">${m.name}</span> · <i class="fas fa-map-marker-alt"></i> ${m.city} ${m.district}</div>
                    ${authorHtml}
                    <div class="daily-card-rating">
                        <div class="daily-r-item"><span class="daily-r-dot public"></span><span class="daily-r-label">逛玩</span><span class="daily-r-score public">${m.publicRating}.0</span></div>
                        <div class="daily-r-item"><span class="daily-r-dot designer"></span><span class="daily-r-label">设计</span><span class="daily-r-score designer">${m.designerRating}.0</span></div>
                        <div class="daily-r-item"><span class="daily-r-dot operator"></span><span class="daily-r-label">运营</span><span class="daily-r-score operator">${m.operatorRating}.0</span></div>
                    </div>
                </div>
                <div class="daily-card-tap" onclick="event.stopPropagation();openSheet(${m.id})">查看详情</div>
            </div>`;
        }).join('');
    }

}

// ===== 搜索覆盖层渲染 =====
function renderSearchOverlay() {
    const q = document.getElementById('searchOverlayInput').value.toLowerCase().trim();
    const body = document.getElementById('searchOverlayBody');
    if(!q) {
        body.innerHTML = '<div class="search-empty">输入关键词搜索商场</div>';
        return;
    }

    // 匹配商场
    const matchedMalls = getMalls().filter(m=>m.name.toLowerCase().includes(q)||m.city.toLowerCase().includes(q)||m.short.toLowerCase().includes(q));

    // 匹配帖子（按当前视角过滤身份）
    let matchedPosts = communityPosts.filter(p=>{
        if(p.role !== perspective) return false;
        const m = MALLS_DATA.find(x=>x.id===p.mallId);
        if(!m) return false;
        return m.name.toLowerCase().includes(q)||m.city.toLowerCase().includes(q)||m.short.toLowerCase().includes(q);
    });

    if(matchedMalls.length===0 && matchedPosts.length===0) {
        body.innerHTML = '<div class="search-empty">未找到匹配的商场或帖子</div>';
        return;
    }

    let html = '';

    // 官方商场卡片
    if(matchedMalls.length>0) {
        html += '<div class="search-section-title">官方商场</div>';
        matchedMalls.forEach(m=>{
            const img = getMallImage(m.id);
            html += `
            <div class="search-mall-card" onclick="closeSearchOverlay();openSheet(${m.id})">
                <img class="search-mall-card-img" src="${img}" alt="${m.name}" loading="lazy"/>
                <div class="search-mall-card-body">
                    <div class="search-mall-card-name">${m.name}</div>
                    <div class="search-mall-card-meta">${m.city} · ${m.district} · ${m.type} · ${m.brand||'独立运营'}</div>
                    <div class="search-mall-card-ratings">
                        <div class="search-mall-r-item"><span class="search-mall-r-dot public"></span><span class="search-mall-r-label">逛玩</span><span class="search-mall-r-score public">${m.publicRating}.0</span></div>
                        <div class="search-mall-r-item"><span class="search-mall-r-dot designer"></span><span class="search-mall-r-label">设计</span><span class="search-mall-r-score designer">${m.designerRating}.0</span></div>
                        <div class="search-mall-r-item"><span class="search-mall-r-dot operator"></span><span class="search-mall-r-label">运营</span><span class="search-mall-r-score operator">${m.operatorRating}.0</span></div>
                    </div>
                </div>
            </div>`;
        });
    }

    // 相关帖子
    if(matchedPosts.length>0) {
        html += '<div class="search-section-title">相关帖子</div>';
        matchedPosts.forEach((p, idx)=>{
            const m = MALLS_DATA.find(x=>x.id===p.mallId);
            const rc = ROLE_CONFIG[p.role];
            const postId = `post-${idx}-${Date.now()}`;
            // 构建回复评论HTML
            const repliesHtml = (p.replies || []).map(r => {
                const rrc = ROLE_CONFIG[r.role];
                return `
                <div class="search-post-reply">
                    <img class="search-post-reply-avatar" src="${r.avatar}" alt="${r.user}"/>
                    <div class="search-post-reply-body">
                        <div class="search-post-reply-user">${r.user}<span class="search-post-reply-role" style="background:${rrc.color}">${rrc.label}</span></div>
                        <div class="search-post-reply-text">${r.text}</div>
                    </div>
                </div>`;
            }).join('');
            html += `
            <div class="search-post-card" id="${postId}" onclick="togglePostExpand('${postId}', ${p.mallId})">
                <div class="search-post-user">
                    <img src="${p.avatar}" class="search-post-avatar" alt="${p.user}"/>
                    <span class="search-post-username">${p.user}</span>
                    <span class="search-post-role" style="background:${rc.color}">${rc.label}</span>
                </div>
                <div class="search-post-title">${p.title}</div>
                <div class="search-post-text">${p.comment}</div>
                <div class="search-post-mall"><i class="fas fa-store-alt"></i> ${m?m.name:''} · ${p.likes}赞 · ${p.comments}条回复</div>
                <div class="search-post-expand">
                    <div class="search-post-expand-inner">
                        <div class="search-post-expand-section-title">回复 (${p.comments})</div>
                        ${repliesHtml}
                        ${m ? `
                        <div class="search-post-expand-mall-bar">
                            <img class="search-post-expand-mall-bar-img" src="${getMallImage(m.id)}" alt="${m.name}"/>
                            <div class="search-post-expand-mall-bar-info">
                                <div class="search-post-expand-mall-bar-name">${m.name}</div>
                                <div class="search-post-expand-mall-bar-meta">${m.city} · ${m.district} · ${m.type}</div>
                            </div>
                            <button class="search-post-expand-btn" onclick="event.stopPropagation();closeSearchOverlay();openSheet(${p.mallId})" style="width:auto;margin-top:0;padding:6px 12px;">查看详情</button>
                        </div>
                        ` : ''}
                        <div class="search-post-expand-hint">点击卡片收起</div>
                    </div>
                </div>
            </div>`;
        });
    }

    body.innerHTML = html;
}

function openSearchOverlay() {
    document.getElementById('searchOverlay').classList.add('open');
    document.getElementById('searchOverlayInput').value = '';
    document.getElementById('searchOverlayInput').focus();
    renderSearchOverlay();
}

function closeSearchOverlay() {
    document.getElementById('searchOverlay').classList.remove('open');
    document.getElementById('searchInput').value = '';
}

function togglePostExpand(postId, mallId) {
    const card = document.getElementById(postId);
    if (!card) return;
    const isExpanded = card.classList.contains('expanded');
    // 收起所有已展开的帖子
    document.querySelectorAll('.search-post-card.expanded').forEach(c => c.classList.remove('expanded'));
    // 切换当前帖子
    if (!isExpanded) {
        card.classList.add('expanded');
    }
}

// ===== Sheet详情 =====
function openSheet(id) {
    selectedMallId = id;
    const m = MALLS_DATA.find(x=>x.id===id);
    if(!m) return;
    document.getElementById('sheetTitle').textContent = m.name;

    // 获取当前视角的精选帖子
    const featuredPost = getFeaturedPost(id, perspective);
    let featuredHtml = '';
    if(featuredPost) {
        featuredHtml = `
        <div class="sheet-featured-post">
            <div class="sheet-featured-post-header">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${featuredPost.user}" class="sheet-featured-post-avatar" alt="${featuredPost.user}"/>
                <span class="sheet-featured-post-user">${featuredPost.user}</span>
                <i class="fas fa-check-circle" style="color:#3b82f6;font-size:12px;"></i>
                <span class="sheet-featured-post-title-tag ${featuredPost.role}">${featuredPost.userTitle}</span>
            </div>
            <div class="sheet-featured-post-title">${featuredPost.title}</div>
            <div class="sheet-featured-post-excerpt">${featuredPost.excerpt}</div>
            <div class="sheet-featured-post-stats">
                <span><i class="far fa-heart"></i> ${featuredPost.likes}</span>
                <span><i class="far fa-comment"></i> ${featuredPost.comments}</span>
            </div>
        </div>`;
    }

    document.getElementById('sheetContent').innerHTML = `
        ${featuredHtml}
        <div class="sheet-meta">
            <span class="sheet-meta-tag">${m.city}</span>
            <span class="sheet-meta-tag">${m.district}</span>
            <span class="sheet-meta-tag">${m.type}</span>
            <span class="sheet-meta-tag">${m.brand||'独立运营'}</span>
        </div>
        <div class="sheet-desc">${m.description}</div>
        <button class="sheet-bookmark-btn" id="sheetBookmarkBtn" onclick="toggleBookmark(${id});updateBookmarkBtn()">
            <i class="fas ${isBookmarked(id) ? 'fa-bookmark' : 'far fa-bookmark'}"></i> ${isBookmarked(id) ? '已收藏' : '收藏商场'}
        </button>
        <div class="sheet-map">
            <div class="sheet-map-grid"></div>
            <div class="sheet-map-pin"></div>
            <div class="sheet-map-label">${m.city} · ${m.district}</div>
        </div>
        <button class="sheet-nav-btn" onclick="navigateTo(${m.lat},${m.lng},'${m.name.replace(/'/g,"\\'")}')">
            <i class="fas fa-location-arrow"></i> 导航到这里
        </button>
        <div class="sheet-rating-row">
            <span class="sheet-rating-label"><span class="sheet-rating-dot public"></span>逛玩评分</span>
            <span class="sheet-rating-value public">${m.publicRating}.0</span>
        </div>
        <div class="sheet-rating-row">
            <span class="sheet-rating-label"><span class="sheet-rating-dot designer"></span>设计评分</span>
            <span class="sheet-rating-value designer">${m.designerRating}.0</span>
        </div>
        <div class="sheet-rating-row">
            <span class="sheet-rating-label"><span class="sheet-rating-dot operator"></span>运营评分</span>
            <span class="sheet-rating-value operator">${m.operatorRating}.0</span>
        </div>
        <div class="sheet-posts-section">
            <div class="sheet-posts-header">
                <span class="sheet-posts-title">大家怎么说</span>
                <span class="sheet-posts-count" id="sheetPostsCount"></span>
            </div>
            <div id="sheetPostsList"></div>
        </div>
        <div class="sheet-rate-section">
            <div class="sheet-rate-header">
                <i class="fas fa-pen"></i> 我要评分
                <span class="sheet-rate-identity">当前身份：${ROLE_CONFIG[perspective].label}</span>
            </div>
            <div class="sheet-rate-slider-wrap">
                <input type="range" class="sheet-rate-slider" id="rateSlider" min="1" max="5" step="1" value="3" oninput="updateRateValue(this.value)"/>
                <span class="sheet-rate-value" id="rateValue">3</span>
            </div>
            <button class="sheet-rate-submit" onclick="submitRating()">提交评分</button>
        </div>
    `;
    // 加载相关帖子
    const sheetPosts = communityPosts.filter(p => p.mallId === id);
    const plist = document.getElementById('sheetPostsList');
    const pcount = document.getElementById('sheetPostsCount');
    pcount.textContent = sheetPosts.length + '条帖子';
    if (sheetPosts.length === 0) {
        plist.innerHTML = '<div class="sheet-post-empty">暂无帖子，来发第一条吧</div>';
    } else {
        plist.innerHTML = sheetPosts.map(p => {
            const rc = ROLE_CONFIG[p.role];
            return `
            <div class="sheet-post-item">
                <div class="sheet-post-user">
                    <img src="${p.avatar}" class="sheet-post-avatar" alt="${p.user}"/>
                    <span class="sheet-post-username">${p.user}</span>
                    <span class="sheet-post-role" style="background:${rc.color}">${rc.label}</span>
                </div>
                <div class="sheet-post-text">${p.comment}</div>
            </div>`;
        }).join('');
    }

    document.getElementById('detailSheet').classList.add('open');
    document.getElementById('sheetBackdrop').classList.add('open');
    myRating = 3;
}

function updateRateValue(v) {
    myRating = parseInt(v);
    document.getElementById('rateValue').textContent = v;
}

function submitRating() {
    saveRating(selectedMallId, myRating);
    closeSheet();
    if (viewMode === 'me') renderMe();
}

function updateBookmarkBtn() {
    const btn = document.getElementById('sheetBookmarkBtn');
    if (!btn) return;
    const isBm = isBookmarked(selectedMallId);
    btn.innerHTML = `<i class="fas ${isBm ? 'fa-bookmark' : 'far fa-bookmark'}"></i> ${isBm ? '已收藏' : '收藏商场'}`;
    if (isBm) btn.classList.add('bookmarked');
    else btn.classList.remove('bookmarked');
}

function closeSheet() {
    document.getElementById('detailSheet').classList.remove('open');
    document.getElementById('sheetBackdrop').classList.remove('open');
}

function navigateTo(lat, lng, name) {
    // 优先使用高德地图URI，同时提供百度地图作为备选
    const gaode = `https://uri.amap.com/navigation?to=${lng},${lat},${encodeURIComponent(name)}&mode=car&callnative=1`;
    const baidu = `https://api.map.baidu.com/direction?destination=${lat},${lng}&destination_name=${encodeURIComponent(name)}&coord_type=gcj02&mode=driving&src=MallInsight`;
    // 尝试高德优先，移动端会自动唤起地图App
    window.location.href = gaode;
}

// ===== 渲染"我的"页 =====
function renderMe() {
    const main = document.getElementById('mainView');
    const savedMalls = userData.bookmarks.map(id => MALLS_DATA.find(m => m.id === id)).filter(Boolean);
    const ratingEntries = Object.entries(userData.ratings);

    let html = '<div class="me-view">';
    html += `
        <div class="me-header">
            <img class="me-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt=""/>
            <div class="me-name">商场体验师</div>
            <div class="me-stats">
                <div class="me-stat">
                    <div class="me-stat-num">${savedMalls.length}</div>
                    <div class="me-stat-label">收藏</div>
                </div>
                <div class="me-stat">
                    <div class="me-stat-num">${ratingEntries.length}</div>
                    <div class="me-stat-label">评分</div>
                </div>
            </div>
        </div>`;

    // 收藏商场
    html += `<div class="me-section">
        <div class="me-section-title">我的收藏 <span class="me-section-count">${savedMalls.length}</span></div>`;
    if (savedMalls.length === 0) {
        html += '<div class="me-empty">还没有收藏任何商场，去"推荐"页点击收藏吧</div>';
    } else {
        savedMalls.forEach(m => {
            const avg = ((m.publicRating + m.designerRating + m.operatorRating) / 3).toFixed(1);
            html += `
            <div class="me-mall-card" onclick="closeSearchOverlay();openSheet(${m.id})">
                <img class="me-mall-card-img" src="${getMallImage(m.id)}" alt="${m.name}"/>
                <div class="me-mall-card-body">
                    <div class="me-mall-card-name">${m.name}</div>
                    <div class="me-mall-card-meta">${m.city} · ${m.type} · 平均 ${avg}</div>
                </div>
                <button class="me-mall-card-remove" onclick="event.stopPropagation();toggleBookmark(${m.id});">取消收藏</button>
            </div>`;
        });
    }
    html += '</div>';

    // 我的评分
    html += `<div class="me-section">
        <div class="me-section-title">我的评分 <span class="me-section-count">${ratingEntries.length}</span></div>`;
    if (ratingEntries.length === 0) {
        html += '<div class="me-empty">还没有评分任何商场，去商场详情页打分吧</div>';
    } else {
        ratingEntries.forEach(([mallId, rating]) => {
            const m = MALLS_DATA.find(x => x.id === parseInt(mallId));
            if (!m) return;
            const stars = '★'.repeat(rating.score) + '☆'.repeat(5 - rating.score);
            html += `
            <div class="me-rate-item" onclick="closeSearchOverlay();openSheet(${mallId})">
                <div class="me-rate-stars">${stars}</div>
                <div class="me-rate-mall">${m.name}</div>
                <div class="me-rate-date">${rating.date}</div>
            </div>`;
        });
    }
    html += '</div>';

    // 我的帖子（社区）
    const myPosts = communityPosts.filter(p => p.user === 'MallInsight'); // 占位，实际用户发布
    if (myPosts.length > 0) {
        html += `<div class="me-section">
            <div class="me-section-title">我的帖子 <span class="me-section-count">${myPosts.length}</span></div>`;
        myPosts.forEach(p => {
            const m = MALLS_DATA.find(x => x.id === p.mallId);
            html += `
            <div class="me-post-item" onclick="closeSearchOverlay();openSheet(${p.mallId})">
                <div class="me-post-item-title">${p.title}</div>
                <div class="me-post-item-meta"><i class="fas fa-store"></i> ${m?m.name:'-'} · ${p.comments} 回复</div>
            </div>`;
        });
        html += '</div>';
    }

    html += '</div>';
    main.innerHTML = html;
}

// 控制视角切换按钮显隐：推荐显示，社区和我的隐藏
document.querySelectorAll('#tabBar .tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
        document.querySelectorAll('#tabBar .tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        viewMode = btn.dataset.mode;
        document.getElementById('mainView').scrollTop = 0;
        // 只在"推荐"页显示视角切换，社区/我的隐藏
        document.getElementById('navPerspectives').style.display = 'flex';
        render();
    });
});

document.querySelectorAll('#navPerspectives .nav-perspective').forEach(btn=>{
    btn.addEventListener('click',()=>{
        document.querySelectorAll('#navPerspectives .nav-perspective').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        perspective = btn.dataset.p;
        document.getElementById('mainView').scrollTop = 0;
        render();
    });
});

// 搜索框点击 → 打开搜索覆盖层
document.getElementById('searchInput').addEventListener('focus', (e) => {
    e.preventDefault();
    e.target.blur();
    openSearchOverlay();
});

// 搜索覆盖层事件
document.getElementById('searchOverlayInput').addEventListener('input', renderSearchOverlay);

document.getElementById('searchBackBtn').addEventListener('click', closeSearchOverlay);

document.getElementById('filterBtn').addEventListener('click',()=>{
    document.getElementById('filterOverlay').classList.toggle('open');
});

document.getElementById('filterOverlay').addEventListener('click',(e)=>{
    if(e.target===document.getElementById('filterOverlay')) {
        document.getElementById('filterOverlay').classList.remove('open');
    }
});

document.getElementById('filterApply').addEventListener('click',()=>{
    document.getElementById('filterOverlay').classList.remove('open');
    document.getElementById('mainView').scrollTop = 0;
    render();
});

document.getElementById('filterReset').addEventListener('click',()=>{
    document.getElementById('filterCity').value='';
    document.getElementById('filterType').value='';
    document.getElementById('filterBrand').value='';
    document.getElementById('filterRating').value='0';
});

document.getElementById('sheetBackdrop').addEventListener('click',(e)=>{
    if(e.target===document.getElementById('sheetBackdrop')) closeSheet();
});

// 筛选初始化
(function initFilters(){
    const cities = [...new Set(MALLS_DATA.map(m=>m.city))];
    document.getElementById('filterCity').innerHTML = '<option value="">全部城市</option>'+cities.map(c=>`<option value="${c}">${c}</option>`).join('');
    const brands = [...new Set(MALLS_DATA.map(m=>m.brand).filter(Boolean))].sort();
    document.getElementById('filterBrand').innerHTML = '<option value="">全部品牌</option>'+brands.map(b=>`<option value="${b}">${b}</option>`).join('');
})();

// 初始渲染
render();
</script>
</body>
