<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="满电青年 - 电动车综合服务平台，提供用户端、商户端和管理端三端入口">
  <title>满电青年 · 三端应用入口</title>
  <style>
    /* ========================================
     * 满电青年 三端入口页
     * 风格：极简清新风（Clean Minimalist）
     * 配色严格遵循项目 UI 设计系统
     * ======================================== */

    :root {
      /* 主色系 */
      --color-primary: #4ECDC4;
      --color-primary-light: #E8F8F6;
      --color-primary-dark: #36B5AD;

      /* 辅助色系 */
      --color-success: #52C41A;
      --color-warning: #FAAD14;
      --color-danger: #FF6B6B;
      --color-info: #1677FF;
      --color-info-light: #E6F4FF;

      /* 中性色系 */
      --color-text-primary: #1A1A2E;
      --color-text-secondary: #6B7280;
      --color-text-placeholder: #B0B8C4;
      --color-text-inverse: #FFFFFF;

      /* 背景色 */
      --color-bg-page: #F7F9FC;
      --color-bg-card: #FFFFFF;

      /* 阴影 */
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
      --shadow-card-hover: 0 8px 32px rgba(0, 0, 0, 0.12);

      /* 圆角 */
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      /* 间距 */
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --spacing-xl: 20px;
      --spacing-xxl: 24px;
      --spacing-section: 32px;

      /* 字体 */
      --font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;

      /* 动画 */
      --transition-normal: 0.25s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-family);
      color: var(--color-text-primary);
      background: var(--color-bg-page);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---- 主容器 ---- */
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-section) var(--spacing-lg);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* ---- 品牌头部 ---- */
    .brand {
      text-align: center;
      margin-bottom: var(--spacing-section);
    }

    .brand__logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      box-shadow: 0 4px 16px rgba(78, 205, 196, 0.3);
      margin-bottom: var(--spacing-lg);
    }

    .brand__logo svg {
      width: 40px;
      height: 40px;
      fill: var(--color-text-inverse);
    }

    .brand__title {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-text-primary);
      letter-spacing: 1px;
      margin-bottom: var(--spacing-sm);
    }

    .brand__subtitle {
      font-size: 14px;
      color: var(--color-text-secondary);
      font-weight: 400;
    }

    /* ---- 入口卡片网格 ---- */
    .entries {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--spacing-lg);
      width: 100%;
      max-width: 960px;
    }

    @media (min-width: 768px) {
      .entries {
        grid-template-columns: repeat(3, 1fr);
        gap: var(--spacing-xl);
      }
    }

    /* ---- 入口卡片 ---- */
    .entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: inherit;
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xxl) var(--spacing-xl);
      box-shadow: var(--shadow-card);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
      position: relative;
      overflow: hidden;
    }

    .entry::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--entry-color, var(--color-primary));
      opacity: 0.8;
    }

    .entry:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-card-hover);
    }

    .entry:active {
      transform: translateY(-2px);
    }

    /* 入口图标 */
    .entry__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: var(--radius-xl);
      background: var(--entry-bg, var(--color-primary-light));
      margin-bottom: var(--spacing-lg);
      transition: transform var(--transition-normal);
    }

    .entry:hover .entry__icon {
      transform: scale(1.08);
    }

    .entry__icon svg {
      width: 32px;
      height: 32px;
      fill: var(--entry-color, var(--color-primary));
    }

    /* 入口标题 */
    .entry__title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-sm);
    }

    /* 入口描述 */
    .entry__desc {
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: var(--spacing-xl);
      min-height: 42px;
    }

    /* 入口按钮 */
    .entry__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      width: 100%;
      height: 44px;
      padding: 0 var(--spacing-lg);
      font-size: 15px;
      font-weight: 500;
      font-family: var(--font-family);
      color: var(--color-text-inverse);
      background: var(--entry-color, var(--color-primary));
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .entry:hover .entry__btn {
      opacity: 0.9;
    }

    .entry__btn:active {
      transform: scale(0.98);
    }

    .entry__btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* ---- 用户端配色 ---- */
    .entry--user {
      --entry-color: var(--color-primary);
      --entry-bg: var(--color-primary-light);
    }

    /* ---- 商户端配色 ---- */
    .entry--merchant {
      --entry-color: var(--color-info);
      --entry-bg: var(--color-info-light);
    }

    /* ---- 管理端配色 ---- */
    .entry--admin {
      --entry-color: var(--color-text-primary);
      --entry-bg: #F0F2F5;
    }

    /* ---- 底部版权 ---- */
    .footer {
      text-align: center;
      padding: var(--spacing-xl) var(--spacing-lg);
      font-size: 12px;
      color: var(--color-text-placeholder);
    }

    .footer__text {
      margin-bottom: var(--spacing-xs, 4px);
    }

    /* ---- 响应式微调 ---- */
    @media (max-width: 767px) {
      .brand__title {
        font-size: 24px;
      }
      .entry {
        padding: var(--spacing-xl);
      }
      .entry__desc {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- 品牌头部 -->
    <header class="brand">
      <div class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4.5 12.5c-.3.3-.1.8.4.8H11l-1 8.5 8.5-10.5c.3-.3.1-.8-.4-.8H12l1-8.5z"/>
        </svg>
      </div>
      <h1 class="brand__title">满电青年</h1>
      <p class="brand__subtitle">电动车综合服务平台 · 请选择对应入口</p>
    </header>

    <!-- 三端入口 -->
    <nav class="entries" aria-label="三端应用入口">
      <!-- 用户端 -->
      <a class="entry entry--user" href="./user/index.html" aria-label="进入用户端">
        <div class="entry__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <h2 class="entry__title">用户端</h2>
        <p class="entry__desc">面向普通用户，提供车辆维修、配件购买、二手车交易、团购等一站式服务</p>
        <span class="entry__btn">
          进入用户端
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
          </svg>
        </span>
      </a>

      <!-- 商户端 -->
      <a class="entry entry--merchant" href="./merchant/index.html" aria-label="进入商户端">
        <div class="entry__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/>
          </svg>
        </div>
        <h2 class="entry__title">商户端</h2>
        <p class="entry__desc">面向入驻商户，提供订单管理、商品上架、营业状态切换、数据统计等功能</p>
        <span class="entry__btn">
          进入商户端
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
          </svg>
        </span>
      </a>

      <!-- 管理端 -->
      <a class="entry entry--admin" href="./admin/index.html" aria-label="进入管理端">
        <div class="entry__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </div>
        <h2 class="entry__title">管理端</h2>
        <p class="entry__desc">面向平台管理员，提供用户管理、商户审核、订单监控、内容运营等后台功能</p>
        <span class="entry__btn">
          进入管理端
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
          </svg>
        </span>
      </a>
    </nav>
  </main>

  <!-- 底部版权 -->
  <footer class="footer">
    <p class="footer__text">© 2026 满电青年 · 电动车综合服务平台</p>
    <p class="footer__text">如需帮助，请联系平台客服</p>
  </footer>
</body>
</html>
