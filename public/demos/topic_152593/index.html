<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日灵感</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');
    :root {
      --bg-primary: #FAF7F2;
      --accent-gold: #C9A962;
      --accent-rose: #F38181;
      --accent-purple: #6366F1;
      --border-color: #EDE8E0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', sans-serif; background: linear-gradient(180deg, #FDFCF7, #F5EEE6); min-height: 100vh; color: #2C2C2C; }
    .font-display { font-family: 'Noto Serif SC', serif; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
    header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); }
    header .container { display: flex; align-items: center; justify-content: space-between; height: 80px; }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .logo-icon { width: 48px; height: 48px; border-radius: 16px; background: linear-gradient(135deg, var(--accent-gold), #E8A87C); display: flex; align-items: center; justify-content: center; }
    .logo-icon svg { width: 24px; height: 24px; fill: white; }
    .logo-text h1 { font-family: 'Noto Serif SC', serif; font-size: 20px; margin-bottom: 2px; }
    .logo-text p { font-size: 12px; color: #8A8A8A; }
    nav { display: flex; gap: 8px; }
    .nav-link { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.3s; color: #8A8A8A; }
    .nav-link.active { background: white; color: var(--accent-gold); box-shadow: 0 4px 20px rgba(201,169,98,0.15); }
    .nav-link svg { width: 18px; height: 18px; }
    main { padding: 32px 0 80px; }
    .greeting { margin-bottom: 40px; }
    .greeting-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .greeting-header svg { width: 24px; height: 24px; }
    .greeting-text { font-family: 'Noto Serif SC', serif; font-size: 28px; }
    .date-info { display: flex; align-items: center; gap: 8px; color: #8A8A8A; font-size: 14px; }
    .date-info svg { width: 16px; height: 16px; }
    .category-section { margin-bottom: 40px; }
    .category-tabs-wrapper { display: flex; align-items: center; gap: 8px; }
    .scroll-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: white; color: var(--accent-gold); cursor: pointer; }
    .scroll-btn svg { width: 18px; height: 18px; }
    .category-tabs-container { flex: 1; overflow: hidden; }
    .category-tabs { display: flex; gap: 12px; overflow-x: auto; padding: 8px 4px; scrollbar-width: none; }
    .category-tabs::-webkit-scrollbar { display: none; }
    .category-tab { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 16px; border: 1px solid var(--border-color); background: white; color: #8A8A8A; font-size: 15px; cursor: pointer; }
    .category-tab.active { border-color: transparent; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .content-card { background: white; border-radius: 24px; box-shadow: 0 8px 32px rgba(44,44,44,0.06); border: 1px solid var(--border-color); overflow: hidden; }
    .card-accent { height: 8px; background: linear-gradient(90deg, var(--accent-gold), rgba(201,169,98,0.5)); }
    .card-content { padding: 32px; }
    .card-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
    .card-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .card-title { font-family: 'Noto Serif SC', serif; font-size: 32px; margin-bottom: 16px; }
    .card-body { font-size: 20px; line-height: 1.8; color: #5A5A5A; margin-bottom: 32px; }
    .card-footer { padding-top: 24px; border-top: 1px solid #F5F1EB; }
    .card-actions { display: flex; gap: 12px; margin-top: 16px; }
    .action-btn { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 12px; border: none; font-size: 14px; cursor: pointer; transition: all 0.3s; }
    .btn-favorite { background: #F5F1EB; color: #8A8A8A; }
    .btn-favorite.active { background: rgba(243,129,129,0.1); color: var(--accent-rose); }
    .btn-favorite.active svg { fill: var(--accent-rose); }
    .btn-copy { background: #F5F1EB; color: #8A8A8A; }
    .action-btn svg { width: 20px; height: 20px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .tag-item { padding: 6px 14px; border-radius: 8px; background: rgba(201,169,98,0.1); color: var(--accent-gold); font-size: 13px; }
    .detail-section { margin-top: 32px; }
    .detail-toggle { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; border-radius: 16px; border: 1px solid var(--border-color); background: linear-gradient(90deg, #FDFCF7, #F5EEE6); color: var(--accent-gold); font-size: 15px; cursor: pointer; }
    .detail-toggle svg { width: 18px; height: 18px; }
    .detail-content { margin-top: 24px; display: none; }
    .detail-content.show { display: block; }
    .detail-box { background: linear-gradient(135deg, #FDFCF7, #F5EEE6); border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .detail-title { font-family: 'Noto Serif SC', serif; font-size: 18px; margin-bottom: 16px; }
    .detail-text { font-size: 15px; line-height: 1.8; color: #5A5A5A; }
    .page-history { display: none; }
    .ai-analysis { background: linear-gradient(135deg, rgba(99,102,241,0.05), rgba(139,92,246,0.05)); border-radius: 16px; padding: 24px; border: 1px solid rgba(99,102,241,0.1); margin-bottom: 32px; }
    .ai-btn { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent-purple), rgba(139,92,246,1)); color: white; font-size: 14px; cursor: pointer; }
    .ai-icon { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--accent-purple), rgba(139,92,246,1)); display: flex; align-items: center; justify-content: center; }
    .ai-icon svg { width: 24px; height: 24px; fill: white; }
    .ai-header { display: flex; align-items: center; justify-content: space-between; }
    .ai-title { display: flex; align-items: center; gap: 12px; }
    .ai-text h3 { font-family: 'Noto Serif SC', serif; font-size: 18px; margin-bottom: 4px; }
    .ai-text p { font-size: 13px; color: #8A8A8A; }
    .result-content { display: none; margin-top: 16px; background: white; border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); }
    .result-content.show { display: block; }
    .result-text { font-size: 15px; line-height: 1.8; color: #5A5A5A; white-space: pre-line; }
    .favorite-list { margin-top: 32px; }
    .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .list-title { font-family: 'Noto Serif SC', serif; font-size: 24px; }
    .list-count { padding: 6px 16px; border-radius: 12px; background: rgba(201,169,98,0.1); color: var(--accent-gold); font-size: 14px; }
    .empty-state { text-align: center; padding: 80px 0; }
    .favorite-item { background: white; border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); margin-bottom: 16px; }
    .item-title { font-family: 'Noto Serif SC', serif; font-size: 18px; margin-bottom: 8px; }
    .item-content { font-size: 14px; line-height: 1.6; color: #5A5A5A; margin-bottom: 12px; }
    .item-actions { display: flex; gap: 8px; }
    .item-action { width: 40px; height: 40px; border-radius: 12px; border: none; background: #F5F1EB; color: #8A8A8A; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .item-action svg { width: 16px; height: 16px; }
    .thought-section { margin-top: 16px; }
    .thought-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 0; border: none; background: transparent; color: var(--accent-gold); font-size: 14px; cursor: pointer; }
    .thought-toggle svg { width: 14px; height: 14px; }
    .thought-content { display: none; margin-top: 12px; padding: 16px; border-radius: 12px; background: linear-gradient(135deg, #FDFCF7, #F5EEE6); border: 1px solid var(--border-color); }
    .thought-content.show { display: block; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
    .modal-overlay.show { display: flex; }
    .modal-content { background: white; border-radius: 24px; width: 100%; max-width: 600px; }
    .modal-accent { height: 8px; background: linear-gradient(90deg, var(--accent-gold), #E8A87C); }
    .modal-body { padding: 32px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .modal-title h2 { font-family: 'Noto Serif SC', serif; font-size: 20px; }
    .modal-close { width: 40px; height: 40px; border-radius: 12px; border: none; background: #F5F1EB; color: #8A8A8A; cursor: pointer; }
    .modal-close svg { width: 18px; height: 18px; }
    .modal-preview { background: linear-gradient(135deg, #FDFCF7, #F5EEE6); border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); margin-bottom: 24px; }
    .preview-label { font-size: 13px; color: #8A8A8A; margin-bottom: 8px; }
    .preview-title { font-family: 'Noto Serif SC', serif; font-size: 18px; margin-bottom: 12px; }
    .preview-content { font-size: 14px; line-height: 1.6; color: #5A5A5A; }
    .form-textarea { width: 100%; height: 144px; padding: 16px; border-radius: 16px; border: 1px solid var(--border-color); background: #FDFCF7; font-size: 15px; resize: none; font-family: 'Noto Sans SC', sans-serif; }
    .form-textarea:focus { outline: none; border-color: var(--accent-gold); }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
    .modal-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; cursor: pointer; }
    .btn-cancel { background: #F5F1EB; color: #8A8A8A; }
    .btn-submit { background: linear-gradient(135deg, var(--accent-gold), #E8A87C); color: white; }
    footer { padding: 32px; text-align: center; border-top: 1px solid var(--border-color); }
    footer p { font-size: 14px; color: #8A8A8A; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="#" class="logo" onclick="navigateTo('home');return false;"><div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg></div><div class="logo-text"><h1>每日灵感</h1><p>让每一天都充满智慧与美好</p></div></a>
      <nav><a href="#" class="nav-link active" id="nav-home" onclick="navigateTo('home');return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>首页</span></a><a href="#" class="nav-link" id="nav-history" onclick="navigateTo('history');return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>收藏</span></a></nav>
    </div>
  </header>
  <main>
    <div class="container">
      <div id="page-home" class="page-home">
        <div class="greeting"><div class="greeting-header"><svg id="time-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg><span class="greeting-text font-display" id="greeting-text"></span></div><div class="date-info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span id="date-text"></span></div></div>
        <div class="category-section">
          <div class="category-tabs-wrapper">
            <button class="scroll-btn" id="scroll-left" disabled onclick="scrollCategories('left')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
            <div class="category-tabs-container"><div class="category-tabs" id="category-tabs"></div></div>
            <button class="scroll-btn" id="scroll-right" onclick="scrollCategories('right')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
        </div>
        <div id="content-card"></div>
      </div>
      <div id="page-history" class="page-history">
        <div class="ai-analysis">
          <div class="ai-header">
            <div class="ai-title"><div class="ai-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="ai-text"><h3>AI 智能分析</h3><p>让 AI 帮你回顾收藏，发现新思考</p></div></div>
            <button class="ai-btn" onclick="analyzeFavorites()"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>生成总结</span></button>
          </div>
          <div class="ai-result" id="ai-result"></div>
        </div>
        <div class="favorite-list" id="favorite-list"></div>
      </div>
    </div>
  </main>
  <footer><p>每日灵感 · 让每一天都充满智慧与美好</p></footer>
  <div class="modal-overlay" id="thought-modal">
    <div class="modal-content"><div class="modal-accent"></div><div class="modal-body">
      <div class="modal-header"><div class="modal-title"><h2>记录你的思考</h2></div><button class="modal-close" onclick="closeThoughtModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
      <div class="modal-preview" id="modal-preview"></div>
      <textarea class="form-textarea" id="thought-input" placeholder="写下你的感悟..."></textarea>
      <div class="modal-actions"><button class="modal-btn btn-cancel" onclick="closeThoughtModal()">暂不记录</button><button class="modal-btn btn-submit" onclick="submitThought()">保存思考</button></div>
    </div></div>
  </div>
  <script>
    const categories = [
      { type: 'quote', label: '书籍金句', icon: '📚', color: '#C9A962' },
      { type: 'story', label: '小故事', icon: '📖', color: '#E8A87C' },
      { type: 'poem', label: '诗词', icon: '🌸', color: '#FF6B6B' },
      { type: 'history', label: '历史故事', icon: '⏳', color: '#9B59B6' },
      { type: 'celebrity', label: '名人伟迹', icon: '🌟', color: '#4D96FF' },
      { type: 'landmark', label: '名胜古迹', icon: '🏯', color: '#8B7355' },
      { type: 'philosophy', label: '哲学思辨', icon: '💭', color: '#6BCB77' },
      { type: 'wisdom', label: '人生智慧', icon: '✨', color: '#FFD93D' },
    ];
    const contents = {
      quote: [
        { id: 'q1', type: 'quote', title: '活着', content: '人是为活着本身而活着的，而不是为了活着之外的任何事物所活着。', source: '《活着》', author: '余华', tags: ['生命', '活着', '哲学'], background: '《活着》是余华的代表作，讲述了福贵一生的悲欢离合。', story: '余华在创作《活着》时，最初的构思是一部关于死亡的小说，但最终却写成了对生命的礼赞。' },
        { id: 'q2', type: 'quote', title: '英雄主义', content: '世界上只有一种英雄主义，就是看清生活的真相之后依然热爱生活。', source: '《米开朗基罗传》', author: '罗曼罗兰', tags: ['英雄', '生活', '勇气'], background: '这句话是对艺术家米开朗基罗一生的总结。', story: '罗曼罗兰认为，真正的英雄不是那些征服世界的人，而是在认清生活的艰难后依然选择热爱它的人。' },
      ],
      story: [{ id: 's1', type: 'story', title: '一杯牛奶', content: '一个贫穷的小男孩挨家挨户推销商品，饥饿难耐时，一位年轻女子给了他一杯牛奶。多年后，女子病重，小男孩已成为著名医生，他认出了她，并为她支付了所有医疗费用。', source: '民间故事', tags: ['感恩', '善良', '回报'], background: '这个故事告诉我们，善良是一种循环。', story: '这个故事的原型来源于美国医生霍华德凯利的真实经历。一杯牛奶的善意，最终换来了生命的救治。' }],
      poem: [{ id: 'p1', type: 'poem', title: '静夜思', content: '床前明月光，疑是地上霜。举头望明月，低头思故乡。', source: '《李太白全集》', author: '李白', tags: ['思乡', '明月', '唐诗'], background: '《静夜思》是唐代诗人李白的名篇。', story: '这首诗写的是在寂静的月夜思念家乡的感受。李白一生漂泊，对故乡有着深深的眷恋。' }],
      history: [{ id: 'h1', type: 'history', title: '卧薪尝胆', content: '春秋时期，越王勾践被吴王夫差打败，被迫到吴国为奴。三年后回国，他睡在柴草上，每天尝一尝苦胆的味道，提醒自己不忘耻辱。', source: '《史记越王勾践世家》', tags: ['励志', '复仇', '春秋'], background: '卧薪尝胆是一个著名的历史典故。', story: '勾践回国后，身自耕作，夫人自织，食不加肉，衣不重采。经过十年生聚、十年教训，最终灭吴复仇。' }],
      celebrity: [{ id: 'c1', type: 'celebrity', title: '霍金', content: '史蒂芬霍金在21岁时被诊断出患有渐冻症，医生断言他只能活两年。但他不仅活了下来，还成为了世界上最伟大的物理学家之一。', source: '人物传记', tags: ['科学', '励志', '物理'], background: '史蒂芬威廉霍金是英国理论物理学家。', story: '霍金在被诊断出渐冻症后，并没有放弃对科学的追求。他提出了黑洞辐射理论，撰写了畅销全球的《时间简史》。' }],
      landmark: [{ id: 'l1', type: 'landmark', title: '长城', content: '长城是中国古代的军事防御工程，是世界上修建时间最长、工程量最大的古代防御工程。', source: '世界文化遗产', tags: ['建筑', '历史', '中国'], background: '长城修筑的历史可上溯到西周时期。', story: '长城不是一道单纯孤立的城墙，而是以城墙为主体，同大量的城、障、亭、标相结合的防御体系。' }],
      philosophy: [{ id: 'ph1', type: 'philosophy', title: '苏格拉底', content: '神谕说苏格拉底是雅典最有智慧的人。苏格拉底感到困惑，因为他认为自己什么都不知道。', source: '《申辩篇》', author: '柏拉图', tags: ['哲学', '智慧', '苏格拉底'], background: '这个故事出自柏拉图的《申辩篇》。', story: '苏格拉底的这句"我知道我一无所知"成为了西方哲学的经典名言。真正的智慧在于认识到自己的无知。' }],
      wisdom: [{ id: 'w1', type: 'wisdom', title: '塞翁失马', content: '边塞有位老人丢了一匹马，邻居来安慰他，他说：怎么知道这不是福气呢？', source: '《淮南子》', tags: ['祸福', '辩证', '道家'], background: '塞翁失马是一个著名的道家典故。', story: '这个故事告诉我们，世间的好事与坏事都不是绝对的，在一定条件下可以相互转化。' }],
    };
    let currentType = 'quote';
    let currentContent = null;
    let favorites = [];

    function init() {
      loadFavorites();
      updateDateAndGreeting();
      renderCategories();
      loadDailyContent();
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeThoughtModal(); });
    }

    function updateDateAndGreeting() {
      const now = new Date();
      const hour = now.getHours();
      const timeIcon = document.getElementById('time-icon');
      const greetingText = document.getElementById('greeting-text');
      const dateText = document.getElementById('date-text');
      if (hour < 9) {
        timeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        timeIcon.style.color = '#F39C12';
        greetingText.textContent = '早安，朋友';
      } else if (hour < 17) {
        timeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        timeIcon.style.color = '#F39C12';
        greetingText.textContent = hour < 12 ? '上午好，朋友' : '下午好，朋友';
      } else {
        timeIcon.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
        timeIcon.style.color = '#9B59B6';
        greetingText.textContent = '晚上好，朋友';
      }
      dateText.textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }

    function renderCategories() {
      document.getElementById('category-tabs').innerHTML = categories.map(cat => '<button class="category-tab ' + (currentType === cat.type ? 'active' : '') + '" style="' + (currentType === cat.type ? 'background-color:' + cat.color + '15;color:' + cat.color + ';border-color:' + cat.color + '30;' : '') + '" onclick="switchCategory(\'' + cat.type + '\')"><span>' + cat.icon + '</span>' + cat.label + '</button>').join('');
    }

    function switchCategory(type) { currentType = type; renderCategories(); loadDailyContent(); }

    function getDayOfYear() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      return Math.floor((now.getTime() - start.getTime()) / (1000 * 60 * 60 * 24));
    }

    function loadDailyContent() {
      const dayOfYear = getDayOfYear();
      const items = contents[currentType] || contents.quote;
      currentContent = items[dayOfYear % items.length];
      renderContentCard();
    }

    function renderContentCard() {
      const category = categories.find(c => c.type === currentContent.type);
      const isFavorite = favorites.some(f => f.id === currentContent.id);
      const hasDetail = currentContent.background || currentContent.story;
      document.getElementById('content-card').innerHTML = '<div class="content-card"><div class="card-accent" style="background:linear-gradient(90deg,' + category.color + ',' + category.color + '80)"></div><div class="card-content"><div class="card-header"><div class="card-icon" style="background-color:' + category.color + '15">' + category.icon + '</div><span style="background-color:' + category.color + '15;color:' + category.color + ';padding:6px 16px;border-radius:12px;font-size:14px;">' + category.label + '</span></div><h2 class="card-title font-display">' + currentContent.title + '</h2><div class="card-body">' + currentContent.content + '</div><div class="card-footer"><div class="card-actions"><button class="action-btn btn-favorite ' + (isFavorite ? 'active' : '') + '" onclick="toggleFavorite()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>' + (isFavorite ? '已喜欢' : '喜欢') + '</span></button><button class="action-btn btn-copy" onclick="copyContent()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>复制</span></button></div></div><div class="card-tags">' + currentContent.tags.map(tag => '<span class="tag-item">' + tag + '</span>').join('') + '</div>' + (hasDetail ? '<div class="detail-section"><button class="detail-toggle" onclick="toggleDetail()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>查看更多</button><div class="detail-content" id="detail-content">' + (currentContent.background ? '<div class="detail-box"><div class="detail-title">背景故事</div><p class="detail-text">' + currentContent.background + '</p></div>' : '') + (currentContent.story ? '<div class="detail-box"><div class="detail-title">详细故事</div><p class="detail-text">' + currentContent.story + '</p></div>' : '') + '</div></div>' : '') + '</div></div>';
    }

    function toggleDetail() { const content = document.getElementById('detail-content'); if (content) content.classList.toggle('show'); }

    function scrollCategories(direction) {
      const tabs = document.getElementById('category-tabs');
      tabs.scrollBy({ left: direction === 'left' ? -200 : 200, behavior: 'smooth' });
    }

    function toggleFavorite() {
      const isFavorite = favorites.some(f => f.id === currentContent.id);
      if (isFavorite) removeFavorite(currentContent.id);
      else openThoughtModal();
    }

    function openThoughtModal() {
      const modal = document.getElementById('thought-modal');
      const preview = document.getElementById('modal-preview');
      preview.innerHTML = '<div class="preview-label">收藏内容</div><div class="preview-title">' + currentContent.title + '</div><div class="preview-content">' + currentContent.content + '</div>';
      modal.classList.add('show');
    }

    function closeThoughtModal() { document.getElementById('thought-modal').classList.remove('show'); }

    function submitThought() {
      const thought = document.getElementById('thought-input').value.trim();
      addFavorite(thought);
      closeThoughtModal();
      document.getElementById('thought-input').value = '';
    }

    function loadFavorites() {
      try {
        const saved = localStorage.getItem('daily-inspiration-favorites');
        favorites = saved ? JSON.parse(saved) : [];
      } catch { favorites = []; }
    }

    function saveFavorites() { localStorage.setItem('daily-inspiration-favorites', JSON.stringify(favorites)); }

    function addFavorite(thought) {
      const favorite = { ...currentContent, addedAt: new Date().toISOString(), thought };
      favorites.unshift(favorite);
      saveFavorites();
      renderContentCard();
      if (document.getElementById('page-history').style.display === 'block') renderFavorites();
    }

    function removeFavorite(id) {
      favorites = favorites.filter(f => f.id !== id);
      saveFavorites();
      renderContentCard();
      if (document.getElementById('page-history').style.display === 'block') renderFavorites();
    }

    function copyContent() {
      navigator.clipboard.writeText(currentContent.title + '\n' + currentContent.content + '\n\n来源：' + currentContent.source);
      alert('已复制到剪贴板');
    }

    function navigateTo(page) {
      document.getElementById('page-home').style.display = page === 'home' ? 'block' : 'none';
      document.getElementById('page-history').style.display = page === 'history' ? 'block' : 'none';
      document.getElementById('nav-home').classList.toggle('active', page === 'home');
      document.getElementById('nav-history').classList.toggle('active', page === 'history');
      if (page === 'history') renderFavorites();
    }

    function renderFavorites() {
      const container = document.getElementById('favorite-list');
      if (favorites.length === 0) {
        container.innerHTML = '<div class="empty-state"><div style="width:80px;height:80px;border-radius:50%;background:#F5F1EB;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;"><svg viewBox="0 0 24 24" width="40" height="40" color="#DCC87A"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div class="list-title">暂无收藏</div><p style="color:#8A8A8A;">去首页发现一些灵感吧</p></div>';
        return;
      }
      container.innerHTML = '<div class="list-header"><div class="list-title">收藏列表</div><span class="list-count">' + favorites.length + ' 条</span></div>' + favorites.map((f, index) => {
        const category = categories.find(c => c.type === f.type);
        const date = new Date(f.addedAt).toLocaleDateString('zh-CN');
        return '<div class="favorite-item"><div class="item-meta"><span style="font-size:24px;">' + category.icon + '</span><span class="item-label" style="background-color:' + category.color + '15;color:' + category.color + '">' + category.label + '</span><span class="item-date">' + date + '</span></div><div class="item-title">' + f.title + '</div><div class="item-content">' + f.content + '</div><div class="item-footer">' + f.source + '<div class="item-actions"><button class="item-action" onclick="removeFavorite(\'' + f.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12H4"/></svg></button></div></div>' + (f.thought ? '<div class="thought-section"><button class="thought-toggle" onclick="toggleThought(\'thought-' + index + '\')">查看我的思考<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button><div class="thought-content" id="thought-' + index + '"><p class="thought-text">' + f.thought + '</p></div></div>' : '') + '</div>';
      }).join('');
    }

    function toggleThought(id) { document.getElementById(id).classList.toggle('show'); }

    function analyzeFavorites() {
      if (favorites.length === 0) { alert('请先收藏一些内容'); return; }
      const result = document.getElementById('ai-result');
      const tagCount = {};
      favorites.forEach(f => f.tags.forEach(tag => tagCount[tag] = (tagCount[tag] || 0) + 1));
      const topTags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 3).map(t => t[0]).join('、');
      const analysis = '根据您的收藏内容，AI为您生成以下总结：\n\n【收藏概览】\n您共收藏了 ' + favorites.length + ' 条灵感内容。\n\n【兴趣分析】\n您最感兴趣的主题是：' + topTags + '。\n\n【学习建议】\n' + (favorites.length >= 5 ? '您已经积累了不少灵感，建议定期回顾这些收藏，将它们与您的生活经历相结合，可能会产生新的思考。' : '继续保持收藏的习惯，随着积累的增多，您会发现更多有价值的内容。') + '\n\n【回顾提示】\n试着将不同分类的收藏联系起来，例如将历史故事与人生智慧相结合，您可能会发现更深层次的感悟。';
      result.innerHTML = '<div class="result-content show"><div class="result-text">' + analysis + '</div></div>';
    }

    init();
  </script>
</body>
</html>
