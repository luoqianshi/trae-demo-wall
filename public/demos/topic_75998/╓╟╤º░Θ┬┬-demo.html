<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>智学伴侣 — 交互Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo-app.css">
</head>
<body>

<div class="app-shell">

  <!-- App Header -->
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-brand">
        <div class="app-logo">Z</div>
        <div>
          <h1 class="app-title">智学伴侣</h1>
          <span class="app-subtitle">前端开发 · 知识图谱</span>
        </div>
      </div>
      <div class="app-header-actions">
        <button class="icon-btn" id="btn-reset-data" aria-label="重置演示数据" title="重置演示数据">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-content">

    <!-- 页面1：知识图谱 -->
    <section class="page page-active" id="page-graph" aria-labelledby="graph-title" tabindex="-1">
      <h2 id="graph-title" class="sr-only">知识图谱</h2>

      <div class="graph-toolbar">
        <div class="graph-legend">
          <span class="legend-item"><span class="legend-dot" style="background:#00e5a0"></span>已掌握</span>
          <span class="legend-item"><span class="legend-dot" style="background:#fdcb6e"></span>学习中</span>
          <span class="legend-item"><span class="legend-dot" style="background:#6c5ce7"></span>已解锁</span>
          <span class="legend-item"><span class="legend-dot" style="background:#3a3a3a;border:1px solid #555"></span>未解锁</span>
        </div>
        <span class="graph-hint">拖拽移动 · 滚轮缩放 · 点击查看详情</span>
      </div>

      <div class="graph-canvas-wrapper">
        <canvas id="graph-canvas"></canvas>
        <div class="graph-tooltip" id="graph-tooltip" role="tooltip" aria-hidden="true"></div>
      </div>

      <!-- 节点详情弹窗 -->
      <div class="sheet-overlay" id="sheet-overlay" aria-hidden="true"></div>
      <div class="sheet" id="node-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-header">
          <span class="sheet-status" id="sheet-status"></span>
          <h3 id="sheet-title"></h3>
          <button class="sheet-close" id="sheet-close" aria-label="关闭详情">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <dl class="sheet-body">
          <div class="sheet-row">
            <dt>前置知识</dt>
            <dd id="sheet-deps"></dd>
          </div>
          <div class="sheet-row">
            <dt>预计学习时长</dt>
            <dd id="sheet-duration"></dd>
          </div>
          <div class="sheet-row">
            <dt>掌握程度</dt>
            <dd id="sheet-progress"></dd>
          </div>
          <div class="sheet-row">
            <dt>学习建议</dt>
            <dd id="sheet-tip"></dd>
          </div>
        </dl>
        <div class="sheet-actions">
          <button class="btn-primary" id="sheet-action-btn">开始学习</button>
        </div>
      </div>
    </section>

    <!-- 页面2：专注计时 -->
    <section class="page" id="page-timer" aria-labelledby="timer-title" tabindex="-1" hidden>
      <h2 id="timer-title" class="sr-only">专注计时</h2>

      <div class="timer-container">
        <div class="timer-status" id="timer-status-label">准备开始</div>

        <div class="timer-ring-wrapper">
          <svg class="timer-ring" viewBox="0 0 280 280" role="img" aria-label="专注进度圆环">
            <circle class="timer-ring-bg" cx="140" cy="140" r="120"/>
            <circle class="timer-ring-progress" id="timer-progress-ring" cx="140" cy="140" r="120"
                    stroke-dasharray="753.982" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-display" id="timer-display">25:00</div>
        </div>

        <div class="timer-mode-indicator" id="timer-mode-indicator">
          <span class="mode-dot" id="mode-dot"></span>
          <span id="mode-text">专注模式</span>
        </div>

        <div class="timer-controls">
          <button class="timer-btn timer-btn-secondary" id="btn-reset" aria-label="重置计时器">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            重置
          </button>
          <button class="timer-btn timer-btn-primary" id="btn-start" aria-label="开始专注">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            开始专注
          </button>
          <button class="timer-btn timer-btn-secondary" id="btn-skip" aria-label="跳过当前阶段">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            跳过
          </button>
        </div>

        <div class="timer-stats">
          <div class="stat-card">
            <div class="stat-value" id="stat-pomodoros">0</div>
            <div class="stat-label">今日番茄</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-focus-time">0 分钟</div>
            <div class="stat-label">专注时长</div>
          </div>
        </div>

        <div class="timer-extras">
          <button class="toggle-btn" id="btn-white-noise" aria-pressed="false" aria-label="白噪音开关">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            <span>白噪音</span>
            <span class="toggle-indicator" id="noise-indicator">关闭</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 页面3：智能学习规划 -->
    <section class="page" id="page-plan" aria-labelledby="plan-title" tabindex="-1" hidden>
      <h2 id="plan-title" class="sr-only">智能学习规划</h2>

      <div class="plan-container">
        <!-- 今日进度概览 -->
        <div class="plan-overview">
          <div class="plan-ring-wrapper">
            <svg class="plan-ring" viewBox="0 0 120 120" role="img" aria-label="今日任务完成进度">
              <circle class="plan-ring-bg" cx="60" cy="60" r="50"/>
              <circle class="plan-ring-progress" id="plan-progress-ring" cx="60" cy="60" r="50"
                      stroke-dasharray="314.159" stroke-dashoffset="314.159"/>
            </svg>
            <div class="plan-ring-text" id="plan-progress-text">0/0</div>
          </div>
          <div class="plan-stats">
            <div class="plan-stat" id="plan-pomodoro-stat">
              <span class="plan-stat-value" id="plan-pomodoro-count">0</span>
              <span class="plan-stat-label">今日番茄</span>
            </div>
          </div>
        </div>

        <!-- 日期选择条 -->
        <div class="plan-date-strip" id="plan-date-strip" role="listbox" aria-label="选择日期">
        </div>

        <!-- 任务列表 -->
        <div class="plan-task-list" id="plan-task-list" aria-label="今日学习任务">
        </div>

        <!-- 今日推荐 -->
        <div class="plan-recommend">
          <h3 class="plan-section-title">今日推荐</h3>
          <div class="plan-recommend-list" id="plan-recommend-list">
          </div>
        </div>
      </div>
    </section>

    <!-- 页面4：学习统计看板 -->
    <section class="page" id="page-stats" aria-labelledby="stats-title" tabindex="-1" hidden>
      <h2 id="stats-title" class="sr-only">学习统计看板</h2>

      <div class="stats-container">

        <!-- 概览卡片行 -->
        <div class="stats-summary">
          <div class="stat-card">
            <div class="stat-value" id="stats-today-time">0 分钟</div>
            <div class="stat-label">今日学习时长</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stats-total-pomodoros">0</div>
            <div class="stat-label">累计番茄数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stats-mastery-rate">0%</div>
            <div class="stat-label">知识掌握率</div>
          </div>
        </div>

        <!-- 知识掌握分布 -->
        <div class="stats-mastery-card">
          <div class="stats-ring-wrapper">
            <svg class="stats-ring" viewBox="0 0 120 120" role="img" aria-label="知识掌握率圆环">
              <circle class="stats-ring-bg" cx="60" cy="60" r="50"/>
              <circle class="stats-ring-progress" id="stats-mastery-ring" cx="60" cy="60" r="50"
                      stroke-dasharray="314.159" stroke-dashoffset="314.159"/>
            </svg>
            <div class="stats-ring-text" id="stats-mastery-text">0%</div>
          </div>
          <div class="stats-mastery-detail" id="stats-mastery-detail">
          </div>
        </div>

        <!-- 本周任务完成趋势折线图 -->
        <div class="stats-chart-card">
          <h3 class="stats-chart-title">本周任务完成趋势</h3>
          <div class="stats-chart-legend">
            <span class="chart-legend-item"><span class="chart-legend-line" style="background:#00e5a0"></span>已完成</span>
            <span class="chart-legend-item"><span class="chart-legend-line" style="background:rgba(255,255,255,0.15)"></span>总任务数</span>
          </div>
          <div class="stats-chart-wrapper">
            <canvas id="stats-trend-canvas" aria-label="本周任务完成趋势折线图" role="img"></canvas>
          </div>
        </div>

        <!-- 学习时间分布柱状图 -->
        <div class="stats-chart-card">
          <h3 class="stats-chart-title">学习时间分布（分钟）</h3>
          <div class="stats-chart-wrapper">
            <canvas id="stats-time-canvas" aria-label="本周学习时间分布柱状图" role="img"></canvas>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar" aria-label="主导航">
    <button class="tab-btn tab-btn-active" data-tab="page-graph" aria-selected="true" aria-label="知识图谱" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><line x1="11" y1="11" x2="7" y2="7"/><line x1="13" y1="11" x2="17" y2="7"/><line x1="11" y1="13" x2="7" y2="17"/><line x1="13" y1="13" x2="17" y2="17"/></svg>
      <span>知识图谱</span>
    </button>
    <button class="tab-btn" data-tab="page-timer" aria-selected="false" aria-label="专注计时" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>专注计时</span>
    </button>
    <button class="tab-btn" data-tab="page-plan" aria-selected="false" aria-label="智能学习规划" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
      <span>学习规划</span>
    </button>
    <button class="tab-btn" data-tab="page-stats" aria-selected="false" aria-label="学习统计" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>学习统计</span>
    </button>
  </nav>

</div>

<script src="demo-app.js"></script>
</body>
</html>
