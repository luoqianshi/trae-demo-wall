<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全能画板 Pro - 专业绘画工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 画布区域 */
        .canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #ffffff;
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #mainCanvas {
            display: block;
            cursor: crosshair;
        }

        #mainCanvas.effect-paper {
            filter: contrast(1.04) saturate(0.92);
            background-color: #fffaf0;
        }

        #mainCanvas.effect-vivid {
            filter: saturate(1.45) contrast(1.08);
        }

        #mainCanvas.effect-soft {
            filter: saturate(0.85) brightness(1.05);
        }

        #mainCanvas.effect-mono {
            filter: grayscale(1);
        }

        #mainCanvas.effect-blur {
            filter: blur(0.65px) saturate(1.08);
        }

        #mainCanvas.effect-glow {
            filter: saturate(1.25) drop-shadow(0 0 14px rgba(74, 144, 217, 0.62));
        }

        #mainCanvas.effect-shadow {
            filter: contrast(1.08) drop-shadow(10px 12px 18px rgba(0, 0, 0, 0.32));
        }

        .eraser-cursor {
            position: absolute;
            left: 0;
            top: 0;
            display: none;
            border: 2px solid #000;
            border-radius: 50%;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 120;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.75);
        }

        .line-preview {
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
            display: none;
            border-top: 2px solid #111;
            pointer-events: none;
            z-index: 121;
            transform-origin: 0 0;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7);
        }

        /* 顶部工具栏 */
        .top-toolbar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 8px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .top-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #f0f0f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .top-btn:hover {
            background: #e0e0e0;
            transform: scale(1.1);
        }

        .top-btn.active {
            background: #4a90d9;
            color: white;
        }

        .toolbar-select {
            height: 34px;
            border: 1px solid #ddd;
            border-radius: 18px;
            padding: 0 12px;
            background: #f8f9fa;
            color: #333;
            outline: none;
            cursor: pointer;
        }

        .auto-save-status {
            min-width: 84px;
            font-size: 12px;
            color: #4a90d9;
            white-space: nowrap;
        }

        .color-picker-wrapper {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid #ddd;
        }

        .color-picker-wrapper input[type="color"] {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            cursor: pointer;
            border: none;
            padding: 0;
            margin: 0;
        }

        /* 左侧工具面板 */
        .tools-panel {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0 16px 16px 0;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            gap: 8px;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 200;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .tools-panel.expanded {
            width: 280px;
            padding: 15px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            opacity: 1;
            white-space: nowrap;
        }

        .tools-panel.expanded .panel-title {
            opacity: 1;
        }

        .toggle-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #4a90d9;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: transform 0.3s;
            flex-shrink: 0;
            display: none;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
        }

        .tools-panel.expanded .toggle-btn {
            transform: rotate(180deg);
        }

        .tool-category {
            width: 100%;
            margin-bottom: 10px;
        }

        .category-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            padding-left: 5px;
            opacity: 1;
            white-space: nowrap;
        }

        .tools-panel.expanded .category-title {
            opacity: 1;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
        }

        .tools-panel.expanded .tools-grid {
            grid-template-columns: repeat(4, 1fr);
        }

        .tool-item {
            width: 45px;
            height: 45px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            margin: 0 auto;
        }

        .tool-item:hover {
            background: #e9ecef;
            border-color: #4a90d9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .tool-item.active {
            background: #4a90d9;
            color: white;
            border-color: #357abd;
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.4);
        }

        .tool-icon {
            font-size: 20px;
            line-height: 1;
        }

        .tool-name {
            font-size: 9px;
            margin-top: 2px;
            opacity: 1;
            white-space: nowrap;
        }

        .tools-panel.expanded .tool-name {
            opacity: 1;
        }

        .tool-item.active .tool-name {
            color: white;
        }

        /* 笔刷参数弹窗 */
        .brush-settings {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 300px;
        }

        .brush-settings.show {
            display: block;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .settings-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .close-settings {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-settings:hover {
            background: #e0e0e0;
        }

        .setting-row {
            margin-bottom: 18px;
        }

        .setting-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        .setting-value {
            font-weight: bold;
            color: #4a90d9;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4a90d9;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4a90d9;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .settings-select {
            width: 100%;
            height: 36px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 0 10px;
            background: #f8f9fa;
            color: #333;
            outline: none;
        }

        .settings-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        .settings-save {
            border: none;
            border-radius: 18px;
            background: #4a90d9;
            color: white;
            padding: 9px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .settings-save:hover {
            background: #357abd;
        }

        .preview-area {
            width: 100%;
            height: 80px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
        }

        #brushPreview {
            border-radius: 50%;
            background: #333;
        }

        /* 遮罩层 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        /* 尺子工具 */
        .ruler {
            display: none;
            position: absolute;
            width: 300px;
            height: 40px;
            background: linear-gradient(to right, 
                transparent 0%, 
                rgba(74, 144, 217, 0.1) 0%,
                rgba(74, 144, 217, 0.1) 100%,
                transparent 100%);
            border-top: 2px solid #4a90d9;
            border-bottom: 2px solid #4a90d9;
            cursor: move;
            z-index: 50;
            pointer-events: all;
        }

        .ruler.show {
            display: block;
        }

        .ruler-marks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ruler-mark {
            position: absolute;
            top: 0;
            width: 1px;
            height: 10px;
            background: #4a90d9;
        }

        .ruler-mark.major {
            height: 15px;
            width: 2px;
        }

        .ruler-label {
            position: absolute;
            top: 18px;
            font-size: 10px;
            color: #4a90d9;
            transform: translateX(-50%);
        }

        /* 提示信息 */
        .tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .tooltip.show {
            opacity: 1;
        }

        /* 尺寸信息 */
        .size-info {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧工具面板 -->
        <div class="tools-panel" id="toolsPanel">
            <div class="panel-header">
                <span class="panel-title">🎨 画笔工具</span>
                <button class="toggle-btn" id="toggleBtn">▶</button>
            </div>

            <div class="tool-category">
                <div class="category-title">基础工具</div>
                <div class="tools-grid">
                    <div class="tool-item active" data-tool="pencil" data-name="铅笔">
                        <span class="tool-icon">✏️</span>
                        <span class="tool-name">铅笔</span>
                    </div>
                    <div class="tool-item" data-tool="pen" data-name="钢笔">
                        <span class="tool-icon">🖊️</span>
                        <span class="tool-name">钢笔</span>
                    </div>
                    <div class="tool-item" data-tool="brush" data-name="毛笔">
                        <span class="tool-icon">🖌️</span>
                        <span class="tool-name">毛笔</span>
                    </div>
                    <div class="tool-item" data-tool="marker" data-name="马克笔">
                        <span class="tool-icon">🖍️</span>
                        <span class="tool-name">马克笔</span>
                    </div>
                </div>
            </div>

            <div class="tool-category">
                <div class="category-title">艺术笔刷</div>
                <div class="tools-grid">
                    <div class="tool-item" data-tool="watercolor" data-name="水彩">
                        <span class="tool-icon">💧</span>
                        <span class="tool-name">水彩</span>
                    </div>
                    <div class="tool-item" data-tool="oil" data-name="油画">
                        <span class="tool-icon">🎨</span>
                        <span class="tool-name">油画</span>
                    </div>
                    <div class="tool-item" data-tool="pastel" data-name="粉笔">
                        <span class="tool-icon">🧵</span>
                        <span class="tool-name">粉笔</span>
                    </div>
                    <div class="tool-item" data-tool="charcoal" data-name="炭笔">
                        <span class="tool-icon">🖤</span>
                        <span class="tool-name">炭笔</span>
                    </div>
                    <div class="tool-item" data-tool="spray" data-name="喷枪">
                        <span class="tool-icon">💨</span>
                        <span class="tool-name">喷枪</span>
                    </div>
                    <div class="tool-item" data-tool="neon" data-name="霓虹">
                        <span class="tool-icon">✨</span>
                        <span class="tool-name">霓虹</span>
                    </div>
                    <div class="tool-item" data-tool="sketch" data-name="素描">
                        <span class="tool-icon">📐</span>
                        <span class="tool-name">素描</span>
                    </div>
                    <div class="tool-item" data-tool="ink" data-name="墨汁">
                        <span class="tool-icon">🖋️</span>
                        <span class="tool-name">墨汁</span>
                    </div>
                </div>
            </div>

            <div class="tool-category">
                <div class="category-title">特殊效果</div>
                <div class="tools-grid">
                    <div class="tool-item" data-tool="galaxy" data-name="星空">
                        <span class="tool-icon">🌌</span>
                        <span class="tool-name">星空</span>
                    </div>
                    <div class="tool-item" data-tool="fire" data-name="火焰">
                        <span class="tool-icon">🔥</span>
                        <span class="tool-name">火焰</span>
                    </div>
                    <div class="tool-item" data-tool="ice" data-name="冰霜">
                        <span class="tool-icon">❄️</span>
                        <span class="tool-name">冰霜</span>
                    </div>
                    <div class="tool-item" data-tool="rainbow" data-name="彩虹">
                        <span class="tool-icon">🌈</span>
                        <span class="tool-name">彩虹</span>
                    </div>
                    <div class="tool-item" data-tool="pixel" data-name="像素">
                        <span class="tool-icon">▦</span>
                        <span class="tool-name">像素</span>
                    </div>
                    <div class="tool-item" data-tool="sparkle" data-name="闪粉">
                        <span class="tool-icon">✦</span>
                        <span class="tool-name">闪粉</span>
                    </div>
                    <div class="tool-item" data-tool="leaf" data-name="叶片">
                        <span class="tool-icon">🍃</span>
                        <span class="tool-name">叶片</span>
                    </div>
                    <div class="tool-item" data-tool="bubble" data-name="气泡">
                        <span class="tool-icon">🫧</span>
                        <span class="tool-name">气泡</span>
                    </div>
                    <div class="tool-item" data-tool="lightning" data-name="闪电">
                        <span class="tool-icon">⚡</span>
                        <span class="tool-name">闪电</span>
                    </div>
                    <div class="tool-item" data-tool="smoke" data-name="烟雾">
                        <span class="tool-icon">☁️</span>
                        <span class="tool-name">烟雾</span>
                    </div>
                    <div class="tool-item" data-tool="starlight" data-name="星光笔">
                        <span class="tool-icon">🌟</span>
                        <span class="tool-name">星光笔</span>
                    </div>
                    <div class="tool-item" data-tool="mapleLeaf" data-name="草叶笔">
                        <span class="tool-icon">🍁</span>
                        <span class="tool-name">草叶笔</span>
                    </div>
                    <div class="tool-item" data-tool="texture" data-name="纹理笔">
                        <span class="tool-icon">▧</span>
                        <span class="tool-name">纹理笔</span>
                    </div>
                    <div class="tool-item" data-tool="effectGlow" data-name="发光">
                        <span class="tool-icon">💡</span>
                        <span class="tool-name">发光</span>
                    </div>
                    <div class="tool-item" data-tool="particle" data-name="颗粒">
                        <span class="tool-icon">⋰</span>
                        <span class="tool-name">颗粒</span>
                    </div>
                    <div class="tool-item" data-tool="effectShadow" data-name="阴影">
                        <span class="tool-icon">◒</span>
                        <span class="tool-name">阴影</span>
                    </div>
                    <div class="tool-item" data-tool="mirror" data-name="镜像">
                        <span class="tool-icon">⇆</span>
                        <span class="tool-name">镜像</span>
                    </div>
                    <div class="tool-item" data-tool="soften" data-name="柔化">
                        <span class="tool-icon">〰</span>
                        <span class="tool-name">柔化</span>
                    </div>
                </div>
            </div>

            <div class="tool-category">
                <div class="category-title">辅助工具</div>
                <div class="tools-grid">
                    <div class="tool-item" data-tool="straightLine" data-name="直线">
                        <span class="tool-icon">／</span>
                        <span class="tool-name">直线</span>
                    </div>
                    <div class="tool-item" data-tool="baseCoat" data-name="铺底">
                        <span class="tool-icon">▰</span>
                        <span class="tool-name">铺底</span>
                    </div>
                    <div class="tool-item" data-tool="eraser" data-name="橡皮">
                        <span class="tool-icon">🧹</span>
                        <span class="tool-name">橡皮</span>
                    </div>
                    <div class="tool-item" data-tool="ruler" data-name="尺子">
                        <span class="tool-icon">📏</span>
                        <span class="tool-name">尺子</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 画布区域 -->
        <div class="canvas-area" id="canvasArea">
            <div class="top-toolbar">
                <button class="top-btn" id="undoBtn" title="撤销 (Ctrl+Z)">↩️</button>
                <button class="top-btn" id="redoBtn" title="重做 (Ctrl+Y)">↪️</button>
                <div style="width: 1px; height: 24px; background: #ddd;"></div>
                <div class="color-picker-wrapper" title="选择颜色">
                    <input type="color" id="colorPicker" value="#333333">
                </div>
                <select class="toolbar-select" id="effectSelect" title="画布特效">
                    <option value="none">原始</option>
                    <option value="paper">纸张</option>
                    <option value="vivid">鲜艳</option>
                    <option value="soft">柔和</option>
                    <option value="mono">黑白</option>
                    <option value="blur">柔化</option>
                    <option value="glow">发光</option>
                    <option value="shadow">阴影</option>
                </select>
                <button class="top-btn" id="clearBtn" title="清空画布">🗑️</button>
                <button class="top-btn" id="saveBtn" title="保存作品">💾</button>
                <span class="auto-save-status" id="autoSaveStatus">自动保存开启</span>
            </div>

            <canvas id="mainCanvas"></canvas>
            <div class="eraser-cursor" id="eraserCursor"></div>
            <div class="line-preview" id="linePreview"></div>

            <div class="ruler" id="ruler">
                <div class="ruler-marks" id="rulerMarks"></div>
            </div>

            <div class="size-info" id="sizeInfo">
                画布: <span id="canvasSize">800 x 600</span>
            </div>
        </div>
    </div>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 笔刷设置弹窗 -->
    <div class="brush-settings" id="brushSettings">
        <div class="settings-header">
            <span class="settings-title" id="settingsTitle">笔刷设置</span>
            <button class="close-settings" id="closeSettings">×</button>
        </div>
        <div class="setting-row">
            <div class="setting-label">
                <span>笔刷粗细</span>
                <span class="setting-value" id="sizeValue">5px</span>
            </div>
            <input type="range" class="slider" id="sizeSlider" min="1" max="100" value="5">
        </div>
        <div class="setting-row">
            <div class="setting-label">
                <span>不透明度</span>
                <span class="setting-value" id="opacityValue">100%</span>
            </div>
            <input type="range" class="slider" id="opacitySlider" min="1" max="100" value="100">
        </div>
        <div class="setting-row">
            <div class="setting-label">
                <span>流量/浓度</span>
                <span class="setting-value" id="flowValue">100%</span>
            </div>
            <input type="range" class="slider" id="flowSlider" min="1" max="100" value="100">
        </div>
        <div class="setting-row">
            <div class="setting-label">
                <span>线条端点</span>
                <span class="setting-value" id="capValue">圆头</span>
            </div>
            <select class="settings-select" id="capSelect">
                <option value="round">圆头</option>
                <option value="square">方头</option>
                <option value="butt">平头</option>
            </select>
        </div>
        <div class="setting-row">
            <div class="setting-label">
                <span>线条样式</span>
                <span class="setting-value" id="lineStyleValue">实线</span>
            </div>
            <select class="settings-select" id="lineStyleSelect">
                <option value="solid">实线</option>
                <option value="dotted">点线</option>
                <option value="dashed">虚线</option>
            </select>
        </div>
        <div class="preview-area">
            <div id="brushPreview"></div>
        </div>
        <div class="settings-actions">
            <button class="settings-save" id="saveBrushSettingsBtn">完成</button>
        </div>
    </div>

    <!-- 提示框 -->
    <div class="tooltip" id="tooltip"></div>

    <script>
        // ==================== 全局变量 ====================
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const canvasArea = document.getElementById('canvasArea');
        const toolsPanel = document.getElementById('toolsPanel');
        const toggleBtn = document.getElementById('toggleBtn');
        const brushSettings = document.getElementById('brushSettings');
        const overlay = document.getElementById('overlay');
        const ruler = document.getElementById('ruler');
        const rulerMarks = document.getElementById('rulerMarks');
        const tooltip = document.getElementById('tooltip');
        const eraserCursor = document.getElementById('eraserCursor');
        const linePreview = document.getElementById('linePreview');

        let isDrawing = false;
        let currentTool = 'pencil';
        let currentColor = '#333333';
        let currentSize = 5;
        let currentOpacity = 1;
        let currentFlow = 1;
        let currentLineCap = 'round';
        let currentLineStyle = 'solid';
        let lastX = 0;
        let lastY = 0;
        let hue = 0; // 用于彩虹笔刷
        let undoStack = [];
        let redoStack = [];
        let maxUndoSteps = 50;
        let autoSaveTimer = null;
        let lastMapleLeafPoint = null;
        let lineStartPoint = null;
        const MAPLE_LEAF_GAP_PX = 19; // 约等于屏幕 5mm
        const AUTO_SAVE_KEY = 'paintProAutoSaveCanvas';
        const AUTO_SAVE_SETTINGS_KEY = 'paintProAutoSaveSettings';

        // 尺子状态
        let isRulerActive = false;
        let isDraggingRuler = false;
        let rulerAngle = 0;
        let rulerOffset = { x: 0, y: 0 };

        // 笔刷默认参数
        const brushDefaults = {
            pencil: { size: 2, opacity: 1, flow: 1 },
            pen: { size: 3, opacity: 1, flow: 1 },
            brush: { size: 15, opacity: 0.8, flow: 0.7 },
            marker: { size: 8, opacity: 0.9, flow: 1 },
            watercolor: { size: 20, opacity: 0.3, flow: 0.5 },
            oil: { size: 25, opacity: 0.9, flow: 0.8 },
            pastel: { size: 12, opacity: 0.6, flow: 0.7 },
            charcoal: { size: 8, opacity: 0.7, flow: 0.8 },
            spray: { size: 30, opacity: 0.4, flow: 0.6 },
            neon: { size: 10, opacity: 1, flow: 1 },
            sketch: { size: 3, opacity: 0.8, flow: 1 },
            ink: { size: 5, opacity: 0.9, flow: 1 },
            galaxy: { size: 15, opacity: 0.8, flow: 0.9 },
            fire: { size: 20, opacity: 0.8, flow: 0.9 },
            ice: { size: 18, opacity: 0.6, flow: 0.8 },
            rainbow: { size: 8, opacity: 1, flow: 1 },
            pixel: { size: 12, opacity: 1, flow: 1 },
            sparkle: { size: 16, opacity: 0.9, flow: 1 },
            leaf: { size: 18, opacity: 0.8, flow: 0.9 },
            bubble: { size: 22, opacity: 0.55, flow: 0.8 },
            lightning: { size: 12, opacity: 0.95, flow: 1 },
            smoke: { size: 30, opacity: 0.28, flow: 0.75 },
            starlight: { size: 18, opacity: 1, flow: 1 },
            mapleLeaf: { size: 24, opacity: 0.88, flow: 1 },
            texture: { size: 24, opacity: 0.62, flow: 0.85 },
            effectGlow: { size: 16, opacity: 1, flow: 1 },
            particle: { size: 22, opacity: 0.75, flow: 0.9 },
            effectShadow: { size: 18, opacity: 0.7, flow: 0.85 },
            mirror: { size: 10, opacity: 1, flow: 1 },
            soften: { size: 26, opacity: 0.22, flow: 0.7 },
            straightLine: { size: 4, opacity: 1, flow: 1 },
            baseCoat: { size: 42, opacity: 0.18, flow: 0.9 },
            eraser: { size: 20, opacity: 1, flow: 1 }
        };

        // 笔刷自定义参数存储
        let brushCustomSettings = {};

        // ==================== 初始化 ====================
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            restoreSavedSettings();
            
            // 初始化尺子刻度
            initRulerMarks();
            
            // 设置初始笔刷参数
            loadBrushSettings(currentTool);

            // 恢复上次自动保存的作品
            if (!restoreAutoSavedCanvas()) {
                saveState();
            }

            updateEraserCursorVisibility();
            syncEraserCursorSize();
        }

        function resizeCanvas() {
            const rect = canvasArea.getBoundingClientRect();
            canvas.width = rect.width - 40;
            canvas.height = rect.height - 40;
            
            // 填充白色背景
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            document.getElementById('canvasSize').textContent = `${canvas.width} x ${canvas.height}`;
        }

        function initRulerMarks() {
            rulerMarks.innerHTML = '';
            for (let i = 0; i <= 300; i += 10) {
                const mark = document.createElement('div');
                mark.className = i % 50 === 0 ? 'ruler-mark major' : 'ruler-mark';
                mark.style.left = i + 'px';
                rulerMarks.appendChild(mark);
                
                if (i % 50 === 0) {
                    const label = document.createElement('div');
                    label.className = 'ruler-label';
                    label.style.left = i + 'px';
                    label.textContent = i;
                    rulerMarks.appendChild(label);
                }
            }
        }

        // ==================== 工具面板交互 ====================
        toolsPanel.classList.add('expanded');

        // 选择工具
        document.querySelectorAll('.tool-item').forEach(item => {
            item.addEventListener('click', function() {
                const tool = this.dataset.tool;
                
                if (tool === 'ruler') {
                    toggleRuler();
                    return;
                }
                
                // 更新激活状态
                document.querySelectorAll('.tool-item').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                currentTool = tool;
                loadBrushSettings(tool);
                updateEraserCursorVisibility();
                
                showTooltip(this, `已选择: ${this.dataset.name}`);
            });
            
            // 双击打开设置
            item.addEventListener('dblclick', function(e) {
                const tool = this.dataset.tool;
                if (tool === 'ruler') return;
                
                currentTool = tool;
                openBrushSettings(tool, this.dataset.name);
                e.stopPropagation();
            });
            
            // 鼠标悬停提示
            item.addEventListener('mouseenter', function() {
                showTooltip(this, this.dataset.name);
            });
            
            item.addEventListener('mouseleave', () => {
                hideTooltip();
            });
        });

        function showTooltip(element, text) {
            const rect = element.getBoundingClientRect();
            tooltip.textContent = text;
            tooltip.style.left = (rect.right + 10) + 'px';
            tooltip.style.top = (rect.top + rect.height / 2 - 15) + 'px';
            tooltip.classList.add('show');
        }

        function hideTooltip() {
            tooltip.classList.remove('show');
        }

        // ==================== 笔刷设置 ====================
        function openBrushSettings(tool, name) {
            const settings = brushCustomSettings[tool] || brushDefaults[tool] || brushDefaults.pencil;
            
            document.getElementById('settingsTitle').textContent = `${name} - 笔刷设置`;
            document.getElementById('sizeSlider').value = settings.size;
            document.getElementById('opacitySlider').value = Math.round(settings.opacity * 100);
            document.getElementById('flowSlider').value = Math.round(settings.flow * 100);
            document.getElementById('capSelect').value = settings.lineCap || 'round';
            document.getElementById('lineStyleSelect').value = settings.lineStyle || 'solid';
            
            updateSettingsDisplay();
            updateBrushPreview();
            
            overlay.classList.add('show');
            brushSettings.classList.add('show');
        }

        function closeBrushSettings() {
            overlay.classList.remove('show');
            brushSettings.classList.remove('show');
        }

        document.getElementById('closeSettings').addEventListener('click', saveBrushSettings);
        document.getElementById('saveBrushSettingsBtn').addEventListener('click', saveBrushSettings);

        // 滑块事件
        ['sizeSlider', 'opacitySlider', 'flowSlider'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                updateSettingsDisplay();
                updateBrushPreview();
            });
        });

        ['capSelect', 'lineStyleSelect'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                updateSettingsDisplay();
                updateBrushPreview();
            });
        });

        function updateSettingsDisplay() {
            const size = document.getElementById('sizeSlider').value;
            const opacity = document.getElementById('opacitySlider').value;
            const flow = document.getElementById('flowSlider').value;
            const capText = {
                round: '圆头',
                square: '方头',
                butt: '平头'
            }[document.getElementById('capSelect').value];
            const lineStyleText = {
                solid: '实线',
                dotted: '点线',
                dashed: '虚线'
            }[document.getElementById('lineStyleSelect').value];
            
            document.getElementById('sizeValue').textContent = size + 'px';
            document.getElementById('opacityValue').textContent = opacity + '%';
            document.getElementById('flowValue').textContent = flow + '%';
            document.getElementById('capValue').textContent = capText;
            document.getElementById('lineStyleValue').textContent = lineStyleText;
        }

        function updateBrushPreview() {
            const size = document.getElementById('sizeSlider').value;
            const opacity = document.getElementById('opacitySlider').value / 100;
            const preview = document.getElementById('brushPreview');
            
            preview.style.width = size + 'px';
            preview.style.height = size + 'px';
            preview.style.opacity = opacity;
            preview.style.background = currentColor;
            preview.style.borderRadius = document.getElementById('capSelect').value === 'round' ? '50%' : '6px';
        }

        // 保存笔刷设置
        function saveBrushSettings() {
            const size = parseInt(document.getElementById('sizeSlider').value);
            const opacity = parseInt(document.getElementById('opacitySlider').value) / 100;
            const flow = parseInt(document.getElementById('flowSlider').value) / 100;
            const lineCap = document.getElementById('capSelect').value;
            const lineStyle = document.getElementById('lineStyleSelect').value;
            
            brushCustomSettings[currentTool] = { size, opacity, flow, lineCap, lineStyle };
            loadBrushSettings(currentTool);
            saveSettingsSnapshot();
            closeBrushSettings();
        }

        // 点击遮罩保存设置
        overlay.addEventListener('click', saveBrushSettings);

        function loadBrushSettings(tool) {
            const settings = brushCustomSettings[tool] || brushDefaults[tool] || brushDefaults.pencil;
            currentSize = settings.size;
            currentOpacity = settings.opacity;
            currentFlow = settings.flow;
            currentLineCap = settings.lineCap || 'round';
            currentLineStyle = settings.lineStyle || 'solid';
            syncEraserCursorSize();
        }

        function syncEraserCursorSize() {
            eraserCursor.style.width = currentSize + 'px';
            eraserCursor.style.height = currentSize + 'px';
        }

        function updateEraserCursorVisibility() {
            canvas.style.cursor = currentTool === 'eraser' ? 'none' : 'crosshair';
            if (currentTool !== 'eraser') {
                eraserCursor.style.display = 'none';
            }
        }

        function moveEraserCursor(e) {
            if (currentTool !== 'eraser') return;
            const canvasRect = canvas.getBoundingClientRect();
            const areaRect = canvasArea.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX < canvasRect.left || clientX > canvasRect.right || clientY < canvasRect.top || clientY > canvasRect.bottom) {
                eraserCursor.style.display = 'none';
                return;
            }
            eraserCursor.style.display = 'block';
            eraserCursor.style.left = (clientX - areaRect.left) + 'px';
            eraserCursor.style.top = (clientY - areaRect.top) + 'px';
            syncEraserCursorSize();
        }

        // ==================== 绘图功能 ====================
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mousemove', moveEraserCursor);
        canvas.addEventListener('mouseenter', moveEraserCursor);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', () => {
            stopDrawing();
            eraserCursor.style.display = 'none';
            linePreview.style.display = 'none';
        });
        
        // 触摸支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startDrawing(e);
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            draw(e);
        });
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            if (isRulerActive && !e.shiftKey) return;
            
            isDrawing = true;
            const pos = getPointerPos(e);
            lastX = pos.x;
            lastY = pos.y;
            lineStartPoint = currentTool === 'straightLine' ? { x: lastX, y: lastY } : null;
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            
            // 对于某些笔刷，绘制初始点
            if (currentTool === 'spray') {
                drawSpray(lastX, lastY);
            }
            if (currentTool === 'mapleLeaf') {
                lastMapleLeafPoint = null;
                drawMapleLeafBrush(lastX, lastY);
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            
            const pos = getPointerPos(e);
            const x = pos.x;
            const y = pos.y;

            if (currentTool === 'straightLine') {
                updateLinePreview(x, y);
                return;
            }
            
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            ctx.lineJoin = 'round';
            applyLineStyle();
            
            switch (currentTool) {
                case 'pencil':
                    drawPencil(x, y);
                    break;
                case 'pen':
                    drawPen(x, y);
                    break;
                case 'brush':
                    drawBrush(x, y);
                    break;
                case 'marker':
                    drawMarker(x, y);
                    break;
                case 'watercolor':
                    drawWatercolor(x, y);
                    break;
                case 'oil':
                    drawOil(x, y);
                    break;
                case 'pastel':
                    drawPastel(x, y);
                    break;
                case 'charcoal':
                    drawCharcoal(x, y);
                    break;
                case 'spray':
                    drawSpray(x, y);
                    break;
                case 'neon':
                    drawNeon(x, y);
                    break;
                case 'sketch':
                    drawSketch(x, y);
                    break;
                case 'ink':
                    drawInk(x, y);
                    break;
                case 'galaxy':
                    drawGalaxy(x, y);
                    break;
                case 'fire':
                    drawFire(x, y);
                    break;
                case 'ice':
                    drawIce(x, y);
                    break;
                case 'rainbow':
                    drawRainbow(x, y);
                    break;
                case 'pixel':
                    drawPixel(x, y);
                    break;
                case 'sparkle':
                    drawSparkle(x, y);
                    break;
                case 'leaf':
                    drawLeaf(x, y);
                    break;
                case 'bubble':
                    drawBubble(x, y);
                    break;
                case 'lightning':
                    drawLightning(x, y);
                    break;
                case 'smoke':
                    drawSmoke(x, y);
                    break;
                case 'starlight':
                    drawStarlight(x, y);
                    break;
                case 'mapleLeaf':
                    drawMapleLeafBrush(x, y);
                    break;
                case 'texture':
                    drawTexture(x, y);
                    break;
                case 'effectGlow':
                    drawEffectGlow(x, y);
                    break;
                case 'particle':
                    drawParticle(x, y);
                    break;
                case 'effectShadow':
                    drawEffectShadow(x, y);
                    break;
                case 'mirror':
                    drawMirror(x, y);
                    break;
                case 'soften':
                    drawSoften(x, y);
                    break;
                case 'baseCoat':
                    drawBaseCoat(x, y);
                    break;
                case 'eraser':
                    drawEraser(x, y);
                    break;
            }
            ctx.setLineDash([]);
            
            lastX = x;
            lastY = y;
        }

        function applyLineStyle() {
            if (currentLineStyle === 'dotted') {
                ctx.setLineDash([Math.max(1, currentSize * 0.25), currentSize * 1.8]);
            } else if (currentLineStyle === 'dashed') {
                ctx.setLineDash([currentSize * 2.5, currentSize * 1.4]);
            } else {
                ctx.setLineDash([]);
            }
        }

        function stopDrawing() {
            if (isDrawing) {
                if (currentTool === 'straightLine' && lineStartPoint) {
                    drawStraightLine(lastX, lastY);
                    linePreview.style.display = 'none';
                    lineStartPoint = null;
                }
                isDrawing = false;
                saveState();
            }
        }

        function updateLinePreview(x, y) {
            if (!lineStartPoint) return;
            const areaRect = canvasArea.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            const startX = canvasRect.left - areaRect.left + lineStartPoint.x;
            const startY = canvasRect.top - areaRect.top + lineStartPoint.y;
            const dx = x - lineStartPoint.x;
            const dy = y - lineStartPoint.y;
            const length = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);

            linePreview.style.display = 'block';
            linePreview.style.left = startX + 'px';
            linePreview.style.top = startY + 'px';
            linePreview.style.width = length + 'px';
            linePreview.style.borderTopWidth = Math.max(1, currentSize) + 'px';
            linePreview.style.borderTopColor = currentColor;
            linePreview.style.transform = `rotate(${angle}rad)`;
            lastX = x;
            lastY = y;
        }

        // ==================== 各种笔刷实现 ====================
        
        // 铅笔 - 简单线条
        function drawPencil(x, y) {
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        // 钢笔 - 平滑线条
        function drawPen(x, y) {
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        // 毛笔 - 粗细变化
        function drawBrush(x, y) {
            const distance = Math.sqrt(Math.pow(x - lastX, 2) + Math.pow(y - lastY, 2));
            const angle = Math.atan2(y - lastY, x - lastX);
            
            ctx.globalAlpha = currentOpacity * currentFlow;
            ctx.fillStyle = currentColor;
            
            for (let i = 0; i < distance; i += 2) {
                const px = lastX + Math.cos(angle) * i;
                const py = lastY + Math.sin(angle) * i;
                const size = currentSize * (1 - i / distance * 0.3);
                
                ctx.beginPath();
                ctx.arc(px, py, size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 马克笔 - 半透明叠加
        function drawMarker(x, y) {
            ctx.globalAlpha = currentOpacity * 0.5;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        // 水彩 - 晕染效果
        function drawWatercolor(x, y) {
            const distance = Math.sqrt(Math.pow(x - lastX, 2) + Math.pow(y - lastY, 2));
            const angle = Math.atan2(y - lastY, x - lastX);
            
            ctx.globalAlpha = currentOpacity * currentFlow;
            
            for (let i = 0; i < distance; i += 5) {
                const px = lastX + Math.cos(angle) * i;
                const py = lastY + Math.sin(angle) * i;
                
                // 随机散布的水彩点
                for (let j = 0; j < 3; j++) {
                    const offsetX = (Math.random() - 0.5) * currentSize;
                    const offsetY = (Math.random() - 0.5) * currentSize;
                    const size = Math.random() * currentSize * 0.5;
                    
                    ctx.fillStyle = currentColor;
                    ctx.globalAlpha = currentOpacity * currentFlow * 0.3;
                    ctx.beginPath();
                    ctx.arc(px + offsetX, py + offsetY, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // 油画 - 厚重质感
        function drawOil(x, y) {
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            
            // 多层绘制营造厚重感
            for (let i = 0; i < 3; i++) {
                const offsetX = (Math.random() - 0.5) * currentSize * 0.3;
                const offsetY = (Math.random() - 0.5) * currentSize * 0.3;
                
                ctx.beginPath();
                ctx.moveTo(lastX + offsetX, lastY + offsetY);
                ctx.lineTo(x + offsetX, y + offsetY);
                ctx.stroke();
            }
            
            // 添加纹理点
            ctx.fillStyle = currentColor;
            for (let i = 0; i < 5; i++) {
                const px = lastX + (x - lastX) * Math.random();
                const py = lastY + (y - lastY) * Math.random();
                const size = Math.random() * currentSize * 0.4;
                ctx.globalAlpha = currentOpacity * 0.5;
                ctx.beginPath();
                ctx.arc(px, py, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 粉笔 - 颗粒感
        function drawPastel(x, y) {
            const distance = Math.sqrt(Math.pow(x - lastX, 2) + Math.pow(y - lastY, 2));
            const angle = Math.atan2(y - lastY, x - lastX);
            
            ctx.fillStyle = currentColor;
            
            for (let i = 0; i < distance; i += 2) {
                const px = lastX + Math.cos(angle) * i;
                const py = lastY + Math.sin(angle) * i;
                
                // 随机颗粒
                for (let j = 0; j < 4; j++) {
                    const ox = (Math.random() - 0.5) * currentSize;
                    const oy = (Math.random() - 0.5) * currentSize;
                    const alpha = Math.random() * currentOpacity * currentFlow;
                    
                    ctx.globalAlpha = alpha;
                    ctx.fillRect(px + ox, py + oy, 2, 2);
                }
            }
        }

        // 炭笔 - 粗糙线条
        function drawCharcoal(x, y) {
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            
            // 主线条
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            // 添加粗糙感
            ctx.fillStyle = currentColor;
            for (let i = 0; i < 8; i++) {
                const t = Math.random();
                const px = lastX + (x - lastX) * t;
                const py = lastY + (y - lastY) * t;
                const ox = (Math.random() - 0.5) * currentSize * 0.8;
                const oy = (Math.random() - 0.5) * currentSize * 0.8;
                
                ctx.globalAlpha = currentOpacity * 0.3;
                ctx.fillRect(px + ox, py + oy, 1, 1);
            }
        }

        // 喷枪 - 喷雾效果
        function drawSpray(x, y) {
            const density = currentSize * 2;
            ctx.fillStyle = currentColor;
            
            for (let i = 0; i < density; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * currentSize;
                const px = x + Math.cos(angle) * radius;
                const py = y + Math.sin(angle) * radius;
                
                ctx.globalAlpha = currentOpacity * currentFlow * Math.random();
                ctx.fillRect(px, py, 1, 1);
            }
        }

        // 霓虹 - 发光效果
        function drawNeon(x, y) {
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            ctx.lineJoin = 'round';
            
            // 外发光
            ctx.shadowColor = currentColor;
            ctx.shadowBlur = currentSize * 2;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            // 内核
            ctx.shadowBlur = 0;
            ctx.lineWidth = currentSize * 0.3;
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            ctx.strokeStyle = currentColor;
        }

        // 素描 - 阴影线条
        function drawSketch(x, y) {
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            
            const distance = Math.sqrt(Math.pow(x - lastX, 2) + Math.pow(y - lastY, 2));
            const angle = Math.atan2(y - lastY, x - lastX);
            
            // 绘制多条细线模拟素描
            for (let i = 0; i < 3; i++) {
                const offset = (Math.random() - 0.5) * currentSize;
                const ox = Math.cos(angle + Math.PI / 2) * offset;
                const oy = Math.sin(angle + Math.PI / 2) * offset;
                
                ctx.beginPath();
                ctx.moveTo(lastX + ox, lastY + oy);
                ctx.lineTo(x + ox, y + oy);
                ctx.globalAlpha = currentOpacity * 0.5;
                ctx.stroke();
            }
        }

        // 墨汁 - 流畅水墨
        function drawInk(x, y) {
            const distance = Math.sqrt(Math.pow(x - lastX, 2) + Math.pow(y - lastY, 2));
            const steps = Math.max(1, distance / 2);
            
            ctx.fillStyle = currentColor;
            
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                const px = lastX + (x - lastX) * t;
                const py = lastY + (y - lastY) * t;
                
                // 墨汁扩散
                const size = currentSize * (1 + t * 0.5);
                ctx.globalAlpha = currentOpacity * currentFlow * (1 - t * 0.3);
                
                ctx.beginPath();
                ctx.arc(px, py, size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 星空 - 闪烁星星
        function drawGalaxy(x, y) {
            const colors = ['#ffffff', '#ffe9c4', '#d4fbff', '#ffd700', '#ff6b6b'];
            
            for (let i = 0; i < 5; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const ox = (Math.random() - 0.5) * currentSize * 2;
                const oy = (Math.random() - 0.5) * currentSize * 2;
                const size = Math.random() * currentSize * 0.5;
                
                ctx.fillStyle = color;
                ctx.globalAlpha = currentOpacity * currentFlow * Math.random();
                
                // 绘制星星形状
                drawStar(x + ox, y + oy, 5, size, size / 2);
            }
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            const step = Math.PI / spikes;
            
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        // 火焰 - 动态火焰
        function drawFire(x, y) {
            const colors = ['#ff4500', '#ff6347', '#ffa500', '#ffff00'];
            
            for (let i = 0; i < 10; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const ox = (Math.random() - 0.5) * currentSize;
                const oy = (Math.random() - 0.5) * currentSize * 2 - currentSize;
                const size = Math.random() * currentSize * 0.4;
                
                ctx.fillStyle = color;
                ctx.globalAlpha = currentOpacity * currentFlow * Math.random();
                ctx.beginPath();
                ctx.arc(x + ox, y + oy, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 冰霜 - 晶莹效果
        function drawIce(x, y) {
            const colors = ['#e0ffff', '#b0e0e6', '#87ceeb', '#ffffff'];
            
            for (let i = 0; i < 6; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const ox = (Math.random() - 0.5) * currentSize;
                const oy = (Math.random() - 0.5) * currentSize;
                const size = Math.random() * currentSize * 0.5;
                
                ctx.fillStyle = color;
                ctx.globalAlpha = currentOpacity * currentFlow * 0.7;
                
                // 六边形冰晶
                ctx.beginPath();
                for (let j = 0; j < 6; j++) {
                    const angle = (Math.PI / 3) * j;
                    const px = x + ox + Math.cos(angle) * size;
                    const py = y + oy + Math.sin(angle) * size;
                    if (j === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
            }
        }

        // 彩虹 - 七彩渐变
        function drawRainbow(x, y) {
            hue = (hue + 5) % 360;
            const color = `hsl(${hue}, 100%, 50%)`;
            
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = color;
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        // 像素 - 方块颗粒
        function drawPixel(x, y) {
            const grid = Math.max(2, Math.round(currentSize / 2));
            ctx.globalAlpha = currentOpacity;
            ctx.fillStyle = currentColor;
            ctx.fillRect(
                Math.round(x / grid) * grid,
                Math.round(y / grid) * grid,
                currentSize,
                currentSize
            );
        }

        // 闪粉 - 高光星点
        function drawSparkle(x, y) {
            const colors = [currentColor, '#ffffff', '#ffd700', '#c7f7ff'];
            for (let i = 0; i < 6; i++) {
                const ox = (Math.random() - 0.5) * currentSize * 2;
                const oy = (Math.random() - 0.5) * currentSize * 2;
                const radius = Math.random() * currentSize * 0.35 + 1;
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.globalAlpha = currentOpacity * Math.random();
                drawStar(x + ox, y + oy, 4, radius, radius * 0.35);
            }
        }

        // 叶片 - 自然纹理
        function drawLeaf(x, y) {
            const angle = Math.atan2(y - lastY, x - lastX);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle + (Math.random() - 0.5) * 0.8);
            ctx.globalAlpha = currentOpacity * currentFlow;
            ctx.fillStyle = currentColor;
            ctx.beginPath();
            ctx.ellipse(0, 0, currentSize * 0.35, currentSize * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = currentOpacity * 0.35;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, -currentSize * 0.7);
            ctx.lineTo(0, currentSize * 0.7);
            ctx.stroke();
            ctx.restore();
        }

        // 气泡 - 透明圆环
        function drawBubble(x, y) {
            for (let i = 0; i < 3; i++) {
                const radius = Math.random() * currentSize * 0.6 + currentSize * 0.2;
                const ox = (Math.random() - 0.5) * currentSize;
                const oy = (Math.random() - 0.5) * currentSize;
                ctx.globalAlpha = currentOpacity * currentFlow * 0.55;
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = Math.max(1, currentSize * 0.08);
                ctx.beginPath();
                ctx.arc(x + ox, y + oy, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = currentOpacity * 0.35;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(x + ox - radius * 0.3, y + oy - radius * 0.3, radius * 0.18, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 闪电 - 分叉电光
        function drawLightning(x, y) {
            const segments = 5;
            const points = [{ x: lastX, y: lastY }];
            for (let i = 1; i < segments; i++) {
                const t = i / segments;
                points.push({
                    x: lastX + (x - lastX) * t + (Math.random() - 0.5) * currentSize * 1.6,
                    y: lastY + (y - lastY) * t + (Math.random() - 0.5) * currentSize * 1.6
                });
            }
            points.push({ x, y });

            ctx.save();
            ctx.globalAlpha = currentOpacity;
            ctx.shadowColor = '#7dd3fc';
            ctx.shadowBlur = currentSize;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, currentSize * 0.35);
            ctx.beginPath();
            points.forEach((point, index) => {
                if (index === 0) ctx.moveTo(point.x, point.y);
                else ctx.lineTo(point.x, point.y);
            });
            ctx.stroke();

            ctx.shadowBlur = currentSize * 1.8;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = Math.max(1, currentSize * 0.15);
            ctx.stroke();

            for (let i = 1; i < points.length - 1; i += 2) {
                const branchLength = currentSize * (0.8 + Math.random());
                const angle = Math.atan2(y - lastY, x - lastX) + (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.6);
                ctx.beginPath();
                ctx.moveTo(points[i].x, points[i].y);
                ctx.lineTo(points[i].x + Math.cos(angle) * branchLength, points[i].y + Math.sin(angle) * branchLength);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 烟雾 - 柔和扩散
        function drawSmoke(x, y) {
            for (let i = 0; i < 7; i++) {
                const radius = currentSize * (0.35 + Math.random() * 0.65);
                const ox = (Math.random() - 0.5) * currentSize * 1.4;
                const oy = (Math.random() - 0.5) * currentSize * 1.4;
                const gradient = ctx.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, radius);
                gradient.addColorStop(0, `rgba(120, 120, 120, ${currentOpacity * currentFlow})`);
                gradient.addColorStop(0.55, `rgba(180, 180, 180, ${currentOpacity * currentFlow * 0.35})`);
                gradient.addColorStop(1, 'rgba(220, 220, 220, 0)');
                ctx.globalAlpha = 1;
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x + ox, y + oy, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 星光笔 - 发光星芒与细碎星点
        function drawStarlight(x, y) {
            const colors = ['#ffffff', '#fff4b8', '#b9f7ff', currentColor];
            ctx.save();
            ctx.globalAlpha = currentOpacity;
            ctx.shadowColor = currentColor;
            ctx.shadowBlur = currentSize * 1.4;

            for (let i = 0; i < 4; i++) {
                const ox = (Math.random() - 0.5) * currentSize * 2;
                const oy = (Math.random() - 0.5) * currentSize * 2;
                const radius = currentSize * (0.18 + Math.random() * 0.28);
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                drawStar(x + ox, y + oy, 6, radius, radius * 0.28);
            }

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, currentSize * 0.08);
            ctx.beginPath();
            ctx.moveTo(x - currentSize * 0.9, y);
            ctx.lineTo(x + currentSize * 0.9, y);
            ctx.moveTo(x, y - currentSize * 0.9);
            ctx.lineTo(x, y + currentSize * 0.9);
            ctx.stroke();
            ctx.restore();
        }

        // 草叶笔 - 每隔约 5mm 绘制一片枫叶
        function drawMapleLeafBrush(x, y) {
            if (lastMapleLeafPoint) {
                const distance = Math.hypot(x - lastMapleLeafPoint.x, y - lastMapleLeafPoint.y);
                if (distance < MAPLE_LEAF_GAP_PX) return;
            }
            const angle = Math.atan2(y - lastY, x - lastX) + (Math.random() - 0.5) * 0.7;
            drawMapleLeafStamp(x, y, currentSize, angle);
            lastMapleLeafPoint = { x, y };
        }

        function drawMapleLeafStamp(x, y, size, angle) {
            const color = currentColor;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle || 0);
            ctx.scale(size / 28, size / 28);
            ctx.globalAlpha = currentOpacity * currentFlow;
            ctx.fillStyle = color;
            ctx.strokeStyle = 'rgba(75, 45, 20, 0.55)';
            ctx.lineWidth = 1.2;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.22)';
            ctx.shadowBlur = 3;
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 2;

            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.lineTo(4, -9);
            ctx.lineTo(12, -14);
            ctx.lineTo(10, -5);
            ctx.lineTo(19, -4);
            ctx.lineTo(11, 2);
            ctx.lineTo(15, 10);
            ctx.lineTo(5, 8);
            ctx.lineTo(2, 18);
            ctx.lineTo(0, 9);
            ctx.lineTo(-2, 18);
            ctx.lineTo(-5, 8);
            ctx.lineTo(-15, 10);
            ctx.lineTo(-11, 2);
            ctx.lineTo(-19, -4);
            ctx.lineTo(-10, -5);
            ctx.lineTo(-12, -14);
            ctx.lineTo(-4, -9);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.globalAlpha = currentOpacity * 0.45;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.lineWidth = 0.9;
            for (let i = -3; i <= 3; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 14);
                ctx.lineTo(i * 4, -10 + Math.abs(i) * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 纹理笔 - 交错纹理线与颗粒
        function drawTexture(x, y) {
            const distance = Math.hypot(x - lastX, y - lastY);
            const angle = Math.atan2(y - lastY, x - lastX);
            const steps = Math.max(1, Math.floor(distance / 3));

            ctx.save();
            ctx.globalAlpha = currentOpacity * currentFlow;
            ctx.strokeStyle = currentColor;
            ctx.fillStyle = currentColor;
            ctx.lineWidth = Math.max(1, currentSize * 0.08);

            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                const px = lastX + (x - lastX) * t;
                const py = lastY + (y - lastY) * t;
                const offset = (Math.random() - 0.5) * currentSize;
                const length = currentSize * (0.35 + Math.random() * 0.55);
                const lineAngle = angle + Math.PI / 2 + (Math.random() - 0.5) * 1.2;

                ctx.beginPath();
                ctx.moveTo(px + Math.cos(lineAngle) * offset, py + Math.sin(lineAngle) * offset);
                ctx.lineTo(
                    px + Math.cos(lineAngle) * offset + Math.cos(lineAngle) * length,
                    py + Math.sin(lineAngle) * offset + Math.sin(lineAngle) * length
                );
                ctx.stroke();

                if (Math.random() > 0.55) {
                    ctx.globalAlpha = currentOpacity * currentFlow * 0.5;
                    ctx.fillRect(px + (Math.random() - 0.5) * currentSize, py + (Math.random() - 0.5) * currentSize, 1.5, 1.5);
                    ctx.globalAlpha = currentOpacity * currentFlow;
                }
            }
            ctx.restore();
        }

        // 直线 - 松开鼠标时绘制一条确定线段
        function drawStraightLine(x, y) {
            if (!lineStartPoint) return;
            ctx.save();
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            ctx.lineJoin = 'round';
            applyLineStyle();
            ctx.beginPath();
            ctx.moveTo(lineStartPoint.x, lineStartPoint.y);
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.restore();
        }

        // 铺底 - 大面积半透明色块
        function drawBaseCoat(x, y) {
            const distance = Math.hypot(x - lastX, y - lastY);
            const steps = Math.max(1, Math.floor(distance / Math.max(6, currentSize * 0.25)));
            ctx.save();
            ctx.globalAlpha = currentOpacity * currentFlow;
            ctx.fillStyle = currentColor;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const px = lastX + (x - lastX) * t;
                const py = lastY + (y - lastY) * t;
                ctx.beginPath();
                ctx.ellipse(px, py, currentSize * 0.8, currentSize * 0.45, Math.atan2(y - lastY, x - lastX), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // 发光 - 高亮光晕线条
        function drawEffectGlow(x, y) {
            ctx.save();
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = currentColor;
            ctx.shadowBlur = currentSize * 2.4;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.shadowBlur = currentSize * 0.8;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, currentSize * 0.22);
            ctx.stroke();
            ctx.restore();
        }

        // 颗粒 - 随机散点与细小噪声
        function drawParticle(x, y) {
            ctx.save();
            ctx.fillStyle = currentColor;
            const count = Math.max(10, Math.floor(currentSize * 1.8));
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * currentSize;
                const dotSize = Math.random() * 2.8 + 0.8;
                ctx.globalAlpha = currentOpacity * currentFlow * Math.random();
                ctx.beginPath();
                ctx.arc(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius, dotSize, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // 阴影 - 带偏移暗影的笔迹
        function drawEffectShadow(x, y) {
            ctx.save();
            ctx.globalAlpha = currentOpacity * currentFlow;
            ctx.lineCap = currentLineCap;
            ctx.lineJoin = 'round';
            ctx.lineWidth = currentSize;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.moveTo(lastX + currentSize * 0.45, lastY + currentSize * 0.45);
            ctx.lineTo(x + currentSize * 0.45, y + currentSize * 0.45);
            ctx.stroke();
            ctx.strokeStyle = currentColor;
            ctx.globalAlpha = currentOpacity;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.restore();
        }

        // 镜像 - 以画布中线同步绘制左右对称笔迹
        function drawMirror(x, y) {
            const mirrorLastX = canvas.width - lastX;
            const mirrorX = canvas.width - x;
            ctx.save();
            ctx.globalAlpha = currentOpacity;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            ctx.lineJoin = 'round';
            applyLineStyle();
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.moveTo(mirrorLastX, lastY);
            ctx.lineTo(mirrorX, y);
            ctx.stroke();
            ctx.restore();
        }

        // 柔化 - 低透明羽化涂抹
        function drawSoften(x, y) {
            const distance = Math.hypot(x - lastX, y - lastY);
            const steps = Math.max(1, Math.floor(distance / 4));
            ctx.save();
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const px = lastX + (x - lastX) * t;
                const py = lastY + (y - lastY) * t;
                const gradient = ctx.createRadialGradient(px, py, 0, px, py, currentSize);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${currentOpacity * currentFlow * 0.35})`);
                gradient.addColorStop(0.45, `rgba(255, 255, 255, ${currentOpacity * currentFlow * 0.12})`);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(px, py, currentSize, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // 橡皮擦
        function drawEraser(x, y) {
            ctx.globalAlpha = 1;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = currentSize;
            ctx.lineCap = currentLineCap;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        // ==================== 尺子功能 ====================
        function toggleRuler() {
            isRulerActive = !isRulerActive;
            ruler.classList.toggle('show', isRulerActive);
            
            if (isRulerActive) {
                // 居中显示尺子
                const rect = canvasArea.getBoundingClientRect();
                ruler.style.left = (rect.width / 2 - 150) + 'px';
                ruler.style.top = (rect.height / 2 - 20) + 'px';
                
                showTooltip(document.querySelector('[data-tool="ruler"]'), '尺子已激活，按住Shift沿尺子绘制');
            }
        }

        // 尺子拖动
        ruler.addEventListener('mousedown', (e) => {
            if (e.target === ruler || e.target.parentElement === ruler) {
                isDraggingRuler = true;
                const rect = ruler.getBoundingClientRect();
                rulerOffset.x = e.clientX - rect.left;
                rulerOffset.y = e.clientY - rect.top;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingRuler) {
                const parentRect = canvasArea.getBoundingClientRect();
                ruler.style.left = (e.clientX - parentRect.left - rulerOffset.x) + 'px';
                ruler.style.top = (e.clientY - parentRect.top - rulerOffset.y) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isDraggingRuler = false;
        });

        // 滚轮旋转尺子
        ruler.addEventListener('wheel', (e) => {
            e.preventDefault();
            rulerAngle += e.deltaY > 0 ? 5 : -5;
            ruler.style.transform = `rotate(${rulerAngle}deg)`;
        });

        // ==================== 撤销/重做 ====================
        function saveState() {
            if (undoStack.length >= maxUndoSteps) {
                undoStack.shift();
            }
            undoStack.push(canvas.toDataURL());
            redoStack = []; // 清空重做栈
            queueAutoSave();
        }

        function undo() {
            if (undoStack.length > 1) {
                redoStack.push(undoStack.pop());
                const imgData = undoStack[undoStack.length - 1];
                restoreCanvas(imgData);
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                const imgData = redoStack.pop();
                undoStack.push(imgData);
                restoreCanvas(imgData);
            }
        }

        function restoreCanvas(dataUrl) {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                queueAutoSave();
            };
            img.src = dataUrl;
        }

        function queueAutoSave() {
            clearTimeout(autoSaveTimer);
            updateAutoSaveStatus('正在自动保存...');
            autoSaveTimer = setTimeout(() => {
                autoSaveCanvas();
                saveSettingsSnapshot();
            }, 350);
        }

        function autoSaveCanvas() {
            try {
