                localStorage.setItem(AUTO_SAVE_KEY, canvas.toDataURL('image/png'));
                updateAutoSaveStatus(`已自动保存 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`);
            } catch (error) {
                updateAutoSaveStatus('自动保存空间不足');
            }
        }

        function saveSettingsSnapshot() {
            try {
                const snapshot = {
                    currentTool,
                    currentColor,
                    brushCustomSettings,
                    effect: document.getElementById('effectSelect').value
                };
                localStorage.setItem(AUTO_SAVE_SETTINGS_KEY, JSON.stringify(snapshot));
            } catch (error) {
                updateAutoSaveStatus('设置保存失败');
            }
        }

        function restoreSavedSettings() {
            try {
                const raw = localStorage.getItem(AUTO_SAVE_SETTINGS_KEY);
                if (!raw) return;
                const snapshot = JSON.parse(raw);
                currentTool = snapshot.currentTool || currentTool;
                currentColor = snapshot.currentColor || currentColor;
                brushCustomSettings = snapshot.brushCustomSettings || {};
                document.getElementById('colorPicker').value = currentColor;
                document.querySelector('.color-picker-wrapper').style.borderColor = currentColor;
                if (snapshot.effect) {
                    document.getElementById('effectSelect').value = snapshot.effect;
                    applyCanvasEffect(snapshot.effect);
                }
                const activeTool = document.querySelector(`[data-tool="${currentTool}"]`);
                if (activeTool) {
                    document.querySelectorAll('.tool-item').forEach(t => t.classList.remove('active'));
                    activeTool.classList.add('active');
                }
            } catch (error) {
                updateAutoSaveStatus('设置恢复失败');
            }
        }

        function restoreAutoSavedCanvas() {
            try {
                const savedCanvas = localStorage.getItem(AUTO_SAVE_KEY);
                if (!savedCanvas) return false;
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    undoStack = [canvas.toDataURL()];
                    updateAutoSaveStatus('已恢复上次作品');
                };
                img.src = savedCanvas;
                return true;
            } catch (error) {
                updateAutoSaveStatus('恢复失败');
                return false;
            }
        }

        function updateAutoSaveStatus(text) {
            const status = document.getElementById('autoSaveStatus');
            if (status) status.textContent = text;
        }

        function applyCanvasEffect(effect) {
            canvas.classList.remove('effect-paper', 'effect-vivid', 'effect-soft', 'effect-mono', 'effect-blur', 'effect-glow', 'effect-shadow');
            if (effect !== 'none') {
                canvas.classList.add(`effect-${effect}`);
            }
            saveSettingsSnapshot();
        }

        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('redoBtn').addEventListener('click', redo);

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') {
                    e.preventDefault();
                    undo();
                } else if (e.key === 'y') {
                    e.preventDefault();
                    redo();
                }
            }
        });

        // ==================== 其他功能 ====================
        
        // 颜色选择
        document.getElementById('colorPicker').addEventListener('change', (e) => {
            currentColor = e.target.value;
            document.querySelector('.color-picker-wrapper').style.borderColor = currentColor;
            saveSettingsSnapshot();
        });

        // 画布特效
        document.getElementById('effectSelect').addEventListener('change', (e) => {
            applyCanvasEffect(e.target.value);
            showTooltip(document.getElementById('effectSelect'), `已切换特效: ${e.target.options[e.target.selectedIndex].text}`);
            setTimeout(hideTooltip, 1200);
        });

        // 清空画布
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm('确定要清空画布吗？此操作不可撤销。')) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveState();
                updateAutoSaveStatus('画布已清空并保存');
            }
        });

        // 保存作品
        document.getElementById('saveBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `绘画作品_${new Date().getTime()}.png`;
            link.href = canvas.toDataURL();
            link.click();
            
            showTooltip(document.getElementById('saveBtn'), '作品已保存！');
            updateAutoSaveStatus('已导出 PNG');
            setTimeout(hideTooltip, 2000);
        });

        // ==================== 初始化 ====================
        window.addEventListener('load', init);
    </script>
</body>
</html>
