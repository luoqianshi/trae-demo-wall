<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周末手作DIY挑战 - 交互体验</title>
    <style>
        /* 全局样式重置与基础设定 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffecd2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 12px;
            color: #3a2a24;
        }

        /* 手机外壳框架，模拟小程序运行环境 */
        .phone {
            width: 100%;
            max-width: 390px;
            background: #fff;
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(120,40,40,0.22);
            overflow: hidden;
            height: 720px;
            max-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
        }

        /* 顶部标题栏 */
        .topbar {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            padding: 34px 20px 18px;
            text-align: center;
        }
        .topbar h1 { font-size: 1.45rem; font-weight: 700; }
        .topbar p { font-size: 0.78rem; opacity: 0.92; margin-top: 4px; }

        /* 底部标签栏 */
        .tabbar {
            display: flex;
            background: #fff;
            border-top: 1px solid #f0e0e0;
            padding: 8px 0 14px;
        }
        .tab {
            flex: 1;
            text-align: center;
            font-size: 0.72rem;
            color: #b08;
            cursor: pointer;
            transition: color 0.2s;
            user-select: none;
        }
        .tab .tab-icon { font-size: 1.4rem; display: block; margin-bottom: 3px; }
        .tab.active { color: #ff5a7a; font-weight: 700; }

        /* 内容滚动区 */
        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #fff8f6;
        }

        /* 分类筛选条 */
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            padding-right: 16px;
            scroll-padding-right: 16px;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-bar::after {
            content: '';
            flex-shrink: 0;
            width: 16px;
        }
        .chip {
            flex-shrink: 0;
            padding: 7px 16px;
            border-radius: 20px;
            background: #fff;
            border: 1px solid #ffd6dc;
            font-size: 0.8rem;
            color: #d84315;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip.active {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff;
            border-color: transparent;
        }

        /* 项目卡片 */
        .project-card {
            background: #fff;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(255,154,158,0.16);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .project-card:active { transform: scale(0.98); }
        .project-emoji {
            font-size: 2.2rem;
            width: 54px; height: 54px;
            background: linear-gradient(135deg, #fff5f5, #ffe0e6);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .project-info { flex: 1; min-width: 0; }
        .project-info h3 { font-size: 0.95rem; color: #4a2a2a; margin-bottom: 4px; }
        .project-meta { display: flex; gap: 8px; font-size: 0.7rem; color: #999; flex-wrap: wrap; }
        .meta-tag { background: #f5f0f0; padding: 2px 8px; border-radius: 8px; }
        .meta-tag.cat { background: #ffe0e6; color: #d84315; }
        .done-mark { color: #4caf50; font-weight: 700; font-size: 0.7rem; }

        /* 详情弹层 */
        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }
        .modal-mask.show { display: flex; }
        .modal {
            width: 100%;
            max-width: 390px;
            background: #fff;
            border-radius: 24px 24px 0 0;
            max-height: 88vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header {
            padding: 20px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff;
            border-radius: 24px 24px 0 0;
            position: sticky; top: 0;
        }
        .modal-header h2 { font-size: 1.2rem; }
        .modal-header .close {
            position: absolute; top: 18px; right: 20px;
            font-size: 1.4rem; cursor: pointer; opacity: 0.85;
        }
        .modal-body { padding: 20px; }
        .sub-title {
            font-size: 0.95rem; color: #d84315; font-weight: 700;
            margin: 16px 0 10px;
            border-left: 4px solid #ff9a9e;
            padding-left: 10px;
        }
        .material-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; background: #fff8f6;
            border-radius: 10px; margin-bottom: 8px;
            cursor: pointer; transition: background 0.2s;
        }
        .material-item:hover { background: #ffe8ee; }
        .checkbox {
            width: 22px; height: 22px; border-radius: 6px;
            border: 2px solid #ffb0bc;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.2s;
            font-size: 0.8rem; color: #fff;
        }
        .material-item.checked .checkbox {
            background: #ff5a7a; border-color: #ff5a7a;
        }
        .material-item.checked .mat-name { text-decoration: line-through; color: #bbb; }
        .mat-name { font-size: 0.88rem; flex: 1; }
        .step-item {
            display: flex; gap: 12px; margin-bottom: 14px;
        }
        .step-num {
            width: 26px; height: 26px; border-radius: 50%;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff; font-size: 0.8rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .step-text { font-size: 0.86rem; color: #555; line-height: 1.6; padding-top: 3px; }

        /* 开始挑战按钮 */
        .start-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
            transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.97); }
        .start-btn.done { background: linear-gradient(135deg, #66bb6a, #43a047); }

        /* 挑战日历 */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 12px;
        }
        .cal-cell {
            aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; color: #999;
            border-radius: 8px; background: #fff;
            position: relative;
        }
        .cal-cell.has-done {
            background: linear-gradient(135deg, #ff9a9e, #ff758c);
            color: #fff; font-weight: 700;
        }
        .cal-cell.has-done::after {
            content: '✓'; position: absolute; bottom: 1px;
            font-size: 0.6rem;
        }
        .cal-cell.today { box-shadow: 0 0 0 2px #ff5a7a inset; }
        .cal-week {
            display: grid; grid-template-columns: repeat(7,1fr);
            text-align: center; font-size: 0.68rem; color: #bbb;
            margin-bottom: 6px;
        }
        .cal-stat {
            display: flex; gap: 12px; margin-top: 16px;
        }
        .stat-box {
            flex: 1; background: #fff; border-radius: 12px;
            padding: 14px; text-align: center;
            box-shadow: 0 3px 10px rgba(255,154,158,0.14);
        }
        .stat-num { font-size: 1.6rem; font-weight: 800; color: #ff5a7a; }
        .stat-lbl { font-size: 0.7rem; color: #999; margin-top: 2px; }

        /* 成就徽章 */
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 12px;
        }
        .badge-item {
            background: #fff;
            border-radius: 14px;
            padding: 16px 8px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .badge-item.unlocked {
            background: linear-gradient(135deg, #fff3e0, #ffe0e6);
        }
        .badge-item.locked { opacity: 0.45; filter: grayscale(1); }
        .badge-icon { font-size: 2.2rem; }
        .badge-name { font-size: 0.72rem; color: #555; margin-top: 6px; font-weight: 600; }
        .badge-desc { font-size: 0.62rem; color: #aaa; margin-top: 2px; }

        /* 空状态 */
        .empty {
            text-align: center; padding: 50px 20px; color: #ccc;
        }
        .empty-icon { font-size: 3rem; margin-bottom: 10px; }
        .empty p { font-size: 0.85rem; }

        .section-hint { font-size: 0.78rem; color: #999; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="phone">
        <!-- 顶部标题栏 -->
        <div class="topbar">
            <h1>🎨 周末手作DIY挑战</h1>
            <p>让每个周末都充满创造的乐趣</p>
        </div>

        <!-- 内容滚动区 -->
        <div class="screen" id="screen"></div>

        <!-- 底部标签栏 -->
        <div class="tabbar">
            <div class="tab active" data-tab="library" onclick="switchTab('library')">
                <span class="tab-icon">🗂️</span>项目库
            </div>
            <div class="tab" data-tab="calendar" onclick="switchTab('calendar')">
                <span class="tab-icon">📅</span>挑战日历
            </div>
            <div class="tab" data-tab="badges" onclick="switchTab('badges')">
                <span class="tab-icon">🏆</span>成就
            </div>
            <div class="tab" data-tab="profile" onclick="switchTab('profile')">
                <span class="tab-icon">👤</span>我的
            </div>
        </div>
    </div>

    <!-- 详情弹层 -->
    <div class="modal-mask" id="modalMask" onclick="closeModal(event)">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        /* ==================== 项目数据库（真实手作项目内容） ==================== */
        const PROJECTS = [
            { id:'p1', cat:'折纸', emoji:'🦢', name:'千纸鹤许愿挂饰', difficulty:'简单', time:'30分钟',
              materials:['彩色正方形折纸 10张','细绳 1米','小木棍 1根','剪刀 1把'],
              steps:['取一张正方形折纸，对角折叠后展开，留下十字折痕','将四角向中心点折叠形成小正方形','翻面后再次将四角向中心折叠','将两侧向中线折叠后展开，按折痕聚成立体鹤形','重复制作多只纸鹤，用细绳串联挂在木棍上'] },
            { id:'p2', cat:'折纸', emoji:'🌸', name:'立体樱花球', difficulty:'中等', time:'60分钟',
              materials:['粉色折纸 30张','白乳胶 1瓶','圆形泡沫球 1个','镊子 1把'],
              steps:['每张折纸折出单片樱花花瓣的基本形状','将五片花瓣组合粘成一朵完整樱花','重复制作至少十二朵樱花','将樱花依次粘贴在泡沫球表面覆盖满球体','静置待胶水干透后悬挂展示'] },
            { id:'p3', cat:'皮具', emoji:'👛', name:'手工卡包', difficulty:'中等', time:'90分钟',
              materials:['植鞣革料 1块','裁皮刀 1把','菱斩 1套','手缝针线 1套','边油 1瓶'],
              steps:['按纸样在皮革上画出卡包各部件轮廓','用裁皮刀沿轮廓裁切出主体与卡槽皮料','用菱斩在缝合边距打孔','双针法缝合主体与卡槽，保持针距均匀','边缘涂边油打磨平整，安装按扣'] },
            { id:'p4', cat:'香薰', emoji:'🕯️', name:'大豆蜡香薰蜡烛', difficulty:'简单', time:'45分钟',
              materials:['天然大豆蜡 200克','精油 10毫升','烛芯 1根','玻璃容器 1个','不锈钢融蜡锅 1个'],
              steps:['将大豆蜡放入融蜡锅隔水加热至完全融化','待蜡液降温至60度加入精油搅匀','烛芯固定在玻璃容器中央','缓慢倒入蜡液避免产生气泡','静置冷却12小时后修剪烛芯'] },
            { id:'p5', cat:'烘焙', emoji:'🍪', name:'黄油曲奇饼干', difficulty:'简单', time:'50分钟',
              materials:['低筋面粉 150克','无盐黄油 100克','糖粉 50克','鸡蛋 1个','裱花袋 1个'],
              steps:['黄油室温软化后加入糖粉打发至蓬松发白','分次加入蛋液每次充分搅匀','筛入低筋面粉翻拌成均匀面糊','面糊装入裱花袋在烤盘上挤花纹','烤箱170度烤15分钟至边缘金黄'] },
            { id:'p6', cat:'烘焙', emoji:'🧁', name:'纸杯蛋糕', difficulty:'中等', time:'70分钟',
              materials:['低筋面粉 120克','鸡蛋 3个','细砂糖 80克','玉米油 30毫升','淡奶油 100毫升'],
              steps:['蛋黄与蛋白分离，蛋白加糖打发至硬性发泡','蛋黄与玉米油搅匀后筛入面粉拌成蛋黄糊','取三分之一蛋白与蛋黄糊混合后倒回蛋白盆翻拌','面糊装入纸杯七分满震出气泡','烤箱150度烤25分钟，冷却后挤奶油装饰'] },
            { id:'p7', cat:'手账', emoji:'📔', name:'拼贴手账内页', difficulty:'简单', time:'40分钟',
              materials:['空白手账本 1本','和纸胶带 3卷','素材贴纸 1套','剪刀 1把','固体胶 1个'],
              steps:['规划当日手账版面布局与主题色调','用和纸胶带分割出标题区与内容区','贴上日期标签与主题素材贴纸','手写记录当日心情与待办事项','用画笔补充装饰边框与插画'] },
            { id:'p8', cat:'手账', emoji:'🎀', name:'干花书签', difficulty:'简单', time:'25分钟',
              materials:['干花素材 若干','透明离型膜 2张','流苏 1个','打孔器 1把','镊子 1把'],
              steps:['将干花用镊子摆放在离型膜上构图','覆盖另一层离型膜排尽气泡压紧','沿边缘裁剪出书签形状','顶部打孔并穿上流苏装饰','夹入书本即可使用'] }
        ];

        /* ==================== 成就定义 ==================== */
        const BADGES = [
            { id:'b1', icon:'🌱', name:'初出茅庐', desc:'完成1个挑战', cond:s => s.doneCount>=1 },
            { id:'b2', icon:'🔥', name:'连续打卡', desc:'完成3个挑战', cond:s => s.doneCount>=3 },
            { id:'b3', icon:'👑', name:'手作达人', desc:'完成5个挑战', cond:s => s.doneCount>=5 },
            { id:'b4', icon:'🌈', name:'多元探索', desc:'尝试3种品类', cond:s => s.cats.size>=3 },
            { id:'b5', icon:'⚡', name:'效率大师', desc:'完成全部项目', cond:s => s.doneCount>=PROJECTS.length },
            { id:'b6', icon:'⭐', name:'折纸新手', desc:'完成1个折纸项目', cond:s => s.cats.has('折纸') }
        ];

        /* ==================== 状态管理：本地存储读写 ==================== */
        const STORE_KEY = 'diy_challenge_state';
        function loadState() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (raw) return JSON.parse(raw);
            } catch(e) {}
            return { done:[], materials:{}, calendar:{} };
        }
        function saveState(st) {
            localStorage.setItem(STORE_KEY, JSON.stringify(st));
        }

        let state = loadState();
        let currentTab = 'library';
        let currentFilter = '全部';

        /* ==================== 统计数据计算 ==================== */
        function calcStats() {
            const doneProjects = PROJECTS.filter(p => state.done.includes(p.id));
            const cats = new Set(doneProjects.map(p => p.cat));
            return { doneCount: doneProjects.length, cats };
        }

        /* ==================== 标签切换 ==================== */
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            render();
        }

        /* ==================== 主渲染函数 ==================== */
        function render() {
            const screen = document.getElementById('screen');
            if (currentTab === 'library') renderLibrary(screen);
            else if (currentTab === 'calendar') renderCalendar(screen);
            else if (currentTab === 'badges') renderBadges(screen);
            else renderProfile(screen);
        }

        /* ==================== 渲染项目库 ==================== */
        function renderLibrary(screen) {
            const cats = ['全部', ...new Set(PROJECTS.map(p=>p.cat))];
            let html = '<div class="filter-bar">';
            cats.forEach(c => {
                html += `<div class="chip ${currentFilter===c?'active':''}" onclick="setFilter('${c}')">${c}</div>`;
            });
            html += '</div>';

            const list = currentFilter==='全部' ? PROJECTS : PROJECTS.filter(p=>p.cat===currentFilter);
            list.forEach(p => {
                const isDone = state.done.includes(p.id);
                html += `
                <div class="project-card" onclick="openDetail('${p.id}')">
                    <div class="project-emoji">${p.emoji}</div>
                    <div class="project-info">
                        <h3>${p.name}</h3>
                        <div class="project-meta">
                            <span class="meta-tag cat">${p.cat}</span>
                            <span class="meta-tag">${p.difficulty}</span>
                            <span class="meta-tag">⏱${p.time}</span>
                            ${isDone?'<span class="done-mark">✓ 已完成</span>':''}
                        </div>
                    </div>
                </div>`;
            });
            screen.innerHTML = html;
        }

        /* ==================== 分类筛选 ==================== */
        function setFilter(c) { currentFilter = c; render(); }

        /* ==================== 打开项目详情弹层 ==================== */
        function openDetail(id) {
            const p = PROJECTS.find(x => x.id === id);
            if (!p) return;
            const isDone = state.done.includes(id);
            const matState = state.materials[id] || {};
            const checkedCount = p.materials.filter((_,i)=>matState[i]).length;
            let html = `
                <div class="modal-header">
                    <span class="close" onclick="closeModal()">×</span>
                    <h2>${p.emoji} ${p.name}</h2>
                    <div style="margin-top:6px;font-size:0.75rem;opacity:0.9;">
                        ${p.cat} · ${p.difficulty} · ⏱${p.time}
                    </div>
                </div>
                <div class="modal-body">
                    <div class="sub-title">📋 材料清单（${checkedCount}/${p.materials.length}）</div>`;
            p.materials.forEach((m,i) => {
                const checked = matState[i];
                html += `
                    <div class="material-item ${checked?'checked':''}" onclick="toggleMaterial('${id}',${i})">
                        <div class="checkbox">${checked?'✓':''}</div>
                        <span class="mat-name">${m}</span>
                    </div>`;
            });
            html += `<div class="sub-title">📖 制作步骤</div>`;
            p.steps.forEach((s,i) => {
                html += `<div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`;
            });
            html += `<button class="start-btn ${isDone?'done':''}" onclick="toggleDone('${id}')">${isDone?'✓ 已完成挑战，点击取消':'🚀 开始挑战'}</button>`;
            html += `</div>`;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalMask').classList.add('show');
        }

        function closeModal(e) {
            if (e && e.target.id !== 'modalMask') return;
            document.getElementById('modalMask').classList.remove('show');
        }

        /* ==================== 材料勾选 ==================== */
        function toggleMaterial(pid, idx) {
            if (!state.materials[pid]) state.materials[pid] = {};
            state.materials[pid][idx] = !state.materials[pid][idx];
            saveState(state);
            openDetail(pid);
        }

        /* ==================== 完成/取消挑战（同时记录日历） ==================== */
        function toggleDone(pid) {
            const today = new Date();
            const dateKey = `${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
            if (state.done.includes(pid)) {
                state.done = state.done.filter(x => x !== pid);
                delete state.calendar[dateKey];
            } else {
                state.done.push(pid);
                state.calendar[dateKey] = pid;
            }
            saveState(state);
            openDetail(pid);
        }

        /* ==================== 渲染挑战日历 ==================== */
        function renderCalendar(screen) {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month+1, 0).getDate();
            const todayDate = now.getDate();
            const stats = calcStats();

            let html = `<div class="section-hint">📅 ${year}年${month+1}月 · 已完成 ${stats.doneCount} 个挑战</div>`;
            html += '<div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>';
            html += '<div class="cal-grid">';
            const firstDay = new Date(year, month, 1).getDay();
            for (let i=0;i<firstDay;i++) html += '<div class="cal-cell"></div>';
            for (let d=1; d<=daysInMonth; d++) {
                const key = `${year}-${month+1}-${d}`;
                const hasDone = !!state.calendar[key];
                const isToday = d === todayDate;
                html += `<div class="cal-cell ${hasDone?'has-done':''} ${isToday?'today':''}">${d}</div>`;
            }
            html += '</div>';

            html += `<div class="cal-stat">
                <div class="stat-box"><div class="stat-num">${stats.doneCount}</div><div class="stat-lbl">累计挑战</div></div>
                <div class="stat-box"><div class="stat-num">${stats.cats.size}</div><div class="stat-lbl">品类覆盖</div></div>
                <div class="stat-box"><div class="stat-num">${stats.doneCount>=5?'⭐':stats.doneCount}</div><div class="stat-lbl">达人进度</div></div>
            </div>`;

            // 最近完成的挑战列表
            if (state.done.length === 0) {
                html += `<div class="empty"><div class="empty-icon">🎨</div><p>还没有完成的挑战<br>去项目库开启第一个手作吧</p></div>`;
            } else {
                html += `<div class="sub-title" style="margin-top:20px;">最近完成</div>`;
                state.done.slice().reverse().forEach(id => {
                    const p = PROJECTS.find(x=>x.id===id);
                    if (p) html += `<div class="project-card"><div class="project-emoji">${p.emoji}</div><div class="project-info"><h3>${p.name}</h3><div class="project-meta"><span class="done-mark">✓ 已完成</span></div></div></div>`;
                });
            }
            screen.innerHTML = html;
        }

        /* ==================== 渲染成就徽章 ==================== */
        function renderBadges(screen) {
            const stats = calcStats();
            let html = `<div class="section-hint">🏆 已解锁 ${BADGES.filter(b=>b.cond(stats)).length}/${BADGES.length} 枚徽章</div>`;
            html += '<div class="badge-grid">';
            BADGES.forEach(b => {
                const unlocked = b.cond(stats);
                html += `<div class="badge-item ${unlocked?'unlocked':'locked'}">
                    <div class="badge-icon">${b.icon}</div>
                    <div class="badge-name">${b.name}</div>
                    <div class="badge-desc">${b.desc}</div>
                </div>`;
            });
            html += '</div>';

            html += `<div class="sub-title" style="margin-top:24px;">📊 我的进度</div>`;
            html += `<div class="cal-stat">
                <div class="stat-box"><div class="stat-num">${stats.doneCount}</div><div class="stat-lbl">完成项目</div></div>
                <div class="stat-box"><div class="stat-num">${stats.cats.size}</div><div class="stat-lbl">品类数</div></div>
            </div>`;
            if (stats.doneCount === 0) {
                html += `<div class="empty" style="margin-top:20px;"><div class="empty-icon">🏆</div><p>完成手作挑战即可解锁徽章</p></div>`;
            }
            screen.innerHTML = html;
        }

        /* ==================== 渲染我的模块 ==================== */
        function renderProfile(screen) {
            const stats = calcStats();
            const unlockedBadges = BADGES.filter(b => b.cond(stats));
            const cats = ['折纸', '皮具', '香薰', '烘焙', '手账'];
            const catStats = cats.map(c => {
                const count = PROJECTS.filter(p => p.cat === c && state.done.includes(p.id)).length;
                const total = PROJECTS.filter(p => p.cat === c).length;
                return { cat: c, count, total, ratio: total > 0 ? Math.round(count / total * 100) : 0 };
            });

            let html = `<div style="text-align:center;padding:24px 0;">
                <div style="width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#ff758c,#ff7eb3);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#fff;box-shadow:0 6px 20px rgba(255,117,140,0.35);">👤</div>
                <h2 style="margin-top:12px;font-size:1.2rem;color:#4a2a2a;">手作爱好者</h2>
                <p style="font-size:0.78rem;color:#999;">开启你的创意之旅</p>
            </div>`;

            html += `<div class="cal-stat">
                <div class="stat-box"><div class="stat-num">${stats.doneCount}</div><div class="stat-lbl">已完成</div></div>
                <div class="stat-box"><div class="stat-num">${PROJECTS.length - stats.doneCount}</div><div class="stat-lbl">待挑战</div></div>
                <div class="stat-box"><div class="stat-num">${unlockedBadges.length}</div><div class="stat-lbl">徽章</div></div>
            </div>`;

            html += `<div class="sub-title" style="margin-top:20px;">📊 品类进度</div>`;
            catStats.forEach(c => {
                html += `<div style="background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(255,154,158,0.12);">
                    <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:0.85rem;">
                        <span style="color:#4a2a2a;">${c.cat}</span>
                        <span style="color:#ff5a7a;font-weight:700;">${c.count}/${c.total}</span>
                    </div>
                    <div style="height:8px;background:#f5f0f0;border-radius:4px;overflow:hidden;">
                        <div style="height:100%;background:linear-gradient(90deg,#ff758c,#ff7eb3);border-radius:4px;width:${c.ratio}%;"></div>
                    </div>
                </div>`;
            });

            html += `<div class="sub-title" style="margin-top:20px;">🎯 本周目标</div>`;
            html += `<div style="background:#fff8f6;border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid #ff9a9e;">
                <div style="font-size:0.85rem;color:#555;margin-bottom:8px;">完成 1 个手作挑战</div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <div style="flex:1;height:10px;background:#ffe0e6;border-radius:5px;overflow:hidden;">
                        <div style="height:100%;background:#ff5a7a;border-radius:5px;width:${stats.doneCount>=1?'100':'0'}%;"></div>
                    </div>
                    <span style="font-size:0.75rem;color:#999;">${stats.doneCount>=1?'已达成':'进行中'}</span>
                </div>
            </div>`;
            html += `<div style="background:#fff8f6;border-radius:12px;padding:14px;border-left:4px solid #ff9a9e;">
                <div style="font-size:0.85rem;color:#555;margin-bottom:8px;">尝试 1 个新品类</div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <div style="flex:1;height:10px;background:#ffe0e6;border-radius:5px;overflow:hidden;">
                        <div style="height:100%;background:#ff5a7a;border-radius:5px;width:${stats.cats.size>=1?'100':'0'}%;"></div>
                    </div>
                    <span style="font-size:0.75rem;color:#999;">${stats.cats.size>=1?'已达成':'进行中'}</span>
                </div>
            </div>`;

            screen.innerHTML = html;
        }

        /* ==================== 初始化 ==================== */
        render();
    </script>
</body>
</html>
