<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EarWorm 磨耳朵 · 英语听力学习</title>
<style>
/* ========== CSS 变量 & 主题 ========== */
:root {
  --bg-page: #FFFFFF;
  --bg-reader: #F9F9F9;
  --bg-card: #FFFFFF;
  --bg-hover: #F5F5F5;
  --text-primary: #222222;
  --text-secondary: #999999;
  --text-tertiary: #BBBBBB;
  --color-primary: #1677FF;
  --color-primary-light: rgba(22, 119, 255, 0.1);
  --color-vocab: #1677FF;
  --color-expression: #B54708;
  --color-pronunciation: #B42318;
  --color-follow: #7C3AED;
  --color-culture: #667085;
  --border-color: #EEEEEE;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --font-size-base: 17px;
  --font-size-sm: 13px;
  --font-size-xs: 12px;
  --font-size-lg: 22px;
  --line-height: 1.8;
  --reader-width: 680px;
  --nav-height: 56px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --transition: 0.2s ease;
}

/* 暗色模式 */
[data-theme="dark"] {
  --bg-page: #121212;
  --bg-reader: #1E1E1E;
  --bg-card: #2A2A2A;
  --bg-hover: #333333;
  --text-primary: #E0E0E0;
  --text-secondary: #888888;
  --text-tertiary: #666666;
  --color-primary: #4A9EFF;
  --color-primary-light: rgba(74, 158, 255, 0.15);
  --color-vocab: #64B5F6;
  --color-expression: #FFB74D;
  --color-pronunciation: #EF5350;
  --color-follow: #BA68C8;
  --color-culture: #90A4AE;
  --border-color: #333333;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
}

/* 车机模式 */
[data-mode="car"] {
  --font-size-base: 22px;
  --font-size-sm: 16px;
  --font-size-xs: 14px;
  --font-size-lg: 28px;
  --line-height: 2.0;
  --reader-width: 80%;
  --nav-height: 72px;
}
[data-mode="car"] .nav-btn { min-height: 56px; min-width: 56px; padding: 12px 20px; font-size: 18px; }
[data-mode="car"] .tool-btn { min-height: 56px; min-width: 80px; font-size: 18px; }

/* ========== 基础样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: var(--font-size-base);
  line-height: var(--line-height);
  color: var(--text-primary);
  background: var(--bg-page);
  transition: background var(--transition), color var(--transition);
  -webkit-font-smoothing: antialiased;
}

/* ========== 顶部导航 ========== */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--nav-height);
  background: var(--bg-page);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 100;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.9);
}
[data-theme="dark"] .nav { background: rgba(18,18,18,0.9); }

.nav-logo {
  font-weight: 600;
  font-size: 18px;
  color: var(--color-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}
.nav-btn.active {
  color: var(--color-primary);
  background: var(--color-primary-light);
}

/* ========== 主内容区 ========== */
.main {
  margin-top: var(--nav-height);
  min-height: calc(100vh - var(--nav-height));
  display: flex;
  justify-content: center;
}

/* ========== 输入区（初始状态） ========== */
.input-section {
  max-width: 560px;
  width: 100%;
  margin: 80px auto;
  padding: 0 24px;
  text-align: center;
}

.input-title {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text-primary);
}

.input-subtitle {
  color: var(--text-secondary);
  margin-bottom: 40px;
  font-size: 15px;
}

.input-wrapper {
  position: relative;
  margin-bottom: 20px;
}

.input-url {
  width: 100%;
  padding: 16px 20px;
  padding-right: 100px;
  font-size: 16px;
  border: 2px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-card);
  color: var(--text-primary);
  outline: none;
  transition: border-color var(--transition);
}
.input-url:focus {
  border-color: var(--color-primary);
}
.input-url::placeholder {
  color: var(--text-tertiary);
}

.input-btn {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  padding: 10px 20px;
  background: var(--color-primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity var(--transition);
}
.input-btn:hover { opacity: 0.9; }
.input-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.input-tips {
  text-align: left;
  background: var(--bg-reader);
  padding: 16px 20px;
  border-radius: var(--radius-md);
  font-size: 14px;
  color: var(--text-secondary);
}
.input-tips p { margin-bottom: 8px; }
.input-tips p:last-child { margin-bottom: 0; }
.input-tips strong { color: var(--text-primary); }

/* 加载状态 */
.loading {
  display: none;
  text-align: center;
  padding: 60px 20px;
}
.loading.active { display: block; }

.loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border-color);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  color: var(--text-secondary);
  font-size: 14px;
}

/* ========== 阅读区 ========== */
.reader-section {
  display: none;
  width: 100%;
  max-width: var(--reader-width);
  padding: 40px 24px 80px;
}
.reader-section.active { display: block; }

.reader-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border-color);
}

.reader-title {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.4;
}

.reader-meta {
  color: var(--text-secondary);
  font-size: 14px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.reader-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* 段落 */
.paragraph {
  margin-bottom: 1.5em;
  position: relative;
}

.para-time {
  font-size: var(--font-size-xs);
  color: var(--text-tertiary);
  margin-bottom: 6px;
  font-family: "SF Mono", Monaco, Consolas, monospace;
}

.para-text {
  color: var(--text-primary);
  word-wrap: break-word;
}

/* 标注样式 */
.annot-vocab {
  color: var(--color-vocab);
  border-bottom: 1.5px solid var(--color-vocab);
  cursor: pointer;
  padding-bottom: 1px;
  transition: background var(--transition);
}
.annot-vocab:hover {
  background: var(--color-primary-light);
  border-radius: 2px;
}

.annot-expression {
  color: var(--color-expression);
  border-bottom: 1.5px solid var(--color-expression);
  cursor: pointer;
  padding-bottom: 1px;
}
.annot-expression:hover {
  background: rgba(181, 71, 8, 0.1);
  border-radius: 2px;
}

/* 悬浮释义卡片 */
.tooltip {
  position: absolute;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  box-shadow: var(--shadow-lg);
  z-index: 50;
  max-width: 320px;
  display: none;
  animation: fadeIn 0.15s ease;
}
.tooltip.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.tooltip-word {
  font-weight: 600;
  font-size: 16px;
  margin-bottom: 4px;
}

.tooltip-phonetic {
  color: var(--text-secondary);
  font-size: 13px;
  margin-bottom: 8px;
  font-family: "SF Mono", Monaco, Consolas, monospace;
}

.tooltip-meaning {
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.6;
}

.tooltip-type {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  margin-bottom: 8px;
}
.tooltip-type.vocab { background: var(--color-primary-light); color: var(--color-vocab); }
.tooltip-type.expression { background: rgba(181, 71, 8, 0.1); color: var(--color-expression); }

.tooltip-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border-color);
}

.tooltip-action {
  flex: 1;
  padding: 6px 12px;
  border: 1px solid var(--border-color);
  background: var(--bg-page);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
}
.tooltip-action:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}
.tooltip-action.pin {
  background: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

/* ========== 划词工具栏 ========== */
.selection-toolbar {
  position: absolute;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  display: none;
  z-index: 60;
  animation: fadeIn 0.1s ease;
}
.selection-toolbar.active { display: flex; }

.tool-btn {
  padding: 10px 16px;
  border: none;
  background: none;
  color: var(--text-primary);
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
  border-right: 1px solid var(--border-color);
}
.tool-btn:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
.tool-btn:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; border-right: none; }
.tool-btn:hover {
  background: var(--color-primary-light);
  color: var(--color-primary);
}

/* 结果弹窗 */
.result-modal {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border-top: 1px solid var(--border-color);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 24px;
  max-height: 50vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.3s ease;
  z-index: 200;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
}
.result-modal.active { transform: translateY(0); }

.result-close {
  position: absolute;
  top: 16px;
  right: 20px;
  background: none;
  border: none;
  font-size: 24px;
  color: var(--text-secondary);
  cursor: pointer;
  line-height: 1;
}

.result-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text-primary);
}

.result-content {
  color: var(--text-primary);
  font-size: 15px;
  line-height: 1.8;
}
.result-content p { margin-bottom: 12px; }
.result-content p:last-child { margin-bottom: 0; }

/* 遮罩 */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 150;
  display: none;
}
.modal-overlay.active { display: block; }

/* ========== 生词本侧边栏 ========== */
.vocab-drawer {
  position: fixed;
  top: 0;
  right: -400px;
  width: 400px;
  max-width: 100%;
  height: 100vh;
  background: var(--bg-page);
  border-left: 1px solid var(--border-color);
  z-index: 120;
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
}
.vocab-drawer.active { right: 0; }

.drawer-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.drawer-title {
  font-size: 18px;
  font-weight: 600;
}

.drawer-close {
  background: none;
  border: none;
  font-size: 24px;
  color: var(--text-secondary);
  cursor: pointer;
  line-height: 1;
}

.drawer-tabs {
  display: flex;
  border-bottom: 1px solid var(--border-color);
}

.drawer-tab {
  flex: 1;
  padding: 12px;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
}
.drawer-tab.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-primary);
}

.drawer-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.vocab-item {
  padding: 14px 16px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  border: 1px solid var(--border-color);
  transition: all var(--transition);
}
.vocab-item:hover {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-sm);
}

.vocab-item-word {
  font-weight: 600;
  font-size: 16px;
  margin-bottom: 4px;
  color: var(--text-primary);
}

.vocab-item-meaning {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.5;
}

.vocab-item-source {
  color: var(--text-tertiary);
  font-size: 12px;
  margin-top: 8px;
  font-style: italic;
}

.vocab-item-delete {
  float: right;
  background: none;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 8px;
}
.vocab-item-delete:hover { color: var(--color-pronunciation); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-text { font-size: 14px; }

/* ========== 设置面板 ========== */
.settings-panel {
  position: fixed;
  top: var(--nav-height);
  right: 20px;
  width: 320px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  z-index: 110;
  display: none;
  padding: 20px;
}
.settings-panel.active { display: block; }

.settings-section {
  margin-bottom: 24px;
}
.settings-section:last-child { margin-bottom: 0; }

.settings-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  font-weight: 500;
}

.settings-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.settings-option {
  padding: 8px 16px;
  border: 1px solid var(--border-color);
  background: var(--bg-page);
  color: var(--text-primary);
  border-radius: var(--radius-sm);
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition);
}
.settings-option:hover { border-color: var(--color-primary); }
.settings-option.active {
  background: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

.settings-btn {
  width: 100%;
  padding: 12px;
  background: var(--bg-reader);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-radius: var(--radius-sm);
  font-size: 14px;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all var(--transition);
}
.settings-btn:hover {
  background: var(--bg-hover);
  border-color: var(--color-primary);
}

/* ========== Toast 提示 ========== */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--text-primary);
  color: var(--bg-page);
  padding: 12px 24px;
  border-radius: var(--radius-md);
  font-size: 14px;
  z-index: 300;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  .nav { padding: 0 16px; }
  .nav-btn-text { display: none; }
  .reader-section { padding: 24px 16px 60px; }
  .reader-title { font-size: 20px; }
  .input-title { font-size: 22px; }
  .vocab-drawer { width: 100%; right: -100%; }
  .settings-panel {
    right: 10px;
    left: 10px;
    width: auto;
  }
}

/* 文本选中样式 */
::selection {
  background: var(--color-primary-light);
  color: var(--color-primary);
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="nav">
  <div class="nav-logo">🎧 EarWorm</div>
  <div class="nav-actions">
    <button class="nav-btn" id="btnVocab" onclick="toggleVocab()">
      <span>📚</span><span class="nav-btn-text">生词本</span>
    </button>
    <button class="nav-btn" id="btnSettings" onclick="toggleSettings()">
      <span>⚙️</span><span class="nav-btn-text">设置</span>
    </button>
    <button class="nav-btn" id="btnTheme" onclick="toggleTheme()">
      <span id="themeIcon">🌙</span>
    </button>
    <button class="nav-btn" id="btnCar" onclick="toggleCarMode()">
      <span>🚗</span>
    </button>
  </div>
</nav>

<!-- 主内容 -->
<main class="main">

  <!-- 输入区 -->
  <section class="input-section" id="inputSection">
    <h1 class="input-title">🎧 磨耳朵 · 吃透每一个视频</h1>
    <p class="input-subtitle">粘贴 YouTube 链接，AI 自动标注生词，通勤也能高效学英语</p>
    <div class="input-wrapper">
      <input type="text" class="input-url" id="urlInput" placeholder="粘贴 YouTube 视频链接，按回车开始..." onkeypress="handleKeyPress(event)">
      <button class="input-btn" id="startBtn" onclick="startLearning()">开始学习</button>
    </div>
    <div class="input-tips">
      <p><strong>💡 使用提示</strong></p>
      <p>• 支持所有带英文字幕的 YouTube 视频</p>
      <p>• AI 会根据你的水平标注生词，悬浮查看释义</p>
      <p>• 选中任意文字，可翻译、查语法、钉起来收藏</p>
    </div>
  </section>

  <!-- 加载中 -->
  <section class="loading" id="loadingSection">
    <div class="loading-spinner"></div>
    <p class="loading-text" id="loadingText">正在提取字幕...</p>
  </section>

  <!-- 阅读区 -->
  <section class="reader-section" id="readerSection">
    <div class="reader-header">
      <h1 class="reader-title" id="videoTitle">视频标题</h1>
      <div class="reader-meta">
        <span>⏱️ <span id="videoDuration">--:--</span></span>
        <span>📝 <span id="paraCount">0</span> 段</span>
        <span>🎯 水平：<span id="userLevelDisplay">中级</span></span>
      </div>
    </div>
    <div id="transcriptContent"></div>
  </section>

</main>

<!-- 悬浮释义卡片 -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-type" id="tooltipType">词汇</div>
  <div class="tooltip-word" id="tooltipWord">word</div>
  <div class="tooltip-phonetic" id="tooltipPhonetic">/wɜːd/</div>
  <div class="tooltip-meaning" id="tooltipMeaning">释义</div>
  <div class="tooltip-actions">
    <button class="tooltip-action" onclick="translateSelected()">翻译整句</button>
    <button class="tooltip-action pin" onclick="pinFromTooltip()">钉起来</button>
  </div>
</div>

<!-- 划词工具栏 -->
<div class="selection-toolbar" id="selectionToolbar">
  <button class="tool-btn" onclick="translateSelected()">🌐 翻译</button>
  <button class="tool-btn" onclick="grammarSelected()">📖 语法</button>
  <button class="tool-btn" onclick="pinSelected()">📌 钉起来</button>
</div>

<!-- 结果弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeResult()"></div>
<div class="result-modal" id="resultModal">
  <button class="result-close" onclick="closeResult()">×</button>
  <div class="result-title" id="resultTitle">翻译结果</div>
  <div class="result-content" id="resultContent"></div>
</div>

<!-- 生词本侧边栏 -->
<div class="vocab-drawer" id="vocabDrawer">
  <div class="drawer-header">
    <div class="drawer-title">📚 我的生词本</div>
    <button class="drawer-close" onclick="toggleVocab()">×</button>
  </div>
  <div class="drawer-tabs">
    <button class="drawer-tab active" onclick="switchTab('words')" id="tabWords">词汇 <span id="wordCount">0</span></button>
    <button class="drawer-tab" onclick="switchTab('sentences')" id="tabSentences">句子 <span id="sentenceCount">0</span></button>
  </div>
  <div class="drawer-content" id="drawerContent"></div>
</div>

<!-- 设置面板 -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-section">
    <div class="settings-label">英语水平</div>
    <div class="settings-options">
      <button class="settings-option" data-level="beginner" onclick="setLevel('beginner')">初级</button>
      <button class="settings-option active" data-level="intermediate" onclick="setLevel('intermediate')">中级</button>
      <button class="settings-option" data-level="advanced" onclick="setLevel('advanced')">高级</button>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-label">兴趣领域</div>
    <div class="settings-options">
      <button class="settings-option active" data-domain="general" onclick="setDomain('general')">通用</button>
      <button class="settings-option" data-domain="tech" onclick="setDomain('tech')">科技/AI</button>
      <button class="settings-option" data-domain="business" onclick="setDomain('business')">商业</button>
      <button class="settings-option" data-domain="culture" onclick="setDomain('culture')">文化</button>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-label">主题</div>
    <div class="settings-options">
      <button class="settings-option active" onclick="setTheme('light')">☀️ 浅色</button>
      <button class="settings-option" onclick="setTheme('dark')">🌙 暗色</button>
    </div>
  </div>
  <div class="settings-section">
    <button class="settings-btn" onclick="exportSkill()">
      <span>📤</span> 导出标注 Skill（给龙虾用）
    </button>
  </div>
  <div class="settings-section">
    <button class="settings-btn" onclick="reannotate()">
      <span>🔄</span> 重新标注（应用新设置）
    </button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== 状态管理 ==========
const state = {
  level: localStorage.getItem('earworm_level') || 'intermediate',
  domain: localStorage.getItem('earworm_domain') || 'general',
  theme: localStorage.getItem('earworm_theme') || 'light',
  carMode: localStorage.getItem('earworm_car') === 'true',
  pinnedItems: JSON.parse(localStorage.getItem('earworm_pinned') || '[]'),
  learnedWords: JSON.parse(localStorage.getItem('earworm_learned') || '{}'),
  currentVideo: null,
  captions: [],
  annotations: {},
  currentTab: 'words',
  currentTooltipWord: null,
  selectedText: '',
  selectedRange: null
};

// ========== 初始化 ==========
function init() {
  // 应用主题
  document.documentElement.setAttribute('data-theme', state.theme);
  updateThemeIcon();
  
  // 应用车机模式
  if (state.carMode) {
    document.documentElement.setAttribute('data-mode', 'car');
  }
  
  // 更新设置面板状态
  updateSettingsUI();
  
  // 点击外部关闭设置面板
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('settingsPanel');
    const btn = document.getElementById('btnSettings');
    if (!panel.contains(e.target) && !btn.contains(e.target)) {
      panel.classList.remove('active');
    }
  });
  
  // 监听文本选择
  document.addEventListener('mouseup', handleSelection);
  document.addEventListener('touchend', handleSelection);
  
  // 点击外部隐藏划词工具栏
  document.addEventListener('mousedown', (e) => {
    const toolbar = document.getElementById('selectionToolbar');
    if (!toolbar.contains(e.target)) {
      toolbar.classList.remove('active');
    }
  });
  
  // 更新生词本计数
  updateVocabCounts();
}

// ========== 主题切换 ==========
function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  setTheme(state.theme);
}

function setTheme(theme) {
  state.theme = theme;
  localStorage.setItem('earworm_theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon();
  updateSettingsUI();
}

function updateThemeIcon() {
  document.getElementById('themeIcon').textContent = state.theme === 'light' ? '🌙' : '☀️';
}

// ========== 车机模式 ==========
function toggleCarMode() {
  state.carMode = !state.carMode;
  localStorage.setItem('earworm_car', state.carMode);
  if (state.carMode) {
    document.documentElement.setAttribute('data-mode', 'car');
    if (state.theme === 'light') setTheme('dark');
    showToast('已进入车机模式');
  } else {
    document.documentElement.removeAttribute('data-mode');
    showToast('已退出车机模式');
  }
}

// ========== 水平 & 领域 ==========
function setLevel(level) {
  state.level = level;
  localStorage.setItem('earworm_level', level);
  updateSettingsUI();
  document.getElementById('userLevelDisplay').textContent = getLevelName(level);
}

function setDomain(domain) {
  state.domain = domain;
  localStorage.setItem('earworm_domain', domain);
  updateSettingsUI();
}

function getLevelName(level) {
  const names = { beginner: '初级', intermediate: '中级', advanced: '高级' };
  return names[level] || '中级';
}

function updateSettingsUI() {
  // 水平
  document.querySelectorAll('[data-level]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === state.level);
  });
  // 领域
  document.querySelectorAll('[data-domain]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.domain === state.domain);
  });
}

// ========== 设置面板 ==========
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('active');
}

// ========== 视频处理 ==========
function handleKeyPress(e) {
  if (e.key === 'Enter') startLearning();
}

function extractVideoId(url) {
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
    /youtube\.com\/shorts\/([^&\n?#]+)/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

async function startLearning() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) {
    showToast('请输入 YouTube 链接');
    return;
  }
  
  const videoId = extractVideoId(url);
  if (!videoId) {
    showToast('请输入有效的 YouTube 链接');
    return;
  }
  
  // 切换到加载状态
  document.getElementById('inputSection').style.display = 'none';
  document.getElementById('loadingSection').classList.add('active');
  document.getElementById('loadingText').textContent = '正在提取字幕...';
  
  try {
    // 获取字幕
    const captions = await fetchCaptions(videoId);
    if (!captions || captions.length === 0) {
      throw new Error('未找到英文字幕，请确认视频有英文字幕');
    }
    
    state.captions = captions;
    state.currentVideo = { id: videoId, url };
    
    // 合并段落
    const paragraphs = mergeParagraphs(captions);
    
    document.getElementById('loadingText').textContent = 'AI 正在标注生词...';
    
    // AI 标注（批量处理段落）
    const annotations = await annotateParagraphs(paragraphs);
    state.annotations = annotations;
    
    // 渲染
    renderTranscript(paragraphs, annotations);
    
    // 更新元信息
    document.getElementById('videoTitle').textContent = 'YouTube 视频';
    const totalSeconds = captions[captions.length - 1].start + captions[captions.length - 1].duration;
    document.getElementById('videoDuration').textContent = formatTime(totalSeconds);
    document.getElementById('paraCount').textContent = paragraphs.length;
    document.getElementById('userLevelDisplay').textContent = getLevelName(state.level);
    
    // 切换到阅读状态
    document.getElementById('loadingSection').classList.remove('active');
    document.getElementById('readerSection').classList.add('active');
    
    showToast('标注完成，开始学习吧！');
    
  } catch (error) {
    console.error(error);
    document.getElementById('loadingSection').classList.remove('active');
    document.getElementById('inputSection').style.display = 'block';
    showToast(error.message || '处理失败，请重试');
  }
}

// 获取字幕
async function fetchCaptions(videoId) {
  try {
    const res = await fetch(`/api/captions?videoId=${videoId}&lang=en`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data.captions;
  } catch (e) {
    // 失败时使用 demo 数据
    console.warn('使用 demo 数据:', e.message);
    return getDemoCaptions();
  }
}

// 合并段落
function mergeParagraphs(captions) {
  const paragraphs = [];
  let currentPara = { start: captions[0].start, text: '', end: 0 };
  let paraDuration = 0;
  
  for (let i = 0; i < captions.length; i++) {
    const cap = captions[i];
    currentPara.text += (currentPara.text ? ' ' : '') + cap.text;
    currentPara.end = cap.start + cap.duration;
    paraDuration += cap.duration;
    
    // 每 30 秒或遇到句号/问号，或者最后一段
    const endsWithStop = /[.!?]$/.test(cap.text.trim());
    if (paraDuration > 30 || endsWithStop || i === captions.length - 1) {
      if (currentPara.text.trim().length > 10) {
        paragraphs.push({ ...currentPara, text: currentPara.text.trim() });
      }
      if (i < captions.length - 1) {
        currentPara = { start: captions[i+1].start, text: '', end: 0 };
        paraDuration = 0;
      }
    }
  }
  
  return paragraphs;
}

// AI 标注
async function annotateParagraphs(paragraphs) {
  const annotations = {};
  
  // 分批处理，每批 3 段
  const batchSize = 3;
  for (let i = 0; i < paragraphs.length; i += batchSize) {
    const batch = paragraphs.slice(i, i + batchSize);
    const batchText = batch.map((p, idx) => `[${idx}] ${p.text}`).join('\n\n');
    
    try {
      const res = await fetch('/api/annotate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: batchText,
          level: state.level,
          domain: state.domain,
          learnedWords: Object.keys(state.learnedWords)
        })
      });
      const data = await res.json();
      
      if (data.annotations) {
        // 把标注分配到对应段落
        batch.forEach((p, idx) => {
          const paraAnnotations = data.annotations.filter(a => 
            p.text.toLowerCase().includes(a.word.toLowerCase())
          );
          annotations[p.start] = paraAnnotations;
        });
      }
    } catch (e) {
      console.warn('标注失败，使用启发式标注:', e.message);
      // 降级：用启发式标注一些常见难词
      batch.forEach(p => {
        annotations[p.start] = heuristicAnnotate(p.text);
      });
    }
  }
  
  return annotations;
}

// 启发式标注（降级方案）
function heuristicAnnotate(text) {
  const hardWords = [
    { word: 'paradigm', type: 'vocab', phonetic: '/ˈpærədaɪm/', meaning: '范式，典范' },
    { word: 'ubiquitous', type: 'vocab', phonetic: '/juːˈbɪkwɪtəs/', meaning: '无处不在的' },
    { word: 'nuance', type: 'vocab', phonetic: '/ˈnjuːɑːns/', meaning: '细微差别' },
    { word: 'pragmatic', type: 'vocab', phonetic: '/præɡˈmætɪk/', meaning: '务实的' },
    { word: 'inherent', type: 'vocab', phonetic: '/ɪnˈhɪərənt/', meaning: '固有的，内在的' },
    { word: 'facilitate', type: 'vocab', phonetic: '/fəˈsɪlɪteɪt/', meaning: '促进，使便利' },
    { word: 'substantial', type: 'vocab', phonetic: '/səbˈstænʃl/', meaning: '大量的，实质的' },
    { word: 'consequently', type: 'vocab', phonetic: '/ˈkɒnsɪkwəntli/', meaning: '因此，所以' },
    { word: 'nevertheless', type: 'vocab', phonetic: '/ˌnevəðəˈles/', meaning: '然而，尽管如此' },
    { word: 'break down', type: 'expression', phonetic: '', meaning: '分解；崩溃' },
    { word: 'come up with', type: 'expression', phonetic: '', meaning: '想出，提出' },
    { word: 'in terms of', type: 'expression', phonetic: '', meaning: '就...而言' },
  ];
  
  const found = [];
  const lowerText = text.toLowerCase();
  const count = state.level === 'beginner' ? 4 : state.level === 'intermediate' ? 3 : 2;
  
  for (const w of hardWords) {
    if (found.length >= count) break;
    if (lowerText.includes(w.word.toLowerCase())) {
      if (!state.learnedWords[w.word.toLowerCase()]) {
        found.push(w);
      }
    }
  }
  
  return found;
}

// 渲染字幕
function renderTranscript(paragraphs, annotations) {
  const container = document.getElementById('transcriptContent');
  container.innerHTML = '';
  
  paragraphs.forEach(para => {
    const paraAnnotations = annotations[para.start] || [];
    let html = para.text;
    
    // 替换标注词（从长到短，避免部分匹配问题）
    paraAnnotations.sort((a, b) => b.word.length - a.word.length);
    paraAnnotations.forEach(ann => {
      const regex = new RegExp(`\\b(${escapeRegex(ann.word)})\\b`, 'gi');
      const className = ann.type === 'expression' ? 'annot-expression' : 'annot-vocab';
      html = html.replace(regex, 
        `<span class="${className}" data-word="${ann.word}" data-type="${ann.type}" data-phonetic="${ann.phonetic || ''}" data-meaning="${ann.meaning}">$1</span>`
      );
    });
    
    const paraEl = document.createElement('div');
    paraEl.className = 'paragraph';
    paraEl.innerHTML = `
      <div class="para-time">${formatTime(para.start)}</div>
      <div class="para-text">${html}</div>
    `;
    container.appendChild(paraEl);
  });
  
  // 绑定标注词悬浮事件
  document.querySelectorAll('.annot-vocab, .annot-expression').forEach(el => {
    el.addEventListener('mouseenter', showTooltip);
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', showTooltip);
  });
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h > 0) {
    return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ========== 悬浮释义 ==========
function showTooltip(e) {
  const el = e.target;
  const word = el.dataset.word;
  const type = el.dataset.type;
  const phonetic = el.dataset.phonetic;
  const meaning = el.dataset.meaning;
  
  state.currentTooltipWord = { word, type, phonetic, meaning };
  
  const tooltip = document.getElementById('tooltip');
  document.getElementById('tooltipWord').textContent = word;
  document.getElementById('tooltipPhonetic').textContent = phonetic || '';
  document.getElementById('tooltipPhonetic').style.display = phonetic ? 'block' : 'none';
  document.getElementById('tooltipMeaning').textContent = meaning;
  document.getElementById('tooltipType').textContent = type === 'expression' ? '🟡 口语表达' : '🔵 词汇';
  document.getElementById('tooltipType').className = 'tooltip-type ' + type;
  
  const rect = el.getBoundingClientRect();
  tooltip.style.left = rect.left + window.scrollX + 'px';
  tooltip.style.top = rect.bottom + window.scrollY + 8 + 'px';
  tooltip.classList.add('active');
}

function hideTooltip() {
  setTimeout(() => {
    const tooltip = document.getElementById('tooltip');
    if (!tooltip.matches(':hover')) {
      tooltip.classList.remove('active');
    }
  }, 200);
}

document.getElementById('tooltip').addEventListener('mouseleave', () => {
  document.getElementById('tooltip').classList.remove('active');
});

// ========== 划词工具栏 ==========
function handleSelection() {
  const selection = window.getSelection();
  const text = selection.toString().trim();
  
  if (text && text.length > 0 && text.length < 500) {
    const range = selection.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    
    // 确保在阅读区域内
    const reader = document.getElementById('readerSection');
    if (reader.contains(range.commonAncestorContainer)) {
      state.selectedText = text;
      state.selectedRange = range;
      
      const toolbar = document.getElementById('selectionToolbar');
      toolbar.style.left = rect.left + window.scrollX + rect.width / 2 - toolbar.offsetWidth / 2 + 'px';
      toolbar.style.top = rect.top + window.scrollY - 48 + 'px';
      toolbar.classList.add('active');
      return;
    }
  }
  
  // 延迟隐藏，让点击工具栏按钮有时间
  setTimeout(() => {
    if (window.getSelection().toString().trim() === '') {
      document.getElementById('selectionToolbar').classList.remove('active');
    }
  }, 100);
}

// ========== 翻译 ==========
async function translateSelected() {
  const text = state.selectedText || state.currentTooltipWord?.word;
  if (!text) return;
  
  showResult('翻译中...', '翻译中，请稍候...');
  
  try {
    const res = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    showResult('翻译结果', data.translation || data.result || '翻译失败');
  } catch (e) {
    showResult('翻译结果', `【翻译】\n${text}\n\n（AI 服务暂不可用，请检查后端配置）`);
  }
  
  document.getElementById('selectionToolbar').classList.remove('active');
  window.getSelection().removeAllRanges();
}

// ========== 语法解释 ==========
async function grammarSelected() {
  const text = state.selectedText;
  if (!text) return;
  
  showResult('语法分析', '分析中，请稍候...');
  
  try {
    const res = await fetch('/api/grammar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    showResult('语法分析', data.analysis || data.result || '分析失败');
  } catch (e) {
    showResult('语法分析', `【语法分析】\n\n句子：${text}\n\n（AI 服务暂不可用，请检查后端配置）`);
  }
  
  document.getElementById('selectionToolbar').classList.remove('active');
  window.getSelection().removeAllRanges();
}

// ========== 钉起来 ==========
function pinSelected() {
  const text = state.selectedText;
  if (!text) return;
  
  const isSentence = text.includes(' ') && /[.!?]$/.test(text.trim());
  
  addPinnedItem({
    id: Date.now(),
    type: isSentence ? 'sentence' : 'word',
    text: text,
    meaning: '',
    source: state.currentVideo?.id ? 'YouTube 视频' : '手动选择',
    addedAt: new Date().toISOString()
  });
  
  showToast(isSentence ? '句子已加入收藏' : '词汇已加入收藏');
  document.getElementById('selectionToolbar').classList.remove('active');
  window.getSelection().removeAllRanges();
}

function pinFromTooltip() {
  if (!state.currentTooltipWord) return;
  const { word, type, phonetic, meaning } = state.currentTooltipWord;
  
  addPinnedItem({
    id: Date.now(),
    type: 'word',
    text: word,
    phonetic: phonetic,
    meaning: meaning,
    source: 'AI 标注',
    addedAt: new Date().toISOString()
  });
  
  showToast('已加入生词本');
  document.getElementById('tooltip').classList.remove('active');
}

function addPinnedItem(item) {
  state.pinnedItems.unshift(item);
  savePinnedItems();
  updateVocabCounts();
  renderVocabList();
}

function removePinnedItem(id) {
  state.pinnedItems = state.pinnedItems.filter(i => i.id !== id);
  savePinnedItems();
  updateVocabCounts();
  renderVocabList();
  showToast('已移除');
}

function savePinnedItems() {
  localStorage.setItem('earworm_pinned', JSON.stringify(state.pinnedItems));
}

function updateVocabCounts() {
  const words = state.pinnedItems.filter(i => i.type === 'word').length;
  const sentences = state.pinnedItems.filter(i => i.type === 'sentence').length;
  document.getElementById('wordCount').textContent = words;
  document.getElementById('sentenceCount').textContent = sentences;
}

// ========== 结果弹窗 ==========
function showResult(title, content) {
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultContent').innerHTML = content.replace(/\n/g, '<br>');
  document.getElementById('modalOverlay').classList.add('active');
  document.getElementById('resultModal').classList.add('active');
}

function closeResult() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('resultModal').classList.remove('active');
}

// ========== 生词本 ==========
function toggleVocab() {
  document.getElementById('vocabDrawer').classList.toggle('active');
  renderVocabList();
}

function switchTab(tab) {
  state.currentTab = tab;
  document.getElementById('tabWords').classList.toggle('active', tab === 'words');
  document.getElementById('tabSentences').classList.toggle('active', tab === 'sentences');
  renderVocabList();
}

function renderVocabList() {
  const container = document.getElementById('drawerContent');
  const items = state.pinnedItems.filter(i => 
    state.currentTab === 'words' ? i.type === 'word' : i.type === 'sentence'
  );
  
  if (items.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${state.currentTab === 'words' ? '📖' : '📝'}</div>
        <div class="empty-text">${state.currentTab === 'words' ? '还没有收藏词汇' : '还没有收藏句子'}</div>
        <div class="empty-text" style="margin-top:8px;font-size:12px;">选中文字点击「钉起来」即可收藏</div>
      </div>
    `;
    return;
  }
  
  container.innerHTML = items.map(item => `
    <div class="vocab-item">
      <button class="vocab-item-delete" onclick="removePinnedItem(${item.id})">×</button>
      <div class="vocab-item-word">${item.text}</div>
      ${item.meaning ? `<div class="vocab-item-meaning">${item.meaning}</div>` : ''}
      ${item.phonetic ? `<div class="vocab-item-meaning" style="color:var(--text-tertiary);font-size:12px;">${item.phonetic}</div>` : ''}
      <div class="vocab-item-source">— ${item.source}</div>
    </div>
  `).join('');
}

// ========== Skill 导出 ==========
function exportSkill() {
  fetch('/skill/annotation-skill.json')
    .then(r => r.json())
    .then(skill => {
      const blob = new Blob([JSON.stringify(skill, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'earworm-annotation-skill.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Skill 已导出');
    });
}

// ========== 重新标注 ==========
async function reannotate() {
  if (state.captions.length === 0) {
    showToast('请先导入视频');
    return;
  }
  
  document.getElementById('settingsPanel').classList.remove('active');
  showToast('正在重新标注...');
  
  const paragraphs = mergeParagraphs(state.captions);
  const annotations = await annotateParagraphs(paragraphs);
  state.annotations = annotations;
  renderTranscript(paragraphs, annotations);
  
  showToast('重新标注完成');
}

// ========== Toast ==========
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ========== Demo 数据 ==========
function getDemoCaptions() {
  const demoText = `Today I want to talk about artificial intelligence and how it's changing the way we work and live. 

AI has become ubiquitous in our daily lives, from the recommendations we see on social media to the voice assistants in our homes. 

But there's a nuance that many people miss. AI is not just about technology; it's about how we adapt to this new paradigm. 

In terms of business, companies that can effectively leverage AI will have a substantial advantage over their competitors. 

Nevertheless, we must also consider the ethical implications. The inherent risks of AI systems need to be carefully managed. 

Pragmatic approaches that balance innovation with safety will ultimately be the most successful. 

We need to break down complex problems into smaller pieces and come up with solutions that benefit everyone. 

This paradigm shift in technology will facilitate new forms of creativity and collaboration that we can barely imagine today.

Consequently, learning to work alongside AI is becoming an essential skill for the 21st century.

The question is not whether AI will transform our world, but how we choose to shape that transformation.`;

  const lines = demoText.split('\n').filter(l => l.trim());
  let time = 0;
  
  return lines.map(line => {
    const duration = Math.ceil(line.split(' ').length * 0.4);
    const cap = { start: time, duration: duration, text: line.trim() };
    time += duration + 1;
    return cap;
  });
}
