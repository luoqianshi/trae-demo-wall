// ========== MOCK DATA ==========
const mockData = {

    { id: 2, name: '洗衣液', brand: '蓝月亮', spec: '3kg', last_price: 39.9, source: 'auto' },
    { id: 3, name: '垃圾袋', brand: '妙洁', spec: '100只', last_price: 15.8, source: 'auto' },

  appliances: [
    { id: 1, name: '客厅空调', brand: '格力', model: 'KFR-35GW', purchase_date: '2024-05-10', install_date: '2024-05-12', maintenance_interval: 6, cleaning_interval: 3, records: [] },

    { id: 2, title: '宝宝学会走路', event_date: '2026-07-01', description: '在客厅迈出了第一步', source: 'todo_auto' },
    { id: 3, title: '全家三亚旅行', event_date: '2026-02-10', description: '春节三亚七日游', source: 'manual' },
  ],
  anniversaries: [
    { id: 1, title: '妈妈生日', date: '1985-08-15', type: 'birthday', remind_before: 7, description: '记得买蛋糕' },
    { id: 2, title: '结婚纪念日', date: '2019-10-01', type: 'anniversary', remind_before: 14, description: '' },
    { id: 3, title: '宝宝生日', date: '2025-03-20', type: 'birthday', remind_before: 30, description: '准备生日派对' },
    { id: 4, title: '春节', date: null, type: 'festival', remind_before: 14, description: '' },
  ],
};

// ========== STATE ==========
let activeTab = 'shopping';
let idCounter = 100;
let shoppingFilter = 'all';
let todosFilter = 'all';
let anniversariesFilter = 'all';
let fontSize = localStorage.getItem('demo_fontSize') || 'normal';
let hiddenTabs = JSON.parse(localStorage.getItem('demo_hiddenTabs') || '[]');

// Category label mapping
const categoryLabels = {
  housework: '家务', milestone: '里程碑', health: '健康', education: '教育', finance: '财务', other: '其他'
};

// Deep clone mock data
let data = JSON.parse(JSON.stringify(mockData));

// ========== TOAST ==========
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ========== DATE PICKER BINDING ==========
function formatDisplayDate(iso) {
  if (!iso) return '';
  var parts = iso.split('-');
  return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
}

function bindDatePickers() {
  document.querySelectorAll('.date-picker-wrap').forEach(function(wrap) {
    var hidden = wrap.querySelector('.date-hidden');
    var text = wrap.querySelector('.date-text');
    if (!hidden || !text) return;
    // Sync hidden -> text on change
    hidden.onchange = function() {
      var val = hidden.value;
      if (val) {
        text.value = formatDisplayDate(val);
        text.classList.add('has-value');
      }
    };
    // Also set initial state for any pre-filled values
    if (hidden.value) {
      text.value = formatDisplayDate(hidden.value);
      text.classList.add('has-value');
    }
  });
}

// ========== TAB SWITCHING ==========
document.getElementById('demoTabs').addEventListener('click', function(e) {
  if (e.target.classList.contains('demo-tab')) {
    document.querySelectorAll('.demo-tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    activeTab = e.target.dataset.tab;
    renderContent();
  }
});

// ========== RENDER ==========
function renderContent() {
  const el = document.getElementById('demoContent');
  switch (activeTab) {
    case 'shopping': el.innerHTML = renderShopping(); bindShopping(); break;
    case 'todos': el.innerHTML = renderTodos(); bindTodos(); break;
    case 'goods': el.innerHTML = renderGoods(); bindGoods(); break;
    case 'appliances': el.innerHTML = renderAppliances(); bindAppliances(); break;
    case 'timeline': el.innerHTML = renderTimeline(); bindTimeline(); break;
    case 'anniversaries': el.innerHTML = renderAnniversaries(); bindAnniversaries(); break;
  }
  bindDatePickers();
}

// ===== SHOPPING =====
function renderShopping() {
  let items = data.shopping;
  if (shoppingFilter === 'pending') items = items.filter(i => i.status === 'pending');
  else if (shoppingFilter === 'completed') items = items.filter(i => i.status === 'completed');
  else if (shoppingFilter === 'expired') items = items.filter(i => i.urgency === 'expired');

  let html = `
    <div class="demo-form">
      <input class="demo-input" id="shopName" placeholder="添加采购物品..." onkeyup="if(event.key==='Enter')addShopping()" />
      <div class="date-picker-wrap">
        <input class="date-text" id="shopDate" placeholder="选择日期" readonly />
        <span class="date-icon">📅</span>
        <input class="date-hidden" id="shopDate_hidden" type="date" />
      </div>
      <button class="demo-btn-add" onclick="addShopping()">+</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn ${shoppingFilter==='all'?'active':''}" onclick="shoppingFilter='all';renderContent()">全部</button>
      <button class="filter-btn ${shoppingFilter==='pending'?'active':''}" onclick="shoppingFilter='pending';renderContent()">待购</button>
      <button class="filter-btn ${shoppingFilter==='completed'?'active':''}" onclick="shoppingFilter='completed';renderContent()">已完成</button>
      <button class="filter-btn ${shoppingFilter==='expired'?'active':''}" onclick="shoppingFilter='expired';renderContent()">已过期</button>
    </div>
    <div class="demo-list">`;

  if (items.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">🛒</div>暂无采购物品</div>';
  } else {
    items.forEach(item => {
      const urgencyLabel = item.urgency === 'urgent' ? '紧急' : item.urgency === 'expired' ? '已过期' : '一般';
      let goodsHtml = '';
      if (item.goodsInfo) {
        const g = item.goodsInfo;
        goodsHtml = `<span class="goods-ref">品牌：${g.brand||'无'}</span><span class="goods-ref">规格：${g.spec||'无'}</span>${g.last_price ? `<span class="goods-ref">参考：¥${g.last_price}</span>` : ''}`;
      }
      html += `
        <div class="demo-item">
          <div class="item-left">
            <span class="item-name">${item.name}</span>
            <div class="item-meta">
              <span class="tag ${item.urgency}">${urgencyLabel}</span>
              ${item.deadline ? `<span>截止: ${item.deadline}</span>` : ''}
              ${item.status === 'completed' ? `<span>已完成</span>` : ''}
              ${goodsHtml}
            </div>
          </div>
          ${item.status !== 'completed' ? `
          <div class="item-actions">
            <button class="demo-btn-sm done" onclick="completeShopping(${item.id})">完成</button>
            <button class="demo-btn-sm del" onclick="deleteShopping(${item.id})">删除</button>
          </div>` : ''}
        </div>`;
    });
  }
  html += '</div>';
  return html;
}

function bindShopping() {}

function addShopping() {
  const name = document.getElementById('shopName').value.trim();
  if (!name) return;
  const deadline = document.getElementById('shopDate_hidden').value;
  const goodsInfo = data.goods.find(g => g.name === name);
  data.shopping.unshift({
    id: ++idCounter, name, urgency: 'normal', deadline: deadline || null,
    status: 'pending', price: null,
    goodsInfo: goodsInfo ? { brand: goodsInfo.brand, spec: goodsInfo.spec, last_price: goodsInfo.last_price } : null
  });
  renderContent();
  showToast('已添加：' + name);
}

function completeShopping(id) {
  const item = data.shopping.find(i => i.id === id);
  if (item) { item.status = 'completed'; item.price = item.goodsInfo ? item.goodsInfo.last_price : null; }
  renderContent();
  showToast('已完成：' + (item ? item.name : ''));
}

function deleteShopping(id) {
  data.shopping = data.shopping.filter(i => i.id !== id);
  renderContent();
  showToast('已删除');
}

// ===== TODOS =====
function renderTodos() {
  let items = data.todos;
  if (todosFilter !== 'all') items = items.filter(i => i.category === todosFilter);

  const categories = [
    { key: 'all', label: '全部' },
    { key: 'housework', label: '家务' },
    { key: 'milestone', label: '里程碑' },
    { key: 'finance', label: '财务' },
  ];

  let html = `
    <div class="demo-form">
      <input class="demo-input" id="todoTitle" placeholder="添加代办..." onkeyup="if(event.key==='Enter')addTodo()" />
      <select class="demo-select" id="todoCat">
        <option value="housework">家务</option>
        <option value="milestone">里程碑</option>
        <option value="health">健康</option>
        <option value="education">教育</option>
        <option value="finance">财务</option>
        <option value="other">其他</option>
      </select>
      <button class="demo-btn-add" onclick="addTodo()">+</button>
    </div>
    <div class="filter-bar">
      ${categories.map(c => `<button class="filter-btn ${todosFilter===c.key?'active':''}" onclick="todosFilter='${c.key}';renderContent()">${c.label}</button>`).join('')}
    </div>
    <div class="demo-list">`;

  if (items.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">✅</div>暂无代办</div>';
  } else {
    items.forEach(item => {
      html += `
        <div class="demo-item">
          <div class="item-left">
            <span class="item-name">${item.title}</span>
            <div class="item-meta">
              <span class="tag category">${categoryLabels[item.category] || item.category}</span>
              ${item.assignee ? `<span>👤 ${item.assignee}</span>` : ''}
              ${item.deadline ? `<span>📅 ${item.deadline}</span>` : ''}
            </div>
          </div>
          ${item.status !== 'completed' ? `
          <div class="item-actions">
            <button class="demo-btn-sm done" onclick="completeTodo(${item.id})">完成</button>
            <button class="demo-btn-sm del" onclick="deleteTodo(${item.id})">删除</button>
          </div>` : `<span style="font-size:12px;color:var(--accent3);">✅ 已完成</span>`}
        </div>`;
    });
  }
  html += '</div>';

function bindAppliances() {}

function addRecord(appId, type) {
  const app = data.appliances.find(a => a.id === appId);
  if (!app) return;
  const today = new Date().toISOString().split('T')[0];
  const labels = { maintenance: '保养', cleaning: '清洁', repair: '维修' };
  showRecordModal(app, type, today, labels[type]);
}

function showRecordModal(app, type, today, label) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;';
  overlay.innerHTML = `
    <div class="modal-card" style="background:#fff;border-radius:12px;padding:24px;width:90%;max-width:360px;display:flex;flex-direction:column;gap:12px;">
      <h4 style="font-size:16px;margin:0;">添加${label}记录 - ${app.name}</h4>
      <input id="recordDesc" class="demo-input" placeholder="描述（可选）" style="width:100%;" />
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px;">
        <button onclick="this.closest('.modal-overlay').remove()" class="demo-btn-sm" style="background:#ccc;color:#fff;">取消</button>
        <button id="confirmRecord" class="demo-btn-sm done">保存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#confirmRecord').onclick = function() {
    const desc = overlay.querySelector('#recordDesc').value;
    app.records.push({ type, date: today, desc: desc || '' });
    overlay.remove();
    renderContent();
    showToast('已添加' + label + '记录');
  };

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });
}

// ===== ANNIVERSARIES =====
function renderAnniversaries() {
  let items = data.anniversaries;
  if (anniversariesFilter !== 'all') items = items.filter(i => i.type === anniversariesFilter);

  const types = [
    { key: 'all', label: '全部' },
    { key: 'birthday', label: '生日' },
    { key: 'anniversary', label: '纪念日' },
    { key: 'festival', label: '节日' },
    { key: 'other', label: '其他' },
  ];

  function formatDate(dateStr) {
    if (!dateStr) return '📅 未设置日期';
    const d = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    const thisYear = new Date(now.getFullYear(), d.getMonth(), d.getDate());
    const nextYear = new Date(now.getFullYear() + 1, d.getMonth(), d.getDate());
    const daysUntil = Math.ceil((thisYear.getTime() - now.getTime()) / (1000*60*60*24));
    const target = daysUntil >= 0 ? thisYear : nextYear;
    const targetDays = Math.ceil((target.getTime() - now.getTime()) / (1000*60*60*24));
    const parts = `${d.getMonth()+1}月${d.getDate()}日`;
    if (targetDays <= 30 && targetDays >= 0) return `📅 ${parts}（还有${targetDays}天）`;
    return `📅 ${parts}`;
  }

  let html = `
    <div class="demo-form">
      <input class="demo-input" id="annTitle" placeholder="添加纪念日..." onkeyup="if(event.key==='Enter')addAnniversary()" />
      <div class="date-picker-wrap">
        <input class="date-text" id="annDate" placeholder="选择日期" readonly />
        <span class="date-icon">📅</span>
        <input class="date-hidden" id="annDate_hidden" type="date" />
      </div>
      <select class="demo-select" id="annType">
        <option value="birthday">生日</option>
        <option value="anniversary">纪念日</option>
        <option value="festival">节日</option>
        <option value="other">其他</option>
      </select>
      <button class="demo-btn-add" onclick="addAnniversary()">+</button>
    </div>
    <div class="filter-bar">
      ${types.map(t => `<button class="filter-btn ${anniversariesFilter===t.key?'active':''}" onclick="anniversariesFilter='${t.key}';renderContent()">${t.label}</button>`).join('')}
    </div>
    <div class="demo-list">`;

  if (items.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">🎂</div>暂无纪念日</div>';
  } else {
    items.forEach(item => {
      html += `
        <div class="demo-item">
          <div class="item-left">
            <span class="item-name">${item.title}</span>
            <div class="item-meta">
              <span class="tag ${item.type}">${types.find(t=>t.key===item.type)?.label||item.type}</span>
              <span style="color:var(--accent);font-weight:500;">${formatDate(item.date)}</span>
              ${item.remind_before>0 ? `<span>提前${item.remind_before}天提醒</span>` : ''}
            </div>
            ${item.description ? `<div style="font-size:12px;color:var(--muted);margin-top:2px;">${item.description}</div>` : ''}
          </div>
          <div class="item-actions">
            <button class="demo-btn-sm del" onclick="deleteAnniversary(${item.id})">删除</button>
          </div>
        </div>`;
    });
  }
  html += '</div>';
  return html;
}

function bindAnniversaries() {}

function addAnniversary() {
  const title = document.getElementById('annTitle').value.trim();
  if (!title) return;
  const date = document.getElementById('annDate_hidden').value || null;
  const type = document.getElementById('annType').value;
  data.anniversaries.unshift({ id: ++idCounter, title, date, type, remind_before: 7, description: '' });
  renderContent();
  showToast('已添加纪念日：' + title);
}

function deleteAnniversary(id) {

  showToast('已删除');
}

// ===== SETTINGS =====
function switchSettings() {
  activeTab = 'settings';
  const el = document.getElementById('demoContent');
  el.innerHTML = `
    <h4 style="margin-bottom:16px;">⚙️ 显示标签页设置</h4>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;">
      ${['shopping','todos','goods','appliances','timeline','anniversaries'].map(t => {
        const labels = { shopping: '🛒 采购清单', todos: '✅ 家庭代办', goods: '📦 日用品库', appliances: '🔧 家电管理', timeline: '📅 大事记', anniversaries: '🎂 纪念日' };
        const visible = !hiddenTabs.includes(t);
        return `<label style="display:flex;align-items:center;gap:6px;font-size:14px;background:var(--bg);padding:8px 14px;border-radius:8px;cursor:pointer;">
          <input type="checkbox" ${visible?'checked':''} onchange="toggleTab('${t}',this.checked)" style="accent-color:var(--accent);" />
          ${labels[t]}
        </label>`;
      }).join('')}
    </div>
    <h4 style="margin-bottom:16px;">🔤 字体大小</h4>
    <div style="display:flex;gap:8px;">
      <button class="filter-btn ${fontSize==='normal'?'active':''}" onclick="setFontSize('normal',this)" style="font-size:14px;">标准</button>
      <button class="filter-btn ${fontSize==='large'?'active':''}" onclick="setFontSize('large',this)" style="font-size:18px;">大号</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:16px;">💡 设置会自动保存到本地，下次打开时自动恢复。</p>
  `;
}

function toggleTab(key, visible) {
  const tab = document.querySelector(`[data-tab="${key}"]`);
  if (tab) { tab.style.display = visible ? '' : 'none'; }
  if (visible) {
    hiddenTabs = hiddenTabs.filter(t => t !== key);
  } else {
    if (!hiddenTabs.includes(key)) hiddenTabs.push(key);
  }
  localStorage.setItem('demo_hiddenTabs', JSON.stringify(hiddenTabs));
}

function setFontSize(size, btn) {
  fontSize = size;
  localStorage.setItem('demo_fontSize', size);
  const body = document.querySelector('.demo-body');
  body.style.fontSize = size === 'large' ? '18px' : '';
  // Update button states
  document.querySelectorAll('.demo-body .filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === (size === 'large' ? '大号' : '标准'));
  });
}

// ========== INIT ==========
// Restore saved settings
if (fontSize === 'large') {
  document.querySelector('.demo-body').style.fontSize = '18px';
}
hiddenTabs.forEach(function(key) {
  var tab = document.querySelector('[data-tab="' + key + '"]');
  if (tab) tab.style.display = 'none';
});
renderContent();
</script>
