<!DOCTYPE html>
<html lang="zh-CN" data-font-size="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="银发反诈守护人 - 互动叙事游戏，通过沉浸式体验提升老年诈骗识别能力和防范意识">
  <title>银发反诈守护人 · 老年防骗互动叙事游戏</title>

  <!-- Google Fonts: Lexend + Source Sans 3 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230369A1'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading" style="display:flex;align-items:center;justify-content:center;min-height:100dvh;flex-direction:column;gap:16px;">
      <div style="width:48px;height:48px;border:4px solid #E0F2FE;border-top-color:#0369A1;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <p style="color:#475569;font-size:16px;">加载中...</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/export.js"></script>
  <script src="js/ui.js"></script>

  <script>
    // 初始化应用
    (function() {
      // 加载动画
      const loadingEl = document.getElementById('loading');
      const spinnerStyle = document.createElement('style');
      spinnerStyle.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
      document.head.appendChild(spinnerStyle);

      // 初始化
      Storage.init();
      GameEngine.init();

      // 应用字号设置
      const fontSize = Storage.getFontSize();
      document.documentElement.setAttribute('data-font-size', fontSize);

      // 渲染主菜单
      setTimeout(() => {
        loadingEl.remove();
        UIRenderer.renderMainMenu();
      }, 300);
    })();
  </script>
</body>
</html>
