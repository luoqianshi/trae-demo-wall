      else if (/护肤|皮肤|保养|精华|面霜|面膜|护肤该/.test(lower)) {

        }
        if (MEMORY.facts.some(f => /酒精|过敏/.test(f.content))) {
          text += ' 对了，含酒精的绝对不能碰，你皮肤会过敏的，选成分温和的那种。';
          used.push('对酒精过敏');
        }
        text += ' 你平时护肤不用太复杂，精简保湿最重要，皮肤舒服了整个人状态也会好 💕';
      }

      else if (/注意|这周|建议|提醒|身体|健康|休息/.test(lower)) {
        text = '这周我会盯着你好好休息的！';
        if (MEMORY.episodes.filter(e => e.topicId === 'health' && /累|没睡/.test(e.content)).length >= 2) {
          text += '你最近提到好几次累了，真的该给自己放个假，早点睡，别硬撑。';
          used.push('最近有点累');
        } else if (MEMORY.episodes.filter(e => e.topicId === 'health' && /累|没睡/.test(e.content)).length >= 1) {
          text += '你不是最近有点累吗，每天至少睡够 7 小时，睡前别刷手机了。';
          used.push('最近有点累');
        }
        if (MEMORY.episodes.some(e => e.topicId === 'work' && /加班|压力|忙/.test(e.content))) {
          text += ' 工作那边压力再大也要记得喘口气，中午出去走走、喝杯咖啡换换心情。';
          used.push('工作压力大');
        }
        if (MEMORY.episodes.some(e => e.topicId === 'study' && /考试|复习|期末/.test(e.content))) {
          text += ' 考试复习归复习，身体是第一位的，别通宵啊！';
          used.push('在准备期末考试');
        }
        text += ' 这周重点就是：吃好、睡好、心情好，其他事我陪你一起扛 ✨';
      }

      else if (/累|困|睡眠|失眠|休息/.test(lower)) {
        text = '心疼你 😢 ';
        if (MEMORY.episodes.filter(e => e.topicId === 'health' && /累|没睡/.test(e.content)).length >= 2) {
          text += '你最近真的说了太多次累了，这不是小事。今晚必须 11 点前睡觉，手机放到够不着的地方，我监督你！';
          used.push('最近有点累');
        } else {
          text += '累了就早点休息吧，今晚泡个热水脚、喝杯温牛奶，别熬了。身体是自己的，乖～';
        }
      }

      else if (/考试|学习|复习|备考/.test(lower)) {
        text = '考试复习辛苦了！';
        if (MEMORY.episodes.some(e => /期末考试/.test(e.content))) {
          text += '你不是在准备 6 月 20 号的期末考试吗，时间安排好就没问题～';
          used.push('在准备期末考试');
        }
        if (MEMORY.episodes.some(e => e.topicId === 'health' && /累|没睡/.test(e.content))) {
          text += ' 不过你最近状态不太好，别通宵复习了，效率会更差的。';
          used.push('最近有点累');
        }
        text += ' 每天定个小目标，完成就奖励自己一杯奶茶，咱们稳扎稳打 💪';
      }

      else {
        text = '这个问题我得好好想想～你先跟我多聊聊，我才能给你最合适的建议呀 💕';
      }

      return { text, usedMemories: used };
    }

    /* ============================================================
       UI RENDERING
       ============================================================ */
    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function getTime() {
      const n = new Date();
      return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    }

    function addMessage(containerId, text, sender, footerHtml, phoneClass) {
      const container = document.getElementById(containerId);
      const avatar = sender === 'user' ? '🌸' : (phoneClass === 'bestie' ? '👩' : '🤖');
      const div = document.createElement('div');
      div.className = 'msg ' + sender;
      div.innerHTML = `
        <div class="msg-avatar">${avatar}</div>
        <div>
          <div class="bubble">${escapeHtml(text)}</div>
          <div class="msg-time">${getTime()}</div>
          ${footerHtml ? '<div class="msg-footer">' + footerHtml + '</div>' : ''}
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping(containerId) {
      const container = document.getElementById(containerId);
      const div = document.createElement('div');
      div.className = 'msg ai typing-msg';
      div.innerHTML = `
        <div class="msg-avatar" style="opacity:0.5">...</div>
        <div>
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function removeTyping(el) {
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    /* ============================================================
       MAIN ASK FUNCTION
       ============================================================ */
    function ask(preset) {
      const input = document.getElementById('questionInput');
      const question = preset || input.value.trim();
      if (!question) return;
      if (preset) input.value = preset;

      // Clear previous
      document.getElementById('bestieMessages').innerHTML = '';
      document.getElementById('normalMessages').innerHTML = '';

      // Add user message to both phones
      addMessage('bestieMessages', question, 'user', null, 'bestie');
      addMessage('normalMessages', question, 'user', null, 'normal');

      // Show typing on both
      const bestieTyping = showTyping('bestieMessages');
      const normalTyping = showTyping('normalMessages');

      // Generate answers
      const bestieResult = generateBestieAnswer(question);
      const normalResult = generateNormalAnswer(question);

      // Reveal normal first (slightly faster = "generic, quick")
      setTimeout(() => {
        removeTyping(normalTyping);
        const normalFooter = '未使用任何个人记忆';
        addMessage('normalMessages', normalResult, 'ai', normalFooter, 'normal');
      }, 500);

      // Reveal bestie slightly after (feels like "thinking harder")
      setTimeout(() => {
        removeTyping(bestieTyping);
        let footer = '';
        if (bestieResult.usedMemories.length > 0) {
          footer = '调用了 ' + bestieResult.usedMemories.length + ' 条记忆：' +
            '<div class="memory-chips">' +
            bestieResult.usedMemories.map(m => '<span class="memory-chip">' + escapeHtml(m) + '</span>').join('') +
            '</div>';
        } else {
          footer = '调用了 0 条记忆';
        }
        addMessage('bestieMessages', bestieResult.text, 'ai', footer, 'bestie');
      }, 900);
    }

    // Auto-run first preset on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => ask('帮我推荐个今晚的外卖'), 400);
    });

    // Enter key support
    document.getElementById('questionInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        ask();
      }
    });
  </script>
</body>
</html>
