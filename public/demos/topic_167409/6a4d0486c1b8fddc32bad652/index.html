<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么 - 菜谱选择应用</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1>今天吃什么</h1>
        </div>
    </header>

    <main class="container">
        <section class="random-section">
            <h2>随机搭配午餐</h2>
            <button id="random-btn">随机搭配午餐</button>
            <div id="random-result"></div>
        </section>

        <section class="search-section">
            <h2>搜索菜谱</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="输入菜谱名称或食材">
                <button id="search-btn">搜索</button>
            </div>
        </section>

        <section class="filter-section">
            <h2>分类筛选</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">全部</button>
                <button class="filter-btn" data-category="荤">荤</button>
                <button class="filter-btn" data-category="素">素</button>
            </div>
        </section>

        <section class="recipe-list-section">
            <h2>菜谱列表</h2>
            <div id="recipe-list" class="recipe-grid"></div>
        </section>

        <section class="form-section">
            <h2 id="form-title">添加菜谱</h2>
            <form id="recipe-form">
                <input type="hidden" id="recipe-id">
                <div class="form-group">
                    <label for="recipe-name">菜谱名称</label>
                    <input type="text" id="recipe-name" required placeholder="请输入菜谱名称">
                </div>
                <div class="form-group">
                    <label for="recipe-category">分类</label>
                    <select id="recipe-category" required>
                        <option value="">请选择分类</option>
                        <option value="荤">荤</option>
                        <option value="素">素</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="recipe-ingredients">食材</label>
                    <input type="text" id="recipe-ingredients" required placeholder="请输入食材，用逗号分隔">
                </div>
                <div class="form-actions">
                    <button type="submit">保存</button>
                    <button type="button" id="cancel-btn">取消</button>
                </div>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
