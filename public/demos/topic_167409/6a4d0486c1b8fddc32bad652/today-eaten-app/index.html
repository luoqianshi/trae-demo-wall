<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>今天吃了吗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>今天吃了吗</h1>
    </header>

    <main class="tab-content-container">
        <section id="personal" class="tab-content active">
            <div class="personal-recommend">
                <div class="recommend-options">
                    <label class="recommend-option">
                        <input type="radio" name="meal-type" value="lunchbox" checked>
                        <span class="option-box">
                            <span class="option-icon">🍱</span>
                            <span class="option-text">带饭</span>
                        </span>
                    </label>
                    <label class="recommend-option">
                        <input type="radio" name="meal-type" value="takeout">
                        <span class="option-box">
                            <span class="option-icon">🥡</span>
                            <span class="option-text">外卖</span>
                        </span>
                    </label>
                    <label class="recommend-option">
                        <input type="radio" name="meal-type" value="all">
                        <span class="option-box">
                            <span class="option-icon">🎲</span>
                            <span class="option-text">随便</span>
                        </span>
                    </label>
                </div>
                <button id="btn-personal-recommend" class="btn-large">一键生成今天吃什么</button>
                <div id="personal-result" class="recommend-result"></div>
            </div>
        </section>

        <section id="lunchbox" class="tab-content">
            <div class="form-section">
                <h2>添加带饭记录</h2>
                <form id="lunchbox-form" class="record-form">
                    <div class="form-group">
                        <label for="lunchbox-dish">菜品名称</label>
                        <input type="text" id="lunchbox-dish" name="dish" placeholder="请输入菜品名称" required>
                    </div>
                    <div class="form-group">
                        <label>荤素分类</label>
                        <div class="dish-type-group">
                            <label class="dish-type-label">
                                <input type="radio" name="lunchbox-dish-type" value="meat" checked>
                                <span class="dish-type-btn">🥩 荤菜</span>
                            </label>
                            <label class="dish-type-label">
                                <input type="radio" name="lunchbox-dish-type" value="veggie">
                                <span class="dish-type-btn">🥬 素菜</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lunchbox-date">日期</label>
                        <input type="date" id="lunchbox-date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>喜欢度</label>
                        <div class="star-rating" data-rating="0">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>拍照记录</label>
                        <label for="lunchbox-photo" class="btn-upload-small">
                            <span>📷 拍照/上传</span>
                        </label>
                        <input type="file" id="lunchbox-photo" accept="image/*" capture="environment" hidden multiple>
                        <div id="lunchbox-photo-preview" class="photo-preview-small"></div>
                    </div>
                    <button type="submit" class="btn-add">添加</button>
                </form>
            </div>
            <div class="list-section">
                <div class="list-header">
                    <h2>带饭记录</h2>
                    <div class="filter-bar">
                        <select id="lunchbox-date-filter">
                            <option value="">全部</option>
                            <option value="today">今天</option>
                            <option value="week">本周</option>
                            <option value="month">本月</option>
                        </select>
                    </div>
                </div>
                <div id="lunchbox-list" class="record-list"></div>
            </div>
        </section>

        <section id="takeout" class="tab-content">
            <div class="form-section">
                <h2>添加外卖记录</h2>
                <form id="takeout-form" class="record-form">
                    <div class="form-group">
                        <label for="takeout-store">店家名称</label>
                        <input type="text" id="takeout-store" name="store" placeholder="请输入店家名称" required>
                    </div>
                    <div class="form-group">
                        <label for="takeout-dish">菜品名称</label>
                        <input type="text" id="takeout-dish" name="dish" placeholder="请输入菜品名称" required>
                    </div>
                    <div class="form-group">
                        <label for="takeout-date">日期</label>
                        <input type="date" id="takeout-date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>喜欢度</label>
                        <div class="star-rating" data-rating="0">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>拍照记录</label>
                        <label for="takeout-photo" class="btn-upload-small">
                            <span>📷 拍照/上传</span>
                        </label>
                        <input type="file" id="takeout-photo" accept="image/*" capture="environment" hidden multiple>
                        <div id="takeout-photo-preview" class="photo-preview-small"></div>
                    </div>
                    <button type="submit" class="btn-add">添加</button>
                </form>
            </div>
            <div class="list-section">
                <div class="list-header">
                    <h2>外卖记录</h2>
                    <div class="filter-bar">
                        <select id="takeout-date-filter">
                            <option value="">全部</option>
                            <option value="today">今天</option>
                            <option value="week">本周</option>
                            <option value="month">本月</option>
                        </select>
                    </div>
                </div>
                <div id="takeout-list" class="record-list"></div>
            </div>
        </section>

        <section id="ranking" class="tab-content">
            <div class="ranking-section">
                <h2>最喜欢的菜品排行</h2>
                <div class="ranking-tabs">
                    <button class="ranking-tab active" data-type="lunchbox">带饭</button>
                    <button class="ranking-tab" data-type="takeout">外卖</button>
                    <button class="ranking-tab" data-type="all">综合</button>
                </div>
                <div id="ranking-list" class="ranking-list"></div>
            </div>
        </section>

        <section id="crowd" class="tab-content">
            <div class="crowd-recommend">
                <h2>选择人群标签</h2>
                <div class="tag-group">
                    <label class="tag-label">
                        <input type="checkbox" name="crowd-tag" value="diet">
                        <span>减脂餐</span>
                    </label>
                    <label class="tag-label">
                        <input type="checkbox" name="crowd-tag" value="fitness">
                        <span>健身餐</span>
                    </label>
                    <label class="tag-label">
                        <input type="checkbox" name="crowd-tag" value="spicy">
                        <span>重口味</span>
                    </label>
                    <label class="tag-label">
                        <input type="checkbox" name="crowd-tag" value="light">
                        <span>清淡</span>
                    </label>
                    <label class="tag-label">
                        <input type="checkbox" name="crowd-tag" value="quick">
                        <span>快手菜</span>
                    </label>
                </div>
                <button id="btn-crowd-recommend" class="btn-primary">生成推荐</button>
                <div id="crowd-result" class="recommend-result"></div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="personal">
            <span class="nav-icon">🎲</span>
            <span class="nav-text">闭眼冲</span>
        </button>
        <button class="nav-item" data-tab="lunchbox">
            <span class="nav-icon">🍱</span>
            <span class="nav-text">带饭</span>
        </button>
        <button class="nav-item" data-tab="takeout">
            <span class="nav-icon">🥡</span>
            <span class="nav-text">外卖</span>
        </button>
        <button class="nav-item" data-tab="ranking">
            <span class="nav-icon">🏆</span>
            <span class="nav-text">排行</span>
        </button>
        <button class="nav-item" data-tab="crowd">
            <span class="nav-icon">👥</span>
            <span class="nav-text">人群</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
