        wordAnswer.value = "";
        sentencePrompt.textContent = "当前单词：" + word.en + "（" + word.zh + "）";
        sentenceInput.placeholder = "例如：" + word.tip;
        wordResult.textContent = "答对 +2 香蕉，连续答对有额外奖励。";
        loadReadWord();
      }

      function showPage(pageId) {
        homePage.classList.add("hidden");
        modePages.forEach(function (page) {
          page.classList.toggle("active", page.id === pageId);
        });
        if (pageId !== "timedPage" && timedActive) {
          endTimedMode("已离开限时写单词。");
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function showHome() {
        if (timedActive) endTimedMode("已返回首页。");
        homePage.classList.remove("hidden");
        modePages.forEach(function (page) { page.classList.remove("active"); });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function loadReadWord() {
        const word = words[currentIndex];
        readWord.textContent = word.en;
        readMeaning.textContent = "释义：" + word.zh;
        readMeaning.dataset.hidden = "false";
        reciteAnswer.value = "";
        reciteResult.textContent = "背对 +3 香蕉；如果浏览器支持语音，将自动朗读英文。";
        mnemonicCard.classList.remove("show");
        mnemonicCard.innerHTML = "";
        hideMeaningBtn.textContent = "隐藏释义";
      }

      function getMnemonic(word) {
        const en = word.en.toLowerCase();
        if (mnemonicMap[en]) return mnemonicMap[en];
        return en
          .replace(/tion$/g, "申")
          .replace(/sion$/g, "申")
          .replace(/ph/g, "夫")
          .replace(/th/g, "思")
          .replace(/ch/g, "吃")
          .replace(/sh/g, "许")
          .replace(/oo/g, "乌")
          .replace(/ee/g, "衣")
          .replace(/ea/g, "衣")
          .replace(/ou/g, "奥")
          .replace(/ow/g, "奥")
          .replace(/a/g, "啊")
          .replace(/e/g, "诶")
          .replace(/i/g, "伊")
          .replace(/o/g, "哦")
          .replace(/u/g, "优")
          .replace(/r/g, "儿")
          .replace(/l/g, "了")
          .replace(/m/g, "么")
          .replace(/n/g, "呢")
          .replace(/p/g, "坡")
          .replace(/b/g, "波")
          .replace(/t/g, "特")
          .replace(/d/g, "德")
          .replace(/k/g, "克")
          .replace(/c/g, "克")
          .replace(/g/g, "格")
          .replace(/f/g, "夫")
          .replace(/v/g, "微")
          .replace(/s/g, "丝")
          .replace(/z/g, "兹")
          .replace(/y/g, "伊")
          .replace(/w/g, "哇")
          .replace(/h/g, "哈")
          .replace(/j/g, "只")
          .replace(/q/g, "酷")
          .replace(/x/g, "克斯");
      }

      function showMnemonic(word) {
        const mnemonic = getMnemonic(word);
        mnemonicCard.innerHTML = "谐音记法：<strong>" + word.zh + "：" + mnemonic + "</strong><br>因为 <strong>" + word.en + "</strong> 的读音可以联想到“" + mnemonic + "”。";
        mnemonicCard.classList.add("show");
      }

      function switchLevel(level) {
        currentLevel = level;
        words = gradeBanks[currentLevel].words;
        currentIndex = 0;
        streak = 0;
        levelInfo.textContent = "当前词库：" + gradeBanks[currentLevel].name + "，共 " + words.length + " 个单词。";
        activeGradeTitle.textContent = "当前年级：" + gradeBanks[currentLevel].name;
        sentenceResult.textContent = "高质量句子可获得更多香蕉。";
        loadWord();
      }

      function speakCurrentWord() {
        const word = words[currentIndex];
        if (!("speechSynthesis" in window)) {
          reciteResult.textContent = "当前浏览器不支持自动朗读，请手动朗读：" + word.en;
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word.en);
        utterance.lang = "en-US";
        utterance.rate = 0.78;
        utterance.pitch = 1.05;
        window.speechSynthesis.speak(utterance);
      }

      function addBananas(amount, message) {
        bananas += amount;
        petMessage.textContent = message;
        render();
      }

      function startTimedMode() {
        clearInterval(timedTimer);
        timedSeconds = 60;
        timedActive = true;
        streak = 0;
        timerCount.textContent = timedSeconds;
        document.body.classList.add("timed-active");
        timerBar.classList.add("active");
        timedWordCard.classList.add("active");
        wordResult.textContent = "限时挑战开始！60 秒内尽量多写对单词。";
        wordAnswer.disabled = false;
        checkWordBtn.disabled = false;
        nextWordBtn.disabled = false;
        wordAnswer.focus();
        timedTimer = setInterval(function () {
          timedSeconds -= 1;
          timerCount.textContent = timedSeconds;
          if (timedSeconds <= 0) {
            endTimedMode("时间到！本轮限时写单词结束，答对获得的香蕉已保存。");
          }
        }, 1000);
      }

      function endTimedMode(message) {
        clearInterval(timedTimer);
        timedTimer = null;
        timedActive = false;
        document.body.classList.remove("timed-active");
        timerBar.classList.remove("active");
        wordAnswer.disabled = true;
        checkWordBtn.disabled = true;
        nextWordBtn.disabled = true;
        wordResult.textContent = message || "已退出限时写单词。";
      }

      feedBtn.addEventListener("click", function () {
        if (bananas <= 0) {
          petMessage.textContent = "香蕉不够啦，先去完成学习任务吧。";
          return;
        }
        if (stageIndex() === stages.length - 1) {
          petMessage.textContent = "小猴已经成为大师啦，继续答题可以囤香蕉。";
          return;
        }
        const beforeStage = stageIndex();
        bananas -= 1;
        fed += 1;
        const afterStage = stageIndex();
        const info = nextUpgradeInfo();
        if (afterStage > beforeStage) {
          petMessage.textContent = "升级成功！小猴成长为「" + stages[afterStage] + "」。";
        } else {
          petMessage.textContent = "投喂成功！距离下一阶段还需要 " + info.needed + " 根香蕉。";
        }
        render();
      });

      navButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          showPage(button.dataset.target);
        });
      });

      backHomeButtons.forEach(function (button) {
        button.addEventListener("click", showHome);
      });

      resetBtn.addEventListener("click", function () {
        endTimedMode("已重新开始。点击“开始限时写单词”进入挑战。");
        bananas = 3;
        fed = 0;
        streak = 0;
        currentIndex = 0;
        petMessage.textContent = "已重新开始。第一次升级需要 20 根香蕉。";
        sentenceResult.textContent = "高质量句子可获得更多香蕉。";
        loadWord();
        render();
      });

      startTimedBtn.addEventListener("click", startTimedMode);
      exitTimedBtn.addEventListener("click", function () {
        endTimedMode("已退出限时写单词。");
      });

      nextWordBtn.addEventListener("click", function () {
        currentIndex = (currentIndex + 1) % words.length;
        loadWord();
      });

      checkWordBtn.addEventListener("click", function () {
        if (!timedActive) {
          wordResult.textContent = "请先点击“开始限时写单词”。";
          return;
        }
        const answer = wordAnswer.value.trim().toLowerCase();
        const correct = words[currentIndex].en;
        if (!answer) {
          wordResult.textContent = "先输入你的答案。";
          return;
        }
        if (answer === correct) {
          streak += 1;
          const reward = streak >= 3 ? 4 : 2;
          addBananas(reward, "答对啦！获得 " + reward + " 根香蕉。");
          wordResult.textContent = streak >= 3 ? "连续答对 " + streak + " 题，触发双倍香蕉奖励。" : "回答正确，继续挑战下一题吧。";
          currentIndex = (currentIndex + 1) % words.length;
          setTimeout(loadWord, 700);
        } else {
          streak = 0;
          wordResult.textContent = "还差一点，正确答案是 " + correct + "。";
        }
      });

      wordAnswer.addEventListener("keydown", function (event) {
        if (event.key === "Enter") checkWordBtn.click();
      });

      levelSelect.addEventListener("change", function () {
        switchLevel(levelSelect.value);
      });

      speakWordBtn.addEventListener("click", speakCurrentWord);

      hideMeaningBtn.addEventListener("click", function () {
        const hidden = readMeaning.dataset.hidden === "true";
        if (hidden) {
          readMeaning.textContent = "释义：" + words[currentIndex].zh;
          readMeaning.dataset.hidden = "false";
          hideMeaningBtn.textContent = "隐藏释义";
        } else {
          readMeaning.textContent = "释义已隐藏，请凭记忆默写。";
          readMeaning.dataset.hidden = "true";
          hideMeaningBtn.textContent = "显示释义";
        }
      });

      nextReadBtn.addEventListener("click", function () {
        currentIndex = (currentIndex + 1) % words.length;
        loadWord();
        speakCurrentWord();
      });

      checkReciteBtn.addEventListener("click", function () {
        const answer = reciteAnswer.value.trim().toLowerCase();
        const correct = words[currentIndex].en;
        if (!answer) {
          reciteResult.textContent = "请先默写你记住的单词。";
          return;
        }
        if (answer === correct) {
          const currentWord = words[currentIndex];
          addBananas(3, "读背成功！获得 3 根香蕉。");
          reciteResult.textContent = "背对啦！下面给你一个谐音记法。";
          showMnemonic(currentWord);
          currentIndex = (currentIndex + 1) % words.length;
          setTimeout(loadWord, 2600);
        } else {
          mnemonicCard.classList.remove("show");
          reciteResult.textContent = "还没背准，正确拼写是 " + correct + "，可以再听一遍。";
        }
      });

      reciteAnswer.addEventListener("keydown", function (event) {
        if (event.key === "Enter") checkReciteBtn.click();
      });

      scoreSentenceBtn.addEventListener("click", function () {
        const sentence = sentenceInput.value.trim();
        const word = words[currentIndex].en;
        if (!sentence) {
          sentenceResult.textContent = "请先写一句英文句子。";
          return;
        }
        let score = 55;
        if (new RegExp("\\b" + word + "s?\\b", "i").test(sentence)) score += 18;
        if (sentence.split(/\s+/).length >= 6) score += 12;
        if (/[.!?]$/.test(sentence)) score += 8;
        if (/^[A-Z]/.test(sentence)) score += 7;
        score = Math.min(100, score);
        const reward = score >= 90 ? 4 : score >= 75 ? 3 : score >= 60 ? 1 : 0;
        if (reward > 0) addBananas(reward, "造句评分 " + score + " 分，获得 " + reward + " 根香蕉。");
        sentenceResult.textContent = reward > 0
          ? "评分：" + score + "。句子结构不错，可以继续尝试更自然的表达。"
          : "评分：" + score + "。建议包含当前单词、写满 6 个词，并以标点结尾。";
      });

      switchLevel(currentLevel);
      wordAnswer.disabled = true;
      checkWordBtn.disabled = true;
      nextWordBtn.disabled = true;
      render();
    })();
  </script>
</body>
</html>
