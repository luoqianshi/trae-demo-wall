<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevLab 逆向实验室 — JS 逆向可视化教学沙箱 | Trae AI 创造力大赛</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{
  --bg-primary:#0d1117; --bg-secondary:#161b22; --bg-card:#1c2128; --bg-card2:#22272e;
  --border:#30363d; --border2:#21262d;
  --text-primary:#e6edf3; --text-secondary:#8b949e; --text-tertiary:#484f58;
  --brand:#a371f7; --brand-dim:#8b5cf6; --cyan:#39c5cf;
  --green:#3fb950; --red:#f85149; --yellow:#d29922; --orange:#db6d28; --blue:#58a6ff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans CJK SC','Microsoft YaHei',-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
code,pre,.mono{font-family:'JetBrains Mono','Fira Code','Consolas','Courier New',monospace}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-primary)}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
.hidden{display:none!important}

/* ===== NAV ===== */
.nav{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer}
.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{display:flex;flex-direction:column;line-height:1.2}
.logo-text .sub{font-size:10px;color:var(--text-secondary);font-weight:400}
.track-badge{background:rgba(163,113,247,.15);color:var(--brand);padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.nav-links{display:flex;gap:4px}
.nav-links a{color:var(--text-secondary);font-size:13px;padding:6px 14px;border-radius:6px;transition:.2s;cursor:pointer}
.nav-links a:hover{color:var(--text-primary);background:rgba(255,255,255,.06)}
.nav-links a.active{color:var(--brand);background:rgba(163,113,247,.1)}
.nav-right{display:flex;align-items:center;gap:12px}
.level-pill{background:linear-gradient(135deg,var(--brand),var(--cyan));color:#fff;padding:4px 12px;border-radius:14px;font-size:12px;font-weight:600}
.avatar-circle{width:32px;height:32px;border-radius:50%;background:var(--bg-card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;position:relative}
.avatar-menu{position:absolute;top:42px;right:0;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:6px;min-width:140px;display:none;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.avatar-menu.show{display:block}
.avatar-menu a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--text-secondary);cursor:pointer}
.avatar-menu a:hover{background:rgba(255,255,255,.06);color:var(--text-primary)}

/* ===== CONTAINER ===== */
.container{max-width:1400px;margin:0 auto;padding:24px 28px}
.page-title{font-size:24px;font-weight:700;margin-bottom:4px}
.page-desc{color:var(--text-secondary);font-size:14px;margin-bottom:24px}

/* ===== CARDS ===== */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px}
.card:hover{border-color:#484f58}

/* ===== STATS GRID ===== */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--brand)}
.stat-label{color:var(--text-tertiary);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-val{font-size:24px;font-weight:700;margin-bottom:2px}
.stat-sub{font-size:11px;color:var(--text-secondary)}

/* ===== BUTTONS ===== */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand);background:var(--bg-card2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dim)}
.btn.secondary{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.lg{padding:12px 24px;font-size:15px}

/* ===== FORM ===== */
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px}
.form-input{width:100%;padding:10px 14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;transition:.2s}
.form-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(163,113,247,.15)}
.form-input::placeholder{color:var(--text-tertiary)}
textarea.form-input{resize:vertical;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5}

/* ===== LOGIN ===== */
.login-wrap{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:40px 28px}
.login-card{width:100%;max-width:440px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:40px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .logo-icon{width:56px;height:56px;font-size:28px;margin:0 auto 16px}
.login-logo h1{font-size:22px;font-weight:700;margin-bottom:4px}
.login-logo p{color:var(--text-secondary);font-size:13px}
.tab-row{display:flex;gap:4px;background:var(--bg-primary);border-radius:8px;padding:4px;margin-bottom:24px}
.tab-btn{flex:1;padding:8px;text-align:center;border-radius:6px;font-size:13px;color:var(--text-secondary);transition:.2s;cursor:pointer}
.tab-btn.active{background:var(--brand);color:#fff}
.demo-btn{width:100%;padding:10px;margin-top:12px;background:rgba(163,113,247,.1);border:1px dashed var(--brand);border-radius:8px;color:var(--brand);font-size:13px;cursor:pointer;transition:.2s}
.demo-btn:hover{background:rgba(163,113,247,.2)}

/* ===== LEVEL CARDS ===== */
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.level-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:.2s;position:relative}
.level-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.level-card.completed{border-color:var(--green)}
.level-card.in-progress{border-color:var(--brand)}
.level-card.locked{opacity:.5;cursor:not-allowed}
.level-card.locked:hover{transform:none;border-color:var(--border)}
.level-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.level-tag{font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px}
.level-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.level-status.completed{background:rgba(59,185,80,.15);color:var(--green)}
.level-status.in-progress{background:rgba(163,113,247,.15);color:var(--brand)}
.level-status.locked{background:rgba(72,79,88,.2);color:var(--text-tertiary)}
.level-title{font-size:16px;font-weight:600;margin-bottom:6px}
.level-desc{font-size:13px;color:var(--text-secondary);margin-bottom:14px;line-height:1.5}
.level-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-tertiary)}
.diff-dots{display:flex;gap:3px}
.diff-dot{width:7px;height:7px;border-radius:50%;background:var(--border)}
.diff-dot.filled{background:var(--yellow)}

/* ===== STEP PROGRESS ===== */
.progress-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px}
.progress-label{font-size:12px;color:var(--text-secondary);margin-bottom:14px}
.steps-row{display:flex;align-items:center}
.step-node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px}
.step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.step-done{background:var(--green);color:#0d1117}
.step-active{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(163,113,247,.2)}
.step-pending{background:var(--bg-card2);color:var(--text-tertiary);border:1px solid var(--border)}
.step-name{font-size:11px;color:var(--text-tertiary);text-align:center;white-space:nowrap}
.step-name.done{color:var(--green)}
.step-name.active{color:var(--brand)}
.step-connector{flex:1;height:2px;background:var(--border);margin:0 -10px;margin-top:-22px}
.step-connector.done{background:var(--green)}
.step-connector.half{background:linear-gradient(90deg,var(--green) 50%,var(--border) 50%)}

/* ===== CODE AREA ===== */
.code-area{background:#010409;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:12px 0}
.code-header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg-secondary);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-secondary)}
.code-header .dot{width:10px;height:10px;border-radius:50%}
.code-body{padding:14px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;white-space:pre;color:var(--text-primary);min-height:120px}
.code-body textarea{width:100%;min-height:200px;background:transparent;border:none;color:var(--text-primary);font-family:inherit;font-size:13px;line-height:1.6;resize:vertical}
.code-body textarea:focus{outline:none}

/* syntax highlight */
.syn-kw{color:#ff7b72}.syn-str{color:#a5d6ff}.syn-fn{color:#d2a8ff}.syn-num{color:#79c0ff}.syn-cm{color:#8b949e;font-style:italic}.syn-var{color:#ffa657}.syn-op{color:#ff7b72}.syn-prop{color:#79c0ff}

/* ===== HINT BOX ===== */
.hint-box{display:flex;gap:10px;padding:12px 16px;background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.3);border-radius:8px;margin:12px 0}
.hint-title{color:var(--yellow);font-weight:600;font-size:13px;white-space:nowrap}
.hint-text{font-size:13px;color:var(--text-secondary)}

/* ===== OBJECTIVES ===== */
.obj-list{display:flex;flex-direction:column;gap:10px}
.obj-item{display:flex;align-items:center;gap:10px;font-size:13px}
.obj-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.obj-done{background:var(--green);color:#0d1117}
.obj-current{background:var(--brand);animation:pulse 1.5s infinite}
.obj-pending{background:var(--bg-card2);border:1px solid var(--border)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(163,113,247,.4)}50%{box-shadow:0 0 0 6px rgba(163,113,247,0)}}

/* ===== ACTION BAR ===== */
.action-bar{position:sticky;bottom:0;left:0;right:0;background:rgba(22,27,34,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:14px 28px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:50}

/* ===== TERMINAL ===== */
.terminal{background:#010409;border:1px solid var(--border);border-radius:8px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;min-height:160px;max-height:320px;overflow-y:auto}
.term-line{white-space:pre-wrap;word-break:break-all}
.term-info{color:var(--text-secondary)}
.term-ok{color:var(--green)}
.term-done{color:var(--cyan)}
.term-err{color:var(--red)}
.cursor-blink{display:inline-block;width:8px;height:14px;background:var(--green);animation:blink 1s infinite;vertical-align:middle}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ===== SPINNER ===== */
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== BADGES GRID ===== */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.badge-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;transition:.2s}
.badge-card.unlocked{border-color:var(--brand);background:linear-gradient(135deg,rgba(163,113,247,.05),rgba(57,197,207,.05))}
.badge-card.locked{opacity:.5}
.badge-icon{font-size:40px;margin-bottom:10px}
.badge-name{font-size:14px;font-weight:600;margin-bottom:4px}
.badge-desc{font-size:12px;color:var(--text-secondary)}
.badge-xp{font-size:11px;color:var(--yellow);margin-top:6px}

/* ===== KNOWLEDGE ===== */
.knowledge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.kn-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:.2s}
.kn-card:hover{border-color:var(--brand)}
.kn-icon{font-size:28px;margin-bottom:10px}
.kn-title{font-size:15px;font-weight:600;margin-bottom:6px}
.kn-desc{font-size:13px;color:var(--text-secondary);line-height:1.5}
.kn-detail{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:24px}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tag{padding:5px 14px;border-radius:16px;font-size:12px;cursor:pointer;transition:.2s;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary)}
.tag.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.tag:hover:not(.active){border-color:var(--brand);color:var(--text-primary)}

/* ===== SKILL BAR ===== */
.skill-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.skill-name{width:80px;font-size:13px;color:var(--text-secondary)}
.skill-bar{flex:1;height:8px;background:var(--bg-primary);border-radius:4px;overflow:hidden}
.skill-fill{height:100%;border-radius:4px;transition:width .6s}
.skill-pct{width:40px;text-align:right;font-size:12px;color:var(--text-secondary)}

/* ===== COMPARE ===== */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare-col{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.compare-col h3{padding:10px 16px;font-size:13px;color:var(--text-secondary);border-bottom:1px solid var(--border);background:var(--bg-secondary)}

/* ===== TOAST ===== */
.toast-wrap{position:fixed;top:70px;right:28px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:slideIn .3s;max-width:360px}
.toast.success{background:rgba(59,185,80,.15);border:1px solid var(--green);color:var(--green)}
.toast.error{background:rgba(248,81,73,.15);border:1px solid var(--red);color:var(--red)}
.toast.warning{background:rgba(210,153,34,.15);border:1px solid var(--yellow);color:var(--yellow)}
.toast.info{background:rgba(88,166,255,.15);border:1px solid var(--blue);color:var(--blue)}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== SCORE MODAL ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:36px;max-width:420px;text-align:center}
.modal-score{font-size:56px;font-weight:700;color:var(--green);margin:12px 0}
.modal h2{font-size:20px;margin-bottom:8px}

/* ===== GRID HELPERS ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.flex{display:flex}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}
.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.text-sm{font-size:13px}.text-xs{font-size:12px}
.text-secondary{color:var(--text-secondary)}.text-tertiary{color:var(--text-tertiary)}
.text-brand{color:var(--brand)}.text-green{color:var(--green)}.text-yellow{color:var(--yellow)}.text-cyan{color:var(--cyan)}
.font-bold{font-weight:700}.font-semibold{font-weight:600}
.section-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}

@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .compare-grid,.grid-2{grid-template-columns:1fr}
  .nav-links{display:none}
  .container{padding:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ==================== DATA ====================
const LEVELS = [
  {id:1,name:'入门：认识混淆',description:'了解 JS 混淆的基本概念和常见混淆手段',difficulty:1,category:'basic',order:1,xp_reward:50,
    obfuscated_code:"var _0x1234 = ['hello', 'world'];\nfunction _0x5678(_0x9abc) {\n  return _0x1234[_0x9abc];\n}\nconsole.log(_0x5678(0) + ' ' + _0x5678(1));",

    obfuscated_code:"var _0x1a2b = ['hello', 'world', 'log', 'alert'];\nfunction _0x3c4d(_0x5e6f) {\n  return _0x1a2b[_0x5e6f - 0x0];\n}\nfunction main() {\n  var method = _0x3c4d(0x2);\n  console[_0x3c4d(0x2)](_0x3c4d(0x0) + ' ' + _0x3c4d(0x1));\n}\nmain();",
    deobfuscated_code:"function main() {\n  var method = 'log';\n  console[method]('hello world');\n}\nmain();",
    objectives:['准确识别字符串数组','定位解密函数','理解索引计算方式'],
    steps:['定位字符串数组变量','找到数组访问函数','分析索引计算逻辑','手动还原部分调用'],
    tips:'注意解密函数中的索引偏移计算，常见的有减 0x0、加常量等。'},
  {id:3,name:'OB 混淆还原',description:'使用 AST 还原 OB 混淆代码',difficulty:3,category:'ast',order:3,xp_reward:120,
    obfuscated_code:"var _0x1a2b = ['hello', 'world', 'log'];\nfunction _0x3c4d(_0x5e6f, _0x7g8h) {\n  return _0x1a2b[_0x5e6f - 0x0];\n}\nfunction _0x9i0j() {\n  var _0xa1b2 = _0x3c4d(0x2);\n  console[_0x3c4d(0x0)](\n    _0x3c4d(0x0) + ' ' +\n    _0x3c4d(0x1)\n  );\n}\n_0x9i0j();",
    deobfuscated_code:"function greet() {\n  var method = 'log';\n  console[method]('hello' + ' ' + 'world');\n}\ngreet();",
    objectives:['理解 AST 基本概念','使用 Babel 解析代码','遍历 AST 节点','替换字符串调用'],
    steps:['使用 Babel 解析代码为 AST','遍历查找字符串数组','定位解密函数调用','替换为原始字符串','生成还原后的代码'],

const CATEGORY_LABELS = {basic:'混淆基础',ast:'AST工具',debug:'动态调试',advanced:'高级混淆'};

// ==================== STORE ====================
const Store = {
  get(key, def) {
    try { const v = localStorage.getItem('revlab_' + key); return v ? JSON.parse(v) : def; }
    catch(e) { return def; }
  },
  set(key, val) { localStorage.setItem('revlab_' + key, JSON.stringify(val)); },
  remove(key) { localStorage.removeItem('revlab_' + key); },
  getUser() { return this.get('user', null); },
  setUser(u) { this.set('user', u); },
  getUsers() { return this.get('users', []); },
  setUsers(u) { this.set('users', u); },
  getProgress() { return this.get('progress', {}); },
  setProgress(p) { this.set('progress', p); },
  getPractice() { return this.get('practice', []); },
  addPractice(r) { const p = this.getPractice(); p.unshift(r); this.set('practice', p.slice(0, 50)); },
  getBadges() { return this.get('badges', []); },
  addBadge(id) { const b = this.getBadges(); if(!b.includes(id)) { b.push(id); this.set('badges', b); return true; } return false; },
  getKnowledge() { return this.get('knowledge', {viewed:[], mastered:[]}); },
  setKnowledge(k) { this.set('knowledge', k); },
  isLoggedIn() { return this.get('logged_in', false); },
  setLoggedIn(v) { this.set('logged_in', v); },
  reset() { ['user','progress','practice','badges','knowledge','logged_in'].forEach(k => this.remove(k)); }
};

// ==================== AUTH ====================
const Auth = {
  initDemoUser() {
    const users = Store.getUsers();
    if(!users.find(u => u.username === 'demo')) {
      const demoUser = {
        id: 1, username: 'demo', password: 'demo123456',
        nickname: 'Demo 用户', email: 'demo@revlab.dev',
        avatar: null, level: 3, xp: 320, next_level_xp: 450,
        practice_hours: 12.5, continuous_days: 5, rank: 128,
        date_joined: '2026-06-15T10:00:00Z'
      };
      users.push(demoUser);
      Store.setUsers(users);
      // demo preset progress: level 1 & 2 completed
      Store.setProgress({
        1: {status:'completed', best_score:95, attempts:1, total_time:120, current_step:6},
        2: {status:'completed', best_score:88, attempts:2, total_time:300, current_step:6}
      });
      Store.set('badges', [1, 2]);
    }
  },
  login(username, password) {
    const users = Store.getUsers();
    const user = users.find(u => u.username === username && u.password === password);
    if(user) {
      const { password, ...safeUser } = user;
      Store.setUser(safeUser);
      Store.setLoggedIn(true);
      return { success: true, user: safeUser };
    }
    return { success: false, error: '用户名或密码错误' };
  },
  register(data) {
    const users = Store.getUsers();
    if(users.find(u => u.username === data.username)) {
      return { success: false, error: '用户名已存在' };
    }
    const newUser = {
      id: Date.now(), username: data.username, password: data.password,
      nickname: data.nickname || data.username, email: data.email || '',
      avatar: null, level: 1, xp: 0, next_level_xp: 150,
      practice_hours: 0, continuous_days: 1, rank: 9999,
      date_joined: new Date().toISOString()
    };
    users.push(newUser);
    Store.setUsers(users);
    const { password, ...safeUser } = newUser;
    Store.setUser(safeUser);
    Store.setLoggedIn(true);
    Store.setProgress({});
    Store.set('badges', []);
    return { success: true, user: safeUser };
  },
  logout() {
    Store.setLoggedIn(false);
    Store.remove('user');
  },
  updateUser(updates) {
    const user = Store.getUser();
    if(!user) return;
    const updated = {...user, ...updates};
    Store.setUser(updated);
    const users = Store.getUsers();
    const idx = users.findIndex(u => u.username === user.username);
    if(idx >= 0) { users[idx] = {...users[idx], ...updates}; Store.setUsers(users); }
  }
};

// ==================== DEOBFUSCATOR (ported from Python) ====================
const Deobfuscator = {
  deobfuscate(code, strategy) {
    const strategyLabel = STRATEGY_LABELS[strategy] || strategy;
    const logs = [
      '[INFO] 加载代码文件...',
      '[INFO] 检测混淆类型: OBfuscator.io',
      '[INFO] 正在解析 AST 节点...',
      `[INFO] 使用策略: ${strategyLabel}`,
    ];
    if(strategy === 'string-decrypt') {
      const stringCount = (code.match(/_0x[0-9a-fA-F]{2,}\s*\(\s*0x[0-9a-fA-F]+\s*\)/g)||[]).length;
      const arrayCount = (code.match(/var\s+_0x[0-9a-fA-F]+\s*=\s*\[/g)||[]).length;
      logs.push(`[INFO] 定位字符串数组: ${arrayCount} 个`);
      logs.push(`[INFO] 解密函数调用: ${stringCount} 处`);
      logs.push('[INFO] 内联字符串字面量...');
      logs.push(`[DONE] 字符串解密完成: ${stringCount} 项已还原`);
    } else if(strategy === 'control-flow') {
      const switchCount = (code.match(/switch\s*\(/g)||[]).length;
      const whileCount = (code.match(/while\s*\(\s*!!\[\]\s*\)/g)||[]).length + (code.match(/while\s*\(\s*true\s*\)/g)||[]).length;
      logs.push(`[INFO] 检测到 while 循环分发器: ${whileCount} 处`);
      logs.push(`[INFO] 检测到 switch-case 分支: ${switchCount} 个`);
      logs.push('[INFO] 分析状态变量流转...');
      logs.push('[INFO] 重建顺序执行流...');
      logs.push(`[DONE] 控制流还原完成: ${whileCount} 个分发器已消除`);
    } else if(strategy === 'hook-intercept') {
      const evalCount = (code.match(/\beval\s*\(/g)||[]).length;
      const funcCount = (code.match(/function\s+_0x[0-9a-fA-F]+\s*\(/g)||[]).length;
      logs.push(`[INFO] 识别可 Hook 函数: ${funcCount} 个`);
      logs.push(`[INFO] 识别 eval 调用: ${evalCount} 处`);
      logs.push('[INFO] 注入 Hook 包装器...');
      logs.push('[INFO] 拦截 Function.prototype.call...');
      logs.push('[DONE] Hook 拦截已部署，运行时将记录调用参数');
    } else {
      const stringCount = (code.match(/_0x[0-9a-fA-F]{2,}\s*\(\s*0x[0-9a-fA-F]+\s*\)/g)||[]).length;
      const switchCount = (code.match(/switch\s*\(/g)||[]).length;
      logs.push(`[INFO] 字符串解密: ${stringCount} 项已还原`);
      logs.push(`[INFO] 控制流还原: ${switchCount} 个块已简化`);
      logs.push('[INFO] 标识符重命名: 8 个变量已重命名');
      logs.push('[INFO] 死代码消除: 3 处已清理');
      logs.push('[DONE] 完整还原完成');
    }
    const outputCode = this._deobfuscateByStrategy(code, strategy);
    const readabilityBefore = this._calculateReadability(code);
    const readabilityAfter = this._calculateReadability(outputCode);
    logs.push(`[INFO] 可读性: ${Math.round(readabilityBefore)}% -> ${Math.round(readabilityAfter)}%`);
    return { output_code: outputCode, readability_before: readabilityBefore, readability_after: readabilityAfter, logs, ast_json: this._sampleAst() };
  },
  _deobfuscateByStrategy(code, strategy) {
    if(strategy === 'string-decrypt') return this._restoreStrings(code);
    if(strategy === 'control-flow') return this._restoreControlFlow(code);
    if(strategy === 'hook-intercept') return this._injectHooks(code);
    let result = this._restoreStrings(code);
    result = this._restoreControlFlow(result);
    result = this._injectHooks(result);
    return result;
  },
  _restoreStrings(code) {
    const arrayMatch = code.match(/(?:var|const|let)\s+(_0x[0-9a-fA-F]+)\s*=\s*\[([^\]]*)\];/);
    if(arrayMatch) {
      const arrName = arrayMatch[1];
      const arrContent = arrayMatch[2];
      const strings = [];
      const re = /'([^']*)'|"([^"]*)"/g;
      let m;
      while((m = re.exec(arrContent)) !== null) { strings.push(m[1] !== undefined ? m[1] : m[2]); }
      const callPattern = new RegExp(arrName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\(\\s*(0x[0-9a-fA-F]+|\\d+)\\s*\\)', 'g');
      let result = code.replace(callPattern, (match, idxHex) => {
        const idx = idxHex.startsWith('0x') ? parseInt(idxHex, 16) : parseInt(idxHex);
        if(idx >= 0 && idx < strings.length) return `'${strings[idx]}'`;
        return match;
      });
      result = result.replace(arrayMatch[0], `// 字符串数组 ${arrName} 已内联（共 ${strings.length} 项）`);
      return result;
    }
    // decode hex strings
    return code.replace(/'((?:\\x[0-9a-fA-F]{2})+)'/g, (match, hexStr) => {
      try {
        const decoded = hexStr.replace(/\\x/g, '').match(/.{2}/g).map(h => String.fromCharCode(parseInt(h, 16))).join('');
        return `'${decoded}'`;
      } catch(e) { return match; }
    });
  },
  _restoreControlFlow(code) {
    const pattern = /while\s*\(\s*!!\[\]\s*\)\s*\{\s*switch\s*\(\s*(\w+)\s*\)\s*\{([\s\S]*?)\}\s*break;\s*\}/g;
    const patternTrue = /while\s*\(\s*true\s*\)\s*\{\s*switch\s*\(\s*(\w+)\s*\)\s*\{([\s\S]*?)\}\s*\}/g;
    const flatten = (match, stateVar, casesBlock) => {
      const casePattern = /case\s+[^\n:]*:\s*([\s\S]*?)(?=case\s|break;|$)/g;
      const statements = [];
      let cm;
      while((cm = casePattern.exec(casesBlock)) !== null) {
        let stmt = cm[1].trim();
        stmt = stmt.replace(new RegExp(stateVar.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*=\\s*[^;]+;\\s*', 'g'), '');
        stmt = stmt.replace(/continue;?/g, '').trim();
        if(stmt) statements.push(stmt);
      }
      return statements.length ? statements.join('\n  ') : '/* 控制流已还原 */';
    };
    let result = code.replace(pattern, flatten);
    result = result.replace(patternTrue, flatten);
    if(result === code) result = '// 未检测到控制流平坦化特征，代码未改动\n' + code;
    return result;
  },
  _injectHooks(code) {
    const hooks = [];
    const hookCode = [];
    if(/\beval\s*\(/.test(code)) {
      hooks.push('eval');
      hookCode.push("// Hook: 拦截 eval 调用\nconst _originalEval = window.eval;\nwindow.eval = function(code) {\n  console.log('[Hook] eval 被调用, 参数长度:', code.length);\n  return _originalEval.call(this, code);\n};\n");
    }
    const decryptFuncs = code.match(/function\s+(_0x[0-9a-fA-F]+)\s*\(/g) || [];
    decryptFuncs.slice(0, 3).forEach(m => {
      const funcName = m.match(/function\s+(_0x[0-9a-fA-F]+)/)[1];
      hooks.push(funcName);
      const origName = '_original' + funcName.slice(1);
      hookCode.push(`// Hook: 拦截解密函数 ${funcName}\nconst ${origName} = ${funcName};\n${funcName} = function() {\n  const args = Array.from(arguments);\n  const result = ${origName}.apply(this, args);\n  console.log('[Hook] ${funcName}(' + args.join(', ') + ') =', result);\n  return result;\n};\n`);
    });
    if(/\bnew\s+Function\s*\(/.test(code)) {
      hooks.push('Function');
      hookCode.push("// Hook: 拦截 new Function()\nconst _OriginalFunction = Function;\nwindow.Function = function() {\n  const args = Array.from(arguments);\n  console.log('[Hook] new Function 被调用, 参数:', args);\n  return new _OriginalFunction(...args);\n};\n");
    }
    if(!hooks.length) return "// 未检测到可 Hook 的函数（eval / 解密函数 / Function 构造器）\n// 原代码保持不变：\n" + code;
    const header = `// ============================================\n// Hook 拦截已部署，共 ${hooks.length} 个 Hook 点: ${hooks.join(', ')}\n// 原代码保持不变，运行时将通过 console.log 输出调用记录\n// ============================================\n\n`;
    return header + hookCode.join('\n') + '\n// ===== 以下是原始代码 =====\n' + code;
  },
  _calculateReadability(code) {
    if(!code) return 0;
    const lines = code.split('\n');
    const meaningful = lines.filter(l => l.trim() && !l.trim().startsWith('//') && !l.trim().startsWith('/*'));
    if(!meaningful.length) return 0;
    let penalty = 0;
    if(/_[0-9a-fA-F]{4,}/.test(code)) penalty += 40;
    if(/\\x[0-9a-fA-F]{2}/.test(code)) penalty += 20;
    if(/while\s*\(\s*!!\[\]\s*\)/.test(code)) penalty += 15;
    let base = Math.max(8, 95 - penalty);
    if(meaningful.some(l => l.includes('  '))) base += 3;
    return Math.min(98, Math.max(5, base));
  },
  _sampleAst() {
    return {type:'Program',body:[
      {type:'VariableDeclaration',declarations:[{type:'VariableDeclarator',id:{type:'Identifier',name:'encryptConfig'},init:{type:'ObjectExpression',properties:[]}}]},
      {type:'FunctionDeclaration',id:{type:'Identifier',name:'processUserData'},body:{type:'BlockStatement',body:[]}}
    ]};
  }
};

// ==================== GAME LOGIC ====================
const GameLogic = {
  startLevel(levelId) {
    const progress = Store.getProgress();
    if(!progress[levelId]) {
      progress[levelId] = {status:'in_progress', best_score:0, attempts:0, total_time:0, current_step:1};
    } else if(progress[levelId].status === 'locked' || progress[levelId].status === 'completed') {
      progress[levelId].status = 'in_progress';
      progress[levelId].current_step = 1;
    }
    Store.setProgress(progress);
  },
  completeLevel(levelId, score, timeSpent) {
    const level = LEVELS.find(l => l.id === levelId);
    if(!level) return;
    const progress = Store.getProgress();
    if(!progress[levelId]) progress[levelId] = {status:'in_progress', best_score:0, attempts:0, total_time:0, current_step:1};
    const p = progress[levelId];
    p.attempts = (p.attempts || 0) + 1;
    p.total_time = (p.total_time || 0) + timeSpent;
    if(score > (p.best_score || 0)) p.best_score = score;
    const newlyUnlockedBadges = [];
    if(score >= 60) {
      p.status = 'completed';
      p.current_step = 6;
      // award XP
      const user = Store.getUser();
      if(user) {
        user.xp = (user.xp || 0) + level.xp_reward;
        while(user.xp >= user.next_level_xp) {
          user.xp -= user.next_level_xp;
          user.level = (user.level || 1) + 1;
          user.next_level_xp = Math.round(user.next_level_xp * 1.5);
        }
        Auth.updateUser(user);
      }
      // unlock next level
      const nextLevel = LEVELS.find(l => l.order === level.order + 1);
      if(nextLevel && (!progress[nextLevel.id] || progress[nextLevel.id].status === 'locked')) {
        progress[nextLevel.id] = {status:'in_progress', best_score:0, attempts:0, total_time:0, current_step:1};
      }
      // check badges
      newlyUnlockedBadges.push(...this._checkBadges(score, timeSpent, p.attempts));
    }
    Store.setProgress(progress);
    return { score, newlyUnlockedBadges };
  },
  _checkBadges(score, timeSpent, attempts) {
    const unlocked = Store.getBadges();
    const progress = Store.getProgress();
    const completedCount = Object.values(progress).filter(p => p.status === 'completed').length;
    const newBadges = [];
    BADGES.forEach(b => {
      if(unlocked.includes(b.id)) return;
      let shouldUnlock = false;
      switch(b.condition_type) {
        case 'completed_levels': shouldUnlock = completedCount >= b.condition_value; break;
        case 'completed_level': shouldUnlock = completedCount >= 1; break;
        case 'all_levels': shouldUnlock = completedCount >= 8; break;
        case 'completed_ast_levels': shouldUnlock = completedCount >= 3; break;
        case 'completed_env_levels': shouldUnlock = completedCount >= 7; break;
        case 'fast_completion': shouldUnlock = timeSpent <= b.condition_value; break;
        case 'perfect_score': shouldUnlock = score >= 100; break;
        case 'first_try': shouldUnlock = attempts === 1; break;
        case 'sandbox_uses': shouldUnlock = Store.getPractice().length >= b.condition_value; break;
      }
      if(shouldUnlock) {
        Store.addBadge(b.id);
        newBadges.push(b);
        const user = Store.getUser();
        if(user) { user.xp = (user.xp || 0) + b.xp_reward; Auth.updateUser(user); }
      }
    });
    return newBadges;
  },
  getLevelStatus(levelId) {
    const progress = Store.getProgress();
    const level = LEVELS.find(l => l.id === levelId);
    if(!level) return 'locked';
    const p = progress[levelId];
    if(p) return p.status;
    // level 1 is always in_progress, others locked unless previous completed
    if(level.order === 1) return 'in_progress';
    const prevLevel = LEVELS.find(l => l.order === level.order - 1);
    if(prevLevel && progress[prevLevel.id]?.status === 'completed') return 'in_progress';
    return 'locked';
  }
};

// ==================== TOAST ====================
function toast(msg, type='info') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(400px)'; setTimeout(() => el.remove(), 300); }, 3000);
}

// ==================== ROUTER ====================
const Router = {
  routes: [
    {pattern:/^\/?login$/, view:'login', public:true},
    {pattern:/^\/?dashboard$/, view:'dashboard'},
    {pattern:/^\/?workspace$/, view:'workspace'},
    {pattern:/^\/?workspace\/level\/(\d+)$/, view:'levelDetail'},
    {pattern:/^\/?sandbox$/, view:'sandbox'},
    {pattern:/^\/?knowledge$/, view:'knowledge'},
    {pattern:/^\/?achievements$/, view:'achievements'},
    {pattern:/^\/?code-compare$/, view:'codeCompare'},
    {pattern:/^\/?settings$/, view:'settings'},
  ],
  currentView: '',
  handle() {
    const hash = location.hash.slice(1) || '/login';
    const path = hash.startsWith('/') ? hash : '/' + hash;
    for(const route of this.routes) {
      const match = path.match(route.pattern);
      if(match) {
        if(!route.public && !Store.isLoggedIn()) {
          location.hash = '/login';
          return;
        }
        this.currentView = route.view;
        this.render(route.view, match.slice(1));
        return;
      }
    }
    location.hash = '/login';
  },
  render(view, params) {
    const app = document.getElementById('app');
    const isLogin = view === 'login';
    let html = '';
    if(!isLogin) html += Views.header();
    html += Views[view](...(params || [])) || '';
    app.innerHTML = html;
    window.scrollTo(0, 0);
    // update nav active
    document.querySelectorAll('.nav-links a').forEach(a => {
      a.classList.toggle('active', a.dataset.route === this.currentView);
    });
    // post-render hooks
    if(Views[view + 'AfterRender']) Views[view + 'AfterRender'](...(params || []));
  },
  go(path) { location.hash = path; }
};

async function executeStep(levelId) {
  const page = document.getElementById('levelDetailPage');
  let currentStep = parseInt(page.dataset.currentStep);
  if(currentStep > 5) return;
  const btn = document.getElementById('execBtn');
  const spinner = document.getElementById('execSpinner');
  const text = document.getElementById('execText');
  btn.disabled = true;
  spinner.classList.remove('hidden');
  text.textContent = '执行中...';
  const level = LEVELS.find(l => l.id === levelId);
  // simulate deobfuscate call
  await new Promise(r => setTimeout(r, 800));
  if(level.obfuscated_code) {
    Deobfuscator.deobfuscate(level.obfuscated_code, 'string-decrypt');
  }
  currentStep++;
  // update progress
  const progress = Store.getProgress();
  if(!progress[levelId]) progress[levelId] = {status:'in_progress', best_score:0, attempts:0, total_time:0, current_step:1};
  progress[levelId].current_step = currentStep;
  Store.setProgress(progress);
  if(currentStep > 5) {
    // complete level
    const timeSpent = Math.round((Date.now() - (window._levelStartTime || Date.now())) / 1000);
    const score = 90;
    const result = GameLogic.completeLevel(levelId, score, timeSpent);
    window._levelStartTime = null;
    showScoreModal(score, level, result.newlyUnlockedBadges);
  } else {
    toast(`步骤 ${currentStep - 1} 已完成`, 'success');
    Router.render('levelDetail', String(levelId));
  }
}

  const page = document.getElementById('levelDetailPage');

  currentStep--;
  const progress = Store.getProgress();
  if(progress[levelId]) { progress[levelId].current_step = currentStep; Store.setProgress(progress); }
  Router.render('levelDetail', String(levelId));
}

        <div class="stat"><div class="stat-label">还原后可读性</div><div class="stat-val text-green" id="rAfter">--</div></div>
        <div class="stat"><div class="stat-label">提升幅度</div><div class="stat-val text-cyan" id="rDelta">--</div></div>
      </div>
      <div class="grid-2 mb-20">
        <div>
          <div class="section-title">📄 还原结果</div>
          <div class="code-area"><div class="code-header"><span>output.js</span></div><div class="code-body" id="sandboxOutput"></div></div>
        </div>
        <div>
          <div class="section-title">🖥️ 执行日志</div>
          <div class="terminal" id="sandboxTerminal"></div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">🌳 AST 结构</div>
        <div id="astTree" class="code-body" style="font-size:12px"></div>
      </div>
    </div>
  </div>`;
};
Views.sandboxAfterRender = function() { window._sandboxStrategy = 'string-decrypt'; };

async function executeSandbox() {
  const code = document.getElementById('sandboxInput').value;
  if(!code.trim()) { toast('请输入代码', 'warning'); return; }
  const strategy = window._sandboxStrategy || 'string-decrypt';
  const spinner = document.getElementById('sandboxSpinner');
  const btnText = document.getElementById('sandboxBtnText');
  spinner.classList.remove('hidden');
  btnText.textContent = '执行中...';
  await new Promise(r => setTimeout(r, 300));
  const result = Deobfuscator.deobfuscate(code, strategy);
  document.getElementById('sandboxResult').classList.remove('hidden');
  document.getElementById('rBefore').textContent = Math.round(result.readability_before) + '%';
  document.getElementById('rAfter').textContent = Math.round(result.readability_after) + '%';
  const delta = Math.round(result.readability_after - result.readability_before);
  document.getElementById('rDelta').textContent = (delta >= 0 ? '+' : '') + delta + '%';
  document.getElementById('sandboxOutput').textContent = result.output_code;
  // terminal log animation
  const term = document.getElementById('sandboxTerminal');
  term.innerHTML = '';
  for(let i = 0; i < result.logs.length; i++) {
    await new Promise(r => setTimeout(r, 200));
    const line = result.logs[i];
    const el = document.createElement('div');
    el.className = 'term-line ' + (line.includes('[DONE]') ? 'term-done' : line.includes('[OK]') ? 'term-ok' : line.includes('[ERROR]') ? 'term-err' : 'term-info');
    el.textContent = line;
    term.appendChild(el);
    term.scrollTop = term.scrollHeight;
  }
  const cursor = document.createElement('span');
  cursor.className = 'cursor-blink';
  term.appendChild(cursor);
  // AST tree
  const ast = result.ast_json;
  const astEl = document.getElementById('astTree');
  if(astEl) astEl.innerHTML = renderAst(ast, 0);
  // save practice record
  Store.addPractice({
    id: Date.now(), strategy, input_code: code, output_code: result.output_code,
    readability_before: result.readability_before, readability_after: result.readability_after,
    duration: 0, score: delta, created_at: new Date().toISOString()
  });
  spinner.classList.add('hidden');
  btnText.textContent = '▶ 执行还原';
  toast('还原完成！可读性提升 ' + delta + '%', 'success');
}
function renderAst(node, depth) {
  if(!node || typeof node !== 'object') return '';
  const indent = '  '.repeat(depth);
  const type = node.type || 'Unknown';
  let html = `<div style="color:var(--cyan)">${indent}<span style="color:var(--brand)">▸</span> <span style="color:var(--text-primary)">${type}</span>`;
  if(node.name) html += ` <span style="color:var(--yellow)">${node.name}</span>`;
  html += '</div>';
  if(node.body) {
    if(Array.isArray(node.body)) {
      node.body.forEach(child => { html += renderAst(child, depth + 1); });
    } else {
      html += renderAst(node.body, depth + 1);
    }
  }
  if(node.declarations) node.declarations.forEach(d => { html += renderAst(d, depth + 1); });
  if(node.id) html += renderAst(node.id, depth + 1);
  if(node.init) html += renderAst(node.init, depth + 1);
  return html;
}

// ----- KNOWLEDGE -----
Views.knowledge = function() {
  const cats = ['all','basic','ast','debug','advanced'];
  return `
  <div class="container">
    <h1 class="page-title">知识库</h1>
    <p class="page-desc">按 JS 逆向技术点组织的知识卡片，每张含原理说明、代码示例和工具推荐。</p>
    <div class="tag-row" id="knTags">
      ${cats.map(c => `<div class="tag ${c === 'all' ? 'active' : ''}" onclick="filterKnowledge('${c}')">${c === 'all' ? '全部' : CATEGORY_LABELS[c]}</div>`).join('')}
    </div>
    <div class="knowledge-grid" id="knGrid">
      ${renderKnCards('all')}
    </div>
    <div id="knDetail"></div>
  </div>`;
};
function renderKnCards(cat) {
  const cards = KNOWLEDGE_CARDS.filter(c => cat === 'all' || c.category === cat).sort((a,b) => a.order - b.order);
  return cards.map(c => `
    <div class="kn-card" onclick="showKnDetail(${c.id})">
      <div class="kn-icon">${c.icon}</div>
      <div class="kn-title">${c.title}</div>
      <div class="kn-desc">${c.description}</div>
      <div class="text-xs text-tertiary mt-12">${CATEGORY_LABELS[c.category]}</div>
    </div>`).join('');
}
function filterKnowledge(cat) {
  document.querySelectorAll('#knTags .tag').forEach((t, i) => {
    t.classList.toggle('active', (cat === 'all' && i === 0) || t.textContent === (cat === 'all' ? '全部' : CATEGORY_LABELS[cat]));
  });
  document.getElementById('knGrid').innerHTML = renderKnCards(cat);
}
function showKnDetail(id) {
  const card = KNOWLEDGE_CARDS.find(c => c.id === id);
  if(!card) return;
  const kn = Store.getKnowledge();
  if(!kn.viewed.includes(id)) { kn.viewed.push(id); Store.setKnowledge(kn); }
  document.getElementById('knDetail').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
      <div class="kn-detail" style="max-width:640px;width:90%">
        <div class="flex-between mb-16">
          <div class="flex gap-12" style="align-items:center">
            <span style="font-size:32px">${card.icon}</span>
            <div><h2 style="font-size:20px">${card.title}</h2><p class="text-sm text-secondary">${card.description}</p></div>
          </div>
          <button class="btn secondary sm" onclick="this.closest('.modal-overlay').remove()">✕</button>
        </div>
        <div class="card mb-16" style="background:var(--bg-secondary)"><p style="font-size:14px;line-height:1.7">${card.content}</p></div>
        <div class="code-area mb-16"><div class="code-header"><span>代码示例</span></div><div class="code-body">${escapeHtml(card.code_example)}</div></div>
        <div class="flex gap-8 mb-16" style="flex-wrap:wrap">
          ${card.tools.map(t => `<span class="tag" style="cursor:default">🔧 ${t}</span>`).join('')}
        </div>
        <div class="flex-between">
          <button class="btn secondary" onclick="Router.go('/workspace/level/${card.related_level}')">前往相关关卡 →</button>
          <button class="btn primary" onclick="markKnMastered(${card.id})">标记为已掌握</button>
        </div>
      </div>
    </div>`;
}
function markKnMastered(id) {
  const kn = Store.getKnowledge();
  if(!kn.mastered.includes(id)) { kn.mastered.push(id); Store.setKnowledge(kn); toast('已标记为掌握！', 'success'); }
  else toast('已经标记过了', 'info');
  document.querySelector('.modal-overlay')?.remove();
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

Views.codeCompareAfterRender = function() { updateCompare(1); };
function updateCompare(levelId) {
  const level = LEVELS.find(l => l.id === parseInt(levelId));
  if(!level) return;
  const rBefore = Deobfuscator._calculateReadability(level.obfuscated_code);
  const rAfter = Deobfuscator._calculateReadability(level.deobfuscated_code);
  document.getElementById('compareContent').innerHTML = `
    <div class="stats-grid mb-20" style="grid-template-columns:1fr 1fr">
      <div class="stat"><div class="stat-label">混淆代码可读性</div><div class="stat-val text-red">${Math.round(rBefore)}%</div></div>
      <div class="stat"><div class="stat-label">还原代码可读性</div><div class="stat-val text-green">${Math.round(rAfter)}%</div></div>
    </div>
    <div class="compare-grid">
      <div class="compare-col">
        <h3>🔒 混淆代码</h3>
        <div class="code-body">${escapeHtml(level.obfuscated_code)}</div>
      </div>
      <div class="compare-col">
        <h3>✨ 还原代码</h3>
        <div class="code-body">${escapeHtml(level.deobfuscated_code)}</div>
      </div>
    </div>`;
}

      <div class="form-group"><label class="form-label">确认密码</label><input class="form-input" id="setConfirmPassword" type="password" placeholder="再次输入"></div>
      <button class="btn primary" onclick="changePassword()">修改密码</button>
    </div>
    <div class="card mb-20">
      <div class="section-title">🔐 API Token</div>
      <div class="code-area"><div class="code-body" style="padding:10px 14px">rlab_${user.id || 'demo'}_xxxxxxxxxxxx</div></div>

    </div>
    <div class="card" style="border-color:var(--red)">
      <div class="section-title" style="color:var(--red)">⚠️ 危险操作</div>
      <p class="text-sm text-secondary mb-12">重置进度将清除所有关卡进度、练习记录和已解锁徽章，此操作不可撤销。</p>

};
function saveProfile() {
  const nickname = document.getElementById('setNickname').value.trim();
  const email = document.getElementById('setEmail').value.trim();
  Auth.updateUser({nickname, email});
  toast('个人信息已保存', 'success');
  Router.render('settings');
}
function changePassword() {
  const pwd = document.getElementById('setNewPassword').value;
  const confirm = document.getElementById('setConfirmPassword').value;
  if(!pwd) { toast('请输入新密码', 'warning'); return; }
  if(pwd !== confirm) { toast('两次密码不一致', 'error'); return; }
  const user = Store.getUser();
  const users = Store.getUsers();
  const idx = users.findIndex(u => u.username === user.username);
  if(idx >= 0) { users[idx].password = pwd; Store.setUsers(users); }
  toast('密码修改成功', 'success');
  document.getElementById('setNewPassword').value = '';
  document.getElementById('setConfirmPassword').value = '';
}
function resetProgress() {
  if(!confirm('确定要重置所有进度吗？此操作不可撤销。')) return;
  Store.reset();
  Auth.initDemoUser();
  toast('进度已重置', 'info');
  Router.go('/login');
}
