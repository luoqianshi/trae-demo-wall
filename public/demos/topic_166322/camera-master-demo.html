<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拍照Master Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #1a1a2e;
    --bg-card: rgba(255,255,255,0.05);
    --accent-blue: #3b82f6;
    --accent-orange: #f97316;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.7);
    --text-muted: rgba(255,255,255,0.5);
    --border-color: rgba(255,255,255,0.1);
    --glass-blur: blur(20px);
    
    --scene-portrait-color: #fbbf24;
    --scene-food-color: #f97316;
    --scene-scenery-color: #8b5cf6;
    --scene-graduation-color: #22c55e;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#app-container {
    width: 100%;
    max-width: 1100px;
    height: 812px;
    background: var(--bg-primary);
    border-radius: 40px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
    border: 8px solid #1a1a1a;
    display: flex;
}

#mobile-screen {
    width: 360px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0;
    position: relative;
    flex-shrink: 0;
    border-right: 1px solid var(--border-color);
}

#chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(10,10,15,0.95);
    padding: 0;
    position: relative;
    overflow: hidden;
    min-width: 360px;
}

.chat-panel-header {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--border-color);
}

.chat-panel-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
}

.chat-panel-status {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

#chat-messages-large {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

#chat-messages-large::-webkit-scrollbar {
    width: 4px;
}

#chat-messages-large::-webkit-scrollbar-track {
    background: rgba(255,255,255,0.05);
}

#chat-messages-large::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
}

.large-bubble {
    max-width: 85%;
    padding: 12px 18px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    animation: bubbleAppear 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    opacity: 0;
    transform: scale(0.9) translateY(10px);
    position: relative;
}

.large-bubble-ai {
    align-self: flex-start;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
}

.large-bubble-user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent-blue) 0%, #2563eb 100%);
    color: white;
    border-bottom-right-radius: 4px;
}

.large-speech-btn {
    position: absolute;
    bottom: -6px;
    right: -6px;
    width: 22px;
    height: 22px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50%;
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s;
    z-index: 10;
}

.large-speech-btn:hover {
    background: rgba(59,130,246,0.2);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
}

.large-speech-btn.speaking {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: white;
}

.chat-panel-footer {
    padding: 12px 16px 16px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: var(--glass-blur);
    border-top: 1px solid var(--border-color);
}

.large-quick-replies {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.large-quick-replies::-webkit-scrollbar {
    height: 0;
}

.large-quick-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    color: var(--text-secondary);
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.large-quick-btn:hover {
    background: rgba(59,130,246,0.2);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
}

.large-chat-input-area {
    display: flex;
    gap: 10px;
    align-items: center;
}

.large-chat-input {
    flex: 1;
    height: 44px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-color);
    border-radius: 22px;
    padding: 0 18px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
}

.large-chat-input:focus {
    border-color: var(--accent-blue);
    background: rgba(255,255,255,0.08);
}

.large-send-btn {
    width: 44px;
    height: 44px;
    background: var(--accent-blue);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
}

.large-send-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
}

.status-bar {
    height: 44px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: var(--glass-blur);
    z-index: 100;
}

.status-left {
    font-size: 14px;
    font-weight: 600;
}

.status-center {
    display: flex;
    align-items: center;
    gap: 8px;
}

.online-indicator {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

.online-text {
    font-size: 12px;
    color: #22c55e;
}

.status-right {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
}

.viewfinder {
    flex: 1;
    position: relative;
    background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0f 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.viewfinder-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    transition: background 0.5s ease;
    background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0f 100%);
}

.viewfinder-bg.portrait {
    background: 
        radial-gradient(circle at 30% 40%, rgba(251,191,36,0.2) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(234,88,12,0.15) 0%, transparent 50%),
        linear-gradient(180deg, #3f2e1c 0%, #1a1510 50%, #0d0a08 100%);
}

.viewfinder-bg.food {
    background: 
        radial-gradient(circle at 50% 50%, rgba(249,115,22,0.25) 0%, transparent 60%),
        radial-gradient(circle at 80% 20%, rgba(234,179,8,0.15) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(239,68,68,0.1) 0%, transparent 40%),
        linear-gradient(180deg, #3d2817 0%, #2a1a0f 50%, #1a1008 100%);
}

.viewfinder-bg.scenery {
    background: 
        radial-gradient(circle at 50% 20%, rgba(139,92,246,0.3) 0%, transparent 60%),
        radial-gradient(circle at 80% 60%, rgba(59,130,246,0.2) 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(168,85,247,0.15) 0%, transparent 40%),
        linear-gradient(180deg, #1a1033 0%, #0f0a20 50%, #0a0515 100%);
}

.viewfinder-bg.graduation {
    background: 
        radial-gradient(circle at 50% 30%, rgba(251,191,36,0.2) 0%, transparent 50%),
        radial-gradient(circle at 30% 70%, rgba(34,197,94,0.15) 0%, transparent 40%),
        radial-gradient(circle at 70% 80%, rgba(234,179,8,0.1) 0%, transparent 40%),
        linear-gradient(180deg, #1a2a15 0%, #0f1a0f 50%, #081008 100%);
}

.viewfinder-overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.guide-lines {
    position: absolute;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 20px;
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 0.4s ease, transform 0.4s ease;
}

.guide-lines.visible {
    opacity: 1;
    transform: scale(1);
}

.guide-line-h, .guide-line-v {
    position: absolute;
    transition: background 0.3s ease;
}

.guide-line-h {
    height: 1px;
    left: 20px;
    right: 20px;
    transform-origin: left center;
}

.guide-line-v {
    width: 1px;
    top: 20px;
    bottom: 20px;
    transform-origin: top center;
}

.guide-lines.visible .guide-line-h {
    animation: guideLineH 0.4s ease forwards;
}

.guide-lines.visible .guide-line-v {
    animation: guideLineV 0.4s ease forwards;
}

.guide-line-h:nth-child(1) { top: 33.33%; animation-delay: 0.1s; }
.guide-line-h:nth-child(2) { top: 66.66%; animation-delay: 0.2s; }
.guide-line-h:nth-child(3) { top: 50%; animation-delay: 0.3s; }

.guide-line-v:nth-child(4) { left: 33.33%; animation-delay: 0.15s; }
.guide-line-v:nth-child(5) { left: 66.66%; animation-delay: 0.25s; }
.guide-line-v:nth-child(6) { left: 50%; animation-delay: 0.35s; }

.guide-lines.portrait .guide-line-h,
.guide-lines.portrait .guide-line-v {
    background: rgba(251,191,36,0.5);
}

.guide-lines.food .guide-line-h,
.guide-lines.food .guide-line-v {
    background: rgba(249,115,22,0.5);
}

.guide-lines.scenery .guide-line-h,
.guide-lines.scenery .guide-line-v {
    background: rgba(139,92,246,0.5);
}

.guide-lines.graduation .guide-line-h,
.guide-lines.graduation .guide-line-v {
    background: rgba(251,191,36,0.5);
}

@keyframes guideLineH {
    from {
        width: 0;
        opacity: 0;
    }
    to {
        width: calc(100% - 40px);
        opacity: 1;
    }
}

@keyframes guideLineV {
    from {
        height: 0;
        opacity: 0;
    }
    to {
        height: calc(100% - 40px);
        opacity: 1;
    }
}

.focus-frame {
    position: absolute;
    width: 80px;
    height: 80px;
    border: 2px solid var(--accent-blue);
    border-radius: 8px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: focusBreath 2s ease-in-out infinite;
}

.focus-frame::before, .focus-frame::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: var(--accent-blue);
    border-style: solid;
    animation: focusCornerBreath 2s ease-in-out infinite;
}

.focus-frame::before {
    top: -2px;
    left: -2px;
    border-width: 2px 0 0 2px;
}

.focus-frame::after {
    bottom: -2px;
    right: -2px;
    border-width: 0 2px 2px 0;
}

@keyframes focusBreath {
    0%, 100% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4);
        transform: translate(-50%, -50%) scale(1);
    }
    50% {
        box-shadow: 0 0 0 8px rgba(59, 130, 246, 0);
        transform: translate(-50%, -50%) scale(1.05);
    }
}

@keyframes focusCornerBreath {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.6;
    }
}

.scene-info {
    position: absolute;
    bottom: 10px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.scene-tag {
    background: rgba(0,0,0,0.5);
    backdrop-filter: var(--glass-blur);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    color: var(--accent-blue);
    border: 1px solid rgba(59,130,246,0.3);
}

.scene-data {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-muted);
}

.chat-area {
    height: 160px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: var(--glass-blur);
    border-top: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    transition: opacity 0.3s ease;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.chat-messages::-webkit-scrollbar {
    width: 0;
}

.bubble {
    max-width: 80%;
    padding: 8px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    animation: bubbleAppear 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    opacity: 0;
    transform: scale(0.8) translateY(10px);
}

@keyframes bubbleAppear {
    from {
        opacity: 0;
        transform: scale(0.8) translateY(10px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.bubble-ai {
    align-self: flex-start;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    position: relative;
}

.bubble-user {
    align-self: flex-end;
    background: var(--accent-blue);
    color: white;
}

.speech-btn {
    position: absolute;
    bottom: -8px;
    right: -8px;
    width: 24px;
    height: 24px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50%;
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s;
    z-index: 10;
}

.speech-btn:hover {
    background: rgba(59,130,246,0.2);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
}

.speech-btn.speaking {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: white;
}

.speech-btn.speaking::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 18px;
    height: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.speech-btn.speaking::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 14px;
    height: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.speech-btn.speaking span {
    display: none;
}

.speech-wave {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.speech-wave-bar {
    width: 2px;
    height: 8px;
    background: white;
    border-radius: 1px;
    animation: wave 0.5s ease-in-out infinite;
}

.speech-wave-bar:nth-child(1) { animation-delay: 0s; }
.speech-wave-bar:nth-child(2) { animation-delay: 0.1s; }
.speech-wave-bar:nth-child(3) { animation-delay: 0.2s; }

.chat-input-area {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

.chat-input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 8px 16px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
}

.chat-input:focus {
    border-color: var(--accent-blue);
    background: rgba(255,255,255,0.08);
}

.chat-input::placeholder {
    color: var(--text-muted);
}

.send-btn {
    width: 36px;
    height: 36px;
    background: var(--accent-blue);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
}

.send-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
}

.send-btn:active {
    transform: scale(0.9);
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
}

.quick-replies {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    overflow-x: auto;
}

.quick-replies::-webkit-scrollbar {
    height: 0;
}

.quick-btn {
    padding: 6px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    color: var(--text-secondary);
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    transform: scale(1);
}

.quick-btn:hover {
    background: rgba(59,130,246,0.2);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
}

.quick-btn:active {
    transform: scale(0.95);
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.1);
}

.control-bar {
    height: 90px;
    background: rgba(0,0,0,0.8);
    backdrop-filter: var(--glass-blur);
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
}

.mode-switch {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.mode-btn {
    width: 48px;
    height: 48px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    color: var(--text-secondary);
    font-size: 20px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    transform: scale(1);
}

.mode-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    border-color: var(--accent-blue);
}

.mode-btn.active {
    background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-orange) 100%);
    border-color: transparent;
    color: white;
    transform: scale(1.05);
    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
}

.mode-label {
    font-size: 10px;
    color: var(--text-muted);
}

.mode-label.active {
    color: var(--accent-blue);
    font-weight: 600;
}

.shutter-btn {
    width: 72px;
    height: 72px;
    background: white;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,255,255,0.3), 0 0 0 4px rgba(255,255,255,0.1);
    position: relative;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    transform: scale(1);
}

.shutter-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    border: 3px solid var(--bg-primary);
    border-radius: 50%;
    transition: all 0.2s;
}

.shutter-btn:hover {
    box-shadow: 0 6px 20px rgba(255,255,255,0.4), 0 0 0 6px rgba(255,255,255,0.15);
    transform: scale(1.02);
}

.shutter-btn:active {
    transform: scale(0.9);
    box-shadow: 0 2px 8px rgba(255,255,255,0.2), 0 0 0 2px rgba(255,255,255,0.1);
}

.params-btn {
    width: 48px;
    height: 48px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    color: var(--text-secondary);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    transform: scale(1);
}

.params-btn:hover {
    border-color: var(--accent-orange);
    color: var(--accent-orange);
    transform: scale(1.1);
    box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
}

.params-btn:active {
    transform: scale(0.95);

<script>

console.log('===== 拍照Master v2.1 环境检测 =====');

console.log('协议:', window.location.protocol);
console.log('hostname:', window.location.hostname);
console.log('isSecureContext:', window.isSecureContext);
console.log('navigator.mediaDevices:', !!navigator.mediaDevices);
console.log('getUserMedia支持:', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));

if (window.location.protocol === 'file:') {
    alert('⚠️ 警告：您正在使用 file:// 协议打开文件！\n\n摄像头功能需要通过 http://localhost:8765/ 访问。\n\n请在浏览器地址栏输入：\nhttp://localhost:8765/camera-master-demo.html');
}

function updateTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('current-time').textContent = `${hours}:${minutes}`;
}

setInterval(updateTime, 1000);
updateTime();

const chatInput = document.getElementById('large-chat-input');
const sendBtn = document.getElementById('large-send-btn');
const chatMessages = document.getElementById('chat-messages-large');
const quickRepliesContainer = document.getElementById('large-quick-replies');

class SpeechManager {
    constructor() {
        this.synth = window.speechSynthesis;
        this.voices = [];
        this.chineseVoice = null;
        this.isSpeaking = false;
        this.paused = false;
        this.currentUtterance = null;
        this.queue = [];
        this.currentBubble = null;
        this.speechSupported = this.checkSupport();
        
        if (this.speechSupported) {
            this.loadVoices();
            if (this.synth.onvoiceschanged !== undefined) {
                this.synth.onvoiceschanged = () => this.loadVoices();
            }
        }
    }

    checkSupport() {
        return 'speechSynthesis' in window;
    }

    loadVoices() {
        this.voices = this.synth.getVoices();
        this.chineseVoice = this.findChineseVoice();
    }

    findChineseVoice() {
        const chineseCodes = ['zh-CN', 'zh', 'zh-HK', 'zh-TW', 'cmn'];
        for (const code of chineseCodes) {
            const voice = this.voices.find(v => 
                v.lang.startsWith(code) && v.name.includes('Chinese')
            ) || this.voices.find(v => v.lang.startsWith(code));
            if (voice) return voice;
        }
        return this.voices.find(v => v.lang.startsWith('zh')) || null;
    }

    speak(text, bubbleElement) {
        if (!this.speechSupported) return;

        this.stop();
        
        const utterance = new SpeechSynthesisUtterance(text);
        if (this.chineseVoice) {
            utterance.voice = this.chineseVoice;
        } else {
            utterance.lang = 'zh-CN';
        }
        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.volume = 1;

        this.currentUtterance = utterance;
        this.currentBubble = bubbleElement;
        this.isSpeaking = true;
        this.paused = false;

        if (bubbleElement) {
            this.updateSpeakingUI(bubbleElement, true);
        }

        utterance.onstart = () => {
            this.isSpeaking = true;
            if (bubbleElement) {
                this.updateSpeakingUI(bubbleElement, true);
            }
        };

        utterance.onend = () => {
            this.isSpeaking = false;
            this.paused = false;
            this.currentUtterance = null;
            if (bubbleElement) {
                this.updateSpeakingUI(bubbleElement, false);
            }
            this.processQueue();
        };

        utterance.onerror = () => {
            this.isSpeaking = false;
            this.paused = false;
            this.currentUtterance = null;
            if (bubbleElement) {
                this.updateSpeakingUI(bubbleElement, false);
            }
            this.processQueue();
        };

        this.synth.speak(utterance);
    }

    pause() {
        if (!this.speechSupported || !this.isSpeaking || this.paused) return;
        this.synth.pause();
        this.paused = true;
        if (this.currentBubble) {
            this.updateSpeakingUI(this.currentBubble, false);
        }
    }

    resume() {
        if (!this.speechSupported || !this.paused) return;
        this.synth.resume();
        this.paused = false;
        if (this.currentBubble) {
            this.updateSpeakingUI(this.currentBubble, true);
        }
    }

    stop() {
        if (!this.speechSupported) return;
        this.synth.cancel();
        this.isSpeaking = false;
        this.paused = false;
        if (this.currentBubble) {
            this.updateSpeakingUI(this.currentBubble, false);
        }
        this.currentUtterance = null;
        this.currentBubble = null;
    }

    toggle(text, bubbleElement) {
        if (!this.speechSupported) return;

        if (this.isSpeaking && !this.paused) {
            if (this.currentBubble === bubbleElement) {
                this.pause();
                return;
            }
            this.stop();
        }
        
        this.speak(text, bubbleElement);
    }

    queueSpeak(text, bubbleElement) {
        if (!this.speechSupported) return;

        if (this.isSpeaking && !this.paused) {
            this.queue.push({ text, bubbleElement });
        } else {
            this.speak(text, bubbleElement);
        }
    }

    processQueue() {
        if (this.queue.length > 0) {
            const next = this.queue.shift();
            this.speak(next.text, next.bubbleElement);
        }
    }

    updateSpeakingUI(bubbleElement, isSpeaking) {
        const btn = bubbleElement.querySelector('.speech-btn');
        if (!btn) return;

        if (isSpeaking) {
            btn.classList.add('speaking');
            btn.innerHTML = '<div class="speech-wave"><span class="speech-wave-bar"></span><span class="speech-wave-bar"></span><span class="speech-wave-bar"></span></div>';
        } else {
            btn.classList.remove('speaking');
            btn.innerHTML = '<span>🔊</span>';
        }
    }
}

class Viewfinder {
    constructor() {
        this.viewfinderContent = document.getElementById('viewfinder-content');
        this.viewfinderBg = document.getElementById('viewfinder-bg');
        this.guideLines = document.getElementById('guide-lines');
        this.sceneTag = document.getElementById('scene-tag');
        this.paramsPanel = document.getElementById('params-panel');
        this.hdrToggle = document.getElementById('hdr-toggle');
        this.hdrValue = document.getElementById('hdr-value');
        this.hdrIndicator = document.getElementById('hdr-indicator');
        
        this.params = {
            brightness: 100,
            contrast: 100,
            saturate: 100,
            'hue-rotate': 0
        };
        
        this.hdrEnabled = false;
        this.currentFilter = 'none';
        
        this.guideLinesVisible = true;
        this.paramsPanelVisible = false;
        
        this.initParamsSliders();
        this.initHDRToggle();
        this.initFilterButtons();
        this.applyFilters();
    }
    
    setScene(mode) {
        this.viewfinderBg.classList.remove('portrait', 'food', 'scenery', 'graduation');
        this.viewfinderBg.classList.add(mode);
        
        this.guideLines.classList.remove('portrait', 'food', 'scenery', 'graduation');
        this.guideLines.classList.add(mode);
        
        this.sceneTag.textContent = `${modeMap[mode].icon} ${modeMap[mode].label}`;
        
        const colors = {
            portrait: 'rgba(251,191,36,0.5)',
            food: 'rgba(249,115,22,0.5)',
            scenery: 'rgba(139,92,246,0.5)',
            graduation: 'rgba(251,191,36,0.5)'
        };
        
        this.sceneTag.style.borderColor = colors[mode];
        this.sceneTag.style.color = colors[mode].replace('0.5', '1');
        
        this.showGuideLines();
    }
    
    showGuideLines() {
        this.guideLinesVisible = true;
        this.guideLines.classList.add('visible');
    }
    
    hideGuideLines() {
        this.guideLinesVisible = false;
        this.guideLines.classList.remove('visible');
    }
    
    toggleGuideLines() {
        if (this.guideLinesVisible) {
            this.hideGuideLines();
        } else {
            this.showGuideLines();
        }
    }
    
    toggleParamsPanel() {
        this.paramsPanelVisible = !this.paramsPanelVisible;
        if (this.paramsPanelVisible) {
            this.paramsPanel.classList.add('visible');
        } else {
            this.paramsPanel.classList.remove('visible');
        }
    }
    
    setParam(param, value) {
        this.params[param] = value;
        this.applyFilters();
    }
    
    applyFilters() {
        const filterString = this.getFilterString();
        this.viewfinderContent.style.filter = filterString;
    }
    
    initHDRToggle() {
        this.hdrToggle.addEventListener('click', () => {
            this.toggleHDR();
        });
    }
    
    toggleHDR() {
        this.hdrEnabled = !this.hdrEnabled;
        
        if (this.hdrEnabled) {
            this.hdrToggle.classList.add('active');
            this.hdrValue.textContent = '开启';
            this.hdrIndicator.classList.add('visible');
        } else {
            this.hdrToggle.classList.remove('active');
            this.hdrValue.textContent = '关闭';
            this.hdrIndicator.classList.remove('visible');
        }
        
        this.applyFilters();
    }
    
    initFilterButtons() {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.dataset.filter;
                this.setFilter(filter);
            });
        });
    }
    
    setFilter(filter) {
        this.currentFilter = filter;
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`.filter-btn[data-filter="${filter}"]`).classList.add('active');
        
        this.viewfinderContent.classList.remove('filter-film', 'filter-vibrant', 'filter-bw', 'filter-vintage');
        if (filter !== 'none') {
            this.viewfinderContent.classList.add(`filter-${filter}`);
        }
        
        this.applyFilters();
    }
    
    getFilterString() {
        const brightness = this.params.brightness / 100;
        const contrast = this.params.contrast / 100;
        const saturate = this.params.saturate / 100;
        const hueRotate = this.params['hue-rotate'];
        
        let filterString = `brightness(${brightness}) contrast(${contrast}) saturate(${saturate}) hue-rotate(${hueRotate}deg)`;
        
        if (this.currentFilter === 'film') {
            filterString += ' sepia(0.2) contrast(1.05) brightness(0.95)';
        } else if (this.currentFilter === 'vibrant') {
            filterString += ' saturate(1.5) contrast(1.1)';
        } else if (this.currentFilter === 'bw') {
            filterString += ' grayscale(1)';
        } else if (this.currentFilter === 'vintage') {
            filterString += ' sepia(0.4) contrast(1.1) brightness(0.9) saturate(0.8)';
        }
        
        if (this.hdrEnabled) {
            filterString += ' contrast(1.15) brightness(1.05) saturate(1.1)';
        }
        
        return filterString;
    }
    
    initParamsSliders() {
        const sliders = document.querySelectorAll('.param-slider');
        const self = this;
        
        sliders.forEach(slider => {
            const param = slider.dataset.param;
            const fill = slider.querySelector('.param-slider-fill');
            const thumb = slider.querySelector('.param-slider-thumb');
            const valueDisplay = slider.parentElement.querySelector('.param-value');
            
            slider.addEventListener('mousedown', (e) => {
                self.updateSlider(e, slider, fill, thumb, valueDisplay, param);
                
                const handleMouseMove = (e) => {
                    self.updateSlider(e, slider, fill, thumb, valueDisplay, param);
                };
                
                const handleMouseUp = () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };
                
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            });
            
            slider.addEventListener('touchstart', (e) => {
                self.updateSlider(e.touches[0], slider, fill, thumb, valueDisplay, param);
                
                const handleTouchMove = (e) => {
                    self.updateSlider(e.touches[0], slider, fill, thumb, valueDisplay, param);
                };
                
                const handleTouchEnd = () => {
                    document.removeEventListener('touchmove', handleTouchMove);
                    document.removeEventListener('touchend', handleTouchEnd);
                };
                
                document.addEventListener('touchmove', handleTouchMove);
                document.addEventListener('touchend', handleTouchEnd);
            });
        });
    }
    
    updateSlider(event, slider, fill, thumb, valueDisplay, param) {
        const rect = slider.getBoundingClientRect();
        let x = event.clientX - rect.left;
        x = Math.max(0, Math.min(x, rect.width));
        
        const percentage = (x / rect.width) * 100;
        
        fill.style.width = `${percentage}%`;
        thumb.style.left = `${percentage}%`;
        
        let value;
        switch (param) {
            case 'brightness':
            case 'contrast':
            case 'saturate':
                value = `${Math.round(percentage)}%`;
                this.setParam(param, percentage);
                break;
            case 'hue-rotate':
                value = `${Math.round((percentage - 50) * 7.2)}°`;
                this.setParam(param, (percentage - 50) * 7.2);
                break;
        }
        
        valueDisplay.textContent = value;
    }
    
    resetParams() {
        this.params = {
            brightness: 100,
            contrast: 100,
            saturate: 100,
            'hue-rotate': 0
        };
        
        const sliders = document.querySelectorAll('.param-slider');
        sliders.forEach(slider => {
            const fill = slider.querySelector('.param-slider-fill');
            const thumb = slider.querySelector('.param-slider-thumb');
            const valueDisplay = slider.parentElement.querySelector('.param-value');
            
            fill.style.width = '50%';
            thumb.style.left = '50%';
            
            const param = slider.dataset.param;
            if (param === 'hue-rotate') {
                valueDisplay.textContent = '0°';
            } else {
                valueDisplay.textContent = '100%';
            }
        });
        
        if (this.hdrEnabled) {
            this.toggleHDR();
        }
        
        if (this.currentFilter !== 'none') {
            this.setFilter('none');
        }
        
        this.applyFilters();
    }
}

const viewfinder = new Viewfinder();

function renderMessage(text, isUser) {
    const bubble = document.createElement('div');
    bubble.className = `large-bubble ${isUser ? 'large-bubble-user' : 'large-bubble-ai'}`;
    bubble.innerHTML = text.replace(/\n/g, '<br>');
    
    if (!isUser && speechManager.speechSupported) {
        const speechBtn = document.createElement('button');
        speechBtn.className = 'large-speech-btn';
        speechBtn.innerHTML = '<span>🔊</span>';
        speechBtn.addEventListener('click', () => {
            speechManager.toggle(text, bubble);
        });
        bubble.appendChild(speechBtn);
    }
    
    chatMessages.appendChild(bubble);
    
    chatMessages.scrollTo({
        top: chatMessages.scrollHeight,
        behavior: 'smooth'
    });
    
    if (!isUser && speechManager.speechSupported) {
        setTimeout(() => {
            if (firstMessage) {
                speechManager.speak(text, bubble);
                firstMessage = false;
            } else {
                speechManager.queueSpeak(text, bubble);
            }
        }, 300);
    }
}

function renderQuickReplies(options) {
    quickRepliesContainer.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'large-quick-btn';
        btn.textContent = opt.text;
        btn.addEventListener('click', () => handleQuickReply(opt));
        quickRepliesContainer.appendChild(btn);
    });
}

function handleQuickReply(option) {
    renderMessage(option.text, true);
    
    if (option.action) {
        executeAction(option.action);
    }
    
    setTimeout(() => {
        currentNodeId = option.next;
        const node = dialogData[currentMode].nodes[currentNodeId];
        renderMessage(node.message, false);
        renderQuickReplies(node.options);
    }, 600);
}

function executeAction(action) {
    switch (action) {
        case 'take_photo':
            triggerShutter();
            break;
        case 'enable_hdr':
            renderMessage('✅ HDR功能已开启！', false);
            break;
        case 'enable_burst':
            renderMessage('✅ 连拍模式已开启！', false);
            break;
        case 'apply_filter':
            renderMessage('✅ 滤镜已应用！', false);
            break;
    }
}

function resetDialog(mode) {
    currentMode = mode;
    currentNodeId = dialogData[mode].startNode;
    chatMessages.innerHTML = '';
    
    const node = dialogData[mode].nodes[currentNodeId];
    renderMessage(node.message, false);
    renderQuickReplies(node.options);
}

function handleSend() {
    const text = chatInput.value.trim();
    if (!text) return;
    
    renderMessage(text, true);
    chatInput.value = '';
    
    setTimeout(() => {
        const node = dialogData[currentMode].nodes[currentNodeId];
        const defaultOption = node.options[0];
        currentNodeId = defaultOption.next;
        
        const nextNode = dialogData[currentMode].nodes[currentNodeId];
        renderMessage(nextNode.message, false);
        renderQuickReplies(nextNode.options);
    }, 800);
}

class CameraManager {
    constructor() {
        this.video = document.getElementById('camera-video');
        this.toggleBtn = document.getElementById('camera-toggle-btn');
        this.switchBtn = document.getElementById('camera-switch-btn');
        this.permissionHint = document.getElementById('camera-permission-hint');
        this.isCameraActive = false;
        this.stream = null;
        this.facingMode = 'user';
        this.hasMultipleCameras = false;
        
        this.init();
    }
    
    init() {
        console.log('CameraManager.init() 开始');
        console.log('  toggleBtn:', this.toggleBtn);
        console.log('  switchBtn:', this.switchBtn);
        console.log('  video:', this.video);
        console.log('  permissionHint:', this.permissionHint);

        if (!this.toggleBtn || !this.switchBtn || !this.video || !this.permissionHint) {
            console.error('Camera DOM elements not found!');
            return;
        }

        this.toggleBtn.addEventListener('click', () => this.toggleCamera());
        this.switchBtn.addEventListener('click', () => this.switchCamera());

        console.log('  navigator.mediaDevices:', navigator.mediaDevices);
        console.log('  getUserMedia:', navigator.mediaDevices ? navigator.mediaDevices.getUserMedia : 'N/A');

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            console.error('浏览器不支持 getUserMedia！');
            this.showHint('🚫', '浏览器不支持摄像头', '您的浏览器版本过低，或通过 file:// 协议打开。\n请通过 http://localhost:8765/ 访问。\n推荐使用Chrome/Edge最新版');
            this.toggleBtn.style.display = 'none';
            this.switchBtn.style.display = 'none';
            return;
        }

        console.log('CameraManager 初始化成功，摄像头可用');
        this.showHint('📷', '点击下方按钮开启摄像头', '体验实时AI摄影指导，需要允许浏览器访问摄像头权限');

        this.detectCameras();
    }
    
    async detectCameras() {
        try {
            if (!navigator.mediaDevices.enumerateDevices) return;
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            this.hasMultipleCameras = videoDevices.length > 1;
        } catch (e) {
            this.hasMultipleCameras = false;
        }
    }
    
    showHint(icon, title, desc) {
        const isBlocking = icon === '🚫' || icon === '❌' || icon === '⚠️';
        const buttonHtml = isBlocking
            ? `<button onclick="window.location.reload()" style="margin-top: 12px; padding: 10px 28px; font-size: 14px; font-weight: 600; background: var(--accent-blue); color: white; border: none; border-radius: 8px; cursor: pointer;">🔄 刷新页面重试</button>`
            : `<button onclick="window.toggleCameraGlobal()" style="margin-top: 12px; padding: 12px 32px; font-size: 16px; font-weight: 600; background: var(--accent-blue); color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(59,130,246,0.4);">📷 开启摄像头</button>`;
        this.permissionHint.innerHTML = `
            <div style="font-size: 28px; margin-bottom: 10px;">${icon}</div>
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">${title}</div>
            <div style="font-size: 13px; color: var(--text-muted); line-height: 1.5; white-space: pre-line;">${desc}</div>
            ${buttonHtml}
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px; opacity: 0.6;">版本 v2.1 | localhost:8765</div>
        `;
        this.permissionHint.classList.add('visible');
    }
    
    hideHint() {
        this.permissionHint.classList.remove('visible');
    }
    
    async toggleCamera() {
        if (this.isCameraActive) {
            this.stopCamera();
        } else {
            await this.startCamera();
        }
    }
    
    async switchCamera() {
        if (!this.isCameraActive) return;
        this.facingMode = this.facingMode === 'user' ? 'environment' : 'user';
        await this.stopCamera();
        await this.startCamera();
    }
    
    updateMirror() {
        if (this.facingMode === 'user') {
            this.video.style.transform = 'scaleX(-1)';
        } else {
            this.video.style.transform = 'scaleX(1)';
        }
    }
    
    async startCamera() {
        try {
            this.hideHint();
            this.toggleBtn.disabled = true;
            
            const constraintsList = [
                {
                    video: {
                        facingMode: this.facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                },
                {
                    video: {
                        facingMode: this.facingMode
                    },
                    audio: false
                },
                {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                },
                {
                    video: true,
                    audio: false
                }
            ];
            
            let lastError = null;
            for (const constraints of constraintsList) {
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    
                    this.video.srcObject = this.stream;
                    this.updateMirror();
                    
                    await new Promise((resolve, reject) => {
                        const timer = setTimeout(() => reject(new Error('视频加载超时')), 15000);
                        this.video.onloadedmetadata = () => {
                            clearTimeout(timer);
                            this.video.play().then(resolve).catch(reject);
                        };
                        this.video.onerror = (e) => {
                            clearTimeout(timer);
                            reject(e);
                        };
                    });
                    
                    this.video.classList.add('active');
                    this.toggleBtn.classList.add('active');
                    this.isCameraActive = true;
                    
                    if (this.hasMultipleCameras) {
                        this.switchBtn.classList.add('visible');
                    }
                    
                    renderMessage('📷 摄像头已开启！现在可以实时取景，跟着我的指导拍出大片吧～', false);
                    return;
                } catch (err) {
                    lastError = err;
                    console.warn('Camera attempt failed with constraints:', constraints, err);
                }
            }
            
            throw lastError || new Error('所有摄像头尝试均失败');
        } catch (error) {
            console.error('Camera access error:', error);
            this.handleCameraError(error);
        } finally {
            this.toggleBtn.disabled = false;
        }
    }
    
    handleCameraError(error) {
        let icon = '❌';
        let title = '无法访问摄像头';
        let desc = '请检查浏览器权限设置';
        const errorInfo = error ? `\n\n错误信息: ${error.name || 'Unknown'} - ${error.message || '无详细信息'}` : '';
        
        if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
            icon = '🚫';
            title = '摄像头权限被拒绝';
            desc = '请在浏览器地址栏点击🔒图标，\n允许摄像头权限后刷新页面重试。\n\n如果仍未弹出权限请求，\n请检查系统设置中的摄像头权限。\n\nWindows用户：\n设置 > 隐私和安全性 > 相机\n确保浏览器已被允许访问摄像头。';
        } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
            icon = '📷';
            title = '未检测到摄像头';
            desc = '请确保您的设备已连接摄像头，\n并检查设备管理器中摄像头是否正常工作。\n\n笔记本用户：\n请检查摄像头是否被物理遮挡或\n通过快捷键(Fn+F6等)关闭了。';
        } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
            icon = '⚠️';
            title = '摄像头被占用';
            desc = '摄像头可能正在被其他应用使用，\n请关闭其他应用(如QQ、微信、Teams等)\n后重试。\n\n也可能是摄像头驱动问题，\n请尝试重新安装摄像头驱动。';
        } else if (error.name === 'OverconstrainedError') {
            icon = '⚙️';
            title = '摄像头参数不支持';
            desc = '您的摄像头不支持当前设置的参数，\n已尝试使用默认参数。';
        } else if (error.name === 'SecurityError') {
            icon = '🔒';
            title = '安全策略限制';
            desc = '摄像头访问需要在HTTPS或localhost环境下运行。\n\n❌ 请勿直接双击打开HTML文件\n✅ 请通过本地服务器访问\n\n尝试地址: http://localhost:8765/camera-master-demo.html';
        } else if (error.name === 'TypeError') {
            icon = '📝';
            title = '参数错误';
            desc = '浏览器无法处理摄像头请求参数，\n已尝试使用简化参数。';
        } else {
            desc = `无法访问摄像头，请尝试以下步骤：\n\n1. 确保通过 http://localhost:8765 访问\n2. 在浏览器地址栏点击🔒图标允许摄像头\n3. 关闭其他正在使用摄像头的应用\n4. 检查系统设置中摄像头权限\n5. 尝试刷新页面后重试${errorInfo}`;
        }
        
        this.showHint(icon, title, desc);
    }
    
    async tryFallbackCamera() {
        try {
            this.stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });
            
            this.video.srcObject = this.stream;
            this.updateMirror();
            await this.video.play();
            
            this.video.classList.add('active');
            this.toggleBtn.classList.add('active');
            this.isCameraActive = true;
            
            if (this.hasMultipleCameras) {
                this.switchBtn.classList.add('visible');
            }
            
            renderMessage('📷 摄像头已开启（使用默认设置）！现在可以实时取景了～', false);
        } catch (error) {
            this.showHint('❌', '无法访问摄像头', '请检查浏览器权限设置和设备状态。\n如果问题持续，请刷新页面重试。');
        }
    }
    
    stopCamera() {
        if (this.stream) {
            this.stream.getTracks().forEach(track => track.stop());
            this.stream = null;
        }
        
        this.video.srcObject = null;
        this.video.classList.remove('active');
        this.toggleBtn.classList.remove('active');
        this.switchBtn.classList.remove('visible');
        this.isCameraActive = false;
        
        renderMessage('📷 摄像头已关闭，已切换为模拟场景模式', false);
    }
    
    capturePhoto() {
        if (!this.isCameraActive || !this.video || this.video.videoWidth === 0) {
            return null;
        }
        
        try {
            const canvas = document.createElement('canvas');
            canvas.width = this.video.videoWidth || 1280;
            canvas.height = this.video.videoHeight || 720;
            
            const ctx = canvas.getContext('2d');
            ctx.filter = viewfinder.getFilterString();
            ctx.drawImage(this.video, 0, 0, canvas.width, canvas.height);
            
            return canvas.toDataURL('image/jpeg', 0.9);
        } catch (error) {
            console.error('Photo capture error:', error);
            return null;
        }
    }
    
    isActive() {
        return this.isCameraActive;
    }
}

    const canvas = document.createElement('canvas');

        const r = 10;
        
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.15})`;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);

        ctx.fillStyle = '#4a3728';
        ctx.beginPath();
        ctx.ellipse(centerX, centerY + 50, 50, 70, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(centerX, centerY + 80, 45, 80, 0, 0, Math.PI * 2);
        ctx.fill();
    } else if (mode === 'food') {
        ctx.fillStyle = '#fffbeb';
        ctx.beginPath();
        ctx.ellipse(centerX, centerY + 20, 120, 80, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#e5e7eb';
        ctx.beginPath();
        ctx.ellipse(centerX, centerY + 25, 110, 70, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.arc(centerX - 40, centerY, 25, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.arc(centerX, centerY - 20, 30, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.arc(centerX + 35, centerY + 10, 20, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#fcd34d';
        ctx.beginPath();
        ctx.arc(centerX - 15, centerY + 30, 15, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(centerX + 50, centerY - 10, 12, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#166534';
        ctx.beginPath();
        ctx.moveTo(centerX + 50, centerY - 20);
        ctx.lineTo(centerX + 60, centerY - 10);
        ctx.lineTo(centerX + 45, centerY - 5);
        ctx.closePath();
        ctx.fill();
    } else if (mode === 'scenery') {
        const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
        skyGradient.addColorStop(0, '#87ceeb');
        skyGradient.addColorStop(0.5, '#e0f7fa');
        skyGradient.addColorStop(1, '#8b5cf6');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);
        
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.moveTo(0, canvas.height * 0.55);
        ctx.quadraticCurveTo(canvas.width * 0.25, canvas.height * 0.35, canvas.width * 0.5, canvas.height * 0.5);
        ctx.quadraticCurveTo(canvas.width * 0.75, canvas.height * 0.65, canvas.width, canvas.height * 0.5);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#166534';
        ctx.beginPath();
        ctx.moveTo(0, canvas.height * 0.65);
        ctx.quadraticCurveTo(canvas.width * 0.3, canvas.height * 0.55, canvas.width * 0.5, canvas.height * 0.6);
        ctx.quadraticCurveTo(canvas.width * 0.7, canvas.height * 0.7, canvas.width, canvas.height * 0.6);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(centerX + 150, 80, 40, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.ellipse(centerX - 50, 100, 50, 25, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX - 80, 120, 40, 20, 0.3, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#374151';
        ctx.fillRect(centerX - 5, canvas.height * 0.55, 10, canvas.height * 0.45);
        
        ctx.fillStyle = '#1f2937';
        ctx.beginPath();
        ctx.moveTo(centerX - 5, canvas.height * 0.55);
        ctx.lineTo(centerX + 45, canvas.height * 0.45);
        ctx.lineTo(centerX + 5, canvas.height * 0.5);
        ctx.closePath();
        ctx.fill();
    } else if (mode === 'graduation') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(centerX - 60, centerY - 20);
        ctx.lineTo(centerX + 60, centerY - 20);
        ctx.lineTo(centerX + 50, centerY + 30);
        ctx.lineTo(centerX - 50, centerY + 30);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(centerX - 3, centerY - 20, 6, 80);
        
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - 60);
        ctx.lineTo(centerX + 15, centerY - 35);
        ctx.lineTo(centerX, centerY - 45);
        ctx.lineTo(centerX - 15, centerY - 35);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#ffe4d4';
        ctx.beginPath();
        ctx.arc(centerX, centerY + 60, 45, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#4a3728';
        ctx.fillRect(centerX - 25, centerY + 100, 50, 80);
        
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(centerX - 80, centerY + 120);
        ctx.lineTo(centerX - 60, centerY + 140);
        ctx.lineTo(centerX - 100, centerY + 140);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.moveTo(centerX + 80, centerY + 120);
        ctx.lineTo(centerX + 60, centerY + 140);
        ctx.lineTo(centerX + 100, centerY + 140);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.moveTo(centerX - 40, centerY + 160);
        ctx.lineTo(centerX - 20, centerY + 180);
        ctx.lineTo(centerX - 60, centerY + 180);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(centerX + 40, centerY + 160);
        ctx.lineTo(centerX + 20, centerY + 180);
        ctx.lineTo(centerX + 60, centerY + 180);
        ctx.closePath();
        ctx.fill();
    }
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(title, centerX, canvas.height - 30);
    
    return canvas.toDataURL('image/jpeg', 0.85);
}

function triggerShutter() {
    const flashOverlay = document.getElementById('flash-overlay');
    const previewOverlay = document.getElementById('preview-overlay');
    const previewImage = document.getElementById('preview-image');
    
    flashOverlay.classList.add('flashing');
    setTimeout(() => flashOverlay.classList.remove('flashing'), 300);
    
    renderMessage('📸 拍摄完成！正在分析照片...', false);
    
    setTimeout(() => {
        const reviews = [
            '哇！构图完美，主体位置恰到好处，简直是大师级水准！',
            '太美了！光线处理得当，画面通透自然，每张都是大片！',
            '绝了！色彩饱满，层次感丰富，这张照片可以参加摄影比赛了！',
            '太棒了！对焦精准，细节清晰，你真是个拍照天才！',
            '完美！曝光恰到好处，对比度适中，这就是我想要的效果！',
            '惊艳！构图新颖，视角独特，充满艺术感！',
            '出色！白平衡准确，色彩还原真实，专业摄影师水准！'
        ];
        const randomReview = reviews[Math.floor(Math.random() * reviews.length)];
        renderMessage(randomReview, false);
        
        setTimeout(() => {
            if (speechManager.speechSupported) {
                speechManager.speak(randomReview);
            }
            
            setTimeout(() => {
                let photoSrc = null;
                
                if (cameraManager.isActive()) {
                    photoSrc = cameraManager.capturePhoto();
                }
                
                if (!photoSrc) {
                    photoSrc = generateScenePhoto(currentMode);
                }
                
                previewImage.src = photoSrc;
                previewOverlay.classList.add('visible');
            }, 2000);
        }, 500);
    }, 1500);
}
