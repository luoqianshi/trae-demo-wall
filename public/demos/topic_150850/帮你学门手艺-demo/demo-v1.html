<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帮你学门手艺 - 公益培训AI智能顾问</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);
            color: white;
            padding: 30px 0;
            text-align: center;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
        }

        header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .header-subtitle {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .subtitle-tag {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        nav {
            background: white;
            padding: 15px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: nowrap;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: nowrap;
        }

        .nav-right {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .city-filter-wrapper {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            background: #f8fafc;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .city-filter-wrapper:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .city-filter-wrapper select {
            border: none;
            background: transparent;
            font-size: 14px;
            color: #475569;
            outline: none;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            flex-wrap: nowrap;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #475569;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 24px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-links a:hover {
            background: #f1f5f9;
            border-color: #e2e8f0;
            color: #334155;
        }

        .nav-links a.active {
            background: #dbeafe;
            border-color: #bfdbfe;
            color: #1e40af;
        }

        .nav-home-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #475569;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 24px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-home-link:hover {
            background: #f1f5f9;
            border-color: #e2e8f0;
            color: #334155;
        }

        .nav-home-link.active {
            background: #dbeafe;
            border-color: #bfdbfe;
            color: #1e40af;
        }

        .search-box {
            position: relative;
            display: flex;
            flex: 1;
            width: 100%;
            min-width: 200px;
        }

        .type-tabs-nav {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .type-tab-nav {
            padding: 8px 14px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .type-tab-nav:hover {
            border-color: #93c5fd;
            color: #2563eb;
            background: #eff6ff;
        }

        .type-tab-nav.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .search-box input {
            padding: 9px 45px 9px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            background: #f8fafc;
            font-size: 14px;
            color: #475569;
        }

        .search-box input:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-box input::placeholder {
            color: #94a3b8;
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            padding: 6px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #94a3b8;
        }

        .search-btn:hover {
            background: #e2e8f0;
            color: #3b82f6;
        }

        .city-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: none;
        }

        .city-modal.active {
            display: block;
        }

        .city-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .city-modal-content {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 24px 24px 0 0;
            max-height: 80vh;
            overflow: hidden;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100%); }
            to { transform: translateX(-50%) translateY(0); }
        }

        .city-modal.active .city-modal-content {
            animation: slideUp 0.3s ease both;
        }

        .city-modal-header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
            position: relative;
        }

        .city-modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin: 0 0 4px 0;
        }

        .city-modal-header p {
            font-size: 13px;
            color: #ef4444;
            margin: 0;
        }

        .city-modal-close {
            position: absolute;
            right: 16px;
            top: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: #f3f4f6;
            border-radius: 50%;
            font-size: 20px;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .city-modal-close:hover {
            background: #e5e7eb;
        }

        .city-search-box {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            background: #f9fafb;
            gap: 10px;
        }

        .city-search-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
        }

        .city-modal-body {
            padding: 16px 24px 32px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .city-group {
            margin-bottom: 20px;
        }

        .city-group h4 {
            font-size: 14px;
            color: #9ca3af;
            margin: 16px 0 12px 0;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1;
        }

        .city-group h4 svg {
            flex-shrink: 0;
            vertical-align: middle;
        }

        .city-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .city-btn {
            padding: 10px 20px;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            background: white;
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .city-btn:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .city-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .filter-section {
            background: white;
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f3f4f6;
        }

        .filter-controls {
            display: flex;
            gap: 20px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 16px;
            background: #f3f4f6;
        }

        .filter-group select, .filter-group input {
            padding: 6px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            outline: none;
            font-size: 13px;
            transition: all 0.3s ease;
            background: white;
            cursor: pointer;
            min-width: 120px;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .filter-group select:hover, .filter-group input:hover {
            border-color: #d1d5db;
            background: #fafafa;
        }

        .type-tabs {
            display: flex;
            gap: 10px;
        }

        .type-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid #e5e7eb;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .type-tab:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .type-tab.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .type-tab.green {
            background: #10b981;
            border-color: #10b981;
        }

        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-chip {
            padding: 6px 14px;
            border-radius: 16px;
            background: #f3f4f6;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-chip:hover {
            background: #e0f2fe;
            color: #1e40af;
        }

        .category-chip.active {
            background: #3b82f6;
            color: white;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding-bottom: 80px;
        }

        .course-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .course-image {
            height: 180px;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-color: #f3f4f6;
        }
        .course-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .course-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%);
            z-index: 1;
        }

        .course-type-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        .course-type-badge.public {
            background: #3b82f6;
        }

        .course-type-badge.subsidy {
            background: #10b981;
        }

        .course-status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        .course-status-badge.enrolling {
            background: #f59e0b;
        }

        .course-status-badge.ongoing {
            background: #10b981;
        }

        .course-status-badge.ended {
            background: #6b7280;
        }

        .course-status-badge.pending {
            background: #8b5cf6;
        }

        .course-status-badge.upcoming {
            background: #ef4444;
        }

        .course-content {
            padding: 16px;
        }

        .course-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .course-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .course-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #6b7280;
        }

        .course-meta-item i {
            font-size: 12px;
        }

        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #f3f4f6;
        }

        .favorite-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #d1d5db;
            transition: color 0.3s ease;
        }

        .favorite-btn:hover {
            color: #ef4444;
        }

        .favorite-btn.active {
            color: #ef4444;
        }

        .detail-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .detail-btn:hover {
            background: #2563eb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
        }

        footer {
            background: #1f2937;
            color: #9ca3af;
            padding: 30px 0;
            text-align: center;
            margin-top: 40px;
        }

        footer p {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .modal-close:hover {
            opacity: 1;
        }

        .modal-title-bar {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 20px 24px;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            flex-shrink: 0;
        }

        .modal-title-bar img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .modal-title-bar .title-content {
            flex: 1;
            min-width: 0;
        }

        .modal-title-bar .title-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            position: relative;
            padding-right: 20px;
        }

        .modal-title-bar .title-content h2::after {
            content: '▾';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #9ca3af;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .modal-title-bar .title-content h2:hover {
            white-space: normal;
            text-overflow: clip;
            background: rgba(255, 255, 255, 0.95);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            max-height: 120px;
            overflow-y: auto;
            padding-right: 20px;
        }

        .modal-title-bar .title-content h2:hover::after {
            opacity: 1;
            color: #3b82f6;
        }

        .modal-title-bar .title-content .badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal-title-bar .title-content .badges .course-type-badge,
        .modal-title-bar .title-content .badges .course-status-badge {
            position: static;
            top: auto;
            left: auto;
            right: auto;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e5e7eb;
        }

        .detail-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-item label {
            font-size: 13px;
            color: #6b7280;
        }

        .detail-item span {
            font-size: 14px;
            color: #1f2937;
            font-weight: 500;
        }

        .qualification-tip {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
        }

        .qualification-tip h4 {
            font-size: 14px;
            color: #92400e;
            margin-bottom: 8px;
        }

        .qualification-tip p {
            font-size: 13px;
            color: #b45309;
            line-height: 1.8;
        }

        .contact-section {
            background: #f9fafb;
            padding: 16px;
            border-radius: 8px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .contact-name {
            font-weight: 600;
            color: #1f2937;
        }

        .contact-phone {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-phone:hover {
            text-decoration: underline;
        }

        .source-info {
            margin-top: 20px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 12px;
            font-size: 13px;
            color: #6b7280;
        }

        .source-info > div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-info > div:not(:last-child) {
            margin-bottom: 12px;
        }

        .source-info a {
            color: #3b82f6;
            text-decoration: none;
        }

        .source-info a:hover {
            text-decoration: underline;
        }

        .copy-link-btn {
            background: none;
            border: 1px solid #e5e7eb;
            padding: 4px 10px;
            border-radius: 4px;
            color: #6b7280;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-link-btn:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .ai-float-btn {
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            cursor: grab;
            transition: all 0.3s ease;
            z-index: 500;
            user-select: none;
        }

        .ai-float-btn.dragging {

        function loadFavorites() {
            const stored = localStorage.getItem('craft_favorites');
            if (stored) {
                favorites = JSON.parse(stored);
            }
        }

        function saveFavorites() {
            localStorage.setItem('craft_favorites', JSON.stringify(favorites));
        }

        function copyLink(url, event) {
            const btn = event.currentTarget;
            const originalHtml = btn.innerHTML;
            
            function showCopied() {
                btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>已复制';
                btn.style.borderColor = '#10b981';
                btn.style.color = '#10b981';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.style.borderColor = '';
                    btn.style.color = '';
                }, 2000);
            }
            
            function fallbackCopy() {
                const textArea = document.createElement('textarea');
                textArea.value = url;
                textArea.style.position = 'fixed';
                textArea.style.left = '-9999px';
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopied();
                } catch (err) {
                    alert('复制失败，请手动复制链接：' + url);
                }
                document.body.removeChild(textArea);
            }
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(showCopied).catch(fallbackCopy);
            } else {
                fallbackCopy();
            }
        }

        function openSourceUrl(url) {
            try {
                const win = window.open(url, '_blank');
                if (win) {
                    win.focus();
                } else {
                    throw new Error('弹窗被阻止');
                }
            } catch (e) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(url).then(() => {
                        alert('链接已复制到剪贴板，请粘贴到浏览器中打开');
                    }).catch(() => {
                        alert('无法访问该链接，请手动复制原文链接');
                    });
                } else {
                    alert('无法访问该链接，请手动复制原文链接');
                }
            }
        }

        function toggleFavorite(courseId) {
            const index = favorites.indexOf(courseId);
            if (index === -1) {
                favorites.push(courseId);
            } else {
                favorites.splice(index, 1);
            }
            saveFavorites();
            renderCourses();
            renderFavorites();
            updateDetailFavorite(courseId);
        }

        function updateDetailFavorite(courseId) {
            const modal = document.getElementById('detail-modal');
            if (!modal.classList.contains('active')) return;
            
            const btn = modal.querySelector('.favorite-btn');
            if (!btn) return;
            
            const isFavorite = favorites.includes(courseId);
            btn.classList.toggle('active', isFavorite);
            
            const svg = btn.querySelector('svg');
            if (svg) {
                svg.setAttribute('fill', isFavorite ? '#ef4444' : 'none');
                svg.setAttribute('stroke', isFavorite ? '#ef4444' : '#d1d5db');
            }
            
            btn.setAttribute('title', isFavorite ? '取消收藏' : '收藏');
            
            if (isFavorite) {
                btn.style.borderColor = '#ef4444';
                btn.style.color = '#ef4444';
            } else {
                btn.style.borderColor = '#e5e7eb';
                btn.style.color = '#6b7280';
            }
        }

        function createCourseCard(course, showDetail = true) {
            const isFavorite = favorites.includes(course.id);
            const statusLabel = getStatusLabel(course.status);
            const statusClass = getStatusClass(course.status);
            const typeLabel = course.type === 'public' ? '公益培训' : '补贴培训';
            const typeClass = course.type;
            const districtDisplay = course.district && course.district !== '全市' ? ` · ${course.district}` : '';
            let metaHtml = `<div class="course-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>${course.city}${districtDisplay}</div>`;
            
            if (course.type === 'public') {
                metaHtml += `<div class="course-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>${course.hours}</div>`;
            } else {
                metaHtml += `<div class="course-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>${course.level}</div>`;
                metaHtml += `<div class="course-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>${course.duration}</div>`;
                metaHtml += `<div class="course-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>${course.studentCount}</div>`;
            }

            return `
                <div class="course-card" data-id="${course.id}">
                    <div class="course-image">
                        <img src="${course.image}" alt="${course.title}" />
                        <span class="course-type-badge ${typeClass}">${typeLabel}</span>
                        <span class="course-status-badge ${statusClass}">${statusLabel}</span>
                    </div>
                    <div class="course-content">
                        <div class="course-title">${course.title}</div>
                        <div class="course-meta">
                            ${metaHtml}
                        </div>
                        <div class="course-footer">
                            <button class="favorite-btn ${isFavorite ? 'active' : ''}" data-course-id="${course.id}" title="${isFavorite ? '取消收藏' : '收藏'}">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="${isFavorite ? '#ef4444' : 'none'}" stroke="${isFavorite ? '#ef4444' : '#9ca3af'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            </button>
                            ${showDetail ? `<button class="detail-btn" onclick="showDetail('${course.id}'); event.stopPropagation();">查看详情 →</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function filterCourses(courses) {
            return courses.filter(course => {
                if (currentFilter.city && course.city !== currentFilter.city) return false;
                if (currentFilter.type !== 'all' && course.type !== currentFilter.type) return false;
                if (currentFilter.status && course.status !== currentFilter.status) return false;
                if (currentFilter.category && course.category !== currentFilter.category) return false;
                if (currentFilter.search) {
                    const searchLower = currentFilter.search.toLowerCase();
                    return course.title.toLowerCase().includes(searchLower) ||
                           course.organization.toLowerCase().includes(searchLower);
                }
                return true;
            });
        }

        function sortCourses(courses) {
            const sorted = [...courses];
            if (currentSort === 'upcoming') {
                sorted.sort((a, b) => {
                    return a.startTime.localeCompare(b.startTime);
                });
            } else if (currentSort === 'popular') {
                const popularCount = {
                    '养老护理员': 5, '保健按摩师': 4, '电商直播': 3, 
                    '互联网营销师': 3, '人工智能训练师': 3, '电工': 2
                };
                sorted.sort((a, b) => {
                    return (popularCount[b.title] || 0) - (popularCount[a.title] || 0);
                });
            } else if (currentSort === 'distance') {
                if (isLocating && currentFilter.city) {
                    const cityCoords = {
                        '北京': [39.9042, 116.4074],
                        '上海': [31.2304, 121.4737],
                        '广州': [23.1291, 113.2644],
                        '深圳': [22.5431, 114.0579],
                        '济南': [36.6512, 117.1201],

                    };
                    const userCoords = cityCoords[currentFilter.city];
                    if (userCoords) {
                        sorted.sort((a, b) => {
                            const aCoords = cityCoords[a.city];
                            const bCoords = cityCoords[b.city];
                            if (!aCoords && !bCoords) return 0;
                            if (!aCoords) return 1;
                            if (!bCoords) return -1;
                            const distA = Math.sqrt(Math.pow(userCoords[0] - aCoords[0], 2) + Math.pow(userCoords[1] - aCoords[1], 2));
                            const distB = Math.sqrt(Math.pow(userCoords[0] - bCoords[0], 2) + Math.pow(userCoords[1] - bCoords[1], 2));
                            return distA - distB;
                        });
                    }
                } else {
                    alert('请在选择城市中获取精准定位');
                }
            }
            return sorted;
        }

            navigator.clipboard.writeText(phone).then(() => {

            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = phone;

                textarea.select();

                document.body.removeChild(textarea);
                alert('电话号码已复制到剪贴板：' + phone);
            });

                const subsidyCourses = courseData.filter(c => c.type === 'subsidy' && c.status === 'enrolling').slice(0, 3);
                const publicCourses = courseData.filter(c => c.type === 'public' && c.status === 'enrolling').slice(0, 3);
                
                if (subsidyCourses.length > 0 || publicCourses.length > 0) {
                    response = `您好！根据您的情况，您可能属于补贴培训适用人群。为您推荐以下课程：<br><br>`;
                    
                    if (subsidyCourses.length > 0) {
                        response += `<strong style="font-size: 13px; color: #10b981;">补贴培训（推荐）：</strong><br>`;
                        subsidyCourses.forEach(c => {
                            response += createChatCourseCard(c);
                        });
                    }
                    
                    if (publicCourses.length > 0) {
                        response += `<br><strong style="font-size: 13px; color: #3b82f6;">公益培训（体验）：</strong><br>`;
                        publicCourses.forEach(c => {
                            response += createChatCourseCard(c);
                        });

                const electricCourses = courseData.filter(c => c.title.includes('电工') || c.title.includes('电气')).slice(0, 5);
                if (electricCourses.length > 0) {

                        response += createChatCourseCard(c);

                const careCourses = courseData.filter(c => c.title.includes('养老') || c.title.includes('护理') || c.category === '养老护理').slice(0, 5);

        function getCityFromCoords(lat, lng) {
            if (isNaN(lat) || isNaN(lng)) {
                console.error('无效的坐标参数');
                return null;
            }
            
            if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
                console.error('坐标超出有效范围');
                return null;
            }
            
            const cityCoords = {
                '北京': [39.9042, 116.4074],
                '上海': [31.2304, 121.4737],
                '广州': [23.1291, 113.2644],
                '深圳': [22.5431, 114.0579],
                '济南': [36.6512, 117.1201],
                '青岛': [36.0671, 120.3826],
                '苏州': [31.2990, 120.5853],
                '天津': [39.0842, 117.2008],
                '重庆': [29.4316, 106.9123],
                '宁波': [29.8683, 121.5440],
                '石家庄': [38.0423, 114.5025],
                '太原': [37.8706, 112.5489],
                '呼和浩特': [40.8415, 111.7510],
                '沈阳': [41.8056, 123.4315],
                '大连': [38.9140, 121.6147],
                '长春': [43.8256, 125.3235],
                '哈尔滨': [45.8038, 126.5349],
                '南京': [32.0603, 118.7969],
                '杭州': [30.2741, 120.1551],
                '合肥': [31.8206, 117.2272],
                '福州': [26.0745, 119.2965],
                '厦门': [24.4798, 118.0894],
                '南昌': [28.6821, 115.8573],
                '无锡': [31.4912, 120.3119],
                '常州': [31.8112, 119.9743],
                '郑州': [34.7466, 113.6253],
                '武汉': [30.5928, 114.3055],
                '长沙': [28.2280, 112.9388],
                '南宁': [22.8170, 108.3665],
                '海口': [20.0440, 110.2247],
                '佛山': [23.0219, 113.1264],
                '东莞': [23.0219, 113.7537],
                '成都': [30.5728, 104.0668],
                '昆明': [24.8819, 102.8335],
                '贵阳': [26.6476, 106.6302],
                '西安': [34.3416, 108.9398],
                '兰州': [36.0611, 103.8343],
                '西宁': [36.6171, 101.7782],
                '银川': [38.4851, 106.2308],
                '乌鲁木齐': [43.8256, 87.6168]
            };
            
            function haversineDistance(lat1, lng1, lat2, lng2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }
            
            const maxDistance = 50;
            let minDistance = Infinity;
            let closestCity = null;
            
            for (const [city, coords] of Object.entries(cityCoords)) {
                const distance = haversineDistance(lat, lng, coords[0], coords[1]);
                if (distance < minDistance && distance <= maxDistance) {
                    minDistance = distance;
                    closestCity = city;
                }
            }
            
            return closestCity;
        }

                document.body.style.width = '100%';

                const scrollY = parseInt(document.body.style.top || '0');

                document.documentElement.style.overflow = '';
                document.body.style.position = '';
                document.body.style.top = '';

            document.getElementById('status-filter').addEventListener('change', (e) => {
                currentFilter.status = e.target.value;
                renderCourses();
            });

            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    currentFilter.category = chip.dataset.category;
                    renderCourses();
                });
            });

            document.getElementById('sort-filter').addEventListener('change', (e) => {
                currentSort = e.target.value;
                renderCourses();
            });

            document.getElementById('search-input').addEventListener('input', (e) => {
                currentFilter.search = e.target.value;
                if (document.getElementById('favorites-page').style.display === 'block') {
                    renderFavorites();
                } else {
                    renderCourses();
                }
            });

            document.getElementById('search-btn').addEventListener('click', () => {
                if (document.getElementById('favorites-page').style.display === 'block') {
                    renderFavorites();
                } else {
                    renderCourses();
                }
            });

            document.getElementById('home-link').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('home-page').style.display = 'block';
                document.getElementById('favorites-page').style.display = 'none';
                document.querySelectorAll('.nav-links a, .nav-home-link').forEach(a => a.classList.remove('active'));
                document.getElementById('home-link').classList.add('active');
                document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
                document.getElementById('bottom-home').classList.add('active');
                document.querySelectorAll('.type-tab, .type-tab-nav').forEach(t => t.classList.remove('active'));
                currentFilter.type = 'all';
                renderCourses();
            });

            document.getElementById('favorites-link').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('home-page').style.display = 'none';
                document.getElementById('favorites-page').style.display = 'block';
                document.querySelectorAll('.nav-links a, .nav-home-link').forEach(a => a.classList.remove('active'));
                document.getElementById('favorites-link').classList.add('active');
                document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
                document.getElementById('bottom-favorites').classList.add('active');
                document.querySelectorAll('.type-tab, .type-tab-nav').forEach(t => t.classList.remove('active'));
                currentFilter.type = 'all';
                renderFavorites();
            });

            document.getElementById('bottom-home').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('home-page').style.display = 'block';
                document.getElementById('favorites-page').style.display = 'none';
                document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
                document.getElementById('bottom-home').classList.add('active');
                document.querySelectorAll('.nav-links a, .nav-home-link').forEach(a => a.classList.remove('active'));
                document.getElementById('home-link').classList.add('active');
            });

            document.getElementById('bottom-favorites').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('home-page').style.display = 'none';
                document.getElementById('favorites-page').style.display = 'block';
                document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
                document.getElementById('bottom-favorites').classList.add('active');
                document.querySelectorAll('.nav-links a, .nav-home-link').forEach(a => a.classList.remove('active'));
                document.getElementById('favorites-link').classList.add('active');
                document.querySelectorAll('.type-tab, .type-tab-nav').forEach(t => t.classList.remove('active'));
                currentFilter.type = 'all';
                renderFavorites();
            });

            document.getElementById('clear-favorites-btn').addEventListener('click', () => {
                if (confirm('确定要清空所有收藏吗？')) {
                    favorites = [];
                    saveFavorites();
                    renderFavorites();
                    renderCourses();
                }
            });

            document.getElementById('modal-close').addEventListener('click', closeModal);
            document.getElementById('detail-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('detail-modal')) {
                    closeModal();
                }
            });

            document.getElementById('ai-float-btn').addEventListener('click', () => {
                document.getElementById('ai-modal').classList.toggle('active');
            });

            document.getElementById('ai-close').addEventListener('click', () => {
                document.getElementById('ai-modal').classList.remove('active');
            });

            document.getElementById('ai-clear-btn').addEventListener('click', () => {
                const chatContainer = document.getElementById('ai-chat-container');
                chatContainer.innerHTML = `
                    <div class="chat-message">
                        <div class="chat-avatar ai"><img src="ai客服-copy-copy.svg" alt="AI" style="width: 100%; height: 100%;"></div>
                        <div class="chat-bubble ai">
                            您好！我是您的AI智能顾问，请问有什么可以帮您？<br><br>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>您可以这样问我：<br><br>
                            <div class="quick-questions-box">
                                <button class="quick-question-btn" onclick="sendQuickQuestion('我失业了，不知道学什么')">我失业了，不知道学什么</button>
                                <button class="quick-question-btn" onclick="sendQuickQuestion('济南有哪些电工培训？')">济南有哪些电工培训？</button>
                                <button class="quick-question-btn" onclick="sendQuickQuestion('适合女性的培训课程有哪些？')">适合女性的培训课程有哪些？</button>
                                <button class="quick-question-btn" onclick="sendQuickQuestion('周末有课吗？')">周末有课吗？</button>
                                <button class="quick-question-btn test-btn" onclick="sendTestMessage()">八个真实场景语义解析测试</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('ai-send-btn').addEventListener('click', sendAiMessage);

            document.getElementById('ai-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendAiMessage();
                }
            });

            document.addEventListener('click', (e) => {
                const favoriteBtn = e.target.closest('.favorite-btn');
                if (favoriteBtn) {
                    e.stopPropagation();
                    const courseId = favoriteBtn.dataset.courseId;
                    if (courseId) {
                        toggleFavorite(courseId);
                    }
                }
            });

            const aiFloatBtn = document.getElementById('ai-float-btn');
            let isDragging = false;
            let startX, startY, startRight, startBottom;

            function startDrag(clientX, clientY) {
                isDragging = true;
                aiFloatBtn.classList.add('dragging');
                
                const rect = aiFloatBtn.getBoundingClientRect();
                startX = clientX;
                startY = clientY;
                startRight = window.innerWidth - rect.right;
                startBottom = window.innerHeight - rect.bottom;
            }

            function handleDrag(clientX, clientY) {
                if (!isDragging) return;
                
                const deltaX = clientX - startX;
                const deltaY = clientY - startY;
                
                const newRight = startRight - deltaX;
                const newBottom = startBottom - deltaY;
                
                const btnWidth = aiFloatBtn.offsetWidth;
                const btnHeight = aiFloatBtn.offsetHeight;
                
                const maxRight = window.innerWidth - btnWidth;
                const maxBottom = window.innerHeight - btnHeight;
                
                aiFloatBtn.style.right = Math.max(0, Math.min(maxRight, newRight)) + 'px';
                aiFloatBtn.style.bottom = Math.max(0, Math.min(maxBottom, newBottom)) + 'px';
            }

            function stopDrag() {
                if (isDragging) {
                    isDragging = false;
                    aiFloatBtn.classList.remove('dragging');
                }
            }

            aiFloatBtn.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                startDrag(e.clientX, e.clientY);
                e.preventDefault();
            });

            aiFloatBtn.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                startDrag(touch.clientX, touch.clientY);
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('mousemove', (e) => {
                handleDrag(e.clientX, e.clientY);
            });

            document.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                handleDrag(touch.clientX, touch.clientY);
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('mouseup', stopDrag);

            document.addEventListener('mouseleave', stopDrag);

            document.addEventListener('touchend', stopDrag);
        });
    </script>
</body>
</html>
