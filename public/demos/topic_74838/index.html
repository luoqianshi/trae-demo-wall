<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天台十句</title>
<style>
    :root {
        --bg: #0D1117;
        --bg2: #1A1B26;
        --bg3: #24283B;
        --ink: #C0CAF5;
        --ink-strong: #E6E9FF;
        --muted: #565F89;
        --accent: #7AA2F7;
        --accent2: #BB9AF7;
        --good: #9ECE6A;
        --bad: #F7768E;
        --warn: #E0AF68;
        --rule: #2E3246;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    body {
        padding: 16px;
    }

    .app {
        max-width: 960px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    /* 顶部栏 */
    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        background: var(--bg2);
        border: 1px solid var(--rule);
        border-radius: 14px;
    }

    .title {
        font-size: 22px;
        font-weight: 800;
        color: var(--ink-strong);
        letter-spacing: 3px;
    }

    .sentences-indicator {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .dots {
        display: flex;
        gap: 6px;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        transition: background 300ms ease, transform 300ms ease;
    }

    .dot.used {
        background: var(--muted);
        transform: scale(0.85);
    }

    .remaining-text {
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .remaining-text strong {
        color: var(--ink-strong);
        font-weight: 700;
    }

    /* Canvas 分栏 */
    .canvas-section {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .canvas-wrap {
        background: var(--bg2);
        border: 1px solid var(--rule);
        border-radius: 14px;
        overflow: hidden;
        position: relative;
    }

    .canvas-label {
        position: absolute;
        top: 10px;
        left: 12px;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 1px;
        z-index: 2;
        pointer-events: none;
    }

    canvas {
        display: block;
        width: 100%;
        height: 320px;
    }

    /* 心境监测 */
    .emotions {
        background: linear-gradient(180deg, var(--bg2) 0%, #16182580 100%), var(--bg2);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 13px;
        position: relative;
        overflow: hidden;
    }
    .emotions::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 80% at 0% 0%, rgba(122,162,247,0.06), transparent 60%);
        pointer-events: none;
    }

    .mind-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--rule);
        position: relative;
    }
    .mind-title {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 2px;
    }
    .mind-status {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--bad);
        transition: color 400ms ease;
        text-shadow: 0 0 10px currentColor;
    }

    .emotion-row {
        display: grid;
        grid-template-columns: 48px 1fr 32px;
        align-items: center;
        gap: 12px;
        position: relative;
    }

    .emotion-label {
        font-size: 12px;
        color: var(--ink);
        letter-spacing: 1px;
    }

    .emotion-track {
        height: 10px;
        background: var(--bg3);
        border-radius: 6px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    }

    .emotion-fill {
        height: 100%;
        width: 50%;
        border-radius: 6px;
        position: relative;
        transition: width 400ms cubic-bezier(0.4, 0, 0.2, 1), background 300ms ease, box-shadow 300ms ease;
    }
    /* 液态波光：流动高光 + 顶部波纹 */
    .emotion-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
        transform: translateX(-100%);
        animation: liquidShimmer 2.8s ease-in-out infinite;
    }
    .emotion-fill::before {
        content: '';
        position: absolute;
        top: -2px;
        left: 0;
        right: 0;
        height: 4px;
        background: radial-gradient(60% 100% at 30% 100%, rgba(255,255,255,0.5), transparent 70%);
        opacity: 0.6;
    }
    @keyframes liquidShimmer {
        0% { transform: translateX(-100%); }
        60%, 100% { transform: translateX(120%); }
    }

    .emotion-value {
        font-size: 12px;
        color: var(--muted);
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
    }

    #bar-calm .emotion-fill { background: linear-gradient(180deg, #9DB8FF, var(--accent)); box-shadow: 0 0 10px rgba(122,162,247,0.5); }
    #bar-trust .emotion-fill { background: linear-gradient(180deg, #D4BFFF, var(--accent2)); box-shadow: 0 0 10px rgba(187,154,247,0.5); }
    #bar-despair .emotion-fill { background: linear-gradient(180deg, #FFA0B4, var(--bad)); box-shadow: 0 0 10px rgba(247,118,142,0.5); }

    /* 对话选项 */
    .dialogue {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .option-card {
        background: var(--bg2);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--type-color, var(--accent));
        border-radius: 12px;
        padding: 14px 16px;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.6;
        cursor: pointer;
        text-align: left;
        transition: border-color 200ms ease, background 200ms ease, transform 200ms ease, opacity 200ms ease;
        font-family: inherit;
        position: relative;
    }

    .option-card:hover:not(:disabled) {
        border-color: var(--type-color, var(--accent));
        background: var(--bg3);
        transform: translateY(-2px);
    }

    .option-card:disabled {
        cursor: not-allowed;
        opacity: 0.4;
    }

    .option-type {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--type-color, var(--accent));
        display: block;
        margin-bottom: 6px;
    }

    .option-text {
        display: block;
    }
    .key-hint {
        position: absolute;
        top: 8px;
        right: 10px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 5px;
        background: rgba(122,162,247,0.14);
        border: 1px solid rgba(122,162,247,0.35);
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        line-height: 16px;
        text-align: center;
        letter-spacing: 0.5px;
        font-family: "SF Mono", "Consolas", monospace;
        pointer-events: none;
    }
    .key-hint-action {
        background: rgba(187,154,247,0.14);
        border-color: rgba(187,154,247,0.35);
        color: var(--accent2);
    }

    /* 结局提示 */
    .ending-banner {
        background: var(--bg2);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 16px 18px;
        text-align: center;
        color: var(--ink-strong);
        font-weight: 700;
        letter-spacing: 1px;
        display: none;
    }

    .ending-banner.show { display: block; }

    /* 开场遮罩 */
    .opening-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        cursor: pointer;
        transition: opacity 800ms ease;
        overflow: hidden;
    }
    .opening-overlay.fade {
        opacity: 0;
        pointer-events: none;
    }
    #opening-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }
    .opening-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 0 24px;
    }
    .opening-title {
        color: var(--accent);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 8px;
        opacity: 0;
        animation: openingIn 1.2s ease 0.3s forwards;
        text-shadow: 0 0 18px rgba(122,162,247,0.5);
    }
    .opening-text {
        color: var(--ink-strong);
        font-size: 21px;
        text-align: center;
        line-height: 2.1;
        letter-spacing: 2px;
        min-height: 90px;
        opacity: 0;
        animation: openingIn 1s ease 0.9s forwards;
    }
    .opening-text .cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: var(--accent);
        vertical-align: middle;
        margin-left: 2px;
        animation: blink 0.8s steps(2) infinite;
    }
    .opening-hint {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 2px;
        opacity: 0;
        animation: openingIn 1s ease 2.6s forwards, hintPulse 2.4s ease 3.6s infinite;
    }
    @keyframes openingIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
    }
    @keyframes hintPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
    }

    /* 入场渐显（开场结束后分区淡入） */
    body:not(.started) .topbar,
    body:not(.started) .canvas-section,
    body:not(.started) .emotions,
    body:not(.started) .actions,
    body:not(.started) .dialogue { opacity: 0; }
    body.started .topbar { animation: fadeInUp 600ms ease 100ms forwards; }
    body.started .canvas-section { animation: fadeInUp 900ms ease 300ms forwards; }
    body.started .emotions { animation: fadeInUp 600ms ease 800ms forwards; }
    body.started .actions { animation: fadeInUp 600ms ease 950ms forwards; }
    body.started .dialogue { animation: fadeInUp 600ms ease 1100ms forwards; }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* 对话历史 */
    .dialogue-history {
        background: var(--bg2);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 14px;
        max-height: 200px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .dialogue-history:empty { display: none; }
    .bubble {
        max-width: 78%;
        padding: 9px 13px;
        border-radius: 12px;
        font-size: 13.5px;
        line-height: 1.55;
        animation: bubbleIn 300ms ease forwards;
        opacity: 0;
        word-break: break-word;
    }
    @keyframes bubbleIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .bubble.player {
        align-self: flex-end;
        background: var(--bg3);
        color: var(--ink);
        border-bottom-right-radius: 4px;
    }
    .bubble.npc {
        align-self: flex-start;
        background: var(--bg3);
        color: var(--ink);
        border-left: 3px solid var(--accent);
        border-bottom-left-radius: 4px;
    }
    .bubble.system {
        align-self: center;
        background: transparent;
        color: var(--warn);
        border: 1px dashed var(--warn);
        border-radius: 8px;
        font-size: 12.5px;
        text-align: center;
        max-width: 92%;
        letter-spacing: 0.5px;
    }
    .bubble.story {
        align-self: flex-start;
        background: rgba(187,154,247,0.12);
        color: var(--ink-strong);
        border-left: 3px solid var(--accent2);
        border-bottom-left-radius: 4px;
        font-style: italic;
        max-width: 84%;
    }
    .bubble.story .story-title {
        display: block;
        font-style: normal;
        font-weight: 700;
        font-size: 11px;
        color: var(--accent2);
        letter-spacing: 1px;
        margin-bottom: 4px;
    }

    /* 行动栏 */
    .actions {
        background: var(--bg2);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .actions-label {
        width: 100%;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 1px;
        margin-bottom: 2px;
    }
    .action-chip {
        flex: 1 1 120px;
        background: var(--bg3);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        transition: border-color 200ms ease, background 200ms ease, transform 200ms ease, opacity 200ms ease;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .action-chip:hover:not(:disabled) {
        border-color: var(--accent);
        background: #2D3250;
        transform: translateY(-2px);
    }
    .action-chip:disabled {
        opacity: 0.32;
        cursor: not-allowed;
    }
    .action-icon {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        flex-shrink: 0;
    }
    .action-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
    }
    .action-name {
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-strong);
    }
    .action-desc {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 结局面板 */
    .ending-panel {
        display: none;
        background: var(--bg2);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 26px 22px;
        text-align: center;
    }
    .ending-panel.show {
        display: block;
        animation: bubbleIn 600ms ease forwards;
    }
    .ending-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 12px;
    }
    .ending-subtitle {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
        margin-bottom: 24px;
    }
    .help-card {
        background: var(--bg2);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--accent);
        border-radius: 10px;
        padding: 14px 18px;
        text-align: left;
        margin-bottom: 22px;
        font-size: 13px;
        line-height: 2;
        color: var(--ink);
    }
    .help-card-title {
        color: var(--ink-strong);
        font-weight: 700;
        margin-bottom: 6px;
        line-height: 1.6;
    }
    .help-hotline {
        color: var(--accent);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
    }
    .restart-btn {
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 10px;
        padding: 12px 30px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 200ms ease, transform 200ms ease;
    }
    .restart-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }
    .epilogue-btn {
        background: transparent;
        color: var(--accent2);
        border: 1px solid var(--accent2);
        border-radius: 10px;
        padding: 11px 26px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        cursor: pointer;
        font-family: inherit;
        margin-bottom: 14px;
        transition: background 200ms ease, transform 200ms ease;
    }
    .epilogue-btn:hover {
        background: rgba(187,154,247,0.12);
        transform: translateY(-2px);
    }
    /* 后续故事容器 */
    .epilogue {
        text-align: left;
        margin-bottom: 22px;
    }
    .epilogue-header {
        text-align: center;
        font-size: 13px;
        color: var(--accent2);
        letter-spacing: 4px;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--rule);
    }
    .epilogue-scene {
        margin-bottom: 18px;
        opacity: 0;
        transform: translateY(10px);
        animation: bubbleIn 700ms ease forwards;
    }
    .epilogue-time {
        font-size: 11px;
        color: var(--accent);
        letter-spacing: 2px;
        margin-bottom: 6px;
        font-weight: 700;
    }
    .epilogue-text {
        font-size: 13.5px;
        line-height: 1.85;
        color: var(--ink);
        font-style: italic;
        padding-left: 12px;
        border-left: 2px solid var(--accent2);
    }
    .epilogue-sign {
        text-align: right;
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        letter-spacing: 1px;
    }

    /* 响应式 */
    @media (max-width: 640px) {
        .canvas-section {
            grid-template-columns: 1fr;
        }
        .dialogue {
            grid-template-columns: 1fr;
        }
        .title {
            font-size: 20px;
            letter-spacing: 2px;
        }
        .emotion-row {
            grid-template-columns: 64px 1fr 48px;
            gap: 10px;
        }
    }
</style>
</head>
<body>
<!-- 开场遮罩 -->
<div class="opening-overlay" id="opening-overlay">
    <canvas id="opening-canvas"></canvas>
    <div class="opening-inner">
        <div class="opening-title">天台 · 十句</div>
        <div class="opening-text" id="opening-text"></div>
        <div class="opening-hint" id="opening-hint">点击任意位置开始 · 或按 Enter</div>
    </div>
</div>
<div class="app">
    <!-- 顶部栏 -->
    <header class="topbar">
        <div class="title">天台十句</div>
        <div class="sentences-indicator">
            <div class="dots" id="dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div class="remaining-text">剩余 <strong id="remaining">10</strong> 句</div>
        </div>
    </header>

    <!-- Canvas 分栏 -->
    <section class="canvas-section">
        <div class="canvas-wrap">
            <span class="canvas-label">天台 · ROOFTOP</span>
            <canvas id="scene-canvas"></canvas>
        </div>
        <div class="canvas-wrap">
            <span class="canvas-label">面容 · FACE</span>
            <canvas id="face-canvas"></canvas>
        </div>
    </section>

    <!-- 心境监测 -->
    <section class="emotions">
        <div class="mind-header">
            <span class="mind-title">心境监测 · MIND</span>
            <span class="mind-status" id="mind-status">极度绝望 · 危急</span>
        </div>
        <div class="emotion-row" id="bar-calm">
            <span class="emotion-label">平静</span>
            <div class="emotion-track"><div class="emotion-fill" style="width:30%"></div></div>
            <span class="emotion-value">30</span>
        </div>
        <div class="emotion-row" id="bar-trust">
            <span class="emotion-label">信任</span>
            <div class="emotion-track"><div class="emotion-fill" style="width:20%"></div></div>
            <span class="emotion-value">20</span>
        </div>
        <div class="emotion-row" id="bar-despair">
            <span class="emotion-label">绝望</span>
            <div class="emotion-track"><div class="emotion-fill" style="width:80%"></div></div>
            <span class="emotion-value">80</span>
        </div>
    </section>

    <!-- 结局横幅 -->
    <div class="ending-banner" id="ending-banner"></div>

    <!-- 对话历史 -->
    <section class="dialogue-history" id="dialogue-history"></section>

    <!-- 行动栏（每项限一次） -->
    <section class="actions" id="actions-bar"></section>

    <!-- 对话选项 -->
    <section class="dialogue" id="dialogue-options"></section>

    <!-- 结局面板 -->
    <section class="ending-panel" id="ending-panel"></section>
</div>

<script>
(function () {
    "use strict";

    // ========== DOM 引用 ==========
    const sceneCanvas = document.getElementById('scene-canvas');
    const faceCanvas = document.getElementById('face-canvas');
    const sceneCtx = sceneCanvas.getContext('2d');
    const faceCtx = faceCanvas.getContext('2d');
    const dotsEl = document.getElementById('dots');
    const remainingEl = document.getElementById('remaining');
    const dialogueEl = document.getElementById('dialogue-options');
    const endingBanner = document.getElementById('ending-banner');
    const historyEl = document.getElementById('dialogue-history');
    const endingPanel = document.getElementById('ending-panel');
    const openingOverlay = document.getElementById('opening-overlay');
    const actionsBar = document.getElementById('actions-bar');

    // 场景模式：'night' | 'sunrise' | 'dark'
    let sceneMode = 'night';
    let gameStarted = false;
    // 输入锁定：对话/行动进行中为 true，防止快速点击与流程冲突
    let busy = false;
    // 当前显示的对话选项类型（按显示顺序），供数字键 1-4 选取
    let currentDialogueKeys = [];
    // 行动键映射：Q W E R → water coat sit silence
    const actionKeyOrder = ['water', 'coat', 'sit', 'silence'];

    // ========== 工具函数 ==========
    function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
    }

    function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    // 从对象 keys 中随机选 n 个不重复（保证类别多样性）
    function pickNKeys(obj, n) {
        const pool = Object.keys(obj).slice();
        const result = [];
        for (let i = 0; i < n && pool.length > 0; i++) {
            const idx = Math.floor(Math.random() * pool.length);
            result.push(pool.splice(idx, 1)[0]);
        }
        return result;
    }

    // 对话台词去重选取：每类维护一个洗牌池，用尽前不重复
    const linePools = {};
    function pickLine(typeKey) {
        const type = dialogueTypes[typeKey];
        if (!linePools[typeKey] || linePools[typeKey].length === 0) {
            linePools[typeKey] = type.lines.slice();
            // Fisher-Yates 洗牌
            for (let i = linePools[typeKey].length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = linePools[typeKey][i];
                linePools[typeKey][i] = linePools[typeKey][j];
                linePools[typeKey][j] = tmp;
            }
        }
        return linePools[typeKey].pop();
    }

    function getNPCReply(despair) {
        let pool;
        if (despair >= 80) pool = npcReplies.critical;
        else if (despair >= 60) pool = npcReplies.distressed;
        else if (despair >= 40) pool = npcReplies.hesitating;

        let reply = pickRandom(pool);
        if (gameState.trust < 20) {
            reply += "...但我不相信你";

    // ========== 一次性行动系统（不消耗句数，每项限一次） ==========

    function checkStories() {
        for (let i = 0; i < stories.length; i++) {
            if (!gameState.shownStories[i] && gameState.trust >= stories[i].threshold) {
                gameState.shownStories[i] = true;
                return stories[i];

    // ========== 对话气泡 ==========
    function addBubble(text, speaker) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + speaker;
        if (speaker === 'story' && typeof text === 'object') {
            const titleEl = document.createElement('span');
            titleEl.className = 'story-title';
            titleEl.textContent = text.title;
            bubble.appendChild(titleEl);
            bubble.appendChild(document.createTextNode(text.text));
        } else {
            bubble.textContent = text;
        }
        historyEl.appendChild(bubble);
        historyEl.scrollTop = historyEl.scrollHeight;
    }

    function disableOptions(disabled) {
        const cards = dialogueEl.querySelectorAll('.option-card');
        cards.forEach(c => { c.disabled = disabled; });
    }

    // 输入锁定：同时切换对话卡与行动芯片的可用状态
    function setBusy(val) {
        busy = val;
        disableOptions(val);
        actionsBar.querySelectorAll('.action-chip').forEach(chip => {
            const key = chip.dataset.key;
            chip.disabled = val || !!gameState.usedActions[key] || gameState.ended;
        });
    }

    // ========== 行动栏渲染 ==========
    function renderActions() {
        actionsBar.innerHTML = '<div class="actions-label">行动 · ACTIONS（每项限一次，不消耗句数）</div>';
        Object.keys(actions).forEach(key => {
            const action = actions[key];
            const used = !!gameState.usedActions[key];
            const chip = document.createElement('button');
            chip.className = 'action-chip';
            chip.dataset.key = key;
            chip.disabled = used || busy || gameState.ended;
            chip.innerHTML =
                '<span class="key-hint key-hint-action">' + actionKeyHints[key] + '</span>' +
                '<span class="action-icon">' + action.icon + '</span>' +
                '<span class="action-info">' +
                    '<span class="action-name">' + action.label + '</span>' +
                    '<span class="action-desc">' + action.desc + '</span>' +
                '</span>';
            chip.addEventListener('click', function () { handleAction(key); });
            actionsBar.appendChild(chip);
        });
    }

    function handleAction(key) {
        if (gameState.ended || busy) return;
        if (gameState.usedActions[key]) return;
        const action = actions[key];

        setBusy(true);
        gameState.usedActions[key] = true;
        // 立刻把该芯片置灰（标记已用）
        const chip = actionsBar.querySelector('.action-chip[data-key="' + key + '"]');
        if (chip) chip.disabled = true;

        // 玩家行动气泡
        addBubble(action.desc, 'player');
        applyEffects(action.effects);

        // 延迟模拟 NPC 反应
        setTimeout(function () {
            const reaction = getActionReaction(key, gameState.despair);
            addBubble(reaction, 'npc');

            if (gameState.ended) {
                showEnding();
                return;
            }

            // 行动也可能触发背景故事解锁（行动显著提升信任度）
            const story = checkStories();
            if (story) {
                setTimeout(function () {
                    addBubble({ title: story.title, text: story.text }, 'story');
                    setTimeout(function () { setBusy(false); }, 1100);
                }, 600);
            } else {
                setBusy(false);
            }
        }, 700);
    }

    // ========== 情绪系统 ==========
    function applyEffects(effects) {
        if (gameState.ended) return;
        if (effects.calm) gameState.calm = clamp(gameState.calm + effects.calm, 0, 100);
        if (effects.trust) gameState.trust = clamp(gameState.trust + effects.trust, 0, 100);
        if (effects.despair) gameState.despair = clamp(gameState.despair + effects.despair, 0, 100);
        updateBars();
        checkEnding();
        animateFace();
    }

    function updateBars() {
        const calmRow = document.getElementById('bar-calm');
        const trustRow = document.getElementById('bar-trust');
        const despairRow = document.getElementById('bar-despair');

        calmRow.querySelector('.emotion-fill').style.width = gameState.calm + '%';
        calmRow.querySelector('.emotion-value').textContent = gameState.calm;

        trustRow.querySelector('.emotion-fill').style.width = gameState.trust + '%';
        trustRow.querySelector('.emotion-value').textContent = gameState.trust;

        despairRow.querySelector('.emotion-fill').style.width = gameState.despair + '%';
        despairRow.querySelector('.emotion-value').textContent = gameState.despair;

        // 心境状态标签（按绝望度分级，颜色随状态变化）
        const statusEl = document.getElementById('mind-status');
        let label, color;
        if (gameState.despair >= 85) { label = '极度绝望 · 危急'; color = 'var(--bad)'; }
        else if (gameState.despair >= 65) { label = '痛苦 · 动摇'; color = 'var(--bad)'; }
        else if (gameState.despair >= 45) { label = '犹豫 · 松动'; color = 'var(--warn)'; }
        else if (gameState.despair >= 25) { label = '趋于平静'; color = 'var(--accent)'; }
        else { label = '重见光亮'; color = 'var(--good)'; }
        statusEl.textContent = label;
        statusEl.style.color = color;
    }

    function checkEnding() {
        if (gameState.ended) return;

        if (gameState.despair >= 95) {
            gameState.result = 'fail_jump';
            gameState.ended = true;
        } else if (gameState.calm >= 70 && gameState.trust >= 60 && gameState.turn >= 5) {
            // 至少 5 句话才能救下她（避免过早成功）
            gameState.result = 'success';
            gameState.ended = true;
        } else if (gameState.turn >= gameState.maxTurns) {
            if (gameState.calm > 50) {
                gameState.result = 'success_barely';
            } else {
                gameState.result = 'fail_timeout';
            }
            gameState.ended = true;
        }
        // 结局展示交给 handleSelect 在 NPC 回复后触发
    }
