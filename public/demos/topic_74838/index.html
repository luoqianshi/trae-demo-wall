        },
        {
            time: '一个月后 · 上午',
            text: '我给妈妈打了电话。她哭了很久，我也哭了。她说：回来吧，家里给你留了灯。我买了下周回家的车票。',
            scene: 'day',
            face: { calm: 88, trust: 85, despair: 8 }
        },
        {
            time: '半年后 · 一封信',
            text: '如果你看到这条消息——谢谢你那天没有放弃我。我也在学，不放弃自己。年糕现在趴在我腿上，窗外的天很亮。',
            scene: 'day',
            face: { calm: 92, trust: 90, despair: 5 }
        }
    ];

    function startEpilogue() {
        // 重置 ended 标志以让 animateFace 重新启动（仅用于后续故事的画面过渡）
        gameState.ended = false;
        // 锁定输入，防止后续故事进行中键盘/点击污染画面（restartGame 会重置）
        busy = true;
        endingPanel.innerHTML =
            '<div class="epilogue">' +
                '<div class="epilogue-header">她 的 后 来</div>' +
                '<div id="epilogue-scenes"></div>' +
            '</div>';

        const scenesContainer = document.getElementById('epilogue-scenes');
        let idx = 0;

        function playScene() {
            if (idx >= epilogueScenes.length) {
                // 全部场景播完，显示收尾
                showEpilogueEnding();
                return;
            }
            const s = epilogueScenes[idx];

            // 同步切换场景与面容
            sceneMode = s.scene;
            gameState.calm = s.face.calm;
            gameState.trust = s.face.trust;
            gameState.despair = s.face.despair;
            displayCalm = s.face.calm;
            displayTrust = s.face.trust;
            displayDespair = s.face.despair;
            updateBars();
            drawScene();
            drawFace(faceCtx, s.face.calm, s.face.trust, s.face.despair);
            // 启动呼吸循环以让画面持续生动
            animateFace();

            // 追加段落 DOM
            const node = document.createElement('div');
            node.className = 'epilogue-scene';
            const isLast = idx === epilogueScenes.length - 1;
            node.innerHTML =
                '<div class="epilogue-time">' + s.time + '</div>' +
                '<div class="epilogue-text">' + s.text + '</div>' +
                (isLast ? '<div class="epilogue-sign">—— 林夏</div>' : '');
            scenesContainer.appendChild(node);

            idx++;
            setTimeout(playScene, 3200);
        }

        // 略延迟开始，让面板替换有过渡感
        setTimeout(playScene, 250);
    }

    function showEpilogueEnding() {
        // 停止呼吸循环，定格在最后画面
        gameState.ended = true;
        if (faceAnimId) { cancelAnimationFrame(faceAnimId); faceAnimId = null; }

        // 在后续故事末尾追加心理援助卡 + 重新开始按钮
        const epilogueEl = endingPanel.querySelector('.epilogue');
        const tail = document.createElement('div');
        tail.innerHTML =
            '<div class="help-card" style="margin-top:18px;">' +
                '<div class="help-card-title">如果你或身边的人正在经历心理危机，请拨打：</div>' +
                '<div>全国心理援助热线 <span class="help-hotline">400-161-9995</span></div>' +
                '<div>北京心理危机研究与干预中心 <span class="help-hotline">010-82951332</span></div>' +
                '<div>生命热线 <span class="help-hotline">400-821-1215</span></div>' +
            '</div>' +
            '<button class="restart-btn" id="restart-btn">重新开始</button>';
        epilogueEl.appendChild(tail);
        document.getElementById('restart-btn').addEventListener('click', restartGame);
    }

    // ========== 句数指示器 ==========
    function updateDots() {
        const dots = dotsEl.querySelectorAll('.dot');
        const remaining = gameState.maxTurns - gameState.turn;
        remainingEl.textContent = Math.max(0, remaining);
        dots.forEach((dot, i) => {
            if (i < gameState.turn) {
                dot.classList.add('used');
            } else {
                dot.classList.remove('used');
            }
        });
    }

    // ========== 对话选项渲染 ==========
    function renderDialogueOptions() {
        dialogueEl.innerHTML = '';
        if (gameState.ended) { currentDialogueKeys = []; return; }

        // 从 6 类中随机选 4 类（不重复，保证类别多样性）
        const selectedKeys = pickNKeys(dialogueTypes, 4);
        currentDialogueKeys = [];

        selectedKeys.forEach((key, idx) => {
            const type = dialogueTypes[key];
            const line = pickLine(key);
            currentDialogueKeys.push({ key: key, line: line });
            const card = document.createElement('button');
            card.className = 'option-card';
            card.style.setProperty('--type-color', type.color);
            card.innerHTML =
                '<span class="key-hint">' + (idx + 1) + '</span>' +
                '<span class="option-type">' + type.label + '</span>' +
                '<span class="option-text">' + line + '</span>';
            card.addEventListener('click', function () {
                handleSelect(key, line);
            });
            dialogueEl.appendChild(card);
        });
    }

    function handleSelect(type, line) {
        if (gameState.ended || busy) return;
        const typeData = dialogueTypes[type];

        // a) 锁定输入（对话卡 + 行动芯片）
        setBusy(true);

        // b) 添加玩家气泡
        addBubble(line, 'player');

        // c) turn++ 并更新句数指示器
        gameState.turn++;
        updateDots();

        // d) applyEffects
        applyEffects(typeData.effects);

        // e) 延迟 800ms 模拟 NPC 思考
        setTimeout(function () {
            // 获取并添加 NPC 回复气泡
            const reply = getNPCReply(gameState.despair);
            addBubble(reply, 'npc');

            if (gameState.ended) {
                showEnding();
                return;
            }

            // f) 背景故事解锁（信任度跨越阈值时触发，NPC 主动吐露心声）
            const story = checkStories();
            if (story) {
                setTimeout(function () {
                    addBubble({ title: story.title, text: story.text }, 'story');
                    setTimeout(continueAfterReply, 1100);
                }, 600);
            } else {
                continueAfterReply();
            }
        }, 800);
    }

    // 对话回复后的延续流程：随机事件 → 渲染新选项 / 解锁输入
    function continueAfterReply() {
        if (gameState.ended) return;
        // 随机事件：20% 概率，第 2 句之后才触发
        if (gameState.turn >= 2 && Math.random() < 0.2) {
            setTimeout(function () {
                const evt = pickRandom(randomEvents);
                addBubble(evt.text, 'system');
                applyEffects(evt.effects);

                if (gameState.ended) {
                    setTimeout(showEnding, 500);
                    return;
                }
                renderDialogueOptions();
                setBusy(false);
            }, 600);
        } else {
            renderDialogueOptions();
            setBusy(false);
        }
    }

    // ========== 重新开始 ==========
    function restartGame() {
        gameState.calm = 30;
        gameState.trust = 20;
        gameState.despair = 80;
        gameState.turn = 0;
        gameState.ended = false;
        gameState.result = null;
        gameState.usedActions = {};
        gameState.shownStories = {};
        // 清空台词洗牌池，使新一轮台词重新去重
        for (const k in linePools) { delete linePools[k]; }
        displayCalm = 30;
        displayTrust = 20;
        displayDespair = 80;
        sceneMode = 'night';
        busy = false;

        if (faceAnimId) { cancelAnimationFrame(faceAnimId); faceAnimId = null; }

        historyEl.innerHTML = '';
        endingPanel.classList.remove('show');
        endingPanel.innerHTML = '';
        endingBanner.classList.remove('show');
        endingBanner.textContent = '';
        dialogueEl.style.display = '';
        actionsBar.style.display = '';

        updateBars();
        updateDots();
        render();
        renderActions();
        renderDialogueOptions();
    }

    // ========== Canvas 绘制 ==========
    let stars = [];
    let cityLights = [];
    let clouds = [];     // 飘动云朵
    let antennas = [];   // 远处天线/旗杆（摇摆）

    function initData() {
        stars = [];
        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.55,
                alpha: 0.3 + Math.random() * 0.7,
                twk: 0.5 + Math.random() * 2.5,      // 闪烁频率
                phase: Math.random() * Math.PI * 2,   // 闪烁相位
                base: 0.4 + Math.random() * 0.5       // 基础亮度
            });
        }
        cityLights = [];
        for (let i = 0; i < 36; i++) {
            cityLights.push({
                x: Math.random(),
                y: 0.62 + Math.random() * 0.13,
                alpha: 0.3 + Math.random() * 0.3,
                size: 0.8 + Math.random() * 1.4,
                twk: 0.3 + Math.random() * 1.8,       // 闪烁频率
                phase: Math.random() * Math.PI * 2    // 闪烁相位
            });
        }
        // 飘动云朵（3-4 朵，不同高度和速度）
        clouds = [];
        const cloudCount = 4;
        for (let i = 0; i < cloudCount; i++) {
            clouds.push({
                x: Math.random(),                      // 起始水平位置（0-1）
                y: 0.1 + Math.random() * 0.28,         // 高度
                w: 0.15 + Math.random() * 0.12,        // 宽度
                h: 0.018 + Math.random() * 0.012,      // 高度
                speed: 0.005 + Math.random() * 0.01,   // 飘动速度（每帧）
                alpha: 0.35 + Math.random() * 0.25     // 透明度
            });
        }
        // 远处天线/旗杆（2-3 根，带摇摆动画）
        antennas = [];
        antennas.push({ x: 0.12, baseY: 0.82, h: 0.18, sway: 0.012, phase: 0 });
        antennas.push({ x: 0.28, baseY: 0.82, h: 0.14, sway: 0.015, phase: 1.2 });
        antennas.push({ x: 0.78, baseY: 0.82, h: 0.16, sway: 0.01, phase: 2.4 });
    }

    function setupCanvas(canvas) {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        const w = Math.max(1, rect.width);
        const h = Math.max(1, rect.height);
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { width: w, height: h };
    }

    function drawScene(despair) {
        if (despair === undefined) despair = displayDespair;
        const { width: w, height: h } = setupCanvas(sceneCanvas);
        const ctx = sceneCtx;
        ctx.clearRect(0, 0, w, h);

        ctx.save();
        // 仅夜晚模式绝望时抖动
        if (despair > 85 && sceneMode === 'night') {
            ctx.translate((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
        }

        // 天空背景（按场景模式）
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        if (sceneMode === 'sunrise') {
            sky.addColorStop(0, '#2A2440');
            sky.addColorStop(0.42, '#6B4A5A');
            sky.addColorStop(0.72, '#E0A868');
            sky.addColorStop(1, '#F5C896');
        } else if (sceneMode === 'dawn') {
            sky.addColorStop(0, '#3A3F6E');
            sky.addColorStop(0.5, '#7A86B8');
            sky.addColorStop(1, '#C8D2E8');
        } else if (sceneMode === 'day') {
            sky.addColorStop(0, '#5AA0D8');
            sky.addColorStop(0.6, '#9CC8E8');
            sky.addColorStop(1, '#E8F0FA');
        } else if (sceneMode === 'dark') {
            sky.addColorStop(0, '#050608');
            sky.addColorStop(1, '#0A0B10');
        } else {
            sky.addColorStop(0, '#0D1117');
            sky.addColorStop(1, '#1A1B26');
        }
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        // 日出太阳光晕
        if (sceneMode === 'sunrise') {
            const sunY = h * 0.7;
            const sunGlow = ctx.createRadialGradient(w * 0.5, sunY, 5, w * 0.5, sunY, w * 0.55);
            sunGlow.addColorStop(0, 'rgba(255,230,180,0.9)');
            sunGlow.addColorStop(0.3, 'rgba(255,200,140,0.35)');
            sunGlow.addColorStop(1, 'rgba(255,200,140,0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(255,240,210,0.95)';
            ctx.beginPath();
            ctx.arc(w * 0.5, sunY, w * 0.06, 0, Math.PI * 2);
            ctx.fill();
        }
        // 晨光柔和光晕（dawn）
        if (sceneMode === 'dawn') {
            const sunY = h * 0.78;
            const sunGlow = ctx.createRadialGradient(w * 0.5, sunY, 5, w * 0.5, sunY, w * 0.6);
            sunGlow.addColorStop(0, 'rgba(255,245,225,0.7)');
            sunGlow.addColorStop(0.4, 'rgba(220,210,255,0.18)');
            sunGlow.addColorStop(1, 'rgba(220,210,255,0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(0, 0, w, h);
        }
        // 白天太阳（day）
        if (sceneMode === 'day') {
            const sunX = w * 0.78, sunY = h * 0.22;
            const sunGlow = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, w * 0.4);
            sunGlow.addColorStop(0, 'rgba(255,250,230,0.85)');
            sunGlow.addColorStop(0.3, 'rgba(255,245,210,0.25)');
            sunGlow.addColorStop(1, 'rgba(255,245,210,0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(255,252,240,0.95)';
            ctx.beginPath();
            ctx.arc(sunX, sunY, w * 0.05, 0, Math.PI * 2);
            ctx.fill();
            // 云朵由下方统一的飘动云朵逻辑绘制
        }

        // 星星（仅夜晚，闪烁动画）
        if (sceneMode === 'night') {
            const tNow = performance.now() / 1000;
            stars.forEach(s => {
                const tw = 0.5 + 0.5 * Math.sin(tNow * s.twk + s.phase);
                const a = s.base * (0.4 + 0.6 * tw);
                ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
                ctx.fillRect(s.x * w, s.y * h, 1, 1);
                // 亮星额外光晕
                if (s.base > 0.7 && tw > 0.7) {
                    ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.3).toFixed(3) + ')';
                    ctx.fillRect(s.x * w - 1, s.y * h, 1, 1);
                    ctx.fillRect(s.x * w + 1, s.y * h, 1, 1);
                    ctx.fillRect(s.x * w, s.y * h - 1, 1, 1);
                    ctx.fillRect(s.x * w, s.y * h + 1, 1, 1);
                }
            });
        }

        // 远处城市灯光（夜晚与日出，闪烁动画）
        if (sceneMode !== 'dark') {
            const tNow = performance.now() / 1000;
            cityLights.forEach(c => {
                const tw = 0.6 + 0.4 * Math.sin(tNow * c.twk + c.phase);
                const a = c.alpha * tw;
                ctx.fillStyle = 'rgba(224,175,104,' + a.toFixed(3) + ')';
                ctx.beginPath();
                ctx.arc(c.x * w, c.y * h, c.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 飘动云朵（day/dawn/sunrise 模式，从左向右飘动）
        if (sceneMode === 'day' || sceneMode === 'dawn' || sceneMode === 'sunrise') {
            const cloudColor = sceneMode === 'day' ? 'rgba(255,255,255,' :
                               sceneMode === 'dawn' ? 'rgba(230,235,250,' : 'rgba(255,225,200,';
            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > 1.15) c.x = -0.2;  // 飘出右侧后从左侧重新进入
                ctx.fillStyle = cloudColor + c.alpha + ')';
                ctx.beginPath();
                ctx.ellipse(c.x * w, c.y * h, c.w * w, c.h * h, 0, 0, Math.PI * 2);
                ctx.fill();
                // 云朵柔和边缘（稍大的低透明椭圆）
                ctx.fillStyle = cloudColor + (c.alpha * 0.5) + ')';
                ctx.beginPath();
                ctx.ellipse(c.x * w, c.y * h, c.w * w * 1.25, c.h * h * 1.4, 0, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 城市暖光晕
        const glow = ctx.createLinearGradient(0, h * 0.6, 0, h * 0.82);
        glow.addColorStop(0, 'rgba(224,175,104,0)');
        if (sceneMode === 'sunrise') glow.addColorStop(1, 'rgba(255,200,140,0.14)');
        else if (sceneMode === 'dawn') glow.addColorStop(1, 'rgba(200,210,232,0.1)');
        else if (sceneMode === 'day') glow.addColorStop(1, 'rgba(255,250,235,0.12)');
        else glow.addColorStop(1, 'rgba(224,175,104,0.08)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, h * 0.6, w, h * 0.22);

        // 远处天线/旗杆（摇摆动画，城市轮廓的一部分）
        const tNowSway = performance.now() / 1000;
        const antennaColor = (sceneMode === 'day') ? 'rgba(80,90,110,0.85)' :
                             (sceneMode === 'dawn') ? 'rgba(60,65,90,0.85)' :
                             (sceneMode === 'sunrise') ? 'rgba(40,35,50,0.85)' : 'rgba(35,40,55,0.9)';
        ctx.strokeStyle = antennaColor;
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        antennas.forEach(a => {
            const swayAngle = Math.sin(tNowSway * 0.8 + a.phase) * a.sway;
            const baseX = a.x * w;
            const baseY = a.baseY * h;
            const topX = baseX + Math.sin(swayAngle) * a.h * h;
            const topY = baseY - Math.cos(swayAngle) * a.h * h;
            ctx.beginPath();
            ctx.moveTo(baseX, baseY);
            ctx.lineTo(topX, topY);
            ctx.stroke();
            // 顶端小红灯（夜晚闪烁）
            if (sceneMode === 'night' || sceneMode === 'sunrise') {
                const blink = 0.5 + 0.5 * Math.sin(tNowSway * 2 + a.phase);
                ctx.fillStyle = 'rgba(255,80,80,' + (0.6 * blink + 0.2).toFixed(3) + ')';
                ctx.beginPath();
                ctx.arc(topX, topY, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            // 横杆（天线交叉）
            ctx.beginPath();
            ctx.moveTo(topX - 4, topY + a.h * h * 0.15);
            ctx.lineTo(topX + 4, topY + a.h * h * 0.15);
            ctx.stroke();
        });

        // 天台地面
        const groundY = h * 0.82;
        let groundColor;
        if (sceneMode === 'sunrise') groundColor = '#3A3242';
        else if (sceneMode === 'dawn') groundColor = '#4A4E68';
        else if (sceneMode === 'day') groundColor = '#9AA4BE';
        else groundColor = '#24283B';
        ctx.fillStyle = groundColor;
        ctx.fillRect(0, groundY, w, h - groundY);

        // 地面纹理线
        ctx.strokeStyle = 'rgba(46,50,70,0.8)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, groundY + 40);
        ctx.lineTo(w, groundY + 40);
        ctx.stroke();

        // 栏杆
        ctx.strokeStyle = '#2E3246';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, groundY + 6);
        ctx.lineTo(w, groundY + 6);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, groundY + 26);
        ctx.lineTo(w, groundY + 26);
        ctx.stroke();
        const railCount = 5;
        for (let i = 0; i < railCount; i++) {
            const x = (w / (railCount - 1)) * i;
            ctx.beginPath();
            ctx.moveTo(x, groundY);
            ctx.lineTo(x, groundY + 32);
            ctx.stroke();
        }

        // 天台边缘
        ctx.strokeStyle = '#0D1117';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(w * 0.62, groundY);
        ctx.lineTo(w, h);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(192,202,245,0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(w * 0.62, groundY - 1);
        ctx.lineTo(w - 2, h - 2);
        ctx.stroke();

        // NPC 剪影
        drawNPC(ctx, w, h, groundY);

        ctx.restore();

        // 黑暗结局额外压暗
        if (sceneMode === 'dark') {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, w, h);
        }
    }

    function drawNPC(ctx, w, h, groundY) {
        const npcX = w * 0.70;
        const npcColor = '#08090F';
        ctx.fillStyle = npcColor;

        ctx.beginPath();
        ctx.arc(npcX, groundY - 54, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(npcX - 7, groundY - 46);
        ctx.lineTo(npcX + 7, groundY - 46);
        ctx.lineTo(npcX + 8, groundY - 20);
        ctx.lineTo(npcX - 8, groundY - 20);
        ctx.closePath();
        ctx.fill();

        ctx.fillRect(npcX - 12, groundY - 44, 4, 20);
        ctx.fillRect(npcX + 8, groundY - 44, 4, 20);

        ctx.fillRect(npcX - 6, groundY - 20, 4, 20);
        ctx.fillRect(npcX + 2, groundY - 20, 4, 20);

        ctx.strokeStyle = 'rgba(122,162,247,0.28)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(npcX, groundY - 54, 9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(npcX + 7, groundY - 46);
        ctx.lineTo(npcX + 8, groundY - 20);
        ctx.stroke();
    }

    // ========== 面部表情绘制 ==========
    // drawFace(ctx, calm, trust, despair)：柔和自然人面容
    function drawFace(ctx, calm, trust, despair) {
        const { width: w, height: h } = setupCanvas(faceCanvas);
        ctx.clearRect(0, 0, w, h);

        // 柔和背景（按场景模式营造氛围，避免冷酷感）
        let bgBase, bgInner;
        if (sceneMode === 'day') { bgBase = '#A8C8E8'; bgInner = '#D8E8F8'; }
        else if (sceneMode === 'dawn') { bgBase = '#5A6A98'; bgInner = '#9AAAC8'; }
        else if (sceneMode === 'sunrise') { bgBase = '#3A2E40'; bgInner = '#6B4A5A'; }
        else { bgBase = '#151721'; bgInner = '#2C2F44'; }
        ctx.fillStyle = bgBase;
        ctx.fillRect(0, 0, w, h);
        const bg = ctx.createRadialGradient(w / 2, h * 0.42, 8, w / 2, h * 0.5, w * 0.75);
        bg.addColorStop(0, bgInner);
        bg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        // 浮尘粒子（呼吸态氛围光点，缓慢上飘 + 闪烁）
        if (!faceDustInited || faceDust.length === 0) initFaceDust(w, h);
        const tNow = performance.now() / 1000;
        const dustColor = (sceneMode === 'day' || sceneMode === 'dawn')
            ? '255,250,235'    // 白天暖白
            : '220,210,255';   // 夜晚淡紫蓝
        for (let i = 0; i < faceDust.length; i++) {
            const p = faceDust[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; }
            if (p.x < -4) p.x = w + 4;
            if (p.x > w + 4) p.x = -4;
            const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(tNow * p.twk + p.phase));
            ctx.fillStyle = 'rgba(' + dustColor + ',' + (0.18 * tw).toFixed(3) + ')';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        }

        const cx = w / 2;
        const cy = h * 0.46;
        let faceW = w * 0.44;
        let faceH = faceW * 1.25;  // 动漫风略拉长（尖下巴）
        if (faceH > h * 0.66) {    // 收紧 faceH 上限，为长发垂落留空间
            faceH = h * 0.66;
            faceW = faceH / 1.25;
        }
        const rx = faceW / 2;
        const ry = faceH / 2;

        ctx.save();
        // 呼吸偏移（基于 performance.now 的微妙垂直起伏，幅度克制）
        const breath = Math.sin(performance.now() / 1000 * 1.4) * 1.4;
        ctx.translate(0, breath);
        // 抖动（despair > 85，幅度更小更克制）
        if (despair > 85) {
            ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
        }
        // 头部偏转（trust < 30 偏转 12°）
        const headRot = trust < 30 ? -12 * Math.PI / 180 : 0;
        ctx.translate(cx, cy);
        ctx.rotate(headRot);

        // 分层绘制：头发后景 → 脖子 → 耳朵 → 脸型 → 头发前景 → 帽子 → 五官
        drawHairBack(ctx, rx, ry);
        drawNeck(ctx, rx, ry);
        drawEars(ctx, rx, ry);
        drawFaceShape(ctx, rx, ry);
        drawHairFront(ctx, rx, ry);

        // 五官坐标（动漫风比例：眼略大略低、鼻嘴略小、眼距略近）
        const eyeDX = rx * 0.42;
        const eyeY = -ry * 0.02;
        const eyeW = rx * 0.30;             // 动漫大眼
        const baseEyeH = ry * 0.14;
        const eyeH = despair > 70 ? baseEyeH * 0.45 : baseEyeH; // despair>70 半闭
        const browY = -ry * 0.28;
        const browW = eyeW * 1.18;
        const noseTipY = ry * 0.24;
        const mouthY = ry * 0.48;
        const mouthW = rx * 0.36;           // 动漫小嘴

        // 面部光影细节（颧骨/额头高光、眼下周影、鼻梁侧影）—— 位于皮肤之上、五官之下
        drawFaceLighting(ctx, rx, ry, eyeDX, eyeY, despair);

        // 帽子在光影之后绘制，避免额头高光画在帽子上
        drawHat(ctx, rx, ry);

        drawBrows(ctx, calm, eyeDX, browY, browW);
        drawEyes(ctx, despair, trust, eyeDX, eyeY, eyeW, eyeH);
        drawNose(ctx, rx, ry, noseTipY, despair);

        // 泪痕（despair > 65）
        if (despair > 65) {
            const tearLen = (despair - 65) * 1.9;
            ctx.strokeStyle = 'rgba(150,180,230,0.55)';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-eyeDX + eyeW * 0.1, eyeY + eyeH * 0.5);
            ctx.lineTo(-eyeDX + eyeW * 0.1, eyeY + eyeH * 0.5 + tearLen);
            ctx.moveTo(eyeDX - eyeW * 0.1, eyeY + eyeH * 0.5);
            ctx.lineTo(eyeDX - eyeW * 0.1, eyeY + eyeH * 0.5 + tearLen);
            ctx.stroke();
        }

        // 脸颊红晕（calm > 55，自然血色）
        if (calm > 55) {
            const blushAlpha = Math.min(0.22, (calm - 55) / 100 * 0.45);
            ctx.fillStyle = 'rgba(240,150,140,' + blushAlpha + ')';
            ctx.beginPath();
            ctx.ellipse(-eyeDX * 0.95, ry * 0.15, rx * 0.14, ry * 0.08, 0, 0, Math.PI * 2);
            ctx.ellipse(eyeDX * 0.95, ry * 0.15, rx * 0.14, ry * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        drawMouth(ctx, calm, mouthY, mouthW, ry);

        ctx.restore();

        // 绝望雾气（despair > 70：暗色雾气从画面底部缓慢上涌）
        if (despair > 70) {
            const fogAlpha = Math.min(0.32, (despair - 70) / 30 * 0.32);
            const fogShift = (performance.now() / 1000 * 6) % h;
            const fog = ctx.createLinearGradient(0, h + 20 - fogShift * 0.3, 0, h * 0.55);
            fog.addColorStop(0, 'rgba(30,32,46,' + fogAlpha + ')');
            fog.addColorStop(1, 'rgba(30,32,46,0)');
            ctx.fillStyle = fog;
            ctx.fillRect(0, 0, w, h);
        }

        // 灰冷滤镜（despair > 80，更克制）
        if (despair > 80) {
            const alpha = (despair - 80) / 100 * 0.22;
            ctx.fillStyle = 'rgba(70,72,88,' + alpha + ')';
            ctx.fillRect(0, 0, w, h);
        }
        // 温暖光晕（calm > 80 且 trust > 70）
        if (calm > 80 && trust > 70) {
            const glow = ctx.createRadialGradient(cx, cy, faceW * 0.3, cx, cy, faceW * 0.95);
            glow.addColorStop(0, 'rgba(255,210,150,0.18)');
            glow.addColorStop(1, 'rgba(255,210,150,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, w, h);
        }

        // 增强暗角（径向，四角压暗聚焦面容；白天强度更弱）
        const vigAlpha = (sceneMode === 'day') ? 0.28 : (sceneMode === 'dawn' ? 0.38 : 0.55);
        const vig = ctx.createRadialGradient(w / 2, h * 0.5, w * 0.28, w / 2, h * 0.5, w * 0.72);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,' + vigAlpha + ')');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, w, h);
    }

    // 眉毛：柔和弧形，根据 calm 调整
    function drawBrows(ctx, calm, eyeDX, browY, browW) {
        // 动漫风柔和细长色块眉：高冷纤细，冷棕色调配合冷白肌肤与长发
        const halfW = browW / 2;
        let angleDeg;
        if (calm > 60) angleDeg = -3;        // 平缓（高冷淡定）
        else if (calm >= 30) angleDeg = 7;   // 略垂
        else angleDeg = -15;                  // 皱眉
        const rise = browW * Math.tan(angleDeg * Math.PI / 180);
        const innerDY = -rise / 2;
        const outerDY = rise / 2;
        const browH = browW * 0.11;           // 更纤细，动漫感

        // 左眉（柔和色块，眉头淡眉尾浓）
        const browGradL = ctx.createLinearGradient(-eyeDX - halfW, browY, -eyeDX + halfW, browY);
        browGradL.addColorStop(0, 'rgba(70,55,60,0.45)');
        browGradL.addColorStop(0.4, 'rgba(60,48,52,0.85)');
        browGradL.addColorStop(1, 'rgba(50,40,44,0.95)');
        ctx.fillStyle = browGradL;
        ctx.beginPath();
        ctx.moveTo(-eyeDX - halfW, browY + outerDY);
        ctx.quadraticCurveTo(-eyeDX, browY + innerDY + browH * 0.3, -eyeDX + halfW, browY + innerDY);
        ctx.lineTo(-eyeDX + halfW * 0.85, browY + innerDY + browH);
        ctx.quadraticCurveTo(-eyeDX, browY + innerDY + browH * 0.7, -eyeDX - halfW * 0.82, browY + outerDY + browH);
        ctx.closePath();
        ctx.fill();
        // 右眉
        const browGradR = ctx.createLinearGradient(eyeDX + halfW, browY, eyeDX - halfW, browY);
        browGradR.addColorStop(0, 'rgba(70,55,60,0.45)');
        browGradR.addColorStop(0.4, 'rgba(60,48,52,0.85)');
        browGradR.addColorStop(1, 'rgba(50,40,44,0.95)');
        ctx.fillStyle = browGradR;
        ctx.beginPath();
        ctx.moveTo(eyeDX + halfW, browY + outerDY);
        ctx.quadraticCurveTo(eyeDX, browY + innerDY + browH * 0.3, eyeDX - halfW, browY + innerDY);
        ctx.lineTo(eyeDX - halfW * 0.85, browY + innerDY + browH);
        ctx.quadraticCurveTo(eyeDX, browY + innerDY + browH * 0.7, eyeDX + halfW * 0.82, browY + outerDY + browH);
        ctx.closePath();
        ctx.fill();
    }

    // 眼睛：半写实动漫大眼，冷色调虹膜 + 星形高光 + 粗上眼线（高冷气质）
    function drawEyes(ctx, despair, trust, eyeDX, eyeY, eyeW, eyeH) {
        const halfW = eyeW / 2;
        const halfH = eyeH / 2;

        // 瞳孔偏移（trust < 30 朝侧面看，回避对视）
        let pupilOffX = 0;
        if (trust < 30) pupilOffX = eyeW * 0.18;
        else if (trust <= 60) pupilOffX = eyeW * 0.05;

        function drawOneEye(x, sign) {
            // —— 眼眶 clip（杏仁形，略细长显高冷）——
            ctx.save();
            ctx.beginPath();
            // 上睑：外眼角→内眼角（外眼角略上挑，高冷感）
            ctx.moveTo(x + sign * halfW, eyeY - halfH * 0.15);
            ctx.quadraticCurveTo(x + sign * halfW * 0.3, eyeY - halfH * 1.15, x - sign * halfW * 0.15, eyeY - halfH * 0.35);
            ctx.quadraticCurveTo(x - sign * halfW * 0.5, eyeY, x - sign * halfW * 0.65, eyeY + halfH * 0.25);
            // 下睑：内眼角→外眼角
            ctx.quadraticCurveTo(x - sign * halfW * 0.2, eyeY + halfH * 0.95, x + sign * halfW * 0.55, eyeY + halfH * 0.45);
            ctx.quadraticCurveTo(x + sign * halfW * 0.95, eyeY + halfH * 0.15, x + sign * halfW, eyeY - halfH * 0.15);
            ctx.closePath();
            ctx.clip();

            // —— 眼白（冷灰白，非暖黄）——
            const sclera = ctx.createRadialGradient(x, eyeY, 1, x, eyeY, halfW * 1.1);
            sclera.addColorStop(0, '#F8F4F0');
            sclera.addColorStop(0.7, '#E8E0DC');
            sclera.addColorStop(1, '#C8BCBC');
            ctx.fillStyle = sclera;
            ctx.fillRect(x - halfW * 1.2, eyeY - halfH * 1.3, halfW * 2.4, halfH * 2.6);
            // 眼眶内侧阴影（上下边缘）
            ctx.fillStyle = 'rgba(150,120,128,0.15)';
            ctx.fillRect(x - halfW * 1.2, eyeY - halfH * 1.3, halfW * 2.4, halfH * 0.5);
            ctx.fillRect(x - halfW * 1.2, eyeY + halfH * 0.5, halfW * 2.4, halfH * 0.5);

            // —— 虹膜（动漫大虹膜，直径≈眼宽 0.7）——
            const irisR = Math.min(eyeW, eyeH) * 0.62;
            const ix = x + pupilOffX;
            const iy = eyeY + halfH * 0.1;

            // 虹膜外圈（冷色调：深蓝紫/冷灰，按 despair 切换）
            const irisOuter = despair < 45 ? '#3A4A6E' : '#2A2E3E';
            ctx.fillStyle = irisOuter;
            ctx.beginPath();
            ctx.arc(ix, iy, irisR, 0, Math.PI * 2);
            ctx.fill();

            // 虹膜主色渐变（顶部深→底部亮，动漫标志性）
            const irisGrad = ctx.createRadialGradient(ix, iy - irisR * 0.2, irisR * 0.1, ix, iy + irisR * 0.3, irisR * 1.1);
            if (despair < 45) {
                irisGrad.addColorStop(0, '#6A82B0');
                irisGrad.addColorStop(0.5, '#4A5E88');
                irisGrad.addColorStop(1, '#2A3858');
            } else {
                irisGrad.addColorStop(0, '#4A5070');
                irisGrad.addColorStop(0.5, '#3A3E58');
                irisGrad.addColorStop(1, '#22263A');
            }
            ctx.fillStyle = irisGrad;
            ctx.beginPath();
            ctx.arc(ix, iy, irisR * 0.96, 0, Math.PI * 2);
            ctx.fill();

            // 虹膜放射纹理（柔和，动漫风少量线条）
            ctx.strokeStyle = despair < 45 ? 'rgba(90,110,150,0.4)' : 'rgba(60,65,90,0.35)';
            ctx.lineWidth = 0.6;
            const striations = 16;
            for (let i = 0; i < striations; i++) {
                const ang = (i / striations) * Math.PI * 2 + 0.1;
                const r1 = irisR * 0.5;
                const r2 = irisR * 0.92;
                ctx.beginPath();
                ctx.moveTo(ix + Math.cos(ang) * r1, iy + Math.sin(ang) * r1);
                ctx.lineTo(ix + Math.cos(ang) * r2, iy + Math.sin(ang) * r2);
                ctx.stroke();
            }

            // 虹膜外缘深色环（limbal ring，增加深邃感）
            const limbal = ctx.createRadialGradient(ix, iy, irisR * 0.88, ix, iy, irisR * 1.0);
            limbal.addColorStop(0, 'rgba(0,0,0,0)');
            limbal.addColorStop(0.7, 'rgba(20,20,30,0.5)');
            limbal.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = limbal;
            ctx.beginPath();
            ctx.arc(ix, iy, irisR, 0, Math.PI * 2);
            ctx.fill();

            // 瞳孔（大而深，动漫风）
            const pupilR = irisR * 0.48;
            const pupil = ctx.createRadialGradient(ix, iy, pupilR * 0.2, ix, iy, pupilR);
            pupil.addColorStop(0, '#0A0A14');
            pupil.addColorStop(0.8, '#161828');
            pupil.addColorStop(1, 'rgba(30,32,48,0.5)');
            ctx.fillStyle = pupil;
            ctx.beginPath();
            ctx.arc(ix, iy, pupilR, 0, Math.PI * 2);
            ctx.fill();

            // —— 星形主高光（动漫标志性，四角星形）——
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.beginPath();
            const hx = ix - irisR * 0.32, hy = iy - irisR * 0.32;
            const hR = irisR * 0.28;
            // 四角星形（水平垂直长，对角短）
            ctx.moveTo(hx, hy - hR);
            ctx.quadraticCurveTo(hx + hR * 0.25, hy - hR * 0.25, hx + hR, hy);
            ctx.quadraticCurveTo(hx + hR * 0.25, hy + hR * 0.25, hx, hy + hR);
            ctx.quadraticCurveTo(hx - hR * 0.25, hy + hR * 0.25, hx - hR, hy);
            ctx.quadraticCurveTo(hx - hR * 0.25, hy - hR * 0.25, hx, hy - hR);
            ctx.closePath();
            ctx.fill();

            // 副高光（右下小圆点）
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath();
            ctx.arc(ix + irisR * 0.3, iy + irisR * 0.35, irisR * 0.1, 0, Math.PI * 2);
            ctx.fill();

            // 底部弧形高光（虹膜底部亮带，动漫常见）
            ctx.fillStyle = 'rgba(180,200,230,0.25)';
            ctx.beginPath();
            ctx.ellipse(ix, iy + irisR * 0.55, irisR * 0.6, irisR * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // —— 上眼线（动漫粗线，清晰锐利）——
            ctx.strokeStyle = 'rgba(30,25,35,0.9)';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x + sign * halfW * 0.98, eyeY - halfH * 0.1);
            ctx.quadraticCurveTo(x + sign * halfW * 0.25, eyeY - halfH * 1.1, x - sign * halfW * 0.15, eyeY - halfH * 0.3);
            ctx.quadraticCurveTo(x - sign * halfW * 0.5, eyeY, x - sign * halfW * 0.65, eyeY + halfH * 0.25);
            ctx.stroke();

            // 外眼角上挑线（高冷感，外眼角向外延伸）
            ctx.strokeStyle = 'rgba(30,25,35,0.7)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(x + sign * halfW * 0.98, eyeY - halfH * 0.1);
            ctx.lineTo(x + sign * halfW * 1.35, eyeY - halfH * 0.4);
            ctx.stroke();

            // —— 双眼皮折痕（清晰弧线）——
            ctx.strokeStyle = 'rgba(140,110,120,0.4)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(x + sign * halfW * 0.7, eyeY - halfH * 0.95);
            ctx.quadraticCurveTo(x + sign * halfW * 0.1, eyeY - halfH * 1.7, x - sign * halfW * 0.3, eyeY - halfH * 0.65);
            ctx.stroke();

            // —— 卧蚕（眼下柔和高光；despair 高时变眼袋阴影）——
            if (despair > 60) {
                ctx.fillStyle = 'rgba(120,90,100,0.22)';
                ctx.beginPath();
                ctx.ellipse(x, eyeY + halfH * 1.0, halfW * 0.7, halfH * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = 'rgba(255,240,235,0.2)';
                ctx.beginPath();
                ctx.ellipse(x, eyeY + halfH * 0.85, halfW * 0.65, halfH * 0.22, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // —— 下眼睑线（细而柔和）——
            ctx.strokeStyle = 'rgba(140,110,120,0.35)';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(x - sign * halfW * 0.6, eyeY + halfH * 0.3);
            ctx.quadraticCurveTo(x - sign * halfW * 0.15, eyeY + halfH * 0.95, x + sign * halfW * 0.5, eyeY + halfH * 0.45);
            ctx.stroke();

            // —— 上睫毛（动漫风，外侧几根加长睫毛）——
            ctx.strokeStyle = 'rgba(30,25,35,0.85)';
            ctx.lineWidth = 1;
            ctx.lineCap = 'round';
            // 外眼角 3 根加长睫毛
            for (let i = 0; i < 3; i++) {
                const t = 0.7 + i * 0.12;
                const baseX = x + sign * halfW * (0.95 - (t - 0.7) * 1.5);
                const baseY = eyeY - halfH * (0.7 - (t - 0.7) * 1.2);
                const len = halfH * (1.0 + i * 0.2);
                ctx.beginPath();
                ctx.moveTo(baseX, baseY);
                ctx.quadraticCurveTo(baseX + sign * len * 0.3, baseY - len * 0.5, baseX + sign * len * 0.6, baseY - len);
                ctx.stroke();
            }
        }

        drawOneEye(-eyeDX, -1);
        drawOneEye(eyeDX, 1);
    }

    // 嘴巴：动漫小而精致粉唇，渐变 + 唇缝 + 下唇高光（高冷轻抿感）
    function drawMouth(ctx, calm, mouthY, mouthW, ry) {
        const halfW = mouthW / 2;
        let endDY, lipCurve;
        if (calm > 60) {
            endDY = -halfW * 0.2;        // 嘴角微扬
            lipCurve = halfW * 0.08;
        } else if (calm >= 30) {
            endDY = halfW * 0.05;        // 平直
            lipCurve = halfW * 0.04;
        } else {
            endDY = halfW * 0.28;        // 嘴角下垂
            lipCurve = halfW * 0.14;
        }

        // 嘴唇渐变（冷粉红，高冷气质）
        const lipGrad = ctx.createLinearGradient(0, mouthY - halfW * 0.18, 0, mouthY + halfW * 0.18);
        lipGrad.addColorStop(0, '#D88A88');
        lipGrad.addColorStop(0.5, '#C06A68');
        lipGrad.addColorStop(1, '#A85856');
        ctx.fillStyle = lipGrad;
        ctx.beginPath();
        ctx.moveTo(-halfW, mouthY + endDY);
        // 上唇（简洁弧线，无唇珠细节）
        ctx.quadraticCurveTo(-halfW * 0.35, mouthY - lipCurve - halfW * 0.08, 0, mouthY - lipCurve - halfW * 0.04);
        ctx.quadraticCurveTo(halfW * 0.35, mouthY - lipCurve - halfW * 0.08, halfW, mouthY + endDY);
        // 下唇（饱满弧形）
        ctx.quadraticCurveTo(halfW * 0.4, mouthY + lipCurve + halfW * 0.14, 0, mouthY + lipCurve + halfW * 0.16);
        ctx.quadraticCurveTo(-halfW * 0.4, mouthY + lipCurve + halfW * 0.14, -halfW, mouthY + endDY);
        ctx.closePath();
        ctx.fill();

        // 唇线（冷粉灰，清晰边缘）
        ctx.strokeStyle = 'rgba(120,70,72,0.4)';
        ctx.lineWidth = 0.8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-halfW, mouthY + endDY);
        ctx.quadraticCurveTo(-halfW * 0.35, mouthY - lipCurve - halfW * 0.08, 0, mouthY - lipCurve - halfW * 0.04);
        ctx.quadraticCurveTo(halfW * 0.35, mouthY - lipCurve - halfW * 0.08, halfW, mouthY + endDY);
        ctx.stroke();

        // 唇缝（口裂线）
        ctx.strokeStyle = 'rgba(90,45,48,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-halfW, mouthY + endDY);
        ctx.quadraticCurveTo(-halfW * 0.35, mouthY + lipCurve * 0.1, 0, mouthY);
        ctx.quadraticCurveTo(halfW * 0.35, mouthY + lipCurve * 0.1, halfW, mouthY + endDY);
        ctx.stroke();

        // 下唇高光（动漫标志性亮点，湿润感）
        ctx.fillStyle = 'rgba(255,230,228,0.35)';
        ctx.beginPath();
        ctx.ellipse(-halfW * 0.1, mouthY + lipCurve * 0.6 + halfW * 0.06, halfW * 0.28, halfW * 0.05, 0, 0, Math.PI * 2);
        ctx.fill();

        // 上唇中央微高光
        ctx.fillStyle = 'rgba(255,200,198,0.18)';
        ctx.beginPath();
        ctx.ellipse(0, mouthY - lipCurve - halfW * 0.02, halfW * 0.08, halfW * 0.02, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // 头发后景：卷发风格，完整底色防秃 + 波浪卷发束 + 高光束
    function drawHairBack(ctx, rx, ry) {
        // === 1. 完整底色（不内凹，覆盖整个头部+脖子+肩部，确保无秃）===
        const hairGrad = ctx.createLinearGradient(0, -ry, 0, ry * 1.55);
        hairGrad.addColorStop(0, '#2A2228');    // 顶部深冷棕
        hairGrad.addColorStop(0.45, '#1E1820'); // 中段深色
        hairGrad.addColorStop(1, '#15101A');    // 发尾最暗
        ctx.fillStyle = hairGrad;
        ctx.beginPath();
        // 头顶弧（从左到右）
        ctx.moveTo(-rx * 1.2, -ry * 0.1);
        ctx.bezierCurveTo(-rx * 1.3, -ry * 1.05, rx * 1.3, -ry * 1.05, rx * 1.2, -ry * 0.1);
        // 右侧长发垂落（外侧轮廓，延伸至肩下）
        ctx.bezierCurveTo(rx * 1.42, ry * 0.35, rx * 1.3, ry * 1.0, rx * 1.1, ry * 1.5);
        // 底部横跨（不内凹，直接连到左侧，确保脖子两侧有底色覆盖）
        ctx.bezierCurveTo(rx * 0.5, ry * 1.55, -rx * 0.5, ry * 1.55, -rx * 1.1, ry * 1.5);
        // 左侧长发垂落（回到起点）
        ctx.bezierCurveTo(-rx * 1.3, ry * 1.0, -rx * 1.42, ry * 0.35, -rx * 1.2, -ry * 0.1);
        ctx.closePath();
        ctx.fill();

        // 颈后 V 形阴影（模拟头发在脖子后方的层次感，但不创造缺口）
        ctx.fillStyle = 'rgba(10,8,14,0.4)';
        ctx.beginPath();
        ctx.moveTo(-rx * 0.4, ry * 0.6);
        ctx.quadraticCurveTo(0, ry * 1.3, rx * 0.4, ry * 0.6);
        ctx.quadraticCurveTo(0, ry * 0.9, -rx * 0.4, ry * 0.6);
        ctx.closePath();
        ctx.fill();

        // === 2. 卷发发束（波浪曲线，左右各 3 束，发尾外翘卷曲）===
        ctx.fillStyle = '#241C24';
        // 卷发束绘制函数：从顶部起点垂落，波浪曲线 + 末端外翘
        function drawCurlStrand(startX, startY, endX, endY, curlDir, width) {
            ctx.beginPath();
            ctx.moveTo(startX - width, startY);
            // 外侧波浪（向下垂落，3 个波峰）
            const midY1 = startY + (endY - startY) * 0.35;
            const midY2 = startY + (endY - startY) * 0.7;
            ctx.bezierCurveTo(
                startX - width + curlDir * 8, midY1,
                startX - width - curlDir * 6, midY1 + (endY - startY) * 0.1,
                startX - width * 0.6 + curlDir * 10, midY2
            );
            // 发尾外翘卷曲
            ctx.bezierCurveTo(
                startX + curlDir * 14, midY2 + (endY - startY) * 0.15,
                endX + curlDir * 18, endY - 4,
                endX + curlDir * 22, endY
            );
            // 内侧回弹（卷曲内侧弧）
            ctx.bezierCurveTo(
                endX + curlDir * 10, endY + 6,
                endX + curlDir * 2, endY - 2,
                endX, endY - 8
            );
            // 内侧波浪向上
            ctx.bezierCurveTo(
                startX + width * 0.4 + curlDir * 4, midY2,
                startX + width - curlDir * 4, midY1,
                startX + width, startY
            );
            ctx.closePath();
            ctx.fill();
        }

        // 左侧 3 束卷发（curlDir = -1，向左外翘）
        drawCurlStrand(-rx * 1.0, -ry * 0.1, -rx * 0.95, ry * 1.35, -1, rx * 0.18);
        drawCurlStrand(-rx * 0.78, ry * 0.05, -rx * 0.6, ry * 1.3, -1, rx * 0.15);
        drawCurlStrand(-rx * 0.55, ry * 0.15, -rx * 0.42, ry * 1.15, -1, rx * 0.12);
        // 右侧 3 束卷发（curlDir = 1，向右外翘）
        drawCurlStrand(rx * 1.0, -ry * 0.1, rx * 0.95, ry * 1.35, 1, rx * 0.18);
        drawCurlStrand(rx * 0.78, ry * 0.05, rx * 0.6, ry * 1.3, 1, rx * 0.15);
        drawCurlStrand(rx * 0.55, ry * 0.15, rx * 0.42, ry * 1.15, 1, rx * 0.12);

        // === 3. 卷发高光发束（波浪曲线，冷紫色）===
        ctx.strokeStyle = 'rgba(120,98,140,0.55)';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        // 左侧高光波浪线
        ctx.beginPath();
        ctx.moveTo(-rx * 0.78, -ry * 0.7);
        ctx.bezierCurveTo(-rx * 0.85, -ry * 0.3, -rx * 0.7, ry * 0.1, -rx * 0.8, ry * 0.5);
        ctx.bezierCurveTo(-rx * 0.9, ry * 0.8, -rx * 0.7, ry * 1.0, -rx * 0.85, ry * 1.25);
        ctx.stroke();
        // 右侧高光波浪线
        ctx.beginPath();
        ctx.moveTo(rx * 0.78, -ry * 0.7);
        ctx.bezierCurveTo(rx * 0.85, -ry * 0.3, rx * 0.7, ry * 0.1, rx * 0.8, ry * 0.5);
        ctx.bezierCurveTo(rx * 0.9, ry * 0.8, rx * 0.7, ry * 1.0, rx * 0.85, ry * 1.25);
        ctx.stroke();
        // 顶部高光波浪（横向）
        ctx.strokeStyle = 'rgba(100,82,120,0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-rx * 0.6, -ry * 0.85);
        ctx.bezierCurveTo(-rx * 0.2, -ry * 0.98, rx * 0.2, -ry * 0.98, rx * 0.6, -ry * 0.85);
        ctx.stroke();
    }

    // 脖子（暖肤色，柔投影）
    function drawNeck(ctx, rx, ry) {
        // 动漫风脖子：冷白透粉肤色，平滑渐变
        const neckGrad = ctx.createLinearGradient(0, ry * 0.7, 0, ry * 1.3);
        neckGrad.addColorStop(0, '#E8C8C4');   // 接近下颌肤色
        neckGrad.addColorStop(1, '#C8A4A4');   // 颈部稍暗
        ctx.fillStyle = neckGrad;
        ctx.beginPath();
        ctx.moveTo(-rx * 0.3, ry * 0.78);
        ctx.lineTo(-rx * 0.36, ry * 1.3);
        ctx.lineTo(rx * 0.36, ry * 1.3);
        ctx.lineTo(rx * 0.3, ry * 0.78);
        ctx.closePath();
        ctx.fill();
        // 下巴柔影（冷粉灰）
        ctx.fillStyle = 'rgba(155,118,122,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, ry * 0.82, rx * 0.32, ry * 0.06, 0, 0, Math.PI * 2);
        ctx.fill();
        // 胸锁乳突肌暗示（动漫风单侧线条）
        ctx.strokeStyle = 'rgba(155,118,122,0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-rx * 0.18, ry * 0.95);
        ctx.quadraticCurveTo(-rx * 0.28, ry * 1.15, -rx * 0.33, ry * 1.3);
        ctx.moveTo(rx * 0.18, ry * 0.95);
        ctx.quadraticCurveTo(rx * 0.28, ry * 1.15, rx * 0.33, ry * 1.3);
        ctx.stroke();
    }

    // 耳朵：动漫风简化，冷白肤色 + 内耳阴影
    function drawEars(ctx, rx, ry) {
        ctx.fillStyle = '#E8C8C4';
        ctx.beginPath();
        ctx.ellipse(-rx * 0.98, ry * 0.05, rx * 0.1, ry * 0.16, -0.2, 0, Math.PI * 2);
        ctx.ellipse(rx * 0.98, ry * 0.05, rx * 0.1, ry * 0.16, 0.2, 0, Math.PI * 2);
        ctx.fill();
        // 耳廓阴影（冷粉灰）
        ctx.fillStyle = 'rgba(155,118,122,0.3)';
        ctx.beginPath();
        ctx.ellipse(-rx * 0.98, ry * 0.08, rx * 0.05, ry * 0.09, -0.2, 0, Math.PI * 2);
        ctx.ellipse(rx * 0.98, ry * 0.08, rx * 0.05, ry * 0.09, 0.2, 0, Math.PI * 2);
        ctx.fill();
    }

    // 脸型：半写实动漫鹅蛋脸（尖下巴），冷白透粉平滑肌肤，无纹理噪点
    function drawFaceShape(ctx, rx, ry) {
        function facePath() {
            ctx.beginPath();
            ctx.moveTo(-rx, -ry * 0.05);
            ctx.bezierCurveTo(-rx, -ry * 0.8, -rx * 0.5, -ry, 0, -ry);
            ctx.bezierCurveTo(rx * 0.5, -ry, rx, -ry * 0.8, rx, -ry * 0.05);
            // 动漫风：下巴略尖（收窄收尖）
            ctx.bezierCurveTo(rx * 0.92, ry * 0.68, rx * 0.38, ry * 1.02, 0, ry * 1.02);
            ctx.bezierCurveTo(-rx * 0.38, ry * 1.02, -rx * 0.92, ry * 0.68, -rx, -ry * 0.05);
            ctx.closePath();
        }

        // 基础肤色：冷白透粉（高冷气质），极平滑径向渐变
        const skin = ctx.createRadialGradient(-rx * 0.25, -ry * 0.35, rx * 0.1, 0, ry * 0.1, rx * 1.35);
        skin.addColorStop(0, '#FBF2F0');   // 高光冷白
        skin.addColorStop(0.45, '#F2DCDC'); // 透粉
        skin.addColorStop(0.85, '#E0C0BE'); // 柔粉灰
        skin.addColorStop(1, '#C8A4A4');    // 边缘暗粉
        ctx.fillStyle = skin;
        facePath();
        ctx.fill();

        // 方向性光影（左上光源）—— 动漫风柔和但清晰
        ctx.save();
        facePath();
        ctx.clip();
        // 左上高光（冷白提亮）
        const hi = ctx.createLinearGradient(-rx, -ry, rx * 0.4, ry * 0.6);
        hi.addColorStop(0, 'rgba(255,250,248,0.38)');
        hi.addColorStop(0.55, 'rgba(255,250,248,0)');
        ctx.fillStyle = hi;
        ctx.fillRect(-rx * 1.2, -ry * 1.2, rx * 2.4, ry * 2.4);
        // 右下阴影（冷粉灰，非暖棕）
        const sh = ctx.createLinearGradient(-rx * 0.3, -ry * 0.3, rx, ry);
        sh.addColorStop(0.45, 'rgba(150,120,128,0)');
        sh.addColorStop(1, 'rgba(150,120,128,0.22)');
        ctx.fillStyle = sh;
        ctx.fillRect(-rx * 1.2, -ry * 1.2, rx * 2.4, ry * 2.4);

        // 脸颊红晕（动漫标志性柔粉，两侧）
        const blush = ctx.createRadialGradient(-rx * 0.45, ry * 0.2, 2, -rx * 0.45, ry * 0.2, rx * 0.28);
        blush.addColorStop(0, 'rgba(255,170,175,0.28)');
        blush.addColorStop(1, 'rgba(255,170,175,0)');
        ctx.fillStyle = blush;
        ctx.fillRect(-rx * 1.2, -ry * 1.2, rx * 2.4, ry * 2.4);
        const blush2 = ctx.createRadialGradient(rx * 0.45, ry * 0.2, 2, rx * 0.45, ry * 0.2, rx * 0.28);
        blush2.addColorStop(0, 'rgba(255,170,175,0.22)');
        blush2.addColorStop(1, 'rgba(255,170,175,0)');
        ctx.fillStyle = blush2;
        ctx.fillRect(-rx * 1.2, -ry * 1.2, rx * 2.4, ry * 2.4);
        ctx.restore();

        // 轻微夜间氛围（保留肤色感）
        ctx.fillStyle = 'rgba(30,32,48,0.12)';
        facePath();
        ctx.fill();

        // 太阳穴/下颌轮廓阴影（柔和，保留立体感）
        ctx.fillStyle = 'rgba(160,125,130,0.14)';
        ctx.beginPath();
        ctx.ellipse(-rx * 0.78, ry * 0.08, rx * 0.14, ry * 0.32, 0.1, 0, Math.PI * 2);
        ctx.ellipse(rx * 0.78, ry * 0.12, rx * 0.14, ry * 0.32, -0.1, 0, Math.PI * 2);
        ctx.fill();
        // 下颌阴影（尖下巴立体感）
        ctx.fillStyle = 'rgba(155,118,122,0.16)';
        ctx.beginPath();
        ctx.ellipse(0, ry * 0.88, rx * 0.38, ry * 0.1, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // 帽子：斜戴贝雷帽（纯色简洁款，遮头顶）
    function drawHat(ctx, rx, ry) {
        ctx.save();
        // 帽身整体向右斜戴（左侧上翘露出刘海，右侧下垂）
        ctx.translate(rx * 0.05, -ry * 0.82);
        ctx.rotate(-8 * Math.PI / 180);

        // 帽身主体（纯色椭圆，覆盖头顶，无高光）
        const hatW = rx * 1.15;
        const hatH = ry * 0.52;
        ctx.fillStyle = '#3A2A35';   // 纯色深灰紫，高冷配色
        ctx.beginPath();
        ctx.ellipse(0, 0, hatW, hatH, 0, 0, Math.PI * 2);
        ctx.fill();

        // 帽身底部分隔线（与帽边的衔接，细线暗示结构）
        ctx.strokeStyle = 'rgba(20,12,18,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0, hatH * 0.5, hatW * 0.9, hatH * 0.28, 0, 0.1, Math.PI - 0.1);
        ctx.stroke();

        ctx.restore();

        // 帽边（纯色窄带，压在刘海上方，不旋转）
        ctx.fillStyle = '#2E2230';
        ctx.beginPath();
        ctx.ellipse(rx * 0.02, -ry * 0.46, rx * 1.06, ry * 0.09, -4 * Math.PI / 180, 0, Math.PI * 2);
        ctx.fill();

        // 帽边下沿投影（压在刘海上的柔和阴影）
        ctx.fillStyle = 'rgba(10,6,10,0.3)';
        ctx.beginPath();
        ctx.ellipse(rx * 0.02, -ry * 0.4, rx * 1.02, ry * 0.035, -4 * Math.PI / 180, 0, Math.PI * 2);
        ctx.fill();
    }

    // 面部光影细节：颧骨/额头高光、眼下周影（动漫风冷色调）
    function drawFaceLighting(ctx, rx, ry, eyeDX, eyeY, despair) {
        // 颧骨高光（左上光源，冷白色，左侧更亮）
        ctx.fillStyle = 'rgba(255,250,248,0.18)';
        ctx.beginPath();
        ctx.ellipse(-eyeDX * 0.9, ry * 0.12, rx * 0.18, ry * 0.1, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,250,248,0.11)';
        ctx.beginPath();
        ctx.ellipse(eyeDX * 0.9, ry * 0.14, rx * 0.16, ry * 0.09, 0.2, 0, Math.PI * 2);
        ctx.fill();
        // 额头高光
        ctx.fillStyle = 'rgba(255,250,248,0.14)';
        ctx.beginPath();
        ctx.ellipse(-rx * 0.15, -ry * 0.62, rx * 0.28, ry * 0.12, -0.15, 0, Math.PI * 2);
        ctx.fill();
        // 眼下周影（冷粉灰，绝望时加深显疲惫）
        const tired = despair > 55 ? 0.22 : 0.1;
        ctx.fillStyle = 'rgba(150,118,122,' + tired + ')';
        ctx.beginPath();
        ctx.ellipse(-eyeDX, eyeY + ry * 0.1, rx * 0.12, ry * 0.04, 0, 0, Math.PI * 2);
        ctx.ellipse(eyeDX, eyeY + ry * 0.1, rx * 0.12, ry * 0.04, 0, 0, Math.PI * 2);
        ctx.fill();
        // 鼻梁侧影由 drawNose 中的线条版本统一绘制，此处不再重复
    }

    // 头发前景：卷发刘海 + 卷曲鬓角长垂发 + 波浪高光发丝
    function drawHairFront(ctx, rx, ry) {
        // === 刘海底色（覆盖额头，防秃）===
        const bangGrad = ctx.createLinearGradient(0, -ry, 0, -ry * 0.1);
        bangGrad.addColorStop(0, '#2A2228');
        bangGrad.addColorStop(1, '#1E1820');
        ctx.fillStyle = bangGrad;
        ctx.beginPath();
        // 顶部发际线
        ctx.moveTo(-rx * 1.05, -ry * 0.45);
        ctx.bezierCurveTo(-rx * 1.1, -ry * 1.02, rx * 1.1, -ry * 1.02, rx * 1.05, -ry * 0.45);
        // 右侧斜刘海（向左下斜分，末端卷曲）
        ctx.bezierCurveTo(rx * 0.88, -ry * 0.62, rx * 0.55, -ry * 0.32, rx * 0.2, -ry * 0.4);
        ctx.bezierCurveTo(rx * 0.05, -ry * 0.28, -rx * 0.05, -ry * 0.18, -rx * 0.15, -ry * 0.05);
        // 中间分缝缺口
        ctx.bezierCurveTo(-rx * 0.25, -ry * 0.32, -rx * 0.4, -ry * 0.55, -rx * 0.62, -ry * 0.42);
        // 左侧大刘海束
        ctx.bezierCurveTo(-rx * 0.85, -ry * 0.58, -rx * 0.98, -ry * 0.4, -rx * 1.05, -ry * 0.45);
        ctx.closePath();
        ctx.fill();

        // === 卷曲刘海束（在底色上叠加，增加卷发感）===
        ctx.fillStyle = '#241C24';
        // 左侧卷曲刘海束（向下垂落 + 末端微卷）
        ctx.beginPath();
        ctx.moveTo(-rx * 0.95, -ry * 0.4);
        ctx.bezierCurveTo(-rx * 0.85, -ry * 0.15, -rx * 0.7, -ry * 0.05, -rx * 0.55, -ry * 0.08);
        ctx.bezierCurveTo(-rx * 0.42, -ry * 0.05, -rx * 0.35, -ry * 0.12, -rx * 0.3, -ry * 0.05);
        // 末端微卷（外翘）
        ctx.bezierCurveTo(-rx * 0.25, ry * 0.05, -rx * 0.35, ry * 0.1, -rx * 0.45, ry * 0.05);
        ctx.bezierCurveTo(-rx * 0.6, -ry * 0.05, -rx * 0.78, -ry * 0.2, -rx * 0.95, -ry * 0.4);
        ctx.closePath();
        ctx.fill();
        // 右侧卷曲刘海束
        ctx.beginPath();
        ctx.moveTo(rx * 0.95, -ry * 0.4);
        ctx.bezierCurveTo(rx * 0.85, -ry * 0.15, rx * 0.7, -ry * 0.05, rx * 0.55, -ry * 0.08);
        ctx.bezierCurveTo(rx * 0.42, -ry * 0.05, rx * 0.35, -ry * 0.12, rx * 0.3, -ry * 0.05);
        ctx.bezierCurveTo(rx * 0.25, ry * 0.05, rx * 0.35, ry * 0.1, rx * 0.45, ry * 0.05);
        ctx.bezierCurveTo(rx * 0.6, -ry * 0.05, rx * 0.78, -ry * 0.2, rx * 0.95, -ry * 0.4);
        ctx.closePath();
        ctx.fill();

        // === 卷曲鬓角长垂发（S 形波浪垂落 + 末端外翘卷曲，起点提高到刘海衔接处）===
        ctx.fillStyle = '#1E1820';
        // 左鬓角卷曲垂发（从刘海边缘 -ry*0.45 开始，无缝衔接）
        ctx.beginPath();
        ctx.moveTo(-rx * 1.05, -ry * 0.45);
        // 外侧 S 形波浪向下
        ctx.bezierCurveTo(-rx * 1.28, -ry * 0.1, -rx * 1.12, ry * 0.35, -rx * 1.2, ry * 0.7);
        ctx.bezierCurveTo(-rx * 1.05, ry * 1.0, -rx * 0.95, ry * 1.15, -rx * 0.85, ry * 1.25);
        // 末端外翘卷曲
        ctx.bezierCurveTo(-rx * 0.7, ry * 1.35, -rx * 0.6, ry * 1.25, -rx * 0.65, ry * 1.15);
        ctx.bezierCurveTo(-rx * 0.72, ry * 1.05, -rx * 0.78, ry * 1.0, -rx * 0.72, ry * 0.9);
        // 内侧回弹向上（衔接刘海下沿）
        ctx.bezierCurveTo(-rx * 0.68, ry * 0.55, -rx * 0.78, ry * 0.2, -rx * 0.62, -ry * 0.05);
        ctx.bezierCurveTo(-rx * 0.58, -ry * 0.2, -rx * 0.6, -ry * 0.35, -rx * 0.55, -ry * 0.42);
        ctx.closePath();
        ctx.fill();
        // 右鬓角卷曲垂发
        ctx.beginPath();
        ctx.moveTo(rx * 1.05, -ry * 0.45);
        ctx.bezierCurveTo(rx * 1.28, -ry * 0.1, rx * 1.12, ry * 0.35, rx * 1.2, ry * 0.7);
        ctx.bezierCurveTo(rx * 1.05, ry * 1.0, rx * 0.95, ry * 1.15, rx * 0.85, ry * 1.25);
        ctx.bezierCurveTo(rx * 0.7, ry * 1.35, rx * 0.6, ry * 1.25, rx * 0.65, ry * 1.15);
        ctx.bezierCurveTo(rx * 0.72, ry * 1.05, rx * 0.78, ry * 1.0, rx * 0.72, ry * 0.9);
        ctx.bezierCurveTo(rx * 0.68, ry * 0.55, rx * 0.78, ry * 0.2, rx * 0.62, -ry * 0.05);
        ctx.bezierCurveTo(rx * 0.58, -ry * 0.2, rx * 0.6, -ry * 0.35, rx * 0.55, -ry * 0.42);
        ctx.closePath();
        ctx.fill();

        // === 波浪高光发丝（卷发感）===
        ctx.strokeStyle = 'rgba(120,100,140,0.55)';
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        // 左刘海波浪高光
        ctx.moveTo(-rx * 0.7, -ry * 0.85);
        ctx.bezierCurveTo(-rx * 0.6, -ry * 0.55, -rx * 0.75, -ry * 0.35, -rx * 0.5, -ry * 0.18);
        ctx.bezierCurveTo(-rx * 0.35, -ry * 0.08, -rx * 0.45, ry * 0.02, -rx * 0.4, -ry * 0.05);
        // 右刘海波浪高光
        ctx.moveTo(rx * 0.6, -ry * 0.8);
        ctx.bezierCurveTo(rx * 0.5, -ry * 0.55, rx * 0.65, -ry * 0.32, rx * 0.4, -ry * 0.18);
        ctx.bezierCurveTo(rx * 0.25, -ry * 0.08, rx * 0.35, ry * 0.02, rx * 0.3, -ry * 0.05);
        ctx.stroke();

        // 鬓角波浪高光（S 形）
        ctx.strokeStyle = 'rgba(110,90,128,0.4)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-rx * 1.0, -ry * 0.05);
        ctx.bezierCurveTo(-rx * 1.12, ry * 0.3, -rx * 0.98, ry * 0.6, -rx * 1.08, ry * 0.9);
        ctx.bezierCurveTo(-rx * 0.95, ry * 1.1, -rx * 0.82, ry * 1.2, -rx * 0.78, ry * 1.18);
        ctx.moveTo(rx * 1.0, -ry * 0.05);
        ctx.bezierCurveTo(rx * 1.12, ry * 0.3, rx * 0.98, ry * 0.6, rx * 1.08, ry * 0.9);
        ctx.bezierCurveTo(rx * 0.95, ry * 1.1, rx * 0.82, ry * 1.2, rx * 0.78, ry * 1.18);
        ctx.stroke();

        // 顶部散发（卷曲细丝，增加动感）
        ctx.strokeStyle = 'rgba(60,48,72,0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-rx * 0.3, -ry * 0.95);
        ctx.bezierCurveTo(-rx * 0.2, -ry * 0.7, -rx * 0.25, -ry * 0.5, -rx * 0.15, -ry * 0.3);
        ctx.bezierCurveTo(-rx * 0.1, -ry * 0.25, -rx * 0.05, -ry * 0.35, -rx * 0.1, -ry * 0.4);
        ctx.moveTo(rx * 0.2, -ry * 0.95);
        ctx.bezierCurveTo(rx * 0.15, -ry * 0.7, rx * 0.2, -ry * 0.45, rx * 0.1, -ry * 0.25);
        ctx.bezierCurveTo(rx * 0.05, -ry * 0.2, rx * 0.0, -ry * 0.3, rx * 0.05, -ry * 0.35);
        ctx.stroke();
    }

    // 鼻子（极简柔和）
    function drawNose(ctx, rx, ry, noseTipY, despair) {
        // 动漫风极简鼻：仅左侧轻描鼻梁线 + 一点鼻尖，去除鼻翼明暗/鼻底柔影等写实细节
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 左侧鼻梁线（动漫常用单侧线条暗示鼻梁，冷粉灰色调配合冷白肌肤）
        ctx.strokeStyle = 'rgba(150,110,118,0.28)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-rx * 0.04, -ry * 0.08);
        ctx.quadraticCurveTo(-rx * 0.06, noseTipY - ry * 0.04, -rx * 0.025, noseTipY - ry * 0.005);
        ctx.stroke();

        // 鼻尖小点（动漫标志性"一点鼻"，冷粉灰圆点）
        ctx.fillStyle = 'rgba(150,110,118,0.35)';
        ctx.beginPath();
        ctx.ellipse(-rx * 0.005, noseTipY, rx * 0.012, ry * 0.006, -0.1, 0, Math.PI * 2);
        ctx.fill();

        // 鼻孔（仅在绝望时显现，呼应呼吸加重）
        if (despair > 70) {
            ctx.fillStyle = 'rgba(120,80,82,0.45)';
            ctx.beginPath();
            ctx.ellipse(-rx * 0.045, noseTipY + ry * 0.012, rx * 0.022, ry * 0.008, -0.2, 0, Math.PI * 2);
            ctx.ellipse(rx * 0.04, noseTipY + ry * 0.012, rx * 0.022, ry * 0.008, 0.2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ========== 表情过渡动画 ==========
    function animateFace() {
        if (faceAnimId) cancelAnimationFrame(faceAnimId);

        function step() {
            // 结局后停止循环，保留结局面画静止帧
            if (gameState.ended) { faceAnimId = null; return; }

            const dC = gameState.calm - displayCalm;
            const dT = gameState.trust - displayTrust;
            const dD = gameState.despair - displayDespair;

            displayCalm += dC / 10;
            displayTrust += dT / 10;
            displayDespair += dD / 10;

            const settled = Math.abs(dC) < 0.5 && Math.abs(dT) < 0.5 && Math.abs(dD) < 0.5;
            if (settled) {
                displayCalm = gameState.calm;
                displayTrust = gameState.trust;
                displayDespair = gameState.despair;
            }

            drawFace(faceCtx, displayCalm, displayTrust, displayDespair);
            // 场景每帧重绘以支持星星闪烁、城市灯光闪烁、云朵飘动、天线摇摆等动画
            drawScene(displayDespair);

            // 持续循环以支持呼吸 / 浮尘 / 雾气等动态层
            faceAnimId = requestAnimationFrame(step);
        }

        faceAnimId = requestAnimationFrame(step);
    }

    function render() {
        drawScene();
        drawFace(faceCtx, displayCalm, displayTrust, displayDespair);
    }

    let resizeTimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 100);
    });

    // ========== 开场动画（粒子背景 + 打字机） ==========
    const openingCanvas = document.getElementById('opening-canvas');
    const openingCtx = openingCanvas.getContext('2d');
    let openingAnimId = null;
    let openingStars = [];
    let openingEmbers = [];
    let openingBuildings = [];

    function initOpeningData() {
        const ow = window.innerWidth;
        const oh = window.innerHeight;
        openingStars = [];
        for (let i = 0; i < 90; i++) {
            openingStars.push({
                x: Math.random() * ow,
                y: Math.random() * oh * 0.55,
                r: Math.random() * 1.1 + 0.3,
                phase: Math.random() * Math.PI * 2,
                speed: 0.5 + Math.random() * 1.6
            });
        }
        openingEmbers = [];
        for (let i = 0; i < 45; i++) {
            openingEmbers.push({
                x: Math.random() * ow,
                y: oh + Math.random() * oh * 0.6,
                r: Math.random() * 1.4 + 0.5,
                vy: -(0.2 + Math.random() * 0.55),
                phase: Math.random() * Math.PI * 2,
                life: Math.random()
            });
        }
        openingBuildings = [];
        const bn = 16;
        for (let i = 0; i < bn; i++) {
            const h = 28 + ((i * 41 + 17) % 95);
            const wins = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 3; c++) {
                    if ((i * 7 + r * 13 + c * 5) % 5 < 2) {
                        wins.push({ r: r, c: c, a: 0.25 + ((i + r + c) % 3) * 0.18 });
                    }
                }
            }
            openingBuildings.push({ h: h, windows: wins });
        }
    }

    function resizeOpeningCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const ow = window.innerWidth;
        const oh = window.innerHeight;
        openingCanvas.width = Math.round(ow * dpr);
        openingCanvas.height = Math.round(oh * dpr);
        openingCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawOpening() {
        if (gameStarted) { openingAnimId = null; return; }
        const ow = window.innerWidth;
        const oh = window.innerHeight;
        const t = performance.now() / 1000;

        // 渐变夜空
        const g = openingCtx.createLinearGradient(0, 0, 0, oh);
        g.addColorStop(0, '#070912');
        g.addColorStop(0.6, '#0A0B14');
        g.addColorStop(1, '#000000');
        openingCtx.fillStyle = g;
        openingCtx.fillRect(0, 0, ow, oh);

        // 星星闪烁
        openingStars.forEach(s => {
            const a = 0.3 + 0.55 * Math.abs(Math.sin(t * s.speed + s.phase));
            openingCtx.fillStyle = 'rgba(200,210,255,' + a + ')';
            openingCtx.beginPath();
            openingCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            openingCtx.fill();
        });

        // 城市剪影
        const baseY = oh * 0.8;
        const bn = openingBuildings.length;
        const bw = ow / bn;
        openingBuildings.forEach((b, i) => {
            const bx = i * bw;
            openingCtx.fillStyle = '#080A12';
            openingCtx.fillRect(bx, baseY - b.h, bw - 1, b.h);
            b.windows.forEach(w => {
                openingCtx.fillStyle = 'rgba(224,175,104,' + w.a + ')';
                openingCtx.fillRect(bx + 5 + w.c * 7, baseY - b.h + 8 + w.r * 10, 2, 2);
            });
        });
        // 天台地面线
        openingCtx.fillStyle = '#040508';
        openingCtx.fillRect(0, baseY, ow, oh - baseY);
        openingCtx.strokeStyle = 'rgba(122,162,247,0.18)';
        openingCtx.lineWidth = 1;
        openingCtx.beginPath();
        openingCtx.moveTo(0, baseY);
        openingCtx.lineTo(ow, baseY);
        openingCtx.stroke();

        // 余烬上飘
        openingEmbers.forEach(e => {
            e.y += e.vy;
            e.x += Math.sin(t * 2 + e.phase) * 0.35;
            e.life += 0.004;
            if (e.y < -10 || e.life > 1) {
                e.y = oh + 10;
                e.x = Math.random() * ow;
                e.life = 0;
            }
            const a = (1 - e.life) * 0.65;
            const grad = openingCtx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 3.5);
            grad.addColorStop(0, 'rgba(255,180,100,' + a + ')');
            grad.addColorStop(1, 'rgba(255,180,100,0)');
            openingCtx.fillStyle = grad;
            openingCtx.beginPath();
            openingCtx.arc(e.x, e.y, e.r * 3.5, 0, Math.PI * 2);
            openingCtx.fill();
        });

        // 暗角
        const vg = openingCtx.createRadialGradient(ow / 2, oh / 2, oh * 0.3, ow / 2, oh / 2, oh * 0.85);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.65)');
        openingCtx.fillStyle = vg;
        openingCtx.fillRect(0, 0, ow, oh);

        openingAnimId = requestAnimationFrame(drawOpening);
    }

    function startOpeningTypewriter() {
        const textEl = document.getElementById('opening-text');
        const lines = ['一个人站在天台边缘。', '你有 10 句话的机会。'];
        let li = 0, ci = 0, html = '';
        function step() {
            if (li >= lines.length) {
                textEl.innerHTML = html + '<span class="cursor"></span>';
                return;
            }
            const line = lines[li];
            if (ci < line.length) {
                html += line[ci];
                ci++;
                textEl.innerHTML = html + '<span class="cursor"></span>';
                setTimeout(step, 65 + Math.random() * 45);
            } else if (li < lines.length - 1) {
                html += '<br>';
                li++; ci = 0;
                textEl.innerHTML = html + '<span class="cursor"></span>';
                setTimeout(step, 320);
            } else {
                textEl.innerHTML = html + '<span class="cursor"></span>';
            }
        }
        setTimeout(step, 1100);
    }

    // ========== 开场动画 ==========
    function startGame() {
        if (gameStarted) return;
        gameStarted = true;
        openingOverlay.classList.add('fade');
        document.body.classList.add('started');
        setTimeout(function () {
            openingOverlay.style.display = 'none';
        }, 800);
    }

    openingOverlay.addEventListener('click', startGame);
    // 5.5 秒后自动开始（留出打字机与阅读时间）
    setTimeout(startGame, 5500);

    // ========== 键盘操作 ==========
    // 1-4 选对话选项 · Q/W/E/R 行动 · Enter/Space 开场或重开
    document.addEventListener('keydown', function (e) {
        // 开场阶段：Enter / Space 开始
        if (!gameStarted) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                startGame();
            }
            return;
        }
        // 结局阶段：Enter / Space 重新开始
        if (gameState.ended) {
            if (e.key === 'Enter' || e.key === ' ') {
                const btn = document.getElementById('restart-btn');
                if (btn) { e.preventDefault(); btn.click(); }
            }
            return;
        }
        // 流程进行中：busy 时忽略
        if (busy) return;

        const k = e.key.toLowerCase();
        // 数字键 1-4 → 对话选项
        if (k >= '1' && k <= '4') {
            const idx = parseInt(k, 10) - 1;
            const opt = currentDialogueKeys[idx];
            if (opt) { e.preventDefault(); handleSelect(opt.key, opt.line); }
            return;
        }
        // Q W E R → 行动
        const actionIdx = { q: 0, w: 1, e: 2, r: 3 }[k];
        if (actionIdx !== undefined) {
            const actionKey = actionKeyOrder[actionIdx];
            if (actionKey && !gameState.usedActions[actionKey]) {
                e.preventDefault();
                handleAction(actionKey);
            }
        }
    });

    // ========== 初始化 ==========
    initData();
    initOpeningData();
    resizeOpeningCanvas();
    drawOpening();
    startOpeningTypewriter();
    render();
    updateBars();
    renderActions();
    renderDialogueOptions();

    // 开场画布跟随窗口尺寸
    window.addEventListener('resize', function () {
        if (!gameStarted) {
            initOpeningData();
            resizeOpeningCanvas();
        }
    });
})();
</script>
