<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>VidBuddy 控制面板</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <!-- 顶部导航栏：包含Logo、标题和功能入口按钮 -->
    <div class="header">
      <div class="header-left">
        <img src="../icons/icon32.png" class="logo-icon" alt="VidBuddy" />
        <div class="header-text">
          <h1 class="title">VidBuddy</h1>
          <div class="subtitle">您的智能视频播放与截图伴侣</div>
        </div>
      </div>
      <!-- 右侧功能按钮：设置和控制中心 -->
      <div style="display: flex; gap: 8px;">
        <button
          id="btn-open-settings"
          class="btn-dashboard-entry btn-settings"
          title="打开插件配置"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>配置</span>
        </button>
        <button
          id="btn-open-dashboard"
          class="btn-dashboard-entry"
          title="打开全屏控制中心管理大图和进度"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          <span>控制中心</span>
        </button>
      </div>
    </div>

    <!-- 播放历史区域：包含筛选器和历史列表 -->
    <div id="section-history" class="content-section active">
      <div class="filter-bar">
        <span>筛选来源网站：</span>
        <select id="platform-filter" class="filter-select">
          <option value="all">全部网站</option>
        </select>
      </div>
      <!-- 历史记录列表容器，由JS动态插入 -->
      <div id="history-list">
      </div>
    </div>

    <!-- 底部操作栏：清空全部记录按钮 -->
    <div class="clear-footer">
      <button id="btn-clear-all" class="btn-clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>清空全部记录</span>
      </button>
    </div>

    <!-- 脚本引入顺序：工具模块 → UI组件 → 主逻辑 -->
    <script src="../shared/utils.js"></script>
    <script src="../shared/modal.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/image-viewer.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
