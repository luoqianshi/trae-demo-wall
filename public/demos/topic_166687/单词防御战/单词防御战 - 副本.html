<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词防御战 - 英语单词拼写游戏</title>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; overflow-x: hidden; }
        
        .page { display: none; padding: 20px; min-height: 100vh; }
        .page.active { display: block; }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        .btn {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4); }
        .btn:active { transform: translateY(0); }
        
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Home Page */
        #home-page { text-align: center; }
        .hero-title { font-family: 'Bubblegum Sans', cursive; font-size: 48px; color: white; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        .hero-subtitle { color: white; font-size: 20px; margin-bottom: 40px; opacity: 0.9; }
        .emoji-wave { font-size: 40px; animation: bounce 1s infinite alternate; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-item { background: white; padding: 20px; border-radius: 15px; text-align: center; }
        .stat-icon { font-size: 28px; margin-bottom: 8px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #3B82F6; }
        .stat-label { font-size: 12px; color: #666; }
        
        .heroes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .hero-item { background: white; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid transparent; }
        .hero-item.locked { opacity: 0.5; }
        .hero-emoji { font-size: 36px; margin-bottom: 8px; }
        .hero-name { font-weight: bold; font-size: 14px; }
        .hero-skill { font-size: 12px; color: #666; }
        
        /* Game Page */
        #game-page { position: relative; }
        .hud-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .hud-item { background: white; padding: 15px 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .hud-label { font-size: 12px; color: #666; }
        .hud-value { font-size: 24px; font-weight: bold; }
        
        .battlefield { background: linear-gradient(135deg, #dcfce7, #bbf7d0); border: 4px solid #22C55E; border-radius: 20px; padding: 10px; position: relative; margin-bottom: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .grid-cell { aspect-ratio: 1; background: rgba(255,255,255,0.6); border-radius: 8px; border: 1px solid rgba(34, 197, 94, 0.3); cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; }
        .grid-cell:hover { background: rgba(255,255,255,0.9); }
        .grid-cell.selected { background: #fef3c7; border-color: #f59e0b; }
        .grid-cell.has-hero { background: rgba(59, 130, 246, 0.2); }
        
        .placed-hero { font-size: 28px; position: absolute; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .enemy { font-size: 28px; position: absolute; transition: left 0.5s linear; z-index: 10; }
        .enemy-health { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 30px; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
        .enemy-health-bar { height: 100%; background: #ef4444; }
        
        .spelling-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .spelling-meaning { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; color: #333; }
        .spelling-blanks { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .blank-box { width: 40px; height: 45px; background: #f3f4f6; border-bottom: 3px solid #9ca3af; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #666; }
        
        .spelling-input { width: 100%; padding: 15px; font-size: 18px; border: 3px solid #e5e7eb; border-radius: 12px; outline: none; text-align: center; transition: border-color 0.3s; }
        .spelling-input:focus { border-color: #3B82F6; }
        .spelling-input.correct { border-color: #22C55E; background: #dcfce7; }
        .spelling-input.error { border-color: #ef4444; background: #fee2e2; }
        
        .feedback { text-align: center; margin-top: 15px; font-size: 18px; font-weight: bold; animation: pop 0.3s; }
        .feedback.success { color: #22C55E; }
        .feedback.error { color: #ef4444; }
        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .hero-selector { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .hero-selector-title { font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .hero-options { display: flex; flex-direction: column; gap: 10px; }
        .hero-option { display: flex; align-items: center; padding: 15px; background: #f9fafb; border-radius: 12px; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; }
        .hero-option:hover { background: #f3f4f6; }
        .hero-option.selected { background: #eff6ff; border-color: #3B82F6; }
        .hero-option.disabled { opacity: 0.5; cursor: not-allowed; }
        .hero-option-emoji { font-size: 28px; margin-right: 15px; }
        .hero-option-info { flex: 1; }
        .hero-option-name { font-weight: bold; }
        .hero-option-desc { font-size: 12px; color: #666; }
        .hero-option-cost { font-size: 16px; font-weight: bold; color: #f59e0b; }
        
        .game-over-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .game-over-modal { background: white; border-radius: 30px; padding: 50px; text-align: center; max-width: 400px; animation: pop 0.5s; }
        .game-over-emoji { font-size: 80px; margin-bottom: 20px; }
        .game-over-title { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
        .game-over-score { font-size: 24px; color: #666; margin-bottom: 30px; }
        .game-over-buttons { display: flex; gap: 15px; justify-content: center; }
        
        /* Progress Page */
        #progress-page { text-align: center; }
        .progress-title { color: white; font-size: 32px; margin-bottom: 30px; }
        .progress-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .progress-stat { background: white; padding: 30px; border-radius: 20px; text-align: center; }
        .progress-stat-value { font-size: 48px; font-weight: bold; color: #3B82F6; }
        .progress-stat-label { font-size: 16px; color: #666; margin-top: 10px; }
        
        .achievements-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .achievement-item { background: white; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid #f3f4f6; }
        .achievement-item.unlocked { border-color: #f59e0b; background: #fffbeb; }
        .achievement-emoji { font-size: 36px; margin-bottom: 10px; }
        .achievement-name { font-weight: bold; font-size: 14px; }
        .achievement-desc { font-size: 12px; color: #666; margin-top: 5px; }
        
        .back-btn { background: white; color: #333; margin-bottom: 30px; }
        
        .health-hearts { display: flex; gap: 5px; justify-content: center; }
        .heart { font-size: 20px; }
        .heart.empty { opacity: 0.3; }
        
        .wave-indicator { color: #f97316; }
        .score-indicator { color: #eab308; }
    </style>
</head>
<body>
    <!-- Home Page -->
    <div id="home-page" class="page active">
        <div class="container">
            <h1 class="hero-title">🎮 单词防御战</h1>
            <p class="hero-subtitle">拼写单词，召唤英雄，守护你的基地！</p>
            <div style="margin-bottom: 40px;">
                <span class="emoji-wave">📚</span>
                <span class="emoji-wave" style="animation-delay: 0.2s;">⚔️</span>
                <span class="emoji-wave" style="animation-delay: 0.4s;">🏰</span>
            </div>
            
            <button class="btn" onclick="startGame()" style="width: 100%; max-width: 400px;">开始游戏</button>
            <button class="btn back-btn" onclick="showProgress()" style="width: 100%; max-width: 400px; margin-top: 15px;">查看进度</button>
            
            <div class="card" style="margin-top: 40px;">
                <h2 style="margin-bottom: 20px; color: #333;">📊 当前进度</h2>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-icon">🏆</div><div class="stat-value" id="home-highscore">0</div><div class="stat-label">最高分</div></div>
                    <div class="stat-item"><div class="stat-icon">⭐</div><div class="stat-value" id="home-level">1</div><div class="stat-label">当前等级</div></div>
                    <div class="stat-item"><div class="stat-icon">📚</div><div class="stat-value" id="home-words">0</div><div class="stat-label">已学单词</div></div>
                    <div class="stat-item"><div class="stat-icon">🎯</div><div class="stat-value" id="home-accuracy">0%</div><div class="stat-label">准确率</div></div>
                </div>
            </div>
            
            <div class="card">
                <h2 style="margin-bottom: 20px; color: #333;">🦸 我的英雄</h2>
                <div class="heroes-grid" id="home-heroes"></div>
            </div>
            
            <p style="color: white; opacity: 0.8; margin-top: 30px; font-size: 14px;">💡 提示：正确拼写单词获得金币，用金币召唤英雄抵御敌人！</p>
        </div>
    </div>

    <!-- Game Page -->
    <div id="game-page" class="page">
        <div class="container">
            <button class="btn back-btn" onclick="showHome()" style="margin-bottom: 20px;">← 返回首页</button>
            
            <div class="hud-bar">
                <div class="hud-item">
                    <div class="hud-label">波次</div>
                    <div class="hud-value wave-indicator" id="hud-wave">1/15</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">金币</div>
                    <div class="hud-value score-indicator" id="hud-score">💰 0</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">生命</div>
                    <div class="health-hearts" id="hud-lives"></div>
                </div>
            </div>
            
            <div class="battlefield" id="battlefield">
                <div class="grid-container" id="grid-container"></div>
            </div>
            
            <div class="spelling-card">
                <div class="spelling-meaning" id="spelling-meaning">???</div>
                <div class="spelling-blanks" id="spelling-blanks"></div>
                <input type="text" class="spelling-input" id="spelling-input" placeholder="输入单词拼写..." autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="handleKeyDown(event)">
                <div class="feedback" id="spelling-feedback" style="display: none;"></div>
            </div>
            
            <div class="hero-selector">
                <div class="hero-selector-title">🦸 选择英雄放置</div>
                <div class="hero-options" id="hero-options"></div>
            </div>
        </div>
        
        <div class="game-over-overlay" id="game-over-overlay" style="display: none;">
            <div class="game-over-modal">
                <div class="game-over-emoji" id="game-over-emoji">🎉</div>
                <div class="game-over-title" id="game-over-title">胜利！</div>
                <div class="game-over-score" id="game-over-score">得分：0</div>
                <div class="game-over-buttons">
                    <button class="btn" onclick="restartGame()">再来一局</button>
                    <button class="btn back-btn" onclick="showHome()">返回首页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Progress Page -->
    <div id="progress-page" class="page">
        <div class="container">
            <button class="btn back-btn" onclick="showHome()" style="margin-bottom: 20px;">← 返回首页</button>
            
            <h2 class="progress-title">📊 我的学习进度</h2>
            
            <div class="progress-stats">
                <div class="progress-stat"><div class="progress-stat-value" id="progress-highscore">0</div><div class="progress-stat-label">最高分</div></div>
                <div class="progress-stat"><div class="progress-stat-value" id="progress-level">1</div><div class="progress-stat-label">最高波次</div></div>
                <div class="progress-stat"><div class="progress-stat-value" id="progress-words">0</div><div class="progress-stat-label">已学单词</div></div>
                <div class="progress-stat"><div class="progress-stat-value" id="progress-accuracy">0%</div><div class="progress-stat-label">准确率</div></div>
            </div>
            
            <div class="card">
                <h2 style="margin-bottom: 20px; color: #333;">🏆 成就徽章</h2>
                <div class="achievements-grid" id="achievements-grid"></div>
            </div>
            
            <button class="btn" onclick="startGame()" style="width: 100%; max-width: 400px;">🎮 继续游戏</button>
        </div>
    </div>

    <script>
        // 词汇数据库
        const words = [
            { id: 'w1', word: 'apple', meaning: '苹果', difficulty: 1 },
            { id: 'w2', word: 'book', meaning: '书', difficulty: 1 },
            { id: 'w3', word: 'cat', meaning: '猫', difficulty: 1 },
            { id: 'w4', word: 'dog', meaning: '狗', difficulty: 1 },
            { id: 'w5', word: 'egg', meaning: '鸡蛋', difficulty: 1 },
            { id: 'w6', word: 'fish', meaning: '鱼', difficulty: 1 },
            { id: 'w7', word: 'girl', meaning: '女孩', difficulty: 1 },
            { id: 'w8', word: 'hand', meaning: '手', difficulty: 1 },
            { id: 'w9', word: 'happy', meaning: '快乐的', difficulty: 1 },
            { id: 'w10', word: 'jump', meaning: '跳', difficulty: 1 },
            { id: 'w11', word: 'run', meaning: '跑', difficulty: 1 },
            { id: 'w12', word: 'sing', meaning: '唱歌', difficulty: 1 },
            { id: 'w13', word: 'dance', meaning: '跳舞', difficulty: 1 },
            { id: 'w14', word: 'beautiful', meaning: '美丽的', difficulty: 2 },
            { id: 'w15', word: 'student', meaning: '学生', difficulty: 2 },
            { id: 'w16', word: 'teacher', meaning: '老师', difficulty: 2 },
            { id: 'w17', word: 'school', meaning: '学校', difficulty: 2 },
            { id: 'w18', word: 'friend', meaning: '朋友', difficulty: 2 },
            { id: 'w19', word: 'family', meaning: '家庭', difficulty: 2 },
            { id: 'w20', word: 'water', meaning: '水', difficulty: 2 },
            { id: 'w21', word: 'read', meaning: '读', difficulty: 2 },
            { id: 'w22', word: 'write', meaning: '写', difficulty: 2 },
            { id: 'w23', word: 'learn', meaning: '学习', difficulty: 2 },
            { id: 'w24', word: 'important', meaning: '重要的', difficulty: 3 },
            { id: 'w25', word: 'different', meaning: '不同的', difficulty: 3 },
            { id: 'w26', word: 'difficult', meaning: '困难的', difficulty: 3 },
            { id: 'w27', word: 'easy', meaning: '容易的', difficulty: 3 },
            { id: 'w28', word: 'interesting', meaning: '有趣的', difficulty: 3 },
            { id: 'w29', word: 'remember', meaning: '记住', difficulty: 3 },
            { id: 'w30', word: 'understand', meaning: '理解', difficulty: 3 },
            { id: 'w31', word: 'improve', meaning: '改善', difficulty: 3 },
            { id: 'w32', word: 'practice', meaning: '练习', difficulty: 3 },
            { id: 'w33', word: 'experience', meaning: '经验', difficulty: 4 },
            { id: 'w34', word: 'opportunity', meaning: '机会', difficulty: 4 },
            { id: 'w35', word: 'challenge', meaning: '挑战', difficulty: 4 },
            { id: 'w36', word: 'success', meaning: '成功', difficulty: 4 },
            { id: 'w37', word: 'knowledge', meaning: '知识', difficulty: 4 },
            { id: 'w38', word: 'influence', meaning: '影响', difficulty: 4 },
            { id: 'w39', word: 'contribute', meaning: '贡献', difficulty: 4 },
            { id: 'w40', word: 'achieve', meaning: '实现', difficulty: 4 },
            { id: 'w41', word: 'phenomenon', meaning: '现象', difficulty: 5 },
            { id: 'w42', word: 'consequence', meaning: '后果', difficulty: 5 },
            { id: 'w43', word: 'perspective', meaning: '观点', difficulty: 5 },
            { id: 'w44', word: 'significance', meaning: '重要性', difficulty: 5 },
            { id: 'w45', word: 'responsibility', meaning: '责任', difficulty: 5 },
            { id: 'w46', word: 'collaborate', meaning: '合作', difficulty: 5 },
            { id: 'w47', word: 'innovate', meaning: '创新', difficulty: 5 },
            { id: 'w48', word: 'transform', meaning: '转变', difficulty: 5 },
        ];

        // 英雄数据
        const heroes = [
            { id: 'h1', name: '火焰战士', emoji: '🔥', skill: '火焰喷射', damage: 20, cost: 10, color: '#F97316' },
            { id: 'h2', name: '冰霜法师', emoji: '❄️', skill: '寒冰冻结', damage: 15, cost: 10, color: '#3B82F6' },
            { id: 'h3', name: '大地守护者', emoji: '🌍', skill: '岩石护盾', damage: 10, cost: 10, color: '#22C55E' },
            { id: 'h4', name: '风暴使者', emoji: '💨', skill: '闪电链', damage: 25, cost: 20, color: '#8B5CF6' },
            { id: 'h5', name: '光明天使', emoji: '✨', skill: '神圣治愈', damage: 18, cost: 20, color: '#EAB308' },
            { id: 'h6', name: '暗影刺客', emoji: '🌑', skill: '致命一击', damage: 40, cost: 30, color: '#EC4899' },
        ];

        // 成就数据
        const achievements = [
            { id: 'a1', name: '初学者', description: '完成第一次游戏', icon: '🌟' },
            { id: 'a2', name: '单词达人', description: '累计学习20个单词', icon: '📚' },
            { id: 'a3', name: '拼写大师', description: '准确率达到80%', icon: '🏆' },
            { id: 'a4', name: '波次英雄', description: '通过第5波', icon: '⚔️' },
            { id: 'a5', name: '百万富翁', description: '累计获得500分', icon: '💰' },
            { id: 'a6', name: '全英雄解锁', description: '解锁所有英雄', icon: '👑' },
        ];

        // 游戏状态
        let gameState = {
            wave: 1,
            score: 0,
            lives: 10,
            heroPositions: [],
            enemies: [],
            currentWord: null,
            selectedHero: null,
            isGameOver: false,
            isVictory: false,
            enemiesSpawned: 0,
            totalEnemies: 5,
            correctCount: 0,
            totalAttempts: 0,
            wordsLearned: new Set(),
        };

        // 玩家进度
        let playerProgress = {
            highScore: 0,
            currentLevel: 1,
            unlockedHeroes: ['h1', 'h2', 'h3'],
            totalWordsLearned: 0,
            accuracyRate: 0,
            achievements: [],
            wordMastery: {},
        };

        // 加载进度
        function loadProgress() {
            const saved = localStorage.getItem('spellingDefenseProgress');
            if (saved) {
                playerProgress = JSON.parse(saved);
            }
        }

        // 保存进度
        function saveProgress() {
            localStorage.setItem('spellingDefenseProgress', JSON.stringify(playerProgress));
        }

        // 显示页面
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function showHome() {
            updateHomeStats();
            showPage('home-page');
        }

        function showProgress() {
            updateProgressStats();
            showPage('progress-page');
        }

        // 更新首页统计
        function updateHomeStats() {
            document.getElementById('home-highscore').textContent = playerProgress.highScore;
            document.getElementById('home-level').textContent = playerProgress.currentLevel;
            document.getElementById('home-words').textContent = playerProgress.totalWordsLearned;
            document.getElementById('home-accuracy').textContent = playerProgress.accuracyRate.toFixed(0) + '%';
            
            const heroesContainer = document.getElementById('home-heroes');
            heroesContainer.innerHTML = heroes.map(h => {
                const unlocked = playerProgress.unlockedHeroes.includes(h.id);
                return `<div class="hero-item ${unlocked ? '' : 'locked'}">
                    <div class="hero-emoji">${unlocked ? h.emoji : '🔒'}</div>
                    <div class="hero-name">${unlocked ? h.name : '???'}</div>
                    <div class="hero-skill">${unlocked ? h.skill : '完成成就解锁'}</div>
                </div>`;
            }).join('');
        }

        // 更新进度页面
        function updateProgressStats() {
            document.getElementById('progress-highscore').textContent = playerProgress.highScore;
            document.getElementById('progress-level').textContent = playerProgress.currentLevel;
            document.getElementById('progress-words').textContent = playerProgress.totalWordsLearned;
            document.getElementById('progress-accuracy').textContent = playerProgress.accuracyRate.toFixed(0) + '%';
            
            const achievementsGrid = document.getElementById('achievements-grid');
            achievementsGrid.innerHTML = achievements.map(a => {
                const unlocked = playerProgress.achievements.includes(a.id);
                return `<div class="achievement-item ${unlocked ? 'unlocked' : ''}">
                    <div class="achievement-emoji">${a.icon}</div>
                    <div class="achievement-name">${a.name}</div>
                    <div class="achievement-desc">${a.description}</div>
                </div>`;
            }).join('');
        }

        // 游戏核心逻辑
        function getRandomWord(maxDifficulty) {
            const available = words.filter(w => w.difficulty <= maxDifficulty);
            return available[Math.floor(Math.random() * available.length)];
        }

        function updateHUD() {
            document.getElementById('hud-wave').textContent = `${gameState.wave}/15`;
            document.getElementById('hud-score').textContent = `💰 ${gameState.score}`;
            
            const livesContainer = document.getElementById('hud-lives');
            livesContainer.innerHTML = Array.from({ length: 10 }).map((_, i) => 
                `<span class="heart ${i < gameState.lives ? '' : 'empty'}">❤️</span>`
            ).join('');
        }

        function renderGrid() {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            
            for (let y = 0; y < 5; y++) {
                for (let x = 0; x < 5; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    cell.onclick = () => handleCellClick(x, y);
                    
                    if (x === 4 && y === 2) {
                        cell.innerHTML = '<span style="font-size: 28px;">🏠</span>';
                        cell.style.background = 'rgba(239, 68, 68, 0.2)';
                    }
                    
                    grid.appendChild(cell);
                }
            }
        }

        function renderHeroes() {
            const battlefield = document.getElementById('battlefield');
            document.querySelectorAll('.placed-hero').forEach(el => el.remove());
            
            gameState.heroPositions.forEach(pos => {
                const hero = heroes.find(h => h.id === pos.heroId);
                if (!hero) return;
                
                const heroEl = document.createElement('div');
                heroEl.className = 'placed-hero';
                heroEl.textContent = hero.emoji;
                heroEl.style.left = (pos.x * 20 + 5) + '%';
                heroEl.style.top = (pos.y * 20 + 5) + '%';
                battlefield.appendChild(heroEl);
                
                const cell = document.querySelector(`[data-x="${pos.x}"][data-y="${pos.y}"]`);
                if (cell) cell.classList.add('has-hero');
            });
        }

        function renderEnemyOptions() {
            const options = document.getElementById('hero-options');
            options.innerHTML = heroes.map(h => {
                const unlocked = playerProgress.unlockedHeroes.includes(h.id);
                const canAfford = gameState.score >= h.cost;
                const isSelected = gameState.selectedHero === h.id;
                
                return `<div class="hero-option ${!unlocked || !canAfford ? 'disabled' : ''} ${isSelected ? 'selected' : ''}" onclick="${unlocked && canAfford ? `selectHero('${h.id}')` : ''}">
                    <div class="hero-option-emoji">${h.emoji}</div>
                    <div class="hero-option-info">
                        <div class="hero-option-name">${h.name}</div>
                        <div class="hero-option-desc">${h.skill} | 伤害: ${h.damage}</div>
                    </div>
                    <div class="hero-option-cost">💰 ${h.cost}</div>
                </div>`;
            }).join('');
        }

        function selectHero(heroId) {
            if (gameState.selectedHero === heroId) {
                gameState.selectedHero = null;
            } else {
                gameState.selectedHero = heroId;
            }
            renderEnemyOptions();
        }

        function handleCellClick(x, y) {
            if (!gameState.selectedHero) return;
            
            const hero = heroes.find(h => h.id === gameState.selectedHero);
            if (!hero || gameState.score < hero.cost) return;
            
            const occupied = gameState.heroPositions.some(p => p.x === x && p.y === y);
            if (occupied) return;
            
            gameState.score -= hero.cost;
            gameState.heroPositions.push({ heroId: hero.id, x, y });
            gameState.selectedHero = null;
            
            updateHUD();
            renderHeroes();
            renderEnemyOptions();
        }

        function updateSpelling() {
            const word = gameState.currentWord;
            if (!word) return;
            
            document.getElementById('spelling-meaning').textContent = word.meaning;
            
            const blanks = document.getElementById('spelling-blanks');
            blanks.innerHTML = word.word.split('').map(() => 
                '<div class="blank-box">_</div>'
            ).join('');
            
            const input = document.getElementById('spelling-input');
            input.value = '';
            input.className = 'spelling-input';
            input.focus();
            
            document.getElementById('spelling-feedback').style.display = 'none';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter') {
                checkSpelling();
            }
        }

        function checkSpelling() {
            const input = document.getElementById('spelling-input');
            const userInput = input.value.toLowerCase().trim();
            const word = gameState.currentWord;
            
            if (!word || !userInput) return;
            
            gameState.totalAttempts++;
            
            const feedback = document.getElementById('spelling-feedback');
            
            if (userInput === word.word.toLowerCase()) {
                gameState.correctCount++;
                gameState.wordsLearned.add(word.id);
                
                const points = word.difficulty * 10 + 5;
                gameState.score += points;
                
                input.className = 'spelling-input correct';
                feedback.textContent = `✅ 正确! +${points}分`;
                feedback.className = 'feedback success';
                feedback.style.display = 'block';
                
                setTimeout(() => {
                    gameState.currentWord = getRandomWord(Math.min(gameState.wave + 1, 5));
                    updateSpelling();
                }, 1000);
            } else {
                gameState.lives--;
                input.className = 'spelling-input error';
                feedback.textContent = `❌ 错误! 正确答案: ${word.word}`;
                feedback.className = 'feedback error';
                feedback.style.display = 'block';
                
                setTimeout(() => {
                    input.className = 'spelling-input';
                    feedback.style.display = 'none';
                }, 2000);
            }
            
            updateHUD();
            checkGameOver();
        }

        let enemyIdCounter = 0;
        function spawnEnemy() {
            if (gameState.enemiesSpawned >= gameState.totalEnemies) return;
            
            const types = ['normal'];
            if (gameState.wave >= 3) types.push('fast');
            if (gameState.wave >= 5) types.push('tank');
            if (gameState.wave >= 10) types.push('boss');
            
            const type = types[Math.floor(Math.random() * types.length)];
            const baseHealth = { normal: 30, fast: 20, tank: 80, boss: 200 };
            const speed = { normal: 0.5, fast: 1.2, tank: 0.2, boss: 0.3 };
            const reward = { normal: 10, fast: 15, tank: 30, boss: 100 };
            const emoji = { normal: '👾', fast: '👻', tank: '🧟', boss: '👹' };
            
            const enemy = {
                id: `enemy-${++enemyIdCounter}`,
                type,
                health: baseHealth[type] * (1 + (gameState.wave - 1) * 0.2),
                maxHealth: baseHealth[type] * (1 + (gameState.wave - 1) * 0.2),
                speed: speed[type],
                x: -1,
                y: Math.floor(Math.random() * 5),
                reward: reward[type],
                emoji: emoji[type],
            };
            
            gameState.enemies.push(enemy);
            gameState.enemiesSpawned++;
            renderEnemies();
        }

        function renderEnemies() {
            const battlefield = document.getElementById('battlefield');
            document.querySelectorAll('.enemy').forEach(el => el.remove());
            
            gameState.enemies.forEach(enemy => {
                const enemyEl = document.createElement('div');
                enemyEl.className = 'enemy';
                enemyEl.textContent = enemy.emoji;
                enemyEl.style.left = (enemy.x * 20) + '%';
                enemyEl.style.top = (enemy.y * 20 + 5) + '%';
                
                const healthBar = document.createElement('div');
                healthBar.className = 'enemy-health';
                healthBar.innerHTML = `<div class="enemy-health-bar" style="width: ${(enemy.health / enemy.maxHealth) * 100}%"></div>`;
                enemyEl.appendChild(healthBar);
                
                battlefield.appendChild(enemyEl);
            });
        }

        function updateEnemies() {
            gameState.enemies.forEach(enemy => {
                enemy.x += enemy.speed * 0.1;
            });
            
            gameState.heroPositions.forEach(pos => {
                gameState.enemies.forEach(enemy => {
                    if (Math.abs(enemy.x - pos.x) < 0.8) {
                        const hero = heroes.find(h => h.id === pos.heroId);
                        if (hero) {
                            enemy.health -= hero.damage * 0.1;
                        }
                    }
                });
            });
            
            const reachedBase = gameState.enemies.filter(e => e.x >= 5);
            reachedBase.forEach(() => {
                gameState.lives--;
                updateHUD();
                checkGameOver();
            });
            
            gameState.enemies = gameState.enemies.filter(e => e.x < 5 && e.health > 0);
            
            gameState.enemies.forEach(enemy => {
                if (enemy.health <= 0) {
                    gameState.score += enemy.reward;
                    updateHUD();
                }
            });
            
            renderEnemies();
            
            if (gameState.enemies.length === 0 && gameState.enemiesSpawned >= gameState.totalEnemies) {
                setTimeout(() => {
                    nextWave();
                }, 2000);
            }
        }

        function nextWave() {
            gameState.wave++;
            
            if (gameState.wave > 15) {
                endGame(true);
                return;
            }
            
            gameState.totalEnemies = 5 + gameState.wave * 2;
            gameState.enemiesSpawned = 0;
            gameState.currentWord = getRandomWord(Math.min(gameState.wave + 1, 5));
            
            updateHUD();
            updateSpelling();
        }

        function checkGameOver() {
            if (gameState.lives <= 0) {
                endGame(false);
            }
        }

        function endGame(victory) {
            gameState.isGameOver = true;
            gameState.isVictory = victory;
            
            if (gameState.score > playerProgress.highScore) {
                playerProgress.highScore = gameState.score;
            }
            if (gameState.wave > playerProgress.currentLevel) {
                playerProgress.currentLevel = gameState.wave;
            }
            playerProgress.totalWordsLearned += gameState.wordsLearned.size;
            playerProgress.accuracyRate = gameState.totalAttempts > 0 
                ? (gameState.correctCount / gameState.totalAttempts) * 100 
                : playerProgress.accuracyRate;
            
            checkAchievements();
            saveProgress();
            
            const overlay = document.getElementById('game-over-overlay');
            document.getElementById('game-over-emoji').textContent = victory ? '🎉' : '💔';
            document.getElementById('game-over-title').textContent = victory ? '胜利！' : '游戏结束';
            document.getElementById('game-over-score').textContent = `得分：${gameState.score} | 波次：${gameState.wave}`;
            overlay.style.display = 'flex';
        }

        function checkAchievements() {
            if (playerProgress.totalWordsLearned > 0 && !playerProgress.achievements.includes('a1')) {
                playerProgress.achievements.push('a1');
            }
            if (playerProgress.totalWordsLearned >= 20 && !playerProgress.achievements.includes('a2')) {
                playerProgress.achievements.push('a2');
            }
            if (playerProgress.accuracyRate >= 80 && !playerProgress.achievements.includes('a3')) {
                playerProgress.achievements.push('a3');
            }
            if (playerProgress.currentLevel >= 5 && !playerProgress.achievements.includes('a4')) {
                playerProgress.achievements.push('a4');
            }
            if (playerProgress.highScore >= 500 && !playerProgress.achievements.includes('a5')) {
                playerProgress.achievements.push('a5');
            }
            if (playerProgress.unlockedHeroes.length >= 6 && !playerProgress.achievements.includes('a6')) {
                playerProgress.achievements.push('a6');
            }
            
            if (playerProgress.currentLevel >= 3 && !playerProgress.unlockedHeroes.includes('h4')) {
                playerProgress.unlockedHeroes.push('h4');
            }
            if (playerProgress.currentLevel >= 6 && !playerProgress.unlockedHeroes.includes('h5')) {
                playerProgress.unlockedHeroes.push('h5');
            }
            if (playerProgress.currentLevel >= 10 && !playerProgress.unlockedHeroes.includes('h6')) {
                playerProgress.unlockedHeroes.push('h6');
            }
        }

        function restartGame() {
            document.getElementById('game-over-overlay').style.display = 'none';
            startGame();
        }

        // 游戏循环
        let gameLoopId;
        function startGameLoop() {
            gameLoopId = setInterval(() => {
                if (!gameState.isGameOver) {
                    updateEnemies();
                    if (Math.random() < 0.02 * gameState.wave) {
                        spawnEnemy();
                    }
                }
            }, 100);
        }

        function stopGameLoop() {
            clearInterval(gameLoopId);
        }

        function startGame() {
            stopGameLoop();
            
            gameState = {
                wave: 1,
                score: 0,
                lives: 10,
                heroPositions: [],
                enemies: [],
                currentWord: null,
                selectedHero: null,
                isGameOver: false,
                isVictory: false,
                enemiesSpawned: 0,
                totalEnemies: 5,
                correctCount: 0,
                totalAttempts: 0,
                wordsLearned: new Set(),
            };
            
            gameState.currentWord = getRandomWord(1);
            
            renderGrid();
            renderHeroes();
            renderEnemyOptions();
            updateHUD();
            updateSpelling();
            
            showPage('game-page');
            startGameLoop();
        }

        // 初始化
        loadProgress();
        updateHomeStats();
    </script>
</body>
</html>
