/* ---------- Store ---------- */
const Store = {
  data: null,
  init() {
    const raw = localStorage.getItem('wardrobe_app_data');
    if (raw) { try { this.data = JSON.parse(raw); } catch (e) { this.data = JSON.parse(JSON.stringify(SEED)); this.seedWearLogs(); this.save(); } }
    else { this.data = JSON.parse(JSON.stringify(SEED)); this.seedWearLogs(); this.save(); }
  },
  seedWearLogs() {
    this.data.wear_logs = [];
    const outfits = this.data.outfits;
    for (let i = 0; i < 30; i++) {
      if (Math.random() > 0.45) {
        const o = outfits[Math.floor(Math.random() * outfits.length)];
        o.garment_ids.forEach(gid => { this.data.wear_logs.push({ id: uid('wl'), garment_id: gid, outfit_id: o.id, worn_date: daysAgo(i), source: 'calendar' }); });
      }
    }
    this.recountWear();
  },
  recountWear() {
    const counts = {}, lastWorn = {};
    this.data.wear_logs.forEach(l => { counts[l.garment_id] = (counts[l.garment_id] || 0) + 1; if (!lastWorn[l.garment_id] || l.worn_date > lastWorn[l.garment_id]) lastWorn[l.garment_id] = l.worn_date; });
    this.data.garments.forEach(g => { g.wear_count = counts[g.id] || 0; g.last_worn_date = lastWorn[g.id] || null; });
  },
  save() { localStorage.setItem('wardrobe_app_data', JSON.stringify(this.data)); },
  get(k) { return this.data[k]; },
  set(k, v) { this.data[k] = v; this.save(); },
  addGarment(g) { g.id = uid('g'); g.created_at = today(); g.wear_count = 0; g.last_worn_date = null; this.data.garments.unshift(g); this.save(); return g; },
  updateGarment(id, patch) { const g = this.data.garments.find(x => x.id === id); if (g) { Object.assign(g, patch, { updated_at: today() }); this.save(); } },
  deleteGarment(id) { this.data.garments = this.data.garments.filter(g => g.id !== id); this.data.wear_logs = this.data.wear_logs.filter(l => l.garment_id !== id); this.save(); },
  getGarment(id) { return this.data.garments.find(g => g.id === id); },
  addLocation(loc) { loc.id = uid('l'); loc.created_at = today(); this.data.locations.push(loc); this.save(); return loc; },
  getLocation(id) { return this.data.locations.find(l => l.id === id); },
  getLocationPath(id) { if (!id) return '未设置'; const loc = this.getLocation(id); return loc ? loc.path : '未知位置'; },
  moveGarments(ids, newLocId) { ids.forEach(id => { const g = this.getGarment(id); if (g) g.location_id = newLocId; }); this.save(); },
  deleteLocation(id) {
    this.data.garments.forEach(g => { if (g.location_id === id) g.location_id = null; });
    const children = this.data.locations.filter(l => l.parent_id === id);
    children.forEach(c => this.deleteLocation(c.id));
    this.data.locations = this.data.locations.filter(l => l.id !== id);
    this.save();
  },
  addOutfit(o) { o.id = uid('o'); o.created_at = today(); this.data.outfits.unshift(o); this.save(); return o; },
  getOutfit(id) { return this.data.outfits.find(o => o.id === id); },
  logWear(gid, oid, date, source = 'manual') {
    if (this.data.wear_logs.some(l => l.garment_id === gid && l.worn_date === date)) return false;
    this.data.wear_logs.push({ id: uid('wl'), garment_id: gid, outfit_id: oid, worn_date: date, source });
    const g = this.getGarment(gid); if (g) { g.wear_count = (g.wear_count || 0) + 1; g.last_worn_date = date; }
    this.save(); return true;
  },
  unlogWear(date, oid) {
    this.data.wear_logs = this.data.wear_logs.filter(l => !(l.worn_date === date && l.outfit_id === oid));
    this.recountWear(); this.save();
  },
  getWornDates() { const s = new Set(); this.data.wear_logs.forEach(l => s.add(l.worn_date)); return s; },
  getOutfitsByDate(date) { const ids = new Set(); this.data.wear_logs.filter(l => l.worn_date === date).forEach(l => { if (l.outfit_id) ids.add(l.outfit_id); }); return Array.from(ids).map(id => this.getOutfit(id)).filter(Boolean); },
  addFeedback(fb) { fb.id = uid('fb'); fb.created_at = today(); this.data.feedback.unshift(fb); this.save(); },
  addPlan(p) { p.id = uid('p'); p.created_at = today(); this.data.plans.unshift(p); this.save(); return p; },
  export() { return JSON.stringify(this.data, null, 2); },
  clear() { localStorage.removeItem('wardrobe_app_data'); this.data = JSON.parse(JSON.stringify(SEED)); this.seedWearLogs(); this.save(); },
};

<script id="engine-code">
/* ---------- 推荐引擎 ---------- */
const Engine = {
  generateOutfits(opts = {}) {
    const { temp = 22, scene = 'commute' } = opts;
    const garments = Store.get('garments').filter(g => g.status === 'in_use');
    if (garments.length < 5) return { outfits: [], reason: '衣物不足 5 件，请先录入更多衣物' };
    const byCat = {};
    garments.forEach(g => { if (!byCat[g.category]) byCat[g.category] = []; byCat[g.category].push(g); });
    const tops = byCat.top || [], bottoms = [...(byCat.bottom || []), ...(byCat.dress || [])], shoes = byCat.shoes || [], outers = byCat.outer || [], bags = byCat.bag || [];
    if (!tops.length || !bottoms.length || !shoes.length) {
      const missing = [];
      if (!tops.length) missing.push('上装'); if (!bottoms.length) missing.push('下装/裙装'); if (!shoes.length) missing.push('鞋履');
      return { outfits: [], reason: `缺少品类：${missing.join('、')}，请录入后再试` };
    }
    const combos = [];
    for (const t of tops.slice(0, 4)) {
      for (const b of bottoms.slice(0, 3)) {
        for (const s of shoes.slice(0, 2)) {
          const combo = { top: t, bottom: b, shoes: s };
          if (outers.length && Math.random() > 0.5) combo.outer = outers[Math.floor(Math.random() * Math.min(outers.length, 2))];
          if (bags.length && Math.random() > 0.4) combo.bag = bags[Math.floor(Math.random() * Math.min(bags.length, 2))];
          combos.push(combo);
          if (combos.length >= 12) break;
        }
        if (combos.length >= 12) break;
      }
      if (combos.length >= 12) break;
    }
    const scored = combos.map(c => {
      const items = [c.top, c.bottom, c.shoes, c.outer, c.bag].filter(Boolean);
      const scores = {};
      scores.weather = clamp(1 - Math.abs(temp - 22) / 20, 0.3, 1);
      if (temp < 12 && !c.outer) scores.weather *= 0.5;
      if (temp > 28 && c.outer && c.outer.subcategory !== 'cardigan') scores.weather *= 0.6;
      const colors = items.map(i => i.colors[0]);
      const neutralCount = colors.filter(co => ['white', 'black', 'gray', 'beige', 'navy', 'khaki'].includes(co)).length;
      scores.color = neutralCount >= 2 ? 0.9 : (neutralCount === 1 ? 0.7 : 0.5);
      scores.completeness = items.length / 5;
      scores.scene = items.filter(i => i.scenes.includes(scene) || i.scenes.length >= 3).length / items.length;
      scores.freshness = clamp(1 - items.reduce((s, i) => s + (i.wear_count || 0), 0) / (items.length * 50), 0.2, 1);
      scores.idle = items.reduce((s, i) => { const idle = i.last_worn_date ? daysBetween(i.last_worn_date, today()) : 30; return s + clamp(idle / 30, 0, 1); }, 0) / items.length;
      const total = 0.25 * scores.weather + 0.20 * scores.color + 0.15 * scores.completeness + 0.15 * scores.scene + 0.10 * 0.7 + 0.10 * scores.freshness + 0.05 * scores.idle;
      const reasonMap = [];
      if (scores.weather > 0.8) reasonMap.push(`${temp}℃ 适宜当前天气`);
      if (scores.color > 0.85) reasonMap.push('中性色协调耐看');
      if (scores.scene > 0.8) reasonMap.push(`${SCENES[scene]}场景匹配`);
      if (scores.idle > 0.6) reasonMap.push(`${items[0].name} ${daysBetween(items[0].last_worn_date || items[0].created_at, today())}天未穿`);
      if (reasonMap.length < 2) reasonMap.push('基础搭配组合');
      return { garment_ids: items.map(i => i.id), score: total, reasons: reasonMap.slice(0, 3), scene, weather_range: [temp - 4, temp + 4], source: 'recommend' };
    });
    scored.sort((a, b) => b.score - a.score);
    const seen = new Set(), top3 = [];
    for (const s of scored) { const key = s.garment_ids[0]; if (seen.has(key)) continue; seen.add(key); top3.push(s); if (top3.length >= 3) break; }
    return { outfits: top3, reason: null };
  },
  generateCapsule(opts = {}) {
    const { startDate = today(), scene = 'commute', laundry = false } = opts;
    const garments = Store.get('garments').filter(g => g.status === 'in_use');
    const days = [], usedTops = new Set(), usedBottoms = new Set();
    for (let i = 0; i < 7; i++) {
      const date = new Date(startDate); date.setDate(date.getDate() + i);
      const d = date.toISOString().slice(0, 10);
      const top = garments.find(g => g.category === 'top' && !usedTops.has(g.id)); if (top) usedTops.add(top.id);
      const bottom = garments.find(g => ['bottom', 'dress'].includes(g.category) && (laundry || !usedBottoms.has(g.id))); if (bottom && !laundry) usedBottoms.add(bottom.id);
      const shoes = garments.find(g => g.category === 'shoes');
      const outer = i % 3 === 0 ? garments.find(g => g.category === 'outer') : null;
      const items = [top, bottom, shoes, outer].filter(Boolean);
      days.push({ date: d, items, repeat: false });
    }
    const allItems = days.flatMap(d => d.items.map(i => i.id));
    const uniqueItems = new Set(allItems).size;
    const repeatRate = ((allItems.length - uniqueItems) / allItems.length * 100).toFixed(0);
    const issues = [];
    const bottomIds = days.map(d => d.items.find(i => ['bottom', 'dress'].includes(i.category))?.id).filter(Boolean);
    if (new Set(bottomIds).size < 3 && !laundry) issues.push('下装复用较多，建议允许洗衣以增加多样性');
    const noShoes = days.findIndex(d => !d.items.some(i => i.category === 'shoes'));
    if (noShoes >= 0) issues.push(`第${noShoes + 1}天缺少鞋履`);
    return { days, repeatRate, uniqueItems, issues, scenes: [scene] };
  },
  generateTrip(opts = {}) {
    const { city = '上海', startDate = today(), days = 5, scenes = ['travel', 'commute'], laundry = false } = opts;
    const garments = Store.get('garments').filter(g => g.status === 'in_use');
    const dailyOutfits = [], usedTops = new Set();
    for (let i = 0; i < days; i++) {
      const date = new Date(startDate); date.setDate(date.getDate() + i);
      const d = date.toISOString().slice(0, 10);
      const top = garments.find(g => g.category === 'top' && !usedTops.has(g.id)) || garments.find(g => g.category === 'top'); if (top) usedTops.add(top.id);
      const bottom = garments.find(g => g.category === 'bottom');
      const shoes = i === 0 ? garments.find(g => g.category === 'shoes') : null;
      const outer = i < 2 ? garments.find(g => g.category === 'outer') : null;
      dailyOutfits.push({ date: d, day: i + 1, items: [top, bottom, shoes, outer].filter(Boolean) });
    }
    const packingMap = new Map();
    dailyOutfits.forEach(d => d.items.forEach(item => { if (!packingMap.has(item.id)) packingMap.set(item.id, { item, count: 1 }); else packingMap.get(item.id).count++; }));
    const generalChecklist = [
      { item: '身份证/护照', category: '证件', checked: false }, { item: '银行卡/现金', category: '证件', checked: false },
      { item: '手机充电器', category: '电子设备', checked: false }, { item: '充电宝', category: '电子设备', checked: false },
      { item: '牙刷/牙膏', category: '洗护', checked: false }, { item: '洗面奶', category: '洗护', checked: false },
      { item: '护肤品旅行装', category: '洗护', checked: false }, { item: '雨伞', category: '其他', checked: false },
    ];
    return { city, startDate, days, dailyOutfits, clothingList: Array.from(packingMap.values()), generalChecklist, weatherNote: '天气为预测值，临近出发请刷新' };
  },
  stats(period = 30) {
    const garments = Store.get('garments').filter(g => g.status === 'in_use');
    const wearLogs = Store.get('wear_logs'); const since = daysAgo(period);
    const cpwList = garments.map(g => {
      const cpw = g.price && g.wear_count > 0 ? g.price / g.wear_count : null;
      const idle = g.last_worn_date ? daysBetween(g.last_worn_date, today()) : daysBetween(g.created_at, today());
      return { ...g, cpw, idle };
    });
    const wornInPeriod = new Set();
    wearLogs.filter(l => l.worn_date >= since).forEach(l => wornInPeriod.add(l.garment_id));
    const utilization = garments.length > 0 ? (wornInPeriod.size / garments.length * 100).toFixed(0) : 0;
    const idle = cpwList.filter(g => g.idle > 30).sort((a, b) => b.idle - a.idle);
    const catDist = {}; garments.forEach(g => catDist[g.category] = (catDist[g.category] || 0) + 1);
    const colorDist = {}; garments.forEach(g => { const c = g.colors[0] || 'other'; colorDist[c] = (colorDist[c] || 0) + 1; });
    const validCpw = cpwList.filter(g => g.cpw !== null);
    return {
      total: garments.length, utilization, idle, catDist, colorDist, cpwList,
      cpwBest: validCpw.filter(g => g.cpw < 50).length, cpwWorst: validCpw.filter(g => g.cpw > 200).length,
      avgCpw: validCpw.length > 0 ? (validCpw.reduce((s, g) => s + g.cpw, 0) / validCpw.length).toFixed(1) : 0,
      periodWorn: wornInPeriod.size,
    };
  },
};

        </div>
        <div class="p-5">${contentHtml}</div>
        ${footerHtml ? `<div class="sticky bottom-0 bg-cream border-t border-sand px-5 py-4">${footerHtml}</div>` : ''}
      </div></div>`;
  },
  fab(icon = 'plus', onclick = 'Router.go("wardrobe/upload")') { return `<button class="fab" onclick="${onclick}">${this.icon(icon, 26)}</button>`; },
  progressBar(value, max = 100, color = 'var(--ink)') { const pct = clamp(value / max * 100, 0, 100); return `<div class="w-full h-2 bg-sand rounded-full overflow-hidden"><div class="h-full rounded-full transition-all" style="width:${pct}%;background:${color}"></div></div>`; },
};
function closeModal() { const m = $('#modal-root'); if (m) m.innerHTML = ''; }
function openModal(title, contentHtml, footerHtml = '') { let root = $('#modal-root'); if (!root) { root = document.createElement('div'); root.id = 'modal-root'; document.body.appendChild(root); } root.innerHTML = C.modal(title, contentHtml, footerHtml); lucide.createIcons(); }
</script>
<script id="pages-code">
const Pages = {};

/* ---------- 今日 ---------- */
Pages.today = {
  render() {
    const user = Store.get('user');
    const outfits = Store.get('outfits');
    const plans = Store.get('plans');
    const todayOutfit = outfits[0];
    const wornDates = Store.getWornDates();
    const wornThisWeek = [0,1,2,3,4,5,6].map(i => daysAgo(-i)).filter(d => wornDates.has(d)).length;
    const weather = { city: user.city, temp: 24, desc: '多云', range: [20, 27], suggest: '薄外套+长袖，舒适宜出行' };
    return `<div class="fade-in px-4 pt-6 pb-24 lg:pb-8 max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-5">
        <div><div class="text-xs text-stone mb-1">${new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' })}</div>
        <h1 class="font-serif text-2xl text-coffee">你好，${user.nickname}</h1></div>
        <div class="w-10 h-10 rounded-full bg-ink flex items-center justify-center text-cream font-serif">${user.nickname[0]}</div>
      </div>
      <div class="rounded-2xl p-5 mb-5 relative overflow-hidden" style="background:linear-gradient(135deg,#2D4A3E 0%,#4A6B5C 100%);color:#FFFCF7">
        <div class="absolute -right-6 -top-6 w-32 h-32 rounded-full" style="background:rgba(255,252,247,0.08)"></div>
        <div class="absolute right-10 bottom-2 w-20 h-20 rounded-full" style="background:rgba(255,252,247,0.06)"></div>
        <div class="relative"><div class="flex items-start justify-between mb-2">
          <div><div class="text-sm opacity-80">${weather.city}</div>
          <div class="flex items-baseline gap-2 mt-1"><span class="font-mono text-5xl font-medium">${weather.temp}</span><span class="text-lg">°C</span></div></div>
          <div class="text-right">${C.icon('cloud-sun', 40)}<div class="text-sm mt-1">${weather.desc}</div><div class="text-xs opacity-70 font-mono">${weather.range[0]}-${weather.range[1]}°C</div></div>
        </div><div class="mt-3 pt-3 border-t border-cream/20 text-sm">${weather.suggest}</div></div>
      </div>
      ${C.sectionTitle('今日搭配', `<button class="text-xs text-stone flex items-center gap-1" onclick="Router.go('outfit/recommend')">${C.icon('refresh-cw', 14)}换一套</button>`)}
      ${todayOutfit ? `<div class="card p-4 mb-5 card-hover cursor-pointer" onclick="Router.go('outfit/board')">
        <div class="flex gap-3 mb-3 overflow-x-auto scrollbar-hide">${todayOutfit.garment_ids.map(id => { const g = Store.getGarment(id); return g ? `<div class="flex-shrink-0">${C.garmentThumb(g, 70)}</div>` : ''; }).join('')}</div>
        <div class="flex items-center gap-2 mb-3"><span class="chip">${SCENES[todayOutfit.scene] || '日常'}</span><span class="text-xs text-stone font-mono">${todayOutfit.weather_range ? todayOutfit.weather_range[0] + '-' + todayOutfit.weather_range[1] + '℃' : ''}</span></div>
        <div class="flex gap-2"><button class="btn-primary flex-1 text-sm flex items-center justify-center gap-1.5" onclick="event.stopPropagation();Pages.today.wearToday('${todayOutfit.id}')">${C.icon('check', 16)}今天穿了</button>
        <button class="btn-outline flex-1 text-sm" onclick="event.stopPropagation();Router.go('outfit/board')">查看详情</button></div>
      </div>` : C.emptyState('shirt', '还没有搭配', '去搭配工作台创建第一套穿搭', `<button class="btn-primary px-6 text-sm" onclick="Router.go('outfit/board')">开始搭配</button>`)}
      ${C.sectionTitle('快捷入口')}
      <div class="grid grid-cols-4 gap-3 mb-5">
        ${[{ icon: 'search', label: '找衣服', route: 'wardrobe', color: '#2D4A3E' },{ icon: 'sparkles', label: '生成搭配', route: 'outfit/recommend', color: '#C8643C' },{ icon: 'plane', label: '旅行计划', route: 'outfit/trip', color: '#4A6B5C' },{ icon: 'trending-down', label: '断舍离', route: 'profile/stats', color: '#8B5A8C' }].map(i => `
          <button onclick="Router.go('${i.route}')" class="card card-hover flex flex-col items-center justify-center py-3 gap-1.5">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${i.color}15;color:${i.color}">${C.icon(i.icon, 20)}</div>
            <span class="text-xs text-coffee">${i.label}</span></button>`).join('')}
      </div>
      ${C.sectionTitle('最近计划', `<button class="text-xs text-stone" onclick="Router.go('outfit')">全部</button>`)}
      <div class="space-y-3">
        ${plans.slice(0, 2).map(p => p.type === 'capsule' ? `
          <div class="card card-hover p-4 cursor-pointer flex items-center gap-3" onclick="Router.go('outfit/capsule')">
            <div class="w-12 h-12 rounded-xl bg-moss/15 flex items-center justify-center text-moss">${C.icon('layers', 22)}</div>
            <div class="flex-1"><div class="text-sm font-medium text-coffee">7 天胶囊衣橱</div><div class="text-xs text-stone">${fmtDate(p.start_date)} - ${fmtDate(p.end_date)} · ${(p.scenes || []).map(s => SCENES[s]).join('、')}</div></div>
            ${C.icon('chevron-right', 18)}</div>` : `
          <div class="card card-hover p-4 cursor-pointer flex items-center gap-3" onclick="Router.go('outfit/trip')">
            <div class="w-12 h-12 rounded-xl bg-brick/15 flex items-center justify-center text-brick">${C.icon('plane', 22)}</div>
            <div class="flex-1"><div class="text-sm font-medium text-coffee">${p.city}旅行计划</div><div class="text-xs text-stone">${fmtDate(p.start_date)} · ${daysBetween(p.start_date, p.end_date) + 1}天</div></div>
            ${C.icon('chevron-right', 18)}</div>`).join('') || C.emptyState('calendar', '暂无计划', '创建胶囊衣橱或旅行计划', '')}
      </div>
      <div class="mt-5 card p-4"><div class="flex items-center justify-between mb-2"><span class="text-sm text-stone">本周穿着记录</span><span class="font-mono text-2xl text-ink">${wornThisWeek}<span class="text-sm text-stone">/7天</span></span></div>${C.progressBar(wornThisWeek, 7)}</div>
    </div>`;
  },
  wearToday(outfitId) {
    const o = Store.getOutfit(outfitId); if (!o) return;
    let added = 0, skipped = 0;
    o.garment_ids.forEach(gid => { if (Store.logWear(gid, outfitId, today(), 'calendar')) added++; else skipped++; });
    toast(added > 0 ? `已记录今日穿着 ${added} 件单品${skipped > 0 ? '（' + skipped + '件今日已记录）' : ''}` : '今日已记录过该搭配');
    App.render('today');
  },
};

/* ---------- 衣橱 ---------- */
Pages.wardrobe = {
  filter: { category: 'all', color: 'all', season: 'all', status: 'all', search: '' },
  render() {
    const garments = Store.get('garments');
    const filtered = this.applyFilter(garments);
    const locations = Store.get('locations');
    const wardrobes = Store.get('wardrobes');
    return `<div class="fade-in px-4 pt-6 pb-24 lg:pb-8 max-w-4xl mx-auto">
      <div class="flex items-center justify-between mb-4">
        <div><h1 class="font-serif text-2xl text-coffee">我的衣橱</h1><div class="text-xs text-stone mt-0.5">${garments.filter(g => g.status === 'in_use').length} 件在用 · ${garments.length} 件总计</div></div>
        <button class="w-10 h-10 rounded-full bg-ink text-cream flex items-center justify-center" onclick="Router.go('wardrobe/locations')">${C.icon('map-pin', 20)}</button>
      </div>
      <div class="relative mb-3"><div class="absolute left-3 top-1/2 -translate-y-1/2 text-stone">${C.icon('search', 18)}</div>
        <input type="text" placeholder="搜索单品名称、品牌、标签" value="${this.filter.search}" oninput="Pages.wardrobe.filter.search=this.value;Pages.wardrobe.refreshList()" class="w-full pl-10 pr-4 py-2.5 bg-cream border border-sand rounded-xl text-sm"></div>
      <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-2 mb-4">
        ${this.filterChip('品类', 'category', this.filter.category, { all: '全部', ...Object.fromEntries(Object.entries(CATEGORIES).map(([k, v]) => [k, v.label])) })}
        ${this.filterChip('颜色', 'color', this.filter.color, { all: '全部', ...Object.fromEntries(Object.entries(COLOR_LABELS).map(([k, v]) => [k, v])) })}
        ${this.filterChip('季节', 'season', this.filter.season, { all: '全部', ...Object.entries(SEASONS) })}
        ${this.filterChip('状态', 'status', this.filter.status, { all: '全部', ...Object.entries(STATUSES) })}
      </div>
      <div class="card p-3 mb-4 cursor-pointer card-hover" onclick="Router.go('wardrobe/locations')">
        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-sand flex items-center justify-center text-ink">${C.icon('map-pin', 20)}</div>
        <div class="flex-1"><div class="text-sm font-medium text-coffee">收纳位置</div><div class="text-xs text-stone">${wardrobes.length} 个柜体 · ${locations.length} 个位置</div></div>
        ${C.icon('chevron-right', 18)}</div>
      </div>
      <div id="wardrobe-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        ${filtered.length > 0 ? filtered.map(g => C.garmentCard(g)).join('') : C.emptyState('shirt', '没有匹配的衣物', '试试调整筛选条件')}
      </div>
      ${C.fab()}
    </div>`;
  },
  filterChip(label, key, current, options) {
    return `<select class="chip ${current !== 'all' ? 'chip-active' : ''} cursor-pointer" onchange="Pages.wardrobe.filter.${key}=this.value;App.render('wardrobe')">${Object.entries(options).map(([k, v]) => `<option value="${k}" ${k === current ? 'selected' : ''}>${k === 'all' ? label + '·全部' : v}</option>`).join('')}</select>`;
  },
  applyFilter(garments) {
    return garments.filter(g => {
      if (this.filter.category !== 'all' && g.category !== this.filter.category) return false;
      if (this.filter.color !== 'all' && !g.colors.includes(this.filter.color)) return false;
      if (this.filter.season !== 'all' && !g.seasons.includes(this.filter.season)) return false;
      if (this.filter.status !== 'all' && g.status !== this.filter.status) return false;
      if (this.filter.search) { const q = this.filter.search.toLowerCase(); const h = [g.name, g.brand, ...(g.tags || [])].join(' ').toLowerCase(); if (!h.includes(q)) return false; }
      return true;
    });
  },
  refreshList() {
    const grid = $('#wardrobe-grid'); if (!grid) return;
    const garments = Store.get('garments');
    const filtered = this.applyFilter(garments);
    grid.innerHTML = filtered.length > 0 ? filtered.map(g => C.garmentCard(g)).join('') : C.emptyState('shirt', '没有匹配的衣物', '试试调整筛选条件');
    lucide.createIcons();
  },
};

/* ---------- 批量录入 ---------- */
Pages.upload = {
  drafts: [], step: 'select',
  render() {
    return `<div class="fade-in px-4 pt-6 pb-24 lg:pb-8 max-w-2xl mx-auto">
      <div class="flex items-center gap-3 mb-5"><button onclick="Router.go('wardrobe')" class="w-9 h-9 rounded-full bg-sand flex items-center justify-center">${C.icon('arrow-left', 18)}</button><h1 class="font-serif text-2xl text-coffee">批量录入</h1></div>
      <div id="upload-content">${this.renderStep()}</div></div>`;
  },
  renderStep() { if (this.step === 'select') return this.renderSelect(); if (this.step === 'processing') return this.renderProcessing(); if (this.step === 'confirm') return this.renderConfirm(); },
  renderSelect() {
    return `<div class="card p-6 mb-4 text-center"><div class="w-16 h-16 rounded-full bg-sand flex items-center justify-center mx-auto mb-4 text-ink">${C.icon('camera', 28)}</div>
      <h3 class="font-serif text-lg text-coffee mb-1">拍照或选择相册</h3><p class="text-sm text-stone mb-5">支持 1-9 张图片，AI 自动抠图并识别品类</p>
      <div class="grid grid-cols-2 gap-3"><button class="btn-primary flex items-center justify-center gap-2" onclick="Pages.upload.simulateUpload('camera')">${C.icon('camera', 18)}拍照</button>
      <button class="btn-outline flex items-center justify-center gap-2" onclick="Pages.upload.simulateUpload('album')">${C.icon('image', 18)}从相册选择</button></div></div>
      <div class="card p-4"><div class="text-sm text-stone mb-2">演示模式：一键生成 3 件示例衣物</div><button class="btn-brick w-full text-sm" onclick="Pages.upload.simulateUpload('demo')">生成示例图片</button></div>
      <div class="mt-4 text-xs text-stone text-center">支持单张 ≤ 5MB，自动压缩至 ≤ 500KB</div>`;
  },
  simulateUpload(source) {
    this.step = 'processing'; this.drafts = [];
    const samples = [
      { name: '灰色卫衣', category: 'top', colors: ['gray'], seasons: ['spring', 'autumn', 'winter'], formality: 'casual', scenes: ['weekend', 'sport'], brand: 'Champion', price: 299 },
      { name: '黑色西裤', category: 'bottom', colors: ['black'], seasons: ['spring', 'autumn', 'winter'], formality: 'business', scenes: ['commute', 'formal'], brand: 'UNIQLO', price: 199 },
      { name: '棕色皮带', category: 'accessory', colors: ['brown'], seasons: ['spring', 'summer', 'autumn', 'winter'], formality: 'business', scenes: ['commute', 'formal'], brand: 'HUGO BOSS', price: 599 },
    ];
    this.drafts = samples.map(s => ({ ...s, status: 'pending', confidence: 0 }));
    App.render('upload');
    this.drafts.forEach((d, i) => {
      setTimeout(() => { d.status = 'cutting'; App.render('upload'); }, i * 800 + 300);
      setTimeout(() => { d.status = 'tagging'; App.render('upload'); }, i * 800 + 600);
      setTimeout(() => { d.status = 'done'; d.confidence = 0.75 + Math.random() * 0.2; App.render('upload'); if (i === this.drafts.length - 1) { setTimeout(() => { this.step = 'confirm'; App.render('upload'); }, 500); } }, i * 800 + 900);
    });
  },
  renderProcessing() {
    return `<div class="card p-6"><h3 class="font-serif text-lg text-coffee mb-1">AI 处理中...</h3><p class="text-sm text-stone mb-5">正在抠图和识别标签，请稍候</p>
      <div class="space-y-3">${this.drafts.map(d => `<div class="flex items-center gap-3 p-3 bg-cream rounded-xl">
        <div class="w-14 h-14 rounded-lg bg-sand flex items-center justify-center">${d.status === 'done' ? garmentImage(d, 50) : C.icon('loader', 22)}</div>
        <div class="flex-1"><div class="text-sm font-medium text-coffee">${d.name}</div>
        <div class="text-xs text-stone">${d.status === 'pending' ? '等待处理' : d.status === 'cutting' ? '抠图中...' : d.status === 'tagging' ? '识别标签...' : `识别完成 · 置信度 ${Math.round(d.confidence * 100)}%`}</div>
        ${d.status !== 'done' && d.status !== 'pending' ? `<div class="mt-1.5">${C.progressBar(d.status === 'cutting' ? 50 : 80)}</div>` : ''}</div>
        ${d.status === 'done' ? `<div class="text-moss">${C.icon('check-circle', 20)}</div>` : ''}</div>`).join('')}</div></div>`;
  },
  renderConfirm() {
    const locations = Store.get('locations');
    return `<div class="mb-4"><div class="text-sm text-stone mb-3">请确认以下 ${this.drafts.length} 件衣物的信息，可单独修改</div>
      <div class="space-y-3">${this.drafts.map((d, i) => `<div class="card p-4">
        <div class="flex gap-3 mb-3"><div class="garment-thumb w-20 h-20 flex items-center justify-center flex-shrink-0">${garmentImage(d, 70)}</div>
        <div class="flex-1"><input type="text" value="${d.name}" placeholder="衣物名称" oninput="Pages.upload.drafts[${i}].name=this.value" class="w-full bg-transparent border-b border-sand text-sm font-medium text-coffee mb-1.5 pb-1">
        <div class="text-xs text-stone">识别置信度 ${Math.round(d.confidence * 100)}%</div></div></div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="block"><span class="text-stone">品类</span><select class="w-full mt-1 p-2 bg-cream border border-sand rounded-lg text-coffee" onchange="Pages.upload.drafts[${i}].category=this.value">${Object.entries(CATEGORIES).map(([k, v]) => `<option value="${k}" ${k === d.category ? 'selected' : ''}>${v.label}</option>`).join('')}</select></label>
          <label class="block"><span class="text-stone">主色</span><select class="w-full mt-1 p-2 bg-cream border border-sand rounded-lg text-coffee" onchange="Pages.upload.drafts[${i}].colors=[this.value]">${Object.entries(COLOR_LABELS).map(([k, v]) => `<option value="${k}" ${d.colors[0] === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label class="block"><span class="text-stone">季节</span><select multiple class="w-full mt-1 p-2 bg-cream border border-sand rounded-lg text-coffee h-16" onchange="Pages.upload.drafts[${i}].seasons=Array.from(this.selectedOptions).map(o=>o.value)">${Object.entries(SEASONS).map(([k, v]) => `<option value="${k}" ${d.seasons.includes(k) ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label class="block"><span class="text-stone">收纳位置</span><select class="w-full mt-1 p-2 bg-cream border border-sand rounded-lg text-coffee" onchange="Pages.upload.drafts[${i}].location_id=this.value"><option value="">未设置</option>${locations.map(l => `<option value="${l.id}" ${d.location_id === l.id ? 'selected' : ''}>${l.path}</option>`).join('')}</select></label>
        </div></div>`).join('')}</div>
      <details class="card p-4 mb-4"><summary class="flex items-center justify-between text-sm font-medium text-coffee"><span>统一设置（应用到全部）</span>${C.icon('chevron-down', 18)}</summary>
        <div class="mt-3 grid grid-cols-2 gap-2 text-xs">
          <label class="block"><span class="text-stone">位置</span><select class="w-full mt-1 p-2 bg-cream border border-sand rounded-lg" onchange="Pages.upload.setAll('location_id', this.value)"><option value="">不修改</option>${locations.map(l => `<option value="${l.id}">${l.path}</option>`).join('')}</select></label>
          <label class="block"><span class="text-stone">季节</span><select class="w-full mt-1 p-2 bg-cream border border-sand rounded-lg" onchange="Pages.upload.setAllSeason(this.value)"><option value="">不修改</option><option value="spring">春季</option><option value="summer">夏季</option><option value="autumn">秋季</option><option value="winter">冬季</option></select></label>
        </div></details>
      <div class="flex gap-3 sticky bottom-20 lg:bottom-4"><button class="btn-outline flex-1" onclick="Pages.upload.reset()">取消</button><button class="btn-primary flex-1" onclick="Pages.upload.save()">保存 ${this.drafts.length} 件</button></div>`;
  },
  setAll(key, val) { if (!val) return; this.drafts.forEach(d => d[key] = val); App.render('upload'); },
  setAllSeason(val) { if (!val) return; this.drafts.forEach(d => { if (!d.seasons.includes(val)) d.seasons.push(val); }); App.render('upload'); },
  save() {
    let count = 0;
    this.drafts.forEach(d => { Store.addGarment({ name: d.name, image: '', category: d.category, subcategory: '', colors: d.colors, seasons: d.seasons, formality: d.formality || 'casual', scenes: d.scenes || ['weekend'], location_id: d.location_id || null, brand: d.brand || '', price: d.price || 0, purchase_date: today(), status: 'in_use', tags: [] }); count++; });
    toast(`成功录入 ${count} 件衣物`); this.reset(); Router.go('wardrobe');
  },
  reset() { this.drafts = []; this.step = 'select'; },
};

/* ---------- 单品详情 ---------- */
Pages.item = {
  render(id) {
    const g = Store.getGarment(id);
    if (!g) return `<div class="p-6 text-center text-stone">衣物不存在</div>`;
    const cat = CATEGORIES[g.category];
    const loc = g.location_id ? Store.getLocation(g.location_id) : null;
    const wearLogs = Store.get('wear_logs').filter(l => l.garment_id === id).sort((a, b) => b.worn_date.localeCompare(a.worn_date));
    const cpw = g.price && g.wear_count > 0 ? (g.price / g.wear_count).toFixed(1) : null;
    const idle = g.last_worn_date ? daysBetween(g.last_worn_date, today()) : daysBetween(g.created_at, today());
    return `<div class="fade-in pb-24 lg:pb-8 max-w-2xl mx-auto">
      <div class="relative garment-thumb aspect-square flex items-center justify-center">
        <div class="w-full h-full flex items-center justify-center">${garmentImage(g, 280)}</div>
        <button onclick="Router.go('wardrobe')" class="absolute top-4 left-4 w-9 h-9 rounded-full bg-cream/80 flex items-center justify-center">${C.icon('arrow-left', 18)}</button>
        <div class="absolute top-4 right-4 flex gap-2">
          <button onclick="Pages.item.edit('${g.id}')" class="w-9 h-9 rounded-full bg-cream/80 flex items-center justify-center">${C.icon('pencil', 18)}</button>
          <button onclick="Pages.item.confirmDelete('${g.id}')" class="w-9 h-9 rounded-full bg-cream/80 flex items-center justify-center text-brick">${C.icon('trash-2', 18)}</button>
        </div>
        <div class="absolute bottom-4 left-4 chip" style="background:${cat.color};color:#FFFCF7">${cat.label}</div>
      </div>
      <div class="px-4 pt-5">
        <h1 class="font-serif text-2xl text-coffee mb-1">${g.name}</h1>
        <div class="flex items-center gap-2 text-xs text-stone mb-4">${g.brand ? `<span>${g.brand}</span>·` : ''}<span>${COLOR_LABELS[g.colors[0]] || '其他'}</span>·<span>${g.seasons.map(s => SEASONS[s]).join('/')}</span>·<span>${FORMALITY[g.formality]}</span></div>
        <div class="grid grid-cols-3 gap-3 mb-5">

          <div class="card p-3 text-center"><div class="font-mono text-2xl ${idle > 30 ? 'text-brick' : 'text-ink'}">${idle}</div><div class="text-xs text-stone mt-0.5">闲置天数</div></div>
          <div class="card p-3 text-center"><div class="font-mono text-2xl text-ink">${cpw ? '¥' + cpw : '—'}</div><div class="text-xs text-stone mt-0.5">单次成本</div></div>
        </div>
        <div class="card p-4 mb-4 cursor-pointer card-hover" onclick="Router.go('wardrobe/locations')">
          <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-moss/15 flex items-center justify-center text-moss">${C.icon('map-pin', 20)}</div>
          <div class="flex-1"><div class="text-xs text-stone">收纳位置</div><div class="text-sm font-medium text-coffee">${loc ? loc.path : '未设置'}</div></div>${C.icon('chevron-right', 18)}</div>
        </div>

          ${this.attr('品类', cat.label + (g.subcategory ? ' / ' + g.subcategory : ''))}
          ${this.attr('颜色', g.colors.map(c => `<span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-full border" style="background:${COLORS[c]}"></span>${COLOR_LABELS[c]}</span>`).join(' '))}
          ${this.attr('季节', g.seasons.map(s => SEASONS[s]).join('、'))}
          ${this.attr('正式度', FORMALITY[g.formality])}
          ${this.attr('场景', g.scenes.map(s => SCENES[s]).join('、'))}
          ${this.attr('品牌', g.brand || '—')}${this.attr('价格', g.price ? '¥' + g.price : '—')}
          ${this.attr('购入日期', g.purchase_date ? fmtDate(g.purchase_date, true) : '—')}${this.attr('状态', STATUSES[g.status])}
          ${g.tags && g.tags.length ? this.attr('标签', g.tags.map(t => `<span class="chip">${t}</span>`).join(' ')) : ''}
        </div></div>
        <div class="card p-4 mb-4"><div class="flex items-center justify-between mb-3"><div class="text-sm font-medium text-coffee">穿着历史</div><span class="text-xs text-stone">${wearLogs.length} 条记录</span></div>
          ${wearLogs.length > 0 ? `<div class="space-y-2.5">${wearLogs.slice(0, 8).map(l => `<div class="flex items-center gap-3 text-sm"><div class="w-2 h-2 rounded-full bg-brick"></div><span class="text-coffee">${fmtDate(l.worn_date, true)}</span><span class="text-xs text-stone">${l.source === 'calendar' ? '日历记录' : '手动记录'}</span></div>`).join('')}${wearLogs.length > 8 ? `<div class="text-xs text-stone text-center pt-2">仅显示最近 8 条</div>` : ''}</div>` : `<div class="text-sm text-stone text-center py-4">暂无穿着记录</div>`}
        </div>
        <div class="grid grid-cols-2 gap-3">
          <button class="btn-outline flex items-center justify-center gap-2 text-sm" onclick="Pages.item.addToOutfit('${g.id}')">${C.icon('plus', 16)}加入搭配</button>
          <button class="btn-primary flex items-center justify-center gap-2 text-sm" onclick="Pages.item.logWear('${g.id}')">${C.icon('check', 16)}记录穿着</button>
        </div>
      </div></div>`;
  },
  attr(label, value) { return `<div class="flex items-center justify-between"><span class="text-stone">${label}</span><span class="text-coffee text-right">${value || '—'}</span></div>`; },
  edit(id) {
    const g = Store.getGarment(id); const locations = Store.get('locations');
    openModal('编辑单品', `<div class="space-y-3">
      <label class="block"><span class="text-xs text-stone">名称</span><input type="text" id="ed-name" value="${g.name}" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg"></label>
      <div class="grid grid-cols-2 gap-3">
        <label class="block"><span class="text-xs text-stone">品类</span><select id="ed-cat" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg">${Object.entries(CATEGORIES).map(([k, v]) => `<option value="${k}" ${k === g.category ? 'selected' : ''}>${v.label}</option>`).join('')}</select></label>
        <label class="block"><span class="text-xs text-stone">主色</span><select id="ed-color" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg">${Object.entries(COLOR_LABELS).map(([k, v]) => `<option value="${k}" ${g.colors[0] === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      </div>
      <label class="block"><span class="text-xs text-stone">收纳位置</span><select id="ed-loc" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg"><option value="">未设置</option>${locations.map(l => `<option value="${l.id}" ${g.location_id === l.id ? 'selected' : ''}>${l.path}</option>`).join('')}</select></label>
      <div class="grid grid-cols-2 gap-3">
        <label class="block"><span class="text-xs text-stone">品牌</span><input type="text" id="ed-brand" value="${g.brand || ''}" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg"></label>
        <label class="block"><span class="text-xs text-stone">价格(¥)</span><input type="number" id="ed-price" value="${g.price || ''}" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg"></label>
      </div>
      <label class="block"><span class="text-xs text-stone">状态</span><select id="ed-status" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg">${Object.entries(STATUSES).map(([k, v]) => `<option value="${k}" ${k === g.status ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    </div>`, `<div class="flex gap-3"><button class="btn-outline flex-1" onclick="closeModal()">取消</button><button class="btn-primary flex-1" onclick="Pages.item.saveEdit('${id}')">保存</button></div>`);
  },
  saveEdit(id) {
    Store.updateGarment(id, { name: $('#ed-name').value, category: $('#ed-cat').value, colors: [$('#ed-color').value], location_id: $('#ed-loc').value || null, brand: $('#ed-brand').value, price: parseFloat($('#ed-price').value) || 0, status: $('#ed-status').value });
    closeModal(); toast('已保存修改'); App.render('item');
  },
  confirmDelete(id) {
    openModal('确认删除', `<p class="text-sm text-stone">删除后将进入 30 天回收站，穿着历史也会一并删除。确定要删除吗？</p>`, `<div class="flex gap-3"><button class="btn-outline flex-1" onclick="closeModal()">取消</button><button class="btn-brick flex-1" onclick="Pages.item.doDelete('${id}')">确认删除</button></div>`);
  },
  doDelete(id) { Store.deleteGarment(id); closeModal(); toast('已删除'); Router.go('wardrobe'); },
  logWear(id) { const ok = Store.logWear(id, null, today(), 'manual'); toast(ok ? '已记录今日穿着' : '今日已记录过'); App.render('item'); },
  addToOutfit(id) { toast('已加入搭配候选'); Router.go('outfit/board'); },
};

/* ---------- 位置管理 ---------- */
Pages.locations = {
  render() {
    const wardrobes = Store.get('wardrobes'); const locations = Store.get('locations'); const garments = Store.get('garments');
    return `<div class="fade-in px-4 pt-6 pb-24 lg:pb-8 max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-3"><button onclick="Router.go('wardrobe')" class="w-9 h-9 rounded-full bg-sand flex items-center justify-center">${C.icon('arrow-left', 18)}</button><h1 class="font-serif text-2xl text-coffee">收纳位置</h1></div>
        <button class="btn-primary px-4 text-sm flex items-center gap-1.5" onclick="Pages.locations.add()">${C.icon('plus', 16)}新建</button>
      </div>
      <div class="space-y-4">${wardrobes.map(w => this.renderWardrobe(w, locations, garments)).join('')}</div>
      <div class="card p-4 mt-5"><div class="text-sm font-medium text-coffee mb-2">支持的柜体模板</div>
        <div class="grid grid-cols-2 gap-2 text-xs text-stone">
          <div class="flex items-center gap-1.5">${C.icon('door-closed', 16)}衣柜（挂杆+层板）</div>
          <div class="flex items-center gap-1.5">${C.icon('archive', 16)}抽屉柜（多层抽屉）</div>
          <div class="flex items-center gap-1.5">${C.icon('box', 16)}收纳箱（季节性）</div>
          <div class="flex items-center gap-1.5">${C.icon('briefcase', 16)}行李箱（旅行用）</div>
        </div></div>
    </div>`;
  },
  renderWardrobe(w, locations, garments) {
    const rootLocs = locations.filter(l => l.wardrobe_id === w.id && !l.parent_id);
    const countInWardrobe = garments.filter(g => { const loc = g.location_id ? locations.find(l => l.id === g.location_id) : null; return loc && loc.wardrobe_id === w.id; }).length;
    return `<div class="card p-4"><div class="flex items-center gap-3 mb-3">
      <div class="w-11 h-11 rounded-xl bg-ink/10 flex items-center justify-center text-ink">${C.icon(w.type === 'wardrobe' ? 'door-closed' : w.type === 'drawer' ? 'archive' : 'box', 22)}</div>
      <div class="flex-1"><div class="font-medium text-coffee">${w.name}</div><div class="text-xs text-stone">${LOCATION_TYPES[w.type]} · ${countInWardrobe} 件衣物</div></div>
      <button class="text-stone" onclick="Pages.locations.add('${w.id}')">${C.icon('plus', 18)}</button></div>
      ${rootLocs.length > 0 ? `<div class="pl-4 border-l-2 border-sand space-y-2">${rootLocs.map(l => this.renderLocationTree(l, locations, garments)).join('')}</div>` : `<div class="text-sm text-stone pl-4">暂无分区，点击 + 添加</div>`}
    </div>`;
  },
  renderLocationTree(loc, locations, garments) {
    const children = locations.filter(l => l.parent_id === loc.id);
    const count = garments.filter(g => g.location_id === loc.id).length;
    return `<div><div class="flex items-center gap-2 py-2 cursor-pointer card-hover rounded-lg px-2" onclick="Pages.locations.view('${loc.id}')">
      <div class="w-6 h-6 rounded-md bg-sand flex items-center justify-center text-stone">${C.icon(loc.type === 'container' ? 'box' : 'folder', 14)}</div>
      <span class="text-sm text-coffee flex-1">${loc.name}</span><span class="text-xs text-stone font-mono">${count}</span>${C.icon('chevron-right', 14)}</div>
      ${children.length > 0 ? `<div class="pl-4 border-l border-sand ml-3 space-y-1">${children.map(c => this.renderLocationTree(c, locations, garments)).join('')}</div>` : ''}</div>`;
  },
  view(locId) {
    const loc = Store.getLocation(locId); const garments = Store.get('garments').filter(g => g.location_id === locId);
    openModal(loc.path, `<div class="mb-3 text-sm text-stone">${garments.length} 件衣物存放在此位置</div>
      ${garments.length > 0 ? `<div class="grid grid-cols-3 gap-2 mb-4">${garments.map(g => `<div onclick="closeModal();Router.go('wardrobe/item/${g.id}')" class="cursor-pointer">${C.garmentThumb(g, 80)}</div>`).join('')}</div>` : '<div class="text-sm text-stone text-center py-4">暂无衣物</div>'}
      <div class="flex gap-2 mt-4"><button class="btn-outline flex-1 text-sm" onclick="Pages.locations.movePrompt('${locId}')">${C.icon('arrow-right-left', 16)}批量迁移</button><button class="btn-outline flex-1 text-sm text-brick" onclick="Pages.locations.confirmDelete('${locId}')">${C.icon('trash-2', 16)}删除位置</button></div>`);
  },
  add(wardrobeId) {
    const wardrobes = Store.get('wardrobes'); const wid = wardrobeId || wardrobes[0]?.id;
    const locations = Store.get('locations').filter(l => l.wardrobe_id === wid);
    openModal('新建位置', `<div class="space-y-3">
      <label class="block"><span class="text-xs text-stone">所属柜体</span><select id="new-wid" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg" onchange="Pages.locations.refreshParents()">${wardrobes.map(w => `<option value="${w.id}" ${w.id === wid ? 'selected' : ''}>${w.name}</option>`).join('')}</select></label>
      <label class="block"><span class="text-xs text-stone">上级位置（可选）</span><select id="new-parent" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg"><option value="">无（顶层）</option>${locations.map(l => `<option value="${l.id}">${l.path}</option>`).join('')}</select></label>
      <label class="block"><span class="text-xs text-stone">名称</span><input type="text" id="new-name" placeholder="如：上层挂杆、白色收纳箱" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg"></label>
      <label class="block"><span class="text-xs text-stone">类型</span><select id="new-type" class="w-full mt-1 p-2.5 bg-cream border border-sand rounded-lg"><option value="section">分区</option><option value="container">容器</option><option value="wardrobe">衣柜</option><option value="drawer">抽屉柜</option><option value="box">收纳箱</option><option value="suitcase">行李箱</option></select></label>
    </div>`, `<div class="flex gap-3"><button class="btn-outline flex-1" onclick="closeModal()">取消</button><button class="btn-primary flex-1" onclick="Pages.locations.save()">创建</button></div>`);
  },
  refreshParents() { const wid = $('#new-wid').value; const locations = Store.get('locations').filter(l => l.wardrobe_id === wid); $('#new-parent').innerHTML = '<option value="">无（顶层）</option>' + locations.map(l => `<option value="${l.id}">${l.path}</option>`).join(''); },
  save() {
    const wid = $('#new-wid').value; const parentId = $('#new-parent').value || null; const name = $('#new-name').value.trim();
    if (!name) { toast('请输入名称'); return; }
    const type = $('#new-type').value; const parent = parentId ? Store.getLocation(parentId) : null; const wardrobe = Store.get('wardrobes').find(w => w.id === wid);
    const path = parent ? parent.path + ' / ' + name : wardrobe.name + ' / ' + name;
    Store.addLocation({ wardrobe_id: wid, parent_id: parentId, name, type, path, sort: 99 });
    closeModal(); toast('已创建位置'); App.render('locations');
  },
  movePrompt(locId) {
    const locations = Store.get('locations').filter(l => l.id !== locId); const garments = Store.get('garments').filter(g => g.location_id === locId);
    if (!garments.length) { toast('该位置没有衣物可迁移'); return; }
    openModal('批量迁移', `<p class="text-sm text-stone mb-3">将 ${garments.length} 件衣物迁移到其他位置：</p>
      <select id="move-target" class="w-full p-2.5 bg-cream border border-sand rounded-lg mb-3">${locations.map(l => `<option value="${l.id}">${l.path}</option>`).join('')}</select>
      <div class="text-xs text-stone">迁移后会写入历史记录，可在单品详情查看新位置。</div>`, `<div class="flex gap-3"><button class="btn-outline flex-1" onclick="closeModal()">取消</button><button class="btn-primary flex-1" onclick="Pages.locations.doMove('${locId}')">确认迁移</button></div>`);
  },
  doMove(fromId) { const toId = $('#move-target').value; const garments = Store.get('garments').filter(g => g.location_id === fromId); Store.moveGarments(garments.map(g => g.id), toId); closeModal(); toast(`已迁移 ${garments.length} 件衣物`); App.render('locations'); },
  confirmDelete(locId) { const loc = Store.getLocation(locId); const garments = Store.get('garments').filter(g => g.location_id === locId); openModal('确认删除', `<p class="text-sm text-stone">删除位置「${loc.name}」？</p>${garments.length > 0 ? `<p class="text-sm text-brick mt-2">该位置下有 ${garments.length} 件衣物，删除后其位置字段将置空。</p>` : ''}`, `<div class="flex gap-3"><button class="btn-outline flex-1" onclick="closeModal()">取消</button><button class="btn-brick flex-1" onclick="Pages.locations.doDelete('${locId}')">删除</button></div>`); },
  doDelete(locId) { Store.deleteLocation(locId); closeModal(); toast('已删除位置'); App.render('locations'); },
};
</script>
<script id="pages2-code">
/* ---------- 搭配首页 ---------- */
Pages.outfit = {
  tab: 'board',
  render(params) {
    if (params[0]) this.tab = params[0];
    const tabs = [{ key: 'board', label: '画板', icon: 'layout-grid' }, { key: 'recommend', label: '推荐', icon: 'sparkles' }, { key: 'capsule', label: '胶囊', icon: 'layers' }, { key: 'trip', label: '旅行', icon: 'plane' }];
    return `<div class="fade-in pb-24 lg:pb-8 max-w-3xl mx-auto">
      <h1 class="font-serif text-2xl text-coffee px-4 pt-6 mb-4">搭配</h1>
      <div class="flex gap-1 px-4 mb-4 border-b border-sand overflow-x-auto scrollbar-hide">
        ${tabs.map(t => `<button onclick="Pages.outfit.switch('${t.key}')" class="px-4 py-2.5 text-sm font-medium border-b-2 ${this.tab === t.key ? 'border-ink text-ink' : 'border-transparent text-stone'} flex items-center gap-1.5">${C.icon(t.icon, 16)}${t.label}</button>`).join('')}
      </div>
      <div id="outfit-tab-content">${this.renderTab()}</div></div>`;
  },
  switch(tab) { this.tab = tab; Router.go('outfit/' + tab); },
  renderTab() { if (this.tab === 'board') return Pages.board.render(); if (this.tab === 'recommend') return Pages.recommend.render(); if (this.tab === 'capsule') return Pages.capsule.render(); if (this.tab === 'trip') return Pages.trip.render(); },
};

/* ---------- 搭配画板 ---------- */
Pages.board = {
  current: { top: null, bottom: null, outer: null, shoes: null, bag: null, accessory: null },
  render() {
    const garments = Store.get('garments').filter(g => g.status === 'in_use');
    return `<div class="px-4">
      <div class="card p-4 mb-4"><div class="space-y-3">${SLOTS.map(slot => this.renderSlot(slot, garments)).join('')}</div></div>
      <div class="card p-3 mb-4 flex items-start gap-2">${C.icon('lightbulb', 18)}<div class="text-xs text-stone" id="board-hint">${this.getHint()}</div></div>
      <div class="flex gap-3"><button class="btn-outline flex-1 text-sm" onclick="Pages.board.clear()">清空</button><button class="btn-primary flex-1 text-sm" onclick="Pages.board.save()">保存搭配</button></div>
    </div>`;
  },
  renderSlot(slot, garments) {
    const gid = this.current[slot.key]; const g = gid ? Store.getGarment(gid) : null;
    const cats = Array.isArray(slot.cat) ? slot.cat : [slot.cat];
    return `<div class="flex items-center gap-3"><div class="w-16 text-xs text-stone flex-shrink-0">${slot.label}</div><div class="flex-1 flex items-center gap-2">
      ${g ? `<div class="flex items-center gap-2 flex-1 card p-2">${C.garmentThumb(g, 48)}<div class="flex-1"><div class="text-sm text-coffee">${g.name}</div><div class="text-xs text-stone">${COLOR_LABELS[g.colors[0]]} · ${CATEGORIES[g.category].label}</div></div><button onclick="Pages.board.remove('${slot.key}')" class="text-stone">${C.icon('x', 16)}</button></div>` :
      `<button onclick="Pages.board.pick('${slot.key}')" class="flex-1 border-2 border-dashed border-sand rounded-xl py-3 text-sm text-stone flex items-center justify-center gap-1.5">${C.icon('plus', 16)}添加${slot.label}</button>`}
    </div></div>`;
  },
  getHint() {
    const items = Object.values(this.current).filter(Boolean).map(id => Store.getGarment(id)).filter(Boolean);
    if (items.length === 0) return '从下方候选中选择单品，或点击+按钮添加。至少选择上装和下装。';
    const colors = items.map(i => i.colors[0]); const neutral = colors.filter(c => ['white', 'black', 'gray', 'beige', 'navy', 'khaki'].includes(c)).length;
    if (neutral >= items.length - 1) return '色彩协调：以中性色为主，安全百搭。';
    if (items.length >= 3 && neutral < 2) return '注意：彩色较多，建议加入中性色单品平衡。';
    if (!this.current.top || !this.current.bottom) return '提示：上装和下装是必备品类。';
    if (!this.current.shoes) return '提示：建议添加鞋履以完成搭配。';
    return '搭配完整度良好，可以保存。';
  },
  pick(slotKey) {
    const slot = SLOTS.find(s => s.key === slotKey); const cats = Array.isArray(slot.cat) ? slot.cat : [slot.cat];
    const garments = Store.get('garments').filter(g => g.status === 'in_use' && cats.includes(g.category));
    openModal('选择' + slot.label, garments.length > 0 ? `<div class="grid grid-cols-3 gap-2">${garments.map(g => `<div onclick="Pages.board.choose('${slotKey}','${g.id}')" class="cursor-pointer card card-hover p-1">${C.garmentThumb(g, 80)}<div class="text-xs text-center text-coffee mt-1 truncate">${g.name}</div></div>`).join('')}</div>` : '<div class="text-sm text-stone text-center py-4">没有该品类的衣物</div>');
  },
  choose(slotKey, gid) { this.current[slotKey] = gid; closeModal(); App.render('outfit'); },
  remove(slotKey) { this.current[slotKey] = null; App.render('outfit'); },
  clear() { this.current = { top: null, bottom: null, outer: null, shoes: null, bag: null, accessory: null }; App.render('outfit'); },
  save() {
    const ids = Object.values(this.current).filter(Boolean);
    if (ids.length < 2) { toast('至少选择两件单品'); return; }
    if (!this.current.top || !this.current.bottom) { toast('请添加上装和下装'); return; }
    const items = ids.map(id => Store.getGarment(id)).filter(Boolean);
    Store.addOutfit({ garment_ids: ids, scene: 'commute', weather_range: [18, 26], score: 0.8, source: 'manual', reasons: ['手动搭配', `${items.length}件单品`] });
    toast('已保存搭配'); this.clear(); Router.go('today');
  },
};

/* ---------- 推荐 ---------- */
Pages.recommend = {
  results: null, opts: { temp: 22, scene: 'commute' },
  render() {
    return `<div class="px-4">

/* ---------- 穿搭日历 ---------- */
Pages.calendar = {
  currentMonth: new Date(),
  render() {
    const year = this.currentMonth.getFullYear(); const month = this.currentMonth.getMonth();
    const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0);
    const startWeekday = firstDay.getDay(); const daysInMonth = lastDay.getDate();
    const wornDates = Store.getWornDates();
    const todayStr = today();
    let days = [];
    for (let i = 0; i < startWeekday; i++) days.push(null);
    for (let d = 1; d <= daysInMonth; d++) days.push(d);
    const monthOutfits = {};
    Store.get('wear_logs').forEach(l => { if (l.worn_date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`)) { if (!monthOutfits[l.worn_date]) monthOutfits[l.worn_date] = new Set(); if (l.outfit_id) monthOutfits[l.worn_date].add(l.outfit_id); } });
    return `<div class="fade-in px-4 pt-6 pb-24 lg:pb-8 max-w-2xl mx-auto">
      <div class="flex items-center gap-3 mb-5"><button onclick="Router.go('profile')" class="w-9 h-9 rounded-full bg-sand flex items-center justify-center">${C.icon('arrow-left', 18)}</button><h1 class="font-serif text-2xl text-coffee">穿搭日历</h1></div>
      <div class="card p-4 mb-4">
        <div class="flex items-center justify-between mb-4">
          <button onclick="Pages.calendar.prevMonth()" class="w-9 h-9 rounded-full bg-sand flex items-center justify-center">${C.icon('chevron-left', 18)}</button>
          <div class="font-serif text-lg text-coffee">${year}年${month + 1}月</div>
          <button onclick="Pages.calendar.nextMonth()" class="w-9 h-9 rounded-full bg-sand flex items-center justify-center">${C.icon('chevron-right', 18)}</button>
        </div>
        <div class="grid grid-cols-7 gap-1 mb-2">${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div class="text-center text-xs text-stone py-1">${w}</div>`).join('')}</div>
        <div class="grid grid-cols-7 gap-1">${days.map(d => {
          if (!d) return '<div></div>';
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isWorn = wornDates.has(dateStr); const isToday = dateStr === todayStr;
          const outfitCount = monthOutfits[dateStr] ? monthOutfits[dateStr].size : 0;
          return `<div onclick="Pages.calendar.viewDay('${dateStr}')" class="aspect-square rounded-lg flex flex-col items-center justify-center cursor-pointer card-hover ${isToday ? 'bg-ink text-cream' : isWorn ? 'bg-moss/15 text-ink' : 'bg-cream text-stone'}">
            <span class="text-sm ${isToday ? 'font-bold' : ''}">${d}</span>${isWorn ? `<span class="w-1.5 h-1.5 rounded-full ${isToday ? 'bg-cream' : 'bg-moss'} mt-0.5"></span>` : ''}</div>`;
        }).join('')}</div>
      </div>
      <div class="card p-4">
        <div class="text-sm font-medium text-coffee mb-2">本月统计</div>
        <div class="grid grid-cols-3 gap-3 text-center">
          <div><div class="font-mono text-xl text-ink">${Object.keys(monthOutfits).length}</div><div class="text-xs text-stone">已穿天数</div></div>
          <div><div class="font-mono text-xl text-ink">${daysInMonth}</div><div class="text-xs text-stone">总天数</div></div>
          <div><div class="font-mono text-xl text-ink">${Object.values(monthOutfits).reduce((s, v) => s + v.size, 0)}</div><div class="text-xs text-stone">搭配次数</div></div>
        </div>
      </div>
    </div>`;
  },
  prevMonth() { this.currentMonth.setMonth(this.currentMonth.getMonth() - 1); App.render('calendar'); },
  nextMonth() { this.currentMonth.setMonth(this.currentMonth.getMonth() + 1); App.render('calendar'); },
  viewDay(dateStr) {
    const outfits = Store.getOutfitsByDate(dateStr);
    const isToday = dateStr === today();
    const isFuture = dateStr > today();
    openModal(fmtDate(dateStr, true), outfits.length > 0 ? `<div class="space-y-3 mb-4">${outfits.map(o => `<div class="card p-3"><div class="flex gap-2 mb-2 overflow-x-auto scrollbar-hide">${o.garment_ids.map(id => { const g = Store.getGarment(id); return g ? `<div class="flex-shrink-0">${C.garmentThumb(g, 56)}</div>` : ''; }).join('')}</div><div class="flex items-center gap-2"><span class="chip">${SCENES[o.scene] || '日常'}</span>${o.reasons ? `<span class="text-xs text-stone">${o.reasons[0]}</span>` : ''}</div></div>`).join('')}</div>${!isFuture ? `<button class="btn-outline w-full text-sm" onclick="Pages.calendar.unlog('${dateStr}')">${C.icon('undo-2', 16)}撤销当日记录</button>` : ''}` : `<div class="text-sm text-stone text-center py-4">${isFuture ? '该日期尚未到来' : '暂无穿着记录'}</div>${!isFuture ? `<button class="btn-primary w-full text-sm" onclick="Pages.calendar.logToday('${dateStr}')">补记穿着</button>` : ''}`, isToday && outfits.length > 0 ? `<button class="btn-primary w-full text-sm" onclick="closeModal()">完成</button>` : '');
  },
  unlog(dateStr) { Store.getOutfitsByDate(dateStr).forEach(o => Store.unlogWear(dateStr, o.id)); closeModal(); toast('已撤销当日记录'); App.render('calendar'); },
  logToday(dateStr) { const o = Store.get('outfits')[0]; if (o) { o.garment_ids.forEach(gid => Store.logWear(gid, o.id, dateStr, 'manual')); closeModal(); toast('已补记穿着'); App.render('calendar'); } else { closeModal(); toast('请先创建搭配'); } },
};

    const maxCat = Math.max(...Object.values(s.catDist), 1);
    return `<div class="fade-in px-4 pt-6 pb-24 lg:pb-8 max-w-2xl mx-auto">
      <div class="flex items-center gap-3 mb-5"><button onclick="Router.go('profile')" class="w-9 h-9 rounded-full bg-sand flex items-center justify-center">${C.icon('arrow-left', 18)}</button><h1 class="font-serif text-2xl text-coffee">数据报告</h1></div>
      <div class="text-xs text-stone mb-4">统计区间：近 30 天 · 数据完整度：基于已记录穿着</div>
      <div class="grid grid-cols-2 gap-3 mb-5">
        <div class="card p-4"><div class="text-xs text-stone mb-1">周期利用率</div><div class="font-mono text-3xl text-ink">${s.utilization}%</div><div class="mt-2">${C.progressBar(s.utilization, 100)}</div><div class="text-xs text-stone mt-1">${s.periodWorn}/${s.total} 件穿过</div></div>
        <div class="card p-4"><div class="text-xs text-stone mb-1">平均 CPW</div><div class="font-mono text-3xl text-ink">¥${s.avgCpw}</div><div class="mt-2 text-xs text-stone">单次穿着成本</div><div class="text-xs text-stone mt-1">最优 ${s.cpwBest} 件 · 最差 ${s.cpwWorst} 件</div></div>
      </div>
      ${C.sectionTitle('品类分布')}
      <div class="card p-4 mb-5"><div class="space-y-2.5">${Object.entries(s.catDist).sort((a, b) => b[1] - a[1]).map(([cat, count]) => `<div><div class="flex items-center justify-between text-sm mb-1"><span class="text-coffee">${CATEGORIES[cat].label}</span><span class="font-mono text-stone">${count} 件</span></div>${C.progressBar(count, maxCat, CATEGORIES[cat].color)}</div>`).join('')}</div></div>
      ${C.sectionTitle('颜色分布')}
      <div class="card p-4 mb-5"><div class="flex flex-wrap gap-2">${Object.entries(s.colorDist).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<div class="flex items-center gap-1.5 chip"><span class="w-3 h-3 rounded-full border" style="background:${COLORS[c] || '#ccc'}"></span>${COLOR_LABELS[c] || '其他'} ${n}</div>`).join('')}</div></div>
      ${C.sectionTitle('闲置清单', `<span class="text-xs text-stone">${s.idle.length} 件超 30 天未穿</span>`)}
      ${s.idle.length > 0 ? `<div class="space-y-2 mb-5">${s.idle.slice(0, 8).map(g => `<div class="card p-3 flex items-center gap-3"><div class="flex-shrink-0">${C.garmentThumb(g, 48)}</div><div class="flex-1"><div class="text-sm text-coffee">${g.name}</div><div class="text-xs text-stone">${g.idle} 天未穿 · CPW ${g.cpw ? '¥' + g.cpw.toFixed(1) : '—'}</div></div><div class="flex gap-1"><button class="btn-outline px-3 text-xs" onclick="Router.go('outfit/board')">去搭配</button><button class="btn-outline px-3 text-xs text-brick" onclick="Pages.stats.archive('${g.id}')">归档</button></div></div>`).join('')}</div>` : `<div class="card p-4 text-center text-sm text-stone mb-5">暂无闲置衣物，保持得不错！</div>`}
      <div class="card p-3 bg-brick/5"><div class="flex items-start gap-2">${C.icon('info', 16)}<div class="text-xs text-stone"><div>统计说明</div><div class="mt-1">· CPW = 实付价格 ÷ 已记录穿着次数，未填价格或 0 次显示"暂无"</div><div>· 闲置天数 = 今天 − 最后穿着日期，从未穿过以录入日计算</div><div>· 利用率 = 周期内穿过 ≥1 次的衣物 ÷ 在用衣物总数</div></div></div></div>
    </div>`;
  },
  archive(id) { Store.updateGarment(id, { status: 'archived' }); toast('已归档'); App.render('stats'); },
};

/* ---------- 设置与隐私 ---------- */
Pages.settings = {
  render() {
    const user = Store.get('user');
    const plans = [
      { name: '免费版', price: '0 元', desc: '150 件衣物 · 基础功能', current: user.plan === 'free' },
      { name: '月度 Pro', price: '12.9 元/月', desc: '无限衣物 · 智能推荐 · 深度统计', current: user.plan === 'monthly' },
      { name: '年度 Pro', price: '68 元/年', desc: '同月度 Pro · 主推方案', current: user.plan === 'yearly' },
      { name: '创始终身版', price: '99 元一次性', desc: '限量 · 早期种子权益', current: user.plan === 'lifetime' },
    ];
    return `<div class="fade-in px-4 pt-6 pb-24 lg:pb-8 max-w-2xl mx-auto">
      <div class="flex items-center gap-3 mb-5"><button onclick="Router.go('profile')" class="w-9 h-9 rounded-full bg-sand flex items-center justify-center">${C.icon('arrow-left', 18)}</button><h1 class="font-serif text-2xl text-coffee">设置与隐私</h1></div>
      ${C.sectionTitle('会员中心')}
      <div class="space-y-3 mb-5">${plans.map(p => `<div class="card p-4 ${p.current ? 'border-ink border-2' : ''}"><div class="flex items-center justify-between"><div><div class="font-medium text-coffee">${p.name}${p.current ? '<span class="chip chip-active ml-2">当前</span>' : ''}</div><div class="text-xs text-stone mt-0.5">${p.desc}</div></div><div class="text-right"><div class="font-mono text-lg text-ink">${p.price}</div>${!p.current ? `<button class="btn-outline px-3 text-xs mt-1" onclick="Pages.settings.upgrade('${p.name}')">切换</button>` : ''}</div></div></div>`).join('')}</div>
      ${C.sectionTitle('数据管理')}
      <div class="space-y-3 mb-5">
        <div class="card p-4 cursor-pointer card-hover flex items-center gap-3" onclick="Pages.settings.export()"><div class="w-10 h-10 rounded-xl bg-moss/15 flex items-center justify-center text-moss">${C.icon('download', 20)}</div><div class="flex-1"><div class="text-sm font-medium text-coffee">导出数据</div><div class="text-xs text-stone">下载 JSON 格式的全部衣橱数据</div></div></div>
        <div class="card p-4 cursor-pointer card-hover flex items-center gap-3" onclick="Pages.settings.confirmClear()"><div class="w-10 h-10 rounded-xl bg-brick/15 flex items-center justify-center text-brick">${C.icon('trash-2', 20)}</div><div class="flex-1"><div class="text-sm font-medium text-coffee">清空数据</div><div class="text-xs text-stone">重置为示例数据，谨慎操作</div></div></div>
      </div>
      ${C.sectionTitle('反馈')}
      <div class="card p-4 mb-5"><textarea id="feedback-text" placeholder="告诉我们你的建议或问题..." class="w-full p-3 bg-cream border border-sand rounded-lg text-sm h-24 resize-none"></textarea><button class="btn-primary w-full text-sm mt-3" onclick="Pages.settings.sendFeedback()">提交反馈</button></div>
      ${C.sectionTitle('关于')}
      <div class="card p-4 mb-5 text-sm text-stone space-y-1.5">
        <div class="flex justify-between"><span>产品名称</span><span class="text-coffee">衣橱有数</span></div>
        <div class="flex justify-between"><span>版本</span><span class="text-coffee font-mono">v1.0.0</span></div>
        <div class="flex justify-between"><span>Slogan</span><span class="text-coffee">找得到，搭得出，带得齐，买得值</span></div>
      </div>
    </div>`;
  },
  upgrade(name) { toast(`已切换到${name}（演示）`); Store.data.user.plan = name.toLowerCase().includes('月') ? 'monthly' : name.toLowerCase().includes('年') ? 'yearly' : name.toLowerCase().includes('终身') ? 'lifetime' : 'free'; Store.save(); App.render('settings'); },
  export() { const data = Store.export(); const blob = new Blob([data], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `wardrobe_data_${today()}.json`; a.click(); URL.revokeObjectURL(url); toast('已导出 JSON 文件'); },
  confirmClear() { openModal('确认清空', `<p class="text-sm text-stone">将重置所有数据为初始示例状态，你的录入将丢失。确定继续吗？</p>`, `<div class="flex gap-3"><button class="btn-outline flex-1" onclick="closeModal()">取消</button><button class="btn-brick flex-1" onclick="Pages.settings.doClear()">确认清空</button></div>`); },
  doClear() { Store.clear(); closeModal(); toast('已重置数据'); Router.go('today'); },
  sendFeedback() { const t = $('#feedback-text').value.trim(); if (!t) { toast('请输入反馈内容'); return; } Store.addFeedback({ target_type: 'general', target_id: null, action: 'feedback', reason: t }); $('#feedback-text').value = ''; toast('感谢反馈！'); },
};

/* ---------- App 主控 ---------- */
const App = {
  render(route, params) {
    let html = '';
    switch (route) {
      case 'today': html = Pages.today.render(); break;
      case 'wardrobe':
        if (params[0] === 'upload') html = Pages.upload.render();
        else if (params[0] === 'item') html = Pages.item.render(params[1]);
        else if (params[0] === 'locations') html = Pages.locations.render();
        else html = Pages.wardrobe.render();
        break;
      case 'outfit':
        if (params[0]) html = Pages.outfit.render(params);
        else { Pages.outfit.tab = 'board'; html = Pages.outfit.render(params.length ? params : ['board']); }
        break;
      case 'profile':
        if (params[0] === 'calendar') html = Pages.calendar.render();
        else if (params[0] === 'stats') html = Pages.stats.render();
        else if (params[0] === 'settings') html = Pages.settings.render();
        else html = Pages.profile.render();
        break;
      default: html = Pages.today.render();
    }
    // 判断当前 tab
    const tab = route === 'today' ? 'today' : route === 'wardrobe' ? 'wardrobe' : route === 'outfit' ? 'outfit' : route === 'profile' ? 'profile' : '';
    $('#app').innerHTML = html + this.renderNav(tab);
    lucide.createIcons();
    window.scrollTo(0, 0);
  },
  renderNav(active) {
    const tabs = [
      { key: 'today', label: '今日', icon: 'home' },
      { key: 'wardrobe', label: '衣橱', icon: 'shirt' },
      { key: 'outfit', label: '搭配', icon: 'sparkles' },
      { key: 'profile', label: '我的', icon: 'user' },
    ];
    // 桌面端侧边栏
    const sidebar = `<aside class="lg-sidebar fixed left-0 top-0 bottom-0 w-60 bg-cream border-r border-sand flex-col z-30 hidden lg:flex">
      <div class="p-6"><div class="font-serif text-xl text-coffee">衣橱有数</div><div class="text-xs text-stone mt-1">找得到，搭得出，带得齐，买得值</div></div>
      <nav class="flex-1 px-3">${tabs.map(t => `<button onclick="Router.go('${t.key}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1 ${active === t.key ? 'bg-ink text-cream' : 'text-stone hover:bg-sand'}">${C.icon(t.icon, 20)}<span class="text-sm font-medium">${t.label}</span></button>`).join('')}</nav>
      <div class="p-4 text-xs text-stone">v1.0.0 · Trae 比赛作品</div>
    </aside>`;
    // 手机端底部 Tab
    const mobileTab = `<nav class="mobile-tab">
      ${tabs.map(t => `<button onclick="Router.go('${t.key}')" class="mobile-tab-btn ${active === t.key ? 'mobile-tab-active' : ''}">${C.icon(t.icon, 22)}<span class="mobile-tab-text">${t.label}</span></button>`).join('')}
    </nav>`;
    return sidebar + mobileTab;
  },
  init() {
    Store.init();
    this.updateLayout();
    window.addEventListener('resize', () => this.updateLayout());
    Router.init();
  },
  updateLayout() {
    if (window.innerWidth >= 1024) {
      document.body.classList.add('lg-content');
    } else {
      document.body.classList.remove('lg-content');
    }
  },
};

App.init();
</script>
</body>
</html>
