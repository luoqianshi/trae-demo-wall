<!DOCTYPE html>
<html lang="zh-CN" data-theme="scope">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传感及测试技术 · 期末速成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== 主题变量 ===================== */
:root{
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Rajdhani',-apple-system,sans-serif;
  --cn:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
}
/* 示波器深色 */
[data-theme="scope"]{
  --bg:#080d0b; --bg2:#0c1411; --panel:#101a16; --panel2:#0d1713;
  --line:rgba(64,224,160,.10); --grid:rgba(64,224,160,.045);
  --txt:#d6e8df; --txt2:#7e958c; --txt3:#56685f;
  --green:#34e0a1; --green-d:#1f9e73; --amber:#ffc15e; --red:#ff6b6b;
  --cyan:#5fd6e0; --border:rgba(120,200,170,.14); --border2:rgba(120,200,170,.08);
  --shadow:0 8px 30px rgba(0,0,0,.5);
  --glow:0 0 18px rgba(52,224,161,.25);
}
/* 纸质浅色 */
[data-theme="paper"]{
  --bg:#efe9dc; --bg2:#e8e1d2; --panel:#fbf8f1; --panel2:#f5f0e6;
  --line:rgba(20,60,45,.12); --grid:rgba(20,80,55,.05);
  --txt:#1b2620; --txt2:#5a6b62; --txt3:#8a978f;
  --green:#0e7a55; --green-d:#0b5e41; --amber:#b9760a; --red:#cc3636;
  --cyan:#15808c; --border:rgba(20,60,45,.16); --border2:rgba(20,60,45,.08);
  --shadow:0 6px 24px rgba(80,70,50,.12);
  --glow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--cn); background:var(--bg); color:var(--txt);
  line-height:1.7; -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px; min-height:100vh;
}
::selection{background:var(--green);color:var(--bg)}
/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--green-d);border-radius:6px}

/* ===================== 顶栏 ===================== */
header{
  position:sticky;top:0;z-index:100;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.bar{
  max-width:1100px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:var(--glow);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.brand h1{font-family:var(--disp);font-size:1.18rem;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;line-height:1.1}
.brand .zh{font-size:.7rem;color:var(--txt2);letter-spacing:3px;font-weight:400}
.search{flex:1;min-width:160px;position:relative}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--border);
  color:var(--txt);font-family:var(--mono);font-size:.82rem;
  padding:8px 12px 8px 32px;border-radius:8px;outline:none;transition:.2s;
}
.search input:focus{border-color:var(--green);box-shadow:var(--glow)}
.search::before{content:'⌕';position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--txt2);font-size:1rem}
.theme-btn{
  background:var(--panel);border:1px solid var(--border);color:var(--txt);
  width:38px;height:36px;border-radius:8px;cursor:pointer;font-size:1rem;
  display:grid;place-items:center;transition:.2s;flex-shrink:0;
}
.theme-btn:hover{border-color:var(--green);color:var(--green)}

/* 导航 */
nav{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;gap:4px;
  overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--txt2);font-family:var(--cn);font-size:.86rem;font-weight:600;
  padding:11px 14px;cursor:pointer;transition:.18s;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.tab .n{font-family:var(--mono);font-size:.68rem;opacity:.6}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

/* ===================== 内容容器 ===================== */
main{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.view{display:none;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.sec-head{display:flex;align-items:baseline;gap:12px;margin:8px 0 18px;flex-wrap:wrap}
.sec-head h2{font-family:var(--disp);font-size:1.7rem;font-weight:700;letter-spacing:.5px}
.sec-head .sub{color:var(--txt2);font-size:.82rem;font-family:var(--mono)}
.sec-head .hl{color:var(--green)}

/* 卡片 */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green-d);opacity:.5}

/* ===================== 总览 ===================== */
.hero{text-align:center;padding:30px 0 10px}
.hero .tag{display:inline-block;font-family:var(--mono);font-size:.72rem;color:var(--green);
  border:1px solid var(--border);border-radius:20px;padding:4px 14px;margin-bottom:18px;letter-spacing:1px}
.hero h2{font-family:var(--disp);font-size:2.6rem;font-weight:700;line-height:1.1;margin-bottom:8px;letter-spacing:1px}
.hero p{color:var(--txt2);max-width:560px;margin:0 auto;font-size:.95rem}
.hero .stu{margin-top:14px;font-family:var(--mono);font-size:.78rem;color:var(--txt3)}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* 分值仪表盘 */
.gauge{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;
  text-align:center;transition:.2s}
.gauge:hover{border-color:var(--green);transform:translateY(-3px)}
.gauge .pct{font-family:var(--disp);font-size:2.3rem;font-weight:700;color:var(--green);line-height:1}
.gauge .nm{font-size:.92rem;font-weight:600;margin-top:6px}
.gauge .ds{font-size:.72rem;color:var(--txt2);font-family:var(--mono);margin-top:3px}
.gauge .bar{height:4px;background:var(--bg2);border-radius:3px;margin-top:10px;overflow:hidden}
.gauge .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-d),var(--green));border-radius:3px}

/* 必背考点 */
.must{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.must-item{background:var(--panel2);border:1px solid var(--border2);border-radius:10px;padding:13px 15px;
  display:flex;gap:11px;align-items:flex-start;transition:.18s;cursor:default}
.must-item:hover{border-color:var(--amber);transform:translateX(3px)}
.must-item .ix{font-family:var(--mono);font-size:.78rem;color:var(--amber);font-weight:700;flex-shrink:0;
  border:1px solid var(--border);border-radius:6px;width:26px;height:26px;display:grid;place-items:center}
.must-item .tx{font-size:.85rem;line-height:1.5}
.must-item .tx b{color:var(--green)}

/* ===================== 速记卡片 ===================== */
.note-sec{margin-bottom:22px}
.note-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px dashed var(--border)}
.note-head .icon{font-family:var(--mono);color:var(--green);font-weight:700;font-size:.9rem;
  background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:3px 9px}
.note-head h3{font-size:1.12rem;font-weight:700}
.note-head .star{color:var(--amber);font-size:.82rem;letter-spacing:1px}
.note-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.note{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
  font-size:.88rem;transition:.18s}
.note:hover{border-color:var(--border);background:var(--panel2)}
.note .k{font-weight:700;color:var(--cyan);display:block;margin-bottom:4px;font-size:.9rem}
.note .v{color:var(--txt);line-height:1.65}
.note .v b{color:var(--green);font-weight:700}
.note .v em{color:var(--amber);font-style:normal;font-weight:600}
.note.hot{border-color:rgba(255,107,107,.3)}
.note.hot .k::after{content:'高频';font-family:var(--mono);font-size:.6rem;color:var(--red);
  border:1px solid var(--red);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:middle;font-weight:600}

/* ===================== 选择题 ===================== */
.quiz-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px;
  position:sticky;top:104px;z-index:50}
.quiz-bar .score{font-family:var(--mono);font-size:.85rem}
.quiz-bar .score b{color:var(--green);font-size:1.1rem}
.quiz-bar .prog{flex:1;min-width:120px;height:6px;background:var(--bg2);border-radius:4px;overflow:hidden}
.quiz-bar .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green-d),var(--green));transition:.4s}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:var(--cn);
  font-size:.8rem;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;transition:.18s}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.solid{background:var(--green);color:var(--bg);border-color:var(--green)}

.q{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:17px 19px;margin-bottom:13px}
.q .stem{font-size:.93rem;font-weight:600;margin-bottom:12px;display:flex;gap:9px}
.q .stem .qn{font-family:var(--mono);color:var(--green);flex-shrink:0;font-weight:700}
.q .stem .multi{font-family:var(--mono);font-size:.6rem;color:var(--amber);border:1px solid var(--amber);
  border-radius:4px;padding:1px 5px;align-self:center;flex-shrink:0}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 13px;border:1px solid var(--border2);
  border-radius:8px;cursor:pointer;transition:.15s;font-size:.86rem;background:var(--panel2)}
.opt:hover{border-color:var(--green);background:color-mix(in srgb,var(--green) 8%,var(--panel2))}
.opt .lb{font-family:var(--mono);font-weight:700;color:var(--txt2);flex-shrink:0}
.opt.correct{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--panel2))}
.opt.correct .lb{color:var(--green)}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 13%,var(--panel2))}
.opt.wrong .lb{color:var(--red)}
.opt.disabled{cursor:default;pointer-events:none}
.q .exp{margin-top:11px;padding:10px 13px;background:var(--bg2);border-left:2px solid var(--green);
  border-radius:6px;font-size:.82rem;color:var(--txt2);display:none}
.q .exp.show{display:block;animation:fade .3s}
.q .exp b{color:var(--green)}
.q .exp .warn{color:var(--amber)}

/* ===================== 填空题 ===================== */
.blank{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 17px;
  margin-bottom:10px;font-size:.9rem;line-height:1.9}
.blank .bn{font-family:var(--mono);color:var(--green);font-weight:700;margin-right:8px}
.fill{display:inline-block;background:var(--bg2);border-bottom:2px solid var(--green-d);
  color:transparent;border-radius:4px;padding:0 10px;margin:0 2px;cursor:pointer;
  transition:.2s;font-weight:600;min-width:40px;text-align:center;user-select:none}
.fill::after{content:'?';color:var(--txt3)}
.fill.show{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.fill.show::after{content:''}
.blank-tools{margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap}
.src-note{background:color-mix(in srgb,var(--amber) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:9px;padding:10px 14px;font-size:.8rem;line-height:1.62;color:var(--txt2);margin-bottom:14px}
.src-note b{color:var(--amber)}

/* ===================== 简答/计算/设计 折叠 ===================== */
.qa{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.qa summary{padding:14px 17px;cursor:pointer;font-weight:600;font-size:.9rem;display:flex;gap:10px;
  align-items:flex-start;list-style:none;transition:.15s;user-select:none}
.qa summary::-webkit-details-marker{display:none}
.qa summary:hover{background:var(--panel2)}
.qa summary .qn{font-family:var(--mono);color:var(--green);flex-shrink:0;font-weight:700}
.qa summary .arr{margin-left:auto;color:var(--txt2);transition:.25s;flex-shrink:0}
.qa[open] summary .arr{transform:rotate(90deg);color:var(--green)}
.qa[open] summary{border-bottom:1px dashed var(--border)}
.qa .ans{padding:14px 17px 17px;font-size:.87rem;color:var(--txt);line-height:1.75;
  animation:fade .3s}
.qa .ans b{color:var(--green)}
.qa .ans em{color:var(--amber);font-style:normal;font-weight:600}
.qa .ans .pt{display:block;margin:3px 0;padding-left:4px}
.qa .ans .formula{font-family:var(--mono);background:var(--bg2);padding:9px 13px;border-radius:6px;
  margin:8px 0;font-size:.84rem;color:var(--cyan);border:1px solid var(--border2);overflow-x:auto;white-space:pre-wrap}
.qa .ans .hint{color:var(--txt2);font-size:.8rem;border-left:2px solid var(--amber);padding-left:9px;margin-top:8px;display:block}
.qa.todo summary .qn{color:var(--amber)}
.tag-mini{font-family:var(--mono);font-size:.58rem;border:1px solid var(--border);border-radius:4px;
  padding:1px 5px;color:var(--txt2);margin-left:6px;vertical-align:middle}

.empty{text-align:center;color:var(--txt3);padding:50px;font-family:var(--mono);font-size:.85rem}
.foot{text-align:center;color:var(--txt3);font-family:var(--mono);font-size:.72rem;margin-top:50px;
  padding-top:20px;border-top:1px solid var(--border2);line-height:2}
sub,sup{font-family:var(--mono);font-size:.7em}

.road{max-width:680px;margin:0 auto;font-size:.92rem;line-height:1.75}
.road b{color:var(--green)}
.day-switch{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:thin;
  position:sticky;top:104px;z-index:40;background:linear-gradient(var(--bg) 70%,transparent);margin-bottom:6px}
.day-switch::-webkit-scrollbar{height:5px}
.ds-btn{flex-shrink:0;min-width:96px;background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:9px 12px;cursor:pointer;transition:.18s;text-align:left;color:var(--txt);display:flex;flex-direction:column;gap:2px}
.ds-btn:hover{border-color:var(--green)}
.ds-btn .ds-n{font-family:var(--disp);font-weight:700;font-size:.95rem;letter-spacing:.5px}
.ds-btn .ds-t{font-size:.68rem;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.ds-btn.active{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--panel));box-shadow:var(--glow)}
.ds-btn.active .ds-n{color:var(--green)}
.ds-btn.done .ds-n{color:var(--green-d)}
.ds-prog{align-self:center;flex-shrink:0;font-family:var(--mono);font-size:.74rem;color:var(--txt2);padding-left:8px}
.ds-prog b{color:var(--green)}
.day-page{animation:fade .35s ease}
.day-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.day-badge{flex-shrink:0;width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,var(--green-d),var(--green));
  color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);
  font-size:.64rem;font-weight:700;letter-spacing:1px;line-height:1;box-shadow:var(--glow)}
.day-badge b{font-size:1.7rem}
.day-htxt h3{font-size:1.35rem;font-weight:700;line-height:1.2}
.day-sub{color:var(--txt2);font-size:.86rem;margin-top:3px}
.day-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.day-meta .goal{font-size:.85rem;color:var(--txt);background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:6px 12px;flex:1;min-width:200px}
.day-meta .chip{font-family:var(--mono);font-size:.72rem;color:var(--txt2);border:1px solid var(--border);
  border-radius:7px;padding:5px 10px;white-space:nowrap}
.day-intro{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:10px;
  padding:14px 17px;font-size:.9rem;line-height:1.8;margin-bottom:16px;color:var(--txt)}
.day-sec{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:12px}
.day-sec h4{font-size:1rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.day-sec h4 .sn{flex-shrink:0;width:24px;height:24px;border-radius:7px;background:var(--green-d);color:var(--bg);
  display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:700}
.sec-body{font-size:.89rem;line-height:1.85;color:var(--txt)}
.sec-body b{color:var(--green);font-weight:700}
.sec-key{margin-top:11px;background:var(--bg2);border-radius:8px;padding:9px 13px;font-size:.84rem;
  color:var(--cyan);border-left:2px solid var(--cyan)}
.analogy{background:color-mix(in srgb,var(--amber) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
  border-radius:11px;padding:15px 18px;margin-bottom:14px;font-size:.9rem;line-height:1.8;display:flex;gap:12px;align-items:flex-start}
.analogy .al{flex-shrink:0;font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--amber);
  border:1px solid var(--amber);border-radius:6px;padding:3px 8px;margin-top:2px}
.must-block{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:14px}
.mb-title{font-weight:700;font-size:.95rem;margin-bottom:12px;color:var(--green)}
.mb-item{padding:11px 0;border-top:1px dashed var(--border)}
.mb-item:first-of-type{border-top:none;padding-top:0}
.mb-p{font-size:.88rem;font-weight:600;color:var(--txt);line-height:1.6}
.mb-p b{color:var(--green)}
.mb-h{font-size:.82rem;color:var(--amber);margin-top:4px;line-height:1.6}
.pit-block{background:color-mix(in srgb,var(--red) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--red) 28%,transparent);
  border-radius:11px;padding:15px 18px;margin-bottom:14px}
.pb-title{font-weight:700;font-size:.92rem;color:var(--red);margin-bottom:8px}
.pit-block ul{margin:0;padding-left:20px}
.pit-block li{font-size:.85rem;line-height:1.7;margin-bottom:5px;color:var(--txt)}
.pit-block li b{color:var(--red)}
.cp-block{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:15px 18px;margin-bottom:14px}
.cp-title{font-weight:700;font-size:.92rem;color:var(--cyan);margin-bottom:10px}
.cp-item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:.86rem;line-height:1.6;cursor:pointer}
.cp-item input{margin-top:3px;width:16px;height:16px;accent-color:var(--green);flex-shrink:0;cursor:pointer}
.cp-item input:checked+span{color:var(--txt3);text-decoration:line-through}
.prac{background:var(--bg2);border-radius:9px;padding:11px 15px;font-size:.85rem;color:var(--txt);margin-bottom:16px;line-height:1.6}
.prac b{color:var(--amber)}
.day-skel{background:var(--panel);border:1px dashed var(--border);border-radius:11px;padding:18px}
.skel-tip{color:var(--amber);font-size:.86rem;margin-bottom:12px}
.day-skel ul{padding-left:20px}.day-skel li{font-size:.88rem;line-height:1.9;color:var(--txt)}
.day-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.navday{display:flex;gap:8px}

/* ===== 简答题 47（分两批） ===== */
DATA.qa=[
{q:'什么是压电效应？压电传感器有哪些？',a:'当某些晶体沿一定方向伸长或压缩时，在其表面上会产生电荷，这种效应称为<b>压电效应</b>。压电传感器有<b>压电加速度传感器、压电谐振式传感器、声表面波传感器</b>。'},
{q:'电阻应变计产生温度误差的原因是？',a:'① 敏感栅金属丝电阻本身随温度发生变化。<br>② 试件材料与应变丝材料的线膨胀系数不一，使应变丝产生附加变形而造成的电阻变化。'},
{q:'什么叫线性度？',a:'传感器的输出—输入校准曲线与理论拟合直线之间的最大偏差与传感器满量程输出之比，称为该传感器的"非线性误差"或称"线性度"，也称"非线性度"。通常用相对误差表示其大小。'},
{q:'简述温度补偿方法有哪些？',a:'① 电桥补偿法。<br>② 辅助测温元件微型计算机补偿法。<br>③ 应变计自补偿法。<br>④ 热敏电阻补偿法。'},
{q:'应变式传感器与其他类型传感器相比具有如下特点？',a:'① 测量范围广、精度高。<br>② 性能稳定可靠，使用寿命长。<br>③ 频率响应特性较好。<br>④ 能在恶劣的环境条件下工作。<br>⑤ 易于实现小型化、整体化。'},
{q:'应变计的零漂的定义以及产生零漂的原因？',a:'恒定温度下，粘贴在试件上的应变计，在不承受载荷的条件下，电阻随时间变化的特性称为应变计的<b>零漂</b>。零漂的主要原因是，敏感栅通过工作电流后的温度效应，应变计的内应力逐渐变化，粘接剂固化不充分等。'},
{q:'什么是传感器的灵敏度',a:'灵敏度是描述传感器的输出量（一般为电学量）对输入量（一般为非电学量）敏感程度的特性参数。其定义为：传感器的变化值和相应的被测量（输入量）的变化值之比，用公式表示为：K（x）=输出量的变化值/输入量的变化值=△y/△x。'},
{q:'应变式传感器与其他类型传感器相比具有如下特点：',a:'① 测量范围广、精度高。<br>② 性能稳定可靠，使用寿命长。<br>③ 频率响应特性较好。<br>④ 能在恶劣的环境条件下工作。<br>⑤ 易于实现小型化、整体化。'},
{q:'金属式应变片和半导体式应变片在工作原理上有什么不同？',a:'金属应变片是通过变形改变丝栅的几何尺寸，而它的电阻率一般不变；半导体应变片是基于压阻效应而工作的，就是说沿半导体晶轴的应变，使它的电阻率有很大的变化，从而产生电阻变化。'},
{q:'什么是电桥补偿法？',a:'在被测试件上安装一工作应变计，在另外一个与被测试件的材料相同、但不受力的补偿件上安装一补偿应变计。补偿件与被测试件处于完全相同的温度场内。测量时，使两者接入电桥的相邻臂上，由于补偿片 RB 是与工作片 R1 完全相同的，且都贴在相同的试件上，并处于相同的温度下，由于温度变化使工作片产生的电阻变化 △R1t 与补偿片的电阻变化 RBt 相等，因此电桥输出 Usc 与温度无关，从而补偿了应变计的温度误差。'},
{q:'什么是传感器？传感器由哪三个部分组成？',a:'传感器是一种以一定的精确度把被测量转换为与之有确定对应关系的、便于应用的某种物理量的测量装置。<br>敏感元件——直接感受被测量(非电量)、能产生有确定关系的输出量；<br>传感元件——又称为变换器，一般情况它不直接感受被测量，而是将敏感元件的输出量转换为电量输出的元件；<br>调理电路或变换电路——能把传感元件输出的电量转换为便于处理、传输、记录、显示和控制的有用电信号的电路。'},
{q:'什么是零漂和蠕变？',a:'① 恒定温度下，粘贴在试件上的应变计，在不承受载荷的条件下，电阻随时间变化的特性称为应变计的<b>零漂</b>。零漂的主要原因是，敏感栅通过工作电流后的温度效应，应变计的内应力逐渐变化，粘接剂固化不充分等。<br>② 粘贴在试件上的应变计，保持温度恒定，在某一恒定机械应变长期作用下，指示应变随时间变化的特性，称为应变计的<b>蠕变</b>。粘合剂的选用和使用不当、应变计在制造过程中产生的内应力，是造成应变计产生蠕变的主要原因。'},
{q:'简述应变计对粘贴剂的要求。',a:'有一定的粘结强度；能准确传递应变；蠕变小；机械滞后小；耐疲劳性能好；具有足够的稳定性能；对弹性元件和应变计不产生化学腐蚀作用；有适当的储存期；应有较大的温度使用范围。'},
{q:'什么是电阻应变效应？',a:'是指金属导体的电阻在导体受力产生变形（伸长或缩短）时发生变化的物理现象。当金属电阻丝受到轴向拉力时，其长度增加而横截面变小，引起电阻增加；反之，当它受到轴向压力时则导致电阻减小。'},
{q:'什么是晶体压电效应？请举例说明。',a:'当某些晶体沿一定方向伸长或压缩时，在其表面上会产生电荷，这种效应称为压电效应。一些晶体当不受外力作用时，晶体的正负电荷中心相重合，单位体积中的电矩等于零，晶体对外不呈现极性；而在外力作用下晶体形变时，正负电荷的中心发生分离，单位体积的电矩不再等于零，晶体表现出极性。另外一些晶体由于具有中心对称的结构，无论外力如何作用，晶体正负电荷的中心总是重合在一起，因此这些晶体不会出现压电效应。'},
{q:'直流电位差计直接测量电压有什么优点，如何实现工程测量？',a:'采用补偿法工作于平衡状态，平衡时不从被测电路取电流，输入阻抗无穷大，不影响被测电路，测量准确度高。工程测量时，先用标准电池校准工作电流，再调节比较电压使检流计指零，由比较电压读出被测电压。'},
{q:'分析直流电桥、交流电桥的平衡条件。为什么交流电桥不能保证都能实现平衡条件？',a:'直流电桥平衡条件：相对桥臂电阻乘积相等，R1R4=R2R3。交流电桥平衡条件：相对桥臂阻抗乘积相等，Z1Z4=Z2Z3，即模平衡且相角平衡。交流电桥必须同时满足模与相角两个条件，若桥臂阻抗性质搭配不当则无法同时满足，故不能保证都能实现平衡。'},
{q:'分析电感电桥、电容电桥的平衡条件。',a:'两者均为交流电桥，平衡需相对桥臂阻抗乘积相等，同时满足模平衡与相角平衡。电感电桥用电感与电阻搭配，电容电桥用电容与电阻搭配，使两个平衡方程同时成立。'},
{q:'简单介绍数字电桥原理。',a:'数字电桥对被测元件施加交流激励，测量其电压与电流的幅值及相位关系，经 A/D 转换和微处理器运算，自动求出被测阻抗及损耗等参数并数字显示，实现自动平衡与高精度测量。'},
{q:'检定 1 只 1.0 级电流表。其量限为 0～250mA，检定时发现在 200mA 处误差最大，为 -3mA。问此量限是否合格？',a:'引用误差 = |△Am|/Am×100% = 3/250×100% = 1.2%。1.2% 大于 1.0%，超过 1.0 级允许的 ±1.0%，故该量限不合格。'},
{q:'欲测量 250V 电压，要求测量的相对误差不大于 ±0.5%，如果选用量程为 250V 的电压表，其准确度为哪一级？若选用量程为 300V 和 500V 的电压表，其准确度各为哪一级？',a:'允许绝对误差 = 250×0.5% = 1.25V。<br>量程 250V：1.25/250 = 0.5%，需 0.5 级。<br>量程 300V：1.25/300 = 0.42%，需 0.5 级。<br>量程 500V：1.25/500 = 0.25%，需 0.2 级。'},
{q:'为什么引入引用误差的概念？',a:'相对误差随被测量大小变化，不便统一标定仪表等级。引用误差为绝对误差与量程之比，对同一量程为定值，便于规定仪表准确度等级、统一衡量仪表精度。'},
{q:'为测量稍低于 100V 的电压，现实验室中有 0.5 级的 0～300V 和 1.0 级的 0～100V 两只电压表，为使测量准确些，应选用哪一只？',a:'用 0.5 级 300V：绝对误差 = 300×0.5% = 1.5V。用 1.0 级 100V：绝对误差 = 100×1.0% = 1.0V。后者绝对误差小，应选用 1.0 级 0～100V 电压表。'},
{q:'什么是智能化测量？有什么优点？',a:'智能化测量是以微处理器或计算机为核心，将传感、信号调理、A/D、数据处理、显示控制集成的测量方式。优点：精度高、功能强、自动化程度高，能自校准、自补偿、自诊断，可编程灵活，并能实现非线性校正与误差补偿。'},
{q:'设计出电子计数器的功能结构，介绍电子计数器工作原理。',a:'结构：输入通道、时基、闸门控制、计数器、寄存器、显示。测频原理：用标准时间闸门 T 控制被测信号脉冲进入计数器，闸门时间 T 内计数 N，则频率 f=N/T。'},
{q:'请简单介绍滤波器的类型和作用。',a:'类型：低通、高通、带通、带阻四类。作用：让有用频段信号通过，抑制衰减无用频段，实现频率选择、抗混叠、降噪与信号分离。'},
{q:'电子计数器测量时间、测量周期、测量时间间隔、频率、频率比、相位的原理。',a:'测频：闸门时间 T 内计被测脉冲数 N，f=N/T。测周期：用被测信号控制闸门，计标准时钟脉冲数。时间间隔：用起止信号控制闸门计标准脉冲。频率比：用低频信号作闸门计高频脉冲数。相位：转换为两信号的时间差测量。'},
{q:'ADC 的转换原理是什么？ADC 有哪些类型？',a:'原理：把模拟量经采样、保持、量化、编码转换为数字量。类型：逐次逼近型、双积分型、并行比较型、计数型等。'},
{q:'为什么并行比较型 ADC 能实现快速 A/D 转换？',a:'并行比较型用 2ⁿ-1 个比较器将输入电压同时与各级基准比较，一次比较即得全部位输出，无需逐位逼近或积分，转换时间仅取决于比较器与编码器延迟，故速度最快。'},
{q:'简单介绍频谱分析、逻辑分析功能。',a:'频谱分析：把时域信号经傅里叶变换到频域，分析各频率分量的幅值相位，识别信号频率构成。逻辑分析：多通道采集数字信号的逻辑电平时序，以时序图或状态表显示，用于数字系统调试。'},
{q:'什么是传感器的静特性？主要技术指标有哪些？',a:'静态特性指被测量不随时间变化或缓变时，传感器输出与输入的关系。主要指标：灵敏度、线性度、迟滞、重复性、分辨力、稳定性、灵敏度界限、量程等。'},
{q:'金属导体应变片与半导体应变片在工作原理上有何区别？',a:'金属应变片靠变形改变丝栅的几何尺寸，电阻率基本不变；半导体应变片基于压阻效应，靠应变改变电阻率，灵敏系数大十倍。'},
{q:'模拟信号的数字化分析主要包括哪些过程？',a:'采样、量化、编码；前置抗混叠滤波，之后进行数字信号处理。'},
{q:'什么是采样定量？它在信号处理过程中起何作用？',a:'采样是按一定时间间隔取信号瞬时值，把连续时间信号变离散；量化是把采样值幅值离散为有限级。作用：把模拟信号转为数字系统可处理的数字信号，采样须满足采样定理 fs≥2fmax 才能不失真还原。'},
{q:'什么是能量泄露？',a:'对非整周期截断的信号做离散傅里叶变换时，截断使频谱能量从主谱线扩散到旁瓣，造成频谱失真，称为能量泄露。可用窗函数减小。'},
{q:'抗混叠滤波的作用是什么？',a:'在采样前用低通滤波器滤除高于奈奎斯特频率的高频成分，防止采样后高频分量混叠到低频造成频谱混叠失真。'},
{q:'叙述我国法定计量单位的基本内容。',a:'以国际单位制 SI 为基础，包括 7 个 SI 基本单位——米、千克、秒、安培、开尔文、摩尔、坎德拉，以及 SI 导出单位、SI 词头和国家选定的非 SI 单位。'},
{q:'简述测量误差的定义、分类何表示方法。',a:'测量误差是测量结果与被测量真值之差。分类：系统误差、随机误差、粗大误差。表示方法：绝对误差、相对误差、引用误差。'},
{q:'测试装置的静态特性指标有哪些？',a:'灵敏度、线性度、迟滞、重复性、分辨力、稳定性、回程误差、量程等。'},
{q:'何为霍尔效应？用霍尔元件可测量哪些物理量？',a:'载流导体或半导体置于磁场中，在垂直于电流和磁场方向产生电位差，称为霍尔效应。可测：磁感应强度、电流、功率、位移、角度、转速等。'},
{q:'简述传感器的定义、分类何结构。',a:'定义：能感受规定被测量并按一定规律转换成可用输出信号的器件或装置。分类：按基本效应分物理、化学、生物传感器；按输出分模拟、数字传感器；按工作原理分应变、电容、电感等。结构：敏感元件、转换元件、测量电路。'},
{q:'说明产生差动变压器式传感器零位残余电压的原因及减少此电压的有效措施。',a:'原因：两次级线圈结构不对称、磁性材料非线性、铁芯材质不均、激励含谐波、分布电容等。措施：提高线圈与磁路对称性、采用相敏检波、加补偿电路、选用线性好的磁性材料、减小激励谐波。'},
{q:'简述绝对误差、相对误差和引用误差的概念。',a:'① 绝对误差：测量结果与被测量真值之间的差值。<br>② 相对误差：绝对误差/真值。<br>③ 引用误差：测量器具的绝对误差与测量器具引用值之比。'},
{q:'简述精密度、正确度和准确度的概念。',a:'① 精密度：表示测量结果中随机误差大小的程度，反映了在一定条件下进行多次测量时所得结果彼此符合的程度。<br>② 正确度：表示测量结果中系统误差大小的程度，反映了在规定条件下测量结果中所有系统误差的综合。<br>③ 准确度：表示测量结果和被测量真值之间的一致程度，反映了测量结果中系统误差和随机误差的综合，也称为精确度。'},
{q:'简述周期信号、准周期信号和瞬变非周期信号的频谱特点。',a:'周期信号：离散频谱，谱线只在基频整数倍处，间隔为基频。准周期信号：多个频率比为无理数的周期分量叠加，频谱离散但谱线无公共周期。瞬变非周期信号：连续频谱，能量分布在连续频率上。'},
{q:'什么是电桥平衡？简述直流电桥和交流电桥的平衡条件。',a:'电桥平衡指输出电压为零的状态。直流电桥：R1R4=R2R3。交流电桥：Z1Z4=Z2Z3，需模平衡且相角平衡。'},
{q:'什么是调制？调制的目的是什么？调制可分为哪几类？',a:'调制是用低频被测信号去控制高频载波的某个参数，使载波参数随被测信号变化。目的：便于放大传输、抗干扰、频率搬移、便于多路复用。分类：调幅、调频、调相。'},
];
/* ===== 计算题 33（分两批） ===== */
DATA.calc=[
{q:'某温度传感器特性方程为 20dy/dt+5y=0.15x，其中 y 为输出电压（mV），x 为输入温度（℃），求该传感器的时间常数 τ 和静态灵敏度 k。',a:'化为标准一阶式 τ·dy/dt+y=k·x，两边同除以 5：4·dy/dt+y=0.03x。τ=20/5=4s；k=0.15/5=0.03 mV/℃。'},
{q:'用石英晶体加速度计及电荷放大器测量机器的振动，已知：加速度计的灵敏度为 5pC/g，电荷放大灵敏度为 50mV/pC，当机器达到最大加速度值时相应的输出电压幅值为 2V，试求机器的振动加速度。（g 为重力加速度）',a:'由题意，振动测量系统（压电式加速度计加上电荷放大器）的总灵敏度 K=K1·K2=5pC/g×50mV/pC=250mV/g=U/a，式中 U 为输出电压，a 为振动加速度。当输出电压为 2V 时，振动加速度 a=U/K=2×10³/250=8(g)。'},
{q:'对比单臂、半桥、全桥应变片的应变灵敏度。',a:'单臂：Uo≈¼·(△R/R)·E=¼·KεE；半桥：Uo≈½·KεE；全桥：Uo≈KεE。灵敏度比 单臂:半桥:全桥=1:2:4。'},
{q:'已知某二阶系统传感器的自振频率 f0=10kHz，阻尼比 ξ=0.5，若要求传感器的输出幅值误差小于 5%，试确定该传感器的工作频率范围。',a:'二阶系统幅频 A(η)=1/√[(1-η²)²+(2ξη)²]，η=f/f0，ξ=0.5。令幅值误差小于 5% 解得 η≤0.32，即 f≤0.32×10kHz≈3.2kHz。工作频率范围约 0～3.2kHz。'},
{q:'某压电加速度传感器的电容为 Cs=100pF，电荷灵敏度 Kq=2.5pC/g。① 求压电加速度传感器的电压灵敏度；② 外接电缆和示波器组成一个测量系统，电缆电容 Cc=100pF，示波器的输入阻抗为 Ri=100MΩ 和并联电容为 Ci=50pF，如测量系统允许的幅值误差为 5%，最低可测频率是多少？',a:'① 电压灵敏度 Ku=Kq/Cs=2.5pC/g÷100pF=25mV/g。② 接入后总电容 C=Cs+Cc+Ci=250pF，τ=Ri·C=10⁸×250×10⁻¹²=0.025s。高通幅频 A=ωτ/√(1+ω²τ²)=0.95，解得 ωτ≈3.04，ω≈121.7rad/s，最低可测频率 f=ω/2π≈19.4Hz。'},
{q:'根据一阶(惯性)系统的传递函数，求冲激响应。',a:'一阶系统 H(s)=k/(τs+1)，冲激响应为其拉氏反变换：h(t)=(k/τ)·e^(-t/τ)，t≥0。'},
{q:'频率响应特性可由频率响应函数表示。设输出信号 x(t)=sinωt，求稳态响应。',a:'一阶系统对正弦输入 sinωt 的稳态响应：y(t)=k·sin(ωt+φ)/√(1+ω²τ²)，其中 φ=-arctan(ωτ)。'},
{q:'设 R1 为电桥工作臂，受应变时，其电阻变化为 △R1，R2、R3、R4 均为固定桥臂。在起始时，电桥处于平衡状态，此时 Usc=0。当有 △R1 时，求电桥输出电压？',a:'起始 R1=R2=R3=R4=R 平衡。Uo=[(R1+△R1)/(R1+△R1+R3)-R2/(R2+R4)]·E≈¼·(△R1/R1)·E。'},
{q:'在某二阶传感器的频率特性测试中发现，谐振发生在频率为 216HZ 处，并得到最大幅值比为 1.4:1，试估该传感器的阻尼比和有角频率的大小。',a:'谐振峰值 Mr=1/[2ξ√(1-ξ²)]=1.4，解得 ξ≈0.39。ωr=2π×216=1357rad/s，ωn=ωr/√(1-2ξ²)=1357/√0.70≈1622rad/s。'},
{q:'有一直流电桥，桥臂由 R1、R2、R3、R4 组成。求 a、b 两端开路电压和内阻。',a:'Uo=U①-U③=[R4/(R4+R3)-R1/(R1+R2)]·E={[(R1+R2)R4-R1(R3+R4)]/[(R3+R4)(R1+R2)]}·E。设 R1=R2=R3=R4，则 Uo=0。'},
{q:'单臂电桥的输出电压。',a:'Uo={[(R1+R2)(R4+△R4)-R1(R3+R4+△R4)]/[(R3+R4+△R4)(R1+R2)]}·E。设 R1=R2=R3=R4 且 △R4/R4=△R/R≪1、△R/R=Kε，则 Uo≈¼·(△R4/R4)·E=¼·(△R/R)·E=¼·KεE。'},
{q:'半桥的输出电压。',a:'Uo≈½·(△R/R)·E=½·KεE。'},
{q:'全桥的输出电压。',a:'Uo≈(△R/R)·E=KεE。'},
{q:'直流电桥的特性方程的推导。',a:'Uo={[(R1+R2)R4-R1(R3+R4)]/[(R3+R4)(R1+R2)]}·E。初始平衡条件 R1R4=R2R3，受应变后展开取一阶近似即得各桥路输出。'},
{q:'设 E=18V，光电三极管采用 3DU13，在照度 100LX 时的电流 IL=0.7MA，晶体管采用 3DG6B，β=30，求 RL、RC。',a:'RL=(E-U_CE)/IL，取 U_CE≈9V，RL=(18-9)/0.7mA≈12.8kΩ。RC 由后级集电极电流与输出摆幅决定，Ic=β·Ib。'},
{q:'求一阶系统的频率响应的推导。幅频特性，相频特性。',a:'H(jω)=k/(1+jωτ)。幅频特性 A(ω)=k/√(1+ω²τ²)；相频特性 φ(ω)=-arctan(ωτ)。'},
{q:'用 1.5 级、量限为 250V 的电压表，分别测量 220V 和 110V 电压，计算其最大相对误差各为多少？并说明仪表量程选择的意义。',a:'最大绝对误差=1.5%×250=3.75V。测 220V：3.75/220=1.70%；测 110V：3.75/110=3.41%。被测值越接近量程，相对误差越小，故量程应使读数落在满量程 2/3 以上。'},
{q:'用量程为 10A 的电流表，测量一实际值为 8A 的电流。若读数为 8.1A，求测量的绝对误差和相对误差？若求得的绝对误差被视为最大绝对误差，问仪表的准确度等级为哪一级？',a:'绝对误差=8.1-8=0.1A；相对误差=0.1/8=1.25%；引用误差=0.1/10=1.0%，准确度为 1.0 级。'},
{q:'用量限为 0～100mA、准确度为 0.5 级的电流表，分别去测量 100mA 和 50mA 的电流，求测量结果的最大相对误差各为多少？',a:'最大绝对误差=0.5%×100=0.5mA。测 100mA：0.5/100=0.5%；测 50mA：0.5/50=1.0%。'},
{q:'有一磁电系表头，内阻为 150Ω，额定电压为 45mV。现将它改接为 150mA 量限的电流表，问应接多大的分流器？若将它改接为 15V 的电压表，则应接多大的附加电阻？',a:'表头满偏电流 Ig=45mV/150Ω=0.3mA。分流器 Rs=Ig·Rg/(I-Ig)=45mV/149.7mA≈0.30Ω。附加电阻 Rf=(U-Ig·Rg)/Ig=(15-0.045)/0.3mA≈49.85kΩ。'},
{q:'有一磁电系毫伏表，其量限为 150mV，满偏电流为 5mA，求毫伏表的内阻。若将其量限扩大为 150V，其附加电阻及毫伏表总内阻为多大？若将其改为量限为 3A 的电流表，则应装多大的分流器？装上分流器后，电流表的总内阻为多大？',a:'内阻 Rg=150mV/5mA=30Ω。扩大为 150V：Rf=(150-0.15)/5mA≈29970Ω，总内阻=30+29970=30kΩ。改 3A：Rs=150mV/2995mA≈0.050Ω，装后总内阻=Rg∥Rs≈0.05Ω。'},
{q:'两个电阻串联后，接到电压为 100V 的电源上，电源内阻可忽略不计，已知两电阻分别为 R1=40kΩ，R2=60kΩ。求：① 计算两个电阻上压降分别为多少？② 若用一内阻为 50kΩ 的电压表分别测量两个电阻上的电压，则其读数将为多少？',a:'① I=100/100k=1mA，U1=40V，U2=60V。② 测 R1：50k∥40k=22.2k，U1′=100×22.2/(22.2+60)=27.0V；测 R2：50k∥60k=27.3k，U2′=100×27.3/(40+27.3)=40.5V。'},
{q:'用一只内阻为 9.3Ω 的毫安表测量某电路电流，其读数为 8mA。若在毫安表电路内再串联一只 10Ω 电阻，毫安表读数为 7.2mA，问该电路不接毫安表时，实际电流应多少？',a:'设等效电源 E、内阻 R：8mA=E/(R+9.3)，7.2mA=E/(R+19.3)，联立得 R≈80.8Ω、E≈0.72V，不接表实际电流=E/R=720.8mV/80.8Ω≈8.9mA。'},
{q:'用内阻为 50kΩ 的直流电压表测量某直流电压时，电压表读数为 100V。若改用内阻为 100kΩ 的电压表测量，则电压表读数为 109V，问该电路的实际电压为多少？',a:'设等效电源 U0、内阻 Ri：U0·50/(Ri+50)=100，U0·100/(Ri+100)=109，联立得 Ri≈9.9kΩ、U0≈120V。实际电压≈120V。'},
{q:'有一量限为 100μA 的电流表，满偏时表头压降为 50mV，拟改成 10mA/50mA/100mA/500mA 的多量限电流表，画出其测量电路图，并计算各分流电阻。',a:'Rg=50mV/100μA=500Ω。各档分流 Rs=50mV/(I-Ig)：10mA→5.05Ω；50mA→1.00Ω；100mA→0.50Ω；500mA→0.10Ω。'},
{q:'一个微安表，量限为 100μA，内阻为 500Ω。问：① 用该表组成一个电压表，若电压表的量限分别为 10V 和 100V，求该电压表的测量电路及附加电阻的阻值；② 用该表组成一个量限为 100mA、10mA 和 1mA 的电流表，该用什么样的电路？电路的电阻各是多少？',a:'满偏压降=100μA×500Ω=50mV。① 电压表串联附加电阻 Rf=(U-0.05)/100μA：10V→99.5kΩ；100V→999.5kΩ。② 电流表并联分流 Rs=50mV/(I-0.1mA)：1mA→55.6Ω；10mA→5.05Ω；100mA→0.50Ω。'},

const TABS=[
  {id:'days7',n:'7d',label:'7天速成'},

const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

/* 导航 */
function buildNav(){
  const nav=$('#nav');
  TABS.forEach((t,i)=>{
    const b=el('button','tab'+(i===0?' active':''),`<span class="n">${t.n}</span>${t.label}`);
    b.onclick=()=>switchView(t.id,b);
    nav.appendChild(b);
  });
}
function switchView(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  else{const idx=TABS.findIndex(t=>t.id===id);document.querySelectorAll('.tab')[idx]?.classList.add('active');}
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- 总览 ---------- */
function renderQuiz(){
  const v=$('#view-quiz');
  v.innerHTML=`
    <div class="sec-head"><h2>选择题</h2><span class="sub">// 20 分 · 每题 2 分 · 点选项即判</span></div>
    <div class="quiz-bar">
      <span class="score">得分 <b id="qScore">0</b> / <span id="qDone">0</span> 已答 · 共 ${DATA.quiz.length}</span>
      <div class="prog"><i id="qProg"></i></div>
      <button class="btn" id="qReveal">显示全部答案</button>
      <button class="btn" id="qReset">重做</button>
    </div>
    <div id="quizList"></div>`;
  const list=v.querySelector('#quizList');
  list.innerHTML='';
  DATA.quiz.forEach((q,qi)=>{
    const card=el('div','q');card.dataset.qi=qi;
    const multi=Array.isArray(q.a)&&q.a.length>1;
    let opts='';
    q.o.forEach((o,oi)=>{
      const L=(q.labels||'ABCDEFG')[oi];
      opts+=`<div class="opt" data-l="${L}"><span class="lb">${L}</span><span>${o}</span></div>`;
    });
    card.innerHTML=`
      <div class="stem"><span class="qn">${String(qi+1).padStart(2,'0')}</span><span>${q.q}</span>${multi?'<span class="multi">多选</span>':''}</div>
      <div class="opts">${opts}</div>
      ${q.e?`<div class="exp"><b>解析 · </b>${q.e}</div>`:''}`;
    const ans=Array.isArray(q.a)?q.a:[q.a];
    card.querySelectorAll('.opt').forEach(opt=>{
      opt.onclick=()=>answer(card,opt,ans,q);
    });
    list.appendChild(card);
  });
  v.querySelector('#qReveal').onclick=revealAllQuiz;
  v.querySelector('#qReset').onclick=resetQuiz;
  updateQuizBar();
}
const quizState={};
function answer(card,opt,ans,q){
  const qi=card.dataset.qi;
  if(quizState[qi])return;
  const multi=ans.length>1;
  if(multi){
    // 多选:点亮所选,需点"提交"——简化为逐个点击,最后自动判定全选齐
    opt.classList.toggle('sel');
    opt.style.borderColor=opt.classList.contains('sel')?'var(--cyan)':'';
    const picked=[...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.l);
    if(picked.length>=ans.length){
      gradeMulti(card,ans,picked,qi);
    }
    return;
  }
  quizState[qi]=true;
  const chosen=opt.dataset.l;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('disabled');
    if(ans.includes(o.dataset.l))o.classList.add('correct');
  });
  if(!ans.includes(chosen))opt.classList.add('wrong');
  else card.dataset.right='1';
  card.querySelector('.exp')?.classList.add('show');
  updateQuizBar();
}
function gradeMulti(card,ans,picked,qi){
  quizState[qi]=true;
  const ok=ans.length===picked.length&&ans.every(a=>picked.includes(a));
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.remove('sel');o.style.borderColor='';o.classList.add('disabled');
    if(ans.includes(o.dataset.l))o.classList.add('correct');
    else if(picked.includes(o.dataset.l))o.classList.add('wrong');
  });
  if(ok)card.dataset.right='1';
  card.querySelector('.exp')?.classList.add('show');
  updateQuizBar();
}
function updateQuizBar(){
  const done=Object.keys(quizState).length;
  const right=document.querySelectorAll('.q[data-right="1"]').length;
  $('#qScore').textContent=right;
  $('#qDone').textContent=done;
  $('#qProg').style.width=(done/DATA.quiz.length*100)+'%';
}
function revealAllQuiz(){
  document.querySelectorAll('#quizList .q').forEach(card=>{
    const qi=card.dataset.qi;if(quizState[qi])return;
    quizState[qi]=true;
    const q=DATA.quiz[qi];const ans=Array.isArray(q.a)?q.a:[q.a];
    card.querySelectorAll('.opt').forEach(o=>{o.classList.add('disabled');
      if(ans.includes(o.dataset.l))o.classList.add('correct');});
    card.querySelector('.exp')?.classList.add('show');
  });
  updateQuizBar();
}
function resetQuiz(){for(const k in quizState)delete quizState[k];renderQuiz();}

  DATA.blanks.forEach((b,i)=>{
    let html=b.t.replace(/\{\{(.*?)\}\}/g,(m,p)=>`<span class="fill" title="点击显示">${p}</span>`);

function renderQA(target,arr,title,sub,note){
  const v=$('#view-'+target);
  v.innerHTML=`<div class="sec-head"><h2>${title}</h2><span class="sub">${sub}</span></div>
    ${note?`<div class="src-note">${note}</div>`:''}

    <div id="${target}List"></div>`;
  const list=v.querySelector('#'+target+'List');
  arr.forEach((item,i)=>{
    const todo=!item.a;
    const d=el('details','qa'+(todo?' todo':''));
    d.innerHTML=`<summary><span class="qn">${String(i+1).padStart(2,'0')}</span><span>${item.q}${item.tag?`<span class="tag-mini">${item.tag}</span>`:''}</span><span class="arr">▸</span></summary>
      <div class="ans">${item.a||'<span class="hint">此题题样未附答案 · 属于自行准备范围，按相邻同类题套路作答即可。</span>'}</div>`;
    list.appendChild(d);

  v.querySelector('#exAll').onclick=()=>list.querySelectorAll('details').forEach(d=>d.open=true);
  v.querySelector('#clAll').onclick=()=>list.querySelectorAll('details').forEach(d=>d.open=false);
}

'<b>什么叫线性度</b>：输出-输入校准曲线与理论拟合直线的最大偏差 / 满量程输出，即非线性误差，用相对误差表示',
'<b>什么是灵敏度</b>：描述输出量对输入量敏感程度，K=输出变化值/输入变化值=Δy/Δx',
'<b>传感器及三部分组成</b>：一定精确度把被测量转为有确定对应关系物理量的装置；敏感元件+传感(转换)元件+调理电路',
'<b>静特性指标</b>：灵敏度、线性度、迟滞、重复性、分辨力、稳定性',
'<b>测量误差定义/分类/表示</b>：测量值−真值；分系统/随机/粗大；用绝对/相对/引用误差表示',
'<b>绝对/相对/引用误差</b>：测量值−真值；绝对误差/真值；绝对误差/量程',
'<b>精密度/正确度/准确度</b>：随机误差大小 / 系统误差大小 / 两者综合',
]},
{label:'计算套路',items:[
'<b>一阶特性方程求τ、k</b>：化成 τ·dy/dt+y=kx，τ=dy系数/y系数、k=x系数/y系数。例 20dy/dt+5y=0.15x → τ=4s、k=0.03',
'<b>一阶冲激响应</b>：h(t)=(k/τ)·e^(−t/τ)',
'<b>一阶频率响应</b>：幅频 A=k/√(1+ω²τ²)，相频 φ=−arctan(ωτ)',
'<b>二阶工作频率范围</b>：由允许幅值误差(如<5%)定，ξ=0.5 时 f≤0.32f0',
]},
]},
{day:2,title:'应变式传感器',groups:[
{label:'核心概念',items:[
'<b>应变效应</b>(金属，受拉电阻增大)是金属应变片基础；<b>半导体=压阻效应</b>(电阻率变，大十倍)',
'灵敏系数 <b>k=(ΔR/R)/ε</b>；影响金属K主因<b>几何尺寸</b>、半导体主因<b>电阻率</b>',
'实际灵敏度<理论k0，因<b>横向效应</b>；减横向效应用<b>直线栅式/箔式</b>，栅窄基长长误差小',
'应变计分<b>金属式/半导体式</b>；组成=电阻应变片+测量电路；结构=弹性敏感元件+应变计',
'测力传感器=<b>弹性体+应变计+外壳</b>；弹性体结构<b>柱式/轮辐式/悬梁式/环式</b>；悬臂梁分等截面/等强度',
'金属缺点<b>非线性明显、抗干扰差</b>；半导体优点<b>灵敏度高</b>',
'单向应力贴片与主应力成 <b>0°</b>；直接影响精度的是<b>弹性敏感元件</b>',
]},
{label:'简答要点',items:[
'<b>应变式特点</b>：测量范围广精度高、稳定可靠寿命长、频响好、耐恶劣环境、易小型化整体化',
'<b>零漂定义+原因</b>：恒温不受载电阻随时间变；敏感栅工作电流温度效应、内应力变化、粘接剂固化不足',
'<b>零漂和蠕变</b>：零漂同上；蠕变=恒温恒载下应变随时间变，因粘合剂不当、制造内应力',
'<b>金属vs半导体应变片原理</b>：金属变几何尺寸、电阻率不变；半导体压阻效应、电阻率大变',
'<b>什么是电阻应变效应</b>：金属导体受力变形(伸长/缩短)时电阻变化的物理现象',
'<b>对粘贴剂要求</b>：粘结强度、准确传递应变、蠕变小、机械滞后小、耐疲劳、稳定、不腐蚀、储存期、温度范围',
]},
{label:'计算套路',items:[
'<b>单臂:半桥:全桥应变灵敏度 = 1:2:4</b>（单臂¼KεE、半桥½KεE、全桥KεE）',
]},
{label:'设计套路',items:[
'<b>应变式传感器</b>：弹性敏感元件(悬臂梁/柱)+电阻应变片+惠斯通电桥，敏感元件=应变片',
]},
]},
{day:3,title:'温度补偿与电桥',groups:[
{label:'核心概念',items:[
'温度误差(热输出)两原因：<b>敏感栅电阻随温变</b>+<b>试件与应变丝线膨胀系数不一</b>',
'补偿四法：<b>电桥补偿、计算机补偿、应变计自补偿、热敏电阻补偿</b>；<b>电阻补偿法不存在</b>',
'电桥补偿法：工作片+补偿片接<b>相邻臂</b>，补偿件同材料、不受力、同温场',
'应变自补偿：<b>选择式、双金属敏感栅</b>',
'<b>直流电桥平衡 R1R4=R2R3</b>；电桥灵敏度 <b>1:2:4</b>；零点漂移用<b>串并联电阻法</b>；交流电桥是电感传感器主转换电路',
]},
{label:'简答要点',items:[
'<b>电阻应变计温度误差原因</b>：敏感栅电阻随温变；试件与应变丝线膨胀系数不一致使应变丝附加变形',
'<b>温度补偿方法</b>：电桥补偿法、辅助测温元件计算机补偿法、应变计自补偿法、热敏电阻补偿法',
'<b>电桥补偿法原理</b>：补偿片RB与工作片R1相同、贴相同试件、相同温度，接相邻臂，温度引起ΔR相等相消，电桥输出与温度无关',
]},
{label:'计算套路',items:[
'<b>电桥输出通式</b>：Uo={[(R1+R2)R4−R1(R3+R4)]/[(R3+R4)(R1+R2)]}·E，R1=R2=R3=R4 时 Uo=0',
'<b>单臂 Uo≈¼·(ΔR/R)·E=¼KεE</b>；半桥 ½KεE；全桥 KεE',
'<b>平衡条件 R1R4=R2R3</b>，例 R1=1,R2=2,R3=3 → R4=R2R3/R1=6',
]},
]},
{day:4,title:'各类传感器',groups:[
{label:'核心概念',items:[
'热敏电阻三型：<b>PTC正温度 / CTR临界(开关型) / NTC负温度</b>',
'测温传感器：热电阻/热电偶/热敏电阻；<b>可直接测温=热电偶</b>；热电阻三线制为<b>减小引线电阻误差</b>；半导体温度传感器分接触型/非接触型(红外)',
'<b>压电效应</b>：晶体受力生电荷；<b>逆压电效应</b>=电致伸缩；压电式<b>只测动态</b>；石英测加速度基于压电效应',
'差动变压器衔铁：<b>电阻率大、导磁率高、饱和磁感应大</b>；<b>差动自感=简单自感2倍</b>；变磁阻式调制磁阻改变线圈电感量',
'电感式利用<b>自感或互感</b>变化；电容变隙式非线性严重→<b>差动型</b>',
'光电二极管=<b>PN结单向导电性</b>；外光电效应=光电管/倍增管；光电导效应=光敏电阻；霍尔测磁/电流/位移；电涡流非接触测位移',
]},
{label:'简答要点',items:[
'<b>压电效应+压电传感器</b>：晶体受力表面生电荷；压电加速度、压电谐振式、声表面波传感器',
'<b>晶体压电效应+举例</b>：石英不受力时正负电荷中心重合不显极性，受力时分离显极性；中心对称晶体无压电效应',
'<b>霍尔效应+可测量</b>：载流体在磁场中垂直方向生电位差；测磁感应强度、电流、功率、位移',
'<b>差动变压器零位残余电压原因+措施</b>：线圈不对称、磁性材料谐波、铁芯不均、激励谐波；用相敏检波、补偿电路、提高对称性',
]},
{label:'计算套路',items:[
'<b>压电加速度</b>：总灵敏度 K=K1·K2(pC/g×mV/pC=mV/g)，a=U/K。例 5×50=250mV/g，2V→8g',
'<b>压电电压灵敏度 Ku=Kq/Cs</b>；接电缆后总电容 C=Cs+Cc+Ci，最低可测频率由 τ=Ri·C 定',
'<b>二阶谐振</b>：Mr=1/[2ξ√(1−ξ²)] 求 ξ；ωn=ωr/√(1−2ξ²)',
'<b>多环节总灵敏度=各环节灵敏度相乘</b>(如压电压力传感器→电荷放大→示波器)',
]},
{label:'设计套路（测什么→效应→敏感元件）',items:[
'<b>光纤位移</b>：发射+接收光纤→反射光强变化→光电二极管，敏感元件=光纤探头',
'<b>加速度(压电)</b>：质量块+压电晶片+预紧弹簧，敏感元件=压电晶片，Q=d·ma',
'<b>压力(应变)</b>：弹性膜片+应变片+电桥，敏感元件=膜片与应变片',

'<b>光纤相位(零差)</b>：激光→分束→测量臂+参考臂→合束干涉→相位解调',
'<b>迈克尔逊干涉仪</b>：激光器+分束器+固定镜+动镜+光电探测器',
'<b>热电偶测温系统</b>：热电偶+补偿导线+冷端补偿+放大+A/D+显示',
'<b>光电式</b>：光源+光路(调制光通量)+光电元件+测量电路',
'<b>热释电报警器</b>：菲涅尔透镜+热释电晶体+FET+比较器→声光报警，敏感元件=热释电晶体',

]},
{day:5,title:'测量与误差',groups:[
{label:'核心概念',items:[
'误差三类：<b>系统/随机/粗大</b>；<b>绝对=测量−真值，相对=绝对/真值，引用=绝对/量程</b>',
'<b>精密度</b>(随机)、<b>正确度</b>(系统)、<b>准确度</b>(综合)',
'仪表绝对误差=<b>精度等级×量程/100</b>；量程用<b>2/3以上</b>；测量分直接/间接/组合；GB高于ISO',
'改装电流表并<b>分流器 Rs=Ig·Rg/(I−Ig)</b>；电压表串<b>附加电阻 Rf=(U−Ig·Rg)/Ig</b>',
'<b>磁电系测平均值/直流，电磁系电动系测有效值</b>；微差式测量Δx精度低但x精度高',
]},
{label:'简答要点',items:[
'<b>直流电位差计优点</b>：补偿法平衡时不取电流、输入阻抗无穷大、不影响被测电路、准确度高；标准电池校准+调比较电压指零',
'<b>直流/交流电桥平衡+为何交流不一定平衡</b>：直流 R1R4=R2R3；交流 Z1Z4=Z2Z3 需模平衡且相角平衡，须同时满足故不一定能平衡',
'<b>电感/电容电桥平衡</b>：相对臂阻抗乘积相等，模平衡+相角平衡',
'<b>数字电桥原理</b>：交流激励测电压电流幅值相位，A/D+微处理器算出阻抗',
'<b>为什么引入引用误差</b>：相对误差随被测量变化不便标等级，引用误差对同量程为定值便于定级',
'<b>智能化测量+优点</b>：微处理器为核心；自动测量、自校准/补偿/诊断、可编程、非线性校正',
]},
{label:'计算套路',items:[
'<b>量程合格判定</b>：引用误差=|最大绝对误差|/量程，比精度等级。例 3mA/250mA=1.2%>1.0级→不合格',
'<b>反选准确度等级</b>：允许绝对误差=被测×相对误差要求，等级=绝对误差/量程。例 250×0.5%=1.25V，250量程→0.5级',
'<b>改装电流表</b>：Rs=Ig·Rg/(I−Ig)；<b>改装电压表</b>：Rf=(U−Ig·Rg)/Ig；表头内阻=额定压降/满偏电流',
'<b>电压表负载效应</b>：内阻有限，并联后读数偏低(如50k表测40k/60k分压)',
'<b>求实际电流/电压</b>：列等效电源E、内阻R的两个方程联立',
'<b>功率表量程</b>：I=P/U 选电流量程、U 选电压量程',
'<b>磁电/电磁/电动系读数</b>：磁电=直流分量(平均值)，电磁/电动=有效值 √(U1²+U2²)',
'<b>电压灵敏度=1/Ig (Ω/V)</b>；各量程内阻=量程/Ig；静态灵敏度求输出范围=灵敏度×输入',
]},
{label:'设计套路',items:[
'<b>电动系电流表/电压表/功率表</b>：偏转∝两线圈电流积；电流表线圈串联，电压表串附加电阻，功率表固定线圈接电流+可动线圈接电压(∝UI=功率)',
]},
]},
{day:6,title:'信号与数字化',groups:[
{label:'核心概念',items:[
'频谱：<b>周期→傅里叶级数，非周期→傅里叶变换，随机→功率谱</b>',
'<b>调幅=载波幅值带信息，调频=载波频率带信息</b>；滤波器四类<b>低通/高通/带通/带阻</b>',
'调制：低频信号控制高频载波；分<b>调幅/调频/调相</b>',
'<b>采样定理 fs≥2fmax</b>；抗混叠滤波防混叠；能量泄露加窗减小；数字化=采样/量化/编码',
'ADC类型：逐次逼近/双积分/<b>并行比较(最快)</b>；主要指标<b>分辨率</b>；A/D是数字化核心；电子计数器测频 <b>f=N/T</b>',
]},
{label:'简答要点',items:[
'<b>电子计数器结构+原理</b>：输入通道+时基+闸门+计数器+显示；测频 f=N/T',
'<b>滤波器类型+作用</b>：低通/高通/带通/带阻；选频、抗混叠、降噪、信号分离',
'<b>计数器测周期/时间间隔/频率比/相位</b>：测周期计标准时钟、时间间隔用起止信号、频率比低频作闸门、相位转时间差',
'<b>ADC转换原理+类型</b>：采样/保持/量化/编码；逐次逼近、双积分、并行比较',
'<b>并行比较ADC快的原因</b>：2ⁿ−1个比较器同时比较，一次得全部位，无需逐位逼近',
'<b>频谱分析/逻辑分析</b>：傅里叶变换到频域看分量；多通道采数字时序',
'<b>模拟信号数字化过程</b>：采样、量化、编码(前置抗混叠滤波)',
'<b>采样定量+作用</b>：时间离散+幅值离散；须满足采样定理 fs≥2fmax 才不失真',
'<b>能量泄露</b>：非整周期截断使频谱能量扩散到旁瓣；加窗函数减小',
'<b>抗混叠滤波作用</b>：采样前滤除高于fs/2的高频，防混叠失真',
'<b>法定计量单位</b>：以SI为基础，7个基本单位(米千克秒安培开尔文摩尔坎德拉)+导出单位+词头',
'<b>周期/准周期/瞬变非周期频谱特点</b>：离散等间隔 / 离散无公倍周期 / 连续频谱',
'<b>调制+目的+分类</b>：低频控载波；便于放大传输、抗干扰；调幅/调频/调相',
]},
{label:'设计套路',items:[
'<b>4~20mA转DC1~5V</b>：250Ω采样电阻(I/V转换)+运放电压跟随',
'<b>智能化电测系统</b>：传感器+信号调理+多路开关+采样保持+A/D+微处理器+显示',
'<b>多通道ADC采样</b>：各路采样保持+多路模拟开关+单ADC分时转换',
]},
]},

function pickRandom(arr,n){
  const a=arr.slice(),out=[];
  for(let i=0;i<n&&a.length;i++){
    const k=Math.floor(Math.random()*a.length);
    out.push(a.splice(k,1)[0]);
  }
  return out;
}
function buildExamPaper(){
  const qs=pickRandom(DATA.quiz,EXAM_QUIZ_N).map((q,i)=>({type:'quiz',q,id:'q'+i}));
  const bs=pickRandom(DATA.blanks,EXAM_BLANK_N).map((b,i)=>({type:'blank',q:b,id:'b'+i}));
  const paper=[...qs,...bs];
  for(let i=paper.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [paper[i],paper[j]]=[paper[j],paper[i]];
  }
  return paper;
}

const WRONG_KEY='sx-wrongs';
function getWrongs(){try{return JSON.parse(localStorage.getItem(WRONG_KEY)||'[]')}catch(e){return[]}}
function setWrongs(a){localStorage.setItem(WRONG_KEY,JSON.stringify(a))}
function wrongKeyOf(it){return it.type+'\n'+(it.type==='quiz'?it.q.q:it.q.t)}
function addWrongs(items){
  const cur=getWrongs(),seen=new Set(cur.map(wrongKeyOf));
  for(const it of items){const k=wrongKeyOf(it);if(!seen.has(k)){cur.push(it);seen.add(k)}}
  setWrongs(cur);
}
function removeWrong(it){
  const k=wrongKeyOf(it);
  setWrongs(getWrongs().filter(w=>wrongKeyOf(w)!==k));
}
function buildWrongPaper(){
  return getWrongs().map((w,i)=>({type:w.type,q:w.q,id:'w'+i}));
}

function renderExamQuiz(body,item,idx){
  const q=item.q;
  const multi=Array.isArray(q.a)&&q.a.length>1;
  const labels=q.labels||'ABCDEFG';
  const saved=examState.ans[idx]||[];
  let opts='';
  q.o.forEach((o,oi)=>{
    const L=labels[oi];
    const sel=saved.includes(L)?' selected':'';
    opts+=`<div class="opt${sel}" data-l="${L}"><span class="lb">${L}</span><span>${o}</span></div>`;
  });
  body.innerHTML=`
    <div class="q">
      <div class="stem"><span class="qn">${String(idx+1).padStart(2,'0')}</span><span>${q.q}</span>${multi?'<span class="multi">多选</span>':''}</div>
      <div class="opts">${opts}</div>
      <div class="ex-hint">${multi?'多选题：可点多个选项，再次点击取消选择':'单选题：点击选项即选择，可改选其他选项'}</div>
    </div>`;
  body.querySelectorAll('.opt').forEach(opt=>{
    opt.onclick=()=>{
      const L=opt.dataset.l;
      let cur=examState.ans[idx]||[];
      if(multi){
        if(cur.includes(L))cur=cur.filter(x=>x!==L);
        else cur=[...cur,L];

        opt.classList.toggle('selected');
      }else{
        cur=[L];
        examState.ans[idx]=cur;
        body.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
        opt.classList.add('selected');
      }
    };
  });
}

function gradeExam(){
  const dec=s=>{const d=document.createElement('div');d.innerHTML=s;return d.textContent||'';};
  let correct=0;
  const wrongs=[];
  examState.paper.forEach((item,idx)=>{
    const kp=kpOf(item.q,item.type);
    let ok=false,userAns,rightAns;
    if(item.type==='quiz'){
      const ans=Array.isArray(item.q.a)?item.q.a:[item.q.a];
      const user=(examState.ans[idx]||[]).slice().sort();
      const right=ans.slice().sort();
      ok=user.length===right.length&&user.every((v,i)=>v===right[i]);
      userAns=user.join('')||'未作答';
      rightAns=ans.join('');
    }else{
      const rights=[];
      item.q.t.replace(/\{\{(.*?)\}\}/g,(m,p)=>{rights.push(dec(p).trim());return m;});
      const user=examState.ans[idx]||[];
      ok=rights.every((r,i)=>{
        const u=(user[i]||'').trim().toLowerCase();
        return u&&u===r.toLowerCase();
      });
      userAns=rights.map((r,i)=>user[i]||'（空）').join(' | ');
      rightAns=rights.join(' | ');
    }
    if(ok)correct++;
    else wrongs.push({idx,item,userAns,rightAns,kp});
  });
  examState.score=correct;
  examState.wrongs=wrongs;
  /* 错题本更新 */
  if(examState.wrongMode){
    // 错题模式：答对的移出错题本
    examState.paper.forEach((item,idx)=>{
      if(!wrongs.some(w=>w.idx===idx))removeWrong(item);
    });
  }else{
    // 普通模式：错题加入错题本（去重）
    addWrongs(wrongs.map(w=>w.item));
  }
}

  let comment;
  if(pct>=90)comment='稳了，继续保持';
  else if(pct>=70)comment='基础不错，再补几个点就稳';
  else if(pct>=50)comment='差点意思，按建议方向重点复习';
  else comment='得加把劲，先把知识点过一遍再来';

  // 错题按知识点聚合统计
  const kpMap={};
  wrongs.forEach(w=>{
    const k=w.kp.day;
    if(!kpMap[k])kpMap[k]={...w.kp,count:0};
    kpMap[k].count++;
  });
  const totalW=wrongs.length||1;
  const statHtml=Object.values(kpMap).sort((a,b)=>b.count-a.count).map(kp=>{
    const pct=Math.round(kp.count/totalW*100);
    const advice=KP_ADVICE[kp.day]||KP_ADVICE[7];
    return `<div class="kp-stat">
      <div class="kp-stat-head">
        <span class="kp-stat-title"><span class="dnum">D${kp.day}</span>${kp.title}</span>
        <span class="kp-stat-count">错 <b>${kp.count}</b> 题<span class="pct">${pct}%</span></span>
      </div>
      <div class="kp-stat-bar"><i style="width:${pct}%"></i></div>
      <div class="kp-stat-advice"><b>复习建议：</b>${advice}</div>
      <div class="kp-stat-foot"><button class="btn ex-kp-btn" data-day="${kp.day}">去复习 →</button></div>
    </div>`;
  }).join('');

  let wrongHtml='';
  wrongs.forEach(w=>{
    const stem=w.item.type==='quiz'?w.item.q.q:w.item.q.t.replace(/\{\{.*?\}\}/g,'_____');
    wrongHtml+=`
      <div class="q ex-wrong">
        <div class="stem"><span class="qn">${String(w.idx+1).padStart(2,'0')}</span><span>${stem}</span></div>
        <div class="exp show">
          <div><b>你的答案：</b><span style="color:var(--red)">${w.userAns}</span></div>
          <div><b>正确答案：</b><span style="color:var(--green)">${w.rightAns}</span></div>
          <div class="warn"><b>知识点：</b>D${w.kp.day} ${w.kp.title}</div>
        </div>
      </div>`;
  });

  v.innerHTML=`
    <div class="sec-head"><h2>${wm?'错题练习结果':'自测结果'}</h2><span class="sub">// ${score} / ${total} · ${pct}%</span></div>
    <div class="ex-score">
      <div class="big" style="color:${color}">${score}<span style="font-size:1.6rem;color:var(--txt2)">/${total}</span></div>
      <div class="pct">${pct}% · ${comment}</div>
    </div>
    ${wm?`<div class="we-note">本次清除 <b style="color:var(--green)">${cleared}</b> 道错题 · 错题本剩余 <b style="color:var(--red)">${wc}</b> 题</div>`:''}
    ${wrongs.length?`
      <div class="sec-head" style="margin-top:24px"><h3 style="font-size:1.2rem">错题回顾</h3><span class="sub">// 共 ${wrongs.length} 题</span></div>
      ${wrongHtml}
    `:'<div class="card" style="text-align:center;color:var(--green);padding:24px">全部答对，没有错题 👍</div>'}
    ${statHtml?`
      <div class="sec-head" style="margin-top:24px"><h3 style="font-size:1.2rem">按知识点统计</h3><span class="sub">// ${wrongs.length} 道错题分布 · 按错题数排序</span></div>
      <div class="kp-stat-list">${statHtml}</div>
    `:''}
    <div class="day-foot" style="margin-top:24px">
      <button class="btn solid" id="exAgain">再来一次</button>
      ${wm&&wc>0?'<button class="btn solid" id="exContWrong">继续练错题 →</button>':''}
      <button class="btn" id="exBack">返回首页</button>
    </div>`;

  v.querySelector('#exAgain').onclick=()=>{examState.stage='idle';examState.wrongMode=false;renderExam();};
  const cw=v.querySelector('#exContWrong');
  if(cw)cw.onclick=()=>{
    examState.paper=buildWrongPaper();
    examState.ans={};
    examState.idx=0;
    examState.stage='taking';
    renderExam();
  };
  v.querySelector('#exBack').onclick=()=>{examState.stage='idle';examState.wrongMode=false;renderExam();switchView('days7');};
  v.querySelectorAll('.ex-kp-btn').forEach(b=>{
    b.onclick=()=>{
      const day=+b.dataset.day;
      switchView('days7');
      setTimeout(()=>showDay7(day),80);
    };
  });
}

/* ---------- 搜索 ---------- */
function setupSearch(){
  const inp=$('#search');
  inp.oninput=()=>{
    const kw=inp.value.trim().toLowerCase();
    const active=document.querySelector('.view.active');
    if(!active)return;
    const cards=active.querySelectorAll('.kp,.q,.blank,.qa');
    if(!kw){cards.forEach(c=>c.style.display='');return;}
    cards.forEach(c=>{
      c.style.display=c.textContent.toLowerCase().includes(kw)?'':'none';
    });
  };
}

/* ---------- 主题 ---------- */
function setupTheme(){
  const btn=$('#themeBtn');
  const saved=localStorage.getItem('sx-theme');
  if(saved)document.documentElement.dataset.theme=saved;
  btn.onclick=()=>{
    const cur=document.documentElement.dataset.theme;
    const next=cur==='scope'?'paper':'scope';
    document.documentElement.dataset.theme=next;
    localStorage.setItem('sx-theme',next);
  };
}

/* ---------- 启动 ---------- */
buildNav();
renderDays7();
renderExam();
renderQuiz();
renderBlanks();
renderQA('qa',DATA.qa,'简答题','// 25 分 · 每题 5 分');
renderQA('calc',DATA.calc,'计算题','// 20–30 分 · 每题 5–10 分');
renderQA('design',DATA.design,'设计题','// 10–20 分 · 每题 5–10 分');
setupSearch();
setupTheme();
</script>
