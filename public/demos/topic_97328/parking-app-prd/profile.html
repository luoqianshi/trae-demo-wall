<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>个人中心</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
        .menu-item {
            transition: background 0.15s ease;
            cursor: pointer;
        }
        .menu-item:active {
            background: var(--color-bg-sunken);
        }
    </style>
</head>
<body class="antialiased">
    <main class="pb-[calc(var(--tabbar-height)+var(--tabbar-safe)+env(safe-area-inset-bottom,34px))]">
        <div style="height: var(--statusbar-height);" class="bg-transparent"></div>

        <header class="sticky top-0 z-30" style="height: var(--navbar-height); background: transparent;">
            <div class="flex items-center justify-between px-4" style="height: var(--navbar-height);">
                <div style="width: 88px;"></div>
                <div class="min-w-0 flex-1 text-center" style="font-size: var(--text-lg); font-weight: var(--font-semibold); letter-spacing: var(--tracking-tight); color: #FFFFFF;">个人中心</div>
                <div class="wx-menu transparent">
                    <button aria-label="更多"><i data-lucide="more-horizontal" style="width: 16px; height: 16px; color: #FFFFFF;"></i></button>
                    <span class="divider" style="background: rgba(255,255,255,0.3);"></span>
                    <button aria-label="关闭"><i data-lucide="x" style="width: 16px; height: 16px; color: #FFFFFF;"></i></button>
                </div>
            </div>
        </header>

        <section style="background: var(--gradient-header); border-radius: 0 0 24px 24px; padding: var(--space-2) var(--space-4) var(--space-10); margin-top: -44px; padding-top: calc(44px + var(--space-2));">
            <div class="flex flex-col items-center">
                <div class="flex items-center justify-center rounded-full" style="width: 56px; height: 56px; background: rgba(255,255,255,0.2); font-size: 28px; margin-bottom: var(--space-3);">🚗</div>
                <div style="font-size: var(--text-xl); font-weight: var(--font-bold); color: #FFFFFF; margin-bottom: var(--space-1);">张三</div>
                <div style="font-size: var(--text-sm); color: rgba(255,255,255,0.7);">138****8888</div>
            </div>
        </section>

        <div class="mx-4" style="margin-top: -20px; position: relative; z-index: 10;">
            <div class="rounded-lg bg-white" style="padding: var(--space-5) var(--space-4); box-shadow: var(--shadow-sm); animation: scaleIn 0.3s ease-out;">
                <div class="flex items-center justify-around">
                    <div class="flex flex-col items-center cursor-pointer tap-active" data-nav="orders">
                        <span style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-primary);">12</span>
                        <span style="font-size: var(--text-xs); color: var(--color-ink-tertiary); margin-top: 2px;">预约次数</span>
                    </div>
                    <div class="w-px self-stretch" style="background: var(--color-rule);"></div>
                    <div class="flex flex-col items-center cursor-pointer tap-active" onclick="alert('我的车辆功能开发中')">
                        <span style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-primary);">2</span>
                        <span style="font-size: var(--text-xs); color: var(--color-ink-tertiary); margin-top: 2px;">我的车辆</span>
                    </div>
                    <div class="w-px self-stretch" style="background: var(--color-rule);"></div>
                    <div class="flex flex-col items-center cursor-pointer tap-active" onclick="alert('常用停车功能开发中')">
                        <span style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-primary);">3</span>
                        <span style="font-size: var(--text-xs); color: var(--color-ink-tertiary); margin-top: 2px;">常用停车</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="mx-4 mt-3 flex flex-col gap-3">

            <div class="rounded-lg bg-white" style="box-shadow: var(--shadow-xs); animation: fadeSlideUp 0.4s ease-out 0.1s both;">
                <div class="menu-item flex items-center" style="padding: var(--space-4);" onclick="alert('我的车辆功能开发中')">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-info-bg); flex-shrink: 0;">🚗</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">我的车辆</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
                <div style="height: 1px; background: var(--color-rule-light); margin-left: var(--space-4);"></div>
                <div class="menu-item flex items-center" style="padding: var(--space-4);" onclick="alert('常用停车场功能开发中')">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-success-bg); flex-shrink: 0;">⭐</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">常用停车场</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
                <div style="height: 1px; background: var(--color-rule-light); margin-left: var(--space-4);"></div>
                <div class="menu-item flex items-center" style="padding: var(--space-4);" onclick="alert('电子发票功能开发中')">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-warning-bg); flex-shrink: 0;">🧾</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">电子发票</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
            </div>

            <div class="rounded-lg bg-white" style="box-shadow: var(--shadow-xs); animation: fadeSlideUp 0.4s ease-out 0.15s both;">
                <div class="menu-item flex items-center" style="padding: var(--space-4);" onclick="alert('无感支付设置功能开发中')">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: rgba(139,92,246,0.08); flex-shrink: 0;">💳</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">无感支付设置</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
                <div style="height: 1px; background: var(--color-rule-light); margin-left: var(--space-4);"></div>
                <div class="menu-item flex items-center" style="padding: var(--space-4);" onclick="alert('我的优惠券功能开发中')">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-error-bg); flex-shrink: 0;">🎫</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">我的优惠券</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
            </div>

            <div class="rounded-lg bg-white" style="box-shadow: var(--shadow-xs); animation: fadeSlideUp 0.4s ease-out 0.2s both;">
                <div class="menu-item flex items-center" style="padding: var(--space-4);" onclick="alert('帮助与反馈功能开发中')">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-info-bg); flex-shrink: 0;">💬</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">帮助与反馈</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
                <div style="height: 1px; background: var(--color-rule-light); margin-left: var(--space-4);"></div>
                <div class="menu-item flex items-center" style="padding: var(--space-4);" onclick="alert('设置功能开发中')">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-success-bg); flex-shrink: 0;">⚙️</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">设置</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
            </div>

        </div>

        <div style="height: var(--space-4);"></div>

        <nav class="fixed bottom-0 inset-x-0 z-40 border-t flex items-center justify-around" style="height: calc(var(--tabbar-height) + var(--tabbar-safe)); background: var(--tabbar-bg); border-color: var(--color-rule); padding-bottom: var(--tabbar-safe);">
            <a class="tab-item flex flex-col items-center justify-center flex-1 min-w-0 gap-0.5" data-nav="home">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span style="font-size: 10px; margin-top: 2px;">首页</span>
            </a>
            <a class="tab-item flex flex-col items-center justify-center flex-1 min-w-0 gap-0.5" data-nav="orders">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span style="font-size: 10px; margin-top: 2px;">订单</span>
            </a>
            <a class="tab-item active flex flex-col items-center justify-center flex-1 min-w-0 gap-0.5" data-nav="profile">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span style="font-size: 10px; color: var(--color-primary); margin-top: 2px; font-weight: var(--font-medium);">我的</span>
            </a>
        </nav>
    </main>
    <script src="assets/js/common.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
