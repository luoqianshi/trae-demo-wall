<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>停车场详情</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
</head>
<body class="antialiased">
    <main>
        <div class="h-[var(--statusbar-height)] bg-transparent"></div>

        <header class="sticky top-0 z-30">
            <div class="flex h-[var(--navbar-height)] items-center px-4">
                <div class="flex w-[88px] items-center justify-start">
                    <button data-action="back" class="back-btn" style="border: none; background: rgba(255,255,255,0.2); backdrop-filter: blur(4px);" aria-label="返回">
                        <i data-lucide="chevron-left" class="h-5 w-5" style="color: #FFFFFF;"></i>
                    </button>
                </div>
                <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: #FFFFFF;">停车场详情</div>
                <div class="wx-menu transparent">
                    <button aria-label="更多"><i data-lucide="more-horizontal" class="h-4 w-4" style="color: #FFFFFF;"></i></button>
                    <span class="divider" style="background: rgba(255,255,255,0.3);"></span>
                    <button aria-label="关闭"><i data-lucide="x" class="h-4 w-4" style="color: #FFFFFF;"></i></button>
                </div>
            </div>
        </header>

        <section class="relative" style="margin-top: -88px; height: 200px; background: var(--gradient-header);">
            <div class="absolute top-3 right-4 text-6xl opacity-20 select-none" aria-hidden="true">🏥</div>
            <div class="absolute bottom-4 left-4 right-4">
                <h1 class="text-[18px] font-bold leading-[1.25] tracking-[-0.01em]" style="color: #FFFFFF; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">市第一人民医院停车场</h1>
                <p class="mt-1 text-[12px] leading-[1.5]" style="color: rgba(255, 255, 255, 0.85);">西湖区灵隐路1号</p>
            </div>
        </section>

        <div class="mx-4" style="margin-top: -20px; position: relative; z-index: 10;">
            <div class="rounded-[var(--radius-lg)] p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); animation: scaleIn 0.3s ease-out;">
                <div class="flex items-start justify-around text-center">
                    <div class="flex-1">
                        <div class="text-[24px] font-bold leading-[1.25] tracking-tight" style="color: var(--state-success);">23</div>
                        <div class="mt-1 text-[12px] font-normal" style="color: var(--color-ink-tertiary);">空闲车位</div>
                    </div>
                    <div class="w-px self-stretch" style="background: var(--color-rule);"></div>
                    <div class="flex-1">
                        <div class="text-[24px] font-bold leading-[1.25] tracking-tight" style="color: var(--color-ink);">150</div>
                        <div class="mt-1 text-[12px] font-normal" style="color: var(--color-ink-tertiary);">总车位</div>
                    </div>
                    <div class="w-px self-stretch" style="background: var(--color-rule);"></div>
                    <div class="flex-1">
                        <div class="text-[24px] font-bold leading-[1.25] tracking-tight" style="color: var(--state-warning);">85%</div>
                        <div class="mt-1 text-[12px] font-normal" style="color: var(--color-ink-tertiary);">占用率</div>
                    </div>
                </div>
            </div>
        </div>

        <section class="mx-4 mt-4 rounded-[var(--radius-lg)]" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-xs); animation: fadeSlideUp 0.4s ease-out 0.1s both;">
            <div class="flex items-center px-4 py-3">
                <div class="w-1 h-4 rounded-full" style="background: var(--color-primary);"></div>
                <h2 class="ml-2 text-[15px] font-semibold tracking-[-0.01em]" style="color: var(--color-ink);">停车场信息</h2>
            </div>

            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">收费标准</span>
                <span class="text-[14px] font-semibold" style="color: var(--color-primary);">5元/小时</span>
            </div>

            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">营业时间</span>
                <span class="text-[14px]" style="color: var(--color-ink);">06:00-22:00</span>
            </div>

            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">距您</span>
                <span class="text-[14px]" style="color: var(--color-ink);">500m</span>
            </div>

            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">车位类型</span>
                <span class="text-[14px]" style="color: var(--color-ink);">普通/VIP(+5元)</span>
            </div>

            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">支付方式</span>
                <span class="text-[14px]" style="color: var(--color-ink);">微信支付/无感支付</span>
            </div>

            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">支持服务</span>
                <span class="text-[14px]" style="color: var(--color-ink);">支持预约/24h营业</span>
            </div>
        </section>

        <section class="mx-4 mt-4 flex flex-col items-center justify-center rounded-[var(--radius-lg)] cursor-pointer tap-active" style="height: 160px; background: var(--color-primary-50); animation: fadeSlideUp 0.4s ease-out 0.2s both;" onclick="alert('正在打开地图导航...')">
            <i data-lucide="map-pin" class="h-8 w-8" style="color: var(--color-primary);"></i>
            <p class="mt-2 text-[13px]" style="color: var(--color-primary-dark);">点击「导航前往」查看路线</p>
        </section>

        <div class="h-20"></div>

        <div class="fixed inset-x-0 bottom-0 z-40 border-t flex items-center gap-3 px-4 py-3" style="background: var(--color-bg-elevated); border-color: var(--color-rule); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));">
            <button class="btn-secondary flex-1 gap-2" onclick="alert('正在启动导航...')">
                <i data-lucide="navigation" class="h-4 w-4"></i>
                <span>导航前往</span>
            </button>
            <button class="btn-primary flex-1 gap-2" data-nav="reserve">
                <i data-lucide="calendar-check" class="h-4 w-4"></i>
                <span>立即预约</span>
            </button>
        </div>
    </main>
    <script src="assets/js/common.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
