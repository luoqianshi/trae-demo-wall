<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的订单</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
        .order-card {
            transition: transform 0.1s ease;
        }
        .order-card:active {
            transform: scale(0.985);
        }
    </style>
</head>
<body class="antialiased">
    <main style="padding-bottom: calc(var(--tabbar-height) + var(--tabbar-safe) + 20px);">
      <div class="h-[44px] bg-white"></div>

      <header class="sticky top-0 z-30 navbar-light">
        <div class="flex h-[44px] items-center px-4">
          <div class="flex w-[88px] items-center justify-start"></div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color:var(--color-ink);">我的订单</div>
          <div class="wx-menu">
            <button aria-label="更多"><i data-lucide="more-horizontal" class="h-4 w-4"></i></button>
            <span class="divider"></span>
            <button aria-label="关闭"><i data-lucide="x" class="h-4 w-4"></i></button>
          </div>
        </div>
      </header>

      <div class="filter-tabs sticky" style="top: 44px; z-index: 20;">
        <button class="filter-tab active" data-filter="all">全部</button>
        <button class="filter-tab" data-filter="active">进行中</button>
        <button class="filter-tab" data-filter="completed">已完成</button>
        <button class="filter-tab" data-filter="cancelled">已取消</button>
      </div>

      <div class="pb-[86px]">
        <div class="p-3" id="order-list">

          <div class="order-card mb-3 rounded-xl bg-white p-4" style="box-shadow:var(--shadow-sm); border:1px solid var(--color-rule-light); animation: fadeSlideUp 0.4s ease-out 0.05s both;" data-status="active">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="text-[16px]">🏥</span>
                  <span class="truncate text-[15px] font-semibold" style="color:var(--color-ink);">市第一人民医院停车场</span>
                </div>
              </div>
              <span class="shrink-0 rounded-full px-2.5 py-0.5 text-[12px] font-medium text-white whitespace-nowrap" style="background:var(--color-primary);">进行中</span>
            </div>
            <div class="mt-3 space-y-2">
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">预约时段</span>
                <span class="truncate" style="color:var(--color-ink);">07-03 10:00-12:00</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">车位类型</span>
                <span class="truncate" style="color:var(--color-ink);">普通车位</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">订单编号</span>
                <span class="truncate" style="color:var(--color-ink);">PK20260703001</span>
              </div>
            </div>
            <div class="mt-3 flex items-center justify-between border-t pt-3" style="border-color: var(--color-rule-light);">
              <span class="text-[16px] font-bold" style="color:var(--color-primary);">¥15.00</span>
              <button class="btn-primary shrink-0" style="height: 36px; padding: 0 16px; font-size: 13px;" data-action="view-detail">查看详情</button>
            </div>
          </div>

          <div class="order-card mb-3 rounded-xl bg-white p-4" style="box-shadow:var(--shadow-sm); border:1px solid var(--color-rule-light); animation: fadeSlideUp 0.4s ease-out 0.1s both;" data-status="completed">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="text-[16px]">🏞️</span>
                  <span class="truncate text-[15px] font-semibold" style="color:var(--color-ink);">西湖景区北山街停车场</span>
                </div>
              </div>
              <span class="shrink-0 rounded-full px-2.5 py-0.5 text-[12px] font-medium text-white whitespace-nowrap" style="background:var(--state-success);">已完成</span>
            </div>
            <div class="mt-3 space-y-2">
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">预约时段</span>
                <span class="truncate" style="color:var(--color-ink);">07-01 09:00-13:00</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">车位类型</span>
                <span class="truncate" style="color:var(--color-ink);">VIP车位</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">订单编号</span>
                <span class="truncate" style="color:var(--color-ink);">PK20260701003</span>
              </div>
            </div>
            <div class="mt-3 flex items-center justify-between border-t pt-3" style="border-color: var(--color-rule-light);">
              <span class="text-[16px] font-bold" style="color:var(--color-ink);">¥25.00</span>
              <div class="flex items-center gap-2">
                <button class="btn-outline shrink-0" style="height: 36px; padding: 0 16px; font-size: 13px;" data-nav="reserve">再次预约</button>
                <button class="btn-primary shrink-0" style="height: 36px; padding: 0 16px; font-size: 13px;" onclick="alert('发票已申请，将发送至您的邮箱')">开发票</button>
              </div>
            </div>
          </div>

          <div class="order-card mb-3 rounded-xl bg-white p-4" style="box-shadow:var(--shadow-sm); border:1px solid var(--color-rule-light); animation: fadeSlideUp 0.4s ease-out 0.15s both;" data-status="cancelled">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="text-[16px]">✈️</span>
                  <span class="truncate text-[15px] font-semibold" style="color:var(--color-ink);">萧山国际机场P1停车场</span>
                </div>
              </div>
              <span class="shrink-0 rounded-full px-2.5 py-0.5 text-[12px] font-medium text-white whitespace-nowrap" style="background:var(--state-error);">已取消</span>
            </div>
            <div class="mt-3 space-y-2">
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">预约时段</span>
                <span class="truncate" style="color:var(--color-ink);">06-28 14:00-16:00</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">取消原因</span>
                <span class="truncate" style="color:var(--color-ink);">用户主动取消</span>
              </div>
            </div>
            <div class="mt-3 flex items-center justify-between border-t pt-3" style="border-color: var(--color-rule-light);">
              <span class="text-[16px] font-bold line-through" style="color:var(--color-ink-tertiary);">¥15.00</span>
              <button class="btn-outline shrink-0" style="height: 36px; padding: 0 16px; font-size: 13px;" data-nav="reserve">再次预约</button>
            </div>
          </div>

        </div>
      </div>

      <nav class="fixed bottom-0 inset-x-0 z-40 border-t bg-white" style="border-color:var(--color-rule);">
        <div class="flex h-[50px] items-center justify-around">
          <a class="tab-item flex flex-col items-center gap-0.5 px-3 py-1" data-nav="home">
            <svg class="h-[22px] w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="text-[10px]">首页</span>
          </a>
          <a class="tab-item active flex flex-col items-center gap-0.5 px-3 py-1" data-nav="orders">
            <svg class="h-[22px] w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span class="text-[10px] font-medium">订单</span>
          </a>
          <a class="tab-item flex flex-col items-center gap-0.5 px-3 py-1" data-nav="profile">
            <svg class="h-[22px] w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="text-[10px]">我的</span>
          </a>
        </div>
        <div style="height: env(safe-area-inset-bottom,34px);"></div>
      </nav>
    </main>
    <script src="assets/js/common.js"></script>
    <script>
      lucide.createIcons();

      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          const filter = tab.dataset.filter;
          document.querySelectorAll('.order-card').forEach(card => {
            if (filter === 'all' || card.dataset.status === filter) {
              card.style.display = '';
            } else {
              card.style.display = 'none';
            }
          });
        });
      });
    </script>
</body>
</html>
