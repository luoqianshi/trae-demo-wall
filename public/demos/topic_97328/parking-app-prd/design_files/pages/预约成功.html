<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约成功</title>
    <style id="theme-vars">
/* ================================================
   Shared Parking Mini-Program — Brand Design Tokens
   Style: Fresh Technology (清新科技风)
   ================================================ */

:root {
  /* === Color System === */
  --color-primary: #0D9488;
  --color-primary-light: #14B8A6;
  --color-primary-dark: #0F766E;
  --color-primary-50: #F0FDFA;
  --color-primary-100: #CCFBF1;
  --color-primary-200: #99F6E4;
  --color-primary-700: #0F766E;
  --color-primary-900: #134E4A;

  --color-bg: #F8FAFB;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F1F5F9;

  --color-ink: #0F172A;
  --color-ink-secondary: #475569;
  --color-ink-tertiary: #94A3B8;
  --color-ink-quaternary: #CBD5E1;

  --color-rule: #E2E8F0;
  --color-rule-light: #F1F5F9;

  /* State colors — semantic only */
  --state-success: #10B981;
  --state-success-bg: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-bg: #FFFBEB;
  --state-error: #EF4444;
  --state-error-bg: #FEF2F2;
  --state-info: #3B82F6;
  --state-info-bg: #EFF6FF;

  /* Gradient */
  --gradient-primary: linear-gradient(135deg, #0D9488 0%, #06B6D4 100%);
  --gradient-header: linear-gradient(135deg, #134E4A 0%, #0D9488 60%, #06B6D4 100%);
  --gradient-card-hover: linear-gradient(135deg, #F0FDFA 0%, #ECFEFF 100%);

  /* === Typography === */
  --font-display: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-body: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;

  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.75;

  --tracking-tight: -0.01em;
  --tracking-normal: 0em;

  /* Font weight */
  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === Shape System === */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === Surface & Depth === */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 12px 40px rgba(0, 0, 0, 0.08);

  /* === Component Tokens === */
  --btn-height: 44px;
  --btn-radius: var(--radius-lg);
  --input-height: 44px;
  --input-radius: var(--radius-md);
  --card-radius: var(--radius-lg);
  --card-padding: var(--space-4);
  --card-border: 1px solid var(--color-rule-light);

  /* Tab bar */
  --tabbar-height: 52px;
  --tabbar-safe: env(safe-area-inset-bottom, 0px);
  --tabbar-bg: #FFFFFF;

  /* Status bar */
  --statusbar-height: 44px;

  /* Navigation bar */
  --navbar-height: 44px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen flex flex-col" style="background: var(--color-bg);">

        <!-- Status bar spacer -->
        <div class="h-11 shrink-0" style="background: var(--color-bg-elevated);"></div>

        <!-- Navigation bar -->
        <header class="sticky top-0 z-30 shrink-0" style="background: var(--color-bg-elevated); border-bottom: 1px solid var(--color-rule);">
            <div class="flex h-11 items-center px-4">
                <div class="flex w-[88px] items-center justify-start">
                    <button class="inline-flex h-8 w-8 items-center justify-center rounded-lg" style="border: 1px solid var(--color-rule); background: var(--color-bg-elevated);" aria-label="返回" data-dom-id="btn-back-home">
                        <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-ink);"></i>
                    </button>
                </div>
                <div class="min-w-0 flex-1 text-center" style="font-size: var(--text-lg); font-weight: var(--font-semibold); color: var(--color-ink); letter-spacing: var(--tracking-tight);">预约成功</div>
                <div class="flex h-8 w-[88px] items-center justify-center rounded-full" style="border: 1px solid var(--color-rule); background: rgba(255,255,255,0.9); color: var(--color-ink);" aria-label="小程序菜单">
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
                        <i data-lucide="more-horizontal" class="h-4 w-4"></i>
                    </button>
                    <span class="h-4 w-px" style="background: var(--color-rule);" aria-hidden="true"></span>
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
                        <i data-lucide="x" class="h-4 w-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Page body — vertically centered success state -->
        <div class="flex flex-1 flex-col items-center justify-center px-5 py-10">

            <!-- Success icon with pulse -->
            <div class="success-icon mb-5 flex h-20 w-20 items-center justify-center rounded-full" style="background: var(--state-success-bg);">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--state-success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>

            <!-- Success text -->
            <h1 class="mb-2 text-center" style="font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-ink); line-height: var(--leading-tight);">预约成功</h1>
            <p class="mb-8 text-center" style="font-size: var(--text-sm); color: var(--color-ink-tertiary); line-height: var(--leading-normal);">车位已锁定，请按时到达</p>

            <!-- Booking details card -->
            <div class="w-full rounded-xl p-4" style="max-width: 320px; background: var(--color-bg-elevated); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">

                <!-- Hospital name -->
                <div class="mb-4 flex items-center gap-2">
                    <span class="text-base leading-none">&#x1F3E5;</span>
                    <span class="truncate" style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">市第一人民医院停车场</span>
                </div>

                <!-- Divider -->
                <div class="mb-3" style="height: 1px; background: var(--color-rule-light);"></div>

                <!-- Info rows -->
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">预约时段</span>
                        <span class="truncate" style="font-size: var(--text-sm); color: var(--color-ink-secondary); font-weight: var(--font-medium);">今天 10:00 - 12:00</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">车位类型</span>
                        <span class="truncate" style="font-size: var(--text-sm); color: var(--color-ink-secondary); font-weight: var(--font-medium);">普通车位</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">订单编号</span>
                        <span class="truncate" style="font-size: var(--text-sm); color: var(--color-ink-secondary); font-weight: var(--font-medium);">PK20260703001</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">支付金额</span>
                        <span class="truncate" style="font-size: var(--text-base); color: var(--color-primary); font-weight: var(--font-bold);">¥15.00</span>
                    </div>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="mt-8 flex w-full items-center justify-center gap-4" style="max-width: 320px;">
                <button class="flex h-11 flex-1 items-center justify-center rounded-lg" style="background: var(--color-bg-sunken); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-dom-id="btn-back-home">返回首页</button>
                <button class="flex h-11 flex-1 items-center justify-center rounded-lg" style="background: var(--color-primary); color: #FFFFFF; font-size: var(--text-base); font-weight: var(--font-medium);" data-dom-id="btn-view-order">查看订单</button>
            </div>
        </div>
    </main>

    <style>
        @keyframes success-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.9; }
        }
        .success-icon {
            animation: success-pulse 2s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .success-icon {
                animation: none;
            }
        }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
