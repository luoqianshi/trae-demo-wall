<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停车场详情</title>
    <style id="theme-vars">
/* ================================================
   Shared Parking Mini-Program — Brand Design Tokens
   Style: Fresh Technology (清新科技风)
   ================================================ */

:root {
  /* === Color System === */
  --color-primary: #0D9488;
  --color-primary-light: #14B8A6;
  --color-primary-dark: #0F766E;
  --color-primary-50: #F0FDFA;
  --color-primary-100: #CCFBF1;
  --color-primary-200: #99F6E4;
  --color-primary-700: #0F766E;
  --color-primary-900: #134E4A;

  --color-bg: #F8FAFB;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F1F5F9;

  --color-ink: #0F172A;
  --color-ink-secondary: #475569;
  --color-ink-tertiary: #94A3B8;
  --color-ink-quaternary: #CBD5E1;

  --color-rule: #E2E8F0;
  --color-rule-light: #F1F5F9;

  /* State colors — semantic only */
  --state-success: #10B981;
  --state-success-bg: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-bg: #FFFBEB;
  --state-error: #EF4444;
  --state-error-bg: #FEF2F2;
  --state-info: #3B82F6;
  --state-info-bg: #EFF6FF;

  /* Gradient */
  --gradient-primary: linear-gradient(135deg, #0D9488 0%, #06B6D4 100%);
  --gradient-header: linear-gradient(135deg, #134E4A 0%, #0D9488 60%, #06B6D4 100%);
  --gradient-card-hover: linear-gradient(135deg, #F0FDFA 0%, #ECFEFF 100%);

  /* === Typography === */
  --font-display: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-body: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;

  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.75;

  --tracking-tight: -0.01em;
  --tracking-normal: 0em;

  /* Font weight */
  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === Shape System === */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === Surface & Depth === */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 12px 40px rgba(0, 0, 0, 0.08);

  /* === Component Tokens === */
  --btn-height: 44px;
  --btn-radius: var(--radius-lg);
  --input-height: 44px;
  --input-radius: var(--radius-md);
  --card-radius: var(--radius-lg);
  --card-padding: var(--space-4);
  --card-border: 1px solid var(--color-rule-light);

  /* Tab bar */
  --tabbar-height: 52px;
  --tabbar-safe: env(safe-area-inset-bottom, 0px);
  --tabbar-bg: #FFFFFF;

  /* Status bar */
  --statusbar-height: 44px;

  /* Navigation bar */
  --navbar-height: 44px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
        <!-- Status bar spacer -->
        <div class="h-[var(--statusbar-height)] bg-transparent"></div>

        <!-- Transparent navbar overlay on hero -->
        <header class="sticky top-0 z-30">
            <div class="flex h-[var(--navbar-height)] items-center px-4">
                <div class="flex w-[88px] items-center justify-start">
                    <button data-dom-id="btn-back" class="inline-flex h-8 w-8 items-center justify-center rounded-lg" aria-label="返回">
                        <i data-lucide="chevron-left" class="h-5 w-5" style="color: #FFFFFF;"></i>
                    </button>
                </div>
                <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: #FFFFFF;">停车场详情</div>
                <div class="flex h-8 w-[88px] items-center justify-center rounded-full border border-white/30 bg-white/10 backdrop-blur-sm" aria-label="小程序菜单">
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
                        <i data-lucide="more-horizontal" class="h-4 w-4" style="color: #FFFFFF;"></i>
                    </button>
                    <span class="h-4 w-px bg-white/30" aria-hidden="true"></span>
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
                        <i data-lucide="x" class="h-4 w-4" style="color: #FFFFFF;"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Hero banner -->
        <section class="relative" style="margin-top: -88px; height: 200px; background: var(--gradient-header);">
            <div class="absolute top-3 right-4 text-6xl opacity-20 select-none" aria-hidden="true">🏥</div>
            <div class="absolute bottom-4 left-4 right-4">
                <h1 class="text-[18px] font-bold leading-[1.25] tracking-[-0.01em]" style="color: #FFFFFF; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">市第一人民医院停车场</h1>
                <p class="mt-1 text-[12px] leading-[1.5]" style="color: rgba(255, 255, 255, 0.85);">西湖区灵隐路1号</p>
            </div>
        </section>

        <!-- Floating stats card -->
        <div class="mx-4" style="margin-top: -20px; position: relative; z-index: 10;">
            <div class="rounded-[var(--radius-lg)] p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm);">
                <div class="flex items-start justify-around text-center">
                    <div class="flex-1">
                        <div class="text-[24px] font-bold leading-[1.25] tracking-tight" style="color: var(--state-success);">23</div>
                        <div class="mt-1 text-[12px] font-normal" style="color: var(--color-ink-tertiary);">空闲车位</div>
                    </div>
                    <div class="w-px self-stretch" style="background: var(--color-rule);"></div>
                    <div class="flex-1">
                        <div class="text-[24px] font-bold leading-[1.25] tracking-tight" style="color: var(--color-ink);">150</div>
                        <div class="mt-1 text-[12px] font-normal" style="color: var(--color-ink-tertiary);">总车位</div>
                    </div>
                    <div class="w-px self-stretch" style="background: var(--color-rule);"></div>
                    <div class="flex-1">
                        <div class="text-[24px] font-bold leading-[1.25] tracking-tight" style="color: var(--state-warning);">85%</div>
                        <div class="mt-1 text-[12px] font-normal" style="color: var(--color-ink-tertiary);">占用率</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Info section -->
        <section class="mx-4 mt-4 rounded-[var(--radius-lg)]" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-xs);">
            <div class="flex items-center px-4 py-3">
                <div class="w-1 h-4 rounded-full" style="background: var(--color-primary);"></div>
                <h2 class="ml-2 text-[15px] font-semibold tracking-[-0.01em]" style="color: var(--color-ink);">停车场信息</h2>
            </div>

            <!-- Row: 收费标准 -->
            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">收费标准</span>
                <span class="text-[14px] font-semibold" style="color: var(--color-primary);">5元/小时</span>
            </div>

            <!-- Row: 营业时间 -->
            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">营业时间</span>
                <span class="text-[14px]" style="color: var(--color-ink);">06:00-22:00</span>
            </div>

            <!-- Row: 距您 -->
            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">距您</span>
                <span class="text-[14px]" style="color: var(--color-ink);">500m</span>
            </div>

            <!-- Row: 车位类型 -->
            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">车位类型</span>
                <span class="text-[14px]" style="color: var(--color-ink);">普通/VIP(+5元)</span>
            </div>

            <!-- Row: 支付方式 -->
            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">支付方式</span>
                <span class="text-[14px]" style="color: var(--color-ink);">微信支付/无感支付</span>
            </div>

            <!-- Row: 支持服务 -->
            <div class="flex items-center justify-between px-4 py-3" style="border-top: 1px solid var(--color-rule-light);">
                <span class="text-[14px]" style="color: var(--color-ink-tertiary);">支持服务</span>
                <span class="text-[14px]" style="color: var(--color-ink);">支持预约/24h营业</span>
            </div>
        </section>

        <!-- Map placeholder -->
        <section class="mx-4 mt-4 flex flex-col items-center justify-center rounded-[var(--radius-lg)]" style="height: 160px; background: var(--color-primary-50);">
            <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <p class="mt-2 text-[13px]" style="color: var(--color-primary-dark);">点击「导航前往」查看路线</p>
        </section>

        <!-- Bottom spacer for fixed action bar -->
        <div class="h-20"></div>

        <!-- Fixed bottom action bar -->
        <div class="fixed inset-x-0 bottom-0 z-40 border-t flex items-center gap-3 px-4 py-3" style="background: var(--color-bg-elevated); border-color: var(--color-rule);">
            <button data-dom-id="btn-navigate" class="flex h-[var(--btn-height)] flex-1 items-center justify-center gap-2 rounded-[var(--btn-radius)] text-[15px] font-semibold transition-opacity active:opacity-70" style="background: var(--color-bg-sunken); color: var(--color-ink-secondary);">
                <i data-lucide="navigation" class="h-4 w-4"></i>
                <span>导航前往</span>
            </button>
            <button data-dom-id="btn-reserve" class="flex h-[var(--btn-height)] flex-1 items-center justify-center gap-2 rounded-[var(--btn-radius)] text-[15px] font-semibold transition-opacity active:opacity-70" style="background: var(--color-primary); color: #FFFFFF;">
                <i data-lucide="calendar-check" class="h-4 w-4"></i>
                <span>立即预约</span>
            </button>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
