<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单</title>
    <style id="theme-vars">
/* ================================================
   Shared Parking Mini-Program — Brand Design Tokens
   Style: Fresh Technology (清新科技风)
   ================================================ */

:root {
  /* === Color System === */
  --color-primary: #0D9488;
  --color-primary-light: #14B8A6;
  --color-primary-dark: #0F766E;
  --color-primary-50: #F0FDFA;
  --color-primary-100: #CCFBF1;
  --color-primary-200: #99F6E4;
  --color-primary-700: #0F766E;
  --color-primary-900: #134E4A;

  --color-bg: #F8FAFB;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F1F5F9;

  --color-ink: #0F172A;
  --color-ink-secondary: #475569;
  --color-ink-tertiary: #94A3B8;
  --color-ink-quaternary: #CBD5E1;

  --color-rule: #E2E8F0;
  --color-rule-light: #F1F5F9;

  /* State colors — semantic only */
  --state-success: #10B981;
  --state-success-bg: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-bg: #FFFBEB;
  --state-error: #EF4444;
  --state-error-bg: #FEF2F2;
  --state-info: #3B82F6;
  --state-info-bg: #EFF6FF;

  /* Gradient */
  --gradient-primary: linear-gradient(135deg, #0D9488 0%, #06B6D4 100%);
  --gradient-header: linear-gradient(135deg, #134E4A 0%, #0D9488 60%, #06B6D4 100%);
  --gradient-card-hover: linear-gradient(135deg, #F0FDFA 0%, #ECFEFF 100%);

  /* === Typography === */
  --font-display: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-body: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;

  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.75;

  --tracking-tight: -0.01em;
  --tracking-normal: 0em;

  /* Font weight */
  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === Shape System === */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === Surface & Depth === */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 12px 40px rgba(0, 0, 0, 0.08);

  /* === Component Tokens === */
  --btn-height: 44px;
  --btn-radius: var(--radius-lg);
  --input-height: 44px;
  --input-radius: var(--radius-md);
  --card-radius: var(--radius-lg);
  --card-padding: var(--space-4);
  --card-border: 1px solid var(--color-rule-light);

  /* Tab bar */
  --tabbar-height: 52px;
  --tabbar-safe: env(safe-area-inset-bottom, 0px);
  --tabbar-bg: #FFFFFF;

  /* Status bar */
  --statusbar-height: 44px;

  /* Navigation bar */
  --navbar-height: 44px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- Status bar spacer -->
      <div class="h-[44px] bg-white"></div>

      <!-- WeChat navigation bar (tab page: no back button, keep balancing area) -->
      <header class="sticky top-0 z-30 border-b border-[var(--color-rule)] bg-white/95 backdrop-blur">
        <div class="flex h-[44px] items-center px-4">
          <div class="flex w-[88px] items-center justify-start"></div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color:var(--color-ink);">我的订单</div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border border-[var(--color-rule)] bg-white/90" style="color:var(--color-ink);" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4"></i>
            </button>
            <span class="h-4 w-px bg-[var(--color-rule)]" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Order filter tabs (sticky) -->
      <div class="sticky top-[44px] z-20 border-b border-[var(--color-rule-light)] bg-white">
        <div class="flex">
          <button class="relative flex-1 py-3 text-center text-[14px] font-semibold whitespace-nowrap" style="color:var(--color-primary);">
            全部
            <span class="absolute bottom-0 left-1/2 -translate-x-1/2 h-[2.5px] w-5 rounded-full" style="background:var(--color-primary);"></span>
          </button>
          <button class="relative flex-1 py-3 text-center text-[14px] font-normal whitespace-nowrap" style="color:var(--color-ink-tertiary);">
            进行中
          </button>
          <button class="relative flex-1 py-3 text-center text-[14px] font-normal whitespace-nowrap" style="color:var(--color-ink-tertiary);">
            已完成
          </button>
          <button class="relative flex-1 py-3 text-center text-[14px] font-normal whitespace-nowrap" style="color:var(--color-ink-tertiary);">
            已取消
          </button>
        </div>
      </div>

      <!-- Order list -->
      <div class="pb-[86px]">
        <div class="p-3">

          <!-- Order Card 1: 进行中 -->
          <div class="order-card mb-3 rounded-xl bg-white p-4" style="box-shadow:var(--shadow-sm); border:1px solid var(--color-rule-light);">
            <!-- Card header -->
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="text-[16px]">🏥</span>
                  <span class="truncate text-[15px] font-semibold" style="color:var(--color-ink);">市第一人民医院停车场</span>
                </div>
              </div>
              <span class="shrink-0 rounded-full px-2.5 py-0.5 text-[12px] font-medium text-white whitespace-nowrap" style="background:var(--color-primary);">进行中</span>
            </div>
            <!-- Card body -->
            <div class="mt-3 space-y-2">
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">预约时段</span>
                <span class="truncate" style="color:var(--color-ink);">07-03 10:00-12:00</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">车位类型</span>
                <span class="truncate" style="color:var(--color-ink);">普通车位</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">订单编号</span>
                <span class="truncate" style="color:var(--color-ink);">PK20260703001</span>
              </div>
            </div>
            <!-- Card footer -->
            <div class="mt-3 flex items-center justify-between border-t border-[var(--color-rule-light)] pt-3">
              <span class="text-[16px] font-bold" style="color:var(--color-primary);">¥15.00</span>
              <button class="btn-primary shrink-0 rounded-lg px-4 py-2 text-[13px] font-medium text-white" style="background:var(--color-primary); height:var(--btn-height);">查看详情</button>
            </div>
          </div>

          <!-- Order Card 2: 已完成 -->
          <div class="order-card mb-3 rounded-xl bg-white p-4" style="box-shadow:var(--shadow-sm); border:1px solid var(--color-rule-light);">
            <!-- Card header -->
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="text-[16px]">🏞️</span>
                  <span class="truncate text-[15px] font-semibold" style="color:var(--color-ink);">西湖景区北山街停车场</span>
                </div>
              </div>
              <span class="shrink-0 rounded-full px-2.5 py-0.5 text-[12px] font-medium text-white whitespace-nowrap" style="background:var(--state-success);">已完成</span>
            </div>
            <!-- Card body -->
            <div class="mt-3 space-y-2">
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">预约时段</span>
                <span class="truncate" style="color:var(--color-ink);">07-01 09:00-13:00</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">车位类型</span>
                <span class="truncate" style="color:var(--color-ink);">VIP车位</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">订单编号</span>
                <span class="truncate" style="color:var(--color-ink);">PK20260701003</span>
              </div>
            </div>
            <!-- Card footer -->
            <div class="mt-3 flex items-center justify-between border-t border-[var(--color-rule-light)] pt-3">
              <span class="text-[16px] font-bold" style="color:var(--color-ink);">¥25.00</span>
              <div class="flex items-center gap-2">
                <button class="btn-secondary shrink-0 rounded-lg px-4 py-2 text-[13px] font-medium" style="border:1px solid var(--color-rule); color:var(--color-ink-secondary); height:var(--btn-height);">再次预约</button>
                <button class="btn-primary shrink-0 rounded-lg px-4 py-2 text-[13px] font-medium text-white" style="background:var(--color-primary); height:var(--btn-height);">开发票</button>
              </div>
            </div>
          </div>

          <!-- Order Card 3: 已取消 -->
          <div class="order-card mb-3 rounded-xl bg-white p-4" style="box-shadow:var(--shadow-sm); border:1px solid var(--color-rule-light);">
            <!-- Card header -->
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="text-[16px]">✈️</span>
                  <span class="truncate text-[15px] font-semibold" style="color:var(--color-ink);">萧山国际机场P1停车场</span>
                </div>
              </div>
              <span class="shrink-0 rounded-full px-2.5 py-0.5 text-[12px] font-medium text-white whitespace-nowrap" style="background:var(--state-error);">已取消</span>
            </div>
            <!-- Card body -->
            <div class="mt-3 space-y-2">
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">预约时段</span>
                <span class="truncate" style="color:var(--color-ink);">06-28 14:00-16:00</span>
              </div>
              <div class="flex items-baseline text-[13px]" style="color:var(--color-ink-secondary);">
                <span class="shrink-0 w-[60px]">取消原因</span>
                <span class="truncate" style="color:var(--color-ink);">用户主动取消</span>
              </div>
            </div>
            <!-- Card footer -->
            <div class="mt-3 flex items-center justify-between border-t border-[var(--color-rule-light)] pt-3">
              <span class="text-[16px] font-bold line-through" style="color:var(--color-ink-tertiary);">¥15.00</span>
              <button class="btn-secondary shrink-0 rounded-lg px-4 py-2 text-[13px] font-medium" style="border:1px solid var(--color-rule); color:var(--color-ink-secondary); height:var(--btn-height);">再次预约</button>
            </div>
          </div>

        </div>
      </div>

      <!-- Tab bar -->
      <div class="fixed bottom-0 inset-x-0 z-30 border-t bg-white" style="border-color:var(--color-rule);">
        <div class="flex h-[50px] items-center justify-around">
          <!-- 首页 -->
          <a data-dom-id="tab-home" href="index.html" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color:var(--color-ink-tertiary);">
            <svg class="h-[22px] w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="text-[10px]">首页</span>
          </a>
          <!-- 订单 (active) -->
          <a data-dom-id="tab-orders" href="orders.html" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color:var(--color-primary);">
            <svg class="h-[22px] w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span class="text-[10px] font-medium">订单</span>
          </a>
          <!-- 我的 -->
          <a data-dom-id="tab-profile" href="profile.html" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color:var(--color-ink-tertiary);">
            <svg class="h-[22px] w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="text-[10px]">我的</span>
          </a>
        </div>
        <!-- Safe area bottom -->
        <div class="h-[env(safe-area-inset-bottom,34px)]"></div>
      </div>
    </main>
    <style>
        body {
          font-family: var(--font-body);
          background: var(--color-bg);
          color: var(--color-ink);
        }
        .order-card:active {
          transform: scale(0.985);
          transition: transform 0.1s ease;
        }
        .btn-primary:active {
          opacity: 0.85;
        }
        .btn-secondary:active {
          background: var(--color-bg-sunken);
        }
        @media (prefers-reduced-motion: reduce) {
          .order-card:active { transform: none; }
        }
      </style>
      <script>lucide.createIcons();</script>
</body>
</html>
