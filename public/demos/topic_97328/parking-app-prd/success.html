<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>预约成功</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
        .success-icon {
            animation: success-pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="antialiased">
    <main class="min-h-screen flex flex-col" style="background: var(--color-bg);">

        <div class="h-11 shrink-0" style="background: var(--color-bg-elevated);"></div>

        <header class="sticky top-0 z-30 shrink-0 navbar-light">
            <div class="flex h-11 items-center px-4">
                <div class="flex w-[88px] items-center justify-start">
                    <button data-action="back" class="back-btn" aria-label="返回">
                        <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-ink);"></i>
                    </button>
                </div>
                <div class="min-w-0 flex-1 text-center" style="font-size: var(--text-lg); font-weight: var(--font-semibold); color: var(--color-ink); letter-spacing: var(--tracking-tight);">预约成功</div>
                <div class="wx-menu">
                    <button aria-label="更多"><i data-lucide="more-horizontal" class="h-4 w-4"></i></button>
                    <span class="divider"></span>
                    <button aria-label="关闭"><i data-lucide="x" class="h-4 w-4"></i></button>
                </div>
            </div>
        </header>

        <div class="flex flex-1 flex-col items-center justify-center px-5 py-10" style="animation: fadeIn 0.5s ease-out;">

            <div class="success-icon mb-5 flex h-20 w-20 items-center justify-center rounded-full" style="background: var(--state-success-bg);">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--state-success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>

            <h1 class="mb-2 text-center" style="font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-ink); line-height: var(--leading-tight);">预约成功</h1>
            <p class="mb-8 text-center" style="font-size: var(--text-sm); color: var(--color-ink-tertiary); line-height: var(--leading-normal);">车位已锁定，请按时到达</p>

            <div class="w-full rounded-xl p-4" style="max-width: 320px; background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); animation: scaleIn 0.4s ease-out 0.2s both;">

                <div class="mb-4 flex items-center gap-2">
                    <span class="text-base leading-none">🏥</span>
                    <span class="truncate" style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">市第一人民医院停车场</span>
                </div>

                <div class="mb-3" style="height: 1px; background: var(--color-rule-light);"></div>

                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">预约时段</span>
                        <span class="truncate" style="font-size: var(--text-sm); color: var(--color-ink-secondary); font-weight: var(--font-medium);">今天 10:00 - 12:00</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">车位类型</span>
                        <span class="truncate" style="font-size: var(--text-sm); color: var(--color-ink-secondary); font-weight: var(--font-medium);">普通车位</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">订单编号</span>
                        <span class="truncate" style="font-size: var(--text-sm); color: var(--color-ink-secondary); font-weight: var(--font-medium);">PK20260703001</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">支付金额</span>
                        <span class="truncate" style="font-size: var(--text-base); color: var(--color-primary); font-weight: var(--font-bold);">¥15.00</span>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex w-full items-center justify-center gap-4" style="max-width: 320px; animation: fadeSlideUp 0.4s ease-out 0.4s both;">
                <button class="btn-secondary flex-1" data-nav="home">返回首页</button>
                <button class="btn-primary flex-1" data-nav="orders">查看订单</button>
            </div>
        </div>
    </main>
    <script src="assets/js/common.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
