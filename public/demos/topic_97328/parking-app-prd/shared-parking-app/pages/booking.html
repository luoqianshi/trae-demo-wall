<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车位预约</title>
    <style id="theme-vars">
/* ================================================
   Shared Parking Mini-Program — Brand Design Tokens
   Style: Fresh Technology (清新科技风)
   ================================================ */

:root {
  /* === Color System === */
  --color-primary: #0D9488;
  --color-primary-light: #14B8A6;
  --color-primary-dark: #0F766E;
  --color-primary-50: #F0FDFA;
  --color-primary-100: #CCFBF1;
  --color-primary-200: #99F6E4;
  --color-primary-700: #0F766E;
  --color-primary-900: #134E4A;

  --color-bg: #F8FAFB;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F1F5F9;

  --color-ink: #0F172A;
  --color-ink-secondary: #475569;
  --color-ink-tertiary: #94A3B8;
  --color-ink-quaternary: #CBD5E1;

  --color-rule: #E2E8F0;
  --color-rule-light: #F1F5F9;

  /* State colors — semantic only */
  --state-success: #10B981;
  --state-success-bg: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-bg: #FFFBEB;
  --state-error: #EF4444;
  --state-error-bg: #FEF2F2;
  --state-info: #3B82F6;
  --state-info-bg: #EFF6FF;

  /* Gradient */
  --gradient-primary: linear-gradient(135deg, #0D9488 0%, #06B6D4 100%);
  --gradient-header: linear-gradient(135deg, #134E4A 0%, #0D9488 60%, #06B6D4 100%);
  --gradient-card-hover: linear-gradient(135deg, #F0FDFA 0%, #ECFEFF 100%);

  /* === Typography === */
  --font-display: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-body: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;

  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.75;

  --tracking-tight: -0.01em;
  --tracking-normal: 0em;

  /* Font weight */
  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === Shape System === */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === Surface & Depth === */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 12px 40px rgba(0, 0, 0, 0.08);

  /* === Component Tokens === */
  --btn-height: 44px;
  --btn-radius: var(--radius-lg);
  --input-height: 44px;
  --input-radius: var(--radius-md);
  --card-radius: var(--radius-lg);
  --card-padding: var(--space-4);
  --card-border: 1px solid var(--color-rule-light);

  /* Tab bar */
  --tabbar-height: 52px;
  --tabbar-safe: env(safe-area-inset-bottom, 0px);
  --tabbar-bg: #FFFFFF;

  /* Status bar */
  --statusbar-height: 44px;

  /* Navigation bar */
  --navbar-height: 44px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen" style="background: var(--color-bg); padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));">

      <!-- Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- WeChat Mini Program Navigation Bar -->
      <header class="sticky top-0 z-30 border-b" style="border-color: var(--color-rule); background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);">
        <div class="flex items-center px-4" style="height: 44px;">
          <div class="flex items-center justify-start" style="width: 88px;">
            <button data-dom-id="btn-back" class="inline-flex items-center justify-center rounded-lg border" style="width: 32px; height: 32px; border-color: var(--color-rule); background: var(--color-bg-elevated);" aria-label="返回">
              <i data-lucide="chevron-left" style="width: 16px; height: 16px; color: var(--color-ink);"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center truncate" style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--color-ink);">预约车位</div>
          <div class="flex items-center justify-center rounded-full border w-[88px] h-8" style="border-color: var(--color-rule); background: rgba(255,255,255,0.9);" aria-label="小程序菜单">
            <button class="flex flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" style="width: 16px; height: 16px; color: var(--color-ink);"></i>
            </button>
            <span class="w-px" style="height: 16px; background: var(--color-rule);" aria-hidden="true"></span>
            <button class="flex flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" style="width: 16px; height: 16px; color: var(--color-ink);"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Scrollable Content -->
      <div class="px-3 pt-3 flex flex-col gap-3">

        <!-- 1. Parking Lot Info Card -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm);">
          <div class="flex items-start gap-3">
            <div class="flex items-center justify-center shrink-0 rounded-lg" style="width: 44px; height: 44px; background: var(--color-primary-50);">
              <span style="font-size: 22px; line-height: 1;">🏥</span>
            </div>
            <div class="min-w-0 flex-1">
              <h2 class="truncate" style="font-size: var(--text-lg); font-weight: var(--font-semibold); color: var(--color-ink); line-height: var(--leading-tight);">市第一人民医院停车场</h2>
              <div class="flex items-center gap-1 mt-1">
                <i data-lucide="map-pin" style="width: 12px; height: 12px; color: var(--color-ink-tertiary);"></i>
                <span class="truncate" style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">人民路128号市第一人民医院内</span>
              </div>
            </div>
          </div>
        </section>

        <!-- 2. Date Selection -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-3">
            <div style="width: 3px; height: 16px; border-radius: 2px; background: var(--color-primary);"></div>
            <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">选择日期</h3>
          </div>
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <!-- 今天 (selected) -->
            <button class="shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border-2 transition-colors duration-150" style="min-width: 60px; border-color: var(--color-primary); background: var(--color-primary-50); color: var(--color-primary);" aria-pressed="true">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">今天</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">3</span>
              <span style="font-size: var(--text-xs); color: var(--color-primary); opacity: 0.8;">7月</span>
            </button>
            <!-- 明天 -->
            <button class="shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border transition-colors duration-150" style="min-width: 60px; border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary);" aria-pressed="false">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">明天</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">4</span>
              <span style="font-size: var(--text-xs); opacity: 0.7;">7月</span>
            </button>
            <!-- 周三 -->
            <button class="shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border transition-colors duration-150" style="min-width: 60px; border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary);" aria-pressed="false">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">周三</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">5</span>
              <span style="font-size: var(--text-xs); opacity: 0.7;">7月</span>
            </button>
            <!-- 周四 -->
            <button class="shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border transition-colors duration-150" style="min-width: 60px; border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary);" aria-pressed="false">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">周四</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">6</span>
              <span style="font-size: var(--text-xs); opacity: 0.7;">7月</span>
            </button>
            <!-- 周五 -->
            <button class="shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border transition-colors duration-150" style="min-width: 60px; border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary);" aria-pressed="false">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">周五</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">7</span>
              <span style="font-size: var(--text-xs); opacity: 0.7;">7月</span>
            </button>
          </div>
        </section>

        <!-- 3. Entry Time -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-3">
            <div style="width: 3px; height: 16px; border-radius: 2px; background: var(--color-primary);"></div>
            <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">入场时间</h3>
          </div>
          <div class="grid grid-cols-4 gap-2">
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">08:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">09:00</button>
            <button class="flex items-center justify-center rounded-lg border-2 py-2.5 transition-colors duration-150" style="border-color: var(--color-primary); background: var(--color-primary-50); color: var(--color-primary); font-size: var(--text-base); font-weight: var(--font-semibold);" aria-pressed="true">10:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">11:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">12:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">13:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">14:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">15:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">16:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">17:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">18:00</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">19:00</button>
          </div>
        </section>

        <!-- 4. Parking Duration -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-3">
            <div style="width: 3px; height: 16px; border-radius: 2px; background: var(--color-primary);"></div>
            <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">停车时长</h3>
          </div>
          <div class="grid grid-cols-4 gap-2">
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">1h</button>
            <button class="flex items-center justify-center rounded-lg border-2 py-2.5 transition-colors duration-150" style="border-color: var(--color-primary); background: var(--color-primary-50); color: var(--color-primary); font-size: var(--text-base); font-weight: var(--font-semibold);" aria-pressed="true">2h</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">3h</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">4h</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">5h</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">6h</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">8h</button>
            <button class="flex items-center justify-center rounded-lg border py-2.5 transition-colors duration-150" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);">12h</button>
          </div>
        </section>

        <!-- 5. Fee Summary -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-3">
            <div style="width: 3px; height: 16px; border-radius: 2px; background: var(--color-primary);"></div>
            <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">费用明细</h3>
          </div>
          <div class="flex flex-col gap-0">
            <!-- Row: 停车场名 -->
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px solid var(--color-rule-light);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">停车场名</span>
              <span class="truncate ml-4 text-right" style="max-width: 200px; font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">市第一人民医院停车场</span>
            </div>
            <!-- Row: 入场时间 -->
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px solid var(--color-rule-light);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">入场时间</span>
              <span style="font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">今天 10:00</span>
            </div>
            <!-- Row: 停车时长 -->
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px solid var(--color-rule-light);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">停车时长</span>
              <span style="font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">2小时</span>
            </div>
            <!-- Row: 预计离场 -->
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px solid var(--color-rule-light);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">预计离场</span>
              <span style="font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">12:00</span>
            </div>
            <!-- Row: 车位锁定费 -->
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px dashed var(--color-rule);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">车位锁定费</span>
              <span style="font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">¥5.00</span>
            </div>
            <!-- Total -->
            <div class="flex items-center justify-between pt-3">
              <span style="font-size: var(--text-base); color: var(--color-ink); font-weight: var(--font-medium);">预估总计</span>
              <span style="font-size: var(--text-2xl); color: var(--color-primary); font-weight: var(--font-bold);">¥15</span>
            </div>
          </div>
        </section>

      </div>

      <!-- 6. Fixed Bottom Action Bar -->
      <div class="fixed bottom-0 left-0 right-0 z-30 flex items-center gap-3 px-4 border-t" style="height: 60px; background: var(--color-bg-elevated); border-color: var(--color-rule); padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div class="min-w-0 flex-1">
          <span style="font-size: var(--text-xs); color: var(--color-ink-tertiary);">预估费用</span>
          <div class="flex items-baseline gap-0.5">
            <span style="font-size: var(--text-xl); color: var(--color-primary); font-weight: var(--font-bold);">¥15</span>
          </div>
        </div>
        <button data-dom-id="btn-confirm-pay" class="shrink-0 flex items-center justify-center rounded-xl text-white transition-opacity duration-150 active:opacity-80" style="height: 44px; padding: 0 24px; background: var(--color-primary); font-size: var(--text-base); font-weight: var(--font-semibold); color: #FFFFFF; border-radius: var(--radius-lg);">
          确认预约并支付
        </button>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
