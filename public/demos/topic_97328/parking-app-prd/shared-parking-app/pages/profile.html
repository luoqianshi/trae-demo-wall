<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <style id="theme-vars">
/* ================================================
   Shared Parking Mini-Program — Brand Design Tokens
   Style: Fresh Technology (清新科技风)
   ================================================ */

:root {
  /* === Color System === */
  --color-primary: #0D9488;
  --color-primary-light: #14B8A6;
  --color-primary-dark: #0F766E;
  --color-primary-50: #F0FDFA;
  --color-primary-100: #CCFBF1;
  --color-primary-200: #99F6E4;
  --color-primary-700: #0F766E;
  --color-primary-900: #134E4A;

  --color-bg: #F8FAFB;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F1F5F9;

  --color-ink: #0F172A;
  --color-ink-secondary: #475569;
  --color-ink-tertiary: #94A3B8;
  --color-ink-quaternary: #CBD5E1;

  --color-rule: #E2E8F0;
  --color-rule-light: #F1F5F9;

  /* State colors — semantic only */
  --state-success: #10B981;
  --state-success-bg: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-bg: #FFFBEB;
  --state-error: #EF4444;
  --state-error-bg: #FEF2F2;
  --state-info: #3B82F6;
  --state-info-bg: #EFF6FF;

  /* Gradient */
  --gradient-primary: linear-gradient(135deg, #0D9488 0%, #06B6D4 100%);
  --gradient-header: linear-gradient(135deg, #134E4A 0%, #0D9488 60%, #06B6D4 100%);
  --gradient-card-hover: linear-gradient(135deg, #F0FDFA 0%, #ECFEFF 100%);

  /* === Typography === */
  --font-display: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-body: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;

  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.75;

  --tracking-tight: -0.01em;
  --tracking-normal: 0em;

  /* Font weight */
  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === Shape System === */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === Surface & Depth === */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 12px 40px rgba(0, 0, 0, 0.08);

  /* === Component Tokens === */
  --btn-height: 44px;
  --btn-radius: var(--radius-lg);
  --input-height: 44px;
  --input-radius: var(--radius-md);
  --card-radius: var(--radius-lg);
  --card-padding: var(--space-4);
  --card-border: 1px solid var(--color-rule-light);

  /* Tab bar */
  --tabbar-height: 52px;
  --tabbar-safe: env(safe-area-inset-bottom, 0px);
  --tabbar-bg: #FFFFFF;

  /* Status bar */
  --statusbar-height: 44px;

  /* Navigation bar */
  --navbar-height: 44px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="pb-[calc(var(--tabbar-height)+var(--tabbar-safe)+env(safe-area-inset-bottom,34px))]">
        <!-- Status bar spacer -->
        <div style="height: var(--statusbar-height);" class="bg-transparent"></div>

        <!-- Mini program nav bar (root tab page — no back button, balancing area) -->
        <header class="sticky top-0 z-30" style="height: var(--navbar-height);">
            <div class="flex items-center justify-between px-4" style="height: var(--navbar-height);">
                <div style="width: 88px;"></div>
                <div class="min-w-0 flex-1 text-center" style="font-size: var(--text-lg); font-weight: var(--font-semibold); letter-spacing: var(--tracking-tight);">个人中心</div>
                <div class="flex items-center justify-center rounded-full border w-[88px] h-8" style="border-color: var(--color-rule); background: rgba(255,255,255,0.9);" aria-label="小程序菜单">
                    <button class="flex flex-1 items-center justify-center" aria-label="更多">
                        <i data-lucide="more-horizontal" style="width: 16px; height: 16px;"></i>
                    </button>
                    <span class="w-px" style="height: 16px; background: var(--color-rule);" aria-hidden="true"></span>
                    <button class="flex flex-1 items-center justify-center" aria-label="关闭">
                        <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Profile header with gradient -->
        <section style="background: var(--gradient-header); border-radius: 0 0 24px 24px; padding: var(--space-6) var(--space-4) var(--space-10);">
            <div class="flex flex-col items-center">
                <!-- Avatar -->
                <div class="flex items-center justify-center rounded-full" style="width: 56px; height: 56px; background: rgba(255,255,255,0.2); font-size: 28px; margin-bottom: var(--space-3);">&#x1F697;</div>
                <!-- User name -->
                <div style="font-size: var(--text-xl); font-weight: var(--font-bold); color: #FFFFFF; margin-bottom: var(--space-1);">张三</div>
                <!-- Phone -->
                <div style="font-size: var(--text-sm); color: rgba(255,255,255,0.7);">138****8888</div>
            </div>
        </section>

        <!-- Floating stats bar -->
        <div class="mx-4" style="margin-top: -20px; position: relative; z-index: 10;">
            <div class="rounded-lg bg-white" style="padding: var(--space-5) var(--space-4); box-shadow: var(--shadow-sm); border-radius: 12px;">
                <div class="flex items-center justify-around">
                    <!-- Stat 1 -->
                    <div class="flex flex-col items-center">
                        <span style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-primary);">12</span>
                        <span style="font-size: var(--text-xs); color: var(--color-ink-tertiary); margin-top: 2px;">预约次数</span>
                    </div>
                    <!-- Stat 2 -->
                    <div class="flex flex-col items-center">
                        <span style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-primary);">2</span>
                        <span style="font-size: var(--text-xs); color: var(--color-ink-tertiary); margin-top: 2px;">我的车辆</span>
                    </div>
                    <!-- Stat 3 -->
                    <div class="flex flex-col items-center">
                        <span style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-primary);">3</span>
                        <span style="font-size: var(--text-xs); color: var(--color-ink-tertiary); margin-top: 2px;">常用停车</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu groups -->
        <div class="mx-4 mt-3 flex flex-col gap-3">

            <!-- Group 1 -->
            <div class="rounded-lg bg-white" style="border-radius: 12px; box-shadow: var(--shadow-xs);">
                <!-- 我的车辆 -->
                <div class="flex items-center" style="padding: var(--space-4);">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-info-bg); flex-shrink: 0;">&#x1F697;</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">我的车辆</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
                <div style="height: 1px; background: var(--color-rule-light); margin-left: var(--space-4);"></div>
                <!-- 常用停车场 -->
                <div class="flex items-center" style="padding: var(--space-4);">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-success-bg); flex-shrink: 0;">&#x2B50;</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">常用停车场</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
                <div style="height: 1px; background: var(--color-rule-light); margin-left: var(--space-4);"></div>
                <!-- 电子发票 -->
                <div class="flex items-center" style="padding: var(--space-4);">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-warning-bg); flex-shrink: 0;">&#x1F9FE;</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">电子发票</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
            </div>

            <!-- Group 2 -->
            <div class="rounded-lg bg-white" style="border-radius: 12px; box-shadow: var(--shadow-xs);">
                <!-- 无感支付设置 -->
                <div class="flex items-center" style="padding: var(--space-4);">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: rgba(139,92,246,0.08); flex-shrink: 0;">&#x1F4B3;</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">无感支付设置</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
                <div style="height: 1px; background: var(--color-rule-light); margin-left: var(--space-4);"></div>
                <!-- 我的优惠券 -->
                <div class="flex items-center" style="padding: var(--space-4);">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-error-bg); flex-shrink: 0;">&#x1F3AB;</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">我的优惠券</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
            </div>

            <!-- Group 3 -->
            <div class="rounded-lg bg-white" style="border-radius: 12px; box-shadow: var(--shadow-xs);">
                <!-- 帮助与反馈 -->
                <div class="flex items-center" style="padding: var(--space-4);">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-info-bg); flex-shrink: 0;">&#x1F4AC;</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">帮助与反馈</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
                <div style="height: 1px; background: var(--color-rule-light); margin-left: var(--space-4);"></div>
                <!-- 设置 -->
                <div class="flex items-center" style="padding: var(--space-4);">
                    <div class="flex items-center justify-center rounded-lg" style="width: 32px; height: 32px; background: var(--state-success-bg); flex-shrink: 0;">&#x2699;&#xFE0F;</div>
                    <span class="flex-1 min-w-0 truncate ml-3" style="font-size: var(--text-base); color: var(--color-ink);">设置</span>
                    <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--color-ink-quaternary); flex-shrink: 0;"></i>
                </div>
            </div>

        </div>

        <!-- Bottom safe spacer for menu area -->
        <div style="height: var(--space-4);"></div>

        <!-- Tab Bar -->
        <nav class="fixed bottom-0 inset-x-0 z-40 border-t flex items-center justify-around" style="height: var(--tabbar-height); background: var(--tabbar-bg); border-color: var(--color-rule);">
            <!-- 首页 -->
            <a data-dom-id="tab-home" href="#" class="flex flex-col items-center justify-center flex-1 min-w-0" style="text-decoration: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-ink-tertiary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span style="font-size: 10px; color: var(--color-ink-tertiary); margin-top: 2px;">首页</span>
            </a>
            <!-- 订单 -->
            <a data-dom-id="tab-orders" href="#" class="flex flex-col items-center justify-center flex-1 min-w-0" style="text-decoration: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-ink-tertiary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span style="font-size: 10px; color: var(--color-ink-tertiary); margin-top: 2px;">订单</span>
            </a>
            <!-- 我的 (active) -->
            <a data-dom-id="tab-profile" href="#" class="flex flex-col items-center justify-center flex-1 min-w-0" style="text-decoration: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span style="font-size: 10px; color: var(--color-primary); margin-top: 2px; font-weight: var(--font-medium);">我的</span>
            </a>
        </nav>
        <!-- Safe area bottom -->
        <div style="height: var(--tabbar-safe);"></div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
