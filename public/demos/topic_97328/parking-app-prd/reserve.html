<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>车位预约</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
</head>
<body class="antialiased">
    <main class="min-h-screen" style="background: var(--color-bg); padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));">

      <div class="h-[44px]"></div>

      <header class="sticky top-0 z-30 navbar-light">
        <div class="flex items-center px-4" style="height: 44px;">
          <div class="flex items-center justify-start" style="width: 88px;">
            <button data-action="back" class="back-btn" aria-label="返回">
              <i data-lucide="chevron-left" style="width: 16px; height: 16px; color: var(--color-ink);"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center truncate" style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--color-ink);">预约车位</div>
          <div class="wx-menu">
            <button aria-label="更多"><i data-lucide="more-horizontal" style="width: 16px; height: 16px; color: var(--color-ink);"></i></button>
            <span class="divider"></span>
            <button aria-label="关闭"><i data-lucide="x" style="width: 16px; height: 16px; color: var(--color-ink);"></i></button>
          </div>
        </div>
      </header>

      <div class="px-3 pt-3 flex flex-col gap-3">

        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); animation: fadeSlideUp 0.4s ease-out 0.05s both;">
          <div class="flex items-start gap-3">
            <div class="flex items-center justify-center shrink-0 rounded-lg" style="width: 44px; height: 44px; background: var(--color-primary-50);">
              <span style="font-size: 22px; line-height: 1;">🏥</span>
            </div>
            <div class="min-w-0 flex-1">
              <h2 class="truncate" style="font-size: var(--text-lg); font-weight: var(--font-semibold); color: var(--color-ink); line-height: var(--leading-tight);">市第一人民医院停车场</h2>
              <div class="flex items-center gap-1 mt-1">
                <i data-lucide="map-pin" style="width: 12px; height: 12px; color: var(--color-ink-tertiary);"></i>
                <span class="truncate" style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">人民路128号市第一人民医院内</span>
              </div>
            </div>
          </div>
        </section>

        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); animation: fadeSlideUp 0.4s ease-out 0.1s both;">
          <div class="flex items-center gap-2 mb-3">
            <div style="width: 3px; height: 16px; border-radius: 2px; background: var(--color-primary);"></div>
            <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">选择日期</h3>
          </div>
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1 select-btn-group" id="date-selector">
            <button class="select-btn selected shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border-2" style="min-width: 60px; border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary);" data-label="今天" data-day="3" data-month="7月">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">今天</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">3</span>
              <span style="font-size: var(--text-xs); opacity: 0.7;">7月</span>
            </button>
            <button class="select-btn shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border" style="min-width: 60px; border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary);" data-label="明天" data-day="4" data-month="7月">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">明天</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">4</span>
              <span style="font-size: var(--text-xs); opacity: 0.7;">7月</span>
            </button>
            <button class="select-btn shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border" style="min-width: 60px; border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary);" data-label="周三" data-day="5" data-month="7月">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">周三</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">5</span>
              <span style="font-size: var(--text-xs); opacity: 0.7;">7月</span>
            </button>
            <button class="select-btn shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border" style="min-width: 60px; border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary);" data-label="周四" data-day="6" data-month="7月">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">周四</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">6</span>
              <span style="font-size: var(--text-xs); opacity: 0.7;">7月</span>
            </button>
            <button class="select-btn shrink-0 flex flex-col items-center rounded-lg px-3 py-2 border" style="min-width: 60px; border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary);" data-label="周五" data-day="7" data-month="7月">
              <span style="font-size: var(--text-xs); font-weight: var(--font-medium);">周五</span>
              <span style="font-size: var(--text-lg); font-weight: var(--font-bold); line-height: 1.25;">7</span>
              <span style="font-size: var(--text-xs); opacity: 0.7;">7月</span>
            </button>
          </div>
        </section>

        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); animation: fadeSlideUp 0.4s ease-out 0.15s both;">
          <div class="flex items-center gap-2 mb-3">
            <div style="width: 3px; height: 16px; border-radius: 2px; background: var(--color-primary);"></div>
            <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">入场时间</h3>
          </div>
          <div class="grid grid-cols-4 gap-2 select-btn-group" id="time-selector">
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="08:00">08:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="09:00">09:00</button>
            <button class="select-btn selected flex items-center justify-center rounded-lg border-2 py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="10:00">10:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="11:00">11:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="12:00">12:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="13:00">13:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="14:00">14:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="15:00">15:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="16:00">16:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="17:00">17:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="18:00">18:00</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-time="19:00">19:00</button>
          </div>
        </section>

        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); animation: fadeSlideUp 0.4s ease-out 0.2s both;">
          <div class="flex items-center gap-2 mb-3">
            <div style="width: 3px; height: 16px; border-radius: 2px; background: var(--color-primary);"></div>
            <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">停车时长</h3>
          </div>
          <div class="grid grid-cols-4 gap-2 select-btn-group" id="duration-selector" data-on-select="updateFee">
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-duration="1">1h</button>
            <button class="select-btn selected flex items-center justify-center rounded-lg border-2 py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-duration="2">2h</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-duration="3">3h</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-duration="4">4h</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-duration="5">5h</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-duration="6">6h</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-duration="8">8h</button>
            <button class="select-btn flex items-center justify-center rounded-lg border py-2.5" style="border-color: var(--color-rule); background: var(--color-bg-elevated); color: var(--color-ink-secondary); font-size: var(--text-base); font-weight: var(--font-medium);" data-duration="12">12h</button>
          </div>
        </section>

        <section class="rounded-xl p-4" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); animation: fadeSlideUp 0.4s ease-out 0.25s both;">
          <div class="flex items-center gap-2 mb-3">
            <div style="width: 3px; height: 16px; border-radius: 2px; background: var(--color-primary);"></div>
            <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-ink);">费用明细</h3>
          </div>
          <div class="flex flex-col gap-0">
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px solid var(--color-rule-light);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">停车场名</span>
              <span class="truncate ml-4 text-right" style="max-width: 200px; font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">市第一人民医院停车场</span>
            </div>
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px solid var(--color-rule-light);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">入场时间</span>
              <span id="fee-entry-time" style="font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">今天 10:00</span>
            </div>
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px solid var(--color-rule-light);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">停车时长</span>
              <span id="fee-duration" style="font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">2小时</span>
            </div>
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px solid var(--color-rule-light);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">预计离场</span>
              <span id="fee-exit-time" style="font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">12:00</span>
            </div>
            <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px dashed var(--color-rule);">
              <span style="font-size: var(--text-sm); color: var(--color-ink-tertiary);">车位锁定费</span>
              <span style="font-size: var(--text-sm); color: var(--color-ink); font-weight: var(--font-medium);">¥5.00</span>
            </div>
            <div class="flex items-center justify-between pt-3">
              <span style="font-size: var(--text-base); color: var(--color-ink); font-weight: var(--font-medium);">预估总计</span>
              <span id="fee-total" style="font-size: var(--text-2xl); color: var(--color-primary); font-weight: var(--font-bold);">¥15</span>
            </div>
          </div>
        </section>

      </div>

      <div class="fixed bottom-0 left-0 right-0 z-30 flex items-center gap-3 px-4 border-t" style="height: 60px; background: var(--color-bg-elevated); border-color: var(--color-rule); padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div class="min-w-0 flex-1">
          <span style="font-size: var(--text-xs); color: var(--color-ink-tertiary);">预估费用</span>
          <div class="flex items-baseline gap-0.5">
            <span id="bottom-total" style="font-size: var(--text-xl); color: var(--color-primary); font-weight: var(--font-bold);">¥15</span>
          </div>
        </div>
        <button id="btn-confirm" class="shrink-0 btn-primary" style="padding: 0 24px; height: 44px;" data-nav="success">
          确认预约并支付
        </button>
      </div>

    </main>
    <script src="assets/js/common.js"></script>
    <script>
      lucide.createIcons();

      let selectedDate = { label: '今天', day: '3', month: '7月' };
      let selectedTime = '10:00';
      let selectedDuration = 2;
      const pricePerHour = 5;

      function calculateExitTime(timeStr, hours) {
        const [h, m] = timeStr.split(':').map(Number);
        let newH = h + hours;
        let newM = m;
        if (newH >= 24) newH -= 24;
        return `${newH.toString().padStart(2, '0')}:${newM.toString().padStart(2, '0')}`;
      }

      function updateFee() {
        const total = pricePerHour * selectedDuration + 5;
        document.getElementById('fee-total').textContent = '¥' + total;
        document.getElementById('bottom-total').textContent = '¥' + total;
        document.getElementById('fee-duration').textContent = selectedDuration + '小时';
        document.getElementById('fee-entry-time').textContent = selectedDate.label + ' ' + selectedTime;
        document.getElementById('fee-exit-time').textContent = calculateExitTime(selectedTime, selectedDuration);
      }

      document.getElementById('date-selector').addEventListener('click', (e) => {
        const btn = e.target.closest('.select-btn');
        if (btn) {
          selectedDate = {
            label: btn.dataset.label,
            day: btn.dataset.day,
            month: btn.dataset.month
          };
          updateFee();
        }
      });

      document.getElementById('time-selector').addEventListener('click', (e) => {
        const btn = e.target.closest('.select-btn');
        if (btn) {
          selectedTime = btn.dataset.time;
          updateFee();
        }
      });

      document.getElementById('duration-selector').addEventListener('click', (e) => {
        const btn = e.target.closest('.select-btn');
        if (btn) {
          selectedDuration = parseInt(btn.dataset.duration);
          updateFee();
        }
      });
    </script>
</body>
</html>
