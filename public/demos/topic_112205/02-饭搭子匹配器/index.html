<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>饭搭子匹配器</title>
<link rel="stylesheet" href="css/common.css">
<style>
.index-page{max-width:420px;margin:0 auto;background:var(--bg);min-height:100vh;border-left:1px solid var(--rule);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.index-icon{font-size:5rem;margin-bottom:1rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.index-title{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.5rem}
.index-sub{color:var(--muted);font-size:1rem;margin-bottom:2rem}
.index-desc{color:var(--muted);font-size:0.85rem;margin-bottom:3rem;line-height:1.6}
</style>
</head>
<body>
<div class="index-page">
  <div class="index-icon">🍜</div>
  <div class="index-title">饭搭子匹配器</div>
  <div class="index-sub">找到你的专属饭搭子</div>
  <div class="index-desc">根据口味偏好、用餐时间和预算，帮独居打工人在附近匹配临时饭搭子，约饭不尴尬。</div>
  <button class="btn-primary" onclick="handleStart()">立即开始</button>
</div>
<script src="js/utils.js"></script>
<script>
function handleStart(){
  const token=localStorage.getItem('fandazi_token');
  if(token){
    window.location.href='pages/discover.html';
  }else{
    window.location.href='pages/login.html';
  }
}
</script>
</body>
</html>
