<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>饭搭子匹配器 - 匹配</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.page-content{min-height:calc(100vh - 80px);padding-bottom:80px}
.chat-list{padding:0 1rem}
.chat-item{display:flex;align-items:center;gap:0.8rem;padding:1rem 0;border-bottom:1px solid var(--rule);cursor:pointer;transition:background 0.2s}
.chat-item:hover{background:var(--card)}
.chat-item .chat-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:transform 0.2s}
.chat-item .chat-avatar:hover{transform:scale(1.1)}
.chat-item .chat-info{flex:1}
.chat-item .chat-name{font-weight:600;cursor:pointer}
.chat-item .chat-name:hover{color:var(--accent)}
.chat-item .chat-preview{font-size:0.8rem;color:var(--muted);margin-top:0.2rem;cursor:pointer}
.chat-item .chat-time{font-size:0.7rem;color:var(--muted)}
.chat-item .unread{width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--bg);font-size:0.65rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.chat-item .chat-delete{width:36px;height:36px;border-radius:50%;background:rgba(251,113,133,0.1);color:var(--like);display:flex;align-items:center;justify-content:center;font-size:0.9rem;opacity:0;transition:opacity 0.2s}
.chat-item:hover .chat-delete{opacity:1}
.chat-item .chat-delete:hover{background:rgba(251,113,133,0.2)}
.add-match-btn{display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:1rem;color:var(--accent);cursor:pointer;border:2px dashed var(--accent);border-radius:12px;margin:0 1rem;margin-top:1rem;transition:all 0.2s}
.add-match-btn:hover{background:rgba(251,146,60,0.1)}
</style>
</head>
<body>
<div class="app-frame">
  <div class="status-bar"><span>12:30</span><span>5G 🔋</span></div>
  <div class="nav-bar"><span class="nav-title">我的匹配</span></div>
  
  <div class="page-content">
    <div class="section-title">新匹配 <span style="color:var(--accent)" id="matchCount">3</span></div>
    <div class="chat-list" id="chatList">
    </div>
    <div class="add-match-btn" onclick="addMatch()">
      <span style="font-size:1.5rem">+</span>
      <span>添加新匹配</span>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="goPage('discover')"><span class="tab-icon">🔍</span>发现</div>
    <div class="tab-item" onclick="goPage('filters')"><span class="tab-icon">⚙️</span>筛选</div>
    <div class="tab-item active" onclick="goPage('matches')"><span class="tab-icon">💬</span>匹配</div>
    <div class="tab-item" onclick="goPage('profile')"><span class="tab-icon">👤</span>我的</div>
  </div>
</div>
<script src="../js/utils.js"></script>
<script>
checkLogin();
let matchesData=loadMatches();

function renderMatches(){
  const container=document.getElementById('chatList');
  container.innerHTML='';
  
  matchesData.forEach((match,i)=>{
    const item=document.createElement('div');
    item.className='chat-item';
    item.innerHTML=`
      <div class="chat-avatar" onclick="event.stopPropagation();editMatchAvatar(${i})">${match.avatar}</div>
      <div class="chat-info">
        <div class="chat-name" onclick="event.stopPropagation();editMatchName(${i})">${match.name}</div>
        <div class="chat-preview" onclick="event.stopPropagation();editMatchPreview(${i})">「${match.preview}」</div>
      </div>
      <div class="chat-time" onclick="event.stopPropagation();editMatchTime(${i})">${match.time}</div>
      ${match.unread>0?'<div class="unread" onclick="event.stopPropagation();editMatchUnread('+i+')">'+match.unread+'</div>':''}
      <div class="chat-delete" onclick="event.stopPropagation();deleteMatch(${i})">✕</div>
    `;
    item.onclick=()=>window.location.href='chat.html?index='+i;
    container.appendChild(item);
  });
  
  document.getElementById('matchCount').textContent=matchesData.length;
}

function editMatchName(index){
  showEditDialog('编辑名字',[{label:'名字',key:'name',value:matchesData[index].name,placeholder:'输入名字'}],(data)=>{
    matchesData[index].name=data.name||'未命名';
    saveMatches(matchesData);
    renderMatches();
  });
}

function editMatchAvatar(index){
  showEditDialog('更换头像',[{label:'头像表情',key:'avatar',value:matchesData[index].avatar,placeholder:'输入一个emoji'}],(data)=>{
    matchesData[index].avatar=data.avatar||'👤';
    saveMatches(matchesData);
    renderMatches();
  });
}

function editMatchPreview(index){
  showEditDialog('编辑消息预览',[{label:'消息内容',key:'preview',value:matchesData[index].preview,placeholder:'输入消息预览'}],(data)=>{
    matchesData[index].preview=data.preview||'暂无消息';
    saveMatches(matchesData);
    renderMatches();
  });
}

function editMatchTime(index){
  showEditDialog('编辑时间',[{label:'时间',key:'time',value:matchesData[index].time,placeholder:'如：2分钟前'}],(data)=>{
    matchesData[index].time=data.time||'刚刚';
    saveMatches(matchesData);
    renderMatches();
  });
}

function editMatchUnread(index){
  showEditDialog('编辑未读数量',[{label:'未读消息数',key:'unread',type:'number',value:matchesData[index].unread,placeholder:'输入数字'}],(data)=>{
    matchesData[index].unread=parseInt(data.unread)||0;
    saveMatches(matchesData);
    renderMatches();
  });
}

function deleteMatch(index){
  if(confirm('确定删除这个匹配吗？')){
    matchesData.splice(index,1);
    saveMatches(matchesData);
    renderMatches();
  }
}

function addMatch(){
  showEditDialog('添加新匹配',[
    {label:'名字',key:'name',placeholder:'输入名字'},
    {label:'头像',key:'avatar',placeholder:'输入emoji'},
    {label:'消息预览',key:'preview',placeholder:'输入消息内容'},
    {label:'时间',key:'time',value:'刚刚',placeholder:'时间'}
  ],(data)=>{
    matchesData.unshift({
      name:data.name||'新朋友',
      avatar:data.avatar||'👤',
      preview:data.preview||'你好！',
      time:data.time||'刚刚',
      unread:1
    });
    saveMatches(matchesData);
    renderMatches();
  });
}

renderMatches();
</script>
</body>
</html>
