<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>饭搭子匹配器 - 筛选</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.page-content{min-height:calc(100vh - 80px);padding-bottom:80px}

/* ==== 推荐区域 ==== */
.recommend-section{margin:0 1rem 1rem}
.recommend-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem}
.recommend-title{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:0.4rem}
.recommend-count{font-size:0.75rem;color:var(--muted);background:var(--bg2);padding:2px 10px;border-radius:10px}
.recommend-list{display:flex;flex-direction:column;gap:0.8rem}
.recommend-empty{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.85rem}
.recommend-empty span{font-size:2.5rem;display:block;margin-bottom:0.5rem}

/* ==== 推荐卡片 ==== */
.reco-card{display:flex;align-items:center;gap:0.8rem;padding:0.8rem;background:var(--card);border:1px solid var(--rule);border-radius:14px;transition:all 0.25s;cursor:pointer}
.reco-card:active{transform:scale(0.98)}
.reco-card:hover{border-color:var(--accent);background:rgba(251,146,60,0.05)}
.reco-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--rule)}
.reco-info{flex:1;min-width:0}
.reco-name-row{display:flex;align-items:center;gap:0.4rem;margin-bottom:0.2rem}
.reco-name{font-weight:700;font-size:0.9rem}
.reco-age{font-size:0.7rem;color:var(--muted)}
.reco-bio{font-size:0.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:0.3rem}
.reco-tags{display:flex;flex-wrap:wrap;gap:0.3rem}
.reco-tag{font-size:0.65rem;padding:2px 8px;border-radius:8px;background:var(--bg2);color:var(--ink)}
.reco-tag.match{background:rgba(251,146,60,0.15);color:var(--accent);font-weight:600}
.reco-match-score{display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;width:48px}
.reco-score-ring{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;position:relative}
.reco-score-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.reco-score-ring circle{fill:none;stroke-width:3}
.reco-score-bg{stroke:var(--rule)}
.reco-score-fg{stroke:var(--accent);transition:stroke-dashoffset 0.6s ease}
.reco-score-label{font-size:0.6rem;color:var(--muted);margin-top:0.2rem}
</style>
</head>
<body>
<div class="app-frame">
  <div class="status-bar"><span>12:30</span><span>5G 🔋</span></div>
  <div class="nav-bar"><span class="nav-back" onclick="goPage('discover')">←</span><span class="nav-title">筛选偏好</span></div>
  
  <div class="page-content">
    <div class="filter-section">
      <div class="filter-title">🍽️ 爱吃的菜系</div>
      <div class="filter-group">
        <div class="filter-options">
          <span class="filter-chip active" onclick="toggleChip(this)">川菜</span>
          <span class="filter-chip" onclick="toggleChip(this)">粤菜</span>
          <span class="filter-chip active" onclick="toggleChip(this)">日料</span>
          <span class="filter-chip" onclick="toggleChip(this)">韩餐</span>
          <span class="filter-chip" onclick="toggleChip(this)">火锅</span>
          <span class="filter-chip" onclick="toggleChip(this)">烧烤</span>
          <span class="filter-chip active" onclick="toggleChip(this)">甜品</span>
          <span class="filter-chip" onclick="toggleChip(this)">素食</span>
        </div>
      </div>
      <div class="filter-title">📍 约饭范围</div>
      <div class="filter-group">
        <div class="filter-options">
          <span class="filter-chip active" onclick="toggleChip(this)">1km内</span>
          <span class="filter-chip" onclick="toggleChip(this)">3km内</span>
          <span class="filter-chip" onclick="toggleChip(this)">同城</span>
          <span class="filter-chip" onclick="toggleChip(this)">不限</span>
        </div>
      </div>
      <div class="filter-title">⏰ 约饭时间</div>
      <div class="filter-group">
        <div class="filter-options">
          <span class="filter-chip active" onclick="toggleChip(this)">工作日午餐</span>
          <span class="filter-chip active" onclick="toggleChip(this)">周末</span>
          <span class="filter-chip" onclick="toggleChip(this)">晚餐</span>
          <span class="filter-chip" onclick="toggleChip(this)">宵夜</span>
        </div>
      </div>
    </div>

    <button class="btn-primary" onclick="goPage('discover')">应用筛选</button>

    <!-- ==== 推荐结果区域 ==== -->
    <div class="recommend-section">
      <div class="recommend-header">
        <div class="recommend-title">🎯 为你推荐</div>
        <span class="recommend-count" id="recoCount">0 位匹配</span>
      </div>
      <div class="recommend-list" id="recoList"></div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="goPage('discover')"><span class="tab-icon">🔍</span>发现</div>
    <div class="tab-item active" onclick="goPage('filters')"><span class="tab-icon">⚙️</span>筛选</div>
    <div class="tab-item" onclick="goPage('matches')"><span class="tab-icon">💬</span>匹配</div>
    <div class="tab-item" onclick="goPage('profile')"><span class="tab-icon">👤</span>我的</div>
  </div>
</div>
<script src="../js/utils.js"></script>
<script>
checkLogin();
loadFilters();

/* ==== 推荐用户数据（与 discover 页面共享） ==== */
const recommendUsers=[
  {id:1,name:'小林',age:'97年',job:'设计师',bio:'一个人吃饭太无聊，想找个口味相近的搭子探店。',food:['川菜','日料','甜品'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20Chinese%20Sichuan%20spicy%20food%20hotpot%20food%20photography&image_size=square'},
  {id:2,name:'阿杰',age:'95年',job:'程序员',bio:'火锅重度爱好者，能吃辣。想找人一起打卡新开的火锅店。',food:['火锅','烧烤','川菜'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20Chinese%20hotpot%20food%20photography&image_size=square'},
  {id:3,name:'小美',age:'00年',job:'学生',bio:'刚到这座城市实习，想找人带路吃遍本地美食！',food:['日料','甜品','韩餐'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20Japanese%20sushi%20food%20photography&image_size=square'},
  {id:4,name:'大鹏',age:'93年',job:'产品经理',bio:'工作日午餐固定的苦恼，想找人轮流探不同的店。',food:['粤菜','素食','日料'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20Cantonese%20dim%20sum%20food%20photography&image_size=square'},
  {id:5,name:'小月',age:'98年',job:'插画师',bio:'甜品控，喜欢探店下午茶，寻找最美味的蛋糕。',food:['甜品','粤菜','素食'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20dessert%20cake%20food%20photography&image_size=square'},
  {id:6,name:'阿伟',age:'96年',job:'健身教练',bio:'注重饮食健康，偏好轻食和素食，也喜欢偶尔放纵一下。',food:['素食','粤菜','烧烤'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20healthy%20salad%20food%20photography&image_size=square'},
  {id:7,name:'小雪',age:'99年',job:'编辑',bio:'无辣不欢！川菜是我的最爱，想找同样能吃辣的搭子。',food:['川菜','火锅','烧烤'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20spicy%20Chinese%20food%20food%20photography&image_size=square'},
  {id:8,name:'大刘',age:'94年',job:'摄影师',bio:'走遍全城拍美食，宵夜党，喜欢深夜探店。',food:['烧烤','火锅','韩餐'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20BBQ%20grilled%20food%20photography&image_size=square'}
];

/* ==== 菜系关键词映射 ==== */
const cuisineKeywords=['川菜','粤菜','日料','韩餐','火锅','烧烤','甜品','素食'];

/* ==== 获取当前选中的筛选条件 ==== */
function getSelectedFilters(){
  const sections=document.querySelectorAll('.filter-section .filter-group');
  const filters={cuisine:[],range:[],time:[]};
  const groups=[filters.cuisine,filters.range,filters.time];
  sections.forEach((group,i)=>{
    if(groups[i]){
      group.querySelectorAll('.filter-chip.active').forEach(chip=>{
        groups[i].push(chip.textContent.trim());
      });
    }
  });
  return filters;
}

/* ==== 计算匹配分数 ==== */
function calcMatchScore(user,filters){
  let score=0;
  let matchedTags=[];
  /* 菜系匹配（权重 60%） */
  if(filters.cuisine.length>0){
    const matched=user.food.filter(f=>filters.cuisine.includes(f));
    if(matched.length>0){
      score+=60;
      matchedTags.push(...matched);
    }
  }else{
    score+=30;
  }
  /* 范围匹配（权重 20%） */
  if(filters.range.length>0){
    score+=20;
  }
  /* 时间匹配（权重 20%） */
  if(filters.time.length>0){
    /* 根据简介关键词简单匹配时间偏好 */
    const bio=user.bio;
    if(filters.time.includes('工作日午餐')&&(bio.includes('工作日')||bio.includes('午餐')))score+=20;
    else if(filters.time.includes('周末')&&(bio.includes('周末')))score+=20;
    else if(filters.time.includes('晚餐'))score+=15;
    else if(filters.time.includes('宵夜')&&(bio.includes('宵夜')||bio.includes('深夜')))score+=20;
    else score+=10;
  }
  return{score:Math.min(score,100),matchedTags};
}

/* ==== 渲染推荐列表 ==== */
function renderRecommendations(){
  const filters=getSelectedFilters();
  const list=document.getElementById('recoList');
  const countEl=document.getElementById('recoCount');
  
  /* 计算所有用户的匹配分数 */
  const scored=recommendUsers.map(user=>{
    const{score,matchedTags}=calcMatchScore(user,filters);
    return{user,score,matchedTags};
  });
  
  /* 按匹配分数排序，只显示有匹配的 */
  const matched=scored.filter(item=>item.score>30).sort((a,b)=>b.score-a.score);
  
  countEl.textContent=matched.length+' 位匹配';
  
  if(matched.length===0){
    list.innerHTML='<div class="recommend-empty"><span>🍽️</span>没有找到匹配的饭搭子<br>试试调整筛选条件吧</div>';
    return;
  }
  
  list.innerHTML=matched.map(item=>{
    const u=item.user;
    const score=item.score;
    /* 匹配分数环形进度 */
    const circumference=2*Math.PI*18;
    const offset=circumference*(1-score/100);
    const scoreColor=score>=80?'var(--accent)':score>=60?'var(--accent2)':'var(--muted)';
    
    /* 标签渲染，匹配的标签高亮 */
    const tagsHTML=u.food.map(f=>{
      const isMatch=item.matchedTags.includes(f);
      return '<span class="reco-tag'+(isMatch?' match':'')+'">'+f+'</span>';
    }).join('');
    
    return '<div class="reco-card" onclick="goPage(\'discover\')">'+
      '<img class="reco-avatar" src="'+u.image+'" alt="'+u.name+'" />'+
      '<div class="reco-info">'+
        '<div class="reco-name-row">'+
          '<span class="reco-name">'+u.name+'</span>'+
          '<span class="reco-age">'+u.age+' · '+u.job+'</span>'+
        '</div>'+
        '<div class="reco-bio">'+u.bio+'</div>'+
        '<div class="reco-tags">'+tagsHTML+'</div>'+
      '</div>'+
      '<div class="reco-match-score">'+
        '<div class="reco-score-ring" style="color:'+scoreColor+'">'+
          '<svg width="40" height="40">'+
            '<circle class="reco-score-bg" cx="20" cy="20" r="18"></circle>'+
            '<circle class="reco-score-fg" cx="20" cy="20" r="18" stroke="'+scoreColor+'" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'"></circle>'+
          '</svg>'+
          score+'%'+
        '</div>'+
        '<span class="reco-score-label">匹配度</span>'+
      '</div>'+
    '</div>';
  }).join('');
}

/* ==== 重写 toggleChip，切换后更新推荐 ==== */
function toggleChip(el){
  el.classList.toggle('active');
  saveFilters();
  renderRecommendations();
}

/* 页面加载后渲染推荐 */
renderRecommendations();
</script>
</body>
</html>
