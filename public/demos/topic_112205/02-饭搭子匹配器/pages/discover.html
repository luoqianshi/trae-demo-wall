<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>饭搭子匹配器 - 发现</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.page-content{min-height:calc(100vh - 80px);padding-bottom:80px;padding-top:0}
.card-stack{position:relative;height:460px;margin:0 1rem;perspective:600px}

.match-card{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--rule);border-radius:24px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.3);cursor:grab;transform-style:preserve-3d;will-change:transform,opacity;backface-visibility:hidden}
.match-card:active{cursor:grabbing}
.match-card .card-photo{flex:0 0 280px;height:280px;background:linear-gradient(135deg,#16162e,#2a1a4a);position:relative;overflow:hidden}
.match-card .card-photo img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.match-card .card-photo::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(to bottom,rgba(26,26,58,0.5),var(--card))}
.match-card .card-info{flex:1 1 auto;padding:1.2rem;display:flex;flex-direction:column;gap:0.8rem}
.match-card .card-name-row{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap}
.match-card .card-name{font-size:1.35rem;font-weight:800;line-height:1.2}
.match-card .card-tag{font-size:0.7rem;padding:4px 12px;border-radius:20px;background:var(--bg3);color:var(--accent);font-weight:600;white-space:nowrap}
.match-card .card-bio{font-size:0.88rem;color:var(--muted);line-height:1.6}
.match-card .card-edit{position:absolute;top:1rem;right:1rem;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;font-size:0.8rem;cursor:pointer;opacity:0;transition:opacity 0.2s;z-index:20}
.match-card:hover .card-edit{opacity:1}
.match-card .card-edit:hover{background:rgba(0,0,0,0.7)}
.add-card-btn{display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.6rem;color:var(--accent);cursor:pointer;border:2px dashed var(--accent);border-radius:12px;margin:0 1rem;margin-top:0.2rem;transition:all 0.2s}
.add-card-btn:hover{background:rgba(251,146,60,0.1)}
.action-tip{text-align:center;color:var(--muted);font-size:0.75rem;padding:0.1rem 1rem 0}
.match-card .card-food{display:flex;gap:0.5rem;flex-wrap:wrap}
.food-tag{font-size:0.72rem;padding:5px 12px;border-radius:20px;background:rgba(251,146,60,0.12);color:var(--accent);border:1px solid rgba(251,146,60,0.25);font-weight:500}

.action-row{display:flex;justify-content:center;gap:2rem;margin-top:0;position:relative}
.action-btn{width:64px;height:64px;border-radius:50%;border:2px solid var(--rule);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;transition:all 0.25s cubic-bezier(0.25,0.8,0.25,1);position:relative;z-index:2;overflow:hidden}
.action-btn:hover{transform:scale(1.12)}
.action-btn:active{transform:scale(0.95)}
.action-btn.pass{color:var(--pass);border-color:var(--pass)}
.action-btn.like{color:var(--like);border-color:var(--like);box-shadow:0 0 24px rgba(251,113,133,0.3)}
.action-btn.super{color:var(--accent);border-color:var(--accent);box-shadow:0 0 24px rgba(251,146,60,0.3)}

.action-btn .particle-container{position:absolute;inset:0;pointer-events:none;z-index:3}

.bubble-particle{position:absolute;width:12px;height:12px;border-radius:50%;top:50%;left:50%;margin:-6px 0 0 -6px;animation:bubbleExpand 0.8s ease-out forwards}
@keyframes bubbleExpand{0%{transform:translate(0,0) scale(0);opacity:1}50%{opacity:0.8}100%{transform:translate(var(--end-x),var(--end-y)) scale(0);opacity:0}}

.bubble-point{position:absolute;width:100%;height:100%;border-radius:50%;animation:bubblePoint 0.8s ease-out forwards}
@keyframes bubblePoint{0%{transform:scale(0);opacity:0}25%{transform:scale(0.3);opacity:1}60%{transform:scale(1);opacity:0.8}100%{transform:scale(0);opacity:0}}

.match-popup{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:200}
.match-popup.active{display:flex}
.match-popup-content{text-align:center;padding:2rem;width:90%;max-width:320px}
.match-popup .match-emoji{font-size:4rem;margin-bottom:1rem;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.match-popup .match-title{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.5rem}
.match-popup .match-sub{color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem}

.card-swipe-right{animation:swipeRight 0.4s cubic-bezier(0.25,0.8,0.25,1) forwards}
.card-swipe-left{animation:swipeLeft 0.4s cubic-bezier(0.25,0.8,0.25,1) forwards}
@keyframes swipeRight{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(130%) rotate(18deg)}}
@keyframes swipeLeft{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(-130%) rotate(-18deg)}}
</style>
</head>
<body>
<div class="app-frame">
  <div class="status-bar"><span>12:30</span><span>5G 🔋</span></div>
  <div class="nav-bar"><span class="nav-title">发现饭搭子</span></div>
  
  <div class="page-content">
    <div class="card-stack" id="cardStack"></div>
    <div class="action-row">
      <div class="action-btn pass" onclick="handlePass()">✕</div>
      <div class="action-btn super" onclick="showMatch()">⭐</div>
      <div class="action-btn like" onclick="handleLike()">♥</div>
    </div>
    <div class="action-tip">左滑跳过 · 右滑喜欢 · 互相喜欢即可聊天约饭</div>
    <div class="add-card-btn" onclick="addCard()">
      <span style="font-size:1.5rem">+</span>
      <span>添加新卡片</span>
    </div>
  </div>

  <div class="match-popup" id="matchPopup" onclick="this.classList.remove('active')">
    <div class="match-popup-content">
      <div class="match-emoji">🎉</div>
      <div class="match-title">匹配成功！</div>
      <div class="match-sub">你们互相喜欢，现在可以聊天约饭啦</div>
      <button class="btn-primary" onclick="document.getElementById('matchPopup').classList.remove('active');goPage('matches')">去聊天</button>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" onclick="goPage('discover')"><span class="tab-icon">🔍</span>发现</div>
    <div class="tab-item" onclick="goPage('filters')"><span class="tab-icon">⚙️</span>筛选</div>
    <div class="tab-item" onclick="goPage('matches')"><span class="tab-icon">💬</span>匹配</div>
    <div class="tab-item" onclick="goPage('profile')"><span class="tab-icon">👤</span>我的</div>
  </div>
</div>
<script src="../js/utils.js"></script>
<script>
checkLogin();
localStorage.removeItem('fandazi_cards');
let cards=loadCards();
let cardStack=[];

const animationConfig={stiffness:260,damping:20};
const sensitivity=180;
const randomRotation=true;

function loadCards(){
  const saved=localStorage.getItem('fandazi_cards');
  if(saved){
    try{
      const parsed=JSON.parse(saved);
      if(Array.isArray(parsed)&&parsed.length>0){
        return parsed.map(card=>({
          id:card.id||Date.now()+Math.random(),
          name:card.name||'未命名',
          age:card.age||'未知',
          job:card.job||'未知',
          bio:card.bio||'',
          food:Array.isArray(card.food)?card.food:[],
          image:card.image||'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20food%20photography%20high%20quality&image_size=portrait_4_3'
        }));
      }
    }catch(e){}
  }
  return [
    {id:1,name:'小林',age:'97年',job:'设计师',bio:'一个人吃饭太无聊，想找个口味相近的搭子探店。周末基本都有空！',food:['🌶️ 川菜','🍣 日料','🍰 甜品'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20Chinese%20Sichuan%20spicy%20food%20hotpot%20with%20red%20chili%20oil%20steam%20rising%20food%20photography%20high%20quality&image_size=portrait_4_3'},
    {id:2,name:'阿杰',age:'95年',job:'程序员',bio:'火锅重度爱好者，能吃辣。想找人一起打卡新开的火锅店。',food:['🍲 火锅','🍢 串串','🍖 烧烤'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20Chinese%20hotpot%20with%20various%20ingredients%20meat%20vegetables%20steam%20food%20photography%20high%20quality&image_size=portrait_4_3'},
    {id:3,name:'小美',age:'00年',job:'学生',bio:'刚到这座城市实习，想找人带路吃遍本地美食！',food:['🍜 面食','🥟 点心','🧋 奶茶'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20Chinese%20noodles%20and%20dumplings%20food%20photography%20warm%20lighting%20high%20quality&image_size=portrait_4_3'},
    {id:4,name:'大鹏',age:'93年',job:'产品经理',bio:'工作日午餐固定的苦恼，想找人轮流探不同的店。',food:['🍱 简餐','🥗 轻食','☕ 咖啡'],image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20healthy%20salad%20bowl%20with%20coffee%20lunch%20meal%20food%20photography%20high%20quality&image_size=portrait_4_3'}
  ];
}

function saveCards(){
  localStorage.setItem('fandazi_cards',JSON.stringify(cards));
}

function springAnimate(element,props,duration=400){
  const startProps={};
  const endProps={};
  const ds=element.dataset;
  for(const key in props){
    if(key==='x')startProps[key]=parseFloat(ds.x||'0')||0;
    else if(key==='y')startProps[key]=parseFloat(ds.y||'0')||0;
    else if(key==='rotateZ')startProps[key]=parseFloat(ds.rz||'0')||0;
    else if(key==='scale')startProps[key]=parseFloat(ds.sc||'1')||1;
    else if(key==='opacity')startProps[key]=parseFloat(ds.op||'1')||1;
    endProps[key]=props[key];
  }
  const startTime=performance.now();
  const animate=function(currentTime){
    const elapsed=currentTime-startTime;
    const progress=Math.min(elapsed/duration,1);
    const eased=1-Math.pow(1-progress,3);
    let t='';
    for(const key in props){
      const cur=startProps[key]+(endProps[key]-startProps[key])*eased;
      if(key==='x'){t+=' translateX('+cur+'px)';ds.x=cur;}
      else if(key==='y'){t+=' translateY('+cur+'px)';ds.y=cur;}
      else if(key==='rotateZ'){t+=' rotateZ('+cur+'deg)';ds.rz=cur;}
      else if(key==='scale'){t+=' scale('+cur+')';ds.sc=cur;}
      else if(key==='opacity'){element.style.opacity=cur;ds.op=cur;}
    }
    element.style.transform=t;
    if(progress<1)requestAnimationFrame(animate);
  };
  requestAnimationFrame(animate);
}

function createCardElement(cardData,index){
  const foodHTML=cardData.food.map(f=>'<span class="food-tag">'+f+'</span>').join('');
  const card=document.createElement('div');
  card.className='match-card';
  card.dataset.cardId=cardData.id;
  card.dataset.x=0;
  card.dataset.y=0;
  card.dataset.rz=0;
  card.dataset.sc=1;
  card.dataset.op=1;
  card.innerHTML='<div class="card-edit" onclick="editCard('+index+')">✎</div>'+
    '<div class="card-photo"><img src="'+cardData.image+'" alt="美食" /></div>'+
    '<div class="card-info">'+
      '<div class="card-name-row">'+
        '<div class="card-name" onclick="editCardField('+index+',\'name\')">'+cardData.name+'</div>'+
        '<span class="card-tag" onclick="editCardField('+index+',\'job\')">'+cardData.age+' · '+cardData.job+'</span>'+
      '</div>'+
      '<div class="card-bio" onclick="editCardField('+index+',\'bio\')">'+cardData.bio+'</div>'+
      '<div class="card-food">'+foodHTML+'</div>'+
    '</div>';
  return card;
}

function initCards(){
  const stack=document.getElementById('cardStack');
  stack.innerHTML='';
  cardStack=cards.map((card,index)=>{
    const cardEl=createCardElement(card,index);
    const cardData={el:cardEl,data:card,index};
    stack.appendChild(cardEl);
    return cardData;
  });
  updateCardPositions();
  bindDragEvents();
}

function updateCardPositions(){
  const total=cardStack.length;
  cardStack.forEach((card,index)=>{
    const randomRotate=randomRotation?(Math.random()*10-5):0;
    const rotationZ=(total-index-1)*4+randomRotate;
    const scale=1+index*0.06-total*0.06;
    card.el.style.zIndex=index+1;
    springAnimate(card.el,{
      x:0,
      y:0,
      rotateZ:rotationZ,
      scale:scale,
      opacity:index===total-1?1:0.7*(1-index/total)
    },400);
  });
}

function sendToBack(cardId){
  const index=cardStack.findIndex(c=>c.data.id===cardId);
  if(index===-1)return;
  const [card]=cardStack.splice(index,1);
  cardStack.push(card);
  updateCardPositions();
}

let isDragging=false;
let dragStartX=0;
let dragStartY=0;
let currentDragX=0;
let currentDragY=0;
let activeCard=null;
let dragRafId=null;

function bindDragEvents(){
  const stack=document.getElementById('cardStack');
  stack.addEventListener('mousedown',handleMouseDown);
  stack.addEventListener('touchstart',handleTouchStart,{passive:false});
  window.addEventListener('mousemove',handleMouseMove);
  window.addEventListener('touchmove',handleTouchMove,{passive:false});
  window.addEventListener('mouseup',handleMouseUp);
  window.addEventListener('touchend',handleMouseUp);
}

function getEventPos(e){
  if(e.touches&&e.touches.length>0){
    return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  }
  return {x:e.clientX,y:e.clientY};
}

function handleMouseDown(e){
  const target=e.target.closest('.match-card');
  if(!target)return;
  const cardIndex=cardStack.findIndex(c=>c.el===target);
  if(cardIndex!==cardStack.length-1)return;
  isDragging=true;
  activeCard=target;
  const pos=getEventPos(e);
  dragStartX=pos.x;
  dragStartY=pos.y;
  currentDragX=parseFloat(target.dataset.x)||0;
  currentDragY=parseFloat(target.dataset.y)||0;
}

function handleTouchStart(e){
  handleMouseDown(e);
}

function handleMouseMove(e){
  if(!isDragging||!activeCard)return;
  e.preventDefault();
  const pos=getEventPos(e);
  currentDragX=pos.x-dragStartX;
  currentDragY=pos.y-dragStartY;
  if(dragRafId)return;
  dragRafId=requestAnimationFrame(()=>{
    dragRafId=null;
    const rx=-(currentDragY/100)*60;
    const ry=(currentDragX/100)*60;
    activeCard.style.transform='translateX('+currentDragX+'px) translateY('+currentDragY+'px) rotateX('+rx+'deg) rotateY('+ry+'deg)';
  });
}

function handleTouchMove(e){
  handleMouseMove(e);
}

function handleMouseUp(e){
  if(!isDragging||!activeCard)return;
  isDragging=false;
  if(dragRafId){cancelAnimationFrame(dragRafId);dragRafId=null;}
  const cardEl=activeCard;
  const cardId=parseInt(cardEl.dataset.cardId);
  if(Math.abs(currentDragX)>sensitivity||Math.abs(currentDragY)>sensitivity){
    const animClass=currentDragX>0?'card-swipe-right':'card-swipe-left';
    cardEl.classList.add(animClass);
    setTimeout(()=>{
      sendToBack(cardId);
      cardEl.classList.remove(animClass);
    },400);
  }else{
    const rz=parseFloat(cardEl.dataset.rz)||0;
    const sc=parseFloat(cardEl.dataset.sc)||1;
    springAnimate(cardEl,{x:0,y:0,rz:rz,sc:sc},350);
  }
  activeCard=null;
}

function createBubbles(btnEl,color){
  const container=btnEl.querySelector('.particle-container')||(function(){
    const div=document.createElement('div');
    div.className='particle-container';
    btnEl.appendChild(div);
    return div;
  })();
  container.innerHTML='';
  const particleCount=12;
  const outerDist=80;
  const innerDist=10;
  for(let i=0;i<particleCount;i++){
    const angle=(360/particleCount)*i*(Math.PI/180)+(Math.random()-0.5)*0.3;
    const startX=outerDist*Math.cos(angle);
    const startY=outerDist*Math.sin(angle);
    const endX=(innerDist+Math.random()*7)*Math.cos(angle);
    const endY=(innerDist+Math.random()*7)*Math.sin(angle);
    const rotate=(Math.random()-0.5)*100;
    const scale=1+(Math.random()-0.5)*0.2;
    const particle=document.createElement('span');
    particle.className='bubble-particle';
    particle.style.setProperty('--end-x',endX+'px');
    particle.style.setProperty('--end-y',endY+'px');
    particle.style.setProperty('--rotate',rotate+'deg');
    particle.style.setProperty('--scale',scale);
    const point=document.createElement('span');
    point.className='bubble-point';
    point.style.backgroundColor=color;
    particle.appendChild(point);
    container.appendChild(particle);
    setTimeout(()=>{
      try{container.removeChild(particle)}catch(e){}
    },800);
  }
}

function handlePass(){
  if(cardStack.length===0)return;
  const btn=document.querySelector('.action-btn.pass');
  if(btn)createBubbles(btn,'var(--pass)');
  const topCard=cardStack[cardStack.length-1];
  const cardEl=topCard.el;
  cardEl.classList.add('card-swipe-left');
  setTimeout(()=>{
    sendToBack(topCard.data.id);
    cardEl.classList.remove('card-swipe-left');
  },400);
}

function handleLike(){
  if(cardStack.length===0)return;
  const btn=document.querySelector('.action-btn.like');
  if(btn)createBubbles(btn,'var(--like)');
  const topCard=cardStack[cardStack.length-1];
  const cardEl=topCard.el;
  cardEl.classList.add('card-swipe-right');
  setTimeout(()=>{
    sendToBack(topCard.data.id);
    cardEl.classList.remove('card-swipe-right');
    if(Math.random()>0.5)showMatch();
  },400);
}

function editCard(index){
  const c=cards[index];
  showEditDialog('编辑卡片',[
    {label:'美食图片',key:'image',type:'image',value:c.image},
    {label:'名字',key:'name',value:c.name,placeholder:'输入名字'},
    {label:'年龄',key:'age',value:c.age,placeholder:'如：97年'},
    {label:'职业',key:'job',value:c.job,placeholder:'输入职业'},
    {label:'简介',key:'bio',type:'textarea',value:c.bio,placeholder:'输入个人简介'},
    {label:'美食标签（逗号分隔）',key:'food',value:c.food.join(','),placeholder:'🌶️ 川菜,🍣 日料'}
  ],(data)=>{
    cards[index].name=data.name||c.name;
    cards[index].age=data.age||c.age;
    cards[index].job=data.job||c.job;
    cards[index].bio=data.bio||c.bio;
    cards[index].food=data.food?data.food.split(',').map(f=>f.trim()).filter(Boolean):c.food;
    if(data.image)cards[index].image=data.image;
    saveCards();
    initCards();
  });
}

function editCardField(index,field){
  const labels={name:'名字',age:'年龄',job:'职业',bio:'简介'};
  showEditDialog('编辑'+labels[field],[{label:labels[field],key:'value',value:cards[index][field],placeholder:'输入'+labels[field]}],(data)=>{
    cards[index][field]=data.value||cards[index][field];
    saveCards();
    initCards();
  });
}

function addCard(){
  showEditDialog('添加新卡片',[
    {label:'美食图片',key:'image',type:'image'},
    {label:'名字',key:'name',placeholder:'输入名字'},
    {label:'年龄',key:'age',placeholder:'如：97年'},
    {label:'职业',key:'job',placeholder:'输入职业'},
    {label:'简介',key:'bio',type:'textarea',placeholder:'输入个人简介'},
    {label:'美食标签（逗号分隔）',key:'food',placeholder:'🌶️ 川菜,🍣 日料'}
  ],(data)=>{
    cards.push({
      id:Date.now(),
      name:data.name||'新朋友',
      age:data.age||'未知',
      job:data.job||'未知',
      bio:data.bio||'喜欢美食，想找饭搭子！',
      food:data.food?data.food.split(',').map(f=>f.trim()).filter(Boolean):['🍽️ 美食'],
      image:data.image||'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=delicious%20food%20photography%20high%20quality&image_size=portrait_4_3'
    });
    saveCards();
    initCards();
  });
}

function showMatch(){
  const btn=document.querySelector('.action-btn.super');
  if(btn)createBubbles(btn,'var(--accent)');
  document.getElementById('matchPopup').classList.add('active');
}

initCards();
</script>
</body>
</html>
