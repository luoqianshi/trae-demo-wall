<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>饭搭子匹配器 - 我的</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.page-content{min-height:calc(100vh - 80px);padding-bottom:80px}
.profile-header{text-align:center;padding:2rem 1rem}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin-bottom:1rem;border:3px solid var(--accent);cursor:pointer;transition:transform 0.2s}
.profile-avatar:hover{transform:scale(1.05)}
.profile-name{font-size:1.3rem;font-weight:700;cursor:pointer}
.profile-name:hover{color:var(--accent)}
.profile-meta{color:var(--muted);font-size:0.85rem;margin-top:0.3rem}
.edit-icon{font-size:0.75rem;color:var(--accent);margin-left:0.3rem}
.stat-row{display:flex;justify-content:space-between;margin-bottom:0.5rem;padding:0.5rem 0;border-bottom:1px solid var(--rule);cursor:pointer}
.stat-row:last-child{border-bottom:none}
.stat-row:hover{background:var(--card)}
.stat-label{color:var(--muted)}
.stat-value{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="app-frame">
  <div class="status-bar"><span>12:30</span><span>5G 🔋</span></div>
  <div class="nav-bar"><span class="nav-title">我的</span></div>
  
  <div class="page-content">
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar" onclick="editAvatar()">😎</div>
      <div class="profile-name" onclick="editNickname()">你的昵称<span class="edit-icon">✎</span></div>
      <div class="profile-meta">点击可编辑个人资料</div>
    </div>
    <div class="filter-section">
      <div class="filter-title">我的标签</div>
      <div class="filter-options" id="profileTags">
        <span class="filter-chip active">🌶️ 无辣不欢</span>
        <span class="filter-chip active">🍰 甜品控</span>
        <span class="filter-chip">🍺 微醺党</span>
        <span class="filter-chip active">📸 饭前拍照</span>
      </div>
      <div style="margin-top:0.8rem;text-align:right"><button class="btn-secondary" style="width:auto;padding:6px 16px;font-size:0.8rem" onclick="editTags()">编辑标签</button></div>
    </div>
    <div class="filter-section">
      <div class="stat-row" onclick="editStat('meals')"><span class="stat-label">本月约饭</span><span class="stat-value" id="statMeals">5次</span></div>
      <div class="stat-row" onclick="editStat('friends')"><span class="stat-label">新认识的搭子</span><span class="stat-value" id="statFriends">8人</span></div>
      <div class="stat-row" onclick="editStat('restaurants')"><span class="stat-label">收藏的餐厅</span><span class="stat-value" id="statRestaurants">12家</span></div>
    </div>
    <button class="btn-primary" onclick="goPage('filters')">编辑筛选偏好</button>
    <button class="btn-secondary" onclick="logout()">退出登录</button>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="goPage('discover')"><span class="tab-icon">🔍</span>发现</div>
    <div class="tab-item" onclick="goPage('filters')"><span class="tab-icon">⚙️</span>筛选</div>
    <div class="tab-item" onclick="goPage('matches')"><span class="tab-icon">💬</span>匹配</div>
    <div class="tab-item active" onclick="goPage('profile')"><span class="tab-icon">👤</span>我的</div>
  </div>
</div>
<script src="../js/utils.js"></script>
<script>
checkLogin();
let profileData=loadProfile();

function renderProfile(){
  document.getElementById('profileAvatar').textContent=profileData.avatar;
  document.querySelector('.profile-name').innerHTML=profileData.nickname+'<span class="edit-icon">✎</span>';
  document.getElementById('statMeals').textContent=profileData.stats.meals+'次';
  document.getElementById('statFriends').textContent=profileData.stats.friends+'人';
  document.getElementById('statRestaurants').textContent=profileData.stats.restaurants+'家';
  
  const tagsContainer=document.getElementById('profileTags');
  tagsContainer.innerHTML='';
  const allTags=['🌶️ 无辣不欢','🍰 甜品控','🍺 微醺党','📸 饭前拍照','🍳 厨艺达人','🧋 奶茶控','🥗 健康饮食','🍣 日料爱好者'];
  allTags.forEach(tag=>{
    const chip=document.createElement('span');
    chip.className='filter-chip'+(profileData.tags.includes(tag)?' active':'');
    chip.textContent=tag;
    tagsContainer.appendChild(chip);
  });
}

function editNickname(){
  showEditDialog('编辑昵称',[{label:'昵称',key:'nickname',value:profileData.nickname,placeholder:'输入你的昵称'}],saveNickname);
}

function saveNickname(data){
  profileData.nickname=data.nickname||'你的昵称';
  saveProfile(profileData);
  renderProfile();
}

function editAvatar(){
  showEditDialog('更换头像',[{label:'头像表情',key:'avatar',value:profileData.avatar,placeholder:'输入一个emoji'}],saveAvatar);
}

function saveAvatar(data){
  profileData.avatar=data.avatar||'😎';
  saveProfile(profileData);
  renderProfile();
}

function editTags(){
  const tags=['🌶️ 无辣不欢','🍰 甜品控','🍺 微醺党','📸 饭前拍照','🍳 厨艺达人','🧋 奶茶控','🥗 健康饮食','🍣 日料爱好者'];
  const selected=profileData.tags.join(',');
  showEditDialog('选择标签（用逗号分隔）',[{label:'已选标签',key:'tags',value:selected,placeholder:'🌶️ 无辣不欢,🍰 甜品控'}],saveTags);
}

function saveTags(data){
  profileData.tags=data.tags?data.tags.split(',').map(t=>t.trim()).filter(Boolean):[];
  saveProfile(profileData);
  renderProfile();
}

function editStat(type){
  const labels={meals:'本月约饭次数',friends:'新认识的搭子数',restaurants:'收藏的餐厅数'};
  showEditDialog('编辑'+labels[type],[{label:'数量',key:'value',type:'number',value:profileData.stats[type],placeholder:'输入数字'}],(data)=>{
    profileData.stats[type]=parseInt(data.value)||0;
    saveProfile(profileData);
    renderProfile();
  });
}

renderProfile();
</script>
</body>
</html>
