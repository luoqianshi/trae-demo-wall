<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>饭搭子匹配器 - 注册</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.register-page{max-width:420px;margin:0 auto;background:var(--bg);min-height:100vh;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.register-header{text-align:center;padding:3rem 2rem 1.5rem}
.register-icon{font-size:4rem;margin-bottom:0.8rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.register-title{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.3rem}
.register-sub{color:var(--muted);font-size:0.85rem}
.register-form{padding:0 2rem}
.form-group{margin-bottom:1rem}
.form-label{font-size:0.85rem;color:var(--muted);margin-bottom:0.4rem;display:block}
.form-input{width:100%;padding:12px 16px;background:var(--card);border:1px solid var(--rule);border-radius:10px;color:var(--ink);font-size:1rem;transition:all 0.2s}
.form-input:focus{outline:none;border-color:var(--accent)}
.form-input::placeholder{color:rgba(226,232,240,0.3)}
.form-input.error{border-color:var(--like)}
.form-tip{font-size:0.72rem;color:var(--like);margin-top:0.3rem;display:none}
.form-tip.show{display:block}
</style>
</head>
<body>
<div class="register-page">
  <div class="register-header">
    <div class="register-icon">🍜</div>
    <div class="register-title">创建账号</div>
    <div class="register-sub">加入饭搭子，告别一个人吃饭</div>
  </div>
  <div class="register-form">
    <div class="form-group">
      <label class="form-label">昵称</label>
      <input type="text" class="form-input" placeholder="给自己起个昵称" id="nickname">
    </div>
    <div class="form-group">
      <label class="form-label">手机号或邮箱</label>
      <input type="text" class="form-input" placeholder="请输入手机号或邮箱" id="account">
      <div class="form-tip" id="accountTip">该账号已注册，请直接登录</div>
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" class="form-input" placeholder="设置密码（6-20位）" id="password">
    </div>
    <div class="form-group">
      <label class="form-label">确认密码</label>
      <input type="password" class="form-input" placeholder="请再次输入密码" id="confirmPassword">
      <div class="form-tip" id="pwdTip">两次输入的密码不一致</div>
    </div>
    <button class="btn-primary" onclick="handleRegister()">注 册</button>
    <div style="text-align:center;margin-top:1.5rem">
      <span style="color:var(--muted);font-size:0.8rem">已有账号？</span>
      <span style="color:var(--accent);font-size:0.8rem;margin-left:0.3rem;cursor:pointer" onclick="window.location.href='login.html'">返回登录</span>
    </div>
  </div>
</div>
<script src="../js/utils.js"></script>
<script>
function handleRegister(){
  const nickname=document.getElementById('nickname').value.trim();
  const account=document.getElementById('account').value.trim();
  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;

  document.querySelectorAll('.form-tip').forEach(t=>t.classList.remove('show'));
  document.querySelectorAll('.form-input').forEach(i=>i.classList.remove('error'));

  if(!nickname){
    alert('请输入昵称');
    return;
  }
  if(!account){
    alert('请输入手机号或邮箱');
    return;
  }
  const isPhone=/^1\d{10}$/.test(account);
  const isEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(account);
  if(!isPhone&&!isEmail){
    alert('请输入正确的手机号或邮箱');
    return;
  }
  if(password.length<6||password.length>20){
    alert('密码长度需为6-20位');
    return;
  }
  if(password!==confirmPassword){
    document.getElementById('pwdTip').classList.add('show');
    document.getElementById('confirmPassword').classList.add('error');
    return;
  }

  const users=JSON.parse(localStorage.getItem('fandazi_users')||'{}');
  if(users[account]){
    document.getElementById('accountTip').classList.add('show');
    document.getElementById('account').classList.add('error');
    return;
  }

  register(nickname,account,password);
}
</script>
</body>
</html>
