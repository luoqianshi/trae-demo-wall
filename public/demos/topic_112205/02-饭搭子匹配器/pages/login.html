<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>饭搭子匹配器 - 登录</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.login-page{max-width:420px;margin:0 auto;background:var(--bg);min-height:100vh;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.login-header{text-align:center;padding:4rem 2rem 2rem}
.login-icon{font-size:5rem;margin-bottom:1rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.login-title{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.5rem}
.login-sub{color:var(--muted);font-size:0.9rem}
.login-form{padding:0 2rem}
.form-group{margin-bottom:1rem}
.form-label{font-size:0.85rem;color:var(--muted);margin-bottom:0.4rem;display:block}
.form-input{width:100%;padding:12px 16px;background:var(--card);border:1px solid var(--rule);border-radius:10px;color:var(--ink);font-size:1rem;transition:all 0.2s}
.form-input:focus{outline:none;border-color:var(--accent)}
.form-input::placeholder{color:rgba(226,232,240,0.3)}
.login-tip{font-size:0.75rem;color:var(--muted);text-align:center;margin-top:1rem}
.divider{display:flex;align-items:center;margin:1.5rem 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--rule)}
.divider-text{padding:0 1rem;color:var(--muted);font-size:0.8rem}
.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1rem}
.social-btn{display:flex;align-items:center;justify-content:center;gap:0.4rem;padding:12px;background:var(--card);border:1px solid var(--rule);border-radius:10px;color:var(--ink);font-size:0.85rem;cursor:pointer;transition:all 0.2s}
.social-btn:hover{border-color:var(--accent)}
.social-btn .social-icon{font-size:1.2rem}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-header">
    <div class="login-icon">🍜</div>
    <div class="login-title">饭搭子匹配器</div>
    <div class="login-sub">找到你的专属饭搭子</div>
  </div>
  <div class="login-form">
    <div class="form-group">
      <label class="form-label">账号</label>
      <input type="text" class="form-input" placeholder="手机号 / 邮箱" id="account">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" class="form-input" placeholder="请输入密码" id="password">
    </div>
    <button class="btn-primary" onclick="handleLogin()">登 录</button>
    <div class="login-tip" id="loginTip" style="color:var(--like);display:none"></div>
    <div class="divider"><span class="divider-text">或</span></div>
    <div class="social-grid">
      <button class="social-btn" onclick="handleWechatLogin()"><span class="social-icon">💬</span> 微信登录</button>
      <button class="social-btn" onclick="handleQQLogin()"><span class="social-icon">🐧</span> QQ登录</button>
      <button class="social-btn" onclick="handleEmailLogin()"><span class="social-icon">📧</span> 邮箱登录</button>
      <button class="social-btn" onclick="handleCodeLogin()"><span class="social-icon">📱</span> 验证码登录</button>
    </div>
    <div style="text-align:center;margin-top:2rem">
      <span style="color:var(--muted);font-size:0.8rem">还没有账号？</span>
      <span style="color:var(--accent);font-size:0.8rem;margin-left:0.3rem;cursor:pointer" onclick="window.location.href='register.html'">立即注册</span>
    </div>
  </div>
</div>
<script src="../js/utils.js"></script>
<script>
function handleLogin(){
  const account=document.getElementById('account').value.trim();
  const password=document.getElementById('password').value;
  const tip=document.getElementById('loginTip');
  if(!account||!password){
    tip.textContent='请输入账号和密码';
    tip.style.display='block';
    return;
  }
  const result=login(account,password);
  if(!result.ok){
    tip.textContent=result.msg;
    tip.style.display='block';
    if(result.msg.includes('未注册')){
      setTimeout(function(){window.location.href='register.html';},1500);
    }
    return;
  }
  window.location.href='discover.html';
}
function handleQQLogin(){
  const tip=document.getElementById('loginTip');
  tip.textContent='正在跳转QQ登录...';
  tip.style.color='var(--accent)';
  tip.style.display='block';
  setTimeout(function(){
    const qqNicknames=['QQ用户小明','QQ用户阿杰','QQ用户小林','QQ用户大鹏'];
    const nickname=qqNicknames[Math.floor(Math.random()*qqNicknames.length)];
    localStorage.setItem('fandazi_token','qq_token');
    localStorage.setItem('fandazi_user',nickname);
    localStorage.setItem('fandazi_login_type','qq');
    window.location.href='discover.html';
  },1500);
}
function handleWechatLogin(){
  const tip=document.getElementById('loginTip');
  tip.textContent='正在跳转微信登录...';
  tip.style.color='var(--accent)';
  tip.style.display='block';
  setTimeout(function(){
    const wechatNicknames=['微信用户小红','微信用户小美','微信用户小华','微信用户小强'];
    const nickname=wechatNicknames[Math.floor(Math.random()*wechatNicknames.length)];
    localStorage.setItem('fandazi_token','wechat_token');
    localStorage.setItem('fandazi_user',nickname);
    localStorage.setItem('fandazi_login_type','wechat');
    window.location.href='discover.html';
  },1500);
}
function handleEmailLogin(){
  document.getElementById('account').placeholder='请输入邮箱';
  const tip=document.getElementById('loginTip');
  tip.textContent='提示：请输入注册时使用的邮箱';
  tip.style.color='var(--muted)';
  tip.style.display='block';
}
function handleCodeLogin(){
  const passwordField=document.getElementById('password');
  passwordField.type='text';
  passwordField.placeholder='请输入验证码';
  passwordField.value='';
  const tip=document.getElementById('loginTip');
  tip.textContent='验证码已发送至您的手机';
  tip.style.color='var(--accent)';
  tip.style.display='block';
}
</script>
</body>
</html>
