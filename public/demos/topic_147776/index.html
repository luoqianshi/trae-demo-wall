<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销售数据智能分析大屏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <div class="dashboard-container">
    <!-- 顶部标题栏 -->
    <div class="header">
      <div class="header-info">
        <span class="header-time" id="header-time">2026-07-14 00:00:00</span>
      </div>
      <div class="header-title">SALES INTELLIGENCE CENTER</div>
      <div class="header-info">
        <div class="header-status">
          <span class="status-dot"></span>
          <span>实时数据</span>
        </div>
      </div>
    </div>

    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-item active">全国总览</span>
    </div>

    <!-- KPI 指标卡片 -->
    <div class="kpi-row">
      <div class="kpi-card" id="kpi-amount">
        <div class="kpi-label">总销售额</div>
        <div class="kpi-value">¥0</div>
        <div class="kpi-trend up">
          <span>▲</span>
          <span>0% 同比</span>
        </div>
        <div class="kpi-progress">
          <div class="kpi-progress-bar" style="width: 100%"></div>
        </div>
      </div>
      <div class="kpi-card" id="kpi-orders">
        <div class="kpi-label">订单总量</div>
        <div class="kpi-value">0</div>
        <div class="kpi-trend up">
          <span>▲</span>
          <span>0% 同比</span>
        </div>
        <div class="kpi-progress">
          <div class="kpi-progress-bar" style="width: 100%"></div>
        </div>
      </div>
      <div class="kpi-card" id="kpi-customers">
        <div class="kpi-label">客户总数</div>
        <div class="kpi-value">0</div>
        <div class="kpi-trend up">
          <span>▲</span>
          <span>0% 同比</span>
        </div>
        <div class="kpi-progress">
          <div class="kpi-progress-bar" style="width: 100%"></div>
        </div>
      </div>
      <div class="kpi-card" id="kpi-avg">
        <div class="kpi-label">客单价</div>
        <div class="kpi-value">¥0</div>
        <div class="kpi-trend up">
          <span>▲</span>
          <span>0% 同比</span>
        </div>
        <div class="kpi-progress">
          <div class="kpi-progress-bar" style="width: 100%"></div>
        </div>
      </div>
    </div>

    <!-- 筛选器 -->
    <div class="filter-panel">
      <div class="filter-group">
        <span class="filter-label">年份：</span>
        <select class="filter-select" id="filter-year">
          <option value="">全部年份</option>
          <option value="2024">2024年</option>
          <option value="2025">2025年</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">品类：</span>
        <select class="filter-select" id="filter-category">
          <option value="">全部品类</option>
          <option value="电子设备">电子设备</option>
          <option value="智能穿戴">智能穿戴</option>
          <option value="云服务">云服务</option>
          <option value="软件服务">软件服务</option>
          <option value="网络设备">网络设备</option>
          <option value="安防设备">安防设备</option>
          <option value="显示设备">显示设备</option>
          <option value="办公设备">办公设备</option>
        </select>
      </div>
      <button class="btn-reset" id="btn-reset">重置视图</button>
    </div>

    <!-- 图表区域 -->
    <div class="charts-grid">
      <div class="chart-panel">
        <div class="chart-title">销售趋势分析</div>
        <div class="chart-container" id="chart-time-trend"></div>
      </div>
      <div class="chart-panel">
        <div class="chart-title">地区销售分布</div>
        <div class="chart-container" id="chart-region-map"></div>
      </div>
      <div class="chart-panel">
        <div class="chart-title">销售员业绩排行</div>
        <div class="chart-container" id="chart-sales-rank"></div>
      </div>
      <div class="chart-panel">
        <div class="chart-title">客户分析</div>
        <div class="chart-container" id="chart-customer"></div>
      </div>
      <div class="chart-panel">
        <div class="chart-title">商品分析</div>
        <div class="chart-container" id="chart-product"></div>
      </div>
      <div class="chart-panel">
        <div class="chart-title">行业分布</div>
        <div class="chart-container" id="chart-industry"></div>
      </div>
    </div>

    <!-- 详细数据列表 -->
    <div class="data-table-panel">
      <div class="table-header">
        <div class="chart-title">销售明细数据</div>
        <div class="table-controls">
          <button class="btn-column-toggle" id="btn-column-toggle">列设置</button>
          <div class="column-dropdown" id="column-dropdown"></div>
        </div>
      </div>
      <div class="table-container">
        <table class="data-table" id="data-table">
          <thead>
            <tr id="table-header-row"></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/linkage.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/table.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
