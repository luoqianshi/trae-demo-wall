<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手语识别 - Sign Language Recognition</title>
    <style>
/* === main.css === */
:root {
    --color-primary: #3b82f6;
    --color-primary-hover: #2563eb;
    --color-primary-light: #dbeafe;
    --color-danger: #ef4444;
    --color-danger-hover: #dc2626;
    --color-danger-light: #fee2e2;
    --color-success: #22c55e;
    --color-success-hover: #16a34a;
    --color-warning: #f59e0b;
    --color-warning-light: #fef3c7;
    --color-bg: #0f172a;
    --color-surface: #1e293b;
    --color-surface-hover: #334155;
    --color-border: #334155;
    --color-text: #f8fafc;
    --color-text-secondary: #94a3b8;
    --color-text-muted: #64748b;
    --radius: 12px;
    --radius-sm: 6px;
    --radius-lg: 16px;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -1px rgba(0,0,0,0.2);
    --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.3), 0 4px 6px -2px rgba(0,0,0,0.2);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.3), 0 10px 10px -5px rgba(0,0,0,0.2);
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;
    background: linear-gradient(135deg, var(--color-bg) 0%, #1e1b4b 50%, var(--color-bg) 100%);
    color: var(--color-text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%), radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
}

.app-header {
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--color-border);
    padding: 20px 24px;
    text-align: center;
    position: relative;
    z-index: 100;
}

.app-header h1 {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--color-primary) 0%, #8b5cf6 50%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientText 3s ease infinite;
    background-size: 200% 200%;
}

@keyframes gradientText {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.app-header .subtitle {
    font-size: 0.9rem;
    color: var(--color-text-secondary);
    margin-top: 6px;
    letter-spacing: 0.5px;
}

.app-main {
    flex: 1;
    display: flex;
    gap: 24px;
    padding: 24px;
    max-width: 1500px;
    width: 100%;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}

.video-section {
    flex: 0 0 720px;
    max-width: 55%;
}

.panel-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    background: var(--color-surface);
    color: var(--color-text);
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    position: relative;
    overflow: hidden;
}

.btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left var(--transition);
}

.btn:hover::before {
    left: 100%;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.btn:active {
    transform: translateY(0);
}

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.btn-primary {
    background: linear-gradient(135deg, var(--color-primary) 0%, #2563eb 100%);
    color: #fff;
}

.btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--color-primary-hover) 0%, #1d4ed8 100%);
    box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
}

.btn-danger {
    background: linear-gradient(135deg, var(--color-danger) 0%, #dc2626 100%);
    color: #fff;
}

.btn-danger:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--color-danger-hover) 0%, #b91c1c 100%);
    box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
}

.btn-secondary {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
}

.btn-secondary:hover {
    background: var(--color-surface-hover);
    border-color: var(--color-primary);
}

.btn-sm {
    padding: 6px 14px;
    font-size: 0.8rem;
}

.btn-mode {
    padding: 8px 16px;
    font-size: 0.85rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border);
}

.btn-mode.active {
    background: linear-gradient(135deg, var(--color-primary) 0%, #8b5cf6 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

.btn-group {
    display: flex;
    gap: 8px;
}

@media (max-width: 1024px) {
    .app-main {
        flex-direction: column;
        padding: 16px;
        gap: 16px;
    }
    .video-section {
        flex: none;
        max-width: 100%;
    }
}

@media (max-width: 640px) {
    .app-header h1 {
        font-size: 1.5rem;
    }
    .app-main {
        padding: 12px;
    }
}
/* === video.css === */
.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #020617;
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--color-border);
}

#video-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1);
}

#landmark-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    transform: scaleX(-1);
}

.video-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: var(--color-text-muted);
    font-size: 1rem;
    z-index: 1;
    gap: 12px;
}

.video-placeholder::before {
    content: '';
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(59, 130, 246, 0.1);
    border: 2px dashed var(--color-border);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulseBorder 2s ease-in-out infinite;
}

.video-placeholder::after {
    content: '🎥';
    position: absolute;
    font-size: 2rem;
}

@keyframes pulseBorder {
    0%, 100% { border-color: var(--color-border); opacity: 1; }
    50% { border-color: var(--color-primary); opacity: 0.6; }
}

.video-placeholder.hidden {
    display: none;
}
/* === results.css === */
.results-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(20px);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    min-height: 0;
}

.results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-border);
}

.results-header h2 {
    font-size: 1.1rem;
    font-weight: 600;
}

.results-actions {
    display: flex;
    gap: 8px;
}

.results-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    min-height: 120px;
    max-height: 450px;
}

.results-list::-webkit-scrollbar {
    width: 6px;
}

.results-list::-webkit-scrollbar-track {
    background: var(--color-surface);
    border-radius: 3px;
}

.results-list::-webkit-scrollbar-thumb {
    background: var(--color-border);
    border-radius: 3px;
}

.results-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 150px;
    color: var(--color-text-muted);
    font-size: 0.9rem;
}

.result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    margin-bottom: 8px;
    border-radius: var(--radius);
    background: var(--color-surface);
    font-size: 0.9rem;
    animation: slideIn 0.3s ease;
}

.result-item.low-confidence {
    border-left: 3px solid var(--color-warning);
    background: rgba(245, 158, 11, 0.05);
}

.result-text {
    font-weight: 600;
    font-size: 1rem;
}

.result-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--color-text-secondary);
    font-size: 0.8rem;
}

.result-confidence {
    font-variant-numeric: tabular-nums;
    background: rgba(59, 130, 246, 0.1);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    color: var(--color-primary);
}

.result-candidates {
    font-size: 0.75rem;
    color: var(--color-warning);
}

.result-delete {
    background: none;
    border: none;
    color: var(--color-text-muted);
    cursor: pointer;
    padding: 4px 8px;
    font-size: 0.85rem;
    border-radius: var(--radius-sm);
}

.result-delete:hover {
    background: var(--color-danger);
    color: #fff;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}
/* === controls.css === */
.controls-panel {
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(20px);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow);
}

.control-group {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--color-border);
}

.control-group:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
}

.control-group > label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--color-text-secondary);
    min-width: 90px;
    white-space: nowrap;
}

.mode-switch {
    display: flex;
    gap: 6px;
    flex: 1;
}

.toggle-wrapper {
    position: relative;
    flex: 1;
}

.toggle-wrapper input[type=checkbox] {
    display: none;
}

.toggle-label {
    display: block;
    width: 50px;
    height: 28px;
    background: var(--color-surface-hover);
    border-radius: 14px;
    cursor: pointer;
    position: relative;
    transition: all var(--transition);
}

.toggle-label::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    background: var(--color-text-muted);
    border-radius: 50%;
    transition: all var(--transition);
}

.toggle-wrapper input:checked + .toggle-label {
    background: linear-gradient(135deg, var(--color-primary) 0%, #8b5cf6 100%);
}

.toggle-wrapper input:checked + .toggle-label::after {
    transform: translateX(22px);
    background: #fff;
}

input[type=range] {
    flex: 1;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--color-surface-hover);
    border-radius: 3px;
    outline: none;
}

input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    background: var(--color-primary);
    border-radius: 50%;
    cursor: pointer;
}

input[type=range]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    background: var(--color-primary);
    border-radius: 50%;
    cursor: pointer;
    border: none;
}
/* === status.css === */
.status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--color-border);
    font-size: 0.85rem;
    color: var(--color-text-secondary);
    position: relative;
    z-index: 100;
}

.status-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--color-text-muted);
    flex-shrink: 0;
}

.status-indicator.active {
    background: var(--color-success);
    animation: pulseStatus 1.5s ease-in-out infinite;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
}

.status-indicator.error {
    background: var(--color-danger);
    animation: pulseStatus 0.5s ease-in-out infinite;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
}

.status-indicator.warning {
    background: var(--color-warning);
    animation: pulseStatus 1s ease-in-out infinite;
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
}

.status-text {
    flex-shrink: 0;
    font-weight: 500;
}

.model-progress {
    font-size: 0.8rem;
    color: var(--color-primary);
    animation: pulseStatus 1.5s ease-in-out infinite;
}

.btn-retry-model {
    font-size: 0.75rem;
    padding: 4px 12px;
    background: linear-gradient(135deg, var(--color-warning) 0%, #d97706 100%);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
}

.backend-notice {
    font-size: 0.75rem;
    color: var(--color-warning);
    background: rgba(245, 158, 11, 0.1);
    padding: 3px 10px;
    border-radius: var(--radius-sm);
}

.status-debug {
    font-family: monospace;
    font-size: 0.75rem;
    color: var(--color-text-muted);
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

@keyframes pulseStatus {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.95); }
}

    </style>
</head>
<body>
    <header class="app-header">
        <h1>手语识别</h1>
        <p class="subtitle">实时手语识别与语音输出</p>
    </header>

    <main class="app-main">
        <section class="video-section">
            <div class="video-container">
                <video id="video-preview" autoplay playsinline></video>
                <canvas id="landmark-canvas"></canvas>
                <div class="video-placeholder" id="video-placeholder">
                    <span>点击"开始识别"启用摄像头</span>
                </div>
            </div>
        </section>

        <section class="panel-section">
            <div class="controls-panel">
                <div class="control-group">
                    <button id="btn-start" class="btn btn-primary">开始识别</button>
                    <button id="btn-stop" class="btn btn-danger" disabled>停止识别</button>
                </div>

                <div class="control-group">
                    <label>识别模式</label>
                    <div class="mode-switch">
                        <button id="btn-mode-letter" class="btn btn-mode active">字母模式</button>
                        <button id="btn-mode-word" class="btn btn-mode">词汇模式</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>语音输出</label>
                    <div class="toggle-wrapper">
                        <input type="checkbox" id="toggle-speech" checked>
                        <label for="toggle-speech" class="toggle-label"></label>
                    </div>
                </div>

                <div class="control-group">
                    <label>语速 <span id="rate-value">1.0</span></label>
                    <input type="range" id="slider-rate" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>

                <div class="control-group">
                    <label>音量 <span id="volume-value">80</span></label>
                    <input type="range" id="slider-volume" min="0" max="100" step="5" value="80">
                </div>

                <div class="control-group">
                    <label>置信度阈值 <span id="threshold-value">0.6</span></label>
                    <input type="range" id="slider-threshold" min="0.3" max="1.0" step="0.05" value="0.6">
                </div>

                <div class="control-group">
                    <button id="btn-debug" class="btn btn-secondary">调试模式</button>
                </div>
            </div>

            <div class="results-panel">
                <div class="results-header">
                    <h2>识别结果</h2>
                    <div class="results-actions">
                        <button id="btn-copy" class="btn btn-sm">复制</button>
                        <button id="btn-export" class="btn btn-sm">导出</button>
                        <button id="btn-clear" class="btn btn-sm btn-danger">清除</button>
                    </div>
                </div>
                <div class="results-list" id="results-list">
                    <div class="results-empty">暂无识别结果</div>
                </div>
                <button id="btn-load-more" class="btn btn-secondary" style="display:none;">加载更多</button>
            </div>
        </section>
    </main>

    <footer class="status-bar" id="status-bar">
        <span class="status-indicator" id="status-indicator"></span>
        <span class="status-text" id="status-text">就绪</span>
        <span class="model-progress" id="model-progress" style="display:none;"></span>
        <button class="btn btn-sm btn-retry-model" id="btn-retry-model" style="display:none;">重新加载</button>
        <span class="backend-notice" id="backend-notice" style="display:none;"></span>
        <span class="status-debug" id="status-debug" style="display:none;"></span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js" crossorigin="anonymous"></script>

const Utils = (() => {
    function preprocessFeatures(points) {
        if (!points || points.length === 0) return new Float32Array(63);
        const wrist = points[0];
        const vector = new Float32Array(63);
        for (let i = 0; i < 21; i++) {
            vector[i * 3] = points[i].x - wrist.x;
            vector[i * 3 + 1] = points[i].y - wrist.y;
            vector[i * 3 + 2] = points[i].z - wrist.z;
        }
        let norm = 0;
        for (let i = 0; i < 63; i++) norm += vector[i] * vector[i];
        norm = Math.sqrt(norm);
        if (norm > 0) {
            for (let i = 0; i < 63; i++) vector[i] /= norm;
        }
        return vector;
    }

    function computeLandmarkOffset(a, b) {
        if (!a || !b || a.length !== b.length) return Infinity;
        let totalOffset = 0;
        for (let i = 0; i < a.length; i++) {
            const dx = a[i].x - b[i].x;
            const dy = a[i].y - b[i].y;
            const dz = a[i].z - b[i].z;
            totalOffset += Math.sqrt(dx * dx + dy * dy + dz * dz);
        }
        return totalOffset / a.length;
    }

    function formatTimeDisplay(date) {
        return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    return { preprocessFeatures, computeLandmarkOffset, formatTimeDisplay };
})();

const UserConfig = (() => {
    const STORAGE_KEY = 'sign-language-config';
    const DEFAULT_CONFIG = {
        recognitionMode: 'letter',

        speechRate: 1.0,

    };

    let config = { ...DEFAULT_CONFIG };

    function loadFromStorage() {

            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                const parsed = JSON.parse(stored);
                config = { ...DEFAULT_CONFIG, ...parsed };
            }
        } catch (e) {
            config = { ...DEFAULT_CONFIG };
        }
    }

    function saveToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        } catch (e) {
            console.error('Failed to save config:', e);
        }
    }

    loadFromStorage();

    function getConfig() { return { ...config }; }

    function updateConfig(partial) {
        config = { ...config, ...partial };

    }

    function onConfigChange(callback) {
        changeCallbacks.push(callback);
        return () => { changeCallbacks = changeCallbacks.filter(cb => cb !== callback); };
    }

    return { getConfig, updateConfig, onConfigChange };
})();

// === 摄像头管理模块 ===
const CameraManager = (() => {
    const CameraState = { IDLE: 'IDLE', REQUESTING: 'REQUESTING', ACTIVE: 'ACTIVE', PAUSED: 'PAUSED', ERROR: 'ERROR' };
    let state = CameraState.IDLE;
    let stream = null;
    let stateChangeCallbacks = [];
    let trackEndedHandler = null;

    function setState(newState) {
        if (state === newState) return;
        state = newState;
        stateChangeCallbacks.forEach(cb => cb(state));
    }

    function getState() { return state; }
    function getVideoStream() { return stream; }

    async function requestCamera() {
        if (state === CameraState.ACTIVE) return stream;
        setState(CameraState.REQUESTING);
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
            });
            const videoTrack = stream.getVideoTracks()[0];
            if (videoTrack) {
                trackEndedHandler = () => { setState(CameraState.PAUSED); };
                videoTrack.addEventListener('ended', trackEndedHandler);
            }
            setState(CameraState.ACTIVE);
            return stream;
        } catch (err) {
            stream = null;
            setState(CameraState.ERROR);
            if (err.name === 'NotAllowedError') throw new Error('摄像头权限被拒绝，请在浏览器设置中允许摄像头访问');
            else if (err.name === 'NotFoundError') throw new Error('未检测到摄像头设备，请检查设备连接');
            else if (err.name === 'NotReadableError') throw new Error('摄像头被其他应用占用，请关闭其他使用摄像头的应用');
            throw new Error('摄像头启动失败：' + err.message);
        }
    }

    function stopCamera() {
        if (stream) {
            const videoTrack = stream.getVideoTracks()[0];
            if (videoTrack && trackEndedHandler) videoTrack.removeEventListener('ended', trackEndedHandler);
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        setState(CameraState.IDLE);
    }

    function onStateChange(callback) {
        stateChangeCallbacks.push(callback);
        return () => { stateChangeCallbacks = stateChangeCallbacks.filter(cb => cb !== callback); };
    }

    return { getState, getVideoStream, requestCamera, stopCamera, onStateChange };
})();

// === 手部检测模块 ===
const HandDetector = (() => {
    let hands = null;
    let detecting = false;
    let animFrameId = null;
    let resultsCallbacks = [];
    let errorCallbacks = [];
    let performanceMode = false;
    let noHandFrames = 0;
    let lastFrameTime = 0;
    let frameRate = 0;

    async function initialize() {
        try {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.5
            });
            hands.onResults(onHandResults);
            await hands.initialize();
        } catch (err) {
            const error = new Error('手部检测模型加载失败，请刷新页面重试');
            errorCallbacks.forEach(cb => cb(error));
            throw error;
        }
    }

    function onHandResults(results) {
        const now = performance.now();
        if (lastFrameTime > 0) {
            const delta = now - lastFrameTime;
            frameRate = 1000 / delta;
            if (frameRate < 10 && !performanceMode) performanceMode = true;
            else if (frameRate > 15 && performanceMode) performanceMode = false;
        }
        lastFrameTime = now;
        const landmarks = [];
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            noHandFrames = 0;
            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const handedness = results.multiHandedness && results.multiHandedness[i]
                    ? results.multiHandedness[i].label : (i === 0 ? 'Right' : 'Left');
                landmarks.push({
                    handedness: handedness === 'Left' ? 'Right' : 'Left',
                    points: results.multiHandLandmarks[i].map(p => ({ x: p.x, y: p.y, z: p.z }))
                });
            }
        } else {
            noHandFrames++;
        }
        const detectionResult = {
            landmarks, noHandDetected: noHandFrames >= 3,
            frameRate: Math.round(frameRate), performanceMode, timestamp: now
        };
        resultsCallbacks.forEach(cb => cb(detectionResult));
    }

    function startDetection(videoElement) {
        if (!hands) throw new Error('手部检测模块未初始化');
        detecting = true;
        async function detect() {
            if (!detecting) return;
            try {
                if (videoElement.readyState >= 2) await hands.send({ image: videoElement });
            } catch (err) { console.error('Detection error:', err); }
            animFrameId = requestAnimationFrame(detect);
        }
        detect();
    }

    function stopDetection() {
        detecting = false;
        if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
        noHandFrames = 0; lastFrameTime = 0; frameRate = 0;
    }

    function onResults(callback) {
        resultsCallbacks.push(callback);
        return () => { resultsCallbacks = resultsCallbacks.filter(cb => cb !== callback); };
    }

    function onError(callback) {
        errorCallbacks.push(callback);
        return () => { errorCallbacks = errorCallbacks.filter(cb => cb !== callback); };
    }

    function getPerformanceMode() { return performanceMode; }

    return { initialize, startDetection, stopDetection, onResults, onError, getPerformanceMode };
})();

// === 模型管理模块（使用嵌入数据） ===
const ModelManager = (() => {
    const ModelLoadState = { NOT_LOADED: 'NOT_LOADED', LOADING: 'LOADING', READY: 'READY', ERROR: 'ERROR' };
    let modelStatus = { state: ModelLoadState.NOT_LOADED, activeMode: 'letter', backend: 'webgl', errorMessage: null, modelVersion: null };
    let letterModel = null;
    let wordModel = null;
    let statusChangeCallbacks = [];
    let progressCallbacks = [];

    function notifyStatusChange() { statusChangeCallbacks.forEach(cb => cb({ ...modelStatus })); }
    function notifyProgress(stage, percentage, message) { progressCallbacks.forEach(cb => cb({ stage, percentage, message })); }

    function createEmbeddedIOHandler(mode) {
        const modelJson = mode === 'letter' ? EMBEDDED_LETTER_MODEL : EMBEDDED_WORD_MODEL;
        const weightsB64 = mode === 'letter' ? EMBEDDED_LETTER_WEIGHTS_B64 : EMBEDDED_WORD_WEIGHTS_B64;
        const binaryStr = atob(weightsB64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        return {
            save: async () => { throw new Error('Not implemented'); },
            load: async () => ({
                modelTopology: modelJson.modelTopology,
                weightSpecs: modelJson.weightsManifest[0].weights,
                weightData: bytes.buffer,
                format: 'layers-model',
                generatedBy: 'TensorFlow.js tfjs-layers v4.17.0',
                convertedBy: null
            })
        };
    }

    async function initBackend() {
        const tf = window.tf;
        if (!tf) throw new Error('TensorFlow.js 未加载');
        const config = UserConfig.getConfig();
        const preferred = config.preferredBackend || 'webgl';
        notifyProgress('backend_init', 10, '正在初始化推理后端...');
        try {
            await tf.setBackend(preferred);
            await tf.ready();
            modelStatus.backend = preferred;
            return;
        } catch (e) { console.warn(`Backend ${preferred} failed, trying fallback:`, e); }
        const fallback = preferred === 'webgl' ? 'wasm' : 'webgl';
        try {
            await tf.setBackend(fallback);
            await tf.ready();
            modelStatus.backend = fallback;
            notifyProgress('backend_init', 15, `推理后端已降级为 ${fallback.toUpperCase()}`);
        } catch (e2) {
            modelStatus.state = ModelLoadState.ERROR;
            modelStatus.errorMessage = '推理后端不可用';
            notifyStatusChange();
            throw new Error('推理后端不可用，WebGL和WASM均初始化失败');
        }
    }

    async function loadModel(mode) {
        const tf = window.tf;
        if (!tf) {
            modelStatus.state = ModelLoadState.ERROR;
            modelStatus.errorMessage = 'TensorFlow.js 未加载';
            notifyStatusChange();
            throw new Error('TensorFlow.js 未加载');
        }
        modelStatus.state = ModelLoadState.LOADING;
        modelStatus.activeMode = mode;
        modelStatus.errorMessage = null;
        notifyStatusChange();
        try {
            if (modelStatus.state === ModelLoadState.NOT_LOADED || !letterModel && !wordModel) await initBackend();
            notifyProgress('downloading', 30, '正在加载模型...');
            const handler = createEmbeddedIOHandler(mode);
            const model = await tf.loadLayersModel(handler);
            if (mode === 'letter') { if (letterModel) letterModel.dispose(); letterModel = model; }
            else { if (wordModel) wordModel.dispose(); wordModel = model; }
            notifyProgress('warming_up', 80, '正在预热模型...');
            const warmupInput = tf.zeros([1, 63]);
            const warmupOutput = model.predict(warmupInput);
            warmupInput.dispose();
            warmupOutput.dispose();
            modelStatus.state = ModelLoadState.READY;
            modelStatus.errorMessage = null;
            notifyProgress('warming_up', 100, '模型加载完成');
            notifyStatusChange();
        } catch (err) {
            modelStatus.state = ModelLoadState.ERROR;
            modelStatus.errorMessage = err.message || '模型加载失败';
            notifyStatusChange();
            throw err;
        }
    }

    function predict(features) {
        const tf = window.tf;
        if (!tf || modelStatus.state !== ModelLoadState.READY) return null;
        const model = modelStatus.activeMode === 'letter' ? letterModel : wordModel;
        if (!model) return null;
        try {
            const startTime = performance.now();
            const result = tf.tidy(() => {
                const inputTensor = tf.tensor2d(features, [1, 63]);
                const output = model.predict(inputTensor);
                const probabilities = output.dataSync();
                return new Float32Array(probabilities);
            });
            const inferenceTime = performance.now() - startTime;
            const topCandidates = getTopCandidates(result, 3);
            return { probabilities: result, topCandidates, inferenceTime: Math.round(inferenceTime * 100) / 100 };
        } catch (err) { console.error('Inference error:', err); return null; }
    }

    function getTopCandidates(probabilities, k) {
        const indices = Array.from(probabilities.keys());
        indices.sort((a, b) => probabilities[b] - probabilities[a]);
        const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const WORDS = ['你好', '谢谢', '是的', '不是', '请', '对不起'];
        const labels = modelStatus.activeMode === 'letter' ? LETTERS.split('') : WORDS;
        return indices.slice(0, k).map(i => ({ label: labels[i] || `Class_${i}`, probability: probabilities[i] }));
    }

    async function switchModel(mode) {
        if (modelStatus.activeMode === mode && modelStatus.state === ModelLoadState.READY) return;
        const otherMode = mode === 'letter' ? 'word' : 'letter';
        const otherModel = otherMode === 'letter' ? letterModel : wordModel;
        if (otherModel) {
            otherModel.dispose();
            if (otherMode === 'letter') letterModel = null; else wordModel = null;
        }
        await loadModel(mode);
    }

    function disposeModels() {
        if (letterModel) { letterModel.dispose(); letterModel = null; }
        if (wordModel) { wordModel.dispose(); wordModel = null; }
        modelStatus.state = ModelLoadState.NOT_LOADED;
        modelStatus.errorMessage = null;
        notifyStatusChange();
    }

    function getModelStatus() { return { ...modelStatus }; }
    function isReady() { return modelStatus.state === ModelLoadState.READY; }
    function getActiveBackend() { return modelStatus.backend; }

    function onStatusChange(callback) {
        statusChangeCallbacks.push(callback);
        return () => { statusChangeCallbacks = statusChangeCallbacks.filter(cb => cb !== callback); };
    }

    function onProgress(callback) {
        progressCallbacks.push(callback);
        return () => { progressCallbacks = progressCallbacks.filter(cb => cb !== callback); };
    }

    return { loadModel, predict, switchModel, disposeModels, getModelStatus, isReady, getActiveBackend, onStatusChange, onProgress };
})();

// === 模板管理模块（使用嵌入数据） ===
const SignTemplates = (() => {
    let letterTemplates = [];
    let wordTemplates = [];

    function normalizePoints(points) {
        if (!points || points.length === 0) return [];
        const wrist = points[0];
        return points.map(p => ({ x: p.x - wrist.x, y: p.y - wrist.y, z: p.z - wrist.z }));
    }

    function computeDistanceVector(points) {
        const normalized = normalizePoints(points);
        const distances = [];
        for (let i = 0; i < normalized.length; i++) {
            for (let j = i + 1; j < normalized.length; j++) {
                const dx = normalized[i].x - normalized[j].x;
                const dy = normalized[i].y - normalized[j].y;
                const dz = normalized[i].z - normalized[j].z;
                distances.push(Math.sqrt(dx * dx + dy * dy + dz * dz));
            }
        }
        const maxDist = Math.max(...distances, 0.001);
        return distances.map(d => d / maxDist);
    }

    function loadTemplates() {
        try {
            letterTemplates = EMBEDDED_LETTER_TEMPLATES.map(t => ({
                ...t, distanceVector: computeDistanceVector(t.referencePoints)
            }));
        } catch (e) { console.error('Failed to load letter templates:', e); }
        try {
            wordTemplates = EMBEDDED_WORD_TEMPLATES.map(t => ({
                ...t, keyFrames: t.keyFrames.map(kf => ({
                    ...kf, distanceVector: computeDistanceVector(kf.referencePoints)
                }))
            }));
        } catch (e) { console.error('Failed to load word templates:', e); }
    }

    function getLetterTemplates() { return letterTemplates; }
    function getWordTemplates() { return wordTemplates; }

    return { loadTemplates, getLetterTemplates, getWordTemplates };
})();

// === 手语识别模块 ===
const SignRecognizer = (() => {
    let mode = 'letter';
    let confidenceThreshold = 0.6;
    let useModelInference = false;
    let stableFrameCount = 0;
    let lastLandmarks = null;
    let stableLandmarks = [];
    const STABILITY_THRESHOLD = 0.03;
    const LETTER_STABLE_MS = 500;
    const WORD_STABLE_MS = 800;
    let lastRecognizeTime = 0;
    const RECOGNIZE_COOLDOWN_MS = 800;

    function setMode(newMode) { mode = newMode; resetStability(); }
    function setConfidenceThreshold(threshold) { confidenceThreshold = threshold; }
    function resetStability() { stableFrameCount = 0; lastLandmarks = null; stableLandmarks = []; }
    function isReady() { return true; }
    function setUseModelInference(value) { useModelInference = value; }
    function isUsingModel() { return useModelInference && ModelManager.isReady(); }

    function processLandmarks(landmarks) {
        if (!landmarks || landmarks.length === 0) return null;
        const now = Date.now();
        if (now - lastRecognizeTime < RECOGNIZE_COOLDOWN_MS) return null;
        const hand = landmarks[0];
        const points = hand.points;
        const missingPoints = points.filter(p => p.x === 0 && p.y === 0 && p.z === 0).length;
        if (missingPoints > 5) return { text: '', confidence: 0, mode, isLowConfidence: true, candidates: [], timestamp: new Date().toISOString(), status: 'occluded' };
        if (lastLandmarks) {
            const offset = Utils.computeLandmarkOffset(points, lastLandmarks);
            if (offset < STABILITY_THRESHOLD) { stableFrameCount++; stableLandmarks.push(points); }
            else { stableFrameCount = 0; stableLandmarks = [points]; }
        } else { stableLandmarks = [points]; stableFrameCount = 1; }
        lastLandmarks = points.map(p => ({ ...p }));
        const stableMs = stableFrameCount * (1000 / 30);
        const requiredMs = mode === 'letter' ? LETTER_STABLE_MS : WORD_STABLE_MS;
        if (stableMs < requiredMs) return null;
        const avgPoints = averagePoints(stableLandmarks);
        if (useModelInference && ModelManager.isReady()) return processWithModel(avgPoints, now);
        else return processWithTemplates(avgPoints, now);
    }

    function processWithModel(avgPoints, now) {
        const features = Utils.preprocessFeatures(avgPoints);
        let inferenceResult;
        try { inferenceResult = ModelManager.predict(features); } catch (err) { resetStability(); return null; }
        if (!inferenceResult || !inferenceResult.topCandidates || inferenceResult.topCandidates.length === 0) { resetStability(); return processWithTemplates(avgPoints, now); }
        const best = inferenceResult.topCandidates[0];
        const confidence = best.probability;
        lastRecognizeTime = now; resetStability();
        if (confidence < 0.3) return { text: '', confidence: Math.round(confidence * 100) / 100, mode, isLowConfidence: true, candidates: [], timestamp: new Date().toISOString(), status: 'unclear', inferenceTime: inferenceResult.inferenceTime };
        const isLow = confidence < confidenceThreshold;
        const candidates = isLow ? inferenceResult.topCandidates.slice(0, 3).map(c => ({ text: c.label, confidence: Math.round(c.probability * 100) / 100 })) : [];
        return { text: best.label, confidence: Math.round(confidence * 100) / 100, mode, isLowConfidence: isLow, candidates, timestamp: new Date().toISOString(), inferenceTime: inferenceResult.inferenceTime };
    }

    function processWithTemplates(avgPoints, now) {
        const templates = mode === 'letter' ? SignTemplates.getLetterTemplates() : SignTemplates.getWordTemplates();
        if (templates.length === 0) { resetStability(); return null; }
        const inputVector = computeTemplateDistanceVector(avgPoints);
        const scores = templates.map(t => {
            const templateVector = mode === 'letter' ? t.distanceVector : t.keyFrames[0].distanceVector;
            const similarity = cosineSimilarity(inputVector, templateVector);
            return { text: mode === 'letter' ? t.label : t.text, confidence: similarity, id: t.id };
        });
        scores.sort((a, b) => b.confidence - a.confidence);
        const best = scores[0];
        lastRecognizeTime = now; resetStability();
        if (best.confidence < 0.3) return { text: '', confidence: best.confidence, mode, isLowConfidence: true, candidates: [], timestamp: new Date().toISOString(), status: 'unclear' };
        const isLow = best.confidence < confidenceThreshold;
        const candidates = isLow ? scores.slice(0, 3).map(s => ({ text: s.text, confidence: Math.round(s.confidence * 100) / 100 })) : [];
        return { text: best.text, confidence: Math.round(best.confidence * 100) / 100, mode, isLowConfidence: isLow, candidates, timestamp: new Date().toISOString() };
    }

    function computeTemplateDistanceVector(points) {
        const wrist = points[0];
        const normalized = points.map(p => ({ x: p.x - wrist.x, y: p.y - wrist.y, z: p.z - wrist.z }));
        const distances = [];
        for (let i = 0; i < normalized.length; i++) {
            for (let j = i + 1; j < normalized.length; j++) {
                const dx = normalized[i].x - normalized[j].x;
                const dy = normalized[i].y - normalized[j].y;
                const dz = normalized[i].z - normalized[j].z;
                distances.push(Math.sqrt(dx * dx + dy * dy + dz * dz));
            }
        }
        const maxDist = Math.max(...distances, 0.001);
        return distances.map(d => d / maxDist);
    }

    function cosineSimilarity(a, b) {
        if (a.length !== b.length || a.length === 0) return 0;
        let dotProduct = 0, normA = 0, normB = 0;
        for (let i = 0; i < a.length; i++) { dotProduct += a[i] * b[i]; normA += a[i] * a[i]; normB += b[i] * b[i]; }
        if (normA === 0 || normB === 0) return 0;
        return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    function averagePoints(pointSets) {
        if (pointSets.length === 0) return [];
        if (pointSets.length === 1) return pointSets[0];
        const count = pointSets.length;
        const result = [];
        for (let i = 0; i < 21; i++) {
            let sx = 0, sy = 0, sz = 0;
            for (const ps of pointSets) { sx += ps[i].x; sy += ps[i].y; sz += ps[i].z; }
            result.push({ x: sx / count, y: sy / count, z: sz / count });
        }
        return result;
    }

    return { setMode, setConfidenceThreshold, resetStability, isReady, setUseModelInference, isUsingModel, processLandmarks };
})();

// === 语音合成模块 ===
const SpeechSynthesizer = (() => {
    let enabled = true;
    let rate = 1.0;
    let volume = 80;
    let errorCallbacks = [];
    let pendingText = null;
    let blocked = false;

    function isAvailable() { return typeof window !== 'undefined' && 'speechSynthesis' in window; }

    function speak(text) {
        if (!enabled || !isAvailable()) return;
        if (blocked) { pendingText = text; return; }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = rate;
        utterance.volume = volume / 100;
        let started = false;
        const timeoutId = setTimeout(() => {
            if (!started) {
                window.speechSynthesis.cancel();
                errorCallbacks.forEach(cb => cb({ type: 'TIMEOUT', message: '语音合成超时，请稍后重试' }));
            }
        }, 5000);
        utterance.onstart = () => { started = true; clearTimeout(timeoutId); };
        utterance.onerror = (e) => {
            clearTimeout(timeoutId);
            if (e.error === 'not-allowed' || e.error === 'interrupted') {
                blocked = true; pendingText = text;
                errorCallbacks.forEach(cb => cb({ type: 'BLOCKED', message: '请点击页面以启用语音播放' }));
            }
        };
        utterance.onend = () => { clearTimeout(timeoutId); };
        try { window.speechSynthesis.speak(utterance); } catch (e) { clearTimeout(timeoutId); blocked = true; pendingText = text; }
    }

    function stop() { if (isAvailable()) window.speechSynthesis.cancel(); }
    function setEnabled(value) { enabled = value; if (!enabled) stop(); }
    function setRate(value) { rate = Math.max(0.5, Math.min(2.0, value)); }
    function setVolume(value) { volume = Math.max(0, Math.min(100, value)); }

    function onError(callback) {
        errorCallbacks.push(callback);
        return () => { errorCallbacks = errorCallbacks.filter(cb => cb !== callback); };
    }

    function tryPlayPending() {
        if (blocked && pendingText) { blocked = false; const text = pendingText; pendingText = null; speak(text); }
    }

    return { isAvailable, speak, stop, setEnabled, setRate, setVolume, onError, tryPlayPending };
})();

// === 结果管理模块 ===
const ResultManager = (() => {
    let results = [];
    let changeCallbacks = [];
    const MAX_VISIBLE = 500;

    function addResult(result) {
        if (!result || !result.text) return;
        results.push(result);
        changeCallbacks.forEach(cb => cb(results));
    }

    function removeResult(index) {
        if (index >= 0 && index < results.length) { results.splice(index, 1); changeCallbacks.forEach(cb => cb(results)); }
    }

    function clearResults() { results = []; changeCallbacks.forEach(cb => cb(results)); }
    function getResults() { return results.slice(-MAX_VISIBLE); }
    function getAllResults() { return [...results]; }

    async function copyResults() {
        const text = results.map(r => r.text).join(' ');
        try { await navigator.clipboard.writeText(text); return true; } catch (e) {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text; textarea.style.position = 'fixed'; textarea.style.left = '-9999px';
                document.body.appendChild(textarea); textarea.select(); document.execCommand('copy');
                document.body.removeChild(textarea); return true;
            } catch (e2) { return false; }
        }
    }

    function exportResults() {
        const lines = results.map(r => {
            const time = new Date(r.timestamp).toLocaleString('zh-CN');
            const conf = (r.confidence * 100).toFixed(0) + '%';
            const prefix = r.isLowConfidence ? '[低置信度] ' : '';
            return `[${time}] ${prefix}${r.text} (${conf})`;
        });
        const content = lines.join('\n');
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `手语识别结果_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.txt`;
        a.click(); URL.revokeObjectURL(url);
    }

    function onResultsChange(callback) {
        changeCallbacks.push(callback);
        return () => { changeCallbacks = changeCallbacks.filter(cb => cb !== callback); };
    }

    return { addResult, removeResult, clearResults, getResults, getAllResults, copyResults, exportResults, onResultsChange };
})();

// === UI控制器模块 ===
const UIController = (() => {
    const AppState = { IDLE: 'IDLE', INITIALIZING: 'INITIALIZING', MODEL_LOADING: 'MODEL_LOADING', READY: 'READY', RECOGNIZING: 'RECOGNIZING', PAUSED: 'PAUSED', ERROR: 'ERROR' };
    let appState = AppState.IDLE;
    let debugMode = false;
    const elements = {};

    function $(id) { return document.getElementById(id); }

    function cacheElements() {
        elements.videoPreview = $('video-preview');
        elements.landmarkCanvas = $('landmark-canvas');
        elements.videoPlaceholder = $('video-placeholder');
        elements.btnStart = $('btn-start');
        elements.btnStop = $('btn-stop');
        elements.btnModeLetter = $('btn-mode-letter');
        elements.btnModeWord = $('btn-mode-word');
        elements.toggleSpeech = $('toggle-speech');
        elements.sliderRate = $('slider-rate');
        elements.sliderVolume = $('slider-volume');
        elements.sliderThreshold = $('slider-threshold');
        elements.rateValue = $('rate-value');
        elements.volumeValue = $('volume-value');
        elements.thresholdValue = $('threshold-value');
        elements.btnDebug = $('btn-debug');
        elements.resultsList = $('results-list');
        elements.btnCopy = $('btn-copy');
        elements.btnExport = $('btn-export');
        elements.btnClear = $('btn-clear');
        elements.btnLoadMore = $('btn-load-more');
        elements.statusIndicator = $('status-indicator');
        elements.statusText = $('status-text');
        elements.statusDebug = $('status-debug');
        elements.modelProgress = $('model-progress');
        elements.btnRetryModel = $('btn-retry-model');
        elements.backendNotice = $('backend-notice');
    }

    function setAppState(newState) { appState = newState; updateUIState(); }

    function updateUIState() {
        const isIdle = appState === AppState.IDLE;
        const isRecognizing = appState === AppState.RECOGNIZING;
        const isModelLoading = appState === AppState.MODEL_LOADING;
        elements.btnStart.disabled = !isIdle;
        elements.btnStop.disabled = !isRecognizing;
        if (isRecognizing) {
            elements.statusIndicator.className = 'status-indicator active';
            elements.statusText.textContent = '正在识别...';
            elements.modelProgress.style.display = 'none';
            elements.btnRetryModel.style.display = 'none';
        } else if (appState === AppState.ERROR) {
            elements.statusIndicator.className = 'status-indicator error';
        } else if (appState === AppState.PAUSED) {
            elements.statusIndicator.className = 'status-indicator warning';
        } else if (isModelLoading) {
            elements.statusIndicator.className = 'status-indicator warning';
            elements.statusText.textContent = '模型加载中...';
        } else {
            elements.statusIndicator.className = 'status-indicator';
            elements.statusText.textContent = '就绪';
            elements.modelProgress.style.display = 'none';
            elements.btnRetryModel.style.display = 'none';
            elements.backendNotice.style.display = 'none';
        }
    }

    function setupCanvas() {
        const video = elements.videoPreview;
        const canvas = elements.landmarkCanvas;
        function resizeCanvas() { canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480; }
        video.addEventListener('loadedmetadata', resizeCanvas);
        resizeCanvas();
    }

    function drawLandmarks(detectionResult) {
        const canvas = elements.landmarkCanvas;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!detectionResult || !detectionResult.landmarks || detectionResult.landmarks.length === 0) return;
        const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
        const colors = { Left: '#3b82f6', Right: '#ef4444' };
        for (const hand of detectionResult.landmarks) {
            const color = colors[hand.handedness] || '#3b82f6';
            ctx.strokeStyle = color; ctx.lineWidth = 2;
            for (const [i, j] of connections) {
                const p1 = hand.points[i]; const p2 = hand.points[j];
                if (p1 && p2) { ctx.beginPath(); ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height); ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height); ctx.stroke(); }
            }
            for (let i = 0; i < hand.points.length; i++) {
                const p = hand.points[i]; ctx.fillStyle = color; ctx.beginPath();
                ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, 2 * Math.PI); ctx.fill();
            }
            if (detectionResult.landmarks.length > 1) {
                const wrist = hand.points[0]; ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif';
                ctx.fillText(hand.handedness === 'Left' ? '左' : '右', wrist.x * canvas.width + 8, wrist.y * canvas.height - 8);
            }
        }
    }

    function renderResults(results) {
        const list = elements.resultsList;
        if (results.length === 0) { list.innerHTML = '<div class="results-empty">暂无识别结果</div>'; elements.btnLoadMore.style.display = 'none'; return; }
        const visibleResults = results.slice(-500);
        list.innerHTML = visibleResults.map((r, i) => {
            const globalIndex = results.length - visibleResults.length + i;
            const time = new Date(r.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const conf = (r.confidence * 100).toFixed(0) + '%';
            const lowClass = r.isLowConfidence ? ' low-confidence' : '';
            const candidates = r.isLowConfidence && r.candidates.length > 0
                ? `<span class="result-candidates">候选: ${r.candidates.map(c => c.text + '(' + (c.confidence * 100).toFixed(0) + '%)').join(', ')}</span>` : '';
            const inferenceInfo = debugMode && r.inferenceTime ? `<span class="result-inference">${r.inferenceTime.toFixed(1)}ms</span>` : '';
            return `<div class="result-item${lowClass}" data-index="${globalIndex}"><div><span class="result-text">${r.text}</span>${candidates}</div><div class="result-meta"><span class="result-confidence">${conf}</span>${inferenceInfo}<span>${time}</span><button class="result-delete" data-index="${globalIndex}">&times;</button></div></div>`;
        }).join('');
        list.scrollTop = list.scrollHeight;
    }

    function showStatus(message, type) {
        elements.statusText.textContent = message;
        if (type === 'error') elements.statusIndicator.className = 'status-indicator error';
        else if (type === 'warning') elements.statusIndicator.className = 'status-indicator warning';
    }

    function updateDebugInfo(detectionResult, result) {
        if (!debugMode) { elements.statusDebug.style.display = 'none'; return; }
        elements.statusDebug.style.display = '';
        const info = [];
        if (detectionResult) {
            info.push(`FPS: ${detectionResult.frameRate}`);
            info.push(`Hands: ${detectionResult.landmarks.length}`);
            if (detectionResult.landmarks.length > 0) {
                const p = detectionResult.landmarks[0].points[0];
                info.push(`Wrist: (${p.x.toFixed(2)}, ${p.y.toFixed(2)})`);
            }
        }
        if (detectionResult && detectionResult.performanceMode) info.push('[性能模式]');
        if (result && result.inferenceTime) info.push(`Inference: ${result.inferenceTime.toFixed(1)}ms`);
        const modelStatus = ModelManager.getModelStatus();
        info.push(`Backend: ${modelStatus.backend}`);
        elements.statusDebug.textContent = info.join(' | ');
    }

    async function startRecognition() {
        setAppState(AppState.INITIALIZING);
        showStatus('正在初始化...');
        try {
            const stream = await CameraManager.requestCamera();
            elements.videoPreview.srcObject = stream;
            elements.videoPlaceholder.classList.add('hidden');
            await HandDetector.initialize();
            setAppState(AppState.MODEL_LOADING);
            showStatus('模型加载中...');
            let modelLoaded = false;
            try {
                const config = UserConfig.getConfig();
                await ModelManager.loadModel(config.recognitionMode);
                SignRecognizer.setUseModelInference(true);
                modelLoaded = true;
            } catch (modelErr) {
                console.warn('Model load failed, falling back to template matching:', modelErr);
                SignRecognizer.setUseModelInference(false);
                showStatus('模型加载失败，已降级为模板匹配模式', 'warning');
            }
            HandDetector.onResults(handleDetectionResult);
            HandDetector.startDetection(elements.videoPreview);
            setAppState(AppState.RECOGNIZING);
            if (modelLoaded) showStatus('正在识别...');
        } catch (err) {
            setAppState(AppState.ERROR);
            showStatus(err.message, 'error');
        }
    }

    function stopRecognition() {
        HandDetector.stopDetection();
        CameraManager.stopCamera();
        ModelManager.disposeModels();
        elements.videoPreview.srcObject = null;
        elements.videoPlaceholder.classList.remove('hidden');
        const ctx = elements.landmarkCanvas.getContext('2d');
        ctx.clearRect(0, 0, elements.landmarkCanvas.width, elements.landmarkCanvas.height);
        SignRecognizer.resetStability();
        setAppState(AppState.IDLE);
        showStatus('就绪');
    }

    async function retryModelLoad() {
        try {
            setAppState(AppState.MODEL_LOADING);
            showStatus('正在重新加载模型...');
            elements.btnRetryModel.style.display = 'none';
            const config = UserConfig.getConfig();
            await ModelManager.loadModel(config.recognitionMode);
            if (appState === AppState.MODEL_LOADING) {
                HandDetector.onResults(handleDetectionResult);
                HandDetector.startDetection(elements.videoPreview);
                setAppState(AppState.RECOGNIZING);
                showStatus('正在识别...');
            }
        } catch (err) {
            setAppState(AppState.ERROR);
            showStatus('模型加载失败：' + err.message, 'error');
        }
    }

    function handleDetectionResult(detectionResult) {
        drawLandmarks(detectionResult);
        updateDebugInfo(detectionResult);
        if (!SignRecognizer.isUsingModel() && !ModelManager.isReady()) { /* template mode */ }
        else if (ModelManager.isReady()) { /* model ready */ }
        else {
            if (appState === AppState.RECOGNIZING || appState === AppState.MODEL_LOADING) showStatus('模型加载中...', 'warning');
            return;
        }
        if (detectionResult.noHandDetected) {
            if (appState === AppState.RECOGNIZING) showStatus('未检测到手势', 'warning');
            return;
        }
        if (detectionResult.performanceMode) showStatus('性能模式 - 画质已降低', 'warning');
        else if (appState === AppState.RECOGNIZING) showStatus('正在识别...');
        const result = SignRecognizer.processLandmarks(detectionResult.landmarks);
        if (!result) return;
        updateDebugInfo(detectionResult, result);
        if (result.status === 'occluded') { showStatus('手部遮挡，请调整手部位置', 'warning'); return; }
        if (result.status === 'unclear') { showStatus('手势不明确', 'warning'); return; }
        if (result.isLowConfidence) showStatus('低置信度识别', 'warning');
        ResultManager.addResult(result);
        SpeechSynthesizer.speak(result.text);
    }

    function bindEvents() {
        elements.btnStart.addEventListener('click', startRecognition);
        elements.btnStop.addEventListener('click', stopRecognition);

        elements.btnModeLetter.addEventListener('click', async () => {
            elements.btnModeLetter.classList.add('active');
            elements.btnModeWord.classList.remove('active');
            SignRecognizer.setMode('letter');
            UserConfig.updateConfig({ recognitionMode: 'letter' });
            if (appState === AppState.RECOGNIZING) {
                try { await ModelManager.switchModel('letter'); } catch (err) { showStatus('切换模型失败：' + err.message, 'error'); }
            }
        });

        elements.btnModeWord.addEventListener('click', async () => {
            elements.btnModeWord.classList.add('active');
            elements.btnModeLetter.classList.remove('active');
            SignRecognizer.setMode('word');
            UserConfig.updateConfig({ recognitionMode: 'word' });
            if (appState === AppState.RECOGNIZING) {
                try { await ModelManager.switchModel('word'); } catch (err) { showStatus('切换模型失败：' + err.message, 'error'); }
            }
        });

        elements.toggleSpeech.addEventListener('change', () => {
            const enabled = elements.toggleSpeech.checked;
            SpeechSynthesizer.setEnabled(enabled);
            UserConfig.updateConfig({ speechEnabled: enabled });
        });

        elements.sliderRate.addEventListener('input', () => {
            const val = parseFloat(elements.sliderRate.value);
            elements.rateValue.textContent = val.toFixed(1);
            SpeechSynthesizer.setRate(val);
            UserConfig.updateConfig({ speechRate: val });
        });

        elements.sliderVolume.addEventListener('input', () => {
            const val = parseInt(elements.sliderVolume.value);
            elements.volumeValue.textContent = val;
            SpeechSynthesizer.setVolume(val);
            UserConfig.updateConfig({ speechVolume: val });
        });

        elements.sliderThreshold.addEventListener('input', () => {
            const val = parseFloat(elements.sliderThreshold.value);
            elements.thresholdValue.textContent = val.toFixed(2);
            SignRecognizer.setConfidenceThreshold(val);
            UserConfig.updateConfig({ confidenceThreshold: val });
        });

        elements.btnDebug.addEventListener('click', () => {
            debugMode = !debugMode;
            elements.btnDebug.classList.toggle('active', debugMode);
            if (!debugMode) elements.statusDebug.style.display = 'none';
        });

        elements.btnCopy.addEventListener('click', async () => {
            const success = await ResultManager.copyResults();
            showStatus(success ? '已复制到剪贴板' : '自动复制失败，请手动选中文字复制', success ? '' : 'warning');
        });

        elements.btnExport.addEventListener('click', () => { ResultManager.exportResults(); showStatus('结果已导出'); });

        elements.btnClear.addEventListener('click', () => { ResultManager.clearResults(); renderResults([]); });

        elements.resultsList.addEventListener('click', (e) => {
            if (e.target.classList.contains('result-delete')) {
                const index = parseInt(e.target.dataset.index);
                ResultManager.removeResult(index);
            }
        });

        elements.btnRetryModel.addEventListener('click', retryModelLoad);

        ResultManager.onResultsChange(renderResults);

        SpeechSynthesizer.onError((error) => { showStatus(error.message, 'warning'); });

        CameraManager.onStateChange((state) => {
            if (state === 'PAUSED') {
                setAppState(AppState.PAUSED);
                showStatus('摄像头连接已中断', 'error');
                HandDetector.stopDetection();
            }
        });

        ModelManager.onStatusChange((status) => {
            if (status.state === 'LOADING') { elements.modelProgress.style.display = ''; elements.btnRetryModel.style.display = 'none'; }
            else if (status.state === 'READY') { elements.modelProgress.style.display = 'none'; elements.btnRetryModel.style.display = 'none'; }
            else if (status.state === 'ERROR') {
                elements.modelProgress.style.display = 'none'; elements.btnRetryModel.style.display = '';
                showStatus('模型加载失败：' + (status.errorMessage || '未知错误'), 'error');
            }
            if (status.backend !== UserConfig.getConfig().preferredBackend) {
                elements.backendNotice.style.display = '';
                elements.backendNotice.textContent = `推理后端已降级为 ${status.backend.toUpperCase()}`;
            } else elements.backendNotice.style.display = 'none';
        });

        ModelManager.onProgress((progress) => {
            elements.modelProgress.style.display = '';
            elements.modelProgress.textContent = `${progress.message} (${progress.percentage}%)`;
        });

        document.addEventListener('click', () => { SpeechSynthesizer.tryPlayPending(); }, { once: true });
    }

    async function initialize() {
        cacheElements();
        setupCanvas();
        const config = UserConfig.getConfig();
        elements.toggleSpeech.checked = config.speechEnabled;
        elements.sliderRate.value = config.speechRate;
        elements.rateValue.textContent = config.speechRate.toFixed(1);
        elements.sliderVolume.value = config.speechVolume;
        elements.volumeValue.textContent = config.speechVolume;
        elements.sliderThreshold.value = config.confidenceThreshold;
        elements.thresholdValue.textContent = config.confidenceThreshold.toFixed(2);
        if (config.recognitionMode === 'letter') {
            elements.btnModeLetter.classList.add('active');
            elements.btnModeWord.classList.remove('active');
        } else {
            elements.btnModeLetter.classList.remove('active');
            elements.btnModeWord.classList.add('active');
        }
        SpeechSynthesizer.setEnabled(config.speechEnabled);
        SpeechSynthesizer.setRate(config.speechRate);
        SpeechSynthesizer.setVolume(config.speechVolume);
        SignRecognizer.setMode(config.recognitionMode);
        SignRecognizer.setConfidenceThreshold(config.confidenceThreshold);
        if (!SpeechSynthesizer.isAvailable()) {
            elements.toggleSpeech.disabled = true;
            showStatus('当前浏览器不支持语音合成，仅支持文字识别', 'warning');
        }
        bindEvents();
        setAppState(AppState.IDLE);
    }

    return { initialize };
})();

// === 应用入口 ===
async function main() {
    try { SignTemplates.loadTemplates(); } catch (e) { console.error('Failed to load templates:', e); }
    window.addEventListener('beforeunload', () => { ModelManager.disposeModels(); });
    await UIController.initialize();
}

document.addEventListener('DOMContentLoaded', main);
    </script>
