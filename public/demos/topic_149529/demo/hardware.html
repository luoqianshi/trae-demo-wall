<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>硬件联动控制台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --bg-panel: #0f1629;
  --bg-card: #1a2236;
  --border-cyan: #00d4ff;
  --border-purple: #a855f7;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-cyan: #00d4ff;
  --text-purple: #c084fc;
  --glow-cyan: 0 0 10px rgba(0,212,255,0.5), 0 0 20px rgba(0,212,255,0.2);
  --glow-purple: 0 0 10px rgba(168,85,247,0.5), 0 0 20px rgba(168,85,247,0.2);
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
}
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== 顶部栏 ===== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: linear-gradient(90deg, var(--bg-secondary), var(--bg-panel));
  border-bottom: 1px solid rgba(0,212,255,0.3);
  box-shadow: 0 2px 20px rgba(0,212,255,0.1);
  position: relative;
  z-index: 10;
}
.header::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-cyan), var(--border-purple), transparent);
}
.back-link {
  color: var(--text-cyan);
  text-decoration: none;
  font-size: 14px;
  padding: 6px 14px;
  border: 1px solid rgba(0,212,255,0.3);
  border-radius: 4px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.back-link:hover {
  background: rgba(0,212,255,0.1);
  box-shadow: var(--glow-cyan);
  border-color: var(--border-cyan);
}
.title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 3px;
  background: linear-gradient(90deg, var(--text-cyan), var(--text-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  position: relative;
}
.title::after {
  content: 'HARDWARE LINK CONSOLE';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--text-secondary);
  -webkit-text-fill-color: var(--text-secondary);
  opacity: 0.6;
  white-space: nowrap;
}
.conn-status {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text-secondary);
}
.status-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 8px var(--danger);
  transition: all 0.5s;
}
.status-dot.connected {
  background: var(--success);
  box-shadow: 0 0 8px var(--success), 0 0 16px var(--success);
  animation: pulse-green 1.5s infinite;
}
@keyframes pulse-green {
  0%, 100% { box-shadow: 0 0 8px var(--success), 0 0 16px rgba(34,197,94,0.4); }
  50% { box-shadow: 0 0 16px var(--success), 0 0 32px rgba(34,197,94,0.8); }
}

/* ===== 主体布局 ===== */
.main-layout {
  display: grid;
  grid-template-columns: 260px 1fr 300px;
  grid-template-rows: 1fr auto;
  gap: 12px;
  padding: 12px;
  height: calc(100vh - 60px);
}

/* ===== 通用面板样式 ===== */
.panel {
  background: var(--bg-panel);
  border: 1px solid rgba(0,212,255,0.2);
  border-radius: 8px;
  padding: 14px;
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: linear-gradient(180deg, var(--border-cyan), var(--border-purple));
}
.panel-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-cyan);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(0,212,255,0.15);
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 1px;
}
.panel-title .icon {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* ===== 左侧设备面板 ===== */
.device-panel { grid-row: 1; grid-column: 1; display: flex; flex-direction: column; }
.scan-btn {
  width: 100%;
  padding: 10px;
  background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(168,85,247,0.15));
  border: 1px solid var(--border-cyan);
  border-radius: 6px;
  color: var(--text-cyan);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s;
  margin-bottom: 12px;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
}
.scan-btn:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(168,85,247,0.3));
  box-shadow: var(--glow-cyan);
}
.scan-btn:disabled { opacity: 0.7; cursor: not-allowed; }
.scan-btn.scanning::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
  animation: scan-sweep 1.5s infinite;
}
@keyframes scan-sweep {
  0% { left: -100%; }
  100% { left: 100%; }
}
.device-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.device-list::-webkit-scrollbar { width: 4px; }
.device-list::-webkit-scrollbar-thumb { background: var(--border-cyan); border-radius: 2px; }
.device-card {
  background: var(--bg-card);
  border: 1px solid rgba(148,163,184,0.15);
  border-radius: 6px;
  padding: 10px;
  transition: all 0.3s;
  position: relative;
}
.device-card.connected {
  border-color: var(--border-cyan);
  box-shadow: var(--glow-cyan);
  background: linear-gradient(135deg, rgba(0,212,255,0.08), var(--bg-card));
}
.device-card.connecting {
  border-color: var(--warning);
  animation: connect-flash 0.5s;
}
@keyframes connect-flash {
  0%, 100% { border-color: var(--warning); }
  50% { border-color: var(--border-cyan); box-shadow: var(--glow-cyan); }
}
.device-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.device-name {
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.device-icon {
  font-size: 16px;
}
.device-signal {
  font-size: 11px;
  color: var(--success);
  display: none;
}
.device-card.connected .device-signal { display: flex; align-items: center; gap: 3px; }
.signal-bars {
  display: inline-flex;
  gap: 2px;
  align-items: flex-end;
  height: 12px;
}
.signal-bar {
  width: 3px;
  background: var(--success);
  border-radius: 1px;
}
.signal-bar:nth-child(1) { height: 4px; }
.signal-bar:nth-child(2) { height: 7px; }
.signal-bar:nth-child(3) { height: 10px; }
.signal-bar:nth-child(4) { height: 12px; opacity: 0.4; }
.device-status {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.device-card.connected .device-status { color: var(--success); }
.device-actions {
  display: flex;
  gap: 6px;
}
.btn-mini {
  flex: 1;
  padding: 5px 8px;
  font-size: 11px;
  border: 1px solid rgba(148,163,184,0.3);
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-mini:hover { border-color: var(--border-cyan); color: var(--text-cyan); }
.btn-mini.primary { border-color: var(--border-cyan); color: var(--text-cyan); }
.btn-mini.primary:hover { background: rgba(0,212,255,0.15); box-shadow: var(--glow-cyan); }
.btn-mini.danger { border-color: var(--danger); color: var(--danger); }
.btn-mini.danger:hover { background: rgba(239,68,68,0.15); }
.btn-mini:disabled { opacity: 0.4; cursor: not-allowed; }
.power-toggle {
  width: 32px;
  height: 18px;
  background: #374151;
  border-radius: 9px;
  position: relative;
  cursor: pointer;
  transition: background 0.3s;
  flex: 0 0 32px;
}
.power-toggle.on { background: var(--success); box-shadow: 0 0 6px var(--success); }
.power-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  transition: left 0.3s;
}
.power-toggle.on::after { left: 16px; }

/* ===== 中间Canvas画布 ===== */
.canvas-panel { grid-row: 1; grid-column: 2; display: flex; flex-direction: column; padding: 0; }
.canvas-header {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(0,212,255,0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.canvas-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-cyan);
  letter-spacing: 1px;
}
.canvas-info {
  font-size: 11px;
  color: var(--text-secondary);
}
.canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#simCanvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
}
.canvas-overlay {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 11px;
  color: var(--text-secondary);
  background: rgba(10,14,26,0.8);
  padding: 6px 10px;
  border-radius: 4px;
  border: 1px solid rgba(0,212,255,0.2);
  pointer-events: none;
}
.coord-display {
  font-family: 'Courier New', monospace;
  color: var(--text-cyan);
}
.grid-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* ===== 右侧参数面板 ===== */
.param-panel { grid-row: 1; grid-column: 3; display: flex; flex-direction: column; overflow-y: auto; }
.param-panel::-webkit-scrollbar { width: 4px; }
.param-panel::-webkit-scrollbar-thumb { background: var(--border-purple); border-radius: 2px; }
.param-section {
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(168,85,247,0.15);
}
.param-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.param-section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-purple);
  margin-bottom: 10px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.param-section-title::before {
  content: '';
  width: 3px;
  height: 12px;
  background: var(--border-purple);
  border-radius: 2px;
}
.param-row {
  margin-bottom: 10px;
}
.param-row:last-child { margin-bottom: 0; }
.param-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.param-value {
  color: var(--text-cyan);
  font-family: 'Courier New', monospace;
  font-weight: 600;
}
input[type="range"] {
  width: 100%;
  height: 4px;
  -webkit-appearance: none;
  background: linear-gradient(90deg, var(--border-cyan), var(--border-purple));
  border-radius: 2px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px var(--border-cyan);
  cursor: pointer;
}
.wavelength-select {
  display: flex;
  gap: 6px;
}
.wl-btn {
  flex: 1;
  padding: 6px;
  border: 1px solid rgba(148,163,184,0.3);
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
}
.wl-btn.active {
  border-color: currentColor;
  box-shadow: 0 0 8px currentColor;
}
.wl-btn.red { color: #ff4444; }
.wl-btn.red.active { background: rgba(255,68,68,0.15); }
.wl-btn.green { color: #44ff44; }
.wl-btn.green.active { background: rgba(68,255,68,0.15); }
.wl-btn.blue { color: #4444ff; }
.wl-btn.blue.active { background: rgba(68,68,255,0.15); }
.prediction-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.pred-item {
  background: var(--bg-card);
  border: 1px solid rgba(0,212,255,0.15);
  border-radius: 6px;
  padding: 8px;
  text-align: center;
}
.pred-label {
  font-size: 10px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.pred-value {
  font-size: 16px;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  color: var(--text-cyan);
}
.pred-value .unit {
  font-size: 10px;
  color: var(--text-secondary);
  font-weight: 400;
}
.efficiency-bar {
  margin-top: 8px;
  height: 6px;
  background: var(--bg-card);
  border-radius: 3px;
  overflow: hidden;
}
.efficiency-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--success), var(--border-cyan));
  border-radius: 3px;
  transition: width 0.3s;
  box-shadow: 0 0 6px var(--success);
}

/* ===== 底部日志 ===== */
.log-panel {
  grid-row: 2;
  grid-column: 1 / -1;
  max-height: 160px;
  display: flex;
  flex-direction: column;
}
.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.log-controls {
  display: flex;
  gap: 8px;
}
.log-toggle {
  padding: 4px 12px;
  font-size: 11px;
  border: 1px solid var(--success);
  border-radius: 4px;
  background: transparent;
  color: var(--success);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.log-toggle:hover { background: rgba(34,197,94,0.15); }
.log-toggle.stopped { border-color: var(--danger); color: var(--danger); }
.log-toggle.stopped:hover { background: rgba(239,68,68,0.15); }
.log-clear {
  padding: 4px 12px;
  font-size: 11px;
  border: 1px solid rgba(148,163,184,0.3);
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}
.log-clear:hover { border-color: var(--warning); color: var(--warning); }
.log-content {
  flex: 1;
  overflow-y: auto;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  background: rgba(0,0,0,0.3);
  border-radius: 4px;
  padding: 8px;
  border: 1px solid rgba(0,212,255,0.1);
}
.log-content::-webkit-scrollbar { width: 4px; }
.log-content::-webkit-scrollbar-thumb { background: var(--border-cyan); border-radius: 2px; }
.log-entry {
  padding: 2px 0;
  display: flex;
  gap: 8px;
  line-height: 1.5;
  animation: log-in 0.3s;
}
@keyframes log-in {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.log-time { color: var(--text-secondary); white-space: nowrap; }
.log-msg.info { color: var(--text-cyan); }
.log-msg.success { color: var(--success); }
.log-msg.warn { color: var(--warning); }
.log-msg.error { color: var(--danger); }
.log-msg.data { color: var(--text-purple); }

/* ===== 响应式 ===== */
@media (max-width: 1100px) {
  .main-layout {
    grid-template-columns: 220px 1fr 260px;
  }
}
@media (max-width: 900px) {
  .main-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto auto;
    height: auto;
  }
  .device-panel { grid-column: 1; grid-row: 1; max-height: 300px; }
  .canvas-panel { grid-column: 1; grid-row: 2; min-height: 400px; }
  .param-panel { grid-column: 1; grid-row: 3; max-height: 400px; }
  .log-panel { grid-column: 1; grid-row: 4; }
}

/* ===== 动画效果 ===== */
@keyframes data-flow {
  0% { stroke-dashoffset: 20; }
  100% { stroke-dashoffset: 0; }
}
.glow-text {
  text-shadow: 0 0 10px currentColor;
}
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--bg-card);
  border: 1px solid var(--success);
  color: var(--success);
  padding: 10px 24px;
  border-radius: 6px;
  font-size: 13px;
  z-index: 100;
  opacity: 0;
  transition: all 0.4s;
  pointer-events: none;
  box-shadow: var(--glow-cyan);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast.error { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 10px rgba(239,68,68,0.5); }
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="header">
  <a href="index.html" class="back-link">&#8592; 返回首页</a>
  <div class="title">硬件联动控制台</div>
  <div class="conn-status">
    <span id="connText">未连接</span>
    <div class="status-dot" id="statusDot"></div>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<!-- 主体布局 -->
<div class="main-layout">
  <!-- 左侧设备面板 -->
  <div class="panel device-panel">
    <div class="panel-title">
      <span class="icon">&#128225;</span> 设备列表
    </div>
    <button class="scan-btn" id="scanBtn" onclick="scanDevices()">&#128269; 扫描设备</button>
    <div class="device-list" id="deviceList">
      <div style="text-align:center;color:var(--text-secondary);font-size:12px;padding:20px;">
        点击"扫描设备"查找可用硬件
      </div>
    </div>
  </div>

  <!-- 中间Canvas画布 -->
  <div class="panel canvas-panel">
    <div class="canvas-header">
      <div class="canvas-title">&#128300; 光学仿真画布（俯视图）</div>
      <div class="canvas-info">拖动设备调整位置 | 滚轮调整角度</div>
    </div>
    <div class="canvas-container">
      <div class="grid-bg"></div>
      <canvas id="simCanvas"></canvas>
      <div class="canvas-overlay">
        <div>坐标: <span class="coord-display" id="coordDisplay">--, --</span></div>
      </div>
    </div>
  </div>

  <!-- 右侧参数面板 -->
  <div class="panel param-panel">
    <div class="panel-title">
      <span class="icon">&#9881;</span> 参数控制
    </div>

    <!-- 光源参数 -->
    <div class="param-section">
      <div class="param-section-title">光源参数</div>
      <div class="param-row">
        <div class="param-label">
          <span>输出功率</span>
          <span class="param-value" id="powerVal">50 mW</span>
        </div>
        <input type="range" id="powerSlider" min="0" max="100" value="50" oninput="updateParams()">
      </div>
      <div class="param-row">
        <div class="param-label">
          <span>波长选择</span>
        </div>
        <div class="wavelength-select">
          <button class="wl-btn red" data-wl="650" onclick="setWavelength(650,this)">650nm红</button>
          <button class="wl-btn green active" data-wl="532" onclick="setWavelength(532,this)">532nm绿</button>
          <button class="wl-btn blue" data-wl="405" onclick="setWavelength(405,this)">405nm蓝</button>
        </div>
      </div>
      <div class="param-row">
        <div class="param-label">
          <span>发散角</span>
          <span class="param-value" id="divAngleVal">0.5 mrad</span>
        </div>
        <input type="range" id="divAngleSlider" min="1" max="20" value="5" oninput="updateParams()">
      </div>
      <div class="param-row">
        <div class="param-label">
          <span>发射角度</span>
          <span class="param-value" id="beamAngleVal">0.0°</span>
        </div>
        <input type="range" id="beamAngleSlider" min="-30" max="30" value="0" oninput="updateParams()">
      </div>
    </div>

    <!-- 透镜参数 -->
    <div class="param-section">
      <div class="param-section-title">透镜参数</div>
      <div class="param-row">
        <div class="param-label">
          <span>焦距 (凸透镜A)</span>
          <span class="param-value" id="focalAVal">100 mm</span>
        </div>
        <input type="range" id="focalASlider" min="50" max="300" value="100" oninput="updateParams()">
      </div>
      <div class="param-row">
        <div class="param-label">
          <span>旋转角度 (透镜A)</span>
          <span class="param-value" id="rotAVal">0.0°</span>
        </div>
        <input type="range" id="rotASlider" min="-30" max="30" value="0" oninput="updateParams()">
      </div>
      <div class="param-row">
        <div class="param-label">
          <span>焦距 (凸透镜B)</span>
          <span class="param-value" id="focalBVal">150 mm</span>
        </div>
        <input type="range" id="focalBSlider" min="50" max="300" value="150" oninput="updateParams()">
      </div>
      <div class="param-row">
        <div class="param-label">
          <span>旋转角度 (透镜B)</span>
          <span class="param-value" id="rotBVal">0.0°</span>
        </div>
        <input type="range" id="rotBSlider" min="-30" max="30" value="0" oninput="updateParams()">
      </div>
    </div>

    <!-- 预测输出 -->
    <div class="param-section">
      <div class="param-section-title">预测输出</div>
      <div class="prediction-grid">
        <div class="pred-item">
          <div class="pred-label">光束落点X</div>
          <div class="pred-value" id="predPos">--<span class="unit">mm</span></div>
        </div>
        <div class="pred-item">
          <div class="pred-label">光斑直径</div>
          <div class="pred-value" id="predSpot">--<span class="unit">mm</span></div>
        </div>
        <div class="pred-item">
          <div class="pred-label">输出功率</div>
          <div class="pred-value" id="predPower">--<span class="unit">mW</span></div>
        </div>
        <div class="pred-item">
          <div class="pred-label">传输效率</div>
          <div class="pred-value" id="predEff">--<span class="unit">%</span></div>
        </div>
      </div>
      <div class="efficiency-bar">
        <div class="efficiency-fill" id="effBar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- 底部日志面板 -->
  <div class="panel log-panel">
    <div class="log-header">
      <div class="panel-title" style="margin-bottom:0;border:none;padding-bottom:0;">
        <span class="icon">&#128203;</span> 实时数据日志
      </div>
      <div class="log-controls">
        <button class="log-toggle" id="logToggle" onclick="toggleDataStream()">&#9646;&#9646; 停止实时数据</button>
        <button class="log-clear" onclick="clearLog()">&#128465; 清空</button>
      </div>
    </div>
    <div class="log-content" id="logContent"></div>
  </div>
</div>

<script>
// ===== 全局状态 =====
const state = {
  devices: [
    { id: 'laser', name: '激光发射器', icon: '&#128308;', connected: false, powered: true, signal: 0, type: 'source' },
    { id: 'lensA', name: '凸透镜A', icon: '&#128309;', connected: false, powered: false, signal: 0, type: 'lens' },
    { id: 'lensB', name: '凸透镜B', icon: '&#128309;', connected: false, powered: false, signal: 0, type: 'lens' },
    { id: 'screen', name: '光屏', icon: '&#128998;', connected: false, powered: false, signal: 0, type: 'screen' },
    { id: 'pmeter', name: '功率计', icon: '&#128200;', connected: false, powered: false, signal: 0, type: 'meter' }
  ],
  scanned: false,
  scanning: false,
  dataStreamActive: true,
  dataStreamTimer: null,
  params: {
    power: 50,
    wavelength: 532,
    divAngle: 0.5,
    beamAngle: 0,
    focalA: 100,
    rotA: 0,
    focalB: 150,
    rotB: 0,
    lensAPos: { x: 200, y: 0 },
    lensBPos: { x: 400, y: 0 },
    screenPos: { x: 600, y: 0 }
  },
  dragging: null,
  dragOffset: { x: 0, y: 0 },
  canvasScale: 1
};

const wlColors = { 405: '#6366f1', 532: '#22c55e', 650: '#ef4444' };
const wlNames = { 405: '蓝光', 532: '绿光', 650: '红光' };

// ===== Canvas 初始化 =====
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
let canvasW, canvasH;

function resizeCanvas() {
  const container = canvas.parentElement;
  canvasW = container.clientWidth;
  canvasH = container.clientHeight;
  canvas.width = canvasW * window.devicePixelRatio;
  canvas.height = canvasH * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  state.canvasScale = Math.min(canvasW / 800, canvasH / 400);
  draw();
}

window.addEventListener('resize', resizeCanvas);

// ===== 设备扫描 =====
function scanDevices() {
  if (state.scanning) return;
  state.scanning = true;
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.classList.add('scanning');
  btn.innerHTML = '&#128269; 扫描中...';
  addLog('info', '开始扫描硬件设备...');

  setTimeout(() => {
    state.scanned = true;
    state.scanning = false;
    btn.disabled = false;
    btn.classList.remove('scanning');
    btn.innerHTML = '&#128269; 重新扫描';
    renderDeviceList();
    addLog('success', '扫描完成，发现 ' + state.devices.length + ' 个可用设备');
    showToast('扫描完成，发现 ' + state.devices.length + ' 个设备');
  }, 2000);
}

function renderDeviceList() {
  const list = document.getElementById('deviceList');
  if (!state.scanned) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-secondary);font-size:12px;padding:20px;">点击"扫描设备"查找可用硬件</div>';
    return;
  }
  list.innerHTML = '';
  state.devices.forEach(dev => {
    const card = document.createElement('div');
    card.className = 'device-card' + (dev.connected ? ' connected' : '');
    card.id = 'dev-' + dev.id;
    card.innerHTML = `
      <div class="device-header">
        <div class="device-name">
          <span class="device-icon">${dev.icon}</span>
          <span>${dev.name}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="device-signal">
            <div class="signal-bars">
              <div class="signal-bar"></div>
              <div class="signal-bar"></div>
              <div class="signal-bar"></div>
              <div class="signal-bar"></div>
            </div>
            ${dev.signal}%
          </div>
          <div class="power-toggle ${dev.powered && dev.connected ? 'on' : ''}" onclick="togglePower('${dev.id}')" title="电源开关"></div>
        </div>
      </div>
      <div class="device-status">${dev.connected ? '已连接 | 信号强度 ' + dev.signal + '%' : '未连接'}</div>
      <div class="device-actions">
        ${dev.connected
          ? '<button class="btn-mini danger" onclick="disconnectDevice(\'' + dev.id + '\')">断开</button>'
          : '<button class="btn-mini primary" onclick="connectDevice(\'' + dev.id + '\')">连接</button>'}
        <button class="btn-mini" onclick="deviceInfo(\'' + dev.id + '\')">详情</button>
      </div>
    `;
    list.appendChild(card);
  });
}

// ===== 设备连接/断开 =====
function connectDevice(id) {
  const dev = state.devices.find(d => d.id === id);
  if (!dev || dev.connected) return;

  const card = document.getElementById('dev-' + id);
  card.classList.add('connecting');
  addLog('info', '正在连接 ' + dev.name + '...');

  setTimeout(() => {
    dev.connected = true;
    dev.powered = true;
    dev.signal = 85 + Math.floor(Math.random() * 15);
    card.classList.remove('connecting');
    renderDeviceList();
    updateConnectionStatus();
    addLog('success', dev.name + ' 连接成功 (信号强度: ' + dev.signal + '%)');
    showToast(dev.name + ' 连接成功');
    draw();
  }, 1000);
}

function disconnectDevice(id) {
  const dev = state.devices.find(d => d.id === id);
  if (!dev || !dev.connected) return;
  dev.connected = false;
  dev.powered = false;
  dev.signal = 0;
  renderDeviceList();
  updateConnectionStatus();
  addLog('warn', dev.name + ' 已断开连接');
  draw();
}

function togglePower(id) {
  const dev = state.devices.find(d => d.id === id);
  if (!dev || !dev.connected) return;
  dev.powered = !dev.powered;
  renderDeviceList();
  addLog(dev.powered ? 'success' : 'warn', dev.name + ' 已' + (dev.powered ? '开启' : '关闭'));
  draw();
}

function deviceInfo(id) {
  const dev = state.devices.find(d => d.id === id);
  if (!dev) return;
  addLog('info', '[' + dev.name + '] 类型:' + dev.type + ' | 状态:' + (dev.connected ? '已连接' : '未连接') + ' | 信号:' + dev.signal + '%');
}

function updateConnectionStatus() {
  const connectedCount = state.devices.filter(d => d.connected).length;
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('connText');
  if (connectedCount > 0) {
    dot.classList.add('connected');
    text.textContent = connectedCount + '/' + state.devices.length + ' 已连接';
  } else {
    dot.classList.remove('connected');
    text.textContent = '未连接';
  }
}

// ===== 参数更新 =====
function updateParams() {
  state.params.power = +document.getElementById('powerSlider').value;
  state.params.divAngle = +document.getElementById('divAngleSlider').value / 10;
  state.params.beamAngle = +document.getElementById('beamAngleSlider').value;
  state.params.focalA = +document.getElementById('focalASlider').value;
  state.params.rotA = +document.getElementById('rotASlider').value;
  state.params.focalB = +document.getElementById('focalBSlider').value;
  state.params.rotB = +document.getElementById('rotBSlider').value;

  document.getElementById('powerVal').textContent = state.params.power + ' mW';
  document.getElementById('divAngleVal').textContent = state.params.divAngle.toFixed(1) + ' mrad';
  document.getElementById('beamAngleVal').textContent = state.params.beamAngle.toFixed(1) + '°';
  document.getElementById('focalAVal').textContent = state.params.focalA + ' mm';
  document.getElementById('rotAVal').textContent = state.params.rotA.toFixed(1) + '°';
  document.getElementById('focalBVal').textContent = state.params.focalB + ' mm';
  document.getElementById('rotBVal').textContent = state.params.rotB.toFixed(1) + '°';

  draw();
  updatePredictions();
}

function setWavelength(wl, btn) {
  state.params.wavelength = wl;
  document.querySelectorAll('.wl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  addLog('info', '切换波长至 ' + wl + 'nm (' + wlNames[wl] + ')');
  draw();
}

// ===== 物理计算 =====
function computeBeam() {
  const p = state.params;
  const laser = state.devices.find(d => d.id === 'laser');
  const lensA = state.devices.find(d => d.id === 'lensA');
  const lensB = state.devices.find(d => d.id === 'lensB');
  const screen = state.devices.find(d => d.id === 'screen');

  const scale = state.canvasScale;
  const ox = 60, oy = canvasH / 2;

  // 光源位置
  const sourceX = ox;
  const sourceY = oy;

  // 初始角度
  let angle = (p.beamAngle + p.rotA * 0.3) * Math.PI / 180;

  // 光路点序列
  const segments = [];
  let curX = sourceX;
  let curY = sourceY;
  let curAngle = angle;
  let power = p.power;
  const transmittance = 0.95;
  const distCoef = 0.0002;

  // 到透镜A
  const laX = ox + p.lensAPos.x * scale;
  if (lensA && lensA.connected && lensA.powered) {
    const dist1 = p.lensAPos.x;
    const laY = oy + Math.tan(curAngle) * p.lensAPos.x * scale;
    segments.push({ x1: curX, y1: curY, x2: laX, y2: laY });
    // 薄透镜偏转
    const deflectionA = -Math.atan((laY - oy) / (p.focalA * scale * 0.8)) * 0.6 + (p.rotA * Math.PI / 180) * 0.5;
    curAngle += deflectionA;
    power *= transmittance;
    power *= Math.exp(-distCoef * dist1);
    curX = laX;
    curY = laY;
  }

  // 到透镜B
  const lbX = ox + p.lensBPos.x * scale;
  if (lensB && lensB.connected && lensB.powered) {
    const dist2 = p.lensBPos.x - p.lensAPos.x;
    const lbY = curY + Math.tan(curAngle) * (p.lensBPos.x - p.lensAPos.x) * scale;
    segments.push({ x1: curX, y1: curY, x2: lbX, y2: lbY });
    const deflectionB = -Math.atan((lbY - oy) / (p.focalB * scale * 0.8)) * 0.6 + (p.rotB * Math.PI / 180) * 0.5;
    curAngle += deflectionB;
    power *= transmittance;
    power *= Math.exp(-distCoef * dist2);
    curX = lbX;
    curY = lbY;
  }

  // 到光屏
  const scX = ox + p.screenPos.x * scale;
  const dist3 = p.screenPos.x - ((lensB && lensB.connected) ? p.lensBPos.x : ((lensA && lensA.connected) ? p.lensAPos.x : 0));
  const scY = curY + Math.tan(curAngle) * (scX - curX);
  segments.push({ x1: curX, y1: curY, x2: scX, y2: scY });
  power *= Math.exp(-distCoef * dist3);

  // 光斑大小
  const totalDist = p.screenPos.x;
  const spotDiameter = 2 + 2 * p.divAngle * totalDist * 0.01;

  // 落点偏移(mm)
  const spotOffset = (scY - oy) / scale;

  return {
    segments,
    sourceX, sourceY,
    laX, lbX, scX,
    laConnected: lensA && lensA.connected && lensA.powered,
    lbConnected: lensB && lensB.connected && lensB.powered,
    screenConnected: screen && screen.connected,
    laserOn: laser && laser.connected && laser.powered,
    power: Math.max(0, power),
    spotDiameter,
    spotOffset,
    finalAngle: curAngle,
    scale
  };
}

function updatePredictions() {
  const beam = computeBeam();
  const eff = state.params.power > 0 ? (beam.power / state.params.power * 100) : 0;
  document.getElementById('predPos').innerHTML = beam.spotOffset.toFixed(1) + '<span class="unit">mm</span>';
  document.getElementById('predSpot').innerHTML = beam.spotDiameter.toFixed(2) + '<span class="unit">mm</span>';
  document.getElementById('predPower').innerHTML = beam.power.toFixed(2) + '<span class="unit">mW</span>';
  document.getElementById('predEff').innerHTML = eff.toFixed(1) + '<span class="unit">%</span>';
  document.getElementById('effBar').style.width = eff + '%';
}

// ===== Canvas 绘制 =====
function draw() {
  ctx.clearRect(0, 0, canvasW, canvasH);

  // 背景网格已由CSS绘制

  // 绘制光具座导轨
  const oy = canvasH / 2;
  ctx.strokeStyle = 'rgba(148,163,184,0.2)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 4]);
  ctx.beginPath();
  ctx.moveTo(40, oy);
  ctx.lineTo(canvasW - 20, oy);
  ctx.stroke();
  ctx.setLineDash([]);

  // 刻度
  ctx.fillStyle = 'rgba(148,163,184,0.4)';
  ctx.font = '10px Courier New';
  ctx.textAlign = 'center';
  for (let x = 0; x < 800; x += 100) {
    const px = 60 + x * state.canvasScale;
    if (px > canvasW - 20) break;
    ctx.beginPath();
    ctx.moveTo(px, oy - 5);
    ctx.lineTo(px, oy + 5);
    ctx.stroke();
    ctx.fillText(x + 'mm', px, oy + 18);
  }

  const beam = computeBeam();
  const p = state.params;
  const color = wlColors[p.wavelength];

  // 绘制光源
  drawSource(beam.sourceX, beam.sourceY, color, beam.laserOn);

  // 绘制透镜A
  if (beam.laConnected) {
    drawLens(beam.laX, oy, p.focalA, p.rotA, '#00d4ff', 'A');
  }

  // 绘制透镜B
  if (beam.lbConnected) {
    const lbX = 60 + p.lensBPos.x * state.canvasScale;
    drawLens(lbX, oy, p.focalB, p.rotB, '#a855f7', 'B');
  }

  // 绘制光屏
  if (beam.screenConnected) {
    const scX = 60 + p.screenPos.x * state.canvasScale;
    drawScreen(scX, beam.segments[beam.segments.length - 1].y2, beam.spotDiameter * state.canvasScale, color);
  }

  // 绘制功率计
  const pmeter = state.devices.find(d => d.id === 'pmeter');
  if (pmeter && pmeter.connected) {
    const pmX = 60 + p.screenPos.x * state.canvasScale + 40;
    drawPowerMeter(pmX, oy - 60, beam.power);
  }

  // 绘制光束
  if (beam.laserOn) {
    drawBeam(beam.segments, color);
  }

  // 绘制设备标签
  drawLabels(beam);
}

function drawSource(x, y, color, on) {
  // 激光发射器外壳
  ctx.fillStyle = '#1a2236';
  ctx.strokeStyle = on ? color : '#475569';
  ctx.lineWidth = 2;
  ctx.shadowBlur = on ? 15 : 0;
  ctx.shadowColor = color;

  // 主体
  ctx.beginPath();
  ctx.rect(x - 35, y - 18, 30, 36);
  ctx.fill();
  ctx.stroke();

  // 发射头
  ctx.beginPath();
  ctx.rect(x - 5, y - 8, 10, 16);
  ctx.fill();
  ctx.stroke();

  // 散热片
  ctx.strokeStyle = on ? color : '#475569';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(x - 33, y - 14 + i * 8);
    ctx.lineTo(x - 38, y - 14 + i * 8);
    ctx.stroke();
  }

  ctx.shadowBlur = 0;

  // 标签
  ctx.fillStyle = on ? color : '#64748b';
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('LASER', x - 20, y + 4);

  // 电源指示灯
  ctx.beginPath();
  ctx.arc(x - 20, y - 12, 3, 0, Math.PI * 2);
  ctx.fillStyle = on ? '#22c55e' : '#ef4444';
  ctx.fill();
}

function drawLens(x, y, focal, rot, color, label) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot * Math.PI / 180);

  const h = 50;
  const w = 8;

  // 透镜形状(凸透镜侧视图)
  ctx.fillStyle = 'rgba(0,212,255,0.15)';
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = color;

  ctx.beginPath();
  ctx.moveTo(-w, -h);
  ctx.quadraticCurveTo(w * 2, 0, -w, h);
  ctx.quadraticCurveTo(-w * 2, 0, -w, -h);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 支架
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, h);
  ctx.lineTo(0, h + 20);
  ctx.stroke();

  // 底座
  ctx.fillStyle = '#374151';
  ctx.fillRect(-15, h + 20, 30, 6);

  ctx.restore();

  // 标签
  ctx.fillStyle = color;
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('Lens ' + label + ' f=' + focal + 'mm', x, y - 40);
}

function drawScreen(x, y, spotR, color) {
  const h = 80;
  const w = 8;

  // 光屏
  ctx.fillStyle = '#1e293b';
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2;
  ctx.fillRect(x - w / 2, y - h / 2, w, h);
  ctx.strokeRect(x - w / 2, y - h / 2, w, h);

  // 刻度
  ctx.strokeStyle = 'rgba(148,163,184,0.3)';
  ctx.lineWidth = 1;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(x - w / 2 - 4, y + i * 10);
    ctx.lineTo(x - w / 2, y + i * 10);
    ctx.stroke();
  }

  // 光斑
  ctx.shadowBlur = 20;
  ctx.shadowColor = color;
  const grad = ctx.createRadialGradient(x - w / 2, y, 0, x - w / 2, y, Math.max(spotR, 3));
  grad.addColorStop(0, color);
  grad.addColorStop(0.5, color + '88');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(x - w / 2, y, Math.max(spotR, 3), Math.max(spotR, 3) * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 支架
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y + h / 2);
  ctx.lineTo(x, y + h / 2 + 20);
  ctx.stroke();
  ctx.fillStyle = '#374151';
  ctx.fillRect(x - 12, y + h / 2 + 20, 24, 6);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('光屏', x, y + h / 2 + 38);
}

function drawPowerMeter(x, y, power) {
  const w = 70, h = 50;

  // 外壳
  ctx.fillStyle = '#1a2236';
  ctx.strokeStyle = '#a855f7';
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#a855f7';
  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - h / 2, w, h, 4);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 显示屏
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(x - w / 2 + 6, y - h / 2 + 6, w - 12, h - 22);

  // 读数
  ctx.fillStyle = '#a855f7';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(power.toFixed(2), x, y - 4);
  ctx.font = '8px Courier New';
  ctx.fillStyle = '#64748b';
  ctx.fillText('mW', x + 22, y - 4);

  // 探头连接线
  ctx.strokeStyle = '#a855f7';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(x, y + h / 2);
  ctx.lineTo(x, y + h / 2 + 15);
  ctx.stroke();
  ctx.setLineDash([]);

  // 标签
  ctx.fillStyle = '#a855f7';
  ctx.font = '9px Courier New';
  ctx.fillText('功率计', x, y + h / 2 + 8);
}

function drawBeam(segments, color) {
  // 外发光
  ctx.strokeStyle = color;
  ctx.lineWidth = 6;
  ctx.globalAlpha = 0.15;
  ctx.shadowBlur = 20;
  ctx.shadowColor = color;
  segments.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
  });

  // 中层
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.4;
  segments.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
  });

  // 核心
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#ffffff';
  ctx.shadowBlur = 10;
  segments.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
  });

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // 光束动画点
  const t = (Date.now() % 2000) / 2000;
  segments.forEach(s => {
    const px = s.x1 + (s.x2 - s.x1) * t;
    const py = s.y1 + (s.y2 - s.y1) * t;
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 8;
    ctx.shadowColor = color;
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
}

function drawLabels(beam) {
  // 数据流动画效果
  if (beam.laserOn) {
    const t = (Date.now() % 1500) / 1500;
    ctx.strokeStyle = 'rgba(168,85,247,0.6)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.lineDashOffset = -t * 24;
    ctx.beginPath();
    ctx.moveTo(40, 30);
    ctx.lineTo(canvasW - 20, 30);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#a855f7';
    ctx.font = '9px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('DATA LINK ACTIVE', 45, 27);
  }
}

// ===== 拖动交互 =====
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const scale = state.canvasScale;
  const ox = 60, oy = canvasH / 2;

  // 检查点击哪个设备
  const lensA = state.devices.find(d => d.id === 'lensA');
  const lensB = state.devices.find(d => d.id === 'lensB');
  const screen = state.devices.find(d => d.id === 'screen');

  if (lensA && lensA.connected) {
    const lx = ox + state.params.lensAPos.x * scale;
    if (Math.abs(mx - lx) < 20 && Math.abs(my - oy) < 40) {
      state.dragging = 'lensA';
      state.dragOffset = { x: mx - lx, y: my - oy };
      return;
    }
  }
  if (lensB && lensB.connected) {
    const bx = ox + state.params.lensBPos.x * scale;
    if (Math.abs(mx - bx) < 20 && Math.abs(my - oy) < 40) {
      state.dragging = 'lensB';
      state.dragOffset = { x: mx - bx, y: my - oy };
      return;
    }
  }
  if (screen && screen.connected) {
    const sx = ox + state.params.screenPos.x * scale;
    if (Math.abs(mx - sx) < 20 && Math.abs(my - oy) < 50) {
      state.dragging = 'screen';
      state.dragOffset = { x: mx - sx, y: my - oy };
      return;
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const scale = state.canvasScale;
  const ox = 60, oy = canvasH / 2;

  document.getElementById('coordDisplay').textContent =
    Math.round((mx - ox) / scale) + ', ' + Math.round((my - oy) / scale);

  if (state.dragging) {
    const newX = Math.max(50, Math.min(700, (mx - state.dragOffset.x - ox) / scale));
    if (state.dragging === 'lensA') {
      state.params.lensAPos.x = newX;
    } else if (state.dragging === 'lensB') {
      state.params.lensBPos.x = Math.max(state.params.lensAPos.x + 50, newX);
    } else if (state.dragging === 'screen') {
      state.params.screenPos.x = Math.max(state.params.lensBPos.x + 50, newX);
    }
    draw();
    updatePredictions();
  }
});

canvas.addEventListener('mouseup', () => {
  if (state.dragging) {
    addLog('data', '设备位置更新: ' + state.dragging + ' X=' + Math.round(state.params[state.dragging === 'screen' ? 'screenPos' : state.dragging + 'Pos'].x) + 'mm');
    state.dragging = null;
  }
});

canvas.addEventListener('mouseleave', () => {
  state.dragging = null;
});

// 滚轮调整角度
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const lensA = state.devices.find(d => d.id === 'lensA');
  if (lensA && lensA.connected && e.shiftKey) {
    state.params.rotA = Math.max(-30, Math.min(30, state.params.rotA + (e.deltaY > 0 ? 1 : -1)));
    document.getElementById('rotASlider').value = state.params.rotA;
    updateParams();
  }
}, { passive: false });

// ===== 日志系统 =====
function addLog(type, msg) {
  const content = document.getElementById('logContent');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  const now = new Date();
  const ts = now.toTimeString().substr(0, 8) + '.' + String(now.getMilliseconds()).padStart(3, '0');
  entry.innerHTML = '<span class="log-time">[' + ts + ']</span><span class="log-msg ' + type + '">' + msg + '</span>';
  content.appendChild(entry);
  content.scrollTop = content.scrollHeight;

  // 限制日志条数
  while (content.children.length > 200) {
    content.removeChild(content.firstChild);
  }
}

function clearLog() {
  document.getElementById('logContent').innerHTML = '';
  addLog('info', '日志已清空');
}

// ===== 实时数据流 =====
function toggleDataStream() {
  const btn = document.getElementById('logToggle');
  state.dataStreamActive = !state.dataStreamActive;
  if (state.dataStreamActive) {
    btn.classList.remove('stopped');
    btn.innerHTML = '&#9646;&#9646; 停止实时数据';
    startDataStream();
    addLog('success', '实时数据传输已启动');
  } else {
    btn.classList.add('stopped');
    btn.innerHTML = '&#9654; 开始实时数据';
    stopDataStream();
    addLog('warn', '实时数据传输已停止');
  }
}

function startDataStream() {
  if (state.dataStreamTimer) return;
  state.dataStreamTimer = setInterval(() => {
    const connected = state.devices.filter(d => d.connected && d.powered);
    if (connected.length === 0) return;
    const beam = computeBeam();
    const noise = (Math.random() - 0.5) * 0.5;
    const p = Math.max(0, beam.power + noise).toFixed(3);
    addLog('data', 'DATA|功率=' + p + 'mW|效率=' + (state.params.power > 0 ? (beam.power / state.params.power * 100).toFixed(1) : 0) + '%|光斑=' + beam.spotDiameter.toFixed(2) + 'mm|落点=' + beam.spotOffset.toFixed(1) + 'mm');
    updatePredictions();
  }, 1000);
}

function stopDataStream() {
  if (state.dataStreamTimer) {
    clearInterval(state.dataStreamTimer);
    state.dataStreamTimer = null;
  }
}

// ===== Toast =====
function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ===== 动画循环 =====
function animate() {
  draw();
  requestAnimationFrame(animate);
}

// ===== 初始化 =====
function init() {
  resizeCanvas();
  addLog('info', '系统初始化完成');
  addLog('info', '硬件联动控制台 v1.0 已就绪');
  addLog('warn', '请先扫描并连接设备');
  updateParams();
  startDataStream();
  animate();
}

// 兼容 roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    this.closePath();
    return this;
  };
}

init();
</script>
