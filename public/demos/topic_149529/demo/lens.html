<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凸透镜成像仿真实验</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0e1a;
    color: #e0e6ed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  /* 顶部工具栏 */
  .toolbar {
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: linear-gradient(180deg, #0f1525 0%, #0a0e1a 100%);
    border-bottom: 1px solid rgba(0, 212, 255, 0.15);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }
  .toolbar-left { display: flex; align-items: center; gap: 16px; }
  .back-link {
    color: #00d4ff;
    text-decoration: none;
    font-size: 14px;
    padding: 6px 12px;
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 6px;
    transition: all 0.2s;
  }
  .back-link:hover {
    background: rgba(0, 212, 255, 0.1);
    border-color: #00d4ff;
  }
  .title {
    font-size: 18px;
    font-weight: 600;
    background: linear-gradient(90deg, #00d4ff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }
  .reset-btn {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(0, 212, 255, 0.15));
    color: #e0e6ed;
    border: 1px solid rgba(168, 85, 247, 0.4);
    padding: 7px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .reset-btn:hover {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(0, 212, 255, 0.3));
    border-color: #a855f7;
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
  }
  /* 主体区域 */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .canvas-wrap {
    flex: 1;
    position: relative;
    padding: 12px;
    min-width: 0;
  }
  #canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: radial-gradient(ellipse at center, #0f1628 0%, #0a0e1a 70%);
    border: 1px solid rgba(0, 212, 255, 0.12);
    border-radius: 10px;
    cursor: default;
  }
  /* 右侧控制面板 */
  .panel {
    width: 290px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #0f1525 0%, #0b1020 100%);
    border-left: 1px solid rgba(0, 212, 255, 0.12);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .panel-section {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(0, 212, 255, 0.1);
    border-radius: 8px;
    padding: 14px;
  }
  .panel-section h3 {
    font-size: 13px;
    color: #00d4ff;
    margin-bottom: 12px;
    letter-spacing: 1px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel-section h3::before {
    content: '';
    width: 3px;
    height: 14px;
    background: linear-gradient(180deg, #00d4ff, #a855f7);
    border-radius: 2px;
  }
  .slider-row {
    margin-bottom: 10px;
  }
  .slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #8892a6;
    margin-bottom: 6px;
  }
  .slider-label .val {
    color: #00d4ff;
    font-weight: 600;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, rgba(0, 212, 255, 0.3), rgba(168, 85, 247, 0.3));
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00d4ff, #a855f7);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
    border: 2px solid #0a0e1a;
  }
  .data-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 12px;
    font-size: 13px;
  }
  .data-label {
    color: #8892a6;
  }
  .data-value {
    color: #e0e6ed;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    text-align: right;
  }
  .data-value.highlight {
    color: #00d4ff;
    font-weight: 600;
  }
  .data-value.purple {
    color: #a855f7;
    font-weight: 600;
  }
  .nature-box {
    margin-top: 12px;
    padding: 10px;
    background: rgba(0, 212, 255, 0.05);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.8;
  }
  .nature-box .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    margin-right: 4px;
    font-weight: 500;
  }
  .tag-real { background: rgba(0, 212, 255, 0.15); color: #00d4ff; border: 1px solid rgba(0, 212, 255, 0.3); }
  .tag-virtual { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
  .tag-none { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
  /* 底部提示 */
  .tips {
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #6b7590;
    background: #080c16;
    border-top: 1px solid rgba(0, 212, 255, 0.08);
    gap: 24px;
  }
  .tips span { display: flex; align-items: center; gap: 5px; }
  .tips .dot {
    width: 6px; height: 6px; border-radius: 50%;
  }
  .dot.cyan { background: #00d4ff; }
  .dot.purple { background: #a855f7; }
  .dot.red { background: #ef4444; }
  .dot.blue { background: #3b82f6; }

  /* 响应式 */
  @media (max-width: 900px) {
    .main { flex-direction: column; }
    .panel {
      width: 100%;
      max-height: 240px;
      border-left: none;
      border-top: 1px solid rgba(0, 212, 255, 0.12);
      flex-direction: row;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
    }
    .panel-section { flex: 1; min-width: 200px; }
    .tips { display: none; }
  }
  @media (max-width: 600px) {
    .title { font-size: 14px; }
    .back-link { padding: 4px 8px; font-size: 12px; }
    .reset-btn { padding: 5px 12px; font-size: 12px; }
    .panel { flex-direction: column; max-height: none; }
    .panel-section { min-width: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部工具栏 -->
  <div class="toolbar">
    <div class="toolbar-left">
      <a href="../index.html" class="back-link">← 返回首页</a>
      <div class="title">凸透镜成像仿真实验</div>
    </div>
    <button class="reset-btn" id="resetBtn">重置实验</button>
  </div>

  <!-- 主体 -->
  <div class="main">
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="panel">
      <!-- 参数调节 -->
      <div class="panel-section">
        <h3>参数调节</h3>
        <div class="slider-row">
          <div class="slider-label">
            <span>焦距 f</span>
            <span class="val"><span id="fVal">100</span> px</span>
          </div>
          <input type="range" id="fSlider" min="50" max="200" value="100" step="1">
        </div>
        <div class="slider-row">
          <div class="slider-label">
            <span>物体高度 h</span>
            <span class="val"><span id="hVal">80</span> px</span>
          </div>
          <input type="range" id="hSlider" min="20" max="140" value="80" step="1">
        </div>
      </div>

      <!-- 实时数据 -->
      <div class="panel-section">
        <h3>实时测量数据</h3>
        <div class="data-grid">
          <span class="data-label">物距 u</span>
          <span class="data-value highlight" id="uData">200 px</span>
          <span class="data-label">像距 v</span>
          <span class="data-value highlight" id="vData">—</span>
          <span class="data-label">焦距 f</span>
          <span class="data-value" id="fData">100 px</span>
          <span class="data-label">放大率 |m|</span>
          <span class="data-value purple" id="mData">—</span>
        </div>
        <div class="nature-box" id="natureBox">
          <span class="tag tag-real">实像</span>
          <span class="tag tag-real">倒立</span>
          <span class="tag tag-real">缩小</span>
        </div>
      </div>

      <!-- 物像关系说明 -->
      <div class="panel-section">
        <h3>成像规律</h3>
        <div style="font-size:12px; color:#8892a6; line-height:1.9;">
          <div>• u > 2f：倒立缩小实像</div>
          <div>• u = 2f：倒立等大实像</div>
          <div>• f < u < 2f：倒立放大实像</div>
          <div>• u = f：不成像（光线平行）</div>
          <div>• u < f：正立放大虚像</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部提示 -->
  <div class="tips">
    <span><i class="dot cyan"></i>青色：入射光线</span>
    <span><i class="dot purple"></i>紫色：折射光线</span>
    <span><i class="dot red"></i>红色：虚像/反向延长线</span>
    <span><i class="dot blue"></i>蓝色：实像</span>
    <span>提示：可用鼠标拖动物体箭头移动，调节滑块改变焦距</span>
  </div>
</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // UI 元素
  const fSlider = document.getElementById('fSlider');
  const hSlider = document.getElementById('hSlider');
  const fVal = document.getElementById('fVal');
  const hVal = document.getElementById('hVal');
  const uData = document.getElementById('uData');
  const vData = document.getElementById('vData');
  const fData = document.getElementById('fData');
  const mData = document.getElementById('mData');
  const natureBox = document.getElementById('natureBox');
  const resetBtn = document.getElementById('resetBtn');

  // 物理状态
  let f = 100;       // 焦距（像素）
  let u = 200;       // 物距（像素，物体到透镜距离，正值）
  let h = 80;        // 物体高度（像素，正值表示箭头向上）

  // 画布尺寸与中心
  let W = 0, H = 0, cx = 0, cy = 0;
  let dpr = window.devicePixelRatio || 1;

  // 拖动状态
  let dragging = false;
  let hoverObj = false;

  // 物体箭头的命中区域参数
  const ARROW_HEAD = 12;
  const ARROW_SHAFT = 5; // 箭杆命中半宽

  function resize() {
    const wrap = canvas.parentElement;
    const rect = wrap.getBoundingClientRect();
    W = rect.width - 24; // 减去padding
    H = rect.height - 24;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
    // 限制u和h在合理范围
    const maxU = Math.min(cx - 40, 380);
    const minU = 40;
    u = Math.max(minU, Math.min(maxU, u));
    h = Math.max(-140, Math.min(140, h));
    draw();
  }

  function reset() {
    f = 100;
    u = 200;
    h = 80;
    fSlider.value = f;
    hSlider.value = h;
    fVal.textContent = f;
    hVal.textContent = h;
    resize();
  }

  // ========== 物理计算 ==========
  // 薄透镜公式: 1/f = 1/u + 1/v => v = u*f/(u-f)
  // 返回 { v, m, hPrime, isReal, isVirtual, noImage }
  function computeImage() {
    const eps = 0.5;
    if (Math.abs(u - f) < eps) {
      return { v: Infinity, m: Infinity, hPrime: Infinity, isReal: false, isVirtual: false, noImage: true };
    }
    const v = (u * f) / (u - f);
    const m = -v / u; // 放大率
    const hPrime = m * h; // 像高（含符号，正表示正立在主轴上方）
    const isReal = v > 0;
    const isVirtual = v < 0;
    return { v, m, hPrime, isReal, isVirtual, noImage: false };
  }

  // ========== 绘制函数 ==========

  // 绘制网格背景
  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 212, 255, 0.04)';
    ctx.lineWidth = 1;
    const step = 40;
    for (let x = cx % step; x < W; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = cy % step; y < H; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 绘制主光轴
  function drawAxis() {
    ctx.save();
    // 主光轴
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(0, cy);
    ctx.lineTo(W, cy);
    ctx.stroke();
    ctx.setLineDash([]);

    // 光心小标记
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 绘制凸透镜
  function drawLens() {
    ctx.save();
    const lensH = Math.min(H * 0.7, 320);
    const halfH = lensH / 2;
    const lensW = 16; // 透镜厚度（视觉）

    // 透镜主体（椭圆形状的双凸效果）
    ctx.beginPath();
    ctx.moveTo(cx, cy - halfH);
    ctx.quadraticCurveTo(cx + lensW, cy - halfH * 0.5, cx + lensW * 0.5, cy);
    ctx.quadraticCurveTo(cx + lensW, cy + halfH * 0.5, cx, cy + halfH);
    ctx.quadraticCurveTo(cx - lensW, cy + halfH * 0.5, cx - lensW * 0.5, cy);
    ctx.quadraticCurveTo(cx - lensW, cy - halfH * 0.5, cx, cy - halfH);
    ctx.closePath();

    const grad = ctx.createLinearGradient(cx - lensW, 0, cx + lensW, 0);
    grad.addColorStop(0, 'rgba(0, 212, 255, 0.08)');
    grad.addColorStop(0.5, 'rgba(0, 212, 255, 0.2)');
    grad.addColorStop(1, 'rgba(168, 85, 247, 0.08)');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 透镜两端箭头标记（表示凸透镜）
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    const ah = 8;
    // 上端箭头
    ctx.beginPath();
    ctx.moveTo(cx - 6, cy - halfH + 6);
    ctx.lineTo(cx, cy - halfH);
    ctx.lineTo(cx + 6, cy - halfH + 6);
    ctx.stroke();
    // 下端箭头
    ctx.beginPath();
    ctx.moveTo(cx - 6, cy + halfH - 6);
    ctx.lineTo(cx, cy + halfH);
    ctx.lineTo(cx + 6, cy + halfH - 6);
    ctx.stroke();

    // 光心O标签
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('O', cx, cy + 18);

    ctx.restore();
  }

  // 绘制焦点 F, F' 和 2F, 2F'
  function drawFocalPoints() {
    ctx.save();
    const pts = [
      { x: cx - f, y: cy, label: 'F', color: '#a855f7' },
      { x: cx + f, y: cy, label: "F'", color: '#a855f7' },
      { x: cx - 2 * f, y: cy, label: '2F', color: 'rgba(168, 85, 247, 0.6)' },
      { x: cx + 2 * f, y: cy, label: "2F'", color: 'rgba(168, 85, 247, 0.6)' }
    ];
    pts.forEach(p => {
      // 只在画布内绘制
      if (p.x < 10 || p.x > W - 10) return;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = p.color;
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.label, p.x, cy - 10);
    });
    ctx.restore();
  }

  // 绘制物体箭头
  function drawObject() {
    ctx.save();
    // 物体底部（在主轴上的点）
    const bx = cx - u;
    const by = cy;
    // 物体顶端
    const tx = bx;
    const ty = cy - h;

    // 发光效果
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = hoverObj || dragging ? 14 : 6;

    // 箭杆
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    // 箭头头部
    const dir = h >= 0 ? -1 : 1; // 箭头指向：h>0向上(-y)，h<0向下(+y)
    ctx.fillStyle = '#00d4ff';
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - ARROW_HEAD * 0.6, ty + dir * ARROW_HEAD);
    ctx.lineTo(tx + ARROW_HEAD * 0.6, ty + dir * ARROW_HEAD);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;

    // 物体标签
    ctx.fillStyle = '#00d4ff';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('物', bx, by + 20);
    ctx.restore();
  }

  // 绘制像箭头
  function drawImage(info) {
    if (info.noImage) return;
    const { v, hPrime, isReal, isVirtual } = info;
    const bx = cx + v;
    const by = cy;
    const tx = bx;
    const ty = cy - hPrime;

    // 超出画布则不绘制（或绘制在边缘截断）
    if (bx < -50 || bx > W + 50) return;

    ctx.save();
    if (isReal) {
      // 实像：蓝色实线箭头，倒立
      ctx.shadowColor = '#3b82f6';
      ctx.shadowBlur = 8;
      ctx.strokeStyle = '#3b82f6';
      ctx.fillStyle = '#3b82f6';
    } else {
      // 虚像：红色虚线箭头，正立
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 8;
      ctx.strokeStyle = '#ef4444';
      ctx.fillStyle = '#ef4444';
      ctx.setLineDash([5, 4]);
    }
    ctx.lineWidth = 3;

    // 箭杆
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    // 箭头头部
    // 判断像箭头方向：hPrime>0（正立，顶端在上方），hPrime<0（倒立，顶端在下方）
    const dir = hPrime >= 0 ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - ARROW_HEAD * 0.6, ty + dir * ARROW_HEAD);
    ctx.lineTo(tx + ARROW_HEAD * 0.6, ty + dir * ARROW_HEAD);
    ctx.closePath();
    ctx.fill();

    ctx.setLineDash([]);
    ctx.shadowBlur = 0;

    // 标签
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(isReal ? '像' : '虚像', bx, by + 20);
    ctx.restore();
  }

  // 画一条带裁剪的线段
  function drawLine(x1, y1, x2, y2, style, dashed) {
    ctx.save();
    ctx.strokeStyle = style.color || '#fff';
    ctx.lineWidth = style.width || 1.5;
    if (style.shadow) {
      ctx.shadowColor = style.shadow;
      ctx.shadowBlur = style.shadowBlur || 6;
    }
    if (dashed) ctx.setLineDash(dashed);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // 将线段延伸到画布边界，从(x0,y0)沿方向(dx,dy)走，直到碰到画布边
  function extendToEdge(x0, y0, dx, dy) {
    if (dx === 0 && dy === 0) return { x: x0, y: y0 };
    let tMin = Infinity;
    // 左边界 x=0
    if (dx !== 0) {
      const t = (0 - x0) / dx;
      if (t > 0.001) { const yy = y0 + t * dy; if (yy >= 0 && yy <= H) tMin = Math.min(tMin, t); }
      const t2 = (W - x0) / dx;
      if (t2 > 0.001) { const yy = y0 + t2 * dy; if (yy >= 0 && yy <= H) tMin = Math.min(tMin, t2); }
    }
    // 上下边界 y=0, y=H
    if (dy !== 0) {
      const t = (0 - y0) / dy;
      if (t > 0.001) { const xx = x0 + t * dx; if (xx >= 0 && xx <= W) tMin = Math.min(tMin, t); }
      const t2 = (H - y0) / dy;
      if (t2 > 0.001) { const xx = x0 + t2 * dx; if (xx >= 0 && xx <= W) tMin = Math.min(tMin, t2); }
    }
    if (!isFinite(tMin)) return { x: x0, y: y0 };
    return { x: x0 + tMin * dx, y: y0 + tMin * dy };
  }

  // 绘制三条特殊光线
  function drawRays(info) {
    const { v, hPrime, isReal, isVirtual, noImage } = info;

    // 物体顶端
    const ox = cx - u;
    const oy = cy - h;

    // 入射光线样式（青色）
    const inStyle = { color: '#00d4ff', width: 1.8, shadow: '#00d4ff', shadowBlur: 4 };
    // 折射光线样式（紫色）
    const refStyle = { color: '#c084fc', width: 1.8, shadow: '#a855f7', shadowBlur: 4 };
    // 虚像反向延长线（红色虚线）
    const virtStyle = { color: '#ef4444', width: 1.2 };

    // 光线1：平行主光轴入射，折射后过右焦点F'
    {
      // 入射：从物体顶端水平到透镜
      const inEnd = { x: cx, y: oy };
      drawLine(ox, oy, inEnd.x, inEnd.y, inStyle);

      if (noImage) {
        // u=f：折射后过右焦点F'方向射出（与光线2平行，表明不成像）
        const dx1 = f, dy1 = h; // 方向：从(cx,oy)到(cx+f,cy)
        const outEnd = extendToEdge(inEnd.x, inEnd.y, dx1, dy1);
        drawLine(inEnd.x, inEnd.y, outEnd.x, outEnd.y, refStyle);
      } else {
        // 折射：从透镜点(inEnd)过右焦点F'(cx+f, cy)，继续延伸
        const dx = (cx + f) - inEnd.x; // = f
        const dy = cy - inEnd.y;       // = h (因为oy=cy-h, 所以inEnd.y=cy-h, dy=h)
        // 归一化方向
        const len = Math.sqrt(dx * dx + dy * dy);
        const ndx = dx / len, ndy = dy / len;
        // 实像时，折射光线到像点后继续延伸一点；虚像时，折射光线发散到画布边缘
        let outEnd;
        if (isReal) {
          // 像点在右侧，光线到像点
          outEnd = { x: cx + v, y: cy - hPrime };
          // 再延伸一点到画布边缘
          const ext = extendToEdge(outEnd.x, outEnd.y, ndx, ndy);
          drawLine(inEnd.x, inEnd.y, outEnd.x, outEnd.y, refStyle);
          drawLine(outEnd.x, outEnd.y, ext.x, ext.y, { color: 'rgba(192,132,252,0.3)', width: 1.2 });
        } else {
          // 虚像：折射光线发散到边缘
          outEnd = extendToEdge(inEnd.x, inEnd.y, ndx, ndy);
          drawLine(inEnd.x, inEnd.y, outEnd.x, outEnd.y, refStyle);
          // 反向延长线（虚线）到虚像点
          drawLine(inEnd.x, inEnd.y, cx + v, cy - hPrime, virtStyle, [4, 4]);
        }
      }
    }

    // 光线2：过光心，方向不变
    {
      // 从物体顶端经过光心(cx,cy)
      const dx = cx - ox;
      const dy = cy - oy;
      // 向两边延伸
      // 向左（物体侧）延伸到画布边
      const leftEnd = extendToEdge(ox, oy, -dx, -dy);
      drawLine(leftEnd.x, leftEnd.y, ox, oy, { color: 'rgba(0, 212, 255, 0.3)', width: 1 });
      // 入射段：物体顶端到光心
      drawLine(ox, oy, cx, cy, inStyle);

      if (noImage) {
        // u=f时方向继续到边缘
        const rightEnd = extendToEdge(cx, cy, dx, dy);
        drawLine(cx, cy, rightEnd.x, rightEnd.y, refStyle);
      } else {
        if (isReal) {
          // 实像：继续到像点，再延伸一点
          const imgPt = { x: cx + v, y: cy - hPrime };
          drawLine(cx, cy, imgPt.x, imgPt.y, refStyle);
          const ext = extendToEdge(imgPt.x, imgPt.y, dx, dy);
          drawLine(imgPt.x, imgPt.y, ext.x, ext.y, { color: 'rgba(192,132,252,0.3)', width: 1.2 });
        } else {
          // 虚像：折射方向继续到边缘（过光心后方向不变，但这是从透镜出射的光线）
          const rightEnd = extendToEdge(cx, cy, dx, dy);
          drawLine(cx, cy, rightEnd.x, rightEnd.y, refStyle);
          // 反向延长线（虚线）到虚像点
          drawLine(cx, cy, cx + v, cy - hPrime, virtStyle, [4, 4]);
        }
      }
    }

    // 光线3：过左焦点F入射（或其延长线过F），折射后平行主光轴
    {
      // 左焦点 F(cx-f, cy)
      const Fx = cx - f, Fy = cy;
      // 入射光线：连接物体顶端和左焦点方向，到达透镜上某点
      // 直线从(ox,oy)到(Fx,Fy)，求与x=cx的交点
      // 参数 t 使得 ox + t*(Fx-ox) = cx => t = (cx-ox)/(Fx-ox)
      const dx_f = Fx - ox;
      const dy_f = Fy - oy;
      let refractX = cx;
      let refractY;
      if (Math.abs(dx_f) < 0.001) {
        refractY = oy;
      } else {
        const t = (cx - ox) / dx_f;
        refractY = oy + t * dy_f;
      }

      // 入射段：从物体顶端到透镜折射点（u=f时退化不画）
      if (!noImage) {
        drawLine(ox, oy, refractX, refractY, inStyle);
      }

      // 如果入射光线需要延长线才能到达左焦点（物体在F内，即u<f时），画虚线
      if (u < f) {
        // 物体在焦点内，入射光线的延长线（向左虚线）过F
        drawLine(ox, oy, Fx, Fy, virtStyle, [4, 4]);
      }

      if (noImage) {
        // u=f时省略折射段，光线1和光线2已展示平行射出不成像
      } else {
        // 折射后平行于主光轴（水平向右）
        if (isReal) {
          const imgPt = { x: cx + v, y: cy - hPrime };
          // 折射光线水平到像点（验证：refractY 应等于 cy - hPrime）
          drawLine(refractX, refractY, imgPt.x, refractY, refStyle);
          const ext = extendToEdge(imgPt.x, refractY, 1, 0);
          drawLine(imgPt.x, refractY, ext.x, ext.y, { color: 'rgba(192,132,252,0.3)', width: 1.2 });
        } else {
          // 虚像：折射光线水平向右到边缘
          const outEnd = extendToEdge(refractX, refractY, 1, 0);
          drawLine(refractX, refractY, outEnd.x, outEnd.y, refStyle);
          // 反向延长线（虚线）水平向左到虚像点（虚像点的y应为refractY，即 cy - hPrime = refractY）
          drawLine(refractX, refractY, cx + v, refractY, virtStyle, [4, 4]);
        }
      }
    }
  }

  // 更新数据面板
  function updatePanel(info) {
    fVal.textContent = f;
    hVal.textContent = Math.round(h);
    uData.textContent = Math.round(u) + ' px';
    fData.textContent = f + ' px';

    if (info.noImage) {
      vData.textContent = '∞';
      mData.textContent = '∞';
      natureBox.innerHTML = '<span class="tag tag-none">不成像</span><span style="color:#f87171">光线经透镜后平行射出，不能成像</span>';
    } else {
      const { v, m, hPrime, isReal, isVirtual } = info;
      vData.textContent = (v > 0 ? '' : '-') + Math.round(Math.abs(v)) + ' px';
      mData.textContent = Math.abs(m).toFixed(2);

      let tags = '';
      if (isReal) {
        tags += '<span class="tag tag-real">实像</span>';
        tags += '<span class="tag tag-real">倒立</span>';
      } else {
        tags += '<span class="tag tag-virtual">虚像</span>';
        tags += '<span class="tag tag-virtual">正立</span>';
      }
      const absM = Math.abs(m);
      if (absM > 1.01) {
        tags += isReal ? '<span class="tag tag-real">放大</span>' : '<span class="tag tag-virtual">放大</span>';
      } else if (absM < 0.99) {
        tags += '<span class="tag tag-real">缩小</span>';
      } else {
        tags += '<span class="tag tag-real">等大</span>';
      }

      const posStr = isReal ? '像与物在透镜异侧' : '像与物在透镜同侧';
      natureBox.innerHTML = tags + '<div style="margin-top:6px;color:#8892a6;font-size:12px">' + posStr + '</div>';
    }
  }

  // 主绘制函数
  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    drawAxis();

    const info = computeImage();
    drawFocalPoints();
    drawRays(info);
    drawLens();
    drawObject();
    drawImage(info);
    updatePanel(info);
  }

  // ========== 交互 ==========

  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left),
      y: (e.clientY - rect.top)
    };
  }

  // 判断点是否在物体箭头上
  function hitObject(mx, my) {
    const bx = cx - u;
    const by = cy;
    const tx = bx;
    const ty = cy - h;
    const minY = Math.min(by, ty) - ARROW_HEAD;
    const maxY = Math.max(by, ty) + ARROW_HEAD;
    // 箭杆矩形区域 + 箭头三角区域（简化为矩形包围盒）
    if (mx < bx - ARROW_HEAD - 5 || mx > bx + ARROW_HEAD + 5) return false;
    if (my < minY - 5 || my > maxY + 5) return false;
    // 更精确：水平距离到箭杆
    const dx = Math.abs(mx - bx);
    if (dx > ARROW_HEAD + 5) return false;
    // 在箭头高度范围内
    if (my >= Math.min(ty, by) - ARROW_HEAD && my <= Math.max(ty, by) + ARROW_HEAD) {
      return true;
    }
    return false;
  }

  canvas.addEventListener('mousedown', function(e) {
    const pos = getMousePos(e);
    if (hitObject(pos.x, pos.y)) {
      dragging = true;
      canvas.style.cursor = 'grabbing';
    }
  });

  canvas.addEventListener('mousemove', function(e) {
    const pos = getMousePos(e);
    if (dragging) {
      // 物体底部在主轴上，x = cx - u => u = cx - pos.x
      let newU = cx - pos.x;
      const maxU = Math.min(cx - 30, 380);
      newU = Math.max(40, Math.min(maxU, newU));
      u = newU;
      // 物体高度：h = cy - pos.y（因为顶端y=cy-h => h=cy-y）
      let newH = cy - pos.y;
      newH = Math.max(-140, Math.min(140, newH));
      if (Math.abs(newH) < 20) newH = newH >= 0 ? 20 : -20;
      h = newH;
      // 同步hSlider
      hSlider.value = Math.round(Math.abs(h));
      draw();
    } else {
      const over = hitObject(pos.x, pos.y);
      if (over !== hoverObj) {
        hoverObj = over;
        canvas.style.cursor = over ? 'grab' : 'default';
        draw();
      }
    }
  });

  window.addEventListener('mouseup', function() {
    if (dragging) {
      dragging = false;
      canvas.style.cursor = hoverObj ? 'grab' : 'default';
    }
  });

  // 触摸支持
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const t = e.touches[0];
    const pos = getMousePos(t);
    if (hitObject(pos.x, pos.y)) {
      dragging = true;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (!dragging) return;
    const t = e.touches[0];
    const pos = getMousePos(t);
    let newU = cx - pos.x;
    const maxU = Math.min(cx - 30, 380);
    newU = Math.max(40, Math.min(maxU, newU));
    u = newU;
    let newH = cy - pos.y;
    newH = Math.max(-140, Math.min(140, newH));
    if (Math.abs(newH) < 20) newH = newH >= 0 ? 20 : -20;
    h = newH;
    hSlider.value = Math.round(Math.abs(h));
    draw();
  }, { passive: false });

  canvas.addEventListener('touchend', function() {
    dragging = false;
  });

  // 滑块事件
  fSlider.addEventListener('input', function() {
    f = parseInt(fSlider.value, 10);
    // 保证u和f的关系下物体仍在合理位置
    const maxU = Math.min(cx - 30, 380);
    u = Math.max(40, Math.min(maxU, u));
    draw();
  });

  hSlider.addEventListener('input', function() {
    const absH = parseInt(hSlider.value, 10);
    h = h >= 0 ? absH : -absH;
    draw();
  });

  resetBtn.addEventListener('click', reset);

  window.addEventListener('resize', resize);

  // 初始化
  resize();
})();
</script>
</body>
</html>
