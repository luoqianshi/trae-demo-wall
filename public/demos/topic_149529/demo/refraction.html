<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光的折射仿真实验 - Optics Sim Lab</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #111827;
    --bg-card: rgba(17, 24, 39, 0.85);
    --cyan: #00d4ff;
    --purple: #a855f7;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --border: rgba(0, 212, 255, 0.2);
    --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.4);
    --glow-purple: 0 0 20px rgba(168, 85, 247, 0.4);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* 顶部工具栏 */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: linear-gradient(180deg, rgba(0,212,255,0.06) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .back-link {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--cyan);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all 0.3s;
    background: rgba(0,212,255,0.05);
  }
  .back-link:hover {
    background: rgba(0,212,255,0.15);
    box-shadow: var(--glow-cyan);
  }

  .title {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-left: 8px;
  }

  /* 主内容区 */
  .main-content {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .canvas-container {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  #simCanvas {
    display: block;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #060a14;
    cursor: grab;
    max-width: 100%;
    max-height: 100%;
  }
  #simCanvas.dragging { cursor: grabbing; }

  /* 操作提示浮动层 */
  .hint-bubble {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 13px;
    color: var(--text-secondary);
    backdrop-filter: blur(10px);
    pointer-events: none;
    animation: fadeInOut 6s ease-in-out forwards;
    z-index: 5;
  }
  .hint-bubble .hl { color: var(--cyan); font-weight: 600; }

  @keyframes fadeInOut {
    0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    10% { opacity: 1; transform: translateX(-50%) translateY(0); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  }

  /* 公式卡片 */
  .formula-card {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    backdrop-filter: blur(12px);
    min-width: 220px;
    z-index: 5;
  }

  .formula-card h3 {
    font-size: 13px;
    color: var(--cyan);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .formula-card h3::before {
    content: '';
    width: 3px; height: 14px;
    background: linear-gradient(180deg, var(--cyan), var(--purple));
    border-radius: 2px;
  }

  .formula-main {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    padding: 10px 0;
    font-family: "Cambria Math", "Times New Roman", serif;
    font-style: italic;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }

  .formula-desc {
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-top: 6px;
  }
  .formula-desc .var {
    color: var(--cyan);
    font-family: "Cambria Math", serif;
    font-style: italic;
  }

  /* 底部控制面板 */
  .control-panel {
    flex-shrink: 0;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    backdrop-filter: blur(12px);
    z-index: 10;
  }

  .panel-grid {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 24px;
    align-items: center;
    max-width: 1400px;
    margin: 0 auto;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .control-label {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    min-width: 70px;
  }

  select {
    background: rgba(0,0,0,0.4);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    outline: none;
    transition: all 0.3s;
    min-width: 120px;
  }
  select:hover, select:focus {
    border-color: var(--cyan);
    box-shadow: var(--glow-cyan);
  }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 6px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; height: 18px;
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px var(--cyan), 0 0 20px rgba(0,212,255,0.3);
    transition: transform 0.2s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  .angle-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--cyan);
    min-width: 60px;
    text-align: right;
    font-family: "Cambria Math", serif;
  }
  .angle-value .deg { font-size: 12px; color: var(--text-secondary); font-weight: 400; }

  /* 数据显示区 */
  .data-panel {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .data-item {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    text-align: center;
    min-width: 80px;
  }

  .data-item .label {
    font-size: 10px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .data-item .value {
    font-size: 16px;
    font-weight: 700;
    font-family: "Cambria Math", "Courier New", monospace;
    margin-top: 2px;
  }

  .data-item.theta1 .value { color: var(--cyan); }
  .data-item.theta2 .value { color: var(--purple); }
  .data-item.reflect .value { color: #fbbf24; }
  .data-item.n1 .value { color: var(--cyan); }
  .data-item.n2 .value { color: var(--purple); }
  .data-item.critical .value { color: #f97316; }

  .data-item.tir {
    border-color: #ef4444;
    background: rgba(239,68,68,0.1);
    display: none;
  }
  .data-item.tir.active { display: block; }
  .data-item.tir .value {
    color: #ef4444;
    font-size: 13px;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* 介质标签 */
  .medium-label {
    position: absolute;
    font-size: 12px;
    color: var(--text-secondary);
    pointer-events: none;
    padding: 4px 10px;
    background: rgba(0,0,0,0.5);
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* 响应式 */
  @media (max-width: 900px) {
    .panel-grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .formula-card {
      position: static;
      margin: 10px;
      min-width: auto;
    }
    .main-content {
      flex-direction: column;
    }
    .canvas-container { padding: 6px; }
    .data-panel { justify-content: center; }
    .control-group { justify-content: center; }
    .slider-group { width: 100%; }
    .title { font-size: 16px; }
    .subtitle { display: none; }
  }

  @media (max-width: 600px) {
    .toolbar { padding: 10px 12px; }
    .control-panel { padding: 12px; }
    .data-item { min-width: 65px; padding: 5px 8px; }
    .data-item .value { font-size: 13px; }
    .formula-main { font-size: 16px; }
  }
</style>
</head>
<body>

<!-- 顶部工具栏 -->
<div class="toolbar">
  <div class="toolbar-left">
    <a href="../optics-sim-lab.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回首页
    </a>
    <span class="title">光的折射仿真实验</span>
    <span class="subtitle">Snell's Law Interactive Simulation</span>
  </div>
</div>

<!-- 主画布区 -->
<div class="main-content">
  <div class="canvas-container" id="canvasContainer">
    <canvas id="simCanvas"></canvas>
    <div class="hint-bubble">
      <span class="hl">提示：</span>拖动光源或使用滑块调整入射角，观察折射与全反射现象
    </div>

    <!-- 公式卡片 -->
    <div class="formula-card">
      <h3>斯涅尔定律</h3>
      <div class="formula-main">n₁ sin θ₁ = n₂ sin θ₂</div>
      <div class="formula-desc">
        <span class="var">n₁</span>, <span class="var">n₂</span> 为两种介质折射率<br>
        <span class="var">θ₁</span> 为入射角，<span class="var">θ₂</span> 为折射角<br>
        临界角：<span class="var">θ<sub>c</sub></span> = arcsin(n₂/n₁)
      </div>
    </div>
  </div>
</div>

<!-- 底部控制面板 -->
<div class="control-panel">
  <div class="panel-grid">
    <!-- 介质选择 -->
    <div class="control-group">
      <span class="control-label">介质2：</span>
      <select id="mediumSelect">
        <option value="1.00">空气 (n=1.00)</option>
        <option value="1.33" selected>水 (n=1.33)</option>
        <option value="1.50">玻璃 (n=1.50)</option>
        <option value="2.42">钻石 (n=2.42)</option>
      </select>
    </div>

    <!-- 入射角滑块 -->
    <div class="slider-group">
      <span class="control-label">入射角：</span>
      <input type="range" id="angleSlider" min="0" max="89" value="30" step="0.5">
      <span class="angle-value"><span id="angleDisplay">30.0</span><span class="deg">°</span></span>
    </div>

    <!-- 实时数据 -->
    <div class="data-panel">
      <div class="data-item theta1">
        <div class="label">θ₁ 入射角</div>
        <div class="value" id="dataTheta1">30.0°</div>
      </div>
      <div class="data-item theta2">
        <div class="label">θ₂ 折射角</div>
        <div class="value" id="dataTheta2">—</div>
      </div>
      <div class="data-item reflect">
        <div class="label">反射角</div>
        <div class="value" id="dataReflect">30.0°</div>
      </div>
      <div class="data-item n1">
        <div class="label">n₁</div>
        <div class="value" id="dataN1">1.00</div>
      </div>
      <div class="data-item n2">
        <div class="label">n₂</div>
        <div class="value" id="dataN2">1.33</div>
      </div>
      <div class="data-item critical">
        <div class="label">θ<sub>c</sub> 临界角</div>
        <div class="value" id="dataCritical">—</div>
      </div>
      <div class="data-item tir" id="dataTIR">
        <div class="label">状态</div>
        <div class="value">全反射！</div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ========== 画布初始化 ==========
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvasContainer');

  // 介质数据
  const MEDIA = {
    1.00: { name: '空气', color: 'rgba(100, 180, 255, 0.03)', label: '空气 n=1.00' },
    1.33: { name: '水',   color: 'rgba(0, 150, 255, 0.08)',   label: '水 n=1.33' },
    1.50: { name: '玻璃', color: 'rgba(200, 220, 255, 0.06)', label: '玻璃 n=1.50' },
    2.42: { name: '钻石', color: 'rgba(255, 255, 255, 0.1)',   label: '钻石 n=2.42' }
  };

  // 状态
  const state = {
    selectedN: 1.33,   // 下方介质（介质2）的折射率，始终由下拉框控制
    theta1: 30 * Math.PI / 180, // 入射角（弧度）
    fromAbove: true,   // 光源是否在上方（空气）
    lightSide: -1,     // 入射侧：-1=左侧, +1=右侧
    rayLength: 0,      // 光线长度（像素，动态计算）
    isDragging: false,
    width: 0,
    height: 0,
    interfaceY: 0,     // 分界面Y坐标
    centerX: 0,        // 入射点X坐标
    centerY: 0,        // 入射点Y坐标
    sourceX: 0,        // 光源位置
    sourceY: 0,
    animTime: 0
  };

  // 便捷属性：根据光源位置动态计算n1/n2
  function getN1() { return state.fromAbove ? 1.00 : state.selectedN; }
  function getN2() { return state.fromAbove ? state.selectedN : 1.00; }

  // ========== 尺寸调整 ==========
  function resize() {
    const rect = container.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.floor(rect.width - 20);
    const h = Math.floor(rect.height - 20);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    state.width = w;
    state.height = h;
    state.interfaceY = Math.floor(h * 0.45);
    state.centerX = Math.floor(w / 2);
    state.centerY = state.interfaceY;
    state.rayLength = Math.min(w, h) * 0.38;
    updateSourcePosition();
    draw();
  }

  // ========== 更新光源位置 ==========
  function updateSourcePosition() {
    const R = state.rayLength;
    const t = state.theta1;
    const h = state.lightSide;
    if (state.fromAbove) {
      // 光源在上方入射侧（h=-1时在左上方）
      state.sourceX = state.centerX + h * Math.sin(t) * R;
      state.sourceY = state.centerY - Math.cos(t) * R;
    } else {
      // 光源在下方入射侧（h=-1时在左下方）
      state.sourceX = state.centerX + h * Math.sin(t) * R;
      state.sourceY = state.centerY + Math.cos(t) * R;
    }
  }

  // ========== 物理计算 ==========
  function calcPhysics() {
    const n1 = getN1();
    const n2 = getN2();
    const t1 = state.theta1;
    const sinT1 = Math.sin(t1);
    const sinT2 = (n1 / n2) * sinT1;

    let t2 = null;
    let isTIR = false;
    let criticalAngle = null;

    // 临界角计算（仅当 n1 > n2，即光密到光疏）
    if (n1 > n2) {
      criticalAngle = Math.asin(n2 / n1);
      if (t1 >= criticalAngle) {
        isTIR = true;
      }
    }

    if (!isTIR) {
      t2 = Math.asin(Math.min(1, Math.max(-1, sinT2)));
    }

    return { theta1: t1, theta2: t2, reflectAngle: t1, n1, n2, isTIR, criticalAngle, sinT2 };
  }

  // ========== 绘制发光光线 ==========
  function drawGlowRay(x1, y1, x2, y2, color, width, intensity) {
    intensity = intensity || 1;
    // 外发光层
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 20 * intensity;
    ctx.globalAlpha = 0.3 * intensity;
    ctx.strokeStyle = color;
    ctx.lineWidth = width * 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();

    // 中发光层
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 10 * intensity;
    ctx.globalAlpha = 0.6 * intensity;
    ctx.strokeStyle = color;
    ctx.lineWidth = width * 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();

    // 核心光线
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 4;
    ctx.globalAlpha = intensity;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = width * 0.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();

    // 彩色核心
    ctx.save();
    ctx.globalAlpha = 0.9 * intensity;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  // ========== 绘制箭头 ==========
  function drawArrow(x, y, angle, color, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.5, -size * 0.5);
    ctx.lineTo(-size * 0.5, size * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ========== 绘制角度弧线 ==========
  function drawAngleArc(cx, cy, radius, startAngle, endAngle, counterclockwise, color, label, labelOffset) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.shadowColor = color;
    ctx.shadowBlur = 4;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, startAngle, endAngle, counterclockwise);
    ctx.stroke();
    ctx.restore();

    // 角度标签
    if (label) {
      const midAngle = (startAngle + endAngle) / 2;
      const lx = cx + Math.cos(midAngle) * labelOffset;
      const ly = cy + Math.sin(midAngle) * labelOffset;
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = '12px "Cambria Math", serif';
      ctx.font = 'bold 12px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = color;
      ctx.shadowBlur = 6;
      ctx.fillText(label, lx, ly);
      ctx.restore();
    }
  }

  // ========== 主绘制函数 ==========
  function draw() {
    const w = state.width;
    const h = state.height;
    const iy = state.interfaceY;
    const cx = state.centerX;
    const cy = state.centerY;
    const R = state.rayLength;
    const phys = calcPhysics();
    const t1 = phys.theta1;
    const t2 = phys.theta2;
    const isTIR = phys.isTIR;
    const fromAbove = state.fromAbove;
    const hSide = state.lightSide; // -1左, +1右

    // 清空画布
    ctx.clearRect(0, 0, w, h);

    // ===== 绘制背景 =====
    // 上方介质（空气）
    const bgGrad1 = ctx.createLinearGradient(0, 0, 0, iy);
    bgGrad1.addColorStop(0, '#060a14');
    bgGrad1.addColorStop(1, '#0c1628');
    ctx.fillStyle = bgGrad1;
    ctx.fillRect(0, 0, w, iy);

    // 下方介质
    const selKey = state.selectedN.toFixed(2);
    const mediumInfo = MEDIA[selKey] || MEDIA[state.selectedN.toFixed(1)] || MEDIA['1.33'];
    const bgGrad2 = ctx.createLinearGradient(0, iy, 0, h);
    bgGrad2.addColorStop(0, mediumInfo.color);
    bgGrad2.addColorStop(1, '#060a14');
    ctx.fillStyle = bgGrad2;
    ctx.fillRect(0, iy, w, h - iy);

    // 网格背景
    drawGrid(w, h, iy);

    // ===== 绘制分界面 =====
    ctx.save();
    // 发光线
    ctx.shadowColor = 'rgba(0, 212, 255, 0.5)';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(0, 212, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, iy);
    ctx.lineTo(w, iy);
    ctx.stroke();
    ctx.restore();

    // ===== 法线（虚线） =====
    ctx.save();
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(cx, Math.max(10, iy - R - 40));
    ctx.lineTo(cx, Math.min(h - 10, iy + R + 40));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // 法线标签
    ctx.save();
    ctx.fillStyle = 'rgba(148, 163, 184, 0.7)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('法线', cx + 6, iy - R - 25);
    ctx.restore();

    // ===== 介质标签 =====
    ctx.save();
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'left';
    const curN1 = getN1();
    const curN2 = getN2();
    // 上方始终是空气
    ctx.fillStyle = 'rgba(148, 163, 184, 0.8)';
    if (fromAbove) {
      ctx.fillText('▲ 介质1（入射）：空气 n₁=' + curN1.toFixed(2), 16, 28);
    } else {
      ctx.fillText('▲ 介质2（折射）：空气 n₂=' + curN2.toFixed(2), 16, 28);
    }
    // 下方始终是选中介质
    ctx.fillStyle = 'rgba(168, 85, 247, 0.9)';
    if (fromAbove) {
      ctx.fillText('▼ 介质2（折射）：' + mediumInfo.name + ' n₂=' + curN2.toFixed(2), 16, iy + 28);
    } else {
      ctx.fillText('▼ 介质1（入射）：' + mediumInfo.name + ' n₁=' + curN1.toFixed(2), 16, iy + 28);
    }
    ctx.restore();

    // ===== 计算光线端点 =====
    let incStart, incEnd = { x: cx, y: cy };
    let refEnd, refrEnd;
    // 入射光线方向向量
    const sinT1 = Math.sin(t1);
    const cosT1 = Math.cos(t1);

    if (fromAbove) {
      // 光源在上方：入射光线从上方向下到入射点
      incStart = { x: cx + hSide * sinT1 * R, y: cy - cosT1 * R };
      // 反射光线：向上方反射（法线另一侧）
      refEnd = { x: cx - hSide * sinT1 * R, y: cy - cosT1 * R };
      // 折射光线：向下方折射（法线另一侧）
      if (!isTIR && t2 !== null) {
        const sinT2v = Math.sin(t2);
        const cosT2v = Math.cos(t2);
        refrEnd = { x: cx - hSide * sinT2v * R, y: cy + cosT2v * R };
      }
    } else {
      // 光源在下方：入射光线从下方向上到入射点
      incStart = { x: cx + hSide * sinT1 * R, y: cy + cosT1 * R };
      // 反射光线：向下方反射（法线另一侧）
      refEnd = { x: cx - hSide * sinT1 * R, y: cy + cosT1 * R };
      // 折射光线：向上方折射（法线另一侧）
      if (!isTIR && t2 !== null) {
        const sinT2v = Math.sin(t2);
        const cosT2v = Math.cos(t2);
        refrEnd = { x: cx - hSide * sinT2v * R, y: cy - cosT2v * R };
      }
    }

    // ===== 绘制光线 =====
    // 入射光线（青色）
    drawGlowRay(incStart.x, incStart.y, incEnd.x, incEnd.y, '#00d4ff', 2.5, 1);

    // 反射光线（橙黄色，全反射时高亮加粗）
    const reflectIntensity = isTIR ? 1.8 : 0.7;
    const reflectWidth = isTIR ? 4 : 2;
    drawGlowRay(incEnd.x, incEnd.y, refEnd.x, refEnd.y, isTIR ? '#ff4444' : '#fbbf24', reflectWidth, reflectIntensity);

    // 折射光线（紫色）
    if (!isTIR && refrEnd) {
      drawGlowRay(incEnd.x, incEnd.y, refrEnd.x, refrEnd.y, '#a855f7', 2.5, 1);
    }

    // ===== 光线箭头（表示方向）=====
    const arrowDist = R * 0.5;
    // 入射光线箭头（在中点，指向入射点方向）
    if (fromAbove) {
      // 从S到P：水平分量 -hSide*sinT1（向右当hSide=-1），垂直分量 cosT1（向下）
      const ax = cx + hSide * sinT1 * arrowDist;
      const ay = cy - cosT1 * arrowDist;
      const aAngle = Math.atan2(cosT1, -hSide * sinT1);
      drawArrow(ax, ay, aAngle, '#00d4ff', 7);
    } else {
      const ax = cx + hSide * sinT1 * arrowDist;
      const ay = cy + cosT1 * arrowDist;
      const aAngle = Math.atan2(-cosT1, -hSide * sinT1);
      drawArrow(ax, ay, aAngle, '#00d4ff', 7);
    }

    // 反射光线箭头（从P向外）
    if (fromAbove) {
      const ax = cx - hSide * sinT1 * arrowDist;
      const ay = cy - cosT1 * arrowDist;
      const aAngle = Math.atan2(-cosT1, -hSide * sinT1);
      drawArrow(ax, ay, aAngle, isTIR ? '#ff4444' : '#fbbf24', isTIR ? 9 : 6);
    } else {
      const ax = cx - hSide * sinT1 * arrowDist;
      const ay = cy + cosT1 * arrowDist;
      const aAngle = Math.atan2(cosT1, -hSide * sinT1);
      drawArrow(ax, ay, aAngle, isTIR ? '#ff4444' : '#fbbf24', isTIR ? 9 : 6);
    }

    // 折射光线箭头（从P向外）
    if (!isTIR && refrEnd) {
      const sinT2v = Math.sin(t2);
      const cosT2v = Math.cos(t2);
      if (fromAbove) {
        const ax = cx - hSide * sinT2v * arrowDist;
        const ay = cy + cosT2v * arrowDist;
        const aAngle = Math.atan2(cosT2v, -hSide * sinT2v);
        drawArrow(ax, ay, aAngle, '#a855f7', 7);
      } else {
        const ax = cx - hSide * sinT2v * arrowDist;
        const ay = cy - cosT2v * arrowDist;
        const aAngle = Math.atan2(-cosT2v, -hSide * sinT2v);
        drawArrow(ax, ay, aAngle, '#a855f7', 7);
      }
    }

    // ===== 角度弧线标注 =====
    const arcR = 45;
    const arcLabelR = 62;
    const t1Deg = (t1 * 180 / Math.PI).toFixed(1);

    if (fromAbove) {
      // 光源在上方入射
      // 入射光线方向（从P指向S）：(hSide*sinT1, -cosT1)
      const incAng = Math.atan2(-cosT1, hSide * sinT1);
      // 法线向上方向
      const normUpAng = -Math.PI / 2;
      // 反射光线方向（从P指向refEnd）：(-hSide*sinT1, -cosT1)
      const refAng = Math.atan2(-cosT1, -hSide * sinT1);

      // 入射角弧线：在入射光线与向上法线之间
      if (hSide < 0) {
        // 左侧入射：入射光线在法线逆时针侧
        drawAngleArc(cx, cy, arcR, incAng, normUpAng, false, '#00d4ff', 'θ₁=' + t1Deg + '°', arcLabelR);
      } else {
        // 右侧入射：入射光线在法线顺时针侧
        drawAngleArc(cx, cy, arcR, normUpAng, incAng, false, '#00d4ff', 'θ₁=' + t1Deg + '°', arcLabelR);
      }

      // 反射角弧线：在反射光线与向上法线之间
      if (hSide < 0) {
        drawAngleArc(cx, cy, arcR + 12, normUpAng, refAng, false, '#fbbf24', null, 0);
      } else {
        drawAngleArc(cx, cy, arcR + 12, refAng, normUpAng, false, '#fbbf24', null, 0);
      }

      // 折射角弧线
      if (!isTIR && t2 !== null) {
        const t2Deg = (t2 * 180 / Math.PI).toFixed(1);
        const sinT2v = Math.sin(t2);
        const cosT2v = Math.cos(t2);
        // 折射光线方向（从P指向refrEnd）：(-hSide*sinT2, cosT2)
        const refrAng = Math.atan2(cosT2v, -hSide * sinT2v);
        const normDownAng = Math.PI / 2;
        if (hSide < 0) {
          drawAngleArc(cx, cy, arcR, refrAng, normDownAng, false, '#a855f7', 'θ₂=' + t2Deg + '°', arcLabelR);
        } else {
          drawAngleArc(cx, cy, arcR, normDownAng, refrAng, false, '#a855f7', 'θ₂=' + t2Deg + '°', arcLabelR);
        }
      }
    } else {
      // 光源在下方入射
      // 入射光线方向（从P指向S）：(hSide*sinT1, cosT1)
      const incAng = Math.atan2(cosT1, hSide * sinT1);
      const normDownAng = Math.PI / 2;
      // 反射光线方向：(-hSide*sinT1, cosT1)
      const refAng = Math.atan2(cosT1, -hSide * sinT1);

      // 入射角弧线
      if (hSide < 0) {
        drawAngleArc(cx, cy, arcR, normDownAng, incAng, false, '#00d4ff', 'θ₁=' + t1Deg + '°', arcLabelR);
      } else {
        drawAngleArc(cx, cy, arcR, incAng, normDownAng, false, '#00d4ff', 'θ₁=' + t1Deg + '°', arcLabelR);
      }

      // 反射角弧线
      if (hSide < 0) {
        drawAngleArc(cx, cy, arcR + 12, refAng, normDownAng, false, '#fbbf24', null, 0);
      } else {
        drawAngleArc(cx, cy, arcR + 12, normDownAng, refAng, false, '#fbbf24', null, 0);
      }

      // 折射角弧线（向上进入空气）
      if (!isTIR && t2 !== null) {
        const t2Deg = (t2 * 180 / Math.PI).toFixed(1);
        const sinT2v = Math.sin(t2);
        const cosT2v = Math.cos(t2);
        // 折射光线方向：(-hSide*sinT2, -cosT2)
        const refrAng = Math.atan2(-cosT2v, -hSide * sinT2v);
        const normUpAng = -Math.PI / 2;
        if (hSide < 0) {
          drawAngleArc(cx, cy, arcR, normUpAng, refrAng, false, '#a855f7', 'θ₂=' + t2Deg + '°', arcLabelR);
        } else {
          drawAngleArc(cx, cy, arcR, refrAng, normUpAng, false, '#a855f7', 'θ₂=' + t2Deg + '°', arcLabelR);
        }
      }
    }

    // ===== 入射点 =====
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ===== 光源（可拖动）=====
    drawLightSource(state.sourceX, state.sourceY);

    // ===== 全反射警告 =====
    if (isTIR) {
      ctx.save();
      ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
      ctx.fillRect(0, fromAbove ? 0 : iy, w, fromAbove ? iy : h - iy);
      ctx.restore();

      ctx.save();
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = '#ef4444';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.fillText('⚠ 全反射 Total Internal Reflection', cx, fromAbove ? 55 : iy + 55);
      ctx.restore();
    }

    // ===== 介质分界面纹理 =====
    drawInterfaceTexture(w, iy);
  }

  // ========== 绘制网格 ==========
  function drawGrid(w, h, iy) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 212, 255, 0.04)';
    ctx.lineWidth = 1;
    const step = 40;
    for (let x = 0; x < w; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.restore();
  }

  // ========== 绘制分界面纹理 ==========
  function drawInterfaceTexture(w, iy) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 212, 255, 0.15)';
    ctx.lineWidth = 1;
    const t = state.animTime * 0.001;
    for (let x = 0; x < w; x += 30) {
      const wave = Math.sin(x * 0.02 + t) * 2;
      ctx.beginPath();
      ctx.moveTo(x, iy + wave);
      ctx.lineTo(x + 15, iy + wave + Math.sin((x+15)*0.02 + t) * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ========== 绘制光源 ==========
  function drawLightSource(x, y) {
    // 外发光
    const grd = ctx.createRadialGradient(x, y, 0, x, y, 30);
    grd.addColorStop(0, 'rgba(0, 212, 255, 0.6)');
    grd.addColorStop(0.3, 'rgba(0, 212, 255, 0.2)');
    grd.addColorStop(1, 'rgba(0, 212, 255, 0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, 30, 0, Math.PI * 2);
    ctx.fill();

    // 光源本体
    ctx.save();
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#00d4ff';
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 拖动提示
    ctx.save();
    ctx.fillStyle = 'rgba(226, 232, 240, 0.6)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('◉ 拖动光源', x, y - 22);
    ctx.restore();
  }

  // ========== 更新UI数据 ==========
  function updateUI() {
    const phys = calcPhysics();
    const t1Deg = (phys.theta1 * 180 / Math.PI);
    const slider = document.getElementById('angleSlider');
    slider.value = t1Deg.toFixed(1);
    document.getElementById('angleDisplay').textContent = t1Deg.toFixed(1) + '°';
    document.getElementById('dataTheta1').textContent = t1Deg.toFixed(1) + '°';
    document.getElementById('dataReflect').textContent = t1Deg.toFixed(1) + '°';

    if (phys.isTIR) {
      document.getElementById('dataTheta2').textContent = '全反射';
      document.getElementById('dataTheta2').style.color = '#ef4444';
      document.getElementById('dataTIR').classList.add('active');
    } else if (phys.theta2 !== null) {
      const t2Deg = (phys.theta2 * 180 / Math.PI);
      document.getElementById('dataTheta2').textContent = t2Deg.toFixed(1) + '°';
      document.getElementById('dataTheta2').style.color = '#a855f7';
      document.getElementById('dataTIR').classList.remove('active');
    } else {
      document.getElementById('dataTheta2').textContent = '—';
      document.getElementById('dataTIR').classList.remove('active');
    }

    // 临界角
    if (phys.criticalAngle !== null) {
      const cDeg = (phys.criticalAngle * 180 / Math.PI);
      document.getElementById('dataCritical').textContent = cDeg.toFixed(1) + '°';
    } else {
      document.getElementById('dataCritical').textContent = '不存在';
    }

    document.getElementById('dataN1').textContent = phys.n1.toFixed(2);
    document.getElementById('dataN2').textContent = phys.n2.toFixed(2);
  }

  // ========== 事件处理 ==========
  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function hitLightSource(pos) {
    const dx = pos.x - state.sourceX;
    const dy = pos.y - state.sourceY;
    return dx * dx + dy * dy < 900; // 30px半径
  }

  function setAngleFromPosition(pos) {
    const dx = state.centerX - pos.x;
    const dy = state.centerY - pos.y;

    // 判断光源在上方还是下方
    state.fromAbove = dy > 0; // dy>0 表示 pos.y < centerY，在上方

    // 计算入射方向（水平侧）
    // dx = centerX - pos.x，如果dx > 0，pos.x < centerX，光源在左侧，hSide = -1
    state.lightSide = dx >= 0 ? -1 : 1;

    // 计算入射角（与法线的夹角）
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return;

    // sin(theta1) = |水平分量| / 距离
    const sinT1 = Math.abs(dx) / dist;
    let theta1 = Math.asin(Math.min(1, sinT1));

    // 限制角度范围 0° - 89°
    theta1 = Math.max(0, Math.min(89 * Math.PI / 180, theta1));
    state.theta1 = theta1;

    updateSourcePosition();
    updateUI();
  }

  // 鼠标/触摸事件
  canvas.addEventListener('mousedown', function(e) {
    const pos = getCanvasPos(e);
    if (hitLightSource(pos)) {
      state.isDragging = true;
      canvas.classList.add('dragging');
      e.preventDefault();
    }
  });

  canvas.addEventListener('mousemove', function(e) {
    const pos = getCanvasPos(e);
    if (state.isDragging) {
      setAngleFromPosition(pos);
      e.preventDefault();
    } else {
      canvas.style.cursor = hitLightSource(pos) ? 'grab' : 'default';
    }
  });

  canvas.addEventListener('mouseup', function() {
    state.isDragging = false;
    canvas.classList.remove('dragging');
  });

  canvas.addEventListener('mouseleave', function() {
    state.isDragging = false;
    canvas.classList.remove('dragging');
  });

  // 触摸支持
  canvas.addEventListener('touchstart', function(e) {
    const pos = getCanvasPos(e);
    if (hitLightSource(pos)) {
      state.isDragging = true;
      e.preventDefault();
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    if (state.isDragging) {
      const pos = getCanvasPos(e);
      setAngleFromPosition(pos);
      e.preventDefault();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function() {
    state.isDragging = false;
  });

  // 滑块事件
  document.getElementById('angleSlider').addEventListener('input', function(e) {
    const deg = parseFloat(e.target.value);
    state.theta1 = deg * Math.PI / 180;
    // 滑块控制时，保持光源在上方（默认演示模式）
    state.fromAbove = true;
    state.lightSide = -1; // 默认左侧入射
    updateSourcePosition();
    updateUI();
  });

  // 介质选择事件
  document.getElementById('mediumSelect').addEventListener('change', function(e) {
    state.selectedN = parseFloat(e.target.value);
    updateUI();
  });

  // 点击画布任意位置移动光源（可选增强）
  canvas.addEventListener('dblclick', function(e) {
    const pos = getCanvasPos(e);
    setAngleFromPosition(pos);
  });

  // 窗口调整
  window.addEventListener('resize', resize);

  // ========== 动画循环 ==========
  function animate(t) {
    state.animTime = t;
    draw();
    requestAnimationFrame(animate);
  }

  // ========== 初始化 ==========
  resize();
  updateUI();
  // 默认左侧入射，上方
  state.lightSide = -1;
  state.fromAbove = true;
  updateSourcePosition();
  updateUI();
  requestAnimationFrame(animate);

})();
</script>
</body>
</html>
