<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>剧变 — AI悬疑推理小说游戏 Demo</title>
<style>
/* ===== 全局重置 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  background: #0a0a0a;
  color: #f5ead6;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 20px 0;
}

/* ===== 手机外框（模拟 iPhone 12） ===== */
.phone-frame {
  width: 390px;
  min-height: 844px;
  background: linear-gradient(180deg, #08080a 0%, #181514 100%);
  border-radius: 40px;
  border: 8px solid #1a1a1a;
  box-shadow: 0 0 60px rgba(201, 169, 110, 0.15), 0 20px 60px rgba(0, 0, 0, 0.6);
  overflow: hidden;
  position: relative;
}

/* 状态栏模拟 */
.phone-statusbar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  font-size: 13px;
  font-weight: 600;
  color: #f5ead6;
  background: transparent;
  position: relative;
  z-index: 100;
}

.phone-statusbar .notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 24px;
  background: #000;
  border-radius: 0 0 16px 16px;
}

/* ===== 页面容器 ===== */
.page {
  display: none;
  min-height: calc(844px - 44px);
  padding: 20px 16px 40px;
  flex-direction: column;
  align-items: center;
}
.page.active { display: flex; }

/* ===== 首页 ===== */
.home-header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
.home-label { color: #b98748; font-size: 11px; letter-spacing: 5px; }
.home-title { margin-top: 8px; color: #f5ead6; font-size: 40px; font-weight: 700; letter-spacing: 12px; }
.home-subtitle { margin-top: 12px; color: rgba(245, 234, 214, 0.7); font-size: 14px; line-height: 1.65; padding: 0 20px; }

.mode-cards { width: 100%; max-width: 350px; margin-bottom: 30px; }
.mode-card {
  width: 100%; padding: 20px 18px; margin-bottom: 14px;
  border: 1px solid rgba(245, 234, 214, 0.15); border-radius: 10px;
  background: rgba(28, 27, 32, 0.94);
  display: flex; align-items: center; position: relative; cursor: pointer;
  transition: all 0.2s;
}
.mode-card:active { opacity: 0.86; }
.mode-card:hover { border-color: rgba(201, 169, 110, 0.5); }
.mode-card-icon { font-size: 28px; margin-right: 14px; flex-shrink: 0; }
.mode-card-info { flex: 1; }
.mode-card-title { color: #f5ead6; font-size: 18px; font-weight: 700; }
.mode-card-desc { color: rgba(245, 234, 214, 0.6); font-size: 13px; margin-top: 4px; }
.mode-card-arrow { position: absolute; right: 18px; color: rgba(245, 234, 214, 0.3); font-size: 18px; }
.mystery-card { border-left: 4px solid #c9a96e; }

.demo-badge {
  margin-top: 10px;
  padding: 6px 14px;
  font-size: 11px;
  color: #7ab8e8;
  border: 1px solid rgba(122, 184, 232, 0.3);
  border-radius: 999px;
  background: rgba(122, 184, 232, 0.08);
}

/* ===== 选择页 ===== */
.select-header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
.select-title { color: #f5ead6; font-size: 24px; font-weight: 700; letter-spacing: 8px; }
.select-subtitle { margin-top: 9px; color: rgba(245, 234, 214, 0.6); font-size: 14px; line-height: 1.65; }

.template-scroll { width: 100%; margin-bottom: 30px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.template-scroll::-webkit-scrollbar { display: none; }

.template-card {
  display: inline-block; width: 130px; margin-right: 12px; padding: 16px 12px;
  border: 1px solid rgba(245, 234, 214, 0.15); border-radius: 8px;
  background: rgba(28, 27, 32, 0.94); vertical-align: top; cursor: pointer; transition: all 0.2s;
}
.template-card:last-child { margin-right: 0; }
.template-card.selected { border: 2px solid #c9a96e; background: rgba(201, 169, 110, 0.08); }
.template-id { color: rgba(245, 234, 214, 0.4); font-size: 11px; margin-bottom: 6px; }
.template-title { color: #f5ead6; font-size: 14px; font-weight: 600; line-height: 1.4; white-space: normal; }

.start-btn {
  width: 200px; margin-top: 10px; padding: 0; color: #101010; font-size: 16px; line-height: 2.8;
  border: none; border-radius: 11px;
  background: linear-gradient(180deg, #d1a365 0%, #9a6a35 100%);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3); cursor: pointer; transition: opacity 0.15s;
}
.start-btn:active { opacity: 0.86; }

.ai-random-section { width: 100%; margin-top: 24px; display: flex; flex-direction: column; align-items: center; }
.ai-divider { display: flex; align-items: center; width: 100%; margin-bottom: 16px; }
.ai-divider-line { flex: 1; height: 1px; background: rgba(245, 234, 214, 0.1); }
.ai-divider-text { color: rgba(245, 234, 214, 0.35); font-size: 12px; padding: 0 12px; }

.ai-random-btn {
  width: 280px; padding: 16px 20px; border-radius: 10px;
  background: linear-gradient(135deg, rgba(122, 184, 232, 0.15) 0%, rgba(90, 140, 200, 0.1) 100%);
  border: 1px solid rgba(122, 184, 232, 0.3); cursor: pointer; transition: all 0.2s;
}
.ai-random-btn:active { opacity: 0.86; }
.ai-btn-content { display: flex; align-items: center; gap: 10px; }
.ai-btn-icon { font-size: 24px; }
.ai-btn-text { display: flex; flex-direction: column; align-items: flex-start; }
.ai-btn-title { color: #7ab8e8; font-size: 16px; font-weight: 600; }
.ai-btn-desc { color: rgba(122, 184, 232, 0.6); font-size: 11px; margin-top: 3px; }

/* ===== 游戏页 ===== */
.game-container { padding: 20px 16px 40px; width: 100%; }

.header { position: relative; padding: 10px 0 17px; }
.exit-btn {
  position: absolute; top: 8px; right: 0; padding: 6px 14px; color: #f5ead6; font-size: 13px;
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(245, 234, 214, 0.25);
  border-radius: 8px; cursor: pointer; transition: all 0.2s ease; z-index: 10;
}
.exit-btn:hover { background: rgba(255, 107, 107, 0.2); border-color: rgba(255, 107, 107, 0.5); color: #ff9e9e; }

.label { color: #b98748; font-size: 11px; letter-spacing: 5px; }
.title { margin-top: 8px; color: #f5ead6; font-size: 32px; font-weight: 700; letter-spacing: 8px; cursor: default; user-select: none; }
.subtitle { margin-top: 9px; color: rgba(245, 234, 214, 0.7); font-size: 14px; line-height: 1.65; }
.mode { display: inline-block; margin-top: 11px; padding: 4px 9px; color: #e7c18f; font-size: 11.5px; border: 1px solid rgba(185, 135, 72, 0.5); border-radius: 999px; background: rgba(185, 135, 72, 0.12); }
.template-title-tag { display: inline-block; margin-top: 6px; margin-left: 8px; padding: 3px 8px; color: #c9a96e; font-size: 11px; border: 1px solid rgba(201, 169, 110, 0.4); border-radius: 999px; background: rgba(201, 169, 110, 0.08); }

.story-box {
  min-height: 260px; margin-bottom: 16px; padding: 24px 16px;
  border: 1px solid #444; border-left: 4px solid #c9a96e; border-radius: 12px;
  background: #262626; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.36); cursor: pointer;
}
.story-text { color: #e0d6c2; font-size: 15px; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }

.story-nav { display: flex; align-items: center; gap: 9px; margin: -6px 0 14px; }
.nav-btn { flex: 1; padding: 0; color: #f5ead6; font-size: 12.5px; line-height: 2.4; border-radius: 999px; background: rgba(185, 135, 72, 0.22); border: 1px solid rgba(231, 193, 143, 0.24); cursor: pointer; transition: all 0.15s; }
.nav-btn:active { opacity: 0.86; }
.nav-btn:disabled { color: rgba(245, 234, 214, 0.28); background: rgba(245, 234, 214, 0.06); cursor: not-allowed; }
.story-progress { min-width: 46px; color: rgba(245, 234, 214, 0.56); font-size: 12px; text-align: center; }

.choice-btn {
  display: block; width: 100%; margin: 0 0 11px; padding: 0; color: #c9a96e; font-size: 14.5px; line-height: 2.8;
  border-radius: 24px; background: transparent; border: 1px solid #c9a96e; cursor: pointer; transition: all 0.15s; text-align: center;
}
.choice-btn:hover { background-color: #c9a96e; color: #1a1a1a; }
.choice-btn:active { opacity: 0.86; }

.loading { margin: 15px 0; padding: 12px; color: #e7c18f; font-size: 15px; text-align: center; border-radius: 9px; background: rgba(245, 234, 214, 0.08); }
@keyframes dotBlink { 0%, 20% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 1; } }
.loading-dot { animation: dotBlink 1.4s infinite; }
.loading-dot:nth-child(1) { animation-delay: 0s; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }

.ending-container { animation: fadeIn 0.8s ease forwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.ending-title { margin: 17px 0 9px; color: #c9a96e; font-size: 21px; font-weight: 700; text-align: center; animation: fadeIn 0.8s ease forwards; }
.ending-story { display: block; padding: 14px; color: rgba(245, 234, 214, 0.78); font-size: 13.5px; line-height: 1.7; border-radius: 11px; background: rgba(245, 234, 214, 0.06); white-space: pre-wrap; }
.restart-btn { display: block; width: 100%; margin-top: 15px; padding: 12px 0; color: #101010; font-size: 15px; border: none; border-radius: 11px; background: #e7c18f; cursor: pointer; transition: opacity 0.15s; }
.restart-btn:active { opacity: 0.86; }

.hint { margin-top: 13px; color: rgba(245, 234, 214, 0.42); font-size: 12px; line-height: 1.6; text-align: center; }

/* ===== Toast 提示 ===== */
.toast {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  padding: 12px 24px; background: rgba(0, 0, 0, 0.85); border: 1px solid #444;
  border-radius: 8px; color: #e7c18f; font-size: 14px; z-index: 1000; text-align: center; pointer-events: none;
  display: none;
}
.toast.show { display: block; }

/* ===== 演示提示条 ===== */
.demo-notice {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 8px 16px; text-align: center;
  background: rgba(122, 184, 232, 0.1); border-top: 1px solid rgba(122, 184, 232, 0.2);
  color: rgba(122, 184, 232, 0.7); font-size: 11px;
}
</style>
</head>
<body>

<!-- ===== 手机外框 ===== -->
<div class="phone-frame">

  <!-- 状态栏 -->
  <div class="phone-statusbar">
    <span id="statusTime">9:41</span>
    <div class="notch"></div>
    <span>●●● 100%</span>
  </div>

  <!-- ===== 首页 ===== -->
  <div class="page active" id="page-home">
    <div class="home-header">
      <div class="home-label">AI INTERACTIVE MYSTERY</div>
      <div class="home-title">剧变</div>
      <div class="home-subtitle">密室、古籍、谎言与机关。你是唯一能拆开真相的人。</div>
    </div>
    <div class="mode-cards">
      <div class="mode-card mystery-card" onclick="goToSelect()">
        <div class="mode-card-icon">&#128269;</div>
        <div class="mode-card-info">
          <div class="mode-card-title">悬疑推理</div>
          <div class="mode-card-desc">化身侦探，破解谜案</div>
        </div>
        <div class="mode-card-arrow">&#10095;</div>
      </div>
    </div>
    <div class="demo-badge">Demo 演示版 · 完整 AI 版请下载桌面应用</div>
  </div>

  <!-- ===== 选择页 ===== -->
  <div class="page" id="page-select">
    <div class="select-header">
      <div class="select-title">选择剧本</div>
      <div class="select-subtitle">每个剧本都有独特的真相等你揭开</div>
    </div>
    <div class="template-scroll" id="templateScroll"></div>
    <button class="start-btn" onclick="startGame()">开始调查</button>
    <div class="ai-random-section">
      <div class="ai-divider">
        <div class="ai-divider-line"></div>
        <div class="ai-divider-text">或</div>
        <div class="ai-divider-line"></div>
      </div>
      <div class="ai-random-btn" onclick="showAiTip()">
        <div class="ai-btn-content">
          <span class="ai-btn-icon">&#127922;</span>
          <div class="ai-btn-text">
            <span class="ai-btn-title">AI 随机生成案件</span>
            <span class="ai-btn-desc">每次都不一样 · 由 AI 原创剧情</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 游戏页 ===== -->
  <div class="page" id="page-game">
    <div class="game-container">
      <div class="header">
        <button class="exit-btn" onclick="exitGame()">&#10005; 退出</button>
        <div class="label">AI INTERACTIVE MYSTERY</div>
        <div class="title" id="titleEl">剧变</div>
        <div class="subtitle">密室、古籍、谎言与机关。你是唯一能拆开真相的人。</div>
        <div class="mode" id="modeTag">离线演示模式</div>
        <div class="template-title-tag" id="templateTag" style="display:none;"></div>
      </div>
      <div class="story-box" id="storyBox" onclick="skipTypewriter()">
        <div class="story-text" id="storyText"></div>
      </div>
      <div class="story-nav" id="storyNav" style="display:none;">
        <button class="nav-btn" id="prevBtn" onclick="showPrevStory()">上一段</button>
        <div class="story-progress" id="storyProgress">1 / 1</div>
        <button class="nav-btn" id="nextBtn" onclick="showNextStory()">下一段</button>
      </div>
      <div class="loading" id="loadingEl" style="display:none;">
        思考中<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span>
      </div>
      <div id="choicesArea"></div>
      <div class="hint">提示：点击剧情框可跳过打字机效果</div>
    </div>
    <div class="demo-notice">Demo 演示版 · 完整版含 AI 实时生成剧情功能</div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>

<script>
/**
 * 剧变 Demo —— 独立可运行版本
 * 使用离线缓存数据展示完整 UI 和剧情流程
 * 完整版含 AI 实时生成案件框架、AI 续写剧情等功能
 */

/* ===== 页面切换 ===== */
function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function goToSelect() { showPage('page-select'); }
function exitGame() {
  if (confirm('确定要退出当前案件吗？')) {
    showPage('page-select');
  }
}

/* ===== 预设剧本模板 ===== */
var templates = [
  { id: 'x314', title: '密室匕首案' },
  { id: 'y211', title: '歌剧院幽灵' },
  { id: 'z007', title: 'AI 觉醒事件' }
];

var selectedTemplateId = '';

function renderTemplates() {
  var scroll = document.getElementById('templateScroll');
  scroll.innerHTML = templates.map(function(t) {
    var selectedClass = selectedTemplateId === t.id ? ' selected' : '';
    return '<div class="template-card' + selectedClass + '" onclick="selectTemplate(\'' + t.id + '\')">' +
      '<div class="template-id">' + t.id + '</div>' +
      '<div class="template-title">' + t.title + '</div>' +
    '</div>';
  }).join('');
}

function selectTemplate(id) {
  selectedTemplateId = id;
  renderTemplates();
}

function startGame() {
  if (!selectedTemplateId) {
    selectedTemplateId = templates[0].id;
  }
  var template = templates.find(function(t) { return t.id === selectedTemplateId; });
  templateTitle = template.title;
  document.getElementById('templateTag').textContent = templateTitle;
  document.getElementById('templateTag').style.display = 'inline-block';
  showPage('page-game');
  initGame();
}

/* ===== AI 功能提示 ===== */
function showAiTip() {
  showToast('AI 随机生成功能需下载完整版桌面应用体验');
}

/* ===== 离线缓存剧情数据（密室匕首案完整故事） ===== */
var storyCache = [
  {
    story: '【档案编号：X-314】\n\n2025年冬，临海大学古籍修复室里，教授陈伯钧被发现死在一间从内部反锁的密室中。胸口插着一把明代匕首，瞳孔放大，仿佛死前看到了极其可怕的东西。\n\n你是警方特聘的独立调查顾问沈缄。队长低声说："密室、凶器、动机，全都交给你了。"\n\n你的行动：',
    choices: ['① 仔细检查尸体和匕首的细节', '② 立刻调查古籍室的入侵痕迹', '③ 传唤当天所有来访者进行问话']
  },
  {
    story: '你蹲下身检查尸体。匕首刺入角度很奇怪，像是从上方斜斜落下，而不是被人正面刺入。教授右手指尖沾着细小金粉，指甲里夹着一缕灰色棉线。修复台边缘还有一道新鲜划痕，像某种细线高速绷紧后留下的痕迹。\n\n你的行动：',
    choices: ['① 查看天花板是否藏有机关', '② 让法医重新测量伤口角度', '③ 搜索教授衣袋里的物品']
  },
  {
    story: '手电照向天花板，你在通风格栅后看到一只微型滑轮。滑轮边缘残留金粉，正好和教授指尖的粉末一致。旁边还有被烧断的透明鱼线。所谓密室，并不是为了困住凶手，而是为了掩盖一个提前布置好的杀人机关。\n\n你的行动：',
    choices: ['① 检查门边灯光开关', '② 追查谁能进入修复室布置机关', '③ 查看通风格栅上的指纹']
  },
  {
    story: '门边开关盒里有一小段香灰和熔化的蜡。机关原理逐渐清晰：教授进门后打开灯，鱼线被拉紧，延迟燃烧装置烧断固定点，匕首从高处坠下。凶手不需要留在密室里，只需要确认教授会按下那个开关。\n\n你的行动：',
    choices: ['① 查看钥匙借用登记簿', '② 调取走廊监控', '③ 询问助教林砚']
  },
  {
    story: '登记簿显示，案发前两小时只有教授陈伯钧和助教林砚借用过修复室钥匙。林砚声称自己只是送来一卷待修古籍，可归还时间被墨水涂改过。他的袖口有一圈灰色线头，材质与教授指甲里的棉线极为相似。\n\n你的行动：',
    choices: ['① 继续追问林砚的时间线', '② 检查那卷待修古籍', '③ 比对袖口纤维']
  },
  {
    story: '待修古籍封面内侧夹着一封未寄出的申诉信。信里写着：陈伯钧将林砚的修复发现据为己有，并准备在发布会上以自己的名义公开。信纸被揉皱又展开，边角沾着金粉。林砚看见这封信时，脸色瞬间苍白。\n\n你的行动：',
    choices: ['① 查看发布会资料', '② 询问林砚为什么没有寄出申诉信', '③ 搜索林砚的工作台']
  },
  {
    story: '林砚的工作台抽屉里藏着一张修复室结构草图，标出了通风格栅、滑轮和灯光开关的位置。草图背面写着一句话："让他倒在自己的谎言下面。"笔迹与林砚实验记录完全一致。动机、时间、机关，开始连成一条线。\n\n你的行动：',
    choices: ['① 让林砚解释草图', '② 复盘机关触发过程', '③ 寻找最后一件物证']
  },
  {
    story: '你在垃圾桶夹层里找到一枚烧黑的铜扣，上面缠着半圈透明鱼线。铜扣来自林砚外套袖口，也解释了教授指尖为何会沾到金粉：他死前曾抓住坠落机关的一部分，却只留下了无声的证据。林砚终于停止辩解。\n\n你的行动：',
    choices: ['① 正面揭露林砚', '② 让林砚说出真相', '③ 向队长展示证据链']
  },
  {
    story: '你把证据摆在修复台上：异常角度的匕首、通风格栅里的滑轮、灯光开关中的香灰、被涂改的钥匙记录、申诉信、结构草图，以及那枚烧黑的铜扣。林砚的嘴唇颤了颤，终于承认自己布置了机关。\n\n你的行动：',
    choices: ['① 追问真正的杀人动机', '② 让他完整复述作案过程', '③ 宣布案件进入结局']
  },
  {
    story: '案件侦破。\n\n林砚承认，他杀死陈伯钧，是因为教授长期窃取他的研究成果，并准备在发布会上彻底抹去他的名字。他选择密室，是想让陈伯钧死在最珍视的古籍修复室里。可机关再精巧，也遮不住人的动机。暴雨停下时，古籍残页上的血色已经干透，真相终于从沉默中显形。',
    choices: []
  }
];

/* ===== 游戏状态 ===== */
var storyText = '';
var storySegments = [];
var storyViewIndex = 0;
var choices = [];
var round = 0;
var isEnding = false;
var loading = false;
var cacheIndex = 0;
var showChoices = true;
var templateTitle = '';

/* 打字机 */
var typewriterTimer = null;
var typewriterRunning = false;
var typewriterFullText = '';
var typewriterCurrentIndex = 0;
var typewriterCallback = null;

function startTypewriter(text, callback) {
  stopTypewriter();
  typewriterFullText = String(text || '');
  typewriterCurrentIndex = 0;
  typewriterRunning = true;
  typewriterCallback = callback || null;
  typewriterTick();
}

function typewriterTick() {
  if (!typewriterRunning) return;
  var nextIndex = Math.min(typewriterCurrentIndex + 5, typewriterFullText.length);
  typewriterCurrentIndex = nextIndex;
  document.getElementById('storyText').textContent = typewriterFullText.slice(0, typewriterCurrentIndex);
  if (typewriterCurrentIndex >= typewriterFullText.length) {
    typewriterRunning = false;
    if (typeof typewriterCallback === 'function') typewriterCallback();
    return;
  }
  typewriterTimer = setTimeout(typewriterTick, 30);
}

function skipTypewriter() {
  if (!typewriterRunning) return;
  stopTypewriter();
  typewriterCurrentIndex = typewriterFullText.length;
  document.getElementById('storyText').textContent = typewriterFullText;
  typewriterRunning = false;
  if (typeof typewriterCallback === 'function') typewriterCallback();
}

function stopTypewriter() {
  if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
  typewriterRunning = false;
}

/* ===== 格式化段落 ===== */
function formatCacheSegment(item, index) {
  if (index === 0) return item.story;
  return '第 ' + index + ' 轮\n\n' + item.story;
}

/* ===== 剧情导航 ===== */
function updateStoryNav() {
  var nav = document.getElementById('storyNav');
  if (storySegments.length > 1) {
    nav.style.display = 'flex';
    document.getElementById('storyProgress').textContent = (storyViewIndex + 1) + ' / ' + storySegments.length;
    document.getElementById('prevBtn').disabled = (storyViewIndex <= 0);
    document.getElementById('nextBtn').disabled = (storyViewIndex >= storySegments.length - 1);
  } else {
    nav.style.display = 'none';
  }
}

function showPrevStory() {
  if (storyViewIndex <= 0) return;
  storyViewIndex--;
  document.getElementById('storyText').textContent = storySegments[storyViewIndex];
  updateStoryNav();
}

function showNextStory() {
  if (storyViewIndex >= storySegments.length - 1) return;
  storyViewIndex++;
  document.getElementById('storyText').textContent = storySegments[storyViewIndex];
  updateStoryNav();
}

/* ===== 渲染选项 ===== */
function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderChoices() {
  var area = document.getElementById('choicesArea');
  if (isEnding) {
    area.innerHTML = '<div class="ending-container">' +
      '<div class="ending-title">案件侦破</div>' +
      '<div class="ending-story">' + escapeHtml(storyText) + '</div>' +
      '<button class="restart-btn" onclick="restartGame()">重新调查</button>' +
    '</div>';
    return;
  }
  if (!showChoices) { area.innerHTML = ''; return; }
  area.innerHTML = choices.map(function(c, i) {
    return '<button class="choice-btn" onclick="makeChoice(' + i + ')">&#10095; ' + escapeHtml(c) + '</button>';
  }).join('');
}

/* ===== 初始化游戏 ===== */
function initGame() {
  var initialStory = storyCache[0].story;
  storyText = initialStory;
  storySegments = [initialStory];
  storyViewIndex = 0;
  choices = storyCache[0].choices;
  round = 0;
  cacheIndex = 0;
  isEnding = false;
  loading = false;
  showChoices = false;

  updateStoryNav();
  renderChoices();

  startTypewriter(initialStory, function() {
    showChoices = true;
    renderChoices();
  });
}

/* ===== 玩家选择 ===== */
function makeChoice(index) {
  if (loading || isEnding) return;
  cacheIndex++;
  showChoices = false;
  renderChoices();

  // 模拟 AI 思考延迟
  document.getElementById('loadingEl').style.display = 'block';
  setTimeout(function() {
    document.getElementById('loadingEl').style.display = 'none';
    loadFromCache();
  }, 800);
}

/* ===== 加载下一段剧情 ===== */
function loadFromCache() {
  var safeIndex = Math.min(cacheIndex, storyCache.length - 1);
  var current = storyCache[safeIndex];
  var cacheChoices = Array.isArray(current.choices) ? current.choices : [];

  var segments = storyCache.slice(0, safeIndex + 1).map(function(item, itemIndex) {
    return formatCacheSegment(item, itemIndex);
  });

  var displayText = segments[segments.length - 1];

  storyText = current.story;
  storySegments = segments;
  storyViewIndex = segments.length - 1;
  choices = cacheChoices;
  round = safeIndex;
  isEnding = cacheChoices.length === 0;
  loading = false;
  showChoices = false;

  updateStoryNav();

  startTypewriter(displayText, function() {
    showChoices = true;
    renderChoices();
  });
}

/* ===== 重新调查 ===== */
function restartGame() {
  showPage('page-select');
}

/* ===== Toast ===== */
function showToast(message) {
  var toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

/* ===== 状态栏时间 ===== */
function updateStatusTime() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2, '0');
  var m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('statusTime').textContent = h + ':' + m;
}

/* ===== 初始化 ===== */
renderTemplates();
updateStatusTime();
setInterval(updateStatusTime, 60000);
</script>
