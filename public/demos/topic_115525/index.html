<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FactorForge（因子锻造局）</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b21;
      --panel-hover: #20242c;
      --border: #2a2f38;
      --text: #e8eaed;
      --text-secondary: #9aa0a6;
      --accent: #4f8ef7;
      --accent-hover: #357abd;
      --success: #34a853;
      --danger: #ea4335;
      --warning: #fbbc05;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #7b3ff2);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #fff;
    }

    nav {
      display: flex;
      gap: 8px;
    }

    nav button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    nav button:hover { background: var(--panel-hover); color: var(--text); }
    nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    .tab { display: none; animation: fade 0.25s ease; }
    .tab.active { display: block; }

    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
    }

    h2 { margin: 0 0 16px; font-size: 1.15rem; }
    p { margin: 0 0 12px; color: var(--text-secondary); }

    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
    .field { flex: 1; min-width: 220px; }
    .field label { display: block; margin-bottom: 6px; font-size: 0.875rem; color: var(--text-secondary); }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; min-height: 220px; resize: vertical; }

    button.primary {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    button.secondary:hover { background: var(--panel-hover); }
    button.danger { color: var(--danger); border-color: var(--danger); }
    button.danger:hover { background: rgba(234, 67, 53, 0.1); }

    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: 16px; }
    .metric {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .metric-value { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    .metric-label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }

    .factor-list { display: flex; flex-direction: column; gap: 12px; }
    .factor-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .factor-info h4 { margin: 0 0 4px; font-size: 1rem; }
    .factor-info span { font-size: 0.8rem; color: var(--text-secondary); }

    .empty { text-align: center; color: var(--text-secondary); padding: 40px 0; }
    .tag {
      display: inline-block;
      background: rgba(79, 142, 247, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-left: 8px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    .code-block {
      background: #0d0f12;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      overflow-x: auto;
      color: #abb2bf;
    }

    .hint { font-size: 0.8rem; color: var(--text-secondary); margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">FF</div>
      <div>FactorForge（因子锻造局）</div>
    </div>
    <nav>
      <button class="active" data-tab="forge">因子生成</button>
      <button data-tab="backtest">回测中心</button>
      <button data-tab="library">因子库</button>
    </nav>
  </header>

  <main>
    <!-- 因子生成 -->
    <section id="forge" class="tab active">
      <div class="card">
        <h2>锻造新因子</h2>
        <p>输入因子主题或灵感，FactorForge 会为你生成一段可运行的 Python Alpha 代码草稿。</p>
        <div class="row">
          <div class="field">
            <label>因子主题</label>
            <input type="text" id="themeInput" placeholder="例如：短期价格动量、成交量异常、盈利增速..." />
          </div>
          <div class="field" style="flex:0.6">
            <label>数据集</label>
            <select id="datasetSelect">
              <option value="fundamental">基本面数据</option>
              <option value="price_volume">价量数据</option>
              <option value="alternative">另类数据</option>
            </select>
          </div>
          <button class="primary" onclick="generateFactor()">生成因子</button>
        </div>
        <div class="hint">提示：当前为演示版本，生成的代码基于模板组合，未接入真实数据源。</div>
      </div>

      <div class="card" id="resultCard" style="display:none">
        <h2>生成结果</h2>
        <div class="row" style="margin-bottom:12px">
          <div class="field">
            <label>因子名称</label>
            <input type="text" id="factorName" />
          </div>
          <button class="secondary" onclick="copyCode()">复制代码</button>
          <button class="primary" onclick="saveToLibrary()">保存到因子库</button>
        </div>
        <div class="code-block" id="codeOutput"></div>
      </div>
    </section>

    <!-- 回测中心 -->
    <section id="backtest" class="tab">
      <div class="card">
        <h2>运行回测</h2>
        <p>从因子库中选择一个因子，运行模拟回测并查看核心绩效指标。</p>
        <div class="row">
          <div class="field">
            <label>选择因子</label>
            <select id="backtestFactorSelect">
              <option value="">请先保存因子</option>
            </select>
          </div>
          <button class="primary" onclick="runBacktest()">运行回测</button>
        </div>
      </div>

      <div class="card" id="backtestResultCard" style="display:none">
        <h2>回测结果</h2>
        <div class="metrics">
          <div class="metric"><div class="metric-value" id="sharpe">-</div><div class="metric-label">Sharpe</div></div>
          <div class="metric"><div class="metric-value" id="fitness">-</div><div class="metric-label">Fitness</div></div>
          <div class="metric"><div class="metric-value" id="turnover">-</div><div class="metric-label">Turnover</div></div>
          <div class="metric"><div class="metric-value" id="drawdown">-</div><div class="metric-label">Max Drawdown</div></div>
        </div>
        <div class="hint" style="margin-top:16px">提示：当前回测结果为随机模拟数据，仅用于演示界面效果。</div>
      </div>
    </section>

    <!-- 因子库 -->
    <section id="library" class="tab">
      <div class="card">
        <h2>我的因子库</h2>
        <p>所有生成并保存的因子都会出现在这里，支持查看和删除。</p>
        <div id="factorList" class="factor-list">
          <div class="empty">暂无保存的因子，先去“因子生成”页面锻造一个吧。</div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const operators = ['ts_zscore', 'ts_rank', 'ts_delta', 'ts_mean', 'ts_std', 'ts_corr', 'ts_decay_linear'];
    const fields = {
      fundamental: ['revenue', 'earnings', 'roe', 'assets', 'debt'],
      price_volume: ['close', 'open', 'volume', 'returns', 'vwap'],
      alternative: ['news_sentiment', 'search_trend', 'social_volume']
    };

    let currentFactor = null;

    function showTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      document.querySelector(`nav button[data-tab="${name}"]`).classList.add('active');
      if (name === 'library') renderLibrary();
      if (name === 'backtest') updateBacktestSelect();
    }

    document.querySelectorAll('nav button').forEach(btn => {
      btn.addEventListener('click', () => showTab(btn.dataset.tab));
    });

    function generateFactor() {
      const theme = document.getElementById('themeInput').value.trim() || 'momentum';
      const dataset = document.getElementById('datasetSelect').value;
      const pool = fields[dataset];
      const field1 = pool[Math.floor(Math.random() * pool.length)];
      const field2 = pool[Math.floor(Math.random() * pool.length)];
      const op1 = operators[Math.floor(Math.random() * operators.length)];
      const op2 = operators[Math.floor(Math.random() * operators.length)];
      const window = [5, 10, 20, 60][Math.floor(Math.random() * 4)];

      const name = `${theme}_${dataset}_${Date.now().toString().slice(-4)}`;
      const code = `# FactorForge generated alpha\n# Theme: ${theme}\n# Dataset: ${dataset}\n\nfrom worldquant_alpha import *\n\ndef alpha_001(df):\n    # Step 1: normalize primary field\n    x = ${op1}(df['${field1}'], ${window})\n\n    # Step 2: orthogonalize against secondary field\n    y = ${op2}(df['${field2}'], ${window})\n\n    # Step 3: rank and neutralize\n    signal = -ts_rank(x, 20) + ts_zscore(y, 20)\n    return group_neutralize(signal, df['subindustry'])\n`;

      currentFactor = { id: Date.now(), name, theme, dataset, code, created: new Date().toLocaleString() };
      document.getElementById('factorName').value = name;
      document.getElementById('codeOutput').textContent = code;
      document.getElementById('resultCard').style.display = 'block';
    }

    function copyCode() {
      navigator.clipboard.writeText(document.getElementById('codeOutput').textContent)
        .then(() => showToast('代码已复制到剪贴板'));
    }

    function getLibrary() {
      return JSON.parse(localStorage.getItem('factorforge_library') || '[]');
    }

    function saveLibrary(list) {
      localStorage.setItem('factorforge_library', JSON.stringify(list));
    }

    function saveToLibrary() {
      if (!currentFactor) return;
      currentFactor.name = document.getElementById('factorName').value.trim() || currentFactor.name;
      const list = getLibrary();
      list.unshift(currentFactor);
      saveLibrary(list);
      showToast('因子已保存到因子库');
      updateBacktestSelect();
    }

    function renderLibrary() {
      const list = getLibrary();
      const container = document.getElementById('factorList');
      if (list.length === 0) {
        container.innerHTML = '<div class="empty">暂无保存的因子，先去“因子生成”页面锻造一个吧。</div>';
        return;
      }
      container.innerHTML = list.map(f => `
        <div class="factor-item">
          <div class="factor-info">
            <h4>${f.name}<span class="tag">${f.dataset}</span></h4>
            <span>主题：${f.theme} · 创建于 ${f.created}</span>
          </div>
          <button class="secondary danger" onclick="deleteFactor(${f.id})">删除</button>
        </div>
      `).join('');
    }

    function deleteFactor(id) {
      const list = getLibrary().filter(f => f.id !== id);
      saveLibrary(list);
      renderLibrary();
      updateBacktestSelect();
      showToast('因子已删除');
    }

    function updateBacktestSelect() {
      const list = getLibrary();
      const select = document.getElementById('backtestFactorSelect');
      if (list.length === 0) {
        select.innerHTML = '<option value="">请先保存因子</option>';
        return;
      }
      select.innerHTML = list.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
    }

    function runBacktest() {
      const id = document.getElementById('backtestFactorSelect').value;
      if (!id) { showToast('请先从因子库选择一个因子'); return; }

      // 模拟回测结果
      const sharpe = (Math.random() * 1.8 + 0.2).toFixed(2);
      const fitness = (Math.random() * 0.6 + 0.4).toFixed(2);
      const turnover = (Math.random() * 0.5 + 0.1).toFixed(2);
      const drawdown = (Math.random() * -0.15 - 0.02).toFixed(2);

      document.getElementById('sharpe').textContent = sharpe;
      document.getElementById('fitness').textContent = fitness;
      document.getElementById('turnover').textContent = turnover;
      document.getElementById('drawdown').textContent = drawdown;
      document.getElementById('backtestResultCard').style.display = 'block';
      showToast('回测完成');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // 初始化
    updateBacktestSelect();
  </script>
</body>
</html>
