{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Python代码诊断平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 趣味教育主题配色 - 鲜艳引人入胜 */
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-glow: rgba(79, 70, 229, 0.24);
            --secondary: #818CF8;
            --accent: #F97316;
            --accent-2: #22C55E;
            --success: #22C55E;
            --error: #E11D48;
            --warning: #FBBF24;
            --info: #06B6D4;
            --purple: #A78BFA;

            /* 明亮活力背景 */
            --bg-primary: #EEF2FF;
            --bg-secondary: #E0E7FF;
            --bg-tertiary: #C7D2FE;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-hover: #EEF2FF;

            /* 文本颜色（高对比） */
            --text-primary: #1E1B4B;
            --text-secondary: #3730A3;
            --text-tertiary: #4F46E5;

            /* 边框 */
            --border-primary: #C7D2FE;
            --border-secondary: #A5B4FC;
            --border-hover: #6366F1;

            /* 阴影 */
            --shadow-sm: 0 2px 4px 0 rgba(79, 70, 229, 0.12);
            --shadow-md: 0 6px 12px -2px rgba(79, 70, 229, 0.18), 0 3px 6px -1px rgba(79, 70, 229, 0.12);
            --shadow-lg: 0 12px 24px -6px rgba(79, 70, 229, 0.24), 0 6px 10px -3px rgba(79, 70, 229, 0.14);
            --shadow-xl: 0 24px 36px -12px rgba(79, 70, 229, 0.30), 0 12px 20px -6px rgba(79, 70, 229, 0.18);
            --shadow-glow: 0 10px 24px rgba(79, 70, 229, 0.34);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Sans', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(249, 115, 22, 0.24), transparent 32%),
                radial-gradient(circle at 85% 16%, rgba(34, 197, 94, 0.20), transparent 30%),
                radial-gradient(circle at 20% 84%, rgba(6, 182, 212, 0.18), transparent 28%),
                linear-gradient(140deg, #EEF2FF 0%, #E0E7FF 45%, #FEF3C7 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 几何装饰背景 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration::before,
        .bg-decoration::after {
            content: '';
            position: absolute;
            border-radius: 999px;
            opacity: 0.14;
        }

        .bg-decoration::before {
            width: 680px;
            height: 680px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 68%);
            top: -320px;
            right: -180px;
            animation: float 20s ease-in-out infinite;
        }

        .bg-decoration::after {
            width: 560px;
            height: 560px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 72%);
            bottom: -280px;
            left: -180px;
            animation: float 16s ease-in-out infinite reverse;
        }

        .bg-decoration .shape {
            position: absolute;
            border-radius: 20px;
            opacity: 0.16;
            filter: blur(1px);
            animation: bob 9s ease-in-out infinite;
        }

        .bg-decoration .shape-1 {
            width: 110px;
            height: 110px;
            top: 18%;
            left: 7%;
            background: linear-gradient(135deg, var(--accent), #FDBA74);
        }

        .bg-decoration .shape-2 {
            width: 88px;
            height: 88px;
            top: 24%;
            right: 10%;
            background: linear-gradient(135deg, var(--accent-2), #86EFAC);
            animation-delay: 1.2s;
        }

        .bg-decoration .shape-3 {
            width: 72px;
            height: 72px;
            bottom: 18%;
            left: 16%;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--info), #67E8F9);
            animation-delay: 2.1s;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(6deg); }
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.05); }
        }

        /* 减少动画偏好支持 */
        @media (prefers-reduced-motion: reduce) {
            .bg-decoration::before,
            .bg-decoration::after,
            .bg-decoration .shape {
                animation: none;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 2rem;
        }

        /* 登录卡片 - Claymorphism风格 */
        .login-card {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 4px solid var(--border-primary);
            padding: 3rem;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(249, 115, 22, 0.08), rgba(34, 197, 94, 0.07));
            pointer-events: none;
        }

        .login-card > * {
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 悬停效果 */
        .login-card:hover {
            box-shadow: 0 30px 60px -15px rgba(79, 70, 229, 0.3);
            border-color: var(--border-hover);
        }

        /* Logo区域 */
        .logo-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: var(--shadow-lg);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 var(--primary-glow), var(--shadow-lg); }
            50% { box-shadow: 0 0 0 15px transparent, var(--shadow-lg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-icon {
                animation: none;
            }
        }

        .logo-icon svg {
            width: 40px;
            height: 40px;
            color: white;
        }

        .title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
        }

        /* 角色选择 */
        .role-selector {
            margin-bottom: 2rem;
        }

        .role-label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: block;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .role-btn {
            background: var(--bg-secondary);
            border: 3px solid var(--border-primary);  /* 粗边框 */
            border-radius: 16px;  /* 更圆润 */
            padding: 1rem 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease-out;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .role-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .role-btn:hover {
            border-color: var(--primary);
            transform: translateY(-4px);  /* 更明显的上浮 */
            box-shadow: var(--shadow-lg);
        }

        .role-btn.active {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            box-shadow: var(--shadow-md);
        }

        .role-btn.active::before {
            opacity: 0.05;
        }

        .role-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .role-icon {
            width: 32px;
            height: 32px;
            color: var(--text-tertiary);
            transition: color 0.2s;
        }

        .role-btn.active .role-icon {
            color: var(--primary);
        }

        .role-text {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .role-btn.active .role-text {
            color: var(--primary);
            font-weight: 600;
        }

        /* 表单输入 */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .required-indicator {
            color: var(--error);
            margin-left: 0.25rem;
        }

        .form-hint {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.375rem;
            opacity: 0.8;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            border-radius: 6px;
        }

        .password-toggle:hover {
            color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .password-toggle:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .password-toggle svg {
            pointer-events: none;
        }

        .eye-icon {
            width: 20px;
            height: 20px;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: #ffffff;
            border: 3px solid var(--border-primary);  /* 粗边框 */
            border-radius: 16px;  /* 更圆润 */
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Fira Code', monospace;
            transition: all 0.2s ease-out;
            outline: none;
            box-shadow: var(--shadow-sm);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
            opacity: 0.6;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);  /* 更明显的光晕 */
        }

        /* 焦点可见性 - 键盘导航 */
        *:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* 移除鼠标点击时的outline */
        *:focus:not(:focus-visible) {
            outline: none;
        }

        /* 错误提示 */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--error);
            display: none;
            animation: shake 0.5s;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* 登录按钮 - Claymorphism风格 */
        .login-btn {
            width: 100%;
            padding: 1.125rem;  /* 更大的内边距 */
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 3px solid var(--primary);  /* 粗边框 */
            border-radius: 16px;  /* 更圆润 */
            color: white;
            font-size: 1.125rem;  /* 更大的字体 */
            font-weight: 700;  /* 更粗的字体 */
            cursor: pointer;
            transition: all 0.2s ease-out;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .login-btn:hover {
            transform: translateY(-4px);  /* 更明显的上浮 */
            box-shadow: var(--shadow-glow);
        }

        .login-btn:active {
            transform: translateY(0);  /* 按下效果 */
            box-shadow: var(--shadow-md);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-text {
            position: relative;
            z-index: 1;
        }

        .btn-loader {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            margin: auto;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-btn[aria-busy="true"] .btn-text {
            opacity: 0;
        }

        .login-btn[aria-busy="true"] .btn-loader {
            display: block;
        }

        /* 测试账号 - Claymorphism风格 */
        .test-accounts {
            margin-top: 2rem;
            padding: 1.25rem;
            background: var(--bg-secondary);
            border: 3px solid var(--border-primary);  /* 粗边框 */
            border-radius: 16px;  /* 更圆润 */
            box-shadow: var(--shadow-sm);
        }

        .test-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-tertiary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .test-account {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-family: 'Fira Code', monospace;
        }

        .test-account:last-child {
            margin-bottom: 0;
        }

        .test-code {
            display: inline-block;
            padding: 0.375rem 0.75rem;  /* 更大的内边距 */
            background: rgba(79, 70, 229, 0.1);
            border: 2px solid rgba(79, 70, 229, 0.3);  /* 粗边框 */
            border-radius: 8px;  /* 更圆润 */
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease-out;
            font-weight: 600;
        }

        .test-code:hover {
            background: rgba(79, 70, 229, 0.2);
            transform: scale(1.05) translateY(-2px);  /* 上浮 + 放大 */
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-tertiary);
            font-family: 'Fira Code', monospace;
            animation: fadeIn 1s 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .footer {
                animation: none;
                opacity: 1;
            }
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .login-card {
                padding: 2rem 1.5rem;
            }

            .role-grid {
                gap: 0.5rem;
            }

            .role-btn {
                padding: 0.875rem 0.5rem;
                min-height: 48px; /* WCAG触摸目标最小尺寸 */
            }

            .role-icon {
                width: 28px;
                height: 28px;
            }

            .role-text {
                font-size: 0.8125rem;
            }

            .form-input {
                font-size: 16px; /* 防止iOS自动缩放 */
            }
        }
    </style>
</head>
<body>
    <!-- 几何装饰背景 -->
    <div class="bg-decoration"></div>

    <!-- 主容器 -->
    <div class="container">
        <div class="login-card">
            <!-- Logo区域 -->
            <div class="logo-section">
                <div class="logo-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                    </svg>
                </div>
                <h1 class="title">Python 代码诊断平台</h1>
                <p class="subtitle">// AI-Powered Code Diagnosis</p>
            </div>

            <!-- 登录表单 -->
            <form id="loginForm">
                <!-- 角色选择 -->
                <div class="role-selector" role="radiogroup" aria-labelledby="role-label">
                    <label id="role-label" class="role-label">选择登录角色</label>
                    <div class="role-grid">
                        <button
                            type="button"
                            class="role-btn"
                            id="role-student"
                            data-role="student"
                            role="radio"
                            aria-checked="true"
                            aria-label="学生角色"
                        >
                            <div class="role-content">
                                <svg class="role-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                                </svg>
                                <span class="role-text">学生</span>
                            </div>
                        </button>
                        <button
                            type="button"
                            class="role-btn"
                            id="role-teacher"
                            data-role="teacher"
                            role="radio"
                            aria-checked="false"
                            aria-label="教师角色"
                        >
                            <div class="role-content">
                                <svg class="role-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                </svg>
                                <span class="role-text">教师</span>
                            </div>
                        </button>
                        <button
                            type="button"
                            class="role-btn"
                            id="role-admin"
                            data-role="admin"
                            role="radio"
                            aria-checked="false"
                            aria-label="管理员角色"
                        >
                            <div class="role-content">
                                <svg class="role-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                                <span class="role-text">管理</span>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- 用户名 -->
                <div class="form-group">
                    <label for="username" class="form-label">
                        用户名
                        <span class="required-indicator" aria-label="必填">*</span>
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="username"
                        required
                        autocomplete="username"
                        aria-required="true"
                        aria-describedby="username-hint"
                    >
                    <small id="username-hint" class="form-hint">请输入您的账号用户名</small>
                </div>

                <!-- 密码 -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        密码
                        <span class="required-indicator" aria-label="必填">*</span>
                    </label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                            aria-required="true"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            aria-label="显示密码"
                            id="togglePassword"
                        >
                            <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 错误提示 -->
                <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>

                <!-- 登录按钮 -->
                <button type="submit" id="loginButton" class="login-btn" aria-busy="false">
                    <span class="btn-text">登录</span>
                    <span class="btn-loader" aria-hidden="true"></span>
                </button>
            </form>

            <!-- 测试账号 -->
            <div class="test-accounts">
                <div class="test-title">测试账号</div>
                <div class="test-account">
                    学生: <span class="test-code" data-username="student1">student1</span> / <span class="test-code" data-password="password123">password123</span>
                </div>
                <div class="test-account">
                    教师: <span class="test-code" data-username="teacher1">teacher1</span> / <span class="test-code" data-password="password123">password123</span>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            本科毕业设计项目 - 基于LLM的代码诊断平台
        </div>
    </div>

    <script>
        // ===== 角色选择 =====
        let selectedRole = 'student';

        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 更新所有按钮的aria-checked状态
                document.querySelectorAll('.role-btn').forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-checked', 'false');
                });

                // 设置当前按钮为选中状态
                this.classList.add('active');
                this.setAttribute('aria-checked', 'true');
                selectedRole = this.dataset.role;
            });

            // 键盘导航支持
            btn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
        });

        // 默认选中学生
        document.getElementById('role-student').classList.add('active');

        // ===== 密码显示/隐藏 =====
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;

            // 更新按钮的aria-label
            this.setAttribute('aria-label', type === 'password' ? '显示密码' : '隐藏密码');

            // 切换图标（可选：添加不同的图标）
            this.classList.toggle('active');
        });

        // ===== 测试账号快速填充 =====
        document.querySelectorAll('.test-code').forEach(code => {
            code.addEventListener('click', function() {
                const username = this.dataset.username;
                const password = this.dataset.password;

                if (username) document.getElementById('username').value = username;
                if (password) document.getElementById('password').value = password;
            });
        });

        // ===== 登录逻辑 =====
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');

        // 带超时的fetch，避免请求卡住导致按钮一直loading
        function fetchWithTimeout(url, options = {}, timeoutMs = 10000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { ...options, signal: controller.signal })
                .finally(() => clearTimeout(timeoutId));
        }

        // 获取CSRF token
        let csrfToken = '';
        fetchWithTimeout('/api/auth/csrf', {}, 8000)
            .then(r => r.json())
            .then(data => {
                csrfToken = data.data.csrfToken;
            })
            .catch(err => console.error('获取CSRF token失败:', err));

        // 页面显示时重置按钮状态
        window.addEventListener('pageshow', () => {
            loginButton.disabled = false;
            loginButton.setAttribute('aria-busy', 'false');
            loginButton.querySelector('.btn-text').textContent = '登录';
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 禁用按钮，显示加载状态
            loginButton.disabled = true;
            loginButton.setAttribute('aria-busy', 'true');
            loginButton.querySelector('.btn-text').textContent = '登录中...';
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            try {
                // 如果没有CSRF token，先获取
                if (!csrfToken) {
                    const csrfResponse = await fetchWithTimeout('/api/auth/csrf', {}, 8000);
                    const csrfData = await csrfResponse.json();
                    csrfToken = csrfData.data.csrfToken;
                }

                // 发送登录请求
                const response = await fetchWithTimeout('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password, role: selectedRole })
                }, 12000);

                const data = await response.json();

                if (data.ok) {
                    // 登录成功，根据角色跳转
                    if (selectedRole === 'admin') {
                        window.location.href = '/admin/';
                    } else if (selectedRole === 'teacher') {
                        window.location.href = '/teacher/dashboard';
                    } else {
                        window.location.href = '/problems';
                    }
                } else {
                    // 登录失败
                    errorMessage.textContent = data.message || '登录失败，请检查用户名和密码';
                    errorMessage.classList.add('show');
                    // 聚焦到错误消息以便屏幕阅读器读取
                    errorMessage.focus();
                }
            } catch (error) {
                console.error('登录错误:', error);
                errorMessage.textContent = '网络错误，请稍后重试';
                errorMessage.classList.add('show');
                errorMessage.focus();
            } finally {
                // 重置按钮状态
                loginButton.disabled = false;
                loginButton.setAttribute('aria-busy', 'false');
                loginButton.querySelector('.btn-text').textContent = '登录';
            }
        });
    </script>
</body>
</html>
