{% extends "base.html" %}

{% block title %}题目列表{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
        <h2 class="text-3xl font-bold mb-2" style="color: var(--text-primary); letter-spacing: -0.02em;">编程题目</h2>
        <p style="color: var(--text-secondary);">选择一道题目开始练习，提升编程能力</p>
    </div>

    <!-- 筛选器 -->
    <div class="card p-4 md:p-6 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div class="md:col-span-3">
                <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">难度筛选</label>
                <select id="filter-difficulty" class="input w-full" aria-label="选择难度">
                    <option value="">全部难度</option>
                    <option value="easy">简单</option>
                    <option value="medium">中等</option>
                    <option value="hard">困难</option>
                </select>
            </div>
            <div class="md:col-span-7">
                <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">搜索题目</label>
                <input type="text" id="search-keyword" placeholder="输入题目标题关键词..."
                       class="input w-full" aria-label="搜索题目">
            </div>
            <div class="md:col-span-2 flex items-end">
                <button id="btn-search" class="btn btn-primary w-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <span class="hidden sm:inline">搜索</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 题目列表 -->
    <div id="problems-container" class="grid grid-cols-1 gap-4">
        <!-- 骨架屏加载状态 -->
        <div class="skeleton-loading">
            <div class="card p-4 md:p-6">
                <div class="flex flex-col sm:flex-row items-start justify-between gap-4 sm:gap-6">
                    <div class="flex-1 w-full space-y-3">
                        <div class="skeleton skeleton-title" style="width: 60%;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%;"></div>
                        <div class="skeleton skeleton-text" style="width: 80%;"></div>
                        <div class="flex gap-4">
                            <div class="skeleton skeleton-text" style="width: 120px; height: 1.25rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 100px; height: 1.25rem;"></div>
                        </div>
                    </div>
                    <div class="skeleton skeleton-button" style="width: 120px; height: 2.5rem;"></div>
                </div>
            </div>
            <div class="card p-4 md:p-6">
                <div class="flex flex-col sm:flex-row items-start justify-between gap-4 sm:gap-6">
                    <div class="flex-1 w-full space-y-3">
                        <div class="skeleton skeleton-title" style="width: 50%;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%;"></div>
                        <div class="skeleton skeleton-text" style="width: 90%;"></div>
                        <div class="flex gap-4">
                            <div class="skeleton skeleton-text" style="width: 120px; height: 1.25rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 100px; height: 1.25rem;"></div>
                        </div>
                    </div>
                    <div class="skeleton skeleton-button" style="width: 120px; height: 2.5rem;"></div>
                </div>
            </div>
            <div class="card p-4 md:p-6">
                <div class="flex flex-col sm:flex-row items-start justify-between gap-4 sm:gap-6">
                    <div class="flex-1 w-full space-y-3">
                        <div class="skeleton skeleton-title" style="width: 70%;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%;"></div>
                        <div class="skeleton skeleton-text" style="width: 85%;"></div>
                        <div class="flex gap-4">
                            <div class="skeleton skeleton-text" style="width: 120px; height: 1.25rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 100px; height: 1.25rem;"></div>
                        </div>
                    </div>
                    <div class="skeleton skeleton-button" style="width: 120px; height: 2.5rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 分页 -->
    <div id="pagination" class="mt-8 flex justify-center">
        <!-- 分页按钮将通过JavaScript动态生成 -->
    </div>
</div>

<style>
    .difficulty-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.375rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.025em;
    }

    .difficulty-easy {
        background: rgba(16, 185, 129, 0.1);
        color: #059669;
        border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .difficulty-medium {
        background: rgba(245, 158, 11, 0.1);
        color: #d97706;
        border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .difficulty-hard {
        background: rgba(239, 68, 68, 0.1);
        color: #dc2626;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .problem-card {
        position: relative;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .problem-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--primary);
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .problem-card:hover::before {
        opacity: 1;
    }

    .problem-card:hover {
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block extra_scripts %}
<script>
    let currentPage = 1;
    let currentDifficulty = '';
    let currentSearch = '';

    // 加载题目列表
    async function loadProblems() {
        try {
            let url = `/api/problems/?page=${currentPage}&page_size=10`;
            if (currentDifficulty) url += `&difficulty=${currentDifficulty}`;
            if (currentSearch) url += `&search=${encodeURIComponent(currentSearch)}`;

            const response = await apiRequest(url);
            if (response.ok) {
                const data = response.data;
                renderProblems(data.problems);
                renderPagination(data.total, data.page, data.page_size);
            }
        } catch (error) {
            console.error('加载题目失败:', error);
            document.getElementById('problems-container').innerHTML =
                '<div class="card p-12 text-center"><p style="color: var(--danger);">加载失败，请刷新重试</p></div>';
        }
    }

    // 渲染题目列表
    function renderProblems(problems) {
        const container = document.getElementById('problems-container');

        if (problems.length === 0) {
            container.innerHTML = `
                <div class="card p-12 text-center">
                    <svg class="w-16 h-16 mx-auto mb-4" style="color: var(--text-tertiary);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <p style="color: var(--text-secondary);">暂无题目</p>
                </div>
            `;
            return;
        }

        container.innerHTML = problems.map(problem => {
            const difficultyClass = problem.difficulty === 'easy' ? 'difficulty-easy' :
                                   problem.difficulty === 'medium' ? 'difficulty-medium' :
                                   'difficulty-hard';
            const difficultyText = problem.difficulty === 'easy' ? '简单' :
                                  problem.difficulty === 'medium' ? '中等' : '困难';

            return `
                <div class="card problem-card clickable p-4 md:p-6" onclick="window.location.href='/problems/${problem.id}/solve'">
                    <div class="flex flex-col sm:flex-row items-start justify-between gap-4 sm:gap-6">
                        <div class="flex-1 min-w-0 w-full">
                            <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3 mb-3">
                                <h3 class="text-lg sm:text-xl font-semibold" style="color: var(--text-primary);">${problem.title}</h3>
                                <span class="difficulty-badge ${difficultyClass}">
                                    ${difficultyText}
                                </span>
                            </div>
                            <p class="mb-4 line-clamp-2 text-sm sm:text-base" style="color: var(--text-secondary);">
                                ${problem.description.substring(0, 120)}${problem.description.length > 120 ? '...' : ''}
                            </p>
                            <div class="flex flex-wrap items-center gap-4 sm:gap-6 text-xs sm:text-sm" style="color: var(--text-tertiary);">
                                <span class="flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                                    </svg>
                                    ${problem.test_cases_count} 个测试用例
                                </span>
                                <span class="flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    ${formatTime(problem.created_at)}
                                </span>
                            </div>
                        </div>
                        <div class="flex-shrink-0 w-full sm:w-auto">
                            <button class="btn btn-primary w-full sm:w-auto" style="white-space: nowrap;" onclick="window.location.href='/problems/${problem.id}/solve'">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                                </svg>
                                开始作答
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 渲染分页
    function renderPagination(total, page, pageSize) {
        const totalPages = Math.ceil(total / pageSize);
        const pagination = document.getElementById('pagination');

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = '<div class="flex items-center gap-2">';

        // 上一页
        if (page > 1) {
            html += `<button onclick="changePage(${page - 1})" class="btn btn-secondary" aria-label="上一页">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>`;
        }

        // 页码
        for (let i = 1; i <= totalPages; i++) {
            if (i === page) {
                html += `<button class="btn btn-primary" style="min-width: 2.5rem;" aria-current="page">${i}</button>`;
            } else if (i === 1 || i === totalPages || (i >= page - 2 && i <= page + 2)) {
                html += `<button onclick="changePage(${i})" class="btn btn-secondary" style="min-width: 2.5rem;" aria-label="第${i}页">${i}</button>`;
            } else if (i === page - 3 || i === page + 3) {
                html += `<span class="px-2" style="color: var(--text-tertiary);">...</span>`;
            }
        }

        // 下一页
        if (page < totalPages) {
            html += `<button onclick="changePage(${page + 1})" class="btn btn-secondary" aria-label="下一页">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>`;
        }

        html += '</div>';
        pagination.innerHTML = html;
    }

    // 切换页码
    function changePage(page) {
        currentPage = page;
        loadProblems();
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
        // 加载题目列表
        loadProblems();

        // 绑定难度筛选事件
        document.getElementById('filter-difficulty').addEventListener('change', (e) => {
            currentDifficulty = e.target.value;
            currentPage = 1;
            loadProblems();
        });

        // 绑定搜索按钮事件
        document.getElementById('btn-search').addEventListener('click', () => {
            currentSearch = document.getElementById('search-keyword').value;
            currentPage = 1;
            loadProblems();
        });

        // 回车搜索
        document.getElementById('search-keyword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentSearch = e.target.value;
                currentPage = 1;
                loadProblems();
            }
        });
    });
</script>
{% endblock %}
