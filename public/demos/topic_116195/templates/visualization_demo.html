<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>过程型可视化反馈 - 演示页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .code-line { display: flex; }
        .line-number {
            min-width: 40px;
            text-align: right;
            padding-right: 12px;
            color: #6b7280;
            user-select: none;
        }
        .error-line { background-color: #fee2e2; }
        .error-line .line-number { color: #dc2626; font-weight: bold; }
        .timeline-node { transition: all 0.3s ease; }
        .timeline-node:hover { transform: translateX(4px); }
        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-900">过程型可视化反馈</h1>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-gray-600">提交ID: <span id="submission-id-display">-</span></span>
                    <button onclick="loadDemo()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">
                        加载演示数据
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：执行摘要 + 时间线 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 执行摘要卡片 -->
                <div id="summary-card" class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-xl font-bold mb-4">执行摘要</h2>
                    <div id="summary-content" class="text-gray-600">
                        等待加载...
                    </div>
                </div>

                <!-- 时间线卡片 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-xl font-bold mb-4">执行时间线</h2>
                    <div id="timeline-container" class="space-y-4">
                        <!-- 时间线节点将在这里动态生成 -->
                    </div>
                </div>
            </div>

            <!-- 右侧：证据面板 + 建议列表 -->
            <div class="space-y-6">
                <!-- 证据面板 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-xl font-bold mb-4">执行证据</h2>
                    <div id="evidence-container">
                        <!-- 证据内容将在这里动态生成 -->
                    </div>
                </div>

                <!-- 建议列表 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-xl font-bold mb-4">修复建议</h2>
                    <div id="suggestions-container" class="space-y-3">
                        <!-- 建议卡片将在这里动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentPayload = null;

        // 加载演示数据（模拟API响应）
        function loadDemo() {
            showLoadingState();

            // 模拟网络延迟
            setTimeout(() => {
                // 使用示例JSON数据
                fetch('/docs/visualization_payload_example.json')
                    .then(response => response.json())
                    .then(data => {
                        currentPayload = data;
                        renderAll(data);
                    })
                    .catch(error => {
                        console.error('加载失败:', error);
                        showErrorState('加载演示数据失败，请检查文件路径');
                    });
            }, 500);
        }

        // 显示加载状态
        function showLoadingState() {
            document.getElementById('timeline-container').innerHTML = `
                <div class="flex flex-col items-center justify-center py-12">
                    <div class="loading-spinner mb-4"></div>
                    <p class="text-gray-600">正在加载可视化反馈...</p>
                </div>
            `;
        }

        // 显示错误状态
        function showErrorState(message) {
            document.getElementById('timeline-container').innerHTML = `
                <div class="flex flex-col items-center justify-center py-12">
                    <svg class="w-16 h-16 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p class="text-gray-900 font-semibold mb-2">加载失败</p>
                    <p class="text-sm text-gray-600 mb-4">${message}</p>
                    <button onclick="loadDemo()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                        重新加载
                    </button>
                </div>
            `;
        }

        // 渲染所有内容
        function renderAll(payload) {
            document.getElementById('submission-id-display').textContent = payload.submission_id;
            renderSummary(payload.summary);
            renderTimeline(payload.timeline);
            renderEvidence(payload.evidence);
            renderSuggestions(payload.suggestions);
        }

        // 渲染执行摘要
        function renderSummary(summary) {
            const statusClass = {
                'success': 'bg-green-100 text-green-800',
                'failed': 'bg-red-100 text-red-800',
                'partial': 'bg-yellow-100 text-yellow-800'
            }[summary.overall_status] || 'bg-gray-100 text-gray-800';

            const statusText = {
                'success': '全部通过',
                'failed': '未通过',
                'partial': '部分通过'
            }[summary.overall_status] || summary.overall_status;

            document.getElementById('summary-content').innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">执行状态</p>
                        <span class="inline-block px-3 py-1 rounded-full text-sm font-semibold ${statusClass}">
                            ${statusText}
                        </span>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 mb-1">通过率</p>
                        <p class="text-lg font-semibold text-gray-900">${summary.pass_rate}</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 mb-1">执行时间</p>
                        <p class="text-lg font-semibold text-gray-900">${summary.execution_time_ms}ms</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 mb-1">错误数量</p>
                        <p class="text-lg font-semibold text-gray-900">${summary.error_count}</p>
                    </div>
                </div>
                ${summary.primary_issue ? `
                    <div class="mt-4 p-3 bg-red-50 border-l-4 border-red-500 rounded">
                        <p class="text-sm font-semibold text-red-800 mb-1">主要问题</p>
                        <p class="text-sm text-red-700">${summary.primary_issue}</p>
                    </div>
                ` : ''}
            `;
        }

        // 渲染时间线
        function renderTimeline(timeline) {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            timeline.forEach((node, index) => {
                const nodeEl = createTimelineNode(node, index === 0);
                container.appendChild(nodeEl);
            });

            // 高亮第一个失败节点
            highlightFirstFailure(timeline);
        }

        // 创建时间线节点
        function createTimelineNode(node, isFirst) {
            const div = document.createElement('div');
            div.className = `timeline-node border-l-4 ${getBorderColor(node.status)} bg-white p-4 rounded-r-lg shadow-sm`;
            div.setAttribute('data-node-id', node.node_id);

            div.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <span class="text-2xl">${getNodeIcon(node.node_type)}</span>
                        <h3 class="font-semibold text-gray-900">${node.title}</h3>
                    </div>
                    <span class="badge ${getBadgeClass(node.status)} px-3 py-1 rounded-full text-sm font-semibold">
                        ${getStatusText(node.status)}
                    </span>
                </div>
                <p class="text-gray-700 mb-2">${node.description}</p>
                ${node.duration_ms ? `<div class="text-sm text-gray-500">耗时: ${node.duration_ms}ms</div>` : ''}
            `;

            // 如果有子节点，添加展开/收起功能
            if (node.children && node.children.length > 0) {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'node-children mt-4 ml-6 space-y-2';
                childrenContainer.style.display = 'none';

                node.children.forEach(child => {
                    childrenContainer.appendChild(createTimelineNode(child, false));
                });

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'text-blue-600 text-sm mt-2 hover:underline focus:outline-none';
                toggleBtn.textContent = `展开 ${node.children.length} 个子节点 ▼`;
                toggleBtn.onclick = () => {
                    const isHidden = childrenContainer.style.display === 'none';
                    childrenContainer.style.display = isHidden ? 'block' : 'none';
                    toggleBtn.textContent = isHidden
                        ? `收起子节点 ▲`
                        : `展开 ${node.children.length} 个子节点 ▼`;
                };

                div.appendChild(toggleBtn);
                div.appendChild(childrenContainer);
            }

            return div;
        }

        // 渲染证据面板
        function renderEvidence(evidence) {
            const container = document.getElementById('evidence-container');
            container.innerHTML = '';

            // 1. 代码快照
            if (evidence.code_snapshot) {
                const codeCard = document.createElement('div');
                codeCard.className = 'mb-4';
                codeCard.innerHTML = `
                    <h3 class="font-semibold text-gray-900 mb-2">代码快照</h3>
                    <pre class="bg-gray-900 text-gray-100 p-4 rounded overflow-x-auto text-sm">
${renderCodeWithHighlight(evidence.code_snapshot)}
                    </pre>
                `;
                container.appendChild(codeCard);
            }

            // 2. 错误输出
            if (evidence.execution_output && evidence.execution_output.stderr) {
                const stderrCard = document.createElement('div');
                stderrCard.className = 'mb-4';
                stderrCard.innerHTML = `
                    <h3 class="font-semibold text-red-600 mb-2">错误输出</h3>
                    <pre class="text-sm text-red-700 bg-red-50 p-3 rounded overflow-x-auto">${escapeHtml(evidence.execution_output.stderr)}</pre>
                `;
                container.appendChild(stderrCard);
            }

            // 3. 测试用例结果
            if (evidence.testcase_results && evidence.testcase_results.length > 0) {
                const testcaseCard = document.createElement('div');
                testcaseCard.innerHTML = `
                    <h3 class="font-semibold text-gray-900 mb-2">测试用例结果</h3>
                    <div class="space-y-2">
                        ${evidence.testcase_results.map(tc => `
                            <div class="border rounded p-2 ${tc.match ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-sm font-semibold">#${tc.testcase_id}</span>
                                    <span class="text-lg">${tc.match ? '✓' : '✗'}</span>
                                </div>
                                <div class="text-xs space-y-1">
                                    <div><span class="text-gray-600">输入:</span> <code class="bg-white px-1 rounded">${tc.input}</code></div>
                                    <div><span class="text-gray-600">期望:</span> <code class="bg-white px-1 rounded">${tc.expected_output}</code></div>
                                    <div><span class="text-gray-600">实际:</span> <code class="bg-white px-1 rounded">${tc.actual_output || '(错误)'}</code></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(testcaseCard);
            }
        }

        // 渲染代码并高亮错误行
        function renderCodeWithHighlight(codeSnapshot) {
            const lines = codeSnapshot.full_code.split('\n');
            const errorLines = codeSnapshot.error_lines || [];

            return lines.map((line, idx) => {
                const lineNum = idx + 1;
                const isError = errorLines.includes(lineNum);
                const lineClass = isError ? 'error-line' : '';

                let displayLine = escapeHtml(line);

                // 高亮变量
                if (isError && codeSnapshot.highlight_ranges) {
                    codeSnapshot.highlight_ranges.forEach(range => {
                        if (range.line === lineNum) {
                            const before = displayLine.substring(0, range.start_col);
                            const highlight = displayLine.substring(range.start_col, range.end_col);
                            const after = displayLine.substring(range.end_col);
                            displayLine = before + `<mark class="bg-red-300 px-1">${highlight}</mark>` + after;
                        }
                    });
                }

                return `<div class="code-line ${lineClass}"><span class="line-number">${lineNum}</span><span class="line-content">${displayLine}</span></div>`;
            }).join('\n');
        }

        // 渲染建议列表
        function renderSuggestions(suggestions) {
            const container = document.getElementById('suggestions-container');
            container.innerHTML = '';

            if (!suggestions || suggestions.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">暂无修复建议</p>';
                return;
            }

            suggestions.forEach(suggestion => {
                const suggestionEl = document.createElement('div');
                const borderColor = suggestion.priority === 1 ? 'border-red-500' : 'border-gray-300';
                suggestionEl.className = `border-l-4 ${borderColor} bg-white p-4 rounded-r-lg shadow-sm`;
                suggestionEl.setAttribute('data-priority', suggestion.priority);

                suggestionEl.innerHTML = `
                    <div class="flex items-center gap-2 mb-2">
                        <span class="priority-badge ${getPriorityBadgeClass(suggestion.priority)} px-2 py-1 rounded text-xs font-semibold">
                            优先级 ${suggestion.priority}
                        </span>
                        <span class="category-badge bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs">
                            ${getCategoryText(suggestion.category)}
                        </span>
                    </div>
                    <h4 class="font-semibold text-gray-900 mb-2">${suggestion.title}</h4>
                    <p class="text-sm text-gray-700 mb-3">${suggestion.description}</p>
                    ${suggestion.example_fix ? `
                        <div class="bg-gray-50 p-2 rounded text-xs">
                            <strong>示例修复：</strong>
                            <pre class="mt-1 overflow-x-auto"><code>${escapeHtml(suggestion.example_fix)}</code></pre>
                        </div>
                    ` : ''}
                `;

                container.appendChild(suggestionEl);
            });
        }

        // 高亮第一个失败节点
        function highlightFirstFailure(timeline) {
            for (const node of timeline) {
                if (node.status === 'failed') {
                    const nodeEl = document.querySelector(`[data-node-id="${node.node_id}"]`);
                    if (nodeEl) {
                        nodeEl.classList.add('ring-2', 'ring-red-500', 'ring-offset-2');
                        setTimeout(() => {
                            nodeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 300);
                    }
                    return;
                }

                if (node.children && node.children.length > 0) {
                    highlightFirstFailure(node.children);
                }
            }
        }

        // 辅助函数
        function getBorderColor(status) {
            const colors = {
                'success': 'border-green-500',
                'failed': 'border-red-500',
                'warning': 'border-yellow-500',
                'running': 'border-blue-500',
                'skipped': 'border-gray-400'
            };
            return colors[status] || 'border-gray-400';
        }

        function getBadgeClass(status) {
            const classes = {
                'success': 'bg-green-100 text-green-800',
                'failed': 'bg-red-100 text-red-800',
                'warning': 'bg-yellow-100 text-yellow-800',
                'running': 'bg-blue-100 text-blue-800',
                'skipped': 'bg-gray-100 text-gray-600'
            };
            return classes[status] || 'bg-gray-100 text-gray-600';
        }

        function getNodeIcon(nodeType) {
            const icons = {
                'submit_received': '📥',
                'compile': '🔍',
                'run_start': '▶️',
                'testcase': '✓',
                'testcase_loop': '🔄',
                'diagnosis': '🤖',
                'finish': '🏁'
            };
            return icons[nodeType] || '•';
        }

        function getStatusText(status) {
            const texts = {
                'success': '通过',
                'failed': '失败',
                'warning': '警告',
                'running': '运行中',
                'skipped': '跳过'
            };
            return texts[status] || status;
        }

        function getPriorityBadgeClass(priority) {
            if (priority === 1) return 'bg-red-100 text-red-800';
            if (priority === 2) return 'bg-orange-100 text-orange-800';
            return 'bg-blue-100 text-blue-800';
        }

        function getCategoryText(category) {
            const texts = {
                'fix_error': '修复错误',
                'improve_logic': '改进逻辑',
                'verify': '验证',
                'learn': '学习'
            };
            return texts[category] || category;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 页面加载完成后自动加载演示数据
        window.addEventListener('DOMContentLoaded', () => {
            console.log('页面加载完成，准备加载演示数据');
            // 可以在这里自动调用 loadDemo()
        });
    </script>
</body>
</html>
