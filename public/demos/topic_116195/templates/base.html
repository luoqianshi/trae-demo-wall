<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学生代码诊断平台{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Ace Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/mode-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/theme-monokai.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 自定义样式 -->
    <style>
        :root {
            /* Color System - 趣味教育主题（鲜艳引人入胜的Claymorphism风格） */
            --primary: #4F46E5;           /* 学习靛蓝 - 主要操作 */
            --primary-hover: #4338CA;     /* 深靛蓝 - 悬停状态 */
            --secondary: #0D9488;         /* 进度青色 - 次要操作 */
            --accent: #F97316;            /* 成就橙色 - 强调色/CTA */
            --success: #22C55E;           /* 成功绿色 */
            --warning: #FBBF24;           /* 警告黄色 */
            --danger: #EF4444;            /* 错误红色 */
            --info: #06B6D4;              /* 信息青色 */
            --purple: #A78BFA;            /* 紫色装饰 */

            /* Background Colors - 明亮柔和的教育风格 */
            --bg-primary: #EEF2FF;        /* 主背景 - 靛蓝极浅 */
            --bg-secondary: #E0E7FF;      /* 次级背景 - 靛蓝浅 */
            --bg-tertiary: #C7D2FE;       /* 三级背景 - 靛蓝中浅 */
            --bg-card: rgba(255, 255, 255, 0.95);  /* 卡片背景 - 半透明白色 */
            --bg-hover: #E0E7FF;          /* 悬停背景 */

            /* Text Colors - 确保对比度 */
            --text-primary: #312E81;      /* 主文本 - 深靛蓝 (对比度 8.5:1 ✓) */
            --text-secondary: #4C1D95;    /* 次级文本 - 紫色 (对比度 6.2:1 ✓) */
            --text-tertiary: #6366F1;     /* 三级文本 - 靛蓝 (对比度 4.5:1 ✓) */

            /* Border Colors - Claymorphism粗边框 */
            --border-primary: #C7D2FE;    /* 主边框 */
            --border-secondary: #A5B4FC;  /* 次级边框 */
            --border-hover: #818CF8;      /* 悬停边框 */

            /* Shadows - Claymorphism双层阴影 */
            --shadow-sm: 0 2px 4px 0 rgba(79, 70, 229, 0.1);
            --shadow-md: 0 4px 8px -2px rgba(79, 70, 229, 0.15), 0 2px 4px -1px rgba(79, 70, 229, 0.1);
            --shadow-lg: 0 10px 20px -5px rgba(79, 70, 229, 0.2), 0 4px 8px -2px rgba(79, 70, 229, 0.1);
            --shadow-xl: 0 20px 30px -10px rgba(79, 70, 229, 0.25), 0 10px 15px -5px rgba(79, 70, 229, 0.15);
            --shadow-glow: 0 0 20px rgba(79, 70, 229, 0.3);
            --shadow-glow-green: 0 0 20px rgba(34, 197, 94, 0.3);
            --shadow-glow-orange: 0 0 20px rgba(249, 115, 22, 0.3);

            /* Spacing */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;

            /* Typography */
            --font-heading: 'Fira Code', monospace;
            --font-sans: 'Fira Sans', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            --font-mono: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;

            /* Minimum font size for mobile */
            --font-size-base: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            font-size: var(--font-size-base);
        }

        /* Headings use Fira Code */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        /* Focus styles for accessibility */
        *:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        *:focus:not(:focus-visible) {
            outline: none;
        }

        /* 代码编辑器容器样式 */
        .ace-editor-container {
            border: 1px solid var(--border-primary);
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        /* 加载动画 */
        .spinner {
            border: 3px solid var(--bg-tertiary);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 时间线样式 */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 30px;
            bottom: -10px;
            width: 2px;
            background: var(--border-primary);
        }

        .timeline-item:last-child::before {
            display: none;
        }

        /* Card styles - Claymorphism风格 */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 3px solid var(--border-primary);  /* 粗边框 */
            border-radius: 1.25rem;  /* 更圆润 20px */
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease-out;
        }

        .card.clickable {
            cursor: pointer;
        }

        .card.clickable:hover {
            transform: translateY(-4px);  /* 更明显的上浮 */
            box-shadow: var(--shadow-xl);  /* 更强的阴影 */
            border-color: var(--primary);
            background: #ffffff;
        }

        /* Button styles - Claymorphism风格 */
        .btn {
            font-weight: 600;  /* 更粗的字体 */
            padding: 0.75rem 1.5rem;  /* 更大的内边距 */
            border-radius: 1rem;  /* 更圆润 16px */
            transition: all 0.2s ease-out;
            cursor: pointer;
            border: 3px solid transparent;  /* 粗边框 */
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-md);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);  /* 按钮上浮 */
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);  /* 按下效果 */
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 3px solid var(--border-primary);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-hover);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .btn-secondary:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Input styles - Claymorphism风格 */
        .input {
            background: #ffffff;
            border: 3px solid var(--border-primary);  /* 粗边框 */
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 1rem;  /* 更圆润 */
            font-family: var(--font-sans);
            transition: all 0.2s ease-out;
            box-shadow: var(--shadow-sm);
        }

        .input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);  /* 更明显的光晕 */
            background: #ffffff;
            outline: none;
        }

        .input::placeholder {
            color: var(--text-tertiary);
        }

        /* Toast animations */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-enter {
            animation: slideInRight 0.3s ease;
        }

        .toast-exit {
            animation: slideOutRight 0.3s ease;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* Mobile responsive */
        @media (max-width: 640px) {
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }
        }

        /* Clickable elements cursor */
        a, button, .clickable, [role="button"], [onclick] {
            cursor: pointer;
        }

        /* Loading state for buttons */
        .btn-loading {
            position: relative;
            pointer-events: none;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Skeleton loading animation - 更新为新配色 */
        .skeleton {
            background: linear-gradient(
                90deg,
                var(--bg-secondary) 0%,
                var(--bg-tertiary) 50%,
                var(--bg-secondary) 100%
            );
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s ease-in-out infinite;
            border-radius: 1rem;  /* 更圆润 */
        }
                #e2e8f0 100%
            );
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s ease-in-out infinite;
            border-radius: 0.375rem;
        }

        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .skeleton-text {
            height: 1rem;
            margin-bottom: 0.5rem;
        }

        .skeleton-title {
            height: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .skeleton-button {
            height: 2.5rem;
            width: 100%;
        }

        .skeleton-card {
            height: 10rem;
        }

        /* Ensure no horizontal scroll on mobile */
        body {
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            overflow-x: hidden;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav style="background: var(--bg-card); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-primary); box-shadow: var(--shadow-md);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <svg class="w-8 h-8" style="color: var(--primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                    </svg>
                    <h1 class="text-xl font-bold" style="color: var(--text-primary); letter-spacing: -0.02em;">代码诊断平台</h1>
                </div>
                <div class="flex items-center gap-6">
                    {% if not request.user.is_staff %}
                    <a href="/problems" class="nav-link" style="color: var(--text-secondary); transition: color 0.2s ease; font-weight: 500; cursor: pointer;"
                       onmouseover="this.style.color='var(--primary)'"
                       onmouseout="this.style.color='var(--text-secondary)'">
                        <svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        题目列表
                    </a>
                    <a href="/history" class="nav-link" style="color: var(--text-secondary); transition: color 0.2s ease; font-weight: 500; cursor: pointer;"
                       onmouseover="this.style.color='var(--primary)'"
                       onmouseout="this.style.color='var(--text-secondary)'">
                        <svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        历史记录
                    </a>
                    {% endif %}
                    <div class="flex items-center gap-3 pl-6" style="border-left: 1px solid var(--border-primary);">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background: var(--bg-tertiary);">
                                <svg class="w-5 h-5" style="color: var(--primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                            </div>
                            <span style="color: var(--text-primary); font-weight: 500;">{{ request.user.username }}</span>
                        </div>
                        <button type="button" onclick="handleLogout()"
                                class="btn-secondary"
                                style="padding: 0.5rem 1rem; font-size: 0.875rem;"
                                aria-label="退出登录">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                            </svg>
                            退出
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- 全局Toast提示 -->
    <div id="toast-container" class="fixed top-4 right-4 z-50" role="region" aria-live="polite" aria-label="通知消息"></div>

    <!-- 全局工具函数 -->
    <script>
        // Toast提示函数
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const styles = {
                'success': 'background: var(--success); color: white;',
                'error': 'background: var(--danger); color: white;',
                'warning': 'background: var(--warning); color: white;',
                'info': 'background: var(--primary); color: white;'
            };

            const icons = {
                'success': '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>',
                'error': '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>',
                'warning': '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>',
                'info': '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>'
            };

            toast.className = 'toast-enter flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg mb-2 font-medium';
            toast.style.cssText = styles[type] + ' min-width: 250px;';
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `${icons[type]}<span>${message}</span>`;

            container.appendChild(toast);

            // 3秒后自动消失
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // 获取CSRF token
        function getCsrfToken() {
            const name = 'csrftoken';
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // API请求封装
        async function apiRequest(url, options = {}) {
            try {
                const headers = {
                    'Content-Type': 'application/json',
                    ...options.headers
                };

                // 为POST、PUT、DELETE请求添加CSRF token
                if (options.method && ['POST', 'PUT', 'DELETE', 'PATCH'].includes(options.method.toUpperCase())) {
                    const csrfToken = getCsrfToken();
                    if (csrfToken) {
                        headers['X-CSRFToken'] = csrfToken;
                    }
                }

                const response = await fetch(url, {
                    ...options,
                    headers: headers,
                    credentials: 'include'  // 携带Cookie
                });

                const data = await response.json();

                if (!response.ok) {
                    // 翻译错误信息
                    const errorMsg = translateError(data.message || '请求失败');
                    throw new Error(errorMsg);
                }

                return data;
            } catch (error) {
                console.error('API请求错误:', error);
                throw error;
            }
        }

        // 翻译错误信息为中文
        function translateError(errorMessage) {
            if (!errorMessage) return errorMessage;

            const translations = {
                "'NoneType' object has no attribute 'strip'": "空值对象没有 strip 方法（可能是 input() 返回了空值）",
                "'NoneType' object has no attribute": "空值对象没有该属性",
                "name '": "变量 '",
                "' is not defined": "' 未定义",
                "invalid syntax": "语法错误",
                "unexpected EOF": "代码不完整，缺少结束符",
                "IndentationError": "缩进错误",
                "SyntaxError": "语法错误",
                "NameError": "变量名错误",
                "TypeError": "类型错误",
                "ValueError": "值错误",
                "AttributeError": "属性错误",
                "IndexError": "索引错误",
                "KeyError": "键错误",
                "ZeroDivisionError": "除零错误",
                "ImportError": "导入错误",
                "ModuleNotFoundError": "模块未找到",
                "FileNotFoundError": "文件未找到"
            };

            let translatedMessage = errorMessage;
            for (const [english, chinese] of Object.entries(translations)) {
                if (translatedMessage.includes(english)) {
                    translatedMessage = translatedMessage.replace(english, chinese);
                }
            }

            return translatedMessage;
        }

        // 格式化时间
        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';

            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
        }

        // 退出登录
        async function handleLogout() {
            console.log('handleLogout called');
            try {
                // 获取CSRF token
                const csrfToken = getCookie('csrftoken');
                console.log('CSRF token:', csrfToken);

                const response = await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken
                    },
                    credentials: 'include'
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (data.ok) {
                    showToast('退出成功', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 500);
                } else {
                    showToast('退出失败: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('退出登录错误:', error);
                // 即使出错也跳转到登录页
                window.location.href = '/login';
            }
        }

        // 获取Cookie的函数
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
