{% extends "base.html" %}

{% block title %}创建作业{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- 页面标题 -->
    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold" style="color: var(--text-primary); letter-spacing: -0.02em;">创建作业</h1>
            <p class="mt-2" style="color: var(--text-secondary);">创建新的编程作业并发布给班级</p>
        </div>
        <a href="/teacher/assignments" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition-colors">
            返回作业列表
        </a>
    </div>

    <!-- 创建表单 -->
    <div class="card p-6">
        <form id="problem-form">
            <!-- 基本信息 -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold mb-4" style="color: var(--text-primary);">基本信息</h3>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">作业标题 <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="title" class="input w-full" placeholder="例如：判断奇偶数" required>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">作业描述 <span style="color: #dc2626;">*</span></label>
                    <textarea id="description" class="input w-full" rows="4" placeholder="详细描述作业要求..." required></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">难度 <span style="color: #dc2626;">*</span></label>
                        <select id="difficulty" class="input w-full" required>
                            <option value="">请选择难度</option>
                            <option value="easy">简单</option>
                            <option value="medium">中等</option>
                            <option value="hard">困难</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-2">截止时间</label>
                        <input type="datetime-local" id="deadline" class="input w-full">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">作业说明</label>
                    <textarea id="instructions" class="input w-full" rows="3" placeholder="补充说明和提示..."></textarea>
                </div>
            </div>

            <!-- 班级选择 -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold mb-4" style="color: var(--text-primary);">发布范围</h3>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">选择班级</label>
                    <p class="text-sm mb-2" style="color: var(--text-secondary);">留空表示所有学生可见</p>
                    <div id="classes-container" class="space-y-2">
                        <p class="text-sm" style="color: var(--text-tertiary);">加载班级中...</p>
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="is-published" class="mr-2" checked>
                    <label for="is-published" class="text-sm font-medium">立即发布（取消勾选则保存为草稿）</label>
                </div>
            </div>

            <!-- 测试用例 -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold mb-4" style="color: var(--text-primary);">测试用例 <span style="color: #dc2626;">*</span></h3>

                <div id="test-cases-container" class="space-y-3">
                    <!-- 测试用例将通过JavaScript动态添加 -->
                </div>

                <button type="button" id="btn-add-test-case" class="btn btn-secondary mt-3">
                    <svg class="w-5 h-5 mr-2 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    添加测试用例
                </button>
            </div>

            <!-- 提交按钮 -->
            <div class="flex items-center gap-3">
                <button type="submit" class="btn btn-primary">
                    <svg class="w-5 h-5 mr-2 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    创建作业
                </button>
                <a href="/teacher/assignments" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    let testCaseCount = 0;
    let classes = [];

    // 加载班级列表
    async function loadClasses() {
        try {
            const response = await apiRequest('/teacher/api/classes');
            if (response.ok && response.data) {
                classes = response.data.classes || [];
                renderClasses();
            }
        } catch (error) {
            console.error('加载班级失败:', error);
            document.getElementById('classes-container').innerHTML =
                '<p class="text-sm" style="color: var(--danger);">加载班级失败</p>';
        }
    }

    // 渲染班级列表
    function renderClasses() {
        const container = document.getElementById('classes-container');

        if (classes.length === 0) {
            container.innerHTML = '<p class="text-sm" style="color: var(--text-tertiary);">暂无班级</p>';
            return;
        }

        container.innerHTML = classes.map(cls => `
            <div class="flex items-center">
                <input type="checkbox" id="class-${cls.id}" value="${cls.id}" class="class-checkbox mr-2">
                <label for="class-${cls.id}" class="text-sm">${cls.name}</label>
            </div>
        `).join('');
    }

    // 添加测试用例
    function addTestCase() {
        testCaseCount++;
        const container = document.getElementById('test-cases-container');

        const testCaseHtml = `
            <div class="test-case-item border rounded-lg p-4" style="border-color: var(--border-primary);" data-index="${testCaseCount}">
                <div class="flex items-center justify-between mb-3">
                    <h4 class="font-medium">测试用例 ${testCaseCount}</h4>
                    <button type="button" class="text-red-600 hover:text-red-700" onclick="removeTestCase(${testCaseCount})">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium mb-1">输入</label>
                        <input type="text" class="input w-full test-case-input" placeholder="例如：5" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">预期输出</label>
                        <input type="text" class="input w-full test-case-output" placeholder="例如：False" required>
                    </div>
                </div>
                <div class="mt-3">
                    <label class="block text-sm font-medium mb-1">说明</label>
                    <input type="text" class="input w-full test-case-description" placeholder="测试用例说明（可选）">
                </div>
            </div>
        `;

        container.insertAdjacentHTML('beforeend', testCaseHtml);
    }

    // 删除测试用例
    function removeTestCase(index) {
        const element = document.querySelector(`.test-case-item[data-index="${index}"]`);
        if (element) {
            element.remove();
        }
    }

    // 收集测试用例数据
    function collectTestCases() {
        const testCases = [];
        const items = document.querySelectorAll('.test-case-item');

        items.forEach(item => {
            const input = item.querySelector('.test-case-input').value.trim();
            const output = item.querySelector('.test-case-output').value.trim();
            const description = item.querySelector('.test-case-description').value.trim();

            if (input && output) {
                testCases.push({
                    input: input,
                    output: output,
                    description: description
                });
            }
        });

        return testCases;
    }

    // 收集选中的班级ID
    function collectClassIds() {
        const checkboxes = document.querySelectorAll('.class-checkbox:checked');
        return Array.from(checkboxes).map(cb => parseInt(cb.value));
    }

    // 提交表单
    async function submitForm(e) {
        e.preventDefault();

        // 收集表单数据
        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const difficulty = document.getElementById('difficulty').value;
        const deadline = document.getElementById('deadline').value;
        const instructions = document.getElementById('instructions').value.trim();
        const isPublished = document.getElementById('is-published').checked;
        const classIds = collectClassIds();
        const testCases = collectTestCases();

        // 验证
        if (!title || !description || !difficulty) {
            showToast('请填写所有必填项', 'error');
            return;
        }

        if (testCases.length === 0) {
            showToast('请至少添加一个测试用例', 'error');
            return;
        }

        // 构建请求数据
        const data = {
            title: title,
            description: description,
            difficulty: difficulty,
            test_cases: testCases,
            is_published: isPublished
        };

        if (classIds.length > 0) {
            data.class_ids = classIds;
        }

        if (deadline) {
            data.deadline = deadline;
        }

        if (instructions) {
            data.instructions = instructions;
        }

        try {
            const response = await apiRequest('/teacher/api/problems/create', {
                method: 'POST',
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showToast('作业创建成功', 'success');
                setTimeout(() => {
                    window.location.href = '/teacher/assignments';
                }, 1000);
            } else {
                showToast(response.error || '创建失败', 'error');
            }
        } catch (error) {
            console.error('创建作业失败:', error);
            showToast('创建失败，请重试', 'error');
        }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
        // 加载班级列表
        loadClasses();

        // 添加第一个测试用例
        addTestCase();

        // 绑定添加测试用例按钮
        document.getElementById('btn-add-test-case').addEventListener('click', addTestCase);

        // 绑定表单提交
        document.getElementById('problem-form').addEventListener('submit', submitForm);
    });
</script>
{% endblock %}
