{% extends "base.html" %}

{% block title %}创建作业{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- 页面标题 -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold" style="color: var(--text-primary); letter-spacing: -0.02em;">创建作业</h1>
        <p class="mt-2" style="color: var(--text-secondary);">创建新的编程作业并发布给班级</p>
    </div>

    <!-- 选项卡 -->
    <div class="card mb-6">
        <div class="flex border-b" style="border-color: var(--border-primary);">
            <button id="tab-create" class="tab-button active px-6 py-4 font-medium transition-colors" onclick="switchTab('create')">
                自己创建作业
            </button>
            <button id="tab-select" class="tab-button px-6 py-4 font-medium transition-colors" onclick="switchTab('select')">
                选择公共题目
            </button>
        </div>

        <!-- 自己创建作业 -->
        <div id="panel-create" class="tab-panel p-6">
            <form id="form-create-assignment">
                <!-- 基本信息 -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-4" style="color: var(--text-primary);">基本信息</h3>

                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">作业标题 *</label>
                        <input type="text" id="title" name="title" required class="input w-full" placeholder="例如: 判断奇偶数">
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">作业描述 *</label>
                        <textarea id="description" name="description" required rows="4" class="input w-full" placeholder="详细描述作业要求..."></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">难度 *</label>
                            <select id="difficulty" name="difficulty" required class="input w-full">
                                <option value="">请选择难度</option>
                                <option value="easy">简单</option>
                                <option value="medium">中等</option>
                                <option value="hard">困难</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">截止时间</label>
                            <input type="datetime-local" id="deadline" name="deadline" class="input w-full">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">作业说明</label>
                        <textarea id="instructions" name="instructions" rows="3" class="input w-full" placeholder="补充说明和提示..."></textarea>
                    </div>
                </div>

                <!-- 发布范围 -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-4" style="color: var(--text-primary);">发布范围</h3>
                    <div id="class-checkboxes" class="space-y-2">
                        <!-- 动态加载班级列表 -->
                    </div>
                    <div class="mt-3">
                        <label class="flex items-center">
                            <input type="checkbox" id="publish-now" checked class="mr-2">
                            <span class="text-sm" style="color: var(--text-secondary);">立即发布（取消后将保存为草稿）</span>
                        </label>
                    </div>
                </div>

                <!-- 测试用例 -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-4" style="color: var(--text-primary);">测试用例 *</h3>
                    <div id="test-cases-container" class="space-y-4">
                        <!-- 测试用例将动态添加 -->
                    </div>
                    <button type="button" onclick="addTestCase()" class="btn btn-secondary mt-3">
                        + 添加测试用例
                    </button>
                </div>

                <!-- 操作按钮 -->
                <div class="flex items-center gap-3">
                    <button type="submit" class="btn btn-primary">创建作业</button>
                    <a href="/teacher/assignments" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>

        <!-- 选择公共题目 -->
        <div id="panel-select" class="tab-panel p-6 hidden">
            <form id="form-select-assignment">
                <!-- 题目选择 -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-4" style="color: var(--text-primary);">选择公共题目</h3>
                    <div id="public-problems-list" class="space-y-3">
                        <!-- 动态加载公共题目 -->
                    </div>
                </div>

                <!-- 发布范围 -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-4" style="color: var(--text-primary);">发布范围</h3>
                    <div id="class-checkboxes-select" class="space-y-2">
                        <!-- 动态加载班级列表 -->
                    </div>
                    <div class="mt-3">
                        <label class="flex items-center">
                            <input type="checkbox" id="publish-now-select" checked class="mr-2">
                            <span class="text-sm" style="color: var(--text-secondary);">立即发布</span>
                        </label>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="flex items-center gap-3">
                    <button type="submit" class="btn btn-primary">发布作业</button>
                    <a href="/teacher/assignments" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let testCaseCount = 0;
let selectedProblemId = null;

// 切换选项卡
function switchTab(tab) {
    const tabs = ['create', 'select'];
    tabs.forEach(t => {
        const button = document.getElementById(`tab-${t}`);
        const panel = document.getElementById(`panel-${t}`);

        if (t === tab) {
            button.classList.add('active');
            panel.classList.remove('hidden');
        } else {
            button.classList.remove('active');
            panel.classList.add('hidden');
        }
    });
}

// 添加测试用例
function addTestCase() {
    testCaseCount++;
    const container = document.getElementById('test-cases-container');
    const div = document.createElement('div');
    div.className = 'card p-4';
    div.id = `test-case-${testCaseCount}`;
    div.innerHTML = `
        <div class="flex items-start justify-between mb-3">
            <h4 class="font-medium" style="color: var(--text-primary);">测试用例 ${testCaseCount}</h4>
            <button type="button" onclick="removeTestCase(${testCaseCount})" class="text-red-500 hover:text-red-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">输入</label>
                <textarea class="input w-full test-case-input" rows="3" placeholder="测试输入"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">预期输出</label>
                <textarea class="input w-full test-case-output" rows="3" placeholder="预期输出"></textarea>
            </div>
        </div>
    `;
    container.appendChild(div);
}

// 删除测试用例
function removeTestCase(id) {
    const element = document.getElementById(`test-case-${id}`);
    if (element) {
        element.remove();
    }
}

// 加载班级列表
async function loadClasses() {
    try {
        const response = await apiRequest('/teacher/api/classes');
        if (response.ok && response.data.classes) {
            const container1 = document.getElementById('class-checkboxes');
            const container2 = document.getElementById('class-checkboxes-select');

            response.data.classes.forEach(cls => {
                const html = `
                    <label class="flex items-center p-3 rounded-lg hover:bg-gray-50 cursor-pointer">
                        <input type="checkbox" name="class_ids" value="${cls.id}" class="mr-3">
                        <span style="color: var(--text-primary);">${cls.name}</span>
                    </label>
                `;
                container1.innerHTML += html;
                container2.innerHTML += html;
            });
        }
    } catch (error) {
        console.error('加载班级失败:', error);
    }
}

// 加载公共题目
async function loadPublicProblems() {
    try {
        const response = await apiRequest('/api/problems?page=1&page_size=100');
        if (response.ok && response.data.problems) {
            const container = document.getElementById('public-problems-list');
            container.innerHTML = '';

            response.data.problems.forEach(problem => {
                // 处理难度显示
                const difficultyMap = {
                    'easy': '简单',
                    'medium': '中等',
                    'hard': '困难'
                };
                const difficultyDisplay = problem.difficulty_display || difficultyMap[problem.difficulty] || problem.difficulty;
                const testCasesCount = problem.test_cases_count || problem.test_case_count || 0;

                const div = document.createElement('div');
                div.className = 'card p-4 cursor-pointer hover:border-blue-500 transition-colors';
                div.onclick = () => selectProblem(problem.id, div);
                div.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <h4 class="font-medium mb-1" style="color: var(--text-primary);">${problem.title}</h4>
                            <p class="text-sm mb-2" style="color: var(--text-secondary);">${problem.description.substring(0, 100)}...</p>
                            <div class="flex items-center gap-3 text-sm">
                                <span class="badge badge-${problem.difficulty}">${difficultyDisplay}</span>
                                <span style="color: var(--text-tertiary);">${testCasesCount} 个测试用例</span>
                            </div>
                        </div>
                        <input type="radio" name="problem_id" value="${problem.id}" class="ml-3">
                    </div>
                `;
                container.appendChild(div);
            });
        }
    } catch (error) {
        console.error('加载公共题目失败:', error);
    }
}

// 选择题目
function selectProblem(id, element) {
    selectedProblemId = id;
    document.querySelectorAll('#public-problems-list .card').forEach(card => {
        card.classList.remove('border-blue-500');
    });
    element.classList.add('border-blue-500');
    element.querySelector('input[type="radio"]').checked = true;
}

// 提交创建作业表单
document.getElementById('form-create-assignment').addEventListener('submit', async (e) => {
    e.preventDefault();

    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;
    const difficulty = document.getElementById('difficulty').value;
    const deadline = document.getElementById('deadline').value;
    const instructions = document.getElementById('instructions').value;
    const isPublished = document.getElementById('publish-now').checked;

    // 获取选中的班级
    const classIds = Array.from(document.querySelectorAll('#class-checkboxes input[name="class_ids"]:checked'))
        .map(cb => parseInt(cb.value));

    if (classIds.length === 0) {
        alert('请至少选择一个班级');
        return;
    }

    // 获取测试用例
    const testCases = [];
    document.querySelectorAll('#test-cases-container .card').forEach(card => {
        const input = card.querySelector('.test-case-input').value;
        const output = card.querySelector('.test-case-output').value;
        if (input && output) {
            testCases.push({ input, output });
        }
    });

    if (testCases.length === 0) {
        alert('请至少添加一个测试用例');
        return;
    }

    try {
        const response = await apiRequest('/teacher/api/problems/create', {
            method: 'POST',
            body: JSON.stringify({
                title,
                description,
                difficulty,
                deadline: deadline || null,
                instructions,
                class_ids: classIds,
                test_cases: testCases,
                is_published: isPublished
            })
        });

        if (response.ok) {
            alert('作业创建成功！');
            window.location.href = '/teacher/assignments';
        } else {
            alert('创建失败: ' + response.message);
        }
    } catch (error) {
        console.error('创建作业失败:', error);
        alert('创建失败: ' + error.message);
    }
});

// 提交选择公共题目表单
document.getElementById('form-select-assignment').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!selectedProblemId) {
        alert('请选择一个题目');
        return;
    }

    const classIds = Array.from(document.querySelectorAll('#class-checkboxes-select input[name="class_ids"]:checked'))
        .map(cb => parseInt(cb.value));

    if (classIds.length === 0) {
        alert('请至少选择一个班级');
        return;
    }

    const isPublished = document.getElementById('publish-now-select').checked;

    try {
        const response = await apiRequest('/teacher/api/assignments/assign-problem', {
            method: 'POST',
            body: JSON.stringify({
                problem_id: selectedProblemId,
                class_ids: classIds,
                is_published: isPublished
            })
        });

        if (response.ok) {
            alert('作业发布成功！');
            window.location.href = '/teacher/assignments';
        } else {
            alert('发布失败: ' + response.message);
        }
    } catch (error) {
        console.error('发布作业失败:', error);
        alert('发布失败: ' + error.message);
    }
});

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', () => {
    loadClasses();
    loadPublicProblems();
    addTestCase(); // 默认添加一个测试用例
});
</script>

<style>
.tab-button {
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
}

.tab-button.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

.tab-button:hover {
    color: var(--primary);
}

.badge {
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 500;
}

.badge-easy {
    background: rgba(16, 185, 129, 0.1);
    color: var(--success);
}

.badge-medium {
    background: rgba(245, 158, 11, 0.1);
    color: var(--warning);
}

.badge-hard {
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
}
</style>
{% endblock %}
