<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 420px; margin: 0 auto; background: #fff; min-height: 100vh; }
        
        /* 顶部搜索区域 */
        .search-header { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); padding: 20px; }
        .search-header h1 { font-size: 20px; font-weight: 600; color: #fff; text-align: center; margin-bottom: 16px; }
        .input-group { margin-bottom: 12px; }
        .input-row { display: flex; align-items: center; background: rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; }
        .input-row svg { width: 18px; height: 18px; color: rgba(255,255,255,0.8); margin-right: 10px; }
        .input-row input { flex: 1; border: none; background: transparent; font-size: 15px; color: #fff; outline: none; }
        .input-row input::placeholder { color: rgba(255,255,255,0.6); }
        .swap-btn { display: flex; justify-content: center; margin: -6px 0; }
        .swap-btn button { width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(255,255,255,0.3); color: #fff; font-size: 14px; cursor: pointer; }
        .recommend-btn { width: 100%; background: #fff; color: #4facfe; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 12px; }

        /* 路线概览卡片 */
        .route-card { background: #fff; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        
        /* 路线头部信息 */
        .route-summary { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; }
        .route-summary-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .route-summary-top h2 { font-size: 22px; font-weight: 600; color: #333; }
        .route-summary-top span { font-size: 12px; color: #999; }
        .route-timeline { display: flex; align-items: center; height: 32px; }
        .timeline-start, .timeline-end { font-size: 11px; color: #999; width: 24px; }
        .timeline-bars { flex: 1; display: flex; align-items: center; height: 8px; border-radius: 4px; overflow: hidden; }
        .timeline-bar { height: 100%; margin-right: 2px; }
        .timeline-bar:last-child { margin-right: 0; }
        .timeline-bar.walk { background: #d0d0d0; }
        .timeline-bar.line-2 { background: #ff5722; }
        .timeline-bar.line-4 { background: #4caf50; }
        .timeline-bar.line-8 { background: #3f51b5; }
        .route-stats { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: #999; }
        .route-stats span { display: inline-flex; align-items: center; }
        .route-stats span::before { content: '·'; margin: 0 4px; }
        .route-stats span:first-child::before { content: ''; margin: 0; }

        /* 路线步骤时间线 */
        .route-steps { padding: 0 16px 16px; }
        .step-item { display: flex; padding: 12px 0; position: relative; }
        .step-item:not(:last-child)::after { content: ''; position: absolute; left: 11px; top: 40px; bottom: 0; width: 2px; background: #e8e8e8; }
        
        /* 步骤图标 */
        .step-icon-wrap { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0; }
        .step-icon-wrap.walk { background: #f0f0f0; }
        .step-icon-wrap.train { background: #fff; border: 2px solid; }
        .step-icon-wrap.transfer { background: #fff3e0; }
        .step-icon-wrap.exit { background: #f0f0f0; }
        .step-icon-wrap svg { width: 14px; height: 14px; }
        
        /* 步骤内容 */
        .step-content { flex: 1; }
        .step-title { font-size: 15px; font-weight: 500; color: #333; margin-bottom: 4px; }
        .step-desc { font-size: 13px; color: #999; margin-bottom: 8px; }
        
        /* 步骤详情卡片 - 简化版 */
        .step-detail { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .step-detail-item { display: inline-flex; align-items: center; background: #fafafa; border-radius: 4px; padding: 3px 8px; font-size: 11px; }
        .step-detail-label { color: #999; margin-right: 4px; }
        .step-detail-value { color: #333; font-weight: 500; }
        
        /* 车厢推荐 - 简化版 */
        .car-recommend { display: flex; align-items: center; background: #fff5f5; border-radius: 8px; padding: 8px 12px; margin-top: 8px; }
        .car-visual { display: flex; margin-right: 12px; }
        .car-cell { width: 8px; height: 20px; margin-right: 1px; background: #e0e0e0; border-radius: 2px; position: relative; }
        .car-cell.recommended { background: #4facfe; }
        .car-cell.recommended::after { content: '▼'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 8px; color: #4facfe; }
        .car-info { flex: 1; }
        .car-title { font-size: 13px; font-weight: 500; color: #333; }
        .car-title strong { color: #4facfe; }
        .car-desc { font-size: 11px; color: #999; margin-top: 2px; }

        /* 步行指引 - 简化版 */
        .walk-guide { background: #e3f2fd; border-radius: 8px; padding: 8px 12px; margin-top: 8px; display: flex; align-items: center; }
        .walk-icon { font-size: 20px; margin-right: 8px; }
        .walk-content { flex: 1; }
        .walk-title { font-size: 13px; font-weight: 500; color: #1976d2; }
        .walk-desc { font-size: 11px; color: #455a64; line-height: 1.4; margin-top: 2px; }

        /* 出站指引 - 简化版 */
        .exit-guide { background: #e8f5e9; border-radius: 8px; padding: 8px 12px; margin-top: 8px; display: flex; align-items: center; }
        .exit-icon { font-size: 20px; margin-right: 8px; }
        .exit-content { flex: 1; }
        .exit-title { font-size: 13px; font-weight: 500; color: #2e7d32; }
        .exit-desc { font-size: 11px; color: #455a64; line-height: 1.4; margin-top: 2px; }

        /* 预计到达时间标签 */
        .arrival-time-badge { display: inline-flex; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border-radius: 20px; padding: 4px 12px; margin-top: 6px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3); }
        .arrival-time-badge .time-icon { margin-right: 6px; font-size: 14px; }
        .arrival-time-badge .time-value { font-size: 16px; }

        /* 班次信息 - 简化版 */
        .train-schedule { background: #f0f9ff; border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
        .schedule-header { display: flex; align-items: center; margin-bottom: 8px; font-size: 11px; color: #999; }
        .schedule-track { display: flex; align-items: center; height: 36px; position: relative; }
        .schedule-dot { width: 8px; height: 8px; border-radius: 50%; background: #4facfe; z-index: 2; }
        .schedule-line { flex: 1; height: 2px; background: #d0e7ff; margin: 0 -2px; }
        .schedule-train { position: absolute; display: flex; align-items: center; gap: 4px; cursor: pointer; transition: transform 0.2s; }
        .schedule-train:hover { transform: translateY(-2px); }
        .train-icon { font-size: 14px; }
        .train-info { background: #fff; border: 2px solid #d0e7ff; border-radius: 8px; padding: 4px 8px; display: flex; flex-direction: column; align-items: center; transition: all 0.2s; }
        .train-info:hover { border-color: #4facfe; }
        .train-info-current { border-color: #4facfe; background: #4facfe; color: #fff; box-shadow: 0 2px 8px rgba(79, 172, 254, 0.4); }
        .train-time { font-size: 13px; font-weight: 600; }
        .train-time-sub { font-size: 10px; color: #999; margin-top: 1px; }
        .train-info-current .train-time-sub { color: rgba(255,255,255,0.85); }
        .schedule-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: #999; }
        .schedule-now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #ff5722; z-index: 3; }
        .schedule-now-label { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #ff5722; white-space: nowrap; }

        /* 底部统计 */
        .stats-footer { background: #f8f9fa; padding: 16px; border-top: 1px solid #eee; }
        .stats-row { display: flex; justify-content: space-around; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 20px; font-weight: 600; color: #667eea; margin-bottom: 4px; }
        .stat-label { font-size: 12px; color: #999; }

        /* 底部操作栏 */
        .action-bar { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #eee; position: sticky; bottom: 0; }
        .action-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; }
        .action-btn-primary { background: #4facfe; color: #fff; }
        .action-btn-secondary { background: #f0f0f0; color: #333; }

        /* 线路颜色类 */
        .line-color-2 { color: #ff5722; border-color: #ff5722; }
        .line-color-4 { color: #4caf50; border-color: #4caf50; }
        .line-color-8 { color: #3f51b5; border-color: #3f51b5; }
        
        /* 线路徽章 */
        .line-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #fff; margin-right: 6px; }
        .line-badge-2 { background: #ff5722; }
        .line-badge-4 { background: #4caf50; }
        .line-badge-8 { background: #3f51b5; }
    </style>
</head>

        function generateRecommend() {
            var start = document.getElementById('startStation').value;
            var end = document.getElementById('endStation').value;
            var exit = document.getElementById('exitStation').value;

            if (!start || !end) {
                alert('请输入出发站和到达站');
                return;
            }

            var route = getRouteInfo(start, end, exit);

            document.getElementById('resultSection').innerHTML = generateRouteHtml(route);
        }

        function parseTime(timeStr) {
            var parts = timeStr.split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function formatTime(minutes) {
            var h = Math.floor(minutes / 60);
            var m = minutes % 60;
            return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        }

        function addMinutes(timeStr, minutes) {
            return formatTime(parseTime(timeStr) + minutes);
        }

            element.querySelector('.train-info').classList.add('train-info-current');

            var stepItem = element.closest('.step-item');
            var routeKey = document.getElementById('startStation').value + '-' + document.getElementById('endStation').value;

            var selectedInTime = element.querySelector('.train-time-sub').textContent.replace('进站 ', '');
            var prevArriveTime = parseTime(selectedArriveTime);

            var stepElements = stepItem.parentElement.children;
            var stepIndex = Array.from(stepElements).indexOf(stepItem);
            
            var stepDurations = {
                '徐东-中南路': [6, 2, 10, 1],
                '中南路-徐东': [10, 1, 6, 1],
                '汉口火车站-江汉路': [15, 1],
                '江汉路-汉口火车站': [15, 1],
                '光谷广场-江汉路': [30, 1],
                '江汉路-光谷广场': [32, 1]
            };
            var durations = stepDurations[routeKey] || [20, 1];
            
            var durationIdx = 0;
            
            for (var i = stepIndex + 1; i < stepElements.length; i++) {
                var stepEl = stepElements[i];
                
                if (durationIdx >= 0 && durationIdx < durations.length) {
                    prevArriveTime += durations[durationIdx];
                    durationIdx++;
                }

                var arrivalBadges = stepEl.querySelectorAll('.arrival-time-badge');
                arrivalBadges.forEach(function(badge, idx) {
                    var timeVal = badge.querySelector('.time-value');
                    if (timeVal) {
                        if (idx === 0) {
                            timeVal.textContent = formatTime(prevArriveTime);
                        } else {
                            // 出站时间：下车时间 + 出站步行时间
                            if (stepEl.querySelector('.exit-guide')) {
                                timeVal.textContent = formatTime(prevArriveTime + (durations[durations.length - 1] || 1));
                            } else {
                                timeVal.textContent = formatTime(prevArriveTime);
                            }
                        }
                    }
                });

                var trainSchedule = stepEl.querySelector('.train-schedule');
                if (trainSchedule) {
                    var labels = trainSchedule.querySelector('.schedule-labels');
                    var track = trainSchedule.querySelector('.schedule-track');
                    
                    var oldTrains = track.querySelectorAll('.schedule-train');
                    var trainData = [];
                    oldTrains.forEach(function(t) {
                        var info = t.querySelector('.train-info');
                        var arriveTime = info.querySelector('.train-time').textContent;
                        var inTime = info.querySelector('.train-time-sub').textContent.replace('进站 ', '');
                        trainData.push({ arriveTime: arriveTime, inTime: inTime });
                    });

                    var interval = parseTime(trainData[1].arriveTime) - parseTime(trainData[0].arriveTime);
                    
                    var availableTrains = [];
                    for (var j = 0; j < trainData.length; j++) {
                        if (parseTime(trainData[j].inTime) >= prevArriveTime) {
                            availableTrains.push(trainData[j]);
                        }
                    }

                    while (availableTrains.length < 2) {
                        var lastTrain = availableTrains[availableTrains.length - 1] || trainData[trainData.length - 1];
                        var nextInTime = parseTime(lastTrain.inTime) + interval;
                        var nextArriveTime = parseTime(lastTrain.arriveTime) + interval;
                        availableTrains.push({
                            inTime: formatTime(nextInTime),
                            arriveTime: formatTime(nextArriveTime)
                        });
                    }

                    var newTrackHtml = '<div class="schedule-dot"></div><div class="schedule-line"></div><div class="schedule-dot"></div>';
                    availableTrains.forEach(function(t, idx) {
                        var pos = idx === 0 ? 'left: 15%;' : 'left: 65%;';
                        var isSelected = idx === 0;
                        newTrackHtml += '<div class="schedule-train" style="' + pos + '" onclick="selectTrain(' + idx + ', this)">';
                        newTrackHtml += '<div class="train-info' + (isSelected ? ' train-info-current' : '') + '">';
                        newTrackHtml += '<span class="train-time">' + t.arriveTime + '</span>';
                        newTrackHtml += '<span class="train-time-sub">进站 ' + t.inTime + '</span>';
                        newTrackHtml += '</div></div>';
                    });
                    track.innerHTML = newTrackHtml;

                    if (labels) {
                        labels.innerHTML = '<span>现在 →</span><span>推荐 ' + availableTrains[0].arriveTime + '</span><span>下一班 ' + availableTrains[1].arriveTime + '</span>';
                    }

                    if (availableTrains.length > 0) {
                        prevArriveTime = parseTime(availableTrains[0].arriveTime) + (durations[durationIdx] || 10);
                        durationIdx++;
                    }
                }

                var details = stepEl.querySelectorAll('.step-detail-item');
                details.forEach(function(detail) {
                    var label = detail.querySelector('.step-detail-label').textContent;
                    var valueEl = detail.querySelector('.step-detail-value');
                    var currentValue = valueEl.textContent;
                    
                    if (/^[0-9]{2}:[0-9]{2}$/.test(currentValue)) {
                        if (label.includes('到站') || label.includes('到达') || label.includes('预计')) {
                            valueEl.textContent = formatTime(prevArriveTime);
                        }
                    }
                });
            }
        }

        function swapStations() {
            var start = document.getElementById('startStation');
            var end = document.getElementById('endStation');
            var temp = start.value;
            start.value = end.value;
            end.value = temp;
        }

        document.getElementById('recommendBtn').onclick = generateRecommend;
        generateRecommend();
    </script>
</body>
</html>
