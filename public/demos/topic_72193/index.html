<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drinktopia 微醺城市</title>
    <style id="theme-vars">
/* Drinktopia 微醺城市 · Brand CSS */
/* Social exploration gaming platform - dark theme with dual-accent system */

:root {
  /* === Color System === */
  --bg-primary: #0f0f1a;
  --bg-elevated: #1a1a2e;
  --bg-surface: #252540;
  --bg-card: rgba(255, 255, 255, 0.05);
  --bg-card-hover: rgba(255, 255, 255, 0.09);
  --bg-input: rgba(255, 255, 255, 0.04);
  --text-primary: #e8e8f0;
  --text-secondary: rgba(232, 232, 240, 0.55);
  --text-tertiary: rgba(232, 232, 240, 0.30);

  /* Dual accent system */
  --accent: #6c5ce7;
  --accent-soft: rgba(108, 92, 231, 0.15);
  --accent-glow: rgba(108, 92, 231, 0.25);
  --accent-strong: #a29bfe;
  --accent2: #00cec9;
  --accent2-soft: rgba(0, 206, 201, 0.15);
  --accent2-glow: rgba(0, 206, 201, 0.25);
  --accent2-strong: #55efc4;

  /* Semantic */
  --success: #00b894;
  --warning: #fdcb6e;
  --danger: #e17055;
  --info: #74b9ff;

  /* === Typography === */
  --font-heading: 'PingFang SC', 'SF Pro Display', 'Inter', -apple-system, system-ui, sans-serif;
  --font-body: 'SF Pro Text', 'Inter', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;

  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-display: 34px;

  /* === Shape === */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 28px;
  --space-3xl: 40px;

  /* === Surface === */
  --border-subtle: rgba(255, 255, 255, 0.08);
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.15);
  --shadow-float: 0 12px 40px rgba(0, 0, 0, 0.45);
  --backdrop-blur: blur(16px);

  /* === Transition === */
  --transition-fast: 120ms ease;
  --transition-default: 200ms ease;
  --transition-smooth: 350ms cubic-bezier(0.4, 0, 0.2, 1);
}

    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* Splash page styles */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background-color: var(--bg-primary) !important;
        color: var(--text-primary);
        max-width: 390px; margin: 0 auto; min-height: 100vh; overflow-x: hidden;
        position: relative;
        font-family: var(--font-body);
      }

      .splash-bg {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: url('../assets/splash-hero.jpg') center/cover no-repeat;
        z-index: 0;
      }

      .splash-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(15, 15, 26, 0.75);
        z-index: 1;
      }

      .splash-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 0 var(--space-xl);
      }

      .brand-logo {
        font-family: var(--font-heading);
        font-size: var(--text-display);
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.5px;
        margin-bottom: var(--space-xs);
      }

      .brand-subtitle {
        font-family: var(--font-heading);
        font-size: var(--text-lg);
        color: var(--accent2);
        font-weight: 500;
        margin-bottom: var(--space-3xl);
      }

      .brand-tagline {
        font-size: var(--text-base);
        color: var(--text-secondary);
        text-align: center;
        line-height: 1.6;
        max-width: 260px;
        margin-bottom: var(--space-3xl);
      }

      .loading-dots {
        display: flex;
        gap: var(--space-sm);
        margin-bottom: var(--space-3xl);
      }

      .loading-dots span {
        width: 8px;
        height: 8px;
        border-radius: var(--radius-full);
        background: var(--accent);
        animation: pulse 1.4s ease-in-out infinite;
      }

      .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
      .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.1); }
      }

      .cta-btn {
        width: 100%;
        max-width: 320px;
        padding: var(--space-lg) var(--space-xl);
        background: var(--accent);
        color: #fff;
        font-size: var(--text-lg);
        font-weight: 600;
        font-family: var(--font-heading);
        border: none;
        border-radius: var(--radius-full);
        cursor: pointer;
        transition: background var(--transition-default);
      }

      .cta-btn:hover {
        background: var(--accent-strong);
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <div class="splash-bg"></div>
    <div class="splash-overlay"></div>
    <div class="splash-content">
      <div class="brand-logo">Drinktopia</div>
      <div class="brand-subtitle">微醺城市</div>
      <div class="brand-tagline">在不同状态下，找到更舒服的连接方式</div>
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <button class="cta-btn" data-dom-id="splash-start" onclick="window.location.href='states.html'">进入微醺城市</button>
    </div>
</body>
</html>
