<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockAnalyzer - AI股票分析系统 (演示版)</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #1a1d26; --bg3: #232630;
    --ink: #e8e8ec; --muted: #8b92a8; --rule: #2d313e;
    --accent: #10b981; --accent2: #3b82f6;
    --danger: #ef4444; --warning: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header { background: var(--bg2); border-bottom: 1px solid var(--rule); padding: 12px 0; position: sticky; top: 0; z-index: 100; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .index-bar { display: flex; gap: 16px; font-size: 0.85rem; }
  .index-item { display: flex; align-items: center; gap: 4px; }
  .index-name { color: var(--muted); }
  .index-value { font-weight: 600; font-family: monospace; }
  .up { color: var(--accent); }
  .down { color: var(--danger); }
  .tab-bar { display: flex; gap: 4px; background: var(--bg2); border-bottom: 1px solid var(--rule); padding: 0 16px; overflow-x: auto; }
  .tab-btn { padding: 12px 20px; background: none; border: none; color: var(--muted); font-size: 0.9rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; padding: 20px 0; }
  .tab-content.active { display: block; }
  .card { background: var(--bg2); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .summary-card { background: var(--bg2); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; text-align: center; }
  .summary-card .value { font-size: 1.5rem; font-weight: 700; font-family: monospace; }
  .summary-card .label { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.02em; }
  tr:hover td { background: rgba(16,185,129,0.04); }
  td { color: var(--ink); }
  td.mono { font-family: monospace; }
  .btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--rule); background: var(--bg3); color: var(--ink); cursor: pointer; transition: all 0.2s; }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
  .signal-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; }
  .signal-buy { background: rgba(16,185,129,0.15); color: var(--accent); }
  .signal-sell { background: rgba(239,68,68,0.15); color: var(--danger); }
  .signal-hold { background: rgba(245,158,11,0.15); color: var(--warning); }
  .score-ring { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; font-family: monospace; border: 4px solid var(--rule); flex-shrink: 0; }
  .score-ring.high { border-color: var(--accent); color: var(--accent); }
  .score-ring.mid { border-color: var(--warning); color: var(--warning); }
  .score-ring.low { border-color: var(--danger); color: var(--danger); }
  .reason-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .reason-tag { padding: 3px 8px; background: var(--bg3); border-radius: 4px; font-size: 0.75rem; color: var(--muted); }
  .chart-box { width: 100%; height: 400px; background: var(--bg2); border-radius: 10px; border: 1px solid var(--rule); }
  .env-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; }
  .env-bull { background: rgba(16,185,129,0.12); color: var(--accent); border: 1px solid rgba(16,185,129,0.3); }
  .env-neutral { background: rgba(245,158,11,0.12); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
  .env-bear { background: rgba(239,68,68,0.12); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
  .resonance-bar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .resonance-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 80px; padding: 10px 12px; border-radius: 8px; background: var(--bg3); border: 1px solid var(--rule); }
  .resonance-item.pos { border-color: rgba(16,185,129,0.4); }
  .resonance-item.neg { border-color: rgba(239,68,68,0.4); }
  .resonance-item.neu { border-color: var(--rule); }
  .resonance-score { font-size: 1.3rem; font-weight: 700; font-family: monospace; }
  .resonance-score.pos { color: var(--accent); }
  .resonance-score.neg { color: var(--danger); }
  .resonance-score.neu { color: var(--muted); }
  .resonance-name { font-size: 0.75rem; color: var(--muted); }
  .resonance-desc { font-size: 0.7rem; color: var(--muted); max-width: 120px; text-align: center; line-height: 1.3; }
  .dimension-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
  .dim-card { background: var(--bg3); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; }
  .dim-card .dim-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .dim-card .dim-name { font-size: 0.9rem; font-weight: 700; }
  .dim-card .dim-weight { font-size: 0.75rem; color: var(--muted); }
  .dim-bar { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .dim-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .dim-score { font-size: 1.2rem; font-weight: 700; font-family: monospace; }
  .dim-subs { font-size: 0.75rem; color: var(--muted); }
  .risk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
  .risk-item { background: var(--bg3); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; text-align: center; }
  .risk-item .rv { font-size: 1.3rem; font-weight: 700; font-family: monospace; }
  .risk-item .rl { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .suggestion-box { background: var(--bg3); border-left: 4px solid var(--accent2); border-radius: 0 8px 8px 0; padding: 14px 16px; margin: 12px 0; }
  .suggestion-box ul { list-style: none; padding: 0; }
  .suggestion-box li { padding: 4px 0; font-size: 0.9rem; color: var(--ink); }
  .suggestion-box li::before { content: "\203A"; color: var(--accent2); font-weight: 700; margin-right: 8px; }
  .demo-banner { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.85rem; color: var(--accent2); display: flex; align-items: center; gap: 8px; }
  .stock-select { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .stock-chip { padding: 6px 14px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--rule); cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .stock-chip:hover { border-color: var(--accent); }
  .stock-chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  @media (max-width: 768px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    .dimension-grid { grid-template-columns: 1fr 1fr; }
    .header-row { flex-direction: column; align-items: flex-start; }
    .risk-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<header>
  <div class="container">
    <div class="header-row">
      <div class="logo">Stock<span>Analyzer</span></div>
      <div class="index-bar" id="indexBar"></div>
    </div>
  </div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="watchlist" onclick="switchTab('watchlist')">自选</button>
  <button class="tab-btn" data-tab="holdings" onclick="switchTab('holdings')">持仓</button>
  <button class="tab-btn" data-tab="analysis" onclick="switchTab('analysis')">分析</button>
</div>

<div class="container">
  <!-- 演示提示 -->
  <div class="demo-banner">
    <span>DEMO</span>
    <span>本页面使用模拟数据演示完整功能。实际应用通过Python Flask后端 + 东方财富/新浪财经API提供实时数据。</span>
  </div>

  <!-- 自选 -->
  <div class="tab-content active" id="tab-watchlist">
    <div class="card">
      <div class="table-wrap">
        <table id="watchlistTable">
          <thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌</th><th>涨跌幅</th><th>成交量</th><th>PE(TTM)</th><th>操作</th></tr></thead>
          <tbody id="watchlistBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 持仓 -->
  <div class="tab-content" id="tab-holdings">
    <div class="summary-grid" id="holdingSummary">
      <div class="summary-card"><div class="value" id="sumCost">--</div><div class="label">总成本</div></div>
      <div class="summary-card"><div class="value" id="sumMarket">--</div><div class="label">总市值</div></div>
      <div class="summary-card"><div class="value" id="sumProfit">--</div><div class="label">总盈亏</div></div>
      <div class="summary-card"><div class="value" id="sumProfitPct">--</div><div class="label">盈亏率</div></div>
    </div>
    <div class="card">
      <div class="card-title"><span>当前持仓</span></div>
      <div class="table-wrap">
        <table id="holdingsTable">
          <thead><tr><th>代码</th><th>名称</th><th>持仓量</th><th>成本价</th><th>现价</th><th>市值</th><th>盈亏</th><th>盈亏率</th></tr></thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 分析 -->
  <div class="tab-content" id="tab-analysis">
    <div class="card">
      <div class="card-title"><span>选择股票进行分析</span></div>
      <div class="stock-select" id="stockSelect"></div>
    </div>

    <div id="analysisResult" style="display:none;">
      <div class="card" id="envCard">
        <div class="card-title"><span>市场环境</span><span id="envBadge" class="env-badge">--</span></div>
        <div id="envDetails" style="font-size:0.85rem;color:var(--muted);"></div>
      </div>

      <div class="card">
        <div class="card-title"><span id="chartTitle">K线图</span></div>
        <div class="chart-box" id="klineChart"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>短线分析 - 多指标共振系统 (7指标)</span>
          <span class="signal-badge" id="shortSignal">--</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px;">
          <div class="score-ring" id="shortScore">--</div>
          <div style="flex:1;">
            <div style="font-size:0.85rem;color:var(--muted);">共振分: <strong id="shortResonance" style="color:var(--ink);">0</strong> （<span id="shortResSummary">--</span>）</div>
            <div style="font-size:0.85rem;color:var(--muted);margin-top:2px;">ADX趋势: <span id="shortAdx">--</span> | ATR波幅: <span id="shortAtr">--</span></div>
            <div style="font-size:0.85rem;margin-top:2px;" id="shortSector"></div>
          </div>
        </div>
        <div class="resonance-bar" id="shortResonanceBar"></div>
        <div id="shortReasons" class="reason-tags"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>中线分析 - 多因子加权评分</span>
          <span class="signal-badge" id="midSignal">--</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;">
          <div class="score-ring" id="midScore">--</div>
          <div style="flex:1;">
            <div id="midReasons" class="reason-tags"></div>
          </div>
        </div>
        <div class="dimension-grid" id="midDimensions"></div>
      </div>

      <div class="card">
        <div class="card-title"><span>风险管理 & 操作建议</span></div>
        <div class="risk-grid" id="riskGrid"></div>
        <div class="suggestion-box" id="suggestionBox">
          <ul id="suggestionList"></ul>
        </div>
      </div>
    </div>
  </div>
</div>

// ==================== K线数据生成 ====================

function generateKlineData(currentPrice, trend) {
  const days = 80;
  const data = [];
  let price = trend === 'up' ? currentPrice * 0.85 : currentPrice * 1.15;
  const startDate = new Date();
  startDate.setDate(startDate.getDate() - days);

  for (let i = 0; i < days; i++) {
    const date = new Date(startDate);
    date.setDate(date.getDate() + i);
    // Skip weekends
    if (date.getDay() === 0 || date.getDay() === 6) continue;

    const dateStr = date.toISOString().slice(0, 10);
    const volatility = 0.02;
    const trendFactor = trend === 'up' ? 0.003 : -0.003;
    const change = (Math.random() - 0.5) * 2 * volatility + trendFactor;
    const open = price;
    price = price * (1 + change);
    const high = Math.max(open, price) * (1 + Math.random() * 0.01);
    const low = Math.min(open, price) * (1 - Math.random() * 0.01);
    const volume = Math.floor(50000 + Math.random() * 200000);

    data.push({
      date: dateStr,
      open: open.toFixed(2),
      close: price.toFixed(2),
      high: high.toFixed(2),
      low: low.toFixed(2),
      volume: volume,
    });
  }
  // Ensure last close matches currentPrice
  if (data.length > 0) {
    data[data.length - 1].close = currentPrice.toFixed(2);
  }
  return data;
}

function renderHoldings() {
  const body = document.getElementById('holdingsBody');
  let totalCost = 0, totalMarket = 0;
  body.innerHTML = MOCK_HOLDINGS.map(h => {
    const marketVal = h.price * h.qty;
    const cost = h.avgCost * h.qty;
    const profit = marketVal - cost;
    const profitPct = (h.price - h.avgCost) / h.avgCost * 100;
    const cls = profit >= 0 ? 'up' : 'down';
    totalCost += cost;
    totalMarket += marketVal;
    return `<tr>
      <td class="mono">${h.code}</td>
      <td>${h.name}</td>
      <td class="mono">${h.qty}</td>
      <td class="mono">${h.avgCost.toFixed(2)}</td>
      <td class="mono">${h.price.toFixed(2)}</td>
      <td class="mono">${marketVal.toFixed(2)}</td>
      <td class="mono ${cls}">${profit >= 0 ? '+' : ''}${profit.toFixed(2)}</td>
      <td class="mono ${cls}">${profitPct >= 0 ? '+' : ''}${profitPct.toFixed(2)}%</td>
    </tr>`;
  }).join('');

  const totalProfit = totalMarket - totalCost;
  const totalPct = totalCost > 0 ? totalProfit / totalCost * 100 : 0;
  const pCls = totalProfit >= 0 ? 'up' : 'down';
  document.getElementById('sumCost').textContent = totalCost.toFixed(2);
  document.getElementById('sumMarket').textContent = totalMarket.toFixed(2);
  document.getElementById('sumProfit').textContent = (totalProfit >= 0 ? '+' : '') + totalProfit.toFixed(2);
  document.getElementById('sumProfit').className = 'value ' + pCls;
  document.getElementById('sumProfitPct').textContent = (totalPct >= 0 ? '+' : '') + totalPct.toFixed(2) + '%';
  document.getElementById('sumProfitPct').className = 'value ' + pCls;
}

function renderKline(klineData, name) {
  const chart = echarts.init(document.getElementById('klineChart'));
  const dates = klineData.map(k => k.date);
  const ohlc = klineData.map(k => [parseFloat(k.open), parseFloat(k.close), parseFloat(k.low), parseFloat(k.high)]);
  const volumes = klineData.map(k => k.volume);

  // Calculate MA lines
  function calcMA(data, period) {
    const result = [];
    for (let i = 0; i < data.length; i++) {
      if (i < period - 1) { result.push(null); continue; }
      let sum = 0;
      for (let j = 0; j < period; j++) sum += data[i - j].close;
      result.push((sum / period).toFixed(2));
    }
    return result;
  }
  const closes = klineData.map(k => parseFloat(k.close));
  const ma5 = calcMA(klineData, 5);
  const ma10 = calcMA(klineData, 10);
  const ma20 = calcMA(klineData, 20);

  chart.setOption({
    backgroundColor: 'transparent',
    animation: false,
    legend: { data: ['K线', 'MA5', 'MA10', 'MA20'], textStyle: { color: '#8b92a8' }, top: 5 },
    grid: [
      { left: '8%', right: '3%', top: '12%', height: '55%' },
      { left: '8%', right: '3%', top: '72%', height: '18%' },
    ],
    xAxis: [
      { type: 'category', data: dates, gridIndex: 0, axisLine: { lineStyle: { color: '#2d313e' } }, axisLabel: { color: '#8b92a8', fontSize: 10 } },
      { type: 'category', data: dates, gridIndex: 1, axisLine: { lineStyle: { color: '#2d313e' } }, axisLabel: { color: '#8b92a8', fontSize: 10 } },
    ],
    yAxis: [
      { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: '#2d313e' } }, axisLabel: { color: '#8b92a8' } },
      { gridIndex: 1, splitLine: { lineStyle: { color: '#2d313e' } }, axisLabel: { color: '#8b92a8' } },
    ],
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1], start: 50, end: 100 },
      { show: true, xAxisIndex: [0, 1], top: '93%', start: 50, end: 100, height: 20 },
    ],
    series: [
      {
        name: 'K线', type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0,
        itemStyle: {
          color: '#10b981', color0: '#ef4444',
          borderColor: '#10b981', borderColor0: '#ef4444',
        },
      },
      { name: 'MA5', type: 'line', data: ma5, xAxisIndex: 0, yAxisIndex: 0, smooth: true, showSymbol: false, lineStyle: { width: 1, color: '#f59e0b' } },
      { name: 'MA10', type: 'line', data: ma10, xAxisIndex: 0, yAxisIndex: 0, smooth: true, showSymbol: false, lineStyle: { width: 1, color: '#3b82f6' } },
      { name: 'MA20', type: 'line', data: ma20, xAxisIndex: 0, yAxisIndex: 0, smooth: true, showSymbol: false, lineStyle: { width: 1, color: '#a855f7' } },
      {
        name: '成交量', type: 'bar', data: volumes, xAxisIndex: 1, yAxisIndex: 1,
        itemStyle: {
          color: function(params) {
            return klineData[params.dataIndex] && parseFloat(klineData[params.dataIndex].close) >= parseFloat(klineData[params.dataIndex].open) ? '#10b981' : '#ef4444';
          },
        },
      },
    ],
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'cross' },
      backgroundColor: '#1a1d26', borderColor: '#2d313e', textStyle: { color: '#e8e8ec' },
    },
  });
  window.addEventListener('resize', () => chart.resize());
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}
