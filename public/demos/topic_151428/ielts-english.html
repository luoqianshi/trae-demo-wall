<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>流利说 · 口语训练</title>
<style>
:root{
  --bg:#0A0E1A;
  --bg-soft:#0F1428;
  --text:#F8FAFC;
  --text-2:rgba(255,255,255,0.62);
  --text-3:rgba(255,255,255,0.4);
  --line:rgba(255,255,255,0.08);
  --line-2:rgba(255,255,255,0.12);
  --purple:#8B5CF6;
  --purple-2:#A78BFA;
  --cyan:#06B6D4;
  --cyan-2:#67E8F9;
  --pink:#EC4899;
  --orange:#F59E0B;
  --green:#10B981;
  --red:#EF4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
#app{height:100%;width:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.page{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.page-scroll{flex:1;overflow-y:auto;padding-bottom:96px}
.page-scroll::-webkit-scrollbar{display:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;caret-color:var(--purple-2)}
input:focus,textarea:focus{outline:none}

/* ===== 通用工具类 ===== */
.flex{display:flex}.flex-c{display:flex;align-items:center}.flex-b{display:flex;justify-content:space-between;align-items:center}
.gradient-text{background:linear-gradient(135deg,#A78BFA 0%,#67E8F9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.btn{transition:all .2s cubic-bezier(.4,0,.2,1);cursor:pointer}
.btn:active{transform:scale(0.96)}

/* ===== 启动动画页（点击进入） ===== */
.boot-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;overflow:hidden}
.boot-bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(139,92,246,0.4),transparent 50%),radial-gradient(circle at 70% 70%,rgba(6,182,212,0.3),transparent 50%),radial-gradient(circle at 50% 50%,rgba(236,72,153,0.2),transparent 60%);animation:bgPulse 4s ease-in-out infinite}
@keyframes bgPulse{0%,100%{opacity:0.8;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.boot-particles{position:absolute;inset:0;pointer-events:none}
.boot-particle{position:absolute;width:3px;height:3px;background:rgba(255,255,255,0.6);border-radius:50%;box-shadow:0 0 8px rgba(255,255,255,0.4)}
.boot-logo-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:32px}
.boot-logo-ring{position:absolute;inset:0;border-radius:30px;border:2px solid rgba(255,255,255,0.1);animation:ringExpand 3s ease-out infinite}
.boot-logo-ring:nth-child(2){animation-delay:1s}
.boot-logo-ring:nth-child(3){animation-delay:2s}
@keyframes ringExpand{0%{transform:scale(0.8);opacity:1}100%{transform:scale(1.6);opacity:0}}
.boot-logo{width:120px;height:120px;border-radius:30px;background:linear-gradient(135deg,#8B5CF6,#06B6D4);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(139,92,246,0.5),inset 0 2px 0 rgba(255,255,255,0.3);position:relative;overflow:hidden;animation:logoFloat 3s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.boot-logo::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shine 3s infinite}
@keyframes shine{0%{left:-100%}100%{left:200%}}
.boot-logo svg{width:60px;height:60px;position:relative;z-index:1}
.boot-title{font-size:32px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#FFFFFF 0%,#A78BFA 50%,#67E8F9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.boot-subtitle{font-size:13px;color:rgba(255,255,255,0.5);letter-spacing:4px;font-weight:500;text-transform:uppercase;margin-bottom:48px}
.boot-enter{margin-top:32px;padding:16px 40px;border-radius:30px;background:linear-gradient(135deg,#8B5CF6,#06B6D4);color:#fff;font-size:15px;font-weight:600;box-shadow:0 8px 32px rgba(139,92,246,0.4),inset 0 1px 0 rgba(255,255,255,0.2);animation:enterPulse 2s ease-in-out infinite;position:relative;overflow:hidden}
@keyframes enterPulse{0%,100%{transform:scale(1);box-shadow:0 8px 32px rgba(139,92,246,0.4),inset 0 1px 0 rgba(255,255,255,0.2)}50%{transform:scale(1.05);box-shadow:0 12px 40px rgba(139,92,246,0.6),inset 0 1px 0 rgba(255,255,255,0.3)}}
.boot-tip{position:absolute;bottom:60px;font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:1px}
.boot-version{position:absolute;bottom:24px;font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:0.5px}

/* ===== 卡片通用样式 ===== */
.card{background:linear-gradient(145deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.05);transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.card-hover{cursor:pointer}
.card-hover:active{transform:scale(0.98)}
.card-hover:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.3),0 0 0 1px rgba(139,92,246,0.15),inset 0 1px 0 rgba(255,255,255,0.08)}
.card-top-line{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent)}
.fade-in{animation:fadeIn .5s cubic-bezier(.4,0,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .4s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== 标签 / 徽章 ===== */
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:500;letter-spacing:0.3px}
.tag-pill{padding:4px 10px;border-radius:8px;font-size:10px;font-weight:500;background:rgba(255,255,255,0.06);color:var(--text-2);border:1px solid var(--line)}
.tag-purple{background:rgba(139,92,246,0.12);color:var(--purple-2);border:1px solid rgba(139,92,246,0.25)}
.tag-cyan{background:rgba(6,182,212,0.12);color:var(--cyan-2);border:1px solid rgba(6,182,212,0.25)}
.tag-green{background:rgba(16,185,129,0.12);color:#6EE7B7;border:1px solid rgba(16,185,129,0.25)}
.tag-orange{background:rgba(245,158,11,0.12);color:#FCD34D;border:1px solid rgba(245,158,11,0.25)}
.tag-pink{background:rgba(236,72,153,0.12);color:#F9A8D4;border:1px solid rgba(236,72,153,0.25)}
.tag-red{background:rgba(239,68,68,0.12);color:#FCA5A5;border:1px solid rgba(239,68,68,0.25)}

/* ===== 按钮 ===== */
.btn-primary{background:linear-gradient(135deg,#8B5CF6,#06B6D4);color:#fff;font-weight:600;box-shadow:0 4px 20px rgba(139,92,246,0.35),inset 0 1px 0 rgba(255,255,255,0.2)}
.btn-primary:active{transform:scale(0.96)}
.btn-ghost{background:rgba(255,255,255,0.04);color:var(--text);border:1px solid var(--line-2);font-weight:500;backdrop-filter:blur(10px)}
.btn-ghost:active{background:rgba(255,255,255,0.08);transform:scale(0.96)}
.btn-disabled{background:rgba(255,255,255,0.04);color:var(--text-3);cursor:not-allowed;box-shadow:none}

/* ===== 进度条 ===== */
.progress{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,0.3)}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#8B5CF6,#06B6D4);transition:width .8s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(139,92,246,0.4)}

/* ===== 输入框 ===== */
.input{width:100%;background:rgba(255,255,255,0.05);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;color:var(--text);font-size:15px;transition:all .25s}
.input:focus{border-color:rgba(139,92,246,0.5);background:rgba(255,255,255,0.07);box-shadow:0 0 0 3px rgba(139,92,246,0.1)}
.input::placeholder{color:var(--text-3)}

/* ===== 芯片按钮 ===== */
.chip{padding:8px 16px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:rgba(255,255,255,0.04);color:var(--text-2);font-weight:500;transition:all .2s;white-space:nowrap}
.chip.active{background:linear-gradient(135deg,rgba(139,92,246,0.25),rgba(6,182,212,0.15));color:#E0E7FF;border-color:rgba(139,92,246,0.4);box-shadow:0 0 16px rgba(139,92,246,0.15)}
.chip:active{transform:scale(0.96)}

/* ===== 底部导航 ===== */
.nav{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(15,20,40,0.78);backdrop-filter:blur(40px) saturate(1.5);-webkit-backdrop-filter:blur(40px) saturate(1.5);border:1px solid var(--line-2);border-radius:24px;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.04),inset 0 1px 0 rgba(255,255,255,0.06);padding:6px 8px}
.nav-inner{display:flex;justify-content:space-around}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;transition:all .25s;color:var(--text-3)}
.nav-item.active{background:linear-gradient(135deg,rgba(139,92,246,0.2),rgba(6,182,212,0.15));color:var(--purple-2);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08)}
.nav-item svg{width:22px;height:22px;filter:drop-shadow(0 0 4px currentColor)}
.nav-item span{font-size:10px;font-weight:500}

/* ===== 模式切换器 ===== */
.mode-switch{background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:14px;padding:4px;display:flex;gap:4px;backdrop-filter:blur(20px)}
.mode-switch button{flex:1;padding:10px 8px;border-radius:10px;font-size:12px;font-weight:500;transition:all .25s;color:var(--text-3)}
.mode-switch button.active{background:linear-gradient(135deg,rgba(139,92,246,0.3),rgba(6,182,212,0.2));color:#E0E7FF;box-shadow:0 2px 8px rgba(139,92,246,0.15)}

/* ===== 麦克风按钮 ===== */
.mic-btn{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(139,92,246,0.25),rgba(6,182,212,0.15));color:var(--purple-2);transition:all .3s;box-shadow:0 8px 24px rgba(139,92,246,0.2),inset 0 1px 0 rgba(255,255,255,0.1);border:1.5px solid rgba(139,92,246,0.25);margin:0 auto}
.mic-btn:hover{transform:scale(1.05)}
.mic-btn.recording{background:linear-gradient(135deg,rgba(239,68,68,0.3),rgba(245,158,11,0.2));color:#FECACA;border-color:rgba(239,68,68,0.4);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.5),0 8px 24px rgba(239,68,68,0.2)}50%{box-shadow:0 0 0 20px rgba(239,68,68,0),0 8px 24px rgba(239,68,68,0.2)}}

/* ===== 动画 ===== */
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.shimmer{position:relative;overflow:hidden}
.shimmer::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);animation:shimmer 3s infinite}
@keyframes shimmer{0%{left:-100%}100%{left:200%}}
.dot-flash{display:inline-block;width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#A78BFA,#67E8F9);margin:0 2px;animation:dotBlink 1.4s infinite both}
.dot-flash:nth-child(2){animation-delay:.2s}
.dot-flash:nth-child(3){animation-delay:.4s}
@keyframes dotBlink{0%,80%,100%{opacity:.3;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}

/* ===== Anki 卡片 ===== */
.anki-card{width:100%;max-width:340px;min-height:380px;position:relative;perspective:1200px;cursor:pointer;margin:0 auto}
.anki-inner{position:relative;width:100%;min-height:380px;transition:transform .7s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.anki-card.flipped .anki-inner{transform:rotateY(180deg)}
.anki-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,0.1),rgba(255,255,255,0.04));border:1px solid var(--line-2);backdrop-filter:blur(30px);padding:32px 28px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1);min-height:380px}
.anki-back{transform:rotateY(180deg)}
.anki-card::before{content:'';position:absolute;inset:0;border-radius:28px;background:linear-gradient(135deg,rgba(139,92,246,0.1),transparent 40%,rgba(6,182,212,0.1));pointer-events:none;z-index:0}
.anki-content{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

/* ===== 评分按钮组 ===== */
.rate-group{display:flex;gap:8px;margin-top:16px}
.rate-btn{flex:1;padding:14px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;transition:all .2s}
.rate-btn-again{background:rgba(239,68,68,0.12);color:#FCA5A5;border:1px solid rgba(239,68,68,0.25)}
.rate-btn-hard{background:rgba(245,158,11,0.12);color:#FCD34D;border:1px solid rgba(245,158,11,0.25)}
.rate-btn-good{background:rgba(16,185,129,0.12);color:#6EE7B7;border:1px solid rgba(16,185,129,0.25)}
.rate-btn-easy{background:rgba(6,182,212,0.12);color:#67E8F9;border:1px solid rgba(6,182,212,0.25)}
.rate-btn:active{transform:scale(0.94)}

/* ===== 状态点 ===== */
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
</style>
</head>

/* =================================================================
   Anki 间隔重复算法（简化版 SM-2）
   ================================================================= */
function calcNextReview(card, quality) {
  // quality: 0=again, 1=hard, 2=good, 3=easy
  let { ease = 2.5, interval = 0, reps = 0 } = card;
  if (quality === 0) {
    reps = 0; interval = 0; ease = Math.max(1.3, ease - 0.2);
  } else {
    reps += 1;
    if (reps === 1) interval = 1;
    else if (reps === 2) interval = 3;
    else interval = Math.round(interval * ease);
    if (quality === 1) interval = Math.max(1, Math.round(interval * 0.8));
    if (quality === 3) interval = Math.round(interval * 1.3);
    if (quality === 1) ease = Math.max(1.3, ease - 0.15);
    if (quality === 3) ease = ease + 0.15;
  }
  return { ease, interval, reps, nextReview: Date.now() + interval * 86400000 };
}

/* =================================================================
   应用状态
   ================================================================= */
const STORAGE_KEY = 'fluency_speak_v3';
let STATE = {
  user: null,
  booted: false,
  seenIntro: false,
  words: [],
  records: [],
  ankiCards: [],
  ankiQueue: [],
  ankiIndex: 0,
  ankiSessionStats: {again:0,hard:0,good:0,easy:0},
  topicProgress: [],
  customTopics: [],
  streak: 0,
  lastStudy: ''
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      Object.assign(STATE, parsed);
    }
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch(e) {}
}

function uid(){return Math.random().toString(36).slice(2,11)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayStr(){return new Date().toISOString().split('T')[0]}
function getGreeting(){
  const h = new Date().getHours();
  if (h < 6) return '夜深了'; if (h < 11) return '早上好'; if (h < 14) return '中午好';
  if (h < 18) return '下午好'; return '晚上好';
}
function getTodayRecords(){
  const t = todayStr();
  return STATE.records.filter(r => r.createdAt.startsWith(t));
}
function updateStreak(){
  const t = todayStr();
  if (STATE.lastStudy === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.toISOString().split('T')[0];
  STATE.streak = STATE.lastStudy === yStr ? STATE.streak + 1 : 1;
  STATE.lastStudy = t;
  saveState();
}
function getProgress(topicId){
  const p = STATE.topicProgress.find(x => x.topicId === topicId);
  return p ? p.count : 0;
}
function updateProgress(topicId, delta = 1){
  const p = STATE.topicProgress.find(x => x.topicId === topicId);
  if (p) p.count += delta;
  else STATE.topicProgress.push({topicId, count: delta});
  saveState();
}
function addWords(words){
  words.forEach(w => {
    const k = w.word.toLowerCase();
    const ex = STATE.words.find(x => x.word.toLowerCase() === k);
    if (ex) { ex.freq += w.freq; ex.lastSeen = new Date().toISOString(); }
    else STATE.words.push({...w, added: new Date().toISOString(), lastSeen: new Date().toISOString()});
  });
  saveState();
  syncAnkiCards();
}
function addRecord(rec){ STATE.records.unshift({id:uid(), ...rec, createdAt: new Date().toISOString()}); saveState(); }

/* 同步到 Anki 卡片库（每出现一次词汇就成为一张待复习卡片） */
function syncAnkiCards(){
  STATE.words.forEach(w => {
    const k = w.word.toLowerCase();
    const ex = STATE.ankiCards.find(c => c.word.toLowerCase() === k);
    if (!ex) {
      STATE.ankiCards.push({
        id: uid(),
        word: w.word,
        phonetic: w.phonetic || '',
        meaning: w.meaning || '',
        example: w.example || '',
        topic: w.topic,
        freq: w.freq,
        ease: 2.5, interval: 0, reps: 0,
        nextReview: Date.now(),
        added: new Date().toISOString()
      });
    } else {
      ex.freq = w.freq; ex.meaning = w.meaning || ex.meaning; ex.example = w.example || ex.example;
    }
  });
  saveState();
}

/* 获取当前需要复习的 Anki 卡片队列 */
function getAnkiQueue(){
  const now = Date.now();
  return STATE.ankiCards
    .map((c,i) => ({c,i}))
    .filter(({c}) => c.nextReview <= now)
    .sort((a,b) => a.c.nextReview - b.c.nextReview);
}

/* 语音合成 */
function speak(text, lang){
  if (!window.speechSynthesis) return;
  lang = lang || 'en-US';
  try { window.speechSynthesis.cancel(); } catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.92; u.pitch = 1;
  window.speechSynthesis.speak(u);
}

    <p style="color:rgba(255,255,255,0.3);font-size:12px;margin-top:16px;text-align:center">已为你推荐"流利表达"</p>`;
  } else {
    content = `<div style="margin-top:32px;display:flex;flex-direction:column;gap:10px">
      ${tags.map(t => {
        const sel = REG.interests.includes(t);
        return `<button data-tag="${t}" class="btn opt-btn" style="padding:18px 20px;border-radius:16px;border:1.5px solid ${sel?'rgba(139,92,246,0.5)':'rgba(255,255,255,0.06)'};background:${sel?'linear-gradient(135deg,rgba(139,92,246,0.2),rgba(6,182,212,0.1))':'rgba(255,255,255,0.03)'};color:${sel?'#C4B5FD':'rgba(255,255,255,0.7)'};font-size:14px;font-weight:600;text-align:left;display:flex;align-items:center;justify-content:space-between">

  }
  let canNext = false;
  if (REG_STEP === 0) canNext = REG.nickname.trim().length > 0;

  else canNext = REG.interests.length > 0;

      </div>
      <div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#8B5CF6,#06B6D4);display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:20px;box-shadow:0 8px 24px rgba(139,92,246,0.3),inset 0 1px 0 rgba(255,255,255,0.2)">${cur.icon}</div>

let PRACTICE_CAT = '全部';
function renderPractice(){
  const cats = ['全部','日常','进阶','扩展','自定义'];
  let allTopics = [...TOPICS];
  STATE.customTopics.forEach(t => allTopics.push({...t, custom: true, emoji: '⭐'}));

  let filtered;
  if (PRACTICE_CAT === '全部') filtered = allTopics;
  else if (PRACTICE_CAT === '日常') filtered = allTopics.filter(t => t.cat === '基础');
  else if (PRACTICE_CAT === '进阶') filtered = allTopics.filter(t => t.cat === '进阶');
  else if (PRACTICE_CAT === '扩展') filtered = allTopics.filter(t => t.cat === '扩展');
  else filtered = allTopics.filter(t => t.custom);

  return `<div class="page">
    <div class="page-scroll">
      <div style="padding:56px 24px 16px">
        <h1 style="color:#fff;font-size:28px;font-weight:800;letter-spacing:-0.5px">口语题库</h1>

      </div>

      <div style="padding:0 24px 8px;display:flex;gap:8px;overflow-x:auto;padding-bottom:8px">
        ${cats.map(c => `<button data-cat="${c}" class="chip ${PRACTICE_CAT===c?'active':''}">${c}</button>`).join('')}
      </div>

      <div style="padding:8px 24px 24px;display:flex;flex-direction:column;gap:12px">
        ${filtered.length === 0 ? `<div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.3);font-size:13px">该分类下暂无话题</div>` : filtered.map(t => {
          const p = getProgress(t.id);
          const count = t.custom ? t.questions.length : (QUESTIONS[t.id]?.length || 0);
          const isCore = t.core;
          return `<div class="card card-hover" data-practice="${t.id}" style="position:relative;overflow:hidden;${t.cat==='扩展'&&!t.custom?'opacity:0.5':''}">
            <div style="position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,${t.color}40,transparent 70%);filter:blur(20px)"></div>

            <div style="position:relative;z-index:1;display:flex;align-items:center;gap:14px">
              <div style="width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,${t.color},${t.color}AA);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 6px 20px ${t.color}40,inset 0 1px 0 rgba(255,255,255,0.2)">${t.emoji || (t.cat==='基础'?'🌱':t.cat==='进阶'?'🚀':'✨')}</div>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap">
                  <h3 style="color:#fff;font-size:15px;font-weight:700">${escapeHtml(t.name)}</h3>
                  ${isCore ? '<span class="tag tag-orange" style="font-size:9px;padding:2px 6px">推荐</span>' : ''}
                  ${t.custom ? '<span class="tag tag-purple" style="font-size:9px;padding:2px 6px">自定义</span>' : ''}
                  ${(t.tags || []).map(tag => `<span class="tag tag-purple" style="font-size:9px;padding:2px 6px">${tag}</span>`).join('')}
                </div>
                <p style="color:rgba(255,255,255,0.5);font-size:12px;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(t.desc || '')}</p>

              <div style="color:rgba(255,255,255,0.3);font-size:24px">›</div>

    </div>
  </div>`;

   练习会话（口语核心页）
   ================================================================= */
let SESSION = {qIndex:0, mode:'zh-voice', input:'', result:null, recording:false, processing:false, scores:[]};
let RECOGNITION = null;

function getCustomQuestions(id){
  const t = STATE.customTopics.find(x => x.id === id);
  return t ? t.questions : null;
}

function renderPracticeSession(){
  const topicId = PARAMS.topicId;
  const topic = TOPICS.find(t => t.id === topicId) || STATE.customTopics.find(t => t.id === topicId);
  if (!topic) return renderPractice();
  const customQ = getCustomQuestions(topicId);
  const questions = customQ || QUESTIONS[topicId] || [];
  if (questions.length === 0) return renderPractice();
  const q = questions[SESSION.qIndex];
  const modes = [
    {k:'zh-voice',l:'中文语音',i:'🎙️'},
    {k:'zh-text',l:'中文打字',i:'⌨️'},
    {k:'en-voice',l:'英文语音',i:'🗣️'},
    {k:'en-text',l:'英文打字',i:'✍️'}
  ];
  const progress = ((SESSION.qIndex) / questions.length) * 100;

  return `<div class="page">
    <div class="page-scroll">
      <div style="position:relative;padding:52px 20px 16px;overflow:hidden">
        <div style="position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,${topic.color}30,transparent 70%);filter:blur(20px)"></div>
        <div style="position:relative;z-index:1;display:flex;align-items:center;gap:12px">
          <button data-nav="practice" class="btn" style="width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid var(--line);font-size:18px;color:rgba(255,255,255,0.7)">‹</button>
          <div style="flex:1;min-width:0">
            <h1 style="color:#fff;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(topic.name)}</h1>
            <p style="color:rgba(255,255,255,0.5);font-size:11px">第 ${SESSION.qIndex+1} / ${questions.length} 题</p>
          </div>
          <div class="tag tag-purple" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);border:1px solid var(--line)">${q.d === 'easy' ? '简单' : q.d === 'medium' ? '中等' : '困难'}</div>
        </div>
        <div class="progress" style="margin-top:14px;position:relative;z-index:1"><div class="progress-fill" style="width:${progress}%"></div></div>
      </div>

      <div style="padding:0 20px">
        <div class="card" style="position:relative;overflow:hidden">
          <div class="card-top-line"></div>
          <div style="display:flex;align-items:start;gap:12px">
            <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,${topic.color},${topic.color}AA);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;box-shadow:0 4px 12px ${topic.color}40">Q</div>
            <p style="color:#fff;font-size:15px;line-height:1.7;flex:1">${escapeHtml(q.c)}</p>
          </div>
        </div>
      </div>

      <div style="padding:20px 20px 0">
        <div class="mode-switch">
          ${modes.map(m => `<button data-mode="${m.k}" class="${SESSION.mode===m.k?'active':''}">${m.i} ${m.l}</button>`).join('')}
        </div>
      </div>

      <div style="padding:20px">
        ${SESSION.mode.endsWith('-text') ? `
          <textarea id="session-input" class="input" placeholder="${SESSION.mode.startsWith('zh') ? '用中文描述你的回答…' : 'Type your answer in English…'}" style="height:140px;resize:none;line-height:1.6">${escapeHtml(SESSION.input)}</textarea>
        ` : `
          <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;min-height:160px;position:relative;overflow:hidden">
            <div class="card-top-line"></div>
            ${SESSION.recording ? `<div style="position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px">
              <div class="status-dot" style="background:#EF4444;animation:dotBlink 1.2s infinite"></div>
              <span style="color:#FCA5A5;font-size:11px;font-weight:600">REC</span>
            </div>` : ''}

              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>

/* =================================================================

let ANKI_FLIPPED = false;

function startAnkiSession(){
  const queue = getAnkiQueue();
  STATE.ankiQueue = queue.map(x => x.i);
  STATE.ankiIndex = 0;
  STATE.ankiSessionStats = {again:0,hard:0,good:0,easy:0};
  ANKI_FLIPPED = false;
  if (queue.length === 0) {
    go('anki-empty');
  } else {
    go('anki');
  }
}

function renderAnki(){
  if (STATE.ankiIndex >= STATE.ankiQueue.length) {
    return renderAnkiComplete();
  }
  const idx = STATE.ankiQueue[STATE.ankiIndex];

              <div class="anki-content">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">

function rateAnki(quality){
  if (STATE.ankiIndex >= STATE.ankiQueue.length) return;
  const idx = STATE.ankiQueue[STATE.ankiIndex];
  const card = STATE.ankiCards[idx];
  const update = calcNextReview(card, quality);
  Object.assign(card, update);
  STATE.ankiSessionStats[['again','hard','good','easy'][quality]]++;
  saveState();
  STATE.ankiIndex++;
  ANKI_FLIPPED = false;
  if (STATE.ankiIndex >= STATE.ankiQueue.length) {
    go('anki-complete');
  } else {
    render();
  }
}

/* =================================================================
   个人词库
   ================================================================= */
let VOCAB_SORT = 'freq';
let VOCAB_FILTER = 'all';
let VOCAB_SEARCH = '';
function renderVocabulary(){
  let words = [...STATE.words];
  if (VOCAB_FILTER !== 'all') words = words.filter(w => w.topic === VOCAB_FILTER);
  if (VOCAB_SEARCH) {
    const s = VOCAB_SEARCH.toLowerCase();
    words = words.filter(w => w.word.toLowerCase().includes(s) || (w.meaning||'').toLowerCase().includes(s));
  }
  if (VOCAB_SORT === 'freq') words.sort((a,b) => b.freq - a.freq);
  else if (VOCAB_SORT === 'time') words.sort((a,b) => new Date(b.added) - new Date(a.added));
  else words.sort((a,b) => a.word.localeCompare(b.word));

  const topics = Array.from(new Set(STATE.words.map(w => w.topic)));

  return `<div class="page">
    <div class="page-scroll">
      <div style="padding:56px 24px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <h1 style="color:#fff;font-size:28px;font-weight:800;letter-spacing:-0.5px">个人词库</h1>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="tag tag-purple">${STATE.words.length} 词</span>
            <button data-nav="vocab-compare" class="btn btn-primary" style="padding:8px 14px;border-radius:10px;font-size:12px">📊 对比分析</button>
          </div>
        </div>
        <p style="color:rgba(255,255,255,0.5);font-size:13px">你在练习中使用过的所有词汇</p>
      </div>

      <div style="padding:0 24px 12px">
        <input id="vocab-search" class="input" value="${escapeHtml(VOCAB_SEARCH)}" placeholder="🔍 搜索单词或释义…" style="font-size:14px;padding:14px 18px">
      </div>

      <div style="padding:0 24px 8px;display:flex;gap:6px;overflow-x:auto;padding-bottom:8px">
        <button data-vfilter="all" class="chip ${VOCAB_FILTER==='all'?'active':''}">全部</button>
        ${topics.map(t => { const tName = TOPICS.find(x => x.id === t)?.name || (STATE.customTopics.find(x => x.id === t)?.name) || t; return `<button data-vfilter="${escapeHtml(t)}" class="chip ${VOCAB_FILTER===t?'active':''}">${escapeHtml(tName)}</button>`; }).join('')}
      </div>

      <div style="padding:8px 24px 16px;display:flex;align-items:center;gap:8px">
        <span style="color:rgba(255,255,255,0.4);font-size:11px">排序:</span>
        <button data-vsort="freq" class="chip ${VOCAB_SORT==='freq'?'active':''}" style="font-size:11px;padding:6px 12px">🔥 频率</button>
        <button data-vsort="time" class="chip ${VOCAB_SORT==='time'?'active':''}" style="font-size:11px;padding:6px 12px">🕐 时间</button>
        <button data-vsort="alpha" class="chip ${VOCAB_SORT==='alpha'?'active':''}" style="font-size:11px;padding:6px 12px">🔤 字母</button>
      </div>

      <div style="padding:0 24px 24px;display:flex;flex-direction:column;gap:10px">
        ${words.length === 0 ? `<div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.3);font-size:13px">${VOCAB_SEARCH?'未找到匹配的单词':'还没有词汇积累\n完成练习后 AI 会自动提取'}</div>` : words.map((w,i) => {
          const tName = TOPICS.find(x => x.id === w.topic)?.name || (STATE.customTopics.find(x => x.id === w.topic)?.name) || w.topic;
          return `<div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden">
            <div class="card-top-line"></div>

    {k:'home',l:'首页',svg:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'},
    {k:'practice',l:'题库',svg:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'},
    {k:'vocabulary',l:'词库',svg:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'},
    {k:'anki',l:'复习',svg:'<path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/><path d="M9 12l2 2 4-4"/>'}
  ];
  const isActive = (k) => {
    if (k === 'practice') return PAGE === 'practice' || PAGE === 'practice-session';
    if (k === 'anki') return PAGE === 'anki' || PAGE === 'anki-empty' || PAGE === 'anki-complete';
    return PAGE === k;
  };
  return `<nav class="nav">
    <div class="nav-inner">
      ${items.map(it => `<div class="nav-item ${isActive(it.k)?'active':''}" data-nav="${it.k}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${it.svg}</svg>
        <span>${it.l}</span>
      </div>`).join('')}
    </div>
  </nav>`;
}

/* =================================================================
   主渲染
   ================================================================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch (PAGE) {
    case 'boot': html = renderBoot(); break;
    case 'intro': html = renderIntro(); break;
    case 'register': html = renderRegister(); break;
    case 'home': html = renderHome(); break;
    case 'practice': html = renderPractice(); break;
    case 'practice-session': html = renderPracticeSession(); break;
    case 'vocabulary': html = renderVocabulary(); break;
    case 'vocab-compare': html = renderVocabCompare(); break;
    case 'anki': html = renderAnki(); break;
    case 'anki-empty': html = renderAnkiEmpty(); break;
    case 'anki-complete': html = renderAnkiComplete(); break;
    case 'extension': html = renderExtension(); break;
    default: html = renderHome();
  }
  const showNav = ['home','practice','vocabulary','extension'].includes(PAGE);
  app.innerHTML = html + (showNav ? renderNav() : '');
  bind();
  if (PAGE === 'boot') initBootParticles();
}

function bind(){
  // 启动按钮
  const enter = document.getElementById('enter-btn');
  if (enter) enter.addEventListener('click', handleEnter);

  // 引导
  const introPrev = document.getElementById('intro-prev');
  if (introPrev) introPrev.addEventListener('click', () => { INTRO_STEP--; render(); });
  const introNext = document.getElementById('intro-next');
  if (introNext) introNext.addEventListener('click', () => {
    if (INTRO_STEP < 3) { INTRO_STEP++; render(); }
    else { STATE.seenIntro = true; if (STATE.user) go('home'); else go('register'); }
  });

  // 注册
  const nick = document.getElementById('reg-nick');
  if (nick) nick.addEventListener('input', e => { REG.nickname = e.target.value; });
  document.querySelectorAll('[data-level]').forEach(el => el.addEventListener('click', () => { REG.level = el.getAttribute('data-level'); render(); setTimeout(()=>{const i=document.getElementById('reg-nick'); if(i)i.focus();}, 10); }));
  document.querySelectorAll('[data-target]').forEach(el => el.addEventListener('click', () => { REG.target = el.getAttribute('data-target'); render(); }));
  document.querySelectorAll('[data-tag]').forEach(el => el.addEventListener('click', () => {
    const t = el.getAttribute('data-tag');
    if (REG.interests.includes(t)) REG.interests = REG.interests.filter(x => x !== t);
    else REG.interests.push(t);
    render();
  }));
  const regPrev = document.getElementById('reg-prev');
  if (regPrev) regPrev.addEventListener('click', () => { REG_STEP--; render(); });
  const regNext = document.getElementById('reg-next');
  if (regNext) regNext.addEventListener('click', () => {
    let canNext = false;
    if (REG_STEP === 0) canNext = REG.nickname.trim().length > 0;
    else if (REG_STEP === 1) canNext = !!REG.level;
    else if (REG_STEP === 2) canNext = !!REG.target;
    else canNext = REG.interests.length > 0;
    if (!canNext) return;
    if (REG_STEP < 3) { REG_STEP++; render(); }
    else {
      STATE.user = {nickname: REG.nickname, level: REG.level, target: REG.target, interests: REG.interests};
      saveState();
      go('home');
    }
  });

  // 通用导航
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      const target = el.getAttribute('data-nav');
      if (target === 'anki') { startAnkiSession(); return; }
      SESSION = {qIndex:0, mode:'zh-voice', input:'', result:null, recording:false, processing:false, scores:[]};
      EXT_SHOW_FORM = false;
      go(target);
    });
  });

  // 添加考试词汇
  document.querySelectorAll('[data-add-exam]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      const examId = el.getAttribute('data-add-exam');
      addExamWords(examId);
    });
  });

  // 题库分类
  document.querySelectorAll('[data-cat]').forEach(el => el.addEventListener('click', () => { PRACTICE_CAT = el.getAttribute('data-cat'); render(); }));

  // 进入练习
  document.querySelectorAll('[data-practice]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const id = el.getAttribute('data-practice');
    const t = TOPICS.find(x => x.id === id);
    if (t && t.cat === '扩展' && getProgress(id) < 3) return;
    SESSION = {qIndex:0, mode:'zh-voice', input:'', result:null, recording:false, processing:false, scores:[]};
    go('practice-session', {topicId: id});
  }));

  // 模式切换
  document.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => {
    SESSION.mode = el.getAttribute('data-mode');
    SESSION.input = '';
    SESSION.result = null;
    if (RECOGNITION) try{RECOGNITION.stop();}catch(e){}
    RECOGNITION = null; SESSION.recording = false;
    render();
  }));

  // 输入框
  const inp = document.getElementById('session-input');
  if (inp) inp.addEventListener('input', e => { SESSION.input = e.target.value; });

  // 麦克风
  const mic = document.getElementById('mic-btn');
  if (mic) mic.addEventListener('click', toggleMic);

  // 提交
  const submit = document.getElementById('submit-btn');
  if (submit) submit.addEventListener('click', handleSubmit);

  // 下一题
  const next = document.getElementById('next-btn');
  if (next) next.addEventListener('click', () => {
    const topicId = PARAMS.topicId;
    const customQ = getCustomQuestions(topicId);
    const questions = customQ || QUESTIONS[topicId] || [];
    if (SESSION.qIndex < questions.length - 1) {
      SESSION.qIndex++;
      SESSION.input = ''; SESSION.result = null; SESSION.processing = false;
      render();
    } else {
      go('practice');
    }
  });

  // 朗读
  document.querySelectorAll('[data-speak]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); speak(el.getAttribute('data-speak'), 'en-US'); }));

  // 词库搜索/排序/筛选
  const vs = document.getElementById('vocab-search');
  if (vs) vs.addEventListener('input', e => { VOCAB_SEARCH = e.target.value; render(); });
  document.querySelectorAll('[data-vfilter]').forEach(el => el.addEventListener('click', () => { VOCAB_FILTER = el.getAttribute('data-vfilter'); render(); }));
  document.querySelectorAll('[data-vsort]').forEach(el => el.addEventListener('click', () => { VOCAB_SORT = el.getAttribute('data-vsort'); render(); }));

  // Anki 翻转
  const ankiFlip = document.getElementById('anki-flip');
  if (ankiFlip) ankiFlip.addEventListener('click', () => { ANKI_FLIPPED = !ANKI_FLIPPED; render(); });
  document.querySelectorAll('[data-rate]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); rateAnki(parseInt(el.getAttribute('data-rate'))); }));

  // 扩展自定义
  const customToggle = document.getElementById('custom-toggle');
  if (customToggle) customToggle.addEventListener('click', () => { 
    EXT_SHOW_FORM = true; EXT_EDIT_ID = null; render(); 
    setTimeout(() => {
      const formEl = document.getElementById('custom-name') || document.getElementById('custom-save');
      if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  });
  const customCancel = document.getElementById('custom-cancel');
  if (customCancel) customCancel.addEventListener('click', () => { EXT_SHOW_FORM = false; EXT_EDIT_ID = null; render(); });

  // 保存（创建或编辑）
  const customSave = document.getElementById('custom-save');
  if (customSave) customSave.addEventListener('click', () => {
    const name = document.getElementById('custom-name').value.trim();
    const qs = document.getElementById('custom-qs').value.trim();
    if (!name || !qs) return;
    const tags = [];
    document.querySelectorAll('[data-cus-tag].active').forEach(el => tags.push(el.getAttribute('data-cus-tag')));
    const questions = qs.split('\n').filter(x => x.trim()).map(c => ({c: c.trim(), d:'medium'}));
    if (EXT_EDIT_ID) {
      const idx = STATE.customTopics.findIndex(t => t.id === EXT_EDIT_ID);
      if (idx >= 0) {
        STATE.customTopics[idx] = { ...STATE.customTopics[idx], name, questions, tags };
      }
    } else {
      STATE.customTopics.push({id: 'custom-' + Date.now(), name, questions, desc: '自定义话题', tags, createdAt: Date.now()});
    }
    saveState();
    EXT_SHOW_FORM = false;
    EXT_EDIT_ID = null;
    render();
  });

  // 表单内标签选择
  document.querySelectorAll('[data-cus-tag]').forEach(el => el.addEventListener('click', () => {
    el.classList.toggle('active');
  }));

  // 预设模板导入
  document.querySelectorAll('[data-import]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const id = el.getAttribute('data-import');
    const tmpl = TEMPLATES.find(t => t.id === id);
    if (!tmpl) return;
    const exists = STATE.customTopics.find(t => t.name === tmpl.name);
    if (exists) {
      if (!confirm(`"${tmpl.name}" 已存在，是否覆盖导入？`)) return;
      const idx = STATE.customTopics.findIndex(t => t.name === tmpl.name);
      STATE.customTopics[idx] = {id: exists.id, name: tmpl.name, questions: [...tmpl.questions], desc: tmpl.desc, tags: [...tmpl.tags], createdAt: exists.createdAt};
    } else {
      STATE.customTopics.push({id: 'custom-' + Date.now(), name: tmpl.name, questions: [...tmpl.questions], desc: tmpl.desc, tags: [...tmpl.tags], createdAt: Date.now()});
    }
    saveState();
    render();
  }));

  // 编辑自定义话题
  document.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    EXT_EDIT_ID = el.getAttribute('data-edit');
    EXT_SHOW_FORM = true;
    render();
    setTimeout(() => {
      const formEl = document.getElementById('custom-name') || document.getElementById('custom-save');
      if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }));

  // 删除自定义话题
  document.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const id = el.getAttribute('data-del');
    const t = STATE.customTopics.find(x => x.id === id);
    if (confirm(`确定删除自定义话题「${t?.name || ''}」吗？`)) {
      STATE.customTopics = STATE.customTopics.filter(x => x.id !== id);
      saveState();
      render();
    }
  }));

  // 自定义话题标签筛选
  document.querySelectorAll('[data-ext-tag]').forEach(el => el.addEventListener('click', () => {
    PARAMS.extTag = el.getAttribute('data-ext-tag');
    render();
  }));

  // 剪贴板导入
  const customPaste = document.getElementById('custom-paste');
  if (customPaste) customPaste.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) return;
      const ta = document.getElementById('custom-qs');
      if (ta) { ta.value = ta.value ? ta.value + '\n' + text : text; }
    } catch(e) { alert('无法读取剪贴板，请手动粘贴'); }
  });

  // 文件导入
  const customFileBtn = document.getElementById('custom-file-btn');
  const customFile = document.getElementById('custom-file');
  if (customFileBtn && customFile) {
    customFileBtn.addEventListener('click', () => customFile.click());
    customFile.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const text = ev.target.result;
        const ta = document.getElementById('custom-qs');
        if (ta) { ta.value = ta.value ? ta.value + '\n' + text : text; }
        customFile.value = '';
      };
      reader.readAsText(file);
    });
  }
}

/* =================================================================
   语音识别
   ================================================================= */
function toggleMic(){
  if (SESSION.recording) {
    if (RECOGNITION) try{RECOGNITION.stop();}catch(e){}
    SESSION.recording = false; RECOGNITION = null;
    render();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('当前浏览器不支持语音识别，请使用 Chrome/Edge 浏览器'); return; }
  const r = new SR();
  r.lang = SESSION.mode.startsWith('zh') ? 'zh-CN' : 'en-US';
  r.continuous = false; r.interimResults = false;
  r.onstart = () => { SESSION.recording = true; render(); };
  r.onend = () => { SESSION.recording = false; RECOGNITION = null; render(); };
  r.onresult = e => {
    const text = e.results[0][0].transcript;
    SESSION.input = SESSION.input ? SESSION.input + ' ' + text : text;
    render();
  };
  r.onerror = () => { SESSION.recording = false; RECOGNITION = null; render(); };
  try { r.start(); RECOGNITION = r; } catch(e) { alert('启动语音识别失败'); }
}

/* =================================================================
   AI 处理（调用后端）
   ================================================================= */
const API_BASE = 'http://localhost:3001/api';

async function handleSubmit(){
  if (!SESSION.input.trim() || SESSION.processing) return;
  SESSION.processing = true;
  updateStreak();
  render();
  const topicId = PARAMS.topicId;
  let result = null;
  try {
    if (SESSION.mode.startsWith('zh')) {
      const res = await fetch(API_BASE + '/translate', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({text: SESSION.input, topicId})
      });
      const data = await res.json();
      if (data && data.success) {
        result = {type: 'translate', text: data.text, words: data.words, suggestions: []};
      }
    } else {
      const res = await fetch(API_BASE + '/correct', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({text: SESSION.input, topicId})
      });
      const data = await res.json();
      if (data && data.success) {
        result = {type: 'correct', text: data.text, words: data.words, suggestions: data.suggestions || []};
      }
    }
  } catch(e) {
    console.error('API error:', e);
  }

  if (!result) {
    // 兜底
    if (SESSION.mode.startsWith('zh')) {
      result = {
        type: 'translate',
        text: 'Translation: ' + SESSION.input,
        words: [
          {word:'practice',phonetic:'/ˈpræktɪs/',meaning:'练习',topic:topicId,freq:1},
          {word:'improve',phonetic:'/ɪmˈpruːv/',meaning:'改善',topic:topicId,freq:1},
          {word:'skill',phonetic:'/skɪl/',meaning:'技能',topic:topicId,freq:1}
        ],
        suggestions: ['AI 服务暂不可用，请确保后端服务已启动']
      };
    } else {
      result = {
        type: 'correct',
        text: SESSION.input,
        words: [
          {word:'response',phonetic:'/rɪˈspɒns/',meaning:'回应',topic:topicId,freq:1},
          {word:'detail',phonetic:'/ˈdiːteɪl/',meaning:'细节',topic:topicId,freq:1}
        ],
        suggestions: ['AI 服务暂不可用，请确保后端服务已启动'],
      };
    }
  }

  SESSION.result = result;
  if (result.words && result.words.length) addWords(result.words);
  addRecord({
    topicId,
    inputType: SESSION.mode,
    originalText: SESSION.input,
    processedText: result.text
  });
  updateProgress(topicId, 1);
  SESSION.processing = false;
  render();
}

/* =================================================================
   启动
   ================================================================= */
loadState();
go('boot');
</script>
