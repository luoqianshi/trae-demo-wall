    text:'分享一个超简单的豆腐减脂食谱：嫩豆腐切块，用少许油煎至两面金黄，淋上生抽和葱花。蛋白质18g，热量仅160kcal，比肉还香！',
    meals:[{name:'煎豆腐',cal:160},{name:'紫菜蛋花汤',cal:45}], likes:89, liked:false }
];

const weightData = [
  { day:'周一', weight:68.7 },
  { day:'周二', weight:68.5 },
  { day:'周三', weight:68.9 },
  { day:'周四', weight:68.4 },
  { day:'周五', weight:68.2 },
  { day:'周六', weight:68.5 },
  { day:'今天', weight:68.3 }
];

const achievements = [
  { icon:'🏆', name:'初战告捷', desc:'首次减重1kg' },
  { icon:'🔥', name:'七日连续', desc:'连续打卡7天' },
  { icon:'💪', name:'蛋白质达人', desc:'连续3天蛋白质达标' },
  { icon:'🥗', name:'绿色食客', desc:'累计吃20份沙拉' },
  { icon:'⭐', name:'社区之星', desc:'获100个点赞' },
  { icon:'🎯', name:'目标达成', desc:'达到目标体重' }
];

const profileMenu = [
  { icon:'📊', name:'饮食报告', desc:'查看营养分析', cls:'m1' },
  { icon:'⏰', name:'提醒设置', desc:'用餐时间提醒', cls:'m2' },
  { icon:'🎯', name:'目标管理', desc:'体重/热量目标', cls:'m3' },
  { icon:'❤️', name:'健康档案', desc:'身体数据管理', cls:'m4' },
  { icon:'📥', name:'数据导出', desc:'导出健康数据', cls:'m5' },
  { icon:'⚙️', name:'设置', desc:'账号与偏好', cls:'m6' }
];

// ==================== STATE ====================
let eatenMeals = [];
let currentSort = 'health';
let currentTab = 'home';

// ==================== INIT ====================
function init() {
  updateDate();
  renderMeals();
  renderRestaurants();
  renderLocations();
  renderCategories();
  renderRecipes();
  renderTips();
  renderCommunity();
  renderWeightChart();
  renderAchievements();
  renderProfileMenu();
  bindEvents();
}

function updateDate() {
  const now = new Date();
  const days = ['日','一','二','三','四','五','六'];
  document.getElementById('headerDate').textContent = `${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;
}

// ==================== TAB SWITCHING ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  window.scrollTo(0, 0);
}

// ==================== HOME ====================
function renderMeals() {
  const c = document.getElementById('mealCards');
  c.innerHTML = meals.map(m => `
    <div class="meal-card ${eatenMeals.includes(m.id)?'done':''}" data-meal="${m.id}">
      <div class="meal-header">
        <div class="meal-icon ${m.iconClass}">${m.icon}</div>
        <div class="meal-info"><h3>${m.name}</h3><div class="meal-cal">约 <span>${m.calories}</span> kcal · ${m.items.length}样</div></div>
      </div>
      <div class="meal-tags">
        ${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}
        <span class="tag warn">💡 ${m.tip}</span>
      </div>
      <div class="meal-items">
        ${m.items.map(i=>`<div class="meal-item"><span class="meal-item-name"><span class="dot"></span>${i.name}</span><span class="meal-item-cal">${i.cal} kcal</span></div>`).join('')}
      </div>
    </div>`).join('');
  updateCalorieRing();
}

function updateCalorieRing() {
  const total = meals.reduce((s,m)=>s+m.calories,0);
  const eaten = meals.filter(m=>eatenMeals.includes(m.id)).reduce((s,m)=>s+m.calories,0);
  const remain = total - eaten;
  const pct = eaten / total;
  document.getElementById('progressCircle').style.strokeDashoffset = 188.5 * (1 - pct);
  document.getElementById('calorieNum').textContent = remain;
  document.querySelector('.calorie-label').textContent = '/ ' + total;
}

function renderRestaurants() {
  const sorted = [...restaurants].sort((a,b) => {
    if(currentSort==='health') return b.health-a.health;
    if(currentSort==='distance') return a.distance-b.distance;
    if(currentSort==='calorie') return a.calories-b.calories;
    if(currentSort==='rating') return b.rating-a.rating;
    return 0;
  });
  document.getElementById('restaurantList').innerHTML = sorted.map(r=>`
    <div class="restaurant-card" data-rest="${r.id}">
      <div class="rest-img">${r.emoji}</div>
      <div class="rest-info">
        <div class="rest-name">${r.name}<span class="health-score ${r.health>=85?'high':r.health>=70?'medium':''}">${r.health}分</span></div>
        <div class="rest-meta"><span>⭐ ${r.rating}</span><span>📍 ${r.distance}km</span><span>🔥 ${r.calories}kcal</span></div>
        <div class="rest-tags">${r.tags.map(t=>`<span class="rest-tag ${t==='低卡'||t==='有机'?'green':''}">${t}</span>`).join('')}</div>
      </div>
    </div>`).join('');
}

function renderLocations() {
  document.getElementById('locationOptions').innerHTML = locations.map((l,i)=>`
    <div class="location-option ${l.active?'active':''}" data-idx="${i}">
      <div class="loc-icon">📍</div>
      <div class="loc-info"><div class="loc-name">${l.name}</div><div class="loc-detail">${l.detail}</div></div>
      ${l.active?'<span style="color:var(--accent);font-size:13px;">✓</span>':''}
    </div>`).join('');
}

function showDetail(rest) {
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-hero"><div class="emoji">${rest.emoji}</div><h2>${rest.name}</h2><div style="color:var(--muted);font-size:14px;">${rest.address}</div></div>
    <div class="detail-section"><h3>健康度评分</h3><div class="health-detail">
      <div class="health-circle"><svg width="80" height="80" viewBox="0 0 80 80"><circle class="hc-track" cx="40" cy="40" r="32"/><circle class="hc-progress" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="${201*(1-rest.health/100)}"/></svg><div class="hc-text">${rest.health}</div></div>
      <div class="health-factors">
        ${['ingredients','食材','cooking','烹饪','nutrition','营养','balance','均衡'].match(/.{2}/g).map((_,i,a)=>{ const key=a[i*2]; const label=a[i*2+1]; return i<2?'':`<div class="factor"><span style="width:50px;">${label}</span><div class="factor-bar"><div class="factor-fill" style="width:${rest.factors[key]}%"></div></div><span>${rest.factors[key]}</span></div>`; }).join('')}
      </div>
    </div></div>
    <div class="detail-section"><h3>推荐低卡菜单</h3><div class="menu-list">${rest.menu.map(m=>`<div class="menu-item"><span class="menu-item-name">${m.name}</span><span class="menu-item-cal">${m.cal} kcal</span></div>`).join('')}</div></div>`;
  document.getElementById('detailPage').classList.add('show');
}

// ==================== DISCOVER ====================
function renderCategories() {
  document.getElementById('categoryGrid').innerHTML = categories.map(c=>`
    <div class="cat-item"><div class="cat-icon ${c.cls}">${c.icon}</div><div class="cat-name">${c.name}</div></div>`).join('');
}

function renderRecipes() {
  document.getElementById('recipeScroll').innerHTML = recipes.map(r=>`
    <div class="recipe-card" data-recipe="${r.id}">
      <div class="recipe-img ${r.bg}">${r.emoji}</div>
      <div class="recipe-body"><h4>${r.name}</h4>
        <div class="recipe-meta"><span class="recipe-cal">${r.cal}kcal</span><span>${r.time}</span><span>${r.diff}</span></div>
      </div>
    </div>`).join('');
}

function showRecipeDetail(recipe) {
  document.getElementById('recipeModalContent').innerHTML = `
    <div class="recipe-modal-hero">
      <div class="emoji">${recipe.emoji}</div>
      <h2>${recipe.name}</h2>
      <div class="rm-meta"><span>🔥 ${recipe.cal} kcal</span><span>⏱ ${recipe.time}</span><span>📊 ${recipe.diff}</span></div>
    </div>
    <div class="recipe-ingredients"><h4>所需食材</h4><div class="ing-grid">${recipe.ingredients.map(i=>`<span class="ing-tag">${i}</span>`).join('')}</div></div>
    <div class="recipe-steps"><h4 style="font-size:15px;font-weight:600;margin-bottom:14px;">制作步骤</h4>
      ${recipe.steps.map((s,i)=>`<div class="recipe-step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('')}
    </div>`;
  document.getElementById('recipeModal').classList.add('show');
}

function renderTips() {
  document.getElementById('tipsList').innerHTML = tips.map((t,i)=>`
    <div class="tip-card" data-tip="${i}">
      <div class="tip-num">${i+1}</div>
      <div class="tip-content"><h4>${t.title}</h4><p>${t.summary}</p></div>
    </div>`).join('');
}

function showTipDetail(tip) {
  document.getElementById('tipDetailTitle').textContent = tip.title;
  document.getElementById('tipDetailContent').innerHTML = `
    <div class="detail-section" style="margin-bottom:0;">
      <p style="font-size:15px;line-height:1.8;white-space:pre-line;">${tip.detail}</p>
    </div>`;
  document.getElementById('tipDetailPage').classList.add('show');
}

function renderCommunity() {
  document.getElementById('communityList').innerHTML = communityPosts.map((p,i)=>`
    <div class="community-card" data-post="${i}">
      <div class="comm-user">
        <div class="comm-avatar ${p.avatarCls}">${p.avatar}</div>
        <div><div class="comm-name">${p.user}</div><div class="comm-time">${p.time}</div></div>
      </div>
      <div class="comm-text">${p.text}</div>
      <div class="comm-meals">
        ${p.meals.map(m=>`<span class="comm-meal-tag">${m.name}<span class="cal">${m.cal}kcal</span></span>`).join('')}
      </div>
      <div class="comm-actions">
        <div class="comm-action ${p.liked?'liked':''}" data-like="${i}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="${p.liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span>${p.likes}</span>
        </div>
        <div class="comm-action">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>评论</span>
        </div>
        <div class="comm-action">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          <span>分享</span>
        </div>
      </div>
    </div>`).join('');
}

// ==================== PROFILE ====================
function renderWeightChart() {
  const maxW = Math.max(...weightData.map(d=>d.weight));
  const minW = Math.min(...weightData.map(d=>d.weight));
  const range = maxW - minW || 1;
  document.getElementById('weightChart').innerHTML = weightData.map((d,i)=>{
    const h = 20 + ((d.weight - minW) / range) * 100;
    const isToday = i === weightData.length - 1;
    return `<div class="weight-bar-wrap">
      <div class="weight-bar-val">${d.weight}</div>
      <div class="weight-bar ${isToday?'today':''}" style="height:${h}px;"></div>
      <div class="weight-bar-label">${d.day}</div>
    </div>`;
  }).join('');
}

function renderAchievements() {
  document.getElementById('achievementGrid').innerHTML = achievements.map(a=>`
    <div class="ach-item"><div class="ach-icon">${a.icon}</div><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div></div>`).join('');
}

function renderProfileMenu() {
  document.getElementById('menuListProfile').innerHTML = profileMenu.map(m=>`
    <div class="menu-item-profile">
      <div class="mip-icon ${m.cls}">${m.icon}</div>
      <div><div class="mip-text">${m.name}</div><div style="font-size:12px;color:var(--muted);">${m.desc}</div></div>
      <span class="mip-arrow">›</span>
    </div>`).join('');
}

// ==================== TOAST ====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// ==================== EVENTS ====================
function bindEvents() {
  // Tab nav
  document.getElementById('bottomNav').addEventListener('click', e => {
    const item = e.target.closest('.nav-item');
    if (!item) return;
    switchTab(item.dataset.tab);
  });

  // Meal cards
  document.getElementById('mealCards').addEventListener('click', e => {
    const card = e.target.closest('.meal-card');
    if (!card) return;
    const id = card.dataset.meal;
    if (eatenMeals.includes(id)) {
      eatenMeals = eatenMeals.filter(m=>m!==id);
      showToast('已取消记录');
    } else {
      eatenMeals.push(id);
      showToast('记录成功！');
    }
    renderMeals();
  });

  // Sort buttons
  document.getElementById('sortBar').addEventListener('click', e => {
    const btn = e.target.closest('.sort-btn');
    if (!btn) return;
    document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    renderRestaurants();
  });

  // Restaurant cards
  document.getElementById('restaurantList').addEventListener('click', e => {
    const card = e.target.closest('.restaurant-card');
    if (!card) return;
    const rest = restaurants.find(r=>r.id===parseInt(card.dataset.rest));
    if (rest) showDetail(rest);
  });

  // Location modal
  document.getElementById('locationBar').addEventListener('click', () => {
    document.getElementById('locationModal').classList.add('show');
  });
  document.getElementById('closeModal').addEventListener('click', () => {
    document.getElementById('locationModal').classList.remove('show');
  });
  document.getElementById('locationModal').addEventListener('click', e => {
    if (e.target.id==='locationModal') document.getElementById('locationModal').classList.remove('show');
  });
  document.getElementById('locationOptions').addEventListener('click', e => {
    const opt = e.target.closest('.location-option');
    if (!opt) return;
    const idx = parseInt(opt.dataset.idx);
    locations.forEach((l,i)=>l.active=i===idx);
    document.getElementById('currentLocation').textContent = locations[idx].name;
    renderLocations();
    setTimeout(()=>{ document.getElementById('locationModal').classList.remove('show'); showToast('定位已切换'); }, 200);
  });

  // Back buttons
  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('detailPage').classList.remove('show');
  });
  document.getElementById('backTipBtn').addEventListener('click', () => {
    document.getElementById('tipDetailPage').classList.remove('show');
  });

  // Recipe modal
  document.getElementById('recipeScroll').addEventListener('click', e => {
    const card = e.target.closest('.recipe-card');
    if (!card) return;
    const recipe = recipes.find(r=>r.id===parseInt(card.dataset.recipe));
    if (recipe) showRecipeDetail(recipe);
  });
  document.getElementById('closeRecipeModal').addEventListener('click', () => {
    document.getElementById('recipeModal').classList.remove('show');
  });
  document.getElementById('recipeModal').addEventListener('click', e => {
    if (e.target.id==='recipeModal') document.getElementById('recipeModal').classList.remove('show');
  });

  // Tips
  document.getElementById('tipsList').addEventListener('click', e => {
    const card = e.target.closest('.tip-card');
    if (!card) return;
    showTipDetail(tips[parseInt(card.dataset.tip)]);
  });

  // Community likes
  document.getElementById('communityList').addEventListener('click', e => {
    const action = e.target.closest('.comm-action[data-like]');
    if (!action) return;
    const idx = parseInt(action.dataset.like);
    communityPosts[idx].liked = !communityPosts[idx].liked;
    communityPosts[idx].likes += communityPosts[idx].liked ? 1 : -1;
    renderCommunity();
  });

  // Weight recording
  document.getElementById('btnRecordWeight').addEventListener('click', () => {
    const input = document.getElementById('weightInput');
    const val = parseFloat(input.value);
    if (isNaN(val) || val < 30 || val > 200) {
      showToast('请输入有效体重');
      return;
    }
    weightData[weightData.length-1].weight = val;
    document.getElementById('wsCurrent').textContent = val.toFixed(1);
    const first = weightData[0].weight;
    const change = (val - first).toFixed(1);
    const el = document.getElementById('wsChange');
    el.textContent = (change >= 0 ? '+' : '') + change;
    el.className = 'ws-val ' + (parseFloat(change) <= 0 ? 'down' : '');
    renderWeightChart();
    input.value = '';
    showToast('体重已记录！');
  });

  // Search
  document.getElementById('searchInput').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { renderRecipes(); return; }
    const filtered = recipes.filter(r => r.name.includes(q) || r.ingredients.some(i => i.includes(q)));
    document.getElementById('recipeScroll').innerHTML = filtered.map(r=>`
      <div class="recipe-card" data-recipe="${r.id}">
        <div class="recipe-img ${r.bg}">${r.emoji}</div>
        <div class="recipe-body"><h4>${r.name}</h4>
          <div class="recipe-meta"><span class="recipe-cal">${r.cal}kcal</span><span>${r.time}</span><span>${r.diff}</span></div>
        </div>
      </div>`).join('') || '<div style="padding:20px;color:var(--muted);font-size:14px;">未找到相关食谱</div>';
  });
}

// Start
init();
</script>
</body>
</html>
