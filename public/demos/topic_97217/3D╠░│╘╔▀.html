<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D贪吃蛇游戏</title>
    <style>
        :root {
            --accent: #00ff88;
            --accent-dark: #00cc6a;
            --accent-glow: rgba(0, 255, 136, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            perspective: 700px;
        }

        /* 3D地面投影 - 移到canvas-wrapper外部避免overflow:hidden裁切 */
        .canvas-shadow {
            width: 320px;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.6) 0%, transparent 70%);
            filter: blur(12px);
            margin-top: -8px;
            z-index: 5;
        }

        .info-bar {
            display: flex;
            gap: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .score-box, .high-score-box, .hp-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 100px;
        }

        .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .value {
            font-size: 24px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow), 0 0 40px var(--accent-glow);
        }

        .hp-value {
            font-size: 22px;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        .hp-bar-container {
            width: 150px;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00cc6a, #00ff88, #66ffaa);
            border-radius: 5px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            transform-style: preserve-3d;
            transform: rotateX(12deg);
            transition: transform 0.3s ease;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 60px var(--accent-glow),
                inset 0 0 60px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid var(--accent);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            z-index: 20;
            gap: 15px;
            transform: rotateX(-12deg);
            transform-origin: center center;
        }

        .overlay-title {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 30px var(--accent-glow);
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(0, 255, 136, 0.3); }
            50% { text-shadow: 0 0 40px var(--accent-glow), 0 0 80px rgba(0, 255, 136, 0.5); }
        }

        .overlay-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        .overlay-score {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 5px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .start-hint {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            animation: pulse 2s ease-in-out infinite;
            text-align: center;
        }

        .controls-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            line-height: 1.8;
        }

        .restart-btn, .primary-btn {
            padding: 12px 40px;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .restart-btn:hover, .primary-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px var(--accent-glow);
        }

        .restart-btn:active, .primary-btn:active {
            transform: translateY(-1px);
        }

        .settings-btn, .leaderboard-btn {
            position: fixed;
            top: 20px;
            z-index: 400;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn {
            right: 20px;
        }

        .leaderboard-btn {
            left: 20px;
            width: auto;
            padding: 0 18px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .leaderboard-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .settings-panel, .leaderboard-panel {
            position: fixed;
            top: 0;
            height: 100%;
            width: 300px;
            background: rgba(20, 20, 40, 0.95);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 60px 25px 30px;
            transition: transform 0.3s ease;
            z-index: 300;
            overflow-y: auto;
        }

        .settings-panel {
            right: 0;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateX(100%);
        }

        .settings-panel.open {
            transform: translateX(0);
        }

        .leaderboard-panel {
            left: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateX(-100%);
        }

        .leaderboard-panel.open {
            transform: translateX(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        .close-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .setting-item {
            margin-bottom: 25px;
        }

        .setting-label {
            display: block;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.2s ease;
        }

        input[type="range"]::-moz-range-track {
            background: transparent;
        }

        .slider-value {
            font-size: 14px;
            color: var(--accent);
            min-width: 45px;
            text-align: right;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-switch.active {
            background: var(--accent);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .toggle-switch.active::after {
            left: 25px;
        }

        .theme-options {
            display: flex;
            gap: 10px;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-btn.active {
            border-color: var(--accent);
            transform: scale(1.1);
        }

        .theme-green { background: linear-gradient(135deg, #00ff88, #00cc6a); }
        .theme-blue { background: linear-gradient(135deg, #00d4ff, #0099cc); }
        .theme-purple { background: linear-gradient(135deg, #b347ff, #8800cc); }
        .theme-orange { background: linear-gradient(135deg, #ff6b35, #ff4500); }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 250;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .leaderboard-list {
            list-style: none;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .leaderboard-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .leaderboard-item.top1 { background: linear-gradient(90deg, rgba(255,215,0,0.15), rgba(255,215,0,0.03)); border-color: rgba(255,215,0,0.4); }
        .leaderboard-item.top2 { background: linear-gradient(90deg, rgba(192,192,192,0.12), rgba(192,192,192,0.03)); }
        .leaderboard-item.top3 { background: linear-gradient(90deg, rgba(205,127,50,0.12), rgba(205,127,50,0.03)); }

        .rank-num {
            font-size: 18px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            min-width: 30px;
        }

        .rank-num.top1 { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
        .rank-num.top2 { color: #c0c0c0; }
        .rank-num.top3 { color: #cd7f32; }

        .player-name {
            flex: 1;
            font-size: 15px;
            color: #fff;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-score {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
        }

        .player-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 10px;
        }

        .leaderboard-empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 30px 0;
            font-size: 14px;
        }

        .name-input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .name-input {
            padding: 12px 20px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.4);
            border-radius: 10px;
            color: #fff;
            outline: none;
            width: 250px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .name-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotateX(12deg); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px) rotateX(12deg); }
            20%, 40%, 60%, 80% { transform: translateX(8px) rotateX(12deg); }
        }

        @keyframes bloodFlash {
            0%, 100% { box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(255, 0, 0, 0.6), inset 0 0 60px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 0 0 100px rgba(255, 0, 0, 0.9), inset 0 0 60px rgba(255, 0, 0, 0.3); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        .blood-flash {
            animation: bloodFlash 0.4s ease-in-out;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .info-bar { gap: 10px; }
            .score-box, .high-score-box, .hp-box { padding: 8px 12px; min-width: 80px; }
            .value, .hp-value { font-size: 18px; }
            .hp-bar-container { width: 100px; }
            .overlay-title { font-size: 24px; }
            .canvas-wrapper { transform: rotateX(0deg); }
            .overlay { transform: rotateX(0deg); }
            .leaderboard-btn, .settings-btn { top: 10px; }
            .leaderboard-btn { padding: 0 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <button class="leaderboard-btn" id="leaderboardBtn" title="排行榜" aria-label="打开排行榜">🏆 排行榜</button>
    <button class="settings-btn" id="settingsBtn" title="设置" aria-label="打开设置">⚙️</button>
    
    <div class="modal-overlay" id="modalOverlay"></div>
    
    <div class="leaderboard-panel" id="leaderboardPanel">
        <div class="settings-header">
            <span class="settings-title">🏆 排行榜</span>
            <button class="close-btn" id="closeLeaderboardBtn">×</button>
        </div>
        <ul class="leaderboard-list" id="leaderboardList">
            <li class="leaderboard-empty">暂无记录，快来挑战吧！</li>
        </ul>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <span class="settings-title">游戏设置</span>
            <button class="close-btn" id="closeSettingsBtn">×</button>
        </div>
        
        <div class="setting-item">
            <span class="setting-label">游戏速度 (1慢-10快)</span>
            <div class="slider-container">
                <input type="range" id="speedSlider" min="1" max="10" value="3">
                <span class="slider-value" id="speedValue">3/10</span>
            </div>
        </div>
        
        <div class="setting-item">
            <span class="setting-label">网格显示</span>
            <div class="toggle-switch active" id="gridToggle" role="switch" aria-checked="true" aria-label="网格显示"></div>
        </div>
        
        <div class="setting-item">
            <span class="setting-label">粒子特效</span>
            <div class="toggle-switch active" id="particleToggle" role="switch" aria-checked="true" aria-label="粒子特效"></div>
        </div>
        
        <div class="setting-item">
            <span class="setting-label">主题颜色</span>
            <div class="theme-options">
                <button class="theme-btn theme-green active" data-theme="green" aria-label="绿色主题"></button>
                <button class="theme-btn theme-blue" data-theme="blue" aria-label="蓝色主题"></button>
                <button class="theme-btn theme-purple" data-theme="purple" aria-label="紫色主题"></button>
                <button class="theme-btn theme-orange" data-theme="orange" aria-label="橙色主题"></button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="info-bar">
            <div class="score-box">
                <span class="label">当前得分</span>
                <span class="value" id="score">0</span>
            </div>
            <div class="hp-box">
                <span class="label">生命值</span>
                <span class="hp-value" id="hpValue">100/100</span>
                <div class="hp-bar-container">
                    <div class="hp-bar-fill" id="hpBarFill" style="width: 100%;"></div>
                </div>
            </div>
            <div class="high-score-box">
                <span class="label">历史最高</span>
                <span class="value" id="highScore">0</span>
            </div>
        </div>
        
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="startOverlay" class="overlay">
                <div class="overlay-title">🐍 3D贪吃蛇</div>
                <div class="name-input-container" id="nameInputContainer">
                    <input type="text" class="name-input" id="playerNameInput" placeholder="输入你的名字" maxlength="12">
                </div>
                <div class="start-hint">输入名字后按方向键或 Enter 开始</div>
                <div class="controls-hint">
                    ⬆️⬇️⬅️➡️ 或 WASD 控制移动<br>
                    🍎 吃食物 +10分 | 💥 撞墙/自撞 -10血 | 🏆 每100分放烟花
                </div>
            </div>
            
            <div id="gameOverOverlay" class="overlay hidden">
                <div class="overlay-title" id="gameOverTitle">游戏结束</div>
                <div class="overlay-subtitle" id="gameOverSubtitle"></div>
                <div class="overlay-score" id="finalScore">得分: 0</div>
                <button class="restart-btn" id="restartBtn">重新开始</button>
            </div>
        </div>
        
        <div class="canvas-shadow"></div>
    </div>

    <script>
        (function() {
            'use strict';

            const GRID_SIZE = 20;
            const CANVAS_SIZE = 400;
            const GRID_COUNT = CANVAS_SIZE / GRID_SIZE;
            const MAX_HP = 100;
            const HP_LOSS_PER_MISTAKE = 10;
            const SCORE_PER_FOOD = 10;
            const SCORE_MILESTONE = 100;

            const themes = {
                green: { snake: '#00ff88', snakeDark: '#00cc6a', food: '#ff3333', foodDark: '#990000', glow: 'rgba(0, 255, 136, 0.5)' },
                blue: { snake: '#00d4ff', snakeDark: '#0099cc', food: '#ff6b9d', foodDark: '#8b1a4a', glow: 'rgba(0, 212, 255, 0.5)' },
                purple: { snake: '#b347ff', snakeDark: '#8800cc', food: '#ffd700', foodDark: '#cc9900', glow: 'rgba(179, 71, 255, 0.5)' },
                orange: { snake: '#ff6b35', snakeDark: '#ff4500', food: '#00ff88', foodDark: '#00994d', glow: 'rgba(255, 107, 53, 0.5)' }
            };

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding:50px;">您的浏览器不支持 Canvas 2D，请升级浏览器</div>';
                throw new Error('Canvas 2D context unavailable');
            }
            const canvasWrapper = document.getElementById('canvasWrapper');

            const scoreEl = document.getElementById('score');
            const hpValueEl = document.getElementById('hpValue');
            const hpBarFill = document.getElementById('hpBarFill');
            const highScoreEl = document.getElementById('highScore');
            const startOverlay = document.getElementById('startOverlay');
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const finalScoreEl = document.getElementById('finalScore');
            const gameOverTitle = document.getElementById('gameOverTitle');
            const gameOverSubtitle = document.getElementById('gameOverSubtitle');
            const restartBtn = document.getElementById('restartBtn');
            const nameInputContainer = document.getElementById('nameInputContainer');
            const playerNameInput = document.getElementById('playerNameInput');

            const settingsBtn = document.getElementById('settingsBtn');
            const settingsPanel = document.getElementById('settingsPanel');
            const closeSettingsBtn = document.getElementById('closeSettingsBtn');
            const modalOverlay = document.getElementById('modalOverlay');

            const leaderboardBtn = document.getElementById('leaderboardBtn');
            const leaderboardPanel = document.getElementById('leaderboardPanel');
            const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');
            const leaderboardList = document.getElementById('leaderboardList');

            const speedSlider = document.getElementById('speedSlider');
            const speedValue = document.getElementById('speedValue');
            const gridToggle = document.getElementById('gridToggle');
            const particleToggle = document.getElementById('particleToggle');
            const themeBtns = document.querySelectorAll('.theme-btn');

            let snake = [];
            let food = {};
            let direction = { x: 0, y: 0 };
            let nextDirection = { x: 0, y: 0 };
            let score = 0;
            let hp = MAX_HP;
            let highScore = 0;
            let gameState = 'idle';
            let fireworks = [];
            let particles = [];
            let floatingTexts = [];
            let lastMilestone = 0;
            let playerName = '';
            let gameSpeed = 3;
            let showGrid = true;
            let enableParticles = true;
            let currentTheme = themes.green;

            let rafId = null;
            let lastTickTime = 0;
            let tickInterval = 200;
            let deathAnimRafId = null;
            let pendingTimeouts = [];
            let penaltyAnimTimeout = null;

            let gridCanvas = null;
            let foodGradient = null;
            let lastFoodPos = null;
            let snakeBodyColors = [];

            const encourageMessages = [
                '太棒了!', '完美!', '干得好!', '继续加油!', '超厉害!',
                '优秀!', '漂亮!', '惊人!', '不可思议!', '太酷了!'
            ];

            const keyMap = {
                'ArrowUp': 'up', 'w': 'up', 'W': 'up',
                'ArrowDown': 'down', 's': 'down', 'S': 'down',
                'ArrowLeft': 'left', 'a': 'left', 'A': 'left',
                'ArrowRight': 'right', 'd': 'right', 'D': 'right'
            };

            function safeLocalStorageGet(key) {
                try { return localStorage.getItem(key); } catch (e) { return null; }
            }

            function safeLocalStorageSet(key, value) {
                try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
            }

            function initHighScore() {
                const saved = safeLocalStorageGet('snakeHighScore');
                if (saved) {
                    const parsed = parseInt(saved, 10);
                    highScore = Number.isNaN(parsed) ? 0 : parsed;
                }
                highScoreEl.textContent = highScore;
            }

            function saveHighScore() {
                if (score > highScore) {
                    highScore = score;
                    safeLocalStorageSet('snakeHighScore', highScore.toString());
                    highScoreEl.textContent = highScore;
                }
            }

            function getLeaderboard() {
                const data = safeLocalStorageGet('snakeLeaderboard');
                if (!data) return [];
                try {
                    const parsed = JSON.parse(data);
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    console.warn('排行榜数据损坏，已重置');
                    return [];
                }
            }

            function saveToLeaderboard(name, score) {
                if (!name || score <= 0) return;
                const board = getLeaderboard();
                board.push({ id: Date.now(), name: name, score: score, date: new Date().toLocaleDateString() });
                board.sort((a, b) => b.score - a.score);
                const top10 = board.slice(0, 10);
                safeLocalStorageSet('snakeLeaderboard', JSON.stringify(top10));
            }

            function renderLeaderboard() {
                const board = getLeaderboard();
                if (board.length === 0) {
                    leaderboardList.innerHTML = '<li class="leaderboard-empty">暂无记录，快来挑战吧！</li>';
                    return;
                }
                leaderboardList.innerHTML = board.map((item, index) => {
                    const rankClass = index === 0 ? 'top1' : index === 1 ? 'top2' : index === 2 ? 'top3' : '';
                    return `<li class="leaderboard-item ${rankClass}">
                        <span class="rank-num ${rankClass}">${index + 1}</span>
                        <span class="player-name">${escapeHtml(item.name)}</span>
                        <span class="player-score">${item.score}</span>
                        <span class="player-date">${item.date}</span>
                    </li>`;
                }).join('');
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function buildGridCache() {
                gridCanvas = document.createElement('canvas');
                gridCanvas.width = CANVAS_SIZE;
                gridCanvas.height = CANVAS_SIZE;
                const gctx = gridCanvas.getContext('2d');
                gctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                gctx.lineWidth = 1;
                for (let i = 0; i <= GRID_COUNT; i++) {
                    gctx.beginPath();
                    gctx.moveTo(i * GRID_SIZE, 0);
                    gctx.lineTo(i * GRID_SIZE, CANVAS_SIZE);
                    gctx.stroke();
                    gctx.beginPath();
                    gctx.moveTo(0, i * GRID_SIZE);
                    gctx.lineTo(CANVAS_SIZE, i * GRID_SIZE);
                    gctx.stroke();
                }
            }

            function rebuildSnakeStyleCache() {
                snakeBodyColors = [];
                const MAX_SNAKE = 100;
                for (let i = 0; i < MAX_SNAKE; i++) {
                    const alpha = Math.max(0.5, 1 - (i / MAX_SNAKE) * 0.5);
                    snakeBodyColors.push(hexToRgba(currentTheme.snake, alpha));
                }
            }

            function resetGame() {
                pendingTimeouts.forEach(id => clearTimeout(id));
                pendingTimeouts = [];

                if (deathAnimRafId) {
                    cancelAnimationFrame(deathAnimRafId);
                    deathAnimRafId = null;
                }

                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }

                if (penaltyAnimTimeout) {
                    clearTimeout(penaltyAnimTimeout);
                    penaltyAnimTimeout = null;
                }

                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { x: 0, y: 0 };
                nextDirection = { x: 0, y: 0 };
                score = 0;
                hp = MAX_HP;
                lastMilestone = 0;
                scoreEl.textContent = score;
                updateHpDisplay();

                fireworks = [];
                particles = [];
                floatingTexts = [];
                lastFoodPos = null;

                generateFood();
                gameState = 'idle';

                gameOverOverlay.classList.add('hidden');
                startOverlay.classList.remove('hidden');
                nameInputContainer.classList.remove('hidden');

                draw();
            }

            function generateFood() {
                let validPosition = false;
                let attempts = 0;
                while (!validPosition && attempts < 500) {
                    food = {
                        x: Math.floor(Math.random() * GRID_COUNT),
                        y: Math.floor(Math.random() * GRID_COUNT)
                    };
                    validPosition = !snake.some(seg => seg.x === food.x && seg.y === food.y);
                    attempts++;
                }
                if (!validPosition) {
                    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
                    let found = false;
                    for (let x = 0; x < GRID_COUNT && !found; x++) {
                        for (let y = 0; y < GRID_COUNT && !found; y++) {
                            if (!occupied.has(`${x},${y}`)) {
                                food = { x, y };
                                found = true;
                            }
                        }
                    }
                    if (!found) {
                        gameOver();
                    }
                }
                lastFoodPos = null;
            }

            function checkCollision(head, array) {
                return array.some(seg => seg.x === head.x && seg.y === head.y);
            }

            function checkWallCollision(head) {
                return head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT;
            }

            function moveSnake() {
                if (direction.x === 0 && direction.y === 0) return;

                const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
                let hitWall = checkWallCollision(head);
                let hitSelf = checkCollision(head, snake);

                if (hitWall || hitSelf) {
                    hp -= HP_LOSS_PER_MISTAKE;
                    updateHpDisplay();
                    triggerPenaltyAnimation(snake[0]);

                    if (hp <= 0) {
                        hp = 0;
                        updateHpDisplay();
                        gameOver();
                        return;
                    }

                    direction = { x: 0, y: 0 };
                    nextDirection = { x: 0, y: 0 };
                    return;
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    score += SCORE_PER_FOOD;
                    scoreEl.textContent = score;
                    triggerEncourageAnimation(head);
                    generateFood();
                    checkMilestone();
                } else {
                    snake.pop();
                }
            }

            function checkMilestone() {
                const currentMilestone = Math.floor(score / SCORE_MILESTONE);
                if (currentMilestone > lastMilestone) {
                    lastMilestone = currentMilestone;
                    startRewardFireworks();
                    createFloatingText(snake[0].x, snake[0].y, `${currentMilestone * 100}分!`, 'encourage');
                }
            }

            function gameOver() {
                gameState = 'gameover';
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }

                saveHighScore();
                saveToLeaderboard(playerName, score);
                renderLeaderboard();

                startDeathFireworks();

                const isNewRecord = score > 0 && score >= highScore;
                finalScoreEl.textContent = `得分: ${score}` + (isNewRecord ? ' 🏆 新纪录!' : '');
                gameOverTitle.textContent = hp <= 0 ? '生命耗尽' : '游戏结束';
                gameOverSubtitle.textContent = isNewRecord ? '恭喜你创造了新纪录!' : '';
                gameOverOverlay.classList.remove('hidden');

                runDeathAnimation();
            }

            function runDeathAnimation() {
                const tick = () => {
                    updateFireworks();
                    updateParticles();
                    updateFloatingTexts();
                    draw();
                    if (fireworks.length > 0 || particles.length > 0 || floatingTexts.length > 0) {
                        deathAnimRafId = requestAnimationFrame(tick);
                    } else {
                        deathAnimRafId = null;
                    }
                };
                deathAnimRafId = requestAnimationFrame(tick);
            }

            function startGame() {
                if (gameState !== 'idle') return;

                playerName = playerNameInput.value.trim() || '匿名玩家';

                gameState = 'playing';
                direction = { ...nextDirection };
                startOverlay.classList.add('hidden');

                tickInterval = getIntervalBySpeed(gameSpeed);
                lastTickTime = performance.now();
                rafId = requestAnimationFrame(gameLoop);
            }

            function getIntervalBySpeed(speed) {
                return Math.round(200 - (speed - 1) * ((200 - 55) / 9));
            }

            function gameLoop(now) {
                rafId = requestAnimationFrame(gameLoop);
                if (now - lastTickTime >= tickInterval) {
                    lastTickTime = now - (now - lastTickTime) % tickInterval;
                    gameTick();
                }
            }

            function gameTick() {
                direction = { ...nextDirection };
                moveSnake();
                updateParticles();
                updateFloatingTexts();
                updateFireworks();
                draw();
            }

            function triggerEncourageAnimation(position) {
                if (enableParticles) {
                    createParticles(position.x, position.y, 'eat');
                }
                const text = encourageMessages[Math.floor(Math.random() * encourageMessages.length)];
                createFloatingText(position.x, position.y, text, 'encourage');
                createFloatingText(position.x, position.y, `+${SCORE_PER_FOOD}`, 'score');
            }

            function triggerPenaltyAnimation(position) {
                canvasWrapper.classList.remove('shake');
                canvasWrapper.classList.remove('blood-flash');
                void canvasWrapper.offsetWidth;
                canvasWrapper.classList.add('shake');
                canvasWrapper.classList.add('blood-flash');

                if (penaltyAnimTimeout) clearTimeout(penaltyAnimTimeout);
                penaltyAnimTimeout = setTimeout(() => {
                    canvasWrapper.classList.remove('shake');
                    canvasWrapper.classList.remove('blood-flash');
                    penaltyAnimTimeout = null;
                }, 500);

                if (enableParticles) {
                    createParticles(position.x, position.y, 'damage');
                }
                createFloatingText(snake[0].x, snake[0].y, `-${HP_LOSS_PER_MISTAKE}血`, 'damage');
            }

            function createParticles(gridX, gridY, type) {
                const centerX = gridX * GRID_SIZE + GRID_SIZE / 2;
                const centerY = gridY * GRID_SIZE + GRID_SIZE / 2;
                const particleCount = type === 'damage' ? 30 : 18;

                for (let i = 0; i < particleCount; i++) {
                    const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.5;
                    const speed = type === 'damage' ? 3 + Math.random() * 4 : 2 + Math.random() * 3;
                    
                    let color = type === 'damage' ? '#ff3333' : currentTheme.food;

                    particles.push({
                        x: centerX,
                        y: centerY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        color: color,
                        size: 3 + Math.random() * 4
                    });
                }
            }

            function updateParticles() {
                particles = particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1;
                    p.life -= 0.025;
                    return p.life > 0;
                });
            }

            function createFloatingText(gridX, gridY, text, type) {
                const x = gridX * GRID_SIZE + GRID_SIZE / 2;
                const y = gridY * GRID_SIZE;
                floatingTexts.push({ x, y, text, type, life: 1 });
            }

            function updateFloatingTexts() {
                floatingTexts = floatingTexts.filter(t => {
                    t.y -= 1.2;
                    t.life -= 0.018;
                    return t.life > 0;
                });
            }

            function scheduleFirework(delay) {
                const id = setTimeout(() => {
                    createFirework();
                    pendingTimeouts = pendingTimeouts.filter(t => t !== id);
                }, delay);
                pendingTimeouts.push(id);
                return id;
            }

            function startRewardFireworks() {
                for (let i = 0; i < 6; i++) {
                    scheduleFirework(i * 150);
                }
            }

            function startDeathFireworks() {
                for (let i = 0; i < 25; i++) {
                    scheduleFirework(i * 200);
                }
            }

            function createFirework() {
                const startX = Math.random() * CANVAS_SIZE;
                const targetY = Math.random() * (CANVAS_SIZE * 0.6);
                fireworks.push({
                    x: startX,
                    y: CANVAS_SIZE,
                    targetY: targetY,
                    vy: -8 - Math.random() * 4,
                    exploded: false,
                    particles: []
                });
            }

            function updateFireworks() {
                fireworks = fireworks.filter(fw => {
                    if (!fw.exploded) {
                        fw.y += fw.vy;
                        fw.vy += 0.2;
                        if (fw.vy >= 0 || fw.y <= fw.targetY) {
                            fw.exploded = true;
                            const colors = ['#ff4444', '#ffdd44', '#44ff44', '#44ffff', '#ff44ff', '#ffffff'];
                            const color = colors[Math.floor(Math.random() * colors.length)];
                            for (let i = 0; i < 45; i++) {
                                const angle = (Math.PI * 2 * i) / 45 + Math.random() * 0.3;
                                const speed = 2 + Math.random() * 5;
                                fw.particles.push({
                                    x: fw.x,
                                    y: fw.y,
                                    vx: Math.cos(angle) * speed,
                                    vy: Math.sin(angle) * speed,
                                    life: 1,
                                    color: color,
                                    size: 2 + Math.random() * 4
                                });
                            }
                        }
                    } else {
                        fw.particles = fw.particles.filter(p => {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.vy += 0.15;
                            p.vx *= 0.98;
                            p.life -= 0.012;
                            return p.life > 0;
                        });
                        if (fw.particles.length === 0) return false;
                    }
                    return true;
                });
            }

            function draw() {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                if (showGrid && gridCanvas) {
                    ctx.drawImage(gridCanvas, 0, 0);
                }

                drawFood();
                drawSnake();
                drawParticles();
                drawFloatingTexts();
                drawFireworks();
            }

            function drawFood() {
                const x = food.x * GRID_SIZE + GRID_SIZE / 2;
                const y = food.y * GRID_SIZE + GRID_SIZE / 2;

                if (!lastFoodPos || lastFoodPos.x !== food.x || lastFoodPos.y !== food.y) {
                    foodGradient = ctx.createRadialGradient(x, y, 0, x, y, GRID_SIZE / 2);
                    foodGradient.addColorStop(0, '#ffffff');
                    foodGradient.addColorStop(0.4, currentTheme.food);
                    foodGradient.addColorStop(1, currentTheme.foodDark);
                    lastFoodPos = { x: food.x, y: food.y };
                }

                ctx.shadowBlur = 15;
                ctx.shadowColor = currentTheme.food;
                ctx.fillStyle = foodGradient;
                ctx.beginPath();
                ctx.arc(x, y, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawSnake() {
                snake.forEach((segment, index) => {
                    const x = segment.x * GRID_SIZE + 1;
                    const y = segment.y * GRID_SIZE + 1;
                    const w = GRID_SIZE - 2;
                    const h = GRID_SIZE - 2;

                    if (index === 0) {
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = currentTheme.glow;
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    if (index === 0) {
                        ctx.fillStyle = currentTheme.snake;
                    } else {
                        ctx.fillStyle = snakeBodyColors[Math.min(index, snakeBodyColors.length - 1)];
                    }

                    ctx.beginPath();
                    const r = 5;
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    ctx.lineTo(x + r, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                    ctx.lineTo(x, y + r);
                    ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.closePath();
                    ctx.fill();

                    if (index === 0) {
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        const eo = 4, es = 3;
                        if (direction.x === 1) {
                            ctx.arc(x + w - eo, y + eo + 2, es, 0, Math.PI * 2);
                            ctx.arc(x + w - eo, y + h - eo - 2, es, 0, Math.PI * 2);
                        } else if (direction.x === -1) {
                            ctx.arc(x + eo, y + eo + 2, es, 0, Math.PI * 2);
                            ctx.arc(x + eo, y + h - eo - 2, es, 0, Math.PI * 2);
                        } else if (direction.y === 1) {
                            ctx.arc(x + eo + 2, y + h - eo, es, 0, Math.PI * 2);
                            ctx.arc(x + w - eo - 2, y + h - eo, es, 0, Math.PI * 2);
                        } else if (direction.y === -1) {
                            ctx.arc(x + eo + 2, y + eo, es, 0, Math.PI * 2);
                            ctx.arc(x + w - eo - 2, y + eo, es, 0, Math.PI * 2);
                        } else {
                            ctx.arc(x + w - eo, y + eo + 2, es, 0, Math.PI * 2);
                            ctx.arc(x + w - eo, y + h - eo - 2, es, 0, Math.PI * 2);
                        }
                        ctx.fill();
                    }
                });
                ctx.shadowBlur = 0;
            }

            function drawParticles() {
                particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(0.5, p.size * p.life), 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }

            function drawFloatingTexts() {
                floatingTexts.forEach(t => {
                    ctx.globalAlpha = t.life;
                    ctx.font = t.type === 'score' ? 'bold 22px Arial' : (t.type === 'damage' ? 'bold 20px Arial' : 'bold 18px Arial');
                    ctx.textAlign = 'center';
                    if (t.type === 'score') {
                        ctx.fillStyle = '#00ff88';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#00ff88';
                    } else if (t.type === 'damage') {
                        ctx.fillStyle = '#ff3333';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#ff3333';
                    } else {
                        ctx.fillStyle = '#ffd700';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#ffd700';
                    }
                    ctx.fillText(t.text, t.x, t.y);
                });
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            function drawFireworks() {
                fireworks.forEach(fw => {
                    if (!fw.exploded) {
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(fw.x, fw.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        fw.particles.forEach(p => {
                            ctx.globalAlpha = p.life;
                            ctx.fillStyle = p.color;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, Math.max(0.5, p.size * p.life), 0, Math.PI * 2);
                            ctx.fill();
                        });
                    }
                });
                ctx.globalAlpha = 1;
            }

            function hexToRgba(hex, alpha) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            function updateHpDisplay() {
                hpValueEl.textContent = `${hp}/${MAX_HP}`;
                const percent = (hp / MAX_HP) * 100;
                hpBarFill.style.width = percent + '%';
                if (percent > 60) {
                    hpBarFill.style.background = 'linear-gradient(90deg, #00cc6a, #00ff88, #66ffaa)';
                } else if (percent > 30) {
                    hpBarFill.style.background = 'linear-gradient(90deg, #ff8800, #ffaa00)';
                } else {
                    hpBarFill.style.background = 'linear-gradient(90deg, #cc0000, #ff0000)';
                }
            }

            function handleKeyDown(e) {
                const key = e.key;

                if (key === 'Escape') {
                    closeAllPanels();
                    return;
                }

                if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

                if (gameState === 'gameover') return;

                if (gameState === 'idle') {
                    if (key === 'Enter') {
                        playerName = playerNameInput.value.trim() || '匿名玩家';
                        nextDirection = { x: 1, y: 0 };
                        startGame();
                        return;
                    }
                    const mapped = keyMap[key];
                    if (mapped) {
                        e.preventDefault();
                        playerName = playerNameInput.value.trim() || '匿名玩家';
                        switch (mapped) {
                            case 'up': nextDirection = { x: 0, y: -1 }; break;
                            case 'down': nextDirection = { x: 0, y: 1 }; break;
                            case 'left': nextDirection = { x: -1, y: 0 }; break;
                            case 'right': nextDirection = { x: 1, y: 0 }; break;
                        }
                        startGame();
                    }
                    return;
                }

                if (gameState === 'playing') {
                    const mapped = keyMap[key];
                    if (mapped) {
                        switch (mapped) {
                            case 'up':
                                if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                                break;
                            case 'down':
                                if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                                break;
                            case 'left':
                                if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                                break;
                            case 'right':
                                if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                                break;
                        }
                    }
                }
            }

            function toggleSettings() {
                const isOpen = settingsPanel.classList.contains('open');
                if (isOpen) {
                    settingsPanel.classList.remove('open');
                    if (!leaderboardPanel.classList.contains('open')) {
                        modalOverlay.classList.remove('active');
                    }
                } else {
                    leaderboardPanel.classList.remove('open');
                    settingsPanel.classList.add('open');
                    modalOverlay.classList.add('active');
                }
            }

            function toggleLeaderboard() {
                const isOpen = leaderboardPanel.classList.contains('open');
                if (isOpen) {
                    leaderboardPanel.classList.remove('open');
                    if (!settingsPanel.classList.contains('open')) {
                        modalOverlay.classList.remove('active');
                    }
                } else {
                    settingsPanel.classList.remove('open');
                    leaderboardPanel.classList.add('open');
                    modalOverlay.classList.add('active');
                    renderLeaderboard();
                }
            }

            function closeAllPanels() {
                settingsPanel.classList.remove('open');
                leaderboardPanel.classList.remove('open');
                modalOverlay.classList.remove('active');
            }

            function updateSpeed() {
                gameSpeed = parseInt(speedSlider.value);
                speedValue.textContent = `${gameSpeed}/10`;
                tickInterval = getIntervalBySpeed(gameSpeed);
            }

            function toggleGrid() {
                showGrid = !showGrid;
                gridToggle.classList.toggle('active', showGrid);
            }

            function toggleParticles() {
                enableParticles = !enableParticles;
                particleToggle.classList.toggle('active', enableParticles);
            }

            function setTheme(themeName) {
                themeBtns.forEach(btn => btn.classList.remove('active'));
                const activeBtn = document.querySelector(`.theme-btn[data-theme="${themeName}"]`);
                if (activeBtn) activeBtn.classList.add('active');
                currentTheme = themes[themeName];

                document.documentElement.style.setProperty('--accent', currentTheme.snake);
                document.documentElement.style.setProperty('--accent-dark', currentTheme.snakeDark);
                document.documentElement.style.setProperty('--accent-glow', currentTheme.glow);

                lastFoodPos = null;
                rebuildSnakeStyleCache();
                draw();
            }

            settingsBtn.addEventListener('click', toggleSettings);
            closeSettingsBtn.addEventListener('click', toggleSettings);
            leaderboardBtn.addEventListener('click', toggleLeaderboard);
            closeLeaderboardBtn.addEventListener('click', toggleLeaderboard);
            modalOverlay.addEventListener('click', closeAllPanels);

            speedSlider.addEventListener('input', updateSpeed);
            gridToggle.addEventListener('click', toggleGrid);
            particleToggle.addEventListener('click', toggleParticles);
            themeBtns.forEach(btn => btn.addEventListener('click', () => setTheme(btn.dataset.theme)));

            restartBtn.addEventListener('click', resetGame);
            document.addEventListener('keydown', handleKeyDown);

            buildGridCache();
            rebuildSnakeStyleCache();
            initHighScore();
            renderLeaderboard();
            resetGame();
        })();
    </script>
</body>
</html>
