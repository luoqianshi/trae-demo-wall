<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Christmas | Final Ultimate</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; user-select: none; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; z-index: 1; }
        
        /* UI Layer - 暗色毛玻璃风格 */
        #ui-layer {
            position: absolute; bottom: 30px; left: 30px; z-index: 10000;
            display: flex; flex-direction: column; gap: 12px;
            pointer-events: none; transition: opacity 0.5s;
        }

        .control-row { display: flex; gap: 10px; align-items: center; pointer-events: auto; }

        .glass-panel {
            background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            color: rgba(255, 255, 255, 0.85);
            min-width: 320px;
            pointer-events: auto;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.25s;
            display: flex; align-items: center; justify-content: center;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(124, 92, 255, 0.5);
            color: #fff;
            box-shadow: 0 0 12px rgba(124, 92, 255, 0.3);
        }
        .glass-btn:active { transform: scale(0.95); }
        .glass-btn.active {
            background: rgba(124, 92, 255, 0.25);
            border-color: #7c5cff;
            color: #fff;
            box-shadow: 0 0 15px rgba(124, 92, 255, 0.5);
        }

        /* Player Controls */
        .player-controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; align-items: center; }
        .progress-container { width: 100%; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; cursor: pointer; position: relative; margin-bottom: 8px; }
        .progress-bar { height: 100%; background: #7c5cff; width: 0%; border-radius: 2px; box-shadow: 0 0 8px rgba(124, 92, 255, 0.6); pointer-events: none;}

        .song-info {
            font-size: 12px; color: rgba(255,255,255,0.9); margin-bottom: 10px;
            text-align: center; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; max-width: 320px;
        }

        /* Playlist Dropdown */
        #playlist-select {
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 10px;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 10px;
            font-family: monospace;
            font-size: 11px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        #playlist-select option { background: #0f0f19; color: #fff; }

        /* Volume Slider */
        .volume-container { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 10px; color: rgba(255,255,255,0.6); letter-spacing: 1px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #7c5cff; cursor: pointer; margin-top: -4px; box-shadow: 0 0 6px rgba(124, 92, 255, 0.5);}
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 3px; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 2px; }

        #file-input, #music-input { display: none; }

        /* 形态切换按钮栏 - 暗色毛玻璃胶囊 */
        #form-switcher {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 10000; pointer-events: auto;
            background: rgba(15, 15, 25, 0.6);
            padding: 6px 10px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: opacity 0.5s;
        }
        #form-switcher .form-btn {
            padding: 6px 14px; border-radius: 18px; cursor: pointer;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7); font-size: 12px; transition: all 0.25s;
            white-space: nowrap; letter-spacing: 0.5px;
        }
        #form-switcher .form-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-color: rgba(124, 92, 255, 0.5);
        }
        #form-switcher .form-btn.active {
            background: rgba(124, 92, 255, 0.25);
            border-color: #7c5cff; color: #fff;
            box-shadow: 0 0 12px rgba(124, 92, 255, 0.4);
        }

        /* Hand Camera - 暗色风格 */
        #hand-interface {
            position: absolute; bottom: 30px; right: 30px; width: 220px; height: 165px;
            border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.6); z-index: 10000;
            pointer-events: auto; transition: opacity 0.5s;
            backdrop-filter: blur(10px);
        }
        #webcam, #output_canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); }
        #webcam { opacity: 0.2; object-fit: cover; }

        #status-text {
            position: absolute; top: 30px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.5); letter-spacing: 3px;
            font-size: 12px; pointer-events: none; z-index: 10; text-shadow: 0 0 10px #000;
            transition: opacity 0.5s;
        }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 20000; display: flex; justify-content: center; align-items: center;
            color: rgba(255, 255, 255, 0.7); letter-spacing: 5px; font-size: 14px;
        }
    </style>

        {
            "imports": {

</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">

            <div id="time-display" style="font-size:11px; opacity:0.7; text-align:right; margin-top:2px; font-family:monospace;">0:00 / 0:00</div>

            <div class="player-controls">
                <div class="glass-btn" id="music-prev">⏮</div>

    <!-- Diff2.4新增：形态切换按钮栏 (2025-12-14) -->
    <div id="form-switcher">
        <div class="form-btn active" data-mode="TREE">🌲 树</div>
        <div class="form-btn" data-mode="SCATTER">✨ 星旋</div>

    <!-- SHADER: Particle with Brightness Boost -->
    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size;
        attribute float opacityAttr;
        attribute float twinkleSpeed;
        attribute float twinkleOffset;
        attribute vec3 customColor;
        
        varying vec3 vColor;
        varying float vAlpha;
        
        uniform float uTime;
        uniform float uScale;

        void main() {
            vColor = customColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            
            float blink = sin(uTime * twinkleSpeed + twinkleOffset);
            float brightness = pow(0.5 * blink + 0.5, 3.0); 
            float sizeVar = 1.0 + 0.5 * brightness;
            
            gl_PointSize = size * sizeVar * uScale * (500.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
            
            vAlpha = opacityAttr * (0.6 + 0.4 * brightness);
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
        uniform sampler2D pointTexture;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
            vec4 texColor = texture2D(pointTexture, gl_PointCoord);
            if (texColor.a < 0.1) discard;
            gl_FragColor = vec4(vColor * 2.0, vAlpha * texColor.a);
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

// --- AUDIO CONTROLLER (完整最终修复版) ---
        class AudioController {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.ctx.createAnalyser();
                this.analyser.fftSize = 1024; 
                this.analyser.smoothingTimeConstant = 0.85;
                // 新增低平滑analyser(用于高潮检测，保留瞬变)
                this.analyserRaw = this.ctx.createAnalyser();
                this.analyserRaw.fftSize = 1024;
                this.analyserRaw.smoothingTimeConstant = 0.1;
                this.dataArrayRaw = new Uint8Array(this.analyserRaw.frequencyBinCount); 
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                
                this.gainNode = this.ctx.createGain();
                this.gainNode.gain.value = 0.8;
                this.gainNode.connect(this.ctx.destination);

                this.micSource = null;
                
                // --- 初始化播放器 (只创建一次，永不销毁) ---
                this.audioElement = new Audio();
                this.audioElement.crossOrigin = "anonymous";
                this.fileSource = this.ctx.createMediaElementSource(this.audioElement);
                
                // 默认连接好线路: Source -> Analyser -> Gain -> Speaker
                this.fileSource.connect(this.analyser);
                this.fileSource.connect(this.analyserRaw);
                this.analyser.connect(this.gainNode);
                
                this.mode = 'NONE'; 
                this.playlist = [];
                this.currentIndex = 0;
                
                this.bassEnergy = 0;
                this.bassSmoothed = 0;  // 平滑后的bass能量(用于动画驱动)
                this.bassPeak = 0;       // bass峰值(用于显示)
                this.volume = 0;
                this.isKick = false;
                this.lastKickTime = 0;   // 上次鼓点触发时间(用于冷却)
                this.prevMelBands = null; // 上一帧梅尔频段(用于峰值检测)
                
                // P1新增：循环模式与防抖 (2025-12-14)
                this.repeatMode = 'LIST';   // LIST(列表循环) / ONE(单曲循环) / SHUFFLE(随机)
                this._playToken = 0;       // 防抖令牌：快速切歌时旧请求作废
                
                // 播放结束处理：根据循环模式决定下一首 (2025-12-14 P1)
                this.audioElement.addEventListener('ended', () => {
                    if(this.repeatMode === 'ONE') {
                        this.audioElement.currentTime = 0;
                        this.audioElement.play();
                    } else if(this.repeatMode === 'SHUFFLE' && this.playlist.length > 1) {
                        let r;
                        do { r = Math.floor(Math.random() * this.playlist.length); } while(r === this.currentIndex);
                        this.playSong(r);
                    } else {
                        this.next();
                    }
                });
                this.audioElement.addEventListener('timeupdate', () => this.updateProgress());
                // 音频错误监听：文件损坏/格式不支持时提示用户，避免静默失败 (2025-12-14 修复Bug8)
                this.audioElement.addEventListener('error', () => {
                    console.error("Audio Error:", this.audioElement.error);
                    document.getElementById('song-name').innerText = "⚠ Playback Error (File Corrupted or Unsupported)";
                    document.getElementById('play-btn').innerText = "▶";
                });
            }

            toggleMic() {
                const btn = document.getElementById('mic-toggle');
                
                if (this.mode === 'MIC') {
                    // --- 关掉麦克风 ---
                    if(this.micSource) {
                        this.micSource.disconnect();
                    }
                    
                    // 恢复音乐连接
                    try {
                        this.fileSource.connect(this.analyser);
                this.fileSource.connect(this.analyserRaw);
                    } catch(e) {
                        // 忽略重复连接错误
                    }
                    
                    this.mode = 'FILE';
                    btn.classList.remove('active');
                    btn.innerText = "🎤 MIC INPUT";
                    document.getElementById('song-name').innerText = "Mic Stopped";
                    
                } else {
                    // --- 打开麦克风 (2025-12-14 修复Bug1：先请求权限，成功后再切换状态，避免权限被拒时状态不一致) ---
                    document.getElementById('song-name').innerText = "Requesting Mic Permission...";
                    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                        // 权限通过，开始切换到麦克风模式
                        this.ctx.resume();
                        this.audioElement.pause();
                        document.getElementById('play-btn').innerText = "▶";
                        // 暂时断开音乐，防止干扰
                        try { this.fileSource.disconnect(); } catch(e) {}
                        
                        this.micSource = this.ctx.createMediaStreamSource(stream);
                        this.micSource.connect(this.analyser);
                        // 麦克风只连分析器，不连扬声器(GainNode)，防止啸叫
                        
                        this.mode = 'MIC';
                        btn.classList.add('active');
                        btn.innerText = "🎤 LISTENING...";
                        document.getElementById('song-name').innerText = "Microphone Active";
                    }).catch(err => {
                        // 权限被拒/失败：恢复音乐连接，状态保持FILE，UI完整回滚
                        console.error("Mic Error:", err);
                        try { this.fileSource.connect(this.analyser);
                this.fileSource.connect(this.analyserRaw); } catch(e) {}
                        this.mode = 'FILE';
                        btn.classList.remove('active');
                        btn.innerText = "🎤 MIC INPUT";
                        document.getElementById('song-name').innerText = "⚠ Mic Denied (Check Browser Permission)";
                    });
                }
            }

            loadFiles(files) {
                this.ctx.resume();
                const newFiles = Array.from(files).map(f => ({
                    name: f.name,
                    url: URL.createObjectURL(f)
                }));
                
                if (newFiles.length > 0) {
                    const wasEmpty = this.playlist.length === 0;
                    this.playlist.push(...newFiles);
                    this.updatePlaylistUI();
                    
                    if(wasEmpty) this.playSong(0);
                    else document.getElementById('song-name').innerText = `Added ${newFiles.length} songs...`;
                }
            }

            updatePlaylistUI() {
                const select = document.getElementById('playlist-select');
                if(!select) return;
                select.innerHTML = ''; 
                
                this.playlist.forEach((song, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.text = `${index + 1}. ${song.name}`;
                    if (index === this.currentIndex) opt.selected = true;
                    select.appendChild(opt);
                });
            }

            playSong(index) {
                if(this.playlist.length === 0) return;
                
                // 确保音频上下文已恢复，避免通过下拉框切歌时无声音 (2025-12-14 修复Bug4)
                this.ctx.resume();
                
                // 如果是麦克风模式，先自动关掉
                if(this.mode === 'MIC') {
                    this.toggleMic(); 
                }
                
                this.mode = 'FILE';
                if(index < 0) index = this.playlist.length - 1;
                if(index >= this.playlist.length) index = 0;
                this.currentIndex = index;

                const song = this.playlist[index];
                document.getElementById('song-name').innerText = `Playing: ${song.name}`;
                
                // 核心修复：只换源，不断线
                this.audioElement.src = song.url;
                this.audioElement.load();
                
                // P1防抖：令牌机制，快速切歌时旧play()的promise被忽略 (2025-12-14)
                const myToken = ++this._playToken;
                this.audioElement.play().then(() => {
                    if(myToken !== this._playToken) return; // 已被后续切歌作废，丢弃
                    document.getElementById('play-btn').innerText = "⏸";
                    this.updatePlaylistUI();
                }).catch(e => {
                    if(myToken !== this._playToken) return; // 已作废的错误也忽略
                    // 播放失败：回滚UI状态，避免显示"假播放" (2025-12-14 修复Bug2)
                    // AbortError是快速切歌的正常现象，不提示用户
                    if(e.name !== 'AbortError') {
                        console.error("Play Error:", e);
                        document.getElementById('play-btn').innerText = "▶";
                        document.getElementById('song-name').innerText = `⚠ Failed: ${song.name}`;
                    }
                });
            }

            // P1新增：切换循环模式 LIST→ONE→SHUFFLE→LIST (2025-12-14)
            toggleRepeat() {
                const order = ['LIST', 'ONE', 'SHUFFLE'];
                const idx = order.indexOf(this.repeatMode);
                this.repeatMode = order[(idx + 1) % order.length];
                const btn = document.getElementById('repeat-btn');
                if(btn) {
                    const icons = { LIST: '🔁', ONE: '🔂', SHUFFLE: '🎲' };
                    btn.innerText = icons[this.repeatMode];
                    btn.title = `Mode: ${this.repeatMode}`;
                }
            }

            // P1新增：删除当前播放的歌曲 (2025-12-14)
            removeCurrentSong() {
                if(this.playlist.length === 0) return;
                const removed = this.playlist[this.currentIndex];
                if(removed && removed.url) URL.revokeObjectURL(removed.url); // 释放blob内存
                this.playlist.splice(this.currentIndex, 1);
                if(this.playlist.length === 0) {
                    this.audioElement.pause();
                    this.audioElement.removeAttribute('src');
                    this.audioElement.load();
                    document.getElementById('play-btn').innerText = "▶";
                    document.getElementById('song-name').innerText = "No Music Loaded";
                    this.currentIndex = 0;
                } else {
                    if(this.currentIndex >= this.playlist.length) this.currentIndex = 0;
                    this.playSong(this.currentIndex);
                }
                this.updatePlaylistUI();
            }

            togglePlay() {
                if(this.mode === 'MIC') {
                    // 如果在麦克风模式下点播放，直接切回音乐
                    this.playSong(this.currentIndex);
                    return;
                }
                // 空播放列表时给用户明确提示，而非静默返回 (2025-12-14 修复Bug3)
                if(this.playlist.length === 0) {
                    document.getElementById('song-name').innerText = "⚠ No Songs — Click ADD SONGS to Load Music";
                    return;
                }
                
                this.ctx.resume();
                if(this.audioElement.paused) {
                    this.audioElement.play();
                    document.getElementById('play-btn').innerText = "⏸";
                } else {
                    this.audioElement.pause();
                    document.getElementById('play-btn').innerText = "▶";
                }
            }

            next() { 
                // 随机模式下next也走随机 (2025-12-14 P1)
                if(this.repeatMode === 'SHUFFLE' && this.playlist.length > 1) {
                    let r; do { r = Math.floor(Math.random() * this.playlist.length); } while(r === this.currentIndex);
                    this.playSong(r);
                } else {
                    this.playSong(this.currentIndex + 1); 
                }
            }
            prev() { this.playSong(this.currentIndex - 1); }

            seek(percent) {
                if(this.audioElement.duration) this.audioElement.currentTime = percent * this.audioElement.duration;
            }

            setVolume(val) {
                this.gainNode.gain.value = val;
            }

            // 格式化时间 75秒 → "1:15" (2025-12-14 P1)
            _fmtTime(sec) {
                if(!isFinite(sec) || sec < 0) return "0:00";
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            updateProgress() {
                if(this.audioElement.duration) {
                    const pct = (this.audioElement.currentTime / this.audioElement.duration) * 100;
                    document.getElementById('progress-bar').style.width = `${pct}%`;
                    // P1新增：显示当前时间/总时长 (2025-12-14)
                    const timeEl = document.getElementById('time-display');
                    if(timeEl) {
                        timeEl.innerText = `${this._fmtTime(this.audioElement.currentTime)} / ${this._fmtTime(this.audioElement.duration)}`;
                    }
                }
            }

            update() {
                this.analyser.getByteFrequencyData(this.dataArray);
                // 修复：同时更新raw数据，供梅尔频谱分析使用
                if (this.analyserRaw) {
                    this.analyserRaw.getByteFrequencyData(this.dataArrayRaw);
                }
                let sum = 0; let bass = 0;
                for(let i=0; i<128; i++) {
                    sum += this.dataArray[i];
                    if(i < 10) bass += this.dataArray[i];
                }
                this.volume = sum / 128;
                this.bassEnergy = bass / 10;
                this.bassSmoothed = this.bassSmoothed * 0.6 + this.bassEnergy * 0.4;
                this.bassPeak *= 0.9;
            }
            
            // 方案A鼓点检测：逐频段检测峰值，任意频段突增即触发
            // 参数：melBands-当前帧梅尔频段，返回是否触发鼓点
            detectKick(melBands) {
                const now = performance.now();
                const KICK_COOLDOWN = 200;   // 冷却时间ms
                if (now - this.lastKickTime < KICK_COOLDOWN) return false;
                // 首帧初始化prevMelBands
                if (!this.prevMelBands || this.prevMelBands.length !== melBands.length) {
                    this.prevMelBands = new Float32Array(melBands.length);
                    for (let i = 0; i < melBands.length; i++) this.prevMelBands[i] = melBands[i];
                    return false;
                }
                const PEAK_RATIO = 1.3;      // 当前是上一帧的1.3倍视为突增
                const PEAK_MIN_ENERGY = 5;   // 最低能量门槛(过滤噪点)
                let kickBand = -1;
                // 逐频段检测峰值
                for (let i = 0; i < melBands.length; i++) {
                    const cur = melBands[i];
                    const prev = this.prevMelBands[i];
                    if (cur > PEAK_MIN_ENERGY && prev > 0.1 && cur > prev * PEAK_RATIO) {
                        kickBand = i;
                        break;
                    }
                }
                // 保存当前帧作为下一帧的prev
                for (let i = 0; i < melBands.length; i++) this.prevMelBands[i] = melBands[i];
                if (kickBand >= 0) {
                    this.isKick = true;
                    this.lastKickTime = now;
                    this.bassPeak = this.bassSmoothed;
                    setTimeout(() => this.isKick = false, 80);
                    return true;
                }
                return false;
            }

            getFreq(index) {
                const bin = Math.floor((index / 200) * 64);
                return this.dataArray[bin % 128];
            }
        }

        // ==================== 模块1：梅尔频谱分析器 ==================== (2025-12-14)
        class MelSpectrumAnalyzer {
            constructor(sampleRate, fftSize) {
                this.sampleRate = sampleRate;
                this.fftSize = fftSize;
                this.binCount = fftSize / 2;
                this.numMelBands = 26;
                this.melFilters = this._createMelFilters();
                this.melBands = new Float32Array(this.numMelBands);
                this.prevMelBands = new Float32Array(this.numMelBands);
            }
            _hzToMel(hz) { return 2595 * Math.log10(1 + hz / 700); }
            _melToHz(mel) { return 700 * (Math.pow(10, mel / 2595) - 1); }
            _createMelFilters() {
                const lowFreq = 20, highFreq = this.sampleRate / 2;
                const lowMel = this._hzToMel(lowFreq), highMel = this._hzToMel(highFreq);
                const melCenters = [];
                for (let i = 0; i <= this.numMelBands + 1; i++) {
                    melCenters[i] = lowMel + (highMel - lowMel) * i / (this.numMelBands + 1);
                }
                const filters = [];
                for (let i = 0; i < this.numMelBands; i++) {
                    const filter = { startBin: 0, endBin: 0, coeffs: [] };
                    const startMel = melCenters[i], centerMel = melCenters[i + 1], endMel = melCenters[i + 2];
                    for (let bin = 0; bin < this.binCount; bin++) {
                        const hz = bin * this.sampleRate / this.fftSize;
                        const mel = this._hzToMel(hz);
                        let weight = 0;
                        if (mel >= startMel && mel <= centerMel) weight = (mel - startMel) / (centerMel - startMel);
                        else if (mel > centerMel && mel <= endMel) weight = (endMel - mel) / (endMel - centerMel);
                        if (weight > 0) {
                            filter.coeffs.push({ bin, weight });
                            if (filter.startBin === 0) filter.startBin = bin;
                            filter.endBin = bin;
                        }
                    }
                    filters.push(filter);
                }
                return filters;
            }
            update(dataArray) {
                for (let i = 0; i < this.numMelBands; i++) this.prevMelBands[i] = this.melBands[i];
                for (let i = 0; i < this.numMelBands; i++) {
                    let energy = 0;
                    const filter = this.melFilters[i];
                    for (let j = 0; j < filter.coeffs.length; j++) {
                        const { bin, weight } = filter.coeffs[j];
                        energy += dataArray[bin] * dataArray[bin] * weight;
                    }
                    this.melBands[i] = Math.sqrt(energy);
                }
                return this.melBands;
            }
            getSpectralCentroid() {
                let weightedSum = 0, totalEnergy = 0;
                for (let i = 0; i < this.numMelBands; i++) { weightedSum += i * this.melBands[i]; totalEnergy += this.melBands[i]; }
                return totalEnergy > 0 ? weightedSum / totalEnergy : 0;
            }
        }

        // Diff15.0: ChorusDetector高潮检测器 (2025-12-14)
        // 三特征融合：频谱通量SF + 频谱质心SC + 频谱滚降SR
        // 滑动窗口8秒，三重防护判定避免误触发
        class ChorusDetector {
            constructor(numBands = 26) {
                this.numBands = numBands;
                this.prevBands = new Float32Array(numBands);
                this.sfThreshold = 1.8;     // SF比值阈值(当前/平均>1.8)
                this.scThreshold = 1.2;     // SC比值阈值(当前/平均>1.2)
                this.minDuration = 0.4;    // 最小持续时长(秒)
                this.cooldown = 4.0;       // 冷却时间(秒)
                this.windowSize = 8.0;     // 滑动窗口大小(秒)
                this.isChorus = false;     // 当前是否高潮
                this.sfRatio = 1.0;        // 当前SF比值(调试用)
                this.scRatio = 1.0;        // 当前SC比值(调试用)
                this.chorusTimer = 0;      // 高潮持续计时器
                this.cooldownTimer = 0;    // 冷却计时器
                this.sfHistory = [];       // SF历史(滑动窗口)
                this.scHistory = [];       // SC历史(滑动窗口)
            }
            // 频谱通量：正差分之和(能量增加量)
            _calcSpectralFlux(bands) {
                let flux = 0;
                for (let i = 0; i < this.numBands; i++) {
                    const diff = bands[i] - this.prevBands[i];
                    if (diff > 0) flux += diff;
                }
                return flux;
            }
            // 频谱质心：加权频率平均(能量重心位置)
            _calcSpectralCentroid(bands) {
                let weightedSum = 0, totalEnergy = 0;
                for (let i = 0; i < this.numBands; i++) {
                    weightedSum += i * bands[i];
                    totalEnergy += bands[i];
                }
                return totalEnergy > 0 ? weightedSum / totalEnergy : 0;
            }
            update(bands, time, dt) {
                // 计算三特征
                const sf = this._calcSpectralFlux(bands);
                const sc = this._calcSpectralCentroid(bands);
                // 更新历史(滑动窗口)
                this.sfHistory.push(sf);
                this.scHistory.push(sc);
                if (this.sfHistory.length > this.windowSize / dt) this.sfHistory.shift();
                if (this.scHistory.length > this.windowSize / dt) this.scHistory.shift();
                // 计算平均值
                let sfAvg = 0;
                for (const v of this.sfHistory) sfAvg += v;
                sfAvg = sfAvg / (this.sfHistory.length || 1) + 0.001;
                let scAvg = 0;
                for (const v of this.scHistory) scAvg += v;
                scAvg = scAvg / (this.scHistory.length || 1) + 0.001;
                // 计算比值
                this.sfRatio = sf / sfAvg;
                this.scRatio = sc / scAvg;
                // 冷却计时
                if (this.cooldownTimer > 0) this.cooldownTimer -= dt;
                // 三特征融合判定
                const sfTriggered = this.sfRatio > this.sfThreshold;
                const scTriggered = this.scRatio > this.scThreshold;
                if (sfTriggered && scTriggered && this.cooldownTimer <= 0) {
                    this.chorusTimer += dt;
                    if (this.chorusTimer >= this.minDuration && !this.isChorus) {
                        this.isChorus = true;
                    }
                } else {
                    this.chorusTimer = Math.max(0, this.chorusTimer - dt);
                    if (this.chorusTimer <= 0) {
                        if (this.isChorus) {
                            this.isChorus = false;
                            this.cooldownTimer = this.cooldown;  // 进入冷却
                        }
                    }
                }
                // 保存当前频谱供下帧计算通量
                for (let i = 0; i < this.numBands; i++) this.prevBands[i] = bands[i];
            }
        }

                const t = Math.pow(Math.random(), 1.2); // 1.2(比1.5更均匀分布)

                const spiralAngle = (gr/maxR)*spin*Math.PI;
                const spreadWidth = 1.0 + (gr/maxR) * 4.0; // 4.0(比3.0更宽)
                const randomOffset = (Math.random()-0.5) * spreadWidth;
                const ga = armOffset + spiralAngle + randomOffset;
                const dip = -20 * Math.exp(-(gr-minR)/30);

            p.currentPos.copy(p.tTree);
            // Diff7.0: 心形改用隐函数体填充(实心立体心)，参考星空圣诞树.html (2025-12-14)
            // 隐函数：(x²+2.25z²+y²-1)³ - x²y³ < 0 内部全部填充粒子
            let hx, hy, hz;

            // Diff10.0: 星球+3星环(大小相间+厚度+由密到疏+交叉倾角) (2025-12-14)

            } else {
                // 45%粒子作为星环：3个环大小相间，由密到疏
                const rr = Math.random(); const ringIndex = rr < 0.5 ? 0 : (rr < 0.8 ? 1 : 2);  // 0/1/2
                const ringRadii = [100, 150, 200];      // 3环半径(大小相间)
                const ringTilts = [0, Math.PI/4, Math.PI/2];  // 倾角0/45/90度
                const ringThickness = [5, 10, 15];      // 厚度(外环更厚)
                const ringBaseRadius = ringRadii[ringIndex];
                const ringTilt = ringTilts[ringIndex];
                const thickness = ringThickness[ringIndex];
                // 由密到疏：内环密，外环疏(Math.pow集中内侧)
                const densityT = Math.pow(Math.random(), 1.5);
                const ringRadius = ringBaseRadius - 15 + densityT * 30;  // 环宽±15，内侧密
                const ringAngle = Math.random() * Math.PI * 2;

        // Diff4.2新增：应用形态色系，设置每个粒子的targetColor (2025-12-14)

        function addPhoto(tex) {

        // --- 3D心形粒子波纹效果 (Diff9.6: 复用现有粒子做波纹) ---

        const starRainY = [];                 // 当前Y位置
        const starRainZ = [];                 // 当前Z位置
        const starRainVX = [];                // X速度(水平，斜向落)
        const starRainVY = [];                // Y速度(下落)
        const starRainVZ = [];                // Z速度
        const starRainAlpha = [];             // 透明度(0-1，用于淡入淡出)

        // 初始化：从未被选为波纹粒子的粒子中选取400个作为星雨粒子
        {

        // 粒子索引→星雨索引映射表(O(1)查找)

        // ==================== 模块4：流星爆发(MeteorBurst) ==================== (2025-12-14)

        const METEOR_COUNT = 24;              // 流星数量

        // 流星粒子从剩余粒子中抽调(排除波纹粒子和星雨粒子)

        // 触发流星爆发(高潮开始时调用)
        function triggerMeteorBurst() {
            // 找出当前最强的梅尔带(决定流星颜色)
            let maxBand = 0, maxEnergy = 0;
            if (melAnalyzer) {
                for (let b = 0; b < melAnalyzer.numMelBands; b++) {

                        maxEnergy = melAnalyzer.melBands[b];
                        maxBand = b;
                    }
                }

            // 最强频带对应色相(0-25映射到0-1色相)
            const meteorHue = maxBand / 26;
            // 发射24颗流星(向四周均匀分布)
            for (let mi = 0; mi < METEOR_COUNT; mi++) {
                if (!meteorActive[mi]) {
                    meteorActive[mi] = true;
                    // 球面均匀分布方向(黄金角算法)
                    const phi = Math.acos(1 - 2 * (mi + 0.5) / METEOR_COUNT);
                    const theta = Math.PI * (1 + Math.sqrt(5)) * mi;
                    const speed = 150 + Math.random() * 50;
                    meteorVel[mi].set(
                        Math.sin(phi) * Math.cos(theta) * speed,
                        Math.cos(phi) * speed,
                        Math.sin(phi) * Math.sin(theta) * speed
                    );

                    const idx = meteorIndices[mi];
                    particleData[idx].currentPos.set(0, 0, 0);
                    // 颜色取自最强频带色相
                    particleData[idx].color.setHSL(meteorHue, 0.9, 0.6);
                    meteorLife[mi] = meteorMaxLife;
                }
            }
        }
        // 记录上一次高潮状态(用于检测高潮开始瞬间)
        let prevIsChorus = false;

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        const dummy = new THREE.Object3D();
        const vTmp = new THREE.Vector3();
        
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const time = clock.getElapsedTime();
            
            audioCtrl.update();
            if (bgStarMat) bgStarMat.uniforms.uTime.value = time;
            
            // 延迟初始化梅尔频谱分析器和高潮检测器(等待audioCtrl.ctx就绪) (2025-12-14)
            if (!melAnalyzer && audioCtrl.ctx) {
                melAnalyzer = new MelSpectrumAnalyzer(audioCtrl.ctx.sampleRate, 1024);
            }
            if (!chorusDetector && melAnalyzer) {
                chorusDetector = new ChorusDetector(melAnalyzer.numMelBands);
            }
            // 每帧更新梅尔频谱并检测鼓点(方案A)
            let isKickDetected = false;
            let isChorusActive = false;
            if (melAnalyzer && audioCtrl.dataArrayRaw) {
                melAnalyzer.update(audioCtrl.dataArrayRaw);
                isKickDetected = audioCtrl.detectKick(melAnalyzer.melBands);
                // 更新高潮检测
                if (chorusDetector) {
                    chorusDetector.update(melAnalyzer.melBands, time, dt);
                    isChorusActive = chorusDetector.isChorus;
                }
            }

            if (state.mode !== state.targetMode) {
                state.mode = state.targetMode;
                state.animPhase = 'EXPLODE'; state.animTimer = 0;
                particleData.forEach(p => {
                    const r = 200 + Math.random()*400; const th=Math.random()*Math.PI*2; const ph=Math.acos(2*Math.random()-1);
                    p.tExplode.set(r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph));
                });
                applyTheme(state.mode);  // Diff4.2: 形态切换时应用新色系
            }

            const isTree = (state.mode === 'TREE');
            // Diff2.2新增：4形态判断 (2025-12-14)
            const isHeart = (state.mode === 'HEART');
            const isMountain = (state.mode === 'MOUNTAINS');

            if(isTree) {
                state.rotVelocity = 0;
                const spd = 0.2 * dt;
                [meshSphere, meshBox, meshTetra, photoGroup].forEach(m => m.rotation.y += spd);
            } else {
                state.rotVelocity *= 0.95;
                state.rotVelocity = Math.max(-1.5, Math.min(1.5, state.rotVelocity));
                const spd = (0.02 + state.rotVelocity) * dt;
                [meshSphere, meshBox, meshTetra].forEach(m => m.rotation.y += spd);
                photoGroup.rotation.y = meshSphere.rotation.y;
            }

            starMesh.rotation.y = time;
            starMesh.position.lerp(vTmp.set(0, isTree ? CONFIG.treeHeight + 1.5 : 0, 0), 0.1);
            // Diff2.6修改：树顶星星只在TREE形态显示，其他形态(含HEART/MOUNTAINS)隐藏 (2025-12-14)
            starMesh.scale.setScalar(THREE.MathUtils.lerp(starMesh.scale.x, isTree?1.0:0.01, 0.1));
            
            // Diff2.6新增：同步形态切换按钮高亮状态 (2025-12-14)
            if (typeof updateFormSwitcher === 'function') updateFormSwitcher();

            // Diff8.0: 星爆状态转换逻辑移到for循环外(参考星空圣诞树) (2025-12-14)
            if (state.animPhase === 'EXPLODE') {
                state.animTimer += dt;
                if (state.animTimer > 0.4) { state.animPhase = 'CONVERGE'; state.lerpSpeed = 0.001; }
            } else if (state.animPhase === 'CONVERGE') {
                state.lerpSpeed *= 1.05;
                if (state.lerpSpeed > 0.3) { state.lerpSpeed = 0.3; state.animPhase = 'IDLE'; }
            } else {
                state.lerpSpeed = 2.0 * dt;
            }
            
            // Diff9.18: 心跳改为鼓点脉冲驱动(快速膨胀+缓慢收缩) (2025-12-14)
            // 鼓点来时pulse=1.0 → scale=1.15(快速膨胀)
            // 鼓点后pulse每帧×0.92 → 0.92,0.85,0.78...(缓慢收缩)
            // 鼓点间隙pulse趋近0 → scale≈1.0(静止)
            const heartVolume = audioCtrl.volume || 0;
            const heartBass = audioCtrl.bassSmoothed || 0;
            const bassNorm = Math.min(heartBass / 255, 1);  // 归一化0~1
            // 脉冲衰减(每帧×0.92，约200ms从1.0衰减到0.1)
            heartKickPulse *= 0.92;
            // 脉冲幅度随bass增强(低音越强膨胀越大)
            const pulseAmp = 0.08 + bassNorm * 0.07;  // 0.08~0.15
            const heartBeatScale = 1.0 + heartKickPulse * pulseAmp;
            const heartEnergy = Math.min(heartVolume * 0.01, 1);
            const heartColorTarget = new THREE.Color().setHSL(0.05 + heartEnergy * 0.1, 0.8, 0.5 + heartEnergy * 0.3);
            // 高频能量预计算
            let heartHighFreqEnergy = 0;
            if (isHeart && melAnalyzer) {
                for (let b = 18; b < 26; b++) heartHighFreqEnergy += melAnalyzer.melBands[b];
                heartHighFreqEnergy /= 8;
            }
            // Diff9.14: 鼓点触发波纹-每次随机选表面粒子向外辐射 (2025-12-14)
            // 每次鼓点重新随机选200个心形表面粒子，向外辐射后消失
            if (isHeart && isKickDetected) {
                // Diff9.19: 心跳膨胀独立冷却(300ms=一秒3次，防抖) (2025-12-14)
                // 波纹粒子每次鼓点都触发(200ms冷却)，但心跳膨胀限制300ms一次
                const nowMs = performance.now();
                if (nowMs - lastHeartKickTime >= 300) {
                    heartKickPulse = 1.0;  // 重置脉冲=膨胀到最大
                    lastHeartKickTime = nowMs;
                }
                for (let ri = 0; ri < RIPPLE_PARTICLE_COUNT; ri++) {
                    if (rippleLives[ri] <= 0) {
                        // 随机选一个心形粒子(从所有粒子中随机选)
                        const idx = Math.floor(Math.random() * CONFIG.count);
                        rippleParticleIndices[ri] = idx;  // 记录本次选中的粒子
                        const hp = particleData[idx];
                        if (hp && hp.tHeart) {
                            // 从心形视觉重心(0,25,0)到粒子的方向(向外辐射)
                            const dx = hp.tHeart.x - 0;
                            const dy = hp.tHeart.y - 25;
                            const dz = hp.tHeart.z - 0;
                            const len = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
                            // 随机速度(向外辐射)
                            const speed = 25 + Math.random() * 25;
                            rippleVelocities[ri].set(dx/len*speed, dy/len*speed, dz/len*speed);
                            rippleLives[ri] = 0.6 + Math.random() * 0.2;
                        }
                    }
                }
            }
            // 更新波纹粒子生命(在循环外)
            for (let ri = 0; ri < RIPPLE_PARTICLE_COUNT; ri++) {
                if (rippleLives[ri] > 0) rippleLives[ri] -= dt;
            }

            // Diff13.3: 高潮检测调试日志(每500ms输出) (2025-12-14)
            // 用于确认高潮是否触发以及流星爆发时机
            if (!window._lastChorusLog) window._lastChorusLog = 0;
            if (performance.now() - window._lastChorusLog > 500) {
                window._lastChorusLog = performance.now();
                if (chorusDetector) {
                    console.log('[高潮调试]', {
                        isChorus: chorusDetector.isChorus,
                        sfRatio: chorusDetector.sfRatio + 'x',
                        scRatio: chorusDetector.scRatio + 'x',
                        willTriggerMeteor: isChorusActive && !prevIsChorus
                    });
                }
            }

            // Diff13.0: 高潮开始瞬间触发流星爆发 (2025-12-14)
            // 检测isChorusActive从false→true的上升沿(高潮刚开始)
            if (isChorusActive && !prevIsChorus) {
                triggerMeteorBurst();
            }
            prevIsChorus = isChorusActive;
            // 更新流星生命(递减)
            for (let mi = 0; mi < METEOR_COUNT; mi++) {
                if (meteorActive[mi]) {
                    meteorLife[mi] -= dt;
                    if (meteorLife[mi] <= 0) meteorActive[mi] = false;
                }
            }

            // Diff14.0: 星雨生命周期更新(显现→砸落→落地消失→返回) (2025-12-14)
            // 独立于形态，所有形态下都运行
            // 高潮时缩短等待时间(星雨更密集)
            const starRainWaitMultiplier = isChorusActive ? 0.2 : 1.0;  // 高潮时等待时间×0.2
            for (let si = 0; si < STAR_RAIN_COUNT; si++) {
                const phase = starRainPhase[si];
                if (phase === 0) {
                    // 阶段0：等待(倒计时)
                    starRainTimer[si] += dt;
                    if (starRainTimer[si] >= starRainWaitTime[si] * starRainWaitMultiplier) {
                        // 进入显现阶段：在高处随机位置出现
                        starRainPhase[si] = 1;
                        starRainTimer[si] = 0;
                        // 高处随机位置(xz范围调小避免横向飞，y调高明显从高处落)
                        starRainX[si] = (Math.random() - 0.5) * 400;
                        starRainZ[si] = (Math.random() - 0.5) * 400;
                        starRainY[si] = 800 + Math.random() * 200;  // 800-1000高处
                        // 斜向落速度(主要垂直下落，水平速度小)
                        starRainVX[si] = (Math.random() - 0.5) * 20;   // 水平X速度调小
                        starRainVY[si] = -(80 + Math.random() * 70);  // 下落速度调慢
                        starRainVZ[si] = (Math.random() - 0.5) * 20;  // 水平Z速度调小
                        starRainAlpha[si] = 0;  // 初始透明
                    }
                } else if (phase === 1) {
                    // 阶段1：显现(淡入)+开始下落
                    starRainTimer[si] += dt;
                    starRainAlpha[si] = Math.min(1, starRainTimer[si] * 4);  // 0.25秒淡入
                    // 位置更新
                    starRainX[si] += starRainVX[si] * dt;
                    starRainY[si] += starRainVY[si] * dt;
                    starRainZ[si] += starRainVZ[si] * dt;
                    if (starRainTimer[si] > 0.3) {
                        starRainPhase[si] = 2;  // 进入砸落阶段
                    }
                } else if (phase === 2) {
                    // 阶段2：砸落(加速下落)
                    starRainVY[si] -= 30 * dt;  // 重力加速调小
                    starRainX[si] += starRainVX[si] * dt;
                    starRainY[si] += starRainVY[si] * dt;
                    starRainZ[si] += starRainVZ[si] * dt;
                    // 落到地面附近(-200)进入消失阶段
                    if (starRainY[si] < -200) {
                        starRainPhase[si] = 3;
                        starRainTimer[si] = 0;
                    }
                } else if (phase === 3) {
                    // 阶段3：落地消失(淡出)
                    starRainTimer[si] += dt;
                    starRainAlpha[si] = Math.max(0, 1 - starRainTimer[si] * 3);  // 0.33秒淡出
                    if (starRainTimer[si] > 0.4) {
                        // 消失完成：返回等待阶段
                        starRainPhase[si] = 0;
                        starRainTimer[si] = 0;
                        starRainAlpha[si] = 0;
                        starRainWaitTime[si] = Math.random() * 3;  // 新的随机等待
                    }
                }
            }

            for(let i=0; i<CONFIG.count; i++) {
                const p = particleData[i];
                
                // Diff14.1: 星雨粒子渲染(显现/砸落/消失阶段跳过原形态) (2025-12-14)
                // 等待阶段(phase 0)不干预，让粒子参与原形态
                let isStarRainActive = false;
                if (starRainIdxMap[i] !== -1) {
                    const si = starRainIdxMap[i];
                    if (starRainPhase[si] > 0) {
                        // 显现/砸落/消失阶段：使用星雨位置+白色+透明度
                        p.currentPos.set(starRainX[si], starRainY[si], starRainZ[si]);
                        // 白色×透明度(淡入淡出)
                        const a = starRainAlpha[si];
                        p.color.setRGB(a, a, a);
                        isStarRainActive = true;
                    }
                }
                if (isStarRainActive) continue;  // 跳过原形态逻辑
                
                // Diff13.1: 流星粒子飞行物理(高潮触发时发射) (2025-12-14)
                let isMeteorActive = false;
                if (state.animPhase === 'IDLE' && meteorIdxMap[i] !== -1) {
                    const mi = meteorIdxMap[i];
                    if (meteorActive[mi]) {
                        // 流星：按速度飞行
                        p.currentPos.x += meteorVel[mi].x * dt;
                        p.currentPos.y += meteorVel[mi].y * dt;
                        p.currentPos.z += meteorVel[mi].z * dt;
                        // 生命最后0.5秒：颜色变暗淡出
                        if (meteorLife[mi] < 0.5) {
                            p.color.multiplyScalar(0.95);
                        }
                        isMeteorActive = true;
                    }
                }
                if (isMeteorActive) continue;  // 跳过原形态逻辑
                
                if (state.animPhase === 'EXPLODE') {
                    p.currentPos.lerp(p.tExplode, 0.1);  // 爆开lerp(参考星空圣诞树)
                } else if (state.animPhase === 'CONVERGE') {
                     // Diff2.2修改：CONVERGE目标根据形态选择 (2025-12-14)
                     let target;
                     if (isTree) target = p.tTree;
                     else if (isHeart) target = p.tHeart;
                     else if (isMountain) target = p.tMountain;
                     else target = p.baseScatterPos;
                     p.currentPos.lerp(target, state.lerpSpeed);
                     if(i===0 && p.currentPos.distanceTo(target)<5) { state.animPhase='IDLE'; state.lerpSpeed = 2.0 * dt; }
                } else if (isHeart) {
                    // Diff9.10: 心形整体心跳缩放(修复分离问题) (2025-12-14)
                    // 核心修复：从中心点整体等比缩放，保持心形整体性
                    // 不再旋转(旋转导致上下分离)，只做纯缩放
                    const heartTargetX = p._heartCenter.x + (p._heartOriginal.x - p._heartCenter.x) * heartBeatScale;
                    const heartTargetY = p._heartCenter.y + (p._heartOriginal.y - p._heartCenter.y) * heartBeatScale;
                    const heartTargetZ = p._heartCenter.z + (p._heartOriginal.z - p._heartCenter.z) * heartBeatScale;
                    
                    // Diff9.15: 波纹粒子向外辐射后消失(不被lerp拉回) (2025-12-14)
                    let isRipple = false;
                    for (let ri = 0; ri < RIPPLE_PARTICLE_COUNT; ri++) {
                        if (rippleParticleIndices[ri] === i) {
                            if (rippleLives[ri] > 0) {
                                // 波纹粒子：向外辐射移动(从视觉重心向外)
                                p.currentPos.x += rippleVelocities[ri].x * dt;
                                p.currentPos.y += rippleVelocities[ri].y * dt;
                                p.currentPos.z += rippleVelocities[ri].z * dt;
                                // 生命最后0.3秒：颜色变暗实现淡出(背景黑，变黑=透明)
                                if (rippleLives[ri] < 0.3) {
                                    p.color.multiplyScalar(0.9);
                                }
                                isRipple = true;
                            } else {
                                // 波纹粒子刚结束：瞬间重置位置+颜色(不是lerp拉回)
                                p.currentPos.copy(p._heartOriginal);
                            }
                            break;
                        }
                    }
                    if (!isRipple) {
                        // 普通心形粒子：整体lerp到心跳位置(bassSmoothed驱动膨胀收缩)
                        p.currentPos.x += (heartTargetX - p.currentPos.x) * 0.08;
                        p.currentPos.y += (heartTargetY - p.currentPos.y) * 0.08;
                        p.currentPos.z += (heartTargetZ - p.currentPos.z) * 0.08;
                    }
                    p.color.lerp(heartColorTarget, 0.03);
                } else if (isMountain) {
                    // Diff11.0: 戴森环翻滚(2D星流+3D翻滚交叉) (2025-12-14)
                    // 2D星流：粒子沿环移动(spinAngle) - 保留
                    // 3D翻滚：环平面绕直径轴旋转(法线扫过球面) - 新增
                    // 3环分别绕X/Y/Z轴翻滚，形成立体交叉戴森球
                    if (p._isRiver) {
                        // 2D星流：粒子在环上的角度(沿环移动)
                        const spinAngle = p._ringAngle + time * p._ringSpinSpeed;
                        // 环上局部位置(XY平面，法线Z)
                        const x = Math.cos(spinAngle) * p._ringRadius;
                        const y = Math.sin(spinAngle) * p._ringRadius;  // +厚度
                        let px = x, py = y, pz = p._ringY;
                        // 应用固定倾角(绕X轴，3环初始交叉)
                        const cosT = Math.cos(p._ringTilt);
                        const sinT = Math.sin(p._ringTilt);
                        const ty = py * cosT - pz * sinT;
                        const tz = py * sinT + pz * cosT;
                        px = px; py = ty; pz = tz;
                        // 3D翻滚：绕直径轴旋转(不同环不同轴+不同速度)
                        const tumbleAngle = time * p._ringOrbitSpeed;
                        const c = Math.cos(tumbleAngle), s = Math.sin(tumbleAngle);
                        if (p._ringIndex === 0) {
                            // 环0：绕X轴翻滚(法线Z→Y→-Z→-Y)
                            const ny = py * c - pz * s;
                            const nz = py * s + pz * c;
                            py = ny; pz = nz;
                        } else if (p._ringIndex === 1) {
                            // 环1：绕Y轴翻滚(法线Z→X→-Z→-X)
                            const nx = px * c + pz * s;
                            const nz = -px * s + pz * c;
                            px = nx; pz = nz;
                        } else {
                            // 环2：绕Z轴翻滚(法线Y→X→-Y→-X)
                            const nx = px * c - py * s;
                            const ny = px * s + py * c;
                            px = nx; py = ny;
                        }
                        // 律动时半径脉动(后话，保留)
                        const pulseR = audioCtrl.isKick ? Math.sin(time * 5 + p._ringIndex) * 3 : 0;
                        const ringTarget = new THREE.Vector3(px + pulseR, py, pz);
                        p.currentPos.lerp(ringTarget, 0.1);
                    } else {
                        // 星球粒子：缓慢自转(y轴)+鼓点脉动
                        const planetAngle = time * 0.1;
                        const cx = p.tMountain.x;
                        const cz = p.tMountain.z;
                        const planetPulse = 1.0 + (audioCtrl.isKick ? 0.05 : 0);
                        const planetTarget = new THREE.Vector3(
                            (cx * Math.cos(planetAngle) - cz * Math.sin(planetAngle)) * planetPulse,
                            p.tMountain.y * planetPulse,
                            (cx * Math.sin(planetAngle) + cz * Math.cos(planetAngle)) * planetPulse
                        );
                        p.currentPos.lerp(planetTarget, 0.1);
                    }
                } else {
                    // *** REFINED PHYSICS ***
                    if (isTree) {
                        if (p.isStatic) {
                            p.currentPos.lerp(p.tTree, 0.2); 
                        } else {
                            // FOUNTAIN SNOW LOGIC (修复版：错落有致 + Diff7.4星雨增强)
                            // 参考126.html：低音鼓点时金色粒子向上喷射+横向扩散，形成星雨落下
                            const freq = audioCtrl.getFreq(i);
                            
                            // 1. 重力 (保持不变)
                            p.velocity.y -= 0.05; 
                            
                            // 2. 空气阻力 (模拟雪花飘落感，保持不变)
                            if (p.velocity.y < -0.5) p.velocity.y = -0.5; 
                            
                            // 3. 喷射逻辑 (核心修改区域)
                            // 只有在地面 (y <= 0.5) 且 频率强度足够 (freq > 100) 时触发
                            if (p.currentPos.y <= 0.5 && freq > 100) {
                                
                                // [关键修改]：引入随机增益 (Random Boost)
                                const randomBoost = 1.0 + Math.random() * 4.5; 
                                p.velocity.y = (freq / 255.0) * randomBoost; 
                                // Diff7.4: 低音鼓点时横向扩散喷射(参考126.html)
                                if (audioCtrl.isKick) {
                                    p.velocity.x = (Math.random()-0.5) * 5;
                                    p.velocity.z = (Math.random()-0.5) * 5;
                                }
                            }

                            // 4. 更新位置(垂直 + 横向扩散)
                            p.currentPos.y += p.velocity.y;
                            if (audioCtrl.isKick || p.currentPos.y > 0.5) {
                                p.currentPos.x += p.velocity.x;
                                p.currentPos.z += p.velocity.z;
                                p.velocity.x *= 0.98;  // 横向阻力
                                p.velocity.z *= 0.98;
                            }
                            
                            // 地面碰撞检测
                            if (p.currentPos.y < 0) { 
                                p.currentPos.y = 0; 
                                p.velocity.y = 0; 
                                p.velocity.x = 0; p.velocity.z = 0;
                                // 回到树脚原始位置
                                p.currentPos.x = p.tTree.x; 
                                p.currentPos.z = p.tTree.z;
                            }
                        }
                    } else {
                        // GALAXY LOGIC (MAINTAIN FORM + WAVE)
                        if (p.isCore) {
                            p.currentPos.lerp(p.tScatter, 0.1);
                        } else {
                            // 1. SILKY BREATHING (Sine superposition)
                            const noise1 = Math.sin(time * 0.5 + p.noiseOffset.x);
                            const noise2 = Math.cos(time * 0.3 + p.noiseOffset.y);
                            //  1.5: 是基础浮动幅度。改大这个数字，平时粒子飘得更厉害。 0.1: 是随音量变化的幅度。改大这个数字，音乐声音大时，粒子上下浮动更剧烈
                            const breath = (noise1 + noise2) * (2 + audioCtrl.volume * 0.1);

                            // 2. ROTATION (Inner fast, Outer slow)
                            const dist = Math.sqrt(p.baseScatterPos.x**2 + p.baseScatterPos.z**2);
                            const normDist = dist / CONFIG.galaxyRadius;
                            
                            // Shear rotation based on radius
                            const shearAngle = time * (0.2 * (1.0 - normDist*0.5)); 
                            const ca = Math.cos(shearAngle);
                            const sa = Math.sin(shearAngle);
                            
                            // Rotate the BASE position
                            const bx = p.baseScatterPos.x; const bz = p.baseScatterPos.z;
                            const rx = bx * ca - bz * sa;
                            const rz = bx * sa + bz * ca;

                            // 3. CENTRIFUGAL WAVE (Kick reaction)
                            let surge = 0;
                            if(audioCtrl.isKick) {
                                // Impulse decays over distance
    // ▼▼▼ 下面这行控制跳动的猛烈程度 ▼▼▼
                                surge = 40.0 * Math.exp(-normDist * 2.0); 
                            }
                            // Smooth out surge 给爆发力加“缓冲”和“平滑过渡”。
                            p.velocity.x += (surge - p.velocity.x) * 0.5;
                            
                            // Apply vectors
                            // Angle of current position
                            const angle = Math.atan2(rz, rx);
                            const waveX = Math.cos(angle) * p.velocity.x;
                            const waveZ = Math.sin(angle) * p.velocity.x;

                            // Lerp to target position (Rotated Base + Breath + Wave)
                            const tx = rx + waveX;
                            const ty = p.baseScatterPos.y + breath;
                            const tz = rz + waveZ;

                            p.currentPos.x += (tx - p.currentPos.x) * 0.05;    // 控制粒子呼吸+闪烁频率改大 (如 0.5)：粒子反应变快，动作敏捷，但可能会有点抖。改小 (如 0.01)：粒子反应极慢，像在蜂蜜里游泳，会有很长的拖影感
                            p.currentPos.y += (ty - p.currentPos.y) * 0.05;
                            p.currentPos.z += (tz - p.currentPos.z) * 0.05;
                            
                            // Decay surge velocity
                            p.velocity.x *= 0.7;  //改大 (如 0.99)：摩擦力很小，推一下能滑好久，像在冰面上。改小 (如 0.5)：摩擦力巨大，推一下瞬间就停了，像在沙地上
                        }
                    }
                }

                const blink = Math.sin(time * p.speed + p.offset);
                let scale = p.baseScale * (0.0 + 1.5 * Math.pow(0.5*blink+0.5, 6.0));      // 控制粒子呼吸+闪烁频率
                // Diff13.2: 流星粒子放大scale(模拟拖尾大流星) (2025-12-14)
                if (state.animPhase === 'IDLE' && meteorIdxMap[i] !== -1 && meteorActive[meteorIdxMap[i]]) {
                    const mi = meteorIdxMap[i];
                    // 流星scale随生命递减(刚发射最大，逐渐缩小)
                    const lifeRatio = meteorLife[mi] / meteorMaxLife;
                    scale *= 3.0 + lifeRatio * 5.0;  // 3~8倍放大
                }
                // Diff14.3: 星雨粒子放大scale(体积更大更明显) (2025-12-14)
                if (starRainIdxMap[i] !== -1 && starRainPhase[starRainIdxMap[i]] > 0) {
                    scale *= 4.0 + starRainAlpha[starRainIdxMap[i]] * 4.0;  // 4~8倍放大(随透明度)
                }
                dummy.position.copy(p.currentPos);
                dummy.scale.setScalar(scale);
                if (!isTree && i < CONFIG.textCount) dummy.rotation.set(0, 0, 0);
                else dummy.rotation.set(time + p.offset, time * 0.5, 0);
                dummy.updateMatrix();

                if (p.meshIndex === 0) meshSphere.setMatrixAt(p.internalIndex, dummy.matrix);
                else if (p.meshIndex === 1) meshBox.setMatrixAt(p.internalIndex, dummy.matrix);
                else meshTetra.setMatrixAt(p.internalIndex, dummy.matrix);
            }
            [meshSphere, meshBox, meshTetra].forEach(m => m.instanceMatrix.needsUpdate = true);
            
            // Diff4.2新增：颜色过渡 - 每帧lerp color到targetColor (2025-12-14)
            let colorChanged = false;
            for (let i = 0; i < CONFIG.count; i++) {
                const p = particleData[i];
                // Diff14.2: 星雨粒子在显现/砸落/消失阶段跳过颜色过渡 (2025-12-14)
                // 星雨粒子需要保持白色×透明度，不能被过渡拉回targetColor
                if (starRainIdxMap[i] !== -1 && starRainPhase[starRainIdxMap[i]] > 0) {
                    // 星雨粒子：直接更新颜色(每帧设为白色×透明度)
                    const si = starRainIdxMap[i];
                    const a = starRainAlpha[si];
                    p.color.setRGB(a, a, a);
                    if (p.meshIndex === 0) meshSphere.setColorAt(p.internalIndex, p.color);
                    else if (p.meshIndex === 1) meshBox.setColorAt(p.internalIndex, p.color);
                    else meshTetra.setColorAt(p.internalIndex, p.color);
                    colorChanged = true;
                    continue;
                }
                const dr = p.color.r - p.targetColor.r;
                const dg = p.color.g - p.targetColor.g;
                const db = p.color.b - p.targetColor.b;
                if (dr*dr + dg*dg + db*db > 0.0001) {
                    p.color.lerp(p.targetColor, 0.05);  // 平滑过渡
                    if (p.meshIndex === 0) meshSphere.setColorAt(p.internalIndex, p.color);
                    else if (p.meshIndex === 1) meshBox.setColorAt(p.internalIndex, p.color);
                    else meshTetra.setColorAt(p.internalIndex, p.color);
                    colorChanged = true;
                }
            }
            if (colorChanged) [meshSphere, meshBox, meshTetra].forEach(m => m.instanceColor.needsUpdate = true);

// ... (代码上半部分) ...

// Update Photos
const hudWorldPos = new THREE.Vector3(0,0,-30).applyMatrix4(camera.matrixWorld);
photos.forEach(p => {
    // p is the Frame Mesh, p.children[0] is the Photo Mesh
    const photoMesh = p.children[0];

    if(p === state.activePhoto && state.mode === 'SCATTER') {
        controls.enabled = false;
        const localTarget = photoGroup.worldToLocal(hudWorldPos.clone());
        
        // --- 修复浮动效果的代码：在此处添加或修改 ---
        // time 是 animate 函数中 clock.getElapsedTime() 得到的当前时间
        // Math.sin(time * 2.0) 产生一个 -1 到 1 之间的平滑波形，2.0 决定浮动速度
        // * 0.5 决定浮动幅度，你可以调整这个值让它浮动得更高或更低
        localTarget.y += Math.sin(time * 2.0) * 0.5; // <-- 重点：添加这一行！
        // --- 修复代码结束 ---

        p.position.lerp(localTarget, 0.3); // 照片会平滑地移动到这个包含浮动的新目标位置
        p.lookAt(camera.position);
        p.scale.lerp(vTmp.set(3.5, 3.5, 3.5), 0.1);
        
        // 核心修复：同时提升相框和照片的渲染层级，并关闭深度测试
        p.renderOrder = 9999; 
        p.material.depthTest = false;
        
        if(photoMesh) {
            photoMesh.renderOrder = 10000; // 照片比相框更高一级，确保在相框之上
            photoMesh.material.depthTest = false;
        }

    } else {
                    if(!state.activePhoto) controls.enabled = true;
                    
                    // 恢复正常层级
                    p.renderOrder = 0; 
                    p.material.depthTest = true;
                    if(photoMesh) {
                        photoMesh.renderOrder = 0;
                        photoMesh.material.depthTest = true;
                    }

                    p.scale.lerp(vTmp.set(1,1,1), 0.1);
                    if(isTree) {
                        p.position.lerp(p.userData.treePos, 0.1);
                        p.rotation.set(p.userData.treeRot.x, p.userData.treeRot.y, p.userData.treeRot.z);
                    } else {
                        const r = p.userData.scatterRadius;
                        const a = p.userData.scatterAngle;
                        p.position.lerp(vTmp.set(r*Math.cos(a), p.userData.scatterY + Math.sin(time+p.id)*2, r*Math.sin(a)), 0.1);
                        p.rotation.y += p.userData.selfRotSpeed;
                    }
                }
            });
            controls.update();

            // Render
            scene.traverse(darkenNonBloomed);
            bloomComposer.render();
            scene.traverse(restoreMaterial);
            mixPass.uniforms.bloomTexture.value = bloomComposer.renderTarget2.texture;
            finalComposer.render();
        }

        // --- INPUTS ---
        let handLandmarker;
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        // 手势识别状态 (2025-12-14 Diff1重构：归一化+连续帧确认+冷却)
        const handHistory = []; let lastSwitchTime = 0;
        const gestureBuffer = [];           // 最近10帧的原始手势判定结果
        let confirmedGesture = 'NONE';      // 经连续帧确认后的稳定手势
        let lastGestureSwitchTime = 0;      // 上次手势触发形态切换的时间(用于冷却)

        async function initAI() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
                runningMode: "VIDEO", numHands: 1
            });
            document.getElementById('loading').style.display = 'none';
            navigator.mediaDevices.getUserMedia({video: true}).then(s => {
                video.srcObject = s; video.addEventListener('loadeddata', predict);
            });
        }
        let lastTime = -1;
        function predict() {
            if(video.currentTime !== lastTime) {
                lastTime = video.currentTime;
                const res = handLandmarker.detectForVideo(video, performance.now());
                ctx.clearRect(0,0,canvas.width,canvas.height);
                if(res.landmarks.length > 0) {
                    const lm = res.landmarks[0];
                    drawHand(lm); analyzeHand(lm);
                }
            }
            requestAnimationFrame(predict);
        }
        function drawHand(lm) {
            ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 2;
            const p = i => ({x: lm[i].x*canvas.width, y: lm[i].y*canvas.height});
            [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]].forEach(l => { ctx.beginPath(); ctx.moveTo(p(l[0]).x, p(l[0]).y); ctx.lineTo(p(l[1]).x, p(l[1]).y); ctx.stroke(); });
        }
        // 手势识别重构 (2025-12-14 Diff1)：归一化手指伸展度 + 连续帧确认 + 冷却
        function analyzeHand(lm) {
            const dist = (a,b) => Math.hypot(lm[a].x-lm[b].x, lm[a].y-lm[b].y);
            // 手掌长度作为归一化基准(手腕0到中指根9)，消除手远近/大小影响
            const palmSize = dist(0, 9) || 0.001;
            
            // 各手指伸展度 = 指尖到手腕距离 / 手掌长度 (>1.5伸直, <1.3弯曲)
            const fingerExt = {
                index:    dist(0, 8)  / palmSize,   // 食指
                middle:   dist(0, 12) / palmSize,   // 中指
                ring:     dist(0, 16) / palmSize,   // 无名指
                pinky:    dist(0, 20) / palmSize,   // 小指
            };
            // 拇指伸展度(用横向距离5→4，因为拇指运动方向不同)
            const thumbExt = dist(5, 4) / palmSize;
            
            // 四指是否伸直/弯曲 (2025-12-14 Diff1.3：小指单独放宽，因为小指天生短)
            const ext = f => f > 1.4;       // 食指/中指/无名指伸直阈值
            const extPinky = f => f > 1.2;  // 小指伸直阈值放宽(1.4→1.2，小指天生短)
            const bend = f => f < 1.2;      // 弯曲判定
            const indexExt = ext(fingerExt.index), middleExt = ext(fingerExt.middle);
            const ringExt = ext(fingerExt.ring), pinkyExt = extPinky(fingerExt.pinky);
            const indexBend = bend(fingerExt.index), middleBend = bend(fingerExt.middle);
            const ringBend = bend(fingerExt.ring), pinkyBend = bend(fingerExt.pinky);
            // 统计伸直/弯曲的手指数(3/4即可，不要求四指全达标)
            const extCount = (indexExt?1:0) + (middleExt?1:0) + (ringExt?1:0) + (pinkyExt?1:0);
            const bendCount = (indexBend?1:0) + (middleBend?1:0) + (ringBend?1:0) + (pinkyBend?1:0);
            
            // 手指卷曲度判定：指尖到对应掌指关节的距离(真弯时指尖靠近掌指关节)
            const curl = (tip, mcp) => dist(tip, mcp) / palmSize;
            const indexCurl = curl(8, 5) < 0.7;   // 卷曲度阈值0.6→0.7稍放宽
            const middleCurl = curl(12, 9) < 0.7;
            const ringCurl = curl(16, 13) < 0.7;
            const pinkyCurl = curl(20, 17) < 0.7;
            const curlCount = (indexCurl?1:0) + (middleCurl?1:0) + (ringCurl?1:0) + (pinkyCurl?1:0);
            
            // 拇指食指是否捏合(OK手势的核心：拇指尖4与食指尖8距离很近)
            const pinchDist = dist(4, 8) / palmSize;
            const isPinching = pinchDist < 0.4;  // 捏合阈值0.35→0.4稍放宽
            // 拇指是否伸展(握拳时拇指压在食指上，非伸展)
            const thumbNotExt = thumbExt < 1.0;
            
            // 指向手势(食指伸直+中指弯曲)，用于切照片
            const isPointing = indexExt && middleBend;
            
            // === 原始手势判定 (Diff1.3：3/4手指达标即可，优先判定特征明显的捏合) ===
            let rawGesture = 'NONE';
            // 1.先判捏合类(特征最明显)：山河=捏合+中无小三指伸，心形=捏合
            if (isPinching && middleExt && ringExt && pinkyExt) {
                rawGesture = 'PLANET';    // 星球：拇指食指成圈+中无小三指伸直
            } else if (isPinching) {
                rawGesture = 'PINCH';       // 心形：拇指食指捏合
            } 
            // 2.再判指向(食指伸+中指弯)
            else if (isPointing && bendCount >= 2) {
                rawGesture = 'POINT';       // 指向：食指伸直+至少2指弯曲
            }
            // 3.判握拳：>=3指弯曲 + >=3指卷曲 + 拇指非伸展
            else if (bendCount >= 3 && curlCount >= 3 && thumbNotExt) {
                rawGesture = 'FIST';        // 握拳：3/4指弯曲(放宽，不要求四指全弯)
            }
            // 4.判张手：>=3指伸直
            else if (extCount >= 3) {
                rawGesture = 'OPEN';        // 张手：3/4指伸直(放宽，不要求四指全伸)
            }
            
            // === 调试日志(Diff1.3新增：按D键开关，实时显示手指伸展度) ===
            if (window._gestureDebug) {
                const dbg = document.getElementById('gesture-debug') || (() => {
                    const d = document.createElement('div');
                    d.id = 'gesture-debug';
                    d.style.cssText = 'position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.8);color:#0ff;font:11px monospace;padding:8px;z-index:9999;pointer-events:none;';
                    document.body.appendChild(d); return d;
                })();
                dbg.innerHTML = `I:${fingerExt.index.toFixed(2)}${indexExt?'✓':'✗'} M:${fingerExt.middle.toFixed(2)}${middleExt?'✓':'✗'} R:${fingerExt.ring.toFixed(2)}${ringExt?'✓':'✗'} P:${fingerExt.pinky.toFixed(2)}${pinkyExt?'✓':'✗'}<br>ext:${extCount} bend:${bendCount} curl:${curlCount} pinch:${pinchDist.toFixed(2)}<br>raw:${rawGesture} confirmed:${confirmedGesture} mode:${state.targetMode}`;
            }
            
            // === 连续帧确认(防抖)：最近5帧中占比>=60%才确认 (Diff1.2：原10帧7票→5帧3票，响应更快) ===
            gestureBuffer.push(rawGesture);
            if (gestureBuffer.length > 5) gestureBuffer.shift();
            const counts = {};
            gestureBuffer.forEach(g => counts[g] = (counts[g] || 0) + 1);
            let maxCount = 0, maxGesture = 'NONE';
            for (const g in counts) {
                if (counts[g] > maxCount) { maxCount = counts[g]; maxGesture = g; }
            }
            confirmedGesture = (maxCount >= 3) ? maxGesture : 'NONE'; // 60% of 5 = 3
            
            // === 冷却机制：切换后300ms内不再触发 (Diff1.2：500ms→300ms) ===
            const now = Date.now();
            const inCooldown = (now - lastGestureSwitchTime) < 300;
            
            // === 指向手势：切照片(Diff1.1修复：增加左滑/右滑双向判定，实现真正循环) ===
            if (state.mode === 'SCATTER') {
                if (confirmedGesture === 'POINT') {
                    if (!state.activePhoto && photos.length > 0) state.activePhoto = photos[0];
                    handHistory.push({x: lm[8].x}); if(handHistory.length>5) handHistory.shift();
                    if(handHistory.length>=2 && Date.now()-lastSwitchTime>800) {
                        const dx = handHistory[handHistory.length-1].x - handHistory[0].x;
                        if (Math.abs(dx) > 0.1) {  // 横向滑动幅度>0.1
                            lastSwitchTime = Date.now();
                            let idx = photos.indexOf(state.activePhoto);
                            if (dx < 0) {
                                // 右滑(镜像后x减小)：下一张
                                idx = (idx + 1) % photos.length;
                            } else {
                                // 左滑(镜像后x增大)：上一张
                                idx = (idx - 1 + photos.length) % photos.length;
                            }
                            state.activePhoto = photos[idx];
                            handHistory.length = 0; // 清空历史，防止连续触发
                        }
                    }
                } else {
                    state.activePhoto = null;
                }
            }
            
            // === 形态切换(带冷却) ===
            if (!inCooldown && confirmedGesture !== 'NONE') {
                const gestureToMode = { 'FIST':'TREE', 'OPEN':'SCATTER', 'PINCH':'HEART', 'MOUNTAIN':'MOUNTAINS' };
                const newMode = gestureToMode[confirmedGesture];
                if (newMode && state.targetMode !== newMode) {
                    state.targetMode = newMode;
                    lastGestureSwitchTime = now;
                    if (newMode !== 'SCATTER') state.activePhoto = null;
                }
            }
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); 
            bloomComposer.setSize(window.innerWidth, window.innerHeight);
            finalComposer.setSize(window.innerWidth, window.innerHeight);
        };

        window.addEventListener('keydown', (e) => {
            if(e.key==='1') { state.targetMode = 'TREE'; state.activePhoto=null; }
            if(e.key==='2') { state.targetMode = 'SCATTER'; state.activePhoto=null; }
            // Diff2.3新增：4/5键切换HEART/MOUNTAINS形态 (2025-12-14)
            if(e.key==='4') { state.targetMode = 'HEART'; state.activePhoto=null; }
            if(e.key==='5') { state.targetMode = 'MOUNTAINS'; state.activePhoto=null; }
            if(e.key==='3') { 
                state.targetMode='SCATTER'; 
                if(!state.activePhoto && photos.length>0) state.activePhoto=photos[0]; 
            }
            if(e.key==='ArrowLeft' && photos.length>0) {
                if(state.mode!=='SCATTER') state.targetMode='SCATTER';
                let idx = state.activePhoto ? photos.indexOf(state.activePhoto) : 0;
                idx = (idx - 1 + photos.length) % photos.length;
                state.activePhoto = photos[idx];
            }
            if(e.key==='ArrowRight' && photos.length>0) {
                if(state.mode!=='SCATTER') state.targetMode='SCATTER';
                let idx = state.activePhoto ? photos.indexOf(state.activePhoto) : 0;
                idx = (idx + 1) % photos.length;
                state.activePhoto = photos[idx];
            }
            if(e.key.toLowerCase()==='h') {
                const ui = document.getElementById('ui-layer');
                ui.style.opacity = ui.style.opacity === '0' ? '1' : '0';
            }
            // D键开关手势调试面板 (2025-12-14 Diff1.3)
            if(e.key.toLowerCase()==='d') {
                window._gestureDebug = !window._gestureDebug;
                if(!window._gestureDebug) {
                    const d = document.getElementById('gesture-debug');
                    if(d) d.remove();
                }
            }
        });

        initAI();
        animate();
    </script>
