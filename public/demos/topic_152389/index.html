<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>总工之眼｜景观审图智能工作台</title>
<style>
/* ============================================================
   总工之眼｜景观审图智能工作台 —— 全局主题
   ============================================================ */
:root {
  --bg-deep:#0b1324;--bg-panel:#111b2e;--bg-work:#e8ecf2;--bg-work-grid:#dde3ec;
  --bg-sidebar:#0f1a2e;--bg-card:#ffffff;--bg-input:#f5f7fa;
  --text-primary:#1a2332;--text-secondary:#5a6a7d;--text-muted:#8a96a8;
  --text-on-dark:#e2e8f0;--text-on-dark-muted:#94a3b8;
  --accent-blue:#2563eb;--accent-cyan:#06b6d4;--accent-light:#3b82f6;
  --p0-red:#dc2626;--p0-bg:#fef2f2;--p1-orange:#ea580c;--p1-bg:#fff7ed;
  --p2-blue:#2563eb;--p2-bg:#eff6ff;--success:#059669;--success-bg:#ecfdf5;
  --warn:#d97706;--warn-bg:#fffbeb;--border-light:#e2e8f0;--border-dark:#1e293b;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.05);--shadow-md:0 4px 6px -1px rgba(0,0,0,0.1);
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text-primary)}

/* 登录页 */
#login-page{position:fixed;inset:0;z-index:1000;background:var(--bg-deep);display:flex;align-items:center;justify-content:center}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.06) 1px,transparent 1px);background-size:40px 40px}
.corner-line{position:absolute;width:60px;height:60px;border-color:rgba(59,130,246,0.4);border-style:solid}
.corner-line.tl{top:40px;left:40px;border-width:2px 0 0 2px}
.corner-line.tr{top:40px;right:40px;border-width:2px 2px 0 0}
.corner-line.bl{bottom:40px;left:40px;border-width:0 0 2px 2px}
.corner-line.br{bottom:40px;right:40px;border-width:0 2px 2px 0}
.login-panel{position:relative;z-index:10;width:420px;padding:48px 40px;background:rgba(17,27,46,0.85);border:1px solid rgba(59,130,246,0.25);border-radius:var(--radius-lg);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,0.4);animation:fadeInUp .6s ease}
.login-logo{width:56px;height:56px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.login-logo svg{width:56px;height:56px}
.login-title{text-align:center;font-size:22px;font-weight:700;color:#fff;margin-bottom:4px}
.login-subtitle{text-align:center;font-size:11px;color:var(--text-on-dark-muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.login-tagline{text-align:center;font-size:13px;color:var(--accent-cyan);margin-bottom:32px}
.login-field{margin-bottom:18px}
.login-field label{display:block;font-size:12px;color:var(--text-on-dark-muted);margin-bottom:6px}
.login-field input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:#fff;font-size:14px;outline:none;transition:border-color .2s}
.login-field input:focus{border-color:var(--accent-blue)}
.login-btn{width:100%;padding:14px;margin-top:8px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));border:none;border-radius:var(--radius-sm);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(37,99,235,0.3)}
.login-hint{text-align:center;margin-top:18px;font-size:12px;color:var(--text-on-dark-muted)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* 工作台五区域 */
#workbench{display:none;width:100vw;height:100vh;flex-direction:column;background:var(--bg-work)}
#top-bar{height:60px;min-height:60px;background:var(--bg-deep);border-bottom:1px solid var(--border-dark);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.top-left{display:flex;align-items:center;gap:16px}
.top-logo{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.top-logo svg{width:32px;height:32px}
.top-brand{display:flex;flex-direction:column}
.top-brand-name{font-size:15px;font-weight:700;color:#fff;line-height:1.3}
.top-brand-en{font-size:10px;color:var(--text-on-dark-muted);letter-spacing:.1em}
.top-right{display:flex;align-items:center;gap:12px}
.top-user{display:flex;align-items:center;gap:10px}
.top-user-info{text-align:right}
.top-user-name{font-size:13px;font-weight:600;color:#fff}
.top-user-role{font-size:11px;color:var(--text-on-dark-muted)}
.top-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#475569,#64748b);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600}
#body-area{flex:1;display:flex;overflow:hidden}
#sidebar{width:260px;min-width:260px;background:var(--bg-sidebar);border-right:1px solid var(--border-dark);display:flex;flex-direction:column}
.sidebar-header{padding:20px 16px 12px;border-bottom:1px solid var(--border-dark)}
.sidebar-title{font-size:11px;font-weight:600;color:var(--text-on-dark-muted);letter-spacing:.1em;text-transform:uppercase}
.sidebar-actions{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.btn-primary-sidebar{width:100%;padding:10px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));border:none;border-radius:var(--radius-sm);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary-sidebar:hover{opacity:.92}
.sidebar-search{padding:0 16px 12px}
.sidebar-search input{width:100%;padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-sm);color:#fff;font-size:12px;outline:none}
.sidebar-search input::placeholder{color:var(--text-on-dark-muted)}
.sidebar-list{flex:1;overflow-y:auto;padding:0 12px 12px}
.project-item{padding:12px;margin-bottom:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:var(--radius-md);cursor:pointer;transition:background .2s}
.project-item:hover{background:rgba(255,255,255,0.06)}
.project-item.active{background:rgba(37,99,235,0.12);border-color:rgba(37,99,235,0.3)}
.project-name{font-size:13px;font-weight:600;color:var(--text-on-dark);margin-bottom:4px;line-height:1.4}
.project-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-on-dark-muted)}
.project-status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.status-pending{background:rgba(245,158,11,0.15);color:#f59e0b}
.status-blocked{background:rgba(220,38,38,0.15);color:#ef4444}
.status-hold{background:rgba(234,88,12,0.15);color:#f97316}
.status-conditional{background:rgba(59,130,246,0.15);color:#60a5fa}
.status-approved{background:rgba(5,150,105,0.15);color:#10b981}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border-dark);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-on-dark-muted)}

/* 中央工作区 */
#main-area{flex:1;display:flex;flex-direction:column;position:relative;background:linear-gradient(var(--bg-work-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-work-grid) 1px,transparent 1px),var(--bg-work);background-size:24px 24px,24px 24px,100% 100%}
#main-content{flex:1;overflow-y:auto;padding:24px 32px}

/* 右侧信息栏 */
#info-panel{width:320px;min-width:320px;background:var(--bg-card);border-left:1px solid var(--border-light);display:flex;flex-direction:column;overflow-y:auto}
.info-section{padding:20px;border-bottom:1px solid var(--border-light)}
.info-section-title{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.info-row{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px}
.info-label{color:var(--text-muted)}
.info-value{font-weight:600;color:var(--text-primary);text-align:right;max-width:60%}

/* 底部流程栏 */
#bottom-bar{height:72px;min-height:72px;background:var(--bg-card);border-top:1px solid var(--border-light);display:flex;align-items:center;justify-content:center;padding:0 32px;gap:0}
.flow-step{display:flex;align-items:center;gap:12px}
.flow-node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px}
.flow-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--border-light);background:#fff;color:var(--text-muted);transition:all .3s}
.flow-circle.active{border-color:var(--accent-blue);background:var(--accent-blue);color:#fff;box-shadow:0 0 12px rgba(37,99,235,0.3)}
.flow-circle.done{border-color:var(--success);background:var(--success);color:#fff}
.flow-label{font-size:12px;color:var(--text-secondary);font-weight:500}
.flow-label.active{color:var(--accent-blue);font-weight:700}
.flow-label.done{color:var(--success)}
.flow-line{width:48px;height:2px;background:var(--border-light);margin:0 8px;margin-bottom:20px}
.flow-line.done{background:var(--success)}
.flow-line.active{background:linear-gradient(90deg,var(--success),var(--accent-blue))}

/* 通用组件 */
.page-title{font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:24px;display:flex;align-items:center;gap:10px}
.page-title .tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:4px;background:var(--accent-blue);color:#fff}
.card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.card-header{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text-primary)}
.upload-zone{border:2px dashed var(--border-light);border-radius:var(--radius-lg);padding:48px 32px;text-align:center;background:var(--bg-input);cursor:pointer;transition:all .2s}
.upload-zone:hover{border-color:var(--accent-blue);background:#eef2ff}
.upload-zone-text{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.upload-zone-hint{font-size:12px;color:var(--text-muted)}
.file-list{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.file-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-input);border-radius:var(--radius-md);border:1px solid var(--border-light)}
.file-icon{width:36px;height:36px;border-radius:6px;background:#dbeafe;color:var(--accent-blue);display:flex;align-items:center;justify-content:center;font-size:16px}
.file-info{flex:1}
.file-name{font-size:13px;font-weight:600;color:var(--text-primary)}
.file-meta{font-size:11px;color:var(--text-muted)}
.file-status{color:var(--success);font-size:16px}
.form-row{display:flex;gap:20px;margin-bottom:16px}
.form-group{flex:1}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:10px 12px;background:var(--bg-input);border:1px solid var(--border-light);border-radius:var(--radius-sm);font-size:14px;color:var(--text-primary);outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent-blue)}
.tag-select{display:flex;flex-wrap:wrap;gap:8px}
.tag-option{padding:8px 16px;background:var(--bg-input);border:1px solid var(--border-light);border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;user-select:none}
.tag-option:hover{border-color:var(--accent-blue)}
.tag-option.selected{background:var(--accent-blue);border-color:var(--accent-blue);color:#fff}
.btn-group{display:flex;gap:12px;margin-top:24px}
.btn{padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-primary{background:var(--accent-blue);color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border-light)}
.btn-secondary:hover{background:#e2e8f0}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#047857}
.btn-warn{background:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 审查流程 —— 压缩横向布局 */
.review-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.status-badge{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.step-list{display:flex;flex-direction:column;gap:6px}
.step-item{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);transition:all .3s}
.step-item.active{border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(37,99,235,0.08)}
.step-item.done{border-color:var(--success);background:var(--success-bg)}
.step-item.done .step-desc,.step-item.done .step-status{display:none}
.step-item.waiting{opacity:.5}
.step-num{width:28px;height:28px;min-width:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg-input);color:var(--text-muted);border:2px solid var(--border-light)}
.step-item.active .step-num{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue);animation:pulse-glow 1.5s infinite}
.step-item.done .step-num{background:var(--success);color:#fff;border-color:var(--success)}
.step-body{flex:1;display:flex;align-items:center;gap:16px;min-width:0}
.step-name{font-size:13px;font-weight:700;color:var(--text-primary);white-space:nowrap}
.step-desc{font-size:12px;color:var(--text-secondary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-status{font-size:12px;font-weight:600;white-space:nowrap}
.s-waiting{color:var(--text-muted)}.s-running{color:var(--accent-blue)}.s-done{color:var(--success)}
@keyframes pulse-glow{0%,100%{box-shadow:none}50%{box-shadow:0 0 8px rgba(37,99,235,0.4)}}

/* 资料补全 */
.supplement-card{background:var(--warn-bg);border:1px solid #fcd34d;border-radius:var(--radius-lg);padding:20px;margin:12px 0}
.supplement-title{font-size:15px;font-weight:700;color:var(--warn);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.supplement-list{margin:10px 0 14px;padding-left:20px}
.supplement-list li{margin-bottom:6px;font-size:13px;color:var(--text-primary)}
.supplement-success{background:var(--success-bg);border-color:#6ee7b7}
.supplement-success .supplement-title{color:var(--success)}

/* 风险清单 */
.risk-summary{display:flex;gap:16px;margin-bottom:20px}
.risk-stat{flex:1;padding:16px;border-radius:var(--radius-md);text-align:center}
.risk-stat.p0{background:var(--p0-bg);border:1px solid #fecaca}
.risk-stat.p1{background:var(--p1-bg);border:1px solid #fed7aa}
.risk-stat.p2{background:var(--p2-bg);border:1px solid #bfdbfe}
.risk-stat-value{font-size:28px;font-weight:800}
.risk-stat.p0 .risk-stat-value{color:var(--p0-red)}
.risk-stat.p1 .risk-stat-value{color:var(--p1-orange)}
.risk-stat.p2 .risk-stat-value{color:var(--p2-blue)}
.risk-stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.verdict-card{padding:24px;border-radius:var(--radius-lg);margin-bottom:20px;background:var(--p0-bg);border:2px solid var(--p0-red)}
.verdict-title{font-size:24px;font-weight:800;color:var(--p0-red);margin-bottom:8px}
.verdict-desc{font-size:14px;color:var(--text-primary);line-height:1.6}

/* 吸顶复核栏 */
.sticky-review-bar{position:sticky;top:0;z-index:20;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-md);flex-wrap:wrap;gap:10px}
.sticky-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sticky-verdict{font-size:16px;font-weight:800;color:var(--p0-red)}
.sticky-chip{padding:4px 12px;border-radius:12px;background:var(--bg-input);font-size:12px;display:flex;align-items:center;gap:4px;border:1px solid var(--border-light)}
.sticky-chip .n{font-weight:700}
.sticky-right{display:flex;gap:8px}

.risk-section-title{font-size:16px;font-weight:700;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.risk-section-title.p0{color:var(--p0-red)}.risk-section-title.p1{color:var(--p1-orange)}.risk-section-title.p2{color:var(--p2-blue)}
.risk-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:20px;margin-bottom:12px;border-left:4px solid;transition:all .2s}
.risk-card.p0{border-left-color:var(--p0-red)}.risk-card.p1{border-left-color:var(--p1-orange)}.risk-card.p2{border-left-color:var(--p2-blue)}
.risk-card.confirmed{border-left-color:var(--success)!important;background:var(--success-bg)}
.risk-card.confirmed .risk-id-label{color:var(--success);background:var(--success-bg);border:1px solid #a7f3d0}
.risk-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.risk-id{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.risk-card.p0 .risk-id{background:var(--p0-bg);color:var(--p0-red)}.risk-card.p1 .risk-id{background:var(--p1-bg);color:var(--p1-orange)}.risk-card.p2 .risk-id{background:var(--p2-bg);color:var(--p2-blue)}
.risk-id-label{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;color:var(--success);background:var(--success-bg);border:1px solid #a7f3d0}
.risk-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:8px}
.risk-detail{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:8px}
.risk-detail strong{color:var(--text-primary)}
.risk-actions{display:flex;gap:8px;margin-top:10px}
.risk-actions .btn{padding:6px 14px;font-size:12px}
.risk-edit{margin-top:12px;padding:16px;background:var(--bg-input);border-radius:var(--radius-md);display:none}
.risk-edit.visible{display:block}
.risk-edit-row{margin-bottom:12px}
.risk-edit-row label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.risk-edit-row input,.risk-edit-row textarea,.risk-edit-row select{width:100%;padding:8px 10px;border:1px solid var(--border-light);border-radius:var(--radius-sm);font-size:13px;font-family:inherit}
.risk-edit-row textarea{resize:vertical;min-height:60px}

/* 人机对比 */
.compare-container{display:flex;gap:20px}
.compare-col{flex:1}
.compare-col-title{font-size:14px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border-light)}
.compare-arrow{display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accent-blue);padding-top:40px}
.compare-changed{background:#fffbeb;border-left:3px solid var(--warn)}
.compare-deleted{text-decoration:line-through;opacity:.5}
.compare-added-badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:#ede9fe;color:#7c3aed;margin-left:6px}
.compare-not-found{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:#f3f4f6;color:#6b7280;margin-left:6px}

/* 报告 */
.report-tabs{display:flex;gap:8px;margin-bottom:20px}
.report-tab{padding:10px 20px;border-radius:var(--radius-sm);background:var(--bg-input);border:1px solid var(--border-light);font-size:13px;font-weight:600;cursor:pointer;color:var(--text-secondary)}
.report-tab.active{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue)}
.report-content{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:32px;min-height:400px}
.email-preview{font-family:Georgia,serif;line-height:1.8}
.email-header{border-bottom:1px solid var(--border-light);padding-bottom:16px;margin-bottom:20px}
.email-to{font-size:14px;color:var(--text-secondary);margin-bottom:4px}
.email-subject{font-size:16px;font-weight:700}
.email-body p{margin-bottom:12px;font-size:14px}

@keyframes slideInRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ============================================================
   工具函数
   ============================================================ */
function $(id){ return document.getElementById(id); }
function showToast(msg){ const c=$('toast-container'),t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>{t.remove()},3000); }
function statusClass(s){ return {pending:'status-pending',blocked:'status-blocked',hold:'status-hold',conditional:'status-conditional',approved:'status-approved'}[s]||'status-pending'; }
function statusText(s){ return {pending:'待预审',blocked:'不可签字',hold:'暂缓签字',conditional:'附条件',approved:'可签字'}[s]||s; }
function esc(s){ return s.replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function scrollToTop(){ const m=$('main-content'); if(m) m.scrollTop=0; }
function checkCanGenerate(){
  const active=AppState.riskList.filter(r=>!r.deleted);
  const hasPending=active.some(r=>r.status==='pending');
  const hasDraft=active.some(r=>r.status==='draft');
  return !hasPending && !hasDraft;
}
/* 有效风险：未删除且非 draft，用于统计/签字/报告 */
function getEffectiveRisks(){
  return AppState.riskList.filter(r=>!r.deleted&&r.status!=='draft');
}
/* 根据有效风险动态计算签字结论 */
function calcVerdict(){
  const a=getEffectiveRisks();
  const hasP0=a.some(r=>r.level==='P0');
  const hasP1=a.some(r=>r.level==='P1');
  const hasP2=a.some(r=>r.level==='P2');
  if(a.length===0) return {text:'可签字',color:'var(--success)',desc:'未发现需整改风险，可正常签字。'};
  if(hasP0) return {text:'不可签字',color:'var(--p0-red)',desc:'存在 P0 级风险，按"取最严级别"原则，整体判定为不可签字；补齐并闭合核心问题后方可降级。'};
  if(hasP1) return {text:'暂缓签字',color:'var(--p1-orange)',desc:'存在 P1 级风险，建议整改后复核，暂缓签字。'};
  return {text:'可签字（附条件）',color:'var(--p2-blue)',desc:'仅存在 P2 级建议优化项，可附条件签字，限期优化。'};
}

/* ============================================================
   登录 —— 直接进入新建页面
   ============================================================ */
function login(){
  AppState.isLoggedIn=true;
  AppState.projects=JSON.parse(JSON.stringify(MOCK_PROJECTS));
  $('login-page').style.display='none';
  $('workbench').style.display='flex';
  renderProjectList();
  showCreateProject();
}

/* ============================================================
   左侧项目列表与选择
   ============================================================ */
function renderProjectList(){
  $('project-list').innerHTML=AppState.projects.map(p=>`
    <div class="project-item ${AppState.currentProject&&AppState.currentProject.id===p.id?'active':''}" onclick="selectProject(${p.id})">
      <div class="project-name">${p.name}</div>
      <div class="project-meta"><span>${p.discipline}</span><span style="margin-left:auto">${p.date}</span></div>
      <div style="margin-top:6px"><span class="project-status ${statusClass(p.status)}">${statusText(p.status)}</span></div>
    </div>`).join('');
  $('project-count').textContent=AppState.projects.length;
}

function filterProjects(){
  const kw=$('project-search').value.toLowerCase();
  document.querySelectorAll('.project-item').forEach((item,i)=>{
    item.style.display=AppState.projects[i].name.toLowerCase().includes(kw)?'block':'none';
  });
}

/* 点击历史项目：演示案例显示结果，其他显示摘要 */
function selectProject(id){
  AppState.currentProject=AppState.projects.find(p=>p.id===id);
  renderProjectList();
  const p=AppState.currentProject;
  if(p.status==='pending'){
    // 待预审：进入新建页面，预填项目名称
    showCreateProjectWithName(p.name);
  } else if(p.id===1){
    // 仅演示案例（第一个项目）打开完整审查结果
    AppState.riskList=JSON.parse(JSON.stringify(INITIAL_RISKS));
    AppState.aiSnapshot=JSON.parse(JSON.stringify(INITIAL_RISKS));
    AppState.projectInfo={name:p.name,region:'华北地区',city:'北京',type:'城市公园',disciplines:['结构','景观建筑','景观小品']};
    updateReviewStats();
    renderResultPage();
    updateInfoPanel('result');
    updateFlowBar(5);
  } else {
    // 其他历史项目显示摘要页
    showProjectSummary(p);
  }
}

/* 历史项目摘要页 */
function showProjectSummary(p){
  AppState.currentView='summary';
  if(AppState.reviewTimer){clearInterval(AppState.reviewTimer);AppState.reviewTimer=null;}
  const statusDesc={blocked:'审查中发现 P0 级风险，当前不可签字',hold:'暂缓签字，存在需整改问题',conditional:'附条件签字，建议优化项需限期闭合',approved:'已完成审查，可签字'};
  $('main-content').innerHTML=`
    <div class="page-title">PROJECT SUMMARY · 历史项目</div>
    <div class="card">
      <div class="card-header">${esc(p.name)}</div>
      <div class="info-row"><span class="info-label">审查专业</span><span class="info-value">${p.discipline}</span></div>
      <div class="info-row"><span class="info-label">更新时间</span><span class="info-value">${p.date}</span></div>
      <div class="info-row"><span class="info-label">审查状态</span><span class="info-value"><span class="project-status ${statusClass(p.status)}">${statusText(p.status)}</span></span></div>
      <div style="margin-top:16px;padding:16px;background:var(--bg-input);border-radius:var(--radius-md);font-size:13px;color:var(--text-secondary);line-height:1.6">${statusDesc[p.status]||'历史项目'}</div>
      <div style="margin-top:16px;padding:12px;background:#fffbeb;border:1px solid #fcd34d;border-radius:var(--radius-md);font-size:13px;color:var(--warn)">&#9888; 当前为历史项目展示，完整交互请使用左侧"新建审图项目"或选择演示案例。</div>
    </div>`;
  $('info-panel').innerHTML=`<div class="info-section"><div class="info-section-title">项目信息</div><div class="info-row"><span class="info-label">名称</span><span class="info-value" style="font-size:12px">${esc(p.name)}</span></div><div class="info-row"><span class="info-label">专业</span><span class="info-value">${p.discipline}</span></div><div class="info-row"><span class="info-label">时间</span><span class="info-value">${p.date}</span></div><div class="info-row"><span class="info-label">状态</span><span class="info-value">${statusText(p.status)}</span></div></div>`;
  updateFlowBar(0);
}

/* 带预填名称的新建页面（用于待预审项目） */
function showCreateProjectWithName(name){
  showCreateProject();
  const inp=$('proj-name');
  if(inp){ inp.value=name; AppState.projectInfo.name=name; }
  updateInfoPanel('create');
}

   ============================================================ */

  AppState.currentView='create';
  AppState.currentProject=null;
  if(AppState.reviewTimer){ clearInterval(AppState.reviewTimer); AppState.reviewTimer=null; }
  AppState.uploadedFiles=[];
  AppState.supplementFiles=[];
  AppState.currentReviewStep=0;
  AppState.waitingForSupplement=false;
  AppState.supplementUploaded=false;
  AppState.projectInfo={name:'北方城市公园重檐六角景观亭施工图审查',region:'华北地区',city:'北京',type:'城市公园',disciplines:['结构','景观建筑','景观小品']};

  $('main-content').innerHTML=`
    <div class="page-title">NEW REVIEW · 审图输入</div>
    <div class="card">
      <div class="card-header">图纸上传</div>
      <div class="upload-zone" id="upload-zone" onclick="simulateUpload()">
        <div class="upload-zone-text">点击或拖拽上传施工图、节点详图、设计说明等</div>
        <div class="upload-zone-hint">支持 PDF、DWG、DOCX，可多文件上传</div>
      </div>
      <div class="file-list" id="file-list"></div>
    </div>
    <div class="card">
      <div class="card-header">项目信息</div>
      <div class="form-row"><div class="form-group" style="flex:2"><label>项目名称</label><input type="text" id="proj-name" value="${esc(AppState.projectInfo.name)}" oninput="syncCreatePanel()"></div></div>
      <div class="form-row">
        <div class="form-group"><label>地区</label><select id="proj-region" onchange="syncCreatePanel()">${['华北地区','华东地区','华中地区','华南地区','西南地区','西北地区'].map(r=>`<option ${AppState.projectInfo.region===r?'selected':''}>${r}</option>`).join('')}</select></div>
        <div class="form-group"><label>城市</label><select id="proj-city" onchange="syncCreatePanel()"><option selected>北京</option><option>天津</option><option>上海</option><option>广州</option><option>深圳</option><option>成都</option><option>重庆</option><option>武汉</option><option>西安</option><option>杭州</option></select></div>
        <div class="form-group"><label>项目类型</label><select id="proj-type" onchange="syncCreatePanel()">${['城市公园','居住区景观','城市广场','道路绿化','屋顶花园'].map(t=>`<option ${AppState.projectInfo.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
      </div>
      <div class="form-group" style="margin-top:16px"><label>审查专业（可多选）</label><div class="tag-select" id="discipline-tags">${['总图','土建','绿化种植','给排水','电气照明','结构','景观建筑','景观小品'].map(d=>`<div class="tag-option ${AppState.projectInfo.disciplines.includes(d)?'selected':''}" onclick="toggleDiscipline(this,'${d}')">${d}</div>`).join('')}</div></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="resetDemo()">取消</button>
      <button class="btn btn-secondary" onclick="showToast('草稿已保存')">保存草稿</button>
      <button class="btn btn-primary" onclick="startReview()">开始 AI 审图</button>
    </div>`;
  updateInfoPanel('create');
  updateFlowBar(1);
}

/* 实时同步右侧面板 */
function syncCreatePanel(){
  const n=$('proj-name'),r=$('proj-region'),c=$('proj-city'),t=$('proj-type');
  if(n) AppState.projectInfo.name=n.value;
  if(r) AppState.projectInfo.region=r.value;
  if(c) AppState.projectInfo.city=c.value;
  if(t) AppState.projectInfo.type=t.value;
  updateInfoPanel('create');
}

function simulateUpload(){
  if(AppState.uploadedFiles.length>0) return;
  AppState.uploadedFiles=JSON.parse(JSON.stringify(MOCK_FILES));
  const list=$('file-list');
  list.innerHTML=AppState.uploadedFiles.map(f=>`<div class="file-item fade-in-up"><div class="file-icon">&#128196;</div><div class="file-info"><div class="file-name">${f.name}</div><div class="file-meta">${f.pages}</div></div><div class="file-status">&#10003;</div></div>`).join('');
  showToast('图纸上传成功');
  updateInfoPanel('create');
}

function toggleDiscipline(el,d){
  el.classList.toggle('selected');
  if(el.classList.contains('selected')){ if(!AppState.projectInfo.disciplines.includes(d)) AppState.projectInfo.disciplines.push(d); }
  else{ AppState.projectInfo.disciplines=AppState.projectInfo.disciplines.filter(x=>x!==d); }
  updateInfoPanel('create');
}

/* ============================================================
   七步审图 —— 修复续跑逻辑
   ============================================================ */
function startReview(){
  syncCreatePanel();
  if(AppState.uploadedFiles.length===0){showToast('请先上传图纸');return;}
  if(AppState.projectInfo.disciplines.length===0){showToast('请选择至少一个审查专业');return;}

  AppState.currentView='reviewing';
  // 只在首次开始时将步骤设为0
  if(!AppState.supplementUploaded) AppState.currentReviewStep=0;
  AppState.waitingForSupplement=false;

  showReviewPage();
  updateInfoPanel('review');
  updateFlowBar(3);
  runReviewSequence();
}

function showReviewPage(){
  $('main-content').innerHTML=`
    <div class="review-header"><div class="status-badge" style="background:rgba(37,99,235,0.1);color:var(--accent-blue)">REVIEWING · 七步审图引擎</div></div>
    <div id="review-steps-container" class="step-list"></div>
    <div id="supplement-area"></div>`;
  renderReviewSteps();
}

function renderReviewSteps(){
  const container=$('review-steps-container');
  if(!container) return;
  container.innerHTML=REVIEW_STEPS.map((step,idx)=>{
    let state='waiting';
    if(idx<AppState.currentReviewStep) state='done';
    else if(idx===AppState.currentReviewStep) state='active';
    const stText=state==='done'?'已完成':state==='active'?'正在执行...':'等待中';
    const stCls=state==='done'?'s-done':state==='active'?'s-running':'s-waiting';
    return `<div class="step-item ${state} fade-in">
      <div class="step-num">${step.id}</div>
      <div class="step-body">
        <div class="step-name">${step.name}</div>
        <div class="step-desc">${step.desc}</div>
        <div class="step-status"><span class="${stCls}">${stText}</span></div>
      </div></div>`;
  }).join('');
}

function runReviewSequence(){
  renderReviewSteps();
  AppState.reviewTimer=setInterval(()=>{
    if(AppState.waitingForSupplement){ clearInterval(AppState.reviewTimer); AppState.reviewTimer=null; return; }
    AppState.currentReviewStep++;

    // 第3步（地标核查）完成后触发资料补全
    if(AppState.currentReviewStep===3 && !AppState.supplementUploaded){
      AppState.waitingForSupplement=true;
      renderReviewSteps();
      showSupplementRequest();
      clearInterval(AppState.reviewTimer); AppState.reviewTimer=null;
      return;
    }

    renderReviewSteps();
    updateInfoPanel('review');

    if(AppState.currentReviewStep>=REVIEW_STEPS.length){
      clearInterval(AppState.reviewTimer); AppState.reviewTimer=null;
      setTimeout(()=>showResultPage(),600);
    }
  },1000);
}

function showSupplementRequest(){
  const area=$('supplement-area');
  area.innerHTML=`<div class="supplement-card fade-in-up">
    <div class="supplement-title">&#9888; 资料完整性检查</div>
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:10px">系统发现以下关键资料缺失，当前无法直接形成可靠签字结论：</p>
    <ol class="supplement-list"><li>地勘报告或当地冻土深度依据</li><li>防雷接地专项设计图</li><li>景观、建筑、给排水、电气专业会签意见</li></ol>
    <div class="upload-zone" id="supplement-zone" onclick="simulateSupplementUpload()" style="padding:20px;margin-top:8px"><div class="upload-zone-text">点击补充上传缺失资料</div></div>
    <div class="file-list" id="supplement-file-list"></div></div>`;
  // 自动滚动到补充区
  setTimeout(()=>area.scrollIntoView({behavior:'smooth',block:'center'}),100);
  updateFlowBar(4);
}

function simulateSupplementUpload(){
  if(AppState.supplementFiles.length>0) return;
  AppState.supplementFiles=JSON.parse(JSON.stringify(MOCK_SUPPLEMENT_FILES));
  const list=$('supplement-file-list');
  list.innerHTML=AppState.supplementFiles.map(f=>`<div class="file-item fade-in"><div class="file-icon" style="background:#d1fae5;color:var(--success)">&#128196;</div><div class="file-info"><div class="file-name">${f.name}</div><div class="file-meta">${f.pages}</div></div><div class="file-status" style="color:var(--success)">&#10003;</div></div>`).join('');

  setTimeout(()=>{
    const area=$('supplement-area');
    area.innerHTML=`<div class="supplement-card supplement-success fade-in-up"><div class="supplement-title">&#10003; 关键资料已补充，七步审图继续执行</div></div>`;
    AppState.waitingForSupplement=false;
    AppState.supplementUploaded=true;
    showToast('资料补充完成，继续审查');
    updateFlowBar(3);
    // 从当前位置继续，不从0开始
    runReviewSequence();
  },800);
}

/* ============================================================
   审查结果
   ============================================================ */
function showResultPage(){
  AppState.currentView='result';
  AppState.riskList=JSON.parse(JSON.stringify(INITIAL_RISKS));
  // 保存完整 AI 初版快照
  AppState.aiSnapshot=JSON.parse(JSON.stringify(INITIAL_RISKS));
  updateReviewStats();
  renderResultPage();
  updateInfoPanel('result');
  updateFlowBar(5);
  scrollToTop();
}

function renderResultPage(){
  const active=getEffectiveRisks();
  const p0=active.filter(r=>r.level==='P0');
  const p1=active.filter(r=>r.level==='P1');
  const p2=active.filter(r=>r.level==='P2');
  const canGen=checkCanGenerate();
  const v=calcVerdict();
  const verdictBg=v.text==='不可签字'?'var(--p0-bg)':v.text==='暂缓签字'?'var(--p1-bg)':'var(--p2-bg)';
  const verdictBorder=v.text==='不可签字'?'var(--p0-red)':v.text==='暂缓签字'?'var(--p1-orange)':'var(--p2-blue)';

  $('main-content').innerHTML=`
    <div class="review-header"><div class="status-badge" style="background:rgba(220,38,38,0.1);color:var(--p0-red)">CHIEF REVIEW · 总工复核</div></div>
    <div class="verdict-card" style="background:${verdictBg};border-color:${verdictBorder}"><div class="verdict-title" style="color:${v.color}">${v.text}</div><div class="verdict-desc">${v.desc}</div></div>
    <div class="risk-summary">
      <div class="risk-stat p0"><div class="risk-stat-value">${p0.length}</div><div class="risk-stat-label">P0 必须闭合</div></div>
      <div class="risk-stat p1"><div class="risk-stat-value">${p1.length}</div><div class="risk-stat-label">P1 应整改</div></div>
      <div class="risk-stat p2"><div class="risk-stat-value">${p2.length}</div><div class="risk-stat-label">P2 建议优化</div></div>
    </div>
    <!-- 吸顶复核栏 -->
    <div class="sticky-review-bar">
      <div class="sticky-left">
        <span class="sticky-verdict" style="color:${v.color}">${v.text}</span>
        <span class="sticky-chip">待复核 <span class="n" id="stat-pending">${AppState.reviewStats.pending}</span></span>
        <span class="sticky-chip">已确认 <span class="n" id="stat-confirmed">${AppState.reviewStats.confirmed}</span></span>
        <span class="sticky-chip">已修正 <span class="n" id="stat-edited">${AppState.reviewStats.edited}</span></span>
        <span class="sticky-chip">总工补充 <span class="n" id="stat-added">${AppState.reviewStats.added}</span></span>
      </div>
      <div class="sticky-right">
        <button class="btn btn-secondary" style="font-size:12px;padding:6px 14px" onclick="showCompareView()">人机对比</button>
        <button class="btn btn-warn" style="font-size:12px;padding:6px 14px" onclick="batchConfirm()">批量确认其余意见</button>
        <button class="btn btn-success" style="font-size:12px;padding:6px 14px" id="btn-final-report" onclick="tryGenerateReport()" ${canGen?'':'disabled'}>生成终版报告</button>
      </div>
    </div>
    <div id="risk-list-container"></div>`;

  renderRiskList();
  updateReviewStats();
  updateInfoPanel('result');
}

function renderRiskList(){
  const container=$('risk-list-container');
  if(!container) return;
  const groups=['P0','P1','P2'];
  const titles={P0:'签字前必须闭合的问题',P1:'应整改后再复核的问题',P2:'建议优化的问题'};
  container.innerHTML=groups.map(g=>{
    const risks=AppState.riskList.filter(r=>r.level===g&&!r.deleted);
    if(!risks.length) return '';
    return `<div class="risk-section-title ${g.toLowerCase()}">${g==='P0'?'&#9679;':g==='P1'?'&#9670;':'&#9671;'} ${titles[g]}<button class="btn btn-secondary" style="padding:4px 12px;font-size:12px;margin-left:auto" onclick="addRisk('${g}')">+ 补充漏审项</button></div>${risks.map(r=>renderRiskCard(r)).join('')}`;
  }).join('');
}

function renderRiskCard(r){
  const isDraft=r.status==='draft';
  const isEdited=r.status==='edited';
  const isConfirmed=r.status==='confirmed';
  const isPending=r.status==='pending';
  const isAdded=r.isAdded;

  let labelHtml='';
  if(isDraft){
    labelHtml='<span class="risk-id-label" style="color:var(--warn);background:var(--warn-bg);border-color:#fcd34d">待填写</span>';
  } else if(isEdited){
    labelHtml='<span class="risk-id-label" style="color:var(--warn);background:var(--warn-bg);border-color:#fcd34d">总工已修正</span>';
  } else if(isAdded&&isConfirmed){
    labelHtml='<span class="risk-id-label" style="color:#7c3aed;background:#ede9fe;border-color:#c4b5fd">总工补充·已确认</span>';
  } else if(isAdded&&isPending){
    labelHtml='<span class="risk-id-label" style="color:#7c3aed;background:#ede9fe;border-color:#c4b5fd">总工补充·待确认</span>';
  } else if(isConfirmed){
    labelHtml='<span class="risk-id-label">总工已确认</span>';
  } else if(isPending){
    labelHtml='<span class="risk-id-label" style="color:var(--text-muted);background:var(--bg-card);border-color:var(--border-light)">待复核</span>';
  }

  return `<div class="risk-card ${r.level.toLowerCase()} ${isConfirmed?'confirmed':''} ${isDraft?'waiting':''} fade-in-up" id="risk-${r.id}">
    <div class="risk-header"><span class="risk-id">${r.id}</span>${labelHtml}</div>
    <div class="risk-title">${esc(r.title)}</div>
    <div class="risk-detail"><strong>问题描述：</strong>${esc(r.desc)}<br><br><strong>整改建议：</strong>${esc(r.suggestion)}<br><br><strong>判断依据：</strong>${esc(r.basis)}</div>
    <div class="risk-actions">
      ${isDraft?'':isConfirmed?`<button class="btn btn-secondary" style="padding:6px 14px;font-size:12px" onclick="unconfirmRisk('${r.id}')">撤销确认</button>`:`<button class="btn btn-success" style="padding:6px 14px;font-size:12px" onclick="confirmRisk('${r.id}')">确认</button>`}
      <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px" onclick="toggleEditRisk('${r.id}')">${isDraft?'填写内容':'修正'}</button>
      <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px;color:var(--p0-red);border-color:var(--p0-red)" onclick="deleteRisk('${r.id}')">删除</button>
    </div>
    <div class="risk-edit ${isDraft?'visible':''}" id="edit-${r.id}">
      <div class="risk-edit-row"><label>风险等级</label><select id="edit-level-${r.id}"><option ${r.level==='P0'?'selected':''}>P0</option><option ${r.level==='P1'?'selected':''}>P1</option><option ${r.level==='P2'?'selected':''}>P2</option></select></div>
      <div class="risk-edit-row"><label>问题标题</label><input type="text" id="edit-title-${r.id}" value="${esc(r.title)}"></div>
      <div class="risk-edit-row"><label>问题描述</label><textarea id="edit-desc-${r.id}">${esc(r.desc)}</textarea></div>
      <div class="risk-edit-row"><label>整改建议</label><textarea id="edit-suggestion-${r.id}">${esc(r.suggestion)}</textarea></div>
      <div class="risk-edit-row"><label>判断依据</label><input type="text" id="edit-basis-${r.id}" value="${esc(r.basis)}"></div>
      ${isDraft?'<div class="risk-edit-row"><button class="btn btn-secondary" style="font-size:12px;padding:6px 12px" onclick="loadDemoSupplement()">载入演示补充项</button></div>':''}
      <div style="display:flex;gap:8px"><button class="btn btn-primary" style="padding:6px 16px;font-size:12px" onclick="saveRiskEdit('${r.id}')">${isDraft?'保存补充意见':'保存'}</button><button class="btn btn-secondary" style="padding:6px 16px;font-size:12px" onclick="toggleEditRisk('${r.id}')">${isDraft?'取消':'关闭'}</button></div>
    </div></div>`;
}

function updateReviewStats(){
  const list=AppState.riskList.filter(r=>!r.deleted);
  AppState.reviewStats.pending=list.filter(r=>r.status==='pending').length;
  AppState.reviewStats.confirmed=list.filter(r=>r.status==='confirmed').length;
  AppState.reviewStats.edited=list.filter(r=>r.status==='edited').length;
  AppState.reviewStats.added=list.filter(r=>r.isAdded&&!r.deleted&&r.status!=='draft').length;
  AppState.reviewStats.deleted=AppState.riskList.filter(r=>r.deleted).length;

  const ids=['stat-pending','stat-confirmed','stat-edited','stat-added'];
  const vals=[AppState.reviewStats.pending,AppState.reviewStats.confirmed,AppState.reviewStats.edited,AppState.reviewStats.added];
  ids.forEach((id,i)=>{const el=$(id);if(el)el.textContent=vals[i];});
  const btn=$('btn-final-report');
  if(btn) btn.disabled=!checkCanGenerate();
}

function confirmRisk(id){
  const r=AppState.riskList.find(x=>x.id===id);
  if(r){r.status='confirmed';}
  renderResultPage();
  showToast('风险已确认');
}

function unconfirmRisk(id){
  const r=AppState.riskList.find(x=>x.id===id);
  if(r){r.status='pending';}
  renderResultPage();
  showToast('已撤销确认');
}

function toggleEditRisk(id){
  const el=$(`edit-${id}`);
  if(el) el.classList.toggle('visible');
}

function saveRiskEdit(id){
  const r=AppState.riskList.find(x=>x.id===id);
  if(!r) return;
  const title=$(`edit-title-${id}`).value.trim();
  const desc=$(`edit-desc-${id}`).value.trim();
  const suggestion=$(`edit-suggestion-${id}`).value.trim();
  const basis=$(`edit-basis-${id}`).value.trim();
  const level=$(`edit-level-${id}`).value;

  // draft 保存时校验必填
  if(r.status==='draft'){
    if(!title||title==='补充问题——请填写标题'){showToast('标题不能为空');return;}
    if(!desc||desc==='请填写问题描述'){showToast('问题描述不能为空');return;}
    if(!suggestion||suggestion==='请填写整改建议'){showToast('整改建议不能为空');return;}
    if(!basis){showToast('判断依据不能为空');return;}
    r.level=level;r.title=title;r.desc=desc;r.suggestion=suggestion;r.basis=basis;
    r.status='pending'; // draft → pending
    renderResultPage();
    showToast('补充意见已保存，请确认');
    return;
  }

  r.level=level;r.title=title;r.desc=desc;r.suggestion=suggestion;r.basis=basis;
  r.status='edited';
  renderResultPage();
  showToast('修改已保存');
}

/* 载入演示补充项 */
function loadDemoSupplement(){
  // 找到当前打开编辑的 draft 风险
  const draft=AppState.riskList.find(r=>r.status==='draft');
  if(!draft) return;
  const id=draft.id;
  const levelSel=$(`edit-level-${id}`);
  const titleInp=$(`edit-title-${id}`);
  const descArea=$(`edit-desc-${id}`);
  const sugArea=$(`edit-suggestion-${id}`);
  const basisInp=$(`edit-basis-${id}`);
  if(levelSel) levelSel.value='P0';
  if(titleInp) titleInp.value='无障碍通道设计缺失';
  if(descArea) descArea.value='亭子地面与周边场地存在高差，图纸未见无障碍坡道与扶手设计，轮椅使用者和老人无法安全到达。';
  if(sugArea) sugArea.value='补充无障碍坡道，坡度不大于1:12；高差位置设置扶手；明确铺装完成面标高及与周边场地竖向衔接关系。';
  if(basisInp) basisInp.value='GB 55019《建筑与市政工程无障碍通用规范》';
  showToast('已载入演示补充项，请点击保存');
}

function deleteRisk(id){
  const r=AppState.riskList.find(x=>x.id===id);
  if(r){r.deleted=true;r.status='deleted';}
  renderResultPage();
  showToast('风险已删除');
}

/* 补充漏审项 —— 新增为 draft 状态 */
function addRisk(level){
  const newId='R-'+String(AppState.riskList.length+1).padStart(3,'0');
  AppState.riskList.push({id:newId,level:level,title:'补充问题——请填写标题',desc:'请填写问题描述',suggestion:'请填写整改建议',basis:'',status:'draft',isAdded:true,deleted:false});
  renderResultPage();
  // 自动滚动到新增卡片并展开编辑
  setTimeout(()=>{
    const card=$(`risk-${newId}`);
    if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
    const edit=$(`edit-${newId}`);
    if(edit) edit.classList.add('visible');
  },100);
  showToast('已添加补充漏审项，请填写内容');
}

/* 批量确认所有 pending 风险（跳过 draft） */
function batchConfirm(){
  let count=0;
  let draftCount=0;
  AppState.riskList.forEach(r=>{
    if(r.deleted) return;
    if(r.status==='draft'){draftCount++;return;}
    if(r.status==='pending'){r.status='confirmed';count++;}
  });
  renderResultPage();
  updateInfoPanel('result');
  if(draftCount>0&&count>0) showToast(`已批量确认 ${count} 项，${draftCount} 项待填写未确认`);
  else if(draftCount>0) showToast(`${draftCount} 项待填写，请先完成补充意见`);
  else if(count>0) showToast(`已批量确认 ${count} 项风险`);
  else showToast('没有待确认的风险');
}

/* ============================================================
   人机协同对比 —— 使用 AI 初版快照
   ============================================================ */
function showCompareView(){
  AppState.currentView='compare';
  const aiMap={};
  AppState.aiSnapshot.forEach(r=>{aiMap[r.id]=r;});

  const edited=changed.filter(r=>r.status==='edited'&&!r.deleted);

            <div class="risk-id" style="display:inline-block;margin-bottom:4px">${ai.id} ${ai.level}</div>
            <span style="font-size:11px;color:var(--warn);font-weight:700;margin-left:6px">AI 原意见</span>
            <div style="font-size:13px;font-weight:700;margin-top:4px">${esc(ai.title)}</div>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.5;margin-top:4px"><strong>问题：</strong>${esc(ai.desc)}</div>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.5;margin-top:4px"><strong>建议：</strong>${esc(ai.suggestion)}</div>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.5;margin-top:4px"><strong>依据：</strong>${esc(ai.basis)}</div>
          </div>`;
        }).join('')}
        ${deleted.map(r=>{
          const ai=aiMap[r.id]||r;
          return `<div class="risk-card ${ai.level.toLowerCase()}" style="margin-bottom:12px;padding:14px">
            <div class="risk-id" style="display:inline-block;margin-bottom:4px">${ai.id} ${ai.level}</div>
            <span style="font-size:11px;color:var(--p0-red);font-weight:700;margin-left:6px">AI 原意见</span>
            <div style="font-size:13px;font-weight:700;margin-top:4px">${esc(ai.title)}</div>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.5;margin-top:4px"><strong>问题：</strong>${esc(ai.desc)}</div>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.5;margin-top:4px"><strong>建议：</strong>${esc(ai.suggestion)}</div>

        <div class="compare-col-title">总工终版</div>
        ${edited.map(r=>{
          const ai=aiMap[r.id]||r;
          const levelChanged=ai.level!==r.level;
          const titleChanged=ai.title!==r.title;
          const descChanged=ai.desc!==r.desc;
          const sugChanged=ai.suggestion!==r.suggestion;

function tryGenerateReport(){

}

function generateFinalReport(){
  AppState.currentView='report';

  updateInfoPanel('report');

}

function showReportPage(){
  $('main-content').innerHTML=`
    <div class="page-title">OUTPUT · 审查成果 <span class="tag">FINAL</span></div>

function simulateExport(btn,format){
  if(!btn){showToast(`演示导出完成：${format}`);return;}

  setTimeout(()=>{btn.textContent='演示导出完成';showToast(`演示导出完成：${AppState.currentReportType==='email'?'整改通知邮件':AppState.currentReportType==='report'?'预审报告':'审查意见表'} ${format}（演示模式）`);setTimeout(()=>{btn.textContent=orig;btn.disabled=false;},1500);},1000);
}

/* ============================================================
   底部流程栏
   ============================================================ */
function updateFlowBar(activeStep){
  for(let i=1;i<=5;i++){
    const circle=$(`flow-${i}`),label=$(`flow-l${i}`),line=$(`flow-line-${i}`);
    circle.classList.remove('active','done');label.classList.remove('active','done');
    if(line) line.classList.remove('active','done');
    if(i<activeStep){circle.classList.add('done');label.classList.add('done');if(line)line.classList.add('done');}
    else if(i===activeStep){circle.classList.add('active');label.classList.add('active');if(line&&i>1)line.classList.add('active');}
  }
}

  if(AppState.reviewTimer){clearInterval(AppState.reviewTimer);AppState.reviewTimer=null;}
  AppState.currentView='login';
  AppState.currentProject=null;
  AppState.uploadedFiles=[];
  AppState.supplementFiles=[];
  AppState.currentReviewStep=0;
  AppState.waitingForSupplement=false;
  AppState.supplementUploaded=false;
  AppState.riskList=[];
  AppState.aiSnapshot=[];
  AppState.reviewStats={pending:0,confirmed:0,edited:0,added:0,deleted:0};
  AppState.currentReportType='email';
  renderProjectList();
  showCreateProject();
  showToast('演示已重置');
}
