<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国演义 · 知识图谱</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
/* ========================================
   古风主题 CSS — 三国知识图谱
   ======================================== */

@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap');

:root {
  --parchment: #f3e5c9;
  --parchment-dark: #e8d5a3;
  --parchment-light: #faf3e3;
  --ink: #2c1810;
  --ink-light: #5c3d2e;
  --vermillion: #c41e3a;
  --vermillion-dark: #8b1a2b;
  --gold: #c9a96e;
  --gold-light: #e0c88e;
  --jade: #5b8c5a;
  --jade-light: #7dab7c;
  --blue-ink: #2c3e6b;
  --border-ornament: #b8956a;
  --shadow: rgba(44, 24, 16, 0.15);
  --text-main: #2c1810;
  --text-secondary: #6b5544;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes brushStroke {
  from { stroke-dashoffset: 1000; }
  to   { stroke-dashoffset: 0; }
}

@keyframes sealStamp {
  0%   { transform: scale(1.4); opacity: 0; }
  60%  { transform: scale(0.92); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes scrollUnroll {
  from { clip-path: inset(0 100% 0 0); }
  to   { clip-path: inset(0 0 0 0); }
}

@keyframes incense {
  0%, 100% { opacity: 0.3; transform: translateY(0) scaleX(1); }
  50%      { opacity: 0.6; transform: translateY(-8px) scaleX(0.8); }
}

body {
  font-family: 'ZCOOL XiaoWei', 'KaiTi', 'STKaiti', 'SimSun', 'FangSong', serif;
  background: var(--parchment);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(201,169,110,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(180,140,100,0.06) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='60' height='60' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  color: var(--text-main);
  min-height: 100vh;
  overflow: hidden;
}

/* ---------- 顶部标题栏 ---------- */
.header {
  background: linear-gradient(180deg, #1a0f0a 0%, #2c1810 100%);
  color: var(--gold-light);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--gold);
  position: relative;
  z-index: 10;
  box-shadow: 0 2px 20px var(--shadow);
}

.header::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.header-title {
  font-family: 'Ma Shan Zheng', 'KaiTi', cursive;
  font-size: 28px;
  letter-spacing: 6px;
  text-shadow: 0 0 20px rgba(201,169,110,0.3);
}

.header-decoration {
  display: flex; gap: 16px; align-items: center;
  font-size: 13px; color: var(--border-ornament);
  letter-spacing: 2px;
}

/* ---------- 主体布局 ---------- */
.main-container {
  display: flex;
  height: calc(100vh - 64px);
  position: relative;
}

/* ---------- 左侧面板 ---------- */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: linear-gradient(180deg, rgba(250,243,227,0.95) 0%, rgba(243,229,201,0.98) 100%);
  border-right: 1px solid var(--border-ornament);
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 14px;
  overflow-y: auto;
  z-index: 5;
  box-shadow: 2px 0 15px var(--shadow);
}

.sidebar-section {
  background: var(--parchment-light);
  border: 1px solid #d4c5a0;
  border-radius: 4px;
  padding: 12px;
  position: relative;
}

.sidebar-section::before {
  content: '';
  position: absolute;
  top: -1px; left: 20px; right: 20px;
  height: 1px;
  background: var(--vermillion);
}

.section-title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 18px;
  color: var(--vermillion-dark);
  text-align: center;
  letter-spacing: 3px;
  padding-bottom: 8px;
  border-bottom: 1px dotted #c9a96e;
  margin-bottom: 10px;
}

/* 图例 */
.legend-list { display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.legend-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid; flex-shrink: 0;
}
.legend-line { width: 18px; height: 2px; flex-shrink: 0; }

/* 搜索 */
.search-input {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--border-ornament);
  background: #fdf8f0;
  font-family: inherit; font-size: 14px;
  color: var(--ink);
  border-radius: 3px;
  outline: none;
  transition: border-color 0.3s;
}
.search-input:focus { border-color: var(--vermillion); }
.search-input::placeholder { color: #bfae90; }

.search-results {
  max-height: 160px; overflow-y: auto; margin-top: 6px;
}
.search-result-item {
  padding: 5px 8px; cursor: pointer; font-size: 13px;
  border-bottom: 1px dotted #e0d0b0;
  transition: background 0.2s;
}
.search-result-item:hover { background: rgba(201,169,110,0.2); }

/* 图层面板 */
.layer-panel { font-size: 13px; }
.layer-item {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 0; cursor: pointer;
}
.layer-checkbox { accent-color: var(--vermillion); }

/* 统计 */
.stats { font-size: 13px; color: var(--text-secondary); text-align: center; }
.stats span { color: var(--vermillion); font-weight: bold; }

/* 面包屑 */
.breadcrumb { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
.breadcrumb-item {
  cursor: pointer; color: var(--blue-ink);
  transition: color 0.2s;
}
.breadcrumb-item:hover { color: var(--vermillion); }
.breadcrumb-sep { color: var(--border-ornament); }

/* ---------- 图谱画布 ---------- */
.graph-container {
  flex: 1;
  position: relative;
  cursor: grab;
  background:
    radial-gradient(circle at 50% 50%, rgba(201,169,110,0.04) 0%, transparent 60%);
}

.graph-container:active { cursor: grabbing; }

.graph-container svg {
  width: 100%; height: 100%;
}

/* 水印 */
.watermark {
  position: absolute; bottom: 20px; right: 30px;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 48px;
  color: rgba(201,169,110,0.12);
  pointer-events: none;
  letter-spacing: 12px;
}

/* 提示 */
.tooltip {
  position: absolute; pointer-events: none;
  background: rgba(44,24,16,0.92);
  color: #f3e5c9;
  padding: 8px 14px;
  border-radius: 4px;
  font-size: 13px;
  line-height: 1.6;
  border: 1px solid var(--gold);
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 20;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}

/* ---------- 详情面板 (右侧弹出) ---------- */
.detail-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 30;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.3s;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.detail-panel {
  background: var(--parchment-light);
  border: 3px solid var(--border-ornament);
  border-radius: 6px;
  width: 540px; max-height: 80vh; overflow-y: auto;
  box-shadow: 0 12px 48px rgba(0,0,0,0.3);
  animation: sealStamp 0.5s ease-out;
  position: relative;
}

.detail-panel::before {
  content: '';
  position: absolute; inset: 6px;
  border: 1px solid #d4c5a0;
  pointer-events: none;
  border-radius: 3px;
}

.detail-header {
  background: linear-gradient(180deg, #2c1810, #3d2317);
  color: var(--gold-light);
  padding: 16px 20px;
  text-align: center;
  position: relative;
}

.detail-close {
  position: absolute; top: 10px; right: 16px;
  background: none; border: none;
  color: var(--gold); font-size: 22px;
  cursor: pointer; line-height: 1;
  transition: color 0.2s;
}
.detail-close:hover { color: #fff; }

.detail-name {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 32px; letter-spacing: 4px;
}

.detail-subtitle { font-size: 13px; color: var(--border-ornament); }

.detail-body { padding: 20px; position: relative; }

.detail-field { margin-bottom: 14px; }
.detail-label {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 16px; color: var(--vermillion-dark);
  border-left: 3px solid var(--vermillion);
  padding-left: 8px; margin-bottom: 6px;
  letter-spacing: 1px;
}
.detail-value { font-size: 14px; line-height: 1.8; color: var(--ink-light); }

.detail-relations { display: flex; flex-wrap: wrap; gap: 6px; }
.relation-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 13px;
  border: 1px solid;
  cursor: pointer;
  transition: all 0.2s;
}
.relation-tag:hover { transform: scale(1.05); }

.detail-actions {
  display: flex; gap: 10px; padding: 12px 20px 20px;
  justify-content: center; flex-wrap: wrap;
}

.btn-ancient {
  font-family: inherit;
  padding: 8px 20px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 14px;
  letter-spacing: 2px;
  transition: all 0.3s;
  border: 1px solid;
}

.btn-primary {
  background: var(--vermillion);
  color: #fff;
  border-color: var(--vermillion-dark);
}
.btn-primary:hover { background: var(--vermillion-dark); }

.btn-outline {
  background: transparent;
  color: var(--ink);
  border-color: var(--border-ornament);
}
.btn-outline:hover { background: rgba(201,169,110,0.2); }

/* ---------- 响应式 ---------- */
@media (max-width: 900px) {
  .sidebar { width: 220px; min-width: 220px; }
  .detail-panel { width: 90vw; }
}

@media (max-width: 640px) {
  .main-container { flex-direction: column; }
  .sidebar { width: 100%; min-width: auto; max-height: 200px; flex-shrink: 0; }
  .graph-container { height: 50vh; }
  .header-title { font-size: 20px; letter-spacing: 2px; }
}

/* ---------- 节点动画 ---------- */
.node-enter {
  animation: sealStamp 0.6s ease-out;
}

/* 滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--parchment-dark); }
::-webkit-scrollbar-thumb { background: var(--border-ornament); border-radius: 3px; }

/* 图控制按钮 */
.ctrl-buttons {
  position: absolute; bottom: 16px; left: 16px;
  display: flex; gap: 8px; z-index: 10;
}
.ctrl-btn {
  background: rgba(250,243,227,0.9);
  border: 1px solid var(--border-ornament);
  padding: 6px 12px;
  font-family: inherit; font-size: 12px;
  cursor: pointer; border-radius: 3px;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.ctrl-btn:hover { background: rgba(201,169,110,0.3); }

/* 烟雾效果装饰 */
.incense-container {
  position: absolute; top: 80px; right: 40px;
  pointer-events: none; z-index: 2;
}
.incense {
  position: absolute;
  width: 2px; height: 20px;
  background: linear-gradient(to top, rgba(201,169,110,0.2), transparent);
  border-radius: 50%;
  animation: incense 4s ease-in-out infinite;
}
.incense:nth-child(1) { animation-delay: 0s; left: 0; }
.incense:nth-child(2) { animation-delay: 0.8s; left: 6px; }
.incense:nth-child(3) { animation-delay: 1.6s; left: 12px; }
.incense:nth-child(4) { animation-delay: 2.4s; left: 18px; }
.incense:nth-child(5) { animation-delay: 3.2s; left: 24px; }
</style>
</head>
<body>

<!-- ===== 顶部标题栏 ===== -->
<header class="header">
  <div class="header-title">🐉 三国演义 · 知识图谱</div>
  <div class="header-decoration">
    <span>魏</span><span>·</span><span>蜀</span><span>·</span><span>吴</span>
    <span style="margin-left:12px;">群雄逐鹿 · 天下三分</span>
  </div>
</header>

<!-- ===== 主体 ===== -->
<div class="main-container">

  <!-- 左侧栏 -->
  <aside class="sidebar" id="sidebar">

    <!-- 搜索 -->
    <div class="sidebar-section">
      <div class="section-title">🔍 寻访英雄</div>
      <input type="text" class="search-input" id="searchInput"
             placeholder="输入人物、事件或国家…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>

    <!-- 图例 -->
    <div class="sidebar-section">
      <div class="section-title">📜 图例</div>
      <div class="legend-list">
        <div class="legend-item">
          <div class="legend-dot" style="background:#c41e3a;border-color:#8b1a2b;"></div>
          <span>蜀汉 · 人物</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#2c3e6b;border-color:#1a2b4a;"></div>
          <span>曹魏 · 人物</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#5b8c5a;border-color:#3d6b3d;"></div>
          <span>东吴 · 人物</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#c9a96e;border-color:#a08050;"></div>
          <span>其他势力</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#e8d5a3;border-color:#b8956a;width:18px;height:10px;border-radius:2px;"></div>
          <span>历史事件</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#f3e5c9;border-color:#b8956a;width:18px;height:18px;border-radius:2px;"></div>
          <span>国家 / 势力</span>
        </div>
        <div class="legend-item" style="margin-top:4px;">
          <div class="legend-line" style="background:#c41e3a;"></div>
          <span style="font-size:12px;">结义 / 亲属</span>
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background:#2c3e6b;"></div>
          <span style="font-size:12px;">君臣 / 从属</span>
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background:#8b6914;border-bottom:2px dashed #8b6914;"></div>
          <span style="font-size:12px;">敌对 / 交战</span>
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background:#5b8c5a;border-bottom:2px dotted #5b8c5a;"></div>
          <span style="font-size:12px;">同盟 / 合作</span>
        </div>
      </div>
    </div>

    <!-- 显示图层 -->
    <div class="sidebar-section">
      <div class="section-title">🎚️ 图层</div>
      <div class="layer-panel">
        <label class="layer-item">
          <input type="checkbox" class="layer-checkbox" data-layer="character" checked>
          <span>人物节点</span>
        </label>
        <label class="layer-item">
          <input type="checkbox" class="layer-checkbox" data-layer="event" checked>
          <span>事件节点</span>
        </label>
        <label class="layer-item">
          <input type="checkbox" class="layer-checkbox" data-layer="kingdom" checked>
          <span>国家节点</span>
        </label>
      </div>
    </div>

    <!-- 统计 -->
    <div class="sidebar-section">
      <div class="stats">
        当前可见：<span id="visibleNodes">0</span> 节点 ·
        <span id="visibleEdges">0</span> 关系
        <br>探索深度：<span id="exploreDepth">0</span> 层
      </div>
    </div>

    <!-- 探索路径 -->
    <div class="sidebar-section">
      <div class="section-title">🗺️ 探索路径</div>
      <div class="breadcrumb" id="breadcrumb">
        <span style="color:var(--text-secondary);">点击图谱中的节点开始探索…</span>
      </div>
    </div>
  </aside>

  <!-- 图谱画布 -->
  <div class="graph-container" id="graphContainer">
    <div class="incense-container">
      <div class="incense"></div><div class="incense"></div>
      <div class="incense"></div><div class="incense"></div><div class="incense"></div>
    </div>
    <div class="watermark">天下三分</div>
    <div class="ctrl-buttons">
      <button class="ctrl-btn" id="btnReset" title="重置视图">🔄 重置</button>
      <button class="ctrl-btn" id="btnExpandAll" title="展开全部">📖 全览</button>
      <button class="ctrl-btn" id="btnCenter" title="居中显示">🎯 居中</button>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </div>

</div>

<!-- ===== 详情弹窗 (模板) ===== -->
<div class="detail-overlay" id="detailOverlay" style="display:none;">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<!-- ===== 主脚本 ===== -->
<script>
// ============================================================
//  三国知识图谱 — 数据 & 可视化
// ============================================================

// ---------- 数据定义 ----------

const KINGDOMS = {
  wei:  { id:'wei',  type:'kingdom', name:'曹魏', fullName:'魏国', color:'#2c3e6b',
          founder:'曹操', capital:'洛阳', period:'220年—266年',
          desc:'三国中最强大的政权。曹操奠基，曹丕称帝建魏，历五帝，终为司马氏所篡。',

          ruler:['孙权','孙亮','孙休','孙皓'] },
  han:  { id:'han',  type:'kingdom', name:'东汉', fullName:'东汉王朝', color:'#c9a96e',

          desc:'汉朝末期，宦官外戚争斗，黄巾起义，天下大乱，最终曹丕篡汉。',

};

const CHARACTERS = {
  // ===== 蜀汉 =====
  liubei:   { id:'liubei',   type:'character', name:'刘备',   kingdom:'shu', born:161, died:223,
              title:'汉昭烈帝', style:'字玄德',
              desc:'蜀汉开国皇帝，汉室宗亲。仁德宽厚，知人善任，三顾茅庐请诸葛亮出山。赤壁之战后取荆州、益州，建立蜀汉。夷陵之战败后病逝白帝城，托孤诸葛亮。',

              desc:'蜀汉名将，五虎上将之首。忠义无双，温酒斩华雄，过五关斩六将。镇守荆州时北伐樊城，水淹七军威震华夏，后遭东吴吕蒙偷袭，败走麦城被擒杀。后世尊为"武圣"。',

              desc:'蜀汉名将，五虎上将之一。勇猛过人，当阳桥独退曹军。粗中有细，义释严颜。后因兄仇心急，被部将刺杀。',
              tags:['五虎上将','勇猛','万人敌'] },
  zhugeliang:{ id:'zhugeliang', type:'character', name:'诸葛亮', kingdom:'shu', born:181, died:234,

// ============================================================
//  图谱引擎
// ============================================================

// 状态
let visibleNodes = new Set();
let visibleEdges = new Set();
let explorationPath = [];    // {id, name, depth}
let currentDepth = 0;

// 初始可见节点（三大国家 + 核心事件）
const INITIAL_NODES = ['wei','shu','wu','han','threeKingdoms','yellowTurban','chibi'];

// D3 相关
let svg, g, simulation, zoom;
let nodesData = [], linksData = [];
let nodeElements, linkElements, labelElements;

// 初始化
function initGraph() {
  const container = document.getElementById('graphContainer');
  const W = container.clientWidth;
  const H = container.clientHeight;

  svg = d3.select('#graphContainer')
    .append('svg')
    .attr('width', W)
    .attr('height', H);

  // 定义渐变和滤镜
  const defs = svg.append('defs');

  // 发光效果
  const glow = defs.append('filter')
    .attr('id', 'glow')
    .attr('x', '-50%').attr('y', '-50%')
    .attr('width', '200%').attr('height', '200%');
  glow.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
  glow.append('feMerge')
    .selectAll('feMergeNode')
    .data(['blur', 'SourceGraphic'])
    .enter().append('feMergeNode').attr('in', d => d);

  // 阴影
  const shadow = defs.append('filter')
    .attr('id', 'shadow')
    .attr('x', '-30%').attr('y', '-30%')
    .attr('width', '160%').attr('height', '160%');
  shadow.append('feDropShadow').attr('dx', 2).attr('dy', 3)
    .attr('stdDeviation', 3).attr('flood-opacity', 0.25);

  // 主图层
  g = svg.append('g');

  // 连线组
  g.append('g').attr('class', 'links-group');
  // 节点组
  g.append('g').attr('class', 'nodes-group');
  // 标签组
  g.append('g').attr('class', 'labels-group');

  // 力模拟
  simulation = d3.forceSimulation()
    .force('link', d3.forceLink().id(d => d.id).distance(140).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-500))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(50))
    .force('x', d3.forceX(W / 2).strength(0.03))
    .force('y', d3.forceY(H / 2).strength(0.03))
    .on('tick', tick);

  // 缩放
  zoom = d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => { g.attr('transform', event.transform); });
  svg.call(zoom);

  // 初始展开
  INITIAL_NODES.forEach(id => {
    expandNode(id, 0);
  });

  updateGraph();
  updateStats();

  // 窗口缩放
  window.addEventListener('resize', () => {
    const nW = container.clientWidth;
    const nH = container.clientHeight;
    svg.attr('width', nW).attr('height', nH);
    simulation.force('center', d3.forceCenter(nW / 2, nH / 2));
    simulation.alpha(0.3).restart();
  });
}

// 获取节点数据
function getNodeData(id) {
  return CHARACTERS[id] || EVENTS[id] || KINGDOMS[id] || null;
}

// 获取节点类型
function getNodeType(id) {
  const d = getNodeData(id);
  return d ? d.type : null;
}

// 递归展开节点
function expandNode(id, depth) {
  if (visibleNodes.has(id)) return;

  const data = getNodeData(id);
  if (!data) return;

  visibleNodes.add(id);
  if (depth > currentDepth) currentDepth = depth;

  // 添加到路径
  if (!explorationPath.find(p => p.id === id)) {
    explorationPath.push({ id, name: data.name, depth });
  }

  // 找到所有关联
  RELATIONS.forEach(rel => {
    if (rel.source === id && !visibleNodes.has(rel.target)) {
      visibleEdges.add(`${rel.source}->${rel.target}`);
      expandNode(rel.target, depth + 1);
    }
    if (rel.target === id && !visibleNodes.has(rel.source)) {
      visibleEdges.add(`${rel.source}->${rel.target}`);
      expandNode(rel.source, depth + 1);
    }
    if (rel.source === id || rel.target === id) {
      visibleEdges.add(`${rel.source}->${rel.target}`);
    }
  });
}

// 点击节点 — 递归展开一层
function onNodeClick(event, d) {
  event.stopPropagation();

  const id = d.id;
  const depth = (explorationPath.find(p => p.id === id)?.depth ?? 0) + 1;

  // 展开关联节点
  let expanded = 0;
  RELATIONS.forEach(rel => {
    if (rel.source === id && !visibleNodes.has(rel.target)) {
      expandNode(rel.target, depth);
      expanded++;
    }
    if (rel.target === id && !visibleNodes.has(rel.source)) {
      expandNode(rel.source, depth);
      expanded++;
    }
    if (rel.source === id || rel.target === id) {
      visibleEdges.add(`${rel.source}->${rel.target}`);
    }
  });

  updateGraph();
  updateStats();
  updateBreadcrumb();
  showDetailPanel(id);

  // 高亮选中节点
  nodeElements
    .attr('stroke-width', n => n.id === id ? 4 : 1.5)
    .attr('filter', n => n.id === id ? 'url(#glow)' : null);

  // 脉冲动画
  if (expanded > 0) {
    pulseNode(id);
  }
}

// 节点脉冲动画
function pulseNode(id) {
  const n = nodeElements.filter(d => d.id === id);
  n.transition().duration(200)
    .attr('r', d => getNodeRadius(d) * 1.5)
    .transition().duration(400)
    .attr('r', d => getNodeRadius(d));
}

// 获取节点半径
function getNodeRadius(d) {
  if (d.type === 'kingdom') return 28;
  if (d.type === 'event') return 18;
  return 22;
}

// 获取节点形状
function getNodeShape(d) {
  if (d.type === 'kingdom') return 'rect';
  if (d.type === 'event') return 'diamond';
  return 'circle';
}

// 获取节点颜色
function getNodeColor(d) {
  if (d.type === 'kingdom') return d.color || '#c9a96e';
  if (d.type === 'event') return d.color || '#8b6914';
  const k = d.kingdom;
  if (k === 'shu') return '#c41e3a';
  if (k === 'wei') return '#2c3e6b';
  if (k === 'wu') return '#5b8c5a';
  return '#c9a96e';
}

// 获取连线样式
function getEdgeStyle(d) {
  switch(d.type) {
    case 'sworn': return { color: '#c41e3a', width: 2.5, dash: '' };
    case 'ruler': return { color: '#2c3e6b', width: 2, dash: '' };
    case 'family': return { color: '#c41e3a', width: 2, dash: '8,3' };
    case 'rival': return { color: '#8b1a2b', width: 1.8, dash: '5,4' };
    case 'alliance': return { color: '#5b8c5a', width: 2, dash: '3,5' };
    case 'colleague': return { color: '#6b7b8d', width: 1.5, dash: '' };
    case 'participate': return { color: '#8b6914', width: 1.5, dash: '2,3' };
    case 'special': return { color: '#9b59b6', width: 1.5, dash: '4,6' };
    default: return { color: '#aaa', width: 1, dash: '' };
  }
}

// 更新图谱
function updateGraph() {
  // 构建节点列表
  nodesData = [];
  linksData = [];

  visibleNodes.forEach(id => {
    const data = getNodeData(id);
    if (data) {
      const layerCheckboxes = document.querySelectorAll('.layer-checkbox');
      let show = true;
      layerCheckboxes.forEach(cb => {
        if (cb.dataset.layer === data.type && !cb.checked) show = false;
      });
      if (show) nodesData.push({ ...data, _id: id });
    }
  });

  const nodeIdSet = new Set(nodesData.map(n => n._id));

  visibleEdges.forEach(key => {
    const [s, t] = key.split('->');
    if (nodeIdSet.has(s) && nodeIdSet.has(t)) {
      const rel = RELATIONS.find(r =>
        (r.source === s && r.target === t) || (r.source === t && r.target === s)
      );
      linksData.push({
        source: s, target: t,
        type: rel ? rel.type : 'unknown',
        label: rel ? rel.label : '',
      });
    }
  });

  // 更新模拟
  simulation.nodes(nodesData);
  simulation.force('link').links(linksData);

  // --- 连线 ---
  linkElements = g.select('.links-group').selectAll('line')
    .data(linksData, d => `${d.source.id || d.source}->${d.target.id || d.target}`);

  linkElements.exit().remove();

  const linkEnter = linkElements.enter().append('line')
    .attr('stroke', d => getEdgeStyle(d).color)
    .attr('stroke-width', d => getEdgeStyle(d).width)
    .attr('stroke-dasharray', d => getEdgeStyle(d).dash)
    .attr('stroke-opacity', 0.5)
    .attr('stroke-linecap', 'round');

  linkElements = linkEnter.merge(linkElements);

  // --- 节点 ---
  nodeElements = g.select('.nodes-group').selectAll('g.node')
    .data(nodesData, d => d._id);

  nodeElements.exit().remove();

  const nodeEnter = nodeElements.enter().append('g')
    .attr('class', 'node')
    .style('cursor', 'pointer')
    .on('click', onNodeClick)
    .on('mouseenter', onNodeHover)
    .on('mouseleave', onNodeHoverEnd)
    .call(d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', (event, d) => {
        d.fx = event.x; d.fy = event.y;
      })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
    );

  // 绘制圆形节点
  nodeEnter.filter(d => d.type !== 'kingdom' && d.type !== 'event')
    .append('circle')
    .attr('r', d => getNodeRadius(d))
    .attr('fill', d => getNodeColor(d))
    .attr('stroke', d => d3.color(getNodeColor(d)).darker(0.6))
    .attr('stroke-width', 1.5)
    .attr('filter', 'url(#shadow)');

  // 国家节点（方形）
  nodeEnter.filter(d => d.type === 'kingdom')
    .append('rect')
    .attr('x', d => -getNodeRadius(d))
    .attr('y', d => -getNodeRadius(d) * 0.7)
    .attr('width', d => getNodeRadius(d) * 2)
    .attr('height', d => getNodeRadius(d) * 1.4)
    .attr('rx', 4)
    .attr('fill', d => getNodeColor(d))
    .attr('stroke', d => d3.color(getNodeColor(d)).darker(0.6))
    .attr('stroke-width', 1.5)
    .attr('filter', 'url(#shadow)');

  // 事件节点（菱形）
  nodeEnter.filter(d => d.type === 'event')
    .append('polygon')
    .attr('points', d => {
      const r = getNodeRadius(d);
      return `0,${-r} ${r * 0.7},0 0,${r} ${-r * 0.7},0`;
    })
    .attr('fill', d => getNodeColor(d))
    .attr('stroke', d => d3.color(getNodeColor(d)).darker(0.6))
    .attr('stroke-width', 1.5)
    .attr('filter', 'url(#shadow)');

  // 节点内部图标文字
  nodeEnter.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', '0.35em')
    .attr('fill', '#fff')
    .attr('font-size', d => d.type === 'kingdom' ? 14 : 11)
    .attr('font-family', "'KaiTi','STKaiti',serif")
    .attr('pointer-events', 'none')
    .text(d => d.name.charAt(0));

  nodeElements = nodeEnter.merge(nodeElements);

  // --- 标签 ---
  labelElements = g.select('.labels-group').selectAll('text.label')
    .data(nodesData, d => d._id);

  labelElements.exit().remove();

  const labelEnter = labelElements.enter().append('text')
    .attr('class', 'label')
    .attr('text-anchor', 'middle')
    .attr('dy', d => getNodeRadius(d) + 16)
    .attr('font-size', 12)
    .attr('font-family', "'KaiTi','STKaiti','SimSun',serif")
    .attr('fill', '#3d2317')
    .attr('pointer-events', 'none')
    .text(d => d.name);

  labelElements = labelEnter.merge(labelElements);

  simulation.alpha(0.8).restart();
}

// 力导向 tick
function tick() {
  linkElements
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);

  nodeElements.attr('transform', d => `translate(${d.x},${d.y})`);

  labelElements
    .attr('x', d => d.x)
    .attr('y', d => d.y);
}

// 悬停
function onNodeHover(event, d) {
  const tooltip = document.getElementById('tooltip');
  const info = [];
  info.push(`<strong>${d.name}</strong>`);
  if (d.title) info.push(`<span style="color:#c9a96e;">${d.title}</span>`);
  if (d.style) info.push(`${d.style}`);
  if (d.period) info.push(`时间：${d.period}`);
  if (d.type === 'event') info.push(`年份：${d.year}`);
  if (d.desc) {
    const short = d.desc.substring(0, 80) + (d.desc.length > 80 ? '…' : '');
    info.push(`<span style="color:#bfae90;">${short}</span>`);
  }
  info.push('<span style="color:#e0c88e;">点击展开关联 →</span>');

  tooltip.innerHTML = info.join('<br>');
  tooltip.style.opacity = 1;
  tooltip.style.left = (event.pageX + 16) + 'px';
  tooltip.style.top = (event.pageY - 30) + 'px';
}

function onNodeHoverEnd() {
  document.getElementById('tooltip').style.opacity = 0;
}

// 显示详情面板
function showDetailPanel(id) {
  const data = getNodeData(id);
  if (!data) return;

  const overlay = document.getElementById('detailOverlay');
  const panel = document.getElementById('detailPanel');

  let html = '';

  // 头
  html += `<div class="detail-header">`;
  html += `<button class="detail-close" onclick="closeDetail()">✕</button>`;
  html += `<div class="detail-name">${data.name}</div>`;
  if (data.title) html += `<div class="detail-subtitle">${data.title}</div>`;
  if (data.style) html += `<div class="detail-subtitle">${data.style}</div>`;
  html += `</div>`;

  // 正文
  html += `<div class="detail-body">`;

  if (data.type === 'character') {
    html += `<div class="detail-field">`;
    html += `<div class="detail-label">生平</div>`;
    html += `<div class="detail-value">${data.desc}</div>`;
    html += `</div>`;
    if (data.born || data.died) {
      html += `<div class="detail-field">`;
      html += `<div class="detail-label">生卒</div>`;
      html += `<div class="detail-value">`;
      html += `${data.born ? '公元'+data.born+'年' : '?'} — ${data.died ? '公元'+data.died+'年' : '?'}`;
      html += `</div></div>`;
    }
    if (data.tags && data.tags.length) {
      html += `<div class="detail-field">`;
      html += `<div class="detail-label">标签</div>`;
      html += `<div class="detail-relations">`;
      data.tags.forEach(t => {
        html += `<span class="relation-tag" style="background:rgba(201,169,110,0.15);border-color:#c9a96e;color:#5c3d2e;">${t}</span>`;
      });
      html += `</div></div>`;
    }
  }

  if (data.type === 'event') {
    html += `<div class="detail-field">`;
    html += `<div class="detail-label">年份</div>`;
    html += `<div class="detail-value">公元 ${data.year}</div>`;
    html += `</div>`;
    html += `<div class="detail-field">`;
    html += `<div class="detail-label">详情</div>`;
    html += `<div class="detail-value">${data.desc}</div>`;
    html += `</div>`;
  }

  if (data.type === 'kingdom') {
    html += `<div class="detail-field">`;
    html += `<div class="detail-label">时期</div>`;
    html += `<div class="detail-value">${data.period}</div>`;
    html += `</div>`;
    html += `<div class="detail-field">`;
    html += `<div class="detail-label">都城</div>`;
    html += `<div class="detail-value">${data.capital}</div>`;
    html += `</div>`;
    html += `<div class="detail-field">`;
    html += `<div class="detail-label">简介</div>`;
    html += `<div class="detail-value">${data.desc}</div>`;
    html += `</div>`;
    if (data.ruler) {
      html += `<div class="detail-field">`;
      html += `<div class="detail-label">君主</div>`;
      html += `<div class="detail-value">${data.ruler.join(' → ')}</div>`;
      html += `</div>`;
    }
  }

  // 关联关系
  const related = [];
  RELATIONS.forEach(rel => {
    if (rel.source === id) related.push({ target: rel.target, type: rel.type, label: rel.label });
    if (rel.target === id) related.push({ target: rel.source, type: rel.type, label: rel.label });
  });

  if (related.length) {
    html += `<div class="detail-field">`;
    html += `<div class="detail-label">关联节点（点击跳转）</div>`;
    html += `<div class="detail-relations">`;
    related.forEach(r => {
      const tData = getNodeData(r.target);
      if (tData) {
        const color = r.type === 'rival' ? '#8b1a2b' :
                      r.type === 'sworn' || r.type === 'family' ? '#c41e3a' :
                      r.type === 'ruler' ? '#2c3e6b' :
                      r.type === 'alliance' ? '#5b8c5a' : '#c9a96e';
        html += `<span class="relation-tag" style="background:${color}15;border-color:${color};color:${color};"
                     onclick="jumpToNode('${r.target}')" title="${r.label}">${r.label || ''} → ${tData.name}</span>`;
      }
    });
    html += `</div></div>`;
  }

  html += `</div>`;

  // 操作按钮
  html += `<div class="detail-actions">`;
  html += `<button class="btn-ancient btn-primary" onclick="expandFromDetail('${id}')">🔍 递归展开</button>`;
  html += `<button class="btn-ancient btn-outline" onclick="focusOnNode('${id}')">🎯 聚焦此节点</button>`;
  html += `<button class="btn-ancient btn-outline" onclick="closeDetail()">关闭</button>`;
  html += `</div>`;

  panel.innerHTML = html;
  overlay.style.display = 'flex';
}

function closeDetail() {
  document.getElementById('detailOverlay').style.display = 'none';
  nodeElements.attr('stroke-width', 1.5).attr('filter', null);
}

function jumpToNode(id) {
  if (!visibleNodes.has(id)) {
    expandNode(id, currentDepth + 1);
    updateGraph();
    updateStats();
    updateBreadcrumb();
  }
  showDetailPanel(id);
  focusOnNode(id);
}

function expandFromDetail(id) {
  const depth = (explorationPath.find(p => p.id === id)?.depth ?? 0) + 1;
  let expanded = 0;
  RELATIONS.forEach(rel => {
    if (rel.source === id && !visibleNodes.has(rel.target)) {
      expandNode(rel.target, depth); expanded++;
    }
    if (rel.target === id && !visibleNodes.has(rel.source)) {
      expandNode(rel.source, depth); expanded++;
    }
    if (rel.source === id || rel.target === id) {
      visibleEdges.add(`${rel.source}->${rel.target}`);
    }
  });
  updateGraph();
  updateStats();
  updateBreadcrumb();
  if (expanded === 0) {
    alert('当前节点已无更多可展开的关联。');
  }
  showDetailPanel(id);
}

function focusOnNode(id) {
  const node = nodesData.find(n => n._id === id);
  if (!node) return;

  const container = document.getElementById('graphContainer');
  const W = container.clientWidth;
  const H = container.clientHeight;
  const transform = d3.zoomIdentity
    .translate(W / 2, H / 2)
    .scale(1.5)
    .translate(-node.x, -node.y);

  svg.transition().duration(750).call(zoom.transform, transform);

  // 高亮
  nodeElements
    .attr('stroke-width', n => n._id === id ? 4 : 1.5)
    .attr('filter', n => n._id === id ? 'url(#glow)' : null)
    .attr('opacity', n => (n._id === id || linksData.some(
      l => (l.source.id || l.source) === id && (l.target.id || l.target) === n._id ||
           (l.target.id || l.target) === id && (l.source.id || l.source) === n._id
    )) ? 1 : 0.4);
}

// 更新统计
function updateStats() {
  document.getElementById('visibleNodes').textContent = nodesData.length;
  document.getElementById('visibleEdges').textContent = linksData.length;
  document.getElementById('exploreDepth').textContent = currentDepth;
}

// 更新面包屑
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (explorationPath.length === 0) {
    bc.innerHTML = '<span style="color:var(--text-secondary);">点击图谱中的节点开始探索…</span>';
    return;
  }
  bc.innerHTML = explorationPath.map((p, i) => {
    return `<span class="breadcrumb-item" onclick="jumpToNode('${p.id}')">${p.name}</span>` +
           (i < explorationPath.length - 1 ? '<span class="breadcrumb-sep">▸</span>' : '');
  }).join('');
}

// ---------- 事件绑定 ----------

// 搜索
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const container = document.getElementById('searchResults');
  if (!q) { container.innerHTML = ''; return; }

  const allData = { ...KINGDOMS, ...CHARACTERS, ...EVENTS };
  const results = Object.entries(allData).filter(([id, d]) =>
    d.name.includes(q) || (d.desc && d.desc.includes(q)) ||
    (d.title && d.title.includes(q)) || (d.style && d.style.includes(q))
  ).slice(0, 10);

  container.innerHTML = results.map(([id, d]) =>
    `<div class="search-result-item" onclick="jumpToNode('${id}')">
      <strong>${d.name}</strong>
      <span style="color:var(--text-secondary);font-size:11px;">
        ${d.type === 'character' ? '人物' : d.type === 'event' ? '事件' : '国家'}
        ${d.title ? '·' + d.title : ''}
      </span>
    </div>`
  ).join('');
});

// 图层切换
document.querySelectorAll('.layer-checkbox').forEach(cb => {
  cb.addEventListener('change', () => {
    updateGraph();
    updateStats();
  });
});

// 按钮
document.getElementById('btnReset').addEventListener('click', () => {
  visibleNodes.clear();
  visibleEdges.clear();
  explorationPath = [];
  currentDepth = 0;
  INITIAL_NODES.forEach(id => expandNode(id, 0));
  updateGraph();
  updateStats();
  updateBreadcrumb();
  closeDetail();

  const container = document.getElementById('graphContainer');
  svg.transition().duration(750).call(
    zoom.transform,
    d3.zoomIdentity.translate(container.clientWidth / 2, container.clientHeight / 2).scale(1)
  );
});

document.getElementById('btnExpandAll').addEventListener('click', () => {
  const allIds = [...Object.keys(KINGDOMS), ...Object.keys(CHARACTERS), ...Object.keys(EVENTS)];
  allIds.forEach(id => expandNode(id, 0));
  updateGraph();
  updateStats();
  updateBreadcrumb();
});

document.getElementById('btnCenter').addEventListener('click', () => {
  const container = document.getElementById('graphContainer');
  svg.transition().duration(750).call(
    zoom.transform,
    d3.zoomIdentity.translate(container.clientWidth / 2, container.clientHeight / 2).scale(1)
  );
  nodeElements.attr('stroke-width', 1.5).attr('filter', null).attr('opacity', 1);
});

// 点击画布空白处关闭详情
document.getElementById('detailOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

document.getElementById('graphContainer').addEventListener('click', function(e) {
  if (e.target === this || e.target.tagName === 'svg' || e.target === g.node()) {
    closeDetail();
    nodeElements.attr('stroke-width', 1.5).attr('filter', null).attr('opacity', 1);
  }
});

// ESC 关闭
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDetail();
});

// 启动
window.addEventListener('DOMContentLoaded', initGraph);
</script>

</body>
</html>
