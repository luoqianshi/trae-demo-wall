<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心物记 - 物品故事记录平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:          #F7F3ED;
            --bg-warm:     #EDE8DF;
            --surface:     #FEFCF8;
            --gold:        #C9A96E;
            --gold-light:  #E0CFA8;
            --gold-dark:   #9E7B3C;
            --brown:       #5C4A3A;
            --brown-soft:  #8A7565;
            --brown-muted: #B5A595;
            --rose:        #D4A0A0;
            --sage:        #A8B8A0;
            --serif:       'Cormorant Garamond', Georgia, serif;
            --sans:        'DM Sans', -apple-system, sans-serif;
            --shadow-sm:   0 1px 3px rgba(92,74,58,0.06), 0 1px 2px rgba(92,74,58,0.04);
            --shadow-md:   0 4px 12px rgba(92,74,58,0.06), 0 2px 4px rgba(92,74,58,0.04);
            --shadow-lg:   0 12px 36px rgba(92,74,58,0.08), 0 4px 12px rgba(92,74,58,0.04);
            --inset:       inset 0 2px 4px rgba(92,74,58,0.06), inset 0 1px 2px rgba(92,74,58,0.04);
            --emboss:      0 1px 0 rgba(255,255,255,0.7), 0 -1px 0 rgba(92,74,58,0.04);
            --transition:  all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--brown);
            line-height: 1.8;
            min-height: 100vh;
        }

        header {
            background: var(--surface);
            padding: 16px 32px;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(201,169,110,0.08);
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(180deg, #D4B87A 0%, var(--gold) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .logo-icon svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 1.5; }

        .logo-text {
            font-family: var(--serif);
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.08em;
        }

        .nav {
            display: flex;
            gap: 24px;
        }

        .nav-item {
            font-size: 0.85rem;
            color: var(--brown-soft);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--bg);
            color: var(--gold);
        }

        .nav-item svg { width: 14px; height: 14px; }

        .back-btn {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--brown-soft);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: var(--transition);
            cursor: pointer;
        }

        .back-btn:hover {
            background: var(--bg);
            color: var(--gold);
        }

        .main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        .hero {
            text-align: center;
            margin-bottom: 64px;
            padding: 60px 0;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(201,169,110,0.08);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: var(--bg);
            border-radius: 999px;
            font-size: 0.7rem;
            color: var(--gold-dark);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
            box-shadow: var(--emboss);
        }

        .hero-badge svg { width: 12px; height: 12px; stroke: var(--gold); stroke-width: 2; }

        .hero h1 {
            font-family: var(--serif);
            font-weight: 300;
            font-size: clamp(1.8rem, 4vw, 3rem);
            letter-spacing: 0.06em;
            margin-bottom: 12px;
        }

        .hero h1 em { font-style: italic; color: var(--gold); }

        .hero-slogan {
            font-family: var(--serif);
            font-weight: 300;
            font-size: 1rem;
            color: var(--brown-soft);
            letter-spacing: 0.1em;
            margin-bottom: 32px;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: linear-gradient(180deg, #D4B87A 0%, var(--gold) 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(201,169,110,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: var(--transition);
        }

        .hero-cta:hover {
            box-shadow: 0 4px 16px rgba(201,169,110,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .hero-cta svg { width: 16px; height: 16px; stroke: #fff; }

        .section { margin-bottom: 64px; }

        .section-header {
            margin-bottom: 32px;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: 12px;
        }

        .section-label svg { width: 12px; height: 12px; stroke: var(--gold-dark); stroke-width: 1.5; }

        .section-title {
            font-family: var(--serif);
            font-weight: 300;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            line-height: 1.2;
        }

        .section-title em { font-style: italic; color: var(--gold); }

        .item-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .item-card {
            background: var(--surface);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(201,169,110,0.08);
            transition: var(--transition);
            position: relative;
            cursor: pointer;
        }

        .item-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        .item-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, transparent 100%);
            pointer-events: none;
        }

        .item-image {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: 24px auto;
            display: block;
            object-fit: cover;
            background: var(--bg);
            box-shadow: var(--shadow-lg), inset 0 0 20px rgba(201,169,110,0.1);
            padding: 8px;
            border: 1px solid rgba(201,169,110,0.1);
        }

        .item-content {
            padding: 24px;
        }

        .item-date {
            font-size: 0.7rem;
            color: var(--brown-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .item-title {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1.1rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--brown-soft);
            font-weight: 300;
            line-height: 1.7;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .item-tags {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .item-tag {
            padding: 4px 12px;
            background: var(--bg);
            border-radius: 999px;
            font-size: 0.7rem;
            color: var(--brown-soft);
            box-shadow: var(--emboss);
        }

        .item-stats {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--brown-muted);
        }

        .item-stats svg { width: 12px; height: 12px; }

        .delete-btn {
            width: 32px; height: 32px;
            border: none;
            background: var(--bg);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: var(--inset);
            color: var(--brown-muted);
        }

        .delete-btn:hover {
            background: var(--rose);
            color: #fff;
        }

        .delete-btn svg { width: 14px; height: 14px; }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .detail-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .timeline-actions {
            display: flex;
            gap: 8px;
        }

        .timeline {
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 24px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold), var(--gold-light));
            border-radius: 1px;
        }

        .timeline-item {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
            position: relative;
        }

        .timeline-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--gold);
            margin-top: 8px;
            box-shadow: 0 0 0 4px rgba(201,169,110,0.1);
            flex-shrink: 0;
        }

        .timeline-content {
            flex: 1;
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(201,169,110,0.08);
            transition: var(--transition);
        }

        .timeline-content:hover {
            box-shadow: var(--shadow-lg);
        }

        .timeline-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .timeline-date {
            font-size: 0.8rem;
            color: var(--brown-muted);
            font-family: var(--serif);
        }

        .timeline-title {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1rem;
        }

        .timeline-desc {
            font-size: 0.85rem;
            color: var(--brown-soft);
            font-weight: 300;
            line-height: 1.7;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(92,74,58,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--surface);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(201,169,110,0.1);
            transform: translateY(20px);
            transition: var(--transition);
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .modal-title {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1.4rem;
        }

        .modal-close {
            width: 32px; height: 32px;
            border: none;
            background: var(--bg);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: var(--inset);
        }

        .modal-close:hover {
            background: var(--brown-soft);
            color: #fff;
        }

        .modal-close svg { width: 16px; height: 16px; }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 0.8rem;
            color: var(--brown-soft);
            margin-bottom: 8px;
            display: block;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(201,169,110,0.12);
            border-radius: 12px;
            background: var(--bg);
            font-family: var(--sans);
            font-size: 0.9rem;
            color: var(--brown);
            outline: none;
            transition: var(--transition);
            box-shadow: var(--inset);
        }

        .form-input:focus {
            border-color: var(--gold-light);
            box-shadow: var(--inset), 0 0 0 3px rgba(201,169,110,0.08);
        }

        .form-input::placeholder {
            color: var(--brown-muted);
            font-weight: 300;
        }

        .form-textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(201,169,110,0.12);
            border-radius: 12px;
            background: var(--bg);
            font-family: var(--sans);
            font-size: 0.9rem;
            color: var(--brown);
            outline: none;
            transition: var(--transition);
            box-shadow: var(--inset);
            resize: vertical;
            min-height: 100px;
        }

        .form-textarea:focus {
            border-color: var(--gold-light);
            box-shadow: var(--inset), 0 0 0 3px rgba(201,169,110,0.08);
        }

        .upload-area {
            border: 2px dashed rgba(201,169,110,0.2);
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--gold);
            background: rgba(201,169,110,0.04);
        }

        .upload-icon {
            width: 56px; height: 56px;
            margin: 0 auto 16px;
            background: var(--surface);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .upload-icon svg { width: 24px; height: 24px; stroke: var(--gold); }

        .upload-text {
            font-size: 0.9rem;
            color: var(--brown-soft);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 0.75rem;
            color: var(--brown-muted);
        }

        #fileInput, #cameraInput {
            display: none;
        }

        .upload-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }

        .upload-btn {
            padding: 10px 24px;
            border: 1px solid rgba(201,169,110,0.15);
            border-radius: 10px;
            background: var(--surface);
            color: var(--brown-soft);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        .upload-btn:hover {
            background: var(--gold);
            color: #fff;
            border-color: var(--gold);
        }

        .upload-btn svg { width: 14px; height: 14px; }

        .preview-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: var(--shadow-md);
        }

        .sticker-preview {
            background: var(--bg);
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .sticker-preview img {
            border-radius: 50%;
            padding: 16px;
            background: var(--surface);
            box-shadow: var(--shadow-lg), inset 0 0 20px rgba(201,169,110,0.1);
            max-width: 150px;
        }

        .sticker-label {
            font-size: 0.75rem;
            color: var(--brown-muted);
            margin-top: 12px;
        }

        .tag-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-option {
            padding: 6px 16px;
            background: var(--bg);
            border-radius: 999px;
            font-size: 0.75rem;
            color: var(--brown-soft);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--emboss);
            border: 1px solid transparent;
        }

        .tag-option:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .tag-option.selected {
            background: var(--gold);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, #D4B87A 0%, var(--gold) 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(201,169,110,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: var(--transition);
        }

        .submit-btn:hover {
            box-shadow: 0 4px 16px rgba(201,169,110,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(201,169,110,0.08);
        }

        .empty-icon {
            width: 64px; height: 64px;
            margin: 0 auto 20px;
            background: var(--bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--inset);
        }

        .empty-icon svg { width: 28px; height: 28px; stroke: var(--brown-muted); }

        .empty-title {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 0.85rem;
            color: var(--brown-muted);
            margin-bottom: 24px;
        }

        .item-detail {
            display: flex;
            gap: 32px;
            align-items: flex-start;
            background: var(--surface);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(201,169,110,0.08);
            margin-bottom: 48px;
        }

        .item-detail-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: var(--shadow-lg), inset 0 0 20px rgba(201,169,110,0.1);
            flex-shrink: 0;
            padding: 8px;
            border: 1px solid rgba(201,169,110,0.1);
        }

        .item-detail-info {
            flex: 1;
        }

        .item-detail-title {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .item-detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .item-detail-tag {
            padding: 6px 16px;
            background: var(--bg);
            border-radius: 999px;
            font-size: 0.75rem;
            color: var(--brown-soft);
            box-shadow: var(--emboss);
        }

        .item-detail-stats {
            display: flex;
            gap: 24px;
            font-size: 0.85rem;
            color: var(--brown-muted);
        }

        .item-detail-stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .item-detail-stat svg { width: 14px; height: 14px; }

        .add-story-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(180deg, #D4B87A 0%, var(--gold) 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(201,169,110,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: var(--transition);
            margin-top: 20px;
        }

        .add-story-btn:hover {
            box-shadow: 0 4px 16px rgba(201,169,110,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .add-story-btn svg { width: 14px; height: 14px; stroke: #fff; }

        footer {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid rgba(201,169,110,0.1);
            margin-top: 64px;
        }

        footer p {
            font-size: 0.8rem;
            color: var(--brown-muted);
            font-weight: 300;
        }

        @media (max-width: 600px) {
            header { padding: 12px 16px; }
            .main { padding: 32px 16px; }
            .nav { gap: 12px; }
            .nav-item span { display: none; }
            .hero { padding: 40px 20px; }
            .modal { padding: 24px; }
            .timeline::before { left: 16px; }
            .timeline-dot { margin-left: -8px; }
            .item-detail { flex-direction: column; }
            .item-detail-image { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo">
            <div class="logo-icon"><i data-lucide="gift"></i></div>
            <span class="logo-text">心物记</span>
        </div>
        <nav class="nav">
            <a href="#home" class="nav-item active" onclick="showHome()"><i data-lucide="home"></i><span>首页</span></a>
            <button class="nav-item" onclick="openAddItemModal()"><i data-lucide="plus"></i><span>记录</span></button>
        </nav>
    </div>
</header>

<main class="main">
    <div id="home-page">
        <div class="hero">
            <div class="hero-badge">
                <i data-lucide="sparkles"></i>
                心有所属，物有所记
            </div>
            <h1>记录<em>物品</em>的温度</h1>
            <p class="hero-slogan">每一件物品背后，都藏着一段故事</p>
            <button class="hero-cta" onclick="openAddItemModal()">
                <i data-lucide="camera"></i>
                开始记录
            </button>
        </div>

        <div class="section-header">
            <div class="section-label"><i data-lucide="book-open"></i> 我的物品</div>
            <h2 class="section-title">物品<em>记忆</em>收藏</h2>
        </div>

        <div id="itemList" class="item-list">
            <div class="empty-state">
                <div class="empty-icon"><i data-lucide="inbox"></i></div>
                <div class="empty-title">还没有记录</div>
                <div class="empty-desc">点击上方「记录」按钮，开始记录第一件物品</div>
                <button class="submit-btn" onclick="openAddItemModal()">开始记录</button>
            </div>
        </div>
    </div>

    <div id="item-detail-page" style="display: none;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 32px;">
            <button class="back-btn" onclick="showHome()" style="display: flex;">
                <i data-lucide="arrow-left"></i> 返回
            </button>
        </div>

        <div id="itemDetail" class="item-detail">
        </div>

        <div class="section-header">
            <div class="section-label"><i data-lucide="clock"></i> 时光轨迹</div>
            <h2 class="section-title">物品<em>故事</em>线</h2>
        </div>

        <div id="itemTimeline" class="timeline">
        </div>
    </div>
</main>

<div id="addItemModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">记录新物品</h3>
            <button class="modal-close" onclick="closeAddItemModal()">
                <i data-lucide="x"></i>
            </button>
        </div>

        <form id="addItemForm" onsubmit="saveItem(event)">
            <div class="form-group">
                <label class="form-label">物品图片</label>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()" ondragover="event.preventDefault(); this.classList.add('dragover');" ondragleave="this.classList.remove('dragover');" ondrop="event.preventDefault(); this.classList.remove('dragover'); handleDrop(event);">
                    <div class="upload-icon">
                        <i data-lucide="image-plus"></i>
                    </div>
                    <div class="upload-text">点击或拖拽上传物品图片</div>
                    <div class="upload-hint">支持 JPG、PNG 格式</div>
                    <div class="upload-actions">
                        <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">
                            <i data-lucide="folder-open"></i> 选择图片
                        </button>
                        <button type="button" class="upload-btn" onclick="openCamera()">
                            <i data-lucide="camera"></i> 拍照
                        </button>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
                    <img id="itemImagePreview" class="preview-image" style="display: none;">
                    <div id="stickerPreview" class="sticker-preview" style="display: none;">
                        <img id="stickerImage">
                        <div class="sticker-label">贴纸效果预览</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">物品名称</label>
                <input type="text" class="form-input" id="itemName" placeholder="例如：妈妈送的雨伞" required>
            </div>

            <div class="form-group">
                <label class="form-label">情感标签</label>
                <div class="tag-selector" id="itemTagSelector">
                    <div class="tag-option" onclick="selectTag(this)">温暖</div>
                    <div class="tag-option" onclick="selectTag(this)">怀念</div>
                    <div class="tag-option" onclick="selectTag(this)">感动</div>
                    <div class="tag-option" onclick="selectTag(this)">珍贵</div>
                    <div class="tag-option" onclick="selectTag(this)">成长</div>
                    <div class="tag-option" onclick="selectTag(this)">礼物</div>
                </div>
            </div>

            <button type="submit" class="submit-btn">保存物品</button>
        </form>
    </div>
</div>

<div id="addStoryModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">添加故事</h3>
            <button class="modal-close" onclick="closeAddStoryModal()">
                <i data-lucide="x"></i>
            </button>
        </div>

        <form id="addStoryForm" onsubmit="saveStory(event)">
            <div class="form-group">
                <label class="form-label">故事日期</label>
                <input type="date" class="form-input" id="storyDate" required>
            </div>

            <div class="form-group">
                <label class="form-label">情感标签</label>
                <div class="tag-selector" id="storyTagSelector">
                    <div class="tag-option" onclick="selectStoryTag(this)">温暖</div>
                    <div class="tag-option" onclick="selectStoryTag(this)">怀念</div>
                    <div class="tag-option" onclick="selectStoryTag(this)">感动</div>
                    <div class="tag-option" onclick="selectStoryTag(this)">珍贵</div>
                    <div class="tag-option" onclick="selectStoryTag(this)">成长</div>
                    <div class="tag-option" onclick="selectStoryTag(this)">礼物</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">故事内容</label>
                <textarea class="form-textarea" id="storyContent" placeholder="写下这个时刻与这件物品的故事..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">保存故事</button>
        </form>
    </div>
</div>

<div id="cameraModal" class="modal-overlay">
    <div class="modal" style="max-width: 600px;">
        <div class="modal-header">
            <h3 class="modal-title">拍照</h3>
            <button class="modal-close" onclick="closeCamera()">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div style="text-align: center;">
            <video id="cameraVideo" width="100%" height="auto" autoplay playsinline style="border-radius: 16px; background: #000;"></video>
            <canvas id="cameraCanvas" style="display: none;"></canvas>
            <button class="submit-btn" style="margin-top: 24px;" onclick="takePhoto()">
                <i data-lucide="camera"></i> 拍摄
            </button>
        </div>
    </div>
</div>

<footer>
    <p>心物记 · 心有所属，物有所记</p>
</footer>

<script>
    lucide.createIcons();

    let items = [];
    let selectedItemTags = [];
    let selectedStoryTags = [];
    let currentItemId = null;

    function showHome() {
        document.getElementById('home-page').style.display = 'block';
        document.getElementById('item-detail-page').style.display = 'none';
        document.querySelector('[href="#home"]').classList.add('active');
        renderItems();
    }

    function showItemDetail(itemId) {
        currentItemId = itemId;
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('item-detail-page').style.display = 'block';
        document.querySelector('[href="#home"]').classList.remove('active');
        renderItemDetail(itemId);
    }

    function openAddItemModal() {
        document.getElementById('addItemModal').classList.add('active');
        selectedItemTags = [];
        document.querySelectorAll('#itemTagSelector .tag-option').forEach(el => el.classList.remove('selected'));
    }

    function closeAddItemModal() {
        document.getElementById('addItemModal').classList.remove('active');
        document.getElementById('addItemForm').reset();
        document.getElementById('itemImagePreview').style.display = 'none';
        document.getElementById('stickerPreview').style.display = 'none';
        selectedItemTags = [];
        document.querySelectorAll('#itemTagSelector .tag-option').forEach(el => el.classList.remove('selected'));
    }

    function openAddStoryModal(itemId) {
        currentItemId = itemId;
        document.getElementById('addStoryModal').classList.add('active');
        document.getElementById('storyDate').valueAsDate = new Date();
        selectedStoryTags = [];
        document.querySelectorAll('#storyTagSelector .tag-option').forEach(el => el.classList.remove('selected'));
    }

    function closeAddStoryModal() {
        document.getElementById('addStoryModal').classList.remove('active');
        document.getElementById('addStoryForm').reset();
        selectedStoryTags = [];
        document.querySelectorAll('#storyTagSelector .tag-option').forEach(el => el.classList.remove('selected'));
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('itemImagePreview');
                img.src = e.target.result;
                img.style.display = 'block';
                createStickerPreview(e.target.result);
            };
            reader.readAsDataURL(file);
        }
    }

    function handleDrop(event) {
        const file = event.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('itemImagePreview');
                img.src = e.target.result;
                img.style.display = 'block';
                createStickerPreview(e.target.result);
            };
            reader.readAsDataURL(file);
        }
    }

    function createStickerPreview(src) {
        const stickerImg = document.getElementById('stickerImage');
        stickerImg.src = src;
        document.getElementById('stickerPreview').style.display = 'block';
    }

    function generateStickerImage(src) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                const size = Math.min(img.width, img.height);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = size;
                canvas.height = size;

                ctx.beginPath();
                ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                const x = (size - img.width) / 2;
                const y = (size - img.height) / 2;
                ctx.drawImage(img, x, y);

                resolve(canvas.toDataURL('image/png'));
            };
            img.src = src;
        });
    }

    function selectTag(el) {
        el.classList.toggle('selected');
        const tag = el.textContent;
        const index = selectedItemTags.indexOf(tag);
        if (index > -1) {
            selectedItemTags.splice(index, 1);
        } else {
            selectedItemTags.push(tag);
        }
    }

    function selectStoryTag(el) {
        el.classList.toggle('selected');
        const tag = el.textContent;
        const index = selectedStoryTags.indexOf(tag);
        if (index > -1) {
            selectedStoryTags.splice(index, 1);
        } else {
            selectedStoryTags.push(tag);
        }
    }

    async function saveItem(event) {
        event.preventDefault();
        
        const itemName = document.getElementById('itemName').value;
        const imageSrc = document.getElementById('itemImagePreview').src;

        if (!imageSrc || imageSrc === '') {
            alert('请上传物品图片');
            return;
        }

        const stickerImageSrc = await generateStickerImage(imageSrc);

        const item = {
            id: Date.now(),
            name: itemName,
            imageSrc: stickerImageSrc,
            tags: [...selectedItemTags],
            createdAt: new Date().toISOString().split('T')[0],
            stories: []
        };

        items.push(item);
        saveToLocalStorage();
        closeAddItemModal();
        renderItems();
    }

    function saveStory(event) {
        event.preventDefault();
        
        const storyDate = document.getElementById('storyDate').value;
        const storyContent = document.getElementById('storyContent').value;

        const story = {
            id: Date.now(),
            date: storyDate,
            content: storyContent,
            tags: [...selectedStoryTags]
        };

        const item = items.find(i => i.id === currentItemId);
        if (item) {
            item.stories.push(story);
            saveToLocalStorage();
            closeAddStoryModal();
            renderItemDetail(currentItemId);
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem('xinwuji_items', JSON.stringify(items));
    }

    function loadFromLocalStorage() {
        const saved = localStorage.getItem('xinwuji_items');
        if (saved) {
            items = JSON.parse(saved);
        } else {
            items = [
                {
                    id: 1,
                    name: '妈妈送的雨伞',
                    imageSrc: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=vintage%20umbrella%20with%20warm%20lighting%20nostalgic%20feeling&image_size=square',
                    tags: ['温暖', '珍贵', '礼物'],
                    createdAt: '2026-06-15',
                    stories: [
                        {
                            id: 101,
                            date: '2026-06-15',
                            content: '今天整理房间时，翻出了这把旧雨伞。记得那是我第一次去北京上学时，妈妈在火车站送给我的。她说北京经常下雨，让我记得带伞。',
                            tags: ['温暖', '礼物']
                        },
                        {
                            id: 102,
                            date: '2026-07-05',
                            content: '今天下班遇到了暴雨，正好带了这把伞。撑着它走在雨中，想起了妈妈送我时的眼神。有些东西，虽然旧了，但永远不会褪色。',
                            tags: ['怀念', '珍贵']
                        }
                    ]
                },
                {
                    id: 2,
                    name: '童年的日记本',
                    imageSrc: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=vintage%20diary%20book%20with%20childhood%20memories%20warm%20lighting&image_size=square',
                    tags: ['怀念', '成长'],
                    createdAt: '2026-06-20',
                    stories: [
                        {
                            id: 201,
                            date: '2026-06-20',
                            content: '在书柜深处发现了这本小学时的日记本。翻到第一页，上面歪歪扭扭地写着："今天我学会了骑自行车！"',
                            tags: ['怀念']
                        },
                        {
                            id: 202,
                            date: '2026-06-22',
                            content: '继续翻看日记，看到了五年级写的一篇作文：我的梦想是成为一名作家。现在虽然没有成为作家，但依然热爱写作。',
                            tags: ['成长']
                        }
                    ]
                },
                {
                    id: 3,
                    name: '旅行的明信片',
                    imageSrc: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=vintage%20postcard%20from%20travel%20with%20stamps%20nostalgic%20aesthetic&image_size=square',
                    tags: ['感动', '珍贵'],
                    createdAt: '2026-07-01',
                    stories: [
                        {
                            id: 301,
                            date: '2026-07-01',
                            content: '去年去云南旅行时寄给自己的明信片终于到了。上面盖着丽江古城的邮戳，还有我当时写的话："希望多年后还能记得这一刻的自由。"',
                            tags: ['感动', '珍贵']
                        }
                    ]
                }
            ];
        }
    }

    function renderItems() {
        const container = document.getElementById('itemList');
        
        if (items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i data-lucide="inbox"></i></div>
                    <div class="empty-title">还没有记录</div>
                    <div class="empty-desc">点击上方「记录」按钮，开始记录第一件物品</div>
                    <button class="submit-btn" onclick="openAddItemModal()">开始记录</button>
                </div>
            `;
            lucide.createIcons();
            return;
        }

        container.innerHTML = items.map(item => {
            const latestStory = item.stories.length > 0 
                ? item.stories[item.stories.length - 1] 
                : null;
            const latestDate = latestStory ? latestStory.date : item.createdAt;
            
            return `
                <div class="item-card">
                    <img src="${item.imageSrc}" class="item-image" alt="${item.name}" onclick="showItemDetail(${item.id})">
                    <div class="item-content">
                        <div class="item-date">${formatDate(latestDate)}</div>
                        <h3 class="item-title" onclick="showItemDetail(${item.id})">${item.name}</h3>
                        <p class="item-desc" onclick="showItemDetail(${item.id})">${latestStory ? latestStory.content : '暂无故事记录，点击查看详情'}</p>
                        <div class="item-tags">
                            ${item.tags.map(tag => `<span class="item-tag">${tag}</span>`).join('')}
                        </div>
                        <div class="item-stats">
                            <i data-lucide="clock"></i>
                            <span>${item.stories.length} 个故事</span>
                        </div>
                        <div class="card-actions">
                            <button class="delete-btn" onclick="deleteItem(${item.id})" title="删除物品">
                                <i data-lucide="trash-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        
        lucide.createIcons();
    }

    function renderItemDetail(itemId) {
        const item = items.find(i => i.id === itemId);
        if (!item) {
            showHome();
            return;
        }

        const detailContainer = document.getElementById('itemDetail');
        detailContainer.innerHTML = `
            <img src="${item.imageSrc}" class="item-detail-image" alt="${item.name}">
            <div class="item-detail-info">
                <h2 class="item-detail-title">${item.name}</h2>
                <div class="item-detail-tags">
                    ${item.tags.map(tag => `<span class="item-detail-tag">${tag}</span>`).join('')}
                </div>
                <div class="item-detail-stats">
                    <div class="item-detail-stat">
                        <i data-lucide="calendar"></i>
                        <span>创建于 ${formatDate(item.createdAt)}</span>
                    </div>
                    <div class="item-detail-stat">
                        <i data-lucide="clock"></i>
                        <span>${item.stories.length} 个故事</span>
                    </div>
                </div>
                <div class="detail-actions">
                    <button class="add-story-btn" onclick="openAddStoryModal(${item.id})">
                        <i data-lucide="plus"></i>
                        添加故事
                    </button>
                    <button class="delete-btn" onclick="deleteItem(${item.id})" title="删除物品">
                        <i data-lucide="trash-2"></i>
                    </button>
                </div>
            </div>
        `;

        const timelineContainer = document.getElementById('itemTimeline');
        
        if (item.stories.length === 0) {
            timelineContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i data-lucide="calendar"></i></div>
                    <div class="empty-title">还没有故事</div>
                    <div class="empty-desc">为这件物品记录第一个故事吧</div>
                    <button class="submit-btn" onclick="openAddStoryModal(${item.id})">添加故事</button>
                </div>
            `;
            lucide.createIcons();
            return;
        }

        const sortedStories = [...item.stories].sort((a, b) => new Date(b.date) - new Date(a.date));

        timelineContainer.innerHTML = sortedStories.map(story => `
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <div class="timeline-header">
                        <span class="timeline-date">${formatDate(story.date)}</span>
                        <div class="timeline-actions">
                            <button class="delete-btn" onclick="deleteStory(${item.id}, ${story.id})" title="删除故事">
                                <i data-lucide="trash-2"></i>
                            </button>
                        </div>
                    </div>
                    <h4 class="timeline-title">${story.tags.length > 0 ? story.tags.join(' · ') : '故事记录'}</h4>
                    <p class="timeline-desc">${story.content}</p>
                </div>
            </div>
        `).join('');

        lucide.createIcons();
    }

    function deleteItem(itemId) {
        if (confirm('确定要删除这件物品及其所有故事吗？')) {
            items = items.filter(item => item.id !== itemId);
            saveToLocalStorage();
            renderItems();
            if (currentItemId === itemId) {
                showHome();
            }
        }
    }

    function deleteStory(itemId, storyId) {
        if (confirm('确定要删除这个故事吗？')) {
            const item = items.find(i => i.id === itemId);
            if (item) {
                item.stories = item.stories.filter(story => story.id !== storyId);
                saveToLocalStorage();
                renderItemDetail(itemId);
            }
        }
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr);
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        return `${year}年${month}月${day}日`;
    }

    async function openCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const video = document.getElementById('cameraVideo');
            video.srcObject = stream;
            document.getElementById('cameraModal').classList.add('active');
        } catch (err) {
            console.error('Camera access denied:', err);
            alert('无法访问摄像头，请尝试选择图片上传');
        }
    }

    function closeCamera() {
        const video = document.getElementById('cameraVideo');
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
        }
        document.getElementById('cameraModal').classList.remove('active');
    }

    function takePhoto() {
        const video = document.getElementById('cameraVideo');
        const canvas = document.getElementById('cameraCanvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        const imageSrc = canvas.toDataURL('image/jpeg');
        
        const img = document.getElementById('itemImagePreview');
        img.src = imageSrc;
        img.style.display = 'block';
        createStickerPreview(imageSrc);
        
        closeCamera();
    }

    loadFromLocalStorage();
    renderItems();
</script>
</body>
</html>
