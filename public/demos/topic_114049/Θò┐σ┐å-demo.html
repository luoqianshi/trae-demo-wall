<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>长忆 - iPad 交互 Demo</title>
  <style>
    :root {
      --bg: #fdfbf7;
      --paper: #fffaf1;
      --card: #ffffff;
      --ink: #1f1b16;
      --muted: #6f665b;
      --line: #ded3c1;
      --brand: #8c3f45;
      --brand-dark: #5e3033;
      --green: #315a49;
      --amber: #c8873a;
      --soft: #f2eadc;
      --shadow: 0 18px 50px rgba(55, 38, 20, .12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body { overflow: hidden; }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1366px, 100vw);
      height: min(1024px, 100vh);
      min-height: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 136px 1fr;
      background: var(--bg);
      overflow: hidden;
    }

    .sidebar {
      background: #f2eadf;
      border-right: 1px solid var(--line);
      padding: 28px 14px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      color: var(--brand);
      letter-spacing: 2px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .nav button {
      width: 100%;
      min-height: 82px;
      border-radius: 18px;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      gap: 6px;
    }

    .nav button.active {
      background: var(--brand);
      color: white;
      box-shadow: 0 12px 28px rgba(140, 63, 69, .22);
    }

    .avatar {
      margin-top: auto;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: var(--brand-dark);
      color: white;
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 900;
    }

    .content {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding: 26px 32px;
    }

    .screen {
      height: 100%;
      display: none;
      min-height: 0;
    }

    .screen.active { display: block; }

    .page {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 34px;
      line-height: 1.2;
      margin: 0;
      font-weight: 900;
      letter-spacing: 0;
    }

    h2 {
      font-size: 28px;
      line-height: 1.25;
      margin: 0;
      font-weight: 900;
    }

    h3 {
      font-size: 23px;
      line-height: 1.3;
      margin: 0;
      font-weight: 850;
    }

    p { margin: 0; }

    .muted {
      color: var(--muted);
      font-size: 21px;
      line-height: 1.5;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--brand-dark);
      font-size: 20px;
      font-weight: 800;
      white-space: nowrap;
    }

    .btn {
      min-height: 62px;
      padding: 0 26px;
      border-radius: 18px;
      background: var(--green);
      color: white;
      font-size: 22px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 12px 26px rgba(49, 90, 73, .18);
    }

    .btn.secondary {
      background: var(--soft);
      color: var(--ink);
      box-shadow: none;
      border: 1px solid var(--line);
    }

    .btn.danger {
      background: #a64747;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .home-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.35fr .9fr;
      grid-template-rows: 1fr auto;
      gap: 18px;
    }

    .hero {
      padding: 34px;
      background: linear-gradient(135deg, #fff8ec, #f0e2ce);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
    }

    .today-label {
      color: var(--brand);
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .question {
      font-size: 38px;
      line-height: 1.28;
      font-weight: 900;
      letter-spacing: 0;
      max-width: 860px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .topic-list {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      overflow: hidden;
    }

    .topic {
      min-height: 76px;
      border-radius: 16px;
      padding: 16px 18px;
      background: #fbf6ed;
      border: 1px solid transparent;
      font-size: 21px;
      line-height: 1.35;
      text-align: left;
      color: var(--ink);
    }

    .topic.active {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 8px 20px rgba(140, 63, 69, .12);
    }

    .latest {
      grid-column: 1 / -1;
      padding: 22px 26px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
    }

    .latest-text {
      font-size: 22px;
      line-height: 1.45;
      color: var(--ink);
      max-height: 66px;
      overflow: hidden;
    }

    .interview-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: .86fr 1.14fr;
      gap: 18px;
    }

    .record-panel {
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
      min-height: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: #f5eee2;
      color: var(--brand-dark);
      font-size: 21px;
      font-weight: 900;
    }

    .mic-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex: 1;
    }

    .mic {
      width: 142px;
      height: 142px;
      border-radius: 50%;
      background: var(--brand);
      color: white;
      font-size: 54px;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 42px rgba(140, 63, 69, .26);
    }

    .mic.listening {
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(140, 63, 69, .24); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 28px rgba(140, 63, 69, .05); }
    }

    .chapter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      min-height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      background: #f6efe5;
      color: var(--muted);
      font-size: 20px;
      font-weight: 850;
      border: 1px solid transparent;
    }

    .tag.active {
      color: white;
      background: var(--brand);
    }

    .editor-panel {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    textarea, input, select {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fffdfa;
      color: var(--ink);
      outline: none;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 280px;
      resize: none;
      padding: 20px;
      font-size: 24px;
      line-height: 1.62;
    }

    input, select {
      min-height: 56px;
      padding: 0 16px;
      font-size: 21px;
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .lifebook-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .list-panel {
      padding: 22px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 14px;
    }

    .memory-list {
      overflow: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .memory {
      padding: 18px;
      background: #fffaf2;
      border: 1px solid var(--line);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .memory-text {
      font-size: 21px;
      line-height: 1.52;
      color: var(--ink);
    }

    .memory-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 18px;
    }

    .mini-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-btn {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      background: var(--soft);
      color: var(--ink);
      font-size: 18px;
      font-weight: 850;
      border: 1px solid var(--line);
    }

    .small-btn.primary {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }

    .memoir-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 18px;
    }

    .template-panel, .chapter-panel {
      padding: 22px;
      min-height: 0;
      overflow: auto;
    }

    .template-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .template {
      padding: 18px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fffaf2;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .template.active {
      border-color: var(--brand);
      background: white;
    }

    .chapter-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chapter {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 18px;
      border-radius: 16px;
      background: #fffaf2;
      border: 1px solid var(--line);
    }

    .chapter-title-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .chapter textarea {
      min-height: 150px;
      font-size: 21px;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .onboarding {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      place-items: center;
      padding: 32px;
      z-index: 30;
    }

    .onboarding.active { display: grid; }

    .setup-card {
      width: min(760px, 92vw);
      min-height: 560px;
      padding: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 26px;
      text-align: center;
    }

    .setup-main {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;
    }

    .setup-title {
      font-size: 38px;
      font-weight: 950;
    }

    .setup-control {
      width: min(560px, 100%);
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    .option {
      min-height: 62px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fffaf2;
      font-size: 21px;
      font-weight: 850;
      color: var(--ink);
    }

    .option.active {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(31, 27, 22, .35);
      z-index: 20;
      padding: 30px;
    }

    .modal.active { display: grid; }

    .modal-card {
      width: min(900px, 92vw);
      max-height: 86vh;
      overflow: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .book-preview {
      background: #fff;
      color: #1a1a1a;
      padding: 32px;
      border-radius: 12px;
      font-family: "Songti SC", "STSong", serif;
    }

    .book-preview h2 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 16px;
    }

    .book-preview h3 {
      font-size: 26px;
      margin: 28px 0 10px;
      border-bottom: 1px solid #d8c6a9;
      padding-bottom: 8px;
    }

    .book-preview p {
      font-size: 21px;
      line-height: 1.85;
      text-indent: 2em;
      margin: 12px 0;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: sticky;
        top: 0;
        z-index: 10;
        flex-direction: row;
        width: 100%;
        padding: 12px;
      }
      .nav {
        flex-direction: row;
        overflow: auto;
      }
      .nav button {
        min-width: 90px;
        min-height: 68px;
      }
      .avatar { display: none; }
      .content { padding: 18px; overflow: visible; }
      .home-grid, .interview-layout, .lifebook-grid, .memoir-layout {
        grid-template-columns: 1fr;
      }
      .screen, .page { height: auto; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="logo">长忆</div>
      <nav class="nav" id="nav">
        <button data-screen="home" class="active"><span>⌂</span><span>书房</span></button>
        <button data-screen="interview"><span>◉</span><span>讲述</span></button>
        <button data-screen="lifebook"><span>□</span><span>人生册</span></button>
        <button data-screen="memoir"><span>▤</span><span>回忆录</span></button>
        <button data-screen="private"><span>◌</span><span>私密</span></button>
      </nav>
      <div class="avatar" id="avatar">长</div>
    </aside>

    <main class="content">
      <section id="home" class="screen active"></section>
      <section id="interview" class="screen"></section>
      <section id="lifebook" class="screen"></section>
      <section id="memoir" class="screen"></section>
      <section id="private" class="screen"></section>
    </main>
  </div>

  <div class="onboarding active" id="onboarding"></div>
  <div class="modal" id="modal"></div>

  <script>
    const chapters = [
      { id: "study", name: "求学" },
      { id: "work", name: "工作" },
      { id: "family", name: "家庭" },
      { id: "era", name: "时代" },
      { id: "wisdom", name: "经验" }
    ];

    const templates = [
      {
        id: "chronological",
        name: "编年体",
        desc: "按人生阶段展开，从求学到回望。",
        outline: [
          ["少年求学", "启蒙教育、求学经历、年少时的梦想与追求", "study"],
          ["大学时代", "大学岁月、同窗情谊、思想成长与人生选择", "study"],
          ["职业生涯", "工作历程、事业发展、成就与挑战", "work"],
          ["家庭岁月", "婚姻生活、子女成长、家庭中的温暖", "family"],
          ["时代记忆", "重大历史事件和社会变迁对个人的影响", "era"],
          ["人生回望", "一生的思考和想传给后代的经验", "wisdom"]
        ]
      },
      {
        id: "thematic",
        name: "主题体",
        desc: "按人生主题分类，适合提炼经验。",
        outline: [
          ["辉煌时刻", "人生中最自豪的成就和高光时刻", "work"],
          ["遗憾与转折", "遗憾、转折点和从中学到的教训", "wisdom"],
          ["重要人物", "生命中影响深远的人", "family"],
          ["职业经验", "工作心得、处世哲学和专业见解", "work"],
          ["给晚辈的话", "想告诉后辈的人生经验", "wisdom"]
        ]
      },
      {
        id: "people",
        name: "人物体",
        desc: "以重要人物为线索串起一生。",
        outline: [
          ["父母师长", "父母养育、老师教导和长辈影响", "family"],
          ["伴侣子女", "伴侣相伴、子女成长和家庭点滴", "family"],
          ["同事学生", "工作伙伴、学生和共同奋斗的人", "work"],
          ["影响我的人", "生命中的贵人、朋友和重要相遇", null],
          ["回望自己", "对自己的评价、一生的总结", "wisdom"]
        ]
      }
    ];

    const sampleText = "1984年，我第一次被单位安排独立负责一个重要项目。那时候条件并不宽裕，资料靠自己一点点查，很多决定也没有现成答案。现在回头看，那次经历让我明白，真正的担当不是职位给的，而是在关键时候愿意把责任扛起来。";

    const state = {
      profile: JSON.parse(localStorage.getItem("changyiDemoProfile") || "null"),
      screen: "home",
      selectedTopic: "您职业生涯中最辉煌的一刻，是怎样发生的？",
      selectedChapter: "work",
      status: "准备中",
      text: "",
      largeFont: false,
      memories: JSON.parse(localStorage.getItem("changyiDemoMemories") || "null") || [
        {
          id: "m1",
          text: "我小时候在上海长大，那时候的南京路还很安静。真正影响我后来选择的，是父亲常说的一句话：人要靠本事站住。",
          chapter: "era",
          status: "approved",
          date: "2026/7/8"
        },
        {
          id: "m2",
          text: "大学是在北京读的。那几年眼界一下打开了，也第一次意识到个人命运和时代变化连在一起。",
          chapter: "study",
          status: "pending",
          date: "2026/7/10"
        }
      ],
      memoir: JSON.parse(localStorage.getItem("changyiDemoMemoir") || "null") || {
        templateId: "thematic",
        style: "formal",
        cover: "classic",
        title: "我的回忆录",
        subtitle: "写给家人与后来者",
        author: "",
        outline: []
      }
    };

    if (!state.memoir.outline.length) {
      setTemplate("thematic", false);
    }

    function save() {
      localStorage.setItem("changyiDemoProfile", JSON.stringify(state.profile));
      localStorage.setItem("changyiDemoMemories", JSON.stringify(state.memories));
      localStorage.setItem("changyiDemoMemoir", JSON.stringify(state.memoir));
    }

    function esc(str) {
      return String(str || "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
    }

    function chapterName(id) {
      return chapters.find(c => c.id === id)?.name || "未分类";
    }

    function today() {
      return new Date().toLocaleDateString("zh-CN");
    }

    function navTo(screen) {
      state.screen = screen;
      document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.screen === screen));
      document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === screen));
      render();
    }

    document.getElementById("nav").addEventListener("click", e => {
      const btn = e.target.closest("button[data-screen]");
      if (btn) navTo(btn.dataset.screen);
    });

    function render() {
      document.getElementById("avatar").textContent = state.profile?.name?.[0] || "长";
      document.getElementById("app").classList.toggle("large-font-mode", state.largeFont);
      renderHome();
      renderInterview();
      renderLifeBook();
      renderMemoir();
      renderPrivate();
    }

    function renderOnboarding() {
      const el = document.getElementById("onboarding");
      if (state.profile?.done) {
        el.classList.remove("active");
        return;
      }
      const steps = [
        { key: "name", title: "您希望我们怎么称呼您？", type: "input", placeholder: "例如：陈老师" },
        { key: "birthYear", title: "您的出生年份？", type: "select", options: ["1948","1952","1956","1960","1964","1968"] },
        { key: "region", title: "您主要生活的地区？", type: "select", options: ["北京","上海","江苏","浙江","广东","四川","山东","其他"] },
        { key: "occupation", title: "您过去主要从事什么工作？", type: "options", options: ["教育科研","工程技术","医疗卫生","机关事业","企业管理","文化艺术"] },
        { key: "focus", title: "您最想先记录什么？", type: "options", options: ["辉煌时刻","人生遗憾","职业经验","时代记忆","家庭往事","给晚辈的话"] }
      ];
      let step = Number(localStorage.getItem("changyiSetupStep") || "0");
      const data = JSON.parse(localStorage.getItem("changyiSetupData") || "{}");
      const s = steps[step];
      let control = "";
      if (s.type === "input") {
        control = '<input class="setup-control" id="setupValue" placeholder="' + s.placeholder + '" value="' + esc(data[s.key] || "") + '" />';
      } else if (s.type === "select") {
        control = '<select class="setup-control" id="setupValue">' + s.options.map(o => '<option value="' + o + '"' + (data[s.key] === o ? " selected" : "") + '>' + o + '</option>').join("") + '</select>';
      } else {
        control = '<div class="option-grid">' + s.options.map(o => '<button class="option ' + (data[s.key] === o ? "active" : "") + '" data-option="' + o + '">' + o + '</button>').join("") + '</div>';
      }
      el.innerHTML = '<div class="setup-card card"><div class="setup-main"><div class="pill">第 ' + (step + 1) + ' / ' + steps.length + ' 步</div><div class="setup-title">' + s.title + '</div>' + control + '<p class="muted">这些信息只用于 Demo 内生成更贴近您经历的讲述问题。</p></div><div class="actions"><button class="btn secondary" id="setupBack"' + (step === 0 ? " disabled" : "") + '>上一步</button><button class="btn" id="setupNext">' + (step === steps.length - 1 ? "开始使用长忆" : "下一步") + '</button></div></div>';
      el.querySelectorAll("[data-option]").forEach(btn => {
        btn.onclick = () => {
          data[s.key] = btn.dataset.option;
          localStorage.setItem("changyiSetupData", JSON.stringify(data));
          renderOnboarding();
        };
      });
      el.querySelector("#setupBack").onclick = () => {
        localStorage.setItem("changyiSetupStep", Math.max(0, step - 1));
        renderOnboarding();
      };
      el.querySelector("#setupNext").onclick = () => {
        const input = el.querySelector("#setupValue");
        if (input) data[s.key] = input.value;
        if (!data[s.key]) return alert("请先完成这一项");
        localStorage.setItem("changyiSetupData", JSON.stringify(data));
        if (step < steps.length - 1) {
          localStorage.setItem("changyiSetupStep", step + 1);
          renderOnboarding();
        } else {
          state.profile = { ...data, done: true };
          localStorage.removeItem("changyiSetupStep");
          localStorage.removeItem("changyiSetupData");
          save();
          renderOnboarding();
          render();
        }
      };
    }

    function renderHome() {
      const topics = [
        "您职业生涯中最辉煌的一刻，是怎样发生的？",
        "有没有一个遗憾，直到今天仍想重新讲清楚？",
        "您最想留给晚辈的一条经验是什么？"
      ];
      const latest = state.memories[state.memories.length - 1];
      document.getElementById("home").innerHTML = '<div class="page"><div class="topbar"><div><h1>书房</h1><p class="muted">' + (state.profile?.name || "老师") + '，欢迎回到您的数字书房</p></div><button class="btn secondary" id="fontBtn">' + (state.largeFont ? "标准字号" : "大字模式") + '</button></div><div class="home-grid"><div class="hero card"><div><div class="today-label">今日讲述</div><div class="question">' + esc(state.selectedTopic) + '</div></div><div class="hero-actions"><button class="btn" id="startFromHome">◉ 开始讲述</button><button class="btn secondary" id="toMemoir">查看回忆录</button></div></div><div class="topic-list card"><h3>换一个问题</h3>' + topics.map(t => '<button class="topic ' + (state.selectedTopic === t ? "active" : "") + '" data-topic="' + esc(t) + '">' + esc(t) + '</button>').join("") + '</div><div class="latest card"><div><h3>最近保存</h3><p class="latest-text">' + esc(latest?.text || "还没有保存的讲述。可以先从今日问题开始。") + '</p></div><div class="pill">已保存 ' + state.memories.length + ' 段</div></div></div></div>';
      document.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { state.selectedTopic = b.dataset.topic; renderHome(); });
      document.getElementById("startFromHome").onclick = () => { state.text = ""; navTo("interview"); };
      document.getElementById("toMemoir").onclick = () => navTo("memoir");
      document.getElementById("fontBtn").onclick = () => { state.largeFont = !state.largeFont; render(); };
    }

    function renderInterview() {
      document.getElementById("interview").innerHTML = '<div class="page"><div class="topbar"><div><h1>讲述</h1><p class="muted">' + esc(state.selectedTopic) + '</p></div><span class="status">' + state.status + '</span></div><div class="interview-layout"><div class="record-panel card"><div><h2>选择主题</h2><div class="chapter-tags" style="margin-top:14px">' + chapters.map(c => '<button class="tag ' + (state.selectedChapter === c.id ? "active" : "") + '" data-chapter="' + c.id + '">' + c.name + '</button>').join("") + '</div></div><div class="mic-wrap"><button class="mic ' + (state.status === "正在听" ? "listening" : "") + '" id="micBtn">◉</button><p class="muted">Demo 中可直接输入文字；支持浏览器语音识别时可试用录音。</p></div><div class="actions"><button class="btn secondary" id="mockBtn">填入示例</button><button class="btn secondary" id="clearBtn">清空</button></div></div><div class="editor-panel card"><h2>文稿</h2><textarea id="memoryText" placeholder="请在这里输入或粘贴您的讲述内容...">' + esc(state.text) + '</textarea><div class="actions"><button class="btn" id="saveMemory">保存到人生册</button><button class="btn secondary" id="backHome">回到书房</button></div></div></div></div>';
      document.querySelectorAll("[data-chapter]").forEach(b => b.onclick = () => { state.selectedChapter = b.dataset.chapter; renderInterview(); });
      document.getElementById("memoryText").oninput = e => { state.text = e.target.value; state.status = state.text.trim() ? "已生成文稿" : "准备中"; };
      document.getElementById("mockBtn").onclick = () => { state.text = sampleText; state.status = "已生成文稿"; renderInterview(); };
      document.getElementById("clearBtn").onclick = () => { state.text = ""; state.status = "准备中"; renderInterview(); };
      document.getElementById("backHome").onclick = () => navTo("home");
      document.getElementById("micBtn").onclick = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          state.text = state.text || "当前浏览器不支持语音识别。Demo 可先使用手动输入体验完整流程。";
          state.status = "已生成文稿";
          return renderInterview();
        }
        const rec = new SR();
        rec.lang = "zh-CN";
        rec.continuous = true;
        rec.interimResults = true;
        rec.onresult = ev => {
          let t = "";
          for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
          state.text = t;
          document.getElementById("memoryText").value = t;
        };
        rec.onend = () => { state.status = "已生成文稿"; renderInterview(); };
        state.status = "正在听";
        renderInterview();
        rec.start();
        setTimeout(() => { try { rec.stop(); } catch(e){} }, 7000);
      };
      document.getElementById("saveMemory").onclick = () => {
        const text = document.getElementById("memoryText").value.trim();
        if (!text) return alert("请先输入一段讲述。");
        state.memories.push({ id: "m" + Date.now(), text, chapter: state.selectedChapter, status: "pending", date: today() });
        state.text = "";
        state.status = "准备中";
        save();
        navTo("lifebook");
      };
    }

    function renderLifeBook() {
      const pending = state.memories.filter(m => m.status !== "approved");
      const approved = state.memories.filter(m => m.status === "approved");
      const list = arr => arr.length ? arr.map(m => '<div class="memory"><p class="memory-text">' + esc(m.text) + '</p><div class="memory-meta"><span>' + esc(m.date) + '</span><span>·</span><span>' + chapterName(m.chapter) + '</span></div><div class="mini-actions">' + (m.status !== "approved" ? '<button class="small-btn primary" data-approve="' + m.id + '">确认这段记忆</button>' : '') + '<button class="small-btn" data-edit="' + m.id + '">继续修改</button></div></div>').join("") : '<p class="muted">暂无内容</p>';
      document.getElementById("lifebook").innerHTML = '<div class="page"><div class="topbar"><div><h1>人生册</h1><p class="muted">先确认记忆，再整理进回忆录。</p></div><button class="btn" id="goMemoir">进入回忆录</button></div><div class="lifebook-grid"><div class="list-panel card"><h2>待确认 <span class="muted">(' + pending.length + ')</span></h2><div class="memory-list">' + list(pending) + '</div></div><div class="list-panel card"><h2>已确认 <span class="muted">(' + approved.length + ')</span></h2><div class="memory-list">' + list(approved) + '</div></div></div></div>';
      document.getElementById("goMemoir").onclick = () => navTo("memoir");
      document.querySelectorAll("[data-approve]").forEach(b => b.onclick = () => { const m = state.memories.find(x => x.id === b.dataset.approve); m.status = "approved"; save(); renderLifeBook(); });
      document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { const m = state.memories.find(x => x.id === b.dataset.edit); state.text = m.text; state.selectedChapter = m.chapter; navTo("interview"); });
    }

    function setTemplate(id, rerender = true) {
      const t = templates.find(x => x.id === id) || templates[0];
      state.memoir.templateId = id;
      state.memoir.outline = t.outline.map((row, i) => ({
        id: "c" + i + "-" + Date.now(),
        title: row[0],
        desc: row[1],
        chapter: row[2],
        content: "",
        imported: []
      }));
      save();
      if (rerender) renderMemoir();
    }

    function polish(text) {
      let t = text || "";
      const pairs = [["很好", "十分珍贵"], ["很多", "许多"], ["高兴", "欣慰"], ["难过", "感慨"], ["工作", "事业"], ["事情", "经历"], ["时候", "时期"]];
      pairs.forEach(p => t = t.replaceAll(p[0], p[1]));
      if (t && !t.includes("如今回望")) t += "\n\n如今回望，这段经历不仅是一段往事，也成为我后来判断人与事的重要依据。";
      return t;
    }

    function renderMemoir() {
      const approved = state.memories.filter(m => m.status === "approved");
      const templateCards = templates.map(t => '<button class="template ' + (state.memoir.templateId === t.id ? "active" : "") + '" data-template="' + t.id + '"><h3>' + t.name + '</h3><p class="muted">' + t.desc + '</p></button>').join("");
      const chaptersHtml = state.memoir.outline.map((c, idx) => '<div class="chapter"><div class="chapter-title-row"><input value="' + esc(c.title) + '" data-title="' + c.id + '" /><span class="pill">' + (c.imported?.length || 0) + ' 段记忆</span></div><p class="muted">' + esc(c.desc) + '</p><textarea data-content="' + c.id + '" placeholder="从人生册导入记忆，或在这里做少量修改...">' + esc(c.content) + '</textarea><div class="mini-actions"><button class="small-btn primary" data-import="' + c.id + '">从人生册导入</button><button class="small-btn" data-polish="' + c.id + '">润色本章</button><button class="small-btn" data-narrate="' + c.id + '">继续讲述</button><button class="small-btn" data-remove="' + c.id + '">删除</button></div></div>').join("");
      document.getElementById("memoir").innerHTML = '<div class="page"><div class="topbar"><div><h1>回忆录</h1><p class="muted">三步写书：选模板、填章节、导出文稿。</p></div><button class="btn" id="exportBook">导出可打印文稿</button></div><div class="memoir-layout"><div class="template-panel card"><h2>模板</h2>' + templateCards + '<h3>书籍信息</h3><input id="bookTitle" value="' + esc(state.memoir.title) + '" /><input id="bookAuthor" placeholder="作者" value="' + esc(state.memoir.author || state.profile?.name || "") + '" /><select id="bookStyle"><option value="formal">书面稳重</option><option value="plain">朴素真实</option><option value="warm">温情家书</option><option value="publish">出版文稿</option></select><select id="coverStyle"><option value="classic">素雅书卷</option><option value="archive">时代档案</option><option value="family">家族纪念</option></select><button class="btn secondary" id="addChapter">添加章节</button></div><div class="chapter-panel card"><h2>章节草稿</h2>' + chaptersHtml + '</div></div></div>';
      document.getElementById("bookStyle").value = state.memoir.style || "formal";
      document.getElementById("coverStyle").value = state.memoir.cover || "classic";
      document.querySelectorAll("[data-template]").forEach(b => b.onclick = () => { if (confirm("更换模板会重置当前章节，确定吗？")) setTemplate(b.dataset.template); });
      document.getElementById("bookTitle").oninput = e => { state.memoir.title = e.target.value; save(); };
      document.getElementById("bookAuthor").oninput = e => { state.memoir.author = e.target.value; save(); };
      document.getElementById("bookStyle").onchange = e => { state.memoir.style = e.target.value; save(); };
      document.getElementById("coverStyle").onchange = e => { state.memoir.cover = e.target.value; save(); };
      document.getElementById("addChapter").onclick = () => { state.memoir.outline.push({ id: "custom" + Date.now(), title: "新增章节", desc: "可记录一段新的主题", chapter: null, content: "", imported: [] }); save(); renderMemoir(); };
      document.querySelectorAll("[data-title]").forEach(i => i.oninput = e => { const c = state.memoir.outline.find(x => x.id === i.dataset.title); c.title = e.target.value; save(); });
      document.querySelectorAll("[data-content]").forEach(i => i.oninput = e => { const c = state.memoir.outline.find(x => x.id === i.dataset.content); c.content = e.target.value; save(); });
      document.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { state.memoir.outline = state.memoir.outline.filter(x => x.id !== b.dataset.remove); save(); renderMemoir(); });
      document.querySelectorAll("[data-polish]").forEach(b => b.onclick = () => { const c = state.memoir.outline.find(x => x.id === b.dataset.polish); c.content = polish(c.content); save(); renderMemoir(); });
      document.querySelectorAll("[data-narrate]").forEach(b => b.onclick = () => { const c = state.memoir.outline.find(x => x.id === b.dataset.narrate); state.selectedTopic = "请继续讲述《" + c.title + "》这一章。"; state.text = c.content || ""; navTo("interview"); });
      document.querySelectorAll("[data-import]").forEach(b => b.onclick = () => openImportModal(b.dataset.import, approved));
      document.getElementById("exportBook").onclick = openBookPreview;
    }

    function openImportModal(chapterId, approved) {
      const modal = document.getElementById("modal");
      modal.classList.add("active");
      modal.innerHTML = '<div class="modal-card card"><h2>从人生册导入记忆</h2><p class="muted">选择已确认记忆，导入到当前章节草稿。</p><div class="memory-list">' + (approved.length ? approved.map(m => '<label class="memory"><span class="memory-text">' + esc(m.text) + '</span><span class="memory-meta">' + esc(m.date) + ' · ' + chapterName(m.chapter) + '</span><input type="checkbox" value="' + m.id + '" /></label>').join("") : '<p class="muted">暂无已确认记忆，请先到人生册确认。</p>') + '</div><div class="actions"><button class="btn secondary" id="closeModal">关闭</button><button class="btn" id="importSelected">导入选择</button></div></div>';
      document.getElementById("closeModal").onclick = () => modal.classList.remove("active");
      document.getElementById("importSelected").onclick = () => {
        const ids = [...modal.querySelectorAll("input:checked")].map(i => i.value);
        const c = state.memoir.outline.find(x => x.id === chapterId);
        const texts = approved.filter(m => ids.includes(m.id)).map(m => m.text);
        if (texts.length) {
          c.imported = [...new Set([...(c.imported || []), ...ids])];
          c.content = [c.content, ...texts].filter(Boolean).join("\n\n");
          save();
        }
        modal.classList.remove("active");
        renderMemoir();
      };
    }

    function openBookPreview() {
      const title = state.memoir.title || "我的回忆录";
      const author = state.memoir.author || state.profile?.name || "";
      const chaptersHtml = state.memoir.outline.filter(c => c.content.trim()).map((c, i) => '<h3>第' + (i + 1) + '章　' + esc(c.title) + '</h3>' + c.content.split("\n").filter(Boolean).map(p => '<p>' + esc(p) + '</p>').join("")).join("");
      const modal = document.getElementById("modal");
      modal.classList.add("active");
      modal.innerHTML = '<div class="modal-card card"><div class="actions"><button class="btn secondary" id="closeModal">关闭</button><button class="btn" onclick="window.print()">打印 / 保存 PDF</button></div><div class="book-preview"><h2>' + esc(title) + '</h2><p style="text-align:center;text-indent:0">' + esc(author) + ' 著</p><h3>前言</h3><p>人生如书，岁月成章。这本回忆录记录了人生中的重要时刻、珍贵记忆和深刻感悟。</p>' + (chaptersHtml || '<p>暂无章节正文，请先导入或撰写内容。</p>') + '</div></div>';
      document.getElementById("closeModal").onclick = () => modal.classList.remove("active");
    }

    function renderPrivate() {
      document.getElementById("private").innerHTML = '<div class="page"><div class="topbar"><div><h1>私密</h1><p class="muted">用于保存暂时不想放入人生册的私人讲述。Demo 中展示入口与使用场景。</p></div></div><div class="card" style="padding:34px;display:flex;flex-direction:column;gap:18px"><h2>私人讲述空间</h2><p class="muted">可记录遗憾、未公开往事或只想自己保存的内容。正式版本可加入密码与本地加密。</p><button class="btn" onclick="navTo(\'interview\')">写一段私人记忆</button></div></div>';
    }

    renderOnboarding();
    render();
  </script>
</body>
</html>
