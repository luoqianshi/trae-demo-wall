<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智途 - 初中生学习助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #5B86E5;
      --primary-dark: #36D1DC;
      --glass-bg: rgba(255,255,255,0.25);
      --glass-border: rgba(255,255,255,0.3);
    }
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #5B86E5 0%, #36D1DC 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }
    .glass-card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .page {
      display: none;
      animation: fadeInUp 0.3s ease-out;
      padding-bottom: 100px;
    }
    .page.active { display: block; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes strike {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .task-complete .task-title {
      color: #999;
      position: relative;
    }
    .task-complete .task-title::after {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      height: 2px;
      background: #999;
      animation: strike 0.3s ease forwards;
    }
    .checkbox {
      width: 24px; height: 24px;
      border: 2px solid #ddd;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      cursor: pointer;
      flex-shrink: 0;
    }
    .checkbox.checked {
      background: linear-gradient(135deg, #5B86E5, #36D1DC);
      border-color: transparent;
    }
    .checkbox.checked::after {
      content: '✓';
      color: white;
      font-size: 14px;
    }
    .nav-item {
      transition: all 0.2s;
      position: relative;
    }
    .nav-item.active {
      color: var(--primary);
    }
    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 3px;
      background: linear-gradient(135deg, #5B86E5, #36D1DC);
      border-radius: 2px;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .modal-overlay.show {
      display: flex;
      opacity: 1;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-overlay.show .modal-content {
      transform: translateY(0);
    }
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .priority-high { background: #ff6b6b; color: white; }
    .priority-medium { background: #ffd93d; color: #333; }
    .priority-low { background: #6bcb77; color: white; }

    /* 12个学科分类颜色 */
    .cat-chinese   { background: #FFD6D6; color: #E74C3C; }
    .cat-math      { background: #D5F5E3; color: #27AE60; }
    .cat-english   { background: #D6EAF8; color: #3498DB; }
    .cat-physics   { background: #E8DAEF; color: #9B59B6; }
    .cat-chemistry { background: #FEF9E7; color: #F39C12; }
    .cat-biology   { background: #D1F2EB; color: #16A085; }
    .cat-history   { background: #FDEBD0; color: #D35400; }
    .cat-politics  { background: #FADBD8; color: #C0392B; }
    .cat-geography { background: #D4EFDF; color: #1ABC9C; }
    .cat-pe        { background: #FCF3CF; color: #D4AC0D; }
    .cat-music     { background: #EBDEF0; color: #7D3C98; }
    .cat-art       { background: #FAE5D3; color: #CA6F1E; }

    .progress-ring {
      transform: rotate(-90deg);
    }
    .progress-ring-circle {
      transition: stroke-dashoffset 0.5s ease;
    }
    .bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 120px;
      gap: 8px;
    }
    .bar {
      flex: 1;
      background: linear-gradient(to top, #5B86E5, #36D1DC);
      border-radius: 8px 8px 0 0;
      min-height: 4px;
      transition: height 0.5s ease;
      position: relative;
    }
    .bar-label {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #666;
      white-space: nowrap;
    }
    .floating-btn {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5B86E5, #36D1DC);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 16px rgba(91,134,229,0.5);
      z-index: 50;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .floating-btn:active { transform: scale(0.95); }
    .date-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      position: relative;
    }
    .date-cell:hover { background: rgba(91,134,229,0.1); }
    .date-cell.today { background: linear-gradient(135deg, #5B86E5, #36D1DC); color: white; }
    .date-cell.has-task::after {
      content: '';
      position: absolute;
      bottom: 4px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #5B86E5;
    }
    .date-cell.today.has-task::after { background: white; }
    .date-cell.selected {
      background: rgba(91,134,229,0.15);
      border: 2px solid #5B86E5;
      box-shadow: 0 2px 8px rgba(91,134,229,0.3);
    }
    .confirm-dialog {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }
    .confirm-dialog.show { display: flex; }
    .confirm-box {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 80%;
      max-width: 300px;
      text-align: center;
      animation: scaleIn 0.2s ease;
    }
    .num-animate {
      display: inline-block;
      transition: all 0.6s ease-out;
    }
    /* 快速模板横向滚动 */
    .template-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .template-scroll::-webkit-scrollbar { display: none; }
    .template-chip {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      background: rgba(255,255,255,0.9);
      color: #5B86E5;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .template-chip:active { transform: scale(0.95); }
    /* 中考倒计时 */
    .countdown-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.15));
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 16px;
      padding: 12px 16px;
    }
    /* 学科选择网格 */
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .subject-btn {
      padding: 8px 4px;
      border-radius: 12px;
      font-size: 12px;
      border: 2px solid transparent;
      background: #f3f4f6;
      color: #6b7280;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .subject-btn .subj-icon { font-size: 18px; }
    .subject-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
    }
    /* 成就徽章 */
    .badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      border-radius: 16px;
      background: rgba(255,255,255,0.9);
      transition: all 0.3s;
    }
    .badge-item.locked {
      opacity: 0.4;
      filter: grayscale(1);
    }
    .badge-item.unlocked {
      animation: bounceIn 0.5s ease;
    }
    .badge-icon {
      font-size: 32px;
      margin-bottom: 4px;
    }
    .badge-name {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
    }
    .badge-desc {
      font-size: 10px;
      color: #9ca3af;
      text-align: center;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <!-- 首页概览 -->
  <div id="page-dashboard" class="page active">
    <div class="p-5">
      <div class="text-white mb-4">
        <div class="text-sm opacity-80" id="current-date">2026年7月8日 星期三</div>
        <div class="text-2xl font-bold mt-1" id="greeting">下午好，同学！</div>
      </div>

      <!-- 中考倒计时 -->
      <div class="countdown-card mb-4 text-white">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs opacity-80">距离2027中考还有</div>
            <div class="text-3xl font-bold mt-1"><span id="zhongkao-days">0</span> 天</div>
          </div>
          <div class="text-5xl opacity-90">🎯</div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="glass rounded-2xl p-4 text-white">
          <div class="text-xs opacity-80">今日完成</div>
          <div class="text-3xl font-bold mt-1"><span class="num-animate" id="dash-completed">0</span>/<span id="dash-total">0</span></div>
        </div>
        <div class="glass rounded-2xl p-4 text-white">
          <div class="text-xs opacity-80">专注时长</div>
          <div class="text-3xl font-bold mt-1"><span class="num-animate" id="dash-focus">0</span>h</div>
        </div>
      </div>
      <div class="glass-card p-4 mb-4">
        <div class="flex items-center justify-between mb-3">
          <div class="font-semibold text-gray-800">待办任务</div>
          <button onclick="switchPage('tasks')" class="text-sm text-blue-500">查看全部 →</button>
        </div>
        <div id="dash-tasks"></div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <button onclick="switchPage('focus')" class="glass-card p-4 text-left active:scale-95 transition-transform">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center text-white text-lg mb-2">🍅</div>
          <div class="font-semibold text-gray-800">开始专注</div>
          <div class="text-xs text-gray-500 mt-1">番茄钟计时</div>
        </button>
        <button onclick="openTaskModal()" class="glass-card p-4 text-left active:scale-95 transition-transform">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-500 to-teal-400 flex items-center justify-center text-white text-lg mb-2">✏️</div>
          <div class="font-semibold text-gray-800">添加任务</div>
          <div class="text-xs text-gray-500 mt-1">快速记录</div>
        </button>
      </div>
    </div>
  </div>

  <!-- 任务管理 -->
  <div id="page-tasks" class="page">
    <div class="p-5">
      <div class="text-white text-2xl font-bold mb-3">学习任务</div>

      <!-- 快速添加模板 -->
      <div class="template-scroll mb-4" id="template-list"></div>

      <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
        <button onclick="setTaskFilter('all')" id="filter-all" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-blue-500 shadow">全部</button>
        <button onclick="setTaskFilter('active')" id="filter-active" class="filter-btn px-4 py-2 rounded-full text-sm font-medium glass text-white">未完成</button>
        <button onclick="setTaskFilter('completed')" id="filter-completed" class="filter-btn px-4 py-2 rounded-full text-sm font-medium glass text-white">已完成</button>
      </div>
      <div id="task-list"></div>
    </div>
    <div class="floating-btn" onclick="openTaskModal()">+</div>
  </div>

  <!-- 日程规划 -->
  <div id="page-schedule" class="page">
    <div class="p-5">
      <div class="text-white text-2xl font-bold mb-4">日程规划</div>
      <div class="glass-card p-4 mb-4">
        <div class="flex items-center justify-between mb-4">
          <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">←</button>
          <div class="font-semibold text-gray-800" id="calendar-month">2026年7月</div>
          <button onclick="changeMonth(1)" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">→</button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs text-gray-500 mb-2">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div class="grid grid-cols-7 gap-1" id="calendar-grid"></div>
      </div>
      <div class="glass-card p-4">
        <div class="font-semibold text-gray-800 mb-3" id="schedule-title">今日任务</div>
        <div id="schedule-today"></div>
      </div>
    </div>
  </div>

  <!-- 专注计时 -->
  <div id="page-focus" class="page">
    <div class="p-5">
      <div class="text-white text-2xl font-bold mb-6">专注计时</div>
      <div class="glass-card p-6 text-center">
        <div class="relative w-64 h-64 mx-auto mb-6">
          <svg class="w-64 h-64 progress-ring" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="54" fill="none" stroke="#e5e7eb" stroke-width="6"/>
            <circle id="progress-circle" cx="60" cy="60" r="54" fill="none" stroke="url(#grad)" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="339.292" stroke-dashoffset="0" class="progress-ring-circle"/>
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#5B86E5"/>
                <stop offset="100%" style="stop-color:#36D1DC"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <div class="text-5xl font-bold text-gray-800" id="focus-time">25:00</div>
            <div class="text-sm text-gray-500 mt-2" id="focus-status">准备开始</div>
          </div>
        </div>
        <div class="flex justify-center gap-3 mb-6">
          <button onclick="setFocusDuration(15)" class="duration-btn px-4 py-2 rounded-xl text-sm bg-gray-100 text-gray-600" data-duration="15">15分</button>
          <button onclick="setFocusDuration(25)" class="duration-btn px-4 py-2 rounded-xl text-sm bg-blue-100 text-blue-600 font-medium" data-duration="25">25分</button>
          <button onclick="setFocusDuration(45)" class="duration-btn px-4 py-2 rounded-xl text-sm bg-gray-100 text-gray-600" data-duration="45">45分</button>
          <button onclick="setFocusDuration(60)" class="duration-btn px-4 py-2 rounded-xl text-sm bg-gray-100 text-gray-600" data-duration="60">60分</button>
        </div>
        <div class="flex justify-center gap-4">
          <button id="focus-start" onclick="startFocus()" class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-cyan-400 text-white text-2xl shadow-lg flex items-center justify-center active:scale-95 transition-transform">▶</button>
          <button id="focus-pause" onclick="pauseFocus()" class="w-16 h-16 rounded-full bg-gray-200 text-gray-600 text-2xl hidden flex items-center justify-center active:scale-95 transition-transform">⏸</button>
          <button id="focus-reset" onclick="resetFocus()" class="w-16 h-16 rounded-full bg-gray-200 text-gray-600 text-xl flex items-center justify-center active:scale-95 transition-transform">↺</button>
        </div>
      </div>
      <div class="glass-card p-4 mt-4">
        <div class="font-semibold text-gray-800 mb-3">今日专注记录</div>
        <div id="focus-records"></div>
      </div>
    </div>
  </div>

  <!-- 效率复盘 -->
  <div id="page-review" class="page">
    <div class="p-5">
      <div class="text-white text-2xl font-bold mb-4">学习复盘</div>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="glass-card p-4 text-center">
          <div class="text-xs text-gray-500">本周完成率</div>
          <div class="text-3xl font-bold text-blue-500 mt-1"><span class="num-animate" id="review-week">0</span>%</div>
        </div>
        <div class="glass-card p-4 text-center">
          <div class="text-xs text-gray-500">本月完成率</div>
          <div class="text-3xl font-bold text-blue-500 mt-1"><span class="num-animate" id="review-month">0</span>%</div>
        </div>
        <div class="glass-card p-4 text-center">
          <div class="text-xs text-gray-500">累计专注</div>
          <div class="text-3xl font-bold text-cyan-500 mt-1"><span class="num-animate" id="review-focus">0</span>h</div>
        </div>
        <div class="glass-card p-4 text-center">
          <div class="text-xs text-gray-500">连续专注</div>
          <div class="text-3xl font-bold text-green-500 mt-1"><span class="num-animate" id="review-streak">0</span>天</div>
        </div>
      </div>
      <div class="glass-card p-4 mb-4">
        <div class="font-semibold text-gray-800 mb-4">近7日完成趋势</div>
        <div class="bar-chart" id="review-chart"></div>
      </div>
      <div class="glass-card p-4 mb-4">
        <div class="flex items-center justify-between">
          <div>
            <div class="font-semibold text-gray-800">学习效率评分</div>
            <div class="text-sm text-gray-500 mt-1">基于完成率和专注时长</div>
          </div>
          <div class="text-4xl font-bold text-blue-500" id="review-score">0</div>
        </div>
        <div class="mt-3 h-3 bg-gray-100 rounded-full overflow-hidden">
          <div id="score-bar" class="h-full rounded-full bg-gradient-to-r from-blue-500 to-cyan-400 transition-all duration-1" style="width: 0%"></div>
        </div>
      </div>

      <!-- 成就徽章 -->
      <div class="glass-card p-4 mb-4">
        <div class="font-semibold text-gray-800 mb-3">🏅 学习成就</div>
        <div class="grid grid-cols-3 gap-3" id="achievement-grid"></div>
      </div>

      <button onclick="showClearConfirm()" class="w-full glass-card p-4 text-center text-red-500 font-medium active:scale-95 transition-transform">
        重置所有数据
      </button>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="fixed bottom-0 left-0 right-0 glass px-2 pb-safe pt-2 z-50">
    <div class="flex justify-around items-center max-w-lg mx-auto">
      <button onclick="switchPage('dashboard')" class="nav-item active flex flex-col items-center py-2 px-3 text-gray-500" data-page="dashboard">
        <span class="text-xl mb-1">🏠</span>
        <span class="text-xs">首页</span>
      </button>
      <button onclick="switchPage('tasks')" class="nav-item flex flex-col items-center py-2 px-3 text-gray-500" data-page="tasks">
        <span class="text-xl mb-1">📝</span>
        <span class="text-xs">任务</span>
      </button>
      <button onclick="switchPage('schedule')" class="nav-item flex flex-col items-center py-2 px-3 text-gray-500" data-page="schedule">
        <span class="text-xl mb-1">📅</span>
        <span class="text-xs">日程</span>
      </button>
      <button onclick="switchPage('focus')" class="nav-item flex flex-col items-center py-2 px-3 text-gray-500" data-page="focus">
        <span class="text-xl mb-1">🍅</span>
        <span class="text-xs">专注</span>
      </button>
      <button onclick="switchPage('review')" class="nav-item flex flex-col items-center py-2 px-3 text-gray-500" data-page="review">
        <span class="text-xl mb-1">📊</span>
        <span class="text-xs">复盘</span>
      </button>
    </div>
  </nav>

  <!-- 添加任务模态框 -->
  <div class="modal-overlay" id="task-modal" onclick="if(event.target===this)closeTaskModal()">
    <div class="modal-content">
      <div class="flex items-center justify-between mb-4">
        <div class="text-lg font-semibold" id="modal-title">添加任务</div>
        <button onclick="closeTaskModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">✕</button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-gray-600 mb-1">任务名称</label>
          <input type="text" id="task-title" placeholder="输入任务名称..." class="w-full px-4 py-3 rounded-xl bg-gray-50 border-0 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">学科分类</label>
          <div class="subject-grid" id="subject-grid"></div>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">优先级</label>
          <div class="flex gap-2">
            <button onclick="setTaskPriority('high')" class="pri-btn flex-1 py-2 rounded-xl text-sm bg-red-100 text-red-600" data-pri="high">高</button>
            <button onclick="setTaskPriority('medium')" class="pri-btn flex-1 py-2 rounded-xl text-sm bg-yellow-100 text-yellow-700" data-pri="medium">中</button>
            <button onclick="setTaskPriority('low')" class="pri-btn flex-1 py-2 rounded-xl text-sm bg-green-100 text-green-600" data-pri="low">低</button>
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">截止日期</label>
          <input type="date" id="task-date" class="w-full px-4 py-3 rounded-xl bg-gray-50 border-0 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button onclick="saveTask()" id="save-task-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-400 text-white font-medium shadow-lg active:scale-95 transition-transform">保存任务</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 确认对话框 -->
  <div class="confirm-dialog" id="confirm-dialog" onclick="if(event.target===this)hideConfirmDialog()">
    <div class="confirm-box">
      <div class="text-lg font-semibold mb-2" id="confirm-title">确认重置？</div>
      <div class="text-sm text-gray-500 mb-4" id="confirm-message">这将清空所有任务和专注记录，不可恢复。</div>
      <div class="flex gap-3">
        <button onclick="hideConfirmDialog()" class="flex-1 py-2 rounded-xl bg-gray-100 text-gray-600">取消</button>
        <button onclick="handleConfirm()" class="flex-1 py-2 rounded-xl bg-red-500 text-white" id="confirm-btn">确认重置</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="dashboard.js"></script>
  <script src="tasks.js"></script>
  <script src="schedule.js"></script>
  <script src="focus.js"></script>
  <script src="review.js"></script>
  <script src="app.js"></script>
</body>
</html>
