<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>育儿帮 - 成长记录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">👶 育儿帮</div>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="growth.html" class="active">成长记录</a></li>
        <li><a href="behavior.html">行为解读</a></li>
        <li><a href="feeding.html">喂养指南</a></li>
        <li><a href="clothes.html">穿衣指南</a></li>
        <li><a href="toys.html">玩具推荐</a></li>
        <li><a href="books.html">阅读建议</a></li>
        <li><a href="vaccine.html">疫苗接种</a></li>
      </ul>
      <div class="mobile-menu-btn">☰</div>
    </nav>
  </header>

  <main>
    <section class="section">
      <h2 class="section-title">📝 记录宝宝成长</h2>
      
      <div class="tab-container">
        <div class="tab-buttons">
          <button class="tab-btn active" onclick="switchTab('data')">📊 成长数据</button>
          <button class="tab-btn" onclick="switchTab('moments')">📸 成长瞬间</button>
        </div>

        <div class="tab-content" id="data-tab">
          <div class="form-container">
            <form id="growth-form">
              <div class="form-group">
                <label for="record-date">记录日期:</label>
                <input type="date" id="record-date" required>
              </div>
              
              <div class="form-group">
                <label for="baby-age">宝宝月龄:</label>
                <input type="text" id="baby-age" placeholder="例如: 6个月" required>
              </div>
              
              <div class="form-group">
                <label for="height">身高 (cm):</label>
                <input type="number" id="height" step="0.1" placeholder="例如: 65.5">
              </div>
              
              <div class="form-group">
                <label for="weight">体重 (kg):</label>
                <input type="number" id="weight" step="0.1" placeholder="例如: 7.2">
              </div>
              
              <div class="form-group">
                <label for="head-circumference">头围 (cm):</label>
                <input type="number" id="head-circumference" step="0.1" placeholder="例如: 42.0">
              </div>
              
              <div class="form-group">
                <label for="notes">备注:</label>
                <textarea id="notes" placeholder="记录宝宝的成长趣事或特殊情况..."></textarea>
              </div>
              
              <button type="submit" class="btn btn-primary">保存记录</button>
            </form>
          </div>

          <div class="section" style="padding-top: 2rem;">
            <h3 class="section-title" style="font-size: 1.5rem;">📊 成长记录列表</h3>
            <div id="records-list"></div>
          </div>
        </div>

        <div class="tab-content" id="moments-tab" style="display: none;">
          <div class="form-container">
            <h3 style="margin-bottom: 1.5rem; color: #333;">📸 添加成长瞬间</h3>
            <form id="moment-form">
              <div class="form-group">
                <label for="moment-date">日期:</label>
                <input type="date" id="moment-date" required>
              </div>
              
              <div class="form-group">
                <label for="moment-age">宝宝月龄:</label>
                <input type="text" id="moment-age" placeholder="例如: 6个月" required>
              </div>
              
              <div class="form-group">
                <label for="moment-image">上传照片:</label>
                <div class="file-upload">
                  <input type="file" id="moment-image" accept="image/*" required>
                  <label for="moment-image" class="upload-label">
                    <span class="upload-icon">📷</span>
                    <span class="upload-text">点击选择照片</span>
                  </label>
                  <img id="preview-image" class="image-preview" style="display: none;" />
                </div>
              </div>
              
              <div class="form-group">
                <label for="moment-desc">描述:</label>
                <textarea id="moment-desc" placeholder="记录这个美好的瞬间..."></textarea>
              </div>
              
              <button type="submit" class="btn btn-primary">保存瞬间</button>
            </form>
          </div>

          <div class="section" style="padding-top: 2rem;">
            <h3 class="section-title" style="font-size: 1.5rem;">✨ 成长时光轴</h3>
            <div id="moments-timeline"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
