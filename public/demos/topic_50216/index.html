            watchState.wallpaper = wp;
            if (dataUrl) {
                if (opts && opts.silent !== true && window.watchConfig) {
                    watchConfig.set(WALLPAPER_TYPE, dataUrl);
                }
                watchFaceEl.setAttribute('data-wallpaper', '');
                // Apply the wallpaper via inline style (in addition
                // to the CSS-variable rule) so it works regardless
                // of CSS resolution timing.
                watchFaceEl.style.setProperty('--wallpaper-image', `url("${dataUrl}")`);
                watchFaceEl.style.background =
                    `linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.45)), ` +
                    `url("${dataUrl}") center / cover no-repeat`;
            } else {
                if (opts && opts.silent !== true && window.watchConfig) {
                    watchConfig.remove(WALLPAPER_TYPE);
                }
                watchFaceEl.removeAttribute('data-wallpaper');
                watchFaceEl.style.removeProperty('--wallpaper-image');
                watchFaceEl.style.removeProperty('background');
            }
            document.querySelectorAll('.watch-window').forEach(win => {
                const sync = win.__wallpaperSync;
                if (typeof sync === 'function') sync(wp);
            });
            return true;
        }

        // Public API for the Settings app
        window.WatchFace = {
            setFace,
            setWallpaper,
            reset() {
                setFace('classic');
                setWallpaper(null);
            },
            getFace() {
                return watchState.face;
            },
            getWallpaper() {
                return watchState.wallpaper;
            }
        };

        // Restore saved preferences on first load (silent = don't
        // re-write to IndexedDB). watchState is updated through
        // setFace/setWallpaper so the in-memory state stays in sync
        // with what the watch face is actually showing. Values come
        // from the watchConfig cache, which was populated at the
        // top of this IIFE.
        if (window.watchConfig) {
            const savedFace = watchConfig.get(FACE_TYPE);
            if (savedFace) setFace(savedFace, { silent: true });
            const savedWp = watchConfig.get(WALLPAPER_TYPE);
            if (savedWp) setWallpaper(savedWp, { silent: true });
        }

        // =========================================================
        // Exit to desktop
        // =========================================================
        document.getElementById('exitBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // =========================================================
        // Build dial ticks & numerals (percentage-based so they
        // scale together with the watch face during the
        // shrink/exit animation)
        // =========================================================
        const dial = document.getElementById('dial');

        function buildDial() {
            const dialEl = dial;
            const size   = dialEl.clientWidth;
            const radius = size / 2;
            for (let i = 0; i < 60; i++) {
                const isMajor = i % 5 === 0;
                const t = document.createElement('div');
                t.className = 'tick ' + (isMajor ? 'major' : 'minor');
                const angleDeg = i * 6;
                const angleRad = angleDeg * Math.PI / 180;
                const tickLen   = isMajor ? 14 : 6;
                const tickWidth = isMajor ? 2  : 1;
                const r = radius - 14 - tickLen / 2;
                const cx = radius + Math.sin(angleRad) * r;
                const cy = radius - Math.cos(angleRad) * r;

                t.style.position = 'absolute';
                t.style.left = (((cx - tickWidth / 2) / size) * 100) + '%';
                t.style.top  = (((cy - tickLen / 2) / size) * 100) + '%';
                t.style.width  = (tickWidth / size * 100) + '%';
                t.style.height = (tickLen / size * 100) + '%';
                t.style.margin = '0';
                t.style.background = isMajor ? 'var(--tick-major)' : 'var(--tick-minor)';
                t.style.borderRadius = '1px';
                t.style.transformOrigin = 'center center';
                t.style.transform = `rotate(${angleDeg}deg)`;
                dialEl.appendChild(t);
            }
            for (let h = 1; h <= 12; h++) {
                const n = document.createElement('div');
                n.className = 'numeral';
                n.textContent = h;
                const angleDeg = h * 30;
                const angleRad = angleDeg * Math.PI / 180;
                const r = radius - 42;
                const x = radius + Math.sin(angleRad) * r;
                const y = radius - Math.cos(angleRad) * r;
                n.style.position = 'absolute';
                n.style.left = (((x - 14) / size) * 100) + '%';
                n.style.top  = (((y - 14) / size) * 100) + '%';
                n.style.width  = (28 / size * 100) + '%';
                n.style.height = (28 / size * 100) + '%';
                n.style.margin = '0';
                n.style.lineHeight = '1';
                n.style.display = 'grid';
                n.style.placeItems = 'center';
                n.style.fontSize = (18 / size * 100) + '%';
                dialEl.appendChild(n);
            }
        }
        requestAnimationFrame(() => buildDial());
        window.addEventListener('resize', () => {
            clearTimeout(window.__drt);
            window.__drt = setTimeout(() => {
                dial.innerHTML = '';
                buildDial();
            }, 120);
        });

        // =========================================================
        // App ring (data source: AppWatch.list())
        // =========================================================
        const appRing = document.getElementById('appRing');
        const orbit   = document.getElementById('watchOrbit');
        const ringTrack = document.getElementById('ringTrack');

        function computeRing() {
            const size = Math.min(orbit.clientWidth, orbit.clientHeight);
            const vmin = Math.min(window.innerWidth, window.innerHeight);
            // Match the CSS: .watch-face { width: clamp(240px, 32vmin, 320px); }
            const clockSize = Math.max(240, Math.min(vmin * 0.32, 320));
            // Minimum radius must clear: watch-face half + bezel (10px)
            // + app-icon half (30px) + breathing room (70px) so the
            // icons never overlap the watch face or the search box.
            const minRadius = clockSize / 2 + 10 + 30 + 70;
            // Maximum radius keeps the icon inside the orbit.
            const maxRadius = size / 2 - 30;
            const ideal = (size - clockSize) / 2;
            const radius = Math.max(minRadius, Math.min(maxRadius, ideal));
            return { size, radius, clockSize };
        }

        function renderApps() {
            appRing.innerHTML = '';
            const APPS = AppWatch.list();
            const N = APPS.length;
            const { radius } = computeRing();
            const trackInset = (ringTrack.parentElement.clientWidth - radius * 2) / 2;
            ringTrack.style.inset = trackInset + 'px';

            APPS.forEach((app, i) => {
                const angleDeg = -90 + (360 / N) * i;
                const angle = angleDeg * Math.PI / 180;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;

                const el = document.createElement('button');
                // Apps positioned above the horizontal midline (y < 0)
                // sit on the upper half of the ring; render the hover
                // label above them so it doesn't overlap the watch face.
                el.className = 'app-icon' + (y < 0 ? ' app-icon--top' : '');
                el.type = 'button';
                el.style.setProperty('--app-color', app.color);
                el.style.left = `calc(50% + ${x}px)`;
                el.style.top  = `calc(50% + ${y}px)`;
                el.style.opacity = '0';
                el.style.animation = `spiralIn 0.7s var(--ease-out) ${0.35 + i * 0.05}s both`;
                el.setAttribute('data-app-id', app.id);
                el.setAttribute('aria-label', app.name);
                el.title = app.name;

                el.innerHTML = `
                    <i class="${app.icon}"></i>
                    <span class="label">${app.name}</span>
                `;

                el.addEventListener('click', () => AppWatch.open(app.id));
                appRing.appendChild(el);
            });
        }
        renderApps();
        window.addEventListener('resize', () => {
            clearTimeout(window.__rt);
            window.__rt = setTimeout(renderApps, 100);
        });

        // =========================================================
        // Clock — smooth second hand
        // =========================================================
        const handHour   = document.getElementById('handHour');
        const handMinute = document.getElementById('handMinute');
        const handSecond = document.getElementById('handSecond');
        const dh = document.getElementById('dh');
        const dm = document.getElementById('dm');
        const ds = document.getElementById('ds');
        const ampmEl = document.getElementById('ampm');
        const dateText = document.getElementById('dateText');
        const weekday  = document.getElementById('weekday');

        const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        const pad = n => n < 10 ? '0' + n : '' + n;

        function updateClock() {
            const now = new Date();
            const ms = now.getMilliseconds();
            const s  = now.getSeconds();
            const m  = now.getMinutes();
            const h  = now.getHours();

            const secAngle  = (s + ms / 1000) * 6;
            const minAngle  = (m + s / 60) * 6;
            const hourAngle = ((h % 12) + m / 60) * 30;

            handSecond.style.transform = `translateX(-50%) rotate(${secAngle}deg)`;
            handMinute.style.transform = `translateX(-50%) rotate(${minAngle}deg)`;
            handHour.style.transform   = `translateX(-50%) rotate(${hourAngle}deg)`;

            dh.textContent = pad(h);
            dm.textContent = pad(m);
            ds.textContent = pad(s);
            ampmEl.textContent = h >= 12 ? 'PM' : 'AM';

            dateText.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
            weekday.textContent = WEEK[now.getDay()];
        }
        function tick() { updateClock(); requestAnimationFrame(tick); }
        requestAnimationFrame(tick);

        // =========================================================
        // Search
        // =========================================================
        const searchShell  = document.getElementById('searchShell');
        const searchInput  = document.getElementById('searchInput');
        const searchClear  = document.getElementById('searchClear');
        const searchResults = document.getElementById('searchResults');
        const searchEngineBtn  = document.getElementById('searchEngineBtn');
        const searchEngineIcon = document.getElementById('searchEngineIcon');
        const engineMenu  = document.getElementById('engineMenu');

        // ---- Search engine state ----
        const ENGINES = {
            google: {
                name: 'Google', icon: 'fab fa-google', color: '#4285f4',
                url: 'https://www.google.com/search?q={query}',
                suggestUrl: 'https://clientservices.google.com/websurveys/freebase_v1',
                parse: (data) => (data && data[1]) ? data[1].slice(0, 6).map(t => t[0]) : []
            },
            bing: {
                name: 'Bing', icon: 'fab fa-microsoft', color: '#00a4ef',
                url: 'https://www.bing.com/search?q={query}',
                // Bing also uses baidu's endpoint via cross-origin trick;
                // fall back to baidu suggest for completeness
                suggestUrl: 'https://suggestion.baidu.com/su',
                parse: (data) => (data && data.s) ? data.s.slice(0, 6) : []
            },
            baidu: {
                name: '百度', icon: 'fas fa-paw', color: '#306CFF',
                url: 'https://www.baidu.com/s?wd={query}',
                suggestUrl: 'https://suggestion.baidu.com/su',
                parse: (data) => (data && data.s) ? data.s.slice(0, 6) : []
            },
            custom: {
                name: '自定义', icon: 'fas fa-globe', color: 'var(--gold)',
                url: '',
                suggestUrl: null,
                parse: () => []
            }
        };

        let currentEngine = 'google';

        const SEARCH_ENGINE_TYPE     = (window.WATCH_CONFIG_TYPES && WATCH_CONFIG_TYPES.SEARCH_ENGINE)     || 'watchSearchEngine';
        const CUSTOM_SEARCH_URL_TYPE = (window.WATCH_CONFIG_TYPES && WATCH_CONFIG_TYPES.CUSTOM_SEARCH_URL) || 'watchCustomSearchUrl';

        function loadSearchEngine() {
            if (!window.watchConfig) return;
            const stored = watchConfig.get(SEARCH_ENGINE_TYPE);
            if (stored && ENGINES[stored]) currentEngine = stored;
            const customUrl = watchConfig.get(CUSTOM_SEARCH_URL_TYPE);
            if (customUrl) ENGINES.custom.url = customUrl;
        }

        function saveSearchEngine() {
            if (!window.watchConfig) return;
            watchConfig.set(SEARCH_ENGINE_TYPE, currentEngine);
            if (currentEngine === 'custom') {
                watchConfig.set(CUSTOM_SEARCH_URL_TYPE, ENGINES.custom.url);
            }
        }

        function updateEngineIcon(spin) {
            const engine = ENGINES[currentEngine];
            if (spin) {
                searchEngineBtn.classList.add('spin');
                setTimeout(() => searchEngineBtn.classList.remove('spin'), 450);
            }
            // Update icon by setting className + style on the live element
            const iconEl = document.getElementById('searchEngineIcon');
            if (iconEl) {
                iconEl.className = engine.icon;
                iconEl.style.color = engine.color;
            }
            // Update active state on menu
            engineMenu.querySelectorAll('.engine-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.engine === currentEngine);
            });
        }

        function buildSearchUrl(query) {
            const engine = ENGINES[currentEngine];
            const tpl = engine.url;
            if (!tpl) return null;
            return tpl.replace('{query}', encodeURIComponent(query));
        }

        loadSearchEngine();
        // Initial render (no spin)
        searchEngineIcon.className = ENGINES[currentEngine].icon;
        searchEngineIcon.style.color = ENGINES[currentEngine].color;
        engineMenu.querySelectorAll('.engine-option').forEach(opt => {
            opt.classList.toggle('active', opt.dataset.engine === currentEngine);
        });

        // Expose a public API for the Settings app to push engine changes back
        window.WatchSearch = {
            setEngine(engId, customUrl) {
                if (!ENGINES[engId]) return;
                currentEngine = engId;
                if (engId === 'custom' && customUrl) {
                    ENGINES.custom.url = customUrl;
                }
                saveSearchEngine();
                updateEngineIcon(true);
                // Clear suggestion cache (engine changed)
                suggestCache.clear();
                // Re-render current results if any
                if (activeQuery) {
                    clearTimeout(window.__suggestTimer);
                    updateSuggestions(activeQuery);
                }
            }
        };

        // Engine button: cycle through engines on click
        searchEngineBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const order = ['google', 'bing', 'baidu', 'custom'];
            const idx = order.indexOf(currentEngine);
            const next = order[(idx + 1) % order.length];
            currentEngine = next;
            saveSearchEngine();
            updateEngineIcon(true);
            // Close any open dropdowns to avoid stacking
            searchResults.classList.remove('show');
            // Refresh suggestions / results for current query
            if (activeQuery) {
                clearTimeout(window.__suggestTimer);
                updateSuggestions(activeQuery);
            }
        });

        // Shift+click or right-click opens the full engine menu
        searchEngineBtn.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            searchResults.classList.remove('show');
            engineMenu.classList.toggle('show');
        });
        searchEngineBtn.addEventListener('mousedown', (e) => {
            if (e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                searchResults.classList.remove('show');
                engineMenu.classList.toggle('show');
            }
        });

        // Click an engine option in the menu
        engineMenu.querySelectorAll('.engine-option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                e.stopPropagation();
                const eng = opt.dataset.engine;
                if (!ENGINES[eng]) return;
                if (eng === 'custom' && !ENGINES.custom.url) {
                    // Prompt for URL the first time
                    const url = prompt('输入自定义搜索引擎 URL，使用 {query} 表示搜索关键词：\n例如：https://www.google.com/search?q={query}',
                                       ENGINES.custom.url || 'https://www.google.com/search?q={query}');
                    if (!url) { engineMenu.classList.remove('show'); return; }
                    if (!url.includes('{query}')) { alert('URL 必须包含 {query} 占位符'); engineMenu.classList.remove('show'); return; }
                    ENGINES.custom.url = url;
                }
                currentEngine = eng;
                saveSearchEngine();
                updateEngineIcon(true);
                engineMenu.classList.remove('show');
                if (activeQuery) {
                    clearTimeout(window.__suggestTimer);
                    updateSuggestions(activeQuery);
                }
            });
        });

        // Close engine menu when clicking elsewhere
        document.addEventListener('click', (e) => {
            if (!engineMenu.contains(e.target) && e.target !== searchEngineBtn && !searchEngineBtn.contains(e.target)) {
                engineMenu.classList.remove('show');
            }
        });

        // ---- App search ----
        function searchApps(q) {
            q = q.trim().toLowerCase();
            if (!q) return [];
            return AppWatch.list().filter(a => a.name.toLowerCase().includes(q)).slice(0, 4);
        }

        // ---- Web search suggestions (JSONP) ----
        let suggestCache = new Map();
        function fetchSuggestions(query) {
            return new Promise((resolve) => {
                const cacheKey = currentEngine + '::' + query;
                if (suggestCache.has(cacheKey)) {
                    resolve(suggestCache.get(cacheKey));
                    return;
                }
                const engine = ENGINES[currentEngine];
                if (!engine.suggestUrl) { resolve([]); return; }

                const callbackName = 'watchSuggest_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                const script = document.createElement('script');
                let settled = false;
                const cleanup = () => {
                    clearTimeout(timeoutId);
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                };
                const timeoutId = setTimeout(() => {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    resolve([]);
                }, 1200);

                window[callbackName] = function (data) {
                    if (settled) return;
                    settled = true;
                    const list = engine.parse(data) || [];
                    suggestCache.set(cacheKey, list);
                    cleanup();
                    resolve(list);
                };

                let src = engine.suggestUrl;
                if (engine.suggestUrl.includes('baidu.com')) {
                    src += `?wd=${encodeURIComponent(query)}&cb=${callbackName}`;
                } else {
                    src += `?callback=${callbackName}&q=${encodeURIComponent(query)}`;
                }
                script.src = src;
                script.onerror = () => {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    resolve([]);
                };
                document.head.appendChild(script);
            });
        }

        function updateSuggestions(query) {
            // Render app matches immediately
            const appMatches = searchApps(query);
            if (appMatches.length === 0 && !query) {
                searchResults.classList.remove('show');
                return;
            }
            renderResults(appMatches, [], query);
            searchResults.classList.add('show');

            // Then fetch web suggestions (debounced via outer timer)
            fetchSuggestions(query).then(suggestions => {
                if (activeQuery !== query) return; // stale
                renderResults(searchApps(query), suggestions, query);
                if (searchResults.children.length > 0) searchResults.classList.add('show');
            });
        }

        function renderResults(apps, suggestions, query) {
            const hasApps = apps && apps.length > 0;
            const hasSugg = suggestions && suggestions.length > 0;
            if (!hasApps && !hasSugg) {
                const engine = ENGINES[currentEngine];
                const url = buildSearchUrl(query);
                searchResults.innerHTML = `
                    <div class="result-empty">
                        未找到匹配项，按 <kbd>Enter</kbd> 使用 ${engine.name} 搜索
                    </div>
                `;
                return;
            }
            let html = '';
            if (hasApps) {
                html += `<div class="result-section">`;
                html += `<div class="result-section-head"><i class="fas fa-cube"></i><span>应用</span></div>`;
                html += apps.map(m => `
                    <div class="result-item" data-app-id="${m.id}" style="--app-color:${m.color}">
                        <span class="result-icon"><i class="${m.icon}"></i></span>
                        <span class="result-label">${m.name}</span>
                        <span class="result-meta">启动</span>
                    </div>
                `).join('');
                html += `</div>`;
            }
            if (hasSugg) {
                const engine = ENGINES[currentEngine];
                html += `<div class="result-section">`;
                html += `<div class="result-section-head"><i class="${engine.icon}"></i><span>${engine.name} 建议</span></div>`;
                html += suggestions.map(s => {
                    const safe = String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
                    return `
                    <div class="result-item suggest-item" data-suggest="${safe}">
                        <span class="result-icon"><i class="fas fa-magnifying-glass"></i></span>
                        <span class="result-label">${safe}</span>
                        <i class="fas fa-arrow-turn-down result-suggest-icon" style="transform: rotate(-90deg)"></i>
                    </div>
                    `;
                }).join('');
                html += `</div>`;
            }
            // Footer: search the web
            const engine = ENGINES[currentEngine];
            const esc = (s) => String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
            html += `
                <div class="result-section">
                    <div class="result-item web-search" data-query="${esc(query)}">
                        <span class="result-icon" style="color:${engine.color};background:color-mix(in srgb, ${engine.color} 18%, transparent)"><i class="${engine.icon}"></i></span>
                        <span class="result-label">使用 ${engine.name} 搜索 "<strong>${esc(query)}</strong>"</span>
                        <i class="fas fa-arrow-up-right-from-square result-suggest-icon"></i>
                    </div>
                </div>
            `;
            searchResults.innerHTML = html;

            // Wire up clicks
            searchResults.querySelectorAll('.result-item[data-app-id]').forEach(el => {
                el.addEventListener('click', () => AppWatch.open(el.dataset.appId));
            });
            searchResults.querySelectorAll('.suggest-item').forEach(el => {
                el.addEventListener('click', () => {
                    const q = el.dataset.suggest;
                    searchInput.value = q;
                    activeQuery = q;
                    searchShell.classList.add('has-value');
                    const url = buildSearchUrl(q);
                    if (url) window.open(url, '_blank');
                });
            });
            searchResults.querySelectorAll('.web-search').forEach(el => {
                el.addEventListener('click', () => {
                    const url = buildSearchUrl(el.dataset.query);
                    if (url) window.open(url, '_blank');
                });
            });
        }

        let activeQuery = '';
        let suggestDebounce = null;
        searchInput.addEventListener('input', e => {
            activeQuery = e.target.value;
            searchShell.classList.toggle('has-value', !!activeQuery);
            if (activeQuery) {
                updateSuggestions(activeQuery);
            } else {
                searchResults.classList.remove('show');
            }
        });
        searchInput.addEventListener('focus', () => {
            // Close engine menu when user focuses the input
            engineMenu.classList.remove('show');
            if (activeQuery) {
                updateSuggestions(activeQuery);
            }
        });
        searchInput.addEventListener('blur', () => {
            setTimeout(() => {
                searchResults.classList.remove('show');
                engineMenu.classList.remove('show');
            }, 180);
        });
        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const query = activeQuery.trim();
                if (!query) return;
                // Prefer app match
                const appMatches = searchApps(query);
                if (appMatches.length) {
                    AppWatch.open(appMatches[0].id);
                } else {
                    const url = buildSearchUrl(query);
                    if (url) window.open(url, '_blank');
                }
            } else if (e.key === 'Escape') {
                searchInput.value = '';
                activeQuery = '';
                searchShell.classList.remove('has-value');
                searchResults.classList.remove('show');
                engineMenu.classList.remove('show');
                searchInput.blur();
            }
        });
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            activeQuery = '';
            searchShell.classList.remove('has-value');
            searchResults.classList.remove('show');
            searchInput.focus();
        });

        // =========================================================
        // Keyboard shortcuts
        // =========================================================
        document.addEventListener('keydown', e => {
            // Don't hijack keys while typing in a window
            const inWin = e.target.closest('.watch-window');
            if (inWin) return;
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                searchInput.focus();
            } else if (e.key === 'Escape' && AppWatch.isAppOpen) {
                AppWatch.closeAll();
            }
        });
    })();
    </script>
</body>
</html>
