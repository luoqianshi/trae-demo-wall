<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>死亡周历 - 一生约四千周，你走到了哪一行</title>
  <meta name="description" content="输入生日，生成你的人生周历。用一生的尺度看待时间分配。">
  <style>
    /* ============================================================
       [1] CSS 变量 & 基础重置
       低饱和暖色系配色，温柔治愈风格
    ============================================================ */
    :root {
      --bg-primary: #FAF7F4;
      --bg-card: #F5F0EB;
      --bg-row-highlight: #F0EAE3;
      --text-title: #4A403A;
      --text-body: #8C8279;
      --text-year: #9E958C;
      --dot-filled: #3D3D3D;       /* 已度过：近黑色，醒目 */
      --dot-before-birth: #C4BDB5; /* 出生前：浅灰色 */
      --dot-outline: #D9CFC4;
      --dot-current: #D4A574;
      --dot-dashed: #C4B8AA;
      --btn-primary: #8B7355;
      --btn-primary-hover: #7A6548;
      --btn-reset: #A69B90;
      --btn-reset-hover: #8C8279;
      --error: #C4715A;
      --tooltip-bg: rgba(74, 64, 58, 0.9);
      --dot-size: 8px;
      --dot-gap: 3px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-title);
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 16px;
    }

    /* ============================================================
       [2] 顶部标题区
       产品名称 + 治愈系副文案
    ============================================================ */
    .header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }
    .title {
      font-size: 28px;
      font-weight: 500;
      color: var(--text-title);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 16px;
      color: var(--text-body);
      font-weight: 400;
    }

    /* ============================================================
       [3] 输入面板
       生日选择器 + 性别单选 + 生成按钮 + 重置按钮 + 内联验证
    ============================================================ */
    .input-panel {
      max-width: 400px;
      margin: 0 auto 32px;
      padding: 24px;
      background: var(--bg-card);
      border-radius: 12px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group > label {
      display: block;
      font-size: 14px;
      color: var(--text-body);
      margin-bottom: 8px;
    }
    input[type="date"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--dot-outline);
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
      color: var(--text-title);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="date"]:focus {
      border-color: var(--btn-primary);
    }
    .gender-options {
      display: flex;
      gap: 16px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-title);
    }
    .radio-label input[type="radio"] {
      accent-color: var(--btn-primary);
      width: 16px;
      height: 16px;
    }
    .error-msg {
      display: block;
      font-size: 12px;
      color: var(--error);
      margin-top: 4px;
      min-height: 18px;
    }

    /* ============================================================
       [4] 按钮样式
       主按钮（生成）+ 次按钮（保存图片）+ 重置按钮
    ============================================================ */
    .btn-primary, .btn-secondary, .btn-reset {
      display: block;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:active, .btn-secondary:active, .btn-reset:active {
      transform: scale(0.98);
    }
    .btn-primary {
      width: 100%;
      padding: 12px 24px;
      background: var(--btn-primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--btn-primary-hover); }
    .btn-secondary {
      padding: 10px 24px;
      background: transparent;
      border: 1px solid var(--btn-primary);
      color: var(--btn-primary);
      max-width: 200px;
      margin: 0 auto;
    }
    .btn-secondary:hover { background: var(--bg-card); }
    .btn-reset {
      width: 100%;
      padding: 10px 24px;
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--btn-reset);
      color: var(--btn-reset);
      font-size: 13px;
    }
    .btn-reset:hover {
      background: var(--bg-card);
      border-color: var(--btn-reset-hover);
      color: var(--btn-reset-hover);
    }

    /* ============================================================
       [5] 数据概览区
       三卡片横向排列：预期生命周数 / 已过完周数 / 剩余周数
    ============================================================ */
    .stats-panel {
      display: flex;
      justify-content: center;
      gap: 16px;
      max-width: 600px;
      margin: 0 auto 32px;
    }
    .stat-card {
      flex: 1;
      text-align: center;
      padding: 20px 12px;
      background: var(--bg-card);
      border-radius: 12px;
    }
    .stat-number {
      font-size: 36px;
      font-weight: 600;
      color: var(--text-title);
      line-height: 1.2;
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-body);
      margin-top: 6px;
    }

    /* ============================================================
       [6] 周历矩阵区（核心视觉）
       100行×52列 CSS Grid 圆点矩阵
       左侧年龄标注 + 右侧自然年份标注
    ============================================================ */
    .matrix-section {
      max-width: 680px;
      margin: 0 auto 16px;
      position: relative;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .matrix-container {
      display: flex;
      flex-direction: column;
      gap: var(--dot-gap);
      min-width: 300px;
    }

    /* 单行：左标签 + 52圆点 + 右标签 */
    .matrix-row {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
    }

    /* 预期寿命行背景高亮 */
    .matrix-row.expectancy-row {
      background: var(--bg-row-highlight);
      border-radius: 4px;
      margin: 0 -6px;
      padding: 2px 6px;
    }

    /* 左侧年龄标签 */
    .year-label-left {
      width: 36px;
      font-size: 11px;
      color: var(--text-year);
      text-align: right;
      flex-shrink: 0;
      user-select: none;
    }
    /* 预期寿命行左侧标签：用高亮背景行本身来标记，标签不加特殊色 */
    .year-label-left.expectancy-label {
      color: var(--text-year);
      font-weight: 500;
    }

    /* 右侧自然年份标签 */
    .year-label-right {
      width: 44px;
      font-size: 11px;
      color: var(--text-year);
      text-align: left;
      flex-shrink: 0;
      user-select: none;
    }
    /* 预期寿命行右侧标签 */
    .year-label-right.expectancy-label {
      color: var(--text-year);
      font-weight: 500;
    }

    /* 圆点网格：52列 */
    .dots-grid {
      display: grid;
      grid-template-columns: repeat(52, var(--dot-size));
      gap: var(--dot-gap);
      flex-shrink: 0;
    }

    /* ============================================================
       [7] 圆点状态样式（四种）
       before-birth(灰色) / filled(黑色) / current(琥珀色) / empty(空心)
    ============================================================ */
    .dot {
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      transition: transform 0.15s ease;
      cursor: pointer;
    }
    .dot:hover { transform: scale(1.6); z-index: 2; position: relative; }

    /* 已度过：近黑色实心 */
    .dot.filled { background: var(--dot-filled); }

    /* 出生前：浅灰色实心 */
    .dot.before-birth { background: var(--dot-before-birth); }

    /* 当前周：琥珀色描边 + 脉动动画 */
    .dot.current {
      border: 2px solid var(--dot-current);
      background: transparent;
      animation: pulse 2s ease-in-out infinite;
    }

    /* 尚未到来：浅色描边空心 */
    .dot.empty {
      border: 1px solid var(--dot-outline);
      background: transparent;
    }

    /* 预期寿命行圆点：虚线边框 */
    .dot.expectancy-dot.empty,
    .dot.expectancy-dot.current {
      border-style: dashed;
    }
    .dot.expectancy-dot.filled,
    .dot.expectancy-dot.before-birth {
      box-shadow: 0 0 0 1px var(--dot-dashed);
    }

    /* 当前周脉动动画 */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }

    /* 逐行淡入动画 */
    @keyframes rowFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .matrix-row.animate {
      animation: rowFadeIn 0.3s ease-out forwards;
    }

    /* ============================================================
       [8] 图例区域
       说明四种圆点的含义
    ============================================================ */
    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto 24px;
      padding: 12px 16px;
      background: var(--bg-card);
      border-radius: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-body);
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-dot.filled { background: var(--dot-filled); }
    .legend-dot.before-birth { background: var(--dot-before-birth); }
    .legend-dot.current {
      border: 2px solid var(--dot-current);
      background: transparent;
    }
    .legend-dot.empty {
      border: 1px solid var(--dot-outline);
      background: transparent;
    }

    /* ============================================================
       [9] Tooltip 提示框
       Hover圆点时显示：自然年份、周数、日期区间
    ============================================================ */
    .tooltip {
      position: fixed;
      background: var(--tooltip-bg);
      color: #fff;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 1000;
      line-height: 1.5;
    }
    .tooltip.show { opacity: 1; }
    .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--tooltip-bg);
    }
    .tooltip .tip-date {
      display: block;
      font-size: 11px;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* ============================================================
       [10] 操作栏 & 底部信息区
    ============================================================ */
    .action-panel {
      text-align: center;
      margin-bottom: 24px;
    }
    /* 数据说明文字 */
    .stats-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-body);
      max-width: 600px;
      margin: 0 auto 24px;
      line-height: 1.6;
      opacity: 0.85;
    }

    /* 预期寿命行备注 */
    .expectancy-note {
      text-align: center;
      font-size: 12px;
      color: var(--dot-current);
      max-width: 600px;
      margin: 0 auto 8px;
      opacity: 0.85;
      font-weight: 400;
    }

    .footer {
      text-align: center;
      padding: 24px 16px 40px;
      background: var(--bg-card);
      border-radius: 12px;
      max-width: 680px;
      margin: 24px auto 0;
    }
    .footer-title {
      font-size: 14px;
      color: var(--text-title);
      margin-bottom: 16px;
      font-weight: 500;
    }
    .footer-quote {
      font-size: 15px;
      color: var(--text-title);
      font-weight: 400;
      margin-bottom: 12px;
      font-style: italic;
    }
    .footer-tips {
      font-size: 13px;
      color: var(--text-body);
      line-height: 1.8;
      margin-bottom: 12px;
    }
    .footer-source {
      font-size: 11px;
      color: var(--text-year);
    }

    /* ============================================================
       [11] 响应式适配
       三端断点：手机(<640px) / 平板(640-1024px) / 桌面(>1024px)
    ============================================================ */
    @media (max-width: 1024px) {
      :root {
        --dot-size: 6px;
        --dot-gap: 2px;
      }
      .matrix-row { gap: 8px; }
    }
    @media (max-width: 640px) {
      body { padding: 16px 12px; }
      .title { font-size: 24px; }
      .subtitle { font-size: 14px; }
      .stats-panel {
        flex-direction: column;
        gap: 12px;
      }
      .legend { gap: 12px; }
      :root {
        --dot-size: 4px;
        --dot-gap: 2px;
      }
      .matrix-section { overflow-x: auto; padding-bottom: 8px; }
      .matrix-row { gap: 6px; }
      .year-label-left { width: 28px; font-size: 10px; }
      .year-label-right { width: 36px; font-size: 10px; }
    }

    /* 平滑滚动 */
    html { scroll-behavior: smooth; }

    /* 无障碍：焦点可见 */
    :focus-visible {
      outline: 2px solid var(--dot-current);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- ==================== [1] 顶部标题区 ==================== -->
  <header class="header">
    <h1 class="title">死亡周历</h1>
    <p class="subtitle">一生约四千周，你走到了哪一行</p>
  </header>

  <!-- ==================== [2] 输入面板 ==================== -->
  <section class="input-panel" id="inputPanel">
    <div class="form-group">
      <label for="birthDate">你的生日</label>
      <input type="date" id="birthDate" max="" aria-label="选择你的生日">
      <span class="error-msg" id="birthError"></span>
    </div>
    <div class="form-group">
      <label>你的性别</label>
      <div class="gender-options" role="radiogroup" aria-label="选择你的性别">
        <label class="radio-label">
          <input type="radio" name="gender" value="male"> <span>男</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="gender" value="female"> <span>女</span>
        </label>
      </div>
      <span class="error-msg" id="genderError"></span>
    </div>
    <button class="btn-primary" id="generateBtn">生成我的周历</button>
    <button class="btn-reset" id="resetBtn">重置</button>
  </section>

  <!-- ==================== [3] 数据概览区 ==================== -->
  <section class="stats-panel" id="statsPanel" style="display: none;">
    <div class="stat-card">
      <div class="stat-number" id="totalWeeks">0</div>
      <div class="stat-label">预期生命周数</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="elapsedWeeks">0</div>
      <div class="stat-label">已过完周数</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="remainingWeeks">0</div>
      <div class="stat-label">剩余周数</div>
    </div>
  </section>
  <!-- 数据说明：解释预期生命周数的来源 -->
  <p class="stats-note" id="statsNote" style="display: none;"></p>

  <!-- ==================== [4] 周历矩阵区（核心） ==================== -->
  <section class="matrix-section" id="matrixSection" style="display: none;">
    <div class="matrix-container" id="matrixContainer"></div>
  </section>

  <!-- ==================== [5] 图例区 ==================== -->
  <section class="legend" id="legendPanel" style="display: none;">
    <div class="legend-item">
      <div class="legend-dot filled"></div>
      <span>已度过的时光</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot before-birth"></div>
      <span>出生前的日子</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot current"></div>
      <span>此刻</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot empty"></div>
      <span>尚未到来</span>
    </div>
  </section>

  <!-- Hover 提示框（固定定位，跟随鼠标） -->
  <div class="tooltip" id="tooltip"></div>

  <!-- ==================== [6] 操作栏 ==================== -->
  <section class="action-panel" id="actionPanel" style="display: none;">
    <button class="btn-secondary" id="saveImageBtn" aria-label="保存周历为图片">保存为图片</button>
  </section>

  <!-- ==================== [7] 底部信息区 ==================== -->
  <footer class="footer" id="footerPanel">
    <p class="footer-quote" id="footerQuote" style="display: none;"></p>
    <p class="footer-tips">
      多陪家人吃顿饭，和好友喝杯茶<br>
      去学一直想学的东西，去见一直想见的人<br>
      用心过好每一周，就是最好的生命规划
    </p>
    <p class="footer-source">预期寿命数据来源：国家卫生健康委员会（数据截至2024年）</p>
  </footer>

  <script>
    /* =============================================================
       [A] 常量定义
       中国人均预期寿命（可配置，方便后续随官方数据更新）
    ============================================================= */
    const LIFE_EXPECTANCY = {
      male:   76.4,   // 中国男性人均预期寿命（岁）
      female: 81.9    // 中国女性人均预期寿命（岁）
    };
    const TOTAL_ROWS       = 100;  // 矩阵总行数（100个自然年）
    const WEEKS_PER_YEAR  = 52;   // 每年约52周
    const DAYS_PER_WEEK   = 7;
    const MS_PER_DAY      = 1000 * 60 * 60 * 24;

    /* 温柔治愈短句池，每次生成随机展示一句 */
    const QUOTES = [
      "时间不是敌人，而是最温柔的见证者。",
      "每一周都是一份礼物，打开它，用心去活。",
      "你拥有的不是时间，而是此刻。",
      "未来尚有空白，等待你用故事填满。",
      "生命的长度无法选择，但宽度由你决定。",
      "别让未来的你，后悔没有好好活过现在。",
      "把每一天当作限量版来过。",
      "此刻的你，正是余生中最年轻的你。",
      "重要的不是你活了多久，而是你记住了多少。",
      "不要数着日子过，要让日子数着你。"
    ];

    /* =============================================================
       [B] 计算模块（纯函数，无DOM操作）
       包含：已过完周数、预期总周数、剩余周数、日期区间映射
    ============================================================= */

    /**
     * 计算从出生到今天已过完的周数
     */
    function getElapsedWeeks(birthDate) {
      const now = new Date();
      const diffDays = Math.floor((now - birthDate) / MS_PER_DAY);
      return Math.floor(diffDays / DAYS_PER_WEEK);
    }

    /**
     * 计算预期生命总周数
     */
    function getTotalWeeks(gender) {
      return Math.floor(LIFE_EXPECTANCY[gender] * WEEKS_PER_YEAR);
    }

    /**
     * 计算剩余周数
     */
    function getRemainingWeeks(birthDate, gender) {
      return Math.max(0, getTotalWeeks(gender) - getElapsedWeeks(birthDate));
    }

    /**
     * 获取预期寿命对应的行索引（向上取整）
     */
    function getExpectancyRowIndex(gender) {
      return Math.ceil(LIFE_EXPECTANCY[gender]);
    }

    /**
     * 计算某年某周对应的日期区间
     * @param {number} year - 自然年份
     * @param {number} week - 周索引（0-based）
     */
    function getWeekDateRange(year, week) {
      const jan1 = new Date(year, 0, 1);
      const start = new Date(jan1);
      start.setDate(jan1.getDate() + week * DAYS_PER_WEEK);
      const end = new Date(start);
      end.setDate(start.getDate() + DAYS_PER_WEEK - 1);
      return { start: start, end: end };
    }

    /**
     * 格式化日期为 YYYY.MM.DD
     */
    function fmtDate(d) {
      return d.getFullYear() + '.' +
        String(d.getMonth() + 1).padStart(2, '0') + '.' +
        String(d.getDate()).padStart(2, '0');
    }

    /**
     * 获取今天是哪一年的第几周
     */
    function getTodayWeekInfo() {
      const today = new Date();
      const year = today.getFullYear();
      const jan1 = new Date(year, 0, 1);
      const days = Math.floor((today - jan1) / MS_PER_DAY);
      return { year: year, week: Math.floor(days / DAYS_PER_WEEK) };
    }

    /* =============================================================
       [C] 渲染模块
       生成100行自然年矩阵，每行52周圆点
       四种状态：before-birth(灰色) / filled(黑色) / current(琥珀) / empty(空心)
    ============================================================= */

    /** 全局存储生日和性别，供Hover和截图使用 */
    let _birthDate = null;
    let _gender = null;
    let _birthYear = 0;

    /**
     * 判断圆点状态
     * @param {number} row - 行索引（0-based，对应 birthYear + row）
     * @param {number} week - 周索引（0-based）
     */
    function getDotState(row, week) {
      const year = _birthYear + row;
      const range = getWeekDateRange(year, week);
      const today = new Date();
      const tw = getTodayWeekInfo();

      // 当前周（今天所在的那一周）
      if (year === tw.year && week === tw.week) {
        return 'current';
      }

      // 该周结束日期在生日之前 → 出生前（灰色）
      if (range.end < _birthDate) {
        return 'before-birth';
      }

      // 该周结束日期在今天及之前 → 已度过（黑色）
      if (range.end <= today) {
        return 'filled';
      }

      // 其余 → 尚未到来（空心）
      return 'empty';
    }

    /**
     * 渲染完整矩阵（自然年版本）
     */
    function renderMatrix(expectancyRow) {
      const container = document.getElementById('matrixContainer');
      container.innerHTML = '';

      // 使用 DocumentFragment 减少DOM重排
      const frag = document.createDocumentFragment();
      const isMobile = window.innerWidth <= 640;

      for (let row = 0; row < TOTAL_ROWS; row++) {
        const year = _birthYear + row;
        const age = row;

        // --- 创建行容器 ---
        const rowEl = document.createElement('div');
        rowEl.className = 'matrix-row';
        if (row === expectancyRow) rowEl.classList.add('expectancy-row');

        // --- 左侧年龄标签 ---
        const leftLabel = document.createElement('div');
        leftLabel.className = 'year-label-left';
        leftLabel.textContent = age;
        // 显示规则：每5年显示，预期寿命行强制显示
        const showLeft = (age % 5 === 0) || (row === expectancyRow);
        leftLabel.style.visibility = showLeft ? 'visible' : 'hidden';
        if (row === expectancyRow) leftLabel.classList.add('expectancy-label');

        // --- 52个圆点网格 ---
        const grid = document.createElement('div');
        grid.className = 'dots-grid';

        for (let week = 0; week < WEEKS_PER_YEAR; week++) {
          const dot = document.createElement('div');
          const state = getDotState(row, week);
          dot.className = 'dot ' + state;
          if (row === expectancyRow) dot.classList.add('expectancy-dot');

          // 存储数据属性，Hover时读取
          dot.dataset.row = row;
          dot.dataset.week = week;
          dot.dataset.year = year;

          grid.appendChild(dot);
        }

        // --- 右侧自然年份标签 ---
        const rightLabel = document.createElement('div');
        rightLabel.className = 'year-label-right';
        rightLabel.textContent = year;
        // 显示规则：每5年显示，预期寿命行强制显示
        const showRight = (age % 5 === 0) || (row === expectancyRow);
        rightLabel.style.visibility = showRight ? 'visible' : 'hidden';
        if (row === expectancyRow) rightLabel.classList.add('expectancy-label');

        rowEl.appendChild(leftLabel);
        rowEl.appendChild(grid);
        rowEl.appendChild(rightLabel);
        frag.appendChild(rowEl);
      }

      container.appendChild(frag);
      _bindHover();
    }

    /* =============================================================
       [D] Hover 提示模块
       鼠标悬停圆点时，显示自然年份/年龄/周数/对应日期区间
    ============================================================= */
    function _bindHover() {
      const tip  = document.getElementById('tooltip');
      const area = document.getElementById('matrixSection');

      // 事件委托，避免给5200个圆点逐一绑定
      area.addEventListener('mouseover', function(e) {
        const dot = e.target.closest('.dot');
        if (!dot) return;

        const row  = +dot.dataset.row;
        const week = +dot.dataset.week;
        const year = +dot.dataset.year;
        const age  = row;
        const range = getWeekDateRange(year, week);

        tip.innerHTML =
          '第 ' + age + ' 岁，' + year + '年第 ' + (week + 1) + ' 周' +
          '<span class="tip-date">' + fmtDate(range.start) + ' - ' + fmtDate(range.end) + '</span>';
        tip.classList.add('show');
        _positionTip(e);
      });

      area.addEventListener('mousemove', function(e) {
        if (tip.classList.contains('show')) _positionTip(e);
      });

      area.addEventListener('mouseout', function(e) {
        if (e.target.closest('.dot')) tip.classList.remove('show');
      });
    }

    /** Tooltip定位：鼠标右上方，自动避让视口边缘 */
    function _positionTip(e) {
      const tip = document.getElementById('tooltip');
      const pad = 12;
      let x = e.clientX + pad;
      let y = e.clientY - tip.offsetHeight - pad;
      if (x + tip.offsetWidth > window.innerWidth) {
        x = e.clientX - tip.offsetWidth - pad;
      }
      if (y < 0) y = e.clientY + pad;
      tip.style.left = x + 'px';
      tip.style.top  = y + 'px';
    }

    /* =============================================================
       [E] 动画模块
       数字计数动画（ease-out缓动）+ 矩阵逐行淡入
    ============================================================= */
    function animateNumber(el, target, duration) {
      duration = duration || 1000;
      const t0 = performance.now();
      (function tick(now) {
        const p = Math.min((now - t0) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.floor(target * ease);
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = target;
      })(t0);
    }

    function animateStats(total, elapsed, remaining) {
      animateNumber(document.getElementById('totalWeeks'),     total,     1000);
      animateNumber(document.getElementById('elapsedWeeks'),   elapsed,   1200);
      animateNumber(document.getElementById('remainingWeeks'), remaining, 1000);
    }

    function animateMatrixRows() {
      var rows = document.querySelectorAll('.matrix-row');
      for (var i = 0; i < rows.length; i++) {
        rows[i].style.animationDelay = (i * 20) + 'ms';
        rows[i].classList.add('animate');
      }
    }

    /* =============================================================
       [F] 截图保存模块
       使用原生 Canvas API 绘制高清矩阵截图
       修复：标题不重叠、整体居中、预期标签完整显示
    ============================================================= */
    function saveCalendarImage() {
      var dpr = Math.max(window.devicePixelRatio || 1, 2);

      // ---- 尺寸参数 ----
      var dotSize  = 5;            // 截图中圆点直径
      var dotGap   = 2;            // 截图中圆点间距
      var cellSize = dotSize + dotGap;
      var labelLW  = 48 * dpr;     // 左侧年龄标签宽度
      var labelRW  = 58 * dpr;     // 右侧年份标签宽度（4位数需更宽）
      var gridW    = cellSize * 52 * dpr;
      var rowH     = cellSize * dpr;
      var totalH   = TOTAL_ROWS * rowH;

      // 标题区高度
      var titleH   = 70 * dpr;
      // 数据概览区高度
      var statsH   = 70 * dpr;
      // 图例区高度
      var legendH  = 40 * dpr;
      // 底部来源高度
      var footerH  = 30 * dpr;

      // 左右边距
      var padH     = 50 * dpr;     // 水平边距
      var padVTop  = 35 * dpr;     // 顶部边距
      var padVBot  = 25 * dpr;     // 底部边距

      // 内容总宽度
      var contentW = labelLW + gridW + labelRW;
      // Canvas 总宽度（内容 + 左右边距）
      var canvasW  = contentW + padH * 2;
      // Canvas 总高度（增加一行预期寿命备注）
      var canvasH  = padVTop + titleH + statsH + totalH + legendH + footerH + padVBot + 20 * dpr;

      // ---- 创建离屏Canvas ----
      var cvs = document.createElement('canvas');
      cvs.width  = canvasW;
      cvs.height = canvasH;
      var ctx = cvs.getContext('2d');

      // 背景色
      ctx.fillStyle = '#FAF7F4';
      ctx.fillRect(0, 0, canvasW, canvasH);

      var cx = canvasW / 2;  // 中心X坐标

      // ---- 标题 ----
      var y = padVTop;
      ctx.fillStyle = '#4A403A';
      ctx.font = 'bold ' + (22 * dpr) + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('死亡周历', cx, y + 22 * dpr);

      // 副标题
      ctx.fillStyle = '#8C8279';
      ctx.font = (12 * dpr) + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('一生约四千周，你走到了哪一行', cx, y + 44 * dpr);

      // ---- 数据概览（三卡片）----
      y += titleH;
      var totalW     = getTotalWeeks(_gender);
      var elapsedW   = getElapsedWeeks(_birthDate);
      var remainingW = getRemainingWeeks(_birthDate, _gender);

      var cardW = 90 * dpr;
      var cardGap = 20 * dpr;
      var cardsTotalW = cardW * 3 + cardGap * 2;
      var cardX0 = cx - cardsTotalW / 2;

      var stats = [
        { num: totalW,     label: '预期生命周数' },
        { num: elapsedW,   label: '已过完周数' },
        { num: remainingW, label: '剩余周数' }
      ];
      for (var i = 0; i < 3; i++) {
        var cx_i = cardX0 + cardW / 2 + i * (cardW + cardGap);
        // 卡片背景
        ctx.fillStyle = '#F5F0EB';
        roundRect(ctx, cardX0 + i * (cardW + cardGap), y, cardW, 55 * dpr, 8 * dpr);
        ctx.fill();
        // 数字
        ctx.fillStyle = '#4A403A';
        ctx.font = 'bold ' + (18 * dpr) + 'px "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(stats[i].num), cx_i, y + 26 * dpr);
        // 标签
        ctx.fillStyle = '#8C8279';
        ctx.font = (9 * dpr) + 'px "PingFang SC", sans-serif';
        ctx.fillText(stats[i].label, cx_i, y + 44 * dpr);
      }

      // ---- 矩阵区 ----
      y += statsH;
      var expectRow = getExpectancyRowIndex(_gender);

      // 网格起始X坐标（整体居中）
      var gridX0 = padH + labelLW;

      for (var r = 0; r < TOTAL_ROWS; r++) {
        var year = _birthYear + r;
        var age  = r;
        var rowY = y + r * rowH;

        // 预期寿命行背景高亮
        if (r === expectRow) {
          ctx.fillStyle = '#F0EAE3';
          roundRect(ctx, padH, rowY - 1, contentW, rowH + 2, 3 * dpr);
          ctx.fill();
        }

        // 左侧年龄标签（每5年 + 预期行）
        if (age % 5 === 0 || r === expectRow) {
          ctx.fillStyle = '#9E958C';
          ctx.font = (9 * dpr) + 'px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(String(age), padH + labelLW - 6 * dpr, rowY + rowH * 0.75);
        }

        // 右侧自然年份标签（每5年 + 预期行）
        if (age % 5 === 0 || r === expectRow) {
          ctx.fillStyle = '#9E958C';
          ctx.font = (9 * dpr) + 'px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(String(year), padH + labelLW + gridW + 6 * dpr, rowY + rowH * 0.75);
        }

        // 绘制52个圆点
        for (var w = 0; w < 52; w++) {
          var state = getDotState(r, w);
          var dotCx = gridX0 + w * cellSize * dpr + (cellSize * dpr) / 2;
          var dotCy = rowY + rowH / 2;
          var radius = Math.max(1.5, (dotSize * dpr) / 2);

          ctx.beginPath();
          ctx.arc(dotCx, dotCy, radius, 0, Math.PI * 2);

          if (state === 'filled') {
            ctx.fillStyle = '#3D3D3D';
            ctx.fill();
          } else if (state === 'before-birth') {
            ctx.fillStyle = '#C4BDB5';
            ctx.fill();
          } else if (state === 'current') {
            ctx.strokeStyle = '#D4A574';
            ctx.lineWidth = 2 * dpr;
            ctx.stroke();
          } else {
            ctx.strokeStyle = (r === expectRow) ? '#C4B8AA' : '#D9CFC4';
            ctx.lineWidth = 1 * dpr;
            if (r === expectRow) ctx.setLineDash([2 * dpr, 2 * dpr]);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }
      }

      // ---- 图例 ----
      y += totalH + 10 * dpr;
      var legendItems = [
        { color: '#3D3D3D',      label: '已度过的时光', fill: true },
        { color: '#C4BDB5',      label: '出生前的日子', fill: true },
        { color: '#D4A574',      label: '此刻',         fill: false },
        { color: (expectRow >= 0 ? '#C4B8AA' : '#D9CFC4'), label: '尚未到来', fill: false }
      ];
      var legW = 80 * dpr;
      var legGap = 16 * dpr;
      var legTotalW = legW * 4 + legGap * 3;
      var legX0 = cx - legTotalW / 2;
      for (var j = 0; j < 4; j++) {
        var lx = legX0 + j * (legW + legGap);
        // 圆点
        ctx.beginPath();
        ctx.arc(lx + 5 * dpr, y + 8 * dpr, 4 * dpr, 0, Math.PI * 2);
        if (legendItems[j].fill) {
          ctx.fillStyle = legendItems[j].color;
          ctx.fill();
        } else {
          ctx.strokeStyle = legendItems[j].color;
          ctx.lineWidth = 1.5 * dpr;
          ctx.stroke();
        }
        // 文字
        ctx.fillStyle = '#8C8279';
        ctx.font = (9 * dpr) + 'px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(legendItems[j].label, lx + 14 * dpr, y + 11 * dpr);
      }

      // ---- 预期寿命行备注 ----
      y += legendH;
      var expectYear = _birthYear + expectRow;
      var genderText2 = (_gender === 'male') ? '男性' : '女性';
      ctx.fillStyle = '#9E958C';
      ctx.font = (9 * dpr) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('背景高亮行 = 第 ' + expectRow + ' 岁（' + expectYear + ' 年），中国' + genderText2 + '预期寿命约 ' + LIFE_EXPECTANCY[_gender] + ' 岁', cx, y);

      // ---- 底部来源 ----
      y += footerH;
      ctx.fillStyle = '#B5ADA5';
      ctx.font = (8 * dpr) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('数据来源：国家卫生健康委员会（数据截至2024年）', cx, y);

      // ---- 触发下载 ----
      var link = document.createElement('a');
      var dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      link.download = '死亡周历_' + dateStr + '.png';
      link.href = cvs.toDataURL('image/png');
      link.click();
    }

    /** 绘制圆角矩形辅助函数 */
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    /* =============================================================
       [G] 主流程入口
       事件绑定：生成按钮、重置按钮、保存按钮、回车触发、输入验证
       流程编排：验证 → 计算 → 展示 → 渲染 → 动画 → 滚动
    ============================================================= */
    document.addEventListener('DOMContentLoaded', function() {
      // 设置日期选择器最大值为今天
      var today = new Date().toISOString().split('T')[0];
      document.getElementById('birthDate').setAttribute('max', today);

      // 绑定事件
      document.getElementById('generateBtn').addEventListener('click', handleGenerate);
      document.getElementById('resetBtn').addEventListener('click', handleReset);
      document.getElementById('saveImageBtn').addEventListener('click', saveCalendarImage);

      // 回车键触发生成
      var inputs = document.querySelectorAll('#inputPanel input');
      for (var i = 0; i < inputs.length; i++) {
        inputs[i].addEventListener('keypress', function(e) {
          if (e.key === 'Enter') handleGenerate();
        });
      }
    });

    /**
     * 处理"生成我的周历"按钮点击
     */
    function handleGenerate() {
      // 清除旧的错误提示
      document.getElementById('birthError').textContent  = '';
      document.getElementById('genderError').textContent = '';

      var birthVal = document.getElementById('birthDate').value;
      var genderEl = document.querySelector('input[name="gender"]:checked');
      var gender   = genderEl ? genderEl.value : null;
      var hasErr   = false;

      // --- 输入验证 ---
      if (!birthVal) {
        document.getElementById('birthError').textContent = '请选择你的生日';
        hasErr = true;
      } else {
        var bd = new Date(birthVal);
        if (bd > new Date()) {
          document.getElementById('birthError').textContent = '生日不能晚于今天';
          hasErr = true;
        }
      }
      if (!gender) {
        document.getElementById('genderError').textContent = '请选择你的性别';
        hasErr = true;
      }
      if (hasErr) return;

      // --- 存储全局状态 ---
      _birthDate = new Date(birthVal);
      _gender = gender;
      _birthYear = _birthDate.getFullYear();

      // --- 核心计算 ---
      var total        = getTotalWeeks(gender);
      var elapsed      = getElapsedWeeks(_birthDate);
      var remaining    = getRemainingWeeks(_birthDate, gender);
      var expectRow    = getExpectancyRowIndex(gender);

      // --- 展示数据概览 ---
      var stats = document.getElementById('statsPanel');
      stats.style.display = 'flex';
      animateStats(total, elapsed, remaining);

      // --- 数据说明：解释预期生命周数来源 ---
      var genderText = (gender === 'male') ? '男性' : '女性';
      var lifeYears = LIFE_EXPECTANCY[gender];
      var noteEl = document.getElementById('statsNote');
      noteEl.innerHTML = '根据国家卫健委数据，中国' + genderText + '人均预期寿命约 ' + lifeYears + ' 岁（约 ' + getTotalWeeks(gender) + ' 周）。以上数字仅供善意提醒，愿你能健康活得更久。';
      noteEl.style.display = 'block';

      // --- 展示矩阵区 & 渲染矩阵 ---
      var matrix = document.getElementById('matrixSection');
      matrix.style.display = 'block';
      renderMatrix(expectRow);

      // 延迟两帧确保DOM就绪后触发逐行淡入动画
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          animateMatrixRows();
        });
      });

      // --- 展示图例 ---
      document.getElementById('legendPanel').style.display = 'flex';

      // --- 展示操作栏 ---
      document.getElementById('actionPanel').style.display = 'block';

      // --- 展示温柔治愈文案 ---
      var quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      var quoteEl = document.getElementById('footerQuote');
      quoteEl.textContent = '「' + quote + '」';
      quoteEl.style.display = 'block';

      // --- 预期寿命行备注 ---
      showExpectancyNote(expectRow);

      // --- 平滑滚动到矩阵区域 ---
      setTimeout(function() {
        matrix.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    /**
     * 在矩阵上方展示预期寿命行的备注说明
     * 移除之前在矩阵左右标签里写的"预期"文字，改为此处集中说明
     */
    function showExpectancyNote(expectRow) {
      // 移除旧的备注（如果存在）
      var oldNote = document.getElementById('expectancyNote');
      if (oldNote) oldNote.remove();

      var expectYear = _birthYear + expectRow;
      var note = document.createElement('p');
      note.id = 'expectancyNote';
      note.className = 'expectancy-note';
      note.innerHTML = '背景高亮行 = 第 ' + expectRow + ' 岁（' + expectYear + ' 年），为统计意义上的预期寿命参考线';
      note.style.display = 'block';

      // 插入到矩阵区之前
      var matrixSection = document.getElementById('matrixSection');
      matrixSection.parentNode.insertBefore(note, matrixSection);
    }

    /**
     * 处理"重置"按钮点击
     * 清空所有输入和结果，回到初始状态
     */
    function handleReset() {
      // 清空输入
      document.getElementById('birthDate').value = '';
      var genderInputs = document.querySelectorAll('input[name="gender"]');
      for (var i = 0; i < genderInputs.length; i++) {
        genderInputs[i].checked = false;
      }

      // 清除错误提示
      document.getElementById('birthError').textContent = '';
      document.getElementById('genderError').textContent = '';

      // 隐藏结果区域
      document.getElementById('statsPanel').style.display = 'none';
      document.getElementById('statsNote').style.display = 'none';
      document.getElementById('matrixSection').style.display = 'none';
      document.getElementById('legendPanel').style.display = 'none';
      document.getElementById('actionPanel').style.display = 'none';
      document.getElementById('footerQuote').style.display = 'none';

      // 清空矩阵
      document.getElementById('matrixContainer').innerHTML = '';

      // 移除预期寿命备注
      var expectNote = document.getElementById('expectancyNote');
      if (expectNote) expectNote.remove();

      // 重置全局状态
      _birthDate = null;
      _gender = null;
      _birthYear = 0;

      // 滚动回顶部
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
