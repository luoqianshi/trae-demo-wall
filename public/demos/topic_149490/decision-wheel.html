<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>选择恐惧症理疗中心 · 命运抽卡版</title>
<style>
:root {
  --bg-0: #0a0118;
  --bg-1: #1a0b2e;
  --bg-2: #2d1b4e;
  --card: rgba(20, 12, 38, 0.72);
  --text: #f3f0ff;
  --muted: #a89cc8;
  --dim: #6b5f8a;
  --gold: #fbbf24;
  --purple: #a855f7;
  --pink: #ec4899;
  --blue: #3b82f6;
  --green: #34c759;
  --border: rgba(168, 85, 247, 0.18);
  --radius: 18px;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg-1) 35%, var(--bg-0) 100%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 30px);
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}
#bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#fxCanvas { position: fixed; inset: 0; z-index: 250; pointer-events: none; }

.app {
  width: 100%; max-width: 440px;
  display: flex; flex-direction: column; gap: 14px;
  position: relative; z-index: 2;
}

/* 品牌栏 */
.brand { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px; }
.brand-left { display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 24px rgba(168,85,247,0.4);
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%,100% { box-shadow: 0 0 24px rgba(168,85,247,0.4); }
  50% { box-shadow: 0 0 36px rgba(236,72,153,0.6); }
}
.brand-title { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
.brand-sub { font-size: 10px; color: var(--muted); margin-top: 1px; letter-spacing: 1px; }
.brand-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: var(--text); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.icon-btn:hover { background: rgba(168,85,247,0.15); border-color: var(--purple); }
.icon-btn:active { transform: scale(.92); }

/* 面板 */
.panel {
  padding: 14px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--border);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
}
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.panel-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.panel-title .icon { font-size: 15px; }
.panel-count { font-size: 11px; color: var(--muted); }

/* 痛点说明条 */
.pain-banner {
  padding: 11px 14px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(236,72,153,0.12));
  border: 1px solid rgba(251,191,36,0.25);
  font-size: 12px; line-height: 1.55;
  color: #fde68a;
  display: flex; gap: 10px; align-items: flex-start;
}
.pain-banner .pb-icon { font-size: 18px; flex-shrink: 0; }
.pain-banner strong { color: #fff; }

/* 选项输入 */
.add-row { display: flex; gap: 6px; }
.add-row input {
  flex: 1; padding: 10px 13px; border-radius: 11px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.25);
  color: var(--text); font-size: 13px; outline: none;
  transition: all .15s;
}
.add-row input:focus { border-color: var(--purple); background: rgba(168,85,247,0.08); }
.add-row input::placeholder { color: var(--dim); }
.add-row button {
  padding: 0 16px; border-radius: 11px; border: none;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff; font-weight: 600; font-size: 12px; cursor: pointer;
  transition: all .15s;
  box-shadow: 0 4px 12px rgba(168,85,247,0.3);
}
.add-row button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(236,72,153,0.4); }
.add-row button:active { transform: scale(.95); }

/* 预设场景 */
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.preset-tag {
  padding: 6px 12px; border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--muted); font-size: 11px; font-weight: 500; cursor: pointer;
  transition: all .15s;
}
.preset-tag:hover { border-color: var(--purple); color: var(--text); background: rgba(168,85,247,0.12); transform: translateY(-1px); }
.preset-tag:active { transform: scale(.95); }

/* 选项列表 */
.opt-list { display: flex; flex-direction: column; gap: 5px; max-height: 200px; overflow-y: auto; margin-top: 10px; }
.opt-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 11px; border-radius: 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(168,85,247,0.1);
  transition: all .15s;
  animation: optIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes optIn { 0% { transform: translateX(-12px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
.opt-item:hover { background: rgba(168,85,247,0.1); border-color: rgba(168,85,247,0.3); }
.opt-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
.opt-item .name { flex: 1; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt-item .act {
  width: 22px; height: 22px; border-radius: 50%; border: none;
  font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  background: transparent; color: var(--dim); transition: all .1s; flex-shrink: 0;
}
.opt-item .act:hover { background: rgba(255,59,48,0.15); color: #ff6b6b; }
.opt-empty { text-align: center; color: var(--dim); font-size: 12px; padding: 14px 0; font-style: italic; }

/* 抽卡主按钮 */
.draw-zone {
  text-align: center;
  padding: 8px 0;
}
.btn-draw {
  width: 100%;
  padding: 18px;
  border: none; border-radius: 20px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff;
  font-size: 16px; font-weight: 800; letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(168,85,247,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  transition: all .2s;
  position: relative; overflow: hidden;
}
.btn-draw::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
  transform: translateX(-100%); transition: transform .6s;
}
.btn-draw:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(236,72,153,0.5); }
.btn-draw:hover::before { transform: translateX(100%); }
.btn-draw:active { transform: scale(.98); }
.btn-draw:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.draw-hint { font-size: 11px; color: var(--muted); margin-top: 8px; letter-spacing: 0.5px; }

/* 历史记录 */
.h-list { display: flex; flex-direction: column; gap: 5px; max-height: 180px; overflow-y: auto; }
.h-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 9px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(168,85,247,0.1);
  font-size: 12px;
}
.h-rarity {
  font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 4px;
  color: #fff; flex-shrink: 0; min-width: 28px; text-align: center;
}
.h-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-mod { font-size: 10px; color: #ffd6e7; }
.h-time { color: var(--dim); font-size: 10px; flex-shrink: 0; }

/* 抽卡覆盖层 */
.draw-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: radial-gradient(ellipse at center, rgba(45,27,78,0.85) 0%, rgba(10,1,24,0.95) 100%);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.draw-overlay.show { opacity: 1; pointer-events: auto; }

.draw-stage { position: relative; width: 240px; height: 336px; perspective: 1200px; }

.draw-rays {
  position: absolute; top: 50%; left: 50%;
  width: 600px; height: 600px;
  transform: translate(-50%, -50%);
  opacity: 0; pointer-events: none; z-index: 1;
}
.draw-rays.active { opacity: 1; animation: raysSpin 8s linear infinite; }
.draw-rays::before {
  content: ''; position: absolute; inset: 0;
  background: conic-gradient(from 0deg,
    transparent 0deg, var(--ray-color, rgba(251,191,36,0.5)) 10deg, transparent 20deg,
    transparent 40deg, var(--ray-color, rgba(251,191,36,0.5)) 50deg, transparent 60deg,
    transparent 80deg, var(--ray-color, rgba(251,191,36,0.5)) 90deg, transparent 100deg,
    transparent 130deg, var(--ray-color, rgba(251,191,36,0.5)) 140deg, transparent 150deg,
    transparent 180deg, var(--ray-color, rgba(251,191,36,0.5)) 190deg, transparent 200deg,
    transparent 230deg, var(--ray-color, rgba(251,191,36,0.5)) 240deg, transparent 250deg,
    transparent 280deg, var(--ray-color, rgba(251,191,36,0.5)) 290deg, transparent 300deg,
    transparent 330deg, var(--ray-color, rgba(251,191,36,0.5)) 340deg, transparent 350deg);
  border-radius: 50%;
  mask: radial-gradient(circle, transparent 20%, #000 30%, #000 70%, transparent 80%);
  -webkit-mask: radial-gradient(circle, transparent 20%, #000 30%, #000 70%, transparent 80%);
}
@keyframes raysSpin { to { transform: translate(-50%,-50%) rotate(360deg); } }

.draw-card {
  position: absolute; inset: 0;
  transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
  transition: transform 0.7s cubic-bezier(.6,.04,.3,1);
  z-index: 2;
}
.draw-card.flipped { transform: rotateY(180deg); }
.draw-card-enter { animation: cardEnter .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes cardEnter {
  0% { transform: translateY(200px) scale(0.3) rotate(-20deg); opacity: 0; }
  100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
}

.draw-face {
  position: absolute; inset: 0; border-radius: 16px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.draw-back {
  background: linear-gradient(135deg, #2d1b4e, #4c1d95);
  border: 2px solid rgba(251,191,36,0.5);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.draw-back::before {
  content: ''; position: absolute; inset: 10px;
  border: 1px solid rgba(251,191,36,0.4); border-radius: 10px;
  background:
    radial-gradient(circle at 50% 50%, rgba(168,85,247,0.3) 0%, transparent 60%),
    repeating-linear-gradient(45deg, transparent 0 10px, rgba(251,191,36,0.05) 10px 20px);
}
.draw-back::after {
  content: '✦'; font-size: 64px;
  color: rgba(251,191,36,0.85);
  text-shadow: 0 0 24px rgba(251,191,36,0.7);
  position: relative; z-index: 1;
  animation: backStar 2s ease-in-out infinite;
}
@keyframes backStar { 0%,100% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } }

.draw-front {
  transform: rotateY(180deg);
  display: flex; flex-direction: column;
  padding: 16px;
  background: var(--card-bg, linear-gradient(160deg, #1a0b2e, #2d1b4e));
  border: 2px solid var(--rarity-color, var(--purple));
  position: relative;
}
.draw-front::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 30%, var(--rarity-glow, rgba(168,85,247,0.3)) 0%, transparent 60%);
  pointer-events: none;
}
.draw-front.ur::before {
  background: linear-gradient(135deg, rgba(236,72,153,0.4), rgba(168,85,247,0.4), rgba(59,130,246,0.4), rgba(251,191,36,0.4));
  background-size: 400% 400%; animation: urRainbow 3s ease infinite;
}
@keyframes urRainbow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
.draw-front.ur { animation: urBorder 2s linear infinite; }
@keyframes urBorder {
  0% { box-shadow: 0 0 24px rgba(236,72,153,0.6), 0 0 48px rgba(168,85,247,0.4); }
  33% { box-shadow: 0 0 24px rgba(168,85,247,0.6), 0 0 48px rgba(59,130,246,0.4); }
  66% { box-shadow: 0 0 24px rgba(59,130,246,0.6), 0 0 48px rgba(251,191,36,0.4); }
  100% { box-shadow: 0 0 24px rgba(251,191,36,0.6), 0 0 48px rgba(236,72,153,0.4); }
}

.rarity-badge {
  align-self: flex-start;
  padding: 3px 10px; border-radius: 8px;
  background: var(--rarity-color); color: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: 1px;
  box-shadow: 0 2px 8px var(--rarity-glow);
  position: relative; z-index: 1;
}
.card-emoji {
  font-size: 72px; text-align: center;
  margin: 14px 0 10px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  position: relative; z-index: 1;
  animation: emojiPop .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes emojiPop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.card-name {
  font-size: 20px; font-weight: 800; text-align: center;
  color: #fff; margin-bottom: 8px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  position: relative; z-index: 1;
  padding: 0 4px;
}
.card-tag {
  font-size: 11px; text-align: center;
  color: rgba(255,255,255,0.8);
  padding: 4px 10px; background: rgba(0,0,0,0.3);
  border-radius: 10px; align-self: center; margin-bottom: 10px;
  position: relative; z-index: 1;
}
.card-mod {
  margin-top: auto;
  padding: 10px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(236,72,153,0.25), rgba(168,85,247,0.25));
  border: 1px solid rgba(236,72,153,0.4);
  font-size: 11px; line-height: 1.5;
  color: #ffd6e7;
  position: relative; z-index: 1;
  animation: modIn .5s .3s both cubic-bezier(.34,1.56,.64,1);
}
@keyframes modIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.card-mod .cm-label { font-weight: 700; color: #fff; display: block; margin-bottom: 3px; font-size: 10px; letter-spacing: 1px; }

.draw-tap {
  position: absolute; bottom: -50px; left: 50%;
  transform: translateX(-50%);
  font-size: 13px; color: var(--muted); letter-spacing: 1px;
  animation: tapBlink 1.5s ease-in-out infinite;
  white-space: nowrap;
}
@keyframes tapBlink { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

.draw-fx { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0; }
.draw-fx.active { opacity: 1; }
.draw-fx-flash {
  position: absolute; inset: 0;
  background: radial-gradient(circle, #fff 0%, transparent 70%);
  animation: flashOnce .6s ease-out;
}
@keyframes flashOnce {
  0% { opacity: 0; transform: scale(0.5); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: scale(2); }
}

.shake { animation: shake .5s; }
@keyframes shake {
  0%,100% { transform: translate(0,0); }
  20% { transform: translate(-8px, 4px); }
  40% { transform: translate(8px, -4px); }
  60% { transform: translate(-6px, -6px); }
  80% { transform: translate(6px, 6px); }
}

/* Toast */
.toast {
  position: fixed; bottom: calc(env(safe-area-inset-bottom) + 24px); left: 50%;
  transform: translateX(-50%);
  background: rgba(20, 12, 38, 0.95);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  color: #fff; padding: 10px 18px; border-radius: 18px;
  font-size: 12px; font-weight: 500; z-index: 300;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

/* 引导 */
.intro-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: radial-gradient(ellipse at center, rgba(45,27,78,0.95) 0%, rgba(10,1,24,0.98) 100%);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; transition: opacity .4s;
}
.intro-overlay.hide { opacity: 0; pointer-events: none; }
.intro-card { width: 100%; max-width: 340px; text-align: center; animation: introIn .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes introIn { 0% { transform: translateY(40px) scale(.9); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
.intro-icon {
  font-size: 60px; margin-bottom: 14px;
  filter: drop-shadow(0 0 20px rgba(251,191,36,0.6));
  animation: introFloat 3s ease-in-out infinite;
}
@keyframes introFloat { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
.intro-title {
  font-size: 22px; font-weight: 800; margin-bottom: 6px;
  background: linear-gradient(135deg, var(--gold), var(--pink), var(--purple));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.intro-sub { font-size: 12px; color: var(--muted); margin-bottom: 22px; letter-spacing: 1px; }
.intro-features { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; text-align: left; }
.intro-feat {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: 12px;
  background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.2);
}
.intro-feat .if-icon { font-size: 22px; flex-shrink: 0; }
.intro-feat .if-text { font-size: 12px; line-height: 1.5; }
.intro-feat .if-text strong { color: var(--gold); }
.intro-btn {
  width: 100%; padding: 14px; border-radius: 16px; border: none;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 1px;
  cursor: pointer; box-shadow: 0 10px 30px rgba(168,85,247,0.4);
  transition: all .2s;
}
.intro-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(236,72,153,0.5); }
.intro-btn:active { transform: scale(.97); }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); border-radius: 2px; }

@media (max-width: 380px) {
  .card-emoji { font-size: 60px; }
  .card-name { font-size: 17px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>

<div class="app">
  <!-- 品牌栏 -->
  <div class="brand">
    <div class="brand-left">
      <div class="brand-logo">🎡</div>
      <div>
        <div class="brand-title">选择恐惧症理疗中心</div>
        <div class="brand-sub">命运抽卡版 · 把纠结外包</div>
      </div>
    </div>
    <div class="brand-actions">
      <button class="icon-btn" id="btnSound" title="音效">🔊</button>
      <button class="icon-btn" id="btnClear" title="清空选项">🗑️</button>
    </div>
  </div>

  <!-- 痛点说明 -->
  <div class="pain-banner">
    <div class="pb-icon">😣</div>
    <div>"中午吃啥？""周末干啥？""该不该去？"——每天要在这些小事上纠结 N 次。<strong>把你的选项丢进来，让命运抽卡替你定。</strong></div>
  </div>

  <!-- 选项输入 -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><span class="icon">✍️</span>把你的纠结选项丢进来</div>
      <div class="panel-count" id="optCount">0 项</div>
    </div>
    <div class="add-row">
      <input type="text" id="inputOption" placeholder="例如：火锅 / 烤肉 / 减肥不吃了..." maxlength="20">
      <button id="btnAdd">添加</button>
    </div>
    <div class="presets">
      <button class="preset-tag" data-preset="food">🍜 吃啥</button>
      <button class="preset-tag" data-preset="drink">🥤 喝啥</button>
      <button class="preset-tag" data-preset="play">🎮 玩啥</button>
      <button class="preset-tag" data-preset="go">🚗 去哪</button>
      <button class="preset-tag" data-preset="yesno">🪙 该不该</button>
      <button class="preset-tag" data-preset="work">💼 工作先做啥</button>

  <!-- 抽卡按钮 -->
  <div class="draw-zone">
    <button class="btn-draw" id="btnDraw" disabled>✨ 让命运替我决定 ✨</button>
    <div class="draw-hint" id="drawHint">先添加至少 2 个选项</div>
  </div>

  <!-- 历史 -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><span class="icon">📜</span>命运的决定</div>
      <div class="panel-count" id="histCount">0 条</div>

    <div class="h-list" id="histList"></div>

</div>

<!-- 抽卡覆盖层 -->
<div class="draw-overlay" id="drawOverlay">
  <div class="draw-stage">
    <div class="draw-rays" id="drawRays"></div>
    <div class="draw-fx" id="drawFx"></div>
    <div class="draw-card" id="drawCard">
      <div class="draw-face draw-back"></div>
      <div class="draw-face draw-front" id="drawFront"></div>
    </div>
    <div class="draw-tap" id="drawTap">点击继续</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 引导 -->
<div class="intro-overlay" id="introOverlay">
  <div class="intro-card">
    <div class="intro-icon">🎡</div>
    <div class="intro-title">选择恐惧症理疗中心</div>
    <div class="intro-sub">命运抽卡版 · 把纠结外包给命运</div>
    <div class="intro-features">
      <div class="intro-feat">
        <div class="if-icon">✍️</div>
        <div class="if-text">把你纠结的选项丢进来（吃啥/做啥/去哪都行）</div>
      </div>
      <div class="intro-feat">
        <div class="if-icon">🎴</div>
        <div class="if-text">抽卡仪式感揭示答案，<strong>N/R/SR/SSR/UR</strong> 五档稀有度光效</div>
      </div>
      <div class="intro-feat">
        <div class="if-icon">⚡</div>
        <div class="if-text">可能附带<strong>额外要求</strong>（如"必须拍照发朋友圈"），让简单的选择变成有趣挑战</div>
      </div>
    </div>
    <button class="intro-btn" id="btnStart">开始把纠结外包</button>
  </div>
</div>

<script>
(function() {
'use strict';

/* ==================== 预设选项库 ==================== */
const PRESETS = {
  food: ['火锅','烤肉','麻辣烫','寿司','汉堡','披萨','螺蛳粉','沙县小吃','兰州拉面','黄焖鸡','炸鸡','日料','川菜','粤菜','沙拉减肥'],
  drink: ['奶茶','咖啡','柠檬茶','可乐','酸奶','果汁','白开水','冰美式','苏打水','果茶','抹茶拿铁'],
  play: ['王者荣耀','原神','刷抖音','看电影','睡觉','看小说','出门散步','拼乐高','玩Switch','打麻将','逛B站'],
  go: ['公园','商场','图书馆','电影院','海边','爬山','宅家','博物馆','咖啡馆','书店'],
  yesno: ['✓ 去做！','✕ 不去！','再想想','立刻去','明天再说','听朋友的'],
  work: ['写代码','做PPT','开会议','写文档','改bug','学新技术','整理桌面','回复邮件','摸鱼'],
};

/* ==================== 额外要求（modifier）==================== */
const MODIFIERS = [
  { name: '全程只能用左手', emoji: '✋' },
  { name: '不能说话只能哼歌', emoji: '🎵' },
  { name: '必须拍照发朋友圈', emoji: '📸' },
  { name: '每口食物嚼 20 下', emoji: '🦷' },
  { name: '全程倒计时 5 分钟', emoji: '⏰' },
  { name: '必须保持微笑', emoji: '😊' },
  { name: '不能看手机', emoji: '📵' },
  { name: '边做边解说像主播', emoji: '🎙️' },
  { name: '每完成一项大喊 nice', emoji: '👏' },
  { name: '全程用文言文表达', emoji: '📜' },
  { name: '蒙眼完成', emoji: '🙈' },
  { name: '做完后转三圈', emoji: '🌀' },
];

/* ==================== 选项 emoji 映射 ==================== */
const OPTION_EMOJI_MAP = {
  '火锅':'🍲','烤肉':'🥩','麻辣烫':'🌶️','寿司':'🍣','汉堡':'🍔','披萨':'🍕',
  '螺蛳粉':'🍜','炸鸡':'🍗','日料':'🍣','川菜':'🌶️','粤菜':'🥡','沙拉':'🥗',
  '奶茶':'🧋','咖啡':'☕','柠檬茶':'🍋','可乐':'🥤','果汁':'🧃','冰美式':'🧊',
  '王者荣耀':'🎮','原神':'⚔️','看电影':'🎬','睡觉':'😴','散步':'🚶','拼乐高':'🧩',
  '公园':'🌳','商场':'🛍️','图书馆':'📚','电影院':'🎬','海边':'🌊','爬山':'⛰️','宅家':'🏠',
  '写代码':'💻','做PPT':'📊','改bug':'🐛','摸鱼':'🐟',
};
function pickEmoji(name) {
  if (OPTION_EMOJI_MAP[name]) return OPTION_EMOJI_MAP[name];
  for (const k in OPTION_EMOJI_MAP) if (name.includes(k)) return OPTION_EMOJI_MAP[k];
  const emojis = ['🎯','✨','🎲','🍀','🌟','💫','🔥','👑','🎉','🎊'];
  let h = 0; for (let i = 0; i < name.length; i++) h = ((h<<5)-h + name.charCodeAt(i))|0;
  return emojis[Math.abs(h) % emojis.length];
}

/* ==================== 稀有度配置 ==================== */
const RARITIES = {
  N:   { name: 'N',   label: '普通',   color: '#9ca3af', glow: 'rgba(156,163,175,0.5)',  bg: 'linear-gradient(160deg,#3a3a4a,#1f1f2e)',          weight: 50,   emoji: '⚪' },
  R:   { name: 'R',   label: '稀有',   color: '#3b82f6', glow: 'rgba(59,130,246,0.6)',   bg: 'linear-gradient(160deg,#1e3a8a,#0f172a)',          weight: 30,   emoji: '🔵' },
  SR:  { name: 'SR',  label: '超稀有', color: '#a855f7', glow: 'rgba(168,85,247,0.7)',   bg: 'linear-gradient(160deg,#4c1d95,#1a0b2e)',          weight: 14,   emoji: '🟣' },
  SSR: { name: 'SSR', label: '特级',   color: '#fbbf24', glow: 'rgba(251,191,36,0.8)',   bg: 'linear-gradient(160deg,#78350f,#1a0b2e)',          weight: 5,    emoji: '🟡' },
  UR:  { name: 'UR',  label: '极',     color: '#ec4899', glow: 'rgba(236,72,153,0.9)',   bg: 'linear-gradient(160deg,#831843,#1a0b2e)',          weight: 1,    emoji: '🔴' },
};
const RARITY_ORDER = ['N','R','SR','SSR','UR'];

/* ==================== 状态 ==================== */
let options = [];
let history = [];
let soundEnabled = true;
let isDrawing = false;
let currentResult = null;  // 当前抽卡结果，用于"再来一次"

/* ==================== DOM ==================== */
const $ = id => document.getElementById(id);
const inputOption = $('inputOption'), btnAdd = $('btnAdd');
const optList = $('optList'), optCount = $('optCount');
const btnDraw = $('btnDraw'), drawHint = $('drawHint');
const histList = $('histList'), histCount = $('histCount');
const drawOverlay = $('drawOverlay'), drawCard = $('drawCard'), drawFront = $('drawFront');
const drawRays = $('drawRays'), drawFx = $('drawFx'), drawTap = $('drawTap');
const toast = $('toast'), introOverlay = $('introOverlay');
const btnSound = $('btnSound'), btnClear = $('btnClear');

/* ==================== 音频 ==================== */
let audioCtx = null;
function au() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(f, d, vol, type) {
  try {
    au();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
    o.start(); o.stop(audioCtx.currentTime + d);
  } catch(e) {}
}
function sweep(f1, f2, d, vol) {
  try {
    au();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f1, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + d);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
    o.start(); o.stop(audioCtx.currentTime + d);
  } catch(e) {}
}
function playDraw() { if (!soundEnabled) return; beep(800, 0.08, 0.06, 'sine'); setTimeout(()=>beep(1200, 0.06, 0.05, 'sine'), 80); }
function playFlip() { if (!soundEnabled) return; beep(400, 0.1, 0.05, 'square'); }
function playRarity(r) {
  if (!soundEnabled) return;
  if (r === 'N') beep(440, 0.15, 0.05);
  else if (r === 'R') [523, 659].forEach((f,i)=>setTimeout(()=>beep(f,0.18,0.07),i*100));
  else if (r === 'SR') [523, 659, 784].forEach((f,i)=>setTimeout(()=>beep(f,0.2,0.08),i*100));
  else if (r === 'SSR') { [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.22,0.09),i*90)); sweep(200, 2000, 0.4, 0.04); }
  else if (r === 'UR') { [523,659,784,1047,1319,1568,2093].forEach((f,i)=>setTimeout(()=>beep(f,0.25,0.1),i*80)); sweep(100, 3000, 0.6, 0.06); }
}
function playBtn() { if (!soundEnabled) return; beep(600, 0.05, 0.04); }

/* ==================== 工具 ==================== */
function showToast(m) {
  toast.textContent = m; toast.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>toast.classList.remove('show'), 1800);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ==================== 持久化 ==================== */
const SK_O = 'dw_opts_v4', SK_H = 'dw_hist_v4', SK_I = 'dw_intro_v4';
function saveOpts() { try { localStorage.setItem(SK_O, JSON.stringify(options)); } catch(e) {} }
function loadOpts() {
  try {
    const r = localStorage.getItem(SK_O);
    if (r) { const d = JSON.parse(r); if (Array.isArray(d) && d.length) { options = d; return; } }
  } catch(e) {}
  options = PRESETS.food.slice(0, 8);
}
function saveHist() { try { localStorage.setItem(SK_H, JSON.stringify(history.slice(0, 30))); } catch(e) {} }
function loadHist() { try { const r = localStorage.getItem(SK_H); if (r) history = JSON.parse(r) || []; } catch(e) {} }

/* ==================== 选项管理 ==================== */
function addOpt(name) {
  const t = (name || '').trim();
  if (!t) return;
  if (options.length >= 20) { showToast('最多 20 个选项'); return; }
  if (options.includes(t)) { showToast('已存在该选项'); return; }
  options.push(t);
  saveOpts(); renderOpts();
  playBtn();
}
function delOpt(i) {
  options.splice(i, 1);
  saveOpts(); renderOpts();
}
function clearOpts() {
  if (options.length === 0) { showToast('已经是空的了'); return; }
  if (!confirm('清空所有选项？')) return;
  options = []; saveOpts(); renderOpts();
  showToast('已清空');
}
function loadPreset(key) {
  const arr = PRESETS[key]; if (!arr) return;
  options = arr.slice();
  saveOpts(); renderOpts();
  const labels = { food:'吃啥', drink:'喝啥', play:'玩啥', go:'去哪', yesno:'该不该', work:'工作' };
  showToast('已加载：' + labels[key]);
  playBtn();
}

/* ==================== 渲染 ==================== */
function renderOpts() {
  optCount.textContent = options.length + ' 项';
  if (options.length === 0) {
    optList.innerHTML = '<div class="opt-empty">还没有选项 · 用上方输入框或预设场景快速添加</div>';
  } else {
    const colors = ['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#ff922b','#9775fa','#20c997','#f783ac'];
    optList.innerHTML = options.map((o, i) =>
      `<div class="opt-item">
        <span class="dot" style="background:${colors[i%colors.length]};color:${colors[i%colors.length]}"></span>
        <span class="name">${esc(o)}</span>
        <button class="act" data-i="${i}">✕</button>
      </div>`
    ).join('');
    optList.querySelectorAll('.act').forEach(b => b.addEventListener('click', () => delOpt(+b.dataset.i)));
  }
  // 抽卡按钮状态
  const canDraw = options.length >= 2 && !isDrawing;
  btnDraw.disabled = !canDraw;
  drawHint.textContent = options.length < 2
    ? '先添加至少 2 个选项'
    : isDrawing ? '命运正在揭示...' : `命运将从 ${options.length} 个选项中替你决定 · 可能附带额外要求`;
}

function renderHist() {
  histCount.textContent = history.length + ' 条';
  if (history.length === 0) {
    histList.innerHTML = '<div class="opt-empty">还没有做过决定</div>';
    return;
  }
  histList.innerHTML = history.map(h => {
    const R = RARITIES[h.rarity] || RARITIES.N;
    return `<div class="h-item">
      <span class="h-rarity" style="background:${R.color}">${R.name}</span>
      <span class="h-name">${esc(h.name)}${h.modifier ? `<div class="h-mod">⚡ ${esc(h.modifier)}</div>` : ''}</span>
      <span class="h-time">${h.time}</span>
    </div>`;
  }).join('');
}

/* ==================== 抽卡逻辑 ==================== */
function rollRarity() {
  const r = Math.random() * 100;
  let acc = 0;
  for (const k of RARITY_ORDER) {
    acc += RARITIES[k].weight;
    if (r < acc) return k;
  }
  return 'N';
}

function drawFate() {
  if (isDrawing || options.length < 2) return;
  isDrawing = true;
  btnDraw.disabled = true;
  drawHint.textContent = '命运正在揭示...';
  playDraw();

  // 1. 从用户选项中随机选一个（这是真正的"决定"）
  const choice = options[Math.floor(Math.random() * options.length)];
  // 2. 赋予随机稀有度（纯仪式感，不影响选择结果）
  const rarity = rollRarity();
  // 3. 30% 概率附带额外要求
  const hasMod = Math.random() < 0.3;
  const modifier = hasMod ? MODIFIERS[Math.floor(Math.random() * MODIFIERS.length)] : null;

  currentResult = { choice, rarity, modifier };
  const R = RARITIES[rarity];

  // 重置卡片
  drawCard.classList.remove('flipped', 'draw-card-enter');
  drawFront.className = 'draw-face draw-front';
  drawFront.style.removeProperty('--rarity-color');
  drawFront.style.removeProperty('--rarity-glow');
  drawFront.style.removeProperty('--card-bg');
  drawRays.classList.remove('active');
  drawFx.classList.remove('active');
  drawFx.innerHTML = '';
  drawTap.style.opacity = '0';

  // 渲染正面
  renderDrawFront(choice, R, modifier);

  // 显示
  drawOverlay.classList.add('show');
  requestAnimationFrame(() => drawCard.classList.add('draw-card-enter'));

  // 翻牌
  setTimeout(() => {
    playFlip();
    drawCard.classList.add('flipped');
    drawFront.style.setProperty('--rarity-color', R.color);
    drawFront.style.setProperty('--rarity-glow', R.glow);
    drawFront.style.setProperty('--card-bg', R.bg);
    if (rarity === 'UR') drawFront.classList.add('ur');

    if (['SR','SSR','UR'].includes(rarity)) {
      drawRays.style.setProperty('--ray-color', R.glow);
      drawRays.classList.add('active');
    }
    if (rarity === 'SSR' || rarity === 'UR') {
      drawFx.classList.add('active');
      drawFx.innerHTML = '<div class="draw-fx-flash"></div>';
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 500);
      launchFxParticles(R.color, rarity === 'UR' ? 80 : 40);
    }
    playRarity(rarity);

    // 应用结果
    setTimeout(() => applyResult(choice, rarity, modifier, R), 700);
  }, 600);
}

function renderDrawFront(choice, R, modifier) {
  const emoji = pickEmoji(choice);
  drawFront.innerHTML = `
    <div class="rarity-badge" style="background:${R.color}">${R.name} · ${R.label}</div>
    <div class="card-emoji">${emoji}</div>
    <div class="card-name">${esc(choice)}</div>
    <div class="card-tag">命运已替你决定</div>
    ${modifier ? `
    <div class="card-mod">
      <span class="cm-label">⚡ 额外要求</span>
      ${modifier.emoji} ${esc(modifier.name)}
    </div>` : ''}
  `;
}

function applyResult(choice, rarity, modifier, R) {
  // 加入历史
  history.unshift({
    name: choice,
    rarity,
    modifier: modifier ? modifier.name : null,
    time: new Date().toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }),
  });
  if (history.length > 30) history.pop();
  saveHist(); renderHist();

  drawTap.style.opacity = '1';
  drawTap.textContent = modifier ? '点击查看完整命运' : '点击查看命运';
  isDrawing = false;
  renderOpts();

  const cont = () => {
    drawOverlay.removeEventListener('click', cont);
    drawOverlay.classList.remove('show');
  };
  drawOverlay.addEventListener('click', cont);
}

/* ==================== 背景粒子 ==================== */
const bgC = $('bgCanvas'), bgX = bgC.getContext('2d');
let bgParticles = [];
function resizeBg() {
  bgC.width = innerWidth; bgC.height = innerHeight;
  const count = Math.floor((innerWidth * innerHeight) / 18000);
  bgParticles = [];
  for (let i = 0; i < count; i++) {
    bgParticles.push({
      x: Math.random() * bgC.width, y: Math.random() * bgC.height,
      r: Math.random() * 1.8 + 0.3,
      vy: -Math.random() * 0.3 - 0.05,
      vx: (Math.random() - 0.5) * 0.15,
      op: Math.random() * 0.5 + 0.1,
      twinkle: Math.random() * Math.PI * 2,
      color: ['#a855f7','#ec4899','#fbbf24','#3b82f6'][Math.floor(Math.random() * 4)],
    });
  }
}
resizeBg(); addEventListener('resize', resizeBg);
function animateBg() {
  bgX.clearRect(0, 0, bgC.width, bgC.height);
  bgParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.twinkle += 0.03;
    if (p.y < -10) { p.y = bgC.height + 10; p.x = Math.random() * bgC.width; }
    if (p.x < -10) p.x = bgC.width + 10;
    if (p.x > bgC.width + 10) p.x = -10;
    const op = p.op * (0.6 + 0.4 * Math.sin(p.twinkle));
    bgX.save();
    bgX.globalAlpha = op;
    bgX.fillStyle = p.color;
    bgX.shadowColor = p.color; bgX.shadowBlur = 8;
    bgX.beginPath(); bgX.arc(p.x, p.y, p.r, 0, Math.PI * 2); bgX.fill();
    bgX.restore();
  });
  requestAnimationFrame(animateBg);
}
animateBg();

/* ==================== 特效粒子 ==================== */
const fxC = $('fxCanvas'), fxX = fxC.getContext('2d');
let fxParticles = [], fxRunning = false;
function resizeFx() { fxC.width = innerWidth; fxC.height = innerHeight; }
resizeFx(); addEventListener('resize', resizeFx);
function launchFxParticles(color, count) {
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 3;
    fxParticles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
      r: Math.random() * 3 + 1,
      color: Math.random() < 0.3 ? '#fff' : color,
      life: 1, decay: Math.random() * 0.015 + 0.008, gravity: 0.15,
    });
  }
  if (!fxRunning) animateFx();
}
function animateFx() {
  fxRunning = true;
  fxX.clearRect(0, 0, fxC.width, fxC.height);
  fxParticles = fxParticles.filter(p => p.life > 0);
  fxParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.life -= p.decay;
    fxX.save();
    fxX.globalAlpha = Math.max(0, p.life);
    fxX.fillStyle = p.color; fxX.shadowColor = p.color; fxX.shadowBlur = 12;
    fxX.beginPath(); fxX.arc(p.x, p.y, p.r, 0, Math.PI * 2); fxX.fill();
    fxX.restore();
  });
  if (fxParticles.length > 0) requestAnimationFrame(animateFx);
  else { fxX.clearRect(0, 0, fxC.width, fxC.height); fxRunning = false; }
}

/* ==================== 事件绑定 ==================== */
btnAdd.addEventListener('click', () => { addOpt(inputOption.value); inputOption.value = ''; inputOption.focus(); });
inputOption.addEventListener('keydown', e => { if (e.key === 'Enter') { addOpt(inputOption.value); inputOption.value = ''; } });
document.querySelectorAll('.preset-tag').forEach(b => b.addEventListener('click', () => loadPreset(b.dataset.preset)));
btnDraw.addEventListener('click', drawFate);
btnClear.addEventListener('click', clearOpts);
btnSound.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  btnSound.textContent = soundEnabled ? '🔊' : '🔇';
  showToast(soundEnabled ? '音效已开启' : '音效已关闭');
});
$('btnStart').addEventListener('click', () => {
  introOverlay.classList.add('hide');
  try { localStorage.setItem(SK_I, '1'); } catch(e) {}
  au();
});
drawOverlay.addEventListener('click', e => { if (e.target === drawOverlay) drawOverlay.classList.remove('show'); });

// 空格快捷抽卡
document.addEventListener('keydown', e => {
  if (e.key === ' ' && !isDrawing && document.activeElement !== inputOption && !drawOverlay.classList.contains('show') && options.length >= 2) {
    e.preventDefault();
    drawFate();
  }
});

/* ==================== 初始化 ==================== */
loadOpts(); loadHist();
renderOpts(); renderHist();
try { if (localStorage.getItem(SK_I)) introOverlay.classList.add('hide'); } catch(e) {}

})();
</script>
</body>
</html>
