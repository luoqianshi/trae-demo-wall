<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="96" fill="#faf6f0" stroke="#d4a84a" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#d4a84a" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- 道士小人身形 -->

  <!-- 道冠（帽子） -->
  <rect x="85" y="42" width="30" height="14" rx="2" fill="#c53d43" opacity="0.9"/>
  <rect x="88" y="36" width="24" height="8" rx="2" fill="#c53d43"/>

  <!-- 头部 -->
  <circle cx="100" cy="65" r="14" fill="#f5efe6" stroke="#3d3229" stroke-width="2"/>

  <!-- 面部 - 眼睛 -->
  <circle cx="95" cy="63" r="1.8" fill="#3d3229"/>
  <circle cx="105" cy="63" r="1.8" fill="#3d3229"/>
  <!-- 微笑 -->
  <path d="M95 69 Q100 73 105 69" stroke="#3d3229" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- 道袍（身体） -->
  <path d="M72 78 L60 155 L140 155 L128 78 Z" fill="#c53d43" opacity="0.15" stroke="#c53d43" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- 道袍中线 -->
  <line x1="100" y1="78" x2="100" y2="155" stroke="#c53d43" stroke-width="1.5" opacity="0.5"/>

  <!-- 左臂（自然下垂） -->
  <path d="M72 78 Q58 100 62 130" stroke="#3d3229" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- 左袖口 -->
  <path d="M58 126 L62 130 L70 128" stroke="#3d3229" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- 右臂（抬起，手掌朝前展示） -->
  <path d="M128 78 Q142 90 140 108" stroke="#3d3229" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- 右袖口 -->
  <path d="M138 104 L140 108 L132 110" stroke="#3d3229" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- 手掌（展示掌纹） -->
  <g transform="translate(132, 98)">
    <rect x="0" y="0" width="16" height="18" rx="3" fill="#f5efe6" stroke="#3d3229" stroke-width="1.5"/>
    <!-- 手指 -->
    <rect x="2" y="-6" width="3" height="8" rx="1.5" fill="#f5efe6" stroke="#3d3229" stroke-width="1"/>
    <rect x="7" y="-8" width="3" height="10" rx="1.5" fill="#f5efe6" stroke="#3d3229" stroke-width="1"/>
    <rect x="11" y="-6" width="3" height="8" rx="1.5" fill="#f5efe6" stroke="#3d3229" stroke-width="1"/>
    <!-- 手心掌纹 -->
    <path d="M3 6 Q8 4 13 6" stroke="#c53d43" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M4 10 Q8 8 12 10" stroke="#c53d43" stroke-width="0.7" fill="none" opacity="0.5"/>
  </g>

  <!-- 道袍下摆装饰线 -->
  <path d="M68 148 Q84 142 100 148 Q116 142 132 148" stroke="#d4a84a" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- 腰带 -->
  <rect x="84" y="118" width="32" height="5" rx="2" fill="#d4a84a" opacity="0.7"/>

  <!-- 拂尘（左手中） -->
  <line x1="62" y1="124" x2="52" y2="112" stroke="#8a7e6b" stroke-width="2" stroke-linecap="round"/>
  <path d="M48 108 Q52 105 56 112" stroke="#8a7e6b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M46 112 Q51 108 54 113" stroke="#8a7e6b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <line x1="50" y1="110" x2="48" y2="115" stroke="#8a7e6b" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="108" x2="51" y2="114" stroke="#8a7e6b" stroke-width="1" stroke-linecap="round"/>
</svg>