<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>次元簿 — 游戏生活手账</title>
  <style>
/* ============================================================
   次元簿 · 设计系统 v3 · 柔粉清爽风
   对齐效果图:干净白底 + 柔粉强调 + 清晰层级
   ============================================================ */

:root{
  --bg:#F7F5F9;
  --bg-card:#FFFFFF;
  --ink:#1A1520;
  --ink-soft:#5A5266;
  --muted:#9994A5;
  --muted-2:#C5BED6;
  --rule:#F0EDF3;
  --rule-soft:#F8F6FA;

  --pink:#FF6B9D;
  --pink-soft:#FFE8F1;
  --pink-deep:#FF4F8B;
  --purple:#8B7BF7;
  --purple-soft:#F0EDFF;
  --orange:#FFB366;
  --orange-soft:#FFF5EB;
  --blue:#7BA7F7;
  --blue-soft:#EAF0FE;
  --mint:#6DD5C0;

  --success:#34C759;
  --success-soft:#E8F9EE;
  --danger:#FF3B30;
  --warning:#FF9500;

  --radius:16px;
  --radius-sm:10px;
  --radius-lg:20px;
  --shadow:0 1px 6px rgba(120,100,140,0.06);
  --shadow-lg:0 6px 24px rgba(255,107,157,0.10);
  --font:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --font-num:'DIN Alternate','Avenir Next','PingFang SC',sans-serif;
}

/* 重置 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font);
  background:#E8E4ED;
  color:var(--ink);
  line-height:1.5;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;}

/* 手机外壳 */
#app-root{display:flex;align-items:center;justify-content:center;width:100%;min-height:100vh;padding:20px 0;}
.phone-frame{width:390px;flex-shrink:0;}
.phone-bezel{
  background:#1A1520;border-radius:48px;padding:10px;
  box-shadow:0 20px 60px rgba(0,0,0,0.2),0 0 0 2px #2A2530;position:relative;
}
.phone-screen{
  background:var(--bg);border-radius:38px;overflow:hidden;
  position:relative;height:800px;display:flex;flex-direction:column;
}

/* 状态栏 */
.status-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px 4px;font-size:14px;font-weight:700;color:var(--ink);
  position:relative;z-index:20;flex-shrink:0;
}
.status-notch{
  width:110px;height:26px;background:#1A1520;border-radius:0 0 16px 16px;
  position:absolute;left:50%;top:0;transform:translateX(-50%);
}
.status-icons{display:flex;align-items:center;gap:5px;color:var(--ink);}

/* 装饰星光 */
.sparkle{position:absolute;pointer-events:none;z-index:1;color:var(--pink);opacity:0.2;font-size:14px;}
.sparkle.s1{top:80px;right:50px;font-size:18px;opacity:0.3;color:var(--pink);}
.sparkle.s2{top:130px;right:90px;font-size:10px;opacity:0.2;color:var(--purple);}
.sparkle.s3{top:200px;left:30px;font-size:6px;opacity:0.15;color:var(--orange);}

/* App 头部 */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 20px 4px;position:relative;z-index:20;flex-shrink:0;
}
.header-text{flex:1;min-width:0;}
.app-title{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-0.02em;line-height:1.2;}
.title-sparkle{font-size:18px;}
.app-subtitle{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px;}
.header-actions{display:flex;gap:8px;flex-shrink:0;}
.ha-btn{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);transition:all .2s;position:relative;
  background:var(--bg-card);box-shadow:var(--shadow);
}
.ha-btn:active{transform:scale(0.9);}
.ha-mascot{
  width:32px;height:32px;border-radius:50%;object-fit:cover;
}
.mascot-btn{padding:2px;overflow:hidden;}
.bell-btn .bell-dot{
  position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;
  background:var(--pink);border:2px solid var(--bg-card);
}

/* 提醒条 */
.reminder-banner{
  display:flex;align-items:center;gap:10px;
  margin:8px 16px 10px;padding:10px 14px;
  background:var(--bg-card);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);position:relative;z-index:20;flex-shrink:0;
}
.reminder-avatar{
  width:32px;height:32px;border-radius:50%;object-fit:cover;
  border:2px solid var(--pink-soft);flex-shrink:0;
}
.reminder-text{
  flex:1;font-size:13px;color:var(--ink-soft);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.reminder-arrow{color:var(--muted-2);flex-shrink:0;}

/* 底部 Tab */
.tab-bar{
  display:flex;padding:6px 4px max(20px,env(safe-area-inset-bottom));
  background:var(--bg-card);position:relative;z-index:20;flex-shrink:0;
  border-top:1px solid var(--rule);
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;color:var(--muted-2);transition:color .2s;position:relative;
}
.tab-item.active{color:var(--pink);}
.tab-item.active .tab-dot{display:block;}
.tab-icon{transition:transform .2s;}
.tab-item.active .tab-icon{transform:translateY(-1px);}
.tab-label{font-size:10px;font-weight:600;}
.tab-dot{display:none;width:4px;height:4px;border-radius:50%;background:var(--pink);margin-top:1px;}

/* 视图容器 */
.app-content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:0 16px 16px;position:relative;z-index:10;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.app-content::-webkit-scrollbar{display:none;}

/* ===== 通用组件 ===== */
.section-label{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:700;color:var(--ink);margin:16px 4px 10px;
}
.section-label .sl-bar{width:3px;height:14px;border-radius:2px;background:var(--pink);}
.section-label .sl-sub{font-size:11px;color:var(--muted);font-weight:400;margin-left:auto;}

.card{background:var(--bg-card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;
  transition:all .2s;border:none;
}
.btn-primary{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(255,107,157,0.25);}
.btn-primary:active{transform:scale(0.97);background:var(--pink-deep);}
.btn-soft{background:var(--purple-soft);color:var(--purple);}
.btn-ghost{background:var(--bg-card);color:var(--ink-soft);border:1px solid var(--rule);}
.btn-block{display:flex;width:100%;}
.btn-lg{padding:14px 20px;font-size:15px;border-radius:var(--radius);}

/* 标签胶囊 */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;white-space:nowrap;}
.tag-pink{background:var(--pink-soft);color:var(--pink);}
.tag-purple{background:var(--purple-soft);color:var(--purple);}
.tag-orange{background:var(--orange-soft);color:var(--orange);}
.tag-blue{background:var(--blue-soft);color:var(--blue);}
.tag-gray{background:var(--rule-soft);color:var(--muted);}

/* 进度条 */
.progress-bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;}
.progress-bar .fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,1,.5,1);}
.progress-bar .fill.pink{background:var(--pink);}
.progress-bar .fill.purple{background:var(--purple);}
.progress-bar .fill.done{background:var(--success);}
.progress-bar .fill.orange{background:var(--orange);}

/* 圆形状态图标 */
.status-circle{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;flex-shrink:0;
}
.status-circle.done{background:var(--success);color:#fff;}
.status-circle.warn{background:var(--pink);color:#fff;}
.status-circle.pending{background:var(--rule-soft);color:var(--muted);}

/* ===== 今日看板 · 三统计卡 ===== */
.today-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.stat-card{
  background:var(--bg-card);border-radius:var(--radius);padding:12px 8px;
  text-align:center;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.stat-card .sc-icon{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;margin-bottom:2px;
}
.stat-card .sc-label{font-size:11px;color:var(--muted);font-weight:500;}
.stat-card .sc-num{font-size:28px;font-weight:800;font-family:var(--font-num);line-height:1.1;}
.stat-card .sc-num .sub{font-size:13px;color:var(--muted-2);font-weight:600;}
.stat-card.pink .sc-icon{background:var(--pink-soft);color:var(--pink);}
.stat-card.pink .sc-num{color:var(--pink);}
.stat-card.purple .sc-icon{background:var(--purple-soft);color:var(--purple);}
.stat-card.purple .sc-num{color:var(--purple);}
.stat-card.orange .sc-icon{background:var(--orange-soft);color:var(--orange);}
.stat-card.orange .sc-num{color:var(--orange);}

/* ===== 游戏卡片(四列横排) ===== */
.game-card{
  background:var(--bg-card);border-radius:var(--radius);margin-bottom:10px;
  box-shadow:var(--shadow);overflow:hidden;position:relative;
  transition:transform .2s,box-shadow .2s;
}
.game-card:active{transform:scale(0.99);}
.game-card.full-clear{box-shadow:0 1px 6px rgba(52,199,89,0.10);}
.gc-body{padding:12px 14px;}
.gc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.gc-avatar{
  width:48px;height:48px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;font-size:10px;font-weight:800;color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.gc-avatar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:12px;
  background:rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;
  font-size:6px;color:#fff;font-weight:700;letter-spacing:0.5px;
}
.gc-avatar.genshin::after{content:'GENSHIN';}
.gc-avatar.hsr::after{content:'STARRAIL';}
.gc-avatar.lds::after{content:'DEEPSPACE';}
.gc-avatar.ln::after{content:'L&N';}
.gc-info{flex:1;min-width:0;}
.gc-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.gc-name{font-size:16px;font-weight:700;color:var(--ink);}
.gc-genre{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;}
.gc-star{color:var(--muted-2);font-size:20px;flex-shrink:0;transition:color .2s;cursor:pointer;padding:4px;}
.gc-star.active{color:var(--orange);}
.gc-star:active{transform:scale(1.2);}

/* 四列数据 */
.gc-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;text-align:center;}
.gc-col{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;}
.gc-col-label{font-size:10px;color:var(--muted);font-weight:500;}
.gc-col-num{font-size:20px;font-weight:800;font-family:var(--font-num);line-height:1.1;}
.gc-col-sub{
  font-size:9px;font-weight:600;padding:2px 6px;border-radius:5px;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.gc-col-bar{width:100%;margin-top:2px;}
.gc-col-icon{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;
}
.gc-col.daily .gc-col-num{color:var(--pink);}
.gc-col.daily .gc-col-sub{background:var(--pink-soft);color:var(--pink);}
.gc-col.daily .gc-col-sub.done{background:var(--success-soft);color:var(--success);}
.gc-col.weekly .gc-col-num{color:var(--purple);}
.gc-col.weekly .gc-col-sub{background:var(--purple-soft);color:var(--purple);}
.gc-col.weekly .gc-col-sub.done{background:var(--success-soft);color:var(--success);}
.gc-col.limited .gc-col-num{color:var(--orange);}
.gc-col.limited .gc-col-sub{background:var(--orange-soft);color:var(--orange);}
.gc-col.limited .gc-col-sub.urgent{background:var(--pink-soft);color:var(--pink);}
.gc-col.pass .gc-col-icon.done{background:var(--success);color:#fff;}
.gc-col.pass .gc-col-icon.warn{background:var(--pink);color:#fff;animation:pulse 2s infinite;}
.gc-col.pass .gc-col-text{font-size:10px;font-weight:700;}
.gc-col.pass .gc-col-text.done{color:var(--success);}
.gc-col.pass .gc-col-text.warn{color:var(--pink);}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,157,0.4);}50%{box-shadow:0 0 0 6px rgba(255,107,157,0);}}

/* 添加游戏按钮 */
.add-game-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;border:1.5px dashed var(--muted-2);
  border-radius:var(--radius);padding:14px;color:var(--muted);
  font-size:13px;font-weight:600;width:100%;margin-bottom:10px;transition:all .2s;
}
.add-game-btn:active{border-color:var(--pink);color:var(--pink);background:var(--pink-soft);}

/* ===== 月卡管理 ===== */
.pass-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.pass-card{
  background:var(--bg-card);border-radius:var(--radius);margin-bottom:10px;
  box-shadow:var(--shadow);overflow:hidden;transition:all .2s;
}
.pass-card:active{transform:scale(0.99);}
.pass-card.unclaimed{background:linear-gradient(135deg,#FFF 0%,#FFF5F8 100%);border:1px solid var(--pink-soft);}
.pc-body{padding:14px;}
.pc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pc-name-row{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pc-name{font-size:16px;font-weight:700;}
.pc-status{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:700;}
.pc-status.claimed{background:var(--purple-soft);color:var(--purple);}
.pc-status.unclaimed{background:var(--pink-soft);color:var(--pink);}
.pc-arrow{color:var(--muted-2);font-size:18px;flex-shrink:0;}
.pc-cols{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  text-align:center;padding-top:10px;border-top:1px solid var(--rule-soft);
}
.pc-col-label{font-size:10px;color:var(--muted);margin-bottom:3px;}
.pc-col-val{font-size:16px;font-weight:800;font-family:var(--font-num);}
.pc-col-val.danger{color:var(--pink);}
.pc-col-val.warning{color:var(--orange);}
.pc-col-val.normal{color:var(--purple);}
.pc-col-val.date{font-size:13px;color:var(--ink-soft);}
.pc-col-val.remind{font-size:10px;color:var(--purple);background:var(--purple-soft);padding:2px 6px;border-radius:5px;font-weight:600;display:inline-block;}
.pc-col-val.remind-urgent{color:var(--pink);background:var(--pink-soft);}

.pc-claim-btn{
  width:100%;margin-top:10px;padding:10px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:700;text-align:center;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.pc-claim-btn.claimable{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(255,107,157,0.25);}
.pc-claim-btn.claimed{background:var(--success-soft);color:var(--success);}
.pc-claim-btn:active{transform:scale(0.98);}

/* 提醒设置 */
.setting-group{
  background:var(--bg-card);border-radius:var(--radius);margin-top:12px;
  box-shadow:var(--shadow);overflow:hidden;
}
.sg-head{
  display:flex;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--rule-soft);
  font-size:15px;font-weight:700;
}
.sg-head .sg-sub{font-size:11px;color:var(--muted);font-weight:400;margin-left:auto;}
.sg-head-icon{color:var(--pink);display:flex;align-items:center;}
.setting-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule-soft);}
.setting-row:last-child{border-bottom:none;}
.sr-icon{
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:14px;
}
.sr-label{flex:1;font-size:13px;font-weight:500;color:var(--ink);}
.sr-value{font-size:12px;color:var(--muted);}
.sr-arrow{color:var(--muted-2);font-size:16px;}

/* ===== 氪金记账 ===== */
.spend-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.spend-card{
  background:var(--bg-card);border-radius:var(--radius);padding:12px 8px;
  text-align:center;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.spend-card .sp-icon{
  width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;
}
.spend-card .sp-label{font-size:10px;color:var(--muted);font-weight:500;}
.spend-card .sp-value{font-size:22px;font-weight:800;font-family:var(--font-num);line-height:1.1;}
.spend-card .sp-value .y{font-size:13px;font-weight:700;}
.spend-card.pink .sp-icon{background:var(--pink-soft);color:var(--pink);}
.spend-card.pink .sp-value{color:var(--pink);}
.spend-card.purple .sp-icon{background:var(--purple-soft);color:var(--purple);}
.spend-card.purple .sp-value{color:var(--purple);}
.spend-card.orange .sp-icon{background:var(--orange-soft);color:var(--orange);}
.spend-card.orange .sp-value{color:var(--orange);}
.spend-card .sp-game{font-size:11px;font-weight:700;color:var(--orange);margin-top:2px;}

/* 支出分布 */
.chart-card{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.chart-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;}
.chart-tabs{display:flex;gap:4px;background:var(--rule-soft);border-radius:10px;padding:3px;}
.chart-tab{padding:4px 14px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);transition:all .2s;}
.chart-tab.active{background:var(--pink);color:#fff;}
.chart-body{display:flex;align-items:center;gap:16px;}
.donut{width:100px;height:100px;border-radius:50%;flex-shrink:0;position:relative;}
.donut::after{content:'';position:absolute;inset:14px;border-radius:50%;background:var(--bg-card);}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;}
.dc-label{font-size:10px;color:var(--muted);}
.dc-num{font-size:16px;font-weight:800;font-family:var(--font-num);color:var(--ink);}
.chart-list{flex:1;min-width:0;}
.legend-row-wrap{margin-bottom:8px;}
.legend-row-wrap:last-child{margin-bottom:0;}
.legend-row{display:flex;align-items:center;gap:8px;}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-name{font-size:12px;color:var(--ink-soft);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.legend-val{font-size:12px;font-weight:700;font-family:var(--font-num);color:var(--ink);}
.legend-pct{font-size:11px;color:var(--muted);font-weight:600;width:36px;text-align:right;}
.legend-bar{width:100%;height:4px;background:var(--rule-soft);border-radius:2px;margin-top:4px;overflow:hidden;}
.legend-bar-fill{height:100%;border-radius:2px;}

/* 消费记录 */
.record-card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;}
.record-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;}
.record-title{font-size:15px;font-weight:700;}
.record-more{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px;}
.record-list{padding:0 14px 10px;}
.record-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-soft);}
.record-item:last-child{border-bottom:none;}
.ri-avatar{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.ri-info{flex:1;min-width:0;}
.ri-name{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;}
.ri-tag{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:600;}
.ri-date{font-size:11px;color:var(--muted);margin-top:1px;}
.ri-amount{font-size:17px;font-weight:800;font-family:var(--font-num);color:var(--pink);}

/* 底部双按钮 */
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.btn-pink-lg{
  background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;
  padding:14px;border-radius:var(--radius);font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 20px rgba(255,107,157,0.25);transition:all .2s;
}
.btn-pink-lg:active{transform:scale(0.97);}
.btn-purple-lg{
  background:var(--purple-soft);color:var(--purple);padding:14px;border-radius:var(--radius);
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px dashed var(--purple);transition:all .2s;
}
.btn-purple-lg:active{transform:scale(0.97);}

/* ===== 我的页 ===== */
.profile-card{
  background:var(--bg-card);border-radius:var(--radius-lg);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px;display:flex;align-items:center;gap:14px;
}
.profile-avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid var(--pink-soft);flex-shrink:0;}
.profile-info{flex:1;}
.profile-name{font-size:18px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px;}
.profile-arrow{color:var(--muted-2);font-size:18px;}
.profile-stats{display:flex;gap:16px;margin-top:6px;}
.ps-item{text-align:center;}
.ps-num{font-size:20px;font-weight:800;font-family:var(--font-num);line-height:1;}
.ps-num.pink{color:var(--pink);}
.ps-num.purple{color:var(--purple);}
.ps-num.orange{color:var(--orange);}
.ps-label{font-size:10px;color:var(--muted);margin-top:2px;}

/* 主题文案选择 */
.tone-card{background:var(--bg-card);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow);margin-bottom:12px;}
.tone-item{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);
  cursor:pointer;transition:all .2s;margin:4px;
}
.tone-item.active{background:var(--pink-soft);border:1.5px solid var(--pink);}
.tone-avatar{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;
}
.tone-info{flex:1;}
.tone-name{font-size:14px;font-weight:700;}
.tone-sample{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;}
.tone-check{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tone-check.active{background:var(--pink);color:#fff;}
.tone-check.inactive{width:18px;height:18px;border:2px solid var(--muted-2);border-radius:50%;}

/* ===== 浮层 ===== */
.overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.overlay-mask{position:absolute;inset:0;background:rgba(26,21,32,0.4);backdrop-filter:blur(4px);animation:fadeIn .25s;}
.overlay-panel{
  position:relative;width:390px;max-height:88vh;background:var(--bg);
  border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,0.15);
  overflow-y:auto;animation:slideUp .35s cubic-bezier(.4,1,.5,1);scrollbar-width:none;
}
.overlay-panel::-webkit-scrollbar{display:none;}
.op-handle{width:36px;height:4px;border-radius:2px;background:var(--rule);margin:10px auto 0;}
.op-header{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;}
.op-back{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.op-title{flex:1;font-size:18px;font-weight:800;}
.op-title small{font-size:12px;color:var(--muted);font-weight:500;display:block;margin-top:2px;}
.op-close{width:30px;height:30px;border-radius:50%;background:var(--rule-soft);color:var(--muted);display:flex;align-items:center;justify-content:center;}
.op-body{padding:0 16px 24px;}

/* ===== 版本日历 ===== */
.cal-import{
  background:var(--bg-card);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);margin-bottom:12px;display:flex;align-items:center;gap:12px;
}
.ci-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover;border:2px solid var(--purple-soft);position:relative;}
.ci-badge{
  position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;
  background:var(--purple);color:#fff;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);
}
.ci-info{flex:1;}
.ci-title{font-size:14px;font-weight:700;}
.ci-desc{font-size:11px;color:var(--muted);margin-top:2px;}
.ci-btn{
  background:var(--purple-soft);color:var(--purple);padding:8px 14px;border-radius:20px;
  font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;flex-shrink:0;
}

.cal-filters{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-tabs{display:flex;gap:6px;}
.cal-filter{padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg-card);border:1px solid var(--rule);transition:all .2s;}
.cal-filter.active{background:var(--pink);color:#fff;border-color:var(--pink);}
.cal-view-btn{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft);font-weight:600;}

.cal-timeline{position:relative;padding-left:20px;}
.cal-timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--rule);}
.cal-event{position:relative;margin-bottom:10px;padding-left:16px;}
.cal-event::before{content:'';position:absolute;left:-19px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--bg-card);border:2.5px solid var(--purple);z-index:1;}
.cal-event.active::before{background:var(--pink);border-color:var(--pink);}
.cal-event.ending::before{background:var(--orange);border-color:var(--orange);}
.cal-event.upcoming::before{background:var(--bg-card);border-color:var(--muted-2);}

.cal-event-card{
  background:var(--bg-card);border-radius:var(--radius);padding:12px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;border:2px solid transparent;
}
.cal-event.active .cal-event-card{border-color:var(--pink-soft);}
.cal-event.ending .cal-event-card{border-color:var(--orange-soft);}
.cal-event.upcoming .cal-event-card{opacity:0.85;}
.ce-avatar{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.ce-info{flex:1;min-width:0;}
.ce-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;}
.ce-name{font-size:14px;font-weight:700;}
.ce-tag{font-size:9px;padding:2px 7px;border-radius:5px;font-weight:700;}
.ce-title{font-size:12px;color:var(--ink-soft);font-weight:500;margin-bottom:3px;}
.ce-date{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.ce-countdown{text-align:center;flex-shrink:0;padding:8px 12px;border-radius:var(--radius-sm);}
.ce-countdown .cd-num{font-size:16px;font-weight:800;font-family:var(--font-num);}
.ce-countdown .cd-label{font-size:10px;font-weight:600;}
.ce-countdown.active{background:var(--pink-soft);color:var(--pink);}
.ce-countdown.ending{background:var(--orange-soft);color:var(--orange);}
.ce-countdown.upcoming{background:var(--pink-soft);color:var(--pink);}

.cal-footer{text-align:center;padding:14px 0 0;font-size:11px;color:var(--muted);line-height:1.6;}

/* ===== AI 建档 ===== */
.ai-steps{display:flex;align-items:center;gap:4px;padding:0 16px 16px;}
.ai-step{display:flex;align-items:center;gap:6px;flex:1;}
.ai-step-num{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;flex-shrink:0;
}
.ai-step.active .ai-step-num{background:var(--pink);color:#fff;}
.ai-step.done .ai-step-num{background:var(--success);color:#fff;}
.ai-step.pending .ai-step-num{background:var(--rule-soft);color:var(--muted);}
.ai-step-label{font-size:11px;font-weight:600;color:var(--muted);}
.ai-step.active .ai-step-label{color:var(--pink);}
.ai-step-line{flex:0 0 20px;height:2px;background:var(--rule);border-radius:1px;}
.ai-step.done + .ai-step-line{background:var(--success);}

.ai-hero{text-align:center;padding:8px 16px 16px;}
.ai-mascot{width:64px;height:64px;border-radius:20px;margin:0 auto 8px;border:3px solid var(--purple-soft);object-fit:cover;}
.ai-hero h3{font-size:17px;font-weight:800;}
.ai-hero p{font-size:12px;color:var(--muted);margin-top:4px;}

.ai-input-wrap{
  background:var(--bg-card);border:1.5px solid var(--rule);border-radius:var(--radius);
  padding:4px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .2s;
}
.ai-input-wrap:focus-within{border-color:var(--purple);}
.ai-input{
  width:100%;border:none;outline:none;background:none;font-family:inherit;font-size:13px;
  color:var(--ink);padding:12px;resize:none;line-height:1.6;min-height:80px;
}
.ai-input::placeholder{color:var(--muted-2);}
.ai-input-meta{text-align:right;font-size:10px;color:var(--muted);padding:0 8px 4px;}

.ai-examples{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.ai-example{
  font-size:11px;padding:6px 12px;background:var(--purple-soft);color:var(--purple);
  border-radius:16px;font-weight:600;cursor:pointer;transition:all .2s;
}
.ai-example:active{transform:scale(0.95);background:var(--purple);color:#fff;}

.ai-result{display:none;}
.ai-result.show{display:block;animation:fadeIn .4s;}
.ar-label{font-size:13px;color:var(--success);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.ar-card{background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--radius);padding:12px;margin-bottom:8px;box-shadow:var(--shadow);}
.ar-game{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.arg-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800;}
.arg-name{flex:1;font-weight:700;font-size:13px;}
.ar-fields{display:flex;flex-wrap:wrap;gap:4px;}
.ar-field{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--rule-soft);color:var(--ink-soft);font-weight:600;}
.ar-field.warn{background:var(--orange-soft);color:var(--orange);}

/* AI 统计摘要 */
.ai-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.ai-sum-item{text-align:center;background:var(--bg-card);border-radius:var(--radius-sm);padding:10px 4px;box-shadow:var(--shadow);}
.ai-sum-num{font-size:20px;font-weight:800;font-family:var(--font-num);}
.ai-sum-num.pink{color:var(--pink);}
.ai-sum-num.purple{color:var(--purple);}
.ai-sum-label{font-size:10px;color:var(--muted);margin-top:2px;}

.ai-privacy{text-align:center;font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}

/* ===== 分享卡预览 ===== */
.share-preview{background:var(--bg-card);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:12px;}
.sp-top{
  background:linear-gradient(135deg,#E8E4FF 0%,#FFE4F0 100%);
  padding:24px 20px;color:var(--ink);text-align:center;position:relative;overflow:hidden;
}
.sp-top::before{content:'✦';position:absolute;top:15px;right:25px;font-size:28px;opacity:0.2;color:var(--purple);}
.sp-top::after{content:'✧';position:absolute;bottom:20px;left:20px;font-size:18px;opacity:0.15;color:var(--pink);}
.sp-mascot{width:52px;height:52px;border-radius:16px;margin:0 auto 8px;border:3px solid rgba(255,255,255,0.6);object-fit:cover;}
.sp-title{font-size:20px;font-weight:800;color:var(--ink);}
.sp-date{font-size:11px;opacity:0.7;margin-top:3px;color:var(--ink-soft);}
.sp-body{padding:16px 18px;}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.sp-stat{text-align:center;background:var(--rule-soft);border-radius:var(--radius-sm);padding:10px 4px;}
.sp-stat .n{font-size:20px;font-weight:800;font-family:var(--font-num);color:var(--pink);}
.sp-stat .l{font-size:9px;color:var(--muted);}
.sp-game{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule-soft);}
.sp-game:last-child{border-bottom:none;}
.sg-icon{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:800;}
.sg-name{flex:1;font-size:12px;font-weight:600;}
.sg-status{font-size:11px;font-weight:700;}
.sp-footer{padding:14px 18px;text-align:center;border-top:1px solid var(--rule);}
.sp-brand{font-size:14px;font-weight:800;color:var(--pink);}
.sp-slogan{font-size:10px;color:var(--muted);margin-top:2px;}

.share-actions{display:flex;gap:10px;}

/* ===== 动画 ===== */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes stampDown{
  0%{transform:scale(2.5) rotate(-20deg);opacity:0;}
  60%{transform:scale(0.85) rotate(-2deg);opacity:1;}
  100%{transform:scale(1) rotate(-8deg);opacity:1;}
}
@keyframes pop{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.view-enter{animation:fadeIn .3s;}

/* 盖章特效 */
.stamp-effect{position:fixed;pointer-events:none;z-index:2000;display:none;}
.stamp-effect.show{display:block;animation:stampDown .5s ease-out;}
.se-inner{
  display:flex;align-items:center;justify-content:center;
  width:64px;height:64px;border-radius:50%;border:3px solid var(--success);
  color:var(--success);font-size:13px;font-weight:800;
  background:rgba(255,255,255,0.95);transform:rotate(-8deg);
  box-shadow:0 4px 15px rgba(52,199,89,0.2);
}

/* Toast */
.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(26,21,32,0.92);color:#fff;padding:10px 22px;border-radius:24px;
  font-size:13px;font-weight:500;z-index:3000;opacity:0;pointer-events:none;
  transition:all .3s;backdrop-filter:blur(8px);white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== 引导气泡 ===== */
.guide-bubble{
  position:absolute;top:-72px;left:50%;transform:translateX(-50%) scale(0.8);
  background:#1A1520;color:#fff;padding:10px 14px;border-radius:12px;
  white-space:nowrap;font-size:12px;z-index:50;opacity:0;
  transition:all .3s cubic-bezier(.4,1,.5,1);pointer-events:auto;
  box-shadow:0 6px 20px rgba(0,0,0,0.15);
}
.guide-bubble.show{opacity:1;transform:translateX(-50%) scale(1);}
.guide-bubble .gb-arrow{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotate(45deg);
  width:12px;height:12px;background:#1A1520;
}
.guide-bubble .gb-content{display:inline-block;}
.guide-bubble .gb-title{font-weight:700;font-size:13px;margin-bottom:2px;}
.guide-bubble .gb-desc{font-size:11px;opacity:0.8;}
.guide-bubble .gb-close{
  margin-left:10px;padding:3px 10px;border-radius:10px;
  background:var(--pink);color:#fff;font-size:11px;font-weight:600;
  white-space:nowrap;
}

/* ===== 可点击数字 + 打卡按钮 ===== */
.gc-col-num.clickable{cursor:pointer;transition:transform .15s;}
.gc-col-num.clickable:active{transform:scale(1.15);}
.gc-col-num.clickable::after{
  content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--pink);margin-left:3px;vertical-align:top;margin-top:4px;
  animation:blink 1.5s infinite;
}
@keyframes blink{0%,100%{opacity:0.3;}50%{opacity:1;}}

.gc-col-btn{
  margin-top:4px;padding:3px 10px;border-radius:10px;
  background:var(--pink);color:#fff;font-size:10px;font-weight:700;
  border:none;cursor:pointer;transition:all .2s;white-space:nowrap;
  box-shadow:0 2px 6px rgba(255,107,157,0.2);
}
.gc-col-btn:active{transform:scale(0.92);}

/* ===== AI 导入高亮动画 ===== */
.highlight-pulse{
  animation:highlightPulse 2.5s ease-out;
  border:2px solid var(--purple)!important;
}
@keyframes highlightPulse{
  0%{box-shadow:0 0 0 0 rgba(139,123,247,0.6);}
  30%{box-shadow:0 0 0 8px rgba(139,123,247,0.3);border-color:var(--purple);}
  60%{box-shadow:0 0 0 4px rgba(139,123,247,0.2);}
  100%{box-shadow:0 1px 6px rgba(120,100,140,0.06);border-color:transparent;}
}

/* ===== 记一笔表单 ===== */
.form-section{margin-bottom:16px;}
.form-label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.form-game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.form-game-chip{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-radius:var(--radius-sm);border:2px solid var(--rule);
  background:var(--bg-card);transition:all .2s;cursor:pointer;
}
.form-game-chip.selected{border-color:var(--pink);background:var(--pink-soft);}
.fgc-avatar{
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:10px;font-weight:800;flex-shrink:0;
}
.fgc-name{font-size:12px;font-weight:600;color:var(--ink);}

.form-amount-wrap{
  display:flex;align-items:center;gap:4px;background:var(--bg-card);
  border:2px solid var(--rule);border-radius:var(--radius-sm);padding:0 14px;
  transition:border-color .2s;
}
.form-amount-wrap:focus-within{border-color:var(--pink);}
.form-amount-prefix{font-size:20px;font-weight:800;color:var(--muted);}
.form-amount{
  flex:1;border:none;outline:none;background:none;font-family:var(--font-num);
  font-size:28px;font-weight:800;color:var(--ink);padding:10px 0;width:100%;
}
.form-amount::placeholder{color:var(--muted-2);}

.form-quick-amounts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.quick-amt{
  padding:6px 14px;border-radius:16px;background:var(--rule-soft);
  color:var(--ink-soft);font-size:12px;font-weight:600;transition:all .2s;
  border:1px solid var(--rule);
}
.quick-amt:active{background:var(--pink-soft);color:var(--pink);border-color:var(--pink);}

.form-type-row{display:flex;gap:6px;flex-wrap:wrap;}
.form-type-chip{
  padding:8px 16px;border-radius:20px;border:2px solid var(--rule);
  background:var(--bg-card);font-size:13px;font-weight:600;color:var(--ink-soft);
  transition:all .2s;
}
.form-type-chip.selected{border-color:var(--pink);background:var(--pink-soft);color:var(--pink);}

.form-note{
  width:100%;border:2px solid var(--rule);border-radius:var(--radius-sm);
  padding:10px 14px;font-family:inherit;font-size:13px;color:var(--ink);
  outline:none;transition:border-color .2s;background:var(--bg-card);
}
.form-note:focus{border-color:var(--pink);}

#confirmSpendBtn{opacity:0.5;cursor:not-allowed;transition:all .3s;}
#confirmSpendBtn.active{opacity:1;cursor:pointer;}
#confirmSpendBtn:disabled{box-shadow:none;}

/* ===== 分享卡文字关闭按钮 ===== */
.op-close-text{
  padding:6px 14px;border-radius:16px;background:var(--rule-soft);
  color:var(--ink-soft);font-size:13px;font-weight:600;
  transition:all .2s;
}
.op-close-text:active{background:var(--rule);transform:scale(0.95);}

/* ===== 展示模式（放大） ===== */
body.zoom-mode{
  background:#1A1520;
}
body.zoom-mode #app-root{padding:10px 0;}
body.zoom-mode .phone-frame{
  transform:scale(1.35);transform-origin:center center;
  transition:transform .4s cubic-bezier(.4,1,.5,1);
}
body.zoom-mode .ha-btn.zoom-btn{color:var(--pink);background:var(--pink-soft);}

/* 浮动退出按钮（不受 transform 影响） */
.zoom-exit-btn{
  position:fixed;top:20px;right:20px;z-index:9999;
  display:none;align-items:center;gap:6px;
  padding:10px 20px;border-radius:24px;
  background:rgba(255,107,157,0.9);color:#fff;
  font-size:14px;font-weight:700;border:none;cursor:pointer;
  backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(255,107,157,0.4);
  transition:all .2s;
}
.zoom-exit-btn:hover{background:rgba(255,107,157,1);transform:scale(1.05);}
.zoom-exit-btn svg{width:18px;height:18px;}

.ha-btn.zoom-btn{color:var(--ink-soft);}
.ha-btn.zoom-btn:active{transform:scale(0.9);}

/* ===== 首次引导浮层 ===== */
.onboarding-overlay{
  position:fixed;inset:0;z-index:2000;display:none;
  align-items:center;justify-content:center;
}
.onboarding-overlay.show{display:flex;}
.onboarding-overlay .ob-mask{
  position:absolute;inset:0;background:rgba(26,21,32,0.55);
  backdrop-filter:blur(6px);animation:fadeIn .3s;
}
.onboarding-overlay .ob-panel{
  position:relative;width:340px;background:var(--bg);
  border-radius:28px;padding:28px 24px 20px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  animation:slideUp .4s cubic-bezier(.4,1,.5,1);
}
.ob-mascot{
  width:64px;height:64px;margin:0 auto 12px;
}
.ob-mascot img{width:64px;height:64px;border-radius:20px;border:3px solid var(--purple-soft);object-fit:cover;}
.ob-step-icon{
  width:48px;height:48px;border-radius:50%;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;
  background:var(--pink-soft);color:var(--pink);
}
.ob-title{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:8px;}
.ob-desc{font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px;}
.ob-dots{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
.ob-dot{width:8px;height:8px;border-radius:50%;background:var(--rule);transition:all .3s;}
.ob-dot.active{background:var(--pink);width:24px;border-radius:4px;}
.ob-dot.done{background:var(--purple-soft);}
.ob-actions{display:flex;gap:8px;}
.ob-actions .btn{flex:1;}
.ob-skip{
  margin-top:12px;font-size:12px;color:var(--muted);
  background:none;border:none;cursor:pointer;padding:4px;
}
.ob-skip:active{color:var(--ink-soft);}

/* ===== 响应式 ===== */
@media(max-width:430px){
  body{background:var(--bg);}
  #app-root{padding:0;}
  .phone-frame{width:100%;}
  .phone-bezel{border-radius:0;padding:0;box-shadow:none;}
  .phone-screen{border-radius:0;height:100vh;}
  .status-bar{padding-top:max(12px,env(safe-area-inset-top));}
  .tab-bar{padding-bottom:max(20px,env(safe-area-inset-bottom));}
  .overlay{align-items:stretch;}
  .overlay-panel{width:100%;max-height:92vh;border-radius:24px 24px 0 0;}
}
@media(min-width:431px){
  .phone-screen{height:calc(100vh - 80px);max-height:840px;}
}

// ===== 工具函数 =====
function $(s){return document.querySelector(s);}
function $$(s){return document.querySelectorAll(s);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function showToast(msg,duration=2000){
  const t=$('#toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),duration);
}

function showStamp(text='拉满!'){
  const el=$('#stampEffect');
  el.innerHTML=`<div class="se-inner">${text}</div>`;
  el.classList.add('show');
  el.style.top='35%';
  el.style.left='50%';
  el.style.transform='translateX(-50%)';
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.classList.remove('show'),1200);
}

// ===== 视图路由 =====
function navigate(route){
  state.route=route;
  $$('.tab-item').forEach(t=>t.classList.toggle('active',t.dataset.route===route));

  // 首屏标题突出"次元簿"品牌
  const titles={
    today:['次元簿','躺平日常 · 一眼看清今天的游戏数据态'],
    monthly:['次元簿','月卡管家 · 领了没?什么时候到期?'],
    spending:['次元簿','氪金记账 · 看清你把爱给了谁'],
    mine:['次元簿','我的次元簿 · 个人偏好与设置'],
  };
  const [brand,sub]=titles[route]||titles.today;
  $('#appTitle').innerHTML=`${brand} <span class="title-sparkle">✨</span>`;
  $('#appSubtitle').textContent=sub;

  updateReminder(route);
  rerenderView();

  // 首次进入今日页时显示引导
  if(route==='today'&&!state.guideShown){
    setTimeout(()=>showGuideBubble(),600);
    state.guideShown=true;
  }
}

function updateReminder(route){
  const banner=$('#reminderBanner');
  const text=$('#reminderText');
  const unclaimed=GAMES.filter(g=>g.pass.active&&!state.passClaimed[g.id]);
  const tone=TONES.find(t=>t.id===state.tone);

  let msg='';
  if(route==='today'){
    if(unclaimed.length>0){
      const urgent=unclaimed.find(g=>g.pass.daysLeft<=1);
      if(urgent){
        msg=state.tone==='roast'?`${urgent.name}月卡明天就没了，还不领？`
          :state.tone==='romantic'?`亲爱的，${urgent.name}月卡明天到期哦~`
          :`紧急!${urgent.name}月卡明天到期,还没领!`;
      }else{
        const names=unclaimed.map(g=>g.name).join('、');
        msg=state.tone==='roast'?`${names}月卡又被忘了吧？`
          :state.tone==='romantic'?`记得领${names}月卡哦~`
          :`今日提醒:${names}月卡还没领`;
      }
    }else{
      msg='今日月卡全部领完啦~ 旅行者很棒!';
    }
  }else if(route==='monthly'){
    msg=unclaimed.length>0?`还有${unclaimed.length}张月卡待领取`:'本月月卡全部领取完毕';
  }else if(route==='spending'){
    msg=`本月已氪 ¥${SPENDING.monthTotal},理性消费哦~`;
  }else{
    msg='在这里调整你的专属风格和偏好';
  }
  text.textContent=msg;
}

function rerenderView(){
  const c=$('#viewContainer');
  c.classList.remove('view-enter');
  void c.offsetWidth;
  c.classList.add('view-enter');

  if(state.route==='today') c.innerHTML=todayHTML();
  else if(state.route==='monthly') c.innerHTML=monthlyHTML();
  else if(state.route==='spending') c.innerHTML=spendingHTML();
  else if(state.route==='mine') c.innerHTML=mineHTML();
}

// ===== 引导气泡 =====
function showGuideBubble(){
  const existing=document.querySelector('.guide-bubble');
  if(existing) existing.remove();

  const bubble=document.createElement('div');
  bubble.className='guide-bubble';
  bubble.innerHTML=`
    <div class="gb-arrow"></div>
    <div class="gb-content">
      <div class="gb-title">点击数字即可打卡</div>
      <div class="gb-desc">点一下「6/8」推进进度，拉满后触发盖章动画</div>
    </div>
    <button class="gb-close" data-action="dismiss-guide">知道了</button>
  `;

  const firstCard=document.querySelector('.game-card .gc-col.daily');
  if(firstCard){
    firstCard.style.position='relative';
    firstCard.appendChild(bubble);
    setTimeout(()=>{
      bubble.classList.add('show');
    },100);
  }
}

    <div class="section-label"><span class="sl-bar"></span>今日看板</div>
  `;

  GAMES.forEach(g=>{
    html+=gameCardHTML(g);
  });

  html+=`<button class="add-game-btn" data-action="show-ai">${ICON.plus}用 AI 一句话添加游戏</button>`;
  return html;
}

function gameCardHTML(g){
  const done=state.dailyDone[g.id]||0;
  const isDone=done>=g.daily.total;
  const weeklyDone=g.weekly.done>=g.weekly.total;
  const passClaimed=state.passClaimed[g.id];
  const passUrgent=g.pass.active&&g.pass.daysLeft<=2&&!passClaimed;
  const limitedUrgent=g.limited&&g.limited.daysLeft<=2;
  const dailyPct=Math.min(100,(done/g.daily.total)*100);
  const weeklyPct=Math.min(100,(g.weekly.done/g.weekly.total)*100);

  // 检查是否需要高亮（AI导入后）
  const highlight=state.aiChanges.some(c=>c.gameId===g.id);

  return `
    <div class="game-card ${isDone?'full-clear':''} ${highlight?'highlight-pulse':''}" id="card-${g.id}">
      <div class="gc-body">
        <div class="gc-head">
          <div class="gc-avatar ${g.colorKey}" style="background:${g.bgColor};">
            ${g.abbr.slice(0,2)}
          </div>
          <div class="gc-info">
            <div class="gc-name-row">
              <span class="gc-name">${esc(g.name)}</span>
              <span class="gc-genre tag tag-${g.genre.includes('乙女')?'pink':'blue'}">${esc(g.genre)}</span>
            </div>
          </div>
          <div class="gc-star ${state.starred[g.id]?'active':''}" data-action="toggle-star" data-id="${g.id}">
            ${state.starred[g.id]?ICON.starFill:ICON.star}
          </div>
        </div>
        <div class="gc-cols">
          <!-- 今日 - 带明确打卡按钮 -->
          <div class="gc-col daily">
            <div class="gc-col-label">今日</div>
            <div class="gc-col-num clickable" data-action="toggle-daily" data-id="${g.id}">
              ${done}/${g.daily.total}
            </div>
            <div class="gc-col-bar"><div class="progress-bar"><div class="fill ${isDone?'done':'pink'}" style="width:${dailyPct}%"></div></div></div>
            <div class="gc-col-sub ${isDone?'done':''}">${isDone?'已拉满':'进行中'}</div>
            ${!isDone?`<button class="gc-col-btn" data-action="toggle-daily" data-id="${g.id}">打卡 +1</button>`:''}
          </div>
          <!-- 本周 -->
          <div class="gc-col weekly">
            <div class="gc-col-label">本周</div>
            <div class="gc-col-num">${g.weekly.done}/${g.weekly.total}</div>
            <div class="gc-col-bar"><div class="progress-bar"><div class="fill ${weeklyDone?'done':'purple'}" style="width:${weeklyPct}%"></div></div></div>
            <div class="gc-col-sub ${weeklyDone?'done':''}">${weeklyDone?'已完成':'进行中'}</div>
          </div>
          <!-- 限时 -->
          <div class="gc-col limited">
            <div class="gc-col-label">限时</div>
            ${g.limited?`
              <div class="gc-col-num" style="color:${limitedUrgent?'var(--pink)':'var(--orange)'};">${g.limited.daysLeft}<span style="font-size:12px;">天</span></div>
              <div class="gc-col-sub ${limitedUrgent?'urgent':''}">${g.limited.name.length>6?g.limited.name.slice(0,5)+'…':g.limited.name}</div>
            `:`
              <div class="gc-col-num" style="color:var(--muted-2);font-size:14px;">—</div>
              <div class="gc-col-sub" style="background:var(--rule-soft);color:var(--muted-2);">暂无</div>
            `}
          </div>
          <!-- 月卡 -->
          <div class="gc-col pass">
            <div class="gc-col-label">月卡</div>
            <div class="gc-col-icon ${passClaimed?'done':(passUrgent?'warn':'done')}" data-action="claim-pass" data-id="${g.id}" style="cursor:pointer;">
              ${passClaimed?ICON.checkSm:(g.pass.active?'!':'—')}
            </div>
            <div class="gc-col-text ${passClaimed?'done':(passUrgent?'warn':'done')}">${passClaimed?'已领':(g.pass.active?'未领':'无')}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ===== 月卡页 =====
function monthlyHTML(){
  const active=GAMES.filter(g=>g.pass.active).length;
  const claimed=GAMES.filter(g=>g.pass.active&&state.passClaimed[g.id]).length;
  const unclaimed=active-claimed;
  const expiring=GAMES.filter(g=>g.pass.active&&g.pass.daysLeft<=2&&!state.passClaimed[g.id]).length;

  let html=`
    <div class="pass-stats">
      <div class="stat-card purple"><div class="sc-icon">${ICON.bell}</div><div class="sc-num">${active}</div><div class="sc-label">月卡总数</div></div>
      <div class="stat-card pink"><div class="sc-icon">${ICON.check}</div><div class="sc-num">${unclaimed}</div><div class="sc-label">今日待领</div></div>
      <div class="stat-card orange"><div class="sc-icon">${ICON.clock}</div><div class="sc-num">${expiring}</div><div class="sc-label">即将到期</div></div>
    </div>
    <div class="section-label"><span class="sl-bar"></span>月卡管理</div>
  `;

  GAMES.forEach(g=>{ html+=passCardHTML(g); });

  html+=`
    <div class="setting-group">
      <div class="sg-head">
        <span class="sg-head-icon">${ICON.gear}</span> 提醒设置
        <span class="sg-sub">每日领卡不忘记</span>
      </div>
      <div class="setting-row" data-action="toast" data-id="已开启每日12:00提醒">
        <div class="sr-icon" style="background:var(--pink-soft);color:var(--pink);">${ICON.bell}</div>
        <div class="sr-label">领卡提醒</div>
        <div class="sr-value">每日 12:00</div>
        <div class="sr-arrow">${ICON.arrowSm}</div>
      </div>
      <div class="setting-row" data-action="toast" data-id="已开启到期前3天提醒">
        <div class="sr-icon" style="background:var(--orange-soft);color:var(--orange);">${ICON.clock}</div>
        <div class="sr-label">到期预警</div>
        <div class="sr-value">提前 3 天</div>
        <div class="sr-arrow">${ICON.arrowSm}</div>
      </div>
    </div>
  `;
  return html;
}

function passCardHTML(g){
  if(!g.pass.active){
    return `
      <div class="pass-card"><div class="pc-body">
        <div class="pc-head">
          <div class="gc-avatar ${g.colorKey}" style="background:${g.bgColor};width:40px;height:40px;border-radius:10px;">${g.abbr.slice(0,2)}</div>
          <div class="pc-name-row"><span class="pc-name">${esc(g.name)}</span><span class="pc-status" style="background:var(--rule-soft);color:var(--muted);">未开通</span></div>
        </div>
        <div class="pc-cols">
          <div><div class="pc-col-label">剩余天数</div><div class="pc-col-val" style="color:var(--muted-2);">—</div></div>
          <div><div class="pc-col-label">到期日期</div><div class="pc-col-val date">—</div></div>
          <div><div class="pc-col-label">领卡时间</div><div class="pc-col-val" style="color:var(--muted-2);font-size:13px;">—</div></div>
        </div>
      </div></div>
    `;
  }
  const claimed=state.passClaimed[g.id];
  const urgent=g.pass.daysLeft<=2&&!claimed;
  const daysClass=urgent?'danger':(g.pass.daysLeft<=5?'warning':'normal');
  const remindClass=urgent?'remind remind-urgent':'remind';

  return `
    <div class="pass-card ${!claimed?'unclaimed':''}"><div class="pc-body">
      <div class="pc-head">
        <div class="gc-avatar ${g.colorKey}" style="background:${g.bgColor};width:40px;height:40px;border-radius:10px;">${g.abbr.slice(0,2)}</div>
        <div class="pc-name-row"><span class="pc-name">${esc(g.name)}</span><span class="pc-status ${claimed?'claimed':'unclaimed'}">${claimed?'已领取':'待领取'}</span></div>
      </div>
      <div class="pc-cols">
        <div><div class="pc-col-label">剩余天数</div><div class="pc-col-val ${daysClass}">${g.pass.daysLeft}<span style="font-size:10px;">天</span></div></div>
        <div><div class="pc-col-label">到期日期</div><div class="pc-col-val date">${g.pass.expireDate}</div></div>
        <div><div class="pc-col-label">领卡时间</div><span class="pc-col-val ${remindClass}">${g.pass.remind}</span></div>
      </div>
      ${claimed
        ? `<div class="pc-claim-btn claimed">${ICON.checkSm} 今日已领取</div>`
        : `<div class="pc-claim-btn claimable" data-action="claim-pass" data-id="${g.id}">${ICON.bell} 领取今日奖励</div>`
      }
    </div></div>
  `;
}

// ===== 记账页 =====
function spendingHTML(){
  let html=`
    <div class="spend-stats">
      <div class="spend-card pink"><div class="sp-icon">${ICON.money}</div><div class="sp-value"><span class="y">¥</span>${SPENDING.monthTotal}</div><div class="sp-label">本月总支出</div></div>
      <div class="spend-card purple"><div class="sp-icon">${ICON.chart}</div><div class="sp-value"><span class="y">¥</span>${SPENDING.grandTotal}</div><div class="sp-label">累计总支出</div></div>
      <div class="spend-card orange"><div class="sp-icon">${ICON.report}</div><div class="sp-value"><span class="y">¥</span>${SPENDING.maxSingle}</div><div class="sp-game">${SPENDING.maxGame}</div><div class="sp-label">本月最高单笔</div></div>
    </div>
  `;

  // 饼图
  const cats=SPENDING.categories;
  const total=cats.reduce((s,c)=>s+c.amount,0);
  let cumulative=0;
  const segments=cats.map(c=>{
    const start=(cumulative/total)*360;
    cumulative+=c.amount;
    const end=(cumulative/total)*360;
    return {...c,pct:((c.amount/total)*100).toFixed(1),start,end};
  });

  let donutGrad='conic-gradient(';
  segments.forEach((s,i)=>{
    donutGrad+=`${s.color} ${s.start}deg ${s.end}deg`;
    if(i<segments.length-1) donutGrad+=', ';
  });
  donutGrad+=')';

  html+=`
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">${ICON.chart} 支出分布</div>
        <div class="chart-tabs"><div class="chart-tab active">本月</div><div class="chart-tab">累计</div></div>
      </div>
      <div class="chart-body">
        <div class="donut" style="background:${donutGrad};">
          <div class="donut-center"><div class="dc-label">本月支出</div><div class="dc-num">¥${SPENDING.monthTotal}</div></div>
        </div>
        <div class="chart-list">
          ${segments.map(c=>`
            <div class="legend-row-wrap">
              <div class="legend-row">
                <div class="legend-dot" style="background:${c.color};"></div>
                <div class="legend-name">${esc(c.name)}</div>
                <div class="legend-val">¥${c.amount}</div>
                <div class="legend-pct">${c.pct}%</div>
              </div>
              <div class="legend-bar"><div class="legend-bar-fill" style="width:${c.pct}%;background:${c.color};"></div></div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;

  // 消费记录
  html+=`
    <div class="record-card">
      <div class="record-head">
        <div class="record-title">${ICON.list} 消费记录</div>
        <div class="record-more">查看全部 ${ICON.arrowSm}</div>
      </div>
      <div class="record-list">
        ${SPENDING.records.map(r=>`
          <div class="record-item">
            <div class="ri-avatar" style="background:${r.bgColor};">${r.game.slice(0,2)}</div>
            <div class="ri-info">
              <div class="ri-name">${esc(r.item)} <span class="tag tag-${r.tagColor}">${r.tag}</span></div>
              <div class="ri-date">${r.date}</div>
            </div>
            <div class="ri-amount">¥${r.amount}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // 底部双按钮 — "记一笔"改为真实功能
  html+=`
    <div class="action-row">
      <button class="btn-pink-lg" data-action="show-add-spending">${ICON.plus} 记一笔</button>
      <button class="btn-purple-lg" data-action="show-share" data-type="spending">${ICON.share} 生成 Reveal</button>
    </div>
  `;
  return html;
}

  panel._spendData={gameId:null,amount:0,type:null,typeColor:''};

  // 金额输入监听
  $('#spendAmount').addEventListener('input',e=>{

    updateSpendBtn();
  });
}

function updateSpendBtn(){
  const d=$('#overlayPanel')._spendData;
  const btn=$('#confirmSpendBtn');
  if(d&&d.gameId&&d.amount>0&&d.type){
    btn.disabled=false;
    btn.classList.add('active');
  }else{
    btn.disabled=true;
    btn.classList.remove('active');
  }
}

function confirmSpend(){
  const d=$('#overlayPanel')._spendData;
  if(!d||!d.gameId||!d.amount||!d.type) return;

  const g=GAMES.find(x=>x.id===d.gameId);
  if(!g) return;

  const note=$('#spendNote').value.trim()||`${g.name}消费`;
  const today=new Date();
  const dateStr=`${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')}`;

  // 添加记录
  const typeObj=SPEND_TYPES.find(t=>t.id===d.type);
  SPENDING.records.unshift({
    game:g.abbr,item:note,amount:d.amount,date:dateStr,
    tag:typeObj.name,tagColor:typeObj.color,bgColor:g.bgColor
  });

  // 更新总额
  SPENDING.monthTotal+=d.amount;
  SPENDING.grandTotal+=d.amount;
  if(d.amount>SPENDING.maxSingle){
    SPENDING.maxSingle=d.amount;
    SPENDING.maxGame=g.name;
  }

  // 更新分类
  const catName=`${g.name} · ${typeObj.name==='月卡'?g.pass.name:typeObj.name==='充值'?'创世结晶':typeObj.name==='抽卡'?'星轨通票':'极光'}`;
  let cat=SPENDING.categories.find(c=>c.name.includes(g.name));
  if(cat){
    cat.amount+=d.amount;
  }else{
    SPENDING.categories.push({name:catName,amount:d.amount,color:g.bgColor,pct:0});
  }
  // 重新计算百分比
  const total=SPENDING.categories.reduce((s,c)=>s+c.amount,0);
  SPENDING.categories.forEach(c=>{c.pct=parseFloat((c.amount/total*100).toFixed(1));});

  hideOverlay();
  rerenderView();
  updateReminder(state.route);
  showStamp('已记!');
  setTimeout(()=>showToast(`已记录：${g.name} ¥${d.amount}`),600);
}

function aiParse(){
  const input=$('#aiInput').value.trim();
  const result=$('#aiResult');
  const btn=$('#aiParseBtn');

  if(!input){ showToast('请输入或选择一段描述'); return; }

  $$('.ai-step')[0].classList.remove('active');
  $$('.ai-step')[0].classList.add('done');
  $$('.ai-step')[1].classList.remove('pending');
  $$('.ai-step')[1].classList.add('active');

  btn.innerHTML=`<span style="display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></span> 正在识别...`;
  btn.disabled=true;

  setTimeout(()=>{
    const parsed=aiMockParse(input);

    $$('.ai-step')[1].classList.remove('active');
    $$('.ai-step')[1].classList.add('done');
    $$('.ai-step')[2].classList.remove('pending');
    $$('.ai-step')[2].classList.add('active');

    if(parsed.length===0){
      result.innerHTML=`
        <div class="ar-label" style="color:var(--orange);">${ICON.warn} 未识别到游戏信息</div>
        <div class="ar-card" style="text-align:center;color:var(--muted);font-size:12px;">试试提到游戏名称和关键词(月卡、限定、到期、双倍)</div>
      `;
      result.classList.add('show');
      btn.innerHTML=`${ICON.gear} 重新识别`;
      btn.disabled=false;
      return;
    }

    const totalGames=parsed.length;
    const totalPass=parsed.filter(p=>p.fields.some(f=>f.includes('月卡'))).length;
    const totalEvents=parsed.filter(p=>p.fields.some(f=>f.includes('限定')||f.includes('活动')||f.includes('双倍'))).length;

    result.innerHTML=`
      <div class="ar-label">${ICON.check} 识别到 ${totalGames} 款游戏</div>
      <div class="ai-summary">
        <div class="ai-sum-item"><div class="ai-sum-num pink">${totalGames}</div><div class="ai-sum-label">游戏</div></div>
        <div class="ai-sum-item"><div class="ai-sum-num purple">${totalPass}</div><div class="ai-sum-label">月卡</div></div>
        <div class="ai-sum-item"><div class="ai-sum-num" style="color:var(--orange);">${totalEvents}</div><div class="ai-sum-label">活动</div></div>
      </div>
      ${parsed.map(p=>`
        <div class="ar-card">
          <div class="ar-game">
            <div class="arg-icon" style="background:${p.color};">${p.abbr.slice(0,2)}</div>
            <div class="arg-name">${esc(p.name)}</div>
          </div>
          <div class="ar-fields">
            ${p.fields.map(f=>`<div class="ar-field ${f.includes('未领')||f.includes('到期')||f.includes('快')?'warn':''}">${esc(f)}</div>`).join('')}
          </div>
        </div>
      `).join('')}
      <button class="btn btn-primary btn-block" style="margin-top:8px;" data-action="import-ai">${ICON.check} 导入看板</button>
    `;
    result.classList.add('show');
    btn.innerHTML=`${ICON.gear} 重新识别`;
    btn.disabled=false;

    // 存储识别结果供导入使用
    $('#overlayPanel')._aiParsed=parsed;
  },1200);
}

function aiMockParse(text){
  const results=[];
  // 按分号/逗号分割，尽量提取每个游戏的上下文
  const segments=text.split(/[；;]/);
  const gameMap={
    '原神':{name:'原神',abbr:'原神',color:'#4B7BE5',id:'genshin'},
    '星穹铁道':{name:'崩坏：星穹铁道',abbr:'星铁',color:'#9D7FE3',id:'hsr'},
    '星铁':{name:'崩坏：星穹铁道',abbr:'星铁',color:'#9D7FE3',id:'hsr'},
    '恋与深空':{name:'恋与深空',abbr:'深空',color:'#E8587C',id:'lds'},
    '光与夜':{name:'光与夜之恋',abbr:'光夜',color:'#C4661F',id:'ln'},
    '光夜':{name:'光与夜之恋',abbr:'光夜',color:'#C4661F',id:'ln'},
  };

  for(const [key,info] of Object.entries(gameMap)){
    if(results.some(r=>r.id===info.id)) continue; // 去重
    // 找到包含该游戏关键词的文本片段
    const seg=segments.find(s=>s.includes(key))||'';
    const ctx=seg||text; // 如果分割没找到，用全文
    if(!text.includes(key)) continue;
    const fields=[];
      if(ctx.includes('月卡')){
        if(ctx.includes('没领')||ctx.includes('未领')) fields.push('月卡未领');
        else if(ctx.includes('领了')||ctx.includes('已领')) fields.push('月卡已领');
        else fields.push('月卡');
      }
      if(ctx.includes('日常')){
        const m=ctx.match(/(\d+)\s*\/\s*(\d+)/);
        if(m) fields.push(`日常 ${m[1]}/${m[2]}`);
        else if(!ctx.includes('全清')&&!ctx.includes('拉满')) fields.push('日常');
      }
      if(ctx.includes('双倍')) fields.push('双倍掉落');
      if(ctx.includes('限定')||ctx.includes('卡池')) fields.push('限定卡池');
      if(ctx.includes('联动')) fields.push('联动活动');
      if(ctx.includes('到期')||ctx.includes('快')) fields.push('即将到期');
      if(ctx.includes('拉满')||ctx.includes('全清')) fields.push('日常已拉满');
      if(fields.length===0) fields.push('已识别');
      results.push({...info,fields});
  }
  return results;
}

// ===== AI导入：高亮变化 =====
function importAI(){
  const parsed=$('#overlayPanel')._aiParsed||[];
  const changes=[];

  parsed.forEach(p=>{
    const g=GAMES.find(x=>x.id===p.id);
    if(!g) return;
    const change={gameId:p.id,details:[]};

    p.fields.forEach(f=>{
      if(f.includes('月卡未领')&&g.pass.active){
        state.passClaimed[p.id]=false;
        change.details.push('月卡待领');
      }
      if(f.includes('月卡已领')){
        state.passClaimed[p.id]=true;
        change.details.push('月卡已领');
      }
      const m=f.match(/日常\s*(\d+)\/(\d+)/);
      if(m){
        state.dailyDone[p.id]=parseInt(m[1]);
        change.details.push(`日常 ${m[1]}/${m[2]}`);
      }
      if(f.includes('日常已拉满')){
        state.dailyDone[p.id]=g.daily.total;
        change.details.push('日常已拉满');
      }
    });

    if(change.details.length>0) changes.push(change);
  });

  state.aiChanges=changes;
  hideOverlay();
  navigate('today');

  // 滚动到第一张变化的卡片并高亮
  if(changes.length>0){
    setTimeout(()=>{
      const firstCard=document.getElementById(`card-${changes[0].gameId}`);
      if(firstCard){
        firstCard.scrollIntoView({behavior:'smooth',block:'center'});
      }
      // 2秒后移除高亮
      setTimeout(()=>{
        state.aiChanges=[];
        $$('.game-card').forEach(c=>c.classList.remove('highlight-pulse'));
      },2500);
    },400);

    // 显示变化详情
    const detailStr=changes.map(c=>{
      const g=GAMES.find(x=>x.id===c.gameId);
      return `${g?g.name:''}: ${c.details.join('、')}`;
    }).join('；');
    setTimeout(()=>showToast(`已更新：${detailStr}`,3500),800);
  }else{
    showToast('已导入看板!');
  }
}

// ===== 重置演示数据 =====
function resetDemo(){
  initState();
  state.guideShown=false;
  state.onboardStep=0;
  rerenderView();
  updateReminder(state.route);
  showStamp('已重置!');
  setTimeout(()=>showToast('演示数据已恢复初始状态'),500);
}

// ===== 展示模式切换 =====
function toggleZoom(){
  state.zoomMode=!state.zoomMode;
  document.body.classList.toggle('zoom-mode',state.zoomMode);
  const btn=$('#zoomBtn');
  if(btn){
    btn.innerHTML=state.zoomMode?ICON.zoomOut:ICON.zoom;
    btn.setAttribute('aria-label',state.zoomMode?'退出展示模式':'展示模式');
  }
  // 添加浮动退出按钮（不受 transform 影响）
  let floatBtn=$('#zoomExitBtn');
  if(state.zoomMode){
    if(!floatBtn){
      floatBtn=document.createElement('button');
      floatBtn.id='zoomExitBtn';
      floatBtn.className='zoom-exit-btn';
      floatBtn.innerHTML=ICON.close+'<span>退出展示</span>';
      floatBtn.addEventListener('click',toggleZoom);
      document.body.appendChild(floatBtn);
    }
    floatBtn.style.display='flex';
  }else if(floatBtn){
    floatBtn.style.display='none';
  }
}

  const overlay=$('#onboardingOverlay');
  if(!overlay) return;
  const steps=[
    {icon:'check',title:'点击打卡',desc:'在今日页点击数字即可推进日常进度\n拉满后触发盖章动画'},
    {icon:'spark',title:'AI 一句话建档',desc:'点击吉祥物头像\n说一句话自动识别游戏和月卡状态'},
    {icon:'share',title:'生成 Reveal',desc:'在记账页生成分享卡\n一键展示你的游戏战报'},
  ];
  const step=steps[state.onboardStep];
  const isLast=state.onboardStep===steps.length-1;

  overlay.innerHTML=`
    <div class="ob-mask"></div>

function obNext(){
  const steps=3;
  state.onboardStep++;
  if(state.onboardStep>=steps){
    $('#onboardingOverlay').classList.remove('show');
  }else{
    showOnboarding();
  }
}

function obPrev(){
  if(state.onboardStep>0){
    state.onboardStep--;
    showOnboarding();
  }
}

function obSkip(){
  $('#onboardingOverlay').classList.remove('show');
}

// ===== 事件处理 =====
function hideOverlay(){
  $('#overlay').classList.remove('show');
}

function toggleStar(gameId){
  state.starred[gameId]=!state.starred[gameId];
  rerenderView();
  showToast(state.starred[gameId]?'已收藏':'取消收藏');
}

function toggleDaily(gameId){
  const g=GAMES.find(x=>x.id===gameId);
  if(!g) return;
  const cur=state.dailyDone[gameId]||0;
  if(cur<g.daily.total){
    state.dailyDone[gameId]=cur+1;
    if(state.dailyDone[gameId]>=g.daily.total){
      showStamp('拉满!');
      setTimeout(()=>showToast(`${g.name} 今日日常已拉满！`),500);
    }
    rerenderView();
  }else{
    state.dailyDone[gameId]=0;
    rerenderView();
    showToast('已重置进度');
  }
}

function claimPass(gameId){
  if(state.passClaimed[gameId]) return;
  state.passClaimed[gameId]=true;
  showStamp('已领!');
  updateReminder(state.route);
  rerenderView();
  setTimeout(()=>showToast('月卡奖励已领取'),500);
}

function setTone(toneId){
  state.tone=toneId;
  rerenderView();
  updateReminder(state.route);
  const tone=TONES.find(t=>t.id===toneId);
  showToast(`已切换为「${tone.name}」`);
}

function calendarFilter(filter){
  state.calendarFilter=filter;
  $$('.cal-filter').forEach(f=>f.classList.toggle('active',f.dataset.filter===filter));
  $$('.cal-event').forEach(e=>{
    const name=e.querySelector('.ce-name').textContent;
    e.style.display=(filter==='all'||name.includes(filter))?'':'none';
  });
}

// 表单选择
function selectGameChip(gameId){
  $$('.form-game-chip').forEach(c=>c.classList.toggle('selected',c.dataset.id===gameId));
  $('#overlayPanel')._spendData.gameId=gameId;
  updateSpendBtn();
}

function selectTypeChip(typeId,color){
  $$('.form-type-chip').forEach(c=>c.classList.toggle('selected',c.dataset.id===typeId));
  $('#overlayPanel')._spendData.type=typeId;
  $('#overlayPanel')._spendData.typeColor=color;
  updateSpendBtn();
}

// ===== 全局事件委托 =====
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el) return;
  const action=el.dataset.action;
  const id=el.dataset.id;

  switch(action){
    case 'navigate': navigate(id); break;
    case 'toggle-star': e.stopPropagation(); toggleStar(id); break;
    case 'toggle-daily': toggleDaily(id); break;
    case 'claim-pass': claimPass(id); break;
    case 'set-tone': setTone(id); break;
    case 'show-ai': showAIOnboarding(); break;
    case 'show-calendar': showCalendar(); break;
    case 'show-share': showShare(el.dataset.type); break;
    case 'show-add-spending': showAddSpending(); break;
    case 'hide-overlay': hideOverlay(); break;
    case 'ai-parse': aiParse(); break;
    case 'ai-example': $('#aiInput').value=el.dataset.text; break;
    case 'import-ai': importAI(); break;
    case 'cal-filter': calendarFilter(el.dataset.filter); break;
    case 'toast': showToast(id); break;
    case 'reset-demo': resetDemo(); break;
    case 'select-game': selectGameChip(id); break;
    case 'select-type': selectTypeChip(id,el.dataset.color); break;
    case 'quick-amount': $('#spendAmount').value=id; $('#overlayPanel')._spendData.amount=parseInt(id); updateSpendBtn(); break;
    case 'confirm-spend': confirmSpend(); break;
    case 'dismiss-guide': document.querySelector('.guide-bubble')?.remove(); break;
    case 'ob-next': obNext(); break;
    case 'ob-prev': obPrev(); break;
    case 'ob-skip': obSkip(); break;
    case 'save-share': showStamp('已保存!'); setTimeout(()=>showToast('分享卡已保存到相册'),500); break;
    case 'copy-share': showStamp('已分享!'); setTimeout(()=>showToast('分享链接已复制到剪贴板'),500); break;
  }
});

// 头部按钮
document.getElementById('mascotBtn').addEventListener('click',showAIOnboarding);
document.getElementById('calendarBtn').addEventListener('click',showCalendar);
document.getElementById('zoomBtn').addEventListener('click',toggleZoom);

// 提醒条点击
document.getElementById('reminderBanner').addEventListener('click',()=>{
  if(state.route!=='monthly') navigate('monthly');
});

// Tab 切换
document.getElementById('tabBar').addEventListener('click',e=>{
  const item=e.target.closest('.tab-item');
  if(item) navigate(item.dataset.route);
});

// 浮层遮罩点击关闭
document.querySelector('.overlay-mask').addEventListener('click',hideOverlay);

// 状态栏时间
function updateTime(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  $('#statusTime').textContent=`${h}:${m}`;
}
updateTime();
setInterval(updateTime,30000);

// 初始化
navigate('today');

// 首次进入引导
setTimeout(()=>showOnboarding(),500);

</script>
</body>
</html>
