<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山东公考信息检索平台 - 山东省17地市公务员考试信息查询</title>
  <meta name="description" content="提供山东省17个地市公务员考试信息检索服务，包括省考、事业单位、选调生、教师招聘、医疗招聘">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">鲁</div>
        <span class="logo-text">山东公考通</span>
        <span class="logo-sub">| 山东省17地市公考信息检索</span>
      </div>
      <nav class="header-nav">
        <a href="#" class="active">首页</a>
        <a href="#">省考</a>
        <a href="#">事业单位</a>
        <a href="#">选调生</a>
        <a href="#">教师招聘</a>
        <a href="#">医疗招聘</a>
      </nav>
    </div>
  </header>

  <!-- Hero 信息输入区 -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        专注山东省 · 覆盖17个地市 · 智能匹配岗位
      </div>
      <h1 class="hero-title">齐鲁公考 <span class="accent">智能匹配</span></h1>
      <p class="hero-subtitle">输入您的年龄和专业，系统自动为您匹配适合的公考岗位</p>

      <div class="search-container">
        <div class="search-box user-info-box">
          <!-- 城市选择器 -->
          <div class="city-selector" id="citySelector">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span class="city-selector-text placeholder" id="citySelectorText">选择城市</span>
            <svg class="city-selector-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>

            <!-- 城市下拉菜单 -->
            <div class="city-dropdown" id="cityDropdown">
              <div class="city-dropdown-search">
                <input type="text" id="citySearchInput" placeholder="搜索城市名称...">
              </div>
              <div id="cityList"></div>
            </div>
          </div>

          <!-- 年龄输入 -->
          <div class="user-input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <input type="number" class="user-input" id="ageInput" placeholder="年龄" min="18" max="60">
          </div>

          <!-- 专业输入 -->
          <div class="user-input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
            <input type="text" class="user-input" id="majorInput" placeholder="请输入您的专业（如：法学、计算机）">
          </div>

          <!-- 匹配按钮 -->
          <button class="search-btn" id="matchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M9 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-4"/>
              <path d="M9 11V7a3 3 0 0 1 6 0v4"/>
            </svg>
            匹配岗位
          </button>
        </div>

        <!-- 热门专业标签 -->
        <div class="hot-tags">
          <span class="hot-tag" data-major="法学">法学</span>
          <span class="hot-tag" data-major="汉语言文学">汉语言文学</span>
          <span class="hot-tag" data-major="计算机">计算机</span>
          <span class="hot-tag" data-major="会计">会计</span>
          <span class="hot-tag" data-major="经济学">经济学</span>
          <span class="hot-tag" data-major="临床医学">临床医学</span>
          <span class="hot-tag" data-major="教育学">教育学</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 统计概览栏 -->
  <section class="stats-overview">
    <div class="stats-overview-content">
      <div class="stat-overview-item">
        <div class="stat-overview-icon blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div>
          <div class="stat-overview-value" id="totalExams">0</div>
          <div class="stat-overview-label">公考信息（条）</div>
        </div>
      </div>
      <div class="stat-overview-item">
        <div class="stat-overview-icon gold">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div>
          <div class="stat-overview-value" id="totalPositions">0</div>
          <div class="stat-overview-label">招录总人数</div>
        </div>
      </div>
      <div class="stat-overview-item">
        <div class="stat-overview-icon red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div>
          <div class="stat-overview-value" id="applyingExams">0</div>
          <div class="stat-overview-label">报名中（条）</div>
        </div>
      </div>
      <div class="stat-overview-item">
        <div class="stat-overview-icon green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div>
          <div class="stat-overview-value" id="totalCities">0</div>
          <div class="stat-overview-label">覆盖城市</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 主内容区 -->
  <main class="main-container">
    <!-- 侧边筛选栏 -->
    <aside class="sidebar">
      <!-- 城市快速选择 -->
      <div class="city-quick-section">
        <div class="filter-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          山东地市
          <svg class="filter-header-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="city-quick-grid" id="cityQuickGrid"></div>
      </div>

      <!-- 考试类型筛选 -->
      <div class="filter-section">
        <div class="filter-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          考试类型
          <svg class="filter-header-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="filter-body" id="typeFilter"></div>
      </div>

      <!-- 报名状态筛选 -->
      <div class="filter-section">
        <div class="filter-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          报名状态
          <svg class="filter-header-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="filter-body" id="statusFilter"></div>
      </div>

      <!-- 年份筛选 -->
      <div class="filter-section">
        <div class="filter-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          发布年份
          <svg class="filter-header-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="filter-body" id="yearFilter"></div>
      </div>
    </aside>

    <!-- 内容区域 -->
    <section class="content-area">
      <div class="results-header">
        <div class="results-info">
          <div class="results-count" id="resultsCount">共找到 <strong>0</strong> 条公考信息</div>
          <span class="current-city-tag" id="currentCityTag" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span id="currentCityName"></span>
            <button id="clearCityBtn" title="清除城市筛选">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </span>
        </div>
        <div class="sort-select">
          <span>排序：</span>
          <select id="sortSelect">
            <option value="date-desc">最新发布</option>
            <option value="date-asc">最早发布</option>
            <option value="positions-desc">招录人数最多</option>
            <option value="competition-asc">竞争比最低</option>
          </select>
        </div>
      </div>

      <!-- 考试信息列表 -->
      <div class="exam-list" id="examList"></div>
    </section>
  </main>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
