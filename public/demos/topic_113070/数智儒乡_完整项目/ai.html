<body>
  <div class="app">
    <div class="petals" id="petals"></div>
    <nav class="nav-bar">
      <a href="index.html" class="nav-logo"><div class="seal">儒</div><div><div class="title">数智儒乡</div><div class="subtitle">齐鲁文脉</div></div></a>
      <div class="nav-menu">
        <a href="index.html" class="nav-item">首页</a>

    <section class="view ai-view active">
      <div class="ai-header">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div><h2>智者问答</h2><p>智谱大模型 · 知识库核验 · 一问即答</p></div>
          <button class="btn btn-ghost new-chat-btn" onclick="newChat()"><span>新对话</span><span>✦</span></button>
        </div>
      </div>
      <div class="chat-window" id="chat-window"><div class="chat-messages" id="chat-messages"></div></div>
      <div class="suggestions" id="suggestions">
        <div class="suggestion-chip" onclick="quickAsk('什么是仁？')">什么是仁？</div>
        <div class="suggestion-chip" onclick="quickAsk('孔子三十而立是什么意思？')">三十而立</div>
        <div class="suggestion-chip" onclick="quickAsk('己所不欲勿施于人')">己所不欲勿施于人</div>
        <div class="suggestion-chip" onclick="quickAsk('曲阜三孔有哪些？')">曲阜三孔</div>
        <div class="suggestion-chip" onclick="quickAsk('什么是忠恕之道？')">忠恕之道</div>
        <div class="suggestion-chip" onclick="quickAsk('孔子周游列国去了哪里？')">周游列国</div>
      </div>
      <div class="chat-input-area">
        <div class="chat-input-wrap"><textarea class="chat-input" id="chat-input" placeholder="请输入您的问题，与智者对话……" rows="1"></textarea></div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()"><span>问道</span><span>→</span></button>
      </div>
    </section>
    <footer class="footer">
      <div class="seal-large">儒</div><h4>数智儒乡</h4><p>青春传承 · 齐鲁文脉 · 古籍活化</p>
      <div class="quote">"为往圣继绝学，为万世开太平"</div>
      <div class="copyright">© 2026 数智儒乡 · 齐鲁文脉数字化传承项目</div>
    </footer>
