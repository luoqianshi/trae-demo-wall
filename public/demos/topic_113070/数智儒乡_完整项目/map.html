<body>
  <div class="app">
    <div class="petals" id="petals"></div>
    <nav class="nav-bar">
      <a href="index.html" class="nav-logo"><div class="seal">儒</div><div><div class="title">数智儒乡</div><div class="subtitle">齐鲁文脉</div></div></a>

    </nav>
    <section class="view map-view active">
      <div class="section-title"><span class="deco"></span><h2>文化地图</h2><span class="deco"></span><p>山东省全域 · 四十处文化地标</p></div>
      <div class="map-wrapper">
        <div class="map-container" id="map-container">
          <div class="map-legend">
            <div class="legend-title">山东省文化地标图例</div>
            <div class="legend-item"><span class="legend-dot dot-1"></span>世界遗产</div>
            <div class="legend-item"><span class="legend-dot dot-2"></span>博物馆纪念馆</div>
            <div class="legend-item"><span class="legend-dot dot-3"></span>圣贤故居祠庙</div>
            <div class="legend-item"><span class="legend-dot dot-4"></span>古迹遗址书院</div>
            <div class="legend-count" id="legend-count">共 0 处地标</div>
          </div>
        </div>
      </div>
      <div class="map-info-panel" id="map-info-panel" style="display:none;">
        <div class="info-header"><h3 id="info-title">文化地标</h3><button class="close-btn" onclick="closeInfoPanel()">×</button></div>
        <div class="info-meta"><span class="location" id="info-location">📍 山东省</span><span class="type" id="info-type">世界文化遗产</span></div>
        <p id="info-content">点击地图上的标记查看详情。</p>
        <div class="info-stats">
          <div class="stat-item"><div class="stat-num" id="stat-era">—</div><div class="stat-label">始建年代</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-highlight">—</div><div class="stat-label">核心亮点</div></div>
        </div>
        <button class="btn btn-primary" onclick="askAboutPoint()" id="ask-btn">问AI了解更多 →</button>
      </div>
    </section>
    <footer class="footer">
      <div class="seal-large">儒</div><h4>数智儒乡</h4><p>青春传承 · 齐鲁文脉 · 古籍活化</p>
      <div class="quote">"为往圣继绝学，为万世开太平"</div>

    </footer>
