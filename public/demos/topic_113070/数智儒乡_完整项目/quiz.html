<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数智儒乡 · 童蒙试剑</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c0392b' rx='4'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%23f5e6c8' font-family='serif'%3E儒%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <div class="petals" id="petals"></div>
    <nav class="nav-bar">
      <a href="index.html" class="nav-logo"><div class="seal">儒</div><div><div class="title">数智儒乡</div><div class="subtitle">齐鲁文脉</div></div></a>
      <div class="nav-menu">
        <a href="index.html" class="nav-item">首页</a>
        <a href="ai.html" class="nav-item">智者问答</a>
        <a href="timeline.html" class="nav-item">圣迹流年</a>
        <a href="culture.html" class="nav-item">齐鲁文枢</a>
        <a href="map.html" class="nav-item">文化地图</a>
        <a href="quiz.html" class="nav-item active">童蒙试剑</a>
        <a href="route.html" class="nav-item">研学问道</a>
      </div>
    </nav>
    <section class="view active">
      <div class="section-title"><span class="deco"></span><h2>童蒙试剑</h2><span class="deco"></span><p>随机出题 · 自建题库 · 以问促学</p></div>
      <div class="quiz-age-selector">
        <div class="mode-chip active" data-age="primary" onclick="selectQuizAge('primary')">小学组</div>
        <div class="mode-chip" data-age="middle" onclick="selectQuizAge('middle')">中学组</div>
        <div class="mode-chip" data-age="high" onclick="selectQuizAge('high')">高中组</div>
        <div class="mode-chip" data-age="all" onclick="selectQuizAge('all')">全部混合</div>
        <div class="mode-chip custom-chip" onclick="toggleAddQuestion()">+ 加题</div>
      </div>
      <div id="add-q-panel" class="add-q-panel" style="display:none;">
        <div class="add-q-inner">
          <h4 style="font-family:'ZCOOL XiaoWei',serif; letter-spacing:2px; margin-bottom: 12px;">添加新题目</h4>
          <select id="new-q-age" class="add-q-select">
            <option value="primary">小学组</option>
            <option value="middle">中学组</option>
            <option value="high">高中组</option>
          </select>
          <input type="text" id="new-q-title" class="add-q-input" placeholder="题目内容">
          <input type="text" id="new-q-opt0" class="add-q-input" placeholder="选项甲">
          <input type="text" id="new-q-opt1" class="add-q-input" placeholder="选项乙">
          <input type="text" id="new-q-opt2" class="add-q-input" placeholder="选项丙">
          <input type="text" id="new-q-opt3" class="add-q-input" placeholder="选项丁">
          <select id="new-q-answer" class="add-q-select">
            <option value="0">正确答案：甲</option>
            <option value="1">正确答案：乙</option>
            <option value="2">正确答案：丙</option>
            <option value="3">正确答案：丁</option>
          </select>
          <input type="text" id="new-q-explain" class="add-q-input" placeholder="答案解析">
          <div style="display:flex; gap:12px; justify-content:center;">
            <button class="btn btn-ghost" onclick="toggleAddQuestion()">取消</button>
            <button class="btn btn-primary" onclick="addQuestion()">确认添加</button>
          </div>
        </div>
      </div>
      <div class="quiz-container" id="quiz-container">
        <div class="quiz-progress">
          <span id="quiz-progress-text">第 1 题 / 共 0 题</span>
          <span id="quiz-score-text">得分：0</span>
        </div>
        <div id="quiz-body"></div>
      </div>
    </section>
    <footer class="footer">
      <div class="seal-large">儒</div><h4>数智儒乡</h4><p>青春传承 · 齐鲁文脉 · 古籍活化</p>
      <div class="quote">"学而不思则罔，思而不学则殆"</div>
      <div class="copyright">© 2026 数智儒乡 · 齐鲁文脉数字化传承项目</div>
    </footer>
  </div>
  <script src="js/rag.js"></script>
  <script src="js/main-quiz.js"></script>
</body>
</html>
