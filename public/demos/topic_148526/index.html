.modal input, .modal textarea {
  width: 100%; padding: 0.7rem 0.9rem; border-radius: 0.6rem;

}

<script>
(function(){
'use strict';

/* ===== 硅基流动 (SiliconFlow) API 配置 ===== */
var LLM_API_URL = 'https://api.siliconflow.cn/v1/chat/completions';
var LLM_API_KEY = 'sk-YOUR_API_KEY_HERE';
var LLM_MODEL = 'Qwen/Qwen2.5-72B-Instruct';

var SYSTEM_PROMPT = '你叫"声声慢"，是一位老年AI陪伴助手，像亲孙女一样陪奶奶聊天。用户是60-80岁的空巢老人，叫"奶奶"。\n\n你的能力：\n- 帮老人挂号、叫车、点外卖、买菜、交电费、提醒吃药、放歌、讲故事、查天气、记录血压、查药品、紧急联系子女\n- 陪老人聊天，听她讲过去的故事，给予情感陪伴\n- 帮老人录制给家人的留言\n\n回复规则（必须严格遵守）：\n1. 语气亲切温暖，口语化中文，像亲孙女一样，用"呀、呢、啦、哦"等语气词\n2. 每次回复2-4句话，简短自然\n3. 办事时：先复述关键信息，然后问"对吗"请求确认，绝对不要直接执行\n4. 老人说"算了/不要了/取消/停"时：马上停止，说"好的，已取消"\n5. 老人说孤单、想家时：表达关心，陪她聊聊\n6. 老人提到往事时：追问细节（时间、地点、人物、感受）\n7. 办事完成后：告知结果，并说"已同步给小林"\n8. 不要用emoji，不要用markdown格式\n9. 如果收到[场景描述]，请根据场景描述生成对应的回复，不要偏离场景';

/* 统一回复生成器：所有场景都走大模型，保留产品规则 */
function generateReply(scenario, opts, timeStr) {
  var fallback = opts.fallback || '';
  var _userText = opts.userText || '';
  var _intent = opts.intent || null;
  var _slots = opts.slots || (_intent && _intent.slots) || null;
  var msgs = [{ role: 'system', content: SYSTEM_PROMPT }];

  /* 当前场景描述 */
  var sceneDesc = '';
  var intentStr = opts.intent ? JSON.stringify({ type: opts.intent.type, slots: opts.intent.slots }) : '';

  switch (scenario) {
    case 'cancel':
      sceneDesc = '【场景描述】老人刚才说"取消/算了"，请说"好的，已取消"然后结束。语气温和，不要追问，不要劝。1-2句话。';
      break;
    case 'confirm':
      sceneDesc = '【场景描述】老人想要办一件事，请复述关键信息，然后问"对吗"。信息如下：' + intentStr + '。语气亲切，2-3句话。';
      break;
    case 'result': {
      var taskResult = opts.taskResult || {};
      var resultStr = JSON.stringify(taskResult);
      var isFail = taskResult.status === 'fail';
      sceneDesc = '【场景描述】你刚帮奶奶' + (isFail ? '尝试办一件事但没办成' : '办完一件事') + '，以下是任务执行结果的结构化数据：' + resultStr + '\n' +
        (isFail ?
          '请注意：这件事**没有成功**。请根据失败原因，用温和但清晰的语气告诉奶奶**为什么没有办成**，并给出替代方案（如改时间、改地点、换一种方式等），然后问她是否需要这样做。要求：\n1. 解释具体失败原因（医生不上班/号满了/信息不全等），不要说"没成功"这种模糊的话\n2. 给出1-2个可行的替代方案\n3. 用温和的语气，让奶奶感觉"还有办法"\n4. 3-4句话' :
          '请根据这些信息，用温暖亲切的语气告诉奶奶结果。要求：\n1. 把数据转化为口语化的表达，不要直接念JSON\n2. 自然地说"已同步给小林"\n3. 然后问奶奶一个问题（关心感受或聊往事）\n4. 3-4句话'
        );
      break;
    }
    case 'story':
      sceneDesc = '【场景描述】老人想听《' + (opts.book || '三国演义') + '》的故事。请用说书人语气，生动有趣地讲一段经典故事，约300字。讲完后自然地问奶奶一句"您还想听哪一段？"';
      break;
    case 'slot_correction':
      sceneDesc = '【场景描述】老人修改了之前的信息，最新信息：' + JSON.stringify(opts.slots || {}) + '。请复述修改后的信息，然后问"对吗"。2-3句话。';
      break;
    case 'sync':
      sceneDesc = '【场景描述】刚才办完事，请告诉奶奶"已同步给小林了"。信息：' + intentStr + '。1-2句话。';
      break;
    case 'memory_followup':
      sceneDesc = '【场景描述】刚才聊了往事，请自然地追问奶奶更多的细节，比如时间、地点、人物、感受。语气亲切，2-3句话。';
      break;
    case 'legacy':
      sceneDesc = '【场景描述】老人想给家人留言。请温柔地说"好的奶奶，您说吧，我帮您录下来，慢慢说不着急"。2-3句话。';
      break;
    case 'done':
      sceneDesc = '【场景描述】事情处理完了，请告诉奶奶"都处理好了，还有什么需要帮忙的吗？"1-2句话。';
      break;
    case 'bill_child_confirm':
      sceneDesc = '【场景描述】缴费已由子女确认并支付，请告诉奶奶"好啦，小林已经帮您交过去啦，缴费成功，您放心。"2-3句话。';
      break;
    case 'family_upload':
      sceneDesc = '【场景描述】孩子上传了一张照片到家人档案，请告诉奶奶"孩子给您上传了一张照片，快去家人档案看看"。2-3句话。';
      break;
    default:
      sceneDesc = '【场景描述】' + (opts.prompt || '请自然地回复奶奶。');
  }

  msgs.push({ role: 'system', content: sceneDesc });

  /* 传最近2轮历史 */
  var history = S.msgs.slice(-2);
  for (var i = 0; i < history.length; i++) {
    var m = history[i];
    msgs.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text });
  }

  msgs.push({ role: 'user', content: '请按场景描述回复' });

  var _done = false;
  var _replyText = '';
  var _tid = setTimeout(function(){
    if (_done) return;
    _done = true;
    _replyText = fallback;
    addAiMsg(fallback, timeStr);
    speak(fallback);
    /* result 场景（成功或失败）才同步子女 */
    if (scenario === 'result') {
      smartChildSync(_userText, fallback, _intent, _slots);
    }
    if (opts.onDone) opts.onDone(fallback);
  }, 3000);

  callLLM(msgs, function(aiReply) {
    clearTimeout(_tid);
    if (_done) return;
    _done = true;
    _replyText = aiReply;
    addAiMsg(aiReply, timeStr);
    speak(aiReply);
    /* result 场景（成功或失败）才同步子女 */
    if (scenario === 'result') {
      smartChildSync(_userText, aiReply, _intent, _slots);
    }
    if (opts.onDone) opts.onDone(aiReply);
  }, function(err) {
    clearTimeout(_tid);
    if (_done) return;
    _done = true;
    console.log('[LLM] ' + scenario + ' 生成失败:', err, ', fallback');
    _replyText = fallback;
    addAiMsg(fallback, timeStr);
    speak(fallback);
    /* result 场景（成功或失败）才同步子女 */
    if (scenario === 'result') {
      smartChildSync(_userText, fallback, _intent, _slots);
    }
    if (opts.onDone) opts.onDone(fallback);
  });
}

/* 调用通义千问 OpenAI 兼容 API（使用 messages 数组） */
function callLLM(messages, onSuccess, onError) {
  var controller = new AbortController();
  var timeoutId = setTimeout(function() { controller.abort(); }, 20000);

  var body = JSON.stringify({
    model: LLM_MODEL,
    messages: messages,
    max_tokens: 600,
    temperature: 0.5
  });

  fetch(LLM_API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + LLM_API_KEY
    },
    body: body,
    signal: controller.signal
  })
  .then(function(r) {
    clearTimeout(timeoutId);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(data) {
    var text = '';
    if (data.choices && data.choices[0] && data.choices[0].message) {
      text = data.choices[0].message.content;
    }
    if (!text || !text.trim()) throw new Error('返回内容为空');
    onSuccess(text.trim());
  })
  .catch(function(e) {
    clearTimeout(timeoutId);
    onError(e.name === 'AbortError' ? '请求超时' : (e.message || '网络错误'));
  });
}

/* ===== 智能子女同步：让大模型判断是否需要同步、同步什么内容 ===== */
function smartChildSync(userText, aiReply, intent, slots) {
  var syncPrompt = '你是一个后台同步系统。你的任务是判断老人与AI助手的对话是否需要通知子女。\n\n' +
    '===== 必须同步的情况（出现以下任何一种，need_sync必须为true） =====\n' +
    '1. 老人完成了任何具体操作：挂号、打车、叫车、外卖、买菜、缴费、交电费、交水费、设置提醒、记录血压、记录血糖、查药品、打电话、视频通话\n' +
    '2. 老人身体不适：头疼、胸口不舒服、摔跤、摔倒、头晕、恶心、呼吸困难、发烧\n' +
    '3. 老人情绪状态：说孤单、说想念子女、说没人陪、说无聊、情绪低落、哭泣\n' +
    '4. 老人提到紧急情况：起火了、漏水了、停电了、有人敲门、陌生人来访\n' +
    '5. 老人分享珍贵回忆：提到年轻时的工作、提到家人往事、提到老家、提到老照片\n' +
    '\n===== 不需要同步的情况（need_sync必须为false） =====\n' +
    '1. 普通闲聊：问天气、今天天气真好、听歌、听故事、听新闻、讲故事\n' +
    '2. 老人只是确认：对、是的、好、知道了、明白了\n' +
    '3. 老人只是取消：算了、不要了、取消、不用了\n' +
    '4. 老人只是打招呼：你好、在吗、声声慢\n' +
    '\n===== 判断规则 =====\n' +
    '- 只要老人办了任何具体的事（挂号、打车、外卖等），无论AI回复什么，都必须同步\n' +
    '- 只要老人表达了身体不适或情绪问题，无论AI回复什么，都必须同步\n' +
    '- 普通闲聊、确认、取消、打招呼，一律不同步\n' +
    '\n===== 通知内容要求 =====\n' +
    '- message：简短一句话，用"您的母亲"开头，说明具体事项\n' +
    '- type分类：\n' +
    '  event：老人办了具体的事（挂号、打车、外卖、买菜、缴费、设置提醒）\n' +
    '  health：老人记录健康数据或身体不适（血压、血糖、头疼、摔跤）\n' +
    '  emergency：紧急情况（摔倒、起火、陌生人）\n' +
    '  memory：老人分享回忆或往事\n' +
    '  tip：老人情绪低落或想念子女\n' +
    '\n===== 示例 =====\n' +
    '例1：老人说"帮我挂周三上午王医生的号" → {"need_sync":true,"message":"您的母亲在市人民医院心内科挂了周三上午的号","type":"event"}\n' +
    '例2：老人说"帮我叫个车去医院" → {"need_sync":true,"message":"您的母亲叫了一辆车去医院","type":"event"}\n' +
    '例3：老人说"今天血压135/85" → {"need_sync":true,"message":"您的母亲记录了今天的血压：135/85mmHg","type":"health"}\n' +
    '例4：老人说"我想小林了" → {"need_sync":true,"message":"您的母亲今天提到想念您，建议您抽时间联系她","type":"tip"}\n' +
    '例5：老人说"我一个人有点孤单" → {"need_sync":true,"message":"您的母亲今天情绪低落，表达了孤独感","type":"tip"}\n' +
    '例6：老人说"我年轻时在纺织厂上班" → {"need_sync":true,"message":"您的母亲今天分享了年轻时在纺织厂工作的回忆","type":"memory"}\n' +
    '例7：老人说"今天天气真好" → {"need_sync":false,"message":"","type":""}\n' +
    '例8：老人说"对，就这样" → {"need_sync":false,"message":"","type":""}\n' +
    '\n===== 输出格式 =====\n' +
    '只回复一个JSON对象，不要任何其他文字：\n' +
    '{"need_sync": true/false, "message": "通知内容", "type": "event/health/emergency/memory/tip"}';

  var userContent = '老人说的话：' + userText + '\nAI回复：' + aiReply;
  if (intent && intent.type) {
    userContent += '\n意图类型：' + intent.type;
  }
  if (slots && Object.keys(slots).length > 0) {
    userContent += '\n已知信息：' + JSON.stringify(slots);
  }

  var msgs = [
    { role: 'system', content: syncPrompt },
    { role: 'user', content: userContent }
  ];

  callLLM(msgs, function(response) {
    try {
      /* 尝试提取 JSON */
      var jsonStr = response.trim();
      if (jsonStr.indexOf('{') < 0) return;
      jsonStr = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
      var decision = JSON.parse(jsonStr);

      if (decision.need_sync && decision.message) {
        var msg = decision.message;
        var type = decision.type || 'event';

        if (type === 'emergency') {
          /* 紧急情况：红色高亮 */
          addChildEvent('⚠️ ' + msg);
        } else if (type === 'memory') {
          /* 记忆：写入故事册 */
          addChildStory('妈妈的回忆', msg);
        } else if (type === 'health') {
          /* 健康：写入孝心提示 */
          window.addChildTip && window.addChildTip(msg);
        } else {
          /* 默认：写入今日行程 */
          addChildEvent(msg);
        }
        console.log('[smartChildSync] 已同步子女：', msg, '类型:', type);
      } else {
        console.log('[smartChildSync] 大模型判断无需同步');
      }
    } catch(e) {
      console.log('[smartChildSync] JSON解析失败，跳过同步:', e.message);
    }
  }, function(err) {
    console.log('[smartChildSync] 同步判断失败:', err);
  });
}

/* 兼容旧调用：callPollinations → callLLM */
function callPollinations(prompt, systemPrompt, onSuccess, onError) {
  var msgs = [{ role: 'system', content: systemPrompt }];
  var history = S.msgs.slice(-10);
  for (var i = 0; i < history.length; i++) {
    var m = history[i];
    msgs.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text });
  }
  msgs.push({ role: 'user', content: prompt });
  callLLM(msgs, onSuccess, onError);
}

/* 构造 messages 数组 —— 按场景隔离历史，防止大模型被带偏 */
function buildMessages(userText, intent, context) {
  var msgs = [{ role: 'system', content: SYSTEM_PROMPT }];
  var ctx = context || {};

  /* ===== 场景A：任务确认（挂号/打车/外卖等）===== */
  if (ctx.mode === 'confirm') {
    var confirmCtx = '老人刚刚说要';
    switch (intent.type) {
      case 'hospital_registration':
        confirmCtx += '挂号：' + (intent.slots.hospital || '市人民医院') + (intent.slots.department || '心内科') + '，' + (intent.slots.doctor || '某医生') + '，' + (intent.slots.date || '近期') + (intent.slots.period === 'AM' ? '上午' : '下午');
        break;
      case 'call_taxi':
        confirmCtx += '叫车去：' + (intent.slots.destination || '某目的地');
        break;
      case 'food_delivery':
        confirmCtx += '点外卖，口味：' + (intent.slots.cuisine || '清淡');
        break;
      case 'grocery_shopping':
        confirmCtx += '买菜：' + (intent.slots.items || '一些菜');
        break;
      case 'bill_payment':
        confirmCtx += '缴' + (intent.slots.billType || '某') + '费' + (intent.slots.amount ? intent.slots.amount + '元' : '');
        break;
      case 'health_reminder':
        confirmCtx += '设置提醒：' + (intent.slots.medicine || '吃药');
        break;
      case 'audiobook_play':
        confirmCtx += '听《' + (intent.slots.book || '三国演义') + '》的评书';
        break;
      case 'music_play':
        confirmCtx += '听' + (intent.slots.song || '老歌');
        break;
      default:
        confirmCtx += '办一件事';
    }
    msgs.push({ role: 'system', content: '【当前】' + confirmCtx + '。请复述一遍，然后问"对吗"请求老人确认。语气亲切，2-3句话。' });
    msgs.push({ role: 'user', content: userText });
    return msgs;
  }

  /* ===== 场景B：任务执行结果反馈 ===== */
  if (ctx.mode === 'result') {
    msgs.push({ role: 'system', content: '【当前】任务已完成，结果：' + (ctx.result || '已办好') + '。请用温暖亲切的语气告诉奶奶结果，然后自然地问她一个问题（比如关心感受或聊往事）。3-4句话。' });
    msgs.push({ role: 'user', content: '告诉我结果' });
    return msgs;
  }

  /* ===== 场景C：槽位修正后重新确认 ===== */
  if (ctx.mode === 'reconfirm') {
    var slotStr = JSON.stringify(intent.slots || {});
    msgs.push({ role: 'system', content: '【当前】老人修改了信息，最新信息：' + slotStr + '。请复述修改后的信息，然后问"对吗"请求确认。2-3句话。' });
    msgs.push({ role: 'user', content: userText });
    return msgs;
  }

  /* ===== 场景D：日常闲聊 / 记忆 / 情感 ===== */
  /* 传最近2轮历史，避免上下文过长 */
  var history = S.msgs.slice(-2);
  for (var i = 0; i < history.length; i++) {
    var m = history[i];
    msgs.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text });
  }

  /* 如果是明确的意图（非闲聊），注入意图提示 */
  if (intent && intent.type !== 'chat') {
    switch (intent.type) {
      case 'emotion_lonely':
        msgs.push({ role: 'system', content: '【当前】老人提到孤单/想念，请表达关心，陪她聊天。' });
        break;
      case 'memory_work':
      case 'memory_family':
      case 'memory_past':
        msgs.push({ role: 'system', content: '【当前】老人提到了往事，请追问细节（时间、地点、人物、感受）。' });
        break;
      case 'legacy_message':
        msgs.push({ role: 'system', content: '【当前】老人想给家人留言，请引导她说出想说的话。' });
        break;
      case 'weather_query':
        msgs.push({ role: 'system', content: '【当前】老人想查天气，请告诉她天气情况。' });
        break;
      case 'news_read':
        msgs.push({ role: 'system', content: '【当前】老人想听新闻，请简要播报几条新闻。' });
        break;
      case 'music_play':
        msgs.push({ role: 'system', content: '【当前】老人想听' + (intent.slots.song || '老歌') + '，请确认后播放。' });
        break;
    }
  }

  msgs.push({ role: 'user', content: userText });
  return msgs;
}

  } catch(e) {
    console.log('[Speech] start failed:', e.message);
    resetRecordingUI();
    initSpeech();
    scheduleRestart(1000);
  }
}

function initSpeech() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    S.recognition = new SR();
    S.recognition.lang = 'zh-CN';
    S.recognition.continuous = true;
    S.recognition.interimResults = true;

    S.recognition.onresult = function(e) {
      interimTranscript = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          finalTranscript += e.results[i][0].transcript;
        } else {
          interimTranscript += e.results[i][0].transcript;
        }
      }
      var display = finalTranscript + interimTranscript;
      chatInput.value = display;
      /* 语音/视频模式下实时显示字幕 */
      if (S.avMode) {
        avSubUser.textContent = display ? '您：' + display : '';
      }
      /* 语音/视频模式下：检测到新 final 结果自动发送（像豆包一样） */
      if (S.avMode && finalTranscript.length > lastFinalLength) {
        var newText = finalTranscript.substring(lastFinalLength).trim();
        lastFinalLength = finalTranscript.length;
        if (newText) {
          var sendText = newText;
          finalTranscript = '';
          interimTranscript = '';
          lastFinalLength = 0;
          chatInput.value = '';
          if (S.avMode) avSubUser.textContent = '您：' + sendText;
          sendMessage(sendText);
        }
      }
    };

    S.recognition.onstart = function() {
      if (S.avMode) {
        speakFeedback('我在听，您直接说就行');
        var ml = $('avMicLabel');
        if (ml) ml.textContent = '正在听…';
      }
    };

    S.recognition.onend = function() {
      resetRecordingUI();
      var text = (finalTranscript + interimTranscript).trim();
      finalTranscript = '';
      interimTranscript = '';
      lastFinalLength = 0;
      chatInput.value = '';
      if (text) {
        sendMessage(text);
      }
      /* 语音/视频模式下自动重启监听（aborted 不重启） */
      if (S.avMode && S._lastSpeechError !== 'aborted') {
        scheduleRestart(800);
      }
      S._lastSpeechError = null;
    };

    S.recognition.onerror = function(e) {
      S._lastSpeechError = e.error;
      if (e.error === 'aborted') {
        resetRecordingUI();
        return;
      }
      if (e.error === 'no-speech') {
        resetRecordingUI();
        if (S.avMode) {
          speakFeedback('没听到声音，会自动重试');
        }
        return;
      }
      resetRecordingUI();
      if (S.avMode) {
        var errMap = {
          'audio-capture': '麦克风被占用，请关闭其他应用后再试',
          'not-allowed': '请允许使用麦克风',
          'network': '网络不稳定，语音识别需要联网'
        };
        speakFeedback(errMap[e.error] || '语音识别出错，自动重试');
      }
    };
  }
}

function humanizeTTS(text) {
  var t = text;
  /* 在感叹号/问号后增加逗号，模拟呼吸停顿 */
  t = t.replace(/([！？])/, '，$1');
  /* 在长句合适位置插入逗号（每8-12字之间如果没标点就插逗号） */
  t = t.replace(/([^，。！？\n]{10,})([^，。！？\n]{6,})/g, '$1，$2');
  /* 在开头根据语境加语气词 */
  var prefixes = ['噢，', '嗯，', '好嘞，', '您说，'];
  if (!/[噢嗯好].*[，]/.test(t.substring(0, 4))) {
    t = prefixes[Math.floor(Math.random() * prefixes.length)] + t;
  }
  /* 在结尾加温暖收尾 */
  if (!/[呢吧呀哦噢]$/.test(t.trim().slice(-1))) {
    var endings = ['呢。', '哈。', '哈，', '。'];
    t = t.replace(/。$/, endings[Math.floor(Math.random() * endings.length)]);
  }
  return t;
}

/* ===== 豆包 TTS（火山引擎，温柔妈妈音色） ===== */
var DoubaoTTS = (function() {
  var API_URL = 'https://openspeech.bytedance.com/api/v1/tts';
  var APPID = '8572151961';
  var TOKEN = 'xJO3xzFl2S93zC76PdiTEduZngKsh2W3';
  var CLUSTER = 'volcano_tts';
  var VOICE = 'zh_female_wenroumama_uranus_bigtts';
  var _enabled = true;
  var _pending = null;
  var _audioCtx = null;

  function _uuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function _getAudioContext() {
    if (!_audioCtx) {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return _audioCtx;
  }

  function _playMP3(uint8Array, onEnd, onError) {
    try {
      var ctx = _getAudioContext();
      ctx.decodeAudioData(uint8Array.buffer, function(buffer) {
        var src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        _pending = src;
        src.onended = function() {
          _pending = null;
          if (onEnd) onEnd();
        };
        src.start(0);
      }, function(e) {
        _pending = null;
        if (onError) onError('decode');
      });
    } catch(e) {
      if (onError) onError('play');
    }
  }

  function speak(text, onEnd, onError) {
    if (!_enabled) {
      if (onError) onError('disabled');
      return false;
    }

    var payload = {
      app: {
        appid: APPID,
        token: TOKEN,
        cluster: CLUSTER
      },
      user: {
        uid: 'user_' + Date.now()
      },
      audio: {
        voice_type: VOICE,
        encoding: 'mp3',
        speed_ratio: 0.92,
        volume_ratio: 1.0,
        pitch_ratio: 1.0
      },
      request: {
        reqid: _uuid(),
        text: text,
        text_type: 'plain',
        operation: 'query'
      }
    };

    fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer;' + TOKEN
      },
      body: JSON.stringify(payload)
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.code !== 3000) {
        console.log('[DoubaoTTS] API error:', data.code, data.message);
        if (onError) onError('api:' + data.code);
        return;
      }
      if (!data.data) {
        if (onError) onError('empty');
        return;
      }
      /* 解码 base64 */
      var binary = atob(data.data);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      _playMP3(bytes, onEnd, onError);
    })
    .catch(function(err) {
      console.log('[DoubaoTTS] fetch error:', err);
      if (onError) onError('fetch');
    });

    return true;
  }

  function cancel() {
    if (_pending) {
      try { _pending.stop(); } catch(e) {}
      _pending = null;
    }
  }

  function isAvailable() {
    return _enabled && typeof fetch !== 'undefined';
  }

  function disable() { _enabled = false; }
  function enable() { _enabled = true; }

  return {
    speak: speak,
    cancel: cancel,
    isAvailable: isAvailable,
    disable: disable,
    enable: enable,
    VOICE: VOICE
  };
})();

var EdgeTTS = (function() {

    '好的，奶奶',
    '好的，张奶奶',
    '我在听呢',
    '您慢慢说',
    '没听清',
    '已同步给小林',
    '已帮您确认',
    '已为您设置',
    '还有什么需要帮忙的吗',
    '您别着急',
    '我陪着您',
    '记得按时吃药',
    '天气不错',
    '有什么话尽管说'
  ];

  function _isHighFrequency(text) {
    for (var i = 0; i < _highFreqPhrases.length; i++) {
      if (text.indexOf(_highFreqPhrases[i]) >= 0) return true;
    }
    return false;
  }

  function _getCacheKey(text) {
    /* 简单哈希：取前20个字符的Unicode和 */
    var key = text.substring(0, 20);
    var hash = 0;
    for (var i = 0; i < key.length; i++) {
      hash = ((hash << 5) - hash) + key.charCodeAt(i);
      hash |= 0;
    }
    return 'tts_' + hash;
  }

  function _playFromCache(cacheKey, onEnd, onError) {
    var cached = _audioCache[cacheKey];
    if (!cached) return false;
    try {
      _playMP3(cached, onEnd, onError);
      console.log('[EdgeTTS] 缓存命中:', cacheKey);
      return true;
    } catch(e) {
      return false;
    }
  }

  function _saveToCache(cacheKey, uint8Array) {
    if (!cacheKey) return;

    var keys = Object.keys(_audioCache);
    if (keys.length >= 20) {
      delete _audioCache[keys[0]];
    }
    _audioCache[cacheKey] = uint8Array.slice(0);
    console.log('[EdgeTTS] 已缓存:', cacheKey);
  }

  function getAudioCtx() {

  function _escXml(s) {

    if (_fallback) {

    }

    try {
      var ws = new WebSocket(WS_URL + _uuid());

      var timeout = setTimeout(function() {
        ws.close();

          _fallback = true;
          console.log('[EdgeTTS] 连续失败' + _failCount + '次，临时降级到 SpeechSynthesis');
        }
        if (onError) onError('timeout');
      }, 12000);

      ws.onopen = function() {

        _failCount = 0;

          if (msg.indexOf('Path:audio') >= 0) {
            /* 音频数据在二进制消息中，这里忽略文本头 */
            return;

            /* 合成完毕，处理收到的音频数据 */

      };

      ws.onclose = function() {
        clearTimeout(timeout);
      };

      }

      return false;
    }
  }

  function _playMP3(uint8Array, onEnd, onError) {
    try {
      var ctx = getAudioCtx();
      ctx.decodeAudioData(uint8Array.buffer.slice(0), function(buffer) {
        var source = ctx.createBufferSource();
        source.buffer = buffer;
        /* 停止上一段 */
        if (_pending) {
          try { _pending.stop(); } catch(e) {}
        }
        _pending = source;
        source.connect(ctx.destination);
        source.onended = function() {
          _pending = null;
          if (onEnd) onEnd();
        };
        source.start(0);
      }, function(err) {
        if (onError) onError('decode');
      });
    } catch(e) {
      if (onError) onError('play');
    }
  }

  function cancel() {
    if (_pending) {
      try { _pending.stop(); } catch(e) {}
      _pending = null;
    }
  }

  function isAvailable() {
    return _enabled && !_fallback && !!window.WebSocket;

  function enable() { _fallback = false; _failCount = 0; _enabled = true; }

      _failCount = 0;
      _fallback = false;
      console.log('[EdgeTTS] 尝试恢复连接...');
    }
  }, 300000);

  return {
    speak: speak,
    cancel: cancel,
    isAvailable: isAvailable,
    disable: disable,
    enable: enable,
    VOICE: VOICE,
    /* 缓存接口 */
    playFromCache: function(text, onEnd, onError) {
      return _playFromCache(_getCacheKey(text), onEnd, onError);

    isCached: function(text) {

/* ===== TTS 音色选择 ===== */
var _cachedVoice = null; /* 缓存选中的 voice，避免每次重复筛选 */
var _voiceReady = false;

function selectBestVoice() {
  if (_cachedVoice) return _cachedVoice;
  var voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;

  /* 优先级评分表 */
  var best = null;
  var bestScore = -1;
  for (var i = 0; i < voices.length; i++) {
    var v = voices[i];
    var score = 0;
    var name = (v.name || '').toLowerCase();
    var lang = v.lang || '';

    /* 必须是中文 */
    if (lang.indexOf('zh') !== 0 && lang.indexOf('cmn') !== 0) continue;
    score += 10;

    /* 优先女声（更符合"声声慢"人设） */
    if (/female|女|woman|xiaoxiao|xiaoyi|xiaomei|xiaochen|tiantian|yaoyao|sisi|lili|fangfang|xiaorui|xin|zhi|yi|yue/.test(name)) {
      score += 20;
    }
    /* 排除明显男声 */
    if (/male|男|man|daniel|james|david|thomas|mark|google.*male/.test(name)) {
      score -= 15;
    }
    /* 优先带"小"的名字（通常是亲切的女声） */
    if (/小|xiaoxiao|xiaoyi|xiaomei|xiaochen|xiaorui/.test(name)) {
      score += 15;
    }
    /* 优先 Microsoft/本地 TTS（质量更稳定） */
    if (/microsoft|本地|offline/.test(name)) {
      score += 8;
    }
    /* 排除 Google 翻译音（太机械） */
    if (/google.*translate/.test(name)) {
      score -= 20;
    }
    /* 优先 zh-CN 简体中文 */
    if (lang === 'zh-CN' || lang === 'cmn-Hans-CN') {
      score += 5;
    }

    if (score > bestScore) {
      bestScore = score;
      best = v;
    }
  }
  _cachedVoice = best;
  return best;
}

/* voices 异步加载，需要监听 */
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = function() {
    _cachedVoice = null; /* 重新选择 */
    _voiceReady = true;

/* TTS 播报（优先 Edge TTS，降级 SpeechSynthesis） */
function speak(text) {
  var displayText = text.replace(/[•·\n]/g, ' ').replace(/\s+/g, ' ').trim();
  ttsStatus.textContent = '🔊 播报中…';
  /* 语音/视频模式下字幕显示 */
  if (S.avMode) {
    avSubAi.textContent = '声声慢：' + displayText;
    avSubHint.textContent = '';
  }

  var clean = humanizeTTS(text).replace(/[•·\n]/g, ' ').replace(/\s+/g, ' ').trim();
  var ttsDone = function() { ttsStatus.textContent = ''; };

  /* 1. 首选：豆包 TTS（温柔妈妈音色） */
  if (DoubaoTTS.isAvailable()) {
    DoubaoTTS.speak(clean, ttsDone, function(err) {
      console.log('[DoubaoTTS] failed:', err, ', fallback to EdgeTTS');
      /* 2. 豆包失败 → 尝试 EdgeTTS 缓存 */
      if (EdgeTTS.playFromCache(clean, ttsDone, function(e) {
        console.log('[EdgeTTS] 缓存失败:', e);
        _speakFallback(clean);
      })) {
        return;
      }
      /* 3. 缓存未命中 → EdgeTTS 网络请求 */
      if (EdgeTTS.isAvailable()) {
        EdgeTTS.speak(clean, '+0%', '+0Hz', ttsDone, function(e) {
          console.log('[EdgeTTS] failed:', e, ', fallback to SpeechSynthesis');
          _speakFallback(clean);
        });
        return;
      }
      /* 4. 全部失败 → SpeechSynthesis */
      _speakFallback(clean);
    });
    return;
  }

  /* 豆包不可用 → EdgeTTS */
  if (EdgeTTS.playFromCache(clean, ttsDone, function(){})) return;
  if (EdgeTTS.isAvailable()) {
    EdgeTTS.speak(clean, '+0%', '+0Hz', ttsDone, function() { _speakFallback(clean); });
    return;
  }

  /* 最终降级 */
  _speakFallback(clean);
}

/* SpeechSynthesis 降级方案 */
function _speakFallback(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 0.88;   /* 稍慢，像孙女说话 */
  u.pitch = 1.15;  /* 稍高，温柔女声感 */
  u.volume = 1.0;
  u.onend = function(){ ttsStatus.textContent = ''; };
  u.onerror = function(){ ttsStatus.textContent = ''; };
  var voice = selectBestVoice();
  if (voice) u.voice = voice;
  window.speechSynthesis.speak(u);
}

/* 语音/视频模式下：既显示文字又读出来（让老年人听得到） */
function speakFeedback(text) {
  avSubHint.textContent = text;
  var ssmAvatar = $('ssmAvatar');
  if (S.avMode && text) {
    if (text.indexOf('我在听') >= 0) {
      avSubHint.classList.add('listening');
      if (ssmAvatar) ssmAvatar.classList.add('listening');
    }
    /* 先停掉上一段 */
    DoubaoTTS.cancel();
    EdgeTTS.cancel();
    if (window.speechSynthesis) window.speechSynthesis.cancel();

    /* 首选：豆包 TTS */
    if (DoubaoTTS.isAvailable()) {
      DoubaoTTS.speak(text, null, function(err) {
        /* 豆包失败 → EdgeTTS */
        if (EdgeTTS.isAvailable()) {
          EdgeTTS.speak(text, '+0%', '+0Hz', null, null);
        } else if (window.speechSynthesis) {
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN'; u.rate = 0.88; u.pitch = 1.15; u.volume = 1.0;
          var voice = selectBestVoice();
          if (voice) u.voice = voice;
          window.speechSynthesis.speak(u);
        }
      });
      return;
    }

    /* 降级：EdgeTTS */
    if (EdgeTTS.isAvailable()) {
      EdgeTTS.speak(text, '+0%', '+0Hz', null, null);
      return;
    }

    /* 最终降级：SpeechSynthesis */
    if (window.speechSynthesis) {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = 0.88; u.pitch = 1.15; u.volume = 1.0;
      var voice = selectBestVoice();
      if (voice) u.voice = voice;
      window.speechSynthesis.speak(u);
    }
  }
}

/* ===== 取消检测 ===== */
function isCancelPhrase(text) {
  return /^(算了|不要了|取消|停|不用了|就算了|别了|那就不用了)/.test(text.trim());
}

/* ===== 确认检测 ===== */
function isConfirmPhrase(text) {
  return /^(对|是的|嗯|好的|没错|对的对的|嗯嗯|就是这样|对呀|是的呢|好|可以|行)/.test(text.trim());
}

/* ===== 槽位修正检测 ===== */
function detectSlotCorrection(text, pendingIntent) {
  if (!pendingIntent) return null;
  var t = text.trim();
  
  switch (pendingIntent.type) {
    case 'hospital_registration':
      /* 医生修正 */
      var docMatch = t.match(/(不是|换成|改成|改|换成是)(.+?)(医生|大夫)/);
      if (docMatch) {
        var newDoc = docMatch[2].replace(/[的的]/g, '');
        return {
          slots: { doctor: newDoc },
          reply: '噢，记错啦，换成' + newDoc + '医生对吗？'
        };
      }
      /* 日期+上下午组合修正（如"那就周二下午吧"、"改到周四上午"） */
      var comboMatch = t.match(/(那就|那就改|改成|换成|改到|那就)(周[一二三四五六日天])(上午|下午|)/);
      if (comboMatch) {
        var newDate2 = comboMatch[2];
        var newPeriod2 = comboMatch[3] === '上午' ? 'AM' : 'PM';
        return {
          slots: { date: newDate2, period: newPeriod2 },
          reply: '好的，改成' + newDate2 + (newPeriod2 === 'AM' ? '上午' : '下午') + '，其他不变对吗？'
        };
      }
      /* 时间修正（单独改日期） */
      var timeMatch = t.match(/(那就|那就改|换成|改成|改|改到)(周[一二三四五六日天])(?:上午|下午|)/);
      if (timeMatch && !comboMatch) {
        return {
          slots: { date: timeMatch[2] },
          reply: '好的，改成' + timeMatch[2] + '，其他不变对吗？'
        };
      }
      /* 上午/下午修正 */
      var periodMatch = t.match(/(那就|那就改|换成|改成|改|改到)(上午|下午)/);
      if (periodMatch && !comboMatch) {
        var newPeriod = periodMatch[2] === '上午' ? 'AM' : 'PM';
        return {
          slots: { period: newPeriod },
          reply: '好的，改成' + periodMatch[2] + '，其他不变对吗？'
        };
      }
      /* 只说了"周X"（如老人说"周二吧"） */
      var dateOnly = t.match(/^(周[一二三四五六日天])(.*)$/);
      if (dateOnly) {
        return {
          slots: { date: dateOnly[1] },
          reply: '好的，改成' + dateOnly[1] + '，其他不变对吗？'
        };
      }
      break;
      
    case 'call_taxi':
      var destMatch = t.match(/(不是去|换成|改成|去)(.+?)(就行了|吧|呢|，)/);
      if (destMatch) {
        var newDest = destMatch[2];
        return {
          slots: { destination: newDest },
          reply: '好的，改成去' + newDest + '，对吗？'
        };
      }
      break;

    case 'food_delivery':
      var tasteFix = t.match(/(不是|换成|改成|想吃)(清淡|辣|重口|素|荤|甜|咸)/);
      if (tasteFix) {
        return { slots: { preference: tasteFix[2] === '清淡' ? 'light' : 'spicy' }, reply: '好的，改成' + tasteFix[2] + '口味，对吗？' };
      }
      break;

    case 'grocery_shopping':
      var itemFix = t.match(/(不是|换成|改成|加|还要|再买)(.+?)(?:吧|呢|了|，|。|$)/);
      if (itemFix) {
        return { slots: { items: [itemFix[2].trim()] }, reply: '好的，加上' + itemFix[2].trim() + '，对吗？' };
      }
      break;

    case 'music_play':
      var songFix = t.match(/(不是|换成|改成|想听|放)(.+?)(?:吧|呢|了|，|。|$)/);
      if (songFix) {
        return { slots: { song: songFix[2].trim() }, reply: '好的，换成《' + songFix[2].trim() + '》，对吗？' };
      }
      break;
  }
  
  /* 通用"不对，是xxx"模式 */
  var generalFix = t.match(/不对[^是]*是(.+)/);
  if (generalFix) {
    return {
      slots: {},
      reply: '噢，记错啦，' + generalFix[1] + '对吗？您能再说具体一点吗？'
    };
  }
  
  return null;
}

/* ===== 模糊指代消解：将老人的口语化表达转为明确语义 ===== */
function resolveAnaphora(text) {
  var cm = S.contextMemory;
  var resolved = text;

  /* 1. 人名消解 */
  for (var alias in cm.personMap) {
    var regex = new RegExp(alias, 'g');
    resolved = resolved.replace(regex, cm.personMap[alias]);
  }

  /* 2. 药品消解 */
  for (var medAlias in cm.medicineMap) {
    var medRegex = new RegExp(medAlias, 'g');
    resolved = resolved.replace(medRegex, cm.medicineMap[medAlias]);
  }

  /* 3. "那个药" → 上次提到的药 */
  if (/那个药|这药|这瓶药/.test(text) && cm.lastMentioned.medicine) {
    resolved = resolved.replace(/那个药|这药|这瓶药/g, cm.lastMentioned.medicine);
  }

  /* 4. "上次那样" / "像上次" → 恢复上次意图的关键信息 */
  if (/像上次|上次那样|跟上次一样|还像上次/.test(text) && cm.lastMentioned.destination) {
    /* 如果上次是打车，恢复目的地 */
    resolved = resolved.replace(/像上次|上次那样|跟上次一样|还像上次/g, '去' + cm.lastMentioned.destination);
  }

  /* 5. "昨天" → 转换为具体日期（简化处理：昨天=今天的前一天） */
  if (/昨天/.test(text)) {
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    var dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
    var yDayName = dayNames[yesterday.getDay()];
    resolved = resolved.replace(/昨天/g, yDayName);
  }

  /* 6. "老头子"/"老太婆" → 老伴 */
  resolved = resolved.replace(/老头子|老太婆/g, '老伴');

  if (resolved !== text) {
    console.log('[指代消解] "' + text + '" → "' + resolved + '"');
  }
  return resolved;
}

/* 更新上下文记忆：从当前意图中提取实体 */
function updateContextMemory(intent) {
  var cm = S.contextMemory;
  var slots = intent.slots || {};

  if (slots.medicine) cm.lastMentioned.medicine = slots.medicine;
  if (slots.destination) cm.lastMentioned.destination = slots.destination;
  if (slots.doctor) cm.lastMentioned.doctor = slots.doctor;
  if (slots.hospital) cm.lastMentioned.hospital = slots.hospital;
  if (slots.date) cm.lastMentioned.date = slots.date;
  if (slots.childName) cm.lastMentioned.child = slots.childName;

  /* 保存最近3轮对话 */
  cm.recentDialogs.push({
    type: intent.type,
    slots: JSON.parse(JSON.stringify(slots)),
    time: new Date().toISOString()
  });
  if (cm.recentDialogs.length > 3) {
    cm.recentDialogs.shift();
  }
}

/* ===== 意图识别（槽位填充） ===== */
function recognizeIntent(text) {
  var intent = { type: 'chat', slots: {}, confidence: 0.5 };

  /* 挂号 */
  if (/(挂.*号|挂号|挂[号医]|看病|复诊|预约|医院|门诊|看医生)/.test(text)) {
    intent.type = 'hospital_registration';
    intent.confidence = 0.92;
    var dayMatch = text.match(/(周一|周二|周三|周四|周五|周六|周日|今天|明天|后天)/);
    if (dayMatch) intent.slots.date = dayMatch[1];
    var docMatch = text.match(/([王李张刘陈赵周吴孙]医生)/);
    if (docMatch) intent.slots.doctor = docMatch[1];
    if (/上午|早上|am/i.test(text)) intent.slots.period = 'AM';
    else if (/下午|pm/i.test(text)) intent.slots.period = 'PM';
    var deptMatch = text.match(/(心内科|神经科|骨科|内分泌|呼吸科|眼科|口腔|皮肤科|中医)/);
    if (deptMatch) intent.slots.department = deptMatch[1];
    intent.slots.hospital = intent.slots.hospital || '市人民医院';
    intent.slots.department = intent.slots.department || '心内科';
  }
  /* 叫车 */
  else if (/(叫.*车|打车|出租车|滴滴|出门|叫.*出租)/.test(text)) {
    intent.type = 'call_taxi';
    intent.confidence = 0.9;
    var destMatch = text.match(/去(.+?)(?:的|了|，|。|$)/);
    if (destMatch) intent.slots.destination = destMatch[1].trim();
  }
  /* 外卖 */
  else if (/(外卖|点餐|吃饭|饿了|想吃|送餐)/.test(text)) {
    intent.type = 'food_delivery';
    intent.confidence = 0.88;
    if (/清淡|粥|汤/.test(text)) intent.slots.preference = 'light';
    else if (/辣|重口/.test(text)) intent.slots.preference = 'spicy';
  }
  /* 健康提醒 */
  else if (/(吃药|用药|血压|血糖|提醒吃|该吃药|药没吃)/.test(text)) {
    intent.type = 'health_reminder';
    intent.confidence = 0.85;
  }
  /* 留言 */
  else if (/(留言|遗言|告别|道谢|道歉|道爱|道别|嘱咐|最后)/.test(text)) {
    intent.type = 'legacy_message';
    intent.confidence = 0.9;
  }
  /* 记忆：工作 */
  else if (/(厂|工作|上班|车间|同事|退休|单位|纺织)/.test(text)) {
    intent.type = 'memory_work';
    intent.confidence = 0.75;
  }
  /* 记忆：家庭 */
  else if (/(孩子|儿子|女儿|孙子|孙女|老伴|结婚|家里)/.test(text)) {
    intent.type = 'memory_family';
    intent.confidence = 0.75;
  }
  /* 记忆：过去 */
  else if (/(老家|家乡|小时候|当年|以前|年轻|过去|那时|槐花|路车|19\d{2}|20\d{2}年)/.test(text)) {
    intent.type = 'memory_past';
    intent.confidence = 0.78;
  }
  /* 情感：孤独 */
  else if (/(孤单|孤独|寂寞|没人|一个人|无聊|难受|不开心|想他们)/.test(text)) {
    intent.type = 'emotion_lonely';
    intent.confidence = 0.8;
  }
  /* 紧急求助（最高优先级） */
  else if (/(救命|快来|不舒服|突发|摔了|晕倒|疼得厉害|胸口疼|喘不上气|动不了)/.test(text)) {
    intent.type = 'emergency_contact';
    intent.confidence = 0.95;
    var symptomMatch = text.match(/(胸口疼|头晕|喘不上气|摔了|晕倒|动不了|头疼|肚子疼|心慌|发烧)/);
    if (symptomMatch) intent.slots.symptom = symptomMatch[1];
  }
  /* 呼叫子女 */
  else if (/(打电话给|打给|呼叫|找|联系|视频|语音通话).*(小林|儿子|女儿|老伴|老头子|老太婆|孩子|孙|乖女|乖仔)/.test(text) ||
           /(小林|儿子|女儿|老伴|孙).*(在吗|在哪|回来|联系|打电话|视频|通话)/.test(text)) {
    intent.type = 'video_call_child';
    intent.confidence = 0.92;
    var nameMatch = text.match(/(小林|儿子|女儿|老伴|老头子|老太婆|孙子|孙女|乖女|乖仔)/);
    if (nameMatch) intent.slots.childName = nameMatch[1];
  }
  /* 买菜/超市 */
  else if (/(买菜|买点菜|菜市场|超市|火龙果|苹果|青菜|白菜|萝卜|猪肉|鸡肉|海鲜|牛奶|鸡蛋|豆腐|水果|蔬菜|生鲜|送到家)/.test(text)) {
    intent.type = 'grocery_shopping';
    intent.confidence = 0.88;
    var itemMatch = text.match(/(火龙果|苹果|青菜|白菜|萝卜|猪肉|鸡肉|海鲜|牛奶|鸡蛋|豆腐|水果|蔬菜|鱼|虾|猕猴桃|葡萄|香蕉|橘子|橙子|西瓜|草莓|新鲜)/g);
    if (itemMatch) intent.slots.items = itemMatch;
    if (/新鲜/.test(text)) intent.slots.preference = 'fresh';
    intent.slots.store = /菜市场/.test(text) ? '菜市场' : '社区超市';
  }
  /* 水电煤缴费 */
  else if (/(缴费|电费|水费|煤气|天然气|交费|账单|欠费|水电煤|物业费|手机费|话费)/.test(text)) {
    intent.type = 'bill_payment';
    intent.confidence = 0.9;
    if (/电费|电/.test(text)) intent.slots.billType = '电费';
    else if (/水费|水/.test(text)) intent.slots.billType = '水费';
    else if (/煤气|天然气|气/.test(text)) intent.slots.billType = '燃气费';
    else if (/物业费|物业/.test(text)) intent.slots.billType = '物业费';
    else if (/手机费|话费/.test(text)) intent.slots.billType = '话费';
    else intent.slots.billType = '电费';
    var amountMatch = text.match(/(\d+)[\s]*(块|元|块钱)/);
    intent.slots.amount = amountMatch ? amountMatch[1] : '100';
  }
  /* 放歌/戏曲/音乐 */
  else if (/(放歌|放.*歌|唱.*歌|来.*首|听.*歌|播放|音乐|戏曲|京剧|评剧|黄梅戏|越剧|东方红|茉莉花|甜蜜蜜|邓丽君|军港之夜|老歌|民歌|经典|金曲|唱戏|样板戏)/.test(text)) {
    intent.type = 'music_play';
    intent.confidence = 0.9;
    var songMatch = text.match(/(东方红|茉莉花|甜蜜蜜|祝你平安|军港之夜|走进新时代|映山红|南泥湾|洪湖水|小白杨|十五的月亮|在那桃花|边疆的泉水|我的祖国|唱支山歌|太阳最红|邓丽君|郭兰英|宋祖英|李谷一|周璇|蔡琴|样板戏|戏曲|京剧|评剧|黄梅戏|越剧|老歌|民歌)/);
    if (songMatch) intent.slots.song = songMatch[1];
    else intent.slots.song = '老歌';
  }
  /* 听书/评书 */
  else if (/(听书|评书|有声书|讲故事|讲.*故事|说书|相声|小品|广播剧|单田芳|田连元|袁阔成|三国|水浒|红楼|西游|杨家将|岳飞|白眉大侠)/.test(text)) {
    intent.type = 'audiobook_play';
    intent.confidence = 0.88;
    var bookMatch = text.match(/(三国|水浒|红楼|西游|杨家将|岳飞|白眉大侠|隋唐|聊斋|封神|射雕|天龙八部|三体|平凡的世界|活着|围城|骆驼祥子)/);
    if (bookMatch) intent.slots.book = bookMatch[1];
    else intent.slots.book = '三国演义';
  }
  /* 读新闻 */
  else if (/(新闻|今天.*新闻|有什么.*新闻|头条|大事|看报|读报|发生了.*什么|最近.*新闻)/.test(text)) {
    intent.type = 'news_read';
    intent.confidence = 0.85;
  }
  /* 天气查询 */
  else if (/(天气|下雨|降温|降温吗|冷吗|热吗|刮风|晴天|阴天|几度|多少度|带伞|穿什么|温度|空气质量|雾霾)/.test(text)) {
    intent.type = 'weather_query';
    intent.confidence = 0.9;
  }
  /* 血压血糖记录 */
  else if (/(血压|血糖|量血压|测血糖|记录|今天.*血压|今天.*血糖|高压|低压|收缩压|舒张压)/.test(text)) {
    intent.type = 'blood_pressure_record';
    intent.confidence = 0.88;
    var bpMatch = text.match(/(\d{2,3})\s*[\/、]\s*(\d{2,3})/);
    if (bpMatch) {
      intent.slots.systolic = bpMatch[1];
      intent.slots.diastolic = bpMatch[2];
    }
    var sugarMatch = text.match(/(\d+\.?\d*)\s*(?:mmol|毫摩尔)/);
    if (sugarMatch) intent.slots.bloodSugar = sugarMatch[1];
  }
  /* 药品查询 */
  else if (/(药|药品|说明书|副作用|怎么吃|剂量|药量|阿司匹林|降压药|降糖药|他汀|硝苯地平|二甲双胍|胰岛素|这个药|那个药|什么药)/.test(text) && !/(吃药|提醒|挂买药)/.test(text)) {
    intent.type = 'medicine_query';
    intent.confidence = 0.85;
    var medMatch = text.match(/(阿司匹林|降压药|降糖药|他汀|硝苯地平|二甲双胍|胰岛素|头孢|阿莫西林|布洛芬|速效救心丸|丹参滴丸|牛黄清心)/);
    if (medMatch) intent.slots.medicine = medMatch[1];
  }
  /* 社区通知 */
  else if (/(社区|居委会|街道|通知|停水|停电|停气|物业通知|核酸|疫情|防控|小区|邻里|活动|老年大学|广场舞|太极|书法|棋牌)/.test(text)) {
    intent.type = 'community_notice';
    intent.confidence = 0.82;
  }

  return intent;
}

/* ===== 生成确认信息 ===== */
function buildConfirmation(intent) {
  var slots = intent.slots;
  var msg = '好的，我帮您确认一下：';

  switch (intent.type) {
    case 'hospital_registration':
      msg += '您是要在' + (slots.hospital || '市人民医院');
      msg += (slots.department || '心内科');
      if (slots.doctor) msg += '挂' + slots.doctor;
      else msg += '挂号';
      if (slots.date) {
        msg += slots.date;
        if (slots.period === 'AM') msg += '上午';
        else if (slots.period === 'PM') msg += '下午';
      }
      msg += '的号，对吗？';
      break;

    case 'call_taxi':
      if (slots.destination) {
        msg += '您是要叫一辆车去' + slots.destination + '，对吗？';
      } else {
        msg += '您是要叫一辆车，能告诉我您要去哪里吗？';
      }
      break;

    case 'food_delivery':
      if (slots.preference === 'light') {
        msg += '您是想点清淡口味的餐食（比如粥、汤类），对吗？';
      } else if (slots.preference === 'spicy') {
        msg += '您是想点口味重一点的餐食，对吗？';
      } else {
        msg += '您是想点一份外卖，有什么口味偏好吗？';
      }
      break;

    case 'health_reminder':
      msg += '您是要提醒自己按时吃药，对吗？';
      break;

    case 'grocery_shopping':
      if (slots.items && slots.items.length > 0) {
        msg += '您是要买' + slots.items.join('、') + '，对吗？';
      } else {
        msg += '您是要买菜，有什么特别想买的吗？';
      }
      break;

    case 'bill_payment':
      msg += '您是要缴' + (slots.billType || '电费') + '，对吗？';
      break;

    case 'music_play':
      msg += '您是想听' + (slots.song || '老歌') + '，对吗？';
      break;

    case 'audiobook_play':
      msg += '您是想听《' + (slots.book || '三国演义') + '》的评书，对吗？';
      break;

    case 'news_read':
      msg += '您是想听听今天的新闻，对吗？';
      break;

    case 'weather_query':
      msg += '您是想查一下今天的天气，对吗？';
      break;

    case 'blood_pressure_record':
      msg += '您是要记录血压血糖数据，对吗？';
      break;

    case 'medicine_query':
      if (slots.medicine) {
        msg += '您是想了解' + slots.medicine + '的用法和注意事项，对吗？';
      } else {
        msg += '您是想了解药品的用法，对吗？';
      }
      break;

    case 'emergency_contact':
      msg += '您需要紧急求助！我马上联系小林和120，确认吗？';
      break;

    case 'video_call_child':
      msg += '您是要打电话给' + (slots.childName || '小林') + '，对吗？';
      break;

    case 'community_notice':
      msg += '您是想知道社区通知，对吗？';
      break;

    default:
      return null;
  }

  return msg;
}

/* ===== 模拟任务执行 ===== */
/* ===== 任务执行：只处理业务逻辑和副作用，返回结构化数据，不生成回复文案 ===== */
function executeTask(intent) {
  switch (intent.type) {
    case 'hospital_registration':
      return executeRegistration(intent);

    case 'call_taxi':
      /* 缺少目的地 → 需要确认 */
      if (!intent.slots.destination) {
        return { status: 'fail', reason: 'missing_destination', action: '叫车', message: '您想去哪里呢？请告诉我目的地。' };
      }
      return { status: 'success', action: '叫车', destination: intent.slots.destination, eta: '5分钟' };

    case 'food_delivery':
      /* 缺少口味偏好 → 需要确认 */
      if (!intent.slots.preference) {
        return { status: 'fail', reason: 'missing_preference', action: '点外卖', message: '您想吃什么口味的？清淡的、辣的、还是家常的？' };
      }
      return { status: 'success', action: '点外卖', preference: intent.slots.preference, eta: '30分钟' };

    case 'health_reminder':
      /* 缺少药品名 → 需要确认 */
      if (!intent.slots.medicine) {
        return { status: 'fail', reason: 'missing_medicine', action: '设置吃药提醒', message: '您想设什么药的提醒？' };
      }
      return { status: 'success', action: '设置吃药提醒', medicine: intent.slots.medicine };

    case 'grocery_shopping':
      return { status: 'success', action: '买菜', items: intent.slots.items || ['时令蔬菜'], store: intent.slots.store || '社区超市', eta: '30分钟' };

    case 'bill_payment':
      addChildConfirm('bill_' + Date.now(), '代缴' + (intent.slots.billType || '电费') + '申请', '母亲申请代缴' + (intent.slots.billType || '电费') + ' ' + (intent.slots.amount || '100') + ' 元');
      return { status: 'success', action: '缴费', billType: intent.slots.billType || '电费', amount: intent.slots.amount || '100' };

    case 'music_play':
      return { status: 'success', action: '播放音乐', song: intent.slots.song || '甜蜜蜜' };

    case 'audiobook_play':
      return { status: 'success', action: '讲故事', book: intent.slots.book || '三国演义' };

    case 'news_read':
      return { status: 'success', action: '播报新闻' };

    case 'weather_query':
      return { status: 'success', action: '查询天气' };

    case 'blood_pressure_record':
      /* 缺少血压数值 → 需要确认 */
      if (!intent.slots.systolic || !intent.slots.diastolic) {
        return { status: 'fail', reason: 'missing_reading', action: '记录血压', message: '您今天的血压是多少？请告诉我收缩压和舒张压，比如"135/85"。' };
      }
      return { status: 'success', action: '记录血压', systolic: intent.slots.systolic, diastolic: intent.slots.diastolic };

    case 'medicine_query':
      /* 缺少药名 → 需要确认 */
      if (!intent.slots.medicine) {
        return { status: 'fail', reason: 'missing_medicine_name', action: '查询药品', message: '您想了解哪种药？请告诉我药名。' };
      }
      return { status: 'success', action: '查询药品', medicine: intent.slots.medicine };

    case 'emergency_contact':
      return { status: 'success', action: '紧急呼叫', emergency: true };

    case 'video_call_child':
      /* 缺少子女名 → 需要确认 */
      if (!intent.slots.childName) {
        return { status: 'fail', reason: 'missing_child_name', action: '视频通话', message: '您想给谁打视频？是小林还是其他人？' };
      }
      return { status: 'success', action: '视频通话', childName: intent.slots.childName };

    case 'community_notice':
      return { status: 'success', action: '查询社区通知' };

    default:
      return null;
  }
}

/* 挂号执行 */
function executeRegistration(intent) {
  var slots = intent.slots;
  var doc = slots.doctor;
  var date = slots.date;
  var period = slots.period;
  var dept = slots.department || '心内科';
  var hospital = slots.hospital || '市人民医院';

  /* 无医生名 → 直接成功 */
  if (!doc) {
    return { status: 'success', hospital: hospital, dept: dept, doctor: null, date: date, period: period, fee: 15 };
  }

  var schedule = doctorSchedule[doc];
  /* 未配置排班 → 直接成功 */
  if (!schedule) {
    return { status: 'success', hospital: hospital, dept: dept, doctor: doc, date: date, period: period, fee: 15 };
  }

  var daySchedule = schedule.schedule[date];
  if (!daySchedule) {
    return { status: 'success', hospital: hospital, dept: dept, doctor: doc, date: date, period: period, fee: 15 };
  }

  /* 检查医生是否上班 */
  var isWorking = false;
  if (period === 'AM' && daySchedule.AM) isWorking = true;
  if (period === 'PM' && daySchedule.PM) isWorking = true;
  if (!period && (daySchedule.AM || daySchedule.PM)) isWorking = true;

  if (!isWorking) {
    var alternatives = [];
    var days = ['周一','周二','周三','周四','周五','周六','周日'];
    for (var i = 0; i < days.length; i++) {
      var d = days[i];
      var ds = schedule.schedule[d];
      if (ds.AM) alternatives.push(d + '上午');
      if (ds.PM) alternatives.push(d + '下午');
    }
    return { status: 'fail', reason: 'doctor_not_available', doctor: doc, date: date, alternatives: alternatives.slice(0, 3) };
  }

  /* 模拟号源（70%概率有号） */
  var hasSlot = Math.random() > 0.3;
  if (hasSlot) {
    var time = period === 'AM' ? '9:30' : '2:00';
    return { status: 'success', hospital: hospital, dept: dept, doctor: doc, date: date, period: period, time: time, fee: 15 };
  } else {
    var altTime = daySchedule.PM ? (date + '下午2:00') : '周四上午9:30';
    return { status: 'fail', reason: 'slot_full', doctor: doc, date: date, period: period, alternative_time: altTime };
  }
}

/* ===== 语音/视频模式控制 ===== */
function enterAVMode(mode) {
  S.avMode = mode;
  S.avSeconds = 0;
  S.avMuted = false;
  avOverlay.classList.add('open');
  avBody.classList.toggle('video-active', mode === 'video');

  if (mode === 'voice') {
    avTitle.textContent = '声声慢 · 语音模式';
    avatarGlow.style.display = 'none';
    videoSelf.style.display = 'none';
  } else {
    avTitle.textContent = '声声慢 · 视频模式';
    avatarGlow.style.display = 'block';
    videoSelf.style.display = 'grid';
  }

  avSubUser.textContent = '';
  avSubAi.textContent = '';
  avSubHint.textContent = '欢迎播报中…';
  avTimer.textContent = '00:00';
  startAVTimer();

  /* 欢迎播报 */
  var welcome = mode === 'video'
    ? '张奶奶，我在呢。您看着我，有什么话尽管说。'
    : '张奶奶，我在听呢。您慢慢说。';
  avSubAi.textContent = '声声慢：' + welcome;
  speak(welcome);

  /* 欢迎说完后自动开始持续监听（像豆包一样） */
  scheduleRestart(3000);
}

function exitAVMode() {
  if (S.avTimer) {
    clearInterval(S.avTimer);
    S.avTimer = null;
  }
  /* 退出时取消所有 pending restart */
  if (avRestartTimer) {
    clearTimeout(avRestartTimer);
    avRestartTimer = null;
  }
  /* 退出时若正在录音，强制停止 */
  if (S.isRecording && S.recognition) {
    try { S.recognition.abort(); } catch(e) {}
    resetRecordingUI();
  }
  S.avMode = null;
  S.avSeconds = 0;
  avOverlay.classList.remove('open');
  avBody.classList.remove('video-active');
  window.speechSynthesis.cancel();
}

function startAVTimer() {
  if (S.avTimer) clearInterval(S.avTimer);
  S.avTimer = setInterval(function() {
    S.avSeconds++;
    var m = String(Math.floor(S.avSeconds / 60)).padStart(2, '0');
    var s = String(S.avSeconds % 60).padStart(2, '0');
    avTimer.textContent = m + ':' + s;
  }, 1000);
}

function toggleAVMute() {
  S.avMuted = !S.avMuted;
  var btn = $('avMuteBtn');
  var label = $('avMuteLabel');
  if (S.avMuted) {
    btn.textContent = '🔇';
    btn.title = '取消静音';
    if (label) label.textContent = '取消静音';
    window.speechSynthesis.cancel();
  } else {
    btn.textContent = '🔊';
    btn.title = '静音';
    if (label) label.textContent = '静音';
  }
}

/* ===== 记忆提取引擎 ===== */
function extractMemory(text, intentType) {
  var tags = [];
  var category = '日常';
  var emotion = 'Neutral';

  var yearMatch = text.match(/(19\d{2}|20\d{2})\s*年/);
  if (yearMatch) tags.push(yearMatch[1] + '年');
  var dayMatch = text.match(/(周一|周二|周三|周四|周五|周六|周日)/);
  if (dayMatch && intentType !== 'hospital_registration') tags.push(dayMatch[1]);

  var places = ['纺织厂','工厂','车间','老家','家乡','医院','学校','村里','城里','街道','路口'];
  for (var i = 0; i < places.length; i++) {
    if (text.indexOf(places[i]) >= 0) tags.push(places[i]);
  }

  var routeMatch = text.match(/(\d+)\s*路车/);
  if (routeMatch) tags.push(routeMatch[1] + '路车');

  var objects = ['槐花','槐树','收音机','老照片','缝纫机','自行车','广播','粮票','布票'];
  for (var j = 0; j < objects.length; j++) {
    if (text.indexOf(objects[j]) >= 0) tags.push(objects[j]);
  }

  var people = ['老伴','老王','老李','师傅','同事','邻居','孩子','儿子','女儿','孙子','孙女'];
  for (var k = 0; k < people.length; k++) {
    if (text.indexOf(people[k]) >= 0) tags.push(people[k]);
  }

  if (intentType === 'memory_work') { category = '工作'; emotion = 'Nostalgic'; }
  else if (intentType === 'memory_family') { category = '家庭'; emotion = 'Warm'; }
  else if (intentType === 'memory_past') { category = '回忆'; emotion = 'Nostalgic'; }
  else if (intentType === 'emotion_lonely') { category = '情感'; emotion = 'Lonely'; }
  else if (intentType === 'hospital_registration') { category = '健康'; emotion = 'Neutral'; }
  else if (intentType === 'food_delivery') { category = '日常'; emotion = 'Neutral'; }

  if (tags.length === 0) {
    var sentences = text.split(/[，。！？、]/);
    for (var m = 0; m < sentences.length; m++) {
      var s = sentences[m].trim();
      if (s.length > 2 && s.length < 12) { tags.push(s); break; }
    }
  }

  var embedding = [];
  var hash = 0;
  for (var n = 0; n < text.length; n++) {
    hash = ((hash << 5) - hash + text.charCodeAt(n)) | 0;
  }
  for (var p = 0; p < 128; p++) {
    hash = ((hash * 1103515245 + 12345) & 0x7fffffff);
    embedding.push(parseFloat(((hash % 2000) / 1000 - 1).toFixed(4)));
  }

  S.memSeq++;
  var now = new Date();
  return {
    id: 'mem_' + String(S.memSeq).padStart(5, '0'),
    timestamp: now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0'),
    raw_text: text,
    embedding: embedding,
    tags: tags,
    emotion: emotion,
    category: category
  };
}

/* ===== 故事册自动生成 ===== */
function tryGenerateStory() {
  var clusters = {};
  for (var i = 0; i < S.memories.length; i++) {
    var m = S.memories[i];
    if (!clusters[m.category]) clusters[m.category] = [];
    clusters[m.category].push(m);
  }

  var chapterTitles = {
    '工作': '工作的岁月',
    '家庭': '家的记忆',
    '回忆': '走过的路',
    '情感': '心里的声音',
    '健康': '身体的日子',
    '日常': '平凡的日子'
  };

  var existingCats = S.stories.map(function(s){ return s.category; });
  for (var cat in clusters) {
    if (clusters[cat].length >= 2 && existingCats.indexOf(cat) < 0) {
      var mems = clusters[cat];
      var fragments = mems.map(function(m){ return m.raw_text; });
      var storyText = '那年' + (mems[0].tags.filter(function(t){ return /\d{4}年/.test(t); })[0] || '从前') + '，';
      storyText += fragments[0];
      if (fragments.length > 1) storyText += '。' + fragments[1];
      storyText += '。这些片段拼凑出一段珍贵的' + cat + '记忆，值得被永远记住。';

      S.stories.push({
        title: chapterTitles[cat] || cat + '的故事',
        text: storyText,
        category: cat,
        memCount: mems.length,
        date: new Date().getMonth()+1 + '月' + new Date().getDate() + '日'
      });
    }
  }
}

/* ===== 核心消息处理（状态机 + Pollinations AI） ===== */
function processMessage(text) {
  S.processing = true;

  var now = new Date();
  var timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  /* --- 状态：等待确认 --- */
  if (S.fsmState === STATE_WAITING_CONFIRM) {
    if (isCancelPhrase(text)) {
      S.fsmState = STATE_IDLE;
      S.pendingIntent = null;
      S.pendingSlots = null;
      S.processing = false;
      renderDefaultSuggestions();
      generateReply('cancel', { userText: text, intent: S.pendingIntent, fallback: '好的，已取消。有什么需要随时跟我说。' }, timeStr);
      chatInput.focus();
      return;
    }

    if (isConfirmPhrase(text)) {
      var intent = S.pendingIntent;
      var slots = S.pendingSlots;
      S.fsmState = STATE_IDLE;
      S.pendingIntent = null;
      S.pendingSlots = null;

      setTimeout(function(){
        /* ===== 讲故事：不走硬编码，直接调用大模型生成故事内容 ===== */
        if (intent.type === 'audiobook_play') {
          var storyMsgs = [
            { role: 'system', content: SYSTEM_PROMPT },
            { role: 'user', content: '请用说书人的口吻，给奶奶讲一段《' + (intent.slots.book || '三国演义') + '》中的经典故事。语气生动有趣，像评书一样。控制在300字左右。' }
          ];
          callLLM(storyMsgs, function(story) {
            addAiMsg(story, timeStr);
            speak(story);
            /* 讲完后用大模型引导回忆 */
            setTimeout(function(){
              generateReply('memory_followup', { fallback: '您觉得这一段怎么样？还喜欢听吗？' }, timeStr);
            }, 4000);
            S.processing = false;
            renderDefaultSuggestions();
            chatInput.focus();
          }, function(err) {
            console.log('[LLM] 故事生成失败:', err, ', fallback');
            var fallback = '为您播放单田芳播讲的《' + (intent.slots.book || '三国演义') + '》，声音洪亮，故事精彩。';
            addAiMsg(fallback, timeStr);
            speak(fallback);
            S.processing = false;
            renderDefaultSuggestions();
            chatInput.focus();
          });
          return;
        }

        var taskResult = executeTask(intent);
        if (taskResult) {
          /* 任务执行后（成功或失败）→ 统一用 result 场景 */
          generateReply('result', {
            userText: text,
            intent: intent,
            taskResult: taskResult,
            fallback: taskResult.status === 'fail'
              ? '这件事没办成，' + (taskResult.reason === 'doctor_not_available' ? '医生那天不上班' : taskResult.reason === 'slot_full' ? '号已经满了' : '出了点问题') + '。您看要不要换个时间？'
              : '好的，已经帮您办好了。还有什么需要帮忙的吗？'
          }, timeStr);
          S.processing = false;
          /* 失败时保持确认状态，等待老人选择替代方案 */
          if (taskResult.status === 'fail') {
            S.fsmState = STATE_WAITING_CONFIRM;
            S.pendingIntent = intent;
            S.pendingSlots = slots || {};
            renderConfirmSuggestions();
          } else {
            renderDefaultSuggestions();
          }
          chatInput.focus();
        } else {
          generateReply('done', { userText: text, intent: intent, fallback: '好的，处理完了。还有什么需要帮忙的吗？' }, timeStr);
        }
        S.processing = false;
        renderDefaultSuggestions();
        chatInput.focus();
      }, 400);
      return;
    }

    /* 检测是否为槽位修正（如"不对，是李医生"、"换成下午"） */
    var correction = detectSlotCorrection(text, S.pendingIntent);
    if (correction) {
      /* 修正槽位，保持确认状态 */
      Object.assign(S.pendingSlots, correction.slots);
      generateReply('slot_correction', {
        userText: text,
        intent: S.pendingIntent,
        slots: S.pendingSlots,
        fallback: correction.reply
      }, timeStr);
      S.processing = false;
      chatInput.focus();
      return;
    }

    /* 非取消、非确认、非修正 → 当作新意图重新处理 */
    S.fsmState = STATE_IDLE;
    S.pendingIntent = null;
    S.pendingSlots = null;
  }

  /* --- 状态：空闲 --- */
  /* 1. 模糊指代消解：将口语化表达转为明确语义 */
  var resolvedText = resolveAnaphora(text);

  /* 2. 意图识别 */
  var intent = recognizeIntent(resolvedText);

  /* 3. 更新上下文记忆 */
  updateContextMemory(intent);

  /* 留言意图 */
  if (intent.type === 'legacy_message') {
    generateReply('legacy', { userText: text, intent: intent, fallback: '好的，您说吧，我帮您录下来，慢慢说不着急。' }, timeStr);
    S.processing = false;
    return;
  }

  /* 任务意图：通过 API 生成确认话术，走确认流程 */
  var isTaskIntent = ['hospital_registration','call_taxi','food_delivery','health_reminder','audiobook_play','music_play','grocery_shopping'].indexOf(intent.type) >= 0;
  if (isTaskIntent) {
    /* 先用硬编码兜底确保老人一定能收到回复 */
    var fallbackConfirm = buildConfirmation(intent);
    var msgs = buildMessages(text, intent, { mode: 'confirm' });
    /* 设置超时：如果 API 3秒内没响应，立即用 fallback */
    var llmTimeout = false;
    var timeoutId = setTimeout(function(){
      llmTimeout = true;
      if (fallbackConfirm) {
        S.fsmState = STATE_WAITING_CONFIRM;
        S.pendingIntent = intent;
        S.pendingSlots = intent.slots;
        renderConfirmSuggestions();
        addAiMsg(fallbackConfirm, timeStr);
        speak(fallbackConfirm);
        /* 确认阶段不同步子女，等执行后再同步 */
      }
      S.processing = false;
    }, 3000);
    callLLM(msgs, function(aiReply) {
      clearTimeout(timeoutId);
      if (llmTimeout) return; /* 超时已处理，忽略迟到的 API 响应 */
      S.fsmState = STATE_WAITING_CONFIRM;
      S.pendingIntent = intent;
      S.pendingSlots = intent.slots;
      renderConfirmSuggestions();
      addAiMsg(aiReply, timeStr);
      speak(aiReply);
      /* 确认阶段不同步子女，等执行后再同步 */
      S.processing = false;
    }, function(err) {
      clearTimeout(timeoutId);
      if (llmTimeout) return;
      console.log('[LLM] 确认消息生成失败:', err, ', fallback');
      if (fallbackConfirm) {
        S.fsmState = STATE_WAITING_CONFIRM;
        S.pendingIntent = intent;
        S.pendingSlots = intent.slots;
        renderConfirmSuggestions();
        addAiMsg(fallbackConfirm, timeStr);
        speak(fallbackConfirm);
        /* 确认阶段不同步子女，等执行后再同步 */
      }
      S.processing = false;
    });
    return;
  }

  /* 缴费意图：直接发给子女确认，不走老人端确认 */
  if (intent.type === 'bill_payment') {
    var amount = intent.slots.amount || '100';
    var billType = intent.slots.billType || '电费';
    addChildConfirm('bill_' + Date.now(), '代缴' + billType + '申请', '母亲申请代缴' + billType + ' ' + amount + ' 元');
    generateReply('confirm', {
      userText: text,
      intent: { type: 'bill_payment', slots: { billType: billType, amount: amount } },
      fallback: '好的，已经发给孩子确认啦，您稍等。',
      onDone: function(){
        S.processing = false;
        renderDefaultSuggestions();
      }
    }, timeStr);
    return;
  }

  /* 其他意图：调用通义千问 API（带意图上下文） */
  var msgs = buildMessages(text, intent);
  /* 简单兜底文本，确保老人一定能收到回复 */
  var fallbackReply = '嗯，我在听呢，您继续说。';
  var _llmDone = false;
  var _fallbackId = setTimeout(function(){
    if (_llmDone) return;
    _llmDone = true;
    handleReply(text, intent, fallbackReply, timeStr, false);
  }, 3000);
  callLLM(msgs, function(aiReply) {
    clearTimeout(_fallbackId);
    if (_llmDone) return;
    _llmDone = true;
    handleReply(text, intent, aiReply, timeStr, true);
  }, function(err) {
    clearTimeout(_fallbackId);
    if (_llmDone) return;
    _llmDone = true;
    console.log('[LLM] 对话回复失败:', err, ', fallback');
    handleReply(text, intent, fallbackReply, timeStr, false);
  });
}

/* 统一处理回复 */
function handleReply(userText, intent, aiText, timeStr, fromAPI) {
  var now = new Date();
  var tStr = timeStr || (String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'));

  /* ===== 大模型智能判断是否同步子女 ===== */
  smartChildSync(userText, aiText, intent, intent.slots);

  var capturedMemory = null;
  if (!fromAPI && ['memory_work','memory_family','memory_past','emotion_lonely','chat'].indexOf(intent.type) >= 0) {
    /* fallback 模式已提取记忆 */
    capturedMemory = S.memories[0] || null;
  } else if (fromAPI) {
    /* API 模式：提取记忆 */
    if (['memory_work','memory_family','memory_past','emotion_lonely','chat'].indexOf(intent.type) >= 0) {
      capturedMemory = extractMemory(userText, intent.type);
      S.memories.unshift(capturedMemory);
      tryGenerateStory();
    }
  }

  addAiMsg(aiText, tStr, capturedMemory);
  speak(aiText);

  /* 基于上下文的记忆引导发问 — 用大模型生成 */
  var followUp = intent && (intent.type.indexOf('memory') >= 0 || intent.type === 'emotion_lonely');
  if (followUp) {
    setTimeout(function(){
      generateReply('memory_followup', { fallback: '奶奶，您能跟我说说那时候的事吗？' }, tStr);
    }, 2500);
  }

  /* 记忆收录后语音通知（让老年人听得到） */
  if (capturedMemory && S.avMode) {
    setTimeout(function(){
      var memNote = '我记下了您说的' + (capturedMemory.category || '这件事') + '。';
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(memNote);
        u.lang = 'zh-CN'; u.rate = 0.9;
        window.speechSynthesis.speak(u);
      }
    }, 1000);
  }

  /* 记忆收录 → 子女端联动（金色抛物线动效已在 updateDrawerBadge 中触发） */
  if (capturedMemory) {
    var storyTitle = capturedMemory.category === '工作' ? '纺织厂的青春岁月' :
                     capturedMemory.category === '家庭' ? '温暖的家庭回忆' :
                     capturedMemory.category === '过去' ? '那些年的事儿' : '珍贵记忆';
    var storyText = capturedMemory.raw_text ? capturedMemory.raw_text.substring(0, 60) + '…' : '妈妈今天分享了她的故事，声声慢帮她记录下来啦。';
    addChildStory(storyTitle, storyText);
  }

  updateDrawerBadge();
  if (drawer.classList.contains('open')) {
    renderDrawerContent();
  }

  /* 孝心提示 → 子女端 */
  maybeAddChildTip(intent);

  S.processing = false;
  if (S.fsmState !== STATE_WAITING_CONFIRM) {
    renderDefaultSuggestions();
  }
  chatInput.focus();
}

function calculateProfileProgress() {
  var keys = ['basicInfo', 'hometown', 'career', 'family', 'hobbies', 'youth'];
  var labels = {
    basicInfo: '基本信息', hometown: '家乡', career: '工作经历',
    family: '家庭', hobbies: '爱好', youth: '青春岁月'
  };
  var collected = [];
  var count = 0;
  for (var k = 0; k < keys.length; k++) {
    if (S.profileProgress[keys[k]]) {
      count++;
      collected.push(labels[keys[k]]);
    }
  }
  return {
    percent: Math.round(count / keys.length * 100),
    collected: collected.length > 0 ? collected : ['暂无']
  };
}

        break;
      case 'confirm':
        html += '<div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.5rem;">⏳ 待您确认</div>';
        if (childPendingConfirms.length === 0) {
          html += '<div style="font-size:0.8rem;color:var(--muted);text-align:center;padding:1rem;">暂时没有待确认的支出申请</div>';
        } else {
          for (var pi = 0; pi < childPendingConfirms.length; pi++) {
            var pc = childPendingConfirms[pi];
            html += '<div class="child-confirm-box" data-confirm-id="' + pc.id + '">';
            html += '<div class="confirm-title">💰 ' + pc.title + '</div>';
            html += '<div class="confirm-desc">' + pc.desc + '</div>';
            html += '<div class="child-confirm-btns">';
            html += '<button class="reject" data-action="reject" data-id="' + pc.id + '">拒绝</button>';
            html += '<button class="approve" data-action="approve" data-id="' + pc.id + '">同意并支付</button>';
            html += '</div></div>';
          }
        }
        break;
      case 'tips':
        html += '<div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.5rem;">💡 孝心提示</div>';
        if (childTips.length === 0) {
          html += '<div style="font-size:0.8rem;color:var(--muted);text-align:center;padding:1rem;">暂无新的孝心提示</div>';
        } else {
          for (var ti = 0; ti < childTips.length; ti++) {
            var tip = childTips[ti];
            html += '<div class="child-notify-card tip">' + tip.text + '<div class="notify-time">' + tip.time + '</div></div>';
          }
        }
        break;
      case 'upload':
        html += '<div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.5rem;">📤 上传回忆</div>';
        html += '<div class="child-upload-form" id="childUploadForm">';
        html += '<label>给妈妈说句话（可选）</label>';
        html += '<textarea id="childUploadCaption" placeholder="比如：今天带孙子去动物园了，小孙子喂长颈鹿可开心了……" maxlength="200"></textarea>';
        html += '<label>配一张老照片或近照</label>';
        html += '<div class="child-upload-preview" id="childUploadPreview">';
        html += '<span class="preview-icon">🖼️</span>';
        html += '<span class="preview-text">点击选择一张照片（模拟）</span>';
        html += '</div>';
        html += '<input type="file" id="childUploadFile" accept="image/*" style="display:none">';
        html += '<button class="child-upload-submit" id="childUploadSubmit" disabled>📤 上传到声声慢</button>';
        html += '</div>';
        break;
    }
    childPhoneContent.innerHTML = html;

    /* 绑定确认按钮事件 */
    var confirmBtns = childPhoneContent.querySelectorAll('.child-confirm-btns button');
    for (var cb = 0; cb < confirmBtns.length; cb++) {
      confirmBtns[cb].addEventListener('click', function(){
        var action = this.getAttribute('data-action');
        var id = this.getAttribute('data-id');
        var pcIdx = -1;
        for (var p = 0; p < childPendingConfirms.length; p++) {
          if (childPendingConfirms[p].id === id) { pcIdx = p; break; }
        }
        if (pcIdx >= 0) {
          var pcItem = childPendingConfirms[pcIdx];
          childPendingConfirms.splice(pcIdx, 1);
          if (action === 'approve') {
            /* 老人端收到反馈 */
            var now = new Date();
            var tStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            generateReply('bill_child_confirm', { fallback: '好啦奶奶，小林已经帮您交过去啦！缴费成功，您放心。' }, tStr);
          }
          renderChildTab('confirm');
        }
      });
    }

    /* 加载上传表单事件 */
    if (childActiveTab === 'upload') {
      bindUploadEvents();
    }
  }

  /* 绑定上传表单事件 */
  function bindUploadEvents() {
    var uploadPreview = $('childUploadPreview');
    var uploadFile = $('childUploadFile');
    var uploadCaption = $('childUploadCaption');
    var uploadSubmit = $('childUploadSubmit');
    if (!uploadPreview || !uploadFile || !uploadCaption || !uploadSubmit) return;

    /* 移除旧的监听器（用新函数替换） */
    var newPreview = uploadPreview.cloneNode(true);
    uploadPreview.parentNode.replaceChild(newPreview, uploadPreview);
    uploadPreview = newPreview;

    var newFile = uploadFile.cloneNode(true);
    uploadFile.parentNode.replaceChild(newFile, uploadFile);
    uploadFile = newFile;

    var newCaption = uploadCaption.cloneNode(true);
    uploadCaption.parentNode.replaceChild(newCaption, uploadCaption);
    uploadCaption = newCaption;

    var newSubmit = uploadSubmit.cloneNode(true);
    uploadSubmit.parentNode.replaceChild(newSubmit, uploadSubmit);
    uploadSubmit = newSubmit;

    var selectedFile = null;

    /* 点击预览区触发文件选择 */
    uploadPreview.addEventListener('click', function(){
      uploadFile.click();
    });

    /* 文件选择后显示预览 */
    uploadFile.addEventListener('change', function(){
      if (this.files && this.files[0]) {
        selectedFile = this.files[0];
        var reader = new FileReader();
        reader.onload = function(e){
          uploadPreview.innerHTML = '<img src="' + e.target.result + '" alt="预览">';
          uploadPreview.classList.add('has-image');
          uploadSubmit.disabled = false;
        };
        reader.readAsDataURL(this.files[0]);
      }
    });

    /* 输入框内容变化时启用/禁用提交按钮 */
    uploadCaption.addEventListener('input', function(){
      if (selectedFile || this.value.trim()) {
        uploadSubmit.disabled = false;
      } else {
        uploadSubmit.disabled = true;
      }
    });

    /* 提交上传 */
    uploadSubmit.addEventListener('click', function(){
      var caption = uploadCaption.value.trim();
      var now = new Date();
      var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      var timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

      /* 生成模拟图片 URL */
      var photoUrl = '';
      if (selectedFile) {
        /* 使用实际选择的图片 */
        var tmpReader = new FileReader();
        tmpReader.onload = function(ev){
          finishUpload(ev.target.result, caption, dateStr, timeStr);
        };
        tmpReader.readAsDataURL(selectedFile);
      } else {
        /* 没有图片，用占位色块 */
        var colors = ['#6f8f72','#d96b32','#4a6fa5','#b8956a','#c0796a'];
        var color = colors[Math.floor(Math.random() * colors.length)];
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="' + color + '"/><text x="100" y="110" text-anchor="middle" fill="white" font-size="14">📸 回忆</text></svg>';
        photoUrl = 'data:image/svg+xml,' + encodeURIComponent(svg);
        finishUpload(photoUrl, caption, dateStr, timeStr);
      }

      function finishUpload(url, cap, dStr, tStr) {
        /* 添加到家人档案 */
        S.profileProgress.photos.push({
          url: url,
          caption: cap || '来自孩子的回忆',
          date: dStr
        });

        /* 更新家人档案角标 */
        $('familyBadge').textContent = S.profileProgress.photos.length;
        $('familyBadge').style.display = 'inline-block';

        /* 通知老人端 — 有一条新上传 */
        var displayText = cap ? '孩子传来了一张照片：「' + cap + '」' : '孩子上传了一张新的回忆照片';
        generateReply('family_upload', { fallback: '孩子给您上传了一张照片，快去家人档案看看。' }, tStr);

        /* 显示成功界面 */
        uploadSubmit.disabled = true;
        uploadPreview.innerHTML = '<span class="preview-icon">🖼️</span><span class="preview-text">点击选择一张照片（模拟）</span>';
        uploadPreview.classList.remove('has-image');
        uploadCaption.value = '';
        selectedFile = null;

        childPhoneContent.innerHTML =
          '<div class="child-upload-success">' +
          '<div class="success-icon">✅</div>' +
          '<div class="success-text">回忆已上传到声声慢 🎉</div>' +
          '<div class="success-detail">妈妈打开「家人档案」就能看到</div>' +
          '</div>';

        /* 更新抽屉内容 */
        if (drawer.classList.contains('open')) renderDrawerContent();
      }
    });
  }

  /* 数据存储 */
  var childTodayEvents = [];
  var childStoryCards = [];
  var childTips = [];

  /* 通知红点 */
  function childNotify() {
    childNotifyCount++;
    childNotifyDot.classList.add('show');
    childPhoneToggle.classList.add('has-notify');
  }

  /* 添加今日行程 */
  window.addChildEvent = function(text) {
    var now = new Date();
    var tStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    childTodayEvents.unshift({ text: text, time: tStr });
    if (childTodayEvents.length > 10) childTodayEvents.pop();
    childNotify();
    if (childActiveTab === 'status' && childPhonePanel.classList.contains('open')) {
      renderChildTab('status');
    }
  };

  /* 添加记忆故事 */
  window.addChildStory = function(title, text) {
    var now = new Date();
    var tStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    childStoryCards.unshift({ title: title, text: text, time: tStr });
    if (childStoryCards.length > 10) childStoryCards.pop();
    childNotify();
    if (childActiveTab === 'memory' && childPhonePanel.classList.contains('open')) {
      renderChildTab('memory');
    }
  };

  /* 添加待确认 */
  window.addChildConfirm = function(id, title, desc) {
    childPendingConfirms.push({ id: id, title: title, desc: desc });
    childNotify();
    if (childActiveTab === 'confirm' && childPhonePanel.classList.contains('open')) {
      renderChildTab('confirm');
    }
  };

  /* 添加孝心提示 */
  window.addChildTip = function(text) {
    var now = new Date();
    var tStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    childTips.unshift({ text: text, time: tStr });
    if (childTips.length > 10) childTips.pop();
    childNotify();
    if (childActiveTab === 'tips' && childPhonePanel.classList.contains('open')) {
      renderChildTab('tips');
    }
  };

  /* 加载 TTS 语音列表 */
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
  }

  /* 回车发送 */
  chatInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') {
      sendMessage(chatInput.value);
      chatInput.value = '';
      micBtn.textContent = '🎤';
      micBtn.style.background = 'var(--bg2)';
      micBtn.style.color = 'var(--accent)';
      micBtn.style.borderColor = 'var(--accent)';
    }
  });

  /* 输入框有内容时麦克风变发送按钮 */
  chatInput.addEventListener('input', function(){
    if (chatInput.value.trim()) {
      micBtn.textContent = '发送';
      micBtn.style.background = 'var(--accent)';
      micBtn.style.color = '#fff';
      micBtn.style.borderColor = 'var(--accent)';
    } else {
      micBtn.textContent = '🎤';
      micBtn.style.background = 'var(--bg2)';
      micBtn.style.color = 'var(--accent)';
      micBtn.style.borderColor = 'var(--accent)';
    }
  });

  /* 麦克风按钮（聊天模式）：有内容时发送，否则启动语音 */
  micBtn.addEventListener('click', function(){
    if (chatInput.value.trim()) {
      sendMessage(chatInput.value.trim());
      chatInput.value = '';
      micBtn.textContent = '🎤';
      micBtn.style.background = 'var(--bg2)';
      micBtn.style.color = 'var(--accent)';
      micBtn.style.borderColor = 'var(--accent)';
      return;
    }
    if (!S.recognition) {
      alert('您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器体验语音功能。');
      return;
    }
    if (S.isRecording) {
      /* 先尝试优雅停止，若 500ms 内未触发 onend 则强制 abort */
      var stopStart = Date.now();
      try { S.recognition.stop(); } catch(e) {}
      setTimeout(function(){
        if (S.isRecording && Date.now() - stopStart >= 400) {
          try { S.recognition.abort(); } catch(e) {}
          resetRecordingUI();
        }
      }, 500);
      return;
    }
    /* 开始新录音前清空之前的结果 */
    finalTranscript = '';
    interimTranscript = '';
    chatInput.value = '';
    try {
      S.recognition.start();
      S.isRecording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹';
      /* 60 秒超时保护，防止忘关 */
      recordTimer = setTimeout(function(){
        if (S.isRecording) {
          try { S.recognition.stop(); } catch(e) {}
        }
      }, 60000);
    } catch(e) {
      /* Chrome 常见 bug：前一次未正确结束导致 start 抛错，重建对象 */
      console.log('[Speech] start failed, reinitializing:', e.message);
      resetRecordingUI();
      initSpeech();
      if (S.avMode) {
        avSubHint.textContent = '语音识别启动失败，请再点一次试试';
      }
    }
  });

  /* 语音模式按钮 */
  voiceModeBtn.addEventListener('click', function(){
    enterAVMode('voice');
  });

  /* 视频模式按钮 */
  videoModeBtn.addEventListener('click', function(){
    enterAVMode('video');
  });

  /* 字号调节 */
  var fontLevels = [16, 18, 20, 22, 24];
  var currentFontLevel = 1; // 默认18px
  $('fontInc').addEventListener('click', function(){
    if (currentFontLevel < fontLevels.length - 1) {
      currentFontLevel++;
      document.documentElement.style.fontSize = fontLevels[currentFontLevel] + 'px';
    }
  });
  $('fontDec').addEventListener('click', function(){
    if (currentFontLevel > 0) {
      currentFontLevel--;
      document.documentElement.style.fontSize = fontLevels[currentFontLevel] + 'px';
    }
  });

  /* 语音/视频模式 - 返回聊天 */
  $('avBackBtn').addEventListener('click', exitAVMode);

  /* 语音/视频模式 - 大麦克风按钮（重启自动监听） */
  avMicBtn.addEventListener('click', function(){
    if (!S.recognition) {
      alert('您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器体验语音功能。');
      return;
    }
    /* 如果正在监听，先停止再重启（重置状态） */
    if (S.isRecording) {
      try { S.recognition.abort(); } catch(e) {}
      resetRecordingUI();
      speakFeedback('重新准备中');
      finalTranscript = '';
      interimTranscript = '';
      lastFinalLength = 0;
      scheduleRestart(500);
      return;
    }
    /* 手动重启监听 */
    finalTranscript = '';
    interimTranscript = '';
    lastFinalLength = 0;
    startAVListening();
  });

  /* 语音/视频模式 - 静音按钮 */
  $('avMuteBtn').addEventListener('click', toggleAVMute);

  /* 语音/视频模式 - 留言按钮 */
  $('avLegacyBtn').addEventListener('click', function(){
    showLegacyModal();
    generateReply('legacy', {
      fallback: '我准备好了。您想对谁说？慢慢说，我帮您录下来。',
      onDone: function(aiReply){
        avSubAi.textContent = '声声慢：' + aiReply;
      }
    }, null);
  });

  /* 建议按钮点击 */
  suggestRow.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-text]');
    if (btn) {
      sendMessage(btn.getAttribute('data-text'));
      chatInput.value = '';
    }
  });

  /* 抽屉开关 */
  drawerToggle.addEventListener('click', function(){
    if (drawer.classList.contains('open')) {
      closeDrawer();
    } else {
      openDrawer();
    }
  });
  drawerClose.addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', closeDrawer);
  drawerHandle.addEventListener('click', closeDrawer);

  /* 抽屉 Tab 切换 */
  document.querySelectorAll('.drawer-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.drawer-tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      S.activeTab = tab.getAttribute('data-tab');
      renderDrawerContent();
    });
  });

  /* 双击屏幕任意位置说话 */
  avBody.addEventListener('dblclick', function(){
    if (!S.avMode) return;
    if (S.isRecording) return; /* 已经在听就不重复触发 */
    if (!S.recognition) { initSpeech(); }
    finalTranscript = '';
    interimTranscript = '';
    lastFinalLength = 0;
    chatInput.value = '';
    avSubUser.textContent = '';
    speakFeedback('我在听，您直接说就行');
    startAVListening();
  });

  /* 翻转手机静音 */
  var lastOrientation = { beta: 0, gamma: 0 };
  window.addEventListener('deviceorientation', function(e) {
    if (!S.avMode) return;
    var beta = e.beta || 0;  /* 前后倾斜 */
    var gamma = e.gamma || 0; /* 左右倾斜 */
    /* 检测手机面朝下（beta > 160 或 beta < -160）或翻转（|gamma| > 150） */
    if (Math.abs(beta) > 160 || Math.abs(gamma) > 150) {
      if (!S.avMuted) {
        toggleAVMute();
        speakFeedback('已静音，翻回来可恢复声音');
      }
    } else if (Math.abs(beta) < 30 && Math.abs(gamma) < 30) {
      if (S.avMuted) {
        toggleAVMute();
        speakFeedback('声音已恢复');
      }
    }
  });
}

/* 启动 */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
</script>

<!-- ===== 子女手机模拟器 ===== -->

  📱
  <span class="notify-dot" id="childNotifyDot"></span>
</button>

<div class="child-phone-panel" id="childPhonePanel">
  <div class="child-phone-header">
    👨‍👩‍👧 子女端 · 小林的手机
    <button class="close-btn" id="childPhoneClose">✕</button>
  </div>
  <div class="child-phone-tabs">
    <button class="active" data-ctab="status">状态</button>
    <button data-ctab="memory">记忆</button>
    <button data-ctab="confirm">待确认</button>
    <button data-ctab="upload">上传</button>
    <button data-ctab="tips">孝心</button>
  </div>
  <div class="child-phone-content" id="childPhoneContent"></div>
</div>

</body>
