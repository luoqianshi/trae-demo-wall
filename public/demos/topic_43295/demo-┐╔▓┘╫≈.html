<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>减肥大作战 - 互动Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0806;color:#FFD700;overflow:hidden;user-select:none}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;position:relative}

/* 顶部状态栏 */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(180deg,#1a1510,#0d0a08);border-bottom:1px solid rgba(255,215,0,0.15);flex-shrink:0;z-index:10}
.topbar-title{font-size:16px;font-weight:bold;color:#FFD700;text-shadow:0 0 8px rgba(255,215,0,0.5)}
.topbar-coins{display:flex;align-items:center;gap:4px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);border-radius:12px;padding:4px 10px}
.topbar-coin-icon{font-size:14px;animation:coinFlip 3s linear infinite}
@keyframes coinFlip{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.topbar-coin-value{font-size:14px;color:#FFD700;font-weight:bold}

/* 页面容器 */
.pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:12px}
.page.active{display:block}
.page::-webkit-scrollbar{width:0}

/* 底部Tab栏 */
.tabbar{display:flex;background:linear-gradient(180deg,#0d0a08,#1a1510);border-top:1px solid rgba(255,215,0,0.2);flex-shrink:0;z-index:10}
.tab{flex:1;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all 0.2s}
.tab-icon{font-size:22px;filter:grayscale(0.5);opacity:0.5;transition:all 0.2s}
.tab-label{font-size:10px;color:rgba(255,215,0,0.5);transition:all 0.2s}
.tab.active .tab-icon{filter:grayscale(0);opacity:1;transform:scale(1.1)}
.tab.active .tab-label{color:#FFD700;font-weight:bold}

/* ============ 战斗页面 ============ */
.battle-stage{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stage-label{font-size:14px;color:rgba(255,215,0,0.7)}
.stage-enemy{display:flex;align-items:center;gap:4px;font-size:14px;color:#ff5252;font-weight:bold}
.combo-badge{position:absolute;top:0;right:12px;background:linear-gradient(135deg,#FFD700,#FF6B35);padding:2px 10px;border-radius:12px;border:1px solid #FFF;font-size:11px;color:#1A1510;font-weight:bold;animation:comboPulse 0.8s ease infinite}
@keyframes comboPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.battle-arena{background:linear-gradient(135deg,rgba(255,179,0,0.08),rgba(255,82,82,0.04));border:2px solid rgba(255,215,0,0.2);border-radius:12px;padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.battle-vs{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero-side,.enemy-side{display:flex;align-items:center;gap:8px}
.hero-side .hero-info,.enemy-side .enemy-info{display:flex;flex-direction:column}
.hero-name{font-size:12px;color:#69f0ae;font-weight:bold}
.enemy-name{font-size:12px;color:#ff5252;font-weight:bold;text-align:right}
.hero-status,.enemy-status{font-size:9px;color:rgba(105,240,174,0.6)}
.enemy-status{color:rgba(255,82,82,0.6);text-align:right}
.vs-icon{font-size:20px;color:#FFD700;animation:vsPulse 1s ease-in-out infinite}
@keyframes vsPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.hero-emoji{font-size:32px;animation:heroIdle 2s ease-in-out infinite}
.enemy-emoji{font-size:32px;animation:enemyIdle 2.5s ease-in-out infinite}
@keyframes heroIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes enemyIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

.progress-section{margin-bottom:8px}
.progress-bar-bg{height:20px;background:rgba(0,0,0,0.4);border-radius:10px;overflow:hidden;border:1px solid rgba(255,215,0,0.2);position:relative}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF6B35);border-radius:10px;transition:width 0.3s;position:relative;box-shadow:0 0 8px rgba(255,215,0,0.5)}
.progress-bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shine 2s linear infinite}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.progress-text{font-size:10px;color:rgba(255,215,0,0.7);text-align:center;margin-top:4px}

.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.15);border-radius:8px;padding:8px;text-align:center}
.stat-emoji{font-size:18px}
.stat-value{font-size:14px;color:#FFD700;font-weight:bold;margin:2px 0}
.stat-label{font-size:9px;color:rgba(255,215,0,0.5)}

.satiety-section{background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.15);border-radius:8px;padding:8px;margin-bottom:10px}
.satiety-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.satiety-label{font-size:12px;color:#FFD700}
.satiety-value{font-size:14px;color:#FFD700;font-weight:bold}
.satiety-bar-bg{height:8px;background:rgba(0,0,0,0.4);border-radius:4px;overflow:hidden}
.satiety-bar-fill{height:100%;border-radius:4px;transition:width 0.3s}

.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.section-title-text{font-size:14px;color:#FFD700;font-weight:bold}
.shop-btn{background:linear-gradient(135deg,#FFD700,#FF6B35);border:1px solid #FFF;border-radius:6px;padding:4px 10px;font-size:11px;color:#1A1510;font-weight:bold;cursor:pointer}

.equip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.equip-slot{background:rgba(255,215,0,0.03);border:2px dashed rgba(255,215,0,0.15);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:100px;cursor:pointer;transition:all 0.2s}
.equip-slot.filled{background:linear-gradient(135deg,rgba(255,215,0,0.1),rgba(255,215,0,0.03));border-style:solid}
.equip-slot:active{transform:scale(0.95)}
.slot-name{font-size:9px;color:rgba(255,215,0,0.5)}
.slot-emoji{font-size:28px;line-height:1}
.slot-item-name{font-size:9px;color:#FFD700;font-weight:bold;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.slot-empty{font-size:9px;color:rgba(255,215,0,0.2)}

.inventory-toggle{background:rgba(255,215,0,0.1);border:2px solid rgba(255,215,0,0.3);border-radius:6px;padding:6px 12px;font-size:12px;color:#FFD700;cursor:pointer;text-align:center;margin-bottom:8px}

.inventory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.inv-item{background:rgba(255,215,0,0.06);border:2px solid #a09880;border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all 0.2s}
.inv-item:active{transform:scale(0.95)}
.inv-emoji{font-size:28px;line-height:1}
.inv-name{font-size:9px;color:#FFD700;font-weight:bold;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.inv-rarity{font-size:8px;padding:1px 6px;border-radius:8px;font-weight:bold;margin-top:2px}
.rarity-common{background:linear-gradient(135deg,#a09880,#a09880bb);color:#1A1510;border:1px solid #a09880}
.rarity-rare{background:linear-gradient(135deg,#64b5f6,#64b5f6bb);color:#1A1510;border:1px solid #64b5f6}
.rarity-epic{background:linear-gradient(135deg,#ce93d8,#ce93d8bb);color:#1A1510;border:1px solid #ce93d8}
.rarity-legendary{background:linear-gradient(135deg,#FFD700,#FFD700bb);color:#1A1510;border:1px solid #FFD700}

.kalili-msg{font-size:11px;color:rgba(255,215,0,0.8);padding:8px;background:rgba(255,215,0,0.05);border-radius:6px;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ 宠物页面 ============ */
.pet-page{display:flex;flex-direction:column;align-items:center;padding:20px 16px}
.pet-creature-area{width:200px;height:200px;display:flex;align-items:center;justify-content:center;position:relative;margin:20px 0}
.pet-aura{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,0.2),rgba(255,215,0,0.05));animation:petAura 3s ease-in-out infinite}
@keyframes petAura{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.1);opacity:0.8}}
.pet-ring{position:absolute;width:110%;height:110%;border:2px solid rgba(255,215,0,0.3);border-radius:50%;animation:petRing 4s linear infinite}
@keyframes petRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.pet-emoji{font-size:100px;animation:petBounce 2s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,215,0,0.6))}
@keyframes petBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.05)}}
.pet-name{font-size:20px;color:#FFD700;font-weight:bold;text-shadow:0 0 8px rgba(255,215,0,0.6);margin-bottom:4px}
.pet-level{font-size:12px;color:rgba(255,215,0,0.7);margin-bottom:12px}
.pet-mood{display:flex;gap:6px;margin-bottom:16px}
.mood-tag{padding:3px 10px;border-radius:12px;font-size:10px;border:1px solid}
.mood-happy{background:rgba(255,215,0,0.15);border-color:rgba(255,215,0,0.4);color:#FFD700}
.mood-energy{background:rgba(105,240,174,0.15);border-color:rgba(105,240,174,0.4);color:#69f0ae}

.pet-exp-section{width:100%;max-width:300px;margin-bottom:16px}
.pet-exp-label{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,215,0,0.7);margin-bottom:4px}
.pet-exp-bar{height:12px;background:rgba(0,0,0,0.4);border-radius:6px;overflow:hidden;border:1px solid rgba(255,215,0,0.2)}
.pet-exp-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF6B35);border-radius:6px;transition:width 0.5s;box-shadow:0 0 6px rgba(255,215,0,0.6)}

.energy-ball{width:100px;height:100px;background:radial-gradient(circle at 30% 30%,#FFD700,#FF6B35);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(255,215,0,0.6),inset 0 -8px 16px rgba(0,0,0,0.3);cursor:pointer;animation:energyPulse 1.5s ease-in-out infinite;margin-bottom:16px}
@keyframes energyPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.energy-value{font-size:24px;font-weight:bold;color:#1A1510}
.energy-label{font-size:9px;color:rgba(26,21,16,0.8);font-weight:bold}

.feed-btn{padding:12px 32px;background:linear-gradient(135deg,#FFD700,#FF6B35);border:2px solid #FFF;border-radius:24px;font-size:14px;color:#1A1510;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(255,215,0,0.4);transition:all 0.2s}
.feed-btn:active{transform:scale(0.95)}

.pet-particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:particleFloat 3s ease-out forwards}
@keyframes particleFloat{0%{transform:translateY(0) scale(0);opacity:0}20%{opacity:1;transform:translateY(-20px) scale(1)}100%{transform:translateY(-80px) scale(0);opacity:0}}

/* ============ 拍照页面 ============ */
.photo-page{padding:16px}
.photo-camera-area{background:linear-gradient(135deg,rgba(255,215,0,0.08),rgba(105,240,174,0.05));border:2px dashed rgba(255,215,0,0.4);border-radius:16px;padding:32px 16px;text-align:center;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden;transition:all 0.2s}
.photo-camera-area:active{transform:scale(0.98)}
.photo-camera-area::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,rgba(255,215,0,0.05),transparent);animation:scanLine 3s linear infinite}
@keyframes scanLine{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.camera-icon{font-size:48px;margin-bottom:8px;display:block;animation:cameraBounce 2s ease-in-out infinite}
@keyframes cameraBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.camera-text{font-size:14px;color:#FFD700;font-weight:bold}
.camera-hint{font-size:10px;color:rgba(255,215,0,0.5);margin-top:4px}

.photo-count{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.15);border-radius:8px;margin-bottom:12px}
.photo-count-label{font-size:11px;color:rgba(255,215,0,0.7)}
.photo-count-value{font-size:13px;color:#FFD700;font-weight:bold}

.photo-result{background:linear-gradient(135deg,rgba(105,240,174,0.1),rgba(255,215,0,0.05));border:1px solid rgba(105,240,174,0.3);border-radius:12px;padding:14px;animation:resultAppear 0.5s ease-out}
@keyframes resultAppear{0%{opacity:0;transform:scale(0.9)}100%{opacity:1;transform:scale(1)}}
.photo-result-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.photo-result-icon{font-size:28px}
.photo-result-name{font-size:15px;color:#69f0ae;font-weight:bold;flex:1}
.photo-result-conf{font-size:9px;color:rgba(105,240,174,0.7);padding:2px 6px;background:rgba(105,240,174,0.15);border-radius:8px}
.photo-result-cal{display:flex;justify-content:space-between;align-items:center;padding:8px;background:rgba(0,0,0,0.3);border-radius:6px;margin-top:8px}
.photo-result-cal-label{font-size:11px;color:rgba(255,215,0,0.6)}
.photo-result-cal-value{font-size:18px;color:#FFD700;font-weight:bold}
.photo-result-effect{margin-top:8px;padding:6px 8px;background:rgba(255,215,0,0.1);border-radius:6px;font-size:10px;color:#FFD700}

.photo-actions{display:flex;gap:8px;margin-top:12px}
.photo-btn{flex:1;padding:12px;border-radius:8px;font-size:12px;font-weight:bold;text-align:center;cursor:pointer;transition:all 0.2s}
.photo-btn:active{transform:scale(0.95)}
.photo-btn-primary{background:linear-gradient(135deg,#FFD700,#FF6B35);color:#1A1510;border:1px solid #FFF}
.photo-btn-secondary{background:rgba(255,215,0,0.1);color:#FFD700;border:1px solid rgba(255,215,0,0.4)}

/* ============ 弹窗 ============ */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:100;animation:overlayIn 0.2s}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.modal{width:90%;max-width:340px;padding:20px 16px;background:linear-gradient(180deg,#2A2118,#1A1510);border:3px solid #FFD700;border-radius:16px;animation:modalIn 0.3s}
@keyframes modalIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:18px;color:#FFD700;font-weight:bold;text-align:center;margin-bottom:16px}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;color:#FFD700;cursor:pointer}

.drop-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.drop-choice{background:rgba(255,215,0,0.06);border:2px solid #a09880;border-radius:10px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.2s}
.drop-choice:active{transform:scale(0.95)}
.drop-emoji{font-size:36px}
.drop-name{font-size:11px;color:#FFD700;font-weight:bold;text-align:center}
.drop-set{font-size:9px;color:rgba(255,215,0,0.6)}

.shop-items{display:flex;flex-direction:column;gap:10px}
.shop-item{background:rgba(255,215,0,0.08);border:2px solid #FFD700;border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer}
.shop-item:active{transform:scale(0.98)}
.shop-item-icon{font-size:28px}
.shop-item-info{flex:1}
.shop-item-name{font-size:14px;color:#FFD700;font-weight:bold}
.shop-item-desc{font-size:11px;color:rgba(255,215,0,0.6)}
.shop-item-cost{display:flex;align-items:center;gap:2px;background:#FFD700;border-radius:6px;padding:4px 8px;font-size:12px;color:#1A1510;font-weight:bold}

.equip-detail-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.equip-detail-icon{font-size:48px}
.equip-detail-name{font-size:18px;color:#FFD700;font-weight:bold}
.equip-detail-tags{display:flex;gap:4px;margin-top:4px}
.equip-stats{background:rgba(255,215,0,0.05);border-radius:8px;padding:12px;margin-bottom:12px}
.equip-stats-title{font-size:12px;color:#FFD700;font-weight:bold;margin-bottom:8px}
.equip-stats-text{font-size:12px;color:rgba(255,215,0,0.8);line-height:1.8}
.equip-set-info{background:rgba(255,215,0,0.05);border-radius:8px;padding:12px;margin-bottom:16px}
.equip-actions{display:flex;gap:8px}
.equip-action{flex:1;padding:10px;border-radius:8px;text-align:center;font-size:13px;font-weight:bold;cursor:pointer}
.btn-equip{background:#FFD700;color:#1A1510}
.btn-unequip{background:#ff5252;color:#FFF}
.btn-discard{background:#666;color:#ccc;border:1px solid #888}

/* 浮动数字 */
.damage-number{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-size:32px;color:#FFD700;font-weight:bold;text-shadow:0 0 12px #FF6B35,2px 2px 0 #1A1510;pointer-events:none;z-index:50;animation:dmgFloat 1.5s ease-out forwards}
@keyframes dmgFloat{0%{transform:translateX(-50%) translateY(0) scale(0.5);opacity:0}20%{transform:translateX(-50%) translateY(-20px) scale(1.3);opacity:1}100%{transform:translateX(-50%) translateY(-100px) scale(0.8);opacity:0}}

.clear-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:90;animation:overlayIn 0.3s}
.clear-content{text-align:center;animation:clearPop 0.5s ease-out}
@keyframes clearPop{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.clear-title{font-size:32px;color:#FFD700;font-weight:bold;text-shadow:0 0 20px rgba(255,215,0,0.8);margin-bottom:8px}
.clear-subtitle{font-size:14px;color:rgba(255,215,0,0.7)}

/* 响应式 */
@media(max-width:380px){
  .equip-grid{gap:4px}
  .slot-emoji{font-size:24px}
  .inv-emoji{font-size:24px}
}
</style>
</head>
<body>
<div id="app">
  <!-- 顶部状态栏 -->
  <div class="topbar">
    <div class="topbar-title">减肥大作战</div>
    <div class="topbar-coins">
      <span class="topbar-coin-icon">🪙</span>
      <span class="topbar-coin-value" id="coinValue">0</span>
    </div>
  </div>

  <!-- 页面区域 -->
  <div class="pages">
    <!-- 战斗页面 -->
    <div class="page active" id="page-battle">
      <div style="position:relative">
        <div class="battle-stage">
          <div class="stage-label">第<span id="stageNum">1</span>层</div>
          <div class="stage-enemy"><span id="enemyEmoji">🍗</span> <span id="enemyName">炸鸡将军</span></div>
        </div>
        <div id="comboBadge" style="display:none" class="combo-badge">连击 x0</div>
      </div>

      <div class="battle-arena">
        <div class="battle-vs">
          <div class="hero-side">
            <div class="hero-emoji">😊</div>
            <div class="hero-info">
              <div class="hero-name">你</div>
              <div class="hero-status">消耗中...</div>
            </div>
          </div>
          <div class="vs-icon">⚔️</div>
          <div class="enemy-side">
            <div class="enemy-info">
              <div class="enemy-name" id="enemyName2">炸鸡将军</div>
              <div class="enemy-status">热量怪物</div>
            </div>
            <div class="enemy-emoji" id="enemyEmoji2">🍗</div>
          </div>
        </div>
        <div class="progress-section">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
          </div>
          <div class="progress-text"><span id="progressText">0 / 300 卡</span> · <span id="progressPct">0%</span></div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-emoji">⚡</div>
          <div class="stat-value" id="metaVal">0.50</div>
          <div class="stat-label">卡/秒</div>
        </div>
        <div class="stat-card">

<script>
// ============ 游戏数据 ============
var EQUIP_SLOTS=["weapon","armor","accessory","boots"];
var SLOT_NAME={weapon:"武器",armor:"护甲",accessory:"饰品",boots:"鞋子"};
var SLOT_EMOJI={weapon:"⚔️",armor:"🛡️",accessory:"💍",boots:"👢"};
var EQUIP_SETS={
  sports:{name:"运动套装",emoji:"🏃",color:"#69f0ae",items:{weapon:{name:"跑步鞋",emoji:"👟",baseBurn:8},armor:{name:"运动衫",emoji:"🎽",baseMeta:0.05},accessory:{name:"计步器",emoji:"⌚",baseEff:0.10},boots:{name:"跑钉鞋",emoji:"👞",baseEff:0.08}},set2:"效率+15%",set4:"自动消耗×1.5"},
  strength:{name:"力量套装",emoji:"💪",color:"#ff5252",items:{weapon:{name:"哑铃",emoji:"🏋️",baseBurn:15},armor:{name:"护腕",emoji:"🦾",baseMeta:0.08},accessory:{name:"蛋白粉",emoji:"🥛",baseBurn:0},boots:{name:"举重鞋",emoji:"🥾",baseBurn:0}},set2:"消耗+25%",set4:"15%暴击2倍"},
  yoga:{name:"瑜伽套装",emoji:"🧘",color:"#ce93d8",items:{weapon:{name:"瑜伽垫",emoji:"🟣",baseBurn:5},armor:{name:"瑜伽服",emoji:"👘",baseMeta:0.10},accessory:{name:"香薰",emoji:"🕯️",baseBurn:0},boots:{name:"赤足",emoji:"🦶",baseEff:0.12}},set2:"代谢+20%",set4:"饱腹下降2倍速"},
  outdoor:{name:"户外套装",emoji:"🏔️",color:"#64b5f6",items:{weapon:{name:"登山杖",emoji:"🥾",baseBurn:12},armor:{name:"冲锋衣",emoji:"🧥",baseMeta:0.06},accessory:{name:"指南针",emoji:"🧭",baseBurn:0},boots:{name:"徒步鞋",emoji:"🥾",baseEff:0.06}},set2:"自律币+2/关",set4:"全属性+10%"},
  food:{name:"美食套装",emoji:"🍳",color:"#FFD700",items:{weapon:{name:"筷子",emoji:"🥢",baseBurn:3},armor:{name:"围裙",emoji:"🦺",baseMeta:0.03},accessory:{name:"食谱",emoji:"📖",baseBurn:0},boots:{name:"厨师鞋",emoji:"👟",baseEff:0.05}},set2:"饱腹增加-30%",set4:"饱腹度上限+20"}
};
var RARITY_LIST=[{id:"common",name:"普通",color:"#a09880",mult:1,chance:0.60,icon:"○"},{id:"rare",name:"稀有",color:"#64b5f6",mult:1.5,chance:0.25,icon:"◆"},{id:"epic",name:"史诗",color:"#ce93d8",mult:2,chance:0.12,icon:"✦"},{id:"legendary",name:"传说",color:"#FFD700",mult:3,chance:0.03,icon:"★"}];
var RARITY_ICON={common:"○",rare:"◆",epic:"✦",legendary:"★"};
var RARITY_ORDER={legendary:4,epic:3,rare:2,common:1};
var ENEMIES=[{name:"炸鸡将军",icon:"🍗"},{name:"奶茶法师",icon:"🧋"},{name:"薯片刺客",icon:"🥔"},{name:"蛋糕巨兽",icon:"🎂"},{name:"火锅领主",icon:"🍲"},{name:"烧烤魔王",icon:"🥩"},{name:"冰淇淋精灵",icon:"🍦"},{name:"巧克力骑士",icon:"🍫"}];
var FOODS=[{name:"红烧肉饭",icon:"🍱",cal:650},{name:"炸鸡套餐",icon:"🍗",cal:520},{name:"奶茶",icon:"🧋",cal:380},{name:"汉堡",icon:"🍔",cal:550},{name:"披萨",icon:"🍕",cal:480},{name:"寿司",icon:"🍣",cal:320},{name:"沙拉",icon:"🥗",cal:150},{name:"面条",icon:"🍜",cal:420}];

// ============ 游戏状态 ============
var state={
  currentStage:1,
  breakthroughCount:0,
  consumedCalories:0,
  baseMetabolism:0.5,
  satiety:0,
  totalCaloriesBurned:0,
  selfDisciplineCoins:0,
  equipped:{weapon:null,armor:null,accessory:null,boots:null},
  inventory:[],
  currentEnemy:ENEMIES[0],
  combo:0,
  comboShowTime:0,
  maxCombo:0,
  isClearing:false,
  dropPending:false,
  dropChoices:[],
  showInventory:false,
  petLevel:1,
  petExp:0,
  petExpMax:100,
  energyCalories:0,
  photoCount:3,
  todayDate:new Date().toDateString()
};

// 初始装备
function genStarterItem(slotType){
  var setKeys=Object.keys(EQUIP_SETS);
  var setId=setKeys[Math.floor(Math.random()*setKeys.length)];
  var itemDef=EQUIP_SETS[setId].items[slotType];
  return{id:"starter_"+Date.now()+"_"+Math.random(),setId:setId,slot:slotType,name:itemDef.name,emoji:itemDef.emoji,rarity:"common",rarityMult:1,rarityColor:"#a09880",rarityName:"普通",burn:itemDef.baseBurn||0,meta:itemDef.baseMeta||0,eff:itemDef.baseEff||0};
}
state.inventory.push(genStarterItem("weapon"));
state.inventory.push(genStarterItem("armor"));

// ============ 工具函数 ============
function b(stageNum,breakthroughNum){return Math.floor((300*stageNum+30*stageNum*stageNum)*(1+0.04*breakthroughNum))}
function pickRandomEnemy(){return ENEMIES[Math.floor(Math.random()*ENEMIES.length)]}
function pickRandomRarity(){var roll=Math.random();var c=0;for(var i=0;i<RARITY_LIST.length;i++){c+=RARITY_LIST[i].chance;if(roll<c)return RARITY_LIST[i]}return RARITY_LIST[0]}
function generateEquipDrop(){
  var setKeys=Object.keys(EQUIP_SETS);
  var setId=setKeys[Math.floor(Math.random()*setKeys.length)];
  var slotType=EQUIP_SLOTS[Math.floor(Math.random()*EQUIP_SLOTS.length)];
  var setData=EQUIP_SETS[setId];
  var itemDef=setData.items[slotType];
  var rarity=pickRandomRarity();
  return{id:Date.now()+"_"+Math.random(),setId:setId,slot:slotType,name:itemDef.name,emoji:itemDef.emoji,rarity:rarity.id,rarityMult:rarity.mult,rarityColor:rarity.color,rarityName:rarity.name,burn:Math.floor((itemDef.baseBurn||0)*rarity.mult*10)/10,meta:Math.floor((itemDef.baseMeta||0)*rarity.mult*1000)/1000,eff:Math.floor((itemDef.baseEff||0)*rarity.mult*1000)/1000};
}
function generateDropChoices(){var c=[];for(var i=0;i<3;i++)c.push(generateEquipDrop());return c}
function fmtNum(n){if(n>=1e4)return(n/1e3).toFixed(1)+"k";return Math.floor(n).toLocaleString()}

function calcTotalStats(){
  var t={burn:0,meta:0,eff:0,coinBonus:0,burnMult:0};
  EQUIP_SLOTS.forEach(function(sk){var eq=state.equipped[sk];if(eq){t.burn+=eq.burn||0;t.meta+=eq.meta||0;t.eff+=eq.eff||0}});
  // 套装加成
  var setCounts={};
  EQUIP_SLOTS.forEach(function(sk){var eq=state.equipped[sk];if(eq)setCounts[eq.setId]=(setCounts[eq.setId]||0)+1});
  Object.keys(setCounts).forEach(function(setId){
    var c=setCounts[setId];var sd=EQUIP_SETS[setId];
    if(c>=2){
      if(setId==="sports")t.eff+=0.15;
      if(setId==="strength")t.burnMult+=0.25;
      if(setId==="yoga")t.meta*=1.2;
      if(setId==="outdoor")t.coinBonus+=2;
    }
    if(c>=4){
      if(setId==="sports")t.burnMult+=0.5;
      if(setId==="outdoor"){t.burn*=1.1;t.meta*=1.1;t.eff*=1.1}
    }
  });
  return t;
}
function calcEfficiency(satiety){var base=satiety<20?0.5+satiety*0.025:1;return Math.max(0.3,Math.min(1,base))}
function calcMetabolism(){return state.baseMetabolism*Math.pow(1.01,state.currentStage-1)}

// ============ 渲染函数 ============
function render(){
  document.getElementById('coinValue').textContent=state.selfDisciplineCoins;
  document.getElementById('stageNum').textContent=state.currentStage;
  document.getElementById('enemyName').textContent=state.currentEnemy.name;
  document.getElementById('enemyName2').textContent=state.currentEnemy.name;
  document.getElementById('enemyEmoji').textContent=state.currentEnemy.icon;
  document.getElementById('enemyEmoji2').textContent=state.currentEnemy.icon;

  var stageTarget=b(state.currentStage,state.breakthroughCount);
  var pct=Math.min(state.consumedCalories/stageTarget*100,100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=fmtNum(state.consumedCalories)+' / '+fmtNum(stageTarget)+' 卡';
  document.getElementById('progressPct').textContent=Math.floor(pct)+'%';

  var totalStats=calcTotalStats();
  var meta=calcMetabolism()*(1+totalStats.meta);
  var eff=calcEfficiency(state.satiety)+totalStats.eff;
  document.getElementById('metaVal').textContent=(meta*eff).toFixed(2);
  document.getElementById('effVal').textContent=Math.floor(eff*100)+'%';
  document.getElementById('totalBurn').textContent=fmtNum(state.totalCaloriesBurned);

  document.getElementById('satietyVal').textContent=Math.floor(state.satiety);
  var satFill=document.getElementById('satietyFill');
  satFill.style.width=state.satiety+'%';
  satFill.style.background=state.satiety<20?'#ff5252':state.satiety<60?'#FFD700':'#69f0ae';

  // 连击
  var comboBadge=document.getElementById('comboBadge');
  if(state.combo>0&&Date.now()-state.comboShowTime<5000){
    comboBadge.style.display='block';
    comboBadge.textContent='连击 x'+state.combo;
  }else{comboBadge.style.display='none'}

  renderEquipGrid();
  renderInventory();
  renderPet();
}

function renderEquipGrid(){
  var grid=document.getElementById('equipGrid');
  grid.innerHTML='';
  EQUIP_SLOTS.forEach(function(sk){
    var eq=state.equipped[sk];
    var div=document.createElement('div');
    div.className='equip-slot'+(eq?' filled':'');
    div.style.borderColor=eq?eq.rarityColor:'';
    if(eq)div.style.boxShadow='0 0 8px '+eq.rarityColor+'44';
    div.onclick=function(){if(eq)showEquipDetail(eq)};
    div.innerHTML='<div class="slot-name">'+SLOT_NAME[sk]+'</div>'+
      '<div class="slot-emoji">'+(eq?eq.emoji:SLOT_EMOJI[sk])+'</div>'+
      (eq?'<div class="slot-item-name">'+eq.name+'</div>':'<div class="slot-empty">空</div>');
    grid.appendChild(div);
  });
}

function renderInventory(){
  document.getElementById('invCount').textContent=state.inventory.length;
  var grid=document.getElementById('inventoryGrid');
  grid.innerHTML='';
  var sorted=state.inventory.slice().sort(function(a,b){return(RARITY_ORDER[b.rarity]||0)-(RARITY_ORDER[a.rarity]||0)});
  if(sorted.length===0){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:16px;color:rgba(255,215,0,0.4);font-size:12px">背包空空如也</div>';
    return;
  }
  sorted.forEach(function(item){
    var div=document.createElement('div');
    div.className='inv-item';
    div.style.borderColor=item.rarityColor;
    div.onclick=function(){showEquipDetail(item)};
    div.innerHTML='<div class="inv-emoji">'+item.emoji+'</div>'+
      '<div class="inv-name">'+item.name+'</div>'+
      '<div class="inv-rarity rarity-'+item.rarity+'">'+RARITY_ICON[item.rarity]+' '+item.rarityName+'</div>';
    grid.appendChild(div);
  });
}

function renderPet(){
  document.getElementById('petLevel').textContent=state.petLevel;
  document.getElementById('petExp').textContent=state.petExp;
  document.getElementById('petExpMax').textContent=state.petExpMax;
  var pct=state.petExp/state.petExpMax*100;
  document.getElementById('petExpFill').style.width=pct+'%';
  document.getElementById('petExpPct').textContent=Math.floor(pct)+'%';
  document.getElementById('energyVal').textContent=state.energyCalories;
}

// ============ 游戏逻辑 ============
function gameTick(){
  if(state.isClearing||state.dropPending)return;
  var totalStats=calcTotalStats();
  var meta=calcMetabolism();
  var eff=calcEfficiency(state.satiety);
  var burnPerSec=meta*eff*(1+totalStats.burnMult)+totalStats.burn*eff;
  state.consumedCalories+=burnPerSec;
  state.totalCaloriesBurned+=burnPerSec;
  state.satiety=Math.max(0,state.satiety-5/3600);
  checkStageClear();
  render();
}

function checkStageClear(){
  if(state.dropPending||state.isClearing)return;
  var stageTarget=b(state.currentStage,state.breakthroughCount);
  if(state.consumedCalories>=stageTarget){
    state.isClearing=true;
    state.combo++;
    state.maxCombo=Math.max(state.maxCombo,state.combo);
    state.comboShowTime=Date.now();

    // 显示伤害数字
    var dmg=document.createElement('div');
    dmg.className='damage-number';
    dmg.textContent='-'+fmtNum(stageTarget);
    document.body.appendChild(dmg);
    setTimeout(function(){dmg.remove()},1500);

    // 显示通关动画
    var overlay=document.createElement('div');
    overlay.className='clear-overlay';
    overlay.innerHTML='<div class="clear-content"><div class="clear-title">击败！</div><div class="clear-subtitle">向下一层进发！</div></div>';
    document.body.appendChild(overlay);

    setTimeout(function(){
      overlay.remove();
      var totalStats=calcTotalStats();
      var coinGain=1+totalStats.coinBonus+Math.floor(state.combo/3);
      state.selfDisciplineCoins+=coinGain;
      state.currentStage++;
      state.consumedCalories=0;
      state.currentEnemy=pickRandomEnemy();
      state.isClearing=false;

      // 100%掉落装备
      state.dropChoices=generateDropChoices();
      state.dropPending=true;
      showDropModal();
      render();
    },1200);
  }
}

function showDropModal(){
  var overlay=document.createElement('div');
  overlay.className='overlay';
  overlay.id='dropOverlay';
  var html='<div class="modal"><div class="modal-title">✨ 发现装备！</div><div style="text-align:center;font-size:11px;color:rgba(255,215,0,0.6);margin-bottom:16px">选择一个装备放入背包</div><div class="drop-choices">';
  state.dropChoices.forEach(function(item,idx){
    html+='<div class="drop-choice" style="border-color:'+item.rarityColor+'" onclick="pickDrop('+idx+')">'+
      '<div class="drop-emoji">'+item.emoji+'</div>'+
      '<div class="drop-name">'+item.name+'</div>'+
      '<div class="inv-rarity rarity-'+item.rarity+'" style="display:inline-block">'+RARITY_ICON[item.rarity]+' '+item.rarityName+'</div>'+
      '<div class="drop-set">'+EQUIP_SETS[item.setId].emoji+' '+EQUIP_SETS[item.setId].name+'</div>'+
      '</div>';
  });
  html+='</div></div>';
  overlay.innerHTML=html;
  document.body.appendChild(overlay);
}

function pickDrop(idx){
  var item=state.dropChoices[idx];
  if(state.inventory.length>=20)state.inventory.shift();
  state.inventory.push(item);
  state.dropPending=false;
  state.dropChoices=[];
  document.getElementById('dropOverlay').remove();
  state.kaliliMsg='获得装备：'+item.emoji+item.name+'！';
  render();
}

function showEquipDetail(item){
  var overlay=document.createElement('div');
  overlay.className='overlay';
  overlay.id='equipDetailOverlay';
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove()};

  var isEquipped=EQUIP_SLOTS.some(function(sk){var eq=state.equipped[sk];return eq&&eq.id===item.id});
  var inInventory=state.inventory.indexOf(item)>=0;

  var stats=[];
  if(item.burn>0)stats.push('消耗+'+item.burn);
  if(item.meta>0)stats.push('代谢+'+item.meta.toFixed(2));
  if(item.eff>0)stats.push('效率+'+Math.floor(item.eff*100)+'%');

  var setData=EQUIP_SETS[item.setId];

  var html='<div class="modal" style="border-color:'+item.rarityColor+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
      '<div style="font-size:18px;color:'+item.rarityColor+';font-weight:bold">装备详情</div>'+
      '<div onclick="document.getElementById(\'equipDetailOverlay\').remove()" style="font-size:24px;color:#FFD700;cursor:pointer">×</div>'+
    '</div>'+
    '<div class="equip-detail-header">'+
      '<div class="equip-detail-icon">'+item.emoji+'</div>'+
      '<div style="flex:1">'+
        '<div class="equip-detail-name" style="color:'+item.rarityColor+'">'+item.name+'</div>'+
        '<div class="equip-detail-tags">'+
          '<div class="inv-rarity rarity-'+item.rarity+'">'+RARITY_ICON[item.rarity]+' '+item.rarityName+'</div>'+
          '<div style="font-size:10px;color:'+setData.color+';font-weight:bold;background:linear-gradient(135deg,'+setData.color+'33,'+setData.color+'11);border:1px solid '+setData.color+'88;padding:3px 10px;border-radius:8px;box-shadow:0 0 6px '+setData.color+'44">'+setData.emoji+' '+setData.name+'</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="equip-stats">'+
      '<div class="equip-stats-title">属性</div>'+
      '<div class="equip-stats-text">'+(stats.join(' ')||'无属性加成')+'</div>'+
    '</div>'+
    '<div class="equip-set-info">'+
      '<div class="equip-stats-title">套装效果 ('+setData.name+')</div>'+
      '<div style="font-size:11px;color:rgba(255,215,0,0.7);line-height:1.8">2件套：'+setData.set2+'<br>4件套：'+setData.set4+'</div>'+
    '</div>'+
    '<div class="equip-actions">';
  if(isEquipped)html+='<div class="equip-action btn-unequip" onclick="unequipItem(\''+item.slot+'\')">卸下</div>';
  if(inInventory)html+='<div class="equip-action btn-equip" onclick="equipItem(\''+item.id+'\')">装备</div>';
  if(inInventory)html+='<div class="equip-action btn-discard" onclick="discardItem(\''+item.id+'\')">丢弃</div>';
  html+='</div></div>';
  overlay.innerHTML=html;
  document.body.appendChild(overlay);
}

function equipItem(itemId){
  var idx=state.inventory.findIndex(function(i){return i.id==itemId});
  if(idx<0)return;
  var item=state.inventory[idx];
  var slotKey=item.slot;
  if(state.equipped[slotKey])state.inventory.push(state.equipped[slotKey]);
  state.inventory.splice(idx,1);
  state.equipped[slotKey]=item;
  document.getElementById('equipDetailOverlay').remove();
  render();
}

function unequipItem(slotKey){
  var item=state.equipped[slotKey];
  if(!item)return;
  if(state.inventory.length>=20)return;
  state.equipped[slotKey]=null;
  state.inventory.push(item);
  document.getElementById('equipDetailOverlay').remove();
  render();
}

function discardItem(itemId){
  var idx=state.inventory.findIndex(function(i){return i.id==itemId});
  if(idx<0)return;
  state.inventory.splice(idx,1);
  document.getElementById('equipDetailOverlay').remove();
  render();
}

function openShop(){
  var overlay=document.createElement('div');
  overlay.className='overlay';
  overlay.id='shopOverlay';
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove()};
  var items=[
    {id:'satiety',name:'饱腹餐',emoji:'🍜',cost:5,desc:'饱腹度+25'},
    {id:'boost',name:'进度冲刺',emoji:'⚡',cost:10,desc:'当前关进度+30%'},
    {id:'mystery',name:'神秘宝箱',emoji:'🎁',cost:15,desc:'随机获得一件装备'},
    {id:'resetmeal',name:'重置餐次',emoji:'🍽️',cost:8,desc:'重置今日餐次'}
  ];
  var html='<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
    '<div style="font-size:18px;color:#FFD700;font-weight:bold">🏪 自律币商店</div>'+
    '<div onclick="document.getElementById(\'shopOverlay\').remove()" style="font-size:24px;color:#FFD700;cursor:pointer">×</div>'+
    '</div><div class="shop-items">';
  items.forEach(function(it){
    var can=state.selfDisciplineCoins>=it.cost;
    html+='<div class="shop-item" style="'+(can?'':'opacity:0.5')+'" onclick="'+(can?'buyShop(\''+it.id+'\')':'')+'">'+
      '<div class="shop-item-icon">'+it.emoji+'</div>'+
      '<div class="shop-item-info"><div class="shop-item-name">'+it.name+'</div><div class="shop-item-desc">'+it.desc+'</div></div>'+
      '<div class="shop-item-cost">🪙 '+it.cost+'</div></div>';
  });
  html+='</div><div style="font-size:10px;color:rgba(255,215,0,0.4);text-align:center;margin-top:12px">自律币获取：通关+1 · 每3连击+1 · 户外套装加成</div></div>';
  overlay.innerHTML=html;
  document.body.appendChild(overlay);
}

function buyShop(id){
  if(id==='satiety'&&state.selfDisciplineCoins>=5){state.selfDisciplineCoins-=5;state.satiety=Math.min(100,state.satiety+25)}
  if(id==='boost'&&state.selfDisciplineCoins>=10){state.selfDisciplineCoins-=10;var t=b(state.currentStage,state.breakthroughCount);state.consumedCalories=Math.min(t,state.consumedCalories+t*0.3)}
  if(id==='mystery'&&state.selfDisciplineCoins>=15&&state.inventory.length<20){state.selfDisciplineCoins-=15;state.inventory.push(generateEquipDrop())}
  if(id==='resetmeal'&&state.selfDisciplineCoins>=8){state.selfDisciplineCoins-=8}
  document.getElementById('shopOverlay').remove();
  render();
}

function toggleInventory(){
  state.showInventory=!state.showInventory;
  document.getElementById('inventorySection').style.display=state.showInventory?'block':'none';
  renderInventory();
}

// ============ 宠物逻辑 ============
function feedPet(){
  if(state.energyCalories<=0){
    state.kaliliMsg='能量不足，去拍照获取cal吧！';
    render();
    return;
  }
  var feedCal=Math.min(state.energyCalories,50);
  state.energyCalories-=feedCal;
  state.petExp+=Math.floor(feedCal/2);
  // 升级
  while(state.petExp>=state.petExpMax){
    state.petExp-=state.petExpMax;
    state.petLevel++;
    state.petExpMax=Math.floor(state.petExpMax*1.5);
    showPetLevelUp();
  }
  // 投喂粒子
  for(var i=0;i<8;i++){
    var p=document.createElement('div');
    p.className='pet-particle';
    p.style.left=(40+Math.random()*40)+'%';
    p.style.bottom='30%';
    p.style.background='#FFD700';
    p.style.boxShadow='0 0 6px #FFD700';
    p.style.animationDelay=(i*0.1)+'s';
    document.getElementById('petArea').appendChild(p);
    setTimeout(function(p){return function(){p.remove()}}(p),3000);
  }
  render();
}

function showPetLevelUp(){
  var overlay=document.createElement('div');
  overlay.className='clear-overlay';
  overlay.innerHTML='<div class="clear-content"><div class="clear-title">升级！</div><div class="clear-subtitle">卡里里 Lv.'+state.petLevel+'</div></div>';
  document.body.appendChild(overlay);
  setTimeout(function(){overlay.remove()},1500);
}

// ============ 拍照逻辑 ============
function simulatePhoto(){
  if(state.photoCount<=0){
    document.getElementById('photoResultArea').innerHTML='<div style="text-align:center;padding:16px;color:#ff5252;font-size:12px">今日识别次数已用完</div>';
    return;
  }
  state.photoCount--;
  document.getElementById('photoRemain').textContent=state.photoCount;

  var food=FOODS[Math.floor(Math.random()*FOODS.length)];
  var conf=(90+Math.random()*10).toFixed(1);
  var satAdd=Math.min(30,Math.floor(food.cal/30));
  state.satiety=Math.min(100,state.satiety+satAdd);
  state.energyCalories+=food.cal;
  state.petExp+=Math.floor(food.cal/10);

  while(state.petExp>=state.petExpMax){
    state.petExp-=state.petExpMax;
    state.petLevel++;
    state.petExpMax=Math.floor(state.petExpMax*1.5);
  }

  var html='<div class="photo-result">'+
    '<div class="photo-result-header">'+
      '<span class="photo-result-icon">'+food.icon+'</span>'+
      '<span class="photo-result-name">'+food.name+'</span>'+
      '<span class="photo-result-conf">'+conf+'%</span>'+
    '</div>'+
    '<div class="photo-result-cal">'+
      '<span class="photo-result-cal-label">估算热量</span>'+
      '<span class="photo-result-cal-value">'+food.cal+' 大卡</span>'+
    '</div>'+
    '<div class="photo-result-effect">✨ 饱腹度 +'+satAdd+' · 卡里里经验 +'+Math.floor(food.cal/10)+'</div>'+
    '<div class="photo-actions">'+
      '<div class="photo-btn photo-btn-secondary" onclick="simulatePhoto()">重新拍摄</div>'+
      '<div class="photo-btn photo-btn-primary" onclick="switchPage(\'pet\')">确认投喂</div>'+
    '</div>'+
  '</div>';
  document.getElementById('photoResultArea').innerHTML=html;
  render();
}

// ============ 页面切换 ============
function switchPage(name){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  event.currentTarget.classList.add('active');
}

function goToPhoto(){
  switchPage('photo');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.tab')[2].classList.add('active');
}

// ============ 启动 ============
render();
setInterval(gameTick,1000);
</script>
</body>
</html>
