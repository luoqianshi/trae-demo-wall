  <circle cx="60" cy="60" r="34" fill="none" stroke="url(#mirrorGrad)" stroke-width="2.5"/>
  <!-- 心形：看见即疗愈 -->
  <path d="M60 78 C 46 66, 38 56, 44 48 C 50 40, 60 46, 60 54 C 60 46, 70 40, 76 48 C 82 56, 74 66, 60 78 Z" fill="url(#mirrorGrad)"/>
