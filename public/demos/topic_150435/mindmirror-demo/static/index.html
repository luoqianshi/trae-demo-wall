<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心镜 MindMirror — 多模态心理陪伴</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/app-icon-180.png">
<link rel="stylesheet" href="/static/style.css?v=14">
</head>
<body>

<!-- 顶部状态栏 -->
<header class="topbar">
  <div class="topbar-left">
    <img src="/static/logo-light.svg" alt="心镜" class="logo-icon">
    <span class="logo">心镜</span>
    <span class="logo-en">MindMirror</span>
  </div>
  <div class="topbar-center">
    <span id="session-info" class="session-info">未开始会话</span>
  </div>
  <div class="topbar-right">
    <button id="btn-new-session" class="btn btn-sm">新会话</button>
    <button id="btn-history" class="btn btn-sm">历史记录</button>
  </div>
</header>

<!-- 主区域 -->
<main class="main-layout">

  <!-- 左侧：感知面板 -->
  <aside class="panel-left">

    <!-- 摄像头 + 表情识别 -->
    <div class="card camera-card">
      <div class="card-header">
        <span class="card-title">表情识别</span>
        <span id="face-status" class="status-badge status-off">未开启</span>
      </div>
      <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="face-canvas"></canvas>
        <div id="camera-placeholder" class="camera-placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮开启摄像头</p>
        </div>
      </div>
      <div class="camera-controls">
        <button id="btn-camera" class="btn btn-primary btn-sm">开启摄像头</button>
      </div>
      <!-- 表情结果 -->
      <div class="emotion-result">
        <div class="emotion-label-row">
          <span class="emotion-label-text">当前表情：</span>
          <span id="face-emotion-label" class="emotion-value">—</span>
        </div>
        <div class="emotion-bars" id="face-emotion-bars">
          <!-- JS 动态生成 -->
        </div>
      </div>
    </div>

    <!-- 语音分析 -->
    <div class="card voice-card">
      <div class="card-header">
        <span class="card-title">语音语气分析</span>
        <span id="voice-status" class="status-badge status-off">未开启</span>
      </div>
      <div class="voice-metrics">
        <div class="voice-metric">
          <span class="metric-label">音高 (F0)</span>
          <div class="metric-bar-container">
            <div id="bar-pitch" class="metric-bar bar-pitch"></div>
          </div>
          <span id="val-pitch" class="metric-value">— Hz</span>
        </div>
        <div class="voice-metric">
          <span class="metric-label">能量</span>
          <div class="metric-bar-container">
            <div id="bar-energy" class="metric-bar bar-energy"></div>
          </div>
          <span id="val-energy" class="metric-value">—</span>
        </div>
        <div class="voice-metric">
          <span class="metric-label">活跃度</span>
          <div class="metric-bar-container">
            <div id="bar-rate" class="metric-bar bar-rate"></div>
          </div>
          <span id="val-rate" class="metric-value">—</span>
        </div>
      </div>
      <div class="voice-result">
        <span class="emotion-label-text">语气情绪：</span>
        <span id="voice-emotion-label" class="emotion-value">—</span>
      </div>
      <div class="voice-controls">
        <button id="btn-mic" class="btn btn-primary btn-sm">开启麦克风</button>
        <button id="btn-record" class="btn btn-sm btn-primary">开启语音对话</button>
      </div>
      <div id="recording-hint" class="recording-hint" style="display:none;">
        正在聆听... 说话即可自动对话，点击按钮停止
      </div>
    </div>

    <!-- 融合情绪 -->
    <div class="card fusion-card">
      <div class="card-header">
        <span class="card-title">综合情绪分析</span>
      </div>
      <div class="fusion-display">
        <div class="fusion-emotion">
          <span id="fused-emotion-label" class="fused-emotion-text">中性</span>
          <span id="fused-intensity" class="fused-intensity-text">强度: 0.0</span>
        </div>
        <div class="fusion-trend">
          <span class="trend-label">趋势：</span>
          <span id="fused-trend" class="trend-value">稳定</span>
        </div>
        <div id="conflict-warning" class="conflict-warning">
          ⚠ 检测到情绪冲突（表情与语气不一致）
        </div>
      </div>
    </div>

  </aside>

  <!-- 右侧：对话区 -->
  <section class="panel-right">
    <div class="chat-header">
      <span class="chat-title">与心镜对话</span>
      <span id="cbt-strategy-display" class="cbt-strategy-tag"></span>
    </div>
    <div id="chat-messages" class="chat-messages">
      <!-- 欢迎消息 -->
      <div class="message message-ai">
        <div class="message-avatar">心</div>
        <div class="message-content">
          <p>你好，我是心镜。我会通过你的表情和语气来理解你的心情。</p>
          <p>请先开启摄像头和麦克风，然后随时可以和我聊聊你的感受。</p>
        </div>
      </div>
    </div>
    <div class="chat-input-area">
      <textarea id="chat-input" class="chat-input" placeholder="输入你想说的话..." rows="2"></textarea>
      <button id="btn-send" class="btn btn-primary">发送</button>
    </div>
  </section>

</main>

<!-- 底部：情绪轨迹图 -->
<section class="trajectory-section">
  <div class="card">
    <div class="card-header">
      <span class="card-title">本次对话情绪轨迹</span>
      <span class="card-subtitle">实时记录你的情绪变化</span>
    </div>
    <canvas id="trajectory-canvas" width="1000" height="200"></canvas>
  </div>
</section>

<!-- 历史记录弹窗 -->
<div id="history-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">历史会话记录</span>
      <button id="btn-close-history" class="btn-close">&times;</button>
    </div>
    <div id="history-list" class="history-list">
      <!-- JS 动态生成 -->
    </div>
  </div>
</div>

<!-- 会话详情弹窗 -->
<div id="detail-modal" class="modal" style="display:none;">
  <div class="modal-content modal-large">
    <div class="modal-header">
      <span class="modal-title">会话详情</span>
      <button id="btn-close-detail" class="btn-close">&times;</button>
    </div>
    <div id="detail-content" class="detail-content"></div>
  </div>
</div>

<!-- 应用脚本 -->
<script src="/static/app.js?v=26"></script>

</body>
</html>
