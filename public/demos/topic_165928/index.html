    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const hours = date.getHours().toString().padStart(2, '0');
      const minutes = date.getMinutes().toString().padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const year = date.getFullYear();
      const month = (date.getMonth() + 1).toString().padStart(2, '0');
      const day = date.getDate().toString().padStart(2, '0');
      const hours = date.getHours().toString().padStart(2, '0');
      const minutes = date.getMinutes().toString().padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function formatRelativeTime(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;

      if (diff < minute) return '刚刚';
      if (diff < hour) return `${Math.floor(diff / minute)}分钟前`;
      if (diff < day) return `${Math.floor(diff / hour)}小时前`;
      return formatDate(timestamp);
    }

      try {

    function handleKeyPress(event) {
      if (event.key === 'Enter') sendMessage();

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      
      if (!message || !selectedScene) return;
      
      input.value = '';
      
      const userMessage = { role: 'user', content: message, timestamp: Date.now() };
      messages.push(userMessage);
      renderChat();
      
      if (detectRisk(message)) {
        const riskReply = { role: 'ai', content: getRiskMessage(), timestamp: Date.now() };
        messages.push(riskReply);
        renderChat();
        document.getElementById('risk-modal').classList.remove('hidden');
        return;
      }
      
      const chatContainer = document.getElementById('chat-container');
      if (chatContainer) {
        chatContainer.innerHTML += `
          <div class="flex justify-start mb-4 px-4">
            <div class="bg-white rounded-2xl px-4 py-3 rounded-bl-md border border-gray-100">
              <div class="flex gap-1.5">
                <div class="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay: 0ms"></div>
                <div class="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay: 150ms"></div>
                <div class="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay: 300ms"></div>
              </div>
            </div>
          </div>
        `;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
      
      await new Promise(resolve => setTimeout(resolve, 1500));
      
      const aiReply = { role: 'ai', content: getRandomReply(selectedScene), timestamp: Date.now() };
      messages.push(aiReply);
      
      if (!currentChatId) {
        const newRecord = {
          id: Date.now().toString(),
          scene: selectedScene,
          messages: [...messages],
          createdAt: Date.now(),
        };
        const records = loadFromStorage(STORAGE_KEYS.CHAT);
        records.push(newRecord);
        saveToStorage(STORAGE_KEYS.CHAT, records);
        currentChatId = newRecord.id;
      } else {
        const records = loadFromStorage(STORAGE_KEYS.CHAT);
        const index = records.findIndex(r => r.id === currentChatId);
        if (index !== -1) {
          records[index].messages = [...messages];
          saveToStorage(STORAGE_KEYS.CHAT, records);
        }
      }
      
      renderChat();
    }

    function saveLetter() {
      const title = document.getElementById('letter-title').value.trim();
      const content = document.getElementById('letter-content').value.trim();
      
      if (!title || !content) return;
      
      const now = Date.now();
      let targetDate = now + 7 * 24 * 60 * 60 * 1000;
      if (letterDuration === '30days') targetDate = now + 30 * 24 * 60 * 60 * 1000;
      if (letterDuration === '6months') targetDate = now + 6 * 30 * 24 * 60 * 60 * 1000;
      
      const newLetter = {
        id: Date.now().toString(),
        title,
        content,
        targetDate,
        createdAt: now,
        isOpened: false,
      };
      
      const letters = loadFromStorage(STORAGE_KEYS.FUTURE_LETTER);
      letters.unshift(newLetter);
      saveToStorage(STORAGE_KEYS.FUTURE_LETTER, letters);
      
      document.getElementById('letter-title').value = '';
      document.getElementById('letter-content').value = '';
      renderHealing();
    }

      const letters = loadFromStorage(STORAGE_KEYS.FUTURE_LETTER);
      const index = letters.findIndex(l => l.id === id);
      if (index !== -1) {
        letters[index].isOpened = true;
        saveToStorage(STORAGE_KEYS.FUTURE_LETTER, letters);
        renderHealing();
      }
    }

      const letters = loadFromStorage(STORAGE_KEYS.FUTURE_LETTER);

              </div>
            </div>
            
            <textarea id="forgiveness-content" placeholder="写下你想放下的事..." class="w-full h-32 px-3 py-2 rounded-xl border border-indigo-200 bg-white/70 text-sm resize-none mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-300"></textarea>
            
            <button onclick="saveForgiveness()" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-400 to-purple-400 text-white font-medium hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
              </svg>
              记录心事
            </button>
          </div>

          <div class="space-y-4">
            <h4 class="font-medium text-gray-700 flex items-center gap-2">
              <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
              </svg>
              当前心事
              ${activeEntries.length > 0 ? `<span class="text-xs px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-600">${activeEntries.length}</span>` : ''}
            </h4>
            
            ${activeEntries.length === 0 ? `
              <div class="text-center py-6 text-gray-400">
                <svg class="w-10 h-10 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <p class="text-sm">没有未封存的心事</p>
              </div>
            ` : `
              ${activeEntries.map(entry => {
                const info = typeInfo[entry.type];
                return `
                  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden shadow-sm">
                    <div class="p-4">
                      <div class="flex items-center gap-2 mb-2">
                        <span class="text-lg ${info.color}">${info.emoji}</span>
                        <span class="text-xs font-medium ${info.color}">${info.label}</span>
                        <span class="text-xs text-gray-400 ml-auto">${formatRelativeTime(entry.createdAt)}</span>
                      </div>
                      <p class="text-sm text-gray-600 leading-relaxed mb-3">${entry.content}</p>
                      <div class="flex gap-2">
                        <button onclick="sealForgiveness('${entry.id}')" class="flex-1 py-2 rounded-lg bg-green-50 text-green-600 text-sm font-medium hover:bg-green-100 transition-colors flex items-center justify-center gap-1">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                          </svg>
                          封存放下
                        </button>
                        <button onclick="deleteForgiveness('${entry.id}')" class="px-3 py-2 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                          </svg>
                        </button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            `}

            ${sealedEntries.length > 0 ? `
              <div class="mt-6">
                <button onclick="toggleSealed()" class="w-full flex items-center justify-between py-2 text-sm text-gray-500 hover:text-gray-700">
                  <div class="flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                    <span>已封存的心事</span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-gray-100">${sealedEntries.length}</span>
                  </div>
                  <svg class="w-4 h-4" id="sealed-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </button>
                
                <div id="sealed-list" class="hidden mt-3 space-y-2">
                  ${sealedEntries.map(entry => {
                    const info = typeInfo[entry.type];
                    return `
                      <div class="bg-gray-50 rounded-xl p-3 opacity-70">
                        <div class="flex items-center gap-2 mb-1">
                          <span class="text-sm">${info.emoji}</span>
                          <span class="text-xs text-gray-400">${info.label}</span>
                          <span class="text-xs text-gray-400 ml-auto">封存于 ${entry.sealedAt ? formatDate(entry.sealedAt) : ''}</span>
                        </div>
                        <p class="text-sm text-gray-500 line-clamp-2">${entry.content}</p>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    let forgivenessType = 'grievance';
    function setForgivenessType(t) {
      forgivenessType = t;
      document.querySelectorAll('[id^="forgiveness-type-"]').forEach(btn => {
        btn.className = 'flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-1 bg-white text-gray-600 border border-indigo-200';
      });
      document.getElementById(`forgiveness-type-${t}`).className = 'flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-1 bg-indigo-500 text-white';
    }

    function saveForgiveness() {
      const content = document.getElementById('forgiveness-content').value.trim();
      if (!content) return;
      
      const newEntry = {
        id: Date.now().toString(),
        content,
        type: forgivenessType,
        createdAt: Date.now(),
        isSealed: false,
        sealedAt: null,
      };
      
      const entries = loadFromStorage(STORAGE_KEYS.FORGIVENESS);
      entries.unshift(newEntry);
      saveToStorage(STORAGE_KEYS.FORGIVENESS, entries);
      
      document.getElementById('forgiveness-content').value = '';
      renderHealing();
    }

    function sealForgiveness(id) {
      const entries = loadFromStorage(STORAGE_KEYS.FORGIVENESS);
      const index = entries.findIndex(e => e.id === id);
      if (index !== -1) {
        entries[index].isSealed = true;
        entries[index].sealedAt = Date.now();
        saveToStorage(STORAGE_KEYS.FORGIVENESS, entries);
        renderHealing();
      }
    }

    function deleteForgiveness(id) {
      const entries = loadFromStorage(STORAGE_KEYS.FORGIVENESS);
      const filtered = entries.filter(e => e.id !== id);
      saveToStorage(STORAGE_KEYS.FORGIVENESS, filtered);
      renderHealing();
    }

    function toggleSealed() {
      const list = document.getElementById('sealed-list');
      const arrow = document.getElementById('sealed-arrow');
      if (list.classList.contains('hidden')) {
        list.classList.remove('hidden');
        arrow.classList.add('rotate-180');
      } else {
        list.classList.add('hidden');
        arrow.classList.remove('rotate-180');
      }
    }

    function renderSelfPraiseLibrary() {
      const entries = loadFromStorage(STORAGE_KEYS.SELF_PRAISE);
      const categoryInfo = {
        health: { label: '健康', emoji: '🏃', color: 'text-green-500', bgColor: 'bg-green-50' },
        beauty: { label: '护肤', emoji: '💄', color: 'text-pink-500', bgColor: 'bg-pink-50' },
        skill: { label: '技能', emoji: '💡', color: 'text-blue-500', bgColor: 'bg-blue-50' },
        rest: { label: '休息', emoji: '😴', color: 'text-purple-500', bgColor: 'bg-purple-50' },
        other: { label: '其他', emoji: '🌟', color: 'text-orange-500', bgColor: 'bg-orange-50' },
      };
      
      return `
        <div class="p-4">
          <div class="bg-gradient-to-br from-yellow-50 to-orange-50 rounded-2xl p-4 mb-6">
            <div class="flex items-center gap-2 mb-3">
              <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
              </svg>
              <h3 class="font-semibold text-gray-700">自我赞美库</h3>
            </div>
            <p class="text-sm text-gray-500 mb-4">记录所有值得肯定的小事，低落时一键翻阅，对抗自我否定。</p>
            
            <div class="mb-3">
              <div class="flex flex-wrap gap-2">
                ${['health', 'beauty', 'skill', 'rest', 'other'].map((cat, i) => {
                  const info = categoryInfo[cat];
                  return `
                    <button onclick="setPraiseCategory('${cat}')" id="praise-category-${cat}" class="px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 flex items-center gap-1 ${i === 4 ? info.bgColor + ' ' + info.color + ' ring-2 ring-offset-1 ring-current' : 'bg-white text-gray-600 border border-gray-200'}">
                      <span>${info.emoji}</span>
                      <span>${info.label}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
            
            <textarea id="praise-content" placeholder="我今天做到了..." class="w-full h-24 px-3 py-2 rounded-xl border border-yellow-200 bg-white/70 text-sm resize-none mb-4 focus:outline-none focus:ring-2 focus:ring-yellow-300"></textarea>
            
            <button onclick="savePraise()" class="w-full py-3 rounded-xl bg-gradient-to-r from-yellow-400 to-orange-400 text-white font-medium hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
              </svg>
              记录成就
            </button>
          </div>

          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <h4 class="font-medium text-gray-700 flex items-center gap-2">
                <svg class="w-4 h-4 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                我的成就清单
                ${entries.length > 0 ? `<span class="text-xs px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-600">${entries.length}</span>` : ''}
              </h4>
              
              ${entries.length > 0 ? `
                <div class="flex gap-1">
                  <button onclick="setPraiseFilter(null)" id="praise-filter-all" class="text-xs px-2 py-1 rounded-full bg-yellow-100 text-yellow-600 transition-colors">全部</button>
                  ${['health', 'beauty', 'skill', 'rest', 'other'].map(cat => {
                    const info = categoryInfo[cat];
                    return `
                      <button onclick="setPraiseFilter('${cat}')" id="praise-filter-${cat}" class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-500 transition-colors flex items-center gap-1">
                        ${info.emoji}
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
            
            ${entries.length === 0 ? `
              <div class="text-center py-8 text-gray-400">
                <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                </svg>
                <p class="text-sm">还没有记录，开始发现自己的闪光点吧</p>
              </div>
            ` : `
              <div class="grid grid-cols-2 gap-3">
                ${entries.map(entry => {
                  const info = categoryInfo[entry.category];
                  return `
                    <div class="${info.bgColor} rounded-xl p-3 relative group">
                      <div class="flex items-center gap-2 mb-2">
                        <span class="text-lg">${info.emoji}</span>
                        <span class="text-xs font-medium ${info.color}">${info.label}</span>
                      </div>
                      <p class="text-sm text-gray-600 leading-relaxed">${entry.content}</p>
                      <div class="mt-2 flex items-center justify-between">
                        <span class="text-xs text-gray-400">${formatRelativeTime(entry.createdAt)}</span>
                        <button onclick="deletePraise('${entry.id}')" class="p-1 rounded opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition-all">
                          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                          </svg>
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          ${entries.length > 0 ? `
            <div class="mt-6 p-4 bg-gradient-to-br from-pink-50 to-red-50 rounded-xl">
              <div class="flex items-center gap-2 mb-2">
                <svg class="w-5 h-5 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                </svg>
                <h4 class="font-medium text-gray-700">今日鼓励</h4>
              </div>
              <p class="text-sm text-gray-600">你已经做到了 ${entries.length} 件值得肯定的事情！每一件小事都在积累成更好的自己。</p>
            </div>
          ` : ''}
        </div>
      `;
    }

    let praiseCategory = 'other';
    function setPraiseCategory(cat) {
      praiseCategory = cat;
      document.querySelectorAll('[id^="praise-category-"]').forEach(btn => {
        btn.className = 'px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 flex items-center gap-1 bg-white text-gray-600 border border-gray-200';
      });
      const info = {
        health: { bgColor: 'bg-green-50', color: 'text-green-500' },
        beauty: { bgColor: 'bg-pink-50', color: 'text-pink-500' },
        skill: { bgColor: 'bg-blue-50', color: 'text-blue-500' },
        rest: { bgColor: 'bg-purple-50', color: 'text-purple-500' },
        other: { bgColor: 'bg-orange-50', color: 'text-orange-500' },
      }[cat];
      document.getElementById(`praise-category-${cat}`).className = `px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 flex items-center gap-1 ${info.bgColor} ${info.color} ring-2 ring-offset-1 ring-current`;
    }

    let praiseFilter = null;
    function setPraiseFilter(cat) {
      praiseFilter = cat;
      document.querySelectorAll('[id^="praise-filter-"]').forEach(btn => {
        btn.className = 'text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-500 transition-colors flex items-center gap-1';
      });
      if (cat === null) {
        document.getElementById('praise-filter-all').className = 'text-xs px-2 py-1 rounded-full bg-yellow-100 text-yellow-600 transition-colors';
      } else {
        const info = {
          health: { bgColor: 'bg-green-50', color: 'text-green-500' },
          beauty: { bgColor: 'bg-pink-50', color: 'text-pink-500' },
          skill: { bgColor: 'bg-blue-50', color: 'text-blue-500' },
          rest: { bgColor: 'bg-purple-50', color: 'text-purple-500' },
          other: { bgColor: 'bg-orange-50', color: 'text-orange-500' },
        }[cat];
        document.getElementById(`praise-filter-${cat}`).className = `text-xs px-2 py-1 rounded-full transition-colors flex items-center gap-1 ${info.bgColor} ${info.color}`;
      }
    }

    function savePraise() {
      const content = document.getElementById('praise-content').value.trim();
      if (!content) return;
      
      const newEntry = {
        id: Date.now().toString(),
        content,
        category: praiseCategory,
        createdAt: Date.now(),
      };
      
      const entries = loadFromStorage(STORAGE_KEYS.SELF_PRAISE);
      entries.unshift(newEntry);
      saveToStorage(STORAGE_KEYS.SELF_PRAISE, entries);
      
      document.getElementById('praise-content').value = '';
      renderHealing();
    }

    function deletePraise(id) {
      const entries = loadFromStorage(STORAGE_KEYS.SELF_PRAISE);
      const filtered = entries.filter(e => e.id !== id);
      saveToStorage(STORAGE_KEYS.SELF_PRAISE, filtered);
      renderHealing();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        switchPage(btn.dataset.page);
      });
    });

    renderHome();
  </script>
</body>
</html>
