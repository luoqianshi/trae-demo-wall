<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汴京侠客行</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a1510;
      overflow: hidden;
      font-family: 'Noto Serif SC', serif;
      user-select: none;
    }

    #game-container {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    canvas {
      background: #2b221a;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      max-width: 100%; max-height: 100%;
    }

    /* HUD 层 */
    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 1280px; height: 720px;
      pointer-events: none;
      color: #f5e6c8;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      display: none;
    }

    .hud-top-left {
      position: absolute; top: 20px; left: 24px;
    }
    .bar-wrap {
      width: 220px; height: 18px;
      background: rgba(0,0,0,0.45);
      border: 2px solid rgba(245,230,200,0.35);
      border-radius: 9px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.1s linear;
    }
    #hp-fill { background: linear-gradient(90deg, #8b1a1a, #d32f2f); width: 100%; }
    #qi-fill { background: linear-gradient(90deg, #1a4d8b, #2f7ad3); width: 100%; }
    .bar-label {
      font-size: 13px; margin-left: 6px; letter-spacing: 1px;
      font-family: 'Ma Shan Zheng', cursive;
    }

    .hud-top-right {
      position: absolute; top: 20px; right: 24px;
      text-align: right;
    }
    .wanted-title {
      font-size: 18px; color: #ff6b6b;
      font-family: 'Ma Shan Zheng', cursive;
    }
    .star { font-size: 32px; color: #444; transition: color 0.2s; }
    .star.active { color: #ff3838; text-shadow: 0 0 12px #ff3838; }

    .hud-bottom-left {
      position: absolute; bottom: 22px; left: 24px;
      display: flex; align-items: center; gap: 10px;
      font-size: 26px; font-weight: 700;
    }
    .coin-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffd700, #b8860b);
      border: 2px solid #8b6914;
      box-shadow: inset 0 0 0 6px #1a1510;
      display: inline-block;
    }

    .hud-mission {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      padding: 8px 22px;
      border-radius: 20px;
      border: 1px solid rgba(245,230,200,0.25);
      font-size: 16px;
      max-width: 520px; text-align: center;
      font-family: 'Ma Shan Zheng', cursive;
    }

    .hud-tutorial {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 15px;
      color: #ffebb5;
      transition: opacity 0.5s;
    }

    .hud-message {
      position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
      font-size: 28px;
      font-family: 'Ma Shan Zheng', cursive;
      color: #ffd700;
      opacity: 0; transition: opacity 0.3s;
      text-align: center;
      pointer-events: none;
    }

    /* 全屏遮罩 */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(16, 12, 9, 0.88);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: auto;
      color: #f5e6c8;
      text-align: center;
    }
    .overlay h1 {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 72px;
      margin-bottom: 12px;
      color: #e8c87a;
      text-shadow: 0 0 20px rgba(232,200,122,0.4);
    }
    .overlay h2 {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 48px;
      margin-bottom: 16px;
    }
    .overlay p {
      font-size: 18px; line-height: 1.8;
      max-width: 640px; margin-bottom: 28px;
    }
    .btn {
      padding: 14px 42px;
      font-size: 22px;
      font-family: 'Ma Shan Zheng', cursive;
      color: #1a1510;
      background: linear-gradient(180deg, #e8c87a, #b8934a);
      border: none; border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 6px 0 #755c26, 0 10px 20px rgba(0,0,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #755c26, 0 4px 10px rgba(0,0,0,0.4);
    }
    .hidden { display: none !important; }

    /* 响应式：保持 16:9 */
    @media (max-aspect-ratio: 16/9) {
      canvas, #hud { width: 100vw; height: 56.25vw; }
    }
    @media (min-aspect-ratio: 16/9) {
      canvas, #hud { width: 177.78vh; height: 100vh; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>

    <div id="hud">
      <div class="hud-top-left">
        <div class="bar-wrap"><div id="hp-fill" class="bar-fill"></div></div>
        <div class="bar-wrap"><div id="qi-fill" class="bar-fill"></div></div>
      </div>
      <div class="hud-top-right">
        <div class="wanted-title">通缉等级</div>
        <div id="wanted-stars">
          <span class="star">★</span><span class="star">★</span><span class="star">★</span>
        </div>
      </div>
      <div class="hud-bottom-left">
        <span class="coin-icon"></span><span id="coin-text">0</span>
      </div>
      <div id="mission-text" class="hud-mission">按 E 在黑市商人处接任务</div>
      <div id="tutorial-text" class="hud-tutorial">
        ← → 移动 · 空格 跳跃 · J 攻击 · K 剑气 · L 翻滚
      </div>
      <div id="center-message" class="hud-message"></div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>汴京侠客行</h1>
      <p>北宋徽宗年间，东京汴梁虹桥街市。<br>你是一名无名侠客，可挥剑行侠，亦可为非作歹。<br>完成黑市任务、躲避官差追捕，在这幅活的《清明上河图》中书写你的传奇。</p>
      <button class="btn" id="start-btn">踏入汴京</button>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <h2>身死道消</h2>
      <p id="gameover-reason">你被官差拿下，铜钱半数充公。</p>
      <button class="btn" id="restart-btn">卷土重来</button>
    </div>

    <div id="victory-screen" class="overlay hidden">
      <h2>名动汴京</h2>
      <p id="victory-reason">任务完成，赏金到手。</p>
      <button class="btn" id="continue-btn">继续闯荡</button>
    </div>
  </div>

  <script>
    // ============================================================
    // 全局配置
    // ============================================================
    const CONFIG = {
      canvasW: 1280, canvasH: 720,
      mapW: 3000,
      groundY: 580,
      gravity: 1400,
      player: {
        w: 48, h: 80,
        speed: 240,
        jump: -460,
        rollSpeed: 420,
        rollInv: 0.35,
        rollCd: 0.85,
        maxHp: 100,
        maxQi: 100,
        dmg: 25,
        qiDmg: 60,
        qiCost: 30,
        qiRegen: 18,
        attackRange: 90,
        attackWidth: 70,
        comboWindow: 0.4,
        hurtInv: 0.6
      },
      wanted: {
        thresholds: [10, 40, 70],
        decayDelay: 8,
        decayRate: 18,
        crimeHitCiv: 12,
        crimeKillCiv: 20,
        crimeHitOfficer: 25,
        crimeKillOfficer: 40
      },
      spawn: {
        level1: [{type:'yayi', count:1}],
        level2: [{type:'yayi', count:2}, {type:'archer', count:1}],
        level3: [{type:'jinjun', count:2}, {type:'archer', count:2}, {type:'yayi', count:2}]
      },
      coinDrop: { min: 5, max: 15 },
      healCost: 20,
      missionReward: 50,
      tutorialDuration: 30
    };

    // ============================================================
    // 工具函数
    // ============================================================
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
    function aabb(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }
    function dist(a, b) { return Math.hypot(a.x + a.w/2 - (b.x + b.w/2), a.y + a.h/2 - (b.y + b.h/2)); }

    // ============================================================
    // 输入系统
    // ============================================================
    const Input = {
      keys: {},
      pressed: {}, // 本帧按下
      update() { this.pressed = {}; }
    };
    window.addEventListener('keydown', e => {
      if (!Input.keys[e.code]) Input.pressed[e.code] = true;
      Input.keys[e.code] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e => { Input.keys[e.code] = false; });

    // ============================================================
    // 资源加载（带失败回退）
    // ============================================================
    const Assets = {
      images: {},
      load(list, onDone) {
        let loaded = 0;
        const total = list.length;
        list.forEach(({key, src}) => {
          const img = new Image();
          img.onload = () => { this.images[key] = img; if (++loaded === total) onDone(); };
          img.onerror = () => { if (++loaded === total) onDone(); };
          img.src = src;
        });
        if (!total) onDone();
      },
      get(key) { return this.images[key] || null; }
    };

    // 图片未加载时绘制占位角色
    function drawPlaceholder(ctx, x, y, w, h, color, label, facing = 1) {
      ctx.save();
      ctx.translate(x + w/2, y + h/2);
      ctx.scale(facing, 1);
      ctx.fillStyle = color;
      ctx.fillRect(-w/2, -h/2, w, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.strokeRect(-w/2, -h/2, w, h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 0, 0);
      ctx.restore();
    }

    // 带朝向与动画帧绘制图片
    function drawAsset(ctx, key, x, y, w, h, opts = {}) {
      const img = Assets.get(key);
      const { facing = 1, flip = false, alpha = 1, frame = 0, frames = 1 } = opts;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x + w/2, y + h/2);
      const sx = flip ? -1 : 1;
      ctx.scale(facing * sx, 1);
      if (img && img.complete && img.naturalWidth) {
        const sw = img.width / frames;
        const sxImg = sw * (frame % frames);
        ctx.drawImage(img, sxImg, 0, sw, img.height, -w/2, -h/2, w, h);
      } else {
        const label = key.split('-')[0].toUpperCase();
        drawPlaceholder(ctx, -w/2, -h/2, w, h, opts.color || '#888', label, 1);
      }
      ctx.restore();
    }

    // ============================================================
    // 粒子系统
    // ============================================================
    class ParticleSystem {
      constructor() { this.particles = []; }
      emit(x, y, count, color, speed, life) {
        for (let i = 0; i < count; i++) {
          const ang = rand(0, Math.PI * 2);
          const sp = rand(speed * 0.3, speed);
          this.particles.push({
            x, y,
            vx: Math.cos(ang) * sp,
            vy: Math.sin(ang) * sp - rand(30, 120),
            life: rand(life * 0.5, life),
            maxLife: life,
            color,
            size: rand(2, 5)
          });
        }
      }
      emitCoin(x, y) {
        this.particles.push({
          x, y, vx: rand(-40, 40), vy: rand(-120, -60),
          life: 1.2, maxLife: 1.2, color: '#ffd700', size: 6, coin: true
        });
      }
      update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += CONFIG.gravity * 0.4 * dt;
          p.life -= dt;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
      }
      render(ctx) {
        this.particles.forEach(p => {
          const alpha = p.life / p.maxLife;
          ctx.globalAlpha = alpha;
          if (p.coin) {
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1510';
            ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
          } else {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
          }
        });
        ctx.globalAlpha = 1;
      }
    }

    // ============================================================
    // 相机系统
    // ============================================================
    class Camera {
      constructor() { this.x = 0; this.y = 0; }
      update(target) {
        this.x = target.x + target.w/2 - CONFIG.canvasW/2;
        this.x = clamp(this.x, 0, CONFIG.mapW - CONFIG.canvasW);
      }
    }

    // ============================================================
    // 实体基类
    // ============================================================
    class Entity {
      constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.vx = 0; this.vy = 0;
        this.facing = 1;
        this.dead = false;
        this.animTimer = 0;
      }
      get cx() { return this.x + this.w/2; }
      get cy() { return this.y + this.h/2; }
      updatePhysics(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        // 重力
        if (this.y + this.h < CONFIG.groundY) {
          this.vy += CONFIG.gravity * dt;
        }
        // 落地
        if (this.y + this.h >= CONFIG.groundY) {
          this.y = CONFIG.groundY - this.h;
          this.vy = 0;
        }
        // 地图边界
        this.x = clamp(this.x, 0, CONFIG.mapW - this.w);
      }
    }

    // ============================================================
    // 玩家
    // ============================================================
    class Player extends Entity {
      constructor(x, y) {
        super(x, y, CONFIG.player.w, CONFIG.player.h);
        this.hp = CONFIG.player.maxHp;
        this.qi = CONFIG.player.maxQi;
        this.state = 'idle';
        this.stateTimer = 0;
        this.comboCount = 0;
        this.comboTimer = 0;
        this.rollCdTimer = 0;
        this.invTimer = 0;
        this.attackHit = false;
        this.dead = false;
        this.coins = 0;
      }

      update(dt, game) {
        if (this.dead) return;
        this.stateTimer += dt;
        this.animTimer += dt;
        if (this.rollCdTimer > 0) this.rollCdTimer -= dt;
        if (this.invTimer > 0) this.invTimer -= dt;
        if (this.comboTimer > 0) {
          this.comboTimer -= dt;
          if (this.comboTimer <= 0) this.comboCount = 0;
        }
        // 内力恢复
        if (this.qi < CONFIG.player.maxQi) this.qi = Math.min(CONFIG.player.maxQi, this.qi + CONFIG.player.qiRegen * dt);

        // 状态机
        if (this.state === 'hurt') {
          if (this.stateTimer >= 0.3) this.state = 'idle';
          else { this.updatePhysics(dt); return; }
        }
        if (this.state === 'roll') {
          this.invTimer = Math.max(this.invTimer, 0.05);
          if (this.stateTimer >= CONFIG.player.rollInv) {
            this.state = 'idle'; this.vx = 0;
          } else {
            this.vx = this.facing * CONFIG.player.rollSpeed;
            this.updatePhysics(dt); return;
          }
        }
        if (this.state.startsWith('attack')) {
          const attackDur = 0.32;
          // 攻击判定窗口
          if (!this.attackHit && this.stateTimer > 0.08 && this.stateTimer < 0.22) {
            this.doAttack(game);
          }
          if (this.stateTimer >= attackDur) {
            this.state = 'idle'; this.vx = 0;
          } else {
            this.vx *= 0.7;
            this.updatePhysics(dt); return;
          }
        }

        // 输入响应
        let move = 0;
        if (Input.keys['ArrowLeft'] || Input.keys['KeyA']) move -= 1;
        if (Input.keys['ArrowRight'] || Input.keys['KeyD']) move += 1;

        if (Input.pressed['KeyL']) this.roll();
        if (Input.pressed['KeyJ']) this.attack();
        if (Input.pressed['KeyK']) this.qiAttack(game);

        if (this.state === 'idle' || this.state === 'run') {
          if ((Input.pressed['Space'] || Input.pressed['ArrowUp']) && this.onGround()) {
            this.jump();
          } else if (move !== 0) {
            this.facing = move;
            this.vx = move * CONFIG.player.speed;
            this.state = 'run';
          } else {
            this.vx = 0;
            this.state = 'idle';
          }
        }

        this.updatePhysics(dt);
      }

      onGround() { return this.y + this.h >= CONFIG.groundY - 1; }
      jump() { this.vy = CONFIG.player.jump; this.state = 'jump'; }
      roll() {
        if (this.rollCdTimer > 0 || !this.onGround()) return;
        this.state = 'roll'; this.stateTimer = 0;
        this.rollCdTimer = CONFIG.player.rollCd;
      }
      attack() {
        if (!this.onGround() || this.state.startsWith('attack')) return;
        if (this.comboCount > 0 && this.comboTimer <= 0) this.comboCount = 0;
        this.comboCount = (this.comboCount % 3) + 1;
        this.comboTimer = CONFIG.player.comboWindow;
        this.state = 'attack' + this.comboCount;
        this.stateTimer = 0;
        this.attackHit = false;
      }
      qiAttack(game) {
        if (this.qi < CONFIG.player.qiCost || !this.onGround() || this.state.startsWith('attack')) return;
        this.qi -= CONFIG.player.qiCost;
        this.state = 'attack1'; this.stateTimer = 0; this.attackHit = false;
        // 发射剑气
        game.projectiles.push(new QiWave(this.cx, this.cy - 10, this.facing, this));
        triggerShake(5);
      }

      doAttack(game) {
        this.attackHit = true;
        const box = {
          x: this.facing > 0 ? this.cx : this.cx - CONFIG.player.attackRange,
          y: this.y - 10,
          w: CONFIG.player.attackRange,
          h: CONFIG.player.attackWidth
        };
        let hitAny = false;
        [...game.civilians, ...game.enemies].forEach(target => {
          if (target.dead) return;
          if (aabb(box, target)) {
            target.takeDamage(CONFIG.player.dmg, this.facing * 180, game);
            hitAny = true;
          }
        });
        if (hitAny) {
          triggerHitStop(50);
          triggerShake(6);
          game.particles.emit(this.cx + this.facing * 40, this.cy - 10, 8, '#ff4d4d', 120, 0.5);
        }
      }

      takeDamage(n, kb, game) {
        if (this.invTimer > 0 || this.dead) return;
        this.hp -= n;
        this.invTimer = CONFIG.player.hurtInv;
        this.state = 'hurt'; this.stateTimer = 0;
        this.vx = kb; this.vy = -150;
        game.particles.emit(this.cx, this.cy, 10, '#ff0000', 160, 0.6);
        if (this.hp <= 0) { this.hp = 0; this.die(game); }
      }

      die(game) {
        this.dead = true;
        game.onPlayerDeath();
      }

      render(ctx) {
        if (this.dead) return;
        const blink = this.invTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0;
        drawAsset(ctx, 'hero', this.x, this.y, this.w, this.h, {
          facing: this.facing,
          alpha: blink ? 0.5 : 1,
          frame: this.animFrame(),
          frames: 2,
          color: '#4a7c59'
        });
        // 剑光
        if (this.state.startsWith('attack') && this.stateTimer < 0.22) {
          const sx = this.facing > 0 ? this.cx : this.cx - 70;
          drawAsset(ctx, 'fx-slash', sx, this.y - 20, 70, 70, {
            facing: this.facing, flip: false, alpha: 0.9, color: '#fff'
          });
        }
      }

      animFrame() {
        if (this.state === 'run') return Math.floor(this.animTimer * 8) % 2;
        if (this.state.startsWith('attack')) return 0;
        return 0;
      }
    }

    // ============================================================
    // 剑气投射物
    // ============================================================
    class QiWave {
      constructor(x, y, facing, owner) {
        this.x = x; this.y = y; this.w = 80; this.h = 40;
        this.facing = facing; this.owner = owner;
        this.speed = 520; this.dead = false; this.life = 1.2;
      }
      update(dt) {
        this.x += this.facing * this.speed * dt;
        this.life -= dt;
        if (this.life <= 0 || this.x < 0 || this.x > CONFIG.mapW) this.dead = true;
      }
      render(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.facing, 1);
        ctx.fillStyle = 'rgba(135,206,250,0.85)';
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(60, -15); ctx.lineTo(60, 15); ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    // ============================================================
    // 平民 NPC
    // ============================================================
    class Civilian extends Entity {
      constructor(x, y, type) {
        super(x, y, 42, 76);
        this.type = type; // 'm','f','merchant'
        this.hp = 35;
        this.speed = rand(40, 90);
        this.walkTimer = rand(1, 3);
        this.dir = Math.random() > 0.5 ? 1 : -1;
        this.fleeTimer = 0;
        this.dead = false;
        this.coinDropped = false;
      }
      update(dt, game) {
        if (this.dead) return;
        this.animTimer += dt;
        if (this.isEscortee) {
          // 护送目标由任务系统控制移动
        } else if (this.fleeTimer > 0) {
          this.fleeTimer -= dt;
          this.vx = -Math.sign(game.player.cx - this.cx) * (this.speed + 80);
        } else {
          this.walkTimer -= dt;
          if (this.walkTimer <= 0) {
            this.dir = Math.random() > 0.5 ? 1 : -1;
            this.walkTimer = rand(1.5, 4);
            if (Math.random() < 0.25) this.dir = 0;
          }
          this.vx = this.dir * this.speed;
        }
        if (this.vx !== 0) this.facing = Math.sign(this.vx) || this.facing;
        this.updatePhysics(dt);
      }
      takeDamage(n, kb, game) {
        if (this.dead) return;
        this.hp -= n; this.vx = kb; this.vy = -80;
        this.fleeTimer = 1.5;
        game.wanted.onCrime('hitCiv');
        game.particles.emit(this.cx, this.cy, 6, '#ff4d4d', 90, 0.4);
        if (this.hp <= 0) this.die(game);
      }
      die(game) {
        this.dead = true;
        game.wanted.onCrime('killCiv');
        if (!this.coinDropped) {
          this.coinDropped = true;
          const amount = randInt(CONFIG.coinDrop.min, CONFIG.coinDrop.max);
          game.dropCoin(this.cx, this.y, amount);
        }
      }
      render(ctx) {
        if (this.dead) return;
        const key = this.type === 'm' ? 'npc-civilian-m' : this.type === 'f' ? 'npc-civilian-f' : 'npc-merchant';
        drawAsset(ctx, key, this.x, this.y, this.w, this.h, {
          facing: this.facing,
          frame: Math.abs(this.vx) > 10 ? Math.floor(this.animTimer * 6) % 2 : 0,
          frames: 2,
          color: this.type === 'merchant' ? '#b86d29' : '#7a8a99'
        });
      }
    }

    // ============================================================
    // 敌人基类
    // ============================================================
    class Enemy extends Entity {
      constructor(x, y, w, h, type) {
        super(x, y, w, h);
        this.type = type;
        this.hp = 60;
        this.dmg = 10;
        this.speed = 110;
        this.attackRange = 55;
        this.attackCd = 0;
        this.hurtTimer = 0;
        this.dead = false;
      }
      takeDamage(n, kb, game) {
        if (this.dead) return;
        this.hp -= n; this.vx = kb; this.vy = -80; this.hurtTimer = 0.25;
        game.wanted.onCrime('hitOfficer');
        game.particles.emit(this.cx, this.cy, 8, '#ff4d4d', 120, 0.5);
        if (this.hp <= 0) this.die(game);
      }
      die(game) {
        this.dead = true;
        game.wanted.onCrime('killOfficer');
        game.dropCoin(this.cx, this.y, randInt(10, 25));
      }
      canSeePlayer(p) { return Math.abs(p.cx - this.cx) < this.vision && Math.abs(p.y - this.y) < 120; }
    }

    class Yayi extends Enemy {
      constructor(x, y) {
        super(x, y, 46, 78, 'yayi');
        this.vision = 360; this.speed = 130; this.dmg = 12;
      }
      update(dt, game) {
        if (this.dead) return;
        this.animTimer += dt;
        if (this.hurtTimer > 0) { this.hurtTimer -= dt; this.updatePhysics(dt); return; }
        const p = game.player;
        if (this.canSeePlayer(p)) {
          const dx = p.cx - this.cx;
          if (Math.abs(dx) > this.attackRange) {
            this.facing = Math.sign(dx) || this.facing;
            this.vx = this.facing * this.speed;
          } else {
            this.vx = 0;
            if (this.attackCd <= 0) {
              this.attackCd = 1.1;
              // 近战判定
              game.meleeHit(this, p);
            }
          }
        } else {
          this.vx = 0;
        }
        if (this.attackCd > 0) this.attackCd -= dt;
        this.updatePhysics(dt);
      }
      render(ctx) {
        if (this.dead) return;
        drawAsset(ctx, 'enemy-yayi', this.x, this.y, this.w, this.h, {
          facing: this.facing,
          frame: Math.abs(this.vx) > 10 ? Math.floor(this.animTimer * 6) % 2 : 0,
          frames: 2, color: '#2c3e50'
        });
      }
    }

    class Archer extends Enemy {
      constructor(x, y) {
        super(x, y, 44, 76, 'archer');
        this.vision = 520; this.speed = 90; this.dmg = 8;
        this.attackRange = 220; this.attackCd = 0;
        this.hp = 45;
      }
      update(dt, game) {
        if (this.dead) return;
        this.animTimer += dt;
        if (this.hurtTimer > 0) { this.hurtTimer -= dt; this.updatePhysics(dt); return; }
        const p = game.player;
        if (this.canSeePlayer(p)) {
          const dx = p.cx - this.cx;
          this.facing = Math.sign(dx) || this.facing;
          const ideal = 280;
          const d = Math.abs(dx);
          if (d < ideal - 40) this.vx = -this.facing * this.speed;
          else if (d > ideal + 40) this.vx = this.facing * this.speed;
          else this.vx = 0;
          if (this.attackCd <= 0 && d < this.vision) {
            this.attackCd = 1.8;
            game.projectiles.push(new Arrow(this.cx, this.cy - 20, this.facing, this));
          }
        } else { this.vx = 0; }
        if (this.attackCd > 0) this.attackCd -= dt;
        this.updatePhysics(dt);
      }
      render(ctx) {
        if (this.dead) return;
        drawAsset(ctx, 'enemy-yayi', this.x, this.y, this.w, this.h, {
          facing: this.facing, frame: 0, frames: 1, color: '#4a6741'
        });
      }
    }

    class JinJun extends Enemy {
      constructor(x, y) {
        super(x, y, 52, 86, 'jinjun');
        this.vision = 560; this.speed = 160; this.dmg = 18;
        this.hp = 150; this.attackRange = 65; this.attackCd = 0;
      }
      update(dt, game) {
        if (this.dead) return;
        this.animTimer += dt;
        if (this.hurtTimer > 0) { this.hurtTimer -= dt; this.updatePhysics(dt); return; }
        const p = game.player;
        if (this.canSeePlayer(p)) {
          const dx = p.cx - this.cx;
          this.facing = Math.sign(dx) || this.facing;
          if (Math.abs(dx) > this.attackRange) {
            this.vx = this.facing * this.speed;
          } else {
            this.vx = 0;
            if (this.attackCd <= 0) {
              this.attackCd = 1.0;
              game.meleeHit(this, p);
              // 禁军带剑气横扫
              game.projectiles.push(new QiWave(this.cx, this.cy - 10, this.facing, this));
            }
          }
        } else { this.vx = 0; }
        if (this.attackCd > 0) this.attackCd -= dt;
        this.updatePhysics(dt);
      }
      render(ctx) {
        if (this.dead) return;
        drawAsset(ctx, 'enemy-jinjun', this.x, this.y, this.w, this.h, {
          facing: this.facing,
          frame: Math.abs(this.vx) > 10 ? Math.floor(this.animTimer * 6) % 2 : 0,
          frames: 2, color: '#8b1a1a'
        });
      }
    }

    class Arrow {
      constructor(x, y, facing, owner) {
        this.x = x; this.y = y; this.w = 28; this.h = 6;
        this.facing = facing; this.owner = owner;
        this.speed = 460; this.dead = false; this.life = 1.5;
      }
      update(dt) {
        this.x += this.facing * this.speed * dt;
        this.life -= dt;
        if (this.life <= 0 || this.x < 0 || this.x > CONFIG.mapW) this.dead = true;
      }
      render(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.facing, 1);
        ctx.fillStyle = '#c4a35a';
        ctx.fillRect(-14, -2, 28, 4);
        ctx.beginPath();
        ctx.moveTo(14, -4); ctx.lineTo(22, 0); ctx.lineTo(14, 4); ctx.fill();
        ctx.restore();
      }
    }

    // ============================================================
    // 通缉系统
    // ============================================================
    class WantedSystem {
      constructor(game) {
        this.game = game;
        this.level = 0; this.value = 0;
        this.decayTimer = 0; this.crimeTimer = 0;
      }
      onCrime(type) {
        const add = CONFIG.wanted['crime' + type.charAt(0).toUpperCase() + type.slice(1)] || 0;
        if (type === 'killOfficer') this.game.showMessage('击杀官差！通缉飙升');
        else if (type === 'hitCiv') this.game.showMessage('当街行凶！');
        else if (type === 'killCiv') this.game.showMessage('杀人了！衙役正在赶来');
        this.value = clamp(this.value + add, 0, 100);
        this.decayTimer = 0;
        this.crimeTimer = 0.5;
        this.updateLevel();
      }
      updateLevel() {
        const old = this.level;
        if (this.value >= CONFIG.wanted.thresholds[2]) this.level = 3;
        else if (this.value >= CONFIG.wanted.thresholds[1]) this.level = 2;
        else if (this.value >= CONFIG.wanted.thresholds[0]) this.level = 1;
        else this.level = 0;
        if (this.level > old) {
          this.game.showMessage(`通缉升至 ${this.level} 星！`);
          triggerShake(8 + this.level * 3);
          this.game.spawnWantedEnemies(this.level);
        }
      }
      update(dt) {
        if (this.crimeTimer > 0) this.crimeTimer -= dt;
        // 视野内有敌人则不衰减
        const hasThreat = this.game.enemies.some(e => !e.dead && e.canSeePlayer && e.canSeePlayer(this.game.player));
        if (this.level > 0 && !hasThreat) {
          this.decayTimer += dt;
          if (this.decayTimer > CONFIG.wanted.decayDelay) {
            this.value = Math.max(0, this.value - CONFIG.wanted.decayRate * dt);
            this.updateLevel();
          }
        } else if (hasThreat) {
          this.decayTimer = 0;
        }
      }
    }

    // ============================================================
    // 任务系统
    // ============================================================
    class MissionSystem {
      constructor(game) {
        this.game = game;
        this.current = null;
        this.templates = [
          { type:'escort', desc:'护送货郎到右端茶肆', reward: CONFIG.missionReward },
          { type:'assassinate', desc:'击杀街尾的恶霸', reward: CONFIG.missionReward },
          { type:'collect', desc:'收集 5 贯铜钱', count:5, reward: CONFIG.missionReward }
        ];
        this.escortee = null;
        this.bully = null;
        this.collected = 0;
      }
      start() {
        if (this.current) return;
        const t = this.templates[randInt(0, this.templates.length - 1)];
        this.current = { ...t };
        if (t.type === 'escort') {
          this.escortee = new Civilian(200, CONFIG.groundY - 76, 'merchant');
          this.escortee.speed = 300;
          this.escortee.isEscortee = true;
          this.game.civilians.push(this.escortee);
        } else if (t.type === 'assassinate') {
          this.bully = new Yayi(CONFIG.mapW - 300, CONFIG.groundY - 78);
          this.bully.hp = 120; this.bully.speed = 90;
          this.game.enemies.push(this.bully);
        } else if (t.type === 'collect') {
          this.collected = 0;
        }
        this.game.showMessage(`任务：${this.current.desc}`);
        this.updateHud();
      }
      update(dt) {
        if (!this.current) return;
        if (this.current.type === 'escort' && this.escortee) {
          const goal = CONFIG.mapW - 220;
          const p = this.game.player;
          const follow = p.cx - this.escortee.cx;
          if (Math.abs(follow) > 80) {
            this.escortee.facing = Math.sign(follow) || this.escortee.facing;
            this.escortee.vx = this.escortee.facing * this.escortee.speed;
          } else { this.escortee.vx = 0; }
          if (this.escortee.cx >= goal - 80) this.complete();
        }
        if (this.current.type === 'assassinate' && this.bully && this.bully.dead) this.complete();
        if (this.current.type === 'collect' && this.collected >= this.current.count) this.complete();
        this.updateHud();
      }
      complete() {
        if (!this.current) return;
        this.game.player.coins += this.current.reward;
        this.game.showMessage(`任务完成！赏金 +${this.current.reward} 贯`);
        this.current = null; this.escortee = null; this.bully = null; this.collected = 0;
        this.game.onVictory();
      }
      updateHud() {
        const el = document.getElementById('mission-text');
        if (!this.current) { el.textContent = '按 E 在黑市商人处接任务'; return; }
        let s = this.current.desc;
        if (this.current.type === 'collect') s += ` (${this.collected}/${this.current.count})`;
        el.textContent = s;
      }
    }

    // ============================================================
    // 金币掉落
    // ============================================================
    class CoinDrop {
      constructor(x, y, amount) {
        this.x = x; this.y = y; this.w = 18; this.h = 18;
        this.amount = amount;
        this.vx = rand(-60, 60); this.vy = rand(-180, -80);
        this.life = 8; this.dead = false;
      }
      update(dt) {
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.vy += CONFIG.gravity * dt;
        if (this.y + this.h > CONFIG.groundY) { this.y = CONFIG.groundY - this.h; this.vy = -this.vy * 0.4; this.vx *= 0.7; }
        this.life -= dt;
        if (this.life <= 0) this.dead = true;
      }
      render(ctx) {
        ctx.save();
        ctx.translate(this.x + this.w/2, this.y + this.h/2);
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#1a1510';
        ctx.fillRect(-3, -3, 6, 6);
        ctx.restore();
      }
    }

    // ============================================================
    // 场景装饰
    // ============================================================
    class Decor {
      constructor(x, type) {
        this.x = x; this.type = type;
        this.y = CONFIG.groundY;
        this.w = type === 'teahouse' ? 180 : 70;
        this.h = type === 'teahouse' ? 140 : 90;
      }
      render(ctx) {
        ctx.save();
        if (this.type === 'teahouse') {
          ctx.fillStyle = '#6d2e2e';
          ctx.fillRect(this.x, this.y - this.h, this.w, this.h);
          ctx.fillStyle = '#2a1a12';
          ctx.fillRect(this.x + 20, this.y - 90, 50, 90);
          ctx.fillRect(this.x + 110, this.y - 90, 50, 90);
          ctx.fillStyle = '#e8c87a';
          ctx.font = '24px "Ma Shan Zheng", cursive';
          ctx.textAlign = 'center';
          ctx.fillText('茶肆', this.x + this.w/2, this.y - this.h - 8);
        } else if (this.type === 'stall') {
          ctx.fillStyle = '#8b5a2b';
          ctx.fillRect(this.x, this.y - 70, 70, 70);
          ctx.fillStyle = '#b8934a';
          ctx.beginPath(); ctx.moveTo(this.x - 10, this.y - 70); ctx.lineTo(this.x + 35, this.y - 110); ctx.lineTo(this.x + 80, this.y - 70); ctx.fill();
        } else if (this.type === 'lantern') {
          ctx.fillStyle = '#3d2b1f';
          ctx.fillRect(this.x, this.y - 120, 8, 120);
          ctx.fillStyle = '#d94436';
          ctx.beginPath(); ctx.arc(this.x + 4, this.y - 120, 18, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
      }
    }

    // ============================================================
    // 主游戏
    // ============================================================
    let hitStopTimer = 0;
    let shakeIntensity = 0;
    function triggerHitStop(ms) { hitStopTimer = ms; }
    function triggerShake(intensity) { shakeIntensity = intensity; }

    class Game {
      constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.player = new Player(140, CONFIG.groundY - CONFIG.player.h);
        this.camera = new Camera();
        this.particles = new ParticleSystem();
        this.civilians = [];
        this.enemies = [];
        this.projectiles = [];
        this.coins = [];
        this.decors = [];
        this.wanted = new WantedSystem(this);
        this.missions = new MissionSystem(this);
        this.merchantX = 80;
        this.teahouseX = CONFIG.mapW - 220;
        this.lastTime = 0;
        this.running = false;
        this.messageTimer = 0;
        this.messageEl = document.getElementById('center-message');
        this.tutorialTimer = CONFIG.tutorialDuration;
        this.setupDecors();
        this.spawnCivilians();
      }
      setupDecors() {
        this.decors.push(new Decor(this.teahouseX, 'teahouse'));
        this.decors.push(new Decor(500, 'stall'));
        this.decors.push(new Decor(1100, 'stall'));
        this.decors.push(new Decor(1800, 'stall'));
        this.decors.push(new Decor(2400, 'lantern'));
        this.decors.push(new Decor(700, 'lantern'));
      }
      spawnCivilians() {
        const types = ['m', 'f', 'merchant'];
        for (let i = 0; i < 7; i++) {
          const x = rand(300, CONFIG.mapW - 400);
          const t = types[randInt(0, 2)];
          this.civilians.push(new Civilian(x, CONFIG.groundY - 76, t));
        }
      }
      spawnWantedEnemies(level) {
        const list = CONFIG.spawn['level' + level];
        if (!list) return;
        list.forEach(({type, count}) => {
          for (let i = 0; i < count; i++) {
            const side = Math.random() > 0.5 ? -1 : 1;
            const x = side < 0 ? this.camera.x - rand(60, 200) : this.camera.x + CONFIG.canvasW + rand(60, 200);
            let e;
            if (type === 'yayi') e = new Yayi(x, CONFIG.groundY - 78);
            else if (type === 'archer') e = new Archer(x, CONFIG.groundY - 76);
            else if (type === 'jinjun') e = new JinJun(x, CONFIG.groundY - 86);
            if (e) this.enemies.push(e);
          }
        });
      }
      dropCoin(x, y, amount) {
        this.coins.push(new CoinDrop(x, y, amount));
        this.particles.emitCoin(x, y);
      }
      meleeHit(attacker, target) {
        if (target.dead || target.invTimer > 0) return;
        const reach = attacker.attackRange || 60;
        if (Math.abs(attacker.cx - target.cx) < reach && Math.abs(attacker.y - target.y) < 80) {
          const kb = attacker.facing * 140;
          target.takeDamage(attacker.dmg, kb, this);
          triggerHitStop(40);
          triggerShake(5);
        }
      }
      showMessage(text) {
        this.messageEl.textContent = text;
        this.messageEl.style.opacity = 1;
        this.messageTimer = 2.5;
      }
      onPlayerDeath() {
        this.player.coins = Math.floor(this.player.coins / 2);
        document.getElementById('gameover-reason').textContent =
          `你被官差拿下，身上 ${this.player.coins} 贯铜钱充公。`;
        document.getElementById('gameover-screen').classList.remove('hidden');
        document.getElementById('hud').style.display = 'none';
        this.running = false;
      }
      onVictory() {
        document.getElementById('victory-reason').textContent =
          `任务完成！你已获得赏金，当前拥有 ${this.player.coins} 贯铜钱。`;
        document.getElementById('victory-screen').classList.remove('hidden');
        document.getElementById('hud').style.display = 'none';
        this.running = false;
      }
      reset() {
        this.player = new Player(140, CONFIG.groundY - CONFIG.player.h);
        this.civilians = []; this.enemies = []; this.projectiles = []; this.coins = [];
        this.wanted = new WantedSystem(this);
        this.missions = new MissionSystem(this);
        this.spawnCivilians();
        this.lastTime = 0;
        this.tutorialTimer = CONFIG.tutorialDuration;
        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('victory-screen').classList.add('hidden');
        document.getElementById('hud').style.display = 'block';
        this.running = true;
      }

      update(dt) {
        if (!this.running) return;

        if (hitStopTimer > 0) {
          hitStopTimer -= dt * 1000;
          return;
        }
        if (shakeIntensity > 0) shakeIntensity *= 0.85;

        this.player.update(dt, this);
        this.camera.update(this.player);

        // 商人互动
        if (Input.pressed['KeyE']) {
          if (Math.abs(this.player.cx - (this.merchantX + 30)) < 80) {
            this.missions.start();
          }
          // 茶肆回血
          if (Math.abs(this.player.cx - (this.teahouseX + 90)) < 110) {
            if (this.player.coins >= CONFIG.healCost && this.player.hp < CONFIG.player.maxHp) {
              this.player.coins -= CONFIG.healCost;
              this.player.hp = CONFIG.player.maxHp;
              this.showMessage('茶肆回血，花费 ' + CONFIG.healCost + ' 贯');
            } else if (this.player.hp >= CONFIG.player.maxHp) {
              this.showMessage('精力充沛，无需回血');
            } else {
              this.showMessage('铜钱不足，无法回血');
            }
          }
        }

        this.civilians.forEach(c => c.update(dt, this));
        this.enemies.forEach(e => e.update(dt, this));
        this.projectiles.forEach(p => p.update(dt));
        this.coins.forEach(c => c.update(dt));
        this.particles.update(dt);
        this.wanted.update(dt);
        this.missions.update(dt);

        // 投射物碰撞
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          if (p.dead) { this.projectiles.splice(i, 1); continue; }
          // 玩家发射的剑气
          if (p.owner === this.player) {
            [...this.civilians, ...this.enemies].forEach(t => {
              if (!t.dead && aabb(p, t)) {
                t.takeDamage(CONFIG.player.qiDmg, this.player.facing * 260, this);
                p.dead = true;
                triggerHitStop(60); triggerShake(8);
              }
            });
          } else {
            // 敌人投射物
            if (aabb(p, this.player)) {
              this.player.takeDamage(p.owner.dmg, p.facing * 120, this);
              p.dead = true;
            }
          }
          if (p.dead) this.projectiles.splice(i, 1);
        }

        // 金币拾取
        for (let i = this.coins.length - 1; i >= 0; i--) {
          const c = this.coins[i];
          if (aabb(c, this.player)) {
            this.player.coins += c.amount;
            if (this.missions.current && this.missions.current.type === 'collect') this.missions.collected++;
            this.coins.splice(i, 1);
            this.showMessage(`+${c.amount} 贯`);
          }
        }

        // 消息衰减
        if (this.messageTimer > 0) {
          this.messageTimer -= dt;
          if (this.messageTimer <= 0) this.messageEl.style.opacity = 0;
        }

        // 教程提示
        if (this.tutorialTimer > 0) {
          this.tutorialTimer -= dt;
          if (this.tutorialTimer <= 0) document.getElementById('tutorial-text').style.opacity = 0;
        }

        // 清理死亡实体
        this.civilians = this.civilians.filter(c => !c.dead);
        this.enemies = this.enemies.filter(e => !e.dead);
        this.coins = this.coins.filter(c => !c.dead);

        this.updateHud();
        Input.update();
      }

      updateHud() {
        const p = this.player;
        document.getElementById('hp-fill').style.width = (p.hp / CONFIG.player.maxHp * 100) + '%';
        document.getElementById('qi-fill').style.width = (p.qi / CONFIG.player.maxQi * 100) + '%';
        document.getElementById('coin-text').textContent = p.coins;
        const stars = document.querySelectorAll('#wanted-stars .star');
        stars.forEach((s, i) => s.classList.toggle('active', i < this.wanted.level));
      }

      render() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, CONFIG.canvasW, CONFIG.canvasH);

        ctx.save();
        if (shakeIntensity > 0) {
          ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
        }

        // 远景视差
        const far = Assets.get('bg-far');
        if (far) ctx.drawImage(far, -this.camera.x * 0.2, 0, CONFIG.canvasW * 1.4, CONFIG.canvasH);
        else {
          ctx.fillStyle = '#3d4f5f';
          ctx.fillRect(0, 0, CONFIG.canvasW, CONFIG.canvasH);
          ctx.fillStyle = '#2a3a48';
          ctx.fillRect(0, CONFIG.canvasH - 260, CONFIG.canvasW, 120);
        }

        // 中景街道
        const street = Assets.get('bg-street');
        if (street) ctx.drawImage(street, -this.camera.x * 0.6, 0, CONFIG.canvasW * 1.6, CONFIG.canvasH);
        else {
          ctx.fillStyle = '#5c4a3a';
          ctx.fillRect(0, CONFIG.groundY, CONFIG.canvasW, CONFIG.canvasH - CONFIG.groundY);
          ctx.fillStyle = '#6b5744';
          for (let i = 0; i < 30; i++) ctx.fillRect(i * 100 - (this.camera.x * 0.6) % 100, CONFIG.groundY, 80, 8);
        }

        ctx.save();
        ctx.translate(-this.camera.x, 0);

        // 地面线
        ctx.strokeStyle = '#3e3226';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, CONFIG.groundY); ctx.lineTo(CONFIG.mapW, CONFIG.groundY); ctx.stroke();

        // 装饰
        this.decors.forEach(d => d.render(ctx));

        // 商人（王老六）
        drawAsset(ctx, 'npc-merchant', this.merchantX, CONFIG.groundY - 76, 48, 76, {
          facing: 1, frame: 0, frames: 1, color: '#b86d29'
        });
        ctx.fillStyle = '#e8c87a';
        ctx.font = '18px "Ma Shan Zheng", cursive';
        ctx.textAlign = 'center';
        ctx.fillText('王老六', this.merchantX + 24, CONFIG.groundY - 88);

        // 实体按深度排序
        const all = [this.player, ...this.civilians, ...this.enemies, ...this.coins];
        all.sort((a, b) => (a.y + a.h) - (b.y + b.h));
        all.forEach(e => e.render(ctx));

        this.projectiles.forEach(p => p.render(ctx));
        this.particles.render(ctx);

        ctx.restore(); // 世界坐标
        ctx.restore(); // 震动
      }

      loop(ts) {
        const dt = Math.min((ts - this.lastTime) / 1000, 0.05);
        this.lastTime = ts;
        this.update(dt);
        this.render();
        requestAnimationFrame(this.loop.bind(this));
      }

      start() {
        this.running = true;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').style.display = 'block';
        this.loop(0);
      }
    }

    // ============================================================
    // 启动
    // ============================================================
    const game = new Game();
    const assetList = [
      {key:'bg-street', src:'assets/bg-street.png'},
      {key:'bg-far', src:'assets/bg-far.png'},
      {key:'hero', src:'assets/hero.png'},
      {key:'npc-civilian-m', src:'assets/npc-civilian-m.png'},
      {key:'npc-civilian-f', src:'assets/npc-civilian-f.png'},
      {key:'npc-merchant', src:'assets/npc-merchant.png'},
      {key:'enemy-yayi', src:'assets/enemy-yayi.png'},
      {key:'enemy-jinjun', src:'assets/enemy-jinjun.png'},
      {key:'fx-slash', src:'assets/fx-slash.png'},
      {key:'fx-hit', src:'assets/fx-hit.png'}
    ];
    Assets.load(assetList, () => {
      // 资源加载完成，按钮可用
    });

    document.getElementById('start-btn').addEventListener('click', () => game.start());
    document.getElementById('restart-btn').addEventListener('click', () => game.reset());
    document.getElementById('continue-btn').addEventListener('click', () => game.reset());
  </script>
</body>
</html>
