// ---- 草稿箱逻辑 ----
var drafts = [];
function loadDrafts() {
  try { drafts = JSON.parse(localStorage.getItem('xy_drafts') || '[]'); } catch(e) { drafts = []; }
}
function saveDrafts() {
  try { localStorage.setItem('xy_drafts', JSON.stringify(drafts)); } catch(e) {}
}
function addDraft(data, status) {
  var title = (data.texts && data.texts[0] && data.texts[0].text) || '未命名明信片';
  drafts.unshift({ id: Date.now(), title: title, date: new Date().toLocaleString('zh-CN'), stickerCount: data.placedFlowers.length, textCount: data.texts.length, selectedCard: data.selectedCard, status: status || 'draft', data: data });
  if (drafts.length > 30) drafts.pop();
  saveDrafts();
}
function updateDraft(id, data) {
  for (var i = 0; i < drafts.length; i++) {
    if (drafts[i].id === id) {
      drafts[i].title = (data.texts && data.texts[0] && data.texts[0].text) || '未命名明信片';
      drafts[i].stickerCount = data.placedFlowers.length;
      drafts[i].textCount = data.texts.length;
      drafts[i].selectedCard = data.selectedCard;
      drafts[i].data = data;
      drafts[i].date = new Date().toLocaleString('zh-CN');
      saveDrafts();
      return;
    }
  }
}

// ---- 逻辑：评分 ----
function calculateScore(game) {
  var n = game.placedFlowers.length;
  var tn = game.texts ? game.texts.length : 0;
  if (!n && !tn) return { stars: 0, score: 0, title: '花艺学徒' };
  var c = Math.min(30, n * 5);
  var typeSet = [];
  game.placedFlowers.forEach(function(f){ if (typeSet.indexOf(f.type) < 0) typeSet.push(f.type); });
  var s = Math.min(30, (typeSet.length + (tn > 0 ? 1 : 0)) * 8);
  var q = n >= 5 && n <= 10 ? 40 : n >= 3 ? 25 : 10;
  var t = Math.min(100, c + s + q + (tn > 0 ? 5 : 0));
  var stars = t >= 80 ? 5 : t >= 60 ? 4 : t >= 40 ? 3 : t >= 20 ? 2 : 1;
  var titles = ['花艺学徒','花艺学徒','花艺师','花艺大师','花艺大师','花仙子'];
  return { stars: stars, score: t, title: titles[stars] };
}

// ---- 撤回/恢复 ----
function saveState(g) {
  g.undoStack.push(JSON.parse(JSON.stringify({ placedFlowers: g.placedFlowers, blessing: g.blessing })));
  if (g.undoStack.length > 50) g.undoStack.shift();
  g.redoStack = [];
}
function undo(g) {
  if (!g.undoStack.length) return;
  g.redoStack.push(JSON.parse(JSON.stringify({ placedFlowers: g.placedFlowers, blessing: g.blessing })));
  var prev = g.undoStack.pop();
  g.placedFlowers = prev.placedFlowers;
  g.blessing = prev.blessing;
}
function redo(g) {
  if (!g.redoStack.length) return;
  g.undoStack.push(JSON.parse(JSON.stringify({ placedFlowers: g.placedFlowers, blessing: g.blessing })));
  var next = g.redoStack.pop();
  g.placedFlowers = next.placedFlowers;
  g.blessing = next.blessing;
}

// ---- Canvas 自适应 ----
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var layout = {};

function resizeCanvas() {
  var dpr = window.devicePixelRatio || 1;
  var winW = window.innerWidth || 375;
  var winH = window.innerHeight || 667;
  var padding = 16;
  var maxW = Math.max(winW - padding * 2, 200);
  var maxH = Math.max(winH - padding * 2, 300);
  var scale = Math.min(maxW / LOGIC_W, maxH / LOGIC_H, 2);
  if (scale <= 0 || !isFinite(scale)) scale = 1;
  var dispW = Math.floor(LOGIC_W * scale);
  var dispH = Math.floor(LOGIC_H * scale);
  canvas.style.width = dispW + 'px';
  canvas.style.height = dispH + 'px';
  // 让实际像素 = CSS显示像素 * DPR，保持1:1对齐，避免模糊
  canvas.width = Math.round(dispW * dpr);
  canvas.height = Math.round(dispH * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  layout = { w: LOGIC_W, h: LOGIC_H, cardX: 24, cardY: 18 + SAFE_TOP, cardW: LOGIC_W - 48, cardH: 480 };
}

window.addEventListener('resize', resizeCanvas);

// 确保 DOM 完全加载后再初始化，避免空白页
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  resizeCanvas();
} else {
  window.addEventListener('DOMContentLoaded', resizeCanvas);
}

// ---- 坐标转换：屏幕坐标 -> 逻辑坐标 ----
function toLogic(clientX, clientY) {
  var rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width * LOGIC_W,
    y: (clientY - rect.top) / rect.height * LOGIC_H
  };
}

// ============================================================
// 渲染函数
// ============================================================

function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawHeartPath(ctx, x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.6);
  ctx.bezierCurveTo(x - s * 1.2, y - s * 0.5, x - s * 0.5, y - s * 1.1, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 1.1, x + s * 1.2, y - s * 0.5, x, y + s * 0.6);
}

function drawCardPattern(ctx, card, L) {
  var cardX = L.cardX, cardY = L.cardY, cardW = L.cardW, cardH = L.cardH;
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = card.border;
  if (card.name === '清新田园') {
    for (var r = 0; r < 4; r++) for (var c = 0; c < 5; c++) {
      ctx.beginPath();
      ctx.arc(cardX + 30 + c * 70, cardY + 30 + r * 100, 12, 0, Math.PI * 2); ctx.fill();
      for (var p = 0; p < 5; p++) {
        var a = (Math.PI * 2 * p) / 5;
        ctx.beginPath();
        ctx.arc(cardX + 30 + c * 70 + Math.cos(a) * 8, cardY + 30 + r * 100 + Math.sin(a) * 8, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
  } else if (card.name === '浪漫粉色') {
    var positions = [[40,50],[180,100],[100,200],[250,150],[180,300],[60,280],[260,250],[80,160],[220,60],[140,330]];
    for (var i = 0; i < positions.length; i++) {
      drawHeartPath(ctx, cardX + positions[i][0], cardY + positions[i][1], 10); ctx.fill();
    }
  } else if (card.name === '优雅素白') {
    ctx.lineWidth = 0.5;
    for (var i = 1; i <= 12; i++) {
      ctx.beginPath(); ctx.moveTo(cardX + i * 28, cardY + 10); ctx.lineTo(cardX + i * 28, cardY + cardH - 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cardX + 10, cardY + i * 30); ctx.lineTo(cardX + cardW - 10, cardY + i * 30); ctx.stroke();
    }
  } else if (card.name === '复古牛皮') {
    ctx.lineWidth = 1;
    for (var i = 0; i < 8; i++) {
      ctx.beginPath();
      ctx.moveTo(cardX + 20, cardY + 25 + i * 48);
      ctx.lineTo(cardX + cardW - 20, cardY + 25 + i * 48);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// ---- 贴纸绘制 ----
function drawSticker(ctx, x, y, st, selected, scale) {
  scale = scale || 1;
  var s = st.size * scale;
  if (selected) {
    ctx.strokeStyle = '#e8a0b4'; ctx.setLineDash([3, 3]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, s * 1.2, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (st.type === 'flower') {
    for (var i = 0; i < 5; i++) {
      var a = (Math.PI * 2 * i) / 5 - Math.PI / 2;
      ctx.fillStyle = st.color;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * s * 0.3, y + Math.sin(a) * s * 0.3, s * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = st.center;
    ctx.beginPath(); ctx.arc(x, y, s * 0.18, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'kitty') {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, s * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = st.color;
    ctx.beginPath(); ctx.arc(x - s * 0.25, y - s * 0.3, s * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.25, y - s * 0.3, s * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x - s * 0.18, y - s * 0.1, s * 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.18, y - s * 0.1, s * 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff69b4'; ctx.beginPath(); ctx.arc(x, y + s * 0.1, s * 0.07, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'bear') {
    ctx.fillStyle = st.color;
    ctx.beginPath(); ctx.arc(x, y, s * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x - s * 0.25, y - s * 0.3, s * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.25, y - s * 0.3, s * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5d4037'; ctx.beginPath(); ctx.arc(x, y + s * 0.15, s * 0.12, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'bunny') {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, s * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = st.center;
    ctx.beginPath(); ctx.arc(x - s * 0.2, y - s * 0.35, s * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.2, y - s * 0.35, s * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x - s * 0.15, y - s * 0.07, s * 0.04, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.15, y - s * 0.07, s * 0.04, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'cloud') {
    ctx.fillStyle = '#fafafa';
    ctx.beginPath(); ctx.arc(x - s * 0.27, y + s * 0.07, s * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.27, y + s * 0.07, s * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y - s * 0.13, s * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = st.center; ctx.beginPath(); ctx.arc(x, y - s * 0.07, s * 0.25, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'fish') {
    ctx.fillStyle = st.color;
    ctx.beginPath(); ctx.ellipse(x, y, s * 0.5, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + s * 0.4, y); ctx.lineTo(x + s * 0.7, y - s * 0.2); ctx.lineTo(x + s * 0.7, y + s * 0.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - s * 0.15, y - s * 0.1, s * 0.07, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'car') {
    ctx.fillStyle = st.color;
    ctx.beginPath(); roundedRect(ctx, x - s * 0.4, y - s * 0.25, s * 0.8, s * 0.4, s * 0.2); ctx.fill();
    ctx.fillStyle = '#87ceeb';
    ctx.beginPath(); roundedRect(ctx, x - s * 0.15, y - s * 0.25, s * 0.3, s * 0.18, s * 0.07); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(x - s * 0.25, y + s * 0.2, s * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.25, y + s * 0.2, s * 0.12, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'leaf') {
    ctx.fillStyle = st.color;
    ctx.beginPath(); ctx.ellipse(x, y, s * 0.6, s * 0.3, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = st.center; ctx.lineWidth = Math.max(1, s * 0.03);
    ctx.beginPath(); ctx.moveTo(x, y - s * 0.3); ctx.lineTo(x, y + s * 0.3); ctx.stroke();
  } else if (st.type === 'heart') {
    ctx.fillStyle = st.color;
    drawHeartPath(ctx, x, y, s * 0.35); ctx.fill();
  } else if (st.type === 'star') {
    ctx.fillStyle = st.color;
    ctx.beginPath();
    for (var i = 0; i < 5; i++) {
      var outer = (Math.PI * 2 * i) / 5 - Math.PI / 2;
      var inner = outer + Math.PI / 5;
      var ox = x + Math.cos(outer) * s * 0.5, oy = y + Math.sin(outer) * s * 0.5;
      var ix = x + Math.cos(inner) * s * 0.2, iy = y + Math.sin(inner) * s * 0.2;
      if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
      ctx.lineTo(ix, iy);
    }
    ctx.closePath(); ctx.fill();
  } else if (st.type === 'bow') {
    ctx.fillStyle = st.color;
    var sb = s * 0.3;
    ctx.beginPath(); ctx.arc(x - sb, y, sb * 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + sb, y, sb * 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y + sb * 0.3, sb * 0.4, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'pearl') {
    var grad = ctx.createRadialGradient(x - s * 0.07, y - s * 0.07, s * 0.03, x, y, s * 0.5);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, st.color); grad.addColorStop(1, '#ddd');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, s * 0.45, 0, Math.PI * 2); ctx.fill();
  // --- 花朵新增 ---
  } else if (st.type === 'hydrangea') {
    var positions = [[-0.2,-0.2],[0.2,-0.2],[-0.3,0],[0,0],[0.3,0],[-0.15,0.2],[0.15,0.2]];
    for (var i = 0; i < positions.length; i++) {
      ctx.fillStyle = st.color;
      ctx.beginPath();
      ctx.arc(x + positions[i][0] * s, y + positions[i][1] * s, s * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (st.type === 'lotus') {
    for (var layer = 2; layer >= 0; layer--) {
      var count = 3 + layer;
      for (var i = 0; i < count; i++) {
        var a = (Math.PI * 2 * i) / count - Math.PI / 2 + layer * 0.3;
        ctx.fillStyle = layer === 0 ? st.center : st.color;
        ctx.beginPath();
        ctx.ellipse(x + Math.cos(a) * s * (0.15 + layer * 0.12), y + Math.sin(a) * s * (0.15 + layer * 0.12), s * 0.12, s * 0.2, a, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath(); ctx.arc(x, y, s * 0.08, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'lilybell') {
    ctx.strokeStyle = '#66bb6a'; ctx.lineWidth = Math.max(1, s * 0.06);
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.quadraticCurveTo(x - s * 0.3, y, x, y - s * 0.2);
    ctx.stroke();
    ctx.fillStyle = st.color;
    ctx.beginPath();
    ctx.ellipse(x, y - s * 0.25, s * 0.12, s * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = st.center;
    ctx.beginPath(); ctx.arc(x, y + s * 0.3, s * 0.06, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'peach') {
    for (var i = 0; i < 5; i++) {
      var a = (Math.PI * 2 * i) / 5 - Math.PI / 2;
      ctx.fillStyle = st.color;
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(a) * s * 0.25, y + Math.sin(a) * s * 0.25, s * 0.15, s * 0.22, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = st.center;
    ctx.beginPath(); ctx.arc(x, y, s * 0.1, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'osmanthus') {
    var positions = [[-0.15,-0.1],[0,-0.15],[0.15,-0.1],[-0.2,0.05],[0,0],[0.2,0.05],[-0.1,0.15],[0.1,0.15]];
    for (var i = 0; i < positions.length; i++) {
      ctx.fillStyle = st.color;
      ctx.beginPath(); ctx.arc(x + positions[i][0] * s, y + positions[i][1] * s, s * 0.1, 0, Math.PI * 2); ctx.fill();
    }
  // --- 可爱新增 ---
  } else if (st.type === 'deer') {
    ctx.fillStyle = st.color;
    ctx.beginPath(); ctx.arc(x, y + s * 0.05, s * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = Math.max(1, s * 0.06);
    ctx.beginPath(); ctx.moveTo(x - s * 0.15, y - s * 0.2); ctx.lineTo(x - s * 0.25, y - s * 0.45); ctx.lineTo(x - s * 0.1, y - s * 0.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + s * 0.15, y - s * 0.2); ctx.lineTo(x + s * 0.25, y - s * 0.45); ctx.lineTo(x + s * 0.1, y - s * 0.35); ctx.stroke();
    ctx.fillStyle = st.center;
    ctx.beginPath(); ctx.arc(x - s * 0.18, y - s * 0.07, s * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.18, y - s * 0.07, s * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(x - s * 0.18, y - s * 0.07, s * 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.18, y - s * 0.07, s * 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(x, y + s * 0.18, s * 0.05, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'unicorn') {
    ctx.fillStyle = st.color;
    ctx.beginPath(); ctx.arc(x, y, s * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.35); ctx.lineTo(x - s * 0.08, y - s * 0.55); ctx.lineTo(x + s * 0.08, y - s * 0.35);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = st.center;
    for (var i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(x - s * 0.3 + i * s * 0.1, y - s * 0.15, s * 0.1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(x - s * 0.17, y - s * 0.1, s * 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 0.17, y - s * 0.1, s * 0.05, 0, Math.PI * 2); ctx.fill();
  } else if (st.type === 'dolphin') {
    ctx.fillStyle = st.color;
    ctx.beginPath(); ctx.ellipse(x, y, s * 0.5, s * 0.2, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + s * 0.35, y - s * 0.1); ctx.lineTo(x + s * 0.55, y - s * 0.35); ctx.lineTo(x + s * 0.45, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = st.center;

// ---- 工具栏绘制 ----
function drawToolbar(ctx, game, L) {
  var barY = L.h - 78, barH = 70;
  ctx.fillStyle = 'rgba(255,255,255,0.96)';
  ctx.fillRect(0, barY, L.w, barH);
  ctx.strokeStyle = '#e0d5cc';
  ctx.beginPath(); ctx.moveTo(0, barY); ctx.lineTo(L.w, barY); ctx.stroke();

  // 分类标签
  var tabW = 55, tabH = 20, tabGap = 8;
  var tabScroll = game._tabScroll || 0;
  var maxTabScroll = Math.max(0, STICKER_CATS.length * (tabW + tabGap) - L.w + 20);
  if (tabScroll < 0) tabScroll = 0;
  if (tabScroll > maxTabScroll) tabScroll = maxTabScroll;
  game._tabScroll = tabScroll;
  for (var i = 0; i < STICKER_CATS.length; i++) {
    var tx = 10 + i * (tabW + tabGap) - tabScroll;
    if (tx < -tabW || tx > L.w) continue;
    ctx.fillStyle = game.selectedCat === i ? '#e8a0b4' : '#f0e8e0';
    ctx.beginPath(); roundedRect(ctx, tx, barY + 4, tabW, tabH, 10); ctx.fill();
    ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = game.selectedCat === i ? '#fff' : '#8b7355';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(STICKER_CATS[i], tx + tabW / 2, barY + 14);
  }

  // 当前分类贴纸
  var catStickers = STICKERS.filter(function(s){return s.cat === game.selectedCat;});
  var cGap = 10, cSize = 36;
  var cTotal = catStickers.length * cSize + (catStickers.length - 1) * cGap;
  var cScroll = game._catScroll || 0;
  var maxCScroll = Math.max(0, cTotal - L.w + 20);
  if (cScroll < 0) cScroll = 0;
  if (cScroll > maxCScroll) cScroll = maxCScroll;
  game._catScroll = cScroll;
  for (var i = 0; i < catStickers.length; i++) {
    var sx = 10 + i * (cSize + cGap) + cSize / 2 - cScroll;
    var sy = barY + 42;
    var realIdx = STICKERS.indexOf(catStickers[i]);
    var sel = game.selectedFlower === realIdx;
    if (sel) {
      ctx.fillStyle = 'rgba(232,160,180,0.15)';
      ctx.strokeStyle = '#e8a0b4'; ctx.lineWidth = 2;
      ctx.beginPath(); roundedRect(ctx, sx - cSize/2 - 2, barY + 26, cSize + 4, barH - 26, 8); ctx.fill(); ctx.stroke();
    }
    drawSticker(ctx, sx, sy, catStickers[i], false);
  }
  ctx.textAlign = 'left';
}

// ---- 绘制文字元素 ----
function drawTexts(ctx, game, cardX, cardY, cardW, cardH) {
  for (var i = 0; i < game.texts.length; i++) {
    var t = game.texts[i];
    var font = TEXT_FONTS[t.fontIdx || 0];
    var fs = (t.fontSize || 18) * (t.scale || 1);
    ctx.font = font.style + ' ' + font.weight + ' ' + fs + 'px NotoSansSC,Microsoft YaHei,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    var w = t.text.length * fs;
    var h = fs + 8;

    // 选中时画虚线边框
    if (i === game.selText) {
      ctx.strokeStyle = '#e8a0b4';
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(t.x - w/2 - 4, t.y - h/2 - 2, w + 8, h + 4);
      ctx.setLineDash([]);
    }

    if (font.effect === 'shadow') {
      ctx.shadowColor = 'rgba(212,106,126,0.5)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = font.color;
      ctx.fillText(t.text, t.x, t.y);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
    } else if (font.effect === 'stroke') {
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = font.color;
      ctx.fillText(t.text, t.x, t.y);
    } else if (font.effect === 'gradient') {
      var grad = ctx.createLinearGradient(t.x - w/2, t.y - h/2, t.x + w/2, t.y + h/2);
      grad.addColorStop(0, '#e65100');
      grad.addColorStop(0.5, '#f9a825');
      grad.addColorStop(1, '#e65100');
      ctx.fillStyle = grad;
      ctx.fillText(t.text, t.x, t.y);
    } else if (font.effect === 'glow') {
      ctx.shadowColor = 'rgba(46,125,50,0.6)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.fillStyle = font.color;
      ctx.fillText(t.text, t.x, t.y);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = font.color;
      ctx.fillText(t.text, t.x, t.y);
    }
  }
  ctx.textAlign = 'left';
}

// ==================== 首页 ====================
function drawIdle(ctx, game, L) {
  ctx.fillStyle = BODY_BG;
  ctx.fillRect(0, 0, L.w, L.h);

  // 草稿箱界面
  if (game.showingDrafts) {
    // 柔和渐变背景
    var bgGrad = ctx.createLinearGradient(0, 0, 0, L.h);
    bgGrad.addColorStop(0, '#fff8f0');
    bgGrad.addColorStop(0.5, '#fff0e6');
    bgGrad.addColorStop(1, '#ffe8d6');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, L.w, L.h);

    // 顶部标题
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = '#5d4037';
    ctx.fillText('📂 我的卡片', L.w / 2, 60 + SAFE_TOP);
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#a1887f';
    ctx.fillText('共 ' + drafts.length + ' 张卡片', L.w / 2, 88 + SAFE_TOP);

    // 标题下装饰线
    ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L.w/2 - 60, 100 + SAFE_TOP); ctx.lineTo(L.w/2 + 60, 100 + SAFE_TOP); ctx.stroke();

    // 卡片列表
    var cardW = L.w - 56, cardH = 120, gap = 12;
    var sx = 28, sy = 118 + SAFE_TOP;

    for (var i = 0; i < drafts.length; i++) {
      var d = drafts[i];
      var cy = sy + i * (cardH + gap);
      var hover = game._hoverDraft === i;

      // 卡片阴影
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.beginPath(); roundedRect(ctx, sx + 2, cy + 3, cardW, cardH, 16); ctx.fill();

      // 卡片背景
      ctx.fillStyle = '#fff';
      ctx.beginPath(); roundedRect(ctx, sx, cy, cardW, cardH, 16); ctx.fill();

      // 选中/悬停边框
      ctx.strokeStyle = hover ? '#d46a7e' : '#e0d5cc';
      ctx.lineWidth = hover ? 2.5 : 1.2;
      ctx.beginPath(); roundedRect(ctx, sx, cy, cardW, cardH, 16); ctx.stroke();

      // 迷你预览（左侧）
      var miniW = 80, miniH = 56, miniX = sx + 14, miniY = cy + 14;
      var miniCard = CARDS[d.selectedCard || 0];
      var miniGrad = ctx.createLinearGradient(miniX, miniY, miniX + miniW, miniY + miniH);
      miniGrad.addColorStop(0, miniCard.bg1); miniGrad.addColorStop(1, miniCard.bg2);
      ctx.fillStyle = miniGrad;
      ctx.beginPath(); roundedRect(ctx, miniX, miniY, miniW, miniH, 6); ctx.fill();
      ctx.strokeStyle = miniCard.border; ctx.lineWidth = 1.5;
      ctx.beginPath(); roundedRect(ctx, miniX + 1, miniY + 1, miniW - 2, miniH - 2, 5); ctx.stroke();
      // 小圆点代表贴纸
      if (d.data && d.data.placedFlowers) {
        var dotCount = Math.min(d.data.placedFlowers.length, 4);
        for (var di = 0; di < dotCount; di++) {
          var pf = d.data.placedFlowers[di];
          var st = STICKERS[pf.type];
          var dotX = miniX + 15 + (di % 2) * 25;
          var dotY = miniY + 15 + Math.floor(di / 2) * 20;
          ctx.fillStyle = st.color;
          ctx.beginPath(); ctx.arc(dotX, dotY, 4, 0, Math.PI * 2); ctx.fill();
        }
      }

      // 状态标签（暂存中 / 已完成）
      var labelText = d.status === 'done' ? '已完成' : '暂存中';
      var labelColor = d.status === 'done' ? '#81c784' : '#f9a825';
      var labelBg = d.status === 'done' ? 'rgba(129,199,132,0.15)' : 'rgba(249,168,37,0.15)';
      var labelW = 50, labelH = 18, labelX = sx + 102, labelY = cy + 14;
      ctx.fillStyle = labelBg;
      ctx.beginPath(); roundedRect(ctx, labelX, labelY, labelW, labelH, 9); ctx.fill();
      ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = labelColor;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(labelText, labelX + labelW / 2, labelY + labelH / 2);

      // 标题
      ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#3e2723';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(d.title, sx + 102, cy + 42);

      // 时间和统计
      ctx.font = '11px sans-serif'; ctx.fillStyle = '#8d6e63';
      ctx.fillText(d.date + ' · ' + d.stickerCount + '贴纸 · ' + d.textCount + '文字', sx + 102, cy + 62);

      // 继续编辑按钮
      var editBtnW = 72, editBtnH = 28, editBtnX = sx + cardW - 16 - editBtnW - 80, editBtnY = cy + cardH - 40;
      ctx.fillStyle = '#d46a7e';
      ctx.beginPath(); roundedRect(ctx, editBtnX, editBtnY, editBtnW, editBtnH, 14); ctx.fill();
      ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('继续编辑', editBtnX + editBtnW/2, editBtnY + editBtnH/2);

      // 删除按钮
      var delBtnW = 56, delBtnH = 28, delBtnX = sx + cardW - 16 - delBtnW, delBtnY = cy + cardH - 40;
      ctx.fillStyle = '#e0e0e0';
      ctx.beginPath(); roundedRect(ctx, delBtnX, delBtnY, delBtnW, delBtnH, 14); ctx.fill();
      ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#757575';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('删除', delBtnX + delBtnW/2, delBtnY + delBtnH/2);
    }

    // 空状态提示
    if (drafts.length === 0) {
      ctx.font = '14px sans-serif'; ctx.fillStyle = '#a1887f';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('暂无卡片，快去创作一张吧~', L.w / 2, sy + 60);
    }

    // 返回按钮
    var by = sy + Math.max(drafts.length, 1) * (cardH + gap) + 10;
    if (by > L.h - 60) by = L.h - 60;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); roundedRect(ctx, L.w/2 - 55, by, 110, 38, 19); ctx.fill();
    ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 1;
    ctx.beginPath(); roundedRect(ctx, L.w/2 - 55, by, 110, 38, 19); ctx.stroke();
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#5d4037';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('← 返回', L.w / 2, by + 19);
    ctx.textAlign = 'left';
    return;
  }

  // 主题选择界面
  if (game.showingThemes) {
    // 柔和渐变背景
    var bgGrad = ctx.createLinearGradient(0, 0, 0, L.h);
    bgGrad.addColorStop(0, '#fff8f0');
    bgGrad.addColorStop(0.5, '#fff0e6');
    bgGrad.addColorStop(1, '#ffe8d6');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, L.w, L.h);

    // 装饰圆点
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#d46a7e';
    ctx.beginPath(); ctx.arc(L.w - 40, 60 + SAFE_TOP, 60, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#81c784';
    ctx.beginPath(); ctx.arc(30, 180 + SAFE_TOP, 40, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#64b5f6';
    ctx.beginPath(); ctx.arc(L.w - 25, 340 + SAFE_TOP, 30, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // 顶部标题
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = '#5d4037';
    ctx.fillText('🎨 选择主题', L.w / 2, 60 + SAFE_TOP);
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#a1887f';
    ctx.fillText('为重要的人，定制一份专属心意', L.w / 2, 88 + SAFE_TOP);

    // 标题下装饰线
    ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L.w/2 - 60, 100 + SAFE_TOP); ctx.lineTo(L.w/2 + 60, 100 + SAFE_TOP); ctx.stroke();

    // 主题卡片 - 全宽单列，更大气（缩小以适配8个主题）
    var cardW = L.w - 56, cardH = 72, gap = 8;
    var sx = 28, sy = 118 + SAFE_TOP;

    for (var i = 0; i < THEMES.length; i++) {
      var t = THEMES[i];
      var cy = sy + i * (cardH + gap);
      var hover = game._hoverTheme === i;

      // 卡片阴影
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.beginPath(); roundedRect(ctx, sx + 2, cy + 3, cardW, cardH, 16); ctx.fill();

      // 卡片背景渐变
      var cGrad = ctx.createLinearGradient(sx, cy, sx + cardW, cy + cardH);
      cGrad.addColorStop(0, t.color + '18');
      cGrad.addColorStop(1, '#ffffff');
      ctx.fillStyle = cGrad;
      ctx.beginPath(); roundedRect(ctx, sx, cy, cardW, cardH, 16); ctx.fill();

      // 左侧彩色条
      ctx.fillStyle = t.color;
      ctx.beginPath(); roundedRect(ctx, sx + 3, cy + 12, 5, cardH - 24, 3); ctx.fill();

      // 选中/悬停边框
      ctx.strokeStyle = hover ? t.color : t.color + '44';
      ctx.lineWidth = hover ? 2.5 : 1.2;
      ctx.beginPath(); roundedRect(ctx, sx, cy, cardW, cardH, 16); ctx.stroke();

      // 图标背景圆
      ctx.fillStyle = t.color + '22';
      ctx.beginPath(); ctx.arc(sx + 38, cy + cardH/2, 22, 0, Math.PI * 2); ctx.fill();

      // 图标
      ctx.font = '24px sans-serif'; ctx.fillStyle = t.color;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.icon, sx + 38, cy + cardH/2);

      // 主题名称
      ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#3e2723';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(t.name, sx + 72, cy + cardH/2 - 9);

      // 描述
      ctx.font = '11px sans-serif'; ctx.fillStyle = '#8d6e63';
      ctx.fillText(getThemeDesc(t.key), sx + 72, cy + cardH/2 + 12);

      // 右侧箭头提示
      ctx.font = '14px sans-serif'; ctx.fillStyle = '#bcaaa4';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText('›', sx + cardW - 16, cy + cardH/2);
    }

    // 返回按钮
    var by = sy + THEMES.length * (cardH + gap) + 10;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); roundedRect(ctx, L.w/2 - 55, by, 110, 38, 19); ctx.fill();
    ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 1;
    ctx.beginPath(); roundedRect(ctx, L.w/2 - 55, by, 110, 38, 19); ctx.stroke();
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#5d4037';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('← 返回', L.w / 2, by + 19);
    ctx.textAlign = 'left';
    return;
  }

  ctx.fillStyle = TEXT_C;
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('心意明信片', L.w / 2, 90 + SAFE_TOP);
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#8b7355';
  ctx.fillText('选风格 · 贴花材 · 送祝福', L.w / 2, 120 + SAFE_TOP);

  // 送/收计数
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#8b7355';
  ctx.fillText('共 ' + drafts.length + ' 张卡片', L.w / 2, 142 + SAFE_TOP);

  // 明信片风格 3x3
  var cols = 3, cardW = 100, cardH = 60, gap = 12;
  var gridW = cols * cardW + (cols - 1) * gap;
  var sx = (L.w - gridW) / 2, sy = 162 + SAFE_TOP;

  for (var row = 0; row < 3; row++) {
    for (var col = 0; col < cols; col++) {
      var i = row * cols + col;
      if (i >= CARDS.length) break;
      var card = CARDS[i];
      var cx = sx + col * (cardW + gap) + cardW / 2;
      var cy = sy + row * (cardH + gap) + cardH / 2;
      var sel = game.selectedCard === i;

      var grad = ctx.createLinearGradient(cx - cardW/2, cy - cardH/2, cx + cardW/2, cy + cardH/2);
      grad.addColorStop(0, card.bg1); grad.addColorStop(1, card.bg2);
      ctx.fillStyle = grad;
      ctx.strokeStyle = sel ? card.accent : '#ddd';
      ctx.lineWidth = sel ? 3 : 1;
      ctx.beginPath(); roundedRect(ctx, cx - cardW/2, cy - cardH/2, cardW, cardH, 10); ctx.fill(); ctx.stroke();

      ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = TEXT_C;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(card.name, cx, cy);
    }
  }

  // 主题创作按钮
  var rndBtnY = L.h - 130;
  ctx.fillStyle = '#9b59b6';
  ctx.beginPath(); roundedRect(ctx, L.w/2 - 90, rndBtnY, 180, 40, 20); ctx.fill();
  ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🎨 主题创作', L.w / 2, rndBtnY + 20);

  // 我的卡片按钮
  var draftBtnY = L.h - 80;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); roundedRect(ctx, L.w/2 - 90, draftBtnY, 180, 40, 20); ctx.fill();
  ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 1;
  ctx.beginPath(); roundedRect(ctx, L.w/2 - 90, draftBtnY, 180, 40, 20); ctx.stroke();
  ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = '#5d4037';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('📂 我的卡片', L.w / 2, draftBtnY + 20);

  // 开始创作
  var btnY = L.h - 180;
  ctx.fillStyle = game.selectedCard >= 0 ? '#d46a7e' : '#d0d0d0';
  ctx.beginPath(); roundedRect(ctx, L.w/2 - 90, btnY, 180, 46, 23); ctx.fill();
  ctx.font = 'bold 19px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('开始创作', L.w / 2, btnY + 23);
  ctx.textAlign = 'left';
}

// ==================== 创作页 ====================
function drawArranging(ctx, game, L) {
  ctx.fillStyle = BODY_BG;
  ctx.fillRect(0, 0, L.w, L.h);

  var card = CARDS[game.selectedCard];
  var cardX = L.cardX, cardY = L.cardY, cardW = L.cardW, cardH = L.cardH;

  // 卡片顶栏：撤回/恢复/预览
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); roundedRect(ctx, cardX + 12, cardY + 8, 120, 22, 11); ctx.fill();
  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = game.undoStack.length ? '#8b7355' : '#ccc';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('↩', cardX + 30, cardY + 19);
  ctx.fillStyle = game.redoStack.length ? '#8b7355' : '#ccc';
  ctx.fillText('↪', cardX + 58, cardY + 19);
  ctx.fillStyle = '#e8a0b4';
  ctx.fillText('👁 预览', cardX + 102, cardY + 19);
  ctx.textAlign = 'left';

  // 卡片阴影
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.beginPath(); roundedRect(ctx, cardX + 3, cardY + 3, cardW, cardH, 16); ctx.fill();

  // 明信片背景
  var bgGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
  bgGrad.addColorStop(0, card.bg1); bgGrad.addColorStop(1, card.bg2);
  ctx.fillStyle = bgGrad;
  ctx.beginPath(); roundedRect(ctx, cardX, cardY, cardW, cardH, 16); ctx.fill();

  // 画布区图案（整个卡片区域）
  ctx.save();
  ctx.beginPath(); roundedRect(ctx, cardX, cardY, cardW, cardH, 16); ctx.clip();
  drawCardPattern(ctx, card, { cardX: cardX, cardY: cardY, cardW: cardW, cardH: cardH });
  ctx.restore();

  // 卡片边框
  ctx.strokeStyle = card.border; ctx.lineWidth = 2.5;
  ctx.beginPath(); roundedRect(ctx, cardX + 2, cardY + 2, cardW - 4, cardH - 4, 14); ctx.stroke();

  // 已放置贴纸（整个卡片区域）
  for (var i = 0; i < game.placedFlowers.length; i++) {
    var f = game.placedFlowers[i];
    drawSticker(ctx, f.x, f.y, STICKERS[f.type], i === game.selectedPlaced, f.scale);
  }

  // 绘制文字元素
  drawTexts(ctx, game, cardX, cardY, cardW, cardH);

  // 绘制缩放手柄和删除按钮
  if (game.selectedPlaced >= 0) {
    var f = game.placedFlowers[game.selectedPlaced];
    var st = STICKERS[f.type];
    var sc = f.scale || 1;
    var hs = st.size * sc;
    // 缩放手柄（右下角）
    drawResizeHandle(ctx, f.x + hs, f.y + hs);
    // 删除按钮（左上角）
    drawDeleteBtn(ctx, f.x - hs, f.y - hs);
  }
  if (game.selText >= 0) {
    var t = game.texts[game.selText];
    var fs = (t.fontSize || 18) * (t.scale || 1);
    var w = t.text.length * fs;
    var h = fs + 8;
    // 缩放手柄（右下角）
    drawResizeHandle(ctx, t.x + w/2 + 4, t.y + h/2 + 2);
    // 删除按钮（左上角）
    drawDeleteBtn(ctx, t.x - w/2 - 4, t.y - h/2 - 2);
  }

  // 操作按钮栏（返回 / 添加祝福 / 随机 / 换字体 / 暂存 / 完成）
  // 与工具栏左右对齐（barLeft=10, barRight=L.w-10）
  var actionBarY = cardY + cardH + 8;
  var barLeft = 10, barRight = L.w - 10;
  var barW = barRight - barLeft;
  var btnH = 30, btnR = 10;
  // 6个按钮等宽分布，间距4px
  var btnGap = 4;
  var btnW = (barW - (6 - 1) * btnGap) / 6;
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  var actionBtns = [
    { label: '←返回', color: '#8b7355' },
    { label: '+祝福', color: '#e8a0b4' },
    { label: '✨随机', color: '#9b59b6' },
    { label: '换字', color: '#5dade2' },
    { label: '暂存', color: '#9b59b6' },
    { label: '完成', color: '#d46a7e' },
  ];
  for (var b = 0; b < actionBtns.length; b++) {
    var ab = actionBtns[b];
    var abx = barLeft + b * (btnW + btnGap);
    ctx.fillStyle = ab.color;
    ctx.beginPath(); roundedRect(ctx, abx, actionBarY, btnW, btnH, btnR); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(ab.label, abx + btnW / 2, actionBarY + btnH / 2);
  }
  ctx.textAlign = 'left';

  // 底部工具栏
  drawToolbar(ctx, game, L);

  // 预览覆盖层
  if (game.showPreview) drawPreviewOverlay(ctx, game, L);
}

// ==================== 预览页 ====================
function drawPreview(ctx, game, L) {
  ctx.fillStyle = BODY_BG; ctx.fillRect(0, 0, L.w, L.h);
  var card = CARDS[game.selectedCard];
  var cardX = L.cardX, cardY = L.cardY, cardW = L.cardW, cardH = L.cardH;

  var bgGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
  bgGrad.addColorStop(0, card.bg1); bgGrad.addColorStop(1, card.bg2);
  ctx.fillStyle = bgGrad;
  ctx.beginPath(); roundedRect(ctx, cardX, cardY, cardW, cardH, 14); ctx.fill();
  drawCardPattern(ctx, card, L);
  ctx.strokeStyle = card.border; ctx.lineWidth = 2;
  ctx.beginPath(); roundedRect(ctx, cardX + 3, cardY + 3, cardW - 6, cardH - 6, 11); ctx.stroke();
  ctx.strokeStyle = card.border; ctx.lineWidth = 1;
  ctx.beginPath(); roundedRect(ctx, cardX + 10, cardY + 10, cardW - 20, cardH - 20, 6); ctx.stroke();

  for (var i = 0; i < game.placedFlowers.length; i++) {
    var f = game.placedFlowers[i];
    drawSticker(ctx, f.x, f.y, STICKERS[f.type], false);
  }

  // 绘制文字元素
  drawTexts(ctx, game, cardX, cardY, cardW, cardH);

  // 保存图片按钮
  var saveBtnY = cardY + cardH + 10;
  ctx.fillStyle = '#3498db';
  ctx.beginPath(); roundedRect(ctx, L.w/2 - 70, saveBtnY, 140, 34, 17); ctx.fill();
  ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('💾 保存图片', L.w / 2, saveBtnY + 17);

  // 再来一次
  var retryY = saveBtnY + 38;
  ctx.fillStyle = '#e8a0b4';
  ctx.beginPath(); roundedRect(ctx, L.w/2 - 70, retryY, 140, 30, 15); ctx.fill();
  ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('再来一次', L.w / 2, retryY + 15);

  ctx.textAlign = 'left';
}

function getThemeDesc(key) {
  var descs = {
    family: '给父母/家人的温暖',
    friend: '给闺蜜/兄弟的真心',
    love: '给恋人/心上人的浪漫',
    colleague: '给工作伙伴的感谢',
    leader: '给领导的敬意'
  };
  return descs[key] || '';
}

function applyTheme(themeIdx) {
  var t = THEMES[themeIdx];
  game.selectedCard = t.cardIdx;
  game.blessing = t.blessing;
  game.selectedFlower = -1;
  game.selectedPlaced = -1;
  game.selText = -1;

  // 使用模板布局
  if (t.template) {
    game.placedFlowers = [];
    var cx = layout.cardX, cy = layout.cardY, cw = layout.cardW, ch = layout.cardH;
    for (var i = 0; i < t.template.flowers.length; i++) {
      var f = t.template.flowers[i];
      var stickerIdx = -1;
      for (var j = 0; j < STICKERS.length; j++) {
        if (STICKERS[j].name === f.name) { stickerIdx = j; break; }
      }
      if (stickerIdx >= 0) {
        game.placedFlowers.push({
          type: stickerIdx,
          x: cx + f.rx * cw,
          y: cy + f.ry * ch,
          scale: f.scale || 1
        });
      }
    }
    game.texts = [];
    for (var i = 0; i < t.template.texts.length; i++) {
      var tt = t.template.texts[i];
      game.texts.push({
        text: tt.text,
        x: cx + tt.rx * cw,
        y: cy + tt.ry * ch,
        fontIdx: tt.fontIdx,
        fontSize: tt.fontSize || 18,
        color: TEXT_FONTS[tt.fontIdx].color,
        scale: tt.scale || 1
      });
    }
  } else {
    // 向后兼容：如果没有 template 则随机（理论上不会触发）
    game.placedFlowers = [];
    var card = { cardX: 24, cardY: layout.cardY, cardW: layout.w - 48, cardH: 480 };
    for (var i = 0; i < t.stickers.length; i++) {
      var stickerName = t.stickers[i];
      var stickerIdx = -1;
      for (var j = 0; j < STICKERS.length; j++) {
        if (STICKERS[j].name === stickerName) { stickerIdx = j; break; }
      }
      if (stickerIdx >= 0) {
        game.placedFlowers.push({
          type: stickerIdx,
          x: card.cardX + 30 + Math.random() * (card.cardW - 60),
          y: card.cardY + 30 + Math.random() * (card.cardH - 60),
          scale: 1
        });
      }
    }
    game.texts = [{
      text: t.blessing,
      x: card.cardX + card.cardW / 2,
      y: card.cardY + card.cardH / 2 + 80,
      fontIdx: t.fontIdx,
      fontSize: 18,
      color: TEXT_FONTS[t.fontIdx].color,
      scale: 1
    }];
  }
}

// ============================================================
// 输入弹窗（替代 prompt）
// ============================================================

var hiddenInput = document.getElementById('hiddenInput');

function showInputPopup(title, defaultValue, callback, editingTextIdx) {
  game.inputPopup = { title: title || '请输入', value: defaultValue || '', callback: callback, editingTextIdx: editingTextIdx !== undefined ? editingTextIdx : -1 };
  hiddenInput.value = game.inputPopup.value;
  // 延迟聚焦确保浏览器不会阻止
  setTimeout(function() { hiddenInput.focus(); }, 50);
}

function hideInputPopup() {
  if (game.inputPopup && game.inputPopup.callback) {
    game.inputPopup.callback(game.inputPopup.value);
  }
  game.inputPopup = null;
  hiddenInput.blur();
  hiddenInput.value = '';
}

function cancelInputPopup() {
  game.inputPopup = null;
  hiddenInput.blur();
  hiddenInput.value = '';
}

function drawInputPopup(ctx, game, L) {
  if (!game.inputPopup) return;
  var popup = game.inputPopup;

  // 遮罩
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, L.w, L.h);

  // 弹窗尺寸
  var pw = L.w - 48, ph = 200;
  var px = 24, py = (L.h - ph) / 2 - 20;

  // 弹窗阴影
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); roundedRect(ctx, px + 3, py + 4, pw, ph, 18); ctx.fill();

  // 弹窗背景
  ctx.fillStyle = '#fff';
  ctx.beginPath(); roundedRect(ctx, px, py, pw, ph, 18); ctx.fill();
  ctx.strokeStyle = '#e0d5cc'; ctx.lineWidth = 1;
  ctx.beginPath(); roundedRect(ctx, px, py, pw, ph, 18); ctx.stroke();

  // 标题
  ctx.font = 'bold 17px sans-serif'; ctx.fillStyle = '#3e2723';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(popup.title, L.w / 2, py + 30);

  // 输入框背景
  var inputX = px + 20, inputY = py + 50, inputW = pw - 40, inputH = 42;
  ctx.fillStyle = '#faf8f5';
  ctx.beginPath(); roundedRect(ctx, inputX, inputY, inputW, inputH, 10); ctx.fill();
  ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); roundedRect(ctx, inputX, inputY, inputW, inputH, 10); ctx.stroke();

  // 输入文字（加闪烁光标）
  ctx.font = '16px sans-serif'; ctx.fillStyle = '#3e2723';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  var displayText = popup.value;
  var textX = inputX + 12, textY = inputY + inputH / 2;
  // 截断过长的文字
  var maxTextW = inputW - 30;
  while (ctx.measureText(displayText).width > maxTextW && displayText.length > 0) {
    displayText = displayText.substring(0, displayText.length - 1);
  }
  ctx.fillText(displayText, textX, textY);
  // 光标闪烁
  var cursorVisible = Math.floor(Date.now() / 500) % 2 === 0;
  if (cursorVisible) {
    var cursorX = textX + ctx.measureText(displayText).width + 1;
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cursorX, textY - 10); ctx.lineTo(cursorX, textY + 10); ctx.stroke();
  }

  // 按钮行
  var btnY = py + ph - 52;
  var btnW = (pw - 60) / 2, btnH = 38;

  // 取消按钮
  ctx.fillStyle = '#f5f0eb';
  ctx.beginPath(); roundedRect(ctx, px + 20, btnY, btnW, btnH, 10); ctx.fill();
  ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 1;
  ctx.beginPath(); roundedRect(ctx, px + 20, btnY, btnW, btnH, 10); ctx.stroke();
  ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#8d6e63';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('取消', px + 20 + btnW / 2, btnY + btnH / 2);

  // 确定按钮
  var confirmX = px + 40 + btnW;
  ctx.fillStyle = '#d46a7e';
  ctx.beginPath(); roundedRect(ctx, confirmX, btnY, btnW, btnH, 10); ctx.fill();
  ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('确定', confirmX + btnW / 2, btnY + btnH / 2);
}

function hitTestPopupConfirm(x, y, L) {
  if (!game.inputPopup) return false;
  var pw = L.w - 48, ph = 200;
  var px = 24, py = (L.h - ph) / 2 - 20;
  var btnY = py + ph - 52;
  var btnW = (pw - 60) / 2, btnH = 38;
  var confirmX = px + 40 + btnW;

function hitTestPopupCancel(x, y, L) {

  var btnY = py + ph - 52;

// 监听隐藏input的输入事件
hiddenInput.addEventListener('input', function() {
  if (game.inputPopup) {
    game.inputPopup.value = hiddenInput.value;
  }
});

hiddenInput.addEventListener('keydown', function(e) {
  if (!game.inputPopup) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    hideInputPopup();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    cancelInputPopup();
  }
});

// 点击检测函数
// ============================================================

function hitTestCard(x, y) {
  var cols = 3, cardW = 100, cardH = 60, gap = 12;
  var gridW = cols * cardW + (cols - 1) * gap;
  var sx = (LOGIC_W - gridW) / 2, sy = 162 + SAFE_TOP;
  for (var row = 0; row < 3; row++) {
    for (var col = 0; col < cols; col++) {
      var i = row * cols + col;
      if (i >= CARDS.length) break;
      var cx = sx + col * (cardW + gap) + cardW / 2;
      if (x >= cx - cardW/2 && x <= cx + cardW/2 && y >= sy + row * (cardH + gap) && y <= sy + row * (cardH + gap) + cardH) return i;
    }
  }
  return -1;
}

function hitTestCatTab(x, y, L) {
  var barY = L.h - 78;
  var tabW = 55, tabH = 20, tabGap = 8;
  var tabScroll = game._tabScroll || 0;
  var maxTabScroll = Math.max(0, STICKER_CATS.length * (tabW + tabGap) - L.w + 20);
  if (tabScroll < 0) tabScroll = 0;
  if (tabScroll > maxTabScroll) tabScroll = maxTabScroll;
  for (var i = 0; i < STICKER_CATS.length; i++) {
    var tx = 10 + i * (tabW + tabGap) - tabScroll;
    if (x >= tx && x <= tx + tabW && y >= barY + 4 && y <= barY + 4 + tabH) return i;
  }
  return -1;
}

function hitTestSticker(x, y, game, L) {
  var barY = L.h - 78, barH = 70;
  var catStickers = STICKERS.filter(function(s){return s.cat === game.selectedCat;});
  var cGap = 10, cSize = 36;
  var cScroll = game._catScroll || 0;
  for (var i = 0; i < catStickers.length; i++) {
    var sx = 10 + i * (cSize + cGap) + cSize / 2 - cScroll;
    if (x >= sx - cSize/2 && x <= sx + cSize/2 && y >= barY + 28 && y <= barY + barH) {
      return STICKERS.indexOf(catStickers[i]);
    }
  }
  return -1;
}

function hitTestBlessingBar(x, y, L) {
  var splitY = L.cardY + L.cardH - 90;
  var barY = Math.min(splitY + 102, L.h - 162), barH = 32;
  var sample = BLESSINGS.slice(0, 5);
  var gap = 6, bw = (L.w - 60) / sample.length;
  for (var i = 0; i < sample.length; i++) {
    var bx = 20 + i * (bw + gap);
    if (x >= bx && x <= bx + bw - gap && y >= barY && y <= barY + barH) return i;
  }
  return -1;
}

function hitTestFinish(x, y, L) {
  var actionBarY = L.cardY + L.cardH + 8;
  var barLeft = 10, barRight = L.w - 10;
  var barW = barRight - barLeft;
  var btnGap = 4;
  var btnW = (barW - 5 * btnGap) / 6;
  var bx5 = barLeft + 5 * (btnW + btnGap); // 第6个按钮（完成，索引5）
  return x >= bx5 && x <= bx5 + btnW && y >= actionBarY && y <= actionBarY + 30;
}

function drawResizeHandle(ctx, x, y) {
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#e8a0b4';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

function drawDeleteBtn(ctx, x, y) {
  var r = 10;
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  // 绘制 X 叉号
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + 4, y + 4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 4, y - 4); ctx.lineTo(x - 4, y + 4);
  ctx.stroke();
  ctx.lineCap = 'butt';
}

function hitTestDeleteBtn(x, y, game) {
  if (game.selectedPlaced >= 0) {
    var f = game.placedFlowers[game.selectedPlaced];
    var st = STICKERS[f.type];
    var sc = f.scale || 1;
    var hs = st.size * sc;
    var dx = f.x - hs, dy = f.y - hs;
    if (Math.abs(x - dx) < 12 && Math.abs(y - dy) < 12) return { type: 'sticker', idx: game.selectedPlaced };
  }
  if (game.selText >= 0) {
    var t = game.texts[game.selText];
    var fs = (t.fontSize || 18) * (t.scale || 1);
    var w = t.text.length * fs;
    var h = fs + 8;
    var dx = t.x - w/2 - 4, dy = t.y - h/2 - 2;
    if (Math.abs(x - dx) < 12 && Math.abs(y - dy) < 12) return { type: 'text', idx: game.selText };
  }
  return null;
}

function hitTestResizeHandle(x, y, game) {
  if (game.selectedPlaced >= 0) {
    var f = game.placedFlowers[game.selectedPlaced];
    var st = STICKERS[f.type];
    var sc = f.scale || 1;
    var hx = f.x + st.size * sc;
    var hy = f.y + st.size * sc;
    if (Math.abs(x - hx) < 10 && Math.abs(y - hy) < 10) return { type: 'sticker', idx: game.selectedPlaced };
  }
  if (game.selText >= 0) {
    var t = game.texts[game.selText];
    var fs = (t.fontSize || 18) * (t.scale || 1);
    var w = t.text.length * fs;
    var h = fs + 8;
    var hx = t.x + w/2 + 4;
    var hy = t.y + h/2 + 2;
    if (Math.abs(x - hx) < 10 && Math.abs(y - hy) < 10) return { type: 'text', idx: game.selText };
  }
  return null;
}

function hitTestText(x, y) {
  for (var i = game.texts.length - 1; i >= 0; i--) {
    var t = game.texts[i];
    var fs = (t.fontSize || 18) * (t.scale || 1);
    var w = t.text.length * fs;
    var h = fs + 8;
    if (x >= t.x - w/2 && x <= t.x + w/2 && y >= t.y - h/2 && y <= t.y + h/2) return i;
  }
  return -1;
}

function hitTestSaveBtn(x, y, L) {
  var pw = 280, ph = 330;
  var py = (L.h - ph) / 2;
  var btnW = 160, btnH = 40, btnX = L.w/2 - btnW/2, btnY = py + ph - 72;
  return x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH;
}

function hitTestShareBtn(x, y, L) {
  var pw = 280, ph = 330;
  var py = (L.h - ph) / 2;
  var shareW = 180, shareH = 40, shareX = L.w/2 - shareW/2, shareY = py + ph - 122;
  return x >= shareX && x <= shareX + shareW && y >= shareY && y <= shareY + shareH;
}

function hitTestPreviewClose(x, y, L) {
  var pw = 280, ph = 330;
  var px = (L.w - pw) / 2, py = (L.h - ph) / 2;
  return x >= px + pw - 36 && x <= px + pw && y >= py + 8 && y <= py + 30;
}



function hitTestCardArea(x, y, L) {
  return x >= L.cardX && x <= L.cardX + L.cardW && y >= L.cardY && y <= L.cardY + L.cardH;
}

function hitTestPlaced(x, y, game) {
  for (var i = game.placedFlowers.length - 1; i >= 0; i--) {
    var f = game.placedFlowers[i];
    var st = STICKERS[f.type];
    if (st && Math.abs(x - f.x) < st.size && Math.abs(y - f.y) < st.size) return i;
  }
  return -1;
}

function hitTestNewGame(x, y, L) {
  var btnY = L.cardY + L.cardH + 48;
  return x >= L.w/2 - 70 && x <= L.w/2 + 70 && y >= btnY && y <= btnY + 30;
}

function hitTestBlessing(x, y, L) {
  var bY = L.cardY + L.cardH + 88;
  for (var i = 0; i < 9; i++) {
    if (x > 40 && x < L.w - 40 && y > bY + i * 18 - 8 && y < bY + i * 18 + 8) return i;
  }
  return -1;
}

// ============================================================
// 游戏循环
// ============================================================

function gameLoop() {
  requestAnimationFrame(gameLoop);
  if (game.phase === 'idle') drawIdle(ctx, game, layout);
  else if (game.phase === 'arranging') drawArranging(ctx, game, layout);
  else if (game.phase === 'preview') drawPreview(ctx, game, layout);
  // 输入弹窗（最顶层）
  drawInputPopup(ctx, game, layout);
  // Toast提示（最最顶层）
  if (game.toast) {
    var elapsed = Date.now() - game.toastTime;
    var alpha = elapsed < 300 ? elapsed / 300 : elapsed > 1700 ? (2000 - elapsed) / 300 : 1;
    alpha = Math.max(0, Math.min(1, alpha));
    ctx.save();
    ctx.globalAlpha = alpha;
    var toastY = SAFE_TOP + 10;
    ctx.font = 'bold 14px sans-serif';
    var tw = ctx.measureText(game.toast).width;
    var toastW = tw + 40;
    var toastX = (layout.w - toastW) / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.beginPath(); roundedRect(ctx, toastX, toastY, toastW, 32, 16); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(game.toast, layout.w / 2, toastY + 16);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

// ============================================================
// 事件处理：鼠标 + 触摸 兼容
// ============================================================

function getEventPos(e) {
  if (e.touches && e.touches.length > 0) {
    return toLogic(e.touches[0].clientX, e.touches[0].clientY);
  }
  if (e.changedTouches && e.changedTouches.length > 0) {
    return toLogic(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
  return toLogic(e.clientX, e.clientY);
}

// -- touch start --
function onTouchStart(e) {
  e.preventDefault();
  if (e.touches && !e.touches.length) return;
  var pos = getEventPos(e);
  var x = pos.x, y = pos.y;
  game._touchTime = Date.now();
  game._touchX = x; game._touchY = y; game._lastX = x;

  // 输入弹窗优先处理
  if (game.inputPopup) {
    if (hitTestPopupConfirm(x, y, layout)) { hideInputPopup(); return; }
    if (hitTestPopupCancel(x, y, layout)) { cancelInputPopup(); return; }
    return;
  }

  if (game.phase === 'idle') handleIdle(x, y);
  else if (game.phase === 'arranging') handleArrangeStart(x, y);
  else if (game.phase === 'preview') handlePreview(x, y);
}

// -- touch move --
function onTouchMove(e) {
  e.preventDefault();
  if (e.touches && !e.touches.length) return;
  var pos = getEventPos(e);
  var x = pos.x, y = pos.y;

  // 主题选择hover反馈
  if (game.phase === 'idle' && game.showingThemes) {
    game._hoverTheme = hitTestThemeCard(x, y);
  }
  // 草稿箱hover反馈
  if (game.phase === 'idle' && game.showingDrafts) {
    var draftHover = hitTestDraftCard(x, y);
    if (draftHover < 0) draftHover = hitTestDraftDelete(x, y);
    game._hoverDraft = draftHover;
  }

  if (game.phase === 'arranging' && game.dragging !== null && game.dragging >= 0) {
    game.placedFlowers[game.dragging].x = x;
    game.placedFlowers[game.dragging].y = y;
  }
  // 文字拖拽
  if (game.phase === 'arranging' && game.draggingText && game.selText >= 0) {
    game.texts[game.selText].x = x - game.dragTextOffset.dx;
    game.texts[game.selText].y = y - game.dragTextOffset.dy;
  }
  // 缩放贴纸
  if (game.phase === 'arranging' && game.resizing >= 0) {
    var dx = x - game._resizeStartX;
    var newScale = Math.max(0.3, Math.min(10.0, game._resizeStartScale + dx / 50));
    game.placedFlowers[game.resizing].scale = newScale;
  }
  // 缩放文字
  if (game.phase === 'arranging' && game.resizingText && game.selText >= 0) {
    var dx = x - game._resizeStartX;
    var newScale = Math.max(0.3, Math.min(10.0, game._resizeStartScale + dx / 50));
    game.texts[game.selText].scale = newScale;
  }
  // 工具栏滑动（仅按住鼠标时才拖动）
  if (game.phase === 'arranging' && !game.dragging && !game.draggingText && !game.resizingText && game.resizing < 0 && y > layout.h - 78 && game._mouseDown) {
    var dx = x - (game._lastX || x);
    if (y < layout.h - 58) game._tabScroll = (game._tabScroll||0) - dx;
    else game._catScroll = (game._catScroll||0) - dx;
    game._lastX = x;
  }
}

// -- touch end --
function onTouchEnd(e) {
  e.preventDefault();
  if (game.phase === 'arranging' && game.dragging !== null && game.dragging >= 0) {
    var f = game.placedFlowers[game.dragging];
    var moved = f && (Math.abs(f.x - (game._dragStartX || 0)) > 3 || Math.abs(f.y - (game._dragStartY || 0)) > 3);
    game.selectedPlaced = game.dragging;
  }
  if (game.phase === 'arranging' && game.draggingText && game.selText >= 0) {
    var t = game.texts[game.selText];
    var moved = t && (Math.abs(t.x - (game._textDragStartX || 0)) > 3 || Math.abs(t.y - (game._textDragStartY || 0)) > 3);
    var holdTime = Date.now() - (game._touchTime || 0);
    if (!moved && holdTime < 600) {
      var textIdx = game.selText;
      showInputPopup('编辑祝福语', t.text, function(val) {
        if (val && val !== '') game.texts[textIdx].text = val;
      }, textIdx);
    } else if (!moved && holdTime >= 600) {
      game.texts.splice(game.selText, 1);
      game.selText = -1;
    }
  }
  game.dragging = null;
  game.draggingText = false;
  game.resizing = -1;
  game.resizingText = false;
  game._dragStartX = 0; game._dragStartY = 0;
}

// 绑定触摸事件
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

  }
  // 工具栏滑动（仅按住鼠标时才拖动）
  if (game.phase === 'arranging' && !game.dragging && !game.draggingText && !game.resizingText && game.resizing < 0 && y > layout.h - 78 && game._mouseDown) {

});

canvas.addEventListener('mouseup', function(e) {

  if (game.phase === 'arranging' && game.dragging !== null && game.dragging >= 0) {

    var holdTime = Date.now() - (game._touchTime || 0);
    if (!moved && holdTime < 600) {

canvas.addEventListener('mouseleave', function(e) {

// ============================================================
// 页面交互逻辑
// ============================================================

// ---- 首页 ----
function handleIdle(x, y) {
  // 草稿箱模式
  if (game.showingDrafts) {
    var draftIdx = hitTestDraftCard(x, y);
    if (draftIdx >= 0) {
      var d = drafts[draftIdx];
      // 恢复草稿数据
      game.selectedCard = d.data.selectedCard || 0;
      game.placedFlowers = d.data.placedFlowers ? JSON.parse(JSON.stringify(d.data.placedFlowers)) : [];
      game.texts = d.data.texts ? JSON.parse(JSON.stringify(d.data.texts)) : [];
      game.blessing = d.data.blessing || '';
      game.editingDraftId = d.id;
      game.phase = 'arranging';
      game.showingDrafts = false;
      game.showPreview = false;
      game.selectedFlower = -1;
      game.selectedPlaced = -1;
      game.selText = -1;
      game.undoStack = []; game.redoStack = [];
      return;
    }
    var delIdx = hitTestDraftDelete(x, y);
    if (delIdx >= 0) {
      drafts.splice(delIdx, 1);
      saveDrafts();
      return;
    }
    if (hitTestDraftBack(x, y)) {
      game.showingDrafts = false;
      return;
    }
    return;
  }

  // 主题选择模式
  if (game.showingThemes) {
    var themeIdx = hitTestThemeCard(x, y);
    if (themeIdx >= 0) {
      applyTheme(themeIdx);
      game.showingThemes = false;
      game.phase = 'arranging';
      game.page = 'arranging';
      game.selectedFlower = -1;
      game.selectedPlaced = -1;
      game.selText = -1;
      game.editingDraftId = null;
      game.undoStack = []; game.redoStack = [];
      return;
    } else if (hitTestThemeBack(x, y)) {
      game.showingThemes = false;
      return;
    }
    return;
  }

  var hit = hitTestCard(x, y);
  if (hit >= 0) { game.selectedCard = hit; return; }

  // 主题创作按钮（首页）
  var rndBtnY = layout.h - 130;
  if (x > layout.w/2 - 90 && x < layout.w/2 + 90 && y > rndBtnY && y < rndBtnY + 40) {
    game.showingThemes = true;
    return;
  }

  // 我的卡片按钮（首页）
  var draftBtnY = layout.h - 80;
  if (x > layout.w/2 - 90 && x < layout.w/2 + 90 && y > draftBtnY && y < draftBtnY + 40) {
    game.showingDrafts = true;
    return;
  }

  // 开始创作按钮
  var btnY = layout.h - 180;
  if (x > layout.w/2 - 90 && x < layout.w/2 + 90 && y > btnY && y < btnY + 46) {
    game.phase = 'arranging'; game.placedFlowers = []; game.selectedFlower = -1; game.selectedPlaced = -1;
    game.texts = []; game.selText = -1; game.blessing = '';
    game.editingDraftId = null;
  }
}

// ---- 创作页 ----
function handleArrangeStart(x, y) {
  // 预览弹窗
  if (game.showPreview) {
    if (hitTestPreviewClose(x, y, layout)) { game.showPreview = false; return; }
    if (hitTestShareBtn(x, y, layout)) {
      // 先保存图片，然后提示用户分享
      savePostcardImage(function() {
        showToast('图片已保存，请打开微信发送给好友 💚');
      });
      return;
    }
    if (hitTestSaveBtn(x, y, layout)) {
      savePostcardImage();
      return;
    }
    return;
  }

  // 优先检测删除按钮
  var deleteHit = hitTestDeleteBtn(x, y, game);
  if (deleteHit) {
    saveState(game);
    if (deleteHit.type === 'sticker') {
      game.placedFlowers.splice(deleteHit.idx, 1);
      game.selectedPlaced = -1;
    } else {
      game.texts.splice(deleteHit.idx, 1);
      game.selText = -1;
    }
    return;
  }

  // 优先检测缩放手柄
  var resizeHit = hitTestResizeHandle(x, y, game);
  if (resizeHit) {
    saveState(game);
    if (resizeHit.type === 'sticker') {
      game.resizing = resizeHit.idx;
      game._resizeStartX = x;
      game._resizeStartScale = game.placedFlowers[resizeHit.idx].scale || 1;
    } else {
      game.resizingText = true;
      game._resizeStartX = x;
      game._resizeStartScale = game.texts[resizeHit.idx].scale || 1;
    }
    return;
  }

  // 返回首页
  if (hitTestBackBtn(x, y, layout)) {
    game.phase = 'idle';
    game.placedFlowers = [];
    game.selectedFlower = -1;
    game.selectedPlaced = -1;
    game.blessing = '';
    game.showPreview = false;
    game.texts = [];
    game.selText = -1;
    return;
  }
  // 添加祝福
  if (hitTestAddBlessBtn(x, y, layout)) {
    showInputPopup('请输入祝福语', '', function(val) {
      if (val && val !== '') {
        var cardCenterX = layout.cardX + layout.cardW / 2;
        var cardCenterY = layout.cardY + layout.cardH / 2;
        game.texts.push({ text: val, x: cardCenterX, y: cardCenterY, fontIdx: 0, fontSize: 18, color: TEXT_FONTS[0].color, scale: 1 });
        game.selText = game.texts.length - 1;
      }
    });
    return;
  }
  // 换字体
  if (hitTestChangeFontBtn(x, y, layout)) {
    if (game.selText >= 0) {
      game.texts[game.selText].fontIdx = (game.texts[game.selText].fontIdx + 1) % TEXT_FONTS.length;
    }
    return;
  }
  // 随机生成
  if (hitTestRandomBtn(x, y, layout)) {
    var card = { cardX: 24, cardY: layout.cardY, cardW: layout.w - 48, cardH: 480 };
    game.placedFlowers = [];
    game.texts = [];
    game.selText = -1;
    var n = 5 + Math.floor(Math.random() * 10);
    for (var i = 0; i < n; i++) {
      game.placedFlowers.push({
        type: Math.floor(Math.random() * STICKERS.length),
        x: card.cardX + 30 + Math.random() * (card.cardW - 60),
        y: card.cardY + 10 + Math.random() * (card.cardH - 60),
        scale: 1
      });
    }
    var b = BLESSINGS[Math.floor(Math.random() * (BLESSINGS.length - 1))];
    game.texts.push({ text: b, x: card.cardX + card.cardW / 2, y: card.cardY + card.cardH - 40, fontIdx: 0, fontSize: 18, color: TEXT_FONTS[0].color, scale: 1 });
    game.selText = -1;
    game.selectedPlaced = -1;
    game.undoStack = []; game.redoStack = [];
    return;
  }
  // 预览按钮
  if (hitTestPreviewBtn(x, y, layout)) { game.showPreview = true; return; }
  // 完成
  if (hitTestFinish(x, y, layout)) {
    var draftData = {
      selectedCard: game.selectedCard,
      placedFlowers: game.placedFlowers,
      texts: game.texts,
      blessing: game.blessing
    };
    if (game.editingDraftId) {
      updateDraft(game.editingDraftId, draftData);
      // 更新状态为 done
      for (var i = 0; i < drafts.length; i++) {
        if (drafts[i].id === game.editingDraftId) { drafts[i].status = 'done'; saveDrafts(); break; }
      }
    } else {
      addDraft(draftData, 'done');
    }
    game.showPreview = true;
    return;
  }
  // 暂存
  if (hitTestSaveDraft(x, y, layout)) {
    var draftData = {
      selectedCard: game.selectedCard,
      placedFlowers: game.placedFlowers,
      texts: game.texts,
      blessing: game.blessing
    };
    if (game.editingDraftId) {
      updateDraft(game.editingDraftId, draftData);
      for (var i = 0; i < drafts.length; i++) {
        if (drafts[i].id === game.editingDraftId) { drafts[i].status = 'draft'; saveDrafts(); break; }
      }
    } else {
      addDraft(draftData, 'draft');
    }
    showToast('已暂存');
    return;
  }
  // 撤回
  if (hitTestUndo(x, y, layout)) { undo(game); return; }
  // 恢复
  if (hitTestRedo(x, y, layout)) { redo(game); return; }
  // 切换分类
  var catHit = hitTestCatTab(x, y, layout);
  if (catHit >= 0) { game.selectedCat = catHit; return; }
  // 点工具栏贴纸
  var sIdx = hitTestSticker(x, y, game, layout);
  if (sIdx >= 0) {
    game.selectedFlower = sIdx;
    game.selectedPlaced = -1;
    game.selText = -1;
    return;
  }
  // 先检测是否点击了文字元素
  var tIdx = hitTestText(x, y);
  if (tIdx >= 0) {
    game.selText = tIdx;
    game.draggingText = true;
    game.dragTextOffset = { dx: x - game.texts[tIdx].x, dy: y - game.texts[tIdx].y };
    game._textDragStartX = game.texts[tIdx].x;
    game._textDragStartY = game.texts[tIdx].y;
    game.selectedPlaced = -1;
    game.selectedFlower = -1;
    return;
  }
  // 点放置贴纸 -> 拖拽
  var pIdx = hitTestPlaced(x, y, game);
  if (pIdx >= 0) {
    saveState(game);
    game._dragStartX = game.placedFlowers[pIdx].x;
    game._dragStartY = game.placedFlowers[pIdx].y;
    game.dragging = pIdx;
    game.selectedFlower = -1;
    game.selText = -1;
    return;
  }
  // 点明信片区域
  if (hitTestCardArea(x, y, layout)) {
    if (game.selectedFlower >= 0) {
      saveState(game);
      game.placedFlowers.push({ type: game.selectedFlower, x: x, y: y, scale: 1 });
      game.selectedPlaced = -1;
      return;
    }
    game.selectedPlaced = -1;
    game.selText = -1;
    return;
  }
  game.selectedPlaced = -1;
  game.selectedFlower = -1;
  game.selText = -1;
}

// ---- 预览页 ----
function handlePreview(x, y) {
  // 保存图片按钮
  var saveBtnY = layout.cardY + layout.cardH + 10;
  if (x >= layout.w/2 - 70 && x <= layout.w/2 + 70 && y >= saveBtnY && y <= saveBtnY + 34) {
    savePostcardImage();
    return;
  }
  if (hitTestNewGame(x, y, layout)) {
    var old = game.selectedCard;
    game = createGame();
    game.selectedCard = old; game.selectedCat = 0; game.selectedPlaced = -1;
    game._tabScroll = 0; game._catScroll = 0;
    return;
  }
}

// ---- 保存图片功能 ----
function savePostcardImage(callback) {
  // 创建高清导出canvas
  var exportW = 750, exportH = 1000;
  var exportCanvas = document.createElement('canvas');
  exportCanvas.width = exportW;
  exportCanvas.height = exportH;
  var ectx = exportCanvas.getContext('2d');

  // 缩放2倍绘制
  ectx.scale(2, 2);
  var L = { w: 375, h: 560, cardX: 24, cardY: 18, cardW: 327, cardH: 480 };

  // 背景
  var card = CARDS[game.selectedCard];
  var bgGrad = ectx.createLinearGradient(L.cardX, L.cardY, L.cardX, L.cardY + L.cardH);
  bgGrad.addColorStop(0, card.bg1); bgGrad.addColorStop(1, card.bg2);
  ectx.fillStyle = BODY_BG; ectx.fillRect(0, 0, L.w, L.h);
  ectx.fillStyle = bgGrad;
  ectx.beginPath(); roundedRect(ectx, L.cardX, L.cardY, L.cardW, L.cardH, 14); ectx.fill();
  drawCardPattern(ectx, card, L);

  // 已放置贴纸
  for (var i = 0; i < game.placedFlowers.length; i++) {
    var f = game.placedFlowers[i];
    drawSticker(ectx, f.x, f.y, STICKERS[f.type], false, f.scale);
  }

  // 文字元素（保存时不显示选中边框）
  var oldSelText = game.selText;
  game.selText = -1;
  drawTexts(ectx, game, L.cardX, L.cardY, L.cardW, L.cardH);
  game.selText = oldSelText;

  // 水印
  ectx.font = '10px sans-serif'; ectx.fillStyle = 'rgba(0,0,0,0.2)';
  ectx.fillText('心意明信片', L.w / 2, L.h - 8);
  ectx.textAlign = 'left';

  // 边框
  ectx.strokeStyle = card.border; ectx.lineWidth = 2;
  ectx.beginPath(); roundedRect(ectx, L.cardX + 3, L.cardY + 3, L.cardW - 6, L.cardH - 6, 11); ectx.stroke();

  // 下载
  var dataURL = exportCanvas.toDataURL('image/png');
  var link = document.createElement('a');
  link.download = '心意明信片.png';
  link.href = dataURL;
  link.click();

  // 回调
  if (callback) setTimeout(callback, 300);
}

// ---- 启动游戏循环 ----
// 确保 layout 已初始化后再启动渲染
function startGame() {
  resizeCanvas();
  gameLoop();
}
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  startGame();
} else {
  window.addEventListener('DOMContentLoaded', startGame);
}

</script>
