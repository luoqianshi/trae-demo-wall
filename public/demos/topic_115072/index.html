<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>反诈教练</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- 首页 -->
        <div id="page-home" class="page active">
            <div class="header">
                <h1>反诈教练</h1>
                <p class="subtitle">让老人在安全环境中"被骗一次"，真实世界不再上当</p>
            </div>
            <div class="settings-bar">
                <label class="auto-tts-toggle">
                    <input type="checkbox" id="auto-tts-checkbox" checked>
                    <span class="toggle-label">🔊 自动朗读 AI 回复</span>
                </label>
            </div>
            <div class="script-list" id="script-list">
                <!-- 动态加载剧本列表 -->
            </div>
        </div>

        <!-- 对话页 -->
        <div id="page-chat" class="page">
            <div class="chat-header">
                <button class="btn-back" onclick="goHome()">← 返回</button>
                <h2 id="chat-title">对话中</h2>
                <div class="trust-meter">
                    <span>风险值：</span>
                    <div class="trust-bar">
                        <div class="trust-fill" id="trust-fill"></div>
                    </div>
                    <span id="trust-value">0/10</span>
                </div>
            </div>
            <div class="chat-body" id="chat-body">
                <!-- 动态加载对话内容 -->
            </div>
            <div class="quick-suggestions" id="quick-suggestions">
                <!-- 动态加载快捷回复按钮 -->
            </div>
            <div class="chat-input-area" id="chat-input-area">
                <textarea id="user-input" class="user-input" placeholder="输入你想说的话..." rows="2"></textarea>
                <button id="send-btn" class="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>

        <!-- 复盘页 -->
        <div id="page-review" class="page">
            <div class="review-header">
                <h1>模拟结束</h1>
            </div>
            <div class="review-body" id="review-body">
                <!-- 动态加载报告 -->
            </div>
            <div class="review-actions" id="review-actions-bottom" style="display:none;">
                <button class="btn-primary" onclick="goHome()">返回首页</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
