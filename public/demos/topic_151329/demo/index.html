<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTag Engine 智标引擎 - 数据智能打标签系统</title>
    <link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
    <!-- 顶部品牌色条 -->
    <div class="brand-bar"></div>

    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="logo">
            <span class="logo-se">SE</span>
            <span class="logo-text">SmartTag Engine</span>
        </div>
        <div class="toolbar-separator"></div>
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="quick">⚡ 快速模式</button>
            <button class="mode-tab" data-mode="advanced">🎯 高级模式（三层解析）</button>
            <button class="mode-tab" data-mode="abmatch">🚀 AB表智能匹配</button>
        </div>
        <div class="toolbar-separator"></div>
        <div class="toolbar-info">
            <span id="versionInfo">V1.5.0 Demo</span>
        </div>
    </div>

    <!-- 主内容区 -->
    <div id="mainContent" class="main-content">
        <div id="quickModeView" class="mode-view active"></div>
        <div id="advancedModeView" class="mode-view"></div>
        <div id="abMatchModeView" class="mode-view"></div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <span id="statusText">就绪 - 请选择模式并操作</span>
        <span id="progressInfo" class="progress-info"></span>
    </div>

    <!-- 弹窗容器 -->
    <div id="modalContainer"></div>

    <!-- 引擎层 -->
    <script charset="utf-8" src="engine/synonymExpander.js?v=2"></script>
    <script charset="utf-8" src="engine/matchEngine.js?v=2"></script>

    <!-- 数据层 -->
    <script charset="utf-8" src="data/sampleData.js?v=2"></script>
    <script charset="utf-8" src="data/quickRules.js?v=2"></script>
    <script charset="utf-8" src="data/synonymGroups.js?v=2"></script>
    <script charset="utf-8" src="data/disciplines.js?v=2"></script>
    <script charset="utf-8" src="data/combinationRules.js?v=2"></script>
    <script charset="utf-8" src="data/featureRules.js?v=2"></script>
    <script charset="utf-8" src="data/funnelResults.js?v=2"></script>
    <script charset="utf-8" src="data/tableA.js?v=2"></script>
    <script charset="utf-8" src="data/tableB.js?v=2"></script>
    <script charset="utf-8" src="data/abMatchResults.js?v=2"></script>

    <!-- 视图层 -->
    <script charset="utf-8" src="views/quickMode.js?v=2"></script>
    <script charset="utf-8" src="views/advancedMode.js?v=2"></script>
    <script charset="utf-8" src="views/abMatchMode.js?v=2"></script>

    <!-- 主应用 -->
    <script>
        // 模式切换
        document.querySelectorAll('.mode-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                var mode = tab.dataset.mode;
                document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                document.querySelectorAll('.mode-view').forEach(function(v) { v.classList.remove('active'); });
                var viewId = mode === 'abmatch' ? 'abMatchModeView' : mode + 'ModeView';
                var viewEl = document.getElementById(viewId);
                if (viewEl) viewEl.classList.add('active');
                var modeNames = { quick: '快速模式', advanced: '高级模式（三层解析）', abmatch: 'AB表智能匹配' };
                document.getElementById('statusText').textContent = '当前模式：' + modeNames[mode];
            });
        });

        // 初始化各视图
        window.addEventListener('DOMContentLoaded', function() {
            try {
                QuickModeView.init('quickModeView');
                AdvancedModeView.init('advancedModeView');
                ABMatchModeView.init('abMatchModeView');
            } catch(e) {
                console.error('初始化错误:', e);
                document.getElementById('statusText').textContent = '初始化错误: ' + e.message;
            }
        });
    </script>
</body>
</html>
