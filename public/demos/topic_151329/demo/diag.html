<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>JS语法诊断</title></head>
<body>
<h3>JS文件语法检查</h3>
<div id="result"></div>
<script>
var files = [
    'engine/synonymExpander.js',
    'engine/matchEngine.js',
    'data/sampleData.js',
    'data/quickRules.js',
    'data/synonymGroups.js',
    'data/disciplines.js',
    'data/combinationRules.js',
    'data/featureRules.js',
    'data/funnelResults.js',
    'data/tableA.js',
    'data/tableB.js',
    'data/abMatchResults.js',
    'views/quickMode.js',
    'views/advancedMode.js',
    'views/abMatchMode.js'
];

var resultEl = document.getElementById('result');
var pending = files.length;

files.forEach(function(file) {
    fetch(file + '?v=' + Date.now())
        .then(function(r) { return r.text(); })
        .then(function(text) {
            try {
                new Function(text);
                resultEl.innerHTML += '<p style="color:green;">OK: ' + file + '</p>';
            } catch(e) {
                resultEl.innerHTML += '<p style="color:red;">ERROR: ' + file + ' → ' + e.message + '</p>';
            }
            pending--;
            if (pending === 0) {
                resultEl.innerHTML += '<hr><p>检查完成</p>';
            }
        })
        .catch(function(err) {
            resultEl.innerHTML += '<p style="color:red;">FETCH FAIL: ' + file + ' → ' + err.message + '</p>';
            pending--;
        });
});
</script>
</body>
</html>
