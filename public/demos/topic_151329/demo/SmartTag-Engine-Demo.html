    <!-- ========== 引擎层 ========== -->
    <script>
/**
 * 同义词展开器
 * 移植自 SmartMatchApp/Services/MatchEngine.cs 的同义词展开逻辑
 *
 * 功能：将规则中的 $[组名] 语法展开为 (主词|同义词1|同义词2|...)
 * 限制：仅展开1层，不递归展开嵌套引用
 */
window.SynonymExpander = {
    /**
     * 展开 $[组名] 引用
     * @param {string} condition - 条件表达式，可能含 $[组名]
     * @param {Array} groups - 同义词组列表 [{name, mainWord, synonyms:[]}]
     * @returns {string} 展开后的条件表达式
     *
     * 示例：
     *   condition = "$[钢管] & DN50"
     *   groups = [{name:'钢管', mainWord:'钢管', synonyms:['无缝钢管','焊接钢管']}]
     *   返回 "(钢管|无缝钢管|焊接钢管) & DN50"
     */
    expand: function(condition, groups) {
        if (!condition || !groups || groups.length === 0) return condition;

        var result = condition;
        // 用正则匹配 $[组名] 语法
        result = result.replace(/\$\[([^\]]+)\]/g, function(match, groupName) {
            // 查找对应的同义词组
            var group = null;
            for (var i = 0; i < groups.length; i++) {
                if (groups[i].name === groupName) {
                    group = groups[i];
                    break;
                }
            }
            if (!group) return match; // 未找到组，保持原样

            // 拼接主词 + 同义词列表
            var allWords = [group.mainWord];
            if (group.synonyms && group.synonyms.length > 0) {
                allWords = allWords.concat(group.synonyms);
            }
            return '(' + allWords.join('|') + ')';
        });
        return result;
    }
};

    </script>
    <script>
/**
 * 匹配引擎 - 快速模式真实算法
 * 移植自 SmartMatchApp/Services/MatchEngine.cs
 *
 * 支持语法：
 * - 逻辑运算：& (与) | (或) ! (非) () (括号优先级)
 * - 精确匹配：=A 表示文本完全等于A
 * - 通配符：* 任意多字符，? 单字符
 * - 正则表达式：regex: 前缀
 * - 边界匹配：` 反引号标记边界（`321 左边界，321` 右边界，`321` 双边界）
 * - 全角归一化：３２１ → 321
 * - 同义词展开：$[组名] → (主词|同义词1|...)
 */
window.MatchEngine = (function() {

    // ========== 全角数字/字母归一化 ==========

    /**
     * 全角数字/字母归一化为半角
     * 全角数字 ０-９ (U+FF10-FF19) → 0-9
     * 全角大写 Ａ-Ｚ (U+FF21-FF3A) → A-Z
     * 全角小写 ａ-ｚ (U+FF41-FF5A) → a-z
     */
    function normalizeFullWidth(text) {
        if (!text) return '';
        var result = '';
        for (var i = 0; i < text.length; i++) {
            var code = text.charCodeAt(i);
            if (code >= 0xFF10 && code <= 0xFF19) {
                // 全角数字 → 半角
                result += String.fromCharCode(code - 0xFF10 + 0x0030);
            } else if (code >= 0xFF21 && code <= 0xFF3A) {
                // 全角大写 → 半角大写
                result += String.fromCharCode(code - 0xFF21 + 0x0041);
            } else if (code >= 0xFF41 && code <= 0xFF5A) {
                // 全角小写 → 半角小写
                result += String.fromCharCode(code - 0xFF41 + 0x0061);
            } else {
                result += text[i];
            }
        }
        return result;
    }

    // ========== 边界感知匹配 ==========

    /**
     * 边界感知匹配：用反引号 ` 标记关键字边界
     * `321   → 左边界：关键字前一个字符不能是数字或字母
     * 321`   → 右边界：关键字后一个字符不能是数字或字母
     * `321`  → 双边界
     * 无反引号 → 普通包含
     *
     * @param {string} keyword - 可能含反引号标记的关键字
     * @param {string} text - 待匹配文本
     * @returns {boolean}
     */
    function smartContains(keyword, text) {
        if (!keyword || !text) return false;

        var hasLeftBoundary = keyword.charAt(0) === '`';
        var hasRightBoundary = keyword.charAt(keyword.length - 1) === '`';

        // 去掉反引号标记，得到实际关键字
        var actualKeyword = keyword;
        if (hasLeftBoundary) actualKeyword = actualKeyword.substring(1);
        if (hasRightBoundary) actualKeyword = actualKeyword.substring(0, actualKeyword.length - 1);

        if (actualKeyword.length === 0) return false;

        // 不带边界 → 普通包含
        if (!hasLeftBoundary && !hasRightBoundary) {
            return text.indexOf(actualKeyword) >= 0;
        }

        // 查找所有出现位置，检查边界
        var searchPos = 0;
        while (true) {
            var foundPos = text.indexOf(actualKeyword, searchPos);
            if (foundPos < 0) return false;

            var leftOk = true;
            var rightOk = true;

            // 左边界检查：前一个字符不能是数字或字母
            if (hasLeftBoundary && foundPos > 0) {
                var prevChar = text.charAt(foundPos - 1);
                if (/[0-9A-Za-z]/.test(prevChar)) {
                    leftOk = false;
                }
            }

            // 右边界检查：后一个字符不能是数字或字母
            if (hasRightBoundary) {
                var afterPos = foundPos + actualKeyword.length;
                if (afterPos < text.length) {
                    var nextChar = text.charAt(afterPos);
                    if (/[0-9A-Za-z]/.test(nextChar)) {
                        rightOk = false;
                    }
                }
            }

            if (leftOk && rightOk) return true;

            // 继续查找下一个出现位置
            searchPos = foundPos + 1;
            if (searchPos >= text.length) return false;
        }
    }

    // ========== 通配符匹配 ==========

    /**
     * 通配符匹配：* → 任意多字符，? → 单个字符
     * @param {string} pattern - 含通配符的模式
     * @param {string} text - 待匹配文本
     * @returns {boolean}
     */
    function wildcardMatch(pattern, text) {
        if (!pattern) return false;

        // 将通配符模式转为正则表达式
        var regexStr = '';
        for (var i = 0; i < pattern.length; i++) {
            var ch = pattern[i];
            if (ch === '*') {
                regexStr += '.*';
            } else if (ch === '?') {
                regexStr += '.';
            } else {
                // 转义正则特殊字符
                regexStr += ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }
        }
        // 通配符是"包含"语义，不是"完全匹配"，所以不加 ^ $
        try {
            var regex = new RegExp(regexStr);
            return regex.test(text);
        } catch (e) {
            return false;
        }
    }

    // ========== 正则匹配 ==========

    /**
     * 正则匹配：regex: 前缀后的内容作为正则表达式
     * @param {string} pattern - "regex:" 开头的模式
     * @param {string} text - 待匹配文本
     * @returns {boolean}
     */
    function regexMatch(pattern, text) {
        if (!pattern) return false;
        // 去掉 regex: 前缀
        var regexStr = pattern;
        if (regexStr.startsWith('regex:')) {
            regexStr = regexStr.substring(6);
        }
        try {
            var regex = new RegExp(regexStr);
            return regex.test(text);
        } catch (e) {
            return false;
        }
    }

    // ========== 原子条件匹配 ==========

    /**
     * 单个原子条件匹配
     * 判断条件类型并调用对应方法：
     * - = 开头 → 精确匹配
     * - regex: 开头 → 正则匹配
     * - 含 * 或 ? → 通配符匹配
     * - 含反引号 ` → 边界匹配
     * - 其他 → 普通包含
     *
     * @param {string} condition - 单个条件（不含逻辑运算符）
     * @param {string} text - 待匹配文本
     * @returns {boolean}
     */
    function matchAtom(condition, text) {
        if (!condition || !text) return false;
        condition = condition.trim();
        if (condition.length === 0) return false;

        // 精确匹配：= 开头
        if (condition.charAt(0) === '=') {
            var exactValue = condition.substring(1);
            return text === exactValue;
        }

        // 正则匹配：regex: 开头
        if (condition.startsWith('regex:')) {
            return regexMatch(condition, text);
        }

        // 边界匹配：含反引号
        if (condition.indexOf('`') >= 0) {
            return smartContains(condition, text);
        }

        // 通配符匹配：含 * 或 ?
        if (condition.indexOf('*') >= 0 || condition.indexOf('?') >= 0) {
            return wildcardMatch(condition, text);
        }

        // 普通包含
        return text.indexOf(condition) >= 0;
    }

    // ========== 递归下降解析器 ==========

    /**
     * 解析器状态
     * 将条件表达式解析为 AST
     *
     * AST 节点类型：
     * - {type:'atom', value:'条件文本'}
     * - {type:'not', child:AST}
     * - {type:'and', left:AST, right:AST}
     * - {type:'or', left:AST, right:AST}
     */
    function Parser(input) {
        this.input = input;
        this.pos = 0;
    }

    /**
     * 跳过空白字符
     */
    Parser.prototype.skipWhitespace = function() {
        while (this.pos < this.input.length && /\s/.test(this.input[this.pos])) {
            this.pos++;
        }
    };

    /**
     * 查看当前字符
     */
    Parser.prototype.peek = function() {
        if (this.pos >= this.input.length) return null;
        return this.input[this.pos];
    };

    /**
     * 读取一个字符
     */
    Parser.prototype.consume = function() {
        if (this.pos >= this.input.length) return null;
        return this.input[this.pos++];
    };

    /**
     * 读取原子条件文本
     * 原子文本读取到下一个 & | ) 或字符串末尾
     * 特殊处理：regex: 后的内容作为一个整体，不被 & | 拆分
     */
    Parser.prototype.readAtomText = function() {
        this.skipWhitespace();
        var text = '';

        while (this.pos < this.input.length) {
            var ch = this.input[this.pos];

            // 遇到逻辑运算符或右括号，停止读取
            if (ch === '&' || ch === '|' || ch === ')') {
                break;
            }

            // 检查是否是 regex: 开头
            if (text === '' && this.input.substring(this.pos, this.pos + 6) === 'regex:') {
                // 读取整个正则表达式，直到遇到未在括号内的 & | 或字符串末尾
                text = 'regex:';
                this.pos += 6;
                // 正则内容读取到下一个 & | 或末尾（不处理括号嵌套，简化处理）
                while (this.pos < this.input.length) {
                    var regexCh = this.input[this.pos];
                    if (regexCh === '&' || regexCh === '|') {
                        break;
                    }
                    text += regexCh;
                    this.pos++;
                }
                return text.trim();
            }

            text += ch;
            this.pos++;
        }

        return text.trim();
    };

    /**
     * 解析入口：expr → orExpr
     */
    Parser.prototype.parseExpr = function() {
        return this.parseOr();
    };

    /**
     * 解析或表达式：orExpr → andExpr ('|' andExpr)*
     */
    Parser.prototype.parseOr = function() {
        var left = this.parseAnd();
        this.skipWhitespace();

        while (this.peek() === '|') {
            this.consume(); // 消费 |
            var right = this.parseAnd();
            left = { type: 'or', left: left, right: right };
            this.skipWhitespace();
        }
        return left;
    };

    /**
     * 解析与表达式：andExpr → notExpr ('&' notExpr)*
     */
    Parser.prototype.parseAnd = function() {
        var left = this.parseNot();
        this.skipWhitespace();

        while (this.peek() === '&') {
            this.consume(); // 消费 &
            var right = this.parseNot();
            left = { type: 'and', left: left, right: right };
            this.skipWhitespace();
        }
        return left;
    };

    /**
     * 解析非表达式：notExpr → '!' notExpr | atom
     */
    Parser.prototype.parseNot = function() {
        this.skipWhitespace();

        if (this.peek() === '!') {
            this.consume(); // 消费 !
            var child = this.parseNot();
            return { type: 'not', child: child };
        }

        return this.parseAtom();
    };

    /**
     * 解析原子：atom → '(' expr ')' | conditionText
     */
    Parser.prototype.parseAtom = function() {
        this.skipWhitespace();

        if (this.peek() === '(') {
            this.consume(); // 消费 (
            var expr = this.parseExpr();
            this.skipWhitespace();
            if (this.peek() === ')') {
                this.consume(); // 消费 )
            }
            return expr;
        }

        // 读取条件文本
        var text = this.readAtomText();
        if (text.length === 0) {
            return { type: 'atom', value: '' };
        }
        return { type: 'atom', value: text };
    };

    // ========== AST 评估 ==========

    /**
     * 递归评估 AST
     * @param {Object} ast - AST 节点
     * @param {string} text - 待匹配文本
     * @returns {boolean}
     */
    function evaluate(ast, text) {
        if (!ast) return false;

        switch (ast.type) {
            case 'atom':
                return matchAtom(ast.value, text);

            case 'not':
                // 非运算：子节点为 false 时返回 true
                return !evaluate(ast.child, text);

            case 'and':
                // 与运算：左右都为 true
                return evaluate(ast.left, text) && evaluate(ast.right, text);

            case 'or':
                // 或运算：左右任一为 true
                return evaluate(ast.left, text) || evaluate(ast.right, text);

            default:
                return false;
        }
    }

    // ========== 完整条件匹配 ==========

    /**
     * 完整条件匹配（包含+排除）
     * @param {string} includeCondition - 包含条件表达式
     * @param {string} excludeCondition - 排除条件表达式（可选）
     * @param {string} text - 待匹配文本
     * @param {Array} synonymGroups - 同义词组（可选）
     * @returns {boolean} 匹配成功返回 true
     */
    function matchCondition(includeCondition, excludeCondition, text, synonymGroups) {
        if (!includeCondition || !text) return false;

        // 1. 全角归一化文本
        text = normalizeFullWidth(text);

        // 2. 同义词展开（如果有）
        var expandedCondition = includeCondition;
        if (synonymGroups && synonymGroups.length > 0) {
            expandedCondition = window.SynonymExpander.expand(includeCondition, synonymGroups);
        }

        // 3. 全角归一化条件
        expandedCondition = normalizeFullWidth(expandedCondition);

        // 4. 解析包含条件为 AST
        var parser = new Parser(expandedCondition);
        var ast = parser.parseExpr();

        // 5. 评估包含条件
        var includeResult = evaluate(ast, text);
        if (!includeResult) return false;

        // 6. 如果有排除条件，评估排除条件
        if (excludeCondition && excludeCondition.trim().length > 0) {
            var expandedExclude = excludeCondition;
            if (synonymGroups && synonymGroups.length > 0) {
                expandedExclude = window.SynonymExpander.expand(excludeCondition, synonymGroups);
            }
            expandedExclude = normalizeFullWidth(expandedExclude);
            var excludeParser = new Parser(expandedExclude);
            var excludeAst = excludeParser.parseExpr();
            var excludeResult = evaluate(excludeAst, text);
            // 排除条件命中 → 不匹配
            if (excludeResult) return false;
        }

        return true;
    }

    // ========== 批量匹配 ==========

    /**
     * 批量匹配：对每行数据执行所有启用的规则
     * @param {Array} rows - 数据行 [{rowIndex, mergedText, ...}]
     * @param {Array} rules - 规则列表 [{id, name, includeCondition, excludeCondition, returnValue, caseSensitive, isEnabled}]
     * @param {Array} synonymGroups - 同义词组列表（可选）
     * @returns {Array} 匹配结果 [{rowIndex, ruleId, ruleName, returnValue, matched}]
     */
    function batchMatch(rows, rules, synonymGroups) {
        var results = [];
        if (!rows || !rules) return results;

        // 过滤启用的规则
        var activeRules = rules.filter(function(r) { return r.isEnabled !== false; });

        for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var text = row.mergedText || '';

            for (var j = 0; j < activeRules.length; j++) {
                var rule = activeRules[j];
                var matched = matchCondition(
                    rule.includeCondition,
                    rule.excludeCondition,
                    text,
                    synonymGroups
                );

                results.push({
                    rowIndex: row.rowIndex,
                    ruleId: rule.id,
                    ruleName: rule.name,
                    returnValue: matched ? (rule.returnValue || '') : '',
                    matched: matched
                });
            }
        }

        return results;
    }

    // ========== 公开 API ==========

    return {
        normalizeFullWidth: normalizeFullWidth,
        smartContains: smartContains,
        wildcardMatch: wildcardMatch,
        regexMatch: regexMatch,
        matchAtom: matchAtom,
        parse: function(condition) {
            var parser = new Parser(condition);
            return parser.parseExpr();
        },
        evaluate: evaluate,
        matchCondition: matchCondition,
        batchMatch: batchMatch
    };
})();

    <script>
/**
 * 快速模式视图 - 逻辑表达式智能打标签
 *
 * 功能：
 * - 显示规则列表（可增删改）
 * - 显示数据表格（内置示例数据）
 * - 执行匹配（调用真实 MatchEngine）
 * - 展示匹配结果与统计
 */
window.QuickModeView = (function() {

    var containerId = null;
    var rules = [];
    var rows = [];
    var matchResults = []; // 匹配结果缓存
    var selectedRowIndex = -1;

    /**
     * 初始化视图
     */
    function init(container) {
        containerId = typeof container === 'string' ? container : 'quickModeView';
        // 复制数据副本，避免修改原始数据
        rules = (window.QuickRules || []).map(function(r) {
            return Object.assign({}, r);
        });
        var sampleData = window.SampleData || { columns: [], rows: [] };
        rows = sampleData.rows || [];
        matchResults = [];

        render();
    }

    /**
     * 渲染整个视图
     */
    function render() {
        var container = document.getElementById(containerId);
        if (!container) return;

        var dataObj = window.SampleData || {};
        var dataRows = dataObj.rows || [];
        rows = dataRows;

        container.innerHTML = `
            <div class="flex-col" style="height:100%;">
                <!-- 子工具栏 -->
                <div class="sub-toolbar">
                    <span class="sub-toolbar-label">数据源:</span>
                    <select class="select-box" id="quickDataSource">
                        <option value="sample">内置示例数据（20行）</option>
                    </select>
                    <span class="sub-toolbar-label" style="margin-left:12px;">表头行:</span>
                    <input type="text" class="input-text" value="1" style="width:45px;text-align:center;" readonly>
                    <div class="toolbar-separator"></div>
                    <button class="btn btn-accent" id="quickRunMatch">▶ 执行匹配</button>
                    <button class="btn" id="quickClearResult">清除结果</button>
                    <div class="toolbar-separator"></div>
                    <button class="btn" id="quickHelp">📖 语法说明</button>
                </div>

                <!-- 主体：左规则列表 + 右数据表格 -->
                <div class="flex-row" style="flex:1;overflow:hidden;">
                    <!-- 规则列表 -->
                    <div class="rule-list-panel">
                        <div class="rule-list-header">
                            <span>规则列表（${rules.length}）</span>
                            <button class="btn btn-accent" id="quickAddRule" style="padding:2px 8px;font-size:11px;">+ 新增</button>
                        </div>
                        <div class="rule-list" id="quickRuleList"></div>
                    </div>

                    <!-- 数据表格 -->
                    <div class="flex-col" style="flex:1;">
                        <div class="data-panel-header">
                            <span>数据表格（${dataRows.length} 行）</span>
                            <span style="font-size:11px;color:#777;">点击行可选中，执行匹配后查看结果</span>
                        </div>
                        <div class="data-panel" style="flex:1;overflow:auto;">
                            <table class="data-table" id="quickDataTable">
                                <thead><tr id="quickTableHead"></tr></thead>
                                <tbody id="quickTableBody"></tbody>
                            </table>
                        </div>
                        <!-- 统计区 -->
                        <div class="stats-panel" id="quickStatsPanel">
                            <span class="stat-item"><span class="stat-label">数据行数:</span><span class="stat-value">${dataRows.length}</span></span>
                            <span class="stat-item"><span class="stat-label">启用规则:</span><span class="stat-value">${rules.filter(function(r){return r.isEnabled!==false;}).length}</span></span>
                            <span class="stat-item"><span class="stat-label">匹配结果:</span><span class="stat-value" id="quickMatchCount">未执行</span></span>
                        </div>
                    </div>
                </div>
            </div>
        `;

        renderRuleList();
        renderDataTable();
        bindEvents();
    }

    /**
     * 渲染规则列表
     */
    function renderRuleList() {
        var listEl = document.getElementById('quickRuleList');
        if (!listEl) return;

        listEl.innerHTML = rules.map(function(rule, idx) {
            var conditionDisplay = rule.includeCondition || '(无)';
            if (rule.excludeCondition) {
                conditionDisplay += '  [排除:' + rule.excludeCondition + ']';
            }
            return `
                <div class="rule-item" data-rule-index="${idx}">
                    <div class="rule-item-name">${escapeHtml(rule.name)} ${rule.isEnabled === false ? '<span style="color:#999;">(禁用)</span>' : ''}</div>
                    <div class="rule-item-condition">${escapeHtml(conditionDisplay)}</div>
                    <div class="rule-item-actions">
                        <a data-action="edit" data-index="${idx}">编辑</a>
                        <a data-action="delete" data-index="${idx}">删除</a>
                        <a data-action="toggle" data-index="${idx}">${rule.isEnabled === false ? '启用' : '禁用'}</a>
                    </div>
                </div>
            `;
        }).join('');
    }

    /**
     * 渲染数据表格
     */
    function renderDataTable() {
        var dataObj = window.SampleData || {};
        var columns = dataObj.columns || [];
        var dataRows = dataObj.rows || [];

        // 表头
        var headEl = document.getElementById('quickTableHead');
        if (headEl) {
            headEl.innerHTML = columns.map(function(col) {
                var style = col.numeric ? ' style="text-align:right;"' : '';
                return `<th${style}>${escapeHtml(col.name)}</th>`;
            }).join('') + '<th>匹配结果</th>';
        }

        // 表体
        var bodyEl = document.getElementById('quickTableBody');
        if (bodyEl) {
            bodyEl.innerHTML = dataRows.map(function(row, idx) {
                var cells = columns.map(function(col) {
                    var val = row[col.key] || '';
                    var style = col.numeric ? ' class="numeric-cell"' : '';
                    return `<td${style}>${escapeHtml(String(val))}</td>`;
                }).join('');

                // 匹配结果列
                var matchCell = '<td class="no-match-cell">(未匹配)</td>';
                if (matchResults.length > 0) {
                    var matched = matchResults.filter(function(r) {
                        return r.rowIndex === row.rowIndex && r.matched;
                    });
                    if (matched.length > 0) {
                        var labels = matched.map(function(m) { return m.ruleName; });
                        matchCell = '<td class="match-result-cell">' + escapeHtml(labels.join('; ')) + '</td>';
                    }
                }

                var selectedClass = (idx === selectedRowIndex) ? ' selected' : '';
                return `<tr class="data-row${selectedClass}" data-row-index="${idx}">${cells}${matchCell}</tr>`;
            }).join('');
        }
    }

    /**
     * 执行匹配
     */
    function runMatch() {
        var dataObj = window.SampleData || {};
        var dataRows = dataObj.rows || [];
        var synonymGroups = window.SynonymGroups || [];

        // 调用真实引擎
        matchResults = window.MatchEngine.batchMatch(dataRows, rules, synonymGroups);

        // 统计
        var matchedRows = {};
        matchResults.forEach(function(r) {
            if (r.matched) {
                matchedRows[r.rowIndex] = true;
            }
        });
        var matchCount = Object.keys(matchedRows).length;

        // 更新表格
        renderDataTable();

        // 更新统计
        var countEl = document.getElementById('quickMatchCount');
        if (countEl) {
            countEl.textContent = matchCount + '/' + dataRows.length + ' 行匹配';
        }

        // 更新状态栏
        var statusEl = document.getElementById('statusText');
        if (statusEl) {
            statusEl.textContent = `快速模式 - 匹配完成：${matchCount}/${dataRows.length} 行命中规则`;
        }
    }

    /**
     * 清除匹配结果
     */
    function clearResult() {
        matchResults = [];
        renderDataTable();
        var countEl = document.getElementById('quickMatchCount');
        if (countEl) countEl.textContent = '未执行';
    }

    /**
     * 新增/编辑规则弹窗
     */
    function showRuleEditor(ruleIndex) {
        var rule = ruleIndex >= 0 ? rules[ruleIndex] : { id: 'r' + Date.now(), name: '', includeCondition: '', excludeCondition: '', returnValue: '', caseSensitive: false, isEnabled: true };
        var isEdit = ruleIndex >= 0;

        var modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-dialog" style="min-width:520px;">
                <div class="modal-header">
                    <span>${isEdit ? '编辑规则' : '新增规则'}</span>
                    <span class="modal-close" id="ruleEditClose">×</span>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">规则名称</label>
                        <input type="text" class="input-text" id="ruleName" value="${escapeHtml(rule.name)}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">包含条件</label>
                        <input type="text" class="input-text" id="ruleInclude" value="${escapeHtml(rule.includeCondition)}" placeholder="如：无缝钢管 & DN50">
                        <div class="form-hint">支持 &amp;(与) |(或) !(非) ()(括号) =(精确) *(通配) regex:(正则) \`(边界) $[组名](同义词)</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">排除条件（可选）</label>
                        <input type="text" class="input-text" id="ruleExclude" value="${escapeHtml(rule.excludeCondition || '')}" placeholder="如：电缆">
                    </div>
                    <div class="form-group">
                        <label class="form-label">返回值（匹配标签）</label>
                        <input type="text" class="input-text" id="ruleReturn" value="${escapeHtml(rule.returnValue || '')}">
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" id="ruleEnabled" ${rule.isEnabled !== false ? 'checked' : ''}> 启用此规则</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn" id="ruleEditCancel">取消</button>
                    <button class="btn btn-accent" id="ruleEditSave">保存</button>
                </div>
            </div>
        `;

        document.getElementById('modalContainer').appendChild(modal);

        // 关闭
        document.getElementById('ruleEditClose').onclick = function() { modal.remove(); };
        document.getElementById('ruleEditCancel').onclick = function() { modal.remove(); };

        // 保存
        document.getElementById('ruleEditSave').onclick = function() {
            var newRule = {
                id: rule.id,
                name: document.getElementById('ruleName').value.trim(),
                includeCondition: document.getElementById('ruleInclude').value.trim(),
                excludeCondition: document.getElementById('ruleExclude').value.trim(),
                returnValue: document.getElementById('ruleReturn').value.trim(),
                caseSensitive: false,
                isEnabled: document.getElementById('ruleEnabled').checked
            };

            if (!newRule.name) {
                alert('请填写规则名称');
                return;
            }

            if (isEdit) {
                rules[ruleIndex] = newRule;
            } else {
                rules.push(newRule);
            }

            renderRuleList();
            updateStats();
            modal.remove();
        };
    }

    /**
     * 显示语法说明
     */
    function showHelp() {
        var modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-dialog" style="min-width:600px;">
                <div class="modal-header">
                    <span>规则语法说明</span>
                    <span class="modal-close" id="helpClose">×</span>
                </div>
                <div class="modal-body" style="font-size:13px;line-height:1.8;">
                    <h3 style="color:#4285F4;margin-bottom:8px;">逻辑运算符</h3>
                    <p><code>&amp;</code> 与 — 同时满足，如 <code>无缝钢管 &amp; DN50</code></p>
                    <p><code>|</code> 或 — 满足任一，如 <code>钢管|铜管</code></p>
                    <p><code>!</code> 非 — 排除条件，如 <code>!电缆</code></p>
                    <p><code>()</code> 括号 — 优先级，如 <code>(无缝&钢管)|(合金&钢管)</code></p>
                    <h3 style="color:#4285F4;margin:12px 0 8px;">匹配方式</h3>
                    <p><code>=A</code> 精确匹配 — 文本完全等于A</p>
                    <p><code>A*</code> / <code>A?</code> 通配符 — *任意多字符，?单字符</p>
                    <p><code>regex:\\d{4}</code> 正则匹配 — regex:前缀</p>
                    <h3 style="color:#4285F4;margin:12px 0 8px;">边界匹配</h3>
                    <p><code>\`321</code> 左边界 — 前面不能是数字/字母</p>
                    <p><code>321\`</code> 右边界 — 后面不能是数字/字母</p>
                    <p><code>\`321\`</code> 双边界 — 前后都不能是数字/字母</p>
                    <h3 style="color:#4285F4;margin:12px 0 8px;">同义词</h3>
                    <p><code>$[组名]</code> 引用同义词组，展开为 <code>(主词|同义词1|同义词2)</code></p>
                    <h3 style="color:#4285F4;margin:12px 0 8px;">全角兼容</h3>
                    <p>全角数字/字母自动归一化：<code>３２１</code> 等价于 <code>321</code></p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-accent" id="helpOk">确定</button>
                </div>
            </div>
        `;
        document.getElementById('modalContainer').appendChild(modal);
        document.getElementById('helpClose').onclick = function() { modal.remove(); };
        document.getElementById('helpOk').onclick = function() { modal.remove(); };
    }

    /**
     * 更新统计
     */
    function updateStats() {
        var dataRows = (window.SampleData || {}).rows || [];
        var enabledCount = rules.filter(function(r) { return r.isEnabled !== false; }).length;
        var panel = document.getElementById('quickStatsPanel');
        if (panel) {
            panel.innerHTML = `
                <span class="stat-item"><span class="stat-label">数据行数:</span><span class="stat-value">${dataRows.length}</span></span>
                <span class="stat-item"><span class="stat-label">启用规则:</span><span class="stat-value">${enabledCount}</span></span>
                <span class="stat-item"><span class="stat-label">匹配结果:</span><span class="stat-value" id="quickMatchCount">${matchResults.length > 0 ? '已执行' : '未执行'}</span></span>
            `;
        }
    }

    /**
     * 绑定事件
     */
    function bindEvents() {
        // 执行匹配
        var runBtn = document.getElementById('quickRunMatch');
        if (runBtn) runBtn.onclick = runMatch;

        // 清除结果
        var clearBtn = document.getElementById('quickClearResult');
        if (clearBtn) clearBtn.onclick = clearResult;

        // 新增规则
        var addBtn = document.getElementById('quickAddRule');
        if (addBtn) addBtn.onclick = function() { showRuleEditor(-1); };

        // 帮助
        var helpBtn = document.getElementById('quickHelp');
        if (helpBtn) helpBtn.onclick = showHelp;

        // 规则列表操作（事件委托）
        var ruleList = document.getElementById('quickRuleList');
        if (ruleList) {
            ruleList.onclick = function(e) {
                var target = e.target;
                if (target.tagName === 'A' && target.dataset.action) {
                    var action = target.dataset.action;
                    var idx = parseInt(target.dataset.index);
                    if (action === 'edit') {
                        showRuleEditor(idx);
                    } else if (action === 'delete') {
                        if (confirm('确定删除规则"' + rules[idx].name + '"？')) {
                            rules.splice(idx, 1);
                            renderRuleList();
                            updateStats();
                        }
                    } else if (action === 'toggle') {
                        rules[idx].isEnabled = !(rules[idx].isEnabled !== false);
                        renderRuleList();
                        updateStats();
                    }
                }
            };
        }

        // 数据表格行选中
        var tableBody = document.getElementById('quickTableBody');
        if (tableBody) {
            tableBody.onclick = function(e) {
                var row = e.target.closest('tr.data-row');
                if (row) {
                    var idx = parseInt(row.dataset.rowIndex);
                    // 取消之前选中
                    document.querySelectorAll('#quickTableBody tr.selected').forEach(function(r) {
                        r.classList.remove('selected');
                    });
                    row.classList.add('selected');
                    selectedRowIndex = idx;
                }
            };
        }
    }

    /**
     * HTML转义
     */
    function escapeHtml(text) {
        if (!text) return '';
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    return {
        init: init
    };
})();

    </script>
    <script>
/**
 * 高级模式视图 - 漏斗式三层解析（预设数据演示）
 *

    <script>

window.ABMatchModeView = (function() {

    function render() {

                    <span class="sub-toolbar-label">价格计算:</span>

    /**

    function renderTable(columns, rows) {
        if (!columns || columns.length === 0) return '<div class="empty-state">无数据</div>';

        var html = '<table class="data-table"><thead><tr>';

        html += '</tr></thead><tbody>';

            html += '<tr>';
            columns.forEach(function(col) {

        html += '</tbody></table>';

    /**
     * 执行匹配（展示预计算结果）

        var results = window.ABMatchResults || [];

        if (results.length === 0) {

                return;

            var r = results[idx];

        container.onclick = function(e) {

    /**

    function recalcPrice(candidates, method) {

                                <th>匹配度</th>
                                <th>加权分</th>
                                <th>价格(元)</th>
                                <th>日期</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${r.candidates.map(function(c, idx) {
                                var bRow = tableB.rows.find(function(row) { return row.rowIndex === c.bRowIndex; }) || {};
                                var bestStyle = idx === 0 ? ' style="background:#FFF8E1;"' : '';
                                return `<tr${bestStyle}>
                                    <td class="numeric-cell">${c.bRowIndex}</td>
                                    <td>${escapeHtml(bRow.name || '-')}</td>
                                    <td>${escapeHtml(bRow.spec || '-')}</td>
                                    <td class="numeric-cell"><span style="color:#1A56DB;font-weight:600;">${(c.matchScore * 100).toFixed(0)}%</span></td>
                                    <td class="numeric-cell">${c.weightedScore.toFixed(2)}</td>
                                    <td class="numeric-cell" style="color:#CC6600;font-weight:600;">${formatNumber(c.price)}</td>
                                    <td>${escapeHtml(c.date)}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                    <div style="margin-top:12px;padding:10px;background:#FFF8E1;border-radius:4px;">
                        <strong>价格计算（${currentCalcMethod}）：</strong>
                        <span style="color:#CC6600;font-weight:600;font-size:14px;">${formatNumber(recalcPrice(r.candidates, currentCalcMethod))} 元</span>
                    </div>
                </div>
                <div class="modal-footer"><button class="btn btn-accent">关闭</button></div>
            </div>
        `;
        document.getElementById('modalContainer').appendChild(modal);
        modal.querySelector('.modal-close').onclick = function() { modal.remove(); };
        modal.querySelector('.modal-footer button').onclick = function() { modal.remove(); };
    }

    /**
     * 清除结果
     */
    function clearResult() {
        var container = document.getElementById('abResultsContainer');
        if (container) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎯</div><div>点击"▶ 执行匹配"按钮查看匹配结果</div></div>';
        }
    }

    function bindEvents() {
        var runBtn = document.getElementById('abRunMatch');
        if (runBtn) runBtn.onclick = runMatch;

        var clearBtn = document.getElementById('abClearResult');
        if (clearBtn) clearBtn.onclick = clearResult;

        var methodSel = document.getElementById('abCalcMethod');
        if (methodSel) {
            methodSel.value = currentCalcMethod;
            methodSel.onchange = function() {
                currentCalcMethod = this.value;
                // 如果已有结果，重新渲染
                var bodyEl = document.getElementById('abResultsBody');
                if (bodyEl && bodyEl.children.length > 0) {
                    runMatch();
                }
            };
        }
    }

    /**
     * 数字格式化：千分位 + 2位小数
     */
    function formatNumber(num) {
        if (typeof num !== 'number') num = parseFloat(num) || 0;
        return num.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function escapeHtml(text) {
        if (!text) return '';
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    return { init: init };
})();

    </script>

    <!-- ========== 主应用 ========== -->
    <script>
        // 模式切换
        document.querySelectorAll('.mode-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                var mode = tab.dataset.mode;
                document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                document.querySelectorAll('.mode-view').forEach(function(v) { v.classList.remove('active'); });
                var viewId = mode === 'abmatch' ? 'abMatchModeView' : mode + 'ModeView';
                var viewEl = document.getElementById(viewId);
                if (viewEl) viewEl.classList.add('active');
                var modeNames = { quick: '快速模式', advanced: '高级模式（三层解析）', abmatch: 'AB表智能匹配' };
                document.getElementById('statusText').textContent = '当前模式：' + modeNames[mode];
            });
        });

        // 初始化各视图
        window.addEventListener('DOMContentLoaded', function() {
            try {
                QuickModeView.init('quickModeView');
                AdvancedModeView.init('advancedModeView');
                ABMatchModeView.init('abMatchModeView');
            } catch(e) {
                console.error('初始化错误:', e);
                document.getElementById('statusText').textContent = '初始化错误: ' + e.message;
            }
        });
    </script>
</body>
</html>
