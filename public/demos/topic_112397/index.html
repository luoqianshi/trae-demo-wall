function generateHistory(basePrice, days) {
  const history = [];
  let price = basePrice * (0.92 + Math.random() * 0.08);
  const now = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const volatility = basePrice * 0.025;
    const change = (Math.random() - 0.48) * volatility;
    price = Math.max(basePrice * 0.7, Math.min(basePrice * 1.3, price + change));
    const open = price + (Math.random() - 0.5) * volatility * 0.5;
    const close = price;
    const high = Math.max(open, close) + Math.random() * volatility * 0.3;
    const low = Math.min(open, close) - Math.random() * volatility * 0.3;
    const vol = Math.floor(Math.random() * 100000) + 20000;
    history.push({
      date: `${d.getMonth() + 1}/${d.getDate()}`,
      dateStr: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
      open: +open.toFixed(2),
      close: +close.toFixed(2),
      high: +high.toFixed(2),
      low: +low.toFixed(2),
      volume: vol,
      actual: +close.toFixed(2)
    });
  }
  const predict = [];
  let predPrice = price;
  for (let i = 1; i <= 5; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() + i);
    predPrice = predPrice * (1 + (Math.random() - 0.45) * 0.02);
    predict.push({
      date: `${d.getMonth() + 1}/${d.getDate()}`,
      predicted: +predPrice.toFixed(2)
    });
  }
  return { history, predict };
}

function formatPct(n) {

}

function formatNum(n) {

}

function cls(n) {
  return n >= 0 ? 'up' : 'down';
}

function decimalsFor(value) {
  const n = Number(value);
  if (!isFinite(n)) return 0;
  return n === Math.floor(n) ? 0 : 2;
}

function showToast(msg, type = 'info') {

  c.appendChild(t);

    t.style.transform = 'translateX(100%)';
    t.style.transition = 'all .3s';
    setTimeout(() => t.remove(), 300);
  }, 3000);
}

function createWave(e, btn) {
  if (!btn) return;
  const r = btn.getBoundingClientRect();
  const s = Math.max(r.width, r.height);
  const w = document.createElement('span');
  w.className = 'wave';
  w.style.width = w.style.height = s + 'px';
  w.style.left = e.clientX - r.left - s / 2 + 'px';
  w.style.top = e.clientY - r.top - s / 2 + 'px';
  btn.appendChild(w);
  setTimeout(() => w.remove(), 600);
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.btn');
  if (btn) createWave(e, btn);
});

function updateTradeAmount() {
  const price = parseFloat(document.getElementById('tradePrice')?.value || 0);
  const shares = parseInt(document.getElementById('tradeShares')?.value || 0);

  const amount = price * shares;
  const commission = Math.max(5, amount * 0.00025);
  const tax = state.tradeDirection === 'sell' ? amount * 0.001 : 0;
  const total = state.tradeDirection === 'buy' ? amount + commission + tax : amount - commission - tax;
  
  const amtEl = document.getElementById('tradeAmount');
  const commEl = document.getElementById('tradeCommission');
  const taxEl = document.getElementById('tradeTax');
  const totalEl = document.getElementById('tradeTotal');
  
  if (amtEl) amtEl.textContent = formatMoney(amount);
  if (commEl) commEl.textContent = formatMoney(commission);
  if (taxEl) taxEl.textContent = formatMoney(tax);
  if (totalEl) totalEl.textContent = formatMoney(total);
}

function setMaxShares() {

  const stockCode = code?.match(/\(([^)]+)\)/)?.[1] || state.currentStockKey;
  const stock = getStock(stockCode);
  if (!stock) return;
  const price = parseFloat(document.getElementById('tradePrice')?.value || stock.price);
  if (state.tradeDirection === 'buy') {
    const maxShares = Math.floor(state.cash / price / 100) * 100;
    document.getElementById('tradeShares').value = Math.max(100, maxShares);
  } else {
    const pos = state.positions.find(p => p.code === stockCode);
    document.getElementById('tradeShares').value = pos ? pos.shares : 0;
  }
  updateTradeAmount();
}

function submitTrade(code, direction) {
  const stock = getStock(code);
  if (!stock) return;
  const price = parseFloat(document.getElementById('tradePrice')?.value || stock.price);
  const shares = parseInt(document.getElementById('tradeShares')?.value || 0);
  
  if (shares < 100 || shares % 100 !== 0) {
    showToast('数量必须是100股的整数倍', 'error');
    return;
  }
  
  const amount = price * shares;
  const commission = Math.max(5, amount * 0.00025);
  const tax = direction === 'sell' ? amount * 0.001 : 0;
  
  if (direction === 'buy') {
    const totalCost = amount + commission + tax;
    if (totalCost > state.cash) {
      showToast('可用资金不足', 'error');
      return;
    }
    state.cash = +(state.cash - totalCost).toFixed(2);
    const existing = state.positions.find(p => p.code === code);
    if (existing) {
      const totalShares = existing.shares + shares;
      const totalCostBasis = existing.shares * existing.cost + amount;
      existing.cost = +(totalCostBasis / totalShares).toFixed(2);
      existing.shares = totalShares;
    } else {
      state.positions.push({code, name: stock.name, shares, cost: price, price: stock.price, marketValue: amount, pnl: 0, pnlPct: 0});
    }
    showToast(`成功买入 ${stock.name} ${shares}股`, 'success');
  } else {
    const pos = state.positions.find(p => p.code === code);
    if (!pos || pos.shares < shares) {
      showToast('可卖数量不足', 'error');
      return;
    }
    const totalRevenue = amount - commission - tax;
    state.cash = +(state.cash + totalRevenue).toFixed(2);
    pos.shares -= shares;
    if (pos.shares <= 0) {
      state.positions = state.positions.filter(p => p.code !== code);
    }
    showToast(`成功卖出 ${stock.name} ${shares}股`, 'success');
  }
  
  state.orders.unshift({
    id: Date.now(),
    date: new Date().toLocaleString('zh-CN', {hour12: false}).replace(/\//g, '-'),
    code,
    name: stock.name,
    type: direction,
    price,
    shares,
    amount,
    status: 'completed',
    filled: shares
  });
  
  closeModal();
  updateHeader();
  render();
}

function easeOutQuart(t) {
  return 1 - Math.pow(1 - t, 4);
}

function animateNumber(el, start, end, duration, decimals) {
  const startTime = performance.now();
  const d = decimals !== undefined ? decimals : decimalsFor(end);
  function update(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOutQuart(progress);
    const current = start + (end - start) * eased;
    el.textContent = current.toFixed(d);
    if (progress < 1) {
      requestAnimationFrame(update);
    }
  }
  requestAnimationFrame(update);
}

function renderLineChart(stock) {
  const w = 700;
  const h = 350;
  const pad = {l: 50, r: 20, t: 40, b: 50};
  const cw = w - pad.l - pad.r;
  const ch = h - pad.t - pad.b;
  
  const historicalData = stock.history.slice(-30);
  const predictData = stock.predict || [];
  const allLabels = [...historicalData.map(d => d.date), ...predictData.map(d => d.date)];
  const actualVals = historicalData.map(d => d.actual);
  const predictVals = predictData.map(d => d.predicted);
  
  const allValues = [...actualVals, ...predictVals];
  const minVal = Math.min(...allValues);
  const maxVal = Math.max(...allValues);
  const range = maxVal - minVal || 1;
  const padding = range * 0.1;
  const yMin = Math.floor(minVal - padding);
  const yMax = Math.ceil(maxVal + padding);
  
  const n = allLabels.length;
  const x = i => pad.l + (i / (n - 1)) * cw;
  const y = v => pad.t + ((yMax - v) / (yMax - minVal)) * ch;
  
  function smoothPath(points) {
    if (points.length < 2) return '';
    let path = `M${points[0].x},${points[0].y}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || p2;
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      path += ` C${cp1x},${cp1y} ${cp2x},${cp2y} ${p2.x},${p2.y}`;
    }
    return path;
  }
  
  const actualPoints = historicalData.map((d, i) => ({x: x(i), y: y(d.actual)}));
  const predictStartIdx = historicalData.length - 1;
  const predictPoints = [];
  for (let i = 0; i < predictData.length; i++) {
    predictPoints.push({x: x(predictStartIdx + i), y: y(predictData[i].predicted)});
  }
  const connectPoint = {x: x(predictStartIdx), y: y(historicalData[historicalData.length - 1].actual)};
  const fullPredictPoints = [connectPoint, ...predictPoints];
  
  const actualPath = smoothPath(actualPoints);
  const predictPath = smoothPath(fullPredictPoints);
  
  let areaPath = `M${actualPoints[0].x},${pad.t + ch}`;
  actualPoints.forEach(p => { areaPath += ` L${p.x},${p.y}`; });
  areaPath += ` L${actualPoints[actualPoints.length - 1].x},${pad.t + ch} Z`;
  
  let grid = '';
  for (let i = 0; i <= 5; i++) {
    const gy = pad.t + (i / 5) * ch;
    const gv = yMax - (yMax - yMin) * (i / 5);
    grid += `<line x1="${pad.l}" y1="${gy}" x2="${w - pad.r}" y2="${gy}" stroke="#f0f0f0" stroke-width="1"/>`;
    grid += `<text x="${pad.l - 8}" y="${gy + 4}" text-anchor="end" fill="#999" font-size="11">${gv.toFixed(decimalsFor(gv))}</text>`;
  }
  
  let xLabels = '';
  const labelStep = Math.max(1, Math.floor(n / 8));
  allLabels.forEach((label, i) => {
    if (i % labelStep === 0 || i === n - 1) {
      xLabels += `<text x="${x(i)}" y="${h - pad.b + 20}" text-anchor="middle" fill="#999" font-size="11" transform="rotate(-30 ${x(i)} ${h - pad.b + 20})">${label}</text>`;
    }
  });
  
  return `
    <div class="chart-container" id="lineChartContainer">
      <svg class="kline-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" id="lineChartSvg">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3888fa" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#3888fa" stop-opacity="0.01"/>
          </linearGradient>
        </defs>
        ${grid}
        ${xLabels}
        <path d="${areaPath}" fill="url(#areaGrad)" class="chart-area-path"/>
        <path d="${actualPath}" fill="none" stroke="#3888fa" stroke-width="2" stroke-linecap="round" class="chart-actual-line"/>
        <path d="${predictPath}" fill="none" stroke="#FF005A" stroke-width="2" stroke-linecap="round" class="chart-predict-line"/>
        <line id="chartCrossH" x1="${pad.l}" y1="${pad.t}" x2="${w - pad.r}" y2="${pad.t}" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" style="display:none"/>
        <line id="chartCrossV" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + ch}" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" style="display:none"/>
        <circle id="chartDot1" r="4" fill="#3888fa" style="display:none"/>
        <circle id="chartDot2" r="4" fill="#FF005A" style="display:none"/>
      </svg>
      <div class="legend">
        <div class="legend-item"><span class="legend-line" style="background:#3888fa"></span>实际值</div>
        <div class="legend-item"><span class="legend-line" style="background:#FF005A"></span>预测值</div>
      </div>
      <div class="chart-tooltip" id="lineChartTooltip"></div>
    </div>
  `;
}

function setupLineChartInteraction() {
  setTimeout(() => {
    const container = document.getElementById('lineChartContainer');
    const svg = document.getElementById('lineChartSvg');
    const tooltip = document.getElementById('lineChartTooltip');
    const crossH = document.getElementById('chartCrossH');
    const crossV = document.getElementById('chartCrossV');
    const dot1 = document.getElementById('chartDot1');
    const dot2 = document.getElementById('chartDot2');
    if (!container || !svg) return;
    
    const stock = getCurrentStock();
    const historicalData = stock.history.slice(-30);
    const predictData = stock.predict || [];
    const allLabels = [...historicalData.map(d => d.date), ...predictData.map(d => d.date)];
    const n = allLabels.length;
    
    const w = 700, h = 350;
    const pad = {l: 50, r: 20, t: 40, b: 50};
    const cw = w - pad.l - pad.r;
    const ch = h - pad.t - pad.b;
    
    const actualVals = historicalData.map(d => d.actual);
    const predictVals = predictData.map(d => d.predicted);
    const allValues = [...actualVals, ...predictVals];
    const minVal = Math.min(...allValues);
    const maxVal = Math.max(...allValues);
    const range = maxVal - minVal || 1;
    const padding = range * 0.1;
    const yMin = Math.floor(minVal - padding);
    const yMax = Math.ceil(maxVal + padding);
    
    const x = i => pad.l + (i / (n - 1)) * cw;
    const y = v => pad.t + ((yMax - v) / (yMax - yMin)) * ch;
    
    function onMove(e) {
      const rect = svg.getBoundingClientRect();
      const scaleX = w / rect.width;
      const scaleY = h / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;
      
      if (mx < pad.l || mx > w - pad.r || my < pad.t || my > pad.t + ch) {
        crossH.style.display = 'none';
        crossV.style.display = 'none';
        dot1.style.display = 'none';
        dot2.style.display = 'none';
        tooltip.style.display = 'none';
        return;
      }
      
      const idx = Math.round((mx - pad.l) / cw * (n - 1));
      const clampedIdx = Math.max(0, Math.min(n - 1, idx));
      const px = x(clampedIdx);
      
      crossH.style.display = '';
      crossV.style.display = '';
      crossH.setAttribute('x1', pad.l);
      crossH.setAttribute('x2', w - pad.r);
      crossH.setAttribute('y1', my);
      crossH.setAttribute('y2', my);
      crossV.setAttribute('x1', px);
      crossV.setAttribute('x2', px);
      crossV.setAttribute('y1', pad.t);
      crossV.setAttribute('y2', pad.t + ch);
      
      let html = `<div style="font-weight:600;margin-bottom:4px">${allLabels[clampedIdx]}</div>`;
      
      if (clampedIdx < historicalData.length) {
        const val = historicalData[clampedIdx].actual;
        const py = y(val);
        dot1.style.display = '';
        dot1.setAttribute('cx', px);
        dot1.setAttribute('cy', py);
        html += `<div><span style="color:#3888fa">●</span> 实际值: ${val.toFixed(2)}</div>`;
      }
      
      const predictIdx = clampedIdx - historicalData.length + 1;
      if (predictIdx >= 0 && predictIdx < predictData.length) {
        const val = predictData[predictIdx].predicted;
        const py = y(val);
        dot2.style.display = '';
        dot2.setAttribute('cx', px);
        dot2.setAttribute('cy', py);
        html += `<div><span style="color:#FF005A">●</span> 预测值: ${val.toFixed(2)}</div>`;
      } else if (clampedIdx === historicalData.length - 1 && predictData.length > 0) {
        dot2.style.display = 'none';
      } else {
        dot2.style.display = 'none';
      }
      
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
      const containerRect = container.getBoundingClientRect();
      let left = e.clientX - containerRect.left + 15;
      let top = e.clientY - containerRect.top - 10;
      if (left + 200 > containerRect.width) left = e.clientX - containerRect.left - 150;
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    }
    
    function onLeave() {
      crossH.style.display = 'none';
      crossV.style.display = 'none';
      dot1.style.display = 'none';
      dot2.style.display = 'none';
      tooltip.style.display = 'none';
    }
    
    svg.addEventListener('mousemove', onMove);
    svg.addEventListener('mouseleave', onLeave);
    
    setTimeout(() => {
      const actualLine = svg.querySelector('.chart-actual-line');
      const predictLine = svg.querySelector('.chart-predict-line');
      const areaPath = svg.querySelector('.chart-area-path');
      if (actualLine) {
        const len = actualLine.getTotalLength();
        actualLine.style.strokeDasharray = len;
        actualLine.style.strokeDashoffset = len;
        actualLine.animate([{strokeDashoffset: len}, {strokeDashoffset: 0}], {duration: 1600, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)', fill: 'forwards'});
      }
      if (areaPath) {
        areaPath.style.opacity = '0';
        areaPath.animate([{opacity: 0}, {opacity: 1}], {duration: 800, delay: 800, fill: 'forwards'});
      }
      if (predictLine) {
        const len = predictLine.getTotalLength();
        predictLine.style.strokeDasharray = len;
        predictLine.style.strokeDashoffset = len;
        predictLine.animate([{strokeDashoffset: len}, {strokeDashoffset: 0}], {duration: 2000, easing: 'cubic-bezier(0.86, 0, 0.07, 1)', fill: 'forwards'});
      }
    }, 100);
  }, 100);
}

  }

function scrollChatToBottom() {
  const msgs = document.getElementById('chatMsgs');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

function switchChatHistory(stockKey) {
  if (state.currentChatMessages.length > 0) {
    state.chatHistories[state.currentStockKey] = [...state.currentChatMessages];
  }
  if (state.chatHistories[stockKey]) {
    state.currentChatMessages = [...state.chatHistories[stockKey]];
  } else {
    state.currentChatMessages = [];
    const stock = getStock(stockKey);
    const initialMsg = generateInitialAIMessage(stock);
    state.currentChatMessages.push({role: 'ai', html: initialMsg});
  }
  state.chatOpen = true;
}

function generateInitialAIMessage(stock) {
  if (!stock) return '你好！我是AI管家，有什么可以帮你的？';
  const trendText = {
    strong_buy: '强烈买入信号，短期趋势强劲',
    buy: '买入信号，上升趋势中',
    hold: '观望信号，震荡整理',
    sell: '卖出信号，注意风险'
  }[stock.trend] || '观望';
  const pred = stock.predict && stock.predict.length > 0 ? stock.predict[stock.predict.length - 1].predicted : stock.price;
  const predDir = pred >= stock.price ? '上涨' : '下跌';
  const predPct = Math.abs(((pred - stock.price) / stock.price) * 100).toFixed(2);
  return `你好！我是你的AI投研助手。当前选中：<strong>${stock.name}</strong>，现价<span class="${cls(stock.todayChangePct)}">${stock.price.toFixed(2)}</span>，今日${formatPct(stock.todayChangePct)}。<br><br>📊 <strong>AI分析：</strong>${trendText}，综合评分${stock.score}分。<br>🎯 <strong>5日预测：</strong>目标${pred.toFixed(2)}元，预计${predDir}${predPct}%。<br>💡 你可以问我关于这只股票的任何问题，比如技术面分析、资金流向、操作建议等。`;
}

function sendChat() {
  const inp = document.getElementById('chatInput');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  
  state.currentChatMessages.push({role: 'user', html: escapeHtml(text)});
  inp.value = '';
  
  state.currentChatMessages.push({role: 'ai', typing: true});
  
  const chatBox = document.querySelector('.chat-box');
  if (chatBox) chatBox.outerHTML = renderChat();
  scrollChatToBottom();
  
  setTimeout(() => {
    const typingIdx = state.currentChatMessages.findIndex(m => m.typing);
    if (typingIdx >= 0) {
      const stock = getCurrentStock();
      const reply = generateAIReply(text, stock);
      state.currentChatMessages[typingIdx] = {role: 'ai', html: reply};
    }
    const chatBox2 = document.querySelector('.chat-box');
    if (chatBox2) chatBox2.outerHTML = renderChat();
    scrollChatToBottom();
  }, 1000 + Math.random() * 800);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML.replace(/\n/g, '<br/>');
}

}

function renderKlineChart(stock) {
  const w = 800;
  const h = 420;
  const pad = {l: 55, r: 15, t: 20, b: 30};
  const volH = 70;
  const macdH = 60;
  const gap = 15;
  const priceH = h - pad.t - pad.b - volH - macdH - gap * 2;
  
  const data = stock.history.slice(-60);
  const n = data.length;
  const highs = data.map(d => d.high);
  const lows = data.map(d => d.low);
  const mx = Math.max(...highs) * 1.01;
  const mn = Math.min(...lows) * 0.99;
  const mxVol = Math.max(...data.map(d => d.volume));
  
  const cw = w - pad.l - pad.r;
  const step = cw / n;
  const bw = step * 0.7;
  
  const priceY = v => pad.t + ((mx - v) / (mx - mn)) * priceH;
  const volY = v => pad.t + priceH + gap + volH - (v / mxVol) * volH;
  const macdY0 = pad.t + priceH + gap + volH + gap;
  
  function calcMA(period) {
    const ma = [];
    for (let i = 0; i < n; i++) {
      if (i < period - 1) { ma.push(null); continue; }
      let sum = 0;
      for (let j = i - period + 1; j <= i; j++) sum += data[j].close;
      ma.push(sum / period);
    }
    return ma;
  }
  
  const ma5 = calcMA(5);
  const ma10 = calcMA(10);
  const ma20 = calcMA(20);
  
  function maPath(maData) {
    let path = '';
    let started = false;
    maData.forEach((v, i) => {
      if (v === null) return;
      const xi = pad.l + i * step + step / 2;
      const yi = priceY(v);
      path += (started ? 'L' : 'M') + xi + ',' + yi;
      started = true;
    });
    return path;
  }
  
  let candles = '';
  let vols = '';
  data.forEach((d, i) => {
    const xi = pad.l + i * step + step / 2;
    const up = d.close >= d.open;
    const color = up ? '#F56C6C' : '#67C23A';
    const yo = priceY(d.open);
    const yc = priceY(d.close);
    const yh = priceY(d.high);
    const yl = priceY(d.low);
    candles += `<line x1="${xi}" y1="${yh}" x2="${xi}" y2="${yl}" stroke="${color}" stroke-width="1"/>`;
    candles += `<rect x="${xi - bw / 2}" y="${Math.min(yo, yc)}" width="${bw}" height="${Math.max(Math.abs(yc - yo), 1)}" fill="${color}"/>`;
    const vh = (d.volume / mxVol) * volH;
    vols += `<rect x="${xi - bw / 2}" y="${pad.t + priceH + gap + volH - vh}" width="${bw}" height="${vh}" fill="${color}" opacity="0.6"/>`;
  });
  
  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const gy = pad.t + (i / 4) * priceH;
    const gv = mx - (mx - mn) * (i / 4);
    grid += `<line x1="${pad.l}" y1="${gy}" x2="${w - pad.r}" y2="${gy}" stroke="#f0f0f0" stroke-width="1"/>`;
    grid += `<text x="${pad.l - 8}" y="${gy + 4}" text-anchor="end" fill="#999" font-size="11">${gv.toFixed(decimalsFor(gv))}</text>`;
  }
  
  const volTop = pad.t + priceH + gap;
  grid += `<line x1="${pad.l}" y1="${volTop}" x2="${w - pad.r}" y2="${volTop}" stroke="#f0f0f0" stroke-width="1"/>`;
  grid += `<text x="${pad.l - 8}" y="${volTop + 12}" text-anchor="end" fill="#999" font-size="10">成交量(万)</text>`;
  
  const macdTop = macdY0;
  grid += `<line x1="${pad.l}" y1="${macdTop}" x2="${w - pad.r}" y2="${macdTop}" stroke="#f0f0f0" stroke-width="1"/>`;
  grid += `<text x="${pad.l - 8}" y="${macdTop + 12}" text-anchor="end" fill="#999" font-size="10">MACD</text>`;
  
  let macdBars = '';
  const macdVals = data.map((_, i) => {
    if (i < 20) return {macd: 0, signal: 0, hist: 0};
    const ema12 = data.slice(i - 11, i + 1).reduce((s, d) => s + d.close, 0) / 12;
    const ema26 = data.slice(i - 25, i + 1).reduce((s, d) => s + d.close, 0) / 26;
    const dif = ema12 - ema26;
    const dea = dif * 0.8;
    return {dif, dea, hist: (dif - dea) * 2};
  });
  const macdMax = Math.max(...macdVals.map(m => Math.abs(m.hist))) || 1;
  macdVals.forEach((m, i) => {
    if (i < 20) return;
    const xi = pad.l + i * step + step / 2;
    const barH = (Math.abs(m.hist) / macdMax) * (macdH * 0.8);
    const color = m.hist >= 0 ? '#F56C6C' : '#67C23A';
    macdBars += `<rect x="${xi - bw / 2}" y="${macdTop + macdH / 2 - (m.hist >= 0 ? barH : 0)}" width="${bw}" height="${barH}" fill="${color}" opacity="0.7"/>`;
  });
  
  let xLabels = '';
  const labelStep = Math.max(1, Math.floor(n / 6));
  data.forEach((d, i) => {
    if (i % labelStep === 0) {
      xLabels += `<text x="${pad.l + i * step + step / 2}" y="${h - 5}" text-anchor="middle" fill="#999" font-size="10">${d.date}</text>`;
    }
  });
  
  return `
    <div class="chart-container">
      <svg class="kline-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
        ${grid}
        ${candles}
        ${vols}
        ${macdBars}
        <path d="${maPath(ma5)}" fill="none" stroke="#f7ba2a" stroke-width="1"/>
        <path d="${maPath(ma10)}" fill="none" stroke="#36a3f7" stroke-width="1"/>
        <path d="${maPath(ma20)}" fill="none" stroke="#f4516c" stroke-width="1"/>
        ${xLabels}
      </svg>
      <div class="legend">
        <div class="legend-item"><span class="legend-line" style="background:#f7ba2a"></span>MA5</div>
        <div class="legend-item"><span class="legend-line" style="background:#36a3f7"></span>MA10</div>
        <div class="legend-item"><span class="legend-line" style="background:#f4516c"></span>MA20</div>
        <div class="legend-item"><span class="legend-dot" style="background:#F56C6C"></span>涨</div>
        <div class="legend-item"><span class="legend-dot" style="background:#67C23A"></span>跌</div>
      </div>
    </div>
  `;
}

function renderPieChart(data, size = 200) {
  const cx = size / 2;
  const cy = size / 2;
  const r = size / 2 - 10;
  const total = data.reduce((s, d) => s + d.value, 0);
  let startAngle = -Math.PI / 2;
  const colors = ['#409EFF', '#67C23A', '#e6a23c', '#F56C6C', '#909399', '#36a3f7', '#f4516c', '#34bfa3'];
  
  let paths = '';
  let legend = '';
  data.forEach((d, i) => {
    const angle = (d.value / total) * Math.PI * 2;
    const endAngle = startAngle + angle;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const largeArc = angle > Math.PI ? 1 : 0;
    const color = colors[i % colors.length];
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc},1 ${x2},${y2} Z" fill="${color}" opacity="0.8" stroke="#fff" stroke-width="2"/>`;
    const pct = ((d.value / total) * 100).toFixed(1);
    legend += `<div class="flex-gap-8" style="margin:4px 0;font-size:12px"><span class="legend-dot" style="background:${color}"></span>${d.name} ${pct}%</div>`;
    startAngle = endAngle;
  });
  
  return `
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>
      <div>${legend}</div>
    </div>
  `;
}

function renderBarChart(data, labels, w = 400, h = 200, color = '#409EFF') {
  const pad = {l: 40, r: 10, t: 20, b: 30};
  const cw = w - pad.l - pad.r;
  const ch = h - pad.t - pad.b;
  const mx = Math.max(...data, 0);
  const mn = Math.min(...data, 0);
  const range = mx - mn || 1;
  const padding = range * 0.1;
  const yMax = mx + padding;
  const yMin = mn - padding;
  const n = data.length;
  const bw = cw / n * 0.7;
  const step = cw / n;
  
  const y = v => pad.t + ((yMax - v) / (yMax - yMin)) * ch;
  
  let bars = '';
  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const gy = pad.t + (i / 4) * ch;
    const gv = yMax - (yMax - yMin) * (i / 4);
    grid += `<line x1="${pad.l}" y1="${gy}" x2="${w - pad.r}" y2="${gy}" stroke="#f0f0f0" stroke-width="1"/>`;
    grid += `<text x="${pad.l - 8}" y="${gy + 4}" text-anchor="end" fill="#999" font-size="10">${gv.toFixed(0)}</text>`;
  }
  grid += `<line x1="${pad.l}" y1="${y(0)}" x2="${w - pad.r}" y2="${y(0)}" stroke="#ddd" stroke-width="1"/>`;
  
  data.forEach((v, i) => {
    const xi = pad.l + i * step + step / 2;
    const barH = Math.abs(y(v) - y(0));
    const barY = v >= 0 ? y(v) : y(0);
    const barColor = v >= 0 ? '#F56C6C' : '#67C23A';
    bars += `<rect x="${xi - bw / 2}" y="${barY}" width="${bw}" height="${barH}" fill="${barColor}" opacity="0.8" rx="2"/>`;
    if (labels[i]) {
      bars += `<text x="${xi}" y="${h - 8}" text-anchor="middle" fill="#999" font-size="10">${labels[i]}</text>`;
    }
  });
  
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px"><defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.8"/><stop offset="100%" stop-color="${color}" stop-opacity="0.3"/></linearGradient></defs>${grid}${bars}</svg>`;
}

function renderRiskGauge(value, max = 100) {
  const size = 200;
  const cx = size / 2;
  const cy = size * 0.65;
  const r = 70;
  const startAngle = Math.PI;
  const endAngle = 0;
  const pct = Math.min(1, Math.max(0, value / max));
  const angle = startAngle + pct * (endAngle - startAngle);
  
  function arcPath(startA, endA, radius, color, width) {
    const x1 = cx + radius * Math.cos(startA);
    const y1 = cy + radius * Math.sin(startA);
    const x2 = cx + radius * Math.cos(endA);
    const y2 = cy + radius * Math.sin(endA);
    const largeArc = Math.abs(endA - startA) > Math.PI ? 1 : 0;
    return `<path d="M${x1},${y1} A${radius},${radius} 0 ${largeArc},1 ${x2},${y2}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`;
  }
  
  const needleX = cx + (r - 10) * Math.cos(angle);
  const needleY = cy + (r - 10) * Math.sin(angle);
  
  const riskColor = pct < 0.3 ? '#67C23A' : pct < 0.6 ? '#e6a23c' : '#F56C6C';
  const riskText = pct < 0.3 ? '低风险' : pct < 0.6 ? '中风险' : '高风险';
  
  return `
    <div class="risk-gauge">
      <svg viewBox="0 0 ${size} ${size * 0.8}">
        ${arcPath(startAngle, endAngle, r, '#f0f0f0', 12)}
        ${arcPath(startAngle, startAngle + pct * Math.PI, r, riskColor, 12)}
        <line x1="${cx}" y1="${cy}" x2="${needleX}" y2="${needleY}" stroke="#333" stroke-width="2" stroke-linecap="round"/>
        <circle cx="${cx}" cy="${cy}" r="6" fill="#333"/>
        <text x="${cx}" y="${cy + 25}" text-anchor="middle" font-size="24" font-weight="700" fill="${riskColor}">${value.toFixed(0)}</text>
        <text x="${cx}" y="${cy + 45}" text-anchor="middle" font-size="14" fill="${riskColor}">${riskText}</text>
        <text x="${cx - r}" y="${cy + 10}" text-anchor="middle" font-size="10" fill="#999">安全</text>
        <text x="${cx + r}" y="${cy + 10}" text-anchor="middle" font-size="10" fill="#999">危险</text>
      </svg>
    </div>
  `;
}

function renderPagination(current, total, pageSize = 10) {
  const totalPages = Math.ceil(total / pageSize);
  let html = '';
  html += `<span style="font-size:13px;color:#999;margin-right:8px">共${total}条</span>`;
  html += `<button class="page-btn" onclick="changePage(${current - 1})" ${current <= 1 ? 'disabled' : ''}>‹</button>`;
  for (let i = 1; i <= Math.min(totalPages, 5); i++) {
    html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
  }
  if (totalPages > 5) html += `<span style="padding:0 4px;color:#999">...</span><button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
  html += `<button class="page-btn" onclick="changePage(${current + 1})" ${current >= totalPages ? 'disabled' : ''}>›</button>`;
  return html;
}

function renderEquityChart(data) {
  const W=700,H=280,ml=50,mr=20,mt=20,mb=40;
  const cw=W-ml-mr, ch=H-mt-mb;
  const allVals = data.flatMap(d=>[d.eq,d.hs]);
  let minV=Math.min(...allVals), maxV=Math.max(...allVals);
  const pad=(maxV-minV)*0.1; minV-=pad; maxV+=pad;
  const x = i => ml + (i/(data.length-1))*cw;
  const y = v => mt + ch - ((v-minV)/(maxV-minV))*ch;
  const eqPath = data.map((d,i)=>(i?'L':'M')+x(i)+','+y(d.eq)).join(' ');
  const hsPath = data.map((d,i)=>(i?'L':'M')+x(i)+','+y(d.hs)).join(' ');
  const eqArea = eqPath+` L${x(data.length-1)},${mt+ch} L${x(0)},${mt+ch} Z`;
  const yTicks = 5;
  let yLabels='';
  for(let i=0;i<=yTicks;i++){
    const v = minV+(maxV-minV)*(i/yTicks);
    yLabels+=`<text x="${ml-5}" y="${mt+ch-ch*(i/yTicks)+4}" text-anchor="end" fill="#999" font-size="11">${Math.round(v/10000)}万</text>`;
    yLabels+=`<line x1="${ml}" x2="${W-mr}" y1="${mt+ch-ch*(i/yTicks)}" y2="${mt+ch-ch*(i/yTicks)}" stroke="#f0f0f0" stroke-width="1"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">
    <defs><linearGradient id="eqGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#409EFF" stop-opacity=".15"/><stop offset="100%" stop-color="#409EFF" stop-opacity="0"/></linearGradient></defs>
    ${yLabels}
    <path d="${eqArea}" fill="url(#eqGrad)"/>
    <path d="${eqPath}" fill="none" stroke="#409EFF" stroke-width="2"/>

function openTradeModal(code, type){

function setTradeType(t){ state.tradeModal.type=t; renderModal(); }
function setTradeShares(s){
  if(s==='all'){
    const pos=state.positions.find(p=>p.code===state.tradeModal.code);
    state.tradeModal.shares = state.tradeModal.type==='sell' ? (pos?pos.shares:0) : Math.floor(state.cash/state.tradeModal.price/100)*100;
  }else{
    state.tradeModal.shares = s;
  }
  renderModal();
}

function calcFees(price, shares, type){
  const amount = price*shares;
  const commission = Math.max(5, amount*0.00025);
  const stampTax = type==='sell'?amount*0.001:0;
  const transfer = amount*0.00002;
  return {amount, commission, stampTax, transfer, total:commission+stampTax+transfer};
}

function executeTrade(){
  const t=state.tradeModal;
  const st=state.stocks[t.code];
  const price = st.price;
  const shares = parseInt(t.shares)||0;
  if(shares%100!==0){ showToast('数量必须是100的整数倍','error'); return; }
  if(shares<=0){ showToast('请输入有效数量','error'); return; }
  const fees = calcFees(price, shares, t.type);
  
  if(t.type==='buy'){
    const cost = fees.amount+fees.total;
    if(cost>state.cash){ showToast('可用资金不足','error'); return; }
    state.cash -= cost;
    const existing = state.positions.find(p=>p.code===t.code);
    if(existing){
      const totalCost = existing.costPrice*existing.shares + cost;
      existing.shares += shares;
      existing.costPrice = totalCost/existing.shares;
    }else{
      state.positions.push({code:t.code,shares,costPrice:(fees.amount+fees.total)/shares});
    }
  }else{
    const existing = state.positions.find(p=>p.code===t.code);
    if(!existing||existing.shares<shares){ showToast('持仓不足','error'); return; }
    state.cash += fees.amount - fees.total;
    existing.shares -= shares;
    if(existing.shares===0) state.positions = state.positions.filter(p=>p.code!==t.code);
  }
  state.orders.unshift({
    date: new Date().toLocaleString('zh-CN'),
    code:t.code, name:st.name, type:t.type,
    price, shares, amount:fees.amount
  });
  showToast(`${t.type==='buy'?'买入':'卖出'}${st.name}${shares}股成功！`,'success');
  closeTradeModal();
  render();
}

function addWaveListeners(){
  document.querySelectorAll('.btn,.menu-item,.panel-card-footer div,.tab-item,.tag').forEach(el=>{
    if(el._waveBound) return;
    el._waveBound=true;
    el.addEventListener('click',e=>{
      const rect=el.getBoundingClientRect();
      const ripple=document.createElement('span');
      ripple.className='wave-ripple';
      const size=Math.max(rect.width,rect.height);
      ripple.style.width=ripple.style.height=size+'px';
      ripple.style.left=(e.clientX-rect.left-size/2)+'px';
      ripple.style.top=(e.clientY-rect.top-size/2)+'px';
      el.style.position=el.style.position||'relative';
      el.style.overflow='hidden';
      el.appendChild(ripple);
      setTimeout(()=>ripple.remove(),600);
    });
  });
}

function parseHash(){
  const h=window.location.hash.slice(1)||'/dashboard';
  const [path,query='']=h.split('?');
  const page=path.replace('/','')||'dashboard';
  const params={};
  query.split('&').filter(Boolean).forEach(kv=>{const[k,v]=kv.split('=');params[k]=decodeURIComponent(v||'');});
  return {page,params};
}

function simulateMarketTick(){
  Object.values(state.stocks).forEach(s=>{
    const ch=(Math.random()-0.49)*0.01;
    s.price=+((s.price)*(1+ch)).toFixed(2);
    s.todayChange=+(s.price-s.prevClose).toFixed(2);
    s.todayChangePct=+((s.todayChange/s.prevClose)*100).toFixed(2);
    s._flash = ch>0?'up':ch<0?'down':'';
    if(s.history){
      const last=s.history[s.history.length-1];
      s.history[s.history.length-1]={...last,close:s.price,high:Math.max(last.high,s.price),low:Math.min(last.low,s.price)};
    }
  });
  updatePositionsPrice();
  setTimeout(()=>{Object.values(state.stocks).forEach(s=>s._flash='');render();},1200);
}

function render(){
  const {page,params}=parseHash();
  state.currentPage=page;
  if(params.code && !state.currentStock) state.currentStock=params.code;
  
  document.getElementById('menuItems').innerHTML=MENU_ITEMS.map(m=>`
    <div class="menu-item ${page===m.key?'active':''}" onclick="window.location.hash='#/${m.key}'">
      <span style="font-size:18px;margin-right:10px;width:20px;text-align:center;display:inline-block">${m.icon}</span>
      ${state.sidebarCollapsed?'':m.label}
    </div>
  `).join('');
  
  document.getElementById('breadcrumb').innerHTML = `<span style="color:#999">首页</span><span style="margin:0 6px">/</span><b>${MENU_ITEMS.find(m=>m.key===page)?.label||'Dashboard'}</b>`;
  const totalAsset=getTotalAsset();
  const dailyPnl=Object.values(state.stocks).reduce((s,st)=>{
    const p=state.positions.find(pp=>pp.code===st.code);
    if(!p)return s;
    const ch=st.price-st.history[st.history.length-2]?.close||st.basePrice;
    return s+ch*p.shares;
  },0);
  document.getElementById('headerInfo').innerHTML=`
    <span style="margin-right:16px">💰 ${formatMoney(totalAsset)}</span>
    <span style="color:${cls(dailyPnl)}">今日${formatPct((dailyPnl/totalAsset*100)||0)}</span>
  `;
  
  const pageFn=pages[page]||pages.dashboard;
  document.getElementById('pageContent').innerHTML=pageFn();
  
  renderModal();
  addWaveListeners();
  
  setTimeout(()=>{
    const ci=document.getElementById('chatInput');
    if(ci){
      ci.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
      ci.focus();
    }
  },50);
}
