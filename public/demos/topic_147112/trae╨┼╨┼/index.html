<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习小勇士</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            color: #2D3436;
            overflow-x: hidden;
        }

        .page {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 通用卡片样式 */
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes confetti {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: confetti 3s ease-in-out forwards;
            z-index: 1000;
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #FF6B35, #FFE66D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #2D3436;
        }

        .subtitle {
            text-align: center;
            color: #636e72;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #2D3436;
            font-size: 1.1rem;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 3px solid #dfe6e9;
            border-radius: 16px;
            font-family: inherit;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #FF6B35;
            background: white;
            box-shadow: 0 0 0 4px rgba(255,107,53,0.1);
        }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-align: center;
            user-select: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B35, #feca57);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4ECDC4, #44a08d);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #FFE66D, #FF6B35);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ee5a6f, #f44336);
            color: white;
        }

        .btn-large {
            padding: 20px 60px;
            font-size: 1.4rem;
        }

        .btn-block {
            display: block;
            width: 100%;
        }

        /* 游戏大厅 */
        .hall-header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B35, #FFE66D);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .user-detail {
            font-size: 0.95rem;
            color: #636e72;
        }

        .user-detail strong {
            display: block;
            color: #2D3436;
            font-size: 1.1rem;
        }

        .edit-btn {
            padding: 8px 20px;
            font-size: 0.9rem;
            background: #f1f2f6;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .edit-btn:hover {
            background: #e0e0e0;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 900px;
        }

        .game-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #FF6B35, #FFE66D);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .game-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 2s ease-in-out infinite;
        }

        .game-card:nth-child(2) .game-icon { animation-delay: 0.3s; }
        .game-card:nth-child(3) .game-icon { animation-delay: 0.6s; }
        .game-card:nth-child(4) .game-icon { animation-delay: 0.9s; }

        .game-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2D3436;
        }

        .game-knowledge {
            display: inline-block;
            padding: 5px 15px;
            background: linear-gradient(135deg, #4ECDC4, #44a08d);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .game-desc {
            color: #636e72;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .game-grade {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #b2bec3;
        }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.4s ease;
        }

        .modal h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-icon {
            font-size: 5rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .rule-list {
            list-style: none;
            margin-bottom: 30px;
        }

        .rule-list li {
            padding: 12px 0;
            padding-left: 35px;
            position: relative;
            border-bottom: 1px solid #f1f2f6;
            font-size: 1rem;
            line-height: 1.6;
        }

        .rule-list li:last-child {
            border-bottom: none;
        }

        .rule-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            top: 12px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #4ECDC4, #44a08d);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* 游戏页面 */
        .game-page {
            padding: 0;
        }

        .game-header {
            width: 100%;
            padding: 15px 30px;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .game-header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .game-header-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .timer {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #FF6B35;
            background: #fff5e6;
            padding: 8px 20px;
            border-radius: 25px;
        }

        .timer.warning {
            color: #ee5a6f;
            background: #ffe0e0;
            animation: pulse 0.5s ease infinite;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #4ECDC4;
            background: #e8f8f5;
            padding: 8px 20px;
            border-radius: 25px;
        }

        .pause-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFE66D, #FF6B35);
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pause-btn:hover {
            transform: scale(1.1);
        }

        .game-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            width: 100%;
        }

        .game-area {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        /* 数学游戏 */
        .math-question {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #2D3436;
            letter-spacing: 5px;
        }

        .math-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .math-option {
            padding: 25px;
            font-size: 1.8rem;
            font-weight: bold;
            border: 3px solid #dfe6e9;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .math-option:hover {
            border-color: #FF6B35;
            background: #fff5e6;
            transform: scale(1.05);
        }

        .math-option.correct {
            border-color: #4ECDC4;
            background: #e8f8f5;
            color: #4ECDC4;
            animation: pulse 0.3s ease;
        }

        .math-option.wrong {
            border-color: #ee5a6f;
            background: #ffe0e0;
            color: #ee5a6f;
            animation: shake 0.3s ease;
        }

        .feedback {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            min-height: 40px;
        }

        .feedback.correct {
            color: #4ECDC4;
        }

        .feedback.wrong {
            color: #ee5a6f;
        }

        /* 汉字游戏 */
        .hanzi-question {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #2D3436;
        }

        .hanzi-pinyin {
            font-size: 1.5rem;
            color: #636e72;
            margin-bottom: 30px;
        }

        .hanzi-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .hanzi-option {
            padding: 20px;
            font-size: 1.3rem;
            border: 3px solid #dfe6e9;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .hanzi-option:hover {
            border-color: #4ECDC4;
            background: #e8f8f5;
        }

        .hanzi-option.correct {
            border-color: #4ECDC4;
            background: #e8f8f5;
            color: #4ECDC4;
        }

        .hanzi-option.wrong {
            border-color: #ee5a6f;
            background: #ffe0e0;
            color: #ee5a6f;
        }

        /* 英语单词游戏 */
        .word-english {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #6c5ce7;
        }

        .word-hint {
            font-size: 1rem;
            color: #b2bec3;
            margin-bottom: 30px;
        }

        .word-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .word-option {
            padding: 20px;
            font-size: 1.3rem;
            border: 3px solid #dfe6e9;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .word-option:hover {
            border-color: #6c5ce7;
            background: #f0edff;
        }

        .word-option.correct {
            border-color: #4ECDC4;
            background: #e8f8f5;
            color: #4ECDC4;
        }

        .word-option.wrong {
            border-color: #ee5a6f;
            background: #ffe0e0;
            color: #ee5a6f;
        }

        /* 结算页面 */
        .result-card {
            text-align: center;
        }

        .result-icon {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: bounce 1s ease;
        }

        .result-title {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #FF6B35, #FFE66D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-stars {
            font-size: 3rem;
            margin-bottom: 30px;
            letter-spacing: 10px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 16px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #FF6B35;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #636e72;
            margin-top: 5px;
        }

        .result-message {
            font-size: 1.1rem;
            color: #636e72;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f1f2f6;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ECDC4, #44a08d);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .question-count {
            text-align: center;
            color: #b2bec3;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* 欢迎页装饰 */
        .welcome-emoji {
            font-size: 6rem;
            text-align: center;
            margin-bottom: 20px;
            animation: bounce 2s ease infinite;
        }

        /* 时钟游戏样式 */
        .clock-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .clock-svg {
            width: 220px;
            height: 220px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1));
        }

        /* 语音开关按钮 */
        .speech-toggle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ECDC4, #44a08d);
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speech-toggle:hover {
            transform: scale(1.1);
        }

        .speech-toggle.off {
            background: linear-gradient(135deg, #b2bec3, #636e72);
        }

        /* 等级徽章样式 */
        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }

        .level-badge-small {
            padding: 2px 8px;
            font-size: 0.75rem;
        }

        .exp-bar {
            width: 100%;
            height: 6px;
            background: #f1f2f6;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .exp-fill {
            height: 100%;
            background: linear-gradient(90deg, #f39c12, #FFD700);
            transition: width 0.5s ease;
            border-radius: 3px;
        }

        /* 升级弹窗动画 */
        .level-up-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .level-up-overlay.active {
            display: flex;
        }

        @keyframes levelUpBounce {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .level-up-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            animation: levelUpBounce 0.6s ease;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.5);
            max-width: 400px;
        }

        .level-up-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        .level-up-title {
            font-size: 2rem;
            color: #FFD700;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .level-up-subtitle {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 30px;
        }

        .level-up-new-level {
            font-size: 3rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }

            .math-question {
                font-size: 2rem;
            }

            .hanzi-question {
                font-size: 3.5rem;
            }

            .word-english {
                font-size: 2rem;
            }

            .game-header {
                padding: 10px 15px;
            }

            .game-header-title {
                font-size: 1rem;
            }

            .timer, .score-display {
                font-size: 1rem;
                padding: 6px 12px;
            }

            .result-stats {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <!-- 欢迎/年龄输入页 -->
    <div id="welcome-page" class="page active">
        <div class="card">
            <div class="welcome-emoji">🎮</div>
            <h1>学习小勇士</h1>
            <p class="subtitle">边玩边学，快乐成长！</p>
            
            <div class="form-group">
                <label for="age-select">👦 你的年龄是？</label>
                <select id="age-select">
                    <option value="">请选择年龄</option>
                    <option value="6">6岁</option>
                    <option value="7">7岁</option>
                    <option value="8">8岁</option>
                    <option value="9">9岁</option>
                    <option value="10">10岁</option>
                    <option value="11">11岁</option>
                    <option value="12">12岁</option>
                    <option value="13">13岁</option>
                    <option value="14">14岁</option>
                    <option value="15">15岁</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="grade-select">📚 你上几年级？</label>
                <select id="grade-select">
                    <option value="">请选择年级</option>
                    <option value="1">小学一年级</option>
                    <option value="2">小学二年级</option>
                    <option value="3">小学三年级</option>
                    <option value="4">小学四年级</option>

    // 时钟题目生成器（生成不重复的时钟题）
    function generateClockQuestions(count) {
        const questions = [];
        const usedTimes = new Set();
        
        while (questions.length < count) {
            const hour = randomInt(1, 12);
            const minute = randomInt(0, 11) * 5;
            const timeKey = `${hour}:${minute}`;
            
            if (!usedTimes.has(timeKey)) {
                usedTimes.add(timeKey);
                const timeStr = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
                
                const wrongOptions = [];
                while (wrongOptions.length < 3) {
                    const wrongHour = randomInt(1, 12);
                    const wrongMinute = randomInt(0, 11) * 5;
                    const wrongTime = `${wrongHour.toString().padStart(2, '0')}:${wrongMinute.toString().padStart(2, '0')}`;
                    if (wrongTime !== timeStr && !wrongOptions.includes(wrongTime)) {
                        wrongOptions.push(wrongTime);
                    }
                }
                
                const options = shuffleArray([timeStr, ...wrongOptions]);
                
                questions.push({
                    hour: hour,
                    minute: minute,
                    answer: timeStr,
                    options: options
                });
            }
        }
        
        return questions;
    }

    // 数学题目生成器（生成不重复的数学题）
    function generateMathQuestions(count, difficulty) {
        const config = mathData[difficulty];
        const questions = [];
        const usedQuestions = new Set();
        
        let attempts = 0;
        while (questions.length < count && attempts < count * 10) {
            attempts++;
            const op = config.ops[randomInt(0, config.ops.length - 1)];
            
            let a, b, answer, questionKey;
            
            if (op === '+') {
                a = randomInt(1, config.range);
                b = randomInt(1, config.range - a);
                answer = a + b;
                questionKey = `${a}+${b}`;
            } else if (op === '-') {
                a = randomInt(1, config.range);
                b = randomInt(1, a);
                answer = a - b;
                questionKey = `${a}-${b}`;
            } else {
                a = randomInt(1, 9);
                b = randomInt(1, 9);
                answer = a * b;
                questionKey = `${a}*${b}`;
            }
            
            if (!usedQuestions.has(questionKey)) {
                usedQuestions.add(questionKey);
                
                const options = [answer];
                while (options.length < 4) {
                    let wrong = answer + randomInt(-10, 10);
                    if (wrong < 0) wrong = Math.abs(wrong) + 1;
                    if (wrong !== answer && !options.includes(wrong)) {
                        options.push(wrong);
                    }
                }
                
                questions.push({
                    a: a,
                    b: b,
                    op: op,
                    answer: answer,
                    options: shuffleArray(options)
                });
            }
        }
        
        return questions;
    }

    // ========== 语音播报功能 ==========
    function speak(text) {
        if (!appState.speechEnabled) return;
        if (!('speechSynthesis' in window)) return;
        
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            utterance.volume = 0.8;
            window.speechSynthesis.speak(utterance);
        } catch (e) {
            console.log('语音播报不可用:', e);
        }
    }

    function stopSpeak() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
    }

    // ========== 工具函数 ==========
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // ========== 游戏核心逻辑 ==========
    function initQuestionQueue() {
        appState.questionQueue = [];
        appState.currentQuestionIndex = 0;
        appState.expGained = 0;
        
        const gameId = appState.currentGame.id;
        const level = getGameLevel(gameId);
        let count = 20 + level * 2; // 等级越高题目越多
        
        switch (gameId) {
            case 'math':
                // 根据等级调整难度：1-3级简单，4-6级中等，7-10级困难
                let difficulty = 'easy';
                if (level >= 7) difficulty = 'hard';
                else if (level >= 4) difficulty = 'medium';
                
                // 高等级可能增加乘除法
                if (level >= 5 && !mathData.extraHard) {
                    mathData.extraHard = { range: 100, ops: ['+', '-', '*'] };
                }
                if (level >= 8) {
                    difficulty = 'extraHard';
                }
                
                appState.questionQueue = generateMathQuestions(count, difficulty);
                break;
            case 'hanzi':
                // 等级越高，可用汉字越多（需要扩展hanziData）
                const hzCount = 10 + level * 2;
                appState.questionQueue = shuffleArray([...hanziData.slice(0, Math.min(hzCount, hanziData.length))]);
                break;
            case 'english':
                const enCount = 12 + level * 2;
                appState.questionQueue = shuffleArray([...englishData.slice(0, Math.min(enCount, englishData.length))]);
                break;
            case 'idiom':
                appState.questionQueue = shuffleArray([...idiomData]);
                break;
            case 'geography':
                appState.questionQueue = shuffleArray([...geographyData]);
                break;
            case 'clock':
                // 等级越高，时间越精确（低级5分钟间隔，高级1分钟间隔）
                const clockCount = 15 + level * 2;
                appState.questionQueue = generateClockQuestionsWithLevel(clockCount, level);
                break;
        }
    }

    // 时钟题目生成器（支持等级难度）
    function generateClockQuestionsWithLevel(count, level) {
        const questions = [];
        const usedTimes = new Set();
        
        // 等级决定分钟间隔：1-3级5分钟间隔，4-6级任意分钟，7-10级更复杂
        const minuteInterval = level <= 3 ? 5 : 1;
        
        while (questions.length < count) {
            const hour = randomInt(1, 12);
            let minute;
            
            if (level <= 3) {
                minute = randomInt(0, 11) * 5; // 5分钟间隔
            } else {
                minute = randomInt(0, 59); // 任意分钟
            }
            
            const timeKey = `${hour}:${minute}`;
            
            if (!usedTimes.has(timeKey)) {
                usedTimes.add(timeKey);
                const timeStr = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
                
                const wrongOptions = [];
                while (wrongOptions.length < 3) {
                    const wrongHour = randomInt(1, 12);
                    const wrongMinute = level <= 3 ? randomInt(0, 11) * 5 : randomInt(0, 59);
                    const wrongTime = `${wrongHour.toString().padStart(2, '0')}:${wrongMinute.toString().padStart(2, '0')}`;
                    if (wrongTime !== timeStr && !wrongOptions.includes(wrongTime)) {
                        wrongOptions.push(wrongTime);
                    }
                }
                
                const options = shuffleArray([timeStr, ...wrongOptions]);
                
                questions.push({
                    hour: hour,
                    minute: minute,
                    answer: timeStr,
                    options: options
                });
            }
        }
        
        return questions;
    }

    function startGame() {
        appState.score = 0;
        appState.timeLeft = appState.totalTime;
        appState.correctCount = 0;
        appState.totalCount = 0;
        appState.isPaused = false;
        appState.isPlaying = true;
        
        document.getElementById('game-title').textContent = appState.currentGame.icon + ' ' + appState.currentGame.name;
        document.getElementById('score').textContent = '0';
        document.getElementById('time-display').textContent = formatTime(appState.timeLeft);
        document.getElementById('timer').classList.remove('warning');
        
        initQuestionQueue();
        
        showPage('game-page');
        
        startTimer();
        generateQuestion();
    }

    function startTimer() {
        if (appState.timerInterval) {
            clearInterval(appState.timerInterval);
        }
        
        appState.timerInterval = setInterval(() => {
            if (!appState.isPaused && appState.isPlaying) {
                appState.timeLeft--;
                document.getElementById('time-display').textContent = formatTime(appState.timeLeft);
                
                if (appState.timeLeft <= 60) {
                    document.getElementById('timer').classList.add('warning');
                }
                
                if (appState.timeLeft <= 0) {
                    endGame();
                }
            }
        }, 1000);
    }

    function stopTimer() {
        if (appState.timerInterval) {
            clearInterval(appState.timerInterval);
            appState.timerInterval = null;
        }
    }

        if (!appState.isPlaying || appState.isPaused) return;
        
        if (appState.currentQuestionIndex >= appState.questionQueue.length) {
            endGame();
            return;
        }
        
        const gameArea = document.getElementById('game-area');
        const question = appState.questionQueue[appState.currentQuestionIndex];
        
        switch (appState.currentGame.id) {
            case 'math':
                renderMathQuestion(gameArea, question);
                break;
            case 'hanzi':
                renderHanziQuestion(gameArea, question);
                break;
            case 'english':
                renderEnglishQuestion(gameArea, question);
                break;
            case 'idiom':
                renderIdiomQuestion(gameArea, question);
                break;
            case 'geography':
                renderGeographyQuestion(gameArea, question);
                break;
            case 'clock':
                renderClockQuestion(gameArea, question);
                break;
        }
    }

                🌍 ${q.question}
            </div>
            <div class="hanzi-options">
                ${q.options.map(opt => 
                    `<button class="hanzi-option" data-answer="${opt}">${opt}</button>`
                ).join('')}
            </div>
            <div class="feedback"></div>
        `;
        
        setTimeout(() => speak(q.question), 200);
        
        area.querySelectorAll('.hanzi-option').forEach(btn => {
            btn.addEventListener('click', function() {
                const selected = this.dataset.answer;
                handleAnswer(selected === q.answer, this, q.answer);
            });
        });
    }

    // 时钟题渲染
    function renderClockQuestion(area, q) {
        const total = appState.questionQueue.length;
        const progress = ((appState.currentQuestionIndex) / total) * 100;
        
        const hourAngle = (q.hour % 12) * 30 + q.minute * 0.5;
        const minuteAngle = q.minute * 6;
        
        area.innerHTML = `
            <div class="question-count">第 ${appState.totalCount + 1} / ${total} 题</div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
            <div class="clock-container">
                <svg class="clock-svg" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="95" fill="#fff5e6" stroke="#FF6B35" stroke-width="4"/>
                    ${[...Array(12)].map((_, i) => {
                        const angle = (i * 30 - 90) * Math.PI / 180;
                        const x1 = 100 + 80 * Math.cos(angle);
                        const y1 = 100 + 80 * Math.sin(angle);
                        const x2 = 100 + 90 * Math.cos(angle);
                        const y2 = 100 + 90 * Math.sin(angle);
                        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#FF6B35" stroke-width="3"/>`;
                    }).join('')}
                    ${[...Array(12)].map((_, i) => {
                        const num = i === 0 ? 12 : i;
                        const angle = (i * 30 - 90) * Math.PI / 180;
                        const x = 100 + 68 * Math.cos(angle);
                        const y = 100 + 68 * Math.sin(angle);
                        return `<text x="${x}" y="${y + 5}" text-anchor="middle" fill="#2D3436" font-size="16" font-weight="bold">${num}</text>`;
                    }).join('')}
                    <line x1="100" y1="100" x2="100" y2="55" stroke="#2D3436" stroke-width="6" stroke-linecap="round" transform="rotate(${hourAngle}, 100, 100)"/>
                    <line x1="100" y1="100" x2="100" y2="35" stroke="#FF6B35" stroke-width="4" stroke-linecap="round" transform="rotate(${minuteAngle}, 100, 100)"/>
                    <circle cx="100" cy="100" r="8" fill="#2D3436"/>
                </svg>
            </div>
            <div style="margin-bottom: 20px; color: #636e72;">现在是几点几分？</div>
            <div class="word-options">
                ${q.options.map(opt => 
                    `<button class="word-option" data-answer="${opt}">${opt}</button>`
                ).join('')}
            </div>
            <div class="feedback"></div>
        `;
        
        setTimeout(() => speak('请看时钟，现在是几点几分？'), 200);
        
        area.querySelectorAll('.word-option').forEach(btn => {
            btn.addEventListener('click', function() {
                const selected = this.dataset.answer;
                handleAnswer(selected === q.answer, this, q.answer);
            });
        });
    }

    // ========== 答题处理 ==========
    function handleAnswer(isCorrect, btnElement, correctAnswer) {
        if (!appState.isPlaying || appState.isPaused) return;
        
        appState.totalCount++;
        appState.currentQuestionIndex++;
        const feedback = document.querySelector('.feedback');
        const allOptions = document.querySelectorAll('.math-option, .hanzi-option, .word-option');
        
        allOptions.forEach(opt => opt.style.pointerEvents = 'none');
        
        // 获取当前等级
        const level = getGameLevel(appState.currentGame.id);
        
        if (isCorrect) {
            appState.correctCount++;
            const points = appState.currentGame.id === 'idiom' ? 15 : 10;
            appState.score += points;
            document.getElementById('score').textContent = appState.score;
            
            // 计算经验值：基础经验 + 等级加成（等级越高，经验越多）
            const baseExp = 8;
            const levelBonus = level; // 等级越高，每题经验加成越多
            appState.expGained += baseExp + levelBonus;
            
            btnElement.classList.add('correct');
            feedback.textContent = '🎉 太棒了！答对了！';
            feedback.className = 'feedback correct';
            speak('太棒了，答对了！');
        } else {
            btnElement.classList.add('wrong');
            feedback.textContent = `😅 再想想！正确答案是：${correctAnswer}`;
            feedback.className = 'feedback wrong';
            allOptions.forEach(opt => {
                if (opt.dataset.answer == correctAnswer) {
                    opt.classList.add('correct');
                }
            });
            speak(`答错了，正确答案是 ${correctAnswer}`);
        }
        
        setTimeout(() => {
            if (appState.isPlaying && !appState.isPaused) {
                generateQuestion();
            }
        }, 1500);
    }

    // ========== 游戏结束 ==========
    function endGame() {
        appState.isPlaying = false;
        stopTimer();
        stopSpeak();
        
        const timeUsed = appState.totalTime - appState.timeLeft;
        const accuracy = appState.totalCount > 0 
            ? Math.round((appState.correctCount / appState.totalCount) * 100) 
            : 0;
        
        // 结算经验值
        const gameId = appState.currentGame.id;
        const oldLevel = getGameLevel(gameId);
        const leveledUp = addExp(gameId, appState.expGained);
        saveUserData();
        const newLevel = getGameLevel(gameId);
        
        document.getElementById('final-score').textContent = appState.score;
        document.getElementById('accuracy').textContent = accuracy + '%';
        document.getElementById('time-used').textContent = formatTime(timeUsed);
        
        let stars = 1;
        let message = '';
        let icon = '🏆';
        let title = '游戏结束！';
        
        if (accuracy >= 90) {
            stars = 3;
            icon = '🏆';
            title = '太厉害了！';
            message = '你是学习小天才！继续保持哦！🌟';
        } else if (accuracy >= 70) {
            stars = 2;
            icon = '🥈';
            title = '表现不错！';
            message = '再努力一下，你会更棒的！💪';
        } else {
            stars = 1;
            icon = '🎯';
            title = '继续加油！';
            message = '多练习几次，你一定会进步的！📚';
        }
        
        // 添加经验值信息
        message += `\n获得经验：+${appState.expGained}`;
        
        document.getElementById('result-icon').textContent = icon;
        document.getElementById('result-title').textContent = title;
        document.getElementById('result-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
        document.getElementById('result-message').textContent = message;
        
        showPage('result-page');
        
        // 如果升级了，显示升级弹窗
        if (leveledUp) {
            setTimeout(() => {
                showLevelUpModal(appState.currentGame.name, newLevel);
            }, 800);
        }
        
        setTimeout(() => {
            speak(`游戏结束！你答对了 ${appState.correctCount} 道题，正确率 ${accuracy}%，获得 ${appState.expGained} 经验值！`);
        }, 500);
        
        if (accuracy >= 70) {
            setTimeout(createConfetti, 300);
        }
    }

    // 显示升级弹窗
    function showLevelUpModal(gameName, newLevel) {
        const levelName = levelConfig.levelNames[newLevel - 1];
        document.getElementById('level-up-game-name').textContent = gameName;
        document.getElementById('level-up-new-level').textContent = `Lv.${newLevel} ${levelName}`;
        document.getElementById('level-up-modal').classList.add('active');
        
        createConfetti();
        speak(`恭喜升级！${gameName} 升级到 ${levelName}！`);
    }

    // 升级弹窗确认按钮
    document.getElementById('level-up-ok-btn').addEventListener('click', function() {
        document.getElementById('level-up-modal').classList.remove('active');
        renderGames(); // 刷新游戏大厅显示新等级
    });

    // 结算页按钮
    document.getElementById('replay-btn').addEventListener('click', function() {
        startGame();
    });

    document.getElementById('back-hall-btn').addEventListener('click', function() {
        showPage('hall-page');
    });

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        loadUserData(); // 加载保存的等级数据
        showPage('welcome-page');
    });
    </script>
</body>
</html>
