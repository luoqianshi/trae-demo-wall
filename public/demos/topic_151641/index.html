<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心岛 - 青少年心理健康陪伴平台</title>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <div class="phone-wrapper">
        <div class="phone-frame">
            <!-- 顶部状态栏 -->
            <div class="status-bar">
                <span class="status-time">9:41</span>
                <div class="status-dynamic-island"></div>
                <div class="status-right">
                    <svg class="status-icon battery-icon" viewBox="0 0 30 16" fill="none">
                        <rect x="1" y="2" width="24" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
                        <rect id="battery-fill" x="3" y="4" width="18" height="8" rx="1" fill="currentColor"/>
                        <rect x="25" y="5" width="2" height="6" rx="1" fill="currentColor"/>
                    </svg>
                </div>
            </div>
            
            <div class="app-container" id="appContainer">
                <!-- 转场遮罩 -->
                <div class="transition-overlay" id="transitionOverlay"></div>
                
                <!-- 左上角"我的"按钮 -->
                <button class="my-profile-btn" id="myProfileBtn">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </button>

                <button class="new-chat-btn" id="newChatBtn">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14"/>
                        <path d="M5 12h14"/>
                        <path d="M20 16.5a2.5 2.5 0 0 1-2.5 2.5H6.5A2.5 2.5 0 0 1 4 16.5v-9A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5z"/>
                    </svg>
                </button>
                
                <!-- 下拉树洞提示 -->
                <div class="treehole-pull-hint" id="treeholePullHint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M19 12l-7 7-7-7"/>
                    </svg>
                    <span>下拉进入树洞</span>
                </div>

                <!-- 内容区域 -->
                <main class="main-content">
                    <!-- 聊天页面 -->
                    <div class="page active" id="chatPage">
                        <div class="chat-container">
                            <div class="chat-messages" id="chatMessages">
                                <div class="message ai">
                                    <span class="avatar">🏝️</span>
                                    <div class="bubble">嗨！欢迎来到心岛，很高兴能陪伴你，最近怎么样？</div>
                                </div>
                            </div>
                <!-- 快捷问题卡片 -->
                <div class="quick-cards" id="quickCards">
                    <div class="section-title">可以选择你想聊的话题</div>
                    <div class="quick-card-grid">
                        <button class="quick-card" data-question="我最近学习压力很大，感觉很焦虑">
                            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                            </svg>
                            <span class="card-text">学习压力</span>
                        </button>
                        <button class="quick-card" data-question="我和朋友闹矛盾了，心里很不舒服">
                            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                            <span class="card-text">人际关系</span>
                        </button>
                        <button class="quick-card" data-question="我最近心情很低落，提不起精神">
                            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M8 15s1.5 2 4 2 4-2 4-2"/>
                                <line x1="9" y1="9" x2="9.01" y2="9"/>
                                <line x1="15" y1="9" x2="15.01" y2="9"/>
                            </svg>
                            <span class="card-text">情绪低落</span>
                        </button>
                        <button class="quick-card" data-question="我对未来很迷茫，不知道该怎么办">
                            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <span class="card-text">未来规划</span>
                        </button>
                    </div>
                    <div class="section-title">专题指南</div>
                    <div class="topic-list">
                        <button class="topic-item" data-topic="高考减压">
                            <svg class="topic-icon" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <polygon points="16.24,7.76 14.12,14.12 7.76,16.24 9.88,9.88"/>
                            </svg>
                            <span class="topic-name">高考减压</span>
                            <span class="topic-arrow">›</span>
                        </button>
                        <button class="topic-item" data-topic="失恋疗愈">
                            <svg class="topic-icon" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                            <span class="topic-name">失恋疗愈</span>
                            <span class="topic-arrow">›</span>
                        </button>
                    </div>
                </div>
                            <!-- 输入框 -->
                            <div class="chat-input-wrapper">
                                <div class="chat-input">
                                    <textarea id="chatInput" placeholder="和心岛说说心里话..." rows="1"></textarea>
                                    <button id="sendBtn">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <line x1="22" y1="2" x2="11" y2="13"/>
                                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 树洞页面 -->
                    <div class="page treehole-page" id="treeholePage">
                        <div class="treehole-container">
                            <div class="treehole-header">
                                <button class="treehole-close" id="closeTreehole">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="18" y1="6" x2="6" y2="18"/>
                                        <line x1="6" y1="6" x2="18" y2="18"/>
                                    </svg>
                                </button>
                                <div class="treehole-header-main">
                                    <h2 class="treehole-title">小树洞</h2>
                                    <p class="treehole-subtitle">把还没说出口的心事，悄悄放在这里。</p>
                                </div>
                                <button class="treehole-nav-chip" type="button">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 8v4l3 3"/>
                                        <circle cx="12" cy="12" r="9"/>
                                    </svg>
                                    <span>过往心事</span>
                                </button>
                            </div>
                            <div class="treehole-content">
                                <div class="treehole-writing-card">
                                    <div class="treehole-rings" aria-hidden="true">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </div>
                                    <textarea id="treeholeInput" placeholder="在这里写下你的心事，只有你自己能看到..."></textarea>
                                    <button class="save-btn" id="saveTreehole" type="button">保存心事</button>
                                </div>
                                <div class="treehole-history-panel">
                                    <div class="treehole-history-head">
                                        <h3>过往心事</h3>
                                        <span class="treehole-history-note">仅自己可见</span>
                                    </div>
                                    <div id="treeholeList" class="treehole-list"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 发现页面 -->
                    <div class="page" id="discoverPage">
                        <div class="discover-container">
                            <h2 class="page-title">发现</h2>
                            <!-- 状态板块 -->
                            <div class="discover-section">
                                <h3 class="section-header">状态</h3>
                                <div class="function-grid">
                                    <button class="function-item" data-page="psychological">
                                        <span class="func-icon">📋</span>
                                        <span class="func-name">心理评估</span>
                                    </button>
                                    <button class="function-item" data-page="stress">
                                        <span class="func-icon">📊</span>
                                        <span class="func-name">压力测试</span>
                                    </button>
                                    <button class="function-item" data-page="mentalState">
                                        <span class="func-icon">🧠</span>
                                        <span class="func-name">心理状态</span>
                                    </button>
                                    <button class="function-item" data-page="currentState">
                                        <span class="func-icon">🌈</span>
                                        <span class="func-name">目前状态</span>
                                    </button>
                                </div>
                            </div>
                            <!-- 工具板块 -->
                            <div class="discover-section">
                                <h3 class="section-header">工具</h3>
                                <div class="function-grid">
                                    <button class="function-item" data-page="habit">
                                        <span class="func-icon">✅</span>
                                        <span class="func-name">习惯打卡</span>
                                    </button>
                                    <button class="function-item" data-page="mood">
                                        <span class="func-icon">😊</span>
                                        <span class="func-name">情绪日记</span>
                                    </button>
                                    <button class="function-item" data-page="breathing">
                                        <span class="func-icon">🌬️</span>
                                        <span class="func-name">正念呼吸</span>
                                    </button>
                                    <button class="function-item" data-page="game">
                                        <span class="func-icon">🎮</span>
                                        <span class="func-name">放松游戏</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 习惯打卡页面 -->
                    <div class="page" id="habitPage">
                        <div class="habit-container">
                            <div class="page-header">
                                <button class="back-btn" id="backToDiscover1">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <h2 class="page-title">习惯打卡</h2>
                            </div>
                            <div class="habit-streak">
                                <div class="streak-number" id="streakNumber">0</div>
                                <div class="streak-label">连续打卡天数</div>
                            </div>
                            <div class="calendar-container" id="habitCalendar"></div>
                            <div class="checkin-form">
                                <select id="habitSelect">
                                    <option value="study">📚 学习</option>
                                    <option value="exercise">🏃 运动</option>
                                    <option value="sleep">😴 早睡</option>
                                    <option value="water">💧 喝够水</option>
                                    <option value="read">📖 阅读</option>
                                </select>
                                <input type="text" id="habitNote" placeholder="备注（可选）">
                                <button id="checkinBtn">打卡</button>
                            </div>
                            <div id="habitResult" class="result"></div>
                        </div>
                    </div>

                    <!-- 情绪日记页面 -->
                    <div class="page" id="moodPage">
                        <div class="mood-container">
                            <div class="page-header">
                                <button class="back-btn" id="backToDiscover2">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <h2 class="page-title">情绪日记</h2>
                            </div>
                            <div class="calendar-container" id="moodCalendar"></div>
                            <div class="mood-input-section">
                                <div class="mood-selector">
                                    <button class="mood-btn" data-mood="happy">😊 开心</button>
                                    <button class="mood-btn" data-mood="calm">😌 平静</button>
                                    <button class="mood-btn" data-mood="anxious">😰 焦虑</button>
                                    <button class="mood-btn" data-mood="sad">😢 难过</button>
                                    <button class="mood-btn" data-mood="angry">😠 生气</button>
                                </div>
                                <textarea id="moodContent" placeholder="记录今天的心情..."></textarea>
                                <button id="saveMoodBtn">保存心情</button>
                            </div>
                            <div id="moodHistory" class="mood-history"></div>
                        </div>
                    </div>

                    <!-- 正念呼吸页面 -->
                    <div class="page" id="breathingPage">
                        <div class="breathing-container">
                            <div class="page-header">
                                <button class="back-btn" id="backToDiscover3">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <h2 class="page-title">正念呼吸</h2>
                            </div>
                            <div class="breathing-circle" id="breathingCircle">
                                <span class="breathing-text" id="breathingText">开始</span>
                            </div>
                            <button class="breathing-start" id="breathingStartBtn">开始练习</button>
                            <p class="breathing-desc">跟随圆圈的节奏深呼吸</p>
                        </div>
                    </div>

                    <!-- 放松游戏页面 -->
                    <div class="page" id="gamePage">
                        <div class="game-container">
                            <div class="page-header">
                                <button class="back-btn" id="backToDiscover4">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <h2 class="page-title">放松游戏</h2>
                            </div>
                            <div class="game-list">
                                <button class="game-item" data-game="guess">🔢 猜数字</button>
                                <button class="game-item" data-game="word">🔤 词语接龙</button>
                            </div>
                            <div id="gameArea"></div>
                        </div>
                    </div>

                    <!-- 心理评估页面 -->
                    <div class="page" id="psychologicalPage">
                        <div class="psychological-container">
                            <div class="page-header">
                                <button class="back-btn" id="backToDiscover5">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <h2 class="page-title">心理评估</h2>
                            </div>
                            <p class="coming-soon">功能开发中...</p>
                        </div>
                    </div>

                    <!-- 压力测试页面 -->
                    <div class="page" id="stressPage">
                        <div class="stress-container">
                            <div class="page-header">
                                <button class="back-btn" id="backToDiscover6">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <h2 class="page-title">压力测试</h2>
                            </div>
                            <p class="coming-soon">功能开发中...</p>
                        </div>
                    </div>

                    <!-- 心理状态页面 -->
                    <div class="page" id="mentalStatePage">
                        <div class="mental-state-container">
                            <div class="page-header">
                                <button class="back-btn" id="backToDiscover7">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <h2 class="page-title">心理状态</h2>
                            </div>
                            <p class="coming-soon">功能开发中...</p>
                        </div>
                    </div>

                    <!-- 目前状态页面 -->
                    <div class="page" id="currentStatePage">
                        <div class="current-state-container">
                            <div class="page-header">
                                <button class="back-btn" id="backToDiscover8">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <h2 class="page-title">目前状态</h2>
                            </div>
                            <p class="coming-soon">功能开发中...</p>
                        </div>
                    </div>

                    <!-- 我的页面 -->
                    <div class="page" id="myProfilePage">
                        <div class="my-profile-container">
                            <div class="page-header">
                                <button class="back-btn" id="backFromProfile">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <h2 class="page-title">我的</h2>
                            </div>
                            <div class="profile-menu">
                                <button class="profile-menu-item">
                                    <span class="menu-icon">👤</span>
                                    <span class="menu-text">个人资料</span>
                                    <span class="menu-arrow">›</span>
                                </button>
                                <button class="profile-menu-item">
                                    <span class="menu-icon">🏆</span>
                                    <span class="menu-text">成就系统</span>
                                    <span class="menu-arrow">›</span>
                                </button>
                                <button class="profile-menu-item">
                                    <span class="menu-icon">⚙️</span>
                                    <span class="menu-text">设置</span>
                                    <span class="menu-arrow">›</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </main>

                <!-- 底部导航栏 -->
                <nav class="bottom-nav" id="bottomNav">
                    <button class="bottom-nav-item active" data-page="chat">
                        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span class="nav-label">聊天</span>
                    </button>
                    <button class="bottom-nav-item" data-page="discover">
                        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <span class="nav-label">发现</span>
                    </button>
                </nav>

                <!-- 底部Home条 -->
                <div class="home-indicator"></div>
            </div>
        </div>
    </div>

    <script src="./static/js/app.js"></script>
</body>
</html>
