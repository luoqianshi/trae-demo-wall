<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>银龄数字助手</title>
<!-- 引入字体：Noto Sans SC 保证中文清晰可读；Fraunces 用于温暖的数字装饰 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   银龄数字助手 —— 适老化样式系统
   设计理念：温暖、清晰、大字、大按钮、高对比、防误触
   ============================================================ */

/* ---------- 设计变量（统一管理配色与尺寸） ---------- */
:root{
  /* 暖色系主调 */
  --bg-cream: #FFF6EC;          /* 主背景：温暖奶油色 */
  --bg-cream-2: #FDEEDD;        /* 次背景 */
  --paper: #FFFFFF;             /* 卡片白 */
  --paper-warm: #FFFBF4;        /* 卡片暖白 */
  --orange: #F2693C;            /* 主色：暖橙 */
  --orange-deep: #E2502A;       /* 深橙（按压） */
  --orange-soft: #FFD9C4;       /* 浅橙底 */
  --blue: #2E8BB8;              /* 副色：暖蓝 */
  --blue-deep: #236E92;         /* 深蓝 */
  --blue-soft: #CFE8F3;         /* 浅蓝底 */
  --green: #3FAE6A;             /* 健康绿 */
  --green-soft: #D6F0DF;        /* 浅绿底 */
  --gold: #E8A23B;              /* 暖金（社保/天气） */
  --text: #2A1F14;              /* 深色文字（高对比） */
  --text-soft: #6B5A47;         /* 次要文字 */
  --line: #EADBC6;              /* 描边 */
  --shadow: 0 8px 28px rgba(180,120,60,.16); /* 柔和暖影 */
  --shadow-lg: 0 18px 48px rgba(180,120,60,.22);
  --radius: 26px;               /* 大圆角，亲和安全 */
  --radius-sm: 18px;
}

/* ---------- 基础重置 ---------- */
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html{ font-size:20px; }          /* 基础字号 20px（适老化下限） */
body{
  font-family:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(1200px 600px at 12% -8%, #FFE9D2 0%, transparent 55%),
    radial-gradient(1000px 700px at 100% 0%, #DCEEF7 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-cream-2) 100%);
  background-attachment:fixed;
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  padding-bottom:170px;          /* 底部留白，避免被固定按钮遮挡 */
  -webkit-font-smoothing:antialiased;
}
/* 细微纸纹叠加，增加温暖质感 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(rgba(120,80,40,.05) 1px, transparent 1px);
  background-size:18px 18px; opacity:.5;
}
main{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:0 20px; }

/* ---------- 通用文字点击朗读样式 ---------- */
.readable{ cursor:pointer; border-radius:10px; padding:2px 4px; margin:-2px -4px; transition:background .2s; }
.readable:hover{ background:rgba(242,105,60,.10); }
.readable:active{ background:rgba(242,105,60,.20); }

/* ---------- 1. 顶部标题区 ---------- */
header{ text-align:center; padding:34px 0 10px; }
.brand-mark{
  display:inline-flex; align-items:center; justify-content:center;
  width:74px; height:74px; border-radius:24px; margin-bottom:14px;
  background:linear-gradient(145deg,#FFB377,var(--orange));
  box-shadow:0 10px 24px rgba(226,80,42,.35);
  position:relative;
}
.brand-mark svg{ width:42px; height:42px; }
h1{
  font-size:40px; font-weight:900; letter-spacing:1px;
  background:linear-gradient(120deg,var(--orange-deep),var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.welcome{
  font-size:22px; color:var(--text-soft); margin-top:8px; font-weight:500;
}
.date-bar{
  display:inline-flex; align-items:center; gap:8px; margin-top:14px;
  padding:8px 18px; border-radius:999px; background:var(--paper);
  border:1px solid var(--line); font-size:20px; color:var(--text-soft);
  box-shadow:0 4px 14px rgba(180,120,60,.10);
}
.date-bar .dot{ width:9px; height:9px; border-radius:50%; background:var(--green); }

/* ---------- 2. 语音交互中心 ---------- */
.voice-center{
  margin:26px 0; padding:34px 22px 30px; text-align:center;
  background:linear-gradient(160deg,var(--paper) 0%, var(--paper-warm) 100%);
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
}
.voice-hint{ font-size:22px; font-weight:700; margin-bottom:18px; }
.voice-hint small{ display:block; font-size:18px; font-weight:400; color:var(--text-soft); margin-top:4px; }

/* 超大圆形语音按钮 */
.mic-btn{
  width:180px; height:180px; border-radius:50%; border:none; cursor:pointer;
  background:radial-gradient(circle at 35% 30%, #FF9A66, var(--orange) 60%, var(--orange-deep));
  box-shadow:0 16px 40px rgba(226,80,42,.40), inset 0 4px 12px rgba(255,255,255,.35);
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:#fff; transition:transform .12s ease, box-shadow .2s; position:relative; outline:none;
}
.mic-btn:focus-visible{ outline:4px solid var(--orange); outline-offset:6px; }
.mic-btn:active{ transform:scale(.96); }
.mic-btn svg{ width:60px; height:60px; }
.mic-btn .mic-label{ font-size:22px; font-weight:700; letter-spacing:2px; }
/* 监听时的脉冲光环 */
.mic-btn.listening::before,
.mic-btn.listening::after{
  content:""; position:absolute; inset:-6px; border-radius:50%;
  border:3px solid rgba(242,105,60,.45); animation:pulse 1.4s ease-out infinite;
}
.mic-btn.listening::after{ animation-delay:.7s; }
@keyframes pulse{ 0%{transform:scale(1);opacity:.6;} 100%{transform:scale(1.35);opacity:0;} }
.mic-btn.listening{ background:radial-gradient(circle at 35% 30%, #FF8FB0, #E54B3C 60%, #C23528); box-shadow:0 16px 40px rgba(194,53,40,.45); }

/* 识别结果显示 */
.voice-result{
  margin-top:20px; min-height:64px; padding:14px 18px; border-radius:var(--radius-sm);
  background:var(--orange-soft); font-size:24px; font-weight:700; color:var(--orange-deep);
  display:flex; align-items:center; justify-content:center; gap:10px; word-break:break-all;
  transition:all .25s;
}
.voice-result.empty{ background:transparent; color:var(--text-soft); font-weight:400; font-size:19px; }
.voice-result .tag{ font-size:16px; font-weight:700; color:#fff; background:var(--orange); padding:4px 12px; border-radius:999px; white-space:nowrap; }

/* 文字输入降级区 */
.text-fallback{ margin-top:16px; display:none; }
.text-fallback.show{ display:flex; gap:10px; }
.text-fallback input{
  flex:1; font-size:20px; padding:16px 20px; border:2px solid var(--line); border-radius:16px;
  font-family:inherit; color:var(--text); background:var(--paper); outline:none; min-height:60px;
}
.text-fallback input:focus{ border-color:var(--orange); }
.text-fallback button{
  font-size:20px; font-weight:700; color:#fff; background:var(--orange); border:none; border-radius:16px;
  padding:0 26px; cursor:pointer; min-height:60px;
}
.text-fallback button:focus-visible{ outline:3px solid var(--orange-deep); outline-offset:3px; }

/* ---------- 3. 常用服务九宫格 ---------- */
.section-title{
  font-size:24px; font-weight:900; margin:30px 4px 16px; display:flex; align-items:center; gap:10px;
}
.section-title::before{ content:""; width:6px; height:26px; border-radius:3px; background:linear-gradient(var(--orange),var(--gold)); }
.grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
}
.service{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  background:var(--paper); border-radius:var(--radius-sm);
  padding:24px 10px; min-height:150px; cursor:pointer; transition:transform .12s, box-shadow .2s;
  box-shadow:0 4px 14px rgba(180,120,60,.08); border:none; font-family:inherit; text-align:center;
}
.service:focus-visible{ outline:4px solid var(--orange); outline-offset:3px; }
.service:active{ transform:scale(.96); }
.service:hover{ box-shadow:var(--shadow); }
.service .ico{
  width:66px; height:66px; border-radius:20px; display:flex; align-items:center; justify-content:center;
}
.service .ico svg{ width:38px; height:38px; }
.service .name{ font-size:20px; font-weight:700; color:var(--text); }
/* 各服务图标配色 */
.s-health .ico{ background:var(--green-soft); }            .s-health .ico svg{ color:var(--green); }
.s-reg   .ico{ background:var(--orange-soft); }            .s-reg   .ico svg{ color:var(--orange); }
.s-pay   .ico{ background:#E7F1FF; }                       .s-pay   .ico svg{ color:var(--blue); }
.s-call  .ico{ background:#EADCF6; }                       .s-call  .ico svg{ color:#8B5CC4; }
.s-weather .ico{ background:#FFF1D6; }                     .s-weather .ico svg{ color:var(--gold); }
.s-social .ico{ background:var(--blue-soft); }             .s-social .ico svg{ color:var(--blue-deep); }

/* ---------- 通用大按钮 ---------- */
.btn{
  font-family:inherit; font-size:22px; font-weight:700; border:none; border-radius:18px;
  min-height:62px; padding:0 28px; cursor:pointer; transition:transform .1s, filter .2s, box-shadow .2s; display:inline-flex;
  align-items:center; justify-content:center; gap:10px;
}
.btn:focus-visible{ outline:4px solid var(--orange); outline-offset:3px; }
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ background:linear-gradient(135deg,var(--orange),var(--orange-deep)); color:#fff; box-shadow:0 8px 20px rgba(226,80,42,.30); }
.btn-blue{ background:linear-gradient(135deg,#3FA3D0,var(--blue-deep)); color:#fff; box-shadow:0 8px 20px rgba(35,110,146,.30); }
.btn-ghost{ background:var(--paper); color:var(--text); border:2px solid var(--line); }
.btn-green{ background:linear-gradient(135deg,#54C285,var(--green)); color:#fff; box-shadow:0 8px 20px rgba(63,174,106,.30); }
.btn-block{ width:100%; }
.btn-lg{ font-size:24px; min-height:70px; }

/* ---------- 5. 呼叫子女求助（固定底部） ---------- */
.help-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(255,246,236,0) 0%, var(--bg-cream) 30%);
  display:flex; gap:12px; justify-content:center;
}
.help-bar .btn{ flex:1; max-width:340px; }
.btn-call-help{
  background:linear-gradient(135deg,#FF7A7A,#D63A3A); color:#fff;
  box-shadow:0 8px 22px rgba(214,58,58,.35);
}
.btn-call-help svg{ width:26px; height:26px; }

/* ---------- 弹层 / 模态 ---------- */
.overlay{
  position:fixed; inset:0; z-index:100; background:rgba(42,31,20,.55);
  display:none; align-items:flex-end; justify-content:center; padding:0;
  backdrop-filter:blur(3px);
}
.overlay.show{ display:flex; animation:fade .25s; }
@keyframes fade{ from{opacity:0;} to{opacity:1;} }
.sheet{
  width:100%; max-width:760px; max-height:92vh; overflow-y:auto;
  background:var(--paper); border-radius:30px 30px 0 0; padding:24px 22px 40px;
  box-shadow:0 -10px 40px rgba(0,0,0,.2); animation:slideUp .35s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes slideUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.sheet-title{ font-size:28px; font-weight:900; color:var(--text); }
.sheet-close{
  width:52px; height:52px; border-radius:50%; border:none; background:var(--bg-cream-2);
  font-size:26px; color:var(--text-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.sheet-close:focus-visible{ outline:3px solid var(--orange); outline-offset:2px; }
.sheet-close:active{ background:var(--orange-soft); }

/* 弹层内通用列表项 */
.opt{
  display:flex; align-items:center; gap:16px; width:100%; text-align:left;
  background:var(--paper-warm); border:2px solid var(--line); border-radius:18px;
  padding:20px; margin-bottom:14px; cursor:pointer; font-family:inherit; transition:all .15s; min-height:72px;
}
.opt:focus-visible{ outline:3px solid var(--orange); outline-offset:2px; }
.opt:active{ transform:scale(.98); border-color:var(--orange); background:var(--orange-soft); }
.opt.selected{ border-color:var(--orange); background:var(--orange-soft); }
.opt .opt-ico{ width:54px; height:54px; border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:26px; }
.opt .opt-main{ flex:1; }
.opt .opt-title{ font-size:22px; font-weight:700; }
.opt .opt-sub{ font-size:18px; color:var(--text-soft); margin-top:2px; }
.opt .check{ width:28px; height:28px; border-radius:50%; border:3px solid var(--line); flex-shrink:0; }
.opt.selected .check{ background:var(--orange); border-color:var(--orange); }

/* ---------- 挂号分步引导 ---------- */
.step-progress{ display:flex; align-items:center; gap:6px; margin-bottom:22px; }
.step-progress .seg{ flex:1; height:8px; border-radius:4px; background:var(--line); }
.step-progress .seg.done{ background:var(--orange); }
.step-progress .step-num{ font-size:18px; font-weight:700; color:var(--orange-deep); margin-right:6px; }
.step-q{ font-size:26px; font-weight:900; margin-bottom:6px; }
.step-tip{ font-size:19px; color:var(--text-soft); margin-bottom:18px; }
.step-nav{ display:flex; gap:12px; margin-top:22px; }
.step-nav .btn{ flex:1; }

/* 确认信息卡片 */
.confirm-card{ background:var(--paper-warm); border:2px solid var(--line); border-radius:20px; padding:22px; margin-bottom:18px; }
.confirm-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px dashed var(--line); font-size:20px; }
.confirm-row:last-child{ border-bottom:none; }
.confirm-row .k{ color:var(--text-soft); }
.confirm-row .v{ font-weight:700; }

/* ---------- 功能页内容样式 ---------- */
/* 健康码 */
.health-card{ text-align:center; padding:14px 0; }
.hc-box{ display:inline-block; background:linear-gradient(150deg,#3FAE6A,#2E9056); border-radius:24px; padding:30px 40px; color:#fff; box-shadow:0 14px 34px rgba(63,174,106,.35); }
.hc-box .hc-label{ font-size:20px; opacity:.9; }
.hc-box .hc-name{ font-size:30px; font-weight:900; margin:6px 0 16px; }
.hc-qr{ width:180px; height:180px; background:#fff; border-radius:16px; padding:12px; }
.hc-status{ margin-top:16px; font-size:22px; font-weight:700; }

/* 生活缴费 */
.bill{ display:flex; align-items:center; gap:16px; background:var(--paper-warm); border:2px solid var(--line); border-radius:18px; padding:18px 20px; margin-bottom:14px; }
.bill .bill-ico{ width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
.bill .bill-info{ flex:1; }
.bill .bill-name{ font-size:21px; font-weight:700; }
.bill .bill-amt{ font-size:18px; color:var(--text-soft); margin-top:2px; }
.bill .bill-amt b{ font-family:"Fraunces",serif; font-size:24px; color:var(--orange-deep); }

/* 视频通话 */
.call-contacts{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:18px; }
.contact{ background:var(--paper-warm); border:2px solid var(--line); border-radius:20px; padding:20px; text-align:center; cursor:pointer; }
.contact:focus-visible{ outline:3px solid var(--orange); outline-offset:2px; }
.contact:active{ transform:scale(.97); }
.contact .avatar{ width:80px; height:80px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:36px; }
.contact .cname{ font-size:20px; font-weight:700; }
.contact .crel{ font-size:18px; color:var(--text-soft); }
.call-screen{ text-align:center; padding:10px 0; }
.call-screen .big-avatar{ width:140px; height:140px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; font-size:64px; background:var(--blue-soft); }
.call-screen .calling-name{ font-size:30px; font-weight:900; }
.call-screen .calling-stat{ font-size:20px; color:var(--green); margin:8px 0 24px; }

/* 天气 */
.weather-main{ text-align:center; padding:10px 0; }
.weather-temp{ font-family:"Fraunces",serif; font-size:72px; font-weight:800; color:var(--orange-deep); line-height:1; }
.weather-desc{ font-size:26px; font-weight:700; margin-top:6px; }
.weather-city{ font-size:20px; color:var(--text-soft); margin-top:4px; }
.weather-ico{ font-size:72px; margin-bottom:6px; }
.weather-grid-label{ font-size:18px; color:var(--text-soft); }
.weather-grid-val{ font-size:24px; font-weight:900; font-family:"Fraunces",serif; }
.weather-tips{ background:var(--orange-soft); border-radius:18px; padding:18px; margin-top:20px; font-size:19px; color:var(--orange-deep); font-weight:500; }

/* 社保 */
.social-row{ display:flex; justify-content:space-between; align-items:center; padding:18px 0; border-bottom:1px solid var(--line); }
.social-row .sk{ font-size:20px; color:var(--text-soft); }
.social-row .sv{ font-size:24px; font-weight:900; color:var(--blue-deep); font-family:"Fraunces",serif; }

/* ---------- 二次确认对话框 ---------- */
.confirm-dialog{
  position:fixed; inset:0; z-index:200; background:rgba(42,31,20,.6); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; padding:24px;
}
.confirm-dialog.show{ display:flex; animation:fade .2s; }
.confirm-box{
  width:100%; max-width:420px; background:var(--paper); border-radius:26px; padding:28px 24px;
  text-align:center; box-shadow:var(--shadow-lg); animation:pop .3s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{ from{transform:scale(.85);opacity:0;} to{transform:scale(1);opacity:1;} }
.confirm-box .cd-ico{ font-size:54px; margin-bottom:8px; }
.confirm-box .cd-title{ font-size:26px; font-weight:900; margin-bottom:8px; }
.confirm-box .cd-msg{ font-size:20px; color:var(--text-soft); margin-bottom:22px; line-height:1.5; }
.confirm-box .cd-actions{ display:flex; gap:12px; }
.confirm-box .cd-actions .btn{ flex:1; }

/* ---------- Toast 提示 ---------- */
.toast{
  position:fixed; left:50%; bottom:150px; transform:translateX(-50%) translateY(20px);
  background:rgba(42,31,20,.92); color:#fff; font-size:20px; font-weight:500;
  padding:16px 26px; border-radius:18px; z-index:300; opacity:0; pointer-events:none;
  transition:all .3s; max-width:90vw; text-align:center;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* 提示横幅 */
.banner{ font-size:20px; color:var(--text-soft); text-align:center; margin:18px 4px 32px; }
.banner b{ color:var(--orange-deep); }

/* 响应式：窄屏单列 */
@media (max-width:480px){
  html{ font-size:19px; }
  h1{ font-size:34px; }
  .grid{ grid-template-columns:repeat(2,1fr); }
  .mic-btn{ width:160px; height:160px; }
  .mic-btn svg{ width:52px; height:52px; }
}
</style>
</head>
<body>

<!-- ===================== 顶部标题区 ===================== -->
<header>
  <div class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s-7-4.5-7-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-7 10-7 10z" fill="rgba(255,255,255,.25)"/>
      <path d="M9 11h2v-2h2v2h2v2h-2v2h-2v-2H9z" fill="#fff" stroke="none"/>
    </svg>
  </div>
  <h1 class="readable" onclick="speakText(this.innerText)">银龄数字助手</h1>
  <p class="welcome readable" onclick="speakText(this.innerText)">您好，我是您的贴心小助手，有需要请按住下方按钮对我说话</p>
  <div class="date-bar"><span class="dot"></span><span id="dateText"></span></div>
</header>

<main>
  <!-- ===================== 语音交互中心 ===================== -->
  <section class="voice-center" aria-label="语音交互">
    <div class="voice-hint readable" onclick="speakText('按住中间的大圆按钮，说出您的需求')">
      按住说话，我来帮您
      <small>例如："我要看健康码"、"帮我挂号"、"今天天气怎么样"</small>
    </div>

    <!-- 超大圆形语音按钮 -->
    <button class="mic-btn" id="micBtn" aria-label="按住说话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<!-- ===================== Toast ===================== -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   银龄数字助手 —— 核心逻辑
   模块：语音朗读 / 语音识别 / 意图匹配 / 模拟功能 / 防误触
   ============================================================ */

/* ---------- 全局状态 ---------- */
const State = {
  recognition: null,       // 语音识别实例
  recognitionAvailable: false,
  listening: false,
  // 网上挂号向导状态
  reg: { step: 0, hospital: null, dept: null, time: null },
};

/* ---------- 1. 语音朗读（speechSynthesis） ---------- */
let _zhVoice = null;
function pickZhVoice(){
  const voices = speechSynthesis.getVoices();
  // 优先选中文女声/男声
  _zhVoice = voices.find(v => /zh(-CN|_CN)|cmn|Chinese/i.test(v.lang) || /zh/i.test(v.name)) || null;
}
if ('speechSynthesis' in window){
  pickZhVoice();
  speechSynthesis.onvoiceschanged = pickZhVoice;
}

/** 朗读文字：支持队列、可中断 */
function speakText(text, { onend } = {}){
  if (!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();           // 取消上一次，避免堆积
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.92;                      // 稍慢，适合老年人
    u.pitch = 1.05;
    if (_zhVoice) u.voice = _zhVoice;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  }catch(e){ console.warn('朗读失败', e); }
}

/* ---------- 2. 日期显示 ---------- */
function renderDate(){
  const d = new Date();
  const week = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('dateText').textContent =
    `${d.getMonth()+1}月${d.getDate()}日 星期${week}`;
}

/* ---------- 3. 语音识别（webkitSpeechRecognition） ---------- */
function initRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    // 不支持语音识别 -> 降级为文字输入
    document.getElementById('textFallback').classList.add('show');
    setResult('您的浏览器不支持语音输入，请打字告诉我', true);
    return;
  }
  const r = new SR();
  r.lang = 'zh-CN';
  r.continuous = false;
  r.interimResults = false;
  r.maxAlternatives = 1;

  r.onstart = () => {
    State.listening = true;
    const btn = document.getElementById('micBtn');
    btn.classList.add('listening');
    document.getElementById('micLabel').textContent = '正在听…';
    setResult('🎤 请说话…', true);
  };
  r.onresult = (e) => {
    const text = e.results[0][0].transcript;
    setResult(text, false);
    speakText('您说的是：' + text);
    // 延迟一点再匹配，让用户听到结果
    setTimeout(() => handleIntent(text), 1200);
  };
  r.onerror = (e) => {
    const msg = e.error === 'not-allowed'
      ? '麦克风权限被拒绝，请允许使用麦克风，或改用文字输入'
      : '没有听清楚，请再说一次';
    setResult(msg, true);
    speakText(msg);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      document.getElementById('textFallback').classList.add('show');
    }
  };
  r.onend = () => {
    State.listening = false;
    const btn = document.getElementById('micBtn');
    btn.classList.remove('listening');
    document.getElementById('micLabel').textContent = '按住说话';
  };

  State.recognition = r;
  State.recognitionAvailable = true;
}

/** 设置识别结果展示 */
function setResult(text, isStatus){
  const el = document.getElementById('voiceResult');
  if (isStatus){
    el.className = 'voice-result empty';
    el.textContent = text;
  }else{
    el.className = 'voice-result';
    el.innerHTML = `<span class="tag">您说</span>${escapeHtml(text)}`;
  }
}

/* ---------- 语音按钮交互：按住说话 + 点击兼容 ---------- */
function setupMicButton(){
  const btn = document.getElementById('micBtn');
  // 不支持识别时，点击聚焦文字框
  if (!State.recognitionAvailable){
    btn.addEventListener('click', () => {
      document.getElementById('textInput').focus();
      speakText('请用打字的方式告诉我您的需求');
    });
    return;
  }
  // 支持识别：按下开始，松开结束
  const start = (e) => {
    e.preventDefault();
    if (State.listening) return;
    try{ State.recognition.start(); }catch(err){ /* 重复启动忽略 */ }
  };
  const stop = (e) => {
    e.preventDefault();
    if (!State.listening) return;
    try{ State.recognition.stop(); }catch(err){}
  };
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
  btn.addEventListener('touchstart', start, { passive:false });
  btn.addEventListener('touchend', stop, { passive:false });
}

/* ---------- 文字输入降级提交 ---------- */
function submitText(){
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text){ showToast('请输入内容'); return; }
  setResult(text, false);
  speakText('您输入的是：' + text);
  input.value = '';
  setTimeout(() => handleIntent(text), 1200);
}

/* ---------- 4. 意图匹配（关键词匹配） ---------- */
const INTENTS = [
  { keys:['健康码','健康','绿码','码'],         target:'health',   say:'好的，马上为您打开健康码' },
  { keys:['挂号','预约','看病','医生','就诊'],   target:'register', say:'好的，我来带您一步步网上挂号' },
  { keys:['缴费','水电','电费','水费','燃气','交费'], target:'pay', say:'好的，打开生活缴费' },
  { keys:['视频','通话','打电话','电话','联系','聊天'], target:'call',  say:'好的，打开视频通话' },
  { keys:['天气','下雨','温度','气温','冷不冷','热不热'], target:'weather', say:'好的，为您查询今天天气' },
  { keys:['社保','养老金','退休','医保','公积金'], target:'social', say:'好的，为您查询社保信息' },
  { keys:['子女','帮忙','求助','不会','教我'],   target:'help',     say:'别担心，我来帮您呼叫子女' },
];

function handleIntent(text){
  const t = text.toLowerCase();
  for (const it of INTENTS){
    if (it.keys.some(k => t.includes(k.toLowerCase()))){
      speakText(it.say);
      setTimeout(() => {
        if (it.target === 'help') callFamily();
        else openService(it.target);
      }, 900);
      return;
    }
  }
  // 未匹配
  speakText('抱歉，我没听明白。您可以试试说：我要看健康码，或者帮我挂号。');
  setResult('没听明白，请试试"看健康码"或"帮我挂号"', true);
}

/* ---------- 5. 打开服务功能 ---------- */
function openService(name){
  switch(name){
    case 'health':   return showHealth();
    case 'register': return startRegister();
    case 'pay':      return showPay();
    case 'call':     return showCall();
    case 'weather':  return showWeather();
    case 'social':   return showSocial();
  }
}

/* ---------- 弹层控制 ---------- */
function openSheet(title, html){
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  // 朗读被打断时取消
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeSheet();
});

/* ---------- 功能：健康码 ---------- */
function showHealth(){
  speakText('您的健康码是绿码，状态正常');
  openSheet('健康码', `
    <div class="health-card">
      <div class="hc-box">
        <div class="hc-label readable" onclick="speakText('姓名')">姓名</div>
        <div class="hc-name readable" onclick="speakText('王秀英')">王秀英</div>
        <div class="hc-qr">${makeQr()}</div>
      </div>
      <div class="hc-status readable" onclick="speakText('健康码状态：绿码，正常')">
        <span style="color:var(--green)">● 绿码 · 正常</span>
      </div>
      <p style="margin-top:16px;font-size:19px;color:var(--text-soft)">有效期至 2026年12月31日</p>
    </div>
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:18px" onclick="closeSheet()">完成</button>
  `);
}
/* 生成一个纯 SVG 模拟二维码（含三个定位角） */
function makeQr(){
  let s = '<svg viewBox="0 0 100 100" style="width:100%;height:100%">';
  for (let y=0;y<25;y++){
    for (let x=0;x<25;x++){
      // 三个定位角：左上、右上、左下
      const topLeft  = (x<7 && y<7);
      const topRight = (x>17 && y<7);
      const btmLeft  = (x<7 && y>17);
      let on = false;
      if (topLeft){
        on = (x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4));
      } else if (topRight){
        on = (x===18||x===24||y===0||y===6||(x>=20&&x<=22&&y>=2&&y<=4));
      } else if (btmLeft){
        on = (x===0||x===6||y===18||y===24||(x>=2&&x<=4&&y>=20&&y<=22));
      } else {
        on = ((x*31 + y*17 + 7) % 3 === 0);
      }
      if (on) s += `<rect x="${x*4}" y="${y*4}" width="4" height="4" fill="#1a1a1a"/>`;
    }
  }
  s += '</svg>';
  return s;
}

/* ---------- 功能：网上挂号（分步引导） ---------- */
const HOSPITALS = [
  { name:'市中心医院', sub:'三甲 · 综合医院', ico:'🏥' },
  { name:'人民医院',   sub:'三甲 · 综合医院', ico:'🏥' },
  { name:'中医院',     sub:'三甲 · 中医',     ico:'🌿' },
];
const DEPTS = ['内科','外科','心血管科','骨科','眼科','中医科'];
const TIMES = ['今天 上午 09:00','今天 上午 10:30','今天 下午 14:00','明天 上午 09:30','明天 上午 11:00'];

function startRegister(){
  State.reg = { step:0, hospital:null, dept:null, time:null };
  renderRegisterStep();
}

function renderRegisterStep(){
  const s = State.reg.step;
  const total = 4;
  let progress = '';
  for (let i=0;i<total;i++){
    progress += `<div class="seg ${i<s?'done':''}"></div>`;
  }

  let body = '';
  if (s === 0){
    // 选医院
    speakText('第一步，请选择您要去的医院');
    body = `
      <div class="step-progress"><span class="step-num">1/4</span>${progress}</div>
      <div class="step-q readable" onclick="speakText('请选择医院')">请选择医院</div>
      <div class="step-tip">点击您想去的医院，再点下一步</div>
      ${HOSPITALS.map((h,idx)=>`
        <button class="opt ${State.reg.hospital===h?'selected':''}" onclick="selectHospital(${idx})">
          <div class="opt-ico">${h.ico}</div>
          <div class="opt-main">
            <div class="opt-title">${h.name}</div>
            <div class="opt-sub">${h.sub}</div>
          </div>
          <div class="check"></div>
        </button>`).join('')}
      <div class="step-nav">
        <button class="btn btn-ghost" onclick="closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="regNext()">下一步</button>
      </div>`;
  } else if (s === 1){
    // 选科室
    speakText('第二步，请选择科室');
    body = `
      <div class="step-progress"><span class="step-num">2/4</span>${progress}</div>
      <div class="step-q readable" onclick="speakText('请选择科室')">请选择科室</div>
      <div class="step-tip">您已选择：${State.reg.hospital.name}</div>
      ${DEPTS.map((d,idx)=>`
        <button class="opt ${State.reg.dept===d?'selected':''}" onclick="selectDept(${idx})">
          <div class="opt-ico">🩺</div>
          <div class="opt-main"><div class="opt-title">${d}</div></div>
          <div class="check"></div>
        </button>`).join('')}
      <div class="step-nav">
        <button class="btn btn-ghost" onclick="regPrev()">上一步</button>
        <button class="btn btn-primary" onclick="regNext()">下一步</button>
      </div>`;
  } else if (s === 2){
    // 选时间
    speakText('第三步，请选择就诊时间');
    body = `
      <div class="step-progress"><span class="step-num">3/4</span>${progress}</div>
      <div class="step-q readable" onclick="speakText('请选择就诊时间')">请选择就诊时间</div>
      <div class="step-tip">${State.reg.hospital.name} · ${State.reg.dept}</div>
      ${TIMES.map((t,idx)=>`
        <button class="opt ${State.reg.time===t?'selected':''}" onclick="selectTime(${idx})">
          <div class="opt-ico">🕒</div>
          <div class="opt-main"><div class="opt-title">${t}</div><div class="opt-sub">还有号源</div></div>
          <div class="check"></div>
        </button>`).join('')}
      <div class="step-nav">
        <button class="btn btn-ghost" onclick="regPrev()">上一步</button>
        <button class="btn btn-primary" onclick="regNext()">下一步</button>
      </div>`;
  } else if (s === 3){
    // 确认
    speakText('最后一步，请确认您的挂号信息');
    body = `
      <div class="step-progress"><span class="step-num">4/4</span>${progress}</div>
      <div class="step-q readable" onclick="speakText('请确认挂号信息')">确认挂号信息</div>
      <div class="confirm-card">
        <div class="confirm-row"><span class="k">医院</span><span class="v">${State.reg.hospital.name}</span></div>
        <div class="confirm-row"><span class="k">科室</span><span class="v">${State.reg.dept}</span></div>
        <div class="confirm-row"><span class="k">时间</span><span class="v">${State.reg.time}</span></div>
        <div class="confirm-row"><span class="k">就诊人</span><span class="v">王秀英</span></div>
        <div class="confirm-row"><span class="k">挂号费</span><span class="v" style="color:var(--orange-deep)">15.00 元</span></div>
      </div>
      <div class="step-nav">
        <button class="btn btn-ghost" onclick="regPrev()">上一步</button>
        <button class="btn btn-primary" onclick="confirmRegister()">确认挂号</button>
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:12px" onclick="startRegister()">重新开始</button>`;
  }
  openSheet('网上挂号', body);
}

function selectHospital(idx){
  State.reg.hospital = HOSPITALS[idx];
  speakText('已选择' + State.reg.hospital.name);
  renderRegisterStep();
}
function selectDept(idx){
  State.reg.dept = DEPTS[idx];
  speakText('已选择' + State.reg.dept);
  renderRegisterStep();
}
function selectTime(idx){
  State.reg.time = TIMES[idx];
  speakText('已选择' + State.reg.time);
  renderRegisterStep();
}
function regPrev(){
  if (State.reg.step > 0){ State.reg.step--; renderRegisterStep(); }
}
function regNext(){
  const s = State.reg.step;
  if (s === 0 && !State.reg.hospital){ showToast('请先选择医院'); speakText('请先选择医院'); return; }
  if (s === 1 && !State.reg.dept){ showToast('请先选择科室'); speakText('请先选择科室'); return; }
  if (s === 2 && !State.reg.time){ showToast('请先选择时间'); speakText('请先选择时间'); return; }
  State.reg.step++;
  renderRegisterStep();
}
function confirmRegister(){
  // 防误触：二次确认
  showConfirm({
    icon:'⚠️',
    title:'确认挂号吗？',
    msg:`即将挂号：${State.reg.hospital.name} ${State.reg.dept}\n就诊时间：${State.reg.time}`,
    onOk: () => {

function startCall(name, rel, emoji, bg){
  speakText('正在呼叫' + rel + name);
  openSheet('视频通话', `
    <div class="call-screen">
      <div class="big-avatar" style="background:${bg}">${emoji}</div>
      <div class="calling-name readable" onclick="speakText('${name}，${rel}')">${name}（${rel}）</div>
      <div class="calling-stat" id="callStat">正在呼叫…</div>
      <div style="display:flex;gap:14px;justify-content:center">
        <button class="btn btn-green btn-lg" onclick="answerCall()">接听</button>
        <button class="btn" style="background:#D63A3A;color:#fff" onclick="closeSheet()">挂断</button>
      </div>
    </div>`);
  // 模拟 3 秒后接通
  setTimeout(() => {
    const st = document.getElementById('callStat');
    if (st){ st.textContent = '已接通 · 通话中'; st.style.color = 'var(--green)'; speakText('通话已接通'); }
  }, 3000);
}
function answerCall(){
  const st = document.getElementById('callStat');
  if (st){ st.textContent = '已接通 · 通话中'; st.style.color = 'var(--green)'; }
  speakText('通话已接通，可以和家人说话了');
}

/* ---------- 6. 防误触：二次确认对话框 ---------- */
let _confirmCb = null;
function showConfirm({ icon='❓', title='请确认', msg='', onOk }){
  document.getElementById('cdIcon').textContent = icon;
  document.getElementById('cdTitle').textContent = title;
  document.getElementById('cdMsg').innerHTML = msg.replace(/\n/g,'<br>');
  _confirmCb = onOk;
  document.getElementById('confirmDialog').classList.add('show');
  speakText(title + '。' + msg);
}
function closeConfirm(ok){
  document.getElementById('confirmDialog').classList.remove('show');
  if (ok && _confirmCb){ _confirmCb(); }
  _confirmCb = null;
}

/* ---------- Toast ---------- */
let _toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 工具：HTML 转义 ---------- */
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
