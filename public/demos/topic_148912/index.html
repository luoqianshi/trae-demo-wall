","花落知多少"],pinyin:["chun mian bu jue xiao","chu chu wen ti niao","ye lai feng yu sheng","hua luo zhi duo shao"],meaning:"春日里贪睡不知不觉天就亮了，到处可以听见小鸟的鸣叫声。回想昨夜的阵阵风雨声，吹落了多少芳香的春花。",grade:"primary-1"},{id:"p3",title:"登鹳雀楼",author:"王之涣",dynasty:"唐",content:["白日依山尽","黄河入海流","欲穷千里目","更上一层楼"],pinyin:["bai ri yi shan jin","huang he ru hai liu","yu qiong qian li mu","geng shang yi ceng lou"],meaning:"夕阳依傍着西山慢慢地沉没，滔滔黄河朝着东海汹涌奔流。若想把千里的风光景物看够，那就要登上更高的一层城楼。",grade:"primary-2"},{id:"p4",title:"相思",author:"王维",dynasty:"唐",content:["红豆生南国","春来发几枝","愿君多采撷","此物最相思"],pinyin:["hong dou sheng nan guo","chun lai fa ji zhi","yuan jun duo cai xie","ci wu zui xiang si"],meaning:"红豆生长在阳光明媚的南方，每逢春天不知长多少新枝。希望你多采集一些红豆，它最能够引起人们的思念之情。",grade:"primary-2"},{id:"p5",title:"悯农",author:"李绅",dynasty:"唐",content:["锄禾日当午","汗滴禾下土","谁知盘中餐","粒粒皆辛苦"],pinyin:["chu he ri dang wu","han di he xia tu","shei zhi pan zhong can","li li jie xin ku"],meaning:"农民在正午时分还在田里锄草，汗水滴落在禾苗下的土地里。谁知道盘中的饭食，每一粒都是农民辛苦劳作得来的。",grade:"primary-2"},{id:"p6",title:"江雪",author:"柳宗元",dynasty:"唐",content:["千山鸟飞绝","万径人踪灭","孤舟蓑笠翁","独钓寒江雪"],pinyin:["qian shan niao fei jue","wan jing ren zong mie","gu zhou suo li weng","du diao han jiang xue"],meaning:"所有的山上飞鸟的身影已经绝迹，所有道路都不见人的踪迹。江面孤舟上一个披簑戴笠的渔翁，独自在大雪覆盖的寒冷江面上垂钓。",grade:"primary-3"},{id:"p7",title:"游子吟",author:"孟郊",dynasty:"唐",content:["慈母手中线","游子身上衣","临行密密缝","意恐迟迟归","谁言寸草心","报得三春晖"],pinyin:["ci mu shou zhong xian","you zi shen shang yi","lin xing mi mi feng","yi kong chi chi gui","shei yan cun cao xin","bao de san chun hui"],meaning:"慈祥的母亲手里把着针线，为即将远游的孩子赶制新衣。临行前一针针密密地缝缀，怕儿子回来得晚衣服破损。谁说像小草那样微弱的孝心，能报答得了像春晖普泽的慈母恩情？",grade:"primary-3"},{id:"p8",title:"绝句",author:"杜甫",dynasty:"唐",content:["两个黄鹂鸣翠柳","一行白鹭上青天","窗含西岭千秋雪","门泊东吴万里船"],pinyin:["liang ge huang li ming cui liu","yi xing bai lu shang qing tian","chuang han xi ling qian qiu xue","men bo dong wu wan li chuan"],meaning:"两只黄鹂在翠绿的柳树间鸣叫，一行白鹭飞上蓝天。窗口可以看见西岭千年不化的积雪，门口停泊着从东吴万里开来的船只。",grade:"primary-3"},{id:"p9",title:"望庐山瀑布",author:"李白",dynasty:"唐",content:["日照香炉生紫烟","遥看瀑布挂前川","飞流直下三千尺","疑是银河落九天"],pinyin:["ri zhao xiang lu sheng zi yan","yao kan pu bu gua qian chuan","fei liu zhi xia san qian chi","yi shi yin he luo jiu tian"],meaning:"香炉峰在阳光的照射下生起紫色烟霞，从远处看去瀑布好似白色绢绸悬挂山前。高崖上飞腾直落的瀑布好像有几千尺，令人怀疑是银河从天上倾泻落到人间。",grade:"primary-4"},{id:"p10",title:"早发白帝城",author:"李白",dynasty:"唐",content:["朝辞白帝彩云间","千里江陵一日还","两岸猿声啼不住","轻舟已过万重山"],pinyin:["chao ci bai di cai yun jian","qian li jiang ling yi ri huan","liang an yuan sheng ti bu zhu","qing zhou yi guo wan zhong shan"],meaning:"清晨告别五彩云霞映照中的白帝城，千里之遥的江陵一天就可以到达。两岸猿猴的啼叫声还在耳边回荡，轻快的小船已经驶过了万重山峦。",grade:"primary-4"},{id:"p11",title:"枫桥夜泊",author:"张继",dynasty:"唐",content:["月落乌啼霜满天","江枫渔火对愁眠","姑苏城外寒山寺","夜半钟声到客船"],pinyin:["yue luo wu ti shuang man tian","jiang feng yu huo dui chou mian","gu su cheng wai han shan si","ye ban zhong sheng dao ke chuan"],meaning:"月亮已落下乌鸦啼叫寒气满天，对着江边枫树和渔火忧愁而眠。姑苏城外那寂寞清静寒山古寺，半夜里敲钟的声音传到了客船。",grade:"primary-4"},{id:"p12",title:"清明",author:"杜牧",dynasty:"唐",content:["清明时节雨纷纷","路上行人欲断魂","借问酒家何处有","牧童遥指杏花村"],pinyin:["qing ming shi jie yu fen fen","lu shang xing ren yu duan hun","jie wen jiu jia he chu you","mu tong yao zhi xing hua cun"],meaning:"清明节这天细雨纷纷，路上远行的人好像断魂一样迷乱凄凉。问一声牧童哪里才有酒家，他指了指远处的杏花村。",grade:"primary-4"},{id:"p13",title:"题西林壁",author:"苏轼",dynasty:"宋",content:["横看成岭侧成峰","远近高低各不同","不识庐山真面目","只缘身在此山中"],pinyin:["heng kan cheng ling ce cheng feng","yuan jin gao di ge bu tong","bu shi lu shan zhen mian mu","zhi yuan shen zai ci shan zhong"],meaning:"从正面、侧面看庐山山岭连绵起伏、山峰耸立，从远处、近处、高处、低处看庐山，庐山呈现各种不同的样子。我之所以认不清庐山真正的面目，是因为我人身处在庐山之中。",grade:"primary-5"},{id:"p14",title:"饮湖上初晴后雨",author:"苏轼",dynasty:"宋",content:["水光潋滟晴方好","山色空蒙雨亦奇","欲把西湖比西子","淡妆浓抹总相宜"],pinyin:["shui guang lian yan qing fang hao","shan se kong meng yu yi qi","yu ba xi hu bi xi zi","dan zhuang nong mo zong xiang yi"],meaning:"晴天，西湖水波荡漾，在阳光照耀下，光彩熠熠，美极了。下雨时，远处的山笼罩在烟雨之中，时隐时现，眼前一片迷茫，这朦胧的景色也是非常漂亮的。如果把美丽的西湖比作美人西施，那么淡妆也好，浓妆也罢，总能很好地烘托出她的天生丽质和迷人神韵。",grade:"primary-5"},{id:"p15",title:"游山西村",author:"陆游",dynasty:"宋",content:["莫笑农家腊酒浑","丰年留客足鸡豚","山重水复疑无路","柳暗花明又一村"],pinyin:["mo xiao nong jia la jiu hun","feng nian liu ke zu ji tun","shan chong shui fu yi wu lu","liu an hua ming you yi cun"],meaning:"不要笑农家腊月里酿的酒浑浊不醇厚，丰收的年景农家待客菜肴非常丰盛。山峦重叠水流曲折正担心无路可走，柳色浓绿花色明丽忽然出现一个村庄。",grade:"primary-5"},{id:"p16",title:"观书有感",author:"朱熹",dynasty:"宋",content:["半亩方塘一鉴开","天光云影共徘徊","问渠那得清如许","为有源头活水来"],pinyin:["ban mu fang tang yi jian kai","tian guang yun ying gong pai huai","wen qu na de qing ru xu","wei you yuan tou huo shui lai"],meaning:"半亩大的方形池塘像一面镜子一样打开，天光、云影在水面上闪耀浮动。要问池塘里的水为何这样清澈呢？是因为有永不枯竭的源头源源不断地为它输送活水。",grade:"primary-6"},{id:"p17",title:"石灰吟",author:"于谦",dynasty:"明",content:["千锤万凿出深山","烈火焚烧若等闲","粉骨碎身浑不怕","要留清白在人间"],pinyin:["qian chui wan zao chu shen shan","lie huo fen shao ruo deng xian","fen gu sui shen hun bu pa","yao liu qing bai zai ren jian"],meaning:"经过千锤万凿从深山里开采出来的石头，它把熊熊烈火的焚烧当作很平常的一件事。即使粉身碎骨也毫不惧怕，只要把高尚的节操留在人世间。",grade:"primary-6"},{id:"p18",title:"己亥杂诗",author:"龚自珍",dynasty:"清",content:["九州生气恃风雷","万马齐喑究可哀","我劝天公重抖擞","不拘一格降人才"],pinyin:["jiu zhou sheng qi shi feng lei","wan ma qi yin jiu ke ai","wo quan tian gong chong dou sou","bu ju yi ge jiang ren cai"],meaning:"只有狂雷炸响般的巨大力量才能使中国大地发出勃勃生机，然而社会政局毫无生气终究是一种悲哀。我奉劝上天要重新振作精神，不要拘泥一定规格以降下更多的人才。",grade:"primary-6"},{id:"p19",title:"出师表",author:"诸葛亮",dynasty:"三国",content:["先帝创业未半而中道崩殂","今天下三分","益州疲弊","此诚危急存亡之秋也"],pinyin:["xian di chuang ye wei ban er zhong dao beng cu","jin tian xia san fen","yi zhou pi bi","ci cheng wei ji cun wang zhi qiu ye"],meaning:"先帝开创的事业没有完成一半，却中途去世了。现在天下分裂成三个国家，蜀汉民力困乏，这实在是危急存亡的时候啊。",grade:"middle-1"},{id:"p20",title:"陋室铭",author:"刘禹锡",dynasty:"唐",content:["山不在高","有仙则名","水不在深","有龙则灵","斯是陋室","惟吾德馨"],pinyin:["shan bu zai gao","you xian ze ming","shui bu zai shen","you long ze ling","si shi lou shi","wei wu de xin"],meaning:"山不在于高，有了神仙就出名。水不在于深，有了龙就显得有了灵气。这是简陋的房子，只是我品德好就感觉不到简陋了。",grade:"middle-1"},{id:"p21",title:"岳阳楼记",author:"范仲淹",dynasty:"宋",content:["庆历四年春","滕子京谪守巴陵郡","越明年","政通人和","百废俱兴"],pinyin:["qing li si nian chun","teng zi jing zhe shou ba ling jun","yue ming nian","zheng tong ren he","bai fei ju xing"],meaning:"庆历四年的春天，滕子京被降职到巴陵郡做太守。到了第二年，政事顺利，百姓和乐，各种荒废的事业都兴办起来了。",grade:"middle-2"},{id:"p22",title:"醉翁亭记",author:"欧阳修",dynasty:"宋",content:["环滁皆山也","其西南诸峰","林壑尤美","望之蔚然而深秀者","琅琊也"],pinyin:["huan chu jie shan ye","qi xi nan zhu feng","lin he you mei","wang zhi wei ran er shen xiu zhe","lang ya ye"],meaning:"环绕滁州城的都是山。它西南方向的各个山峰，树林和山谷尤其优美，远远望去树木茂盛，又幽深又秀丽的，是琅琊山。",grade:"middle-2"},{id:"p23",title:"赤壁赋",author:"苏轼",dynasty:"宋",content:["壬戌之秋","七月既望","苏子与客泛舟游于赤壁之下","清风徐来","水波不兴"],pinyin:["ren xu zhi qiu","qi yue ji wang","su zi yu ke fan zhou you yu chi bi zhi xia","qing feng xu lai","shui bo bu xing"],meaning:"壬戌年秋天，七月十六日，我与友人在赤壁下泛舟游玩。清风缓缓吹来，水面波澜不起。",grade:"middle-3"},{id:"p24",title:"琵琶行",author:"白居易",dynasty:"唐",content:["浔阳江头夜送客","枫叶荻花秋瑟瑟","主人下马客在船","举酒欲饮无管弦"],pinyin:["xun yang jiang tou ye song ke","feng ye di hua qiu se se","zhu ren xia ma ke zai chuan","ju jiu yu yin wu guan xian"],meaning:"秋夜我到浔阳江头送一位归客，冷风吹着枫叶和芦花秋声瑟瑟。我下马和客人在船上饯别设宴，举起酒杯要饮却无助兴的音乐。",grade:"middle-3"}];function Yt(e){return Kt.filter(t=>t.grade===e)}function Gt({type:e,message:t,onClose:n}){const[r,a]=f.useState(!0);return f.useEffect(()=>{const e=setTimeout(()=>{a(!1),setTimeout(n,300)},2e3);return()=>clearTimeout(e)},[n]),r?d.jsx("div",{className:"fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 "+("correct"===e?"animate-pop":"animate-shake"),children:d.jsxs("div",{className:"rounded-3xl p-8 shadow-2xl "+("correct"===e?"bg-softGreen":"bg-softPink"),children:[d.jsx("div",{className:"text-6xl mb-4 "+("correct"===e?"animate-bounce":"animate-wiggle"),children:"correct"===e?"🎉":"😢"}),d.jsx("h2",{className:"text-2xl font-bold text-center mb-2 "+("correct"===e?"text-green-700":"text-red-700"),children:"correct"===e?"太棒了！":"继续加油！"}),d.jsx("p",{className:"text-center "+("correct"===e?"text-green-600":"text-red-600"),children:t})]})}):null}function Xt(){const{addPoints:e,points:t,selectedGrade:n,setGrade:r}
