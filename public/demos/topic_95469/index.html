const CountUp = ({ end, duration = 1000, prefix = '', suffix = '' }) => {
  const [count, setCount] = useState(0);
  const countRef = useRef(0);
  const startTimeRef = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    startTimeRef.current = null;
    const startValue = countRef.current;
    const endValue = end;
    const totalDuration = duration;

    const animate = (timestamp) => {
      if (!startTimeRef.current) startTimeRef.current = timestamp;
      const progress = Math.min((timestamp - startTimeRef.current) / totalDuration, 1);
      const easeOut = 1 - Math.pow(1 - progress, 3);
      const current = Math.floor(startValue + (endValue - startValue) * easeOut);
      setCount(current);
      countRef.current = current;
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(animate);
      }
    };

    rafRef.current = requestAnimationFrame(animate);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [end, duration]);

  return <span className="count-up">{prefix}{count}{suffix}</span>;
};

        file_status: i === count ? '最终版' : (i === count - 1 ? '修改版' : '初稿'),
        is_final: i === count ? 1 : 0,
        is_latest: i === count ? 1 : 0,
        uploader_name: MOCK_USERS[i % MOCK_USERS.length].name,
        uploaded_at: `2026-05-${10+i} 14:${20+i}:00`,

        include_in_delivery: i === count ? 1 : 0,
        file_size: Math.floor(Math.random() * 5000 + 500) + ' KB',
      });
    }
  });
  return files;
};

const RouterProvider = ({ children }) => {
  const [route, setRoute] = useState({ path: '/login', params: {} });

  const navigate = (path) => {
    let params = {};

  return (

  );

// ========== 全局状态 ==========
const AppProvider = ({ children }) => {
  const [currentUser, setCurrentUser] = useState(null);
  const [projects, setProjects] = useState(MOCK_PROJECTS);
  const [allFiles, setAllFiles] = useState(MOCK_FILES);
  const [allWorklogs, setAllWorklogs] = useState(MOCK_WORKLOGS);
  const [allComms, setAllComms] = useState(MOCK_COMMS);
  const [allTasks, setAllTasks] = useState(MOCK_TASKS);
  const [allPackages, setAllPackages] = useState(MOCK_PACKAGES);
  const [guideStep, setGuideStep] = useState(0);

  const login = (name) => {
    setCurrentUser({ name, role: '成员' });
    notification.success({
      message: '登录成功',
      description: `欢迎回来，${name}！开始体验创赛交付系统吧 🎉`,
      icon: <SmileOutlined style={{ color: '#52c41a' }} />,
      placement: 'topRight',
    });
  };

  const logout = () => {
    setCurrentUser(null);
    message.info('已退出登录');
  };

  // 添加工作记录
  const addWorklog = (projectId, record) => {
    const newRecord = {
      id: Date.now(),
      ...record,
      recorder_name: currentUser?.name || '当前用户',
      created_at: dayjs().format('YYYY-MM-DD HH:mm'),
    };
    const newLogs = { ...allWorklogs };
    newLogs[projectId] = [newRecord, ...(newLogs[projectId] || [])];
    setAllWorklogs(newLogs);
    notification.success({
      message: '记录已添加',
      description: '工作记录已成功保存',
      icon: <CheckCircleOutlined style={{ color: '#52c41a' }} />,
      placement: 'topRight',
    });
  };

  // 添加沟通记录
  const addComm = (projectId, record) => {
    const newRecord = {
      id: Date.now(),
      ...record,
      recorder_name: currentUser?.name || '当前用户',
      occurred_at: dayjs().format('YYYY-MM-DD HH:mm'),
    };
    const newComms = { ...allComms };
    newComms[projectId] = [newRecord, ...(newComms[projectId] || [])];
    setAllComms(newComms);
    notification.success({
      message: '记录已添加',
      description: '沟通记录已成功保存',
      icon: <MessageOutlined style={{ color: '#1890ff' }} />,
      placement: 'topRight',
    });
  };

  // 添加任务
  const addTask = (projectId, task) => {
    const newTask = {
      id: Date.now(),
      ...task,
      status: '待处理',
    };
    const newTasks = { ...allTasks };
    newTasks[projectId] = [newTask, ...(newTasks[projectId] || [])];
    setAllTasks(newTasks);
    notification.success({
      message: '任务已创建',
      description: `任务「${task.title}」已添加`,
      icon: <CheckOutlined style={{ color: '#52c41a' }} />,
      placement: 'topRight',
    });
  };

  // 上传文件
  const uploadFile = (projectId, fileInfo) => {
    const newFiles = { ...allFiles };
    if (!newFiles[projectId]) newFiles[projectId] = {};
    if (!newFiles[projectId][fileInfo.material_type]) {
      newFiles[projectId][fileInfo.material_type] = [];
    }
    const existingCount = newFiles[projectId][fileInfo.material_type].length;
    const typeName = fileInfo.material_type.split('_').slice(1).join('_') || fileInfo.material_type;
    const newFile = {
      id: Date.now(),
      original_name: fileInfo.file_name,
      stored_name: `${typeName}_V${String(existingCount + 1).padStart(2, '0')}.${fileInfo.file_name.split('.').pop()}`,
      material_type: fileInfo.material_type,
      version_no: 'V' + String(existingCount + 1).padStart(2, '0'),
      file_status: fileInfo.file_status || '修改版',
      is_final: 0,
      is_latest: 1,
      uploader_name: currentUser?.name || '当前用户',
      uploaded_at: dayjs().format('YYYY-MM-DD HH:mm'),
      change_note: fileInfo.change_note || '新上传',
      include_in_delivery: 0,
      file_size: Math.floor(Math.random() * 3000 + 500) + ' KB',
    };
    // 将之前的最新版标记为非最新
    newFiles[projectId][fileInfo.material_type] = newFiles[projectId][fileInfo.material_type].map(f => ({ ...f, is_latest: 0 }));
    newFiles[projectId][fileInfo.material_type].push(newFile);
    setAllFiles(newFiles);
    notification.success({
      message: '上传成功',
      description: `${newFile.stored_name} 已上传到材料库`,
      icon: <FileDoneOutlined style={{ color: '#52c41a' }} />,
      placement: 'topRight',
    });
    return newFile;
  };

  // 生成交付包
  const generatePackage = (projectId, selectedTypes) => {
    const newPkg = {
      id: Date.now(),
      package_name: `交付包_${dayjs().format('YYYYMMDD_HHmm')}`,
      generated_by: currentUser?.name || '当前用户',
      generated_at: dayjs().format('YYYY-MM-DD HH:mm'),
      file_count: selectedTypes.length,
      file_size: (Math.random() * 15 + 5).toFixed(1) + ' MB',
    };
    const newPackages = { ...allPackages };
    newPackages[projectId] = [newPkg, ...(newPackages[projectId] || [])];
    setAllPackages(newPackages);
    notification.success({
      message: '交付包生成成功',
      description: `包含 ${selectedTypes.length} 种材料，共 ${newPkg.file_size}`,
      icon: <RocketOutlined style={{ color: '#722ed1' }} />,
      placement: 'topRight',
    });
    return newPkg;
  };

  // 更新任务状态
  const updateTaskStatus = (projectId, taskId, newStatus) => {
    const newTasks = { ...allTasks };
    const idx = newTasks[projectId].findIndex(t => t.id === taskId);
    if (idx > -1) {
      const oldStatus = newTasks[projectId][idx].status;
      newTasks[projectId][idx] = { ...newTasks[projectId][idx], status: newStatus };
      setAllTasks(newTasks);
      if (newStatus === '已完成' && oldStatus !== '已完成') {
        message.success(`🎉 任务「${newTasks[projectId][idx].title}」已完成！`);
      } else {
        message.info(`状态已更新为「${newStatus}」`);
      }
    }
  };

  // 更新项目进度
  const updateProjectProgress = (projectId, newProgress) => {
    const newProjects = projects.map(p =>
      p.id === projectId ? { ...p, progress: Math.max(0, Math.min(100, newProgress)) } : p
    );
    setProjects(newProjects);
  };

  // 更新项目阶段
  const updateProjectStage = (projectId, newStage) => {
    const newProjects = projects.map(p =>
      p.id === projectId ? { ...p, stage: newStage } : p
    );
    setProjects(newProjects);
    message.success(`项目阶段已更新为「${newStage}」`);
  };

  // 新建项目
  const addProject = (projectData) => {
    const newProject = {
      id: Date.now(),
      ...projectData,
      progress: 0,
      total_files: 0,
      created_at: dayjs().format('YYYY-MM-DD'),
    };
    setProjects([newProject, ...projects]);
    notification.success({
      message: '项目创建成功',
      description: `「${projectData.name}」已创建，快去添加材料吧！`,
      icon: <FolderAddOutlined style={{ color: '#52c41a' }} />,
      placement: 'topRight',
    });
    return newProject;
  };

  // 删除交付包
  const deletePackage = (projectId, pkgId) => {
    const newP = { ...allPackages };
    newP[projectId] = (newP[projectId] || []).filter(x => x.id !== pkgId);
    setAllPackages(newP);
    message.success('交付包已删除');
  };

  return (
    <AppContext.Provider value={{
      currentUser, projects, setProjects,
      allFiles, setAllFiles,
      allWorklogs, setAllWorklogs,
      allComms, setAllComms,
      allTasks, setAllTasks,
      allPackages, setAllPackages,
      guideStep, setGuideStep,
      login, logout,
      addWorklog, addComm, addTask, uploadFile, generatePackage,
      updateTaskStatus, updateProjectProgress, updateProjectStage,
      addProject, deletePackage,
    }}>
      {children}
    </AppContext.Provider>
  );
};

const MaterialsTab = ({ projectId }) => {
  const { allFiles, setAllFiles, uploadFile, currentUser } = useContext(AppContext);
  const [uploadOpen, setUploadOpen] = useState(false);
  const [detailFile, setDetailFile] = useState(null);
  const [uploadProgress, setUploadProgress] = useState(0);
  const [isUploading, setIsUploading] = useState(false);
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);
  const [previewOpen, setPreviewOpen] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [typeFilter, setTypeFilter] = useState('全部');
  const [form] = Form.useForm();

  const files = allFiles[projectId] || {};
  const allFileList = Object.values(files).flat();
  const allTypes = Object.keys(files);

  const filteredFiles = useMemo(() => {
    if (typeFilter === '全部') return files;
    const result = {};
    if (files[typeFilter]) result[typeFilter] = files[typeFilter];
    return result;
  }, [files, typeFilter]);

  const statusColor = { '初稿': 'default', '修改版': 'blue', '待确认': 'orange', '已确认': 'cyan', '最终版': 'green', '作废': 'red' };

  const handleMockUpload = () => {
    form.validateFields().then(values => {
      setIsUploading(true);
      setUploadProgress(0);
      let p = 0;
      const timer = setInterval(() => {
        p += Math.floor(Math.random() * 20 + 10);
        if (p >= 100) {
          p = 100;
          clearInterval(timer);
          setTimeout(() => {
            uploadFile(projectId, {
              material_type: values.material_type,
              file_status: values.file_status,
              file_name: `新文件_${Date.now()}.docx`,
              change_note: values.change_note,
            });
            setIsUploading(false);
            setUploadOpen(false);
            setUploadProgress(0);
            form.resetFields();
          }, 500);
        }
        setUploadProgress(p);
      }, 200);
    });
  };

  const handleToggleFinal = (file) => {
    const newFiles = { ...allFiles };
    const mtFiles = newFiles[projectId][file.material_type];
    const idx = mtFiles.findIndex(f => f.id === file.id);
    const newIsFinal = !mtFiles[idx].is_final;
    if (newIsFinal) {
      newFiles[projectId][file.material_type] = mtFiles.map(f => ({ ...f, is_final: 0 }));
    }
    newFiles[projectId][file.material_type][idx] = { ...mtFiles[idx], is_final: newIsFinal };
    setAllFiles(newFiles);
    message.success(newIsFinal ? '已设为最终版' : '已取消最终版标记');
    if (detailFile && detailFile.id === file.id) {
      setDetailFile({ ...detailFile, is_final: newIsFinal });
    }
  };

  const handleDelete = (file) => {
    const newFiles = { ...allFiles };
    newFiles[projectId][file.material_type] = newFiles[projectId][file.material_type].filter(f => f.id !== file.id);
    setAllFiles(newFiles);
    setSelectedRowKeys(selectedRowKeys.filter(k => k !== file.id));
    message.success('文件已删除');
    if (detailFile && detailFile.id === file.id) {
      setDetailFile(null);
    }
  };

  const handleBatchDelete = () => {
    const newFiles = { ...allFiles };
    for (const mt of Object.keys(newFiles[projectId])) {
      newFiles[projectId][mt] = newFiles[projectId][mt].filter(f => !selectedRowKeys.includes(f.id));
    }
    setAllFiles(newFiles);
    setSelectedRowKeys([]);
    notification.success({
      message: '批量删除成功',

            <Card
              key={mt}

                  <FileTextOutlined style={{ color: '#1890ff' }} />

              className="material-card fade-in-card"
              extra={
                <Button
                  type="link"
                  size="small"

              <Table

                rowKey="id"
                pagination={false}

                })}

              <Button icon={<CopyOutlined />} onClick={() => { message.success('版本链接已复制'); }}>复制链接</Button>
            </Space>
          </div>

      <Modal

        open={previewOpen}
        onCancel={() => setPreviewOpen(false)}
        footer={[
          <Button key="close" onClick={() => setPreviewOpen(false)}>关闭</Button>,
          <Button key="download" type="primary" icon={<DownloadOutlined />} onClick={() => message.success('开始下载（Demo模拟）')}>下载文件</Button>,
        ]}

        destroyOnClose
      >
        <div className="file-preview-mock">
          <div className="preview-header">
            <FileTextOutlined style={{ fontSize: 24, color: '#1890ff' }} />

          </div>
          <div className="preview-content">
            <div className="preview-page">
              <div className="preview-title">{detailFile?.stored_name || '文档标题'}</div>
              <div className="preview-line" style={{ width: '80%' }}></div>
              <div className="preview-line" style={{ width: '90%' }}></div>
              <div className="preview-line" style={{ width: '70%' }}></div>
              <div className="preview-line" style={{ width: '85%' }}></div>
              <div className="preview-line" style={{ width: '75%' }}></div>
              <div className="preview-space"></div>
              <div className="preview-subtitle">一、项目背景</div>
              <div className="preview-line" style={{ width: '90%' }}></div>
              <div className="preview-line" style={{ width: '85%' }}></div>
              <div className="preview-line" style={{ width: '88%' }}></div>
              <div className="preview-line" style={{ width: '78%' }}></div>
              <div className="preview-space"></div>
              <div className="preview-subtitle">二、解决方案</div>
              <div className="preview-line" style={{ width: '92%' }}></div>
              <div className="preview-line" style={{ width: '80%' }}></div>
              <div className="preview-line" style={{ width: '86%' }}></div>
              <div style={{ textAlign: 'center', color: '#ccc', marginTop: 40, fontSize: 12 }}>
                — 第 1 页（预览演示）—
              </div>
            </div>
          </div>
        </div>
      </Modal>

      <Modal
        title="📤 上传文件"
        open={uploadOpen}
        onCancel={() => { setUploadOpen(false); form.resetFields(); setDragOver(false); }}
        footer={isUploading ? null : [
          <Button key="cancel" onClick={() => { setUploadOpen(false); form.resetFields(); setDragOver(false); }}>取消</Button>,
          <Button key="ok" type="primary" onClick={handleMockUpload} className="btn-hover-lift">模拟上传</Button>,
        ]}
        destroyOnClose
        width={520}
      >
        <Form form={form} layout="vertical" initialValues={{ material_type: MATERIAL_TYPES[0], file_status: '修改版' }}>
          <Form.Item label="材料类型" name="material_type">
            <Select options={MATERIAL_TYPES.map(m => ({ value: m, label: m.split('_').slice(1).join('_') || m }))} />
          </Form.Item>
          <Form.Item label="选择文件" name="file">
            <div
              className={`upload-demo ${dragOver ? 'drag-over' : ''}`}
              onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={(e) => { e.preventDefault(); setDragOver(false); message.success('文件已添加（Demo模拟）'); }}
              onClick={handleMockUpload}
            >
              <InboxOutlined className="inbox-icon" style={{ fontSize: 56, color: '#ccc', marginBottom: 16 }} />
              <p style={{ color: '#666', fontSize: 15 }}>
                {dragOver ? '松开鼠标上传文件' : '点击或拖拽上传'}
              </p>
              <p style={{ color: '#aaa', fontSize: 12, marginTop: 8 }}>支持 PPT、Word、Excel、PDF、图片等格式</p>
            </div>
            {isUploading && (
              <div className="mock-upload-bar">
                <div className="mock-upload-progress" style={{ width: uploadProgress + '%' }}></div>
              </div>
            )}
            {isUploading && <div style={{ textAlign: 'center', marginTop: 10, color: '#1890ff', fontWeight: 500 }}>{uploadProgress}%</div>}
          </Form.Item>
          <Form.Item label="文件状态" name="file_status">
            <Select options={FILE_STATUSES.map(s => ({ value: s, label: s }))} />
          </Form.Item>
          <Form.Item label="修改说明" name="change_note">
            <Input.TextArea rows={2} placeholder="说明本次修改内容" />
          </Form.Item>
        </Form>
      </Modal>
    </div>
  );
};

const tagStyle = (active) => ({
  padding: '4px 14px',
  fontSize: 12,
  borderRadius: 14,
  background: active ? '#1890ff' : '#f0f0f0',
  color: active ? '#fff' : '#666',
  border: 'none',
  cursor: 'pointer',
  transition: 'all 0.2s',
});

const WorkLogsTab = ({ projectId }) => {
  const { allWorklogs, setAllWorklogs, addWorklog } = useContext(AppContext);
  const [open, setOpen] = useState(false);
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);
  const [form] = Form.useForm();
  const worklogs = allWorklogs[projectId] || [];

  const handleAdd = () => {
    form.validateFields().then(values => {
      addWorklog(projectId, values);
      setOpen(false);
      form.resetFields();
    });
  };

  const handleBatchDelete = () => {
    const newLogs = { ...allWorklogs };
    newLogs[projectId] = newLogs[projectId].filter(l => !selectedRowKeys.includes(l.id));
    setAllWorklogs(newLogs);
    setSelectedRowKeys([]);
    notification.success({
      message: '批量删除成功',
      description: `已删除 ${selectedRowKeys.length} 条记录`,
      icon: <DeleteOutlined style={{ color: '#f5222d' }} />,
      placement: 'topRight',
    });
  };

  const handleDelete = (record) => {
    const newLogs = { ...allWorklogs };
    newLogs[projectId] = newLogs[projectId].filter(l => l.id !== record.id);
    setAllWorklogs(newLogs);
    setSelectedRowKeys(selectedRowKeys.filter(k => k !== record.id));
    message.success('已删除');
  };

  const columns = [
    { title: '时间', dataIndex: 'created_at', width: 170, render: v => <span style={{ color: '#888' }}>{v}</span> },
    {
      title: '工作内容', dataIndex: 'content',
      render: (v, r) => (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
            <Tag color="blue" style={{ margin: 0 }}>{r.work_type}</Tag>
            <span style={{ color: '#999', fontSize: 12 }}><UserOutlined style={{ marginRight: 4 }} />{r.recorder_name}</span>
          </div>
          <div style={{ color: '#333' }}>{v}</div>
          {r.next_action && (
            <div style={{ color: '#fa8c16', fontSize: 12, marginTop: 4 }}>
              → 下一步：{r.next_action}
            </div>
          )}
        </div>
      ),
    },
    {
      title: '操作', width: 80, render: (_, r) => (
        <Popconfirm title="确认删除这条记录？" onConfirm={() => handleDelete(r)}>
          <Button size="small" type="link" danger>删除</Button>
        </Popconfirm>
      ),
    },
  ];

  return (
    <div style={{ padding: '20px 0' }}>
      <Space wrap style={{ marginBottom: 20 }}>
        <Button type="primary" icon={<PlusOutlined />} onClick={() => setOpen(true)} className="btn-hover-lift">
          新增工作记录
        </Button>
        <Tooltip title="导出为Word文档">
          <Button icon={<DownloadOutlined />} onClick={() => message.success('导出成功（Demo模拟）')}>导出Word</Button>
        </Tooltip>
        <Tooltip title="导出为Excel表格">
          <Button icon={<DownloadOutlined />} onClick={() => message.success('导出成功（Demo模拟）')}>导出Excel</Button>
        </Tooltip>
        {selectedRowKeys.length > 0 && (
          <Popconfirm title={`确定删除选中的 ${selectedRowKeys.length} 条记录？`} onConfirm={handleBatchDelete}>
            <Button danger>批量删除 ({selectedRowKeys.length})</Button>
          </Popconfirm>
        )}
      </Space>
      <Table
        size="small"
        dataSource={worklogs}
        rowKey="id"
        pagination={{ pageSize: 8 }}
        rowSelection={{ selectedRowKeys, onChange: keys => setSelectedRowKeys(keys) }}
        expandable={{
          expandedRowRender: (l) => (
            <div style={{ padding: '8px 0' }}>
              <p style={{ margin: '0 0 10px' }}><b style={{ color: '#333' }}>📝 工作内容：</b>{l.content}</p>
              {l.next_action && <p style={{ margin: 0, color: '#52c41a', fontWeight: 500 }}>
                📌 下一步：{l.next_action} → {l.next_owner_name}（截止：{l.next_due_date}）
              </p>}
            </div>
          ),
        }}
        columns={columns}
        locale={{ emptyText: '暂无工作记录，点击上方按钮添加第一条吧 ✨' }}
      />

      <Modal
        title="📝 新增工作记录"
        open={open}
        onCancel={() => { setOpen(false); form.resetFields(); }}
        onOk={handleAdd}
        destroyOnClose
        width={520}
        okText="保存"
      >
        <Form form={form} layout="vertical" initialValues={{ work_type: '内容撰写' }}>
          <Form.Item label="工作类型" name="work_type">
            <Select options={['内容撰写', '设计优化', '数据收集', '会议讨论', '测试验证', '其他'].map(o => ({ value: o, label: o }))} />
          </Form.Item>
          <Form.Item label="工作内容" name="content" rules={[{ required: true, message: '请输入工作内容' }]}>
            <Input.TextArea rows={4} placeholder="记录具体工作内容..." />
          </Form.Item>
          <Row gutter={12}>
            <Col span={12}>
              <Form.Item label="下一步计划" name="next_action">
                <Input placeholder="例如：等待导师反馈" />
              </Form.Item>
            </Col>
            <Col span={12}>
              <Form.Item label="负责人" name="next_owner_name">
                <Select options={MOCK_USERS.map(u => ({ value: u.name, label: u.name }))} placeholder="选择负责人" />

            </Col>
          </Row>
          <Form.Item label="截止日期" name="next_due_date">
            <DatePicker style={{ width: '100%' }} placeholder="选择截止日期" />
          </Form.Item>
        </Form>
      </Modal>
    </div>
  );
};

// ---- 任务事项 Tab ----
const TasksTab = ({ projectId }) => {
  const { allTasks, addTask, setAllTasks, updateTaskStatus } = useContext(AppContext);
  const [open, setOpen] = useState(false);
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);
  const [statusFilter, setStatusFilter] = useState('全部');
  const [form] = Form.useForm();
  const tasks = allTasks[projectId] || [];

  const statusOptions = ['待处理', '进行中', '待确认', '已完成', '已延期'];
  const statusColor = { '待处理': 'default', '进行中': 'blue', '待确认': 'orange', '已完成': 'green', '已延期': 'red' };

  const filteredTasks = tasks.filter(t => statusFilter === '全部' || t.status === statusFilter);

  const handleAdd = () => {
    form.validateFields().then(values => {
      const dueDate = values.due_date ? values.due_date.format('YYYY-MM-DD') : '';
      addTask(projectId, { ...values, due_date: dueDate });
      setOpen(false);
      form.resetFields();
    });
  };

  const handlePriorityChange = (task, newPriority) => {
    const newTasks = { ...allTasks };
    const idx = newTasks[projectId].findIndex(t => t.id === task.id);
    newTasks[projectId][idx] = { ...newTasks[projectId][idx], priority: newPriority };
    setAllTasks(newTasks);
    message.success(`优先级已更新为「${newPriority}」`);
  };

  const handleBatchDelete = () => {
    const newTasks = { ...allTasks };
    newTasks[projectId] = newTasks[projectId].filter(t => !selectedRowKeys.includes(t.id));
    setAllTasks(newTasks);
    setSelectedRowKeys([]);
    notification.success({
      message: '批量删除成功',
      description: `已删除 ${selectedRowKeys.length} 个任务`,
      icon: <DeleteOutlined style={{ color: '#f5222d' }} />,
      placement: 'topRight',
    });
  };

  const handleDelete = (task) => {
    const newTasks = { ...allTasks };
    newTasks[projectId] = newTasks[projectId].filter(t => t.id !== task.id);
    setAllTasks(newTasks);
    setSelectedRowKeys(selectedRowKeys.filter(k => k !== task.id));
    message.success('已删除');
  };

  const stats = {
    total: tasks.length,
    done: tasks.filter(t => t.status === '已完成').length,
    doing: tasks.filter(t => t.status === '进行中').length,
    pending: tasks.filter(t => t.status === '待处理').length,
  };

  const columns = [
    {
      title: '任务信息', dataIndex: 'title',
      render: (t, r) => (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
            <span style={{
              fontWeight: 500,
              textDecoration: r.status === '已完成' ? 'line-through' : 'none',
              color: r.status === '已完成' ? '#bbb' : '#333',
            }}>{t}</span>
            <Tag color={r.priority === '高' ? 'red' : r.priority === '中' ? 'orange' : 'default'} style={{ margin: 0, fontSize: 11 }}>
              {r.priority}优先级
            </Tag>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, color: '#999', fontSize: 12 }}>
            <span><UserOutlined style={{ marginRight: 4 }} />{r.assignee_name}</span>
            <span><CalendarOutlined style={{ marginRight: 4 }} />{r.due_date}</span>
          </div>
        </div>
      ),
    },
    {
      title: '状态', dataIndex: 'status', width: 140,
      render: (v, r) => (
        <Select
          value={v}
          size="small"
          style={{ width: 110 }}
          onChange={(val) => updateTaskStatus(projectId, r.id, val)}
          options={statusOptions.map(o => ({ value: o, label: o }))}
          tagRender={(props) => <Tag color={statusColor[props.value]}>{props.label}</Tag>}
        />
      ),
    },
    {
      title: '操作', width: 130, render: (_, r) => (
        <Space size={0}>
          {r.status !== '已完成' && (
            <Tooltip title="标记为完成">
              <Button size="small" type="link" icon={<CheckOutlined />} onClick={() => updateTaskStatus(projectId, r.id, '已完成')}>完成</Button>
            </Tooltip>
          )}
          <Dropdown
            menu={{
              items: [
                { key: 'priority_high', label: '设为高优先级', onClick: () => handlePriorityChange(r, '高') },
                { key: 'priority_mid', label: '设为中优先级', onClick: () => handlePriorityChange(r, '中') },
                { key: 'priority_low', label: '设为低优先级', onClick: () => handlePriorityChange(r, '低') },
                { type: 'divider' },
                { key: 'delete', icon: <DeleteOutlined style={{ color: '#f5222d' }} />, label: <span style={{ color: '#f5222d' }}>删除任务</span>, danger: true, onClick: () => handleDelete(r) },
              ],
            }}
            trigger={['click']}
          >
            <Button size="small" type="link">更多 <DownOutlined /></Button>
          </Dropdown>
        </Space>
      ),
    },
  ];

  return (
    <div style={{ padding: '20px 0' }}>
      <Space wrap style={{ marginBottom: 20 }}>
        <Button type="primary" icon={<PlusOutlined />} onClick={() => setOpen(true)} className="btn-hover-lift">
          新增任务
        </Button>
        {selectedRowKeys.length > 0 && (
          <Popconfirm title={`确定删除选中的 ${selectedRowKeys.length} 个任务？`} onConfirm={handleBatchDelete}>
            <Button danger>批量删除 ({selectedRowKeys.length})</Button>
          </Popconfirm>
        )}
        <span style={{ color: '#888', fontSize: 13, marginLeft: 8 }}>
          共 <b style={{ color: '#1890ff' }}>{stats.total}</b> 个，
          <b style={{ color: '#52c41a' }}>{stats.done}</b> 已完成，
          <b style={{ color: '#1890ff' }}>{stats.doing}</b> 进行中
        </span>
      </Space>

      <div style={{ marginBottom: 16 }}>
        <Space wrap>
          {['全部', '待处理', '进行中', '待确认', '已完成'].map(s => (
            <Tag.CheckableTag
              key={s}
              checked={statusFilter === s}
              onChange={() => setStatusFilter(s)}
              style={{
                padding: '4px 14px',
                fontSize: 12,
                borderRadius: 14,
                background: statusFilter === s ? (s === '全部' ? '#1890ff' : statusColor[s] === 'default' ? '#1890ff' : '') : '#f0f0f0',
                color: statusFilter === s ? '#fff' : '#666',
                border: 'none',
                cursor: 'pointer',
                transition: 'all 0.2s',
              }}
            >
              {s}
              {s !== '全部' && (
                <span style={{ marginLeft: 4, opacity: 0.8 }}>
                  ({tasks.filter(t => t.status === s).length})
                </span>
              )}
            </Tag.CheckableTag>
          ))}
        </Space>
      </div>

      <Table
        size="small"
        dataSource={filteredTasks}
        rowKey="id"
        pagination={false}
        rowSelection={{ selectedRowKeys, onChange: keys => setSelectedRowKeys(keys) }}
        columns={columns}
        locale={{ emptyText: '暂无任务，点击上方按钮创建第一个任务吧 ✨' }}
      />

      <Modal
        title="✅ 新增任务"
        open={open}
        onCancel={() => { setOpen(false); form.resetFields(); }}
        onOk={handleAdd}
        destroyOnClose
        width={480}
        okText="创建"
      >
        <Form form={form} layout="vertical" initialValues={{ priority: '中', assignee_name: '张明', status: '待处理' }}>
          <Form.Item label="任务名称" name="title" rules={[{ required: true, message: '请输入任务名称' }]}>
            <Input placeholder="请输入任务名称" />
          </Form.Item>
          <Row gutter={12}>
            <Col span={12}>
              <Form.Item label="优先级" name="priority">
                <Select options={['高', '中', '低'].map(o => ({ value: o, label: o }))} />
              </Form.Item>
            </Col>
            <Col span={12}>
              <Form.Item label="状态" name="status">
                <Select options={statusOptions.map(o => ({ value: o, label: o }))} />
              </Form.Item>
            </Col>
          </Row>
          <Row gutter={12}>
            <Col span={12}>
              <Form.Item label="负责人" name="assignee_name">
                <Select options={MOCK_USERS.map(u => ({ value: u.name, label: u.name }))} />
              </Form.Item>
            </Col>
            <Col span={12}>
              <Form.Item label="截止日期" name="due_date">
                <DatePicker style={{ width: '100%' }} placeholder="选择截止日期" />
              </Form.Item>
            </Col>
          </Row>
          <Form.Item label="任务描述" name="description">
            <Input.TextArea rows={3} placeholder="补充任务详情..." />
          </Form.Item>
        </Form>
      </Modal>
    </div>
  );
};

// ---- 交付包 Tab ----
const PackagesTab = ({ projectId, project }) => {
  const { allFiles, allPackages, generatePackage, deletePackage } = useContext(AppContext);
  const [generating, setGenerating] = useState(false);
  const [genProgress, setGenProgress] = useState(0);
  const [selectedTypes, setSelectedTypes] = useState([]);
  const [activePreset, setActivePreset] = useState(null);

  const files = allFiles[projectId] || {};
  const packages = allPackages[projectId] || [];

  const allTypes = Object.keys(files);
  const deliveryFiles = allTypes.filter(mt => files[mt].some(f => f.is_final)).map(mt => ({
    type: mt,
    label: mt.split('_').slice(1).join('_') || mt,
    latest: files[mt].find(f => f.is_final) || files[mt][files[mt].length - 1],
  }));

  const presets = [
    { name: '全部材料', desc: '所有最终版文件', types: deliveryFiles.map(d => d.type), icon: '📦' },
    { name: 'PPT+路演稿', desc: '演示用材料', types: deliveryFiles.filter(d => d.type.includes('PPT') || d.type.includes('路演')).map(d => d.type), icon: '📊' },
    { name: '文案类', desc: '申报文书类', types: deliveryFiles.filter(d => d.type.includes('策划书') || d.type.includes('商业计划') || d.type.includes('报告') || d.type.includes('调研')).map(d => d.type), icon: '📄' },
    { name: '仅最终版', desc: '精选最终版', types: deliveryFiles.map(d => d.type), icon: '🎯' },
  ];

  const handlePresetClick = (preset) => {
    const validTypes = preset.types.filter(t => allTypes.includes(t));
    if (validTypes.length === 0) {
      message.warning('该预设暂无可选材料');
      return;
    }
    setActivePreset(preset.name);
    setSelectedTypes(validTypes);
    message.success(`已选择「${preset.name}」预设，共 ${validTypes.length} 种材料`);
  };

  const handleGenerate = () => {
    if (selectedTypes.length === 0) {
      message.warning('请至少选择一种材料');
      return;
    }
    setGenerating(true);
    setGenProgress(0);
    let p = 0;
    const steps = ['正在收集材料...', '正在整理文件...', '正在打包...', '正在生成清单...'];
    let stepIdx = 0;
    const timer = setInterval(() => {
      p += Math.floor(Math.random() * 12 + 5);
      if (Math.floor(p / 25) > stepIdx && stepIdx < 3) {
        stepIdx = Math.floor(p / 25);
      }
      if (p >= 100) {
        p = 100;
        clearInterval(timer);
        setTimeout(() => {
          generatePackage(projectId, selectedTypes);
          setGenerating(false);
          setGenProgress(0);
        }, 500);
      }
      setGenProgress(p);
    }, 180);
  };

  return (
    <div style={{ padding: '20px 0' }}>
      <Card title="⚡ 快速预设" size="small" style={{ marginBottom: 16, borderRadius: 12 }} className="fade-in-card">
        <Space wrap size="middle">
          {presets.map(p => (
            <span
              key={p.name}
              className={`package-tag ${activePreset === p.name ? 'active' : ''}`}
              onClick={() => handlePresetClick(p)}
              style={{ minWidth: 120, textAlign: 'center' }}
            >
              <div style={{ fontSize: 18, marginBottom: 4 }}>{p.icon}</div>
              <div style={{ fontWeight: 600 }}>{p.name}</div>
              <div style={{ fontSize: 11, color: '#999', marginTop: 2 }}>{p.desc}</div>
            </span>
          ))}
        </Space>
      </Card>

      <Card
        title="📋 选择材料"
        size="small"
        style={{ marginBottom: 16, borderRadius: 12 }}
        className="fade-in-card"
        extra={
          <span style={{ color: '#888' }}>
            已选 <b style={{ color: '#1890ff', fontSize: 16 }}>{selectedTypes.length}</b> 种
          </span>
        }
      >
        {deliveryFiles.length === 0 ? (
          <Empty description="暂无最终版材料，请先在材料库中设置最终版" />
        ) : (
          <Checkbox.Group value={selectedTypes} onChange={(vals) => { setSelectedTypes(vals); setActivePreset(null); }} style={{ width: '100%' }}>
            <Row gutter={[12, 12]}>
              {deliveryFiles.map(d => (
                <Col span={8} key={d.type}>
                  <div style={{
                    padding: '12px 16px',
                    border: selectedTypes.includes(d.type) ? '2px solid #1890ff' : '1px solid #e8e8e8',
                    borderRadius: 8,
                    background: selectedTypes.includes(d.type) ? '#f0f7ff' : '#fff',
                    transition: 'all 0.2s',
                    cursor: 'pointer',
                  }}
                  onClick={() => {
                    if (selectedTypes.includes(d.type)) {
                      setSelectedTypes(selectedTypes.filter(t => t !== d.type));
                    } else {
                      setSelectedTypes([...selectedTypes, d.type]);
                    }
                    setActivePreset(null);
                  }}
                  >
                    <Space direction="vertical" size={4} style={{ width: '100%' }}>
                      <Checkbox checked={selectedTypes.includes(d.type)} onClick={e => e.stopPropagation()}>
                        <b>{d.label}</b>
                      </Checkbox>
                      <Tag color="green" style={{ margin: 0 }}>有最终版</Tag>
                    </Space>
                  </div>
                </Col>
              ))}
            </Row>
          </Checkbox.Group>
        )}
      </Card>

      <Card size="small" style={{ marginBottom: 20, borderRadius: 12 }} className="fade-in-card">
        <Space wrap size="middle" align="center">
          <Button
            type="primary"
            icon={<FileSyncOutlined />}
            loading={generating}
            onClick={handleGenerate}
            size="large"
            className="btn-hover-lift"
            disabled={deliveryFiles.length === 0}
          >
            {generating ? '正在生成...' : '生成交付包'}
          </Button>
          <Tooltip title="将当前选择保存为自定义预设">
            <Button icon={<SaveOutlined />} size="large" onClick={() => message.success('预设已保存（Demo模拟）')}>
              保存为预设
            </Button>
          </Tooltip>
          {generating && (
            <div style={{ minWidth: 280 }}>
              <Progress percent={genProgress} size="small" status="active" />
              <div style={{ textAlign: 'center', color: '#1890ff', fontSize: 12, marginTop: 4 }}>
                {genProgress < 25 ? '正在收集材料...' :
                 genProgress < 50 ? '正在整理文件...' :
                 genProgress < 75 ? '正在打包压缩...' : '正在生成清单...'}
              </div>
            </div>
          )}
        </Space>
      </Card>

      <Card title="📦 历史交付包" size="small" style={{ borderRadius: 12 }} className="fade-in-card">
        {packages.length === 0 ? (
          <Empty description="暂无交付包，选择材料后点击「生成交付包」" />
        ) : (
          <List
            dataSource={packages}
            renderItem={p => (
              <List.Item
                style={{ padding: '16px 0', borderBottom: '1px solid #f0f0f0' }}
                className="fade-in-card"
                actions={[
                  <Tooltip title="下载交付包">
                    <Button type="link" size="small" icon={<DownloadOutlined />} onClick={() => message.success('开始下载（Demo模拟）')}>下载</Button>
                  </Tooltip>,
                  <Tooltip title="查看包内文件">
                    <Button type="link" size="small" icon={<EyeOutlined />} onClick={() => message.info('查看详情（Demo模拟）')}>查看</Button>
                  </Tooltip>,
                  <Popconfirm title="删除此交付包？" onConfirm={() => deletePackage(projectId, p.id)}>
                    <Button type="link" size="small" danger>删除</Button>
                  </Popconfirm>,
                ]}
              >
                <List.Item.Meta
                  avatar={
                    <div style={{
                      width: 48, height: 48,
                      background: 'linear-gradient(135deg, #667eea, #764ba2)',
                      borderRadius: 10,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: '#fff',
                    }}>
                      <FileSyncOutlined style={{ fontSize: 20 }} />
                    </div>
                  }
                  title={
                    <Space size="middle">
                      <span style={{ fontWeight: 600, fontSize: 15 }}>{p.package_name}</span>
                      <Tag color="green">{p.file_count} 个文件</Tag>
                    </Space>
                  }
                  description={
                    <Space size="large" style={{ color: '#888', fontSize: 13, marginTop: 6 }} wrap>
                      <span><UserOutlined style={{ marginRight: 4 }} /> {p.generated_by}</span>
                      <span><ClockCircleOutlined style={{ marginRight: 4 }} /> {p.generated_at}</span>
                      <span>{p.file_size}</span>
                    </Space>
                  }
                />
              </List.Item>
            )}
          />
        )}
      </Card>
    </div>
  );
};

      newPerms[permKey] = true;
    }
    setRolePermissions(newPerms);
  };

  const hasPermission = (permKey) => !!rolePermissions[permKey];

  const allPermissions = PERMISSION_CATEGORIES.flatMap(c => c.permissions);
  const grantedCount = Object.keys(rolePermissions).length;
  const totalCount = allPermissions.length;
  const progress = Math.round((grantedCount / totalCount) * 100);

  return (
    <div>
      <div className="page-header">
        <div className="page-title">🔐 权限管理</div>
        <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
          <span style={{ color: '#888', fontSize: 14 }}>管理系统用户和角色权限</span>
          <Button type="primary" icon={<PlusOutlined />} onClick={() => message.success('新增用户（Demo模拟）')}>新增用户</Button>
        </div>
      </div>

      <Tabs activeKey={activeTab} onChange={setActiveTab} style={{ marginBottom: 20 }}>
        <TabPane tab={<span><UserOutlined /> 用户管理</span>} key="users">
          <Card size="small" style={{ borderRadius: 12 }} className="fade-in-card">
            <Table
              size="small"
              dataSource={MOCK_USERS}
              rowKey="id"
              pagination={false}
              onRow={(record) => ({
                onClick: () => handleUserClick(record),
                style: { cursor: 'pointer' },
              })}
              columns={[
                {
                  title: '用户信息', dataIndex: 'name',
                  render: (t, r) => (
                    <div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2 }}>
                        <Avatar size="small" style={{ backgroundColor: '#667eea' }} icon={<UserOutlined />} />
                        <span style={{ fontWeight: 500 }}>{t}</span>
                        <Tag color={r.role === '负责人' ? 'red' : r.role === '指导老师' ? 'purple' : 'blue'} style={{ margin: 0 }}>{r.role}</Tag>
                      </div>
                      <div style={{ color: '#999', fontSize: 12, paddingLeft: 36 }}>{r.email}</div>
                    </div>
                  ),
                },
                { title: '所属项目', dataIndex: 'project_count', width: 120, render: v => <span>{v} 个项目</span> },
                { title: '状态', width: 100, render: () => <Tag color="green">正常</Tag> },
                { title: '最后登录', width: 160, render: () => <span style={{ color: '#999' }}>2026-07-09 10:30</span> },
              ]}
            />
          </Card>
        </TabPane>

        <TabPane tab={<span><TeamOutlined /> 角色管理</span>} key="roles">
          <Row gutter={16}>
            {ROLES.map(role => (
              <Col span={6} key={role.id}>
                <Card
                  size="small"
                  className="fade-in-card"
                  style={{ borderRadius: 12, cursor: 'pointer', transition: 'all 0.3s' }}
                  hoverable
                  onClick={() => handleRoleClick(role)}
                  bodyStyle={{ padding: '20px' }}
                >
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
                    <div style={{ width: 44, height: 44, borderRadius: 10, background: role.bgColor, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <TeamOutlined style={{ fontSize: 20, color: role.textColor }} />
                    </div>
                    <div>
                      <div style={{ fontWeight: 600 }}>{role.name}</div>
                      <div style={{ color: '#999', fontSize: 12 }}>{role.desc}</div>
                    </div>
                  </div>
                  <div>
                    <div style={{ color: '#999', fontSize: 12, marginBottom: 6 }}>权限覆盖度</div>
                    <Progress
                      percent={Math.round((DEFAULT_PERMISSIONS[role.id].length / totalCount) * 100)}
                      strokeColor={role.textColor}
                      size="small"
                    />
                    <div style={{ textAlign: 'right', color: '#666', fontSize: 12, marginTop: 4 }}>
                      {DEFAULT_PERMISSIONS[role.id].length} / {totalCount} 项
                    </div>
                  </div>
                </Card>
              </Col>
            ))}
          </Row>
        </TabPane>

        <TabPane tab={<span><SettingOutlined /> 权限矩阵</span>} key="matrix">
          <Card size="small" style={{ borderRadius: 12 }} className="fade-in-card">
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: '#fafafa' }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', borderBottom: '2px solid #f0f0f0', fontWeight: 600 }}>权限项</th>
                    {ROLES.map(role => (
                      <th key={role.id} style={{ padding: '12px 16px', textAlign: 'center', borderBottom: '2px solid #f0f0f0', fontWeight: 600 }}>
                        <Tag color={role.color}>{role.name}</Tag>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {PERMISSION_CATEGORIES.map((cat, catIdx) => (
                    <React.Fragment key={catIdx}>
                      <tr>
                        <td colSpan={ROLES.length + 1} style={{ padding: '8px 16px', background: '#f5f5f5', fontWeight: 600, color: '#666' }}>
                          {cat.name}
                        </td>
                      </tr>
                      {cat.permissions.map(perm => (
                        <tr key={perm.key} style={{ borderBottom: '1px solid #f0f0f0', transition: 'background 0.2s' }}>
                          <td style={{ padding: '10px 16px' }}>
                            <div style={{ fontWeight: 500 }}>{perm.label}</div>
                            <div style={{ color: '#999', fontSize: 12, marginTop: 2 }}>{perm.desc}</div>
                          </td>
                          {ROLES.map(role => (
                            <td key={role.id} style={{ padding: '10px 16px', textAlign: 'center' }}>
                              {DEFAULT_PERMISSIONS[role.id].includes(perm.key) ? (
                                <CheckCircleOutlined style={{ color: '#52c41a', fontSize: 18 }} />
                              ) : (
                                <span style={{ color: '#ddd', fontSize: 18 }}>—</span>
                              )}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </React.Fragment>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </TabPane>
      </Tabs>

      <Modal
        title={`${selectedUser ? `编辑 ${selectedUser.name} 的权限` : `编辑「${selectedRole ? ROLES.find(r => r.id === selectedRole)?.name : ''}」角色权限`}`}
        open={permissionModal}
        onCancel={() => setPermissionModal(false)}
        footer={[
          <Button key="reset" onClick={() => {
            setRolePermissions({ ...DEFAULT_PERMISSIONS[selectedRole] });
            message.info('已重置为默认权限');
          }}>重置默认</Button>,
          <Button key="save" type="primary" onClick={() => {
            setPermissionModal(false);
            message.success('权限设置已保存（Demo模拟）');
          }}>保存权限</Button>,
        ]}
        width={700}
      >
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 8 }}>
            <span style={{ color: '#666', fontSize: 14 }}>权限覆盖度</span>
            <span style={{ fontWeight: 600, color: progress >= 80 ? '#52c41a' : progress >= 50 ? '#1890ff' : '#fa8c16' }}>{progress}%</span>
          </div>
          <Progress
            percent={progress}
            strokeColor={{
              '0%': '#1890ff',
              '100%': '#52c41a',
            }}
          />
          <div style={{ textAlign: 'right', color: '#999', fontSize: 12, marginTop: 4 }}>
            已授予 <b style={{ color: '#1890ff' }}>{grantedCount}</b> 项 / 共 {totalCount} 项权限
          </div>
        </div>

        {PERMISSION_CATEGORIES.map((cat, catIdx) => (
          <div key={catIdx} style={{ marginBottom: 24 }}>
            <div style={{ fontWeight: 600, color: '#333', marginBottom: 12, paddingLeft: 8, borderLeft: '3px solid #1890ff' }}>
              {cat.name}
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12 }}>
              {cat.permissions.map(perm => (
                <div
                  key={perm.key}
                  onClick={() => togglePermission(perm.key)}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: 8,
                    padding: '10px 16px',
                    borderRadius: 8,
                    border: `2px solid ${hasPermission(perm.key) ? '#1890ff' : '#e8e8e8'}`,
                    background: hasPermission(perm.key) ? '#e6f7ff' : '#fff',
                    cursor: 'pointer',
                    transition: 'all 0.2s',
                    minWidth: 200,
                  }}
                  className="btn-hover-lift"
                >
                  <Checkbox
                    checked={hasPermission(perm.key)}
                    onChange={() => togglePermission(perm.key)}
                  />
                  <div>
                    <div style={{ fontWeight: 500, color: hasPermission(perm.key) ? '#1890ff' : '#333' }}>{perm.label}</div>
                    <div style={{ color: '#999', fontSize: 11 }}>{perm.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </Modal>
    </div>
  );
};

// ========== 系统设置 ==========

  return (
    <div>
      <div className="page-title" style={{ marginBottom: 20 }}>系统设置</div>
      <Card
        size="small"
        style={{ marginBottom: 16, borderRadius: 12 }}
        title="📂 材料类型管理"
        extra={<Button type="primary" size="small" icon={<PlusOutlined />} onClick={() => message.success('Demo版本：新增类型仅演示')}>添加类型</Button>}

      <Card

          </Col>
          <Col span={8}>
            <Button type="default" block icon={<CopyOutlined />} onClick={() => message.success('配置已备份（Demo模拟）')}>

            </Button>

            <Button type="default" block icon={<ReloadOutlined />} onClick={() => message.success('缓存已清理（Demo模拟）')}>

      </Card>
      <div style={{ marginTop: 32, textAlign: 'center', color: '#bbb', fontSize: 13 }}>

      </div>
    </div>
  );
};

// ========== 路由渲染 ==========
const AppRouter = () => {
  const { route } = useContext(RouterContext);
  const { currentUser } = useContext(AppContext);

  if (!currentUser && route.path !== '/login') {
    return <LoginPage />;
  }

  if (route.path === '/login') {
    return <LoginPage />;
  }

  let activeKey = '/dashboard';
  let content = null;

  if (route.path === '/dashboard') {
    activeKey = '/dashboard';
    content = <Dashboard />;
  } else if (route.path === '/projects') {
    activeKey = '/projects';
    content = <ProjectList />;
  } else if (route.path.startsWith('/projects/')) {
    activeKey = '/projects';
    content = <ProjectDetail />;
  } else if (route.path === '/permissions') {
    activeKey = '/permissions';
    content = <PermissionManagement />;
  } else if (route.path === '/settings') {
    activeKey = '/settings';
    content = <SettingsPage />;
  } else {
    activeKey = '/dashboard';
    content = <Dashboard />;
  }

  return <MainLayout activeKey={activeKey}>{content}</MainLayout>;
};

// ========== 主应用 ==========
const App = () => (
  <antd.ConfigProvider
    theme={{
      token: {
        colorPrimary: '#1890ff',
        borderRadius: 8,
      },
    }}
  >
    <RouterProvider>
      <AppProvider>
        <AppRouter />
      </AppProvider>
    </RouterProvider>
  </antd.ConfigProvider>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
