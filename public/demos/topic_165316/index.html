// 关键词匹配
// ============================================================================
function normalize(str) {
  return str.toLowerCase().replace(/\s/g, "").replace(/，/g,",").replace(/。/g,".").replace(/\(/g,"").replace(/\)/g,"").replace(/（/g,"").replace(/）/g,"");
}

function matchStep(text) {
  const q = QUESTIONS[currentQ];
  const norm = normalize(text);
  // 从当前步骤开始往后找（不回退），找出匹配关键词最多的步骤
  let bestIdx = -1;
  let bestCount = 0;
  for (let i = currentStep; i < q.steps.length; i++) {
    const kws = q.steps[i].keywords;
    let count = 0;
    kws.forEach(function(kw) {
      if (norm.includes(normalize(kw))) count++;
    });
    // 需要至少匹配一个关键词，且匹配数最多
    if (count > bestCount) {
      bestCount = count;
      bestIdx = i;
    }
  }
  return bestIdx;
}

function handleSend(e) {
  e.preventDefault();
  if (isDone || isTyping) return;
  const input = document.getElementById("inputBox");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  processInput(text, false);
}

function handleHelp() {
  if (isDone || isTyping) return;
  processInput("", true);
}

function processInput(text, isHelp) {
  if (!isHelp) addMessage("student", text);
  showTyping();
  document.getElementById("inputBox").disabled = true;
  document.getElementById("sendBtn").disabled = true;
  document.getElementById("helpBtn").disabled = true;

  setTimeout(function() {
    removeTyping();
    const q = QUESTIONS[currentQ];

    if (isHelp) {
      const level = Math.min(helpCount, 2);
      const hints = HELP_HINTS[level];
      const hint = hints[currentQ % hints.length];
      addMessage("assistant", hint);
      helpCount++;
      if (level === 1 && q.knowledgePoints.length > 0) {
        showKnowledgeCard(q.knowledgePoints);
      }
    } else {
      // 先尝试正常匹配步骤
      const matchedIdx = matchStep(text);

      if (matchedIdx >= 0) {
        // 匹配成功，正常推进
        const unlockTo = Math.min(matchedIdx + 1, q.steps.length);
        const isLast = unlockTo >= q.steps.length;
        currentStep = unlockTo;
        helpCount = 0;
        clearKnowledgeCard();

        if (isLast) {
          isDone = true;
          addMessage("assistant", q.review);
          document.getElementById("demoBtn").style.display = "none";
          document.getElementById("inputRow").style.display = "none";
          if (currentQ < QUESTIONS.length - 1) {
            document.getElementById("nextBtn").classList.add("show");
          } else {
            document.getElementById("allDone").classList.add("show");
          }
        } else {
          addMessage("assistant", q.steps[matchedIdx].ai);
        }
      } else {
        // 没匹配到中间步骤，检查是否是在很早的步骤直接给出了最终答案
        const finalKws = q.steps[q.steps.length - 1].keywords;
        const norm = normalize(text);
        const isFinalAnswer = currentStep <= 1 && finalKws.some(function(kw) {
          // 最终答案关键词必须有一定长度（避免单个数字/字符误匹配）
          return kw.length >= 3 && norm.includes(normalize(kw));
        });

        if (isFinalAnswer) {
          addMessage("assistant", "答案数字是对的，不过咱们得从头理一遍推导过程，不然下次遇到类似题还是会卡。咱们从第一个条件开始，题目给了什么关键条件？看到它你想到什么？");
          helpCount = 0;
        } else {
          const hints = [
            "方向好像偏了一点，回到当前这一步来，我们现在在解决什么问题？",
            "这个思路可以先放一放，先聚焦当前步骤——看看板书上已有的内容，下一步该做什么？",
            "我们一步一步来，现在还没到那一步。先看看目前已经得到了什么，接下来最自然的一步是什么？"
          ];
          addMessage("assistant", hints[Math.floor(Math.random()*hints.length)]);
        }
      }
    }

    renderBoard();
    renderTabs();
    document.getElementById("inputBox").disabled = isDone;
    document.getElementById("sendBtn").disabled = isDone;
    document.getElementById("helpBtn").disabled = isDone;
    if (!isDone) document.getElementById("inputBox").focus();
  }, 800 + Math.random()*600);
}

function showKnowledgeCard(points) {
  const boardContent = document.getElementById("boardContent");
  const old = boardContent.querySelector(".knowledge-card");
  if (old) old.remove();

  const card = document.createElement("div");
  card.className = "knowledge-card";
  card.id = "knowledgeCard";
  card.innerHTML = '<div class="knowledge-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>知识点回顾</span></div><div class="knowledge-content">' + points.map(function(p){return "• " + p;}).join("<br>") + '</div>';

  const emptyState = boardContent.querySelector(".empty-state");
  if (emptyState) {
    emptyState.insertAdjacentElement("afterend", card);
  } else {
    boardContent.insertBefore(card, boardContent.firstChild);
  }
}

function clearKnowledgeCard() {
  const card = document.getElementById("knowledgeCard");
  if (card) card.remove();
}

function nextStep() {
  if (currentQ < QUESTIONS.length - 1) {
    switchQuestion(currentQ + 1);
  }
}

// 自动演示
// ============================================================================
const DEMO_INPUTS = [
  // Q1 演示输入 - 每一步都精确对应
  ["因为b和b-4a垂直，所以数量积b·(b-4a)=0", "b-4a的坐标是(2,x-4)", "列方程，数量积：2*2+x(x-4)=0", "展开化简得4+x²-4x=0，(x-2)²=0完全平方", "x=2"],
  // Q2
  ["D在AB上，BD=2DA，所以AD:AB=1:3即AD=1/3AB", "向量AD=CD-CA=n-m，向量减法", "AB=3AD=3(n-m)=3n-3m", "CB=CA+AB=m+3(n-m)=-2m+3n"],
  // Q3
  ["因为(b-2a)和b垂直，所以数量积(b-2a)·b=0", "展开得|b|²-2a·b=0，所以a·b=|b|²/2", "|a+2b|=2，两边平方模长平方|a+2b|²=4", "展开后代入|a|=1和a·b=|b|²/2，得1+6|b|²=4", "6|b|²=3，|b|=√2/2"],
  // Q4
  ["在平行四边形中，设AB=a，AD=b作为基底", "AC=a+b，E是中点所以BE=-a+1/2b", "设AF=tAC=a+sBE，由系数相等解得t=1/3三等分点", "DF=DA+AF=-b+1/3(a+b)=1/3a-2/3b"]
];

function startAutoDemo() {
  if (isDone || isTyping) return;
  if (currentStep > 0 || chatHistory.length > 0) {
    switchQuestion(currentQ);
  }

  const btn = document.getElementById("demoBtn");
  btn.disabled = true;
  btn.textContent = "演示中...";

  const inputs = DEMO_INPUTS[currentQ];
  let idx = 0;

  function runNext() {
    if (idx >= inputs.length) {
      btn.textContent = "▶ 自动演示完整流程";
      btn.disabled = false;
      return;
    }
    const checkDone = function() {
      if (!isTyping && !isDone) {
        autoDemoTimer = setTimeout(function() {
          processInput(inputs[idx], false);
          idx++;
          autoDemoTimer = setTimeout(runNext, 2500);
        }, 800);
      } else if (isDone) {
        btn.textContent = "▶ 自动演示完整流程";
        btn.disabled = false;
        if (currentQ < QUESTIONS.length - 1) {
          autoDemoTimer = setTimeout(function() {
            nextStep();
            autoDemoTimer = setTimeout(function() { startAutoDemo(); }, 1500);
          }, 3000);
        }
      } else {
        autoDemoTimer = setTimeout(checkDone, 500);
      }
    };
    checkDone();
  }

  autoDemoTimer = setTimeout(runNext, 500);
}

// ============================================================================
// 初始化
// ============================================================================
document.addEventListener("DOMContentLoaded", function() {
  switchQuestion(0);
});
