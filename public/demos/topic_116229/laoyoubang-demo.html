          { type: 'ai', text: '⚠️ 这很可能是诈骗短信！\n\n官方医保部门不会通过短信发送链接要求操作。这类短信常见特征：\n· 冒充官方机构\n· 制造紧迫感（"即将停用"）\n· 要求点击不明链接\n\n建议您：不要点击链接！可直接拨打 12333 社保热线核实。', hasResult: true, resultTitle: '风险提醒：疑似诈骗', resultContent: '不要点击链接！\n拨打 12333 核实', resultMeta: '已同步通知子女微信' }

    let currentScenario = 'notice';
    let isListening = false;
    let demoIndex = 0;
    let demoTimer = null;

    function loadScenario(key) {
      currentScenario = key;
      const s = scenarios[key];

      document.querySelectorAll('.scenario-tabs button').forEach((btn, i) => {
        btn.classList.toggle('active', Object.keys(scenarios)[i] === key);
      });

      document.getElementById('infoTitle').textContent = s.infoTitle;
      document.getElementById('infoDesc').textContent = s.infoDesc;

      const qaContainer = document.getElementById('quickActions');
      qaContainer.innerHTML = '';
      s.quickActions.forEach(text => {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.onclick = () => sendQuick(text);
        qaContainer.appendChild(btn);
      });

      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = '<div class="message ai">您好！我是社区小助手，您可以直接说话问我问题~</div>';
      demoIndex = 0;
      if (demoTimer) clearTimeout(demoTimer);
    }

    function sendQuick(text) {
      addMessage('user', text);
      runDemoFlow();
    }

    function toggleVoice() {
      const btn = document.getElementById('voiceBtn');
      const wave = document.getElementById('voiceWave');
      const label = document.getElementById('voiceLabel');

      if (isListening) {
        isListening = false;
        btn.classList.remove('listening');
        wave.style.display = 'none';
        label.textContent = '按住说话';
      } else {
        isListening = true;
        btn.classList.add('listening');
        wave.style.display = 'flex';
        label.textContent = '正在听...';

        setTimeout(() => {
          if (isListening) {
            toggleVoice();
            const s = scenarios[currentScenario];
            addMessage('user', s.demoFlow[0].text);
            runDemoFlow();
          }
        }, 2000);
      }
    }

    function addMessage(type, text, hasResult, resultTitle, resultContent, resultMeta) {
      const chatArea = document.getElementById('chatArea');
      const msg = document.createElement('div');
      msg.className = 'message ' + type;

      let contentHtml = '';
      if (hasResult) {
        contentHtml = text.replace(/\n/g, '<br>') +
          '<div class="result-card">' +
          '<h4>' + resultTitle + '</h4>' +
          '<p>' + resultContent.replace(/\n/g, '<br>') + '</p>' +
          '<div class="meta">' + resultMeta + '</div>' +
          '</div>';
      } else {
        contentHtml = text.replace(/\n/g, '<br>');
      }

      // Add speak button for AI messages
      if (type === 'ai') {
        const plainText = text.replace(/\n/g, ' ');
        contentHtml += '<div class="msg-actions">' +
          '<button onclick="speak(this, \'' + plainText.replace(/'/g, "\\'") + '\')">' +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>' +
          '播报' +
          '</button>' +
          '</div>';
      }

      msg.innerHTML = contentHtml;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function runDemoFlow() {
      const s = scenarios[currentScenario];
      demoIndex = 1;

      function next() {
        if (demoIndex >= s.demoFlow.length) return;
        const step = s.demoFlow[demoIndex];

        if (step.type === 'typing') {
          addMessage('typing', step.text);
          demoTimer = setTimeout(() => {
            const chatArea = document.getElementById('chatArea');
            const typingMsg = chatArea.querySelector('.message.typing');
            if (typingMsg) typingMsg.remove();
            demoIndex++;
            next();
          }, 1500);
        } else {
          addMessage(step.type, step.text, step.hasResult, step.resultTitle, step.resultContent, step.resultMeta);
          demoIndex++;
          if (demoIndex < s.demoFlow.length) {
            demoTimer = setTimeout(next, 800);
          }
        }
      }

      demoTimer = setTimeout(next, 600);
    }

    /* ========== VOICE SPEAK ========== */
    let currentUtterance = null;
    let speakingMsgBtn = null;

    function speak(btn, text) {
      if (!window.speechSynthesis) {
        alert('您的浏览器不支持语音播报功能');
        return;
      }

      // Stop current speech if any
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        if (speakingMsgBtn && speakingMsgBtn !== btn) {
          speakingMsgBtn.classList.remove('speaking');
          speakingMsgBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>播报';
        }
        if (speakingMsgBtn === btn) {
          speakingMsgBtn = null;
          return;
        }
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.9;
      utterance.pitch = 1.05;
      utterance.volume = 1;

      utterance.onstart = function() {
        btn.classList.add('speaking');
        btn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>播放中';
        speakingMsgBtn = btn;
      };

      utterance.onend = function() {
        btn.classList.remove('speaking');
        btn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>播报';
        speakingMsgBtn = null;
      };

      utterance.onerror = function() {
        btn.classList.remove('speaking');
        btn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>播报';
        speakingMsgBtn = null;
      };

      currentUtterance = utterance;
      window.speechSynthesis.speak(utterance);
    }

    /* ========== TEXT INPUT ========== */
    function handleKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendText();
      }
    }

    function sendText() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      addMessage('user', text);
      matchAndReply(text);
    }

        { keywords: ['你好', '您好', 'hi', 'hello', '嗨', '在吗', '有人吗', 'hello', '早上好', '下午好', '晚上好'], reply: { type: 'typing', text: '您好！很高兴为您服务~' }, reply2: { type: 'ai', text: '您好！我是社区小助手，您可以直接问我问题。比如：\n\n• 这周有什么活动？\n• 办老年证要带什么？\n• 帮我看看这条短信\n• 我想报名义诊\n• 养老金怎么认证？' } },

        { keywords: ['老年', '老人', '社区', '服务', '终端', '小助手'], reply: { type: 'typing', text: '正在了解您的需求...' }, reply2: { type: 'ai', text: '我是"老有帮"社区 AI 助手，可以帮您查通知、报名活动、查询办事指南、识别诈骗短信等。您可以直接告诉我您想做什么，或者点击上方场景标签体验不同功能。' } },
