<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>禅定模式</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;600&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #0a0e14;
    --accent: #c9a96e;
    --accent-r: 201; --accent-g: 169; --accent-b: 110;
    --accent-dim: rgba(201, 169, 110, 0.25);
    --text-primary: #e8e0d4;
    --text-muted: rgba(232, 224, 212, 0.45);
    --glow: rgba(201, 169, 110, 0.12);
    --atm-1: rgba(201,169,110,0.06);
    --atm-2: rgba(80,60,40,0.08);
    --atm-3: rgba(40,50,80,0.06);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Noto Serif SC', serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    transition: background 0.8s ease;
  }

  .atmosphere {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    transition: background 0.8s ease;
    background:
      radial-gradient(ellipse 60% 50% at 50% 45%, var(--atm-1) 0%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 30% 70%, var(--atm-2) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 75% 25%, var(--atm-3) 0%, transparent 60%);
  }

  .particles-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ── 通用屏幕 ── */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }
  .screen.visible { opacity: 1; pointer-events: auto; transform: scale(1); }

  /* ── 通用按钮 ── */
  .btn-outline {
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.3em;
    padding: 16px 56px;
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  .btn-outline::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--glow), transparent);
    opacity: 0; transition: opacity 0.4s ease;
  }
  .btn-outline:hover { border-color: var(--accent); box-shadow: 0 0 40px var(--glow); }
  .btn-outline:hover::before { opacity: 1; }

  /* ── 主题选择器 ── */
  .theme-picker {
    margin-bottom: 36px;
    opacity: 0; animation: fadeUp 1s 1.3s ease forwards;
    text-align: center;
  }
  .theme-picker-label {
    font-size: 11px; font-weight: 200; color: var(--text-muted);
    letter-spacing: 0.2em; margin-bottom: 12px; transition: color 0.5s ease;
  }
  .theme-dots { display: flex; gap: 16px; align-items: center; justify-content: center; }
  .theme-dot {
    width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 2px solid transparent;
  }
  .theme-dot:hover { transform: scale(1.15); }
  .theme-dot.active {
    border-color: var(--accent); box-shadow: 0 0 16px var(--glow); transform: scale(1.15);
  }
  .theme-dot::after {
    content: attr(data-name); position: absolute; bottom: -18px; left: 50%;
    transform: translateX(-50%); font-size: 9px; font-weight: 200;
    color: var(--text-muted); letter-spacing: 0.1em; white-space: nowrap;
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  .theme-dot:hover::after, .theme-dot.active::after { opacity: 1; }
  .dot-zen { background: radial-gradient(circle at 40% 35%, #dfc088, #a08040); }
  .dot-aurora { background: radial-gradient(circle at 40% 35%, #6ef5c4, #1a8a60); }
  .dot-sakura { background: radial-gradient(circle at 40% 35%, #f5a0b8, #c05070); }
  .dot-cosmos { background: radial-gradient(circle at 40% 35%, #70a8f0, #3050a0); }
  .dot-lava { background: radial-gradient(circle at 40% 35%, #f08040, #c03010); }
  .dot-frost { background: radial-gradient(circle at 40% 35%, #c0d8e8, #6080a0); }

  /* ── 模式选择器 ── */
  .mode-picker {
    margin-bottom: 36px;
    opacity: 0; animation: fadeUp 1s 0.9s ease forwards;
    text-align: center;
  }
  .mode-picker-label {
    font-size: 11px; font-weight: 200; color: var(--text-muted);
    letter-spacing: 0.2em; margin-bottom: 12px; transition: color 0.5s ease;
  }
  .mode-tabs {
    display: flex; gap: 6px; align-items: center; justify-content: center;
  }
  .mode-tab {
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px; font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    transition: all 0.3s ease;
    border: 1px solid transparent;
    user-select: none;
  }
  .mode-tab:hover { color: var(--text-primary); }
  .mode-tab.active {
    color: var(--accent);
    border-color: var(--accent-dim);
    background: rgba(255,255,255,0.02);
  }

  /* ── 模式设置面板 ── */
  .mode-settings {
    margin-bottom: 36px;
    min-height: 80px;
    opacity: 0; animation: fadeUp 1s 1.1s ease forwards;
    text-align: center;
  }
  .mode-settings-inner {
    display: none; flex-direction: column; align-items: center; gap: 12px;
  }
  .mode-settings-inner.active { display: flex; }
  .setting-row {
    display: flex; align-items: center; gap: 10px; justify-content: center;
  }
  .setting-label {
    font-size: 12px; font-weight: 200; color: var(--text-muted);
    letter-spacing: 0.1em; min-width: 50px;
  }
  .setting-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--accent-dim);
    background: transparent; color: var(--accent);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease; font-family: inherit;
    line-height: 1;
  }
  .setting-btn:hover { border-color: var(--accent); background: rgba(255,255,255,0.03); }
  .setting-value {
    font-size: 20px; font-weight: 200; color: var(--text-primary);
    min-width: 36px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .setting-unit {
    font-size: 12px; font-weight: 200; color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  /* ── 开始屏幕 ── */
  #start-screen { text-align: center; padding-bottom: 30px; }
  .zen-logo {
    width: 90px; height: 90px; margin-bottom: 32px;
    opacity: 0; animation: fadeUp 1s 0.3s ease forwards;
  }
  .zen-logo svg { width: 100%; height: 100%; }
  .start-title {
    font-size: clamp(26px, 5vw, 44px); font-weight: 300;
    letter-spacing: 0.2em; color: var(--text-primary);
    opacity: 0; animation: fadeUp 1s 0.5s ease forwards;
    margin-bottom: 10px; transition: color 0.5s ease;
  }
  .start-subtitle {
    font-size: clamp(12px, 2vw, 15px); font-weight: 200;
    color: var(--text-muted); letter-spacing: 0.15em;
    opacity: 0; animation: fadeUp 1s 0.7s ease forwards;
    margin-bottom: 32px; transition: color 0.5s ease;
  }
  .start-btn {
    opacity: 0; animation: fadeUp 1s 1.5s ease forwards;
  }

  /* ── 禅定屏幕 ── */
  #zen-screen { cursor: pointer; user-select: none; -webkit-user-select: none; }
  .zen-icon-wrapper {
    position: relative; width: 160px; height: 160px; margin-bottom: 50px;
  }
  .zen-icon-ring {
    position: absolute; inset: -10px; border-radius: 50%;
    border: 1px solid var(--accent-dim);
    animation: breatheRing 6s ease-in-out infinite;
    transition: border-color 0.8s ease;
  }
  .zen-icon-ring:nth-child(2) { inset: -24px; animation-delay: 1s; opacity: 0.6; }
  .zen-icon-ring:nth-child(3) { inset: -40px; animation-delay: 2s; opacity: 0.3; }
  .zen-icon-svg {
    width: 160px; height: 160px;
    animation: breathe 6s ease-in-out infinite;
    filter: drop-shadow(0 0 30px var(--glow));
    transition: filter 0.8s ease;
  }
  .zen-timer {
    font-size: clamp(48px, 10vw, 80px); font-weight: 200;
    letter-spacing: 0.08em; color: var(--text-primary);
    margin-bottom: 12px; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 60px var(--glow);
    transition: color 0.5s ease, text-shadow 0.8s ease;
  }
  .zen-mode-label {
    font-size: 13px; font-weight: 200; letter-spacing: 0.25em;
    color: var(--accent); margin-bottom: 4px; transition: color 0.5s ease;
  }
  .zen-label {
    font-size: 13px; font-weight: 200; letter-spacing: 0.25em;
    color: var(--text-muted); margin-bottom: 50px; transition: color 0.5s ease;
  }
  .zen-quote {
    font-size: clamp(14px, 2.5vw, 18px); font-weight: 200;
    color: var(--text-muted); letter-spacing: 0.12em;
    max-width: 500px; text-align: center; line-height: 1.8;
    min-height: 54px; transition: opacity 1s ease, color 0.5s ease;
  }
  .zen-quote.fading { opacity: 0; }

  /* 番茄钟轮次指示器 */
  .pomodoro-rounds {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .pomo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-dim);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  .pomo-dot.focused { background: var(--accent); box-shadow: 0 0 8px var(--glow); }
  .pomo-dot.done { background: var(--accent); opacity: 0.5; }

  /* ── 结束屏幕 ── */
  #end-screen { text-align: center; overflow-y: auto; max-height: 100vh; padding: 20px; }
  .end-icon { width: 80px; height: 80px; margin-bottom: 36px; opacity: 0; animation: fadeUp 0.8s 0.2s ease forwards; }
  .end-heading {
    font-size: clamp(22px, 4vw, 32px); font-weight: 300;
    letter-spacing: 0.15em; margin-bottom: 16px;
    opacity: 0; animation: fadeUp 0.8s 0.4s ease forwards;
  }
  .end-time {
    font-size: clamp(36px, 8vw, 64px); font-weight: 200;
    color: var(--accent); letter-spacing: 0.06em; margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
    opacity: 0; animation: fadeUp 0.8s 0.6s ease forwards;
    text-shadow: 0 0 40px var(--glow);
  }
  .end-detail {
    font-size: 14px; color: var(--text-muted); letter-spacing: 0.1em;
    margin-bottom: 12px;
    opacity: 0; animation: fadeUp 0.8s 0.7s ease forwards;
  }
  .end-pomo-summary {
    font-size: 13px; color: var(--text-muted); letter-spacing: 0.08em;
    margin-bottom: 36px; line-height: 1.8;
    opacity: 0; animation: fadeUp 0.8s 0.75s ease forwards;
  }
  .end-pomo-summary span { color: var(--accent); font-weight: 300; }
  .restart-btn {
    opacity: 0; animation: fadeUp 0.8s 0.9s ease forwards;
    font-size: 14px; letter-spacing: 0.25em; padding: 14px 48px;
  }

  /* ── 动画 ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.06); opacity: 1; }
  }
  @keyframes breatheRing {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.5; }
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .timer-pulse { animation: pulse 1.5s ease-in-out infinite; }

  /* ── 移动端适配 ── */
  @media (max-height: 700px) {
    .zen-logo { width: 70px; height: 70px; margin-bottom: 24px; }
    .start-title { margin-bottom: 8px; }
    .start-subtitle { margin-bottom: 20px; }
    .mode-picker { margin-bottom: 24px; }
    .mode-settings { margin-bottom: 24px; min-height: 60px; }
    .theme-picker { margin-bottom: 24px; }
    .zen-icon-wrapper { width: 120px; height: 120px; margin-bottom: 30px; }
    .zen-icon-svg { width: 120px; height: 120px; }
    .zen-timer { margin-bottom: 8px; }
    .zen-label { margin-bottom: 30px; }
  }
  @media (max-width: 480px) {
    .theme-dots { gap: 12px; }
    .theme-dot { width: 24px; height: 24px; }
    .mode-tab { padding: 6px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="atmosphere" id="atmosphere"></div>
<canvas class="particles-canvas" id="particles"></canvas>

<!-- 开始屏幕 -->
<div id="start-screen" class="screen visible">
  <div class="zen-logo">
    <svg id="start-icon" viewBox="0 0 100 100" fill="none"></svg>
  </div>
  <div class="start-title">禅 定 模 式</div>
  <div class="start-subtitle">静心 · 专注 · 觉察</div>

  <div class="mode-picker">
    <div class="mode-picker-label">禅定方式</div>
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="free">自由</div>
      <div class="mode-tab" data-mode="countdown">倒计时</div>
      <div class="mode-tab" data-mode="pomodoro">番茄钟</div>
    </div>
  </div>

  <div class="mode-settings">
    <!-- 倒计时设置 -->
    <div class="mode-settings-inner" id="settings-countdown">
      <div class="setting-row">
        <span class="setting-label">时长</span>
        <button class="setting-btn" data-action="cd-minus">-</button>
        <span class="setting-value" id="cd-value">25</span>
        <button class="setting-btn" data-action="cd-plus">+</button>
        <span class="setting-unit">分钟</span>
      </div>
    </div>
    <!-- 番茄钟设置 -->
    <div class="mode-settings-inner" id="settings-pomodoro">
      <div class="setting-row">
        <span class="setting-label">专注</span>
        <button class="setting-btn" data-action="focus-minus">-</button>
        <span class="setting-value" id="focus-value">25</span>
        <button class="setting-btn" data-action="focus-plus">+</button>
        <span class="setting-unit">分钟</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">休息</span>
        <button class="setting-btn" data-action="break-minus">-</button>
        <span class="setting-value" id="break-value">5</span>
        <button class="setting-btn" data-action="break-plus">+</button>
        <span class="setting-unit">分钟</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">轮次</span>
        <button class="setting-btn" data-action="rounds-minus">-</button>
        <span class="setting-value" id="rounds-value">4</span>
        <button class="setting-btn" data-action="rounds-plus">+</button>
        <span class="setting-unit">轮</span>
      </div>
    </div>
  </div>

  <div class="theme-picker">
    <div class="theme-picker-label">选择意境</div>
    <div class="theme-dots">
      <div class="theme-dot dot-zen active" data-theme="zen" data-name="夜禅"></div>
      <div class="theme-dot dot-aurora" data-theme="aurora" data-name="极光"></div>
      <div class="theme-dot dot-sakura" data-theme="sakura" data-name="樱落"></div>
      <div class="theme-dot dot-cosmos" data-theme="cosmos" data-name="星河"></div>
      <div class="theme-dot dot-lava" data-theme="lava" data-name="熔岩"></div>
      <div class="theme-dot dot-frost" data-theme="frost" data-name="霜降"></div>
    </div>
  </div>

  <button class="start-btn btn-outline" id="btn-start">开始禅定</button>
</div>

<!-- 禅定屏幕 -->
<div id="zen-screen" class="screen hidden">
  <div class="zen-icon-wrapper">
    <div class="zen-icon-ring"></div>
    <div class="zen-icon-ring"></div>
    <div class="zen-icon-ring"></div>
    <svg class="zen-icon-svg" id="zen-icon" viewBox="0 0 160 160" fill="none"></svg>
  </div>
  <div class="zen-mode-label" id="zen-mode-label"></div>
  <div class="zen-timer" id="zen-timer">00:00</div>
  <div class="pomodoro-rounds" id="pomodoro-rounds"></div>
  <div class="zen-label" id="zen-label">禅定中</div>
  <div class="zen-quote" id="zen-quote">深呼吸，放松身心...</div>
</div>

<!-- 结束屏幕 -->
<div id="end-screen" class="screen hidden">
  <div class="end-icon">
    <svg id="end-icon" viewBox="0 0 80 80" fill="none"></svg>
  </div>
  <div class="end-heading" id="end-heading">禅定结束</div>
  <div class="end-time" id="end-time">00:00</div>
  <div class="end-detail" id="end-detail"></div>
  <div class="end-pomo-summary" id="end-pomo-summary"></div>
  <button class="restart-btn btn-outline" id="btn-restart">再次禅定</button>
</div>

<script>
(function() {
  'use strict';

  /* ── 主题 ── */
  var themes = {
    zen:    { name:'夜禅', bg:'#0a0e14', accent:[201,169,110], textPrimary:'#e8e0d4', textMuted:'rgba(232,224,212,0.45)', atm:['rgba(201,169,110,0.06)','rgba(80,60,40,0.08)','rgba(40,50,80,0.06)'] },
    aurora: { name:'极光', bg:'#040e0a', accent:[100,230,180], textPrimary:'#d4ece2', textMuted:'rgba(180,230,210,0.4)', atm:['rgba(80,230,180,0.06)','rgba(30,100,80,0.08)','rgba(40,80,100,0.06)'] },
    sakura: { name:'樱落', bg:'#0e0808', accent:[235,140,170], textPrimary:'#ede0e4', textMuted:'rgba(235,200,210,0.4)', atm:['rgba(235,140,170,0.06)','rgba(100,50,70,0.08)','rgba(80,40,60,0.06)'] },
    cosmos: { name:'星河', bg:'#06080f', accent:[110,160,240], textPrimary:'#d8e0f0', textMuted:'rgba(200,210,235,0.4)', atm:['rgba(100,140,230,0.06)','rgba(50,60,120,0.1)','rgba(80,60,140,0.05)'] },
    lava:   { name:'熔岩', bg:'#0e0806', accent:[240,130,60],  textPrimary:'#f0e4d8', textMuted:'rgba(240,200,170,0.4)', atm:['rgba(240,120,50,0.06)','rgba(120,60,20,0.08)','rgba(100,40,20,0.06)'] },
    frost:  { name:'霜降', bg:'#0a0c10', accent:[170,200,220], textPrimary:'#e0e8f0', textMuted:'rgba(200,215,230,0.4)', atm:['rgba(170,200,220,0.05)','rgba(80,100,130,0.08)','rgba(100,120,150,0.05)'] }
  };
  var currentTheme = 'zen';

  /* ── 模式 ── */
  var currentMode = 'free'; // free | countdown | pomodoro

  /* ── 设置值 ── */
  var cdMinutes = 25;
  var focusMinutes = 25;
  var breakMinutes = 5;
  var totalRounds = 4;

  /* ── 鼓励语 ── */
  var quotes = [
    '呼吸是通往内心的桥梁','放下一切念头，回到当下','每一个当下都是全新的开始',
    '安静下来，你会听见内心的声音','不评判，不执着，只是观察',
    '此刻的平静，是你给自己的礼物','让思绪如云般飘过','你的内心比天空更广阔',
    '一呼一吸之间，便是修行','接纳此刻的自己，便是圆满','在宁静中，找到力量的源泉',
    '每一次呼吸，都在洗涤心灵','安住当下，无需追寻远方','心若安静，万物皆明',
    '觉察即是自由，呼吸即是归家','放松肩膀，放松眉心，放松一切',
    '你的存在本身，就是最美的冥想','让呼吸引导你回到此刻',
    '不必追求完美，只需保持觉知','在沉默中，智慧自然浮现',
    '你比想象中更加平静和强大','每一次静坐，都是一次重置','像水一样柔软，像山一样坚定',
  ];

  /* ── DOM ── */
  var startScreen  = document.getElementById('start-screen');
  var zenScreen    = document.getElementById('zen-screen');
  var endScreen    = document.getElementById('end-screen');
  var btnStart     = document.getElementById('btn-start');
  var btnRestart   = document.getElementById('btn-restart');
  var zenTimer     = document.getElementById('zen-timer');
  var zenModeLabel = document.getElementById('zen-mode-label');
  var zenLabel     = document.getElementById('zen-label');
  var zenQuote     = document.getElementById('zen-quote');
  var endHeading   = document.getElementById('end-heading');
  var endTime      = document.getElementById('end-time');
  var endDetail    = document.getElementById('end-detail');
  var endPomoSummary = document.getElementById('end-pomo-summary');
  var canvas       = document.getElementById('particles');
  var ctx          = canvas.getContext('2d');
  var atmosphere   = document.getElementById('atmosphere');
  var startIcon    = document.getElementById('start-icon');
  var zenIconEl    = document.getElementById('zen-icon');
  var endIcon      = document.getElementById('end-icon');
  var pomoRoundsEl = document.getElementById('pomodoro-rounds');
  var cdValueEl    = document.getElementById('cd-value');
  var focusValueEl = document.getElementById('focus-value');
  var breakValueEl = document.getElementById('break-value');
  var roundsValueEl= document.getElementById('rounds-value');

  /* ── 状态 ── */
  var isZen = false;
  var startTimestamp = 0;
  var timerInterval = null;
  var quoteInterval = null;
  var particles = [];
  var animFrameId = null;
  var lastQuoteIdx = -1;
  var totalElapsed = 0; // 总禅定时长（用于统计）

  /* ── 番茄钟运行状态 ── */
  var pomoState = {
    currentRound: 0,       // 当前第几轮（0-based）
    phase: 'focus',         // 'focus' | 'break'
    phaseEnd: 0,            // 当前阶段结束时间戳
    totalFocusTime: 0,      // 累计专注时间 ms
    totalBreakTime: 0,     // 累计休息时间 ms
    completedRounds: 0,    // 完成的轮次数
    phaseStartTime: 0,     // 当前阶段开始时间
  };

  /* ── SVG ── */
  function ac(alpha) {
    var a = themes[currentTheme].accent;
    return 'rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',' + alpha + ')';
  }
  function renderStartIcon() {
    startIcon.innerHTML =
      '<circle cx="50" cy="50" r="48" stroke="'+ac(0.15)+'" stroke-width="1"/>'+
      '<circle cx="50" cy="50" r="32" stroke="'+ac(0.1)+'" stroke-width="0.5"/>'+
      '<circle cx="50" cy="50" r="6" fill="'+ac(0.6)+'"/>'+
      '<line x1="50" y1="18" x2="50" y2="82" stroke="'+ac(0.2)+'" stroke-width="0.8"/>'+
      '<line x1="18" y1="50" x2="82" y2="50" stroke="'+ac(0.2)+'" stroke-width="0.8"/>'+
      '<line x1="27" y1="27" x2="73" y2="73" stroke="'+ac(0.12)+'" stroke-width="0.5"/>'+
      '<line x1="73" y1="27" x2="27" y2="73" stroke="'+ac(0.12)+'" stroke-width="0.5"/>';
  }
  function renderZenIcon() {
    zenIconEl.innerHTML =
      '<circle cx="80" cy="80" r="75" stroke="'+ac(0.2)+'" stroke-width="0.8"/>'+
      '<circle cx="80" cy="80" r="55" stroke="'+ac(0.12)+'" stroke-width="0.5"/>'+
      '<circle cx="80" cy="80" r="35" stroke="'+ac(0.08)+'" stroke-width="0.5"/>'+
      '<circle cx="80" cy="80" r="8" fill="'+ac(0.7)+'"/>'+
      '<line x1="80" y1="20" x2="80" y2="140" stroke="'+ac(0.15)+'" stroke-width="0.6"/>'+
      '<line x1="20" y1="80" x2="140" y2="80" stroke="'+ac(0.15)+'" stroke-width="0.6"/>'+
      '<line x1="36" y1="36" x2="124" y2="124" stroke="'+ac(0.1)+'" stroke-width="0.4"/>'+
      '<line x1="124" y1="36" x2="36" y2="124" stroke="'+ac(0.1)+'" stroke-width="0.4"/>'+
      '<path d="M80 25 Q95 50 80 80 Q65 50 80 25Z" fill="'+ac(0.04)+'"/>'+
      '<path d="M80 135 Q65 110 80 80 Q95 110 80 135Z" fill="'+ac(0.04)+'"/>';
  }
  function renderEndIcon() {
    endIcon.innerHTML =
      '<circle cx="40" cy="40" r="38" stroke="'+ac(0.2)+'" stroke-width="1"/>'+
      '<path d="M28 42 L36 50 L54 30" stroke="'+ac(0.7)+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
  }

  /* ── 主题切换 ── */
  function applyTheme(key) {
    if (!themes[key]) return;
    currentTheme = key;
    var t = themes[key]; var r = t.accent[0], g = t.accent[1], b = t.accent[2];
    var root = document.documentElement.style;
    root.setProperty('--bg-deep', t.bg);
    root.setProperty('--accent', 'rgb('+r+','+g+','+b+')');
    root.setProperty('--accent-dim', 'rgba('+r+','+g+','+b+',0.25)');
    root.setProperty('--text-primary', t.textPrimary);
    root.setProperty('--text-muted', t.textMuted);
    root.setProperty('--glow', 'rgba('+r+','+g+','+b+',0.12)');
    root.setProperty('--atm-1', t.atm[0]);
    root.setProperty('--atm-2', t.atm[1]);
    root.setProperty('--atm-3', t.atm[2]);
    document.body.style.background = t.bg;
    atmosphere.style.background =
      'radial-gradient(ellipse 60% 50% at 50% 45%,'+t.atm[0]+' 0%,transparent 70%),' +
      'radial-gradient(ellipse 80% 60% at 30% 70%,'+t.atm[1]+' 0%,transparent 60%),' +
      'radial-gradient(ellipse 70% 50% at 75% 25%,'+t.atm[2]+' 0%,transparent 60%)';
    renderStartIcon(); renderZenIcon(); renderEndIcon();
  }

  /* ── 模式切换 ── */
  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-mode') === mode);
    });
    document.getElementById('settings-countdown').classList.toggle('active', mode === 'countdown');
    document.getElementById('settings-pomodoro').classList.toggle('active', mode === 'pomodoro');
  }

  /* ── 设置值调整 ── */
  function adjustSetting(action) {
    switch(action) {
      case 'cd-minus':    cdMinutes = Math.max(1, cdMinutes - 5); cdValueEl.textContent = cdMinutes; break;
      case 'cd-plus':     cdMinutes = Math.min(120, cdMinutes + 5); cdValueEl.textContent = cdMinutes; break;
      case 'focus-minus':  focusMinutes = Math.max(1, focusMinutes - 5); focusValueEl.textContent = focusMinutes; break;
      case 'focus-plus':   focusMinutes = Math.min(120, focusMinutes + 5); focusValueEl.textContent = focusMinutes; break;
      case 'break-minus':  breakMinutes = Math.max(1, breakMinutes - 1); breakValueEl.textContent = breakMinutes; break;
      case 'break-plus':   breakMinutes = Math.min(30, breakMinutes + 1); breakValueEl.textContent = breakMinutes; break;
      case 'rounds-minus': totalRounds = Math.max(1, totalRounds - 1); roundsValueEl.textContent = totalRounds; break;
      case 'rounds-plus':  totalRounds = Math.min(10, totalRounds + 1); roundsValueEl.textContent = totalRounds; break;
    }
  }

  /* ── 粒子 ── */
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  function createParticle() {
    return { x: Math.random()*canvas.width, y: Math.random()*canvas.height+canvas.height,
      size: Math.random()*2+0.5, speedY: -(Math.random()*0.3+0.1), speedX: (Math.random()-0.5)*0.15,
      opacity: Math.random()*0.4+0.1, life: 0, maxLife: Math.random()*600+400 };
  }
  function initParticles(count) { particles = []; for (var i=0;i<count;i++) particles.push(createParticle()); }
  function drawParticles() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var a = themes[currentTheme].accent;
    for (var i=0;i<particles.length;i++) {
      var p = particles[i]; p.x += p.speedX; p.y += p.speedY; p.life++;
      var progress = p.life / p.maxLife;
      var alpha = p.opacity;
      if (progress < 0.1) alpha *= progress / 0.1;
      else if (progress > 0.9) alpha *= (1 - progress) / 0.1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fillStyle = 'rgba('+a[0]+','+a[1]+','+a[2]+','+alpha.toFixed(3)+')';
      ctx.fill();
      if (p.life >= p.maxLife) Object.assign(p, createParticle());
    }
    animFrameId = requestAnimationFrame(drawParticles);
  }

  /* ── 全屏 ── */
  function enterFullscreen() {
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  function exitFullscreen() {
    if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }

  /* ── 屏幕切换 ── */
  function showScreen(screen) {
    [startScreen, zenScreen, endScreen].forEach(function(s) {
      s.classList.remove('visible'); s.classList.add('hidden');
    });
    setTimeout(function() { screen.classList.remove('hidden'); screen.classList.add('visible'); }, 100);
  }

  /* ── 格式化 ── */
  function formatTime(ms) {
    var totalSec = Math.floor(ms / 1000);
    if (totalSec < 0) totalSec = 0;
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    if (h > 0) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  function formatDetail(ms) {
    var totalSec = Math.floor(ms / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    if (h > 0) return h + ' 小时 ' + m + ' 分 ' + s + ' 秒';
    if (m > 0) return m + ' 分 ' + s + ' 秒';
    return s + ' 秒';
  }

  /* ── 鼓励语 ── */
  function showRandomQuote() {
    var idx;
    do { idx = Math.floor(Math.random() * quotes.length); }
    while (idx === lastQuoteIdx && quotes.length > 1);
    lastQuoteIdx = idx;
    zenQuote.classList.add('fading');
    setTimeout(function() { zenQuote.textContent = quotes[idx]; zenQuote.classList.remove('fading'); }, 1000);
  }

  /* ── 番茄钟轮次指示器 ── */
  function renderPomoRounds() {
    var html = '';
    for (var i = 0; i < totalRounds; i++) {
      var cls = 'pomo-dot';
      if (i < pomoState.completedRounds) cls += ' done';
      else if (i === pomoState.currentRound) cls += ' focused';
      html += '<div class="'+cls+'"></div>';
    }
    pomoRoundsEl.innerHTML = html;
    pomoRoundsEl.style.display = (currentMode === 'pomodoro') ? 'flex' : 'none';
  }

  /* ── 播放提示音 ── */
  function playBeep() {
    try {
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(520, audioCtx.currentTime);
      osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.15);
      osc.frequency.setValueAtTime(520, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.6);
    } catch(e) {}
  }

  /* ═══════════════════════════════════
     ── 自由模式（正计时）
     ═══════════════════════════════════ */
  function tickFree() {
    var elapsed = Date.now() - startTimestamp;
    totalElapsed = elapsed;
    zenTimer.textContent = formatTime(elapsed);
  }

  /* ═══════════════════════════════════
     ── 倒计时模式
     ═══════════════════════════════════ */
  var countdownTotal = 0; // 倒计时总毫秒数
  function tickCountdown() {
    var elapsed = Date.now() - startTimestamp;
    var remaining = countdownTotal - elapsed;
    totalElapsed = elapsed;
    if (remaining <= 0) {
      remaining = 0;
      zenTimer.textContent = '00:00';
      zenLabel.textContent = '时间到';
      zenTimer.classList.add('timer-pulse');
      playBeep();
      // 延迟1秒后自动结束
      setTimeout(function() { endZen(); }, 1200);
      clearInterval(timerInterval);
      timerInterval = null;
      return;
    }
    zenTimer.textContent = formatTime(remaining);
  }

  /* ═══════════════════════════════════
     ── 番茄钟模式
     ═══════════════════════════════════ */
  function tickPomodoro() {
    var now = Date.now();
    var remaining = pomoState.phaseEnd - now;

    if (remaining <= 0) {
      // 阶段结束
      var phaseElapsed = now - pomoState.phaseStartTime;
      if (pomoState.phase === 'focus') {
        pomoState.totalFocusTime += phaseElapsed;
        pomoState.completedRounds++;
        renderPomoRounds();
        if (pomoState.completedRounds >= totalRounds) {
          // 所有轮次完成
          zenTimer.textContent = '00:00';
          zenLabel.textContent = '全部完成';
          zenModeLabel.textContent = '';
          playBeep();
          setTimeout(function() { endZen(); }, 1500);
          clearInterval(timerInterval);
          timerInterval = null;
          return;
        }
        // 进入休息
        pomoState.phase = 'break';
        pomoState.phaseEnd = now + breakMinutes * 60 * 1000;
        pomoState.phaseStartTime = now;
        zenLabel.textContent = '休息中';
        zenModeLabel.textContent = '第 ' + (pomoState.completedRounds + 1) + ' 轮 · 休息';
        playBeep();
      } else {
        // 休息结束，进入下一轮专注
        pomoState.totalBreakTime += phaseElapsed;
        pomoState.currentRound = pomoState.completedRounds;
        pomoState.phase = 'focus';
        pomoState.phaseEnd = now + focusMinutes * 60 * 1000;
        pomoState.phaseStartTime = now;
        zenLabel.textContent = '专注中';
        zenModeLabel.textContent = '第 ' + (pomoState.currentRound + 1) + ' 轮 · 专注';
        renderPomoRounds();
        playBeep();
      }
      remaining = pomoState.phaseEnd - Date.now();
    }

    totalElapsed = pomoState.totalFocusTime + pomoState.totalBreakTime +
      (Date.now() - pomoState.phaseStartTime);
    zenTimer.textContent = formatTime(remaining);
  }

  /* ═══════════════════════════════════
     ── 开始禅定
     ═══════════════════════════════════ */
  function startZen() {
    isZen = true;
    startTimestamp = Date.now();
    totalElapsed = 0;
    zenTimer.classList.remove('timer-pulse');
    zenQuote.textContent = '深呼吸，放松身心...';
    lastQuoteIdx = -1;

    renderZenIcon();

    switch (currentMode) {
      case 'free':
        zenModeLabel.textContent = '自由禅定';
        zenLabel.textContent = '禅定中';
        zenTimer.textContent = '00:00';
        pomoRoundsEl.style.display = 'none';
        break;
      case 'countdown':
        zenModeLabel.textContent = '倒计时 ' + cdMinutes + ' 分钟';
        zenLabel.textContent = '禅定中';
        countdownTotal = cdMinutes * 60 * 1000;
        zenTimer.textContent = formatTime(countdownTotal);
        pomoRoundsEl.style.display = 'none';
        break;
      case 'pomodoro':
        pomoState = {
          currentRound: 0, phase: 'focus', phaseEnd: 0,
          totalFocusTime: 0, totalBreakTime: 0, completedRounds: 0,
          phaseStartTime: Date.now()
        };
        pomoState.phaseEnd = Date.now() + focusMinutes * 60 * 1000;
        zenModeLabel.textContent = '第 1 轮 · 专注';
        zenLabel.textContent = '专注中';
        zenTimer.textContent = formatTime(focusMinutes * 60 * 1000);
        renderPomoRounds();
        break;
    }

    showScreen(zenScreen);
    enterFullscreen();

    timerInterval = setInterval(function() {
      switch (currentMode) {
        case 'free': tickFree(); break;
        case 'countdown': tickCountdown(); break;
        case 'pomodoro': tickPomodoro(); break;
      }
    }, 200);

    quoteInterval = setInterval(showRandomQuote, 8000);
  }

  /* ═══════════════════════════════════
     ── 结束禅定
     ═══════════════════════════════════ */
  function endZen() {
    if (!isZen) return;
    isZen = false;
    clearInterval(timerInterval); clearInterval(quoteInterval);
    timerInterval = null; quoteInterval = null;

    zenTimer.classList.remove('timer-pulse');
    renderEndIcon(); exitFullscreen();

    // 结束屏幕内容
    switch (currentMode) {
      case 'free':
        endHeading.textContent = '禅定结束';
        endTime.textContent = formatTime(totalElapsed);
        endDetail.textContent = '本次禅定 ' + formatDetail(totalElapsed);
        endPomoSummary.innerHTML = '';
        break;
      case 'countdown':
        endHeading.textContent = '倒计时完成';
        endTime.textContent = formatTime(totalElapsed);
        endDetail.textContent = '本次禅定 ' + formatDetail(totalElapsed);
        endPomoSummary.innerHTML = '';
        break;
      case 'pomodoro':
        endHeading.textContent = '番茄钟完成';
        endTime.textContent = formatTime(pomoState.totalFocusTime);
        endDetail.textContent = '总专注 ' + formatDetail(pomoState.totalFocusTime);
        endPomoSummary.innerHTML =
          '完成 <span>' + pomoState.completedRounds + '</span> 轮专注 · ' +
          '休息 <span>' + formatDetail(pomoState.totalBreakTime) + '</span>';
        break;
    }

    showScreen(endScreen);
  }

  /* ── 事件绑定 ── */
  btnStart.addEventListener('click', startZen);
  btnRestart.addEventListener('click', startZen);

  zenScreen.addEventListener('click', function(e) {
    e.stopPropagation();
    endZen();
  });

  document.addEventListener('keydown', function(e) {
    if (!isZen) return;
    e.preventDefault();
    endZen();
  });

  // 模式切换
  document.querySelectorAll('.mode-tab').forEach(function(tab) {
    tab.addEventListener('click', function(e) {
      e.stopPropagation();
      switchMode(tab.getAttribute('data-mode'));
    });
  });

  // 设置按钮
  document.querySelectorAll('.setting-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      adjustSetting(btn.getAttribute('data-action'));
    });
  });

  // 主题切换
  document.querySelectorAll('.theme-dot').forEach(function(dot) {
    dot.addEventListener('click', function(e) {
      e.stopPropagation();
      document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('active'); });
      dot.classList.add('active');
      applyTheme(dot.getAttribute('data-theme'));
    });
  });

  /* ── 初始化 ── */
  applyTheme('zen');
  switchMode('free');
  resizeCanvas();
  initParticles(40);
  drawParticles();
  window.addEventListener('resize', function() { resizeCanvas(); initParticles(40); });
})();
</script>
</body>
</html>
