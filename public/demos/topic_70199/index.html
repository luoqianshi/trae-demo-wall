<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 移动端视口配置 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a3a6c">
  <title>车主车辆管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ============ 首页 ============ -->
    <section id="page-home" class="page page-active">
      <header class="page-header">
        <span class="page-title">车主之家</span>
      </header>
      <div class="page-body" id="homeBody">
        <!-- 欢迎横幅 -->
        <div class="welcome-banner" id="homeBanner"></div>
        <!-- 当前车辆信息卡 -->
        <div class="card" id="homeVehicle"></div>
        <!-- 同级对标 -->
        <div class="card" id="homePeerBenchmark"></div>
        <!-- 保养提醒 -->
        <div class="card" id="homeMaintReminder"></div>
        <!-- 快捷操作宫格 -->
        <div class="card">
          <div class="card-head">
            <h3 class="card-title">快捷操作</h3>
          </div>
          <div class="quick-grid" id="homeQuick"></div>
        </div>
        <!-- 保养方案对比 -->
        <div class="card" id="homeMaintCompare"></div>
        <!-- 最近记录 -->
        <div class="card">
          <div class="card-head">
            <h3 class="card-title">最近记录</h3>
            <span class="link" data-tab="service">全部</span>
          </div>
          <div id="homeRecent"></div>
        </div>
      </div>
    </section>

    <!-- ============ 服务 ============ -->
    <section id="page-service" class="page">
      <header class="page-header">
        <span class="page-title">车辆服务</span>
      </header>
      <div class="page-body" id="serviceBody">
        <!-- 服务入口 -->
        <div class="service-entries" id="serviceEntries"></div>
        <!-- 服务记录列表 -->
        <div class="card">
          <div class="card-head">
            <h3 class="card-title">服务记录</h3>
          </div>
          <div id="serviceRecords"></div>
        </div>
      </div>
    </section>

    <!-- ============ 账单 ============ -->
    <section id="page-bills" class="page">
      <header class="page-header">
        <span class="page-title">账单中心</span>
      </header>
      <div class="page-body" id="billsBody">
        <!-- 账单Tab切换 -->
        <div class="card">
          <div class="bill-tabs">
            <button class="bill-tab active" data-bill-type="month">月度账单</button>
            <button class="bill-tab" data-bill-type="year">年度账单</button>
          </div>
          <!-- 日期选择器 -->
          <div class="bill-date-picker" id="billDatePicker"></div>
        </div>
        <!-- 收支统计 -->
        <div class="stats-grid" id="billsStats"></div>
        <!-- 开销图表 -->
        <div class="card">
          <div class="card-head">
            <h3 class="card-title">开销图表</h3>
          </div>
          <div id="billsChart" class="bar-chart"></div>
        </div>
        <!-- 账单台账 -->
        <div class="card">
          <div class="card-head">
            <h3 class="card-title">账单台账</h3>
          </div>
          <div id="billsLedger"></div>
        </div>
        <!-- 趣味对比专区 -->
        <div class="card compare-zone">
          <div class="card-head">
            <h3 class="card-title">🎯 趣味对比专区</h3>
          </div>
          <div class="compare-tabs">
            <button class="compare-tab active" data-compare="fuel">油耗对比</button>
            <button class="compare-tab" data-compare="maint">保养方案对比</button>
          </div>
          <div id="fuelComparePanel" class="compare-panel compare-panel-active"></div>
          <div id="maintComparePanel" class="compare-panel"></div>
        </div>
      </div>
    </section>

    <!-- ============ 问AI ============ -->
    <section id="page-ai" class="page">
      <header class="page-header">
        <span class="page-title">问AI助手</span>
      </header>
      <div class="page-body ai-body">
        <div class="ai-messages" id="aiMessages"></div>
      </div>
      <div class="ai-input-bar">
        <input type="text" id="aiInput" class="ai-input" placeholder="向AI提问，例如：我的车油耗正常吗？" autocomplete="off">
        <button class="ai-send" id="aiSend">发送</button>
      </div>
    </section>

    <!-- ============ 我的 ============ -->
    <section id="page-mine" class="page">
      <header class="page-header">
        <span class="page-title">我的</span>
      </header>
      <div class="page-body" id="mineBody">
        <div id="mineProfile"></div>
        <div id="mineVehicles"></div>
        <div id="mineSettings"></div>
      </div>
    </section>

    <!-- ============ 底部Tab栏 ============ -->
    <nav class="tabbar">
      <button class="tab active" data-tab="home">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">首页</span>
      </button>
      <button class="tab" data-tab="service">
        <span class="tab-icon">🛠</span>
        <span class="tab-label">服务</span>
      </button>
      <button class="tab" data-tab="bills">
        <span class="tab-icon">📊</span>
        <span class="tab-label">账单</span>
      </button>
      <button class="tab" data-tab="ai">
        <span class="tab-icon">🤖</span>
        <span class="tab-label">问AI</span>
      </button>
      <button class="tab" data-tab="mine">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <!-- ============ 加油记录模态框 ============ -->
  <div class="modal" id="modalRefuel">
    <div class="modal-mask"></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 class="modal-title">添加加油记录</h3>
        <button class="modal-close" data-modal="modalRefuel">✕</button>
      </div>
      <form class="modal-form" id="refuelForm">
        <label class="field">
          <span class="field-label">日期</span>
          <input type="date" name="date" required>
        </label>
        <label class="field">
          <span class="field-label">里程(km)</span>
          <input type="number" name="mileage" min="0" step="1" placeholder="如 23800" required>
        </label>
        <label class="field">
          <span class="field-label">加油量(升)</span>
          <input type="number" name="liters" min="0" step="0.1" placeholder="如 47.5" required>
        </label>
        <label class="field">
          <span class="field-label">单价(元/升)</span>
          <input type="number" name="pricePerLiter" min="0" step="0.01" placeholder="如 7.75" required>
        </label>
        <label class="field">
          <span class="field-label">总金额(元)</span>
          <input type="number" name="amount" min="0" step="0.01" placeholder="如 368.10" required>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-modal="modalRefuel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 保养记录模态框 ============ -->
  <div class="modal" id="modalMaintenance">
    <div class="modal-mask"></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 class="modal-title">添加保养记录</h3>
        <button class="modal-close" data-modal="modalMaintenance">✕</button>
      </div>
      <form class="modal-form" id="maintenanceForm">
        <label class="field">
          <span class="field-label">日期</span>
          <input type="date" name="date" required>
        </label>
        <label class="field">
          <span class="field-label">里程(km)</span>
          <input type="number" name="mileage" min="0" step="1" placeholder="如 24000" required>
        </label>
        <label class="field">
          <span class="field-label">保养项目</span>
          <input type="text" name="project" placeholder="如 机油+机滤" required>
        </label>
        <label class="field">
          <span class="field-label">金额(元)</span>
          <input type="number" name="amount" min="0" step="0.01" placeholder="如 450" required>
        </label>
        <label class="field">
          <span class="field-label">服务商</span>
          <input type="text" name="shop" placeholder="如 丰田4S店" required>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-modal="modalMaintenance">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 停车记录模态框 ============ -->
  <div class="modal" id="modalParking">
    <div class="modal-mask"></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 class="modal-title">添加停车记录</h3>
        <button class="modal-close" data-modal="modalParking">✕</button>
      </div>
      <form class="modal-form" id="parkingForm">
        <label class="field">
          <span class="field-label">日期</span>
          <input type="date" name="date" required>
        </label>
        <label class="field">
          <span class="field-label">停车位置</span>
          <input type="text" name="location" placeholder="如 万达广场地下车库" required>
        </label>
        <label class="field">
          <span class="field-label">停车时长</span>
          <input type="text" name="duration" placeholder="如 2小时30分" required>
        </label>
        <label class="field">
          <span class="field-label">金额(元)</span>
          <input type="number" name="amount" min="0" step="0.01" placeholder="如 20" required>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-modal="modalParking">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 高速记录模态框 ============ -->
  <div class="modal" id="modalToll">
    <div class="modal-mask"></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 class="modal-title">添加高速记录</h3>
        <button class="modal-close" data-modal="modalToll">✕</button>
      </div>
      <form class="modal-form" id="tollForm">
        <label class="field">
          <span class="field-label">日期</span>
          <input type="date" name="date" required>
        </label>
        <label class="field">
          <span class="field-label">起点</span>
          <input type="text" name="start" placeholder="如 北京" required>
        </label>
        <label class="field">
          <span class="field-label">终点</span>
          <input type="text" name="end" placeholder="如 天津" required>
        </label>
        <label class="field">
          <span class="field-label">里程(km)</span>
          <input type="text" name="distance" placeholder="如 120km" required>
        </label>
        <label class="field">
          <span class="field-label">金额(元)</span>
          <input type="number" name="amount" min="0" step="0.01" placeholder="如 65" required>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-modal="modalToll">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 违章记录模态框 ============ -->
  <div class="modal" id="modalViolation">
    <div class="modal-mask"></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 class="modal-title">添加违章记录</h3>
        <button class="modal-close" data-modal="modalViolation">✕</button>
      </div>
      <form class="modal-form" id="violationForm">
        <label class="field">
          <span class="field-label">日期</span>
          <input type="date" name="date" required>
        </label>
        <label class="field">
          <span class="field-label">违章地点</span>
          <input type="text" name="location" placeholder="如 北京市朝阳区建国路" required>
        </label>
        <label class="field">
          <span class="field-label">违章原因</span>
          <input type="text" name="reason" placeholder="如 闯红灯" required>
        </label>
        <label class="field">
          <span class="field-label">罚款金额(元)</span>
          <input type="number" name="amount" min="0" step="0.01" placeholder="如 200" required>
        </label>
        <label class="field">
          <span class="field-label">扣分</span>
          <input type="number" name="points" min="0" max="12" step="1" placeholder="如 3" required>
        </label>
        <label class="field">
          <span class="field-label">状态</span>
          <select name="status" required>
            <option value="unpaid">未处理</option>
            <option value="paid">已处理</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-modal="modalViolation">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 保养手册模态框 ============ -->
  <div class="modal" id="modalMaintManual">
    <div class="modal-mask"></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 class="modal-title">📖 保养手册</h3>
        <button class="modal-close" data-modal="modalMaintManual">✕</button>
      </div>
      <div class="modal-form" id="maintManualContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
