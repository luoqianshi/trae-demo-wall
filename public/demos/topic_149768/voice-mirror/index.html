<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声临其境 - 云端声音训练与实时模拟器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 动态背景 -->
    <div class="bg-animation">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>
        <div class="bg-grid"></div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="22" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
                    <path d="M16 20C16 18 18 14 24 14C30 14 32 18 32 20C32 24 28 26 24 28C20 26 16 24 16 20Z" fill="url(#logoGrad)" opacity="0.9"/>
                    <path d="M18 28C18 32 21 35 24 35C27 35 30 32 30 28" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48">
                            <stop stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#a855f7"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div class="logo-text">
                    <h1>声临其境</h1>
                    <span>云端声音训练与实时模拟器</span>
                </div>
            </div>
            <div class="header-badge">TRAE AI 创造力大赛</div>
        </header>

        <!-- 主体内容 -->
        <main class="main-grid">
            <!-- 1. 声音上传区 -->
            <section class="card upload-card">
                <div class="card-header">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <h2>声音上传</h2>
                </div>
                <div class="card-body">
                    <div class="upload-zone" id="uploadZone">
                        <svg class="upload-icon" viewBox="0 0 48 48" fill="none">
                            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
                            <path d="M24 14v16M18 20l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <text x="24" y="38" text-anchor="middle" fill="currentColor" font-size="8" opacity="0.6">WAV / MP3</text>
                        </svg>
                        <p>点击上传或拖拽音频文件到此处</p>
                        <span class="upload-hint">支持 WAV、MP3 格式，最大 20MB</span>
                        <input type="file" id="fileInput" accept=".wav,.mp3" hidden>
                    </div>
                    <div class="file-info" id="fileInfo" style="display:none;">
                        <div class="file-card">
                            <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 18V5l12-2v13"/>
                                <circle cx="6" cy="18" r="3"/>
                                <circle cx="18" cy="16" r="3"/>
                            </svg>
                            <div class="file-details">
                                <span class="file-name" id="fileName"></span>
                                <span class="file-duration" id="fileDuration"></span>
                            </div>
                            <button class="btn-remove" id="btnRemove" title="移除">×</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. 训练模拟区 -->
            <section class="card training-card">
                <div class="card-header">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    <h2>云端训练</h2>
                </div>
                <div class="card-body">
                    <div class="training-status" id="trainingStatus">
                        <div class="status-idle" id="statusIdle">
                            <svg class="status-icon" viewBox="0 0 48 48" fill="none">
                                <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
                                <path d="M24 16v8M24 28v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                            </svg>
                            <p>请先上传音频文件</p>
                        </div>
                        <div class="status-training" id="statusTraining" style="display:none;">
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progressFill"></div>
                                    <div class="progress-glow"></div>
                                </div>
                                <span class="progress-text" id="progressText">训练中... 0%</span>
                            </div>
                            <div class="training-animation">
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                            </div>
                        </div>
                        <div class="status-done" id="statusDone" style="display:none;">
                            <svg class="checkmark" viewBox="0 0 52 52">
                                <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                                <path class="checkmark-check" fill="none" d="M14 27l7 7 16-16"/>
                            </svg>
                            <p class="done-text">训练完成！</p>
                            <span class="done-sub">声音模型已就绪，可进行语音合成</span>
                        </div>
                    </div>
                    <button class="btn-primary btn-train" id="btnTrain" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        开始训练
                    </button>
                </div>
            </section>

            <!-- 3. 语音合成区 -->
            <section class="card synthesis-card">
                <div class="card-header">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                        <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                    <h2>语音合成</h2>
                </div>
                <div class="card-body">
                    <div class="input-group">
                        <textarea id="textInput" class="text-input" placeholder="请输入要合成的文字内容..." maxlength="500" rows="4" disabled></textarea>
                        <span class="char-count" id="charCount">0 / 500</span>
                    </div>
                    <div class="synthesis-controls">
                        <div class="voice-selector">
                            <label>当前声音：</label>
                            <span class="current-voice" id="currentVoice">未选择</span>
                        </div>
                        <button class="btn-primary btn-synthesize" id="btnSynthesize" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            合成语音
                        </button>
                    </div>
                    <div class="audio-player" id="audioPlayer" style="display:none;">
                        <div class="playing-animation" id="playingAnim">
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                        </div>
                        <span class="playing-text">正在播放合成语音...</span>
                    </div>
                </div>
            </section>

            <!-- 4. 历史记录区 -->
            <section class="card history-card">
                <div class="card-header">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <h2>声音库</h2>
                    <span class="history-count" id="historyCount">1 个声音</span>
                </div>
                <div class="card-body">
                    <div class="history-list" id="historyList">
                        <!-- 动态填充 -->
                    </div>
                    <div class="history-empty" id="historyEmpty" style="display:none;">
                        <p>暂无训练记录</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>© 2026 声临其境 · TRAE AI 创造力大赛参赛作品</p>
        </footer>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
