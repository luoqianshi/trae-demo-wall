<!-- TRAE AI创造力大赛参赛作品 · 银发助手 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>银发助手 — TRAE AI创造力大赛</title>
  <style>
    :root {
      --bg: #FFFDF9;
      --bg2: #F7F3ED;
      --ink: #2D2A26;
      --muted: #8A857D;
      --rule: #E5DFD6;
      --brand: #C75C2E;
      --brand2: #3A7D6E;
      --font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === Hero === */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
      background: linear-gradient(180deg, var(--bg) 0%, #FFF8F0 50%, var(--bg) 100%);
    }
    .hero-badge {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      padding: 0.4rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .hero h1 {
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 0.8rem;
    }
    .hero h1 span { color: var(--brand); }
    .hero-sub {
      font-size: 1.2rem;
      color: var(--muted);
      max-width: 560px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    /* === Cards === */
    .info-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .info-item {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 0.8rem 1.5rem;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .info-item span:first-child { font-size: 1.3rem; }

    /* === Buttons === */
    .btn-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 3rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem 2rem;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 6px 20px rgba(199,92,46,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(199,92,46,0.4);
    }
    .btn-secondary {
      background: var(--bg2);
      color: var(--ink);
      border: 2px solid var(--rule);
    }
    .btn-secondary:hover {
      border-color: var(--brand);
      background: #fff;
    }
    .btn-ghost {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }

    /* === Features === */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      max-width: 800px;
      width: 100%;
      margin-bottom: 2.5rem;
    }
    .feature {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 1.3rem;
      text-align: left;
    }
    .feature-ico { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .feature-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem; }
    .feature-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }

    /* === Footer === */
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--rule);
    }
    .footer-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .footer-links a {
      padding: 0.4rem 1rem;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 8px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .footer-links a:hover {
      border-color: var(--brand);
      color: var(--brand);
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-badge">TRAE AI创造力大赛 · 社会公益赛道</div>
    <h1><span>银发</span>助手</h1>
    <p class="hero-sub">
      面向3.23亿中老年人的AI生活互助平台<br>
      用AI弥合数字鸿沟，让每一位老人都能轻松解决生活难题
    </p>

    <div class="info-row">
      <div class="info-item"><span>🎤</span> 语音优先交互</div>
      <div class="info-item"><span>🤖</span> AI智能问答</div>
      <div class="info-item"><span>📱</span> 步骤化教程</div>
      <div class="info-item"><span>🛡️</span> 防骗守护</div>
    </div>

    <div class="btn-row">
      <a href="product/index.html" class="btn btn-primary">🚀 体验产品原型</a>
      <a href="pitch.html" class="btn btn-secondary">📄 查看完整方案</a>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-ico">🎤</div>
        <div class="feature-title">语音提问</div>
        <div class="feature-desc">长按说话，AI自动识别并匹配答案。零打字门槛</div>
      </div>
      <div class="feature">
        <div class="feature-ico">📋</div>
        <div class="feature-title">前置条件检测</div>
        <div class="feature-desc">操作前自动检测必要条件，避免做到一半卡住</div>
      </div>
      <div class="feature">
        <div class="feature-ico">📖</div>
        <div class="feature-title">每日学习签到</div>
        <div class="feature-desc">每天学一个技巧+答一题，连续30天有奖</div>
      </div>
      <div class="feature">
        <div class="feature-ico">👥</div>
        <div class="feature-title">银发社区</div>
        <div class="feature-desc">找搭子、参加活动、互帮互助</div>
      </div>
    </div>

    <a href="pitch.html#roadmap" class="btn-ghost">查看落地路线图 →</a>
  </div>

  <footer>
    <div class="footer-links">
      <a href="product/index.html">🚀 体验产品原型</a>
      <a href="pitch.html">📄 查看完整方案</a>
    </div>
    TRAE AI创造力大赛 · 银发助手 · 2026
  </footer>
</body>
</html>
