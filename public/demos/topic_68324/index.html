<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StateNodeTools Demo - 可视化状态机自动化创作平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; color: #fff; overflow: hidden; }
        
        #app { display: flex; height: 100vh; }
        
        #toolbar { width: 200px; background: #121228; border-right: 1px solid #2a2a4a; padding: 15px; overflow-y: auto; }
        #toolbar h2 { font-size: 14px; color: #00d2ff; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #2a2a4a; }
        
        .tool-group { margin-bottom: 20px; }
        .tool-group h3 { font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .node-tool { display: flex; align-items: center; padding: 10px; background: #1a1a38; border-radius: 8px; margin-bottom: 8px; cursor: grab; transition: all 0.2s; border: 2px solid transparent; }
        .node-tool:hover { background: #25254a; border-color: #00d2ff; }
        .node-tool:active { cursor: grabbing; }
        
        .node-tool .icon { width: 24px; height: 24px; border-radius: 4px; margin-right: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .node-tool .icon.start { background: linear-gradient(135deg, #00d2ff, #3a7bd5); color: #000; }
        .node-tool .icon.end { background: linear-gradient(135deg, #fd79a8, #e84393); }
        .node-tool .icon.condition { background: linear-gradient(135deg, #f39c12, #e74c3c); }
        .node-tool .icon.find { background: linear-gradient(135deg, #55efc4, #00b894); color: #000; }
        .node-tool .icon.mouse { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .node-tool .icon.keyboard { background: linear-gradient(135deg, #fdcb6e, #e17055); color: #000; }
        .node-tool .icon.delay { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .node-tool .icon.loop { background: linear-gradient(135deg, #fab1a0, #e17055); }
        .node-tool .icon.composite { background: linear-gradient(135deg, #dfe6e9, #636e72); color: #000; }
        
        .node-tool .label { font-size: 12px; color: #ddd; }
        
        #main-area { flex: 1; display: flex; flex-direction: column; }
        
        #header { height: 50px; background: #121228; border-bottom: 1px solid #2a2a4a; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        #header .title { font-size: 16px; color: #00d2ff; font-weight: bold; }
        #header .actions { display: flex; gap: 10px; }
        
        .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(90deg, #00d2ff, #3a7bd5); color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,210,255,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }
        .btn-danger { background: rgba(231,76,60,0.8); color: #fff; }
        .btn-danger:hover { background: rgba(231,76,60,1); }
        
        #canvas-container { flex: 1; position: relative; overflow: hidden; background: #0a0a1a; }
        #canvas { display: block; cursor: crosshair; }
        
        #properties-panel { position: absolute; right: 20px; top: 70px; width: 280px; background: rgba(18,18,40,0.95); border: 1px solid #2a2a4a; border-radius: 12px; padding: 15px; display: none; z-index: 100; backdrop-filter: blur(10px); }
        #properties-panel h3 { font-size: 14px; color: #00d2ff; margin-bottom: 15px; }
        
        .prop-group { margin-bottom: 15px; }
        .prop-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .prop-group input, .prop-group select, .prop-group textarea { width: 100%; padding: 8px; background: #1a1a38; border: 1px solid #2a2a4a; border-radius: 4px; color: #fff; font-size: 12px; outline: none; }
        .prop-group input:focus, .prop-group select:focus, .prop-group textarea:focus { border-color: #00d2ff; }
        
        #logs-panel { height: 150px; background: #0d0d1a; border-top: 1px solid #2a2a4a; padding: 10px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; overflow-y: auto; }
        .log-entry { margin-bottom: 5px; }
        .log-info { color: #00d2ff; }
        .log-success { color: #55efc4; }
        .log-warning { color: #f39c12; }
        .log-error { color: #fd79a8; }
        .log-time { color: #555; margin-right: 8px; }
        
        .zoom-controls { position: absolute; bottom: 170px; left: 220px; display: flex; flex-direction: column; gap: 5px; background: rgba(18,18,40,0.8); padding: 8px; border-radius: 8px; }
        .zoom-btn { width: 32px; height: 32px; border: none; background: #1a1a38; color: #fff; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .zoom-btn:hover { background: #2a2a4a; }
        
        .mini-map { position: absolute; bottom: 170px; right: 20px; width: 150px; height: 100px; background: rgba(18,18,40,0.8); border: 1px solid #2a2a4a; border-radius: 8px; overflow: hidden; }
        
        .node-port { width: 8px; height: 8px; border-radius: 50%; position: absolute; background: #00d2ff; border: 2px solid #0a0a1a; cursor: crosshair; z-index: 10; }
        .node-port:hover { background: #fff; transform: scale(1.5); }
        .node-port.output { right: -4px; }
        .node-port.input { left: -4px; }
        
        .context-menu { position: absolute; background: #1a1a38; border: 1px solid #2a2a4a; border-radius: 8px; padding: 5px; display: none; z-index: 1000; }
        .context-menu-item { padding: 8px 20px; font-size: 12px; color: #ddd; cursor: pointer; border-radius: 4px; }
        .context-menu-item:hover { background: #2a2a4a; }
        
        .running-indicator { display: inline-flex; align-items: center; margin-left: 15px; }
        .running-dot { width: 8px; height: 8px; background: #55efc4; border-radius: 50%; animation: pulse 1.5s infinite; margin-right: 5px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .status-text { font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <h2>🔧 节点工具箱</h2>
            
            <div class="tool-group">
                <h3>流程控制</h3>
                <div class="node-tool" draggable="true" data-node-type="start">
                    <div class="icon start">▶</div>
                    <div class="label">开始节点</div>
                </div>
                <div class="node-tool" draggable="true" data-node-type="end">
                    <div class="icon end">■</div>
                    <div class="label">结束节点</div>
                </div>
                <div class="node-tool" draggable="true" data-node-type="condition">
                    <div class="icon condition">❓</div>
                    <div class="label">条件判断</div>
                </div>
                <div class="node-tool" draggable="true" data-node-type="loop">
                    <div class="icon loop">↻</div>
                    <div class="label">循环节点</div>
                </div>
                <div class="node-tool" draggable="true" data-node-type="composite">
                    <div class="icon composite">⊕</div>
                    <div class="label">组合节点</div>
                </div>
            </div>
            
            <div class="tool-group">
                <h3>图像识别</h3>
                <div class="node-tool" draggable="true" data-node-type="find-image">
                    <div class="icon find">🖼️</div>
                    <div class="label">查找图像</div>
                </div>
                <div class="node-tool" draggable="true" data-node-type="find-color">
                    <div class="icon find">🎨</div>
                    <div class="label">查找颜色</div>
                </div>
            </div>
            
            <div class="tool-group">
                <h3>输入操作</h3>
                <div class="node-tool" draggable="true" data-node-type="mouse-action">
                    <div class="icon mouse">🖱️</div>
                    <div class="label">鼠标操作</div>
                </div>
                <div class="node-tool" draggable="true" data-node-type="keyboard-action">
                    <div class="icon keyboard">⌨️</div>
                    <div class="label">键盘操作</div>
                </div>
                <div class="node-tool" draggable="true" data-node-type="delay">
                    <div class="icon delay">⏱️</div>
                    <div class="label">延时等待</div>
                </div>
            </div>
        </div>
        
        <div id="main-area">
            <div id="header">
                <div class="title">StateNodeTools - 可视化状态机编辑器</div>
                <div class="actions">
                    <span class="status-text" id="status">就绪</span>
                    <span id="running-indicator" style="display: none;">
                        <span class="running-dot"></span>运行中
                    </span>
                    <button class="btn btn-secondary" onclick="loadExample()">📋 加载示例</button>
                    <button class="btn btn-danger" onclick="clearCanvas()">🗑️ 清空</button>
                    <button class="btn btn-primary" onclick="runWorkflow()">▶ 运行</button>
                </div>
            </div>
            
            <div id="canvas-container">
                <canvas id="canvas"></canvas>
                
                <div class="zoom-controls">
                    <button class="zoom-btn" onclick="zoomIn()">+</button>
                    <button class="zoom-btn" onclick="zoomOut()">-</button>
                    <button class="zoom-btn" onclick="resetZoom()">⟲</button>
                </div>
                
                <div class="mini-map">
                    <canvas id="mini-map-canvas"></canvas>
                </div>
                
                <div id="properties-panel">
                    <h3>📝 属性设置</h3>
                    <div class="prop-group">
                        <label>节点名称</label>
                        <input type="text" id="prop-name" onchange="updateNodeProperty('name', this.value)">
                    </div>
                    <div class="prop-group" id="prop-delay-group" style="display: none;">
                        <label>延时时间 (毫秒)</label>
                        <input type="number" id="prop-delay" value="1000" onchange="updateNodeProperty('delay', parseInt(this.value))">
                    </div>
                    <div class="prop-group" id="prop-click-group" style="display: none;">
                        <label>点击类型</label>
                        <select id="prop-click-type" onchange="updateNodeProperty('clickType', this.value)">
                            <option value="left">左键单击</option>
                            <option value="right">右键单击</option>
                            <option value="double">双击</option>
                        </select>
                    </div>
                    <div class="prop-group" id="prop-image-group" style="display: none;">
                        <label>图像路径</label>
                        <input type="text" id="prop-image-path" placeholder="请输入截图路径">
                    </div>
                    <div class="prop-group" id="prop-key-group" style="display: none;">
                        <label>按键</label>
                        <input type="text" id="prop-key" placeholder="Enter, Tab, A-Z">
                    </div>
                    <div class="prop-group" id="prop-loop-group" style="display: none;">
                        <label>循环次数</label>
                        <input type="number" id="prop-loop-count" value="3" onchange="updateNodeProperty('loopCount', parseInt(this.value))">
                    </div>
                </div>
            </div>
            
            <div id="logs-panel">
                <div class="log-entry"><span class="log-time">[系统]</span><span class="log-info">欢迎使用 StateNodeTools Demo！</span></div>
                <div class="log-entry"><span class="log-time">[提示]</span><span class="log-info">从左侧拖拽节点到画布，连接端口创建工作流</span></div>
                <div class="log-entry"><span class="log-time">[提示]</span><span class="log-info">点击"加载示例"快速体验完整工作流</span></div>
            </div>
        </div>
    </div>
    
    <div class="context-menu" id="context-menu">
        <div class="context-menu-item" onclick="deleteSelectedNode()">删除节点</div>
        <div class="context-menu-item" onclick="copySelectedNode()">复制节点</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const miniMapCanvas = document.getElementById('mini-map-canvas');
        const miniMapCtx = miniMapCanvas.getContext('2d');
        
        let nodes = [];
        let connections = [];
        let selectedNode = null;
        let selectedPort = null;
        let draggingNode = null;
        let dragOffset = { x: 0, y: 0 };
        let isConnecting = false;
        let connectStart = null;
        let connectCurrent = { x: 0, y: 0 };
        let scale = 1;
        let offset = { x: 0, y: 0 };
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let isRunning = false;
        
        const NODE_WIDTH = 120;
        const NODE_HEIGHT = 50;
        
        const NODE_TYPES = {
            'start': { color: '#00d2ff', bg: 'linear-gradient(135deg, #00d2ff, #3a7bd5)', label: '开始' },
            'end': { color: '#fd79a8', bg: 'linear-gradient(135deg, #fd79a8, #e84393)', label: '结束' },
            'condition': { color: '#f39c12', bg: 'linear-gradient(135deg, #f39c12, #e74c3c)', label: '条件' },
            'loop': { color: '#fab1a0', bg: 'linear-gradient(135deg, #fab1a0, #e17055)', label: '循环' },
            'composite': { color: '#dfe6e9', bg: 'linear-gradient(135deg, #dfe6e9, #636e72)', label: '组合' },
            'find-image': { color: '#55efc4', bg: 'linear-gradient(135deg, #55efc4, #00b894)', label: '查找图像' },
            'find-color': { color: '#55efc4', bg: 'linear-gradient(135deg, #55efc4, #00b894)', label: '查找颜色' },
            'mouse-action': { color: '#a29bfe', bg: 'linear-gradient(135deg, #a29bfe, #6c5ce7)', label: '鼠标操作' },
            'keyboard-action': { color: '#fdcb6e', bg: 'linear-gradient(135deg, #fdcb6e, #e17055)', label: '键盘操作' },
            'delay': { color: '#74b9ff', bg: 'linear-gradient(135deg, #74b9ff, #0984e3)', label: '延时' }
        };
        
        let nodeIdCounter = 1;
        
        function resizeCanvas() {
            canvas.width = document.getElementById('canvas-container').clientWidth;
            canvas.height = document.getElementById('canvas-container').clientHeight;
            miniMapCanvas.width = 150;
            miniMapCanvas.height = 100;
            draw();
        }
        
        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 210, 255, 0.05)';
            ctx.lineWidth = 1;
            
            const gridSize = 20;
            const offsetX = offset.x % gridSize;
            const offsetY = offset.y % gridSize;
            
            for (let x = offsetX; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            for (let y = offsetY; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        function drawNode(node) {
            const screenX = node.x * scale + offset.x;
            const screenY = node.y * scale + offset.y;
            const screenWidth = NODE_WIDTH * scale;
            const screenHeight = NODE_HEIGHT * scale;
            
            ctx.save();
            
            if (selectedNode === node) {
                ctx.shadowColor = '#00d2ff';
                ctx.shadowBlur = 20;
            }
            
            if (node.highlighted) {
                ctx.shadowColor = '#55efc4';
                ctx.shadowBlur = 30;
                ctx.globalAlpha = 0.9;
            }
            
            const gradient = ctx.createLinearGradient(screenX, screenY, screenX + screenWidth, screenY + screenHeight);
            const colors = NODE_TYPES[node.type].bg.match(/#[a-fA-F0-9]{6}/g);
            if (colors && colors.length >= 2) {
                gradient.addColorStop(0, colors[0]);
                gradient.addColorStop(1, colors[1]);
            }
            
            ctx.fillStyle = gradient;
            ctx.roundRect(screenX, screenY, screenWidth, screenHeight, 8);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${12 * scale}px 'Segoe UI'`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.name || NODE_TYPES[node.type].label, screenX + screenWidth / 2, screenY + screenHeight / 2);
            
            if (node.type !== 'end') {
                ctx.fillStyle = '#00d2ff';
                ctx.beginPath();
                ctx.arc(screenX + screenWidth, screenY + screenHeight / 2, 4 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
            
            if (node.type !== 'start') {
                ctx.fillStyle = '#00d2ff';
                ctx.beginPath();
                ctx.arc(screenX, screenY + screenHeight / 2, 4 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function drawConnection(conn) {
            const startNode = nodes.find(n => n.id === conn.fromNode);
            const endNode = nodes.find(n => n.id === conn.toNode);
            
            if (!startNode || !endNode) return;
            
            const startX = (startNode.x + NODE_WIDTH) * scale + offset.x;
            const startY = (startNode.y + NODE_HEIGHT / 2) * scale + offset.y;
            const endX = endNode.x * scale + offset.x;
            const endY = (endNode.y + NODE_HEIGHT / 2) * scale + offset.y;
            
            ctx.save();
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            
            const midX = (startX + endX) / 2;
            ctx.quadraticCurveTo(midX, startY, midX, (startY + endY) / 2);
            ctx.quadraticCurveTo(midX, endY, endX, endY);
            
            ctx.stroke();
            
            ctx.fillStyle = '#00d2ff';
            const angle = Math.atan2(endY - (startY + endY) / 2, endX - midX);
            const arrowLength = 8 * scale;
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - arrowLength * Math.cos(angle - Math.PI / 6), endY - arrowLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(endX - arrowLength * Math.cos(angle + Math.PI / 6), endY - arrowLength * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawConnectingLine() {
            if (!isConnecting || !connectStart) return;
            
            const startX = connectStart.x * scale + offset.x;
            const startY = connectStart.y * scale + offset.y;
            
            ctx.save();
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            
            const midX = (startX + connectCurrent.x) / 2;
            ctx.quadraticCurveTo(midX, startY, midX, (startY + connectCurrent.y) / 2);
            ctx.quadraticCurveTo(midX, connectCurrent.y, connectCurrent.x, connectCurrent.y);
            
            ctx.stroke();
            ctx.restore();
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            connections.forEach(drawConnection);
            nodes.forEach(drawNode);
            
            drawConnectingLine();
            drawMiniMap();
        }
        
        function drawMiniMap() {
            miniMapCtx.clearRect(0, 0, 150, 100);
            
            const allNodes = nodes;
            if (allNodes.length === 0) return;
            
            const minX = Math.min(...allNodes.map(n => n.x)) - 50;
            const maxX = Math.max(...allNodes.map(n => n.x)) + NODE_WIDTH + 50;
            const minY = Math.min(...allNodes.map(n => n.y)) - 50;
            const maxY = Math.max(...allNodes.map(n => n.y)) + NODE_HEIGHT + 50;
            
            const mapScaleX = 150 / (maxX - minX || 100);
            const mapScaleY = 100 / (maxY - minY || 100);
            const mapScale = Math.min(mapScaleX, mapScaleY);
            
            miniMapCtx.fillStyle = '#1a1a38';
            miniMapCtx.fillRect(0, 0, 150, 100);
            
            allNodes.forEach(node => {
                const x = (node.x - minX) * mapScale;
                const y = (node.y - minY) * mapScale;
                miniMapCtx.fillStyle = NODE_TYPES[node.type].color;
                miniMapCtx.fillRect(x, y, 10, 6);
            });
            
            const viewX = (-offset.x / scale - minX) * mapScale;
            const viewY = (-offset.y / scale - minY) * mapScale;
            const viewWidth = canvas.width / scale * mapScale;
            const viewHeight = canvas.height / scale * mapScale;
            
            miniMapCtx.strokeStyle = '#00d2ff';
            miniMapCtx.lineWidth = 2;
            miniMapCtx.strokeRect(viewX, viewY, viewWidth, viewHeight);
        }
        
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left - offset.x) / scale,
                y: (e.clientY - rect.top - offset.y) / scale
            };
        }
        
        function getScreenPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }
        
        function findNodeAt(x, y) {
            return nodes.find(node => 
                x >= node.x && x <= node.x + NODE_WIDTH &&
                y >= node.y && y <= node.y + NODE_HEIGHT
            );
        }
        
        function findPortAt(screenX, screenY) {
            for (const node of nodes) {
                const nodeScreenX = node.x * scale + offset.x;
                const nodeScreenY = node.y * scale + offset.y;
                const nodeScreenWidth = NODE_WIDTH * scale;
                const nodeScreenHeight = NODE_HEIGHT * scale;
                
                const outputX = nodeScreenX + nodeScreenWidth;
                const outputY = nodeScreenY + nodeScreenHeight / 2;
                const inputX = nodeScreenX;
                const inputY = nodeScreenY + nodeScreenHeight / 2;
                
                const outputDist = Math.sqrt((screenX - outputX) ** 2 + (screenY - outputY) ** 2);
                const inputDist = Math.sqrt((screenX - inputX) ** 2 + (screenY - inputY) ** 2);
                
                if (outputDist < 10 && node.type !== 'end') {
                    return { node, type: 'output', x: node.x + NODE_WIDTH, y: node.y + NODE_HEIGHT / 2 };
                }
                if (inputDist < 10 && node.type !== 'start') {
                    return { node, type: 'input', x: node.x, y: node.y + NODE_HEIGHT / 2 };
                }
            }
            return null;
        }
        
        canvas.addEventListener('mousedown', (e) => {
            const mousePos = getMousePos(e);
            const screenPos = getScreenPos(e);
            
            const port = findPortAt(screenPos.x, screenPos.y);
            if (port && e.button === 0) {
                isConnecting = true;
                connectStart = { x: port.x, y: port.y, node: port.node, portType: port.type };
                selectedNode = null;
                updatePropertiesPanel(null);
                return;
            }
            
            const node = findNodeAt(mousePos.x, mousePos.y);
            if (node) {
                selectedNode = node;
                draggingNode = node;
                dragOffset = { x: mousePos.x - node.x, y: mousePos.y - node.y };
                updatePropertiesPanel(node);
                return;
            }
            
            selectedNode = null;
            updatePropertiesPanel(null);
            
            if (e.button === 1 || (e.button === 0 && e.altKey)) {
                isPanning = true;
                panStart = { x: e.clientX - offset.x, y: e.clientY - offset.y };
                canvas.style.cursor = 'grabbing';
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const mousePos = getMousePos(e);
            const screenPos = getScreenPos(e);
            
            if (draggingNode) {
                draggingNode.x = mousePos.x - dragOffset.x;
                draggingNode.y = mousePos.y - dragOffset.y;
                draw();
                return;
            }
            
            if (isPanning) {
                offset.x = e.clientX - panStart.x;
                offset.y = e.clientY - panStart.y;
                draw();
                return;
            }
            
            if (isConnecting) {
                connectCurrent = screenPos;
                draw();
                return;
            }
            
            const port = findPortAt(screenPos.x, screenPos.y);
            canvas.style.cursor = port ? 'crosshair' : 'crosshair';
        });
        
        canvas.addEventListener('mouseup', (e) => {
            if (isConnecting) {
                const screenPos = getScreenPos(e);
                const port = findPortAt(screenPos.x, screenPos.y);
                
                if (port && connectStart && connectStart.node !== port.node) {
                    if (connectStart.portType === 'output' && port.type === 'input') {
                        const existingConn = connections.find(
                            c => c.toNode === port.node.id
                        );
                        if (!existingConn) {
                            connections.push({
                                id: Date.now(),
                                fromNode: connectStart.node.id,
                                toNode: port.node.id
                            });
                            addLog('success', `已连接 ${connectStart.node.name} → ${port.node.name}`);
                        } else {
                            addLog('warning', '该节点已有输入连接');
                        }
                    }
                }
                
                isConnecting = false;
                connectStart = null;
                draw();
                return;
            }
            
            draggingNode = null;
            isPanning = false;
            canvas.style.cursor = 'crosshair';
        });
        
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const mousePos = getMousePos(e);
            const node = findNodeAt(mousePos.x, mousePos.y);
            
            if (node) {
                selectedNode = node;
                const menu = document.getElementById('context-menu');
                menu.style.display = 'block';
                menu.style.left = e.clientX + 'px';
                menu.style.top = e.clientY + 'px';
            }
        });
        
        document.addEventListener('click', () => {
            document.getElementById('context-menu').style.display = 'none';
        });
        
        document.querySelectorAll('.node-tool').forEach(tool => {
            tool.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('nodeType', tool.dataset.nodeType);
                e.dataTransfer.effectAllowed = 'copy';
            });
        });
        
        canvas.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        });
        
        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            const nodeType = e.dataTransfer.getData('nodeType');
            if (!nodeType) return;
            
            const mousePos = getMousePos(e);
            
            const newNode = {
                id: nodeIdCounter++,
                type: nodeType,
                x: mousePos.x - NODE_WIDTH / 2,
                y: mousePos.y - NODE_HEIGHT / 2,
                name: NODE_TYPES[nodeType].label,
                delay: 1000,
                clickType: 'left',
                loopCount: 3,
                imagePath: '',
                key: ''
            };
            
            nodes.push(newNode);
            addLog('info', `已添加节点: ${newNode.name}`);
            draw();
        });
        
        function updatePropertiesPanel(node) {
            const panel = document.getElementById('properties-panel');
            if (!node) {
                panel.style.display = 'none';
                return;
            }
            
            panel.style.display = 'block';
            document.getElementById('prop-name').value = node.name;
            
            document.getElementById('prop-delay-group').style.display = node.type === 'delay' ? 'block' : 'none';
            document.getElementById('prop-click-group').style.display = node.type === 'mouse-action' ? 'block' : 'none';
            document.getElementById('prop-image-group').style.display = node.type.includes('find') ? 'block' : 'none';
            document.getElementById('prop-key-group').style.display = node.type === 'keyboard-action' ? 'block' : 'none';
            document.getElementById('prop-loop-group').style.display = node.type === 'loop' ? 'block' : 'none';
            
            if (node.type === 'delay') document.getElementById('prop-delay').value = node.delay;
            if (node.type === 'mouse-action') document.getElementById('prop-click-type').value = node.clickType;
            if (node.type === 'loop') document.getElementById('prop-loop-count').value = node.loopCount;
        }
        
        function updateNodeProperty(key, value) {
            if (selectedNode) {
                selectedNode[key] = value;
                draw();
            }
        }
        
        function deleteSelectedNode() {
            if (selectedNode) {
                connections = connections.filter(
                    c => c.fromNode !== selectedNode.id && c.toNode !== selectedNode.id
                );
                nodes = nodes.filter(n => n.id !== selectedNode.id);
                addLog('warning', `已删除节点: ${selectedNode.name}`);
                selectedNode = null;
                updatePropertiesPanel(null);
                draw();
            }
        }
        
        function copySelectedNode() {
            if (selectedNode) {
                const copy = { ...selectedNode, id: nodeIdCounter++ };
                copy.x += 30;
                copy.y += 30;
                nodes.push(copy);
                addLog('info', `已复制节点: ${copy.name}`);
                draw();
            }
        }
        
        function zoomIn() {
            scale = Math.min(scale + 0.2, 3);
            draw();
        }
        
        function zoomOut() {
            scale = Math.max(scale - 0.2, 0.2);
            draw();
        }
        
        function resetZoom() {
            scale = 1;
            offset = { x: 0, y: 0 };
            draw();
        }
        
        function clearCanvas() {
            if (confirm('确定要清空画布吗？')) {
                nodes = [];
                connections = [];
                selectedNode = null;
                updatePropertiesPanel(null);
                addLog('info', '画布已清空');
                draw();
            }
        }
        
        function loadExample() {
            clearCanvas();
            
            const startNode = { id: nodeIdCounter++, type: 'start', x: 100, y: 200, name: '开始' };
            const findNode = { id: nodeIdCounter++, type: 'find-image', x: 280, y: 200, name: '查找图像', imagePath: 'target.png' };
            const mouseNode = { id: nodeIdCounter++, type: 'mouse-action', x: 460, y: 200, name: '点击', clickType: 'left' };
            const delayNode = { id: nodeIdCounter++, type: 'delay', x: 640, y: 200, name: '等待', delay: 2000 };
            const loopNode = { id: nodeIdCounter++, type: 'loop', x: 820, y: 200, name: '循环', loopCount: 3 };
            const endNode = { id: nodeIdCounter++, type: 'end', x: 1000, y: 200, name: '结束' };
            
            nodes = [startNode, findNode, mouseNode, delayNode, loopNode, endNode];
            
            connections = [
                { id: 1, fromNode: startNode.id, toNode: findNode.id },
                { id: 2, fromNode: findNode.id, toNode: mouseNode.id },
                { id: 3, fromNode: mouseNode.id, toNode: delayNode.id },
                { id: 4, fromNode: delayNode.id, toNode: loopNode.id },
                { id: 5, fromNode: loopNode.id, toNode: endNode.id }
            ];
            
            addLog('success', '示例工作流已加载');
            draw();
        }
        
        function addLog(type, message) {
            const logsPanel = document.getElementById('logs-panel');
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${type}">${message}</span>`;
            logsPanel.appendChild(logEntry);
            logsPanel.scrollTop = logsPanel.scrollHeight;
        }
        
        async function runWorkflow() {
            if (isRunning) return;
            
            const startNodes = nodes.filter(n => n.type === 'start');
            if (startNodes.length === 0) {
                addLog('error', '请添加开始节点');
                return;
            }
            
            isRunning = true;
            document.getElementById('running-indicator').style.display = 'inline-flex';
            document.getElementById('status').textContent = '运行中';
            addLog('info', '开始执行工作流...');
            
            await executeNode(startNodes[0]);
            
            isRunning = false;
            document.getElementById('running-indicator').style.display = 'none';
            document.getElementById('status').textContent = '已完成';
            addLog('success', '工作流执行完毕');
            
            nodes.forEach(n => {
                n.highlighted = false;
            });
            draw();
        }
        
        async function executeNode(node) {
            if (!isRunning) return;
            
            node.highlighted = true;
            draw();
            
            addLog('info', `执行节点: ${node.name}`);
            
            switch (node.type) {
                case 'delay':
                    addLog('info', `等待 ${node.delay}ms...`);
                    await delay(node.delay);
                    break;
                case 'mouse-action':
                    addLog('info', `执行${node.clickType === 'left' ? '左键单击' : node.clickType === 'right' ? '右键单击' : '双击'}`);
                    await delay(500);
                    break;
                case 'keyboard-action':
                    addLog('info', `按键: ${node.key || 'Enter'}`);
                    await delay(300);
                    break;
                case 'find-image':
                    addLog('info', `查找图像: ${node.imagePath || 'target.png'}`);
                    await delay(800);
                    addLog('success', '图像查找成功');
                    break;
                case 'find-color':
                    addLog('info', '查找颜色...');
                    await delay(600);
                    addLog('success', '颜色查找成功');
                    break;
                case 'loop':
                    for (let i = 1; i <= (node.loopCount || 3); i++) {
                        if (!isRunning) return;
                        addLog('info', `循环第 ${i}/${node.loopCount} 次`);
                        await delay(400);
                    }
                    break;
                case 'condition':
                    addLog('info', '条件判断: 满足条件');
                    await delay(500);
                    break;
                case 'composite':
                    addLog('info', '进入组合节点');
                    await delay(600);
                    addLog('info', '退出组合节点');
                    break;
                case 'start':
                    addLog('info', '工作流启动');
                    await delay(200);
                    break;
                case 'end':
                    addLog('success', '到达结束节点');
                    return;
            }
            
            node.highlighted = false;
            
            const conn = connections.find(c => c.fromNode === node.id);
            if (conn) {
                const nextNode = nodes.find(n => n.id === conn.toNode);
                if (nextNode) {
                    await delay(200);
                    await executeNode(nextNode);
                }
            }
        }
        
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        addLog('info', '节点编辑器已就绪');
    </script>
</body>
</html>
