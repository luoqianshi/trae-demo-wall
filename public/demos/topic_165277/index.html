<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>青墟修仙 - Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 主色调 */
      --bg-deepest: #0a0a0f;
      --bg-page: #0D0D0D;
      --bg-panel: #0d1f1f;
      --bg-block: rgba(26, 47, 47, 0.5);
      --bg-gradient-end: #1a3a3a;

      /* 边框色 */
      --border-primary: rgba(45, 90, 90, 0.5);
      --border-highlight: rgba(61, 122, 122, 0.5);
      --border-interactive: #3d9a9a;

      /* 文字色 */
      --text-primary: #e8e4dc;
      --text-secondary: #a0c0c0;
      --text-tertiary: #5a7a7a;
      --text-gray: #7F8C8D;

      /* 强调色 */
      --gold-primary: #c9a227;
      --gold-secondary: #C9A962;
      --gold-light: #f0d878;
      --cyan-primary: #4ECDC4;
      --cyan-secondary: #5ab8b8;
      --red-primary: #E74C3C;
      --purple-primary: #9B59B6;

      /* 字体 */
      --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-title: 'Noto Serif SC', serif;
      --font-mono: 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg-deepest);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 滚动条样式 */
    .scrollbar-thin {
      scrollbar-width: thin;
      scrollbar-color: #2d5a5a transparent;
    }

    .scrollbar-thin::-webkit-scrollbar {
      width: 4px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #2d5a5a;
      border-radius: 2px;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #3d7a7a;
    }

    /* 动画 */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .animate-breathe { animation: breathe 3s ease-in-out infinite; }

    /* 布局 */
    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
      background: linear-gradient(180deg, var(--bg-deepest) 0%, #0d1515 50%, var(--bg-deepest) 100%);
    }

    /* 侧边面板 - 移动端全屏覆盖 */
    .side-panel {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 85%;
      max-width: 320px;
      background: var(--bg-panel);
      z-index: 100;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .side-panel.left {
      left: 0;
      border-right: 1px solid var(--border-primary);
      transform: translateX(-100%);
    }

    .side-panel.right {
      right: 0;
      border-left: 1px solid var(--border-primary);
      transform: translateX(100%);
    }

    .side-panel.open {
      transform: translateX(0);
    }

    /* 遮罩层 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 99;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* 主聊天区域 */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    /* 头部 */
    .header {
      padding: 12px 16px;
      background: rgba(13, 31, 31, 0.8);
      border-bottom: 1px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title {
      font-family: var(--font-title);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* 切换按钮 */
    .toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-block);
      border: 1px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-secondary);
      font-size: 16px;
    }

    .toggle-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    .toggle-btn.active {
      background: rgba(201, 162, 39, 0.1);
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    /* 在线状态 */
    .online-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .online-dot {
      width: 6px;
      height: 6px;
      background: #4ec94e;
      border-radius: 50%;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* 消息列表 */
    .message-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 消息气泡 */
    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    .message.player {
      flex-direction: row-reverse;
    }

    .message.system {
      justify-content: center;
    }

    .message.event {
      justify-content: center;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .message.player .avatar {
      background: linear-gradient(135deg, #3d7a7a, #2d5a5a);
      border: 1px solid var(--border-interactive);
    }

    .message.npc .avatar {
      background: linear-gradient(135deg, #c9a227, #a08020);
      border: 1px solid var(--gold-light);
    }

    .message-content {
      max-width: 75%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message.player .message-content {
      align-items: flex-end;
    }

    .sender-name {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .context-info {
      font-size: 10px;
      color: var(--text-tertiary);
      display: flex;
      gap: 6px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.player .bubble {
      background: linear-gradient(135deg, #2d5a5a, #1a3a3a);
      border: 1px solid var(--border-highlight);
      border-top-right-radius: 4px;
      color: var(--text-primary);
    }

    .message.npc .bubble {
      background: linear-gradient(135deg, #1a2f2f, #0d1f1f);
      border: 1px solid var(--border-primary);
      border-top-left-radius: 4px;
      color: var(--text-primary);
    }

    .message.system .bubble {
      background: rgba(45, 90, 90, 0.2);
      border: 1px solid rgba(45, 90, 90, 0.4);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .message.event .bubble {
      background: linear-gradient(90deg, rgba(201, 162, 39, 0.2), rgba(201, 162, 39, 0.1), rgba(201, 162, 39, 0.2));
      border: 1px solid rgba(201, 162, 39, 0.4);
      border-radius: 12px;
      max-width: 85%;
      text-align: center;
    }

    .message.event .bubble strong {
      color: var(--gold-light);
    }

    .timestamp {
      font-size: 10px;
      color: var(--text-tertiary);
    }

    /* 动作按钮 */
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .action-btn {
      padding: 6px 12px;
      background: rgba(45, 90, 90, 0.3);
      border: 1px solid rgba(61, 122, 122, 0.5);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: rgba(45, 90, 90, 0.5);
      border-color: #3d7a7a;
      color: var(--text-primary);
    }

    /* 业力变化 */
    .karma-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
    }

    .karma-change.positive {
      background: rgba(255, 215, 0, 0.1);
      color: #FFD700;
    }

    .karma-change.negative {
      background: rgba(231, 76, 60, 0.1);
      color: var(--red-primary);
    }

    /* 输入区域 */
    .input-area {
      padding: 12px 16px;
      background: linear-gradient(0deg, var(--bg-deepest), var(--bg-panel));
      border-top: 1px solid var(--border-primary);
      flex-shrink: 0;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .quick-action-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: var(--bg-block);
      border: 1px solid var(--border-primary);
      border-radius: 16px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .quick-action-btn:hover {
      background: rgba(45, 90, 90, 0.3);
      border-color: var(--border-highlight);
      color: var(--text-primary);
    }

    .input-box {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 10px;
      background: var(--bg-block);
      border-radius: 12px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .input-box:focus-within {
      border-color: var(--border-highlight);
      box-shadow: 0 0 20px rgba(61, 122, 122, 0.1);
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      font-family: var(--font-body);
    }

    .input-box textarea::placeholder {
      color: var(--text-tertiary);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #c9a227, #a08020);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(201, 162, 39, 0.3);
    }

    .send-btn:disabled {
      background: rgba(45, 90, 90, 0.3);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      color: var(--bg-deepest);
    }

    .send-btn:disabled svg {
      color: var(--text-tertiary);
    }

    /* 面板头部 */
    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-title);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .panel-icon {
      width: 20px;
      height: 20px;
      color: var(--gold-primary);
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-block);
      border: 1px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 18px;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      border-color: var(--red-primary);
      color: var(--red-primary);
    }

    /* 面板内容 */
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* 角色面板样式 */
    .character-avatar {
      text-align: center;
      margin-bottom: 20px;
    }

    .avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2d5a5a, #1a3a3a);
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 36px;
      position: relative;
      box-shadow: 0 0 20px rgba(201, 162, 39, 0.2);
    }

    .avatar-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 24px;
      height: 24px;
      background: var(--gold-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .character-name {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 600;
      color: var(--gold-primary);
      margin-bottom: 8px;
    }

    .character-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .tag {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .tag.gold {
      background: linear-gradient(90deg, rgba(201, 162, 39, 0.2), rgba(201, 162, 39, 0.1));
      border: 1px solid rgba(201, 162, 39, 0.5);
      color: var(--gold-primary);
    }

    .tag.cyan {
      background: linear-gradient(90deg, rgba(90, 184, 184, 0.2), rgba(90, 184, 184, 0.1));
      border: 1px solid rgba(90, 184, 184, 0.5);
      color: var(--cyan-secondary);
    }

    /* 信息卡片 */
    .info-card {
      background: var(--bg-block);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .info-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 500;
    }

    .info-card-header.cyan { color: var(--cyan-secondary); }
    .info-card-header.gold { color: var(--gold-primary); }
    .info-card-header.green { color: #8bc34a; }
    .info-card-header.purple { color: #b388ff; }

    .info-card-content {
      font-size: 13px;
      color: var(--text-primary);
      font-family: var(--font-title);
      padding-left: 22px;
    }

    /* 属性条 */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .stat-bar {
      height: 6px;
      background: rgba(45, 90, 90, 0.3);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .stat-bar-fill.health { background: linear-gradient(90deg, #E74C3C, #c0392b); }
    .stat-bar-fill.mana { background: linear-gradient(90deg, #3498db, #2980b9); }
    .stat-bar-fill.spirit { background: linear-gradient(90deg, #9B59B6, #8e44ad); }

    /* 灵石展示 */
    .spirit-stones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stone-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(10, 10, 15, 0.3);
      border-radius: 6px;
      font-size: 12px;
    }

    .stone-label {
      color: var(--text-gray);
    }

    .stone-value {
      font-weight: 500;
    }

    .stone-value.low { color: var(--text-primary); }
    .stone-value.medium { color: var(--cyan-secondary); }
    .stone-value.high { color: var(--gold-primary); }
    .stone-value.top { color: var(--red-primary); }

    /* Tab 切换 */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border-primary);
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 13px;
      color: var(--cyan-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      border-bottom: 2px solid transparent;
      font-family: var(--font-title);
    }

    .tab.active {
      color: var(--gold-primary);
      border-bottom-color: var(--gold-primary);
    }

    /* 世界事件 */
    .world-info {
      background: linear-gradient(90deg, rgba(201, 162, 39, 0.1), transparent);
      border: 1px solid rgba(201, 162, 39, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .world-info-content {
      font-family: var(--font-title);
      font-size: 14px;
      color: var(--gold-primary);
    }

    .time-info {
      background: linear-gradient(90deg, rgba(61, 106, 106, 0.2), transparent);
      border: 1px solid rgba(61, 106, 106, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #7ababa;
    }

    /* 事件列表 */
    .event-item {
      background: var(--bg-block);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .event-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .event-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .event-dot.urgent { background: var(--red-primary); }
    .event-dot.important { background: var(--gold-primary); }
    .event-dot.normal { background: var(--cyan-secondary); }

    .event-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      font-family: var(--font-title);
    }

    .event-desc {
      font-size: 11px;
      color: var(--text-gray);
      padding-left: 16px;
    }

    /* 人物列表 */
    .character-list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--bg-block);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .character-list-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2d5a5a, #1a3a3a);
      border: 1px solid var(--border-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .character-list-avatar.npc {
      background: linear-gradient(135deg, #c9a227, #a08020);
      border-color: var(--gold-light);
    }

    .character-list-info {
      flex: 1;
      min-width: 0;
    }

    .character-list-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .character-list-desc {
      font-size: 11px;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .character-list-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .character-list-status.online {
      background: rgba(78, 201, 78, 0.2);
      color: #4ec94e;
    }

    .character-list-status.busy {
      background: rgba(201, 162, 39, 0.2);
      color: var(--gold-primary);
    }

    /* 人物菜单 */
    .character-menu {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-panel);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      padding: 6px 0;
      min-width: 120px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 50;
      animation: fadeIn 0.2s ease;
    }

    .character-menu-item {
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .character-menu-item:hover {
      background: rgba(45, 90, 90, 0.3);
      color: var(--text-primary);
    }

    .character-list-item {
      position: relative;
      cursor: pointer;
    }

    /* 摆摊按钮 */
    .stall-btn {
      width: 100%;
      padding: 10px;
      background: rgba(78, 205, 196, 0.1);
      border: 1px solid rgba(78, 205, 196, 0.3);
      border-radius: 8px;
      color: var(--cyan-primary);
      font-size: 14px;
      font-family: var(--font-title);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .stall-btn:hover {
      background: rgba(78, 205, 196, 0.2);
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text-tertiary);
    }

    .empty-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--bg-block);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
    }

    .empty-text {
      font-size: 14px;
    }

    /* 对话框 */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
    }

    .modal-content {
      position: relative;
      background: var(--bg-panel);
      border: 1px solid var(--border-primary);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-primary);
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      font-family: var(--font-body);
    }

    .btn-primary {
      background: linear-gradient(135deg, #c9a227, #a08020);
      color: var(--bg-deepest);
      font-weight: 500;
    }

    .btn-primary:hover {
      box-shadow: 0 4px 12px rgba(201, 162, 39, 0.3);
    }

    .btn-secondary {
      background: var(--bg-block);
      border: 1px solid var(--border-primary);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      border-color: var(--border-highlight);
      color: var(--text-primary);
    }

    /* 背包物品 */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .inventory-item {
      aspect-ratio: 1;
      background: var(--bg-block);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .inventory-item:hover {
      border-color: var(--border-highlight);
    }

    .inventory-item-icon {
      font-size: 24px;
    }

    .inventory-item-count {
      position: absolute;
      bottom: 4px;
      right: 4px;
      font-size: 10px;
      color: var(--text-secondary);
      background: rgba(0, 0, 0, 0.5);
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* 装备槽 */
    .equipment-slots {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .equipment-slot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-block);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
    }

    .equipment-slot-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: rgba(10, 10, 15, 0.3);
      border: 1px dashed var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .equipment-slot-icon.filled {
      background: rgba(45, 90, 90, 0.2);
      border-style: solid;
      border-color: var(--border-highlight);
    }

    .equipment-slot-info {
      flex: 1;
    }

    .equipment-slot-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .equipment-slot-type {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* 打字效果 */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: var(--bg-block);
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .typing-dots {
      display: flex;
      gap: 3px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--cyan-secondary);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* 响应式适配 */
    @media (min-width: 768px) {
      .side-panel {
        position: relative;
        transform: none !important;
        width: 280px;
        max-width: 280px;
      }

      .side-panel.left {
        border-right: 1px solid var(--border-primary);
      }

      .side-panel.right {
        border-left: 1px solid var(--border-primary);
      }

      .overlay {
        display: none !important;
      }

      .toggle-btn {
        display: none;
      }

      .close-btn {
        display: none;
      }
    }

    /* Markdown 样式 */
    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4 {
      color: var(--gold-primary);
      margin: 12px 0 8px;
      font-family: var(--font-title);
    }

    .markdown-content h1 { font-size: 16px; }
    .markdown-content h2 { font-size: 15px; }
    .markdown-content h3 { font-size: 14px; }

    .markdown-content p {
      margin-bottom: 8px;
    }

    .markdown-content strong {
      color: var(--gold-light);
      font-weight: 600;
    }

    .markdown-content em {
      color: var(--text-secondary);
      font-style: italic;
    }

    .markdown-content code {
      background: rgba(45, 90, 90, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--gold-light);
    }

    .markdown-content blockquote {
      border-left: 3px solid var(--gold-primary);
      background: rgba(45, 90, 90, 0.2);
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: 0 4px 4px 0;
      color: var(--text-secondary);
    }

    .markdown-content ul, .markdown-content ol {
      padding-left: 20px;
      margin-bottom: 8px;
    }

    .markdown-content li {
      margin-bottom: 4px;
    }

    .markdown-content a {
      color: var(--border-interactive);
      text-decoration: none;
    }

    .markdown-content hr {
      border: none;
      border-top: 1px solid var(--border-primary);
      margin: 12px 0;
    }
  </style>
</head>

    // ==================== 面板切换 ====================
    function toggleLeftPanel() {
      const panel = document.getElementById('leftPanel');
      const overlay = document.getElementById('overlay');
      const isOpen = panel.classList.contains('open');
      
      if (isOpen) {
        panel.classList.remove('open');
        overlay.classList.remove('show');
      } else {
        panel.classList.add('open');
        overlay.classList.add('show');
        document.getElementById('rightPanel').classList.remove('open');
      }
    }

    function toggleRightPanel() {
      const panel = document.getElementById('rightPanel');
      const overlay = document.getElementById('overlay');
      const isOpen = panel.classList.contains('open');
      
      if (isOpen) {
        panel.classList.remove('open');
        overlay.classList.remove('show');
      } else {
        panel.classList.add('open');
        overlay.classList.add('show');
        document.getElementById('leftPanel').classList.remove('open');
      }
    }

      document.getElementById('leftPanel').classList.remove('open');
      document.getElementById('rightPanel').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');

    function showCharacterMenu(event, index) {
      event.stopPropagation();

      if (activeMenu) {
        activeMenu.remove();
        activeMenu = null;
      }
      
      const char = mockData.nearbyCharacters[index];
      const menu = document.createElement('div');
      menu.className = 'character-menu';
      menu.innerHTML = `
        <div class="character-menu-item" onclick="handleCharacterAction('${char.name}', 'chat')">
          <span>💬</span>
          <span>交谈</span>
        </div>
        <div class="character-menu-item" onclick="handleCharacterAction('${char.name}', 'trade')">
          <span>💰</span>
          <span>交易</span>
        </div>
        <div class="character-menu-item" onclick="handleCharacterAction('${char.name}', 'observe')">
          <span>👁️</span>
          <span>观察</span>
        </div>
        ${char.hasStall ? `
        <div class="character-menu-item" onclick="handleCharacterAction('${char.name}', 'visit')">
          <span>🏪</span>
          <span>逛摊位</span>
        </div>
        ` : ''}

      event.currentTarget.appendChild(menu);
      activeMenu = menu;

    function handleCharacterAction(charName, action) {
      if (activeMenu) {
        activeMenu.remove();
        activeMenu = null;
      }
      
      const actionMap = {
        'chat': { text: `与${charName}交谈`, content: `你好，${charName}，我有些问题想请教。` },
        'trade': { text: `与${charName}交易`, content: `${charName}，我想看看你有什么好东西。` },
        'observe': { text: `观察${charName}`, content: `我仔细打量了一下${charName}。` },
        'visit': { text: `逛${charName}的摊位`, content: `让我看看你的摊位上有什么好东西。` }
      };
      
      const actionInfo = actionMap[action];
      
      // 添加玩家消息
      const playerMsg = {
        id: Date.now(),
        type: 'player',
        sender: 'player',
        content: actionInfo.content,
        timestamp: Date.now()
      };
      
      messages.push(playerMsg);
      renderMessages();
      
      // 触发世界事件更新
      updateWorldAfterInteraction(charName, action);
      
      // 模拟回复
      simulateCharacterResponse(charName, action);
    }

    function updateWorldAfterInteraction(charName, action) {
      // 根据交互更新世界事件
      if (action === 'trade' || action === 'visit') {
        // 添加新的世界事件
        const newEvent = {
          id: Date.now(),
          title: `${charName}的交易`,
          description: `你刚刚与${charName}进行了交易，获得了一些有用信息`,
          type: 'normal'
        };
        mockData.world.events.unshift(newEvent);
        
        // 限制事件数量
        if (mockData.world.events.length > 5) {
          mockData.world.events.pop();
        }
        
        // 更新时间
        mockData.world.time = '午时';
        mockData.world.timePeriod = '正午';
      } else if (action === 'chat') {
        // 更新人物状态
        const char = mockData.nearbyCharacters.find(c => c.name === charName);
        if (char) {
          char.currentAction = '与你交谈中';
        }
      }
      
      // 刷新世界面板
      if (currentTab === 'events') {
        renderWorldPanel();
      }
    }

    // ==================== 渲染消息 ====================
    function renderMessages() {
      const list = document.getElementById('messageList');
      list.innerHTML = messages.map(msg => renderMessage(msg)).join('');
      scrollToBottom();
    }

    function renderMessage(msg) {
      const time = formatTime(msg.timestamp);
      
      if (msg.type === 'system') {
        return `
          <div class="message system">
            <div class="bubble">${msg.content}</div>
          </div>
        `;
      }
      
      if (msg.type === 'event') {
        return `
          <div class="message event">
            <div class="bubble">
              <div class="markdown-content">${parseMarkdown(msg.content)}</div>
            </div>
          </div>
        `;
      }
      
      const isPlayer = msg.sender === 'player';
      const avatar = isPlayer ? '👤' : (msg.senderAvatar || '🧙');
      const contextInfo = !isPlayer && (msg.gameDate || msg.location) ? `
        <div class="context-info">
          ${msg.gameDate || ''} ${msg.gameShichen ? '· ' + msg.gameShichen : ''} ${msg.location ? '· ' + msg.location : ''}
        </div>
      ` : '';
      
      const karmaBadge = msg.karmaChange ? `
        <div class="karma-change ${msg.karmaChange > 0 ? 'positive' : 'negative'}">
          ${msg.karmaChange > 0 ? '功德 +' + msg.karmaChange : '业障 ' + msg.karmaChange}
        </div>
      ` : '';
      
      const actionButtons = msg.actions && msg.actions.length > 0 ? `
        <div class="action-buttons">
          ${msg.actions.map(action => `
            <button class="action-btn" onclick="handleAction('${action}')">${action}</button>
          `).join('')}
        </div>
      ` : '';
      
      return `
        <div class="message ${isPlayer ? 'player' : 'npc'}">
          <div class="avatar">${avatar}</div>
          <div class="message-content">
            ${!isPlayer && msg.senderName ? `<div class="sender-name">${msg.senderName}</div>` : ''}
            ${contextInfo}
            <div class="bubble">
              <div class="markdown-content">${parseMarkdown(msg.content)}</div>
            </div>
            ${karmaBadge}
            <div class="timestamp">${time}</div>
            ${actionButtons}
          </div>
        </div>
      `;
    }

    // ==================== Markdown 解析 ====================
    function parseMarkdown(text) {
      if (!text) return '';
      
      // 粗体 **text**
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      
      // 斜体 *text*
      text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
      
      // 代码 `text`
      text = text.replace(/`(.+?)`/g, '<code>$1</code>');
      
      // 换行
      text = text.replace(/\n/g, '<br>');
      
      return text;
    }

    // ==================== 消息操作 ====================
    function handleAction(action) {
      document.getElementById('messageInput').value = action;
      autoResize(document.getElementById('messageInput'));
      updateSendButton();
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
    }

    function scrollToBottom() {
      const list = document.getElementById('messageList');
      list.scrollTop = list.scrollHeight;
    }

    // ==================== 输入处理 ====================
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
      updateSendButton();
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function updateSendButton() {
      const input = document.getElementById('messageInput');
      const btn = document.getElementById('sendBtn');
      btn.disabled = !input.value.trim() || isLoading;
    }

    // ==================== 发送消息 ====================
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      
      if (!content || isLoading) return;
      
      // 添加玩家消息
      const playerMsg = {
        id: Date.now(),
        type: 'player',
        sender: 'player',
        content: content,
        timestamp: Date.now()
      };
      
      messages.push(playerMsg);
      renderMessages();
      
      // 清空输入
      input.value = '';
      input.style.height = 'auto';
      updateSendButton();
      
      // 模拟AI回复
      simulateAIResponse();
    }

              <div style="font-size: 10px; color: var(--text-tertiary); margin-top: 6px; padding-left: 16px;">
                状态: ${event.status === 'completed' ? '已完成' : '进行中'}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderHistory() {
      const content = document.getElementById('historyContent');
      content.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 12px;">
          ${mockData.history.map(entry => `
            <div class="info-card">
              <div class="info-card-header gold">
                <span>📅</span>
                <span>${entry.date}</span>
              </div>
              <div class="info-card-content" style="padding-left: 0; margin-top: 8px;">
                <div style="font-size: 11px; color: var(--cyan-secondary); margin-bottom: 4px;">📍 ${entry.location}</div>
                <div>${entry.summary}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ==================== 工具函数 ====================
    function showToast(message) {
      // 简单的提示实现
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(13, 31, 31, 0.95);
        border: 1px solid var(--border-primary);
        border-radius: 12px;
        padding: 16px 24px;
        color: var(--text-primary);
        font-size: 14px;
        z-index: 300;
        animation: fadeIn 0.3s ease;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, 2000);
    }

    // ==================== 初始化 ====================
    init();
  </script>
</body>
</html>
