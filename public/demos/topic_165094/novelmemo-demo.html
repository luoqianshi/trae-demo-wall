      // 高亮词典：每个词对应的难度（1-4：A2/B1/B2/C1）
      // 4 = C1 高级（最难），1 = A2 初级（最容易）
      const WORD_LEVEL = {
        magnificent: 2, primeval: 4, boa: 2, constrictor: 3, swallow: 2, pondered: 3,
        masterpiece: 2, frightened: 1, digested: 2, painter: 1, desert: 1, engine: 1,
        failure: 1, lightning: 1, blinked: 1, baobabs: 4, troublesome: 2, mighty: 2,
        planet: 1, rose: 1, vanity: 3, tamed: 3, fox: 1, secret: 1, rosebush: 3,
        wander: 2, cheerful: 2, curious: 1, timid: 2, grave: 1, earnestly: 3,
        peculiar: 3, absurdity: 3, monotonous: 4, longing: 3, revel: 3,
        acquaintance: 2, civilization: 3, imitate: 2, conceited: 3, stammer: 3,
        ridiculous: 2, attentive: 2, profound: 3, convinced: 2, wheat: 2,
        emperor: 2, reigned: 3, obedience: 3, absurd: 2,
      }

      // 词干还原（用于跨段去重）
      function stem(w) {
        w = w.toLowerCase().replace(/[^a-z]/g, '')
        if (w.endsWith('ies') && w.length > 4) return w.slice(0, -3) + 'y'
        if (w.endsWith('ing') && w.length > 5) return w.slice(0, -3)
        if (w.endsWith('ed') && w.length > 4) return w.slice(0, -2)
        if (w.endsWith('es') && w.length > 4) return w.slice(0, -2)
        if (w.endsWith('s') && w.length > 3) return w.slice(0, -1)
        return w
      }

      // 词汇等级阈值
      // A2 (初级): level <= 2, 标 4-5 个/段
      // B1 (中级): level <= 2, 标 3-4 个/段
      // B2 (中高级): level <= 3, 标 2-3 个/段
      // C1 (高级): level <= 4, 标 1-2 个/段
      const LEVEL_CFG = {
        A2: { threshold: 2, perPara: [4, 5] },
        B1: { threshold: 2, perPara: [3, 4] },
        B2: { threshold: 3, perPara: [2, 3] },
        C1: { threshold: 4, perPara: [1, 2] },
      }

      // 提取高亮词（按出现顺序，按等级筛选 + 段内去重）
      function extractHighlights(text, level) {
        const cfg = LEVEL_CFG[level]
        const seen = new Set()
        const out = []
        const tokens = text.match(/[A-Za-z][A-Za-z'-]*/g) || []
        // 常见词黑名单
        const stop = new Set(['a','an','and','are','as','at','be','been','but','by','can','could','did','do','does','for','from','had','has','have','he','her','him','his','i','if','in','into','is','it','its','me','my','not','of','on','or','our','said','she','so','that','the','their','them','then','there','they','this','to','up','was','we','were','what','when','which','who','will','with','would','you','your','all','any','some','no','yes','out','one','two','three'])
        for (const raw of tokens) {
          const w = raw.toLowerCase().replace(/^'|'$/g, '')
          if (w.length < 5) continue
          if (stop.has(w) || stop.has(stem(w))) continue
          if (!(w in DICT)) continue
          const lvl = WORD_LEVEL[w] || 2
          if (lvl > cfg.threshold) continue
          const s = stem(w)
          if (seen.has(s)) continue
          seen.add(s)
          out.push({ word: w, level: lvl >= 3 ? 'red' : 'yellow' })
          if (out.length >= cfg.perPara[1]) break
        }
        return out.slice(0, cfg.perPara[1])
      }

      // 把文本中的高亮词用 <span> 包起来
      function renderHighlightedText(text, level) {
        const highlights = extractHighlights(text, level)
        if (highlights.length === 0) return escapeHtml(text)
        const pattern = new RegExp(`\\b(${highlights.map(h => h.word).join('|')})\\b`, 'gi')
        const parts = text.split(pattern)
        let html = ''
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i]
          if (i % 2 === 0) {
            html += escapeHtml(p)
          } else {
            const lower = p.toLowerCase()
            const hi = highlights.find(h => h.word === lower)
            html += `<span class="word-${hi.level}" data-word="${hi.word}">${escapeHtml(p)}</span>`
          }
        }
        return html
      }

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      }

          // 解析 bookId
          const bookId = decodeURIComponent(route.params[0] || STATE.currentBookId)

            STATE.currentBookId = bookId

                      <div class="flex items-center gap-2">
                        <div class="flex-1 progress-track">
                          <div class="progress-fill" style="width: ${Math.round((b.last_read_page / b.total_pages) * 100)}%"></div>
                        </div>
                        <span class="text-xs text-ink-faint">${Math.round((b.last_read_page / b.total_pages) * 100)}%</span>
                      </div>
                    </div>
                  </div>
                </a>
              `).join('')}
            </div>

            <!-- 特性介绍 -->
            <div class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-4">
              ${[
                { icon: '📖', title: '双栏英中对照', desc: '原汁原味分页，左英文右中文' },
                { icon: '✨', title: '生词分级高亮', desc: '黄=重点词，红=生僻词，点击即查' },
                { icon: '🕸️', title: 'AI 每页复盘', desc: '剧情总结 + 人物关系动态图' },
              ].map(f => `
                <div class="card p-4">
                  <div class="text-2xl mb-2">${f.icon}</div>
                  <div class="font-serif font-medium text-ink mb-1">${f.title}</div>
                  <div class="text-xs text-ink-soft">${f.desc}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `
      }

      function renderReader() {
        const book = getCurrentBook()
        const page = getCurrentPage()
        if (!page) return '<div class="p-8 text-center text-ink-soft">没有内容</div>'
        const progress = Math.round(((STATE.pageIdx + 1) / book.total_pages) * 100)

        return `
          <div class="min-h-screen flex flex-col">
            <!-- 阅读顶栏 -->
            <div class="h-14 border-b border-line bg-paper/90 backdrop-blur-sm flex items-center justify-between px-4 sticky top-14 z-10">
              <div class="flex items-center gap-3">
                <a href="#/home" class="flex items-center gap-2 text-ink-soft hover:text-ink text-sm">
                  <span>←</span><span>书架</span>
                </a>
                <div class="w-px h-5 bg-line"></div>
                <div class="leading-tight">
                  <div class="font-serif text-sm font-medium text-ink">${book.title}</div>
                  <div class="text-[10px] text-ink-faint">${book.author} · ${page.chapter || '第 ' + page.page_number + ' 页'}</div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="openRecap()" class="text-xs px-2.5 py-1.5 rounded-lg border border-amber text-amber hover:bg-amber/10 flex items-center gap-1.5">
                  ✨ 复盘
                </button>
                <button onclick="openGraph()" class="text-xs px-2.5 py-1.5 rounded-lg border border-amber text-amber hover:bg-amber/10 flex items-center gap-1.5">
                  🕸️ 关系
                </button>
              </div>
            </div>

            <!-- 进度条 -->
            <div class="h-1 bg-vanilla/30 sticky top-28 z-10">
              <div class="h-full bg-amber transition-all" style="width: ${progress}%"></div>
            </div>

            <!-- 章节头 -->
            <div class="text-center py-6 px-6">
              ${page.chapter ? `<div class="font-serif text-amber text-sm mb-1">${page.chapter}</div>` : ''}
              <div class="text-xs text-ink-faint">— ${page.page_number} / ${book.total_pages} —</div>
            </div>

            <!-- 双栏 -->
            <div class="flex-1 max-w-5xl mx-auto px-6 w-full">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                <!-- 左：英文 -->
                <div class="reading-text text-ink space-y-4" style="font-size: ${STATE.fontSize}px; line-height: 1.8;">
                  ${page.paragraphs.map(p => `
                    <p class="leading-loose">${renderHighlightedText(p.en, STATE.vocabLevel)}</p>
                  `).join('')}
                </div>
                <!-- 右：中文 -->
                <div class="border-l border-line pl-6 space-y-4" style="font-size: ${STATE.fontSize - 1}px; line-height: 1.8;">
                  ${STATE.translationStatus === 'loading' ? `
                    <div class="flex items-center gap-2 text-sm text-ink-soft py-4">
                      <div class="w-1.5 h-1.5 rounded-full bg-amber animate-pulse-soft"></div>
                      正在调用 AI 翻译本页…
                    </div>
                  ` : page.paragraphs.map(p => `
                    <p class="font-serif text-ink-soft leading-loose">${escapeHtml(p.zh)}</p>
                  `).join('')}
                </div>
              </div>

              <!-- 翻页 -->
              <div class="flex justify-between items-center pt-6 border-t border-line">
                <button onclick="prevPage()" ${STATE.pageIdx === 0 ? 'disabled' : ''} class="btn-ghost">← 上一页</button>
                <div class="text-xs text-ink-faint">按 ← → 翻页</div>
                <button onclick="nextPage()" ${STATE.pageIdx === book.total_pages - 1 ? 'disabled' : ''} class="btn-primary">下一页 →</button>
              </div>

              <!-- 本页生词速览 -->
              ${renderPageWordSummary(page)}
            </div>
          </div>
        `
      }

      function renderPageWordSummary(page) {
        const allWords = page.paragraphs.flatMap(p => extractHighlights(p.en, STATE.vocabLevel))
        if (allWords.length === 0) return ''
        const chips = allWords.map(w => {
          const isCollected = STATE.collected.has(w.word)
          const cls = w.level === 'red'
            ? 'border-amber/40 bg-amber/10 text-amber hover:bg-amber/20'
            : 'border-bronze/40 bg-bronze/10 text-ink hover:bg-bronze/20'
          const star = isCollected ? '<span class="text-[9px] text-amber">★</span>' : ''
          return '<button onclick="openDict(\'' + w.word + '\', event)" class="text-xs px-2 py-1 rounded border transition-colors flex items-center gap-1 ' + cls + '">' + escapeHtml(w.word) + star + '</button>'
        }).join('')
        return [
          '<div class="mt-8 p-4 card">',
            '<div class="text-xs text-ink-faint mb-2">本页生词速览（' + allWords.length + '）</div>',
            '<div class="flex flex-wrap gap-2">' + chips + '</div>',
          '</div>'
        ].join('')
      }

      function renderDictBubble() {
        if (!STATE.dictWord) return ''
        const word = STATE.dictWord
        const entry = DICT[word]
        if (!entry) return ''
        const collected = STATE.collected.has(word)
        // 调整位置
        const w = 360
        let x = STATE.dictPos.x
        let y = STATE.dictPos.y + 28
        if (x + w > window.innerWidth) x = window.innerWidth - w - 12
        if (y + 420 > window.innerHeight) y = STATE.dictPos.y - 420 - 12
        x = Math.max(x, 12); y = Math.max(y, 12)

        return `
          <div data-dict="1" class="fixed z-50 card p-4 animate-slide-up" style="left: ${x}px; top: ${y}px; width: ${w}px;">
            <div class="flex items-start justify-between gap-3 mb-3">
              <div>
                <div class="font-serif text-xl font-semibold text-ink">${word}</div>
                <div class="text-xs text-ink-faint mt-1">${entry.phonetic} <span class="text-amber italic">${entry.pos}</span></div>
              </div>
              <button onclick="closeDict()" class="text-ink-faint hover:text-ink text-lg leading-none">✕</button>
            </div>
            <div class="max-h-64 overflow-y-auto space-y-1.5 border-t border-line pt-2">
              ${entry.meanings.map((m, i) => `
                <div class="pl-2 border-l-2 border-bronze/40 text-sm text-ink leading-relaxed">${i+1}. ${m}</div>
              `).join('')}
            </div>
            <div class="mt-3 flex gap-2">
              <button onclick="toggleCollect('${word}')" class="flex-1 text-sm py-1.5 rounded-lg ${collected ? 'bg-celadon/40 text-ink-faint cursor-not-allowed' : 'bg-amber text-white hover:bg-amber/90'}">
                ${collected ? '✓ 已收藏' : '收藏到生词本'}
              </button>
              <button onclick="pronounce('${word}')" class="btn-ghost text-sm py-1.5" title="朗读">🔊</button>
            </div>
            <div class="mt-2 text-[10px] text-ink-faint text-center">本词典为本地 mock 数据</div>
          </div>
        `
      }

      function renderRecap() {
        if (!STATE.showRecap) return ''
        const page = getCurrentPage()
        const charsInPage = (page.characters || []).map(id => CHARACTERS.find(c => c.id === id)).filter(Boolean)
        return `
          <div onclick="closeRecap()" class="fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-6 animate-fade-in">
            <div onclick="event.stopPropagation()" class="card w-full max-w-2xl max-h-[80vh] overflow-y-auto">
              <div class="px-5 py-3 border-b border-line flex items-center justify-between bg-celadon/20">
                <div class="flex items-center gap-2">
                  <span>✨</span>
                  <span class="font-serif font-medium text-ink">第 ${page.page_number} 页 · AI 复盘</span>
                </div>
                <button onclick="closeRecap()" class="text-ink-faint hover:text-ink text-lg">✕</button>
              </div>
              <div class="p-5 space-y-4">
                <div>
                  <div class="text-xs text-ink-faint mb-1">📝 本页总结</div>
                  <div class="text-sm text-ink leading-relaxed">${escapeHtml(page.summary || '暂无复盘')}</div>
                </div>
                ${charsInPage.length > 0 ? `
                  <div>
                    <div class="text-xs text-ink-faint mb-2">👥 出场人物</div>
                    <div class="flex flex-wrap gap-2">
                      ${charsInPage.map(c => `
                        <div class="text-xs px-2 py-1 rounded-full bg-bronze/20 text-ink-soft flex items-center gap-1">
                          <span class="w-1.5 h-1.5 rounded-full ${c.status === 'deceased' ? 'bg-red-400' : c.status === 'inactive' ? 'bg-yellow-400' : 'bg-green-400'}"></span>
                          ${c.name}
                        </div>
                      `).join('')}
                    </div>
                  </div>
                  <div>
                    <div class="text-xs text-ink-faint mb-2">🔗 人物关系</div>
                    <div class="space-y-1.5">
                      ${RELATIONS.filter(r => charsInPage.find(c => c.id === r.from) && charsInPage.find(c => c.id === r.to)).map(r => {
                        const fromC = CHARACTERS.find(c => c.id === r.from)
                        const toC = CHARACTERS.find(c => c.id === r.to)
                        return `
                          <div class="text-xs p-2 rounded bg-honeydew">
                            <div class="text-ink font-medium">${fromC?.name} <span class="text-amber">↔ ${r.type} ↔</span> ${toC?.name}</div>
                            <div class="text-ink-faint mt-0.5 italic">${escapeHtml(r.event)}</div>
                          </div>
                        `
                      }).join('') || '<div class="text-xs text-ink-faint">本页无新关系</div>'}
                    </div>
                  </div>
                ` : ''}
                <div class="text-[10px] text-ink-faint text-center pt-2 border-t border-line">
                  本复盘为本地 mock 数据 · 正式版由 AI 根据本页原文实时生成
                </div>
              </div>
            </div>
          </div>
        `
      }

      function renderGraph() {
        if (!STATE.showGraph) return ''
        const chars = CHARACTERS
        const rels = RELATIONS
        // 简单定位
        const cx = 280, cy = 260
        const positions = {}
        chars.forEach((c, i) => {
          const angle = (i / chars.length) * Math.PI * 2 - Math.PI / 2
          const r = 140 + (i % 2) * 30
          positions[c.id] = { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r }
        })
        const STATUS_DOT = { active: '#7a9a4a', inactive: '#c0a060', deceased: '#8a4a3a' }
        return `
          <div onclick="closeGraph()" class="fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-6 animate-fade-in">
            <div onclick="event.stopPropagation()" class="card w-full max-w-4xl h-[80vh] flex flex-col">
              <div class="px-5 py-3 border-b border-line flex items-center justify-between bg-celadon/20">
                <div class="flex items-center gap-2">
                  <span>🕸️</span>
                  <span class="font-serif font-medium text-ink">人物关系图</span>
                  <span class="text-xs text-ink-faint">${chars.length} 人 · ${rels.length} 段关系</span>
                </div>
                <button onclick="closeGraph()" class="text-ink-faint hover:text-ink text-lg">✕</button>
              </div>
              <div class="flex-1 relative overflow-hidden bg-honeydew">
                <svg viewBox="0 0 560 520" class="w-full h-full">
                  <!-- 关系线 -->
                  ${rels.map(r => {
                    const a = positions[r.from], b = positions[r.to]
                    if (!a || !b) return ''
                    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2
                    return `
                      <g>
                        <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgb(var(--bronze))" stroke-width="1.5" opacity="0.7"/>
                        <circle cx="${mx}" cy="${my}" r="16" fill="rgb(var(--paper))" stroke="rgb(var(--bronze))" stroke-width="1"/>
                        <text x="${mx}" y="${my+4}" text-anchor="middle" font-size="11" fill="rgb(var(--ink-soft))">${r.type}</text>
                      </g>
                    `
                  }).join('')}
                  <!-- 节点 -->
                  ${chars.map(c => {
                    const p = positions[c.id]
                    if (!p) return ''
                    const dot = STATUS_DOT[c.status] || STATUS_DOT.active
                    return `
                      <g transform="translate(${p.x}, ${p.y})">
                        <circle cx="0" cy="0" r="26" fill="${c.status === 'deceased' ? '#8a4a3a' : 'rgb(var(--bronze))'}" stroke="rgb(var(--vanilla))" stroke-width="2"/>
                        <text x="0" y="6" text-anchor="middle" font-size="18" fill="white" font-weight="600" font-family="serif">${c.name.slice(0,1)}</text>
                        <circle cx="18" cy="18" r="6" fill="${dot}" stroke="rgb(var(--paper))" stroke-width="1.5"/>
                        <text x="0" y="48" text-anchor="middle" font-size="12" fill="rgb(var(--ink))" font-weight="500">${c.name}</text>
                      </g>
                    `
                  }).join('')}
                </svg>
              </div>
              <div class="px-5 py-2 border-t border-line text-[10px] text-ink-faint flex items-center gap-4">
                <span>图例：</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${STATUS_DOT.active}"></span>活跃</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${STATUS_DOT.inactive}"></span>暂退</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${STATUS_DOT.deceased}"></span>已逝</span>
                <span class="ml-auto">本图为本地 mock 数据</span>
              </div>
            </div>
          </div>
        `
      }

      function renderWordbook() {
        const words = [...STATE.collected]
        return `
          <div class="max-w-3xl mx-auto px-6 py-8 animate-fade-in">
            <h2 class="font-serif text-2xl font-semibold text-ink mb-1">生词本</h2>
            <p class="text-sm text-ink-soft mb-6">演示模式：收藏的词只存在本浏览器 localStorage</p>
            ${words.length === 0 ? `
              <div class="card p-12 text-center">
                <div class="text-5xl mb-3">📭</div>
                <div class="font-serif text-lg text-ink mb-1">生词本空空如也</div>
                <div class="text-sm text-ink-soft mb-4">去阅读页点击黄色/红色单词即可收藏</div>
                <a href="#/reader/little_prince" class="btn-primary inline-block">去读《小王子》</a>
              </div>
            ` : `
              <div class="card divide-y divide-line">
                ${words.map(w => {
                  const e = DICT[w]
                  if (!e) return ''
                  return `
                    <div class="p-4 flex items-start justify-between gap-3">
                      <div class="flex-1">
                        <div class="flex items-baseline gap-2">
                          <span class="font-serif text-lg font-semibold text-ink">${w}</span>
                          <span class="text-xs text-ink-faint">${e.phonetic}</span>
                          <span class="text-xs text-amber italic">${e.pos}</span>
                        </div>
                        <div class="text-sm text-ink-soft mt-1">${e.meanings[0]}</div>
                      </div>
                      <button onclick="toggleCollect('${w}'); render()" class="text-ink-faint hover:text-amber text-sm" title="移除">✕</button>
                    </div>
                  `
                }).join('')}
              </div>
            `}
          </div>
        `
      }

      // ───────────────────────────── 6. 事件绑定 ─────────────────────────────

      function bindGlobalEvents() {
        // 键盘翻页（仅阅读页）
        if (parseRoute().name === 'reader') {
          document.onkeydown = (e) => {
            if (e.key === 'ArrowLeft') prevPage()
            if (e.key === 'ArrowRight') nextPage()
            if (e.key === 'Escape') { closeDict(); closeRecap(); closeGraph() }
          }
        } else {
          document.onkeydown = null
        }
        // 点击空白关闭悬浮词典
        document.addEventListener('click', (e) => {
          if (STATE.dictWord && !e.target.closest('[data-dict]') && !e.target.closest('.word-yellow') && !e.target.closest('.word-red')) {
            STATE.dictWord = null
            render()
          }
        }, { once: true })
        // 词点击
        document.querySelectorAll('.word-yellow, .word-red').forEach(el => {
          el.onclick = (e) => {
            e.stopPropagation()
            const word = el.getAttribute('data-word')
            openDict(word, e)
          }
        })
      }

      // ───────────────────────────── 7. 全局动作（暴露给 inline onclick） ─────────────────────────────

      window.changeVocab = (level) => {
        STATE.vocabLevel = level
        render()
      }
      window.toggleTheme = () => {
        STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark'
        render()
      }
      window.prevPage = () => {
        if (STATE.pageIdx > 0) { STATE.pageIdx--; simulateTranslate(); render() }
      }
      window.nextPage = () => {
        const book = getCurrentBook()
        if (STATE.pageIdx < book.total_pages - 1) { STATE.pageIdx++; simulateTranslate(); render() }
      }
      window.simulateTranslate = () => {
        STATE.translationStatus = 'loading'
        render()
        setTimeout(() => { STATE.translationStatus = 'done'; render() }, 1200)
      }
      window.openDict = (word, e) => {
        STATE.dictWord = word
        STATE.dictPos = { x: e.clientX || window.innerWidth / 2 - 180, y: e.clientY || 200 }
        render()
      }
      window.closeDict = () => { STATE.dictWord = null; render() }
      window.openRecap = () => { STATE.showRecap = true; render() }
      window.closeRecap = () => { STATE.showRecap = false; render() }
      window.openGraph = () => { STATE.showGraph = true; render() }
      window.closeGraph = () => { STATE.showGraph = false; render() }
      window.toggleCollect = (word) => {
        if (STATE.collected.has(word)) STATE.collected.delete(word)
        else STATE.collected.add(word)
        saveCollected()
        render()
      }
      window.pronounce = (word) => {
        try {
          const u = new SpeechSynthesisUtterance(word)
          u.lang = 'en-US'
          u.rate = 0.9
          window.speechSynthesis.cancel()
          window.speechSynthesis.speak(u)
        } catch {}
      }

      // ───────────────────────────── 8. 启动 ─────────────────────────────

      // 初始化默认路由
      if (!location.hash) location.hash = '#/home'
      render()
    </script>
  </body>
</html>
