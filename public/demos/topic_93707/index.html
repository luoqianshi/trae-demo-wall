<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 小导游 Web Demo</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <p class="badge">AI 创意比赛 Demo</p>
        <h1>AI 小导游</h1>
        <p class="lead">输入目的地、出发日期和预算，AI 自动判断适合一日游、外地多日游还是出国旅行，并生成简洁实用的方案。</p>
      </div>
      <div class="hero-actions">
        <button class="ghost-btn" id="fillSampleBtn">填入示例</button>
        <button class="primary-btn" id="generateTopBtn">生成行程</button>
      </div>
    </section>

    <section class="workspace">
      <form class="panel form-panel" id="tripForm">
        <div class="section-title">
          <span>01</span>
          <h2>告诉 AI 你的需求</h2>
        </div>

        <label>
          <span>目的地</span>
          <input id="destination" type="text" placeholder="例如：杭州西湖、上海外滩、北京故宫" />
        </label>

        <label>
          <span>出发地</span>
          <input id="startPoint" type="text" placeholder="例如：杭州东站、学校门口、人民广场" />
        </label>

        <label>
          <span>几月几号出发</span>
          <input id="travelDate" type="text" value="7月20日" placeholder="例如：7月20日、8月1日、寒假第一天" />
        </label>

        <div class="form-grid">
          <label>
            <span>游玩时间（可不填）</span>
            <input id="duration" type="text" value="" placeholder="例如：3天2晚；不填则自动判断" />
          </label>

          <label>
            <span>预算</span>
            <input id="budget" type="text" value="第一天500元，第二天300元，第三天300元" placeholder="例如：总预算1500元；或第一天500，第二天300" />
          </label>
        </div>

        <label>
          <span>兴趣偏好</span>
          <input id="interests" type="text" value="拍照、美食、轻松散步" placeholder="例如：拍照、美食、购物、自然风景、历史文化、海边" />
        </label>

        <label>
          <span>补充要求</span>
          <textarea id="extra" rows="4" placeholder="例如：不要太累、想买小礼物、适合同学一起去"></textarea>
        </label>

        <button class="primary-btn full" type="submit">生成我的行程卡</button>
      </form>

      <section class="panel result-panel">
        <div class="section-title">
          <span>02</span>
          <h2>AI 生成的行程卡</h2>
        </div>

        <div class="trip-card" id="tripCard">
          <div class="empty-state">
            <div class="empty-icon">路线</div>
            <h3>还没有生成行程</h3>
            <p>填写左侧信息后，点击“生成我的行程卡”。生成结果会保持简洁，适合比赛现场展示。</p>
          </div>
        </div>
      </section>
    </section>

    <section class="demo-notes">
      <article>
        <h2>比赛展示亮点</h2>
        <p>这个 Demo 的重点不是做复杂地图，而是展示 AI 如何根据同学的需求生成一张清楚、实用、安全的一日游规划卡。</p>
      </article>
      <article>
        <h2>可以这样介绍</h2>
        <p>“我的作品叫 AI 小导游。它可以帮助同学们规划周末出行，自动安排路线、拍照点、美食和预算，减少绕路和乱花钱。”</p>
      </article>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
