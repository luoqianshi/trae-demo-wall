<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>本草有方 AI - 中医日常调养助手</title>
<style>
:root {
  --brand: #2f6f4e;
  --brand-light: #e8f5ef;
  --brand-dark: #1e4d36;
  --ink: #1f2937;
  --ink-soft: #4b5563;
  --ink-mute: #9ca3af;
  --bg: #f8fafc;
  --card: #ffffff;
  --line: #e5e7eb;
  --line-light: #f3f4f6;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  padding-bottom: calc(70px + var(--safe-bottom));
}

body.large-text { font-size: 20px; }
body.large-text .h1 { font-size: 1.8rem; line-height: 1.5; }
body.large-text .h2 { font-size: 1.5rem; line-height: 1.5; }
body.large-text .btn { font-size: 1.1rem; padding: 16px 24px; min-height: 56px; }
body.large-text .tag { font-size: 1.1rem; padding: 12px 16px; }
body.large-text .card { padding: 24px; }
body.large-text .persona-card { padding: 20px; }
body.large-text .topbar { padding: 16px 20px; }
body.large-text .topbar .logo { width: 32px; height: 32px; font-size: 1.1rem; }
body.large-text .plan-section { padding: 14px; margin-bottom: 10px; }
body.large-text .kv { font-size: 1.05rem; gap: 10px; }
body.large-text .constitution-summary { line-height: 1.8; }
body.large-text .btn.secondary { border-width: 2px; }

#app { max-width: 480px; margin: 0 auto; padding: 0 16px; }

.topbar {
  position: sticky;
  top: 0;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 50;
}
.topbar .flex { display: flex; align-items: center; gap: 8px; }
.topbar .brand { display: flex; align-items: center; gap: 8px; }
.topbar .logo {
  width: 32px; height: 32px;
  background: var(--brand);
  color: #fff;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1rem;
}
.topbar .actions { display: flex; gap: 8px; }

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line-light);
}

.h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; font-family: var(--font-sans); letter-spacing: 0.02em; }
.h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; font-family: var(--font-sans); letter-spacing: 0.01em; }
.h3 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; font-family: var(--font-sans); }
.muted { color: var(--ink-mute); font-size: 0.9rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  border: 1.5px solid var(--brand);
  background: var(--brand);
  color: #fff;
  transition: all 0.2s;
  min-height: 44px;
}
.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.98); }
.btn.block { width: 100%; }
.btn.secondary { background: var(--bg); color: var(--ink); border-color: var(--line); }
.btn.secondary:hover { background: var(--line-light); }
.btn.ghost { background: transparent; color: var(--ink-soft); border-color: transparent; }
.btn.ghost:hover { background: var(--line-light); }
.btn.sm { padding: 8px 12px; font-size: 0.85rem; }
.btn.lg { padding: 16px 24px; font-size: 1.1rem; }
.btn.warn { background: #dc2626; border-color: #dc2626; }
.btn.accent { background: #6366f1; border-color: #6366f1; }

.flex { display: flex; gap: 8px; }
.flex.between { justify-content: space-between; }
.flex.center { align-items: center; }

.persona-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.persona-card {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.persona-card:hover { background: var(--line-light); border-color: var(--line); }
.persona-card:active { transform: scale(0.98); }
.persona-card .emoji { font-size: 1.8rem; margin-bottom: 6px; }
.persona-card .name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
.persona-card .desc { color: var(--ink-mute); font-size: 0.8rem; }

.radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
.check-group { display: flex; flex-wrap: wrap; gap: 8px; }

.tag {
  padding: 10px 14px;
  background: var(--bg);
  border-radius: 20px;
  font-size: 0.9rem;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.tag:hover { border-color: var(--line); }
.tag.active {
  background: var(--brand-light);
  color: var(--brand);
  border-color: var(--brand);
}
.tag .x { font-size: 0.8rem; opacity: 0.6; }

.form-item { margin-bottom: 16px; }
.form-item label { display: block; font-weight: 600; margin-bottom: 8px; }
.input, .select {
  width: 100%;
  padding: 12px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-family: inherit;
  background: #fff;
}
.input:focus, .select:focus { outline: none; border-color: var(--brand); }
textarea.input { resize: vertical; min-height: 80px; }

.sep { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
.spacer { height: 16px; }

.plan-section {
  padding: 14px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  border: 1px solid var(--line-light);
}
.plan-section.replaced { border-color: #fca5a5; background: #fff1f2; }
.plan-section .kv { display: grid; grid-template-columns: 60px 1fr; gap: 6px; margin-top: 8px; }
.plan-section .kv .k { color: var(--ink-mute); font-size: 0.85rem; }
.replaced-note { font-size: 0.85rem; color: #dc2626; margin-top: 8px; }

.constitution-summary { font-size: 0.95rem; line-height: 1.7; }
.constitution-summary strong { color: var(--brand); }

.plan-img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  margin: 8px 0;
}

.notice-bar {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 0.85rem;
  color: #92400e;
  margin-bottom: 16px;
  text-align: center;
}

.fixed-bottom {
  position: fixed;
  bottom: calc(70px + var(--safe-bottom));
  left: 0; right: 0;
  padding: 12px 16px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
}
.fixed-bottom .flex { max-width: 480px; margin: 0 auto; }

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(70px + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  z-index: 100;
  padding-top: 8px;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center;
  padding: 6px 16px;
  cursor: pointer;
  color: var(--ink-mute);
  transition: all 0.2s;
}
.nav-item.active { color: var(--brand); }
.nav-item .icon { font-size: 1.3rem; margin-bottom: 2px; }
.nav-item span:last-child { font-size: 0.75rem; }

.streak-badge {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
}

.parent-card {
  display: flex; align-items: center; gap: 12px;
  padding: 14px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  cursor: pointer;
}
.parent-card .avatar {
  width: 44px; height: 44px;
  background: var(--brand);
  color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 1.1rem;
}
.parent-card .meta { flex: 1; }
.parent-card .meta .name { font-weight: 600; font-size: 0.95rem; }
.parent-card .meta .tags { display: flex; gap: 6px; margin-top: 4px; }
.parent-card .meta .tags span {
  font-size: 0.75rem;
  color: var(--ink-mute);
  background: #fff;
  padding: 2px 8px;
  border-radius: 10px;
}

.checkin-card { background: linear-gradient(135deg, var(--brand) 0%, #4a8d6b 100%); color: #fff; }
.checkin-card .h1 { color: #fff; }
.checkin-card .muted { color: rgba(255,255,255,0.8); }

.toast {
  position: fixed;
  bottom: calc(100px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 0.9rem;
  opacity: 0;
  transition: all 0.3s;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--card);
  border-radius: var(--radius);
  width: 90%;
  max-width: 400px;
  max-height: 80vh;
  overflow: hidden;
  transform: scale(0.95);
  transition: transform 0.3s;
}
.modal-overlay.show .modal { transform: scale(1); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-header h3 { margin: 0; font-size: 1.1rem; }
.modal-body { padding: 20px; max-height: 50vh; overflow-y: auto; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }

.elderly .btn { min-height: 52px; font-size: 1.1rem; padding: 14px 24px; }
.elderly .card { padding: 24px; }
.elderly .tag { padding: 14px 18px; font-size: 1.1rem; }

@media (min-width: 768px) {
  body { padding-bottom: 0; }
  #app { max-width: 500px; margin: 0 auto; padding: 20px; }
  .fixed-bottom { position: static; padding: 0; background: transparent; border: none; margin-top: 16px; }
  .fixed-bottom .flex { justify-content: center; }
  .bottom-nav { display: none; }
}

.quick-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.quick-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: var(--bg);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--line-light);
}
.quick-card:hover { background: var(--line-light); border-color: var(--line); }
.quick-card:active { transform: scale(0.98); }
.quick-icon {
  width: 52px; height: 52px;
  background: var(--brand-light);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
}
.quick-icon.elderly { background: #fef3c7; }
.quick-content { flex: 1; }
.quick-name { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
.quick-hint { color: var(--brand); font-size: 0.85rem; margin-bottom: 2px; }
.quick-desc { color: var(--ink-mute); font-size: 0.8rem; }

.scene-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.scene-card {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--line-light);
  text-align: center;
}
.scene-card:hover { background: var(--line-light); border-color: var(--line); }
.scene-card:active { transform: scale(0.98); }
.scene-icon { font-size: 1.6rem; margin-bottom: 6px; }
.scene-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
.scene-hint { color: var(--ink-mute); font-size: 0.75rem; margin-bottom: 6px; }
.scene-tag {
  display: inline-block;
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--brand-light);
  color: var(--brand);
}

.today-card .card-bg {
  background: rgba(255,255,255,0.9);
  border-color: rgba(255,255,255,0.5);
}

/* ===== 三入口卡片样式 ===== */
.entry-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: var(--bg);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--line-light);
  margin-bottom: 10px;
}
.entry-card:hover {
  border-color: var(--brand);
  background: #f9fafb;
  transform: translateX(4px);
}
.entry-card:active { transform: translateX(2px); }

.entry-icon {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
  flex-shrink: 0;
}
.entry-icon.elderly { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); }
.entry-icon.family { background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); }

.entry-content { flex: 1; min-width: 0; }
.entry-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
.entry-desc { color: var(--ink-soft); font-size: 0.88rem; margin-bottom: 6px; }
.entry-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.entry-tags span {
  font-size: 0.75rem;
  padding: 3px 10px;
  background: #fff;
  border: 1px solid var(--line-light);
  border-radius: 14px;
  color: var(--ink-soft);
}
.entry-arrow { font-size: 1.4rem; color: var(--ink-mute); font-weight: 300; flex-shrink: 0; }
.entry-card.entry-youth:hover .entry-icon { background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%); }
.entry-card.entry-elderly:hover .entry-icon { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%); }
.entry-card.entry-family:hover .entry-icon { background: linear-gradient(135deg, #10b981 0%, #34d399 100%); }
.entry-card:hover .entry-arrow { color: var(--brand); }

/* ===== 特色功能卡片 ===== */
.feature-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.feature-card {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 16px 12px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--line-light);
  text-align: center;
}
.feature-card:hover { border-color: var(--brand); transform: translateY(-2px); background: #f9fafb; }
.feature-card:active { transform: translateY(0); }
.feature-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--brand-light) 0%, #dbeafe 100%);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem;
  margin: 0 auto 8px;
}
.feature-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
.feature-hint { color: var(--ink-mute); font-size: 0.78rem; }

/* ===== 大字模式增强 ===== */
body.large-text .entry-card { padding: 24px; }
body.large-text .entry-title { font-size: 1.4rem; }
body.large-text .entry-desc { font-size: 1.1rem; }
body.large-text .entry-tags span { font-size: 1rem; padding: 6px 14px; }
body.large-text .entry-icon { width: 72px; height: 72px; font-size: 2.2rem; }
body.large-text .feature-card { padding: 24px 16px; }
body.large-text .feature-name { font-size: 1.2rem; }
body.large-text .feature-hint { font-size: 1rem; }
body.large-text .feature-icon { width: 56px; height: 56px; font-size: 1.8rem; }

/* ===== 进度条动画 ===== */
.progress-wrap {
  background: #f3f4f6;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 16px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand) 0%, #4a8d6b 100%);
  transition: width 0.4s ease;
  border-radius: 4px;
}

/* ===== 响应式优化 ===== */
@media (max-width: 375px) {
  .persona-grid { grid-template-columns: 1fr; }
  .persona-card { text-align: left; display: flex; align-items: center; gap: 12px; }
  .persona-card .emoji { margin-bottom: 0; }
  .scene-grid { grid-template-columns: 1fr; }
  .scene-card { text-align: left; display: flex; align-items: center; gap: 12px; }
  .scene-card .scene-icon { margin-bottom: 0; }
}

/* ===== 新功能样式 ===== */

/* Hero 渐变卡片 */
.card.hero {
  border-radius: var(--radius);
  border: none;
  box-shadow: var(--shadow);
}

/* 用药冲突检测 - 多选标签组 */
.check-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.check-group .tag {
  cursor: pointer;
  user-select: none;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 0.85rem;
  background: #fff;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
}
.check-group .tag:hover { border-color: var(--brand); color: var(--brand); }
.check-group .tag.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.check-group .tag .x { font-size: 0.75rem; }

/* 日记条目 */
.diary-entry { transition: all 0.2s; }
.diary-entry:hover { background: #f3f4f6 !important; }

/* 食谱卡片 */
.meal-day { }
.meal-item { transition: all 0.2s; cursor: pointer; }
.meal-item:hover { background: #f0fdf4 !important; border-color: var(--brand) !important; }
.meal-done { text-decoration: line-through; opacity: 0.8; }
.meal-skip { opacity: 0.5; }

/* 游戏卡片 */
.game-card {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 20px 16px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--line-light);
  text-align: center;
}
.game-card:hover { border-color: var(--brand); transform: translateY(-2px); background: #f9fafb; box-shadow: var(--shadow); }
.game-card:active { transform: translateY(0); }

/* 穴位连连看 */
.acupoint-chip {
  transition: all 0.2s;
}
.acupoint-chip.selected {
  transform: scale(1.05);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.acupoint-chip.matched { opacity: 0.6; cursor: default; }

/* SOS 按钮动画 */
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.85; transform: scale(0.98); }
}

/* 打卡环形进度 */
.streak-badge {
  display: inline-block;
  background: #fff7ed;
  color: #ea580c;
  border: 1px solid #fed7aa;
  border-radius: 12px;
  padding: 4px 10px;
  font-size: 0.8rem;
  font-weight: 600;
}

/* 大字模式增强 - 新功能 */
body.large-text .check-group .tag { padding: 10px 16px; font-size: 1rem; }
body.large-text .game-card { padding: 28px 20px; }
body.large-text .meal-item { padding: 12px 16px; font-size: 1.05rem; }
body.large-text .diary-entry { padding: 16px; }

/* 老人端 SOS 按钮悬浮 */
.elderly .sos-btn {
  position: sticky;
  bottom: 80px;
  z-index: 10;
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// 中医体质知识库（简化九体质）
// 数据来源：王琦九种体质 + 日常调养场景化简版
window.TCM_DATA = (function () {
  // 九种体质
  const constitutions = {
    balanced: {
      id: 'balanced',
      name: '平和质',

<script>
// 规则引擎：红旗识别 + 体质倾向判定 + 禁忌过滤
window.TCM_RULES = (function () {
  const { constitutions, symptoms, redFlags, chronicDiseases, teas, diets, acupoints, lifestyleByTag } = window.TCM_DATA;

  // 1. 红旗识别：任一命中即返回
  function checkRedFlags(redFlagIds) {
    const hits = (redFlagIds || [])
      .map((id) => redFlags[id])
      .filter(Boolean);
    return {
      blocked: hits.length > 0,
      hits,
    };
  }

  // 2. 体质倾向判定（简化打分）
  // 根据症状 + 寒热/大便/饮食偏好给出 1-2 个倾向体质
  function inferConstitution(profile) {
    const scores = {
      balanced: 0, qixu: 0, yangxu: 0, yinxu: 0,
      tanshi: 0, shire: 0, xueyu: 0, qiyu: 0, tebing: 0,
    };
    // 寒热
    if (profile.coldHeat === 'cold') { scores.yangxu += 3; scores.qixu += 1; }
    if (profile.coldHeat === 'hot') { scores.yinxu += 3; scores.shire += 2; }
    // 大便
    if (profile.stool === 'loose') { scores.qixu += 2; scores.yangxu += 1; scores.tanshi += 1; }
    if (profile.stool === 'constipated') { scores.yinxu += 2; scores.shire += 2; }
    // 饮食
    if (profile.diet === 'greasy') { scores.tanshi += 2; scores.shire += 2; }
    if (profile.diet === 'cold') { scores.yangxu += 2; }
    if (profile.diet === 'spicy') { scores.shire += 2; scores.yinxu += 1; }
    // 睡眠
    if (profile.sleepQuality === 'poor') { scores.qiyu += 2; scores.yinxu += 1; }
    if (profile.sleepHours && profile.sleepHours < 6) { scores.yinxu += 2; scores.shire += 1; }
    // 症状
    (profile.symptoms || []).forEach((s) => {
      switch (s) {
        case 'stayup': scores.yinxu += 2; scores.qiyu += 1; break;
        case 'eyedry': scores.yinxu += 3; break;
        case 'poorSleep': scores.qiyu += 2; scores.yinxu += 2; break;
        case 'stomach': scores.qixu += 2; scores.tanshi += 1; break;
        case 'lowMood': scores.qiyu += 3; break;
        case 'dizzy': scores.qixu += 2; scores.xueyu += 1; break;
        case 'backpain': scores.xueyu += 2; scores.qixu += 1; break;
        case 'coldlimbs': scores.yangxu += 3; break;
        case 'nightUrine': scores.yangxu += 2; scores.qixu += 1; break;
        case 'headache': scores.xueyu += 2; scores.qiyu += 1; break;
        case 'constipation': scores.yinxu += 2; scores.shire += 2; break;
        case 'neckpain': scores.xueyu += 2; break;
      }
    });
    // 年龄偏向：银发阳虚概率更高
    if (profile.ageGroup === 'elderly') { scores.yangxu += 1; scores.qixu += 1; }
    // 排序取最高
    const sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
    const primary = sorted[0];
    const secondary = scores[sorted[1]] > 0 ? sorted[1] : null;
    return {
      primary,
      secondary,
      scores,
      primaryObj: constitutions[primary],
      secondaryObj: secondary ? constitutions[secondary] : null,
    };
  }

  // 3. 禁忌过滤：返回 { item, replacedBy, reason }
  function filterContraindications(items, chronicIds) {
    const out = [];
    items.forEach((it) => {
      const forbid = it.forbid || {};
      const conflict = (chronicIds || []).map((c) => ({ id: c, reason: forbid[c] })).find((x) => x.reason);
      if (conflict) {
        const alt = it.alternative && it.alternative[conflict.id];
        out.push({
          item: it,
          conflict,
          replaced: !!alt,
          replacedBy: alt ? items.find((x) => x.id === alt) : null,
        });
      } else {
        out.push({ item: it, conflict: null, replaced: false, replacedBy: null });
      }
    });
    return out;
  }

  // 4. 风险未明判断（命中慢病/用药即提示就医）
  function needDoctorConsult(profile) {
    const ids = profile.chronic || [];
    return ids.length > 0;
  }

  return {
    checkRedFlags,
    inferConstitution,
    filterContraindications,
    needDoctorConsult,
  };
})();

</script>
<script>
// AI 方案生成器：基于档案 → 方案结构（体质 + 茶饮 + 药膳 + 穴位 + 生活 + 禁忌）
window.TCM_GENERATOR = (function () {
  const { teas, diets, acupoints, lifestyleByTag, constitutions } = window.TCM_DATA;
  const rules = window.TCM_RULES;

  // 给定体质 + 症状，按 tags 命中度排序
  function rankByTags(pool, profile, k) {
    const targetTags = new Set([
      rules.inferConstitution(profile).primary,
      rules.inferConstitution(profile).secondary,
      ...(profile.symptoms || []),
    ]);
    return [...pool]
      .map((it) => {
        const hits = (it.tags || []).filter((t) => targetTags.has(t)).length;
        return { it, hits };
      })
      .sort((a, b) => b.hits - a.hits)
      .slice(0, k)
      .map((x) => x.it);
  }

  // 收集生活建议：体质 + 症状去重
  function collectLifestyle(profile) {
    const cons = rules.inferConstitution(profile);
    const tips = [];
    const keys = new Set();
    if (cons.primaryObj) {
      keys.add(cons.primary);
      tips.push({ tag: cons.primary, text: lifestyleByTag[cons.primary] });
    }
    if (cons.secondaryObj) {
      keys.add(cons.secondary);
      tips.push({ tag: cons.secondary, text: lifestyleByTag[cons.secondary] });
    }
    (profile.symptoms || []).forEach((s) => {
      if (!keys.has(s) && lifestyleByTag[s]) {
        keys.add(s);
        tips.push({ tag: s, text: lifestyleByTag[s] });
      }
    });
    return tips.filter((t) => t.text);
  }

  // 主入口
  function generate(profile) {
    const cons = rules.inferConstitution(profile);
    const chronicIds = profile.chronic || [];

    const teaPicked = rankByTags(teas, profile, 3);
    const dietPicked = rankByTags(diets, profile, 3);
    const acuPicked = rankByTags(acupoints, profile, 4);

    const teaFiltered = rules.filterContraindications(teaPicked, chronicIds);
    const dietFiltered = rules.filterContraindications(dietPicked, chronicIds);
    const acuFiltered = rules.filterContraindications(acuPicked, chronicIds);

    const lifestyle = collectLifestyle(profile);
    const needDoctor = rules.needDoctorConsult(profile);

    return {
      constitution: cons,
      teas: teaFiltered,
      diets: dietFiltered,
      acupoints: acuFiltered,
      lifestyle,
      needDoctor,
      profile,
    };
  }

  // 渲染用：根据人群切换文案
  function localTone(text, persona) {
    if (persona === 'elderly') {
      // 简化为更口语化（这里仅示例：把"宜"替换为"最好"，"忌"替换为"别"）
      return text.replace(/宜/g, '最好').replace(/忌/g, '别').replace(/可/g, '能');
    }
    return text;
  }

  return { generate, localTone };
})();

</script>
<script>
// 模拟语音播报（无 TTS 真实接入时）：控制台日志 + 浏览器 SpeechSynthesis 兜底
window.TCM_TTS = (function () {
  function speak(text) {
    if (!text) return;
    // 1) 真实播报（如浏览器支持）
    try {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 1.0;
        u.pitch = 1.0;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
        console.log('[TTS] 播放:', text);
        return;
      }
    } catch (e) {}
    // 2) 兜底：控制台日志
    console.log('[TTS 占位] 模拟播报:', text);
    try {
      const tip = document.createElement('div');
      tip.className = 'tts-tip';
      tip.textContent = '🔊 正在朗读：' + text.slice(0, 40) + (text.length > 40 ? '…' : '');
      document.body.appendChild(tip);
      setTimeout(() => tip.remove(), 2200);
    } catch (e) {}
  }

  function speakPlan(plan) {
    const lines = [];
    lines.push('您的中医日常调养建议如下。');
    if (plan.constitution && plan.constitution.primaryObj) {
      lines.push('体质倾向：' + plan.constitution.primaryObj.name + '，' + plan.constitution.primaryObj.tone + '。');
    }
    (plan.teas || []).forEach((t) => {
      if (!t.conflict || t.replaced) {
        const tea = t.replacedBy || t.item;
        lines.push('茶饮：' + tea.name + '，' + tea.frequency + '。');
      }
    });
    (plan.diets || []).forEach((t) => {
      if (!t.conflict || t.replaced) {
        const d = t.replacedBy || t.item;
        lines.push('药膳：' + d.name + '。');
      }
    });
    (plan.lifestyle || []).forEach((l) => lines.push(l.text));
    speak(lines.join(' '));
  }

  return { speak, speakPlan };
})();

<script>
// 本地存储 + 家庭档案 + 大字模式持久化
window.TCM_STORE = (function () {
  const KEY = {
    largeText: 'tcm.largeText',
    profile: 'tcm.currentProfile',
    plan: 'tcm.currentPlan',
    family: 'tcm.family',
    reminder: 'tcm.reminders',
    disclaimer: 'tcm.disclaimer',
    messages: 'tcm.messages',
    riskAlerts: 'tcm.riskAlerts',
    lastVisit: 'tcm.lastVisit',
  };

  function get(key, def) {
    try {
      const v = localStorage.getItem(key);
      return v == null ? def : JSON.parse(v);
    } catch (e) { return def; }
  }
  function set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function del(key) { try { localStorage.removeItem(key); } catch (e) {} }

  return {
    KEY,
    get,
    set,
    del,
    isLargeText: () => get(KEY.largeText, false) === true,
    setLargeText: (v) => set(KEY.largeText, !!v),
    saveProfile: (p) => set(KEY.profile, p),
    loadProfile: () => get(KEY.profile, null),
    savePlan: (p) => set(KEY.plan, p),
    loadPlan: () => get(KEY.plan, null),
    // 家庭档案
    listParents: () => get(KEY.family, []),
    saveParent: (parent) => {
      const list = get(KEY.family, []);
      const idx = list.findIndex((x) => x.id === parent.id);
      if (idx >= 0) list[idx] = parent; else list.push(parent);
      set(KEY.family, list);
    },
    getParent: (id) => get(KEY.family, []).find((x) => x.id === id),
    removeParent: (id) => {
      const list = get(KEY.family, []).filter((x) => x.id !== id);
      set(KEY.family, list);
    },
    // 提醒
    listReminders: (parentId) => get(KEY.reminder, []).filter((r) => r.parentId === parentId),
    saveReminder: (r) => {
      const all = get(KEY.reminder, []);
      const idx = all.findIndex((x) => x.id === r.id);
      if (idx >= 0) all[idx] = r; else all.push(r);
      set(KEY.reminder, all);
    },
    removeReminder: (id) => set(KEY.reminder, get(KEY.reminder, []).filter((x) => x.id !== id)),

      const today = new Date().toISOString().split('T')[0];
      return get('tcm.checkins', []).find(c => c.date === today);
    },
    getStreak: () => {
      const checkins = get('tcm.checkins', []).map(c => c.date).sort();
      if (checkins.length === 0) return 0;
      const today = new Date();
      let streak = 0;
      for (let i = 0; i < 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        if (checkins.includes(dateStr)) {
          streak++;
        } else if (i > 0) {
          break;
        }
      }
      return streak;

    markMessageRead: (msgId) => {
      const msgs = get(KEY.messages, []);

      if (idx >= 0) msgs[idx].read = true;
      set(KEY.messages, msgs);

    saveRiskAlert: (alert) => {
      const alerts = get(KEY.riskAlerts, []);
      alerts.push({ ...alert, id: 'alert-' + Date.now(), timestamp: Date.now() });

    listRiskAlerts: () => get(KEY.riskAlerts, []).sort((a, b) => b.timestamp - a.timestamp),
    markAlertRead: (alertId) => {
      const alerts = get(KEY.riskAlerts, []);
      const idx = alerts.findIndex(a => a.id === alertId);
      if (idx >= 0) alerts[idx].read = true;
      set(KEY.riskAlerts, alerts);

    // 免责

    acceptDisclaimer: () => set(KEY.disclaimer, true),
    // 最后访问时间
    saveLastVisit: () => set(KEY.lastVisit, new Date().toISOString()),
    getLastVisit: () => get(KEY.lastVisit, null),
    // 舌象记录
    saveTongueRecord: (rec) => {
      const list = get('tcm.tongue', []);
      list.push({ ...rec, id: 'tongue-' + Date.now(), timestamp: Date.now() });
      set('tcm.tongue', list);
    },
    listTongueRecords: () => get('tcm.tongue', []).sort((a, b) => b.timestamp - a.timestamp),
    getLatestTongue: () => {
      const list = get('tcm.tongue', []);
      return list.length > 0 ? list[list.length - 1] : null;

    saveParentExtendedInfo: (parentId, info) => {
      const parents = get(KEY.family, []);
      const idx = parents.findIndex(p => p.id === parentId);
      if (idx >= 0) {
        parents[idx].extendedInfo = { ...(parents[idx].extendedInfo || {}), ...info, updatedAt: Date.now() };
        set(KEY.family, parents);
      }
    },
    getParentExtendedInfo: (parentId) => {
      const parent = get(KEY.family, []).find(p => p.id === parentId);
      return parent ? (parent.extendedInfo || {}) : {};
    },
    // 问诊摘要保存
    saveDoctorSummary: (parentId, summary) => {
      const list = get('tcm.doctorSummaries', []);
      list.push({ id: 'sum-' + Date.now(), parentId, summary, timestamp: Date.now() });
      set('tcm.doctorSummaries', list);
    },
    listDoctorSummaries: (parentId) => get('tcm.doctorSummaries', [])
      .filter(s => !parentId || s.parentId === parentId)

    // 食谱周计划
    saveMealPlan: (plan) => set('tcm.mealPlan', plan),

    updateMealPlanItem: (day, meal, status) => {
      const plan = get('tcm.mealPlan', null);
      if (!plan) return;
      if (!plan.items) plan.items = {};
      if (!plan.items[day]) plan.items[day] = {};
      plan.items[day][meal] = status;
      set('tcm.mealPlan', plan);
    },
    getMealPlanStatus: (day, meal) => {
      const plan = get('tcm.mealPlan', null);
      return plan && plan.items && plan.items[day] && plan.items[day][meal] || null;
    },

    // 游戏数据
    saveGameScore: (gameType, score) => {
      const scores = get('tcm.gameScores', {});

    },

    unlockSecret: (secretId) => {
      const unlocked = new Set(get('tcm.unlockedSecrets', []));
      unlocked.add(secretId);
      set('tcm.unlockedSecrets', [...unlocked]);
    },
    listUnlockedSecrets: () => get('tcm.unlockedSecrets', []),
  };
})();

  function getCurrentSolarTerm() {
    const termNames = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
    const termDates = [[1,6],[1,20],[2,4],[2,19],[3,6],[3,21],[4,5],[4,20],[5,6],[5,21],[6,6],[6,21],[7,7],[7,23],[8,8],[8,23],[9,8],[9,23],[10,8],[10,24],[11,7],[11,22],[12,7],[12,22]];
    const now = new Date();
    const m = now.getMonth() + 1;
    const d = now.getDate();
    let minDiff = Infinity;
    let bestTerm = '立春';
    for (let i = 0; i < termDates.length; i++) {
      const diff = Math.abs((m - termDates[i][0]) * 30 + (d - termDates[i][1]));
      if (diff < minDiff) { minDiff = diff; bestTerm = termNames[i]; }
    }
    return bestTerm;
  }

    return arr[idx];

    const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
    const w = weekdays[now.getDay()];
    return y + '年' + m + '月' + d + '日 ' + w;
  }

  function selectPersona(id, quick = false) {
    state.persona = id;
    if (id === 'family') return go('family');
    // 快速入口走新的简化自测流程
    if (quick) {
      if (id === 'elderly') {
        S.setLargeText(true);
        state.elderlyAnswers = { step: 0, selections: [] };
        return go('elderly-quick');
      }
      if (id === 'worker' || id === 'student' || id === 'middle') {
        S.setLargeText(false);
        state.youthAnswers = { step: 0, selections: [] };
        return go('youth-quick');
      }
    }
    // 常规路径
    if (id === 'elderly') {
      S.setLargeText(true);
      state.profile.ageGroup = 'elderly';
      state.profile.symptoms = ['poorSleep', 'stomach', 'coldlimbs'];
      state.profile.chronic = [];
      return go('profile');
    }
    if (id === 'student') state.profile.ageGroup = 'teen';
    else if (id === 'worker') state.profile.ageGroup = 'adult';
    else if (id === 'middle') state.profile.ageGroup = 'middle';
    S.setLargeText(false);
    state.profile.symptoms = ['stayup', 'neckpain', 'poorSleep', 'eyedry'];
    state.profile.chronic = [];
    go('profile');
  }

  function selectScenePackage(pkg) {
    state.selectedScene = pkg.id;
    const sceneData = D.scenePackages[pkg.ageGroup === 'adult' ? 'young' : pkg.ageGroup === 'middle' ? 'middle' : 'elderly'].find(s => s.id === pkg.id);
    if (sceneData) {
      state.persona = pkg.ageGroup === 'elderly' ? 'elderly' : (pkg.ageGroup === 'middle' ? 'middle' : 'worker');
      state.profile.ageGroup = pkg.ageGroup;
      state.profile.symptoms = [...sceneData.symptoms];
      if (sceneData.chronic) state.profile.chronic = [...sceneData.chronic];
      if (sceneData.diet) state.profile.diet = sceneData.diet;
      S.setLargeText(pkg.ageGroup === 'elderly');
      go('safety');
    }
  }

  function generateAndGo() {
    S.saveProfile(state.profile);
    const rf = R.checkRedFlags(state.profile.redFlags);
    if (rf.blocked) {
      S.savePlan({ blocked: true, hits: rf.hits, profile: state.profile });
      return go('red-flag');
    }
    const plan = G.generate(state.profile);
    S.savePlan(plan);
    go(state.persona === 'elderly' ? 'elderly-plan' : 'plan');
  }

  function generateRedFlagSummary(plan) {
    const lines = [];
    lines.push('【紧急情况摘要】');
    lines.push('——');
    lines.push('【红旗症状】' + plan.hits.map(h => h.name).join('、'));
    lines.push('【症状说明】' + plan.hits.map(h => h.tip).join('；'));
    lines.push('【基础信息】' + (plan.profile.age || plan.profile.ageGroup));
    lines.push('【其他症状】' + (plan.profile.symptoms || []).map(s => D.symptoms[s]?.name).filter(Boolean).join('、') || '无');
    lines.push('【慢病/用药】' + (plan.profile.chronic || []).map(c => D.chronicDiseases[c]?.name).filter(Boolean).join('、') || '无');
    lines.push('——');
    lines.push('（本摘要由本草日常生成，仅供医生参考）');
    
    showModal({
      title: '医生摘要',
      body: el('div', {},
        el('textarea', { class: 'input', rows: 12, id: 'sum-text' }, lines.join('\n')),
        el('p', { class: 'muted' }, '可复制后分享给医生。')
      ),
      onConfirm: () => {
        document.getElementById('sum-text').select();
        try { document.execCommand('copy'); toast('已复制到剪贴板'); } catch (e) { toast('请手动复制'); }
        closeModal();
      },
      confirmText: '一键复制',
    });
  }

  function submitCheckin(data, streak) {
    const checkin = {
      date: new Date().toISOString().split('T')[0],
      drank: data.drank,
      ate: data.ate,
      acupoints: data.acupoints,
      improvements: data.improvements,
      discomforts: data.discomforts,
      notes: data.notes,
      otherDrink: data.otherDrink,
      otherFood: data.otherFood,
      timestamp: Date.now(),
    };
    S.saveCheckin(checkin);
    
    if (data.discomforts.length > 0) {
      S.saveRiskAlert({ parentId: state.selectedParentId, type: 'discomfort', message: '打卡反馈出现不适：' + data.discomforts.join('、') });
    }
    
    showCheckinSuccess(streak + 1);
  }

  function showCheckinSuccess(streak) {
    const encouragements = [
      { emoji: '🎉', text: '太棒了！今日打卡完成，继续保持！' },
      { emoji: '🌟', text: '坚持就是胜利！你已经连续打卡 ' + streak + ' 天了！' },
      { emoji: '💪', text: '身体在悄悄变好，明天继续加油！' },
      { emoji: '🌈', text: '养生贵在坚持，你做得非常好！' },
    ];
    const enc = encouragements[Math.min(streak - 1, encouragements.length - 1)];

    const plan = S.loadPlan();
    const teas = plan.teas.map(t => (t.replacedBy || t.item).name);
    const diets = plan.diets.map(t => (t.replacedBy || t.item).name);
    const acupoints = plan.acupoints.map(t => (t.replacedBy || t.item).name);

    const tomorrowTips = [
      `明天记得继续喝 ${teas[0] || '养生茶'} 哦！`,
      `可以尝试做 ${diets[0] || '养生餐'} 来调理身体。`,
      `别忘了按揉 ${acupoints[0] || '穴位'}，效果更好！`,
      '早点休息，保持好睡眠！',
    ];
    const tip = tomorrowTips[Math.floor(Math.random() * tomorrowTips.length)];

    showModal({
      title: enc.emoji + ' 打卡成功！',
      body: el('div', {},
        el('p', { style: { fontSize: '1.1rem', marginBottom: '16px' } }, enc.text),
        el('div', { class: 'plan-section' },
          el('h4', {}, '📋 明日推荐'),
          el('p', {}, tip)
        ),
        el('div', { style: { marginTop: '16px', textAlign: 'center' } },
          el('div', { style: { fontSize: '3rem' } }, getStreakEmoji(streak))
        )
      ),
      onConfirm: () => {
        closeModal();
        go('plan');
      },
      confirmText: '好的',
      cancelText: '',
    });
  }

  function getStreakEmoji(streak) {
    if (streak >= 30) return '🏆';
    if (streak >= 14) return '⭐';
    if (streak >= 7) return '🔥';
    if (streak >= 3) return '💪';
    return '✨';
  }

  function generateDoctorSummary(parent) {
    const plan = S.loadPlan();
    const checkins = S.listCheckins().slice(-7);
    const lines = [];
    lines.push('【父母问诊摘要】');
    lines.push('——');
    lines.push('【基本信息】' + parent.profile.name + ' · ' + (parent.profile.ageGroup === 'middle' ? '40-59 岁' : '60 岁以上'));
    lines.push('【慢病/用药】' + (parent.profile.chronic || []).map(c => D.chronicDiseases[c]?.name).filter(Boolean).join('、') || '无');
    if (plan && plan.constitution) {
      lines.push('【体质倾向】' + plan.constitution.primaryObj.name);
    }
    if (checkins.length > 0) {
      lines.push('【近7天打卡】完成 ' + checkins.length + ' 天');
      const discomforts = checkins.flatMap(c => c.discomforts).filter(Boolean);
      if (discomforts.length > 0) lines.push('【不适反馈】' + discomforts.join('、'));
    }
    lines.push('——');
    lines.push('（本摘要由本草日常生成，仅供医生参考）');
    
    showModal({
      title: '医生摘要',
      body: el('div', {},
        el('textarea', { class: 'input', rows: 12, id: 'doc-summary' }, lines.join('\n')),
        el('p', { class: 'muted' }, '可复制后分享给医生。')
      ),
      onConfirm: () => {
        document.getElementById('doc-summary').select();
        try { document.execCommand('copy'); toast('已复制到剪贴板'); } catch (e) { toast('请手动复制'); }
        closeModal();
      },
      confirmText: '一键复制',
    });
  }

  // ====== 工具函数 ======
  let toastEl = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  let modalEl = null;
  function showModal({ title, body, onConfirm, onCancel, confirmText = '确定', cancelText = '取消' }) {
    if (!modalEl) {
      modalEl = document.createElement('div');
      modalEl.className = 'modal-overlay';
      document.body.appendChild(modalEl);
    }
    modalEl.innerHTML = '';
    modalEl.appendChild(el('div', { class: 'modal' },
      el('div', { class: 'modal-header' }, el('h3', {}, title)),
      el('div', { class: 'modal-body' }, body),
      el('div', { class: 'modal-footer' },
        cancelText ? el('button', { class: 'btn ghost', onclick: () => { closeModal(); if (onCancel) onCancel(); } }, cancelText) : null,
        el('button', { class: 'btn', onclick: () => { closeModal(); if (onConfirm) onConfirm(); } }, confirmText)
      )
    ));
    modalEl.classList.add('show');
  }

  function closeModal() {
    if (modalEl) modalEl.classList.remove('show');
  }

  // ====== B6. 体质小测试游戏 ======
  function viewGameConstitution() {
    const questions = D.constitutionTestQuestions;
    const step = state.gameConstitutionStep || 0;
    const answers = state.gameConstitutionAnswers || [];

    if (step >= questions.length) {
      // 计算体质
      const counts = {};
      answers.forEach((a, i) => {
        const q = questions[i];
        if (q && q.options && q.options[a]) {
          const opt = q.options[a];
          if (opt.includes('冰凉') || opt.includes('怕冷')) counts['yangxu'] = (counts['yangxu'] || 0) + 1;
          else if (opt.includes('发热') || opt.includes('怕热')) counts['yinxu'] = (counts['yinxu'] || 0) + 1;
          else if (opt.includes('疲劳') || opt.includes('没力气')) counts['qixu'] = (counts['qixu'] || 0) + 1;
          else if (opt.includes('低落') || opt.includes('叹气')) counts['qiyu'] = (counts['qiyu'] || 0) + 1;
          else if (opt.includes('偏胖') || opt.includes('肥满')) counts['tanshi'] = (counts['tanshi'] || 0) + 1;
          else counts['balanced'] = (counts['balanced'] || 0) + 1;
        }
      });
      const topType = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'balanced';
      const consName = { balanced: '平和质', qixu: '气虚质', yangxu: '阳虚质', yinxu: '阴虚质', tanshi: '痰湿质', qiyu: '气郁质' }[topType] || '平和质';
      const cons = D.constitutions[topType];
      const score = Math.round((answers.length / questions.length) * 100);
      S.saveGameScore('constitution', score);
      S.unlockSecret('体质平和：' + (cons?.tip || '保持规律作息'));
      S.unlockSecret('穴位知识：足三里是补气健脾第一穴');

      return el('div', {},
        topbar({ title: '测试结果' }),
        el('div', { class: 'card', style: { textAlign: 'center', padding: '32px' } },
          el('div', { style: { fontSize: '4rem', marginBottom: '16px' } }, '🎉'),
          el('h1', { class: 'h1', style: { color: 'var(--brand)', marginBottom: '8px' } }, '您的体质倾向'),
          el('div', { style: { fontSize: '2.5rem', fontWeight: '700', color: '#dc2626', marginBottom: '12px' } }, consName),
          el('p', { class: 'muted', style: { marginBottom: '16px' } }, cons?.tone || ''),
          el('div', { style: { background: '#f0fdf4', padding: '16px', borderRadius: '12px', marginBottom: '16px', textAlign: 'left' } },
            el('p', { style: { fontWeight: '600', marginBottom: '4px' } }, '💡 养生建议'),
            el('p', { style: { margin: 0 } }, cons?.tip || '保持规律作息，均衡饮食')
          ),
          el('div', { style: { fontSize: '2rem', marginBottom: '16px' } }, '🏆 得分：' + score + ' 分'),
          el('button', { class: 'btn block', onclick: () => { state.gameConstitutionStep = 0; state.gameConstitutionAnswers = []; render(); } }, '🔄 再测一次'),
          el('button', { class: 'btn secondary', style: { marginTop: '8px' }, onclick: () => go('games') }, '返回游戏中心')
        )
      );
    }

    const q = questions[step];
    return el('div', {},
      topbar({ title: '体质测试' }),
      el('div', { class: 'card' },
        el('div', { style: { textAlign: 'center', color: 'var(--ink-soft)', marginBottom: '8px' } }, '第 ' + (step + 1) + ' 题 / 共 ' + questions.length + ' 题'),
        el('div', { style: { background: '#f3f4f6', height: '6px', borderRadius: '3px', marginBottom: '20px', overflow: 'hidden' } },
          el('div', { style: { background: 'var(--brand)', height: '100%', width: ((step) / questions.length * 100) + '%', transition: 'width 0.3s' } })
        ),
        el('h1', { class: 'h1', style: { textAlign: 'center', marginBottom: '24px', lineHeight: '1.6' } }, q.q),
        el('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
          q.options.map((opt, idx) => el('button', {
            class: 'btn secondary',
            style: { padding: '16px 20px', fontSize: '1rem', textAlign: 'left' },
            onclick: () => {
              answers.push(idx);
              state.gameConstitutionStep = step + 1;
              state.gameConstitutionAnswers = answers;
              render();
            }
          }, opt))
        )
      ),
      el('div', { class: 'card' },
        el('button', { class: 'btn ghost block', onclick: () => { state.gameConstitutionStep = 0; state.gameConstitutionAnswers = []; go('games'); } }, '退出测试')
      )
    );
  }

  // ====== B7. 穴位连连看游戏 ======
  function viewGameAcupoint() {
    const pairs = D.acupointPairs;
    const selected = state.gameAcupointSelected;
    const score = state.gameAcupointScore || 0;
    const matched = state.gameAcupointPairs || [];

    // 初始化：打乱穴位名和位置
    if (!state._acupointShuffledNames) {
      const names = pairs.map(p => ({ id: p.id, text: p.name }));
      const shuffledNames = [...names].sort(() => Math.random() - 0.5);
      state._acupointShuffledNames = shuffledNames;
    }
    if (!state._acupointShuffledLocs) {
      const locs = pairs.map(p => ({ id: p.id, text: p.location }));
      const shuffledLocs = [...locs].sort(() => Math.random() - 0.5);
      state._acupointShuffledLocs = shuffledLocs;
    }

    const shuffledNames = state._acupointShuffledNames;
    const shuffledLocs = state._acupointShuffledLocs;

    return el('div', {},
      topbar({ title: '穴位连连看' }),
      el('div', { class: 'card' },
        el('div', { style: { textAlign: 'center', marginBottom: '12px' } },
          el('span', { style: { fontSize: '2rem' } }, '🏆'),
          el('span', { style: { fontSize: '1.4rem', fontWeight: '700', marginLeft: '8px' } }, score + ' 分'),
          el('span', { style: { fontSize: '0.9rem', color: 'var(--ink-mute)', marginLeft: '12px' } }, matched.length + '/' + pairs.length + ' 对')
        ),
        el('p', { class: 'muted', style: { textAlign: 'center', marginBottom: '16px' } }, '点击穴位名称，再点击对应位置，进行配对'),
        el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' } },
          // 穴位名（左侧）
          el('div', {},
            el('h3', { style: { fontSize: '0.9rem', color: 'var(--ink-soft)', marginBottom: '8px' } }, '🧠 穴位名'),
            shuffledNames.map(p => {
              const isMatched = matched.includes(p.id);
              const isSelected = selected && selected.type === 'name' && selected.id === p.id;
              return el('div', {
                class: 'acupoint-chip' + (isMatched ? ' matched' : isSelected ? ' selected' : ''),
                style: { padding: '10px 12px', borderRadius: '8px', marginBottom: '8px', background: isMatched ? '#dcfce7' : isSelected ? '#dbeafe' : '#f3f4f6', border: '2px solid', borderColor: isMatched ? '#86efac' : isSelected ? '#93c5fd' : '#e5e7eb', cursor: isMatched ? 'default' : 'pointer', fontWeight: '600', textAlign: 'center', transition: 'all 0.2s' },
                onclick: () => {
                  if (isMatched) return;
                  if (selected && selected.type === 'name' && selected.id === p.id) {
                    state.gameAcupointSelected = null;
                  } else {
                    state.gameAcupointSelected = { type: 'name', id: p.id, text: p.text };
                  }
                  render();
                }
              }, p.text + (isMatched ? ' ✓' : ''));
            })
          ),
          // 位置（右侧）
          el('div', {},
            el('h3', { style: { fontSize: '0.9rem', color: 'var(--ink-soft)', marginBottom: '8px' } }, '📍 位置'),
            shuffledLocs.map(p => {
              const isMatched = matched.includes(p.id);
              const isSelected = selected && selected.type === 'loc' && selected.id === p.id;
              return el('div', {
                class: 'acupoint-chip' + (isMatched ? ' matched' : isSelected ? ' selected' : ''),
                style: { padding: '10px 12px', borderRadius: '8px', marginBottom: '8px', background: isMatched ? '#dcfce7' : isSelected ? '#dbeafe' : '#f3f4f6', border: '2px solid', borderColor: isMatched ? '#86efac' : isSelected ? '#93c5fd' : '#e5e7eb', cursor: isMatched ? 'default' : 'pointer', fontSize: '0.85rem', textAlign: 'center', transition: 'all 0.2s' },
                onclick: () => {
                  if (isMatched) return;
                  if (!selected) return;
                  if (selected.type === 'name') {
                    if (selected.id === p.id) {
                      // 配对成功
                      const newMatched = [...matched, p.id];
                      const newScore = score + 20;
                      state.gameAcupointPairs = newMatched;
                      state.gameAcupointScore = newScore;
                      state.gameAcupointSelected = null;
                      S.saveGameScore('acupoint', newScore);
                      if (newMatched.length === pairs.length) {
                        S.unlockSecret('穴位知识：' + pairs[0]?.name + '位于' + pairs[0]?.location);
                        toast('🎉 全部配对成功！获得 ' + newScore + ' 分');
                      }
                      render();
                    } else {
                      toast('❌ 不匹配，请重试');
                      state.gameAcupointSelected = null;
                      render();
                    }
                  }
                }
              }, p.text);
            })
          )
        ),
        el('div', { style: { marginTop: '12px', display: 'flex', gap: '8px' } },
          el('button', { class: 'btn ghost sm', onclick: () => {
            state.gameAcupointPairs = [];
            state.gameAcupointScore = 0;
            state.gameAcupointSelected = null;
            const shuffledN = [...pairs.map(p => ({ id: p.id, text: p.name }))].sort(() => Math.random() - 0.5);
            const shuffledL = [...pairs.map(p => ({ id: p.id, text: p.location }))].sort(() => Math.random() - 0.5);
            state._acupointShuffledNames = shuffledN;
            state._acupointShuffledLocs = shuffledL;
            render();
          } }, '🔄 重新开始')
        )
      )
    );
  }

  // ====== B8. 健康数据看板 ======
  function viewDashboard() {
    const plan = S.loadPlan();
    const checkins = S.listCheckins();
    const diaries = S.listDiaryEntries();
    const streak = S.getStreak();
    const todayCheckin = S.getTodayCheckin();

    // 计算打卡率
    const last7Days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      const hasCheckin = checkins.some(c => c.date === dateStr);
      last7Days.push({ date: dateStr, day: d.toLocaleDateString('zh-CN', { weekday: 'short' }), hasCheckin });
    }
    const checkinRate = Math.round(last7Days.filter(d => d.hasCheckin).length / 7 * 100);

    // 情绪趋势（最近7篇日记）
    const moodMap = { '很差': 1, '较差': 2, '普通': 3, '良好': 4, '很好': 5 };
    const recentDiaries = diaries.slice(0, 7).reverse();
    const moodTrend = recentDiaries.length > 0
      ? recentDiaries.map(d => ({ date: new Date(d.timestamp).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }), score: moodMap[d.mood] || 3, mood: d.mood }))
      : [];

    return el('div', {},
      topbar({ title: '健康数据看板' }),
      el('div', { class: 'card hero', style: { padding: '24px', background: 'linear-gradient(135deg, #0891b2 0%, #06b6d4 100%)', color: '#fff', marginBottom: '16px' } },
        el('div', { style: { textAlign: 'center' } },
          el('div', { style: { fontSize: '3rem', marginBottom: '8px' } }, '📊'),
          el('h1', { class: 'h1', style: { color: '#fff', marginBottom: '8px' } }, '健康数据看板'),
          el('p', { style: { opacity: 0.95, fontSize: '0.95rem' } }, '您的个人健康数据汇总')
        )
      ),
      el('div', { class: 'card' },
        el('h2', { class: 'h2', style: { marginBottom: '12px' } }, '👤 个人信息'),
        el('div', { class: 'plan-section' },
          el('div', { class: 'kv' },
            el('div', { class: 'k' }, '体质'),
            el('div', { style: { color: 'var(--brand)', fontWeight: '600' } }, plan?.constitution?.primaryObj?.name || '未测评'),
            el('div', { class: 'k' }, '年龄'),
            el('div', {}, plan?.profile?.age || '未填写'),
            el('div', { class: 'k' }, '打卡天数'),
            el('div', {}, checkins.length + ' 天'),
            el('div', { class: 'k' }, '连续打卡'),
            el('div', { style: { color: '#ea580c', fontWeight: '600' } }, streak + ' 天 🔥')
          )
        )
      ),
      el('div', { class: 'card' },
        el('h2', { class: 'h2', style: { marginBottom: '12px' } }, '✅ 近7天打卡率'),
        el('div', { style: { display: 'flex', justifyContent: 'space-around', marginBottom: '12px' } },
          last7Days.map(d => el('div', { style: { textAlign: 'center' } },
            el('div', { style: { fontSize: '0.7rem', color: 'var(--ink-mute)' } }, d.day),
            el('div', { style: { width: '32px', height: '32px', borderRadius: '50%', background: d.hasCheckin ? 'var(--brand)' : '#e5e7eb', display: 'flex', alignItems: 'center', justifyContent: 'center', color: d.hasCheckin ? '#fff' : '#9ca3af', fontSize: '0.8rem', margin: '4px auto' } }, d.hasCheckin ? '✓' : '○')
          ))
        ),
        el('div', { style: { textAlign: 'center', marginBottom: '12px' } },
          el('span', { style: { fontSize: '2rem', fontWeight: '700', color: checkinRate >= 70 ? '#16a34a' : checkinRate >= 40 ? '#d97706' : '#dc2626' } }, checkinRate + '%'),
          el('span', { style: { fontSize: '0.9rem', color: 'var(--ink-mute)', marginLeft: '8px' } }, '本周完成率')
        ),
        todayCheckin
          ? el('div', { style: { background: '#f0fdf4', padding: '10px', borderRadius: '8px', textAlign: 'center', color: '#16a34a', fontWeight: '600' } }, '✅ 今日已完成打卡')
          : el('button', { class: 'btn secondary block', onclick: () => go('checkin') }, '📅 今日尚未打卡，去打卡')
      ),
      moodTrend.length > 0 ? el('div', { class: 'card' },
        el('h2', { class: 'h2', style: { marginBottom: '12px' } }, '😊 情绪趋势（近' + moodTrend.length + '天）'),
        el('div', { style: { display: 'flex', alignItems: 'flex-end', gap: '4px', height: '80px' } },
          moodTrend.map(d => el('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center' } },
            el('div', { style: { width: '100%', height: (d.score / 5 * 60) + 'px', background: d.score >= 4 ? '#22c55e' : d.score >= 3 ? '#eab308' : '#ef4444', borderRadius: '4px 4px 0 0', minHeight: '8px' } }),
            el('div', { style: { fontSize: '0.6rem', color: 'var(--ink-mute)', marginTop: '4px' } }, d.date)
          ))
        )
      ) : null,
      el('div', { class: 'card' },
        el('h2', { class: 'h2', style: { marginBottom: '12px' } }, '📋 月度健康报告生成'),
        el('button', { class: 'btn block', onclick: () => {
          const lines = [
            '【月度健康报告】',
            '生成日期：' + new Date().toLocaleDateString('zh-CN'),
            '——',
            '【体质信息】' + (plan?.constitution?.primaryObj?.name || '未测评'),
            '【打卡情况】连续 ' + streak + ' 天，累计 ' + checkins.length + ' 天',
            '【本周打卡率】' + checkinRate + '%',
            '【日记记录】' + diaries.length + ' 篇',
            '【整体评价】' + (checkinRate >= 70 ? '调理状态良好，继续保持！' : '建议增加每日打卡频率，提升调理效果。'),
            '——',
            '（本报告由本草日常生成，仅供参考）'
          ];
          showModal({
            title: '📋 月度报告已生成',
            body: el('div', {},
              el('textarea', { class: 'input', rows: 10, id: 'monthly-report' }, lines.join('\n')),
              el('p', { class: 'muted', style: { marginTop: '8px' } }, '可复制后保存或发送给家人。')
            ),
            confirmText: '一键复制',
            onConfirm: () => {
              document.getElementById('monthly-report').select();
              try { document.execCommand('copy'); toast('已复制到剪贴板'); } catch(e) { toast('请手动复制'); }
              closeModal();
            },
            cancelText: '关闭'
          });
        } }, '📄 生成月度报告')
      )
    );
  }

  // ====== 渲染入口 ======
  function render() {
    const root = document.getElementById('app');
    clear(root);
    const views = {
      persona: viewPersona,
      profile: viewProfile,
      symptoms: viewSymptoms,
      safety: viewSafety,
      plan: viewPlan,
      family: viewFamily,
      'family-detail': viewFamilyDetail,
      'family-monitor': viewFamilyMonitor,
      'elderly-plan': viewElderlyPlan,
      checkin: viewCheckin,
      'today-card': viewTodayCard,
      tutorial: viewTutorial,
      'red-flag': viewRedFlag,
      scene: viewScene,
      'solar-term': viewSolarTerm,
      tongue: viewTongue,
      chronic: viewChronicAvoid,
      'elderly-quick': viewElderlyQuick,
      'youth-quick': viewYouthQuick,
      'family-brief': viewFamilyBrief,
      'drug-check': viewDrugCheck,
      'sos': viewSOS,
      'diary': viewDiary,
      'meal-plan': viewMealPlan,
      'games': viewGames,
      'game-constitution': viewGameConstitution,
      'game-acupoint': viewGameAcupoint,
      'dashboard': viewDashboard,
    };
    const viewFn = views[state.route] || viewPersona;
    const viewNode = viewFn();
    if (viewNode) root.appendChild(viewNode);
    const navNode = bottomNav();
    if (navNode) root.appendChild(navNode);
  }

  // 初始化
  document.addEventListener('DOMContentLoaded', () => {
    applyLargeText();
    render();
    
    // 模拟数据：25岁职场人和68岁银发用户
    const hasPlan = S.loadPlan();
    if (!hasPlan) {
      // 默认加载年轻人快速体验数据
      state.persona = 'worker';
      state.profile = {
        ageGroup: 'adult',
        age: '25',
        symptoms: ['stayup', 'neckpain', 'poorSleep', 'eyedry'],
        chronic: [],
        coldHeat: 'normal',
        stool: 'normal',
        diet: 'greasy',
        sleepQuality: 'poor',
      };
    }
  });

})();
</script>
</body>
</html>
