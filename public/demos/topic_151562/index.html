<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="师生直连平台 - AI智能匹配优秀教师，让教学回归本质">
    <title>师生直连平台 - AI智能匹配好老师</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --primary-lighter: #dbeafe;
            --secondary-color: #1e40af;
            --accent-color: #8b5cf6;
            --accent-light: #c4b5fd;
            --success-color: #10b981;
            --success-light: #d1fae5;
            --warning-color: #f59e0b;
            --warning-light: #fef3c7;
            --danger-color: #ef4444;
            --danger-light: #fee2e2;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-gradient: linear-gradient(135deg, #eff6ff 0%, #faf5ff 50%, #ffffff 100%);
            --bg-hero: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #8b5cf6 100%);
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }
        .app-container { display: flex; flex-direction: column; min-height: 100vh; }
        .main-content { flex: 1; }
        .header { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            position: sticky; top: 0; z-index: 100;
            transition: all var(--transition-normal);
        }
        .header-scrolled { box-shadow: var(--shadow-md); background: rgba(255, 255, 255, 0.95); }
        .header-inner { 
            max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 70px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; cursor: pointer; user-select: none; }
        .logo-icon { 
            width: 44px; height: 44px; 
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); 
            border-radius: var(--radius-md); 
            display: flex; align-items: center; justify-content: center; color: white; font-size: 22px;
            transition: all var(--transition-normal);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .logo:hover .logo-icon { transform: rotate(-8deg) scale(1.08); }
        .logo-text { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav { display: flex; gap: 36px; }
        .nav a { 
            color: var(--text-secondary); text-decoration: none; font-weight: 500;
            position: relative; transition: color var(--transition-fast); padding: 8px 0;
        }
        .nav a:hover { color: var(--primary-color); }
        .nav a.active { color: var(--primary-color); font-weight: 600; }
        .nav a.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color)); border-radius: 2px;
        }
        .btn { 
            padding: 10px 22px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer;
            border: none; font-size: 14px; transition: all var(--transition-fast);
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            white-space: nowrap; background: transparent; color: var(--text-secondary);
            font-family: inherit; text-decoration: none;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); 
            color: white; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }
        .btn-accent { background: linear-gradient(135deg, var(--accent-color), #7c3aed); color: white; box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4); }
        .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5); }
        .btn-outline { border: 1.5px solid var(--border-color); color: var(--text-secondary); background: var(--bg-primary); }
        .btn-outline:hover { border-color: var(--primary-color); color: var(--primary-color); background: var(--primary-lighter); }
        .btn-success { background: var(--success-color); color: white; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
        .btn-success:hover { transform: translateY(-2px); }
        .btn-danger { background: var(--danger-color); color: white; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn-lg { padding: 14px 32px; font-size: 16px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; background: var(--bg-secondary);
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 18px; transition: all var(--transition-fast); position: relative;
        }
        .icon-btn:hover { background: var(--primary-lighter); transform: scale(1.05); }
        .icon-btn .badge {
            position: absolute; top: -2px; right: -2px; width: 18px; height: 18px;
            background: var(--danger-color); color: white; border-radius: 50%;
            font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 600;
        }
        .user-menu { 
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            padding: 6px 14px 6px 6px; border-radius: 30px; transition: all var(--transition-fast);
            background: var(--bg-secondary);
        }
        .user-menu:hover { background: var(--primary-lighter); }
        .user-avatar-sm { 
            width: 34px; height: 34px; 
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 13px;
        }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; padding: 8px; }
        .mobile-nav { display: none; background: var(--bg-primary); border-bottom: 1px solid var(--border-light); padding: 12px 20px; }
        .mobile-nav.active { display: block; }
        .mobile-nav a { display: block; padding: 14px 0; color: var(--text-secondary); text-decoration: none; font-weight: 500; border-bottom: 1px solid var(--border-light); }
        .mobile-nav a:last-child { border-bottom: none; }
        .mobile-nav a.active { color: var(--primary-color); }

        .hero { 
            background: var(--bg-hero); color: white; padding: 100px 24px 120px; text-align: center;
            position: relative; overflow: hidden;
        }
        .hero::before, .hero::after {
            content: ''; position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
        }
        .hero::before { width: 400px; height: 400px; background: #8b5cf6; top: -100px; left: -100px; animation: float 6s ease-in-out infinite; }
        .hero::after { width: 300px; height: 300px; background: #06b6d4; bottom: -80px; right: -50px; animation: float 6s ease-in-out infinite reverse; }
        @keyframes float { 0%,100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-20px) translateX(10px); } }
        .hero-content { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 30px; font-size: 13px; margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.2); animation: fadeInDown 0.6s ease;
        }
        .hero h1 { 
            font-size: clamp(36px, 5vw, 56px); font-weight: 800; margin-bottom: 20px; line-height: 1.2;
            animation: fadeInUp 0.6s ease;
        }
        .hero p { 
            font-size: clamp(16px, 2.5vw, 20px); opacity: 0.9; max-width: 600px;
            margin: 0 auto 36px; line-height: 1.7;
            animation: fadeInUp 0.6s ease 0.1s both;
        }
        .hero-btns { 
            display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
            animation: fadeInUp 0.6s ease 0.2s both;
        }
        .hero .btn-outline { border-color: rgba(255,255,255,0.3); color: white; background: rgba(255,255,255,0.1); }
        .hero .btn-outline:hover { background: white; color: var(--primary-color); border-color: white; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .smart-match { max-width: 1000px; margin: -60px auto 0; padding: 0 24px; position: relative; z-index: 10; }
        .smart-match-card {
            background: var(--bg-primary); border-radius: var(--radius-xl); padding: 36px;
            box-shadow: var(--shadow-xl); animation: fadeInUp 0.8s ease 0.3s both;
        }
        .smart-match-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .smart-match-title span { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .match-fields { display: grid; grid-template-columns: 2fr 2fr 2fr 1fr; gap: 16px; margin-bottom: 20px; }
        .match-field { display: flex; flex-direction: column; gap: 8px; }
        .match-field label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
        .match-field select {
            padding: 12px 16px; border: 1.5px solid var(--border-color); border-radius: var(--radius-md);
            font-size: 14px; background: var(--bg-secondary); transition: all var(--transition-fast); font-family: inherit;
        }
        .match-field select:focus { outline: none; border-color: var(--primary-color); background: var(--bg-primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .match-btn {
            height: 100%; background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white; border: none; border-radius: var(--radius-md); font-weight: 600;
            cursor: pointer; font-size: 16px; transition: all var(--transition-fast); align-self: flex-end; padding: 12px 24px;
        }
        .match-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4); }
        .match-features { display: flex; gap: 24px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid var(--border-light); }
        .match-feature { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
        .match-feature .check { color: var(--success-color); font-weight: bold; }

        .stats-section { max-width: 1280px; margin: 60px auto; padding: 0 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .stat-card { 
            background: var(--bg-primary); border-radius: var(--radius-lg); padding: 32px 28px;
            text-align: center; box-shadow: var(--shadow-md); transition: all var(--transition-normal);
            position: relative; overflow: hidden; border: 1px solid var(--border-light);
        }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            transform: scaleX(0); transform-origin: left; transition: transform var(--transition-normal);
        }
        .stat-card:hover::before { transform: scaleX(1); }
        .stat-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
        .stat-icon { 
            width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 16px; font-size: 30px; transition: all var(--transition-normal);
        }
        .stat-card:nth-child(1) .stat-icon { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #2563eb; }
        .stat-card:nth-child(2) .stat-icon { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); color: #7c3aed; }
        .stat-card:nth-child(3) .stat-icon { background: linear-gradient(135deg, #dcfce7, #bbf7d0); color: #16a34a; }
        .stat-card:nth-child(4) .stat-icon { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #d97706; }
        .stat-card:hover .stat-icon { transform: scale(1.1) rotate(5deg); }
        .stat-value { 
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .stat-label { color: var(--text-secondary); font-size: 14px; margin-top: 8px; font-weight: 500; }

        .section { max-width: 1280px; margin: 0 auto; padding: 80px 24px; }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 48px; flex-wrap: wrap; gap: 16px; }
        .section-title-wrap h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; line-height: 1.3; }
        .section-title-wrap h2 span { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-desc { color: var(--text-secondary); margin-top: 10px; font-size: 16px; max-width: 500px; }
        .section-more { color: var(--primary-color); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: gap var(--transition-fast); }
        .section-more:hover { gap: 10px; }

        .features-section { background: var(--bg-secondary); }
        .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .feature-card { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 36px 28px; transition: all var(--transition-normal); border: 1px solid var(--border-light); }
        .feature-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-xl); border-color: transparent; }
        .feature-icon { width: 64px; height: 64px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 20px; }
        .feature-card:nth-child(1) .feature-icon { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
        .feature-card:nth-child(2) .feature-icon { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); }
        .feature-card:nth-child(3) .feature-icon { background: linear-gradient(135deg, #dcfce7, #bbf7d0); }
        .feature-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
        .feature-card p { color: var(--text-secondary); line-height: 1.7; }

        .teachers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .teacher-card { 
            background: var(--bg-primary); border-radius: var(--radius-lg); padding: 28px;
            box-shadow: var(--shadow-sm); transition: all var(--transition-normal); cursor: pointer;
            position: relative; border: 1px solid var(--border-light);
        }
        .teacher-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-xl); border-color: transparent; }
        .teacher-badge { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; }
        .badge-icon {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 13px; color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .badge-icon.certified { background: linear-gradient(135deg, var(--success-color), #059669); }
        .badge-icon.trial { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .teacher-header { display: flex; gap: 16px; margin-bottom: 20px; align-items: flex-start; }
        .teacher-avatar { 
            width: 68px; height: 68px; 
            background: linear-gradient(135deg, var(--primary-light), var(--accent-color)); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 26px; font-weight: 700; flex-shrink: 0;
            transition: all var(--transition-normal); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .teacher-card:hover .teacher-avatar { transform: scale(1.08); }
        .teacher-info { flex: 1; min-width: 0; }
        .teacher-info h3 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .teacher-rating { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--warning-color); font-size: 13px; }
        .teacher-rating .num { color: var(--text-primary); font-weight: 600; font-size: 14px; }
        .teacher-rating .count { color: var(--text-muted); }
        .trial-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; background: var(--success-light); color: var(--success-color); border-radius: 12px; font-size: 11px; font-weight: 600; margin-top: 8px; }
        .teacher-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .tag { padding: 5px 12px; background: var(--primary-lighter); color: var(--primary-dark); border-radius: 20px; font-size: 12px; font-weight: 500; transition: all var(--transition-fast); cursor: pointer; }
        .tag:hover { background: var(--primary-color); color: white; transform: scale(1.05); }
        .tag.purple { background: #f3e8ff; color: #7c3aed; }
        .tag.green { background: #dcfce7; color: #16a34a; }
        .teacher-meta { display: flex; gap: 20px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-light); font-size: 13px; color: var(--text-secondary); }
        .teacher-meta span { display: flex; align-items: center; gap: 4px; }
        .teacher-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .teacher-price { display: flex; flex-direction: column; }
        .teacher-price .amount { font-size: 26px; font-weight: 800; color: var(--danger-color); }
        .teacher-price .unit { font-size: 12px; color: var(--text-muted); }
        .teacher-action { opacity: 0; transform: translateY(10px); transition: all var(--transition-normal); }
        .teacher-card:hover .teacher-action { opacity: 1; transform: translateY(0); }

        .page-header { background: var(--bg-hero); color: white; padding: 60px 24px 100px; position: relative; overflow: hidden; }
        .page-header::before { content: ''; position: absolute; width: 500px; height: 500px; background: rgba(139, 92, 246, 0.3); border-radius: 50%; filter: blur(100px); top: -200px; right: -100px; }
        .page-header-content { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }
        .page-header h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; margin-bottom: 12px; }
        .page-header p { opacity: 0.9; font-size: 16px; }

        .search-section { max-width: 1280px; margin: -50px auto 32px; padding: 0 24px; position: relative; z-index: 10; }
        .search-bar { display: flex; gap: 12px; padding: 8px; background: var(--bg-primary); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); }
        .search-input-wrap {
            flex: 1; display: flex; align-items: center; gap: 12px; padding: 0 20px;
            background: var(--bg-secondary); border-radius: var(--radius-md); transition: all var(--transition-fast);
        }
        .search-input-wrap:focus-within { background: var(--bg-primary); box-shadow: 0 0 0 2px var(--primary-color); }
        .search-icon { font-size: 18px; color: var(--text-muted); }
        .search-input { flex: 1; padding: 14px 0; border: none; outline: none; font-size: 16px; background: transparent; font-family: inherit; }
        .search-input::placeholder { color: var(--text-muted); }
        .search-btn { padding: 0 32px; background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; font-size: 16px; transition: all var(--transition-fast); }
        .search-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }

        .filter-bar { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
        .filter-chip { padding: 10px 20px; background: var(--bg-primary); border: 1.5px solid var(--border-color); border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all var(--transition-fast); }
        .filter-chip:hover:not(.active) { border-color: var(--primary-color); color: var(--primary-color); background: var(--primary-lighter); }
        .filter-chip.active { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); color: white; border-color: transparent; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3); }
        .sort-bar { display: flex; justify-content: space-between; align-items: center; margin: 24px 0; flex-wrap: wrap; gap: 12px; }
        .sort-count { color: var(--text-secondary); }
        .sort-count strong { color: var(--primary-color); font-weight: 700; }
        .sort-options { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .sort-options span { color: var(--text-secondary); font-size: 13px; }

        .modal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all var(--transition-normal); padding: 20px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal { 
            background: var(--bg-primary); border-radius: var(--radius-xl); width: 100%;
            max-width: 460px; padding: 40px 36px; max-height: 90vh; overflow-y: auto;
            transform: scale(0.9) translateY(20px); transition: all var(--transition-normal); box-shadow: var(--shadow-xl);
        }

            escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = String(str);
                return div.innerHTML;
            },
            formatDate(date) {
                const d = new Date(date);
                if (isNaN(d.getTime())) return date;
                return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            },
            formatDateInput(date) {
                const d = new Date(date);
                const tzOffset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - tzOffset).toISOString().split('T')[0];
            },
            getMinDateTime() {
                const now = new Date();
                now.setMinutes(now.getMinutes() + 60);
                return { date: this.formatDateInput(now), time: now.toTimeString().slice(0, 5) };
            },
            validateInput(value, rules = {}) {
                const errors = [];
                if (rules.required && !String(value).trim()) errors.push('此项为必填项');
                if (rules.minLength && String(value).length < rules.minLength) errors.push(`至少需要${rules.minLength}个字符`);
                if (rules.pattern && !rules.pattern.test(value)) errors.push(rules.message || '格式不正确');
                return errors;
            },
            generateId(prefix = 'id') {
                return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            }
        };

            set(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); return true; }
                catch (e) { return false; }
            }
        };
