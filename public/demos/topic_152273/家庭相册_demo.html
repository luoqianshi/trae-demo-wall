<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>家庭相册管理系统 · 创意演示</title>
<style>
/* ============================================================
   Family Album Explorer — Design Tokens
   ============================================================ */
:root {
  --bg-base-default: #1a1b1d;
  --bg-base-secondary: #222427;
  --bg-base-tertiary: #2a2d31;
  --bg-overlay-l1: rgba(224, 227, 242, 0.04);
  --bg-overlay-l2: rgba(224, 227, 242, 0.06);
  --bg-overlay-l3: rgba(224, 227, 242, 0.08);
  --bg-brand: #32f08c;
  --bg-brand-hover: #0fdc78;
  --bg-brand-pressed: #0bc76b;
  --text-default: #d1d3db;
  --text-secondary: #9599a6;
  --text-tertiary: #666b75;
  --text-inverse: #1a1b1d;
  --icon-default: #d1d3db;
  --icon-secondary: #9599a6;
  --icon-tertiary: #666b75;
  --border-neutral-l1: rgba(224, 227, 242, 0.1);
  --border-neutral-l2: rgba(224, 227, 242, 0.16);
  --border-neutral-l3: rgba(224, 227, 242, 0.24);
  --status-error-default: #f65a5a;
  --status-error-bg: rgba(246, 90, 90, 0.12);
  --status-warning-default: #d27e24;
  --status-warning-bg: rgba(210, 126, 36, 0.12);
  --status-success-default: #33c192;
  --status-success-bg: rgba(51, 193, 146, 0.12);
  --status-info-default: #4a9eff;
  --status-info-bg: rgba(74, 158, 255, 0.12);
  --font-sans: "SF Pro Text", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-display: "SF Pro Display", "SF Pro", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 13px;
  --font-size-md: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 20px;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
  --transition-fast: 120ms ease;
  --transition-base: 180ms ease;
  --transition-slow: 240ms ease;
  --titlebar-height: 40px;
  --statusbar-height: 24px;
  --activitybar-width: 48px;
  --sidebar-width: 260px;
  --toolbar-height: 40px;
}

[data-theme="light"] {
  --bg-base-default: #f5f5f7;
  --bg-base-secondary: #ffffff;
  --bg-base-tertiary: #eaeaec;
  --bg-overlay-l1: rgba(0, 0, 0, 0.04);
  --bg-overlay-l2: rgba(0, 0, 0, 0.06);
  --bg-overlay-l3: rgba(0, 0, 0, 0.08);
  --bg-brand: #0a9b57;
  --bg-brand-hover: #088a4c;
  --bg-brand-pressed: #077a43;
  --text-default: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #a1a1a6;
  --text-inverse: #ffffff;
  --icon-default: #1d1d1f;
  --icon-secondary: #6e6e73;
  --icon-tertiary: #a1a1a6;
  --border-neutral-l1: rgba(0, 0, 0, 0.1);
  --border-neutral-l2: rgba(0, 0, 0, 0.16);
  --border-neutral-l3: rgba(0, 0, 0, 0.24);
  --status-error-default: #d93025;
  --status-error-bg: rgba(217, 48, 37, 0.12);
  --status-warning-default: #f9ab00;
  --status-warning-bg: rgba(249, 171, 0, 0.12);
  --status-success-default: #188038;
  --status-success-bg: rgba(24, 128, 56, 0.12);
  --status-info-default: #1a73e8;
  --status-info-bg: rgba(26, 115, 232, 0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: var(--font-sans);
  font-size: var(--font-size-base);
  color: var(--text-default);
  background: var(--bg-base-default);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; }
input { font: inherit; color: inherit; border: none; outline: none; background: none; }
ul, ol { list-style: none; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

.icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-style: normal;
  font-family: "Segoe UI Symbol", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  line-height: 1;
}
.icon-scan::before { content: "\2913"; }
.icon-list::before { content: "\2630"; }
.icon-grid::before { content: "\25A6"; }
.icon-detail::before { content: "\2261"; }
.icon-photos::before { content: "\25A1"; }
.icon-fav::before { content: "\2605"; }
.icon-folder::before { content: "\25BD"; }
.icon-folder-open::before { content: "\25BC"; }
.icon-timeline::before { content: "\25CB"; }
.icon-tags::before { content: "\2631"; }
.icon-settings::before { content: "\2699"; }
.icon-help::before { content: "\3F"; }
.icon-menu::before { content: "\2630"; }
.icon-search::before { content: "\2315"; }
.icon-photo::before { content: "\25A1"; }
.icon-video::before { content: "\25B6"; }
.icon-recent::before { content: "\25CB"; }
.icon-edit::before { content: "\270E"; }
.icon-download::before { content: "\2B07"; }
.icon-calendar::before { content: "\25A0"; }
.icon-file::before { content: "\25A0"; }
.icon-disk::before { content: "\25CB"; }
.icon-note::before { content: "\2261"; }
.icon-tag::before { content: "\2631"; }
.icon-delete::before { content: "\2715"; }
.icon-eye-off::before { content: "\2296"; }
.icon-check::before { content: "\2713"; }
.icon-warning::before { content: "\26A0"; }
.icon-move::before { content: "\2192"; }
.icon-star::before { content: "\2605"; }
.icon-star-empty::before { content: "\2606"; }
.icon-sun::before { content: "\2600"; }
.icon-moon::before { content: "\263E"; }

.ide {
  display: grid;
  width: 100vw;
  height: 100vh;
  grid-template-rows: var(--titlebar-height) 1fr var(--statusbar-height);
  grid-template-columns: var(--activitybar-width) var(--sidebar-width) minmax(0, 1fr);
  grid-template-areas:
    "titlebar titlebar titlebar"
    "activity sidebar  main"
    "statusbar statusbar statusbar";
  background: var(--bg-base-default);
}

/* Titlebar */
.titlebar {
  grid-area: titlebar;
  height: var(--titlebar-height);
  background: var(--bg-base-secondary);
  border-bottom: 1px solid var(--border-neutral-l1);
  display: flex;
  align-items: center;
  padding: 0 var(--space-3);
  gap: var(--space-3);
}
.traffic-lights { display: flex; gap: 8px; padding-right: var(--space-2); }
.traffic-lights span { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.tl-close { background: #ff5f57; }
.tl-min   { background: #febc2e; }
.tl-max   { background: #28c840; }

.mode-pill {
  background: var(--bg-brand);
  color: var(--text-inverse);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-semibold);
  padding: 3px 10px;
  border-radius: 10px;
  letter-spacing: 0.5px;
}

.project-selector {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-default);
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  transition: background var(--transition-fast);
}
.project-selector:hover { background: var(--bg-overlay-l2); }
.project-selector .chev { font-size: 9px; color: var(--text-secondary); margin-top: 1px; }

.nav-btns { display: flex; gap: 2px; }
.nav-btn {
  width: 28px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--icon-secondary);
  transition: all var(--transition-fast);
}
.nav-btn:hover { background: var(--bg-overlay-l2); color: var(--icon-default); }

.search-box {
  flex: 1;
  max-width: 520px;
  height: 26px;
  background: var(--bg-overlay-l1);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  display: flex; align-items: center;
  padding: 0 var(--space-2) 0 8px;
  gap: 6px;
  transition: all var(--transition-fast);
}
.search-box:focus-within {
  background: var(--bg-base-default);
  border-color: var(--bg-brand);
  box-shadow: 0 0 0 2px rgba(50, 240, 140, 0.15);
}
.search-box .s-icon { color: var(--icon-tertiary); font-size: 13px; }
.search-box input { flex: 1; font-size: var(--font-size-sm); color: var(--text-default); }
.search-box input::placeholder { color: var(--text-tertiary); }
.search-kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-tertiary);
  background: var(--bg-overlay-l2);
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid var(--border-neutral-l1);
}

.titlebar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: var(--space-2);
}
.mobile-menu-toggle {
  display: none;
  width: 28px; height: 26px;
  align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--icon-secondary);
  font-size: 15px;
  transition: all var(--transition-fast);
}
.mobile-menu-toggle:hover { background: var(--bg-overlay-l2); color: var(--icon-default); }
.btn-scan {
  display: flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 12px;
  background: var(--bg-brand);
  color: var(--text-inverse);
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  border-radius: var(--radius-sm);
  transition: background var(--transition-fast);
}
.btn-scan:hover { background: var(--bg-brand-hover); }
.icon-btn {
  width: 28px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--icon-secondary);
  font-size: 15px;
  transition: all var(--transition-fast);
}
.icon-btn:hover { background: var(--bg-overlay-l2); color: var(--icon-default); }
.icon-btn.active { color: var(--icon-default); background: var(--bg-overlay-l2); }
.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #32f08c, #2b9eff);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: var(--font-weight-semibold);
  color: #0a0a0a;
  margin-left: 4px;
}

.user-menu-wrap { position: relative; }
.user-menu, .album-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 180px;
  background: var(--bg-base-secondary);
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: 4px;
  display: none;
  z-index: 200;
}
.user-menu.show, .album-menu.show { display: block; }
.user-menu a, .user-menu button,
.album-menu a, .album-menu button {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 7px 10px;
  border-radius: var(--radius-xs);
  color: var(--text-default);
  font-size: var(--font-size-sm);
  text-decoration: none;
  text-align: left;
  background: transparent;
}
.user-menu a:hover, .user-menu button:hover,
.album-menu a:hover, .album-menu button:hover { background: var(--bg-overlay-l2); }
.user-menu .divider, .album-menu .divider {
  height: 1px; background: var(--border-neutral-l1);
  margin: 4px 6px;
}
.album-menu { right: auto; left: 0; }
.album-menu .album-current {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-default);
}
.album-option-row {
  display: flex; align-items: center; gap: 4px;
  border-radius: var(--radius-xs);
}
.album-option-row:hover { background: var(--bg-overlay-l2); }
.album-option-row.active { background: var(--bg-brand); }
.album-option-row.active .album-option,
.album-option-row.active .album-actions button { color: var(--text-inverse); }
.album-option {
  flex: 1;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-xs);
  background: transparent;
  font-size: var(--font-size-sm);
}
.album-actions {
  display: flex; align-items: center;
  padding-right: 4px;
  opacity: 0;
  transition: opacity var(--transition-fast);
}
.album-option-row:hover .album-actions { opacity: 1; }
.album-actions button {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-xs);
  color: var(--text-secondary);
  font-size: 12px;
  padding: 0;
}
.album-actions button:hover { background: var(--bg-overlay-l3); color: var(--text-default); }
.album-custom {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px;
}
.album-custom input {
  flex: 1;
  background: var(--bg-base-default);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-xs);
  padding: 5px 8px;
  font-size: var(--font-size-xs);
  color: var(--text-default);
}
.album-custom button {
  padding: 5px 10px;
  border-radius: var(--radius-xs);
  font-size: var(--font-size-xs);
  background: var(--bg-brand);
  color: var(--text-inverse);
}

/* Activity Bar */
.activitybar {
  grid-area: activity;
  width: var(--activitybar-width);
  background: var(--bg-base-secondary);
  border-right: 1px solid var(--border-neutral-l1);
  display: flex; flex-direction: column;
  padding: 6px 0;
}
.activity-top { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.activity-bottom { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; }
.act-item {
  position: relative;
  width: 48px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  color: var(--icon-secondary);
  font-size: 20px;
  cursor: pointer;
  transition: color var(--transition-fast);
}
.act-item:hover { color: var(--icon-default); }
.act-item.active { color: var(--icon-default); }
.act-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 2px;
  background: var(--bg-brand);
  border-radius: 0 2px 2px 0;
}

/* Sidebar */
.sidebar {
  grid-area: sidebar;
  background: var(--bg-base-default);
  border-right: 1px solid var(--border-neutral-l1);
  display: flex; flex-direction: column;
  overflow: hidden;
  margin: 6px 0 6px 6px;
  border-radius: var(--radius-md);
}
.sidebar-header {
  height: 34px;
  padding: 0 var(--space-3) 0 var(--space-4);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.sidebar-title {
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-semibold);
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
}
.sidebar-actions { display: flex; gap: 2px; }
.sb-action {
  width: 24px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  color: var(--icon-secondary);
  border-radius: var(--radius-xs);
  font-size: 13px;
  transition: all var(--transition-fast);
}
.sb-action:hover { background: var(--bg-overlay-l2); color: var(--icon-default); }

.tree {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 var(--space-1) var(--space-2);
  font-size: var(--font-size-sm);
}
.tree::-webkit-scrollbar { width: 8px; }
.tree::-webkit-scrollbar-thumb { background: var(--bg-overlay-l2); border-radius: 4px; }
.tree::-webkit-scrollbar-track { background: transparent; }

.tree-node { user-select: none; }
.tree-row {
  display: flex; align-items: center;
  height: 26px;
  padding: 0 8px;
  gap: 4px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  color: var(--text-default);
  white-space: nowrap;
  transition: background var(--transition-fast);
  text-decoration: none;
}
.tree-row:hover { background: var(--bg-overlay-l1); }
.tree-row.selected {
  background: var(--bg-overlay-l3);
  color: #fff;
}
.tree-chev {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.tree-chev::before {
  content: '';
  width: 5px; height: 5px;
  border-top: 1.5px solid var(--text-tertiary);
  border-right: 1.5px solid var(--text-tertiary);
  transform: rotate(45deg);
  transition: transform var(--transition-fast);
}
.tree-chev.open::before { transform: rotate(135deg); }
.tree-leaf {
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.tree-leaf::before {
  content: '';
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--text-tertiary);
}
.tree-icon { font-size: 14px; flex-shrink: 0; color: var(--text-tertiary); }
.tree-row:hover .tree-icon { color: var(--icon-default); }
.tree-row:hover .tree-leaf::before { background: var(--icon-default); }
.tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tree-count {
  font-size: 10px;
  color: var(--text-tertiary);
  margin-left: 4px;
  font-family: var(--font-mono);
}
.tree-children { padding-left: 14px; overflow: hidden; }
.tree-children.collapsed { display: none; }

.sidebar-footer {
  flex-shrink: 0;
  padding: 8px var(--space-3);
  border-top: 1px solid var(--border-neutral-l1);
  font-size: var(--font-size-xs);
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-dot { width: 6px; height: 6px; border-radius: 50%; }
.stat-dot.green { background: var(--bg-brand); }
.stat-dot.yellow { background: var(--status-warning-default); }

/* Main */
.main {
  grid-area: main;
  background: var(--bg-base-default);
  display: flex; flex-direction: column;
  overflow: hidden;
  margin: 6px 6px 6px 0;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-neutral-l1);
}

.toolbar {
  height: var(--toolbar-height);
  flex-shrink: 0;
  display: flex; align-items: center;
  border-bottom: 1px solid var(--border-neutral-l1);
  padding: 0 var(--space-2);
  background: var(--bg-base-secondary);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.tabs { display: flex; height: 100%; }
.tab {
  position: relative;
  height: 100%;
  padding: 0 var(--space-4);
  display: flex; align-items: center; gap: 6px;
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  border-right: 1px solid var(--border-neutral-l1);
  cursor: pointer;
  transition: color var(--transition-fast);
  text-decoration: none;
}
.tab:hover { color: var(--text-default); }
.tab.active {
  color: var(--text-default);
  background: var(--bg-base-default);
}
.tab.active::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: var(--bg-brand);
}
.tab .t-icon { font-size: 13px; }

.toolbar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 2px;
}
.tool-btn {
  height: 26px; padding: 0 8px;
  display: flex; align-items: center; gap: 5px;
  border-radius: var(--radius-sm);
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
  transition: all var(--transition-fast);
}
.tool-btn:hover { background: var(--bg-overlay-l2); color: var(--text-default); }
.tool-btn.active { background: var(--bg-overlay-l3); color: var(--bg-brand); }

.breadcrumb {
  flex-shrink: 0;
  height: 28px;
  padding: 0 var(--space-4);
  display: flex; align-items: center; gap: 6px;
  font-size: var(--font-size-xs);
  color: var(--text-tertiary);
  border-bottom: 1px solid var(--border-neutral-l1);
  background: var(--bg-base-default);
}
.bc-item { cursor: pointer; color: var(--text-secondary); text-decoration: none; }
.bc-item:hover { color: var(--text-default); }
.bc-sep { color: var(--text-tertiary); font-size: 10px; }
.bc-current { color: var(--text-default); }

.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--space-4) var(--space-4) var(--space-6);
}
.content::-webkit-scrollbar { width: 10px; }
.content::-webkit-scrollbar-thumb { background: var(--bg-overlay-l2); border-radius: 5px; }
.content::-webkit-scrollbar-thumb:hover { background: var(--bg-overlay-l3); }
.content::-webkit-scrollbar-track { background: transparent; }

.section { margin-bottom: var(--space-5); }
.section-header {
  display: flex; align-items: center; gap: var(--space-2);
  margin-bottom: var(--space-3);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-neutral-l1);
}
.section-title {
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-default);
  letter-spacing: 0.3px;
}
.section-meta {
  font-size: var(--font-size-xs);
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}

.folder-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: var(--space-2);
}
.folder-card {
  display: flex; flex-direction: column; align-items: center;
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--bg-overlay-l1);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition-fast);
  text-decoration: none;
  color: inherit;
}
.folder-card:hover {
  background: var(--bg-overlay-l2);
  border-color: var(--border-neutral-l2);
  transform: translateY(-1px);
}
.folder-card .f-icon { font-size: 36px; margin-bottom: 6px; }
.folder-card .f-name {
  font-size: var(--font-size-xs);
  color: var(--text-default);
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.folder-card .f-count {
  font-size: 10px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  margin-top: 2px;
}

.view-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-4);
}
.view-title {
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-semibold);
  color: var(--text-default);
}
.view-desc {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
}

.timeline-layout {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: var(--space-4);
  height: calc(100vh - var(--titlebar-height) - var(--statusbar-height) - 80px);
  overflow: hidden;
}
.timeline-index {
  padding: var(--space-3) var(--space-2);
  border-right: 1px solid var(--border-neutral-l1);
  overflow-y: auto;
}
.timeline-index-title {
  font-size: var(--font-size-xs);
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: var(--space-3);
}
.timeline-index-item {
  display: block;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: var(--font-size-sm);
  text-decoration: none;
  margin-bottom: 2px;
}
.timeline-index-item:hover { background: var(--bg-overlay-l2); color: var(--text-default); }
.timeline-scroll {
  overflow-y: auto;
  padding: var(--space-4) var(--space-5);
}
.timeline-axis {
  position: relative;
  padding-left: 28px;
}
.timeline-axis::before {
  content: '';
  position: absolute;
  left: 8px; top: 8px; bottom: 8px;
  width: 2px;
  background: var(--border-neutral-l2);
  border-radius: 1px;
}
.timeline-year-node {
  position: relative;
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-4);
  scroll-margin-top: var(--space-4);
}
.timeline-year-dot {
  position: absolute;
  left: -24px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--bg-brand);
  border: 2px solid var(--bg-base-secondary);
  box-shadow: 0 0 0 2px var(--bg-brand);
}
.timeline-year-label {
  font-size: var(--font-size-xl);
  font-weight: var(--font-weight-semibold);
  color: var(--text-default);
}
.timeline-month-node {
  position: relative;
  display: flex; align-items: flex-start; gap: var(--space-3);
  margin-bottom: var(--space-4);
}
.timeline-month-dot {
  position: absolute;
  left: -21px; top: 14px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border-neutral-l3);
}
.timeline-month-card {
  flex: 1;
  background: var(--bg-base-secondary);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-md);
  padding: var(--space-3);
}
.timeline-month-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-3);
}
.timeline-month-name {
  font-size: var(--font-size-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-default);
}
.timeline-month-count {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
  background: var(--bg-overlay-l1);
  padding: 2px 8px;
  border-radius: 10px;
}
.timeline-photo-strip {
  display: flex; flex-wrap: wrap; gap: var(--space-2);
}
.timeline-thumb {
  position: relative;
  width: 80px; height: 80px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--bg-base-tertiary);
  cursor: pointer;
}
.timeline-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.timeline-more {
  width: 80px; height: 80px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  background: var(--bg-overlay-l2);
  color: var(--text-secondary);
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
}

.tag-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: var(--space-2);
}
.tag-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--bg-overlay-l1);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition-fast);
  text-decoration: none; color: inherit;
}
.tag-card:hover {
  background: var(--bg-overlay-l2);
  border-color: var(--border-neutral-l2);
}
.tag-card .tag-name {
  font-size: var(--font-size-sm);
  color: var(--text-default);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tag-card .tag-count {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
  font-family: var(--font-mono);
}

.settings-form { max-width: 560px; }
.settings-section {
  margin-bottom: var(--space-5);
  padding-bottom: var(--space-4);
  border-bottom: 1px solid var(--border-neutral-l1);
}
.settings-section:last-child { border-bottom: none; }
.settings-section h3 {
  font-size: var(--font-size-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-default);
  margin-bottom: var(--space-3);
}
.form-row {
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: var(--space-3);
}
.form-row label {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
}
.form-row input[type="text"] {
  background: var(--bg-base-default);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  color: var(--text-default);
  font-size: var(--font-size-sm);
}
.form-row input[type="text"]:focus {
  border-color: var(--bg-brand);
  outline: none;
}
.form-hint {
  font-size: var(--font-size-xs);
  color: var(--text-tertiary);
}
.settings-actions {
  display: flex; gap: var(--space-2); flex-wrap: wrap;
}
.settings-actions button {
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: var(--font-size-sm);
  transition: all var(--transition-fast);
}
.settings-actions .btn-primary { background: var(--bg-brand); color: var(--text-inverse); }
.settings-actions .btn-primary:hover { background: var(--bg-brand-hover); }
.settings-actions .btn-secondary { background: var(--bg-overlay-l2); color: var(--text-default); }
.settings-actions .btn-secondary:hover { background: var(--bg-overlay-l3); }
.settings-actions .btn-danger { background: var(--status-error-bg); color: var(--status-error-default); }
.settings-actions .btn-danger:hover { background: rgba(246, 90, 90, 0.2); }
.theme-switcher {
  display: inline-flex;
  background: var(--bg-overlay-l1);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-md);
  padding: 3px;
  gap: 3px;
}
.theme-option {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  background: transparent;
  transition: all var(--transition-fast);
}
.theme-option:hover { color: var(--text-default); background: var(--bg-overlay-l2); }
.theme-option.active { color: var(--text-inverse); background: var(--bg-brand); }
.hidden-folders-list, .albums-list {
  background: var(--bg-base-default);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-sm);
  max-height: 220px;
  overflow-y: auto;
}
.albums-list { max-height: 320px; }
.hidden-folder-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-2);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-neutral-l1);
  font-size: var(--font-size-sm);
  color: var(--text-default);
}
.hidden-folder-item:last-child { border-bottom: none; }
.hidden-folder-item span { word-break: break-all; color: var(--text-secondary); }
.hidden-folder-item button {
  padding: 4px 10px;
  border-radius: var(--radius-xs);
  font-size: var(--font-size-xs);
  background: var(--bg-overlay-l2);
  color: var(--text-default);
  flex-shrink: 0;
}
.album-item {
  padding: 10px;
  border-bottom: 1px solid var(--border-neutral-l1);
}
.album-item:last-child { border-bottom: none; }
.album-item-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: 6px;
}
.album-item-name {
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  color: var(--text-default);
}
.album-item-meta {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
}
.album-item-paths { display: flex; flex-direction: column; gap: 4px; }
.album-path-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-2);
  padding: 4px 6px;
  border-radius: var(--radius-xs);
  background: var(--bg-overlay-l1);
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
}
.album-add-bar {
  display: flex; align-items: center; gap: 6px;
  margin-top: 10px;
}
.album-add-bar input {
  flex: 1;
  background: var(--bg-base-default);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  color: var(--text-default);
  font-size: var(--font-size-sm);
}
.empty-hint {
  padding: 12px;
  font-size: var(--font-size-sm);
  color: var(--text-tertiary);
  text-align: center;
}
.new-folder-bar {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 6px 8px 10px;
  border-bottom: 1px solid var(--border-neutral-l1);
}
.new-folder-bar.show { display: flex; }
.new-folder-bar input {
  flex: 1;
  background: var(--bg-base-default);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-xs);
  padding: 5px 8px;
  font-size: var(--font-size-xs);
  color: var(--text-default);
}
.new-folder-bar button {
  padding: 5px 10px;
  border-radius: var(--radius-xs);
  font-size: var(--font-size-xs);
  background: var(--bg-overlay-l2);
  color: var(--text-default);
}
.new-folder-bar button.primary { background: var(--bg-brand); color: var(--text-inverse); }

.context-menu {
  position: fixed;
  display: none;
  min-width: 150px;
  background: var(--bg-base-secondary);
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: 4px;
  z-index: 300;
}
.context-menu.show { display: block; }
.context-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 7px 10px;
  border-radius: var(--radius-xs);
  color: var(--status-error-default);
  font-size: var(--font-size-sm);
  text-decoration: none;
  text-align: left;
  cursor: pointer;
}
.context-item:hover { background: var(--status-error-bg); }
.context-item.link { color: var(--text-default); }
.context-item.link:hover { background: var(--bg-overlay-l2); }

.help-content { max-width: 640px; }
.help-section { margin-bottom: var(--space-5); }
.help-section h3 {
  font-size: var(--font-size-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-default);
  margin-bottom: var(--space-2);
}
.help-section p, .help-section li {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  line-height: var(--line-height-normal);
}
.help-section ul { list-style: disc; padding-left: 18px; }
.help-section li { margin-bottom: 4px; }
.kbd {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--bg-overlay-l2);
  border: 1px solid var(--border-neutral-l1);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-default);
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: var(--space-2);
}
.photo-card {
  position: relative;
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  background: var(--bg-base-tertiary);
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}
.photo-card:hover {
  transform: scale(1.02);
  box-shadow: var(--shadow-md);
  z-index: 2;
}
.photo-card img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: opacity var(--transition-fast);
}
.photo-card.selected-mode { outline: 2px solid transparent; outline-offset: -2px; }
.photo-card.picked { outline-color: var(--bg-brand); }
.photo-card.picked::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(50, 240, 140, 0.15);
  pointer-events: none;
}
.check-badge {
  position: absolute; top: 6px; left: 6px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,255,255,0.7);
  display: none;
  align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 700;
}
.photo-card.selected-mode .check-badge { display: flex; }
.photo-card.picked .check-badge {
  background: var(--bg-brand);
  border-color: var(--bg-brand);
  color: #0a0a0a;
}
.video-badge {
  position: absolute; top: 6px; right: 6px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 10px;
}
.fav-badge {
  position: absolute; top: 6px; left: 6px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  color: var(--status-warning-default);
  font-size: 11px;
}
.photo-card.selected-mode .fav-badge { display: none; }
.photo-info {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 16px 8px 6px;
  background: linear-gradient(transparent, rgba(0,0,0,0.75));
  color: #fff;
  font-size: 10px;
  display: flex; justify-content: space-between; align-items: center;
  opacity: 0;
  transition: opacity var(--transition-fast);
  pointer-events: none;
}
.photo-card:hover .photo-info { opacity: 1; }

.view-list .photo-grid {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.view-list .photo-card {
  aspect-ratio: auto;
  height: 56px;
  display: flex;
  align-items: center;
  padding: 6px 10px;
  gap: 12px;
  background: var(--bg-overlay-l1);
  border-radius: var(--radius-xs);
}
.view-list .photo-card:hover { transform: none; box-shadow: none; }
.view-list .photo-card img { width: 44px; height: 44px; border-radius: var(--radius-xs); object-fit: cover; flex-shrink: 0; }
.view-list .photo-card .video-badge,
.view-list .photo-card .fav-badge,
.view-list .photo-card .check-badge { top: 50%; transform: translateY(-50%); }
.view-list .photo-card .video-badge { right: 10px; }
.view-list .photo-card .fav-badge { left: 38px; top: 12px; transform: none; }
.view-list .photo-card .check-badge { left: 10px; }
.view-list .photo-info {
  position: static;
  opacity: 1;
  background: none;
  padding: 0;
  flex: 1;
  pointer-events: auto;
  font-size: var(--font-size-sm);
  color: var(--text-default);
  justify-content: flex-start;
  gap: 24px;
}
.view-list .photo-info span:last-child { margin-left: auto; color: var(--text-secondary); }

.view-detail .photo-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.view-detail .photo-card { aspect-ratio: 1; border-radius: var(--radius-sm); }
.view-detail .photo-info { opacity: 1; padding: 20px 8px 8px; font-size: var(--font-size-xs); }

.month-group { margin-bottom: var(--space-5); }
.month-header {
  display: flex; align-items: center; gap: var(--space-2);
  margin-bottom: var(--space-3);
}
.month-label {
  font-size: var(--font-size-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-default);
}
.month-line { flex: 1; height: 1px; background: var(--border-neutral-l1); }
.month-count {
  font-size: var(--font-size-xs);
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}

.statusbar {
  grid-area: statusbar;
  height: var(--statusbar-height);
  background: var(--bg-base-secondary);
  border-top: 1px solid var(--border-neutral-l1);
  display: flex;
  align-items: center;
  padding: 0 var(--space-3);
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
  gap: var(--space-3);
  font-family: var(--font-mono);
}
.sb-item { display: flex; align-items: center; gap: 5px; }
.sb-item .dot { width: 6px; height: 6px; border-radius: 50%; }
.sb-sep { width: 1px; height: 14px; background: var(--border-neutral-l1); }
.sb-right { margin-left: auto; display: flex; gap: var(--space-3); }

.load-more-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-5) 0 var(--space-6);
}
.load-more-btn {
  background: var(--bg-overlay-l2);
  border: 1px solid var(--border-neutral-l1);
  color: var(--text-default);
  padding: 8px 24px;
  border-radius: var(--radius-md);
  font-size: var(--font-size-sm);
  transition: background var(--transition-fast);
}
.load-more-btn:hover:not(:disabled) { background: var(--bg-overlay-l3); }
.load-more-btn:disabled { opacity: 0.5; cursor: default; }
.load-more-info {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
}

.lightbox {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 1000;
  display: none;
  flex-direction: column;
}
.lightbox.open { display: flex; }
.lb-top {
  height: 48px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--space-5);
  flex-shrink: 0;
}
.lb-actions { display: flex; gap: var(--space-2); }
.lb-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: background var(--transition-fast);
}
.lb-btn:hover { background: rgba(255,255,255,0.16); }
.lb-btn.active-fav { color: var(--status-warning-default); }
.lb-close {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: background var(--transition-fast);
}
.lb-close:hover { background: var(--status-error-default); }

.lb-stage {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  padding: var(--space-4);
  overflow: hidden;
}
.lb-nav {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  transition: background var(--transition-fast);
  z-index: 2;
}
.lb-nav:hover { background: rgba(255,255,255,0.2); }
.lb-prev { left: 20px; }
.lb-next { right: 20px; }
.lb-img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  user-select: none;
  -webkit-user-drag: none;
}
.lb-bottom {

.batch-bar {

<script>
(function() {
  'use strict';

  const IMAGE_API = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image';
  const IMAGES = [
    { key: 'baby', prompt: 'Cute%20baby%20close-up%20portrait%2C%20soft%20natural%20lighting%2C%20warm%20family%20atmosphere%2C%20high%20quality%20photography' },
    { key: 'family', prompt: 'Happy%20family%20picnic%20in%20green%20park%2C%20parents%20and%20children%2C%20sunny%20day%2C%20warm%20lifestyle%20photography' },
    { key: 'birthday', prompt: 'Birthday%20celebration%20with%20cake%20and%20candles%2C%20colorful%20balloons%2C%20family%20gathering%2C%20joyful%20moment' },
    { key: 'travel', prompt: 'Beautiful%20mountain%20lake%20landscape%2C%20travel%20photography%2C%20blue%20sky%20and%20green%20forests%2C%20scenic%20view' },
    { key: 'pet', prompt: 'Cute%20golden%20retriever%20dog%20playing%20in%20garden%2C%20happy%20pet%2C%20warm%20family%20moment%2C%20high%20quality%20photo' },
    { key: 'food', prompt: 'Homemade%20family%20dinner%20on%20wooden%20table%2C%20warm%20kitchen%20lighting%2C%20delicious%20food%20photography' },
    { key: 'kids', prompt: 'Children%20playing%20in%20playground%2C%20laughing%20and%20running%2C%20joyful%20childhood%20moment%2C%20outdoor%20photography' },
    { key: 'beach', prompt: 'Family%20beach%20vacation%2C%20sunset%20over%20ocean%2C%20silhouette%20of%20parents%20and%20child%2C%20warm%20golden%20light' }
  ];
  const imageUrl = (idx) => `${IMAGE_API}?prompt=${IMAGES[idx % IMAGES.length].prompt}&image_size=square`;

  const folderTags = ['宝宝', '家人', '旅行', '美食', '宠物', '生活', '工作'];
  const fileNames = [
    'IMG_20260414_203556.jpg', 'IMG_20260415_113022.jpg', 'IMG_20260420_164512.jpg',
    'VID_20260422_182301.mp4', 'IMG_20260501_091234.jpg', 'IMG_20260503_152145.jpg',
    'IMG_20260510_201045.jpg', 'IMG_20260512_075630.jpg', 'IMG_20260518_134522.jpg',
    'IMG_20260601_101010.jpg', 'IMG_20260608_192030.jpg', 'IMG_20260615_082215.jpg',
    'IMG_20260622_161820.jpg', 'VID_20260625_134000.mp4', 'IMG_20260701_111111.jpg',
    'IMG_20260705_173000.jpg', 'IMG_20260710_090909.jpg', 'IMG_20260712_204500.jpg',
    'IMG_20260714_131313.jpg', 'VID_20260715_160000.mp4'
  ];

  function randomDate(start, end) {
    const d = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
    return d.toISOString().slice(0, 19).replace('T', ' ');
  }

  function randomSize() {
    return Math.floor(Math.random() * 5000 + 500) * 1024;
  }

  function randomTag() {
    return folderTags[Math.floor(Math.random() * folderTags.length)];
  }

  // 生成示例照片数据
  let photos = [];

      id: i,

        const d = new Date(2026, Math.floor(Math.random() * 4) + 3, Math.floor(Math.random() * 28) + 1);
        return d.toISOString().slice(0,10).replace(/-/g,'') + '_' + String(Math.floor(Math.random()*235959)).padStart(6,'0');
      }),
      file_type: isVideo ? 'video' : 'photo',
      shoot_time: randomDate(new Date(2026, 3, 1), new Date(2026, 6, 15)),
      file_path: `D:\\照片\\${randomTag()}\\${fileNames[(i - 1) % fileNames.length]}`,
      folder_tag: randomTag(),
      star: Math.random() > 0.85,
      note: Math.random() > 0.9 ? '珍贵的家庭回忆' : '',

      image_idx: (i - 1) % IMAGES.length
    });
  }
  photos.sort((a, b) => b.shoot_time.localeCompare(a.shoot_time));

  const categoryTree = [

        { id: 11, name: '宝宝', path: '图片/宝宝', media_count: 523, children: [] },
        { id: 12, name: '家人', path: '图片/家人', media_count: 174, children: [] },
        { id: 13, name: '工作', path: '图片/工作', media_count: 268, children: [] },
        {
          id: 14, name: '旅行', path: '图片/旅行', media_count: 402, open: false,
          children: [
            { id: 141, name: '2025 云南', path: '图片/旅行/2025 云南', media_count: 128, children: [] },
            { id: 142, name: '2024 青岛', path: '图片/旅行/2024 青岛', media_count: 96, children: [] }
          ]
        },
        { id: 15, name: '美食', path: '图片/美食', media_count: 89, children: [] },
        { id: 16, name: '宠物', path: '图片/宠物', media_count: 56, children: [] }
      ]
    },
    { id: 2, name: 'Desktop', path: 'Desktop', media_count: 8, children: [] },
    { id: 3, name: 'Temp', path: 'Temp', media_count: 6, children: [] }
  ];

  let albums = [
    { id: 'default', name: '家庭相册', paths: [] },
    { id: 'travel', name: '旅行相册', paths: ['图片/旅行'] },
    { id: 'work', name: '工作相册', paths: ['图片/工作'] }
  ];
  let currentAlbumId = 'default';
  let hiddenFolders = [];

  let state = {
    view: 'photos',
    subView: 'all',
    gridView: 'grid',
    currentCategory: null,
    currentFolder: null,
    currentTag: null,
    batchMode: false,
    picked: new Set(),
    searchKeyword: '',
    theme: 'dark'
  };

  // DOM refs
  const ide = document.getElementById('ide');
  const contentArea = document.getElementById('contentArea');
  const tabs = document.getElementById('tabs');
  const breadcrumb = document.getElementById('breadcrumb');
  const folderTreeEl = document.getElementById('folderTree');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbFname = document.getElementById('lbFname');
  const lbDate = document.getElementById('lbDate');
  const lbFolder = document.getElementById('lbFolder');
  const lbSize = document.getElementById('lbSize');
  const lbNoteText = document.getElementById('lbNoteText');
  const lbCounter = document.getElementById('lbCounter');
  const lbTags = document.getElementById('lbTags');
  const lbFav = document.getElementById('lbFav');
  const batchBar = document.getElementById('batchBar');
  const batchCount = document.getElementById('batchCount');
  const toast = document.getElementById('toast');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');

  let lightboxIndex = 0;
  let displayedPhotos = [];

  // Helpers
  function formatSize(bytes) {
    const units = ['B','KB','MB','GB'];
    let i = 0, size = bytes;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return size.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
  }

  function showToast(message, type='success') {
    toast.textContent = message;
    toast.className = 'toast ' + type + ' show';
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function showLoading(text='处理中...') {
    loadingText.textContent = text;
    loadingOverlay.classList.add('show');
  }
  function hideLoading() { loadingOverlay.classList.remove('show'); }

  function modalConfirm(title, bodyHtml, onConfirm) {
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHtml;
    modalOverlay.classList.add('show');
    const confirmBtn = document.getElementById('modalConfirm');
    const cancelBtn = document.getElementById('modalCancel');
    const confirmHandler = () => {
      modalOverlay.classList.remove('show');
      onConfirm && onConfirm();
      confirmBtn.removeEventListener('click', confirmHandler);
      cancelBtn.removeEventListener('click', cancelHandler);
    };
    const cancelHandler = () => {
      modalOverlay.classList.remove('show');
      confirmBtn.removeEventListener('click', confirmHandler);
      cancelBtn.removeEventListener('click', cancelHandler);
    };
    confirmBtn.addEventListener('click', confirmHandler);
    cancelBtn.addEventListener('click', cancelHandler);
  }

  function updateStatusBar(total, videos) {
    document.getElementById('statPhotos').textContent = `${total} 张照片`;
    document.getElementById('statVideos').textContent = `${videos} 个视频`;
    document.getElementById('sbPhotoCount').textContent = total;
    document.getElementById('sbVideoCount').textContent = videos;
  }

  function groupByMonth(list) {
    const group = {};
    list.forEach(item => {
      const d = item.shoot_time.slice(0, 10);
      const [y, m] = [d.slice(0,4), d.slice(5,7)];
      const key = `${y}年${m}月`;
      if (!group[key]) group[key] = [];
      group[key].push(item);
    });
    return group;
  }

  function filterPhotos() {
    let list = [...photos];
    if (state.view === 'favorites') list = list.filter(p => p.star);
    else if (state.view === 'tags' && state.currentTag) list = list.filter(p => p.folder_tag === state.currentTag);
    else if (state.view === 'folders' && state.currentFolder) {
      list = list.filter(p => p.file_path.includes(state.currentFolder.name));
    }

    if (state.subView === 'photo') list = list.filter(p => p.file_type === 'photo');
    if (state.subView === 'video') list = list.filter(p => p.file_type === 'video');
    if (state.subView === 'recent') list = list.slice(0, 12);

    if (state.searchKeyword) {
      const kw = state.searchKeyword.toLowerCase();
      list = list.filter(p =>
        p.file_name.toLowerCase().includes(kw) ||
        p.folder_tag.includes(kw) ||
        p.shoot_time.includes(kw) ||
        (p.note && p.note.includes(kw))
      );
    }
    return list;
  }

  function createPhotoCard(p) {
    const card = document.createElement('div');
    card.className = 'photo-card' + (p.file_type === 'video' ? ' video' : '');
    if (state.batchMode) card.classList.add('selected-mode');
    if (state.picked.has(p.id)) card.classList.add('picked');
    card.dataset.id = p.id;
    card.innerHTML = `
      <img src="${imageUrl(p.image_idx)}" alt="${p.file_name}" loading="lazy" />
      ${p.file_type === 'video' ? '<div class="video-badge"><i class="icon icon-video"></i></div>' : ''}
      ${p.star ? '<div class="fav-badge"><i class="icon icon-star"></i></div>' : ''}
      <div class="check-badge"><i class="icon icon-check"></i></div>
      <div class="photo-info">
        <span>${p.shoot_time.slice(0,10)}</span>
        <span>${p.file_type === 'video' ? '视频' : '照片'}</span>
      </div>
    `;
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.batchMode) togglePick(p.id);
      else openLightbox(p.id);
    });
    return card;
  }

  function renderPhotoGrid(list) {
    const group = groupByMonth(list);
    const keys = Object.keys(group).sort().reverse();
    let html = '';
    keys.forEach(key => {
      const items = group[key];
      html += `
        <div class="month-group" data-month="${key}">
          <div class="month-header">
            <span class="month-label">${key}</span>
            <span class="month-line"></span>
            <span class="month-count">${items.length} 项</span>
          </div>
          <div class="photo-grid">${items.map(m => `<div id="placeholder-${m.id}"></div>`).join('')}</div>
        </div>`;
    });
    if (!keys.length) {
      html = `<div class="empty-state">
        <div class="e-icon"><i class="icon icon-photos"></i></div>
        <div class="e-title">暂无照片</div>
        <div class="e-desc">点击右上角“扫描导入”按钮添加照片文件夹</div>
      </div>`;
    }
    contentArea.innerHTML = html;
    keys.forEach(key => {
      const items = group[key];
      const grid = contentArea.querySelector(`.month-group[data-month="${key}"] .photo-grid`);
      items.forEach(p => grid.appendChild(createPhotoCard(p)));
    });
    displayedPhotos = list;
    const videos = list.filter(p => p.file_type === 'video').length;
    updateStatusBar(list.length, videos);
  }

  function applyTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    const icon = document.getElementById('themeIcon');
    if (icon) icon.className = 'icon ' + (theme === 'dark' ? 'icon-moon' : 'icon-sun');
  }

  function toggleTheme() {
    applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    showToast('已切换为' + (state.theme === 'dark' ? '深色' : '浅色') + '主题');
  }

  function setGridView(mode) {
    state.gridView = mode;
    contentArea.className = 'content view-' + mode;
    document.querySelectorAll('.icon-btn[data-view]').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(mode === 'grid' ? 'viewGrid' : mode === 'list' ? 'viewList' : 'viewDetail');
    if (btn) btn.classList.add('active');
    refreshContent();
  }

  function filterByAlbum(list) {
    const album = albums.find(a => a.id === currentAlbumId);
    if (!album || !album.paths || album.paths.length === 0) return list;
    return list.filter(p => album.paths.some(path => p.file_path.includes(path) || p.folder_tag === path.split('/').pop()));
  }

  function getFilteredPhotos() {
    let list = filterPhotos();
    list = filterByAlbum(list);
    return list;
  }

  function refreshContent() {
    if (state.view === 'photos' || state.view === 'favorites') {
      renderPhotoGrid(getFilteredPhotos());
    } else if (state.view === 'folders') {
      renderFolders();
    } else if (state.view === 'timeline') {
      renderTimeline();
    } else if (state.view === 'tags') {
      renderTags();
    } else if (state.view === 'settings') {
      renderSettings();
    } else if (state.view === 'help') {
      renderHelp();
    }
    renderTabs();
    renderBreadcrumb();
    renderTree();
    updateActivityBar();
  }

  function updateActivityBar() {
    document.querySelectorAll('.act-item').forEach(a => {
      a.classList.toggle('active', a.dataset.view === state.view);
    });
  }

  function renderTabs() {
    const tabConfig = {
      photos: [
        { id: 'all', label: '全部', icon: 'icon-photos' },
        { id: 'photo', label: '照片', icon: 'icon-photo' },
        { id: 'video', label: '视频', icon: 'icon-video' },
        { id: 'recent', label: '最近', icon: 'icon-recent' }
      ],
      favorites: [
        { id: 'all', label: '全部收藏', icon: 'icon-fav' },
        { id: 'photo', label: '照片', icon: 'icon-photo' },
        { id: 'video', label: '视频', icon: 'icon-video' }
      ],
      folders: [
        { id: 'all', label: '文件夹', icon: 'icon-folder' }
      ],
      timeline: [
        { id: 'all', label: '时间线', icon: 'icon-timeline' }
      ],
      tags: [
        { id: 'all', label: '标签分类', icon: 'icon-tags' }
      ],
      settings: [
        { id: 'all', label: '设置', icon: 'icon-settings' }
      ],
      help: [
        { id: 'all', label: '帮助', icon: 'icon-help' }
      ]
    };
    const items = tabConfig[state.view] || tabConfig.photos;
    tabs.innerHTML = items.map(t => `
      <a class="tab ${state.subView === t.id || (state.subView === 'all' && t.id === 'all') ? 'active' : ''}" data-tab="${t.id}">
        <span class="t-icon"><i class="icon ${t.icon}"></i></span>
        <span>${t.label}</span>
      </a>
    `).join('');
    tabs.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.subView = tab.dataset.tab;
        refreshContent();
      });
    });
  }

  function renderBreadcrumb() {
    let current = '所有照片';
    if (state.view === 'favorites') current = '收藏夹';
    else if (state.view === 'folders') current = state.currentFolder ? state.currentFolder.name : '文件夹浏览';
    else if (state.view === 'timeline') current = '时间线';
    else if (state.view === 'tags') current = '标签分类';
    else if (state.view === 'settings') current = '设置';
    else if (state.view === 'help') current = '帮助';
    else if (state.view === 'photos' && state.currentTag) current = '标签：' + state.currentTag;
    else if (state.view === 'photos' && state.currentCategory) current = state.currentCategory;
    const album = albums.find(a => a.id === currentAlbumId);
    breadcrumb.innerHTML = `
      <span class="bc-item" data-bc="home">首页</span>
      <span class="bc-sep">›</span>
      <span class="bc-item" data-bc="album">${album ? album.name : '家庭相册'}</span>
      <span class="bc-sep">›</span><span class="bc-current">${current}</span>
    `;
    document.getElementById('sbCurrentPath').textContent = current;
    document.getElementById('sbViewMode').textContent = state.view === 'timeline' ? '时间线' : state.view === 'folders' ? '文件夹' : state.view === 'tags' ? '标签' : '照片流';
  }

  function renderTreeNode(node, level) {
    const hasChildren = node.children && node.children.length;
    const hidden = hiddenFolders.includes(node.path);
    if (hidden) return '';
    const arrow = hasChildren ? `<span class="tree-chev ${node.open ? 'open' : ''}" data-chev="${node.id}"></span>` : '<span class="tree-leaf"></span>';
    const html = `
      <div class="tree-node" data-node="${node.id}">
        <div class="tree-row ${state.currentCategory === node.path ? 'active' : ''}" data-path="${node.path}" style="padding-left:${level * 12 + 8}px">
          ${arrow}
          <span class="tree-icon"><i class="icon icon-folder"></i></span>
          <span class="tree-label">${node.name}</span>
          <span class="tree-count">${node.media_count || 0}</span>
        </div>
        ${hasChildren ? `<div class="tree-children ${node.open ? '' : 'collapsed'}" data-children="${node.id}">${node.children.map(c => renderTreeNode(c, level + 1)).join('')}</div>` : ''}
      </div>`;
    return html;
  }

  function renderTree() {
    folderTreeEl.innerHTML = categoryTree.map(n => renderTreeNode(n, 0)).join('');
  }

  function findNode(list, id) {
    for (const n of list) {
      if (n.id === id) return n;
      if (n.children) {
        const found = findNode(n.children, id);
        if (found) return found;
      }
    }
    return null;
  }

  function toggleTreeNode(id) {
    const node = findNode(categoryTree, id);
    if (node) node.open = !node.open;
    renderTree();
  }

  function renderFolders() {
    const list = state.currentFolder ? categoryTree.flatMap(f => f.children || []).filter(c => c.path.startsWith(state.currentFolder.path)) : categoryTree;
    let html = '';
    if (state.currentFolder) {
      html += `<div class="view-header"><div><div class="view-title">${state.currentFolder.name}</div><div class="view-desc">${state.currentFolder.media_count || 0} 个媒体文件</div></div></div>`;
    }
    html += `<div class="folder-grid">`;
    list.forEach(f => {
      html += `
        <div class="folder-card" data-folder="${f.path}">
          <span class="f-icon"><i class="icon icon-folder-open"></i></span>
          <span class="f-name">${f.name}</span>
          <span class="f-count">${f.media_count || 0} 项</span>
        </div>`;
    });
    html += `</div>`;
    contentArea.innerHTML = html;
    contentArea.querySelectorAll('.folder-card').forEach(c => {
      c.addEventListener('click', () => {
        const path = c.dataset.folder;
        const node = findNodeByPath(categoryTree, path);
        if (node && node.children && node.children.length) {
          state.currentFolder = node;
          refreshContent();
        } else {
          state.view = 'photos';
          state.currentCategory = path;
          refreshContent();
        }
      });
    });
    updateStatusBar(photos.length, photos.filter(p => p.file_type === 'video').length);
  }

  function findNodeByPath(list, path) {
    for (const n of list) {
      if (n.path === path) return n;
      if (n.children) {
        const found = findNodeByPath(n.children, path);
        if (found) return found;
      }
    }
    return null;
  }

  function renderTimeline() {
    const list = getFilteredPhotos();
    const group = groupByMonth(list);
    const years = {};
    Object.keys(group).sort().reverse().forEach(key => {
      const y = key.slice(0, 4);
      if (!years[y]) years[y] = [];
      years[y].push({ month: key, items: group[key] });
    });
    let html = `<div class="timeline-layout">
      <div class="timeline-index">
        <div class="timeline-index-title">年份</div>
        ${Object.keys(years).sort().reverse().map(y => `<a class="timeline-index-item" href="#year-${y}">${y}</a>`).join('')}
      </div>
      <div class="timeline-scroll">
        <div class="timeline-axis">`;
    Object.keys(years).sort().reverse().forEach(y => {
      html += `
        <div class="timeline-year-node" id="year-${y}">
          <div class="timeline-year-dot"></div>
          <div class="timeline-year-label">${y}年</div>
        </div>`;
      years[y].forEach(m => {
        html += `
          <div class="timeline-month-node">
            <div class="timeline-month-dot"></div>
            <div class="timeline-month-card">
              <div class="timeline-month-header">
                <span class="timeline-month-name">${m.month}</span>
                <span class="timeline-month-count">${m.items.length} 项</span>
              </div>
              <div class="timeline-photo-strip">
                ${m.items.slice(0, 6).map(p => `<div class="timeline-thumb" data-id="${p.id}"><img src="${imageUrl(p.image_idx)}" alt="${p.file_name}" loading="lazy" /></div>`).join('')}
                ${m.items.length > 6 ? `<div class="timeline-more">+${m.items.length - 6}</div>` : ''}
              </div>
            </div>
          </div>`;
      });
    });
    html += `</div></div></div>`;
    contentArea.innerHTML = html;
    contentArea.querySelectorAll('.timeline-thumb').forEach(t => {
      t.addEventListener('click', () => openLightbox(parseInt(t.dataset.id)));
    });
    updateStatusBar(list.length, list.filter(p => p.file_type === 'video').length);
  }

  function renderTags() {
    const list = getFilteredPhotos();
    const tagMap = {};
    list.forEach(p => {
      const tag = p.folder_tag || '未分类';
      tagMap[tag] = (tagMap[tag] || 0) + 1;
    });
    let html = `<div class="view-header"><div><div class="view-title">标签分类</div><div class="view-desc">共 ${Object.keys(tagMap).length} 个标签</div></div></div>`;
    html += `<div class="tag-grid">`;
    Object.keys(tagMap).sort().forEach(tag => {
      html += `
        <div class="tag-card" data-tag="${tag}">
          <span class="tag-name">${tag}</span>
          <span class="tag-count">${tagMap[tag]}</span>
        </div>`;
    });
    html += `</div>`;
    contentArea.innerHTML = html;
    contentArea.querySelectorAll('.tag-card').forEach(c => {
      c.addEventListener('click', () => {
        state.view = 'photos';
        state.currentTag = c.dataset.tag;
        refreshContent();
      });
    });
    updateStatusBar(list.length, list.filter(p => p.file_type === 'video').length);
  }

  function renderSettings() {
    const album = albums.find(a => a.id === currentAlbumId);
    let html = `<div class="settings-form">
      <div class="settings-section">
        <h3>外观</h3>
        <div class="form-row">
          <label>主题模式</label>
          <div class="theme-switcher">
            <button class="theme-option ${state.theme === 'dark' ? 'active' : ''}" data-theme="dark">深色</button>
            <button class="theme-option ${state.theme === 'light' ? 'active' : ''}" data-theme="light">浅色</button>
          </div>
        </div>
      </div>
      <div class="settings-section">
        <h3>相册空间</h3>
        <div class="albums-list" id="settingsAlbumList"></div>
        <div class="album-add-bar">
          <input type="text" id="settingsNewAlbum" placeholder="新建相册名称" />
          <button id="settingsAddAlbum">新增</button>
        </div>
      </div>
      <div class="settings-section">
        <h3>隐藏文件夹</h3>
        <div class="hidden-folders-list" id="settingsHiddenList"></div>
      </div>
      <div class="settings-section">
        <h3>缓存与数据</h3>
        <div class="settings-actions">
          <button class="btn-secondary" id="btnCleanCache">清理缓存</button>
          <button class="btn-danger" id="btnResetDemo">重置演示数据</button>
        </div>
      </div>
