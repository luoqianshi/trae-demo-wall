    contentArea.innerHTML = html;
    renderSettingsAlbumList();
    renderSettingsHiddenList();
    contentArea.querySelectorAll('.theme-option').forEach(b => {
      b.addEventListener('click', () => applyTheme(b.dataset.theme));
    });
    document.getElementById('settingsAddAlbum').addEventListener('click', () => {
      const input = document.getElementById('settingsNewAlbum');
      const name = input.value.trim();
      if (!name) return showToast('请输入相册名称', 'error');
      const id = 'album_' + Date.now();
      albums.push({ id, name, paths: [] });
      input.value = '';
      renderSettingsAlbumList();
      renderAlbumMenu();
      showToast('相册已创建');
    });
    document.getElementById('btnCleanCache').addEventListener('click', () => {
      showLoading('清理缓存中...');
      setTimeout(() => { hideLoading(); showToast('缓存已清理'); }, 800);
    });
    document.getElementById('btnResetDemo').addEventListener('click', () => {
      modalConfirm('重置演示数据', '确定要恢复初始演示数据吗？', () => {
        location.reload();
      });
    });
    updateStatusBar(photos.length, photos.filter(p => p.file_type === 'video').length);
  }

  function renderSettingsAlbumList() {
    const el = document.getElementById('settingsAlbumList');
    if (!el) return;
    el.innerHTML = albums.map(a => `
      <div class="album-item">
        <div class="album-item-header">
          <span class="album-item-name">${a.name} ${a.id === currentAlbumId ? '<span style="color:var(--bg-brand);font-size:11px">（当前）</span>' : ''}</span>
          <button class="btn-secondary" data-del="${a.id}" style="padding:4px 10px;font-size:11px">删除</button>
        </div>
        <div class="album-item-meta">关联路径：${a.paths.length ? a.paths.join('、') : '全部'}</div>
      </div>
    `).join('');
    el.querySelectorAll('[data-del]').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.dataset.del;
        if (id === 'default') return showToast('默认相册不可删除', 'error');
        albums = albums.filter(a => a.id !== id);
        if (currentAlbumId === id) currentAlbumId = 'default';
        renderSettingsAlbumList();
        renderAlbumMenu();
        showToast('相册已删除');
      });
    });
  }

  function renderSettingsHiddenList() {
    const el = document.getElementById('settingsHiddenList');
    if (!el) return;
    if (!hiddenFolders.length) {
      el.innerHTML = '<div class="empty-hint">暂无隐藏文件夹</div>';
      return;
    }
    el.innerHTML = hiddenFolders.map(h => `
      <div class="hidden-folder-item">
        <span>${h}</span>
        <button data-unhide="${h}">恢复显示</button>
      </div>
    `).join('');
    el.querySelectorAll('[data-unhide]').forEach(b => {
      b.addEventListener('click', () => {
        hiddenFolders = hiddenFolders.filter(h => h !== b.dataset.unhide);
        renderSettingsHiddenList();
        renderTree();
        showToast('已恢复显示');
      });
    });
  }

  function renderHelp() {
    let html = `<div class="help-content">
      <div class="help-section">
        <h3>关于家庭相册管理系统</h3>
        <p>一款面向家庭用户的本地照片/视频管理工具，采用 IDE 式侧边栏布局，支持多相册空间、分类目录、时间线、标签、批量操作与全局搜索。</p>
      </div>
      <div class="help-section">
        <h3>常用快捷键</h3>
        <ul>
          <li><span class="kbd">⌘K</span> / <span class="kbd">Ctrl+K</span> 聚焦搜索</li>
          <li><span class="kbd">Esc</span> 关闭弹窗 / 退出批量选择</li>
          <li><span class="kbd">←</span> / <span class="kbd">→</span> Lightbox 上一张 / 下一张</li>
          <li><span class="kbd">Space</span> 收藏当前照片</li>
        </ul>
      </div>
      <div class="help-section">
        <h3>界面说明</h3>
        <ul>
          <li>左上角红黄蓝圆点为 macOS 风格装饰，无窗口控制功能</li>
          <li>左侧 Activity Bar 可在所有照片、收藏夹、文件夹、时间线、标签、设置间切换</li>
          <li>相册目录支持右键隐藏/关联相册/删除空文件夹</li>
        </ul>
      </div>
      <div class="help-section">
        <h3>版本信息</h3>
        <p>创意演示版 · 由 TRAE Work 生成 · 仅供展示</p>
      </div>
    </div>`;
    contentArea.innerHTML = html;
    updateStatusBar(photos.length, photos.filter(p => p.file_type === 'video').length);
  }

  function switchView(view) {
    state.view = view;
    state.subView = 'all';
    state.currentCategory = null;
    state.currentFolder = null;
    state.currentTag = null;
    state.searchKeyword = '';
    document.getElementById('searchInput').value = '';
    exitBatchMode();
    refreshContent();
    if (window.innerWidth <= 640) ide.classList.remove('sidebar-open');
  }

  function openLightbox(id) {
    const list = getFilteredPhotos();
    const idx = list.findIndex(p => p.id === id);
    if (idx === -1) return;
    lightboxIndex = idx;
    displayedPhotos = list;
    updateLightbox();
    lightbox.classList.add('open');
  }

  function updateLightbox() {
    const p = displayedPhotos[lightboxIndex];
    if (!p) return;
    lbImg.src = imageUrl(p.image_idx);
    lbFname.textContent = p.file_name;
    lbDate.textContent = p.shoot_time.slice(0, 10) + ' ' + p.shoot_time.slice(11, 16);
    lbFolder.textContent = p.folder_tag;
    lbSize.textContent = formatSize(p.size);
    lbNoteText.textContent = p.note || '无备注';
    lbCounter.textContent = (lightboxIndex + 1) + ' / ' + displayedPhotos.length;
    lbTags.innerHTML = `<span class="lb-tag">${p.folder_tag}</span>` + (p.file_type === 'video' ? '<span class="lb-tag">视频</span>' : '');
    lbFav.innerHTML = `<i class="icon ${p.star ? 'icon-star' : 'icon-star-empty'}"></i>`;
    lbFav.classList.toggle('active-fav', p.star);
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
  }

  function navLightbox(dir) {
    if (!displayedPhotos.length) return;
    lightboxIndex = (lightboxIndex + dir + displayedPhotos.length) % displayedPhotos.length;
    updateLightbox();
  }

  function togglePick(id) {
    if (state.picked.has(id)) state.picked.delete(id);
    else state.picked.add(id);
    updateBatchBar();
    refreshContent();
  }

  function updateBatchBar() {
    batchCount.textContent = state.picked.size;
    batchBar.classList.toggle('show', state.batchMode && state.picked.size > 0);
  }

  function enterBatchMode() {
    state.batchMode = true;
    state.picked.clear();
    document.getElementById('batchBtn').classList.add('active');
    refreshContent();
    showToast('已进入批量选择模式，点击照片进行选择');
  }

  function exitBatchMode() {
    state.batchMode = false;
    state.picked.clear();
    document.getElementById('batchBtn').classList.remove('active');
    updateBatchBar();
    refreshContent();
  }

  function batchFav() {
    const ids = Array.from(state.picked);
    if (!ids.length) return showToast('请先选择照片', 'error');
    photos.forEach(p => { if (ids.includes(p.id)) p.star = true; });
    showToast(`已收藏 ${ids.length} 项`);
    exitBatchMode();
    refreshContent();
  }

  function batchDelete() {
    const ids = Array.from(state.picked);
    if (!ids.length) return showToast('请先选择照片', 'error');
    modalConfirm('确认删除', `确定要删除选中的 ${ids.length} 项吗？此操作不可恢复。`, () => {
      photos = photos.filter(p => !ids.includes(p.id));
      showToast(`已删除 ${ids.length} 项`);
      exitBatchMode();
      refreshContent();
    });
  }

  function batchNote() {
    const ids = Array.from(state.picked);
    if (!ids.length) return showToast('请先选择照片', 'error');
    modalConfirm('批量备注', '<label>备注内容</label><input type="text" id="batchNoteInput" placeholder="输入备注..." />', () => {
      const val = document.getElementById('batchNoteInput').value;
      photos.forEach(p => { if (ids.includes(p.id)) p.note = val; });
      showToast(`已为 ${ids.length} 项添加备注`);
      exitBatchMode();
      refreshContent();
    });
  }

  function renderAlbumMenu() {
    const list = document.getElementById('albumList');
    const current = document.getElementById('albumCurrentName');
    const selectorName = document.getElementById('albumSelectorName');
    const album = albums.find(a => a.id === currentAlbumId);
    current.textContent = album ? album.name : '家庭相册';
    selectorName.textContent = album ? album.name : '家庭相册';
    list.innerHTML = albums.map(a => `
      <div class="album-option-row ${a.id === currentAlbumId ? 'active' : ''}" data-album="${a.id}" onclick="window.__selectAlbum('${a.id}')">
        <div class="album-option">
          <span class="album-name">${a.name}</span>
          <span class="album-meta">${a.paths.length ? a.paths.length + ' 个关联' : '全部'}</span>
        </div>
      </div>
    `).join('');
    window.__selectAlbum = (id) => {
      currentAlbumId = id;
      document.getElementById('albumMenu').classList.remove('show');
      renderAlbumMenu();
      refreshContent();
      showToast('已切换到：' + albums.find(a => a.id === currentAlbumId).name);
    };
  }

  function bindEvents() {
    document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
    document.getElementById('mobileMenuToggle').addEventListener('click', () => ide.classList.toggle('sidebar-open'));
    document.getElementById('sidebarOverlay').addEventListener('click', () => ide.classList.remove('sidebar-open'));
    document.getElementById('viewList').addEventListener('click', () => setGridView('list'));
    document.getElementById('viewGrid').addEventListener('click', () => setGridView('grid'));
    document.getElementById('viewDetail').addEventListener('click', () => setGridView('detail'));
    document.getElementById('batchBtn').addEventListener('click', () => {
      if (state.batchMode) exitBatchMode();
      else enterBatchMode();
    });
    document.getElementById('scanBtn').addEventListener('click', () => {
      showLoading('扫描文件夹中...');
      setTimeout(() => { hideLoading(); showToast('扫描完成，演示模式下未实际导入文件'); }, 1200);
    });
    document.getElementById('slideshowBtn').addEventListener('click', () => {
      if (!displayedPhotos.length) return showToast('当前没有可播放的照片', 'error');
      openLightbox(displayedPhotos[0].id);
    });
    document.getElementById('sortBtn').addEventListener('click', () => {
      photos.reverse();
      refreshContent();
      showToast('已切换排序');
    });

    document.querySelectorAll('.act-item').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        switchView(a.dataset.view);
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.searchKeyword = e.target.value.trim();
      refreshContent();
    });

    document.getElementById('albumSelectorBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('albumMenu').classList.toggle('show');
    });
    document.getElementById('albumCustomSave').addEventListener('click', () => {
      const input = document.getElementById('albumCustomInput');
      const name = input.value.trim();
      if (!name) return showToast('请输入相册名称', 'error');
      const id = 'album_' + Date.now();
      albums.push({ id, name, paths: [] });
      currentAlbumId = id;
      input.value = '';
      document.getElementById('albumMenu').classList.remove('show');
      renderAlbumMenu();
      refreshContent();
      showToast('已创建并切换到：' + name);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.album-menu') && !e.target.closest('.project-selector')) {
        document.getElementById('albumMenu').classList.remove('show');
      }
    });

    document.getElementById('userMenuBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('userMenu').classList.toggle('show');
    });
    document.getElementById('userMenu').addEventListener('click', (e) => {
      const link = e.target.closest('a[data-view]');
      if (link) {
        e.preventDefault();
        switchView(link.dataset.view);
        document.getElementById('userMenu').classList.remove('show');
      }
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.user-menu-wrap')) document.getElementById('userMenu').classList.remove('show');
    });

    folderTreeEl.addEventListener('click', (e) => {
      const chev = e.target.closest('.tree-chev');
      if (chev) {
        e.stopPropagation();
        toggleTreeNode(parseInt(chev.dataset.chev));
        return;
      }
      const row = e.target.closest('.tree-row');
      if (row) {
        state.currentCategory = row.dataset.path;
        state.view = 'photos';
        refreshContent();
      }
    });

    folderTreeEl.addEventListener('contextmenu', (e) => {
      const row = e.target.closest('.tree-row');
      if (!row) return;
      e.preventDefault();
      const menu = document.getElementById('treeContextMenu');
      menu.style.left = e.clientX + 'px';
      menu.style.top = e.clientY + 'px';
      menu.classList.add('show');
      menu.dataset.path = row.dataset.path;
    });

    document.getElementById('ctxHideFolder').addEventListener('click', () => {
      const menu = document.getElementById('treeContextMenu');
      const path = menu.dataset.path;
      if (path && !hiddenFolders.includes(path)) hiddenFolders.push(path);
      menu.classList.remove('show');
      renderTree();
      refreshContent();
      showToast('已隐藏文件夹');
    });

    document.getElementById('ctxDeleteFolder').addEventListener('click', () => {
      const menu = document.getElementById('treeContextMenu');
      menu.classList.remove('show');
      showToast('演示模式：删除操作已模拟，实际项目会清理物理空目录', 'error');
    });

    document.getElementById('ctxLinkAlbum').addEventListener('click', () => {
      const menu = document.getElementById('treeContextMenu');
      const path = menu.dataset.path;
      menu.classList.remove('show');
      const options = albums.map(a => `<div class="album-option" data-link="${a.id}">${a.name}</div>`).join('');
      const sub = document.getElementById('albumContextSubmenu');
      sub.innerHTML = options;
      sub.style.left = (parseInt(menu.style.left) + 140) + 'px';
      sub.style.top = menu.style.top;
      sub.classList.add('show');
      sub.querySelectorAll('.album-option').forEach(opt => {
        opt.addEventListener('click', () => {
          const album = albums.find(a => a.id === opt.dataset.link);
          if (album && !album.paths.includes(path)) album.paths.push(path);
          sub.classList.remove('show');
          renderAlbumMenu();
          showToast(`已关联到：${album.name}`);
        });
      });
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.context-menu')) {
        document.getElementById('treeContextMenu').classList.remove('show');
        document.getElementById('albumContextSubmenu').classList.remove('show');
      }
    });

    document.getElementById('newFolderBtn').addEventListener('click', () => {
      document.getElementById('newFolderBar').classList.add('show');
      document.getElementById('newFolderName').focus();
    });
    document.getElementById('newFolderCancel').addEventListener('click', () => {
      document.getElementById('newFolderBar').classList.remove('show');
    });
    document.getElementById('newFolderCreate').addEventListener('click', () => {
      const input = document.getElementById('newFolderName');
      const name = input.value.trim();
      if (!name) return showToast('请输入文件夹名称', 'error');
      const parent = state.currentCategory ? findNodeByPath(categoryTree, state.currentCategory) : null;
      const newId = Date.now();
      const newNode = { id: newId, name, path: (parent ? parent.path + '/' : '') + name, media_count: 0, children: [] };
      if (parent) {
        if (!parent.children) parent.children = [];
        parent.children.push(newNode);
        parent.open = true;
      } else {
        categoryTree.push(newNode);
      }
      input.value = '';
      document.getElementById('newFolderBar').classList.remove('show');
      renderTree();
      showToast('文件夹已创建：' + name);
    });
    document.getElementById('collapseAll').addEventListener('click', () => {
      function collapse(nodes) { nodes.forEach(n => { n.open = false; if (n.children) collapse(n.children); }); }
      collapse(categoryTree);
      renderTree();
    });
    document.getElementById('refreshTree').addEventListener('click', () => {
      showLoading('刷新目录中...');
      setTimeout(() => { hideLoading(); renderTree(); showToast('目录已刷新'); }, 600);
    });

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', () => navLightbox(-1));
    document.getElementById('lbNext').addEventListener('click', () => navLightbox(1));
    document.getElementById('lbFav').addEventListener('click', () => {
      const p = displayedPhotos[lightboxIndex];
      if (p) {
        p.star = !p.star;
        updateLightbox();
        refreshContent();
        showToast(p.star ? '已收藏' : '已取消收藏');
      }
    });
    document.getElementById('lbNote').addEventListener('click', () => {
      const p = displayedPhotos[lightboxIndex];
      if (!p) return;
      modalConfirm('编辑备注', '<label>备注</label><input type="text" id="lbNoteInput" value="' + (p.note || '') + '" />', () => {
        p.note = document.getElementById('lbNoteInput').value;
        updateLightbox();
        refreshContent();
      });
    });
    document.getElementById('lbToolNote').addEventListener('click', () => document.getElementById('lbNote').click());
    document.getElementById('lbToolFolder').addEventListener('click', () => showToast('演示模式：打开文件夹'));
    document.getElementById('lbToolMove').addEventListener('click', () => showToast('演示模式：移动操作'));
    document.getElementById('lbToolDownload').addEventListener('click', () => showToast('演示模式：下载操作'));
    document.getElementById('lbToolDelete').addEventListener('click', () => {
      const p = displayedPhotos[lightboxIndex];
      if (!p) return;
      modalConfirm('确认删除', '确定删除该文件吗？', () => {
        photos = photos.filter(x => x.id !== p.id);
        closeLightbox();
        refreshContent();
        showToast('已删除');
      });
    });
    document.getElementById('lbOpenFolder').addEventListener('click', () => showToast('演示模式：打开文件夹'));
    document.getElementById('lbDownload').addEventListener('click', () => showToast('演示模式：下载原图'));

    document.getElementById('lbStage').addEventListener('click', (e) => {
      if (e.target === document.getElementById('lbStage')) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (lightbox.classList.contains('open')) closeLightbox();
        else if (state.batchMode) exitBatchMode();
        else if (document.getElementById('albumMenu').classList.contains('show')) document.getElementById('albumMenu').classList.remove('show');
      }
      if (lightbox.classList.contains('open')) {
        if (e.key === 'ArrowLeft') navLightbox(-1);
        if (e.key === 'ArrowRight') navLightbox(1);
        if (e.key === ' ') {
          e.preventDefault();
          document.getElementById('lbFav').click();
        }
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    document.getElementById('batchFav').addEventListener('click', batchFav);
    document.getElementById('batchDelete').addEventListener('click', batchDelete);
    document.getElementById('batchNote').addEventListener('click', batchNote);
    document.getElementById('batchMove').addEventListener('click', () => showToast('演示模式：批量移动'));
    document.getElementById('batchDone').addEventListener('click', exitBatchMode);
    document.getElementById('batchCancel').addEventListener('click', exitBatchMode);
  }

  applyTheme(state.theme);
  bindEvents();
  renderAlbumMenu();
  refreshContent();
})();
</script>
