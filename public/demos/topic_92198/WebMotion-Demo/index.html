<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WebMotion — 用代码做视频。基于浏览器的 MG 动画制作工具，支持 AI 智能生成、代码编辑与可视化操作，导出透明通道视频素材。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230d0d12'/><path d='M12 8L24 16L12 24Z' fill='%2300d4ff'/></svg>">
  <title>WebMotion — 用代码做视频</title>
  <link rel="stylesheet" href="css/style.css?v=8">
  <style>
    /* === Enhancement: Animated gradient line below topbar === */
    .topbar-gradient-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a96e, #fb7185, #c9a96e, transparent);
      background-size: 300% 100%;
      animation: topbar-gradient-slide 4s linear infinite;
    }
    @keyframes topbar-gradient-slide {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* === Enhancement: Side panel gradient overlay === */
    .side-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(180deg, rgba(13,13,18,0.6), transparent);
      pointer-events: none;
      z-index: 1;
    }

    /* === Enhancement: Preview canvas animated glow border === */
    .canvas-wrapper {
      position: relative;
    }
    .canvas-wrapper::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 4px;
      border: 1px solid rgba(201, 169, 110,0.15);
      box-shadow: 0 0 12px rgba(201, 169, 110,0.08), inset 0 0 12px rgba(201, 169, 110,0.04);
      pointer-events: none;
      animation: preview-glow-pulse 3s ease-in-out infinite;
    }
    @keyframes preview-glow-pulse {
      0%, 100% { border-color: rgba(201, 169, 110,0.12); box-shadow: 0 0 8px rgba(201, 169, 110,0.06), inset 0 0 8px rgba(201, 169, 110,0.03); }
      50%      { border-color: rgba(201, 169, 110,0.3);  box-shadow: 0 0 20px rgba(201, 169, 110,0.12), inset 0 0 20px rgba(201, 169, 110,0.06); }
    }

    /* === Enhancement: WebMotion watermark badge === */
    .preview-watermark {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.08);
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    /* === Enhancement: Modal entrance animation === */
    .modal-overlay .modal {
      animation: modal-enter 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modal-enter {
      0%   { opacity: 0; transform: translateY(12px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* === Enhancement: Section title icons === */
    .section-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-right: 6px;
      font-size: 13px;
      opacity: 0.7;
      flex-shrink: 0;
    }

    /* === Enhancement: Scene drag handle === */
    .scene-block-drag-hint {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 4px;
      opacity: 0.35;
      vertical-align: middle;
      cursor: grab;
      flex-shrink: 0;
    }
    .scene-block-drag-hint:active { cursor: grabbing; }

    /* === Enhancement: Frame counter === */
    .frame-counter-enhanced {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }

    /* === Enhancement: Tooltip base (for data-tooltip) === */
    [data-tooltip] {
      position: relative;
    }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      background: rgba(0,0,0,0.85);
      color: #ccc;
      font-size: 11px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
      animation: tooltip-fade-in 0.15s ease forwards;
    }
    @keyframes tooltip-fade-in {
      0%   { opacity: 0; transform: translateX(-50%) translateY(2px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 顶部工具栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="7" fill="url(#logo-grad)"/>
          <path d="M8 18L12 10L16 14L20 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20" cy="8" r="2.5" fill="white"/>
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#c9a96e"/><stop offset="1" stop-color="#fb7185"/>
            </linearGradient>
          </defs>
        </svg>
        <span>WebMotion</span>
      </div>
    </div>

    <div class="topbar-right">
      <button class="btn btn-ghost" id="btn-history" data-tooltip="查看和恢复历史项目">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="margin-right:4px;opacity:0.7"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M8 5V8L10 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        历史
      </button>

      <button class="btn btn-ghost" id="btn-brand-kit" data-tooltip="品牌色板、字体、一键换色">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="margin-right:4px;opacity:0.7"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5C5 4 5 7 8 8C5 9 5 12 8 14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M8 1.5C11 4 11 7 8 8C11 9 11 12 8 14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        品牌套件
      </button>
      <button class="btn btn-ghost" id="btn-settings" data-tooltip="配置 AI API 和应用设置">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="margin-right:4px;opacity:0.7"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5V3M8 13V14.5M1.5 8H3M13 8H14.5M3 3L4 4M12 12L13 13M13 3L12 4M4 12L3 13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        设置
      </button>
      <div class="resolution-selector">
        <select id="select-resolution">
          <option value="1920x1080" selected>1920 × 1080</option>
          <option value="1080x1920">1080 × 1920</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btn-export" data-tooltip="导出为透明通道视频素材">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="margin-right:4px"><path d="M8 2V10M8 10L5 7M8 10L11 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11V13H14V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        导出透明通道
      </button>
    </div>
    <!-- Enhancement: Animated gradient line below topbar -->
    <div class="topbar-gradient-line"></div>
  </header>

  <!-- 主体区域 -->
  <main class="main-layout">

    <!-- 左侧统一面板（AI + 代码） -->
    <aside class="side-panel" id="side-panel">
      <div class="panel-content">

        <!-- AI 生成 -->
        <div class="panel-section" id="section-ai">
          <h3><span class="section-icon">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1L9.5 6L14.5 7.5L9.5 9L8 14L6.5 9L1.5 7.5L6.5 6L8 1Z" fill="currentColor"/></svg>
          </span>AI 动画生成</h3>
          <div class="section-body">
            <p class="panel-hint">输入文案，AI 自动提取重点并生成 MG 动画</p>
            <textarea class="ai-text-input" id="ai-text-input" placeholder="粘贴你的文案脚本...&#10;&#10;支持直接粘贴完整的视频脚本或文章内容。&#10;AI 将自动分析语义、拆分场景、设计动效。&#10;&#10;例如：&#10;今天讲解量子计算的基本原理。&#10;量子比特不同于经典比特，它可以同时处于 0 和 1 的叠加态。&#10;这种特性使得量子计算机在处理某些问题时远超经典计算机。"></textarea>
            <div class="ai-options">
              <label class="setting-item">
                <span>场景数</span>
                <select id="ai-scene-count">
                  <option value="" selected>自动</option>
                  <option value="3">3 个</option>
                  <option value="4">4 个</option>
                  <option value="5">5 个</option>
                  <option value="6">6 个</option>
                  <option value="8">8 个</option>
                </select>
              </label>
              <label class="setting-item">
                <span>风格</span>
                <select id="ai-style">
                  <option value="现代简约">现代简约</option>
                  <option value="科技感">科技感</option>
                  <option value="活泼">活泼</option>
                  <option value="商务">商务</option>
                  <option value="教育">教育</option>
                </select>
              </label>
            </div>
            <button class="btn btn-primary btn-full" id="btn-ai-generate">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 1L9.5 6L14.5 7.5L9.5 9L8 14L6.5 9L1.5 7.5L6.5 6L8 1Z" fill="currentColor"/>
              </svg>
              生成 MG 动画
            </button>
            <div class="ai-status" id="ai-status" style="margin-top: 10px;">
              <span class="status-dot"></span>
              <span class="status-text">未配置 API</span>
            </div>
            <p class="panel-hint" id="ai-config-hint" style="margin-top: 4px;">点击右上角「设置」配置 AI API</p>
          </div>
        </div>

        <!-- 代码编辑 -->
        <div class="panel-section" id="section-code">
          <h3><span class="section-icon">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M5 3L1 8L5 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 3L15 8L11 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>代码编辑</h3>
          <div class="section-body">
            <div class="tab-group" style="margin-bottom: 8px;">
              <button class="tab active" data-tab="js">JS</button>
              <button class="tab" data-tab="html">HTML</button>
              <button class="tab" data-tab="css">CSS</button>
            </div>
            <div class="editor-container">
              <div class="editor-wrap active" id="editor-js">
                <textarea class="code-textarea" id="code-js" spellcheck="false"></textarea>
              </div>
              <div class="editor-wrap" id="editor-html">
                <textarea class="code-textarea" id="code-html" spellcheck="false"></textarea>
              </div>
              <div class="editor-wrap" id="editor-css">
                <textarea class="code-textarea" id="code-css" spellcheck="false"></textarea>
              </div>
            </div>
            <button class="btn btn-ghost btn-full" id="btn-ai-assist">AI 辅助生成单场景</button>
            <!-- 对话式迭代编辑 -->
            <div class="iterate-box" style="margin-top: 8px; display: flex; gap: 4px; align-items: center;">
              <input type="text" id="iterate-input" class="code-textarea" style="flex:1; height: 32px; padding: 4px 8px; font-size: 12px; resize: none;" placeholder="迭代指令：如&quot;文字改大，加辉光&quot;">
              <button class="btn btn-primary" id="btn-iterate" style="white-space: nowrap; padding: 4px 10px; font-size: 12px;">迭代修改</button>
            </div>
            <label class="checkbox-label" style="margin-top: 8px;">
              <input type="checkbox" id="chk-3d-mode"> 启用 3D 模式 (Three.js)
            </label>
          </div>
        </div>
      </div>
    </aside>

    <!-- 右侧：预览区 -->
    <section class="preview-panel">
      <div class="panel-header">
        <span class="panel-title">预览</span>
        <div class="preview-info">
          <span class="info-badge" id="info-scene">场景 1</span>
          <span class="info-badge" id="info-fps">30 fps</span>
          <span class="info-badge frame-counter-enhanced" id="info-frame">帧 0 / 90</span>
          <div class="bg-switcher">
            <button class="bg-btn active" data-bg="checker" title="棋盘格">▦</button>
            <button class="bg-btn" data-bg="black" title="黑色">■</button>
            <button class="bg-btn" data-bg="white" title="白色">□</button>
            <span class="bg-sep"></span>
            <button class="bg-btn" id="btn-noise" title="胶片噪点" onclick="App.toggleNoise()">⋮</button>
            <button class="bg-btn active" id="btn-glow" title="辉光效果" onclick="App.toggleGlow()">✦</button>
            <button class="bg-btn" id="btn-hue-rotate" title="动态配色" onclick="App.toggleHueRotate()">◐</button>
          </div>
        </div>
      </div>
      <div class="preview-stage" id="preview-stage">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="preview-canvas"></canvas>
          <canvas id="overlay-canvas" class="overlay-canvas"></canvas>
          <div class="checkerboard"></div>
        </div>
        <!-- Enhancement: WebMotion watermark badge -->
        <span class="preview-watermark">WebMotion</span>
      </div>

      <!-- 场景时间轴 -->
      <div class="scene-timeline" id="scene-timeline">
        <div class="scene-track" id="scene-track">
          <!-- Enhancement: drag handle indicators will be injected by JS; template hint below -->
        </div>
        <button class="btn btn-small btn-add-scene" id="btn-add-scene" data-tooltip="添加一个新的动画场景">+ 场景</button>
      </div>

      <!-- 播放控制 -->
      <div class="timeline-panel">
        <div class="timeline-controls">
          <button class="btn btn-icon" id="btn-prev-frame" title="上一帧">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11 3L5 8L11 13V3Z"/><rect x="3" y="3" width="1.5" height="10"/></svg>
          </button>
          <button class="btn btn-icon btn-play" id="btn-play" title="播放/暂停">
            <svg class="icon-play" width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3L17 10L5 17V3Z"/></svg>
            <svg class="icon-pause" width="20" height="20" viewBox="0 0 20 20" fill="currentColor" style="display:none"><rect x="4" y="3" width="4" height="14"/><rect x="12" y="3" width="4" height="14"/></svg>
          </button>
          <button class="btn btn-icon" id="btn-next-frame" title="下一帧">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3L11 8L5 13V3Z"/><rect x="11.5" y="3" width="1.5" height="10"/></svg>
          </button>
          <button class="btn btn-icon" id="btn-stop" title="回到起点">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8"/></svg>
          </button>
          <div class="timeline-time">
            <span id="time-current" class="frame-counter-enhanced">0:00.00</span> / <span id="time-total" class="frame-counter-enhanced">0:03.00</span>
          </div>
        </div>
        <div class="timeline-track" id="timeline-track">
          <div class="timeline-progress" id="timeline-progress"></div>
          <div class="timeline-handle" id="timeline-handle"></div>
        </div>
        <div class="timeline-settings">
          <label class="setting-item">
            <span>帧率</span>
            <select id="select-fps">
              <option value="24">24</option>
              <option value="30" selected>30</option>
              <option value="60">60</option>
            </select>
          </label>
          <label class="setting-item checkbox">
            <input type="checkbox" id="chk-loop" checked><span>循环</span>
          </label>
          <div class="spacer"></div>
          <button class="btn btn-small btn-ghost" id="btn-undo" title="撤销 (Ctrl+Z)">↶</button>
          <button class="btn btn-small btn-ghost" id="btn-redo" title="重做 (Ctrl+Y)">↷</button>
          <button class="btn btn-small btn-ghost" id="btn-save-project" data-tooltip="保存当前项目到本地">保存项目</button>
          <button class="btn btn-small btn-ghost" id="btn-load-project" data-tooltip="从本地加载已保存的项目">加载项目</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 导出弹窗 -->
  <div class="modal-overlay" id="export-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>导出透明通道视频素材</h2>
        <button class="btn btn-icon" id="btn-close-export">✕</button>
      </div>
      <div class="modal-body">
        <div class="export-format-group">
          <label class="format-option">
            <input type="radio" name="format" value="png" checked>
            <div class="format-card">
              <div class="format-name">PNG 序列帧（ZIP）</div>
              <div class="format-desc">每帧带 Alpha 通道的 PNG，兼容所有视频软件</div>
            </div>
          </label>
          <label class="format-option">
            <input type="radio" name="format" value="webm">
            <div class="format-card">
              <div class="format-name">WebM (VP9 Alpha)</div>
              <div class="format-desc">单个视频文件，带透明通道</div>
            </div>
          </label>
          <label class="format-option">
            <input type="radio" name="format" value="gif">
            <div class="format-card">
              <div class="format-name">GIF 动图</div>
              <div class="format-desc">兼容性最好的动图格式</div>
            </div>
          </label>
        </div>
        <div class="export-options">
          <label class="setting-item">
            <input type="checkbox" id="chk-all-scenes" checked>
            <span>导出所有场景</span>
          </label>
          <label class="setting-item" id="gif-bg-option" style="display:none">
            <span>GIF 背景色</span>
            <input type="color" id="gif-bg-color" value="#000000">
            <span style="font-size:11px;color:var(--muted)">GIF 不支持透明，需指定背景</span>
          </label>
          <label class="setting-item">
            <input type="checkbox" id="chk-film-grain">
            <span>胶片质感（叠加微噪点）</span>
          </label>
        </div>
        <div class="export-progress" id="export-progress" style="display:none">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="progress-text" id="progress-text">准备中...</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-cancel-export">取消</button>
        <button class="btn btn-primary" id="btn-start-export">开始导出</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>AI API 设置</h2>
        <button class="btn btn-icon" id="btn-close-settings">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-form">
          <div class="form-group">
            <label>API Base URL</label>
            <input type="text" id="setting-baseurl" placeholder="https://api.openai.com/v1">
            <p class="form-hint">支持 OpenAI 兼容接口</p>
          </div>
          <div class="form-group">
            <label>API Key</label>
            <input type="password" id="setting-apikey" placeholder="sk-...">
          </div>
          <div class="form-group">
            <label>模型</label>
            <input type="text" id="setting-model" placeholder="gpt-4o">
          </div>
          <div class="form-group">
            <label>温度 (0-1)</label>
            <input type="number" id="setting-temp" min="0" max="1" step="0.1" value="0.7">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-cancel-settings">取消</button>
        <button class="btn btn-primary" id="btn-save-settings">保存</button>
      </div>
    </div>
  </div>

  <!-- 历史记录弹窗 -->
  <div class="modal-overlay" id="history-modal">
    <div class="modal modal-large">
      <div class="modal-header">
        <h2>项目历史</h2>
        <button class="btn btn-icon" id="btn-close-history">✕</button>
      </div>
      <div class="modal-body">
        <div class="history-toolbar">
          <button class="btn btn-small btn-ghost" id="btn-import-project">导入文件</button>
          <button class="btn btn-small btn-ghost" id="btn-clear-history">清空历史</button>
          <input type="file" id="file-import-project" accept=".json,.webmotion.json" style="display:none">
        </div>
        <div class="history-list" id="history-list"></div>
      </div>
    </div>
  </div>

  <!-- 品牌套件弹窗 -->
  <div class="modal-overlay" id="brand-kit-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>品牌套件</h2>
        <button class="btn btn-icon" id="btn-close-brand-kit">✕</button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom: 12px;">
          <label style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px;">品牌色板</label>
          <div id="brand-colors-list" style="display: flex; gap: 6px; flex-wrap: wrap; min-height: 32px; padding: 6px; background: var(--bg-darker); border-radius: 6px; border: 1px solid var(--border);"></div>
          <div style="display: flex; gap: 6px; margin-top: 6px; align-items: center;">
            <input type="color" id="brand-color-picker" value="#c9a96e" style="width: 32px; height: 28px; border: none; background: none; cursor: pointer;">
            <button class="btn btn-ghost btn-small" id="btn-add-brand-color">添加颜色</button>
            <input type="text" id="brand-color-hex" placeholder="#c9a96e" style="flex: 1; background: var(--bg-darker); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; color: var(--text); font-size: 12px;">
          </div>
        </div>
        <div style="margin-bottom: 12px;">
          <label style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px;">主品牌色</label>
          <div style="display: flex; gap: 6px; align-items: center;">
            <input type="color" id="brand-primary-picker" value="#c9a96e" style="width: 32px; height: 28px; border: none; background: none; cursor: pointer;">

          </div>
        </div>
        <div style="margin-bottom: 12px;">

        </div>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button class="btn btn-primary" id="btn-apply-brand-all">一键换色（全部场景）</button>

        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button class="btn btn-ghost btn-small" id="btn-export-brand-kit">导出品牌套件</button>
          <button class="btn btn-ghost btn-small" id="btn-import-brand-kit">导入品牌套件</button>
          <input type="file" id="file-import-brand-kit" accept=".json" style="display:none">
        </div>
      </div>
