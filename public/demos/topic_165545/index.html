<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅游攻略解析助手</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://webapi.amap.com/maps?v=2.0&key=您的高德地图API Key&plugin=AMap.PlaceSearch"></script>
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>🏖️ 旅游攻略解析助手</h1>
            <nav class="nav">
                <button class="nav-btn" :class="{ active: currentPage === 'import' }" onclick="showPage('import')">攻略导入</button>
                <button class="nav-btn" :class="{ active: currentPage === 'confirm' }" onclick="showPage('confirm')">地点确认</button>
                <button class="nav-btn" :class="{ active: currentPage === 'result' }" onclick="showPage('result')">路线结果</button>
            </nav>
        </header>

        <main class="main">
            <div id="page-import" class="page">
                <div class="section">
                    <h2>📝 攻略文字导入</h2>
                    <textarea id="guide-text" class="text-input" placeholder="在此粘贴攻略文字内容...&#10;&#10;例如：&#10;&#10;杭州三日游攻略：&#10;第一天去西湖，建议早上7点到，可以避开人流，门票免费，游玩时间约3小时。&#10;中午去知味观吃杭帮菜，人均80元，记得早点去排队。&#10;下午去灵隐寺，门票45元，游玩时间约2小时，建议请个讲解员。&#10;&#10;第二天去西溪湿地，门票80元，游玩时间约4小时，夏天记得带防蚊用品。&#10;&#10;第三天去龙井村，品茶观景，人均消费150元，游玩时间约3小时。"></textarea>
                </div>

                <div class="section">
                    <h2>📷 截图上传（OCR）</h2>
                    <label class="upload-btn">
                        <input type="file" id="image-upload" accept="image/*" multiple onchange="handleImageUpload(event)">
                        <span>📁 选择截图文件</span>
                    </label>
                    <p id="upload-status" class="status-text"></p>
                </div>

                <div class="section">
                    <h2>📋 已导入攻略列表</h2>
                    <div id="guide-list" class="guide-list">
                        <div class="empty-state">暂无导入的攻略</div>
                    </div>
                </div>

                <div class="action-area">
                    <button class="primary-btn" onclick="startParse()">🚀 开始解析</button>
                </div>
            </div>

            <div id="page-confirm" class="page hidden">
                <div class="section">
                    <h2>📍 已解析地点</h2>
                    <div id="location-list" class="location-list">
                        <div class="empty-state">请先在攻略导入页面导入攻略并解析</div>
                    </div>
                </div>

                <div class="action-area">
                    <button class="primary-btn" onclick="generateRoute()">🗺️ 生成路线</button>
                    <button class="secondary-btn" onclick="showPage('import')">← 返回导入</button>
                </div>
            </div>

            <div id="page-result" class="page hidden">
                <div class="section">
                    <h2>📊 出行条件摘要</h2>
                    <div id="trip-summary" class="summary-card">
                        <div class="summary-item">
                            <span class="summary-label">出行天数</span>
                            <span class="summary-value">3天</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">出行人数</span>
                            <span class="summary-value">2人</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">预算范围</span>
                            <span class="summary-value">适中</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">出行类型</span>
                            <span class="summary-value">自由行</span>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>🗺️ 路线列表</h2>
                    <div id="route-list" class="route-list">
                        <div class="empty-state">请先生成路线</div>
                    </div>
                </div>

                <div class="section">
                    <h2>💰 路线总览</h2>
                    <div id="route-overview" class="overview-card">
                        <div class="overview-item">
                            <div class="overview-icon">💰</div>
                            <div class="overview-content">
                                <span class="overview-label">总预算</span>
                                <span class="overview-value">¥800-1200</span>
                            </div>
                        </div>
                        <div class="overview-item">
                            <div class="overview-icon">⏱️</div>
                            <div class="overview-content">
                                <span class="overview-label">总时长</span>
                                <span class="overview-value">9-12小时</span>
                            </div>
                        </div>
                        <div class="overview-item">
                            <div class="overview-icon">🚶</div>
                            <div class="overview-content">
                                <span class="overview-label">步行估算</span>
                                <span class="overview-value">3-5公里</span>
                            </div>
                        </div>
                        <div class="overview-item">
                            <div class="overview-icon">🚇</div>
                            <div class="overview-content">
                                <span class="overview-label">交通估算</span>
                                <span class="overview-value">¥50-80</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-area">
                    <button class="primary-btn" onclick="regenerateRoute()">🔄 重新生成</button>
                    <button class="secondary-btn" onclick="shortenRoute()">⏰ 缩短路线</button>
                    <button class="secondary-btn" onclick="saveMoneyMode()">💰 省钱模式</button>
                    <button class="secondary-btn" onclick="showPage('confirm')">← 返回确认</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>© 2024 旅游攻略解析助手</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
