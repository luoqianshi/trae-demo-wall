<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 儿童安全定位徽章</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">🎓</div>
        <h1 class="login-title">注册账号</h1>
        <p class="login-subtitle">守护孩子安全，从注册开始</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="nickname">昵称</label>
          <div class="input-wrapper">
            <span class="input-icon">😊</span>
            <input
              type="text"
              id="nickname"
              class="form-input"
              placeholder="请输入昵称"
              autocomplete="nickname"
            >
          </div>
          <p class="error-msg" id="nicknameError"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">手机号</label>
          <div class="input-wrapper">
            <span class="input-icon">📱</span>
            <input
              type="tel"
              id="username"
              class="form-input"
              placeholder="请输入手机号"
              autocomplete="tel"
              maxlength="11"
            >
          </div>
          <p class="error-msg" id="usernameError"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">设置密码</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="请输入密码（至少6位）"
              autocomplete="new-password"
            >
          </div>
          <p class="error-msg" id="passwordError"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">确认密码</label>
          <div class="input-wrapper">
            <span class="input-icon">🔐</span>
            <input
              type="password"
              id="confirmPassword"
              class="form-input"
              placeholder="请再次输入密码"
              autocomplete="new-password"
            >
          </div>
          <p class="error-msg" id="confirmPasswordError"></p>
        </div>

        <div class="form-options" style="justify-content: flex-start; margin-bottom: 1.5rem;">
          <label class="remember">
            <input type="checkbox" id="agree">
            <span>我已阅读并同意 <a href="#" style="color: var(--accent);">用户协议</a> 和 <a href="#" style="color: var(--accent);">隐私政策</a></span>
          </label>
        </div>
        <p class="error-msg" id="agreeError"></p>

        <button type="submit" class="login-btn" id="registerBtn">
          <span class="btn-text">注 册</span>
        </button>
      </form>

      <div class="divider"><span>其他注册方式</span></div>

      <div class="alt-login">
        <button class="alt-btn" title="微信登录">💬</button>
        <button class="alt-btn" title="QQ登录">🐧</button>
        <button class="alt-btn" title="手机号快捷注册">📱</button>
      </div>

      <p class="register-tip">
        已有账号？<a href="index.html">立即登录</a>
      </p>

      <div class="tip-box">
        💡 <strong>演示提示：</strong>注册信息保存在本地浏览器，仅用于演示体验。
      </div>
    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
