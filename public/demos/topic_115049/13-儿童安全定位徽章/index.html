<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 儿童安全定位徽章</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">🎓</div>
        <h1 class="login-title">儿童安全定位徽章</h1>
        <p class="login-subtitle">守护孩子安全，家长安心无忧</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">账号</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="请输入手机号或用户名"
              autocomplete="username"
            >
          </div>
          <p class="error-msg" id="usernameError"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="请输入密码"
              autocomplete="current-password"
            >
          </div>
          <p class="error-msg" id="passwordError"></p>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="remember" checked>
            <span>记住我</span>
          </label>
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">登 录</span>
        </button>
      </form>

      <div class="divider"><span>其他登录方式</span></div>

      <div class="alt-login">
        <button class="alt-btn" title="微信登录">💬</button>
        <button class="alt-btn" title="QQ登录">🐧</button>
        <button class="alt-btn" title="手机号登录">📱</button>
      </div>

      <p class="register-tip">
        还没有账号？<a href="register.html">立即注册</a>
      </p>

      <div class="tip-box">
        💡 <strong>演示提示：</strong>任意用户名和密码（6位以上）均可登录体验。
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
