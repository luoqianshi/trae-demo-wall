<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1890ff">
    <title>旅简 TravelEasy</title>

    <!-- 样式文件：按顺序加载，后面的可以覆盖前面的 -->
    <link rel="stylesheet" href="css/base.css?v=3.1">
    <link rel="stylesheet" href="css/layout.css?v=4.1">
    <link rel="stylesheet" href="css/components.css?v=4.1">
    <link rel="stylesheet" href="css/tabs.css?v=4.1">

    <!-- PWA 配置：让 App 可以"安装"到手机桌面 -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- ============================================ -->
    <!-- 手机外壳：模拟手机屏幕，420px 宽度           -->
    <!-- ============================================ -->
    <div id="app">

        <!-- ============================================ -->
        <!-- 顶部状态栏：显示 App 名称 + 设置图标         -->
        <!-- ============================================ -->
        <header class="app-header">
            <h1 class="app-title">旅简 TravelEasy</h1>
            <div class="header-actions">
                <!-- 历史记录图标 -->
                <button class="icon-btn" id="btn-history" title="历史记录">📜</button>
                <!-- 设置图标 -->
                <button class="icon-btn" id="btn-settings" title="设置">⚙️</button>
            </div>
        </header>

        <!-- ============================================ -->
        <!-- 主内容区：5个 Tab 页面都放在这里              -->
        <!-- 只有激活的 Tab 会显示，其他隐藏              -->
        <!-- ============================================ -->
        <main class="app-content">

            <!-- ========== Tab 1: 首页 ========== -->
            <section class="tab-page active" id="tab-home" data-tab="home">
                <!-- 首页内容由 home.js 动态生成 -->
                <div class="tab-inner" id="home-content">
                    <div class="loading-placeholder">首页加载中...</div>
                </div>
            </section>

            <!-- ========== Tab 2: 美食发现 ========== -->
            <section class="tab-page" id="tab-food" data-tab="food">
                <div class="tab-inner" id="food-content">
                    <div class="loading-placeholder">美食发现加载中...</div>
                </div>
            </section>

            <!-- ========== Tab 3: 出行方案 ========== -->
            <section class="tab-page" id="tab-travel" data-tab="travel">
                <div class="tab-inner" id="travel-content">
                    <div class="loading-placeholder">出行方案加载中...</div>
                </div>
            </section>

            <!-- ========== Tab 4: 我的行程 ========== -->
            <section class="tab-page" id="tab-trip" data-tab="trip">
                <div class="tab-inner" id="trip-content">
                    <div class="loading-placeholder">我的行程加载中...</div>
                </div>
            </section>

            <!-- ========== Tab 5: 智小程 ========== -->
            <section class="tab-page" id="tab-ai" data-tab="ai">
                <div class="tab-inner" id="ai-content">
                    <div class="loading-placeholder">智小程加载中...</div>
                </div>
            </section>

        </main>

        <!-- ============================================ -->
        <!-- 底部导航栏：5个 Tab 切换按钮                  -->
        <!-- ============================================ -->
        <nav class="tab-bar">
            <button class="tab-btn active" data-tab="home">
                <span class="tab-icon">🏠</span>
                <span class="tab-label">首页</span>
            </button>
            <button class="tab-btn" data-tab="food">
                <span class="tab-icon">🍽️</span>
                <span class="tab-label">美食</span>
            </button>
            <button class="tab-btn" data-tab="travel">
                <span class="tab-icon">🚄</span>
                <span class="tab-label">出行</span>
            </button>
            <button class="tab-btn" data-tab="trip">
                <span class="tab-icon">📋</span>
                <span class="tab-label">行程</span>
            </button>
            <button class="tab-btn" data-tab="ai">
                <span class="tab-icon">🤖</span>
                <span class="tab-label">智小程</span>
            </button>
        </nav>

        <!-- ============================================ -->
        <!-- 弹窗容器：景点详情、预订流程等弹窗在这里显示   -->
        <!-- ============================================ -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal-container" id="modal-container">
                <!-- 弹窗内容由 JS 动态生成 -->
            </div>
        </div>

        <!-- ============================================ -->
        <!-- Toast 提示：轻量级消息提示                    -->
        <!-- ============================================ -->
        <div class="toast" id="toast"></div>

        <!-- ============================================ -->
        <!-- 新手引导层：首次打开时显示                    -->
        <!-- ============================================ -->
        <div class="guide-overlay" id="guide-overlay">
            <!-- 引导内容由 guide.js 动态生成 -->
        </div>

    </div>

    <!-- ============================================ -->
    <!-- JS 文件：按依赖顺序加载                       -->
    <!-- 先加载工具和数据，再加载各模块，最后启动App   -->
    <!-- v=1.0 是版本号，改代码后改一下版本号可以强制浏览器刷新缓存  -->
    <!-- ============================================ -->
    <script src="js/utils.js?v=2.0"></script>
    <script src="js/storage.js?v=1.4"></script>
    <script src="js/data.js?v=1.2"></script>
    <script src="js/journey.js?v=1.4"></script>
    <script src="js/app.js?v=2.3"></script>
    <script src="js/home.js?v=2.3"></script>
    <script src="js/food.js?v=2.0"></script>
    <script src="js/travel.js?v=3.0"></script>
    <script src="js/trip.js?v=3.7"></script>
    <script src="js/ai.js?v=1.5"></script>
    <script src="js/guide.js?v=1.1"></script>
    <script src="js/badges.js?v=1.1"></script>
    <script src="js/settings.js?v=1.6"></script>

</body>
</html>
