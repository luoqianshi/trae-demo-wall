<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指尖福结 - 非遗绳结交互学习</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pet.css">
</head>
<body>

<!-- 顶部导航 -->
<div class="top-bar">
  <div class="logo"><span class="icon">🏮</span> 指尖福结</div>
  <div class="top-nav" id="topNav">
    <button class="active" data-page="home">🏠 首页</button>
    <button data-page="achievements">🏆 成就</button>
  </div>
</div>

<div class="main-wrap">

  <!-- ========== 首页 ========== -->
  <div class="page show" id="page-home">
    <div class="section-title">📖 内置绳结</div>
    <div class="knot-grid" id="builtinKnots"></div>
  </div>

  <!-- ========== 成就页 ========== -->
  <div class="page" id="page-achievements">
    <div class="stats-bar" id="statsBar"></div>
    <div class="section-title">🏆 成就徽章</div>
    <div class="ach-grid" id="achGrid"></div>
  </div>

  <!-- ========== 流程式制作（全屏舞台 + 叠加 UI） ========== -->
  <div class="page" id="page-process">
    <div class="process-stage" id="processStage">
      <!-- 2D 场景容器 -->
      <div class="canvas-box scene3d-box" id="scene3dContainer"></div>

      <!-- 左侧固定侧栏：步骤介绍卡片 -->
      <div class="stage-sidebar">
        <div id="stepInfoContainer"></div>
      </div>

      <!-- 关闭按钮（返回首页） -->
      <button class="stage-close-btn" onclick="backToHome()" title="返回首页">✕</button>

      <!-- 顶部叠加层：游戏栏 + 标题 + 进度 -->
      <div class="stage-overlay-top" id="stageOverlayTop">
        <div id="gameHeader"></div>
        <div class="process-header-inline">
          <span class="ph-icon" id="procIcon">🧧</span>
          <span id="procTitle">如意福结</span>
          <span class="ph-sub" id="procSub"></span>
        </div>
        <div class="progress-bar-wrap" id="progressBar"></div>
      </div>

      <!-- 底部叠加层：操作按钮 -->
      <div class="stage-overlay-bottom" id="stepCardContainer"></div>

      <!-- 完成提示（覆盖整个场景） -->
      <div class="finish-block" id="finishBlock">
        <span class="fb-icon">🎉</span>
        <h2>绳结已成！</h2>
        <p class="fb-desc" id="finishMsg"></p>
        <button class="btn btn-finish" onclick="backToHome()">🏠 返回首页</button>
      </div>
    </div>
  </div>

</div>

<!--
  脚本加载顺序（2D 流程式版）：
  1. data.js                - 纯数据
  2. store.js               - localStorage
  3. scene2d-core.js        - 2D 引擎核心（Canvas 渲染/步骤管理/游戏化系统）
  4. 各绳结 2D 实现文件      - 9 个绳结的 2D 形态定义
  5. achievements.js        - 成就判定
  6. home.js                - 首页
  7. process.js            - 流程式教程控制器
  8. achievements-page.js  - 成就页
  9. pet.js                - 福结宠物
  10. app.js                - 主入口

  无需网络，直接双击 index.html 即可运行！
-->
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/scene2d-core.js"></script>
<script src="js/knots/fu-jie-2d.js"></script>
<script src="js/knots/ping-jie-2d.js"></script>
<script src="js/knots/shuang-qian-2d.js"></script>
<script src="js/knots/pan-chang-2d.js"></script>
<script src="js/knots/ji-xiang-2d.js"></script>
<script src="js/knots/niu-kou-2d.js"></script>
<script src="js/knots/tuan-jin-2d.js"></script>
<script src="js/knots/hu-die-2d.js"></script>
<script src="js/knots/she-jie-2d.js"></script>
<script src="js/achievements.js"></script>
<script src="js/home.js"></script>
<script src="js/process.js"></script>
<script src="js/achievements-page.js"></script>
<script src="js/pet.js"></script>
<script src="js/app.js"></script>

</body>
</html>
