<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日战绩 · 摸鱼战报</title>
<style>
  /* ===== 变量与基础 ===== */
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e8eaed; --muted:#8b93a1; --accent:#ffd166; --accent2:#06d6a0;
    --danger:#ef476f; --info:#4cc9f0; --purple:#b892ff;
    --radius:14px; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(1200px 600px at 80% -10%,#1b2030,transparent),var(--bg);
    color:var(--text); font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px; margin:0 auto; padding:24px 18px 80px}
  h1{font-size:22px; margin:0}
  h2{font-size:15px; margin:0 0 12px; color:var(--muted); letter-spacing:.5px}
  .sub{color:var(--muted); font-size:13px; margin-top:4px}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-top:16px; box-shadow:var(--shadow)}
  /* ===== PC双栏布局 ===== */
  .layout-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 16px; align-items:start}
  .layout-grid .panel{margin-top:16px}
  .col-left, .col-right{display:flex; flex-direction:column; min-width:0}
  /* 左栏稍窄，右栏(时间线/战报)稍宽 */
  .layout-grid{grid-template-columns:minmax(340px,5fr) minmax(380px,7fr)}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px;
    padding:9px 14px; font-size:14px; color:#0f1115; background:var(--accent); font-weight:600;
    transition:transform .06s ease, filter .15s ease}
  button:hover{filter:brightness(1.08)} button:active{transform:translateY(1px)}
  button.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--line)}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  /* ===== 统计看板 ===== */
  .stats-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  .stat-card{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:18px 10px 14px; text-align:center}
  .stat-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px}
  .stat-value{font-size:40px; font-weight:800; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums}
  .stat-unit{font-size:11px; color:var(--muted); margin-top:4px}
  /* 等级独立区域 */
  .level-section{display:flex; align-items:center; gap:16px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin-top:12px}
  .lvl-badge{display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; font-weight:800; font-size:20px; color:#0f1115; line-height:1; flex-shrink:0}
  .lvl-info{flex:1; min-width:0}
  .lvl-name{font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px}
  .lvl-name .lvl-tag{font-size:12px; color:var(--muted); font-weight:400; margin-left:6px}
  .xp-bar{height:6px; background:var(--line); border-radius:3px; overflow:hidden}
  .xp-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:3px; transition:width .8s cubic-bezier(.4,0,.2,1)}
  .xp-text{font-size:11px; color:var(--muted); margin-top:4px; text-align:right; font-variant-numeric:tabular-nums}
  /* ===== 成就 ===== */
  .ach-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
  .ach{padding:3px 9px; border-radius:12px; font-size:12px; font-weight:600; background:var(--panel2); border:1px solid var(--line); color:var(--muted)}
  .ach.on{background:rgba(6,214,160,.1); border-color:rgba(6,214,160,.3); color:var(--accent2)}
  .ach.new{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  /* ===== 时间线类型色条 ===== */
  .tl-item{position:relative}
  .tl-item::before{content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:2px}
  .tl-bug::before{background:var(--danger)}
  .tl-feat::before{background:var(--accent2)}
  .tl-fix::before{background:var(--info)}
  .tl-meet::before{background:var(--purple)}
  .tl-adhoc::before{background:var(--accent)}
  .tl-learn::before{background:#4cc9f0}
  .tl-other::before{background:var(--muted)}
  /* ===== 空状态引导 ===== */
  .empty-hint{text-align:center; padding:24px 12px; color:var(--muted)}
  .empty-hint .big{font-size:28px; margin-bottom:8px}
  /* ===== 首屏引导 ===== */
  .hero-tagline{text-align:center; padding:6px 0 2px}
  .hero-tagline .slogan{font-size:13px; color:var(--accent2); letter-spacing:1px; font-weight:600}
  .hero-tagline .slogan::before{content:'"'; opacity:.5}
  .hero-tagline .slogan::after{content:'"'; opacity:.5}
  /* ===== 时间线 hover + 动画 ===== */
  .tl-item{transition:transform .15s ease, border-color .15s ease, background .15s ease}
  .tl-item:hover{transform:translateX(4px); border-color:var(--accent)!important; background:#232834!important}
  .tl-item:hover .tl-del{opacity:1}
  .tl-del{opacity:.3; transition:opacity .15s ease}
  @keyframes tlSlide{from{opacity:0; transform:translateX(-16px)}to{opacity:1; transform:translateX(0)}}
  .tl-item{animation:tlSlide .25s ease}
  /* ===== 战报卡片 ===== */
  .rpt-card{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:20px; margin-top:12px}
  .rpt-empty{color:var(--muted); text-align:center; padding:20px; font-size:14px}
  .rpt-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line)}
  .rpt-title{font-size:18px; font-weight:700; color:var(--accent)}
  .rpt-status{font-size:13px; color:var(--muted); background:var(--panel); padding:3px 10px; border-radius:8px}
  .rpt-section{margin-bottom:16px}
  .rpt-section-title{font-size:13px; font-weight:700; color:var(--accent2); margin-bottom:10px; letter-spacing:.5px}
  .rpt-fruits{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px}
  .rpt-fruit{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; transition:transform .15s ease}
  .rpt-fruit:hover{transform:translateY(-2px)}
  .rpt-fruit-icon{font-size:18px}
  .rpt-fruit-text{font-size:14px; color:var(--text)}
  .rpt-fruit-num{font-weight:800; color:var(--accent)}
  .rpt-highlights{list-style:none; padding:0; margin:0}
  .rpt-highlights li{padding:6px 0 6px 16px; position:relative; font-size:14px; color:var(--text)}
  .rpt-highlights li::before{content:'·'; position:absolute; left:4px; color:var(--accent2); font-weight:700; font-size:18px; line-height:1}
  .rpt-summary{display:flex; align-items:center; gap:8px; padding:12px 16px; background:var(--panel); border-radius:8px; border-left:3px solid var(--accent2); font-size:14px}
  .rpt-summary .rpt-count{font-weight:800; color:var(--accent); font-size:16px}
  @keyframes rptFade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:translateY(0)}}
  .rpt-card{animation:rptFade .3s ease}
  /* ===== 模板选择器 ===== */
  .tpl-bar{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
  .tpl-chip{padding:5px 12px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer;
    background:var(--panel2); border:1px solid var(--line); color:var(--muted); transition:all .15s ease;
    user-select:none}
  .tpl-chip:hover{border-color:var(--accent); color:var(--text)}
  .tpl-chip.on{background:var(--accent); color:#0f1115; border-color:var(--accent)}

  /* ===== 热血模板 —— 战报排行榜布局 ===== */
  .rpt-hot{border:1px solid rgba(239,71,111,.35)!important; background:linear-gradient(135deg,rgba(239,71,111,.08),rgba(255,209,102,.05))!important; clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
  .hot-banner{display:flex; align-items:center; justify-content:space-between; padding:14px 0 12px; margin-bottom:6px;
    border-bottom:2px solid rgba(239,71,111,.25); position:relative}
  .hot-banner::after{content:''; position:absolute; bottom:-2px; left:0; width:40%; height:2px; background:linear-gradient(90deg,var(--danger),transparent)}
  .hot-title{font-size:22px; font-weight:900; color:var(--danger); text-transform:uppercase; letter-spacing:1px; text-shadow:0 0 20px rgba(239,71,111,.3)}
  .hot-status{font-size:12px; font-weight:700; color:var(--accent); background:rgba(239,71,111,.1); border:1px solid rgba(239,71,111,.3); padding:3px 10px; border-radius:4px}
  .hot-section{margin:14px 0}
  .hot-section-title{font-size:12px; font-weight:800; color:var(--accent); letter-spacing:2px; margin-bottom:10px; text-transform:uppercase}
  /* 击杀榜 —— 顶部MVP卡片网格 + 底部迷你条 */
  .hot-kill-top{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:10px}
  .hot-mvp-card{position:relative; padding:14px 12px 12px; border-radius:10px; overflow:hidden; text-align:center}
  .hot-mvp-card.rank-1{background:linear-gradient(135deg,rgba(239,71,111,.15),rgba(255,209,102,.08)); border:1px solid rgba(239,71,111,.35)}
  .hot-mvp-card.rank-2{background:linear-gradient(135deg,rgba(255,209,102,.1),rgba(239,71,111,.05)); border:1px solid rgba(255,209,102,.25)}
  .hot-rank-badge{position:absolute; top:6px; left:8px; font-size:10px; font-weight:900; color:#0f1115; background:var(--accent); padding:1px 6px; border-radius:4px; letter-spacing:.5px}
  .hot-mvp-card.rank-1 .hot-rank-badge{background:var(--danger); color:#fff}
  .hot-mvp-icon{font-size:28px; margin-bottom:4px; line-height:1}
  .hot-mvp-num{font-size:32px; font-weight:900; color:var(--danger); line-height:1; font-variant-numeric:tabular-nums}
  .hot-mvp-card.rank-2 .hot-mvp-num{color:var(--accent)}
  .hot-mvp-label{font-size:12px; font-weight:700; color:var(--text); margin-top:4px}
  .hot-mvp-unit{font-size:10px; color:var(--muted); margin-top:1px}
  /* 迷你排行条 */
  .hot-kill-mini{display:flex; flex-direction:column; gap:5px}
  .hot-mini-row{display:flex; align-items:center; gap:8px; padding:5px 10px; background:rgba(239,71,111,.04); border-radius:6px}
  .hot-mini-rank{font-size:11px; font-weight:800; color:var(--muted); width:18px; flex-shrink:0; text-align:center}
  .hot-mini-icon{font-size:14px; flex-shrink:0}
  .hot-mini-name{font-size:12px; color:var(--text); flex-shrink:0; min-width:36px}
  .hot-mini-bar{flex:1; height:5px; background:rgba(255,255,255,.05); border-radius:3px; overflow:hidden; min-width:30px}
  .hot-mini-fill{height:100%; background:linear-gradient(90deg,var(--danger),var(--accent)); border-radius:3px; transition:width .6s ease}
  .hot-mini-num{font-size:15px; font-weight:800; color:var(--danger); flex-shrink:0; font-variant-numeric:tabular-nums; min-width:16px; text-align:right}
  .hot-mvp{display:flex; align-items:center; gap:8px; padding:8px 12px; margin-bottom:6px; background:rgba(255,209,102,.06); border:1px solid rgba(255,209,102,.15); border-radius:6px}
  .hot-mvp-badge{font-size:16px; flex-shrink:0}
  .hot-mvp-text{font-size:13px; color:var(--text)}
  .hot-power{display:flex; align-items:center; gap:10px; padding:14px; margin-top:10px; background:linear-gradient(135deg,rgba(239,71,111,.1),rgba(255,209,102,.08)); border:1px solid rgba(239,71,111,.2); border-radius:8px}
  .hot-power-label{font-size:12px; font-weight:800; color:var(--accent); letter-spacing:1px}
  .hot-power-val{font-size:28px; font-weight:900; color:var(--danger); line-height:1; font-variant-numeric:tabular-nums}
  .hot-power-text{font-size:13px; color:var(--text); font-weight:600}

  /* ===== 文艺模板 —— 日记书信布局 ===== */
  .rpt-lit{border:1px solid rgba(184,146,255,.18)!important; background:linear-gradient(180deg,rgba(184,146,255,.04),rgba(76,201,240,.03))!important; font-family:Georgia,"Noto Serif SC","Songti SC",serif}
  .lit-header{text-align:center; padding:10px 0 14px; margin-bottom:6px; border-bottom:1px solid rgba(184,146,255,.12)}
  .lit-deco{font-size:10px; color:rgba(184,146,255,.4); letter-spacing:8px; margin:4px 0}
  .lit-title{font-size:20px; font-weight:400; color:var(--purple); font-style:italic; letter-spacing:2px}
  .lit-date{font-size:12px; color:var(--muted); margin-top:6px; font-style:italic}
  .lit-section{margin:16px 0; text-align:center}
  .lit-section-title{font-size:13px; color:var(--info); margin-bottom:12px; letter-spacing:3px; font-style:italic}
  .lit-section-title::before{content:'— '; color:rgba(184,146,255,.3)}
  .lit-section-title::after{content:' —'; color:rgba(184,146,255,.3)}
  .lit-fruits{display:flex; flex-wrap:wrap; justify-content:center; gap:6px}
  .lit-fruit{font-size:13px; color:var(--text); padding:4px 12px; background:rgba(184,146,255,.06); border:1px solid rgba(184,146,255,.1); border-radius:20px; font-style:italic}
  .lit-fruit .lit-fruit-num{color:var(--purple); font-weight:700; font-style:normal}
  .lit-quotes{display:flex; flex-direction:column; gap:8px; align-items:center}
  .lit-quote{font-size:14px; color:var(--text); font-style:italic; padding:6px 16px; border-left:2px solid rgba(184,146,255,.2); border-right:2px solid rgba(184,146,255,.2); max-width:90%}
  .lit-footer{text-align:center; margin-top:16px; padding-top:14px; border-top:1px solid rgba(184,146,255,.12)}
  .lit-summary{font-size:14px; color:var(--purple); font-style:italic; line-height:1.8}
  .lit-summary .lit-count{font-weight:700; font-size:16px; color:var(--info); font-style:normal}

  /* ===== 简洁模板 —— 纯文本流布局 ===== */
  .rpt-min{background:transparent!important; border:none!important; padding:16px 0!important; margin-top:8px!important}
  .min-title{font-size:16px; font-weight:700; color:var(--text); margin-bottom:4px}
  .min-title .min-status{font-size:12px; color:var(--muted); font-weight:400; margin-left:8px}
  .min-divider{height:1px; background:var(--line); margin:12px 0}
  .min-row{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
  .min-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; flex-shrink:0; width:36px}
  .min-fruits{font-size:13px; color:var(--text); line-height:1.8}
  .min-fruits .min-fruit-num{font-weight:700; color:var(--accent)}
  .min-hl-list{display:flex; flex-direction:column; gap:3px}
  .min-hl{font-size:13px; color:var(--muted)}
  .min-summary{font-size:13px; color:var(--text)}
  .min-summary .min-count{font-weight:700; color:var(--accent)}

  /* ===== 黑客模板 —— 终端布局 ===== */
  .rpt-hack{background:#0a0e0a!important; border:1px solid #1a3a1a!important; border-radius:8px; padding:0!important; margin-top:12px; overflow:hidden; font-family:"Cascadia Code","Fira Code","Consolas","Courier New",monospace}
  .hack-titlebar{display:flex; align-items:center; gap:6px; padding:8px 12px; background:#0d1a0d; border-bottom:1px solid #1a3a1a}
  .hack-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0}
  .hack-dot.red{background:#ff5f56} .hack-dot.yellow{background:#ffbd2e} .hack-dot.green{background:#27c93f}
  .hack-titletext{font-size:12px; color:#3a6a3a; margin-left:8px}
  .hack-body{padding:14px 16px; font-size:13px; line-height:1.7; color:#00ff41; text-shadow:0 0 4px rgba(0,255,65,.15)}
  .hack-body::before{content:''; position:absolute; width:100%; height:100%; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,65,.015) 2px,rgba(0,255,65,.015) 4px); pointer-events:none}
  .rpt-hack{position:relative}
  .hack-line{white-space:pre-wrap; word-break:break-all; position:relative; z-index:1}
  .hack-cmd{color:#27c93f; font-weight:700}
  .hack-comment{color:#3a8a3a}
  .hack-prompt{color:#00ff41; font-weight:700; margin-right:4px}
  .hack-type{color:#ffbd2e}
  .hack-val{color:#00ff41; font-weight:700}
  .hack-result{color:#4cc9f0; border-top:1px dashed #1a3a1a; margin-top:6px; padding-top:8px}
  .hack-cursor{display:inline-block; width:8px; height:14px; background:#00ff41; animation:hackBlink 1s step-end infinite; vertical-align:middle}
  @keyframes hackBlink{0%,50%{opacity:1}51%,100%{opacity:0}}
  /* ===== 响应式 ===== */
  /* 平板及以下：降级为单栏 */
  @media(max-width:860px){
    .layout-grid{grid-template-columns:1fr}
    .wrap{max-width:600px}
  }
  @media(max-width:600px){
    .stats-grid{grid-template-columns:repeat(2,1fr)}
    .rpt-fruits{grid-template-columns:1fr}
    /* 移动端 header 堆叠 */
    header.row{flex-direction:column; gap:12px}
    header .row{justify-content:flex-start!important}
    /* 移动端输入框满宽 */
    .panel .row{flex-direction:column; align-items:stretch}
    .panel .row > select, .panel .row > input{width:100%; flex:1 1 auto!important}
    .panel .row > button{width:100%; padding:11px 14px}
    /* 时间线操作按钮并排 */
    #timeline ~ .row, .panel > .row:first-child{flex-direction:row; flex-wrap:wrap}
    .panel > .row:first-child > button, .panel > .row:first-child > select{flex:1 1 auto; width:auto}
    /* 战报操作按钮 */
    #report ~ .row, .panel .row:has(#genBtn){flex-direction:row; flex-wrap:wrap}
    .panel .row:has(#genBtn) > *{flex:1 1 80px}
    /* 弹层全屏 */
    #importModal .panel{max-width:100%!important}
    /* 负载按钮 */
    #loadBtns{flex-direction:column}
    #loadBtns button{width:100%; text-align:center; padding:11px}
    /* 统计卡片间距收紧 */
    .stats-grid{gap:8px}
    .stat-card{padding:12px 4px 10px}
    .stat-value{font-size:30px}
    .level-section{padding:10px 12px; gap:10px}
    .lvl-badge{width:36px; height:36px; font-size:16px}
    /* 模板移动端适配 */
    .hot-kill-top{grid-template-columns:1fr 1fr; gap:8px}
    .hot-mvp-num{font-size:26px}
    .hot-mvp-icon{font-size:22px}
    .hot-mini-bar{min-width:20px}
    .hot-title{font-size:18px}
    .hot-power-val{font-size:22px}
    .lit-fruits{gap:4px}
    .lit-fruit{font-size:12px; padding:3px 8px}
    .lit-quote{font-size:13px}
    .hack-body{font-size:12px; padding:10px 12px}
    .min-label{width:28px}
    .min-fruits{font-size:12px}
    /* 待办移动端 */
    .todo-item{padding:7px 10px}
    .todo-text{font-size:13px}
  }
  /* ===== Toast 通知 ===== */
  .toast-wrap{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:1000;
    display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
  .toast{padding:10px 20px; border-radius:10px; font-size:14px; font-weight:600; color:#0f1115;
    background:var(--accent2); box-shadow:0 6px 20px rgba(0,0,0,.4); pointer-events:auto;
    animation:toastIn .3s ease, toastOut .3s ease 2.2s forwards}
  .toast.err{background:var(--danger); color:#fff}
  .toast.info{background:var(--info); color:#0f1115}
  @keyframes toastIn{from{opacity:0; transform:translateY(20px)}to{opacity:1; transform:translateY(0)}}
  @keyframes toastOut{from{opacity:1; transform:translateY(0)}to{opacity:0; transform:translateY(20px)}}
  /* ===== 面板渐入 ===== */
  .panel{animation:panelIn .35s ease}
  @keyframes panelIn{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:translateY(0)}}
  /* ===== 新记录高亮 ===== */
  .tl-item.fresh{animation:tlSlide .25s ease, freshFlash .6s ease}

// 每种记录类型获得的经验值
const TYPE_XP = {bug:15, feat:20, fix:10, meet:8, adhoc:12, learn:15, other:5};
// 成就定义
const ACHIEVEMENTS = [
  {id:"first_blood", name:"⚔️ 初战告捷",  desc:"记录第一条任务"},
  {id:"busy_bee",    name:"🐝 勤劳蜜蜂",  desc:"一天记录5条任务"},
  {id:"perfect_10",  name:"💎 十全十美",  desc:"一天记录10条任务"},
  {id:"streak_3",    name:"🔥 三日连击",  desc:"连续使用3天"},
  {id:"streak_7",    name:"👑 一周达人",  desc:"连续使用7天"},
  {id:"git_master",  name:"🔀 Git达人",  desc:"导入Git记录"},

/* ===== 存储 ===== */
const LS_KEY = "mangma_entries_v1";
const LS_LOAD = "mangma_load_v1";
function todayKey(d=new Date()){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function loadAll(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return {}} }
function saveAll(o){ localStorage.setItem(LS_KEY, JSON.stringify(o)); }
function getDay(k){ const a=loadAll(); return a[k]||[]; }
function setDay(k,list){ const a=loadAll(); a[k]=list; saveAll(a); }

/* ===== 状态 ===== */
let state = {
  load: localStorage.getItem(LS_LOAD)||"normal",
  tpl: localStorage.getItem("mangma_tpl")||"classic"
};

/* ===== 战报模板配置 ===== */
const TEMPLATES = {

    imgBg1:"#2a1520", imgBg2:"#1a0a0f", imgBar:"#ef476f",

/* ===== Toast 通知 ===== */
function toast(msg, type){
  type = type || 'ok';
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast " + (type==='ok'?'':type);
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 2700);
}

/* ===== 数字缓动计数 ===== */
const _countTimers = {};
function countUpStat(el, val){
  if(!el) return;
  const old = parseInt(el.textContent)||0;
  if(old === val){ el.textContent = val; return; }
  // 取消上一次未完成的动画
  if(_countTimers[el.id]){ clearTimeout(_countTimers[el.id]); }
  const duration = 800; // 毫秒
  const startTime = Date.now();
  const diff = val - old;
  function tick(){
    const t = Math.min(1, (Date.now() - startTime) / duration);
    // easeOutQuart：先快后慢，收尾有成就感
    const eased = 1 - Math.pow(1 - t, 4);
    el.textContent = Math.round(old + diff * eased);
    if(t < 1){ _countTimers[el.id] = setTimeout(tick, 16); }
    else { el.textContent = val; delete _countTimers[el.id]; }
  }
  _countTimers[el.id] = setTimeout(tick, 16);
}

/* ===== 按钮波纹 ===== */
function addRipple(btn, e){
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = (e.clientX||rect.left+rect.width/2) - rect.left - size/2;
  const y = (e.clientY||rect.top+rect.height/2) - rect.top - size/2;
  const r = document.createElement("span");
  r.className = "ripple";
  r.style.width = r.style.height = size + "px";
  r.style.left = x + "px";
  r.style.top = y + "px";
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 400);
}

/* ===== 连击系统 ===== */
const LS_STREAK = "mangma_streak_v1";
const LS_LAST_ACTIVE = "mangma_last_active_v1";
function getStreakInfo(){
  let streak = parseInt(localStorage.getItem(LS_STREAK)||"0");
  const lastActive = localStorage.getItem(LS_LAST_ACTIVE);
  const today = todayKey();
  if(lastActive !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    if(lastActive !== todayKey(y)) streak = 0;
  }
  return streak;
}
function updateStreak(){
  const today = todayKey();
  const lastActive = localStorage.getItem(LS_LAST_ACTIVE);
  if(lastActive === today) return;
  let streak = parseInt(localStorage.getItem(LS_STREAK)||"0");
  const y = new Date(); y.setDate(y.getDate()-1);
  if(lastActive === todayKey(y)) streak++; else streak = 1;
  localStorage.setItem(LS_STREAK, String(streak));
  localStorage.setItem(LS_LAST_ACTIVE, today);
}

/* ===== 等级 / 经验 ===== */
function calcTotalXP(){
  const all = loadAll(); let xp = 0;
  for(const day in all){ all[day].forEach(e=>{ xp += TYPE_XP[e.type]||5; }); }
  return xp;
}
function getLevel(xp){
  for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i].min) return {...LEVELS[i], level:i+1}; }
  return {...LEVELS[0], level:1};
}
function getLevelProgress(xp){
  const cur = getLevel(xp);
  const next = LEVELS[cur.level];
  if(!next) return 100;
  return Math.min(100, Math.floor((xp - cur.min) / (next.min - cur.min) * 100));
}

/* ===== 成就系统 ===== */
const LS_ACH = "mangma_achievements_v1";
function getAchievements(){ try{return JSON.parse(localStorage.getItem(LS_ACH)||"[]")}catch(e){return []} }
function saveAchievements(a){ localStorage.setItem(LS_ACH, JSON.stringify(a)); }
function checkAchievements(){
  const list = getDay(todayKey());
  const streak = getStreakInfo();
  const types = new Set(list.map(e=>e.type));
  const featCount = list.filter(e=>e.type==="feat").length;
  const hasGitImported = localStorage.getItem("mangma_git_imported")==="1";
  const checks = {
    first_blood: list.length>=1,
    busy_bee: list.length>=5,
    perfect_10: list.length>=10,
    streak_3: streak>=3,
    streak_7: streak>=7,
    git_master: hasGitImported,
    all_types: types.size>=4,
    feat_master: featCount>=3,
  };
  const ach = getAchievements();
  let newlyUnlocked = [];
  Object.entries(checks).forEach(([id,passed])=>{
    if(passed && !ach.includes(id)){ ach.push(id); newlyUnlocked.push(id); }
  });
  if(newlyUnlocked.length) saveAchievements(ach);
  return {ach, newlyUnlocked};
}

/* ===== 统计渲染 ===== */
function renderStats(){
  const list = getDay(todayKey());
  const feats = list.filter(e=>["feat","bug"].includes(e.type)).length;
  const xp = calcTotalXP();
  const lvl = getLevel(xp);
  const streak = getStreakInfo();
  const panel = document.getElementById("statsPanel");
  panel.style.display = list.length>0 ? "" : "none";
  if(!list.length) return;
  countUpStat(document.getElementById("statTasks"), list.length);
  countUpStat(document.getElementById("statFeats"), feats);
  const lvlEl = document.getElementById("statLevel");
  lvlEl.textContent = lvl.level;
  lvlEl.style.background = lvl.color;
  document.getElementById("statLevelName").firstChild.textContent = lvl.name;
  const progress = getLevelProgress(xp);
  document.getElementById("statXpBar").style.width = progress+"%";
  // XP 文本：当前 / 下一级所需
  const nextLvl = LEVELS[lvl.level]; // 下一个等级（index = level = 当前index+1）
  const xpText = nextLvl ? `${xp} / ${nextLvl.min} XP` : `MAX · ${xp} XP`;
  document.getElementById("statXpText").textContent = xpText;
  countUpStat(document.getElementById("statStreak"), streak);
  const {ach, newlyUnlocked} = checkAchievements();
  document.getElementById("achRow").innerHTML = ACHIEVEMENTS.map(a=>{
    const on = ach.includes(a.id);
    const isNew = newlyUnlocked.includes(a.id);
    return `<span class="ach ${on?'on':''} ${isNew?'new':''}" title="${a.desc}">${a.name}</span>`;
  }).join("");
}

  const now = new Date();
  const samples = [
    {type:"feat",  text:"完成登录页重构，支持手机号+验证码登录"},
    {type:"bug",   text:"修复 iOS Safari 下页面白屏问题"},

    {type:"feat",  text:"新增战报导出为图片功能"},

/* ===== 战报生成 ===== */
function collectRange(range){
  if(range==="day") return getDay(todayKey());
  // 本周：从周一到今天
  const all=loadAll(); const now=new Date();
  const day=(now.getDay()+6)%7; // 周一=0
  const monday=new Date(now); monday.setDate(now.getDate()-day); monday.setHours(0,0,0,0);
  let out=[];
  for(let i=0;i<=day;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    out=out.concat(all[todayKey(d)]||[]);
  }
  return out;
}

/* ===== 战报数据预处理（共用） ===== */
function prepReportData(range){
  const list = collectRange(range);
  if(!list.length) return null;
  const cnt = {};
  list.forEach(e=>{ cnt[e.type]=(cnt[e.type]||0)+1; });
  const order=["feat","bug","fix","adhoc","learn","meet","other"];
  const fruits = order.filter(k=>cnt[k]).map(k=>({key:k, t:TYPES[k], n:cnt[k]}));
  const hi = list.filter(e=>["feat","bug"].includes(e.type)).slice(-3);
  const hlList = (hi.length?hi:list.slice(-3));
  const n = list.length;
  const ei = n>=12?3 : n>=6?2 : n>=3?1 : 0;
  const maxN = Math.max(...fruits.map(f=>f.n), 1);
  const cur = LOAD_STATES.find(s=>s.key===state.load)||LOAD_STATES[1];
  return {list, fruits, hlList, n, ei, maxN, cur};
}

/* ===== git log 导入 ===== */
function parseGitLog(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map(line=>{
    const low=line.toLowerCase();
    let type="other";
    if(/^(feat|feature)[:(]|新增|新功能/.test(low)) type="feat";
    else if(/^fix[:(]|修复|bug/.test(low)) type="bug";
    else if(/^(refactor|style|chore|perf)[:(]|重构|优化/.test(low)) type="fix";
    else if(/^docs?[:(]|文档/.test(low)) type="other";
    // 去掉 conventional commit 前缀
    const clean=line.replace(/^(\w+)(\([^)]*\))?:\s*/,"");
    return {type,text:clean,ts:Date.now()};
  });
}

function exportData(){
  const payload = { v:3, exportedAt:new Date().toISOString(), entries:loadAll(), load:state.load,
    streak:parseInt(localStorage.getItem(LS_STREAK)||"0"),
    lastActive:localStorage.getItem(LS_LAST_ACTIVE),

    todos:loadTodos()
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `摸鱼战报备份_${todayKey()}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      const entries = data.entries || data; // 兼容直接存 entries 的旧格式
      if(typeof entries !== "object" || Array.isArray(entries)) throw new Error("格式不对");
      const cur = loadAll();
      let added = 0;
      // 按天合并，用 ts+text 去重，避免重复导入
      for(const day in entries){
        if(!Array.isArray(entries[day])) continue;
        const seen = new Set((cur[day]||[]).map(e=>e.ts+"|"+e.text));
        cur[day] = cur[day] || [];
        for(const e of entries[day]){
          const key = e.ts+"|"+e.text;
          if(!seen.has(key)){ cur[day].push(e); seen.add(key); added++; }
        }
        cur[day].sort((a,b)=>a.ts-b.ts);
      }
      saveAll(cur);
      if(data.load) { state.load = data.load; localStorage.setItem(LS_LOAD, state.load); }
      if(data.streak) localStorage.setItem(LS_STREAK, String(data.streak));
      if(data.lastActive) localStorage.setItem(LS_LAST_ACTIVE, data.lastActive);
      if(data.achievements) saveAchievements(data.achievements);
      if(data.gitImported) localStorage.setItem("mangma_git_imported", "1");
      if(data.todos) saveTodos(data.todos);
      renderTimeline(); renderTodos();
      toast(`恢复完成，新增 ${added} 条记录 ✓`);
    }catch(err){ toast("导入失败：文件格式不对","err"); }
  };
  reader.readAsText(file);
}

  const tpl = TEMPLATES[state.tpl] || TEMPLATES.classic;
  const text = buildReport(document.getElementById("reportRange").value).trim();
  if(!text || text.includes("无战绩记录")){ toast("先点「生成」出一份战报，再存图片～","info"); return; }
  const lines = text.split("\n");
  const dpr = 2, padX = 44, padY = 40, lineH = 30, W = 720;
  const H = padY*2 + lines.length*lineH + 44; // 底部留水印
  const c = document.createElement("canvas");
  c.width = W*dpr; c.height = H*dpr;
  const g = c.getContext("2d"); g.scale(dpr,dpr);
  // 背景渐变（模板配色）
  const grd = g.createLinearGradient(0,0,W,H);
  grd.addColorStop(0,tpl.imgBg1); grd.addColorStop(1,tpl.imgBg2);
  g.fillStyle = grd; g.fillRect(0,0,W,H);
  // 左侧强调条
  g.fillStyle = tpl.imgBar; g.fillRect(0,0,6,H);
  // 文本
  g.textBaseline = "top";
  const font = '"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  lines.forEach((ln,i)=>{
    const y = padY + i*lineH;
    if(i===0){ g.font = `700 22px ${font}`; g.fillStyle = tpl.imgTitle; }
    else if(ln.startsWith("【")){ g.font = `600 16px ${font}`; g.fillStyle = tpl.imgSection; }
    else if(/^─+$/.test(ln)){ g.strokeStyle="#2a2f3a"; g.beginPath(); g.moveTo(padX,y+10); g.lineTo(W-padX,y+10); g.stroke(); return; }
    else { g.font = `15px ${font}`; g.fillStyle = tpl.imgText; }
    g.fillText(ln, padX, y);
  });
  // 水印
  g.font = `12px ${font}`; g.fillStyle = "#8b93a1";
  g.fillText("🎮 摸鱼战报 · 让每一份认真工作都被看见", padX, H-padY+6);
  // 下载
  c.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `战报_${todayKey()}.png`;
    a.click(); URL.revokeObjectURL(url);
  }, "image/png");
}

/* ===== 待办模块 ===== */
const LS_TODO = "mangma_todo_v1";
function loadTodos(){ try{ return JSON.parse(localStorage.getItem(LS_TODO)||"{}") }catch(e){ return {} } }
function saveTodos(o){ localStorage.setItem(LS_TODO, JSON.stringify(o)); }
function getDayTodos(k){ const a=loadTodos(); return a[k]||[]; }
function setDayTodos(k,list){ const a=loadTodos(); a[k]=list; saveTodos(a); }

const TODO_CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

function seedSampleTodos(){
  if(localStorage.getItem("mangma_todo_seeded")==="1") return;
  if(getDayTodos(todayKey()).length>0){ localStorage.setItem("mangma_todo_seeded","1"); return; }
  const samples = [
    {text:"整理今日需求排期", done:true, ts:Date.now()-30000},
    {text:"完成登录接口联调", done:false, ts:Date.now()-20000},
    {text:"review 前端PR", done:false, ts:Date.now()-10000},
    {text:"准备明天周会汇报材料", done:false, ts:Date.now()},
  ];
  setDayTodos(todayKey(), samples);
  localStorage.setItem("mangma_todo_seeded","1");
}

function renderTodos(){
  const list = getDayTodos(todayKey());
  const box = document.getElementById("todoList");
  const pw = document.getElementById("todoProgressWrap");

  if(!list.length){
    box.innerHTML = `<div class="todo-empty"><div class="big">📝</div>还没有待办，先规划一下今天要做的事吧</div>`;
    pw.style.display = "none";
    return;
  }

  const done = list.filter(t=>t.done).length;
  const total = list.length;
  const pct = total ? Math.round(done/total*100) : 0;

  // 进度条
  pw.style.display = "flex";
  document.getElementById("todoProgressFill").style.width = pct + "%";
  document.getElementById("todoProgressText").textContent = done + " / " + total;

  // 列表：未完成在前，已完成在后
  const sorted = [...list].sort((a,b)=>a.done-b.done);
  box.innerHTML = sorted.map((t,idx)=>{
    const realIdx = list.indexOf(t);
    return `<div class="todo-item${t.done?' done':''}" data-idx="${realIdx}">
      <div class="todo-check" data-toggle="${realIdx}">${TODO_CHECK_SVG}</div>
      <span class="todo-text" data-edit="${realIdx}">${t.text}</span>
      <button class="todo-del" data-del="${realIdx}">✕</button>
    </div>`;
  }).join("");

  // 打勾切换
  box.querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick=()=>{
      const l = getDayTodos(todayKey());
      const i = +el.dataset.toggle;
      l[i].done = !l[i].done;
      setDayTodos(todayKey(), l);
      const item = el.closest(".todo-item");
      if(l[i].done){
        item.classList.add("just-done");
        toast("搞定一项 ✓");
        setTimeout(()=>renderTodos(), 350);
      } else {
        renderTodos();
      }
    };
  });

  // 点击文字编辑
  box.querySelectorAll("[data-edit]").forEach(el=>{
    el.ondblclick=()=>{
      const i = +el.dataset.edit;
      const l = getDayTodos(todayKey());
      const oldText = l[i].text;
      const input = document.createElement("input");
      input.className = "todo-text-edit";
      input.value = oldText;
      el.replaceWith(input);
      input.focus();
      input.select();
      const finish = ()=>{
        const newText = input.value.trim();
        const l2 = getDayTodos(todayKey());
        if(newText && newText!==oldText){ l2[i].text = newText; setDayTodos(todayKey(), l2); }
        renderTodos();
      };
      input.onblur = finish;
      input.onkeydown = e=>{ if(e.key==="Enter") finish(); if(e.key==="Escape") renderTodos(); };
    };
  });

  // 删除
  box.querySelectorAll("[data-del]").forEach(el=>{
    el.onclick=()=>{
      const l = getDayTodos(todayKey());
      l.splice(+el.dataset.del, 1);
      setDayTodos(todayKey(), l);
      renderTodos();
    };
  });
}

function addTodo(text){
  text = (text||"").trim();
  if(!text) return;
  const l = getDayTodos(todayKey());
  l.push({text, done:false, ts:Date.now()});
  setDayTodos(todayKey(), l);
  renderTodos();
  toast("待办已添加 📋");
}

function bindTodo(){
  const ti = document.getElementById("todoInput");
  document.getElementById("todoAdd").onclick=(e)=>{ addRipple(e.currentTarget,e); addTodo(ti.value); ti.value=""; ti.focus(); };
  ti.addEventListener("keydown",e=>{ if(e.key==="Enter"){ addTodo(ti.value); ti.value=""; } });
  document.getElementById("todoClearDone").onclick=(e)=>{
    addRipple(e.currentTarget,e);
    const l = getDayTodos(todayKey());
    const remaining = l.filter(t=>!t.done);
    if(remaining.length === l.length){ toast("没有已完成的待办","info"); return; }
    setDayTodos(todayKey(), remaining);
    renderTodos();
    toast("已清除完成的待办 🧹");
  };
}

/* ===== 事件绑定 ===== */
function bind(){
  const et=document.getElementById("entryType"), ei=document.getElementById("entryText");
  document.getElementById("addBtn").onclick=(e)=>{ addRipple(e.currentTarget,e); addEntry(et.value,ei.value); ei.value=""; ei.focus(); };
  ei.addEventListener("keydown",e=>{ if(e.key==="Enter"){ addEntry(et.value,ei.value); ei.value=""; } });

  document.getElementById("genBtn").onclick=(e)=>{ addRipple(e.currentTarget,e); genReport(); };

  // 模板切换
  document.getElementById("tplBar").querySelectorAll(".tpl-chip").forEach(chip=>{
    chip.onclick=()=>{
      document.getElementById("tplBar").querySelectorAll(".tpl-chip").forEach(c=>c.classList.remove("on"));
      chip.classList.add("on");
      state.tpl = chip.dataset.tpl;
      localStorage.setItem("mangma_tpl", state.tpl);
      // 如果已有战报，用新模板重新渲染
      const rpt = document.getElementById("report");
      if(rpt.querySelector(".rpt-card") || rpt.querySelector(".rpt-empty")){
        genReport();
      }
    };
  });
  document.getElementById("copyBtn").onclick=async(e)=>{
    addRipple(e.currentTarget,e);
    const txt=buildReport(document.getElementById("reportRange").value);
    if(!txt) return;
    try{ await navigator.clipboard.writeText(txt); flash(document.getElementById("copyBtn"),"已复制✓"); }
    catch(err){ /* 降级：选中 */ const r=document.createRange(); r.selectNode(document.getElementById("report")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("已选中战报文本，按 Ctrl+C 复制","info"); }
  };
  document.getElementById("clearBtn").onclick=(e)=>{
    addRipple(e.currentTarget,e);
    if(confirm("清空今日全部记录？此操作不可恢复。")){ setDay(todayKey(),[]); renderTimeline(); toast("今日记录已清空","info"); }
  };

  const modal=document.getElementById("importModal");
  document.getElementById("importBtn").onclick=()=>{ modal.style.display="flex"; };
  document.getElementById("importCancel").onclick=()=>{ modal.style.display="none"; };
  document.getElementById("importConfirm").onclick=(e)=>{
    addRipple(e.currentTarget,e);
    const parsed=parseGitLog(document.getElementById("importText").value);
    if(parsed.length){ const l=getDay(todayKey()).concat(parsed); setDay(todayKey(),l); localStorage.setItem("mangma_git_imported","1"); toast(`导入 ${parsed.length} 条 Git 记录 ✓`); }
    else { toast("没有检测到有效内容","err"); }
    document.getElementById("importText").value=""; modal.style.display="none"; renderTimeline();
  };
  modal.onclick=e=>{ if(e.target===modal) modal.style.display="none"; };

  // 数据备份 + 分享图
  document.getElementById("exportBtn").onclick=(e)=>{ addRipple(e.currentTarget,e); exportData(); };
  const impFile=document.getElementById("importFile");
  document.getElementById("importDataBtn").onclick=(e)=>{ addRipple(e.currentTarget,e); impFile.click(); };
  impFile.onchange=()=>{ if(impFile.files[0]){ importData(impFile.files[0]); impFile.value=""; } };
  document.getElementById("imgBtn").onclick=(e)=>{ addRipple(e.currentTarget,e); shareImage(); };
}
function flash(btn,txt){ const o=btn.textContent; btn.textContent=txt; setTimeout(()=>btn.textContent=o,1200); }

/* ===== 启动 ===== */
seedSampleData(); seedSampleTodos(); initSelects(); renderTimeline(); renderTodos(); bind(); bindTodo();
// 恢复上次选中的模板
(function(){
  const chip = document.querySelector(`.tpl-chip[data-tpl="${state.tpl}"]`);
  if(chip){ document.getElementById("tplBar").querySelectorAll(".tpl-chip").forEach(c=>c.classList.remove("on")); chip.classList.add("on"); }
})();
</script>
