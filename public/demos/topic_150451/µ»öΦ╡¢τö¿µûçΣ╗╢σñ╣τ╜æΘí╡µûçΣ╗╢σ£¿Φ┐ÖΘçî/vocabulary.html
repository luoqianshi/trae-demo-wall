<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的词汇本 - 腓利老师雅思学习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" style="min-height: auto;">
      <nav class="nav">
        <a class="brand" href="index.html">
          <span class="brand-mark">IELTS</span>
          <span>
            <strong>腓利老师雅思学习</strong>
            <small>完全针对真题研究的雅思学习方法</small>
          </span>
        </a>
        <div class="vocab-nav">
          <a class="nav-back" href="test1.html">&larr; 返回真题1</a>
          <a class="nav-back" href="index.html">首页</a>
        </div>
      </nav>
    </header>

    <main class="app-shell">
      <section class="section">
        <div class="test-hero">
          <p class="eyebrow">Vocabulary Notebook</p>
          <h1>我的词汇本</h1>
          <p>在真题页面选中单词 → 点击"收藏" → 选择词库。所有收藏的词汇都在这里，按听说读写分类管理。</p>
        </div>

        <div class="vocab-tabs">
          <button class="vocab-tab is-active" data-cat="listening">
            🎧 听力词汇 <span class="vocab-count"></span>
          </button>
          <button class="vocab-tab" data-cat="reading">
            📖 阅读词汇 <span class="vocab-count"></span>
          </button>
          <button class="vocab-tab" data-cat="writing">
            ✍️ 写作词汇 <span class="vocab-count"></span>
          </button>
          <button class="vocab-tab" data-cat="speaking">
            💬 口语词汇 <span class="vocab-count"></span>
          </button>
        </div>

        <div class="vocab-list" id="vocabList"></div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "ielts_vocabulary";
      const CAT_NAMES = {
        listening: "听力词汇",
        reading: "阅读词汇",
        writing: "写作词汇",
        speaking: "口语词汇"
      };

      function getVocabulary() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { listening: [], reading: [], writing: [], speaking: [] };
        } catch {
          return { listening: [], reading: [], writing: [], speaking: [] };
        }
      }

      function saveVocabulary(vocab) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(vocab));
      }

      function renderCategory(cat) {
        const vocab = getVocabulary();
        const words = vocab[cat] || [];
        const list = document.getElementById("vocabList");

        if (words.length === 0) {
          const icons = { listening: "🎧", reading: "📖", writing: "✍️", speaking: "💬" };
          list.innerHTML = `
            <div class="vocab-empty">
              <div class="vocab-empty-icon">${icons[cat] || "📝"}</div>
              <p>${CAT_NAMES[cat]}还是空的</p>
              <p style="font-size: 13px; margin-top: 8px;">在真题页面选中单词，点击"收藏"即可添加</p>
            </div>
          `;
          return;
        }

        let html = "";
        words.forEach((item, index) => {
          const time = new Date(item.time);
          const dateStr = `${time.getFullYear()}-${String(time.getMonth() + 1).padStart(2, "0")}-${String(time.getDate()).padStart(2, "0")}`;
          html += `
            <div class="vocab-card">
              <div class="vocab-card-header">
                <div class="vocab-card-word">
                  <strong>${escapeHtml(item.word)}</strong>
                  ${item.phonetic ? `<span class="vocab-card-phonetic">${escapeHtml(item.phonetic)}</span>` : ""}
                </div>
                <button class="vocab-card-delete" data-cat="${cat}" data-index="${index}">删除</button>
              </div>
              ${item.definition ? `<div class="vocab-card-definition"><span class="vocab-card-pos">${escapeHtml(item.pos)}</span>${escapeHtml(item.definition)}</div>` : ""}
              <div class="vocab-card-meaning">${escapeHtml(item.meaning) || "暂无翻译"}</div>
              ${item.sentence ? `<div class="vocab-card-sentence">${escapeHtml(item.sentence)}</div>` : ""}
              <div class="vocab-card-source">${escapeHtml(item.source)} · ${dateStr}</div>
            </div>
          `;
        });
        list.innerHTML = html;

        // 删除按钮事件
        list.querySelectorAll(".vocab-card-delete").forEach((btn) => {
          btn.addEventListener("click", () => {
            const c = btn.dataset.cat;
            const i = parseInt(btn.dataset.index);
            const v = getVocabulary();
            v[c].splice(i, 1);
            saveVocabulary(v);
            renderCategory(c);
            updateCounts();
          });
        });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function updateCounts() {
        const vocab = getVocabulary();
        document.querySelectorAll(".vocab-tab").forEach((tab) => {
          const cat = tab.dataset.cat;
          const count = (vocab[cat] || []).length;
          tab.querySelector(".vocab-count").textContent = count > 0 ? `(${count})` : "";
        });
      }

      // Tab切换
      document.querySelectorAll(".vocab-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".vocab-tab").forEach((t) => t.classList.remove("is-active"));
          tab.classList.add("is-active");
          renderCategory(tab.dataset.cat);
        });
      });

      // 初始加载
      updateCounts();
      renderCategory("listening");
    </script>
  </body>
</html>
