<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>六六大顺记账 · 演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#F9D686;--gold-text:#1E3A5F;
  --green:#A9CD65;--blue:#4F6BF6;--blue2:#818CF8;
  --expense:#F43F5E;--expense2:#FB7185;
  --income:#10B981;--income2:#34D399;
  --exp-red:#EF4444;
  --ink:#0F172A;--muted:#94A3B8;--line:#F1F5F9;
  --bg:#F0F0F5;--card:#FFFFFF;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;font-size:14px;color:#333;background:#D9DBE0;display:flex;align-items:center;justify-content:center;min-height:100vh}
/* 手机外壳 */
.phone{position:relative;width:375px;height:812px;background:var(--bg);border-radius:46px;overflow:hidden;box-shadow:0 0 0 11px #1a1a1a,0 0 0 13px #2a2a2a,0 30px 80px rgba(0,0,0,.4);display:flex;flex-direction:column}
@media(max-width:420px){body{background:var(--bg)}.phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}}
/* 状态栏 */
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:15px;font-weight:600;color:var(--ink);position:relative;z-index:60}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.statusbar .icons svg{width:16px;height:16px}
/* 导航栏 - 微信原生样式 */
.navbar{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:50;background:var(--bg);border-bottom:1px solid rgba(0,0,0,.04)}
.navbar .nav-title{font-size:17px;font-weight:600;color:var(--ink)}
.navbar .nav-back{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--ink);cursor:pointer;font-weight:300}
/* 页面区 */
.viewport{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;background:var(--bg)}
.viewport::-webkit-scrollbar{display:none}
.page{display:none;padding:10px;animation:pageFloatIn .5s cubic-bezier(.25,.46,.45,.94) both;padding-bottom:140px}
.page.active{display:block}
@keyframes pageFloatIn{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes cardFloatIn{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* ===== 核心 3D 浮动卡片 ===== */
.card{background:var(--card);border-radius:24px;padding:15px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.02),0 2px 4px rgba(0,0,0,.03),0 4px 8px rgba(0,0,0,.04),0 8px 16px rgba(0,0,0,.05),0 16px 32px rgba(0,0,0,.06),0 24px 48px rgba(0,0,0,.04);border:1px solid rgba(255,255,255,.9);position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.25,.46,.45,.94)}
.card::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9) 20%,#fff 50%,rgba(255,255,255,.9) 80%,transparent);z-index:1}
.card:active{transform:translateY(1px) scale(.985)}

/* 页面标题行 */
.page-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 3px}
.page-header-row .title{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.15px}
.page-header-row .title .icon{font-size:20px}
.new-ledger-btn{background:var(--gold);color:var(--gold-text);padding:7px 14px;border-radius:24px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:2px;box-shadow:0 1px 2px rgba(245,158,11,.2),0 2px 8px rgba(245,158,11,.25),0 4px 16px rgba(245,158,11,.2),0 8px 24px rgba(245,158,11,.15);cursor:pointer;border:none}

/* ===== 默认账本卡 ===== */
.book-card{border-radius:40px;margin-bottom:16px;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.25,.46,.45,.94);animation:cardFloatIn .5s cubic-bezier(.25,.46,.45,.94) both;cursor:pointer}
.book-card:active{transform:scale(.985)}
.book-card.is-default{background:var(--gold);box-shadow:0 2px 4px rgba(0,0,0,.04),0 4px 8px rgba(0,0,0,.06),0 8px 16px rgba(0,0,0,.08),0 16px 32px rgba(0,0,0,.1),0 24px 48px rgba(0,0,0,.12)}
.book-card.is-normal{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.02),0 2px 4px rgba(0,0,0,.03),0 4px 8px rgba(0,0,0,.04),0 8px 16px rgba(0,0,0,.05),0 16px 32px rgba(0,0,0,.06)}
.card-inner{position:relative;z-index:2;padding:20px 22px 16px}
/* 头部 */
.bc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.bc-header-left{display:flex;align-items:center;gap:8px;flex:1;overflow:hidden}
.bc-name{font-size:22px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-default .bc-name{color:var(--gold-text)}
.is-normal .bc-name{color:var(--ink);font-size:20px;font-weight:700}
.bc-badges{display:flex;align-items:center;gap:6px;flex-shrink:0}
.badge-role-default{display:inline-flex;align-items:center;gap:4px;padding:4px 14px;border-radius:999px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#78350F;box-shadow:0 1px 4px rgba(245,158,11,.25),inset 0 1px 0 rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.2);white-space:nowrap}
.badge-role-normal{display:inline-flex;align-items:center;gap:4px;padding:4px 14px;border-radius:999px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E;box-shadow:0 1px 3px rgba(245,158,11,.15);white-space:nowrap}
/* 操作按钮 */
.bc-actions{display:flex;gap:8px;flex-shrink:0}
.act-btn-default{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,255,255,.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6);cursor:pointer}
.act-btn-normal{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.act-btn-normal.edit{background:#DBEAFE;color:#0EA5E9}
.act-btn-normal.del{background:#FEE2E2;color:var(--expense)}
/* 金额区 */
.bc-amounts-default{display:flex;gap:32px;margin-bottom:14px;padding:14px 16px;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);border-radius:28px;border:1px solid rgba(255,255,255,.5)}
.bc-amounts-normal{display:flex;gap:32px;margin-bottom:12px}
.bc-amount-item{flex:1}
.bc-amount-label{font-size:11px;font-weight:500;margin-bottom:4px;display:block}
.is-default .bc-amount-label{color:#5A7A94}
.is-normal .bc-amount-label{color:var(--muted)}
.bc-amount-value{font-size:22px;font-weight:800;letter-spacing:-.5px}
.bc-amount-value.expense{color:var(--expense)}
.bc-amount-value.income{color:var(--income)}
/* 底部 */
.bc-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;gap:8px}
.is-default .bc-footer{border-top:1px solid rgba(0,0,0,.06)}
.is-normal .bc-footer{border-top:1px solid #F1F5F9}
.bc-meta{font-size:11px;font-weight:500;flex:1;min-width:0}
.is-default .bc-meta{color:#5A7A94}
.is-normal .bc-meta{color:var(--muted)}
.default-tag{display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;font-size:11px;font-weight:700;background:var(--green);color:#fff;border:1px solid rgba(169,205,101,.6);letter-spacing:.3px;box-shadow:0 2px 8px rgba(169,205,101,.3);white-space:nowrap;flex-shrink:0}
.btn-set-default{display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;font-size:11px;font-weight:600;background:#E0F2FE;color:#0EA5E9;border:1px solid #BAE6FD;letter-spacing:.2px;white-space:nowrap;flex-shrink:0;cursor:pointer}

/* ===== 记一笔：滑动开关 ===== */
.slide-switcher{position:relative;display:flex;background:#F1F5F9;border-radius:24px;padding:2px;margin:6px 0 10px;height:44px;box-shadow:inset 0 1px 2px rgba(0,0,0,.04),inset 0 1px 1px rgba(0,0,0,.02)}
.slide-bg{position:absolute;top:2px;left:2px;width:calc(50% - 2px);height:calc(100% - 4px);border-radius:24px;background:linear-gradient(135deg,var(--expense) 0%,var(--expense2) 100%);box-shadow:0 2px 4px rgba(244,63,94,.15),0 4px 12px rgba(244,63,94,.2),0 8px 24px rgba(244,63,94,.15);transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform;z-index:1}
.slide-switcher.income-active .slide-bg{transform:translateX(calc(100% - 2px));background:linear-gradient(135deg,var(--income) 0%,var(--income2) 100%);box-shadow:0 2px 4px rgba(16,185,129,.15),0 4px 12px rgba(16,185,129,.2),0 8px 24px rgba(16,185,129,.15)}
.slide-btn{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#64748B;z-index:2;transition:color .3s;border:none;background:transparent;border-radius:24px;cursor:pointer}
.slide-btn.active{color:#fff}
/* 输入组 */
.input-group{display:flex;align-items:center;gap:10px;padding:12px 14px}
.input-group .input-icon{font-size:18px;color:var(--muted)}
.input-group .input-value{flex:1;font-size:15px;font-weight:600;color:var(--ink)}
.input-group input{flex:1;border:none;font-size:15px;font-weight:600;color:var(--ink);background:transparent;outline:none}
/* 金额输入 */
.amount-input-wrap{text-align:center;padding:16px 14px}
.amount-display{font-size:31px;font-weight:800;color:var(--ink);letter-spacing:-.5px;display:block;margin-bottom:8px}
.amount-display .cur{font-size:18px;vertical-align:top;color:var(--muted);font-weight:700}
.amount-display input{border:none;font-size:31px;font-weight:800;color:var(--ink);background:transparent;width:auto;min-width:30px;text-align:center;outline:none;letter-spacing:-.5px}
.amount-display input::placeholder{color:#CBD5E1}
/* 分类网格 */
.category-section{padding:12px 8px}
.section-title-sm{font-size:13px;color:#64748B;font-weight:700;display:block;margin-bottom:10px;padding:0 7px;letter-spacing:-.1px}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.category-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;border-radius:24px;transition:all .2s;cursor:pointer}
.category-item:active{transform:scale(.96)}
.category-icon-wrap{width:77px;height:42px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:#F1F5F9;box-shadow:0 1px 1px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);transition:all .2s;flex-shrink:0}
.cat-icon{font-size:26px;line-height:1;white-space:nowrap}
.cat-name{font-size:11px;color:#64748B;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75px;padding:0 2px;font-weight:500}
.category-item.active-expense .category-icon-wrap{background:linear-gradient(135deg,var(--expense) 0%,var(--expense2) 100%);box-shadow:0 2px 4px rgba(244,63,94,.15),0 4px 12px rgba(244,63,94,.2),0 8px 24px rgba(244,63,94,.15)}
.category-item.active-expense .cat-icon{color:#fff}
.category-item.active-expense .cat-name{color:var(--expense);font-weight:700}
.category-item.active-income .category-icon-wrap{background:linear-gradient(135deg,var(--income) 0%,var(--income2) 100%);box-shadow:0 2px 4px rgba(16,185,129,.15),0 4px 12px rgba(16,185,129,.2),0 8px 24px rgba(16,185,129,.15)}
.category-item.active-income .cat-icon{color:#fff}
.category-item.active-income .cat-name{color:var(--income);font-weight:700}
/* 二级分类 */
.sub-section{padding:12px 14px}
.subcategory-tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:7px 14px;border-radius:24px;font-size:13px;background:#fff;color:#64748B;box-shadow:0 1px 1px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);transition:all .2s;font-weight:600;cursor:pointer;border:none}
.tag.active-expense{background:linear-gradient(135deg,var(--expense) 0%,var(--expense2) 100%);color:#fff;box-shadow:0 2px 4px rgba(244,63,94,.15),0 4px 12px rgba(244,63,94,.2),0 8px 24px rgba(244,63,94,.15)}
.tag.active-income{background:linear-gradient(135deg,var(--income) 0%,var(--income2) 100%);color:#fff;box-shadow:0 2px 4px rgba(16,185,129,.15),0 4px 12px rgba(16,185,129,.2),0 8px 24px rgba(16,185,129,.15)}
/* 备注输入 */
.remark-input-box{flex:1;font-size:15px;color:var(--ink);background:transparent;border:none;outline:none}
.remark-input-box::placeholder{color:var(--muted);font-weight:500}
/* 保存按钮 */
.save-btn{margin:15px 0 10px;padding:14px 0;font-size:16px;font-weight:700;width:100%;text-align:center;color:var(--gold-text);background:var(--gold);border-radius:24px;box-shadow:0 2px 4px rgba(245,158,11,.2),0 4px 12px rgba(245,158,11,.25),0 8px 24px rgba(245,158,11,.2);transition:all .2s;border:none;cursor:pointer}
.save-btn:active{transform:translateY(-1px)}

/* ===== 账本详情 ===== */
.month-selector{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:24px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.02),0 1px 4px rgba(0,0,0,.03),0 4px 8px rgba(0,0,0,.04),0 8px 16px rgba(0,0,0,.05),0 16px 32px rgba(0,0,0,.06);margin-bottom:5px}
.month-arrow{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:24px;color:var(--blue);font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);cursor:pointer}
.month-text{font-size:16px;font-weight:700;color:var(--ink)}
.summary-card{margin-top:5px;padding:12px 10px}
.summary-row{display:flex;justify-content:space-around}
.summary-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.s-label{font-size:13px;color:var(--muted);font-weight:500}
.s-value{font-size:21px;font-weight:800;letter-spacing:-.3px}
.s-value.expense{color:var(--expense)}
.s-value.income{color:var(--income)}
.s-value.balance{color:var(--blue)}
.action-buttons{display:flex;gap:8px;margin:10px 0}
.action-btn{flex:1;text-align:center;padding:11px 0;border-radius:24px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.action-btn:active{transform:translateY(1px) scale(.97)}
.btn-primary{background:var(--gold);color:var(--gold-text);box-shadow:0 2px 4px rgba(245,158,11,.2),0 4px 12px rgba(245,158,11,.25),0 8px 24px rgba(245,158,11,.2)}
.btn-stats{background:var(--green);color:#fff;box-shadow:0 2px 4px rgba(169,205,101,.2),0 4px 12px rgba(169,205,101,.25),0 8px 24px rgba(169,205,101,.2)}
.btn-ghost{background:var(--blue);color:#fff;box-shadow:0 2px 4px rgba(79,107,246,.15),0 4px 12px rgba(79,107,246,.2),0 8px 24px rgba(79,107,246,.15)}
.search-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(0,0,0,.02),0 1px 4px rgba(0,0,0,.03),0 4px 8px rgba(0,0,0,.04),0 8px 16px rgba(0,0,0,.05);margin-bottom:10px}
.search-icon{font-size:14px;color:var(--muted)}
.search-input{flex:1;font-size:14px;color:var(--ink);background:transparent;border:none;outline:none}
/* 记录列表 */
.record-header{display:flex;justify-content:space-between;align-items:center;margin:10px 3px 5px;padding:0 5px}
.record-header .title{font-size:15px;font-weight:700;color:var(--ink)}
.record-header .count{font-size:12px;color:var(--muted);font-weight:500}
.record-card{padding:10px 12px;display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(0,0,0,.02),0 1px 4px rgba(0,0,0,.03),0 4px 8px rgba(0,0,0,.04),0 8px 16px rgba(0,0,0,.05);margin-bottom:6px;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s}
.record-card:active{transform:scale(.98)}
.record-left-bar{width:4px;height:28px;border-radius:24px;flex-shrink:0;margin-top:2px}
.record-left-bar.bar-expense{background:var(--expense)}
.record-left-bar.bar-income{background:var(--income)}
.record-main{flex:1;min-width:0}
.record-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.record-cat-info{display:flex;align-items:center;gap:6px}
.cat-tag{height:28px;line-height:28px;padding:0 9px;font-size:12px;border-radius:18px;font-weight:700;box-shadow:0 1px 1px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)}
.tag-expense{background:#FEE2E2;color:var(--expense)}
.tag-income{background:#D1FAE5;color:var(--income)}
.main-cat{font-size:15px;font-weight:700;color:var(--ink)}
.record-amount{font-size:18px;font-weight:800;letter-spacing:-.15px}
.amount-expense{color:var(--expense)}
.amount-income{color:var(--income)}
.record-bottom-row{display:flex;justify-content:space-between;align-items:center}
.record-remark{font-size:12px;color:#64748B;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.record-user{font-size:13px;color:var(--muted);font-weight:500}
.record-date{font-size:13px;color:var(--muted);font-weight:500;text-align:right}
.empty-tip{text-align:center;padding:50px 0;color:var(--muted);font-size:14px}
.empty-tip .e-ico{font-size:46px;display:block;margin-bottom:8px;opacity:.5}

/* 统计面板 */
.stats-total{padding:12px 10px;margin-bottom:10px}
.stats-total-row{display:flex;justify-content:space-between}
.stats-total-item{display:flex;flex-direction:column;align-items:center;flex:1}
.st-label{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.st-value{font-size:16px;font-weight:800;letter-spacing:-.3px}
.st-value.expense{color:var(--expense)}
.st-value.income{color:var(--income)}
.st-value.balance{color:var(--blue)}
.chart-section{padding:12px;margin-bottom:10px}
.chart-title{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px}
.chart-canvas-wrap{width:100%;display:flex;justify-content:center;align-items:center}
.chart-legend{display:flex;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid #F1F5F9}
.legend-item{display:flex;align-items:center;gap:3px;width:33.33%;padding:3px 4px}
.legend-color{width:9px;height:9px;border-radius:2px;flex-shrink:0;box-shadow:0 1px 1px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.06)}
.legend-text{font-size:12px;color:#64748B;font-weight:500}
.stats-table{padding:12px;margin-bottom:10px}
.table-title{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px}
.table-header{display:flex;padding:6px 2px;background:#F8FAFC;border-radius:6px;font-size:11px;color:#64748B;font-weight:700;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.table-row{display:flex;padding:9px 2px;border-bottom:1px solid #F1F5F9;align-items:center}
.table-row:last-child{border-bottom:none}
.th-name,.td-name{flex:1.2;font-size:12px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-amount,.td-amount{flex:1;text-align:right;font-size:12px;color:var(--expense);font-weight:700}
.th-count,.td-count{flex:.8;text-align:right;font-size:11px;color:#64748B;font-weight:500}
.th-percent,.td-percent-wrap{flex:1.4;display:flex;align-items:center;justify-content:flex-end;gap:4px;position:relative}
.td-bar{position:absolute;left:0;top:50%;transform:translateY(-50%);height:6px;background:linear-gradient(90deg,#FCA5A5,var(--expense));border-radius:3px;max-width:100%}
.td-percent-text{position:relative;z-index:1;font-size:11px;color:var(--ink);font-weight:700}
.member-stat-row{display:flex;gap:8px;margin-bottom:10px}
.member-stat-card{flex:1;background:#fff;border-radius:24px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.02),0 4px 8px rgba(0,0,0,.04),0 8px 16px rgba(0,0,0,.05);text-align:center}
.member-stat-card .ms-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;margin:0 auto 6px;box-shadow:0 2px 4px rgba(79,107,246,.2)}
.member-stat-card .ms-name{font-size:12px;color:#64748B;margin-bottom:2px}
.member-stat-card .ms-val{font-size:14px;font-weight:800;color:var(--expense)}

/* 分类管理 */
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;background:#fff;border:1px dashed #E2E8F0;border-radius:24px;color:#64748B;font-size:15px;font-weight:600;margin-bottom:12px;box-shadow:0 4px 12px rgba(59,130,246,.15),0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:all .2s}
.add-btn:active{border-color:var(--blue);color:var(--blue);background:#EFF6FF}
.category-list-item{padding:0;overflow:hidden;margin-bottom:8px;background:#fff;border-radius:24px;box-shadow:0 4px 12px rgba(59,130,246,.12),0 1px 4px rgba(0,0,0,.06)}
.cat-header{display:flex;align-items:center;gap:10px;padding:10px 14px}
.cat-list-icon{width:60px;height:40px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0}
.cat-list-icon.expense{background:#FEE2E2}
.cat-list-icon.income{background:#D1FAE5}
.cat-list-info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.cat-name-text{font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-count{font-size:12px;color:var(--muted)}
.cat-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}
.icon-btn{width:28px;height:28px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer}
.icon-btn.delete{background:#FEE2E2;color:var(--exp-red)}
.icon-btn.expand{background:#F1F5F9;color:#64748B;font-size:12px;transition:transform .3s}
.icon-btn.expand.expanded{transform:rotate(180deg)}
.sub-list{max-height:0;overflow:hidden;transition:max-height .3s ease;background:#F8FAFC}
.sub-list.show{max-height:1000px}
.sub-item{display:flex;justify-content:space-between;align-items:center;padding:7px 14px 7px 50px;border-bottom:1px solid #F1F5F9}
.sub-name{font-size:15px;color:#64748B}
.delete-sub-btn{font-size:13px;color:var(--exp-red);padding:4px 8px;background:#FEE2E2;border-radius:50%;cursor:pointer}
.add-sub-btn{padding:7px 14px 7px 50px;color:var(--blue);font-size:14px;font-weight:500;cursor:pointer}

/* 我的 */
.profile-header{display:flex;align-items:center;gap:14px;padding:16px 14px;margin-bottom:10px}
.profile-header .avatar{width:48px;height:48px;border-radius:10px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700;color:#64748B;flex-shrink:0}
.profile-header .info{flex:1;display:flex;flex-direction:column;gap:4px}
.profile-header .name{font-size:22px;font-weight:700;color:var(--ink)}
.profile-header .stat-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.profile-header .stat-item{display:flex;align-items:baseline;gap:4px}
.profile-header .stat-label{font-size:12px;color:var(--muted)}
.profile-header .stat-value{font-size:14px;font-weight:700;color:var(--ink)}
.profile-header .stat-divider{width:1px;height:12px;background:#E2E8F0}
.profile-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0;align-self:flex-start;margin-top:2px}
.action-capsule{display:flex;align-items:center;justify-content:center;width:70px;height:28px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.action-capsule-pink{background:linear-gradient(135deg,#F9A8D4 0%,#F472B6 50%,#EC4899 100%);color:#fff;box-shadow:0 1px 4px rgba(236,72,153,.25),0 2px 8px rgba(236,72,153,.12)}
.default-book-bar{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:10px;background:linear-gradient(135deg,#FEF2F2 0%,#FEE2E2 100%);box-shadow:0 4px 12px rgba(239,68,68,.12),0 1px 4px rgba(0,0,0,.06);border-radius:24px}
.dbar-icon{font-size:20px;flex-shrink:0}
.dbar-info{display:flex;flex-direction:column;flex:1;min-width:0}
.dbar-label{font-size:11px;color:#B91C1C;font-weight:600}
.dbar-name{font-size:15px;color:#991B1B;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-card{margin-bottom:10px;padding:0;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 4px 12px rgba(59,130,246,.1),0 1px 4px rgba(0,0,0,.06);background:#fff}
.section-header{padding:12px 14px;font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;border-bottom:1px solid #F1F5F9}
.menu-list{display:flex;flex-direction:column}
.menu-item{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid #F1F5F9;cursor:pointer}
.menu-item:last-child{border-bottom:none}
.item-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:10px;flex-shrink:0}
.item-text-wrap{flex:1;display:flex;flex-direction:column}
.item-text{font-size:16px;color:var(--ink);font-weight:500}
.item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.item-arrow{font-size:12px;color:#CBD5E1}
.source-btn{flex:1;padding:14px 0;border-radius:20px;text-align:center;font-size:14px;font-weight:600;color:var(--gold-text);background:var(--gold);box-shadow:0 4px 12px rgba(245,158,11,.35),0 1px 4px rgba(245,158,11,.2);border:none;cursor:pointer}
.email-btn{flex:1;padding:14px 0;border-radius:20px;text-align:center;font-size:14px;font-weight:600;color:#fff;background:var(--green);box-shadow:0 4px 12px rgba(169,205,101,.4),0 1px 4px rgba(169,205,101,.2);border:none;cursor:pointer}

/* ===== 自定义底栏：白色磨砂玻璃胶囊 ===== */
.tab-bar{position:absolute;left:12px;right:12px;bottom:12px;height:65px;background:transparent;display:flex;align-items:stretch;z-index:99;overflow:visible}
.tab-bar-bg{position:absolute;inset:0;background:rgba(255,255,255,.55);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-radius:25px;border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.02),0 4px 8px rgba(0,0,0,.06),0 8px 16px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.8);z-index:0;pointer-events:none}
.tab-bar-side{flex:1;display:flex;align-items:stretch;height:100%;position:relative;z-index:2}
.tab-bar-side.left{padding-left:4px}
.tab-bar-side.right{padding-right:4px}
.tab-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;cursor:pointer;position:relative;z-index:2}
.tab-icon{width:27px;height:27px;margin-bottom:2px;display:flex;align-items:center;justify-content:center;font-size:22px;filter:grayscale(100%) opacity(.6);transition:filter .25s,opacity .25s,transform .25s}
.tab-text{font-size:10px;color:#999;transition:color .25s;font-weight:500}
.tab-bar-item.active .tab-icon{filter:none;opacity:1;transform:scale(1.05)}
.tab-bar-item.active .tab-text{color:var(--blue);font-weight:600}
/* 中间黑色按钮 */
.center-btn-wrap{flex:1;position:relative;height:100%;z-index:3;pointer-events:none}
.center-btn{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;background:#1A1A1A;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.25),0 12px 24px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;z-index:102;pointer-events:auto;border:2px solid rgba(255,255,255,.9);cursor:pointer}
.center-btn:active{transform:translateX(-50%) scale(.9)}
.center-btn.open{box-shadow:0 6px 12px rgba(0,0,0,.25),0 12px 24px rgba(0,0,0,.3),0 16px 32px rgba(0,0,0,.25);transform:translateX(-50%) rotate(45deg)}
.icon-line{position:absolute;background:#fff;border-radius:1px;transition:transform .32s cubic-bezier(.4,0,.2,1)}
.line-h{width:16px;height:2px}
.line-v{width:2px;height:16px}
/* 轨道按钮 */
.orbit-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);z-index:97;pointer-events:none;transition:background .32s}
.orbit-overlay.active{background:rgba(0,0,0,.32);pointer-events:auto}
.orbit-group{position:absolute;left:50%;bottom:77px;width:0;height:0;z-index:101;pointer-events:none}
.orbit-btn{position:absolute;left:-25px;top:-25px;width:50px;height:50px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 1px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);pointer-events:none;opacity:0;transform:translate(0,0) scale(0);transition:all .42s cubic-bezier(.22,1,.36,1);overflow:hidden;cursor:pointer;font-size:22px}
.orbit-group.open .orbit-btn{opacity:1;pointer-events:auto}
.orbit-group.open .orbit-btn.expense{transform:translate(-50px,-50px) scale(1);transition-delay:.04s}
.orbit-group.open .orbit-btn.voice{transform:translate(0,-70px) scale(1);transition-delay:.08s}
.orbit-group.open .orbit-btn.transfer{transform:translate(50px,-50px) scale(1);transition-delay:.12s}
.orbit-btn.expense{background:var(--exp-red)}
.orbit-btn.voice{background:var(--income)}
.orbit-btn.transfer{background:var(--blue)}
.orbit-label{position:absolute;left:0;top:0;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:8px;white-space:nowrap;font-weight:600;pointer-events:none;opacity:0;transition:all .42s cubic-bezier(.22,1,.36,1)}
.orbit-group.open .orbit-label{opacity:1}
.orbit-group.open .orbit-label.label-45{transform:translate(-50px,-86px);transition-delay:.04s}
.orbit-group.open .orbit-label.label-90{transform:translate(-50%,-110px);transition-delay:.08s}
.orbit-group.open .orbit-label.label-135{transform:translate(-30px,-86px);transition-delay:.12s}

/* ===== 弹层 ===== */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(20,22,30,.92);color:#fff;padding:8px 18px;border-radius:24px;font-size:13px;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:200;opacity:0;pointer-events:none;transition:.3s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px 30px;z-index:201;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);max-height:80%;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet .sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet .sh-ttl{font-size:17px;font-weight:800}
.sheet .sh-close{font-size:22px;color:var(--muted);cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid #E2E8F0;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;background:#F8FAFC;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.btn-block{width:100%;border:none;border-radius:20px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 4px 12px rgba(79,107,246,.35)}
.btn-block.gold{background:var(--gold);color:var(--gold-text);box-shadow:0 4px 12px rgba(245,158,11,.35)}
.btn-block.ghost{background:#F1F5F9;color:#64748B;box-shadow:none}
.emoji-pick{display:flex;flex-wrap:wrap;gap:8px}
.emoji-pick span{width:40px;height:40px;border-radius:12px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.emoji-pick span.on{background:var(--blue);transform:scale(1.1)}

/* 语音记账 */
.voice-stage{text-align:center;padding:20px 16px}
.voice-mic{width:90px;height:90px;border-radius:50%;margin:16px auto;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;box-shadow:0 6px 20px rgba(79,107,246,.4);cursor:pointer;transition:.3s}
.voice-mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 6px 20px rgba(79,107,246,.4)}50%{transform:scale(1.08);box-shadow:0 6px 30px rgba(79,107,246,.6)}}
.voice-hint{font-size:14px;color:var(--muted);margin:12px 0}
.voice-input{width:100%;border:1px solid #E2E8F0;border-radius:16px;padding:14px;font-size:15px;outline:none;margin-bottom:12px;background:#F8FAFC}
.voice-input:focus{border-color:var(--blue)}
.voice-examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.voice-examples span{padding:6px 12px;border-radius:16px;background:#F1F5F9;font-size:12px;color:#64748B;cursor:pointer}
.parse-result{background:#F8FAFC;border-radius:16px;padding:16px;text-align:left;margin-top:14px;animation:pop .3s}
.parse-result .pr-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.parse-result .pr-row:last-child{border-bottom:none}
.parse-result .pr-row .k{color:var(--muted)}
.parse-result .pr-row .v{font-weight:700}
.tip-banner{background:#FFF6E0;border:1px solid var(--gold);border-radius:16px;padding:10px 14px;font-size:12px;color:#9A6A00;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.cat-tag-mini{height:24px;line-height:24px;padding:0 8px;font-size:11px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center}
.cat-tag-mini.exp{background:#FEE2E2;color:var(--expense)}
.cat-tag-mini.inc{background:#D1FAE5;color:var(--income)}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="icons">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="18" height="10" rx="2"/><rect x="20" y="10" width="2" height="4" rx="1"/></svg>
    </span>
  </div>
  <div class="navbar">
    <span class="nav-back" id="navBack" style="display:none">‹</span>
    <span class="nav-title" id="navTitle">六六大顺记账</span>
  </div>
  <div class="viewport" id="viewport">
    <!-- 账本页 -->
    <div class="page active" id="page-index">
      <div class="page-header-row">
        <div class="title"><span class="icon">📒</span>我的账本</div>
        <button class="new-ledger-btn" onclick="openBookSheet()">＋ 新建</button>
      </div>
      <div class="tip-banner"><span>💡</span><span>可交互演示页，数据保存在本地。点中间黑色按钮可「记一笔」，真的会保存！</span></div>
      <div id="bookList"></div>
    </div>
    <!-- 统计页 -->
    <div class="page" id="page-stats">
      <div class="page-header-row"><div class="title"><span class="icon">📊</span>统计报表</div></div>
      <div id="statsContent"></div>
    </div>
    <!-- 分类管理页 -->
    <div class="page" id="page-category">
      <div class="page-header-row"><div class="title"><span class="icon">🗂</span>分类管理</div></div>
      <div class="slide-switcher" id="catTabSwitch" style="margin-bottom:12px">
        <div class="slide-bg" id="catTabBg"></div>
        <button class="slide-btn active" id="ctTabExp" onclick="switchCatTab('expense')">支出分类</button>
        <button class="slide-btn" id="ctTabInc" onclick="switchCatTab('income')">收入分类</button>
      </div>
      <div id="catMgrList"></div>
    </div>
    <!-- 我的页 -->
    <div class="page" id="page-profile">
      <div class="page-header-row"><div class="title"><span class="icon">👤</span>我的</div></div>
      <div id="profileContent"></div>
    </div>
    <!-- 记一笔页 -->
    <div class="page" id="page-addRecord">
      <div class="slide-switcher" id="recSwitch">
        <div class="slide-bg"></div>
        <button class="slide-btn active" id="rtExp" onclick="switchRecType('expense')">支出</button>
        <button class="slide-btn" id="rtInc" onclick="switchRecType('income')">收入</button>
      </div>
      <div class="input-group"><span class="input-icon">📅</span><input type="date" id="recDate" class="input-value"></div>
      <div class="amount-input-wrap"><div class="amount-display"><span class="cur">¥</span><input id="recAmount" type="text" inputmode="decimal" placeholder="0" oninput="this.value=this.value.replace(/[^\d.]/g,'')"></div></div>
      <div class="category-section"><span class="section-title-sm">选择分类</span><div class="category-grid" id="catGrid"></div></div>
      <div class="sub-section" id="subSection" style="display:none"><div class="subcategory-tags" id="subTags"></div></div>
      <div class="input-group"><span class="input-icon">📝</span><input class="remark-input-box" id="recRemark" placeholder="添加备注..."></div>
      <button class="save-btn" onclick="saveRecord()">保 存</button>
    </div>
    <!-- 账本详情页 -->
    <div class="page" id="page-book">
      <div class="month-selector"><div class="month-arrow" onclick="shiftMonth(-1)">‹</div><div class="month-text" id="bookMonth"></div><div class="month-arrow" onclick="shiftMonth(1)">›</div></div>
      <div class="card summary-card" id="bookSummary"></div>
      <div class="action-buttons">
        <button class="action-btn btn-primary" onclick="goAddRecord()">✏️ 记一笔</button>
        <button class="action-btn btn-stats" onclick="toast('统计已在下方展示')">📊 看统计</button>
        <button class="action-btn btn-ghost" onclick="toast('已复制邀请链接（演示）')">🔗 邀请</button>
      </div>
      <div class="search-bar"><span class="search-icon">🔍</span><input class="search-input" id="bookSearch" placeholder="搜索备注/分类" oninput="renderBookRecords()"></div>
      <div class="record-header"><span class="title">记录列表</span><span class="count" id="recCount"></span></div>
      <div id="bookRecords"></div>
      <div id="bookStatsPanel"></div>
    </div>
    <!-- 语音记账页 -->
    <div class="page" id="page-voice">
      <div class="page-header-row"><div class="title"><span class="icon">🎙</span>语音记账</div></div>
      <div class="voice-stage">
        <div class="voice-mic" id="voiceMic" onclick="toggleVoice()">🎙️</div>
        <div class="voice-hint" id="voiceHint">点击麦克风开始（演示版用文字模拟语音）</div>
        <input class="voice-input" id="voiceText" placeholder="试试说：早餐花了8块5" onkeydown="if(event.key==='Enter')parseVoice()">
        <div class="voice-examples">
          <span onclick="setVoiceEx(this)">早餐花了8块5</span><span onclick="setVoiceEx(this)">昨天打车15元</span>
          <span onclick="setVoiceEx(this)">买了苹果3斤花了12块</span><span onclick="setVoiceEx(this)">工资到账8000</span>
          <span onclick="setVoiceEx(this)">电影票两张花了80</span><span onclick="setVoiceEx(this)">充电桩30块</span>
        </div>
        <button class="save-btn" style="max-width:200px;margin:10px auto 0" onclick="parseVoice()">识别并解析</button>
        <div id="parseResult"></div>
      </div>
    </div>
  </div>

  <!-- 自定义底栏 -->
  <div class="orbit-overlay" id="orbitOverlay" onclick="closeOrbit()"></div>
  <div class="orbit-group" id="orbitGroup">
    <div class="orbit-label label-45">记支出</div>
    <div class="orbit-label label-90">语音记</div>
    <div class="orbit-label label-135">详情页</div>
    <div class="orbit-btn expense" onclick="closeOrbit();goAddRecord()">✏️</div>
    <div class="orbit-btn voice" onclick="closeOrbit();switchTab('voice')">🎙️</div>
    <div class="orbit-btn transfer" onclick="closeOrbit();openDefaultBook()">📖</div>
  </div>
  <div class="tab-bar">

function chineseToArabic(str){var dm={'零':0,'一':1,'壹':1,'二':2,'贰':2,'两':2,'三':3,'叁':3,'四':4,'肆':4,'五':5,'伍':5,'六':6,'陆':6,'七':7,'柒':7,'八':8,'捌':8,'九':9,'玖':9};var um={'十':10,'拾':10,'百':100,'佰':100,'千':1000,'仟':1000,'万':10000,'亿':100000000};if(!str)return 0;var r=0,cur=0;for(var i=0;i<str.length;i++){var ch=str.charAt(i);if(dm[ch]!==undefined){cur=dm[ch]}else if(um[ch]!==undefined){var u=um[ch];if(u>=10000){r=(r+cur)*u;cur=0}else{r+=cur*u;cur=0}}}r+=cur;if(str==='十'||str==='拾')return 10;return r}
function extractChineseNumber(text){var dm={'零':0,'一':1,'壹':1,'二':2,'贰':2,'两':2,'三':3,'叁':3,'四':4,'肆':4,'五':5,'伍':5,'六':6,'陆':6,'七':7,'柒':7,'八':8,'捌':8,'九':9,'玖':9};var m=text.match(/([零一二三四五六七八九十百千万壹贰叁肆伍陆柒捌玖拾佰仟两]+)\s*[块元]钱?\s*([零一二三四五六七八九壹贰叁肆伍陆柒捌两])\s*([毛分角])/);if(m){var main=chineseToArabic(m[1]);var sub=dm[m[2]];if(sub!==undefined){var sv=(m[3]==='分')?sub*0.01:sub*0.1;return main+sv}}m=text.match(/([零一二三四五六七八九壹贰叁肆伍陆柒捌两])\s*([毛分角])/);if(m){var s=dm[m[1]];if(s!==undefined)return(m[2]==='分')?s*0.01:s*0.1}m=text.match(/([零一二三四五六七八九十百千万壹贰叁肆伍陆柒捌玖拾佰仟两]+)\s*[块元]钱?/);if(m)return chineseToArabic(m[1]);return 0}
function extractAmount(text){var c=text.replace(/[，。、；：！？\s]/g,'');var m=c.match(/(\d+(?:\.\d+)?)\s*[块元]钱?\s*(\d+(?:\.\d+)?)\s*([毛分角])/);if(m)return formatAmount(parseFloat(m[1])+subAmount(parseFloat(m[2]),m[3]));m=c.match(/(\d+)\s*[块元]钱?\s*(\d)(?![毛分角\d])/);if(m){var y=parseInt(m[1]),s=parseInt(m[2]);if(s>=0&&s<=9)return formatAmount(y+s*0.1)}var pats=[/(\d+\.\d+)\s*块钱?/,/(\d+\.\d+)\s*元/,/(\d+\.\d+)\s*[块元]/,/(\d+)\s*块钱?/,/(\d+)\s*元/,/(\d+)\s*块/,/(\d+)\s*毛/,/(\d+)\s*角/,/(\d+)\s*分/];for(var i=0;i<pats.length;i++){var mm=c.match(pats[i]);if(mm&&mm[1]){var num=parseFloat(mm[1]);if(num<=0)continue;var u=pats[i].toString().indexOf('毛')>=0||pats[i].toString().indexOf('角')>=0?0.1:(pats[i].toString().indexOf('分')>=0?0.01:1);return formatAmount(u===1?num:num*u)}}var cn=extractChineseNumber(c);if(cn>0)return formatAmount(cn);var nm=c.match(/(\d+\.?\d*)/);if(nm&&parseFloat(nm[1])>0)return formatAmount(parseFloat(nm[1]));return''}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function extractDate(text){var t=new Date();var rm={'今天':0,'今日':0,'昨天':-1,'昨日':-1,'前天':-2,'大前天':-3,'后天':2,'大后天':3};for(var k in rm){if(text.indexOf(k)>=0){var d=new Date(t);d.setDate(d.getDate()+rm[k]);return fmtDate(d)}}var wm=text.match(/(?:上?下?)周([一二三四五六七日天])/);if(wm){var wdm={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'日':0,'天':0};var td=wdm[wm[1]]||0;var cd=t.getDay();var diff=td-cd;if(text.indexOf('上周')>=0)diff-=7;else if(text.indexOf('下周')>=0)diff+=7;var d=new Date(t);d.setDate(d.getDate()+diff);return fmtDate(d)}var md=text.match(/(\d{1,2})月(\d{1,2})[号日]/);if(md){var d=new Date(t.getFullYear(),parseInt(md[1])-1,parseInt(md[2]));return fmtDate(d)}var fd=text.match(/(\d{4})[年\-\/](\d{1,2})[月\-\/](\d{1,2})[号日]?/);if(fd)return fd[1]+'-'+fd[2].padStart(2,'0')+'-'+fd[3].padStart(2,'0');return fmtDate(t)}

function matchCategory(text,cats,type){var dr=matchFromDict(text);if(dr)return dr;var list=cats[type]||[];var res={mainCategory:'其他',subCategory:''};for(var i=0;i<list.length;i++){var cat=list[i];var mn=cat.name||'';var al=cat.aliases||[];var subs=cat.subs||[];var parts=mn.split('|');for(var p=0;p<parts.length;p++){if(text.indexOf(parts[p])>=0)return{mainCategory:mn,subCategory:matchSubCategory(text,subs)}}for(var a=0;a<al.length;a++){if(text.indexOf(al[a])>=0)return{mainCategory:mn,subCategory:matchSubCategory(text,subs)}}var sr=matchSubCategory(text,subs);if(sr)return{mainCategory:mn,subCategory:sr}}return res}

function todayStr(){return fmtDate(new Date())}
function monthStr(d){var x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function catByName(type,name){var list=DB.categories[type]||[];for(var i=0;i<list.length;i++){if(list[i].name===name)return list[i]}return null}
function getBook(id){for(var i=0;i<DB.books.length;i++){if(DB.books[i].id===id)return DB.books[i]}return null}
function defaultBook(){return getBook(DB.defaultBookId)||DB.books[0]||null}
var AVA_COLORS=['#F43F5E','#F59E0B','#10B981','#3B82F6','#8B5CF6','#EC4899','#06B6D4','#EF4444'];
function avaColor(name){var h=0;for(var i=0;i<name.length;i++)h+=name.charCodeAt(i);return AVA_COLORS[h%AVA_COLORS.length]}

function bookStats(bid){var e=0,i=0;DB.records.forEach(function(r){if(r.bookId!==bid)return;if(r.type==='expense')e+=r.amount;else i+=r.amount});return{exp:e,inc:i,bal:i-e}}

card.innerHTML='<div class="card-inner"><div class="bc-header"><div class="bc-header-left"><span class="bc-name">'+b.name+'</span>'+badges+'</div>'+actions+'</div>'+amounts+footer+'</div>';

function openBookMenu(id){var b=getBook(id);var isDef=b.id===DB.defaultBookId;openSheet('账本管理','<div style="display:flex;flex-direction:column;gap:10px"><button class="btn-block gold" onclick="STATE.bookId=\''+id+'\';STATE.bookMonth=monthStr(new Date());closeSheet();openBook()">📖 打开账本</button><button class="btn-block ghost" onclick="setDefault(\''+id+'\');closeSheet()">'+(isDef?'已是默认账本':'⭐ 设为默认')+'</button><button class="btn-block ghost" onclick="renameBook(\''+id+'\')">✏️ 重命名</button><button class="btn-block ghost" onclick="manageMembers(\''+id+'\')">👥 管理成员</button>'+(isDef?'':'<button class="btn-block ghost" style="color:#F43F5E" onclick="deleteBook(\''+id+'\')">🗑 删除账本</button>')+'</div>')}
function openBookSheet(){openSheet('新建账本','<div class="field"><label>账本名称</label><input id="newBookName" placeholder="如：日常账本"></div><div class="field"><label>成员（逗号分隔）</label><input id="newBookMembers" placeholder="我,老婆" value="我"></div><button class="btn-block gold" onclick="createBook()">创建账本</button>');setTimeout(function(){document.getElementById('newBookName').focus()},100)}
function createBook(){var name=document.getElementById('newBookName').value.trim();if(!name){toast('请输入账本名称');return}var ms=document.getElementById('newBookMembers').value.split(/[,，]/).map(function(s){return s.trim()}).filter(Boolean);if(!ms.length)ms=['我'];var b={id:uid(),name:name,members:ms,createdAt:Date.now()};DB.books.push(b);if(!DB.defaultBookId)DB.defaultBookId=b.id;save();closeSheet();renderBooks();toast('账本已创建')}
function renameBook(id){var b=getBook(id);openSheet('重命名','<div class="field"><label>账本名称</label><input id="rnName" value="'+b.name+'"></div><button class="btn-block gold" onclick="doRename(\''+id+'\')">保存</button>');setTimeout(function(){document.getElementById('rnName').focus()},100)}
function doRename(id){var v=document.getElementById('rnName').value.trim();if(!v){toast('名称不能为空');return}getBook(id).name=v;save();closeSheet();renderBooks();toast('已重命名')}
function manageMembers(id){var b=getBook(id);openSheet('管理成员','<div class="field"><label>成员（逗号分隔）</label><input id="mbInput" value="'+b.members.join(',')+'"></div><button class="btn-block" onclick="doMembers(\''+id+'\')">保存</button>')}

function deleteBook(id){if(DB.books.length<=1){toast('至少保留一个账本');return}if(!confirm('删除该账本及其所有记录？'))return;DB.books=DB.books.filter(function(b){return b.id!==id});DB.records=DB.records.filter(function(r){return r.bookId!==id});if(DB.defaultBookId===id)DB.defaultBookId=DB.books[0].id;save();closeSheet();renderBooks();toast('已删除')}

/* ===================== 记一笔 ===================== */
function initAddRecord(){STATE.recType='expense';STATE.selCat=null;STATE.selSub='';STATE.editRecordId=null;document.getElementById('recDate').value=todayStr();document.getElementById('recAmount').value='';document.getElementById('recRemark').value='';switchRecType('expense')}
function switchRecType(type){STATE.recType=type;STATE.selCat=null;STATE.selSub='';var sw=document.getElementById('recSwitch');sw.classList.toggle('income-active',type==='income');document.getElementById('rtExp').className='slide-btn'+(type==='expense'?' active':'');document.getElementById('rtInc').className='slide-btn'+(type==='income'?' active':'');renderCatGrid();renderSubTags()}
function renderCatGrid(){var list=DB.categories[STATE.recType]||[];var box=document.getElementById('catGrid');box.innerHTML='';list.forEach(function(c){var it=document.createElement('div');it.className='category-item'+(STATE.selCat===c.name?' active-'+STATE.recType:'');it.innerHTML='<div class="category-icon-wrap"><span class="cat-icon">'+(c.icon||'💰')+'</span></div><span class="cat-name">'+c.name.split('|')[0]+'</span>';it.onclick=function(){STATE.selCat=c.name;STATE.selSub='';renderCatGrid();renderSubTags()};box.appendChild(it)})}
function renderSubTags(){var box=document.getElementById('subTags');var sec=document.getElementById('subSection');if(!STATE.selCat){sec.style.display='none';return}var c=catByName(STATE.recType,STATE.selCat);if(!c||!c.subs||!c.subs.length){sec.style.display='none';return}sec.style.display='block';box.innerHTML='';c.subs.forEach(function(s){var t=document.createElement('button');t.className='tag'+(STATE.selSub===s?' active-'+STATE.recType:'');t.textContent=s;t.onclick=function(){STATE.selSub=STATE.selSub===s?'':s;renderSubTags()};box.appendChild(t)})}
function saveRecord(){var amt=parseFloat(document.getElementById('recAmount').value);if(!amt||amt<=0){toast('请输入金额');return}if(!STATE.selCat){toast('请选择分类');return}var b=defaultBook();if(!b){toast('请先创建账本');return}var rec={id:STATE.editRecordId||uid(),bookId:b.id,type:STATE.recType,mainCategory:STATE.selCat,subCategory:STATE.selSub,remark:document.getElementById('recRemark').value.trim(),amount:amt,member:b.members[0]||'我',date:document.getElementById('recDate').value,createdAt:Date.now()};if(STATE.editRecordId){var idx=DB.records.findIndex(function(r){return r.id===STATE.editRecordId});if(idx>=0){rec.member=DB.records[idx].member;DB.records[idx]=rec}}else{DB.records.push(rec)}save();toast('已记一笔 ¥'+fmtMoney(amt));STATE.bookId=b.id;STATE.bookMonth=monthStr(rec.date);switchTab('book');renderBook()}

/* ===================== 账本详情 ===================== */
function bookRecordsFiltered(){var b=getBook(STATE.bookId);if(!b)return[];var kw=(document.getElementById('bookSearch').value||'').trim().toLowerCase();return DB.records.filter(function(r){if(r.bookId!==STATE.bookId)return false;if(STATE.bookMonth&&monthStr(r.date)!==STATE.bookMonth)return false;if(kw){var hay=(r.remark+r.mainCategory+r.subCategory+r.member).toLowerCase();if(hay.indexOf(kw)<0)return false}return true}).sort(function(a,b){return b.createdAt-a.createdAt})}
function shiftMonth(d){var p=STATE.bookMonth.split('-');var dt=new Date(p[0],parseInt(p[1])-1,1);dt.setMonth(dt.getMonth()+d);STATE.bookMonth=monthStr(dt);renderBook()}
function renderBook(){var b=getBook(STATE.bookId);if(!b){switchTab('index');return}setNav(b.name,true);document.getElementById('bookMonth').textContent=STATE.bookMonth.replace('-','年')+'月';var recs=bookRecordsFiltered();var e=0,i=0;recs.forEach(function(r){r.type==='expense'?e+=r.amount:i+=r.amount});document.getElementById('bookSummary').innerHTML='<div class="summary-row"><div class="summary-item"><span class="s-label">支出</span><span class="s-value expense">¥'+fmtMoney2(e)+'</span></div><div class="summary-item"><span class="s-label">收入</span><span class="s-value income">¥'+fmtMoney2(i)+'</span></div><div class="summary-item"><span class="s-label">结余</span><span class="s-value balance">¥'+fmtMoney2(i-e)+'</span></div></div>';document.getElementById('recCount').textContent='共'+recs.length+'条';renderBookRecords();renderBookStats()}
function renderBookRecords(){var recs=bookRecordsFiltered();var box=document.getElementById('bookRecords');box.innerHTML='';if(!recs.length){box.innerHTML='<div class="empty-tip"><span class="e-ico">📭</span>本月暂无记录</div>';return}recs.forEach(function(r){var c=catByName(r.type,r.mainCategory);var icon=c?c.icon:'💰';var it=document.createElement('div');it.className='record-card';it.innerHTML='<div class="record-left-bar bar-'+r.type+'"></div><div class="record-main"><div class="record-top-row"><div class="record-cat-info"><span class="cat-tag tag-'+r.type+'">'+icon+'</span><span class="main-cat">'+r.mainCategory.split('|')[0]+(r.subCategory?' · '+r.subCategory:'')+'</span></div><span class="record-amount amount-'+r.type+'">'+(r.type==='expense'?'-':'+')+'¥'+fmtMoney(r.amount)+'</span></div><div class="record-bottom-row"><span class="record-remark">'+(r.remark||'<span style="color:#CBD5E1">无备注</span>')+'</span><span class="record-date">'+r.member+' · '+r.date.slice(5)+'</span></div></div>';it.onclick=function(){editRecord(r.id)};box.appendChild(it)})}
function editRecord(id){var r=DB.records.find(function(x){return x.id===id});if(!r)return;openSheet('编辑记录','<div style="text-align:center;margin-bottom:12px"><span class="cat-tag-mini '+(r.type==='expense'?'exp':'inc')+'">'+(r.type==='expense'?'支出':'收入')+'</span></div><div class="field"><label>金额</label><input id="edAmt" type="number" value="'+r.amount+'"></div><div class="field"><label>分类</label><input value="'+r.mainCategory+(r.subCategory?' / '+r.subCategory:'')+'" disabled></div><div class="field"><label>备注</label><input id="edRemark" value="'+r.remark+'"></div><div class="field"><label>日期</label><input id="edDate" type="date" value="'+r.date+'"></div><div class="field"><label>记账人</label><input id="edMember" value="'+r.member+'"></div><div style="display:flex;gap:10px"><button class="btn-block ghost" style="color:#F43F5E" onclick="deleteRecord(\''+id+'\')">删除</button><button class="btn-block gold" onclick="doEditRecord(\''+id+'\')">保存</button></div>')}
function doEditRecord(id){var r=DB.records.find(function(x){return x.id===id});if(!r)return;var amt=parseFloat(document.getElementById('edAmt').value);if(!amt||amt<=0){toast('金额无效');return}r.amount=amt;r.remark=document.getElementById('edRemark').value.trim();r.date=document.getElementById('edDate').value;r.member=document.getElementById('edMember').value.trim()||r.member;save();closeSheet();STATE.bookMonth=monthStr(r.date);renderBook();toast('已更新')}

/* ===================== 统计 ===================== */
var PIE_COLORS=['#F43F5E','#F59E0B','#10B981','#3B82F6','#8B5CF6','#EC4899','#06B6D4','#EF4444','#14B8A6','#A855F7','#F97316','#84CC16','#6366F1','#EAB308'];
function recordsForStats(bid,month){return DB.records.filter(function(r){if(r.bookId!==bid)return false;if(month&&monthStr(r.date)!==month)return false;return true})}
function catStatList(recs,type){var map={};recs.forEach(function(r){if(r.type!==type)return;map[r.mainCategory]=(map[r.mainCategory]||0)+r.amount});return Object.keys(map).map(function(k){return{name:k,amount:map[k]}}).sort(function(a,b){return b.amount-a.amount})}
function memberStatList(recs,type){var map={};recs.forEach(function(r){if(r.type!==type)return;map[r.member]=(map[r.member]||0)+r.amount});return Object.keys(map).map(function(k){return{name:k,amount:map[k]}}).sort(function(a,b){return b.amount-a.amount})}
function drawPie(canvas,data,colors){var ctx=canvas.getContext('2d');var dpr=window.devicePixelRatio||1;var w=canvas.offsetWidth||240,h=canvas.offsetHeight||240;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);var cx=w/2,cy=h/2,R=Math.min(w,h)/2-6,r=R*0.58;var total=data.reduce(function(s,d){return s+d.amount},0);if(total<=0){ctx.fillStyle='#E5E7EB';ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();return}var a=-Math.PI/2;data.forEach(function(d,i){var ang=d.amount/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+ang);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();a+=ang});ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#94A3B8';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('共'+data.length+'项',cx,cy)}
function renderBookStats(){var recs=recordsForStats(STATE.bookId,STATE.bookMonth);var expList=catStatList(recs,'expense');var totalExp=expList.reduce(function(s,d){return s+d.amount},0);var html='';if(expList.length){html+='<div class="card chart-section"><span class="chart-title">支出分类占比</span><div class="chart-canvas-wrap"><canvas id="bkPie" style="width:200px;height:200px"></canvas></div><div class="chart-legend">'+expList.slice(0,9).map(function(d,i){return'<div class="legend-item"><span class="legend-color" style="background:'+PIE_COLORS[i%PIE_COLORS.length]+'"></span><span class="legend-text">'+d.name.split('|')[0]+' '+Math.round(d.amount/totalExp*100)+'%</span></div>'}).join('')+'</div></div>'}html+=renderMonthTrend(STATE.bookId);var memExp=memberStatList(recs,'expense');if(memExp.length){html+='<div class="member-stat-row">';memExp.slice(0,3).forEach(function(m){html+='<div class="member-stat-card"><div class="ms-avatar" style="background:'+avaColor(m.name)+'">'+m.name.charAt(0)+'</div><div class="ms-name">'+m.name+'</div><div class="ms-val">¥'+fmtMoney2(m.amount)+'</div></div>'});html+='</div>'}if(expList.length){html+='<div class="card stats-table"><span class="table-title">支出分类明细</span><div class="table-header"><span class="th-name">分类</span><span class="th-amount">金额</span><span class="th-count">笔数</span><span class="th-percent">占比</span></div>';var max=expList[0].amount;expList.forEach(function(d,i){var cnt=recs.filter(function(r){return r.type==='expense'&&r.mainCategory===d.name}).length;html+='<div class="table-row"><span class="td-name">'+d.name.split('|')[0]+'</span><span class="td-amount">¥'+fmtMoney(d.amount)+'</span><span class="td-count">'+cnt+'笔</span><span class="td-percent-wrap"><span class="td-bar" style="width:'+(d.amount/max*70)+'%"></span><span class="td-percent-text">'+(totalExp>0?(d.amount/totalExp*100).toFixed(1):0)+'%</span></span></div>'});html+='</div>'}document.getElementById('bookStatsPanel').innerHTML=html;if(expList.length){var c=document.getElementById('bkPie');if(c)drawPie(c,expList,PIE_COLORS)}}
function renderMonthTrend(bid){var now=new Date();var months=[];for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({ym:monthStr(d),label:(d.getMonth()+1)+'月'})}var data=months.map(function(m){var e=0;DB.records.forEach(function(r){if(r.bookId===bid&&monthStr(r.date)===m.ym&&r.type==='expense')e+=r.amount});return{label:m.label,amount:e}});var max=Math.max.apply(null,data.map(function(d){return d.amount}).concat([1]));var html='<div class="card chart-section"><span class="chart-title">近6个月支出趋势</span>';data.forEach(function(d){html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px"><span style="width:28px;color:#94A3B8">'+d.label+'</span><div style="flex:1;height:14px;border-radius:7px;background:#F1F5F9;overflow:hidden"><div style="height:100%;border-radius:7px;background:linear-gradient(90deg,#4F6BF6,#818CF8);width:'+(d.amount/max*100)+'%"></div></div><span style="width:56px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">¥'+fmtMoney(d.amount)+'</span></div>'});html+='</div>';return html}
function renderStats(){var b=defaultBook();if(!b){document.getElementById('statsContent').innerHTML='<div class="empty-tip"><span class="e-ico">📊</span>暂无账本</div>';return}var recs=recordsForStats(b.id,null);var e=0,i=0;recs.forEach(function(r){r.type==='expense'?e+=r.amount:i+=r.amount});var html='<div class="card stats-total"><div class="stats-total-row"><div class="stats-total-item"><span class="st-label">总支出</span><span class="st-value expense">¥'+fmtMoney2(e)+'</span></div><div class="stats-total-item"><span class="st-label">总收入</span><span class="st-value income">¥'+fmtMoney2(i)+'</span></div><div class="stats-total-item"><span class="st-label">结余</span><span class="st-value balance">¥'+fmtMoney2(i-e)+'</span></div></div></div>';var monthRecs=recordsForStats(b.id,monthStr(new Date()));var expList=catStatList(monthRecs,'expense');var totalExp=expList.reduce(function(s,d){return s+d.amount},0);if(expList.length){html+='<div class="card chart-section"><span class="chart-title">本月支出分类</span><div class="chart-canvas-wrap"><canvas id="stPie" style="width:220px;height:220px"></canvas></div><div class="chart-legend">'+expList.slice(0,9).map(function(d,i){return'<div class="legend-item"><span class="legend-color" style="background:'+PIE_COLORS[i%PIE_COLORS.length]+'"></span><span class="legend-text">'+d.name.split('|')[0]+' '+Math.round(d.amount/totalExp*100)+'%</span></div>'}).join('')+'</div></div>'}html+=renderMonthTrend(b.id);var memExp=memberStatList(recs,'expense');if(memExp.length){html+='<div class="member-stat-row">';memExp.slice(0,3).forEach(function(m){html+='<div class="member-stat-card"><div class="ms-avatar" style="background:'+avaColor(m.name)+'">'+m.name.charAt(0)+'</div><div class="ms-name">'+m.name+'</div><div class="ms-val">¥'+fmtMoney2(m.amount)+'</div></div>'});html+='</div>'}if(expList.length){html+='<div class="card stats-table"><span class="table-title">本月支出明细</span><div class="table-header"><span class="th-name">分类</span><span class="th-amount">金额</span><span class="th-count">笔数</span><span class="th-percent">占比</span></div>';var max=expList[0].amount;expList.forEach(function(d,i){var cnt=monthRecs.filter(function(r){return r.type==='expense'&&r.mainCategory===d.name}).length;html+='<div class="table-row"><span class="td-name">'+d.name.split('|')[0]+'</span><span class="td-amount">¥'+fmtMoney(d.amount)+'</span><span class="td-count">'+cnt+'笔</span><span class="td-percent-wrap"><span class="td-bar" style="width:'+(d.amount/max*70)+'%"></span><span class="td-percent-text">'+(totalExp>0?(d.amount/totalExp*100).toFixed(1):0)+'%</span></span></div>'});html+='</div>'}document.getElementById('statsContent').innerHTML=html;var c=document.getElementById('stPie');if(c)drawPie(c,expList,PIE_COLORS)}

/* ===================== 分类管理 ===================== */
function switchCatTab(type){STATE.catMgrTab=type;var sw=document.getElementById('catTabSwitch');sw.classList.toggle('income-active',type==='income');document.getElementById('ctTabExp').className='slide-btn'+(type==='expense'?' active':'');document.getElementById('ctTabInc').className='slide-btn'+(type==='income'?' active':'');renderCatMgr()}
function renderCatMgr(){var list=DB.categories[STATE.catMgrTab]||[];var box=document.getElementById('catMgrList');box.innerHTML='';var addBtn=document.createElement('div');addBtn.className='add-btn';addBtn.innerHTML='＋ 添加'+(STATE.catMgrTab==='expense'?'支出':'收入')+'分类';addBtn.onclick=openAddCatSheet;box.appendChild(addBtn);list.forEach(function(c,idx){var expanded=STATE.catExpanded[idx];var subs=c.subs.map(function(s){return'<div class="sub-item"><span class="sub-name">'+s+'</span><span class="delete-sub-btn" onclick="delSub('+idx+',\''+s.replace(/'/g,"\\'")+'\')">✕</span></div>'}).join('');var it=document.createElement('div');it.className='category-list-item';it.innerHTML='<div class="cat-header"><div class="cat-list-icon '+STATE.catMgrTab+'">'+(c.icon||'💰')+'</div><div class="cat-list-info"><span class="cat-name-text">'+c.name+'</span><span class="sub-count">'+c.subs.length+'个子分类'+(c.aliases.length?' · 别名:'+c.aliases.join(','):'')+'</span></div><div class="cat-actions"><div class="icon-btn delete" onclick="delCat('+idx+')">✕</div>'+(c.subs.length?'<div class="icon-btn expand'+(expanded?' expanded':'')+'" onclick="toggleSub('+idx+')">▼</div>':'')+'</div></div><div class="sub-list'+(expanded?' show':'')+'">'+subs+'<div class="add-sub-btn" onclick="addSub('+idx+')">＋ 添加子分类</div></div>';box.appendChild(it)})}
function toggleSub(idx){STATE.catExpanded[idx]=!STATE.catExpanded[idx];renderCatMgr()}
var EMOJI_POOL=['🍔','🚗','👗','🎮','💊','🏠','📱','💻','🍳','💄','🧻','👶','📚','🐶','🏃','🎁','💰','✨','✈️','🎬','☕','🛒','📦','💳','🎯','🐾','🚌','🚇','⛽','🔌','🏥','🎵','🏨','👕','👟','🎒','🧴','📊','💼','📈','🧧','↩️'];
function openAddCatSheet(){var ep=EMOJI_POOL.map(function(e){return'<span onclick="pickEmoji(this)" data-e="'+e+'">'+e+'</span>'}).join('');openSheet('添加分类','<div class="field"><label>分类名称</label><input id="acName" placeholder="如：宠物"></div><div class="field"><label>图标</label><div class="emoji-pick" id="acEmoji">'+ep+'</div></div><div class="field"><label>别名（逗号分隔，语音识别用）</label><input id="acAlias" placeholder="如：猫,狗"></div><button class="btn-block" onclick="addCat()">添加</button>');document.querySelector('#acEmoji span').classList.add('on')}
function pickEmoji(el){document.querySelectorAll('#acEmoji span').forEach(function(s){s.classList.remove('on')});el.classList.add('on')}
function addCat(){var name=document.getElementById('acName').value.trim();if(!name){toast('请输入名称');return}var ic=document.querySelector('#acEmoji span.on');var icon=ic?ic.dataset.e:'💰';var al=document.getElementById('acAlias').value.split(/[,，]/).map(function(s){return s.trim()}).filter(Boolean);DB.categories[STATE.catMgrTab].push({name:name,icon:icon,aliases:al,subs:[]});save();closeSheet();renderCatMgr();toast('分类已添加')}
function delCat(idx){if(!confirm('删除该分类？'))return;DB.categories[STATE.catMgrTab].splice(idx,1);save();renderCatMgr();toast('已删除')}
function addSub(idx){openSheet('添加子分类','<div class="field"><label>子分类名称</label><input id="asName" placeholder="如：猫粮"></div><button class="btn-block" onclick="doAddSub('+idx+')">添加</button>');setTimeout(function(){document.getElementById('asName').focus()},100)}
function doAddSub(idx){var v=document.getElementById('asName').value.trim();if(!v){toast('请输入名称');return}DB.categories[STATE.catMgrTab][idx].subs.push(v);save();STATE.catExpanded[idx]=true;closeSheet();renderCatMgr();toast('已添加')}
function delSub(idx,sub){var s=DB.categories[STATE.catMgrTab][idx].subs;var i=s.indexOf(sub);if(i>=0)s.splice(i,1);save();renderCatMgr();toast('已删除')}

/* ===================== 我的 ===================== */
function renderProfile(){var b=defaultBook();var cnt=DB.records.length;var days=Math.max(1,Math.ceil((Date.now()-Math.min.apply(null,DB.records.map(function(r){return r.createdAt}).concat([Date.now()])))/86400000));var html='<div class="card"><div class="profile-header"><div class="avatar">'+DB.user.avatar+'</div><div class="info"><div class="name">'+DB.user.nickname+'</div><div class="stat-row"><div class="stat-item"><span class="stat-label">记账</span><span class="stat-value">'+days+'天</span></div><div class="stat-divider"></div><div class="stat-item"><span class="stat-label">共</span><span class="stat-value">'+cnt+'笔</span></div></div></div><div class="profile-actions"><button class="action-capsule action-capsule-pink" onclick="editNick()">改昵称</button></div></div></div>';if(b){html+='<div class="default-book-bar"><span class="dbar-icon">📒</span><div class="dbar-info"><span class="dbar-label">默认账本</span><span class="dbar-name">'+b.name+'</span></div></div>'}html+='<div class="section-card"><div class="section-header">📚 我的账本</div><div class="menu-list"><div class="menu-item" onclick="switchTab(\'index\')"><div class="item-icon" style="background:#FEF3C7">📒</div><div class="item-text-wrap"><span class="item-text">账本管理</span><span class="item-sub">'+DB.books.length+'本账本</span></div><span class="item-arrow">›</span></div><div class="menu-item" onclick="exportData()"><div class="item-icon" style="background:#DBEAFE">📤</div><div class="item-text-wrap"><span class="item-text">导出数据</span><span class="item-sub">'+cnt+'条记录</span></div><span class="item-arrow">›</span></div><div class="menu-item" onclick="importData()"><div class="item-icon" style="background:#D1FAE5">📥</div><div class="item-text-wrap"><span class="item-text">导入数据</span></div><span class="item-arrow">›</span></div></div></div>';html+='<div class="section-card"><div class="section-header">⚙️ 其他</div><div class="menu-list"><div class="menu-item" onclick="toast(\'演示版本\')"><div class="item-icon" style="background:#FEE2E2">⭐</div><div class="item-text-wrap"><span class="item-text">给个好评</span></div><span class="item-arrow">›</span></div><div class="menu-item" onclick="resetData()"><div class="item-icon" style="background:#F3E8FF">🔄</div><div class="item-text-wrap"><span class="item-text">重置演示数据</span></div><span class="item-arrow">›</span></div></div></div>';html+='<div style="display:flex;gap:10px;margin:12px 0"><button class="source-btn" onclick="toast(\'源码在你本地项目文件夹\')">💻 源码</button><button class="email-btn" onclick="toast(\'演示版本\')">📧 反馈</button></div>';html+='<div style="text-align:center;color:#CBD5E1;font-size:11px;padding:0 0 10px">六六大顺记账 v1.0 · 演示版</div>';document.getElementById('profileContent').innerHTML=html}
function editNick(){openSheet('修改昵称','<div class="field"><label>昵称</label><input id="nickInput" value="'+DB.user.nickname+'"></div><button class="btn-block" onclick="saveNick()">保存</button>');setTimeout(function(){document.getElementById('nickInput').focus()},100)}
function saveNick(){var v=document.getElementById('nickInput').value.trim();if(!v){toast('昵称不能为空');return}DB.user.nickname=v;save();closeSheet();renderProfile();toast('已保存')}
function exportData(){var txt=JSON.stringify(DB,null,2);openSheet('导出数据','<div class="tip-banner"><span>📋</span><span>已生成 '+DB.records.length+' 条记录数据</span></div><textarea style="width:100%;height:180px;border:1px solid #E2E8F0;border-radius:12px;padding:12px;font-size:11px;font-family:monospace" readonly>'+txt+'</textarea><div style="height:12px"></div><button class="btn-block" onclick="copyExport()">复制到剪贴板</button>')}
function copyExport(){var ta=document.querySelector('#sheetBody textarea');ta.select();try{document.execCommand('copy');toast('已复制')}catch(e){toast('请手动复制')}}
function importData(){openSheet('导入数据','<div class="tip-banner"><span>⚠️</span><span>粘贴之前导出的JSON，将覆盖当前数据</span></div><div class="field"><textarea id="impInput" style="width:100%;height:140px;border:1px solid #E2E8F0;border-radius:12px;padding:12px;font-size:11px;font-family:monospace" placeholder="粘贴 JSON..."></textarea></div><button class="btn-block" onclick="doImport()">导入</button>')}
function doImport(){var v=document.getElementById('impInput').value.trim();if(!v){toast('请粘贴数据');return}try{var d=JSON.parse(v);if(!d.books||!d.records)throw 0;DB=d;save();closeSheet();switchTab('index');renderBooks();toast('导入成功')}catch(e){toast('数据格式错误')}}
function resetData(){if(!confirm('重置为初始演示数据？'))return;seedDemo();switchTab('index');renderBooks();renderProfile();toast('已重置')}

/* ===================== 语音记账 ===================== */
function renderVoice(){var r=document.getElementById('parseResult');if(r&&STATE._lastParse)showParseResult(STATE._lastParse)}
function toggleVoice(){var m=document.getElementById('voiceMic');var h=document.getElementById('voiceHint');if(m.classList.contains('rec')){m.classList.remove('rec');m.textContent='🎙️';h.textContent='点击麦克风开始（演示版用文字模拟语音）';document.getElementById('voiceText').focus()}else{m.classList.add('rec');m.textContent='🔴';h.textContent='正在聆听...（演示版请直接在下方输入要说的话）';setTimeout(function(){document.getElementById('voiceText').focus()},200)}}
function setVoiceEx(el){document.getElementById('voiceText').value=el.textContent;parseVoice()}
function parseVoice(){var text=document.getElementById('voiceText').value.trim();if(!text){toast('请输入或说出内容');return}var r=parseVoiceText(text,DB.categories);STATE._lastParse=r;showParseResult(r);document.getElementById('voiceMic').classList.remove('rec');document.getElementById('voiceMic').textContent='🎙️';document.getElementById('voiceHint').textContent='识别完成，确认无误后可保存'}
function showParseResult(r){var c=catByName(r.type,r.mainCategory);var icon=c?c.icon:'💰';var html='<div class="parse-result"><div style="text-align:center;margin-bottom:10px"><span class="cat-tag-mini '+(r.type==='expense'?'exp':'inc')+'">'+(r.type==='expense'?'支出':'收入')+'</span></div><div class="pr-row"><span class="k">💰 金额</span><span class="v" style="color:'+(r.type==='expense'?'var(--expense)':'var(--income)')+'">¥ '+(r.amount||0)+'</span></div><div class="pr-row"><span class="k">🗂 分类</span><span class="v">'+icon+' '+r.mainCategory.split('|')[0]+(r.subCategory?' / '+r.subCategory:'')+'</span></div><div class="pr-row"><span class="k">📅 日期</span><span class="v">'+r.date+'</span></div><div class="pr-row"><span class="k">📝 备注</span><span class="v">'+(r.remark||'(空)')+'</span></div></div><button class="save-btn" style="margin-top:12px" onclick="saveVoiceRecord()">保存这笔记录</button>';document.getElementById('parseResult').innerHTML=html}
function saveVoiceRecord(){var r=STATE._lastParse;if(!r){toast('请先识别');return}if(!r.amount){toast('未识别到金额');return}var b=defaultBook();if(!b){toast('请先创建账本');return}var rec={id:uid(),bookId:b.id,type:r.type,mainCategory:r.mainCategory,subCategory:r.subCategory,remark:r.remark,amount:parseFloat(r.amount),member:b.members[0]||'我',date:r.date,createdAt:Date.now()};DB.records.push(rec);save();toast('语音记账成功 ¥'+fmtMoney(r.amount));STATE.bookId=b.id;STATE.bookMonth=monthStr(r.date);switchTab('book');renderBook()}

/* ===================== 启动 ===================== */
function tickClock(){var d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function boot(){if(!load()||!DB.books.length){seedDemo()}if(!DB.categories)DB.categories=getDefaultCategories();tickClock();setInterval(tickClock,30000);renderBooks();renderProfile();if(!localStorage.getItem('lls_welcomed2')){setTimeout(welcomeSheet,400)}}
function welcomeSheet(){localStorage.setItem('lls_welcomed2','1');openSheet('欢迎使用','<div style="text-align:center;padding:6px 0 10px"><div style="font-size:46px">📒</div><div style="font-size:18px;font-weight:800;margin-top:8px">六六大顺记账</div><div style="color:#94A3B8;font-size:13px;margin-top:4px">一家人，一起记，清清楚楚</div></div><div class="tip-banner"><span>👋</span><span>可交互演示版：点中间黑色按钮记一笔、试试语音记账、查看统计图表。数据存在本地浏览器。</span></div><div class="field"><label>给自己起个昵称</label><input id="wlName" value="'+DB.user.nickname+'"></div><button class="btn-block gold" onclick="doWelcome()">开始体验</button>')}
function doWelcome(){var v=document.getElementById('wlName').value.trim();if(v)DB.user.nickname=v;save();closeSheet();renderProfile();toast('开始记账吧～')}
boot();
</script>
