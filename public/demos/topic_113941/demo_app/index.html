<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宠伴产品演示</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <div class="brand">
        <img src="./assets/yuwan-avatar.jpg" alt="鱼丸头像">
        <div>
          <strong>宠伴</strong>
          <span>鱼丸的健康记录</span>
        </div>
      </div>

      <div class="role-switch" aria-label="端切换">
        <button class="role-btn active" type="button" data-role="owner">主人端</button>
        <button class="role-btn" type="button" data-role="doctor">医生端</button>
      </div>

      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="workspace-label">主人端</p>
          <h1 id="page-title">鱼丸健康总览</h1>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-action="openGlobalSearch" aria-label="搜索">⌕</button>
          <button class="icon-btn" type="button" data-action="openNotifications" aria-label="通知">!</button>
          <button class="ghost-btn" type="button" data-action="resetDemo">重置演示</button>
          <button class="primary-btn" type="button" data-action="openGrant">授权机构</button>
        </div>
      </header>

      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer" aria-hidden="true">
    <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer-head">
        <div>
          <p class="eyebrow" id="drawer-kicker">操作</p>
          <h2 id="drawer-title">详情</h2>
        </div>
        <button class="icon-btn" type="button" data-action="closeDrawer" aria-label="关闭">×</button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
