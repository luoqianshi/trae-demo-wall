<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>银发租房管家 - 微信聊天演示</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --chat-bg: #1a1a1a;
            --user-bubble: #07C160;
            --other-bubble: #363636;
            --text-white: #fff;
            --text-gray: #999;
            --text-light: #ddd;
            --border-dark: #2a2a2a;
            --input-bg: #363636;
            --green: #07C160;
            --code-bg: #2d2d2d;
            --code-border: #444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', monospace, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            max-width: 100%;
            background: #000;
            border-radius: 30px;
            padding: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        .phone-screen {
            width: 100%;
            height: 667px;
            background: var(--bg-dark);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
            background: #000;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 100;
        }

        .phone-status-bar {
            height: 44px;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            z-index: 50;
            padding-top: 10px;
        }

        .status-time {
            font-size: 15px;
            font-weight: 500;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header {
            background: rgba(0,0,0,0.9);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 50;
        }

        .header .back-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            color: #fff;
        }

        .header .title {
            flex: 1;
            text-align: center;
        }

        .header .title h1 {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
        }

        .header .title span {
            font-size: 12px;
            color: var(--green);
            margin-left: 6px;
        }

        .header .more-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            color: #fff;
        }

        .chat-container {
            flex: 1;
            background: var(--chat-bg);
            padding: 15px;
            padding-bottom: 80px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #4A90D9, #67B26F);
        }

        .message.other .avatar {
            background: linear-gradient(135deg, #52C41A, #95DE64);
        }

        .message .avatar::after {
            content: '🏠';
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .message.user .avatar::after {
            content: '👴';
        }

        .message .content {
            max-width: 75%;
            margin: 0 8px;
            display: flex;
            flex-direction: column;
        }

        .message .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }

        .message.other .bubble {
            background: var(--other-bubble);
            color: var(--text-white);
            border-top-left-radius: 4px;
        }

        .message.user .bubble {
            background: var(--user-bubble);
            color: #fff;
            border-top-right-radius: 4px;
        }

        .message .time {
            font-size: 11px;
            color: var(--text-gray);
            margin-top: 4px;
            text-align: center;
        }

        .message.user .time {
            text-align: right;
        }

        .message.other .time {
            text-align: left;
        }

        .bubble h1, .bubble h2, .bubble h3 {
            margin: 8px 0;
            font-weight: 600;
            color: #fff;
        }

        .bubble h1 { font-size: 18px; }
        .bubble h2 { font-size: 16px; }
        .bubble h3 { font-size: 15px; }

        .bubble strong {
            font-weight: 600;
            color: #fff;
        }

        .bubble em {
            font-style: italic;
            color: #ddd;
        }

        .bubble s {
            text-decoration: line-through;
            color: #888;
        }

        .bubble code {
            background: #2d2d2d;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 13px;
            color: #569CD6;
        }

        .bubble blockquote {
            border-left: 3px solid var(--green);
            padding-left: 12px;
            margin: 8px 0;
            color: #ccc;
            background: rgba(7, 193, 96, 0.08);
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
        }

        .bubble ul, .bubble ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .bubble li {
            margin: 4px 0;
        }

        .bubble ul li::marker {
            color: var(--green);
        }

        .bubble table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 13px;
        }

        .bubble th, .bubble td {
            border: 1px solid #444;
            padding: 6px 8px;
            text-align: left;
        }

        .bubble th {
            background: #2d2d2d;
            font-weight: 600;
            color: #fff;
        }

        .bubble td {
            color: #ddd;
        }

        .bubble a {
            color: #4A90D9;
            text-decoration: none;
        }

        .bubble a:hover {
            text-decoration: underline;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .code-block .code-lang {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .code-block pre {
            white-space: pre-wrap;
            word-break: break-all;
            color: #ccc;
        }

        .code-block .keyword { color: #569CD6; }
        .code-block .string { color: #CE9178; }
        .code-block .comment { color: #6A9955; }
        .code-block .function { color: #DCDCAA; }
        .code-block .number { color: #B5CEA8; }
        .code-block .variable { color: #9CDCFE; }

        .voice-message {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(7, 193, 96, 0.15);
            border-radius: 8px;
            margin: 8px 0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .voice-message:hover {
            background: rgba(7, 193, 96, 0.25);
        }

        .voice-message .play-btn {
            width: 32px;
            height: 32px;
            background: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            flex-shrink: 0;
        }

        .voice-message .waveform {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 3px;
            height: 20px;
        }

        .voice-message .waveform span {
            width: 3px;
            background: var(--green);
            border-radius: 2px;
            animation: wave 1s infinite ease-in-out;
        }

        .voice-message .waveform span:nth-child(1) { height: 8px; animation-delay: 0s; }
        .voice-message .waveform span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
        .voice-message .waveform span:nth-child(3) { height: 20px; animation-delay: 0.2s; }
        .voice-message .waveform span:nth-child(4) { height: 16px; animation-delay: 0.3s; }
        .voice-message .waveform span:nth-child(5) { height: 10px; animation-delay: 0.4s; }
        .voice-message .waveform span:nth-child(6) { height: 18px; animation-delay: 0.5s; }
        .voice-message .waveform span:nth-child(7) { height: 12px; animation-delay: 0.6s; }
        .voice-message .waveform span:nth-child(8) { height: 20px; animation-delay: 0.7s; }
        .voice-message .waveform span:nth-child(9) { height: 14px; animation-delay: 0.8s; }
        .voice-message .waveform span:nth-child(10) { height: 8px; animation-delay: 0.9s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.5); }
        }

        .voice-message .duration {
            font-size: 12px;
            color: var(--green);
            flex-shrink: 0;
        }

        .image-message {
            margin: 8px 0;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            max-width: 100%;
        }

        .image-message img {
            width: 100%;
            height: auto;
            display: block;
        }

        .file-attachment {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-attachment:hover {
            background: #333;
            border-color: var(--green);
        }

        .file-attachment .file-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4A90D9, #67B26F);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .file-attachment .file-info {
            flex: 1;
            overflow: hidden;
        }

        .file-attachment .file-name {
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-attachment .file-size {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 2px;
        }

        .file-attachment .download-btn {
            width: 28px;
            height: 28px;
            background: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            flex-shrink: 0;
        }

        .bill-card {
            background: var(--other-bubble);
            border-radius: 12px;
            padding: 15px;
            margin-top: 8px;
            width: 100%;
            border: 1px solid #444;
        }

        .bill-card .title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px dashed #444;
            margin-bottom: 12px;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
        }

        .bill-row .label {
            color: var(--text-gray);
        }

        .bill-row .value {
            color: #fff;
            font-weight: 500;
        }

        .bill-row.total {
            border-top: 1px solid #444;
            margin-top: 8px;
            padding-top: 10px;
            font-size: 16px;
        }

        .bill-row.total .value {
            color: var(--green);
            font-weight: 700;
        }

        .bill-card .footer {
            text-align: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #444;
            font-size: 12px;
            color: var(--text-gray);
        }

        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            padding: 8px 10px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--border-dark);
        }

        .input-area .func-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            color: #fff;
            transition: background 0.2s;
        }

        .input-area .func-btn:hover {
            background: #333;
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            background: var(--input-bg);
            color: #fff;
            outline: none;
        }

        .input-area input::placeholder {
            color: var(--text-gray);
        }

        .input-area .send-btn {
            width: 40px;
            height: 40px;
            background: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-area .send-btn:hover {
            background: #06ad56;
            transform: scale(1.05);
        }

        .input-area .send-btn::after {
            content: '';
            width: 10px;
            height: 10px;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(-45deg);
            margin-left: 3px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #666;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .demo-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 240px;
            border: 1px solid #333;
        }

        .demo-panel h3 {
            font-size: 14px;
            color: #fff;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }

        .demo-btn {
            display: block;
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 6px;
            border: 1px solid var(--green);
            background: transparent;
            color: var(--green);
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .demo-btn:last-child {
            margin-bottom: 0;
        }

        .demo-btn:hover {
            background: var(--green);
            color: #fff;
        }

        .demo-btn.secondary {
            border-color: #666;
            color: #999;
        }

        .demo-btn.secondary:hover {
            background: #666;
            color: #fff;
        }

        @media (max-width: 768px) {
            .demo-panel {
                display: none;
            }
            
            body {
                padding: 0;
                background: #000;
            }
            
            .phone-frame {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 0;
            }
            
            .phone-screen {
                height: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>

            { room: '303', building: '1栋', month: '2024-03', rent: 2500, electricityUsage: 76, waterUsage: 4, total: 2585.60 }
        ];

        const FIELD_NAMES = {
            rent: '租金',
            deposit: '押金',
            electricityPrice: '电费单价',
            waterPrice: '水费单价',
            internetFee: '网费',
            managementFee: '管理费',
            rentDay: '收租日'
        };

        function getContract(room, contractRecords) {
            return contractRecords.find(c => c.room === room);
        }

        function getRentDate(contract) {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            
            let rentDate = new Date(year, month - 1, contract.rentDay);
            
            if (rentDate.getMonth() !== month - 1) {
                rentDate = new Date(year, month, 0);
            }
            
            return rentDate;
        }

        function formatMoney(amount) {
            return '¥' + amount.toFixed(2);
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
        }

        function parseRoomNumber(text) {
            const match = text.match(/(\d{3})/);
            return match ? match[1] : null;
        }

        function parseMonth(text) {
            const match = text.match(/(\d{1,2})月/);
            return match ? parseInt(match[1]) : null;
        }

        class ContractService {
            constructor(contractRecords) {
                this.contractRecords = contractRecords;
            }

            getContractByRoom(room) {
                return getContract(room, this.contractRecords);
            }

            getActiveContracts() {
                return this.contractRecords.filter(c => c.status === 'active');
            }

            getEmptyRooms() {
                return this.contractRecords.filter(c => c.status === 'ended');
            }

            getNearExpireContracts(days = 30) {
                const today = new Date();
                return this.contractRecords.filter(c => {
                    if (c.status !== 'active') return false;
                    const endDate = new Date(c.endDate);
                    const diffDays = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));
                    return diffDays >= 0 && diffDays <= days;
                });
            }

            getNearRentals(days = 7) {
                const today = new Date();
                const activeContracts = this.getActiveContracts();
                const nearRentals = [];

                activeContracts.forEach(c => {
                    const rentDate = getRentDate(c);
                    const diffDays = Math.ceil((rentDate - today) / (1000 * 60 * 60 * 24));
                    if (diffDays >= 0 && diffDays <= days) {
                        nearRentals.push({
                            contract: c,
                            rentDate: rentDate,
                            daysLeft: diffDays
                        });
                    }
                });

                return nearRentals;
            }

            modifyContract(room, field, value) {
                const contract = this.getContractByRoom(room);
                if (!contract || contract.status !== 'active') {
                    return null;
                }

                const oldValue = contract[field];
                contract[field] = value;
                return {
                    success: true,
                    contract: contract,
                    field: field,
                    oldValue: oldValue,
                    newValue: value,
                    fieldName: FIELD_NAMES[field] || field
                };
            }

            addContract(contractData) {
                const existing = this.getContractByRoom(contractData.room);
                if (existing && existing.status === 'active') {
                    return null;
                }

                const newContract = {
                    ...contractData,
                    startElectricity: 0,
                    startWater: 0,
                    lastElectricity: 0,
                    lastWater: 0,
                    status: 'active'
                };

                this.contractRecords.push(newContract);
                return {
                    success: true,
                    contract: newContract
                };
            }

            getContractInfo(room) {
                const contract = this.getContractByRoom(room);
                if (!contract) {
                    return null;
                }

                return {
                    room: contract.room,
                    building: contract.building,
                    rent: contract.rent,
                    deposit: contract.deposit,
                    startDate: contract.startDate,
                    endDate: contract.endDate,
                    rentDay: contract.rentDay,
                    electricityPrice: contract.electricityPrice,
                    waterPrice: contract.waterPrice,
                    internetFee: contract.internetFee,
                    managementFee: contract.managementFee,
                    status: contract.status === 'active' ? '在租' : '已结束'
                };
            }

            parseModifyField(text) {
                let field = null;
                let value = null;

                if (text.includes('租金')) {
                    const numMatch = text.match(/租金[\u4e00-\u9fa5]*(\d+)/);
                    if (numMatch) {
                        field = 'rent';
                        value = parseInt(numMatch[1]);
                    }
                } else if (text.includes('押金')) {
                    const numMatch = text.match(/押金[\u4e00-\u9fa5]*(\d+)/);
                    if (numMatch) {
                        field = 'deposit';
                        value = parseInt(numMatch[1]);
                    }
                } else if (text.includes('电费')) {
                    const numMatch = text.match(/电费[\u4e00-\u9fa5]*(\d+\.?\d*)/);
                    if (numMatch) {
                        field = 'electricityPrice';
                        value = parseFloat(numMatch[1]);
                    }
                } else if (text.includes('水费')) {
                    const numMatch = text.match(/水费[\u4e00-\u9fa5]*(\d+\.?\d*)/);
                    if (numMatch) {
                        field = 'waterPrice';
                        value = parseFloat(numMatch[1]);
                    }
                } else if (text.includes('网费')) {
                    const numMatch = text.match(/网费[\u4e00-\u9fa5]*(\d+)/);
                    if (numMatch) {
                        field = 'internetFee';
                        value = parseInt(numMatch[1]);
                    }
                } else if (text.includes('管理费')) {
                    const numMatch = text.match(/管理费[\u4e00-\u9fa5]*(\d+)/);
                    if (numMatch) {
                        field = 'managementFee';
                        value = parseInt(numMatch[1]);
                    }
                } else if (text.includes('收租日')) {
                    const numMatch = text.match(/收租日[\u4e00-\u9fa5]*(\d+)/);
                    if (numMatch) {
                        field = 'rentDay';
                        value = parseInt(numMatch[1]);
                    }
                }

                return { field, value };
            }
        }

        class RentService {
            constructor(contractRecords, rentHistory) {
                this.contractRecords = contractRecords;
                this.rentHistory = rentHistory;
            }

            calculateElectricity(contract, currentReading) {
                const usage = currentReading - contract.lastElectricity;
                const fee = usage * contract.electricityPrice;
                return { usage, fee };
            }

            calculateWater(contract, currentReading) {
                const usage = currentReading - contract.lastWater;
                const fee = usage * contract.waterPrice;
                return { usage, fee };
            }

            calculateRentTotal(contract, electricityFee, waterFee) {
                return contract.rent + electricityFee + waterFee + contract.internetFee + contract.managementFee;
            }

            calculateCheckoutRefund(contract, electricityFee, waterFee, cleaningFee = 100, otherFee = 0) {
                const totalDeduct = electricityFee + waterFee + cleaningFee + otherFee;
                return contract.deposit - totalDeduct;
            }

            getRentHistory(month = null) {
                if (month === null) {
                    return [...this.rentHistory].reverse();
                }
                const now = new Date();
                const targetYear = now.getFullYear();
                const targetMonth = month;
                const monthStr = `${targetYear}-${targetMonth.toString().padStart(2, '0')}`;

                return this.rentHistory.filter(r => r.month === monthStr);
            }

            generateBill(contract, context, type) {
                return generateBillCard(contract, context, type);
            }

            addRentRecord(room, building, month, rent, electricityUsage, waterUsage, total) {
                this.rentHistory.push({
                    room,
                    building,
                    month,
                    rent,
                    electricityUsage,
                    waterUsage,
                    total
                });
            }
        }

        class App {
            constructor() {
                this.contractService = new ContractService(contractRecords);
                this.rentService = new RentService(contractRecords, rentHistory);
                this.chatView = new ChatView();
                this.currentContext = null;
                
                this.init();
            }

            init() {
                document.getElementById('userInput').addEventListener('keypress', (e) => this.handleKeyPress(e));
                document.getElementById('sendBtn').addEventListener('click', () => this.sendUserMessage());
            }

            handleKeyPress(e) {
                if (e.key === 'Enter') {
                    this.sendUserMessage();
                }
            }

            sendUserMessage() {
                const text = this.chatView.getInputValue();
                if (text) {
                    this.chatView.addMessage('user', text);
                    this.chatView.clearInput();
                    
                    setTimeout(() => {
                        this.processMessage(text);
                    }, 800);
                }
            }

            sendMessage(text) {
                this.chatView.addMessage('user', text);
                
                setTimeout(() => {
                    this.processMessage(text);
                }, 800);
            }

            processMessage(text) {
                const lowerText = text.toLowerCase();
                
                if (lowerText.includes('格式') || lowerText.includes('展示')) {
                    this.chatView.showFormatDemo();
                    return;
                }

                if (lowerText.includes('重新生成账单')) {
                    if (this.currentContext && (this.currentContext.type === 'rent' || this.currentContext.type === 'checkout')) {
                        this.currentContext.step = 'awaitElectricity';
                        const contract = this.contractService.getContractByRoom(this.currentContext.room);
                        this.chatView.addMessage('other', `好的，重新生成账单。请重新告诉我 ${contract.building}${this.currentContext.room}房 本月电表度数是多少？当前上月度数是 ${contract.lastElectricity} 度。`);
                    } else {
                        this.chatView.addMessage('other', '请先选择要收租的房间，例如："收303房房租"');
                    }
                    return;
                }

                if (lowerText.includes('历史收租') || lowerText.includes('收租记录')) {
                    this.chatView.addTyping();
                    setTimeout(() => {
                        this.chatView.removeTyping();
                        const month = parseMonth(text);
                        const records = this.rentService.getRentHistory(month);
                        
                        const targetMonth = month || (new Date().getMonth() + 1);
                        let reply = month ? `<strong>📜 ${targetMonth}月收租记录：</strong><br><br>` : '<strong>📜 历史收租记录：</strong><br><br>';
                        if (records.length === 0) {

                if (lowerText.includes('待收租') || lowerText.includes('抄表') || (lowerText.includes('待') && !lowerText.includes('合同'))) {
                    this.chatView.addTyping();
                    setTimeout(() => {

                }

                if (lowerText.includes('快到期合同') || lowerText.includes('合同快到期')) {
                    this.chatView.addTyping();
                    setTimeout(() => {
                        this.chatView.removeTyping();
                        const nearExpire = this.contractService.getNearExpireContracts(30);
                        
                        let reply = '<strong>📅 快到期合同：</strong><br><br>';
                        if (nearExpire.length === 0) {
                            reply = '暂无快到期的合同。';
                        } else {
                            reply += '<table><thead><tr><th>房间号</th><th>到期日期</th><th>租金</th></tr></thead><tbody>';
                            nearExpire.forEach(c => {
                                const endDate = new Date(c.endDate);
                                const dateStr = `${endDate.getMonth() + 1}月${endDate.getDate()}日`;
                                reply += `<tr><td>${c.building}${c.room}房</td><td>${dateStr}</td><td>¥${c.rent}</td></tr>`;
                            });
                            reply += '</tbody></table>';
                        }
                        this.chatView.addMessage('other', reply);
                    }, 1000);
                    return;
                }

                if (lowerText.includes('查看') && lowerText.includes('合同')) {
                    const room = parseRoomNumber(text);
                    if (room) {
                        const info = this.contractService.getContractInfo(room);
                        if (info) {
                            this.chatView.addMessage('other', `<strong>📋 ${info.building}${info.room}房合同信息：</strong><br><br>📅 租期：${info.startDate} 至 ${info.endDate}<br>💰 租金：¥${info.rent}/月<br>📦 押金：¥${info.deposit}<br>💡 电费：¥${info.electricityPrice}/度<br>💧 水费：¥${info.waterPrice}/吨<br>🌐 网费：¥${info.internetFee}/月<br>🏢 管理费：¥${info.managementFee}/月<br>📅 收租日：每月${info.rentDay}日<br>📊 合同状态：${info.status}`);
                        } else {
                            this.chatView.addMessage('other', `未找到 ${room} 房间的合同信息。`);
                        }
                    } else {
                        this.chatView.addMessage('other', '请告诉我房间号，例如："查看303房合同"');
                    }
                    return;
                }

                if (lowerText.includes('修改') && lowerText.includes('合同')) {
                    const room = parseRoomNumber(text);
                    if (room) {
                        const contract = this.contractService.getContractByRoom(room);
                        if (contract && contract.status === 'active') {
                            this.currentContext = { type: 'modifyContract', room: room, step: 'awaitField' };
                            this.chatView.addMessage('other', `好的，要修改 ${contract.building}${room}房的合同。请告诉我要修改哪个字段？<br><br>可修改字段：租金、押金、电费单价、水费单价、网费、管理费、收租日`);
                        } else {
                            this.chatView.addMessage('other', `未找到 ${room} 房间的有效合同。`);
                        }
                    } else {
                        this.chatView.addMessage('other', '请告诉我房间号，例如："修改303房合同"');
                    }
                    return;
                }

                if (lowerText.includes('修改') && lowerText.includes('房')) {
                    const room = parseRoomNumber(text);
                    if (room) {
                        const contract = this.contractService.getContractByRoom(room);
                        if (contract && contract.status === 'active') {
                            const { field, value } = this.contractService.parseModifyField(text);
                            
                            if (field && value !== null) {
                                const result = this.contractService.modifyContract(room, field, value);
                                if (result) {
                                    this.chatView.addMessage('other', `✅ 已修改 ${contract.building}${room}房合同：<br><br>${result.fieldName} 从 ${result.oldValue} 修改为 ${result.newValue}`);
                                }
                            } else {
                                this.currentContext = { type: 'modifyContract', room: room, step: 'awaitField' };
                                this.chatView.addMessage('other', `好的，要修改 ${contract.building}${room}房的合同。请告诉我要修改哪个字段？`);
                            }
                        } else {
                            this.chatView.addMessage('other', `未找到 ${room} 房间的有效合同。`);
                        }
                    } else {
                        this.chatView.addMessage('other', '请告诉我房间号，例如："修改303房租金为1800"');
                    }
                    return;
                }

                if (lowerText.includes('新增合同')) {
                    const room = parseRoomNumber(text);
                    if (room) {
                        const existing = this.contractService.getContractByRoom(room);
                        if (!existing || existing.status === 'ended') {
                            this.currentContext = { 
                                type: 'newContract', 
                                room: room, 
                                step: 'awaitBuilding',
                                data: { room: room }
                            };
                            this.chatView.addMessage('other', `好的，新增 ${room}房合同。请告诉我楼栋号？`);
                        } else {
                            this.chatView.addMessage('other', `${room}房已有有效合同，无法新增。`);
                        }
                    } else {
                        this.chatView.addMessage('other', '请告诉我房间号，例如："新增合同303房"');
                    }
                    return;
                }

                if (this.currentContext && this.currentContext.type === 'modifyContract' && this.currentContext.step === 'awaitField') {
                    const { field, value } = this.contractService.parseModifyField(text);
                    
                    if (field && value !== null) {
                        const result = this.contractService.modifyContract(this.currentContext.room, field, value);
                        if (result) {
                            this.chatView.addMessage('other', `✅ 已修改 ${result.contract.building}${this.currentContext.room}房合同：<br><br>${result.fieldName} 从 ${result.oldValue} 修改为 ${result.newValue}`);
                            this.currentContext = null;
                        }
                    } else {
                        this.chatView.addMessage('other', '请明确告诉我要修改的字段和数值，例如："租金为1800"');
                    }
                    return;
                }

                if (this.currentContext && this.currentContext.type === 'newContract') {
                    this.handleNewContractFlow(text);
                    return;
                }

                if (this.currentContext && this.currentContext.step === 'awaitElectricity') {
                    const num = parseInt(text);
                    if (!isNaN(num)) {
                        const contract = this.contractService.getContractByRoom(this.currentContext.room);
                        const { usage: electricityUsage, fee: electricityFee } = this.rentService.calculateElectricity(contract, num);
                        
                        this.currentContext.electricity = num;
                        this.currentContext.electricityFee = electricityFee;
                        this.currentContext.step = 'awaitWater';
                        
                        this.chatView.addMessage('other', `本月电表 <strong>${num}</strong> 度，用了 <strong>${electricityUsage}</strong> 度，电费 <strong>¥${electricityFee.toFixed(2)}</strong>。\n\n请问本月水表吨数是多少？当前上月吨数是 ${contract.lastWater} 吨。`);
                    } else {
                        this.chatView.addMessage('other', '请输入数字，例如：1356');
                    }
                    return;
                }

                if (this.currentContext && this.currentContext.step === 'awaitWater') {
                    const num = parseInt(text);
                    if (!isNaN(num)) {
                        const contract = this.contractService.getContractByRoom(this.currentContext.room);
                        const { usage: waterUsage, fee: waterFee } = this.rentService.calculateWater(contract, num);
                        
                        this.currentContext.water = num;
                        this.currentContext.waterFee = waterFee;
                        
                        if (this.currentContext.type === 'checkout') {
                            this.currentContext.step = 'awaitCleaningFee';
                            this.chatView.addMessage('other', `本月水表 <strong>${num}</strong> 吨，用了 <strong>${waterUsage}</strong> 吨，水费 <strong>¥${waterFee.toFixed(2)}</strong>。\n\n请问卫生费是多少？（默认100元）`);
                        } else {
                            this.currentContext.step = 'awaitConfirm';
                            const total = this.rentService.calculateRentTotal(contract, this.currentContext.electricityFee, waterFee);
                            this.chatView.addMessage('other', `<strong>📌 本月账单：</strong><br><br>${contract.building}${this.currentContext.room}房<br>💰 租金：¥${contract.rent}<br>⚡ 电费：¥${this.currentContext.electricityFee.toFixed(2)}<br>💧 水费：¥${waterFee.toFixed(2)}<br>🌐 网费：¥${contract.internetFee}<br>🏢 管理费：¥${contract.managementFee}<br><br><strong>📊 合计：¥${total.toFixed(2)}</strong><br><br>确认生成账单吗？`);
                        }
                    } else {
                        this.chatView.addMessage('other', '请输入数字，例如：98');
                    }
                    return;
                }

                if (this.currentContext && this.currentContext.step === 'awaitCleaningFee') {
                    const num = parseInt(text);
                    if (!isNaN(num)) {
                        this.currentContext.cleaningFee = num;
                    } else {
                        this.currentContext.cleaningFee = 100;
                    }
                    this.currentContext.step = 'awaitOtherFee';
                    this.chatView.addMessage('other', `卫生费：¥${this.currentContext.cleaningFee}。\n\n请问还有其它费用吗？（没有请回答"无"）`);
                    return;
                }

                if (this.currentContext && this.currentContext.step === 'awaitOtherFee') {
                    const num = parseInt(text);
                    if (!isNaN(num)) {
                        this.currentContext.otherFee = num;
                    } else {
                        this.currentContext.otherFee = 0;
                    }
                    this.currentContext.step = 'awaitConfirm';
                    
                    const contract = this.contractService.getContractByRoom(this.currentContext.room);
                    const refund = this.rentService.calculateCheckoutRefund(
                        contract, 
                        this.currentContext.electricityFee, 
                        this.currentContext.waterFee, 
                        this.currentContext.cleaningFee,
                        this.currentContext.otherFee
                    );
                    
                    let reply = `<strong>📌 退租结算：</strong><br><br>${contract.building}${this.currentContext.room}房<br>📦 押金：¥${contract.deposit}<br>⚡ 电费：¥${this.currentContext.electricityFee.toFixed(2)}<br>💧 水费：¥${this.currentContext.waterFee.toFixed(2)}<br>🧹 卫生费：¥${this.currentContext.cleaningFee}`;
                    if (this.currentContext.otherFee > 0) {
                        reply += `<br>📝 其它费用：¥${this.currentContext.otherFee}`;
                    }
                    reply += `<br><br><strong>📊 应退金额：¥${refund.toFixed(2)}</strong><br><br>确认结算吗？`;
                    this.chatView.addMessage('other', reply);
                    return;
                }

                if (this.currentContext && this.currentContext.step === 'awaitConfirm' && this.currentContext.type !== 'newContract') {
                    if (lowerText.includes('确认') || lowerText.includes('是') || lowerText.includes('好')) {
                        this.generateBill();
                    } else if (lowerText.includes('重新') || lowerText.includes('不')) {
                        this.currentContext.step = 'awaitElectricity';
                        const contract = this.contractService.getContractByRoom(this.currentContext.room);
                        this.chatView.addMessage('other', `好的，请重新告诉我 ${contract.building}${this.currentContext.room}房 本月电表度数。`);
                    } else {
                        this.chatView.addMessage('other', '请回答"确认"或"重新"。');
                    }
                    return;
                }

                if (lowerText.includes('帮助') || lowerText.includes('怎么用')) {
                    this.chatView.addMessage('other', '<strong>📖 您可以这样说：</strong><br><br>💰 "收303房房租" - 生成收租账单<br>🏠 "303房退租" - 办理退租结算<br>📋 "查空闲房间" - 查看空闲房源<br>📅 "查待收租" - 查看近期收租计划<br>📜 "查历史收租" - 查看收租记录<br>📅 "查快到期合同" - 查看即将到期的合同<br>📋 "查看303房合同" - 查看合同详情<br>✏️ "修改303房合同" - 修改合同信息<br>➕ "新增合同303房" - 新增合同<br>🎨 "格式展示" - 查看支持的输出格式');
                    return;
                }

                this.chatView.addTyping();
                setTimeout(() => {
                    this.chatView.removeTyping();
                    this.chatView.addMessage('other', '抱歉，我没有理解您的意思。<br><br>您可以说："收房租"、"退租"、"查空闲"、"查待收租"、"查历史收租"、"查快到期合同"、"查看合同"、"修改合同"、"新增合同"或"帮助"');
                }, 800);
            }

            handleNewContractFlow(text) {
                const ctx = this.currentContext;
                
                if (ctx.step === 'awaitBuilding') {
                    const buildingMatch = text.match(/(\d+)栋/);
                    if (buildingMatch) {
                        ctx.data.building = `${buildingMatch[1]}栋`;
                        ctx.step = 'awaitRent';
                        this.chatView.addMessage('other', `楼栋：${ctx.data.building}。请告诉我租金金额？`);
                    } else {
                        this.chatView.addMessage('other', '请告诉我楼栋号，例如："1栋"');
                    }
                } else if (ctx.step === 'awaitRent') {
                    const num = parseInt(text);
                    if (!isNaN(num)) {
                        ctx.data.rent = num;
                        ctx.step = 'awaitDeposit';
                        this.chatView.addMessage('other', `租金：¥${num}/月。请告诉我押金金额？`);
                    } else {
                        this.chatView.addMessage('other', '请输入数字，例如：2000');
                    }
                } else if (ctx.step === 'awaitDeposit') {
                    const num = parseInt(text);
                    if (!isNaN(num)) {
                        ctx.data.deposit = num;
                        ctx.step = 'awaitStartDate';
                        this.chatView.addMessage('other', `押金：¥${num}。请告诉我合同开始日期？（格式：YYYY-MM-DD）`);
                    } else {
                        this.chatView.addMessage('other', '请输入数字，例如：4000');
                    }
                } else if (ctx.step === 'awaitStartDate') {
                    if (text.match(/\d{4}-\d{2}-\d{2}/)) {
                        ctx.data.startDate = text;
                        const day = parseInt(text.split('-')[2]);
                        ctx.data.rentDay = day;
                        ctx.step = 'awaitEndDate';
                        this.chatView.addMessage('other', `开始日期：${text}（收租日：每月${day}日）。请告诉我合同结束日期？（格式：YYYY-MM-DD）`);
                    } else {
                        this.chatView.addMessage('other', '请输入日期格式：YYYY-MM-DD，例如：2024-07-01');
                    }
                } else if (ctx.step === 'awaitEndDate') {
                    if (text.match(/\d{4}-\d{2}-\d{2}/)) {
                        ctx.data.endDate = text;
                        ctx.step = 'awaitElectricityPrice';
                        this.chatView.addMessage('other', `结束日期：${text}。请告诉我电费单价？`);
                    } else {
                        this.chatView.addMessage('other', '请输入日期格式：YYYY-MM-DD，例如：2025-06-30');
                    }
                } else if (ctx.step === 'awaitElectricityPrice') {
                    const num = parseFloat(text);
                    if (!isNaN(num)) {
                        ctx.data.electricityPrice = num;
                        ctx.step = 'awaitWaterPrice';
                        this.chatView.addMessage('other', `电费单价：¥${num}/度。请告诉我水费单价？`);
                    } else {
                        this.chatView.addMessage('other', '请输入数字，例如：0.6');
                    }
                } else if (ctx.step === 'awaitWaterPrice') {
                    const num = parseFloat(text);
                    if (!isNaN(num)) {
                        ctx.data.waterPrice = num;
                        ctx.step = 'awaitInternetFee';
                        this.chatView.addMessage('other', `水费单价：¥${num}/吨。请告诉我网费？`);
                    } else {
                        this.chatView.addMessage('other', '请输入数字，例如：3.5');
                    }
                } else if (ctx.step === 'awaitInternetFee') {
                    const num = parseInt(text);
                    if (!isNaN(num)) {
                        ctx.data.internetFee = num;
                        ctx.step = 'awaitManagementFee';
                        this.chatView.addMessage('other', `网费：¥${num}/月。请告诉我管理费？`);
                    } else {
                        this.chatView.addMessage('other', '请输入数字，例如：100');
                    }
                } else if (ctx.step === 'awaitManagementFee') {
                    const num = parseInt(text);
                    if (!isNaN(num)) {
                        ctx.data.managementFee = num;
                        ctx.step = 'awaitConfirm';
                        const d = ctx.data;
                        this.chatView.addMessage('other', `<strong>📋 合同信息确认：</strong><br><br>${d.building}${d.room}房<br>💰 租金：¥${d.rent}/月<br>📦 押金：¥${d.deposit}<br>📅 租期：${d.startDate} 至 ${d.endDate}<br>💡 电费：¥${d.electricityPrice}/度<br>💧 水费：¥${d.waterPrice}/吨<br>🌐 网费：¥${d.internetFee}/月<br>🏢 管理费：¥${d.managementFee}/月<br><br>确认保存合同吗？`);
                    } else {
                        this.chatView.addMessage('other', '请输入数字，例如：50');
                    }
                } else if (ctx.step === 'awaitConfirm') {
                    const lowerText = text.toLowerCase();
                    if (lowerText.includes('确认') || lowerText.includes('是') || lowerText.includes('好')) {
                        const result = this.contractService.addContract(ctx.data);
                        if (result) {
                            this.chatView.addMessage('other', `✅ 已成功新增 ${result.contract.building}${result.contract.room}房合同！`);
                        }
                        this.currentContext = null;
                    } else if (lowerText.includes('取消') || lowerText.includes('不')) {
                        this.chatView.addMessage('other', '已取消新增合同。');
                        this.currentContext = null;
                    } else {
                        this.chatView.addMessage('other', '请回答"确认"或"取消"。');
                    }
                }
            }

            generateBill() {
                const contract = this.contractService.getContractByRoom(this.currentContext.room);
                
                if (this.currentContext.type === 'rent') {
                    setTimeout(() => {
                        this.chatView.addMessage('other', '<div class="image-message"><img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=rent%20receipt%20document%20template%20with%20room%20number%20and%20amount&image_size=square"></div>');
                    }, 1500);
                } else {
                    const refund = this.rentService.calculateCheckoutRefund(
                        contract, 
                        this.currentContext.electricityFee, 
                        this.currentContext.waterFee, 
                        this.currentContext.cleaningFee,
                        this.currentContext.otherFee
                    );
                    setTimeout(() => {
                        this.chatView.addMessage('other', `✅ 已完成退租结算！<br><br>应退押金：¥${refund.toFixed(2)}<br>房间已标记为空<br>合同已结束`);
                    }, 1500);
                }
                
                this.currentContext = null;
            }
        }

        function initApp() {
            window.app = new App();
            
            window.startDemo = function(type) {
                const app = window.app;
                app.chatView.clearChat();
                
                if (type === 'rent') {
                    setTimeout(() => app.sendMessage('收303房房租'), 600);
                    setTimeout(() => app.sendMessage('1356'), 3000);
                    setTimeout(() => app.sendMessage('98'), 5000);
                    setTimeout(() => app.sendMessage('确认'), 7500);
                } else if (type === 'checkout') {
                    setTimeout(() => app.sendMessage('303房退租'), 600);
                    setTimeout(() => app.sendMessage('1356'), 3000);
                    setTimeout(() => app.sendMessage('98'), 5000);
                    setTimeout(() => app.sendMessage('100'), 7000);
                    setTimeout(() => app.sendMessage('无'), 8500);
                    setTimeout(() => app.sendMessage('确认'), 10000);
                } else if (type === 'query') {
                    setTimeout(() => app.sendMessage('查空闲房间'), 600);
                    setTimeout(() => app.sendMessage('查待收租'), 2500);
                } else if (type === 'history') {
                    setTimeout(() => app.sendMessage('查历史收租'), 600);
                    setTimeout(() => app.sendMessage('查5月收租记录'), 2500);
                } else if (type === 'expire') {
                    setTimeout(() => app.sendMessage('查快到期合同'), 600);
                } else if (type === 'contract') {
                    setTimeout(() => app.sendMessage('查看303房合同'), 600);
                    setTimeout(() => app.sendMessage('修改303房租金为2600'), 3000);
                    setTimeout(() => app.sendMessage('新增合同101房'), 5000);
                    setTimeout(() => app.sendMessage('1栋'), 6000);
                    setTimeout(() => app.sendMessage('1800'), 7000);
                    setTimeout(() => app.sendMessage('3600'), 8000);
                    setTimeout(() => app.sendMessage('2026-07-05'), 9000);
                    setTimeout(() => app.sendMessage('2027-07-04'), 10000);
                    setTimeout(() => app.sendMessage('0.6'), 11000);
                    setTimeout(() => app.sendMessage('3.5'), 12000);
                    setTimeout(() => app.sendMessage('100'), 13000);
                    setTimeout(() => app.sendMessage('50'), 14000);
                    setTimeout(() => app.sendMessage('确认'), 15000);
                } else if (type === 'newContract') {
                    setTimeout(() => app.sendMessage('新增合同101房'), 400);
                    setTimeout(() => app.sendMessage('1栋'), 1200);
                    setTimeout(() => app.sendMessage('1800'), 2000);
                    setTimeout(() => app.sendMessage('3600'), 2800);
                    setTimeout(() => app.sendMessage('2026-07-05'), 3600);
                    setTimeout(() => app.sendMessage('2027-07-04'), 4400);
                    setTimeout(() => app.sendMessage('0.6'), 5200);
                    setTimeout(() => app.sendMessage('3.5'), 6000);
                    setTimeout(() => app.sendMessage('100'), 6800);
                    setTimeout(() => app.sendMessage('50'), 7600);
                    setTimeout(() => app.sendMessage('确认'), 8400);
                }
            };
            
            window.clearChat = function() {
                const app = window.app;
                app.chatView.clearChat();
            };
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
    
    <script>
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('statusTime').textContent = `${hours}:${minutes}`;
        }
        updateTime();
        setInterval(updateTime, 60000);
    </script>
</body>
</html>
