<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apex_Agent Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    :root {
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --slate-950: #020617;
      --violet-50: #f5f3ff;
      --violet-100: #ede9fe;
      --violet-200: #ddd6fe;
      --violet-300: #c4b5fd;
      --violet-400: #a78bfa;
      --violet-500: #8b5cf6;
      --violet-600: #7c3aed;
      --violet-700: #6d28d9;
      --violet-800: #5b21b6;
      --violet-900: #4c1d95;
      --primary: #6366f1;
      --emerald-200: #a7f3d0;
      --radius-card: 0.625rem;
      --radius-btn: 0.5rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', system-ui, sans-serif;
      background: var(--slate-100);
      color: var(--slate-800);
      overflow: hidden;
    }

    #root {
      height: 100vh;
    }

    .mono { font-family: 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }

    /* ===== APP SHELL ===== */
    .app-shell {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* ===== LEFT SIDEBAR ===== */
    .left-sidebar {
      width: 60px;
      flex-shrink: 0;
      background: var(--slate-900);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 8px;
      border-right: 1px solid var(--slate-800);
    }

    .nav-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: var(--slate-400);
      transition: all 0.15s ease;
      border: none;
      background: transparent;
      position: relative;
    }

    .nav-icon:hover {
      background: var(--slate-800);
      color: var(--slate-200);
    }

    .nav-icon.active {
      background: var(--violet-600);
      color: #fff;
    }

    .nav-icon.active::before {
      content: '';
      position: absolute;
      left: -16px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      background: var(--violet-400);
      border-radius: 0 3px 3px 0;
    }

    .nav-tooltip {
      position: absolute;
      left: 52px;
      background: var(--slate-800);
      color: var(--slate-100);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 50;
    }

    .nav-icon:hover .nav-tooltip { opacity: 1; }

    .sidebar-brand {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--violet-500), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .sidebar-spacer { flex: 1; }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--slate-50);
    }

    .header-bar {
      height: 56px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--slate-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-title h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--slate-900);
    }

    .header-title .sprint {
      font-size: 12px;
      color: var(--slate-500);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      border: none;
      cursor: pointer;
      border-radius: var(--radius-btn);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: #5558e0; }
    .btn-primary:disabled {
      background: var(--slate-300);
      color: var(--slate-500);
      cursor: not-allowed;
    }

    .btn-ghost {
      background: var(--slate-100);
      color: var(--slate-700);
    }
    .btn-ghost:hover { background: var(--slate-200); }

    .btn-agent {
      background: var(--slate-900);
      color: #fff;
    }
    .btn-agent:hover { background: var(--slate-800); }
    .btn-agent.active {
      background: var(--violet-600);
    }

    .view-container {
      flex: 1;
      overflow: auto;
      padding: 24px;
    }

    /* ===== AGENT SIDEBAR (POP-OUT) ===== */
    .agent-sidebar {
      width: 400px;
      flex-shrink: 0;
      background: var(--slate-900);
      color: var(--slate-100);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--slate-800);
      height: 100vh;
    }

    .agent-sidebar.hidden {
      display: none;
    }

    .agent-sidebar-header {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--slate-800);
    }

    .agent-sidebar-header h2 {
      font-size: 14px;
      font-weight: 600;
    }

    .close-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--slate-400);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn:hover { background: var(--slate-800); color: #fff; }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-msg {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: var(--radius-card);
      font-size: 13px;
      line-height: 1.5;
    }

    .chat-msg.user {
      align-self: flex-end;
      background: var(--violet-600);
      color: #fff;
    }

    .chat-msg.assistant {
      align-self: flex-start;
      background: var(--slate-800);
      color: var(--slate-100);
    }

    .chat-empty {
      text-align: center;
      color: var(--slate-500);
      font-size: 13px;
      margin-top: 32px;
    }

    .agent-toolbar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-top: 1px solid var(--slate-800);
      background: var(--slate-950);
    }

    .agent-toolbar select {
      flex: 1;
      background: var(--slate-800);
      color: var(--slate-100);
      border: 1px solid var(--slate-700);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .agent-toolbar select:focus { outline: 2px solid var(--violet-500); }

    .prompt-area {
      padding: 12px;
      border-top: 1px solid var(--slate-800);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prompt-area textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      background: var(--slate-800);
      color: var(--slate-100);
      border: 1px solid var(--slate-700);
      border-radius: var(--radius-btn);
      padding: 10px;
      font-size: 13px;
      font-family: inherit;
      line-height: 1.5;
    }
    .prompt-area textarea:focus { outline: 2px solid var(--violet-500); }

    .prompt-area .send-row {
      display: flex;
      justify-content: flex-end;
    }

    /* ===== DASHBOARD ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .stat-card .label {
      font-size: 12px;
      color: var(--slate-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      color: var(--slate-900);
    }

    .stat-card .trend {
      font-size: 12px;
      margin-top: 6px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--slate-900);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-block { margin-bottom: 28px; }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .project-card {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      padding: 16px;
    }

    .project-card .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .project-card .name {
      font-size: 14px;
      font-weight: 600;
      color: var(--slate-900);
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }
    .badge-high { background: #fee2e2; color: #b91c1c; }
    .badge-medium { background: #fef3c7; color: #b45309; }
    .badge-low { background: #dbeafe; color: #1d4ed8; }
    .badge-active { background: #dcfce7; color: #15803d; }
    .badge-progress { background: #dbeafe; color: #1d4ed8; }
    .badge-planning { background: #fef3c7; color: #b45309; }

    .progress-bar {
      height: 6px;
      background: var(--slate-100);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0 6px;
    }

    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--violet-500), var(--primary));
      border-radius: 3px;
    }

    .project-card .meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--slate-500);
    }

    .stories-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .story-item {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.completed { background: #22c55e; }
    .status-dot.in-progress { background: #3b82f6; }
    .status-dot.to-do { background: var(--slate-300); }

    .story-item .title {
      flex: 1;
      font-size: 13px;
      color: var(--slate-800);
    }

    .story-item .assignee {
      font-size: 12px;
      color: var(--slate-500);
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .agent-card {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      padding: 14px;
      text-align: center;
    }

    .agent-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet-500), var(--primary));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      margin: 0 auto 8px;
    }

    .agent-card .a-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--slate-900);
    }

    .agent-card .a-role {
      font-size: 11px;
      color: var(--slate-500);
      margin-top: 2px;
    }

    .agent-card .a-status {
      font-size: 11px;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .agent-card .a-status.active { color: #15803d; }
    .agent-card .a-status.idle { color: var(--slate-400); }

    .agent-card .a-last {
      font-size: 10px;
      color: var(--slate-400);
      margin-top: 4px;
    }

    /* ===== REQUEST BREAKDOWN ===== */
    .breakdown-container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .phase-stepper {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .phase-step {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .phase-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--slate-100);
      color: var(--slate-400);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .phase-step.done .phase-circle {
      background: #dcfce7;
      color: #15803d;
    }

    .phase-step.current .phase-circle {
      background: var(--violet-600);
      color: #fff;
      box-shadow: 0 0 0 4px var(--violet-100);
    }

    .phase-label {
      font-size: 12px;
      color: var(--slate-500);
      font-weight: 500;
    }
    .phase-step.current .phase-label { color: var(--violet-700); font-weight: 600; }
    .phase-step.done .phase-label { color: var(--slate-700); }

    .phase-connector {
      flex: 0 0 20px;
      height: 2px;
      background: var(--slate-200);
    }
    .phase-connector.done { background: #86efac; }

    .request-card {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      padding: 20px;
    }

    .request-card label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-900);
      margin-bottom: 10px;
    }

    .request-card textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      border: 1px solid var(--slate-300);
      border-radius: var(--radius-btn);
      padding: 12px;
      font-size: 13px;
      font-family: inherit;
      line-height: 1.6;
      color: var(--slate-800);
    }
    .request-card textarea:focus { outline: 2px solid var(--violet-400); }

    .request-card .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .breakdown-tree-card {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      padding: 20px;
    }

    .tree-node {
      display: flex;
      flex-direction: column;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    .tree-expand {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--slate-500);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tree-expand.empty { visibility: hidden; }

    .tree-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .tree-badge.epic { background: var(--violet-100); color: var(--violet-700); }
    .tree-badge.story { background: #dbeafe; color: #1d4ed8; }
    .tree-badge.subtask { background: var(--slate-100); color: var(--slate-600); }

    .tree-title {
      font-size: 13px;
      color: var(--slate-800);
      flex: 1;
    }

    .tree-title.epic { font-weight: 700; color: var(--slate-900); }
    .tree-title.story { font-weight: 600; }

    .tree-children {
      margin-left: 32px;
      border-left: 2px dashed var(--slate-200);
      padding-left: 8px;
    }

    .subtask-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
    }

    .subtask-checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--violet-600);
    }

    .subtask-title {
      flex: 1;
      font-size: 13px;
      color: var(--slate-700);
    }

    .subtask-agent {
      font-size: 11px;
      color: var(--violet-600);
      background: var(--violet-50);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .badge-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }
    .badge-status.to-do { background: var(--slate-100); color: var(--slate-600); }
    .badge-status.in-process { background: #fef3c7; color: #b45309; }

    .selection-bar {
      position: sticky;
      bottom: 0;
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.06);
    }

    .selection-text {
      font-size: 13px;
      color: var(--slate-700);
    }
    .selection-text strong { color: var(--violet-700); }

    /* ===== LIVE CANVAS ===== */
    .canvas-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 12px;
    }

    .canvas-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
    }

    .canvas-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--slate-900);
    }

    .canvas-header .subtitle {
      font-size: 12px;
      color: var(--slate-500);
      margin-top: 2px;
    }

    .canvas-main {
      flex: 1;
      display: flex;
      gap: 12px;
      min-height: 0;
    }

    .prd-panel {
      width: 260px;
      flex-shrink: 0;
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .prd-panel.collapsed { display: none; }

    .prd-panel-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--slate-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .prd-panel-header h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-900);
    }

    .prd-file-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .file-viewer-panel {
      width: 380px;
      flex-shrink: 0;
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .file-viewer-panel.collapsed { display: none; }

    .file-viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .file-viewer-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--slate-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--slate-50);
    }

    .file-viewer-header .fv-filename {
      font-size: 12px;
      font-weight: 600;
      color: var(--slate-800);
      font-family: 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
    }

    .file-viewer-body {
      flex: 1;
      overflow: auto;
      display: flex;
      min-height: 0;
    }

    .markdown-preview {
      flex: 1;
      padding: 16px 20px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--slate-800);
      overflow: auto;
    }
    .markdown-preview h1 { font-size: 22px; font-weight: 700; margin: 12px 0 10px; color: var(--slate-900); border-bottom: 2px solid var(--violet-200); padding-bottom: 6px; }

    function RequestBreakdown({ initialQuery, onHandoff }) {
      const [phase, setPhase] = useState('idle');
      const [request, setRequest] = useState(initialQuery || '');
      const [generated, setGenerated] = useState(false);
      const [selected, setSelected] = useState([]);
      const timerRef = useRef(null);

      // Pre-fill from agent sidebar query and auto-trigger
      useEffect(() => {
        if (initialQuery && initialQuery.trim()) {
          setRequest(initialQuery);
          // auto-trigger generation
          if (!generated && phase === 'idle') {
            runGeneration(initialQuery);
          }
        }
        return () => {
          if (timerRef.current) clearTimeout(timerRef.current);
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [initialQuery]);

      function runGeneration(query) {
        setPhase('preparing');
        timerRef.current = setTimeout(() => setPhase('generating'), 400);
        timerRef.current = setTimeout(() => setPhase('confirming'), 900);
        timerRef.current = setTimeout(() => {
          setPhase('ready');
          setGenerated(true);
        }, 1500);
      }

      function handleGenerate() {
        if (!request.trim()) return;
        setGenerated(false);
        setSelected([]);
        runGeneration(request);
      }

      function toggleSubtask(id) {
        setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      }

      function handleStart() {
        setPhase('handoff');
        const selectedSubtasks = mockBreakdownSubtasks.filter(st => selected.includes(st.id));
        onHandoff({
          story: 'Build interactive Apex_Agent demo',
          subtasks: selectedSubtasks,
          request: request,
        });
      }

      const selectedCount = selected.length;

      return (
        <div className="breakdown-container">
          <PhaseStepper phase={phase} />

          <div className="request-card">
            <label>Original Request</label>
            <textarea
              value={request}
              onChange={e => setRequest(e.target.value)}
              placeholder="Describe the feature or request you want to break down into epics, stories, and subtasks..."
            />
            <div className="actions">
              <button
                className="btn btn-primary"
                onClick={handleGenerate}
                disabled={!request.trim() || phase === 'preparing' || phase === 'generating' || phase === 'confirming'}
              >
                {phase === 'preparing' || phase === 'generating' || phase === 'confirming' ? 'Generating...' : '⚡ Generate Breakdown'}
              </button>
            </div>
          </div>

          {generated && (
            <div className="breakdown-tree-card">
              <div className="section-title" style={{marginBottom:'16px'}}>🌳 Breakdown Tree</div>
              <BreakdownTree
                subtasks={mockBreakdownSubtasks}
                selected={selected}
                onToggle={toggleSubtask}
              />
            </div>
          )}

          {generated && (
            <div className="selection-bar">
              <div className="selection-text">
                <strong>1 story</strong> and <strong>{selectedCount} subtasks</strong> selected
              </div>
              <button
                className="btn btn-primary"
                onClick={handleStart}
                disabled={selectedCount === 0}
              >
                ▶ Start
              </button>
            </div>
          )}
        </div>
      );
    }

    /* ============ MARKDOWN RENDERER ============ */
    function renderMarkdown(md) {
      if (!md) return '';
      const lines = md.split('\n');
      const html = [];
      let inCode = false;
      let inUl = false;
      let inOl = false;

      function closeLists() {
        if (inUl) { html.push('</ul>'); inUl = false; }
        if (inOl) { html.push('</ol>'); inOl = false; }
      }

      function inline(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.trim().startsWith('```')) {
          if (inCode) { html.push('</code></pre>'); inCode = false; }
          else { closeLists(); html.push('<pre><code>'); inCode = true; }
          continue;
        }
        if (inCode) { html.push(line); continue; }
        if (/^###\s/.test(line)) { closeLists(); html.push('<h3>' + inline(line.replace(/^###\s/, '')) + '</h3>'); continue; }
        if (/^##\s/.test(line)) { closeLists(); html.push('<h2>' + inline(line.replace(/^##\s/, '')) + '</h2>'); continue; }
        if (/^#\s/.test(line)) { closeLists(); html.push('<h1>' + inline(line.replace(/^#\s/, '')) + '</h1>'); continue; }
        if (/^\d+\.\s/.test(line)) {
          if (!inOl) { closeLists(); html.push('<ol>'); inOl = true; }
          html.push('<li>' + inline(line.replace(/^\d+\.\s/, '')) + '</li>');
          continue;
        }
        if (/^[-*]\s/.test(line)) {
          if (!inUl) { closeLists(); html.push('<ul>'); inUl = true; }
          html.push('<li>' + inline(line.replace(/^[-*]\s/, '')) + '</li>');
          continue;
        }
        if (line.trim() === '') { closeLists(); continue; }
        closeLists();
        html.push('<p>' + inline(line) + '</p>');
      }
      closeLists();
      if (inCode) html.push('</code></pre>');
      return html.join('');
    }

    /* ============ AGENT SIDEBAR ============ */
    function AgentSidebar({ open, onClose, onBreakdownSubmit, onChatMessage }) {
      const [provider, setProvider] = useState('trae');
      const [model, setModel] = useState('glm-4.7-flash');
      const [mode, setMode] = useState('autopilot');
      const [prompt, setPrompt] = useState('');
      const [messages, setMessages] = useState([]);
      const [waiting, setWaiting] = useState(false);

      function handleProviderChange(p) {
        setProvider(p);
        setModel(providerModels[p]);
      }

      function handleSend() {
        if (!prompt.trim()) return;

        if (mode === 'create') {
          // Breakdown mode: pass query, close sidebar, switch view
          onBreakdownSubmit(prompt.trim());
          setPrompt('');
          return;
        }

        // Autopilot/Search: add user msg, simulate response
        const userMsg = { role: 'user', content: prompt.trim() };
        setMessages(prev => [...prev, userMsg]);
        const sentPrompt = prompt.trim();
        setPrompt('');
        setWaiting(true);

        setTimeout(() => {
          const resp = mode === 'search'
            ? `Found 4 relevant results for "${sentPrompt}". Top match: Apex_Agent prototype spec.`
            : `Autopilot engaged. Analyzing request: "${sentPrompt}". Suggesting 1 epic and 6 subtasks. Switch to Request Breakdown to review.`;
          setMessages(prev => [...prev, { role: 'assistant', content: resp }]);
          setWaiting(false);
          if (onChatMessage) onChatMessage({ role: 'user', content: sentPrompt });
        }, 1000);
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          handleSend();
        }
      }

      const placeholder = mode === 'create'
        ? 'Describe the request you want to break down into user stories and subtasks...'
        : 'Ask the agent to break down work, refine sprint scope, or prepare an implementation handoff...';

              <div className="chat-msg assistant" style={{opacity:0.7}}>

            </select>
            <select value={mode} onChange={e => setMode(e.target.value)}>
              <option value="autopilot">Autopilot</option>
              <option value="search">Search</option>
              <option value="create">Breakdown</option>
            </select>
          </div>

          <div className="prompt-area">
            <textarea
              value={prompt}
