<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实施平台 · 点位路线区域管理</title>
<style>
/* ===== CSS Variables - Theme System ===== */
:root{
  --bg-primary:#0b1220;--bg-secondary:#111827;--bg-tertiary:#1f2937;
  --border:#374151;--border-hover:#3b82f6;
  --text-primary:#f3f4f6;--text-secondary:#9ca3af;--text-muted:#4b5563;
  --accent:#3b82f6;--accent-hover:#60a5fa;--accent-glow:rgba(59,130,246,0.15);
  --danger:#ef4444;--success:#10b981;--warning:#f59e0b;
  --canvas-bg-1:#0f172a;--canvas-bg-2:#0b1220;
  --grid-minor:#1e293b;--grid-major:#263348;
  --floor-default:#1e293b;--floor-alt:#1a2332;--floor-border:#334155;--floor-label:#475569;
  --label-bg:rgba(15,23,42,0.85);--label-border:rgba(59,130,246,0.3);--label-text:#e2e8f0;
  --selection:#fbbf24;--selection-glow:rgba(251,191,36,0.3);
  --modal-bg:rgba(0,0,0,0.6);--panel-bg:#111827;
  --minimap-bg:rgba(17,24,39,0.9);--minimap-border:#374151;--minimap-viewport:#3b82f6;
  --ctx-bg:#1f2937;--ctx-hover:#374151;--ctx-sep:#4b5563;
  --toast-bg:#1f2937;--toast-border:#374151;
  --shadow:0 4px 20px rgba(0,0,0,0.4);
}
[data-theme="light"]{
  --bg-primary:#f8fafc;--bg-secondary:#ffffff;--bg-tertiary:#f1f5f9;
  --border:#e2e8f0;--border-hover:#3b82f6;
  --text-primary:#1e293b;--text-secondary:#64748b;--text-muted:#94a3b8;
  --accent:#3b82f6;--accent-hover:#2563eb;--accent-glow:rgba(59,130,246,0.08);
  --danger:#ef4444;--success:#10b981;--warning:#f59e0b;
  --canvas-bg-1:#f1f5f9;--canvas-bg-2:#e2e8f0;
  --grid-minor:#cbd5e1;--grid-major:#94a3b8;
  --floor-default:#e2e8f0;--floor-alt:#f1f5f9;--floor-border:#94a3b8;--floor-label:#64748b;
  --label-bg:rgba(255,255,255,0.92);--label-border:rgba(59,130,246,0.25);--label-text:#1e293b;
  --selection:#f59e0b;--selection-glow:rgba(245,158,11,0.3);
  --modal-bg:rgba(0,0,0,0.35);--panel-bg:#ffffff;
  --minimap-bg:rgba(255,255,255,0.92);--minimap-border:#cbd5e1;--minimap-viewport:#3b82f6;
  --ctx-bg:#ffffff;--ctx-hover:#f1f5f9;--ctx-sep:#e2e8f0;
  --toast-bg:#ffffff;--toast-border:#e2e8f0;
  --shadow:0 4px 20px rgba(0,0,0,0.08);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif;color:var(--text-primary);background:var(--bg-primary);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* ===== Header ===== */
header{height:44px;background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
header h1{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.05em}
.header-tools{display:flex;gap:6px;align-items:center}
.btn{background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);padding:4px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px;transition:.15s}
.btn:hover{border-color:var(--border-hover);color:var(--border-hover)}
.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;font-size:14px;border-radius:4px}
.theme-toggle{cursor:pointer;font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:1px solid var(--border);background:var(--bg-tertiary);color:var(--text-primary);transition:.15s}
.theme-toggle:hover{border-color:var(--border-hover);color:var(--border-hover)}

/* ===== Main Layout ===== */
.main{display:flex;flex:1;overflow:hidden}

/* ===== Left Sidebar ===== */
.sidebar-left{width:224px;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.panel-title{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;padding:10px 12px 4px;font-weight:600}
.mat-group{margin-bottom:2px}
.mat-group-hd{display:flex;align-items:center;gap:6px;padding:7px 12px;cursor:pointer;font-size:12px;color:var(--text-primary);font-weight:600;user-select:none}
.mat-group-hd:hover{background:var(--bg-tertiary)}
.mat-group-hd .arr{font-size:9px;color:var(--text-secondary);transition:.2s;display:inline-block}
.mat-group-hd.open .arr{transform:rotate(90deg)}
.mat-group-bd{display:none;padding:2px 8px 8px 28px;flex-direction:column;gap:3px}
.mat-group-bd.open{display:flex}
.mat-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;cursor:grab;font-size:12px;color:var(--text-secondary);border:1px solid transparent;transition:.15s;user-select:none}
.mat-item:hover{background:var(--bg-tertiary);color:var(--text-primary);border-color:var(--border)}
.mat-item:active{cursor:grabbing}
.mat-item .ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mat-item .ico svg{width:16px;height:16px}

/* ===== Canvas ===== */
.canvas-wrap{flex:1;position:relative;background:var(--bg-primary);overflow:hidden}
#canvas{display:block;width:100%;height:100%;cursor:crosshair}
#canvas.panning{cursor:grab}
#canvas.dragging{cursor:grabbing}
#canvas.tool-point{cursor:crosshair}
#canvas.tool-select{cursor:default}
#canvas.tool-rotate{cursor:alias}

/* ===== Right Sidebar ===== */
.sidebar-right{width:268px;background:var(--bg-secondary);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.search-box{padding:8px 12px;border-bottom:1px solid var(--border)}
.search-box input{width:100%;background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);padding:6px 10px;border-radius:4px;font-family:inherit;font-size:12px}
.search-box input:focus{outline:none;border-color:var(--accent)}
.search-box input::placeholder{color:var(--text-muted)}
.prop-panel{padding:10px 12px}
.prop-group{margin-bottom:12px}
.prop-group label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:3px;font-weight:500}
.prop-group input,.prop-group select{width:100%;background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);padding:5px 8px;border-radius:3px;font-family:inherit;font-size:12px}
.prop-group input:focus,.prop-group select:focus{outline:none;border-color:var(--accent)}
.prop-group input[type="color"]{padding:2px;height:30px;cursor:pointer}
.prop-group input[type="number"]{font-family:'GeistMono',monospace}
.prop-row{display:flex;gap:8px}
.prop-row .prop-group{flex:1}
.prop-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.prop-tag{background:var(--bg-tertiary);border:1px solid var(--border);padding:2px 8px;border-radius:3px;font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:4px}
.prop-tag .del{color:var(--text-secondary);cursor:pointer;font-size:14px;line-height:1}
.prop-tag .del:hover{color:var(--danger)}
.add-tag-btn{font-size:11px;color:var(--accent);cursor:pointer;margin-top:4px;display:inline-block}
.toggle-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;color:var(--text-secondary)}
.toggle-row input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
.layer-list{display:flex;flex-direction:column;gap:2px}
.layer-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:12px;color:var(--text-secondary);user-select:none}
.layer-item:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.layer-item.active{background:var(--border);color:var(--text-primary)}
.layer-item .eye{width:16px;text-align:center;font-size:12px;cursor:pointer}
.divider{height:1px;background:var(--border);margin:8px 0}

/* ===== Object List ===== */
.obj-list-wrap{max-height:200px;overflow-y:auto;border-top:1px solid var(--border);margin-top:4px}
.obj-list-item{display:flex;align-items:center;gap:6px;padding:4px 8px;cursor:pointer;font-size:11px;color:var(--text-secondary);border-bottom:1px solid var(--border);transition:.1s}
.obj-list-item:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.obj-list-item.active{background:var(--accent-glow);color:var(--accent)}
.obj-list-item.search-match{background:rgba(245,158,11,0.1);color:var(--warning)}
.obj-list-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.obj-list-item .obj-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj-list-item .obj-code{font-size:10px;color:var(--text-muted);font-family:monospace}

/* ===== Bottom Toolbar ===== */
.toolbar-bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--panel-bg);border:1px solid var(--border);border-radius:8px;padding:4px 6px;z-index:50;box-shadow:var(--shadow)}
.tool-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:5px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text-secondary);font-size:16px;transition:.15s;user-select:none}
.tool-btn:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.tool-btn.active{background:var(--accent);color:#fff;border-color:var(--accent-hover)}
.tool-btn[data-tooltip]{position:relative}
.tool-btn[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--bg-primary);border:1px solid var(--border);color:var(--text-primary);padding:3px 8px;border-radius:4px;font-size:10px;white-space:nowrap;pointer-events:none;z-index:100}
.tool-sep{width:1px;background:var(--border);margin:4px 2px}

/* ===== Status Bar ===== */
.status-bar{height:26px;background:var(--bg-secondary);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;color:var(--text-secondary);flex-shrink:0}
.status-bar span{display:flex;align-items:center;gap:6px}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:var(--modal-bg);display:none;align-items:center;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal{background:var(--panel-bg);border:1px solid var(--border);border-radius:8px;padding:20px;width:420px;max-width:90vw;box-shadow:var(--shadow)}
.modal h3{font-size:14px;margin-bottom:12px;color:var(--text-primary)}
.modal textarea{width:100%;height:200px;background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);padding:10px;border-radius:4px;font-family:monospace;font-size:11px;resize:vertical}
.modal textarea:focus{outline:none;border-color:var(--accent)}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

/* ===== Zoom indicator ===== */
.zoom-indicator{position:absolute;top:12px;right:12px;background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text-secondary);z-index:50;pointer-events:none}

/* ===== Coordinate Display ===== */
.coord-display{position:absolute;top:12px;left:12px;background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text-secondary);z-index:50;pointer-events:none;font-family:'GeistMono',monospace}

/* ===== Minimap ===== */
.minimap{position:absolute;bottom:60px;right:12px;width:160px;height:120px;background:var(--minimap-bg);border:1px solid var(--minimap-border);border-radius:6px;z-index:50;overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}
.minimap canvas{width:100%;height:100%;display:block}
.minimap-viewport{position:absolute;border:1.5px solid var(--minimap-viewport);background:rgba(59,130,246,0.08);pointer-events:none;border-radius:1px}

/* ===== Context Menu ===== */
.ctx-menu{position:fixed;background:var(--ctx-bg);border:1px solid var(--border);border-radius:6px;padding:4px;z-index:300;min-width:160px;box-shadow:var(--shadow);display:none}
.ctx-menu.show{display:block}
.ctx-item{padding:6px 12px;font-size:12px;color:var(--text-primary);cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:8px;user-select:none}
.ctx-item:hover{background:var(--ctx-hover)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger:hover{background:rgba(239,68,68,0.1)}
.ctx-item .shortcut{margin-left:auto;font-size:10px;color:var(--text-muted)}
.ctx-sep{height:1px;background:var(--ctx-sep);margin:4px 8px}
.ctx-item.disabled{color:var(--text-muted);pointer-events:none}

/* ===== Toast ===== */
.toast-container{position:fixed;top:56px;right:16px;z-index:400;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--toast-bg);border:1px solid var(--toast-border);border-radius:6px;padding:8px 14px;font-size:12px;color:var(--text-primary);box-shadow:var(--shadow);animation:toast-in .25s ease;display:flex;align-items:center;gap:8px}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--accent)}
@keyframes toast-in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toast-out{from{opacity:1}to{opacity:0;transform:translateX(20px)}}

/* ===== Axis indicator ===== */
.axis-indicator{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:50;pointer-events:none}
.axis-indicator canvas{display:block}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <header>
    <h1>实施平台 · Map Implementation Platform</h1>
    <div class="header-tools">
      <div class="theme-toggle" id="themeToggle" title="切换主题">🌙</div>
      <button class="btn" onclick="app.undo()" title="撤销 Ctrl+Z">↩ 撤销</button>
      <button class="btn" onclick="app.redo()" title="重做 Ctrl+Shift+Z">↪ 重做</button>
      <button class="btn" onclick="app.exportSample()">导出样表</button>
      <button class="btn" onclick="app.showImportModal()">导入</button>
      <button class="btn" onclick="app.exportData()">导出数据</button>
      <button class="btn" onclick="app.clearAll()">清空画布</button>
    </div>
  </header>
  <div class="main">
    <div class="sidebar-left">
      <div class="panel-title">素材库</div>
      <div id="materials"></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="zoom-indicator" id="zoomIndicator">100%</div>
      <div class="coord-display" id="coordDisplay">X: 0.0 &nbsp; Y: 0.0</div>
      <div class="axis-indicator"><canvas id="axisCanvas" width="48" height="48"></canvas></div>
      <div class="minimap" id="minimap">
        <canvas id="minimapCanvas"></canvas>
        <div class="minimap-viewport" id="minimapViewport"></div>
      </div>
      <div class="toolbar-bottom">
        <div class="tool-btn active" data-tool="select" data-tooltip="选择 V">&#10004;</div>
        <div class="tool-sep"></div>
        <div class="tool-btn" data-tool="pan" data-tooltip="平移 H">&#9995;</div>
        <div class="tool-sep"></div>
        <div class="tool-btn" data-tool="point" data-tooltip="点位 P">&#9679;</div>
        <div class="tool-sep"></div>
        <div class="tool-btn" data-tool="line" data-tooltip="画线 L">&#47;</div>
        <div class="tool-btn" data-tool="polyline" data-tooltip="多段线 M">&#8767;</div>
        <div class="tool-sep"></div>
        <div class="tool-btn" data-tool="rect" data-tooltip="矩形 R">&#9633;</div>
        <div class="tool-btn" data-tool="polygon" data-tooltip="多边形 G">&#11042;</div>
        <div class="tool-sep"></div>
        <div class="tool-btn" data-tool="rotate" data-tooltip="旋转 O">&#8635;</div>
      </div>
    </div>
    <div class="sidebar-right">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索名称 / 编号 ...">
      </div>
      <div class="prop-panel" id="propPanel">
        <div class="prop-group">
          <label>显示设置</label>
          <div class="toggle-row"><input type="checkbox" id="showName" checked> <span>显示名称</span></div>
          <div class="toggle-row"><input type="checkbox" id="showCode" checked> <span>显示编号</span></div>
          <div class="toggle-row"><input type="checkbox" id="showGrid" checked> <span>显示网格</span></div>
          <div class="toggle-row"><input type="checkbox" id="showFloorPlan" checked> <span>显示底图</span></div>
        </div>
        <div class="divider"></div>
        <div class="prop-group">
          <label>图层管理</label>
          <div class="layer-list" id="layerList"></div>
        </div>
        <div class="divider"></div>
        <div class="prop-group">
          <label>对象列表 (<span id="objCount">0</span>)</label>
          <div class="obj-list-wrap" id="objListWrap"></div>
        </div>
        <div class="divider"></div>
        <div id="selectedProps" style="display:none">
          <div class="panel-title">选中对象属性</div>
          <div class="prop-group"><label>名称</label><input type="text" id="pName"></div>
          <div class="prop-group"><label>编号</label><input type="text" id="pCode"></div>
          <div class="prop-row">
            <div class="prop-group"><label>X</label><input type="number" id="pX" step="0.1"></div>
            <div class="prop-group"><label>Y</label><input type="number" id="pY" step="0.1"></div>
          </div>
          <div class="prop-row">
            <div class="prop-group"><label>旋转</label><input type="number" id="pRot" step="1"></div>
            <div class="prop-group"><label>缩放</label><input type="number" id="pScale" step="0.1"></div>
          </div>
          <div class="prop-group"><label>颜色</label><input type="color" id="pColor"></div>
          <div class="prop-group"><label>主类型</label><select id="pMainType"><option value="point">点位</option><option value="route">路线</option><option value="area">区域</option></select></div>
          <div class="prop-group"><label>子类型</label><input type="text" id="pSubType"></div>
          <div class="prop-group"><label>空间ID</label><input type="text" id="pSpaceID"></div>
          <div class="prop-group"><label>图层</label>
            <select id="pLayer"></select>
          </div>
          <div class="prop-group">
            <label>标签</label>
            <div class="prop-tags" id="pTags"></div>
            <div class="add-tag-btn" onclick="app.addTag()">+ 添加标签</div>
          </div>
          <div style="margin-top:8px;display:flex;gap:6px">
            <button class="btn" onclick="app.duplicateSelected()">复制</button>
            <button class="btn" onclick="app.deleteSelected()" style="color:var(--danger);border-color:var(--danger)">删除</button>
          </div>
        </div>
        <div id="noSelection" style="text-align:center;padding:20px 0;color:var(--text-muted);font-size:12px">
          点击画布上的对象查看属性<br>或使用素材库添加新对象<br><br>
          <span style="font-size:11px;color:var(--text-muted)">提示: 双击多段线/多边形结束绘制</span>
        </div>
      </div>
    </div>
  </div>
  <div class="status-bar">
    <span id="statusText">就绪 | 缩放: 100% | 对象: 0</span>
    <span>滚轮缩放 · 右键/中键拖拽平移 · 双击结束绘制 · Ctrl+Z撤销</span>
  </div>
</div>

<!-- Context Menu -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" onclick="app.ctxAction('copy')"><span>📋 复制</span><span class="shortcut">Ctrl+C</span></div>
  <div class="ctx-item" onclick="app.ctxAction('paste')"><span>📌 粘贴</span><span class="shortcut">Ctrl+V</span></div>
  <div class="ctx-item" onclick="app.ctxAction('duplicate')"><span>🔄 克隆</span><span class="shortcut">Ctrl+D</span></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" onclick="app.ctxAction('bringTop')"><span>⬆ 置顶</span></div>
  <div class="ctx-item" onclick="app.ctxAction('bringBottom')"><span>⬇ 置底</span></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" onclick="app.ctxAction('delete')"><span>🗑 删除</span><span class="shortcut">Del</span></div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h3>导入数据 (JSON)</h3>
    <textarea id="importArea" placeholder="粘贴JSON数据..."></textarea>
    <div class="modal-btns">
      <button class="btn" onclick="document.getElementById('importModal').classList.remove('show')">取消</button>
      <button class="btn active" onclick="app.doImport()">导入</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
(function(){
'use strict';

/* ========== Theme System ========== */
var currentTheme = 'dark';
function toggleTheme(){
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', currentTheme);

/* ========== Undo/Redo System ========== */
var undoStack=[];
var redoStack=[];
var undoBatch=false;
var batchActions=[];

function saveUndoState(desc){
  var state=JSON.stringify(objects.map(function(o){
    return{id:o.id,name:o.name,code:o.code,mainType:o.mainType,subType:o.subType,
      x:o.x,y:o.y,rotation:o.rotation,scale:o.scale,color:o.color,
      layer:o.layer,spaceID:o.spaceID,tags:o.tags.slice(),width:o.width,height:o.height,
      points:o.points?o.points.map(function(p){return{x:p.x,y:p.y}}):null};
  }));
  if(undoBatch){
    batchActions.push({state:state,desc:desc});
  }else{
    undoStack.push({state:state,desc:desc});
    if(undoStack.length>50)undoStack.shift();
    redoStack=[];
  }
}

function undo(){
  if(undoStack.length===0)return;
  redoStack.push({state:JSON.stringify(objects.map(cloneObj)),desc:'redo-save'});
  var snap=undoStack.pop();
  restoreState(snap.state);
  showToast('撤销: '+snap.desc,'info');
}

function redo(){
  if(redoStack.length===0)return;
  undoStack.push({state:JSON.stringify(objects.map(cloneObj)),desc:'undo-save'});
  var snap=redoStack.pop();
  restoreState(snap.state);
  showToast('重做','info');
}

function beginBatch(desc){
  undoBatch=true;batchActions=[];
}

function endBatch(){
  if(batchActions.length>1){
    undoStack.push(batchActions[0]);
    if(undoStack.length>50)undoStack.shift();
    redoStack=[];
  }else if(batchActions.length===1){
    undoStack.push(batchActions[0]);
    if(undoStack.length>50)undoStack.shift();
    redoStack=[];
  }
  undoBatch=false;batchActions=[];
}

function restoreState(stateStr){
  var data=JSON.parse(stateStr);
  objects=data.map(function(d){
    var obj={id:d.id,name:d.name,code:d.code,mainType:d.mainType,subType:d.subType,
      x:d.x,y:d.y,rotation:d.rotation,scale:d.scale,color:d.color,
      layer:d.layer,spaceID:d.spaceID,tags:d.tags||[],width:d.width||0,height:d.height||0,
      points:d.points||null,location:{x:d.x||0,y:d.y||0}};
    return obj;
  });
  nextId=objects.reduce(function(m,o){return Math.max(m,o.id);},0)+1;
  selectedId=null;hideProps();buildLayerList();buildObjList();render();updateStatus();
}

function cloneObj(o){
  return{id:o.id,name:o.name,code:o.code,mainType:o.mainType,subType:o.subType,
    x:o.x,y:o.y,rotation:o.rotation,scale:o.scale,color:o.color,
    layer:o.layer,spaceID:o.spaceID,tags:o.tags.slice(),width:o.width,height:o.height,
    points:o.points?o.points.map(function(p){return{x:p.x,y:p.y}}):null};
}

/* ========== Object List ========== */
function buildObjList(filter){

  searchMatches=[];
  var q=(filter||'').toLowerCase();
  document.getElementById('objCount').textContent=objects.length;

  objects.forEach(function(o){

    var match=!q||(o.name&&o.name.toLowerCase().indexOf(q)>=0)||(o.code&&o.code.toLowerCase().indexOf(q)>=0)||(o.tags&&o.tags.some(function(t){return t.toLowerCase().indexOf(q)>=0}));
    if(match)searchMatches.push(o.id);

    var el=document.createElement('div');
    el.className='obj-list-item'+(o.id===selectedId?' active':'')+(match&&q?' search-match':'');
    el.setAttribute('data-id',o.id);
    el.innerHTML='<span class="dot" style="background:'+o.color+'"></span><span class="obj-name">'+o.name+'</span><span class="obj-code">'+o.code+'</span>';

/* ========== Minimap ========== */
function renderMinimap(){
  var mmCanvas=document.getElementById('minimapCanvas');
  var mmCtx=mmCanvas.getContext('2d');
  var mw=160,mh=120;
  mmCtx.clearRect(0,0,mw,mh);

  // Calculate world bounds
  var minX=-500,maxX=500,minY=-400,maxY=400;
  objects.forEach(function(o){
    if(o.mainType==='point'){minX=Math.min(minX,o.x-20);maxX=Math.max(maxX,o.x+20);minY=Math.min(minY,o.y-20);maxY=Math.max(maxY,o.y+20);}
    if(o.points){o.points.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});}
    if(o.width){minX=Math.min(minX,o.x-o.width/2);maxX=Math.max(maxX,o.x+o.width/2);}
    if(o.height){minY=Math.min(minY,o.y-o.height/2);maxY=Math.max(maxY,o.y+o.height/2);}
  });
  var pad=50;minX-=pad;maxX+=pad;minY-=pad;maxY+=pad;
  var ww=maxX-minX,wh=maxY-minY;
  var scale=Math.min(mw/ww,mh/wh);

  function mmX(wx){return(wx-minX)*scale;}
  function mmY(wy){return(wy-minY)*scale;}

  // Draw floor plan
  floorPlan.rooms.forEach(function(r){
    mmCtx.fillStyle=currentTheme==='dark'?'#1e293b':'#e2e8f0';
    mmCtx.fillRect(mmX(r.x),mmY(r.y),r.w*scale,r.h*scale);
  });

  // Draw objects
  objects.forEach(function(o){
    mmCtx.fillStyle=o.color;
    if(o.mainType==='point'){mmCtx.beginPath();mmCtx.arc(mmX(o.x),mmY(o.y),2,0,Math.PI*2);mmCtx.fill();}
    else if(o.points){
      mmCtx.strokeStyle=o.color;mmCtx.lineWidth=1;
      mmCtx.beginPath();mmCtx.moveTo(mmX(o.points[0].x),mmY(o.points[0].y));
      for(var i=1;i<o.points.length;i++)mmCtx.lineTo(mmX(o.points[i].x),mmY(o.points[i].y));
      mmCtx.stroke();
    }
    if(o.mainType==='area'&&o.subType==='rect'){
      mmCtx.fillStyle=o.color+'66';
      mmCtx.fillRect(mmX(o.x-o.width/2),mmY(o.y-o.height/2),o.width*scale,o.height*scale);
    }
  });

  // Draw viewport rectangle
  var vpEl=document.getElementById('minimapViewport');
  var vpLeft=screenToWorld(0,0);
  var vpRight=screenToWorld(w,h);
  var vl=mmX(vpLeft.x),vt=mmY(vpLeft.y);
  var vr=mmX(vpRight.x),vb=mmY(vpRight.y);
  vpEl.style.left=Math.max(0,vl)+'px';
  vpEl.style.top=Math.max(0,vt)+'px';
  vpEl.style.width=Math.min(mw,Math.max(4,vr-vl))+'px';
  vpEl.style.height=Math.min(mh,Math.max(4,vb-vt))+'px';
}

/* ========== Context Menu ========== */
function showContextMenu(x,y){
  var menu=document.getElementById('ctxMenu');
  menu.style.left=x+'px';menu.style.top=y+'px';
  menu.classList.add('show');
  // Disable paste if no clipboard
  menu.querySelector('[onclick*="paste"]').classList.toggle('disabled',!clipboard);
}

function hideContextMenu(){
  document.getElementById('ctxMenu').classList.remove('show');
}

function ctxAction(action){
  hideContextMenu();
  var obj=selectedId?objects.find(function(o){return o.id===selectedId;}):null;
  if(action==='copy'&&obj){clipboard=JSON.parse(JSON.stringify(cloneObj(obj)));showToast('已复制: '+obj.name,'success');}
  else if(action==='paste'&&clipboard){
    var cp=JSON.parse(JSON.stringify(clipboard));
    cp.id=nextId++;cp.name=cp.name+' 副本';cp.code=cp.code+'-C';cp.x+=30;cp.y+=30;
    if(cp.points){cp.points=cp.points.map(function(p){return{x:p.x+30,y:p.y+30}});}
    saveUndoState('粘贴对象');
    objects.push(cp);
    if(!layers[cp.layer])layers[cp.layer]=true;
    selectedId=cp.id;buildLayerList();buildObjList();showProps(cp);render();renderMinimap();updateStatus();
    showToast('已粘贴: '+cp.name,'success');
  }
  else if(action==='duplicate'&&obj){
    saveUndoState('克隆对象');
    var dup=JSON.parse(JSON.stringify(cloneObj(obj)));
    dup.id=nextId++;dup.name=obj.name+' 副本';dup.code=obj.code+'-D';dup.x+=30;dup.y+=30;
    if(dup.points){dup.points=dup.points.map(function(p){return{x:p.x+30,y:p.y+30}});}
    objects.push(dup);
    selectedId=dup.id;buildLayerList();buildObjList();showProps(dup);render();renderMinimap();updateStatus();
    showToast('已克隆: '+dup.name,'success');
  }
  else if(action==='delete'&&obj){saveUndoState('删除对象');deleteObject(obj.id);}
  else if(action==='bringTop'&&obj){
    saveUndoState('置顶');
    objects=objects.filter(function(o){return o.id!==obj.id;});
    objects.push(obj);render();
  }
  else if(action==='bringBottom'&&obj){
    saveUndoState('置底');
    objects=objects.filter(function(o){return o.id!==obj.id;});
    objects.unshift(obj);render();
  }
}

/* ========== Events ========== */
function bindEvents(){
  canvas.addEventListener('wheel',onWheel,{passive:false});
  canvas.addEventListener('mousedown',onMouseDown);
  canvas.addEventListener('mousemove',onMouseMove);
  canvas.addEventListener('mouseup',onMouseUp);
  canvas.addEventListener('dblclick',onDblClick);
  canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
  canvas.addEventListener('dragover',function(e){e.preventDefault();});
  canvas.addEventListener('drop',onDrop);
  document.querySelectorAll('.tool-btn').forEach(function(btn){
    btn.onclick=function(){setTool(btn.getAttribute('data-tool'));};
  });
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.ctrlKey||e.metaKey){
      if(e.key==='z'&&!e.shiftKey){e.preventDefault();undo();return;}
      if((e.key==='z'&&e.shiftKey)||(e.key==='y')){e.preventDefault();redo();return;}
      if(e.key==='c'){e.preventDefault();copySelected();return;}
      if(e.key==='v'){e.preventDefault();pasteClipboard();return;}
      if(e.key==='d'){e.preventDefault();duplicateSelected();return;}
      if(e.key==='a'){e.preventDefault();/* select all future */return;}
    }
    switch(e.key.toLowerCase()){
      case 'v':setTool('select');break;
      case 'h':setTool('pan');break;
      case 'p':setTool('point');break;
      case 'l':setTool('line');break;
      case 'm':setTool('polyline');break;
      case 'r':setTool('rect');break;
      case 'g':setTool('polygon');break;
      case 'o':setTool('rotate');break;
      case 'delete':case 'backspace':if(selectedId){saveUndoState('删除对象');deleteObject(selectedId);}break;
      case 'escape':cancelDraw();hideContextMenu();break;
    }
  });
  // Hide context menu on click elsewhere
  document.addEventListener('mousedown',function(e){
    if(!e.target.closest('.ctx-menu'))hideContextMenu();
  });
  document.getElementById('searchInput').addEventListener('input',function(){buildObjList(this.value);});
  document.getElementById('showName').addEventListener('change',function(){render();});
  document.getElementById('showCode').addEventListener('change',function(){render();});
  document.getElementById('showGrid').addEventListener('change',function(){render();});
  document.getElementById('showFloorPlan').addEventListener('change',function(){render();});
  // Property inputs
  ['pName','pCode','pX','pY','pRot','pScale','pColor','pMainType','pSubType','pSpaceID','pLayer'].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener('change',function(){
      var key=id.replace('p','').replace('Rot','rotation').replace('Scale','scale').replace('MainType','mainType').replace('SubType','subType').replace('SpaceID','spaceID').replace('Layer','layer');
      var val=el.type==='number'?parseFloat(el.value):el.value;
      app.updateProp(key,val);
    });
  });
  // Minimap click to navigate
  document.getElementById('minimap').addEventListener('mousedown',function(e){
    var navigating=true;
    var mmRect=this.getBoundingClientRect();
    function onNavMove(ev){
      if(!navigating)return;
      var rx=(ev.clientX-mmRect.left)/mmRect.width;
      var ry=(ev.clientY-mmRect.top)/mmRect.height;
      // Map to world bounds roughly
      var worldRange=1000;
      camera.x=-(rx-0.5)*worldRange;
      camera.y=-(ry-0.5)*worldRange*0.8;
      render();renderMinimap();
    }
    function onNavUp(){navigating=false;document.removeEventListener('mousemove',onNavMove);document.removeEventListener('mouseup',onNavUp);}
    document.addEventListener('mousemove',onNavMove);
    document.addEventListener('mouseup',onNavUp);
    onNavMove(e);
  });
}

function setTool(t){
  tool=t;
  document.querySelectorAll('.tool-btn').forEach(function(btn){
    btn.classList.toggle('active',btn.getAttribute('data-tool')===t);
  });
  canvas.className=t==='select'?'tool-select':t==='pan'?'panning':t==='rotate'?'tool-rotate':t==='point'?'tool-point':'';
  cancelDraw();
}

function screenToWorld(sx,sy){return{x:(sx-w/2)/camera.zoom-camera.x,y:(sy-h/2)/camera.zoom-camera.y};}
function worldToScreen(wx,wy){return{x:(wx+camera.x)*camera.zoom+w/2,y:(wy+camera.y)*camera.zoom+h/2};}

function onWheel(e){
  e.preventDefault();
  // Zoom centered on mouse position
  var rect=canvas.getBoundingClientRect();
  var mx=e.clientX-rect.left;
  var my=e.clientY-rect.top;
  var worldBefore=screenToWorld(mx,my);
  var factor=e.deltaY>0?0.92:1.08;
  camera.zoom=Math.max(0.05,Math.min(20,camera.zoom*factor));
  var worldAfter=screenToWorld(mx,my);
  camera.x+=worldAfter.x-worldBefore.x;
  camera.y+=worldAfter.y-worldBefore.y;
  document.getElementById('zoomIndicator').textContent=Math.round(camera.zoom*100)+'%';
  render();renderMinimap();updateStatus();
}

function onMouseDown(e){
  hideContextMenu();
  lastMouse={x:e.offsetX,y:e.offsetY};
  // Right-click or Middle-click for panning
  if(e.button===2||e.button===1){panning=true;canvas.classList.add('dragging');return;}
  var pos=screenToWorld(e.offsetX,e.offsetY);

  if(tool==='pan'){panning=true;canvas.classList.add('dragging');return;}

  if(tool==='select'){
    var hit=hitTest(pos.x,pos.y);
    if(hit){selectedId=hit.id;dragging=true;dragStart={x:pos.x,y:pos.y,obj:hit};showProps(hit);updateObjListHighlight();}
    else{selectedId=null;hideProps();updateObjListHighlight();}
    render();return;
  }
  if(tool==='point'){
    var mat=app._pendingMaterial||{type:'point',subType:'circle'};
    saveUndoState('添加点位');
    createObject({mainType:'point',subType:mat.subType||'circle',x:pos.x,y:pos.y,rotation:0,scale:1,color:'#3b82f6',layer:'Default',name:'点位'+nextId,code:'PT'+String(nextId).padStart(4,'0')});
    return;
  }
  if(tool==='line'||tool==='polyline'){
    if(!drawing){drawing=true;drawPoints=[{x:pos.x,y:pos.y}];}
    else{drawPoints.push({x:pos.x,y:pos.y});if(tool==='line'&&drawPoints.length>=2)finishDraw();}
    render();return;
  }
  if(tool==='rect'){
    if(!drawing){drawing=true;drawPoints=[{x:pos.x,y:pos.y}];dragStart={x:pos.x,y:pos.y};}
    else{drawPoints.push({x:pos.x,y:pos.y});finishDraw();}
    render();return;
  }
  if(tool==='polygon'){
    if(!drawing){drawing=true;drawPoints=[{x:pos.x,y:pos.y}];}
    else{drawPoints.push({x:pos.x,y:pos.y});render();return;}
    render();return;
  }
  if(tool==='rotate'&&selectedId){
    var obj=objects.find(function(o){return o.id===selectedId;});
    if(obj){saveUndoState('旋转对象');obj.rotation=(obj.rotation||0)+15;showProps(obj);render();}
  }
}

function onDblClick(e){
  var pos=screenToWorld(e.offsetX,e.offsetY);
  if(tool==='polyline'&&drawing&&drawPoints.length>=2){finishDraw();return;}
  if(tool==='polygon'&&drawing&&drawPoints.length>=3){finishDraw();return;}
  // Double-click on empty = nothing (don't reset view)
}

function onMouseMove(e){
  var dx=e.offsetX-lastMouse.x,dy=e.offsetY-lastMouse.y;
  lastMouse={x:e.offsetX,y:e.offsetY};
  mouseWorldPos=screenToWorld(e.offsetX,e.offsetY);

  // Update coord display
  document.getElementById('coordDisplay').textContent='X: '+mouseWorldPos.x.toFixed(1)+'   Y: '+mouseWorldPos.y.toFixed(1);

  if(panning){camera.x+=dx/camera.zoom;camera.y+=dy/camera.zoom;render();renderMinimap();return;}
  if(dragging&&dragStart&&dragStart.obj){
    saveUndoState('移动对象');
    var pos=screenToWorld(e.offsetX,e.offsetY);
    var obj=dragStart.obj;
    if(obj.mainType==='point'||(obj.mainType==='area'&&obj.subType==='rect')){
      obj.x+=pos.x-dragStart.x;obj.y+=pos.y-dragStart.y;obj.location.x=obj.x;obj.location.y=obj.y;
    }else if(obj.points){
      var ox=pos.x-dragStart.x,oy=pos.y-dragStart.y;
      obj.points.forEach(function(p){p.x+=ox;p.y+=oy;});
    }
    dragStart.x=pos.x;dragStart.y=pos.y;
    showProps(obj);render();renderMinimap();return;
  }
  if(drawing&&(tool==='rect'||tool==='polygon'||tool==='line'||tool==='polyline')){
    render();
    var pos=screenToWorld(e.offsetX,e.offsetY);
    ctx.save();ctx.strokeStyle='var(--accent)';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    if(tool==='rect'){
      var s=worldToScreen(drawPoints[0].x,drawPoints[0].y);
      var e2=worldToScreen(pos.x,pos.y);
      ctx.strokeStyle='#3b82f6';ctx.strokeRect(s.x,s.y,e2.x-s.x,e2.y-s.y);
    }else{
      ctx.strokeStyle='#3b82f6';
      ctx.beginPath();
      var s0=worldToScreen(drawPoints[0].x,drawPoints[0].y);
      ctx.moveTo(s0.x,s0.y);
      for(var i=1;i<drawPoints.length;i++){var p=worldToScreen(drawPoints[i].x,drawPoints[i].y);ctx.lineTo(p.x,p.y);}
      ctx.lineTo(e2.x,e2.y);
      ctx.stroke();
    }
    // Draw points
    ctx.setLineDash([]);ctx.fillStyle='#3b82f6';
    drawPoints.forEach(function(p){var s=worldToScreen(p.x,p.y);ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill();});
    ctx.restore();
  }
}

function onMouseUp(e){
  if(panning){panning=false;canvas.classList.remove('dragging');}
  if(dragging){dragging=false;dragStart=null;}
}

// Right-click context menu on canvas
canvas.addEventListener('mousedown',function(e){
  if(e.button===2){
    var pos=screenToWorld(e.offsetX,e.offsetY);
    var hit=hitTest(pos.x,pos.y);
    if(hit){selectedId=hit.id;showProps(hit);updateObjListHighlight();render();}
    showContextMenu(e.clientX,e.clientY);
  }
});

function onDrop(e){
  e.preventDefault();
  var item=dragMaterial;
  if(!item&&e.dataTransfer.getData('text/plain')){try{item=JSON.parse(e.dataTransfer.getData('text/plain'));}catch(ex){}}
  if(!item)return;
  var rect=canvas.getBoundingClientRect();
  var pos=screenToWorld(e.clientX-rect.left,e.clientY-rect.top);
  saveUndoState('拖放添加对象');
  createObject({mainType:item.type,subType:item.subType,x:pos.x,y:pos.y,rotation:0,scale:1,color:item.type==='point'?'#3b82f6':item.type==='route'?'#10b981':'#f59e0b',layer:'Default',name:item.label+nextId,code:(item.type==='point'?'PT':item.type==='route'?'RT':'AR')+String(nextId).padStart(4,'0')});
  dragMaterial=null;
}

function cancelDraw(){drawing=false;drawPoints=[];render();}

function finishDraw(){
  if(tool==='line'||tool==='polyline'){
    if(drawPoints.length<2){cancelDraw();return;}
    saveUndoState('绘制路线');
    createObject({mainType:'route',subType:tool==='line'?'line':'polyline',points:drawPoints.slice(),color:'#10b981',layer:'Default',name:'路线'+nextId,code:'RT'+String(nextId).padStart(4,'0')});
  }else if(tool==='rect'){
    if(drawPoints.length<2){cancelDraw();return;}
    var p0=drawPoints[0],p1=drawPoints[1];
    saveUndoState('绘制矩形');
    createObject({mainType:'area',subType:'rect',x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2,width:Math.abs(p1.x-p0.x),height:Math.abs(p1.y-p0.y),rotation:0,scale:1,color:'#f59e0b',layer:'Default',name:'矩形'+nextId,code:'AR'+String(nextId).padStart(4,'0')});
  }else if(tool==='polygon'){
    if(drawPoints.length<3){cancelDraw();return;}
    saveUndoState('绘制多边形');
    createObject({mainType:'area',subType:'polygon',points:drawPoints.slice(),color:'#f59e0b',layer:'Default',name:'多边形'+nextId,code:'AR'+String(nextId).padStart(4,'0')});
  }
  drawing=false;drawPoints=[];
}

function dist(a,b){return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));}

/* ========== Clipboard ========== */
function copySelected(){
  var obj=objects.find(function(o){return o.id===selectedId;});
  if(!obj)return;
  clipboard=JSON.parse(JSON.stringify(cloneObj(obj)));
  showToast('已复制: '+obj.name,'success');
}

function pasteClipboard(){
  if(!clipboard){showToast('剪贴板为空','error');return;}
  ctxAction('paste');
}

function duplicateSelected(){
  var obj=objects.find(function(o){return o.id===selectedId;});
  if(!obj)return;
  ctxAction('duplicate');
}

function deleteSelected(){
  if(!selectedId)return;
  saveUndoState('删除对象');
  deleteObject(selectedId);
  showToast('已删除','success');
}

/* ========== Object CRUD ========== */
function createObject(props){
  var obj={id:nextId++,name:props.name||'未命名',code:props.code||'ID'+nextId,location:{x:props.x||0,y:props.y||0},rotation:props.rotation||0,scale:props.scale||1,color:props.color||'#3b82f6',mainType:props.mainType||'point',subType:props.subType||'circle',tags:props.tags||[],layer:props.layer||'Default',spaceID:props.spaceID||'',x:props.x||0,y:props.y||0,width:props.width||0,height:props.height||0,points:props.points||null};
  objects.push(obj);
  if(!layers[obj.layer])layers[obj.layer]=true;
  buildLayerList();buildObjList();buildLayerSelect();selectedId=obj.id;showProps(obj);render();renderMinimap();updateStatus();
}

function deleteObject(id){
  objects=objects.filter(function(o){return o.id!==id;});
  if(selectedId===id){selectedId=null;hideProps();}
  buildObjList();render();renderMinimap();updateStatus();
}

function hitTest(wx,wy){
  for(var i=objects.length-1;i>=0;i--){
    var o=objects[i];
    if(!layers[o.layer])continue;
    var sx=(wx+camera.x)*camera.zoom+w/2;
    var sy=(wy+camera.y)*camera.zoom+h/2;
    if(o.mainType==='point'){
      var s=worldToScreen(o.x,o.y);
      var r=14*camera.zoom*(o.scale||1);
      if(Math.abs(s.x-sx)<r&&Math.abs(s.y-sy)<r)return o;
    }else if(o.mainType==='area'&&o.subType==='rect'){
      var s=worldToScreen(o.x,o.y);
      var hw=(o.width/2)*camera.zoom*(o.scale||1);
      var hh=(o.height/2)*camera.zoom*(o.scale||1);
      if(Math.abs(s.x-sx)<hw&&Math.abs(s.y-sy)<hh)return o;
    }else if(o.points){
      // Point-to-line-segment hit test
      for(var j=0;j<o.points.length-1;j++){
        if(pointToSegDist(wx,wy,o.points[j].x,o.points[j].y,o.points[j+1].x,o.points[j+1].y)<10/camera.zoom)return o;
      }
    }else if(o.mainType==='area'&&o.points){
      // Point-in-polygon hit test
      var inside=false;
      for(var j=0,k=o.points.length-1;j<o.points.length;k=j++){
        var xi=o.points[j].x,yi=o.points[j].y,xk=o.points[k].x,yk=o.points[k].y;
        if((yi>wy)!==(yk>wy)&&wx<(xk-xi)*(wy-yi)/(yk-yi)+xi)inside=!inside;
      }
      if(inside)return o;
    }
  }
  return null;
}

function pointToSegDist(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1;
  var len2=dx*dx+dy*dy;
  if(len2===0)return dist({x:px,y:py},{x:x1,y:y1});
  var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/len2));
  var projX=x1+t*dx,projY=y1+t*dy;
  return dist({x:px,y:py},{x:projX,y:projY});
}

/* ========== Get Theme Colors ========== */
function getThemeColor(varName){
  var style=getComputedStyle(document.body);
  return style.getPropertyValue(varName).trim();
}

/* ========== Render ========== */
function render(){
  var showN=document.getElementById('showName').checked;
  var showC=document.getElementById('showCode').checked;
  var showG=document.getElementById('showGrid').checked;
  var showF=document.getElementById('showFloorPlan').checked;
  var isDark=currentTheme==='dark';

  ctx.clearRect(0,0,w,h);

  // Background gradient
  var grad=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.7);
  grad.addColorStop(0,isDark?'#0f172a':'#f1f5f9');
  grad.addColorStop(1,isDark?'#0b1220':'#e2e8f0');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,w,h);

  // Grid
  if(showG){
    ctx.save();
    var step=50;
    var s=worldToScreen(0,0);
    var offX=((s.x%(step*camera.zoom))+(step*camera.zoom))%(step*camera.zoom);
    var offY=((s.y%(step*camera.zoom))+(step*camera.zoom))%(step*camera.zoom);
    ctx.strokeStyle=isDark?'#1e293b':'#cbd5e1';ctx.lineWidth=1;
    for(var x=offX;x<w;x+=step*camera.zoom){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(var y=offY;y<h;y+=step*camera.zoom){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    var majorStep=200;
    var mOffX=((s.x%(majorStep*camera.zoom))+(majorStep*camera.zoom))%(majorStep*camera.zoom);
    var mOffY=((s.y%(majorStep*camera.zoom))+(majorStep*camera.zoom))%(majorStep*camera.zoom);
    ctx.strokeStyle=isDark?'#263348':'#94a3b8';ctx.lineWidth=1;
    for(var x=mOffX;x<w;x+=majorStep*camera.zoom){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(var y=mOffY;y<h;y+=majorStep*camera.zoom){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

    // Origin cross
    var origin=worldToScreen(0,0);
    ctx.strokeStyle=isDark?'#334155':'#64748b';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(origin.x,0);ctx.lineTo(origin.x,h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,origin.y);ctx.lineTo(w,origin.y);ctx.stroke();
    ctx.setLineDash([]);
    // Origin label
    ctx.fillStyle=isDark?'#475569':'#64748b';ctx.font='10px monospace';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('O',origin.x+4,origin.y+4);
    ctx.restore();
  }

  // Floor plan
  if(showF){
    ctx.save();
    floorPlan.rooms.forEach(function(r){
      var s=worldToScreen(r.x,r.y);
      var sw=r.w*camera.zoom;
      var sh=r.h*camera.zoom;
      var floorIdx=floorPlan.rooms.indexOf(r);
      ctx.fillStyle=floorIdx%2===0?(isDark?'#1e293b':'#e2e8f0'):(isDark?'#1a2332':'#f1f5f9');
      ctx.fillRect(s.x,s.y,sw,sh);
      ctx.strokeStyle=isDark?'#334155':'#94a3b8';
      ctx.lineWidth=1.5;
      ctx.strokeRect(s.x,s.y,sw,sh);
      // Room label
      ctx.fillStyle=isDark?'#475569':'#64748b';
      ctx.font=(11*Math.min(camera.zoom,1.5))+'px sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(r.label,s.x+sw/2,s.y+sh/2);
    });
    ctx.restore();
  }

  // Objects
  objects.forEach(function(o){
    if(!layers[o.layer])return;
    // Highlight search matches
    var isSearchMatch=searchMatches.indexOf(o.id)>=0&&document.getElementById('searchInput').value;
    drawObject(o,isSearchMatch);
    if(o.id===selectedId)drawSelection(o);
    if(showN||showC)drawLabel(o,showN,showC);
  });

  // Drawing preview
  if(drawing&&drawPoints.length>0){
    ctx.save();
    ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.fillStyle='rgba(59,130,246,0.1)';
    var s0=worldToScreen(drawPoints[0].x,drawPoints[0].y);
    if(tool==='line'||tool==='polyline'||tool==='polygon'){
      ctx.beginPath();ctx.moveTo(s0.x,s0.y);
      for(var i=1;i<drawPoints.length;i++){var p=worldToScreen(drawPoints[i].x,drawPoints[i].y);ctx.lineTo(p.x,p.y);}
      // For polygon, close to first point
      if(tool==='polygon')ctx.lineTo(s0.x,s0.y);
      ctx.stroke();
      // Fill polygon preview
      if(tool==='polygon'&&drawPoints.length>=3){
        ctx.fillStyle='rgba(59,130,246,0.08)';
        ctx.beginPath();ctx.moveTo(s0.x,s0.y);
        for(var i=1;i<drawPoints.length;i++){var p=worldToScreen(drawPoints[i].x,drawPoints[i].y);ctx.lineTo(p.x,p.y);}
        ctx.closePath();ctx.fill();
      }
      // Draw points
      drawPoints.forEach(function(p,idx){
        var s=worldToScreen(p.x,p.y);
        ctx.beginPath();ctx.arc(s.x,s.y,idx===0&&tool==='polygon'?6:4,0,Math.PI*2);
        ctx.fillStyle=idx===0&&tool==='polygon'?'#60a5fa':'#3b82f6';ctx.fill();
        // Show snap indicator for polygon close
        if(tool==='polygon'&&idx===0&&drawPoints.length>=3){
          ctx.strokeStyle='#60a5fa';ctx.lineWidth=1.5;ctx.setLineDash([]);
          ctx.beginPath();ctx.arc(s.x,s.y,12,0,Math.PI*2);ctx.stroke();
        }
      });
    }
    ctx.restore();
  }
}

function drawObject(o,isSearchMatch){
  ctx.save();
  var s=worldToScreen(o.x,o.y);
  ctx.translate(s.x,s.y);
  ctx.rotate((o.rotation||0)*Math.PI/180);
  var sc=o.scale||1;
  ctx.scale(sc,sc);
  ctx.fillStyle=o.color;
  ctx.strokeStyle=o.color;
  ctx.lineWidth=Math.max(1,2/sc);

  // Search match glow
  if(isSearchMatch){
    ctx.shadowColor='#f59e0b';
    ctx.shadowBlur=16*sc;
  }

  if(o.mainType==='point'){
    var r=10;
    ctx.shadowColor=o.color;ctx.shadowBlur=8*sc;
    if(o.subType==='circle'){
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
    }else if(o.subType==='circleScale'){
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=o.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);ctx.stroke();
    }else if(o.subType==='cone'){
      ctx.beginPath();ctx.moveTo(0,-r*1.5);ctx.lineTo(r,r);ctx.lineTo(-r,r);ctx.closePath();ctx.fill();
    }else if(o.subType==='rectDir'){
      ctx.fillRect(-r,-r*0.6,r*2,r*1.2);
      ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(r+8,-5);ctx.lineTo(r+8,5);ctx.closePath();ctx.fill();
    }else if(o.subType==='arrow'){
      ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke();
      ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(r-6,-5);ctx.lineTo(r-6,5);ctx.closePath();ctx.fill();
    }else if(o.subType==='station'){
      ctx.fillRect(-r,-r*1.3,r*2,r*2.6);
      ctx.fillStyle=currentTheme==='dark'?'rgba(0,0,0,0.3)':'rgba(255,255,255,0.3)';
      ctx.fillRect(-r+3,-r*1.3+3,r*2-6,r*2.6-6);
    }
    ctx.shadowBlur=0;
  }else if(o.mainType==='route'){
    if(o.points&&o.points.length>=2){
      ctx.lineWidth=Math.max(1.5,2.5/sc);
      ctx.shadowColor=o.color;ctx.shadowBlur=4*sc;
      ctx.beginPath();
      var p0=worldToScreen(o.points[0].x,o.points[0].y);
      ctx.moveTo(p0.x-s.x,p0.y-s.y);
      for(var i=1;i<o.points.length;i++){
        var pi=worldToScreen(o.points[i].x,o.points[i].y);
        ctx.lineTo(pi.x-s.x,pi.y-s.y);
      }
      ctx.stroke();
      ctx.shadowBlur=0;
      for(var i=0;i<o.points.length-1;i++){
        var pa=worldToScreen(o.points[i].x,o.points[i].y);
        var pb=worldToScreen(o.points[i+1].x,o.points[i+1].y);
        var mx=(pa.x+pb.x)/2-s.x,my=(pa.y+pb.y)/2-s.y;
        var angle=Math.atan2(pb.y-pa.y,pb.x-pa.x);
        ctx.save();ctx.translate(mx,my);ctx.rotate(angle);
        ctx.fillStyle=o.color;ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-2,-4);ctx.lineTo(-2,4);ctx.closePath();ctx.fill();
        ctx.restore();
      }
    }
  }else if(o.mainType==='area'){
    ctx.shadowColor=o.color;ctx.shadowBlur=6*sc;
    if(o.subType==='rect'){
      ctx.fillStyle=o.color+(currentTheme==='dark'?'33':'44');
      ctx.fillRect(-o.width/2,-o.height/2,o.width,o.height);
      ctx.strokeStyle=o.color;ctx.lineWidth=Math.max(1,2/sc);
      ctx.strokeRect(-o.width/2,-o.height/2,o.width,o.height);
    }else if(o.points&&o.points.length>=3){
      ctx.fillStyle=o.color+(currentTheme==='dark'?'33':'44');
      ctx.beginPath();
      var p0=worldToScreen(o.points[0].x,o.points[0].y);
      ctx.moveTo(p0.x-s.x,p0.y-s.y);
      for(var i=1;i<o.points.length;i++){
        var pi=worldToScreen(o.points[i].x,o.points[i].y);
        ctx.lineTo(pi.x-s.x,pi.y-s.y);
      }
      ctx.closePath();ctx.fill();
      ctx.strokeStyle=o.color;ctx.lineWidth=Math.max(1,2/sc);ctx.stroke();
    }
    ctx.shadowBlur=0;
  }
  ctx.restore();
}

function drawSelection(o){
  ctx.save();
  var s=worldToScreen(o.x,o.y);
  var selColor=currentTheme==='dark'?'#fbbf24':'#f59e0b';
  ctx.strokeStyle=selColor;ctx.lineWidth=2;ctx.setLineDash([5,3]);
  ctx.shadowColor=selColor;ctx.shadowBlur=6;
  if(o.mainType==='point'){
    var r=16*(o.scale||1);
    ctx.beginPath();ctx.arc(s.x,s.y,r*camera.zoom,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle=selColor;
    var hr=4;
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(d){
      ctx.beginPath();ctx.arc(s.x+d[0]*r*camera.zoom,s.y+d[1]*r*camera.zoom,hr,0,Math.PI*2);ctx.fill();
    });
  }else if(o.mainType==='area'&&o.subType==='rect'){
    var hw=(o.width/2)*camera.zoom*(o.scale||1);
    var hh=(o.height/2)*camera.zoom*(o.scale||1);
    ctx.strokeRect(s.x-hw-4,s.y-hh-4,hw*2+8,hh*2+8);
  }else if(o.points){
    var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    o.points.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
    var s1=worldToScreen(minX,minY),s2=worldToScreen(maxX,maxY);
    ctx.strokeRect(s1.x-4,s1.y-4,s2.x-s1.x+8,s2.y-s1.y+8);
  }
  ctx.restore();
}

function drawLabel(o,showN,showC){
  if(!showN&&!showC)return;
  ctx.save();
  var s=worldToScreen(o.x,o.y);
  var text='';
  if(showN&&showC)text=o.name+' | '+o.code;
  else if(showN)text=o.name;
  else text=o.code;
  var fs=labelFontSize*Math.min(camera.zoom,2);
  ctx.font='500 '+fs+'px "Noto Sans CJK SC","WenQuanYi Micro Hei",sans-serif';
  var tw=ctx.measureText(text).width;
  var px=4,py=2;
  var offset=o.mainType==='point'?20*camera.zoom*(o.scale||1):12*camera.zoom;
  var lx=s.x-tw/2-px;
  var ly=s.y+offset-py;
  var isDark=currentTheme==='dark';
  ctx.fillStyle=isDark?'rgba(15,23,42,0.85)':'rgba(255,255,255,0.92)';
  ctx.beginPath();
  var rr=4;var bw=tw+px*2,bh=fs+py*2;
  ctx.moveTo(lx+rr,ly);ctx.lineTo(lx+bw-rr,ly);ctx.quadraticCurveTo(lx+bw,ly,lx+bw,ly+rr);
  ctx.lineTo(lx+bw,ly+bh-rr);ctx.quadraticCurveTo(lx+bw,ly+bh,lx+bw-rr,ly+bh);
  ctx.lineTo(lx+rr,ly+bh);ctx.quadraticCurveTo(lx,ly+bh,lx,ly+bh-rr);
  ctx.lineTo(lx,ly+rr);ctx.quadraticCurveTo(lx,ly,lx+rr,ly);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=isDark?'rgba(59,130,246,0.3)':'rgba(59,130,246,0.25)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=isDark?'#e2e8f0':'#1e293b';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,s.x,s.y+offset+fs/2);
  ctx.restore();
}

/* ========== Props Panel ========== */
function showProps(o){
  document.getElementById('selectedProps').style.display='block';
  document.getElementById('noSelection').style.display='none';
  document.getElementById('pName').value=o.name||'';
  document.getElementById('pCode').value=o.code||'';
  document.getElementById('pX').value=(o.x||0).toFixed(1);
  document.getElementById('pY').value=(o.y||0).toFixed(1);
  document.getElementById('pRot').value=(o.rotation||0).toFixed(0);
  document.getElementById('pScale').value=(o.scale||1).toFixed(1);
  document.getElementById('pColor').value=o.color||'#3b82f6';
  document.getElementById('pMainType').value=o.mainType||'point';
  document.getElementById('pSubType').value=o.subType||'';
  document.getElementById('pSpaceID').value=o.spaceID||'';
  // Update layer select
  buildLayerSelect();
  document.getElementById('pLayer').value=o.layer||'Default';
  renderTags(o.tags||[]);
}

function hideProps(){
  document.getElementById('selectedProps').style.display='none';
  document.getElementById('noSelection').style.display='block';
}

function renderTags(tags){
  var c=document.getElementById('pTags');c.innerHTML='';
  (tags||[]).forEach(function(tag,idx){
    var el=document.createElement('div');el.className='prop-tag';
    el.innerHTML='<span>'+tag+'</span><span class="del" onclick="app.removeTag('+idx+')">&times;</span>';
    c.appendChild(el);
  });
}

/* ========== Import / Export ========== */
function exportSample(){
  var sample={version:1,objects:[
    {name:'示例点位',code:'PT0001',mainType:'point',subType:'circle',x:100,y:100,rotation:0,scale:1,color:'#3b82f6',layer:'Default',spaceID:'F1',tags:['入口']},
    {name:'示例路线',code:'RT0001',mainType:'route',subType:'line',points:[{x:0,y:0},{x:200,y:100}],color:'#10b981',layer:'Default',spaceID:'F1',tags:['主通道']},
    {name:'示例区域',code:'AR0001',mainType:'area',subType:'rect',x:300,y:200,width:150,height:100,rotation:0,scale:1,color:'#f59e0b',layer:'Default',spaceID:'F1',tags:['办公区']}
  ]};
  var blob=new Blob([JSON.stringify(sample,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sample_import.json';a.click();
  showToast('已导出样表','success');
}

function showImportModal(){document.getElementById('importModal').classList.add('show');}

function doImport(){
  var text=document.getElementById('importArea').value;
  try{
    var data=JSON.parse(text);
    if(data.objects){
      saveUndoState('导入数据');
      data.objects.forEach(function(o){o.id=nextId++;if(!o.layer)o.layer='Default';o.location={x:o.x||0,y:o.y||0};objects.push(o);if(!layers[o.layer])layers[o.layer]=true;});
      buildLayerList();buildObjList();render();renderMinimap();updateStatus();
      showToast('导入成功: '+data.objects.length+' 个对象','success');
    }
    document.getElementById('importModal').classList.remove('show');
    document.getElementById('importArea').value='';
  }catch(e){showToast('导入失败: '+e.message,'error');}
}

function exportData(){
  var data={version:1,objects:objects.map(function(o){return{name:o.name,code:o.code,mainType:o.mainType,subType:o.subType,x:o.x,y:o.y,rotation:o.rotation,scale:o.scale,color:o.color,layer:o.layer,spaceID:o.spaceID,tags:o.tags,width:o.width,height:o.height,points:o.points};})};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='map_impl_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  showToast('数据已导出','success');
}

function clearAll(){
  if(!confirm('确定清空所有对象?'))return;
  saveUndoState('清空画布');
  objects=[];selectedId=null;hideProps();buildObjList();render();renderMinimap();updateStatus();
  showToast('画布已清空','info');
}

/* ========== Search ========== */
function onSearch(q){
  buildObjList(q);
  if(q&&searchMatches.length>0){
    var firstObj=objects.find(function(o){return o.id===searchMatches[0];});
    if(firstObj){
      selectedId=firstObj.id;
      camera.x=-firstObj.x;camera.y=-firstObj.y;
      showProps(firstObj);render();renderMinimap();
    }
    showToast('找到 '+searchMatches.length+' 个匹配项','info');
  }else if(q){
    showToast('未找到匹配项','info');
  }
}

/* ========== Update Prop ========== */
function updateProp(key,value){
  var obj=objects.find(function(o){return o.id===selectedId;});
  if(!obj)return;
  saveUndoState('修改属性');
  obj[key]=value;
  if(key==='x'||key==='y'){obj.location.x=obj.x;obj.location.y=obj.y;}
  if(key==='layer'&&!layers[value]){layers[value]=true;buildLayerList();}
  if(key==='name'||key==='code'||key==='layer')buildObjList();
  render();renderMinimap();
}

function addTag(){
  var tag=prompt('输入标签:');if(!tag)return;
  var obj=objects.find(function(o){return o.id===selectedId;});if(!obj)return;
  saveUndoState('添加标签');
  obj.tags=obj.tags||[];obj.tags.push(tag);showProps(obj);render();
}

function removeTag(idx){
  var obj=objects.find(function(o){return o.id===selectedId;});if(!obj)return;
  saveUndoState('删除标签');
  obj.tags.splice(idx,1);showProps(obj);render();
}

function updateStatus(){
  document.getElementById('statusText').textContent='就绪 | 缩放: '+Math.round(camera.zoom*100)+'% | 对象: '+objects.length;
}

/* ========== Public API ========== */
window.app={
  exportSample:exportSample,showImportModal:showImportModal,doImport:doImport,
  exportData:exportData,clearAll:clearAll,onSearch:onSearch,updateProp:updateProp,
  addTag:addTag,removeTag:removeTag,render:render,_pendingMaterial:null,
  undo:undo,redo:redo,
  copySelected:copySelected,pasteClipboard:pasteClipboard,duplicateSelected:duplicateSelected,
  deleteSelected:deleteSelected,
  ctxAction:ctxAction,
  showToast:showToast
};

document.addEventListener('DOMContentLoaded',init);
})();
</script>
