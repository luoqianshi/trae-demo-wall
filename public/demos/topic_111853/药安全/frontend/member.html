<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药管家 - 家庭药品查询</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/member.css">
</head>
<body>
<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-logo"><span>💊</span> 药管家</div>
        <nav class="sidebar-nav">
            <a href="#" class="active" data-page="medicines">📋 药品浏览</a>
            <a href="#" data-page="family">👨‍👩‍👦 家庭信息</a>
            <a href="#" data-page="videos">📹 服药视频存档</a>
            <a href="#" data-page="postcards">💌 语音明信片</a>
        </nav>
    </aside>

    <main class="main">

        <!-- 异常场景告警顶栏（迭代4 P0：异常实时通道）+ 退出入口（右上角） -->
        <div class="scene-alert-bar" id="scene-alert-bar">
            <div class="top-bar-user">
                <span class="user-avatar" id="top-avatar-m"></span>
                <span class="top-bar-username" id="top-username-m">--</span>
            </div>
            <button class="alert-bell-btn" id="alert-bell-btn" onclick="toggleAlertPanel()">
                <span class="bell-icon">🔔</span>
                <span class="bell-badge" id="alert-badge" style="display:none">0</span>
            </button>
            <button class="btn btn-outline btn-sm" onclick="handleLogout()">退出登录</button>
            <div class="alert-panel" id="alert-panel" style="display:none">
                <div class="alert-panel-header">
                    <strong>异常服药告警</strong>
                    <button class="alert-mark-all" onclick="markAllAlertsRead()">全部标为已读</button>
                </div>
                <div class="alert-panel-list" id="alert-panel-list">
                    <div class="alert-empty">暂无异常告警</div>
                </div>
            </div>
        </div>

        <!-- 家庭药箱（与 admin 端看板一致） -->
        <div id="view-medicines" class="view active">
            <div class="page-header">
                <div><h1>家庭药箱</h1><p class="subtitle" id="member-greeting">欢迎回来</p></div>
                <button class="btn btn-primary btn-sm" onclick="openMemberAddMedicineModal()">+ 添加药品</button>
            </div>

            <!-- 搜索和分类筛选 -->
            <div class="cabinet-toolbar">
                <input type="text" id="cabinet-search" class="cabinet-search-input" placeholder="搜索药品名称或厂商..." oninput="renderCabinetCards()">
                <select id="cabinet-category-filter" class="cabinet-category-select" onchange="renderCabinetCards()">
                    <option value="">全部分类</option>
                </select>
                <button class="btn btn-outline btn-sm cabinet-refresh-btn" onclick="manualRefreshCabinet()" title="刷新药箱数据">↻ 刷新</button>
            </div>

            <!-- 药品卡片网格 -->
            <div class="cabinet-grid" id="cabinet-grid"></div>
            <div class="empty-state" id="cabinet-empty" style="display:none">
                <div class="empty-icon">�</div>
                <p>药箱里还没有药品，点击右上角添加</p>
            </div>
        </div>

        <!-- 家庭信息（只读展示 + 申请加入入口） -->
        <div id="view-family" class="view">
            <div class="page-header">
                <div><h1>家庭信息</h1><p class="subtitle">查看您所在的家庭</p></div>
                <button class="btn btn-outline btn-sm" onclick="openJoinFamilyDialog()" style="margin-left:0.5rem">➕ 申请加入家庭</button>
            </div>
            <div class="family-info-card">
                <div class="family-info-header">
                    <div class="family-icon">🏠</div>
                    <div class="family-title" id="family-name">-</div>
                </div>
                <div class="family-info-body">
                    <div class="family-row">
                        <span class="family-label">邀请码</span>
                        <div style="display:flex;align-items:center;gap:0.5rem;">
                            <span class="family-value" id="family-invite-code">-</span>
                            <button class="btn btn-outline btn-xs" onclick="copyFamilyCode()" title="复制邀请码">复制</button>
                        </div>
                    </div>
                    <div class="family-row">
                        <span class="family-label">管理员</span>
                        <span class="family-value" id="family-admin">-</span>
                    </div>
                    <div class="family-row">
                        <span class="family-label">家庭成员</span>
                        <span class="family-value" id="family-member-count">-</span>
                    </div>
                    <div class="family-members-list" id="family-members-list">
                        <!-- 动态生成 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 服药视频存档 -->
        <div id="view-videos" class="view">
            <div class="page-header">
                <div><h1>服药视频存档</h1><p class="subtitle">查看老人服药交互记录</p></div>
            </div>
            <div class="video-filter-bar">
                <select id="video-scene-filter" onchange="loadMedicationVideos()">
                    <option value="">全部场景</option>
                    <option value="taken">已服药</option>
                    <option value="delay">延迟服药</option>
                    <option value="already_taken">已提前服药</option>
                    <option value="refused_unwell">身体不适</option>
                    <option value="unknown">待确认</option>
                </select>
                <select id="video-sort-filter" onchange="loadMedicationVideos()">
                    <option value="latest">最新优先</option>
                    <option value="abnormal">异常优先</option>
                </select>
            </div>
            <div class="video-grid" id="video-grid">
                <!-- 动态生成 -->
            </div>
            <div class="empty-state" id="video-empty" style="display:none">
                <div class="empty-icon">📹</div>
                <p>暂无服药视频记录</p>
            </div>
        </div>

        <!-- 语音明信片（迭代4 P0：情感联结前端入口） -->
        <div id="view-postcards" class="view">
            <div class="page-header">
                <div><h1>语音明信片</h1><p class="subtitle">来自老人的语音问候</p></div>
            </div>
            <div class="postcard-grid" id="postcard-grid">
                <!-- 动态生成 -->
            </div>
            <div class="empty-state" id="postcard-empty" style="display:none">
                <div class="empty-icon">💌</div>
                <p>暂无语音明信片</p>
            </div>
        </div>

    </main>
</div>

<!-- 添加药品模态框（家庭药箱：admin 和 member 均可操作） -->
<div class="modal-overlay" id="member-add-medicine-modal" style="display:none">
    <div class="modal">
        <h2>添加药品到家庭药箱</h2>
        <div class="form-row">
            <div class="form-group">
                <label>厂商</label>
                <input type="text" id="m-med-manufacturer" placeholder="如：华润三九">
            </div>
            <div class="form-group">
                <label>药品名称 *</label>
                <input type="text" id="m-med-name" placeholder="如：感冒灵颗粒" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>分类</label>
                <select id="m-med-category">
                    <option value="其他">其他</option>
                    <option value="感冒用药">感冒用药</option>
                    <option value="消炎药">消炎药</option>
                    <option value="降压药">降压药</option>
                    <option value="降糖药">降糖药</option>
                    <option value="心脑血管">心脑血管</option>
                    <option value="维生素">维生素</option>
                    <option value="外用品">外用品</option>
                </select>
            </div>
            <div class="form-group">
                <label>保质期（月）</label>
                <input type="number" id="m-med-shelf-life" value="24" min="1" max="120" placeholder="月数">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>生产日期</label>
                <input type="date" id="m-med-prod-date" onchange="memberAutoCalcExpiry()">
            </div>
            <div class="form-group">
                <label>到期日期 *</label>
                <input type="date" id="m-med-expiry" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>存储地点 <button type="button" onclick="openStorageManager()" style="font-size:0.75rem;margin-left:0.3rem;padding:0.15rem 0.4rem;border:1px dashed #ccc;border-radius:4px;background:#f8f8f8;cursor:pointer;">📁 管理</button></label>
                <select id="m-med-storage">
                    <option value="">加载中...</option>
                </select>
            </div>
            <div class="form-group">
                <label>包装总量（库存追踪用）</label>
                <input type="number" id="m-med-pack-total" value="1" min="1" placeholder="如：30片（默认1）">
            </div>
            <div class="form-group">
                <label>单位</label>
                <select id="m-med-unit">
                    <option value="片">片</option>
                    <option value="粒">粒</option>
                    <option value="支">支</option>
                    <option value="袋">袋</option>
                    <option value="盒">盒</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>补货预警（天）</label>
                <input type="number" id="m-med-restock-threshold" value="7" min="1" max="60" placeholder="剩余多少天预警">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-outline" onclick="closeMemberAddMedicineModal()">取消</button>
            <button class="btn btn-primary" onclick="submitMemberAddMedicine()">保存</button>
        </div>
    </div>
</div>

<!-- 家庭药箱：药品编辑模态框（含照片上传） -->
<div class="modal-overlay" id="cabinet-edit-modal" style="display:none">
    <div class="modal modal-wide">
        <h2>编辑药品</h2>
        <input type="hidden" id="cab-edit-id">
        <div class="cab-photo-area">
            <img id="cab-edit-photo" src="" alt="药品照片" style="display:none;max-width:100%;max-height:220px;border-radius:10px;object-fit:cover;margin-bottom:0.5rem">
            <input type="file" id="cab-edit-photo-input" accept="image/*" style="display:none" onchange="onCabinetPhotoSelected(this.files[0])">
            <button class="btn btn-outline btn-sm" type="button" onclick="document.getElementById('cab-edit-photo-input').click()">📷 上传药品照片</button>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>药品名称 *</label>
                <input type="text" id="cab-edit-name" required>
            </div>
            <div class="form-group">
                <label>药厂</label>
                <input type="text" id="cab-edit-manufacturer" placeholder="如：华润三九">
            </div>
        </div>
        <div class="form-group">
            <label>服用方法</label>
            <textarea id="cab-edit-usage" rows="2" placeholder="如：每日3次，每次1片，饭后服用"></textarea>
        </div>
        <div class="form-group">
            <label>存储地点</label>
            <input type="text" id="cab-edit-storage" placeholder="如：客厅药箱 / 冰箱冷藏层">
        </div>
        <div class="form-group">
            <label>备注（可写文字）</label>
            <textarea id="cab-edit-note" rows="2" placeholder="给家人的提醒或说明"></textarea>
        </div>
        <div class="form-actions">
            <button class="btn btn-outline" onclick="closeCabinetEditModal()">取消</button>
            <button class="btn btn-primary" onclick="saveCabinetEdit()">保存</button>
        </div>
    </div>
</div>

<script src="/js/member.js"></script>
</body>
</html>
