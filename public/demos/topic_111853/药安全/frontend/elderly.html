<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>药管家 - 老人端</title>
    <link rel="stylesheet" href="/css/elderly.css">
</head>
<body>

<div class="elderly-app">

    <!-- 顶部操作栏：用户信息 + 退出登录（右上角，与登录入口位置一致） -->
    <div class="elderly-top-bar">
        <div class="elderly-top-user">
            <span class="elderly-top-avatar" id="elderly-top-avatar">·</span>
            <span class="elderly-top-username" id="elderly-top-username">--</span>
        </div>
        <button class="elderly-logout-btn" onclick="handleLogout()">退出登录</button>
    </div>

    <!-- 顶部提示横幅 -->
    <div class="reminder-banner" id="reminder-banner" style="display:none">
        <div class="reminder-banner-text" id="reminder-banner-text"></div>
        <button class="reminder-banner-btn" id="reminder-banner-btn" onclick="quickCheckin()">打卡</button>
    </div>

    <!-- 迭代4 P0：常驻逾期待办栏 -->
    <div class="overdue-todo-bar" id="overdue-todo-bar" style="display:none"></div>

    <!-- 主内容 -->
    <main class="elderly-main">

        <!-- 问候语 -->
        <div class="elderly-header">
            <h1 id="elderly-greeting">您好</h1>
            <p class="elderly-date" id="elderly-date"></p>
        </div>

        <!-- 听听计划：按时间表播报今日服药安排 -->
        <button class="rewind-btn" id="rewind-btn" onclick="replayTodayBroadcast()" title="听听今日服药计划">
            <span class="rewind-icon">📋</span>
            <span class="rewind-text">听听计划</span>
        </button>

        <!-- 今日待服药列表（纵向时间轴） -->
        <section class="medication-section">
            <div class="medication-section-header">
                <h2 class="section-title">今日待服药</h2>
            </div>
            <div class="med-timeline" id="medication-list">
                <!-- 动态生成时间轴 -->
            </div>
            <div class="empty-state" id="medication-empty" style="display:none">
                <div class="empty-icon">✅</div>
                <p>今天没有需要服用的药品</p>
            </div>
        </section>

        <!-- 我的所有药品 -->
        <section class="medication-section">
            <button class="section-toggle" onclick="toggleAllMedicines()">
                <h2 class="section-title">我的所有药品 <span style="font-size:1rem">▶</span></h2>
            </button>
            <div class="medication-list" id="all-medicines-list" style="display:none">
                <!-- 动态生成 -->
            </div>
            <div class="empty-state" id="all-medicines-empty" style="display:none">
                <p>暂无药品记录</p>
            </div>
        </section>

        <!-- 提问区域 -->
        <section class="question-section">
            <h2 class="section-title">有问题吗？</h2>

            <div class="question-input-area">
                <!-- 视频录制（默认显示） -->
                <div id="video-input-area">
                    <div class="video-recorder">
                        <video id="video-preview" autoplay playsinline muted style="display:none;width:100%;max-height:300px;border-radius:var(--elderly-radius-sm);background:#000"></video>
                        <div id="video-placeholder" style="text-align:center;padding:2rem;border:2px dashed var(--elderly-border);border-radius:var(--elderly-radius-sm)">
                            <p style="font-size:1.2rem">点击下方按钮开始录制视频</p>
                        </div>
                        <div class="video-controls">
                            <button class="video-btn start" id="btn-start-video" onclick="startVideoRecording()">
                                <span class="video-btn-icon">●</span>开始录制
                            </button>
                            <button class="video-btn stop" id="btn-stop-video" onclick="stopVideoRecording()" disabled>
                                <span class="video-btn-icon">■</span>停止录制
                            </button>
                        </div>
                        <div class="video-status" id="video-status" style="text-align:center;color:var(--elderly-danger);font-weight:700;margin-top:0.5rem;display:none"></div>
                    </div>
                    <div class="video-send-row">
                        <button class="question-btn video-send-btn" onclick="submitVideoQuestion()" id="btn-submit-video" disabled>
                            <span>✉</span> 发送视频给家人
                        </button>
                    </div>
                </div>

                <!-- 语音输入模式 -->
                <div id="voice-input-area" style="display:none">
                    <button class="question-btn voice" id="btn-voice-ask" onclick="startVoiceAsk()">
                        按住说话
                    </button>
                    <p class="question-hint" id="voice-hint" style="display:none">正在聆听...</p>
                </div>

                <!-- 文字输入（末位） -->
                <div id="text-input-area" style="display:none">
                    <textarea id="question-text" rows="3" placeholder="请输入您的问题，如：这个药怎么吃？"></textarea>
                    <button class="question-btn" onclick="submitTextQuestion()">发送问题</button>
                </div>

                <div class="input-mode-tabs">
                    <button class="input-mode-tab active" onclick="switchElderlyInputMode('video')">视频</button>
                    <button class="input-mode-tab" onclick="switchElderlyInputMode('voice')">语音</button>
                    <button class="input-mode-tab" onclick="switchElderlyInputMode('text')">文字</button>
                </div>
            </div>

            <!-- 问题回复展示 -->
            <div class="replies-section" id="replies-section">
                <h3 class="replies-title">回答记录</h3>
                <div class="replies-list" id="replies-list">
                    <!-- 动态生成 -->
                </div>
                <div class="empty-state" id="replies-empty" style="display:none">
                    <p>暂无回答记录</p>
                </div>
            </div>
        </section>

    </main>

    <!-- 打卡成功动画 -->
    <div class="checkin-overlay" id="checkin-overlay" style="display:none">
        <div class="checkin-animation">
            <div class="checkin-check">✓</div>
            <div class="checkin-text">已记录</div>
        </div>
    </div>

    <!-- 全屏强制服药提醒 Modal -->
    <div class="reminder-modal-overlay" id="reminder-modal-overlay" style="display:none">
        <div class="reminder-modal">
            <div class="reminder-modal-glow"></div>
            <div class="reminder-modal-icon">💊</div>
            <div class="reminder-modal-title" id="reminder-modal-title">服药提醒</div>
            <div class="reminder-modal-medicine" id="reminder-modal-medicine"></div>
            <div class="reminder-modal-dosage" id="reminder-modal-dosage"></div>
            <div class="reminder-modal-hint">请确认您已准备好服药</div>
            <button class="reminder-modal-btn" id="reminder-modal-confirm" onclick="confirmReminderTrigger()">
                我已知晓
            </button>
            <div class="reminder-modal-recording" id="reminder-recording-status" style="display:none">
                <div class="recording-indicator">
                    <span class="recording-dot"></span>
                    <span>正在为您记录服药情况...</span>
                </div>
                <div class="recording-timer" id="recording-timer">00:60</div>
                <div class="recording-hint">请说出您服药的情况，如"已经喝了"或"吃完饭再喝"</div>
            </div>
            <div class="reminder-modal-result" id="reminder-modal-result" style="display:none">
                <div class="result-icon" id="result-icon">✓</div>
                <div class="result-text" id="result-text"></div>
                <button class="reminder-modal-btn result-close-btn" id="result-close-btn" onclick="closeReminderModal()">
                    我知道了
                </button>
            </div>
        </div>
    </div>

    <!-- 迭代5 创新·遗忘时光倒流镜 Modal -->
    <div class="rewind-overlay" id="rewind-overlay" style="display:none">
        <div class="rewind-modal">
            <div class="rewind-watermark" id="rewind-watermark">已服药 ✓</div>
            <div class="rewind-title" id="rewind-title">您刚才服药的记录</div>
            <div id="rewind-content"></div>
            <button class="rewind-close-btn" onclick="closeRewindModal()">看清楚了，放心吧</button>
        </div>
    </div>

</div>

<script src="/js/elderly.js"></script>
</body>
</html>
