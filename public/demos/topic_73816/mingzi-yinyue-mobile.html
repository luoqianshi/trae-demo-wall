        '江':'j','史':'sh','顾':'g','侯':'h','邵':'sh','孟':'m','龙':'l',
        '万':'w','段':'d','雷':'l','钱':'q','汤':'t','尹':'y','黎':'l',
        '易':'y','常':'ch','武':'w','乔':'q','贺':'h','赖':'l','龚':'g',
        '文':'w',
        '明':'m','华':'h','国':'g','建':'j','文':'w','平':'p','东':'d',
        '强':'q','伟':'w','军':'j','杰':'j','磊':'l','涛':'t','洋':'y',
        '勇':'y','艳':'y','静':'j','敏':'m','丽':'l','娜':'n',
        '秀':'x','英':'y','慧':'h','巧':'q','美':'m','娟':'j','兰':'l',
        '桂':'g','珍':'zh','凤':'f','玉':'y','淑':'sh','云':'y','莲':'l',
        '萍':'p','红':'h','玲':'l','飞':'f','博':'b','宇':'y',
        '浩':'h','然':'r','子':'z','思':'s','梦':'m','雪':'x','雨':'y',
        '晨':'ch','阳':'y','若':'r','欣':'x','怡':'y','可':'k','佳':'j',
        '诗':'sh','雅':'y','睿':'r','泽':'z','昊':'h','天':'t','晓':'x',
        '潇':'x','逸':'y','嘉':'j','宸':'ch','沐':'m','言':'y',
        '奕':'y','语':'y','彤':'t','萱':'x','涵':'h','悦':'y',
        '晗':'h','蕊':'r','琪':'q','颖':'y','楠':'n','瑞':'r','馨':'x',
        '珊':'sh','宁':'n','熙':'x','妍':'y',
        '菲':'f','冰':'b','洁':'j','雯':'w',
        '晴':'q','蕾':'l','倩':'q','钰':'y','琳':'l','芷':'zh','萌':'m',
      };
      if (code < 0x4E00) {
        const c = char.toLowerCase();
        for (const init of PINYIN_INITIALS) { if (c.startsWith(init)) return init; }
        return '';
      }
      if (surnamePinyin[char]) return surnamePinyin[char];
      const initials = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w'];
      return initials[code % initials.length];
    }

    function getPinyinInitial(char) {
      const code = char.charCodeAt(0);
      if (code < 0x4E00) return '';
      return getPinyinInitialFromTable(char, code);
    }

    function getSolfege(char) {
      const initial = getPinyinInitial(char);
      if (initial && INITIAL_MAP[initial]) return INITIAL_MAP[initial];
      if (initial && initial.length > 0) {
        const extraMap = {
          'zh': 'Mi', 'ch': 'Ti', 'sh': 'Mi',
          'g': 'Sol', 'k': 'Sol', 'h': 'Fa',
          'j': 'Ti', 'q': 'Ti', 'x': 'Ti',
          'b': 'Mi', 'p': 'Mi', 'n': 'La',
          'y': 'La', 'w': 'Do'
        };
        if (extraMap[initial]) return extraMap[initial];
      }
      const code = char.charCodeAt(0);
      return SOLFEGE_KEYS[code % SOLFEGE_KEYS.length];
    }

    function generateNotesFromName(name) {
      const notes = [];
      for (let i = 0; i < name.length; i++) notes.push(getSolfege(name[i]));
      return notes;
    }

    /* ===== Web Audio Synthesizer ===== */
    let audioCtx = null, masterGain = null, analyser = null;
    let scheduledSources = [], playTimeoutIds = [];

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.5;
      const convolver = audioCtx.createConvolver();
      const rate = audioCtx.sampleRate;
      const length = rate * 1.5;
      const impulse = audioCtx.createBuffer(2, length, rate);
      for (let ch = 0; ch < 2; ch++) {
        const data = impulse.getChannelData(ch);
        for (let i = 0; i < length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.5) * 0.3;
        }
      }
      convolver.buffer = impulse;
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      const dryGain = audioCtx.createGain();
      dryGain.gain.value = 0.7;
      masterGain.connect(dryGain);
      dryGain.connect(analyser);
      const wetGain = audioCtx.createGain();
      wetGain.gain.value = 0.3;
      masterGain.connect(convolver);
      convolver.connect(wetGain);
      wetGain.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    function playNote(freq, startTime, duration, velocity) {
      const osc1 = audioCtx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.value = freq;
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'triangle';
      osc2.frequency.value = freq * 2;
      const osc3 = audioCtx.createOscillator();
      osc3.type = 'sine';
      osc3.frequency.value = freq * 0.5;
      const noteGain = audioCtx.createGain();
      const vel = velocity * 0.35;
      noteGain.gain.setValueAtTime(0, startTime);
      noteGain.gain.linearRampToValueAtTime(vel, startTime + 0.03);
      noteGain.gain.linearRampToValueAtTime(vel * 0.8, startTime + 0.1);
      noteGain.gain.linearRampToValueAtTime(vel * 0.6, startTime + duration * 0.5);
      noteGain.gain.linearRampToValueAtTime(0, startTime + duration);
      const harmGain = audioCtx.createGain();
      harmGain.gain.setValueAtTime(0, startTime);
      harmGain.gain.linearRampToValueAtTime(vel * 0.15, startTime + 0.03);
      harmGain.gain.linearRampToValueAtTime(0, startTime + duration * 0.8);
      const subGain = audioCtx.createGain();
      subGain.gain.setValueAtTime(0, startTime);
      subGain.gain.linearRampToValueAtTime(vel * 0.1, startTime + 0.05);
      subGain.gain.linearRampToValueAtTime(0, startTime + duration * 0.6);
      osc1.connect(noteGain);
      osc2.connect(harmGain);
      osc3.connect(subGain);
      noteGain.connect(masterGain);
      harmGain.connect(masterGain);
      subGain.connect(masterGain);
      osc1.start(startTime);
      osc1.stop(startTime + duration + 0.1);
      osc2.start(startTime);
      osc2.stop(startTime + duration + 0.1);
      osc3.start(startTime);
      osc3.stop(startTime + duration + 0.1);
      scheduledSources.push(osc1, osc2, osc3);
    }

    function generateMelody(notes) {
      const melody = [];
      const baseDur = 0.45;
      for (let i = 0; i < notes.length; i++) {
        const dur = (i % 2 === 0) ? baseDur * 1.2 : baseDur * 0.8;
        melody.push({ note: notes[i], duration: dur, velocity: 0.6 + Math.sin(i) * 0.15 });
      }
      return { melody, totalDur: melody.reduce((s, n) => s + n.duration, 0) };
    }

    function playMelody() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      stopMelody();
      const notes = generateNotesFromName(currentName);
      const { melody, totalDur } = generateMelody(notes);
      let t = audioCtx.currentTime + 0.1;
      for (const n of melody) {
        const freq = SOLFEGE[n.note] ? SOLFEGE[n.note].freq : 261.63;
        if (freq) {
          playNote(freq, t, n.duration, n.velocity);
          const noteIndex = melody.indexOf(n);
          const delay = (t - audioCtx.currentTime) * 1000;
          const tid = setTimeout(() => highlightNote(noteIndex), delay);
          playTimeoutIds.push(tid);
        }
        t += n.duration;
      }
      const endTid = setTimeout(() => { if (isPlaying) stopPlayback(); }, (totalDur + 0.3) * 1000);
      playTimeoutIds.push(endTid);
      const secs = Math.ceil(totalDur);
      document.getElementById('durationDisplay').textContent =
        `0${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    }

    function stopMelody() {
      scheduledSources.forEach(s => { try { s.stop(); } catch(e) {} });
      scheduledSources = [];
      playTimeoutIds.forEach(id => clearTimeout(id));
      playTimeoutIds = [];
    }

    function highlightNote(index) {
      const pills = document.querySelectorAll('.note-pill');
      pills.forEach((p, i) => {
        if (i === index) {
          p.style.transform = 'scale(1.12)';
          p.style.boxShadow = '0 3px 10px rgba(0,0,0,0.12)';
        } else {
          p.style.transform = '';
          p.style.boxShadow = '';
        }
      });
    }

    function clearNoteHighlights() {
      document.querySelectorAll('.note-pill').forEach(p => {
        p.style.transform = '';
        p.style.boxShadow = '';
      });
    }

    /* ===== State ===== */
    let currentName = '';
    let isPlaying = false;
    let genAnimId = null;
    let vizAnimId = null;

    /* ===== Screen Management ===== */
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      const screen = document.getElementById(id);
      screen.classList.remove('hidden');
      screen.classList.add('fade-in');
    }

    function startGenerate() {
      const input = document.getElementById('nameInput');
      const name = input.value.trim();
      if (!name) {
        showToast('请输入你的名字');
        input.focus();
        return;
      }
      currentName = name;
      document.getElementById('genName').textContent = name;
      const inputScreen = document.getElementById('screen-input');
      inputScreen.classList.add('fade-out');
      setTimeout(() => {
        inputScreen.classList.add('hidden');
        inputScreen.classList.remove('fade-out');
        showScreen('screen-generating');
        startGenAnimation();
      }, 400);
    }

    document.getElementById('nameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') startGenerate();
    });

    /* ===== Generating Animation (mobile optimized) ===== */
    function startGenAnimation() {
      const canvas = document.getElementById('genCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const size = 180;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.scale(dpr, dpr);

      let progress = 0;
      const noteChars = ['\u266A','\u266B','\u266C','\u2669'];
      const colors = ['#8b5cf6','#ec4899','#f59e0b','#06b6d4','#10b981'];
      const floatingNotes = [];

      function spawnNote() {
        const angle = Math.random() * Math.PI * 2;
        const dist = 25 + Math.random() * 45;
        floatingNotes.push({
          x: size / 2 + Math.cos(angle) * dist,
          y: size / 2 + Math.sin(angle) * dist,
          char: noteChars[Math.floor(Math.random() * noteChars.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          scale: 0.5 + Math.random() * 0.9,
          speed: 0.4 + Math.random() * 1,
          angle: angle,
        });
      }

      function draw() {
        ctx.clearRect(0, 0, size, size);
        progress += 0.012;

        // Orbiting dots
        const numDots = 10;
        for (let i = 0; i < numDots; i++) {
          const a = (i / numDots) * Math.PI * 2 + progress * 3;
          const r = 35 + Math.sin(progress * 5 + i) * 8;
          const dx = size / 2 + Math.cos(a) * r;
          const dy = size / 2 + Math.sin(a) * r;
          ctx.beginPath();
          ctx.arc(dx, dy, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = colors[i % colors.length];
          ctx.globalAlpha = 0.5 + Math.sin(progress * 4 + i) * 0.25;
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Central orb
        const orbRadius = 26 + Math.sin(progress * 3) * 5;
        const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, orbRadius);
        grad.addColorStop(0, '#c084fc');
        grad.addColorStop(0.5, '#f472b6');
        grad.addColorStop(1, '#f59e0b');
        ctx.beginPath();
        ctx.arc(size/2, size/2, orbRadius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Progress ring
        ctx.beginPath();
        ctx.arc(size/2, size/2, 68, -Math.PI/2, -Math.PI/2 + progress * Math.PI * 2);
        const ringGrad = ctx.createLinearGradient(0, 0, size, size);
        ringGrad.addColorStop(0, '#8b5cf6');
        ringGrad.addColorStop(0.3, '#ec4899');
        ringGrad.addColorStop(0.6, '#f59e0b');
        ringGrad.addColorStop(1, '#06b6d4');
        ctx.strokeStyle = ringGrad;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Floating notes
        if (Math.random() < 0.16) spawnNote();
        for (let i = floatingNotes.length - 1; i >= 0; i--) {
          const n = floatingNotes[i];
          n.alpha -= 0.012;
          n.x += Math.cos(n.angle) * n.speed;
          n.y += Math.sin(n.angle) * n.speed - 0.35;
          if (n.alpha <= 0) { floatingNotes.splice(i, 1); continue; }
          ctx.save();
          ctx.globalAlpha = n.alpha;
          ctx.font = `${14 * n.scale}px serif`;
          ctx.fillStyle = n.color;
          ctx.fillText(n.char, n.x, n.y);
          ctx.restore();
        }

        if (progress < 1) {
          genAnimId = requestAnimationFrame(draw);
        } else {
          setTimeout(() => showResult(), 350);
        }
      }
      draw();
    }

    /* ===== Result ===== */
    function showResult() {
      document.getElementById('resultName').textContent = currentName;
      document.getElementById('screen-generating').classList.add('hidden');
      showScreen('screen-result');

      const notes = generateNotesFromName(currentName);
      const initials = [];
      for (let i = 0; i < currentName.length; i++) initials.push(getPinyinInitial(currentName[i]));

      const container = document.getElementById('notesDisplay');
      container.innerHTML = '';
      notes.forEach((note, i) => {
        const pill = document.createElement('span');
        pill.className = 'note-pill';
        const info = SOLFEGE[note];
        pill.textContent = info ? info.label : note;
        pill.title = `${currentName[i]} → ${initials[i] || '?'} → ${note}`;
        pill.style.opacity = '0';
        pill.style.transform = 'translateY(12px) scale(0.85)';
        container.appendChild(pill);
        setTimeout(() => {
          pill.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
          pill.style.opacity = '1';
          pill.style.transform = 'translateY(0) scale(1)';
        }, 120 + i * 90);
      });

      const reveal = document.getElementById('pinyinReveal');
      reveal.innerHTML = currentName.split('').map((c, i) => {
        return `<strong>${c}</strong><span class="pinyin-arrow">&#10132;</span>${initials[i] || '?'}<span class="pinyin-arrow">&#10132;</span><strong>${notes[i]}</strong>`;
      }).join('&nbsp;');

      startVisualizer();
    }

    /* ===== Visualizer ===== */
    let analyserData = null;
    const vizColors = ['#8b5cf6','#a855f7','#ec4899','#f472b6','#f59e0b','#fbbf24','#06b6d4'];

    function startVisualizer() {
      const canvas = document.getElementById('vizCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      const w = rect.width;
      const h = rect.height;
      analyserData = new Uint8Array(analyser ? analyser.frequencyBinCount : 24);
      let time = 0;

      function draw() {
        ctx.clearRect(0, 0, w, h);
        time += 0.03;

        let hasData = false;
        if (analyser && isPlaying) {
          analyser.getByteFrequencyData(analyserData);
          for (let i = 0; i < analyserData.length; i++) {
            if (analyserData[i] > 5) { hasData = true; break; }
          }
        }

        const barCount = hasData ? analyserData.length : 20;
        const barWidth = w / barCount;
        const gap = 3;

        for (let i = 0; i < barCount; i++) {
          let height;
          if (hasData && isPlaying) {
            height = (analyserData[i] / 255) * h * 0.8;
          } else if (isPlaying) {
            const base = Math.sin(time + i * 0.3) * 0.5 + 0.5;
            const beat = Math.sin(time * 3) * 0.3 + 0.7;
            height = base * beat * h * 0.6;
          } else {
            height = (Math.sin(i * 0.4 + time * 0.5) * 0.15 + 0.2) * h * 0.65;
          }
          height = Math.max(5, height);
          const x = i * barWidth + gap / 2;
          const y = h - height;
          const bw = barWidth - gap;
          const colorIdx = Math.floor((i / barCount) * vizColors.length);
          const color = vizColors[colorIdx];

          const radius = Math.min(bw / 2, 6);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.lineTo(x + bw - radius, y);
          ctx.quadraticCurveTo(x + bw, y, x + bw, y + radius);
          ctx.lineTo(x + bw, h);
          ctx.lineTo(x, h);
          ctx.lineTo(x, y + radius);
          ctx.quadraticCurveTo(x, y, x + radius, y);
          ctx.closePath();

          const grad = ctx.createLinearGradient(0, y, 0, h);
          grad.addColorStop(0, color);
          grad.addColorStop(1, color + '30');
          ctx.fillStyle = grad;
          ctx.fill();
        }
        vizAnimId = requestAnimationFrame(draw);
      }
      draw();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const overlay = document.getElementById('playOverlay');
      const btn = document.getElementById('playBtn');
      if (isPlaying) {
        overlay.classList.add('hidden');
        btn.innerHTML = '&#9646;&#9646;';
        playMelody();
      } else {
        stopPlayback();
      }
    }

    function stopPlayback() {
      isPlaying = false;
      stopMelody();
      clearNoteHighlights();
      document.getElementById('playOverlay').classList.remove('hidden');
      document.getElementById('playBtn').innerHTML = '&#9654;';
    }

    function shareMusic() {
      drawShareCard();
      document.getElementById('shareOverlay').classList.add('show');
    }

    function hideShareCard(e) {
      if (e && e.target !== e.currentTarget && !e.target.classList.contains('share-card-close')) return;
      document.getElementById('shareOverlay').classList.remove('show');
    }

    function drawShareCard() {
      const canvas = document.getElementById('shareCardCanvas');
      const w = 375, h = 580;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      // Background gradient
      const bgGrad = ctx.createLinearGradient(0, 0, w, h);
      bgGrad.addColorStop(0, '#7c3aed');
      bgGrad.addColorStop(0.4, '#a855f7');
      bgGrad.addColorStop(0.7, '#ec4899');
      bgGrad.addColorStop(1, '#f97316');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Decorative blobs
      ctx.filter = 'blur(50px)';
      ctx.beginPath();
      ctx.arc(-30, 80, 140, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(139, 92, 246, 0.4)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(w + 20, h * 0.6, 160, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(236, 72, 153, 0.35)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(w * 0.3, h + 20, 120, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(249, 115, 22, 0.3)';
      ctx.fill();
      ctx.filter = 'none';

      // Subtle pattern dots
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let i = 0; i < 80; i++) {
        const dx = (i * 47) % w;
        const dy = (i * 73 + 30) % h;
        ctx.beginPath();
        ctx.arc(dx, dy, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Top brand area
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '700 15px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText('名字音乐', w / 2, 55);

      // Small music note icon
      ctx.font = '18px serif';
      ctx.fillText('\u266A', w / 2, 80);

      // Divider line
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(w * 0.25, 100);
      ctx.lineTo(w * 0.75, 100);
      ctx.stroke();

      // User name (large)
      ctx.fillStyle = '#fff';
      ctx.font = '700 48px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText(currentName, w / 2, 190);

      // Subtitle
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '400 15px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillText('对应的唱名是', w / 2, 225);

      // Solfege pills
      const notes = generateNotesFromName(currentName);
      const initials = [];
      for (let i = 0; i < currentName.length; i++) initials.push(getPinyinInitial(currentName[i]));

      const pillColors = [
        { bg: '#ede9fe', text: '#7c3aed' },
        { bg: '#fce7f3', text: '#db2777' },
        { bg: '#fef3c7', text: '#d97706' },
        { bg: '#ccfbf1', text: '#0d9488' },
        { bg: '#dbeafe', text: '#2563eb' },
        { bg: '#ffe4e6', text: '#e11d48' },
        { bg: '#d1fae5', text: '#059669' }
      ];

      const pillH = 42;
      const pillGap = 10;
      const startY = 260;
      const pillW = Math.min(80, (w - 60 - (notes.length - 1) * pillGap) / notes.length);
      const totalW = notes.length * pillW + (notes.length - 1) * pillGap;
      let startX = (w - totalW) / 2;

      notes.forEach((note, i) => {
        const info = SOLFEGE[note];
        const label = info ? info.label : note;
        const pc = pillColors[i % pillColors.length];
        const px = startX + i * (pillW + pillGap);
        const py = startY;

        // Pill background
        ctx.fillStyle = pc.bg;
        roundRect(ctx, px, py, pillW, pillH, 10);
        ctx.fill();

        // Character
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.font = '400 11px ' + getComputedStyle(document.body).fontFamily;
        ctx.textAlign = 'center';
        ctx.fillText(currentName[i], px + pillW / 2, py + 17);

        // Solfege
        ctx.fillStyle = pc.text;
        ctx.font = '700 14px ' + getComputedStyle(document.body).fontFamily;
        ctx.fillText(label, px + pillW / 2, py + 35);
      });

      // Mapping line
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '400 13px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      const mapText = currentName.split('').map((c, i) => `${c}→${initials[i] || '?'}`).join('  ');
      ctx.fillText(mapText, w / 2, startY + pillH + 28);

      // Bottom area
      const bottomY = h - 100;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      roundRect(ctx, 30, bottomY, w - 60, 60, 14);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = '700 18px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText('你的名字，就是一首歌', w / 2, bottomY + 30);

      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '400 12px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillText('长按保存图片 · 分享好友', w / 2, bottomY + 52);

      // Corner decorations
      ctx.font = '28px serif';
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillText('\u266B', 20, 50);
      ctx.fillText('\u266C', w - 45, h - 30);
      ctx.fillText('\u266A', w - 40, 70);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function resetDemo() {
      stopPlayback();
      if (vizAnimId) cancelAnimationFrame(vizAnimId);
      if (genAnimId) cancelAnimationFrame(genAnimId);
      document.getElementById('nameInput').value = '';
      document.getElementById('screen-result').classList.add('hidden');
      showScreen('screen-input');
      document.getElementById('playOverlay').classList.remove('hidden');
      document.getElementById('playBtn').innerHTML = '&#9654;';
      document.getElementById('pinyinReveal').innerHTML = '';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
