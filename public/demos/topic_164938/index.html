<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyFlow Agent — Learning Codex</title>
  <style>
    :root {
      /* Apple HIG light theme (default) */
      --bg: #F2F2F7; --bg-elevated: #FFFFFF; --surface: #FFFFFF; --surface-2: #F9F9FB; --surface-hover: #F0F0F5; --surface-active: #E5E5EA;
      --border: rgba(60,60,67,0.12); --border-hover: rgba(60,60,67,0.18); --border-active: rgba(60,60,67,0.29);
      --separator: rgba(60,60,67,0.12); --separator-strong: rgba(60,60,67,0.29);
      --text: #1C1C1E; --text-secondary: rgba(60,60,67,0.60); --text-muted: #8E8E93; --text-faint: #C7C7CC;
      --accent: #007AFF; --accent-hover: #0066CC; --accent-soft: rgba(0,122,255,0.10); --accent-glow: 0 2px 12px rgba(0,122,255,0.18);
      --blue: #0A84FF; --blue-soft: rgba(10,132,255,0.10); --gold: #FF9500; --gold-soft: rgba(255,149,0,0.10);
      --red: #FF3B30; --red-soft: rgba(255,59,48,0.10); --purple: #AF52DE; --purple-soft: rgba(175,82,222,0.10);
      --teal: #30B0C7; --teal-soft: rgba(48,176,199,0.10); --green: #34C759; --green-soft: rgba(52,199,89,0.10);
      --indigo: #5856D6; --orange: #FF9500; --pink: #FF2D55; --yellow: #FFCC00; --mint: #00C7BE;
      /* Activity Rings palette (Apple Watch signature) */
      --ring-understanding: #0A84FF; --ring-memory: #30D158; --ring-application: #FF9F0A; --ring-expression: #BF5AF2; --ring-readiness: #FF3B30;
      /* Radii */
      --radius-xs: 8px; --radius: 12px; --radius-lg: 16px; --radius-xl: 20px; --radius-2xl: 28px; --radius-pill: 9999px;
      /* Multi-layer soft shadows (Apple depth) */
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.06);
      --shadow-xl: 0 24px 60px rgba(0,0,0,0.16);
      /* Typography — SF Pro first */
      --font-serif: 'New York', 'PingFang SC', 'Source Han Serif SC', 'Noto Serif SC', Georgia, 'Times New Roman', serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --font-mono: 'SF Mono', ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      /* Motion */
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); --ease-decel: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 0.2s; --dur: 0.35s; --dur-slow: 0.5s;
      /* Vibrancy (frosted glass) */
      --vibrancy: blur(20px) saturate(180%); --vibrancy-light: rgba(242,242,247,0.72);
    }
    [data-theme="dark"] {
      --bg: #000000; --bg-elevated: #1C1C1E; --surface: #1C1C1E; --surface-2: #2C2C2E; --surface-hover: #3A3A3C; --surface-active: #48484A;
      --border: rgba(84,84,88,0.36); --border-hover: rgba(84,84,88,0.60); --border-active: rgba(84,84,88,0.80);
      --separator: rgba(84,84,88,0.36); --separator-strong: rgba(84,84,88,0.60);
      --text: #FFFFFF; --text-secondary: rgba(235,235,245,0.60); --text-muted: #8E8E93; --text-faint: #545458;
      --accent: #0A84FF; --accent-hover: #409CFF; --accent-soft: rgba(10,132,255,0.18); --accent-glow: 0 2px 16px rgba(10,132,255,0.45);
      --blue: #0A84FF; --blue-soft: rgba(10,132,255,0.18); --gold: #FF9F0A; --gold-soft: rgba(255,159,10,0.18);
      --red: #FF453A; --red-soft: rgba(255,69,58,0.18); --purple: #BF5AF2; --purple-soft: rgba(191,90,242,0.18);
      --teal: #40C8E0; --teal-soft: rgba(64,200,224,0.18); --green: #30D158; --green-soft: rgba(48,209,88,0.18);
      --indigo: #5E5CE6; --orange: #FF9F0A; --pink: #FF375F; --yellow: #FFD60A; --mint: #66D4CF;
      --ring-understanding: #0A84FF; --ring-memory: #30D158; --ring-application: #FF9F0A; --ring-expression: #BF5AF2; --ring-readiness: #FF453A;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.7), 0 4px 8px rgba(0,0,0,0.5);
      --shadow-xl: 0 24px 60px rgba(0,0,0,0.8);
      --vibrancy-light: rgba(28,28,30,0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100vh; overflow: hidden; color: var(--text); background: var(--bg); font: 15px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
    /* Apple app shell: sidebar + main column */
    .app-shell { height: 100vh; display: grid; grid-template-columns: 240px 1fr; overflow: hidden; }
    .sidebar { background: var(--vibrancy-light); -webkit-backdrop-filter: var(--vibrancy); backdrop-filter: var(--vibrancy); border-right: 1px solid var(--separator); display: flex; flex-direction: column; padding: 16px 12px; gap: 8px; overflow-y: auto; }
    .sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
    .sidebar .mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: linear-gradient(135deg, #0A84FF, #5AC8FA); color: #fff; font: 800 14px var(--font-sans); box-shadow: var(--shadow-sm); flex-shrink: 0; }
    .sidebar .brand-text strong { font: 700 15px var(--font-display); display: block; letter-spacing: -0.4px; line-height: 1.2; }
    .sidebar .brand-text span { display: block; color: var(--text-muted); font: 400 11px var(--font-sans); line-height: 1.3; }
    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); color: var(--text-secondary); font: 500 14px var(--font-sans); transition: all var(--dur-fast) var(--ease-standard); border: none; background: none; cursor: pointer; text-align: left; width: 100%; }
    .side-nav .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .side-nav .nav-item.active { background: var(--accent-soft); color: var(--accent); }
    .side-nav .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .sidebar-missions { margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--separator); display: flex; flex-direction: column; gap: 8px; }
    .sidebar-missions-title { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font: 700 10px var(--font-sans); color: var(--text-faint); letter-spacing: 0.6px; text-transform: uppercase; }
    .sidebar-goal-btn { border: 1px solid var(--separator); background: var(--surface); border-radius: var(--radius-pill); padding: 3px 7px; font: 700 10px var(--font-sans); color: var(--accent); cursor: pointer; }
    .sidebar-goal-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    .sidebar-mission-card { width: 100%; text-align: left; padding: 10px 10px; border: 1px solid transparent; border-radius: var(--radius); background: transparent; color: var(--text-secondary); cursor: pointer; transition: all var(--dur-fast) var(--ease-standard); }
    .sidebar-mission-card:hover { background: var(--surface-hover); color: var(--text); }
    .sidebar-mission-card.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
    .sidebar-mission-title { font: 600 12px/1.35 var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-mission-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 400 10px var(--font-sans); color: var(--text-muted); }
    .sidebar-mission-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
    .sidebar-mission-dot.running { background: var(--accent); }
    .sidebar-mission-dot.paused { background: var(--gold); }
    .sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--separator); display: flex; flex-direction: column; gap: 4px; }
    .sidebar-footer .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); color: var(--text-secondary); font: 500 14px var(--font-sans); transition: all var(--dur-fast) var(--ease-standard); border: none; background: none; cursor: pointer; text-align: left; width: 100%; }
    .sidebar-footer .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .sidebar-footer .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .main-col { display: grid; grid-template-rows: auto minmax(0,1fr) auto; min-height: 0; overflow: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 24px; background: var(--vibrancy-light); -webkit-backdrop-filter: var(--vibrancy); backdrop-filter: var(--vibrancy); border-bottom: 1px solid var(--separator); min-height: 52px; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .topbar button[onclick="Modal.openGoal()"] { display: none; }
    .top-flow-lights { flex: 1 1 auto; min-width: 300px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; overflow: hidden; padding: 0 44px 0 24px; }
    .flow-light-step { min-width: 0; display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: var(--radius-pill); color: var(--text-faint); font: 700 12px var(--font-sans); white-space: nowrap; }
    .flow-light-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); opacity: 0.5; flex-shrink: 0; }
    .flow-light-step.done { color: var(--green); }
    .flow-light-step.done .flow-light-dot { background: var(--green); opacity: 1; box-shadow: 0 0 8px rgba(8,127,91,0.35); }
    .flow-light-step.active { color: var(--accent); background: var(--accent-soft); }
    .flow-light-step.active .flow-light-dot { background: var(--accent); opacity: 1; box-shadow: 0 0 10px rgba(10,132,255,0.45); animation: pulse 1.8s infinite; }
    .flow-light-step.pending .flow-light-label { opacity: 0.75; }
    .select { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); color: var(--text); padding: 6px 10px; font: 500 12px var(--font-sans); outline: none; transition: all var(--dur-fast) var(--ease-standard); }
    .select:hover { border-color: var(--border-hover); }
    .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .large-title { padding: 24px 24px 8px; }
    .large-title h1 { font: 700 34px/1.15 var(--font-display); letter-spacing: -0.6px; color: var(--text); }
    .large-title p { font: 400 15px var(--font-sans); color: var(--text-secondary); margin-top: 4px; }
    .statusbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 24px; background: var(--vibrancy-light); -webkit-backdrop-filter: var(--vibrancy); backdrop-filter: var(--vibrancy); border-top: 1px solid var(--separator); font: 400 11px var(--font-sans); color: var(--text-muted); }
    .status-left, .status-right { display: flex; align-items: center; gap: 16px; }
    .status-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .status-dot.idle { background: var(--gold); }
    .status-dot.waiting { background: var(--blue); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .main { min-height: 0; overflow: auto; padding: 12px 24px 24px; }
    .dynamic-island { position: fixed; top: 8px; left: 50%; transform: translateX(-50%) translateY(-100%); z-index: 200; background: #000; color: #fff; border-radius: var(--radius-2xl); padding: 6px 16px; font: 600 13px var(--font-sans); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px; transition: all var(--dur) var(--ease-spring); cursor: pointer; max-width: 90vw; opacity: 0; pointer-events: none; }
    .dynamic-island.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .dynamic-island .island-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    .activity-rings { display: block; max-width: 100%; height: auto; }
    .commit-tree { padding: 8px 4px; display: flex; justify-content: flex-start; }
    .commit-tree svg { display: block; width: min(100%, 420px); height: auto; }
    .commit-tree text { user-select: none; }
    .bottom-tabs { display: none; }
    .workspace { width: 100%; max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "runtime state" "commits state"; gap: 20px; align-items: start; }
    .workspace > .mission-strip { display: none; }
    .left-col { grid-area: side; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    .mission-strip { grid-area: missions; display: flex; flex-direction: column; position: sticky; top: 20px; }
    .ms-row { display: flex; flex-direction: column; gap: 12px; overflow: visible; padding-bottom: 0; }
    .ms-card { width: 100%; display: block; text-align: left; padding: 14px 16px; border: 1px solid var(--separator); border-radius: var(--radius); background: var(--surface); color: var(--text); transition: all var(--dur-fast) var(--ease-standard); }
    .ms-card:hover { background: var(--surface-hover); }
    .ms-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .ms-card .ms-title { font: 600 14px var(--font-sans); margin-bottom: 4px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ms-card .ms-meta { font: 400 12px var(--font-sans); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .runtime-panel { grid-area: runtime; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    .learning-commits { grid-area: commits; }
    .artifact-tray { width: 100%; }
    .workspace > .artifact-tray { display: none; }
    .artifact-tray-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .at-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--separator); border-radius: var(--radius); background: var(--surface); transition: background var(--dur-fast) var(--ease-standard); }
    .at-item:hover { background: var(--surface-hover); }
    .at-item .at-icon { font: 700 16px var(--font-mono); color: var(--text-secondary); line-height: 1; flex-shrink: 0; }
    .at-item .at-type { font: 700 11px var(--font-sans); color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .at-item .at-title { font: 400 13px var(--font-sans); color: var(--text-secondary); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artifact-tray .panel-head > span:first-child { font-size: 0; }
    .artifact-tray .panel-head > span:first-child::before { content: 'Artifacts'; font: 600 13px var(--font-sans); color: var(--text-muted); }
    .commit-timeline { display: flex; flex-direction: column; }
    .commit-timeline .ct-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border: none; border-bottom: 1px solid var(--separator); border-radius: 0; background: transparent; flex-wrap: wrap; font: 400 13px var(--font-mono); }
    .commit-timeline .ct-item:last-child { border-bottom: 0; }
    .commit-timeline .ci-time { font: 400 11px var(--font-mono); color: var(--text-faint); white-space: nowrap; }
    .commit-timeline .ci-summary { font: 600 13px var(--font-sans); color: var(--text); flex: 1; min-width: 0; }
    .commit-timeline .ci-diff { display: flex; gap: 6px; flex-wrap: wrap; }
    .runtime-log { font: 400 12px var(--font-mono); color: var(--text-secondary); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin: 12px 0; }
    .runtime-log .rl-line { white-space: pre-wrap; word-break: break-all; line-height: 1.7; }
    .page-layout { width: 100%; max-width: 1600px; margin: 0 auto; display: flex; gap: 20px; align-items: flex-start; }
    .page-layout .mission-list { flex: 0 0 280px; width: 280px; grid-area: auto; }
    .page-content { flex: 1; min-width: 0; }
    .page-content > .card { width: 100%; }
    .card { background: var(--surface); border: 1px solid var(--separator); border-radius: var(--radius-lg); overflow: hidden; transition: box-shadow var(--dur-fast) var(--ease-standard); box-shadow: var(--shadow-xs); }
    .card:hover { box-shadow: var(--shadow-sm); }
    .pad { padding: 20px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .between { justify-content: space-between; }
    .muted { color: var(--text-secondary); }
    .faint { color: var(--text-faint); }
    .small { font-size: 13px; }
    .mono { font-family: var(--font-mono); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--separator); }
    .panel-head > span:first-child { font: 600 13px var(--font-sans); color: var(--text-muted); }
    .panel-head .prompt, .panel-head .path { display: none; }
    .panel-head .title { color: var(--text); font-weight: 600; }
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-xs); font: 600 11px var(--font-sans); letter-spacing: 0; text-transform: none; white-space: nowrap; }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.blue { background: var(--blue-soft); color: var(--blue); }
    .badge.gold { background: var(--gold-soft); color: var(--gold); }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.purple { background: var(--purple-soft); color: var(--purple); }
    .badge.faint { background: var(--surface-hover); color: var(--text-muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 16px; border-radius: var(--radius); font: 500 14px var(--font-sans); color: var(--text); background: var(--surface-2); border: 1px solid var(--border); transition: all var(--dur-fast) var(--ease-standard); }
    .btn:hover { background: var(--surface-hover); }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.green { background: var(--green); color: #fff; border-color: var(--green); }
    .btn.sm { min-height: 30px; padding: 0 12px; font-size: 13px; }
    .mission-list { display: flex; flex-direction: column; gap: 16px; }
    .mission-list .card { background: transparent; border: none; box-shadow: none; }
    .mission-card { width: 100%; display: block; text-align: left; border: 1px solid var(--separator); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); color: var(--text); transition: all var(--dur-fast) var(--ease-standard); }
    .mission-card:hover { background: var(--surface-hover); }
    .mission-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .mission-card .mc-title { font: 600 14px var(--font-sans); margin-bottom: 4px; line-height: 1.4; }
    .mission-card .mc-meta { font: 400 12px var(--font-sans); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .mission-card .mc-status { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
    .mission-card .mc-status.running { background: var(--accent); }
    .mission-card .mc-status.paused { background: var(--gold); }
    .mission-card .mc-status.queued { background: var(--text-faint); }
    .run-header { grid-area: header; }
    .run-header-content { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; }
    .workspace-title { font: 700 28px/1.2 var(--font-display); letter-spacing: -0.5px; color: var(--text); }
    .run-card { grid-area: run; min-height: 500px; display: grid; grid-template-rows: auto minmax(0,1fr); }
    .timeline { padding: 16px; overflow: auto; }
    .event { display: grid; grid-template-columns: 32px 24px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--separator); font: 400 14px var(--font-sans); }
    .event:last-child { border-bottom: 0; }
    .event .ln { color: var(--text-faint); text-align: right; font-size: 12px; }
    .event .dot { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font-size: 11px; font-weight: 700; background: var(--surface-hover); color: var(--text-faint); border: 1px solid var(--border); }
    .event .dot.done { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .event .dot.active { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); animation: pulse 2s infinite; }
    .event .label { color: var(--text); font-weight: 600; line-height: 1.4; }
    .event .desc { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
    .event.pending .label { color: var(--text-faint); }

    .debate-score-item .dsi-label { font: 400 11px var(--font-sans); color: var(--text-muted); }
    .debate-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .debate-choice { padding: 12px 16px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--surface); font: 500 14px var(--font-sans); cursor: pointer; transition: all var(--dur-fast) var(--ease-standard); text-align: left; }
    .debate-choice:hover { border-color: var(--accent); background: var(--accent-soft); }

    /* Thermal Map */
    .thermal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 4px; padding: 16px; }
    .thermal-cell { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font: 700 11px var(--font-mono); color: rgba(255,255,255,0.9); cursor: pointer; transition: transform var(--dur-fast) var(--ease-spring); position: relative; }
    .thermal-cell:hover { transform: scale(1.15); z-index: 10; }
    .thermal-cell .tc-tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); padding: 6px 10px; border-radius: 6px; background: #000; color: #fff; font: 400 11px var(--font-sans); white-space: nowrap; margin-bottom: 4px; z-index: 20; }
    .thermal-cell:hover .tc-tooltip { display: block; }
    .entropy-gauge { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); margin: 12px 0; }
    .entropy-bar { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--green), var(--gold), var(--red)); position: relative; }
    .entropy-marker { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: #000; transition: left var(--dur-slow) var(--ease-decel); }

    /* Memory Palace 3D */
    .palace-viewport { perspective: 900px; height: 460px; overflow: hidden; border-radius: var(--radius-xl); background: linear-gradient(180deg, var(--bg-elevated), var(--surface-2)); border: 1px solid var(--border); position: relative; }
    .palace-scene { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s var(--ease-decel); }
    .palace-wall { position: absolute; width: 400px; height: 300px; left: 50%; top: 50%; margin-left: -200px; margin-top: -150px; display: flex; flex-wrap: wrap; gap: 8px; padding: 20px; align-content: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
    .palace-wall .pw-label { width: 100%; font: 700 16px var(--font-display); color: var(--text); margin-bottom: 4px; }
    .palace-card-3d { padding: 10px 12px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); font: 500 12px var(--font-sans); color: var(--text); cursor: pointer; transition: all var(--dur-fast) var(--ease-standard); }
    .palace-card-3d:hover { background: var(--accent-soft); border-color: var(--accent); transform: scale(1.05); }
    .palace-nav { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .palace-nav button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); font: 600 18px var(--font-sans); cursor: pointer; display: grid; place-items: center; transition: all var(--dur-fast) var(--ease-standard); }
    .palace-nav button:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .palace-compass { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; font: 700 12px var(--font-mono); color: var(--text-muted); background: var(--vibrancy-light); backdrop-filter: var(--vibrancy); z-index: 10; }

    /* Parallel Universe */
    .universe-svg { width: 100%; height: 360px; }
    .universe-svg .uni-line { fill: none; stroke-width: 2.5; stroke-linecap: round; transition: opacity var(--dur); }
    .universe-svg .uni-point { transition: all var(--dur); cursor: pointer; }
    .universe-svg .uni-point:hover { r: 8; }
    .universe-svg .uni-label { font: 600 11px var(--font-sans); }
    .universe-controls { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); margin: 12px 0; }
    .universe-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--green), var(--gold), var(--red)); outline: none; }
    .universe-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); cursor: pointer; box-shadow: var(--shadow-sm); }
    .universe-slider::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); cursor: pointer; }
    .universe-stat { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
    .universe-stat .us-val { font: 700 24px var(--font-display); }
    .universe-stat .us-label { font: 400 11px var(--font-sans); color: var(--text-muted); }
    .universe-portals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
    .universe-portal-card { padding: 14px; border-radius: var(--radius-lg); border: 2px solid var(--border); background: var(--surface); cursor: pointer; transition: all var(--dur-fast) var(--ease-spring); text-align: center; }
    .universe-portal-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .universe-portal-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .universe-portal-card .upc-hours { font: 800 28px var(--font-display); }
    .universe-portal-card .upc-label { font: 400 11px var(--font-sans); color: var(--text-muted); }
    .universe-portal-card .upc-result { font: 700 14px var(--font-sans); margin-top: 4px; }

    @media (max-width: 768px) {
      .weather-grid { grid-template-columns: repeat(4, 1fr); }
      .universe-portals { grid-template-columns: repeat(2, 1fr); }
      .thermal-grid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
      .palace-viewport { height: 360px; }
    }

    /* ===== Evidence Chain (证据链 Mastery Model) ===== */
    .evidence-chain { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
    .evidence-badge { padding: 12px 10px; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; transition: all var(--transition); }
    .evidence-badge:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .evidence-badge .eb-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; font: 700 16px var(--font-display); }
    .evidence-badge .eb-name { font: 600 13px var(--font-sans); color: var(--text); }
    .evidence-badge .eb-proof { font: 400 11px var(--font-sans); color: var(--text-secondary); line-height: 1.4; min-height: 28px; }
    .evidence-badge.level-mastered { border-color: var(--green); background: var(--green-soft); }
    .evidence-badge.level-mastered .eb-icon { background: var(--green); color: #fff; }
    .evidence-badge.level-emerging { border-color: var(--gold); background: var(--gold-soft); }
    .evidence-badge.level-emerging .eb-icon { background: var(--gold); color: #fff; }
    .evidence-badge.level-none { border-color: var(--border); background: var(--surface-2); }
    .evidence-badge.level-none .eb-icon { background: var(--text-faint); color: #fff; }
    .evidence-chain-title { font: 600 12px var(--font-mono); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

    /* ===== Commit Log ===== */
    .commit-log { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
    .commit-item { padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 4px; transition: all var(--transition); font-family: var(--font-mono); }
    .commit-item:hover { border-color: var(--border-hover); background: var(--surface-hover); }
    .ci-time { font: 400 10px var(--font-mono); color: var(--text-muted); }
    .ci-summary { font: 600 13px var(--font-sans); color: var(--text); }
    .ci-diff { display: flex; flex-wrap: wrap; gap: 10px; font: 500 11px var(--font-mono); }
    .ci-diff-item { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: var(--radius-pill); background: var(--surface-2); }
    .ci-diff-item.positive { color: var(--green); background: var(--green-soft); }
    .ci-diff-item.negative { color: var(--red); background: var(--red-soft); }
    .ci-diff-item.neutral { color: var(--text-secondary); }
    .ci-diff-item.review { color: var(--accent); background: var(--accent-soft); }
    .commit-log-empty { padding: 16px; text-align: center; color: var(--text-muted); font: 400 12px var(--font-mono); }

    /* ===== Issue Tracker Stats ===== */
    .issue-tracker-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
    .its-item { padding: 12px 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); text-align: center; transition: all var(--transition); }
    .its-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .its-count { font: 700 22px var(--font-display); line-height: 1.1; }
    .its-label { font: 500 11px var(--font-sans); color: var(--text-secondary); margin-top: 2px; }
    .its-item.status-open { border-color: var(--red); }
    .its-item.status-open .its-count { color: var(--red); }
    .its-item.status-diagnosed { border-color: var(--gold); }
    .its-item.status-diagnosed .its-count { color: var(--gold); }
    .its-item.status-patched { border-color: var(--blue); }
    .its-item.status-patched .its-count { color: var(--blue); }
    .its-item.status-regression { border-color: var(--purple); }
    .its-item.status-regression .its-count { color: var(--purple); }
    .its-item.status-closed { border-color: var(--green); }
    .its-item.status-closed .its-count { color: var(--green); }

    .issue-status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: var(--radius-pill); font: 600 11px var(--font-sans); }
    .issue-status-badge.status-open { background: var(--red-soft); color: var(--red); }
    .issue-status-badge.status-diagnosed { background: var(--gold-soft); color: var(--gold); }
    .issue-status-badge.status-patched { background: var(--blue-soft); color: var(--blue); }
    .issue-status-badge.status-regression { background: var(--purple-soft); color: var(--purple); }
    .issue-status-badge.status-closed { background: var(--green-soft); color: var(--green); }
    .issue-rootcause { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-pill); font: 500 11px var(--font-mono); background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); }
    .issue-rootcause.pending { color: var(--text-muted); border-style: dashed; }
    .issue-flow-btn { padding: 4px 10px; border-radius: var(--radius); font: 600 11px var(--font-sans); border: 1px solid var(--border); background: var(--surface); color: var(--accent); transition: all var(--transition); cursor: pointer; }
    .issue-flow-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    .issue-rootcause-select { padding: 3px 8px; border-radius: var(--radius); font: 500 11px var(--font-mono); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }

    /* ===== Triage Card ===== */
    .triage-card { padding: 14px 16px; border-radius: var(--radius-lg); border: 1px solid var(--accent); background: linear-gradient(135deg, var(--accent-soft), var(--surface)); display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .triage-card::before { content: '⚡ Agent 决策'; font: 700 11px var(--font-mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    .tc-action { font: 700 15px var(--font-display); color: var(--text); }
    .tc-reason { font: 400 13px var(--font-sans); color: var(--text-secondary); line-height: 1.5; }
    .tc-skip, .tc-focus { font: 500 12px var(--font-mono); display: flex; gap: 6px; align-items: center; }
    .tc-skip { color: var(--red); }
    .tc-focus { color: var(--green); }

    /* ===== Persona Switcher ===== */
    .persona-switcher { display: inline-flex; gap: 4px; padding: 3px; border-radius: var(--radius-pill); background: var(--surface-2); border: 1px solid var(--border); }
    .persona-btn { padding: 4px 11px; border-radius: var(--radius-pill); font: 600 11px var(--font-sans); color: var(--text-secondary); transition: all var(--transition); cursor: pointer; border: none; background: transparent; }
    .persona-btn:hover { color: var(--text); }
    .persona-btn.active { background: var(--accent); color: #fff; box-shadow: var(--accent-glow); }
    .persona-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: var(--radius-pill); font: 600 11px var(--font-sans); background: var(--purple-soft); color: var(--purple); }

    /* ===== Checkpoint Stages ===== */
    .checkpoint-stages { display: flex; align-items: center; gap: 6px; padding: 8px 0; justify-content: center; }
    .cs-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-faint); transition: all var(--transition); }
    .cs-dot.active { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: pulse 1.5s infinite; }
    .cs-dot.done { background: var(--green); }
    .cs-line { flex: 0 0 18px; height: 2px; background: var(--text-faint); }
    .cs-line.done { background: var(--green); }
    .cs-stage-label { font: 500 11px var(--font-mono); color: var(--text-secondary); margin-left: 8px; }
    .checkpoint-hint-box { padding: 10px 14px; border-radius: var(--radius); background: var(--gold-soft); border: 1px solid var(--gold); font: 400 13px var(--font-sans); color: var(--text); margin: 8px 0; }
    .checkpoint-ask { padding: 10px 14px; border-radius: var(--radius); background: var(--purple-soft); border: 1px solid var(--purple); font: 400 13px var(--font-sans); color: var(--text); margin: 8px 0; }
    .checkpoint-transfer { padding: 10px 14px; border-radius: var(--radius); background: var(--green-soft); border: 1px solid var(--green); font: 400 13px var(--font-sans); color: var(--text); margin: 8px 0; }

    /* ===== Knowledge Repo Links ===== */
    .repo-links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); margin-top: 12px; }
    .rl-item { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
    .rl-label { font: 500 10px var(--font-mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .rl-value { font: 600 13px var(--font-sans); color: var(--text); }
    .rl-value.muted { color: var(--text-secondary); font-weight: 400; }
    .nc-kp-tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: var(--radius-pill); font: 500 10px var(--font-mono); background: var(--teal-soft); color: var(--teal); }

    /* ===== Run Log mono lines ===== */
    .run-log-line { font: 400 12px var(--font-mono); color: var(--text-secondary); padding: 3px 0; border-left: 2px solid var(--border); padding-left: 10px; }
    .run-log-line.commit { color: var(--green); border-color: var(--green); }
    .run-log-line.warn { color: var(--gold); border-color: var(--gold); }

    @media (max-width: 768px) {
      .evidence-chain { grid-template-columns: repeat(2, 1fr); }
      .issue-tracker-stats { grid-template-columns: repeat(5, 1fr); gap: 4px; }
      .its-count { font-size: 18px; }
      .its-label { font-size: 9px; }
      .repo-links { grid-template-columns: 1fr; }
      .persona-switcher { flex-wrap: wrap; }
      .ci-diff { font-size: 10px; gap: 6px; }
    }

    /* ===== Learning Compiler + Adaptive Runtime 样式 ===== */
    /* Compile Log — 终端日志样式 */
    .compile-log { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; }
    .compile-log .cl-line { color: var(--text-secondary); white-space: pre-wrap; word-break: break-all; }
    .compile-log .cl-line:first-child { color: var(--green); font-weight: 600; }

    /* Mastery Contract — 掌握合约卡片 */
    .contract-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
    .contract-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .contract-head .ch-goal { font: 600 15px var(--font-sans); color: var(--text); }
    .contract-head .ch-time { margin-top: 2px; }
    .knowledge-deps { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .kd-node { border: 1px solid var(--border); border-left-width: 3px; border-radius: var(--radius-xs); padding: 8px 10px; background: var(--surface-2); }
    .kd-label { font: 600 13px var(--font-sans); color: var(--text); }
    .kd-mastery { font: 700 11px var(--font-mono); margin-top: 2px; }
    .kd-deps { font: 400 10px var(--font-mono); color: var(--text-faint); margin-top: 2px; }
    .kd-criterion { font: 400 11px var(--font-sans); color: var(--text-secondary); margin-top: 4px; }
    .contract-acc { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .acceptance-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: var(--radius-xs); border: 1px solid var(--border); }
    .acceptance-item.met { background: var(--green-soft); border-color: var(--green); }
    .acceptance-item.unmet { background: var(--surface-2); }
    .ai-check { font: 700 16px var(--font-mono); line-height: 1.2; }
    .acceptance-item.met .ai-check { color: var(--green); }
    .acceptance-item.unmet .ai-check { color: var(--text-faint); }
    .ai-body { flex: 1; min-width: 0; }
    .ai-label { font: 600 13px var(--font-sans); color: var(--text); }
    .ai-desc { font: 400 11px var(--font-sans); color: var(--text-secondary); margin-top: 2px; }
    .ai-proof { font: 400 10px var(--font-mono); color: var(--text-muted); margin-top: 4px; }
    .contract-summary { border-top: 1px solid var(--separator); padding-top: 10px; }
    .cs-row { display: flex; gap: 8px; padding: 4px 0; font-size: 12px; }
    .cs-key { flex: 0 0 70px; font: 600 11px var(--font-mono); color: var(--text-muted); }
    .cs-val { flex: 1; color: var(--text-secondary); font-size: 12px; }

    /* Adaptive Flow — 自适应调度 */
    .adaptive-flow { display: flex; flex-direction: column; gap: 12px; }
    .af-current { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; }
    .af-action { font: 700 16px var(--font-sans); color: var(--accent); }
    .af-target { font: 600 13px var(--font-sans); color: var(--text); margin-top: 4px; }
    .af-reason { font: 400 12px var(--font-sans); color: var(--text-secondary); margin-top: 4px; }
    .af-skip { font: 400 11px var(--font-mono); color: var(--text-muted); margin-top: 6px; }
    .reroute-log { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
    .reroute-log .rl-title { margin-bottom: 6px; letter-spacing: 0.5px; }
    .rl-item { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font: 400 11px var(--font-mono); padding: 3px 0; color: var(--text-secondary); }
    .rl-from { color: var(--text-faint); }
    .rl-arrow { color: var(--accent); }
    .rl-to { color: var(--text); font-weight: 600; }
    .rl-reason { color: var(--text-muted); flex-basis: 100%; padding-left: 4px; }

    /* Forget Forecast — 遗忘预测 */
    .forget-forecast { display: flex; flex-direction: column; gap: 6px; }
    .ff-item { display: grid; grid-template-columns: 44px 1fr auto auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-xs); background: var(--surface-2); }
    .ff-day { font: 700 12px var(--font-mono); color: var(--text-muted); }
    .ff-concept { font: 600 12px var(--font-sans); color: var(--text); }
    .ff-retention { display: flex; align-items: center; gap: 6px; min-width: 90px; }
    .ff-bar { flex: 1; height: 6px; background: var(--surface-active); border-radius: 3px; overflow: hidden; }
    .ff-bar span { display: block; height: 100%; border-radius: 3px; transition: width var(--dur) var(--ease-standard); }
    .ff-val { font: 600 11px var(--font-mono); color: var(--text-secondary); min-width: 30px; text-align: right; }
    .ff-risk { font: 700 10px var(--font-mono); text-transform: uppercase; padding: 2px 6px; border-radius: var(--radius-xs); }
    .ff-risk.risk-high { background: var(--red-soft); color: var(--red); }
    .ff-risk.risk-medium { background: var(--gold-soft); color: var(--gold); }
    .ff-risk.risk-low { background: var(--green-soft); color: var(--green); }
    .ff-advice { margin-top: 6px; padding: 8px 10px; background: var(--gold-soft); border-radius: var(--radius-xs); font: 400 11px var(--font-sans); color: var(--text-secondary); }

    /* Cognitive Debugger — 认知调试器 */
    .cognitive-debugger { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .error-stack { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
    .error-stack .es-title { margin-bottom: 6px; letter-spacing: 0.5px; }
    .es-frame { display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; font: 400 11px var(--font-mono); border-bottom: 1px dashed var(--border); }
    .es-frame:last-child { border-bottom: none; }
    .es-file { color: var(--purple); font-weight: 600; }
    .es-line { color: var(--text-secondary); }

        const uc = this._debateUserChoice || 0, ok = uc === debate.correct;
        const isLast = idx >= bank.length - 1;
        const endBtn = isLast ? `<div class="debate-bubble ai" style="align-self:center;text-align:center"><div class="db-role">辩论结束</div>正确判断：${score.correct}/${bank.length}<br>论证得分：${score.reasoning}/${bank.length * 2}<br><br>${score.correct === bank.length ? '🎉 全部正确！批判性思维出众。' : '继续磨练你的批判性思维。'}</div><button class="btn primary" style="align-self:center" onclick="App._debateReset()">重新挑战</button>` : `<button class="btn primary" style="align-self:center" onclick="App._debateNext()">下一辩题 →</button>`;
        return `<div class="debate-arena">${scoreBar}<div class="debate-bubble ai"><div class="db-role">苏格拉底 · 论题 ${idx + 1}</div>${escapeHtml(debate.claim)}</div><div class="debate-bubble user"><div class="db-role">你的判断</div>${escapeHtml(debate.choices[uc])}</div><div class="debate-bubble ai"><div class="db-role">苏格拉底 · 反驳</div>${ok ? '✓ 正确！' : '✗ 再想想。'} ${escapeHtml(debate.counter)}<br><br><strong>原理：</strong>${escapeHtml(debate.explanation)}</div>${endBtn}</div>`;
      },
      _debateAnswer(choice) {
        const bank = this._getDebateBank(), idx = this._debateIdx || 0;
        const debate = bank[idx], ok = choice === debate.correct;
        const score = this._debateScore || { correct: 0, reasoning: 0 };
        if (ok) { score.correct++; score.reasoning += 2; } else { score.reasoning += 1; }
        this._debateScore = score; this._debateUserChoice = choice; this._debateRound = 1;
        this.render();
      },
      _debateNext() { this._debateIdx = (this._debateIdx || 0) + 1; this._debateRound = 0; this._debateUserChoice = 0; this.render(); },
      _debateReset() { this._debateIdx = 0; this._debateRound = 0; this._debateScore = { correct: 0, reasoning: 0 }; this._debateUserChoice = 0; this.render(); },
      _renderThermalMap(mastery) {
        const concepts = [
          { label: '极限定义', m: mastery.understanding, daysAgo: 1 }, { label: '极限运算', m: mastery.understanding, daysAgo: 3 },
          { label: '等价无穷小', m: mastery.memory, daysAgo: 0 }, { label: '洛必达法则', m: mastery.application, daysAgo: 5 },
          { label: '夹逼定理', m: mastery.memory, daysAgo: 7 }, { label: '连续性', m: mastery.understanding, daysAgo: 2 },
          { label: '间断点', m: mastery.application, daysAgo: 4 }, { label: '可去间断', m: mastery.application, daysAgo: 6 },
          { label: '跳跃间断', m: mastery.expression, daysAgo: 8 }, { label: '无穷间断', m: mastery.expression, daysAgo: 10 },
          { label: '振荡间断', m: mastery.expression, daysAgo: 12 }, { label: '闭区间性质', m: mastery.understanding, daysAgo: 14 },
          { label: '最大值原理', m: 30, daysAgo: 15 }, { label: '零点定理', m: 25, daysAgo: 16 },
          { label: '介值定理', m: 20, daysAgo: 18 }, { label: '一致连续', m: 15, daysAgo: 20 },
        ];
        const cells = concepts.map(c => {
          const temp = Math.max(0, 1 - c.daysAgo / 14);
          const r = temp < 0.5 ? 0 : Math.round(255 * (temp - 0.5) * 2);
          const g = temp < 0.5 ? Math.round(255 * temp * 2) : Math.round(255 * (1 - temp) * 2);
          const b = temp < 0.5 ? Math.round(255 * (0.5 - temp) * 2) : 0;
          const entropy = Math.min(100, c.daysAgo * 5);
          return `<div class="thermal-cell" style="background:rgb(${r},${g},${b})">${c.m}<div class="tc-tooltip">${escapeHtml(c.label)} · ${c.daysAgo}天前 · 熵${entropy}%</div></div>`;
        }).join('');
        const avgEntropy = Math.round(concepts.reduce((a, c) => a + Math.min(100, c.daysAgo * 5), 0) / concepts.length);
        const hot = concepts.filter(c => c.daysAgo <= 2).length, cold = concepts.filter(c => c.daysAgo >= 10).length;
        return `<div><div class="entropy-gauge"><span style="font:600 13px var(--font-sans);color:var(--text-secondary)">系统熵值</span><div class="entropy-bar"><div class="entropy-marker" style="left:${avgEntropy}%"></div></div><span style="font:700 18px var(--font-display);color:${avgEntropy > 60 ? 'var(--red)' : avgEntropy > 30 ? 'var(--gold)' : 'var(--green)'}">${avgEntropy}%</span></div><div class="thermal-grid">${cells}</div><div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap"><div class="universe-stat"><div class="us-val" style="color:var(--red)">${hot}</div><div class="us-label">活跃知识</div></div><div class="universe-stat"><div class="us-val" style="color:var(--blue)">${cold}</div><div class="us-label">冷却知识</div></div><div class="universe-stat"><div class="us-val" style="color:var(--accent)">${concepts.filter(c => c.m >= 60).length}</div><div class="us-label">已掌握</div></div></div><p class="small muted" style="margin-top:12px;line-height:1.6">热力学隐喻：知识如热能——刚学习时温度最高（红），随时间冷却（蓝）。「熵」代表无序度，随时间增长。只有练习（做功）才能对抗熵增。</p></div>`;
      },
      _renderMemoryPalace(mastery) {
        const rooms = [
          { label: '极限理论', cards: ['极限定义', 'ε-δ语言', '数列极限', '函数极限', '极限唯一性', '保号性'] },
          { label: '无穷小与逼近', cards: ['等价无穷小', '高阶无穷小', '同阶无穷小', 'o(x)记号', '泰勒展开', '逼近方法'] },
          { label: '连续性', cards: ['连续定义', '左连续', '右连续', '间断点', '可去间断', '跳跃间断'] },
          { label: '定理与应用', cards: ['夹逼定理', '洛必达法则', '闭区间性质', '零点定理', '介值定理', '最大值原理'] },
        ];
        const wallIdx = this._palaceWall || 0, angles = [0, 90, 180, 270];
        const walls = rooms.map((r, i) => `<div class="palace-wall" style="transform: rotateY(${angles[i]}deg) translateZ(300px); ${i === wallIdx ? '' : 'opacity:0.12;'}"><div class="pw-label">${escapeHtml(r.label)}</div>${r.cards.map(c => `<div class="palace-card-3d" onclick="toast('${escapeHtml(c)} · 已查看')">${escapeHtml(c)}</div>`).join('')}</div>`).join('');
        const compass = ['北', '东', '南', '西'][wallIdx];
        return `<div><div class="palace-viewport"><div class="palace-compass">${compass}</div><div class="palace-scene" style="transform: rotateY(${-angles[wallIdx]}deg)">${walls}</div></div><div class="palace-nav"><button onclick="App._palaceTurn(-1)">←</button><button onclick="App._palaceTurn(1)">→</button></div><p class="small muted" style="text-align:center;margin-top:8px">当前房间：<strong>${escapeHtml(rooms[wallIdx].label)}</strong>（${wallIdx + 1}/4）</p><p class="small muted" style="text-align:center;margin-top:4px">古罗马记忆术（Method of Loci）的数字化实现：将知识放置在虚拟空间，利用人脑最强的空间记忆系统强化提取</p></div>`;
      },
      _palaceTurn(dir) { this._palaceWall = ((this._palaceWall || 0) + dir + 4) % 4; this.render(); },
      _renderParallelUniverse(mastery) {
        const intensities = [0.5, 1, 2, 4], colors = ['var(--text-muted)', 'var(--gold)', 'var(--blue)', 'var(--accent)'];
        const labels = ['0.5h/天', '1h/天', '2h/天', '4h/天'], days = 30, cur = mastery.readiness;
        const futures = intensities.map((h, idx) => {
          const proj = [];
          for (let d = 0; d <= days; d++) { const growth = h * 1.5 * Math.exp(-d / 25); const decay = Math.max(0, (d - h * 4) * 0.25); const m = Math.max(0, Math.min(100, cur + growth * d / 3 - decay)); proj.push({ day: d, mastery: Math.round(m) }); }
          return { intensity: h, color: colors[idx], label: labels[idx], projected: proj };
        });
        const w = 600, h = 320, pad = 40, xStep = (w - pad * 2) / days, yScale = (h - pad * 2) / 100;
        const lines = futures.map(f => { const pts = f.projected.map(p => `${(pad + p.day * xStep).toFixed(1)},${(h - pad - p.mastery * yScale).toFixed(1)}`).join(' '); return `<polyline class="uni-line" points="${pts}" stroke="${f.color}" opacity="0.85" />`; }).join('');
        const endPts = futures.map(f => { const last = f.projected[f.projected.length - 1]; const x = pad + last.day * xStep, y = h - pad - last.mastery * yScale; return `<circle class="uni-point" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${f.color}" /><text class="uni-label" x="${(x + 8).toFixed(1)}" y="${(y + 4).toFixed(1)}" fill="${f.color}">${last.mastery}%</text>`; }).join('');
        const grid = [0, 25, 50, 75, 100].map(v => { const y = h - pad - v * yScale; return `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w - pad}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5" /><text x="${pad - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="10" font-family="var(--font-mono)" fill="var(--text-faint)">${v}</text>`; }).join('');
        const dayLbls = [0, 7, 14, 21, 30].map(d => { const x = pad + d * xStep; return `<text x="${x.toFixed(1)}" y="${h - pad + 16}" text-anchor="middle" font-size="10" font-family="var(--font-mono)" fill="var(--text-faint)">D${d}</text>`; }).join('');
        const selIdx = this._universeSel || 2, selF = futures[selIdx];
        const selFinal = selF.projected[selF.projected.length - 1].mastery, selDelta = selFinal - cur;
        const portals = futures.map((f, i) => { const final = f.projected[f.projected.length - 1].mastery, delta = final - cur; return `<div class="universe-portal-card ${i === selIdx ? 'active' : ''}" onclick="App._universeSelect(${i})"><div class="upc-hours" style="color:${f.color}">${f.intensity}h</div><div class="upc-label">每天学习</div><div class="upc-result" style="color:${delta > 0 ? 'var(--green)' : 'var(--red)'}">${delta > 0 ? '+' : ''}${delta}%</div></div>`; }).join('');
        return `<div><div class="universe-controls"><div class="universe-stat"><div class="us-val" style="color:var(--text-muted)">${cur}%</div><div class="us-label">当前掌握</div></div><div style="flex:1;text-align:center"><div style="font:700 28px var(--font-display);color:${selF.color}">${selFinal}%</div><div class="small muted">30天后预测 (${selF.label})</div></div><div class="universe-stat"><div class="us-val" style="color:${selDelta > 0 ? 'var(--green)' : 'var(--red)'}">${selDelta > 0 ? '+' : ''}${selDelta}%</div><div class="us-label">变化量</div></div></div><svg class="universe-svg" viewBox="0 0 ${w} ${h}">${grid}${dayLbls}${lines}${endPts}</svg><div class="universe-portals">${portals}</div><p class="small muted" style="margin-top:12px;line-height:1.6">平行宇宙模拟器：基于当前掌握度，模拟4种学习强度下30天后的知识状态。每天多学1小时，30天后差距可达20%——蝴蝶效应在学习中同样适用。</p></div>`;
      },
      _universeSelect(i) { this._universeSel = i; this.render(); },
      sendCoachChat() { const input = $('#chatInputFull'); if (!input) return; const text = input.value.trim(); if (!text) return; const log = $('#chatLogFull'); log.insertAdjacentHTML('beforeend', `<div class="chat-msg user">${escapeHtml(text)}</div>`); input.value = ''; const detectedMode = LearningAgent.detectMode(text); const resp = LearningAgent.getModeResponse(detectedMode, text); setTimeout(() => { log.insertAdjacentHTML('beforeend', `<div class="chat-msg bot"><span class="chat-mode-badge ${resp.badge}">${resp.badge}</span><br>${escapeHtml(resp.reply).replace(/\n/g,'<br>')}</div>`); log.scrollTop = log.scrollHeight; }, 400); },
      sendCoachInput() { const input = $('#coachInput'); if (!input) return; const text = input.value.trim(); if (!text) return; input.value = ''; if (text.startsWith('/review')) { Modal.openTool('学习计划'); toast('已打开学习计划'); } else if (text.startsWith('/flashcard')) { Modal.openTool('智能闪卡'); toast('已打开智能闪卡'); } else if (text.startsWith('/regression')) { toast('知识退化：建议立即复习应用和表达维度'); } else { const resp = LearningAgent.getModeResponse(LearningAgent.detectMode(text), text); toast(`Coach: ${resp.reply.slice(0, 40)}...`); } },
      addCustomStep(afterIndex) { const label = prompt('输入要插入的自定义任务：'); if (!label) return; LearningAgent.addCustomStep(label); toast(`已插入自定义任务：${label}`); },
    };
    const CommandPalette = {
      _selected: 0, _filtered: [],
      commands: [
        { label: '前往 Workspace 工作台', cat: 'view', action: () => App.nav('workspace') },
        { label: '前往 Dashboard 仪表盘', cat: 'view', action: () => App.nav('dashboard') },
        { label: '前往 笔记库', cat: 'view', action: () => App.nav('notes') },
        { label: '前往 错题本', cat: 'view', action: () => App.nav('errorbook') },
        { label: '前往 AI Coach 教练', cat: 'view', action: () => App.nav('coach') },
        { label: '前往 创新实验室', cat: 'view', action: () => App.nav('lab') },
        { label: '创新 · 知识DNA双螺旋', cat: 'lab', action: () => { App.nav('lab'); App._setLabTab('dna'); } },
        { label: '创新 · 遗忘气象站', cat: 'lab', action: () => { App.nav('lab'); App._setLabTab('weather'); } },
        { label: '创新 · 苏格拉底挑战', cat: 'lab', action: () => { App.nav('lab'); App._setLabTab('socratic'); } },
        { label: '创新 · 脑力热力图', cat: 'lab', action: () => { App.nav('lab'); App._setLabTab('thermal'); } },
        { label: '创新 · 记忆宫殿3D', cat: 'lab', action: () => { App.nav('lab'); App._setLabTab('palace'); } },
        { label: '创新 · 平行宇宙时间线', cat: 'lab', action: () => { App.nav('lab'); App._setLabTab('universe'); } },
        { label: '设置学习目标', cat: 'goal', action: () => Modal.openGoal() },
        { label: '清除学习目标', cat: 'goal', action: () => { Store.write('learningProfile', { ...Store.read('learningProfile', Demo.profile()), goal: '(未设置目标)' }); App.render(); toast('目标已清除'); } },
        { label: 'Run Agent — 启动学习流', cat: 'agent', action: () => LearningAgent.startFlow() },
        { label: 'Reset Agent — 重置学习流', cat: 'agent', action: () => LearningAgent.resetFlow() },
        { label: '笔记库 — 知识沉淀', cat: 'view', action: () => App.nav('notes') },
        { label: '学习计划 — 7天路径', cat: 'tool', action: () => Modal.openTool('学习计划') },
        { label: '专注模式 — 番茄钟', cat: 'tool', action: () => Modal.openTool('专注模式') },
        { label: '资源中心 — 教材链接', cat: 'tool', action: () => Modal.openTool('资源中心') },
        { label: '错题本 — 错因分析', cat: 'view', action: () => App.nav('errorbook') },
        { label: '模拟考场 — 限时测试', cat: 'tool', action: () => Modal.openTool('模拟考场') },
        { label: '费曼讲解 — 以教促学', cat: 'tool', action: () => Modal.openTool('费曼讲解') },
        { label: '智能闪卡 — 间隔复习', cat: 'tool', action: () => Modal.openTool('智能闪卡') },
        { label: '学习周报 — 本周统计', cat: 'tool', action: () => Modal.openTool('学习周报') },
        { label: '概念词典 — 速查手册', cat: 'tool', action: () => Modal.openTool('概念词典') },
        { label: '目标看板 — 进度追踪', cat: 'tool', action: () => Modal.openTool('目标看板') },
        { label: '切换明暗主题', cat: 'ui', action: () => Theme.toggle() },
        { label: '设置 — API Key / 模式', cat: 'ui', action: () => Modal.openSettings() },
        { label: '/review — 打开学习计划', cat: 'slash', action: () => Modal.openTool('学习计划') },
        { label: '/flashcard — 打开智能闪卡', cat: 'slash', action: () => Modal.openTool('智能闪卡') },
        { label: '/regression — 检查知识退化', cat: 'slash', action: () => toast('知识退化：应用/表达较快照下降，建议 pull 复习补丁') }
      ],
      open() { this._filtered = this.commands; this._selected = 0; this._render(); setTimeout(() => $('#cmdInput').focus(), 50); },
      close() { $('#modalHost').innerHTML = ''; },
      _render() { $('#modalHost').innerHTML = `<div class="cmd-overlay" onclick="if(event.target===this)CommandPalette.close()"><div class="cmd-palette"><input class="cmd-input" id="cmdInput" placeholder="输入命令或 /review /flashcard /regression..." oninput="CommandPalette.filter(this.value)" onkeydown="CommandPalette._onKey(event)"><div class="cmd-list" id="cmdList">${this._filtered.map((c, i) => `<div class="cmd-item ${i === this._selected ? 'selected' : ''}" onclick="CommandPalette._run(${i})"><span>${escapeHtml(c.label)}</span><span class="cmd-cat">${c.cat}</span></div>`).join('')}</div><div class="cmd-hint">↑↓ 导航 · Enter 执行 · Esc 关闭</div></div></div>`; },
      filter(text) { const t = text.toLowerCase(); this._filtered = this.commands.filter(c => c.label.toLowerCase().includes(t) || c.cat.includes(t)); this._selected = 0; this._renderList(); setTimeout(() => { const inp = $('#cmdInput'); if (inp) { inp.focus(); inp.value = text; } }, 10); },
      _renderList() { const list = $('#cmdList'); if (!list) return; list.innerHTML = this._filtered.map((c, i) => `<div class="cmd-item ${i === this._selected ? 'selected' : ''}" onclick="CommandPalette._run(${i})"><span>${escapeHtml(c.label)}</span><span class="cmd-cat">${c.cat}</span></div>`).join(''); },
      _onKey(e) { if (e.key === 'ArrowDown') { e.preventDefault(); this._selected = Math.min(this._selected + 1, this._filtered.length - 1); this._renderList(); } else if (e.key === 'ArrowUp') { e.preventDefault(); this._selected = Math.max(this._selected - 1, 0); this._renderList(); } else if (e.key === 'Enter') { e.preventDefault(); this._run(this._selected); } else if (e.key === 'Escape') { this.close(); } },
      _run(i) { const cmd = this._filtered[i]; if (cmd) { this.close(); cmd.action(); } }
    };
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); CommandPalette.open(); return; } if (e.key === 'Escape') { if ($('#modalHost').innerHTML) { if ($('#cmdInput')) CommandPalette.close(); else Modal.close(); } } });
    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
