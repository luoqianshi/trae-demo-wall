<!-- Generated by Trae Work - Sinan Demo -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>司南 Sinan · AI 命理罗盘 Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --bg: #0a0e2a;
  --bg2: #121842;
  --bg3: #1a2255;
  --ink: #efe6ce;
  --ink2: #c8c0a8;
  --muted: #7a82a8;
  --rule: #2a3160;
  --accent: #d4a64a;
  --accent-dim: #b08a3a;
  --accent2: #6cd1d4;
  --accent2-dim: #4aa8ab;
  --danger: #c75450;
  --success: #5a9e5a;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; }
body {
  font-family:'Noto Sans SC',sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  width:100vw; height:100vh;
}

/* ===================== PAGE TRANSITIONS ===================== */
.page {
  position:absolute; inset:0;
  display:none; flex-direction:column;
  opacity:0; transform:translateY(30px);
  transition:opacity .6s ease, transform .6s ease;
}
.page.active {
  display:flex;
  opacity:1; transform:translateY(0);
}

/* ===================== HERO PAGE ===================== */
.hero-page {
  justify-content:center; align-items:center;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,166,74,0.08), transparent 60%),
    radial-gradient(ellipse 60% 50% at 20% 80%, rgba(108,209,212,0.06), transparent 50%),
    var(--bg);
  text-align:center; padding:2rem;
}

.cosmic-ring {
  width:200px; height:200px;
  border-radius:50%;
  border:2px solid rgba(212,166,74,0.3);
  position:relative;
  margin:0 auto 2rem;
  animation:ringPulse 4s ease-in-out infinite;
}
.cosmic-ring::before, .cosmic-ring::after {
  content:''; position:absolute; border-radius:50%;
}
.cosmic-ring::before {
  inset:20px; border:1.5px solid rgba(108,209,212,0.25);
  animation:ringSpin 12s linear infinite;
}
.cosmic-ring::after {
  inset:45px; border:1px solid rgba(212,166,74,0.4);
  animation:ringSpin 8s linear infinite reverse;
}
.inner-compass {
  position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center;
}
.inner-compass svg { width:60px; height:60px; }

@keyframes ringPulse {
  0%,100% { box-shadow:0 0 30px rgba(212,166,74,0.1); }
  50% { box-shadow:0 0 60px rgba(212,166,74,0.25), 0 0 100px rgba(108,209,212,0.08); }
}
@keyframes ringSpin {
  to { transform:rotate(360deg); }
}

.hero-title {
  font-family:'Noto Serif SC',serif;
  font-size:2.8rem; font-weight:700;
  letter-spacing:0.1em; margin-bottom:.4rem;
}
.hero-title .accent { color:var(--accent); }
.hero-sub {
  font-size:1rem; color:var(--ink2);
  margin-bottom:2.5rem; line-height:1.7;
  max-width:320px; margin-left:auto; margin-right:auto;
}

.hero-btn {
  display:inline-flex; align-items:center; gap:.5rem;
  background:linear-gradient(135deg, var(--accent), var(--accent-dim));
  color:var(--bg); border:none; border-radius:50px;
  padding:.9rem 2.2rem; font-size:1rem; font-weight:700;
  cursor:pointer; letter-spacing:0.08em;
  box-shadow:0 4px 24px rgba(212,166,74,0.3);
  transition:all .3s ease;
}
.hero-btn:hover {
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(212,166,74,0.4);
}
.hero-btn svg { width:18px; height:18px; }

.hero-dots {
  display:flex; gap:.5rem; margin-top:2rem;
}
.hero-dots span {
  width:8px; height:8px; border-radius:50%;
  background:var(--rule);
  transition:background .3s;
}
.hero-dots span.on { background:var(--accent); }

/* ===================== FORM PAGE ===================== */
.form-page { padding:0; }
.form-header {
  padding:1.5rem 1.5rem 0; display:flex;
  align-items:center; gap:.8rem;
}
.form-header .back-btn {
  width:36px; height:36px; border-radius:50%;
  background:var(--bg2); border:1px solid var(--rule);
  color:var(--ink); display:flex; align-items:center;
  justify-content:center; cursor:pointer; font-size:1.1rem;
}
.form-header h2 {
  font-family:'Noto Serif SC',serif;
  font-size:1.3rem; font-weight:700;
}
.form-body {
  flex:1; overflow-y:auto; padding:1.5rem;
  -webkit-overflow-scrolling:touch;
}
.form-group { margin-bottom:1.4rem; }
.form-group label {
  display:block; font-size:.8rem;
  color:var(--muted); margin-bottom:.4rem;
  letter-spacing:0.05em;
}
.form-group input, .form-group select {
  width:100%; background:var(--bg2);
  border:1px solid var(--rule); border-radius:8px;
  padding:.9rem 1rem; color:var(--ink);
  font-size:1rem; outline:none;
  transition:border-color .3s;
}
.form-group input:focus, .form-group select:focus {
  border-color:var(--accent);
}
.form-row { display:flex; gap:.8rem; }
.form-row .form-group { flex:1; }

.submit-btn {
  width:100%; background:var(--accent);
  color:var(--bg); border:none; border-radius:10px;
  padding:1rem; font-size:1rem; font-weight:700;
  cursor:pointer; margin-top:.5rem;
  transition:all .3s;
}
.submit-btn:hover { background:var(--accent-dim); }

/* ===================== CHART PAGE ===================== */
.chart-page { padding:0; }
.chart-header {
  padding:1rem 1.2rem; display:flex;
  align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--rule);
}
.chart-header h2 {
  font-family:'Noto Serif SC',serif;
  font-size:1.15rem;
}
.mode-toggle {
  display:flex; background:var(--bg2);
  border-radius:20px; border:1px solid var(--rule);
  overflow:hidden;
}
.mode-toggle button {
  padding:.4rem .9rem; border:none; background:transparent;
  color:var(--muted); font-size:.75rem; cursor:pointer;
  transition:all .3s;
}
.mode-toggle button.on {
  background:var(--accent); color:var(--bg);
}

.chart-canvas-wrap {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  position:relative; padding:1rem;
}
#chartCanvas { max-width:100%; max-height:55vh; }

.chart-summary {
  background:var(--bg2); border:1px solid var(--rule);
  border-radius:10px; padding:1rem 1.2rem;
  margin:0 1.2rem 1.2rem;
}
.chart-summary .typing-text {
  font-size:.92rem; line-height:1.7;
  color:var(--ink); min-height:3em;
}
.chart-summary .typing-cursor {
  display:inline-block; width:2px; height:1em;
  background:var(--accent); margin-left:2px;
  animation:cursorBlink 1s step-end infinite;
}
@keyframes cursorBlink { 50% { opacity:0; } }

.chart-actions {
  display:flex; gap:.8rem; padding:0 1.2rem 1.2rem;
}
.chart-actions button {
  flex:1; padding:.8rem; border-radius:8px;
  border:1px solid var(--rule); background:var(--bg2);
  color:var(--ink); font-size:.85rem; cursor:pointer;
  transition:all .3s;
}
.chart-actions button.primary {
  background:var(--accent); color:var(--bg);
  border-color:var(--accent);
}

/* ===================== CHAT PAGE ===================== */
.chat-page { padding:0; }
.chat-header {
  padding:1rem 1.2rem; display:flex;
  align-items:center; gap:.8rem;
  border-bottom:1px solid var(--rule);
}
.persona-selector {
  display:flex; gap:.4rem; flex:1;
}
.persona-chip {
  padding:.3rem .7rem; border-radius:14px;
  border:1px solid var(--rule); background:var(--bg2);
  color:var(--muted); font-size:.72rem; cursor:pointer;
  transition:all .3s; white-space:nowrap;
}
.persona-chip.on {
  border-color:var(--accent2); color:var(--accent2);
  background:rgba(108,209,212,0.08);
}

.chat-messages {
  flex:1; overflow-y:auto; padding:1rem 1.2rem;
  display:flex; flex-direction:column; gap:.8rem;
  -webkit-overflow-scrolling:touch;
}
.msg {
  max-width:82%; padding:.8rem 1rem;
  border-radius:12px; font-size:.9rem;
  line-height:1.65; animation:msgPop .3s ease;
}
@keyframes msgPop {
  from { opacity:0; transform:translateY(10px) scale(.95); }
  to { opacity:1; transform:translateY(0) scale(1); }
}
.msg.user {
  align-self:flex-end;
  background:var(--accent);
  color:var(--bg); border-bottom-right-radius:3px;
}
.msg.ai {
  align-self:flex-start;
  background:var(--bg2); border:1px solid var(--rule);
  border-bottom-left-radius:3px;
}
.msg.ai .ai-name {
  font-size:.72rem; color:var(--accent2);
  margin-bottom:.25rem; font-weight:500;
}
.msg.ai .ai-typing::after {
  content:''; display:inline-block; width:4px; height:4px;
  border-radius:50%; background:var(--accent2);
  margin-left:4px; animation:typingDot 1.4s infinite;
}
@keyframes typingDot {
  0%,60%,100% { opacity:.3; transform:scale(1); }
  30% { opacity:1; transform:scale(1.3); }
}

.chat-input-wrap {
  padding:.8rem 1.2rem 1.2rem;
  border-top:1px solid var(--rule);
  display:flex; gap:.6rem;
}
.chat-input-wrap input {
  flex:1; background:var(--bg2); border:1px solid var(--rule);
  border-radius:24px; padding:.7rem 1rem;
  color:var(--ink); font-size:.9rem; outline:none;
}
.chat-input-wrap input:focus { border-color:var(--accent2); }
.chat-input-wrap button {
  width:40px; height:40px; border-radius:50%;
  background:var(--accent2); border:none;
  color:var(--bg); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

/* ===================== AR PAGE ===================== */
.ar-page { padding:0; position:relative; }
.ar-camera {
  flex:1; position:relative; overflow:hidden;
  background:linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
.ar-room {
  position:absolute; inset:0;
  background:
    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px);
  background-size:40px 40px;
}

/* Furniture silhouettes */
.furniture {
  position:absolute; border-radius:4px;
  background:rgba(108,209,212,0.08);
  border:1px solid rgba(108,209,212,0.15);
}
.f-bed { width:120px; height:90px; bottom:80px; left:15%; }
.f-desk { width:80px; height:50px; bottom:80px; right:20%; }
.f-sofa { width:140px; height:60px; bottom:80px; left:40%; }
.f-plant { width:30px; height:30px; bottom:80px; right:10%; border-radius:50%; }

.ar-scan-line {
  position:absolute; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--accent2), transparent);
  box-shadow:0 0 20px var(--accent2);
  animation:scanMove 3s ease-in-out infinite;
}
@keyframes scanMove {
  0%,100% { top:20%; }
  50% { top:80%; }
}

.ar-overlay {
  position:absolute; inset:0; pointer-events:none;
}
.bagua-zone {
  position:absolute; border:1.5px dashed rgba(212,166,74,0.4);
  border-radius:50%;
}
.bagua-label {
  position:absolute; font-size:.65rem;
  color:var(--accent); font-family:'Noto Serif SC',serif;
  background:rgba(10,14,42,0.7); padding:1px 4px; border-radius:2px;
}
.qi-arrow {
  position:absolute; width:0; height:0;
}

.ar-panel {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(transparent, rgba(10,14,42,0.95) 30%);
  padding:2rem 1.2rem 1.5rem;
  transform:translateY(100%);
  transition:transform .5s ease;
}
.ar-panel.open { transform:translateY(0); }
.ar-panel h3 {
  font-family:'Noto Serif SC',serif; font-size:1.1rem;
  margin-bottom:.6rem;
}
.ar-panel .ar-tips {
  display:flex; flex-direction:column; gap:.5rem;
}
.ar-tip {
  background:rgba(24,31,71,0.8); border:1px solid var(--rule);
  border-radius:8px; padding:.7rem .9rem;
  font-size:.85rem; display:flex; align-items:flex-start; gap:.6rem;
}
.ar-tip .tip-num {
  width:20px; height:20px; border-radius:50%;
  background:var(--accent); color:var(--bg);
  font-size:.7rem; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}

.ar-scan-btn {
  position:absolute; bottom:100px; left:50%;
  transform:translateX(-50%);
  width:72px; height:72px; border-radius:50%;
  border:3px solid var(--accent2);
  background:rgba(108,209,212,0.1);
  color:var(--accent2); font-size:.7rem;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; letter-spacing:0.05em;
  box-shadow:0 0 30px rgba(108,209,212,0.2);
  animation:scanPulse 2s ease-in-out infinite;
}
@keyframes scanPulse {
  0%,100% { box-shadow:0 0 20px rgba(108,209,212,0.2); }
  50% { box-shadow:0 0 40px rgba(108,209,212,0.4); }
}

/* ===================== NAV DOTS ===================== */
.nav-dots {
  position:fixed; bottom:20px; left:50%;
  transform:translateX(-50%);
  display:flex; gap:.6rem; z-index:100;
  background:rgba(10,14,42,0.8);
  padding:.4rem .8rem; border-radius:20px;
  border:1px solid var(--rule);
}
.nav-dots button {
  width:32px; height:32px; border-radius:50%;
  border:none; background:transparent;
  color:var(--muted); font-size:.7rem;
  cursor:pointer; transition:all .3s;
  display:flex; align-items:center; justify-content:center;
}
.nav-dots button.on {
  background:var(--accent); color:var(--bg);
}

/* ===================== LOADING ===================== */
.loading-overlay {
  position:fixed; inset:0; z-index:200;
  background:var(--bg);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  transition:opacity .5s;
}
.loading-overlay.hide { opacity:0; pointer-events:none; }
.loading-ring {
  width:60px; height:60px;
  border:2px solid var(--rule);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text {
  margin-top:1rem; font-size:.85rem;
  color:var(--muted); letter-spacing:0.1em;
}

/* ===================== SCROLLBAR ===================== */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--rule); border-radius:2px; }

/* ===================== MATCH PAGE ===================== */
.match-page { padding:0; }
.match-header {
  padding:1.2rem; display:flex; align-items:center; gap:.8rem;
  border-bottom:1px solid var(--rule);
}
.match-header h2 {
  font-family:'Noto Serif SC',serif; font-size:1.15rem; flex:1;
}
.match-count {
  font-size:.75rem; color:var(--muted);
  font-family:var(--font-mono);
}

.match-card-wrap {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:1.5rem; position:relative;
}

.match-card {
  width:100%; max-width:340px;
  background:var(--bg2); border:1px solid var(--rule);
  border-radius:16px; padding:1.6rem 1.4rem;
  position:relative;
  box-shadow:0 8px 40px rgba(0,0,0,0.3);
  transition:transform .4s ease, opacity .4s ease;
}
.match-card.swipe-left {
  transform:translateX(-120%) rotate(-8deg); opacity:0;
}
.match-card.swipe-right {
  transform:translateX(120%) rotate(8deg); opacity:0;
}

.match-avatar {
  width:72px; height:72px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-size:1.6rem; font-weight:700; color:var(--bg);
  margin:0 auto .8rem;
  box-shadow:0 4px 20px rgba(212,166,74,0.25);
}

.match-name {
  text-align:center; font-size:1.1rem; font-weight:700;
  margin-bottom:.2rem;
}
.match-meta {
  text-align:center; font-size:.78rem; color:var(--muted);
  margin-bottom:1rem;
}

.match-score-row {
  display:flex; align-items:center; gap:.6rem;
  margin-bottom:1.2rem;
}
.match-score-bar {
  flex:1; height:6px; border-radius:3px;
  background:var(--rule); overflow:hidden;
}
.match-score-fill {
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--accent2), var(--accent));
  transition:width 1s ease;
}
.match-score-num {
  font-size:.85rem; font-weight:700;
  color:var(--accent); font-family:var(--font-mono);
  min-width:42px; text-align:right;
}

.match-tags {
  display:flex; flex-wrap:wrap; gap:.4rem;
  margin-bottom:1rem;
}
.match-tag {
  font-size:.7rem; padding:.25rem .6rem;
  border-radius:10px; border:1px solid var(--rule);
  color:var(--ink2); background:rgba(24,31,71,0.5);
}
.match-tag.gold { border-color:var(--accent); color:var(--accent); }
.match-tag.cyan { border-color:var(--accent2); color:var(--accent2); }

.match-reason {
  background:rgba(212,166,74,0.06);
  border-left:2px solid var(--accent);
  padding:.6rem .8rem; border-radius:0 6px 6px 0;
  font-size:.82rem; line-height:1.6;
  color:var(--ink2); margin-bottom:1.2rem;
}

.match-actions {
  display:flex; gap:.8rem;
}
.match-actions button {
  flex:1; padding:.8rem; border-radius:10px;
  border:none; font-size:.9rem; font-weight:700;
  cursor:pointer; transition:all .3s;
}
.match-btn-pass {
  background:var(--bg3); color:var(--muted);
  border:1px solid var(--rule);
}
.match-btn-pass:hover { background:var(--rule); }
.match-btn-like {
  background:linear-gradient(135deg, var(--accent), var(--accent-dim));
  color:var(--bg);
  box-shadow:0 4px 16px rgba(212,166,74,0.3);
}
.match-btn-like:hover {
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(212,166,74,0.4);
}

.match-empty {
  text-align:center; padding:2rem;
}
.match-empty .cosmic-ring {
  width:120px; height:120px; margin-bottom:1.2rem;
}
.match-empty p { color:var(--muted); font-size:.9rem; }

/* ===================== FRIENDS PAGE ===================== */
.friends-page { padding:0; }
.friends-header {
  padding:1.2rem; display:flex; align-items:center; gap:.8rem;
  border-bottom:1px solid var(--rule);
}
.friends-header h2 {
  font-family:'Noto Serif SC',serif; font-size:1.15rem; flex:1;
}
.friends-tabs {
  display:flex; gap:.3rem;
}
.friends-tabs button {
  padding:.3rem .8rem; border-radius:12px;
  border:none; background:transparent;
  color:var(--muted); font-size:.75rem; cursor:pointer;
}
.friends-tabs button.on {
  background:var(--accent); color:var(--bg);
}

.friends-list {
  flex:1; overflow-y:auto; padding:.5rem 0;
}
.friend-item {
  display:flex; align-items:center; gap:.9rem;
  padding:.9rem 1.2rem;
  border-bottom:1px solid rgba(42,49,96,0.4);
  cursor:pointer; transition:background .2s;
}
.friend-item:hover { background:rgba(24,31,71,0.4); }
.friend-item .friend-avatar {
  width:48px; height:48px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; font-weight:700; color:var(--bg);
  flex-shrink:0;
}
.friend-item .friend-info { flex:1; min-width:0; }
.friend-item .friend-name {
  font-size:.95rem; font-weight:500; margin-bottom:.15rem;
}
.friend-item .friend-preview {
  font-size:.78rem; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.friend-item .friend-time {
  font-size:.7rem; color:var(--muted); flex-shrink:0;
}
.friend-item .friend-badge {
  width:8px; height:8px; border-radius:50%;
  background:var(--danger); flex-shrink:0;
}

/* ===================== FRIEND CHAT PAGE ===================== */
.friend-chat-page { padding:0; }
.friend-chat-header {
  padding:1rem 1.2rem; display:flex;
  align-items:center; gap:.8rem;
  border-bottom:1px solid var(--rule);
}
.friend-chat-header .friend-avatar-small {
  width:36px; height:36px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-size:.85rem; font-weight:700; color:var(--bg);
}
.friend-chat-header .friend-name-small {
  flex:1; font-size:.95rem; font-weight:500;
}
.friend-chat-header .safety-hint {
  font-size:.65rem; color:var(--muted);
  background:rgba(199,84,80,0.1);
  border:1px solid rgba(199,84,80,0.2);
  padding:.15rem .5rem; border-radius:8px;
}

/* safety toast */
.safety-toast {
  position:fixed; top:60px; left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:rgba(199,84,80,0.95);
  color:#fff; padding:.7rem 1.2rem; border-radius:8px;

<script>
// ===================== STATE =====================
let currentPage = 'hero';
let chartMode = 'xuan';
let chatMode = 'xuan';
let persona = 'master';
let userName = '';
let chartGenerated = false;

// ===================== NAVIGATION =====================
function goTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-dots button').forEach(b => b.classList.toggle('on', b.dataset.page === page));
  currentPage = page;

  if (page === 'chat' && document.getElementById('chatMessages').children.length === 0) {
    setTimeout(() => addAiMsg(getWelcomeMsg()), 400);
  }
}

// ===================== FORM =====================
function generateChart() {
  const name = document.getElementById('inputName').value;
  userName = name || '你';
  goTo('chart');
  if (!chartGenerated) {
    chartGenerated = true;
    drawChart();
    typeSummary();
  }
}

// ===================== CHART DRAWING =====================
function drawChart() {
  const c = document.getElementById('chartCanvas');
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height, CX = W/2, CY = H/2;

  // Zodiac signs (outer ring)
  const zodiac = ['白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯','水瓶','双鱼'];
  const bazi = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const ziwi = ['紫微','天机','太阳','武曲','天同','廉贞','天府','太阴','贪狼','巨门','天相','天梁'];

  ctx.clearRect(0,0,W,H);

  // Outer glow
  const grad = ctx.createRadialGradient(CX,CY,40,CX,CY,170);
  grad.addColorStop(0,'rgba(212,166,74,0.05)');
  grad.addColorStop(1,'rgba(108,209,212,0.02)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  // Rings
  const rings = [170,130,90,50];
  rings.forEach((r,i) => {
    ctx.beginPath(); ctx.arc(CX,CY,r,0,Math.PI*2);
    ctx.strokeStyle = i===0 ? 'rgba(212,166,74,0.25)' : 'rgba(108,209,212,0.12)';
    ctx.lineWidth = i===0 ? 1.5 : 1;
    ctx.stroke();
  });

  // Zodiac sectors (outer)
  zodiac.forEach((z,i) => {
    const ang = (i - 3) * Math.PI / 6;
    const x = CX + Math.cos(ang) * 155;
    const y = CY + Math.sin(ang) * 155;
    ctx.fillStyle = i % 2 === 0 ? '#d4a64a' : '#6cd1d4';
    ctx.font = '10px "Noto Sans SC"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(z, x, y);

    // Tick marks
    const tx1 = CX + Math.cos(ang) * 165;
    const ty1 = CY + Math.sin(ang) * 165;
    const tx2 = CX + Math.cos(ang) * 170;
    const ty2 = CY + Math.sin(ang) * 170;
    ctx.beginPath(); ctx.moveTo(tx1,ty1); ctx.lineTo(tx2,ty2);
    ctx.strokeStyle = 'rgba(212,166,74,0.3)'; ctx.stroke();
  });

  // BaZi ring
  bazi.forEach((b,i) => {
    const ang = (i - 2.5) * Math.PI / 5;
    const x = CX + Math.cos(ang) * 115;
    const y = CY + Math.sin(ang) * 115;
    ctx.fillStyle = '#c8c0a8';
    ctx.font = '9px "Noto Sans SC"';
    ctx.fillText(b, x, y);
  });

  // ZiWei ring
  ziwi.forEach((z,i) => {
    const ang = (i - 3) * Math.PI / 6;
    const x = CX + Math.cos(ang) * 75;
    const y = CY + Math.sin(ang) * 75;
    ctx.fillStyle = i % 3 === 0 ? '#d4a64a' : 'rgba(108,209,212,0.7)';
    ctx.font = '9px "Noto Sans SC"';
    ctx.fillText(z, x, y);
  });

  // Center
  ctx.beginPath(); ctx.arc(CX,CY,45,0,Math.PI*2);
  ctx.fillStyle = 'rgba(18,24,66,0.9)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(212,166,74,0.4)'; ctx.lineWidth = 1.5;
  ctx.stroke();

  // Center icon
  ctx.beginPath();
  ctx.moveTo(CX,CY-20); ctx.lineTo(CX+6,CY-6); ctx.lineTo(CX+20,CY);
  ctx.lineTo(CX+6,CY+6); ctx.lineTo(CX,CY+20);
  ctx.lineTo(CX-6,CY+6); ctx.lineTo(CX-20,CY);
  ctx.lineTo(CX-6,CY-6); ctx.closePath();
  ctx.fillStyle = 'rgba(212,166,74,0.6)'; ctx.fill();

  // Planets / points
  const planets = [
    {r:140, a:-0.8, c:'#d4a64a', s:5},
    {r:105, a:1.2, c:'#6cd1d4', s:4},
    {r:70, a:2.5, c:'#c75450', s:4},
    {r:150, a:3.8, c:'#d4a64a', s:3},
  ];
  planets.forEach(p => {
    const x = CX + Math.cos(p.a) * p.r;
    const y = CY + Math.sin(p.a) * p.r;
    ctx.beginPath(); ctx.arc(x,y,p.s,0,Math.PI*2);
    ctx.fillStyle = p.c; ctx.fill();
    ctx.shadowColor = p.c; ctx.shadowBlur = 8;
    ctx.fill(); ctx.shadowBlur = 0;
  });

  // Connecting lines
  ctx.beginPath();
  ctx.moveTo(CX+Math.cos(-0.8)*140, CY+Math.sin(-0.8)*140);
  ctx.lineTo(CX+Math.cos(1.2)*105, CY+Math.sin(1.2)*105);
  ctx.lineTo(CX+Math.cos(2.5)*70, CY+Math.sin(2.5)*70);
  ctx.strokeStyle = 'rgba(212,166,74,0.15)'; ctx.lineWidth = 1;
  ctx.stroke();
}

// ===================== TYPING SUMMARY =====================
function typeSummary() {
  const el = document.getElementById('chartSummary');
  const text = chartMode === 'xuan'
    ? `${userName}，你是一个「表面金、内核火」的命格。日主庚金坐午火，外显刚毅果决，内心热情重义。今年流年乙木透干，七杀星动，事业上会有较大变动，可能是换岗、跳槽或新项目启动。人际宫（第七宫）受土星压制，需注意与合作伙伴的沟通。健康方面，火金交战，注意呼吸道与心脏保养。`
    : `${userName}，从你的心理图谱来看，你呈现"高尽责性 + 高开放性"的组合——做事有条理，但同时渴望突破现状。当前正处于"职业探索期"，对现有路径产生质疑是正常的发展阶段。建议把注意力从"该不该跳"转向"跳去哪里能发挥你的系统思维优势"。`;

  let i = 0;
  el.innerHTML = '<span class="typing-cursor"></span>';
  const cursor = el.querySelector('.typing-cursor');

  function tick() {
    if (i < text.length) {
      cursor.before(document.createTextNode(text[i]));
      i++;
      setTimeout(tick, 30 + Math.random() * 40);
    } else {
      cursor.remove();
    }
  }
  tick();
}

function setMode(m) {
  chartMode = m;
  document.getElementById('modeXuan').classList.toggle('on', m==='xuan');
  document.getElementById('modeLi').classList.toggle('on', m==='li');
  typeSummary();
}

// ===================== CHAT =====================
function setPersona(p) {
  persona = p;
  document.querySelectorAll('.persona-chip').forEach(c => c.classList.toggle('on', c.dataset.p === p));
}
function setChatMode(m) {
  chatMode = m;
  document.getElementById('chatModeXuan').classList.toggle('on', m==='xuan');
  document.getElementById('chatModeLi').classList.toggle('on', m==='li');
}

function getWelcomeMsg() {
  const msgs = {
    master: { xuan:'「老法师」来了。把你的八字、星盘都已看过，有什么想问的，尽管说。', li:'你好，我已结合你的出生数据做了初步分析。有什么具体困扰，可以告诉我。' },
    advisor: { xuan:'星辰已就位。我是你的占星顾问，今天想从哪个宫位聊起？', li:'基于你的星盘数据，我有一些观察想和你分享。你想先聊事业还是关系？' },
    junior: { xuan:'师兄/师姐好~ 我帮你把命盘都排好了，有什么烦心事跟我讲讲呗~', li:'嗨！我看了你的数据，感觉你最近压力不小呢。想聊聊吗？' }
  };
  return msgs[persona][chatMode];
}

function addUserMsg(text) {
  const wrap = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg user'; div.textContent = text;
  wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
}

function addAiMsg(text, isTyping) {
  const wrap = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  const nameMap = { master:'老法师', advisor:'占星顾问', junior:'师妹' };
  div.innerHTML = `<div class="ai-name">${nameMap[persona]}</div><span class="ai-text">${isTyping ? '' : text}</span>`;
  wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
  return div;
}

const chatResponses = {
  master: {
    xuan: [
      '你今年是「伤官见官」的流年，职场上容易与上司意见不合。但伤官也代表才华外露，若能顺势而为，反而能脱颖而出。','你命中的「文昌」位在东南，若书房或办公桌能朝向此方，对思路清明大有助益。','你八字火旺，心直口快是天性。但今年木气透干，说话前多停三秒，可避免不少口舌是非。'
    ],
    li: [
      '从发展心理学角度看，你当前处于"成年初显期"向"成年期"过渡的阶段，对稳定的渴望与对自由的向往同时存在，这种张力是成长的动力。','你的决策风格偏向"直觉型"，这让你在创意领域有优势，但在需要精细规划的财务决策上，建议引入"预演机制"——在脑中模拟三种可能结果后再行动。','你提到的焦虑，本质上是对"失控感"的反应。试着把大目标拆解成每周可完成的小行动，掌控感会自然回来。'
    ]
  },
  advisor: {
    xuan: [
      '你的上升星座在天秤，这让你在人群中显得温和有礼，但太阳天蝎的内核又让你对真相有近乎偏执的追求。','土星正在你的第十宫逆行，这意味着事业上的压力不是坏事——它在帮你筛选真正值得投入的方向。','你的月亮落在巨蟹，家对你而言不仅是物理空间，更是情绪的锚点。搬家或装修时，优先布置一个让你感到安全的角落。'
    ],
    li: [
      '荣格会说，你正在经历"个体化"过程中的一个关键节点。那些让你失眠的选择，其实是潜意识在催促你整合人格中未被认领的部分。','从依恋理论来看，你在亲密关系中的"焦虑-回避"摇摆，与早年经历有关。认识到这一点，就是改变的开始。','你的星盘显示强烈的"变革者"原型——这解释了为什么你总是在别人觉得"够了"的时候，还想再往前一步。'
    ]
  },
  junior: {
    xuan: [
      '唔...我看了下，你今年的桃花位在西南方哦！如果想脱单，可以在那个方向放一盏粉色小灯~','师兄/师姐你别太焦虑啦，八字里「食神」旺的人本来就容易想太多。吃点好吃的，心情会好很多！','你的「驿马」星动了，今年可能会有出差或短途旅行的机会，说不定会在路上遇到贵人呢！'
    ],
    li: [
      '其实很多时候我们焦虑的不是事情本身，而是对"不确定"的恐惧。你可以试试每天睡前写下三件今天做得还不错的小事，慢慢会好起来的。','你说最近睡不好？从睡眠卫生角度，睡前一小时别刷手机，试试白噪音或冥想，坚持两周会有改善。','人在压力大的时候容易陷入"灾难化思维"——把一件小事想象成天塌下来。下次这样想的时候，问自己：三个月后的我还会在意这件事吗？'
    ]
  }
};

function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  addUserMsg(text);
  input.value = '';

  // Show typing
  const aiDiv = addAiMsg('', true);
  const textSpan = aiDiv.querySelector('.ai-text');
  textSpan.className = 'ai-text ai-typing';

  setTimeout(() => {
    const pool = chatResponses[persona][chatMode];
    const reply = pool[Math.floor(Math.random() * pool.length)];
    textSpan.className = 'ai-text';
    textSpan.textContent = reply;
    document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
  }, 1200 + Math.random() * 800);
}

// Simulated "current user" for matching
const myBazi = '丙'; const myZodiac = '处女'; const myZiwi = '天机';

function computeMatchScore(u) {
  let s = 50;
  // Bazi complementarity
  const pairs = [['甲','己'],['乙','庚'],['丙','辛'],['丁','壬'],['戊','癸']];
  const myPair = pairs.find(p => p.includes(myBazi));
  if (myPair && myPair.includes(u.baziDay)) s += 20;
  else if (myBazi === u.baziDay) s += 5;
  else s += 10;
  // Zodiac harmony
  const zCompat = {
    '处女':['金牛','摩羯','巨蟹'],'双鱼':['巨蟹','天蝎','摩羯'],
    '天蝎':['巨蟹','双鱼','处女'],'双子':['天秤','水瓶','狮子'],
    '水瓶':['双子','天秤','射手'],'天秤':['双子','水瓶','狮子'],
    '金牛':['处女','摩羯','巨蟹'],'摩羯':['金牛','处女','双鱼']
  };
  if ((zCompat[myZodiac]||[]).includes(u.zodiac)) s += 15;
  // ZiWei complement
  const ziwiGroups = [['紫微','天府'],['天机','天梁'],['太阳','太阴'],['武曲','贪狼'],['天同','巨门']];
  const myZg = ziwiGroups.find(g => g.includes(myZiwi));
  if (myZg && myZg.includes(u.ziwi)) s += 10;
  return Math.min(96, Math.max(55, s + Math.floor(Math.random()*8)));
}

function matchReason(u, score) {
  const reasons = [];
  if (score >= 80) reasons.push('八字天干相合，命理共振度高');
  else if (score >= 70) reasons.push('八字互补，能互相补足短板');
  else reasons.push('八字无冲，相处较为平和');

  const zc = {
    '处女':['金牛','摩羯'],'双鱼':['巨蟹','天蝎'],
    '天蝎':['巨蟹','双鱼'],'双子':['天秤','水瓶'],
    '水瓶':['双子','天秤'],'天秤':['双子','水瓶'],
    '金牛':['处女','摩羯'],'摩羯':['金牛','处女']
  };
  if ((zc[myZodiac]||[]).includes(u.zodiac)) reasons.push(`星座同属「${['土','水','风','火'][['金牛','处女','摩羯'].includes(u.zodiac)?0:['巨蟹','天蝎','双鱼'].includes(u.zodiac)?1:['双子','天秤','水瓶'].includes(u.zodiac)?2:3]}象」，天然默契`);
  else reasons.push(`星座${u.zodiac}与你的${myZodiac}形成有趣的对照，互补成长`);

  const zgMap = {
    '紫微':'领导型','天府':'稳重型','天机':'智慧型','天梁':'服务型',
    '太阳':'热情型','太阴':'温柔型','武曲':'务实型','贪狼':'魅力型',
    '天同':'随和型','巨门':'表达型','廉贞':'原则型','天相':'协调型'
  };
  reasons.push(`紫微主星「${u.ziwi}」是${zgMap[u.ziwi]}，与你的${zgMap[myZiwi]}可形成${score>=80?'强强联合':'良好互补'}`);
  return reasons;
}

// Safety filter
const unsafeKeywords = [
  /(?:微信|wechat|wx)/i, /(?:qq)/i, /(?:电话|手机|号码)/i,
  /(?:见面|约出来|出来玩|线下|见面)/i, /(?:地址|住哪|住在|家住|公司地址)/i,
  /(?:转帐|转账|支付宝|银行卡|红包)/i, /(?:来我家|去你家|来我这)/i
];

function checkSafety(text) {
  for (const kw of unsafeKeywords) {
    if (kw.test(text)) {
      return {
        blocked: true,
        reason: text.match(/(?:微信|qq|电话|手机|见面|线下|地址|转账|支付宝|来我家)/i) ?
          '司南提醒：为了保护你的安全，请勿在平台内交换联系方式、地址或约见线下。真正的缘分不需要急于一时。' :
          '司南提醒：检测到敏感信息，已拦截。平台禁止透露个人信息或约见线下，请通过平台安全交流。'
      };
    }
  }
  return { blocked: false };
}

function sendFriendMsg() {
  const input = document.getElementById('friendChatInput');
  const text = input.value.trim();
  if (!text) return;

  const safety = checkSafety(text);
  if (safety.blocked) {
    showSafetyToast(safety.reason);
    input.value = '';
    return;
  }

  const time = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
  addFriendMsgBubble('me', text, time);
  if (!friendMessages[currentFriendId]) friendMessages[currentFriendId] = [];
  friendMessages[currentFriendId].push({ from:'me', text, time });
  input.value = '';

  // Simulate reply
  setTimeout(() => {
    const pool = friendReplies[currentFriendId] || ['哈哈，真的吗？','我也这么觉得！','这个角度很有意思~'];
    const reply = pool[Math.floor(Math.random() * pool.length)];
    const rtime = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
    addFriendMsgBubble('them', reply, rtime);
    friendMessages[currentFriendId].push({ from:'them', text:reply, time:rtime });
  }, 1500 + Math.random() * 1500);
}
