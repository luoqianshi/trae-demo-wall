<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝花夕拾 · 记忆树</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =============================================
   Design Tokens
   ============================================= */
:root {
  --ink:      #141413;
  --bg:       #faf9f5;
  --bg2:      #f2f0ea;
  --bg3:      #e8e6dc;
  --muted:    #b0aea5;
  --accent:   #d97757;
  --accent2:  #6a9bcc;
  --green:    #788c5d;
  --orange-soft: #f5e6dc;
  --blue-soft:  #dfe9f2;
  --green-soft: #e5ece0;
  --radius:   6px;
  --shadow:   0 1px 3px rgba(20,20,19,0.05);
  --font-serif: 'Noto Serif SC', 'Georgia', 'Songti SC', serif;
  --font-sans:  'Noto Sans SC', sans-serif;
  --nav-w:     260px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: var(--font-serif);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* =============================================
   App Shell
   ============================================= */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* =============================================
   Sidebar
   ============================================= */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: var(--nav-w);
  height: 100vh;
  background: var(--bg2);
  border-right: 1px solid var(--bg3);
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.sidebar-brand {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--bg3);
  flex-shrink: 0;
}
.sidebar-brand-inner { display: flex; align-items: center; gap: 10px; }
.sidebar-logo { width: 32px; height: 32px; flex-shrink: 0; }
.sidebar-logo svg { width: 100%; height: 100%; }
.sidebar-title-group { display: flex; flex-direction: column; }
.sidebar-title {
  font-family: var(--font-serif);
  font-size: 1rem; font-weight: 700; color: var(--ink);
  letter-spacing: 0.05em; line-height: 1.3;
}
.sidebar-subtitle {
  font-family: var(--font-sans);
  font-size: 0.6rem; color: var(--muted); letter-spacing: 0.08em;
}

.sidebar-shouyi { padding: 12px 16px; flex-shrink: 0; }
.shouyi-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 8px 0;
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius);
  font-family: var(--font-serif); font-size: 0.8rem; font-weight: 600;
  letter-spacing: 0.12em; cursor: pointer; transition: all 0.25s;
}
.shouyi-btn:hover {
  background: #c26243; transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(217,119,87,0.2);
}
.shouyi-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 4px 0; }
.sidebar-nav::-webkit-scrollbar { width: 3px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }

.nav-section-title {
  padding: 14px 20px 4px;
  font-family: var(--font-sans); font-size: 0.6rem; font-weight: 700;
  color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase;
}

.nav-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 20px;
  cursor: pointer; transition: all 0.15s;
  border-left: 2px solid transparent; position: relative; min-height: 34px;
}
.nav-item:hover { background: rgba(217,119,87,0.04); border-left-color: var(--bg3); }
.nav-item.active { background: rgba(217,119,87,0.06); border-left-color: var(--accent); }

.nav-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--bg3); flex-shrink: 0; transition: all 0.25s;
}
.nav-item.active .nav-dot {
  background: var(--accent); box-shadow: 0 0 0 2px rgba(217,119,87,0.15);
}
.nav-item.seed-garden .nav-dot { background: var(--green); }
.nav-item.seed-garden.active .nav-dot { box-shadow: 0 0 0 2px rgba(120,140,93,0.15); }

.nav-name {
  font-family: var(--font-sans); font-size: 0.82rem; color: var(--ink);
  line-height: 1.4; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color 0.15s;
}
.nav-item.active .nav-name { color: var(--accent); font-weight: 600; }

.nav-name-input {
  font-family: var(--font-sans); font-size: 0.82rem; line-height: 1.4;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--accent); border-radius: 3px; padding: 1px 6px;
  outline: none; width: 100%; min-width: 0;
  box-shadow: 0 0 0 2px rgba(217,119,87,0.1);
}

.nav-actions {
  display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0;
}
.nav-item:hover .nav-actions { opacity: 1; }
.nav-item.active .nav-actions { opacity: 1; }

.nav-action-btn {
  width: 20px; height: 20px; border: none; border-radius: 3px;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); transition: all 0.15s;
  font-size: 0.7rem; line-height: 1;
}
.nav-action-btn:hover { background: var(--bg3); color: var(--ink); }
.nav-action-btn.danger:hover { background: rgba(217,119,87,0.12); color: var(--accent); }

.nav-item.new-theme { border-left-color: transparent; color: var(--muted); }
.nav-item.new-theme:hover { color: var(--accent); background: rgba(217,119,87,0.04); }
.nav-item.new-theme .nav-dot { background: var(--accent); opacity: 0.5; }
.nav-item.new-theme:hover .nav-dot { opacity: 1; }

.sidebar-footer {
  padding: 10px 16px 14px; border-top: 1px solid var(--bg3); flex-shrink: 0;
}
.sidebar-footer-top {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
}
.ai-toggle {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--font-sans); font-size: 0.68rem; color: var(--muted);
  cursor: pointer; user-select: none;
}
.toggle-track {
  width: 26px; height: 14px; border-radius: 7px;
  background: var(--bg3); position: relative; transition: background 0.3s; cursor: pointer;
}
.toggle-track.active { background: var(--green); }
.toggle-knob {
  position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
  border-radius: 50%; background: #fff;
  transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}
.toggle-track.active .toggle-knob { transform: translateX(12px); }
.settings-link {
  font-family: var(--font-sans); font-size: 0.68rem;
  color: var(--muted); text-decoration: none; transition: color 0.15s;
}
.settings-link:hover { color: var(--ink); }
.sidebar-footer-version {
  font-family: var(--font-sans); font-size: 0.55rem; color: var(--muted); opacity: 0.5;
}

/* =============================================
   Main Area
   ============================================= */
.main-area {
  margin-left: var(--nav-w);
  flex: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main-placeholder {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--muted);
  font-family: var(--font-serif);
  font-size: 0.9rem;
  font-style: italic;
  letter-spacing: 0.05em;
  opacity: 0.5;
  user-select: none;
}

/* 主题内容区 */
.theme-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  animation: fadeIn 0.3s ease-out;
  overflow: hidden;
}

.theme-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 32px;
  border-bottom: 1px solid var(--bg3);
  flex-shrink: 0;
  min-height: 56px;
}

.theme-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.theme-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.theme-header-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--orange-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  flex-shrink: 0;
}

.theme-header-title {
  font-family: var(--font-serif);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.02em;
}

.theme-header-count {
  font-family: var(--font-sans);
  font-size: 0.7rem;
  color: var(--muted);
  background: var(--bg2);
  padding: 1px 10px;
  border-radius: 10px;
  border: 1px solid var(--bg3);
}

.add-stack-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border: 1px solid var(--bg3);
  border-radius: 20px;
  background: var(--bg);
  font-family: var(--font-sans);
  font-size: 0.78rem;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
}

.add-stack-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(217,119,87,0.04);
}

.add-stack-btn svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

/* 小眼睛按钮 */
.eye-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--bg3);
  border-radius: 50%;
  background: var(--bg);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}

.eye-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(217,119,87,0.04);
}

.eye-btn svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 卡片堆排序浮层 */
.stacks-sort-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(20,20,19,0.15);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stacks-sort-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.stacks-sort-panel {
  background: var(--bg);
  border: 1px solid var(--bg3);
  border-radius: calc(var(--radius) + 4px);
  width: 360px;
  max-width: 90vw;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(20,20,19,0.1);
  transform: translateY(12px) scale(0.97);
  transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.stacks-sort-overlay.show .stacks-sort-panel {
  transform: translateY(0) scale(1);
}

.stacks-sort-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--bg3);
  flex-shrink: 0;
}

.stacks-sort-title {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
}

.stacks-sort-close {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: all 0.15s;
}

.stacks-sort-close:hover {
  background: var(--bg2);
  color: var(--ink);
}

.stacks-sort-close svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

.stacks-sort-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  list-style: none;
  margin: 0;
}

.sort-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  margin-bottom: 4px;
  background: var(--bg2);
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: grab;
  transition: all 0.2s;
  user-select: none;
}

.sort-item:hover {
  border-color: var(--bg3);
}

.sort-item.dragging {
  opacity: 0.5;
  cursor: grabbing;
  border-color: var(--accent);
  background: var(--orange-soft);
}

.sort-item.drag-over {
  border-top: 2px solid var(--accent);
}

.sort-handle {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: var(--muted);
  opacity: 0.4;
  flex-shrink: 0;
}

.sort-handle span {
  display: block;
  width: 12px;
  height: 1.5px;
  background: currentColor;
  border-radius: 1px;
}

.sort-index {
  font-family: var(--font-sans);
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--muted);
  background: var(--bg);
  padding: 1px 7px;
  border-radius: 4px;
  border: 1px solid var(--bg3);
  flex-shrink: 0;
}

.sort-name {
  font-family: var(--font-serif);
  font-size: 0.85rem;
  color: var(--ink);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sort-count {
  font-family: var(--font-sans);
  font-size: 0.65rem;
  color: var(--muted);
  flex-shrink: 0;
}

.stacks-sort-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--bg3);
  text-align: center;
  font-family: var(--font-sans);
  font-size: 0.7rem;
  color: var(--muted);
  opacity: 0.6;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 卡片堆网格 */
.stacks-grid {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 24px 32px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  cursor: grab;
  scroll-behavior: smooth;
  flex: 1;
  align-items: stretch;
  position: relative;
  /* 右侧渐变淡出提示可滚动 */
  -webkit-mask-image: linear-gradient(to right, transparent 0px, black 24px, black calc(100% - 40px), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0px, black 24px, black calc(100% - 40px), transparent 100%);
}

.stacks-grid:active {
  cursor: grabbing;
}

.stacks-grid::-webkit-scrollbar { display: none; }

/* 底部拖动栏 */
.stacks-scrollbar {
  flex-shrink: 0;
  height: 64px;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-top: 1px solid var(--bg3);
  background: var(--bg2);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
}

.stacks-scrollbar:active { cursor: grabbing; }

.stacks-scrollbar-track {
  width: 100%;
  max-width: 400px;
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}

.stacks-scrollbar-thumb {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: var(--muted);
  border-radius: 2px;
  transition: background 0.2s;
  cursor: grab;
}

.stacks-scrollbar-thumb:hover,
.stacks-scrollbar-thumb:active {
  background: var(--accent);
  cursor: grabbing;
}

.stacks-scrollbar-hint {
  position: absolute;
  left: 50%;
  top: 10px;
  transform: translateX(-50%);
  font-family: var(--font-sans);
  font-size: 0.6rem;
  color: var(--muted);
  opacity: 0.5;
  letter-spacing: 0.1em;
}

/* 单个卡片堆 */
.stack-block {
  background: var(--bg2);
  border: 1px solid var(--bg3);
  border-radius: calc(var(--radius) + 2px);
  padding: 24px;
  transition: border-color 0.2s, box-shadow 0.2s;
  animation: fadeIn 0.3s ease-out;
  min-width: 380px;
  max-width: 380px;
  flex-shrink: 0;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  height: 560px;
}

.stack-block:hover {
  border-color: rgba(217,119,87,0.15);
}

.stack-block-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 8px;
  min-height: 40px;
}

.stack-block-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
}

.stack-block-index {
  font-family: var(--font-sans);
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.05em;
  background: var(--bg);
  padding: 1px 8px;
  border-radius: 4px;
  border: 1px solid var(--bg3);
  flex-shrink: 0;
}

.stack-block-name {
  font-family: var(--font-serif);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
  cursor: pointer;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 0.15s;
  padding: 1px 4px;
  border: 1px solid transparent;
  border-radius: 3px;
}

.stack-block-name:hover {
  color: var(--accent);
  border-color: var(--bg3);
  background: var(--bg);
}

.stack-block-name-input {
  font-family: var(--font-serif);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
  background: var(--bg);
  border: 1px solid var(--accent);
  border-radius: 3px;
  padding: 1px 4px;
  outline: none;
  min-width: 60px;
  flex: 1;
  box-shadow: 0 0 0 2px rgba(217,119,87,0.1);
}

.stack-block-count {
  font-family: var(--font-sans);
  font-size: 0.7rem;
  color: var(--muted);
  flex-shrink: 0;
}

.stack-block-actions {
  display: flex;
  gap: 6px;
}

.stack-action-btn {
  width: 26px;
  height: 26px;
  border: 1px solid var(--bg3);
  border-radius: 50%;
  background: var(--bg);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: all 0.15s;
}

.stack-action-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--orange-soft);
}

.stack-action-btn svg {
  width: 13px;
  height: 13px;
  fill: currentColor;
}

/* 卡片堆叠视口 */
.stack-viewport {
  position: relative;
  flex: 1;
  width: 100%;
  min-height: 300px;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}

.stack-cards-wrap {
  position: relative;
  width: 100%;
  height: 100%;
}

.stack-card {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  perspective: 1000px;
  cursor: grab;
  transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
              opacity 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.stack-card:active { cursor: grabbing; }

.stack-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 280px;
  transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
  transform-style: preserve-3d;
}

.stack-scroll-hint {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0.3;
  pointer-events: none;
  z-index: 200;
}

.hint-arrow {
  font-family: var(--font-sans);
  font-size: 0.55rem;
  color: var(--muted);
}

.hint-arrow.up {
  animation: hintBounceUp 2s ease-in-out infinite;
}

.hint-arrow.down {
  animation: hintBounceDown 2s ease-in-out infinite;
}

@keyframes hintBounceUp {
  0%, 100% { transform: translateY(0); opacity: 0.3; }
  50% { transform: translateY(-4px); opacity: 0.6; }
}

@keyframes hintBounceDown {
  0%, 100% { transform: translateY(0); opacity: 0.3; }
  50% { transform: translateY(4px); opacity: 0.6; }
}

.hint-text {
  font-family: var(--font-sans);
  font-size: 0.5rem;
  color: var(--muted);
  writing-mode: vertical-rl;
  letter-spacing: 0.2em;
  text-orientation: mixed;
}

.stack-card.flipped .stack-card-inner {
  transform: rotateY(180deg);
}

.card-side {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;

function createThemeItem(theme) {
  const div = document.createElement('div');

  nameSpan.className = 'nav-name';
  nameSpan.textContent = theme.name;

  const actions = document.createElement('div');
  actions.className = 'nav-actions';

  const renameBtn = document.createElement('button');
  renameBtn.className = 'nav-action-btn';
  renameBtn.title = '重命名';
  renameBtn.textContent = '✎';
  renameBtn.addEventListener('click', (e) => { e.stopPropagation(); startRename(theme, nameSpan, actions); });

  const delBtn = document.createElement('button');
  delBtn.className = 'nav-action-btn danger';

  delBtn.textContent = '×';

  actions.appendChild(renameBtn);

// ── 底部滚动条联动 ──
function initScrollbar(grid) {
  const scrollbar = document.getElementById('stacksScrollbar');
  const thumb = document.getElementById('stacksScrollThumb');
  if (!scrollbar || !thumb || !grid) return;

  function updateThumb() {
    const ratio = grid.clientWidth / grid.scrollWidth;
    if (ratio >= 1) {
      thumb.style.display = 'none';
      return;
    }
    thumb.style.display = 'block';
    const track = thumb.parentElement;
    const thumbWidth = track.clientWidth * ratio;
    thumb.style.width = thumbWidth + 'px';
    const scrollRatio = grid.scrollLeft / (grid.scrollWidth - grid.clientWidth);
    const left = (track.clientWidth - thumbWidth) * scrollRatio;
    thumb.style.left = left + 'px';
  }

  updateThumb();
  grid.addEventListener('scroll', updateThumb);
  window.addEventListener('resize', updateThumb);

  // 拖动thumb
  let isDragging = false;
  let startX, startScrollLeft;

  thumb.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.pageX;
    startScrollLeft = grid.scrollLeft;
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const track = thumb.parentElement;
    const dx = e.pageX - startX;
    const ratio = dx / (track.clientWidth - thumb.offsetWidth);
    grid.scrollLeft = startScrollLeft + ratio * (grid.scrollWidth - grid.clientWidth);
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // 点击track跳转
  thumb.parentElement.addEventListener('click', (e) => {
    if (e.target === thumb) return;
    const track = thumb.parentElement;
    const rect = track.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const ratio = clickX / track.clientWidth;
    grid.scrollLeft = ratio * (grid.scrollWidth - grid.clientWidth);
  });

  // 底部拖动栏整体拖拽
  let barDragging = false;
  let barStartX, barStartScrollLeft;

  scrollbar.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
    barDragging = true;
    barStartX = e.pageX;
    barStartScrollLeft = grid.scrollLeft;
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!barDragging) return;
    const dx = e.pageX - barStartX;
    grid.scrollLeft = barStartScrollLeft - dx * 2;
  });

  document.addEventListener('mouseup', () => {
    barDragging = false;
  });
}

function bindStackEvents(themeId, stackId) {
  const wrap = document.getElementById('cards-wrap-' + stackId);
  if (!wrap) return;

  const stack = THEMES.find(t => t.stacks.find(s => s.id === stackId));
  const cards = stack ? stack.stacks.find(s => s.id === stackId)?.cards || [] : [];
  const currentIndex = { value: 0 };

  // 更新卡片显示状态
  function updateCards() {
    const allCards = wrap.querySelectorAll('.stack-card');
    allCards.forEach((card, ci) => {
      const offset = ci - currentIndex.value;
      const isCurrent = offset === 0;
      const isBelow = offset > 0;
      const isAbove = offset < 0;

      if (isCurrent) {
        card.style.transform = 'translateY(0) scale(1)';
        card.style.opacity = '1';
        card.style.zIndex = '100';
      } else if (isBelow) {
        const yOffset = offset * 18;
        const scale = Math.max(0.9, 1 - offset * 0.03);
        const opacity = Math.max(0.2, 1 - offset * 0.15);
        card.style.transform = `translateY(${yOffset}px) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.zIndex = 100 - offset;
      } else {
        card.style.transform = 'translateY(-100%) scale(0.9)';
        card.style.opacity = '0';
        card.style.zIndex = '1';
      }
    });
  }

  // 滑动交互：左右切换AB面，上下切换卡片
  let startY = 0, startX = 0, isDragging = false, hadDrag = false;
  const threshold = 40;

  wrap.addEventListener('mousedown', (e) => {
    const card = e.target.closest('.stack-card');
    if (!card) return;
    
    isDragging = true;
    hadDrag = false;
    startY = e.clientY;
    startX = e.clientX;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dy = e.clientY - startY;
    const dx = e.clientX - startX;

    if (Math.abs(dy) > 5 || Math.abs(dx) > 5) {
      hadDrag = true;
    }

    const topCard = wrap.querySelector(`.stack-card[data-card-index="${currentIndex.value}"]`);
    if (!topCard) return;

    if (Math.abs(dy) > Math.abs(dx)) {
      const rotate = dx * 0.05;
      topCard.style.transition = 'none';
      topCard.style.transform = `translateY(${dy}px) rotate(${rotate}deg)`;
    } else {
      topCard.style.transition = 'none';
      const progress = Math.min(Math.abs(dx) / 150, 1);
      const rotateY = dx > 0 ? -progress * 180 : progress * 180;
      topCard.querySelector('.stack-card-inner').style.transform = `rotateY(${rotateY}deg)`;
    }
  });

  document.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;

    const dy = e.clientY - startY;
    const dx = e.clientX - startX;
    const topCard = wrap.querySelector(`.stack-card[data-card-index="${currentIndex.value}"]`);

    if (topCard) {
      topCard.style.transition = '';
      topCard.style.transform = '';
      topCard.querySelector('.stack-card-inner').style.transition = '';
      topCard.querySelector('.stack-card-inner').style.transform = '';
    }

    if (hadDrag || Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > threshold && topCard) {
          topCard.classList.toggle('flipped');
        }
      } else {
        if (dy > threshold && currentIndex.value < cards.length - 1) {
          currentIndex.value++;
          updateCards();
        } else if (dy < -threshold && currentIndex.value > 0) {
          currentIndex.value--;
          updateCards();
        }
      }
    } else {
      if (topCard) {
        const contentArea = topCard.querySelector('.card-side-content');
        if (contentArea) {
          contentArea.contentEditable = true;
          contentArea.focus();
        }
      }
    }

    hadDrag = false;
  });

  // 触摸事件支持
  wrap.addEventListener('touchstart', (e) => {
    if (e.target.closest('.card-side-content')) return;
    isDragging = true;
    hadDrag = false;
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dy = e.touches[0].clientY - startY;
    const dx = e.touches[0].clientX - startX;

    if (Math.abs(dy) > 5 || Math.abs(dx) > 5) {
      hadDrag = true;
    }

    const topCard = wrap.querySelector(`.stack-card[data-card-index="${currentIndex.value}"]`);
    if (!topCard) return;

    if (Math.abs(dy) > Math.abs(dx)) {
      const rotate = dx * 0.05;
      topCard.style.transition = 'none';
      topCard.style.transform = `translateY(${dy}px) rotate(${rotate}deg)`;
    } else {
      topCard.style.transition = 'none';
      const progress = Math.min(Math.abs(dx) / 150, 1);
      const rotateY = dx > 0 ? -progress * 180 : progress * 180;
      topCard.querySelector('.stack-card-inner').style.transform = `rotateY(${rotateY}deg)`;
    }
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (!isDragging) return;
    isDragging = false;
    hadDrag = false;

    const dy = e.changedTouches[0].clientY - startY;
    const dx = e.changedTouches[0].clientX - startX;
    const topCard = wrap.querySelector(`.stack-card[data-card-index="${currentIndex.value}"]`);

    if (topCard) {
      topCard.style.transition = '';
      topCard.style.transform = '';
      topCard.querySelector('.stack-card-inner').style.transition = '';
      topCard.querySelector('.stack-card-inner').style.transform = '';
    }

    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > threshold && topCard) {
        topCard.classList.toggle('flipped');
      }
    } else {
      if (dy > threshold && currentIndex.value < cards.length - 1) {
        currentIndex.value++;
        updateCards();
      } else if (dy < -threshold && currentIndex.value > 0) {
        currentIndex.value--;
        updateCards();
      }
    }
  });

  // 鼠标滚轮支持
  wrap.addEventListener('wheel', (e) => {
    if (e.deltaY > 0 && currentIndex.value < cards.length - 1) {
      e.preventDefault();
      currentIndex.value++;
      updateCards();
    } else if (e.deltaY < 0 && currentIndex.value > 0) {
      e.preventDefault();
      currentIndex.value--;
      updateCards();
    }
  }, { passive: false });

  // 卡片内容编辑保存
  wrap.querySelectorAll('.card-side-content').forEach(contentEl => {
    contentEl.addEventListener('blur', () => {
      contentEl.contentEditable = false;
      const content = contentEl.textContent.trim();
      if (!content) {
        const isFront = !contentEl.parentElement.classList.contains('card-side-back');
        contentEl.textContent = isFront ? '记录此刻的想法…' : '等待你的再表达…';
        contentEl.classList.add('placeholder');
      } else {
        contentEl.classList.remove('placeholder');
        const card = contentEl.closest('.stack-card');
        if (card) {
          const cardIdx = parseInt(card.dataset.cardIndex);
          const isFront = !contentEl.parentElement.classList.contains('card-side-back');
          const theme = THEMES.find(t => t.stacks.find(s => s.id === stackId));
          if (theme) {
            const stack = theme.stacks.find(s => s.id === stackId);
            if (stack && stack.cards[cardIdx]) {
              stack.cards[cardIdx][isFront ? 'a' : 'b'] = content;
            }
          }
        }
      }
    });
  });

  updateCards();
}

// ── 水平滚动拖拽支持 ──
function initHorizontalScroll(container) {
  if (!container) return;
  let isDown = false, startX, scrollLeft;

  container.addEventListener('mousedown', (e) => {
    isDown = true;
    container.classList.add('active');
    startX = e.pageX - container.offsetLeft;
    scrollLeft = container.scrollLeft;
  });

  container.addEventListener('mouseleave', () => {
    isDown = false;
    container.classList.remove('active');
  });

  container.addEventListener('mouseup', () => {
    isDown = false;
    container.classList.remove('active');
  });

  container.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - container.offsetLeft;
    const walk = (x - startX) * 1.5;
    container.scrollLeft = scrollLeft - walk;
  });

  // 滚轮横向滚动
  container.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      container.scrollLeft += e.deltaY;
    }
  }, { passive: false });
}

// ── 重命名卡片堆 ──
function beginRenameStack(themeId, stackId) {
  const nameEl = document.getElementById('stack-name-' + stackId);
  if (!nameEl) return;
  const currentName = nameEl.textContent;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'stack-block-name-input';
  input.value = currentName;
  input.maxLength = 30;

  nameEl.replaceWith(input);
  input.focus();
  input.select();

  function finishRename() {
    const newName = input.value.trim() || currentName;
    const theme = THEMES.find(t => t.id === themeId);
    if (theme) {
      const stack = theme.stacks.find(s => s.id === stackId);
      if (stack) stack.name = newName;
    }

    const span = document.createElement('span');
    span.className = 'stack-block-name';
    span.id = 'stack-name-' + stackId;
    span.textContent = newName;
    span.onclick = function () { beginRenameStack(themeId, stackId); };
    input.replaceWith(span);
  }

  input.addEventListener('blur', finishRename);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Escape') { input.value = currentName; input.blur(); }
  });
}

// ── 向卡片堆叠加新卡片 ──
function addCardToStack(themeId, stackId) {

  const stack = theme.stacks.find(s => s.id === stackId);

}

// ── 重命名 ──
function startRename(theme, nameSpan, actions) {
  nameSpan.style.display = 'none';
  actions.style.display = 'none';
  const parent = nameSpan.parentElement;
  const input = document.createElement('input');
  input.className = 'nav-name-input';
  input.type = 'text';
  input.value = theme.name;
  input.maxLength = 20;
  parent.insertBefore(input, nameSpan);
  input.focus();
  input.select();

  const finish = () => {
    const val = input.value.trim();
    if (val) { theme.name = val; nameSpan.textContent = val; }
    input.remove();
    nameSpan.style.display = '';
    actions.style.display = '';
    if (currentThemeId === theme.id) renderMainContent(theme.id);
  };

  input.addEventListener('blur', finish);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = theme.name; input.blur(); }
  });
}

      bindSeedCardEvents(wrap, card.id);
    });

    // 初始化水平滚动拖拽和滚动条

      initHorizontalScroll(grid);
      initScrollbar(grid);
    }
  }

  function bindSeedCardEvents(wrap, cardId) {
    const cards = [{ a: '', b: '' }];
    const currentIndex = { value: 0 };
    const startY = { value: 0 };
    const startX = { value: 0 };
    let isDragging = false, hadDrag = false;
    const threshold = 40;

    wrap.addEventListener('mousedown', (e) => {
      const card = e.target.closest('.stack-card');
      if (!card) return;
      isDragging = true;
      hadDrag = false;
      startY.value = e.clientY;
      startX.value = e.clientX;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dy = e.clientY - startY.value;
      const dx = e.clientX - startX.value;

      if (Math.abs(dy) > 5 || Math.abs(dx) > 5) {
        hadDrag = true;
      }

      const topCard = wrap.querySelector(`.stack-card[data-card-index="0"]`);
      if (!topCard) return;

      if (Math.abs(dy) > Math.abs(dx)) {
        const rotate = dx * 0.05;
        topCard.style.transition = 'none';
        topCard.style.transform = `translateY(${dy}px) rotate(${rotate}deg)`;
      } else {
        topCard.style.transition = 'none';
        const progress = Math.min(Math.abs(dx) / 150, 1);
        const rotateY = dx > 0 ? -progress * 180 : progress * 180;
        topCard.querySelector('.stack-card-inner').style.transform = `rotateY(${rotateY}deg)`;
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;

      const dy = e.clientY - startY.value;
      const dx = e.clientX - startX.value;
      const topCard = wrap.querySelector(`.stack-card[data-card-index="0"]`);

      if (topCard) {
        topCard.style.transition = '';
        topCard.style.transform = '';
        topCard.querySelector('.stack-card-inner').style.transition = '';
        topCard.querySelector('.stack-card-inner').style.transform = '';
      }

      if (hadDrag || Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
        if (Math.abs(dx) > Math.abs(dy)) {
          if (Math.abs(dx) > threshold && topCard) {
            topCard.classList.toggle('flipped');
          }
        }
      } else {
        if (topCard) {
          const contentArea = topCard.querySelector('.card-side-content');
          if (contentArea) {
            contentArea.contentEditable = true;
            contentArea.focus();
          }
        }
      }

      hadDrag = false;
    });

    wrap.querySelectorAll('.card-side-content').forEach(contentEl => {
      contentEl.addEventListener('blur', () => {
        contentEl.contentEditable = false;
        const content = contentEl.textContent.trim();
        const isFront = !contentEl.parentElement.classList.contains('card-side-back');

        if (!content) {
          contentEl.textContent = isFront ? '记录此刻的想法…' : '等待你的再表达…';
          contentEl.classList.add('placeholder');
        } else {
          contentEl.classList.remove('placeholder');
          const seedCards = JSON.parse(localStorage.getItem('zhxs_seed_cards') || '[]');
          const idx = seedCards.findIndex(c => c.id === cardId);
          if (idx !== -1) {
            if (isFront) {
              seedCards[idx].title = content;
            } else {
              seedCards[idx].bContent = content;
            }
            localStorage.setItem('zhxs_seed_cards', JSON.stringify(seedCards));
          }
        }
      });
    });
  }

  function deleteSeedCard(cardId) {
    const seedCards = JSON.parse(localStorage.getItem('zhxs_seed_cards') || '[]');
    const filtered = seedCards.filter(c => c.id !== cardId);
    localStorage.setItem('zhxs_seed_cards', JSON.stringify(filtered));
    renderSeedGarden();
    showToast('已删除卡片');
  }

  document.querySelector('.nav-item.seed-garden').addEventListener('click', () => {
    selectTheme('seed-garden');
  });

// ── 卡片堆排序浮层 ──
let sortCurrentThemeId = null;

function openStacksSort(themeId) {
  const theme = THEMES.find(t => t.id === themeId);
  if (!theme || !theme.stacks || theme.stacks.length === 0) {
    showToast('暂无卡片堆');
    return;
  }
  sortCurrentThemeId = themeId;

  const list = $('stacksSortList');
  list.innerHTML = '';

  theme.stacks.forEach((stack, idx) => {
    const li = document.createElement('li');
    li.className = 'sort-item';
    li.draggable = true;
    li.dataset.stackId = stack.id;
    li.innerHTML = `
      <div class="sort-handle"><span></span><span></span><span></span></div>
      <span class="sort-index">#${idx + 1}</span>
      <span class="sort-name">${stack.name || '卡片堆 #' + (idx + 1)}</span>
      <span class="sort-count">${stack.cards.length} 张卡片</span>
    `;
    list.appendChild(li);
  });

  initDragSort(list);
  $('stacksSortOverlay').classList.add('show');
}

function closeStacksSort() {
  $('stacksSortOverlay').classList.remove('show');
  sortCurrentThemeId = null;
}



function initDragSort(list) {
  let draggedItem = null;

  list.querySelectorAll('.sort-item').forEach(item => {
    item.addEventListener('dragstart', function(e) {
      draggedItem = this;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    item.addEventListener('dragend', function() {
      this.classList.remove('dragging');
      draggedItem = null;
      list.querySelectorAll('.sort-item').forEach(i => i.classList.remove('drag-over'));
      saveSortOrder(list);
    });

    item.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (this === draggedItem) return;
      this.classList.add('drag-over');
    });

    item.addEventListener('dragleave', function() {
      this.classList.remove('drag-over');
    });

    item.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      if (this === draggedItem) return;

      const allItems = [...list.querySelectorAll('.sort-item')];
      const draggedIdx = allItems.indexOf(draggedItem);
      const dropIdx = allItems.indexOf(this);

      if (draggedIdx < dropIdx) {
        this.after(draggedItem);
      } else {
        this.before(draggedItem);
      }
      updateSortIndices(list);
    });
  });
}

function updateSortIndices(list) {
  list.querySelectorAll('.sort-item').forEach((item, idx) => {
    item.querySelector('.sort-index').textContent = '#' + (idx + 1);
  });
}

function saveSortOrder(list) {
  if (!sortCurrentThemeId) return;
  const theme = THEMES.find(t => t.id === sortCurrentThemeId);
  if (!theme) return;

  const newOrder = [];
  list.querySelectorAll('.sort-item').forEach(item => {
    const stackId = item.dataset.stackId;
    const stack = theme.stacks.find(s => s.id === stackId);
    if (stack) newOrder.push(stack);
  });

  theme.stacks = newOrder;
  renderMainContent(sortCurrentThemeId);
  showToast('排序已保存');
}

// ── 卡片 AB 面编辑 ──
function onCardFocus(el) {
  el.classList.add('editing');
  if (el.classList.contains('placeholder')) {
    el.classList.remove('placeholder');
    el.textContent = '';
  }
}

function onCardBlur(el) {
  el.classList.remove('editing');

  const stackId = el.dataset.stack;
  const cardIdx = parseInt(el.dataset.card);
  const side = el.dataset.side;
  const content = el.textContent.trim();

  if (!content) {
    el.textContent = side === 'a' ? '记录此刻的想法…' : '等待你的再表达…';
    el.classList.add('placeholder');
    return;
  }

  let found = false;
  THEMES.forEach(theme => {
    theme.stacks.forEach(stack => {
      if (stack.id === stackId) {
        if (stack.cards && stack.cards[cardIdx]) {
          stack.cards[cardIdx][side] = content;
          found = true;
        }
      }
    });
  });

  if (found) {
    el.classList.remove('placeholder');
  }
}
