<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 私藏美食路书生成器 · 初赛 Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 顶部 -->
  <header class="topbar">
    <span class="logo">🍜 AI 私藏美食路书</span>
    <div class="topbar-right">
      <span class="api-status local" id="apiStatus">💾 本地模式</span>
      <span class="track">生活娱乐赛道</span>
    </div>
  </header>

  <main class="container">

    <!-- 左侧:输入面板 -->
    <aside class="panel-input">
      <h2>🗺️ 告诉我你想吃什么</h2>
      <p class="hint">填几个关键信息,AI 立刻帮你规划</p>

      <div class="field">
        <label>目的地</label>
        <div class="city-cascade">
          <select id="province" class="city-sel">
            <option value="">选择省份</option>
          </select>
          <select id="city" class="city-sel">
            <option value="">选择城市</option>
          </select>
          <input id="area" type="text" class="city-sel" placeholder="具体地点/片区(选填)" />
        </div>
      </div>

      <div class="field">
        <label>游玩时长</label>
        <input id="duration" type="text" placeholder="例如:3 天 2 夜 / 5 天 4 晚 / 一周" />
      </div>

      <div class="field">
        <label>人数</label>
        <input id="people" type="text" value="2 大 1 小(7岁)" />
      </div>

      <div class="field">
        <label>饮食偏好(可多选)</label>
        <div class="chips" id="prefChips">
          <span class="chip" data-pref="local">本地特色</span>
          <span class="chip" data-pref="spicy">川菜/重口</span>
          <span class="chip" data-pref="snack">小吃</span>
          <span class="chip" data-pref="hotpot">火锅</span>
          <span class="chip" data-pref="dessert">甜品</span>
          <span class="chip" data-pref="cafe">咖啡馆</span>
          <span class="chip" data-pref="kid">亲子友好</span>
          <span class="chip" data-pref="light">清淡</span>
        </div>
      </div>

      <div class="field">
        <label>特别需求</label>
        <textarea id="note" placeholder="例如:不要游客店、需要宝宝餐、避免排队..."></textarea>
      </div>

      <!-- API 配置(可折叠) -->
      <div class="api-config" id="apiConfig">
        <div class="api-toggle" id="apiToggle">
          <span>⚙️ AI 模型配置</span>
          <span class="arrow">▸</span>
        </div>
        <div class="api-body collapsed" id="apiBody">
          <div class="field">
            <label>API 提供商</label>
            <select id="apiProvider">
              <option value="siliconflow">硅基流动</option>
              <option value="deepseek">DeepSeek</option>
              <option value="openai">OpenAI 兼容</option>
              <option value="custom">自定义</option>
            </select>
          </div>
          <div class="field">
            <label>API Key</label>
            <input id="apiKey" type="password" placeholder="sk-...（砝基流动 / DeepSeek Key，留空则使用本地数据）" />
          </div>
          <div class="field">
            <label>接口地址</label>
            <input id="apiEndpoint" type="text" value="https://api.siliconflow.cn/v1/chat/completions" />
          </div>
          <div class="field">
            <label>模型名称</label>
            <input id="apiModel" type="text" value="Qwen/Qwen3.5-9B" />
          </div>
          <p class="api-hint">💡 默认已配置为<b>砝基流动</b>，Key 请到 <code>cloud.siliconflow.cn</code> 获取</p>
        </div>
      </div>

      <button id="generateBtn" class="generate-btn">
        <span class="btn-text">✨ 一键生成我的美食路书</span>
      </button>
    </aside>

    <!-- 右侧:结果区 -->
    <section class="panel-result">

      <!-- 方案切换 -->
      <div class="theme-tabs" id="themeTabs">
        <!-- JS 动态渲染 -->
      </div>

      <!-- 路线卡片 -->
      <div class="route-card" id="routeCard">
        <div class="route-header">
          <div class="route-meta" id="routeMeta"></div>
          <h3 id="routeTitle">请输入你的需求,生成专属路书</h3>
          <p id="routeSubtitle" class="route-sub"></p>
          <div class="route-stats" id="routeStats"></div>
        </div>

        <!-- 真实地图 (Leaflet + OpenStreetMap) -->
        <div class="map-wrap">
          <div id="map"></div>
          <div class="map-hint">点击标记可查看餐厅详情 · 拖动可移动 · 滚轮可缩放</div>
        </div>

        <!-- 时间轴 -->
        <div class="timeline" id="timeline"></div>
      </div>

    </section>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <footer>
    <p>生活娱乐赛道 · 让每一座城市,都有属于你的私藏味道</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
