<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DeFat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090b0e;--panel:#13171b;--card:#171b1f;--card-border:rgba(255,255,255,.06);
  --sel-panel:#132521;--sel-border:rgba(112,245,181,.3);
  --mint:#70f5b5;--mint-dim:rgba(112,245,181,.12);
  --orange:#ff9e40;--red:#ff5e5e;
  --txt:#fff;--txt2:rgba(255,255,255,.62);--txt3:rgba(255,255,255,.38);
  --r:22px;--rs:14px;--nav-h:84px;--safe:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:'Nunito','SF Pro Rounded',-apple-system,sans-serif;color:var(--txt);font-weight:600}

/* ── Phone Shell ── */
.phone{position:relative;width:100%;max-width:390px;height:100vh;margin:0 auto;overflow:hidden;background:var(--bg)}
@media(min-width:500px){body{display:flex;align-items:center;justify-content:center}.phone{height:844px;border-radius:44px;border:3px solid rgba(255,255,255,.1);box-shadow:0 0 80px rgba(0,0,0,.8)}}
@media(max-width:499px){.phone{max-width:100%}}

/* ── Pages ── */
.page{position:absolute;inset:0;padding:0 20px calc(var(--nav-h) + 10px + var(--safe)) 20px;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease;transform:translateY(6px)}
.page.active{opacity:1;pointer-events:auto;transform:translateY(0)}
.page::-webkit-scrollbar{display:none}

/* ── Bottom Nav ── */
.nav{position:absolute;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe));padding-bottom:var(--safe);background:var(--panel);border-top:1px solid var(--card-border);display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--txt3);font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;transition:color .2s}
.nav-btn.on{color:var(--mint)}
.nav-btn svg{width:26px;height:26px;transition:transform .2s ease}
.nav-btn.on svg{transform:scale(1.08)}
.nav-btn.on svg .n-icon{stroke:var(--mint)}

/* ── Sheet Overlay ── */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .32s ease}
.overlay.on{opacity:1;pointer-events:auto}

/* ── Bottom Sheet ── */
.sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(100%);max-height:88vh;background:var(--panel);border-radius:26px 26px 0 0;z-index:210;overflow-y:auto;overflow-x:hidden;transition:transform .38s cubic-bezier(.32,.72,.24,1.02);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.open{transform:translateY(0)}
.sheet::-webkit-scrollbar{display:none}
.sheet-handle{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);margin:10px auto 0}

/* ── Timer Overlay ── */
.timer-page{position:absolute;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s ease}
.timer-page.active{opacity:1;pointer-events:auto}

/* ── Buttons ── */
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;background:var(--mint);color:#0a1f14;border:none;border-radius:var(--r);font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,opacity .15s}
.btn-primary:active{transform:scale(.97);opacity:.85}
.btn-secondary{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;height:52px;background:var(--card);color:var(--txt);border:1px solid var(--card-border);border-radius:var(--r);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s ease,background .15s ease}
.btn-secondary:active{transform:scale(.97);background:rgba(255,255,255,.05)}
.btn-secondary.pause-btn{border-color:var(--sel-border);color:var(--mint)}
.btn-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:var(--txt2);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s}
.btn-close:active{background:rgba(255,255,255,.15)}

/* ── Food Grid ── */
.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.food-card{background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .2s ease;position:relative;overflow:hidden}
.food-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(112,245,181,.06) 0%,transparent 60%);opacity:0;transition:opacity .2s}
.food-card:active{transform:scale(.96)}
.food-card.selected{background:var(--sel-panel);border-color:var(--sel-border)}
.food-card.selected::after{opacity:1}
.food-img{width:64px;height:64px;border-radius:50%;object-fit:contain;position:relative;z-index:1}
.food-name{font-size:13px;font-weight:700;text-align:center;position:relative;z-index:1}
.food-portion{font-size:11px;color:var(--txt3);font-weight:600;position:relative;z-index:1}
.food-cal{font-size:13px;font-weight:800;color:var(--orange);position:relative;z-index:1;transition:color .2s}
.food-card.selected .food-cal{color:var(--mint);font-size:14px}

/* ── Target Card ── */
.target-card{background:linear-gradient(145deg,#0f1f1b,#132521);border:1px solid var(--sel-border);border-radius:var(--r);padding:20px;display:flex;gap:18px;align-items:center}
.target-icon{width:72px;height:72px;border-radius:50%;overflow:hidden;flex-shrink:0;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.target-icon img{width:100%;height:100%;object-fit:contain}
.target-info{flex:1;min-width:0}
.target-label{font-size:12px;color:var(--txt3);font-weight:600;letter-spacing:.5px}
.target-num{font-size:42px;font-weight:900;color:var(--mint);line-height:1.1}
.target-unit{font-size:13px;font-weight:600;color:var(--mint);opacity:.7}
.target-food{font-size:14px;font-weight:700;color:var(--txt);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.target-spec{font-size:12px;color:var(--txt2);margin-top:1px}
.target-metrics{display:flex;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(112,245,181,.12)}
.metric{flex:1;text-align:center}
.metric-label{font-size:10px;color:var(--txt3);font-weight:600}
.metric-val{font-size:14px;font-weight:800;color:var(--txt);margin-top:2px}

/* ── Estimate Section ── */
.est-section{margin-top:20px}
.est-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.est-tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(255,158,64,.15);color:var(--orange)}
.option-row{display:flex;gap:8px}
.opt-btn{flex:1;height:38px;border-radius:var(--rs);border:1.5px solid var(--card-border);background:transparent;color:var(--txt2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .18s}
.opt-btn.on{background:var(--mint-dim);border-color:var(--sel-border);color:var(--mint)}
.opt-btn:active{transform:scale(.96)}

/* ── Exercise Cards ── */
.exercise-list{display:flex;flex-direction:column;gap:10px}
.ex-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);border:2px solid transparent;background:var(--card);cursor:pointer;transition:all .2s}
.ex-card:active{transform:scale(.98)}
.ex-card.selected{background:var(--sel-panel);border-color:var(--sel-border)}
.ex-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:800}
.ex-desc{font-size:11px;color:var(--txt3);font-weight:600;margin-top:1px}
.ex-meta{text-align:right;flex-shrink:0}
.ex-calpm{font-size:11px;color:var(--txt3);font-weight:600}
.ex-time{font-size:20px;font-weight:900;margin-top:1px}
.ex-hint{font-size:10px;color:var(--txt3);font-weight:600}
.ex-card.selected .ex-time{color:var(--mint)}
.ex-check{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:opacity .2s}
.ex-card.selected .ex-check{opacity:1}

/* ── Timer ── */
.gauge-wrap{position:relative;width:220px;height:220px;margin:10px auto 0}
.gauge-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge-track{fill:none;stroke:rgba(255,255,255,.06);stroke-width:10}
.gauge-fill{fill:none;stroke:var(--mint);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-food{width:52px;height:52px;border-radius:50%;object-fit:contain;margin-bottom:4px}
.gauge-time{font-size:32px;font-weight:900;letter-spacing:-.5px}
.gauge-pct{font-size:14px;color:var(--txt2);font-weight:700;margin-top:1px}
.timer-info{text-align:center;margin-top:20px}
.timer-name{font-size:18px;font-weight:800}
.timer-desc{font-size:13px;color:var(--txt2);margin-top:2px}
.timer-stats{display:flex;gap:10px;margin:20px 0;justify-content:center}
.stat-card{background:var(--card);border-radius:var(--rs);padding:14px 18px;text-align:center;flex:1;max-width:120px}
.stat-val{font-size:18px;font-weight:900}
.stat-val.burned{color:var(--mint)}
.stat-val.target{color:var(--orange)}
.stat-val.remain{color:var(--txt)}
.stat-label{font-size:10px;color:var(--txt3);font-weight:600;margin-top:2px}
.timer-actions{display:flex;gap:12px;padding:0 20px 40px}
.accel-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;background:rgba(255,158,64,.1);color:var(--orange);font-size:10px;font-weight:700}

/* ── History ── */
.history-summary{background:linear-gradient(145deg,#0f1f1b,#132521);border:1px solid var(--sel-border);border-radius:var(--r);padding:18px;margin-top:16px}
.summary-label{font-size:11px;color:var(--txt3);font-weight:700;letter-spacing:.5px}
.summary-main{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.summary-cal{font-size:32px;font-weight:900;color:var(--mint);letter-spacing:-.5px}
.summary-unit{font-size:12px;color:var(--mint);opacity:.7;font-weight:600}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(112,245,181,.12)}
.summary-item{text-align:center}
.summary-item-val{font-size:16px;font-weight:900;color:var(--txt)}
.summary-item-label{font-size:10px;color:var(--txt3);font-weight:600;margin-top:2px}
.history-list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.history-section-title{font-size:15px;font-weight:800;margin-top:20px;margin-bottom:4px}
.hist-card{background:var(--card);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;border:1px solid var(--card-border)}
.hist-food{width:48px;height:48px;border-radius:50%;object-fit:contain;flex-shrink:0;background:rgba(0,0,0,.15)}
.hist-info{flex:1;min-width:0}
.hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.hist-exercise{font-size:15px;font-weight:800}
.hist-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(112,245,181,.12);color:var(--mint)}
.hist-food-name{font-size:12px;color:var(--txt2);font-weight:600}
.hist-bottom{display:flex;gap:16px;margin-top:6px}
.hist-stat{font-size:11px;color:var(--txt3);font-weight:600}
.hist-stat span{color:var(--txt);font-weight:700}
.hist-date{font-size:10px;color:var(--txt3);font-weight:600}

/* ── Settings ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:160px;gap:12px}
.empty-icon{width:64px;height:64px;color:var(--mint);opacity:.5}
.empty-title{font-size:18px;font-weight:800;color:var(--txt)}
.empty-desc{font-size:14px;color:var(--txt3);text-align:center;line-height:1.5}
.settings-section{margin-top:30px}
.settings-group{background:var(--panel);border-radius:var(--r);overflow:hidden;border:1px solid var(--card-border)}
.settings-label{font-size:12px;color:var(--txt3);font-weight:700;padding:0 16px;margin-bottom:6px;letter-spacing:.5px}
.settings-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--card-border)}
.settings-item:last-child{border-bottom:none}
.settings-key{font-size:15px;font-weight:700}
.settings-val{font-size:15px;font-weight:600;color:var(--txt2)}
.settings-chevron{color:var(--txt3);font-size:18px;font-weight:400}
.settings-item.clickable{cursor:pointer;transition:background .15s}
.settings-item.clickable:active{background:rgba(255,255,255,.04)}
.settings-val-wrap{display:flex;align-items:center;gap:4px;color:var(--txt2)}
.settings-val-wrap .settings-val{color:var(--txt2)}

/* Toggle Switch */
.toggle{position:relative;display:inline-block;width:42px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.1);border-radius:13px;transition:.2s}
.toggle-slider:before{position:absolute;content:"";height:22px;width:22px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked + .toggle-slider{background:var(--mint)}
.toggle input:checked + .toggle-slider:before{transform:translateX(16px)}
.toggle input:disabled + .toggle-slider{opacity:.7}

/* Setting Picker Sheet */
.picker-title{font-size:17px;font-weight:800;text-align:center;margin:6px 0 18px}
.picker-option{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--rs);cursor:pointer;transition:background .15s;margin-bottom:6px}
.picker-option:hover,.picker-option:active{background:rgba(255,255,255,.04)}
.picker-option.selected{background:var(--sel-panel);border:1px solid var(--sel-border)}
.picker-option:not(.selected){border:1px solid var(--card-border)}
.picker-option-name{font-size:15px;font-weight:700}
.picker-option-desc{font-size:11px;color:var(--txt3);font-weight:600;margin-top:2px}
.picker-check{width:22px;height:22px;display:flex;align-items:center;justify-content:center;opacity:0;flex-shrink:0}
.picker-option.selected .picker-check{opacity:1}

/* Weight stepper */
.weight-picker{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px 0}
.weight-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--card-border);background:var(--card);color:var(--txt);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit}
.weight-btn:active{transform:scale(.92);background:rgba(255,255,255,.08)}
.weight-display{text-align:center;min-width:120px}
.weight-num{font-size:40px;font-weight:900;color:var(--mint);letter-spacing:-1px}
.weight-unit{font-size:13px;color:var(--txt2);font-weight:600;margin-top:2px}
.weight-range-label{text-align:center;font-size:11px;color:var(--txt3);font-weight:600;margin-top:8px}

/* ── Animations ── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.fade-in-up{animation:fadeInUp .35s ease both}
</style>
</head>
<body>
<div class="phone" id="app">

  <!-- ═══ PAGE: START ═══ -->
  <div class="page active" id="page-start">
    <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 20px">
      <div>
        <div style="font-size:26px;font-weight:900;letter-spacing:-.5px">DeFat</div>
        <div style="font-size:12px;color:var(--txt3);margin-top:2px">选择食物，开始有目标地消耗。</div>
      </div>
      <div class="top-weight" style="background:var(--card);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--txt2);font-weight:700">70 千克</div>
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:17px;font-weight:800">选择食物</div>
      <div style="font-size:12px;color:var(--txt3);margin-top:2px">点击食物卡片查看消耗方案</div>
    </div>
    <div class="food-grid" id="food-grid"></div>
  </div>

  <!-- ═══ PAGE: HISTORY ═══ -->
  <div class="page" id="page-history">
    <div style="margin:16px 0 0;font-size:24px;font-weight:900">历史</div>
    <div class="history-summary fade-in-up">
      <div class="summary-label">累计消耗</div>
      <div class="summary-main">
        <div class="summary-cal" id="sum-cal">0</div>
        <div class="summary-unit">千卡</div>
      </div>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-item-val" id="sum-time">0</div>
          <div class="summary-item-label">运动时长</div>
        </div>
        <div class="summary-item">
          <div class="summary-item-val" id="sum-foods">0</div>
          <div class="summary-item-label">消耗食物</div>
        </div>
        <div class="summary-item">
          <div class="summary-item-val" id="sum-streak">0</div>
          <div class="summary-item-label">连续天数</div>
        </div>
      </div>
    </div>
    <div class="history-section-title">运动记录</div>
    <div class="history-list" id="history-list"></div>
  </div>

  <!-- ═══ PAGE: SETTINGS ═══ -->
  <div class="page" id="page-settings">
    <div style="margin:16px 0 0;font-size:24px;font-weight:900">设置</div>

    <div class="settings-section">
      <div class="settings-label">个人资料</div>
      <div class="settings-group">
        <div class="settings-item clickable" data-setting="weight">
          <span class="settings-key">体重</span>
          <span class="settings-val-wrap">
            <span class="settings-val" id="setting-weight-val">70 千克</span>
            <span class="settings-chevron">›</span>
          </span>
        </div>
        <div class="settings-item">
          <span class="settings-key">性别</span>
          <span class="settings-val-wrap">
            <span class="settings-val">男</span>
            <span class="settings-chevron">›</span>
          </span>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">消耗偏好</div>
      <div class="settings-group">
        <div class="settings-item clickable" data-setting="sort">
          <span class="settings-key">推荐排序</span>
          <span class="settings-val-wrap">
            <span class="settings-val" id="setting-sort-val">时间最短优先</span>
            <span class="settings-chevron">›</span>
          </span>
        </div>
        <div class="settings-item clickable" data-setting="default-ex">
          <span class="settings-key">默认运动</span>
          <span class="settings-val-wrap">
            <span class="settings-val" id="setting-default-ex-val">跳绳</span>
            <span class="settings-chevron">›</span>
          </span>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">运动计时</div>
      <div class="settings-group">
        <div class="settings-item">
          <span class="settings-key">完成提醒音效</span>
          <span class="settings-val-wrap">
            <label class="toggle">
              <input type="checkbox" checked disabled>
              <span class="toggle-slider"></span>
            </label>
          </span>
        </div>
        <div class="settings-item">
          <span class="settings-key">每秒报时</span>
          <span class="settings-val-wrap">
            <label class="toggle">
              <input type="checkbox" disabled>
              <span class="toggle-slider"></span>
            </label>
          </span>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">关于</div>
      <div class="settings-group">
        <div class="settings-item">
          <span class="settings-key">版本</span>
          <span class="settings-val">1.0.0</span>
        </div>
        <div class="settings-item">
          <span class="settings-key">给我们评分</span>
          <span class="settings-val-wrap">
            <span class="settings-chevron">›</span>
          </span>
        </div>
        <div class="settings-item">
          <span class="settings-key">隐私政策</span>
          <span class="settings-val-wrap">
            <span class="settings-chevron">›</span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ BOTTOM NAV ═══ -->
  <nav class="nav">
    <button class="nav-btn on" data-tab="start">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="n-icon" d="M15 15l-2 5L9 9l11 4-5 2z"/></svg>
      <span>开始</span>
    </button>
    <button class="nav-btn" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle class="n-icon" cx="12" cy="12" r="10"/><polyline class="n-icon" points="12 6 12 12 16 14"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle class="n-icon" cx="12" cy="12" r="3"/><path class="n-icon" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>设置</span>

  <!-- ═══ SHEET OVERLAY ═══ -->

  <!-- ═══ BOTTOM SHEET ═══ -->
  <div class="sheet" id="sheet">

  </div>

  <!-- ═══ TIMER PAGE ═══ -->
  <div class="timer-page" id="timer-page">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px 0">
      <div>
        <div id="timer-title" style="font-size:18px;font-weight:800">运动进行中</div>
        <div id="timer-subtitle" style="font-size:12px;color:var(--txt3);margin-top:2px"></div>
      </div>
      <button class="btn-close" id="timer-close-btn" aria-label="关闭">✕</button>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px">
      <div class="gauge-wrap">
        <svg viewBox="0 0 220 220">
          <circle class="gauge-track" cx="110" cy="110" r="100"/>
          <circle class="gauge-fill" id="gauge-fill" cx="110" cy="110" r="100" stroke-dasharray="628.318" stroke-dashoffset="628.318"/>
        </svg>
        <div class="gauge-center">
          <img class="gauge-food" id="timer-food-img" src="" alt="">
          <div class="gauge-time" id="timer-time">00:00</div>
          <div class="gauge-pct" id="timer-pct">0%</div>
        </div>
      </div>
      <div class="timer-info">
        <div class="timer-name" id="timer-ex-name"></div>
        <div class="timer-desc" id="timer-ex-desc"></div>
      </div>
      <div style="text-align:center;margin-top:14px">
        <span class="accel-badge">⚡ 原型加速模式：1 秒 = 1 分钟</span>
      </div>
      <div class="timer-stats">
        <div class="stat-card">
          <div class="stat-val burned" id="stat-burned">0 千卡</div>
          <div class="stat-label">已消耗</div>
        </div>
        <div class="stat-card">
          <div class="stat-val target" id="stat-target">0 千卡</div>
          <div class="stat-label">目标</div>
        </div>
        <div class="stat-card">
          <div class="stat-val remain" id="stat-remain">--:--</div>
          <div class="stat-label">剩余</div>
        </div>
      </div>
    </div>
    <div class="timer-actions">
      <button class="btn-secondary pause-btn" id="btn-pause">暂停</button>
      <button class="btn-secondary" id="btn-stop">结束</button>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════
   DATA
   ══════════════════════════════════════ */
const WEIGHT = 70;

const FOODS = [
  { id:'milk-tea',  name:'珍珠奶茶',    portion:'中杯',           cal:360, img:'assets/milk-tea.png',      hasOptions:true },
  { id:'bread',     name:'小餐包',      portion:'1个',            cal:180, img:'assets/bread.png',         hasOptions:false },
  { id:'rice',      name:'米饭',        portion:'中碗',            cal:260, img:'assets/rice.png',          hasOptions:false },
  { id:'burger',    name:'汉堡',        portion:'1个',            cal:520, img:'assets/burger.png',        hasOptions:false },
  { id:'fried-chk', name:'炸鸡',        portion:'2块',            cal:430, img:'assets/fried-chicken.png',  hasOptions:false },
  { id:'banana',    name:'香蕉',        portion:'1根',            cal:105, img:'assets/banana.png',        hasOptions:false },
  { id:'pizza',     name:'披萨片',      portion:'1片',            cal:285, img:'assets/pizza-slice.png',   hasOptions:false },
  { id:'sandwich',  name:'火鸡三明治',  portion:'1份',            cal:420, img:'assets/sandwich.svg',      hasOptions:false },
  { id:'fries',     name:'薯条',        portion:'中份',            cal:365, img:'assets/french-fries.png',  hasOptions:false },
  { id:'pasta',     name:'意大利面',    portion:'1碗',            cal:480, img:'assets/pasta-bowl.png',   hasOptions:false },
  { id:'burrito',   name:'墨西哥卷饼',  portion:'1个',            cal:600, img:'assets/burrito.png',       hasOptions:false },
  { id:'hotdog',    name:'热狗',        portion:'1个',            cal:290, img:'assets/hot-dog.png',       hasOptions:false },
  { id:'croissant', name:'牛角包',      portion:'1个',            cal:280, img:'assets/croissant.png',     hasOptions:false },
  { id:'donut',     name:'甜甜圈',      portion:'1个糖霜甜甜圈',   cal:260, img:'assets/donut.png',        hasOptions:false },
  { id:'muffin',    name:'麦芬',        portion:'1个',            cal:420, img:'assets/muffin.png',        hasOptions:false },
  { id:'icecream',  name:'冰淇淋',      portion:'1杯',            cal:270, img:'assets/ice-cream.png',     hasOptions:false },
  { id:'latte',     name:'拿铁',        portion:'大杯',            cal:190, img:'assets/latte.png',         hasOptions:false },
  { id:'soda',      name:'汽水',        portion:'355毫升罐装',     cal:140, img:'assets/soda.png',          hasOptions:false },
];

// 珍珠奶茶热量表: milkTeaCal[sizeIndex][sugarIndex]
const SIZES  = ['小杯','中杯','大杯'];
const SUGARS = ['少糖','标准糖','多糖'];
const milkTeaCal = [
  [230, 280, 350],  // 小杯
  [310, 360, 430],  // 中杯
  [410, 460, 530],  // 大杯
];

const EXERCISES = [
  { name:'跳绳',   met:8.8, desc:'高强度',   color:'#ff6b6b', icon:'🏃' },
  { name:'跑步',   met:8.3, desc:'稳定配速', color:'#4ecdc4', icon:'🏃‍♂️' },
  { name:'爬楼梯', met:8.0, desc:'高强度爬升', color:'#f7b731', icon:'🧗' },
  { name:'骑行',   met:7.5, desc:'中等强度', color:'#45aaf2', icon:'🚴' },
  { name:'游泳',   met:6.0, desc:'全身运动', color:'#26de81', icon:'🏊' },
  { name:'椭圆机', met:5.0, desc:'关节友好', color:'#a55eea', icon:'🏋️' },
  { name:'快走',   met:4.3, desc:'低冲击',   color:'#2d98da', icon:'🚶' },
];

/* ══════════════════════════════════════
   STATE
   ══════════════════════════════════════ */
let state = {
  tab: 'start',
  selectedFoodId: 'milk-tea',
  // 珍珠奶茶规格 (index)
  mtSize: 1,   // 中杯
  mtSugar: 1,  // 标准糖
  // 当前热量
  currentCal: 360,
  currentPortion: '中杯',
  currentSpec: '中杯 · 标准糖',
  // 消耗方案中选中的运动
  selectedExIndex: 0,
  // 计时器
  timerRunning: false,
  timerPaused: false,
  timerSeconds: 0,
  timerTargetSeconds: 0,
  timerCal: 0,
  timerFood: null,
  timerEx: null,
  timerInterval: null,
  timerDone: false,
  // 设置
  weight: 70,
  sortMode: 'time',     // time / intensity / efficiency
  defaultExercise: '跳绳',
};

const SORT_MODES = [
  { key: 'time',       name: '时间最短优先', desc: '最快完成的运动排前面' },
  { key: 'intensity',  name: '强度最低优先', desc: '运动强度低的排前面' },
  { key: 'efficiency', name: '效率最高优先', desc: '每分钟消耗最多的排前面' },
];

/* ══════════════════════════════════════
   CALCULATIONS
   ══════════════════════════════════════ */
function calPerMin(met) { return met * 3.5 * state.weight / 200; }
function minutesNeeded(cal, met) { return Math.ceil(cal / calPerMin(met)); }
function getSortedExercises(cal) {
  const list = EXERCISES.map((ex, i) => {
    const cpm = calPerMin(ex.met);
    const min = minutesNeeded(cal, ex.met);
    return { ...ex, cpm, minutes: min, origIndex: i };
  });
  if (state.sortMode === 'time') list.sort((a, b) => a.minutes - b.minutes);
  else if (state.sortMode === 'intensity') list.sort((a, b) => a.met - b.met);
  else if (state.sortMode === 'efficiency') list.sort((a, b) => b.cpm - a.cpm);
  return list;
}
function findDefaultExerciseIndex(sorted) {
  const idx = sorted.findIndex(ex => ex.name === state.defaultExercise);
  return idx >= 0 ? idx : 0;
}
function getCurrentFood() { return FOODS.find(f => f.id === state.selectedFoodId); }
function updateCalories() {
  const food = getCurrentFood();
  if (food.hasOptions) {
    state.currentCal = milkTeaCal[state.mtSize][state.mtSugar];
    state.currentPortion = SIZES[state.mtSize];
    state.currentSpec = SIZES[state.mtSize] + ' · ' + SUGARS[state.mtSugar];
  } else {
    state.currentCal = food.cal;
    state.currentPortion = food.portion;
    state.currentSpec = food.portion;
  }
}

/* ══════════════════════════════════════
   DEMO HISTORY DATA
   ══════════════════════════════════════ */
const HISTORY_DATA = [
  { foodId:'milk-tea', exercise:'跳绳',  foodName:'珍珠奶茶', spec:'大杯 · 多糖',  cal:530, duration:50, date:'7月15日', img:'assets/milk-tea.png' },
  { foodId:'burger',   exercise:'跑步',  foodName:'汉堡',     spec:'1个',          cal:520, duration:49, date:'7月14日', img:'assets/burger.png' },
  { foodId:'burrito',  exercise:'跳绳',  foodName:'墨西哥卷饼', spec:'1个',         cal:600, duration:56, date:'7月13日', img:'assets/burrito.png' },
  { foodId:'pasta',    exercise:'跑步',  foodName:'意大利面',   spec:'1碗',          cal:480, duration:45, date:'7月12日', img:'assets/pasta-bowl.png' },
  { foodId:'fries',    exercise:'骑行',  foodName:'薯条',       spec:'中份',         cal:365, duration:52, date:'7月11日', img:'assets/french-fries.png' },
  { foodId:'donut',    exercise:'快走',  foodName:'甜甜圈',     spec:'1个糖霜甜甜圈', cal:260, duration:51, date:'7月10日', img:'assets/donut.png' },
];

function renderHistory() {
  // 计算汇总数据
  const totalCal = HISTORY_DATA.reduce((s, h) => s + h.cal, 0);
  const totalMin = HISTORY_DATA.reduce((s, h) => s + h.duration, 0);
  const foodCount = new Set(HISTORY_DATA.map(h => h.foodId)).size;
  // 连续天数：从最近一天往前数连续的天数
  const days = HISTORY_DATA.map(h => h.date).sort((a, b) => {
    const da = parseInt(a.match(/\d+/g)[0]);
    const db = parseInt(b.match(/\d+/g)[0]);
    return db - da;
  });
  let streak = 1;
  for (let i = 1; i < days.length; i++) {
    const prev = parseInt(days[i - 1].match(/\d+/)[0]);
    const curr = parseInt(days[i].match(/\d+/)[0]);
    if (prev - curr === 1) streak++;
    else break;
  }

  document.getElementById('sum-cal').textContent = totalCal.toLocaleString();
  document.getElementById('sum-time').textContent = totalMin + ' 分钟';
  document.getElementById('sum-foods').textContent = foodCount + ' 种';
  document.getElementById('sum-streak').textContent = streak + ' 天';

  const list = document.getElementById('history-list');
  list.innerHTML = HISTORY_DATA.map((h, i) => `
    <div class="hist-card fade-in-up" style="animation-delay:${i * 0.05}s">
      <img class="hist-food" src="${h.img}" alt="${h.foodName}" onerror="this.style.display='none'">
      <div class="hist-info">
        <div class="hist-top">
          <div class="hist-exercise">${h.exercise}</div>
          <div class="hist-status">已完成</div>
        </div>
        <div class="hist-food-name">${h.foodName} · ${h.spec}</div>
        <div class="hist-bottom">
          <div class="hist-stat">消耗 <span>${h.cal} 千卡</span></div>
          <div class="hist-stat">时长 <span>${h.duration} 分钟</span></div>
          <div class="hist-date">${h.date}</div>
        </div>
      </div>
    </div>
  `).join('');
}

/* ══════════════════════════════════════
   RENDER: FOOD GRID
   ══════════════════════════════════════ */
function renderFoodGrid() {
  const grid = document.getElementById('food-grid');
  grid.innerHTML = FOODS.map((f, i) => `
    <div class="food-card${f.id === state.selectedFoodId ? ' selected' : ''}" data-id="${f.id}" style="animation:fadeInUp .3s ease ${i * 0.03}s both">
      <img class="food-img" src="${f.img}" alt="${f.name}" loading="lazy" onerror="this.style.display='none'">
      <div class="food-name">${f.name}</div>
      <div class="food-portion">${f.portion}</div>
      <div class="food-cal">${f.cal} 千卡</div>
    </div>
  `).join('');
}

/* ══════════════════════════════════════
   RENDER: SHEET
   ══════════════════════════════════════ */
function renderSheet() {
  updateCalories();
  const food = getCurrentFood();
  const sorted = getSortedExercises(state.currentCal);
  const fastest = sorted[0];
  const sel = sorted[state.selectedExIndex] || sorted[0];

  let optionsHTML = '';
  if (food.hasOptions) {
    optionsHTML = `
    <div class="est-section">
      <div class="est-header">
        <span style="font-size:15px;font-weight:800">食物热量估算</span>
        <span class="est-tag">估算值</span>
      </div>
      <div style="font-size:13px;color:var(--txt3);font-weight:600;margin-bottom:10px">选择份量</div>
      <div class="option-row" style="margin-bottom:10px">
        ${SIZES.map((s, i) => `<button class="opt-btn${i === state.mtSize ? ' on' : ''}" data-opt="size" data-val="${i}">${s}</button>`).join('')}
      </div>
      <div style="font-size:13px;color:var(--txt3);font-weight:600;margin-bottom:10px">选择糖度</div>
      <div class="option-row">
        ${SUGARS.map((s, i) => `<button class="opt-btn${i === state.mtSugar ? ' on' : ''}" data-opt="sugar" data-val="${i}">${s}</button>`).join('')}
      </div>
    </div>`;
  }

  document.getElementById('sheet-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:20px;font-weight:900">消耗方案</div>
      <button class="btn-close" id="sheet-close" aria-label="关闭">✕</button>
    </div>

    <!-- Target Card -->
    <div class="target-card">
      <div class="target-icon"><img src="${food.img}" alt="${food.name}" onerror="this.style.display='none'"></div>
      <div class="target-info">
        <div class="target-label">目标消耗</div>
        <div style="display:flex;align-items:baseline;gap:6px">
          <div class="target-num" id="sheet-cal-num">${state.currentCal}</div>
          <div class="target-unit">千卡</div>
        </div>
        <div class="target-food">${food.name}</div>
        <div class="target-spec" id="sheet-spec">${state.currentSpec}</div>
        <div class="target-metrics">
          <div class="metric"><div class="metric-label">份量</div><div class="metric-val" id="sheet-m-portion">${state.currentPortion}</div></div>
          <div class="metric"><div class="metric-label">最快</div><div class="metric-val" id="sheet-m-fastest">${fastest.minutes}分钟</div></div>
          <div class="metric"><div class="metric-label">运动方式</div><div class="metric-val" id="sheet-m-exname">${sel.name}</div></div>
        </div>
      </div>
    </div>

    ${optionsHTML}

    <!-- Exercises -->
    <div style="margin-top:20px">
      <div style="font-size:15px;font-weight:800;margin-bottom:2px">运动消耗方案</div>
      <div style="font-size:12px;color:var(--txt3);font-weight:600;margin-bottom:14px">根据你的体重进行估算</div>
      <div class="exercise-list">
        ${sorted.slice(0, 4).map((ex, i) => `
          <div class="ex-card${i === state.selectedExIndex ? ' selected' : ''}" data-ex="${i}">
            <div class="ex-icon" style="background:${ex.color}22">${ex.icon}</div>
            <div class="ex-info">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-desc">${ex.desc}</div>
            </div>
            <div class="ex-meta">
              <div class="ex-calpm">${ex.cpm.toFixed(1)} 千卡/分钟</div>
              <div class="ex-time">${ex.minutes}分钟</div>
              <div class="ex-hint">预计消耗完成</div>
            </div>
            <div class="ex-check">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${'var(--mint)'}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- Start Button -->
    <button class="btn-primary" id="btn-start-exercise" style="margin-top:22px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a1f14" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      开始运动
    </button>
  `;

  bindSheetEvents();
}

function bindSheetEvents() {
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  document.getElementById('btn-start-exercise').addEventListener('click', startExercise);

  // Size / Sugar options
  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const opt = btn.dataset.opt;
      const val = parseInt(btn.dataset.val);
      if (opt === 'size') state.mtSize = val;
      if (opt === 'sugar') state.mtSugar = val;
      state.selectedExIndex = 0; // reset exercise selection
      renderSheet();
    });
  });

  // Exercise cards
  document.querySelectorAll('.ex-card').forEach(card => {
    card.addEventListener('click', () => {
      state.selectedExIndex = parseInt(card.dataset.ex);
      renderSheet();
    });
  });
}

function openSheet() {
  updateCalories();
  const sorted = getSortedExercises(state.currentCal);
  state.selectedExIndex = findDefaultExerciseIndex(sorted);
  renderSheet();
  document.getElementById('overlay').classList.add('on');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('sheet').classList.remove('open');
}

/* ══════════════════════════════════════
   TIMER
   Accelerated: 1 real second = 1 simulated minute
   ══════════════════════════════════════ */
function startExercise() {
  closeSheet();
  const food = getCurrentFood();
  const sorted = getSortedExercises(state.currentCal);
  const ex = sorted[state.selectedExIndex] || sorted[0];
  const cal = state.currentCal;
  const totalMin = ex.minutes;

  state.timerRunning = true;
  state.timerPaused = false;
  state.timerElapsedSec = 0;     // real elapsed seconds
  state.timerTotalMin = totalMin; // simulated total minutes
  state.timerCal = cal;
  state.timerFood = food;
  state.timerEx = ex;
  state.timerDone = false;

  document.getElementById('timer-title').textContent = '运动进行中';
  document.getElementById('timer-subtitle').textContent = '预计' + totalMin + '分钟完成';
  document.getElementById('timer-food-img').src = food.img;
  document.getElementById('timer-ex-name').textContent = ex.name;
  document.getElementById('timer-ex-desc').textContent = '正在消耗' + food.name;
  document.getElementById('stat-target').textContent = cal + ' 千卡';
  document.getElementById('btn-pause').textContent = '暂停';
  document.getElementById('btn-stop').textContent = '结束';
  document.getElementById('timer-close-btn').style.display = '';
  document.getElementById('btn-pause').style.display = '';

  const fill = document.getElementById('gauge-fill');
  fill.style.transition = 'none';
  fill.setAttribute('stroke-dashoffset', '628.318');
  void fill.offsetWidth;
  fill.style.transition = 'stroke-dashoffset 1s linear';

  document.getElementById('timer-page').classList.add('active');
  document.getElementById('app').querySelector('.nav').style.display = 'none';

  updateTimerDisplay();

  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(timerTick, 1000);
}

function timerTick() {
  if (state.timerPaused || state.timerDone) return;
  state.timerElapsedSec++;
  if (state.timerElapsedSec >= state.timerTotalMin) {
    state.timerElapsedSec = state.timerTotalMin;
    state.timerDone = true;
    state.timerRunning = false;
    clearInterval(state.timerInterval);
    document.getElementById('timer-title').textContent = '目标已完成';
    document.getElementById('timer-subtitle').textContent = '';
    document.getElementById('btn-pause').style.display = 'none';
    document.getElementById('btn-stop').textContent = '完成';
  }
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const elapsedSec = state.timerElapsedSec;
  const totalMin = state.timerTotalMin;
  const pct = Math.min(100, Math.round(elapsedSec / totalMin * 100));
  const burned = Math.min(state.timerCal, Math.round(state.timerCal * elapsedSec / totalMin));

  // Elapsed time: show as mm:ss (each real second = 1 simulated minute)
  const em = elapsedSec;
  const rm = Math.max(0, totalMin - elapsedSec);
  document.getElementById('timer-time').textContent =
    String(em).padStart(2,'0') + ':' + '00';
  document.getElementById('timer-pct').textContent = pct + '%';

  // Gauge
  const offset = 628.318 * (1 - elapsedSec / totalMin);
  document.getElementById('gauge-fill').setAttribute('stroke-dashoffset', Math.max(0, offset));

  // Stats
  document.getElementById('stat-burned').textContent = burned + ' 千卡';
  document.getElementById('stat-remain').textContent =
    String(rm).padStart(2,'0') + ':' + '00';
}

function pauseTimer() {
  state.timerPaused = !state.timerPaused;
  document.getElementById('btn-pause').textContent = state.timerPaused ? '继续' : '暂停';
}

function stopTimer() {
  clearInterval(state.timerInterval);
  state.timerRunning = false;
  state.timerInterval = null;
  document.getElementById('timer-page').classList.remove('active');
  document.getElementById('app').querySelector('.nav').style.display = '';
  document.getElementById('btn-pause').style.display = '';
  document.getElementById('btn-pause').textContent = '暂停';
}

/* ══════════════════════════════════════
   TAB NAVIGATION
   ══════════════════════════════════════ */
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === tab);
  });
}

/* ══════════════════════════════════════
   SETTINGS
   ══════════════════════════════════════ */
function updateWeightDisplay() {
  document.getElementById('setting-weight-val').textContent = state.weight + ' 千克';
  const topWeight = document.querySelector('.page.active .top-weight');
  const startWeight = document.querySelector('#page-start .top-weight');
  if (startWeight) startWeight.textContent = state.weight + ' 千克';
}

function openWeightPicker() {
  const sheetContent = document.getElementById('sheet-content');
  sheetContent.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:20px;font-weight:900">设置体重</div>
      <button class="btn-close" id="picker-close" aria-label="关闭">✕</button>
    </div>
    <div class="weight-picker">
      <button class="weight-btn" id="weight-minus">−</button>
      <div class="weight-display">
        <div class="weight-num" id="picker-weight">${state.weight}</div>
        <div class="weight-unit">千克</div>
      </div>
      <button class="weight-btn" id="weight-plus">+</button>
    </div>
    <div class="weight-range-label">范围：40 – 150 千克</div>
    <button class="btn-primary" id="weight-confirm" style="margin-top:20px">完成</button>
  `;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('sheet').classList.add('open');

  let tempWeight = state.weight;
  const update = () => {
    document.getElementById('picker-weight').textContent = tempWeight;
  };
  document.getElementById('weight-minus').addEventListener('click', () => {
    if (tempWeight > 40) { tempWeight--; update(); }
  });
  document.getElementById('weight-plus').addEventListener('click', () => {
    if (tempWeight < 150) { tempWeight++; update(); }
  });
  document.getElementById('weight-confirm').addEventListener('click', () => {
    state.weight = tempWeight;
    updateWeightDisplay();
    closeSheet();
  });
  document.getElementById('picker-close').addEventListener('click', closeSheet);
}

function openSortPicker() {
  const sheetContent = document.getElementById('sheet-content');
  sheetContent.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:20px;font-weight:900">推荐排序</div>
      <button class="btn-close" id="picker-close" aria-label="关闭">✕</button>
    </div>
    ${SORT_MODES.map(m => `
      <div class="picker-option ${state.sortMode === m.key ? 'selected' : ''}" data-sort="${m.key}">
        <div>
          <div class="picker-option-name">${m.name}</div>
          <div class="picker-option-desc">${m.desc}</div>
        </div>
        <div class="picker-check">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>
    `).join('')}
  `;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('sheet').classList.add('open');

  document.getElementById('picker-close').addEventListener('click', closeSheet);
  document.querySelectorAll('.picker-option').forEach(opt => {
    opt.addEventListener('click', () => {
      state.sortMode = opt.dataset.sort;
      const mode = SORT_MODES.find(m => m.key === state.sortMode);
      document.getElementById('setting-sort-val').textContent = mode.name;
      closeSheet();
    });
  });
}

function openDefaultExercisePicker() {
  const sheetContent = document.getElementById('sheet-content');
  const sorted = getSortedExercises(360); // 参考值
  sheetContent.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:20px;font-weight:900">默认运动</div>
      <button class="btn-close" id="picker-close" aria-label="关闭">✕</button>
    </div>
    <div style="font-size:12px;color:var(--txt3);font-weight:600;margin-bottom:12px">打开消耗方案时默认选中</div>
    ${EXERCISES.map(ex => `
      <div class="picker-option ${state.defaultExercise === ex.name ? 'selected' : ''}" data-ex="${ex.name}">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:${ex.color}22;font-size:18px">${ex.icon}</div>
          <div>
            <div class="picker-option-name">${ex.name}</div>
            <div class="picker-option-desc">${ex.desc}</div>
          </div>
        </div>
        <div class="picker-check">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>
    `).join('')}
  `;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('sheet').classList.add('open');

  document.getElementById('picker-close').addEventListener('click', closeSheet);
  document.querySelectorAll('.picker-option').forEach(opt => {
    opt.addEventListener('click', () => {
      state.defaultExercise = opt.dataset.ex;
      document.getElementById('setting-default-ex-val').textContent = state.defaultExercise;
      closeSheet();
    });
  });
}

/* ══════════════════════════════════════
   EVENT BINDINGS
   ══════════════════════════════════════ */
function init() {
  renderFoodGrid();
  renderHistory();

  // Nav tabs
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // Food card clicks (delegated)
  document.getElementById('food-grid').addEventListener('click', (e) => {
    const card = e.target.closest('.food-card');
    if (!card) return;
    state.selectedFoodId = card.dataset.id;
    renderFoodGrid();
    openSheet();
  });

  // Settings item clicks
  document.querySelectorAll('.settings-item.clickable').forEach(item => {
    item.addEventListener('click', () => {
      const setting = item.dataset.setting;
      if (setting === 'weight') openWeightPicker();
      if (setting === 'sort') openSortPicker();
      if (setting === 'default-ex') openDefaultExercisePicker();
    });
  });

  // Sheet overlay click to close
  document.getElementById('overlay').addEventListener('click', closeSheet);

  // Timer buttons
  document.getElementById('btn-pause').addEventListener('click', pauseTimer);
  document.getElementById('btn-stop').addEventListener('click', stopTimer);
  document.getElementById('timer-close-btn').addEventListener('click', stopTimer);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
