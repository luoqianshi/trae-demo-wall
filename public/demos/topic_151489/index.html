<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智学助手 - 高效学习与任务管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #f8fafc;
        --bg-secondary: #f1f5f9;
        --bg-card: #ffffff;
        --bg-input: #f8fafc;
        --bg-hover: #f1f5f9;
        --border-soft: rgba(148, 163, 184, 0.3);
        --border-active: rgba(59, 130, 246, 0.4);
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --accent-blue: #3b82f6;
        --accent-blue-dark: #2563eb;
        --accent-blue-light: #60a5fa;
        --accent-emerald: #10b981;
        --accent-teal: #14b8a6;
        --accent-violet: #8b5cf6;
        --accent-amber: #f59e0b;
        --accent-rose: #ef4444;
        --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        --gradient-secondary: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        --radius-xl: 20px;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 8px;
        --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.04);
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.08);
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-in: cubic-bezier(0.55, 0, 1, 0.45);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", "Noto Sans SC", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        padding: 24px;
        overflow-x: hidden;
        background-image:
          radial-gradient(
            circle at 10% 10%,
            rgba(59, 130, 246, 0.05) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 90% 90%,
            rgba(16, 185, 129, 0.04) 0%,
            transparent 40%
          );
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }

      header p {
        font-size: 1.05rem;
        color: var(--text-secondary);
        font-weight: 400;
      }

      .header-decoration {
        width: 60px;
        height: 4px;
        margin: 16px auto 0;
        background: var(--gradient-primary);
        border-radius: 2px;
        opacity: 0;
        animation: fadeIn 0.6s var(--ease-out) 0.5s forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: var(--bg-card);
        padding: 24px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        text-align: center;
        opacity: 0;
        animation: fadeIn 0.5s var(--ease-out) forwards;
        position: relative;
      }

      .stat-card:nth-child(1) {
        animation-delay: 0.2s;
        border-top: 3px solid var(--accent-blue);
      }
      .stat-card:nth-child(2) {
        animation-delay: 0.3s;
        border-top: 3px solid var(--accent-teal);
      }
      .stat-card:nth-child(3) {
        animation-delay: 0.4s;
        border-top: 3px solid var(--accent-emerald);
      }
      .stat-card:nth-child(4) {
        animation-delay: 0.5s;
        border-top: 3px solid var(--accent-violet);
      }

      .stat-card .number {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 6px;
        line-height: 1;
      }

      .stat-card:nth-child(1) .number {
        color: var(--accent-blue);
      }
      .stat-card:nth-child(2) .number {
        color: var(--accent-teal);
      }
      .stat-card:nth-child(3) .number {
        color: var(--accent-emerald);
      }
      .stat-card:nth-child(4) .number {
        color: var(--accent-violet);
      }

      .stat-card .label {
        font-size: 0.95rem;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .main-grid {
        display: grid;
        grid-template-columns: 1fr 380px;
        grid-template-areas:
          "tasks timer"
          "plans plans"
          "notes notes";
        gap: 24px;
        margin-bottom: 40px;
      }

      .card-tasks {
        grid-area: tasks;
      }
      .card-timer {
        grid-area: timer;
      }
      .card-plans {
        grid-area: plans;
      }
      .card-notes {
        grid-area: notes;
      }

      @media (max-width: 900px) {
        .main-grid {
          grid-template-columns: 1fr;
          grid-template-areas:
            "tasks"
            "timer"
            "plans"
            "notes";
        }
      }

      .card {
        background: var(--bg-card);
        border-radius: var(--radius-xl);
        padding: 32px;
        box-shadow: var(--shadow-card);
        opacity: 0;
        animation: fadeIn 0.5s var(--ease-out) forwards;
      }

      .card:nth-child(1) {
        animation-delay: 0.3s;
      }
      .card:nth-child(2) {
        animation-delay: 0.4s;
      }
      .card:nth-child(3) {
        animation-delay: 0.5s;
      }
      .card:nth-child(4) {
        animation-delay: 0.6s;
      }

      .card-title {
        font-size: 1.35rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .task-input-container {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      .task-input {
        flex: 1;
        min-width: 200px;
        padding: 16px 20px;
        background: var(--bg-input);
        border: 2px solid var(--border-soft);
        border-radius: var(--radius-md);
        font-size: 1rem;
        font-family: inherit;
        color: var(--text-primary);
        outline: none;
        transition:
          border-color 0.25s var(--ease-out),
          background 0.25s var(--ease-out);
      }

      .task-input:focus {
        border-color: var(--accent-blue);
        background: white;
      }

      .task-select {
        padding: 16px 20px;
        background: var(--bg-input);
        border: 2px solid var(--border-soft);
        border-radius: var(--radius-md);
        font-size: 1rem;
        font-family: inherit;
        color: var(--text-primary);
        outline: none;
        cursor: pointer;
        transition: border-color 0.25s var(--ease-out);
      }

      .task-select:focus {
        border-color: var(--accent-blue);
      }

      .add-btn {
        padding: 14px 28px;
        background: var(--gradient-primary);
        color: white;
        border: none;
        border-radius: var(--radius-md);
        font-size: 1rem;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.15s var(--ease-spring),
          box-shadow 0.25s ease;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      }

      .add-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
      }

      .task-list {
        max-height: 400px;
        overflow-y: auto;
        padding-right: 8px;
      }

      .task-list::-webkit-scrollbar {
        width: 6px;
      }
      .task-list::-webkit-scrollbar-track {
        background: var(--bg-secondary);
        border-radius: 3px;
      }
      .task-list::-webkit-scrollbar-thumb {
        background: var(--text-muted);
        border-radius: 3px;
      }

      .task-item {
        display: flex;
        align-items: center;
        padding: 16px;
        background: var(--bg-secondary);
        border-radius: var(--radius-md);
        margin-bottom: 12px;
        transition:
          transform 0.2s var(--ease-out),
          background 0.2s var(--ease-out);
        position: relative;
      }

      .task-item:hover {
        background: var(--bg-hover);
        transform: translateX(4px);
      }

      .task-item.completed {
        opacity: 0.6;
      }

      .task-item.completed .task-text {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      .task-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid var(--border-soft);
        border-radius: 6px;
        cursor: pointer;
        margin-right: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s var(--ease-out);
        flex-shrink: 0;
      }

      .task-checkbox:hover {
        border-color: var(--accent-blue);
        background: rgba(59, 130, 246, 0.05);
      }

      .task-item.completed .task-checkbox {
        background: var(--accent-blue);
        border-color: var(--accent-blue);
      }

      .task-checkbox svg {
        width: 14px;
        height: 14px;
        stroke: white;
        stroke-width: 3;
        fill: none;
        opacity: 0;
        transition: opacity 0.2s var(--ease-out);
      }

      .task-item.completed .task-checkbox svg {
        opacity: 1;
      }

      .task-content {
        flex: 1;
        min-width: 0;
      }

      .task-text {
        font-size: 1rem;
        color: var(--text-primary);
        margin-bottom: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .task-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .task-tag {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .task-tag.work {
        background: rgba(59, 130, 246, 0.1);
        color: var(--accent-blue);
      }
      .task-tag.study {
        background: rgba(16, 185, 129, 0.1);
        color: var(--accent-emerald);
      }
      .task-tag.life {
        background: rgba(245, 158, 11, 0.1);
        color: var(--accent-amber);
      }
      .task-tag.personal {
        background: rgba(139, 92, 246, 0.1);
        color: var(--accent-violet);
      }

      .task-priority.high {
        color: var(--accent-rose);
      }
      .task-priority.medium {
        color: var(--accent-amber);
      }
      .task-priority.low {
        color: var(--accent-emerald);
      }

      .delete-btn {
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition:
          opacity 0.2s var(--ease-out),
          background 0.2s var(--ease-out);
        flex-shrink: 0;
      }

      .task-item:hover .delete-btn {
        opacity: 1;
      }

      .delete-btn:hover {
        background: rgba(239, 68, 68, 0.1);
      }

      .delete-btn svg {
        width: 16px;
        height: 16px;
        stroke: var(--accent-rose);
        stroke-width: 2;
        fill: none;
      }

      .search-container {
        margin-bottom: 20px;
      }

      .search-input {
        width: 100%;
        padding: 12px 16px;
        background: var(--bg-input);
        border: 2px solid var(--border-soft);
        border-radius: var(--radius-md);
        font-size: 0.95rem;
        font-family: inherit;
        color: var(--text-primary);
        outline: none;
        transition: border-color 0.25s var(--ease-out);
      }

      .search-input:focus {
        border-color: var(--accent-blue);
      }

      .filter-buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .filter-btn {
        padding: 8px 16px;
        background: var(--bg-secondary);
        border: none;
        border-radius: 20px;
        font-size: 0.85rem;
        font-family: inherit;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.2s var(--ease-out);
      }

      .filter-btn:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }

      .filter-btn.active {
        background: var(--accent-blue);
        color: white;
      }

      .timer-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }

      .timer-ring-container {
        position: relative;
        width: 180px;
        height: 180px;
        margin-bottom: 24px;
      }

      .timer-ring {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .timer-ring .background {
        fill: none;
        stroke: var(--bg-secondary);
        stroke-width: 12;
      }

      .timer-ring .progress {
        fill: none;
        stroke: var(--gradient-primary);
        stroke-width: 12;
        stroke-linecap: round;
        transition: stroke-dashoffset 1s linear;
        filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.2));
      }

      .timer-display {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      .timer-display h2 {
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: 0.03em;
        line-height: 1;
      }

      .timer-display p {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-top: 6px;
      }

      .timer-controls {
        display: flex;
        gap: 14px;
      }

      .timer-btn {
        width: 52px;
        height: 52px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.2s var(--ease-spring),
          box-shadow 0.2s var(--ease-out);
        position: relative;
        overflow: hidden;
      }

      .timer-btn.start {
        background: var(--accent-emerald);
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      }

      .timer-btn.start:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      }

      .timer-btn.pause {
        background: var(--accent-amber);
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
      }

      .timer-btn.pause:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      }

      .timer-btn.reset {
        background: var(--accent-rose);
        box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
      }

      .timer-btn.reset:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
      }

      .timer-btn svg {
        width: 24px;
        height: 24px;
        stroke: white;
        stroke-width: 3;
        fill: none;
      }

      .plan-list {
        max-height: 400px;
        overflow-y: auto;
      }

      .plan-item {
        padding: 20px;
        background: var(--bg-secondary);
        border-radius: var(--radius-md);
        margin-bottom: 16px;
        border-left: 4px solid var(--accent-blue);
        position: relative;
      }

      .plan-item:nth-child(2) {
        border-left-color: var(--accent-amber);
      }
      .plan-item:nth-child(3) {
        border-left-color: var(--accent-emerald);
      }
      .plan-item:nth-child(4) {
        border-left-color: var(--accent-violet);
      }

      .plan-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .plan-title {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .plan-actions {
        display: flex;
        gap: 8px;
      }

      .plan-btn {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-size: 0.8rem;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s var(--ease-out);
      }

      .plan-btn.edit {
        background: rgba(59, 130, 246, 0.1);
        color: var(--accent-blue);
      }

      .plan-btn.edit:hover {
        background: rgba(59, 130, 246, 0.2);
      }

      .plan-btn.delete {
        background: rgba(239, 68, 68, 0.1);
        color: var(--accent-rose);
      }

      .plan-btn.delete:hover {
        background: rgba(239, 68, 68, 0.2);
      }

      .progress-bar {
        height: 8px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 8px;
      }

      .progress-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.5s var(--ease-out);
      }

      .progress-label {
        font-size: 0.85rem;
        color: var(--text-secondary);
        text-align: right;
      }

      .notes-container {
        display: flex;
        flex-direction: column;
        height: 450px;
      }

      .notes-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-soft);
      }

      .notes-toolbar button {
        padding: 10px 20px;
        background: var(--bg-secondary);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        font-family: inherit;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.2s var(--ease-out);
      }

      .notes-toolbar button:hover {
        background: var(--accent-blue);
        color: white;
        border-color: var(--accent-blue);
      }

      .notes-body {
        flex: 1;
        display: flex;
        gap: 16px;
        min-height: 0;
      }

      .notes-list {
        width: 200px;
        background: var(--bg-secondary);
        border-radius: var(--radius-md);
        padding: 12px;
        overflow-y: auto;
        flex-shrink: 0;
      }

      .note-item {
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 8px;
        transition: all 0.2s var(--ease-out);
      }

      .note-item:hover {
        background: var(--bg-hover);
      }

      .note-item.active {
        background: var(--accent-blue);
        color: white;
      }

      .note-title {
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .note-date {
        font-size: 0.7rem;
        opacity: 0.7;
      }

      .notes-editor-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .note-title-input {
        padding: 12px 16px;
        background: var(--bg-input);
        border: 2px solid var(--border-soft);
        border-radius: var(--radius-sm);
        font-size: 1rem;
        font-family: inherit;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 12px;
        outline: none;
        transition: border-color 0.25s var(--ease-out);
      }

      .note-title-input:focus {
        border-color: var(--accent-blue);
      }

      .notes-editor {
        flex: 1;
        padding: 16px;
        background: var(--bg-input);
        border: 2px solid var(--border-soft);
        border-radius: var(--radius-md);
        font-size: 0.95rem;
        font-family: inherit;
        color: var(--text-primary);
        resize: none;
        outline: none;
        transition:
          border-color 0.25s var(--ease-out),
          background 0.25s var(--ease-out);
      }

      .notes-editor:focus {
        border-color: var(--accent-blue);
        background: white;
      }

      .notes-info {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 8px;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
      }

      .chart-container {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-card);
      }

      .chart-title {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 20px;
      }

      .pie-chart {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin: 0 auto 20px;
        position: relative;
      }

      .pie-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90px;
        height: 90px;
        background: white;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .pie-center .percentage {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .pie-center .label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .pie-legend {
        display: flex;
        justify-content: center;
        gap: 24px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 3px;
      }

      .category-bars {
        display: flex;
        justify-content: space-around;
        align-items: flex-end;
        height: 150px;
        padding: 20px 0;
      }

      .bar-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        flex: 1;
      }

      .bar {
        width: 40px;
        background: var(--gradient-primary);
        border-radius: 6px 6px 0 0;
        position: relative;
        transition: height 0.5s var(--ease-out);
        min-height: 10px;
      }

      .bar-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .bar-value {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .weekly-bars {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        height: 120px;
        padding: 10px 0;
      }

      .week-bar {
        flex: 1;
        margin: 0 4px;
        background: var(--accent-blue-light);
        border-radius: 4px 4px 0 0;
        transition: height 0.5s var(--ease-out);
        min-height: 4px;
      }

      .week-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        animation: fadeIn 0.2s var(--ease-out);
      }

      .modal-overlay.show {
        display: flex;
      }

      .modal {
        background: var(--bg-card);
        border-radius: var(--radius-xl);
        padding: 32px;
        width: 90%;
        max-width: 400px;
        animation: modalIn 0.3s var(--ease-spring);
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(20px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .modal-title {
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 24px;
      }

      .modal-input {
        width: 100%;
        padding: 14px 18px;
        background: var(--bg-input);
        border: 2px solid var(--border-soft);
        border-radius: var(--radius-md);
        font-size: 1rem;
        font-family: inherit;
        color: var(--text-primary);
        margin-bottom: 20px;
        outline: none;
        transition: border-color 0.25s var(--ease-out);
      }

      .modal-input:focus {
        border-color: var(--accent-blue);
      }

      .progress-slider {
        width: 100%;
        margin-bottom: 8px;
        height: 8px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 4px;
        appearance: none;
        cursor: pointer;
      }

      .progress-slider::-webkit-slider-thumb {
        appearance: none;
        width: 22px;
        height: 22px;
        background: var(--accent-blue);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        transition: transform 0.25s var(--ease-spring);
      }

      .progress-slider::-webkit-slider-thumb:hover {
        transform: scale(1.3);
      }

      .slider-value {
        font-size: 0.9rem;
        color: var(--text-secondary);
        text-align: right;
        margin-bottom: 24px;
      }

      .modal-buttons {
        display: flex;
        gap: 12px;
      }

      .modal-btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: var(--radius-md);
        font-size: 1rem;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s var(--ease-out);
        position: relative;
        overflow: hidden;
      }

      .modal-btn.primary {
        background: var(--gradient-primary);
        color: white;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      }

      .modal-btn.primary:hover {
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
        transform: translateY(-2px);
      }

      .modal-btn.secondary {
        background: var(--bg-secondary);
        color: var(--text-secondary);
      }

      .modal-btn.secondary:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }

      .toast-container {
        position: fixed;
        bottom: 32px;
        right: 32px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .toast {
        padding: 16px 24px;
        background: var(--bg-card);
        border: 1px solid var(--border-soft);
        border-left: 5px solid var(--accent-emerald);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-size: 0.95rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        animation: toastIn 0.4s var(--ease-spring);
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 400px;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(100px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes toastOut {
        from {
          opacity: 1;
          transform: translateX(0);
        }
        to {
          opacity: 0;
          transform: translateX(100px);
        }
      }

      .toast.warning {
        border-left-color: var(--accent-amber);
      }
      .toast.info {
        border-left-color: var(--accent-blue);
      }
      .toast.error {
        border-left-color: var(--accent-rose);
      }

      .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        transform: scale(0);
        animation: rippleEffect 0.6s var(--ease-out);
        pointer-events: none;
      }

      @keyframes rippleEffect {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }

      footer {
        text-align: center;
        padding: 32px 0;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
      }

      .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 12px;
      }

      .empty-state-text {
        font-size: 0.95rem;
      }

      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        header h1 {
          font-size: 1.8rem;
        }
        .card {
          padding: 20px;
        }
        .stats-grid {
          gap: 12px;
        }
        .stat-card {
          padding: 16px;
        }
        .stat-card .number {
          font-size: 2rem;
        }
        .timer-display h2 {
          font-size: 2.5rem;
        }
        .notes-list {
          width: 150px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>智学助手</h1>
        <p>高效学习与任务管理平台</p>
        <div class="header-decoration"></div>
      </header>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="number" id="statTasks">0</div>
          <div class="label">待完成任务</div>
        </div>
        <div class="stat-card">
          <div class="number" id="statTime">0</div>
          <div class="label">学习时长(分)</div>
        </div>
        <div class="stat-card">
          <div class="number" id="statPlans">0</div>
          <div class="label">学习计划</div>
        </div>
        <div class="stat-card">
          <div class="number" id="statNotes">0</div>
          <div class="label">智能笔记</div>
        </div>
      </div>

      <div class="main-grid">
        <div class="card card-tasks">
          <div class="card-title">任务管理</div>
          <div class="search-container">
            <input
              type="text"
              class="search-input"
              id="taskSearch"
              placeholder="搜索任务..."
            />
          </div>
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="pending">待完成</button>
            <button class="filter-btn" data-filter="completed">已完成</button>
          </div>
          <div class="task-input-container">
            <input
              type="text"
              class="task-input"
              id="taskInput"
              placeholder="添加新任务..."
            />
            <select class="task-select" id="taskCategory">
              <option value="study">学习</option>
              <option value="work">工作</option>
              <option value="life">生活</option>
              <option value="personal">个人</option>
            </select>
            <select class="task-select" id="taskPriority">
              <option value="medium">中优先级</option>
              <option value="high">高优先级</option>
              <option value="low">低优先级</option>
            </select>
            <button class="add-btn" id="addTaskBtn">添加</button>
          </div>
          <div class="task-list" id="taskList"></div>
        </div>

        <div class="card card-timer">
          <div class="card-title">番茄专注</div>
          <div class="timer-container">
            <div class="timer-ring-container" id="timerRingContainer">
              <svg class="timer-ring" viewBox="0 0 200 200">
                <circle class="background" cx="100" cy="100" r="92"></circle>
                <circle
                  class="progress"
                  id="timerProgress"
                  cx="100"
                  cy="100"
                  r="92"
                ></circle>
              </svg>
              <div class="timer-display">
                <h2 id="timer">25:00</h2>
                <p id="phaseLabel">专注时间</p>
              </div>
            </div>
            <div class="timer-controls">
              <button class="timer-btn start" id="startBtn">
                <svg viewBox="0 0 24 24">
                  <polygon points="5,3 19,12 5,21"></polygon>
                </svg>
              </button>
              <button class="timer-btn pause" id="pauseBtn">
                <svg viewBox="0 0 24 24">
                  <rect x="6" y="4" width="4" height="16"></rect>
                  <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
              </button>
              <button class="timer-btn reset" id="resetBtn">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"
                  ></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="card card-plans">
          <div class="card-title">学习计划</div>
          <div class="task-input-container">
            <input
              type="text"
              class="task-input"
              id="planInput"
              placeholder="添加新计划..."
            />
            <button class="add-btn" id="addPlanBtn">添加</button>
          </div>
          <div class="plan-list" id="planList"></div>
        </div>

        <div class="card card-notes">
          <div class="card-title">智能笔记</div>
          <div class="notes-container">
            <div class="notes-toolbar">
              <button id="newNoteBtn">新建笔记</button>
              <button id="deleteNoteBtn">删除笔记</button>
            </div>
            <div class="notes-body">
              <div class="notes-list" id="notesList"></div>
              <div class="notes-editor-container">
                <input
                  type="text"
                  class="note-title-input"
                  id="noteTitleInput"
                  placeholder="笔记标题"
                />
                <textarea
                  class="notes-editor"
                  id="notesEditor"
                  placeholder="开始记录..."
                ></textarea>
                <div class="notes-info" id="notesInfo">上次保存: 刚刚</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer>
        <p>智学助手 — 高效学习与任务管理平台</p>
      </footer>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-title" id="modalTitle">标题</div>
        <input
          type="text"
          class="modal-input"
          id="modalInput"
          placeholder="请输入名称"
        />
        <input
          type="range"
          class="progress-slider"
          id="modalSlider"
          min="0"
          max="100"
          value="0"
        />
        <div class="slider-value" id="sliderValue">0%</div>
        <div class="modal-buttons">
          <button class="modal-btn secondary" id="modalCancel">取消</button>
          <button class="modal-btn primary" id="modalConfirm">确认</button>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
      class Database {
        constructor() {
          this.dbName = "ZhixueAssistantDB";
          this.dbVersion = 1;
          this.db = null;
          this.storeNames = ["tasks", "notes", "plans", "pomodoroSessions"];
        }

        generateUUID() {
          return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
            /[xy]/g,
            (c) => {
              const r = (Math.random() * 16) | 0;
              const v = c === "x" ? r : (r & 0x3) | 0x8;
              return v.toString(16);
            },
          );
        }

        async init() {
          return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.dbVersion);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
              this.db = request.result;
              resolve(this.db);
            };
            request.onupgradeneeded = (e) => {
              const db = e.target.result;
              this.storeNames.forEach((name) => {
                if (!db.objectStoreNames.contains(name)) {
                  db.createObjectStore(name, { keyPath: "uuid" });
                }
              });
            };
          });
        }

        async get(storeName, key) {
          return new Promise((resolve, reject) => {
            const tx = this.db.transaction([storeName], "readonly");
            const store = tx.objectStore(storeName);
            const request = store.get(key);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => resolve(request.result);
          });
        }

        async getAll(storeName) {
          return new Promise((resolve, reject) => {
            const tx = this.db.transaction([storeName], "readonly");
            const store = tx.objectStore(storeName);
            const request = store.getAll();
            request.onerror = () => reject(request.error);
            request.onsuccess = () => resolve(request.result);
          });
        }

        async put(storeName, data) {
          return new Promise((resolve, reject) => {
            const tx = this.db.transaction([storeName], "readwrite");
            const store = tx.objectStore(storeName);
            const request = store.put(data);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => resolve(request.result);
          });
        }

        async delete(storeName, key) {
          return new Promise((resolve, reject) => {
            const tx = this.db.transaction([storeName], "readwrite");
            const store = tx.objectStore(storeName);
            const request = store.delete(key);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => resolve(request.result);
          });
        }
      }

      const db = new Database();
      let isDbReady = false;

      function showToast(message, type = "success") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.animation =
            "toastOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards";
          setTimeout(() => toast.remove(), 400);
        }, 3000);
      }

      function showModal(title, type, defaultValue = "", defaultProgress = 0) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalInput").value = defaultValue;
        document.getElementById("modalSlider").value = defaultProgress;
        document.getElementById("sliderValue").textContent =
          `${defaultProgress}%`;
        document.getElementById("modalOverlay").classList.add("show");
        document.getElementById("modalInput").focus();
      }

      let modalCallback = null;

      document.getElementById("modalSlider").addEventListener("input", (e) => {
        document.getElementById("sliderValue").textContent =
          `${e.target.value}%`;
      });

      document.getElementById("modalCancel").addEventListener("click", () => {
        document.getElementById("modalOverlay").classList.remove("show");
      });

      document.getElementById("modalConfirm").addEventListener("click", () => {
        const value = document.getElementById("modalInput").value.trim();
        const progress = parseInt(document.getElementById("modalSlider").value);
        if (value && modalCallback) {
          modalCallback(value, progress);
        }
        document.getElementById("modalOverlay").classList.remove("show");
      });

      document.getElementById("modalOverlay").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) {
          document.getElementById("modalOverlay").classList.remove("show");
        }
      });

      // ===== 任务管理 =====
      const taskInput = document.getElementById("taskInput");
      const taskCategory = document.getElementById("taskCategory");
      const taskPriority = document.getElementById("taskPriority");
      const addTaskBtn = document.getElementById("addTaskBtn");
      const taskList = document.getElementById("taskList");
      const taskSearch = document.getElementById("taskSearch");
      const filterButtons = document.querySelectorAll(".filter-btn");

      let currentFilter = "all";

      async function loadTasks() {
        if (!isDbReady) return;
        const tasks = await db.getAll("tasks");
        renderTasks(tasks);
      }

      function renderTasks(tasks) {
        let filtered = tasks;
        const searchQuery = taskSearch.value.toLowerCase();

        if (searchQuery) {
          filtered = filtered.filter((t) =>
            t.title.toLowerCase().includes(searchQuery),
          );
        }

        if (currentFilter === "completed") {
          filtered = filtered.filter((t) => t.completed);
        } else if (currentFilter === "pending") {
          filtered = filtered.filter((t) => !t.completed);
        }

        filtered.sort((a, b) => b.createdAt - a.createdAt);

        taskList.innerHTML = "";
        if (filtered.length === 0) {
          taskList.innerHTML =
            '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">暂无任务</div></div>';
          return;
        }

        filtered.forEach((task) => {
          const taskItem = document.createElement("div");
          taskItem.className = `task-item ${task.completed ? "completed" : ""}`;
          taskItem.innerHTML = `
            <div class="task-checkbox" data-uuid="${task.uuid}">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="task-content">
              <div class="task-text">${task.title}</div>
              <div class="task-meta">
                <span class="task-tag ${task.category}">${getCategoryLabel(task.category)}</span>
                <span class="task-priority ${task.priority}">${getPriorityLabel(task.priority)}</span>
                <span>${formatDate(task.createdAt)}</span>
              </div>
            </div>
            <button class="delete-btn" data-uuid="${task.uuid}">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          `;
          taskList.appendChild(taskItem);
        });
      }

      function getCategoryLabel(category) {
        const labels = {
          study: "学习",
          work: "工作",
          life: "生活",
          personal: "个人",
        };
        return labels[category] || category;
      }

      function getPriorityLabel(priority) {
        const labels = { high: "高", medium: "中", low: "低" };
        return labels[priority] || priority;
      }

      function formatDate(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        if (date.toDateString() === now.toDateString()) {
          return `今天 ${date.getHours().toString().padStart(2, "0")}:${date.getMinutes().toString().padStart(2, "0")}`;
        }
        return `${date.getMonth() + 1}/${date.getDate()}`;
      }

      async function addTask() {
        const title = taskInput.value.trim();
        if (!title) {
          showToast("请输入任务内容", "warning");
          return;
        }
        const task = {
          uuid: db.generateUUID(),
          title,
          category: taskCategory.value,
          priority: taskPriority.value,
          completed: false,
          createdAt: Date.now(),
        };
        await db.put("tasks", task);
        taskInput.value = "";
        showToast("任务已添加");
        await loadTasks();
        await updateStats();
      }

      async function toggleTask(uuid) {
        const task = await db.get("tasks", uuid);
        if (task) {
          task.completed = !task.completed;
          await db.put("tasks", task);
          showToast(task.completed ? "任务已完成" : "任务已取消");
          await loadTasks();
          await updateStats();
        }
      }

      async function deleteTask(uuid) {
        await db.delete("tasks", uuid);
        showToast("任务已删除", "info");
        await loadTasks();
        await updateStats();
      }

      addTaskBtn.addEventListener("click", addTask);
      taskInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") addTask();
      });

      taskSearch.addEventListener("input", () => loadTasks());

      filterButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          filterButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          loadTasks();
        });
      });

      taskList.addEventListener("click", (e) => {
        const checkbox = e.target.closest(".task-checkbox");
        const deleteBtn = e.target.closest(".delete-btn");
        if (checkbox) toggleTask(checkbox.dataset.uuid);
        if (deleteBtn) deleteTask(deleteBtn.dataset.uuid);
      });

      // ===== 学习计划 =====
      const planInput = document.getElementById("planInput");
      const addPlanBtn = document.getElementById("addPlanBtn");
      const planList = document.getElementById("planList");

      async function loadPlans() {
        if (!isDbReady) return;
        const plans = await db.getAll("plans");
        renderPlans(plans);
      }

      function renderPlans(plans) {
        planList.innerHTML = "";
        if (plans.length === 0) {
          planList.innerHTML =
            '<div class="empty-state"><div class="empty-state-icon">📖</div><div class="empty-state-text">暂无学习计划</div></div>';
          return;
        }
        plans.forEach((plan) => {
          const planItem = document.createElement("div");
          planItem.className = "plan-item";
          planItem.innerHTML = `
            <div class="plan-header">
              <span class="plan-title">${plan.title}</span>
              <div class="plan-actions">
                <button class="plan-btn edit" onclick="editPlan('${plan.uuid}', '${plan.title}', ${plan.progress})">编辑</button>
                <button class="plan-btn delete" onclick="deletePlan('${plan.uuid}')">删除</button>
              </div>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${plan.progress}%; background:var(--accent-blue)"></div>
            </div>
            <div class="progress-label">进度: ${plan.progress}%</div>
          `;
          planList.appendChild(planItem);
        });
      }

      addPlanBtn.addEventListener("click", () => {
        const title = planInput.value.trim();
        if (!title) {
          showToast("请输入计划名称", "warning");
          return;
        }
        showModal("添加学习计划", "add", title, 0);
        modalCallback = async (newTitle, progress) => {
          const plan = {
            uuid: db.generateUUID(),
            title: newTitle,
            progress: progress,
            createdAt: Date.now(),
          };
          await db.put("plans", plan);
          showToast("学习计划已添加");
          await loadPlans();
          await updateStats();
        };
        planInput.value = "";
      });

      window.editPlan = async (uuid, title, progress) => {
        showModal("编辑学习计划", "edit", title, progress);
        modalCallback = async (newTitle, newProgress) => {
          const plan = await db.get("plans", uuid);
          if (plan) {
            plan.title = newTitle;
            plan.progress = newProgress;
            await db.put("plans", plan);
            showToast("学习计划已更新");
            await loadPlans();
            await updateStats();
          }
        };
      };

      window.deletePlan = async (uuid) => {
        await db.delete("plans", uuid);
        showToast("学习计划已删除", "info");
        await loadPlans();
        await updateStats();
      };

      // ===== 智能笔记 =====
      const notesEditor = document.getElementById("notesEditor");
      const noteTitleInput = document.getElementById("noteTitleInput");
      const notesList = document.getElementById("notesList");
      const notesInfo = document.getElementById("notesInfo");
      const newNoteBtn = document.getElementById("newNoteBtn");
      const deleteNoteBtn = document.getElementById("deleteNoteBtn");
      let notesSaveTimer = null;
      let currentNoteId = null;

      async function loadNotes() {
        if (!isDbReady) return;
        const notes = await db.getAll("notes");
        notes.sort((a, b) => b.updatedAt - a.updatedAt);
        renderNotesList(notes);
        if (notes.length > 0) {
          selectNote(notes[0].uuid);
        } else {
          createNewNote();
        }
      }

      function renderNotesList(notes) {
        notesList.innerHTML = "";
        notes.forEach((note) => {
          const noteItem = document.createElement("div");
          noteItem.className = `note-item ${currentNoteId === note.uuid ? "active" : ""}`;
          noteItem.dataset.uuid = note.uuid;
          noteItem.innerHTML = `
            <div class="note-title">${note.title || "无标题笔记"}</div>
            <div class="note-date">${new Date(note.updatedAt).toLocaleDateString("zh-CN")}</div>
          `;
          noteItem.addEventListener("click", () => selectNote(note.uuid));
          notesList.appendChild(noteItem);
        });
      }

      async function selectNote(uuid) {
        const note = await db.get("notes", uuid);
        if (note) {
          currentNoteId = uuid;
          noteTitleInput.value = note.title || "";
          notesEditor.value = note.content || "";
          notesInfo.textContent = `上次保存: ${new Date(note.updatedAt).toLocaleString("zh-CN")}`;
          renderNotesList(await db.getAll("notes"));
        }
      }

      async function createNewNote() {
        const note = {
          uuid: db.generateUUID(),
          title: "新笔记",
          content: "",
          createdAt: Date.now(),
          updatedAt: Date.now(),
        };
        await db.put("notes", note);
        currentNoteId = note.uuid;
        noteTitleInput.value = "新笔记";
        notesEditor.value = "";
        notesInfo.textContent = "上次保存: 刚刚";
        await loadNotes();
        showToast("新笔记已创建");
      }

      async function saveCurrentNote() {
        if (!isDbReady || !currentNoteId) return;
        const note = await db.get("notes", currentNoteId);
        if (note) {
          note.title = noteTitleInput.value || "无标题笔记";
          note.content = notesEditor.value;
          note.updatedAt = Date.now();
          await db.put("notes", note);
          notesInfo.textContent = "上次保存: 刚刚";
          renderNotesList(await db.getAll("notes"));
        }
      }

      async function deleteCurrentNote() {
        if (!currentNoteId) {
          showToast("请先选择要删除的笔记", "warning");
          return;
        }
        await db.delete("notes", currentNoteId);
        showToast("笔记已删除", "info");
        const notes = await db.getAll("notes");
        if (notes.length > 0) {
          selectNote(notes[0].uuid);
        } else {
          createNewNote();
        }
        await updateStats();
      }

      newNoteBtn.addEventListener("click", createNewNote);
      deleteNoteBtn.addEventListener("click", deleteCurrentNote);

      notesEditor.addEventListener("input", () => {
        if (notesSaveTimer) clearTimeout(notesSaveTimer);
        notesSaveTimer = setTimeout(saveCurrentNote, 1000);
      });

      noteTitleInput.addEventListener("input", () => {
        if (notesSaveTimer) clearTimeout(notesSaveTimer);
        notesSaveTimer = setTimeout(saveCurrentNote, 1000);
      });

      // ===== 番茄计时器 =====
      let timerInterval;
      let seconds = 25 * 60;
      let totalSeconds = 25 * 60;
      let isRunning = false;
      let isBreak = false;
      let sessionStartTime = null;

      // 请求系统通知权限
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }

      // 发送系统通知的辅助函数
      function showSystemNotification(title, body) {
        if (!("Notification" in window)) return;
        if (Notification.permission === "granted") {
          new Notification(title, {
            body: body,
            icon: "https://api.iconify.design/mdi/timer-sand.svg?color=%233b82f6",
            tag: "pomodoro",
          });
        }
      }

      const circumference = 2 * Math.PI * 92;
      const timerProgress = document.getElementById("timerProgress");
      timerProgress.style.strokeDasharray = circumference;

      function updateTimerDisplay() {
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        document.getElementById("timer").textContent =
          `${minutes.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
        const progress = seconds / totalSeconds;
        const offset = circumference * (1 - progress);
        timerProgress.style.strokeDashoffset = offset;
      }

      async function savePomodoroSession(duration) {
        if (!isDbReady) return;
        await db.put("pomodoroSessions", {
          uuid: db.generateUUID(),
          type: isBreak ? "break" : "focus",
          duration: duration,
          startedAt: sessionStartTime,
          endedAt: Date.now(),
        });
        await updateStats();
      }

      function startTimer() {
        if (!isRunning) {
          isRunning = true;
          sessionStartTime = Date.now();
          document
            .getElementById("timerRingContainer")
            .classList.add("running");
          const phaseText = isBreak ? "休息" : "专注";
          document.getElementById("phaseLabel").textContent = isBreak
            ? "休息中"
            : "专注中";

          // 开启时发送系统通知
          showSystemNotification(
            `智学助手 - ${phaseText}计时已开始`,
            `${phaseText}时长 ${totalSeconds / 60} 分钟，加油！`,
          );
          showToast(`${phaseText}计时已开启`, "success");

          timerInterval = setInterval(async () => {
            if (seconds > 0) {
              seconds--;
              updateTimerDisplay();
            } else {
              clearInterval(timerInterval);
              isRunning = false;
              document
                .getElementById("timerRingContainer")
                .classList.remove("running");
              const elapsedMinutes = Math.max(
                1,
                Math.floor((Date.now() - sessionStartTime) / 1000 / 60),
              );
              await savePomodoroSession(elapsedMinutes);

              if (!isBreak) {
                // 专注结束通知
                showSystemNotification(
                  "智学助手 - 专注时间结束",
                  "辛苦了！请休息 5 分钟，让大脑放松一下。",
                );
                showToast("专注时间结束！休息 5 分钟吧", "info");
                isBreak = true;
                seconds = 5 * 60;
                totalSeconds = 5 * 60;
                document.getElementById("phaseLabel").textContent = "休息时间";
              } else {
                // 休息结束通知
                showSystemNotification(
                  "智学助手 - 休息结束",
                  "休息结束，开始新一轮专注吧！",
                );
                showToast("休息结束，开始新一轮专注吧", "info");
                isBreak = false;
                seconds = 25 * 60;
                totalSeconds = 25 * 60;
                document.getElementById("phaseLabel").textContent = "专注时间";
              }
              updateTimerDisplay();
            }
          }, 1000);
        }
      }

      function pauseTimer() {
        if (isRunning) {
          clearInterval(timerInterval);
          isRunning = false;
          document
            .getElementById("timerRingContainer")
            .classList.remove("running");
          document.getElementById("phaseLabel").textContent = "已暂停";
          showToast("计时已暂停", "warning");
        }
      }

      function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        isBreak = false;
        seconds = 25 * 60;
        totalSeconds = 25 * 60;
        document
          .getElementById("timerRingContainer")
          .classList.remove("running");
        document.getElementById("phaseLabel").textContent = "专注时间";
        updateTimerDisplay();
        showToast("计时已重置", "info");
      }

      document.getElementById("startBtn").addEventListener("click", startTimer);
      document.getElementById("pauseBtn").addEventListener("click", pauseTimer);
      document.getElementById("resetBtn").addEventListener("click", resetTimer);

      // ===== 统计 =====
      async function updateStats() {
        if (!isDbReady) return;
        const [tasks, plans, notes, sessions] = await Promise.all([
          db.getAll("tasks"),
          db.getAll("plans"),
          db.getAll("notes"),
          db.getAll("pomodoroSessions"),
        ]);

        const pendingTasks = tasks.filter((t) => !t.completed).length;
        const totalMinutes = sessions
          .filter((s) => s.type === "focus")
          .reduce((sum, s) => sum + (s.duration || 0), 0);

        document.getElementById("statTasks").textContent = pendingTasks;
        document.getElementById("statTime").textContent = totalMinutes;
        document.getElementById("statPlans").textContent = plans.length;
        document.getElementById("statNotes").textContent = notes.length;
      }

      // ===== 按钮涟漪效果 =====
      function createRipple(event, button) {
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + "px";
        ripple.style.left = event.clientX - rect.left - size / 2 + "px";
        ripple.style.top = event.clientY - rect.top - size / 2 + "px";
        button.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      }

      document
        .querySelectorAll(".add-btn, .timer-btn, .modal-btn")
        .forEach((btn) => {
          btn.addEventListener("click", (e) => createRipple(e, btn));
        });

      // ===== 初始化 =====
      async function initApp() {
        try {
          await db.init();
          isDbReady = true;
          await loadTasks();
          await loadPlans();
          await loadNotes();
          await updateStats();
          updateTimerDisplay();
          showToast("数据已加载", "info");
        } catch (error) {
          console.error("Database initialization failed:", error);
          showToast("数据库初始化失败", "error");
        }
      }

      document.addEventListener("DOMContentLoaded", initApp);
    </script>
  </body>
</html>
