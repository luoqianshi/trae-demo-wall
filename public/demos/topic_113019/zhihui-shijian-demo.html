<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧食荐 - 校园餐饮推荐</title>
<style>
:root {
  --primary: #FF6B6B;
  --secondary: #FFA07A;
  --accent: #FFB6C1;
  --bg: #FFF5F5;
  --card-bg: #FFFFFF;
  --text: #333333;
  --text-secondary: #888888;
  --border: #FFE0E0;
  --shadow: 0 2px 12px rgba(255,107,107,0.12);
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #e8e8e8;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh;
  overflow:hidden;
}
.phone-frame {
  width:390px; height:844px;
  background:var(--bg);
  border-radius:40px;
  overflow:hidden;
  position:relative;
  box-shadow: 0 0 0 8px #1a1a1a, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.3);
}
.status-bar {
  height:54px; background:var(--primary);
  display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 28px 8px; color:#fff; font-size:14px; font-weight:600;
  position:relative; z-index:100;
}
.nav-bar {
  height:44px; background:var(--primary);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:17px; font-weight:600;
  position:relative; z-index:100;
}
.nav-bar .back-btn {
  position:absolute; left:12px; cursor:pointer; font-size:20px;
  padding:4px 8px;
}
.nav-bar .nav-title { }
.tab-bar {
  position:absolute; bottom:0; left:0; right:0;
  height:83px; background:#fff;
  display:flex; align-items:flex-start; justify-content:space-around;
  padding-top:6px;
  border-top:1px solid var(--border);
  z-index:200;
}
.tab-item {
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer; font-size:10px; color:var(--text-secondary);
  transition:color .2s;
  padding:4px 12px;
}
.tab-item.active { color:var(--primary); }
.tab-icon { font-size:24px; margin-bottom:2px; }
.page-container {
  position:absolute; top:0; left:0; right:0; bottom:0;
  overflow:hidden;
}
.page {
  position:absolute; top:0; left:0; right:0; bottom:83px;
  background:var(--bg);
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  transition: transform .3s ease, opacity .3s ease;
}
.page.hidden { display:none; }
.page.slide-in { transform:translateX(100%); opacity:0; }
.page.slide-out { transform:translateX(-30%); opacity:.5; }
.page.slide-in-active { transform:translateX(0); opacity:1; }
.sub-page {
  position:absolute; top:0; left:0; right:0; bottom:0;
  background:var(--bg);
  z-index:150;
  transform:translateX(100%);
  transition:transform .3s ease;
}
.sub-page.active { transform:translateX(0); }
.search-bar {
  background:var(--primary); padding:0 16px 12px;
}
.search-input-wrap {
  background:rgba(255,255,255,0.9); border-radius:20px;
  display:flex; align-items:center; padding:8px 14px;
}
.search-input-wrap span { margin-right:8px; font-size:14px; }
.search-input-wrap input {
  border:none; outline:none; background:transparent;
  font-size:14px; flex:1; color:var(--text);
}
.filter-bar {
  display:flex; gap:8px; padding:12px 16px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.filter-bar::-webkit-scrollbar { display:none; }
.filter-tag {
  flex-shrink:0; padding:6px 14px; border-radius:16px;
  background:#fff; border:1px solid var(--border);
  font-size:12px; color:var(--text-secondary); cursor:pointer;
  transition:all .2s;
}
.filter-tag.active {
  background:var(--primary); color:#fff; border-color:var(--primary);
}
.section-title {
  padding:16px 16px 8px; font-size:16px; font-weight:600;
  color:var(--text); display:flex; align-items:center; justify-content:space-between;
}
.section-title .more { font-size:12px; color:var(--text-secondary); font-weight:400; }
.canteen-scroll {
  display:flex; gap:12px; padding:0 16px 16px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.canteen-scroll::-webkit-scrollbar { display:none; }
.canteen-card {
  flex-shrink:0; width:200px; background:#fff;
  border-radius:var(--radius); padding:14px;
  box-shadow:var(--shadow); cursor:pointer;
  transition:transform .2s;
}
.canteen-card:active { transform:scale(0.97); }
.canteen-card .cc-name { font-size:15px; font-weight:600; color:var(--text); margin-bottom:4px; }
.canteen-card .cc-campus { font-size:11px; color:var(--text-secondary); margin-bottom:6px; }
.canteen-card .cc-time { font-size:11px; color:var(--secondary); margin-bottom:6px; }
.canteen-card .cc-crowd { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text-secondary); }
.canteen-card .cc-crowd .dots { display:flex; gap:2px; }
.canteen-card .cc-crowd .dot {
  width:8px; height:8px; border-radius:50%;
  background:#eee;
}
.canteen-card .cc-crowd .dot.filled { background:var(--primary); }
.dish-list { padding:0 16px 16px; }
.dish-card {
  background:#fff; border-radius:var(--radius);
  padding:14px; margin-bottom:10px;
  box-shadow:var(--shadow); cursor:pointer;
  display:flex; gap:12px; transition:transform .2s;
}
.dish-card:active { transform:scale(0.98); }
.dish-emoji {
  width:56px; height:56px; border-radius:12px;
  background:linear-gradient(135deg, var(--accent), var(--secondary));
  display:flex; align-items:center; justify-content:center;
  font-size:28px; flex-shrink:0;
}
.dish-info { flex:1; }
.dish-info .di-name { font-size:15px; font-weight:600; color:var(--text); margin-bottom:3px; }
.dish-info .di-meta { font-size:11px; color:var(--text-secondary); margin-bottom:4px; }
.dish-info .di-bottom { display:flex; align-items:center; justify-content:space-between; }
.dish-info .di-price { font-size:16px; font-weight:700; color:var(--primary); }
.dish-info .di-price small { font-size:11px; font-weight:400; }
.dish-info .di-rating { font-size:12px; color:#FFA500; }
.rec-page-content { padding:16px; }
.taste-tags-section { margin-bottom:16px; }
.taste-tags-section h3 { font-size:15px; margin-bottom:8px; color:var(--text); }
.taste-tag-row { display:flex; flex-wrap:wrap; gap:8px; }
.taste-tag-item {
  padding:4px 12px; border-radius:12px; font-size:12px;
  background:#fff; border:1px solid var(--border); color:var(--text-secondary);
  cursor:pointer; transition:all .2s;
}
.taste-tag-item.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.weather-card {
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius:var(--radius); padding:16px; color:#fff;
  margin-bottom:16px;
}
.weather-card .wc-top { display:flex; align-items:center; justify-content:space-between; }
.weather-card .wc-temp { font-size:36px; font-weight:700; }
.weather-card .wc-desc { font-size:14px; opacity:.9; }
.weather-card .wc-detail { font-size:12px; opacity:.7; margin-top:8px; }
.rec-dish-card {
  background:#fff; border-radius:var(--radius);
  padding:14px; margin-bottom:10px;
  box-shadow:var(--shadow); cursor:pointer;
  transition:transform .2s;
}
.rec-dish-card:active { transform:scale(0.98); }
.rec-dish-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.rec-dish-name { font-size:15px; font-weight:600; }
.rec-match {
  font-size:12px; font-weight:600; color:#fff;
  background:var(--primary); border-radius:10px; padding:2px 10px;
}
.rec-reason { font-size:12px; color:var(--text-secondary); margin-bottom:4px; line-height:1.5; }
.rec-allergen { font-size:11px; color:#FF4444; background:#FFF0F0; padding:2px 8px; border-radius:8px; display:inline-block; }
.rec-price { font-size:14px; font-weight:700; color:var(--primary); margin-top:4px; }
.profile-header {
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  padding:20px 16px 30px; text-align:center; color:#fff;
}
.profile-avatar {
  width:64px; height:64px; border-radius:50%;
  background:rgba(255,255,255,0.3); margin:0 auto 8px;
  display:flex; align-items:center; justify-content:center;
  font-size:32px;
}
.profile-name { font-size:18px; font-weight:600; }
.profile-mbti {
  display:inline-block; margin-top:6px; padding:2px 12px;
  background:rgba(255,255,255,0.25); border-radius:10px;
  font-size:12px;
}
.profile-menu { padding:0 16px; margin-top:-16px; }
.menu-group {
  background:#fff; border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
}
.menu-item {
  display:flex; align-items:center; padding:14px 16px;
  border-bottom:1px solid #f5f5f5; cursor:pointer;
  transition:background .2s;
}
.menu-item:last-child { border-bottom:none; }
.menu-item:active { background:#f9f9f9; }
.menu-item .mi-icon { font-size:20px; margin-right:12px; }
.menu-item .mi-text { flex:1; font-size:14px; color:var(--text); }
.menu-item .mi-arrow { color:#ccc; font-size:14px; }
.menu-item .mi-badge {
  background:var(--primary); color:#fff; font-size:10px;
  border-radius:8px; padding:1px 6px; margin-right:8px;
}
.pref-content { padding:16px; }
.radar-wrap { display:flex; justify-content:center; margin:16px 0; }
.slider-group { margin-bottom:20px; }
.slider-label {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:6px; font-size:13px; color:var(--text);
}
.slider-label .sl-val { color:var(--primary); font-weight:600; }
input[type="range"] {
  width:100%; -webkit-appearance:none; height:6px;
  border-radius:3px; background:#eee; outline:none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none; width:20px; height:20px;
  border-radius:50%; background:var(--primary); cursor:pointer;
}
.tag-select-section { margin-bottom:16px; }
.tag-select-section h4 { font-size:14px; margin-bottom:8px; color:var(--text); }
.tag-select-row { display:flex; flex-wrap:wrap; gap:8px; }
.tag-option {
  padding:6px 14px; border-radius:14px; font-size:12px;
  background:#fff; border:1px solid var(--border); color:var(--text-secondary);
  cursor:pointer; transition:all .2s;
}
.tag-option.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.detail-content { padding:16px; }
.detail-hero {
  width:100%; height:200px; border-radius:var(--radius);
  background:linear-gradient(135deg, var(--accent), var(--secondary));
  display:flex; align-items:center; justify-content:center;
  font-size:64px; margin-bottom:16px;
}
.detail-title { font-size:20px; font-weight:700; margin-bottom:4px; }
.detail-story-title {
  font-size:14px; color:var(--primary); font-weight:600;
  margin:12px 0 6px;
}
.detail-story { font-size:13px; color:var(--text-secondary); line-height:1.8; margin-bottom:16px; }
.detail-section-title { font-size:14px; font-weight:600; margin-bottom:8px; }
.ingredient-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.ingredient-tag {
  padding:4px 10px; border-radius:10px; font-size:11px;
  background:#fff; border:1px solid var(--border); color:var(--text-secondary);
}
.nutrition-row {
  display:flex; justify-content:space-around;
  background:#fff; border-radius:var(--radius); padding:12px;
  box-shadow:var(--shadow); margin-bottom:16px;
}
.nutrition-item { text-align:center; }
.nutrition-item .ni-val { font-size:18px; font-weight:700; color:var(--primary); }
.nutrition-item .ni-label { font-size:11px; color:var(--text-secondary); }
.detail-actions {
  display:flex; gap:12px;
}
.detail-btn {
  flex:1; padding:12px; border-radius:var(--radius);
  font-size:14px; font-weight:600; text-align:center;
  cursor:pointer; transition:all .2s; border:none;
}
.detail-btn.primary { background:var(--primary); color:#fff; }
.detail-btn.secondary { background:#fff; color:var(--primary); border:1px solid var(--primary); }
.detail-btn:active { transform:scale(0.97); }
.canteen-detail-content { padding:16px; }
.canteen-detail-header { margin-bottom:16px; }
.canteen-detail-header h2 { font-size:20px; font-weight:700; margin-bottom:6px; }
.canteen-detail-header p { font-size:13px; color:var(--text-secondary); line-height:1.6; }
.window-list { margin-bottom:16px; }
.window-card {
  background:#fff; border-radius:var(--radius); padding:14px;
  margin-bottom:10px; box-shadow:var(--shadow);
}
.window-card h4 { font-size:14px; font-weight:600; margin-bottom:4px; }
.window-card .wc-location { font-size:12px; color:var(--text-secondary); margin-bottom:8px; }
.window-dish-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 0; border-top:1px solid #f5f5f5; cursor:pointer;
}
.window-dish-item:first-of-type { border-top:none; }
.wdi-name { font-size:13px; }
.wdi-price { font-size:13px; color:var(--primary); font-weight:600; }
.fav-list { padding:16px; }
.fav-empty { text-align:center; padding:60px 20px; color:var(--text-secondary); }
.fav-empty .fe-icon { font-size:48px; margin-bottom:12px; }
.fav-card {
  background:#fff; border-radius:var(--radius); padding:14px;
  margin-bottom:10px; box-shadow:var(--shadow);
  display:flex; gap:12px; position:relative;
  transition:transform .3s;
}
.fav-card .fav-delete {
  position:absolute; right:-80px; top:0; bottom:0; width:80px;
  background:#FF4444; color:#fff; display:flex; align-items:center;
  justify-content:center; font-size:14px; cursor:pointer;
  border-radius:0 var(--radius) var(--radius) 0;
}
.buddy-list { padding:16px; }
.buddy-card {
  background:#fff; border-radius:var(--radius); padding:14px;
  margin-bottom:10px; box-shadow:var(--shadow);
  display:flex; gap:12px; align-items:center;
}
.buddy-avatar {
  width:48px; height:48px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--secondary));
  display:flex; align-items:center; justify-content:center;
  font-size:24px; flex-shrink:0;
}
.buddy-info { flex:1; }
.buddy-info .bi-name { font-size:15px; font-weight:600; }
.buddy-info .bi-mbti { font-size:11px; color:var(--text-secondary); }
.buddy-info .bi-common { font-size:11px; color:var(--secondary); margin-top:2px; }
.buddy-match {
  font-size:14px; font-weight:700; color:var(--primary);
}
.tray-content { padding:16px; }
.tray-empty { text-align:center; padding:60px 20px; color:var(--text-secondary); }
.tray-empty .te-icon { font-size:48px; margin-bottom:12px; }
.tray-item {
  background:#fff; border-radius:var(--radius); padding:14px;
  margin-bottom:10px; box-shadow:var(--shadow);
  display:flex; justify-content:space-between; align-items:center;
}
.tray-item .ti-info .ti-name { font-size:14px; font-weight:600; }
.tray-item .ti-info .ti-canteen { font-size:11px; color:var(--text-secondary); }
.tray-item .ti-price { font-size:16px; font-weight:700; color:var(--primary); }
.tray-remove { color:var(--text-secondary); cursor:pointer; margin-left:12px; font-size:18px; }
.tray-total {
  background:#fff; border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center;
  margin-top:16px;
}
.tray-total .tt-label { font-size:14px; }
.tray-total .tt-price { font-size:20px; font-weight:700; color:var(--primary); }
.toast {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.8);
  background:rgba(0,0,0,0.7); color:#fff; padding:12px 24px;
  border-radius:8px; font-size:14px; z-index:9999;
  opacity:0; transition:all .3s; pointer-events:none;
}
.toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
.page-scroll { padding-bottom:20px; }
</style>
</head>
<body>
<div class="phone-frame" id="app">
  <!-- Status Bar -->
  <div class="status-bar" id="statusBar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <!-- Nav Bar -->
  <div class="nav-bar" id="navBar">
    <span class="back-btn" id="backBtn" style="display:none" onclick="goBack()">‹</span>
    <span class="nav-title" id="navTitle">智慧食荐</span>
  </div>

  <!-- Pages Container -->
  <div class="page-container">
    <!-- Home Page -->
    <div class="page" id="homePage">
      <div class="search-bar">
        <div class="search-input-wrap">
          <span>🔍</span>
          <input type="text" placeholder="搜索菜品、食堂..." id="searchInput" oninput="handleSearch()">
        </div>
      </div>
      <div class="filter-bar" id="filterBar"></div>
      <div class="section-title">🍽️ 食堂推荐 <span class="more">查看全部 ›</span></div>
      <div class="canteen-scroll" id="canteenScroll"></div>
      <div class="section-title">🔥 热门菜品 <span class="more" onclick="showAllDishes()">更多 ›</span></div>
      <div class="dish-list" id="dishList"></div>
    </div>

    <!-- Recommend Page -->
    <div class="page hidden" id="recPage">
      <div class="rec-page-content page-scroll" id="recContent"></div>
    </div>

    <!-- Profile Page -->
    <div class="page hidden" id="profilePage">
      <div class="profile-header">
        <div class="profile-avatar">🎓</div>
        <div class="profile-name" id="profileName">交大小吃货</div>
        <div class="profile-mbti" id="profileMbti">ENFP</div>
      </div>
      <div class="profile-menu" id="profileMenu"></div>
    </div>

    <!-- Sub Pages -->
    <div class="sub-page" id="prefPage">
      <div class="nav-bar">
        <span class="back-btn" onclick="goBack()">‹</span>
        <span class="nav-title">口味偏好</span>
      </div>
      <div class="pref-content page-scroll" id="prefContent"></div>
    </div>

    <div class="sub-page" id="dishDetailPage">
      <div class="nav-bar">
        <span class="back-btn" onclick="goBack()">‹</span>
        <span class="nav-title" id="dishDetailTitle">菜品详情</span>
      </div>
      <div class="detail-content page-scroll" id="dishDetailContent"></div>
    </div>

    <div class="sub-page" id="canteenDetailPage">
      <div class="nav-bar">
        <span class="back-btn" onclick="goBack()">‹</span>
        <span class="nav-title" id="canteenDetailTitle">食堂详情</span>
      </div>
      <div class="canteen-detail-content page-scroll" id="canteenDetailContent"></div>
    </div>

    <div class="sub-page" id="favPage">
      <div class="nav-bar">
        <span class="back-btn" onclick="goBack()">‹</span>
        <span class="nav-title">我的收藏</span>
      </div>
      <div class="fav-list page-scroll" id="favContent"></div>
    </div>

    <div class="sub-page" id="buddyPage">
      <div class="nav-bar">
        <span class="back-btn" onclick="goBack()">‹</span>
        <span class="nav-title">饭搭子</span>
      </div>
      <div class="buddy-list page-scroll" id="buddyContent"></div>
    </div>

    <div class="sub-page" id="trayPage">
      <div class="nav-bar">
        <span class="back-btn" onclick="goBack()">‹</span>
        <span class="nav-title">今日餐盘</span>
      </div>
      <div class="tray-content page-scroll" id="trayContent"></div>
    </div>

    <div class="sub-page" id="adminPage">
      <div class="nav-bar">
        <span class="back-btn" onclick="goBack()">‹</span>
        <span class="nav-title">管理后台</span>
      </div>
      <div class="pref-content page-scroll" id="adminContent">
        <div style="text-align:center;padding:80px 20px;color:var(--text-secondary);">
          <div style="font-size:48px;margin-bottom:12px;">⚙️</div>
          <p>管理后台开发中...</p>
        </div>
      </div>
    </div>

    <div class="sub-page" id="msgPage">
      <div class="nav-bar">
        <span class="back-btn" onclick="goBack()">‹</span>
        <span class="nav-title">消息中心</span>
      </div>
      <div class="pref-content page-scroll" id="msgContent">
        <div style="text-align:center;padding:80px 20px;color:var(--text-secondary);">
          <div style="font-size:48px;margin-bottom:12px;">🔔</div>
          <p>暂无新消息</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar" id="tabBar">
    <div class="tab-item active" data-tab="home" onclick="switchTab('home')">
      <span class="tab-icon">🏠</span>
      <span>首页</span>
    </div>
    <div class="tab-item" data-tab="rec" onclick="switchTab('rec')">
      <span class="tab-icon">✨</span>
      <span>推荐</span>
    </div>
    <div class="tab-item" data-tab="profile" onclick="switchTab('profile')">
      <span class="tab-icon">👤</span>
      <span>我的</span>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

<script>

function openSubPage(pageId, title) {

    const pageId = pageStack.pop();
    document.getElementById(pageId).classList.remove('active');

  if(pageStack.length === 0) {
    document.getElementById('backBtn').style.display = 'none';
    const titles = {home:'智慧食荐', rec:'今日推荐', profile:'我的'};
    document.getElementById('navTitle').textContent = titles[currentTab] || '智慧食荐';

// ========== RECOMMEND PAGE ==========
function calcMatch(dish, pref) {
  const keys = ['spicy','salty','sweet','sour','oily','umami'];
  let sumDiff = 0;
  keys.forEach(k=>{
    sumDiff += Math.abs((dish.taste[k]||0) - (pref[k]||3));
  });
  const maxDiff = keys.length * 5;
  return Math.round((1 - sumDiff/maxDiff) * 100);
}

function getRecReason(dish, pref, matchScore) {
  const reasons = [];
  if(matchScore >= 85) reasons.push('与你的口味高度匹配');
  else if(matchScore >= 70) reasons.push('与你的口味较为匹配');

  const prefTags = pref.tags || [];
  const commonTags = dish.tags.filter(t => prefTags.includes(t));
  if(commonTags.length > 0) reasons.push(`符合你「${commonTags.join('、')}」的偏好`);

  if(dish.rating >= 4.6) reasons.push('超高人气菜品');
  if(dish.price <= 8) reasons.push('性价比之选');

  const userAllergens = pref.allergens || [];
  const conflictAllergens = dish.allergens.filter(a => userAllergens.includes(a));

  return { reasons: reasons.length ? reasons : ['为你推荐的美食'], allergenWarn: conflictAllergens };
}

  });

  html += `<div class="tag-select-section"><h4>🏷️ 口味标签（可多选）</h4><div class="tag-select-row">`;

  });

    html += `<span class="tag-option ${active?'active':''}" onclick="setProvince('${p}')">${p}</span>`;
  });
  html += `</div></div>`;

  html += `<div class="tag-select-section"><h4>🧠 MBTI人格</h4><div class="tag-select-row">`;
  mbtiList.forEach(m=>{
    const active = (pref.mbti||'ENFP')===m;
    html += `<span class="tag-option ${active?'active':''}" onclick="setMbti('${m}')">${m}</span>`;
  });
  html += `</div></div>`;

  html += `<div class="tag-select-section"><h4>⚠️ 过敏原（可多选）</h4><div class="tag-select-row">`;

    const active = (pref.allergens||[]).includes(a);
    html += `<span class="tag-option ${active?'active':''}" onclick="toggleAllergen('${a}')">${a}</span>`;
  });
  html += `</div></div>`;

  el.innerHTML = html;
  setTimeout(()=>drawRadar('prefRadar', pref), 50);
}

function updatePref(key, val) {
  const pref = getUserPref();
  pref[key] = parseInt(val);
  saveUserPref(pref);
  document.getElementById('sv_'+key).textContent = val;
  drawRadar('prefRadar', pref);
}

function toggleTasteTag(tag) {
  const pref = getUserPref();
  if(!pref.tags) pref.tags = [];
  const idx = pref.tags.indexOf(tag);
  if(idx>=0) pref.tags.splice(idx,1); else pref.tags.push(tag);
  saveUserPref(pref);
  renderPrefPage();
}

function setProvince(p) {
  const pref = getUserPref();
  pref.province = p;
  saveUserPref(pref);
  renderPrefPage();
}

function setMbti(m) {
  const pref = getUserPref();
  pref.mbti = m;
  saveUserPref(pref);
  renderPrefPage();
}

function toggleAllergen(a) {
  const pref = getUserPref();
  if(!pref.allergens) pref.allergens = [];
  const idx = pref.allergens.indexOf(a);
  if(idx>=0) pref.allergens.splice(idx,1); else pref.allergens.push(a);
  saveUserPref(pref);
  renderPrefPage();
}

      <div class="nutrition-item"><div class="ni-val">${dish.price}</div><div class="ni-label">元</div></div>
    </div>
    <div class="detail-actions">
      <button class="detail-btn ${isFav?'primary':'secondary'}" onclick="toggleFavorite('${dishId}')">${isFav?'❤️ 已收藏':'🤍 收藏'}</button>
      <button class="detail-btn ${inTray?'primary':'secondary'}" onclick="toggleTray('${dishId}')">${inTray?'🍽️ 已加入餐盘':'+ 加入今日餐盘'}</button>
    </div>`;

  el.innerHTML = html;
  document.getElementById('dishDetailTitle').textContent = dish.name;
  openSubPage('dishDetailPage', dish.name);
  setTimeout(()=>drawRadar('dishRadar', dish.taste), 50);
}

// ========== CANTEEN DETAIL ==========
function openCanteenDetail(canteenId) {
  const canteen = canteens.find(c=>c._id===canteenId);
  if(!canteen) return;

  const canteenDishes = dishes.filter(d=>d.canteenId===canteenId);
  const el = document.getElementById('canteenDetailContent');

  let html = `<div class="canteen-detail-header">
    <h2>${canteen.name}</h2>
    <p>📍 ${canteen.address}<br>🕐 ${canteen.openTime}<br>📞 ${canteen.phone}<br>📝 ${canteen.description}</p>
  </div>`;

  canteen.windows.forEach(w=>{
    const windowDishes = canteenDishes.filter(d=>d.windowName===w.name);
    html += `<div class="window-card">
      <h4>${w.name}</h4>
      <div class="wc-location">📍 ${w.location}</div>`;
    if(windowDishes.length) {
      windowDishes.forEach(d=>{
        const emoji = dishEmojis[d._id] || '🍽️';
        html += `<div class="window-dish-item" onclick="openDishDetail('${d._id}')">
          <span class="wdi-name">${emoji} ${d.name}</span>
          <span class="wdi-price">¥${d.price}</span>
        </div>`;
      });
    } else {
      html += `<div style="font-size:12px;color:var(--text-secondary);padding:4px 0;">暂无菜品数据</div>`;
    }
    html += `</div>`;
  });

  el.innerHTML = html;
  document.getElementById('canteenDetailTitle').textContent = canteen.name;
  openSubPage('canteenDetailPage', canteen.name);
}

// ========== FAVORITES ==========
function toggleFavorite(dishId) {
  let favs = getFavorites();
  const idx = favs.indexOf(dishId);
  if(idx>=0) { favs.splice(idx,1); showToast('已取消收藏'); }
  else { favs.push(dishId); showToast('已收藏 ❤️'); }
  saveFavorites(favs);
  renderDishList();
  // Re-render detail if open
  if(pageStack.includes('dishDetailPage')) openDishDetail(dishId);
  else if(pageStack.includes('favPage')) renderFavPage();
}

function renderFavPage() {
  const favs = getFavorites();
  const el = document.getElementById('favContent');
  if(favs.length===0) {
    el.innerHTML = `<div class="fav-empty"><div class="fe-icon">💝</div><p>还没有收藏哦<br>去首页发现美食吧！</p></div>`;
    return;
  }
  let html = '';
  favs.forEach(id=>{
    const dish = dishes.find(d=>d._id===id);
    if(!dish) return;
    const emoji = dishEmojis[id] || '🍽️';
    html += `<div class="fav-card" id="fav_${id}">
      <div class="dish-emoji" onclick="openDishDetail('${id}')">${emoji}</div>
      <div class="dish-info" onclick="openDishDetail('${id}')">
        <div class="di-name">${dish.name}</div>
        <div class="di-meta">${dish.cuisine} · ${dish.windowName}</div>
        <div class="di-bottom">
          <div class="di-price">¥${dish.price}</div>
          <div class="di-rating">⭐ ${dish.rating}</div>
        </div>
      </div>
      <span class="tray-remove" onclick="removeFav('${id}')">✕</span>
    </div>`;
  });
  el.innerHTML = html;
}

function removeFav(dishId) {
  let favs = getFavorites();
  favs = favs.filter(f=>f!==dishId);
  saveFavorites(favs);
  showToast('已取消收藏');
  renderFavPage();
  renderDishList();
}

// ========== TRAY ==========
function toggleTray(dishId) {
  let tray = getTray();
  const dish = dishes.find(d=>d._id===dishId);
  if(!dish) return;
  const idx = tray.findIndex(t=>t._id===dishId);
  if(idx>=0) { tray.splice(idx,1); showToast('已从餐盘移除'); }
  else { tray.push({_id:dish._id,name:dish.name,price:dish.price,canteenName:dish.canteenName}); showToast('已加入餐盘 🍽️'); }
  saveTray(tray);
  if(pageStack.includes('dishDetailPage')) openDishDetail(dishId);
  else if(pageStack.includes('trayPage')) renderTrayPage();
}

function renderTrayPage() {
  const tray = getTray();
  const el = document.getElementById('trayContent');
  if(tray.length===0) {
    el.innerHTML = `<div class="tray-empty"><div class="te-icon">🍽️</div><p>今日餐盘还是空的<br>去添加美食吧！</p></div>`;
    return;
  }
  let html = '';
  let total = 0;
  tray.forEach((item,i)=>{
    total += item.price;
    html += `<div class="tray-item">
      <div class="ti-info"><div class="ti-name">${item.name}</div><div class="ti-canteen">📍 ${item.canteenName}</div></div>
      <span class="ti-price">¥${item.price}</span>
      <span class="tray-remove" onclick="removeTrayItem(${i})">✕</span>
    </div>`;
  });
  html += `<div class="tray-total"><span class="tt-label">合计</span><span class="tt-price">¥${total}</span></div>`;
  el.innerHTML = html;
}

function removeTrayItem(idx) {
  let tray = getTray();
  tray.splice(idx,1);
  saveTray(tray);
  showToast('已移除');
  renderTrayPage();
}

// ========== BUDDY PAGE ==========
function renderBuddyPage() {
  const pref = getUserPref();
  const el = document.getElementById('buddyContent');
  let html = '';
  buddies.sort((a,b)=>b.match-a.match).forEach(b=>{
    html += `<div class="buddy-card">
      <div class="buddy-avatar">${b.avatar}</div>
      <div class="buddy-info">
        <div class="bi-name">${b.name}</div>
        <div class="bi-mbti">${b.mbti}</div>
        <div class="bi-common">共同口味：${b.commonTaste.join('、')}</div>
      </div>
      <div class="buddy-match">${b.match}%</div>
    </div>`;
  });
  el.innerHTML = html;
}

// ========== RADAR CHART ==========
function drawRadar(canvasId, tasteData) {
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2;
  const r = Math.min(w,h)/2 - 40;

  ctx.clearRect(0,0,w,h);

  const labels = ['辣','咸','甜','酸','油','鲜'];
  const keys = ['spicy','salty','sweet','sour','oily','umami'];
  const n = labels.length;
  const angleStep = (Math.PI*2)/n;

  // Draw grid
  for(let level=1; level<=5; level++) {
    ctx.beginPath();
    for(let i=0; i<=n; i++) {
      const angle = -Math.PI/2 + i*angleStep;
      const lr = r * level/5;
      const x = cx + lr * Math.cos(angle);
      const y = cy + lr * Math.sin(angle);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#FFE0E0';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Draw axes
  for(let i=0; i<n; i++) {
    const angle = -Math.PI/2 + i*angleStep;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+r*Math.cos(angle), cy+r*Math.sin(angle));
    ctx.strokeStyle = '#FFE0E0';
    ctx.stroke();
  }

  // Draw labels
  ctx.fillStyle = '#888';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(let i=0; i<n; i++) {
    const angle = -Math.PI/2 + i*angleStep;
    const lx = cx + (r+20)*Math.cos(angle);
    const ly = cy + (r+20)*Math.sin(angle);
    ctx.fillText(labels[i], lx, ly);
  }

  // Draw data
  ctx.beginPath();
  for(let i=0; i<=n; i++) {
    const idx = i % n;
    const angle = -Math.PI/2 + idx*angleStep;
    const val = (tasteData[keys[idx]]||0) / 5;
    const x = cx + r*val*Math.cos(angle);
    const y = cy + r*val*Math.sin(angle);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,107,107,0.25)';
  ctx.fill();
  ctx.strokeStyle = '#FF6B6B';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw dots
  for(let i=0; i<n; i++) {
    const angle = -Math.PI/2 + i*angleStep;
    const val = (tasteData[keys[i]]||0) / 5;
    const x = cx + r*val*Math.cos(angle);
    const y = cy + r*val*Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle = '#FF6B6B';
    ctx.fill();
  }
}

// ========== INIT ==========
function init() {
  renderFilterBar();
  renderCanteenScroll();
  renderDishList();
  renderProfilePage();
  renderPrefPage();
  renderFavPage();
  renderBuddyPage();
  renderTrayPage();
}

// Override openSubPage for specific pages to re-render
const _origOpenSubPage = openSubPage;
openSubPage = function(pageId, title) {
  _origOpenSubPage(pageId, title);
  if(pageId==='prefPage') { renderPrefPage(); }
  if(pageId==='favPage') { renderFavPage(); }
  if(pageId==='buddyPage') { renderBuddyPage(); }
  if(pageId==='trayPage') { renderTrayPage(); }
};

init();
</script>
