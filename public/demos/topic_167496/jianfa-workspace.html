/* ===== Particle (bioluminescent stardust) ===== */
function Pt(x,y,vx,vy,r,col){
  this.x=x;this.y=y;this.vx=vx;this.vy=vy;
  this.r=r;this.br=r;
  this.life=1;this.decay=Math.random()*0.003+0.001;
  this.col=col;this.fr=0.995;
  this.wb=Math.random()*6.28;this.ws=Math.random()*0.008+0.002; // slower sway
  this.tw=Math.random()*6.28;this.tws=Math.random()*0.03+0.008;
}
Pt.prototype.tick=function(){
  this.vx*=this.fr;this.vy*=this.fr;
  this.vy+=0.001; // very gentle upward drift (like underwater)
  this.wb+=this.ws;this.tw+=this.tws;
  this.x+=this.vx+Math.sin(this.wb)*0.04; // reduced sway amplitude
  this.y+=this.vy+Math.cos(this.wb*0.6)*0.03;
  this.life-=this.decay;
  this.r=Math.max(0,this.br*easeOut(this.life));
};
Pt.prototype.draw=function(){
  if(this.life<=0)return;
  var a=this.life;
  var tw=0.6+0.4*Math.sin(this.tw);
  // Large soft glow
  var g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*5);
  g.addColorStop(0,rgba(this.col,a*0.18*tw));
  g.addColorStop(0.3,rgba(this.col,a*0.05*tw));
  g.addColorStop(1,rgba(this.col,0));
  ctx.beginPath();ctx.arc(this.x,this.y,this.r*5,0,6.2832);
  ctx.fillStyle=g;ctx.fill();
  // Core
  ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,6.2832);
  ctx.fillStyle=rgba(this.col,a*0.65*tw);ctx.fill();
  // Bioluminescent center — warm highlight
  if(this.r>0.8){
    ctx.beginPath();ctx.arc(this.x,this.y,this.r*0.35,0,6.2832);
    ctx.fillStyle=rgba(C.white,a*0.25*tw);ctx.fill();
  }
};

function spawnBurst(x,y,n,speed,sz,col){
  // Progressive deepening: fewer, gentler, longer-lived particles as session progresses
  var dN=Math.max(1,Math.floor(n*(1-deepenLevel*0.3)));
  var dSpeed=speed*(1-deepenLevel*0.2);
  // Golden angle distribution — predictable, even spread (minimizes prediction error)
  var goldenAngle=2.39996;
  for(var i=0;i<dN;i++){
    var a=i*goldenAngle; // deterministic, not random
    var s=Math.random()*dSpeed*0.5+dSpeed*0.5; // narrow random range (mostly predictable)
    var cc=col||C.teal; // fixed color per burst type
    var p=new Pt(x,y,Math.cos(a)*s,Math.sin(a)*s-0.2,Math.random()*sz*0.5+sz*0.5,cc);
    p.decay*=(1-deepenLevel*0.4);
    particles.push(p);
  }
}

function Rp(x,y,col,maxR){
  this.x=x;this.y=y;this.r=0;
  this.maxR=maxR||Math.min(W,H)*0.2;
  this.life=1;this.col=col||C.teal;
  this.rVel=0; // spring velocity for organic expansion
}
Rp.prototype.tick=function(){
  // Spring physics: r springs toward maxR (k=0.06, d=0.82 = dreamy/underwater feel)
  this.rVel+=(this.maxR-this.r)*0.06;
  this.rVel*=0.82; // heavy damping = slow, organic expansion
  this.r+=this.rVel;
  this.life-=0.004; // ~4s lifespan — dreamy, organic fade
};
Rp.prototype.draw=function(){
  if(this.life<=0)return;
  var a=this.life;
  // Outer ring — visible but calm
  ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,6.2832);
  ctx.strokeStyle=rgba(this.col,a*0.35);ctx.lineWidth=1.5;ctx.stroke();
  // Inner ring — subtle echo
  ctx.beginPath();ctx.arc(this.x,this.y,this.r*0.6,0,6.2832);
  ctx.strokeStyle=rgba(this.col,a*0.2);ctx.lineWidth=0.8;ctx.stroke();
  // Soft glow around ring
  var g=ctx.createRadialGradient(this.x,this.y,this.r*0.85,this.x,this.y,this.r*1.15);
  g.addColorStop(0,rgba(this.col,a*0.1));
  g.addColorStop(1,rgba(this.col,0));
  ctx.beginPath();ctx.arc(this.x,this.y,this.r*1.15,0,6.2832);
  ctx.fillStyle=g;ctx.fill();
};

/* ===== Click Flash — subtle, calm radial feedback (toned down) ===== */
function Fl(x,y,col){
  this.x=x;this.y=y;this.r=0;
  this.maxR=Math.min(W,H)*0.05; // smaller — doesn't dominate
  this.life=1;this.col=col||C.glow;
  this.rVel=0;
}
Fl.prototype.tick=function(){
  this.rVel+=(this.maxR-this.r)*0.12;
  this.rVel*=0.75;
  this.r+=this.rVel;
  this.life-=0.016; // ~1s lifespan — quick, subtle
};
Fl.prototype.draw=function(){
  if(this.life<=0)return;
  var a=this.life;
  // Very soft flash — barely visible, just a gentle hint
  var g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*1.5);
  g.addColorStop(0,rgba(this.col,a*0.15));
  g.addColorStop(0.5,rgba(this.col,a*0.05));
  g.addColorStop(1,rgba(this.col,0));
  ctx.beginPath();ctx.arc(this.x,this.y,this.r*1.5,0,6.2832);
  ctx.fillStyle=g;ctx.fill();
  // Faint ring
  ctx.beginPath();ctx.arc(this.x,this.y,this.r*0.8,0,6.2832);
  ctx.strokeStyle=rgba(this.col,a*0.2);ctx.lineWidth=1;ctx.stroke();
};

/* ===== Flow Dot — swipe trail (soft fascination, predictable, non-demanding) ===== */
/* Cognitive offloading principles:
   - Fixed color/size = zero prediction error (Friston Free Energy)
   - Soft luminance = soft fascination, not hard capture (Kaplan ART)
   - Gentle uniform drift = predictable motion path (Predictive Coding)
   - source-over blending = no brightness accumulation (Cognitive Load) */
function FD(x,y,px2,py2){
  this.x=x;this.y=y;this.px=px2||x;this.py=py2||y;
  this.life=1;this.decay=0.008; // ~2.1s — present but doesn't clutter
  this.col=C.glow; // FIXED color — no random variation (minimizes prediction error)
  this.r=2.8; // FIXED size — predictable
  this.driftY=-0.015; // gentle uniform upward drift (like warmth rising)
}
FD.prototype.tick=function(){
  this.life-=this.decay;
  this.y+=this.driftY; // predictable, uniform drift — no random oscillation
  this.x*=1.0; // stable x position
};
FD.prototype.draw=function(){
  if(this.life<=0)return;
  var a=this.life;
  // Connection trail — soft, diffuse line (primary visual, less fragmented)
  ctx.beginPath();ctx.moveTo(this.px,this.py);ctx.lineTo(this.x,this.y);
  ctx.strokeStyle=rgba(this.col,a*0.25);ctx.lineWidth=this.r*1.5;ctx.lineCap='round';ctx.stroke();
  // Core — small, soft glow (secondary, less prominent than trail line)
  ctx.beginPath();ctx.arc(this.x,this.y,this.r*0.7*a,0,6.2832);
  ctx.fillStyle=rgba(this.col,a*0.2);ctx.fill();
};

/* ===== Central Breath Orb ===== */
/* 4-2-6 breathing rhythm (Headspace research standard)
   12s cycle = 5 breaths/min — near HRV coherence resonance (~0.1Hz)
   Exhale longer than inhale → activates parasympathetic nervous system
   Lehrer & Gevirtz (2014): ~6 breaths/min maximizes vagal tone & HRV */
breathCX=W/2;breathCY=H/2;

function drawBreathOrb(){
  breathT+=dt/12000; // 12000ms = 12s per cycle, frame-rate independent
  var phase=breathT%1;
  var baseR=Math.min(W,H)*0.08;
  var maxR=Math.min(W,H)*0.22;
  var r;
  // 4-2-6 rhythm: inhale 4s, hold 2s, exhale 6s (no second hold)
  if(phase<0.333) r=baseR+(maxR-baseR)*easeIO(phase/0.333); // inhale 4s
  else if(phase<0.5) r=maxR; // hold 2s
  else r=maxR-(maxR-baseR)*easeIO((phase-0.5)/0.5); // exhale 6s

  breathCX+=(W/2-breathCX)*0.003;
  breathCY+=(H/2-breathCY)*0.003;
  var cx=breathCX,cy=breathCY;
  var isExhale=phase>=0.5;

  // Ambient glow — soft, diffuse
  var g0=ctx.createRadialGradient(cx,cy,0,cx,cy,r*4);
  g0.addColorStop(0,rgba(C.teal,isExhale?0.25:0.12));
  g0.addColorStop(0.5,rgba(C.teal,isExhale?0.08:0.04));
  g0.addColorStop(1,rgba(C.teal,0));
  ctx.beginPath();ctx.arc(cx,cy,r*4,0,6.2832);ctx.fillStyle=g0;ctx.fill();

  // Orb body — layered gradient, gentle luminosity
  var g1=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g1.addColorStop(0,rgba(C.glow,0.4));
  g1.addColorStop(0.3,rgba(C.teal,0.28));
  g1.addColorStop(0.7,rgba(C.mid,0.12));
  g1.addColorStop(1,rgba(C.abyss,0));
  ctx.beginPath();ctx.arc(cx,cy,r,0,6.2832);ctx.fillStyle=g1;ctx.fill();

  // Soft core — warm, not white-hot
  ctx.beginPath();ctx.arc(cx,cy,r*0.08,0,6.2832);
  ctx.fillStyle=rgba(C.white,0.6);ctx.fill();

  // Outer ring — subtle, elegant
  ctx.beginPath();ctx.arc(cx,cy,r,0,6.2832);
  ctx.strokeStyle=rgba(C.glow,0.3);ctx.lineWidth=1.5;ctx.stroke();

  // Inner ring
  ctx.beginPath();ctx.arc(cx,cy,r*0.7,0,6.2832);
  ctx.strokeStyle=rgba(C.teal,0.15);ctx.lineWidth=0.8;ctx.stroke();

  // Exhale: emit bioluminescent particles (more abundant as session deepens)
  if(isExhale&&Math.random()<0.06*(1+deepenLevel*0.5)){
    var a=Math.random()*6.2832;
    var p=new Pt(cx+Math.cos(a)*r,cy+Math.sin(a)*r,Math.cos(a)*0.3,Math.sin(a)*0.3-0.1,Math.random()*0.6+0.15,C.teal);
    p.decay=0.006;p.fr=0.996;
    particles.push(p);
  }
}

/* ===== Floating Guide Orbs (attracted to pointer) ===== */
var guides=[];
function initGuides(){
  guides=[];
  for(var i=0;i<3;i++){
    guides.push({
      x:W*(0.2+i*0.3),y:H*(0.3+Math.random()*0.4),
      tx:W*(0.2+i*0.3),ty:H*(0.3+Math.random()*0.4),
      baseR:Math.min(W,H)*(0.012+Math.random()*0.008),
      maxR:Math.min(W,H)*(0.025+Math.random()*0.012),
      phase:Math.random()*6.28,
      speed:0.0002+Math.random()*0.0002,
      col:lerpC(C.mid,C.teal,0.3+Math.random()*0.4),
      moveTimer:Math.random()*500
    });
  }
}
initGuides();

function drawGuides(){
  // Guide orbs fade with deepening — progressive attentional narrowing
  var guideFade=clamp(1-deepenLevel*0.8,0.1,1);
  for(var i=0;i<guides.length;i++){
    var g=guides[i];
    g.phase+=g.speed;
    g.moveTimer--;
    if(g.moveTimer<=0){
      g.tx=W*(0.15+Math.random()*0.7);
      g.ty=H*(0.15+Math.random()*0.7);
      g.moveTimer=400+Math.random()*600;
    }
    g.x+=(g.tx-g.x)*0.002;
    g.y+=(g.ty-g.y)*0.002;
    var t=(Math.sin(g.phase)+1)*0.5;
    var r=lerp(g.baseR,g.maxR,easeIO(t));

    if(interacted){
      var dx=px-g.x,dy=py-g.y;
      var d=Math.sqrt(dx*dx+dy*dy)+1;
      if(d<250){
        var pull=Math.min(6,300/d);
        g.x+=dx/d*pull*0.015;
        g.y+=dy/d*pull*0.015;
      }
    }

    var gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,r*3.5);
    gr.addColorStop(0,rgba(g.col,0.03*guideFade));
    gr.addColorStop(1,rgba(g.col,0));
    ctx.beginPath();ctx.arc(g.x,g.y,r*3.5,0,6.2832);ctx.fillStyle=gr;ctx.fill();

    var gr2=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,r);
    gr2.addColorStop(0,rgba(g.col,0.06*guideFade));
    gr2.addColorStop(1,rgba(g.col,0.005));
    ctx.beginPath();ctx.arc(g.x,g.y,r,0,6.2832);ctx.fillStyle=gr2;ctx.fill();
  }
}

/* ===== Stillness Reward — prolonged stillness intensifies ambient glow ===== */
/* Based on mindfulness principle: rewarding non-action creates positive
   association with stillness, training the brain to find calm in doing nothing */
function drawStillnessGlow(){
  if(stillnessTimer<120)return; // 2s at 60fps — more deliberate stillness reward
  var intensity=clamp((stillnessTimer-120)/600,0,1); // 10s ramp to full
  var cx=W/2,cy=H/2;
  var r=Math.min(W,H)*0.4*(0.5+intensity*0.5);
  var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,rgba(C.glow,intensity*0.02)); // was 0.04
  g.addColorStop(0.5,rgba(C.teal,intensity*0.01)); // was 0.02
  g.addColorStop(1,rgba(C.teal,0));
  ctx.beginPath();ctx.arc(cx,cy,r,0,6.2832);ctx.fillStyle=g;ctx.fill();
}

/* ===== Bilateral Stimulation (EMDR-inspired) ===== */
/* Shapiro (1989): alternating left-right stimulation aids emotional processing.
   Here used subtly — barely visible glow that alternates sides every ~2s,
   creating a gentle, non-conscious bilateral visual cue. */
function drawBilateral(){
  var phase=Math.sin(bilateralT*Math.PI*2);
  var leftI=Math.max(0,phase);
  var rightI=Math.max(0,-phase);
  // Intensity scales with deepening — more present as session progresses
  var baseI=0.01+deepenLevel*0.012;

  if(leftI>0.01){
    var g=ctx.createRadialGradient(W*0.15,H*0.5,0,W*0.15,H*0.5,W*0.55);
    g.addColorStop(0,rgba(C.mid,leftI*baseI));
    g.addColorStop(0.5,rgba(C.mid,leftI*baseI*0.3));
    g.addColorStop(1,rgba(C.mid,0));
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  if(rightI>0.01){
    var g2=ctx.createRadialGradient(W*0.85,H*0.5,0,W*0.85,H*0.5,W*0.55);
    g2.addColorStop(0,rgba(C.mid,rightI*baseI));
    g2.addColorStop(0.5,rgba(C.mid,rightI*baseI*0.3));
    g2.addColorStop(1,rgba(C.mid,0));
    ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  }
}

/* ===== Pointer Glow — soft, non-demanding presence cue ===== */
function drawPointerGlow(){
  if(!isDown)return;
  var speed=Math.sqrt(pvx*pvx+pvy*pvy);
  var col=C.glow; // consistent color — no speed-based color shift (predictability)
  var rad=lerp(30,50,clamp(speed/10,0,1));
  var g=ctx.createRadialGradient(px,py,0,px,py,rad);
  g.addColorStop(0,rgba(col,0.04));
  g.addColorStop(0.5,rgba(col,0.015));
  g.addColorStop(1,rgba(col,0));
  ctx.beginPath();ctx.arc(px,py,rad,0,6.2832);ctx.fillStyle=g;ctx.fill();
}

/* ===== Intro — HTML overlay with JS-driven animation ===== */
var introEl=document.getElementById('intro');
var introTitleEl=introEl.querySelector('.title');
var introSubEl=introEl.querySelector('.subtitle');
var introHidden=false;
var introAnimStart=0;

function animateIntro(now){
  if(introHidden)return;
  if(introAnimStart===0)introAnimStart=now;
  var ms=now-introAnimStart;

  // Title: fade in + translateY (0 → 1500ms)
  var titleT=clamp(ms/1500,0,1);
  var titleE=easeExpoOut(titleT);
  introTitleEl.style.opacity=titleE;
  introTitleEl.style.transform='translateY('+(40*(1-titleE))+'px)';

  // Subtitle: starts at 800ms (800 → 1800ms)
  var subMs=ms-800;
  if(subMs>0){
    var subT=clamp(subMs/1000,0,1);
    var subE=easeExpoOut(subT);
    introSubEl.style.opacity=subE*0.7;
    introSubEl.style.transform='translateY('+(10*(1-subE))+'px)';
  }
  // NO auto-hide — stays visible until user interacts
  requestAnimationFrame(animateIntro);
}

// Start intro animation when fonts are loaded (or after 1s fallback)
function startIntro(){
  requestAnimationFrame(animateIntro);
}
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(startIntro);
}else{
  setTimeout(startIntro,500);
}

function hideIntro(){
  if(introHidden)return;
  introHidden=true;
  introEl.style.transition='opacity 2s cubic-bezier(0.16,1,0.3,1)';
  introEl.style.opacity='0';
  setTimeout(function(){introEl.style.display='none';},2000);
}

function drawIntro(now){
  return;
}

/* ===== Pointer Events ===== */
function getPos(e){
  if(e.clientX!==undefined&&e.clientX!==null)return{x:e.clientX,y:e.clientY};
  if(e.touches&&e.touches.length>0)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches&&e.changedTouches.length>0)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return{x:px,y:py};
}

function onDown(e){
  e.preventDefault();
  initAudio(); // unlock audio on first interaction
  if(!introHidden){hideIntro();}
  interacted=true;isDown=true;
  stillnessTimer=0;
  var pos=getPos(e);px=pos.x;py=pos.y;lpx=px;lpy=py;
  moveBuffer.length=0; // clear stale positions
  pvx=0;pvy=0;downTime=performance.now();holdX=px;holdY=py;
  // Subtle initial feedback — doesn't overpower swipe trail
  spawnBurst(px,py,3,0.4,0.6,C.teal);
  ripples.push(new Rp(px,py,C.mid,Math.min(W,H)*0.07));
  if(performance.now()-lastChimeTime>600){playChime();lastChimeTime=performance.now();}
}

function onMove(e){
  e.preventDefault();
  var pos=getPos(e);
  if(pos.x==null||pos.y==null||isNaN(pos.x)||isNaN(pos.y))return;
  // rAF-batched: just record position, process in frame loop
  // This eliminates per-event lag on fast mouse movement
  if(moveBuffer.length<200)moveBuffer.push({x:pos.x,y:pos.y});
  px=pos.x;py=pos.y;
}

// Process buffered pointer moves once per frame — smooth, dense trails
// without per-event overhead. Called from the render loop.
function processSwipe(){
  if(!isDown||moveBuffer.length===0)return;
  var prevX=lpx,prevY=lpy;
  for(var i=0;i<moveBuffer.length;i++){
    var p=moveBuffer[i];
    var dx=p.x-prevX,dy=p.y-prevY;
    var dist=Math.hypot(dx,dy);
    if(dist>0.5){
      stillnessTimer=0;
      // Dense flow dots between consecutive positions — continuous, diffuse trail
      var steps=Math.min(8,Math.max(2,Math.floor(dist/5)));
      for(var s=0;s<steps;s++){
        var t=s/steps;
        flowDots.push(new FD(
          lerp(prevX,p.x,t),lerp(prevY,p.y,t),
          s===0?prevX:lerp(prevX,p.x,(s-1)/steps),
          s===0?prevY:lerp(prevY,p.y,(s-1)/steps)
        ));
      }
      // Speed particles — only on fast swipes
      if(dist>12){
        spawnBurst(p.x,p.y,1,dist*0.02,0.5,C.glow);
      }
      // Breath orb gentle displacement — minimal, non-startling (Polyvagal safety)
      var bdx=p.x-breathCX,bdy=p.y-breathCY;
      var bd=Math.hypot(bdx,bdy)+1;
      if(bd<160){breathCX-=bdx/bd*0.15;breathCY-=bdy/bd*0.15;}
    }
    prevX=p.x;prevY=p.y;
  }
  // Update tracking for pointer glow speed
  var last=moveBuffer[moveBuffer.length-1];
  pvx=last.x-lpx;pvy=last.y-lpy;
  lpx=last.x;lpy=last.y;
  moveBuffer.length=0;
  // Cap arrays for performance
  if(flowDots.length>60)flowDots.splice(0,flowDots.length-60);
  if(particles.length>150)particles.splice(0,particles.length-150);
}

function onUp(e){
  e.preventDefault();
  var pos=getPos(e);
  if(pos.x!=null&&pos.y!=null&&!isNaN(pos.x)&&!isNaN(pos.y)){px=pos.x;py=pos.y;}
  processSwipe(); // flush any remaining buffered moves
  if(isDown){
    var holdDur=performance.now()-downTime;
    var movedDist=Math.hypot(px-holdX,py-holdY);
    if(movedDist<10){
      // Tap release — gentle, balanced with swipe trail
      var intensity=clamp(holdDur/400,0.5,1.4);
      spawnBurst(px,py,Math.floor(4*intensity),1.0*intensity,0.8,C.glow);
      ripples.push(new Rp(px,py,C.glow,Math.min(W,H)*0.09*intensity));
      flashes.push(new Fl(px,py,C.glow));
      playRelease();
    }else{
      // Swipe release — gentle trail end
      spawnBurst(px,py,4,0.6,0.6,C.glow);
      ripples.push(new Rp(px,py,C.glow,Math.min(W,H)*0.06));
      playRelease();
    }
  }
  isDown=false;pvx=0;pvy=0;
}

function onCancel(){isDown=false;pvx=0;pvy=0;}

if(window.PointerEvent){
  c.addEventListener('pointerdown',onDown);
  c.addEventListener('pointermove',onMove);
  c.addEventListener('pointerup',onUp);
  c.addEventListener('pointercancel',onCancel);
  c.addEventListener('pointerleave',function(e){if(isDown)onUp(e);});
  c.addEventListener('contextmenu',function(e){e.preventDefault();});
  c.style.touchAction='none';
}else{
  c.addEventListener('mousedown',onDown);
  c.addEventListener('mousemove',onMove);
  c.addEventListener('mouseup',onUp);
  c.addEventListener('mouseleave',function(e){if(isDown)onUp(e);});
  c.addEventListener('touchstart',onDown,{passive:false});
  c.addEventListener('touchmove',onMove,{passive:false});
  c.addEventListener('touchend',onUp,{passive:false});
  c.addEventListener('touchcancel',onCancel,{passive:false});
}

/* ===== Render Loop ===== */
// Detect reduced motion preference (accessibility — Headspace standard)
var prefersReducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame(now){
  dt=Math.min(now-lastFrame,50); // delta time in ms, capped
  lastFrame=now;

  // Start intro timer on first actual frame (not at script load)
  if(introStart===0)introStart=now;

  // Progressive deepening — 3 min ramp toward deeper calm state
  // Flow state (Csikszentmihalyi) + Attention Restoration Theory (Kaplan, 1989)
  sessionTime+=dt;
  deepenLevel=clamp(sessionTime/180000,0,1);

  // Audio deepening: gradually lower drone filter for warmer, deeper sound
  if(isAudioInit&&droneFilter){
    droneFilter.frequency.setTargetAtTime(800-deepenLevel*200,AC.currentTime,2);
  }

  // Bilateral stimulation phase (4s cycle = 2s per side)
  if(!prefersReducedMotion) bilateralT+=dt/8000; // 8s cycle = 4s per side

  // Stillness reward — counts time without interaction
  if(!isDown)stillnessTimer++;

  // Background base (opaque, source-over) — aurora base + bands
  ctx.globalCompositeOperation='source-over';
  drawAurora();

  // All luminous elements use ADDITIVE blending for true glow
  ctx.globalCompositeOperation='lighter';
  drawStars();
  if(!prefersReducedMotion) drawBilateral();  // skip bilateral if reduced motion
  drawStillnessGlow();
  drawGuides();
  drawBreathOrb();

  // Process buffered swipe moves — creates flow dots & particles for this frame
  processSwipe();

  // Ripples — source-over for clear ring visibility
  ctx.globalCompositeOperation='source-over';
  for(var s=ripples.length-1;s>=0;s--){
    ripples[s].tick();ripples[s].draw();
    if(ripples[s].life<=0)ripples.splice(s,1);
  }
  // Particles — lighter for luminous glow
  ctx.globalCompositeOperation='lighter';
  for(var i=particles.length-1;i>=0;i--){
    particles[i].tick();particles[i].draw();
    if(particles[i].life<=0)particles.splice(i,1);
  }
  // Flow dots — source-over: soft, non-accumulating (cognitive offloading)
  ctx.globalCompositeOperation='source-over';
  for(var j=flowDots.length-1;j>=0;j--){
    flowDots[j].tick();flowDots[j].draw();
    if(flowDots[j].life<=0)flowDots.splice(j,1);
  }
  // Click flashes — source-over for soft, calm appearance
  ctx.globalCompositeOperation='source-over';
  for(var f=flashes.length-1;f>=0;f--){
    flashes[f].tick();flashes[f].draw();
    if(flashes[f].life<=0)flashes.splice(f,1);
  }

  // Pointer glow
  drawPointerGlow();

  // Reset to normal blending for text overlay
  ctx.globalCompositeOperation='source-over';
  drawIntro(now);

  if(!isDown){pvx*=0.92;pvy*=0.92;}

  requestAnimationFrame(frame);
}

ctx.fillStyle='#1B2838';ctx.fillRect(0,0,W,H);
requestAnimationFrame(frame);

// Pause rendering when tab is hidden (saves battery on mobile)
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    // Will naturally slow down via rAF pause
  }
});

})();
</script>
