<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>银发反诈卫士 — 沉浸式反诈演练模拟器</title>
<style>
/* ===== 基础重置与设计变量 ===== */
:root {
  --wechat-green: #07c160;
  --wechat-green-dark: #06ad56;
  --wechat-green-light: #95ec69;
  --danger-red: #ef4444;
  --danger-red-dark: #dc2626;
  --warning-orange: #f59e0b;
  --warning-orange-light: #fef3c7;
  --safe-green: #10b981;
  --safe-green-light: #d1fae5;
  --bg-warm: #f5f4f0;
  --bg-card: #ffffff;
  --text-primary: #1a1a1a;
  --text-secondary: #666666;
  --text-light: #999999;
  --border-light: #ebebeb;
  --shadow-soft: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-card: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-pop: 0 8px 30px rgba(0,0,0,0.12);
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --guardian-blue: #3b82f6;
  --guardian-blue-dark: #2563eb;
  --guardian-blue-light: #dbeafe;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: var(--bg-warm);
  color: var(--text-primary);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== 页面切换容器 ===== */
.page { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
.page.active { display: flex; }

/* ===== 首页 ===== */
#home-page { overflow-y: auto; -webkit-overflow-scrolling: touch; }

.home-hero {
  background: linear-gradient(135deg, #07c160 0%, #06ad56 50%, #059654 100%);
  padding: 44px 24px 200px;
  color: white;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.home-hero::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}

.home-hero::after {
  content: '';
  position: absolute;
  bottom: -40px; left: -40px;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.06);
  border-radius: 50%;
}

.hero-icon { font-size: 56px; margin-bottom: 8px; position: relative; z-index: 1; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15)); }

.hero-title { font-size: 28px; font-weight: 800; letter-spacing: 1px; position: relative; z-index: 1; margin-bottom: 6px; }

.hero-subtitle { font-size: 15px; opacity: 0.9; position: relative; z-index: 1; line-height: 1.5; }

/* 免疫力卡片 */
.immunity-card {
  background: var(--bg-card);
  margin: -32px 16px 0;
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-card);
  position: relative;
  z-index: 2;
}

.immunity-label { font-size: 15px; color: var(--text-secondary); font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

.immunity-bar-wrap { background: #f0f0f0; border-radius: 20px; height: 14px; overflow: hidden; position: relative; }

.immunity-bar { height: 100%; border-radius: 20px; background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981); width: 0%; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); position: relative; }

.immunity-bar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shimmer 2s infinite; }

@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.immunity-stats { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; color: var(--text-light); }

.immunity-stats span strong { color: var(--text-primary); font-size: 20px; font-weight: 800; }

/* 场景选择区 */
.section-title { font-size: 19px; font-weight: 700; margin: 24px 20px 14px; display: flex; align-items: center; gap: 8px; }

.section-title .badge { font-size: 12px; background: var(--guardian-blue-light); color: var(--guardian-blue-dark); padding: 3px 10px; border-radius: 20px; font-weight: 600; }

.scenario-grid { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 24px; }

.scenario-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}

.scenario-card:active { transform: scale(0.97); }

.scenario-card.completed { border-left: 4px solid var(--safe-green); }
.scenario-card.failed { border-left: 4px solid var(--danger-red); }

.scenario-icon { width: 56px; height: 56px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0; }

.scenario-info { flex: 1; min-width: 0; }

.scenario-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }

.scenario-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.4; }

.scenario-status { position: absolute; top: 12px; right: 14px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }

.status-pending { background: #f3f4f6; color: var(--text-light); }
.status-pass { background: var(--safe-green-light); color: var(--safe-green); }
.status-fail { background: #fee2e2; color: var(--danger-red); }

.scenario-arrow { color: var(--text-light); font-size: 20px; }

/* 底部提示 */
.home-tips { padding: 8px 20px 32px; }

.tip-box { background: var(--guardian-blue-light); border-radius: var(--radius-md); padding: 16px; font-size: 14px; line-height: 1.6; color: #1e40af; }

.tip-box strong { color: var(--guardian-blue-dark); }

/* ===== 聊天页面 ===== */
#chat-page { background: #ededed; }

.chat-header {
  background: #f7f7f7;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border-light);
  position: relative;
  flex-shrink: 0;
}

.chat-back { font-size: 22px; color: var(--text-secondary); cursor: pointer; padding: 4px 8px; flex-shrink: 0; }

.chat-header-info { flex: 1; min-width: 0; }

.chat-header-name { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

.train-tag { font-size: 11px; background: var(--guardian-blue); color: white; padding: 2px 8px; border-radius: 10px; font-weight: 600; }

.chat-header-sub { font-size: 12px; color: var(--text-light); }

/* 风险计 */
.risk-meter-wrap { background: #f7f7f7; padding: 6px 16px 8px; border-bottom: 1px solid var(--border-light); flex-shrink: 0; }

.risk-meter-label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 4px; }

.risk-meter-label .risk-level { font-weight: 700; }

.risk-meter-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; position: relative; }

.risk-meter-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease, background 0.5s ease; width: 30%; background: var(--warning-orange); }

/* 聊天区域 */
.chat-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }

.message-row { display: flex; width: 100%; animation: msgIn 0.3s ease; }

@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.message-row.scammer { justify-content: flex-start; }
.message-row.user { justify-content: flex-end; }
.message-row.system { justify-content: center; }

.avatar { width: 42px; height: 42px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 24px; background: #fff; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.message-row.user .avatar { background: #a9ea7a; margin-left: 8px; }
.message-row.scammer .avatar { margin-right: 8px; }

.bubble { max-width: 72%; padding: 11px 14px; border-radius: 10px; font-size: 18px; line-height: 1.55; word-wrap: break-word; position: relative; }
.message-row.scammer .bubble { background: #fff; border: 1px solid #ebebeb; }
.message-row.user .bubble { background: var(--wechat-green-light); border: 1px solid #8bd361; }

.system-bubble { background: rgba(0,0,0,0.06); padding: 6px 14px; border-radius: 6px; font-size: 13px; color: var(--text-secondary); max-width: 80%; text-align: center; }

/* 诈骗信号提示 */
.fraud-signal {
  background: linear-gradient(135deg, #fff7ed, #fef3c7);
  border: 1px solid #fcd34d;
  border-left: 4px solid var(--warning-orange);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin: 4px 0;
  font-size: 14px;
  line-height: 1.5;
  animation: signalIn 0.4s ease;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

@keyframes signalIn { from { opacity: 0; transform: scale(0.9) translateX(-10px); } to { opacity: 1; transform: scale(1) translateX(0); } }

.fraud-signal-icon { font-size: 20px; flex-shrink: 0; }

.fraud-signal-text strong { color: var(--warning-orange); display: block; margin-bottom: 2px; font-size: 15px; }

.fraud-signal-text span { color: var(--text-secondary); font-size: 13px; }

/* 正在输入提示 */
.typing-bubble { display: flex; gap: 4px; padding: 14px 16px; }
.typing-bubble span { width: 8px; height: 8px; background: #ccc; border-radius: 50%; animation: typingDot 1.4s infinite; }
.typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingDot { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }

/* 底部交互区 */
.chat-footer { background: #f7f7f7; border-top: 1px solid var(--border-light); flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }

.quick-replies { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 6px; }

.quick-reply {
  background: white;
  border: 1.5px solid var(--wechat-green);
  color: var(--wechat-green-dark);
  padding: 9px 16px;
  border-radius: 22px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.quick-reply:active { background: var(--wechat-green); color: white; transform: scale(0.95); }

.input-row { display: flex; gap: 8px; padding: 6px 14px 12px; }

#user-input { flex: 1; padding: 10px 14px; font-size: 17px; border: 1.5px solid #ddd; border-radius: 8px; outline: none; background: white; }

#user-input:focus { border-color: var(--wechat-green); }

#send-btn { padding: 0 18px; background: var(--wechat-green); color: white; border: none; border-radius: 8px; font-size: 17px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
#send-btn:active { background: var(--wechat-green-dark); }
#send-btn:disabled { background: #a0cfae; }

/* ===== 报告页面 ===== */
#report-page { overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-warm); }

.report-header { padding: 36px 24px 20px; text-align: center; }

.report-score-circle {
  width: 120px; height: 120px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
}

.report-score-circle.pass { background: conic-gradient(var(--safe-green) 0deg, var(--safe-green) 300deg, #e5e7eb 300deg); }
.report-score-circle.fail { background: conic-gradient(var(--danger-red) 0deg, var(--danger-red) 250deg, #e5e7eb 250deg); }

.report-score-circle::before { content: ''; position: absolute; inset: 8px; background: white; border-radius: 50%; }

.report-score-num { font-size: 42px; font-weight: 800; position: relative; z-index: 1; }
.report-score-label { font-size: 13px; color: var(--text-light); position: relative; z-index: 1; }

.report-result-text { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
.report-result-text.pass { color: var(--safe-green); }
.report-result-text.fail { color: var(--danger-red); }

.report-scene-name { font-size: 15px; color: var(--text-secondary); }

.report-body { padding: 0 20px 32px; }

.report-section { background: white; border-radius: var(--radius-lg); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow-soft); }

.report-section-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

.report-scam-type { font-size: 15px; line-height: 1.6; color: var(--text-secondary); }
.report-scam-type strong { color: var(--text-primary); }

.report-signals { display: flex; flex-direction: column; gap: 10px; }

.report-signal-item { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; }

.report-signal-item .check { font-size: 18px; flex-shrink: 0; }

.report-signal-item .signal-content strong { color: var(--warning-orange); display: block; }

.report-signal-item .signal-content span { color: var(--text-secondary); }

.report-tips { display: flex; flex-direction: column; gap: 8px; }

.report-tip { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.6; color: var(--text-secondary); }

.report-tip .tip-num { width: 24px; height: 24px; border-radius: 50%; background: var(--guardian-blue-light); color: var(--guardian-blue-dark); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }

.report-tip strong { color: var(--text-primary); }

.report-actions { display: flex; flex-direction: column; gap: 10px; padding: 0 20px 36px; }

.report-btn { padding: 14px; border-radius: var(--radius-md); font-size: 17px; font-weight: 700; border: none; cursor: pointer; text-align: center; transition: transform 0.15s; }
.report-btn:active { transform: scale(0.97); }
.report-btn-primary { background: var(--wechat-green); color: white; }
.report-btn-secondary { background: white; color: var(--text-primary); border: 1.5px solid var(--border-light); }
.report-btn-share { background: var(--guardian-blue); color: white; }

/* Toast 提示 */
#toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 10px; font-size: 16px; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s; max-width: 80%; text-align: center; }
#toast.show { opacity: 1; }

/* 滚动条美化 */
.chat-container::-webkit-scrollbar, #home-page::-webkit-scrollbar, #report-page::-webkit-scrollbar { width: 4px; }
.chat-container::-webkit-scrollbar-thumb, #home-page::-webkit-scrollbar-thumb, #report-page::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }
</style>
</head>
<body>

<!-- ===== 首页 ===== -->
<div id="home-page" class="page active">
  <div class="home-hero">
    <div class="hero-icon">🛡️</div>
    <div class="hero-title">银发反诈卫士</div>
    <div class="hero-subtitle">沉浸式反诈演练模拟器 · 在安全环境中体验骗子套路</div>
  </div>

  <div class="immunity-card">
    <div class="immunity-label">🧬 我的反诈免疫力</div>
    <div class="immunity-bar-wrap">
      <div class="immunity-bar" id="immunity-bar"></div>
    </div>
    <div class="immunity-stats">
      <span>已挑战 <strong id="challenged-count">0</strong> / 5</span>
      <span>通过 <strong id="passed-count" style="color:var(--safe-green)">0</strong></span>
      <span>免疫力 <strong id="immunity-score" style="color:var(--wechat-green)">0</strong>%</span>

  </div>

  <div class="section-title">
    📋 选择诈骗场景演练 <span class="badge">5大高发骗局</span>
  </div>

  <div class="scenario-grid" id="scenario-grid"></div>

  <div class="home-tips">
    <div class="tip-box">
      💡 <strong>使用说明：</strong>选择一个场景进入模拟聊天，系统将扮演骗子与你对话。注意观察对方的话术套路，练习在真实场景中如何应对。你的每一次回复都会影响<strong>风险值</strong>变化，保持警惕！
    </div>
  </div>
</div>

<!-- ===== 聊天页面 ===== -->
<div id="chat-page" class="page">
  <div class="chat-header">
    <div class="chat-back" onclick="goHome()">‹</div>
    <div class="avatar" id="chat-avatar" style="width:38px;height:38px;font-size:22px;"></div>
    <div class="chat-header-info">
      <div class="chat-header-name">
        <span id="chat-name"></span>
        <span class="train-tag">模拟训练</span>
      </div>
      <div class="chat-header-sub">⚠️ 本场景为模拟演练，非真实对话</div>
    </div>
  </div>

  <div class="risk-meter-wrap">
    <div class="risk-meter-label">
      <span>🛡️ 当前风险值</span>
      <span class="risk-level" id="risk-level-text">中等</span>
    </div>
    <div class="risk-meter-bar">
      <div class="risk-meter-fill" id="risk-fill"></div>
    </div>
  </div>

  <div class="chat-container" id="chat-container"></div>

  <div class="chat-footer">
    <div class="quick-replies" id="quick-replies"></div>
    <div class="input-row">
      <input type="text" id="user-input" placeholder="输入你的回复..." autocomplete="off">
      <button id="send-btn">发送</button>
    </div>
  </div>
</div>

<!-- ===== 报告页面 ===== -->
<div id="report-page" class="page">
  <div class="report-header">
    <div class="report-score-circle" id="score-circle">
      <div class="report-score-num" id="report-score-num">0</div>
      <div class="report-score-label">得分</div>
    </div>
    <div class="report-result-text" id="report-result-text"></div>
    <div class="report-scene-name" id="report-scene-name"></div>
  </div>
  <div class="report-body" id="report-body"></div>
  <div class="report-actions">
    <button class="report-btn report-btn-primary" onclick="retryScenario()">重新挑战</button>
    <button class="report-btn report-btn-secondary" onclick="goHome()">返回首页</button>
    <button class="report-btn report-btn-share" onclick="shareResult()">📤 分享给亲友</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

        signal: { title: '🚨 转账到私人账户购买"理财"', desc: '正规理财通过银行或券商账户购买，要求转到私人账户的一律是诈骗。资金一旦转出无法追回。' },
        quickReplies: ['好，我转1万过去', '私人账户？我不转', '我要跟家人商量'],
        responses: { trust: null, skeptical: null, refuse: null },
        isFinal: true
      }
    ]
  }
];

// ===== 用户意图关键词分类 =====
const INTENT_KEYWORDS = {
  trust: ['好', '行', '可以', '没问题', '怎么买', '多少钱', '银行卡', '验证码', '转', '交钱', '垫付', '投资', '试试', '真的吗', '怎么办', '配合', '马上', '现在', '去银行', '发给你', '你说怎么做', '好啊', '行吧', '好吧', '怎么转', '账号发来'],
  skeptical: ['不信', '骗', '假', '骗子', '不可能', '真的假的', '骗人的吧', '哪有', '不对', '可疑', '怀疑', '核实', '证件', '证明', '资质', '牌照', '安全账户', '户名', '声音不像', '不对劲', '怎么可能', '不信你', '你是谁', '哪个医院', '哪个公司', '证据'],
  refuse: ['不要', '不行', '没钱', '不买', '不转', '拒绝', '不需要', '算了', '别烦', '挂了', '再见', '没空', '不方便', '不感兴趣', '不干', '不投', '不用了', '别联系', '不做了', '风险太大', '太贵'],
  verify: ['问问', '确认', '核实', '查查', '问问儿子', '问问女儿', '家人', '亲戚', '朋友', '问问银行', '派出所', '110', '报警', '打电话', '跟家人商量', '想想', '再想想', '考虑', '商量']
};

// ===== 状态管理 =====
let currentScenario = null;
let currentStep = 0;
let riskScore = 30;
let userIntents = [];
let detectedSignals = [];
let scenarioResults = {}; // { scenarioId: { passed: bool, score: int } }

// ===== 初始化首页 =====
function initHome() {
  const grid = document.getElementById('scenario-grid');
  grid.innerHTML = '';

  SCENARIOS.forEach(s => {
    const result = scenarioResults[s.id];
    let statusClass = 'status-pending';
    let statusText = '未挑战';

    if (result) {
      if (result.passed) { statusClass = 'status-pass'; statusText = '✓ 已通过'; }
      else { statusClass = 'status-fail'; statusText = '需加强'; }
    }

    const card = document.createElement('div');
    card.className = 'scenario-card' + (result ? (result.passed ? ' completed' : ' failed') : '');
    card.innerHTML = `
      <div class="scenario-icon" style="background:${s.iconBg}">${s.icon}</div>
      <div class="scenario-info">
        <div class="scenario-name">${s.name}</div>
        <div class="scenario-desc">${s.desc}</div>
      </div>
      <div class="scenario-status ${statusClass}">${statusText}</div>
    `;
    card.onclick = () => startScenario(s.id);
    grid.appendChild(card);
  });

  updateImmunity();
}

function updateImmunity() {
  const challenged = Object.keys(scenarioResults).length;
  const passed = Object.values(scenarioResults).filter(r => r.passed).length;
  const score = challenged === 0 ? 0 : Math.round((passed / SCENARIOS.length) * 100);

  document.getElementById('challenged-count').textContent = challenged;
  document.getElementById('passed-count').textContent = passed;
  document.getElementById('immunity-score').textContent = score;
  document.getElementById('immunity-bar').style.width = score + '%';
}

// ===== 开始场景 =====
function startScenario(id) {
  currentScenario = SCENARIOS.find(s => s.id === id);
  if (!currentScenario) return;

  currentStep = 0;
  riskScore = 30;
  userIntents = [];
  detectedSignals = [];

  // 设置聊天界面
  document.getElementById('chat-name').textContent = currentScenario.scammerName;
  document.getElementById('chat-avatar').textContent = currentScenario.scammerAvatar;

  // 清空聊天
  const container = document.getElementById('chat-container');
  container.innerHTML = '';

  // 切换页面
  switchPage('chat-page');

  // 发送第一条消息
  setTimeout(() => {
    sendScammerMessage(0);
  }, 600);
}

function sendScammerMessage(stepIndex) {
  const step = currentScenario.script[stepIndex];
  if (!step) return;

  // 设置动态文本（第2步及之后的文本来自上一步的回复）
  if (step.text === null && stepIndex > 0) {
    const prevStep = currentScenario.script[stepIndex - 1];
    const lastIntent = userIntents[userIntents.length - 1] || 'trust';
    step.text = prevStep.responses[lastIntent] || prevStep.responses.trust;
  }

  // 显示正在输入
  showTyping();

  setTimeout(() => {
    hideTyping();

    // 添加骗子消息
    appendMessage(step.text, 'scammer');

    // 显示诈骗信号
    if (step.signal) {
      setTimeout(() => {
        appendFraudSignal(step.signal);
        detectedSignals.push(step.signal);
      }, 500);
    }

    // 显示快捷回复
    if (step.quickReplies) {
      setTimeout(() => {
        showQuickReplies(step.quickReplies);
      }, 800);
    }

    // 如果是最终步骤，准备判断结局
    if (step.isFinal) {
      // 等待用户回复后判断
    }

    // 启用输入
    document.getElementById('user-input').disabled = false;
    document.getElementById('send-btn').disabled = false;
  }, 1200 + Math.random() * 600);
}

function showTyping() {
  const container = document.getElementById('chat-container');
  const typing = document.createElement('div');
  typing.className = 'message-row scammer';
  typing.id = 'typing-row';
  typing.innerHTML = `
    <div class="avatar">${currentScenario.scammerAvatar}</div>
    <div class="bubble"><div class="typing-bubble"><span></span><span></span><span></span></div></div>
  `;
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const typing = document.getElementById('typing-row');
  if (typing) typing.remove();
}

function appendMessage(text, sender) {
  const container = document.getElementById('chat-container');
  const row = document.createElement('div');
  row.className = `message-row ${sender}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = sender === 'scammer' ? currentScenario.scammerAvatar : currentScenario.userAvatar;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  if (sender === 'user') {
    row.appendChild(bubble);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(bubble);
  }

  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

function appendFraudSignal(signal) {
  const container = document.getElementById('chat-container');
  const div = document.createElement('div');
  div.className = 'fraud-signal';
  div.innerHTML = `
    <div class="fraud-signal-icon">🚨</div>
    <div class="fraud-signal-text">
      <strong>${signal.title}</strong>
      <span>${signal.desc}</span>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showQuickReplies(replies) {
  const container = document.getElementById('quick-replies');
  container.innerHTML = '';
  replies.forEach(reply => {
    const btn = document.createElement('button');
    btn.className = 'quick-reply';
    btn.textContent = reply;
    btn.onclick = () => {
      handleUserInput(reply);
    };
    container.appendChild(btn);
  });
}

function hideQuickReplies() {
  document.getElementById('quick-replies').innerHTML = '';
}

// ===== 处理用户输入 =====
function handleUserInput(text) {
  text = text.trim();
  if (!text) return;

  // 添加用户消息
  appendMessage(text, 'user');

  // 清空输入和快捷回复
  document.getElementById('user-input').value = '';
  hideQuickReplies();
  document.getElementById('user-input').disabled = true;
  document.getElementById('send-btn').disabled = true;

  // 分析用户意图
  const intent = analyzeIntent(text);
  userIntents.push(intent);

  // 更新风险值
  updateRiskScore(intent);

  const currentScriptStep = currentScenario.script[currentStep];

  // 如果是最终步骤，判断结局
  if (currentScriptStep.isFinal) {
    setTimeout(() => {
      const passed = intent !== 'trust';
      showReport(passed);
    }, 800);
    return;
  }

  // 进入下一步
  currentStep++;
  setTimeout(() => {
    sendScammerMessage(currentStep);
  }, 800);
}

function analyzeIntent(text) {
  const lowerText = text.toLowerCase();

  // 按优先级检测：先检测验证类（因为可能包含"不"等字）
  for (const keyword of INTENT_KEYWORDS.verify) {
    if (lowerText.includes(keyword)) return 'verify';
  }
  for (const keyword of INTENT_KEYWORDS.skeptical) {
    if (lowerText.includes(keyword)) return 'skeptical';
  }
  for (const keyword of INTENT_KEYWORDS.refuse) {
    if (lowerText.includes(keyword)) return 'refuse';
  }
  for (const keyword of INTENT_KEYWORDS.trust) {
    if (lowerText.includes(keyword)) return 'trust';
  }

  // 默认归类为信任（因为老人倾向于配合）
  return 'trust';
}

function updateRiskScore(intent) {
  switch (intent) {
    case 'trust':
      riskScore = Math.min(100, riskScore + 25);
      break;
    case 'verify':
      riskScore = Math.max(0, riskScore - 15);
      break;
    case 'skeptical':
      riskScore = Math.max(0, riskScore - 20);
      break;
    case 'refuse':
      riskScore = Math.max(0, riskScore - 30);
      break;
  }

  // 更新UI
  const fill = document.getElementById('risk-fill');
  const levelText = document.getElementById('risk-level-text');

  fill.style.width = riskScore + '%';

  if (riskScore >= 70) {
    fill.style.background = 'var(--danger-red)';
    levelText.textContent = '高危 🔴';
    levelText.style.color = 'var(--danger-red)';
  } else if (riskScore >= 40) {
    fill.style.background = 'var(--warning-orange)';
    levelText.textContent = '中等 🟡';
    levelText.style.color = 'var(--warning-orange)';
  } else {
    fill.style.background = 'var(--safe-green)';
    levelText.textContent = '安全 🟢';
    levelText.style.color = 'var(--safe-green)';
  }
}

// ===== 报告 =====
function showReport(passed) {
  const score = passed ? Math.max(60, 100 - riskScore - detectedSignals.length * 3) : Math.max(10, 100 - riskScore);

  scenarioResults[currentScenario.id] = { passed, score };

  // 设置分数圆环
  const circle = document.getElementById('score-circle');
  circle.className = 'report-score-circle ' + (passed ? 'pass' : 'fail');
  circle.style.background = passed
    ? `conic-gradient(var(--safe-green) 0deg, var(--safe-green) ${score * 3.6}deg, #e5e7eb ${score * 3.6}deg)`
    : `conic-gradient(var(--danger-red) 0deg, var(--danger-red) ${score * 3.6}deg, #e5e7eb ${score * 3.6}deg)`;
  document.getElementById('report-score-num').textContent = score;

  // 结果文字
  const resultText = document.getElementById('report-result-text');
  resultText.className = 'report-result-text ' + (passed ? 'pass' : 'fail');
  resultText.textContent = passed ? '✅ 恭喜！成功识破骗局' : '⚠️ 不幸中招！请加强防范';

  document.getElementById('report-scene-name').textContent = currentScenario.name;

  // 报告正文
  const body = document.getElementById('report-body');
  body.innerHTML = `
    <div class="report-section">
      <div class="report-section-title">📋 骗局类型解析</div>
      <div class="report-scam-type">
        <strong>${currentScenario.scamType}</strong><br><br>
        ${currentScenario.scamDesc}
      </div>
    </div>
    <div class="report-section">
      <div class="report-section-title">🚨 诈骗信号回顾</div>
      <div class="report-signals">
        ${detectedSignals.map(s => `
          <div class="report-signal-item">
            <div class="check">✓</div>
            <div class="signal-content">
              <strong>${s.title}</strong>
              <span>${s.desc}</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="report-section">
      <div class="report-section-title">💡 防骗要点</div>
      <div class="report-tips">
        ${currentScenario.tips.map((tip, i) => `
          <div class="report-tip">
            <div class="tip-num">${i + 1}</div>
            <div>${tip}</div>
          </div>
        `).join('')}
      </div>
    </div>
    ${passed ? `
      <div class="report-section" style="background:var(--safe-green-light);border:none;">
        <div style="text-align:center;font-size:16px;color:var(--safe-green);font-weight:700;line-height:1.6;">
          🎉 太棒了！<br>您的反诈意识很强，<br>成功守住了钱袋子！<br><br>把这份经验分享给更多老伙计吧！
        </div>
      </div>
    ` : `
      <div class="report-section" style="background:#fef2f2;border:none;">
        <div style="text-align:center;font-size:16px;color:var(--danger-red);font-weight:700;line-height:1.6;">
          ⚠️ 别灰心！<br>练习就是为了避免真实被骗。<br><br>记住核心口诀：<br>不听、不信、不转账！<br>有疑问随时拨打 110 或 96110
        </div>
      </div>
    `}
  `;

  switchPage('report-page');
}

// ===== 页面切换 =====
function switchPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function goHome() {
  initHome();
  switchPage('home-page');
}

function retryScenario() {
  if (currentScenario) {
    startScenario(currentScenario.id);
  }
}

function shareResult() {
  showToast('💡 提示：截图本页面分享给亲友，或转发本Demo让更多老人练习！');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ===== 事件绑定 =====
document.getElementById('send-btn').addEventListener('click', () => {
  const input = document.getElementById('user-input');
  handleUserInput(input.value);
});

document.getElementById('user-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    handleUserInput(e.target.value);
  }
});

// ===== 启动 =====
initHome();
</script>
</body>
</html>
