<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>万物独白</title>
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --line: rgba(17,17,17,0.16);
    --line-strong: rgba(17,17,17,0.35);
    --ghost: rgba(17,17,17,0.4);
    --mood-color:#6a7a7a;
    --ease-quint: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out-back: cubic-bezier(0.68, -0.35, 0.27, 1.35);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; color:inherit; }

  /* ---------- keyframes ---------- */
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(30px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeOutDown{
    from{ opacity:1; transform:translateY(0); }
    to{ opacity:0; transform:translateY(-20px); }
  }
  @keyframes gentleShake{
    0%{ transform:rotate(0deg); }
    25%{ transform:rotate(-1deg); }
    50%{ transform:rotate(1deg); }
    75%{ transform:rotate(-1deg); }
    100%{ transform:rotate(0deg); }
  }
  @keyframes gradientFlow{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  @keyframes breathing{
    0%{ transform:translateZ(0) scale(1); }
    47%{ transform:translateZ(0) scale(1.15); }
    65%{ transform:translateZ(0) scale(1.15); }
    100%{ transform:translateZ(0) scale(1); }
  }
  @keyframes shrinkAway{
    from{ transform:scale(1); opacity:1; }
    to{ transform:scale(0); opacity:0; }
  }
  @keyframes softBreath{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.02); }
  }
  @keyframes floatUp{
    from{ transform:translateY(0); }
    to{ transform:translateY(-6px); }
  }
  @keyframes dotPulse{
    0%,100%{ opacity:0.3; }
    50%{ opacity:1; }
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .fade-in-up{ animation: fadeInUp 0.8s var(--ease-quint) both; }
  .fade-out-down{ animation: fadeOutDown 0.5s ease both; }
  .stagger-1{ animation-delay:0.1s; }
  .stagger-2{ animation-delay:0.3s; }
  .stagger-3{ animation-delay:0.5s; }

  /* ---------- layout shell ---------- */
  .screen{
    position:fixed; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:var(--paper);
  }
  .screen.active{ display:flex; }

  /* ---------- HOME ---------- */
  #screen-home .upload-circle{
    width:160px; height:160px;
    border-radius:50%;
    border:1.5px dashed var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    opacity:0.4;
    cursor:pointer;
    transition:opacity 0.4s ease, border-color 0.4s ease;
    position:relative;
    overflow:hidden;
    animation: softBreath 4s ease-in-out infinite;
    will-change: transform, opacity;
  }
  #screen-home .upload-circle:hover,
  #screen-home .upload-circle.dragover{ opacity:1; }
  #screen-home .upload-circle img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  #screen-home .upload-icon{ width:32px; height:32px; stroke:var(--ink); }
  #screen-home .upload-hint{
    margin-top:18px; font-size:14px; letter-spacing:0.05em; color:var(--ghost);
    text-align:center;
  }
  #screen-home input[type=file]{ display:none; }

  .home-bottom{
    position:fixed; bottom:36px; left:0; right:0;
    display:flex; align-items:center; justify-content:center;
  }
  .mic-btn{
    width:36px; height:36px; border-radius:50%;
    border:1.2px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .mic-btn:active{ transform:scale(0.9); }
  .mic-btn.recording{ background:var(--ink); }
  .mic-btn.recording svg{ stroke:#fff; }
  .mic-btn svg{ width:16px; height:16px; stroke:var(--ink); }

  .keyboard-btn{
    position:fixed; left:24px; bottom:40px;
    width:24px; height:24px; opacity:0.35;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.2s ease;
  }
  .keyboard-btn:hover{ opacity:0.8; }
  .keyboard-btn svg{ width:18px; height:18px; stroke:var(--ink); }

  .end-btn{
    position:fixed; right:24px; bottom:40px;
    display:flex; align-items:center; gap:6px;
    opacity:0.35; font-size:12px; letter-spacing:0.05em;
    transition:opacity 0.2s ease;
  }
  .end-btn:hover{ opacity:0.9; }
  .end-btn .dot{ width:8px; height:8px; border-radius:50%; background:var(--ink); }

  .fullscreen-cover{
    position:fixed; inset:0; z-index:50;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    pointer-events:none;
  }
  .fullscreen-cover img{
    border-radius:50%;
    object-fit:cover;
    width:160px; height:160px;
    transition: all 1s var(--ease-quint);
  }
  .fullscreen-cover.zoom{ opacity:1; }
  .fullscreen-cover.zoom img{ width:100vw; height:100vh; border-radius:0; }

  /* ---------- CHAT / QUESTIONS ---------- */
  #screen-chat{ align-items:stretch; justify-content:flex-start; }
  .progress-track{
    position:fixed; top:0; left:0; right:0; height:2px;
    background:transparent;
  }
  .progress-bar{
    height:100%; width:0%; background:var(--ink);
    transition:width 0.6s var(--ease-quint);
  }
  .chat-stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:32px;
  }
  .question-block{ max-width:480px; width:100%; text-align:center; }
  .question-text{
    font-size:22px; line-height:1.6; margin-bottom:36px; font-weight:500;
    animation: gentleShake 3s ease-in-out infinite;
  }
  .opt-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .opt-btn{
    padding:16px 26px; border-radius:24px; border:1.2px solid var(--line-strong);
    font-size:15px; transition: transform 0.2s var(--ease-quint), box-shadow 0.3s ease;
    background:var(--paper);
  }
  .opt-btn:hover{ transform:scale(1.02); box-shadow:0 0 18px rgba(196,160,96,0.35); }
  .opt-btn:active{ transform:scale(0.96); }
  .opt-btn.selected{ background:var(--ink); color:var(--paper); }

  .opt-col{ display:flex; flex-direction:column; gap:12px; align-items:stretch; }
  .opt-card{
    padding:20px; border-radius:18px; border:1.2px solid var(--line);
    font-size:15px; text-align:left; transition: transform 0.2s var(--ease-quint), box-shadow 0.3s ease;
  }
  .opt-card:hover{ transform:scale(1.02); box-shadow:0 0 18px rgba(196,160,96,0.3); }
  .opt-card.selected{ animation: floatUp 0.4s var(--ease-quint) both; border-color:var(--ink); }

  .memory-input{
    width:100%; border:none; border-bottom:1.2px solid var(--line-strong);
    padding:10px 4px; font-size:16px; text-align:center;
    outline:none; background:transparent;
  }
  .memory-input:focus{ border-color:var(--ink); }
  .continue-btn{
    margin-top:24px; padding:12px 30px; border-radius:22px;
    border:1.2px solid var(--ink); font-size:14px;
  }

  .skip-link{
    position:fixed; bottom:24px; left:0; right:0; text-align:center;
    font-size:12px; opacity:0.4; letter-spacing:0.05em;
  }
  .skip-link:hover{ opacity:0.8; }

  /* ---------- GENERATE ---------- */
  #screen-generate{ position:relative; }
  .breathing-wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
  }
  .breathing-circle{
    width:80px; height:80px; border-radius:50%;
    background:var(--mood-color);
    animation: breathing 8.5s ease-in-out infinite;
    will-change: transform;
    transform:translateZ(0);
  }
  .thinking-text{
    font-size:14px; letter-spacing:0.08em; color:var(--ghost);
    min-height:20px;
  }

  #particle-canvas{
    position:absolute; inset:0; width:100%; height:100%;
    display:none;
  }

  .monologue-wrap{
    display:none;
    width:100%; height:100%;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:60px 28px 120px;
    overflow-y:auto;
  }
  .monologue-text{
    max-width:520px; font-size:18px; line-height:2; letter-spacing:0.02em;
    white-space:pre-wrap;
  }
  .chat-thread{ max-width:520px; width:100%; margin-top:32px; display:flex; flex-direction:column; gap:16px; }
  .chat-msg{ font-size:15px; line-height:1.8; white-space:pre-wrap; }
  .chat-msg.user{ align-self:flex-end; color:var(--ghost); }
  .chat-msg.ai{ align-self:flex-start; }

  .chat-input-row{
    position:fixed; bottom:24px; left:0; right:0;
    display:flex; justify-content:center; gap:10px; padding:0 24px;
  }
  .chat-input-row input{
    flex:1; max-width:420px; border:1.2px solid var(--line-strong);
    border-radius:22px; padding:12px 18px; outline:none; font-size:14px;
  }
  .chat-input-row button{
    border:1.2px solid var(--ink); border-radius:22px; padding:12px 20px; font-size:13px;
  }

  .gen-end-btn{
    position:fixed; right:24px; bottom:40px; z-index:5;
    display:flex; align-items:center; gap:6px;
    opacity:0.35; font-size:12px;
  }
  .gen-end-btn .dot{ width:8px; height:8px; border-radius:50%; background:var(--ink); }

  /* ---------- END ---------- */
  #screen-end{ flex-direction:column; }
  .period-mark{
    font-size:64px; font-weight:600;
    transform:scale(0); opacity:0;
    transition:all 1.5s var(--ease-quint);
    color:var(--mood-color);
  }
  .period-mark.show{ transform:scale(1); opacity:1; }
  .summary-block{
    margin-top:28px; text-align:center; opacity:0;
    transition:opacity 0.8s ease;
    max-width:360px;
  }
  .summary-block.show{ opacity:1; }
  .summary-block .item-name{ font-size:15px; margin-bottom:10px; color:var(--ghost); }
  .emotion-track{
    width:200px; height:3px; background:var(--line); border-radius:2px; margin:0 auto 14px;
    overflow:hidden;
  }
  .emotion-fill{ height:100%; background:var(--mood-color); width:0%; transition:width 1s var(--ease-quint); }
  .summary-block .summary-text{ font-size:13px; line-height:1.7; color:var(--ghost); }

  .black-veil{
    position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
    transition:opacity 2s ease; z-index:60;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff;
  }
  .black-veil.show{ opacity:1; pointer-events:all; }
  .black-veil .logo{ font-size:22px; letter-spacing:0.1em; margin-bottom:10px; }
  .black-veil .credit{ font-size:12px; opacity:0.5; }

  /* ---------- CONFIG PANEL ---------- */
  .config-panel{
    position:fixed; left:50%; bottom:0; transform:translate(-50%, 100%);
    width:min(92vw, 420px); max-height:82vh; overflow-y:auto;
    background:var(--paper); border:1px solid var(--line-strong);
    border-bottom:none; border-radius:18px 18px 0 0;
    padding:22px 22px 30px; z-index:100;
    transition: transform 0.45s var(--ease-quint);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.12);
  }
  .config-panel.open{ transform:translate(-50%, 0); }
  .config-panel h3{ font-size:14px; margin-bottom:14px; letter-spacing:0.05em; }
  .config-block{ margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .config-block label{ display:block; font-size:12px; color:var(--ghost); margin-bottom:6px; margin-top:10px; }
  .config-block input{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;
    outline:none;
  }
  .config-block input:focus{ border-color:var(--ink); }
  .config-actions{ display:flex; gap:10px; margin-top:6px; }
  .config-actions button{
    flex:1; border:1px solid var(--line-strong); border-radius:8px; padding:9px; font-size:12px;
  }
  .config-hitzone{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:160px; height:14px; z-index:99;
  }
  .config-hint{
    position:fixed; bottom:6px; left:0; right:0; text-align:center;
    font-size:10px; color:var(--ghost); opacity:0.3; letter-spacing:0.1em; pointer-events:none;
  }

  .loading-inline{
    display:inline-flex; gap:4px; align-items:center;
  }
  .loading-inline span{
    width:5px; height:5px; border-radius:50%; background:var(--ink);
    animation: dotPulse 1s ease-in-out infinite;
  }
  .loading-inline span:nth-child(2){ animation-delay:0.2s; }
  .loading-inline span:nth-child(3){ animation-delay:0.4s; }

  .error-toast{
    position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:20px;
    font-size:13px; opacity:0; transition: all 0.4s var(--ease-quint); z-index:200;
    pointer-events:none; max-width:80vw; text-align:center;
  }
  .error-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

  <!-- ============ HOME ============ -->
  <div id="screen-home" class="screen active">
    <div class="upload-circle fade-in-up stagger-1" id="uploadCircle">
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4"/><path d="M6 9l6-6 6 6"/><path d="M4 20h16"/>
      </svg>
      <img id="previewImg" style="display:none;" alt="">
    </div>
    <div class="upload-hint fade-in-up stagger-2">拍一件物品</div>
    <input type="file" id="fileInput" accept="image/jpeg,image/png">

    <div class="home-bottom">
      <button class="mic-btn" id="micBtn" title="语音输入">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
    </div>
    <button class="keyboard-btn" id="keyboardBtn" title="文字输入">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="10"/>
        <line x1="10" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="14" y2="10"/>
        <line x1="18" y1="10" x2="18" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/>
      </svg>
    </button>
    <button class="end-btn" id="endBtnHome"><span class="dot"></span>结束</button>
  </div>

  <div class="fullscreen-cover" id="fullscreenCover"><img id="coverImg" alt=""></div>

  <!-- ============ CHAT / QUESTIONS ============ -->
  <div id="screen-chat" class="screen">
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    <div class="chat-stage" id="chatStage"></div>
    <button class="skip-link" id="skipLink">跳过</button>
  </div>

  <!-- ============ GENERATE ============ -->
  <div id="screen-generate" class="screen">
    <div class="breathing-wrap" id="breathingWrap">
      <div class="breathing-circle" id="breathingCircle"></div>
      <div class="thinking-text" id="thinkingText">正在观察……</div>
    </div>
    <canvas id="particle-canvas"></canvas>
    <div class="monologue-wrap" id="monologueWrap">
      <div class="monologue-text" id="monologueText"></div>
      <div class="chat-thread" id="chatThread"></div>
    </div>
    <div class="chat-input-row" id="chatInputRow" style="display:none;">
      <input type="text" id="chatInput" placeholder="回应它……">
      <button id="chatSendBtn">发送</button>
    </div>
    <button class="gen-end-btn" id="endBtnGen"><span class="dot"></span>结束</button>
  </div>

  <!-- ============ END ============ -->
  <div id="screen-end" class="screen">
    <div class="period-mark" id="periodMark">。」</div>
    <div class="summary-block" id="summaryBlock">
      <div class="item-name" id="summaryItemName">这件物品</div>
      <div class="emotion-track"><div class="emotion-fill" id="summaryEmotionFill"></div></div>
      <div class="summary-text" id="summaryText"></div>
    </div>
  </div>

  <div class="black-veil" id="blackVeil">
    <div class="logo">万物独白</div>
    <div class="credit">使用 TRAE Work 创建</div>
  </div>

  <!-- ============ CONFIG PANEL ============ -->
  <div class="config-hitzone" id="configHitzone"></div>
  <div class="config-hint">· · ·</div>
  <div class="config-panel" id="configPanel">
    <h3>API 配置</h3>
    <div class="config-block">
      <div style="font-size:13px; font-weight:600;">图像分析 API</div>
      <label>API 类型</label>
      <div style="display:flex; gap:8px;">
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);cursor:pointer;margin:0;"><input type="radio" name="imgApiType" value="openai" checked> OpenAI 兼容</label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);cursor:pointer;margin:0;"><input type="radio" name="imgApiType" value="ollama"> Ollama</label>
      </div>
      <label>Endpoint</label>
      <input type="text" id="imgEndpoint" placeholder="https://api.openai.com/v1/chat/completions">
      <label>Key</label>
      <input type="password" id="imgKey" placeholder="sk-...">
      <label>模型名称</label>
      <input type="text" id="imgModel" placeholder="gpt-4o">
    </div>
    <div class="config-block">
      <div style="font-size:13px; font-weight:600;">文本生成 API</div>
      <label>API 类型</label>
      <div style="display:flex; gap:8px;">
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);cursor:pointer;margin:0;"><input type="radio" name="txtApiType" value="openai" checked> OpenAI 兼容</label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);cursor:pointer;margin:0;"><input type="radio" name="txtApiType" value="ollama"> Ollama</label>
      </div>
      <label>Endpoint</label>
      <input type="text" id="txtEndpoint" placeholder="https://api.openai.com/v1/chat/completions">
      <label>Key</label>
      <input type="password" id="txtKey" placeholder="sk-...">
      <label>模型名称</label>
      <input type="text" id="txtModel" placeholder="gpt-4o">
    </div>
    <div class="config-actions">
      <button id="saveConfigBtn">保存</button>
      <button id="exportConfigBtn">导出配置</button>
      <button id="importConfigBtn">导入配置</button>
    </div>
    <input type="file" id="importFileInput" accept="application/json" style="display:none;">
    <div style="text-align:center; font-size:11px; color:var(--ghost); margin-top:18px;">万物独白 v1.0 | 使用 TRAE Work 创建</div>
  </div>

  <div class="error-toast" id="errorToast"></div>

<script>
(function(){
  "use strict";

  /* ================= STATE ================= */
  const state = {
    imageBase64: null,
    answers: { owner:null, relationship:null, memory:'', intention:null, moodLabel:null },
    emotionIndex: 0.5,
    imageAnalysis: null,
    monologue: '',
    chatHistory: [], // {role, content}
  };

  const CONFIG_KEY = 'monologue_api_config_v1';
  function loadConfig(){
    try{
      const raw = localStorage.getItem(CONFIG_KEY);
      if(!raw) return { img:{endpoint:'',key:'',model:'',apiType:'openai'}, txt:{endpoint:'',key:'',model:'',apiType:'openai'} };
      const cfg = JSON.parse(raw);
      // 兼容旧配置，补充 apiType 字段
      if(!cfg.img.apiType) cfg.img.apiType = 'openai';
      if(!cfg.txt.apiType) cfg.txt.apiType = 'openai';
      return cfg;
    }catch(e){ return { img:{endpoint:'',key:'',model:'',apiType:'openai'}, txt:{endpoint:'',key:'',model:'',apiType:'openai'} }; }
  }
  function saveConfig(cfg){ localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }
  let apiConfig = loadConfig();

  function fillConfigForm(){
    document.getElementById('imgEndpoint').value = apiConfig.img.endpoint || '';
    document.getElementById('imgKey').value = apiConfig.img.key || '';
    document.getElementById('imgModel').value = apiConfig.img.model || '';
    document.getElementById('txtEndpoint').value = apiConfig.txt.endpoint || '';
    document.getElementById('txtKey').value = apiConfig.txt.key || '';
    document.getElementById('txtModel').value = apiConfig.txt.model || '';
    // 填充 API 类型单选按钮
    const imgType = apiConfig.img.apiType || 'openai';
    const txtType = apiConfig.txt.apiType || 'openai';
    document.querySelectorAll('input[name="imgApiType"]').forEach(r => r.checked = (r.value === imgType));
    document.querySelectorAll('input[name="txtApiType"]').forEach(r => r.checked = (r.value === txtType));
  }
  fillConfigForm();

  function handleFile(file){
    if(!/^image\/(jpeg|png)$/.test(file.type)){
      showError('仅支持 jpg / png 图片'); return;
    }
    if(file.size > 8 * 1024 * 1024){
      showError('图片需小于 8MB'); return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1024;
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
        state.imageBase64 = dataUrl;
        previewImg.src = dataUrl;
        previewImg.style.display = 'block';
        playUploadZoomTransition(dataUrl);
      };
      img.onerror = ()=> showError('图片加载失败，请重试');
      img.src = e.target.result;
    };
    reader.onerror = ()=> showError('文件读取失败');
    reader.readAsDataURL(file);
  }

  /* ---- API: generic streaming chat completion caller ---- */
  function timeoutSignal(ms){
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), ms);
    return { signal: controller.signal, clear:()=> clearTimeout(timer) };
  }

  async function callChatAPI({ endpoint, key, model, messages, onToken, timeoutMs=15000, apiType='openai' }){
    if(!endpoint){
      throw new Error('请先在配置面板填写 API Endpoint');
    }
    if(apiType !== 'ollama' && !key){
      throw new Error('请先在配置面板填写 API Key');
    }
    const { signal, clear } = timeoutSignal(timeoutMs);
    let response;
    try{
      const headers = { 'Content-Type':'application/json' };
      if(apiType !== 'ollama' && key){
        headers['Authorization'] = 'Bearer ' + key;
      }
      const body = (apiType === 'ollama')
        ? { model: model || 'qwen2.5:0.5b', messages, stream:true, options:{ temperature:0.9 } }
        : { model: model || 'gpt-4o', messages, stream:true, temperature:0.9 };
      response = await fetch(endpoint, {
        method:'POST',
        headers,
        body: JSON.stringify(body),
        signal
      });
    }catch(e){
      clear();
      if(e.name === 'AbortError') throw new Error('请求超时（' + Math.round(timeoutMs/1000) + '秒），请检查网络或 API 配置');
      throw new Error('网络请求失败：' + e.message);
    }
    clear();
    if(!response.ok){
      let msg = 'API 返回错误：' + response.status;
      try{ const j = await response.json(); if(j.error){ msg += ' - ' + (typeof j.error === 'string' ? j.error : j.error.message || ''); } }catch(e){}
      throw new Error(msg);
    }

    // ---- Ollama NDJSON streaming ----
    if(apiType === 'ollama'){
      if(!response.body){
        const j = await response.json();
        const content = j.message?.content || '';
        if(onToken) onToken(content);
        return content;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let full = '';
      while(true){
        const { value, done } = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, { stream:true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for(const line of lines){
          const trimmed = line.trim();
          if(!trimmed) continue;
          try{
            const json = JSON.parse(trimmed);
            const delta = json.message?.content || '';
            if(delta){
              full += delta;
              if(onToken) onToken(delta);
            }
            if(json.done) break;
          }catch(e){ /* ignore malformed chunk */ }
        }
      }
      return full;
    }

    // ---- OpenAI SSE streaming ----
    if(!response.body){
      const j = await response.json();
      const content = j.choices?.[0]?.message?.content || '';
      if(onToken) onToken(content);
      return content;
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let full = '';
    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, { stream:true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        const trimmed = line.trim();
        if(!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if(payload === '[DONE]') continue;
        try{
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content ?? json.choices?.[0]?.message?.content ?? '';
          if(delta){
            full += delta;
            if(onToken) onToken(delta);
          }
        }catch(e){ /* ignore malformed chunk */ }
      }
    }
    return full;
  }

  async function analyzeImage(dataUrl){
    if(!dataUrl){
      return { type:'一件物品', appearance:'安静地待在原处', age:'看不出年代' };
    }
    const cfg = apiConfig.img;
    const messages = [
      { role:'system', content:'你是图像分析助手。只返回 JSON，不要任何解释、前言或 Markdown 代码块标记。JSON 字段为 type（物品类型）、appearance（外观描述，20字以内）、age（年代感描述，10字以内），全部使用中文。' },
      { role:'user', content:[
          { type:'text', text:'请分析这张图片中的物品。' },
          { type:'image_url', image_url:{ url: dataUrl } }
        ] }
    ];
    let raw = '';
    try{
      raw = await callChatAPI({ endpoint: cfg.endpoint, key: cfg.key, model: cfg.model, apiType: cfg.apiType, messages });
    }catch(e){
      throw new Error('图像分析失败：' + e.message);
    }
    const cleaned = raw.replace(/```json|```/g, '').trim();
    try{
      const parsed = JSON.parse(cleaned);
      return {
        type: parsed.type || '一件物品',
        appearance: parsed.appearance || '安静地待在原处',
        age: parsed.age || '看不出年代'
      };
    }catch(e){
      return { type:'一件物品', appearance: cleaned.slice(0,30) || '安静地待在原处', age:'看不出年代' };
    }
  }

  function buildMonologuePrompt(answers, emotionIndex, imageAnalysis){
    const mood = emotionIndex < 0.3 ? '克制内敛，像冬天的黄昏'
               : emotionIndex < 0.5 ? '平和安静，像午后的阳光'
               : emotionIndex < 0.7 ? '温暖略带幽默，像老友聊天'
               : '轻快活泼，像春天的早晨';

    const perspective = answers.intention === '它的故事' ? '讲述自己的经历和见证'
                      : answers.intention === '它眼中的你' ? '描述它对主人的观察和感受'
                      : answers.intention === '告别' ? '用告别的方式讲述回忆'
                      : '随性闲聊，不拘泥主题';

    return `你是一件物品的第一人称。请用中文写一段独白，200-300字。

物品信息：
- 类型：${imageAnalysis.type || '未知物品'}
- 外观：${imageAnalysis.appearance || '一件普通的物品'}
- 年代感：${imageAnalysis.age || '看不出年代'}

用户情感画像：
- 物品归属：${answers.owner}
- 关系：${answers.relationship}
- 记忆关键词：${answers.memory}
- 情感指数：${emotionIndex}（0=阴郁，1=愉悦）
- 对话意图：${answers.intention}

写作要求：
1. 语气${mood}
2. 视角：${perspective}
3. 从一个具体的细节切入，不要以"我是XX"开头
4. 不要直接说"想你""怀念"这类直白词汇，用细节暗示
5. 结尾留白，不要总结或升华
6. 像一位作家的短散文，不是产品介绍

请直接返回独白文本，不要加任何解释。`;
  }

  async function generateMonologueText(){
    // wait for image analysis result if not yet available is handled by caller running in parallel;
    // here we re-run analysis lazily if needed by depending on state after Promise.all ordering.
    const cfg = apiConfig.txt;
    const analysis = state.imageAnalysis || await analyzeImage(state.imageBase64).catch(()=> ({ type:'一件物品', appearance:'安静地待在原处', age:'看不出年代' }));
    const prompt = buildMonologuePrompt(state.answers, state.emotionIndex, analysis);
    const messages = [ { role:'user', content: prompt } ];
    let acc = '';
    try{
      acc = await callChatAPI({ endpoint: cfg.endpoint, key: cfg.key, model: cfg.model, apiType: cfg.apiType, messages });
    }catch(e){
      throw new Error('独白生成失败：' + e.message);
    }
    return acc.trim();
  }

  /* ================= PARTICLE CONVERGENCE + REVEAL ================= */
  function revealMonologue(){
    breathingWrap.style.animation = 'shrinkAway 1s cubic-bezier(0.68,-0.35,0.27,1.35) both';
    setTimeout(()=>{
      breathingWrap.style.display = 'none';
      runParticleConvergence(state.monologue, ()=>{
        particleCanvas.style.display = 'none';
        monologueWrap.style.display = 'flex';
        monologueWrap.classList.add('fade-in-up');
        typewriterReveal(monologueText, state.monologue, ()=>{
          chatInputRow.style.display = 'flex';
        });
      });
    }, 950);
  }

  function typewriterReveal(el, text, done){
    el.textContent = '';
    let i = 0;
    const step = ()=>{
      if(i >= text.length){ done && done(); return; }
      el.textContent += text[i];
      i++;
      setTimeout(step, 28);
    };
    step();
  }

  function runParticleConvergence(text, onDone){
    const canvas = particleCanvas;
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // render text offscreen to sample points
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const octx = off.getContext('2d');
    octx.clearRect(0,0,w,h);
    octx.fillStyle = '#000';
    const fontSize = Math.min(20, Math.max(14, Math.floor(w / 26)));
    octx.font = fontSize + 'px -apple-system, "PingFang SC", sans-serif';
    octx.textBaseline = 'top';
    const maxWidth = Math.min(520, w - 60);
    const lines = wrapText(octx, text.slice(0, 120), maxWidth);
    const lineHeight = fontSize * 1.9;
    const totalHeight = lines.length * lineHeight;
    let startY = Math.max(60, (h - totalHeight) / 2);
    const startX = (w - maxWidth) / 2;
    lines.forEach((line, idx)=>{
      octx.fillText(line, startX, startY + idx * lineHeight);
    });

    const imgData = octx.getImageData(0,0,w,h).data;
    const points = [];
    const step = 3;
    for(let y=0; y<h; y+=step){
      for(let x=0; x<w; x+=step){
        const alpha = imgData[(y*w+x)*4 + 3];
        if(alpha > 120){ points.push({x,y}); }
      }
    }
    // subsample to a reasonable particle count
    const maxParticles = 700;
    let sampled = points;
    if(points.length > maxParticles){
      sampled = [];
      const stride = points.length / maxParticles;
      for(let i=0; i<maxParticles; i++){ sampled.push(points[Math.floor(i*stride)]); }
    }

    const particles = sampled.map(p=>{
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.max(w,h) * (0.6 + Math.random()*0.4);
      return {
        x: w/2 + Math.cos(angle)*dist,
        y: h/2 + Math.sin(angle)*dist,
        tx: p.x, ty: p.y,
        delay: Math.random() * 300
      };
    });

    const duration = 1200;
    const start = performance.now();

    function frame(now){
      const elapsed = now - start;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = '#111111';
      let allDone = true;
      particles.forEach(p=>{
        let localT = (elapsed - p.delay) / duration;
        if(localT < 0){ allDone = false; localT = 0; }
        if(localT < 1) allDone = false;
        localT = Math.min(1, Math.max(0, localT));
        const eased = 1 - Math.pow(1 - localT, 4);
        const cx = p.x + (p.tx - p.x) * eased;
        const cy = p.y + (p.ty - p.y) * eased;
        ctx.globalAlpha = 0.55 + eased*0.45;
        ctx.beginPath();
        ctx.arc(cx, cy, 1.1, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      if(!allDone && elapsed < duration + 400){
        requestAnimationFrame(frame);
      }else{
        onDone && onDone();
      }
    }
    if(particles.length === 0){ onDone && onDone(); return; }
    requestAnimationFrame(frame);
  }

  function wrapText(ctx, text, maxWidth){
    const lines = [];
    let line = '';
    for(const ch of text){
      const test = line + ch;
      if(ctx.measureText(test).width > maxWidth && line.length > 0){
        lines.push(line);
        line = ch;
      }else{
        line = test;
      }
      if(ch === '\n'){ lines.push(line.slice(0,-1)); line=''; }
    }
    if(line) lines.push(line);
    return lines.slice(0, 8);
  }

  /* ================= MULTI-TURN CHAT (no particles, streaming) ================= */
  const chatThread = document.getElementById('chatThread');
  const chatInput = document.getElementById('chatInput');
  const chatSendBtn = document.getElementById('chatSendBtn');

  chatSendBtn.addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') sendChatMessage(); });

  async function sendChatMessage(){
    const text = chatInput.value.trim();
    if(!text) return;
    chatInput.value = '';
    chatInput.disabled = true;
    appendChatBubble('user', text);
    state.chatHistory.push({ role:'user', content:text });

    const aiBubble = appendChatBubble('ai', '');
    const cfg = apiConfig.txt;
    const systemMsg = {
      role:'system',
      content:`你继续以"${state.imageAnalysis?.type || '这件物品'}"第一人称身份，与主人对话。保持独白建立的语气与视角，回复简短自然，不要机械或客套，中文回答。`
    };
    const messages = [systemMsg, { role:'user', content: buildMonologuePrompt(state.answers, state.emotionIndex, state.imageAnalysis || {}) }, { role:'assistant', content: state.monologue }, ...state.chatHistory];

    try{
      const full = await callChatAPI({
        endpoint: cfg.endpoint, key: cfg.key, model: cfg.model, apiType: cfg.apiType, messages,
        onToken: (tok)=>{ aiBubble.textContent += tok; scrollThreadToBottom(); }
      });
      state.chatHistory.push({ role:'assistant', content: full });
    }catch(e){
      aiBubble.textContent = '（未能回应：' + e.message + '）';
      showError(e.message);
    }finally{
      chatInput.disabled = false;
      chatInput.focus();
    }
  }

  function appendChatBubble(role, text){
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    chatThread.appendChild(div);
    scrollThreadToBottom();
    return div;
  }
  function scrollThreadToBottom(){
    monologueWrap.scrollTop = monologueWrap.scrollHeight;
  }

  /* ================= END PAGE ================= */
  function goToEndPage(){
    goToScreen('screen-end');
    const periodMark = document.getElementById('periodMark');
    const summaryBlock = document.getElementById('summaryBlock');
    const summaryItemName = document.getElementById('summaryItemName');
    const summaryEmotionFill = document.getElementById('summaryEmotionFill');
    const summaryText = document.getElementById('summaryText');
    const blackVeil = document.getElementById('blackVeil');

    periodMark.classList.remove('show');
    summaryBlock.classList.remove('show');
    blackVeil.classList.remove('show');
    summaryEmotionFill.style.width = '0%';

    setTimeout(()=>{
      periodMark.classList.add('show');
    }, 550);

    setTimeout(()=>{
      summaryItemName.textContent = state.imageAnalysis?.type || '这件物品';
      summaryEmotionFill.style.width = Math.round(state.emotionIndex*100) + '%';
      summaryText.textContent = state.answers.memory
        ? `记忆关键词：${state.answers.memory}`
        : '这一次，你们静静地对话了一场。';
      summaryBlock.classList.add('show');
    }, 550 + 1500 + 1000);

    setTimeout(()=>{
      blackVeil.classList.add('show');
    }, 550 + 1500 + 1000 + 2000);

    setTimeout(()=>{
      resetApp();
      blackVeil.classList.remove('show');
      goToScreen('screen-home');
    }, 550 + 1500 + 1000 + 2000 + 3000);
  }

  function resetApp(){
    state.imageBase64 = null;
    state.answers = { owner:null, relationship:null, memory:'', intention:null, moodLabel:null };
    state.emotionIndex = 0.5;
    state.imageAnalysis = null;
    state.monologue = '';
    state.chatHistory = [];
    previewImg.style.display = 'none';
    previewImg.src = '';
    fileInput.value = '';
    applyMoodColor(0.5);
  }

  /* ================= CONFIG PANEL ================= */
  const configPanel = document.getElementById('configPanel');
  const configHitzone = document.getElementById('configHitzone');
  function toggleConfigPanel(){ configPanel.classList.toggle('open'); }
  configHitzone.addEventListener('dblclick', toggleConfigPanel);
  document.body.addEventListener('dblclick', (e)=>{
    if(e.target === document.body) toggleConfigPanel();
  });

  document.getElementById('saveConfigBtn').addEventListener('click', ()=>{
    const imgApiType = document.querySelector('input[name="imgApiType"]:checked')?.value || 'openai';
    const txtApiType = document.querySelector('input[name="txtApiType"]:checked')?.value || 'openai';
    apiConfig = {
      img:{
        endpoint: document.getElementById('imgEndpoint').value.trim(),
        key: document.getElementById('imgKey').value.trim(),
        model: document.getElementById('imgModel').value.trim(),
        apiType: imgApiType,
      },
      txt:{
        endpoint: document.getElementById('txtEndpoint').value.trim(),
        key: document.getElementById('txtKey').value.trim(),
        model: document.getElementById('txtModel').value.trim(),
        apiType: txtApiType,
      }
    };
    saveConfig(apiConfig);
    showError('配置已保存');
    configPanel.classList.remove('open');
  });

  document.getElementById('exportConfigBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(apiConfig, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'monologue_api_config.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  const importFileInput = document.getElementById('importFileInput');
  document.getElementById('importConfigBtn').addEventListener('click', ()=> importFileInput.click());
  importFileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        apiConfig = {
          img: Object.assign({ endpoint:'', key:'', model:'', apiType:'openai' }, parsed.img || {}),
          txt: Object.assign({ endpoint:'', key:'', model:'', apiType:'openai' }, parsed.txt || {})
        };
        saveConfig(apiConfig);
        fillConfigForm();
        showError('配置已导入');
      }catch(err){ showError('配置文件格式有误'); }
    };
    reader.readAsText(file);
  });

  applyMoodColor(0.5);
})();
</script>
