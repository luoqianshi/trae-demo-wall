<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI翻译 - 小译 XiaoYi</title>
  <link rel="stylesheet" href="../assets/design.css">
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; padding-bottom: 0; }

    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 20px 10px; flex-shrink: 0;
    }
    .page-header h1 {
      font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700;
      background: var(--gradient-brand); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-actions { display: flex; gap: 10px; }
    .header-btn {
      width: 34px; height: 34px; border-radius: var(--radius-full);
      background: var(--xy-color-primary-muted); border: 1px solid var(--glass-border);
      color: var(--xy-color-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: box-shadow 0.3s;
    }
    .header-btn:hover { box-shadow: 0 0 12px rgba(34, 211, 238, 0.25); }
    .header-btn svg { width: 16px; height: 16px; }

    /* Mode Tabs */
    .mode-tabs {
      display: flex; gap: 8px; padding: 0 16px 12px;
      overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
    }
    .mode-tabs::-webkit-scrollbar { display: none; }
    .mode-tab {
      flex-shrink: 0; padding: 6px 14px; border-radius: var(--radius-full);
      font-size: var(--text-xs); font-weight: 600;
      background: var(--xy-bg-elevated); color: var(--xy-ink-secondary);
      border: 1px solid var(--xy-border-default);
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .mode-tab.active {
      background: var(--xy-color-primary-muted); color: var(--xy-color-primary);
      border-color: rgba(34, 211, 238, 0.3);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.12);
    }

    .chat-container {
      flex: 1; display: flex; flex-direction: column; padding: 0 16px;
      overflow-y: auto; gap: 16px; padding-bottom: 16px;
    }

    .msg { display: flex; gap: 10px; max-width: 100%; animation: fade-in 0.3s ease-out; }
    .msg-ai { align-self: flex-start; }
    .msg-user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px; height: 36px; border-radius: var(--radius-full); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-sm); font-weight: 700; color: #fff;
    }
    .msg-avatar.ai {
      background: var(--gradient-brand);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.3);
    }
    .msg-avatar.user {
      background: var(--xy-bg-sunken);
      border: 1px solid var(--xy-border-default);
      color: var(--xy-ink-secondary); font-size: var(--text-xs);
    }

    .msg-bubble {
      padding: 12px 16px; border-radius: 16px;
      font-size: var(--text-base); line-height: 1.6;
      max-width: calc(100% - 52px); word-break: break-word;
    }
    .msg-ai .msg-bubble {
      background: var(--xy-bg-elevated);
      border: 1px solid var(--xy-border-default);
      border-top-left-radius: 4px;
      color: var(--xy-ink-primary);
    }
    .msg-user .msg-bubble {
      background: var(--gradient-brand);
      border-top-right-radius: 4px;
      color: #fff;
    }
    .msg-bubble .quick-actions {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
      padding-top: 10px; border-top: 1px solid var(--xy-border-subtle);
    }
    .quick-action {
      padding: 8px 14px; border-radius: var(--radius-full);
      background: var(--xy-color-primary-muted); border: 1px solid transparent;
      color: var(--xy-color-primary); font-size: var(--text-xs); font-weight: 600;
      cursor: pointer; transition: all 0.3s; white-space: nowrap;
    }
    .quick-action:hover {
      border-color: var(--xy-color-primary);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
    }

    .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
    .typing-dot {
      width: 6px; height: 6px; border-radius: var(--radius-full);
      background: var(--xy-color-primary); opacity: 0.4;
      animation: typing-bounce 1.4s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    .input-bar {
      flex-shrink: 0; padding: 10px 16px 12px;
      background: var(--xy-bg-elevated);
      border-top: 1px solid var(--xy-border-subtle);
    }
    .input-row { display: flex; align-items: center; gap: 10px; }
    .input-field {
      flex: 1; padding: 10px 16px; border-radius: var(--radius-full);
      border: 1px solid var(--xy-border-default);
      background: var(--xy-bg-secondary); color: var(--xy-ink-primary);
      font-size: var(--text-base); font-family: var(--font-body);
      outline: none; transition: border-color 0.3s;
    }
    .input-field::placeholder { color: var(--xy-ink-tertiary); }
    .input-field:focus { border-color: var(--xy-color-primary); }
    .send-btn {
      width: 40px; height: 40px; border-radius: var(--radius-full);
      background: var(--gradient-brand); border: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(34, 211, 238, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(34, 211, 238, 0.4); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <div class="bar"></div>
      <div class="wifi"></div>
      <div class="battery"></div>
    </div>
  </div>

  <!-- Page Header -->
  <header class="page-header">
    <h1>小译 AI 助手</h1>
    <div class="header-actions">
      <button class="header-btn" id="btn-theme" title="主题切换">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="header-btn" id="btn-clear" title="清空对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </header>

  <!-- Mode Tabs -->
  <div class="mode-tabs">
    <div class="mode-tab active" data-mode="chat">💬 文字</div>
    <div class="mode-tab" data-mode="camera">📷 拍照</div>
    <div class="mode-tab" data-mode="document">📄 文档</div>
    <div class="mode-tab" data-mode="meeting">🎤 会议</div>
  </div>

  <!-- Chat Messages -->
  <div class="chat-container" id="chat-container">
    <!-- AI Welcome -->
    <div class="msg msg-ai">
      <div class="msg-avatar ai">译</div>
      <div class="msg-bubble">
        你好！我是小译 AI 助手，可以帮你解答翻译、学习、使用等各种问题。请问有什么可以帮你的？
        <div class="quick-actions">
          <span class="quick-action">如何拍照翻译？</span>
          <span class="quick-action">怎么上传文档？</span>
          <span class="quick-action">会议翻译怎么用？</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Bar -->
  <div class="input-bar">
    <div class="input-row">
      <input class="input-field" id="input-field" type="text" placeholder="输入你的问题...">
      <button class="send-btn" id="send-btn" title="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar">
    <a class="tab-item" href="home.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="tab-label">首页</span>
    </a>
    <a class="tab-item active" href="translate.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 0"/><path d="M8 2l0 6"/><path d="M2 14l2 6 2-6"/><path d="M4 14h2"/><path d="M12 2v4a4 4 0 0 1 4 4v1"/><path d="M12 11h-1a3 3 0 0 0 0 6h1"/><path d="M17 11h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4"/><path d="M17 11v8"/></svg>
      <span class="tab-label">翻译</span>
    </a>
    <a class="tab-item" href="learn.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="tab-label">学习</span>
    </a>
    <a class="tab-item" href="courses.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      <span class="tab-label">课程</span>
    </a>
    <a class="tab-item" href="profile.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="tab-label">我的</span>
    </a>
  </nav>

  <script src="../assets/common.js"></script>
  <script>
    const chatContainer = document.getElementById('chat-container');
    const inputField = document.getElementById('input-field');
    const sendBtn = document.getElementById('send-btn');
    let currentMode = 'chat';

    // Mode tabs
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        const modeMessages = {
          chat: '已切换到文字翻译模式',
          camera: '📷 拍照翻译模式：请对准文字拍照，AI将自动识别并翻译。支持中、英、日、韩等20+语言。',
          document: '📄 文档翻译模式：支持 PDF、Word、TXT 等格式批量上传，最大10MB。',
          meeting: '🎤 会议翻译模式：实时捕捉会议语音，自动生成双语字幕与会议纪要。'
        };
        addAIMessage(modeMessages[currentMode]);
      });
    });

    // URL param for mode
    const urlParams = new URLSearchParams(window.location.search);
    const modeParam = urlParams.get('mode');
    if (modeParam && ['camera', 'document', 'meeting'].includes(modeParam)) {
      const tab = document.querySelector(`.mode-tab[data-mode="${modeParam}"]`);
      if (tab) tab.click();
    }

    // Quick action: text -> input
    chatContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('quick-action')) {
        inputField.value = e.target.textContent;
        inputField.focus();
      }
    });

    function addMessage(text, type = 'ai', withQuickActions = false) {
      const msg = document.createElement('div');
      msg.className = 'msg msg-' + type;
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar ' + type;
      avatar.textContent = type === 'ai' ? '译' : '我';
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = text;
      if (withQuickActions) {
        bubble.innerHTML += '<div class="quick-actions"><span class="quick-action">如何拍照翻译？</span><span class="quick-action">怎么上传文档？</span><span class="quick-action">会议翻译怎么用？</span></div>';
      }
      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }

    function addAIMessage(text, withQuickActions = false) {
      return addMessage(text, 'ai', withQuickActions);
    }

    function addUserMessage(text) {
      return addMessage(text, 'user');
    }

    function showTyping() {
      const msg = document.createElement('div');
      msg.className = 'msg msg-ai';
      msg.id = 'typing-msg';
      msg.innerHTML = `<div class="msg-avatar ai">译</div><div class="msg-bubble"><div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    function hideTyping() {
      const t = document.getElementById('typing-msg');
      if (t) t.remove();
    }

    // Mock AI replies based on keywords
    function generateAIReply(userText) {
      const text = userText.toLowerCase();
      // Translation detection
      const transPairs = [
        { re: /hello|hi|你好/, reply: '你好！👋' },
        { re: /thank|谢谢/, reply: '不客气！希望能帮到你 😊' },
      ];
      for (const p of transPairs) { if (p.re.test(text)) return p.reply; }

      if (/拍照|camera|拍图|照片/.test(text)) {
        return '📷 拍照翻译使用方法：<br><br><strong>1.</strong> 点击上方「拍照」标签<br><strong>2.</strong> 对准需要翻译的文字拍照<br><strong>3.</strong> AI 会自动识别文字并翻译<br><br>支持中、英、日、韩、法、德等 20+ 种语言实时互译。如果识别结果不准确，可以手动校对后再翻译。';
      }
      if (/文档|上传|document|pdf|word/.test(text)) {
        return '📄 文档翻译支持 PDF、Word、TXT、PPT 等格式：<br><br><strong>1.</strong> 点击「文档」标签<br><strong>2.</strong> 上传文件（最大10MB）<br><strong>3.</strong> 选择源语言与目标语言<br><strong>4.</strong> 等待AI批量处理<br><br>支持保留原文排版，下载翻译后的文件。';
      }
      if (/会议|meeting|实时|字幕/.test(text)) {
        return '🎤 会议翻译功能强大：<br><br><strong>1.</strong> 点击「会议」标签开启<br><strong>2.</strong> 选择源语言和目标语言<br><strong>3.</strong> 实时生成双语字幕<br><strong>4.</strong> 会议结束自动生成纪要<br><br>支持多人同时发言识别，准确率 95%+。';
      }
      if (/翻译|translate/.test(text)) {
        return '我可以帮你做多种翻译：<br><br>• 文字翻译：直接输入文字<br>• 拍照翻译：拍下文字即可<br>• 文档翻译：上传文件批量译<br>• 会议翻译：实时双语字幕<br><br>请告诉我你需要哪种翻译？';
      }
      // Detect English/numbers -> translate to Chinese
      if (/[a-zA-Z]/.test(userText) && userText.length < 200) {
        const samples = {
          'hello': '你好',
          'good morning': '早上好',
          'thank you': '谢谢',
          'how are you': '你好吗',
          'i love you': '我爱你',
          'goodbye': '再见',
        };
        const lower = userText.toLowerCase().trim();
        if (samples[lower]) return `🌐 <strong>翻译结果：</strong><br><br>"${userText}"<br>↓<br><strong>${samples[lower]}</strong>`;
        return `🌐 <strong>翻译结果：</strong><br><br>"${userText}"<br>↓<br><strong>[AI 模拟翻译] 已识别为${/[a-z]/.test(lower[0]) ? '英语' : '其他语言'}，译文生成中...</strong><br><br><small>提示：本 Demo 为模拟翻译，正式版将接入真实翻译引擎。</small>`;
      }
      // Detect Chinese -> translate to English
      if (/[\u4e00-\u9fa5]/.test(userText)) {
        const cnSamples = {
          '你好': 'Hello',
          '早上好': 'Good morning',
          '谢谢': 'Thank you',
          '再见': 'Goodbye',
          '我爱你': 'I love you',
        };
        const trim = userText.trim();
        if (cnSamples[trim]) return `🌐 <strong>Translation:</strong><br><br>"${userText}"<br>↓<br><strong>${cnSamples[trim]}</strong>`;
        return `🌐 <strong>Translation:</strong><br><br>"${userText}"<br>↓<br><strong>[AI simulated translation] Detected Chinese, translating...</strong><br><br><small>Tip: This is a demo simulation. The full version connects to a real translation engine.</small>`;
      }
      // Default fallback
      return `我理解你说的：「${userText}」<br><br>我可以帮你：<br>• 翻译各种语言<br>• 解答使用问题<br>• 提供学习建议<br><br>请告诉我你的具体需求。`;
    }

    function sendMessage() {
      const text = inputField.value.trim();
      if (!text) return;
      addUserMessage(text);
      XY.store.translateHistory.push({ q: text, t: Date.now() });
      if (XY.store.translateHistory.length > 50) XY.store.translateHistory.shift();
      XY.save();
      inputField.value = '';
      showTyping();
      setTimeout(() => {
        hideTyping();
        const reply = generateAIReply(text);
        addAIMessage(reply);
      }, 800 + Math.random() * 600);
    }

    sendBtn.addEventListener('click', sendMessage);
    inputField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    // Theme toggle
    document.getElementById('btn-theme').addEventListener('click', () => {
      const t = XY.toggleTheme();
      XY.toast(t === 'dark' ? '已切换到深色模式' : '已切换到浅色模式', 'success');
    });

    // Clear chat
    document.getElementById('btn-clear').addEventListener('click', () => {
      const messages = chatContainer.querySelectorAll('.msg');
      messages.forEach((m, i) => { if (i > 0) m.remove(); });
      XY.toast('对话已清空', 'info');
    });
  </script>
</body>
</html>
