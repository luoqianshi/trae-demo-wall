<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>课程商城 - 小译 XiaoYi</title>
  <link rel="stylesheet" href="../assets/design.css">
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    /* === Page Header === */
    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 20px 12px;
    }
    .page-header h1 {
      font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700;
      background: var(--gradient-brand); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-actions { display: flex; gap: 10px; }
    .header-btn {
      width: 34px; height: 34px; border-radius: var(--radius-full);
      background: var(--xy-color-primary-muted); border: 1px solid var(--glass-border);
      color: var(--xy-color-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: box-shadow 0.3s;
    }
    .header-btn:hover { box-shadow: 0 0 12px rgba(34, 211, 238, 0.25); }
    .header-btn svg { width: 16px; height: 16px; }

    /* === Live Banner === */
    .live-banner {
      position: relative; margin: 0 20px 16px; padding: 18px 16px 14px;
      border-radius: var(--radius-xl); overflow: hidden;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
    }
    .live-banner::before {
      content: ''; position: absolute; inset: -50%; z-index: -1;
      background: conic-gradient(from 0deg,
        rgba(34, 211, 238, 0.6),
        rgba(248, 113, 113, 0.5),
        rgba(45, 212, 191, 0.6),
        rgba(139, 92, 246, 0.5),
        rgba(34, 211, 238, 0.6));
      animation: banner-spin 6s linear infinite;
      filter: blur(3px);
    }
    .live-banner-inner { position: relative; z-index: 1; }
    .live-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .live-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: var(--radius-sm);
      background: #ef4444; color: #fff;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    }
    .live-badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #fff; animation: live-pulse 1.2s infinite;
    }
    .live-host { font-size: var(--text-xs); color: var(--xy-ink-secondary); }
    .live-host strong { color: var(--xy-ink-primary); font-weight: 600; }
    .live-title {
      font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700;
      color: var(--xy-ink-primary); margin-bottom: 4px; line-height: var(--leading-tight);
    }
    .live-viewers { font-size: var(--text-xs); color: var(--xy-ink-tertiary); margin-bottom: 12px; }
    .btn-join-live {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: var(--radius-full);
      background: var(--gradient-brand); color: var(--xy-ink-inverse);
      border: none; cursor: pointer;
      font-size: var(--text-sm); font-weight: 600;
      box-shadow: 0 2px 10px rgba(34, 211, 238, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-join-live:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(34, 211, 238, 0.45); }
    .btn-join-live:active { transform: scale(0.96); }
    .btn-join-live svg { width: 14px; height: 14px; }
    .live-tags { display: flex; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--xy-border-subtle); }

    /* === Course Tabs === */
    .course-tabs {
      display: flex; gap: 8px; padding: 0 20px 12px;
      overflow-x: auto; scrollbar-width: none;
    }
    .course-tabs::-webkit-scrollbar { display: none; }
    .course-tab {
      flex-shrink: 0; padding: 6px 14px; border-radius: var(--radius-full);
      font-size: var(--text-xs); font-weight: 600;
      background: var(--xy-bg-elevated); color: var(--xy-ink-secondary);
      border: 1px solid var(--xy-border-default);
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .course-tab.active {
      background: var(--xy-color-primary-muted); color: var(--xy-color-primary);
      border-color: rgba(34, 211, 238, 0.3);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.12);
    }

    /* === Course List === */
    .course-list { padding: 0 20px 8px; display: flex; flex-direction: column; gap: 12px; }
    .course-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
      padding: 14px; display: flex; gap: 12px; align-items: flex-start;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .course-card:hover { border-color: rgba(34, 211, 238, 0.25); box-shadow: 0 0 16px rgba(34, 211, 238, 0.08); }
    .teacher-avatar {
      width: 48px; height: 48px; border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-lg); font-weight: 700; color: #fff;
      flex-shrink: 0; position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .teacher-avatar .flag {
      position: absolute; right: -3px; bottom: -3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--xy-bg-elevated); border: 2px solid var(--xy-bg-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; line-height: 1;
    }
    .av-1 { background: linear-gradient(135deg, #22d3ee, #2dd4bf); }
    .av-2 { background: linear-gradient(135deg, #f472b6, #ec4899); }
    .av-3 { background: linear-gradient(135deg, #a78bfa, #7c3aed); }

    .course-info { flex: 1; min-width: 0; }
    .course-teacher { font-size: var(--text-xs); color: var(--xy-ink-secondary); margin-bottom: 2px; }
    .course-title {
      font-family: var(--font-display); font-size: var(--text-base); font-weight: 600;
      color: var(--xy-ink-primary); margin-bottom: 6px; line-height: var(--leading-tight);
    }
    .course-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .course-price {
      font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 700;
      background: var(--gradient-brand); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .course-rating {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: var(--text-xs); font-weight: 600; color: #fbbf24;
    }
    .course-rating svg { width: 12px; height: 12px; fill: #fbbf24; stroke: #fbbf24; }
    .btn-book {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 14px; border-radius: var(--radius-full);
      background: var(--gradient-brand); color: var(--xy-ink-inverse);
      border: none; cursor: pointer;
      font-size: var(--text-xs); font-weight: 600;
      box-shadow: 0 2px 8px rgba(34, 211, 238, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-book:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34, 211, 238, 0.35); }
    .btn-book:active { transform: scale(0.96); }
    .btn-book:disabled, .btn-book.booked {
      background: var(--xy-bg-sunken); color: var(--xy-ink-tertiary);
      box-shadow: none; cursor: not-allowed;
      border: 1px solid var(--xy-border-default);
    }
    .btn-book:disabled:hover, .btn-book.booked:hover { transform: none; }

    /* === Section Header === */
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px 10px;
    }
    .section-header h2 {
      font-family: var(--font-display); font-size: var(--text-base); font-weight: 600;
      color: var(--xy-ink-primary); display: flex; align-items: center; gap: 8px;
    }
    .section-header h2::before {
      content: ''; width: 3px; height: 14px; border-radius: 2px;
      background: var(--gradient-brand);
    }
    .section-link {
      font-size: var(--text-xs); color: var(--xy-ink-tertiary);
      text-decoration: none; transition: color 0.2s; cursor: pointer;
    }
    .section-link:hover { color: var(--xy-color-primary); }

    /* === Book Scroll === */
    .book-scroll {
      display: flex; gap: 12px; padding: 0 20px 16px;
      overflow-x: auto; scrollbar-width: none;
    }
    .book-scroll::-webkit-scrollbar { display: none; }
    .book-card {
      flex-shrink: 0; width: 130px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
      padding: 12px; transition: border-color 0.3s, transform 0.3s;
    }
    .book-card:hover { border-color: rgba(34, 211, 238, 0.25); transform: translateY(-2px); }
    .book-cover {
      width: 100%; height: 88px; border-radius: var(--radius-md);
      margin-bottom: 8px; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: rgba(255, 255, 255, 0.9);
    }
    .book-cover::after {
      content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px;
      background: rgba(255, 255, 255, 0.25);
    }
    .bc-1 { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .bc-2 { background: linear-gradient(135deg, #ec4899, #be185d); }
    .bc-3 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .bc-4 { background: linear-gradient(135deg, #06b6d4, #0e7490); }
    .book-title {
      font-size: var(--text-xs); font-weight: 600; color: var(--xy-ink-primary);
      line-height: var(--leading-tight); margin-bottom: 2px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .book-author { font-size: 10px; color: var(--xy-ink-tertiary); margin-bottom: 8px; }
    .btn-read {
      width: 100%; padding: 5px 0; border-radius: var(--radius-sm);
      background: var(--xy-color-primary-muted); color: var(--xy-color-primary);
      border: 1px solid transparent; cursor: pointer;
      font-size: 10px; font-weight: 600; transition: all 0.2s;
    }
    .btn-read:hover { border-color: var(--xy-color-primary); }
  </style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <div class="bar"></div>
      <div class="wifi"></div>
      <div class="battery"></div>
    </div>
  </div>

  <!-- Page Header -->
  <header class="page-header">
    <h1>课程商城</h1>
    <div class="header-actions">
      <button class="header-btn" id="btn-search" title="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="header-btn" id="btn-filter" title="筛选">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </button>
    </div>
  </header>

  <!-- Live Banner -->
  <div class="live-banner">
    <div class="live-banner-inner">
      <div class="live-top">
        <span class="live-badge">LIVE</span>
        <span class="live-host">主讲 <strong>Sarah Johnson</strong></span>
      </div>
      <div class="live-title">零基础英语口语直播课</div>
      <div class="live-viewers">1234 人正在观看</div>
      <button class="btn-join-live" id="btn-join-live">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        加入直播
      </button>
      <div class="live-tags">
        <span class="xy-tag xy-tag-primary">✨ AI翻译助手已开启</span>
        <span class="xy-tag xy-tag-accent">🌐 实时翻译</span>
      </div>
    </div>
  </div>

  <!-- Course Tabs -->
  <div class="course-tabs">
    <div class="course-tab active" data-cat="all">全部</div>
    <div class="course-tab" data-cat="1v1">一对一</div>
    <div class="course-tab" data-cat="live">直播课</div>
    <div class="course-tab" data-cat="record">录播课</div>
  </div>

  <!-- Course List -->
  <div class="course-list" id="course-list"></div>

  <!-- Books Section -->
  <div class="section-header">
    <h2>语言书籍</h2>
    <a class="section-link" id="link-more-books">查看全部›</a>
  </div>
  <div class="book-scroll" id="book-scroll">
    <div class="book-card">
      <div class="book-cover bc-1">📘</div>
      <div class="book-title">新概念英语</div>
      <div class="book-author">L.G. Alexander</div>
      <button class="btn-read">开始阅读</button>
    </div>
    <div class="book-card">
      <div class="book-cover bc-2">📕</div>
      <div class="book-title">标准日本语</div>
      <div class="book-author">人民教育出版社</div>
      <button class="btn-read">开始阅读</button>
    </div>
    <div class="book-card">
      <div class="book-cover bc-3">📗</div>
      <div class="book-title">法语渐进系列</div>
      <div class="book-author">Cle International</div>
      <button class="btn-read">开始阅读</button>
    </div>
    <div class="book-card">
      <div class="book-cover bc-4">📙</div>
      <div class="book-title">剑桥雅思真题</div>
      <div class="book-author">Cambridge</div>
      <button class="btn-read">开始阅读</button>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar">
    <a class="tab-item" href="home.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="tab-label">首页</span>
    </a>
    <a class="tab-item" href="translate.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 0"/><path d="M8 2l0 6"/><path d="M2 14l2 6 2-6"/><path d="M4 14h2"/><path d="M12 2v4a4 4 0 0 1 4 4v1"/><path d="M12 11h-1a3 3 0 0 0 0 6h1"/><path d="M17 11h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4"/><path d="M17 11v8"/></svg>
      <span class="tab-label">翻译</span>
    </a>
    <a class="tab-item" href="learn.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="tab-label">学习</span>
    </a>
    <a class="tab-item active" href="courses.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      <span class="tab-label">课程</span>
    </a>
    <a class="tab-item" href="profile.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="tab-label">我的</span>
    </a>
  </nav>

  <script src="../assets/common.js"></script>
  <script>
    // === Course Data ===
    const COURSES = [
      { id: 'c1', name: '英语商务写作1v1', teacher: 'Sarah Johnson', teacherEn: 'S', flag: '🇺🇸', price: '¥199/节', rating: 4.9, cat: '1v1', avClass: 'av-1' },
      { id: 'c2', name: '日语会话直播班', teacher: '田中加奈', teacherEn: '田', flag: '🇯🇵', price: '¥299/月', rating: 4.8, cat: 'live', avClass: 'av-2' },
      { id: 'c3', name: '法语发音纠音课', teacher: 'Marie Laurent', teacherEn: 'M', flag: '🇫🇷', price: '¥249/节', rating: 4.7, cat: 'record', avClass: 'av-3' }
    ];

    const courseListEl = document.getElementById('course-list');

    function renderCourses(filter) {
      const list = filter === 'all' ? COURSES : COURSES.filter(c => c.cat === filter);
      courseListEl.innerHTML = '';
      if (list.length === 0) {
        courseListEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--xy-ink-tertiary);font-size:var(--text-sm);">该分类下暂无课程</div>';
        return;
      }
      list.forEach(c => {
        const booked = XY.isBooked(c.id);
        const card = document.createElement('div');
        card.className = 'course-card fade-in';
        card.innerHTML = `
          <div class="teacher-avatar ${c.avClass}">
            ${c.teacherEn}
            <span class="flag">${c.flag}</span>
          </div>
          <div class="course-info">
            <div class="course-teacher">${c.teacher}</div>
            <div class="course-title">${c.name}</div>
            <div class="course-meta">
              <span class="course-price">${c.price}</span>
              <span class="course-rating">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                ${c.rating}
              </span>
            </div>
            <button class="btn-book ${booked ? 'booked' : ''}" data-id="${c.id}" ${booked ? 'disabled' : ''}>
              ${booked ? '已预约' : '立即预约'}
            </button>
          </div>
        `;
        courseListEl.appendChild(card);
      });
      // Bind book buttons
      courseListEl.querySelectorAll('.btn-book').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          const id = btn.dataset.id;
          const course = COURSES.find(c => c.id === id);
          if (!course) return;
          const ok = XY.bookCourse({ id: course.id, name: course.name, teacher: course.teacher, price: course.price, rating: course.rating });
          if (ok) {
            btn.textContent = '已预约';
            btn.classList.add('booked');
            btn.disabled = true;
          }
        });
      });
    }

    // Initial render
    renderCourses('all');

    // Course tab switching
    document.querySelectorAll('.course-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.course-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderCourses(tab.dataset.cat);
      });
    });

    // Header buttons
    document.getElementById('btn-search').addEventListener('click', () => {
      XY.toast('搜索功能开发中', 'info');
    });
    document.getElementById('btn-filter').addEventListener('click', () => {
      XY.toast('筛选功能开发中', 'info');
    });

    // Join live
    document.getElementById('btn-join-live').addEventListener('click', () => {
      XY.toast('正在加入直播...', 'info');
    });

    // Books: read buttons
    document.querySelectorAll('.btn-read').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const title = e.currentTarget.parentElement.querySelector('.book-title').textContent;
        XY.toast('正在打开《' + title + '》', 'info');
      });
    });

    // More books link
    document.getElementById('link-more-books').addEventListener('click', () => {
      location.href = 'discuss.html';
    });
  </script>
</body>
</html>
