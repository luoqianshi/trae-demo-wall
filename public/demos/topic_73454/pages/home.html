<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>首页 - 小译 XiaoYi</title>
  <link rel="stylesheet" href="../assets/design.css">
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    .app-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 8px; }
    .app-logo { display: flex; align-items: center; gap: 10px; }
    .app-logo .logo-mark {
      width: 36px; height: 36px; border-radius: var(--radius-lg);
      background: var(--gradient-brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: var(--xy-ink-inverse);
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.3);
    }
    .app-logo .logo-text {
      font-family: var(--font-display); font-size: var(--text-xl); font-weight: 700;
      background: var(--gradient-brand); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .user-avatar {
      width: 38px; height: 38px; border-radius: var(--radius-full);
      background: var(--xy-bg-elevated); border: 2px solid var(--xy-color-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: var(--xy-color-primary);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.2);
      cursor: pointer; transition: box-shadow 0.3s;
    }
    .user-avatar:hover { box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }

    .greeting { padding: 16px 20px 8px; }
    .greeting h2 {
      font-family: var(--font-display); font-size: var(--text-2xl);
      font-weight: 700; line-height: var(--leading-tight);
      color: var(--xy-ink-primary);
    }
    .greeting h2 span {
      background: var(--gradient-brand); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .greeting p { margin-top: 4px; font-size: var(--text-sm); color: var(--xy-ink-secondary); }

    .hero-orb-section { display: flex; justify-content: center; align-items: center; padding: 20px 20px 8px; position: relative; }
    .ai-orb {
      width: 140px; height: 140px; border-radius: 50%; position: relative;
      background: radial-gradient(circle at 40% 35%,
        rgba(34, 211, 238, 0.5) 0%, rgba(45, 212, 191, 0.3) 30%,
        rgba(8, 145, 178, 0.15) 60%, transparent 80%);
      box-shadow: 0 0 40px rgba(34, 211, 238, 0.25), 0 0 80px rgba(45, 212, 191, 0.1), inset 0 0 30px rgba(34, 211, 238, 0.15);
      animation: orb-pulse 4s ease-in-out infinite;
      cursor: pointer;
    }
    .ai-orb::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 1.5px solid rgba(34, 211, 238, 0.2); animation: orb-ring-spin 12s linear infinite; }
    .ai-orb::after { content: ''; position: absolute; inset: -20px; border-radius: 50%; border: 1px solid rgba(45, 212, 191, 0.1); animation: orb-ring-spin 20s linear infinite reverse; }
    .ai-orb-inner { position: absolute; inset: 20px; border-radius: 50%; background: radial-gradient(circle at 45% 40%, rgba(255, 255, 255, 0.12) 0%, transparent 60%); }
    .ai-orb-label {
      position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); border-radius: var(--radius-full);
      padding: 4px 14px; font-size: var(--text-xs); font-weight: 600;
      color: var(--xy-color-primary); white-space: nowrap;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.15);
    }

    .quick-stats { display: flex; gap: 10px; padding: 4px 20px 16px; }
    .stat-card {
      flex: 1;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
      padding: 14px 12px; text-align: center;
    }
    .stat-card .stat-value {
      font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700;
      background: var(--gradient-brand); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .stat-card .stat-label { font-size: var(--text-xs); color: var(--xy-ink-tertiary); margin-top: 2px; }

    .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 4px 20px 16px; }
    .feature-card {
      text-decoration: none;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border); border-radius: var(--radius-xl);
      padding: 14px 10px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
    }
    .feature-card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(ellipse at 50% 0%, rgba(34, 211, 238, 0.06) 0%, transparent 70%); opacity: 0; transition: opacity 0.3s; }
    .feature-card:hover::before { opacity: 1; }
    .feature-card:hover { border-color: rgba(34, 211, 238, 0.25); box-shadow: 0 0 20px rgba(34, 211, 238, 0.1); transform: translateY(-2px); }
    .feature-card:active { transform: scale(0.97); }
    .feature-card .feature-icon {
      width: 42px; height: 42px; border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; position: relative;
    }
    .feature-card .card-title { font-size: var(--text-xs); font-weight: 600; color: var(--xy-ink-primary); text-align: center; line-height: var(--leading-tight); }
    .feature-card .card-desc { font-size: 9px; color: var(--xy-ink-tertiary); text-align: center; line-height: var(--leading-normal); }

    .ic-translate { background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(45, 212, 191, 0.15)); color: var(--xy-color-primary); }
    .ic-camera { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.15)); color: #a5b4fc; }
    .ic-document { background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.15)); color: #fbbf24; }
    .ic-live { background: linear-gradient(135deg, rgba(248, 113, 113, 0.2), rgba(239, 68, 68, 0.15)); color: #f87171; }
    .ic-quiz { background: linear-gradient(135deg, rgba(74, 222, 128, 0.2), rgba(34, 197, 94, 0.15)); color: #4ade80; }
    .ic-speech { background: linear-gradient(135deg, rgba(45, 212, 191, 0.2), rgba(20, 184, 166, 0.15)); color: var(--xy-color-accent); }
    .ic-discuss { background: linear-gradient(135deg, rgba(251, 146, 60, 0.2), rgba(249, 115, 22, 0.15)); color: #fb923c; }
    .ic-culture { background: linear-gradient(135deg, rgba(192, 132, 252, 0.2), rgba(168, 85, 247, 0.15)); color: #c084fc; }
    .ic-more { background: linear-gradient(135deg, rgba(148, 163, 184, 0.15), rgba(100, 116, 139, 0.1)); color: var(--xy-ink-tertiary); }

    .tip-banner {
      margin: 0 20px 16px; padding: 14px 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
      display: flex; align-items: center; gap: 12px;
      position: relative; overflow: hidden; cursor: pointer; transition: border-color 0.3s;
    }
    .tip-banner::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gradient-brand); }
    .tip-banner:hover { border-color: rgba(34, 211, 238, 0.25); }
    .tip-banner .tip-icon { font-size: 24px; flex-shrink: 0; }
    .tip-banner .tip-content { flex: 1; }
    .tip-banner .tip-title { font-size: var(--text-sm); font-weight: 600; color: var(--xy-ink-primary); }
    .tip-banner .tip-text { font-size: var(--text-xs); color: var(--xy-ink-secondary); margin-top: 2px; line-height: var(--leading-normal); }
  </style>
</head>
<body>

    <div class="status-icons">

    </div>
  </div>

  <!-- App Header -->
  <div class="app-header">
    <div class="app-logo">
      <div class="logo-mark">译</div>
      <span class="logo-text">小译 XiaoYi</span>
    </div>
    <a href="profile.html" class="user-avatar" title="我的">W</a>
  </div>

  <!-- Greeting -->
  <div class="greeting">
    <h2>Hi, <span id="greet-text">欢迎回来</span> 👋</h2>
    <p>今天想学点什么?</p>
  </div>

  <!-- AI Orb Hero -->
  <div class="hero-orb-section">
    <div class="ai-orb" id="ai-orb">
      <div class="ai-orb-inner"></div>
    </div>
    <div class="ai-orb-label">✨ AI 语言引擎就绪</div>

  <!-- Quick Stats -->
  <div class="quick-stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-days">128</div>

    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-vocab">3.2k</div>
      <div class="stat-label">已学词汇</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">🏆 12</div>
      <div class="stat-label">获得成就</div>
    </div>
  </div>

  <!-- Feature Section -->
  <div class="section-title">功能中心</div>
  <div class="feature-grid">
    <a class="feature-card" href="translate.html">
      <div class="feature-icon ic-translate">🌐</div>

      <div class="card-desc">智能多语翻译</div>

    <a class="feature-card" href="translate.html?mode=camera">

    <a class="feature-card" href="translate.html?mode=document">

      <div class="card-desc">文件批量译</div>
    </a>
    <a class="feature-card" href="studyroom.html">
      <div class="feature-icon ic-live">🎤</div>
      <div class="card-title">会议弹幕</div>
      <div class="card-desc">实时字幕</div>
    </a>
    <a class="feature-card" href="learn.html">
      <div class="feature-icon ic-quiz">📝</div>
      <div class="card-title">刷题题库</div>
      <div class="card-desc">海量真题</div>
    </a>
    <a class="feature-card" href="courses.html">
      <div class="feature-icon ic-speech">🎙</div>
      <div class="card-title">口语练习</div>
      <div class="card-desc">AI 对话练</div>
    </a>
    <a class="feature-card" href="discuss.html">
      <div class="feature-icon ic-discuss">💬</div>
      <div class="card-title">讨论区</div>
      <div class="card-desc">学友交流</div>
    </a>
    <a class="feature-card" href="culture.html">
      <div class="feature-icon ic-culture">🏛</div>
      <div class="card-title">文化广场</div>
      <div class="card-desc">文化探索</div>
    </a>
    <a class="feature-card" href="#" id="more-feature">
      <div class="feature-icon ic-more">➕</div>
      <div class="card-title">更多功能</div>
      <div class="card-desc">敬请期待</div>
    </a>
  </div>

  <!-- Daily Tip -->
  <div class="section-title">每日推荐</div>
  <div class="tip-banner" id="daily-tip">
    <span class="tip-icon">💡</span>
    <div class="tip-content">

      <div class="tip-text" id="tip-text">"Break a leg" 并不是要摔断腿，而是祝你好运的意思!</div>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar">
    <a class="tab-item active" href="home.html">

      <span class="tab-label">首页</span>
    </a>
    <a class="tab-item" href="translate.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 0"/><path d="M8 2l0 6"/><path d="M2 14l2 6 2-6"/><path d="M4 14h2"/><path d="M12 2v4a4 4 0 0 1 4 4v1"/><path d="M12 11h-1a3 3 0 0 0 0 6h1"/><path d="M17 11h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4"/><path d="M17 11v8"/></svg>
      <span class="tab-label">翻译</span>
    </a>
    <a class="tab-item" href="learn.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="tab-label">学习</span>
    </a>
    <a class="tab-item" href="courses.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      <span class="tab-label">课程</span>

    <a class="tab-item" href="profile.html">

  </nav>

  <script src="../assets/common.js"></script>
  <script>
    // Greeting based on time
    (function() {
      const h = new Date().getHours();
      let greet = '欢迎回来';
      if (h < 6) greet = '夜深了';
      else if (h < 11) greet = '早安';
      else if (h < 14) greet = '午安';
      else if (h < 18) greet = '下午好';
      else greet = '晚上好';
      document.getElementById('greet-text').textContent = greet;

      // Sync stats from store
      const u = XY.store.user;
      document.getElementById('stat-days').textContent = u.studyDays;
      document.getElementById('stat-vocab').textContent = (u.vocabLearned / 1000).toFixed(1) + 'k';
    })();

    // AI orb click -> go to translate
    document.getElementById('ai-orb').addEventListener('click', () => {
      location.href = 'translate.html';
    });

    // Daily tips pool
    const tips = [
      '"Break a leg" 并不是要摔断腿，而是祝你好运的意思!',
      '"Piece of cake" 形容某事非常容易，像吃块蛋糕一样简单。',
      '日语中的「よろしくお願いします」根据场合有完全不同的含义。',
      '" raining cats and dogs" 是英语俚语，意为倾盆大雨。',
      '法语 "Bonjour" 既可作"你好"也可作"早安"，是最百搭的问候语。',
      '韩语中敬语使用错误会造成很大误会，初次见面请用 -ㅂ니다 结尾。',
      '"Bite the bullet" 意为硬着头皮做某事，源自战地医疗传统。',
      '德语中所有名词首字母都要大写，这在欧洲语言中很独特。'
    ];
    const today = new Date().getDate();
    document.getElementById('tip-text').textContent = tips[today % tips.length];

    document.getElementById('daily-tip').addEventListener('click', () => {
      XY.toast('已收藏今日小贴士 ✨', 'success');
    });

    document.getElementById('more-feature').addEventListener('click', (e) => {
      e.preventDefault();
      XY.toast('更多功能正在开发中，敬请期待', 'info');
    });
  </script>
</body>
</html>
