<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学习中心 - 小译 XiaoYi</title>
  <link rel="stylesheet" href="../assets/design.css">
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    /* ===== Glow helpers ===== */
    .glow-cyan { box-shadow: 0 0 12px rgba(34,211,238,0.25), 0 0 30px rgba(34,211,238,0.08); }
    .glow-text-cyan { text-shadow: 0 0 12px rgba(34,211,238,0.6); }

    /* ===== Header ===== */
    .learn-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px 4px;
    }
    .learn-header h1 {
      font-family: var(--font-display);
      font-size: var(--text-2xl); font-weight: 700;
      color: var(--xy-ink-primary);
    }
    .streak-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: var(--radius-full);
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.18), rgba(245, 158, 11, 0.12));
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fbbf24;
      font-size: var(--text-xs); font-weight: 700;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.18);
    }
    .streak-badge svg { width: 14px; height: 14px; }

    /* ===== Stats Row ===== */
    .stats-row {
      display: flex; gap: 10px; padding: 12px 20px 8px;
    }
    .stat-pill {
      flex: 1;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 12px 10px; text-align: center;
    }
    .stat-pill .stat-num {
      font-family: var(--font-display);
      font-size: var(--text-2xl); font-weight: 700;
      background: var(--gradient-brand);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-pill .stat-name {
      font-size: var(--text-xs); color: var(--xy-ink-tertiary); margin-top: 2px;
    }

    /* ===== Function Tabs ===== */
    .func-tabs {
      display: flex; gap: 8px; padding: 12px 20px 8px;
    }
    .func-tab {
      flex: 1; padding: 9px 6px;
      border-radius: var(--radius-full);
      background: var(--xy-color-primary-muted);
      border: 1px solid transparent;
      color: var(--xy-ink-secondary);
      font-size: var(--text-sm); font-weight: 600;
      cursor: pointer; transition: all 0.25s;
      text-align: center;
    }
    .func-tab:hover { color: var(--xy-color-primary); }
    .func-tab.active {
      background: var(--gradient-brand); color: var(--xy-ink-inverse);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.35);
    }

    /* ===== Chips ===== */
    .chips-row {
      display: flex; gap: 8px; padding: 4px 20px 12px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 6px 14px; border-radius: var(--radius-full);
      background: var(--xy-bg-elevated);
      border: 1px solid var(--xy-border-default);
      color: var(--xy-ink-secondary);
      font-size: var(--text-sm); font-weight: 600;
      cursor: pointer; transition: all 0.25s;
    }
    .chip:hover { border-color: var(--xy-color-primary-muted); }
    .chip.active {
      background: var(--xy-color-primary-muted);
      border-color: var(--xy-color-primary);
      color: var(--xy-color-primary);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.18);
    }

    /* ===== Quiz Card ===== */
    .quiz-card {
      margin: 0 20px 12px;
      padding: 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      animation: fade-in 0.4s ease-out;
    }
    .quiz-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .quiz-no {
      font-family: var(--font-mono);
      font-size: var(--text-sm); font-weight: 700;
      color: var(--xy-color-primary);
    }
    .difficulty-tag {
      padding: 3px 10px; border-radius: var(--radius-full);
      font-size: var(--text-xs); font-weight: 600;
    }
    .diff-easy   { background: rgba(74, 222, 128, 0.14); color: var(--state-success); }
    .diff-medium { background: rgba(251, 191, 36, 0.14); color: var(--state-warning); }
    .diff-hard   { background: rgba(248, 113, 113, 0.14); color: var(--state-error); }
    .quiz-category {
      display: inline-block; margin-bottom: 8px;
      font-size: var(--text-xs); color: var(--xy-ink-tertiary);
    }
    .quiz-question {
      font-family: var(--font-display);
      font-size: var(--text-lg); font-weight: 600;
      color: var(--xy-ink-primary);
      line-height: var(--leading-relaxed);
      margin-bottom: 14px;
    }

    .option-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 12px 14px; margin-bottom: 8px;
      border-radius: var(--radius-md);
      background: var(--xy-bg-elevated);
      border: 1px solid var(--xy-border-default);
      color: var(--xy-ink-primary);
      font-size: var(--text-base); text-align: left;
      cursor: pointer; transition: all 0.2s;
    }
    .option-btn:hover:not(.locked):not(.correct):not(.wrong) {
      border-color: var(--xy-color-primary-muted);
      background: var(--xy-color-primary-subtle);
    }
    .option-btn:last-child { margin-bottom: 0; }
    .option-label {
      width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--xy-bg-sunken);
      color: var(--xy-ink-secondary);
      font-size: var(--text-sm); font-weight: 700; flex-shrink: 0;
    }
    .option-btn.correct {
      background: var(--state-success-bg);
      border-color: var(--state-success);
      color: var(--state-success);
      box-shadow: 0 0 14px rgba(74, 222, 128, 0.22);
    }
    .option-btn.correct .option-label {
      background: var(--state-success); color: var(--xy-ink-inverse);
    }
    .option-btn.wrong {
      background: var(--state-error-bg);
      border-color: var(--state-error);
      color: var(--state-error);
    }
    .option-btn.wrong .option-label {
      background: var(--state-error); color: var(--xy-ink-inverse);
    }
    .option-btn.locked { cursor: not-allowed; }

    .next-btn {
      display: none;
      width: 100%; margin-top: 12px;
      padding: 11px 0; border-radius: var(--radius-md);
      background: var(--gradient-brand); color: var(--xy-ink-inverse);
      border: none; cursor: pointer;
      font-size: var(--text-base); font-weight: 600;
      box-shadow: 0 2px 10px rgba(34, 211, 238, 0.3);
      transition: transform 0.2s;
    }
    .next-btn:hover { transform: translateY(-1px); }
    .next-btn:active { transform: scale(0.97); }

    /* ===== Progress Section ===== */
    .progress-section {
      margin: 4px 20px 12px;
      padding: 14px 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
    }
    .progress-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .progress-top .pt-label {
      font-size: var(--text-sm); font-weight: 600; color: var(--xy-ink-primary);
    }
    .progress-top .progress-pct {
      font-family: var(--font-mono);
      font-size: var(--text-sm); font-weight: 700;
      color: var(--xy-color-primary);
    }
    .progress-bar {
      height: 6px; border-radius: var(--radius-full);
      background: var(--xy-bg-sunken);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--gradient-brand);
      border-radius: var(--radius-full);
      box-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
      transition: width 0.5s ease;
    }

    /* ===== Error Book ===== */
    .error-book { padding: 4px 20px 100px; }
    .error-book .section-title { padding: 8px 0 10px; }
    .error-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; margin-bottom: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      cursor: pointer; transition: all 0.25s;
    }
    .error-item:hover { border-color: rgba(34, 211, 238, 0.25); }
    .error-icon {
      width: 38px; height: 38px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .ic-en  { background: rgba(34, 211, 238, 0.16); color: var(--xy-color-primary); }
    .ic-jp  { background: rgba(248, 113, 113, 0.16); color: #f87171; }
    .ic-biz { background: rgba(251, 191, 36, 0.16); color: #fbbf24; }
    .error-body { flex: 1; min-width: 0; }
    .error-topic {
      font-size: var(--text-sm); font-weight: 600;
      color: var(--xy-ink-primary);
    }
    .error-detail {
      font-size: var(--text-xs); color: var(--xy-ink-secondary);
      margin-top: 2px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .error-arrow {
      color: var(--xy-ink-tertiary); flex-shrink: 0;
    }
  </style>
</head>

  <script>
    (function () {
      /* === Sync streak from store === */
      const streak = XY.store.user.streak || 0;
      document.getElementById('streak-text').textContent = '连续' + streak + '天';

      /* === Question bank === */
      const questionBank = [
        {
          q: 'The company has ____ a new policy regarding remote work.',
          options: [
            { label: 'A', text: 'adapted', correct: false },
            { label: 'B', text: 'adopted', correct: false },
            { label: 'C', text: 'implemented', correct: true },
            { label: 'D', text: 'establishing', correct: false }
          ],
          difficulty: 'medium',
          category: '英语四级 · 词汇',
          no: '#023'
        },
        {
          q: 'Choose the correct synonym for "ubiquitous":',
          options: [
            { label: 'A', text: 'rare', correct: false },
            { label: 'B', text: 'everywhere', correct: true },
            { label: 'C', text: 'unique', correct: false },
            { label: 'D', text: 'invisible', correct: false }
          ],
          difficulty: 'hard',
          category: 'TOEFL · 词汇',
          no: '#041'
        },
        {
          q: '次の文の（  ）に入る最も適当な言葉を選びなさい：明日はきっと（  ）晴れるでしょう。',
          options: [
            { label: 'A', text: 'きっと', correct: false },
            { label: 'B', text: 'よく', correct: false },
            { label: 'C', text: 'また', correct: false },
            { label: 'D', text: 'はれて', correct: true }
          ],
          difficulty: 'medium',
          category: '日语N2 · 语法',
          no: '#017'
        },
        {
          q: 'In a business email, which closing is the most formal?',
          options: [
            { label: 'A', text: 'Cheers,', correct: false },
            { label: 'B', text: 'Best,', correct: false },
            { label: 'C', text: 'Sincerely,', correct: true },
            { label: 'D', text: 'Bye!', correct: false }
          ],
          difficulty: 'easy',
          category: '商务英语 · 写作',
          no: '#009'
        },
        {
          q: 'The negotiations ____ successfully after three days of intense discussion.',
          options: [
            { label: 'A', text: 'concluded', correct: true },
            { label: 'B', text: 'finished', correct: false },
            { label: 'C', text: 'completed', correct: false },
            { label: 'D', text: 'ending', correct: false }
          ],
          difficulty: 'hard',
          category: '商务英语 · 词汇',
          no: '#031'
        },
        {
          q: '彼は毎日図書館で5時間（  ）勉強しています。',
          options: [
            { label: 'A', text: 'ぐらい', correct: true },
            { label: 'B', text: 'ごろ', correct: false },
            { label: 'C', text: 'しか', correct: false },
            { label: 'D', text: 'まで', correct: false }
          ],
          difficulty: 'easy',
          category: '日语N2 · 语法',
          no: '#012'
        },
        {
          q: 'Which sentence is grammatically correct?',
          options: [
            { label: 'A', text: 'I have been to Paris last year.', correct: false },
            { label: 'B', text: 'I went to Paris last year.', correct: true },
            { label: 'C', text: 'I am going Paris last year.', correct: false },
            { label: 'D', text: 'I gone to Paris last year.', correct: false }
          ],
          difficulty: 'easy',
          category: '英语四级 · 语法',
          no: '#005'
        }
      ];

      const diffMap = {
        easy:   { cls: 'diff-easy',   text: '简单' },
        medium: { cls: 'diff-medium', text: '中等' },
        hard:   { cls: 'diff-hard',   text: '困难' }
      };

      /* === State === */
      let currentQuestion = questionBank[0];
      let answeredCurrent = false;

      /* === Render question === */
      function renderQuestion(q) {
        document.getElementById('quiz-no').textContent = q.no;
        const diff = diffMap[q.difficulty] || diffMap.medium;
        const diffEl = document.getElementById('quiz-difficulty');
        diffEl.className = 'difficulty-tag ' + diff.cls;
        diffEl.textContent = diff.text;
        document.getElementById('quiz-category').textContent = q.category;
        document.getElementById('quiz-question').textContent = q.q;

        const list = document.getElementById('options-list');
        list.innerHTML = '';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.dataset.label = opt.label;
          btn.innerHTML =
            '<span class="option-label">' + opt.label + '</span>' +
            '<span class="option-text">' + opt.text + '</span>';
          btn.addEventListener('click', () => handleAnswer(opt, btn));
          list.appendChild(btn);
        });

        answeredCurrent = false;
        document.getElementById('next-btn').style.display = 'none';
      }

      /* === Handle answer === */
      function handleAnswer(opt, btn) {
        if (answeredCurrent) return;
        answeredCurrent = true;

        const isCorrect = !!opt.correct;
        XY.recordQuiz(isCorrect);

        // Mark correct option
        const allBtns = document.querySelectorAll('#options-list .option-btn');
        allBtns.forEach(b => {
          b.classList.add('locked');
          const label = b.dataset.label;
          const optData = currentQuestion.options.find(o => o.label === label);
          if (optData && optData.correct) {
            b.classList.add('correct');
          }
        });

        // Mark wrong if user's choice was wrong
        if (!isCorrect) {
          btn.classList.add('wrong');
        }

        // Show next button
        document.getElementById('next-btn').style.display = 'block';

        // Refresh stats
        refreshStats();

        if (isCorrect) {
          XY.toast('回答正确！🎉', 'success', 1200);
        } else {
          XY.toast('答案不对，再接再厉', 'error', 1200);
        }
      }

      /* === Refresh stats === */
      function refreshStats() {
        const qp = XY.store.quizProgress;
        const answered = qp.answered || 0;
        const correct = qp.correct || 0;
        const total = qp.total || 50;
        const acc = answered > 0 ? Math.round((correct / answered) * 100) : 0;

        document.getElementById('stat-answered').textContent = answered;
        document.getElementById('stat-accuracy').textContent = acc + '%';
        document.getElementById('progress-pct').textContent = answered + '/' + total;
        const pct = total > 0 ? Math.min(100, (answered / total) * 100) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
      }

      /* === Next question (random, avoid repeat of current) === */
      function nextQuestion() {
        let pool = questionBank.filter(q => q !== currentQuestion);
        if (pool.length === 0) pool = questionBank;
        const idx = Math.floor(Math.random() * pool.length);
        currentQuestion = pool[idx];
        renderQuestion(currentQuestion);
      }

      /* === Bind next === */
      document.getElementById('next-btn').addEventListener('click', nextQuestion);

      /* === Function tabs === */
      document.querySelectorAll('.func-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const func = tab.dataset.func;
          if (func === 'speech') {
            location.href = 'studyroom.html';
            return;
          }
          document.querySelectorAll('.func-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          if (func === 'error') {
            XY.toast('错题本已打开，向下滚动查看', 'info');
          } else {
            XY.toast('已切换到题库模式', 'info');
          }
        });
      });

      /* === Chips === */
      document.querySelectorAll('#chips-row .chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('#chips-row .chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          XY.toast('已切换到「' + chip.dataset.cat + '」', 'info', 1200);
        });
      });

      /* === Error items click === */
      document.querySelectorAll('.error-item').forEach(item => {
        item.addEventListener('click', () => {
          XY.toast('错题详情即将上线', 'info');
        });
      });

      /* === FAB === */
      document.getElementById('camera-fab').addEventListener('click', () => {
        XY.toast('拍照搜题功能开启中...', 'info');
      });

      /* === Init === */
      renderQuestion(currentQuestion);
      refreshStats();
    })();
  </script>
</body>
</html>
