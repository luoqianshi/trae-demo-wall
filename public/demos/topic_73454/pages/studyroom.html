<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自习室 - 小译 XiaoYi</title>
  <link rel="stylesheet" href="../assets/design.css">
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    /* ===== Body decorative glow ===== */
    body::before {
      content: '';
      position: fixed;
      top: -80px; left: 50%; transform: translateX(-50%);
      width: 420px; height: 320px;
      background: radial-gradient(ellipse at center, rgba(34, 211, 238, 0.08) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== Header ===== */
    .room-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px 4px;
      position: relative; z-index: 1;
    }
    .room-header h1 {
      font-family: var(--font-display);
      font-size: var(--text-2xl); font-weight: 700;
      color: var(--xy-ink-primary);
    }
    .btn-create {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 7px 14px; border-radius: var(--radius-full);
      background: var(--gradient-brand); color: var(--xy-ink-inverse);
      border: none; cursor: pointer;
      font-size: var(--text-xs); font-weight: 700;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.3);
      transition: transform 0.2s;
    }
    .btn-create:hover { transform: translateY(-1px); }
    .btn-create:active { transform: scale(0.96); }
    .btn-create svg { width: 14px; height: 14px; }

    /* ===== Category Scroll ===== */
    .category-scroll {
      display: flex; gap: 8px; padding: 10px 20px 12px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      position: relative; z-index: 1;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0;
      padding: 6px 16px; border-radius: var(--radius-full);
      background: var(--xy-bg-elevated);
      border: 1px solid var(--xy-border-default);
      color: var(--xy-ink-secondary);
      font-size: var(--text-sm); font-weight: 600;
      cursor: pointer; transition: all 0.25s;
    }
    .cat-pill:hover { border-color: var(--xy-color-primary-muted); color: var(--xy-color-primary); }
    .cat-pill.active {
      background: var(--gradient-brand); color: var(--xy-ink-inverse);
      border-color: transparent;
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
    }

    /* ===== Active Room (my study room) ===== */
    .active-room {
      margin: 0 20px 16px;
      padding: 18px 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1.5px solid var(--xy-color-primary-muted);
      border-radius: var(--radius-xl);
      position: relative; overflow: hidden;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.12);
      animation: fade-in 0.4s ease-out;
    }
    .active-room::before {
      content: ''; position: absolute; inset: -1.5px;
      border-radius: var(--radius-xl); padding: 1.5px;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.6), rgba(45, 212, 191, 0.2), rgba(34, 211, 238, 0.6));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: border-glow 2s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .room-tag-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .room-tag-row .my-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: var(--radius-full);
      background: var(--xy-color-primary-muted);
      color: var(--xy-color-primary);
      font-size: var(--text-xs); font-weight: 700;
    }
    .room-tag-row .live-dot {
      display: inline-flex; align-items: center; gap: 5px;
      color: #4ade80;
      font-size: var(--text-xs); font-weight: 600;
    }
    .live-dot::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 6px #4ade80;
      animation: pulse-dot 1.6s ease-in-out infinite;
    }
    .room-name {
      font-family: var(--font-display);
      font-size: var(--text-lg); font-weight: 700;
      color: var(--xy-ink-primary); margin-bottom: 12px;
    }

    /* ===== Timer ===== */
    .timer-display {
      font-family: var(--font-mono);
      font-size: 32px; font-weight: 700;
      background: var(--gradient-brand);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
      margin-bottom: 12px;
    }

    /* ===== Avatars row ===== */
    .avatars-row {
      display: flex; align-items: center;
      margin-bottom: 14px;
    }
    .avatar-mini {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-sm); font-weight: 700;
      color: #fff; border: 2px solid var(--xy-bg-primary);
      margin-left: -8px; flex-shrink: 0;
    }
    .avatar-mini:first-child { margin-left: 0; }
    .av-a { background: linear-gradient(135deg, #22d3ee, #06b6d4); }
    .av-b { background: linear-gradient(135deg, #f472b6, #db2777); }
    .av-c { background: linear-gradient(135deg, #facc15, #f59e0b); }
    .av-d { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
    .avatars-online {
      margin-left: 10px;
      font-size: var(--text-xs); color: var(--xy-ink-secondary);
    }

    /* ===== Progress Ring ===== */
    .progress-ring-wrap {
      display: flex; align-items: center; gap: 14px;
      padding-top: 6px;
      border-top: 1px dashed var(--xy-border-default);
    }
    .progress-ring {
      width: 64px; height: 64px; position: relative; flex-shrink: 0;
    }
    .progress-ring svg {
      width: 64px; height: 64px; transform: rotate(-90deg);
    }
    .progress-ring .ring-bg {
      fill: none; stroke: var(--xy-bg-sunken); stroke-width: 6;
    }
    .progress-ring .ring-fill {
      fill: none;
      stroke: url(#xy-grad);
      stroke-width: 6; stroke-linecap: round;
      filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.5));
    }
    .progress-ring .ring-pct {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 700;
      color: var(--xy-color-primary);
    }
    .progress-ring-info { flex: 1; }
    .pri-title {
      font-size: var(--text-xs); color: var(--xy-ink-tertiary);
    }
    .pri-detail {
      font-size: var(--text-sm); font-weight: 600;
      color: var(--xy-ink-primary);
      margin-top: 2px;
    }
    .pri-detail span {
      color: var(--xy-color-primary);
    }

    /* ===== Room cards ===== */
    .room-list { padding: 0 20px 16px; }
    .room-card {
      display: flex; align-items: center; gap: 12px;
      padding: 14px;
      margin-bottom: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      transition: all 0.25s;
    }
    .room-card:hover { border-color: rgba(34, 211, 238, 0.25); }
    .room-emoji {
      width: 44px; height: 44px; border-radius: var(--radius-md);
      background: var(--xy-bg-elevated);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .room-info { flex: 1; min-width: 0; }
    .room-title {
      font-size: var(--text-base); font-weight: 600;
      color: var(--xy-ink-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .room-meta {
      display: flex; align-items: center; gap: 6px;
      margin-top: 3px;
    }
    .room-tag {
      padding: 2px 8px; border-radius: var(--radius-full);
      background: var(--xy-color-primary-muted);
      color: var(--xy-color-primary);
      font-size: 9px; font-weight: 700;
    }
    .room-online {
      font-size: var(--text-xs); color: var(--xy-ink-tertiary);
    }
    .btn-join {
      flex-shrink: 0;
      padding: 7px 14px; border-radius: var(--radius-full);
      background: var(--xy-color-primary-muted);
      color: var(--xy-color-primary);
      border: 1px solid transparent;
      font-size: var(--text-xs); font-weight: 700;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-join:hover { border-color: var(--xy-color-primary); }
    .btn-join.joined {
      background: var(--state-success-bg);
      color: var(--state-success);
    }

    /* ===== Leaderboard ===== */
    .leaderboard { padding: 0 20px 100px; }
    .rank-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; margin-bottom: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
    }
    .rank-num {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: var(--text-base); font-weight: 800;
      flex-shrink: 0;
    }
    .rank-1 { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #7c2d12; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
    .rank-2 { background: linear-gradient(135deg, #e5e7eb, #9ca3af); color: #374151; box-shadow: 0 0 8px rgba(156, 163, 175, 0.3); }
    .rank-3 { background: linear-gradient(135deg, #fed7aa, #d97706); color: #7c2d12; box-shadow: 0 0 8px rgba(217, 119, 6, 0.3); }
    .rank-info { flex: 1; }
    .rank-name {
      font-size: var(--text-sm); font-weight: 600;
      color: var(--xy-ink-primary);
    }
    .rank-meta {
      font-size: var(--text-xs); color: var(--xy-ink-tertiary);
      margin-top: 1px;
    }
    .rank-time {
      font-family: var(--font-mono);
      font-size: var(--text-sm); font-weight: 700;
      color: var(--xy-color-primary);
    }
  </style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <div class="bar"></div>
      <div class="wifi"></div>
      <div class="battery"></div>
    </div>
  </div>

  <!-- Header -->
  <div class="room-header">
    <h1>自习室</h1>
    <button class="btn-create" id="btn-create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      创建自习室
    </button>
  </div>

  <!-- Category Scroll -->
  <div class="category-scroll" id="category-scroll">
    <button class="cat-pill active" data-cat="all">全部</button>
    <button class="cat-pill" data-cat="en">英语</button>
    <button class="cat-pill" data-cat="jp">日语</button>
    <button class="cat-pill" data-cat="kr">韩语</button>
    <button class="cat-pill" data-cat="fr">法语</button>
    <button class="cat-pill" data-cat="other">其他</button>
  </div>

  <!-- Active Room -->
  <div class="active-room">
    <div class="room-tag-row">
      <span class="my-tag">我的自习室</span>
      <span class="live-dot">在线学习中</span>
    </div>
    <div class="room-name">英语角 · 每日打卡</div>

    <div class="timer-display" id="timer-display">01:23:45</div>

    <div class="avatars-row">
      <div class="avatar-mini av-a">L</div>
      <div class="avatar-mini av-b">K</div>
      <div class="avatar-mini av-c">M</div>
      <div class="avatar-mini av-d">W</div>
      <span class="avatars-online">等12人在线</span>
    </div>

    <div class="progress-ring-wrap">
      <div class="progress-ring">
        <svg viewBox="0 0 64 64">
          <defs>
            <linearGradient id="xy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#22d3ee"/>
              <stop offset="100%" stop-color="#2dd4bf"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="32" cy="32" r="28"/>
          <circle class="ring-fill" cx="32" cy="32" r="28"
                  stroke-dasharray="175.93"
                  stroke-dashoffset="52.78"/>
        </svg>
        <div class="ring-pct">70%</div>
      </div>
      <div class="progress-ring-info">
        <div class="pri-title">今日目标</div>
        <div class="pri-detail">已完成 <span>1.75h</span> / 2.5h</div>
      </div>
    </div>
  </div>

  <!-- Public Rooms -->
  <div class="section-title">公开自习室</div>
  <div class="room-list">
    <div class="room-card" data-id="toefl-room">
      <div class="room-emoji">📚</div>
      <div class="room-info">
        <div class="room-title">TOEFL备考自习室</div>
        <div class="room-meta">
          <span class="room-tag">英语</span>
          <span class="room-online">28人在线</span>
        </div>
      </div>
      <button class="btn-join" data-room-name="TOEFL备考自习室" data-room-id="toefl-room">加入</button>
    </div>

    <div class="room-card" data-id="jp-n1-room">
      <div class="room-emoji">🎌</div>
      <div class="room-info">
        <div class="room-title">日语N1冲刺</div>
        <div class="room-meta">
          <span class="room-tag">日语</span>
          <span class="room-online">15人在线</span>
        </div>
      </div>
      <button class="btn-join" data-room-name="日语N1冲刺" data-room-id="jp-n1-room">加入</button>
    </div>

    <div class="room-card" data-id="biz-en-room">
      <div class="room-emoji">💼</div>
      <div class="room-info">
        <div class="room-title">商务英语交流</div>
        <div class="room-meta">
          <span class="room-tag">商务</span>
          <span class="room-online">22人在线</span>
        </div>
      </div>
      <button class="btn-join" data-room-name="商务英语交流" data-room-id="biz-en-room">加入</button>
    </div>
  </div>

  <!-- Leaderboard -->
  <div class="section-title">今日学习时长</div>
  <div class="leaderboard">
    <div class="rank-item">
      <div class="rank-num rank-1">1</div>
      <div class="rank-info">
        <div class="rank-name">林小雨</div>
        <div class="rank-meta">连续学习 30 天</div>
      </div>
      <div class="rank-time">4h 32m</div>
    </div>
    <div class="rank-item">
      <div class="rank-num rank-2">2</div>
      <div class="rank-info">
        <div class="rank-name">陈思远</div>
        <div class="rank-meta">连续学习 21 天</div>
      </div>
      <div class="rank-time">3h 58m</div>
    </div>
    <div class="rank-item">
      <div class="rank-num rank-3">3</div>
      <div class="rank-info">
        <div class="rank-name">张文博</div>
        <div class="rank-meta">连续学习 14 天</div>
      </div>
      <div class="rank-time">3h 15m</div>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar">
    <a class="tab-item" href="home.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="tab-label">首页</span>
    </a>
    <a class="tab-item" href="translate.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 0"/><path d="M8 2l0 6"/><path d="M2 14l2 6 2-6"/><path d="M4 14h2"/><path d="M12 2v4a4 4 0 0 1 4 4v1"/><path d="M12 11h-1a3 3 0 0 0 0 6h1"/><path d="M17 11h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4"/><path d="M17 11v8"/></svg>
      <span class="tab-label">翻译</span>
    </a>
    <a class="tab-item active" href="learn.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="tab-label">学习</span>
    </a>
    <a class="tab-item" href="courses.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      <span class="tab-label">课程</span>
    </a>
    <a class="tab-item" href="profile.html">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="tab-label">我的</span>
    </a>
  </nav>

  <script src="../assets/common.js"></script>
  <script>
    (function () {
      /* === Create room button === */
      document.getElementById('btn-create').addEventListener('click', () => {
        XY.toast('创建自习室功能即将上线', 'info');
      });

      /* === Category pills === */
      document.querySelectorAll('#category-scroll .cat-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('#category-scroll .cat-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
        });
      });

      /* === Timer (study time accumulator) === */
      const timerEl = document.getElementById('timer-display');
      let seconds = XY.store.studyTimeSeconds || 5025;
      // initial render
      timerEl.textContent = XY.formatTime(seconds);
      setInterval(() => {
        seconds += 1;
        timerEl.textContent = XY.formatTime(seconds);
      }, 1000);

      /* === Join room buttons === */
      const joinedRooms = XY.store.joinedRooms || (XY.store.joinedRooms = []);

      function refreshJoinButtons() {
        document.querySelectorAll('.btn-join').forEach(btn => {
          const roomId = btn.dataset.roomId;
          if (joinedRooms.indexOf(roomId) >= 0) {
            btn.classList.add('joined');
            btn.textContent = '已加入';
          } else {
            btn.classList.remove('joined');
            btn.textContent = '加入';
          }
        });
      }

      document.querySelectorAll('.btn-join').forEach(btn => {
        btn.addEventListener('click', () => {
          const roomId = btn.dataset.roomId;
          const roomName = btn.dataset.roomName;
          if (joinedRooms.indexOf(roomId) >= 0) {
            XY.toast('已在房间中', 'info');
            return;
          }
          joinedRooms.push(roomId);
          XY.save();
          refreshJoinButtons();
          XY.toast('已加入「' + roomName + '」', 'success');
        });
      });

      /* === Init === */
      refreshJoinButtons();
    })();
  </script>
</body>
</html>
