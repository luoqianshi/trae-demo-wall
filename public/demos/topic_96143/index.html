<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参考文献格式对照生成表</title>
    <!-- Tailwind 本地加载（避免 CDN 超时导致页面空白），加载失败时回退到 CDN -->
    <script>
        // 防御性兜底：如果本地 tailwind.js 加载失败，5 秒后自动尝试 CDN
        (function() {
            window.__tailwindLoaded = false;
            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (!window.tailwind) {
                        console.warn('本地 Tailwind 加载失败，尝试 CDN 回退...');
                        var s = document.createElement('script');
                        s.src = 'https://cdn.tailwindcss.com';
                        s.onerror = function() { console.error('Tailwind CDN 也加载失败，样式将不可用'); };
                        document.head.appendChild(s);
                    }
                }, 3000);
            });
        })();
    </script>
    <script src="tailwind.js" onerror="console.warn('本地 tailwind.js 加载失败')"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        // 等 tailwind 加载完成后配置（如果加载失败此项不会执行，不影响页面其他部分）
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: '#3b82f6',
                            secondary: '#64748b',
                            accent: '#10b981',
                            neutral: '#f1f5f9',
                            'neutral-dark': '#334155'
                        },
                        fontFamily: {
                            sans: ['Inter', 'system-ui', 'sans-serif']
                        }
                    }
                }
            };
        } else {
            // tailwind 未加载时延迟配置
            document.addEventListener('DOMContentLoaded', function() {
                if (typeof tailwind !== 'undefined') {
                    tailwind.config = {
                        theme: {
                            extend: {
                                colors: { primary: '#3b82f6', secondary: '#64748b', accent: '#10b981', neutral: '#f1f5f9', 'neutral-dark': '#334155' },
                                fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                            }
                        }
                    };
                }
            });
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-thin {
                scrollbar-width: thin;
            }
            .scrollbar-thin::-webkit-scrollbar {
                width: 6px;
            }
            .scrollbar-thin::-webkit-scrollbar-track {
                background: #f1f5f9;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 3px;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-2 flex justify-between items-center">
            <h1 class="text-lg font-bold text-primary flex items-center">
                <i class="fa fa-book mr-2"></i>
                参考文献格式对照
            </h1>
            <nav>
                <ul class="flex space-x-4">
                    <li>
                        <button id="nav-import" class="text-primary font-medium border-b-2 border-primary px-1 py-1 text-sm">
                            <i class="fa fa-upload mr-1"></i> 导入
                        </button>
                    </li>
                    <li>
                        <button id="nav-export" class="text-secondary font-medium hover:text-primary px-1 py-1 text-sm">
                            <i class="fa fa-download mr-1"></i> 导出
                        </button>
                    </li>
                    <li>
                        <button id="nav-database" class="text-secondary font-medium hover:text-primary px-1 py-1 text-sm">
                            <i class="fa fa-database mr-1"></i> 数据库
                        </button>
                    </li>
                    <li>
                        <button id="nav-settings" class="text-secondary font-medium hover:text-primary px-1 py-1 text-sm">
                            <i class="fa fa-cog mr-1"></i> 设置
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-4">
        <div class="flex flex-col lg:flex-row gap-4">
            <!-- 左侧数据库面板 -->
            <div class="lg:w-1/3 bg-white rounded-lg shadow-sm p-3">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-semibold text-neutral-dark">数据库管理</h2>
                    <button id="btn-add-entry" class="bg-primary text-white px-2 py-1 rounded-md text-xs flex items-center hover:bg-blue-600 transition-colors">
                        <i class="fa fa-plus mr-1"></i> 添加
                    </button>
                </div>
                <div class="flex items-center mb-3">
                    <input type="text" id="search-entry" placeholder="搜索..." class="flex-1 border border-gray-300 rounded-l-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    <button id="btn-clear-search" class="bg-gray-200 text-gray-600 px-2 py-1 rounded-r-md hover:bg-gray-300 transition-colors">
                        <i class="fa fa-times text-xs"></i>
                    </button>
                </div>
                <div id="database-list" class="max-h-[400px] md:max-h-[500px] overflow-y-auto scrollbar-thin border border-gray-200 rounded-md p-2">
                    <!-- 数据库条目将在这里动态生成 -->
                    <div class="text-center text-gray-500 py-6">
                        数据库为空，请先导入参考文献
                    </div>
                </div>
                <div class="mt-3 flex justify-between">
                    <button id="btn-save-database" class="bg-accent text-white px-2 py-1 rounded-md text-xs flex items-center hover:bg-green-600 transition-colors">
                        <i class="fa fa-save mr-1"></i> 保存
                    </button>
                    <button id="btn-load-database" class="bg-secondary text-white px-2 py-1 rounded-md text-xs flex items-center hover:bg-gray-600 transition-colors">
                        <i class="fa fa-folder-open mr-1"></i> 加载
                    </button>
                </div>
            </div>

            <!-- 右侧功能面板 -->
            <div class="lg:w-2/3 bg-white rounded-lg shadow-sm p-3">
                <!-- 导入面板 -->
                <div id="panel-import" class="space-y-3">
                    <h2 class="text-base font-semibold text-neutral-dark">导入参考文献</h2>
                    <div>
                        <label for="import-text" class="block text-xs font-medium text-gray-700 mb-1">粘贴bibliography文本</label>
                        <textarea id="import-text" rows="6" class="w-full border border-gray-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="例如：
[1] 作者. 标题[M]. 出版地: 出版社, 出版年.
[2] 作者. 文章标题[J]. 期刊名称, 年份, 卷(期): 页码."></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button id="btn-parse-import" class="bg-primary text-white px-3 py-1 rounded-md text-xs hover:bg-blue-600 transition-colors">
                            <i class="fa fa-magic mr-1"></i> 解析并添加
                        </button>
                    </div>
                    <div id="import-result" class="mt-3 p-2 rounded-md hidden">
                        <!-- 导入结果将在这里显示 -->
                    </div>
                    <div class="border-t border-gray-200 pt-3 mt-3">
                        <label class="block text-xs font-medium text-gray-700 mb-1">或上传 BibTeX 文件</label>
                        <div class="flex items-center gap-2">
                            <input type="file" id="import-bibtex-file" accept=".bib,.txt" class="text-xs file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-primary file:text-white file:cursor-pointer hover:file:bg-blue-600">
                            <button id="btn-import-bibtex" class="bg-primary text-white px-3 py-1 rounded-md text-xs hover:bg-blue-600 transition-colors">
                                <i class="fa fa-upload mr-1"></i> 解析 BibTeX
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 导出面板 -->
                <div id="panel-export" class="space-y-3 hidden">
                    <h2 class="text-base font-semibold text-neutral-dark">导出参考文献</h2>
                    <div class="flex items-center gap-2">
                        <label for="export-format" class="text-xs font-medium text-gray-700">输出格式：</label>
                        <select id="export-format" class="border border-gray-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                            <option value="gb7714">GB/T 7714-2015（中文期刊）</option>
                            <option value="apa">APA 第 7 版</option>
                            <option value="mla">MLA 第 9 版</option>
                            <option value="ieee">IEEE</option>
                        </select>
                    </div>
                    <div>
                        <label for="export-text" class="block text-xs font-medium text-gray-700 mb-1">粘贴bibliography文本</label>
                        <textarea id="export-text" rows="6" class="w-full border border-gray-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="例如：
[1] 作者. 标题[M]. 出版地: 出版社, 出版年.
[2] 作者. 文章标题[J]. 期刊名称, 年份, 卷(期): 页码."></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button id="btn-process-export" class="bg-primary text-white px-3 py-1 rounded-md text-xs hover:bg-blue-600 transition-colors">
                            <i class="fa fa-exchange mr-1"></i> 处理并替换
                        </button>
                    </div>
                    <div class="mt-3">
                        <label for="export-result" class="block text-xs font-medium text-gray-700 mb-1">处理结果</label>
                        <textarea id="export-result" rows="6" class="w-full border border-gray-300 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary" readonly></textarea>
                    </div>
                    <div class="flex justify-between items-center">
                        <div id="export-alert" class="text-xs text-yellow-600 hidden">
                            <!-- 未找到的文献提示将在这里显示 -->
                        </div>
                        <button id="btn-copy-result" class="bg-accent text-white px-3 py-1 rounded-md text-xs hover:bg-green-600 transition-colors">
                            <i class="fa fa-copy mr-1"></i> 复制结果
                        </button>
                    </div>
                </div>

                <!-- 数据库面板 -->
                <div id="panel-database" class="space-y-3 hidden">
                    <h2 class="text-base font-semibold text-neutral-dark">数据库详情</h2>
                    <div id="database-details" class="border border-gray-200 rounded-md p-3">
                        <!-- 数据库详情将在这里显示 -->
                        <div class="text-center text-gray-500 py-6">
                            请选择一个条目查看详情
                        </div>
                    </div>
                </div>

                <!-- 设置面板 -->
                <div id="panel-settings" class="space-y-3 hidden">
                    <h2 class="text-base font-semibold text-neutral-dark">设置</h2>
                    <div class="space-y-3">
                        <div>
                            <label for="repository-folder" class="block text-xs font-medium text-gray-700 mb-1">选择仓库文件夹</label>
                            <div class="flex">
                                <input type="text" id="repository-folder" class="flex-1 border border-gray-300 rounded-l-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="选择仓库文件夹">
                                <button id="btn-select-repository" class="bg-secondary text-white px-2 py-1 rounded-r-md text-xs hover:bg-gray-600 transition-colors">
                                    <i class="fa fa-folder-open mr-1"></i> 选择
                                </button>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">选择存储数据库文件的文件夹</p>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">仓库中的数据库文件</label>
                            <div id="repository-files" class="border border-gray-200 rounded-md p-2 max-h-[150px] overflow-y-auto scrollbar-thin">
                                <div class="text-center text-gray-500 py-3">
                                    请先选择仓库文件夹
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-end">
                            <button id="btn-save-settings" class="bg-primary text-white px-3 py-1 rounded-md text-xs hover:bg-blue-600 transition-colors">
                                <i class="fa fa-save mr-1"></i> 保存设置
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部状态栏 -->
    <footer class="bg-white border-t border-gray-200 mt-4">
        <div class="container mx-auto px-4 py-2">
            <div id="status-bar" class="text-xs text-gray-600">
                就绪
            </div>
        </div>
    </footer>

    <!-- 添加/编辑条目模态框 -->
    <div id="entry-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-lg p-6 max-w-md w-full mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-lg font-semibold text-neutral-dark">添加条目</h3>
                <button id="btn-close-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="space-y-4">
                <input type="hidden" id="entry-id">

                <!-- 文献类型 + DOI 获取按钮 -->
                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">文献类型</label>
                        <select id="entry-type" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                            <option value="journal">期刊论文 [J]</option>
                            <option value="book">图书 [M]</option>
                            <option value="conference">会议论文 [C]</option>
                            <option value="thesis">学位论文 [D]</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">DOI</label>
                        <div class="flex">
                            <input type="text" id="entry-doi" class="flex-1 border border-gray-300 rounded-l-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="10.xxxx/xxxxx">
                            <button id="btn-fetch-doi" class="bg-secondary text-white px-3 py-2 rounded-r-md text-xs hover:bg-gray-600 transition-colors whitespace-nowrap">
                                <i class="fa fa-search mr-1"></i> 通过 DOI 获取
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 作者 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">作者</label>
                    <input type="text" id="entry-authors" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="多个作者用逗号或分号分隔">
                </div>

                <!-- 标题 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">标题</label>
                    <input type="text" id="entry-title" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="文献标题">
                </div>

                <!-- 期刊/出版社 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">期刊/出版社</label>
                    <input type="text" id="entry-journal" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="期刊名或出版社">
                </div>

                <!-- 年份/卷/期/页码 -->
                <div class="grid grid-cols-4 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">年份</label>
                        <input type="text" id="entry-year" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="2024">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">卷</label>
                        <input type="text" id="entry-volume" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="46">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">期</label>
                        <input type="text" id="entry-issue" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="8">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">页码</label>
                        <input type="text" id="entry-pages" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="183-200">
                    </div>
                </div>

                <!-- 出版地 + 出版社（图书/会议用） -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">出版地</label>
                        <input type="text" id="entry-location" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="北京">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">出版社</label>
                        <input type="text" id="entry-publisher" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="出版社">
                    </div>
                </div>

                <!-- 原始文本（保留，便于回溯） -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">原始文本（可选，保留以便回溯）</label>
                    <textarea id="entry-raw" rows="2" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="原始粘贴文本，用于回溯和未结构化时匹配"></textarea>
                </div>

                <!-- 标签 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">标签</label>
                    <input type="text" id="entry-tags" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="标签，用逗号分隔">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button id="btn-cancel-modal" class="border border-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-100 transition-colors">
                    取消
                </button>
                <button id="btn-save-modal" class="bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-600 transition-colors">
                    保存
                </button>
            </div>
        </div>
    </div>

    <!-- 主脚本 -->
    <script src="app.js"></script>
</body>
</html>
