<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>无聊APP · 世界很大，无聊一下</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>
<div id="phone">
  <!-- 状态栏 -->
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="status-right">📶 5G 🔋 87%</span>
  </div>

  <!-- 顶部导航（动态） -->
  <div id="topnav" class="topnav">
    <button id="back-btn" class="back-btn hide" aria-label="返回">‹</button>
    <h1 id="page-title">无聊</h1>
    <span class="online-count" id="online-count">此刻有 <b>1,283</b> 个无聊的人和你在一起</span>
  </div>

  <!-- 视图容器 -->
  <main id="app-view" class="app-view"></main>

  <!-- 底部五大金刚 -->
  <nav class="tabbar">
    <button class="tab" data-tab="home">
      <span class="tab-ico">🏠</span><span class="tab-txt">主页</span>
    </button>
    <button class="tab" data-tab="select">
      <span class="tab-ico">🎯</span><span class="tab-txt">选择困难</span>
    </button>
    <button class="tab" data-tab="square">
      <span class="tab-ico">🏛️</span><span class="tab-txt">广场</span>
    </button>
    <button class="tab" data-tab="park">
      <span class="tab-ico">🎮</span><span class="tab-txt">乐园</span>
    </button>
    <button class="tab" data-tab="profile">
      <span class="tab-ico">👤</span><span class="tab-txt">我的</span>
    </button>
  </nav>

  <!-- 强制画像浮层 -->
  <div id="profile-setup" class="profile-setup hide">
    <div class="profile-setup-box">
      <div class="ps-title">👋 欢迎来到无聊APP</div>
      <div class="ps-sub">先填一下你的画像，无聊才能更准</div>
      <div class="ps-avatar-row">
        <div class="ps-avatar-cur" id="ps-avatar-cur">🐱</div>
        <div class="ps-avatar-grid" id="ps-avatar-grid"></div>
      </div>
      <label class="ps-label">昵称</label>
      <input id="ps-name" class="input" placeholder="给自己起个无聊的名字" value="无聊猫734"/>
      <label class="ps-label">星座（必选）</label>
      <select id="ps-sign" class="input">
        <option value="">请选择星座</option>
        <option value="白羊座">白羊座</option>
        <option value="金牛座">金牛座</option>
        <option value="双子座">双子座</option>
        <option value="巨蟹座">巨蟹座</option>
        <option value="狮子座">狮子座</option>
        <option value="处女座">处女座</option>
        <option value="天秤座">天秤座</option>
        <option value="天蝎座">天蝎座</option>
        <option value="射手座">射手座</option>
        <option value="摩羯座">摩羯座</option>
        <option value="水瓶座">水瓶座</option>
        <option value="双鱼座">双鱼座</option>
      </select>
      <label class="ps-label">年龄（必填）</label>
      <input id="ps-age" type="number" class="input" placeholder="如 25" value="25" min="5" max="120"/>
      <label class="ps-label">性别</label>
      <div class="ps-gender-row">
        <button type="button" class="ps-gender-btn active" data-g="女" onclick="App.pickGender(this)">女</button>
        <button type="button" class="ps-gender-btn" data-g="男" onclick="App.pickGender(this)">男</button>
        <button type="button" class="ps-gender-btn" data-g="其他" onclick="App.pickGender(this)">其他</button>
      </div>
      <label class="ps-label">地区</label>
      <input id="ps-region" class="input" placeholder="你在哪个城市？" value="北京"/>
      <button class="btn btn-primary btn-block btn-lg ps-submit" onclick="App.submitProfile()">开始无聊 →</button>
    </div>
  </div>

  <!-- 全局浮层 -->
  <div id="toast" class="toast"></div>
  <div id="modal-layer" class="modal-layer hide"></div>
</div>

<script src="js/data.js?v=7"></script>
<script src="js/utils.js?v=7"></script>
<script src="js/app.js?v=7"></script>
<script src="js/home.js?v=7"></script>
<script src="js/select.js?v=7"></script>
<script src="js/square.js?v=7"></script>
<script src="js/park.js?v=7"></script>
<script src="js/profile.js?v=7"></script>
<script>
  // 启动
  document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
