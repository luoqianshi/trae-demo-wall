<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>任务管理 - 虚实一体仿真系统</title>
  <script src="auth-guard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --secondary: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f97316;
      --bg-dark: #0a0f1a;
      --bg-panel: #111827;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --gradient-1: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      --gradient-2: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      --gradient-3: linear-gradient(135deg, #22c55e 0%, #0ea5e9 100%);
      --shadow-glow: 0 0 20px rgba(14, 165, 233, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: rgba(10, 15, 26, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 60px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--gradient-1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .logo-text h1 {
      font-size: 1.25rem; font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-text p { font-size: 0.7rem; color: var(--text-secondary); }
    .top-nav { display:flex; gap:0.5rem; }
    .top-nav-item { padding:0.5rem 1rem; color:var(--text-secondary); text-decoration:none; border-radius:6px; font-size:0.85rem; transition:all 0.2s; }
    .top-nav-item:hover { background:var(--bg-hover); color:var(--text-primary); }
    .top-nav-item.active { background:rgba(14,165,233,0.15); color:var(--primary); }
    .back-btn { padding:0.5rem 1rem; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-family:inherit; font-size:0.8rem; cursor:pointer; transition:all 0.2s; }
    .back-btn:hover { background:var(--primary); border-color:var(--primary); }
    .page-container { max-width:1200px; margin:0 auto; padding:1.5rem; }
    .page-title { font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem; }
    .panel-section {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel-section h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
    @media (max-width:900px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
    input, select, textarea {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--bg-hover); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--border); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-group { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .checkbox-group { display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; cursor:pointer; padding:0.3rem 0.6rem; border-radius:4px; transition:background 0.2s; justify-content:flex-start; width:fit-content; white-space:nowrap; }
    .checkbox-group:hover { background:rgba(51,65,85,0.3); }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="location.href='simulation.html'">
      <div class="logo-icon">🤖</div>
      <div class="logo-text"><h1>虚实一体仿真系统</h1><p>职业院校工业机器人及自动化流水线实训平台</p></div>
    </div>
    <nav class="top-nav">
      <a href="tasks.html" class="top-nav-item active">📋 任务</a>
      <a href="assessment.html" class="top-nav-item">📊 考核</a>
      <a href="users.html" class="top-nav-item">👥 用户</a>
      <a href="resources.html" class="top-nav-item">📚 资源</a>
      <a href="data.html" class="top-nav-item">📈 数据</a>
      <a href="qa.html" class="top-nav-item">💬 答疑</a>
      <a href="logs.html" class="top-nav-item">📝 日志</a>
    </nav>
    <button class="back-btn" onclick="location.href='simulation.html'">⬅ 返回仿真区</button>
  </header>

  <div class="page-container">
    <div class="page-title">📋 任务管理</div>

    <div class="grid-2">
      <div class="panel-section">
        <h3>📋 任务下发</h3>
        <div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.75rem;">
          <input type="text" id="task-name" placeholder="任务名称">
          <textarea id="task-desc" placeholder="任务描述" style="background:var(--bg-dark);border:1px solid var(--border);border-radius:6px;padding:0.5rem;color:var(--text-primary);font-family:inherit;font-size:0.8rem;resize:vertical;min-height:60px;"></textarea>
          <input type="date" id="task-deadline" style="background:var(--bg-dark);border:1px solid var(--border);border-radius:6px;padding:0.5rem;color:var(--text-primary);font-family:inherit;font-size:0.8rem;">
          <div style="display:flex;gap:0.5rem;">
            <select id="task-robot-model" style="flex:1;">
              <option value="">机器人型号</option>
              <option value="irb120">ABB IRB 120</option>
              <option value="irb2600">ABB IRB 2600</option>
              <option value="kr6">KUKA KR6</option>
              <option value="fanuc">FANUC LR Mate</option>
            </select>
            <select id="task-process-type" style="flex:1;">
              <option value="">工艺类型</option>
              <option value="welding">焊接</option>
              <option value="spraying">喷涂</option>
              <option value="grinding">打磨</option>
              <option value="handling">搬运</option>
              <option value="assembly">装配</option>
            </select>
          </div>
          <select id="task-difficulty">
            <option value="">难度等级</option>
            <option value="beginner">初级</option>
            <option value="intermediate">中级</option>
            <option value="advanced">高级</option>
          </select>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="createTask()">✅ 创建任务</button>
          <button class="btn btn-secondary" onclick="clearTaskForm()">🔄 清空</button>
          <button class="btn btn-secondary" onclick="saveTaskTemplate()">💾 存模板</button>
        </div>
      </div>

      <div class="panel-section">
        <h3>🏫 班级批量分发</h3>
        <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.5rem;">选择要下发任务的班级</div>
        <div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem;" id="class-distribute-list">
          <label class="checkbox-group"><input type="checkbox" value="class1" checked> <span>机电一体化23-1班</span></label>
          <label class="checkbox-group"><input type="checkbox" value="class2"> <span>机电一体化23-2班</span></label>
          <label class="checkbox-group"><input type="checkbox" value="class3"> <span>工业机器人23-1班</span></label>
          <label class="checkbox-group"><input type="checkbox" value="class4"> <span>智能制造23-1班</span></label>
        </div>
        <button class="btn btn-primary" onclick="distributeTaskToClasses()" style="width:100%;">📤 批量下发到选中班级</button>
      </div>

      <div class="panel-section">
        <h3>📦 配套素材绑定</h3>
        <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.5rem;">为任务关联课件、视频、指导书等资源</div>
        <div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem;" id="task-material-list">
          <label class="checkbox-group"><input type="checkbox" value="res1"> <span>🎬 机器人操作基础-第1章</span></label>
          <label class="checkbox-group"><input type="checkbox" value="res2"> <span>📑 焊接工艺参数手册</span></label>
          <label class="checkbox-group"><input type="checkbox" value="res3"> <span>📖 实训指导书-V2.0</span></label>
          <label class="checkbox-group"><input type="checkbox" value="res4"> <span>📝 故障排查题库</span></label>
        </div>
        <button class="btn btn-primary" onclick="bindMaterialsToTask()" style="width:100%;">🔗 绑定配套素材</button>
        <div id="task-material-status" style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.5rem;"></div>
      </div>

      <div class="panel-section">
        <h3>🚀 仿真联动</h3>
        <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.5rem;">选择任务后一键启动对应仿真场景</div>
        <select id="task-sim-select" style="margin-bottom:0.5rem;">
          <option value="">选择要启动的任务...</option>
          <option value="welding">焊接基础实训</option>
          <option value="spraying">喷涂路径规划</option>
          <option value="grinding">打磨工艺优化</option>
          <option value="handling">物料搬运实训</option>
        </select>
        <button class="btn btn-success" onclick="launchTaskSimulation()" style="width:100%;">▶️ 启动仿真</button>
        <div id="task-sim-status" style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.5rem;"></div>
      </div>

      <div class="panel-section">
        <h3>👥 分组管理</h3>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;">
          <input type="text" id="group-name" placeholder="小组名称" style="flex:1;">
          <button class="btn btn-primary" onclick="createGroup()">➕ 创建</button>
        </div>
        <div id="group-list" style="display:flex;flex-direction:column;gap:0.4rem;max-height:180px;overflow-y:auto;">
          <!-- 小组列表由JS动态生成 -->
        </div>
      </div>

      <div class="panel-section">
        <h3>📈 进度监控</h3>
        <div id="progress-list" style="display:flex;flex-direction:column;gap:0.4rem;max-height:200px;overflow-y:auto;">
          <!-- 进度列表由JS动态生成 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // 非管理员隐藏用户管理链接
    const role = localStorage.getItem('userRole');
    if (role !== 'admin') {
        const userLink = document.querySelector('a[href="users.html"]');
        if (userLink) userLink.style.display = 'none';
    }

    // ---------- 任务管理模块 ----------
    let taskList = [
      { id: 1, name: '焊接基础实训', desc: '掌握MIG焊接基本操作', deadline: '2024-02-15', robot: 'irb2600', process: 'welding', difficulty: 'beginner', status: '进行中', progress: 65 },
      { id: 2, name: '喷涂路径规划', desc: '完成工件喷涂路径编程', deadline: '2024-02-20', robot: 'irb120', process: 'spraying', difficulty: 'intermediate', status: '未开始', progress: 0 },
      { id: 3, name: '打磨工艺优化', desc: '优化打磨参数提升表面质量', deadline: '2024-02-25', robot: 'kr6', process: 'grinding', difficulty: 'advanced', status: '已完成', progress: 100 }
    ];

    let groupList = [
      { id: 1, name: '第一组', leader: '张小明', members: ['张小明', '李小红', '王大伟'] },
      { id: 2, name: '第二组', leader: '刘小丽', members: ['刘小丽', '陈小强', '赵小芳'] },
      { id: 3, name: '第三组', leader: '孙小亮', members: ['孙小亮', '周小敏'] }
    ];

    let studentProgress = [
      { name: '张小明', status: 'online', currentStep: '焊接轨迹调试', progress: 72, task: '焊接基础实训' },
      { name: '李小红', status: 'online', currentStep: '参数设置', progress: 58, task: '焊接基础实训' },
      { name: '王大伟', status: 'offline', currentStep: '安全确认', progress: 35, task: '焊接基础实训' },
      { name: '刘小丽', status: 'online', currentStep: '路径规划', progress: 45, task: '喷涂路径规划' },
      { name: '陈小强', status: 'online', currentStep: '程序调试', progress: 80, task: '打磨工艺优化' }
    ];

    function renderTaskList() {
      const list = document.getElementById('progress-list');
      if (!list) return;
      list.innerHTML = taskList.map(t => `
        <div style="display:flex;flex-direction:column;gap:0.3rem;padding:0.5rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:500;">${t.name}</span>
            <span style="font-size:0.7rem;padding:0.1rem 0.4rem;border-radius:3px;background:${t.status==='已完成'?'rgba(34,197,94,0.2)':t.status==='进行中'?'rgba(14,165,233,0.2)':'rgba(100,116,139,0.2)'};color:${t.status==='已完成'?'var(--success)':t.status==='进行中'?'var(--primary)':'var(--text-secondary)'}">${t.status}</span>
          </div>
          <div style="font-size:0.75rem;color:var(--text-secondary);">${t.desc}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;color:var(--text-secondary);">
            <span>截止: ${t.deadline}</span>
            <span>${t.progress}%</span>
          </div>
          <div style="width:100%;height:4px;background:var(--bg-hover);border-radius:2px;overflow:hidden;">
            <div style="width:${t.progress}%;height:100%;background:${t.progress===100?'var(--success)':'var(--primary)'};border-radius:2px;transition:width 0.5s;"></div>
          </div>
        </div>
      `).join('');
    }

    function renderGroupList() {
      const list = document.getElementById('group-list');
      if (!list) return;
      list.innerHTML = groupList.map(g => `
        <div style="display:flex;flex-direction:column;gap:0.3rem;padding:0.5rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:500;">${g.name}</span>
            <span style="font-size:0.7rem;color:var(--text-secondary);">组长: ${g.leader}</span>
          </div>
          <div style="font-size:0.75rem;color:var(--text-secondary);">组员: ${g.members.join(', ')}</div>
        </div>
      `).join('');
    }

    function renderProgressList() {
      const list = document.getElementById('progress-list');
      if (!list) return;
      list.innerHTML = studentProgress.map(s => `
        <div style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
          <div style="width:8px;height:8px;border-radius:50%;background:${s.status==='online'?'var(--success)':'var(--text-secondary)'};${s.status==='online'?'animation:blink 2s ease-in-out infinite':''}"></div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;justify-content:space-between;">
              <span style="font-weight:500;">${s.name}</span>
              <span style="font-size:0.7rem;color:var(--text-secondary);">${s.task}</span>
            </div>
            <div style="font-size:0.75rem;color:var(--text-secondary);">${s.currentStep}</div>
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--primary);font-size:0.9rem;">${s.progress}%</div>
        </div>
      `).join('');
    }

    window.createTask = function() {
      const name = document.getElementById('task-name')?.value;
      const desc = document.getElementById('task-desc')?.value;
      const deadline = document.getElementById('task-deadline')?.value;
      const robot = document.getElementById('task-robot-model')?.value;
      const process = document.getElementById('task-process-type')?.value;
      const difficulty = document.getElementById('task-difficulty')?.value;
      if (!name) { alert('请输入任务名称'); return; }
      taskList.unshift({ id: Date.now(), name, desc: desc || '', deadline: deadline || '2024-12-31', robot, process, difficulty, status: '未开始', progress: 0 });
      renderTaskList();
      alert(`创建任务: ${name}`);
    };

    window.clearTaskForm = function() {
      document.getElementById('task-name').value = '';
      document.getElementById('task-desc').value = '';
      document.getElementById('task-deadline').value = '';
      document.getElementById('task-robot-model').value = '';
      document.getElementById('task-process-type').value = '';
      document.getElementById('task-difficulty').value = '';
    };

    window.createGroup = function() {
      const name = document.getElementById('group-name')?.value;
      if (!name) { alert('请输入小组名称'); return; }
      groupList.push({ id: Date.now(), name, leader: '待分配', members: [] });
      renderGroupList();
      document.getElementById('group-name').value = '';
      alert(`创建小组: ${name}`);
    };

    let taskTemplates = [];
    window.saveTaskTemplate = function() {
      const name = document.getElementById('task-name')?.value;
      if (!name) { alert('请输入任务名称后保存模板'); return; }
      taskTemplates.push({ id: Date.now(), name: name + ' [模板]', date: new Date().toISOString().split('T')[0] });
      alert(`保存任务模板: ${name}`);
    };

    window.distributeTaskToClasses = function() {
      const checkboxes = document.querySelectorAll('#class-distribute-list input[type="checkbox"]:checked');
      const classes = Array.from(checkboxes).map(cb => cb.nextElementSibling?.textContent).filter(Boolean);
      if (classes.length === 0) { alert('请至少选择一个班级'); return; }
      alert(`任务已批量下发到: ${classes.join(', ')}`);
    };

    window.bindMaterialsToTask = function() {
      const checkboxes = document.querySelectorAll('#task-material-list input[type="checkbox"]:checked');
      const materials = Array.from(checkboxes).map(cb => cb.nextElementSibling?.textContent).filter(Boolean);
      const status = document.getElementById('task-material-status');
      if (materials.length === 0) { if (status) status.textContent = '请至少选择一个素材'; return; }
      if (status) status.textContent = `✅ 已绑定 ${materials.length} 个素材`;
      alert(`任务绑定素材: ${materials.join(', ')}`);
    };

    window.launchTaskSimulation = function() {
      const taskType = document.getElementById('task-sim-select')?.value;
      const status = document.getElementById('task-sim-status');
      if (!taskType) { if (status) status.textContent = '请先选择任务'; return; }
      const typeMap = { welding: '焊接', spraying: '喷涂', grinding: '打磨', handling: '搬运' };
      if (status) status.textContent = `🚀 正在启动${typeMap[taskType]}仿真场景...`;
      alert(`启动仿真场景: ${typeMap[taskType]}`);
    };

    // 初始化
    renderTaskList();
    renderGroupList();
    renderProgressList();
  </script>
</body>
</html>
