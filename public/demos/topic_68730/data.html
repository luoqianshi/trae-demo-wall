<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>数据溯源 - 虚实一体仿真系统</title>
  <script src="auth-guard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --secondary: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f97316;
      --bg-dark: #0a0f1a;
      --bg-panel: #111827;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --gradient-1: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      --gradient-2: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      --gradient-3: linear-gradient(135deg, #22c55e 0%, #0ea5e9 100%);
      --shadow-glow: 0 0 20px rgba(14, 165, 233, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: rgba(10, 15, 26, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 60px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--gradient-1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .logo-text h1 {
      font-size: 1.25rem; font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-text p { font-size: 0.7rem; color: var(--text-secondary); }
    .top-nav { display:flex; gap:0.5rem; }
    .top-nav-item { padding:0.5rem 1rem; color:var(--text-secondary); text-decoration:none; border-radius:6px; font-size:0.85rem; transition:all 0.2s; }
    .top-nav-item:hover { background:var(--bg-hover); color:var(--text-primary); }
    .top-nav-item.active { background:rgba(14,165,233,0.15); color:var(--primary); }
    .back-btn { padding:0.5rem 1rem; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-family:inherit; font-size:0.8rem; cursor:pointer; transition:all 0.2s; }
    .back-btn:hover { background:var(--primary); border-color:var(--primary); }
    .page-container { max-width:1200px; margin:0 auto; padding:1.5rem; }
    .page-title { font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem; }
    .panel-section {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel-section h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
    @media (max-width:900px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
    input, select, textarea {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--bg-hover); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--border); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-group { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .stat-card {
      background: var(--bg-dark);
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
    }
    .stat-value { font-size:1.1rem; font-weight:700; color:var(--primary); }
    .stat-label { font-size:0.7rem; color:var(--text-secondary); }
    .log-entry { display:flex; gap:0.5rem; padding:0.3rem; background:rgba(51,65,85,0.3); border-radius:4px; font-size:0.8rem; margin-bottom:0.2rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="location.href='simulation.html'" style="cursor:pointer;">
      <div class="logo-icon">🤖</div>
      <div class="logo-text"><h1>虚实一体仿真系统</h1><p>职业院校工业机器人及自动化流水线实训平台</p></div>
    </div>
    <nav class="top-nav">
      <a href="tasks.html" class="top-nav-item">📋 任务</a>
      <a href="assessment.html" class="top-nav-item">📊 考核</a>
      <a href="users.html" class="top-nav-item">👥 用户</a>
      <a href="resources.html" class="top-nav-item">📚 资源</a>
      <a href="data.html" class="top-nav-item active">📈 数据</a>
      <a href="qa.html" class="top-nav-item">💬 答疑</a>
      <a href="logs.html" class="top-nav-item">📝 日志</a>
    </nav>
    <button class="back-btn" onclick="location.href='simulation.html'">⬅ 返回仿真区</button>
  </header>

  <div class="page-container">
    <div class="page-title">📈 数据溯源</div>

    <div class="grid-2">
      <div class="panel-section">
        <h3>📝 操作记录</h3>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap;">
          <select id="data-student-select" onchange="loadStudentData()" style="flex:1;min-width:100px;">
            <option value="">选择学生</option>
            <option value="s1">张小明</option>
            <option value="s2">李小红</option>
            <option value="s3">王大伟</option>
            <option value="s4">刘小丽</option>
            <option value="s5">陈小强</option>
          </select>
          <select id="data-session-select" onchange="loadSessionData()" style="flex:1;min-width:100px;">
            <option value="">选择实训</option>
            <option value="session1">焊接实训-2024-01-15</option>
            <option value="session2">喷涂实训-2024-01-18</option>
            <option value="session3">打磨实训-2024-01-22</option>
          </select>
        </div>
        <div id="operation-log-list" style="display:flex;flex-direction:column;gap:0.3rem;max-height:200px;overflow-y:auto;font-size:0.75rem;font-family:'JetBrains Mono',monospace;"></div>
      </div>

      <div class="panel-section">
        <h3>📈 阶段性能力对比</h3>
        <div style="background:var(--bg-dark);border-radius:8px;padding:0.75rem;margin-bottom:0.75rem;">
          <canvas id="ability-trend-chart" width="400" height="200" style="width:100%;height:180px;"></canvas>
        </div>
        <div style="font-size:0.75rem;color:var(--text-secondary);text-align:center;">折线图展示学生能力随时间变化趋势</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel-section">
        <h3>🔍 实训复盘</h3>
        <div style="background:var(--bg-dark);border-radius:8px;padding:0.75rem;margin-bottom:0.75rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
            <span style="font-size:0.8rem;">操作回放</span>
            <div style="display:flex;gap:0.25rem;">
              <button class="btn btn-secondary" style="padding:0.3rem 0.5rem;font-size:0.7rem;" onclick="playReplay()">▶️</button>
              <button class="btn btn-secondary" style="padding:0.3rem 0.5rem;font-size:0.7rem;" onclick="pauseReplay()">⏸️</button>
              <button class="btn btn-secondary" style="padding:0.3rem 0.5rem;font-size:0.7rem;" onclick="stopReplay()">⏹️</button>
            </div>
          </div>
          <div style="width:100%;height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;margin-bottom:0.5rem;">
            <div id="replay-progress" style="width:0%;height:100%;background:var(--primary);border-radius:3px;transition:width 0.3s;"></div>
          </div>
          <div id="replay-info" style="font-size:0.75rem;color:var(--text-secondary);">请选择学生并加载实训数据</div>
        </div>
        <div id="key-nodes-list" style="display:flex;flex-direction:column;gap:0.3rem;max-height:120px;overflow-y:auto;"></div>
      </div>

      <div class="panel-section">
        <h3>❌ 错题汇总</h3>
        <div id="error-summary-list" style="display:flex;flex-direction:column;gap:0.3rem;max-height:200px;overflow-y:auto;"></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel-section">
        <h3>👤 能力画像</h3>
        <div style="background:var(--bg-dark);border-radius:8px;padding:0.75rem;margin-bottom:0.75rem;">
          <canvas id="ability-radar-chart" width="400" height="240" style="width:100%;height:220px;"></canvas>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.4rem;" id="ability-suggestions"></div>
      </div>

      <div class="panel-section">
        <h3>🏫 班级维度统计</h3>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:0.75rem;">
          <div class="stat-card">
            <div class="stat-value" id="class-avg-score">78.5</div>
            <div class="stat-label">平均分</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--success);" id="class-max-score">95</div>
            <div class="stat-label">最高分</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--danger);" id="class-min-score">52</div>
            <div class="stat-label">最低分</div>
          </div>
        </div>
        <div style="font-size:0.8rem;font-weight:600;margin-bottom:0.5rem;">分数段分布</div>
        <div style="display:flex;flex-direction:column;gap:0.3rem;margin-bottom:0.75rem;">
          <div style="display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;">
            <span style="width:50px;">优秀(90+)</span>
            <div style="flex:1;height:12px;background:var(--bg-hover);border-radius:6px;overflow:hidden;">
              <div style="width:25%;height:100%;background:var(--success);border-radius:6px;"></div>
            </div>
            <span style="width:30px;text-align:right;">5人</span>
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;">
            <span style="width:50px;">良好(80+)</span>
            <div style="flex:1;height:12px;background:var(--bg-hover);border-radius:6px;overflow:hidden;">
              <div style="width:40%;height:100%;background:var(--primary);border-radius:6px;"></div>
            </div>
            <span style="width:30px;text-align:right;">8人</span>
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;">
            <span style="width:50px;">及格(60+)</span>
            <div style="flex:1;height:12px;background:var(--bg-hover);border-radius:6px;overflow:hidden;">
              <div style="width:20%;height:100%;background:var(--warning);border-radius:6px;"></div>
            </div>
            <span style="width:30px;text-align:right;">4人</span>
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;">
            <span style="width:50px;">不及格</span>
            <div style="flex:1;height:12px;background:var(--bg-hover);border-radius:6px;overflow:hidden;">
              <div style="width:15%;height:100%;background:var(--danger);border-radius:6px;"></div>
            </div>
            <span style="width:30px;text-align:right;">3人</span>
          </div>
        </div>
        <div style="font-size:0.8rem;font-weight:600;margin-bottom:0.5rem;">薄弱能力项分析</div>
        <div style="display:flex;flex-direction:column;gap:0.3rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:rgba(239,68,68,0.1);border-radius:6px;font-size:0.8rem;border-left:2px solid var(--danger);">
            <span>故障排查效率</span>
            <span style="color:var(--danger);font-weight:700;">班级均分 62.3</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:rgba(245,158,11,0.1);border-radius:6px;font-size:0.8rem;border-left:2px solid var(--warning);">
            <span>工艺合理性</span>
            <span style="color:var(--warning);font-weight:700;">班级均分 71.5</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 非管理员隐藏用户管理链接
    const role = localStorage.getItem('userRole');
    if (role !== 'admin') {
        const userLink = document.querySelector('a[href="users.html"]');
        if (userLink) userLink.style.display = 'none';
    }

    const mockOperationLogs = {
      s1: [
        { time: '09:15:23', action: '启动系统', detail: '机器人初始化完成' },
        { time: '09:16:05', action: '加载程序', detail: '加载 welding_program_v2' },
        { time: '09:18:12', action: '调整参数', detail: '电流 180A -> 200A' },
        { time: '09:20:45', action: '开始焊接', detail: '焊缝1 执行中' },
        { time: '09:22:18', action: '暂停', detail: '检查焊缝质量' },
        { time: '09:23:30', action: '恢复运行', detail: '继续焊接' },
        { time: '09:25:42', action: '完成', detail: '焊缝1 完成' }
      ],
      s2: [
        { time: '10:05:10', action: '启动系统', detail: '机器人初始化完成' },
        { time: '10:06:22', action: '示教模式', detail: '记录轨迹点 P1' },
        { time: '10:08:15', action: '记录点', detail: '记录轨迹点 P2' },
        { time: '10:10:33', action: '参数错误', detail: '速度超出范围 120%' },
        { time: '10:11:05', action: '修正参数', detail: '速度调整为 80%' },
        { time: '10:12:40', action: '运行轨迹', detail: '轨迹执行完成' }
      ]
    };

    const mockErrors = {
      s1: [
        { type: '参数设置', desc: '电流初始值偏低', count: 1 },
        { type: '操作流程', desc: '暂停后未确认安全', count: 1 }
      ],
      s2: [
        { type: '参数设置', desc: '速度超出安全范围', count: 2 },
        { type: '编程规范', desc: '缺少程序注释', count: 1 },
        { type: '操作流程', desc: '未进行原点校准', count: 1 }
      ]
    };

    let replayInterval = null;
    let replayProgress = 0;

    function loadStudentData() {
      const student = document.getElementById('data-student-select')?.value;
      if (!student) return;
      loadSessionData();
    }

    function loadSessionData() {
      const student = document.getElementById('data-student-select')?.value;
      const session = document.getElementById('data-session-select')?.value;
      const logList = document.getElementById('operation-log-list');
      const keyNodes = document.getElementById('key-nodes-list');
      const errorList = document.getElementById('error-summary-list');
      const replayInfo = document.getElementById('replay-info');

      if (!student || !session) {
        if (logList) logList.innerHTML = '<div style="color:var(--text-secondary);padding:0.5rem;">请选择学生和实训</div>';
        return;
      }

      const logs = mockOperationLogs[student] || mockOperationLogs.s1;
      if (logList) {
        logList.innerHTML = logs.map(l => `
          <div class="log-entry">
            <span style="color:var(--primary);white-space:nowrap;">${l.time}</span>
            <span style="color:var(--text-secondary);white-space:nowrap;">${l.action}</span>
            <span style="color:var(--text-primary);">${l.detail}</span>
          </div>
        `).join('');
      }

      if (keyNodes) {
        keyNodes.innerHTML = logs.filter((l, i) => i % 2 === 0).map((l, i) => `
          <div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem;background:rgba(14,165,233,0.1);border-radius:4px;font-size:0.75rem;border-left:2px solid var(--primary);">
            <span style="color:var(--primary);font-weight:700;">节点${i+1}</span>
            <span>${l.action}: ${l.detail}</span>
          </div>
        `).join('');
      }

      const errors = mockErrors[student] || [];
      if (errorList) {
        if (errors.length === 0) {
          errorList.innerHTML = '<div style="color:var(--success);padding:0.5rem;">✅ 本次实训无错误记录</div>';
        } else {
          errorList.innerHTML = errors.map(e => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:rgba(239,68,68,0.1);border-radius:4px;font-size:0.8rem;border-left:2px solid var(--danger);">
              <div>
                <div style="font-weight:500;">${e.type}</div>
                <div style="font-size:0.75rem;color:var(--text-secondary);">${e.desc}</div>
              </div>
              <span style="font-size:0.75rem;padding:0.1rem 0.4rem;border-radius:3px;background:rgba(239,68,68,0.2);color:var(--danger);">${e.count}次</span>
            </div>
          `).join('');
        }
      }

      if (replayInfo) replayInfo.textContent = `已加载: ${student} - ${session}`;

      drawAbilityTrendChart();
      drawAbilityRadarChart();
      renderAbilitySuggestions();
    }

    function playReplay() {
      if (replayInterval) return;
      replayInterval = setInterval(() => {
        replayProgress += 2;
        if (replayProgress > 100) replayProgress = 0;
        const bar = document.getElementById('replay-progress');
        if (bar) bar.style.width = replayProgress + '%';
      }, 200);
    }

    function pauseReplay() {
      if (replayInterval) {
        clearInterval(replayInterval);
        replayInterval = null;
      }
    }

    function stopReplay() {
      if (replayInterval) {
        clearInterval(replayInterval);
        replayInterval = null;
      }
      replayProgress = 0;
      const bar = document.getElementById('replay-progress');
      if (bar) bar.style.width = '0%';
    }

    function drawAbilityTrendChart() {
      const canvas = document.getElementById('ability-trend-chart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth || 400;
      canvas.height = canvas.offsetHeight || 200;
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const padding = 30;
      const chartW = w - padding * 2;
      const chartH = h - padding * 2;
      const sessions = ['第1次', '第2次', '第3次', '第4次', '第5次'];
      const data = [65, 72, 78, 75, 85];
      const classAvg = [68, 70, 74, 76, 78];

      ctx.strokeStyle = 'rgba(51,65,85,0.3)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padding + chartH * i / 4;
        ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(w - padding, y); ctx.stroke();
      }
      for (let i = 0; i < sessions.length; i++) {
        const x = padding + chartW * i / (sessions.length - 1);
        ctx.beginPath(); ctx.moveTo(x, padding); ctx.lineTo(x, h - padding); ctx.stroke();
        ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(sessions[i], x, h - 10);
      }

      ctx.beginPath();
      ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 2;
      for (let i = 0; i < data.length; i++) {
        const x = padding + chartW * i / (data.length - 1);
        const y = padding + chartH * (1 - data[i] / 100);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        ctx.fillStyle = '#0ea5e9'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
      for (let i = 0; i < classAvg.length; i++) {
        const x = padding + chartW * i / (classAvg.length - 1);
        const y = padding + chartH * (1 - classAvg[i] / 100);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke(); ctx.setLineDash([]);

      ctx.fillStyle = '#0ea5e9'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('个人得分', padding + 10, padding + 15);
      ctx.fillStyle = '#f59e0b';
      ctx.fillText('班级平均', padding + 80, padding + 15);
    }

    function drawAbilityRadarChart() {
      const canvas = document.getElementById('ability-radar-chart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const labels = ['编程', '轨迹', '工艺', '排故', '规范'];
      const values = [78, 65, 82, 58, 88];
      const centerX = w / 2, centerY = h / 2 + 10;
      const radius = Math.min(w, h) / 2 - 35;
      const count = labels.length;

      for (let level = 1; level <= 4; level++) {
        ctx.beginPath();
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 / count) * i - Math.PI / 2;
          const r = radius * level / 4;
          const x = centerX + Math.cos(angle) * r;
          const y = centerY + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.5)';
        ctx.stroke();
      }

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * radius, centerY + Math.sin(angle) * radius);
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.5)';
        ctx.stroke();
        const labelX = centerX + Math.cos(angle) * (radius + 18);
        const labelY = centerY + Math.sin(angle) * (radius + 18);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(labels[i], labelX, labelY);
      }

      ctx.beginPath();
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i - Math.PI / 2;
        const r = radius * (values[i] || 0) / 100;
        const x = centerX + Math.cos(angle) * r;
        const y = centerY + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(14, 165, 233, 0.25)';
      ctx.fill();
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 2;
      ctx.stroke();

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i - Math.PI / 2;
        const r = radius * (values[i] || 0) / 100;
        const x = centerX + Math.cos(angle) * r;
        const y = centerY + Math.sin(angle) * r;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#0ea5e9';
        ctx.fill();
      }
    }

    function renderAbilitySuggestions() {
      const container = document.getElementById('ability-suggestions');
      if (!container) return;
      container.innerHTML = `
        <div style="padding:0.5rem;background:rgba(14,165,233,0.1);border-radius:6px;font-size:0.8rem;border-left:2px solid var(--primary);">
          <strong>💡 建议:</strong> 轨迹规划能力有提升空间，建议观看《轨迹规划基础》微课。
        </div>
        <div style="padding:0.5rem;background:rgba(245,158,11,0.1);border-radius:6px;font-size:0.8rem;border-left:2px solid var(--warning);">
          <strong>⚠️ 注意:</strong> 故障排查得分偏低，建议加强实操训练。
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      drawAbilityTrendChart();
      drawAbilityRadarChart();
      renderAbilitySuggestions();
    });
  </script>
</body>
</html>
