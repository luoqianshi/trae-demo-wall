<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>资源管理 - 虚实一体仿真系统</title>
  <script src="auth-guard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --secondary: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f97316;
      --bg-dark: #0a0f1a;
      --bg-panel: #111827;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --gradient-1: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      --gradient-2: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      --gradient-3: linear-gradient(135deg, #22c55e 0%, #0ea5e9 100%);
      --shadow-glow: 0 0 20px rgba(14, 165, 233, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: rgba(10, 15, 26, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 60px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--gradient-1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .logo-text h1 {
      font-size: 1.25rem; font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-text p { font-size: 0.7rem; color: var(--text-secondary); }
    .top-nav { display:flex; gap:0.5rem; }
    .top-nav-item { padding:0.5rem 1rem; color:var(--text-secondary); text-decoration:none; border-radius:6px; font-size:0.85rem; transition:all 0.2s; }
    .top-nav-item:hover { background:var(--bg-hover); color:var(--text-primary); }
    .top-nav-item.active { background:rgba(14,165,233,0.15); color:var(--primary); }
    .back-btn { padding:0.5rem 1rem; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-family:inherit; font-size:0.8rem; cursor:pointer; transition:all 0.2s; }
    .back-btn:hover { background:var(--primary); border-color:var(--primary); }
    .page-container { max-width:1200px; margin:0 auto; padding:1.5rem; }
    .page-title { font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem; }
    .panel-section {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel-section h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
    @media (max-width:900px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
    input, select, textarea {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--bg-hover); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--border); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-group { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .stat-card {
      background: var(--bg-dark);
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
    }
    .stat-value { font-size:1.2rem; font-weight:700; color:var(--primary); }
    .stat-label { font-size:0.7rem; color:var(--text-secondary); }
    .resource-item {
      display:flex; align-items:center; gap:0.5rem; padding:0.5rem;
      background:var(--bg-dark); border-radius:6px; font-size:0.85rem;
      cursor:pointer; transition:all 0.2s;
    }
    .resource-item:hover { background:var(--bg-hover); }
    .resource-item.selected { border:1px solid var(--primary); }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="location.href='simulation.html'" style="cursor:pointer;">
      <div class="logo-icon">🤖</div>
      <div class="logo-text"><h1>虚实一体仿真系统</h1><p>职业院校工业机器人及自动化流水线实训平台</p></div>
    </div>
    <nav class="top-nav">
      <a href="tasks.html" class="top-nav-item">📋 任务</a>
      <a href="assessment.html" class="top-nav-item">📊 考核</a>
      <a href="users.html" class="top-nav-item">👥 用户</a>
      <a href="resources.html" class="top-nav-item active">📚 资源</a>
      <a href="data.html" class="top-nav-item">📈 数据</a>
      <a href="qa.html" class="top-nav-item">💬 答疑</a>
      <a href="logs.html" class="top-nav-item">📝 日志</a>
    </nav>
    <button class="back-btn" onclick="location.href='simulation.html'">⬅ 返回仿真区</button>
  </header>

  <div class="page-container">
    <div class="page-title">📚 资源管理</div>

    <div class="grid-2">
      <div class="panel-section">
        <h3>🔍 资源库搜索筛选</h3>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;">
          <input type="text" id="resource-search" placeholder="搜索资源..." style="flex:1;" oninput="searchResources()">
          <select id="resource-filter-type" onchange="filterResources()" style="width:120px;">
            <option value="">全部类型</option>
            <option value="video">微课视频</option>
            <option value="ppt">理论课件</option>
            <option value="guide">实训指导</option>
            <option value="manual">工艺手册</option>
            <option value="question">题库资源</option>
          </select>
        </div>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;">
          <select id="resource-filter-difficulty" onchange="filterResources()" style="flex:1;">
            <option value="">全部难度</option>
            <option value="beginner">初级</option>
            <option value="intermediate">中级</option>
            <option value="advanced">高级</option>
          </select>
          <select id="resource-filter-course" onchange="filterResources()" style="flex:1;">
            <option value="">全部课程</option>
            <option value="robot">机器人操作</option>
            <option value="plc">PLC编程</option>
            <option value="sensor">传感器应用</option>
            <option value="welding">焊接工艺</option>
            <option value="spraying">喷涂工艺</option>
            <option value="grinding">打磨工艺</option>
          </select>
        </div>
        <div class="btn-group" style="margin-bottom:0.75rem;">
          <button class="btn btn-primary" onclick="showUploadModal()">📤 上传资源</button>
          <button class="btn btn-secondary" onclick="refreshResources()">🔄 刷新</button>
        </div>
        <div id="resource-list" style="display:flex;flex-direction:column;gap:0.4rem;max-height:320px;overflow-y:auto;"></div>
      </div>

      <div class="panel-section">
        <h3>🔒 资源权限设置</h3>
        <div style="display:flex;flex-direction:column;gap:0.5rem;">
          <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.3rem;">选中资源后设置可见范围</div>
          <select id="resource-permission" onchange="updateResourcePermission()">
            <option value="public">公开 - 所有用户可见</option>
            <option value="class">本班可见 - 仅同班学生</option>
            <option value="teacher">教师可见 - 仅教师和管理员</option>
          </select>
          <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.3rem;">当前选中: <span id="resource-perm-selected">无</span></div>
        </div>

        <h3 style="margin-top:1rem;">🔗 关联任务</h3>
        <div style="display:flex;flex-direction:column;gap:0.5rem;">
          <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.3rem;">将资源绑定到指定实训任务</div>
          <select id="resource-bind-task">
            <option value="">选择任务...</option>
            <option value="1">焊接基础实训</option>
            <option value="2">喷涂路径规划</option>
            <option value="3">打磨工艺优化</option>
          </select>
          <button class="btn btn-primary" onclick="bindResourceToTask()" style="margin-top:0.3rem;">绑定到任务</button>
          <div id="resource-bind-status" style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.3rem;"></div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel-section">
        <h3>📊 资源使用统计</h3>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:0.5rem;">
          <div class="stat-card">
            <div class="stat-value" id="res-stat-views">1,248</div>
            <div class="stat-label">总查看次数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--success);" id="res-stat-downloads">356</div>
            <div class="stat-label">总下载次数</div>
          </div>
        </div>
        <div style="margin-top:0.5rem;font-size:0.75rem;color:var(--text-secondary);">
          <div style="display:flex;justify-content:space-between;padding:0.2rem 0;">
            <span>本周新增查看</span><span style="color:var(--primary);font-weight:700;">+128</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:0.2rem 0;">
            <span>本周新增下载</span><span style="color:var(--success);font-weight:700;">+42</span>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <h3>📊 资源类型统计</h3>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;">
          <div class="stat-card">
            <div class="stat-value" id="res-stat-total">0</div>
            <div class="stat-label">总资源</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--success);" id="res-stat-video">0</div>
            <div class="stat-label">视频</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--secondary);" id="res-stat-doc">0</div>
            <div class="stat-label">文档</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 非管理员隐藏用户管理链接
    const role = localStorage.getItem('userRole');
    if (role !== 'admin') {
        const userLink = document.querySelector('a[href="users.html"]');
        if (userLink) userLink.style.display = 'none';
    }

    let resourceLibrary = [
      { id: 1, title: '机器人操作基础-第1章', type: 'video', difficulty: 'beginner', course: 'robot', size: '256MB', date: '2024-01-10', author: '王老师' },
      { id: 2, title: 'PLC编程入门教程', type: 'ppt', difficulty: 'beginner', course: 'plc', size: '12MB', date: '2024-01-12', author: '李老师' },
      { id: 3, title: '传感器应用实训指导', type: 'guide', difficulty: 'intermediate', course: 'sensor', size: '5MB', date: '2024-01-14', author: '张老师' },
      { id: 4, title: '焊接工艺参数手册', type: 'manual', difficulty: 'advanced', course: 'welding', size: '18MB', date: '2024-01-15', author: '陈老师' },
      { id: 5, title: '喷涂工艺基础微课', type: 'video', difficulty: 'beginner', course: 'spraying', size: '320MB', date: '2024-01-16', author: '王老师' },
      { id: 6, title: '打磨工艺实训指导', type: 'guide', difficulty: 'intermediate', course: 'grinding', size: '8MB', date: '2024-01-18', author: '刘老师' },
      { id: 7, title: '机器人故障排查题库', type: 'question', difficulty: 'advanced', course: 'robot', size: '2MB', date: '2024-01-20', author: '赵老师' },
      { id: 8, title: 'PLC高级编程技巧', type: 'video', difficulty: 'advanced', course: 'plc', size: '480MB', date: '2024-01-22', author: '李老师' },
      { id: 9, title: '传感器校准手册', type: 'manual', difficulty: 'intermediate', course: 'sensor', size: '6MB', date: '2024-01-25', author: '张老师' },
      { id: 10, title: '焊接质量检测标准', type: 'ppt', difficulty: 'intermediate', course: 'welding', size: '15MB', date: '2024-01-28', author: '陈老师' }
    ];

    const resourceTypeLabels = { video: '🎬 视频', ppt: '📑 课件', guide: '📖 指导', manual: '📘 手册', question: '📝 题库' };
    const resourceDifficultyLabels = { beginner: '初级', intermediate: '中级', advanced: '高级' };
    const resourceCourseLabels = { robot: '机器人操作', plc: 'PLC编程', sensor: '传感器应用', welding: '焊接工艺', spraying: '喷涂工艺', grinding: '打磨工艺' };

    let selectedResourceId = null;

    function renderResourceList(resources) {
      const list = document.getElementById('resource-list');
      if (!list) return;
      if (resources.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:1rem;font-size:0.8rem;">暂无匹配资源</div>';
        return;
      }
      list.innerHTML = resources.map(r => `
        <div class="resource-item" onclick="selectResource('${r.id}', '${r.title}')" id="res-item-${r.id}">
          <div style="font-size:1.2rem;">${resourceTypeLabels[r.type] || '📄'}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.title}</div>
            <div style="font-size:0.7rem;color:var(--text-secondary);display:flex;gap:0.5rem;flex-wrap:wrap;">
              <span>${resourceDifficultyLabels[r.difficulty]}</span>
              <span>${resourceCourseLabels[r.course]}</span>
              <span>${r.size}</span>
            </div>
          </div>
          <div style="font-size:0.7rem;color:var(--text-secondary);white-space:nowrap;">${r.date}</div>
        </div>
      `).join('');
    }

    function selectResource(id, title) {
      selectedResourceId = id;
      document.querySelectorAll('.resource-item').forEach(el => el.classList.remove('selected'));
      const item = document.getElementById('res-item-' + id);
      if (item) item.classList.add('selected');
      const el = document.getElementById('resource-perm-selected');
      if (el) el.textContent = title;
    }

    function updateResourceStats() {
      const total = resourceLibrary.length;
      const videos = resourceLibrary.filter(r => r.type === 'video').length;
      const docs = resourceLibrary.filter(r => ['ppt', 'guide', 'manual', 'question'].includes(r.type)).length;
      const elTotal = document.getElementById('res-stat-total');
      const elVideo = document.getElementById('res-stat-video');
      const elDoc = document.getElementById('res-stat-doc');
      if (elTotal) elTotal.textContent = total;
      if (elVideo) elVideo.textContent = videos;
      if (elDoc) elDoc.textContent = docs;
    }

    function searchResources() {
      filterResources();
    }

    function filterResources() {
      const keyword = document.getElementById('resource-search')?.value.toLowerCase() || '';
      const type = document.getElementById('resource-filter-type')?.value || '';
      const difficulty = document.getElementById('resource-filter-difficulty')?.value || '';
      const course = document.getElementById('resource-filter-course')?.value || '';

      const filtered = resourceLibrary.filter(r => {
        const matchKeyword = !keyword || r.title.toLowerCase().includes(keyword) || r.author.includes(keyword);
        const matchType = !type || r.type === type;
        const matchDifficulty = !difficulty || r.difficulty === difficulty;
        const matchCourse = !course || r.course === course;
        return matchKeyword && matchType && matchDifficulty && matchCourse;
      });
      renderResourceList(filtered);
    }

    function showUploadModal() {
      const title = prompt('请输入资源名称:');
      if (!title) return;
      const type = prompt('请选择类型 (video/ppt/guide/manual/question):', 'ppt');
      if (!type) return;
      const newResource = {
        id: Date.now(),
        title: title,
        type: type,
        difficulty: 'beginner',
        course: 'robot',
        size: '0MB',
        date: new Date().toISOString().split('T')[0],
        author: '当前教师'
      };
      resourceLibrary.unshift(newResource);
      filterResources();
      updateResourceStats();
    }

    function refreshResources() {
      filterResources();
      updateResourceStats();
    }

    function updateResourcePermission() {
      const perm = document.getElementById('resource-permission')?.value;
      const el = document.getElementById('resource-perm-selected');
      if (el) el.textContent = selectedResourceId ? `资源#${selectedResourceId} -> ${perm==='public'?'公开':perm==='class'?'本班可见':'教师可见'}` : '请先选择资源';
    }

    function bindResourceToTask() {
      const taskId = document.getElementById('resource-bind-task')?.value;
      const status = document.getElementById('resource-bind-status');
      if (!taskId) { if (status) status.textContent = '请先选择任务'; return; }
      if (status) status.textContent = `✅ 已绑定到任务 #${taskId}`;
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      renderResourceList(resourceLibrary);
      updateResourceStats();
    });
  </script>
</body>
</html>
