<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户管理 - 虚实一体仿真系统</title>
  <script src="auth-guard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --secondary: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f97316;
      --bg-dark: #0a0f1a;
      --bg-panel: #111827;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --gradient-1: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      --gradient-2: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      --gradient-3: linear-gradient(135deg, #22c55e 0%, #0ea5e9 100%);
      --shadow-glow: 0 0 20px rgba(14, 165, 233, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: rgba(10, 15, 26, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 60px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--gradient-1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .logo-text h1 {
      font-size: 1.25rem; font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-text p { font-size: 0.7rem; color: var(--text-secondary); }
    .top-nav { display:flex; gap:0.5rem; }
    .top-nav-item { padding:0.5rem 1rem; color:var(--text-secondary); text-decoration:none; border-radius:6px; font-size:0.85rem; transition:all 0.2s; }
    .top-nav-item:hover { background:var(--bg-hover); color:var(--text-primary); }
    .top-nav-item.active { background:rgba(14,165,233,0.15); color:var(--primary); }
    .back-btn { padding:0.5rem 1rem; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-family:inherit; font-size:0.8rem; cursor:pointer; transition:all 0.2s; }
    .back-btn:hover { background:var(--primary); border-color:var(--primary); }
    .page-container { max-width:1200px; margin:0 auto; padding:1.5rem; }
    .page-title { font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem; }
    .panel-section {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel-section h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
    @media (max-width:900px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
    input, select, textarea {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--bg-hover); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--border); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-group { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .mini-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
    .mini-table th, .mini-table td { padding:0.4rem; text-align:left; border-bottom:1px solid var(--border); }
    .mini-table th { color:var(--text-secondary); font-weight:500; }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="location.href='simulation.html'">
      <div class="logo-icon">🤖</div>
      <div class="logo-text"><h1>虚实一体仿真系统</h1><p>职业院校工业机器人及自动化流水线实训平台</p></div>
    </div>
    <nav class="top-nav">
      <a href="tasks.html" class="top-nav-item">📋 任务</a>
      <a href="assessment.html" class="top-nav-item">📊 考核</a>
      <a href="users.html" class="top-nav-item active">👥 用户</a>
      <a href="resources.html" class="top-nav-item">📚 资源</a>
      <a href="data.html" class="top-nav-item">📈 数据</a>
      <a href="qa.html" class="top-nav-item">💬 答疑</a>
      <a href="logs.html" class="top-nav-item">📝 日志</a>
    </nav>
    <button class="back-btn" onclick="location.href='simulation.html'">⬅ 返回仿真区</button>
  </header>

  <div class="page-container">
    <div class="page-title">👥 用户管理</div>

    <div class="grid-2">
      <div class="panel-section">
        <h3>🎭 当前角色切换</h3>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;">
          <button class="btn btn-primary" onclick="switchUserRole('admin')" id="role-btn-admin" style="flex:1;">👑 管理员</button>
          <button class="btn btn-secondary" onclick="switchUserRole('teacher')" id="role-btn-teacher" style="flex:1;">👨‍🏫 教师</button>
          <button class="btn btn-secondary" onclick="switchUserRole('student')" id="role-btn-student" style="flex:1;">👨‍🎓 学生</button>
        </div>
        <div style="background:var(--bg-dark);border-radius:6px;padding:0.5rem;font-size:0.8rem;text-align:center;">
          <span style="color:var(--text-secondary);">当前角色: </span>
          <span style="color:var(--primary);font-weight:700;" id="current-user-role">管理员</span>
        </div>
      </div>

      <div class="panel-section">
        <h3>👥 用户列表</h3>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;">
          <input type="text" id="user-search" placeholder="搜索用户..." style="flex:1;" oninput="searchUsers()">
          <button class="btn btn-primary" onclick="showAddUserModal()">➕ 添加</button>
        </div>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap;">
          <select id="user-filter-role" onchange="filterUsers()" style="flex:1;min-width:80px;">
            <option value="">全部角色</option>
            <option value="admin">管理员</option>
            <option value="teacher">教师</option>
            <option value="student">学生</option>
          </select>
          <select id="user-filter-status" onchange="filterUsers()" style="flex:1;min-width:80px;">
            <option value="">全部状态</option>
            <option value="active">启用</option>
            <option value="inactive">禁用</option>
          </select>
        </div>
        <div id="user-list" style="display:flex;flex-direction:column;gap:0.4rem;max-height:280px;overflow-y:auto;">
          <!-- 用户列表由JS动态生成 -->
        </div>
      </div>

      <div class="panel-section">
        <h3>📋 权限矩阵</h3>
        <div style="overflow-x:auto;">
          <table class="mini-table" id="permission-matrix">
            <thead>
              <tr><th>功能模块</th><th>管理员</th><th>教师</th><th>学生</th></tr>
            </thead>
            <tbody>
              <tr><td>系统配置</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--text-secondary);">无权限</td><td style="color:var(--text-secondary);">无权限</td></tr>
              <tr><td>资源全局管理</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--warning);">可读</td><td style="color:var(--text-secondary);">无权限</td></tr>
              <tr><td>本班资源管理</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--warning);">可读</td></tr>
              <tr><td>任务下发</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--text-secondary);">无权限</td></tr>
              <tr><td>查看任务</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--warning);">可读</td></tr>
              <tr><td>仿真操作</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--success);font-weight:700;">可写</td></tr>
              <tr><td>成绩复核</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--text-secondary);">无权限</td></tr>
              <tr><td>学情查看</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--warning);">仅本人</td></tr>
              <tr><td>用户管理</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--text-secondary);">无权限</td><td style="color:var(--text-secondary);">无权限</td></tr>
              <tr><td>账号批量导入</td><td style="color:var(--success);font-weight:700;">可写</td><td style="color:var(--text-secondary);">无权限</td><td style="color:var(--text-secondary);">无权限</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel-section">
        <h3>📥 批量导入</h3>
        <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.5rem;">支持 CSV/Excel 格式批量导入用户</div>
        <div class="btn-group" style="margin-bottom:0.5rem;">
          <button class="btn btn-primary" onclick="importUsersCSV()">📤 导入 CSV</button>
          <button class="btn btn-secondary" onclick="downloadTemplate()">📥 下载模板</button>
        </div>
        <input type="file" id="user-import-file" style="display:none;" accept=".csv,.xlsx" onchange="handleUserImport(this)">
      </div>
    </div>
  </div>

  <script>
    // 管理员权限验证
    const currentUserRoleCheck = localStorage.getItem('userRole');
    if (currentUserRoleCheck !== 'admin') {
        document.querySelector('.page-container').innerHTML = `
            <div style="text-align:center;padding:4rem 2rem;">
                <div style="font-size:4rem;margin-bottom:1rem;">🔒</div>
                <h2 style="color:var(--danger);margin-bottom:1rem;">权限不足</h2>
                <p style="color:var(--text-secondary);margin-bottom:2rem;">用户管理功能仅限管理员访问</p>
                <button onclick="location.href='simulation.html'" style="padding:0.6rem 1.5rem;background:var(--gradient-1);border:none;border-radius:8px;color:white;font-family:inherit;font-size:0.9rem;cursor:pointer;">返回仿真区</button>
            </div>
        `;
    }

    // ---------- 用户管理模块 ----------
    let currentUserRole = 'admin';

    let userListData = [
      { id: 1, name: '系统管理员', role: 'admin', class: '-', status: 'active', lastLogin: '2024-02-15 09:30', email: 'admin@school.edu' },
      { id: 2, name: '王老师', role: 'teacher', class: '机电一体化23-1班', status: 'active', lastLogin: '2024-02-15 08:15', email: 'wang@school.edu' },
      { id: 3, name: '李老师', role: 'teacher', class: '工业机器人23-1班', status: 'active', lastLogin: '2024-02-14 16:20', email: 'li@school.edu' },
      { id: 4, name: '张小明', role: 'student', class: '机电一体化23-1班', status: 'active', lastLogin: '2024-02-15 10:05', email: 'zhangxm@student.edu' },
      { id: 5, name: '李小红', role: 'student', class: '机电一体化23-1班', status: 'active', lastLogin: '2024-02-15 09:50', email: 'lixh@student.edu' },
      { id: 6, name: '王大伟', role: 'student', class: '工业机器人23-1班', status: 'inactive', lastLogin: '2024-02-10 14:30', email: 'wangdw@student.edu' },
      { id: 7, name: '刘小丽', role: 'student', class: '智能制造23-1班', status: 'active', lastLogin: '2024-02-15 08:45', email: 'liuxl@student.edu' },
      { id: 8, name: '陈小强', role: 'student', class: '智能制造23-1班', status: 'active', lastLogin: '2024-02-15 11:10', email: 'chenxq@student.edu' }
    ];

    const roleLabels = { admin: '👑 管理员', teacher: '👨‍🏫 教师', student: '👨‍🎓 学生' };
    const roleColors = { admin: 'var(--danger)', teacher: 'var(--primary)', student: 'var(--success)' };
    const statusLabels = { active: '✅ 启用', inactive: '❌ 禁用' };

    window.switchUserRole = function(role) {
      currentUserRole = role;
      document.getElementById('current-user-role').textContent = role === 'admin' ? '管理员' : role === 'teacher' ? '教师' : '学生';
      ['admin', 'teacher', 'student'].forEach(r => {
        const btn = document.getElementById('role-btn-' + r);
        if (btn) btn.className = r === role ? 'btn btn-primary' : 'btn btn-secondary';
      });
      alert(`切换角色为: ${roleLabels[role]}`);
    };

    function renderUserList(users) {
      const list = document.getElementById('user-list');
      if (!list) return;
      if (users.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:1rem;font-size:0.8rem;">暂无匹配用户</div>';
        return;
      }
      list.innerHTML = users.map(u => `
        <div style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
          <div style="width:32px;height:32px;border-radius:50%;background:${roleColors[u.role]};display:flex;align-items:center;justify-content:center;font-size:0.9rem;color:white;font-weight:700;">${u.name.charAt(0)}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:500;">${u.name}</div>
            <div style="font-size:0.7rem;color:var(--text-secondary);display:flex;gap:0.5rem;flex-wrap:wrap;">
              <span>${roleLabels[u.role]}</span>
              <span>${u.class}</span>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.7rem;padding:0.1rem 0.4rem;border-radius:3px;background:${u.status==='active'?'rgba(34,197,94,0.2)':'rgba(239,68,68,0.2)'};color:${u.status==='active'?'var(--success)':'var(--danger)'};margin-bottom:0.2rem;">${statusLabels[u.status]}</div>
            <div style="font-size:0.65rem;color:var(--text-secondary);">${u.lastLogin}</div>
          </div>
          <div style="display:flex;gap:0.25rem;">
            <button class="btn btn-secondary" style="padding:0.2rem 0.4rem;font-size:0.7rem;" onclick="editUser(${u.id})">编辑</button>
            <button class="btn btn-${u.status==='active'?'danger':'success'}" style="padding:0.2rem 0.4rem;font-size:0.7rem;" onclick="toggleUserStatus(${u.id})">${u.status==='active'?'禁用':'启用'}</button>
          </div>
        </div>
      `).join('');
    }

    window.searchUsers = function() { filterUsers(); };
    window.filterUsers = function() {
      const keyword = document.getElementById('user-search')?.value.toLowerCase() || '';
      const role = document.getElementById('user-filter-role')?.value || '';
      const status = document.getElementById('user-filter-status')?.value || '';
      const filtered = userListData.filter(u => {
        const matchKeyword = !keyword || u.name.toLowerCase().includes(keyword) || u.email.toLowerCase().includes(keyword);
        const matchRole = !role || u.role === role;
        const matchStatus = !status || u.status === status;
        return matchKeyword && matchRole && matchStatus;
      });
      renderUserList(filtered);
    };

    window.showAddUserModal = function() {
      const name = prompt('请输入用户姓名:');
      if (!name) return;
      const role = prompt('请选择角色 (admin/teacher/student):', 'student');
      if (!role || !['admin','teacher','student'].includes(role)) { alert('无效的角色'); return; }
      const cls = role === 'student' ? prompt('请输入班级:', '机电一体化23-1班') : '-';
      const newUser = { id: Date.now(), name, role, class: cls || '-', status: 'active', lastLogin: '-', email: name + '@school.edu' };
      userListData.unshift(newUser);
      filterUsers();
      alert(`添加用户: ${name} (${roleLabels[role]})`);
    };

    window.editUser = function(id) {
      const user = userListData.find(u => u.id === id);
      if (!user) return;
      const newName = prompt('修改姓名:', user.name);
      if (newName) { user.name = newName; filterUsers(); alert(`编辑用户: ${newName}`); }
    };

    window.toggleUserStatus = function(id) {
      const user = userListData.find(u => u.id === id);
      if (!user) return;
      user.status = user.status === 'active' ? 'inactive' : 'active';
      filterUsers();
      alert(`${user.name} 账号已${user.status==='active'?'启用':'禁用'}`);
    };

    window.importUsersCSV = function() { document.getElementById('user-import-file').click(); };

    window.downloadTemplate = function() {
      const csv = '姓名,角色,班级,邮箱\n张三,student,机电一体化23-1班,zhangsan@student.edu\n李四,teacher,机电一体化23-1班,lisi@school.edu';
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'user_template.csv'; a.click();
      URL.revokeObjectURL(url);
      alert('下载用户导入模板');
    };

    window.handleUserImport = function(input) {
      const file = input.files[0];
      if (!file) return;
      alert(`导入用户文件: ${file.name}`);
      input.value = '';
    };

    // 初始化
    filterUsers();
  </script>
</body>
</html>
