<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚实一体仿真系统 - 3D虚拟场景</title>
    <script src="auth-guard.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            min-width: 280px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        #info-panel h2 {
            font-size: 1.25rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .device-info {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 6px;
            border-left: 3px solid #0ea5e9;
        }

        .device-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .device-status {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .status-online {
            color: #22c55e;
        }

        .status-offline {
            color: #ef4444;
        }

        .status-warning {
            color: #f59e0b;
        }

        #control-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .control-btn {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 4px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        .control-btn.secondary {
            background: #334155;
        }

        .control-btn.danger {
            background: #ef4444;
        }

        #mode-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .mode-btn {
            display: block;
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            text-align: left;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: #334155;
            border-color: #0ea5e9;
        }

        .mode-btn.active {
            background: rgba(14, 165, 233, 0.2);
            border-color: #0ea5e9;
        }

        .mode-btn .mode-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .mode-btn .mode-desc {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #334155;
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            pointer-events: none;
            display: none;
            z-index: 150;
            font-size: 0.85rem;
        }

        .joint-control {
            margin-top: 10px;
        }

        .joint-slider {
            width: 100%;
            margin: 5px 0;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #334155;
            outline: none;
        }

        .joint-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #0ea5e9;
            cursor: pointer;
        }

        .joint-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>正在加载3D虚拟场景...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="tooltip"></div>

    <div id="info-panel">
        <h2>🏭 虚拟产线状态</h2>
        <div id="device-list">
            <div class="device-info">
                <div class="device-name">🤖 工业机器人-1</div>
                <div class="device-status">
                    状态: <span class="status-online" id="robot-status">待机</span> | 
                    模式: <span id="robot-mode">手动</span>
                </div>
                <div class="joint-control">
                    <div class="joint-label"><span>关节1</span><span id="j1-val">0°</span></div>
                    <input type="range" class="joint-slider" id="j1-slider" min="-180" max="180" value="0">
                    <div class="joint-label"><span>关节2</span><span id="j2-val">0°</span></div>
                    <input type="range" class="joint-slider" id="j2-slider" min="-180" max="180" value="0">
                    <div class="joint-label"><span>关节3</span><span id="j3-val">0°</span></div>
                    <input type="range" class="joint-slider" id="j3-slider" min="-180" max="180" value="0">
                </div>
            </div>
            <div class="device-info">
                <div class="device-name">🏭 主PLC</div>
                <div class="device-status">
                    状态: <span class="status-online" id="plc-status">运行中</span> | 
                    扫描: <span id="plc-scan">10ms</span>
                </div>
            </div>
            <div class="device-info">
                <div class="device-name">📡 传感器组</div>
                <div class="device-status">
                    光电1: <span class="status-online" id="sensor1">有料</span> | 
                    光电2: <span class="status-offline" id="sensor2">无料</span>
                </div>
            </div>
            <div class="device-info">
                <div class="device-name">⚙️ 传送带</div>
                <div class="device-status">
                    状态: <span class="status-online" id="conveyor-status">运行中</span> | 
                    速度: <span id="conveyor-speed">5.0 m/min</span>
                </div>
            </div>
        </div>
    </div>

    <div id="mode-selector">
        <h3 style="margin-bottom: 12px; font-size: 1rem;">运行模式</h3>
        <button class="mode-btn active" onclick="setMode('virtual')">
            <div class="mode-title">💻 纯虚拟仿真</div>
            <div class="mode-desc">虚拟环境独立运行</div>
        </button>
        <button class="mode-btn" onclick="setMode('hybrid')">
            <div class="mode-title">🔗 虚实联动</div>
            <div class="mode-desc">虚拟与真实双向同步</div>
        </button>
        <button class="mode-btn" onclick="setMode('real')">
            <div class="mode-title">🏭 全实物实操</div>
            <div class="mode-desc">直接控制真实设备</div>
        </button>
    </div>

    <div id="control-panel">
        <button class="control-btn" onclick="resetScene()">🔄 复位</button>
        <button class="control-btn" onclick="toggleAnimation()">▶️ 启动</button>
        <button class="control-btn secondary" onclick="changeView()">👁️ 切换视角</button>
        <button class="control-btn danger" onclick="emergencyStop()">🚨 急停</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 全局变量
        let scene, camera, renderer, controls;
        let robot, conveyor, sensors = [], actuators = [];
        let isAnimating = false;
        let currentMode = 'virtual';
        let ws = null;
        let animationId = null;

        // 机器人关节
        let robotJoints = [];
        let targetJointAngles = [0, 0, 0, 0, 0, 0];
        let currentJointAngles = [0, 0, 0, 0, 0, 0];

        // 初始化场景
        function init() {
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 10, 50);

            // 相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 8);
            camera.lookAt(0, 0, 0);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2;

            // 灯光
            setupLighting();

            // 地面
            createFloor();

            // 创建设备
            createRobot();
            createConveyor();
            createSensors();
            createActuators();
            createWorkpieces();

            // 连接WebSocket
            connectWebSocket();

            // 事件监听
            setupEventListeners();

            // 隐藏加载
            document.getElementById('loading').style.display = 'none';

            // 开始渲染
            animate();
        }

        // 设置灯光
        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.near = 0.1;
            directionalLight.shadow.camera.far = 50;
            directionalLight.shadow.camera.left = -10;
            directionalLight.shadow.camera.right = 10;
            directionalLight.shadow.camera.top = 10;
            directionalLight.shadow.camera.bottom = -10;
            scene.add(directionalLight);

            // 工业风格点光源
            const pointLight1 = new THREE.PointLight(0x0ea5e9, 0.5, 10);
            pointLight1.position.set(-3, 4, -3);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xf59e0b, 0.3, 8);
            pointLight2.position.set(3, 3, 3);
            scene.add(pointLight2);
        }

        // 创建地面
        function createFloor() {
            const floorGeometry = new THREE.PlaneGeometry(20, 20);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x1e293b,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 网格线
            const gridHelper = new THREE.GridHelper(20, 20, 0x334155, 0x1e293b);
            scene.add(gridHelper);
        }

        // 创建机器人
        function createRobot() {
            robot = new THREE.Group();

            // 基座
            const baseGeometry = new THREE.CylinderGeometry(0.4, 0.5, 0.3, 32);
            const baseMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x334155,
                roughness: 0.5,
                metalness: 0.8
            });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.15;
            base.castShadow = true;
            robot.add(base);

            // 关节1 (基座旋转)
            const joint1Group = new THREE.Group();
            joint1Group.position.y = 0.3;
            robot.add(joint1Group);
            robotJoints.push(joint1Group);

            // 大臂
            const arm1Geometry = new THREE.BoxGeometry(0.2, 1.2, 0.2);
            const armMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x0ea5e9,
                roughness: 0.3,
                metalness: 0.7
            });
            const arm1 = new THREE.Mesh(arm1Geometry, armMaterial);
            arm1.position.y = 0.6;
            arm1.castShadow = true;
            joint1Group.add(arm1);

            // 关节2 (大臂俯仰)
            const joint2Group = new THREE.Group();
            joint2Group.position.y = 1.2;
            joint1Group.add(joint2Group);
            robotJoints.push(joint2Group);

            // 小臂
            const arm2Geometry = new THREE.BoxGeometry(0.15, 1.0, 0.15);
            const arm2 = new THREE.Mesh(arm2Geometry, armMaterial);
            arm2.position.y = 0.5;
            arm2.castShadow = true;
            joint2Group.add(arm2);

            // 关节3 (小臂俯仰)
            const joint3Group = new THREE.Group();
            joint3Group.position.y = 1.0;
            joint2Group.add(joint3Group);
            robotJoints.push(joint3Group);

            // 手腕
            const wristGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.3, 16);
            const wrist = new THREE.Mesh(wristGeometry, armMaterial);
            wrist.position.y = 0.15;
            wrist.castShadow = true;
            joint3Group.add(wrist);

            // 关节4 (手腕旋转)
            const joint4Group = new THREE.Group();
            joint4Group.position.y = 0.3;
            joint3Group.add(joint4Group);
            robotJoints.push(joint4Group);

            // 关节5 (手腕俯仰)
            const joint5Group = new THREE.Group();
            joint4Group.add(joint5Group);
            robotJoints.push(joint5Group);

            // 关节6 (手腕旋转)
            const joint6Group = new THREE.Group();
            joint5Group.add(joint6Group);
            robotJoints.push(joint6Group);

            // 末端执行器 (夹爪)
            const gripperGeometry = new THREE.BoxGeometry(0.15, 0.05, 0.1);
            const gripperMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xf59e0b,
                roughness: 0.4,
                metalness: 0.6
            });
            const gripper = new THREE.Mesh(gripperGeometry, gripperMaterial);
            gripper.position.y = 0.05;
            gripper.castShadow = true;
            joint6Group.add(gripper);

            // TCP 点
            const tcpGeometry = new THREE.SphereGeometry(0.03, 16, 16);
            const tcpMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const tcp = new THREE.Mesh(tcpGeometry, tcpMaterial);
            tcp.position.y = 0.1;
            joint6Group.add(tcp);

            robot.position.set(-2, 0, 0);
            scene.add(robot);

            // 添加标签
            addLabel(robot, "机器人-1", 2.5);
        }

        // 创建传送带
        function createConveyor() {
            conveyor = new THREE.Group();

            // 传送带主体
            const beltGeometry = new THREE.BoxGeometry(4, 0.1, 0.8);
            const beltMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x1e293b,
                roughness: 0.9,
                metalness: 0.1
            });
            const belt = new THREE.Mesh(beltGeometry, beltMaterial);
            belt.position.y = 0.85;
            belt.castShadow = true;
            conveyor.add(belt);

            // 传送带表面 (动态纹理)
            const surfaceGeometry = new THREE.PlaneGeometry(4, 0.8);
            const surfaceMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x334155,
                roughness: 0.8,
                metalness: 0.2
            });
            const surface = new THREE.Mesh(surfaceGeometry, surfaceMaterial);
            surface.rotation.x = -Math.PI / 2;
            surface.position.y = 0.9;
            conveyor.add(surface);

            // 支架
            const legGeometry = new THREE.BoxGeometry(0.1, 0.8, 0.1);
            const legMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x475569,
                roughness: 0.6,
                metalness: 0.4
            });

            for (let i = 0; i < 4; i++) {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(-1.5 + i * 1.0, 0.4, 0.35);
                leg.castShadow = true;
                conveyor.add(leg);

                const leg2 = new THREE.Mesh(legGeometry, legMaterial);
                leg2.position.set(-1.5 + i * 1.0, 0.4, -0.35);
                leg2.castShadow = true;
                conveyor.add(leg2);
            }

            conveyor.position.set(1, 0, 0);
            scene.add(conveyor);

            addLabel(conveyor, "传送带", 1.5);
        }

        // 创建传感器
        function createSensors() {
            const sensorPositions = [
                { x: -0.5, z: 0.5, name: "光电1" },
                { x: 1.5, z: 0.5, name: "光电2" },
                { x: 0.5, z: -0.6, name: "颜色" },
                { x: -1.0, z: -0.6, name: "温度" }
            ];

            sensorPositions.forEach((pos, index) => {
                const sensor = new THREE.Group();

                // 传感器主体
                const bodyGeometry = new THREE.BoxGeometry(0.08, 0.15, 0.08);
                const bodyMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x22c55e,
                    roughness: 0.4,
                    metalness: 0.6
                });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.castShadow = true;
                sensor.add(body);

                // 检测指示灯
                const lightGeometry = new THREE.SphereGeometry(0.02, 16, 16);
                const lightMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const light = new THREE.Mesh(lightGeometry, lightMaterial);
                light.position.y = 0.1;
                sensor.add(light);

                // 支架
                const standGeometry = new THREE.CylinderGeometry(0.02, 0.02, 0.5, 8);
                const standMaterial = new THREE.MeshStandardMaterial({ color: 0x475569 });
                const stand = new THREE.Mesh(standGeometry, standMaterial);
                stand.position.y = -0.25;
                sensor.add(stand);

                sensor.position.set(pos.x, 1.2, pos.z);
                conveyor.add(sensor);
                sensors.push({ mesh: sensor, light: light, name: pos.name, detected: false });

                addLabel(sensor, pos.name, 0.5);
            });
        }

        // 创建执行器
        function createActuators() {
            // 气动夹爪
            const gripper = new THREE.Group();

            const gripperBodyGeometry = new THREE.BoxGeometry(0.2, 0.1, 0.15);
            const gripperMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xf59e0b,
                roughness: 0.4,
                metalness: 0.6
            });
            const gripperBody = new THREE.Mesh(gripperBodyGeometry, gripperMaterial);
            gripperBody.castShadow = true;
            gripper.add(gripperBody);

            // 夹爪手指
            const fingerGeometry = new THREE.BoxGeometry(0.03, 0.08, 0.05);
            const finger1 = new THREE.Mesh(fingerGeometry, gripperMaterial);
            finger1.position.set(-0.08, -0.08, 0);
            gripper.add(finger1);

            const finger2 = new THREE.Mesh(fingerGeometry, gripperMaterial);
            finger2.position.set(0.08, -0.08, 0);
            gripper.add(finger2);

            gripper.position.set(0, 0.1, 0);
            robotJoints[5].add(gripper);
            actuators.push({ mesh: gripper, type: 'gripper', active: false });

            // 气缸
            const cylinder = new THREE.Group();
            const cylinderBodyGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 16);
            const cylinderMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x6366f1,
                roughness: 0.3,
                metalness: 0.7
            });
            const cylinderBody = new THREE.Mesh(cylinderBodyGeometry, cylinderMaterial);
            cylinderBody.castShadow = true;
            cylinder.add(cylinderBody);

            const pistonGeometry = new THREE.CylinderGeometry(0.03, 0.03, 0.2, 16);
            const pistonMaterial = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
            const piston = new THREE.Mesh(pistonGeometry, pistonMaterial);
            piston.position.y = 0.25;
            cylinder.add(piston);

            cylinder.position.set(2.5, 0.5, 0.5);
            scene.add(cylinder);
            actuators.push({ mesh: cylinder, piston: piston, type: 'cylinder', active: false });
        }

        // 创建工件
        function createWorkpieces() {
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00];
            
            for (let i = 0; i < 4; i++) {
                const workpieceGeometry = new THREE.BoxGeometry(0.15, 0.1, 0.15);
                const workpieceMaterial = new THREE.MeshStandardMaterial({ 
                    color: colors[i],
                    roughness: 0.6,
                    metalness: 0.3
                });
                const workpiece = new THREE.Mesh(workpieceGeometry, workpieceMaterial);
                workpiece.position.set(-1.5 + i * 0.8, 1.0, 0);
                workpiece.castShadow = true;
                conveyor.add(workpiece);
            }
        }

        // 添加标签
        function addLabel(parent, text, yOffset) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            
            context.fillStyle = 'rgba(15, 23, 42, 0.8)';
            context.fillRect(0, 0, 256, 64);
            
            context.fillStyle = '#f1f5f9';
            context.font = 'bold 24px Arial';
            context.textAlign = 'center';
            context.fillText(text, 128, 40);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.y = yOffset;
            sprite.scale.set(1, 0.25, 1);
            parent.add(sprite);
        }

        // 连接WebSocket
        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:3001');
            
            ws.onopen = () => {
                console.log('WebSocket 已连接');
                ws.send(JSON.stringify({
                    type: 'subscribe',
                    dataPoints: ['*']
                }));
            };
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleWebSocketMessage(message);
            };
            
            ws.onclose = () => {
                console.log('WebSocket 已断开');
                setTimeout(connectWebSocket, 5000);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
            };
        }

        // 处理WebSocket消息
        function handleWebSocketMessage(message) {
            switch (message.type) {
                case 'data':
                    updateDeviceData(message.data);
                    break;
                case 'faultInjected':
                    showFaultEffect(message.data);
                    break;
                case 'virtualToReal':
                case 'realToVirtual':
                    updateSyncStatus(message);
                    break;
            }
        }

        // 更新设备数据
        function updateDeviceData(data) {
            if (data.deviceId === 'robot_1' && data.jointAngles) {
                targetJointAngles = data.jointAngles;
            }
        }

        // 显示故障效果
        function showFaultEffect(fault) {
            console.log('故障注入:', fault.definition.name);
            
            // 视觉反馈
            const flash = document.createElement('div');
            flash.style.cssText = `
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(239, 68, 68, 0.3);
                pointer-events: none;
                z-index: 1000;
                animation: flash 0.5s ease-out;
            `;
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 500);
        }

        // 更新同步状态
        function updateSyncStatus(message) {
            // 更新UI显示
            const status = document.getElementById('robot-status');
            if (status) {
                status.textContent = '同步中';
                status.className = 'status-warning';
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 窗口大小调整
            window.addEventListener('resize', onWindowResize);

            // 鼠标点击
            renderer.domElement.addEventListener('click', onMouseClick);

            // 关节滑块
            for (let i = 1; i <= 3; i++) {
                const slider = document.getElementById(`j${i}-slider`);
                if (slider) {
                    slider.addEventListener('input', (e) => {
                        const angle = parseFloat(e.target.value);
                        targetJointAngles[i-1] = angle;
                        document.getElementById(`j${i}-val`).textContent = angle + '°';
                    });
                }
            }
        }

        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 鼠标点击
        function onMouseClick(event) {
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                const object = intersects[0].object;
                showTooltip(event.clientX, event.clientY, object);
            }
        }

        // 显示提示
        function showTooltip(x, y, object) {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.left = x + 10 + 'px';
            tooltip.style.top = y + 10 + 'px';
            tooltip.style.display = 'block';
            tooltip.innerHTML = `
                <strong>设备信息</strong><br>
                类型: ${object.geometry.type}<br>
                位置: ${object.position.x.toFixed(2)}, ${object.position.y.toFixed(2)}, ${object.position.z.toFixed(2)}
            `;
            
            setTimeout(() => {
                tooltip.style.display = 'none';
            }, 2000);
        }

        // 动画循环
        function animate() {
            animationId = requestAnimationFrame(animate);

            // 更新机器人关节
            updateRobotJoints();

            // 更新传感器状态
            updateSensors();

            // 更新执行器
            updateActuators();

            // 传送带动画
            if (isAnimating) {
                animateConveyor();
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // 更新机器人关节
        function updateRobotJoints() {
            const speed = 2.0 * 0.016; // 插值速度
            
            for (let i = 0; i < 6 && i < robotJoints.length; i++) {
                currentJointAngles[i] += (targetJointAngles[i] - currentJointAngles[i]) * speed;
                
                switch (i) {
                    case 0:
                        robotJoints[i].rotation.y = currentJointAngles[i] * Math.PI / 180;
                        break;
                    case 1:
                    case 2:
                    case 3:
                        robotJoints[i].rotation.x = currentJointAngles[i] * Math.PI / 180;
                        break;
                    case 4:
                        robotJoints[i].rotation.y = currentJointAngles[i] * Math.PI / 180;
                        break;
                    case 5:
                        robotJoints[i].rotation.x = currentJointAngles[i] * Math.PI / 180;
                        break;
                }
            }
        }

        // 更新传感器
        function updateSensors() {
            sensors.forEach((sensor, index) => {
                // 模拟检测状态变化
                if (isAnimating && Math.random() > 0.95) {
                    sensor.detected = !sensor.detected;
                    sensor.light.material.color.setHex(sensor.detected ? 0x00ff00 : 0xff0000);
                }
            });
        }

        // 更新执行器
        function updateActuators() {
            actuators.forEach(actuator => {
                if (actuator.type === 'cylinder' && actuator.piston) {
                    const targetY = actuator.active ? 0.45 : 0.25;
                    actuator.piston.position.y += (targetY - actuator.piston.position.y) * 0.1;
                }
            });
        }

        // 传送带动画
        function animateConveyor() {
            // 工件移动
            conveyor.children.forEach(child => {
                if (child.geometry && child.geometry.type === 'BoxGeometry' && child.position.y === 1.0) {
                    child.position.x += 0.005;
                    if (child.position.x > 2) {
                        child.position.x = -1.5;
                    }
                }
            });
        }

        // 全局函数
        window.setMode = function(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.mode-btn').classList.add('active');
            
            console.log('切换到模式:', mode);
            
            // 发送模式切换命令
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'modeChange',
                    mode: mode
                }));
            }
        };

        window.resetScene = function() {
            targetJointAngles = [0, 0, 0, 0, 0, 0];
            for (let i = 1; i <= 3; i++) {
                const slider = document.getElementById(`j${i}-slider`);
                if (slider) slider.value = 0;
                const val = document.getElementById(`j${i}-val`);
                if (val) val.textContent = '0°';
            }
            console.log('场景已复位');
        };

        window.toggleAnimation = function() {
            isAnimating = !isAnimating;
            const btn = event.target;
            btn.textContent = isAnimating ? '⏸️ 暂停' : '▶️ 启动';
            console.log('动画状态:', isAnimating ? '运行' : '暂停');
        };

        window.changeView = function() {
            const views = [
                { x: 5, y: 5, z: 8 },
                { x: 0, y: 8, z: 0 },
                { x: 8, y: 2, z: 0 },
                { x: -5, y: 3, z: 5 }
            ];
            
            const currentView = views[Math.floor(Math.random() * views.length)];
            camera.position.set(currentView.x, currentView.y, currentView.z);
            camera.lookAt(0, 0, 0);
        };

        window.emergencyStop = function() {
            isAnimating = false;
            targetJointAngles = [...currentJointAngles];
            
            // 视觉反馈
            const flash = document.createElement('div');
            flash.style.cssText = `
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(239, 68, 68, 0.5);
                pointer-events: none;
                z-index: 1000;
                animation: flash 1s ease-out;
            `;
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 1000);
            
            console.log('🚨 紧急停止！');
            alert('紧急停止已触发！所有设备已停止。');
        };

        // 启动
        init();
    </script>

    <style>
        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</body>
</html>
