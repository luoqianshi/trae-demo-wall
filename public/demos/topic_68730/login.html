<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 虚实一体仿真系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;
            --bg-dark: #0a0f1a;
            --bg-panel: #111827;
            --bg-card: rgba(15, 23, 42, 0.95);
            --bg-input: rgba(30, 41, 59, 0.8);
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(51, 65, 85, 0.5);
            --border-card: rgba(14, 165, 233, 0.3);
            --gradient-1: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            --shadow-glow: 0 0 20px rgba(14, 165, 233, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 背景网格动画 */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -2;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* 背景渐变光晕 */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(14, 165, 233, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(34, 197, 94, 0.04) 0%, transparent 60%);
            z-index: -1;
        }

        /* 粒子背景 Canvas */
        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* 登录卡片 */
        .login-card {
            width: 420px;
            max-width: 95vw;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 2.5rem 2rem 2rem;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(14, 165, 233, 0.1);
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), transparent 40%, transparent 60%, rgba(99, 102, 241, 0.15));
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite alternate;
        }
        @keyframes borderGlow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* Logo区域 */
        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            position: relative;
        }
        .logo-icon svg {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 0 15px rgba(14, 165, 233, 0.5));
            animation: gearSpin 8s linear infinite;
        }
        @keyframes gearSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .logo-title {
            font-size: 1.6rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
        }
        .logo-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        /* 错误提示 */
        .error-msg {
            display: none;
            width: 100%;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.85rem;
            text-align: left;
            animation: shakeX 0.4s ease-in-out;
        }
        .error-msg.show {
            display: block;
        }
        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 表单 */
        .form-group {
            margin-bottom: 1rem;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            font-size: 0.9rem;
        }
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15), 0 0 20px rgba(14, 165, 233, 0.1);
        }
        .form-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 密码显示/隐藏 */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: color 0.2s;
        }
        .toggle-password:hover {
            color: var(--primary);
        }

        /* 角色选择 */
        .form-group select {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
            appearance: none;
            cursor: pointer;
        }
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }
        .form-group select option {
            background: #1e293b;
            color: var(--text-primary);
        }
        .select-arrow {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            font-size: 0.7rem;
        }

        /* 记住我 */
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
        }
        .remember-row label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .remember-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
        }
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.4);
        }
        .login-btn:hover::before {
            left: 100%;
        }
        .login-btn:active {
            transform: translateY(0);
        }

        /* 登录成功动画 */
        .login-card.success {
            animation: fadeInOut 0.5s ease-in forwards;
        }

        /* 测试账户提示 */
        .test-info {
            margin-top: 1.5rem;
            padding: 0.75rem;
            background: rgba(14, 165, 233, 0.05);
            border: 1px solid rgba(14, 165, 233, 0.15);
            border-radius: 8px;
            font-size: 0.75rem;
        }
        .test-info-title {
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }
        .test-info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.2rem 0;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            padding: 0.2rem 0.4rem;
        }
        .test-info-row:hover {
            background: rgba(14, 165, 233, 0.1);
            color: var(--text-primary);
        }
        .test-info-row .role-tag {
            font-size: 0.65rem;
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            font-weight: 600;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .role-tag.admin { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .role-tag.teacher { background: rgba(14, 165, 233, 0.2); color: #0ea5e9; }
        .role-tag.student { background: rgba(34, 197, 94, 0.2); color: #22c55e; }

        /* 底部 */
        .footer-info {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem 1.5rem;
            }
            .logo-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="login-card" id="loginCard">
        <!-- Logo区域 -->
        <div class="logo-area">
            <div class="logo-icon">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M32 4L38 10L32 16L26 10L32 4Z" fill="url(#g1)"/>
                    <path d="M44 8L50 14L44 20L38 14L44 8Z" fill="url(#g1)" opacity="0.7"/>
                    <path d="M20 8L26 14L20 20L14 14L20 8Z" fill="url(#g1)" opacity="0.7"/>
                    <circle cx="32" cy="32" r="10" stroke="url(#g1)" stroke-width="2.5" fill="none"/>
                    <circle cx="32" cy="32" r="4" fill="url(#g1)"/>
                    <path d="M32 22V18M32 46V42M42 32H46M18 32H22M38.5 25.5L41.5 22.5M22.5 41.5L25.5 38.5M38.5 38.5L41.5 41.5M22.5 22.5L25.5 25.5" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64">
                            <stop stop-color="#0ea5e9"/>
                            <stop offset="1" stop-color="#6366f1"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="logo-title">虚实一体仿真系统</div>
            <div class="logo-subtitle">职业院校工业机器人及自动化流水线实训平台</div>
        </div>

        <!-- 错误提示 -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- 登录表单 -->
        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label>用户名</label>
                <div class="input-wrapper">
                    <span class="icon">&#128100;</span>
                    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label>密码</label>
                <div class="input-wrapper">
                    <span class="icon">&#128274;</span>
                    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePwd" title="显示/隐藏密码">
                        <span id="eyeIcon">&#128065;</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>角色</label>
                <div class="input-wrapper">
                    <span class="icon">&#127891;</span>
                    <select id="roleSelect">
                        <option value="teacher">教师</option>
                        <option value="student">学生</option>
                        <option value="admin">管理员</option>
                    </select>
                    <span class="select-arrow">&#9662;</span>
                </div>
            </div>

            <div class="remember-row">
                <label>
                    <input type="checkbox" id="rememberMe">
                    <span>记住我</span>
                </label>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
        </form>

        <!-- 测试账户提示 -->
        <div class="test-info">
            <div class="test-info-title">测试账户（点击自动填充）</div>
            <div class="test-info-row" onclick="fillAccount('admin','admin123','admin')">
                <span>admin / admin123</span>
                <span class="role-tag admin">管理员</span>
            </div>
            <div class="test-info-row" onclick="fillAccount('teacher','teacher123','teacher')">
                <span>teacher / teacher123</span>
                <span class="role-tag teacher">教师</span>
            </div>
            <div class="test-info-row" onclick="fillAccount('student01','student123','student')">
                <span>student01 / student123</span>
                <span class="role-tag student">学生</span>
            </div>
        </div>

        <!-- 底部信息 -->
        <div class="footer-info">
            仅限授权人员登录 | v1.0.0
        </div>
    </div>

    <script>
        // ========== 预设账户数据（模拟数据库） ==========
        const users = [
            { username: 'admin', password: 'admin123', role: 'admin', name: '系统管理员' },
            { username: 'teacher', password: 'teacher123', role: 'teacher', name: '王老师' },
            { username: 'teacher2', password: 'teacher123', role: 'teacher', name: '李老师' },
            { username: 'student01', password: 'student123', role: 'student', name: '张三' },
            { username: 'student02', password: 'student123', role: 'student', name: '李四' },
            { username: 'student03', password: 'student123', role: 'student', name: '王五' }
        ];

        // ========== DOM元素 ==========
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const roleSelect = document.getElementById('roleSelect');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const errorMsg = document.getElementById('errorMsg');
        const loginCard = document.getElementById('loginCard');
        const loginForm = document.getElementById('loginForm');
        const togglePwdBtn = document.getElementById('togglePwd');

        // ========== 密码显示/隐藏切换 ==========
        togglePwdBtn.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            document.getElementById('eyeIcon').innerHTML = type === 'password' ? '&#128065;' : '&#128064;';
        });

        // ========== 自动填充测试账户 ==========
        function fillAccount(username, password, role) {
            usernameInput.value = username;
            passwordInput.value = password;
            roleSelect.value = role;
            clearError();
        }

        // ========== 错误提示 ==========
        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
            // 3秒后自动隐藏
            setTimeout(function() {
                errorMsg.classList.remove('show');
            }, 3000);
        }

        function clearError() {
            errorMsg.classList.remove('show');
        }

        // ========== 获取URL中的redirect参数 ==========
        function getRedirectParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get('redirect');
        }

        // ========== 登录逻辑 ==========
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            doLogin();
        });

        // 回车登录
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        function doLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const selectedRole = roleSelect.value;

            clearError();

            // 验证输入
            if (!username) {
                showError('请输入用户名');
                usernameInput.focus();
                return;
            }
            if (!password) {
                showError('请输入密码');
                passwordInput.focus();
                return;
            }

            // 查找匹配用户（用户名 + 密码 + 角色）
            const user = users.find(function(u) {
                return u.username === username && u.password === password && u.role === selectedRole;
            });

            if (!user) {
                // 检查是否用户名密码正确但角色不对
                const userExists = users.find(function(u) {
                    return u.username === username && u.password === password;
                });
                if (userExists) {
                    showError('用户名和密码正确，但角色不匹配。请选择正确的角色：' +
                        (userExists.role === 'admin' ? '管理员' : userExists.role === 'teacher' ? '教师' : '学生'));
                } else {
                    showError('用户名或密码错误，请重试');
                }
                return;
            }

            // 登录成功 - 保存用户信息到 localStorage
            localStorage.setItem('username', user.username);
            localStorage.setItem('userName', user.name);
            localStorage.setItem('userRole', user.role);
            localStorage.setItem('userAvatar', '');

            // 记住我
            if (rememberMeCheckbox.checked) {
                localStorage.setItem('rememberMe', 'true');
                localStorage.setItem('rememberedUsername', user.username);
                localStorage.setItem('rememberedRole', user.role);
            } else {
                localStorage.removeItem('rememberMe');
                localStorage.removeItem('rememberedUsername');
                localStorage.removeItem('rememberedRole');
            }

            // 成功动画
            loginCard.classList.add('success');

            // 跳转
            setTimeout(function() {
                const redirect = getRedirectParam() || 'index.html';
                window.location.href = redirect;
            }, 500);
        }

        // ========== 记住我 - 自动填充 ==========
        (function initRememberMe() {
            const remembered = localStorage.getItem('rememberMe');
            if (remembered === 'true') {
                const savedUsername = localStorage.getItem('rememberedUsername');
                const savedRole = localStorage.getItem('rememberedRole');
                if (savedUsername) {
                    usernameInput.value = savedUsername;
                    rememberMeCheckbox.checked = true;
                }
                if (savedRole) {
                    roleSelect.value = savedRole;
                }
            }
        })();

        // ========== 粒子背景动画（Canvas） ==========
        (function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const PARTICLE_COUNT = 50;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // 初始化粒子
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 0.5,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 绘制粒子
                particles.forEach(function(p) {
                    p.x += p.vx;
                    p.y += p.vy;

                    // 边界回弹
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(14, 165, 233, ' + p.opacity + ')';
                    ctx.fill();
                });

                // 绘制连线（距离近的粒子之间）
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            const lineOpacity = (1 - dist / 150) * 0.15;
                            ctx.strokeStyle = 'rgba(14, 165, 233, ' + lineOpacity + ')';
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
