<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智能考核 - 虚实一体仿真系统</title>
  <script src="auth-guard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --secondary: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f97316;
      --bg-dark: #0a0f1a;
      --bg-panel: #111827;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --gradient-1: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      --gradient-2: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      --gradient-3: linear-gradient(135deg, #22c55e 0%, #0ea5e9 100%);
      --shadow-glow: 0 0 20px rgba(14, 165, 233, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: rgba(10, 15, 26, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 60px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--gradient-1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .logo-text h1 {
      font-size: 1.25rem; font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-text p { font-size: 0.7rem; color: var(--text-secondary); }
    .top-nav { display:flex; gap:0.5rem; }
    .top-nav-item { padding:0.5rem 1rem; color:var(--text-secondary); text-decoration:none; border-radius:6px; font-size:0.85rem; transition:all 0.2s; }
    .top-nav-item:hover { background:var(--bg-hover); color:var(--text-primary); }
    .top-nav-item.active { background:rgba(14,165,233,0.15); color:var(--primary); }
    .back-btn { padding:0.5rem 1rem; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-family:inherit; font-size:0.8rem; cursor:pointer; transition:all 0.2s; }
    .back-btn:hover { background:var(--primary); border-color:var(--primary); }
    .page-container { max-width:1200px; margin:0 auto; padding:1.5rem; }
    .page-title { font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem; }
    .panel-section {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel-section h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
    @media (max-width:900px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
    input, select, textarea {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--bg-hover); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--border); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-group { display:flex; gap:0.5rem; flex-wrap:wrap; }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="location.href='simulation.html'">
      <div class="logo-icon">🤖</div>
      <div class="logo-text"><h1>虚实一体仿真系统</h1><p>职业院校工业机器人及自动化流水线实训平台</p></div>
    </div>
    <nav class="top-nav">
      <a href="tasks.html" class="top-nav-item">📋 任务</a>
      <a href="assessment.html" class="top-nav-item active">📊 考核</a>
      <a href="users.html" class="top-nav-item">👥 用户</a>
      <a href="resources.html" class="top-nav-item">📚 资源</a>
      <a href="data.html" class="top-nav-item">📈 数据</a>
      <a href="qa.html" class="top-nav-item">💬 答疑</a>
      <a href="logs.html" class="top-nav-item">📝 日志</a>
    </nav>
    <button class="back-btn" onclick="location.href='simulation.html'">⬅ 返回仿真区</button>
  </header>

  <div class="page-container">
    <div class="page-title">📊 智能考核</div>

    <div class="grid-2">
      <div class="panel-section">
        <h3>⚙️ 评分模板配置</h3>
        <div style="margin-bottom:0.75rem;">
          <label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:0.3rem;">选择评分模板</label>
          <select id="scoring-template-select" onchange="loadScoringTemplate()">
            <option value="default">默认五维评分模板</option>
            <option value="welding">焊接专项评分模板</option>
            <option value="spraying">喷涂专项评分模板</option>
            <option value="grinding">打磨专项评分模板</option>
          </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem;" id="template-config-list">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>编程规范性</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span style="font-size:0.7rem;color:var(--text-secondary);">权重</span>
              <input type="number" id="weight-code-style" value="20" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
              <span style="font-size:0.7rem;color:var(--text-secondary);">满分</span>
              <input type="number" id="max-code-style" value="100" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>轨迹精度</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span style="font-size:0.7rem;color:var(--text-secondary);">权重</span>
              <input type="number" id="weight-trajectory" value="25" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
              <span style="font-size:0.7rem;color:var(--text-secondary);">满分</span>
              <input type="number" id="max-trajectory" value="100" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>工艺合理性</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span style="font-size:0.7rem;color:var(--text-secondary);">权重</span>
              <input type="number" id="weight-process" value="25" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
              <span style="font-size:0.7rem;color:var(--text-secondary);">满分</span>
              <input type="number" id="max-process" value="100" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>故障排查效率</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span style="font-size:0.7rem;color:var(--text-secondary);">权重</span>
              <input type="number" id="weight-troubleshoot" value="15" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
              <span style="font-size:0.7rem;color:var(--text-secondary);">满分</span>
              <input type="number" id="max-troubleshoot" value="100" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>操作规范度</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span style="font-size:0.7rem;color:var(--text-secondary);">权重</span>
              <input type="number" id="weight-safety" value="15" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
              <span style="font-size:0.7rem;color:var(--text-secondary);">满分</span>
              <input type="number" id="max-safety" value="100" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="0" max="100">
            </div>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="saveScoringTemplate()">💾 保存模板</button>
          <button class="btn btn-secondary" onclick="resetTemplateConfig()">🔄 重置</button>
        </div>
      </div>

      <div class="panel-section">
        <h3>📊 自动评分</h3>
        <div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>编程规范性</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <div style="width:80px;height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;">
                <div id="score-code-style" style="width:0%;height:100%;background:var(--primary);border-radius:3px;transition:width 0.5s;"></div>
              </div>
              <span style="font-family:'JetBrains Mono',monospace;color:var(--primary);font-weight:700;min-width:36px;text-align:right;" id="score-code-style-val">--</span>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>轨迹精度</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <div style="width:80px;height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;">
                <div id="score-trajectory" style="width:0%;height:100%;background:var(--success);border-radius:3px;transition:width 0.5s;"></div>
              </div>
              <span style="font-family:'JetBrains Mono',monospace;color:var(--success);font-weight:700;min-width:36px;text-align:right;" id="score-trajectory-val">--</span>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>工艺合理性</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <div style="width:80px;height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;">
                <div id="score-process" style="width:0%;height:100%;background:var(--secondary);border-radius:3px;transition:width 0.5s;"></div>
              </div>
              <span style="font-family:'JetBrains Mono',monospace;color:var(--secondary);font-weight:700;min-width:36px;text-align:right;" id="score-process-val">--</span>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>故障排查效率</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <div style="width:80px;height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;">
                <div id="score-troubleshoot" style="width:0%;height:100%;background:var(--warning);border-radius:3px;transition:width 0.5s;"></div>
              </div>
              <span style="font-family:'JetBrains Mono',monospace;color:var(--warning);font-weight:700;min-width:36px;text-align:right;" id="score-troubleshoot-val">--</span>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
            <span>操作规范度</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <div style="width:80px;height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;">
                <div id="score-safety" style="width:0%;height:100%;background:var(--danger);border-radius:3px;transition:width 0.5s;"></div>
              </div>
              <span style="font-family:'JetBrains Mono',monospace;color:var(--danger);font-weight:700;min-width:36px;text-align:right;" id="score-safety-val">--</span>
            </div>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="runAutoScoring()">▶️ 自动评分</button>
          <button class="btn btn-secondary" onclick="resetScoring()">🔄 重置</button>
        </div>
      </div>

      <div class="panel-section">
        <h3>✏️ 人工复核</h3>
        <div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem;" id="manual-review-list">
          <!-- 复核列表由JS动态生成 -->
        </div>
        <div class="btn-group">
          <button class="btn btn-success" onclick="submitManualReview()">✅ 提交复核</button>
        </div>
      </div>

      <div class="panel-section">
        <h3>📄 成绩报告</h3>
        <div style="background:var(--bg-dark);border-radius:8px;padding:0.75rem;margin-bottom:0.75rem;">
          <div style="text-align:center;margin-bottom:0.5rem;">
            <div style="font-size:2rem;font-weight:900;color:var(--primary);" id="report-total-score">--</div>
            <div style="font-size:0.8rem;color:var(--text-secondary);">综合得分</div>
          </div>
          <canvas id="radar-chart" width="300" height="180" style="width:100%;height:140px;"></canvas>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="generateReport()">📄 生成报告</button>
          <button class="btn btn-secondary" onclick="exportReport()">📥 导出</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 非管理员隐藏用户管理链接
    const role = localStorage.getItem('userRole');
    if (role !== 'admin') {
        const userLink = document.querySelector('a[href="users.html"]');
        if (userLink) userLink.style.display = 'none';
    }

    // ---------- 智能考核模块 ----------
    let autoScores = { codeStyle: 0, trajectory: 0, process: 0, troubleshoot: 0, safety: 0 };
    let manualAdjustments = {};

    const scoringTemplates = {
      default: { codeStyle: 20, trajectory: 25, process: 25, troubleshoot: 15, safety: 15 },
      welding: { codeStyle: 15, trajectory: 20, process: 35, troubleshoot: 15, safety: 15 },
      spraying: { codeStyle: 15, trajectory: 30, process: 30, troubleshoot: 10, safety: 15 },
      grinding: { codeStyle: 15, trajectory: 25, process: 30, troubleshoot: 15, safety: 15 }
    };

    window.loadScoringTemplate = function() {
      const key = document.getElementById('scoring-template-select')?.value || 'default';
      const t = scoringTemplates[key] || scoringTemplates.default;
      document.getElementById('weight-code-style').value = t.codeStyle;
      document.getElementById('weight-trajectory').value = t.trajectory;
      document.getElementById('weight-process').value = t.process;
      document.getElementById('weight-troubleshoot').value = t.troubleshoot;
      document.getElementById('weight-safety').value = t.safety;
      alert(`加载评分模板: ${key}`);
    };

    window.saveScoringTemplate = function() {
      const name = prompt('请输入模板名称:');
      if (!name) return;
      alert(`保存评分模板: ${name}`);
    };

    window.resetTemplateConfig = function() {
      loadScoringTemplate();
      alert('评分模板配置已重置');
    };

    window.runAutoScoring = function() {
      autoScores.codeStyle = Math.floor(75 + Math.random() * 20);
      autoScores.trajectory = Math.floor(70 + Math.random() * 25);
      autoScores.process = Math.floor(65 + Math.random() * 30);
      autoScores.troubleshoot = Math.floor(60 + Math.random() * 35);
      autoScores.safety = Math.floor(80 + Math.random() * 18);

      document.getElementById('score-code-style').style.width = autoScores.codeStyle + '%';
      document.getElementById('score-code-style-val').textContent = autoScores.codeStyle;
      document.getElementById('score-trajectory').style.width = autoScores.trajectory + '%';
      document.getElementById('score-trajectory-val').textContent = autoScores.trajectory;
      document.getElementById('score-process').style.width = autoScores.process + '%';
      document.getElementById('score-process-val').textContent = autoScores.process;
      document.getElementById('score-troubleshoot').style.width = autoScores.troubleshoot + '%';
      document.getElementById('score-troubleshoot-val').textContent = autoScores.troubleshoot;
      document.getElementById('score-safety').style.width = autoScores.safety + '%';
      document.getElementById('score-safety-val').textContent = autoScores.safety;

      renderManualReviewList();
      alert('自动评分完成');
    };

    window.resetScoring = function() {
      autoScores = { codeStyle: 0, trajectory: 0, process: 0, troubleshoot: 0, safety: 0 };
      manualAdjustments = {};
      ['code-style', 'trajectory', 'process', 'troubleshoot', 'safety'].forEach(id => {
        document.getElementById('score-' + id).style.width = '0%';
        document.getElementById('score-' + id + '-val').textContent = '--';
      });
      document.getElementById('report-total-score').textContent = '--';
      document.getElementById('manual-review-list').innerHTML = '';
      const canvas = document.getElementById('radar-chart');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      alert('评分已重置');
    };

    function renderManualReviewList() {
      const list = document.getElementById('manual-review-list');
      if (!list) return;
      const items = [
        { key: 'codeStyle', label: '编程规范性', score: autoScores.codeStyle },
        { key: 'trajectory', label: '轨迹精度', score: autoScores.trajectory },
        { key: 'process', label: '工艺合理性', score: autoScores.process },
        { key: 'troubleshoot', label: '故障排查效率', score: autoScores.troubleshoot },
        { key: 'safety', label: '操作规范度', score: autoScores.safety }
      ];
      list.innerHTML = items.map(item => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem;background:var(--bg-dark);border-radius:6px;font-size:0.8rem;">
          <span>${item.label}</span>
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <span style="font-family:'JetBrains Mono',monospace;color:var(--primary);font-weight:700;">${item.score}</span>
            <input type="number" id="adjust-${item.key}" value="0" style="width:50px;text-align:center;padding:0.2rem;font-size:0.75rem;" min="-20" max="20">
          </div>
        </div>
      `).join('');
    }

    window.submitManualReview = function() {
      const keys = ['codeStyle', 'trajectory', 'process', 'troubleshoot', 'safety'];
      keys.forEach(key => {
        const input = document.getElementById('adjust-' + key);
        manualAdjustments[key] = parseInt(input?.value || 0);
      });
      alert('人工复核已提交');
      generateReport();
    };

    window.generateReport = function() {
      const keys = ['codeStyle', 'trajectory', 'process', 'troubleshoot', 'safety'];
      let total = 0;
      keys.forEach(key => {
        const adjusted = Math.min(100, Math.max(0, autoScores[key] + (manualAdjustments[key] || 0)));
        total += adjusted;
      });
      const avg = Math.floor(total / keys.length);
      document.getElementById('report-total-score').textContent = avg;
      drawRadarChart('radar-chart', [
        Math.min(100, Math.max(0, autoScores.codeStyle + (manualAdjustments.codeStyle || 0))),
        Math.min(100, Math.max(0, autoScores.trajectory + (manualAdjustments.trajectory || 0))),
        Math.min(100, Math.max(0, autoScores.process + (manualAdjustments.process || 0))),
        Math.min(100, Math.max(0, autoScores.troubleshoot + (manualAdjustments.troubleshoot || 0))),
        Math.min(100, Math.max(0, autoScores.safety + (manualAdjustments.safety || 0)))
      ]);
      alert(`成绩报告生成: 综合得分 ${avg}`);
    };

    window.exportReport = function() {
      alert('成绩报告已导出');
    };

    function drawRadarChart(canvasId, values) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const labels = ['编程', '轨迹', '工艺', '排故', '规范'];
      const centerX = w / 2, centerY = h / 2 + 10;
      const radius = Math.min(w, h) / 2 - 30;
      const count = labels.length;

      // 绘制网格
      for (let level = 1; level <= 4; level++) {
        ctx.beginPath();
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 / count) * i - Math.PI / 2;
          const r = radius * level / 4;
          const x = centerX + Math.cos(angle) * r;
          const y = centerY + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.5)';
        ctx.stroke();
      }

      // 绘制轴线
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * radius, centerY + Math.sin(angle) * radius);
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.5)';
        ctx.stroke();
        // 标签
        const labelX = centerX + Math.cos(angle) * (radius + 15);
        const labelY = centerY + Math.sin(angle) * (radius + 15);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(labels[i], labelX, labelY);
      }

      // 绘制数据
      ctx.beginPath();
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i - Math.PI / 2;
        const r = radius * (values[i] || 0) / 100;
        const x = centerX + Math.cos(angle) * r;
        const y = centerY + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(14, 165, 233, 0.3)';
      ctx.fill();
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  </script>
