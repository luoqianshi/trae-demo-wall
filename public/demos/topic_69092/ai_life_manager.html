<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 生活管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .gradient-bg {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.85) 0%, rgba(192, 132, 252, 0.8) 50%, rgba(168, 85, 247, 0.85) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .mic-btn {
            transition: all 0.3s ease;
        }
        .mic-btn.recording {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 107, 107, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }
        .card-enter {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }
        .category-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="gradient-bg text-white px-4 py-4 shadow-lg">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold">爱家-AI生活管家</h1>
                <p class="text-xs opacity-80">我的家我说了算！</p>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs bg-white/20 px-2 py-1 rounded-full">今日提醒 <span id="todayReminderCount" class="font-bold">0</span></span>
            </div>
        </div>
    </header>

    <main class="flex-1 px-4 py-4 overflow-hidden flex flex-col">
        <div class="glass-card rounded-2xl p-4 mb-4 shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="flex-1">
                    <input type="text" id="inputText" 
                        class="w-full px-4 py-3 rounded-xl bg-gray-100 border-none focus:ring-2 focus:ring-purple-500 outline-none text-gray-800 placeholder-gray-400"
                        placeholder="说一句话或输入... 例如：牛奶明天到期、记得买鸡蛋、周五全家聚餐">
                </div>
                <button id="micBtn" class="mic-btn w-12 h-12 rounded-xl bg-purple-600 text-white flex items-center justify-center shadow-lg">
                    <i class="fa fa-microphone text-xl"></i>
                </button>
                <button id="submitBtn" class="w-12 h-12 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-500 text-white flex items-center justify-center shadow-lg">
                    <i class="fa fa-send text-xl"></i>
                </button>
            </div>
            <p id="statusText" class="text-xs text-gray-400 mt-2 text-center"></p>
        </div>

        <div class="flex border-b border-gray-200 mb-4">
            <button class="tab-btn flex-1 py-3 text-sm font-medium text-gray-500 tab-active" data-tab="all">全部</button>
            <button class="tab-btn flex-1 py-3 text-sm font-medium text-gray-500" data-tab="inventory">库存</button>
            <button class="tab-btn flex-1 py-3 text-sm font-medium text-gray-500" data-tab="reminder">提醒</button>
            <button class="tab-btn flex-1 py-3 text-sm font-medium text-gray-500" data-tab="schedule">日程</button>
        </div>

        <div id="contentArea" class="flex-1 overflow-y-auto scrollbar-hide space-y-3 pb-20">
            <div id="emptyState" class="flex flex-col items-center justify-center h-64 text-gray-400">
                <i class="fa fa-home text-6xl mb-4 opacity-50"></i>
                <p>还没有记录</p>
                <p class="text-sm mt-1">试着说一句话开始管理吧</p>
            </div>
            <div id="recordList" class="hidden space-y-3"></div>
        </div>
    </main>

    <div id="detailModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden px-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 card-enter">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-800">编辑记录</h3>
                <button id="closeModal" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div id="modalContent" class="space-y-4 max-h-[60vh] overflow-y-auto scrollbar-hide">
            </div>
            <div class="flex space-x-3 mt-6">
                <button id="deleteRecord" class="flex-1 py-2 rounded-xl bg-red-50 text-red-500 font-medium">删除</button>
                <button id="updateRecord" class="flex-1 py-2 rounded-xl bg-purple-600 text-white font-medium">保存</button>
            </div>
        </div>
    </div>

    <script>
        const records = [
            { id: 1, text: '牛奶明天到期', type: 'reminder', category: '食品', date: '2026-07-04', priority: 'high', status: 'pending', createdAt: '2026-07-03 09:30' },
            { id: 2, text: '记得买鸡蛋两盒', type: 'inventory', category: '食品', quantity: 2, unit: '盒', status: 'pending', createdAt: '2026-07-03 10:15' },
            { id: 3, text: '周五全家聚餐', type: 'schedule', category: '家庭', date: '2026-07-07', time: '18:00', participants: '全家', status: 'pending', createdAt: '2026-07-03 11:00' },
            { id: 4, text: '洗发水还有半瓶', type: 'inventory', category: '日用品', quantity: 0.5, unit: '瓶', status: 'ok', createdAt: '2026-07-03 14:20' },
            { id: 5, text: '疫苗接种预约在下周二', type: 'reminder', category: '健康', date: '2026-07-08', priority: 'high', status: 'pending', createdAt: '2026-07-03 15:45' },
            { id: 6, text: '周六下午带孩子去公园', type: 'schedule', category: '亲子', date: '2026-07-08', time: '14:00', participants: '我和孩子', status: 'pending', createdAt: '2026-07-03 16:00' },
            { id: 7, text: '下周二前约家政保洁', type: 'reminder', category: '家庭', date: '2026-07-08', priority: 'high', status: 'pending', createdAt: '2026-07-03 17:10' },
            { id: 8, text: '某条裤子7日内退货', type: 'reminder', category: '其他', date: '2026-07-10', priority: 'high', status: 'pending', createdAt: '2026-07-03 17:15' },
        ];

        const categoryColors = {
            '食品': 'bg-orange-100 text-orange-600',
            '日用品': 'bg-blue-100 text-blue-600',
            '健康': 'bg-green-100 text-green-600',
            '家庭': 'bg-purple-100 text-purple-600',
            '亲子': 'bg-pink-100 text-pink-600',
            '工作': 'bg-gray-100 text-gray-600',
            '其他': 'bg-gray-100 text-gray-600',
        };

        const typeLabels = {
            'inventory': '库存',
            'reminder': '提醒',
            'schedule': '日程',
        };

        const typeIcons = {
            'inventory': 'fa-shopping-bag',
            'reminder': 'fa-bell',
            'schedule': 'fa-calendar',
        };

        let currentTab = 'all';
        let currentRecordId = null;
        let recognition = null;

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = false;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    document.getElementById('micBtn').classList.add('recording');
                    document.getElementById('statusText').textContent = '正在听...';
                };

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    document.getElementById('inputText').value = transcript;
                };

                recognition.onend = () => {
                    document.getElementById('micBtn').classList.remove('recording');
                    document.getElementById('statusText').textContent = '';
                };

                recognition.onerror = (event) => {
                    document.getElementById('micBtn').classList.remove('recording');
                    document.getElementById('statusText').textContent = '语音识别失败，请重试';
                    console.error(event.error);
                };
            } else {
                document.getElementById('micBtn').style.display = 'none';
            }
        }

        function aiClassify(text) {
            const result = {
                type: 'other',
                category: '其他',
                date: null,
                time: null,
                quantity: null,
                unit: '',
                priority: 'normal',
            };

            const lowerText = text.toLowerCase();
            
            if (lowerText.includes('到期') || lowerText.includes('过期') || lowerText.includes('快用完') || lowerText.includes('用完')) {
                result.type = 'reminder';
                result.priority = 'high';
            } else if (lowerText.includes('买') || lowerText.includes('购') || lowerText.includes('需要') || lowerText.includes('库存') || lowerText.includes('还有')) {
                result.type = 'inventory';
            } else if (lowerText.includes('聚餐') || lowerText.includes('会议') || lowerText.includes('预约') || lowerText.includes('安排') || lowerText.includes('计划') || lowerText.includes('去')) {
                result.type = 'schedule';
            }

            const datePatterns = [
                { regex: /明天/g, replace: getDateString(1) },
                { regex: /后天/g, replace: getDateString(2) },
                { regex: /大后天/g, replace: getDateString(3) },
                { regex: /昨天/g, replace: getDateString(-1) },
                { regex: /前天/g, replace: getDateString(-2) },
                { regex: /今天/g, replace: getDateString(0) },
                { regex: /周一/g, replace: getWeekdayDate('1') },
                { regex: /周二/g, replace: getWeekdayDate('2') },
                { regex: /周三/g, replace: getWeekdayDate('3') },
                { regex: /周四/g, replace: getWeekdayDate('4') },
                { regex: /周五/g, replace: getWeekdayDate('5') },
                { regex: /周六/g, replace: getWeekdayDate('6') },
                { regex: /周日/g, replace: getWeekdayDate('0') },
                { regex: /(\d+)月(\d+)日/g, replace: (_, m, d) => `2026-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}` },
                { regex: /(\d+)\/(\d+)/g, replace: (_, m, d) => `2026-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}` },
            ];

            for (const { regex, replace } of datePatterns) {
                if (regex.test(lowerText)) {
                    if (typeof replace === 'function') {
                        result.date = replace();
                    } else {
                        result.date = replace;
                    }
                    break;
                }
            }

            const timeMatch = lowerText.match(/(\d+):(\d+)|(\d+)点(\d+)?分?/);
            if (timeMatch) {
                const hour = timeMatch[1] || timeMatch[3];
                const minute = timeMatch[2] || timeMatch[4] || '00';
                result.time = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
            }

            const quantityMatch = text.match(/(\d+(?:\.\d+)?)[\s]*(盒|瓶|斤|个|袋|包|箱|升|公斤|kg|l)/);
            if (quantityMatch) {
                result.quantity = parseFloat(quantityMatch[1]);
                result.unit = quantityMatch[2];
            }

            if (text.includes('牛奶') || text.includes('鸡蛋') || text.includes('面包') || text.includes('水果') || text.includes('菜') || text.includes('肉')) {
                result.category = '食品';
            } else if (text.includes('洗发水') || text.includes('牙膏') || text.includes('纸巾') || text.includes('洗衣液') || text.includes('毛巾')) {
                result.category = '日用品';
            } else if (text.includes('疫苗') || text.includes('体检') || text.includes('药') || text.includes('医院')) {
                result.category = '健康';
            } else if (text.includes('全家') || text.includes('聚餐') || text.includes('聚会')) {
                result.category = '家庭';
            } else if (text.includes('孩子') || text.includes('学校') || text.includes('作业')) {
                result.category = '亲子';
            } else if (text.includes('会议') || text.includes('工作') || text.includes('项目')) {
                result.category = '工作';
            }

            return result;
        }

        function getDateString(daysOffset) {
            const date = new Date();
            date.setDate(date.getDate() + daysOffset);
            return date.toISOString().split('T')[0];
        }

        function getWeekdayDate(targetDay) {
            const today = new Date();
            const currentDay = today.getDay().toString();
            let daysToAdd = parseInt(targetDay) - parseInt(currentDay);
            if (daysToAdd <= 0) daysToAdd += 7;
            return getDateString(daysToAdd);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const targetDate = new Date(dateStr);
            targetDate.setHours(0, 0, 0, 0);
            
            const diffDays = Math.floor((targetDate - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return '今天';
            if (diffDays === 1) return '明天';
            if (diffDays === 2) return '后天';
            if (diffDays === -1) return '昨天';
            
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return `${weekdays[date.getDay()]} ${date.getMonth() + 1}/${date.getDate()}`;
        }

        function renderRecords() {
            const filteredRecords = currentTab === 'all' 
                ? records 
                : records.filter(r => r.type === currentTab);
            
            const container = document.getElementById('recordList');
            const emptyState = document.getElementById('emptyState');
            
            if (filteredRecords.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            container.innerHTML = filteredRecords.map(record => `
                <div class="${record.priority === 'high' ? 'bg-pink-50 border border-pink-200' : 'glass-card'} rounded-xl p-4 shadow-sm card-enter cursor-pointer hover:shadow-md transition-shadow" onclick="openDetail(${record.id})">
                    <div class="flex items-start justify-between mb-2">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-lg ${record.priority === 'high' ? 'bg-pink-200 text-pink-700' : 'bg-purple-100 text-purple-600'} flex items-center justify-center">
                                <i class="fa ${typeIcons[record.type] || 'fa-circle'}"></i>
                            </div>
                            <span class="text-xs font-medium ${record.priority === 'high' ? 'text-pink-600' : 'text-gray-500'}">${typeLabels[record.type] || '其他'}</span>
                        </div>
                        <span class="category-badge ${categoryColors[record.category] || categoryColors['其他']}">
                            ${record.category}
                        </span>
                    </div>
                    <p class="${record.priority === 'high' ? 'text-pink-900' : 'text-gray-800'} font-medium mb-2">${record.text}</p>
                    <div class="flex items-center justify-between text-xs ${record.priority === 'high' ? 'text-pink-400' : 'text-gray-400'}">
                        <div class="flex items-center space-x-3">
                            ${record.date ? `<span class="flex items-center"><i class="fa fa-calendar mr-1"></i>${formatDate(record.date)}</span>` : ''}
                            ${record.time ? `<span class="flex items-center"><i class="fa fa-clock-o mr-1"></i>${record.time}</span>` : ''}
                            ${record.quantity ? `<span class="flex items-center"><i class="fa fa-tags mr-1"></i>${record.quantity}${record.unit}</span>` : ''}
                        </div>
                        <span>${record.createdAt.split(' ')[1]}</span>
                    </div>
                </div>
            `).join('');
        }

        function openDetail(id) {
            currentRecordId = id;
            const record = records.find(r => r.id === id);
            if (!record) return;

            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div>
                    <label class="text-xs text-gray-500 mb-1 block">内容</label>
                    <input type="text" id="editText" value="${record.text}" class="w-full px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-gray-800 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">类型</label>
                        <select id="editType" class="w-full px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-gray-800 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                            <option value="reminder" ${record.type === 'reminder' ? 'selected' : ''}>提醒</option>
                            <option value="inventory" ${record.type === 'inventory' ? 'selected' : ''}>库存</option>
                            <option value="schedule" ${record.type === 'schedule' ? 'selected' : ''}>日程</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">类别</label>
                        <select id="editCategory" class="w-full px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-gray-800 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                            <option value="食品" ${record.category === '食品' ? 'selected' : ''}>食品</option>
                            <option value="日用品" ${record.category === '日用品' ? 'selected' : ''}>日用品</option>
                            <option value="健康" ${record.category === '健康' ? 'selected' : ''}>健康</option>
                            <option value="家庭" ${record.category === '家庭' ? 'selected' : ''}>家庭</option>
                            <option value="亲子" ${record.category === '亲子' ? 'selected' : ''}>亲子</option>
                            <option value="工作" ${record.category === '工作' ? 'selected' : ''}>工作</option>
                            <option value="其他" ${record.category === '其他' ? 'selected' : ''}>其他</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">日期</label>
                        <input type="date" id="editDate" value="${record.date || ''}" class="w-full px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-gray-800 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">时间</label>
                        <input type="time" id="editTime" value="${record.time || ''}" class="w-full px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-gray-800 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">数量</label>
                        <input type="number" id="editQuantity" value="${record.quantity !== null && record.quantity !== undefined ? record.quantity : ''}" step="0.1" class="w-full px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-gray-800 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">单位</label>
                        <input type="text" id="editUnit" value="${record.unit || ''}" class="w-full px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-gray-800 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-500 mb-1 block">优先级</label>
                    <select id="editPriority" class="w-full px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-gray-800 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                        <option value="normal" ${record.priority !== 'high' ? 'selected' : ''}>普通</option>
                        <option value="high" ${record.priority === 'high' ? 'selected' : ''}>高优先级</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-500">创建时间</label>
                    <p class="text-gray-400 text-xs">${record.createdAt}</p>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            currentRecordId = null;
        }

        function deleteRecord() {
            if (!currentRecordId) return;
            const index = records.findIndex(r => r.id === currentRecordId);
            if (index > -1) {
                records.splice(index, 1);
                renderRecords();
                updateReminderCount();
            }
            closeModal();
        }

        function updateRecord() {
            if (!currentRecordId) return;
            const record = records.find(r => r.id === currentRecordId);
            if (record) {
                const text = document.getElementById('editText').value.trim();
                const type = document.getElementById('editType').value;
                const category = document.getElementById('editCategory').value;
                const date = document.getElementById('editDate').value;
                const time = document.getElementById('editTime').value;
                const quantity = document.getElementById('editQuantity').value;
                const unit = document.getElementById('editUnit').value;
                const priority = document.getElementById('editPriority').value;

                if (text) record.text = text;
                record.type = type;
                record.category = category;
                record.date = date || null;
                record.time = time || null;
                record.quantity = quantity ? parseFloat(quantity) : null;
                record.unit = unit || '';
                record.priority = priority;

                renderRecords();
                updateReminderCount();
            }
            closeModal();
        }

        function updateReminderCount() {
            const today = new Date().toISOString().split('T')[0];
            const count = records.filter(r => r.type === 'reminder' && r.date === today && r.status === 'pending').length;
            document.getElementById('todayReminderCount').textContent = count;
        }

        function handleSubmit() {
            const input = document.getElementById('inputText');
            const text = input.value.trim();
            if (!text) return;

            const classification = aiClassify(text);
            const now = new Date();
            const record = {
                id: Date.now(),
                text: text,
                type: classification.type,
                category: classification.category,
                date: classification.date,
                time: classification.time,
                quantity: classification.quantity,
                unit: classification.unit,
                priority: classification.priority,
                status: 'pending',
                createdAt: `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
            };

            records.unshift(record);
            input.value = '';
            renderRecords();
            updateReminderCount();
            
            document.getElementById('statusText').textContent = `已分类为：${typeLabels[record.type]} · ${record.category}`;
            setTimeout(() => {
                document.getElementById('statusText').textContent = '';
            }, 2000);
        }

        document.getElementById('micBtn').addEventListener('click', () => {
            if (recognition) {
                recognition.start();
            }
        });

        document.getElementById('submitBtn').addEventListener('click', handleSubmit);

        document.getElementById('inputText').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSubmit();
            }
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
                btn.classList.add('tab-active');
                currentTab = btn.dataset.tab;
                renderRecords();
            });
        });

        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('deleteRecord').addEventListener('click', deleteRecord);
        document.getElementById('updateRecord').addEventListener('click', updateRecord);

        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('detailModal')) {
                closeModal();
            }
        });

        initSpeechRecognition();
        renderRecords();
        updateReminderCount();
    </script>
</body>
</html>
