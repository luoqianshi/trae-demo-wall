/* ============================================================
   AI炼丹炉 — Brand Design System
   Retro-futuristic Alchemy · Immersive Dark Theme
   Tone: retro-futuristic / emotional wellness / cyberpunk guofeng
   ============================================================ */

:root {
  /* ── Surface Elevation (Material Dark compliant) ── */
  --color-background:        #0d0d14;
  --color-surface:           #14142a;
  --color-surface-raised:    #1c1c38;
  --color-surface-overlay:   #24243e;

  /* ── Primary Hue: Amber-Gold (Alchemy Fire) ── */
  --color-primary:           #d4a853;
  --color-primary-dim:       #8b7536;
  --color-primary-bright:    #ffd700;
  --color-primary-glow:      rgba(212, 168, 83, 0.12);

  /* ── Text ── */
  --color-text-primary:      #e8e6f0;
  --color-text-secondary:    #9896a8;
  --color-text-muted:        #5a586a;

  /* ── Borders ── */
  --color-border:            rgba(212, 168, 83, 0.1);
  --color-border-strong:     rgba(212, 168, 83, 0.22);

  /* ── Semantic State Colors ── */
  --state-success:           #4a9e8e;
  --state-warning:           #d4a853;
  --state-error:             #c41e3a;
  --state-info:              #00c9a7;

  /* ── Typography ── */
  --font-display:            'Noto Serif SC', 'STKaiti', 'KaiTi', serif;
  --font-body:               'Noto Sans SC', sans-serif;
  --font-mono:               'Source Code Pro', monospace;

  /* ── Spacing ── */
  --space-xs:   4px;
  --space-sm:   8px;
  --space-md:   16px;
  --space-lg:   24px;
  --space-xl:   40px;
  --space-2xl:  64px;
  --space-3xl:  100px;

  /* ── Radius ── */
  --radius-sm:  2px;
  --radius-md:  8px;
  --radius-lg:  12px;
  --radius-full: 9999px;

  /* ── Motion ── */
  --ease:  cubic-bezier(0.16, 1, 0.3, 1);
  --duration-fast:   150ms;
  --duration-normal: 300ms;
  --duration-slow:   600ms;
}

    <style>
/* ============================================================
   HERO PAGE — AI炼丹炉
   Multi-layer immersive dark ritual space
   ============================================================ */

/* ── Reset & Base ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: var(--color-background); color: var(--color-text-primary); }

/* ── Layer 1: Deep Background ── */
.hero-bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 45%, var(--color-surface) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 25% 25%, rgba(20, 20, 42, 0.8) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 75% 80%, rgba(20, 20, 42, 0.6) 0%, transparent 50%),
    var(--color-background);
}

/* ── Layer 2: Canvas ── */
#hero-canvas {
  position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%;
}

/* ── Layer 3: Glow Blobs ── */
.glow-blob {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 2;
  filter: blur(80px);
}
.glow-blob--amber {
  width: 400px; height: 400px; top: 5%; right: 10%;
  background: rgba(212, 168, 83, 0.08);
  animation: blob-drift-amber 30s ease-in-out infinite;
}
.glow-blob--purple {
  width: 350px; height: 350px; bottom: 10%; left: 5%;
  background: rgba(28, 28, 56, 0.25);
  animation: blob-drift-purple 35s ease-in-out infinite;
}
.glow-blob--teal {
  width: 300px; height: 300px; bottom: 25%; left: 45%;
  background: rgba(74, 158, 142, 0.05);
  animation: blob-drift-teal 25s ease-in-out infinite;
}

@keyframes blob-drift-amber {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-30px, 20px); }
  50% { transform: translate(-15px, 40px); }
  75% { transform: translate(20px, 10px); }
}
@keyframes blob-drift-purple {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(25px, -30px); }
  66% { transform: translate(-20px, -15px); }
}
@keyframes blob-drift-teal {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(20px, -20px); }
  50% { transform: translate(-10px, -35px); }
  75% { transform: translate(-25px, 15px); }
}

/* ── Layer 4: SVG Noise Texture ── */
.noise-overlay {
  position: fixed; inset: 0; z-index: 3; pointer-events: none;
  opacity: 0.04;
}

/* ── Layer 5: Main Content ── */
.hero-content {
  position: fixed; inset: 0; z-index: 5;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}

/* ── Cauldron Container ── */
.cauldron-wrap {
  position: relative;
  width: clamp(200px, 22vw, 280px);
  height: clamp(240px, 26vw, 336px);
  animation: cauldron-breathe 5s ease-in-out infinite;
}
.cauldron-wrap svg {
  width: 100%; height: 100%;
  filter: drop-shadow(0 0 20px rgba(212, 168, 83, 0.2));
}

@keyframes cauldron-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

/* ── Trigram Ring ── */
.trigram-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 320px; height: 320px;
  transform: translate(-50%, -50%);
  animation: trigram-spin 60s linear infinite;
  pointer-events: none; z-index: 4;
}
.trigram-ring svg { width: 100%; height: 100%; }
.trigram-text {
  fill: var(--color-primary);
  font-family: var(--font-display);
  font-size: 16px;
  opacity: 0.6;
}
/* Faint golden glow trail via filter */
.trigram-ring svg {
  filter: drop-shadow(0 0 6px rgba(212, 168, 83, 0.15));
}

@keyframes trigram-spin {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* ── Title: 炼丹 ── */
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(5rem, 12vw, 8rem);
  font-weight: 900;
  letter-spacing: 0.15em;
  line-height: 1.1;
  text-align: center;
  color: var(--color-primary);
  position: relative;
  display: inline-block;
  margin-top: var(--space-lg);
  text-wrap: balance;
  word-break: keep-all;
}

/* Glitch pseudo-elements */
.hero-title::before,
.hero-title::after {
  content: attr(data-text);
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.hero-title::before {
  color: var(--color-primary-bright);
  animation: glitch-a 6s infinite;
  z-index: -1;
}
.hero-title::after {
  color: var(--state-error);
  animation: glitch-b 6s infinite;
  z-index: -1;
}

@keyframes glitch-a {
  0%, 88%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
  90% { clip-path: inset(15% 0 50% 0); transform: translate(-4px, 1px); }
  92% { clip-path: inset(55% 0 10% 0); transform: translate(3px, -1px); }
  94% { clip-path: inset(5% 0 75% 0); transform: translate(-2px, 2px); }
  96% { clip-path: inset(80% 0 3% 0); transform: translate(2px, -2px); }
  98% { clip-path: inset(40% 0 30% 0); transform: translate(-3px, 0); }
}
@keyframes glitch-b {
  0%, 89%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
  91% { clip-path: inset(45% 0 25% 0); transform: translate(4px, -1px); }
  93% { clip-path: inset(8% 0 65% 0); transform: translate(-3px, 1px); }
  95% { clip-path: inset(70% 0 8% 0); transform: translate(2px, 2px); }
  97% { clip-path: inset(3% 0 82% 0); transform: translate(-2px, -1px); }
}

/* ── Subtitle ── */
.hero-subtitle {
  font-family: var(--font-body);
  font-size: clamp(0.85rem, 1.8vw, 1.1rem);
  color: var(--color-text-secondary);
  letter-spacing: 0.3em;
  text-align: center;
  margin-top: var(--space-md);
}

/* ── CTA Button: 试炼炉 ── */
.btn-enter {
  margin-top: var(--space-2xl);
  padding: var(--space-md) 0;
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.8vw, 1.2rem);
  font-weight: 600;
  color: var(--color-primary);
  background: transparent;
  border: none;
  position: relative;
  cursor: pointer;
  letter-spacing: 0.3em;
  width: 220px;
  transition: color var(--duration-normal) var(--ease);
}
.btn-enter:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 12px;
}
/* Decorative lines */
.btn-enter::before,
.btn-enter::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--color-primary) 20%, var(--color-primary) 80%, transparent);
  opacity: 0.3;
  transition: opacity var(--duration-normal) var(--ease);
}
.btn-enter::before { top: 0; }
.btn-enter::after { bottom: 0; }

.btn-enter:hover {
  color: var(--color-text-primary);
  text-shadow: 0 0 12px rgba(212, 168, 83, 0.4);
}
.btn-enter:hover::before,
.btn-enter:hover::after {
  opacity: 0.7;
}
.btn-enter:active {
  transform: scale(0.98);
}

/* ── Layer 6: Mouse-following Light ── */
.mouse-light {
  position: fixed;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212, 168, 83, 0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 6;
  transform: translate(-50%, -50%);
  transition: left 0.15s ease-out, top 0.15s ease-out;
  will-change: left, top;
}

/* ── Circuit Line Drawing ── */
.circuit-line {
  stroke-dasharray: 300;
  stroke-dashoffset: 300;
  animation: circuit-draw 3s var(--ease) forwards;
}
@keyframes circuit-draw {
  to { stroke-dashoffset: 0; }
}

/* ── Reduced Motion ── */
@media (prefers-reduced-motion: reduce) {
  .cauldron-wrap { animation: none; }
  .trigram-ring { animation: none; }
  .hero-title::before, .hero-title::after { animation: none; }
  .glow-blob--amber, .glow-blob--purple, .glow-blob--teal { animation: none; }
  .circuit-line { animation: none; stroke-dashoffset: 0; }
}

/* ── Mobile Responsive ── */
@media (max-width: 768px) {
  .cauldron-wrap {
    width: clamp(160px, 40vw, 200px);
    height: clamp(192px, 48vw, 240px);
  }
  .trigram-ring {
    width: 240px; height: 240px;
  }
  .hero-subtitle {
    letter-spacing: 0.15em;
    padding: 0 var(--space-md);
  }
  .btn-enter { width: 180px; }
  .glow-blob { display: none; }
}

@media (max-width: 480px) {
  .hero-title {
    font-size: clamp(3rem, 10vw, 8rem);
  }
  .hero-subtitle {
    font-size: clamp(0.75rem, 4vw, 0.95rem);
  }
  .cauldron-wrap {
    width: clamp(120px, 55vw, 180px);
    height: clamp(144px, 66vw, 216px);
  }
  .trigram-ring {
    width: 180px; height: 180px;
  }
  .btn-enter {
    width: 160px;
    padding: var(--space-sm) 0;
    font-size: clamp(0.9rem, 3.5vw, 1rem);
  }
}

/* Touch device: hide mouse-following light */
@media (hover: none) and (pointer: coarse) {
  .mouse-light { display: none; }
}

/* General touch improvements */
.btn-enter,
.emotion-chip,
.cta-feed-btn,
.action-btn,
.ai-settings-gear,
.ai-settings-btn {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
    </style>

    <script>
(function() {
  'use strict';

  /* ── Canvas Setup ── */
  const canvas = document.getElementById('hero-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  let mouseX = -9999, mouseY = -9999;
  const MOUSE_RADIUS = 200;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  /* ── Mobile detection ── */
  var isMobile = window.innerWidth < 768;

  /* ── Particle Arrays (reduced on mobile) ── */
  var STAR_COUNT = isMobile ? 50 : 120;
  var EMBER_COUNT = isMobile ? 15 : 40;
  var DUST_COUNT = isMobile ? 5 : 15;

  // Stars
  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * 2000,
      y: Math.random() * 2000,
      r: Math.random() * 1.4 + 0.3,
      alpha: Math.random(),
      speed: Math.random() * 0.015 + 0.005,
      dir: Math.random() > 0.5 ? 1 : -1,
    });
  }

  // Fire embers
  const embers = [];
  function createEmber() {
    return {
      x: Math.random() * 2000,
      y: 2000 + Math.random() * 100,
      r: Math.random() * 2 + 0.8,
      vy: -(Math.random() * 0.6 + 0.2),
      vx: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.6 + 0.2,
      color: ['#d4a853', '#ffd700', '#ff6b35'][Math.floor(Math.random() * 3)],
      life: 1,
    };
  }
  for (let i = 0; i < EMBER_COUNT; i++) {
    const e = createEmber();
    e.y = Math.random() * 2000; // spread initially
    embers.push(e);
  }

  // Dust motes
  const dust = [];
  for (let i = 0; i < DUST_COUNT; i++) {
    dust.push({
      x: Math.random() * 2000,
      y: Math.random() * 2000,
      r: Math.random() * 3 + 2,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.1,
      alpha: Math.random() * 0.04 + 0.01,
    });
  }

  /* ── Animation Loop ── */
  function draw(t) {
    ctx.clearRect(0, 0, W, H);

    // Stars
    for (const s of stars) {
      s.alpha += s.speed * s.dir;
      if (s.alpha >= 1) { s.alpha = 1; s.dir = -1; }
      if (s.alpha <= 0.1) { s.alpha = 0.1; s.dir = 1; }

      // Mouse proximity subtle push
      const dx = s.x - mouseX;
      const dy = s.y - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      let sx = s.x, sy = s.y;
      if (dist < MOUSE_RADIUS && dist > 0) {
        const force = (1 - dist / MOUSE_RADIUS) * 0.5;
        sx += (dx / dist) * force;
        sy += (dy / dist) * force;
      }

      // Normalize position to current viewport
      const px = (sx / 2000) * W;
      const py = (sy / 2000) * H;
      const pr = s.r;

      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(212, 168, 83, ' + (s.alpha * 0.7) + ')';
      ctx.fill();

      // Tiny glow
      ctx.beginPath();
      ctx.arc(px, py, pr * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(212, 168, 83, ' + (s.alpha * 0.06) + ')';
      ctx.fill();
    }

    // Fire embers
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.x += e.vx;
      e.y += e.vy;
      e.life -= 0.001;

      // Mouse proximity — slight attraction
      const dx = mouseX - e.x;
      const dy = mouseY - e.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < MOUSE_RADIUS && dist > 0) {
        e.vx += (dx / dist) * 0.02;
        e.vy += (dy / dist) * 0.02;
      }

      // Reset if off screen or dead
      const ey = (e.y / 2000) * H;
      const ex = (e.x / 2000) * W;
      if (ey < -20 || e.life <= 0) {
        embers[i] = createEmber();
        continue;
      }

      const a = e.alpha * e.life;
      ctx.beginPath();
      ctx.arc(ex, ey, e.r, 0, Math.PI * 2);
      ctx.fillStyle = e.color;
      ctx.globalAlpha = a;
      ctx.fill();

      // Ember glow
      ctx.beginPath();
      ctx.arc(ex, ey, e.r * 3, 0, Math.PI * 2);
      ctx.fillStyle = e.color;
      ctx.globalAlpha = a * 0.1;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Dust motes
    for (const d of dust) {
      d.x += d.vx;
      d.y += d.vy;
      if (d.x < 0) d.x = 2000;
      if (d.x > 2000) d.x = 0;
      if (d.y < 0) d.y = 2000;
      if (d.y > 2000) d.y = 0;

      const dx = d.x - mouseX;
      const dy = d.y - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      let sx = d.x, sy = d.y;
      if (dist < MOUSE_RADIUS && dist > 0) {
        const force = (1 - dist / MOUSE_RADIUS) * 0.3;
        sx += (dx / dist) * force;
        sy += (dy / dist) * force;
      }

      const px = (sx / 2000) * W;
      const py = (sy / 2000) * H;

      ctx.beginPath();
      ctx.arc(px, py, d.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(212, 168, 83, ' + d.alpha + ')';
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ── Mouse Tracking (skip on touch devices) ── */
  const mouseLight = document.getElementById('mouse-light');
  var isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouchDevice) {
    mouseLight.style.display = 'none';
  }

  if (!isTouchDevice) {
  document.addEventListener('mousemove', function(e) {
    // Normalize mouse to 0-2000 virtual space for particle interaction
    mouseX = (e.clientX / W) * 2000;
    mouseY = (e.clientY / H) * 2000;
    mouseLight.style.left = e.clientX + 'px';
    mouseLight.style.top = e.clientY + 'px';

    // Soul element: fire responds to mouse proximity
    const cauldron = document.getElementById('cauldron-wrap');
    if (!cauldron) return;
    const rect = cauldron.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.33; // near the mouth
    const dist = Math.sqrt((e.clientX - cx) ** 2 + (e.clientY - cy) ** 2);
    const flameGroup = document.getElementById('flame-group');
    if (!flameGroup) return;

    const maxDist = 350;
    if (dist < maxDist) {
      const intensity = 1 - dist / maxDist;
      const scale = 1 + intensity * 0.4;
      const opacity = 0.7 + intensity * 0.3;
      flameGroup.style.transform = 'scaleY(' + scale + ') scaleX(' + (1 + intensity * 0.15) + ')';
      flameGroup.style.opacity = opacity;
      flameGroup.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';
    } else {
      flameGroup.style.transform = 'scaleY(1) scaleX(1)';
      flameGroup.style.opacity = '0.7';
      flameGroup.style.transition = 'transform 0.8s ease-out, opacity 0.8s ease-out';
    }
  });

  document.addEventListener('mouseleave', function() {
    mouseX = -9999;
    mouseY = -9999;
    mouseLight.style.left = '-300px';
    mouseLight.style.top = '-300px';
    const flameGroup = document.getElementById('flame-group');
    if (flameGroup) {
      flameGroup.style.transform = 'scaleY(1) scaleX(1)';
      flameGroup.style.opacity = '0.7';
    }
  });

  } /* end if (!isTouchDevice) */

})();

/* ── Navigation ── */
document.querySelector('[data-dom-id="btn-enter"]').addEventListener('click', function() {
  window.location.href = 'input.html';
});
    </script>
</body>
