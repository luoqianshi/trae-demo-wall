<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丹方呈现 — AI炼丹炉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700;900&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    <style id="theme-vars">
/* ============================================================
   AI炼丹炉 — Brand Design System
   Retro-futuristic Alchemy · Immersive Dark Theme
   Tone: retro-futuristic / emotional wellness / cyberpunk guofeng
   ============================================================ */

:root {
  /* ── Surface Elevation (Material Dark compliant) ── */
  --color-background:        #0d0d14;
  --color-surface:           #14142a;
  --color-surface-raised:    #1c1c38;
  --color-surface-overlay:   #24243e;

  /* ── Primary Hue: Amber-Gold (Alchemy Fire) ── */
  --color-primary:           #d4a853;
  --color-primary-dim:       #8b7536;
  --color-primary-bright:    #ffd700;
  --color-primary-glow:      rgba(212, 168, 83, 0.12);

  /* ── Text ── */
  --color-text-primary:      #e8e6f0;
  --color-text-secondary:    #9896a8;
  --color-text-muted:        #5a586a;

  /* ── Borders ── */
  --color-border:            rgba(212, 168, 83, 0.1);
  --color-border-strong:     rgba(212, 168, 83, 0.22);

  /* ── Semantic State Colors ── */
  --state-success:           #4a9e8e;
  --state-warning:           #d4a853;
  --state-error:             #c41e3a;
  --state-info:              #00c9a7;

  /* ── Typography ── */
  --font-display:            'Noto Serif SC', 'STKaiti', 'KaiTi', serif;
  --font-body:               'Noto Sans SC', sans-serif;
  --font-mono:               'Source Code Pro', monospace;

  /* ── Spacing ── */
  --space-xs:   4px;
  --space-sm:   8px;
  --space-md:   16px;
  --space-lg:   24px;
  --space-xl:   40px;
  --space-2xl:  64px;
  --space-3xl:  100px;

  /* ── Radius ── */
  --radius-sm:  2px;
  --radius-md:  8px;
  --radius-lg:  12px;
  --radius-full: 9999px;

  /* ── Motion ── */
  --ease:  cubic-bezier(0.16, 1, 0.3, 1);
  --duration-fast:   150ms;
  --duration-normal: 300ms;
  --duration-slow:   600ms;
}
    </style>

    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>

      <!-- Background layers -->
      <div class="result-bg" aria-hidden="true">
        <div class="bg-glow bg-glow--gold"></div>
        <div class="bg-glow bg-glow--teal"></div>
        <svg class="noise-overlay" xmlns="http://www.w3.org/2000/svg">
          <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter>
          <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
        </svg>
      </div>

      <!-- Result container -->
      <div class="result-container">

        <!-- 1. Pill Sphere -->
        <div class="pill-sphere-wrapper">
          <div class="pill-halo pill-halo--outer"></div>
          <div class="pill-halo pill-halo--inner"></div>
          <div class="pill-sphere" id="pillSphere"></div>
        </div>

        <!-- 2. Pill Name -->
        <h1 class="pill-name" id="pillName"></h1>

        <!-- 3. Decree Panel -->
        <div class="decree-panel" id="decreePanel">
          <div class="decree-panel__inner">
            <div class="decree-header">丹 方 <span id="decreeSourceBadge" class="decree-source-badge" style="display:none;"></span></div>
            <div class="decree-divider"></div>
            <div class="decree-body" id="decreeBody"></div>
            <div class="decree-divider"></div>
            <div class="seal-stamp" id="sealStamp"></div>
          </div>
        </div>

        <!-- 4. Ingredient List -->
        <div class="ingredient-list" id="ingredientList"></div>

        <!-- 5. Action Buttons -->
        <div class="action-buttons">
          <button class="action-btn" data-dom-id="btn-refine-again" id="btnRefineAgain">再炼一炉</button>
          <button class="action-btn" data-dom-id="btn-another-pill" id="btnAnotherPill">换一颗丹</button>
        </div>

        <!-- 6. Footer -->
        <footer class="result-footer">一炉一丹 · 一念一觉</footer>
      </div>

      <!-- AI Settings Gear Button -->
      <button id="aiSettingsBtn" class="ai-settings-gear" aria-label="AI 设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>

      <!-- AI Settings Panel Overlay -->
      <div id="aiSettingsOverlay" class="ai-settings-overlay" style="display:none;">
        <div class="ai-settings-panel">
          <div class="ai-settings-panel__header">
            <span style="font-family:var(--font-display);font-size:1.1rem;color:var(--color-primary);letter-spacing:0.1em;">AI 配置</span>
            <button id="aiSettingsClose" class="ai-settings-close" aria-label="关闭">&times;</button>
          </div>
          <div class="ai-settings-panel__body">
            <label class="ai-settings-label">API Key</label>
            <input type="password" id="aiApiKeyInput" class="ai-settings-input" placeholder="sk-..." autocomplete="off">
            <label class="ai-settings-label">模型</label>
            <select id="aiModelSelect" class="ai-settings-select">
              <option value="deepseek-ai/DeepSeek-V3">DeepSeek-V3</option>
              <option value="Qwen/Qwen3-8B">Qwen3-8B</option>
              <option value="deepseek-ai/DeepSeek-R1">DeepSeek-R1</option>
              <option value="Qwen/Qwen2.5-72B-Instruct">Qwen2.5-72B-Instruct</option>
            </select>
            <label class="ai-settings-label">API 地址</label>
            <input type="text" id="aiApiUrlInput" class="ai-settings-input" placeholder="https://api.siliconflow.cn/v1/chat/completions">
            <div class="ai-settings-actions">
              <button id="aiTestBtn" class="ai-settings-btn ai-settings-btn--test">测试连接</button>
              <button id="aiSaveBtn" class="ai-settings-btn ai-settings-btn--save">保存</button>
            </div>
            <div id="aiSettingsMsg" class="ai-settings-msg" style="display:none;"></div>
          </div>
        </div>
      </div>

    </main>

    <style>
      /* ── Page reset & base ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        background: var(--color-background);
        color: var(--color-text-primary);
        font-family: var(--font-body);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Background layers ── */
      .result-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .bg-glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
      }
      .bg-glow--gold {
        width: 500px; height: 500px;
        background: rgba(212, 168, 83, 0.04);
        top: -120px; left: 50%; transform: translateX(-50%);
      }
      .bg-glow--teal {
        width: 350px; height: 350px;
        background: rgba(0, 201, 167, 0.025);
        bottom: 5%; right: -80px;
      }
      .noise-overlay {
        position: absolute;
        inset: 0;
        width: 100%; height: 100%;
        opacity: 0.03;
      }

      /* ── Result container (centered vertical flow) ── */
      .result-container {
        position: relative;
        z-index: 1;
        max-width: 580px;
        margin: 0 auto;
        padding: var(--space-3xl) var(--space-lg) var(--space-2xl);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      /* ── 1. Pill Sphere ── */
      .pill-sphere-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 200px;
        height: 200px;
        margin-bottom: var(--space-xl);
        flex-shrink: 0;
      }
      /* Pill color custom properties (updated by JS) */
      :root {
        --pill-color-1: #d4a853;
        --pill-color-2: #ffd700;
        --pill-glow: rgba(212,168,83,0.4);
      }
      .pill-sphere {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        position: relative;
        z-index: 2;
        background: radial-gradient(circle at 35% 35%, var(--pill-color-1), var(--pill-color-2), #0d0d14);
        box-shadow: 0 0 40px var(--pill-glow), 0 0 80px rgba(212,168,83,0.06);
        animation: pillBreathing 5s ease-in-out infinite;
      }
      .pill-halo--inner { border-color: var(--pill-glow); }
      .pill-halo--outer { border-color: var(--pill-glow); opacity: 0.3; }
      .pill-halo {
        position: absolute;
        border-radius: 50%;
        border: 1px solid;
        z-index: 1;
      }
      .pill-halo--inner {
        width: 130px;
        height: 130px;
        animation: haloPulse 5s ease-in-out infinite;
      }
      .pill-halo--outer {
        width: 160px;
        height: 160px;
        animation: haloPulse 5s ease-in-out infinite 0.8s;
      }

      @keyframes pillBreathing {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes haloPulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.5; }
      }

      @media (prefers-reduced-motion: reduce) {
        .pill-sphere,
        .pill-halo--inner,
        .pill-halo--outer,
        .decree-paragraph,
        .seal-stamp {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }

      /* ── 2. Pill Name ── */
      .pill-name {
        font-family: var(--font-display);
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        font-weight: 700;
        letter-spacing: 0.15em;
        color: var(--color-primary);
        text-shadow: 0 0 20px var(--color-primary-glow), 0 0 40px rgba(212,168,83,0.08);
        text-align: center;
        margin-bottom: var(--space-2xl);
        word-break: keep-all;
        text-wrap: balance;
      }

      /* ── 3. Decree Panel (focal point) ── */
      .decree-panel {
        width: 100%;
        position: relative;
        margin-bottom: var(--space-2xl);
      }
      .decree-panel__inner {
        position: relative;
        background: rgba(10, 10, 15, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-md);
        padding: var(--space-xl);
        overflow: hidden;
      }
      /* Gold-tinted inner glow */
      .decree-panel__inner::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(212,168,83,0.08) 0%, transparent 50%, rgba(0,201,167,0.05) 100%);
        pointer-events: none;
        border-radius: inherit;
      }
      .decree-header {
        font-family: var(--font-display);
        font-size: clamp(1.3rem, 3vw, 1.6rem);
        font-weight: 700;
        color: var(--color-primary);
        text-shadow: 0 0 12px rgba(212,168,83,0.15);
        text-align: center;
        letter-spacing: 0.3em;
        margin-bottom: var(--space-lg);
        position: relative;
      }
      .decree-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
        margin: var(--space-md) 0;
        position: relative;
      }
      .decree-body {
        position: relative;
        z-index: 1;
      }
      .decree-paragraph {
        font-family: var(--font-display);
        font-size: clamp(0.95rem, 1.5vw, 1.05rem);
        line-height: 2.0;
        color: var(--color-text-secondary);
        margin-bottom: var(--space-md);
        text-align: center;
        opacity: 0;
        animation: fadeSlideUp 0.6s var(--ease) forwards;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .decree-paragraph:last-child { margin-bottom: 0; }

      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Seal Stamp ── */
      .seal-stamp {
        width: 64px;
        height: 64px;
        border: 2px solid var(--color-border-strong);
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: var(--space-lg) auto 0;
        position: relative;
        z-index: 1;
        animation: sealShimmer 4s ease-in-out infinite;
      }
      .seal-stamp__char {
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: var(--color-text-muted);
        opacity: 0.8;
      }

      @keyframes sealShimmer {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1.0; }
      }

      /* ── 4. Ingredient List ── */
      .ingredient-list {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
        margin-bottom: var(--space-2xl);
      }
      .ingredient-item {
        display: flex;
        align-items: flex-start;
        gap: var(--space-md);
        padding: var(--space-sm) var(--space-md);
        border-left: 2px solid;
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        transition: background var(--duration-fast) var(--ease);
      }
      .ingredient-item:hover {
        filter: brightness(1.15);
      }
      .ingredient-amount {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--color-text-muted);
        min-width: 60px;
        flex-shrink: 0;
        padding-top: 2px;
      }
      .ingredient-name {
        font-family: var(--font-display);
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--color-text-secondary);
      }

      /* ── 5. Action Buttons ── */
      .action-buttons {
        display: flex;
        gap: var(--space-lg);
        justify-content: center;
        align-items: center;
        margin-bottom: var(--space-3xl);
      }
      .action-btn {
        font-family: var(--font-display);
        font-size: clamp(0.85rem, 1.5vw, 0.95rem);
        color: var(--color-text-secondary);
        background: transparent;
        border: 1px solid var(--color-border);
        padding: 10px 28px;
        clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        cursor: pointer;
        transition: color var(--duration-fast) var(--ease),
                    border-color var(--duration-fast) var(--ease),
                    text-shadow var(--duration-fast) var(--ease);
        letter-spacing: 0.08em;
        line-height: 1.5;
      }
      .action-btn:hover {
        border-color: var(--color-primary);
        color: var(--color-primary);
        text-shadow: 0 0 12px rgba(212,168,83,0.2);
      }
      .action-btn:active {
        transform: scale(0.98);
      }
      .action-btn:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      /* ── 6. Footer ── */
      .result-footer {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--color-text-muted);
        letter-spacing: 0.3em;
        text-align: center;
      }

      /* ── Mobile adjustments ── */
      @media (max-width: 768px) {
        .pill-sphere {
          width: 80px;
          height: 80px;
        }
        .pill-sphere-wrapper {
          width: 160px;
          height: 160px;
          margin-bottom: var(--space-lg);
        }
        .pill-halo--inner {
          width: 110px;
          height: 110px;
        }
        .pill-halo--outer {
          width: 130px;
          height: 130px;
        }
        .seal-stamp {
          width: 50px;
          height: 50px;
        }
        .seal-stamp__char {
          font-size: 1.4rem;
        }
        .ai-settings-panel__body {
          padding: var(--space-md) var(--space-lg) var(--space-lg);
        }
        .ai-settings-gear {
          bottom: var(--space-md);
          right: var(--space-md);
          width: 44px;
          height: 44px;
        }
      }

      @media (max-width: 640px) {
        .result-container {
          padding: var(--space-2xl) var(--space-md) var(--space-xl);
        }
        .decree-panel__inner {
          padding: var(--space-md);
        }
        .decree-paragraph {
          font-size: 0.95rem;
        }
        .ingredient-item {
          padding: var(--space-xs) var(--space-sm);
          gap: var(--space-sm);
        }
        .action-buttons {
          flex-direction: column;
          gap: var(--space-md);
          width: 100%;
        }
        .action-btn {
          width: 100%;
          text-align: center;
          padding: 12px 24px;
        }
      }

      @media (max-width: 480px) {
        .pill-sphere {
          width: 70px;
          height: 70px;
        }
        .pill-name {
          font-size: clamp(1.5rem, 5.5vw, 2rem);
          margin-bottom: var(--space-lg);
        }
        .decree-panel__inner {
          padding: var(--space-md) var(--space-sm);
        }
        .decree-header {
          font-size: clamp(1.1rem, 4vw, 1.3rem);
          letter-spacing: 0.15em;
        }
        .ingredient-amount {
          min-width: 48px;
          font-size: 0.7rem;
        }
        .ingredient-name {
          font-size: 0.825rem;
        }
      }

      /* Touch improvements */
      .action-btn,
      .ai-settings-gear,
      .ai-settings-btn,
      .ai-settings-close {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      /* ── Decree Source Badge ── */
      .decree-source-badge {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 0.05em;
        padding: 2px 10px;
        border-radius: var(--radius-full);
        vertical-align: middle;
        margin-left: var(--space-sm);
        position: relative;
        top: -2px;
      }
      .decree-source-badge--ai {
        color: var(--state-info);
        background: rgba(0, 201, 167, 0.08);
        border: 1px solid rgba(0, 201, 167, 0.2);
        box-shadow: 0 0 8px rgba(0, 201, 167, 0.1);
      }
      .decree-source-badge--local {
        color: var(--color-text-muted);
        background: rgba(90, 88, 106, 0.08);
        border: 1px solid rgba(90, 88, 106, 0.15);
      }

      /* ── Decree Loading State ── */
      .decree-loading {
        text-align: center;
        padding: var(--space-xl) 0;
        font-family: var(--font-display);
        font-size: 1rem;
        color: var(--color-text-muted);
        animation: decreeLoadPulse 2s ease-in-out infinite;
      }
      .decree-loading__dots::after {
        content: '';
        animation: loadDots 1.5s steps(4, end) infinite;
      }
      @keyframes decreeLoadPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes loadDots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }

      /* ── AI Settings Gear Button ── */
      .ai-settings-gear {
        position: fixed;
        bottom: var(--space-xl);
        right: var(--space-xl);
        z-index: 100;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--color-border);
        background: rgba(20, 20, 42, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--color-text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color var(--duration-fast) var(--ease),
                    border-color var(--duration-fast) var(--ease),
                    transform var(--duration-fast) var(--ease);
      }
      .ai-settings-gear:hover {
        color: var(--color-primary);
        border-color: var(--color-border-strong);
        transform: rotate(30deg);
      }
      .ai-settings-gear:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      /* ── AI Settings Panel ── */
      .ai-settings-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;

            `你写了"${veryShort}"。\n\n我直接跟你说吧：\n你现在焦虑的事情，十件里有九件根本不会发生。\n\n这不是安慰，是统计学的结论。\n你的大脑在疯狂预演坏结局，\n但"想得到最坏的情况"和"最坏的情况会发生"是两码事。\n你的脑子不是预言机，它只是个焦虑制造机。\n\n试一下：把你最怕的那件事写下来。\n写出来之后你会发现，它没那么大。\n你之所以觉得它大，是因为你一直在脑子里转，\n没有落地。焦虑这东西，\n一旦落到纸上，体积会缩小百分之八十。\n\n然后去做一件具体的小事。\n任何事都行。洗碗也行。\n你的身体需要从"备战状态"里退出来，\n而"做一件小事"是最快的退路。`,
            `你写了"${veryShort}"。\n\n上个月让你焦虑到睡不着的那件事，\n你还记得吗？\n大概率想不起来了，或者只剩一个模糊的影子。\n\n这说明一件事：\n焦虑的保质期比你以为的短得多。\n你现在觉得"天要塌了"的事，\n下个月回头看，可能连"那件事"都算不上。\n但你现在正在为它支付全部的注意力，\n消耗今晚的睡眠、明天的精力、\n和此刻本可以用来做点别的事情的时间。\n\n焦虑本质上是在预支明天的情绪来付今天的利息。\n而明天那件事大概率不会来催账。\n\n现在去做一个实验：\n打开手机备忘录，翻到你一个月前的记录。\n看看那时候你在烦什么。\n然后问自己——那些事情现在怎样了？\n这个对比会比你听一百句安慰都管用。`,
            `你写了"${veryShort}"。\n\n焦虑不只是心理问题，它是生理问题。\n你的呼吸变浅了，心跳变快了，\n肌肉在不知不觉中绷紧。\n你的身体已经进入了"战斗或逃跑"模式，\n但你既不需要战斗，也不需要逃跑——\n你只是坐在那里，身体在白费力气。\n\n所以别光从"想法"层面去解决焦虑，\n先从身体层面把它关掉。\n\n试试4-7-8呼吸法：\n鼻子吸气4秒，\n憋住7秒，\n嘴巴慢慢呼气8秒。\n循环四次。\n\n这个方法之所以有效，\n是因为它直接告诉你大脑的迷走神经：\n"没事，现在很安全。"\n你的大脑会信的——它本来就没有那么聪明。`,
          ],
          'mingxin': [
            `你写了"${veryShort}"。\n\n迷茫的时候你最常做的动作是什么？\n等。等想清楚再动，等有感觉了再开始。\n\n但你有没有想过，\n那些看起来"想清楚了"的人，\n其实也没想清楚，\n他们只是先动了。\n路不是看清了才出现的，\n是走上去之后才显形的。\n\n你现在的状态，\n不是没有方向，是方向太多了。\n看什么都像路，看什么都像不对。\n这种时候，别分析了。\n拿一张纸，把所有选项列出来，\n然后划掉你最不想做的那个。\n再划掉一个。\n最后剩下的，就去做。\n\n想是想不出答案的，答案都是做出来的。`,
            `你写了"${veryShort}"。\n\n告诉你一个反直觉的事：\n迷茫说明你有选择。\n\n你看那些不迷茫的人，\n不是因为他们看透了人生，\n是因为他们没得选——\n家里安排的、欠了债的、被逼到墙角的。\n他们不迷茫，因为路只有一条。\n\n你迷茫，恰恰说明你手里有牌，\n只是你不知道出哪张。\n这比没有牌可出要好得多，\n虽然现在感觉更难受。\n\n还有一个可能你不爱听的真相：\n有些人用"迷茫"来回避做决定。\n因为"想"看起来很努力，\n但不需要承担任何风险。\n\n今天就做一个测试：\n选一件你一直在犹豫的小事，\n给自己设定一个30分钟的倒计时。\n时间一到，必须选。\n你会发现，选完之后的那股轻松感，\n比选对选错重要一百倍。`,
            `你写了"${veryShort}"。\n\n你在找一个"最优解"。\n但我想告诉你——\n人生这道题，根本没有最优解。\n\n你以为那些过得好的人找到了正确答案，\n没有。他们只是选了一个，\n然后把那个选择活成了正确答案。\n\n你纠结的每一分钟，\n都是在让"还没选"这个状态持续得更久。\n而"还没选"才是最差的状态——\n它让你同时承受所有选项的焦虑，\n却不给你任何一个选项的收益。\n\n别再分析了。你现在掌握的信息\n已经足够做出一个不低于六十分的决定。\n剩下的四十分，\n是选了之后才有的。\n\n现在，打开手机日历，\n在明天的某个时间格子里写上你的决定。\n不用完美，写上去就算数。`,
          ],
          'wangchuan': [
            `你写了"${veryShort}"。\n\n我知道你在想什么。\n你在想"如果当初……会怎样"。\n\n但我要告诉你一个很残酷的事实：\n"如果当初"这条路，根本不存在。\n你觉得那条路上有更好的结局，\n但你怎么知道？\n那条路上也有一堆你不知道的坑。\n你拿"已知的不好"去对比"未知的可能好"，\n这个比法本身就不公平。\n\n已经吃过的糖，甜味是真的，但糖没了。\n你反复舔那颗糖纸，不会舔出第二颗糖来。\n\n你现在要做的不是忘记，\n是停止给过去加滤镜。\n那段关系有好的部分，也有让你走到今天的部分。\n它结束了，这个事实不会因为你多想三天就改变。\n\n今天就做一件事：\n把手机里那些旧聊天记录删掉。\n不是冷酷，是给自己松绑。`,
            `你写了"${veryShort}"。\n\n你有没有分清楚一件事——\n你放不下的，到底是那个人，\n还是"被人珍惜"的那种感觉？\n\n这两件事差别太大了。\n如果你只是怀念被爱的感觉，\n那你去爱任何一个人都能重新获得。\n但如果你以为那个感觉只有那个人能给，\n你就把自己困死了。\n\n你脑子里反复播放的，\n都是最好的那些片段。\n你们一起笑的时刻、对方说过的甜言蜜语、\n那些让你心跳加速的瞬间。\n但你记不记得那些争吵？\n那些让你一个人哭到凌晨三点的夜晚？\n你为什么不给那些画面同等的播放时间？\n\n因为你的大脑在自动筛选。\n它只留甜的，把苦的都删了。\n这不是记忆，这是剪辑。\n\n今天就做一件事：\n拿出一张纸，左边写"让我痛的事"，右边写"让我甜的事"。\n写完你看一眼，\n你一直放不下的那个"完美的人"，\n可能本来就没那么完美。`,
            `你写了"${veryShort}"。\n\n你今天刷了多久前任的朋友圈？\n或者说，你通过朋友的转发、\n共同关注的人的动态，\n间接地"看"了多久？\n\n每看一次，你都是在给自己重新撕开一次伤口，\n然后告诉自己"我就看一眼"。\n但那一眼够你难受一整个下午。\n\n你不需要"彻底放下"这么宏大的目标，\n你只需要做到一件事：\n切断信息源。\n\n今天就做一个24小时挑战：\n把所有社交软件设为免打扰，\n不看任何人的动态，\n不发任何东西，\n就断联24小时。\n\n如果你连24小时都做不到，\n那说明你不想好，你想继续待在这个痛苦里。\n听起来刺耳，但你自己想想是不是。`,
          ],
          'lixing': [
            `你写了"${veryShort}"。\n\n拖延的人有一个秘密，自己不愿意承认：\n你不是懒，你是怕。\n\n怕做出来不够好，怕做了白做，\n于是用"再想想""还没准备好"来骗自己。\n但你心里清楚——\n今天能用的借口，明天照样能用。\n这个"再等一天"的剧本，你已经演了多少遍了？\n\n一年后的你回看今天，\n不会说"还好当初多想了想"，\n只会说"当初怎么就没动手"。\n\n别等了。你现在不需要"准备好"，\n你只需要开始做五分钟。\n五分钟之后你大概率会继续做下去，\n因为最难的不是过程，是启动。\n\n去做。哪怕做得烂，也比什么都不做强。`,
            `你写了"${veryShort}"。\n\n你今天"休息"了一天，对吧？\n躺在床上刷手机，\n偶尔看看剧，偶尔点个外卖，\n什么正事都没做。\n\n但你晚上躺下来的时候，\n感觉比上班还累。\n因为你今天不是在休息，\n你是在用"假装休息"来逃避那件该做的事。\n而那件事一直挂在你的后台，\n像一台静音运行的空调，\n一直在耗你的电。\n\n这种"假休息"比真干活还消耗人。\n因为干活的时候你至少有进度感，\n假休息只有空虚和自责。\n\n你只拖延你真正在意的事。\n不在意的事你根本不会拖——\n你会直接忘掉。\n你拖，恰恰说明你心里有火，\n只是那把火被恐惧盖住了。\n\n现在就做：\n打开你一直在拖的那件事，\n别追求完美，做一个60分的版本。\n60分就能交差，\n剩下的40分之后再说。`,
            `你写了"${veryShort}"。\n\n拖延症有一个最被忽略的真相：\n你不是不会开始，\n你是把"开始"想象得太重了。\n\n你觉得开始意味着要投入两个小时、\n要进入深度专注、要一气呵成。\n没有这整块时间，你就觉得"不如等一下"。\n但"等一下"从来不会来。\n\n真相是：\n几乎所有拖延的事，\n都可以拆成5分钟以内能启动的第一步。\n写报告？打开文档写个标题就行。\n去跑步？穿上鞋就行。\n打电话？拨号就行。\n\n你不需要完成，你只需要启动。\n因为一旦启动，惯性会帮你。\n大脑有一种"未完成效应"——\n开始了的事，它就会想把它做完。\n\n现在，定一个5分钟的倒计时。\n时间一到，你就去做那件事的第一步。\n不用多，就一步。\n你会发现最难的部分已经过去了。`,
          ],
          'zicheng': [
            `你写了"${veryShort}"。\n\n我猜你有一个习惯：\n评价自己的时候，比谁都狠。\n别人考了八十分会觉得还行，\n你考了八十五分还在想那丢掉的十五分。\n\n问题出在哪？\n出在你拿的是别人的尺子。\n你量自己的时候，用的是社交媒体上的高光时刻、\n同龄人的晋升速度、别人家的生活模板。\n那把尺子不是你的，\n量出来的结果当然永远"不够"。\n\n你有没有认真想过，\n你今天还活着、还在努力、还在试图变好——\n这件事本身，已经超过很多人了？\n\n从今天起，做一件事：\n每天晚上写一个"今天做得还行的事"。\n不用多好，"今天按时吃了饭"也算。\n坚持一周，你会发现你其实没那么差。\n你只是从来不允许自己承认"还行"。`,
            `你写了"${veryShort}"。\n\n做一个思想实验：\n你最好的朋友，遇到跟你一模一样的情况，\n走到你面前跟你说了一样的话，\n你会怎么回应TA？\n\n你大概率会安慰TA、鼓励TA、\n告诉TA"你已经很棒了"。\n但同样的事落在自己身上，\n你的第一反应是"我怎么这么差"。\n\n你对自己的标准，\n是永远不会用在朋友身上的。\n这就是双重标准。\n你对别人宽容，对自己残忍，\n还觉得这叫"严格要求自己"。\n\n这不是严格，这是不公平。\n而且是对最不该被不公平对待的人——你自己。\n\n今天晚上，写三件你做得还不错的事。\n不用是大事。\n"今天出门了"、"回复了一条一直不敢回的消息"、\n"忍住了没骂人"——都算。\n写完之后大声读一遍。\n别笑，你真的需要听一遍别人（哪怕是自己）夸你。`,
            `你写了"${veryShort}"。\n\n你知道那些看起来特别自信的人，\n私底下什么样吗？\n跟你差不多。\n\n我认识好几个在外人看来"特别有底气"的人，\n单独聊天的时候他们会说：\n"我其实一直在装，\n怕哪天被人发现我根本不行。"\n\n这种感觉有个名字，叫"冒充者综合征"。\n不是只有你有，\n绝大多数你觉得"比自己强"的人都有。\n他们只是演技比你好一点。\n\n所以你拿自己去跟别人比的时候，\n你是在拿自己的后台花絮，\n去对比别人的精修宣传片。\n这个比法，你怎么可能赢？\n\n从现在开始，每次你心里冒出"我不行"的时候，\n问自己一个问题：\n"如果我的朋友遇到同样的情况，\n我会觉得TA不行吗？"\n如果答案是不会，\n那就把这个标准用在自己身上。`,
          ],
          'qingji': [
            `你写了"${veryShort}"。\n\n我想问你一个问题：\n你是真的孤独，还是只是"一个人待着"的时候觉得不自在？\n\n这两件事差别很大。\n孤独是"我想有人陪但没人"，\n不自在是"我一个人待着感觉好像有问题"。\n如果你是后者，\n那你的问题不是缺朋友，\n是你不习惯跟自己待在一起。\n\n有些人靠独处充电，有些人靠社交充电。\n你大概以为自己是后者，\n但其实你可能更适合前者。\n你只是从来没给过自己一个真正独处的机会——\n不是刷手机的那种独处，\n是安安静静待着、什么都不用扮演的那种。\n\n今晚试试：手机放另一个房间，\n就坐着，什么都不干，十五分钟。\n刚开始会难受，但难受过去之后，\n你会发现那种安静其实挺舒服的。`,
            `你写了"${veryShort}"。\n\n你有没有想过，\n也许不是你有问题，\n是你的圈子有问题？\n\n你身边那些人，\n有多少是真正让你觉得"被理解"的？\n不是那种"吃饭能叫上"的社交，\n是那种"我不用解释自己TA就懂"的连接。\n\n你之所以觉得孤独，\n可能不是因为你不会社交，\n是因为你周围没有跟你同频的人。\n在一群聊八卦的人里谈理想，\n在一群只看表面的人里展示真实的自己，\n当然会觉得孤独——\n因为你在用错的语言跟错的人说话。\n\n这不叫孤独，这叫不匹配。\n\n今天做一件事：\n想想你最近一次觉得"被懂了"是什么时候，\n跟谁在一起。\n然后主动约那个人聊一次天。\n不是约饭，是约聊天。\n看看那种"被接住"的感觉，\n是不是你一直在找的东西。`,
            `你写了"${veryShort}"。\n\n你越怕孤独，\n孤独就越像影子一样跟着你。\n\n因为你怕，所以你急着找人填补，\n什么局都去、什么人都聊、\n明明不想出门也逼自己社交。\n结果就是——\n人群中你反而更孤独。\n因为你忙着表演"我很好很合群"，\n连孤独的时间都没有了。\n\n这就像你越怕黑就越开所有的灯，\n但灯光之下你依然看不到星星。\n\n你需要分清两件事：\n"不舒服的独处"和"真正的孤独"。\n前者是你还没学会跟自己相处，\n后者是你真的缺少深度连接。\n大多数人的问题其实是前者。\n\n今天给自己一个任务：\n一个人去一家你从没去过的咖啡店或公园，\n不约人，不带电脑，\n就坐半小时，看看周围的人。\n你会发现，\n一个人的世界其实比你想的丰富。`,
          ],
          'shouzhuo': [
            `你写了"${veryShort}"。\n\n你有没有算过，\n你一天里有多少精力花在了"想"上面？\n还没开口就预演了被拒绝的八种可能，\n还没动手就先把自己审判了三遍，\n还没出门就把路上可能出的问题全过了一遍。\n\n等你真正要做的时候，\n精力已经耗完了，\n所以你觉得累，觉得什么都不想做。\n你不是想太多，\n你是把精力全花在了"假想"上。\n\n一个很简单的办法：\n当你又开始转圈的时候，\n问自己一个问题——"这件事最坏的结果是什么？"\n然后问第二个问题——"最坏的结果我能承受吗？"\n\n绝大多数时候，两个答案都是"能"。\n能承受的话，就别想了，去做。`,
            `你写了"${veryShort}"。\n\n"想"和"内耗"是两件事。\n\n想，是有方向的——\n想完之后能得出一个结论、\n做出一个决定、或者排除一个选项。\n想完之后你的脑容量变轻了。\n\n内耗，是原地打转——\n同一个念头翻来覆去地嚼，\n嚼到没有味道了还在嚼，\n嚼完之后什么结论都没有，\n只有更累、更焦虑、更不确定。\n\n你怎么判断自己是在"想"还是在"内耗"？\n很简单：\n想完之后你是否有下一步行动？\n如果没有，那就是内耗。\n\n你心里那堵看不见的墙，\n不是由"困难"砌成的，\n是由"万一"砌成的。\n"万一失败了""万一被拒绝""万一选错了"——\n每一个"万一"都是一块砖，\n你花了多少时间在往上堆？\n\n现在就做一个10分钟的定时决定练习：\n找一个你纠结的小事，\n设定10分钟倒计时，\n时间到了必须做出决定并执行。\n没有"再想想"这个选项。`,
            `你写了"${veryShort}"。\n\n你知道你在内耗的时候，\n身体在发生什么吗？\n你的肩膀在收紧，\n你的胃在缩成一团，\n你的呼吸变浅了。\n\n你的身体比你诚实。\n你的嘴上说着"没事我在想事情"，\n身体已经在报警了。\n\n内耗最狠的地方在于——\n它让你以为自己在"解决问题"，\n实际上你只是在"体验问题"。\n你把同一个场景在脑子里演了五十遍，\n每一遍都加了新的细节、新的灾难、\n新的让你害怕的结局。\n但这五十遍里没有一遍是真的。\n\n今天就做一个物理打断：\n每当你发现自己开始转圈的时候，\n站起来，走到窗边，\n用冷水洗一把脸。\n然后问自己一个问题——\n"这件事我现在能做什么？"\n能做就去做，不能做就放。\n只有这两个选项，没有第三个。`,
          ],
          'anzhen': [
            `你写了"${veryShort}"。\n\n失眠有一个悖论：\n你越想睡着，就越睡不着。\n\n因为你把"睡觉"变成了一项任务，\n你的大脑接收到的是"必须完成"的信号，\n于是它开始加班。\n你不是失眠，\n你是把睡觉这件事搞得太认真了。\n\n你的身体其实比你聪明。\n它困了自然会催你，\n是你脑子不肯交班。\n\n今晚试一个方法：\n允许自己不睡。\n对，就是告诉自己"今晚不睡了也行"。\n然后躺着，不追任何想法，\n不想明天的事，不数羊，不检查自己睡着了没有。\n就只是躺着。\n\n你会发现，当你不再跟睡眠较劲的时候，\n它反而自己就来了。`,
            `你写了"${veryShort}"。\n\n你有没有想过，\n你其实不是睡不着，\n你是不舍得睡。\n\n白天的时间都给了工作、给了别人、\n给了那些你"不得不做"的事。\n只有深夜这几个小时是完全属于你的。\n你舍不得结束这一天，\n因为结束了就意味着明天又要开始新一轮的"不得不"。\n\n你不是失眠，你是在抢回自己的时间。\n只是你抢的方式不对——\n你用刷手机来填充这些时间，\n刷完之后只觉得更空虚。\n\n还有一个恶性循环你可能没意识到：\n你越担心明天精神不好，\n就越睡不着。\n越睡不着，\n就越担心明天精神不好。\n打破这个循环的唯一方法，\n就是放弃对"好睡眠"的执念。\n\n今晚试试这个：\n睡前把手机放到伸手够不到的地方，\n然后在枕边放一本纸质书。\n不用看进去，翻几页就行。\n纸质阅读会让你的大脑自然减速，\n比任何助眠APP都管用。`,
            `你写了"${veryShort}"。\n\n你害怕的不是"今晚睡不着"，\n你害怕的是"明天因为没睡好而搞砸一切"。\n\n但你回想一下，\n你以前那些没睡好的夜晚，\n第二天真的搞砸了吗？\n大概率没有。\n你可能确实有点困，\n但你该做的事还是做了，\n该见的人还是见了，\n日子照样过下去了。\n\n你的大脑在骗你。\n它把"一晚没睡好"等同于"明天全毁了"，\n但这两者之间差了十万八千里。\n\n人体比你以为的耐操得多。\n一晚睡不好不会怎样，\n两晚也不会怎样。\n真正让你第二天崩溃的，\n不是缺觉本身，\n是你对缺觉的恐惧和焦虑。\n\n今晚给自己一个心理暗示：\n"就算今晚完全睡不着，\n我也不会死，\n明天也还是会过去的。"\n\n把这句话在心里默念三遍。\n然后在床头放一张纸和一支笔，\n把你脑子里的想法随便写下来，\n写完合上本子，闭眼。\n不用睡着，躺着就行。`,
          ],
          'jianghuo': [
            `你写了"${veryShort}"。\n\n你生气是有道理的。\n我不会跟你说"别生气了"，\n那跟往火上泼水一样，只会炸。\n\n但有一件事你可以在生气的时候想一想：\n你现在最想做的那个反应——\n发消息、说狠话、摔东西、删好友——\n你做完之后会后悔吗？\n\n不用现在回答。\n等这股火过去百分之三十的时候再想。\n因为现在你想的答案，是火在替你回答的。\n\n愤怒本身没有错。\n但愤怒时做的决定，十次里有八次事后会后悔。\n\n所以现在就做一件事：\n把你想说的那些话打在备忘录里。\n全部打出来，一字不落。\n然后关掉备忘录，不去发。\n明天早上再看一遍。\n如果到时候你还想发，那就发。`,
            `你写了"${veryShort}"。\n\n愤怒的下面，\n藏着一个你不太愿意承认的东西——\n一个没被满足的需求。\n\n你气的是对方迟到了，\n但你真正在意的是"你不重视我"。\n你气的是同事甩锅，\n但你真正在意的是"我的努力没有被看见"。\n你气的是父母唠叨，\n但你真正在意的是"你们从来不信任我"。\n\n愤怒是一种信号，\n它在告诉你：\n有什么东西对你很重要，但它被忽视了。\n问题是，你每次只表达了愤怒，\n没有表达愤怒下面的那个需求。\n于是对方只看到你在发火，\n不知道你真正想要什么。\n\n给你一个方法：\n在你生气的时候，\n先别急着发作，\n问自己一个问题——\n"如果我不生气，\n我真正想对这个人说什么？"\n\n那个答案，才是你该说出口的话。\n今天就试一次，\n用"我感到……因为我需要……"的句式\n去替代你的愤怒表达。`,
            `你写了"${veryShort}"。\n\n现在你浑身发抖、\n心跳加速、\n脑子里全是那句想骂出口的话。\n\n我不劝你冷静，\n因为"冷静"这两个字在愤怒的时候就是废话。\n但我会给你一个物理上的操作——\n离开现场。\n\n不是逃避，是给自己一个物理冷却的空间。\n你的大脑现在被杏仁核劫持了，\n理性部分暂时掉线。\n这时候你做的任何决定、说的任何话，\n都不是"你"说的，\n是"愤怒的你"说的。\n\n站起来，走到阳台上，或者下楼走一圈。\n只要离开那个让你生气的空间，\n你的生理状态就会开始变化。\n\n但还有一件事更重要：\n你的愤怒到底值不值得持续？\n给你自己设一个三天期限——\n三天之后你还气，那说明这事真的重要，\n值得你认真去处理。\n三天之后你不气了，\n那说明它就没那么重要，\n当初差点因为冲动做的事，幸好没做。\n\n现在，穿上鞋，出门走十分钟。`,
          ],
          'gongzuo': [
            `你写了"${veryShort}"。\n\n你的累，不是多睡一觉能解的。\n因为这不是身体的累，是意义的累。\n\n你每天都在忙，但你停下来想过没有——\n你忙的事情里，\n有多少是你真正在意的？\n有多少是别人塞给你的？\n有多少是你觉得"不做不行"但实际上做了也没人感谢的？\n\n你把所有的事都扛着，\n不是因为你能力强，\n是因为你不会拒绝。\n\n从明天开始，做一件事：\n把你每天要做的事写下来，\n然后划掉其中三分之一。\n对，直接划掉。\n你会发现天没有塌下来，\n而你有了一点点喘息的空间。`,
            `你写了"${veryShort}"。\n\n你有没有过这种体验：\n忙了一整天，晚上躺下来，\n想回忆今天到底做了什么，\n脑子里一片空白？\n\n不是你没做事，\n是你做了太多不重要的事，\n重要的事反而被淹没了。\n开会、回消息、处理突发状况、\n帮别人救急——\n一天下来你确实没闲着，\n但你不知道今天有什么值得记住的。\n\n这就是"无意义的疲惫"。\n它比"有意义的疲惫"可怕十倍，\n因为后者至少有成就感兜底，\n前者只有纯粹的消耗。\n\n你现在还有一个没说出口的恐惧：\n你怕停下来，\n因为你怕别人趁你休息的时候超过你。\n这个恐惧在驱动你拼命，\n但它驱动的方式是让你持续低效地运转。\n\n从明天开始做一件事：\n每天早上选一件"今天最重要的那件事"。\n只选一件。\n写在便利贴上贴在电脑边上。\n这一天无论发生什么，\n先保证这一件事做完了再说。\n其他的，能推就推。`,
            `你写了"${veryShort}"。\n\n你的工作模式有一个致命问题：\n你在用"忙碌"来逃避"思考"。\n\n每天一坐下就开始处理眼前的任务，\n一个接一个，像打地鼠一样。\n打完了觉得自己好努力、好辛苦，\n但一周过去，\n你不知道这一周到底推进了什么。\n\n因为你从来没有停下来问过自己：\n"这些事真的都需要我做吗？"\n"这些事里哪些是在帮别人完成KPI，\n哪些是在帮我自己？"\n\n你不是工作量太大，\n你是没有在主动选择把时间花在哪里。\n你是一个被动响应器，\n谁的请求来了就先处理谁的，\n自己的事永远排到最后。\n\n今天就做一个练习：\n把你今天所有要做的事列出来，\n然后只做那个"如果今天只能做一件事，\n我会选哪个"的答案。\n\n做完那一件之后，\n你会发现今天已经成功了。\n剩下的都是赚的。`,
          ],
          'renji': [
            `你写了"${veryShort}"。\n\n这段关系里最折磨你的，\n不是发生了什么，\n是那些"没说出口"的东西。\n\n你在猜对方怎么想，\n对方大概也在猜你怎么想。\n两个人都在猜，\n于是越猜越远，越远越累。\n\n我直接跟你说：\n说开了的事，百分之九十没有你想象的那么难听。\n真正伤人的，\n从来不是那句说出口的真话，\n是那些你永远没说出来的揣测。\n\n你今天就可以做一个选择：\n把你想说的那句话发出去。\n不用修饰，不用铺垫，\n就你心里最直接的那句。\n发完之后，不管对方怎么回，\n你至少不亏欠自己了。`,
            `你写了"${veryShort}"。\n\n你们之间最大的问题不是不爱了，\n是两个人都在等对方先迈那一步。\n\n你觉得"我都这么委屈了TA应该看出来"，\n对方大概也在想同样的话。\n于是两个人都憋着，\n都觉得自己是更受伤的那个，\n都在等一句"对不起"或者"我在乎你"。\n\n但你有没有想过——\n你们之间的距离，\n不是被某件大事拉开的，\n是被无数次"我以为你知道"累积出来的。\n\n"我以为你知道我不开心。"\n"我以为你知道我在乎。"\n"我以为你懂我的意思。"\n\n但事实是，\n没有人能准确读懂另一个人。\n你不是TA肚子里的蛔虫，\nTA也不是你。\n\n今天就做一件事：\n别再等了。\n把你最想说、但又觉得"说了好像在示弱"的\n那句话，发出去。\n不用长篇大论，\n一句"我最近有点难过"就够了。\n看看会发生什么。\n如果连这句话都不愿意说，\n那你可能不是在维护这段关系，\n你是在维护自己的面子。`,
            `你写了"${veryShort}"。\n\n你发现没有，\n你们吵架的时候从来不是在吵那个具体的事。\n\n你们吵的是"你从来不帮我做家务"——\n但真正让你生气的不是那堆碗，\n是"你不在乎我的辛苦"。\n\n你们吵的是"你总是看手机不理我"——\n但真正让你伤心的是"我没有被重视"。\n\n每一次表面的争吵下面，\n都藏着一个没有被回应的需求。\n但你们每次只停留在表面吵，\n吵完之后谁都不开心，\n谁都没被真正听见。\n\n还有一件事你可能没意识到：\n你忍着不说的话，不会消失。\n它们会积攒，\n积攒到有一天你突然爆发，\n说出来的话比事情本身狠十倍，\n对方还觉得你莫名其妙。\n\n所以，在你还愿意好好说话的时候就说。\n别等到你不想说了再说——\n到那时候，说的就只剩告别了。\n\n今天，把你一直在心里滚的那句话，\n用"我觉得……因为……"的句式说出来。\n不带指责，只表达感受。`,
          ],
          'xuanyi': [
            `你写了"${veryShort}"。\n\n你让我帮你选，说实话我选不了。\n但我可以帮你做一件事——\n让你看清自己心里其实已经有答案了。\n\n闭上眼睛，想象一下你选了A。\n注意你身体的反应——你是松了口气，还是更紧了？\n然后再想象选了B。\n\n那个让你松气的，就是你的答案。\n你纠结的不是"选哪个好"，\n是"万一选错了怎么办"。\n但你想想，\n那些看起来果断的人，也不是每次都选对的，\n他们只是选了之后不再回头。\n\n没有完美选项。\n每个选项都有代价，\n但你选了之后，那个代价就会变成你人生的养分。\n\n所以，你心里那个隐隐偏向的答案是什么？\n你知道的。你只是一直不敢承认。`,
            `你写了"${veryShort}"。\n\n有一个很老但很好用的方法，\n叫硬币测试。\n\n拿出一枚硬币，\n正面代表A，反面代表B。\n然后抛。\n\n重点不是硬币落下来是哪一面，\n重点是在硬币还在空中的那一秒——\n你心里有没有偷偷希望它是某一面？\n\n如果有，那就是你的答案。\n你的大脑其实在抛硬币之前就已经选了，\n它只是在等一个"许可"。而硬币给了你这个许可。\n\n但你已经纠结三天了对吧？\n三天还没选出来说明什么？\n说明两个选项差距不大。\n既然差距不大，那选哪个都不会太差。\n你最怕的"选错"这件事，\n在这个情况下根本不存在——\n因为不存在"明显更对的那个"。\n\n今天拿出手机，\n打开随机数生成器，\n1代表A，2代表B，点一下。\n看到结果的那一瞬间你的第一反应，\n就是你真正的选择。\n\n然后，去执行它。`,
            `你写了"${veryShort}"。\n\n你以为你不做选择就可以等下去，\n但我想告诉你一个你可能不想听的事实——\n不做选择，本身就是一种选择。\n而且通常是最差的那一种。\n\n因为你不选，\n时间会帮你选。\n机会会过期，人会走，\n窗口会关上。\n到时候你不是"选了B"，\n你是"被迫接受了B"，\n而且连A的体验都没有拿到。\n\n你纠结的本质不是"两个都不好选"，\n是"两个都想选"。\n但你心里清楚你只能选一个，\n所以你用纠结来假装自己还在权衡。\n\n这个"假装权衡"的状态，\n每天都在消耗你的精力，\n而且它不会自动结束——\n除非你主动结束它。\n\n今天就做一件事：\n给你自己设定一个deadline。\n在日历上选一个具体的时间——\n明天下午6点、后天早上9点，都行。\n在那个时间之前你可以继续想，\n但时间一到，必须选。\n然后，不再回头。`,
          ],
          'shanshan': [
            `你写了"${veryShort}"。\n\n你知道你的问题是什么吗？\n你的善良没有底线。\n\n别人一开口你就答应了，\n不是因为你真的想帮，\n是因为你不会说"不"。\n你怕拒绝了会得罪人，\n怕别人觉得你冷漠，\n怕自己变成"那种人"。\n但你有没有想过——\n你一直在为别人的感受负责，\n谁在为你的感受负责？\n\n善良是好事，\n但没有边界的善良，\n不是善良，是自我消耗。\n\n从今天开始做一个练习：\n任何人找你帮忙，先别马上答应。\n停三秒，问自己一个问题——\n"这事帮了之后，我自己还撑得住吗？"\n撑得住就帮，撑不住就拒。\n这不叫冷血，叫正常的人际边界。`,
            `你写了"${veryShort}"。\n\n我问你一个问题，你老实回答：\n你上一次帮别人的时候，\n心里是开心的，还是无奈的？\n\n如果是开心的，那没问题。\n但如果是无奈的——\n你明明不想帮、明明自己也很累，\n但嘴上还是说了"好的没问题"——\n那你的"善良"就不是善良，\n是讨好。\n\n讨好和善良的区别在于：\n善良是"我愿意所以我帮"，\n讨好是"我不愿意但我不敢拒绝"。\n你每次说"好"的时候都在骗自己，\n说你骗得很累。\n\n更可怕的是，\n你每帮一次不想帮的忙，\n你就丢掉一块自己。\n时间久了你会发现自己\n变得什么都不想做了、\n对谁都提不起劲、\n连真正的朋友叫你出去你都不想去了。\n因为你的"好"已经透支了。\n\n今天就练一句拒绝的话：\n"我现在手头有点事，\n可能帮不了你，抱歉。"\n不用解释，不用找借口，\n就说这句。\n今天一定会有一个机会让你用上它。\n用了之后你会发现，天没塌。`,
            `你写了"${veryShort}"。\n\n你以为你的善良是在帮别人，\n但让我告诉你真相：\n没有边界的善良，\n不是在帮别人，是在消耗自己。\n\n而且你帮的那些人，\n大部分不是真的需要帮助，\n他们只是习惯了找你。\n因为你从来不说"不"，\n所以在他们眼里你就是一个\n永远可以调用的人。\n你不是在做好事，\n你是在养别人"理所当然"的习惯。\n\n更扎心的是——\n你这么好说话，\n但你遇到困难的时候，\n那些你帮过的人有几个来帮你了？\n你心里有答案。\n\n善良是一种能力，\n但它需要开关。\n没有开关的善良，\n不是善良，是一种自我毁灭式的付出。\n\n今天开始，每次有人说"帮我一个忙"的时候，\n先回答"我看看时间哈"。\n然后给自己10分钟考虑。\n10分钟之后如果还是不想帮，\n就发一句"实在不好意思，这次不太方便"。\n\n你不需要为这句话感到愧疚。\n你只是在做一件所有人都在做、\n但只有你一直不敢做的事。`,
          ],
          'shenghuo': [
            `你写了"${veryShort}"。\n\n你觉得什么都不想做，\n不是因为你懒，是因为你累了。\n\n但不是那种睡一觉就能好的累。\n是你扛了太久，\n把"活着"活成了"撑着"，\n力气都用来撑了，自然觉得什么都没劲。\n\n我想告诉你一件很重要的事：\n你不需要今天就有奔头。\n你不需要马上振作起来、\n不需要给自己打鸡血、\n不需要变得积极向上。\n\n你现在需要的，就是允许自己空着。\n空着不是浪费，是在回血。\n你一直在输出，从来没有给自己输入的时间。\n\n今天就做一件事：什么都不做。\n不是"偷懒"，是主动给自己放假。\n手机可以不看，消息可以不回，\n什么计划都可以放下。\n你值得什么都不做的一天。`,
            `你写了"${veryShort}"。\n\n谁规定每天都必须有"意义"？\n谁规定活着就必须有奔头、\n有目标、有激情？\n\n你现在的状态，\n可能不是出了问题，\n只是在两个阶段之间的空隙里。\n就像呼吸——\n你不可能一直吸气，\n中间得有呼气的时间。\n你现在就是在呼气。\n\n但你把呼气当成了"我快不行了"的信号。\n其实不是。\n你只是需要一段低能耗的时间，\n让你的系统恢复出厂设置。\n\n你不需要今天就找到人生方向。\n你甚至不需要明天就找到。\n空着就空着，\n就像手机没电了需要充电，\n你不会说手机在"浪费时间"对吧？\n\n今天就做一件事：\n出门走走，不带目的，不带耳机，\n就走走。\n看到什么看什么，\n走累了就回来。\n不用赋予它任何意义，\n散步就是散步。`,
            `你写了"${veryShort}"。\n\n你有没有发现，\n你已经很久没有"输入"了？\n\n你每天在看短视频、刷社交媒体、\n处理工作消息、回应别人的需求——\n这些全都是输出。\n即使你觉得自己在"放松"，\n其实你的大脑还是在被信息轰炸。\n那不叫休息，\n那叫换一种方式消耗自己。\n\n真正能让你恢复的"输入"是什么？\n是看一本跟工作无关的书，\n是去一个没去过的地方走走，\n是跟一个能让你笑的人聊聊天，\n是做一件完全无用但让你开心的事。\n\n你现在的"空"，\n不是因为你不热爱生活了，\n是因为你的账户被掏空了，\n你一直在支出，没有存入。\n\n还有一个区别你得搞清楚：\n"主动选择什么都不做"\n和"想做什么但提不起劲什么都不做了"\n是两回事。\n前者是享受，后者是麻木。\n你现在是后者。\n\n今天做一件事：\n找一部你一直想看但没看的电影，\n准备好零食和饮料，\n把灯关了，安安静静地看完。\n不是边看边刷手机那种看完，\n是真正地、完整地看完。\n\n两个小时之后，\n看看你心里有没有一点点不一样的感觉。`,
          ],
        };

        const pillTemplates = templates[pill.id] || [];
        if (pillTemplates.length > 0) {
          return pillTemplates[Math.floor(Math.random() * pillTemplates.length)];
        }
        return pill.decree;
      }

      function generateSuiyuanDecree(excerpt) {
        return `你写了"${excerpt}"。\n\n我没办法从这几句话里精准判断你正在经历什么，\n但你能把它写出来，这件事本身就不简单。\n大多数人连面对自己的真实感受都不敢，\n你至少做到了。\n\n我不打算给你灌鸡汤，\n因为鸡汤解决不了具体问题。\n\n我只说一个事实：\n你今天来这里，把心里的话倒了出来，\n这已经是你在自救了。\n能被说出来的苦，已经消了一半。\n\n至于剩下的那一半，\n时间会处理。\n你不需要现在就想明白所有事。\n先去喝杯水，然后做一件今天本来就要做的小事。\n行动会帮你找到节奏。`;
      }

      /* ============================================================
         AI Integration — SiliconFlow Free Tier
         ============================================================ */
      const AI_CONFIG_KEY = 'alchemy_ai_config';
      let aiConfig = JSON.parse(localStorage.getItem(AI_CONFIG_KEY) || 'null') || {
        apiUrl: 'https://api.siliconflow.cn/v1/chat/completions',
        apiKey: '',
        model: 'deepseek-ai/DeepSeek-V3'
      };
      let aiAvailable = false;
      let aiReplyText = null;
      let aiFetching = false;

      const SYSTEM_PROMPT = `你是一个说话直白、一针见血的心理咨询师。你的风格：
- 像朋友平辈交流，不用敬语，不用文言文，不用"老夫""阁下"等称呼
- 每段回复必须有一句"一语点醒梦中人"的话，让读者有被击中的感觉
- 绝对不说废话、不说鸡汤、不灌心灵鸡汤
- 结尾必须给一个用户当下就能做的具体动作
- 回复长度300-500字
- 用现代中文口语，自然流畅，像微信聊天
- 不要用任何炼丹/丹药/中药相关的比喻，那是界面的事，你只负责内容
- 直接回应用户写的内容，引用他们的话，指出他们的问题模式
- 如果用户写了具体的事，针对具体的事给建议，不要泛泛而谈`;

      async function fetchAIReply(userText) {
        if (!aiConfig.apiKey) {
          console.warn('[AI] No API key configured');
          return null;
        }
        aiFetching = true;
        try {
          const resp = await fetch(aiConfig.apiUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${aiConfig.apiKey}`
            },
            body: JSON.stringify({
              model: aiConfig.model,
              messages: [
                { role: 'system', content: SYSTEM_PROMPT },
                { role: 'user', content: userText }
              ],
              max_tokens: 1024,
              temperature: 0.8
            })
          });
          if (!resp.ok) {
            const errText = await resp.text();
            throw new Error(`HTTP ${resp.status}: ${errText}`);
          }
          const data = await resp.json();
          const reply = data.choices?.[0]?.message?.content;
          if (reply) {
            aiReplyText = reply;
            aiAvailable = true;
            return reply;
          }
          throw new Error('Empty reply from AI');
        } catch (e) {
          console.warn('[AI] Fetch failed, using local fallback:', e.message);
          aiAvailable = false;
          aiReplyText = null;
          return null;
        } finally {
          aiFetching = false;
        }
      }

      async function checkAIHealth() {
        if (!aiConfig.apiKey) {
          aiAvailable = false;
          return;
        }
        try {
          const resp = await fetch(aiConfig.apiUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${aiConfig.apiKey}`
            },
            body: JSON.stringify({
              model: aiConfig.model,
              messages: [
                { role: 'user', content: 'hi' }
              ],
              max_tokens: 5
            })
          });
          aiAvailable = resp.ok;
        } catch {
          aiAvailable = false;
        }
      }

      /* ============================================================
         Ingredient border colors (alternating)
         ============================================================ */
      const INGREDIENT_BORDER_COLORS = [
        'var(--color-primary)',     // gold
        'var(--state-success)',     // teal-green
        'var(--state-error)',       // red
        'var(--color-border-strong)', // muted gold
        'var(--color-text-muted)',  // dim
      ];

      /* ============================================================
         Rendering
         ============================================================ */
      let currentPill = null;
      let currentUserInput = '最近工作压力很大，感觉自己什么都做不好';
      let currentPillIndex = 0;

      function renderPill(pill, userInput) {
        currentPill = pill;

        // Update CSS custom properties for pill colors
        const root = document.documentElement;
        root.style.setProperty('--pill-color-1', pill.color1);
        root.style.setProperty('--pill-color-2', pill.color2);
        root.style.setProperty('--pill-glow', pill.glow);

        // Update halo opacities for visual variety
        const outerHalo = document.querySelector('.pill-halo--outer');
        const innerHalo = document.querySelector('.pill-halo--inner');
        innerHalo.style.borderColor = pill.glow;
        outerHalo.style.borderColor = pill.glow.replace(/[\d.]+\)$/, '0.2)');

        // Pill name
        document.getElementById('pillName').textContent = pill.name;

        // Decree is rendered separately — call renderDecreeContent() after
        // Seal stamp
        document.getElementById('sealStamp').innerHTML =
          `<span class="seal-stamp__char">${pill.seal}</span>`;

        // Ingredients
        const ingredientList = document.getElementById('ingredientList');
        ingredientList.innerHTML = '';
        pill.ingredients.forEach((ing, i) => {
          const borderColor = INGREDIENT_BORDER_COLORS[i % INGREDIENT_BORDER_COLORS.length];
          const item = document.createElement('div');
          item.className = 'ingredient-item';
          item.style.borderLeftColor = borderColor;
          // Compute faint background from border color token
          const bgColors = {
            'var(--color-primary)': 'rgba(212,168,83,0.03)',
            'var(--state-success)': 'rgba(74,158,142,0.03)',
            'var(--state-error)': 'rgba(196,30,58,0.03)',
            'var(--color-border-strong)': 'rgba(212,168,83,0.02)',
            'var(--color-text-muted)': 'rgba(90,88,106,0.03)',
          };
          item.style.background = bgColors[borderColor] || 'transparent';
          item.innerHTML = `
            <span class="ingredient-amount">${ing.amount}</span>
            <span class="ingredient-name">${ing.name}</span>
          `;
          ingredientList.appendChild(item);
        });
      }

      /* ============================================================
         Decree rendering helpers (loading / badge / content)
         ============================================================ */
      function showDecreeLoading() {
        const decreeBody = document.getElementById('decreeBody');
        const badge = document.getElementById('decreeSourceBadge');
        decreeBody.innerHTML = '<div class="decree-loading">正在炼制<span class="decree-loading__dots"></span></div>';
        badge.style.display = 'none';
      }

      function renderDecreeContent(text, source) {
        const decreeBody = document.getElementById('decreeBody');
        const badge = document.getElementById('decreeSourceBadge');
        decreeBody.innerHTML = '';

        const paragraphs = text.split('\n').filter(p => p.trim() !== '');
        paragraphs.forEach((t, i) => {
          const p = document.createElement('p');
          p.className = 'decree-paragraph';
          p.textContent = t;
          p.style.animationDelay = `${i * 0.2}s`;
          decreeBody.appendChild(p);
        });

        // Show source badge
        badge.style.display = 'inline-block';
        if (source === 'ai') {
          badge.textContent = 'AI 生成';
          badge.className = 'decree-source-badge decree-source-badge--ai';
        } else {
          badge.textContent = '本地丹方';
          badge.className = 'decree-source-badge decree-source-badge--local';
        }
      }

      /* ============================================================
         Button handlers
         ============================================================ */
      document.getElementById('btnRefineAgain').addEventListener('click', () => {
        // Navigate back to input page
        window.location.href = 'input.html';
      });

      document.getElementById('btnAnotherPill').addEventListener('click', async () => {
        // Cycle to another pill
        currentPillIndex = (currentPillIndex + 1) % PILL_DB.length;
        const nextPill = PILL_DB[currentPillIndex];
        renderPill(nextPill, currentUserInput);
        showDecreeLoading();
        // Scroll to top smoothly
        window.scrollTo({ top: 0, behavior: 'smooth' });
        // Try AI for the new pill
        const aiReply = await fetchAIReply(currentUserInput);
        if (aiReply) {
          renderDecreeContent(aiReply, 'ai');
        } else {
          renderDecreeContent(generateDecree(nextPill, currentUserInput), 'local');
        }
      });

      /* ============================================================
         AI Settings Panel Logic
         ============================================================ */
      (function initAISettings() {
        const overlay = document.getElementById('aiSettingsOverlay');
        const gearBtn = document.getElementById('aiSettingsBtn');
        const closeBtn = document.getElementById('aiSettingsClose');
        const apiKeyInput = document.getElementById('aiApiKeyInput');
        const modelSelect = document.getElementById('aiModelSelect');
        const apiUrlInput = document.getElementById('aiApiUrlInput');
        const saveBtn = document.getElementById('aiSaveBtn');
        const testBtn = document.getElementById('aiTestBtn');
        const msgEl = document.getElementById('aiSettingsMsg');

        function showMsg(text, type) {
          msgEl.textContent = text;
          msgEl.style.display = 'block';
          msgEl.className = 'ai-settings-msg ai-settings-msg--' + type;
          setTimeout(() => { msgEl.style.display = 'none'; }, 3000);
        }

        function populateFields() {
          apiKeyInput.value = aiConfig.apiKey || '';
          modelSelect.value = aiConfig.model || 'deepseek-ai/DeepSeek-V3';
          apiUrlInput.value = aiConfig.apiUrl || 'https://api.siliconflow.cn/v1/chat/completions';
        }

        gearBtn.addEventListener('click', () => {
          populateFields();
          overlay.style.display = 'flex';
        });
        closeBtn.addEventListener('click', () => {
          overlay.style.display = 'none';
        });
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) overlay.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
          aiConfig.apiKey = apiKeyInput.value.trim();
          aiConfig.model = modelSelect.value;
          aiConfig.apiUrl = apiUrlInput.value.trim() || 'https://api.siliconflow.cn/v1/chat/completions';
          localStorage.setItem(AI_CONFIG_KEY, JSON.stringify(aiConfig));
          showMsg('已保存', 'success');
        });

        testBtn.addEventListener('click', async () => {
          const key = apiKeyInput.value.trim();
          if (!key) {
            showMsg('请先填写 API Key', 'error');
            return;
          }
          testBtn.disabled = true;
          testBtn.textContent = '测试中...';
          try {
            const url = apiUrlInput.value.trim() || 'https://api.siliconflow.cn/v1/chat/completions';
            const model = modelSelect.value;
            const resp = await fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${key}`
              },
              body: JSON.stringify({
                model: model,
                messages: [{ role: 'user', content: 'hi' }],
                max_tokens: 5
              })
            });
            if (resp.ok) {
              showMsg('连接成功', 'success');
            } else {
              const errText = await resp.text();
              showMsg('连接失败: HTTP ' + resp.status, 'error');
            }
          } catch (e) {
            showMsg('网络错误: ' + e.message, 'error');
          } finally {
            testBtn.disabled = false;
            testBtn.textContent = '测试连接';
          }
        });
      })();

      /* ============================================================
         Initialize on page load — AI first, local fallback
         ============================================================ */
      (async function init() {
        // Read user input from localStorage
        const savedInput = localStorage.getItem('alchemy_user_input');
        currentUserInput = savedInput && savedInput.trim().length > 0
          ? savedInput.trim()
          : '最近工作压力很大，感觉自己什么都做不好';

        const matchedPill = matchPill(currentUserInput);
        currentPillIndex = PILL_DB.findIndex(p => p.id === matchedPill.id);

        // Render pill visuals (name, colors, ingredients, seal) — decree is empty
        renderPill(matchedPill, currentUserInput);

        // Show loading state in decree area
        showDecreeLoading();

        // Try AI first
        const aiReply = await fetchAIReply(currentUserInput);
        if (aiReply) {
          renderDecreeContent(aiReply, 'ai');
        } else {
          // Fallback to local template
          const decreeText = generateDecree(matchedPill, currentUserInput);
          renderDecreeContent(decreeText, 'local');
        }
      })();
    </script>
