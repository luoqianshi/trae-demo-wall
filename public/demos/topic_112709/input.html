<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700;900&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    <title>投药入炉</title>
    <style id="theme-vars">
/* ============================================================
   AI炼丹炉 — Brand Design System
   Retro-futuristic Alchemy · Immersive Dark Theme
   Tone: retro-futuristic / emotional wellness / cyberpunk guofeng
   ============================================================ */

:root {
  /* ── Surface Elevation (Material Dark compliant) ── */
  --color-background:        #0d0d14;
  --color-surface:           #14142a;
  --color-surface-raised:    #1c1c38;
  --color-surface-overlay:   #24243e;

  /* ── Primary Hue: Amber-Gold (Alchemy Fire) ── */
  --color-primary:           #d4a853;
  --color-primary-dim:       #8b7536;
  --color-primary-bright:    #ffd700;
  --color-primary-glow:      rgba(212, 168, 83, 0.12);

  /* ── Text ── */
  --color-text-primary:      #e8e6f0;
  --color-text-secondary:    #9896a8;
  --color-text-muted:        #5a586a;

  /* ── Borders ── */
  --color-border:            rgba(212, 168, 83, 0.1);
  --color-border-strong:     rgba(212, 168, 83, 0.22);

  /* ── Semantic State Colors ── */
  --state-success:           #4a9e8e;
  --state-warning:           #d4a853;
  --state-error:             #c41e3a;
  --state-info:              #00c9a7;

  /* ── Typography ── */
  --font-display:            'Noto Serif SC', 'STKaiti', 'KaiTi', serif;
  --font-body:               'Noto Sans SC', sans-serif;
  --font-mono:               'Source Code Pro', monospace;

  /* ── Spacing ── */
  --space-xs:   4px;
  --space-sm:   8px;
  --space-md:   16px;
  --space-lg:   24px;
  --space-xl:   40px;
  --space-2xl:  64px;
  --space-3xl:  100px;

  /* ── Radius ── */
  --radius-sm:  2px;
  --radius-md:  8px;
  --radius-lg:  12px;
  --radius-full: 9999px;

  /* ── Motion ── */
  --ease:  cubic-bezier(0.16, 1, 0.3, 1);
  --duration-fast:   150ms;
  --duration-normal: 300ms;
  --duration-slow:   600ms;
}
    </style>

    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-body);">

    <!-- Background layer -->
    <div style="position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;">
      <!-- Warm amber glow blob (top-center) -->
      <div style="position:absolute;top:-15%;left:50%;transform:translateX(-50%);width:600px;height:500px;background:radial-gradient(circle,rgba(212,168,83,0.07) 0%,transparent 70%);"></div>
      <!-- Soft rose/cinnabar glow (right side) -->
      <div style="position:absolute;top:20%;right:-10%;width:450px;height:450px;background:radial-gradient(circle,rgba(196,30,58,0.04) 0%,transparent 70%);"></div>
      <!-- Muted bottom glow -->
      <div style="position:absolute;bottom:-10%;left:20%;width:500px;height:400px;background:radial-gradient(circle,rgba(139,117,54,0.04) 0%,transparent 70%);"></div>
      <!-- Particle canvas -->
      <canvas id="particle-canvas" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
      <!-- SVG noise overlay -->
      <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:0.03;">
        <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter>
        <rect width="100%" height="100%" filter="url(#noise)"/>
      </svg>
    </div>

    <main style="position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:var(--space-xl) var(--space-md);">

      <!-- Back link (top-left) -->
      <a href="#" data-dom-id="back-to-hero" style="position:absolute;top:var(--space-lg);left:var(--space-lg);color:var(--color-text-muted);text-decoration:none;font-family:var(--font-body);font-size:0.875rem;min-height:44px;min-width:44px;display:flex;align-items:center;transition:color var(--duration-fast) var(--ease);touch-action:manipulation;-webkit-tap-highlight-color:transparent;" onmouseover="this.style.color='var(--color-text-secondary)'" onmouseout="this.style.color='var(--color-text-muted)'">&larr; &nbsp;返回</a>

      <!-- Small cauldron SVG -->
      <div class="input-cauldron-wrap" style="margin-top:60px;margin-bottom:var(--space-xl);animation:cauldron-breathe 5s ease-in-out infinite;">
        <svg width="160" height="140" viewBox="0 0 200 175" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="炼丹炉" role="img" style="width:100%;height:auto;">
          <defs>
            <radialGradient id="cauldron-glow" cx="50%" cy="55%" r="50%">
              <stop offset="0%" stop-color="rgba(212,168,83,0.18)"/>
              <stop offset="100%" stop-color="rgba(212,168,83,0)"/>
            </radialGradient>
            <linearGradient id="cauldron-body" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="rgba(212,168,83,0.35)"/>
              <stop offset="100%" stop-color="rgba(139,117,54,0.18)"/>
            </linearGradient>
          </defs>
          <!-- Ambient glow -->
          <ellipse cx="100" cy="95" rx="95" ry="70" fill="url(#cauldron-glow)"/>
          <!-- Cauldron body -->
          <path d="M40 60 Q35 110, 55 140 L145 140 Q165 110, 160 60 Z" stroke="rgba(212,168,83,0.5)" stroke-width="1.5" fill="url(#cauldron-body)"/>
          <!-- Rim -->
          <ellipse cx="100" cy="60" rx="62" ry="12" stroke="rgba(212,168,83,0.6)" stroke-width="1.5" fill="rgba(212,168,83,0.08)"/>
          <!-- Legs -->
          <line x1="62" y1="140" x2="55" y2="165" stroke="rgba(212,168,83,0.4)" stroke-width="2" stroke-linecap="round"/>
          <line x1="100" y1="142" x2="100" y2="168" stroke="rgba(212,168,83,0.4)" stroke-width="2" stroke-linecap="round"/>
          <line x1="138" y1="140" x2="145" y2="165" stroke="rgba(212,168,83,0.4)" stroke-width="2" stroke-linecap="round"/>
          <!-- Fire glow inside -->
          <ellipse cx="100" cy="75" rx="40" ry="8" fill="rgba(212,168,83,0.12)"/>
          <!-- Steam wisps -->
          <path d="M82 50 Q78 35, 84 22" stroke="rgba(212,168,83,0.15)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
            <animate attributeName="d" values="M82 50 Q78 35, 84 22;M82 50 Q86 35, 80 18;M82 50 Q78 35, 84 22" dur="4s" repeatCount="indefinite"/>
          </path>
          <path d="M100 48 Q96 30, 102 15" stroke="rgba(212,168,83,0.12)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5">
            <animate attributeName="d" values="M100 48 Q96 30, 102 15;M100 48 Q104 30, 98 12;M100 48 Q96 30, 102 15" dur="5s" repeatCount="indefinite"/>
          </path>
          <path d="M118 50 Q122 36, 116 24" stroke="rgba(212,168,83,0.1)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4">
            <animate attributeName="d" values="M118 50 Q122 36, 116 24;M118 50 Q114 36, 120 20;M118 50 Q122 36, 116 24" dur="4.5s" repeatCount="indefinite"/>
          </path>
        </svg>
      </div>

      <!-- Title -->
      <h1 style="font-family:var(--font-display);font-size:clamp(2rem,4vw,2.6rem);color:var(--color-primary);text-shadow:0 0 40px rgba(212,168,83,0.25);text-align:center;margin:0 0 var(--space-sm);text-wrap:balance;word-break:keep-all;line-height:1.2;">投药入炉</h1>

      <!-- English subtitle -->
      <p style="font-family:var(--font-mono);font-size:0.75rem;color:var(--color-text-muted);letter-spacing:0.4em;text-align:center;margin:0 0 var(--space-lg);text-transform:uppercase;">Feed the Cauldron</p>

      <!-- Empathetic micro-copy -->
      <p style="font-family:var(--font-display);font-size:clamp(0.95rem,1.5vw,1.1rem);color:var(--color-text-secondary);text-align:center;margin:0 0 var(--space-2xl);font-style:italic;line-height:2.0;max-width:480px;">你的心事，便是药引</p>

      <!-- Emotion chips row -->
      <div class="emotion-chips-row" style="display:flex;gap:var(--space-sm);flex-wrap:nowrap;overflow-x:auto;padding:var(--space-sm) var(--space-md);margin-bottom:var(--space-xl);max-width:640px;width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none;" class="no-scrollbar">
        <button class="emotion-chip" data-prompt="最近总是静不下心来，对未来充满不确定，心里像压着一块石头，喘不过气。">焦虑</button>
        <button class="emotion-chip" data-prompt="站在十字路口，看不清前方的路，不知道自己到底想要什么，也不知道该往哪里走。">迷茫</button>
        <button class="emotion-chip" data-prompt="有一件事一直放不下，反复回想，明知没有意义，却怎么也走不出来。">放不下</button>
        <button class="emotion-chip" data-prompt="太累了，不是因为做了很多事，而是心里的疲惫，怎么休息都缓不过来。">累了</button>
        <button class="emotion-chip" data-prompt="身边人来人往，却没有一个能真正懂我的人，好像一座孤岛。">孤独</button>
        <button class="emotion-chip" data-prompt="心里有火，说不出为什么，可能是被误解了，也可能是不公平，压在胸口。">生气</button>
        <button class="emotion-chip" data-prompt="总觉得自己不够好，和别人比起来差很多，不敢面对真实的自己。">自卑</button>
        <button class="emotion-chip" data-prompt="夜晚总是翻来覆去睡不着，脑子停不下来，天亮了又困得不想动。">失眠</button>
      </div>

      <!-- Textarea (glassmorphism panel) -->
      <div id="textarea-container" style="max-width:540px;width:100%;background:rgba(20,20,42,0.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--color-border);border-radius:var(--radius-md);transition:border-color var(--duration-normal) var(--ease),box-shadow var(--duration-normal) var(--ease);">
        <textarea id="emotion-input" maxlength="500" placeholder="写下你的心事……" style="width:100%;min-height:160px;background:transparent;border:none;color:var(--color-text-primary);font-family:var(--font-display);font-size:clamp(1rem,1.2vw,1.05rem);line-height:2.0;resize:none;outline:none;padding:var(--space-lg);display:block;"></textarea>
        <div style="padding:0 var(--space-lg) var(--space-md);display:flex;justify-content:flex-end;">
          <span id="char-counter" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--color-text-muted);">0 / 500</span>
        </div>
      </div>

      <!-- CTA button -->
      <button id="cta-feed" data-dom-id="btn-feed" disabled class="cta-feed-btn">投药入炉</button>

    </main>

    <!-- Forging / 炼制 transition overlay -->
    <div id="forging-overlay" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--color-background);flex-direction:column;align-items:center;justify-content:center;">
      <div class="forging-content">
        <div class="forging-cauldron">
          <svg width="120" height="110" viewBox="0 0 160 145" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="炼丹炉" role="img">
            <defs>
              <linearGradient id="fg-body" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="rgba(212,168,83,0.7)"/>
                <stop offset="100%" stop-color="rgba(139,117,54,0.4)"/>
              </linearGradient>
            </defs>
            <!-- Handles -->
            <path d="M32 55 Q18 55, 18 45 Q18 38, 28 40" stroke="rgba(212,168,83,0.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M128 55 Q142 55, 142 45 Q142 38, 132 40" stroke="rgba(212,168,83,0.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- Body -->
            <path d="M35 52 Q30 95, 48 120 L112 120 Q130 95, 125 52 Z" stroke="rgba(212,168,83,0.6)" stroke-width="1.5" fill="url(#fg-body)"/>
            <!-- Rim -->
            <ellipse cx="80" cy="52" rx="46" ry="9" stroke="rgba(212,168,83,0.7)" stroke-width="1.5" fill="rgba(212,168,83,0.12)"/>
            <!-- Inner glow -->
            <ellipse cx="80" cy="65" rx="30" ry="6" fill="rgba(255,215,0,0.15)"/>
            <!-- Legs -->
            <line x1="55" y1="120" x2="50" y2="140" stroke="rgba(212,168,83,0.45)" stroke-width="2" stroke-linecap="round"/>
            <line x1="80" y1="121" x2="80" y2="142" stroke="rgba(212,168,83,0.45)" stroke-width="2" stroke-linecap="round"/>
            <line x1="105" y1="120" x2="110" y2="140" stroke="rgba(212,168,83,0.45)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="forging-fire">
          <div class="fire-p" style="left:15%;animation-delay:0s;width:5px;height:5px;background:var(--color-primary-bright);"></div>
          <div class="fire-p" style="left:25%;animation-delay:0.3s;width:4px;height:4px;background:var(--color-primary);"></div>
          <div class="fire-p" style="left:35%;animation-delay:0.7s;width:6px;height:6px;background:var(--fire-orange);"></div>
          <div class="fire-p" style="left:45%;animation-delay:0.2s;width:5px;height:5px;background:var(--color-primary-bright);"></div>
          <div class="fire-p" style="left:55%;animation-delay:1.0s;width:4px;height:4px;background:var(--color-primary);"></div>
          <div class="fire-p" style="left:65%;animation-delay:0.5s;width:7px;height:7px;background:var(--fire-orange);"></div>
          <div class="fire-p" style="left:75%;animation-delay:0.8s;width:5px;height:5px;background:var(--color-primary-bright);"></div>
          <div class="fire-p" style="left:85%;animation-delay:1.5s;width:4px;height:4px;background:var(--color-primary);"></div>
          <div class="fire-p" style="left:40%;animation-delay:1.8s;width:6px;height:6px;background:var(--fire-orange);"></div>
          <div class="fire-p" style="left:58%;animation-delay:1.2s;width:5px;height:5px;background:var(--color-primary);"></div>
          <div class="fire-p" style="left:72%;animation-delay:2.0s;width:4px;height:4px;background:var(--color-primary-bright);"></div>
          <div class="fire-p" style="left:30%;animation-delay:1.6s;width:5px;height:5px;background:var(--color-primary);"></div>
        </div>
        <p class="forging-text" id="forgingText">药引入炉</p>
      </div>
    </div>

    <style>
      body { background: var(--color-background); }

      /* ── CTA button ── */
      .cta-feed-btn {
        margin-top: var(--space-xl);
        margin-bottom: var(--space-3xl);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(196,30,58,0.9), rgba(139,21,40,0.9));
        clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
        color: var(--color-text-primary);
        font-family: var(--font-mono);
        font-size: 1rem;
        letter-spacing: 0.2em;
        padding: 14px 48px;
        border: none;
        cursor: pointer;
        opacity: 0.4;
        white-space: nowrap;
        transition: opacity var(--duration-normal) var(--ease), transform var(--duration-fast) var(--ease);
        animation: btn-pulse 3s ease-in-out infinite;
      }
      .cta-feed-btn:not(:disabled) { opacity: 1; cursor: pointer; }
      .cta-feed-btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 0 20px rgba(196,30,58,0.3); }
      .cta-feed-btn:not(:disabled):active { transform: translateY(0); }

      /* ── Chip styles ── */
      .emotion-chip {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        border: 1px solid var(--color-border);
        background: transparent;
        padding: 8px 20px;
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--color-text-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition: border-color var(--duration-normal) var(--ease),
                    color var(--duration-normal) var(--ease),
                    background var(--duration-normal) var(--ease),
                    transform var(--duration-fast) var(--ease);
        animation: chip-float 5s ease-in-out infinite;
      }
      .emotion-chip:nth-child(1) { animation-delay: 0s; }
      .emotion-chip:nth-child(2) { animation-delay: 0.3s; }
      .emotion-chip:nth-child(3) { animation-delay: 0.6s; }
      .emotion-chip:nth-child(4) { animation-delay: 0.9s; }
      .emotion-chip:nth-child(5) { animation-delay: 1.2s; }
      .emotion-chip:nth-child(6) { animation-delay: 1.5s; }
      .emotion-chip:nth-child(7) { animation-delay: 1.8s; }
      .emotion-chip:nth-child(8) { animation-delay: 2.1s; }

      .emotion-chip:hover {
        border-color: var(--color-border-strong);
        color: var(--color-primary);
        background: var(--color-primary-glow);
        transform: translateY(-2px);
      }
      .emotion-chip:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }
      .emotion-chip:active {
        transform: translateY(0);
      }
      .emotion-chip.selected {
        background: var(--color-primary-glow);
        border-color: var(--color-primary);
        color: var(--color-primary);
      }

      /* ── Textarea focus ── */
      #textarea-container.focused {
        border-color: var(--color-border-strong);
        box-shadow: inset 0 0 30px rgba(212,168,83,0.03);
      }

      /* ── Button hover ── */
      #cta-feed:not(:disabled):hover {
        opacity: 1;
        transform: translateY(-1px);
        box-shadow: 0 4px 24px rgba(196,30,58,0.3);
      }
      #cta-feed:not(:disabled):active {
        transform: translateY(0);
      }
      #cta-feed:not(:disabled) {
        opacity: 1;
        animation: btn-pulse 3s ease-in-out infinite;
      }
      #cta-feed:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        animation: none;
      }
      #cta-feed:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      /* ── Forging overlay ── */
      .forging-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        animation: forging-fade-in 0.6s var(--ease) both;
      }
      .forging-cauldron {
        position: relative;
        animation: forge-glow 3s ease-in-out infinite;
      }
      .forging-fire {
        position: relative;
        width: 100px;
        height: 80px;
        margin-top: -30px;
      }
      .forging-fire { --fire-orange: #ff6b35; }
      .fire-p {
        position: absolute;
        bottom: 0;
        border-radius: 50%;
        animation: forge-rise 2s ease-out infinite;
        opacity: 0;
      }
      .forging-text {
        font-family: var(--font-display);
        color: var(--color-primary);
        font-size: 1.2rem;
        letter-spacing: 0.2em;
        text-align: center;
        margin-top: 24px;
        animation: forge-text-pulse 2s ease-in-out infinite;
      }

      @keyframes forging-fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes forge-rise {
        0%   { transform: translateY(0) scale(1); opacity: 0; }
        20%  { opacity: 0.9; }
        100% { transform: translateY(-80px) scale(0.3); opacity: 0; }
      }
      @keyframes forge-glow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(212,168,83,0.3)); }
        50%      { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(212,168,83,0.5)); }
      }
      @keyframes forge-text-pulse {
        0%, 100% { opacity: 0.6; }
        50%      { opacity: 1; }
      }

      @media (max-width: 640px) {
        .forging-cauldron svg { width: 80px; height: 73px; }
        .forging-fire { width: 70px; height: 56px; margin-top: -20px; }
        .fire-p:nth-child(n+7) { display: none; }
        .forging-text { font-size: 1rem; }
      }

      /* ── Keyframe animations ── */
      @keyframes chip-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes cauldron-breathe {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes btn-pulse {
        0%, 100% { box-shadow: 0 0 0 rgba(196,30,58,0); }
        50% { box-shadow: 0 0 20px rgba(196,30,58,0.15); }
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        .emotion-chip,
        [style*="cauldron-breathe"] {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
        #cta-feed {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      /* ── Responsive ── */
      @media (max-width: 768px) {
        .input-cauldron-wrap {
          width: 100px;
        }
        .emotion-chips-row {
          justify-content: flex-start !important;
        }
      }

      @media (max-width: 640px) {
        main {
          padding-top: var(--space-xl) !important;
        }
        .emotion-chip {
          padding: 6px 14px;
          font-size: 0.825rem;
        }
        #cta-feed {
          padding: 12px 36px;
          font-size: 0.9rem;
        }
      }

      @media (max-width: 480px) {
        .input-cauldron-wrap {
          width: 80px;
          margin-top: 40px !important;
          margin-bottom: var(--space-lg) !important;
        }
        h1[style] {
          font-size: clamp(1.6rem, 6vw, 2rem) !important;
        }
        #emotion-input {
          min-height: 120px !important;
          padding: var(--space-md) !important;
        }
        #cta-feed {
          width: 100%;
          padding: 12px 24px;
        }
      }

      /* Touch improvements */
      .emotion-chip,
      .cta-feed-btn {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
    </style>

    <script>
      /* ── JS: textarea logic ── */
      (function() {
        var textarea = document.getElementById('emotion-input');
        var counter = document.getElementById('char-counter');
        var container = document.getElementById('textarea-container');
        var btn = document.getElementById('cta-feed');
        var chips = document.querySelectorAll('.emotion-chip');

        function updateState() {
          var len = textarea.value.length;
          counter.textContent = len + ' / 500';
          if (len > 0) {
            btn.disabled = false;
          } else {
            btn.disabled = true;
          }
        }

        textarea.addEventListener('input', updateState);
        textarea.addEventListener('focus', function() {
          container.classList.add('focused');
        });
        textarea.addEventListener('blur', function() {
          container.classList.remove('focused');
        });

        /* Chip click → fill textarea */
        chips.forEach(function(chip) {
          chip.addEventListener('click', function() {
            chips.forEach(function(c) { c.classList.remove('selected'); });
            chip.classList.add('selected');
            textarea.value = chip.getAttribute('data-prompt') || '';
            updateState();
            textarea.focus();
          });
        });

        /* CTA button → save to localStorage, show forging animation, then navigate to result */
        btn.addEventListener('click', function() {
          var textareaValue = textarea.value.trim();
          if (!textareaValue) return;
          localStorage.setItem('alchemy_user_input', textareaValue);
          // Save selected emotion chip text if any
          var selectedChip = document.querySelector('.emotion-chip.selected');
          if (selectedChip) {
            localStorage.setItem('alchemy_selected_emotion', selectedChip.textContent);
          } else {
            localStorage.removeItem('alchemy_selected_emotion');
          }

          // Show forging overlay
          var overlay = document.getElementById('forging-overlay');
          var forgingText = document.getElementById('forgingText');
          overlay.style.display = 'flex';

          // Cycle through forging phases
          setTimeout(function() { forgingText.textContent = '文火慢煎'; }, 1000);
          setTimeout(function() { forgingText.textContent = '药性初现'; }, 2000);
          setTimeout(function() { forgingText.textContent = '丹成出炉'; }, 3000);
          setTimeout(function() { window.location.href = 'result.html'; }, 3500);
        });

        /* Ctrl+Enter → trigger CTA */
        textarea.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            if (!btn.disabled) {
              btn.click();
            }
          }
        });

        /* ── Canvas particle animation (warm tones, simpler) ── */
        var canvas = document.getElementById('particle-canvas');
        var ctx = canvas.getContext('2d');
        var particles = [];
        var PARTICLE_COUNT = 30;

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        function Particle() {
          this.reset();
          this.y = Math.random() * canvas.height;
        }
        Particle.prototype.reset = function() {
          this.x = Math.random() * canvas.width;
          this.y = canvas.height + 10;
          this.size = Math.random() * 2 + 0.5;
          this.speedY = -(Math.random() * 0.3 + 0.1);
          this.speedX = (Math.random() - 0.5) * 0.15;
          this.opacity = Math.random() * 0.4 + 0.1;
          this.hue = 35 + Math.random() * 20;
        };
        Particle.prototype.update = function() {
          this.y += this.speedY;
          this.x += this.speedX;
          this.opacity -= 0.0003;
          if (this.y < -10 || this.opacity <= 0) {
            this.reset();
          }
        };
        Particle.prototype.draw = function() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
          ctx.fillStyle = 'hsla(' + this.hue + ', 70%, 65%, ' + Math.max(0, this.opacity) + ')';
          ctx.fill();
        };

        for (var i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (var i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
          }
          requestAnimationFrame(animate);
        }

        var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (!prefersReduced.matches) {
          animate();
        }
      })();
    </script>
</body>
</html>
