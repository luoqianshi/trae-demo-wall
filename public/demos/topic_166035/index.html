<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>浮生局 - 八字命理人生模拟</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: 'STKaiti', 'KaiTi', '楷体', 'Songti SC', 'SimSun', serif;
  background: #f0ebe0;
  overflow: hidden;
  color: #1a1a1a;
}

#app {
  width: 100%;
  height: 100%;
  max-width: 750px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  background: #f5f0e6;
}

.page {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow-y: auto;
  display: none;
  z-index: 1;
}

.page.active {
  display: block;
}

/* ==================== 通用组件 ==================== */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 16px;
  background: rgba(245, 240, 230, 0.95);
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(26, 26, 26, 0.1);
}

.back-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 28px;
  color: #1a1a1a;
  font-weight: 300;
}

.header-title {
  font-size: 19px;
  font-weight: 500;
  color: #1a1a1a;
  letter-spacing: 6px;
}

.placeholder {
  width: 36px;
}

.container {
  padding: 20px 20px 80px;
}

.btn-primary {
  background: #1a1a1a;
  color: #f5f0e6;
  border: none;
  padding: 14px 32px;
  font-size: 16px;
  font-family: inherit;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary:hover {
  background: #333;
}

.btn-outline {
  background: transparent;
  color: #1a1a1a;
  border: 1px solid #1a1a1a;
  padding: 12px 28px;
  font-size: 15px;
  font-family: inherit;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-outline:hover {
  background: #1a1a1a;
  color: #f5f0e6;
}

/* ==================== 首页 ==================== */

.hero {
  text-align: center;
  padding: 80px 0 60px;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 2px;
  background: #1a1a1a;
  opacity: 0.3;
}

.main-title {
  font-size: 52px;
  font-weight: 300;
  color: #1a1a1a;
  letter-spacing: 20px;
  display: block;
  margin-bottom: 20px;
  padding-left: 20px;
}

.sub-title {
  font-size: 14px;
  color: #666;
  letter-spacing: 8px;
  display: block;
  margin-bottom: 60px;
}

.intro-text {
  font-size: 14px;
  color: #888;
  line-height: 2;
  max-width: 280px;
  margin: 0 auto 50px;
  letter-spacing: 2px;
}

.start-btn-wrap {
  text-align: center;
}

/* ==================== 八字输入页 ==================== */

.form-group {
  margin-bottom: 28px;
}

.form-label {
  display: block;
  font-size: 14px;
  color: #1a1a1a;
  margin-bottom: 10px;
  letter-spacing: 3px;
}

.form-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid rgba(26, 26, 26, 0.2);
  background: rgba(255, 255, 255, 0.5);
  font-size: 16px;
  font-family: inherit;
  color: #1a1a1a;
  outline: none;
  transition: border-color 0.3s;
}

.form-input:focus {
  border-color: #1a1a1a;
}

.gender-selector {
  display: flex;
  gap: 12px;
}

.lunar-input-row {
  display: flex;
  gap: 8px;
}

.lunar-select {
  flex: 1;
  padding: 10px 8px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='%231a1a1a'%3e%3cpath d='M6 8L0 0h12z'/%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 10px center;
  background-size: 10px;
  padding-right: 28px;
}

.lunar-leap-row {
  margin-top: 10px;
  font-size: 14px;
  color: #1a1a1a;
}

.lunar-leap-label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.lunar-preview {
  margin-top: 10px;
  padding: 8px 12px;
  font-size: 13px;
  color: rgba(26, 26, 26, 0.6);
  background: rgba(26, 26, 26, 0.04);
  border-left: 2px solid rgba(26, 26, 26, 0.3);
}

.gender-option {
  flex: 1;
  padding: 12px;
  text-align: center;
  border: 1px solid rgba(26, 26, 26, 0.2);
  background: rgba(255, 255, 255, 0.3);
  cursor: pointer;
  font-size: 15px;
  letter-spacing: 4px;
  transition: all 0.3s;
}

.gender-option.active {
  background: #1a1a1a;
  color: #f5f0e6;
  border-color: #1a1a1a;
}

.calc-btn-wrap {
  text-align: center;
  margin-top: 40px;
}

/* ==================== 八字结果页 ==================== */

.bazi-card {
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(26, 26, 26, 0.1);
  padding: 24px;
  margin-bottom: 24px;
}

.bazi-name {
  text-align: center;
  font-size: 20px;
  letter-spacing: 6px;
  margin-bottom: 20px;
  color: #1a1a1a;
}

.bazi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.bazi-column {
  text-align: center;
}

.bazi-col-title {
  font-size: 12px;
  color: #999;
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.bazi-gan {
  font-size: 24px;
  font-weight: 500;
  color: #1a1a1a;
  padding: 8px 0;
  border-bottom: 1px solid rgba(26, 26, 26, 0.1);
}

.bazi-zhi {
  font-size: 24px;
  font-weight: 500;
  color: #1a1a1a;
  padding: 8px 0;
}

.day-master-info {
  text-align: center;
  padding: 16px 0;
  border-top: 1px solid rgba(26, 26, 26, 0.1);
  margin-top: 8px;
}

.day-master-label {
  font-size: 13px;
  color: #888;
  letter-spacing: 2px;
}

.day-master-value {
  font-size: 18px;
  color: #1a1a1a;
  margin-top: 4px;
  letter-spacing: 3px;
}

.section-title {
  font-size: 16px;
  letter-spacing: 4px;
  color: #1a1a1a;
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 3px solid #1a1a1a;
}

.wuxing-bars {
  margin-bottom: 16px;
}

.wuxing-item {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  gap: 10px;
}

.wuxing-name {
  width: 30px;
  font-size: 14px;
  color: #1a1a1a;
  letter-spacing: 2px;
}

.wuxing-bar {
  flex: 1;
  height: 8px;
  background: rgba(26, 26, 26, 0.1);
  position: relative;
}

.wuxing-fill {
  height: 100%;
  background: #1a1a1a;
  transition: width 0.5s ease;
}

.wuxing-value {
  width: 40px;
  text-align: right;
  font-size: 13px;
  color: #666;
}

.wuxing-desc {
  font-size: 13px;
  color: #666;
  text-align: center;
  padding: 12px 0;
  letter-spacing: 2px;
  line-height: 1.8;
}

.events-section {
  margin-top: 32px;
}

.events-list {
  margin-bottom: 16px;
}

.event-item {
  display: flex;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid rgba(26, 26, 26, 0.08);
}

.event-item.completed {
  opacity: 0.6;
}

.event-age {
  flex-shrink: 0;
  text-align: center;
  width: 50px;
}

.event-age .age-number {
  font-size: 22px;
  font-weight: 500;
  color: #1a1a1a;
  display: block;
}

.event-age .age-unit {
  font-size: 12px;
  color: #999;
}

.event-content {
  flex: 1;
}

.event-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.event-category {
  font-size: 12px;
  color: #666;
  letter-spacing: 2px;
}

.event-accuracy {
  font-size: 11px;
  padding: 2px 6px;
  border: 1px solid rgba(26, 26, 26, 0.2);
  color: #888;
}

.event-accuracy.high {
  border-color: #8b0000;
  color: #8b0000;
}

.event-desc {
  font-size: 14px;
  color: #1a1a1a;
  line-height: 1.6;
}

.more-btn {
  width: 100%;
  padding: 12px;
  text-align: center;
  border: 1px solid rgba(26, 26, 26, 0.2);
  background: transparent;
  color: #666;
  font-size: 13px;
  font-family: inherit;
  letter-spacing: 3px;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.3s;
}

.more-btn:hover {
  border-color: #1a1a1a;
  color: #1a1a1a;
}

.action-buttons {
  display: flex;
  gap: 12px;
  margin-top: 28px;
}

.action-buttons .btn-primary,
.action-buttons .btn-outline {
  flex: 1;
}

/* ==================== 对话补充页 ==================== */

.dialogue-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.chat-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
}

.chat-item {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.chat-item.system {
  justify-content: flex-start;
}

.chat-item.user {
  justify-content: flex-end;
}

.chat-item .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #1a1a1a;
  color: #f5f0e6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  letter-spacing: 1px;
  flex-shrink: 0;
}

.chat-item .bubble {
  max-width: 70%;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(26, 26, 26, 0.1);
  font-size: 14px;
  line-height: 1.7;
  color: #1a1a1a;
}

.chat-item.user .bubble {
  background: #1a1a1a;
  color: #f5f0e6;
  border-color: #1a1a1a;
}

.chat-input-area {
  padding: 16px;
  background: rgba(245, 240, 230, 0.95);
  border-top: 1px solid rgba(26, 26, 26, 0.1);
}

.question-text {
  font-size: 14px;
  color: #1a1a1a;
  margin-bottom: 12px;
  line-height: 1.6;
}

.options-area {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.option-item {
  padding: 12px 16px;
  border: 1px solid rgba(26, 26, 26, 0.2);
  background: rgba(255, 255, 255, 0.5);
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  color: #1a1a1a;
  text-align: left;
  transition: all 0.3s;
}

.option-item:hover {
  border-color: #1a1a1a;
  background: rgba(26, 26, 26, 0.05);
}

.input-area {
  display: flex;
  gap: 10px;
}

.dialogue-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid rgba(26, 26, 26, 0.2);
  background: rgba(255, 255, 255, 0.7);
  font-size: 14px;
  font-family: inherit;
  color: #1a1a1a;
  outline: none;
}

.send-btn {
  padding: 10px 20px;
  background: #1a1a1a;
  color: #f5f0e6;
  border: none;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 2px;
  cursor: pointer;
}

.summary-card {
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(26, 26, 26, 0.1);
  padding: 20px;
  margin: 20px 16px;
}

.summary-title {
  font-size: 16px;
  letter-spacing: 4px;
  margin-bottom: 16px;
  text-align: center;
}

.summary-item {
  font-size: 14px;
  color: #1a1a1a;
  padding: 8px 0;
  border-bottom: 1px solid rgba(26, 26, 26, 0.06);
  line-height: 1.6;
}

.summary-item:last-child {
  border-bottom: none;
}

/* ==================== 人生模拟页 ==================== */

.life-page {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
}

.life-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 16px;
  background: linear-gradient(to bottom, rgba(245, 240, 230, 0.9), rgba(245, 240, 230, 0));
}

.life-header .back-btn,
.life-header .header-title,
.life-header .placeholder {
  position: relative;
  z-index: 1;
}

.current-age-display {
  position: absolute;
  top: 60px;
  right: 20px;
  z-index: 15;
  text-align: right;
}

.current-age-display .age-num {
  font-size: 42px;
  font-weight: 300;
  color: #1a1a1a;
  opacity: 0.15;
  letter-spacing: 2px;
}

.current-age-display .age-text {
  font-size: 12px;
  color: #999;
  letter-spacing: 3px;
  margin-top: -5px;
}

/* 场景容器 */
.scene-container {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
}

.path-wrapper {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 200%;
  transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
}

.path-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* 节点容器 */
.nodes-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 8;
  pointer-events: none;
}

.nodes-container .life-node {
  position: absolute;
  pointer-events: auto;
  transform: translate(-50%, -50%);
  cursor: default;
}

.nodes-container .life-node.current {
  cursor: pointer;
}

/* 人物 */
.figure-container {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  pointer-events: none;
}

/* 节点 */
.node {
  position: absolute;
  cursor: pointer;
  z-index: 5;
  transform: translate(-50%, -50%);
}

.node-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #1a1a1a;
  border: 2px solid #f5f0e6;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  transition: all 0.4s ease;
  position: relative;
}

.node.future .node-dot {
  background: #f5f0e6;
  border-color: #888;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.node.current .node-dot {
  width: 26px;
  height: 26px;
  background: #8b0000;
  border-color: #f5f0e6;
  animation: nodePulse 2s infinite;
}

@keyframes nodePulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(139, 0, 0, 0.6);
  }
  50% {
    box-shadow: 0 0 0 12px rgba(139, 0, 0, 0);
  }
}

.node-age-tag {
  position: absolute;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: #1a1a1a;
  opacity: 0;
  white-space: nowrap;
  transition: opacity 0.3s;
  background: rgba(245, 240, 230, 0.9);
  padding: 2px 6px;
}

.node:hover .node-age-tag {
  opacity: 0.8;
}

/* 当前节点的选择面板 */
.choice-panel {
  position: absolute;
  left: 50%;
  top: 15%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 320px;
  z-index: 25;
  background: rgba(245, 240, 230, 0.98);
  border: 1px solid rgba(26, 26, 26, 0.2);
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.5s ease;
}

.choice-panel.active {
  opacity: 1;
  pointer-events: auto;
  top: 12%;
}

.choice-panel::before {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 10px solid rgba(26, 26, 26, 0.2);
}

.choice-panel::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-top: 9px solid rgba(245, 240, 230, 0.98);
}

.choice-age {
  font-size: 12px;
  color: #8b0000;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.choice-category {
  font-size: 13px;
  color: #666;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.choice-desc {
  font-size: 14px;
  color: #1a1a1a;
  line-height: 1.8;
  margin-bottom: 16px;
}

.choice-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.choice-option {
  padding: 12px 14px;
  border: 1px solid rgba(26, 26, 26, 0.2);
  background: rgba(255, 255, 255, 0.5);
  cursor: pointer;
  transition: all 0.3s;
}

.choice-option:hover {
  border-color: #1a1a1a;
  background: rgba(26, 26, 26, 0.05);
}

.choice-option.selected {
  border-color: #8b0000;
  background: rgba(139, 0, 0, 0.05);
}

.choice-option .opt-text {
  font-size: 14px;
  color: #1a1a1a;
  display: block;
  margin-bottom: 4px;
}

.choice-option .opt-impact {
  font-size: 12px;
  color: #888;
}

.choice-option.selected .opt-text {
  color: #8b0000;
}

.confirm-choice-btn {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  background: #1a1a1a;
  color: #f5f0e6;
  border: none;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.3s;
}

.confirm-choice-btn:hover {
  background: #333;
}

/* 底部提示 */
.life-hint {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: #999;
  letter-spacing: 3px;
  z-index: 15;
  text-align: center;
}

/* ==================== 水墨装饰 ==================== */

.ink-splatter {
  position: absolute;
  opacity: 0.05;
  pointer-events: none;
}

/* 滚动条样式 */
::-webkit-scrollbar {
  width: 4px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(26, 26, 26, 0.2);
}
</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <div id="page-home" class="page active">
    <div class="hero">
      <span class="main-title">浮生局</span>
      <span class="sub-title">八字命理 · 人生模拟</span>
      <p class="intro-text">
        命由天定，运由己造<br>
        以八字窥天道，以选择定人生
      </p>
    </div>
    <div class="start-btn-wrap">
      <button class="btn-primary" onclick="goToPage('bazi-input')">排 盘 入 口</button>
    </div>
  </div>

  <!-- 八字输入页 -->
  <div id="page-bazi-input" class="page">
    <div class="header">
      <div class="back-btn" onclick="goToPage('home')">‹</div>
      <div class="header-title">排盘信息</div>
      <div class="placeholder"></div>
    </div>
    <div class="container">
      <div class="form-group">
        <label class="form-label">姓 名</label>
        <input type="text" class="form-input" id="input-name" placeholder="请输入您的姓名">
      </div>
      <div class="form-group">
        <label class="form-label">性 别</label>
        <div class="gender-selector">
          <div class="gender-option active" id="gender-male" onclick="selectGender('male')">男</div>
          <div class="gender-option" id="gender-female" onclick="selectGender('female')">女</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">日期类型</label>

const SOLAR_TERM_DATA = {
  // 格式: '年-月': 节气日
  // 立春一般在2月3-5日，惊蛰在3月5-7日，等等
  // 使用通用规则：每年节气日期浮动±1天
};

// 计算精确节气日期（基于天文算法简化版）
function getSolarTermDate(year, termIndex) {
  // termIndex: 0=小寒, 1=大寒, 2=立春, 3=雨水, 4=惊蛰, 5=春分, 6=清明, 7=谷雨,
  //           8=立夏, 9=小满, 10=芒种, 11=夏至, 12=小暑, 13=大暑, 14=立秋, 15=处暑,
  //           16=白露, 17=秋分, 18=寒露, 19=霜降, 20=立冬, 21=小雪, 22=大雪, 23=冬至
  const baseDates = [6, 20, 4, 19, 6, 21, 5, 20, 5, 21, 6, 21, 7, 23, 7, 23, 7, 23, 8, 23, 7, 22, 7, 22];
  const baseYear = 2000;
  const yearDiff = year - baseYear;
  
  // 节气每年约偏移6小时，每4年累积约1天
  let offset = Math.floor(yearDiff / 4);
  if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
    // 闰年微调
  }
  
  let day = baseDates[termIndex] + offset;
  let month = Math.floor(termIndex / 2) + 1;
  if (termIndex >= 22) month = 12;
  else if (termIndex >= 20) month = 11;
  else if (termIndex >= 18) month = 10;
  else if (termIndex >= 16) month = 9;
  else if (termIndex >= 14) month = 8;
  else if (termIndex >= 12) month = 7;
  else if (termIndex >= 10) month = 6;
  else if (termIndex >= 8) month = 5;
  else if (termIndex >= 6) month = 4;
  else if (termIndex >= 4) month = 3;
  else if (termIndex >= 2) month = 2;
  else month = 1;
  
  // 处理日期跨月
  const daysInMonth = new Date(year, month, 0).getDate();
  if (day > daysInMonth) {
    day -= daysInMonth;
    month++;
  }
  if (day < 1) {
    month--;
    day += new Date(year, month, 0).getDate();
  }
  
  return { year, month, day };
}

// 根据公历日期获取农历年（用于年柱计算）
// 传统八字以立春为年柱分界，立春前出生属上一年
function getLunarYear(solarYear, solarMonth, solarDay) {
  const liChun = getSolarTermDate(solarYear, 2); // 立春索引为2

  // 如果公历日期在当年立春之前，年柱属于上一年
  if (solarMonth < liChun.month ||
      (solarMonth === liChun.month && solarDay < liChun.day)) {
    return solarYear - 1;
  }

  return solarYear;
}

  0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,//2080-2089
  0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,//2090-2099
  0x0d520 //2100
];

// 获取农历年的总天数
function getLunarYearDays(year) {
  let sum = 348; // 12*29
  for (let i = 0x8000; i > 0x8; i >>= 1) {
    sum += (LUNAR_INFO[year - 1900] & i) ? 1 : 0;
  }
  return sum + getLeapDays(year);
}

// 获取农历年闰月的月份（0表示无闰月）
function getLeapMonth(year) {
  return LUNAR_INFO[year - 1900] & 0xf;
}

// 获取农历年闰月天数
function getLeapDays(year) {
  if (getLeapMonth(year)) {
    return (LUNAR_INFO[year - 1900] & 0x10000) ? 30 : 29;
  }
  return 0;
}

// 获取农历年某月天数
function getLunarMonthDays(year, month) {
  return (LUNAR_INFO[year - 1900] & (0x10000 >> month)) ? 30 : 29;
}

// 农历转公历
// lunarYear, lunarMonth, lunarDay 为农历日期
// isLeapMonth 表示是否是闰月
function lunarToSolar(lunarYear, lunarMonth, lunarDay, isLeapMonth) {
  if (lunarYear < 1900 || lunarYear > 2100) {
    console.error('农历年份超出支持范围(1900-2100)');
    return { year: lunarYear, month: lunarMonth, day: lunarDay };
  }

  // 基准：1900年1月31日是农历1900年正月初一
  const baseDate = new Date(1900, 0, 31);
  let offset = 0;

  // 累加1900到lunarYear-1年的天数
  for (let y = 1900; y < lunarYear; y++) {
    offset += getLunarYearDays(y);
  }

  // 累加当年从正月到当前月之前的天数
  const leap = getLeapMonth(lunarYear);
  for (let m = 1; m < lunarMonth; m++) {
    offset += getLunarMonthDays(lunarYear, m);
    if (m === leap) {
      // 如果本月是闰月位置，正常月之后再插入闰月
      offset += getLeapDays(lunarYear);
    }
  }

  // 如果当前选择的是闰月，需要先累加正常月的天数
  if (isLeapMonth && leap === lunarMonth) {
    offset += getLunarMonthDays(lunarYear, lunarMonth);
  }

  // 加上当月天数（lunarDay - 1，因为初一就是当月的第0天）
  offset += lunarDay - 1;

  const resultDate = new Date(baseDate.getTime() + offset * 24 * 60 * 60 * 1000);
  return {
    year: resultDate.getFullYear(),
    month: resultDate.getMonth() + 1,
    day: resultDate.getDate()
  };
}

// 判断农历年是否有闰月
function hasLeapMonth(lunarYear) {
  return getLeapMonth(lunarYear) > 0;
}

// 根据日期获取精确月令（考虑节气）
function getSolarTermMonth(year, month, day) {
  // 节气顺序：立春(2月), 惊蛰(3月), 清明(4月), 立夏(5月), 芒种(6月), 小暑(7月),
  //           立秋(8月), 白露(9月), 寒露(10月), 立冬(11月), 大雪(12月), 小寒(1月)
  const jieQi = [
    { month: 2, termIdx: 2, name: '立春' },   // 寅月
    { month: 3, termIdx: 4, name: '惊蛰' },   // 卯月
    { month: 4, termIdx: 6, name: '清明' },   // 辰月
    { month: 5, termIdx: 8, name: '立夏' },   // 巳月
    { month: 6, termIdx: 10, name: '芒种' },  // 午月
    { month: 7, termIdx: 12, name: '小暑' },  // 未月
    { month: 8, termIdx: 14, name: '立秋' },  // 申月
    { month: 9, termIdx: 16, name: '白露' },  // 酉月
    { month: 10, termIdx: 18, name: '寒露' }, // 戌月
    { month: 11, termIdx: 20, name: '立冬' }, // 亥月
    { month: 12, termIdx: 22, name: '大雪' }, // 子月
    { month: 1, termIdx: 0, name: '小寒' }    // 丑月
  ];
  
  // 找到对应的节气月份
  for (let i = 0; i < jieQi.length; i++) {
    const q = jieQi[i];
    const termDate = getSolarTermDate(year, q.termIdx);
    
    if (month === q.month && day >= termDate.day) {
      // 这个月从这个节气开始算新月份
      const zhiIndex = (q.month - 1 + 2) % 12; // 寅=0, 卯=1, ...
      return zhiIndex + 1;
    } else if (month === q.month && day < termDate.day) {
      // 还在上一个月
      const prevQ = jieQi[(i - 1 + 12) % 12];
      const prevZhiIndex = (prevQ.month - 1 + 2) % 12;
      return prevZhiIndex + 1;
    }
  }
  
  // 默认返回农历月份映射
  return (month + 1) % 12 || 12;
}

// 十神关系（优化版，更准确）
function getShiShen(dayMaster, otherGan) {
  if (!dayMaster || !otherGan) return '';
  
  const dayWuxing = TIAN_GAN_WUXING[dayMaster];
  const otherWuxing = TIAN_GAN_WUXING[otherGan];
  const dayIndex = TIAN_GAN.indexOf(dayMaster);
  const otherIndex = TIAN_GAN.indexOf(otherGan);
  
  if (dayIndex === -1 || otherIndex === -1) return '';
  
  const dayYinYang = dayIndex % 2 === 0; // 甲丙戊庚壬为阳
  const otherYinYang = otherIndex % 2 === 0;
  const sameYY = dayYinYang === otherYinYang;

  // 生克关系
  const sheng = { '木': '火', '火': '土', '土': '金', '金': '水', '水': '木' };
  const ke = { '木': '土', '土': '水', '水': '火', '火': '金', '金': '木' };

  if (dayWuxing === otherWuxing) {
    return sameYY ? '比肩' : '劫财';
  }
  if (sheng[dayWuxing] === otherWuxing) {
    return sameYY ? '食神' : '伤官';
  }
  if (ke[dayWuxing] === otherWuxing) {
    return sameYY ? '偏财' : '正财';
  }
  if (sheng[otherWuxing] === dayWuxing) {
    return sameYY ? '偏印' : '正印';
  }
  if (ke[otherWuxing] === dayWuxing) {
    return sameYY ? '七杀' : '正官';
  }
  return '';
}

// 年干支计算（优化版，使用标准干支纪元）
function getYearGanZhi(year) {
  // 1984年是甲子年，以此为基准
  const baseYear = 1984;
  const baseGanIndex = 0; // 甲
  const baseZhiIndex = 0; // 子
  
  const offset = year - baseYear;
  const ganIndex = ((baseGanIndex + offset) % 10 + 10) % 10;
  const zhiIndex = ((baseZhiIndex + offset) % 12 + 12) % 12;
  
  return { gan: TIAN_GAN[ganIndex], zhi: DI_ZHI[zhiIndex] };
}

// 月干计算（五虎遁，优化版）
function getMonthGan(yearGan, monthZhi) {
  const wuHuDun = {
    '甲': '丙', '己': '丙',
    '乙': '戊', '庚': '戊',
    '丙': '庚', '辛': '庚',
    '丁': '壬', '壬': '壬',
    '戊': '甲', '癸': '甲'
  };
  const firstGan = wuHuDun[yearGan];
  if (!firstGan) return '甲';
  
  const zhiOrder = ['寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥', '子', '丑'];
  const zhiIndex = zhiOrder.indexOf(monthZhi);
  if (zhiIndex === -1) return firstGan;
  
  const ganIndex = (TIAN_GAN.indexOf(firstGan) + zhiIndex) % 10;
  return TIAN_GAN[ganIndex];
}

// 日干支计算（优化版，使用已验证的基准日）
function getDayGanZhi(year, month, day) {
  // 使用1900年1月31日为基准日（已知为甲辰日）
  const baseDate = new Date(1900, 0, 31);
  const targetDate = new Date(year, month - 1, day);
  const daysDiff = Math.floor((targetDate - baseDate) / (1000 * 60 * 60 * 24));
  
  // 甲辰日: 甲=0, 辰=4
  const baseGanIndex = 0;
  const baseZhiIndex = 4;
  
  const ganIndex = ((baseGanIndex + daysDiff) % 10 + 10) % 10;
  const zhiIndex = ((baseZhiIndex + daysDiff) % 12 + 12) % 12;
  
  return { gan: TIAN_GAN[ganIndex], zhi: DI_ZHI[zhiIndex] };
}

// 时干计算（五鼠遁，优化版）
function getHourGan(dayGan, hourZhi) {
  const wuShuDun = {
    '甲': '甲', '己': '甲',
    '乙': '丙', '庚': '丙',
    '丙': '戊', '辛': '戊',
    '丁': '庚', '壬': '庚',
    '戊': '壬', '癸': '壬'
  };
  const firstGan = wuShuDun[dayGan];
  if (!firstGan) return '甲';
  
  const zhiOrder = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
  const zhiIndex = zhiOrder.indexOf(hourZhi);
  if (zhiIndex === -1) return firstGan;
  
  const ganIndex = (TIAN_GAN.indexOf(firstGan) + zhiIndex) % 10;
  return TIAN_GAN[ganIndex];
}

// 五行平衡计算（优化版，更准确权重）
function calculateWuXingBalance(baZi) {
  let balance = { gold: 0, wood: 0, water: 0, fire: 0, earth: 0 };
  const wuxingMap = { '金': 'gold', '木': 'wood', '水': 'water', '火': 'fire', '土': 'earth' };

  // 天干力量：日干（日主）权重最高
  const ganWeights = { yearGan: 0.8, monthGan: 1.0, dayGan: 1.5, hourGan: 0.8 };
  
  for (const key of ['yearGan', 'monthGan', 'dayGan', 'hourGan']) {
    const gan = baZi[key];
    const wx = TIAN_GAN_WUXING[gan];
    if (wx && wuxingMap[wx]) {
      balance[wuxingMap[wx]] += ganWeights[key];
    }
  }

  // 地支力量：月支（月令）权重最高，因为月令司权
  const zhiWeights = { yearZhi: 0.6, monthZhi: 1.5, dayZhi: 0.8, hourZhi: 0.6 };
  
  for (const key of ['yearZhi', 'monthZhi', 'dayZhi', 'hourZhi']) {
    const zhi = baZi[key];
    const wx = DI_ZHI_WUXING[zhi];
    if (wx && wuxingMap[wx]) {
      balance[wuxingMap[wx]] += zhiWeights[key];
    }

    // 藏干按本气、中气、余气分配不同权重
    const hideGanList = DI_ZHI_HIDE_GAN[zhi] || [];
    hideGanList.forEach(item => {
      const ganWx = TIAN_GAN_WUXING[item.gan];
      if (ganWx && wuxingMap[ganWx]) {
        balance[wuxingMap[ganWx]] += item.weight * zhiWeights[key] * 0.5;
      }
    });
  }

  // 找出最强最弱
  const wuxingKeys = ['gold', 'wood', 'water', 'fire', 'earth'];
  const names = { gold: '金', wood: '木', water: '水', fire: '火', earth: '土' };
  let most = wuxingKeys[0], least = wuxingKeys[0];
  let maxVal = balance[most], minVal = balance[least];
  
  wuxingKeys.forEach(k => {
    if (balance[k] > maxVal) { maxVal = balance[k]; most = k; }
    if (balance[k] < minVal) { minVal = balance[k]; least = k; }
  });
  
  balance.most = names[most];
  balance.least = names[least];
  balance.mostValue = maxVal;
  balance.leastValue = minVal;

  return balance;
}

// 计算出生到节气的天数（用于精确计算起运年龄）
function getDaysToTerm(birthYear, birthMonth, birthDay, birthHour, birthMinute, gender, yearGan) {
  const yearGanIndex = TIAN_GAN.indexOf(yearGan);
  const isYang = yearGanIndex % 2 === 0;
  const isForward = (gender === 'male' && isYang) || (gender === 'female' && !isYang);
  
  // 找到最近的节气
  const birthDate = new Date(birthYear, birthMonth - 1, birthDay, birthHour, birthMinute);
  let nearestTerm = null;
  let minDiff = Infinity;
  
  // 检查前后各3个节气
  for (let i = 0; i < 24; i++) {
    const termDate = getSolarTermDate(birthYear, i);
    const termTime = new Date(termDate.year, termDate.month - 1, termDate.day, 0, 0);
    const diff = termTime - birthDate;
    
    if (isForward && diff > 0 && diff < minDiff) {
      minDiff = diff;
      nearestTerm = termTime;
    } else if (!isForward && diff < 0 && Math.abs(diff) < minDiff) {
      minDiff = Math.abs(diff);
      nearestTerm = termTime;
    }
  }
  
  if (!nearestTerm) {
    // 如果找不到，使用默认天数
    return isForward ? 3 : 4;
  }
  
  const days = minDiff / (1000 * 60 * 60 * 24);
  return Math.max(1, Math.round(days));
}

// 大运计算（优化版，精确起运年龄）
function calculateDaYun(baZi, gender, birthYear, birthMonth, birthDay, birthHour, birthMinute) {
  const daYunList = [];
  const yearGan = baZi.yearGan;
  const yearGanIndex = TIAN_GAN.indexOf(yearGan);
  const isYang = yearGanIndex % 2 === 0;
  const shunHang = (gender === 'male' && isYang) || (gender === 'female' && !isYang);

  // 计算精确起运年龄：出生到最近节气的天数 ÷ 3
  const daysToTerm = getDaysToTerm(birthYear, birthMonth, birthDay, birthHour, birthMinute, gender, yearGan);
  const startAge = Math.round(daysToTerm / 3 * 10) / 10; // 保留一位小数

  let currentZhiIndex = DI_ZHI.indexOf(baZi.monthZhi);
  let currentGanIndex = TIAN_GAN.indexOf(baZi.monthGan);

  for (let i = 0; i < 8; i++) {
    if (shunHang) {
      currentZhiIndex = (currentZhiIndex + 1) % 12;
      currentGanIndex = (currentGanIndex + 1) % 10;
    } else {
      currentZhiIndex = (currentZhiIndex - 1 + 12) % 12;
      currentGanIndex = (currentGanIndex - 1 + 10) % 10;
    }

    const daYunGan = TIAN_GAN[currentGanIndex];
    const daYunZhi = DI_ZHI[currentZhiIndex];
    const shiShen = getShiShen(baZi.dayGan, daYunGan);
    const wuXing = TIAN_GAN_WUXING[daYunGan];

    daYunList.push({
      startAge: Math.round((startAge + i * 10) * 10) / 10,
      endAge: Math.round((startAge + (i + 1) * 10 - 0.1) * 10) / 10,
      gan: daYunGan,
      zhi: daYunZhi,
      shiShen,
      wuXing
    });
  }

  return daYunList;
}

// 主排盘函数（优化版）
function generateBaZi(year, month, day, hour, minute, gender) {
  // 公历转农历年（以立春为界），确保年柱准确
  const lunarYear = getLunarYear(year, month, day);

  const yearGanZhi = getYearGanZhi(lunarYear);
  const solarMonth = getSolarTermMonth(year, month, day);
  const monthZhi = MONTH_ZHI_MAP[solarMonth];
  const monthGan = getMonthGan(yearGanZhi.gan, monthZhi);
  const dayGanZhi = getDayGanZhi(year, month, day);
  const hourZhi = HOUR_ZHI_MAP[hour];
  const hourGan = getHourGan(dayGanZhi.gan, hourZhi);

  const baZi = {
    yearGan: yearGanZhi.gan,
    yearZhi: yearGanZhi.zhi,
    monthGan,
    monthZhi,
    dayGan: dayGanZhi.gan,
    dayZhi: dayGanZhi.zhi,
    hourGan,
    hourZhi
  };

  const dayMaster = baZi.dayGan;
  const wuXingBalance = calculateWuXingBalance(baZi);
  
  // 使用优化后的大运计算，传入出生时间参数
  const daYunList = calculateDaYun(baZi, gender, year, month, day, hour, minute);

  return { baZi, dayMaster, wuXingBalance, daYunList };
}

// ==================== 人生事件引擎 ====================

let eventIdCounter = 0;
function generateId() {
  return 'evt_' + (++eventIdCounter) + '_' + Math.random().toString(36).substring(2, 8);
}

const categoryNames = {
  education: '学业',
  career: '事业',
  relationship: '感情',
  health: '健康',
  family: '家庭',
  finance: '财运',
  disaster: '变故'
};

// 生成初始人生事件（过去全部 + 未来3个）
function generateInitialLifeEvents(chart, birthYear) {
  const events = [];
  const patterns = buildPatterns();

  const currentYear = new Date().getFullYear();
  const currentAge = currentYear - birthYear;

  // 稀疏的关键人生节点年龄（间隔至少3年，避免密集）
  const keyAges = [
    // 童年与学业关键节点（间隔2-3年）
    7,  // 入学
    10, // 小学中期
    12, // 小学毕业
    15, // 中考/初中毕业
    18, // 高考/高中毕业
    22, // 大学毕业
    // 事业阶段（间隔3-5年）
    25, // 事业起步
    28, // 事业初期稳定
    32, // 事业上升期
    36, // 事业关键节点
    40, // 中年转折
    // 中年后期（间隔5年）
    45,
    50,
    55,
    60,
    65,
    70
  ];

  let lastEventType = null;
  let consecutiveSameType = 0;

  for (const age of keyAges) {
    const isPast = age < currentAge;
    const isFuture = age > currentAge;

    const futureCount = events.filter(e => e.age > currentAge).length;
    if (isFuture && futureCount >= 3) break;

    const validPatterns = patterns.filter(p => p.condition(chart, age));
    if (validPatterns.length === 0) continue;

    // 避免连续重复的事件类型
    const filteredPatterns = validPatterns.filter(p => {
      if (p.type === lastEventType) {
        consecutiveSameType++;
        // 连续2个相同类型则强制过滤
        return consecutiveSameType < 2;
      }
      consecutiveSameType = 0;
      return true;
    });

    if (filteredPatterns.length === 0) {
      consecutiveSameType = 0;
      continue;
    }

    // 按概率排序选择最可能的事件类型
    filteredPatterns.sort((a, b) => (b.probability || 0.6) - (a.probability || 0.6));

    // 过去事件概率降低，避免每个年龄都生成（60%-70%概率）
    // 未来事件概率保持不变
    const selectedPattern = filteredPatterns[0];
    const baseProb = selectedPattern.probability || 0.6;
    const prob = isPast ? Math.min(baseProb * 0.85, 0.75) : baseProb;

    if (Math.random() < prob) {
      const event = {
        id: generateId(),
        age,
        type: selectedPattern.type,
        description: selectedPattern.description(chart, age),
        options: typeof selectedPattern.options === 'function' ? selectedPattern.options(chart, age) : selectedPattern.options,
        accuracy: selectedPattern.accuracy || 'medium',
        impact: {},
        status: isPast ? 'past' : 'future'
      };
      events.push(event);
      lastEventType = selectedPattern.type;
    } else {
      lastEventType = null;
      consecutiveSameType = 0;
    }
  }

  // 确保有当前年龄附近的事件
  ensureKeyEvents(events, chart, birthYear, currentAge);

  events.sort((a, b) => a.age - b.age);

  // 确保未来有3个事件
  const futureEvents = events.filter(e => e.age > currentAge);
  if (futureEvents.length < 3) {
    const fallbackAges = [currentAge + 3, currentAge + 6, currentAge + 9];
    for (let i = futureEvents.length; i < 3 && i < fallbackAges.length; i++) {
      const newAge = fallbackAges[i] || (currentAge + (i + 1) * 3);
      if (newAge > 80) break;
      const newEvent = {
        id: generateId(),
        age: newAge,
        type: 'career',
        description: `${newAge}岁左右，人生新阶段，面临重要抉择`,
        options: [
          { id: 'default1', text: '稳中求进', impactDesc: '踏实发展' },
          { id: 'default2', text: '冒险求变', impactDesc: '寻求突破' }
        ],
        accuracy: 'medium',
        status: 'future'
      };
      events.push(newEvent);
    }
    events.sort((a, b) => a.age - b.age);
  }

  return { events, currentAge };
}

// 根据选择生成1个后续事件
function generateFollowUpEvents(chart, currentAge, choiceImpact, existingEvents) {
  const patterns = buildPatterns();

  // 稀疏的关键人生节点年龄（与generateInitialLifeEvents保持一致）
  const keyAges = [
    7, 10, 12, 15, 18, 22, // 学业阶段（间隔2-3年）
    25, 28, 32, 36, 40,    // 事业阶段（间隔3-5年）
    45, 50, 55, 60, 65, 70, 75, 80 // 中年后期（间隔5年）
  ];

  // 筛选出大于当前年龄且未被使用的关键年龄
  const availableAges = keyAges.filter(age => {
    if (age <= currentAge) return false;
    if (existingEvents.some(e => e.age === age)) return false;
    return true;
  });

  const candidates = [];

  // 遍历关键年龄，每个年龄只选一个最合适的事件
  for (let i = 0; i < availableAges.length && candidates.length < 3; i++) {
    const age = availableAges[i];

    // 找出该年龄符合条件的事件类型
    const validPatterns = [];
    for (const pattern of patterns) {
      let prob = pattern.probability || 0.6;
      if (choiceImpact && choiceImpact[pattern.type]) {
        prob *= choiceImpact[pattern.type];
      }

      if (pattern.condition(chart, age)) {
        validPatterns.push({ pattern, prob });
      }
    }

    // 如果有符合条件的事件，选择一个
    if (validPatterns.length > 0) {
      // 按概率排序，选择最可能的
      validPatterns.sort((a, b) => b.prob - a.prob);

      // 只在概率达标时才生成
      if (Math.random() < validPatterns[0].prob) {
        const selectedPattern = validPatterns[0].pattern;
        candidates.push({
          id: generateId(),
          age,
          type: selectedPattern.type,
          description: selectedPattern.description(chart, age),
          options: typeof selectedPattern.options === 'function' ? selectedPattern.options(chart, age) : selectedPattern.options,
          accuracy: selectedPattern.accuracy || 'medium',
          impact: {}
        });
      }
    }
  }

  // 返回按年龄排序的事件
  candidates.sort((a, b) => a.age - b.age);
  return candidates.slice(0, 3);
}

// 解析impact字符串
function parseImpact(impactStr) {
  if (!impactStr) return {};
  const result = {};
  impactStr.split(',').forEach(pair => {
    const [key, val] = pair.trim().split(':');
    if (key && val) {
      result[key.trim()] = parseFloat(val);
    }
  });
  return result;
}

// 初始化农历下拉选择器
function initLunarSelectors() {
  const yearSelect = document.getElementById('lunar-year');
  const monthSelect = document.getElementById('lunar-month');
  const daySelect = document.getElementById('lunar-day');

  if (!yearSelect || !monthSelect || !daySelect) return;

  // 仅在第一次初始化时填充年份
  if (yearSelect.options.length === 0) {
    const currentYear = new Date().getFullYear();
    for (let y = 1900; y <= currentYear; y++) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y + '年';
      yearSelect.appendChild(opt);
    }
    yearSelect.value = 1995;

    yearSelect.addEventListener('change', () => {
      updateLunarMonthOptions();
      updateLunarPreview();
    });
    monthSelect.addEventListener('change', () => {
      updateLunarDayOptions();
      updateLunarPreview();
    });
    daySelect.addEventListener('change', updateLunarPreview);
  }

  updateLunarMonthOptions();
}

  const year = parseInt(document.getElementById('lunar-year').value);
  const monthSelect = document.getElementById('lunar-month');
  const prevValue = monthSelect.value;
  const prevIsLeap = prevValue && monthSelect.options[monthSelect.selectedIndex] &&
                     monthSelect.options[monthSelect.selectedIndex].dataset.isLeap === '1';

  monthSelect.innerHTML = '';
  const leap = getLeapMonth(year);

  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m + '月';
    monthSelect.appendChild(opt);

    // 如果有闰月，且是闰月月份，在后面插入一个闰月选项
    if (leap === m) {
      const leapOpt = document.createElement('option');
      leapOpt.value = m;
      leapOpt.textContent = '闰' + m + '月';
      leapOpt.dataset.isLeap = '1';
      monthSelect.appendChild(leapOpt);
    }
  }

  // 恢复选择（优先保持闰月状态）
  if (prevValue && prevIsLeap && leap === parseInt(prevValue)) {
    // 找到对应闰月选项
    for (let i = 0; i < monthSelect.options.length; i++) {
      if (monthSelect.options[i].dataset.isLeap === '1' &&
          monthSelect.options[i].value === prevValue) {
        monthSelect.selectedIndex = i;
        break;
      }
    }
  } else if (prevValue && parseInt(prevValue) >= 1 && parseInt(prevValue) <= 12) {
    monthSelect.value = prevValue;
  } else {
    monthSelect.value = 5;
  }

  updateLunarDayOptions();
}

// 根据所选农历月更新日选项
function updateLunarDayOptions() {
  const year = parseInt(document.getElementById('lunar-year').value);
  const monthSelect = document.getElementById('lunar-month');
  const daySelect = document.getElementById('lunar-day');
  const month = parseInt(monthSelect.value);
  const isLeap = monthSelect.options[monthSelect.selectedIndex] &&
                 monthSelect.options[monthSelect.selectedIndex].dataset.isLeap === '1';

  let days;
  if (isLeap) {
    days = getLeapDays(year);
  } else {
    days = getLunarMonthDays(year, month);
  }

  const prevValue = daySelect.value;
  daySelect.innerHTML = '';
  for (let d = 1; d <= days; d++) {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d + '日';
    daySelect.appendChild(opt);
  }
  if (prevValue && parseInt(prevValue) <= days) {
    daySelect.value = prevValue;
  } else {
    daySelect.value = 15;
  }
}

// 显示农历对应的公历日期预览
function updateLunarPreview() {
  const year = parseInt(document.getElementById('lunar-year').value);
  const monthSelect = document.getElementById('lunar-month');
  const month = parseInt(monthSelect.value);
  const day = parseInt(document.getElementById('lunar-day').value);

// ==================== 八字计算 ====================

function calculateBazi() {
  const name = document.getElementById('input-name').value;
  const timeStr = document.getElementById('input-time').value;

  if (!name || !timeStr) {
    alert('请填写完整信息');
    return;
  }

  let year, month, day;

  if (userData.calendarType === 'lunar') {
    const lunarYear = parseInt(document.getElementById('lunar-year').value);
    const monthSelect = document.getElementById('lunar-month');
    const lunarMonth = parseInt(monthSelect.value);
    const lunarDay = parseInt(document.getElementById('lunar-day').value);
    const isLeap = monthSelect.options[monthSelect.selectedIndex] &&
                   monthSelect.options[monthSelect.selectedIndex].dataset.isLeap === '1';

    if (!lunarYear || !lunarMonth || !lunarDay) {
      alert('请填写完整农历日期');
      return;
    }

    const solar = lunarToSolar(lunarYear, lunarMonth, lunarDay, isLeap);
    year = solar.year;
    month = solar.month;
    day = solar.day;
  } else {
    // 公历输入
    const dateStr = document.getElementById('input-date').value;
    if (!dateStr) {
      alert('请填写出生日期');
      return;
    }
    [year, month, day] = dateStr.split('-').map(Number);
  }

  const [hour, minute] = timeStr.split(':').map(Number);

  userData.name = name;
  userData.birthYear = year;
  userData.birthMonth = month;
  userData.birthDay = day;
  userData.birthHour = hour;
  userData.birthMinute = minute;

  userData.baziChart = generateBaZi(year, month, day, hour, minute, userData.gender);
  const lifeResult = generateInitialLifeEvents(userData.baziChart, year);
  userData.lifeEvents = lifeResult.events;
  userData.currentAge = lifeResult.currentAge;
  userData.currentEventIndex = 0;
  userData.completedEvents = [];
  userData.choices = {};
  userData.supplements = {};
  userData.choiceImpacts = {};

  goToPage('bazi-result');
}

function addChatMessage(type, content) {

  addChatMessage('user', value);
  userData.supplements[question.text.substring(0, 20)] = value;
  
  // 根据回答调整事件准确度
  if (question.eventId && value === 'no') {
    const event = userData.lifeEvents.find(e => e.id === question.eventId);
    if (event) event.accuracy = 'low';

  setTimeout(() => {
    currentQuestionIndex++;

// 路径上的点（按SVG坐标）
const PATH_POINTS = [
  { y: 2550, x: 375 },
  { y: 2440, x: 320 },
  { y: 2320, x: 370 },
  { y: 2200, x: 380 },
  { y: 2080, x: 300 },
  { y: 1960, x: 340 },
  { y: 1840, x: 420 },
  { y: 1720, x: 400 },
  { y: 1600, x: 320 },
  { y: 1480, x: 380 },
  { y: 1360, x: 440 },
  { y: 1240, x: 380 },
  { y: 1120, x: 320 },
  { y: 1000, x: 380 },
  { y: 880, x: 440 },
  { y: 760, x: 400 },
  { y: 640, x: 340 },
  { y: 520, x: 400 },
  { y: 400, x: 460 },
  { y: 280, x: 400 },
  { y: 160, x: 380 },
  { y: 80, x: 375 }
];

function initLifeSimulator() {
  userData.completedEvents = [];
  userData.choices = {};
  userData.choiceImpacts = {};
  pathOffset = 0;

  // 确保有初始事件
  if (userData.lifeEvents.length < 3) {
    const lifeResult = generateInitialLifeEvents(userData.baziChart, userData.birthYear);
    userData.lifeEvents = lifeResult.events;
    userData.currentAge = lifeResult.currentAge;
  }

  // 找到当前年龄对应的第一个未来事件作为当前节点
  const currentAge = userData.currentAge || 0;
  const futureEvents = userData.lifeEvents.filter(e => e.age > currentAge || e.status === 'future');
  const pastEvents = userData.lifeEvents.filter(e => e.age <= currentAge || e.status === 'past');

  // 过去事件全部标记为已完成
  pastEvents.forEach(e => {
    if (!userData.completedEvents.includes(e.id)) {
      userData.completedEvents.push(e.id);
    }
  });

  // 当前节点是第一个未来事件
  const currentEvent = futureEvents[0];
  userData.currentEventIndex = currentEvent ? userData.lifeEvents.findIndex(e => e.id === currentEvent.id) : 0;

  // 显示真实当前年龄
  document.getElementById('sim-age-num').textContent = currentAge;
  document.getElementById('life-hint').style.display = 'block';

  // 初始路径位置：让当前节点对准屏幕中间的人物
  if (currentEvent) {
    movePathToCurrent();
  }

  renderLifeNodes();
}

function renderLifeNodes() {
  const container = document.getElementById('html-nodes-container');
  container.innerHTML = '';

  const events = userData.lifeEvents;
  if (events.length === 0) return;

  const currentAge = userData.currentAge || 0;
  const sceneContainer = document.querySelector('.scene-container');
  const viewportHeight = sceneContainer ? sceneContainer.clientHeight : window.innerHeight;
  const svgHeight = 2668;
  const scale = viewportHeight / svgHeight;

  for (let i = 0; i < events.length; i++) {
    const event = events[i];
    const index = i;

    const ageRatio = Math.min(event.age / 80, 0.95);
    const pointIndex = Math.floor(ageRatio * (PATH_POINTS.length - 1));
    const nextPointIndex = Math.min(pointIndex + 1, PATH_POINTS.length - 1);
    const localRatio = (ageRatio * (PATH_POINTS.length - 1)) - pointIndex;

    const p1 = PATH_POINTS[pointIndex];
    const p2 = PATH_POINTS[nextPointIndex];

    const svgX = p1.x + (p2.x - p1.x) * localRatio;
    const svgY = p1.y + (p2.y - p1.y) * localRatio;

    const screenX = svgX * scale;
    const screenY = svgY * scale + pathOffset;

    const isPast = event.status === 'past' || event.age <= currentAge || userData.completedEvents.includes(event.id);
    const isCurrent = index === userData.currentEventIndex && !isPast;
    const isFuture = !isPast && !isCurrent;

    const nodeDiv = document.createElement('div');
    nodeDiv.style.position = 'absolute';
    nodeDiv.style.left = screenX + 'px';
    nodeDiv.style.top = screenY + 'px';
    nodeDiv.style.transform = 'translate(-50%, -50%)';
    nodeDiv.style.pointerEvents = 'auto';

    if (isPast) {
      nodeDiv.innerHTML = `
        <div style="width:14px;height:14px;border-radius:50%;background:#1a1a1a;border:2px solid #1a1a1a;position:relative;">
          <span style="position:absolute;left:22px;top:-2px;font-size:11px;color:#555;white-space:nowrap;">${event.age}岁</span>
        </div>
      `;
      nodeDiv.style.cursor = 'pointer';
      nodeDiv.addEventListener('click', function(e) {
        e.stopPropagation();
        openChoiceByIndex(index);
      });
    } else if (isCurrent) {
      nodeDiv.innerHTML = `
        <div style="position:relative;">
          <div style="position:absolute;left:-12px;top:-12px;width:32px;height:32px;border-radius:50%;border:2px solid #8b0000;opacity:0.2;animation:nodeGlow 1.5s infinite;"></div>
          <div style="position:absolute;left:-8px;top:-8px;width:24px;height:24px;border-radius:50%;border:2px solid #8b0000;opacity:0.3;animation:nodeGlow 1.5s infinite 0.3s;"></div>
          <div style="width:18px;height:18px;border-radius:50%;background:#8b0000;border:2px solid #fff;box-shadow:0 0 10px rgba(139,0,0,0.5);position:relative;">
            <div style="position:absolute;left:5px;top:5px;width:4px;height:4px;border-radius:50%;background:#fff;"></div>
          </div>
          <span style="position:absolute;left:28px;top:-3px;font-size:16px;color:#8b0000;font-weight:bold;white-space:nowrap;">${event.age}岁</span>
          <span style="position:absolute;left:28px;top:14px;font-size:11px;color:#999;white-space:nowrap;">· ${categoryNames[event.type] || event.type}</span>
        </div>
      `;
      nodeDiv.style.cursor = 'pointer';
      nodeDiv.addEventListener('click', function(e) {
        e.stopPropagation();
        openChoiceByIndex(index);
      });
    } else if (isFuture) {
      nodeDiv.innerHTML = `
        <div style="width:12px;height:12px;border-radius:50%;background:#f5f0e6;border:2px solid #999;position:relative;">
          <span style="position:absolute;left:20px;top:-2px;font-size:11px;color:#aaa;white-space:nowrap;">${event.age}岁</span>
        </div>
      `;
    }

    container.appendChild(nodeDiv);
  }

  if (!document.getElementById('node-pulse-style')) {
    const style = document.createElement('style');
    style.id = 'node-pulse-style';
    style.textContent = `
      @keyframes nodeGlow {
        0% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 0.1; transform: scale(1.3); }
        100% { opacity: 0.4; transform: scale(0.9); }
      }
    `;
    document.head.appendChild(style);
  }
}

function openCurrentChoice() {
  openChoiceByIndex(userData.currentEventIndex);
}

function openChoiceByIndex(index) {
  const event = userData.lifeEvents[index];
  if (!event) return;

  // 记录当前查看的事件索引
  viewingEventIndex = index;

  // 检查是否已有选择（重新选择模式）
  const existingChoice = userData.choices[event.id];

  document.getElementById('choice-age').textContent = event.age + ' 岁';
  document.getElementById('choice-category').textContent = categoryNames[event.type] || event.type;
  document.getElementById('choice-desc').textContent = event.description;

  const optionsEl = document.getElementById('choice-options');
  const options = event.options || [
    { id: 'default', text: '顺其自然', impactDesc: '接受命运的安排' }
  ];

  optionsEl.innerHTML = options.map(opt => `
    <div class="choice-option ${existingChoice === opt.id ? 'selected' : ''}" onclick="selectChoiceOption('${opt.id}')" id="choice-opt-${opt.id}">
      <span class="opt-text">${opt.text}</span>
      <span class="opt-impact">${opt.impactDesc || ''}</span>
    </div>
  `).join('');

  // 如果已有选择，预选
  selectedChoiceOptionId = existingChoice || null;

  // 修改按钮文字
  const btn = document.querySelector('.confirm-choice-btn');
  if (btn) {
    btn.textContent = existingChoice ? '重新抉择' : '抉 择';
  }

  document.getElementById('choice-panel').classList.add('active');
  document.getElementById('life-hint').style.display = 'none';
}

function selectChoiceOption(optionId) {
  selectedChoiceOptionId = optionId;
  document.querySelectorAll('.choice-option').forEach(el => el.classList.remove('selected'));
  const optEl = document.getElementById('choice-opt-' + optionId);
  if (optEl) optEl.classList.add('selected');
}

function confirmLifeChoice() {
  if (!selectedChoiceOptionId) {
    alert('请选择一个方向');
    return;
  }

  const event = userData.lifeEvents[viewingEventIndex];
  if (!event) return;

  const isRechoosing = userData.completedEvents.includes(event.id);

  // 记录/更新选择
  if (!isRechoosing) {
    userData.completedEvents.push(event.id);
  }
  userData.choices[event.id] = selectedChoiceOptionId;

  // 计算选择的影响
  const option = (event.options || []).find(o => o.id === selectedChoiceOptionId);
  if (option && option.impact) {
    const impactMap = parseImpact(option.impact);
    Object.assign(userData.choiceImpacts, impactMap);
  }

  if (isRechoosing) {
    // ===== 重新选择模式：删除该节点之后的所有节点，重新生成 =====

    // 1. 截取数组，只保留到当前重新选择的节点（包含）
    userData.lifeEvents = userData.lifeEvents.slice(0, viewingEventIndex + 1);

    // 2. 重新标记所有保留的事件为已完成
    userData.completedEvents = [];
    for (let i = 0; i < userData.lifeEvents.length; i++) {
      const e = userData.lifeEvents[i];
      if (e.age <= userData.currentAge || userData.choices[e.id]) {
        userData.completedEvents.push(e.id);
      }
    }

    // 3. 设置当前索引为重新选择节点的下一个
    userData.currentEventIndex = viewingEventIndex + 1;

    // 4. 清空后续的选择记录（重新生成的事件会重新选择）
    for (let i = viewingEventIndex + 1; i < userData.lifeEvents.length; i++) {
      const e = userData.lifeEvents[i];
      delete userData.choices[e.id];
    }

    // 5. 重新生成后续事件（保持3个未来节点）
    let lastAge = event.age;
    let attempt = 0;
    while (userData.lifeEvents.filter(e => e.age > userData.currentAge).length < 3 && attempt < 10) {
      const newEvents = generateFollowUpEvents(
        userData.baziChart,
        lastAge,
        userData.choiceImpacts,
        userData.lifeEvents
      );
      if (newEvents.length === 0) break;
      userData.lifeEvents = userData.lifeEvents.concat(newEvents);
      lastAge = newEvents[newEvents.length - 1].age;
      attempt++;
    }

    // 6. 移动路径到当前节点
    movePathToCurrent();

    document.getElementById('life-hint').textContent = '选择已改变，人生轨迹重新生成';
    document.getElementById('life-hint').style.display = 'block';
  } else {
    // ===== 新选择模式：正常前进 =====
    userData.currentEventIndex = viewingEventIndex + 1;

    // 每次选择后生成1个新的后续事件
    const newEvents = generateFollowUpEvents(
      userData.baziChart,
      event.age,
      userData.choiceImpacts,
      userData.lifeEvents
    );
    if (newEvents.length > 0) {
      userData.lifeEvents = userData.lifeEvents.concat(newEvents);
    }

    // 移动路径
    movePathToCurrent();

    const nextEvent = userData.lifeEvents[userData.currentEventIndex];
    if (nextEvent) {
      document.getElementById('life-hint').textContent = '继续前行，点击闪烁的节点';
    } else {
      document.getElementById('life-hint').textContent = '人生路漫漫，命运由己造';
    }
    document.getElementById('life-hint').style.display = 'block';
  }

  // 关闭选择面板
  document.getElementById('choice-panel').classList.remove('active');

  // 重新渲染节点
  setTimeout(() => {
    renderLifeNodes();
  }, 600);

  if (userData.currentEventIndex >= userData.lifeEvents.length) {
    setTimeout(() => {
      alert('恭喜您走完了这段人生旅途。\n\n命由天定，运由己造。\n每一个选择都在书写你的人生。');
    }, 1000);
  }
}

function getNodeY(event) {
  const ageRatio = Math.min(event.age / 80, 0.95);
  const pointIndex = Math.floor(ageRatio * (PATH_POINTS.length - 1));
  const nextPointIndex = Math.min(pointIndex + 1, PATH_POINTS.length - 1);
  const localRatio = (ageRatio * (PATH_POINTS.length - 1)) - pointIndex;
  const p1 = PATH_POINTS[pointIndex];
  const p2 = PATH_POINTS[nextPointIndex];
  return p1.y + (p2.y - p1.y) * localRatio;
}

function movePathToCurrent() {
  const pathWrapper = document.getElementById('path-wrapper');
  const viewportHeight = window.innerHeight;
  const currentEvent = userData.lifeEvents[userData.currentEventIndex];
  
  if (!currentEvent) return;

  const nodeY = getNodeY(currentEvent);
  const svgHeight = 2668;
  
  const sceneContainer = document.querySelector('.scene-container');
  const containerHeight = sceneContainer ? sceneContainer.clientHeight : viewportHeight;
  const scale = containerHeight / svgHeight;
  
  const nodeYInPx = nodeY * scale;
  const targetOffset = containerHeight / 2 - nodeYInPx;
  
  pathOffset = targetOffset;
  pathWrapper.style.transform = `translateY(${targetOffset}px)`;
}

function startLifeSimulator() {
  goToPage('life-simulator');
}

// ==================== 初始化 ====================

window.addEventListener('resize', () => {
  if (currentPage === 'life-simulator') {
    renderLifeNodes();
  }
});
</script>
