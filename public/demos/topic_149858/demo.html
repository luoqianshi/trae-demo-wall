<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧博客 - AI赋能的个人博客系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
            font-family: 'Noto Serif SC', serif;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.3s, transform 0.3s;
        }
        .tag-cloud-item {
            transition: all 0.2s;
        }
        .tag-cloud-item:hover {
            transform: scale(1.1);
        }
        .theme-dark body {
            background-color: #1a1a2e;
            color: #e4e4e7;
        }
        .theme-dark header {
            background-color: #16213e;
        }
        .theme-dark header h1 {
            color: #f4f4f5;
        }
        .theme-dark header p {
            color: #a1a1aa;
        }
        .theme-dark article {
            background-color: #16213e;
        }
        .theme-dark article h2 {
            color: #f4f4f5;
        }
        .theme-dark article p {
            color: #d4d4d8;
        }
        .theme-dark aside > div {
            background-color: #16213e;
        }
        .theme-dark aside h3 {
            color: #f4f4f5;
        }
        .theme-dark footer {
            background-color: #0f0f23;
            color: #71717a;
        }
        .theme-warm body {
            background-color: #fef3e2;
            color: #78350f;
        }
        .theme-warm header {
            background-color: #ffedd5;
        }
        .theme-warm header h1 {
            color: #92400e;
        }
        .theme-warm header p {
            color: #a16207;
        }
        .theme-warm article {
            background-color: #fffbeb;
        }
        .theme-warm article h2 {
            color: #92400e;
        }
        .theme-warm article p {
            color: #78350f;
        }
        .theme-warm aside > div {
            background-color: #fffbeb;
        }
        .theme-warm aside h3 {
            color: #92400e;
        }
        .theme-warm footer {
            background-color: #92400e;
            color: #fef3c7;
        }
        .pre-line {
            white-space: pre-line;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">智慧博客</h1>
                <p class="text-gray-500 text-sm mt-1">一个具备AI能力的个人博客系统</p>
            </div>
            <nav class="flex space-x-4">
                <button onclick="showSection(event, 'home')" class="nav-btn text-gray-600 hover:text-blue-600 transition-colors font-medium">首页</button>
                <button onclick="showSection(event, 'manage')" class="nav-btn text-gray-600 hover:text-blue-600 transition-colors font-medium">文章管理</button>
                <button onclick="showSection(event, 'ai')" class="nav-btn text-gray-600 hover:text-blue-600 transition-colors font-medium">AI创造中心</button>
                <button onclick="showSection(event, 'theme')" class="nav-btn text-gray-600 hover:text-blue-600 transition-colors font-medium">主题换肤</button>
                <button onclick="showSection(event, 'deploy')" class="nav-btn text-gray-600 hover:text-blue-600 transition-colors font-medium">一键部署</button>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="home-section">
            <div class="flex gap-8">
                <div class="flex-1">
                    <div id="search-container" class="mb-8">
                        <div class="relative">
                            <input type="text" id="search-input" placeholder="搜索文章..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                            <button onclick="performSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-600">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div id="article-list">
                        <template id="article-item-template">
                            <article class="bg-white rounded-lg shadow-sm p-6 mb-6 hover:shadow-md transition-shadow cursor-pointer">
                                <h2 class="post-title text-xl font-bold text-gray-900 mb-2"></h2>
                                <p class="post-summary text-gray-600 mb-4 line-clamp-2"></p>
                                <div class="flex flex-wrap items-center gap-2 text-sm text-gray-500 mb-4">
                                    <span class="post-category bg-blue-100 text-blue-600 px-2 py-1 rounded"></span>
                                    <div class="post-tags"></div>
                                </div>
                                <div class="flex justify-between items-center text-sm text-gray-400">
                                    <span class="post-date"></span>
                                    <span class="post-views"></span>
                                </div>
                                <span class="inline-block mt-4 text-blue-600 hover:text-blue-800 font-medium">阅读全文 →</span>
                            </article>
                        </template>
                    </div>

                    <div id="article-detail" class="bg-white rounded-lg shadow-sm p-8 hidden">
                        <button onclick="backToList()" class="mb-6 text-gray-600 hover:text-blue-600 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                            </svg>
                            返回列表
                        </button>
                        <h1 id="detail-title" class="text-3xl font-bold text-gray-900 mb-4"></h1>
                        <div class="flex flex-wrap items-center gap-2 text-sm text-gray-500 mb-6">
                            <span id="detail-category" class="bg-blue-100 text-blue-600 px-2 py-1 rounded"></span>
                            <div id="detail-tags"></div>
                            <span id="detail-date" class="ml-auto"></span>
                        </div>
                        <div id="detail-content" class="prose prose-lg text-gray-700 leading-relaxed"></div>
                    </div>
                </div>

                <aside class="w-64">
                    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">文章分类</h3>
                        <div id="category-list" class="space-y-2"></div>
                    </div>

                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">标签云</h3>
                        <div id="tag-cloud" class="flex flex-wrap gap-2"></div>
                    </div>
                </aside>
            </div>
        </div>

        <div id="manage-section" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">文章管理</h2>
                <button onclick="showCreateArticle()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">+ 新建文章</button>
            </div>
            
            <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-sm font-medium text-gray-700">标题</th>
                            <th class="px-6 py-3 text-left text-sm font-medium text-gray-700">分类</th>
                            <th class="px-6 py-3 text-left text-sm font-medium text-gray-700">日期</th>
                            <th class="px-6 py-3 text-left text-sm font-medium text-gray-700">操作</th>
                        </tr>
                    </thead>
                    <tbody id="manage-table-body">
                    </tbody>
                </table>
            </div>

            <div id="article-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
                <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-2xl max-h-[90vh] overflow-auto">
                    <h3 class="text-xl font-bold text-gray-800 mb-6" id="modal-title">新建文章</h3>
                    <form id="article-form" class="space-y-4">
                        <input type="hidden" id="article-id">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">标题</label>
                            <input type="text" id="article-title" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                            <select id="article-category" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="技术分享">技术分享</option>
                                <option value="职业发展">职业发展</option>
                                <option value="运维部署">运维部署</option>
                                <option value="读书心得">读书心得</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">标签（逗号分隔）</label>
                            <input type="text" id="article-tags" placeholder="人工智能, 机器学习" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">摘要</label>
                            <textarea id="article-summary" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">内容</label>
                            <textarea id="article-content" rows="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                        </div>
                        <div class="flex justify-end space-x-4">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">取消</button>
                            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="ai-section" class="hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">AI创造中心</h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center">
                        <span class="bg-gradient-to-r from-purple-500 to-indigo-500 text-white px-3 py-1 rounded-lg text-sm mr-3">AI生成</span>
                        智能文章创作
                    </h3>
                    <textarea id="ai-input" rows="4" placeholder="输入创作主题，如：写一篇关于人工智能未来发展的文章..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none resize-none mb-4"></textarea>
                    <button onclick="generateContent()" class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-6 py-2 rounded-lg hover:from-purple-700 hover:to-indigo-700 transition-all flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        开始生成
                    </button>
                    <div id="ai-output" class="mt-4 p-4 bg-gray-50 rounded-lg border border-gray-200 min-h-[150px] text-gray-700"></div>
                </div>

                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center">
                        <span class="bg-gradient-to-r from-green-500 to-teal-500 text-white px-3 py-1 rounded-lg text-sm mr-3">智能润色</span>
                        文章优化提升
                    </h3>
                    <textarea id="polish-input" rows="4" placeholder="输入需要润色的文章内容..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none resize-none mb-4"></textarea>
                    <div class="flex gap-2 mb-4">
                        <select id="polish-type" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                            <option value="polish">智能润色</option>
                            <option value="rewrite">改写风格</option>
                            <option value="expand">扩写内容</option>
                        </select>
                    </div>
                    <button onclick="polishContent()" class="bg-gradient-to-r from-green-600 to-teal-600 text-white px-6 py-2 rounded-lg hover:from-green-700 hover:to-teal-700 transition-all flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        开始润色
                    </button>
                    <div id="polish-output" class="mt-4 p-4 bg-gray-50 rounded-lg border border-gray-200 min-h-[150px] text-gray-700"></div>
                </div>
            </div>
        </div>

        <div id="theme-section" class="hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">主题换肤</h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">当前主题</h3>
                    <div id="theme-preview" class="h-48 bg-gradient-to-br from-blue-50 to-indigo-100 rounded-lg border border-gray-200 flex items-center justify-center">
                        <span class="text-gray-500">默认主题预览</span>
                    </div>
                    <p class="mt-4 text-sm text-gray-500 text-center" id="current-theme-name">当前：默认主题</p>
                </div>
                
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">AI主题生成</h3>
                    <input type="text" id="theme-prompt" placeholder="描述你想要的主题风格，如：科技感深色主题..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none mb-4">
                    <button onclick="generateTheme()" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition-colors">生成主题</button>
                </div>
                
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">主题预设</h3>
                    <div class="space-y-2">
                        <button onclick="applyTheme('light')" class="w-full px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">🌞 明亮清爽</button>
                        <button onclick="applyTheme('dark')" class="w-full px-4 py-2 border border-gray-800 rounded-lg hover:bg-gray-900 transition-colors text-gray-300 bg-gray-800">🌙 深色护眼</button>
                        <button onclick="applyTheme('warm')" class="w-full px-4 py-2 border border-orange-300 rounded-lg hover:bg-orange-50 transition-colors">🍂 温暖秋日</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="deploy-section" class="hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">一键部署</h2>
            
            <div class="bg-white rounded-lg shadow-sm p-6 max-w-2xl">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">服务器地址</label>
                        <input type="text" id="deploy-host" placeholder="例如: 192.168.1.100" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">SSH端口</label>
                        <input type="number" id="deploy-port" value="22" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                        <input type="text" id="deploy-username" placeholder="例如: root" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">认证方式</label>
                        <div class="flex space-x-4">
                            <label class="flex items-center">
                                <input type="radio" name="auth-type" value="password" checked onchange="toggleAuthMethod()">
                                <span class="ml-2">密码</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="auth-type" value="key" onchange="toggleAuthMethod()">
                                <span class="ml-2">SSH密钥</span>
                            </label>
                        </div>
                    </div>
                    
                    <div id="password-field">
                        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <input type="password" id="deploy-password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                    <div id="key-field" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-1">SSH私钥</label>
                        <textarea id="deploy-key" rows="4" placeholder="粘贴您的SSH私钥" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm"></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">域名</label>
                        <input type="text" id="deploy-domain" placeholder="例如: blog.example.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                    <div class="flex space-x-4">
                        <button onclick="testDeployConnection()" class="bg-gray-600 text-white px-6 py-2 rounded-lg hover:bg-gray-700 transition-colors">测试连接</button>
                        <button onclick="executeDeploy()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition-colors">执行部署</button>
                    </div>
                    
                    <div id="deploy-result" class="mt-4 p-4 bg-gray-50 rounded-lg hidden pre-line"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-8 mt-16">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p>&copy; 2024 智慧博客 - 一个具备AI能力的个人博客系统</p>
            <p class="text-sm mt-2">本页面为交互式演示版本，所有数据均为模拟</p>
        </div>
    </footer>

    <script>
        let articles = [
            {
                id: 1,
                title: '人工智能的未来发展趋势',
                summary: '探讨AI技术在未来十年的发展方向，包括机器学习、深度学习、自然语言处理等领域的创新应用。',
                content: '<p>人工智能（Artificial Intelligence，简称AI）是当今科技领域最热门的话题之一。随着算力的不断提升和算法的持续优化，AI技术正在深刻改变我们的生活方式和工作模式。</p><h3>机器学习的突破</h3><p>机器学习作为AI的核心技术，近年来取得了显著进展。深度学习模型如GPT系列、BERT等在自然语言处理领域展现出惊人的能力，能够理解和生成人类语言。</p><h3>AI的应用场景</h3><p>从自动驾驶到智能助手，从医疗诊断到金融风控，AI技术已经渗透到各个行业。未来，AI将在更多领域发挥重要作用，推动社会进步。</p>',
                category: { name: '技术分享' },
                tags: ['人工智能', '机器学习', '深度学习'],
                created_at: '2024-01-15',
                views: 1234
            },
            {
                id: 2,
                title: 'Go语言高性能编程实践',
                summary: '分享Go语言在高并发场景下的性能优化技巧，包括协程调度、内存管理、锁的使用等方面的最佳实践。',
                content: '<p>Go语言以其简洁的语法和强大的并发能力，成为云原生时代最受欢迎的编程语言之一。本文将分享一些在实际项目中积累的性能优化经验。</p><h3>协程调度优化</h3><p>合理使用goroutine和channel可以充分利用多核CPU的优势。避免创建过多的goroutine，使用worker pool模式处理大量任务。</p><h3>内存管理技巧</h3><p>Go的垃圾回收机制虽然方便，但也需要注意内存分配的效率。对象池、切片预分配等技术可以有效减少GC压力。</p>',
                category: { name: '技术分享' },
                tags: ['Go', '编程', '性能优化'],
                created_at: '2024-01-12',
                views: 856
            },
            {
                id: 3,
                title: '打造个人技术品牌的心得',

                content: '<p>在技术领域，个人品牌的建立对于职业发展至关重要。一个良好的技术品牌可以让你在众多开发者中脱颖而出。</p><h3>持续输出优质内容</h3><p>写博客是建立技术品牌最直接的方式。选择自己擅长的领域，持续输出高质量的技术文章，可以吸引志同道合的读者。</p><h3>参与开源社区</h3><p>积极参与开源项目，贡献代码和文档，不仅可以提升技术能力，还能扩大自己的影响力。</p>',

            {

                title: 'Docker容器化部署实战',

                content: '<p>Docker的出现彻底改变了应用部署的方式，使得应用可以在任何环境中一致运行。本文将带你从零开始学习Docker容器化部署。</p><h3>Dockerfile编写技巧</h3><p>编写高效的Dockerfile是构建优质镜像的关键。使用多阶段构建、合理选择基础镜像、清理无用文件等技巧可以显著减小镜像体积。</p><h3>容器编排入门</h3><p>对于复杂应用，Docker Compose可以方便地管理多个容器之间的关系。学习docker-compose.yml的配置，可以轻松实现多容器应用的部署。</p>',
                category: { name: '运维部署' },

            },
            {
                id: 5,
                title: '阅读的力量：技术书籍推荐',
                summary: '推荐几本对技术人成长有帮助的经典书籍，涵盖编程思想、系统设计、技术管理等多个方面。',
                content: '<p>阅读是技术人持续成长的重要途径。一本好的技术书籍可以让你站在巨人的肩膀上，快速提升自己的视野和能力。</p><h3>编程思想类</h3><p>《代码大全》、《设计模式》等经典书籍可以帮助你建立良好的编程思维，写出高质量的代码。</p><h3>系统设计类</h3><p>《系统设计入门》、《分布式系统概念与设计》等书籍可以帮助你理解大型系统的设计原理。</p>',
                category: { name: '读书心得' },
                tags: ['阅读', '技术书籍', '学习'],
                created_at: '2024-01-05',
                views: 445
            }
        ];

        const mockCategories = ['技术分享', '职业发展', '运维部署', '读书心得'];
        const mockTags = ['人工智能', '机器学习', '深度学习', 'Go', '编程', '性能优化', '个人品牌', '职业发展', '技术博客', 'Docker', '容器化', 'DevOps', '阅读', '技术书籍', '学习'];

        let currentCategory = '';
        let currentTag = '';
        let searchQuery = '';
        let currentTheme = 'light';

        function init() {
            renderArticles();
            renderCategories();
            renderTags();
            renderManageTable();
            
            document.getElementById('search-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });

            document.getElementById('article-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveArticle();
            });
        }

        function showSection(event, sectionId) {
            document.querySelectorAll('main > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(sectionId + '-section').classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('text-blue-600', 'font-bold'));
            event.currentTarget.classList.add('text-blue-600', 'font-bold');
            
            if (sectionId === 'home') {
                renderArticles();
            } else if (sectionId === 'manage') {
                renderManageTable();
            }
        }

        function renderArticles() {
            const container = document.getElementById('article-list');
            const template = document.getElementById('article-item-template');
            
            const filteredArticles = articles.filter(article => {
                if (currentCategory && article.category.name !== currentCategory) return false;
                if (currentTag && !article.tags.includes(currentTag)) return false;
                if (searchQuery && 
                    !article.title.toLowerCase().includes(searchQuery.toLowerCase()) && 
                    !article.summary.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                return true;
            });

            container.innerHTML = '';
            container.appendChild(template);

            filteredArticles.forEach((article, index) => {
                const clone = template.content.cloneNode(true);
                const articleEl = clone.querySelector('article');
                
                articleEl.classList.add('fade-enter');
                setTimeout(() => articleEl.classList.add('fade-enter-active'), index * 50);
                
                clone.querySelector('.post-title').textContent = article.title;
                clone.querySelector('.post-summary').textContent = article.summary;
                clone.querySelector('.post-category').textContent = article.category.name;
                
                const tagsContainer = clone.querySelector('.post-tags');
                article.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs';
                    span.textContent = tag;
                    tagsContainer.appendChild(span);
                });
                
                clone.querySelector('.post-date').textContent = article.created_at;
                clone.querySelector('.post-views').textContent = `${article.views} 阅读`;
                
                articleEl.onclick = () => showArticleDetail(article);
                
                container.appendChild(clone);
            });

            if (filteredArticles.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-gray-500">暂无文章</div>';
            }
        }

        function renderCategories() {
            const container = document.getElementById('category-list');
            container.innerHTML = '';
            
            const allItem = document.createElement('button');
            allItem.className = 'w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors ' + (currentCategory === '' ? 'bg-blue-50 text-blue-600' : 'text-gray-600');
            allItem.textContent = '全部文章';
            allItem.onclick = () => { currentCategory = ''; renderArticles(); highlightCategory(allItem); };
            container.appendChild(allItem);
            
            mockCategories.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors ' + (currentCategory === name ? 'bg-blue-50 text-blue-600' : 'text-gray-600');
                btn.textContent = name;
                btn.onclick = () => { currentCategory = name; renderArticles(); highlightCategory(btn); };
                container.appendChild(btn);
            });
        }

        function highlightCategory(activeBtn) {
            document.querySelectorAll('#category-list button').forEach(btn => {
                btn.className = 'w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors text-gray-600';
            });
            activeBtn.className = 'w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors bg-blue-50 text-blue-600';
        }

        function renderTags() {
            const container = document.getElementById('tag-cloud');
            container.innerHTML = '';
            
            mockTags.forEach(tag => {
                const btn = document.createElement('button');
                const sizes = ['text-xs', 'text-sm', 'text-base', 'text-lg'];
                const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
                const colors = ['bg-blue-100 text-blue-600', 'bg-green-100 text-green-600', 'bg-purple-100 text-purple-600', 'bg-orange-100 text-orange-600', 'bg-pink-100 text-pink-600'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                btn.className = `px-3 py-1 rounded-full ${randomSize} ${randomColor} tag-cloud-item`;
                btn.textContent = tag;
                btn.onclick = () => toggleTag(tag);
                container.appendChild(btn);
            });
        }

        function toggleTag(tag) {
            if (currentTag === tag) {
                currentTag = '';
            } else {
                currentTag = tag;
            }
            renderArticles();
            renderTags();
        }

        function performSearch() {
            searchQuery = document.getElementById('search-input').value;
            currentCategory = '';
            currentTag = '';
            renderArticles();
            renderCategories();
        }

        function showArticleDetail(article) {
            document.getElementById('article-list').style.display = 'none';
            document.getElementById('article-detail').style.display = 'block';
            
            document.getElementById('detail-title').textContent = article.title;
            document.getElementById('detail-category').textContent = article.category.name;
            document.getElementById('detail-date').textContent = article.created_at;
            document.getElementById('detail-content').innerHTML = article.content;
            
            const tagsContainer = document.getElementById('detail-tags');
            tagsContainer.innerHTML = '';
            article.tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs';
                span.textContent = tag;
                tagsContainer.appendChild(span);
            });
        }

        function backToList() {
            document.getElementById('article-detail').style.display = 'none';
            document.getElementById('article-list').style.display = 'block';
        }

        function renderManageTable() {
            const tbody = document.getElementById('manage-table-body');
            tbody.innerHTML = '';
            
            articles.forEach(article => {
                const row = document.createElement('tr');
                row.className = 'border-b hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-6 py-4 text-sm font-medium text-gray-900">${article.title}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${article.category.name}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${article.created_at}</td>
                    <td class="px-6 py-4 text-sm">
                        <button onclick="editArticle(${article.id})" class="text-blue-600 hover:text-blue-800 mr-4">编辑</button>
                        <button onclick="deleteArticle(${article.id})" class="text-red-600 hover:text-red-800">删除</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function showCreateArticle() {
            document.getElementById('modal-title').textContent = '新建文章';
            document.getElementById('article-id').value = '';
            document.getElementById('article-title').value = '';
            document.getElementById('article-category').value = '技术分享';
            document.getElementById('article-tags').value = '';
            document.getElementById('article-summary').value = '';
            document.getElementById('article-content').value = '';
            document.getElementById('article-modal').classList.remove('hidden');
        }

        function editArticle(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;
            
            document.getElementById('modal-title').textContent = '编辑文章';
            document.getElementById('article-id').value = article.id;
            document.getElementById('article-title').value = article.title;
            document.getElementById('article-category').value = article.category.name;
            document.getElementById('article-tags').value = article.tags.join(', ');
            document.getElementById('article-summary').value = article.summary;
            document.getElementById('article-content').value = article.content.replace(/<\/?[^>]+(>|$)/g, '');
            document.getElementById('article-modal').classList.remove('hidden');
        }

        function deleteArticle(id) {
            if (confirm('确定要删除这篇文章吗？')) {
                articles = articles.filter(a => a.id !== id);
                renderManageTable();
                renderArticles();
            }
        }

        function closeModal() {
            document.getElementById('article-modal').classList.add('hidden');
        }

        function saveArticle() {
            const id = document.getElementById('article-id').value;
            const title = document.getElementById('article-title').value;
            const categoryName = document.getElementById('article-category').value;
            const tags = document.getElementById('article-tags').value.split(',').map(t => t.trim()).filter(t => t);
            const summary = document.getElementById('article-summary').value;
            const content = document.getElementById('article-content').value;
            
            if (!title || !summary || !content) {
                alert('请填写完整信息');
                return;
            }
            
            if (id) {
                const index = articles.findIndex(a => a.id === parseInt(id));
                if (index !== -1) {
                    articles[index] = {
                        ...articles[index],
                        title,
                        summary,
                        content: `<p>${content.replace(/\n/g, '</p><p>')}</p>`,
                        category: { name: categoryName },
                        tags
                    };
                }
            } else {
                const newId = articles.length > 0 ? Math.max(...articles.map(a => a.id)) + 1 : 1;
                articles.push({
                    id: newId,
                    title,
                    summary,
                    content: `<p>${content.replace(/\n/g, '</p><p>')}</p>`,
                    category: { name: categoryName },
                    tags,
                    created_at: new Date().toISOString().split('T')[0],
                    views: 0
                });
            }
            
            closeModal();
            renderManageTable();
            renderArticles();
        }

        function generateContent() {
            const input = document.getElementById('ai-input').value;
            const output = document.getElementById('ai-output');
            
            if (!input.trim()) {
                alert('请输入创作主题');
                return;
            }
            
            output.textContent = 'AI正在思考中...';
            
            setTimeout(() => {
                output.textContent = `根据您的主题 "${input}"，AI生成了以下内容：

在当今数字化时代，人工智能技术正以前所未有的速度发展。从智能家居到自动驾驶，AI已经渗透到我们生活的方方面面。

本文将深入探讨AI技术的核心原理，包括机器学习算法、神经网络架构等关键概念。通过实际案例分析，帮助读者理解AI如何解决复杂问题。

同时，我们也将讨论AI发展带来的伦理问题和社会影响，探讨如何在技术进步与人类福祉之间找到平衡。

这是一篇由AI辅助生成的文章，展示了智慧博客系统的AI创作能力。`;
            }, 2000);
        }

        function polishContent() {
            const input = document.getElementById('polish-input').value;
            const type = document.getElementById('polish-type').value;
            const output = document.getElementById('polish-output');
            
            if (!input.trim()) {
                alert('请输入需要润色的内容');
                return;
            }
            
            output.textContent = 'AI正在润色中...';
            
            setTimeout(() => {
                const typeNames = { 'polish': '智能润色', 'rewrite': '改写风格', 'expand': '扩写内容' };
                output.textContent = `【${typeNames[type]}结果】

经过AI智能处理，您的内容已优化如下：

${input}

---

优化说明：
1. 语法结构优化：调整了句子结构，使表达更加流畅自然
2. 词汇丰富度提升：替换了重复词汇，增加了表达的多样性
3. 逻辑连贯性增强：优化了段落之间的过渡，使整体结构更加清晰
4. 专业术语规范：统一了专业术语的使用，提升了文章的专业性

智慧博客的AI润色功能可以帮助您快速提升文章质量！`;
            }, 1500);
        }

        function generateTheme() {
            const prompt = document.getElementById('theme-prompt').value;
            if (!prompt.trim()) {
                alert('请输入主题描述');
                return;
            }
            
            applyTheme('dark');
            setTimeout(() => {
                applyTheme('warm');
                setTimeout(() => {
                    applyTheme('light');
                    alert(`主题生成功能演示：\n\n根据您的描述 "${prompt}"，AI将为您生成独特的主题样式。\n\n实际系统中，此功能会通过大模型API生成完整的CSS样式，并提供沙箱预览。`);
                }, 500);
            }, 500);
        }

        function applyTheme(theme) {
            document.documentElement.classList.remove('theme-dark', 'theme-warm');
            
            if (theme === 'dark') {
                document.documentElement.classList.add('theme-dark');
                document.getElementById('current-theme-name').textContent = '当前：🌙 深色护眼';
                document.getElementById('theme-preview').className = 'h-48 bg-gradient-to-br from-gray-800 to-gray-900 rounded-lg border border-gray-700 flex items-center justify-center';
                document.getElementById('theme-preview').innerHTML = '<span class="text-gray-300">深色主题预览</span>';
            } else if (theme === 'warm') {
                document.documentElement.classList.add('theme-warm');
                document.getElementById('current-theme-name').textContent = '当前：🍂 温暖秋日';
                document.getElementById('theme-preview').className = 'h-48 bg-gradient-to-br from-orange-100 to-amber-200 rounded-lg border border-orange-300 flex items-center justify-center';
                document.getElementById('theme-preview').innerHTML = '<span class="text-orange-800">温暖主题预览</span>';
            } else {
                document.getElementById('current-theme-name').textContent = '当前：🌞 明亮清爽';
                document.getElementById('theme-preview').className = 'h-48 bg-gradient-to-br from-blue-50 to-indigo-100 rounded-lg border border-gray-200 flex items-center justify-center';
                document.getElementById('theme-preview').innerHTML = '<span class="text-gray-500">默认主题预览</span>';
            }
            
            currentTheme = theme;
        }

        function toggleAuthMethod() {
            const authType = document.querySelector('input[name="auth-type"]:checked').value;
            if (authType === 'password') {
                document.getElementById('password-field').classList.remove('hidden');
                document.getElementById('key-field').classList.add('hidden');
            } else {
                document.getElementById('password-field').classList.add('hidden');
                document.getElementById('key-field').classList.remove('hidden');
            }
        }

        function testDeployConnection() {
            const host = document.getElementById('deploy-host').value;
            const port = document.getElementById('deploy-port').value;
            const username = document.getElementById('deploy-username').value;
            
            if (!host || !username) {
                alert('请填写服务器地址和用户名');
                return;
            }
            
            const resultDiv = document.getElementById('deploy-result');
            resultDiv.classList.remove('hidden');
            resultDiv.className = 'mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg pre-line';
            resultDiv.textContent = '正在测试连接...';
            
            setTimeout(() => {
                resultDiv.className = 'mt-4 p-4 bg-green-50 border border-green-200 rounded-lg pre-line';
                resultDiv.textContent = '✓ 连接测试成功！\n\n服务器信息：\n- 地址：' + host + '\n- 端口：' + port + '\n- 用户：' + username + '\n\nSSH连接已就绪，可以进行部署。';
            }, 1500);
        }

        function executeDeploy() {
            const host = document.getElementById('deploy-host').value;
            const domain = document.getElementById('deploy-domain').value;
            
            if (!host) {
                alert('请填写服务器地址');
                return;
            }
            
            const resultDiv = document.getElementById('deploy-result');
            resultDiv.classList.remove('hidden');
            resultDiv.className = 'mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg pre-line';
            resultDiv.textContent = '部署中...\n\n1. 构建Linux二进制文件\n2. 建立SSH连接\n3. 上传文件到服务器\n4. 配置服务\n5. 启动博客服务';
            
            setTimeout(() => {
                resultDiv.className = 'mt-4 p-4 bg-green-50 border border-green-200 rounded-lg pre-line';
                resultDiv.textContent = '✓ 部署成功！\n\n部署信息：\n- 服务器：' + host + '\n- 域名：' + (domain || '未配置') + '\n- 状态：服务已启动\n\n您的博客已成功部署到远程服务器！\n访问地址：http://' + (domain || host) + ':8080';
            }, 3000);
        }

        init();
    </script>
</body>
</html>
