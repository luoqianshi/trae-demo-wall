<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>智析Agent - 交互式Demo</title>
    <style id="theme-vars">
/* ================================================================
   智析Agent — Brand Design Tokens
   Style: Professional Cold Tech / B2B Data Analytics SaaS
   ================================================================ */

:root {
  /* ---- Color System ---- */
  --color-primary: #1E40AF;
  --color-primary-hover: #1D3A9A;
  --color-primary-light: #DBEAFE;
  --color-primary-bg: #EFF6FF;
  --color-primary-50: #EFF6FF;
  --color-primary-100: #DBEAFE;
  --color-primary-200: #BFDBFE;
  --color-primary-500: #3B82F6;
  --color-primary-600: #2563EB;
  --color-primary-700: #1D4ED8;
  --color-primary-800: #1E40AF;
  --color-primary-900: #1E3A8A;

  /* Background */
  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-surface-elevated: #FFFFFF;
  --color-bg-sidebar: #0F172A;
  --color-bg-sidebar-hover: #1E293B;
  --color-bg-sidebar-active: #1E40AF;

  /* Text */
  --color-text-primary: #0F172A;
  --color-text-secondary: #475569;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-text-sidebar: #CBD5E1;
  --color-text-sidebar-active: #FFFFFF;

  /* Border */
  --color-border: #E2E8F0;
  --color-border-light: #F1F5F9;
  --color-border-dark: #CBD5E1;

  /* State Colors */
  --state-success: #059669;
  --state-success-bg: #D1FAE5;
  --state-warning: #D97706;
  --state-warning-bg: #FEF3C7;
  --state-error: #DC2626;
  --state-error-bg: #FEE2E2;
  --state-info: #2563EB;
  --state-info-bg: #DBEAFE;

  /* Chart Colors */
  --chart-1: #3B82F6;
  --chart-2: #06B6D4;
  --chart-3: #10B981;
  --chart-4: #F59E0B;
  --chart-5: #EF4444;
  --chart-6: #8B5CF6;
  --chart-7: #EC4899;

  /* ---- Typography ---- */
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 30px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  /* ---- Spacing ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ---- Radius ---- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ---- Shadow ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.05);
  --shadow-float: 0 12px 24px rgba(0, 0, 0, 0.08);
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style id="shell-styles">
      /* ---- Project Shell Layout ---- */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-body);
        font-size: var(--text-base);
        color: var(--color-text-primary);
        background: var(--color-bg-page);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Sidebar */
      .shell-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        background: var(--color-bg-sidebar);
        display: flex;
        flex-direction: column;
        z-index: 100;
        overflow: hidden;
      }
      .shell-sidebar::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(30, 64, 175, 0.08) 0%, transparent 40%, rgba(15, 23, 42, 0.12) 100%);
        pointer-events: none;
        z-index: 0;
      }
      .shell-sidebar > * { position: relative; z-index: 1; }

      /* Logo area */
      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-5) var(--space-5) var(--space-6);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .sidebar-logo-icon {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        color: var(--color-primary-500, #3B82F6);
      }
      .sidebar-logo-text {
        font-size: var(--text-lg);
        font-weight: 700;
        color: #FFFFFF;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      /* Nav items */
      .sidebar-nav {
        flex: 1;
        padding: var(--space-3) var(--space-3);
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
      }
      .sidebar-nav-item {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-md);
        color: var(--color-text-sidebar);
        font-size: var(--text-base);
        font-weight: 400;
        cursor: pointer;
        transition: all 150ms ease;
        text-decoration: none;
        white-space: nowrap;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
      }
      .sidebar-nav-item:hover {
        background: var(--color-bg-sidebar-hover);
        color: #FFFFFF;
      }
      .sidebar-nav-item.active {
        background: var(--color-bg-sidebar-active);
        color: var(--color-text-sidebar-active);
        font-weight: 500;
      }
      .sidebar-nav-item svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      /* Sidebar footer */
      .sidebar-footer {
        padding: var(--space-4) var(--space-5);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sidebar-version {
        font-size: var(--text-xs);
        color: var(--color-text-tertiary);
        background: rgba(255, 255, 255, 0.06);
        padding: 2px var(--space-2);
        border-radius: var(--radius-full);
        white-space: nowrap;
      }
      .sidebar-settings-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: var(--radius-sm);
        color: var(--color-text-sidebar);
        cursor: pointer;
        transition: all 150ms ease;
        background: transparent;
        border: none;
      }
      .sidebar-settings-btn:hover {
        background: var(--color-bg-sidebar-hover);
        color: #FFFFFF;
      }
      .sidebar-settings-btn svg {
        width: 16px;
        height: 16px;
      }

      /* Main wrapper */
      .shell-main-wrapper {
        margin-left: 240px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--color-bg-page);
      }

      /* Top bar */
      .shell-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
        padding: 0 var(--space-6);
        background: var(--color-bg-surface);
        border-bottom: 1px solid var(--color-border);
        flex-shrink: 0;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        min-width: 200px;
      }
      .topbar-title {
        font-size: var(--text-xl);
        font-weight: 600;
        color: var(--color-text-primary);
        white-space: nowrap;
      }
      .topbar-center {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .topbar-scene-selector {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-bg-surface);
        color: var(--color-text-secondary);
        font-size: var(--text-sm);
        cursor: pointer;
        transition: all 150ms ease;
        white-space: nowrap;
      }
      .topbar-scene-selector:hover {
        border-color: var(--color-border-dark);
        color: var(--color-text-primary);
      }
      .topbar-scene-selector svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        min-width: 200px;
        justify-content: flex-end;
      }
      .topbar-icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-md);
        color: var(--color-text-secondary);
        cursor: pointer;
        transition: all 150ms ease;
        background: transparent;
        border: none;
        position: relative;
      }
      .topbar-icon-btn:hover {
        background: var(--color-bg-page);
        color: var(--color-text-primary);
      }
      .topbar-icon-btn svg {
        width: 18px;
        height: 18px;
      }
      .topbar-avatar {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-full);
        background: var(--color-primary);
        color: var(--color-text-inverse);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-sm);
        font-weight: 600;
        cursor: pointer;
        transition: all 150ms ease;
        flex-shrink: 0;
      }
      .topbar-avatar:hover {
        opacity: 0.9;
      }

      /* Notification badge */
      .notification-dot {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 7px;
        height: 7px;
        background: var(--state-error, #DC2626);
        border-radius: var(--radius-full);
        border: 1.5px solid var(--color-bg-surface);
      }

      /* Main content area */
      .shell-content {
        flex: 1;
        padding: var(--space-6);
        overflow-y: auto;
      }

      /* Card style */
      .card {
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
      }
    </style>
</head>

  <!-- ===== EMBEDDED PAGE TEMPLATES ===== -->

  <script type="text/html" id="tmpl-dashboard">
    <style id="page-dashboard-styles">
/* ===================== */
      /* Dashboard Page Styles */
      /* ===================== */

      /* KPI Cards Grid */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-5);
        margin-bottom: var(--space-6);
      }
      .kpi-card {
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-5);
        box-shadow: var(--shadow-card);
        display: flex;
        align-items: flex-start;
        gap: var(--space-4);
        transition: box-shadow 200ms ease, transform 200ms ease;
      }
      .kpi-card:hover {
        box-shadow: var(--shadow-lg);
        transform: translateY(-1px);
      }
      .kpi-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .kpi-icon svg {
        width: 20px;
        height: 20px;
      }
      .kpi-body {
        flex: 1;
        min-width: 0;
      }
      .kpi-label {
        font-size: var(--text-sm);
        color: var(--color-text-secondary);
        margin-bottom: var(--space-1);
        line-height: var(--leading-normal);
      }
      .kpi-value {
        font-size: var(--text-3xl);
        font-weight: 700;
        color: var(--color-text-primary);
        line-height: var(--leading-tight);
        margin-bottom: var(--space-1);
      }
      .kpi-trend {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: var(--text-xs);
        font-weight: 500;
        padding: 2px 6px;
        border-radius: var(--radius-full);
      }
      .kpi-trend.up {
        color: var(--state-success);
        background: var(--state-success-bg);
      }
      .kpi-trend.down {
        color: var(--state-error);
        background: var(--state-error-bg);
      }
      .kpi-trend svg {
        width: 12px;
        height: 12px;
      }

      /* Two-column layout */
      .two-col {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: var(--space-5);
        margin-bottom: var(--space-6);
      }
      .col-card {
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-5);
        box-shadow: var(--shadow-card);
      }
      .col-card + .col-card {
        /* gap handled by grid */
      }
      .col-card-title {
        font-size: var(--text-lg);
        font-weight: 600;
        color: var(--color-text-primary);
        margin-bottom: var(--space-4);

    <style id="page-smart-query-styles">
/* ========== Smart Query Chat Styles ========== */
      .chat-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 56px);
        background: var(--color-bg-page);
      }

      /* Chat history area */
      .chat-history {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-6) var(--space-8);
        display: flex;
        flex-direction: column;
        gap: var(--space-6);

      .chat-row {
        display: flex;
        gap: var(--space-3);
        max-width: 80%;

      .chat-row.user {
        align-self: flex-end;
        flex-direction: row-reverse;
        max-width: 60%;
      }
      .chat-row.ai {
        align-self: flex-start;
        max-width: 70%;
      }

      /* AI avatar */
      .chat-avatar {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-full);
        background: var(--color-primary);
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-xs);
        font-weight: 700;
        flex-shrink: 0;
        letter-spacing: 0.5px;
      }

      /* Chat bubbles */
      .chat-bubble {
        border-radius: var(--radius-lg);
        padding: var(--space-4);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
      }
      .chat-bubble.user {
        background: var(--color-primary-bg);
        color: var(--color-primary);
        border-top-right-radius: var(--radius-sm);

      .chat-bubble.ai {
        background: var(--color-bg-surface);
        color: var(--color-text-primary);
        border: 1px solid var(--color-border);
        border-top-left-radius: var(--radius-sm);
      }

      /* AI bubble content */
      .ai-text {
        margin-bottom: var(--space-3);
      }
      .ai-text:last-child {
        margin-bottom: 0;
      }
      .ai-text strong {
        font-weight: 600;
        color: var(--color-text-primary);
      }

      /* Mini data card inside AI bubble */
      .mini-data-card {
        margin-top: var(--space-3);

        font-weight: 700;
        color: var(--color-text-primary);
        letter-spacing: -0.02em;
      }
      .mini-data-card .metric-trend {
        font-size: var(--text-sm);
        font-weight: 500;
        color: var(--state-success);
        display: flex;
        align-items: center;
        gap: var(--space-1);

      .mini-data-card .metric-trend.down {
        color: var(--state-error);
      }

      .sparkline-area {
        margin-top: var(--space-2);
      }

      /* Mini bar chart */
      .mini-bar-chart {
        margin-top: var(--space-3);
        display: flex;
        flex-direction: column;
        gap: var(--space-2);

        flex-shrink: 0;

        position: relative;

        font-size: var(--text-sm);
        font-weight: 500;
        color: var(--state-error);
      }

      /* Analysis text */
      .ai-analysis {

      /* Input area */
      .chat-input-area {

        border-top: 1px solid var(--color-border);
        flex-shrink: 0;
      }
      .chat-input-row {
        display: flex;
        gap: var(--space-3);
        align-items: center;
      }
      .chat-input {
        flex: 1;
        height: 44px;
        padding: 0 var(--space-4);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        font-size: var(--text-base);
        font-family: var(--font-body);
        color: var(--color-text-primary);
        background: var(--color-bg-surface);
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }
      .chat-input::placeholder {
        color: var(--color-text-tertiary);
      }
      .chat-input:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
      }
      .chat-send-btn {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-full);
        background: var(--color-primary);
        color: #FFFFFF;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 150ms ease;

      .chat-send-btn:hover {
        background: var(--color-primary-hover);

      /* Suggested questions */
      .suggested-questions {
        display: flex;

      .suggested-chip {
        padding: var(--space-1) var(--space-3);

        border-radius: var(--radius-full);
        background: var(--color-bg-surface);
        color: var(--color-text-secondary);
        font-size: var(--text-sm);
        cursor: pointer;
        transition: all 150ms ease;
        white-space: nowrap;
        user-select: none;
      }
      .suggested-chip:hover {
        border-color: var(--color-primary);
        color: var(--color-primary);
        background: var(--color-primary-bg);
      }

      /* Chat history scrollbar */
      .chat-history::-webkit-scrollbar {
        width: 6px;
      }
      .chat-history::-webkit-scrollbar-track {
        background: transparent;
      }
      .chat-history::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border-radius: 3px;
      }
      .chat-history::-webkit-scrollbar-thumb:hover {
        background: var(--color-border-dark);
      }

        padding: var(--space-2) var(--space-4);
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
        font-weight: 500;
        cursor: pointer;
        transition: all 150ms ease;

        text-decoration: none;
        border: none;

      .btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;

      .btn-primary {
        background: var(--color-primary);
        color: var(--color-text-inverse);
        border: 1px solid var(--color-primary);
      }
      .btn-primary:hover {
        background: var(--color-primary-hover);
        border-color: var(--color-primary-hover);
      }
      .btn-outline {
        background: var(--color-bg-surface);
        color: var(--color-text-secondary);
        border: 1px solid var(--color-border);
      }
      .btn-outline:hover {
        background: var(--color-bg-page);
        border-color: var(--color-border-dark);
        color: var(--color-text-primary);
      }
      .btn-sm {
        padding: var(--space-1) var(--space-3);
        font-size: var(--text-sm);
      }
      .btn-text {
        background: transparent;
        border: none;
        color: var(--color-text-secondary);
        padding: var(--space-1) var(--space-2);
        font-size: var(--text-sm);
        cursor: pointer;
        transition: color 150ms ease;
        font-family: var(--font-body);
      }
      .btn-text:hover {
        color: var(--color-primary);
      }
      .btn-text-danger {
        color: var(--state-error);
      }
      .btn-text-danger:hover {
        color: #B91C1C;
      }

      /* Scene Cards Grid */
      .scene-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: var(--space-6);
      }

      /* Scene Card */
      .scene-card {
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: var(--space-6);
        position: relative;
        transition: all 200ms ease;
        overflow: hidden;

      .scene-card:hover {
        box-shadow: var(--shadow-md);
      }
      .scene-card-top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
      }
      .scene-card.active-scene {
        border-left: 3px solid var(--color-primary);
        box-shadow: var(--shadow-md);
      }
      .scene-card.active-scene .scene-card-top-bar {
        background: var(--color-primary);
      }
      .scene-card.inactive-scene .scene-card-top-bar {
        background: var(--color-border);
      }

      /* Scene Card Header */
      .scene-card-header {
        display: flex;
        align-items: flex-start;
        gap: var(--space-4);
        margin-bottom: var(--space-4);
      }
      .scene-card-icon {

        height: 48px;

      }

        flex: 1;
        min-width: 0;

        font-weight: 600;
        color: var(--color-text-primary);
        margin-bottom: var(--space-1);

      /* Metadata Row */
      .scene-metadata {
        display: flex;
        align-items: center;
        gap: var(--space-5);

        padding-bottom: var(--space-4);

        display: flex;
        align-items: center;
        gap: var(--space-3);
      }

        justify-content: center;

      }
      .scene-card-add:hover {

        background: var(--color-primary-bg);
      }
      .scene-card-add-icon {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-full);
        background: var(--color-border-light);
        color: var(--color-text-tertiary);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: var(--space-4);

      }
      .scene-card-add:hover .scene-card-add-icon {
        background: var(--color-primary-bg);
        color: var(--color-primary);
      }
      .scene-card-add-icon svg {
        width: 24px;
        height: 24px;
      }
      .scene-card-add-title {
        font-size: var(--text-base);
        font-weight: 500;
        color: var(--color-text-secondary);
        margin-bottom: var(--space-1);
      }
      .scene-card-add:hover .scene-card-add-title {
        color: var(--color-primary);
      }
      .scene-card-add-subtitle {
        font-size: var(--text-sm);
        color: var(--color-text-tertiary);
      }

      /* Info Section */
      .scene-info-section {
        margin-top: var(--space-6);
      }
      .scene-info-card {
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--space-6);
      }
      .scene-info-card details {
        margin: 0;
      }
      .scene-info-card summary {
        font-size: var(--text-base);
        font-weight: 600;
        color: var(--color-text-primary);
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        user-select: none;
      }
      .scene-info-card summary::-webkit-details-marker {
        display: none;
      }
      .scene-info-card summary::before {
        content: '';

        width: 16px;
        height: 16px;
        background: none;
        border-left: 2px solid var(--color-text-tertiary);
        border-bottom: 2px solid var(--color-text-tertiary);
        transform: rotate(-45deg);
        transition: transform 150ms ease;
        flex-shrink: 0;
        margin-right: var(--space-1);
      }
      .scene-info-card details[open] summary::before {
        transform: rotate(45deg);
      }
      .scene-info-card .info-content {
        margin-top: var(--space-4);
        font-size: var(--text-sm);
        color: var(--color-text-secondary);
        line-height: var(--leading-relaxed);
      }
      .scene-info-card .info-content p {
        margin: 0 0 var(--space-3);
      }
      .scene-info-card .info-content p:last-child {

      .config-file-list {
        display: flex;

        gap: var(--space-2);

      .config-file-tag {

        border-radius: var(--radius-sm);
        font-size: var(--text-xs);
        font-family: var(--font-mono);
        font-weight: 500;
      }

                </div>
            </div>
        
  </script>
