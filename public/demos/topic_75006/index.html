/* ===== Tokyo Night Theme ===== */
:root{

.topbar .spacer{flex:1}
.topbar .tb-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 10px;border-radius:var(--radius-sm);transition:.2s}
.topbar .tb-item:hover{background:var(--bg3)}

.main{overflow-y:auto;padding:24px}

.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}

.btn-success{background:var(--good);color:#fff}

.card{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:18px}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}

.stat .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}

/* Badges */
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}

.badge.position{background:rgba(158,206,106,.15);color:var(--good)}

.badge.sim{background:rgba(125,207,255,.15);color:var(--accent3)}

/* Form */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg3);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:8px 12px;color:var(--ink);font-size:13px;font-family:var(--font-sans)}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent)}

.toast.success{border-left:3px solid var(--good)}
.toast.error{border-left:3px solid var(--bad)}

.tmpl-card h4{font-size:14px;font-weight:700;margin-bottom:4px}
.tmpl-card p{font-size:11px;color:var(--dim);line-height:1.5}
.tmpl-card .params{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tmpl-card .param{font-size:10px;background:var(--bg3);padding:2px 6px;border-radius:4px;color:var(--muted);font-family:var(--font-mono)}

/* State machine */
.state-machine{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.state-node{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--rule)}
.state-node.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.state-node.done{background:var(--bg3);color:var(--good);border-color:var(--good)}
.state-node.pending{background:var(--bg3);color:var(--dim)}
.state-arrow{color:var(--dim);font-size:12px}

/* Trade feed */
.feed{max-height:400px;overflow-y:auto}
.feed-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:12px;animation:feedIn .3s}
@keyframes feedIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.feed-item .time{color:var(--dim);font-family:var(--font-mono);font-size:11px;white-space:nowrap}
.feed-item .side{font-weight:700;font-size:11px;padding:1px 6px;border-radius:3px}
.feed-item .side.buy{background:rgba(158,206,106,.15);color:var(--good)}
.feed-item .side.sell{background:rgba(247,118,142,.15);color:var(--bad)}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--rule)}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;transition:.2s;font-weight:600}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Chart container */
.chart-box{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:16px}
.chart-box .chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.chart-box .chart-head h3{font-size:14px;font-weight:700}
.chart-area{width:100%;min-height:320px}

/* Progress */
.progress{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;transition:width .5s}
.progress-bar.good{background:var(--good)}
.progress-bar.warn{background:var(--warn)}
.progress-bar.bad{background:var(--bad)}
.progress-bar.accent{background:var(--accent)}

/* Misc */
.mono{font-family:var(--font-mono)}
.text-good{color:var(--good)}.text-bad{color:var(--bad)}.text-warn{color:var(--warn)}.text-dim{color:var(--dim)}.text-accent{color:var(--accent)}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mb-16{margin-bottom:16px}
.fw-700{font-weight:700}.fs-12{font-size:12px}.fs-11{font-size:11px}.fs-24{font-size:24px}
.w-full{width:100%}
.ml-auto{margin-left:auto}
.hidden{display:none}
.divider{height:1px;background:var(--rule);margin:16px 0}
.tag{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--bg3);color:var(--muted);font-weight:600}
.tag.trend{color:var(--accent)}.tag.breakout{color:var(--accent2)}.tag.reversion{color:var(--accent3)}.tag.momentum{color:var(--warn)}

/* Wizard steps */
.wizard-steps{display:flex;align-items:center;margin-bottom:24px}

.wizard-step.active{color:var(--accent)}
.wizard-step.active .num{background:var(--accent);color:#fff}
.wizard-step.done{color:var(--good)}
.wizard-step.done .num{background:var(--good);color:#fff}
.wizard-line{flex:1;height:2px;background:var(--rule);margin:0 8px}

/* Exchange icons */
.exch-logo{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}

.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--rule)}

.timeline-item.buy::before{background:var(--good)}
.timeline-item.sell::before{background:var(--bad)}
.timeline-item .tl-time{font-size:11px;color:var(--dim);font-family:var(--font-mono)}

/* Heatmap cells */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.heat-cell{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;cursor:pointer;transition:.2s}

/* Market card */
.mkt-card{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.2s;position:relative}

.mkt-card .mkt-stats .stat-item{text-align:center}
.mkt-card .mkt-stats .stat-item .v{font-weight:700;font-size:14px}
.mkt-card .mkt-stats .stat-item .l{color:var(--dim);font-size:10px}

/* Smart order */
.order-preview{background:var(--bg4);border:1px solid var(--rule);border-radius:var(--radius);padding:14px;font-size:12px}
.order-preview .row{display:flex;justify-content:space-between;padding:4px 0}
.order-preview .row .l{color:var(--dim)}
.order-preview .row .v{font-weight:600;font-family:var(--font-mono)}

/* Alert item */
.alert-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:8px;transition:.2s}

/* Attribution bar */
.attr-bar{display:flex;height:24px;border-radius:4px;overflow:hidden;margin-top:4px}

/* Toggle switch */
.toggle{position:relative;width:36px;height:20px;background:var(--bg3);border-radius:10px;cursor:pointer;transition:.2s}

.tip:hover::after{opacity:1}

// ===== Utility Functions =====
function $(sel){return document.querySelector(sel)}
function $$(sel){return document.querySelectorAll(sel)}
function fmt(n,d=2){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtTime(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function rnd(min,max){return Math.random()*(max-min)+min}
function rndInt(min,max){return Math.floor(rnd(min,max+1))}
function uid(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).substr(2,4)}

function toast(msg,type='info'){
  const wrap=$('#toastWrap');
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  const icons={success:'✅',error:'❌',info:'ℹ️',warn:'⚠️'};
  el.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(40px)';setTimeout(()=>el.remove(),300)},3500);
}

}

      backgroundColor:'transparent',

      xAxis:{type:'category',data:data.map((_,i)=>'D'+(i+1)),axisLine:{lineStyle:{color:'rgba(192,202,245,.1)'}},axisLabel:{color:'#565f89',fontSize:10}},
      yAxis:{type:'value',axisLine:{show:false},splitLine:{lineStyle:{color:'rgba(192,202,245,.06)'}},axisLabel:{color:'#565f89',fontSize:10}},
      series:[{type:'line',data:data,smooth:true,symbol:'none',lineStyle:{color:'#7aa2f7',width:2},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(122,162,247,.3)'},{offset:1,color:'rgba(122,162,247,0)'}]}}}],
      animation:false,
    });
    window.addEventListener('resize',()=>chart.resize());
  }
  // Strategy distribution
  const sd=document.getElementById('strategyDistChart');
  if(sd){
    const chart=echarts.init(sd);
    const states={};
    State.strategies.forEach(s=>{states[s.state]=(states[s.state]||0)+1});
    chart.setOption({
      backgroundColor:'transparent',
      tooltip:{trigger:'item',appendToBody:true},
      legend:{bottom:0,textStyle:{color:'#a9b1d6',fontSize:11}},
      series:[{
        type:'pie',radius:['40%','65%'],center:['50%','42%'],
        data:Object.entries(states).map(([n,v])=>({name:n,value:v})),
        label:{color:'#a9b1d6',fontSize:11},
        itemStyle:{borderColor:'#24283b',borderWidth:2},
      }],
      color:['#565f89','#7aa2f7','#e0af68','#9ece6a','#f7768e','#bb9af7'],
      animation:false,
    });
    window.addEventListener('resize',()=>chart.resize());
  }
}

function openCreateWizard(templateId){
  State.wizardStep=0;
  State.wizardData={templateId:templateId||null};
  renderWizard();
}

function renderWizard(){
  const step=State.wizardStep;
  const steps=['选择模板','配置参数','绑定账户','确认创建'];
  const wd=State.wizardData;
  let body='';
  
  // Step 0: Template selection
  if(step===0){
    body=`
      <div class="grid grid-2" style="max-height:400px;overflow-y:auto">
        ${TEMPLATES.map(t=>`
          <div class="tmpl-card ${wd.templateId===t.id?'':'hover'}" style="${wd.templateId===t.id?'border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,162,247,.2)':''}" onclick="selectWizardTemplate('${t.id}')">
            <div class="cat"><span class="tag ${t.cat}">${CAT_LABELS[t.cat]}</span></div>
            <h4>${t.name}</h4>
            <p>${t.desc}</p>
            <div class="params">${t.params.map(p=>`<span class="param">${p}</span>`).join('')}</div>
          </div>`).join('')}
      </div>`;
  }
  
  // Step 1: Configure
  if(step===1){
    const tmpl=TEMPLATES.find(t=>t.id===wd.templateId);
    body=`
      <div class="form-group">
        <label>策略名称</label>
        <input type="text" id="wizName" value="${tmpl.name} - ${fmtTime().slice(0,5)}" placeholder="给策略取个名字">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>交易市场</label>
          <select id="wizMarket" onchange="updateWizardSymbols()">
            ${tmpl.markets.map(m=>`<option value="${m}" ${wd.market===m?'selected':''}>${MARKET_LABELS[m]}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>交易标的</label>
          <select id="wizSymbol">
            ${(SYMBOLS[wd.market||tmpl.markets[0]]||[]).map(s=>`<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="divider"></div>
      <h4 style="font-size:13px;margin-bottom:10px;color:var(--accent)">策略参数</h4>
      ${tmpl.params.map(p=>{
        const[pn,pv]=p.split('=');
        return `<div class="form-group"><label>${pn}</label><input type="text" id="param_${pn}" value="${pv}"></div>`;
      }).join('')}
    `;
  }
  
  // Step 2: Bind account
  if(step===2){
    const tmpl=TEMPLATES.find(t=>t.id===wd.templateId);
    const compatible=State.accounts.filter(a=>a.connected&&tmpl.markets.includes(a.market));
    body=`
      <p class="text-dim fs-12 mb-16">策略市场 <span class="badge sim">${MARKET_LABELS[wd.market]}</span> 需要绑定同市场的账户</p>
      ${compatible.length===0?`
        <div class="card" style="text-align:center;padding:32px">
          <p class="text-warn">⚠️ 没有兼容的已连接账户</p>
          <p class="text-dim fs-12 mt-8">请先到「账户管理」连接一个 ${MARKET_LABELS[wd.market]} 市场的交易所账户</p>
          <button class="btn btn-ghost mt-16" onclick="closeModal();nav('accounts')">前往账户管理</button>
        </div>
      `:`
        <div class="grid gap-12">
          ${compatible.map(a=>{const ex=EXCHANGES.find(e=>e.id===a.exchange);return `
            <div class="card" style="cursor:pointer;${wd.accountId===a.id?'border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,162,247,.2)':''}" onclick="selectWizardAccount('${a.id}')">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-12">
                  <div class="exch-logo" style="background:${ex.color}">${ex.name[0]}</div>
                  <div>
                    <div class="fw-700">${a.name}</div>
                    <div class="fs-11 text-dim">${ex.name} · ${MARKET_LABELS[a.market]} · ${a.type==='live'?'实盘':'模拟'}</div>
                  </div>
                </div>
                <div class="text-right">
                  <div class="mono fw-700">${fmt(a.balance)}</div>
                  <div class="fs-11 text-dim">USDT</div>
                </div>
              </div>
            </div>`}).join('')}
        </div>
      `}
    `;
  }
  
  // Step 3: Confirm
  if(step===3){
    const tmpl=TEMPLATES.find(t=>t.id===wd.templateId);
    const acct=State.accounts.find(a=>a.id===wd.accountId);
    const ex=EXCHANGES.find(e=>e.id===acct.exchange);
    body=`
      <div class="card">
        <h3 style="margin-bottom:16px">📋 策略概要</h3>
        <div class="grid grid-2 gap-12" style="font-size:13px">
          <div><span class="text-dim">策略名称:</span> <span class="fw-700">${wd.name||tmpl.name}</span></div>
          <div><span class="text-dim">策略模板:</span> <span class="fw-700">${tmpl.name}</span></div>
          <div><span class="text-dim">策略类型:</span> <span class="tag ${tmpl.cat}">${CAT_LABELS[tmpl.cat]}</span></div>
          <div><span class="text-dim">交易市场:</span> <span class="badge sim">${MARKET_LABELS[wd.market]}</span></div>
          <div><span class="text-dim">交易标的:</span> <span class="mono fw-700">${wd.symbol}</span></div>
          <div><span class="text-dim">绑定账户:</span> <span class="fw-700">${acct.name}</span></div>
          <div><span class="text-dim">交易所:</span> <span class="fw-700">${ex.name}</span></div>
          <div><span class="text-dim">账户类型:</span> <span class="badge ${acct.type==='live'?'live':'sim'}">${acct.type==='live'?'实盘':'模拟'}</span></div>
        </div>
        <div class="divider"></div>
        <h4 style="font-size:13px;margin-bottom:8px;color:var(--accent)">参数配置</h4>
        <div class="flex gap-8" style="flex-wrap:wrap">
          ${Object.entries(wd.params||{}).map(([k,v])=>`<span class="param tag" style="font-family:var(--font-mono)">${k}=${v}</span>`).join('')}
        </div>
        <div class="divider"></div>
        <div class="callout" style="background:var(--bg3);border-left:4px solid var(--good);border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px">
          <p class="fs-12"><span class="text-good">✅ 验证通过</span> 策略市场与账户市场匹配，账户已连接，可以启动</p>
        </div>
      </div>
    `;
  }
  
  showModal(`
    <div class="modal-head">
      <h2>🧙 创建策略</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="wizard-steps">
        ${steps.map((s,i)=>`
          <div class="wizard-step ${i===step?'active':i<step?'done':''}">
            <div class="num">${i<step?'✓':i+1}</div>
            <span>${s}</span>
          </div>
          ${i<steps.length-1?`<div class="wizard-line ${i<step?'done':''}"></div>`:''}
        `).join('')}
      </div>
      ${body}
    </div>
    <div class="modal-foot">
      ${step>0?'<button class="btn btn-ghost" onclick="wizardPrev()">上一步</button>':''}
      ${step===0&&!wd.templateId?'<button class="btn btn-ghost" onclick="closeModal()">取消</button>':''}
      ${step===0&&wd.templateId?'<button class="btn btn-primary" onclick="wizardNext()">下一步 →</button>':''}
      ${step===1?'<button class="btn btn-primary" onclick="wizardNext()">下一步 →</button>':''}
      ${step===2?'<button class="btn btn-primary" onclick="wizardNext()" '+(State.accounts.filter(a=>{const t=TEMPLATES.find(tt=>tt.id===wd.templateId);return a.connected&&t.markets.includes(a.market)}).length===0?'disabled':'')+'>下一步 →</button>':''}
      ${step===3?'<button class="btn btn-success" onclick="wizardCreate()">✓ 创建并启动策略</button>':''}
    </div>
  `);
}

function selectWizardTemplate(id){State.wizardData.templateId=id;renderWizard()}
function selectWizardAccount(id){State.wizardData.accountId=id;renderWizard()}
function updateWizardSymbols(){
  const m=$('#wizMarket').value;
  State.wizardData.market=m;
  const syms=SYMBOLS[m]||[];
  $('#wizSymbol').innerHTML=syms.map(s=>`<option value="${s}">${s}</option>`).join('');
}
function wizardPrev(){if(State.wizardStep>0)State.wizardStep--;renderWizard()}
function wizardNext(){
  const step=State.wizardStep;
  if(step===0&&State.wizardData.templateId){
    const tmpl=TEMPLATES.find(t=>t.id===State.wizardData.templateId);
    State.wizardData.market=tmpl.markets[0];
    State.wizardStep=1;
  }else if(step===1){
    State.wizardData.name=$('#wizName').value;
    State.wizardData.market=$('#wizMarket').value;
    State.wizardData.symbol=$('#wizSymbol').value;
    const tmpl=TEMPLATES.find(t=>t.id===State.wizardData.templateId);
    State.wizardData.params={};
    tmpl.params.forEach(p=>{const[pn]=p.split('=');State.wizardData.params[pn]=$('#param_'+pn).value});
    State.wizardStep=2;
  }else if(step===2&&State.wizardData.accountId){
    State.wizardStep=3;
  }
  renderWizard();
}
function wizardCreate(){
  const wd=State.wizardData;
  const tmpl=TEMPLATES.find(t=>t.id===wd.templateId);
  const newStrategy={
    id:uid('s'),name:wd.name,template:wd.templateId,cat:tmpl.cat,market:wd.market,
    symbols:[wd.symbol],accountId:wd.accountId,state:'Monitoring',enabled:true,
    params:wd.params,pnl:0,winRate:0,trades:0,createdAt:'2026-07-01',
    sharpe:0,drawdown:0,returnRate:0,
  };
  State.strategies.push(newStrategy);
  const acct=State.accounts.find(a=>a.id===wd.accountId);
  acct.strategyCount++;
  closeModal();
  toast(`策略「${newStrategy.name}」创建成功并已启动`,'success');
  renderModule('strategies');
  // Simulate first signal
  setTimeout(()=>{
    State.signals.unshift({id:uid('sig'),time:fmtTime(),strategy:newStrategy.name,type:'entry',msg:`${tmpl.name} 策略已启动，开始监控 ${wd.symbol}`,symbol:wd.symbol});
    State.notifications++;
    updateNotif();
  },2000);
}

function activateStrategy(id){
  const s=State.strategies.find(x=>x.id===id);
  if(!s.accountId){
    toast('策略未绑定账户，请先绑定账户','error');
    return;
  }
  const acct=State.accounts.find(a=>a.id===s.accountId);
  if(!acct||!acct.connected){
    toast('绑定的账户未连接，请先连接账户','error');
    return;
  }
  s.enabled=true;
  s.state='Monitoring';
  toast(`策略「${s.name}」已启动`,'success');
  renderModule('strategies');
  setTimeout(()=>{
    State.signals.unshift({id:uid('sig'),time:fmtTime(),strategy:s.name,type:'entry',msg:`策略已启动，开始监控 ${s.symbols.join(',')}`,symbol:s.symbols[0]});
    State.notifications++;
    updateNotif();
  },1500);
}

function stopStrategy(id){
  const s=State.strategies.find(x=>x.id===id);
  s.enabled=false;
  s.state='Idle';
  toast(`策略「${s.name}」已停止`,'info');
  renderModule('strategies');
}

  const s=State.strategies.find(x=>x.id===id);

  const acct=State.accounts.find(a=>a.id===s.accountId);
  const ex=acct?EXCHANGES.find(e=>e.id===acct.exchange):null;
  const states=['Idle','Monitoring','Tracking','PositionOpen','PositionClose'];
  const curIdx=states.indexOf(s.state);
  showModal(`
    <div class="modal-head"><h2>📋 ${s.name}</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="grid grid-2 gap-12 mb-16">
        <div class="card" style="padding:12px">
          <div class="fs-11 text-dim">策略模板</div>
          <div class="fw-700 mt-8">${tmpl.name}</div>
          <div class="fs-11 text-dim mt-8">${tmpl.desc}</div>
        </div>
        <div class="card" style="padding:12px">
          <div class="fs-11 text-dim">类型 / 市场</div>
          <div class="mt-8"><span class="tag ${s.cat}">${CAT_LABELS[s.cat]}</span> <span class="badge sim">${MARKET_LABELS[s.market]}</span></div>
          <div class="fs-11 text-dim mt-8">标的: <span class="mono">${s.symbols.join(',')}</span></div>
        </div>
      </div>
      <div class="card mb-16">
        <h3 style="font-size:13px">🔄 状态机</h3>
        <div class="state-machine mt-8">
          ${states.map((st,i)=>`
            <div class="state-node ${i===curIdx?'active':i<curIdx?'done':'pending'}">${st}</div>
            ${i<states.length-1?'<span class="state-arrow">→</span>':''}
          `).join('')}
        </div>
        <p class="fs-11 text-dim mt-8">当前状态: ${stateBadge(s.state)}</p>
      </div>
      <div class="grid grid-4 gap-8 mb-16">
        <div class="stat" style="padding:10px"><div class="label">总盈亏</div><div class="val fs-24 ${s.pnl>=0?'text-good':'text-bad'}" style="font-size:18px">${s.pnl>=0?'+':''}${fmt(s.pnl)}</div></div>
        <div class="stat" style="padding:10px"><div class="label">胜率</div><div class="val fs-24" style="font-size:18px">${s.winRate}%</div></div>
        <div class="stat" style="padding:10px"><div class="label">交易次数</div><div class="val fs-24" style="font-size:18px">${s.trades}</div></div>
        <div class="stat" style="padding:10px"><div class="label">夏普比率</div><div class="val fs-24" style="font-size:18px">${fmt(s.sharpe,2)}</div></div>
      </div>
      <div class="card mb-16">
        <h3 style="font-size:13px">⚙️ 参数配置</h3>
        <div class="flex gap-8 mt-8" style="flex-wrap:wrap">
          ${Object.entries(s.params).map(([k,v])=>`<span class="tag" style="font-family:var(--font-mono)">${k}=${v}</span>`).join('')}
        </div>
      </div>
      <div class="card">
        <h3 style="font-size:13px">🔐 绑定账户</h3>
        ${acct?`
          <div class="flex items-center gap-12 mt-8">
            <div class="exch-logo" style="background:${ex.color}">${ex.name[0]}</div>
            <div><div class="fw-700">${acct.name}</div><div class="fs-11 text-dim">${ex.name} · ${acct.type==='live'?'实盘':'模拟'} · 余额 ${fmt(acct.balance)}</div></div>
          </div>
        `:'<p class="text-warn">未绑定账户</p>'}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
      ${s.enabled
        ?`<button class="btn btn-danger" onclick="closeModal();stopStrategy('${s.id}')">⏹ 停止策略</button>`
        :`<button class="btn btn-success" onclick="closeModal();activateStrategy('${s.id}')">▶ 启动策略</button>`}
    </div>
  `);
}

function selectConnectExchange(id){State.connectExchange=id;renderConnectModal()}

function connectAccount(){
  const exId=State.connectExchange||'mock';
  const ex=EXCHANGES.find(e=>e.id===exId)||EXCHANGES.find(e=>e.id==='mock');
  const name=$('#acctName')?.value||ex.name+' 账户';
  const type=$('#acctType')?.value||'sim';
  const market=$('#acctMarket')?.value||ex.markets[0];
  toast('正在测试连接...','info');
  setTimeout(()=>{
    const newAccount={
      id:uid('a'),name:name,exchange:ex.id,market:market,type:type,
      balance:type==='sim'?rnd(5000,20000):rnd(1000,30000),connected:true,strategyCount:0,
    };
    State.accounts.push(newAccount);
    closeModal();
    toast(`账户「${name}」连接成功 · ${ex.name}`,'success');
    renderModule('accounts');
  },1500);
}

function syncBalance(id){
  const a=State.accounts.find(x=>x.id===id);
  toast(`正在从 ${EXCHANGES.find(e=>e.id===a.exchange).name} 同步余额...`,'info');
  setTimeout(()=>{
    const delta=rnd(-50,200);
    a.balance+=delta;
    toast(`余额同步成功 · ${a.balance>=0?'+':''}${fmt(delta)} USDT`,'success');
    renderModule('accounts');
  },1200);
}

function testConnection(id){
  const a=State.accounts.find(x=>x.id===id);
  const ex=EXCHANGES.find(e=>e.id===a.exchange);
  toast(`正在测试 ${ex.name} 连接...`,'info');
  setTimeout(()=>{
    a.connected=true;
    toast(`${ex.name} 连接测试通过 · 延迟 ${rndInt(20,80)}ms`,'success');
    renderModule('accounts');
  },1000);
}

function deleteAccount(id){
  const a=State.accounts.find(x=>x.id===id);
  if(a.strategyCount>0){
    toast(`账户「${a.name}」已绑定 ${a.strategyCount} 个策略，请先解绑`,'error');
    return;
  }
  showModal(`
    <div class="modal-head"><h2>🗑 删除账户</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p>确定要删除账户「<strong>${a.name}</strong>」吗？此操作不可撤销。</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="confirmDeleteAccount('${id}')">确认删除</button></div>
  `);
}
function confirmDeleteAccount(id){
  State.accounts=State.accounts.filter(a=>a.id!==id);
  closeModal();
  toast('账户已删除','info');
  renderModule('accounts');
}

function initMarketChart(){
  const el=document.getElementById('klineChart');
  if(!el)return;
  const chart=echarts.init(el);
  // Generate candlestick data
  const data=[];
  let price=State.currentSymbol.startsWith('BTC')?65000:State.currentSymbol.startsWith('ETH')?3400:State.currentSymbol.startsWith('AAPL')?190:1000;
  for(let i=0;i<60;i++){
    const open=price;
    const vol=rnd(-price*0.02,price*0.02);
    const close=open+vol;
    const high=Math.max(open,close)+rnd(0,Math.abs(vol)*0.5);
    const low=Math.min(open,close)-rnd(0,Math.abs(vol)*0.5);
    data.push({open:open,close:close,high:high,low:low,volume:rnd(10,100)});
    price=close;
  }
  const dates=data.map((_,i)=>{
    const d=new Date(Date.now()-(60-i)*3600000);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:00`;
  });
  chart.setOption({
    backgroundColor:'transparent',
    grid:[{left:60,right:20,top:30,height:'60%'},{left:60,right:20,top:'75%',height:'18%'}],
    tooltip:{trigger:'axis',appendToBody:true,axisPointer:{type:'cross'}},
    xAxis:[
      {type:'category',data:dates,scale:true,boundaryGap:false,axisLine:{lineStyle:{color:'rgba(192,202,245,.1)'}},axisLabel:{color:'#565f89',fontSize:10},gridIndex:0},
      {type:'category',data:dates,gridIndex:1,show:false},
    ],
    yAxis:[
      {scale:true,axisLine:{show:false},splitLine:{lineStyle:{color:'rgba(192,202,245,.06)'}},axisLabel:{color:'#565f89',fontSize:10},gridIndex:0},
      {scale:true,gridIndex:1,splitNumber:2,axisLabel:{show:false},axisLine:{show:false},splitLine:{show:false}},
    ],
    series:[
      {name:'K线',type:'candlestick',data:data.map(d=>[d.open,d.close,d.low,d.high]),itemStyle:{color:'#9ece6a',color0:'#f7768e',borderColor:'#9ece6a',borderColor0:'#f7768e'},xAxisIndex:0,yAxisIndex:0},
      {name:'成交量',type:'bar',data:data.map(d=>({value:d.volume,itemStyle:{color:d.close>=d.open?'rgba(158,206,106,.4)':'rgba(247,118,142,.4)'}})),xAxisIndex:1,yAxisIndex:1},
    ],
    animation:false,
  });
  window.addEventListener('resize',()=>chart.resize());
  
  // Update price display
  const last=data[data.length-1];
  const change=((last.close-last.open)/last.open*100);
  $('#latestPrice').textContent=fmt(last.close,last.close>1000?1:4);
  $('#priceChange').innerHTML=`<span class="${change>=0?'text-good':'text-bad'}">${change>=0?'+':''}${fmt(change,2)}%</span>`;
  $('#volume24h').textContent=fmt(data.reduce((s,d)=>s+d.volume,0),1)+'M';
  
  // Depth chart
  const depth=document.getElementById('depthChart');
  if(depth){
    const dChart=echarts.init(depth);
    const bids=[];const asks=[];let bp=last.close;let ap=last.close;
    for(let i=0;i<20;i++){bp-=rnd(1,10);bids.push([bp,rnd(0.5,5)]);ap+=rnd(1,10);asks.push([ap,rnd(0.5,5)])}
    dChart.setOption({
      backgroundColor:'transparent',
      grid:{left:50,right:20,top:10,bottom:30},
      tooltip:{trigger:'axis',appendToBody:true},
      xAxis:{type:'value',axisLine:{lineStyle:{color:'rgba(192,202,245,.1)'}},axisLabel:{color:'#565f89',fontSize:10}},
      yAxis:{type:'value',axisLine:{show:false},splitLine:{lineStyle:{color:'rgba(192,202,245,.06)'}},axisLabel:{color:'#565f89',fontSize:10}},
      series:[
        {name:'买单',type:'line',data:bids,smooth:true,symbol:'none',lineStyle:{color:'#9ece6a'},areaStyle:{color:'rgba(158,206,106,.15)'}},
        {name:'卖单',type:'line',data:asks,smooth:true,symbol:'none',lineStyle:{color:'#f7768e'},areaStyle:{color:'rgba(247,118,142,.15)'}},
      ],
      animation:false,
    });
    window.addEventListener('resize',()=>dChart.resize());
  }
}

function renderRankings(){
  const ranked=[...State.strategies].filter(s=>s.trades>0).sort((a,b)=>{
    const scoreA=a.returnRate*0.3+a.sharpe*0.25+a.winRate*0.2+(100-a.drawdown)*0.15+Math.min(a.trades,20)*0.1*5;
    const scoreB=b.returnRate*0.3+b.sharpe*0.25+b.winRate*0.2+(100-b.drawdown)*0.15+Math.min(b.trades,20)*0.1*5;
    return scoreB-scoreA;
  });
  return `
    <div class="page-head">
      <div><h1>策略排行</h1><div class="sub">5 维评分 · 收益率30% · 夏普25% · 胜率20% · 回撤15% · 交易频次10%</div></div>
    </div>
    <div class="card mb-16" style="padding:0;overflow:hidden">
      <table class="tbl">
        <thead><tr><th>#</th><th>策略名称</th><th>类型</th><th>收益率</th><th>夏普</th><th>胜率</th><th>回撤</th><th>交易</th><th>综合评分</th><th>操作</th></tr></thead>
        <tbody>
          ${ranked.map((s,i)=>{
            const score=s.returnRate*0.3+s.sharpe*0.25+s.winRate*0.2+(100-s.drawdown)*0.15+Math.min(s.trades,20)*0.1*5;
            return `<tr>
              <td class="feat" style="font-size:16px">${i+1}</td>
              <td class="feat">${s.name}</td>
              <td><span class="tag ${s.cat}">${CAT_LABELS[s.cat]}</span></td>
              <td class="mono ${s.returnRate>=0?'text-good':'text-bad'}">${s.returnRate>=0?'+':''}${fmt(s.returnRate,1)}%</td>
              <td class="mono">${fmt(s.sharpe,2)}</td>
              <td class="mono ${s.winRate>=50?'text-good':'text-bad'}">${s.winRate}%</td>
              <td class="mono ${s.drawdown>15?'text-bad':'text-warn'}">${fmt(s.drawdown,1)}%</td>
              <td class="mono">${s.trades}</td>
              <td><div class="flex items-center gap-8"><div class="progress" style="width:60px"><div class="progress-bar ${score>50?'good':score>30?'warn':'bad'}" style="width:${Math.min(score,100)}%"></div></div><span class="mono fw-700">${fmt(score,1)}</span></div></td>
              <td><button class="btn btn-ghost btn-sm" onclick="showRankingDetail('${s.id}')">雷达图</button></td>
            </tr>`}).join('')}
        </tbody>
      </table>
    </div>

function openRebalanceModal(){
  const suggestions=State.targetAllocation.filter(a=>Math.abs(a.current-a.target)>3);
  showModal(`
    <div class="modal-head"><h2>⚖️ 再平衡建议</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <p class="text-dim fs-12 mb-16">基于目标配置，以下资产偏离超过 3%，建议调整：</p>
      ${suggestions.length===0?'<p class="text-good">✅ 所有资产配置在目标范围内，无需调整</p>':suggestions.map(a=>{
        const diff=a.current-a.target;
        const action=diff>0?'减仓':'加仓';
        const pct=Math.abs(diff).toFixed(1);
        return `<div class="card mb-16" style="padding:14px">
          <div class="flex items-center justify-between">
            <div>
              <div class="fw-700">${a.asset}</div>
              <div class="fs-11 text-dim">目标: ${a.target}% · 当前: ${a.current}%</div>
            </div>
            <div class="text-right">
              <span class="badge ${diff>0?'closing':'monitoring'}">${action} ${pct}%</span>
              <div class="fs-11 text-dim mt-8">建议${action}约 ${fmt(Math.abs(diff)/100*55000,0)} USDT</div>
            </div>
          </div>
        </div>`}).join('')}
      ${suggestions.length>0?`
        <div class="callout" style="background:var(--bg3);border-left:4px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px;margin-top:16px">
          <p class="fs-12">💡 再平衡可降低组合风险，建议每月或偏离超过 5% 时执行一次</p>
        </div>
      `:''}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
      ${suggestions.length>0?'<button class="btn btn-primary" onclick="executeRebalance()">执行再平衡</button>':''}
    </div>
  `);
}

function executeRebalance(){
  closeModal();
  toast('再平衡指令已发送，正在执行...','info');
  setTimeout(()=>{
    State.targetAllocation.forEach(a=>{a.current=a.target});
    State.holdings.forEach(h=>{h.weight=State.targetAllocation.find(a=>a.asset===h.symbol.split('-')[0])?.target||h.weight});
    toast('投资组合再平衡完成 ✓','success');
    renderModule('portfolio');
  },2000);
}

function closePosition(symbol){
  showModal(`
    <div class="modal-head"><h2>平仓确认</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p>确定要平仓 <strong>${symbol}</strong> 的全部持仓吗？</p></div>

}
function confirmClosePosition(symbol){
  const h=State.holdings.find(x=>x.symbol===symbol);
  if(h){State.holdings=State.holdings.filter(x=>x.symbol!==symbol);toast(`${symbol} 已平仓，盈亏 ${h.pnl>=0?'+':''}${fmt(h.pnl)} USDT`,'success')}
  closeModal();renderModule('portfolio');
}

function toggleOrderType(){
  const type=$('#soType').value;
  $('#priceRow').style.display=type==='limit'||type==='stop'?'grid':'none';
  $('#stopPriceGroup').style.display=type==='stop'?'block':'none';
  // Update trailing
  const trailing=$('#trailingToggle');
  if(trailing.classList.contains('on'))$('#trailingDistGroup').classList.remove('hidden');
}

function submitSmartOrder(){
  const symbol=$('#soSymbol').value;
  const side=$('#soSide').value;
  const type=$('#soType').value;
  const qty=parseFloat($('#soQty').value);
  const price=type==='market'?0:parseFloat($('#soPrice')?.value||0);
  const tp=parseFloat($('#soTp')?.value||0);
  const sl=parseFloat($('#soSl')?.value||0);
  const trailingSl=$('#trailingToggle').classList.contains('on');
  const trailingDist=trailingSl?parseFloat($('#soTrailingDist')?.value||2):0;
  
  if(qty<=0){toast('请输入有效数量','error');return}
  
  const order={id:uid('so'),symbol,side,type,price,qty,tp,sl,trailingSl,trailingDist,status:'pending',createdAt:fmtTime().slice(0,5)};
  State.smartOrders.unshift(order);
  toast(`${side==='buy'?'买入':'卖出'} ${symbol} ×${qty} ${type}单已提交`,'success');
  renderModule('smartorder');
  
  // Simulate fill for market orders
  if(type==='market'){
    setTimeout(()=>{
      State.smartOrders=State.smartOrders.filter(o=>o.id!==order.id);
      State.trades.unshift({id:uid('t'),time:fmtTime(),strategy:'智能下单',symbol,side,price:symbol.startsWith('BTC')?65420:symbol.startsWith('ETH')?3421:rnd(100,200),qty,pnl:null});
      toast(`${symbol} ${type}单已成交`,'success');
      if(State.module==='smartorder')renderModule('smartorder');
    },1500);
  }
}

function cancelSmartOrder(id){
  State.smartOrders=State.smartOrders.filter(o=>o.id!==id);
  toast('订单已撤销','info');
  renderModule('smartorder');
}

      xAxis:{type:'category',data:data.map(s=>s.name.length>8?s.name.substring(0,7)+'..':s.name),axisLabel:{color:'#565f89',fontSize:9,rotate:30},axisLine:{lineStyle:{color:'rgba(192,202,245,.1)'}}},
      yAxis:{type:'value',axisLine:{show:false},splitLine:{lineStyle:{color:'rgba(192,202,245,.06)'}},axisLabel:{color:'#565f89',fontSize:10}},
      series:[{type:'bar',data:data.map(s=>({value:s.pnl,itemStyle:{color:s.pnl>=0?'#9ece6a':'#f7768e'}})),barWidth:'40%'}],
      animation:false,
    });
    window.addEventListener('resize',()=>chart.resize());
  }
  // Hour bar
  const hp=document.getElementById('attrHourChart');
  if(hp){
    const chart=echarts.init(hp);
    chart.setOption({
      backgroundColor:'transparent',
      grid:{left:50,right:20,top:20,bottom:30},
      tooltip:{trigger:'axis',appendToBody:true},
      xAxis:{type:'category',data:State.attribution.byHour.map(h=>h.hour+':00'),axisLine:{lineStyle:{color:'rgba(192,202,245,.1)'}},axisLabel:{color:'#565f89',fontSize:9}},
      yAxis:{type:'value',axisLine:{show:false},splitLine:{lineStyle:{color:'rgba(192,202,245,.06)'}},axisLabel:{color:'#565f89',fontSize:10}},
      series:[{type:'bar',data:State.attribution.byHour.map(h=>({value:h.pnl,itemStyle:{color:h.pnl>=0?'rgba(158,206,106,.7)':'rgba(247,118,142,.7)'}}))}],
      animation:false,
    });
    window.addEventListener('resize',()=>chart.resize());
  }
  // Correlation matrix
  const cm=document.getElementById('corrMatrix');
  if(cm){
    const chart=echarts.init(cm);
    const syms=['BTC','ETH','SOL','NVDA','EUR'];
    const matrix=syms.map(()=>syms.map(()=>rnd(-0.8,0.95).toFixed(2)));
    syms.forEach((_,i)=>{matrix[i][i]=1});
    chart.setOption({
      backgroundColor:'transparent',
      tooltip:{appendToBody:true,formatter:p=>`${syms[p.data[1]]} vs ${syms[p.data[0]]}: ${matrix[p.data[1]][p.data[0]]}`},
      grid:{left:60,right:20,top:20,bottom:40},
      xAxis:{type:'category',data:syms,axisLabel:{color:'#565f89',fontSize:10},axisLine:{lineStyle:{color:'rgba(192,202,245,.1)'}}},
      yAxis:{type:'category',data:syms,axisLabel:{color:'#565f89',fontSize:10},axisLine:{lineStyle:{color:'rgba(192,202,245,.1)'}}},
      visualMap:{min:-1,max:1,calculable:true,orient:'horizontal',left:'center',bottom:0,textStyle:{color:'#a9b1d6',fontSize:10},inRange:{color:['#f7768e','#565f89','#9ece6a']}},
      series:[{type:'heatmap',data:syms.flatMap((_,i)=>syms.map((_,j)=>[i,j,parseFloat(matrix[i][j])])),label:{show:true,color:'#fff',fontSize:10}}],
      animation:false,
    });
    window.addEventListener('resize',()=>chart.resize());
  }
}

// ===== Strategy Marketplace =====
function renderMarketplace(){
  return `
    <div class="page-head">
      <div><h1>策略市场</h1><div class="sub">社区策略 · 一键克隆 · 评分排行</div></div>
      <div class="flex gap-8">
        <select id="mktFilter" onchange="filterMarketplace()" style="background:var(--bg3);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:6px 12px;color:var(--ink);font-size:13px">
          <option value="all">全部市场</option>
          <option value="crypto">数字货币</option>
          <option value="stock">股票</option>
          <option value="futures">期货</option>
          <option value="forex">外汇</option>
        </select>
        <select id="mktSort" onchange="filterMarketplace()" style="background:var(--bg3);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:6px 12px;color:var(--ink);font-size:13px">
          <option value="rating">按评分</option>
          <option value="users">按用户数</option>
          <option value="roi">按收益率</option>
        </select>
      </div>
    </div>
    <div class="grid grid-3" id="mktGrid">
      ${renderMarketplaceCards(State.marketplaceStrategies)}
    </div>
  `;
}

function renderMarketplaceCards(list){
  return list.map(s=>{
    const stars='★'.repeat(Math.floor(s.rating))+'☆'.repeat(5-Math.floor(s.rating));
    return `<div class="mkt-card" onclick="openMarketDetail('${s.id}')">
      <div class="mkt-head">
        <span class="tag ${s.cat}">${CAT_LABELS[s.cat]}</span>
        <span class="badge sim">${MARKET_LABELS[s.market]}</span>
      </div>
      <h4 style="font-size:15px;margin-bottom:6px">${s.name}</h4>
      <p class="text-dim fs-12" style="line-height:1.5">${s.desc}</p>
      <div class="mkt-author mt-8">
        <div class="ava">${s.author[0]}</div>
        <span>${s.author}</span>
        <span class="text-accent ml-auto">${stars} ${s.rating}</span>
      </div>
      <div class="mkt-stats">
        <div class="stat-item"><div class="v text-good">+${s.roi}%</div><div class="l">年化收益</div></div>
        <div class="stat-item"><div class="v">${s.users}</div><div class="l">用户数</div></div>
        <div class="stat-item"><div class="v ${s.price==='免费'?'text-good':'text-accent'}">${s.price}</div><div class="l">价格</div></div>
      </div>
    </div>`}).join('');
}

function filterMarketplace(){
  const filter=$('#mktFilter').value;
  const sort=$('#mktSort').value;
  let list=[...State.marketplaceStrategies];
  if(filter!=='all')list=list.filter(s=>s.market===filter);
  list.sort((a,b)=>sort==='rating'?b.rating-a.rating:sort==='users'?b.users-a.users:b.roi-a.roi);
  $('#mktGrid').innerHTML=renderMarketplaceCards(list);
}

function openMarketDetail(id){
  const s=State.marketplaceStrategies.find(x=>x.id===id);
  const stars='★'.repeat(Math.floor(s.rating))+'☆'.repeat(5-Math.floor(s.rating));
  showModal(`
    <div class="modal-head"><h2>${s.name}</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="flex items-center gap-12 mb-16">
        <span class="tag ${s.cat}">${CAT_LABELS[s.cat]}</span>
        <span class="badge sim">${MARKET_LABELS[s.market]}</span>
        <span class="text-accent ml-auto">${stars} ${s.rating}</span>
      </div>
      <p class="text-dim mb-16">${s.desc}</p>
      <div class="grid grid-3 gap-8 mb-16">
        <div class="stat" style="padding:10px;text-align:center"><div class="label">年化收益</div><div class="val text-good" style="font-size:20px">+${s.roi}%</div></div>
        <div class="stat" style="padding:10px;text-align:center"><div class="label">使用人数</div><div class="val" style="font-size:20px">${s.users}</div></div>
        <div class="stat" style="padding:10px;text-align:center"><div class="label">评分</div><div class="val text-accent" style="font-size:20px">${s.rating}</div></div>
      </div>
      <div class="card mb-16" style="padding:14px">
        <div class="flex items-center gap-12">
          <div class="ava" style="width:32px;height:32px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">${s.author[0]}</div>
          <div><div class="fw-700">${s.author}</div><div class="fs-11 text-dim">认证策略创作者 · 已发布 ${rndInt(3,12)} 个策略</div></div>
        </div>
      </div>
      <div class="callout" style="background:var(--bg3);border-left:4px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px">
        <p class="fs-12">💡 克隆后策略将出现在你的策略列表中，可自行调整参数并绑定账户运行</p>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-success" onclick="cloneStrategy('${s.id}')">📋 克隆策略</button>
    </div>
  `);
}

function cloneStrategy(id){
  const s=State.marketplaceStrategies.find(x=>x.id===id);
  const newStrategy={
    id:uid('s'),name:s.name+' (克隆)',template:'ma-cross',cat:s.cat,market:s.market,
    symbols:[SYMBOLS[s.market]?.[0]||'BTC-USDT'],accountId:null,state:'Idle',enabled:false,
    params:{},pnl:0,winRate:0,trades:0,createdAt:'2026-07-07',sharpe:0,drawdown:0,returnRate:0,
  };
  State.strategies.push(newStrategy);
  closeModal();
  toast(`策略「${s.name}」已克隆到你的策略列表`,'success');
  setTimeout(()=>nav('strategies'),500);
}


// ===== Real-time Simulation =====
function simulateRealtime(){
  // Simulate new trades for running strategies
  const running=State.strategies.filter(s=>s.enabled&&s.state!=='Idle');
  if(running.length>0&&Math.random()>0.6){
    const s=running[rndInt(0,running.length-1)];
    const side=Math.random()>0.5?'buy':'sell';
    const price=State.currentSymbol.startsWith('BTC')?65000+rnd(-500,500):State.currentSymbol.startsWith('ETH')?3400+rnd(-30,30):rnd(100,200);
    const qty=fmt(rnd(0.001,0.1),3);
    const pnl=Math.random()>0.5?rnd(-20,50):null;
    State.trades.unshift({id:uid('t'),time:fmtTime(),strategy:s.name,symbol:s.symbols[0],side:side,price:price,qty:parseFloat(qty),pnl:pnl});
    if(State.trades.length>20)State.trades.pop();
    s.trades++;
    if(pnl!=null){s.pnl+=pnl;if(pnl>0)s.winRate=Math.min(100,s.winRate+1);else s.winRate=Math.max(0,s.winRate-1)}
    // Update dashboard if visible
    if(State.module==='dashboard'){
      const feed=$('#dashTrades');
      if(feed){
        const item=document.createElement('div');
        item.className='feed-item';
        item.innerHTML=`<span class="time">${fmtTime()}</span><span class="side ${side}">${side==='buy'?'买入':'卖出'}</span><span class="feat">${s.symbols[0]}</span><span class="mono text-dim">@${fmt(price)}</span><span class="mono text-dim">×${qty}</span>${pnl!=null?`<span class="${pnl>=0?'text-good':'text-bad'} mono">${pnl>=0?'+':''}${fmt(pnl)}</span>`:''}<span class="text-dim fs-11" style="margin-left:auto">${s.name}</span>`;
        feed.insertBefore(item,feed.firstChild);
        if(feed.children.length>6)feed.lastChild.remove();
      }
    }
    if(State.module==='execution'){renderModule('execution')}
  }
  
  // Simulate state transitions
  if(running.length>0&&Math.random()>0.8){
    const s=running[rndInt(0,running.length-1)];
    const states=['Monitoring','Tracking','PositionOpen','PositionClose'];
    const curIdx=states.indexOf(s.state);
    if(curIdx>=0&&curIdx<states.length-1){
      s.state=states[curIdx+1];
      // Generate signal
      State.signals.unshift({id:uid('sig'),time:fmtTime(),strategy:s.name,type:curIdx===1?'entry':'exit',msg:`${s.name} 状态变更: ${states[curIdx]} → ${states[curIdx+1]}`,symbol:s.symbols[0]});
      if(State.signals.length>15)State.signals.pop();
      State.notifications++;
      updateNotif();
    }else if(s.state==='PositionClose'){
      s.state='Monitoring';
    }
  }
}

function updateNotif(){$('#notifCount').textContent=State.notifications}

function startClock(){
  State.clock=setInterval(()=>{
    $('#clock').textContent=fmtTime();
  },1000);
}

// ===== Init =====
document.addEventListener('DOMContentLoaded',()=>{
  // Nav binding
  $$('.nav-item').forEach(n=>n.addEventListener('click',()=>nav(n.dataset.module)));
  // Start clock
  startClock();
  // Render initial module
  renderModule('dashboard');
  // Start real-time simulation
  setInterval(simulateRealtime,3000);
  // Welcome toast
  setTimeout(()=>toast('Sentient Trader 交互式 Demo 已就绪 · 点击左侧导航体验各模块','info'),500);
  setTimeout(()=>toast('💡 提示: 在「策略管理」中创建并启动策略，观察实时成交','info'),3000);
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click',e=>{
  if(e.target.id==='modalOverlay')closeModal();
});
</script>
