<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>今天一定要回本 V1 高保真交互原型</title>
  <style>
    :root {
      --iphone-width: 393px;
      --iphone-height: 852px;
      --iphone-frame: 10px;
      --bg: #fff8ef;
      --bg-soft: #fff4e4;
      --paper: #fffdf8;
      --paper-deep: #fff3de;
      --line: #f1d8ba;
      --line-strong: #e7b879;
      --ink: #24120a;
      --muted: #8a7461;
      --red: #ff3028;
      --red-dark: #d71f18;
      --yellow: #ffc83d;
      --orange: #ff8b1f;
      --green: #21b957;
      --green-soft: #e6f8e9;
      --black: #17110d;
      --shadow: 0 12px 28px rgba(126, 72, 24, .13);
      --shadow-strong: 0 18px 44px rgba(106, 58, 20, .22);
      --radius: 14px;
      --radius-sm: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    ::-webkit-scrollbar { display: none; }

    body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    /* 禁用所有组件的悬浮动画 */
    *, *::before, *::after {
      transition: none !important;
    }
    button:hover, .btn:hover, .icon-btn:hover, .tab:hover,
    .card.clickable:hover, [data-go].card:hover,
    .cat-btn:hover, .cart-icon:hover, .dish-chip:hover,
    .filter-btn:hover, .map-btn:hover, .tier-card:hover {
      transform: none !important;
      box-shadow: inherit !important;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 255, 255, .95), transparent 34%),
        #e9e7e3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
    }

    button, input, select, textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button, [data-go], [data-dish], [data-cat], [data-map-page] {
      -webkit-tap-highlight-color: transparent;
    }

    .stage {
      width: 100%;
      max-width: calc(var(--iphone-width) + var(--iphone-frame) * 2);
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .phone {
      width: calc(var(--iphone-width) + var(--iphone-frame) * 2);
      height: calc(var(--iphone-height) + var(--iphone-frame) * 2);
      margin: 0 auto;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #f7f0e6;
      border: var(--iphone-frame) solid #1c1c1e;
      border-radius: 54px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .55),
        0 28px 70px rgba(21, 18, 15, .28),
        0 8px 18px rgba(21, 18, 15, .18);
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      width: 124px;
      height: 34px;
      border-radius: 999px;
      background: #050505;
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
    }

    .statusbar {
      height: 47px;
      padding: 14px 24px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      color: #050505;
      font-size: 13px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .appbar {
      height: 58px;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 48px 1fr 76px;
      align-items: center;
      background: rgba(255, 250, 243, .9);
      flex: 0 0 auto;
    }

    .app-title {
      text-align: center;
      font-size: 18px;
      font-weight: 900;
    }

    .capsule {
      height: 32px;
      display: none;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #ecd9c2;
      border-radius: 999px;
      background: rgba(255, 255, 255, .78);
      overflow: hidden;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 94px;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    main::-webkit-scrollbar { display: none; }

    .phone.record-mode main { padding-bottom: 22px; }
    .phone.record-mode .bottom-tabs { display: none; }

    .bottom-tabs {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 84px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 10px 18px 12px;
      background: rgba(255, 253, 248, .98);
      border-top: 1px solid rgba(239, 216, 188, .9);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -6px 20px rgba(126, 72, 24, .1);
      backdrop-filter: blur(14px);
      z-index: 10;
    }

    .tab {
      min-width: 0;
      border: 0;
      background: transparent;
      color: #6c6259;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      border-radius: 12px;
      transition: transform .16s ease, background .16s ease, color .16s ease;
    }

    .tab:hover { background: #fff0dc; color: var(--red); }
    .tab:active { transform: scale(.94); }
    .tab.active { color: var(--red); }
    .tab.active .hi { background-color: var(--red); }

    .tab__icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .hi {
      width: 22px;
      height: 22px;
      display: inline-block;
      flex: 0 0 auto;
      color: currentColor;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #eed9bf;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .78);
      color: var(--ink);
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }

    .icon-btn:hover {
      background: #fff0dc;
      box-shadow: 0 6px 14px rgba(120, 72, 24, .11);
    }

    .icon-btn:active { transform: scale(.92); }

    .btn {
      min-height: 46px;
      border: 1px solid #c9a486;
      border-radius: 999px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, .92);
      color: var(--ink);
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(104, 59, 20, .05);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease, border-color .16s ease, opacity .16s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(104, 59, 20, .13);
      border-color: #a16f48;
    }

    .btn:active {
      transform: translateY(1px) scale(.98);
      box-shadow: 0 2px 8px rgba(104, 59, 20, .1);
    }

    .btn.primary {
      min-height: 58px;
      background: linear-gradient(180deg, #ff4335 0%, var(--red) 62%, #ea1c16 100%);
      border-color: var(--red-dark);
      color: #fff;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, .26), 0 10px 18px rgba(255, 48, 40, .25);
      text-shadow: 0 1px 0 rgba(90, 15, 10, .22);
      font-size: 20px;
    }

    .btn.primary:hover { background: linear-gradient(180deg, #ff594d, #ff3028 64%, #e81f18); }

    .btn.yellow {
      background: #fff7dc;
      border-color: #d6a644;
      color: #2e1a0c;
    }

    .btn.dark {
      background: var(--black);
      color: #fff;
      border-color: #000;
    }

    .btn.ghost {
      background: rgba(255, 255, 255, .48);
      color: #5a321d;
    }

    .btn.compact {
      min-height: 34px;
      padding: 0 13px;
      font-size: 12px;
    }

    .btn.square {
      width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 50%;
      font-size: 17px;
      font-weight: 900;
    }

    .btn.full { width: 100%; }

    .btn:disabled,
    .btn.disabled {
      opacity: .46;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      background: #eee4d8;
      border-color: #ddd1c3;
      color: #9a8c80;
      text-shadow: none;
    }

    .btn:focus-visible,
    .icon-btn:focus-visible,
    .tab:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(255, 200, 61, .7);
      outline-offset: 2px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, .96), rgba(255, 250, 243, .96));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .card.clickable,
    [data-go].card {
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .card.clickable:hover,
    [data-go].card:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      box-shadow: 0 16px 30px rgba(126, 72, 24, .16);
    }

    .card.selected {
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(255, 48, 40, .1), var(--shadow);
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: 40px; line-height: .96; font-weight: 1000; }
    h2 { margin-bottom: 12px; font-size: 22px; font-weight: 1000; }
    h3 { margin-bottom: 8px; font-size: 17px; font-weight: 1000; }
    p { margin-bottom: 10px; line-height: 1.55; color: var(--muted); }
    p:last-child { margin-bottom: 0; }

    .brand-word {
      color: #351804;
      font-weight: 1000;
      letter-spacing: 0;
      text-shadow: 0 3px 0 #ffe2a2, 0 5px 0 rgba(77, 35, 6, .12);
    }

    .hero {
      position: relative;
      min-height: 382px;
      padding: 22px 16px 14px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 252, 245, .78), rgba(255, 244, 224, .8)),
        radial-gradient(circle at 22% 26%, rgba(255, 200, 61, .22), transparent 18%),
        #fff7ec;
      border-bottom: 1px solid var(--line);
    }

    .hero.compact {
      min-height: 190px;
      padding-bottom: 4px;
    }

    .hero .spark {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: var(--yellow);
      transform: rotate(45deg);
      box-shadow: 58px 44px 0 -2px #ff9f23, 268px 60px 0 -1px var(--yellow), 320px 156px 0 -3px #ff9f23;
      opacity: .9;
    }

    .hero-title {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 4px;
      width: 64%;
    }

    .hero-title .ribbon {
      width: max-content;
      max-width: 100%;
      padding: 7px 11px;
      border-radius: 12px 12px 12px 2px;
      background: var(--red);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 5px 0 rgba(117, 29, 14, .12);
      transform: rotate(-2deg);
    }

    .hero-dish {
      position: absolute;
      left: -4px;
      right: -4px;
      bottom: 0;
      height: 138px;
      display: grid;
      grid-template-columns: 74px 1fr 70px;
      gap: 10px;
      align-items: end;
      z-index: 1;
    }

    .pot {
      height: 128px;
      border: 10px solid #321507;
      border-bottom-width: 18px;
      border-radius: 50% 50% 40% 40%;
      background:
        radial-gradient(circle at 40% 44%, #704124 0 18%, transparent 19%),
        radial-gradient(circle at 62% 50%, #eeb77a 0 12%, transparent 13%),
        linear-gradient(135deg, #b65b24, #6e2c11);
      box-shadow: inset 0 12px 0 rgba(255, 238, 192, .35), 0 16px 26px rgba(64, 30, 5, .18);
    }

    .plate {
      height: 66px;
      border: 1px solid #edc99c;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 7px 14px rgba(114, 68, 24, .13);
    }

    .hero-mascot {
      position: absolute;
      right: 12px;
      bottom: 108px;
      width: 118px;
      height: 118px;
      border-radius: 34px;
      background: #fffdfa;
      border: 1px solid #e2c39d;
      box-shadow: 0 10px 22px rgba(126, 72, 24, .13);
      overflow: hidden;
    }

    .hero-mascot img,
    .mascot-asset img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 46%;
      transform: scale(1.28);
    }

    .hero-mascot::after,
    .asset::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at 50% 40%, rgba(255, 200, 61, .18), transparent 32%),
        linear-gradient(135deg, rgba(255, 255, 255, .25), rgba(255, 255, 255, 0));
    }

    .asset {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, #fff5e5);
      border: 1px dashed #e4c19a;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .asset.sm { width: 38px; height: 38px; border-radius: 13px; }
    .asset.md { width: 62px; height: 62px; border-radius: 18px; }
    .asset.lg { width: 104px; height: 104px; border-radius: 28px; }
    .asset.trophy { background: linear-gradient(180deg, #fff6d6, #fff); border-style: solid; }
    .asset.locked { filter: grayscale(1); opacity: .62; }
    .asset.mascot-asset {
      background: #fff;
      border-style: solid;
      border-color: #ead3b6;
    }

    .section-title {
      margin: 16px 2px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 16px;
      font-weight: 1000;
    }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .row.start { align-items: flex-start; }
    .stack { display: grid; gap: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grow { flex: 1; min-width: 0; }
    .center { text-align: center; }

    .muted { color: var(--muted); font-size: 13px; }
    .small { color: var(--muted); font-size: 12px; }
    .price { color: var(--red); font-weight: 1000; }
    .big-num { color: var(--red); font-size: 46px; line-height: 1; font-weight: 1000; letter-spacing: 0; }
    .stat-num { color: var(--red); font-size: 30px; font-weight: 1000; }

    .pill {
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: #fff1d3;
      border: 1px solid #f0cf95;
      color: #84510e;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .pill.red { background: #fff0ed; border-color: #ffb4aa; color: var(--red); }
    .pill.green { background: var(--green-soft); border-color: #a9dfb7; color: #139444; }
    .pill.gray { background: #f4f0eb; border-color: #e2d6ca; color: #827569; }

    .progress {
      position: relative;
      height: 14px;
      border-radius: 999px;
      background: #f0e4d4;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(74, 38, 10, .12);
    }

    .bar {
      height: 100%;
      min-width: 10%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red) 0%, var(--yellow) 58%, var(--green) 100%);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, .28);
      transition: width .22s ease;
    }

    label {
      display: block;
      margin: 0 0 8px;
      color: #3b2618;
      font-size: 14px;
      font-weight: 900;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .78);
      color: var(--ink);
      padding: 13px 14px;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    input:hover, select:hover, textarea:hover { border-color: var(--line-strong); background: #fff; }
    input:focus, select:focus, textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255, 48, 40, .09); outline: 0; }
    textarea { min-height: 96px; resize: vertical; }

    .field-card {
      padding: 16px;
      background: rgba(255, 255, 255, .78);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 12px;
    }

    .notice {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 12px;
      background: #fff0d7;
      border: 1px solid #efd0a0;
      color: #6d4213;
      font-size: 12px;
      font-weight: 800;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
    }

    .flow-step {
      min-width: 0;
      padding: 8px 4px;
      border-radius: 12px;
      background: #fff8ed;
      border: 1px solid #f2dec5;
    }

    .flow-step strong { display: block; margin-top: 4px; font-size: 12px; }
    .flow-step span { display: block; color: var(--muted); font-size: 10px; line-height: 1.25; }

    .tier-card {
      position: relative;
      min-height: 112px;
      padding: 14px 44px 12px 14px;
    }

    .tier-card .check {
      position: absolute;
      right: 14px;
      top: 18px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #c6b4a0;
      display: grid;
      place-items: center;
      color: transparent;
    }

    .tier-card.selected .check {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .food-strip {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      overflow: hidden;
    }

    .category-layout {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding-bottom: 80px;
    }

    .category-rail {
      position: sticky;
      top: 0;
      display: grid;
      gap: 8px;
      max-height: 540px;
      overflow-y: auto;
      padding-bottom: 100px;
    }

    .cat-btn {
      min-height: 62px;
      border: 1px solid transparent;
      border-radius: 13px;
      background: transparent;
      color: #4b3c31;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
    }

    .cat-btn:hover { background: #fff2df; }
    .cat-btn:active { transform: scale(.97); }
    .cat-btn.active {
      background: #fff;
      color: var(--red);
      border-color: var(--red);
      box-shadow: 0 8px 16px rgba(255, 48, 40, .1);
    }

    .dish-list { display: grid; gap: 10px; padding-bottom: 100px; }

    .dish-row {
      min-height: 104px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px;
    }

    .qty {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 1000;
    }

    .qty strong { min-width: 18px; text-align: center; font-size: 18px; }

    .cart-bar {
      position: sticky;
      left: 0;
      right: 0;
      bottom: -22px;
      z-index: 8;
      margin: 12px -14px -22px;
      min-height: 78px;
      padding: 10px 14px 14px;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 66px 92px;
      gap: 8px;
      align-items: center;
      color: #fff;
      background: rgba(20, 16, 13, .96);
      box-shadow: 0 -12px 24px rgba(0, 0, 0, .23);
      backdrop-filter: blur(12px);
    }

    .cart-icon {
      width: 54px;
      height: 54px;
      position: relative;
      border: 0;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #ff533f, #e71f18);
      color: #fff;
      cursor: pointer;
      transition: transform .16s ease, filter .16s ease;
    }

    .cart-icon:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .cart-badge {
      position: absolute;
      right: -4px;
      top: -6px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #fff;
      color: var(--red);
      font-size: 12px;
      font-weight: 1000;
      border: 1px solid rgba(0, 0, 0, .12);
    }

    .cart-bar .muted { color: #d9cec2; }
    .cart-bar .btn { min-height: 44px; padding: 0 10px; font-size: 14px; }
    .cart-bar .btn.primary { font-size: 15px; }

    .sheet-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: flex-end;
      background: rgba(0, 0, 0, .55);
    }

    .sheet-overlay.open { display: flex; }

    .sheet {
      width: 100%;
      max-height: 84%;
      overflow-y: auto;
      padding: 18px 14px 26px;
      border-radius: 24px 24px 0 0;
      background: var(--paper);
      box-shadow: 0 -18px 44px rgba(0, 0, 0, .28);
    }

    .list-row {
      padding: 12px 0;
      border-bottom: 1px solid rgba(232, 199, 163, .78);
    }

    .list-row:last-child { border-bottom: 0; }

    .ticket {
      position: relative;
      padding: 22px 20px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .94), rgba(255, 244, 224, .94)),
        var(--paper);
      border: 1px solid #e5c59f;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .ticket::before,
    .ticket::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 10px;
      background:
        radial-gradient(circle at 8px 5px, transparent 0 5px, #e5c59f 5.5px, transparent 6px) 0 0 / 24px 10px repeat-x;
      opacity: .65;
    }

    .ticket::before { top: -1px; }
    .ticket::after { bottom: -1px; transform: rotate(180deg); }

    .ticket-line {
      border-top: 1px dashed #d5ad84;
      margin: 12px 0;
    }

    .receipt-card {
      display: grid;
      grid-template-columns: 70px 1fr 62px;
      gap: 10px;
      align-items: center;
    }

    .chip-scroll {
      overflow: hidden;
      padding-bottom: 10px;
    }

    .chip-track {
      display: flex;
      gap: 10px;
      width: max-content;
      animation: chipMove 18s linear infinite;
    }

    .chip-scroll:hover .chip-track { animation-play-state: paused; }
    @keyframes chipMove { to { transform: translateX(-50%); } }

    .dish-chip {
      min-height: 64px;
      min-width: 72px;
      padding: 8px 10px;
      display: grid;
      justify-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease;
    }

    .dish-chip:hover { transform: translateY(-2px); border-color: var(--red); }

    .dish-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dish-card {
      min-height: 184px;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
    }

    .filter-btn {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: #f6ebdd;
      color: #59422f;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .filter-btn:hover,
    .filter-btn.active { background: var(--red); color: #fff; }

    .menu-list { display: grid; gap: 10px; }
    .menu-row { min-height: 56px; justify-content: space-between; }

    .upload {
      min-height: 128px;
      border: 1px dashed #d1aa86;
      border-radius: 14px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      background: #fffaf4;
    }

    .timeline-item {
      position: relative;
      padding-left: 20px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 22px;
      bottom: -16px;
      width: 2px;
      background: #ead2b6;
    }

    .timeline-item:last-child::before { display: none; }

    .timeline-dot {
      position: absolute;
      left: -4px;
      top: 18px;
      width: 14px;
      height: 14px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 1px #99d8aa;
    }

    .page-map {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: none;
      flex-direction: column;
      background: var(--bg);
    }

    .page-map.open { display: flex; }

    .page-map header {
      padding: 18px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      font-weight: 1000;
    }

    .map-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 24px;
    }

    .map-btn {
      width: 100%;
      min-height: 42px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      text-align: left;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }

    .map-btn:hover { border-color: var(--red); color: var(--red); }

    .toast {
      position: absolute;
      left: 26px;
      right: 26px;
      bottom: 96px;
      z-index: 50;
      display: none;
      padding: 12px;
      border-radius: 14px;
      background: rgba(24, 17, 12, .94);
      color: #fff;
      text-align: center;
      font-weight: 900;
      box-shadow: 0 12px 26px rgba(0, 0, 0, .22);
    }

    .toast.show { display: block; }

    .fake-phone-note {
      padding-top: 8px;
      text-align: center;
      color: #786a5e;
      font-size: 12px;
    }

    /* ===== 首页与四屏复刻新增样式 ===== */

    .phone.home-page .appbar {
      position: absolute;
      top: 34px;
      left: 0;
      right: 0;
      background: transparent;
      z-index: 20;
      border-bottom: 0;
    }

    .phone.home-page .app-title,
    .phone.home-page #backBtn {
      visibility: hidden;
    }

    .phone.home-page .capsule .icon-btn {
      background: rgba(255, 255, 255, .92);
      border-color: rgba(226, 190, 146, .9);
      color: var(--ink);
    }

    .hero-home {
      margin: -10px -14px 0;
      width: calc(100% + 28px);
      border: 0;
      border-radius: 0;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center bottom;
      position: relative;
    }

    .hero-home--normal {
      min-height: 430px;
      background-image: url("assets/generated/home-normal-hero-bg.png");
    }

    .hero-home--resume {
      min-height: 210px;
      background-image: url("assets/generated/home-resume-hero-bg.png");
    }

    .tip-banner {
      margin: 12px -14px 0;
      width: calc(100% + 28px);
      height: 110px;
      border: 0;
      border-radius: 0;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .tip-banner--normal {
      background-image: url("assets/generated/home-normal-bottom-banner-bg.png");
    }

    .tip-banner--resume {
      background-image: url("assets/generated/home-resume-bottom-banner-bg.png");
    }

    .tip-banner__text {
      position: absolute;
      top: 50%;
      left: 22px;
      transform: translateY(-50%);
      max-width: 58%;
      color: #1b5e20;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.4;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .5);
    }

    .tip-banner--resume .tip-banner__text {
      left: auto;
      right: 22px;
      text-align: right;
    }

    .flow-card {
      padding: 15px;
    }

    .flow-steps {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 12px;
    }

    .flow-step {
      flex: 1;
      min-width: 0;
      padding: 10px 2px;
      border-radius: 14px;
      background: #fff8ed;
      border: 1px solid #f2dec5;
      text-align: center;
    }

    .flow-step__icon {
      width: 30px;
      height: 30px;
      margin: 0 auto 6px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--ink);
    }

    .flow-step:nth-child(1) .flow-step__icon { background: #fff1d3; }
    .flow-step:nth-child(3) .flow-step__icon { background: #fff0ed; }
    .flow-step:nth-child(5) .flow-step__icon { background: #e6f8e9; }
    .flow-step:nth-child(7) .flow-step__icon { background: #fff1d3; }

    .flow-step strong {
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
      color: var(--ink);
    }

    .flow-step span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.25;
    }

    .flow-arrow {
      color: #d7b893;
      font-size: 18px;
      font-weight: 900;
    }

    .recovery-card {
      background: linear-gradient(180deg, #ff4a38, #f32b22);
      color: #fff;
      border-color: #d71f18;
      padding: 18px;
      margin-top: 14px;
    }

    .recovery-card h2 {
      color: #fff;
      margin: 0;
      font-size: 21px;
    }

    .recovery-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .recovery-card__star {
      color: var(--yellow);
      font-size: 20px;
    }

    .recovery-card__inner {
      background: #fff;
      color: var(--ink);
      border-radius: var(--radius);
      margin-top: 14px;
      padding: 16px;
    }

    .recovery-card__store {
      margin-bottom: 14px;
      font-size: 15px;
    }

    .recovery-card__store .hi {
      color: var(--red);
    }

    .recovery-card__stats {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .stat-column {
      text-align: center;
    }

    .stat-column__label {
      color: var(--muted);
      font-size: 13px;
    }

    .stat-column__value {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      font-weight: 900;
      color: var(--ink);
    }

    .stat-divider {
      width: 1px;
      height: 40px;
      background: rgba(232, 199, 163, .78);
    }

    .recovery-card__progress {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin: 18px 0 10px;
    }

    .recovery-card__progress .big-num {
      color: #fff;
      text-shadow: 0 2px 0 rgba(90, 15, 10, .2);
      font-size: 48px;
    }

    .recovery-card__progress .muted {
      color: rgba(255, 255, 255, .85);
      font-size: 13px;
    }

    .recovery-card__target-num {
      font-size: 24px;
      font-weight: 900;
      color: #fff;
    }

    .recovery-card .progress {
      height: 12px;
      background: rgba(255, 255, 255, .35);
    }

    .recovery-card__summary {
      margin: 16px 0;
      justify-content: center;
      gap: 40px;
    }

    .recovery-card__summary-item {
      text-align: center;
    }

    .recovery-card__summary-item strong {
      font-size: 28px;
      color: #fff;
    }

    .recovery-card__summary-item .muted {
      color: rgba(255, 255, 255, .85);
      margin-left: 2px;
      font-size: 14px;
    }

    .recovery-card__summary-item .small {
      color: rgba(255, 255, 255, .85);
      font-size: 12px;
      margin-top: 2px;
    }

    .recovery-card .btn.ghost {
      background: rgba(255, 255, 255, .18);
      color: #fff;
      border-color: rgba(255, 255, 255, .4);
    }

    .field-card {
      padding: 16px;
      background: rgba(255, 255, 255, .78);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 12px;
    }

    .field-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .field-card label {
      margin: 0;
      font-size: 15px;
      color: #3b2618;
    }

    .field-card__row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .field-card__icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .field-card__icon.red {
      color: var(--red);
    }

    .field-card__value {
      flex: 1;
      font-size: 15px;
      font-weight: 900;
      color: var(--ink);
    }

    .chevron {
      color: #c9a486;
      font-size: 22px;
    }

    .stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 4px 0;
    }

    .stepper-value {
      font-size: 30px;
      font-weight: 900;
      color: var(--ink);
      min-width: 64px;
      text-align: center;
    }

    .stepper-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 20px;
      font-weight: 900;
    }

    .stepper-btn--minus {
      background: #fff;
      border: 1px solid #c9a486;
      color: #5a321d;
    }

    .stepper-btn--plus {
      background: var(--green);
      color: #fff;
      box-shadow: 0 4px 10px rgba(33, 185, 87, .25);
    }

    .money-field {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
    }

    .money-symbol {
      font-size: 24px;
      font-weight: 900;
      color: var(--ink);
    }

    .money-input {
      flex: 1;
      border: 0;
      background: transparent;
      font-size: 36px;
      font-weight: 900;
      color: var(--ink);
      padding: 0;
      min-width: 0;
    }

    .money-unit {
      font-size: 15px;
      color: var(--muted);
    }

    .food-strip {
      display: flex;
      gap: 14px;
      overflow: hidden;
    }

    .food-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 56px;
    }

    .dish-img {
      object-fit: contain;
      display: block;
    }

    .dish-img--sm { width: 52px; height: 52px; }
    .dish-img--md { width: 64px; height: 64px; }
    .dish-img--lg { width: 110px; height: 110px; }

    .food-label {
      font-size: 11px;
      color: var(--muted);
    }

    .tier-list {
      padding-bottom: 0;
    }

    .tier-card {
      position: relative;
      min-height: auto;
      padding: 16px 50px 14px 16px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .tier-card.selected {
      border-color: var(--red);
      box-shadow:
        0 0 0 3px rgba(255, 48, 40, .08),
        var(--shadow);
    }

    .tier-card__badge {
      position: absolute;
      left: -1px;
      top: -1px;
      padding: 4px 10px;
      background: var(--red);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      border-radius: 14px 0 14px 0;
    }

    .tier-card__check {
      position: absolute;
      right: 16px;
      top: 20px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #c6b4a0;
      display: grid;
      place-items: center;
      color: transparent;
      font-size: 13px;
      font-weight: 900;
    }

    .tier-card.selected .tier-card__check {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .tier-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tier-card__title,
    .tier-card__price {
      font-size: 18px;
      font-weight: 900;
      color: var(--ink);
    }

    .tier-card__desc {
      color: #139444;
      font-size: 12px;
      font-weight: 800;
      margin-top: 2px;
    }

    .tier-diff {
      background: #fff0d7;
      border-color: #efd0a0;
      align-items: flex-start;
      margin-top: 4px;
    }

    .bottom-actions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 253, 248, .98);
      border-top: 1px solid var(--line);
      box-shadow: 0 -4px 11px rgba(126, 84, 44, .08);
      z-index: 12;
    }

    .phone.tier-select-page main {
      padding-bottom: 90px;
    }

    .pill.small {
      min-height: 22px;
      padding: 2px 8px;
      font-size: 12px;
    }

    .home-stack {
      display: grid;
      gap: 12px;
    }

    @media (max-width: 767px), (hover: none) and (pointer: coarse) {
      body {
        min-height: 100vh;
        min-height: 100dvh;
        padding: 0;
        background: #f7f0e6;
        display: block;
      }

      .stage {
        width: 100%;
        max-width: none;
        min-height: 100vh;
        min-height: 100dvh;
        display: block;
      }

      .phone {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .phone::before,
      .fake-phone-note { display: none; }

      .statusbar {
        height: 34px;
        padding-top: 11px;
      }
    }
  </style>
</head>

      ["admin", "adminTiers", "后台档位管理页"],

      ["reserved", "queue", "预留：排队记录页"],

      ["reserved", "room", "预留：同桌房间页"],
      ["reserved", "calorie", "预留：热量估算页"],

      ["reserved", "community", "预留：社区页"]

    const state = {
      page: "home",
      tab: "record",
      history: [],
      hasDraft: false,
      selectedTier: "三/四档",

      people: 1,
      paid: 199,
      currentRound: 1,
      activeCategory: "肉类",
      itemQty: { beef: 2, shrimp: 2, foie: 1, durian: 1 },
      rounds: [{ no: 1, time: "12:18", items: { beef: 2, shrimp: 2, foie: 1, durian: 1 }, status: "已点单" }],
      favoriteIds: ["beef", "shrimp", "tea", "foie", "durian", "rice"],
      selectedDish: "beef"
    };

    const app = document.getElementById("app");
    const phone = document.getElementById("phone");
    const appTitle = document.getElementById("appTitle");
    const overlay = document.getElementById("overlay");
    const sheet = document.getElementById("sheet");
    const toastEl = document.getElementById("toast");
    const pageMap = document.getElementById("pageMap");
    const mapBody = document.getElementById("mapBody");

    const mascotImageSrc = "assets/ui/mascot.png";
    const icon = name => `<svg class="hi" aria-hidden="true"><use href="#icon-${name}"></use></svg>`;
    const mascotImage = name => `<img src="${mascotImageSrc}" alt="${name}" loading="lazy">`;
    const asset = (name, size = "md", extra = "") => /小牛|吉祥物/.test(name)
      ? `<span class="asset mascot-asset ${size} ${extra}" title="${name}">${mascotImage(name)}</span>`
      : `<span class="asset ${size} ${extra}" title="${name}" aria-label="${name}"></span>`;
    const money = n => "¥" + Number(n || 0).toFixed(0);

    function dishImg(name, size = "sm") {
      return `<img class="dish-img dish-img--${size}" src="assets/ui/dish.png" alt="${name}" loading="lazy">`;
    }

    function foodItem(name) {
      return `<div class="food-item">${dishImg(name, "sm")}<span class="food-label">${name}</span></div>`;
    }

    function flowStep(iconName, num, title, desc) {
      return `
        <div class="flow-step">
          <div class="flow-step__icon">${icon(iconName)}</div>
          <strong>${num} ${title}</strong>
          <span>${desc}</span>
        </div>
      `;
    }

    function statColumn(label, value) {
      return `
        <div class="stat-column">
          <div class="stat-column__label">${label}</div>
          <div class="stat-column__value">${value}</div>
        </div>
      `;
    }

    function divider() {
      return `<div class="stat-divider"></div>`;
    }

    function tierFoodsFor(tierName) {
      const map = {
        "入门档": ["牛肉片", "玉米", "豆腐", "可乐"],
        "海鲜档": ["牛肉片", "去皮虾", "扇贝", "生蚝"],
        "三/四档": ["牛肉片", "去皮虾", "鹅肝", "榴莲千层"],
        "奢享档": ["和牛", "鹅肝", "鲍鱼", "榴莲千层"],
        "顶配档": ["雪花和牛", "帝王蟹腿", "鹅肝", "榴莲千层"]
      };
      return map[tierName] || [];
    }

    function homeHeroNormal() {
      return `<section class="hero hero-home hero-home--normal" aria-label="首页主视觉"></section>`;
    }

    function homeHeroResume() {
      return `<section class="hero hero-home hero-home--resume" aria-label="首页恢复态主视觉"></section>`;
    }

    function tipBanner(variant = "normal", text = "开心比回本重要，吃舒服也算赢<span style='color:#ff3028'>❤</span>") {
      return `
        <section class="tip-banner tip-banner--${variant}">
          <div class="tip-banner__text">${text}</div>
        </section>
      `;
    }

    function itemStats(items = {}) {
      return Object.entries(items).reduce((sum, [id, qty]) => {
        const dish = dishes.find(d => d.id === id);
        if (!dish || qty <= 0) return sum;
        return { total: sum.total + dish.value * qty, count: sum.count + qty };
      }, { total: 0, count: 0 });
    }

    function currentTotals() {
      const current = itemStats(state.itemQty);
      return { ...current, percent: Math.round(current.total / state.paid * 100), diff: current.total - state.paid };
    }

    function totals() {
      const completed = state.rounds.reduce((acc, round) => {
        const stats = itemStats(round.items);
        return { total: acc.total + stats.total, count: acc.count + stats.count };
      }, { total: 0, count: 0 });
      const total = completed.total;
      return { ...completed, percent: Math.round(total / state.paid * 100), diff: total - state.paid };
    }

    function allTotals() {
      const done = totals();
      const current = currentTotals();
      const total = done.total + current.total;
      const count = done.count + current.count;
      return { total, count, percent: Math.round(total / state.paid * 100), diff: total - state.paid };
    }

    function qtyRow(id, qty, withValue = true) {
      const dish = dishes.find(d => d.id === id) || dishes[0];
      return `
        <div class="list-row row">
          <div class="row grow" style="justify-content:flex-start">
            ${dishImg(dish.name, "sm")}
            <div>
              <strong>${dish.name}</strong>
              ${withValue ? `<div class="small">${dish.unit || "份"} · 估 <span class="price">${money(dish.value * qty)}</span></div>` : ""}
            </div>
          </div>
          ${withValue ? `<div class="qty">
            <button class="btn square ghost" data-dec="${id}">-</button>
            <strong>${qty}</strong>
            <button class="btn square primary" data-inc="${id}">+</button>
          </div>` : `<span class="pill green">${icon("checkmark-circle-02")}</span>`}
        </div>
      `;
    }

    function itemRows(items = state.itemQty, withValue = true) {
      const rows = Object.entries(items).filter(([, qty]) => qty > 0).map(([id, qty]) => qtyRow(id, qty, withValue)).join("");
      return rows || `<div class="card muted center">还没有添加菜品。</div>`;
    }

    function checkoutItemRows(items = {}) {
      return Object.entries(items).filter(([, qty]) => qty > 0).map(([id, qty]) => {
        const dish = dishes.find(d => d.id === id) || dishes[0];
        return `
          <div class="list-row">
            <div class="row">
              <div class="row" style="justify-content:flex-start">${dishImg(dish.name, "sm")}<strong>${dish.name}</strong></div>
              <strong class="price">${money(dish.value * qty)}</strong>
            </div>
            <div class="row small" style="margin-top:4px">
              <span>${qty}x · 单价 ${money(dish.value)} / ${dish.unit || "份"}</span>
              <span>小计</span>
            </div>
          </div>
        `;
      }).join("") || `<div class="muted">暂无菜品</div>`;
    }

    function pageShell(title, body) {
      appTitle.textContent = title;

      const recordPages = ["setup", "tierSelect", "recording", "currentList", "orderConfirm", "orderSheet", "missingDish", "settleConfirm", "settlement", "shareCard"];
      phone.classList.toggle("record-mode", recordPages.includes(state.page));
      phone.classList.toggle("home-page", state.page === "home");
      phone.classList.toggle("tier-select-page", state.page === "tierSelect");

      const noBackPages = ["home", "menuHome", "statsHome"];
      document.getElementById("backBtn").style.visibility = noBackPages.includes(state.page) ? "hidden" : "visible";

      document.querySelector(".bottom-tabs").innerHTML = renderTabs();
      app.innerHTML = body;
      app.scrollTop = 0;
    }

    function renderTabs() {
      const tabs = [
        { id: "record", label: "首页", img: "home" },
        { id: "menu", label: "菜单", img: "menu" },
        { id: "stats", label: "我的", img: "mine" }
      ];
      return tabs.map(t => `
        <button class="tab ${state.tab === t.id ? "active" : ""}" data-tab="${t.id}">
          <img class="tab__icon" src="assets/tab-${t.img}${state.tab === t.id ? "-selected" : ""}.png" alt="${t.label}">
          ${t.label}
        </button>
      `).join("");
    }

    function hero(compact = false) {
      return `
        <section class="hero ${compact ? "compact" : ""}">
          <span class="spark" style="left:28px;top:82px"></span>
          <div class="hero-title">
            <h1 class="brand-word">今天<br>一定要回本</h1>
            <span class="ribbon">开始记录牛new，吃完自动结算</span>
          </div>
          <div class="hero-mascot" title="小牛主视觉">${mascotImage("小牛主视觉")}</div>
          ${compact ? "" : `<div class="hero-dish">
            <div class="plate"></div>
            <div class="pot"></div>
            <div class="plate"></div>
          </div>`}
        </section>
      `;
    }

    function tipCard(text = "开心比回本重要，吃舒服也算赢") {
      return `<section class="notice">${asset("小牛提示条切图", "sm")}<strong>${text} ❤</strong></section>`;
    }

    function renderHome() {
      if (state.hasDraft) {
        const t = totals();
        pageShell("记录首页", `
          ${homeHeroResume()}
          <section class="card recovery-card">
            <div class="recovery-card__header">
              <h2>继续未完成记录</h2>
              <span class="recovery-card__star">★</span>
            </div>
            <div class="card recovery-card__inner">
              <div class="row recovery-card__store">
                <span class="field-card__icon red">${icon("location-01")}</span>
                <strong class="field-card__value">${state.store}</strong>
                <span class="chevron">›</span>
              </div>
              <div class="recovery-card__stats">
                ${statColumn("档位", state.selectedTier)}
                ${divider()}
                ${statColumn("人数", state.people + "人")}
                ${divider()}
                ${statColumn("保存时间", "12:30")}
              </div>
            </div>
            <div class="recovery-card__progress">
              <div>
                <div class="muted">当前过线进度</div>
                <div class="big-num">${t.percent}%</div>
              </div>
              <div class="recovery-card__target">
                <div class="muted">过线目标</div>
                <div class="recovery-card__target-num">100%</div>
              </div>
            </div>
            <div class="progress"><div class="bar" style="width:${Math.min(t.percent, 160)}%"></div></div>
            <div class="recovery-card__summary row">
              <div class="recovery-card__summary-item">
                <strong>${t.count}</strong><span class="muted">道</span>
                <div class="small">已记录菜品</div>
              </div>
              <div class="recovery-card__summary-item">
                <strong>${state.rounds.length}</strong><span class="muted">轮</span>
                <div class="small">点单轮次</div>
              </div>
            </div>
            <button class="btn primary full" data-go="recording">继续上次记录</button>
            <button class="btn ghost full" style="margin-top:12px" data-action="restart">放弃并重新开始</button>
          </section>
          ${tipBanner("resume")}
        `);
        return;
      }

      pageShell("今天一定要回本", `
        ${homeHeroNormal()}
        <button class="btn primary full" style="margin-top:16px" data-go="setup">开始本次记录</button>
        <section class="card flow-card">
          <div class="section-title" style="margin-top:0">记录流程</div>
          <div class="flow-steps">
            ${flowStep("store-01", "1", "选门店", "定位选择门店")}
            <span class="flow-arrow">›</span>
            ${flowStep("menu-restaurant", "2", "选档位", "选择合适档位")}
            <span class="flow-arrow">›</span>
            ${flowStep("money-bag-02", "3", "填金额", "输入实付金额")}
            <span class="flow-arrow">›</span>
            ${flowStep("check-list", "4", "开始记录", "自动计算进度")}
          </div>
        </section>
        ${tipBanner("normal")}
      `);
    }

    function renderSetup() {
      pageShell("记录设置", `
        <section class="card field-card">
          <div class="field-card__header">
            <label>选择门店</label>
            <span class="pill green small">${icon("location-update-01")}重新定位</span>
          </div>
          <div class="field-card__row clickable" data-go="storeSelect">
            <span class="field-card__icon red">${icon("location-01")}</span>
            <strong class="field-card__value">${state.store}</strong>
            <span class="chevron">›</span>
          </div>
        </section>
        <section class="card field-card clickable" data-go="tierSelect">
          <label>选择档位</label>
          <div class="field-card__row">
            <strong class="field-card__value">${state.selectedTier} · ${money(state.paid)}/人</strong>
            <span class="chevron">›</span>
          </div>
          <div class="food-strip" style="margin-top:10px">
            ${tierFoodsFor(state.selectedTier).map(f => foodItem(f)).join("")}

        </section>
        <section class="card field-card">
          <label>用餐人数</label>
          <div class="stepper">
            <button class="stepper-btn stepper-btn--minus" data-action="people-minus">−</button>
            <strong class="stepper-value">${state.people} 人</strong>
            <button class="stepper-btn stepper-btn--plus" data-action="people-plus">+</button>
          </div>

        <section class="card field-card">
          <label>实付金额（元/人）</label>
          <div class="money-field">
            <span class="money-symbol">¥</span>
            <input id="paidInput" class="money-input" type="number" value="${state.paid}" aria-label="实付金额">
            <span class="money-unit">元/人</span>
          </div>
        </section>
        <div class="notice">${icon("information-circle")} 使用优惠券后，实付金额将影响过线目标</div>
        <button class="btn primary full" style="margin-top:18px" data-action="start-record">开始这次</button>
      `);
    }

    function renderTierSelect() {

          <label style="margin-top:14px">关联菜品（可选）</label><input placeholder="可选，例如：和牛">
          <label style="margin-top:14px">发现时间 *</label><input type="datetime-local" value="2026-06-06T12:30">
          <label style="margin-top:14px">门店 *</label><select><option>苏州相城龙湖餐厅</option><option>上海五角场店</option><option>其他门店</option></select>
          <label style="margin-top:14px">上传菜单 / 菜品照片 *</label><div class="upload">${icon("camera-01")}<div><strong>上传菜单/菜品照片</strong><div class="small">支持拍照或从相册选择，最多 6 张</div></div></div>
          <label style="margin-top:14px">问题说明 *</label><textarea placeholder="哪里不准？（请尽量详细描述）"></textarea>
          <button class="btn primary full" style="margin-top:18px" data-action="send-feedback">提交反馈</button>
        </section>
      `);
    }

    function renderStatsHome() {
      const t = totals();
      pageShell("我的战绩", `
        <section class="card" style="min-height:172px;background:linear-gradient(180deg,#fff,#fff5e4)">
          <div class="row">${asset("我的战绩页小牛奖杯切图", "lg")}<h2 class="brand-word" style="font-size:22px">吃舒服，也算赢！</h2></div>
          <div class="grid3 center">
            <div class="card"><div class="stat-num">3次</div><div class="small">过线次数</div></div>
            <div class="card"><div class="stat-num">¥186</div><div class="small">累计差额</div></div>
            <div class="card"><div class="stat-num" style="color:var(--green)">A</div><div class="small">本周表现</div></div>
          </div>
        </section>
        <section class="card">
          <div class="row"><strong>最近一次战绩</strong>${asset("最近战绩小牛切图", "md")}</div>
          <div class="small">${state.store} / ${state.selectedTier} · ${state.people}人 · 2026/06/06 12:20</div>
          <div class="row"><div><span class="muted">过线进度</span><div class="big-num">${t.percent}%</div></div><div class="center"><strong>${state.rounds.length}轮</strong><div class="small">点单轮次</div></div></div>
          <div class="progress"><div class="bar" style="width:${Math.min(t.percent, 160)}%"></div></div>
          <button class="btn primary full" style="margin-top:12px" data-go="recordDetail">查看详情</button>
        </section>
        <div class="menu-list">
          <button class="btn menu-row" data-go="receipts">${icon("receipt-dollar")}<span class="grow">小票夹</span><span>›</span></button>
          <button class="btn menu-row" data-go="favorites">${icon("favourite")}<span class="grow">我的最爱</span><span>›</span></button>
          <button class="btn menu-row" data-go="support">${icon("message-question")}<span class="grow">反馈 / 进群</span><span>›</span></button>
          <button class="btn menu-row" data-go="settings">${icon("settings-02")}<span class="grow">设置 / 关于</span><span>›</span></button>
        </div>
      `);
    }

    function renderReceipts() {
      const data = [132, 116, 93, 128, 105, 89];
      pageShell("小票夹", `
        ${data.map((p, i) => `
          <section class="card receipt-card clickable" data-go="recordDetail">
            ${asset("小票缩略图切图", "md")}
            <div><strong>牛new 第${i + 1}张小票</strong><div class="small">2026/06/${String(6 - i).padStart(2, "0")} · ${i % 2 + 1}轮点单 · ${i % 3 + 1}人</div></div>
            <div class="center"><strong class="price" style="font-size:24px">${p}%</strong><span class="pill ${p >= 100 ? "green" : "gray"}">${p >= 100 ? "已过线" : "未过线"}</span></div>
          </section>
        `).join("")}
        <button class="btn primary full" data-go="setup" data-tabto="record">${icon("add-01")}开新记录</button>
      `);
    }

    function renderRecordDetail() {
      const t = totals();
      pageShell("战绩详情", `
        <section class="card">
          <div class="row"><div><span class="pill">本次结算摘要</span><div class="grid2" style="margin-top:12px"><div><span class="small">实付金额</span><strong style="display:block">${money(state.paid)}</strong></div><div><span class="small">估算价值</span><strong style="display:block">${money(t.total)}</strong></div></div></div>${asset("战绩详情小牛切图", "md")}</div>
          <div class="center"><div class="big-num">${t.percent}%</div></div>
          <div class="progress"><div class="bar" style="width:${Math.min(t.percent, 160)}%"></div></div>
        </section>
        <section class="card"><h3>按轮次点单记录</h3>${state.rounds.map(r => `<section class="card"><div class="row"><strong>第 ${r.no} 轮点单</strong><span class="small">${r.time} <span class="pill green">已点单</span></span></div><div class="food-strip">${Object.entries(r.items).filter(([, qty]) => qty > 0).map(([id, qty]) => { const d = dishes.find(x => x.id === id); return `<div class="center">${dishImg(d.name, "sm")}<div class="small">${qty}x ${d.name}</div></div>`; }).join("")}</div></section>`).join("")}</section>
        <button class="btn primary full" data-go="shareCard" data-tabto="record">查看结算卡</button>
      `);
    }

    function renderAchievements() {
      const items = [
        ["第一张小票", "完成首张小票记录", true, "奖杯成就切图"],
        ["初出茅庐", "成功过线 1 次", true, "奖杯成就切图"],
        ["今天过线", "今天过线 1 次", true, "奖杯成就切图"],
        ["回本专家", "累计过线 10 次", true, "奖杯成就切图"],
        ["菜单研究员", "收藏菜品 20 个", false, "灰色锁定奖杯切图"],
        ["回本常客", "累计过线 10 次", false, "灰色锁定奖杯切图"]
      ];
      pageShell("成就奖杯", `
        <div class="dish-grid">
          ${items.map(([name, desc, ok, assetName]) => `<section class="card center"><div>${asset(assetName, "lg", ok ? "trophy" : "trophy locked")}</div><h3>${name}</h3><span class="pill ${ok ? "red" : "gray"}">${ok ? "已解锁" : "未解锁"}</span><p>${desc}</p></section>`).join("")}
        </div>
        <div class="notice">${asset("成就提示小牛切图", "sm")} 更多成就，等你解锁！吃好喝好，快乐回本！❤</div>
      `);
    }

    function renderFavorites() {
      pageShell("我的最爱", `
        <section class="notice">${asset("我的最爱页小牛切图", "sm")} 收藏常点菜，下次记录更快</section>
        <div class="dish-grid" style="margin-top:12px">${state.favoriteIds.map(id => dishMini(dishes.find(d => d.id === id))).join("")}</div>
        <div class="notice" style="margin-top:12px">${icon("star")} 收藏越多，点单越快，回本越稳！</div>
      `);
    }

    function renderSupport() {
      pageShell("反馈 / 进群", `
        <div class="grid2">
          <button class="card clickable center" data-go="feedback" data-tabto="menu">${icon("edit-02")}<h3>菜单纠错</h3><p>菜品/价格/档位纠错</p></button>
          <button class="card clickable center" data-action="send-feedback">${icon("message-02")}<h3>问题反馈</h3><p>使用问题或建议</p></button>
        </div>
        <section class="card center"><h2>申请加入自助同好群</h2><div class="upload" title="缺失：进群二维码切图">${icon("qr-code")}<strong>二维码切图留白</strong></div><p>长按识别二维码，添加小饭袋客服进群</p></section>
        <section class="card"><h3>${icon("shield-01")} 免责声明</h3><p>本工具为用户自发整理，非官方工具；菜品估值仅供娱乐参考，不构成任何消费建议；请理性消费，开心最重要，吃舒服也算赢。</p>${asset("免责声明小牛切图", "sm")}</section>
      `);
    }

    function renderSettings() {
      pageShell("设置 / 关于", `
        <div class="menu-list">
          <button class="btn menu-row"><span>昵称</span><span>小饭袋爱吃肉 ›</span></button>
          <button class="btn menu-row"><span>隐私说明</span><span>›</span></button>
          <button class="btn menu-row" data-action="clear-draft"><span>清理未完成记录</span><span>${state.hasDraft ? "1 条" : "0 条"} ›</span></button>
        </div>
        <section class="card"><div class="row"><strong>授权状态</strong><span class="pill green">游客模式</span></div><div class="notice" style="margin-top:12px">当前为游客模式，可正常浏览和使用原型，不会保存你的战绩和个人数据</div></section>
        <button class="btn full" data-go="adminDashboard" data-tabto="admin">进入运营后台原型</button>
        <section class="card row"><strong>版本信息</strong><span>v1.0.0 ›</span></section>
        <section class="notice">${asset("设置页底部小牛切图", "sm")} 吃舒服，也算赢！今天一定要回本呀～</section>
      `);
    }

    function adminPage(title, rows) {
      pageShell(title, `<section class="card"><h2>${title}</h2><p>后台原型统一套用高保真基础组件，用于验证运营入口。</p></section>${rows.map(r => `<section class="card row"><strong>${r}</strong><button class="btn compact">处理</button></section>`).join("")}`);
    }

    function reservedPage(title) {
      pageShell(title, `<section class="card center"><span class="pill">P2 预留</span><h2>${title}</h2><p>该页面只保留入口和方向，不进入 V1 主线开发。</p>${asset("预留页插画切图", "lg")}</section>`);
    }

    const renderers = {
      home: renderHome,
      setup: renderSetup,
      tierSelect: renderTierSelect,
      recording: renderRecording,
      currentList: renderCurrentList,
      orderConfirm: renderOrderConfirm,
      orderSheet: renderOrderSheet,
      missingDish: renderMissingDish,
      settleConfirm: () => pageShell("结算确认", settleConfirmMarkup()),
      settlement: renderSettlement,
      shareCard: renderShareCard,
      menuHome: renderMenuHome,
      dishList: renderDishList,
      dishDetail: renderDishDetail,
      tierDetail: renderTierDetail,
      updates: renderUpdates,
      feedback: renderFeedback,
      statsHome: renderStatsHome,
      receipts: renderReceipts,
      recordDetail: renderRecordDetail,
      achievements: renderAchievements,
      favorites: renderFavorites,
      support: renderSupport,
      settings: renderSettings,
      adminDashboard: () => adminPage("后台首页", ["开始记录转化率 36%", "结算卡生成率 29%", "菜单反馈率 7%"]),
      adminDishes: () => adminPage("菜品管理", ["和牛 · ¥66", "去皮虾 · ¥38", "鹅肝 · 待确认"]),
      adminTiers: () => adminPage("档位管理", ["三/四档 ¥199", "海鲜档 ¥149", "入门档 ¥99"]),
      adminUpdates: () => adminPage("菜单版本日志管理", ["新菜上架", "估值调整", "门店差异"]),
      adminFeedback: () => adminPage("反馈审核", ["档位不对反馈", "价格不准反馈", "新菜单图片"]),
      adminPending: () => adminPage("找不到菜审核", ["新牛舌 8次", "手打虾滑 5次", "门店限定饮品 3次"]),
      adminRisk: () => adminPage("战绩异常查看", ["短时间重复结算", "超大数量", "过高估算金额"]),
      queue: () => reservedPage("排队记录页"),
      brandVote: () => reservedPage("新品牌投票页"),
      room: () => reservedPage("同桌房间页"),
      calorie: () => reservedPage("热量估算页"),
      coupon: () => reservedPage("餐券 / 优惠页"),
      community: () => reservedPage("社区页")
    };

    function nav(page, tab = state.tab) {
      state.history.push(state.page);
      state.page = page;
      state.tab = tab;
      closeSheet();
      render();
    }

    function back() {
      if (state.page === "recording" || state.page === "shareCard") {
        state.page = "home";
        state.tab = "record";
        state.history = [];
        render();
        return;
      }
      if (state.page === "orderConfirm" || state.page === "orderSheet") {
        state.page = "recording";
        render();
        return;
      }
      const prev = state.history.pop();
      if (prev) state.page = prev;
      else state.page = state.tab === "menu" ? "menuHome" : state.tab === "stats" ? "statsHome" : "home";
      closeSheet();
      render();
    }

    function setTab(tab) {
      state.tab = tab;
      state.page = tab === "record" ? "home" : tab === "menu" ? "menuHome" : "statsHome";
      state.history = [];
      closeSheet();
      render();
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1700);
    }

    function showSheet(kind) {
      const map = { cartSheet: cartSheetMarkup, missingDish: missingDishFields, settleConfirm: settleConfirmMarkup };
      sheet.innerHTML = (map[kind] || cartSheetMarkup)();
      overlay.classList.add("open");
    }

    function closeSheet() { overlay.classList.remove("open"); }

    function renderMap() {
      const labels = { record: "记录", menu: "菜单", stats: "我的", admin: "后台", reserved: "预留" };
      mapBody.innerHTML = Object.keys(labels).map(group => `
        <div class="section-title">${labels[group]}</div>
        ${pages.filter(p => p[0] === group).map(p => `<button class="map-btn" data-map-page="${p[1]}" data-map-tab="${p[0]}">${p[2]}</button>`).join("")}
      `).join("");
    }

    function render() {
      (renderers[state.page] || renderHome)();
    }

    document.addEventListener("click", event => {
      const el = event.target.closest("button, [data-go], [data-dish], [data-cat], [data-map-page]");
      if (!el || el.disabled) return;

      if (el.dataset.tab) return setTab(el.dataset.tab);
      if (el.dataset.mapPage) {
        state.page = el.dataset.mapPage;
        if (["record", "menu", "stats"].includes(el.dataset.mapTab)) state.tab = el.dataset.mapTab;
        pageMap.classList.remove("open");
        return render();
      }
      if (el.dataset.dish) state.selectedDish = el.dataset.dish;
      if (el.dataset.go) return nav(el.dataset.go, el.dataset.tabto || state.tab);
      if (el.dataset.sheet) return showSheet(el.dataset.sheet);
      if (el.dataset.closeSheet !== undefined) return closeSheet();
      if (el.dataset.cat) { state.activeCategory = el.dataset.cat; return render(); }
      if (el.dataset.inc) {
        state.itemQty[el.dataset.inc] = (state.itemQty[el.dataset.inc] || 0) + 1;
        return render();
      }
      if (el.dataset.dec) {
        state.itemQty[el.dataset.dec] = Math.max(0, (state.itemQty[el.dataset.dec] || 0) - 1);
        return render();
      }
      if (el.dataset.fav) {
        const id = el.dataset.fav;
        state.favoriteIds = state.favoriteIds.includes(id) ? state.favoriteIds.filter(x => x !== id) : [...state.favoriteIds, id];
        toast("收藏状态已更新");
        return render();
      }
      if (el.dataset.tier) {
        state.selectedTier = el.dataset.tier;
        state.paid = Number(el.dataset.price);
        toast("已选择 " + state.selectedTier);
        return render();
      }

      const action = el.dataset.action;
      if (!action) return;
      if (action === "mock-draft") {
        state.hasDraft = true;
        render();
      } else if (action === "restart") {
        if (confirm("确认放弃未完成记录并重新开始？")) {
          state.hasDraft = false;
          nav("setup", "record");
        }
      } else if (action === "people-plus") {
        state.people += 1;
        render();
      } else if (action === "people-minus") {
        state.people = Math.max(1, state.people - 1);
        render();
      } else if (action === "confirm-tier") {
        toast("已确认 " + state.selectedTier);
        nav("setup", "record");
      } else if (action === "start-record") {
        const paidInput = document.getElementById("paidInput");
        if (paidInput) state.paid = Number(paidInput.value || state.paid);
        state.hasDraft = true;
        state.currentRound = 1;
        state.rounds = [];
        state.itemQty = { beef: 2, shrimp: 2, foie: 1, durian: 1 };
        state.activeCategory = "肉类";
        nav("recording", "record");
      } else if (action === "finish-order") {
        state.rounds.push({ no: state.currentRound, time: "12:" + String(10 + state.currentRound * 8).padStart(2, "0"), items: { ...state.itemQty }, status: "已点单" });
        state.currentRound += 1;
        state.itemQty = {};
        toast("第 " + (state.currentRound - 1) + " 轮已点单完成");
        nav("recording", "record");
      } else if (action === "confirm-settle") {
        state.hasDraft = false;
        closeSheet();
        nav("shareCard", "record");
      } else if (action === "add-missing") {
        state.itemQty.mystery = (state.itemQty.mystery || 0) + 1;
        toast("已先记一笔");
        closeSheet();
        render();
      } else if (action === "send-feedback") {
        toast("已收到反馈");
      } else if (action === "save-card") {
        toast("已模拟保存图片");
      } else if (action === "share-card") {
        toast("已模拟分享");
      } else if (action === "regenerate-card") {
        toast("已重新生成结算卡");
      } else if (action === "clear-draft") {
        state.hasDraft = false;
        toast("已清理草稿");
        render();
      }
    });

    document.getElementById("backBtn").addEventListener("click", back);
    document.getElementById("mapBtn").addEventListener("click", () => {
      renderMap();
      pageMap.classList.add("open");
    });
    document.getElementById("closeMap").addEventListener("click", () => pageMap.classList.remove("open"));
    overlay.addEventListener("click", e => {
      if (e.target === overlay) closeSheet();
    });

    render();
  </script>
</body>
</html>
