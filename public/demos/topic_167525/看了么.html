function parseHash() {
  var hash = window.location.hash.slice(1);
  if (!hash) hash = '/';
  var parts = hash.split('?');
  var path = parts[0];
  var query = {};
  if (parts[1]) {
    var searchParams = new URLSearchParams(parts[1]);
    searchParams.forEach(function (value, key) {
      query[key] = value;
    });
  }
  return {
    path: path,
    query: query
  };
}
function buildQuery(params) {
  return Object.keys(params).map(function (key) {
    return key + '=' + encodeURIComponent(params[key]);
  }).join('&');
}

function compareLabValue(valueStr, referenceRange) {
  var value = parseFloat(valueStr);
  if (isNaN(value)) return 'normal';
  var rangeMatch = referenceRange.match(/^([\d.]+)\s*[-~]\s*([\d.]+)$/);
  if (rangeMatch) {
    var min = parseFloat(rangeMatch[1]);
    var max = parseFloat(rangeMatch[2]);
    if (value < min) return 'low';
    if (value > max) return 'high';
    return 'normal';
  }
  var lessMatch = referenceRange.match(/^<\s*([\d.]+)$/);
  if (lessMatch) {
    var threshold = parseFloat(lessMatch[1]);
    return value > threshold ? 'high' : 'normal';
  }
  var greaterMatch = referenceRange.match(/^>\s*([\d.]+)$/);
  if (greaterMatch) {
    var threshold2 = parseFloat(greaterMatch[1]);
    return value < threshold2 ? 'low' : 'normal';
  }
  return 'normal';
}
