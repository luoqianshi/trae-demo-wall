<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>敦煌匠坊 v2.0 - 地图探索版</title>
<style>
  :root {
    --bg:#1A1428;--bg2:#251D3A;--bg3:#2D2548;--bg4:#3D3458;--ink:#F5EDE0;--muted:#A89B8C;
    --rule:#4A4068;--accent:#C17817;--accent2:#D4A84B;--success:#4CAF50;--danger:#E74C3C;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html{font-size:16px}
  body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;overflow:hidden;height:100vh}
  .screen{display:none;height:100vh;overflow:hidden;position:relative}
  .screen.active{display:block}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border:none;border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;transition:all .2s;gap:6px}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#D4892A}
  .btn-secondary{background:var(--bg3);color:var(--ink);border:1px solid var(--rule)}
  .btn-gold{background:var(--accent2);color:var(--bg)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .card{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:14px;margin:10px 0}

  /* ===== 角色选择 ===== */
  #screen-role{background:linear-gradient(180deg,var(--bg) 0%,#2D1F3A 100%);flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  #screen-role.active{display:flex}
  #screen-role h1{font-size:1.8rem;color:var(--accent2);margin-bottom:6px}
  #screen-role .subtitle{color:var(--muted);margin-bottom:20px;font-size:.9rem}
  .role-cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
  .role-card{background:rgba(37,29,58,.9);border:2px solid var(--rule);border-radius:16px;padding:16px;cursor:pointer;transition:all .3s;text-align:left;display:flex;gap:14px;align-items:center}
  .role-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .role-card.selected{border-color:var(--accent2);background:rgba(212,168,75,.1)}
  .role-card img{width:80px;height:80px;border-radius:12px;object-fit:cover;border:2px solid var(--rule)}
  .role-card .info{flex:1}
  .role-card .role-name{font-size:1.15rem;font-weight:700;color:var(--accent2);margin-bottom:4px}
  .role-card .role-desc{font-size:.8rem;color:var(--muted);margin-bottom:6px}
  .role-card .role-tags{display:flex;flex-wrap:wrap;gap:4px}
  .role-card .role-tags span{background:var(--bg3);padding:2px 8px;border-radius:4px;font-size:.72rem}
  .start-btn{margin-top:16px;width:100%;max-width:420px;padding:14px;font-size:1.05rem}

  /* ===== 顶部栏 ===== */
  .top-bar{position:fixed;top:0;left:0;right:0;background:rgba(26,20,40,.95);backdrop-filter:blur(10px);z-index:100;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);height:48px}
  .top-bar .title{font-weight:700;color:var(--accent2);font-size:1rem}
  .top-bar .stats{display:flex;gap:10px;font-size:.8rem}
  .stat-item{display:flex;align-items:center;gap:3px;color:var(--muted)}
  .stat-item .value{color:var(--accent2);font-weight:700}

  /* ===== 底部导航 ===== */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(26,20,40,.95);backdrop-filter:blur(10px);z-index:100;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid var(--rule)}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:.68rem;transition:color .2s}
  .nav-item .icon{font-size:1.3rem}
  .nav-item.active{color:var(--accent)}

  /* ===== 内容区 ===== */
  .content-area{padding:54px 12px 64px;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ===== 地图系统 ===== */
  .map-container{position:relative;width:100%;height:calc(100vh - 118px);border-radius:12px;overflow:hidden;border:2px solid var(--rule);background-size:cover;background-position:center}
  .map-player{position:absolute;width:44px;height:44px;border-radius:50%;border:3px solid var(--accent2);box-shadow:0 0 12px rgba(212,168,75,.5);transition:all .6s ease;z-index:10;background-size:cover;background-position:center;background-color:var(--bg2)}
  .map-player::after{content:attr(data-name);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.65rem;color:#fff;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:4px;white-space:nowrap}
  .map-npc{position:absolute;width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;z-index:5;animation:float 2s ease-in-out infinite}
  .map-npc .label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--accent2);background:rgba(0,0,0,.6);padding:1px 5px;border-radius:3px;white-space:nowrap}
  .map-locked{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20}
  .map-locked .lock-icon{font-size:3rem;color:var(--muted);margin-bottom:8px}
  .map-locked p{color:var(--muted);font-size:.85rem;text-align:center;padding:0 20px}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px rgba(193,120,23,.4)}50%{box-shadow:0 0 16px rgba(193,120,23,.8)}}

  /* ===== 地图切换标签 ===== */
  .map-tabs{position:fixed;top:48px;left:0;right:0;display:flex;gap:0;z-index:99;background:var(--bg2);border-bottom:1px solid var(--rule)}
  .map-tab{flex:1;text-align:center;padding:8px;font-size:.8rem;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
  .map-tab.active{border-bottom-color:var(--accent);color:var(--accent);background:rgba(193,120,23,.1)}
  .map-tab.locked{color:var(--muted);opacity:.6}

  /* ===== 任务卡片 ===== */
  .task-card{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}
  .task-card:hover{border-color:var(--accent)}
  .task-card .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .task-card .title{font-weight:700;font-size:.95rem}
  .task-card .diff{font-size:.7rem;padding:2px 8px;border-radius:4px;color:#fff}
  .task-card .desc{font-size:.82rem;color:var(--muted);margin-bottom:10px}
  .task-card .meta{display:flex;gap:10px;font-size:.75rem;color:var(--muted);margin-bottom:8px}
  .task-card .reward{font-size:.82rem;color:var(--accent2);padding-top:8px;border-top:1px solid var(--rule)}

  /* ===== 万宝楼 ===== */
  .market-tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
  .market-tab2{padding:6px 14px;background:var(--bg2);border:1px solid var(--rule);border-radius:16px;font-size:.8rem;cursor:pointer;white-space:nowrap}
  .market-tab2.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .m-item{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:12px;margin:10px 0;display:flex;gap:10px;align-items:center}
  .m-item .icon{font-size:2rem}
  .m-item .info{flex:1}
  .m-item .name{font-weight:700;font-size:.9rem}
  .m-item .seller{font-size:.75rem;color:var(--muted)}
  .m-item .price{font-size:1rem;color:var(--accent2);font-weight:700}

  /* ===== 背包 ===== */
  .inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .inv-slot{aspect-ratio:1;background:var(--bg2);border:2px solid var(--rule);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:.65rem}
  .inv-slot:hover{border-color:var(--accent)}
  .inv-slot .ic{font-size:1.6rem}
  .inv-slot .ct{position:absolute;bottom:3px;right:5px;font-size:.7rem;font-weight:700;color:var(--accent2)}

  /* ===== 弹窗 ===== */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:16px}
  .modal.active{display:flex}
  .modal-box{background:var(--bg2);border:1px solid var(--rule);border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
  .modal-title{font-size:1.15rem;font-weight:700;color:var(--accent2);margin-bottom:14px;text-align:center}

  /* ===== 进度条 ===== */
  .progress{width:100%;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0}
  .progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .5s}

  /* ===== Toast ===== */
  .toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--bg2);border:1px solid var(--accent);border-radius:8px;padding:10px 18px;z-index:300;font-size:.85rem;transition:transform .3s;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* ===== 经验条 ===== */
  .exp-bar-container{background:var(--bg3);border-radius:8px;padding:10px;margin:10px 0}
  .exp-bar-label{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px}
  .exp-bar{width:100%;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
  .exp-bar .fill{height:100%;background:var(--accent2);border-radius:5px;transition:width .5s}

  /* ===== 地图提示 ===== */
  .map-hint{position:absolute;bottom:10px;left:10px;right:10px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:8px;font-size:.8rem;color:var(--muted);z-index:15;text-align:center}

  .npc-panel{position:absolute;bottom:10px;left:10px;right:10px;background:var(--bg2);border:1px solid var(--accent);border-radius:12px;padding:14px;z-index:15;display:none}
  .npc-panel.active{display:block;animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

  input,select{width:100%;padding:10px;background:var(--bg3);border:1px solid var(--rule);border-radius:8px;color:var(--ink);font-size:.9rem;margin:6px 0}
  input:focus,select:focus{outline:none;border-color:var(--accent)}

  .section-title{font-weight:700;color:var(--accent2);margin:16px 0 10px;font-size:1.05rem}

  /* ===== 页面切换动画 ===== */
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
  .content-area>*{animation:fadeInUp .35s ease both}
  .content-area>*:nth-child(1){animation-delay:.02s}
  .content-area>*:nth-child(2){animation-delay:.06s}
  .content-area>*:nth-child(3){animation-delay:.1s}
  .content-area>*:nth-child(4){animation-delay:.14s}
  .content-area>*:nth-child(5){animation-delay:.18s}

  /* ===== 按钮动效 ===== */
  .btn{position:relative;overflow:hidden;transition:all .25s cubic-bezier(.4,0,.2,1)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(193,120,23,.45)}
  .btn-primary:active{transform:translateY(0) scale(.98)}
  .btn-gold:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,168,75,.45)}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
  .btn::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.25) 0%,transparent 60%);opacity:0;transition:opacity .3s}
  .btn:hover::after{opacity:1}

  /* ===== 卡片动效 ===== */
  .role-card,.task-card,.m-item,.card{transition:all .3s cubic-bezier(.4,0,.2,1)}
  .task-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.35);border-color:var(--accent)}
  .m-item:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.3);border-color:var(--accent)}
  .inv-slot{transition:all .2s}
  .inv-slot:hover{transform:scale(1.08);border-color:var(--accent);box-shadow:0 4px 12px rgba(193,120,23,.3)}

  /* ===== 弹窗动效 ===== */
  .modal{transition:opacity .25s}
  .modal:not(.active){opacity:0;pointer-events:none}
  .modal-box{animation:fadeInScale .25s ease both}

  /* ===== 顶部栏/底部栏增强 ===== */
  .top-bar{border-bottom:1px solid rgba(212,168,75,.25)}
  .bottom-nav{border-top:1px solid rgba(212,168,75,.25)}
  .nav-item{transition:all .2s;position:relative}
  .nav-item.active::after{content:'';position:absolute;bottom:-6px;left:20%;right:20%;height:2px;background:var(--accent);border-radius:1px}
  .nav-item:hover{color:var(--accent2)}

  /* ===== 地图元素增强 ===== */
  .map-container{box-shadow:inset 0 0 60px rgba(0,0,0,.5),0 4px 20px rgba(0,0,0,.4)}
  .map-player{animation:pulse-glow 2s ease-in-out infinite}
  .map-npc:hover{transform:scale(1.15);z-index:12}

  /* ===== 进度条光泽 ===== */
  .progress-fill{position:relative;overflow:hidden}
  .progress-fill::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 1.8s infinite}
  @keyframes shimmer{0%{left:-40%}100%{left:140%}}

  /* ===== 新手引导 ===== */
  .tutorial-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
  .tutorial-overlay.active{display:flex}
  .tutorial-box{background:var(--bg2);border:2px solid var(--accent2);border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center;animation:fadeInScale .3s ease}
  .tutorial-step{font-size:2.4rem;margin-bottom:10px}
  .tutorial-title{font-size:1.1rem;font-weight:700;color:var(--accent2);margin-bottom:8px}
  .tutorial-text{font-size:.9rem;color:var(--muted);line-height:1.7;margin-bottom:16px}
  .tutorial-dots{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
  .tutorial-dot{width:8px;height:8px;border-radius:50%;background:var(--rule);transition:all .2s}
  .tutorial-dot.active{background:var(--accent2);transform:scale(1.2)}
  .tutorial-highlight{position:absolute;border:2px dashed var(--accent2);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);animation:pulse-border 1.5s infinite;pointer-events:none;z-index:401}
  @keyframes pulse-border{0%,100%{box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 8px rgba(212,168,75,.4)}50%{box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 18px rgba(212,168,75,.8)}}

  /* ===== 百科面板 ===== */
  .wiki-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
  .wiki-card{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:14px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
  .wiki-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .wiki-card .wiki-icon{font-size:2.2rem;margin-bottom:6px}
  .wiki-card .wiki-name{font-weight:700;font-size:.9rem;color:var(--accent2);margin-bottom:4px}
  .wiki-card .wiki-tag{font-size:.65rem;color:var(--muted);background:var(--bg3);padding:2px 6px;border-radius:4px;display:inline-block}
  .wiki-detail{padding:16px;background:var(--bg2);border-radius:12px;border:1px solid var(--rule);margin-top:10px}
  .wiki-detail h3{color:var(--accent2);margin-bottom:8px;font-size:1rem}
  .wiki-detail p{color:var(--muted);font-size:.85rem;line-height:1.8;margin-bottom:10px}
  .wiki-detail .wiki-step{display:flex;gap:10px;margin:8px 0;padding:10px;background:var(--bg3);border-radius:8px}
  .wiki-detail .wiki-step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}

  /* ===== 收藏馆 ===== */
  .gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
  .gallery-card{background:var(--bg2);border:1px solid var(--rule);border-radius:14px;overflow:hidden;transition:all .3s;cursor:pointer}
  .gallery-card:hover{border-color:var(--accent2);transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.4)}
  .gallery-card img{width:100%;height:120px;object-fit:cover;display:block}
  .gallery-card .gal-info{padding:10px}
  .gallery-card .gal-title{font-weight:700;font-size:.85rem;color:var(--accent2);margin-bottom:3px}
  .gallery-card .gal-meta{font-size:.7rem;color:var(--muted)}
  .gallery-empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .gallery-empty .big{font-size:3rem;margin-bottom:12px}

  /* ===== 装饰性敦煌纹理 ===== */
  .dh-border{border:1px solid var(--rule);border-image:linear-gradient(135deg,var(--accent2),var(--accent),var(--accent2)) 1}

  /* ===== 启动画面 ===== */
  #screen-loading{background:linear-gradient(180deg,var(--bg) 0%,#2D1F3A 100%);flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  #screen-loading.active{display:flex}
  .loading-logo{font-size:3.5rem;margin-bottom:16px;animation:float 2.5s ease-in-out infinite}
  .loading-title{font-size:1.6rem;color:var(--accent2);margin-bottom:8px;font-weight:700}
  .loading-sub{color:var(--muted);font-size:.85rem;margin-bottom:30px}
  .loading-bar{width:220px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .loading-bar-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;width:0%;transition:width .3s ease}
  .loading-text{color:var(--muted);font-size:.75rem}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .loading-spin{width:40px;height:40px;border:3px solid var(--rule);border-top-color:var(--accent2);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}

  /* ===== 成就系统 ===== */
  .achieve-badge{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--bg2);border:1px solid var(--accent2);border-radius:12px;padding:12px 18px;z-index:350;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .5s cubic-bezier(.175,.885,.32,1.275)}
  .achieve-badge.show{transform:translateX(-50%) translateY(0)}
  .achieve-badge .icon{font-size:1.8rem}
  .achieve-badge .info{text-align:left}
  .achieve-badge .name{font-weight:700;color:var(--accent2);font-size:.9rem}
  .achieve-badge .desc{font-size:.75rem;color:var(--muted)}
  .achieve-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
  .achieve-card{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:14px;transition:all .25s;position:relative;overflow:hidden}
  .achieve-card.unlocked{border-color:var(--accent2)}
  .achieve-card.locked{opacity:.55}
  .achieve-card .ach-icon{font-size:2rem;margin-bottom:6px}
  .achieve-card .ach-name{font-weight:700;font-size:.85rem;color:var(--accent2);margin-bottom:3px}
  .achieve-card .ach-desc{font-size:.7rem;color:var(--muted)}
  .achieve-card .ach-reward{font-size:.7rem;color:var(--accent);margin-top:4px}

  /* ===== 粒子特效层 ===== */
  #particle-canvas{position:fixed;inset:0;pointer-events:none;z-index:350}

  /* ===== 材料百科 ===== */
  .wiki-tabs{display:flex;gap:6px;margin:12px 0}
  .wiki-tab{flex:1;text-align:center;padding:8px;background:var(--bg2);border:1px solid var(--rule);border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .2s}
  .wiki-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>

<!-- ==================== 启动画面 ==================== -->
<div class="screen active" id="screen-loading">
  <div class="loading-spin"></div>
  <div class="loading-title">敦煌匠坊</div>
  <div class="loading-sub">千年技艺，一脉相承</div>
  <div class="loading-bar"><div class="loading-bar-inner" id="loadBar"></div></div>
  <div class="loading-text" id="loadText">正在加载资源...</div>
</div>

<!-- 成就弹出 -->

      {speaker:'老周头',text:'工地上来了个大工程——奉天后敕令，开凿弥勒大像窟。大佛高三十五尺，等造好了，几十里外都能看见。'},

      {speaker:'玩家',text:'是。这里在做什么？'},
      {speaker:'阴太初',text:'奉天后敕令，开凿弥勒大像窟。大佛高三十五尺，倚坐，双目俯视。'},
      {speaker:'玩家',text:'这么大的工程……'},
      {speaker:'阴太初',text:'怎么？怕了？'},
      {speaker:'玩家',text:'不怕。我想试试。'},
      {speaker:'阴太初',text:'好。那你从最基础的开始——和泥。'}
    ],
    post:[
      {speaker:'阴太初',text:'这手……有点意思。但掌心要再饱满些。天后的手，是有福气的。'},
      {speaker:'玩家',text:'这样呢？'},
      {speaker:'阴太初',text:'可以。继续。'},
      {speaker:'老周头',text:'你看，一尊大佛从一把泥开始。每一把泥里，都藏着一个人的认真。'}
    ]
  },
  cm2:{
    pre:[
      {speaker:'老周头',text:'出大事了！粮队被沙尘暴困在玉门关外三十里！工地上几百号人快没饭吃了！'},
      {speaker:'阴太初',text:'脸色铁青……'},
      {speaker:'玩家',text:'我去送粮！'},
      {speaker:'阴太初',text:'你一个雕塑师，去送粮？'},
      {speaker:'玩家',text:'工地上的人等着吃饭。总得有人去。'},
      {speaker:'阴太初',text:'……好。我派两个人跟你一起去。'},
      {speaker:'老周头',text:'风沙里送粮，这可不是画师该干的活儿。但有人饿肚子，总得有人去。'}
    ],
    post:[
      {speaker:'玩家',text:'满身沙土回到工地……粮……粮到了。'},
      {speaker:'阴太初',text:'看着你，第一次露出笑容……好样的。'},
      {speaker:'玩家',text:'这尊大佛……会在这里站一千年、两千年。'},
      {speaker:'阴太初',text:'天后求权力，我们求福泽。'},
      {speaker:'玩家',text:'这尊大佛……保佑的是谁呢？'},
      {speaker:'阴太初',text:'保佑每一个离家的人，平安回来。'},
      {speaker:'老周头',text:'你看，一尊大佛眼里没有天后，只有风沙里来来去去的旅人。这种认真，就是最宽广的许愿。'}
    ]
  },
  cs1:{
    pre:[
      {speaker:'老周头',text:'曹将军又来了。这次他要塑一尊全身巨像。'},
      {speaker:'曹将军',text:'头笑了，身子也得笑。整尊佛都得是笑的。'},
      {speaker:'玩家',text:'弥勒巨像……这得多少金箔？'},
      {speaker:'老周头',text:'他把全部积蓄都拿出来了。我说曹将军，您不留点给后人？他说："我就是留给后人的。我要让一千年后的人来看这尊佛，都知道——曾经有个人，认真地希望他们笑。"'},
      {speaker:'老周头',text:'这是最大的愿望，也是最小的愿望。'}
    ],
    post:[
      {speaker:'曹将军',text:'看着弥勒巨像，良久……笑了。'},
      {speaker:'老周头',text:'曹将军，您笑了。'},
      {speaker:'曹将军',text:'我第一次……觉得佛在对我笑。'},
      {speaker:'老周头',text:'不是佛对您笑，是您对自己笑了。您终于允许自己笑了。'},
      {speaker:'曹将军',text:'……谢谢你们。替我告诉后来的人。我不是为了当节度使才塑这尊佛的。我是为了……让这里的孩子，能笑。'},
      {speaker:'老周头',text:'你看，一个将军把所有积蓄变成一尊笑佛。他不需要后人记住他的名字，他只需要后人看见这尊佛的时候，能笑一下。这就是最认真的许愿，也是最深的幸福。'}
    ]
  },
  cs2:{
    pre:[
      {speaker:'老周头',text:'你来了这么久，面前有一面空白的墙。是时候画一幅属于你自己的壁画像了。'},
      {speaker:'玩家',text:'我自己的？'},
      {speaker:'老周头',text:'对。你帮那么多人实现了愿望，现在，你也该留下点什么。'}
    ],
    post:[
      {speaker:'系统提示',text:'你在敦煌度过了很长很长的时间。你见过都督夫人的排场，听过康老大的故事，为于阗公主调过家乡的颜色，陪张议潮将军回忆过出征的岁月，参与了弥勒大佛的建造，也见证了翟家人的守护。'},
      {speaker:'老周头',text:'我以前觉得，咱是手艺人，靠手艺吃饭。后来我发现，咱是许愿人的翻译。那些不会画画、不会塑像的人，心里有个愿望，说不出来，咱替他们画出来、捏出来。'},
      {speaker:'老周头',text:'张婶不懂飞天是什么，但她认真想让丈夫知道她想他。王氏不懂体面是什么，但她认真想让丈夫看见自己。三娘子不懂佛经，但她们认真想在菩萨面前站直。于阗公主不懂敦煌的颜色，但她认真想把家乡留下来。'},
      {speaker:'老周头',text:'康老大不懂什么叫艺术，但他认真想回家。张议潮不懂什么叫温柔，但他认真想守住记忆。曹小姐不懂什么叫天公主，但她认真想把故乡带去异乡。翟家人不懂什么叫权力，但他们认真想守住根。'},
      {speaker:'老周头',text:'阴太初不懂什么叫慈悲，但他认真想让离家的人平安。曹将军不懂什么叫放下，但他认真想让孩子笑。'},
      {speaker:'老周头',text:'你看，这些愿望有大有小，有深有浅。但每一个都是认真的。而只要有人认真为你许愿——不管是一幅画、一尊像、还是一个念头——那就是幸福。'},
      {speaker:'老周头',text:'所以啊，年轻人，好好干。这世上总有人在认真许愿，而咱，就是帮他们画出来的那个人。'}
    ]
  }
};

function particleBurst(){
  const canvas=document.getElementById('particle-canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const particles=[];
  const colors=['#C17817','#D4A84B','#F5EDE0','#FF9800','#FFD700'];
  for(let i=0;i<80;i++){
    particles.push({
      x:canvas.width/2,y:canvas.height/2,
      vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12-3,
      life:1,size:Math.random()*4+2,color:colors[Math.floor(Math.random()*colors.length)]
    });
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    particles.forEach(p=>{
      if(p.life<=0)return;
      alive=true;
      p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.015;
      ctx.globalAlpha=p.life;
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
    if(alive)requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

function showTaskList(type){

  const html=list.map(t=>{
    const can=Object.entries(t.mat).every(([n,c])=>(gs.inv[n]||0)>=c);
    const assistText=t.needAssist?`<span style="color:var(--accent)">需要${SKILL_NAMES[t.needAssist]}协助</span>`:'';
    const outputText=t.output?`产出: ${Object.entries(t.output).map(([n,c])=>`${n}x${c}`).join(' ')}`:'';
    return `<div class="task-card" onclick="startTask('${key}','${t.id}')">
      <div class="header"><div class="title">${type==='mural'?'&#x1F3A8;':'&#x1F3DB;'} ${t.title}</div><span class="diff" style="background:${t.diff==='easy'?'#4CAF50':t.diff==='medium'?'#FF9800':'#E74C3C'}">${t.diff==='easy'?'简单':t.diff==='medium'?'中等':'困难'}</span></div>
      <div class="desc">${t.desc}</div>
      <div class="meta">所需: ${Object.entries(t.mat).map(([n,c])=>`${n}x${c}`).join(' ')}</div>
      <div class="meta">${outputText}</div>
      <div class="meta">${assistText}</div>

  }).join('');
  modal(`${type==='mural'?'壁画':'雕塑'}任务`,html,'<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">关闭</button>');
}
function showDialog(lines,onComplete,btnText){
  let idx=0;
  btnText=btnText||'下一句';
  function showLine(){
    if(idx>=lines.length){closeModal();if(onComplete)onComplete();return}
    const line=lines[idx];
    const isLast=idx===lines.length-1;
    const finalBtn=isLast?(btnText==='下一句'?'开始制作':'收入行囊'):btnText;
    const speakerColor=line.speaker==='老周头'?'var(--accent2)':line.speaker==='玩家'?'var(--accent)':'var(--ink)';
    modal(line.speaker,`<div style="padding:16px;font-size:1rem;line-height:1.8;color:var(--ink)">${line.text}</div>`,`<button class="btn btn-primary" style="flex:1" onclick="window.__dlgNext()">${finalBtn}</button>`);
    window.__dlgNext=function(){idx++;showLine()};
  }
  showLine();
}
function startTask(key,tid){
  const t=TASKS[key].find(x=>x.id===tid);
  if(!t)return;
  const can=Object.entries(t.mat).every(([n,c])=>(gs.inv[n]||0)>=c);
  if(!can){toast('材料不足！');return}
  if(t.needAssist){
    const hasAssist=gs.party&&gs.party.members.some(m=>m.role===t.needAssist);
    const selfSkillOk=gs.skills[t.needAssist]&&gs.skills[t.needAssist].lv>=2;
    if(!hasAssist&&!selfSkillOk){modal('需要协助','<p>此任务需要 <strong>'+SKILL_NAMES[t.needAssist]+'</strong> 协助完成。</p><p>你可以：</p><ul style="text-align:left;margin:8px 0"><li>邀请一位'+SKILL_NAMES[t.needAssist]+'玩家组队</li><li>或将自己的'+SKILL_NAMES[t.needAssist]+'精进至 Lv2 以上</li></ul>','<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">知道了</button>');return}
  }
  const story=STORIES[tid];
  if(story&&story.pre&&story.pre.length>0){
    showDialog(story.pre,()=>{_doStartTask(t)});
    return;
  }
  _doStartTask(t);
}
function _doStartTask(t){
  Object.entries(t.mat).forEach(([n,c])=>gs.inv[n]-=c);
  closeModal();
  modal('制作中...',`<div style="text-align:center;padding:20px"><div style="font-size:3rem;margin-bottom:12px" id="craftIcon">&#x23F3;</div><div id="craftText">准备材料...</div><div class="progress"><div class="progress-fill" id="craftBar" style="width:0%"></div></div></div>`,'');
  let p=0;const steps=['准备材料...','起稿勾画...','精心制作...','润色完善...','即将完成...'];
  const iv=setInterval(()=>{p+=20;var bar=document.getElementById('craftBar');var txt=document.getElementById('craftText');if(bar)bar.style.width=p+'%';if(txt)txt.textContent=steps[Math.min(Math.floor(p/20),4)];if(p>=100){clearInterval(iv);setTimeout(()=>{finishTask(t)},400)}},400);
}
function finishTask(t){
  closeModal();
  var bonus=gs.party?1.3:1;
  var silverGain=Math.floor(t.reward.silver*bonus);
  var expGain=Math.floor(t.reward.exp*bonus);
  gs.silver+=silverGain;
  gs.exp+=expGain;
  gs.completed.push(t.id);
  if(t.reward.skillExp){gs.skills[t.skillType].exp+=t.reward.skillExp;checkSkillUp(t.skillType)}
  if(t.output){Object.entries(t.output).forEach(([n,c])=>{gs.inv[n]=(gs.inv[n]||0)+c})}
  checkLevelUp();
  updateStats();
  var partyText=gs.party?'（组队加成 +30%）':'';
  var outputText=t.output?' 获得: '+Object.entries(t.output).map(([n,c])=>n+'x'+c).join(' '):'';
  var skillText=t.reward.skillExp?' '+SKILL_NAMES[t.skillType]+'+'+t.reward.skillExp:'';
  toast('完成「'+t.title+'」！+'+silverGain+'银两 +' +expGain+'经验'+skillText+outputText+partyText);
  particleBurst();
  checkAchievementsAfterTask();
  saveGame();
  const story=STORIES[t.id];
  if(story&&story.post&&story.post.length>0){
    showDialog(story.post,()=>{drawArtwork(t)},'收入行囊');
  }else{
    drawArtwork(t);
  }
  renderMapTabs();
  checkEnding();
}
function checkEnding(){
  const mainTasks=['vm1','vm2','vs1','vs2','tm1','tm2','ts1','ts2','cm1','cm2','cs1','cs2'];
  const allDone=mainTasks.every(id=>gs.completed.includes(id));
  if(allDone&&!gs.endingShown){
    gs.endingShown=true;
    setTimeout(()=>{
      const ending=STORIES.ending;
      if(ending&&ending.post&&ending.post.length>0){
        showDialog(ending.post,null,'记住了');
      }
    },2000);
  }
}
function checkLevelUp(){
  const next=LEVELS.find(l=>l.lv===gs.lv+1);
  if(next&&gs.exp>=next.need){
    gs.lv++;gs.title=getLvTitle(gs.lv);
    toast('🎉 恭喜升级！当前等级: '+gs.lv+'级 '+gs.title);
    const newMap=MAPS.find(m=>m.minLevel===gs.lv);
    if(newMap){setTimeout(()=>toast('🎯 新地图解锁: '+newMap.name+'！'),1500)}
    if(gs.lv>=3)checkAchievement('explorer');
    saveGame();
  }
}
function checkSkillAchievements(){
  Object.values(gs.skills).forEach(s=>{if(s.lv>=3)checkAchievement('skillup');});
}

// ==================== 支线任务 ====================
function showSideQuests(){
  const html=SIDE_QUESTS.map((q,i)=>{
    const partyTag=q.needParty?'<span style="color:var(--accent);font-size:.7rem;margin-left:6px">[需组队]</span>':'';
    const skillTag=q.needSkill?'<span style="color:var(--accent2);font-size:.7rem;margin-left:6px">['+SKILL_NAMES[q.needSkill]+'成功率更高]</span>':'';
    return `<div class="task-card" onclick="doSideQuest(${i})"><div class="header"><div class="title">${q.title}</div></div><div class="desc">${q.desc}</div><div class="reward">可能获得: ${q.rewards.map(r=>`${r.n}(${r.p}%)`).join(' ')}${partyTag}${skillTag}</div></div>`;
  }).join('');
  modal('支线任务 - 材料收集',html,'<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">关闭</button>');
}
function doSideQuest(idx){
  const q=SIDE_QUESTS[idx];
  if(q.needParty&&!gs.party){modal('需要组队','<p>此任务路途凶险，必须组队才能接取。</p><p style="font-size:.85rem;color:var(--muted)">组建队伍后可获得稀有材料产出加成</p>','<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">知道了</button>');return}
  const got=[];
  q.rewards.forEach(r=>{
    let p=r.p;
    if(gs.party&&r.p<20)p=Math.min(35,p+10); // 组队提升超稀有材料概率
    if(q.needSkill&&gs.role===q.needSkill)p=Math.min(60,p+25); // 颜料师职业加成
    if(Math.random()*100<p){got.push(r.n);gs.inv[r.n]=(gs.inv[r.n]||0)+r.c}
  });
  closeModal();
  const bonusText=gs.party&&q.rewards.some(r=>r.p<20)?'（组队加成）':'';
  const skillText=q.needSkill&&gs.role===q.needSkill?'（技艺加成）':'';
  if(got.length)toast(`任务完成！获得: ${got.join('、')}${bonusText}${skillText}`);
  else toast('运气不佳，这次没有收获...');
}
function showGuild(){
  const next=LEVELS.find(l=>l.lv===gs.lv+1);
  modal('匠人公会',`<div class="exp-bar-container"><div class="exp-bar-label"><span>当前: ${gs.lv}级 ${gs.title}</span><span>${next?`还需${next.need-gs.exp}经验`:'已满级'}</span></div><div class="exp-bar"><div class="fill" style="width:${next?Math.min(100,(gs.exp/next.need)*100):100}%"></div></div></div><div style="margin-top:12px;font-size:.85rem;color:var(--muted)">${next?next.desc:'你已到达技艺巅峰！'}</div>`,'<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">关闭</button>');
}

function showTaskById(map,tid){

function renderMarket(){
  const el=document.getElementById('main-content');el.className='content-area';
  el.innerHTML=`<div class="section-title">&#x1F3EC; 万宝楼</div>
    <div class="market-tabs"><div class="market-tab2 active" onclick="filterMkt('all',this)">全部</div><div class="market-tab2" onclick="filterMkt('sell',this)">出售</div><div class="market-tab2" onclick="filterMkt('skill',this)">技能</div><div class="market-tab2" onclick="filterMkt('buy',this)">求购</div><div class="market-tab2" onclick="filterMkt('mine',this)">我的上架</div></div>
    <div id="mkt-list">${renderMktItems('all')}</div>

}
function renderMktItems(f){
  let items=[...botSales,...gs.playerSales.map((s,i)=>({...s,idx:i,isMine:true}))];
  if(f==='sell')items=items.filter(x=>!x.type||x.type==='sell');
  else if(f==='skill')items=items.filter(x=>x.type==='skill');
  else if(f==='buy')items=items.filter(x=>x.type==='buy');
  else if(f==='mine')items=items.filter(x=>x.isMine);
  if(!items.length)return'<div style="text-align:center;color:var(--muted);padding:30px">暂无物品</div>';
  return items.map(it=>{
    const icon=it.type==='skill'?'🎖️':(MAT_DATA[it.name.replace('求购:','')]?MAT_DATA[it.name.replace('求购:','')].icon:'&#x1F4E6;');
    let btn='';
    if(it.isMine)btn=`<button class="btn btn-danger" style="padding:6px 12px;font-size:.75rem" onclick="cancelSale(${it.idx})">下架</button>`;
    else if(it.type==='buy')btn=`<button class="btn btn-gold" style="padding:6px 12px;font-size:.75rem" onclick="sellToBuyer('${it.name.replace('求购:','')}',${it.price})">出售</button>`;
    else if(it.type==='skill')btn=`<button class="btn btn-primary" style="padding:6px 12px;font-size:.75rem" onclick="buySkill(${it.price},'${it.name}','${it.seller}',${it.skillLv})">委托</button>`;
    else btn=`<button class="btn btn-primary" style="padding:6px 12px;font-size:.75rem" onclick="buyItem('${it.name}',${it.price})">购买</button>`;
    return `<div class="m-item"><div class="icon">${icon}</div><div class="info"><div class="name">${it.name}${it.isMine?' <span style="color:var(--accent)">[我的]</span>':''}</div><div class="seller">${it.seller}${it.type==='skill'?' · Lv'+it.skillLv:''}</div><div class="price">${it.price} 银两</div></div><div>${btn}</div></div>`;
  }).join('');
}
function filterMkt(f,el){document.querySelectorAll('.market-tab2').forEach(t=>t.classList.remove('active'));el.classList.add('active');document.getElementById('mkt-list').innerHTML=renderMktItems(f)}
function buyItem(name,price){if(gs.silver<price){toast('银两不足！');return}gs.silver-=price;gs.inv[name]=(gs.inv[name]||0)+1;updateStats();toast('购买成功！获得 '+name);checkAchievement('merchant');saveGame();}
function sellToBuyer(name,price){if((gs.inv[name]||0)<1){toast('你没有 '+name);return}gs.inv[name]--;gs.silver+=price;updateStats();toast('出售成功！获得 '+price+' 银两');checkAchievement('merchant');saveGame();}

function buySkill(price,name,seller,lv){if(gs.silver<price){toast('银两不足！');return}gs.silver-=price;updateStats();toast('已委托 '+seller+' 的「'+name+'」服务！你的下一件作品品质将提升');checkAchievement('merchant');saveGame();}
function showSellItem(){

function confirmSell(){

function showSellSkill(){

function showItem(n){
  const m=MAT_DATA[n]||{};
  const rText={common:'普通',rare:'稀有',epic:'史诗',legend:'传说'}[m.r]||'';
  const rarityColor={common:'var(--muted)',rare:'#5DADE2',epic:'#9B59B6',legend:'#D4A84B'}[m.r]||'var(--muted)';
  modal(n,`<div style="text-align:center;padding:16px"><div style="font-size:3rem;margin-bottom:8px">${m.icon||'&#x1F4E6;'}</div><div style="font-weight:700;margin-bottom:4px">${n}</div><div style="color:${rarityColor};font-size:.8rem;margin-bottom:8px">${rText}</div><div style="color:var(--muted);font-size:.85rem;margin-bottom:8px">${m.desc||''}</div><div style="color:var(--accent2);font-size:.9rem">拥有数量: ${gs.inv[n]||0}</div></div>`,`<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">关闭</button><button class="btn btn-primary" style="flex:1" onclick="closeModal();gs.tab='market';document.querySelectorAll('.nav-item').forEach((x,i)=>x.classList.toggle('active',i===2));renderMarket()">去万宝楼</button>`);
}

// ==================== 百科 ====================
let wikiOpenId=null;
let wikiTab='skill';
function renderWiki(){
  const el=document.getElementById('main-content');el.className='content-area';
  if(wikiTab==='skill'){
    el.innerHTML=`<div class="section-title">&#x1F4D6; 百科图鉴</div>
      <div class="wiki-tabs"><div class="wiki-tab active" onclick="wikiTab='skill';renderWiki()">技艺百科</div><div class="wiki-tab" onclick="wikiTab='material';renderWiki()">材料图鉴</div></div>
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:8px">点击卡片了解敦煌壁画/雕塑背后的传统技艺</div>
      <div class="wiki-grid">${WIKI_DATA.map(w=>`<div class="wiki-card" onclick="toggleWiki('${w.id}')">
        <div class="wiki-icon">${w.icon}</div>
        <div class="wiki-name">${w.name}</div>
        <span class="wiki-tag">${w.tag}</span>
      </div>`).join('')}</div>
      <div id="wiki-detail"></div>`;
  }else{
    renderWikiMaterials(el);
  }
}
function toggleWiki(id){
  const detail=document.getElementById('wiki-detail');
  if(wikiOpenId===id){detail.innerHTML='';wikiOpenId=null;return}
  wikiOpenId=id;
  const w=WIKI_DATA.find(x=>x.id===id);
  if(!w)return;
  detail.innerHTML=`<div class="wiki-detail" style="animation:fadeInUp .3s ease">
    <h3>${w.icon} ${w.name}</h3>
    <p>${w.desc}</p>
    <div style="font-weight:700;font-size:.85rem;color:var(--accent2);margin-bottom:6px">制作流程：</div>
    ${w.steps.map((s,i)=>`<div class="wiki-step"><div class="wiki-step-num">${i+1}</div><div style="font-size:.85rem;color:var(--muted)">${s}</div></div>`).join('')}
  </div>`;
}
function renderWikiMaterials(el){
  const rarityOrder={legend:4,epic:3,rare:2,common:1};
  const items=Object.entries(MAT_DATA).filter(([n,m])=>m.r).sort((a,b)=>rarityOrder[b[1].r]-rarityOrder[a[1].r]);
  const rText={common:'普通',rare:'稀有',epic:'史诗',legend:'传说'};
  const rColor={common:'var(--muted)',rare:'#5DADE2',epic:'#9B59B6',legend:'#D4A84B'};
  el.innerHTML=`<div class="section-title">&#x1F4D6; 百科图鉴</div>
    <div class="wiki-tabs"><div class="wiki-tab" onclick="wikiTab='skill';renderWiki()">技艺百科</div><div class="wiki-tab active" onclick="wikiTab='material';renderWiki()">材料图鉴</div></div>
    <div style="font-size:.8rem;color:var(--muted);margin-bottom:8px">已收录 ${items.length} 种材料，按稀有度排序</div>
    <div class="wiki-grid">${items.map(([n,m])=>`<div class="wiki-card" onclick="showItem('${n}')">
      <div class="wiki-icon">${m.icon}</div>
      <div class="wiki-name">${n}</div>
      <span class="wiki-tag" style="color:${rColor[m.r]||'var(--muted)'}">${rText[m.r]||''}</span>
    </div>`).join('')}</div>`;
}

// ==================== 收藏馆 ====================
function renderGallery(){
  const el=document.getElementById('main-content');el.className='content-area';
  if(!gs.completed.length){
    el.innerHTML=`<div class="section-title">&#x1F3A8; 作品收藏馆</div>
      <div class="gallery-empty"><div class="big">&#x1F3DB;</div><p>暂无收藏作品</p><p style="font-size:.8rem;margin-top:6px">完成主线任务后，你的杰作将陈列于此</p></div>`;
    return;
  }
  const cards=gs.completed.map(tid=>{
    let t=null;
    Object.values(TASKS).forEach(list=>{const found=list.find(x=>x.id===tid);if(found)t=found});
    if(!t)return'';
    const type=t.skillType==='sculptor'?'sculpt':'mural';
    const imgPath=`assets/art_${type}_${t.diff}_restored.jpg`;
    const mapName=MAPS.find(m=>m.id===Object.keys(TASKS).find(k=>TASKS[k].includes(t))?.split('_')[0])?.name||'';
    return `<div class="gallery-card" onclick="viewGalleryItem('${tid}')">
      <img src="${imgPath}" alt="${t.title}" onerror="this.style.display='none'">
      <div class="gal-info"><div class="gal-title">《${t.title}》</div><div class="gal-meta">${mapName} · ${t.diff==='easy'?'简单':t.diff==='medium'?'中等':'困难'}</div></div>
    </div>`;
  }).join('');
  el.innerHTML=`<div class="section-title">&#x1F3A8; 作品收藏馆 <span style="font-size:.75rem;color:var(--muted);font-weight:400">(${gs.completed.length}件)</span></div>
    <div class="gallery-grid">${cards}</div>`;
}
function viewGalleryItem(tid){
  let t=null;
  Object.values(TASKS).forEach(list=>{const found=list.find(x=>x.id===tid);if(found)t=found});
  if(!t)return;
  const type=t.skillType==='sculptor'?'sculpt':'mural';
  const imgPath=`assets/art_${type}_${t.diff}_restored.jpg`;
  const story=STORIES[tid];
  const storyPreview=story&&story.post&&story.post.length?story.post[story.post.length-1].text.substring(0,60)+'...':'';
  modal(`《${t.title}》`,`<div style="text-align:center"><img src="${imgPath}" style="max-width:100%;border-radius:10px;margin-bottom:10px" onerror="this.style.display='none'"><div style="font-size:.85rem;color:var(--muted);margin-bottom:8px">${t.desc}</div>${storyPreview?`<div style="font-size:.8rem;color:var(--accent2);border-left:3px solid var(--accent);padding-left:10px;text-align:left;line-height:1.6">${storyPreview}</div>`:''}</div>`,`<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">关闭</button>`);
}

// ==================== 新手引导 ====================
let tutStep=0;
const TUTORIAL_STEPS=[
  {icon:'&#x1F5FA;',title:'探索敦煌',text:'点击地图任意位置移动角色，靠近建筑即可交互接取任务。'},
  {icon:'&#x1F4CB;',title:'接取任务',text:'在「任务」页可查看所有主线任务，点击即可查看所需材料。'},
  {icon:'&#x2697;',title:'收集材料',text:'前往「颜料铺」等地接取支线任务，或去「万宝楼」购买所需材料。'},
  {icon:'&#x1F3A8;',title:'制作作品',text:'材料齐整后进入工坊，观看剧情对话，完成任务获得作品与奖励。'},
  {icon:'&#x1F4D6;',title:'学习技艺',text:'「百科」中收录了水飞法、沥粉堆金等非遗技艺知识，随时可查阅学习。'},
  {icon:'&#x1F465;',title:'组队协作',text:'部分高级任务需要其他职业协助，创建队伍可邀请AI队友，还能获得30%奖励加成！'}
];
function startTutorial(){tutStep=0;updateTutorial();document.getElementById('tutorialOverlay').classList.add('active');}
function nextTutorial(){tutStep++;if(tutStep>=TUTORIAL_STEPS.length){skipTutorial();return}updateTutorial();}
function skipTutorial(){document.getElementById('tutorialOverlay').classList.remove('active');tutStep=0;}
function updateTutorial(){
  const s=TUTORIAL_STEPS[tutStep];
  document.getElementById('tutIcon').innerHTML=s.icon;
  document.getElementById('tutTitle').textContent=s.title;
  document.getElementById('tutText').textContent=s.text;
  document.getElementById('tutDots').innerHTML=TUTORIAL_STEPS.map((_,i)=>`<div class="tutorial-dot ${i===tutStep?'active':''}"></div>`).join('');
}

// ==================== 启动画面逻辑 ====================
function runLoading(){
  const bar=document.getElementById('loadBar');
  const txt=document.getElementById('loadText');
  const steps=[{p:20,t:'加载壁画素材...'},{p:45,t:'研磨矿物颜料...'},{p:70,t:'修复洞窟场景...'},{p:90,t:'准备匠人工具...'},{p:100,t:'就绪'}];
  let i=0;
  function next(){
    if(i>=steps.length){
      const hasSave=loadGame();
      const loadingScreen=document.getElementById('screen-loading');
      const roleScreen=document.getElementById('screen-role');
      if(hasSave){
        txt.textContent='检测到存档，欢迎回来，'+gs.name+'！';
        loadingScreen.innerHTML=`<div style="animation:fadeIn .5s"><div class="loading-logo">&#x1F3DB;</div><div class="loading-title">欢迎回来</div><div style="color:var(--muted);font-size:.9rem;margin-bottom:20px">${gs.name} · ${gs.title} · Lv${gs.lv}</div><div style="display:flex;gap:10px;flex-direction:column;width:220px"><button class="btn btn-primary" onclick="enterFromSave()">继续旅程</button><button class="btn btn-secondary" onclick="startNewGame()">新的开始</button></div></div>`;
      }else{
        loadingScreen.classList.remove('active');
        roleScreen.classList.add('active');
      }
      return;
    }
    bar.style.width=steps[i].p+'%';
    txt.textContent=steps[i].t;
    i++;
    setTimeout(next,400+Math.random()*300);
  }
  next();
}
function enterFromSave(){
  document.getElementById('screen-loading').classList.remove('active');
  document.getElementById('screen-game').classList.add('active');
  renderMapTabs();updateStats();renderMap();
  toast('欢迎回来，'+gs.name+'！');
}
function startNewGame(){
  localStorage.removeItem('dunhuang_save');
  gs={
    role:null,name:'',silver:100,exp:0,lv:1,title:'学徒',
    map:'village',x:50,y:50,
    inv:{'狼毫笔':2,'羊毫笔':1,'木刀':2,'赭石':3,'蛤粉':2,'敦煌土':5,'麦草':3,'麻刀':2,'朱砂':2,'石青':1},
    completed:[],playerSales:[],tab:'map',
    skills:{painter:{lv:1,exp:0},sculptor:{lv:1,exp:0},pigment:{lv:1,exp:0}},
    party:null,endingShown:false,achievements:[],tutorialDone:false
  };
  document.getElementById('screen-loading').classList.remove('active');
  document.getElementById('screen-role').classList.add('active');
}

// 初始化
runLoading();
// 按钮鼠标跟随光泽
document.addEventListener('mousemove',e=>{
  if(e.target.classList&&e.target.classList.contains('btn')){
    const rect=e.target.getBoundingClientRect();
    e.target.style.setProperty('--mx',((e.clientX-rect.left)/rect.width)*100+'%');
    e.target.style.setProperty('--my',((e.clientY-rect.top)/rect.height)*100+'%');
  }
});
</script>
