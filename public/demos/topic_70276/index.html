<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI产品分析助手 - 拍照上传一键生成运营内容</title>
<style>
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-dark: #4f46e5;
  --secondary: #ec4899;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1e293b;
  --text2: #64748b;
  --text3: #94a3b8;
  --border: #e2e8f0;
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
  --radius: 16px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --transition: 0.25s ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  padding: 24px 20px;
  text-align: center;
  color: #fff;
}
.header h1 { font-size: 22px; font-weight: 700; }
.header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
.container { max-width: 680px; margin: 0 auto; padding: 16px; }

/* 步骤条 */
.steps { display: flex; gap: 8px; margin-bottom: 16px; }
.step { flex:1; text-align:center; padding:10px 8px; border-radius:10px; background:var(--card); font-size:12px; color:var(--text3); transition:var(--transition); box-shadow:var(--shadow); }
.step.active { background:var(--primary); color:#fff; }
.step.done { background:#eef2ff; color:var(--primary); }

/* 上传区域 */
.upload-zone {
  background: var(--card); border-radius: var(--radius); padding: 40px 20px;
  text-align: center; border: 3px dashed var(--border); cursor: pointer;
  transition: var(--transition); margin-bottom: 16px; box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); background: #f8faff; }
.upload-zone.has-image { border-style: solid; padding: 12px; }
.upload-icon { font-size: 48px; margin-bottom: 12px; }
.upload-text { font-size: 15px; color: var(--text2); }
.upload-hint { font-size: 12px; color: var(--text3); margin-top: 6px; }
.upload-zone img.preview { max-width: 100%; max-height: 320px; border-radius: 8px; object-fit: contain; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 28px; border-radius: 50px; font-size: 16px; font-weight: 600;
  border: none; cursor: pointer; transition: var(--transition); width: 100%;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff; box-shadow: 0 4px 16px rgba(99,102,241,0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-outline {
  background: #fff; color: var(--primary); border: 2px solid var(--primary);
}
.btn-outline:hover { background: #f8faff; }
.btn-sm { padding: 8px 16px; font-size: 13px; width: auto; border-radius: 8px; }

/* 卡片 */
.card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  margin-bottom: 12px; box-shadow: var(--shadow);
}
.card-title {
  font-size: 16px; font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.card-title::before { content:''; width:4px; height:20px; background:var(--primary); border-radius:2px; display:inline-block; }

/* 分析结果 */
.analysis-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.analysis-item {
  background: var(--bg); border-radius: 10px; padding: 12px;
}
.analysis-label { font-size: 12px; color: var(--text3); }
.analysis-value { font-size: 14px; font-weight: 500; margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag {
  display: inline-block; padding: 4px 10px; border-radius: 20px;
  font-size: 12px; background: #eef2ff; color: var(--primary);
}

/* 内容标签页 */
.tabs {
  display: flex; gap: 4px; margin-bottom: 12px;
  background: var(--bg); border-radius: 10px; padding: 4px;
  overflow-x: auto;
}
.tab {
  flex: 1; padding: 10px 6px; text-align: center; border-radius: 8px;
  font-size: 13px; cursor: pointer; white-space: nowrap; min-width: fit-content;
  color: var(--text3); transition: var(--transition);
}
.tab.active { background: var(--primary); color: #fff; }
.content-box {
  background: var(--bg); border-radius: 10px; padding: 16px;
  margin-bottom: 12px; white-space: pre-wrap; font-size: 14px;
  max-height: 300px; overflow-y: auto; color: var(--text2); line-height: 1.8;
}
.copy-bar {
  display: flex; justify-content: flex-end; margin-bottom: 16px;
}

/* Loading */
.spinner {
  width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.3);
  border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { text-align: center; padding: 40px 0; color: var(--text3); }
.loading-text .spinner { margin: 0 auto 12px; border-color: rgba(99,102,241,0.2); border-top-color: var(--primary); }

/* API设置 */
.api-section { margin-bottom: 16px; }
.api-toggle { font-size: 13px; color: var(--primary); cursor: pointer; text-align: center; padding: 8px; }
.api-form { display: none; }
.api-form.show { display: block; }
.api-form input, .api-form select {
  width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--border);
  font-size: 14px; margin-bottom: 8px; background: var(--bg); outline: none;
}
.api-form input:focus, .api-form select:focus { border-color: var(--primary); }
.api-form label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 4px; }

/* 提示 */
.tip {
  background: #fffbeb; border-radius: 10px; padding: 12px 16px;
  font-size: 13px; color: #92400e; margin-bottom: 12px;
}
.tip::before { content:'💡 '; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 12px 24px; border-radius: 50px;
  font-size: 14px; z-index: 999; animation: toastIn 0.3s ease;
  pointer-events: none;
}
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-10px); } }

/* 历史记录 */
.history-item {
  display: flex; gap: 12px; padding: 12px; border-radius: 10px;
  background: var(--bg); margin-bottom: 8px; cursor: pointer;
  transition: var(--transition); align-items: center;
}
.history-item:hover { background: #eef2ff; }
.history-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.history-info { flex: 1; min-width: 0; }
.history-name { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
.history-delete { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--error); color: var(--error); background: #fff; font-size: 12px; cursor: pointer; flex-shrink: 0; }
.history-delete:hover { background: #fef2f2; }
.history-empty { text-align: center; padding: 20px; color: var(--text3); font-size: 14px; }

/* 响应式 */
@media (max-width: 480px) {
  .container { padding: 12px; }
  .header { padding: 20px 16px; }
  .header h1 { font-size: 20px; }
  .upload-zone { padding: 30px 16px; }
  .analysis-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1>📸 AI产品分析助手</h1>
  <p>拍照上传 → AI智能分析 → 一键生成全套运营内容</p>
</div>

<div class="container">
  <!-- API配置 -->
  <div class="api-section">
    <div class="api-toggle" onclick="toggleApiConfig()">⚙️ AI模型设置（点击配置）</div>
    <div class="api-form card" id="apiForm">
      <label>API地址</label>
      <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions" value="">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." value="">
      <label>模型名称</label>
      <select id="modelName">
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-4o-mini">gpt-4o-mini</option>
        <option value="gpt-4-turbo">gpt-4-turbo</option>
        <option value="deepseek-chat">deepseek-chat</option>
        <option value="qwen-plus">通义千问 qwen-plus</option>
        <option value="glm-4">智谱 GLM-4</option>
        <option value="moonshot-v1-8k">Moonshot</option>
      </select>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="saveApiConfig()">保存配置</button>
      <p style="font-size:12px;color:var(--text3);margin-top:8px;">支持 OpenAI / DeepSeek / 通义千问 等兼容接口</p>
    </div>
  </div>

  <!-- 步骤条 -->
  <div class="steps" id="stepBar">
    <div class="step active" id="step1">1. 上传图片</div>
    <div class="step" id="step2">2. AI分析</div>
    <div class="step" id="step3">3. 生成内容</div>
  </div>

  <!-- 上传区域 -->
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon" id="uploadIcon">📷</div>
    <div class="upload-text" id="uploadText">点击上传或拖拽产品图片</div>
    <div class="upload-hint" id="uploadHint">支持 JPG/PNG/WebP，建议清晰产品图</div>
  </div>
  <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">

  <!-- 产品名称输入（无API时手动输入） -->
  <div class="card" id="manualInput" style="margin-bottom:12px;">
    <label style="font-size:13px;color:var(--text2);display:block;margin-bottom:6px;">📝 产品名称 <span style="color:var(--text3);">（必填，AI无法识图时使用）</span></label>
    <input type="text" id="productNameInput" placeholder="例如：激烈哥火鸡面酱、丘比沙拉酱香甜口味..." style="width:100%;padding:12px;border-radius:10px;border:2px solid var(--border);font-size:14px;background:var(--bg);outline:none;" oninput="updateAnalyzeBtn()" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
      <input type="text" id="categoryInput" placeholder="产品类目（选填）" style="padding:10px;border-radius:8px;border:2px solid var(--border);font-size:13px;background:var(--bg);outline:none;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
      <input type="text" id="featureInput" placeholder="核心卖点，逗号分隔（选填）" style="padding:10px;border-radius:8px;border:2px solid var(--border);font-size:13px;background:var(--bg);outline:none;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
    </div>
  </div>

  <!-- 分析按钮 -->
  <div style="margin-bottom:12px;">
    <button class="btn btn-primary" id="analyzeBtn" onclick="startAnalysis()" disabled>
      <span id="analyzeBtnText">🔍 开始智能分析</span>
    </button>
  </div>

  <div class="tip" style="margin-bottom:12px;" id="tipMsg">
    上传图片并输入产品名称，点击"开始分析"即可生成全套运营内容。配置AI模型后可自动识图。
  </div>

  <!-- 分析结果区 -->
  <div id="resultArea" style="display:none;">
    <!-- 产品信息 -->
    <div class="card" id="productInfo" style="display:none;">
      <div class="card-title">产品分析结果</div>
      <div class="analysis-grid" id="analysisGrid"></div>
      <div class="tags" id="featureTags" style="margin-top:12px;"></div>
    </div>

    <!-- 内容标签页 -->
    <div id="contentTabs" style="display:none;">
      <div class="tabs" id="tabBar">
        <div class="tab active" onclick="switchTab('taobao')">🛒 淘宝标题</div>
        <div class="tab" onclick="switchTab('pdd')">💰 拼多多标题</div>
        <div class="tab" onclick="switchTab('douyin')">🎵 抖音标题</div>
        <div class="tab" onclick="switchTab('xiaohongshu')">📕 小红书标题</div>
        <div class="tab" onclick="switchTab('desc')">📄 详情文案</div>
        <div class="tab" onclick="switchTab('short')">✍️ 短文案</div>
        <div class="tab" onclick="switchTab('live')">🎤 直播脚本</div>
        <div class="tab" onclick="switchTab('prompt')">🎨 图片提示词</div>
      </div>
      <div class="content-box" id="contentBox"></div>
      <div class="copy-bar">
        <button class="btn btn-outline btn-sm" onclick="copyContent()">📋 一键复制</button>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loadingArea" class="loading-text" style="display:none;">
    <div class="spinner"></div>
    <div id="loadingMsg">AI正在分析产品图片...</div>
  </div>

  <!-- 历史记录 -->
  <div class="card" id="historyPanel" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <span style="font-size:16px;font-weight:600;">📋 历史记录</span>
      <button class="btn-outline btn-sm" onclick="clearAllHistory()" style="color:var(--error);border-color:var(--error);">清空</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<script>
// ==================== 状态管理 ====================
let uploadedImage = null;
let analysisResult = null;
let generatedContent = {};
let currentTab = 'taobao';
let isAnalyzing = false;

// ==================== API配置 ====================
function getApiConfig() {
  return {
    url: localStorage.getItem('ai_api_url') || '',
    key: localStorage.getItem('ai_api_key') || '',
    model: localStorage.getItem('ai_model') || 'gpt-4o'
  };
}

function toggleApiConfig() {
  document.getElementById('apiForm').classList.toggle('show');
  const config = getApiConfig();
  document.getElementById('apiUrl').value = config.url;
  document.getElementById('apiKey').value = config.key;
  document.getElementById('modelName').value = config.model;
}

function saveApiConfig() {
  localStorage.setItem('ai_api_url', document.getElementById('apiUrl').value.trim());
  localStorage.setItem('ai_api_key', document.getElementById('apiKey').value.trim());
  localStorage.setItem('ai_model', document.getElementById('modelName').value);
  document.getElementById('apiForm').classList.remove('show');
  updateTip();
  updateAnalyzeBtn();
  showToast('API配置已保存 ✅');
}

// ==================== 图片上传 ====================
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadZone.classList.add('drag-over');
});

uploadZone.addEventListener('dragleave', () => {
  uploadZone.classList.remove('drag-over');
});

uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    processFile(file);
  }
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) processFile(file);
});

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (file) processFile(file);
}

function processFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    compressImage(e.target.result, 1024, 0.8).then(compressed => {
      uploadedImage = compressed;
      uploadZone.classList.add('has-image');
      uploadZone.innerHTML = `<img src="${uploadedImage}" class="preview" alt="产品图片" id="previewImg">`;
      document.getElementById('previewImg').addEventListener('click', (ev) => {
        ev.stopPropagation();
        document.getElementById('fileInput').click();
      });
      updateAnalyzeBtn();
      updateStep(1);
    });
  };
  reader.readAsDataURL(file);
}

function updateAnalyzeBtn() {
  const hasImage = !!uploadedImage;
  const hasName = document.getElementById('productNameInput').value.trim() !== '';
  const config = getApiConfig();
  const hasApi = config.url && config.key;
  
  // 有API：需要图片；无API：需要图片+名称
  const enabled = hasApi ? hasImage : (hasImage && hasName);
  document.getElementById('analyzeBtn').disabled = !enabled;
  document.getElementById('analyzeBtnText').textContent = enabled ? '🔍 开始智能分析' : (hasImage ? '👆 请填写产品名称' : '👆 请上传产品图片');
}

// 图片压缩
function compressImage(dataUrl, maxWidth, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

// ==================== AI分析 ====================
async function callAI(messages) {
  const config = getApiConfig();
  
  if (!config.url || !config.key) {
    // 没有配置API，使用模拟数据
    return null;
  }

  try {
    const response = await fetch(config.url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.key}`
      },
      body: JSON.stringify({
        model: config.model,
        messages: messages,
        temperature: 0.7,
        max_tokens: 4000
      })
    });

    if (!response.ok) {
      const err = await response.text();
      console.error('API Error:', err);
      throw new Error(`API请求失败: ${response.status}`);
    }

    const data = await response.json();
    return data.choices[0].message.content;
  } catch (error) {
    console.error('API调用失败:', error);
    throw error;
  }
}

function getMockAnalysis() {
  const name = document.getElementById('productNameInput').value.trim() || '未命名产品';
  const category = document.getElementById('categoryInput').value.trim() || '食品/调味品';
  const featureStr = document.getElementById('featureInput').value.trim();
  const features = featureStr ? featureStr.split(/[,，]/).map(s => s.trim()).filter(Boolean) : ['品质优良', '包装精美', '使用便捷', '味道出众'];
  const sellingPoints = featureStr ? featureStr.split(/[,，]/).map(s => '💎 ' + s.trim()).filter(Boolean) : ['高性价比', '品质保证', '值得信赖', '复购率高'];
  return {
    productName: name,
    category: category,
    color: '参考产品图片',
    material: '参考产品包装说明',
    features: features,
    sellingPoints: sellingPoints
  };
}

function getMockContent(productName) {
  const category = document.getElementById('categoryInput').value.trim() || '调味品';
  return {
    taobao: `${productName} 正宗品质 家用商用 大包装实惠 厨房必备调味佳品`,
    pdd: `【爆款热卖】${productName} 超值大包装 厨房必备 限时特惠抢购中`,
    douyin: `家人们必囤的${productName}来了！这个品质真的绝了，做菜必备！`,
    xiaohongshu: `✨发现宝藏 | ${productName}，这个味道太上头了！厨房小白也能变大厨`,
    desc: `【产品介绍】\n\n${productName}，精选优质原料，经过严格工艺制作而成，是厨房烹饪的理想选择。\n\n【产品特点】\n✅ 品质优良：严选原料，确保每一份都经得起考验\n✅ 使用便捷：开袋即用，烹饪更省心\n✅ 大包装设计：经济实惠，适合家庭和商用\n✅ 口感出众：独特配方，让每道菜都更美味\n\n【适用场景】\n日常家庭烹饪、餐厅商用、烧烤调味、凉拌菜等\n\n【规格参数】\n分类：${category}\n请参考产品包装说明\n\n【储存方法】\n阴凉干燥处保存，开封后请密封冷藏`,
    short: `爆款推荐！${productName}，品质优良，使用便捷，厨房必备神器！限时特惠，赶紧入手吧～`,
    live: `主播：家人们，今天给大家带来一款厨房必备神器——${productName}！\n\n主播：这款产品真的是我用过最好用的了，品质特别棒！看这个包装，大容量，特别实惠。\n\n主播：做菜的时候来一点，味道直接提升一个档次！不管是炒菜、炖汤还是烧烤，都离不开它。\n\n主播：今天直播间价格特别给力，外面买不到这个价！喜欢的家人们赶紧下单，库存有限！\n\n主播：买了绝对不会后悔，回购率特别高！抓紧时间，手慢无！`,
    prompt: `professional product photography, ${productName} food condiment, high quality commercial shot, clean studio lighting, appetizing presentation, gourmet style, 8k resolution, detailed texture, soft shadows, white background`
  };
}

async function startAnalysis() {
  if (!uploadedImage || isAnalyzing) return;
  
  // 重置状态，避免旧内容残留
  analysisResult = null;
  generatedContent = {};
  currentTab = 'taobao';
  isAnalyzing = true;
  
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  document.getElementById('analyzeBtnText').innerHTML = '<span class="spinner"></span> 分析中...';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('loadingArea').style.display = 'block';
  updateStep(2);

  const config = getApiConfig();
  const hasApi = config.url && config.key;

  try {
    if (hasApi) {
      // 使用AI分析
      document.getElementById('loadingMsg').textContent = 'AI正在分析产品图片...';
      
      const analysisPrompt = `你是一个专业的电商产品分析专家。请根据以下产品图片，分析产品特征并输出JSON格式：

{
  "productName": "产品名称",
  "category": "产品类目",
  "color": "主要颜色/色系",
  "material": "主要材质/成分",
  "features": ["特点1", "特点2", "特点3", "特点4"],
  "sellingPoints": ["卖点1", "卖点2", "卖点3", "卖点4", "卖点5"]
}

注意：features和sellingPoints各输出4-5条，语言精炼有力。直接输出JSON，不要其他内容。`;

      const analysisText = await callAI([
        {
          role: 'user',
          content: [
            { type: 'text', text: analysisPrompt },
            { type: 'image_url', image_url: { url: uploadedImage, detail: 'high' } }
          ]
        }
      ]);

      try {
        // 尝试提取JSON
        const jsonMatch = analysisText.match(/\{[\s\S]*\}/);
        analysisResult = JSON.parse(jsonMatch ? jsonMatch[0] : analysisText);
      } catch {
        analysisResult = getMockAnalysis();
      }

      // 生成内容
      document.getElementById('loadingMsg').textContent = 'AI正在生成运营内容...';
      updateStep(3);
      
      const contentPrompt = `你是顶级电商运营专家。基于以下产品信息，生成全套运营内容。输出严格JSON格式：

{
  "taobao": "淘宝标题（60字符内，SEO关键词堆叠风格）",
  "pdd": "拼多多标题（促销感，可用【】）",
  "douyin": "抖音标题（55字符内，前10字抓眼球）",
  "xiaohongshu": "小红书标题（种草感+情绪词）",
  "desc": "详情页文案（含产品介绍、特点、使用场景、规格、储存，用✅emoji）",
  "short": "短文案（适合社媒推广，150字内）",
  "live": "直播脚本（15分钟节奏：开场留人→痛点→展示→算账→促单）",
  "prompt": "AI生图提示词（英文，专业产品摄影风格，8k quality）"
}

产品名称：${analysisResult.productName}
类目：${analysisResult.category}
特点：${analysisResult.features.join('、')}
卖点：${analysisResult.sellingPoints.join('、')}

直接输出JSON，不要其他内容。`;

      document.getElementById('loadingMsg').textContent = 'AI正在生成运营内容...';
      updateStep(3);

      const contentText = await callAI([
        { role: 'user', content: contentPrompt }
      ]);

      try {
        const contentMatch = contentText.match(/\{[\s\S]*\}/);
        generatedContent = JSON.parse(contentMatch ? contentMatch[0] : contentText);
      } catch {
        generatedContent = getMockContent(analysisResult.productName);
      }

    } else {
      // 使用模拟数据
      await new Promise(r => setTimeout(r, 2000));
      analysisResult = getMockAnalysis();
      
      document.getElementById('loadingMsg').textContent = '正在生成运营内容...';
      updateStep(3);
      await new Promise(r => setTimeout(r, 1500));
      generatedContent = getMockContent(analysisResult.productName);
    }

    // 显示结果
    showResults();
    saveToHistory();
    
  } catch (error) {
    console.error('分析失败:', error);
    // API失败时使用模拟数据
    if (!analysisResult) analysisResult = getMockAnalysis();
    if (Object.keys(generatedContent).length === 0) {
      generatedContent = getMockContent(analysisResult.productName);
    }
    showResults();
    if (hasApi) {
      showToast('AI调用失败，已使用模拟数据展示');
    }
  } finally {
    isAnalyzing = false;
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('analyzeBtnText').textContent = '🔄 重新分析';
    document.getElementById('loadingArea').style.display = 'none';
    updateStep(3, 'done');
  }
}

function showResults() {
  document.getElementById('resultArea').style.display = 'block';
  
  // 产品信息
  document.getElementById('productInfo').style.display = 'block';
  const grid = document.getElementById('analysisGrid');
  grid.innerHTML = `
    <div class="analysis-item">
      <div class="analysis-label">产品名称</div>
      <div class="analysis-value">${analysisResult.productName}</div>
    </div>
    <div class="analysis-item">
      <div class="analysis-label">类目</div>
      <div class="analysis-value">${analysisResult.category}</div>
    </div>
    <div class="analysis-item">
      <div class="analysis-label">颜色</div>
      <div class="analysis-value">${analysisResult.color}</div>
    </div>
    <div class="analysis-item">
      <div class="analysis-label">材质/成分</div>
      <div class="analysis-value">${analysisResult.material}</div>
    </div>
  `;
  
  const featureTags = document.getElementById('featureTags');
  featureTags.innerHTML = (analysisResult.features || []).map(f => `<span class="tag">${f}</span>`).join('') +
    (analysisResult.sellingPoints || []).map(s => `<span class="tag" style="background:#fef3c7;color:#92400e;">💎 ${s}</span>`).join('');
  
  // 内容标签页
  document.getElementById('contentTabs').style.display = 'block';
  switchTab('taobao');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabMap = { taobao:0, pdd:1, douyin:2, xiaohongshu:3, desc:4, short:5, live:6, prompt:7 };
  document.querySelectorAll('.tab')[tabMap[tab]].classList.add('active');
  
  const contentBox = document.getElementById('contentBox');
  contentBox.textContent = generatedContent[tab] || '内容生成中...';
}

function copyContent() {
  const content = document.getElementById('contentBox').textContent;
  // file:// 协议下 clipboard API 不可用，回退到 textarea + execCommand
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(content).then(() => {
      showToast('已复制到剪贴板 ✅');
    }).catch(() => fallbackCopy(content));
  } else {
    fallbackCopy(content);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制到剪贴板 ✅');
  } catch {
    showToast('复制失败，请手动选择复制');
  }
  document.body.removeChild(ta);
}

function updateStep(num, status) {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('step' + i);
    el.classList.remove('active', 'done');
    if (i < num) el.classList.add('done');
    else if (i === num) el.classList.add(status === 'done' ? 'done' : 'active');
  }
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

function saveToHistory() {
  const history = JSON.parse(localStorage.getItem('ai_product_history') || '[]');
  history.unshift({
    id: Date.now(),
    productName: analysisResult.productName,
    category: analysisResult.category,
    imageUrl: uploadedImage,
    content: generatedContent,
    analysis: analysisResult,
    timestamp: new Date().toISOString()
  });
  if (history.length > 20) history.pop();
  localStorage.setItem('ai_product_history', JSON.stringify(history));
  loadHistory();
}

function loadHistory() {
  const history = JSON.parse(localStorage.getItem('ai_product_history') || '[]');
  const panel = document.getElementById('historyPanel');
  const list = document.getElementById('historyList');
  
  if (history.length === 0) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  list.innerHTML = history.map((item, idx) => `
    <div class="history-item" onclick="restoreHistory(${idx})">
      <img src="${item.imageUrl}" alt="${item.productName}">
      <div class="history-info">
        <div class="history-name">${item.productName}</div>
        <div class="history-meta">${item.category} · ${new Date(item.timestamp).toLocaleDateString()}</div>
      </div>
      <button class="history-delete" onclick="event.stopPropagation();deleteHistoryItem(${idx})">删除</button>
    </div>
  `).join('');
}

function restoreHistory(idx) {
  const history = JSON.parse(localStorage.getItem('ai_product_history') || '[]');
  const item = history[idx];
  if (!item) return;
  
  uploadedImage = item.imageUrl;
  analysisResult = item.analysis;
  generatedContent = item.content;
  
  // 回填输入框
  document.getElementById('productNameInput').value = analysisResult.productName || '';
  document.getElementById('categoryInput').value = analysisResult.category || '';
  // 卖点从 features 恢复
  const features = (analysisResult.features || []).join(', ');
  document.getElementById('featureInput').value = features;
  
  uploadZone.classList.add('has-image');
  uploadZone.innerHTML = `<img src="${uploadedImage}" class="preview" alt="${analysisResult.productName}" id="previewImg">`;
  document.getElementById('previewImg').addEventListener('click', (ev) => {
    ev.stopPropagation();
    document.getElementById('fileInput').click();
  });
  updateAnalyzeBtn();
  
  showResults();
  updateStep(3, 'done');
  document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
}

function deleteHistoryItem(idx) {
  const history = JSON.parse(localStorage.getItem('ai_product_history') || '[]');
  history.splice(idx, 1);
  localStorage.setItem('ai_product_history', JSON.stringify(history));
  loadHistory();
  showToast('已删除');
}

function clearAllHistory() {
  if (confirm('确定要清空所有历史记录吗？')) {
    localStorage.removeItem('ai_product_history');
    loadHistory();
    showToast('已清空');
  }
}

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
  updateTip();
  loadHistory();
});

function updateTip() {
  const config = getApiConfig();
  const hasApi = config.url && config.key;
  const tip = document.getElementById('tipMsg');
  if (hasApi) {
    tip.innerHTML = '✅ AI模型已配置，上传图片后将自动识别产品信息并生成内容';
    tip.style.background = '#f0fdf4';
    tip.style.color = '#166534';
  } else {
    tip.innerHTML = '📝 请填写产品名称和上传图片，点击"开始分析"生成运营内容。配置AI模型后可自动识图。';
    tip.style.background = '#fffbeb';
    tip.style.color = '#92400e';
  }
}

// 支持粘贴图片
document.addEventListener('paste', (e) => {
  const items = e.clipboardData.items;
  for (let item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      processFile(blob);
      break;
    }
  }
});
</script>
