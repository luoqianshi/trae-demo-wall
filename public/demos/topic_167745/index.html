e=!m.dateFound,a.assumed.timePeriod=!m.timeFound;const g=c1(n);a.duration=g.duration,a.assumed.duration=!g.found;const y=u1(n);a.partyType=y.type,a.partySize=y.size,a.childrenAges=y.childrenAges,a.assumed.partyType=!y.typeFound,a.assumed.partySize=!y.sizeFound,a.childrenAges=y.childrenAges,a.assumed.childrenAges=!y.childrenFound;const w=p1(n);a.travelStyle=w.style,a.assumed.travelStyle=!w.found;const v=d1(n);a.budget=v.budget,a.assumed.budget=!v.found;const C=f1(n);return a.accessibilityNeeds=C.needs,a.assumed.accessibilityNeeds=!C.found,a.specialRequests=h1(n),a.assumed.specialRequests=a.specialRequests.length===0,a}const g1="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image";function ge(t,n="landscape_4_3"){return`${g1}?prompt=${encodeURIComponent(t)}&image_size=${n}`}const y1=[{id:"node-ad-g1",title:"Theatre Façade Observation",titleZh:"剧院外立面观察",image:ge("Close-up of an Art Deco theatre building facade in Shanghai with geometric patterns, stepped forms, vertical emphasis, and chevron motifs, warm afternoon light","landscape_4_3"),summary:"Start at a landmark Art Deco theatre, where you'll learn to read a façade the way architects do — from base to crown.",summaryZh:"从一座地标性装饰艺术剧院开始，学习像建筑师一样阅读外立面——从基座到顶部。",deepContext:"This theatre building, completed in the mid-1930s, is one of Shanghai's most intact Art Deco entertainment buildings. Notice the tripartite composition: a solid stone base with a deeply recessed entrance, a vertical shaft with repeating bays of windows separated by pilasters, and a stepped crown that culminates in a neon sign frame. The side façades show the transition from stone cladding on the front to Shanghai plaster on the sides — typical of the period, where the visible face got the premium treatment.",deepContextZh:"这座剧院建于20世纪30年代中期，是上海保存最完好的装饰艺术娱乐建筑之一。注意它的三段式构图：坚固的石材基座带有深邃的入口，垂直的楼身有重复的窗洞被壁柱分隔，顶部是阶梯状的檐口，最终以霓虹灯框架收尾。侧面外墙展示了从正面石材饰面到侧面上海抹灰的过渡——这是那个时代的典型做法，面向街道的立面获得了更高档次的处理。",observationTask:"Stand across the street. Close one eye and frame the building. Sketch (mentally or on paper) the basic shape — the skyline silhouette. Now identify where the base ends and the shaft begins, and where the shaft ends and the crown begins.",observationTaskZh:"站在街对面。闭上一只眼睛框选出建筑轮廓。在脑海或纸上勾勒基本形状——天际线剪影。现在找出基座结束、楼身开始的位置，以及楼身结束、顶部开始的位置。",presetQuestions:["Why is this building considered Art Deco and not neoclassical?","What's the difference between the front and side façades?","How did they light this building in the 1930s?"],presetQuestionsZh:["为什么这座建筑被认为是装饰艺术风格而非新古典主义？","正面和侧面外墙有什么区别？","20世纪30年代人们是如何照亮这座建筑的？"],knowledgeBlockIds:["kb-ad-1","kb-ad-2"]},{id:"node-ad-g2",title:"Historic Apartment Façades",titleZh:"历史公寓外立面",image:ge("Row of 1930s Art Deco apartment buildings along a Shanghai street, balconies with geometric railings, steel-framed windows, warm stone and plaster facade","landscape_4_3"),summary:"Walk through a residential street lined with 1930s apartment buildings. Study bay rhythm, window proportions, and the material language of Shanghai plaster.",summaryZh:"漫步在两旁排列着20世纪30年代公寓建筑的住宅街道。研究窗洞韵律、窗户比例和上海抹灰的材料语言。",deepContext:"These apartment buildings represent the golden age of Shanghai residential Art Deco — the mid-1930s. The standard bay module is about four meters, corresponding to a standard room width. Windows are grouped in pairs and trios, with projecting bays that catch the light. Note the metal window frames — imported steel from Britain and Germany was a status symbol. The balconies have geometric balustrades with chevron and circular motifs. Look up at the roofline and you'll see the parapet stepped back — a small echo of the New York skyscraper style applied to a mid-rise residential block.",deepContextZh:"这些公寓建筑代表了上海住宅装饰艺术的黄金时代——20世纪30年代中期。标准窗洞模块约四米宽，对应一个标准房间的宽度。窗户成对或成三组合，突出的窗洞捕捉光线。注意金属窗框——从英国和德国进口的钢材在当时是身份的象征。阳台有几何图案的栏杆，带有人字纹和圆形纹样。抬头看屋顶线，你会看到后退的女儿墙——这是纽约摩天大楼风格在中层住宅建筑上的一种呼应。",observationTask:"Choose one building façade. Count the bays (vertical divisions). Now group them: are they paired? In threes? Is there a central bay that's different? That's the façade's rhythm.",observationTaskZh:"选择一栋建筑的外立面。数一下窗洞（垂直分区）的数量。现在将它们分组：是成对的？还是三个一组？有没有一个与众不同的中央窗洞？这就是外立面的韵律。",presetQuestions:["How many windows wide is a typical apartment unit?","Why are some bays projecting outward?","What is Shanghai plaster?"],presetQuestionsZh:["一个典型的公寓单元有多宽（以窗户数量计）？","为什么有些窗洞向外突出？","什么是上海抹灰？"],knowledgeBlockIds:["kb-ad-2","kb-ad-3"]},{id:"node-ad-g3",title:"Street-Corner Commercial Architecture",titleZh:"街角商业建筑",image:ge("1930s Art Deco corner commercial building in Shanghai French Concession, curved corner, horizontal bands, ground floor shopfronts","landscape_4_3"),summary:"Examine a corner building where two streets meet. Study how the corner is resolved, how the street wall is maintained, and how commercial and residential uses stack vertically.",summaryZh:"考察两条街道交汇处的街角建筑。研究如何处理转角、如何维持街道界面，以及商业和住宅用途如何垂直堆叠。",deepContext:"The corner building is a classic type in the former French Concession. The curved or chamfered corner maximises visibility for the ground-floor shop while creating a smooth transition between two street walls. The horizontal banding — string courses between floors — is characteristic of streamline moderne, the later phase of Art Deco that emphasised curves and horizontality rather than geometric ornament and verticality. Look at how the entrance is set back to create shelter, and how the upper floors step back slightly to give the building a stable, pyramidal silhouette.",deepContextZh:"街角建筑是前法租界的经典类型。弧形或斜切的转角最大限度地增加了底层商店的可见性，同时在两个街道界面之间创造了平滑过渡。水平线条——楼层之间的腰线——是流线型现代风格的特征，这是装饰艺术的后期阶段，强调曲线和水平感而非几何装饰和垂直感。观察入口如何后退以形成遮蔽，以及上层如何略微后退以赋予建筑稳定的金字塔轮廓。",observationTask:"Stand at the corner and look at both street façades. Are they the same? Does the corner look like it was designed as the 'front' or is it a meeting of two fronts?",observationTaskZh:"站在街角，观察两个街道的外立面。它们是一样的吗？转角看起来像是被设计为'正面'，还是两个正面的交汇处？",presetQuestions:["What's the difference between Art Deco and streamline moderne?","Why are corner buildings so common in the French Concession?","What did the ground floor shops sell in the 1930s?"],presetQuestionsZh:["装饰艺术风格和流线型现代风格有什么区别？","为什么街角建筑在法租界如此常见？","20世纪30年代底层商店卖什么？"],knowledgeBlockIds:["kb-ad-3","kb-ad-4"]},{id:"node-ad-g4",title:"Adaptive Reuse Case",titleZh:"适应性再利用案例",image:ge("Converted Art Deco building in Shanghai with preserved historic facade and modern interior visible through windows, adaptive reuse, mix of old and new","landscape_4_3"),summary:"End the walk at a carefully converted historic building. Discuss how preservation and renewal coexist — and how to tell the difference.",summaryZh:"在一座精心改造的历史建筑结束行程。讨论保护与更新如何共存——以及如何区分它们。",deepContext:"This building was originally a 1930s office and retail building. Its current use — a mix of boutique shops, cafés, and small offices — is typical of adaptive reuse in Shanghai's historic districts. The façade was restored to its 1930s appearance: original window proportions were maintained, the stone base was cleaned and repaired, and the Art Deco ornament at the roofline was reconstructed based on historic photographs. Inside, the building was gutted and rebuilt with modern structure, services, and circulation. The rule of thumb in Shanghai conservation is 'preserve the outside, update the inside' — a pragmatic approach that saves the city's character while allowing modern life to continue.",deepContextZh:"这座建筑最初是20世纪30年代的办公和零售建筑。现在的用途——精品店、咖啡馆和小型办公室的混合——是上海历史街区适应性再利用的典型案例。外立面已恢复到20世纪30年代的外观：保持了原始窗户比例，石材基座经过清洁和修复，屋顶线的装饰艺术装饰根据历史照片进行了重建。内部则被清空并重建，配备了现代结构、服务设施和交通流线。上海保护的经验法则是'保外更新内'——这是一种务实的方法，既保留了城市特色，又允许现代生活继续。",observationTask:"Find three details on the façade that look authentically old, and one detail that looks like a modern addition. What clues gave them away?",observationTaskZh:"在外立面上找到三个看起来真正古老的细节，以及一个看起来像是现代添加的细节。是什么线索暴露了它们？",presetQuestions:["How do they decide which old buildings to preserve?","Is the inside still original or completely rebuilt?","What are the biggest challenges of adaptive reuse?"],presetQuestionsZh:["他们如何决定保护哪些老建筑？","内部是仍然保持原始状态还是完全重建？","适应性再利用面临的最大挑战是什么？"],knowledgeBlockIds:["kb-ad-4","kb-ad-5"]}],x1=[{id:"node-ad-ai-1",title:"South Shaanxi Road Metro Exit",titleZh:"陕西南路地铁站出口",image:ge("Street level view of Art Deco buildings near South Shaanxi Road in Shanghai French Concession, plane trees, warm sunlight through leaves","landscape_16_9"),summary:"Start your walk at Exit 4 of South Shaanxi Road Station. Step out and look around — you're in the heart of the former French Concession.",summaryZh:"从陕西南路地铁站4号口开始您的漫步。走出来环顾四周——您正处于前法租界的中心地带。",deepContext:"This intersection marks the boundary between two historic neighbourhoods. To the west stretches the residential area of the former French Concession, with its plane-tree-lined streets and mid-rise apartment blocks. To the east is the commercial district that developed around Avenue Joffre (now Huaihai Road). The plane trees (Platanus × acerifolia) were a signature of French urban planning — they were planted to create shade and give the streets a European feel. Notice how the canopy overhead creates a green ceiling — a key part of the area's character.",deepContextZh:"这个十字路口标志着两个历史街区的边界。向西延伸的是前法租界的住宅区，有梧桐树成荫的街道和中层公寓楼。向东是围绕霞飞路（今淮海路）发展起来的商业区。梧桐树（二球悬铃木）是法国城市规划的标志性元素——它们被种植来创造阴凉，赋予街道欧洲风情。注意头顶的树冠如何形成绿色天花板——这是该区域特色的关键部分。",observationTask:"Stand still for 30 seconds. Look up at the tree canopy. Look down at the street level. What's the relationship between the height of the trees and the height of the buildings? That proportion is part of what makes this area feel special.",observationTaskZh:"站立30秒。抬头看树冠。低头看街道。树木高度和建筑高度之间有什么关系？这个比例正是让这个区域感觉特别的原因之一。",presetQuestions:["What was Avenue Joffre?","Why are there so many plane trees in Shanghai?","What was this area like in the 1930s?"],presetQuestionsZh:["什么是霞飞路？","为什么上海有这么多梧桐树？","20世纪30年代这个区域是什么样子的？"],knowledgeBlockIds:["kb-ad-1"]},{id:"node-ad-ai-2",title:"The Hidden Lane House",titleZh:"隐秘的里弄住宅",image:ge("Entrance to a Shanghai lane house alleyway with Art Deco style gate, stone pillars, geometric patterns, glimpse of houses inside","landscape_16_9"),summary:"Walk two blocks west until you find a lane entrance with stone gate pillars. Step in just a little — these are private homes, so please be respectful.",summaryZh:"向西走两个街区，直到找到一个有石柱门柱的里弄入口。稍微走进去一点——这些是私人住宅，请保持尊重。",deepContext:"Lane houses (longtang) are Shanghai's characteristic residential type — a hybrid of European terrace housing and Chinese courtyard living, developed between the 1870s and 1940s. Earlier lane houses had more traditional Chinese features; later ones, built in the 1920s and 1930s, adopted Art Deco details — geometric gate designs, stepped door frames, cement render with incised geometric patterns. The lane itself — the narrow alley that runs through the block — was the social space of the neighbourhood. Children played there, vendors called out their wares, and families gathered in the evenings. Today these lanes are disappearing as blocks are redeveloped, making the ones that remain precious.",deepContextZh:"里弄住宅（longtang）是上海特有的居住类型——欧洲联排住宅和中国庭院生活的混合体，发展于1870年代至1940年代之间。早期的里弄住宅具有更多传统中国特色；后来在1920年代和1930年代建造的里弄住宅则采用了装饰艺术风格的细节——几何图案的大门设计、阶梯式门框、带有刻划几何图案的水泥抹灰。里弄本身——贯穿街区的狭窄小巷——是邻里的社交空间。孩子们在那里玩耍，小贩叫卖，家庭在傍晚聚集。如今随着街区重建，这些里弄正在消失，使得留存下来的里弄变得格外珍贵。",observationTask:"Look at the gate. Can you find three geometric shapes — maybe circles, chevrons, or stepped forms? These are typical Art Deco motifs applied to a very Shanghai building type.",observationTaskZh:"观察大门。您能找到三种几何形状吗？可能是圆形、人字纹或阶梯形？这些是应用于非常具有上海特色的建筑类型上的典型装饰艺术图案。",presetQuestions:["What's the difference between a lane house and a shikumen?","How many families live in one lane house now?","Are these buildings protected?"],presetQuestionsZh:["里弄住宅和石库门有什么区别？","现在一栋里弄住宅里住多少户人家？","这些建筑受到保护吗？"],knowledgeBlockIds:["kb-ad-2","kb-ad-3"]},{id:"node-ad-ai-3",title:"The Apartment Block with a View",titleZh:"观景公寓楼",image:ge("Impressive Art Deco apartment building in Shanghai with curved corner, balcony details, geometric patterns, dramatic sky, looking up perspective","landscape_16_9"),summary:"Continue west until you reach a major intersection with a prominent apartment building on the corner. This is your main stop — a classic of Shanghai Art Deco residential architecture.",summaryZh:"继续向西走，直到到达一个大十字路口，街角有一栋显眼的公寓楼。这是您的主要停靠点——上海装饰艺术住宅建筑的经典之作。",deepContext:"This apartment block, built in the mid-1930s, is a textbook example of how Art Deco was adapted for Shanghai's climate and lifestyle. The curved corner wraps the building around the intersection, giving it a strong street presence. The balconies — simple geometric balustrades, projecting slabs — provide outdoor space and shade. The windows are metal-framed, a sign of quality in the 1930s. Look up at the roofline and you'll see the stepped form that was Art Deco's signature. In its day, this was considered modern, glamorous living — with elevators, central heating (unusual for Shanghai), and views over the tree canopy.",deepContextZh:"这栋公寓楼建于20世纪30年代中期，是装饰艺术风格如何适应上海气候和生活方式的教科书式范例。弧形转角将建筑环绕在十字路口，赋予其强烈的街道存在感。阳台——简单的几何栏杆、悬挑楼板——提供了户外空间和遮阳。窗户是金属框架的，在20世纪30年代是品质的标志。抬头看屋顶线，您会看到装饰艺术风格标志性的阶梯形。在那个年代，这里被认为是现代、奢华的生活——配有电梯、中央供暖（在上海不常见）和树冠之上的景观。",observationTask:"Count the number of bays (vertical window groups) on one side of the corner. Now find the central bay — is it wider, narrower, or the same? Why do you think the architect made that choice?",observationTaskZh:"数一下转角一侧的窗洞（垂直窗户组）数量。现在找到中央窗洞——它是更宽、更窄还是相同？您认为建筑师为什么做出这样的选择？",presetQuestions:["How many apartments are on each floor?","What was rent here in the 1930s compared to today?","Who were the original residents?"],presetQuestionsZh:["每层楼有多少套公寓？","20世纪30年代这里的租金和今天相比如何？","最初的居民是谁？"],knowledgeBlockIds:["kb-ad-2","kb-ad-3","kb-ad-4"]},{id:"node-ad-ai-4",title:"Renewed Alley District",titleZh:"更新后的里弄街区",image:ge("Renovated historic alley district in Shanghai with boutique shops and cafes inside old lane houses, preservation and modern life mix, warm lighting","landscape_16_9"),summary:"Finish your walk at a renewed alley district. See how old Shanghai buildings are being given new lives — and think about what is gained and lost in the process.",summaryZh:"在一个更新后的里弄街区结束您的漫步。看看上海老建筑如何获得新生命——思考这个过程中获得了什么，失去了什么。",deepContext:"This district was once a typical residential lane compound. In the 2010s it was converted into a lifestyle and dining destination. The lane layout, building heights, and many original details were preserved — stone door frames, brick walls, tile patterns. But the interiors were entirely rebuilt for retail and food service. This kind of adaptive reuse is controversial. Preservationists argue that removing residents erases the living culture of the lane. Developers and city planners argue that commercial use is the only way to fund restoration. Walk through and notice both — the details that were kept, and the feeling of something that has been fundamentally transformed.",deepContextZh:"这个街区曾经是一个典型的里弄住宅区。在2010年代，它被改造成了一个生活方式和餐饮目的地。里弄布局、建筑高度和许多原始细节都得到了保留——石门框、砖墙、瓦片图案。但内部被完全重建用于零售和餐饮服务。这种适应性再利用是有争议的。保护主义者认为移除居民会抹去里弄的鲜活文化。开发商和城市规划者则认为商业用途是资助修复的唯一途径。漫步其中，注意两者——被保留的细节，以及某种被根本改变的感觉。",observationTask:"Walk the length of the lane. Find five original details (old bricks, original door frames, roof tiles) and five new additions (modern storefronts, signs, lighting). Rate the balance — does it feel like the old place has been respected?",observationTaskZh:"走完里弄的全程。找到五个原始细节（旧砖块、原始门框、屋顶瓦片）和五个新添加的元素（现代店面、招牌、照明）。评价一下平衡——感觉老地方得到尊重了吗？",presetQuestions:["Did people used to live here?","How do they decide what to keep and what to change?","Are there still residents living in these lanes?"],presetQuestionsZh:["以前有人住在这里吗？","他们如何决定保留什么和改变什么？","这些里弄里还有居民居住吗？"],knowledgeBlockIds:["kb-ad-4","kb-ad-5"]}],pc=[{id:"node-cr-g1",title:"Pattern Language Introduction",titleZh:"纹样语言入门",image:ge("Traditional Chinese heritage craft patterns displayed on fabric, embroidery examples, wooden carved blocks, warm light, close up detail","landscape_4_3"),summary:"Start with a close look at Shanghai-style pattern language — what motifs mean, where they come from, and how to read them.",summaryZh:"从近距离观察海派纹样语言开始——纹样意味着什么，它们来自哪里，以及如何解读它们。",deepContext:"Traditional Chinese patterns aren't just decoration — they're a visual language. A bat (fu) represents good fortune because the word sounds the same as 'luck'. A peony symbolises prosperity. A carp symbolises perseverance and success. In Shanghai during the 1920s and 1930s, these traditional symbols met Art Deco geometry and modernist design, creating a hybrid style that was uniquely Shanghai. You can find it on everything from textiles to architecture to packaging.",deepContextZh:"中国传统纹样不仅仅是装饰——它们是一种视觉语言。蝙蝠（蝠）代表好运，因为它的发音与'福'相同。牡丹象征繁荣。鲤鱼象征毅力和成功。在20世纪20年代和30年代的上海，这些传统符号与装饰艺术几何和现代主义设计相遇，创造了一种独特的上海风格。您可以在从纺织品到建筑再到包装的一切事物上找到它。",observationTask:"Look at the samples in front of you. Find three different motifs. For each one, guess what it might symbolise — good luck, long life, prosperity? Your guide will confirm.",observationTaskZh:"观察面前的样本。找到三种不同的纹样。对于每一种，猜测它可能象征什么——好运、长寿、繁荣？您的向导将予以确认。",presetQuestions:["How many traditional Chinese motifs are there?","Why are there so many lotus and peony patterns?","How did Shanghai style differ from other Chinese craft styles?"],presetQuestionsZh:["中国传统纹样有多少种？","为什么有这么多莲花和牡丹图案？","海派风格与其他中国工艺风格有何不同？"],knowledgeBlockIds:["kb-cr-1","kb-cr-2"]},{id:"node-cr-g2",title:"Material Workshop",titleZh:"材料工坊",image:ge("Heritage craft workshop with silk threads, bamboo strips, tools on wooden table, artisan hands working, warm natural light","landscape_4_3"),summary:"Visit a working craft studio. See silk threads, bamboo strips, and carving tools up close. Try a simple hands-on activity.",summaryZh:"参观一个正在运作的工艺工作室。近距离观察丝线、竹条和雕刻工具。尝试一项简单的动手活动。",deepContext:"Shanghai's craft traditions draw from the wider Jiangnan region — Suzhou embroidery, Hangzhou silk, Yangzhou lacquer, Yixing teapots. But Shanghai also developed its own craft identity through the import of foreign materials (celluloid, enamel, machine-made thread) and the export market's taste for 'Chinese style' products. The result is a craft scene that's both deeply traditional and distinctly modern. In this workshop, you'll see how traditional materials are still used today, and how younger artisans are experimenting with new forms.",deepContextZh:"上海的工艺传统源自广阔的江南地区——苏州刺绣、杭州丝绸、扬州漆器、宜兴茶壶。但上海也通过进口外国材料（赛璐珞、珐琅、机制线）和出口市场对'中国风格'产品的品味，发展出了自己的工艺身份。结果是一个既深厚传统又明显现代的工艺场景。在这个工坊里，您将看到传统材料今天仍在如何使用，以及年轻工匠如何尝试新形式。",observationTask:"Try the hands-on activity — either a simple embroidery stitch or a paper-cut pattern. Focus on the rhythm of the movement: how the tool moves, how the material responds. That rhythm is what master craftspeople develop over decades.",observationTaskZh:"尝试动手活动——无论是简单的刺绣针法还是剪纸图案。专注于动作的节奏：工具如何移动，材料如何反应。这种节奏是工艺大师们数十年培养出来的。",presetQuestions:["How long does it take to master embroidery?","Are these materials all local?","How is Shanghai craft different from Suzhou?"],presetQuestionsZh:["掌握刺绣需要多长时间？","这些材料都是本地的吗？","上海工艺与苏州工艺有何不同？"],knowledgeBlockIds:["kb-cr-2","kb-cr-3"]},{id:"node-cr-g3",title:"Pattern Hunt in the Street",titleZh:"街头纹样探寻",image:ge("Old Shanghai street with decorative patterns on shopfronts, window grilles, building details, texture and ornament hunt","landscape_4_3"),summary:"Take a short walk and find patterns in the wild — on doorways, window grilles, ironwork, and shopfronts. You'll start seeing them everywhere.",summaryZh:"短途漫步，在街头寻找纹样——在门口、窗格、铁艺和店面上。您会开始在各处都看到它们。",deepContext:"Once you know how to look, patterns appear all over the city. Traditional lattice patterns appear in modern glass facades. Cloud-scroll motifs turn up in hotel lobbies. Geometric borders from the 1930s survive on old shopfronts. This street-level pattern hunt trains your eye to see the decorative language of the city — and to notice when it's disappearing. Many historic details are lost when buildings are renovated, making the ones that remain all the more valuable to observe and appreciate.",deepContextZh:"一旦您知道如何观察，纹样就会出现在整个城市。传统格子图案出现在现代玻璃立面上。云纹出现在酒店大堂。20世纪30年代的几何边框在老店面上幸存。这种街头纹样探寻训练您的眼睛看到城市的装饰语言——并注意到它何时正在消失。许多历史细节在建筑翻新时丢失，使得留存下来的细节更加值得观察和欣赏。",observationTask:"In 10 minutes, find as many patterns as you can. Take photos (or make mental notes) of the most interesting one. We'll share our finds at the next stop.",observationTaskZh:"在10分钟内，尽可能多地找到纹样。拍摄（或在脑海中记录）最有趣的一个。我们将在下一站分享我们的发现。",presetQuestions:["Are most of these patterns from the 1930s or older?","Do modern buildings in Shanghai still use traditional patterns?","Why do some buildings have so much decoration and others so little?"],presetQuestionsZh:["这些纹样大部分是来自20世纪30年代还是更早？","上海的现代建筑还在使用传统纹样吗？","为什么有些建筑有很多装饰，而有些却很少？"],knowledgeBlockIds:["kb-cr-1","kb-cr-4"]},{id:"node-cr-g4",title:"Take-Home Creation",titleZh:"带回家的创作",image:ge("Finished craft piece with traditional pattern, handmade paper souvenir, brush and ink, hands holding final product, warm light","landscape_4_3"),summary:"Design and create a small take-home piece that combines a traditional motif with your own design — something to remember Shanghai by.",summaryZh:"设计并制作一个结合传统纹样和您自己设计的小作品带回家——一件可以记住上海的东西。",deepContext:"The best way to understand a craft tradition is to make something with your own hands. In this final session, you'll create a small piece — a paper-cut, a printed card, or a simple embroidered patch — using a traditional motif you've learned about, reimagined in your own style. This act of reinterpretation is exactly what Shanghai-style craft has always done: taking tradition and making it new. Your finished piece is both a souvenir and a small act of participation in the ongoing story of craft.",deepContextZh:"理解工艺传统的最佳方式是亲手制作东西。在这最后一个环节，您将创作一件小作品——剪纸、印刷卡片或简单的刺绣贴花——使用您学到的传统纹样，以自己的风格重新想象。这种重新诠释正是海派工艺一直以来所做的：取传统而创新。您完成的作品既是纪念品，也是参与工艺持续故事的一个小行动。",observationTask:"Look at your finished piece next to the traditional sample that inspired it. What did you keep? What did you change? Why? That's the creative process of heritage — not just copying, but carrying something forward.",observationTaskZh:"将您完成的作品与启发它的传统样本放在一起观察。您保留了什么？改变了什么？为什么？这就是传承的创作过程——不仅仅是复制，而是将某些东西向前推进。",presetQuestions:["Can I buy authentic handmade crafts in Shanghai?","How do I tell machine-made from handmade?","Are young people still learning these crafts?"],presetQuestionsZh:["在上海可以买到正宗的手工艺品吗？","如何区分机制品和手制品？","年轻人还在学习这些工艺吗？"],knowledgeBlockIds:["kb-cr-3","kb-cr-4","kb-cr-5"]}],w1=[{id:"node-pa-1",title:"Tailored Itinerary Design",titleZh:"定制行程设计",image:ge("Architectural drawing and notebook with Shanghai building sketches, pencil, ruler, warm afternoon light on wooden desk","landscape_4_3"),summary:"We'll design a custom route based on your interests — whether you want Art Deco, lane houses, urban renewal, or all of the above.",summaryZh:"我们将根据您的兴趣设计定制路线——无论您想要装饰艺术、里弄住宅、城市更新，还是以上全部。",deepContext:"Your private experience is fully customisable. We can focus on a single theme (Art Deco, industrial heritage, garden design, contemporary architecture) or combine several. We can adjust the pace for families with children, add photography stops, include a sit-down tea break in a historic building, or dive deep into technical architectural analysis. You tell us what you want to get out of the day, and we'll design a route that delivers it.",deepContextZh:"您的私享体验完全可定制。我们可以专注于单一主题（装饰艺术、工业遗产、园林设计、当代建筑）或组合多个主题。我们可以为有孩子的家庭调整节奏，添加摄影停留点，在历史建筑中安排坐下来的茶歇，或深入进行技术性建筑分析。告诉我们您想从一天中获得什么，我们将设计一条能够满足您需求的路线。",observationTask:"Think about one specific thing you'd most like to see or learn. Tell your experience designer and we'll make sure it's the centrepiece of the day.",observationTaskZh:"想一想您最想看到或学到的一件具体事物。告诉您的体验设计师，我们将确保它成为当天的核心内容。",presetQuestions:["How many different neighbourhoods can we visit in 3 hours?","Can we go inside any historic buildings?","Is this experience suitable for children?"],presetQuestionsZh:["3小时内我们可以参观多少个不同的街区？","我们可以进入任何历史建筑内部吗？","这个体验适合儿童吗？"],knowledgeBlockIds:["kb-ad-1","kb-ad-5"]},{id:"node-pa-2",title:"Deep Dive Topics Available",titleZh:"深度主题选择",image:ge("Collage of Shanghai architectural details — Art Deco patterns, garden windows, industrial structures, modern buildings","landscape_4_3"),summary:"Choose from several deep-dive topics: façade reading, urban renewal case studies, architectural photography, construction techniques, or Shanghai's architectural history.",summaryZh:"从多个深度主题中选择：外立面解读、城市更新案例研究、建筑摄影、施工技术或上海建筑历史。",deepContext:"Depending on your background and interests, we can tailor the content depth. For architecture professionals: we can discuss structural systems, material specifications, conservation technical standards, and planning policy. For casual visitors: we'll focus on stories, visual beauty, and an intuitive understanding of the city's form. For photographers: we'll choose the best light, the best angles, and the most photogenic details. For families: we'll include hands-on activities and shorter attention spans. The choice is yours.",deepContextZh:"根据您的背景和兴趣，我们可以调整内容深度。对于建筑专业人士：我们可以讨论结构系统、材料规格、保护技术标准和规划政策。对于休闲游客：我们将专注于故事、视觉美感和对城市形态的直观理解。对于摄影师：我们将选择最佳光线、最佳角度和最上镜的细节。对于家庭：我们将包含动手活动和更短的注意力跨度。选择权在您手中。",observationTask:"Not applicable yet — this is a menu of options. Pick your focus and we'll build the experience around it.",observationTaskZh:"尚未适用——这是一个选项菜单。选择您的关注点，我们将围绕它构建体验。",presetQuestions:["What's the most popular private experience?","Can we switch topics during the day?","How far in advance should we book?"],presetQuestionsZh:["最受欢迎的私享体验是什么？","我们可以在当天切换主题吗？","我们应该提前多久预订？"],knowledgeBlockIds:[]}],Nc=[{id:"p-ad-group",tier:"group",themeId:"theme-art-deco",title:"Shanghai Art Deco: Read the City Like an Architect",titleZh:"上海装饰艺术：像建筑师一样阅读城市",subtitle:"A guided walking tour of Shanghai's Art Deco heritage",subtitleZh:"探索上海装饰艺术遗产的导览步行之旅",heroImage:ge("Elegant Art Deco buildings along a Shanghai street with plane trees, golden hour light, 1930s architecture, geometric facades","landscape_16_9"),gallery:[ge("Close-up of Art Deco geometric building detail, chevron patterns, stepped forms","square"),ge("Historic apartment building facade in Shanghai, balconies with geometric railings","square"),ge("Street corner with Art Deco building and plane trees, afternoon light","square"),ge("Architectural detail of Art Deco doorway, stone carvings, ironwork","square")],city:"Shanghai",cityZh:"上海",price:299,priceUnit:"person",duration:"3 hours",durationZh:"3小时",durationHours:3,languages:["English","Japanese AI assistance"],languagesZh:["英语","日语AI辅助"],meetingPoint:"South Shaanxi Road Metro Station — Exit 4",meetingPointZh:"陕西南路地铁站 — 4号出口",capacity:{min:4,max:8},enrolled:5,familyFriendly:!1,customizable:!1,availableNow:!1,highlights:["Identify the geometric order of Art Deco façades","Understand Shanghai apartments and modern urban life","Compare historic preservation and contemporary renewal","Complete your own architecture observation card"],highlightsZh:["识别装饰艺术外立面的几何秩序","理解上海公寓与现代城市生活","对比历史保护与当代更新","完成您自己的建筑观察卡片"],routeNodes:y1,contributorIds:["c1","c2","c8"]},{id:"p-cr-group",tier:"group",themeId:"theme-craft",title:"Heritage Patterns: Shanghai Craft Workshop Walk",titleZh:"非遗纹样：上海工艺工坊漫步",subtitle:"Discover the craft traditions that shaped Shanghai's visual style",subtitleZh:"发现塑造上海视觉风格的工艺传统",heroImage:ge("Traditional Chinese craft workshop with silk embroidery threads, wooden tools, artisan hands working, warm natural light","landscape_16_9"),gallery:[ge("Close-up of traditional Chinese embroidery pattern, silk threads, detail","square"),ge("Bamboo weaving process, artisan hands, natural material texture","square"),ge("Collection of heritage patterns on fabric and paper, arranged beautifully","square"),ge("Family craft workshop, parents and children creating together","square")],city:"Shanghai",cityZh:"上海",price:259,priceUnit:"person",duration:"2.5 hours",durationZh:"2.5小时",durationHours:2.5,languages:["English","Chinese"],languagesZh:["英语","中文"],meetingPoint:"Near Tianzifang — Exact location sent after booking",meetingPointZh:"田子坊附近 — 预订后发送精确位置",capacity:{min:4,max:10},enrolled:6,familyFriendly:!0,customizable:!1,availableNow:!1,highlights:["Learn to read traditional Chinese pattern symbolism","Visit a working craft studio","Hunt for patterns in the streetscape","Create a take-home piece inspired by Shanghai heritage"],highlightsZh:["学习解读中国传统纹样的象征意义","参观一个正在运作的工艺工作室","在街景中寻找纹样","创作一件受上海遗产启发的带回家作品"],routeNodes:pc,contributorIds:["c3","c4"]},{id:"p-ad-private",tier:"private",themeId:"theme-art-deco",title:"Private Shanghai Architecture Deep Dive",titleZh:"私享上海建筑深度之旅",subtitle:"A fully customised architecture experience for you and your group",subtitleZh:"为您和您的团队量身定制的建筑体验",heroImage:ge("Private architectural tour of Shanghai, professional guide with small group, historic building with dramatic light","landscape_16_9"),gallery:[ge("Private tour group looking at historic building architecture","square"),ge("Sketch of Shanghai building detail, architectural drawing","square"),ge("Couple on architecture walk in French Concession","square")],city:"Shanghai",cityZh:"上海",price:1299,priceUnit:"group",priceRange:"¥1,299 – ¥2,499",duration:"3 or 5 hours",durationZh:"3或5小时",durationHours:4,languages:["English","Japanese","Chinese"],languagesZh:["英语","日语","中文"],meetingPoint:"Flexible — your hotel or a landmark of your choice",meetingPointZh:"灵活安排 — 您的酒店或您选择的地标",capacity:{min:1,max:6},familyFriendly:!0,customizable:!0,availableNow:!1,highlights:["Choose your focus: Art Deco, modern residences, urban renewal, or architectural photography","Set your own pace, route, and depth of content","Available in English, Japanese, or Chinese","Designed for 1 to 6 guests — families, couples, friends, or solo travellers"],highlightsZh:["选择您的关注点：装饰艺术、现代住宅、城市更新或建筑摄影","设定您自己的节奏、路线和内容深度","提供英语、日语或中文服务","专为1至6位客人设计——家庭、情侣、朋友或独自旅行者"],routeNodes:w1,contributorIds:["c1","c2","c6"]},{id:"p-cr-private",tier:"private",themeId:"theme-craft",title:"Private Family Craft Immersion",titleZh:"私享亲子工艺沉浸体验",subtitle:"A hands-on heritage craft experience designed for families with children",subtitleZh:"专为有孩子的家庭设计的动手非遗工艺体验",heroImage:ge("Family craft workshop, parents and children making traditional patterns together, warm light, colorful materials","landscape_16_9"),gallery:[ge("Children doing paper cutting craft, smiling, colorful paper","square"),ge("Family working together on embroidery pattern","square"),ge("Finished craft creations displayed on wooden table","square")],city:"Shanghai",cityZh:"上海",price:999,priceUnit:"group",priceRange:"¥999 – ¥1,899",duration:"2 or 3 hours",durationZh:"2或3小时",durationHours:2.5,languages:["English","Chinese"],languagesZh:["英语","中文"],meetingPoint:"Central Shanghai craft studio",meetingPointZh:"上海中心工艺工作室",capacity:{min:1,max:6},familyFriendly:!0,customizable:!0,availableNow:!1,highlights:["Child-friendly pacing and hands-on activities","Choose from embroidery, paper-cutting, bamboo weaving, or a mix","Take-home pieces for every family member","Suitable for ages 5 and up"],highlightsZh:["适合儿童的节奏和动手活动","从刺绣、剪纸、竹编中选择，或混合体验","每位家庭成员都有带回家的作品","适合5岁及以上儿童"],routeNodes:pc,contributorIds:["c3","c4"]},{id:"p-ad-aiguide",tier:"ai_guide",themeId:"theme-art-deco",title:"Art Deco Walk in the Former French Concession",titleZh:"法租界装饰艺术漫步",subtitle:"A self-paced architectural walk with AI at your side",subtitleZh:"AI陪伴的自定节奏建筑漫步",heroImage:ge("Aerial view of Shanghai French Concession street with plane trees and historic buildings, soft afternoon light","landscape_16_9"),gallery:[ge("Looking up at Art Deco apartment building through plane tree leaves","square"),ge("Map-like illustration of Art Deco walk route, stylized","square"),ge("Person using phone on self-guided architecture walk","square"),ge("Close-up of Art Deco window detail with geometric pattern","square")],city:"Shanghai",cityZh:"上海",price:49,priceUnit:"tour",duration:"2 hours",durationZh:"2小时",durationHours:2,languages:["English","Japanese","French","Chinese"],languagesZh:["英语","日语","法语","中文"],familyFriendly:!1,customizable:!1,availableNow:!0,highlights:["Start anytime — go at your own pace","4 carefully chosen stops with architectural observation tasks","Ask AI questions about any building or detail","Available in English, Japanese, French, and Chinese"],highlightsZh:["随时开始 — 按您自己的节奏前行","4个精心选择的停靠点，配有建筑观察任务","向AI询问关于任何建筑或细节的问题","提供英语、日语、法语和中文服务"],routeNodes:x1,contributorIds:["c1","c2","c8"]},{id:"p-cr-aiguide",tier:"ai_guide",themeId:"theme-craft",title:"Pattern Hunter: Shanghai Heritage Self-Guided",titleZh:"纹样猎人：上海遗产自助导览",subtitle:"Find the hidden patterns of Shanghai's streets and shops",subtitleZh:"寻找上海街道和店铺中隐藏的纹样",heroImage:ge("Detail of traditional Chinese decorative pattern on old building wall, warm light, texture","landscape_16_9"),gallery:[ge("Traditional window lattice pattern, geometric woodwork","square"),ge("Street-level photo hunt for patterns in Shanghai alley","square"),ge("Collection of found patterns — tiles, ironwork, wood carvings","square")],city:"Shanghai",cityZh:"上海",price:29,priceUnit:"tour",duration:"1.5 hours",durationZh:"1.5小时",durationHours:1.5,languages:["English","Chinese"],languagesZh:["英语","中文"],familyFriendly:!0,customizable:!1,availableNow:!0,highlights:["Train your eye to see patterns everywhere","3 stops with observation tasks","Suitable for families and kids","Start instantly, go at your own pace"],highlightsZh:["训练您的眼睛在各处发现纹样","3个配有观察任务的停靠点","适合家庭和儿童","立即开始，按您自己的节奏前行"],routeNodes:pc.slice(0,3),contributorIds:["c3"]}];function Yn(t){return Nc.find(n=>n.id===t)}const v1=[{id:"kb-ad-1",title:"What is Art Deco?",professional:"Art Deco in Shanghai flourished between the late 1920s and early 1940s, blending Parisian geometric order with locally adapted construction methods. Unlike the more ornamental Art Deco of Miami or Napier, Shanghai's version often fused streamline moderne with rationalised façade composition — a result of both American-educated Chinese architects and Western firms working alongside local contractors.",general:"Art Deco is a design style from the 1920s and 1930s that uses bold geometric shapes, symmetry, and elegant decoration. In Shanghai, it mixed Western trends with local craftsmanship, producing a unique version of the style.",familyTask:"Count how many different geometric shapes you can find on one building façade — circles, chevrons, zigzags, or stepped forms."},{id:"kb-ad-2",title:"How to read a façade",professional:"Approach a façade by reading its hierarchy: base, shaft, and crown — a tripartite composition inherited from Beaux-Arts tradition but simplified under Art Deco influence. Observe the bay rhythm, the treatment of openings, the transition between materials (stone, brick, terracotta, Shanghai plaster), and the way the building meets the street wall. Note whether the setback follows the Lujiazui or French Concession planning code.",general:"Look at a building from bottom to top. Notice the ground floor, the middle floors with repeating windows, and the top with decoration. Compare how light and shadow change the patterns during your visit.",familyTask:"Draw a simple outline of the building from the street. Mark where the windows repeat the most — that's the rhythm of the façade."},{id:"kb-ad-3",title:"Bay rhythm and proportion",professional:"Shanghai Art Deco apartment buildings typically use a 3.5–4.5 meter bay module derived from the standard room depth of the period. The rhythm is often grouped in pairs or trios, with a central projecting bay anchoring the composition. Study the ratio between void and solid — buildings from the mid-1930s tend toward larger window areas, reflecting the shift toward streamline moderne and airier domestic interiors.",general:"Buildings have a beat, like music. Windows and walls repeat in patterns. Count how many windows repeat before the pattern changes, and notice if the middle of the building looks different from the sides.",familyTask:"Clap a rhythm based on what you see — one clap for a window, two quick claps for a pair, a pause for a solid wall."},{id:"kb-ad-4",title:"Material transition and street wall",professional:"The transition between ground-floor stone cladding and upper-floor brick or Shanghai plaster is a key detail. Observe the water-table moulding, the string course that marks floor levels, and how the cornice or parapet resolves the building silhouette against the sky. The street wall — the plane formed by façades along a block — creates the urban room; Art Deco buildings in Shanghai strengthened this wall while introducing vertical emphasis through pilasters and finials.",general:"Look at where the bottom of the building meets the sidewalk, and where the top meets the sky. Notice the different materials used at each level and how they change.",familyTask:"Walk along one block and count how many different materials you can see at ground level — stone, tile, brick, or plaster."},{id:"kb-ad-5",title:"Adaptive reuse of historic buildings",professional:"Adaptive reuse in Shanghai's historic districts operates within strict conservation guidelines that distinguish between 'heritage buildings', 'excellent modern architecture', and 'general historic fabric'. Intervention strategies range from interior-only refurbishment to structural reinforcement with façade retention. Successful projects maintain the street wall rhythm, original window proportions, and material texture while introducing contemporary services within the existing volume.",general:"Many old buildings get a new life inside while keeping their historic look outside. Shops, offices, and hotels now fill spaces that were once homes, banks, or factories.",familyTask:"Find one building where the outside looks old but the inside is clearly new. Guess what it used to be."}],k1=[{question:"When were most Art Deco buildings in Shanghai built?",answer:"Most of Shanghai's Art Deco buildings were constructed between the late 1920s and the early 1940s, with the peak years in the mid-1930s before the disruption of war."},{question:"Who designed Shanghai's Art Deco buildings?",answer:"A mix of Western architectural firms (such as Palmer & Turner, Laszlo Hudec, and Minutti & Co.) and Chinese architects educated abroad (including many associated with St. John's University and Tongji's predecessors) shaped Shanghai's Art Deco skyline. Local contractors and craftspeople executed much of the detail work."},{question:"What makes Shanghai Art Deco different from other cities?",answer:"Shanghai's Art Deco is distinctive because it blended European and American models with local materials (Shanghai plaster, local brick), adapted to subtropical climate considerations (deep eaves, ventilation shafts), and was built at an enormous scale across both the International Settlement and the French Concession."},{question:"How do I tell Art Deco from neoclassical buildings?",answer:"Neoclassical buildings use columns, pediments, and classical ornament. Art Deco buildings use geometric shapes, zigzags, chevrons, stepped forms, and streamlined curves. If it looks like it belongs in a 1920s movie poster rather than an ancient temple, it's probably Art Deco."}],b1=[{id:"kb-gd-1",title:"Garden spatial aesthetics",professional:"Jiangnan gardens deploy a series of compositional strategies — borrowing scenery (jiejing), contrasting open and closed spaces (kaihe), hiding and revealing (canglu), and winding paths (youqu) — to create infinite experiential variety within a finite site. The designer orchestrates a sequence of framed views, each composed like a painting, that unfold as the visitor moves through the garden.",general:"Chinese gardens are designed like a series of paintings you walk through. Each turn reveals a new view. The trick is to make a small space feel large and full of surprise.",familyTask:"Find a round or arched doorway. Look through it and draw the picture you see on the other side — that's a 'borrowed view'."},{id:"kb-gd-2",title:"Rock, water, and pavilion",professional:"The three fundamental elements of a Jiangnan garden are rockeries (shanshi), water (shui), and buildings (jianzhu). Rocks embody mountain peaks; water reflects sky and shore; pauses are marked by pavilions, halls, and galleries. Their arrangement follows the principle of 'half mountain, half water' — a balanced dialogue between solid and void, weight and lightness.",general:"Every Chinese garden has rocks (standing for mountains), water (for reflection and calm), and small buildings (places to rest and look). Together they make a miniature world.",familyTask:"Find one rock that you think looks like a mountain peak. Stand next to it and see how it changes the view."},{id:"kb-gd-3",title:"Window patterns and latticework",professional:"Lattice windows (huachuang) are both decorative and structural. Common patterns include the ice-crack (liebing), the circular (yuanling), the geometric (jihe), and floral motifs. Each pattern filters light and views differently, creating a dappled interior atmosphere while framing the garden outside as a series of partial, moving compositions.",general:"Garden windows have beautiful patterns made of wood or stone. They let light through in interesting shapes and frame the garden view like a living painting.",familyTask:"Find three different window patterns. Trace one of them in the air with your finger."},{id:"kb-gd-4",title:"Path design and surprise",professional:"Paths in Jiangnan gardens are deliberately indirect. They curve, narrow, widen, climb, and descend, using the technique of 'seeming to end, then opening again' (qiao jiao hua ming). A wall may block a view only to reveal a more dramatic one around the corner. This choreography of expectation and reward is central to the garden's aesthetic.",general:"Garden paths twist and turn on purpose. Just when you think you've reached the end, a new scene opens up. It's the garden's way of telling a story.",familyTask:"Walk one path with your eyes looking down only at the stones. When you look up, notice what surprises you."},{id:"kb-gd-5",title:"Seasonal planting design",professional:"Jiangnan gardens use plants to mark the seasons — plum blossoms and magnolia in spring, lotus in summer, maple and osmanthus in autumn, pine and bamboo in winter. Each season has a 'host' plant, and the garden is designed to be experienced differently throughout the year. Flowering trees are carefully placed so their silhouettes read against white walls, like ink on paper.",general:"Gardens change with the seasons. Spring has blossoms, summer has lotus, autumn has red leaves, winter has pine and bamboo. There's always something to look at, no matter when you visit.",familyTask:"Find a tree or flower that you think represents this season. Give it a name."}],A1=[{question:"What is the most famous Jiangnan garden?",answer:"The Humble Administrator's Garden (Zhuozheng Yuan) in Suzhou is generally considered the most famous, followed by the Lingering Garden (Liu Yuan) and the Master of Nets Garden (Wangshi Yuan). All are UNESCO World Heritage sites."},{question:"How old is the Jiangnan garden tradition?",answer:"The tradition goes back over a thousand years, but many of the gardens we visit today were built or rebuilt during the Ming and Qing dynasties (roughly 16th to 19th centuries). Their design principles have been written about since at least the 12th century."},{question:"Why are the walls in gardens always white?",answer:"White walls serve as a neutral background — like the paper of a painting — against which rocks, plants, and window shadows are composed. They also reflect light into shaded corridors and create cool microclimates in summer."}],C1=[{id:"kb-cr-1",title:"Shanghai-style patterns",professional:"Haipai (Shanghai-style) patterns emerged in the 1920s and 1930s as a fusion of Jiangnan folk craft traditions with imported Art Deco and modernist visual languages. Common motifs include the cloud scroll (yunwen), the peony (mudan), the bat (fu), and geometricised versions of classical patterns rendered in new materials — celluloid, bakelite, enamel, and machine-embroidered silk.",general:"Shanghai-style patterns mix traditional Chinese motifs like clouds and flowers with modern geometric shapes. They became popular in the 1920s and 1930s when Shanghai was a very international city.",familyTask:"Find one pattern that looks old and one that looks modern. See if you can find a pattern that mixes both."},{id:"kb-cr-2",title:"Common symbolic motifs",professional:"Traditional Chinese craft motifs carry layered meanings: bats (fu) sound like 'good fortune', peonies represent prosperity, carp symbolise perseverance and success in exams, and the combined character 'shou' represents longevity. In Shanghai-style craft, these classical motifs were often simplified, geometricised, and combined with Art Deco borders, creating a hybrid visual language unique to the city.",general:"Many patterns have hidden meanings. A bat means good luck, a fish means abundance, and a peony means prosperity. Craftspeople used these symbols to send wishes through their work.",familyTask:"Look at three different patterns. Guess what each one might wish for — happiness, long life, or good luck."},{id:"kb-cr-3",title:"Materials and techniques",professional:"Shanghai heritage crafts span several disciplines: Suxiu (Suzhou-style embroidery) reached high refinement in the concessions' tailor shops; zhujian (bamboo weaving) was imported from Jiangnan and adapted for urban household items; and silver filigree, enamel inlay, and carved lacquer were produced in workshops that served both local elite and export markets. Many techniques arrived with artisans fleeing turmoil elsewhere in China.",general:"Craftspeople in Shanghai worked with silk, bamboo, silver, lacquer, and enamel. Some techniques came from nearby cities like Suzhou, while others were learned from foreign traders.",familyTask:"Try this simple craft: fold a piece of paper in half and cut a shape along the folded edge. When you open it, you'll have a symmetrical pattern — just like traditional paper-cutting."},{id:"kb-cr-4",title:"Pattern rhythm and repetition",professional:"Chinese decorative patterns use several composition types: all-over pattern (mantuowen), border pattern (bianshi), corner pattern (jiaoshi), and central medallion (tuanyan). The rhythm is established through repeat units, alternation of positive and negative space, and carefully balanced symmetry. Shanghai-style patterns introduced faster, more machine-friendly repeats while retaining symbolic content.",general:"Patterns repeat in different ways — all over the surface, just around the edges, or in one big circle in the middle. Each arrangement creates a different feeling.",familyTask:"Use five small objects to make a repeating pattern on a flat surface. Try three different arrangements."},{id:"kb-cr-5",title:"Heritage craft today",professional:"Contemporary Shanghai heritage craft practice sits between intangible cultural heritage (ICH) protection, creative industry innovation, and cultural tourism. Master artisans (chuanchengren) are officially recognised, and younger designers increasingly reinterpret traditional motifs for modern products. The challenge is maintaining material authenticity and technique rigour while adapting to contemporary taste and scale.",general:"Today, master artisans still teach traditional crafts, and young designers are finding new ways to use old patterns on modern products. It's a conversation between the past and the present.",familyTask:"Design a pattern for a modern object — a phone case, a bag, or a notebook cover — using one traditional motif you learned about."}],S1=[{question:"What does 'intangible cultural heritage' mean?",answer:"Intangible cultural heritage refers to traditions, skills, and practices passed down through generations — things like craft techniques, opera forms, festivals, and food traditions. They are called 'intangible' because they live in people's knowledge and hands, not in objects alone."},{question:"How long does it take to master a traditional craft?",answer:"Master artisans typically train for at least ten years, often starting in their teens. Many crafts require learning hundreds of techniques and developing a deep intuitive sense of materials. It's a lifetime practice."}],D1=[{id:"kb-ik-1",title:"Ink and the visual language of the East",professional:"Chinese ink painting (guohua) and calligraphy (shufa) share a common foundation in brushwork (bifa) and ink tonality (mofa). The 'four treasures of the study' — brush, ink, paper, and inkstone — are the instruments through which the artist expresses both form and feeling. A single brushstroke carries weight, rhythm, and meaning in a way that Western art historically separated between drawing and painting.",general:"Ink painting and calligraphy use the same tools — brush, ink, paper, and inkstone. What makes them special is that a single stroke shows both the shape of something and the feeling of the artist.",familyTask:"Try making three different kinds of marks with a single movement: a thin line, a thick line, and a fading line. Think of them as three different moods."},{id:"kb-ik-2",title:"The five scripts of Chinese calligraphy",professional:"Chinese calligraphy is classified into five main script types: seal script (zhuanshu), clerical script (lishu), regular script (kaishu), running script (xingshu), and cursive script (caoshu). Each evolved in a different historical period and carries a different aesthetic character — from the formal symmetry of seal script to the wild abstraction of cursive. Mastery traditionally begins with regular script before moving to freer styles.",general:"There are five main styles of Chinese writing, from very formal to very free. Think of them like different handwriting styles, but each is a whole art form with its own rules and beauty.",familyTask:"Look at examples of five different script styles. Point to which one feels most calm, most playful, and most energetic."},{id:"kb-ik-3",title:"Composition and empty space",professional:"Eastern visual composition treats empty space (liubai — 'leaving white') as an active element, not a passive background. In both painting and calligraphy, the balance between ink and white space creates rhythm, breathing room, and meaning. A single character placed on a large sheet of paper can be more powerful than a fully filled surface precisely because of what is left unsaid.",general:"In Eastern art, empty space is just as important as the ink. It gives the eye room to rest and lets the viewer's imagination fill in the rest. Less is often more.",familyTask:"Draw one simple shape — a tree, a fish, or a mountain — and leave most of the page empty. See how the empty space makes your shape feel more important."},{id:"kb-ik-4",title:"Brush technique: centre and side",professional:"The two fundamental brush techniques are centre-tip (zhongfeng) and side-tip (cefeng). Centre-tip strokes have rounded edges and consistent density, conveying strength and structure. Side-tip strokes are broader and more textured, used for foliage, rocks, and atmospheric effects. A master calligrapher or painter moves fluidly between the two within a single composition.",general:"How you hold and move the brush changes everything. Using the tip makes thin, strong lines. Tilting the brush makes broad, textured strokes. Most artworks use both.",familyTask:"Find a stick or a pencil. Try drawing with the tip straight down and with the side tilted. Notice the different marks you can make."},{id:"kb-ik-5",title:"From copying to expression",professional:"Traditional Chinese art training begins with copying (linmo) — reproducing master works with precision — as a way to internalise technique, composition, and the 'spirit' of earlier masters. Only after years of copying does the student begin to develop a personal style. This path is different from the Western emphasis on originality from the start, but it leads to deeply grounded creative expression.",general:"Learning traditional ink art starts by copying old masterpieces. It might sound like just copying, but it's how you learn the language of the art form before you say your own thing with it.",familyTask:"Copy a simple character or shape three times. Then try drawing it from memory. Notice how your version is different from the original — that's your style starting to show."}],E1=[{question:"Why do ink paintings look so simple?",answer:"What looks simple is actually very sophisticated. Ink painters spend years learning to suggest things with the fewest possible strokes. The goal is to capture the spirit or feeling of something, not just its appearance. A single well-painted bamboo leaf can express more than a photograph of an entire forest."},{question:"What is the difference between calligraphy and painting?",answer:"They share the same tools and a focus on brushwork, but calligraphy is about writing characters — each one has a standard form that the artist interprets. Ink painting is about depicting things from nature — mountains, bamboo, flowers, birds. The line between them blurs in works where calligraphy and painting appear together."}],N1=[{id:"kb-st-1",title:"Shanghai's multilingual past",professional:"Shanghai in the early 20th century was a multilingual city. French was the language of the French Concession administration, English dominated the International Settlement and business circles, Japanese was spoken in the Hongkou district, and various Chinese dialects — Shanghainese, Cantonese, Ningbonese — filled the streets. This linguistic mosaic shaped everything from shop signs to school curricula to the city's literary scene.",general:"Old Shanghai was a city of many languages. Different neighbourhoods felt like different countries, and you could hear French, English, Japanese, Russian, and many Chinese dialects on the same street.",familyTask:"Find three different languages on old shop signs or building plaques. Try to guess what each one says."},{id:"kb-st-2",title:"The French Concession story",professional:"The French Concession existed from 1849 to 1943 and grew through several expansions to cover much of what is now the former French Concession area (Xuhui and Huangpu districts). Its urban planning followed Haussmannian principles — wide tree-lined boulevards, uniform building heights, and strict zoning. The combination of French urbanism with local construction and wayfinding produced a unique urban fabric that still defines the area's character today.",general:"The French Concession was the part of old Shanghai run by the French. It had wide streets, plane trees, and European-style houses. You can still feel its atmosphere in the tree-lined lanes today.",familyTask:"Walk one tree-lined street and count how many different house styles you can see — tall, short, with balconies, with red roofs."},{id:"kb-st-3",title:"Literary Shanghai",professional:"Shanghai in the 1930s was China's literary capital. Writers like Lu Xun, Mao Dun, Eileen Chang, and Shi Zhecun defined modern Chinese literature from small apartments and lane houses. The city's magazines, publishing houses, and translation culture meant that Western and Japanese literary trends arrived quickly, often within months of their original publication. Many of these writers lived within walking distance of each other in the Hongkou and French Concession areas.",general:"Shanghai was where modern Chinese literature was born. Writers lived in small houses, published in magazines, and wrote about city life in new ways. Their favourite cafés and bookstores were often just a short walk apart.",familyTask:"Find a quiet corner of a lane or a park. Write one sentence about what you see and hear, in the style of a city story."},{id:"kb-st-4",title:"Localisation of street names",professional:"Shanghai's street names have changed with every era. In the concessions, streets had Western names (Avenue Joffre, Bubbling Well Road, Avenue Pétain). After 1949, most were renamed after Chinese cities and provinces — a systematic approach still visible today (Huaihai Road, Nanjing Road, Shaanxi Road). Some lane names and local nicknames survived, creating a palimpsest of naming layers that rewards careful observation.",general:"Shanghai's streets have had many names. Some old streets were once named after European people or places. Today they're mostly named after Chinese cities and provinces. If you look closely, you can still find clues about the past.",familyTask:"Look at three street signs. Guess which Chinese city or province each is named after. See if you can find them on a map later."},{id:"kb-st-5",title:"Cross-cultural everyday life",professional:"Everyday life in treaty-port Shanghai was a constant negotiation between cultures. People wore Western-style suits with Chinese-style shoes, celebrated both Christmas and Spring Festival, and drank coffee in cafés while reading Chinese newspapers. This hybrid culture — neither purely Chinese nor purely Western — is what makes Shanghai's urban history uniquely fascinating to visitors from both backgrounds.",general:"People in old Shanghai mixed traditions from all over the world in their daily lives. They celebrated holidays from many cultures, tried new foods, and created a way of life that was uniquely Shanghai.",familyTask:"Think of one thing from your culture and one thing from another culture. Imagine combining them into something new — a holiday, a food, or a game."}],T1=[{question:"How long did the foreign concessions last?",answer:"The International Settlement existed from 1863 to 1943, and the French Concession from 1849 to 1943. The Japanese occupied most of Shanghai from 1937 to 1945, and after 1949 all concessions were history."},{question:"What happened to all the foreign residents?",answer:"Most foreign residents left during the war years and the 1949 revolution. Their buildings, institutions, and cultural influence remained, becoming part of Shanghai's identity. Today you can still see traces of their lives in the architecture, street trees, and even some restaurant traditions."}],j1=[{id:"kb-ih-1",title:"Shanghai's industrial heritage",professional:"Shanghai's industrial heritage spans from late-Qing self-strengthening era factories (1860s–1890s) through early-modern textile and machine industries (1910s–1930s) to socialist-era state factories (1950s–1980s). Each period left a distinctive building type: the brick textile mill with sawtooth roof, the concrete riverfront warehouse, the large-span steel workshop, and the workers' housing compound (gongrenxincun). Together they form a layered industrial landscape now undergoing rapid transformation.",general:"Shanghai was once China's biggest industrial city. Factories, warehouses, and docks lined the rivers. Today many of these old buildings are being turned into offices, parks, and cultural spaces.",familyTask:"Look for clues that a building used to be a factory — tall windows, big doors, brick walls, a chimney, or a water tower nearby."},{id:"kb-ih-2",title:"Adaptive reuse strategies",professional:"Adaptive reuse of industrial buildings in Shanghai follows several recognised approaches: conservation-led (where historic fabric is largely preserved), intervention-led (where contemporary additions clearly contrast with the old), and landscape-led (where the structure is partially removed to create new outdoor space). Each approach involves different trade-offs between authenticity, functional requirements, and cost. The best projects make the building's industrial history legible while giving it a viable new use.",general:"Old factories get new lives in different ways. Sometimes designers keep the old look and just change the inside. Sometimes they add something new and modern that clearly contrasts with the old.",familyTask:"Find one old building with a new use. Draw what you think it looked like before, and what it looks like now."},{id:"kb-ih-3",title:"Industrial structure reading",professional:"Reading an industrial building means understanding its structure: bent frame (gangjia), truss (hengjia), portal frame, or reinforced concrete frame. The span, column grid, and roof type tell you what the building was used for — textiles needed diffuse north light (sawtooth roofs), warehouses needed column-free space, and heavy industry needed massive foundations. The structural logic is the building's 'spine' and the key to its repurposing potential.",general:"Factory buildings have visible bones — the columns and beams that hold them up. The shape of these bones tells you what kind of work happened inside. Big open spaces with high ceilings were for machines; smaller rooms were for offices.",familyTask:"Count how many columns you can see inside an old industrial building. Imagine how many machines once stood between them."},{id:"kb-ih-4",title:"Riverfront and docklands renewal",professional:"Shanghai's Huangpu River waterfront has undergone one of the world's largest urban waterfront transformations. Once lined with shipyards, coal terminals, and industrial plants, the 45-kilometre riverfront is being converted into continuous public space, cultural venues, and mixed-use districts. The renewal balances preservation of selected industrial structures with new construction, following a principle of 'preserving what should be preserved, renewing what should be renewed'.",general:"The Huangpu River used to be lined with factories and docks. Now it's becoming a long riverside park with museums, galleries, and places to walk. Old cranes and warehouses are kept as reminders of the past.",familyTask:"Walk a short stretch of riverfront. Find one thing that looks old and industrial and one thing that looks new and modern. Stand where you can see both at the same time."},{id:"kb-ih-5",title:"Creative districts and gentrification",professional:"Shanghai's creative districts — 50 Moganshan Road (M50), the Redtown area, 1933 Old Millfun, and newer venues along the West Bund — represent different stages and models of industrial heritage reuse. Early conversions were artist-led and informal; later ones are developer-led and commercial. The relationship between creative reuse, rent increases, and neighbourhood change is widely debated, making these important sites for understanding Shanghai's urban transformation.",general:"Old factory neighbourhoods have become some of Shanghai's most interesting places for art, design, and coffee. Artists were the first to move in because the spaces were big and cheap. Now these areas are trendy — and that's a complicated thing.",familyTask:"Visit a creative district. Find one old industrial feature and one new creative feature. Talk about whether you think they work well together."}],B1=[{question:"Why are so many old factories being turned into art districts?",answer:"Factories have the high ceilings, large open spaces, and big windows that artists and designers love. They're also usually in locations that were once on the edge of the city but are now central — perfect for new cultural uses. And preserving them keeps a piece of the city's industrial memory alive."},{question:"What was Shanghai's main industry?",answer:"Shanghai was known for textiles (cotton and silk), shipbuilding, machinery, and later electronics. In the early 20th century, textile mills employed hundreds of thousands of workers and dominated stretches of the Suzhou Creek and Huangpu River waterfronts."}],nu=[{id:"theme-art-deco",name:"Shanghai Art Deco & Modern Architecture",nameZh:"上海装饰艺术与近代建筑",tagline:"Read the city like an architect",taglineZh:"像建筑师一样阅读城市",heroImage:"",city:"Shanghai",cityZh:"上海",backgroundTags:["Tongji-related architecture & urban planning background","Architectural history","Urban renewal","English & Japanese architectural expression"],capabilities:["Façade reading","Art Deco geometric order","Urban hi
