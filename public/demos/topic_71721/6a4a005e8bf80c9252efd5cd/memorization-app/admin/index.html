<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背诵内容管理后台</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📚 背诵打卡 · 内容管理后台</div>
    <div class="topbar-right">
      <span id="apiBase"></span>
      <a href="/api/health" target="_blank" class="link">健康检查</a>
    </div>
  </header>

  <div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <nav class="menu">
        <a class="menu-item active" data-tab="list" onclick="switchTab('list')">📋 内容列表</a>
        <a class="menu-item" data-tab="add" onclick="switchTab('add')">➕ 新增内容</a>
        <a class="menu-item" data-tab="batch" onclick="switchTab('batch')">📦 批量导入</a>
        <a class="menu-item" data-tab="stats" onclick="switchTab('stats')">📊 数据统计</a>
      </nav>
    </aside>

    <!-- 主内容 -->
    <main class="main">
      <!-- 内容列表 -->
      <section id="tab-list" class="tab-content active">
        <div class="toolbar">
          <div class="filter-group">
            <label>学期</label>
            <select id="f-semester" onchange="loadList()"></select>
            <label>学科</label>
            <select id="f-subject" onchange="loadList()"></select>
            <input type="text" id="f-search" placeholder="搜索标题..." oninput="loadList()">
          </div>
          <button class="btn-primary" onclick="switchTab('add')">+ 新增</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th width="60">ID</th>
                <th width="100">学科</th>
                <th width="120">学期</th>
                <th width="120">单元</th>
                <th>标题</th>
                <th width="300">正文预览</th>
                <th width="160">操作</th>
              </tr>
            </thead>
            <tbody id="list-body">
              <tr><td colspan="7" class="empty-row">加载中...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="list-count" class="list-count"></div>
      </section>

      <!-- 新增/编辑 -->
      <section id="tab-add" class="tab-content">
        <h2 id="form-title">➕ 新增背诵内容</h2>
        <form id="content-form" onsubmit="saveContent(event)">
          <input type="hidden" id="c-id">
          <div class="form-row">
            <div class="form-item">
              <label>学科 *</label>
              <select id="c-subject" required></select>
            </div>
            <div class="form-item">
              <label>学期 *</label>
              <select id="c-semester" required></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <label>单元</label>
              <input type="text" id="c-unit" placeholder="如:第一单元 / Unit 1">
            </div>
            <div class="form-item">
              <label>标题 *</label>
              <input type="text" id="c-title" placeholder="如:静夜思" required>
            </div>
          </div>
          <div class="form-item full">
            <label>背诵正文 *</label>
            <textarea id="c-body" rows="8" placeholder="完整背诵内容,支持换行" required></textarea>
          </div>
          <div class="form-item full">
            <label>背诵提示 / 翻译</label>
            <textarea id="c-tip" rows="3" placeholder="可选,如翻译、记忆口诀、考点提示"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">保存</button>
            <button type="button" class="btn-default" onclick="resetForm()">重置</button>
          </div>
        </form>
      </section>

      <!-- 批量导入 -->
      <section id="tab-batch" class="tab-content">
        <h2>📦 批量导入内容</h2>
        <p class="hint">粘贴 JSON 数组,字段:subject_code / semester / unit / title / body / tip</p>
        <textarea id="batch-input" rows="16" placeholder='[
  {
    "subject_code": "chinese",
    "semester": "grade7_1",
    "unit": "第一单元",
    "title": "示例标题",
    "body": "正文内容...",
    "tip": "提示(可选)"
  }
]'></textarea>
        <div class="form-actions">
          <button class="btn-primary" onclick="batchImport()">导入</button>
          <button class="btn-default" onclick="document.getElementById('batch-input').value=''">清空</button>
        </div>
        <div class="example-link">
          <a href="javascript:void(0)" onclick="fillExample()">填充示例</a>
        </div>
      </section>

      <!-- 统计 -->
      <section id="tab-stats" class="tab-content">
        <h2>📊 数据统计</h2>
        <div id="stats-cards" class="stats-cards">加载中...</div>
        <h3 style="margin-top:32px">各学科内容数量</h3>
        <div id="stats-subjects"></div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
