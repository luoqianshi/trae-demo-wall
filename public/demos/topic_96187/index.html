<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 番茄专注时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 30px;
        }
        .timer-display {
            font-size: 5em;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
            font-family: "Courier New", monospace;
        }
        .timer-display.break {
            color: #ee5a24;
        }
        .controls {
            margin: 30px 0;
        }
        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
            font-weight: bold;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-pause {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }
        .btn-reset {
            background: #e9ecef;
            color: #666;
        }
        .btn-skip {
            background: #ee5a24;
            color: white;
        }
        .settings {
            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }
        .setting-row:last-child {
            border-bottom: none;
        }
        .setting-row label {
            font-size: 1.1em;
            color: #555;
        }
        .setting-row input {
            width: 80px;
            padding: 8px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            text-align: center;
        }
        .stats {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px;
        }
        .stats h3 {
            margin-bottom: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .stat-item {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .stat-item .value {
            font-size: 2em;
            font-weight: bold;
        }
        .stat-item .label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        .mode-indicator {
            font-size: 1.5em;
            padding: 10px 25px;
            background: #e9ecef;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .mode-indicator.work {
            background: #667eea;
            color: white;
        }
        .mode-indicator.break {
            background: #ee5a24;
            color: white;
        }
        .message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        .message.break {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 番茄专注时钟</h1>
        
        <div class="mode-indicator work" id="modeIndicator">⏱️ 专注时间</div>
        
        <div class="timer-display" id="timerDisplay">25:00</div>
        
        <div class="message" id="message" style="display: none;"></div>
        
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startTimer()">▶ 开始</button>
            <button class="btn-pause" id="pauseBtn" onclick="pauseTimer()" style="display: none;">⏸ 暂停</button>
            <button class="btn-reset" onclick="resetTimer()">↺ 重置</button>
            <button class="btn-skip" onclick="skipToNext()">⏭ 跳过</button>
        </div>
        
        <div class="settings">
            <h3>⚙️ 时间设置</h3>
            <div class="setting-row">
                <label>专注时长（分钟）</label>
                <input type="number" id="workTime" value="25" min="1" max="120" onchange="updateSettings()">
            </div>
            <div class="setting-row">
                <label>休息时长（分钟）</label>
                <input type="number" id="breakTime" value="5" min="1" max="60" onchange="updateSettings()">
            </div>
            <div class="setting-row">
                <label>长休息时长（分钟）</label>
                <input type="number" id="longBreakTime" value="15" min="1" max="60" onchange="updateSettings()">
            </div>
        </div>
        
        <div class="stats">
            <h3>📊 今日统计</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="value" id="completedPomodoros">0</div>
                    <div class="label">完成的番茄钟</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="totalMinutes">0</div>
                    <div class="label">总专注分钟</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="todayPomodoros">0</div>
                    <div class="label">今日完成</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="currentStreak">0</div>
                    <div class="label">当前连续</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let workTime = 25;
        let breakTime = 5;
        let longBreakTime = 15;
        let timeLeft = workTime * 60;
        let isRunning = false;
        let isWorkMode = true;
        let completedPomodoros = 0;
        let timerInterval = null;
        let currentStreak = 0;
        
        const timerDisplay = document.getElementById('timerDisplay');
        const modeIndicator = document.getElementById('modeIndicator');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const message = document.getElementById('message');
        
        loadStats();
        
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (!isWorkMode) {
                timerDisplay.classList.add('break');
            } else {
                timerDisplay.classList.remove('break');
            }
        }
        
        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-block';
            message.style.display = 'none';
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    playSound();
                    handleTimerComplete();
                }
            }, 1000);
        }
        
        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.style.display = 'inline-block';
            pauseBtn.style.display = 'none';
        }
        
        function resetTimer() {
            pauseTimer();
            timeLeft = isWorkMode ? workTime * 60 : breakTime * 60;
            updateDisplay();
            message.style.display = 'none';
        }
        
        function skipToNext() {
            pauseTimer();
            handleTimerComplete();
        }
        
        function handleTimerComplete() {
            if (isWorkMode) {
                completedPomodoros++;
                currentStreak++;
                document.getElementById('completedPomodoros').textContent = completedPomodoros;
                document.getElementById('totalMinutes').textContent = completedPomodoros * workTime;
                document.getElementById('todayPomodoros').textContent = completedPomodoros;
                document.getElementById('currentStreak').textContent = currentStreak;
                saveStats();
                
                message.textContent = '🎉 太棒了！专注完成，休息一下吧！';
                message.className = 'message success';
                message.style.display = 'block';
                
                if (completedPomodoros % 4 === 0) {
                    timeLeft = longBreakTime * 60;
                    modeIndicator.textContent = '☕ 长休息时间';
                } else {
                    timeLeft = breakTime * 60;
                    modeIndicator.textContent = '☕ 休息时间';
                }
                isWorkMode = false;
                modeIndicator.className = 'mode-indicator break';
            } else {
                message.textContent = '⏰ 休息结束！准备开始下一个番茄钟';
                message.className = 'message break';
                message.style.display = 'block';
                
                timeLeft = workTime * 60;
                modeIndicator.textContent = '⏱️ 专注时间';
                isWorkMode = true;
                modeIndicator.className = 'mode-indicator work';
            }
            updateDisplay();
        }
        
        function updateSettings() {
            workTime = parseInt(document.getElementById('workTime').value) || 25;
            breakTime = parseInt(document.getElementById('breakTime').value) || 5;
            longBreakTime = parseInt(document.getElementById('longBreakTime').value) || 15;
            
            if (!isRunning) {
                timeLeft = isWorkMode ? workTime * 60 : breakTime * 60;
                updateDisplay();
            }
        }
        
        function playSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }
        
        function saveStats() {
            const today = new Date().toDateString();
            const stats = {
                date: today,
                completedPomodoros: completedPomodoros,
                currentStreak: currentStreak
            };
            localStorage.setItem('pomodoroStats', JSON.stringify(stats));
        }
        
        function loadStats() {
            const saved = localStorage.getItem('pomodoroStats');
            if (saved) {
                const stats = JSON.parse(saved);
                const today = new Date().toDateString();
                
                if (stats.date === today) {
                    completedPomodoros = stats.completedPomodoros || 0;
                    currentStreak = stats.currentStreak || 0;
                } else {
                    completedPomodoros = 0;
                    currentStreak = 0;
                }
            }
            updateDisplay();
        }
        
        updateDisplay();
    </script>
</body>
</html>
