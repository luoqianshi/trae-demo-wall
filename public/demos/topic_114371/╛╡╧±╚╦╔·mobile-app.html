<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>镜像人生 Mirror Life</title>
<style>
/* ============ 设计系统 / CSS 变量 ============ */
:root{
  --c-primary:#FF8C69;        /* 暖珊瑚 主色 */
  --c-primary-soft:#FFB088;   /* 浅珊瑚 */
  --c-mint:#A8D8B9;           /* 薄荷绿 */
  --c-yellow:#FFD93D;         /* 暖黄 */
  --c-bg:#FFF9F5;             /* 暖白背景 */
  --c-card:#FFFFFF;           /* 卡片白 */
  --c-ink:#3D2E2A;            /* 主文字 暖棕黑 */
  --c-ink-2:#7A6A65;          /* 次要文字 */
  --c-ink-3:#B5A8A3;          /* 辅助文字 */
  --c-line:#F2E6DE;           /* 分割线 */
  --c-red:#FF6B6B;            /* 警示红 */
  --c-orange:#FF9F43;         /* 橙 */
  --c-green:#7BC97E;          /* 绿 */
  --c-blue:#7AB8E0;           /* 蓝 */
  --c-purple:#C9A9E8;         /* 紫 */
  --shadow-sm:0 2px 8px rgba(255,140,105,.08);
  --shadow-md:0 6px 20px rgba(61,46,42,.08);
  --shadow-lg:0 10px 30px rgba(61,46,42,.12);
  --radius-s:12px;
  --radius-m:16px;
  --radius-l:24px;
  --radius-xl:32px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:linear-gradient(135deg,#EFE6E0 0%,#E8DAD3 100%);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  color:var(--c-ink);
  font-size:14px;
  line-height:1.5;
  overflow:hidden;
}

/* ============ 手机框 ============ */
.phone-frame{
  width:375px;height:812px;
  background:#1a1a1a;
  border-radius:44px;
  padding:12px;
  box-shadow:0 30px 60px rgba(0,0,0,.25),0 0 0 2px #2a2a2a inset;
  position:relative;
  flex-shrink:0;
}
.phone-frame::before{
  content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
  width:120px;height:28px;background:#1a1a1a;border-radius:0 0 18px 18px;z-index:100;
}
.screen{
  width:100%;height:100%;
  background:var(--c-bg);
  border-radius:32px;
  overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
}

/* ============ 页面容器 ============ */
#page-container{
  flex:1;overflow-y:auto;overflow-x:hidden;
  position:relative;
  -webkit-overflow-scrolling:touch;
}
#page-container::-webkit-scrollbar{display:none;}
.page{
  min-height:100%;
  padding-bottom:84px;
  animation:pageIn .35s ease;
}
@keyframes pageIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
.page.no-tabbar{padding-bottom:20px;}

/* ============ 状态栏 ============ */
.statusbar{
  height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:14px;font-weight:600;color:var(--c-ink);
  flex-shrink:0;
}
.statusbar .time{font-variant-numeric:tabular-nums;}
.statusbar .icons{display:flex;gap:5px;align-items:center;font-size:12px;}

/* ============ 导航栏 ============ */
.navbar{
  height:48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;flex-shrink:0;background:var(--c-bg);
  position:sticky;top:0;z-index:20;
}
.navbar .back{font-size:22px;cursor:pointer;width:32px;color:var(--c-ink);}
.navbar .title{font-size:17px;font-weight:600;}
.navbar .right{width:32px;text-align:right;font-size:18px;cursor:pointer;}

/* ============ 通用组件 ============ */
.card{
  background:var(--c-card);border-radius:var(--radius-m);
  box-shadow:var(--shadow-sm);padding:16px;margin:0 16px 12px;
}
.card-lg{border-radius:var(--radius-l);padding:20px;}
.section{padding:0 16px;margin-bottom:16px;}
.section-title{
  font-size:15px;font-weight:700;color:var(--c-ink);
  margin:18px 16px 10px;display:flex;align-items:center;justify-content:space-between;
}
.section-title .more{font-size:12px;color:var(--c-ink-3);font-weight:400;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:var(--radius-s);padding:12px 20px;
  font-size:15px;font-weight:600;cursor:pointer;
  transition:transform .12s,box-shadow .2s;font-family:inherit;
  background:var(--c-primary);color:#fff;
}
.btn:active{transform:scale(.96);}
.btn-block{display:block;width:calc(100% - 32px);margin:16px auto;padding:15px;font-size:16px;border-radius:var(--radius-m);}
.btn-soft{background:var(--c-primary-soft);}
.btn-ghost{background:#FFF0EA;color:var(--c-primary);}
.btn-line{background:#fff;color:var(--c-ink);border:1.5px solid var(--c-line);}
.btn-sm{padding:7px 14px;font-size:13px;}
.btn-green{background:var(--c-green);}
.btn-gray{background:#EDE3DE;color:var(--c-ink-2);}

.tag{
  display:inline-flex;align-items:center;gap:3px;
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;
}
.tag-mint{background:#E8F5EC;color:#4A9D50;}
.tag-yellow{background:#FFF6D6;color:#B8951E;}
.tag-coral{background:#FFE4DA;color:#C45A3A;}
.tag-blue{background:#E3F0FA;color:#3D7FA8;}
.tag-purple{background:#F1E8FA;color:#7E5AAA;}
.tag-gray{background:#F0EBE7;color:var(--c-ink-2);}

.input,.textarea,.select{
  width:100%;border:1.5px solid var(--c-line);border-radius:var(--radius-s);
  padding:12px 14px;font-size:14px;background:#FFFBF8;color:var(--c-ink);
  font-family:inherit;outline:none;transition:border-color .2s;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--c-primary-soft);}
.textarea{min-height:90px;resize:none;line-height:1.6;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--c-ink-2);margin-bottom:6px;font-weight:500;}

/* 进度条 */
.progress{height:8px;background:#F2E6DE;border-radius:10px;overflow:hidden;}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--c-primary),var(--c-yellow));border-radius:10px;transition:width .8s ease;}

/* 环形进度 */
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.ring svg{transform:rotate(-90deg);}
.ring .ring-txt{position:absolute;font-size:22px;font-weight:700;}

/* ============ TabBar ============ */
.tabbar{
  height:64px;background:#fff;border-top:1px solid var(--c-line);
  display:flex;align-items:center;justify-content:space-around;
  flex-shrink:0;position:relative;z-index:30;
  box-shadow:0 -2px 12px rgba(0,0,0,.04);
}
.tabbar .tab{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;color:var(--c-ink-3);cursor:pointer;padding:6px 12px;
  transition:color .2s;
}
.tab .ico{font-size:22px;line-height:1;}
.tab.active{color:var(--c-primary);font-weight:600;}

/* ============ Toast ============ */
#toast{
  position:absolute;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:rgba(61,46,42,.92);color:#fff;padding:10px 22px;border-radius:24px;
  font-size:13px;z-index:200;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ 弹窗 ============ */
#mask{
  position:absolute;inset:0;background:rgba(61,46,42,.4);
  z-index:150;opacity:0;pointer-events:none;transition:opacity .25s;
  display:flex;align-items:flex-end;justify-content:center;
}
#mask.show{opacity:1;pointer-events:auto;}
.sheet{
  background:#fff;width:100%;border-radius:24px 24px 0 0;
  padding:20px 16px 30px;max-height:80%;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.84,.44,1);
}
#mask.show .sheet{transform:translateY(0);}
.sheet-handle{width:40px;height:4px;background:#E0D5CE;border-radius:4px;margin:0 auto 16px;}

/* ============ 登录页 ============ */
.login-page{
  background:linear-gradient(180deg,#FFE4DA 0%,#FFF9F5 60%);
  min-height:100%;padding:60px 32px 40px;text-align:center;
}
.logo{
  width:84px;height:84px;margin:0 auto 18px;border-radius:24px;
  background:linear-gradient(135deg,var(--c-primary),var(--c-yellow));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(255,140,105,.35);position:relative;
}
.logo::before,.logo::after{
  content:"";position:absolute;border-radius:50%;
}
.logo::before{width:30px;height:30px;background:#fff;opacity:.9;left:18px;top:18px;}
.logo::after{width:30px;height:30px;background:#FFF9F5;opacity:.9;right:18px;bottom:18px;}
.logo span{font-size:34px;position:relative;z-index:2;}
.brand{font-size:26px;font-weight:800;letter-spacing:2px;}
.brand-sub{font-size:13px;color:var(--c-ink-2);margin-top:6px;letter-spacing:1px;}
.welcome{font-size:15px;color:var(--c-ink-2);margin:30px 0 24px;line-height:1.7;}
.phone-input{display:flex;gap:10px;margin-bottom:14px;}
.phone-input .code-btn{
  flex-shrink:0;padding:0 14px;border:1.5px solid var(--c-line);
  border-radius:var(--radius-s);background:#fff;font-size:12px;color:var(--c-primary);
  font-weight:600;cursor:pointer;white-space:nowrap;
}
.phone-input .code-btn:active{background:#FFF0EA;}
.code-btn.disabled{color:var(--c-ink-3);cursor:not-allowed;}
.wx-login{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:#07C160;color:#fff;border:none;border-radius:var(--radius-s);
  padding:13px;font-size:15px;font-weight:600;width:calc(100% - 32px);margin:12px auto 0;cursor:pointer;
}
.wx-login:active{opacity:.9;}
.login-tip{font-size:12px;color:var(--c-ink-3);margin-top:18px;line-height:1.6;}
.or-line{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--c-ink-3);font-size:12px;}
.or-line::before,.or-line::after{content:"";flex:1;height:1px;background:var(--c-line);}

/* ============ 角色创建 ============ */
.create-page{padding:0 0 30px;}
.avatar-picker{display:flex;gap:12px;overflow-x:auto;padding:16px;}
.avatar-picker::-webkit-scrollbar{display:none;}
.avatar-opt{
  flex-shrink:0;width:64px;height:64px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  cursor:pointer;border:3px solid transparent;transition:border-color .2s;
}
.avatar-opt.sel{border-color:var(--c-primary);}
.form-box{padding:0 16px;}
.gender-pick{display:flex;gap:10px;}
.gender-pick .g{
  flex:1;padding:11px;border:1.5px solid var(--c-line);border-radius:var(--radius-s);
  text-align:center;cursor:pointer;font-size:14px;background:#FFFBF8;
}
.gender-pick .g.sel{border-color:var(--c-primary);background:#FFF0EA;color:var(--c-primary);font-weight:600;}

/* ============ 首页 ============ */
.home-hero{
  background:linear-gradient(135deg,var(--c-primary) 0%,var(--c-primary-soft) 100%);
  padding:20px 20px 26px;color:#fff;border-radius:0 0 28px 28px;
  position:relative;overflow:hidden;
}
.home-hero::after{
  content:"";position:absolute;right:-30px;top:-30px;
  width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);
}
.home-hero::before{
  content:"";position:absolute;right:30px;bottom:-40px;
  width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.08);
}
.greet-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;}
.greet-row .hi{font-size:20px;font-weight:700;}
.greet-row .date{font-size:12px;opacity:.9;margin-top:3px;}
.greet-row .weather{font-size:14px;text-align:right;}
.greet-row .weather .t{font-size:20px;font-weight:700;}
.lvl-card{
  background:rgba(255,255,255,.22);backdrop-filter:blur(8px);
  border-radius:var(--radius-m);padding:14px;margin-top:16px;position:relative;z-index:2;
}
.lvl-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.lvl-card .lv-badge{
  background:#fff;color:var(--c-primary);padding:3px 12px;border-radius:20px;
  font-size:13px;font-weight:700;
}
.lvl-card .xp-txt{font-size:12px;}
.lvl-card .progress{background:rgba(255,255,255,.35);height:10px;}
.lvl-card .progress > i{background:#fff;}
.lvl-card .next{font-size:11px;margin-top:6px;opacity:.9;}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 0;padding:18px 8px 6px;}
.quick-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px 0;}
.quick-item .qi-ico{
  width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:24px;box-shadow:var(--shadow-sm);transition:transform .15s;
}
.quick-item:active .qi-ico{transform:scale(.9);}
.quick-item .qi-txt{font-size:11px;color:var(--c-ink-2);}

.todo-card .todo-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--c-line);}
.todo-card .todo-item:last-child{border-bottom:none;}
.todo-card .ti-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.todo-card .ti-txt{flex:1;}
.todo-card .ti-t{font-size:13px;font-weight:600;}
.todo-card .ti-s{font-size:11px;color:var(--c-ink-3);}
.todo-card .ti-btn{font-size:11px;background:var(--c-primary);color:#fff;padding:5px 12px;border-radius:14px;cursor:pointer;}

/* 时间线 */
.timeline{position:relative;padding-left:8px;}
.tl-item{display:flex;gap:12px;padding:0 0 16px;position:relative;}
.tl-item::before{
  content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--c-line);
}
.tl-item:last-child::before{display:none;}
.tl-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;z-index:1;border:3px solid #fff;box-shadow:var(--shadow-sm);}
.tl-body{flex:1;background:var(--c-card);border-radius:var(--radius-s);padding:10px 12px;box-shadow:var(--shadow-sm);}
.tl-time{font-size:11px;color:var(--c-ink-3);}
.tl-content{font-size:13px;margin:3px 0;}

/* ============ 事件录入 ============ */
.event-create .ai-box{
  background:linear-gradient(135deg,#FFF6E8,#FFE4DA);
  border-radius:var(--radius-m);padding:14px;margin:0 16px 14px;
}
.ai-result{background:#fff;border-radius:var(--radius-s);padding:12px;margin-top:10px;display:none;}
.ai-result.show{display:block;animation:pageIn .3s;}
.ai-result .ar-row{display:flex;gap:8px;margin-bottom:6px;font-size:12px;}
.ai-result .ar-row span{color:var(--c-ink-3);width:60px;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:6px 12px;border-radius:18px;font-size:12px;border:1.5px solid var(--c-line);
  background:#fff;cursor:pointer;transition:all .15s;
}
.chip.sel{border-color:var(--c-primary);background:#FFF0EA;color:var(--c-primary);font-weight:600;}
.star-row{display:flex;gap:4px;font-size:22px;cursor:pointer;}
.star-row .s{color:#E0D5CE;}
.star-row .s.on{color:var(--c-yellow);}

/* ============ 事件列表 ============ */
.event-banner{
  margin:12px 16px;background:linear-gradient(135deg,#FFF6D6,#FFE4DA);
  border-radius:var(--radius-s);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;
}
.event-banner .b-ico{font-size:22px;}
.event-banner .b-txt{flex:1;font-size:13px;color:var(--c-ink);}
.event-banner .b-arrow{color:var(--c-ink-3);}
.filter-bar{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-bar .f{
  padding:6px 14px;border-radius:18px;font-size:12px;background:#fff;border:1px solid var(--c-line);
  white-space:nowrap;cursor:pointer;color:var(--c-ink-2);
}
.filter-bar .f.sel{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.date-group{padding:0 16px;}
.date-group .dg-title{font-size:12px;color:var(--c-ink-3);margin:14px 0 8px;font-weight:600;}
.event-card{background:#fff;border-radius:var(--radius-m);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s;}
.event-card:active{transform:scale(.98);}
.event-card .ec-top{display:flex;gap:12px;}
.event-card .ec-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.event-card .ec-main{flex:1;}
.event-card .ec-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.event-card .ec-meta{font-size:11px;color:var(--c-ink-3);display:flex;gap:8px;align-items:center;}
.event-card .ec-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.event-card .ec-avatars{display:flex;}
.event-card .ec-avatars .av{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-6px;font-size:10px;display:flex;align-items:center;justify-content:center;}
.event-card .ec-avatars .av:first-child{margin-left:0;}
.fab{
  position:absolute;right:18px;bottom:92px;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--c-primary),var(--c-primary-soft));
  display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;
  box-shadow:0 8px 20px rgba(255,140,105,.4);cursor:pointer;z-index:25;border:none;
}
.fab:active{transform:scale(.92);}

/* ============ 角色草案 ============ */
.draft-card{background:#fff;border-radius:var(--radius-m);padding:16px;margin:0 16px 12px;box-shadow:var(--shadow-sm);}
.draft-card .dc-head{display:flex;align-items:center;gap:12px;}
.draft-card .dc-av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;}
.draft-card .dc-info{flex:1;}
.draft-card .dc-name{font-size:15px;font-weight:700;}
.draft-card .dc-rel{font-size:12px;color:var(--c-ink-2);}
.draft-card .dc-conf{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--c-ink-3);}
.conf-bar{width:60px;height:5px;background:#F2E6DE;border-radius:5px;overflow:hidden;}
.conf-bar > i{display:block;height:100%;background:var(--c-green);border-radius:5px;}
.draft-card .dc-src{font-size:11px;color:var(--c-ink-3);background:#FAF4F0;border-radius:8px;padding:8px 10px;margin:10px 0;}
.draft-card .dc-actions{display:flex;gap:10px;margin-top:8px;}
.draft-card .dc-actions button{flex:1;}

/* ============ 政策列表 ============ */
.policy-card{background:#fff;border-radius:var(--radius-m);padding:14px;margin:0 16px 10px;box-shadow:var(--shadow-sm);cursor:pointer;}
.policy-card:active{transform:scale(.98);}
.policy-card .pc-tags{display:flex;gap:6px;margin-bottom:8px;}
.policy-card .pc-title{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:6px;}
.policy-card .pc-summary{font-size:12px;color:var(--c-ink-2);line-height:1.6;margin-bottom:8px;}
.policy-card .pc-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--c-ink-3);}
.urgent-dot{display:inline-flex;align-items:center;gap:3px;color:var(--c-red);font-weight:600;}

/* ============ 政策详情 ============ */
.policy-detail{padding:0 0 20px;}
.policy-detail .pd-head{padding:16px;background:#fff;border-radius:0 0 24px 24px;box-shadow:var(--shadow-sm);}
.policy-detail .pd-title{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:8px;}
.policy-detail .pd-meta{font-size:12px;color:var(--c-ink-3);display:flex;gap:10px;flex-wrap:wrap;}
.policy-detail .pd-body{padding:16px;font-size:14px;line-height:1.8;color:var(--c-ink);}
.impact-card{background:linear-gradient(135deg,#FFF6E8,#FFE4DA);border-radius:var(--radius-l);padding:18px;margin:0 16px;}
.impact-card .ic-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.impact-dims{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.impact-dims .d{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600;background:#fff;}

}
.graph-canvas .ring-circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px dashed #F2D8CC;border-radius:50%;}

.graph-canvas .ring-2{width:230px;height:230px;}
.graph-canvas .ring-3{width:330px;height:330px;border-color:#F0E8E0;}
.graph-node{
  position:absolute;width:54px;text-align:center;cursor:pointer;
  transition:transform .2s;z-index:2;
}
.graph-node:active{transform:scale(1.15);}
.graph-node .gn-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 3px;border:3px solid #fff;box-shadow:var(--shadow-md);}
.graph-node .gn-name{font-size:10px;font-weight:600;}
.graph-node .gn-rel{font-size:9px;color:var(--c-ink-3);}
.graph-node.main .gn-av{width:58px;height:58px;font-size:26px;}
.node-line{position:absolute;left:50%;top:50%;height:2px;transform-origin:left center;z-index:1;}

/* ============ 关系详情 ============ */
.rel-detail .rd-head{display:flex;align-items:center;gap:14px;padding:20px 16px;background:linear-gradient(135deg,#FFE4DA,#FFF9F5);border-radius:0 0 24px 24px;}
.rel-detail .rd-av{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;border:3px solid #fff;box-shadow:var(--shadow-md);}
.rel-detail .rd-name{font-size:18px;font-weight:700;}
.rel-detail .rd-rel{font-size:13px;color:var(--c-ink-2);}
.score-row{display:flex;justify-content:space-around;margin:8px 0;}
.score-row .sc{text-align:center;}
.score-row .sc .v{font-size:16px;font-weight:700;}
.score-row .sc .l{font-size:10px;color:var(--c-ink-3);}
.slider-box{padding:12px 0;}
.slider-box input[type=range]{width:100%;accent-color:var(--c-primary);}

/* ============ 健康守护 ============ */
.tab-switch{display:flex;background:#F2E6DE;border-radius:14px;padding:4px;margin:0 16px 14px;}
.tab-switch .ts{flex:1;text-align:center;padding:9px;font-size:13px;border-radius:10px;cursor:pointer;color:var(--c-ink-2);font-weight:500;transition:all .2s;}
.tab-switch .ts.sel{background:#fff;color:var(--c-primary);font-weight:700;box-shadow:var(--shadow-sm);}
.health-data-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.health-data-grid .hd{background:#FFFBF8;border-radius:var(--radius-s);padding:12px;text-align:center;}
.health-data-grid .hd .v{font-size:18px;font-weight:700;color:var(--c-ink);}
.health-data-grid .hd .u{font-size:10px;color:var(--c-ink-3);}
.health-data-grid .hd .l{font-size:11px;color:var(--c-ink-2);margin-top:3px;}
.chart-box{background:#fff;border-radius:var(--radius-m);padding:14px;margin:0 16px 12px;box-shadow:var(--shadow-sm);}
.chart-svg{width:100%;height:120px;}

/* ============ 测评 ============ */

.assess-opt{padding:12px;border:1.5px solid var(--c-line);border-radius:var(--radius-s);margin-bottom:10px;cursor:pointer;font-size:13px;transition:all .15s;}
.assess-opt.sel{border-color:var(--c-primary);background:#FFF0EA;color:var(--c-primary);font-weight:600;}
.assess-opt:active{transform:scale(.98);}
.result-box{text-align:center;padding:30px 16px;}
.result-box .score{font-size:56px;font-weight:800;color:var(--c-primary);line-height:1;}
.result-box .level{font-size:18px;font-weight:700;margin:8px 0;}
.hotline{background:#FFEAEA;color:var(--c-red);border-radius:var(--radius-s);padding:14px;margin:16px;text-align:center;font-size:14px;font-weight:600;}

.map-area{height:200px;background:linear-gradient(135deg,#E8F0E8,#D5E8D5);border-radius:0 0 24px 24px;position:relative;overflow:hidden;}
.map-area::before{content:"";position:absolute;width:80%;height:2px;background:#C8E0C8;top:40%;left:10%;transform:rotate(-8deg);}
.map-area::after{content:"";position:absolute;width:2px;height:70%;background:#C8E0C8;left:55%;top:15%;transform:rotate(12deg);}
.map-pin{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;}
.map-pin .p{font-size:24px;}
.map-pin .n{font-size:10px;background:#fff;padding:2px 6px;border-radius:8px;box-shadow:var(--shadow-sm);}

.place-list .pl .info{flex:1;}
.place-list .pl .n{font-size:14px;font-weight:600;}
.place-list .pl .m{font-size:11px;color:var(--c-ink-3);}
.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px;}

.city-card .ci{font-size:26px;}
.city-card .cn{font-size:12px;font-weight:600;margin-top:4px;}
.city-card .cl{font-size:10px;margin-top:2px;}

.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px;}
.badge-grid .bg{text-align:center;}
.badge-grid .bg .bi{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 4px;}
.badge-grid .bg.locked .bi{background:#F0EBE7;filter:grayscale(1);opacity:.5;}
.badge-grid .bg .bt{font-size:10px;color:var(--c-ink-2);}

.report-card .rc-arrow{color:var(--c-ink-3);}

.yearly-card .yc-h{font-size:22px;font-weight:700;margin:6px 0;}
.yearly-card .yc-s{font-size:12px;opacity:.7;}

/* ============ 工具函数 ============ */
function $(s){return document.querySelector(s);}
function el(html){var d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1800);}
function showSheet(html,onMount){
  $('#sheet').innerHTML=html;
  $('#mask').classList.add('show');
  if(onMount) onMount($('#sheet'));
}
function hideSheet(){$('#mask').classList.remove('show');}
$('#mask').addEventListener('click',function(e){if(e.target===this)hideSheet();});

/* ============ 路由系统 ============ */
var routes={};
function route(path,fn){routes[path]=fn;}
function navigate(path){
  // E-3：离开测评页面时重置 assessState
  if(currentRoute()==='/health/assessment' && path!=='/health/assessment'){
    assessState.type='PHQ-9';assessState.qIdx=0;assessState.answers=[];assessState.done=false;
  }
  location.hash='#'+path;
}
function currentRoute(){
  var h=location.hash.replace(/^#/,'')||'/home';
  // 处理动态路由：/event/:id /policy/:id /relation/:id
  if(/^\/event\/\d+$/.test(h)) return '/event/detail';
  if(/^\/policy\/\d+$/.test(h)) return '/policy/detail';
  if(/^\/relation\/\d+$/.test(h)) return '/relation/detail';
  return h;
}
window.addEventListener('hashchange',render);

var tabRoutes=['/home','/event/list','/health','/profile'];
function updateTabbar(){
  var cur=currentRoute();
  var tabs=document.querySelectorAll('.tabbar .tab');
  tabs.forEach(function(t){
    var r=t.dataset.route;
    t.classList.toggle('active', cur===r);
  });
  // TabBar 显示控制
  $('#tabbar').style.display = tabRoutes.indexOf(cur)>=0 ? 'flex':'none';
  // FAB 仅在事件列表显示
  $('#fab').style.display = cur==='/event/list' ? 'flex':'none';
}

function render(){
  var path=currentRoute();
  var fn=routes[path]||routes['/home'];
  var html=fn();
  $('#page-container').innerHTML=html;
  updateTabbar();
  $('#page-container').scrollTop=0;
  // 执行页面挂载逻辑
  if(afterRender[path]) afterRender[path]();
}

afterRender['/event/create']=function(){
  selectedMoods=[];selectedChars=[];starLevel=3;aiParsed=false;
  $('#ai-parse').onclick=function(){
    var v=$('#ai-input').value.trim();
    if(!v){toast('请先输入内容');return;}
    $('#ai-result').classList.add('show');
    toast('AI 解析完成');
    aiParsed=true;
  };
  // P1-7：语音按钮
  $('#voice-btn').onclick=function(){toast('语音录入功能演示');};
  // P1-7：快捷模板填充
  $('#tpl-chips').addEventListener('click',function(e){
    var t=e.target.closest('.chip');if(!t)return;
    $('#ai-input').value=t.dataset.tpl;
    toast('已填充模板');
  });
  // E-2：接入 selectedMoods 选中状态
  $('#mood-chips').addEventListener('click',function(e){
    var t=e.target.closest('.chip');if(!t)return;
    var m=t.dataset.mood;
    var idx=selectedMoods.indexOf(m);
    if(idx>=0){selectedMoods.splice(idx,1);t.classList.remove('sel');}
    else{selectedMoods.push(m);t.classList.add('sel');}
  });
  // E-2：接入 selectedChars 选中状态
  $('#char-chips').addEventListener('click',function(e){
    var t=e.target.closest('.chip');if(!t)return;
    if(t.id==='add-char'){showSheet('<div class="sheet-handle"></div><h3 style="margin-bottom:14px;">新增角色</h3><div class="field"><label>昵称</label><input class="input" placeholder="角色昵称"></div><div class="field"><label>关系</label><select class="select"><option>朋友</option><option>同事</option><option>家人</option><option>导师</option><option>其他</option></select></div><button class="btn btn-block" onclick="hideSheet();toast(\'已添加角色\');">添加</button>');return;}
    var cid=parseInt(t.dataset.cid);
    var idx=selectedChars.indexOf(cid);
    if(idx>=0){selectedChars.splice(idx,1);t.classList.remove('sel');}
    else{selectedChars.push(cid);t.classList.add('sel');}
  });
  $('#star-row').addEventListener('click',function(e){
    var t=e.target.closest('.s');if(!t)return;
    starLevel=parseInt(t.dataset.i);
    $('#star-row').querySelectorAll('.s').forEach(function(s,i){s.classList.toggle('on',i<starLevel);});
  });
  $('#attach-btn').onclick=function(){toast('附件功能开发中');};
  // E-2：保存时使用 selectedMoods/selectedChars/aiParsed
  $('#save-btn').onclick=function(){
    var summary=[];
    if(aiParsed)summary.push('AI解析');
    if(selectedMoods.length)summary.push(selectedMoods.length+'个情绪');
    if(selectedChars.length)summary.push(selectedChars.length+'个角色');
    toast('✅ 事件已保存'+(summary.length?'（'+summary.join('·')+'）':''));
    setTimeout(function(){navigate('/event/list');},800);
  };
};

var assessState={type:'PHQ-9',qIdx:0,answers:[],done:false};
route('/health/assessment',function(){
  var qs=assessState.type==='PHQ-9'?[
    '做事时提不起劲或没有兴趣',
    '感到心情低落、沮丧或绝望',
    '入睡困难、睡不安稳或睡眠过多',
    '感觉疲倦或没有活力',
    '食欲不振或吃太多',
    '觉得自己很糟糕，或觉得自己很失败，或让自己/家人失望',
    '对事物专注有困难，例如阅读报纸或看电视',
    '动作或说话速度缓慢到他人已察觉，或正好相反——烦躁或坐立不安',
    '有不如死掉或用某种方式伤害自己的念头'
  ]:[
    '感觉紧张、焦虑或急躁',
    '不能够停止或控制担忧',
    '对各种各样的事情担忧过多',
    '很难放松下来',
    '坐立不安，难以安静',
    '容易心烦意乱',
    '感到害怕，就像要发生可怕的事情'
  ];
  var opts=['完全没有','有几天','超过一周','几乎每天'];
  if(assessState.done){
    var total=assessState.answers.reduce(function(a,b){return a+b;},0);
    // P0-4：GAD-7 与 PHQ-9 分级标准不同
    var level, col, showHotline, advice;
    if(assessState.type==='GAD-7'){
      level=total<=4?'极小':(total<=9?'轻度':(total<=14?'中度':'重度'));
      col=total<=4?'var(--c-green)':(total<=9?'var(--c-yellow)':(total<=14?'var(--c-orange)':'var(--c-red)'));
      showHotline=total>=10;
      advice=total<=4?'你的焦虑水平很低，请继续保持放松的心态。':
        total<=9?'你有轻微的焦虑感，建议通过运动、深呼吸等方式舒缓。':
        total<=14?'你可能有中度焦虑，建议寻求亲友支持，必要时咨询专业人士。':
        '你的焦虑程度需要重视，强烈建议尽快寻求专业心理帮助。';
    }else{
      level=total<=4?'正常':(total<=9?'轻度':(total<=14?'中度':(total<=19?'中重度':'重度')));
      col=total<=4?'var(--c-green)':(total<=9?'var(--c-yellow)':(total<=14?'var(--c-orange)':'var(--c-red)'));
      showHotline=total>=10;
      advice=total<=4?'你的心理状态良好，请继续保持健康的生活方式。':
        total<=9?'你目前有轻微的情绪困扰，建议关注自我情绪，适当放松，保持规律作息。':
        total<=14?'你可能有中度情绪困扰，建议寻求亲友支持，必要时咨询专业人士。':
        '你的情绪状态需要重视，强烈建议尽快寻求专业心理帮助。';
    }
    return '<div class="page no-tabbar">'+
      '<div class="navbar"><span class="back" onclick="assessState.done=false;navigate(\'/health\')">‹</span><span class="title">测评结果</span><span class="right"></span></div>'+
      '<div class="result-box">'+
        '<div style="font-size:13px;color:var(--c-ink-2);margin-bottom:6px;">'+assessState.type+' 总分</div>'+
        '<div class="score" style="color:'+col+';">'+total+'</div>'+
        '<div class="level" style="color:'+col+';">'+level+'</div>'+
        '<div style="font-size:13px;color:var(--c-ink-2);max-width:280px;margin:0 auto;line-height:1.7;">'+advice+'</div>'+
      '</div>'+
      (showHotline?'<div class="hotline">☎️ 心理援助热线：12320-5<br><span style="font-size:11px;font-weight:400;">全国 24 小时免费心理危机干预热线</span></div>':'')+
      '<div class="card" style="font-size:11px;color:var(--c-ink-3);line-height:1.7;">⚠️ 本测评仅供自我参考，不能替代专业医疗诊断。如有需要，请及时前往正规医疗机构就诊。</div>'+
      '<button class="btn btn-block" onclick="assessState.done=false;assessState.qIdx=0;assessState.answers=[];navigate(\'/health\')">完成</button>'+
    '</div>';
  }
  var q=qs[assessState.qIdx];
  var prog=(assessState.qIdx+1)/qs.length*100;
  var oHtml=opts.map(function(o,i){
    return '<div class="assess-opt" data-i="'+i+'">'+o+'<span style="float:right;color:var(--c-ink-3);font-size:11px;">'+i+'分</span></div>';
  }).join('');
  return '<div class="page no-tabbar">'+
    '<div class="navbar"><span class="back" onclick="navigate(\'/health\')">‹</span><span class="title">'+assessState.type+'</span><span class="right">'+(assessState.qIdx+1)+'/'+qs.length+'</span></div>'+
    '<div class="assess-prog"><div class="progress"><i style="width:'+prog+'%"></i></div></div>'+
    '<div class="assess-q">'+
      '<div class="q-txt">Q'+(assessState.qIdx+1)+'. '+q+'</div>'+
      '<div style="font-size:12px;color:var(--c-ink-3);margin-bottom:10px;">过去两周内，你有多少时间受到以下问题困扰？</div>'+
      oHtml+
    '</div>'+
    '<button class="btn btn-block" id="next-q" style="opacity:.5;">'+(assessState.qIdx<qs.length-1?'下一题':'查看结果')+'</button>'+
  '</div>';
});
afterRender['/health/assessment']=function(){
  if(assessState.done)return;
  var sel=-1;
  document.querySelectorAll('.assess-opt').forEach(function(o){
    o.onclick=function(){
      document.querySelectorAll('.assess-opt').forEach(function(x){x.classList.remove('sel');});
      o.classList.add('sel');
      sel=parseInt(o.dataset.i);
      $('#next-q').style.opacity='1';
    };
  });
  $('#next-q').onclick=function(){
    if(sel<0){toast('请选择一项');return;}
    assessState.answers.push(sel);
    var qs=assessState.type==='PHQ-9'?9:7;
    if(assessState.qIdx<qs-1){assessState.qIdx++;render();}
    else{assessState.done=true;render();}
  };
};

afterRender['/character/sub/create']=function(){
  subCharState.interests=subCharState.interests||[];
  $('#type-chips').addEventListener('click',function(e){
    var t=e.target.closest('.chip');if(!t)return;
    $('#type-chips').querySelectorAll('.chip').forEach(function(x){x.classList.remove('sel');});
    t.classList.add('sel');subCharState.type=t.dataset.type;
  });
  $('#circle-chips').addEventListener('click',function(e){
    var t=e.target.closest('.chip');if(!t)return;
    $('#circle-chips').querySelectorAll('.chip').forEach(function(x){x.classList.remove('sel');});
    t.classList.add('sel');subCharState.circle=t.dataset.circle;
  });
  $('#sc-gender').addEventListener('click',function(e){
    var t=e.target.closest('.g');if(!t)return;
    $('#sc-gender').querySelectorAll('.g').forEach(function(x){x.classList.remove('sel');});
    t.classList.add('sel');subCharState.gender=t.dataset.v;
  });
  function addInt(){
    var v=$('#int-input').value.trim();if(!v)return;
    subCharState.interests.push(v);$('#int-input').value='';render();
  }
  $('#int-add').onclick=addInt;
  $('#int-input').onkeydown=function(e){if(e.key==='Enter'){addInt();}};
  var intTags=$('#int-tags');
  if(intTags) intTags.addEventListener('click',function(e){
    var t=e.target.closest('[data-int]');if(!t)return;
    subCharState.interests.splice(parseInt(t.dataset.int),1);render();
  });
  $('#sc-save').onclick=function(){
    var name=$('#sc-name').value.trim();
    if(!name){toast('请输入昵称');return;}
    var rel=$('#sc-rel').value;
    var birth=$('#sc-birth').value;
    var note=$('#sc-note').value.trim();
    var circMap={'内圈':'inner','中圈':'middle','外圈':'outer'};
    var newId=DATA.subCharacters.length?Math.max.apply(null,DATA.subCharacters.map(function(c){return c.id;}))+1:101;
    DATA.subCharacters.push({
      id:newId,name:name,rel:rel,type:subCharState.type,
      circle:circMap[subCharState.circle]||'outer',
      avatar:subCharState.gender==='男'?'👨':'👩',color:'#7AB8E0',
      gender:subCharState.gender,birth:birth,note:note,
      interests:subCharState.interests.slice()
    });

var subState={cats:['住房','就业','医疗'],cities:['上海'],freq:'每日'};

  var cityHtml=subState.cities.map(function(c){return '<span class="tag tag-blue">'+c+'</span>';}).join(' ');
  var freqs=['每日','每周','即时'];

    '<div class="section-title">推送频率</div>'+
    '<div class="section"><div class="chip-row" id="sub-freq">'+freqHtml+'</div></div>'+

afterRender['/policy/subscription']=function(){
  $('#sub-cats').addEventListener('click',function(e){
    var t=e.target.closest('.chip');if(!t)return;
    var c=t.dataset.cat;
    var idx=subState.cats.indexOf(c);
    if(idx>=0){subState.cats.splice(idx,1);t.classList.remove('sel');}
    else{subState.cats.push(c);t.classList.add('sel');}
  });
  $('#add-city').onclick=function(){toast('当前城市：上海，更多城市敬请期待');};
  $('#sub-freq').addEventListener('click',function(e){
    var t=e.target.closest('.chip');if(!t)return;
    $('#sub-freq').querySelectorAll('.chip').forEach(function(x){x.classList.remove('sel');});
    t.classList.add('sel');subState.freq=t.dataset.freq;
  });
  $('#save-sub').onclick=function(){toast('订阅设置已保存');setTimeout(function(){history.back();},800);};
};

/* ============ 初始化 ============ */
function updateStatusBarTime(){
  var now=new Date();
  $('#sb-time').textContent=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
}
function init(){
  // 状态栏时间
  updateStatusBarTime();
  // E-6：每60秒刷新状态栏时间
  setInterval(updateStatusBarTime,60000);
  // 绑定 TabBar 点击事件（全局委托，避免重复绑定）
  document.querySelectorAll('.tabbar .tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      var r=tab.dataset.route;
      if(r){ navigate(r); }
    });
  });
  // 默认路由
  if(!location.hash)location.hash='#/login';
  render();
}
init();
</script>
