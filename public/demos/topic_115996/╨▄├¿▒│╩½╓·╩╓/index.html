<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背诗大王 - 熊猫花花陪你背诗词</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-slate: #334155;
            --secondary-slate: #475569;
            --light-slate: #f1f5f9;
            --accent-purple: #8b5cf6;
            --accent-purple-light: #e9d5ff;
            --success-green: #10b981;
            --error-red: #ef4444;
            --panda-black: #1e293b;
            --panda-white: #ffffff;
            --panda-gray: #94a3b8;
        }

        body {
            font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: var(--primary-slate);
            letter-spacing: 0.5px;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .panda-logo {
            width: 60px;
            height: 60px;
            transition: transform 0.3s ease;
        }

        .panda-logo:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-slate), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--secondary-slate);
            margin-top: 0.5rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .main-content {
                grid-template-columns: 300px 1fr;
            }
        }

        .card {
            background: var(--panda-white);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--secondary-slate);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--light-slate);
        }

        .card-title svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-purple);
        }

        .poem-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .poem-item {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            background: var(--light-slate);
            border: 1px solid transparent;
        }

        .poem-item:hover {
            background: var(--accent-purple-light);
            border-color: var(--accent-purple);
            transform: translateX(4px);
        }

        .poem-item.active {
            background: var(--accent-purple);
            color: var(--panda-white);
            border-color: var(--accent-purple);
        }

        .poem-item .title {
            font-weight: 600;
        }

        .poem-item .author {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 0.25rem;
        }

        .reciting-area {
            min-height: 400px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .reciting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .current-poem-info {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-slate);
        }

        .current-poem-info .author {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--panda-gray);
            margin-left: 0.5rem;
        }

        .recognition-preview {
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--light-slate);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--success-green));
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .reciting-display {
            flex: 1;
            overflow-y: auto;
            padding-right: 0.5rem;
            max-height: 400px;
        }

        .reciting-paragraph {
            font-size: 1.1rem;
            line-height: 2;
            letter-spacing: 1px;
            padding: 1rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .char-placeholder {
            display: inline-block;
            width: 24px;
            height: 24px;
            text-align: center;
            line-height: 24px;
            margin: 0 2px;
            font-size: 0.9rem;
            color: var(--panda-gray);
            vertical-align: middle;
        }

        .char-display {
            display: inline-block;
            width: 28px;
            height: 28px;
            text-align: center;
            line-height: 28px;
            margin: 0 3px;
            font-size: 1rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            vertical-align: middle;
        }

        .char-correct {
            color: var(--success-green);
            font-weight: 600;
            animation: pulse-green 0.5s ease;
        }

        .char-wrong {
            color: var(--error-red);
            font-weight: 600;
            animation: pulse-red 0.5s ease;
        }

        .ellipsis {
            color: var(--panda-gray);
            margin: 0 4px;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes pulse-red {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .next-line-preview {
            font-size: 0.9rem;
            color: var(--panda-gray);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--light-slate);
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--light-slate);
            color: var(--secondary-slate);
        }

        .btn-secondary:hover {
            background: var(--panda-gray);
            color: white;
        }

        .btn-danger {
            background: var(--error-red);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--panda-gray);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--panda-gray);
            transition: background 0.3s ease;
        }

        .status-dot.listening {
            background: var(--success-green);
            animation: blink 1s ease-in-out infinite;
        }

        .status-dot.ready {
            background: var(--accent-purple);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .upload-section {
            margin-top: 1.5rem;
        }

        .upload-area {
            border: 2px dashed var(--panda-gray);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--light-slate);
        }

        .upload-area:hover {
            border-color: var(--accent-purple);
            background: var(--accent-purple-light);
        }

        .upload-area.dragover {
            border-color: var(--accent-purple);
            background: var(--accent-purple-light);
            transform: scale(1.02);
        }

        .upload-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 1rem;
            fill: var(--panda-gray);
        }

        .upload-area:hover .upload-icon,
        .upload-area.dragover .upload-icon {
            fill: var(--accent-purple);
        }

        .upload-text {
            font-size: 0.9rem;
            color: var(--secondary-slate);
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            font-size: 0.75rem;
            color: var(--panda-gray);
        }

        #file-input {
            display: none;
        }

        .text-input-area {
            margin-top: 1rem;
            display: none;
        }

        .text-input-area textarea {
            width: 100%;
            height: 120px;
            padding: 1rem;
            border: 1px solid var(--light-slate);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--primary-slate);
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .text-input-area textarea:focus {
            border-color: var(--accent-purple);
        }

        .custom-poem-list {
            margin-top: 1rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .custom-poem-item {
            padding: 0.5rem;
            background: var(--light-slate);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .custom-poem-item .delete-btn {
            background: none;
            border: none;
            color: var(--error-red);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
        }

        .custom-poem-item .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--light-slate);
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-purple);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--panda-gray);
            margin-top: 0.25rem;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--light-slate);
            font-size: 0.8rem;
            color: var(--panda-gray);
        }

        .footer .panda-icon {
            width: 24px;
            height: 24px;
            vertical-align: middle;
            margin-right: 0.25rem;
        }

        .scroll-top-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-purple);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .scroll-top-btn.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-top-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .scroll-top-btn svg {
            width: 20px;
            height: 20px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--light-slate);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--panda-gray);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-slate);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-wrapper">
                <svg class="panda-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="50" cy="55" rx="38" ry="40" fill="#fff"/>
                    <circle cx="25" cy="30" r="10" fill="#1e293b"/>
                    <circle cx="75" cy="30" r="10" fill="#1e293b"/>
                    <circle cx="25" cy="30" r="4" fill="#fff"/>
                    <circle cx="75" cy="30" r="4" fill="#fff"/>
                    <ellipse cx="30" cy="52" rx="18" ry="16" fill="#1e293b"/>
                    <ellipse cx="70" cy="52" rx="18" ry="16" fill="#1e293b"/>
                    <circle cx="32" cy="48" r="8" fill="#fff"/>
                    <circle cx="68" cy="48" r="8" fill="#fff"/>
                    <circle cx="34" cy="50" r="3" fill="#1e293b"/>
                    <circle cx="70" cy="50" r="3" fill="#1e293b"/>
                    <circle cx="30" cy="46" r="2" fill="#fff"/>
                    <circle cx="66" cy="46" r="2" fill="#fff"/>
                    <ellipse cx="50" cy="65" rx="8" ry="6" fill="#1e293b"/>
                    <path d="M42 75 Q50 82 58 75" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <ellipse cx="28" cy="70" rx="12" ry="8" fill="#fda4af" opacity="0.5"/>
                    <ellipse cx="72" cy="70" rx="12" ry="8" fill="#fda4af" opacity="0.5"/>
                    <path d="M20 22 L25 28 L30 22" stroke="#22c55e" stroke-width="1.5" fill="none"/>
                    <path d="M22 21 L26 27 L30 21" stroke="#22c55e" stroke-width="1.5" fill="none"/>
                    <path d="M80 22 L75 28 L70 22" stroke="#22c55e" stroke-width="1.5" fill="none"/>
                    <path d="M78 21 L74 27 L70 21" stroke="#22c55e" stroke-width="1.5" fill="none"/>
                    <circle cx="50" cy="18" r="3" fill="#fff"/>
                </svg>
                <h1>熊猫背诗</h1>
            </div>
        </header>

        <div class="main-content">
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    诗词列表
                </div>
                <div class="poem-list" id="poem-list"></div>
                
                <div class="upload-section">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                        上传背诵材料
                    </div>
                    <div class="upload-area" id="upload-area">
                        <svg class="upload-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                        <div class="upload-text">点击或拖拽上传文件</div>
                        <div class="upload-hint">支持 .txt 文件或直接粘贴文本</div>
                    </div>
                    <input type="file" id="file-input" accept=".txt">
                    <div class="text-input-area" id="text-input-area">
                        <textarea placeholder="在此粘贴需要背诵的文本..."></textarea>
                        <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" onclick="addCustomPoem()">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                            添加到背诵列表
                        </button>
                    </div>
                    <div class="custom-poem-list" id="custom-poem-list"></div>
                </div>
            </div>

            <div class="card reciting-area">
                <div class="reciting-header">
                    <div class="current-poem-info" id="current-poem-info">
                        请选择一首诗词开始背诵
                    </div>
                    <div class="status-indicator">
                        <span class="status-dot" id="status-dot"></span>
                        <span id="status-text">准备就绪</span>
                    </div>
                </div>
                
                <div class="recognition-preview" id="recognition-preview">
                    <span style="color: var(--panda-gray); font-size: 0.8rem;">识别内容：</span>
                    <span id="recognized-text" style="font-size: 0.85rem; color: var(--dark-slate);"></span>
                </div>
                
                

                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>

                <div class="reciting-display" id="reciting-display">
                    <div style="text-align: center; color: var(--panda-gray); padding: 3rem;">
                        <svg style="width: 80px; height: 80px; margin-bottom: 1rem; opacity: 0.5;" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="45" r="35" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
                            <circle cx="32" cy="35" r="12" fill="#94a3b8"/>
                            <circle cx="68" cy="35" r="12" fill="#94a3b8"/>
                            <circle cx="34" cy="33" r="5" fill="#ffffff"/>
                            <circle cx="70" cy="33" r="5" fill="#ffffff"/>
                            <ellipse cx="30" cy="48" rx="8" ry="6" fill="#fda4af" opacity="0.4"/>
                            <ellipse cx="70" cy="48" rx="8" ry="6" fill="#fda4af" opacity="0.4"/>
                            <circle cx="50" cy="50" r="6" fill="#94a3b8"/>
                            <ellipse cx="50" cy="58" rx="4" ry="3" fill="#94a3b8"/>
                            <circle cx="18" cy="25" r="8" fill="#94a3b8"/>
                            <circle cx="82" cy="25" r="8" fill="#94a3b8"/>
                            <circle cx="18" cy="25" r="4" fill="#ffffff"/>
                            <circle cx="82" cy="25" r="4" fill="#ffffff"/>
                        </svg>
                        <p>选择左侧诗词开始背诵</p>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-primary" id="start-btn" onclick="startReciting()">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14l-4-4 4-4v8z"/></svg>
                        开始背诵
                    </button>
                    <button class="btn btn-secondary" id="pause-btn" onclick="pauseReciting()" style="display: none;">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        暂停
                    </button>
                    <button class="btn btn-danger" id="reset-btn" onclick="resetReciting()" style="display: none;">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        重新开始
                    </button>
                </div>

                <div class="stats-panel">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-correct">0</div>
                        <div class="stat-label">正确字数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-wrong">0</div>
                        <div class="stat-label">错误字数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-accuracy">0%</div>
                        <div class="stat-label">正确率</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <svg class="panda-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="45" r="35" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
                <circle cx="32" cy="35" r="12" fill="#1e293b"/>
                <circle cx="68" cy="35" r="12" fill="#1e293b"/>
                <circle cx="34" cy="33" r="5" fill="#ffffff"/>
                <circle cx="70" cy="33" r="5" fill="#ffffff"/>
                <ellipse cx="30" cy="48" rx="8" ry="6" fill="#fda4af" opacity="0.6"/>
                <ellipse cx="70" cy="48" rx="8" ry="6" fill="#fda4af" opacity="0.6"/>
                <circle cx="50" cy="50" r="6" fill="#1e293b"/>
                <ellipse cx="50" cy="58" rx="4" ry="3" fill="#1e293b"/>
                <circle cx="18" cy="25" r="8" fill="#1e293b"/>
                <circle cx="82" cy="25" r="8" fill="#1e293b"/>
                <circle cx="18" cy="25" r="4" fill="#ffffff"/>

                    '千古江山，英雄无觅孙仲谋处。',
                    '舞榭歌台，风流总被雨打风吹去。',
                    '斜阳草树，寻常巷陌，人道寄奴曾住。',
                    '想当年，金戈铁马，气吞万里如虎。',
                    '元嘉草草，封狼居胥，赢得仓皇北顾。',
                    '四十三年，望中犹记，烽火扬州路。',
                    '可堪回首，佛狸祠下，一片神鸦社鼓。',
                    '凭谁问：廉颇老矣，尚能饭否？'
                ]
            },
            {
                id: '水龙吟',
                title: '水龙吟·登建康赏心亭',
                author: '辛弃疾',
                content: [
                    '楚天千里清秋，水随天去秋无际。',
                    '遥岑远目，献愁供恨，玉簪螺髻。',
                    '落日楼头，断鸿声里，江南游子。',
                    '把吴钩看了，栏杆拍遍，无人会，登临意。',
                    '休说鲈鱼堪脍，尽西风，季鹰归未？',
                    '求田问舍，怕应羞见，刘郎才气。',
                    '可惜流年，忧愁风雨，树犹如此！',
                    '倩何人唤取，红巾翠袖，揾英雄泪？'
                ]
            }
        ];

        let currentPoem = null;
        let currentCharIndex = 0;
        let isReciting = false;
        let recognition = null;
        let totalCorrect = 0;
        let totalWrong = 0;
        let customPoems = [];
        let isSpeechSupported = false;
        let recognizedResults = [];
        let accumulatedText = '';
        let finalText = '';
        let lastFinalIndex = 0;
        let lastFinalResultIndex = -1;
        let lastInputLength = 0;
        let lastProcessedLength = 0;

        function init() {
            renderPoemList();
            loadCustomPoems();
            setupScrollTop();
            checkSpeechSupport();
        }

        function checkSpeechSupport() {
            isSpeechSupported = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;

            if (!isSpeechSupported) {
                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('status-text').textContent = '语音不可用';
            }
        }

        function renderPoemList() {
            const list = document.getElementById('poem-list');
            list.innerHTML = '';
            
            poems.forEach(poem => {
                const item = document.createElement('div');
                item.className = 'poem-item';
                item.innerHTML = `<div class="title">${poem.title}</div><div class="author">${poem.author}</div>`;
                item.onclick = () => selectPoem(poem);
                list.appendChild(item);
            });

            customPoems.forEach(poem => {
                const item = document.createElement('div');
                item.className = 'poem-item';
                item.innerHTML = `<div class="title">${poem.title}</div><div class="author">自定义</div>`;
                item.onclick = () => selectPoem(poem);
                list.appendChild(item);
            });
        }

        function selectPoem(poem) {
            currentPoem = poem;
            currentCharIndex = 0;
            totalCorrect = 0;
            totalWrong = 0;
            recognizedResults = [];
            
            document.querySelectorAll('.poem-item').forEach(item => item.classList.remove('active'));
            
            const items = document.querySelectorAll('.poem-item');
            const index = [...items].findIndex(item => item.textContent.includes(poem.title));
            if (index !== -1) {
                items[index].classList.add('active');
            }
            
            document.getElementById('current-poem-info').innerHTML = 
                `${poem.title}<span class="author">${poem.author}</span>`;
            
            updateProgress();
            updateStats();
            renderRecitingDisplay();
            
            document.getElementById('reset-btn').style.display = 'flex';
        }

        function renderRecitingDisplay() {
            const display = document.getElementById('reciting-display');
            
            if (!currentPoem) {
                display.innerHTML = `
                    <div style="text-align: center; color: var(--panda-gray); padding: 3rem;">
                        <svg style="width: 80px; height: 80px; margin-bottom: 1rem; opacity: 0.5;" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
                            <ellipse cx="50" cy="55" rx="28" ry="32" fill="#ffffff"/>
                            <circle cx="32" cy="38" r="14" fill="#94a3b8"/>
                            <circle cx="68" cy="38" r="14" fill="#94a3b8"/>
                            <circle cx="35" cy="35" r="6" fill="#ffffff"/>
                            <circle cx="71" cy="35" r="6" fill="#ffffff"/>
                            <circle cx="37" cy="37" r="2" fill="#94a3b8"/>
                            <circle cx="73" cy="37" r="2" fill="#94a3b8"/>
                            <ellipse cx="30" cy="55" rx="12" ry="8" fill="#fda4af" opacity="0.4"/>
                            <ellipse cx="70" cy="55" rx="12" ry="8" fill="#fda4af" opacity="0.4"/>
                            <circle cx="50" cy="52" r="5" fill="#94a3b8"/>
                            <ellipse cx="50" cy="62" rx="4" ry="3" fill="#94a3b8"/>
                            <circle cx="20" cy="28" r="7" fill="#94a3b8"/>
                            <circle cx="80" cy="28" r="7" fill="#94a3b8"/>
                        </svg>
                        <p>选择左侧诗词开始背诵</p>
                    </div>`;
                return;
            }

            const fullText = currentPoem.content.join('');
            let html = '<div class="reciting-paragraph">';
            let nonPunctuationCount = 0;
            let markerAdded = false;
            
            for (let i = 0; i < fullText.length; i++) {
                const char = fullText[i];
                
                if (!markerAdded && nonPunctuationCount === currentCharIndex) {
                    html += '<span id="current-position-marker"></span>';
                    markerAdded = true;
                }
                
                if (char === '，' || char === '。' || char === '！' || char === '？' || 
                    char === '、' || char === '：' || char === '；' || char === '「' || char === '」') {
                    if (nonPunctuationCount < currentCharIndex) {
                        html += `<span class="char-display">${char}</span>`;
                    } else {
                        html += `<span class="char-placeholder">${char}</span>`;
                    }
                    continue;
                }
                
                if (nonPunctuationCount < currentCharIndex) {
                    if (recognizedResults[i] !== undefined) {
                        const className = recognizedResults[i] ? 'char-correct' : 'char-wrong';
                        html += `<span class="char-display ${className}">${char}</span>`;
                    } else {
                        html += `<span class="char-display char-correct">${char}</span>`;
                    }
                } else {
                    html += `<span class="char-placeholder">${pandaPlaceholder}</span>`;
                }
                
                nonPunctuationCount++;
            }
            
            html += '</div>';
            display.innerHTML = html;
            
            const marker = document.getElementById('current-position-marker');
            if (marker) {
                marker.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                display.scrollTop = 0;
            }
        }

        function startReciting() {
            if (!currentPoem) {
                alert('请先选择一首诗词');
                return;
            }

            isReciting = true;
            accumulatedText = '';
            finalText = '';
            lastFinalIndex = 0;
            lastFinalResultIndex = -1;
            lastProcessedLength = 0;

            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                if (recognition) {
                    try { recognition.stop(); } catch(e) {}
                }
                
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    document.getElementById('start-btn').style.display = 'none';
                    document.getElementById('pause-btn').style.display = 'flex';
                    document.getElementById('status-dot').classList.add('listening');
                    document.getElementById('status-text').textContent = '正在听...';
                };

                recognition.onresult = (event) => {
                    console.log('收到识别结果:', event.results.length);
                    
                    let sessionFinal = '';
                    let interimText = '';
                    let lastFinalIdx = -1;
                    
                    for (let i = 0; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            sessionFinal += event.results[i][0].transcript;
                            lastFinalIdx = i;
                        }
                    }
                    
                    if (event.results.length > 0 && !event.results[event.results.length - 1].isFinal) {
                        interimText = event.results[event.results.length - 1][0].transcript;
                    }
                    
                    if (lastFinalIdx >= 0 && lastFinalIdx > lastFinalResultIndex) {
                        let newFinalText = '';
                        for (let i = lastFinalResultIndex + 1; i <= lastFinalIdx; i++) {
                            newFinalText += event.results[i][0].transcript;
                        }
                        finalText += newFinalText;
                        lastFinalResultIndex = lastFinalIdx;
                    }
                    
                    accumulatedText = finalText + interimText;
                    document.getElementById('recognized-text').textContent = accumulatedText;
                    console.log('识别文本:', accumulatedText);
                    processRecognition(accumulatedText);
                };

                recognition.onerror = (event) => {
                    console.error('语音识别错误:', event.error);
                    
                    if (event.error === 'not-allowed') {
                        alert('请允许麦克风权限以使用语音识别功能');
                        document.getElementById('status-text').textContent = '权限被拒绝';
                        isReciting = false;
                    } else if (event.error === 'network') {
                        document.getElementById('status-text').textContent = '网络错误，重试中...';
                    } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
                        document.getElementById('status-text').textContent = '错误: ' + event.error;
                    }
                };

                recognition.onend = () => {
                    if (isReciting) {
                        lastFinalResultIndex = -1;
                        setTimeout(() => {
                            try {
                                recognition.start();
                                document.getElementById('status-text').textContent = '正在听...';
                            } catch (e) {
                                console.error('重连失败:', e.message);
                            }
                        }, 500);
                    }
                };

                try {
                    recognition.start();
                } catch (e) {
                    console.error('启动失败:', e.message);
                    alert('语音识别启动失败，请使用手动输入模式');
                }
            } else {
                alert('您的浏览器不支持语音识别功能');
                document.getElementById('status-text').textContent = '语音不可用';
            }
        }

        function pauseReciting() {
            isReciting = false;
            if (recognition) {
                recognition.stop();
            }
            document.getElementById('start-btn').style.display = 'flex';
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('status-dot').classList.remove('listening');
            document.getElementById('status-text').textContent = '已暂停';
        }

        function resetReciting() {
            pauseReciting();
            currentCharIndex = 0;
            totalCorrect = 0;
            totalWrong = 0;
            recognizedResults = [];
            accumulatedText = '';
            finalText = '';
            lastFinalIndex = 0;
            lastInputLength = 0;
            document.getElementById('recognized-text').textContent = '';
            updateProgress();
            updateStats();
            renderRecitingDisplay();
            document.getElementById('status-dot').classList.remove('listening');
            document.getElementById('status-text').textContent = '准备就绪';
        }

        function processRecognition(text) {
            if (!currentPoem) return;

            const fullText = currentPoem.content.join('');
            const cleanedFullText = fullText.replace(/[，。！？、：；「」]/g, '');
            const cleanedInput = text.replace(/[，。！？、：；「」\s]/g, '');

            if (cleanedInput.length === 0) return;

            const searchLen = Math.min(cleanedInput.length, 15);
            const newInput = cleanedInput.substring(cleanedInput.length - searchLen);
            
            let bestMatchPos = -1;
            let bestMatchLen = 0;
            
            const searchStart = Math.max(0, currentCharIndex - 2);
            const searchEnd = Math.min(cleanedFullText.length, currentCharIndex + 30);
            
            for (let len = Math.min(newInput.length, 10); len >= 2; len--) {
                for (let start = 0; start <= newInput.length - len; start++) {
                    const subStr = newInput.substring(start, start + len);
                    const pos = cleanedFullText.indexOf(subStr, searchStart);
                    
                    if (pos !== -1 && pos < searchEnd) {
                        if (len > bestMatchLen) {
                            bestMatchPos = pos;
                            bestMatchLen = len;
                        }
                    }
                }
                if (bestMatchPos !== -1) break;
            }

            if (bestMatchPos !== -1) {
                const matchStartInInput = newInput.indexOf(cleanedFullText.substring(bestMatchPos, bestMatchPos + bestMatchLen));
                
                for (let i = 0; i < newInput.length; i++) {
                    const inputChar = newInput[i];
                    const targetIdx = bestMatchPos + (i - matchStartInInput);
                    
                    if (targetIdx >= 0 && targetIdx < cleanedFullText.length) {
                        const targetChar = cleanedFullText[targetIdx];
                        recognizedResults[getFullTextIndex(targetIdx)] = (inputChar === targetChar);
                        
                        if (inputChar === targetChar && targetIdx >= currentCharIndex) {
                            currentCharIndex = targetIdx + 1;
                        }
                    }
                }
            }

            let correctCount = 0;
            let wrongCount = 0;
            for (let i = 0; i < recognizedResults.length; i++) {
                if (recognizedResults[i] === true) correctCount++;
                else if (recognizedResults[i] === false) wrongCount++;
            }
            totalCorrect = correctCount;
            totalWrong = wrongCount;
            
            updateProgress();
            updateStats();
            renderRecitingDisplay();

            if (currentCharIndex >= cleanedFullText.length && cleanedInput.length >= cleanedFullText.length * 0.9) {
                pauseReciting();
                document.getElementById('status-text').textContent = '背诵完成！';
            }
        }

        function getFullTextIndex(nonPunctPos) {
            const fullText = currentPoem.content.join('');
            let targetIdx = 0;
            let nonPunctCount = 0;
            
            while (targetIdx < fullText.length) {
                const char = fullText[targetIdx];
                
                if (char === '，' || char === '。' || char === '！' || char === '？' || 
                    char === '、' || char === '：' || char === '；' || char === '「' || char === '」') {
                    targetIdx++;
                    continue;
                }
                
                if (nonPunctCount === nonPunctPos) {
                    return targetIdx;
                }
                
                targetIdx++;
                nonPunctCount++;
            }
            return -1;
        }

        function alignStrings(target, input) {
            const result = [];
            const len1 = target.length;
            const len2 = input.length;
            
            const dp = Array(len1 + 1).fill(0).map(() => Array(len2 + 1).fill(0));
            
            for (let i = 1; i <= len1; i++) {
                for (let j = 1; j <= len2; j++) {
                    if (target[i - 1] === input[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }
            
            let i = len1;
            let j = len2;
            
            while (i > 0 && j > 0) {
                if (target[i - 1] === input[j - 1]) {
                    result.unshift({
                        matchType: 'match',
                        targetOffset: i - 1,
                        inputOffset: j - 1,
                        char: target[i - 1]
                    });
                    i--;
                    j--;
                } else if (dp[i - 1][j] > dp[i][j - 1]) {
                    result.unshift({
                        matchType: 'delete',
                        targetOffset: i - 1,
                        inputOffset: -1,
                        char: target[i - 1]
                    });
                    i--;
                } else {
                    result.unshift({
                        matchType: 'insert',
                        targetOffset: -1,
                        inputOffset: j - 1,
                        char: input[j - 1]
                    });
                    j--;
                }
            }
            
            while (i > 0) {
                result.unshift({
                    matchType: 'delete',
                    targetOffset: i - 1,
                    inputOffset: -1,
                    char: target[i - 1]
                });
                i--;
            }
            
            while (j > 0) {
                result.unshift({
                    matchType: 'insert',
                    targetOffset: -1,
                    inputOffset: j - 1,
                    char: input[j - 1]
                });
                j--;
            }
            
            return result;
        }

        function compareStrings(target, input) {
            const result = [];
            
            const lcsMatrix = buildLCSMatrix(target, input);
            const lcs = backtrackLCS(lcsMatrix, target, input);
            
            let targetIndex = 0;
            let lcsIndex = 0;
            
            while (targetIndex < target.length) {
                const targetChar = target[targetIndex];
                
                if (lcsIndex < lcs.length && targetChar === lcs[lcsIndex]) {
                    result.push({ char: targetChar, correct: true });
                    totalCorrect++;
                    lcsIndex++;
                } else {
                    result.push({ char: targetChar, correct: false });
                    totalWrong++;
                }
                
                targetIndex++;
            }
            
            updateStats();
            return result;
        }

        function buildLCSMatrix(target, input) {
            const m = target.length;
            const n = input.length;
            const matrix = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
            
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (target[i - 1] === input[j - 1]) {
                        matrix[i][j] = matrix[i - 1][j - 1] + 1;
                    } else {
                        matrix[i][j] = Math.max(matrix[i - 1][j], matrix[i][j - 1]);
                    }
                }
            }
            
            return matrix;
        }

        function backtrackLCS(matrix, target, input) {
            let i = target.length;
            let j = input.length;
            const lcs = [];
            
            while (i > 0 && j > 0) {
                if (target[i - 1] === input[j - 1]) {
                    lcs.unshift(target[i - 1]);
                    i--;
                    j--;
                } else if (matrix[i - 1][j] > matrix[i][j - 1]) {
                    i--;
                } else {
                    j--;
                }
            }
            
            return lcs;
        }

        function updateProgress() {
            if (!currentPoem) return;
            const fullText = currentPoem.content.join('').replace(/[，。！？、：；「」]/g, '');
            const progress = (currentCharIndex / fullText.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
        }

        function updateStats() {
            const total = totalCorrect + totalWrong;
            const accuracy = total > 0 ? Math.round((totalCorrect / total) * 100) : 0;
            
            document.getElementById('stat-correct').textContent = totalCorrect;
            document.getElementById('stat-wrong').textContent = totalWrong;
            document.getElementById('stat-accuracy').textContent = `${accuracy}%`;
        }

        function setupScrollTop() {
            const btn = document.getElementById('scroll-top-btn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            });
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const textInputArea = document.getElementById('text-input-area');

        uploadArea.addEventListener('click', () => {
            textInputArea.style.display = 'block';
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                textInputArea.querySelector('textarea').value = e.target.result;
                textInputArea.style.display = 'block';
            };
            reader.readAsText(file, 'UTF-8');
        }

        function addCustomPoem() {
            const text = textInputArea.querySelector('textarea').value.trim();
            if (!text) {
                alert('请输入内容');
                return;
            }

            const lines = text.split(/[\n\r]+/).filter(line => line.trim());
            if (lines.length === 0) {
                alert('请输入有效内容');
                return;
            }

            const title = lines[0].substring(0, 10) + '...' || '自定义背诵材料';
            
            const customPoem = {
                id: 'custom_' + Date.now(),
                title: title,
                author: '自定义',
                content: lines
            };

            customPoems.push(customPoem);
            saveCustomPoems();
            renderPoemList();
            textInputArea.querySelector('textarea').value = '';
        }

        function saveCustomPoems() {
            localStorage.setItem('customPoems', JSON.stringify(customPoems));
        }

        function loadCustomPoems() {
            const saved = localStorage.getItem('customPoems');
            if (saved) {
                customPoems = JSON.parse(saved);
            }
        }

        function deleteCustomPoem(id) {
            customPoems = customPoems.filter(p => p.id !== id);
            saveCustomPoems();
            renderPoemList();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
