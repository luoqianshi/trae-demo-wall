<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧库 - 你的AI追剧助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --bg: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-hover: #252542;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #2d2d44;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .bg-decoration::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* 侧边栏 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .logo {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            padding: 16px 12px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 15px;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.1));
            color: var(--primary-light);
            font-weight: 500;
        }

        .nav-item .icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .user-section {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .user-name {
            font-weight: 500;
            font-size: 14px;
        }

        .user-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 主内容区 */
        .main-content {
            margin-left: 260px;
            padding: 32px;
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-change {
            font-size: 12px;
            color: var(--success);
            margin-top: 4px;
        }

        /* 内容区域 */
        .content-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        /* 剧集卡片 */
        .drama-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .drama-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .drama-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
        }

        .drama-poster {
            width: 100%;
            aspect-ratio: 3/4;
            background: linear-gradient(135deg, #2d2d44, #1a1a2e);
            position: relative;
            overflow: hidden;
        }

        .drama-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .drama-poster-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .drama-status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-watching {
            background: rgba(99, 102, 241, 0.9);
            color: white;
        }

        .status-want {
            background: rgba(245, 158, 11, 0.9);
            color: white;
        }

        .status-finished {
            background: rgba(16, 185, 129, 0.9);
            color: white;
        }

        .drama-info {
            padding: 16px;
        }

        .drama-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .drama-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-hover);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* AI 推荐标签 */
        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: var(--primary-light);
            margin-bottom: 12px;
        }

        .ai-badge::before {
            content: '✨';
        }

        /* 标签页 */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: var(--bg);
            padding: 4px;
            border-radius: 12px;
            width: fit-content;
        }

        .tab {
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            background: var(--bg-card);
            color: var(--text);
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* 列表视图 */
        .drama-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drama-list-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .drama-list-item:hover {
            border-color: var(--primary);
        }

        .drama-poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px 16px 0 0;
        }

        .drama-list-poster-img {
            width: 60px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .drama-list-poster {
            width: 60px;
            height: 80px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2d2d44, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .drama-list-info {
            flex: 1;
            min-width: 0;
            overflow: visible;
        }

        .drama-list-title {
            font-weight: 600;
            margin-bottom: 4px;
            white-space: normal;
            word-wrap: break-word;
            word-break: break-all;
            line-height: 1.4;
        }

        .drama-list-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .drama-list-summary {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 500px;
        }

        .suggest-section {
            padding: 8px 0;
        }

        .suggest-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text);
            transition: background 0.15s;
            margin-bottom: 2px;
        }

        .suggest-item:hover {
            background: var(--bg-hover);
        }

        .media-type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            margin-left: 6px;
            background: rgba(236, 72, 153, 0.2);
            color: var(--secondary);
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .drama-list-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            flex-shrink: 0;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        #edit-ep-modal {
            z-index: 1001;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 750px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            padding: 24px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        .modal-body {
            padding: 24px;
        }

        #search-results {
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }

        /* 搜索框 */
        .search-box {
            position: relative;
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-secondary);
        }

        /* 剧集详情 */
        .detail-header {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
        }

        .detail-poster {
            width: 180px;
            height: 240px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2d2d44, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            flex-shrink: 0;
        }

        img.detail-poster {
            object-fit: cover;
            display: block;
        }

        .detail-info {
            flex: 1;
        }

        .detail-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .detail-meta {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 14px;
        }

        .detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .tag {
            padding: 4px 12px;
            background: var(--bg-hover);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .detail-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .detail-actions .btn {
            font-size: 12px;
            padding: 6px 12px;
            white-space: nowrap;
        }

        /* 分集列表 */
        .episode-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .episode-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .episode-item:hover {
            border-color: var(--primary);
        }

        .ep-content {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            cursor: pointer;
        }

        .episode-number {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .episode-item.watched .episode-number {
            background: var(--success);
            color: white;
        }

        .episode-play-btn,
        a.episode-play-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--primary);
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary-light);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            margin-left: 8px;
            text-decoration: none;
            pointer-events: auto;
        }

        .episode-play-btn:hover,
        a.episode-play-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .episode-info {
            flex: 1;
        }

        .episode-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .episode-summary {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .episode-ai-badge {
            padding: 2px 8px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 4px;
            font-size: 11px;
            color: var(--primary-light);
            margin-left: 8px;
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .drama-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .detail-header {
                flex-direction: column;
            }

            .detail-poster {
                width: 100%;
                height: 200px;
            }
        }

        /* 动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeIn 0.4s ease forwards;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--bg-hover);
        }

        /* 推荐卡片特殊样式 */
        .recommend-reason {
            font-size: 12px;
            color: var(--primary-light);
            margin-top: 8px;
            padding: 8px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 8px;
        }

        /* 观后感 */
        .review-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .review-drama {

            });

        function navigateTo(page, filter) {
            document.querySelectorAll('.nav-item').forEach(item => {
                const isActive = item.dataset.page === page || (page === 'list' && item.dataset.page === 'dashboard');
                item.classList.toggle('active', isActive);
            });
            document.querySelectorAll('.page').forEach(p => {
                p.classList.toggle('active', p.id === `page-${page}`);
            });

            if (page === 'list' && filter) {
                currentFilter = filter;
                document.querySelectorAll('.tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.filter === filter);
                });
                renderDramaList();

                const filtered = dramas.filter(d => d.title.toLowerCase().includes(query));
                const list = document.getElementById('drama-list');

        // 渲染简介 HTML（支持折叠展开）
        function renderSummaryHTML(summary, dramaId, expanded) {
            const MAX_LEN = 100;
            if (!summary || summary.length <= MAX_LEN) {
                return `<span>${summary || '暂无简介'}</span>`;
            }
            if (expanded) {
                return `<span id="summary-text-${dramaId}">${summary}</span> <a href="javascript:void(0)" style="color:var(--primary);font-size:13px;white-space:nowrap;" onclick="toggleSummary(${dramaId})">收起</a>`;
            }
            return `<span id="summary-text-${dramaId}">${summary.substring(0, MAX_LEN)}...</span> <a href="javascript:void(0)" style="color:var(--primary);font-size:13px;white-space:nowrap;" onclick="toggleSummary(${dramaId})">更多</a>`;
        }

        function toggleSummary(dramaId) {
            const drama = dramas.find(d => d.id === dramaId);
            if (!drama) return;
            const box = document.getElementById('detail-summary-box');
            if (!box) return;
            const isExpanded = box.querySelector('a').textContent === '收起';
            box.innerHTML = renderSummaryHTML(drama.summary, dramaId, !isExpanded);
        }

        // 获取精准简介
        async function fetchSummary(dramaId) {
            const drama = dramas.find(d => d.id === dramaId);
            if (!drama) return;
            showToast('正在获取精准简介...');
            try {
                const resp = await fetch(`/api/summary?title=${encodeURIComponent(drama.title)}&year=${drama.year}&genre=${encodeURIComponent(drama.genre)}&platform=${encodeURIComponent(drama.platform || '')}`);
                const data = await resp.json();
                if (data.summary) {
                    drama.summary = data.summary;
                    const box = document.getElementById('detail-summary-box');
                    if (box) box.innerHTML = renderSummaryHTML(drama.summary, dramaId, false);
                    saveData();
                    showToast('已获取精准简介');
                } else if (data.error) {
                    showToast(data.error);
                }
            } catch (e) {
                showToast('获取简介失败，请稍后重试');
            }
        }

        // 获取分集简介
        async function fetchEpisodes(dramaId) {
            const drama = dramas.find(d => d.id === dramaId);
            if (!drama) return;
            const btn = document.querySelector('.episode-fetch-btn');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ 获取中...'; }
            try {
                const resp = await fetch(`/api/episodes?title=${encodeURIComponent(drama.title)}&total_ep=${drama.totalEp}&year=${drama.year}&genre=${encodeURIComponent(drama.genre)}&platform=${encodeURIComponent(drama.platform || '')}`);
                const data = await resp.json();
                if (data.episodes && data.episodes.length > 0) {
                    drama.episodesData = data.episodes;
                    saveData();
                    showToast(`已获取 ${data.episodes.length} 集简介`);
                    openDetail(dramaId);
                } else if (data.error) {
                    showToast(data.error);
                }
            } catch (e) {
                showToast('获取分集简介失败，请稍后重试');
            }
        }

        // 打开详情
        function openDetail(id) {
            const drama = dramas.find(d => d.id === id);
            if (!drama) return;

            const statusText = { watching: '在看', want: '想看', finished: '已看完' };
            const content = document.getElementById('detail-content');
            
            // 生成分集简介（优先使用缓存）
            const cachedEpisodes = drama.episodesData || [];
            const episodes = [];
            const hasEpisodes = cachedEpisodes.length > 0;

            for (let i = 1; i <= drama.totalEp; i++) {
                const isWatched = drama.watchedEps.has(i);
                const cached = cachedEpisodes.find(e => e.num === i);
                episodes.push({
                    num: i,
                    watched: isWatched,
                    title: hasEpisodes ? `第 ${i} 集` : `第 ${i} 集`,
                    summary: hasEpisodes ? (cached ? cached.title : '暂无简介') : ''
                });
            }

            const watchedCount = drama.watchedEps.size;

            content.innerHTML = `
                <div class="detail-header">
                    <img src="${drama.poster}" class="detail-poster" alt="${drama.title}" onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('afterbegin', '<div class=detail-poster>${drama.emoji}</div>')">
                    <div class="detail-info">
                        <div class="detail-title">${drama.title}</div>
                        <div class="detail-meta">${drama.year} · ${drama.genre} · ${drama.platform} · ${drama.totalEp}集</div>
                        <div class="detail-tags">
                            ${drama.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div id="detail-summary-box" style="margin-bottom: 16px; color: var(--text-secondary); font-size: 14px; line-height: 1.6;">
                            ${renderSummaryHTML(drama.summary, drama.id)}
                        </div>
                        <div class="detail-actions">
                            <a class="btn btn-primary" href="${getPlayUrl(drama.platform, drama.title)}" target="_blank" style="text-decoration: none;">
                                ▶ 去播放
                            </a>
                            ${drama.status === 'want' ? `
                                <button class="btn btn-secondary" onclick="startWatching(${drama.id})">
                                    开始追剧
                                </button>
                            ` : drama.status === 'finished' ? `
                                <button class="btn btn-secondary">已看完 (${watchedCount}/${drama.totalEp})</button>
                            ` : `
                                <button class="btn btn-secondary">已看 ${watchedCount}/${drama.totalEp} 集</button>
                            `}
                            <button class="btn btn-secondary" onclick="openEditEpModal(${drama.id})">✏️ 修改集数</button>
                            <button class="btn btn-secondary" onclick="addToClassics(${drama.id})">⭐ 设为经典</button>
                            <button class="btn btn-danger" onclick="openDeleteConfirm(${drama.id}, '${drama.title.replace(/'/g, "\\'")}')">🗑️ 删除</button>
                        </div>
                    </div>
                </div>
                <div style="margin-top: 24px;">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                            <h3 style="font-size: 16px;">📋 分集简介</h3>
                            ${cachedEpisodes.length > 0 ? `<span class="episode-ai-badge">AI 生成</span><button class="btn btn-secondary episode-fetch-btn" style="font-size: 11px; padding: 2px 8px;" onclick="event.stopPropagation();fetchEpisodes(${drama.id})">🔄 重新获取</button>` : `<button class="btn btn-secondary episode-fetch-btn" style="font-size: 12px; padding: 4px 12px;" onclick="fetchEpisodes(${drama.id})">🤖 获取分集简介</button>`}
                            <span style="font-size: 12px; color: var(--text-secondary); margin-left: auto;">点击集数标记已看/未看</span>
                        </div>
                        <div class="episode-list" id="episode-list-container">
                        </div>
                        ${episodes.map(ep => `
                            <div class="episode-item ${ep.watched ? 'watched' : ''}" data-ep-num="${ep.num}">
                                <div class="ep-content" onclick="toggleEpisode(${drama.id}, ${ep.num})">
                                    <div class="episode-number">${ep.num}</div>
                                    <div class="episode-info">
                                        <div class="episode-title">${ep.title} ${ep.watched ? '✓' : ''}</div>
                                        <div class="episode-summary">${ep.summary}</div>
                                    </div>
                                </div>
                                <a class="episode-play-btn" href="${getPlayUrl(drama.platform, drama.title, ep.num)}" target="_blank" onclick="window.open(this.href, '_blank'); return false;" title="去播放">
                                    ▶
                                </a>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- 观后感区域 -->
                <div style="margin-top: 32px;" id="detail-reviews-section">
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                        <h3 style="font-size: 16px;">📝 观后感</h3>
                        <span style="font-size: 13px; color: var(--text-secondary);">${reviews.filter(r => r.dramaId === drama.id).length} 条</span>
                    </div>

                    <!-- 已有观后感 -->
                    <div id="detail-reviews-list">
                        ${reviews.filter(r => r.dramaId === drama.id).map(review => `
                            <div class="review-card animate-in">
                                <div class="review-header">
                                    <span class="review-date">${review.date}</span>
                                </div>
                                <div class="review-rating">
                                    ${Array(review.rating).fill('⭐').join('')}
                                </div>
                                <div class="review-content">${review.content}</div>
                            </div>
                        `).join('') || '<p style="color: var(--text-secondary); font-size: 14px; padding: 12px 0;">暂无观后感，来写第一条吧~</p>'}
                    </div>

                    <!-- 写观后感表单 -->
                    <div class="inline-review-form">
                        <div style="font-size: 14px; font-weight: 500; margin-bottom: 10px;">写观后感</div>
                        <div class="inline-star-rating" id="inline-stars-${drama.id}">
                            <span class="star-inline" data-rating="1">⭐</span>
                            <span class="star-inline" data-rating="2">⭐</span>
                            <span class="star-inline" data-rating="3">⭐</span>
                            <span class="star-inline" data-rating="4">⭐</span>
                            <span class="star-inline" data-rating="5">⭐</span>
                        </div>
                        <textarea class="form-input" rows="3" placeholder="记录下你的观影感受..." id="inline-review-content-${drama.id}"></textarea>
                        <button class="btn btn-primary" style="margin-top: 10px; width: 100%;" onclick="submitReviewInline(${drama.id})">发布观后感</button>
                    </div>
                </div>
            `;

            // 绑定内联星星点击事件
            inlineSelectedRating = 0;
            const stars = document.querySelectorAll('.star-inline');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    inlineSelectedRating = parseInt(this.dataset.rating);
                    stars.forEach((s, idx) => {
                        s.style.opacity = idx < inlineSelectedRating ? '1' : '0.3';
                    });
                });
            });

            document.getElementById('detail-modal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('active');

        function confirmDeleteDrama() {
            if (deleteClassicId !== null) {
                // 先尝试从 classics 删除
                const cIdx = classics.findIndex(d => d.id === deleteClassicId);
                if (cIdx !== -1) {
                    const title = classics[cIdx].title;

                    renderClassics();
                    saveData();
                    closeConfirmDeleteModal();
                    closeDetailModal();

        // 修改集数

        function openEditEpModal(id) {
            const drama = dramas.find(d => d.id === id);
            if (!drama) return;
            editEpDramaId = id;
            document.getElementById('edit-ep-info').textContent = `《${drama.title}》当前总集数：${drama.totalEp} 集`;
            document.getElementById('edit-total-ep').value = drama.totalEp;
            document.getElementById('edit-ep-modal').classList.add('active');
        }

        function closeEditEpModal() {
            document.getElementById('edit-ep-modal').classList.remove('active');
            editEpDramaId = null;
        }

        function confirmEditEp() {
            if (!editEpDramaId) return;
            const drama = dramas.find(d => d.id === editEpDramaId);
            if (!drama) return;

            const newTotal = parseInt(document.getElementById('edit-total-ep').value);
            if (!newTotal || newTotal < 1) {
                showToast('请输入有效的集数');
                return;
            }

            const oldTotal = drama.totalEp;
            drama.totalEp = newTotal;

            // 如果新集数小于已看集数，清理超出的已看标记
            if (newTotal < oldTotal) {
                for (let ep = newTotal + 1; ep <= oldTotal; ep++) {
                    drama.watchedEps.delete(ep);
                }
                const watchedArray = Array.from(drama.watchedEps);
                drama.currentEp = watchedArray.length > 0 ? Math.max(...watchedArray) : 0;
            }

            // 如果新集数等于已看集数，自动标记为已看完
            if (drama.watchedEps.size === drama.totalEp && drama.status !== 'finished') {
                drama.status = 'finished';
            }
            // 如果已看完但新集数增加了，恢复为在看状态
            if (drama.status === 'finished' && drama.watchedEps.size < drama.totalEp) {
                drama.status = 'watching';
            }

            const savedId = editEpDramaId;
            updateStats();
            renderDramaList();
            renderWatching();
            saveData();
            closeEditEpModal();
            showToast(`已将《${drama.title}》总集数修改为 ${newTotal} 集`);
            // 重新打开详情弹窗，刷新分集列表
            openDetail(savedId);
            editEpDramaId = null;
        }

        function getPlayUrl(platform, title, epNum) {
            const epSuffix = epNum ? ` 第${epNum}集` : '';
            const query = encodeURIComponent(title + epSuffix);
            const map = {
                '腾讯视频': `https://v.qq.com/x/search/?q=${query}`,
                '爱奇艺': `https://www.iqiyi.com/search/?key=${query}`,
                '优酷': `https://so.youku.com/search_video/q_${query}`,
                '芒果TV': `https://so.mgtv.com/so?k=${query}`,
                '哔哩哔哩': `https://search.bilibili.com/all?keyword=${query}`,
                '影院': `https://www.baidu.com/s?wd=${query}`,
            };
            return map[platform] || `https://www.baidu.com/s?wd=${query}`;
        }

        // 搜索剧集（联网搜索 + 联想建议）
        let searchTimeout = null;    // 联想建议定时器
        let detailTimeout = null;    // 详细搜索定时器
        let isSearching = false;
        let isComposing = false;  // 是否正在输入法组词中

        const searchInput = document.getElementById('search-drama');

        // 监听输入法组词开始（拼音输入阶段）
        searchInput.addEventListener('compositionstart', () => {
            isComposing = true;
        });

        // 监听输入法组词结束（用户确认中文输入）
        searchInput.addEventListener('compositionend', (e) => {
            isComposing = false;
            // 组词结束后立即触发搜索
            performSearch(e.target.value.trim());
        });

        searchInput.addEventListener('input', (e) => {
            // 如果正在输入法组词中，不触发搜索（等待 compositionend）
            if (isComposing) return;

            const query = e.target.value.trim();
            performSearch(query);
        });

        function performSearch(query) {
            const results = document.getElementById('search-results');

            clearTimeout(searchTimeout);
            clearTimeout(detailTimeout);

            if (!query) {
                results.innerHTML = '';
                isSearching = false;
                return;
            }

            // 先快速获取联想建议显示
            searchTimeout = setTimeout(async () => {
                try {
                    const suggestResp = await fetch(`/api/suggest?q=${encodeURIComponent(query)}&_t=${Date.now()}`);
                    const suggestData = await suggestResp.json();
                    const suggestions = suggestData.suggestions || [];

                    if (suggestions.length > 0 && !isSearching) {
                        // 显示联想建议列表，用户可以点击选择
                        results.innerHTML = `
                            <div class="suggest-section">
                                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">搜索建议（点击选择）</div>
                                ${suggestions.map(s => `
                                    <div class="suggest-item" onclick="document.getElementById('search-drama').value='${s.replace(/'/g, "\\'")}'; document.getElementById('search-drama').dispatchEvent(new Event('input'));">
                                        🔍 ${s}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }
                } catch(e) {}
            }, 200);

            // 延迟执行详细搜索
            detailTimeout = setTimeout(async () => {
                if (isSearching) return;
                isSearching = true;

                // 先显示本地匹配
                const allShows = [...dramas, ...aiRecommendations, ...trending];
                const localMatches = allShows.filter(s => s.title.toLowerCase().includes(query.toLowerCase()));

                results.innerHTML = `
                    <div class="empty-state" style="padding: 40px;">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">正在搜索 "${query}"...</div>
                        <p style="font-size: 13px; color: var(--text-secondary);">联网搜索中，请稍候</p>
                    </div>
                `;

                try {
                    const resp = await fetch(`/api/search?q=${encodeURIComponent(query)}&_t=${Date.now()}`);
                    const data = await resp.json();
                    const netResults = data.results || [];

                    const netTitles = new Set(netResults.map(r => r.title));
                    const combined = [...netResults, ...localMatches.filter(s => !netTitles.has(s.title))];

                    if (combined.length === 0) {
                        results.innerHTML = `
                            <div class="empty-state" style="padding: 40px;">
                                <div class="empty-icon">🔍</div>
                                <div class="empty-title">未找到相关剧集</div>
                                <p>尝试搜索其他关键词</p>
                            </div>
                        `;
                        isSearching = false;
                        return;
                    }

                    results.innerHTML = combined.map(show => {
                        const isNet = show.poster && show.summary && show.summary !== '暂无简介';
                        const poster = show.poster || '';
                        const year = show.year || '';
                        const genre = show.genre || '';
                        const mediaType = show.mediaType || '';
                        const summary = show.summary || '';
                        const totalEp = show.totalEp || 20;
                        const platform = show.platform || '未知平台';
                        const tags = show.tags || [];
                        const emoji = show.emoji || show.genre || '📺';
                        const typeBadge = mediaType && mediaType !== '影视' ? `<span class="media-type-badge">${mediaType}</span>` : '';
                        const safeTitle = show.title.replace(/'/g, '&#39;').replace(/"/g, '&quot;');

                        return `
                            <div class="drama-list-item" style="margin-bottom: 8px;" onclick="addToList('${safeTitle}', '${emoji}', '${poster}', '${year}', '${genre}', '${platform}', ${totalEp}, '${summary.replace(/'/g, '&#39;')}', '${tags.join(',')}')">
                                ${poster ? `<img src="${poster}" class="drama-list-poster-img" alt="${safeTitle}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
                                <div class="drama-list-poster" style="${poster ? 'display:none;' : ''}">${emoji}</div>
                                <div class="drama-list-info">
                                    <div class="drama-list-title" title="${safeTitle}">${show.title} ${typeBadge} ${isNet ? '<span style="font-size:11px;color:var(--success);margin-left:4px;">✓ 联网</span>' : ''}</div>
                                    <div class="drama-list-meta">${year} · ${genre} · ${totalEp}集 · ${platform}</div>
                                    ${summary ? `<div class="drama-list-summary">${summary}</div>` : ''}
                                </div>
                                <button class="btn btn-primary btn-sm">+ 添加</button>
                            </div>
                        `;
                    }).join('');
                } catch (err) {
                    if (localMatches.length > 0) {
                        results.innerHTML = localMatches.map(show => `
                            <div class="drama-list-item" style="margin-bottom: 8px;" onclick="addToList('${show.title.replace(/'/g, "\\'")}', '${show.emoji || show.genre || '📺'}', '${show.poster || ''}')">
                                ${show.poster ? `<img src="${show.poster}" class="drama-list-poster-img" alt="${show.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
                                <div class="drama-list-poster" style="${show.poster ? 'display:none;' : ''}">${show.emoji || '📺'}</div>
                                <div class="drama-list-info">
                                    <div class="drama-list-title">${show.title}</div>
                                    <div class="drama-list-meta">${show.year || ''} · ${show.genre || ''}</div>
                                </div>
                                <button class="btn btn-primary btn-sm">+ 添加</button>
                            </div>
                        `).join('');
                    } else {
                        results.innerHTML = `
                            <div class="empty-state" style="padding: 40px;">
                                <div class="empty-icon">🔍</div>
                                <div class="empty-title">搜索失败</div>
                                <p>请检查网络连接后重试</p>
                            </div>
                        `;
                    }
                }
                isSearching = false;
            }, 800);
        }

        function startWatching(id) {
            const drama = dramas.find(d => d.id === id);
            if (drama) {
                drama.status = 'watching';

                updateStats();
                renderDramaList();
                saveData();

                showToast(`开始追剧 "${drama.title}"`);

        function toggleEpisode(id, epNum) {
            const drama = dramas.find(d => d.id === id);
            if (!drama) return;

            const isWatched = drama.watchedEps.has(epNum);
            if (isWatched) {
                drama.watchedEps.delete(epNum);
                showToast(`已取消第 ${epNum} 集的已看标记`);
            } else {
                drama.watchedEps.add(epNum);
                showToast(`已标记第 ${epNum} 集为已看`);
            }

            // 更新 currentEp 为已看集数的最大值
            const watchedArray = Array.from(drama.watchedEps);
            drama.currentEp = watchedArray.length > 0 ? Math.max(...watchedArray) : 0;

            // 如果全部看完，自动标记为已看完
            if (drama.watchedEps.size === drama.totalEp && drama.status !== 'finished') {
                drama.status = 'finished';
                showToast(`🎉 恭喜看完 "${drama.title}"！`);
            }

            // 如果原本已看完但取消了某些集，恢复为在看状态
            if (drama.status === 'finished' && drama.watchedEps.size < drama.totalEp) {
                drama.status = 'watching';
            }

            // 局部更新 UI，不重新渲染整个弹窗（保持滚动位置）
            const epItem = document.querySelector(`#episode-list-container ~ .episode-item[data-ep-num="${epNum}"]`) ||
                           document.querySelector(`.episode-item[data-ep-num="${epNum}"]`);
            if (epItem) {
                if (isWatched) {
                    epItem.classList.remove('watched');
                    const titleEl = epItem.querySelector('.episode-title');
                    if (titleEl) titleEl.textContent = titleEl.textContent.replace(' ✓', '');
                } else {
                    epItem.classList.add('watched');
                    const titleEl = epItem.querySelector('.episode-title');
                    if (titleEl) titleEl.textContent += ' ✓';
                }
            }

            // 更新弹窗顶部的已看集数显示
            const watchedCount = drama.watchedEps.size;
            const allBtns = document.querySelectorAll('#detail-content .detail-actions .btn-secondary');
            allBtns.forEach(btn => {
                const txt = btn.textContent.trim();
                if (txt.startsWith('已看') || txt.startsWith('已看完')) {
                    if (drama.status === 'finished') {
                        btn.textContent = `已看完 (${watchedCount}/${drama.totalEp})`;
                    } else if (drama.status === 'watching') {
                        btn.textContent = `已看 ${watchedCount}/${drama.totalEp} 集`;
                    }
                }
            });

            updateStats();
            renderDramaList();
            saveData();
        }

        // Toast 提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 32px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bg-card);
                border: 1px solid var(--primary);
                color: var(--text);
                padding: 14px 28px;
                border-radius: 12px;
                font-size: 14px;
                z-index: 9999;
                animation: fadeIn 0.3s ease;
                box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 点击模态框外部关闭
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
