<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战棋展览馆 - Battle Brothers Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.min.js"></script>
  <style>
    :root {
      --battle-dark: #1a1a2e;
      --battle-darker: #16213e;
      --battle-accent: #d4af37;
      --battle-rust: #8b2500;
      --battle-gold: #ffd700;
      --parchment: #f5deb3;
      --parchment-dark: #d2b48c;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Lora', serif;
      background-color: var(--battle-dark);
      color: var(--parchment);
      min-height: 100vh;
    }
    
    h1, h2, h3, h4 { font-family: 'Cinzel', serif; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--battle-darker); }
    ::-webkit-scrollbar-thumb { background: var(--battle-accent); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--battle-gold); }
    
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }
    
    .navbar-content {
      max-width: 1200px; margin: 0 auto; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    
    .nav-brand {
      display: flex; align-items: center; gap: 12px;
    }
    
    .nav-brand h1 { font-size: 1.25rem; color: var(--parchment); }
    
    .nav-links {
      display: flex; gap: 8px;
    }
    
    .nav-link {
      padding: 8px 16px; border-radius: 8px;
      text-decoration: none; color: var(--parchment-dark);
      transition: all 0.3s;
    }
    
    .nav-link:hover, .nav-link.active {
      color: var(--battle-accent);
      background: rgba(212, 175, 55, 0.1);
    }
    
    .mobile-menu-btn { display: none; }
    
    .hero-section {
      height: 50vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--battle-darker), var(--battle-dark), rgba(139, 37, 0, 0.2));
      position: relative; overflow: hidden;
    }
    
    .hero-section::before {
      content: ''; position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
    }
    
    .hero-content { text-align: center; z-index: 1; }
    .hero-content h1 { font-size: 3rem; margin-bottom: 12px; }
    .hero-content p { font-size: 1.25rem; color: var(--parchment-dark); }
    
    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      margin-top: -60px; position: relative; z-index: 10;
    }
    
    .stat-card {
      background: rgba(22, 33, 62, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 12px; padding: 20px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    
    .stat-card .icon {
      width: 48px; height: 48px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }
    
    .stat-card .value { font-size: 1.75rem; font-weight: bold; }
    .stat-card .label { font-size: 0.875rem; color: var(--parchment-dark); }
    
    .search-bar {
      display: flex; gap: 16px; margin: 32px 0;
    }
    
    .search-input, .filter-select {
      flex: 1; padding: 12px 16px;
      background: var(--battle-darker);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      color: var(--parchment);
      font-family: inherit;
    }
    
    .search-input:focus, .filter-select:focus {
      outline: none; border-color: var(--battle-accent);
    }
    
    .gallery-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    
    .npc-card {
      background: rgba(22, 33, 62, 0.8);
      border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.2);
      transition: all 0.3s; cursor: pointer;
    }
    
    .npc-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.5);
      box-shadow: 0 20px 40px rgba(212, 175, 55, 0.1);
    }
    
    .npc-card-header {
      padding: 16px;
    }
    
    .npc-avatar {
      width: 64px; height: 64px; border-radius: 8px;
      border: 2px solid rgba(212, 175, 55, 0.3);
    }
    
    .npc-info { display: flex; gap: 12px; }
    
    .npc-name { font-size: 1.125rem; color: var(--parchment); }
    
    .profession-tag {
      display: inline-block; padding: 4px 12px;
      border-radius: 20px; font-size: 0.75rem;
      margin-top: 4px;
    }
    
    .health-bar-container {
      margin: 12px 16px;
    }
    
    .health-bar-bg {
      height: 8px; background: var(--battle-dark);
      border-radius: 4px; overflow: hidden;
    }
    
    .health-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #dc2626, #f87171);
      transition: width 0.3s;
    }
    
    .npc-stats {
      display: flex; justify-content: space-around;
      padding: 12px 16px;
    }
    
    .stat-item { display: flex; align-items: center; gap: 6px; }
    
    .skills-tags {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 0 16px 16px;
    }
    
    .skill-tag {
      padding: 4px 8px; background: rgba(26, 26, 46, 0.5);
      border: 1px solid rgba(212, 175, 55, 0.1);
      border-radius: 4px; font-size: 0.75rem;
      color: var(--parchment-dark);
    }
    
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    
    .modal-content {
      background: var(--battle-dark);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      max-width: 600px; width: 100%;
      max-height: 90vh; overflow-y: auto;
    }
    
    .modal-header {
      padding: 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      display: flex; justify-content: space-between; align-items: center;
    }
    
    .modal-body { padding: 24px; }
    
    .detail-avatar {
      width: 96px; height: 96px; border-radius: 12px;
      border: 3px solid var(--battle-accent);
    }
    
    .detail-info { display: flex; gap: 20px; margin-bottom: 24px; }
    
    .detail-name { font-size: 1.5rem; }
    
    .tabs {
      display: flex; border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      margin-bottom: 24px;
    }
    
    .tab {
      flex: 1; padding: 12px; text-align: center;
      cursor: pointer; color: var(--parchment-dark);
      transition: all 0.3s;
    }
    
    .tab.active {
      color: var(--battle-accent);
      border-bottom: 2px solid var(--battle-accent);
    }
    
    .stat-block {
      padding: 16px; background: var(--battle-darker);
      border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.1);
      margin-bottom: 12px;
    }
    
    .skill-item, .equip-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px; background: var(--battle-darker);
      border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.1);
      margin-bottom: 8px;
    }
    
    .backstory-text {
      padding: 16px; background: var(--battle-darker);
      border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.1);
      line-height: 1.6;
    }
    
    .btn {
      padding: 10px 24px; border-radius: 8px;
      font-family: 'Cinzel', serif;
      cursor: pointer; border: none;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: var(--battle-accent);
      color: var(--battle-dark);
    }
    
    .btn-primary:hover { background: var(--battle-gold); }
    
    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: var(--parchment);
    }
    
    .btn-secondary:hover { background: rgba(212, 175, 55, 0.1); }
    
    .page-container {
      max-width: 1200px; margin: 0 auto; padding: 80px 20px 40px;
    }
    
    .page-title { font-size: 1.75rem; margin-bottom: 24px; }
    
    .upload-area {
      border: 2px dashed rgba(212, 175, 55, 0.3);
      border-radius: 12px; padding: 40px;
      text-align: center; cursor: pointer;
      transition: all 0.3s;
    }
    
    .upload-area:hover {
      border-color: rgba(212, 175, 55, 0.6);
      background: rgba(22, 33, 62, 0.5);
    }
    
    .upload-icon {
      width: 64px; height: 64px; margin: 0 auto 16px;
      border-radius: 50%; background: var(--battle-dark);
      display: flex; align-items: center; justify-content: center;
    }
    
    .editor-form {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    
    .form-group {
      display: flex; flex-direction: column; gap: 8px;
    }
    
    .form-group label { font-size: 0.875rem; color: var(--parchment-dark); }
    
    .form-control {
      padding: 10px; background: var(--battle-darker);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 8px; color: var(--parchment);
      font-family: inherit;
    }
    
    .form-control:focus { outline: none; border-color: var(--battle-accent); }
    
    textarea.form-control { resize: vertical; min-height: 80px; }
    
    .gallery-3d {
      height: 500px; position: relative;
      background: var(--battle-dark);
      border-radius: 12px; overflow: hidden;
    }
    
    .gallery-controls {
      position: absolute; top: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    
    .control-btn {
      width: 48px; height: 48px; border-radius: 8px;
      background: rgba(22, 33, 62, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--parchment);
      cursor: pointer; transition: all 0.3s;
    }
    
    .control-btn:hover { color: var(--battle-accent); }
    
    .screenshot-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    
    .screenshot-card {
      background: rgba(22, 33, 62, 0.8);
      border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    
    .screenshot-img {
      width: 100%; aspect-ratio: 4/3; object-fit: cover;
    }
    
    .screenshot-info { padding: 12px; }
    
    .tag {
      display: inline-block; padding: 4px 8px;
      background: rgba(212, 175, 55, 0.2);
      border-radius: 4px; font-size: 0.75rem;
      color: var(--battle-accent);
      margin-right: 4px;
    }
    
    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 40px;
    }
    
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(212, 175, 55, 0.3);
      border-top-color: var(--battle-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-menu-btn { display: block; }
      .hero-content h1 { font-size: 2rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .search-bar { flex-direction: column; }
      .editor-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-content">
      <div class="nav-brand">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--battle-accent);">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
        <h1>战棋展览馆</h1>
      </div>
      <div class="nav-links">
        <a href="#home" class="nav-link active" onclick="showPage('home')">首页</a>
        <a href="#gallery" class="nav-link" onclick="showPage('gallery')">展览馆</a>
        <a href="#manage" class="nav-link" onclick="showPage('manage')">NPC管理</a>
        <a href="#screenshots" class="nav-link" onclick="showPage('screenshots')">截图管理</a>
      </div>
      <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--parchment);">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="mobile-menu" style="display: none;" class="bg-battle-darker border-t border-battle-accent/20">
      <div class="navbar-content flex flex-col gap-2 py-4">
        <a href="#home" class="nav-link" onclick="showPage('home'); toggleMobileMenu()">首页</a>
        <a href="#gallery" class="nav-link" onclick="showPage('gallery'); toggleMobileMenu()">展览馆</a>
        <a href="#manage" class="nav-link" onclick="showPage('manage'); toggleMobileMenu()">NPC管理</a>
        <a href="#screenshots" class="nav-link" onclick="showPage('screenshots'); toggleMobileMenu()">截图管理</a>
      </div>
    </div>
  </nav>

  <div id="page-content" class="page-container">
    <!-- 首页内容 -->
    <div id="page-home">
      <section class="hero-section">
        <div class="hero-content">
          <h1>战棋展览馆</h1>
          <p>记录你的战斗兄弟，珍藏每一段冒险历程</p>
        </div>
      </section>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="icon" style="background: rgba(212, 175, 55, 0.2);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--battle-accent);">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          <div class="value" id="stat-npc-count">0</div>
          <div class="label">NPC数量</div>
        </div>
        <div class="stat-card">
          <div class="icon" style="background: rgba(139, 37, 0, 0.2);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--battle-rust);">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
          </div>
          <div class="value" id="stat-total-level">0</div>
          <div class="label">总等级</div>
        </div>
        <div class="stat-card">
          <div class="icon" style="background: rgba(255, 215, 0, 0.2);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: #ffd700;">
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
              <path d="M4 22h16"></path>
              <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
              <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </svg>
          </div>
          <div class="value" id="stat-total-skills">0</div>
          <div class="label">总技能</div>
        </div>
        <div class="stat-card">
          <div class="icon" style="background: rgba(59, 130, 246, 0.2);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: #3b82f6;">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <div class="value" id="stat-play-time">0</div>
          <div class="label">游戏时长</div>
        </div>
      </div>

      <div class="search-bar">
        <input type="text" class="search-input" placeholder="搜索NPC名称或职业..." id="search-input" oninput="handleSearch()">
        <select class="filter-select" id="filter-select" onchange="handleFilter()">
          <option value="">全部职业</option>
          <option value="warrior">战士</option>
          <option value="archer">弓箭手</option>
          <option value="spearman">枪兵</option>
          <option value="swordsman">剑士</option>
          <option value="axeman">斧兵</option>
          <option value="knight">骑士</option>
          <option value="mercenary">雇佣兵</option>
          <option value="noble">贵族</option>
        </select>
      </div>

      <div class="gallery-grid" id="npc-gallery">
      </div>
    </div>

    <!-- 3D展览馆内容 -->
    <div id="page-gallery" style="display: none;">
      <h2 class="page-title">3D展览馆</h2>
      <div class="gallery-3d" id="gallery-canvas">
        <div class="gallery-controls">
          <button class="control-btn" onclick="resetCamera()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>
        </div>
        <div id="scene-container" style="width: 100%; height: 100%;"></div>
      </div>
      <h3 style="margin: 24px 0 16px;">NPC名册</h3>
      <div class="gallery-grid" id="gallery-npc-list">
      </div>
    </div>

    <!-- NPC管理内容 -->
    <div id="page-manage" style="display: none;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
        <div>
          <h2 class="page-title">上传游戏存档</h2>
          <div class="upload-area" onclick="document.getElementById('save-file-input').click()">
            <div class="upload-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--battle-accent);">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <h3>拖拽存档文件到此处</h3>
            <p style="color: var(--parchment-dark);">或点击选择文件</p>
          </div>
          <input type="file" id="save-file-input" style="display: none;" onchange="handleSaveFile()">
          <div id="upload-status" style="margin-top: 16px;"></div>

          <h2 class="page-title" style="margin-top: 40px;">手动创建NPC</h2>
          <button class="btn btn-primary" style="width: 100%;" onclick="openEditor()">创建新NPC</button>
        </div>

        <div>
          <h2 class="page-title">我的NPC</h2>
          <div class="gallery-grid" id="manage-npc-list" style="max-height: 600px; overflow-y: auto;">
          </div>
        </div>
      </div>
    </div>

    <!-- 截图管理内容 -->
    <div id="page-screenshots" style="display: none;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
        <div>
          <h2 class="page-title">上传截图</h2>
          <div class="upload-area" onclick="document.getElementById('image-file-input').click()">
            <div class="upload-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--battle-accent);">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
            </div>
            <h3>拖拽图片到此处</h3>
            <p style="color: var(--parchment-dark);">或点击选择文件</p>
          </div>
          <input type="file" id="image-file-input" style="display: none;" accept="image/*" onchange="handleImageFile()">

          <div id="image-editor" style="display: none; margin-top: 24px;">
            <div class="editor-form">
              <div class="form-group">
                <label>标题</label>
                <input type="text" class="form-control" id="image-title">
              </div>
              <div class="form-group">
                <label>描述</label>
                <textarea class="form-control" id="image-desc"></textarea>
              </div>
            </div>

    function handleSearch() {

    function showNpcDetail(id) {

    function showTab(tab) {
      const content = document.getElementById('tab-content');

      if (tab === 'stats') {
        content.innerHTML = `
          <div class="stat-block">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">

            </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">

    function getRarityColor(rarity) {
      const colors = { common: '#9ca3af', uncommon: '#22c55e', rare: '#3b82f6', epic: '#a855f7', legendary: '#f59e0b' };
      return colors[rarity] || '#9ca3af';

    function closeModal() {
      document.getElementById('npc-modal').style.display = 'none';
    }

    function renderGallery() {
      renderNpcGallery('gallery-npc-list', npcs);
      init3DScene();
    }

    let scene, camera, renderer;
    let cubes = [];

    function init3DScene() {
      const container = document.getElementById('scene-container');
      if (!container) return;
      
      if (scene) {
        container.innerHTML = '';
      }

      scene = new THREE.Scene();
      scene.background = new THREE.Color('#1a1a2e');
      
      camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 5, 15);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);
      
      const pointLight1 = new THREE.PointLight(0xd4af37, 1, 100);
      pointLight1.position.set(10, 10, 10);
      scene.add(pointLight1);
      
      const pointLight2 = new THREE.PointLight(0x8b2500, 0.5, 100);
      pointLight2.position.set(-10, 10, -10);
      scene.add(pointLight2);

      const planeGeometry = new THREE.PlaneGeometry(30, 30);
      const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x16213e, roughness: 0.8, metalness: 0.2 });
      const plane = new THREE.Mesh(planeGeometry, planeMaterial);
      plane.rotation.x = -Math.PI / 2;
      plane.position.y = -1.5;
      scene.add(plane);

      npcs.forEach((npc, i) => {
        const col = i % 3;
        const row = Math.floor(i / 3);
        const x = (col - 1) * 4;
        const z = (row - 1) * 4;
        
        const color = PROFESSION_COLORS[npc.profession] || '#d4af37';
        const geometry = new THREE.BoxGeometry(1.2, 1.8, 0.8);
        const material = new THREE.MeshStandardMaterial({ color, metalness: 0.8, roughness: 0.2 });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(x, 0, z);
        cube.userData = { npcId: npc.id };
        scene.add(cube);
        cubes.push(cube);

        const headGeometry = new THREE.SphereGeometry(0.35, 32, 32);
        const headMaterial = new THREE.MeshStandardMaterial({ color: 0xf5deb3, metalness: 0.1, roughness: 0.8 });
        const head = new THREE.Mesh(headGeometry, headMaterial);
        head.position.set(x, 1.5, z);
        scene.add(head);

        const helmGeometry = new THREE.SphereGeometry(0.15, 16, 16);
        const helmMaterial = new THREE.MeshStandardMaterial({ color, metalness: 0.5, roughness: 0.3 });
        const helm = new THREE.Mesh(helmGeometry, helmMaterial);
        helm.position.set(x, 2.2, z);
        scene.add(helm);
      });

      let isDragging = false;
      let previousMousePosition = { x: 0, y: 0 };
      let targetRotationX = 0;
      let targetRotationY = 0;

      container.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      container.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaMove = {
          x: e.clientX - previousMousePosition.x,
          y: e.clientY - previousMousePosition.y
        };
        targetRotationY += deltaMove.x * 0.005;
        targetRotationX += deltaMove.y * 0.005;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      container.addEventListener('mouseup', () => isDragging = false);
      container.addEventListener('mouseleave', () => isDragging = false);

      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        camera.position.z = Math.max(5, Math.min(25, camera.position.z + e.deltaY * 0.01));
      });

      function animate() {
        requestAnimationFrame(animate);
        
        cubes.forEach((cube, i) => {
          cube.rotation.y += 0.005;
        });
        
        if (!isDragging) {
          targetRotationY += 0.003;
        }
        
        const rotationX = THREE.MathUtils.lerp(camera.rotation.x, targetRotationX, 0.05);
        const rotationY = THREE.MathUtils.lerp(camera.rotation.y, targetRotationY, 0.05);
        
        const radius = 15;
        camera.position.x = Math.sin(rotationY) * Math.cos(rotationX) * radius;
        camera.position.y = Math.sin(rotationX) * radius + 2;
        camera.position.z = Math.cos(rotationY) * Math.cos(rotationX) * radius;
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });
    }

    function resetCamera() {
      camera.position.set(0, 5, 15);
      camera.lookAt(0, 0, 0);
    }

    function renderManage() {
      const container = document.getElementById('manage-npc-list');
      container.innerHTML = npcs.map(npc => `

          <div class="npc-card-header">

              <img src="${npc.avatarUrl}" alt="${npc.name}" class="npc-avatar">
              <div>
                <h3 class="npc-name">${npc.name}</h3>
                <span class="profession-tag" style="background: ${PROFESSION_COLORS[npc.profession]}20; color: ${PROFESSION_COLORS[npc.profession]}">
                  ${PROFESSION_NAMES[npc.profession]}
                </span>
              </div>
            </div>
          </div>
          <div class="health-bar-container">
            <div class="health-bar-bg">
              <div class="health-bar-fill" style="width: ${(npc.health/npc.maxHealth)*100}%"></div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function handleSaveFile() {
      const status = document.getElementById('upload-status');
      status.innerHTML = '<div class="loading"><div class="loading-spinner"></div><span style="margin-left: 16px;">正在解析存档...</span></div>';
      
      setTimeout(() => {
        const newNpcs = [
          { id: 'new-' + Date.now(), name: '新战士' + npcs.length, profession: 'warrior', level: Math.floor(Math.random()*5)+1, health: 80, maxHealth: 100, attack: 15, defense: 10, skills: ['Iron Flesh'], equipment: [], backstory: '从存档中导入的新角色', avatarUrl: `https://api.dicebear.com/7.x/avataaars/svg?seed=${Date.now()}` }
        ];
        npcs.push(...newNpcs);
        status.innerHTML = `<div style="padding: 16px; background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.5); border-radius: 8px;">成功导入 ${newNpcs.length} 个NPC</div>`;
        renderManage();
        document.getElementById('save-file-input').value = '';
      }, 1500);
    }

    function openEditor(npcId = null) {
      editingNpc = npcId ? npcs.find(n => n.id === npcId) : null;
      editorSkills = editingNpc ? [...editingNpc.skills] : [];
      
      document.getElementById('editor-title').textContent = editingNpc ? '编辑NPC' : '创建NPC';
      document.getElementById('editor-name').value = editingNpc?.name || '';
      document.getElementById('editor-profession').value = editingNpc?.profession || 'warrior';
      document.getElementById('editor-level').value = editingNpc?.level || 1;
      document.getElementById('editor-health').value = editingNpc?.health || 100;
      document.getElementById('editor-attack').value = editingNpc?.attack || 10;
      document.getElementById('editor-defense').value = editingNpc?.defense || 10;
      document.getElementById('editor-backstory').value = editingNpc?.backstory || '';
      
      renderEditorSkills();
      document.getElementById('editor-modal').style.display = 'flex';
    }

    function editNpc(id) {
      openEditor(id);
    }

    function closeEditor() {
      document.getElementById('editor-modal').style.display = 'none';
    }

    function handleSkillAdd(e) {
      if (e && e.key !== 'Enter') return;
      const input = document.getElementById('editor-skill-input');
      const skill = input.value.trim();
      if (skill && !editorSkills.includes(skill)) {
        editorSkills.push(skill);
        input.value = '';
        renderEditorSkills();
      }
    }

    function renderEditorSkills() {
      document.getElementById('editor-skills').innerHTML = editorSkills.map(s => `
        <span style="display: inline-block; padding: 4px 8px; background: var(--battle-darker); border: 1px solid rgba(212,175,55,0.2); border-radius: 4px; margin-right: 8px; margin-bottom: 4px;">
          ${s} <span style="cursor: pointer; margin-left: 4px; color: var(--parchment-dark);" onclick="removeSkill('${s}')">×</span>
        </span>
      `).join('');
    }

    function removeSkill(skill) {
      editorSkills = editorSkills.filter(s => s !== skill);
      renderEditorSkills();
    }

    function saveEditor() {
      const npcData = {
        id: editingNpc?.id || 'new-' + Date.now(),
        name: document.getElementById('editor-name').value,
        profession: document.getElementById('editor-profession').value,
        level: parseInt(document.getElementById('editor-level').value),
        health: parseInt(document.getElementById('editor-health').value),
        maxHealth: parseInt(document.getElementById('editor-health').value),
        attack: parseInt(document.getElementById('editor-attack').value),
        defense: parseInt(document.getElementById('editor-defense').value),
        skills: editorSkills,
        equipment: editingNpc?.equipment || [],
        backstory: document.getElementById('editor-backstory').value,
        avatarUrl: editingNpc?.avatarUrl || `https://api.dicebear.com/7.x/avataaars/svg?seed=${Date.now()}`
      };

      if (editingNpc) {
        const index = npcs.findIndex(n => n.id === editingNpc.id);
        npcs[index] = npcData;
      } else {
        npcs.push(npcData);
      }

      closeEditor();
      renderManage();
    }

    function renderScreenshots() {
      const container = document.getElementById('screenshot-list');
      container.innerHTML = screenshots.map(s => `
        <div class="screenshot-card">
          <img src="${s.url}" class="screenshot-img">
          <div class="screenshot-info">
            <h4>${s.title}</h4>
            <p style="font-size: 0.875rem; color: var(--parchment-dark); margin: 8px 0;">${s.description}</p>
            ${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function handleImageFile() {
      const file = document.getElementById('image-file-input').files[0];
      if (!file) return;
      
      const url = URL.createObjectURL(file);
      document.getElementById('image-title').value = file.name.replace(/\.[^/.]+$/, '');
      document.getElementById('image-desc').value = '';
      imageTags = [];
      document.getElementById('image-tags').innerHTML = '';
      document.getElementById('image-editor').style.display = 'block';
    }

    function handleTagAdd(e) {
      if (e && e.key !== 'Enter') return;
      const input = document.getElementById('image-tag-input');
      const tag = input.value.trim();
      if (tag && !imageTags.includes(tag)) {
        imageTags.push(tag);
        input.value = '';
        renderImageTags();
      }
    }

    function renderImageTags() {
      document.getElementById('image-tags').innerHTML = imageTags.map(t => `
        <span class="tag">${t} <span style="cursor: pointer; margin-left: 4px;" onclick="removeImageTag('${t}')">×</span></span>
      `).join('');
    }

    function removeImageTag(tag) {
      imageTags = imageTags.filter(t => t !== tag);
      renderImageTags();
    }

    function uploadImage() {
      const screenshot = {
        id: 'img-' + Date.now(),
        url: 'https://picsum.photos/800/600?random=' + Date.now(),
        title: document.getElementById('image-title').value || '未命名',
        description: document.getElementById('image-desc').value,
        tags: imageTags,
        npcIds: []
      };
      screenshots.push(screenshot);
      document.getElementById('image-editor').style.display = 'none';
      document.getElementById('image-file-input').value = '';
      renderScreenshots();
    }

    showPage('home');
  </script>
</body>
</html>
