<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文物时光机 - 穿越历史，遇见文明</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 粒子背景画布 -->
  <canvas id="particle-canvas"></canvas>

  <!-- 首页：时光之门 -->
  <section id="home-view" class="view active">
    <div class="hero-section">
      <div class="hero-decoration top"></div>
      <h1 class="hero-title">文物时光机</h1>
      <p class="hero-subtitle">点击文物，开启穿越之旅</p>
      <div class="hero-decoration bottom"></div>
    </div>
    <div class="artifact-grid" id="artifact-grid"></div>
  </section>

  <!-- 详情页：穿越场景 -->
  <section id="artifact-view" class="view">
    <nav class="artifact-nav">
      <button class="nav-btn back-btn" id="back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回</span>
      </button>
      <h2 class="nav-title" id="nav-title">文物名称</h2>
      <div class="nav-dynasty" id="nav-dynasty">朝代</div>
    </nav>
    <div class="artifact-content">
      <div class="artifact-main">
        <div class="artifact-image-container">
          <img id="artifact-image" src="" alt="文物图片" loading="lazy">
          <div class="image-frame"></div>
        </div>
        <div class="artifact-info">
          <div class="info-header">
            <span class="info-year" id="info-year"></span>
          </div>
          <div class="story-section">
            <h3>文物故事</h3>
            <p id="story-text"></p>
            <div class="audio-player">
              <button class="audio-btn" id="play-btn">
                <svg class="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="pause-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <span id="play-text">听故事</span>
              </button>
              <div class="audio-wave" id="audio-wave">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="timeline-section">
        <h3>历史时间线</h3>
        <div class="timeline" id="timeline"></div>
      </div>
      <div class="classics-section">
        <h3>古籍引文</h3>
        <div class="classics-list" id="classics-list"></div>
      </div>
      <div class="quiz-cta">
        <button class="quiz-btn" id="quiz-btn">接受智慧考验</button>
      </div>
    </div>
  </section>

  <!-- 问答页：智慧考验 -->
  <section id="quiz-view" class="view">
    <nav class="artifact-nav">
      <button class="nav-btn back-btn" id="quiz-back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回</span>
      </button>
      <h2 class="nav-title">智慧考验</h2>
      <div class="nav-dynasty" id="quiz-dynasty"></div>
    </nav>
    <div class="quiz-content">
      <div class="progress-bar" id="progress-bar"></div>
      <div class="question-card" id="question-card">
        <div class="question-number" id="question-number">问题 1</div>
        <h3 class="question-text" id="question-text"></h3>
        <div class="options-grid" id="options-grid"></div>
        <div class="explanation hidden" id="explanation"></div>
        <button class="next-btn hidden" id="next-btn">下一题</button>
      </div>
      <div class="result-screen hidden" id="result-screen">
        <div class="result-icon">🏆</div>
        <h2 class="result-title">考验完成！</h2>
        <div class="result-score" id="result-score"></div>
        <p class="result-message" id="result-message"></p>
        <div class="result-actions">
          <button class="restart-btn" id="restart-btn">重新挑战</button>
          <button class="home-btn" id="home-btn">探索其他文物</button>
        </div>
      </div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
