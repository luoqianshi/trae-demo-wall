// ============ SCREEN NAVIGATION ============
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

// ============ QUIZ LOGIC ============
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startQuiz() {
  // Pick 3 random questions, one from each type if possible
  var mathQ = shuffle(QUESTION_BANK.filter(function(q) { return q.type === 'math'; }));
  var sciQ = shuffle(QUESTION_BANK.filter(function(q) { return q.type === 'science'; }));
  var funQ = shuffle(QUESTION_BANK.filter(function(q) { return q.type === 'fun'; }));
  
  state.questions = [mathQ[0], sciQ[0], funQ[0]];
  // Shuffle order
  state.questions = shuffle(state.questions);
  state.currentQ = 0;
  state.answers = [];
  state.totalWarm = 0.5;
  state.totalBright = 0.5;
  state.totalTime = 0;
  state.startTime = Date.now();
  
  renderQuestion();
  showScreen('screen-question');
}

function renderQuestion() {
  var q = state.questions[state.currentQ];
  var progress = (state.currentQ / 3) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('qNumber').textContent = '问题 ' + (state.currentQ + 1) + ' / 3';
  document.getElementById('qTypeBadge').textContent = q.typeLabel;
  document.getElementById('qTypeBadge').className = 'q-type-badge q-type-' + q.type;
  document.getElementById('qText').textContent = q.text;
  
  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  var labels = ['A', 'B', 'C'];
  q.options.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = '<span class="opt-dot">' + labels[i] + '</span><span>' + opt.text + '</span>';
    btn.onclick = function() { selectOption(i); };
    container.appendChild(btn);
  });
  
  state.qStartTime = Date.now();
}

function selectOption(optIndex) {
  var q = state.questions[state.currentQ];
  var opt = q.options[optIndex];
  var answerTime = (Date.now() - state.qStartTime) / 1000; // seconds
  
  state.answers.push({ q: q, opt: opt, time: answerTime });
  state.totalWarm += opt.warm;
  state.totalBright += opt.bright;
  state.totalTime += answerTime;
  
  state.currentQ++;
  
  if (state.currentQ >= 3) {
    calculateResult(false);
  } else {
    // Small delay then next question
    setTimeout(renderQuestion, 200);
  }
}

function skipToResult() {
  // No questions answered - random + time factor
  state.questions = [];
  state.answers = [];
  state.totalWarm = 0.5;
  state.totalBright = 0.5;
  state.totalTime = 15; // "waited" a while = more muted/random
  state.startTime = Date.now();
  calculateResult(true);
}

    textIdx = (textIdx + 1) % loadingTexts.length;
    document.getElementById('loadingText').textContent = loadingTexts[textIdx];
    document.getElementById('loadingEmoji').textContent = emojis[textIdx % emojis.length];
  }, 600);
  
  setTimeout(function() {
    clearInterval(loadingInterval);
    
    var warm, bright;
    var now = new Date();
    var hour = now.getHours();
    
    if (skipped) {
      // Skipped = more random, slightly muted
      warm = 0.3 + Math.random() * 0.4;
      bright = 0.3 + Math.random() * 0.4;
    } else {
      // Average the answers
      warm = state.totalWarm / 3;
      bright = state.totalBright / 3;
      
      // Time of day influence
      if (hour >= 6 && hour < 10) {
        // Morning: slightly warmer, brighter
        warm += 0.1; bright += 0.1;
      } else if (hour >= 10 && hour < 16) {
        // Midday: brighter
        bright += 0.05;
      } else if (hour >= 16 && hour < 20) {
        // Evening: warmer
        warm += 0.1;
      } else {
        // Night: cooler, slightly muted
        warm -= 0.1; bright -= 0.1;
      }
      
      // Answer speed influence
      var avgTime = state.totalTime / 3;
      if (avgTime < 1.5) {
        // Fast answers = bolder, brighter
        bright += 0.15;
      } else if (avgTime > 5) {
        // Slow/thoughtful = more muted, cooler
        bright -= 0.1; warm -= 0.05;
      }
      
      // Randomness factor - the "magic" element
      warm += (Math.random() - 0.5) * 0.2;
      bright += (Math.random() - 0.5) * 0.2;
    }
    
    // Clamp
    warm = Math.max(0, Math.min(1, warm));
    bright = Math.max(0, Math.min(1, bright));
    
    // Find closest color
    var bestColor = COLORS[0];
    var bestDist = 999;
    COLORS.forEach(function(c) {
      var dw = c.warm - warm;
      var db = c.bright - bright;
      var dist = Math.sqrt(dw*dw + db*db);
      if (dist < bestDist) { bestDist = dist; bestColor = c; }
    });
    
    // Pick 2 backup colors (neighbors in palette, no repeat)
    var mainIdx = COLORS.indexOf(bestColor);
    var backups = [];
    var used = [mainIdx];
    for (var offset = 1; offset <= 3 && backups.length < 2; offset++) {
      var idx1 = (mainIdx + offset) % COLORS.length;
      var idx2 = (mainIdx - offset + COLORS.length) % COLORS.length;
      if (backups.length < 2 && used.indexOf(idx1) === -1) {
        backups.push(COLORS[idx1]); used.push(idx1);
      }
      if (backups.length < 2 && used.indexOf(idx2) === -1) {
        backups.push(COLORS[idx2]); used.push(idx2);
      }
    }
    
    showResult(bestColor, backups);
  }, 2200);
}

function showResult(main, backups) {
  var circle = document.getElementById('resultCircle');
  circle.style.background = main.hex;
  circle.style.boxShadow = '0 12px 40px ' + main.hex + '55';
  document.getElementById('resultEmoji').textContent = main.emoji;
  document.getElementById('resultName').textContent = main.name;
  document.getElementById('resultName').style.color = main.hex;
  document.getElementById('resultDesc').textContent = main.desc;
  
  var bc = document.getElementById('backupColors');
  bc.innerHTML = '';
  
  // Main color first
  var mainDiv = document.createElement('div');
  mainDiv.className = 'backup-color';
  mainDiv.innerHTML = '<div class="backup-dot" style="background:' + main.hex + ';transform:scale(1.1);box-shadow:0 6px 16px ' + main.hex + '55"></div><div class="backup-label"><span class="backup-main">主选</span></div>';
  bc.appendChild(mainDiv);
  
  backups.forEach(function(c) {
    var div = document.createElement('div');
    div.className = 'backup-color';
    div.innerHTML = '<div class="backup-dot" style="background:' + c.hex + '" onclick="switchColor(\'' + c.hex.replace('#','') + '\',\'' + c.name + '\',\'' + c.emoji + '\',\'' + escapeJs(c.desc) + '\')"></div><div class="backup-label">备选</div>';
    bc.appendChild(div);
  });
  
  showScreen('screen-result');
}

function escapeJs(str) {
  return str.replace(/'/g, "\\'");
}

function switchColor(hex, name, emoji, desc) {
  var fullHex = '#' + hex;
  var circle = document.getElementById('resultCircle');
  circle.style.transform = 'scale(0.8)';
  circle.style.opacity = '0.7';
  setTimeout(function() {
    circle.style.background = fullHex;
    circle.style.boxShadow = '0 12px 40px ' + fullHex + '55';
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultName').textContent = name;
    document.getElementById('resultName').style.color = fullHex;
    document.getElementById('resultDesc').textContent = desc;
    circle.style.transform = 'scale(1)';
    circle.style.opacity = '1';
  }, 200);
}

// ============ ACTIONS ============
function shareResult() {
  var text = '我今天的幸运色是「' + document.getElementById('resultName').textContent + '」！你也来测测今天穿啥颜色吧～';
  if (navigator.share) {
    navigator.share({ title: '今天我穿啥颜色？', text: text }).catch(function(){});
  } else {
    // Copy to clipboard fallback
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制到剪贴板！'); } catch(e) { showToast('截图分享给朋友吧~'); }
    document.body.removeChild(ta);
  }
}

function restart() {
  showScreen('screen-welcome');
  updateDate();
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

// Init
init();
</script>
