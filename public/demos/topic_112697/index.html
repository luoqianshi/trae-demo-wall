<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字漫画 TypeAnim</title>
<style id="theme-vars">
:root {
  --color-primary: #6366f1;
  --color-primary-light: #818cf8;
  --color-primary-dark: #4f46e5;
  --color-primary-bg: rgba(99, 102, 241, 0.08);
  --color-primary-bg-hover: rgba(99, 102, 241, 0.14);
  --color-bg-base: #0f1117;
  --color-bg-elevated: #181a23;
  --color-bg-surface: #1e2030;
  --color-bg-overlay: #252839;
  --color-bg-hover: #2a2d3e;
  --color-border: #2a2d3e;
  --color-border-subtle: #1f2233;
  --color-border-active: #6366f1;
  --color-text-primary: #e4e5eb;
  --color-text-secondary: #9396a8;
  --color-text-tertiary: #5d6077;
  --color-text-inverse: #0f1117;
  --color-state-success: #10b981;
  --color-state-warning: #f59e0b;
  --color-state-error: #ef4444;
  --color-state-info: #3b82f6;
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 32px;
  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.1);
  --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.15);
  --shadow-glow: 0 0 12px rgba(99, 102, 241, 0.3);
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-icon-width: 52px;
  --sidebar-panel-width: 260px;
  --header-height: 44px;
  --timeline-height: 240px;
  --toolbar-height: 40px;
  --z-panel: 10;
  --z-overlay: 100;
  --z-modal: 200;
  --z-tooltip: 300;
}

/* 高级白主题 */
body.theme-light {
  --color-bg-base: #f8f9fb;
  --color-bg-elevated: #ffffff;
  --color-bg-surface: #ffffff;
  --color-bg-overlay: #ffffff;
  --color-bg-hover: #f1f2f6;
  --color-border: #e5e7eb;
  --color-border-subtle: #f0f1f5;
  --color-border-active: #6366f1;
  --color-text-primary: #1f2937;
  --color-text-secondary: #6b7280;
  --color-text-tertiary: #9ca3af;
  --color-text-inverse: #ffffff;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.12);
}
</style>
<script src="lib/lucide.min.js"></script>
<script src="animpresets/plugin-loader.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
[data-icon] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  -webkit-mask-size: contain;
  mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  background-color: currentColor;
}
</style>
</head>
<body>
<main class="app-main flex h-screen overflow-hidden" style="font-family: var(--font-body); font-size: var(--text-base); color: var(--color-text-primary);">

  <!-- ZONE 1: LEFT — Icon Sidebar + Settings Panel -->
  <aside class="left-sidebar flex shrink-0" style="z-index: var(--z-panel);">

    <!-- Icon Sidebar (52px) -->
    <div class="icon-sidebar flex flex-col items-center w-[52px] py-2 gap-1" style="background: var(--color-bg-elevated); border-right: 1px solid var(--color-border);">
      <div class="flex items-center justify-center w-9 h-9 mb-2" style="color: var(--color-primary);">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 4 L4 16 L16 16 L16 8 L10 2 L4 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 11 L13 11 M7 13 L13 13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <button id="togglePanel" class="icon-btn flex items-center justify-center w-9 h-9" title="文字设置">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 3.5 L12 3.5"/>
          <path d="M8 3.5 L8 11"/>
          <path d="M3 13 L13 13" stroke-dasharray="2 2"/>
        </svg>
      </button>
      <button id="comicToggleBtn" class="icon-btn flex items-center justify-center w-9 h-9" title="动画预设">
        <i data-lucide="layout-grid" style="width:16px; height:16px;"></i>
      </button>
      <button id="presetToggleBtn" class="icon-btn flex items-center justify-center w-9 h-9" title="动画元素">
        <i data-lucide="sliders-horizontal" style="width:16px; height:16px;"></i>
      </button>
      <button id="castToggleBtn" class="icon-btn flex items-center justify-center w-9 h-9" title="演员表">
        <i data-lucide="users" style="width:16px; height:16px;"></i>
      </button>
      <button id="zimanhuaToggleBtn" class="icon-btn active flex items-center justify-center w-9 h-9" title="字漫画">
        <i data-lucide="film" style="width:16px; height:16px;"></i>
      </button>
      <div class="flex-1"></div>
      <button id="themeToggleBtn" class="icon-btn flex items-center justify-center w-9 h-9" title="切换界面主题">
        <i data-lucide="sun" style="width:16px; height:16px;"></i>
      </button>
      <button id="collapseLeftBtn" class="icon-btn flex items-center justify-center w-9 h-9 mb-1" title="收起面板">
        <i data-lucide="panel-left-close" style="width:16px; height:16px;"></i>
      </button>
    </div>

    <!-- Settings Panel (260px) -->
    <div class="left-container flex flex-col w-[260px] overflow-y-auto no-scrollbar" style="background: var(--color-bg-surface); border-right: 1px solid var(--color-border);">
      <!-- 设置栏 -->
      <div class="left-panel" id="settingsPanel" style="display:none">
        <div class="panel">
          <div class="group col"><label>选择字体</label><select id="fontSelect"><option value="XXOBS-VF.ttf">象形甲骨文</option><option value="XXSC-VF.ttf">象形简体</option><option value="XXTC-VF.ttf">象形繁体</option></select></div>
          <div class="group col"><label>文字内容</label><textarea id="customText" placeholder="选中文字块后编辑"></textarea></div>
          <div class="group row"><label>字体大小</label><input type="range" id="fontSize" min="12" max="9999" value="50"><input type="number" id="fsNum" value="50" min="12" max="9999"></div>
          <div class="group row"><label>字重</label><input type="range" id="wght" min="100" max="900" value="400"><input type="number" id="wNum" value="400" min="100" max="900"></div>
          <div class="group colors-row"><label>字体颜色</label><input type="color" id="textColor" value="#111111"><label>背景颜色</label><input type="color" id="bgColor" value="#f8f8f8"></div>
          <div class="group row"><label>旋转角度</label><input type="range" id="rotate" min="-180" max="180" value="0"><input type="number" id="rotateNum" value="0" min="-180" max="180"><span>°</span></div>
            <div class="group buttons-grid tools-grid">
<button id="flipXBtn" class="btn" title="水平翻转"><span class="btn-icon">↔</span><span class="btn-text">水平</span></button>
<button id="flipYBtn" class="btn" title="垂直翻转"><span class="btn-icon">↕</span><span class="btn-text">垂直</span></button>
<button id="verticalBtn" class="btn" title="竖排/横排"><span class="btn-icon">↕</span><span class="btn-text">竖排</span></button>
            </div>
          <div class="group buttons-grid tools-grid">
            <button id="clearBtn" class="btn btn-clear" title="清空展示区"><span class="btn-icon">🗑</span><span class="btn-text">清除</span></button>
            <button id="resetBtn" class="btn btn-reset" title="还原初始设置"><span class="btn-icon">↺</span><span class="btn-text">重置</span></button>
          </div>
          <div class="group buttons-grid action-grid">
            <button id="toggleCam" class="btn" title="开启摄像头"><span class="btn-icon">📷</span><span class="btn-text">拍照</span></button>
            <button id="startVoice" class="btn btn-voice" title="开始语音输入"><span class="btn-icon">🎤</span><span class="btn-text">语音</span></button>
            <button id="langBtn" class="btn btn-cant" title="切换语言"><span class="btn-icon">🌐</span><span class="btn-text">中文</span></button>
            <button id="puncBtn" class="btn btn-punc" title="标点符号"><span class="btn-icon">✏</span><span class="btn-text">标点</span></button>
          </div>
        </div>
      </div>
      <!-- 动画预设栏 -->
      <div class="comic-panel" id="comicPanel" style="display:none">
        <div class="panel">
          <div class="comic-grid" id="comicGrid"></div>
        </div>
      </div>
      <!-- 动画元素栏 -->
      <div class="preset-panel" id="presetPanel" style="display:none">
        <div class="panel">
          <div class="preset-hint">拖动到右侧展示区创建文字块</div>
          <div class="preset-items" id="presetItems"></div>
          <button class="preset-add-btn" id="presetAddBtn" title="保存当前设置">+</button>
          <div class="preset-import-export">
            <button class="preset-btn" id="presetExportBtn" title="导出预设">📤</button>
            <button class="preset-btn" id="presetImportBtn" title="导入预设">📥</button>
          </div>
        </div>
      </div>
      <!-- 演员表栏 -->
      <div class="cast-panel" id="castPanel" style="display:none">
        <div class="panel">
          <div class="cast-hint">演员列表</div>
          <div class="cast-items" id="castItems"></div>
        </div>
      </div>
      <!-- 字漫画栏 -->
      <div class="zimanhua-panel" id="zimanhuaPanel">
        <div class="panel">
          <div class="zimanhua-header" style="display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px;">
            <span style="font-size:13px;font-weight:600;color:var(--color-text-primary,#333);">字漫画</span>
            <button id="zimanhuaRefreshBtn" style="border:1px solid #cbd5e1;border-radius:4px;background:transparent;cursor:pointer;padding:2px 6px;font-size:11px;color:var(--color-text-secondary,#666);">刷新</button>
          </div>
          <div style="display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;">
            <button class="zimanhua-size-btn active" data-ratio="16:9" style="flex:1;min-width:40px;padding:3px 0;font-size:11px;border:1px solid var(--color-border,#e2e8f0);border-radius:4px;background:var(--color-primary,#6366f1);color:#fff;cursor:pointer;">16:9</button>
            <button class="zimanhua-size-btn" data-ratio="4:3" style="flex:1;min-width:40px;padding:3px 0;font-size:11px;border:1px solid var(--color-border,#e2e8f0);border-radius:4px;background:var(--color-bg-surface,#fff);color:var(--color-text-secondary,#666);cursor:pointer;">4:3</button>
            <button class="zimanhua-size-btn" data-ratio="1:1" style="flex:1;min-width:40px;padding:3px 0;font-size:11px;border:1px solid var(--color-border,#e2e8f0);border-radius:4px;background:var(--color-bg-surface,#fff);color:var(--color-text-secondary,#666);cursor:pointer;">1:1</button>
            <button class="zimanhua-size-btn" data-ratio="3:4" style="flex:1;min-width:40px;padding:3px 0;font-size:11px;border:1px solid var(--color-border,#e2e8f0);border-radius:4px;background:var(--color-bg-surface,#fff);color:var(--color-text-secondary,#666);cursor:pointer;">3:4</button>
            <button class="zimanhua-size-btn" data-ratio="9:16" style="flex:1;min-width:40px;padding:3px 0;font-size:11px;border:1px solid var(--color-border,#e2e8f0);border-radius:4px;background:var(--color-bg-surface,#fff);color:var(--color-text-secondary,#666);cursor:pointer;">9:16</button>
          </div>
          <div id="zimanhuaGrid" style="flex:1;min-height:0;overflow-y:auto;padding-bottom:8px;"></div>
          <div style="display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--color-border,#e2e8f0);">
            <button class="quick-add-btn" id="zimanhuaSaveBtn" style="background:#0ea5e9;flex:1;font-size:11px;padding:4px 0;" title="保存动画">
              <i data-lucide="download" style="width:13px;height:13px;display:inline;vertical-align:middle;"></i>
              <span>保存</span>
            </button>
            <button class="quick-add-btn" id="zimanhuaLoadBtn" style="background:#64748b;flex:1;font-size:11px;padding:4px 0;" title="加载动画">
              <i data-lucide="upload" style="width:13px;height:13px;display:inline;vertical-align:middle;"></i>
              <span>加载</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- 拖动调整左侧区域宽度的分隔条 -->
    <div class="resize-handle resize-handle-horizontal resize-handle-right" id="resizeLeftHandle"></div>
  </aside>

  <!-- ZONE 2: RIGHT — Canvas Area + Timeline -->
  <section class="right-section flex flex-col flex-1 min-w-0">

    <!-- TOP: File Tabs Bar + Preview Canvas -->
    <div class="preview-area flex flex-col flex-1 min-w-0">

      <!-- Menu Bar -->
      <div class="top-menu-bar flex items-center shrink-0 px-2 gap-1" style="background: var(--color-bg-elevated); border-bottom: 1px solid var(--color-border);">
        <div class="menu-items flex items-center gap-1 flex-1">
          <div class="menu-item-wrapper">
            <button class="menu-item-btn" data-menu="file">文件</button>
            <div class="menu-dropdown" data-menu="file">
                <button class="menu-dropdown-item" id="menuNewFile"><i data-lucide="plus" style="width:14px; height:14px;"></i><span>新建</span></button>
                <button class="menu-dropdown-item" id="menuOpenFile"><i data-lucide="folder-open" style="width:14px; height:14px;"></i><span>打开</span></button>
                <button class="menu-dropdown-item" id="menuSaveFile"><i data-lucide="save" style="width:14px; height:14px;"></i><span>保存</span></button>
                <button class="menu-dropdown-item" id="menuSaveAsFile"><i data-lucide="file-plus" style="width:14px; height:14px;"></i><span>另存为</span></button>
                <div class="menu-divider"></div>
                <button class="menu-dropdown-item" id="menuExportVideo"><i data-lucide="video" style="width:14px; height:14px;"></i><span>导出视频</span></button>
              </div>
          </div>
          <div class="menu-item-wrapper">
            <button class="menu-item-btn" data-menu="edit">编辑</button>
            <div class="menu-dropdown" data-menu="edit">
              <button class="menu-dropdown-item" id="menuCopy"><i data-lucide="copy" style="width:14px; height:14px;"></i><span>复制</span><span class="menu-shortcut">Ctrl+C</span></button>
              <button class="menu-dropdown-item" id="menuPaste"><i data-lucide="clipboard-paste" style="width:14px; height:14px;"></i><span>粘贴</span><span class="menu-shortcut">Ctrl+V</span></button>
              <button class="menu-dropdown-item" id="menuPasteOriginal"><i data-lucide="clipboard-list" style="width:14px; height:14px;"></i><span>原位粘贴</span><span class="menu-shortcut">Ctrl+B</span></button>
              <div class="menu-divider"></div>
              <button class="menu-dropdown-item" id="menuDelete"><i data-lucide="trash-2" style="width:14px; height:14px;"></i><span>删除</span><span class="menu-shortcut">Delete</span></button>
            </div>
          </div>
          <div class="menu-item-wrapper">
            <button class="menu-item-btn" data-menu="view">视图</button>
            <div class="menu-dropdown" data-menu="view">
              <button class="menu-dropdown-item" id="menuToggleGrid"><i data-lucide="grid-3x3" style="width:14px; height:14px;"></i><span>显示网格</span></button>
              <div class="menu-divider"></div>
              <div class="menu-submenu-wrapper" style="position:relative;">
                <button class="menu-dropdown-item" id="menuExportSize"><i data-lucide="crop" style="width:14px; height:14px;"></i><span>导出尺寸</span><i data-lucide="chevron-right" style="width:12px; height:12px; margin-left:auto;"></i></button>
                <div class="menu-dropdown-submenu" id="exportSizeSubmenu" style="position:absolute; left:100%; top:0; min-width:120px;">
                  <button class="menu-dropdown-item export-size-option" data-size="16:9">16:9</button>
                  <button class="menu-dropdown-item export-size-option" data-size="4:3">4:3</button>
                  <button class="menu-dropdown-item export-size-option" data-size="1:1">1:1</button>
                  <button class="menu-dropdown-item export-size-option" data-size="3:4">3:4</button>
                  <button class="menu-dropdown-item export-size-option" data-size="9:16">9:16</button>
                </div>
              </div>
              <div class="menu-divider"></div>
              <button class="menu-dropdown-item" id="menuZoomIn"><i data-lucide="zoom-in" style="width:14px; height:14px;"></i><span>放大</span><span class="menu-shortcut">Ctrl++</span></button>
              <button class="menu-dropdown-item" id="menuZoomOut"><i data-lucide="zoom-out" style="width:14px; height:14px;"></i><span>缩小</span><span class="menu-shortcut">Ctrl+-</span></button>
              <button class="menu-dropdown-item" id="menuZoomReset"><i data-lucide="maximize-2" style="width:14px; height:14px;"></i><span>重置缩放</span><span class="menu-shortcut">Ctrl+0</span></button>
            </div>
          </div>
          <div class="menu-item-wrapper">
            <button class="menu-item-btn" data-menu="animation">动画</button>
            <div class="menu-dropdown" data-menu="animation">
              <button class="menu-dropdown-item" id="menuPlay"><i data-lucide="play" style="width:14px; height:14px;"></i><span>播放/暂停</span><span class="menu-shortcut">Space</span></button>
              <div class="menu-divider"></div>
              <button class="menu-dropdown-item" id="menuQuickAdd"><i data-lucide="zap" style="width:14px; height:14px;"></i><span>快速添加动画</span></button>
              <button class="menu-dropdown-item" id="menuWeightAnim"><i data-lucide="bold" style="width:14px; height:14px;"></i><span>字重动画</span></button>
              <button class="menu-dropdown-item" id="menuDrawPath"><i data-lucide="pen-tool" style="width:14px; height:14px;"></i><span>绘制路径</span></button>
              <button class="menu-dropdown-item" id="menuCameraMotion"><i data-lucide="camera" style="width:14px; height:14px;"></i><span>镜头运镜</span></button>
              <button class="menu-dropdown-item" id="menuInsertImage"><i data-lucide="image" style="width:14px; height:14px;"></i><span>插入图片</span></button>
              <button class="menu-dropdown-item" id="menuInsertVideo"><i data-lucide="video" style="width:14px; height:14px;"></i><span>插入视频</span></button>
              <div class="menu-divider"></div>
              <button class="menu-dropdown-item" id="menuSaveAnim"><i data-lucide="download" style="width:14px; height:14px;"></i><span>保存动画预设</span></button>
              <button class="menu-dropdown-item" id="menuLoadAnim"><i data-lucide="upload" style="width:14px; height:14px;"></i><span>加载动画预设</span></button>
              <div class="menu-divider"></div>
              <button class="menu-dropdown-item" id="menuImportPlugin"><i data-lucide="file-up" style="width:14px; height:14px;"></i><span>导入插件</span></button>
              <button class="menu-dropdown-item" id="menuExportPlugin"><i data-lucide="file-down" style="width:14px; height:14px;"></i><span>导出插件</span></button>
              <button class="menu-dropdown-item" id="menuPluginList"><i data-lucide="list" style="width:14px; height:14px;"></i><span>插件列表</span></button>
            </div>
          </div>
          <div class="menu-item-wrapper">
            <button class="menu-item-btn" data-menu="panel">面板</button>
            <div class="menu-dropdown" data-menu="panel">
              <button class="menu-dropdown-item" id="menuTextSettings"><i data-lucide="type" style="width:14px; height:14px;"></i><span>文字设置</span></button>
              <button class="menu-dropdown-item" id="menuAnimPresets"><i data-lucide="layout-grid" style="width:14px; height:14px;"></i><span>动画预设</span></button>
              <button class="menu-dropdown-item" id="menuAnimElements"><i data-lucide="sliders-horizontal" style="width:14px; height:14px;"></i><span>动画元素</span></button>
              <button class="menu-dropdown-item" id="menuCast"><i data-lucide="users" style="width:14px; height:14px;"></i><span>演员表</span></button>
              <button class="menu-dropdown-item" id="menuZimanhua"><i data-lucide="film" style="width:14px; height:14px;"></i><span>字漫画</span></button>
              <div class="menu-divider"></div>
              <button class="menu-dropdown-item" id="menuToggleTheme"><i data-lucide="sun" style="width:14px; height:14px;"></i><span>切换主题</span></button>
            </div>
          </div>
          <div class="menu-item-wrapper">
            <button class="menu-item-btn" data-menu="help">帮助</button>
            <div class="menu-dropdown" data-menu="help">
              <button class="menu-dropdown-item" id="menuTutorial"><i data-lucide="book-open" style="width:14px; height:14px;"></i><span>教学</span></button>
              <button class="menu-dropdown-item" id="menuPluginHelp"><i data-lucide="puzzle" style="width:14px; height:14px;"></i><span>导入动画插件说明</span></button>
              <div class="menu-divider"></div>
              <button class="menu-dropdown-item" id="menuAbout"><i data-lucide="info" style="width:14px; height:14px;"></i><span>关于</span></button>
            </div>
          </div>
        </div>
        <div class="menu-actions flex items-center gap-1">
        </div>
      </div>

      <!-- Preview Canvas -->
      <div class="preview-container flex-1 flex items-center justify-center relative overflow-hidden" id="previewContainer">
        <div class="content-layer" id="contentLayer">
        <div class="bg-images-container" id="bgImagesContainer"></div>
        <div class="videos-container" id="videosContainer"></div>
        <div class="blocks-container" id="blocksContainer"></div>
        <div class="camera-area">
          <video id="camera" autoplay muted playsinline></video>
        </div>
        </div>
        <!-- 导出尺寸虚框（在播放条上方） -->
        <div class="export-frame-guide" id="exportFrameGuide">
          <div class="frame-label" id="frameLabel">16:9</div>
        </div>
        <!-- 两侧渐变遮罩 -->
        <div class="export-frame-mask export-frame-mask-left"></div>
        <div class="export-frame-mask export-frame-mask-right"></div>
        <!-- Player Controls Overlay -->
        <div class="player-overlay" id="playerOverlay">
          <div class="player-controls" id="playerControls">
            <div class="player-left">
              <button class="player-btn play-btn" id="playerPlayBtn" title="播放">
                <i data-lucide="play" style="width:16px; height:16px;"></i>
              </button>
              <button class="player-btn" id="playerLoopBtn" title="循环播放">
                <i data-lucide="repeat" style="width:16px; height:16px;"></i>
              </button>
            </div>
            <div class="player-center">
              <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-thumb" id="progressThumb"></div>
              </div>
              <div class="time-display">
                <span id="currentTime">00:00</span>
                <span>/</span>
                <span id="totalTime">00:00</span>
              </div>
            </div>
            <div class="player-right">
              <div class="volume-control">
                <button class="player-btn" id="playerMuteBtn" title="静音">
                  <i data-lucide="volume-2" style="width:14px; height:14px;"></i>
                </button>
                <input type="range" id="volumeSlider" min="0" max="100" value="100">
              </div>
              <button class="player-btn" id="playerFullscreenBtn" title="全屏">
                <i data-lucide="maximize" style="width:14px; height:14px;"></i>
              </button>
            </div>
          </div>
        </div>
        
      </div>
    </div>

    <!-- BOTTOM: Timeline -->
    <div class="timeline-area flex flex-col shrink-0" id="timelineArea" style="height: 240px; background: var(--color-bg-elevated); border-top: 1px solid var(--color-border);">
      <!-- 拖动调整时间轴高度的分隔条 -->
      <div class="resize-handle resize-handle-vertical resize-handle-top" id="resizeTimelineHandle"></div>
      <div class="keyframes-container" id="keyframesContainer">
        <div class="keyframes-header">
          <span class="keyframes-title">字漫画时间轴</span>
          <div class="w-px h-5" style="background: var(--color-border);"></div>
          <!-- 播放按钮保留但隐藏，JS依赖它 -->
          <button class="play-keyframes-btn" id="playKeyframesBtn" title="播放" style="display:none !important;">
            <i data-lucide="play" style="width:14px; height:14px;"></i>
          </button>
          <button class="quick-add-btn" id="quickAddAnimBtn" style="background: #6366f1;" title="一键加入动画">
            <i data-lucide="zap" style="width:13px; height:13px;"></i>
            <span>快速添加</span>
          </button>
          <button class="quick-add-btn" id="quickAddWeightAnimBtn" style="background: #f97316;" title="一键加入字重动画">
            <i data-lucide="type" style="width:13px; height:13px;"></i>
            <span>字重动画</span>
          </button>
          <button class="quick-add-btn" id="drawPathBtn" style="background:#8b5cf6;" title="绘制路径动画">
            <i data-lucide="pen-tool" style="width:13px; height:13px;"></i>
            <span>绘制路径</span>
          </button>
          <button class="quick-add-btn" id="bgAnimBtn" style="background:#10b981;" title="镜头运镜">
            <i data-lucide="sparkles" style="width:13px; height:13px;"></i>
            <span>镜头运镜</span>
          </button>
          <button class="quick-add-btn" id="addImageBtn" style="background:#10b981;" title="插入图片">
            <i data-lucide="image" style="width:13px; height:13px;"></i>
            <span>插入图片</span>
          </button>
          <button class="quick-add-btn" id="addVideoBtn" style="background:#06b6d4;" title="插入视频">
            <i data-lucide="video" style="width:13px; height:13px;"></i>
            <span>插入视频</span>
          </button>
          <div class="w-px h-5" style="background: var(--color-border);"></div>
          <button class="quick-add-btn" id="saveAnimBtn" style="background:#0ea5e9;" title="保存动画">
            <i data-lucide="download" style="width:13px; height:13px;"></i>
            <span>保存动画</span>
          </button>
          <button class="export-video-btn" id="exportVideoBtn" title="导出视频">
            <i data-lucide="video" style="width:13px; height:13px;"></i>
            <span>导出视频</span>
          </button>
          <button class="export-video-btn" id="exportGifBtn" title="导出GIF" style="background:#10b981;">
            <i data-lucide="image-play" style="width:13px; height:13px;"></i>
            <span>导出GIF</span>
          </button>
          <button class="quick-add-btn" id="toggleGridBtn" style="background:#f59e0b;" title="显示/隐藏网格">
            <i data-lucide="grid-3x3" style="width:13px; height:13px;"></i>
            <span>网格</span>
          </button>
          <button class="toolbar-dropdown" id="sizeDropBtn" title="尺寸">📐 ▾</button>
          <div class="toolbar-dropdown-panel" id="sizeDropPanel">
            <button class="drop-item" data-ratio="16:9">16:9</button>
            <button class="drop-item" data-ratio="4:3">4:3</button>
            <button class="drop-item" data-ratio="1:1">1:1</button>
            <button class="drop-item" data-ratio="3:4">3:4</button>
            <button class="drop-item" data-ratio="9:16">9:16</button>
          </div>

        </div>

        <div class="keyframes-timeline" id="keyframesTimeline">
          <div class="timeline-ruler" id="timelineRuler"></div>
          <div class="keyframes-tracks" id="keyframesTracks"></div>
          <div class="timeline-playhead" id="timelinePlayhead"></div>
        </div>
        <!-- 修改动画弹窗 -->
        <div class="edit-anim-modal" id="editAnimModal" style="display:none">
          <div class="edit-anim-content" style="width:520px;max-width:95%">
            <div class="edit-anim-header">
              <span>修改动画</span>
              <button class="close-modal-btn" id="closeEditAnimModal">×</button>
            </div>
            <div class="edit-anim-body">
              <div class="edit-anim-section" id="editAnimTypeSection">
                <label>动画类型</label>
                <div class="edit-anim-type-buttons">
                  <button class="anim-type-btn active" data-type="in">入场</button>
                  <button class="anim-type-btn active" data-type="preset">动画预设</button>
                  <button class="anim-type-btn" data-type="weight">字重动画</button>
                  <button class="anim-type-btn" data-type="path">路径动画</button>
                  <button class="anim-type-btn" data-type="out">出场</button>
                </div>
              </div>
              <div class="edit-anim-section">
                <label id="editAnimEffectLabel">动画效果（点击添加）</label>
                <div class="edit-anim-effect-buttons" id="editAnimEffectButtons"></div>
              </div>
              <div class="edit-anim-section" id="selectedAnimsSection">
                <label>已选动画列表（可单独设置时间）</label>
                <div class="selected-anims-list" id="selectedAnimsList"></div>
              </div>
              <div class="edit-anim-section" id="newAnimTimeSection">
                <label>新增动画的时间设置</label>
                <div style="display:flex;gap:12px">
                  <div style="flex:1">
                    <label style="font-size:11px;color:#64748b">开始时间（秒）</label>
                    <input type="number" class="edit-anim-time-input" id="editAnimStartTime" step="0.5" min="0" style="margin-top:4px">
                  </div>
                  <div style="flex:1">
                    <label style="font-size:11px;color:#64748b">持续时间（秒）</label>
                    <input type="number" class="edit-anim-time-input" id="editAnimDuration" step="0.5" min="0.5" style="margin-top:4px">
                  </div>
                </div>
                <div style="display:flex;gap:12px;margin-top:12px">
                  <div style="flex:1">
                    <label style="font-size:11px;color:#64748b">旋转角度（度）</label>
                    <input type="number" class="edit-anim-time-input" id="editAnimRotate" step="15" min="-360" max="360" value="0" style="margin-top:4px">
                  </div>
                  <div style="flex:1;display:flex;align-items:flex-end;gap:8px">
                    <button class="flip-btn" id="flipXBtn" style="flex:1;padding:6px 12px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;cursor:pointer;font-size:12px" title="水平翻转">↔</button>
                    <button class="flip-btn" id="flipYBtn" style="flex:1;padding:6px 12px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;cursor:pointer;font-size:12px" title="垂直翻转">↕</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="edit-anim-footer">
              <button class="cancel-btn" id="cancelEditAnim" title="取消">✕</button>
              <button class="confirm-btn" id="confirmEditAnim" title="确定">✓</button>
            </div>
          </div>
        </div>
      </div>

        <!-- 背景层动画编辑弹窗 -->
        <div class="edit-anim-modal" id="bgAnimModal" style="display:none">
          <div class="edit-anim-content">
            <div class="edit-anim-header">
              <span>镜头运镜</span>
              <button class="close-modal-btn" id="closeBgAnimModal">×</button>
            </div>
            <div class="edit-anim-body">
              <div class="edit-anim-section">
                <label>运镜类型</label>
                <div class="edit-anim-type-buttons" style="flex-wrap: wrap; gap: 6px;">
                  <button class="anim-type-btn active" data-motion="left">← 左移</button>
                  <button class="anim-type-btn" data-motion="right">右移 →</button>
                  <button class="anim-type-btn" data-motion="up">↑ 上移</button>
                  <button class="anim-type-btn" data-motion="down">下移 ↓</button>
                  <button class="anim-type-btn" data-motion="none">不移</button>
                  <button class="anim-type-btn" data-motion="zoomIn">放大</button>
                  <button class="anim-type-btn" data-motion="zoomOut">缩小</button>
                  <button class="anim-type-btn" data-motion="noneScale">无缩放</button>
                </div>
              </div>
              <div class="edit-anim-section">
                <label>旋转类</label>
                <div class="edit-anim-type-buttons" style="flex-wrap: wrap; gap: 6px;">
                  <button class="anim-type-btn" data-motion="orbit">环绕</button>
                  <button class="anim-type-btn" data-motion="orbitCW">顺时针环绕</button>
                  <button class="anim-type-btn" data-motion="orbitCCW">逆时针环绕</button>
                  <button class="anim-type-btn" data-motion="orbitZoomIn">环绕推进</button>
                  <button class="anim-type-btn" data-motion="orbitZoomOut">环绕拉远</button>
                  <button class="anim-type-btn" data-motion="orbitTilt">倾斜环绕</button>
                  <button class="anim-type-btn" data-motion="orbitDouble">双圈环绕</button>
                  <button class="anim-type-btn" data-motion="rollLeft">左歪</button>
                  <button class="anim-type-btn" data-motion="rollRight">右歪</button>
                  <button class="anim-type-btn" data-motion="spin">回旋旋转</button>
                </div>
              </div>
              <div class="edit-anim-section">
                <label>3D环绕</label>
                <div class="edit-anim-type-buttons" style="flex-wrap: wrap; gap: 6px;">
                  <button class="anim-type-btn" data-motion="orbitFlipX">翻转环绕</button>
                  <button class="anim-type-btn" data-motion="orbitFlipY">俯仰环绕</button>
                  <button class="anim-type-btn" data-motion="orbitSpiral">螺旋上升</button>
                  <button class="anim-type-btn" data-motion="orbitRoll">滚筒环绕</button>
                  <button class="anim-type-btn" data-motion="orbitDolly">远近环绕</button>
                  <button class="anim-type-btn" data-motion="orbitPendulum">摆锤环绕</button>
                </div>
              </div>
              <div class="edit-anim-section">
                <label>位移类</label>
                <div class="edit-anim-type-buttons" style="flex-wrap: wrap; gap: 6px;">
                  <button class="anim-type-btn" data-motion="tracking">横移跟随</button>
                  <button class="anim-type-btn" data-motion="dollyIn">纵深推进</button>
                  <button class="anim-type-btn" data-motion="dollyOut">纵深拉远</button>
                  <button class="anim-type-btn" data-motion="diagUL">↖ 斜滑</button>
                  <button class="anim-type-btn" data-motion="diagDR">斜滑 ↘</button>
                </div>
              </div>
              <div class="edit-anim-section">
                <label>特效类</label>
                <div class="edit-anim-type-buttons" style="flex-wrap: wrap; gap: 6px;">
                  <button class="anim-type-btn" data-motion="shake">震动</button>
                  <button class="anim-type-btn" data-motion="ease">缓入缓出</button>
                  <button class="anim-type-btn" data-motion="zoomPunch">急冲急停</button>
                  <button class="anim-type-btn" data-motion="slowPan">慢速漫游</button>
                </div>
              </div>
              <div class="edit-anim-section">
                <label>复合运镜</label>
                <div class="edit-anim-type-buttons" style="flex-wrap: wrap; gap: 6px;">
                  <button class="anim-type-btn" data-motion="panZoom">平移+缩放</button>
                  <button class="anim-type-btn" data-motion="orbitShake">环绕+震动</button>
                  <button class="anim-type-btn" data-motion="slideSpin">斜滑+旋转</button>
                </div>
              </div>
              <div class="edit-anim-section" style="border-top:1px solid #e2e8f0;padding-top:10px;margin-top:5px;">
                <label style="color:#6366f1;font-weight:bold;">3D空间运镜（相机模式）</label>
                <div class="edit-anim-type-buttons" style="flex-wrap: wrap; gap: 6px;">
                  <button class="anim-type-btn" data-motion="camOrbit">3D环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitCW">3D顺时针</button>
                  <button class="anim-type-btn" data-motion="camOrbitTilt">3D倾斜环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitZoom">3D环绕缩放</button>
                  <button class="anim-type-btn" data-motion="camDollyIn">3D推进</button>
                  <button class="anim-type-btn" data-motion="camDollyOut">3D拉远</button>
                  <button class="anim-type-btn" data-motion="camPushIn">3D推入</button>
                  <button class="anim-type-btn" data-motion="camPullOut">3D拉出</button>
                  <button class="anim-type-btn" data-motion="camPanLeft">3D左摇</button>
                  <button class="anim-type-btn" data-motion="camPanRight">3D右摇</button>
                  <button class="anim-type-btn" data-motion="camTiltUp">3D上摇</button>
                  <button class="anim-type-btn" data-motion="camTiltDown">3D下摇</button>
                  <button class="anim-type-btn" data-motion="camRoll">3D滚转</button>
                  <button class="anim-type-btn" data-motion="camSpiral">3D螺旋</button>
                  <button class="anim-type-btn" data-motion="camFlyThrough">3D穿越</button>
                  <button class="anim-type-btn" data-motion="camShake3D">3D震动</button>
                  <button class="anim-type-btn" data-motion="camCraneUp">3D升镜头</button>
                  <button class="anim-type-btn" data-motion="camCraneDown">3D降镜头</button>
                  <button class="anim-type-btn" data-motion="camTruckLeft">3D左移</button>
                  <button class="anim-type-btn" data-motion="camTruckRight">3D右移</button>
                  <button class="anim-type-btn" data-motion="camOrbitEllipse">椭圆环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitWave">波浪环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitFigure8">8字环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitTumble">翻滚环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitDrop">俯冲环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitZoomEllipse">椭圆缩放</button>
                  <button class="anim-type-btn" data-motion="camOrbitPan">平扫环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitCrane">升降环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitSway">摇摆环绕</button>
                  <button class="anim-type-btn" data-motion="camOrbitDolly">推拉环绕</button>
                </div>
              </div>
              <div class="edit-anim-section">
                <label>强度参数</label>
                <input type="number" class="edit-anim-time-input" id="bgMoveDistance" value="100" step="10" min="0" max="2000">
                <span style="font-size: 11px; color: #94a3b8; margin-left: 5px;">位移/震动强度（像素）</span>
              </div>
              <div class="edit-anim-section">
                <label>缩放比例</label>
                <input type="number" class="edit-anim-time-input" id="bgScaleValue" value="1.5" step="0.1" min="0.1" max="5">
              </div>
              <div class="edit-anim-section">
                <label>开始时间（秒）</label>
                <input type="number" class="edit-anim-time-input" id="bgStartTime" step="0.1" min="0">
              </div>
              <div class="edit-anim-section">
                <label>持续时间（秒）</label>
                <input type="number" class="edit-anim-time-input" id="bgDuration" step="0.1" min="0.5" value="2">
              </div>
            </div>
            <div class="edit-anim-footer">
              <button class="cancel-btn" id="cancelBgAnim" title="取消">✕</button>
              <button class="confirm-btn" id="confirmBgAnim" title="确定">✓</button>
            </div>
          </div>
        </div>

    </div>
  </section>
</main>

<div id="tips"></div>

<script src="lib/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<input type="file" id="bgImageInput" accept="image/*" style="display:none" multiple>
<input type="file" id="videoInput" accept="video/*" style="display:none">
<script src="app.js"></script>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <div class="confirm-title" id="confirmTitle"></div>
    <div class="confirm-buttons">
      <button class="confirm-btn confirm-btn-cancel" id="confirmCancel">取消</button>
      <button class="confirm-btn confirm-btn-ok" id="confirmOk">确定</button>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
