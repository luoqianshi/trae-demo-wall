  <title>简历初诊室 - AI求职教练</title>
  <style>
    /* === Theme CSS variables === */
    :root {
      --bg: #ffffff;
      --bg2: #f0f7ff;
      --bg3: #e8f4fd;
      --ink: #1e3a5f;
      --ink-light: #4a6fa5;
      --muted: #7a8ba3;
      --rule: #d0e3f0;
      --accent: #2563eb;
      --accent-light: #3b82f6;
      --accent-dark: #1d4ed8;
      --accent2: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      --max: 900px;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(37, 99, 235, 0.1);
      --shadow-lg: 0 8px 40px rgba(37, 99, 235, 0.15);
    }

    /* === Base styles === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg3) 100%);
      min-height: 100vh;
      line-height: 1.7;
      padding: 2rem 1rem;
    }

    /* === Container === */
    .container {
      max-width: var(--max);
      margin: 0 auto;
    }

    /* === Header === */
    .header {
      text-align: center;
      padding: 2rem 0 3rem;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1rem;
    }
    .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
    }
    .logo-icon svg {
      width: 32px;
      height: 32px;
      fill: white;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 1.125rem;
      color: var(--ink-light);
      margin-top: 0.5rem;
    }

    /* === Card === */
    .card {
      background: var(--bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    /* === Input Section === */
    .input-section {
      border: 2px solid var(--rule);
      transition: border-color 0.3s ease;
    }
    .input-section:focus-within {
      border-color: var(--accent);
    }
    .input-group {
      margin-bottom: 1.5rem;
    }
    .input-group:last-of-type {
      margin-bottom: 0;
    }
    .input-label {
      display: block;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      padding: 1rem;
      border: 1px solid var(--rule);
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--bg2);
      resize: vertical;
      transition: all 0.3s ease;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    textarea::placeholder {
      color: var(--muted);
    }

    /* === File Upload === */
    .file-upload-area {
      border: 2px dashed var(--rule);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
      background: var(--bg2);
    }
    .file-upload-area:hover {
      border-color: var(--accent);
      background: var(--bg3);
    }
    .file-upload-area.has-file {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.05);
    }
    .file-upload-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 0.75rem;
      fill: var(--accent);
    }
    .file-upload-text {
      font-size: 0.95rem;
      color: var(--ink-light);
      font-weight: 500;
    }
    .file-upload-hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .file-upload-input {
      display: none;
    }
    .file-selected {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.75rem;
      background: rgba(16, 185, 129, 0.1);
      border-radius: 8px;
      margin-top: 0.75rem;
      color: var(--success);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .file-selected.visible {
      display: flex;
    }
    .file-selected svg {
      width: 20px;
      height: 20px;
      fill: var(--success);
    }

    /* 上传后提示 */
    .upload-hint {
      display: none;
      align-items: flex-start;
      gap: 8px;
      margin-top: 0.75rem;
      padding: 0.75rem 1rem;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 8px;
      color: #b45309;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .upload-hint.visible {
      display: flex;
    }
    .upload-hint svg {
      width: 18px;
      height: 18px;
      fill: #f59e0b;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* === Buttons === */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
      width: 100%;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* === Example Buttons === */
    .example-section {
      text-align: center;
      margin-bottom: 2rem;
    }
    .example-label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-example {
      padding: 0.75rem 1.5rem;
      background: var(--bg);
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-example:hover {
      background: var(--accent);
      color: white;
    }

    /* === Results Section === */
    .results-section {
      display: none;
    }
    .results-section.visible {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    /* === Loading Animation === */
    .loading-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
    }
    .loading-overlay.visible {
      display: flex;
    }
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--rule);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      color: var(--ink-light);
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* === Completeness Section === */
    .completeness-section {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--rule);
    }
    .completeness-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .completeness-title svg {
      width: 24px;
      height: 24px;
      fill: var(--accent);
    }
    .completeness-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .completeness-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--bg2);
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .completeness-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .completeness-item.missing {
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .completeness-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .completeness-icon.pass {
      background: rgba(16, 185, 129, 0.15);
    }
    .completeness-icon.pass svg {
      width: 20px;
      height: 20px;
      fill: var(--success);
    }
    .completeness-icon.fail {
      background: rgba(239, 68, 68, 0.15);
    }
    .completeness-icon.fail svg {
      width: 20px;
      height: 20px;
      fill: var(--danger);
    }
    .completeness-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
    }
    .completeness-status {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .completeness-alert {
      display: none;
      padding: 1rem 1.25rem;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      color: var(--danger);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .completeness-alert.visible {
      display: block;
      animation: slideInLeft 0.4s ease;
    }
    .completeness-alert svg {
      width: 18px;
      height: 18px;
      fill: var(--danger);
      vertical-align: middle;
      margin-right: 6px;
    }

    /* === Radar Chart === */
    .radar-section {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--rule);
    }
    .radar-container {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0;
    }
    .radar-container.visible {
      display: flex;
      animation: fadeIn 0.6s ease 0.2s both;
    }
    .radar-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    .radar-chart {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
    }
    .radar-chart svg {
      width: 100%;
      height: 100%;
    }

    /* === Score Cards === */
    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .score-card {
      text-align: center;
      padding: 1rem;
      background: var(--bg2);
      border-radius: 12px;
      transition: transform 0.3s ease;
    }
    .score-card:hover {
      transform: translateY(-2px);
    }
    .score-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }
    .score-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* === JD Analysis === */
    .jd-analysis-section {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--rule);
    }
    .jd-match-bar {
      margin-bottom: 1rem;
    }
    .jd-match-label {
      font-size: 0.9rem;
      color: var(--ink);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .jd-progress-track {
      width: 100%;
      height: 10px;
      background: var(--bg2);
      border-radius: 5px;
      overflow: hidden;
    }
    .jd-progress-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 1s ease;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    }
    .jd-match-rate {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .jd-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .jd-keyword-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .jd-keyword-tag.matched {
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .jd-keyword-tag.missing {
      background: rgba(239, 68, 68, 0.08);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .jd-keyword-tag svg {
      width: 14px;
      height: 14px;
    }
    .jd-section-label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .jd-missing-tip {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #b45309;
      line-height: 1.5;
    }

    /* === Suggestions === */
    .suggestions-section {
      margin-top: 0;
    }
    .suggestions-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .suggestions-title svg {
      width: 24px;
      height: 24px;
      fill: var(--accent);
    }

    /* 建议对比卡片 */
    .suggestion-item {
      margin-bottom: 1.25rem;
      background: var(--bg);
      border-radius: 14px;
      border: 1px solid var(--rule);
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .suggestion-item:hover {
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }
    .suggestion-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--rule);
    }
    .suggestion-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .suggestion-icon svg {
      width: 16px;
      height: 16px;
      fill: white;
    }
    .suggestion-type {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
    }
    .suggestion-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .suggestion-before,
    .suggestion-after {
      padding: 1.25rem;
    }
    .suggestion-before {
      border-right: 1px solid var(--rule);
      background: rgba(239, 68, 68, 0.02);
    }
    .suggestion-after {
      background: rgba(16, 185, 129, 0.02);
    }
    .suggestion-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .suggestion-label.before {
      color: var(--danger);
    }
    .suggestion-label.after {
      color: var(--success);
    }
    .suggestion-label svg {
      width: 14px;
      height: 14px;
    }
    .suggestion-text {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--ink);
    }
    .suggestion-text.before-text {
      color: var(--ink);
    }
    .suggestion-text.after-text {
      color: var(--ink);
      font-weight: 500;
    }
    .suggestion-text.after-text .highlight {
      background: rgba(16, 185, 129, 0.15);
      padding: 2px 4px;
      border-radius: 4px;
      color: var(--success);
      font-weight: 600;
    }
    .suggestion-tip {
      padding: 0.75rem 1.25rem;
      background: var(--bg2);
      border-top: 1px solid var(--rule);
      font-size: 0.85rem;
      color: var(--ink-light);
      line-height: 1.5;
    }

    /* 单个建议的换一条按钮 */
    .suggestion-actions {
      display: flex;
      justify-content: flex-end;
      padding: 0.5rem 1.25rem;
      background: var(--bg2);
      border-top: 1px solid var(--rule);
    }
    .btn-swap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0.4rem 0.9rem;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-family: var(--font);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-swap:hover {
      background: var(--accent);
      color: white;
    }
    .btn-swap svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    .btn-swap.loading svg {
      animation: spin 0.8s linear infinite;
    }

    /* 底部更多建议按钮 */
    .more-section {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
    }
    .btn-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.65rem 1.5rem;
      background: var(--bg2);
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-more:hover {
      background: var(--accent);
      color: white;
    }
    .btn-more:active {
      transform: scale(0.97);
    }
    .btn-more svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .btn-more.loading svg {
      animation: spin 0.8s linear infinite;
    }

    @media (max-width: 640px) {
      .suggestion-body {
        grid-template-columns: 1fr;
      }
      .suggestion-before {
        border-right: none;
        border-bottom: 1px solid var(--rule);
      }
    }

    /* === Overall Score === */
    .overall-score {
      text-align: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border-radius: 16px;
      color: white;
      margin-bottom: 2rem;
    }
    .overall-label {
      font-size: 0.95rem;
      opacity: 0.9;
    }
    .overall-value {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .overall-desc {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-top: 0.25rem;
    }

    /* === Responsive === */
    @media (max-width: 640px) {
      h1 { font-size: 1.8rem; }
      .subtitle { font-size: 1rem; }
      .card { padding: 1.25rem; }
      .btn-group { flex-direction: column; }
      .btn-example { width: 100%; }
      .score-grid { grid-template-columns: repeat(2, 1fr); }
      .completeness-grid { grid-template-columns: repeat(2, 1fr); }
      .radar-chart { max-width: 300px; }
      .overall-value { font-size: 2.5rem; }
    }

    /* === SVG Animation === */
    .radar-area {
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .radar-point {
      transition: all 0.3s ease;
    }
    .radar-point:hover {
      r: 8;
    }
  </style>
</head>

    function loadPdfjs() {
      return new Promise((resolve, reject) => {
        if (pdfjsLoaded) return resolve();
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        script.onload = function() {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          pdfjsLoaded = true;
          resolve();
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    // 加载 mammoth.js

      return new Promise((resolve, reject) => {
        if (mammothLoaded) return resolve();

        script.onload = function() { mammothLoaded = true; resolve(); };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    // 从 PDF 中提取文本（使用 PDF.js）
    async function extractPdfText(file) {
      await loadPdfjs();
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }
      return text;
    }

      const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
      return result.value;
    }

    // 处理文件选择
    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedFileName = file.name;
      const fileSelected = document.getElementById('fileSelected');
      const fileName = document.getElementById('fileName');
      const fileUploadArea = document.getElementById('fileUploadArea');
      fileName.textContent = '已选择文件：' + file.name;
      fileSelected.classList.add('visible');
      fileUploadArea.classList.add('has-file');
      currentData = null;
      currentExampleType = null;

      const resumeInput = document.getElementById('resumeInput');
      const uploadHint = document.getElementById('uploadHint');

      // 如果文本框已有内容，不覆盖
      if (resumeInput.value.trim()) {
        if (uploadHint) uploadHint.classList.remove('visible');
        return;
      }

      // 根据扩展名判断文件类型
      const ext = file.name.split('.').pop().toLowerCase();
      const textExts = ['txt', 'md', 'text', 'csv', 'json', 'xml', 'html', 'htm'];

      try {
        // 显示解析中提示
        if (uploadHint) uploadHint.classList.add('visible');

        if (textExts.includes(ext)) {
          // 纯文本文件
          const text = await file.text();
          const chineseChars = text.match(/[\u4e00-\u9fa5]/g);
          if (chineseChars && chineseChars.length > 30 && text.length > 100) {
            resumeInput.value = text;
            if (uploadHint) uploadHint.classList.remove('visible');
          } else {
            if (uploadHint) uploadHint.classList.remove('visible');
          }
        } else if (ext === 'pdf') {
          // PDF 文件 — 使用 PDF.js 解析
          const text = await extractPdfText(file);
          if (text.trim().length > 50) {
            resumeInput.value = text;
            if (uploadHint) uploadHint.classList.remove('visible');
          } else {
            if (uploadHint) uploadHint.classList.remove('visible');
          }
        } else if (ext === 'docx') {
          // DOCX 文件 — 使用 mammoth.js 解析
          const text = await extractDocxText(file);
          if (text.trim().length > 50) {
            resumeInput.value = text;
            if (uploadHint) uploadHint.classList.remove('visible');
          } else {
            if (uploadHint) uploadHint.classList.remove('visible');
          }
        } else if (ext === 'doc') {
          // .doc 格式（旧版 Word）无法在前端解析
          if (uploadHint) uploadHint.classList.remove('visible');
        } else {
          // 未知格式
          if (uploadHint) uploadHint.classList.remove('visible');
        }
      } catch (err) {
        console.error('文件解析失败:', err);
        if (uploadHint) uploadHint.classList.remove('visible');
      }
    }

    // 加载示例
    function loadExample(type) {
      const data = exampleData[type];
      document.getElementById('resumeInput').value = data.resume;
      document.getElementById('jdInput').value = data.jd;
      currentData = data;
      currentExampleType = type;
      extraSuggestionIndex = 0;
      lastAnalysisData = null;
      // 清除文件选择状态
      selectedFileName = '';
      document.getElementById('fileSelected').classList.remove('visible');
      document.getElementById('fileUploadArea').classList.remove('has-file');
      document.getElementById('fileInput').value = '';
      const uploadHint = document.getElementById('uploadHint');
      if (uploadHint) uploadHint.classList.remove('visible');
      startAnalysis();
    }

    // 单条建议替换（换一条建议）
    function swapSuggestion(btn, index) {
      const card = btn.closest('.suggestion-item');
      const source = lastAnalysisData;
      if (!source || !source.suggestions || !source.suggestions[index]) return;
      const suggestion = source.suggestions[index];

      if (!suggestion.alternatives || suggestion.alternatives.length === 0) return;

      // 按钮加载状态
      btn.classList.add('loading');
      btn.disabled = true;

      setTimeout(() => {
        btn.classList.remove('loading');
        btn.disabled = false;

        // 取第一条替代方案
        const alt = suggestion.alternatives[0];

        // 更新卡片内容
        const beforeText = card.querySelector('.suggestion-text.before-text');
        const afterText = card.querySelector('.suggestion-text.after-text');
        const tipText = card.querySelector('.suggestion-tip');

        // 淡出旧内容
        card.querySelector('.suggestion-body').style.opacity = '0.5';

        setTimeout(() => {
          beforeText.innerHTML = alt.before;
          afterText.innerHTML = alt.after;
          tipText.textContent = alt.tip;
          card.querySelector('.suggestion-body').style.opacity = '1';
          card.querySelector('.suggestion-body').style.transition = 'opacity 0.3s ease';
        }, 200);
      }, 600);
    }

    // 开始分析
    function startAnalysis() {
      extraSuggestionIndex = 0;
      const resume = document.getElementById('resumeInput').value.trim();
      if (!resume) {
        const uploadHint = document.getElementById('uploadHint');
        if (uploadHint && uploadHint.classList.contains('visible')) {
          alert('文件正在解析中或解析未成功，请稍候重试，或直接在上方的文本框中粘贴简历内容。');
        } else {
          alert('请先粘贴简历内容，或上传简历文件（支持PDF/Word/TXT格式，系统会自动读取内容）。');
        }
        return;
      }

      const resultsSection = document.getElementById('resultsSection');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const resultsContent = document.getElementById('resultsContent');

      // 显示结果区域
      resultsSection.classList.add('visible');
      loadingOverlay.classList.add('visible');
      resultsContent.style.display = 'none';

      // 滚动到结果区域
      resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // 模拟分析延迟
      setTimeout(() => {
        loadingOverlay.classList.remove('visible');
        resultsContent.style.display = 'block';
        // 如果有 currentData 且简历内容与示例一致，使用示例数据；否则根据用户输入生成
        const isExampleData = currentData && resume === currentData.resume.trim();
        displayResults(isExampleData ? currentData : generateDefaultData());
      }, 1500);
    }

    // 生成默认数据（用户自定义输入时使用）
    function generateDefaultData() {
      const resume = document.getElementById('resumeInput').value;
      const jd = document.getElementById('jdInput').value.trim();

      // 简单检测简历内容
      const hasContact = /电话|手机|邮箱|email|tel/i.test(resume);
      const hasEducation = /学历|学校|大学|本科|硕士|博士|毕业/i.test(resume);
      const hasExperience = /工作|实习|经历|经验|项目/i.test(resume);
      const hasSkills = /技能|技术|能力|掌握|熟悉|精通/i.test(resume);
      const hasSelfEval = /自我评价|个人总结|自我介绍|个人优势/i.test(resume);

      // 从简历中提取真实内容（不伪造）
      const lines = resume.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      // 提取技能行
      const skillLine = lines.find(l => /技能|技术|能力|掌握|熟悉|精通/i.test(l)) || '（未找到技能描述）';
      // 提取一段经历描述
      const expLine = lines.find(l => /负责|参与|协助|主导|完成|开发|管理/i.test(l)) || '（未找到经历描述）';
      // 提取一段项目描述
      const projLine = lines.find(l => /项目|系统|平台|工具|产品/i.test(l)) || '（未找到项目描述）';

      // 检测量化表达
      const hasNumbers = /\d+[\+%年月日万]/.test(resume) || /\d{2,}/.test(resume);

      // 检查排版
      const hasConsistentFormat = /^\d{4}[-./]\d{2}/m.test(resume) || /\d{4}[-./]\d{1,2}[-./]\d{1,2}/.test(resume);

      // 基础建议（基于真实简历内容，不伪造）
      const suggestions = [];

      // 建议一：基于JD关键词匹配（如果有JD）
      if (jd) {
        const jdKeywords = extractJDKeywords(jd);
        if (jdKeywords.length > 0) {
          suggestions.push({
            icon: 'keyword',
            type: 'JD关键词匹配',
            before: skillLine.length > 60 ? skillLine.substring(0, 60) + '...' : skillLine,
            after: skillLine + '<span class="highlight">、' + jdKeywords.slice(0, 3).join('、') + '</span>',
            tip: `目标岗位JD中提到了"${jdKeywords.slice(0, 3).join('、')}"等关键词，建议在技能描述中补充这些关键词，提高简历匹配度。`,
            alternatives: [
              {
                before: skillLine.length > 60 ? skillLine.substring(0, 60) + '...' : skillLine,
                after: skillLine + '<span class="highlight">（建议在项目经历中具体说明如何运用"' + jdKeywords.slice(0, 2).join('、') + '"等技能解决实际问题）</span>',
                tip: '单纯列出技能名称不够，结合项目场景说明技能的应用方式，能让HR更直观地评估你的能力。'
              }
            ]
          });
        }
      }

      // 建议二：量化表达（只有缺少量化数据时才显示建议）
      if (!hasNumbers) {
        suggestions.push({
          icon: 'quant',
          type: '量化表达',
          before: expLine.length > 60 ? expLine.substring(0, 60) + '...' : expLine,
          after: expLine + '<span class="highlight">（建议补充具体数据，如：处理XX条数据、提升XX%、覆盖XX用户等）</span>',
          tip: '你的简历缺少量化数据，HR更偏好有具体数字的描述。建议在经历中加入可量化的成果。',
          alternatives: [
            {
              before: expLine.length > 60 ? expLine.substring(0, 60) + '...' : expLine,
              after: expLine + '<span class="highlight">（建议从时间效率维度补充数据，如：将某流程从X天缩短至Y天，效率提升Z%）</span>',
              tip: '尝试从不同维度量化你的成果：时间效率、成本节约、用户增长、错误率降低等。'
            }
          ]
        });
      }

      // 建议三：完整度缺失项
      const missingItems = [];
      if (!hasContact) missingItems.push('联系方式');
      if (!hasEducation) missingItems.push('教育背景');
      if (!hasExperience) missingItems.push('工作/实习经历');
      if (!hasSkills) missingItems.push('技能描述');
      if (!hasSelfEval) missingItems.push('自我评价');

      if (missingItems.length > 0) {
        suggestions.push({
          icon: 'self',
          type: '补充' + missingItems[0],
          before: '（简历缺少' + missingItems.join('、') + '）',
          after: '<span class="highlight">建议补充' + missingItems.join('、') + '。' + (missingItems.includes('自我评价') ? '自我评价可以突出你的核心优势和求职意向。' : missingItems.includes('技能描述') ? '技能描述建议与目标岗位要求匹配。' : '完整的简历能让HR更全面地了解你。') + '</span>',
          tip: '你的简历缺少' + missingItems.join('、') + '，建议补充完善，提高简历完整度。',
          alternatives: [
            {
              before: '（简历缺少' + missingItems.join('、') + '）',
              after: '<span class="highlight">建议优先补充' + missingItems[0] + '，这是HR最关注的核心信息之一，然后再逐步完善其他模块。</span>',
              tip: '优先补充缺失的核心模块，再逐步完善细节描述，避免一次性追求完美导致进度停滞。'
            }
          ]
        });
      } else {
        suggestions.push({
          icon: 'format',
          type: '简历完整度',
          before: '简历包含联系方式、教育背景、工作经历、技能描述、自我评价',
          after: '简历包含联系方式、教育背景、工作经历、技能描述、自我评价<span class="highlight">，结构完整，继续保持！</span>',
          tip: '你的简历结构完整，这很好！建议检查各部分内容的详细程度是否足够。',
          alternatives: [
            {
              before: '简历包含联系方式、教育背景、工作经历、技能描述、自我评价',
              after: '简历包含联系方式、教育背景、工作经历、技能描述、自我评价<span class="highlight">，建议进一步检查各模块描述是否足够详细，例如工作经历是否包含具体职责和成果。</span>',
              tip: '结构完整只是第一步，内容的深度和具体程度同样重要。'
            }
          ]
        });
      }

      // 计算评分
      let jobFitScore = Math.floor(Math.random() * 20) + 40;
      if (jd) {
        const jdKeywords = extractJDKeywords(jd);
        let matchCount = 0;
        jdKeywords.forEach(kw => { if (resume.includes(kw)) matchCount++; });
        jobFitScore = Math.min(95, Math.floor((matchCount / Math.max(jdKeywords.length, 1)) * 80) + 20);
      }

      // 兜底：确保至少有2条建议
      if (suggestions.length < 2) {
        suggestions.push({
          icon: 'format',
          type: '排版优化',
          before: projLine.length > 60 ? projLine.substring(0, 60) + '...' : projLine,
          after: projLine + '<span class="highlight">（建议统一使用"公司/项目 | 职位/角色 | 时间段"的格式，让HR快速扫读你的经历）</span>',
          tip: '统一排版格式，用一致的格式让HR快速扫读你的经历。',
          alternatives: [
            {
              before: projLine.length > 60 ? projLine.substring(0, 60) + '...' : projLine,
              after: projLine + '<span class="highlight">（建议使用 bullet point 分点描述，每点突出一个核心成果或职责）</span>',
              tip: '分点描述比大段文字更清晰，HR通常只花30秒扫读一份简历。'
            }
          ]
        });
      }

      return {
        completeness: {
          contact: hasContact,
          education: hasEducation,
          experience: hasExperience,
          skills: hasSkills,
          selfEval: hasSelfEval
        },
        scores: {
          contentMatch: hasExperience ? Math.floor(Math.random() * 20) + 60 : Math.floor(Math.random() * 20) + 40,
          keywordCoverage: jd ? Math.floor(Math.random() * 20) + 40 : Math.floor(Math.random() * 20) + 30,
          quantification: hasNumbers ? Math.floor(Math.random() * 20) + 60 : Math.floor(Math.random() * 20) + 25,
          formatting: hasConsistentFormat ? Math.floor(Math.random() * 15) + 70 : Math.floor(Math.random() * 20) + 50,
          jobFit: jobFitScore
        },
        suggestions: suggestions,
        jdAnalysis: jd ? analyzeJD(jd, resume) : null
      };
    }

    // 从JD中提取关键词
    function extractJDKeywords(jd) {
      const commonWords = ['岗位', '要求', '职责', '任职', '资格', '条件', '优先', '以上', '以下', '相关', '具备', '良好', '优秀', '熟练', '精通', '熟悉', '了解', '工作', '进行', '负责', '完成', '能够', '拥有', '具有', '以及', '或者', '等', '的', '和', '与', '为', '在', '有', '是', '不', '了', '年', '月', '日', '个', '种', '级', '名', '位', '人', '大', '小', '多', '少', '高', '低'];
      const words = jd.replace(/[，。、；：""''（）\[\]【】\n\r\t]/g, ' ')
        .split(/\s+/)
        .filter(w => w.length >= 2 && !commonWords.includes(w))
        .filter(w => /[\u4e00-\u9fa5]/.test(w));
      // 去重并返回前10个
      return [...new Set(words)].slice(0, 10);
    }

    // 分析JD与简历的匹配情况
    function analyzeJD(jd, resume) {
      const jdKeywords = extractJDKeywords(jd);
      const matched = [];
      const missing = [];

      jdKeywords.forEach(kw => {
        if (resume.includes(kw)) {
          matched.push(kw);
        } else {
          missing.push(kw);
        }
      });

      return {
        keywords: jdKeywords,
        matched: matched,
        missing: missing,
        matchRate: jdKeywords.length > 0 ? Math.round((matched.length / jdKeywords.length) * 100) : 0
      };
    }

    // 显示结果
    function displayResults(data) {
      // 缓存最后一次诊断结果
      lastAnalysisData = data;

      const radarContainer = document.getElementById('radarContainer');
      const scoreGrid = document.getElementById('scoreGrid');
      const suggestionsList = document.getElementById('suggestionsList');
      const overallScore = document.getElementById('overallScore');
      const overallDesc = document.getElementById('overallDesc');
      const completenessGrid = document.getElementById('completenessGrid');
      const completenessAlert = document.getElementById('completenessAlert');

      // 计算总分
      const scores = data.scores;
      const totalScore = Math.round(
        (scores.contentMatch + scores.keywordCoverage + scores.quantification + scores.formatting + scores.jobFit) / 5
      );

      // 更新总分
      overallScore.textContent = totalScore;
      if (totalScore >= 70) {
        overallDesc.textContent = '表现不错，继续保持！';
      } else if (totalScore >= 50) {
        overallDesc.textContent = '有提升空间，加油！';
      } else {
        overallDesc.textContent = '需要重点改进，建议根据建议优化';
      }

      // 渲染完整度检查
      renderCompleteness(data.completeness);

      // 渲染JD分析（如果有JD）
      renderJDAnalysis(data.jdAnalysis);

      // 绘制雷达图
      radarContainer.classList.add('visible');
      drawRadarChart(scores);

      // 渲染分数卡片
      const scoreLabels = {
        contentMatch: '内容匹配度',
        keywordCoverage: '关键词覆盖',
        quantification: '量化表达',
        formatting: '排版规范',
        jobFit: '岗位契合度'
      };

      scoreGrid.innerHTML = Object.entries(scores).map(([key, value]) => `
        <div class="score-card">
          <div class="score-value">${value}</div>
          <div class="score-label">${scoreLabels[key]}</div>
        </div>
      `).join('');

      // 渲染建议
      const icons = {
        keyword: '<svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>',
        quant: '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2V9h2v8zm0-10h-2V5h2v2z"/></svg>',
        format: '<svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>',
        fit: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>',
        project: '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>',
        self: '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
        skill: '<svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>'
      };

      const xIcon = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
      const checkIcon = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';

      suggestionsList.innerHTML = data.suggestions.map((s, i) => `
        <div class="suggestion-item" data-index="${i}" style="animation-delay: ${i * 0.15}s">
          <div class="suggestion-header">
            <div class="suggestion-icon">${icons[s.icon] || icons.quant}</div>
            <div class="suggestion-type">${s.type || '优化建议'}</div>
          </div>
          <div class="suggestion-body">
            <div class="suggestion-before">
              <div class="suggestion-label before">${xIcon} 原简历</div>
              <div class="suggestion-text before-text">${s.before}</div>
            </div>
            <div class="suggestion-after">
              <div class="suggestion-label after">${checkIcon} 建议修改</div>
              <div class="suggestion-text after-text">${s.after}</div>
            </div>
          </div>
          <div class="suggestion-tip">${s.tip}</div>
          ${s.alternatives && s.alternatives.length > 0 ? `
          <div class="suggestion-actions">
            <button class="btn-swap" onclick="swapSuggestion(this, ${i})">
              <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              换一条建议
            </button>
          </div>
          ` : ''}
        </div>
      `).join('');

      // 触发动画
      requestAnimationFrame(() => {
        document.querySelectorAll('.suggestion-item').forEach((item, index) => {
          item.style.opacity = '0';
          item.style.transform = 'translateY(20px)';
          setTimeout(() => {
            item.style.transition = 'all 0.5s ease';
            item.style.opacity = '1';
            item.style.transform = 'translateY(0)';
          }, index * 200);
        });
      });
    }

    // 渲染JD分析
    function renderJDAnalysis(jdAnalysis) {
      const section = document.getElementById('jdAnalysisSection');
      const content = document.getElementById('jdAnalysisContent');

      if (!jdAnalysis) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      section.style.animation = 'fadeIn 0.5s ease';

      const checkSvg = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
      const crossSvg = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';

      let html = '';

      // 匹配率进度条
      html += '<div class="jd-match-bar">';
      html += '<div class="jd-match-label">JD关键词匹配率</div>';
      html += '<div class="jd-progress-track"><div class="jd-progress-fill" id="jdProgressFill" style="width: 0%"></div></div>';
      html += '<div class="jd-match-rate">匹配 ' + jdAnalysis.matched.length + ' / ' + jdAnalysis.keywords.length + ' 个关键词（' + jdAnalysis.matchRate + '%）</div>';
      html += '</div>';

      // 已匹配关键词
      if (jdAnalysis.matched.length > 0) {
        html += '<div class="jd-section-label">已匹配的关键词（简历中已包含）</div>';
        html += '<div class="jd-keywords">';
        jdAnalysis.matched.forEach(kw => {
          html += '<span class="jd-keyword-tag matched">' + checkSvg + ' ' + kw + '</span>';
        });
        html += '</div>';
      }

      // 缺失关键词
      if (jdAnalysis.missing.length > 0) {
        html += '<div class="jd-section-label" style="margin-top: 1rem;">未匹配的关键词（建议补充到简历中）</div>';
        html += '<div class="jd-keywords">';
        jdAnalysis.missing.forEach(kw => {
          html += '<span class="jd-keyword-tag missing">' + crossSvg + ' ' + kw + '</span>';
        });
        html += '</div>';

        html += '<div class="jd-missing-tip">建议在简历的"技能描述"和"项目经历"部分加入以上未匹配的关键词，这样HR搜索时更容易找到你。</div>';
      }

      content.innerHTML = html;

      // 动画进度条
      setTimeout(() => {
        const fill = document.getElementById('jdProgressFill');
        if (fill) fill.style.width = jdAnalysis.matchRate + '%';
      }, 300);
    }

    // 渲染完整度检查
    function renderCompleteness(completeness) {
      const grid = document.getElementById('completenessGrid');
      const alert = document.getElementById('completenessAlert');

      const items = [
        { key: 'contact', label: '联系方式', icon: 'phone' },
        { key: 'education', label: '教育背景', icon: 'edu' },
        { key: 'experience', label: '工作经历', icon: 'work' },
        { key: 'skills', label: '技能描述', icon: 'skill' },
        { key: 'selfEval', label: '自我评价', icon: 'self' }
      ];

      const passIcon = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
      const failIcon = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';

      let missingItems = [];

      grid.innerHTML = items.map(item => {
        const isPass = completeness[item.key];
        if (!isPass) missingItems.push(item.label);
        return `
          <div class="completeness-item ${!isPass ? 'missing' : ''}">
            <div class="completeness-icon ${isPass ? 'pass' : 'fail'}">
              ${isPass ? passIcon : failIcon}
            </div>
            <div>
              <div class="completeness-label">${item.label}</div>
              <div class="completeness-status">${isPass ? '已包含' : '未包含'}</div>
            </div>
          </div>
        `;
      }).join('');

      // 显示缺失提示
      if (missingItems.length > 0) {
        alert.innerHTML = `
          <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
          你的简历缺少${missingItems.join('、')}，建议补充完善
        `;
        alert.classList.add('visible');
      } else {
        alert.classList.remove('visible');
      }
    }

    // 绘制雷达图（SVG）
    function drawRadarChart(scores) {
      const container = document.getElementById('radarChart');
      const labels = ['内容匹配度', '关键词覆盖', '量化表达', '排版规范', '岗位契合度'];
      const values = [scores.contentMatch, scores.keywordCoverage, scores.quantification, scores.formatting, scores.jobFit];

      const size = 400;
      const center = size / 2;
      const radius = 140;
      const levels = 5;
      const angleStep = (2 * Math.PI) / 5;
      const startAngle = -Math.PI / 2;

      // 计算点坐标
      const getPoint = (value, index) => {
        const angle = startAngle + index * angleStep;
        const r = (value / 100) * radius;
        return {
          x: center + r * Math.cos(angle),
          y: center + r * Math.sin(angle)
        };
      };

      // 计算标签位置
      const getLabelPos = (index) => {
        const angle = startAngle + index * angleStep;
        const r = radius + 35;
        return {
          x: center + r * Math.cos(angle),
          y: center + r * Math.sin(angle)
        };
      };

      let svg = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;

      // 背景圆形
      svg += `<circle cx="${center}" cy="${center}" r="${radius + 5}" fill="#f0f7ff" opacity="0.5"/>`;

      // 绘制网格
      for (let level = 1; level <= levels; level++) {
        const levelRadius = (level / levels) * radius;
        let points = [];
        for (let i = 0; i < 5; i++) {
          const angle = startAngle + i * angleStep;
          points.push(`${center + levelRadius * Math.cos(angle)},${center + levelRadius * Math.sin(angle)}`);
        }
        const opacity = 0.3 + (level / levels) * 0.3;
        svg += `<polygon points="${points.join(' ')}" fill="none" stroke="#2563eb" stroke-width="1" opacity="${opacity}"/>`;
      }

      // 绘制轴线
      for (let i = 0; i < 5; i++) {
        const angle = startAngle + i * angleStep;
        const endX = center + radius * Math.cos(angle);
        const endY = center + radius * Math.sin(angle);
        svg += `<line x1="${center}" y1="${center}" x2="${endX}" y2="${endY}" stroke="#d0e3f0" stroke-width="1"/>`;
      }

      // 数据区域
      let dataPoints = [];
      for (let i = 0; i < 5; i++) {
        const point = getPoint(values[i], i);
        dataPoints.push(`${point.x},${point.y}`);
      }

      svg += `<polygon class="radar-area" points="${dataPoints.join(' ')}" fill="rgba(37, 99, 235, 0.25)" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>`;

      // 数据点
      for (let i = 0; i < 5; i++) {
        const point = getPoint(values[i], i);
        svg += `<circle class="radar-point" cx="${point.x}" cy="${point.y}" r="6" fill="#2563eb" stroke="white" stroke-width="2"/>`;
      }

      // 标签
      for (let i = 0; i < 5; i++) {
        const pos = getLabelPos(i);
        const anchor = pos.x < center - 10 ? 'end' : pos.x > center + 10 ? 'start' : 'middle';
        svg += `<text x="${pos.x}" y="${pos.y}" text-anchor="${anchor}" dominant-baseline="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1e3a5f">${labels[i]}</text>`;
        // 分数
        const scorePos = getPoint(values[i], i);
        const scoreOffset = values[i] > 70 ? -20 : 15;
        svg += `<text x="${scorePos.x}" y="${scorePos.y + scoreOffset}" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#2563eb">${values[i]}</text>`;
      }

      svg += '</svg>';
      container.innerHTML = svg;

      // 动画效果
      const polygon = container.querySelector('.radar-area');
      if (polygon) {
        const points = polygon.getAttribute('points');
        const originalPoints = points;
        const centerStr = `${center},${center} ${center},${center} ${center},${center} ${center},${center} ${center},${center}`;
        polygon.setAttribute('points', centerStr);
        polygon.style.transition = 'points 1s cubic-bezier(0.4, 0, 0.2, 1)';
        setTimeout(() => {
          polygon.setAttribute('points', originalPoints);
        }, 50);
      }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      // 可以在这里添加初始化逻辑
    });
  </script>
