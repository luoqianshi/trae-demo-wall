// ==================== 环绕回复气泡 ====================
const ReplyOrbit = {
  isHovering:false,
  bubbles:[],
  currentPet:null,
  show(pet,petX,petY,petW,petH,cardY){
    this.hide(true);
    const topMsg=pet.pendingMessages[0];
    if(!topMsg)return;
    this.currentPet=pet;
    const replies=topMsg.quickReplies||MOCK_REPLIES[topMsg.priority]||MOCK_REPLIES.normal;
    const pClass=`priority-${topMsg.priority}`;
    const cx=petX+petW/2;
    const cy=petY+petH/2;
    const startRadius=130;   // 起始半径（远处）
    const endRadius=78;      // 终止半径（贴近桌宠但不覆盖，桌宠半身=60）
    const cardAbove=cardY<petY;
    let arcStart,arcEnd;
    if(cardAbove){
      arcStart=20*Math.PI/180;
      arcEnd=160*Math.PI/180;
    }else{
      arcStart=200*Math.PI/180;
      arcEnd=340*Math.PI/180;
    }
    const arcSpan=arcEnd-arcStart;
    const n=replies.length;
    const step=n>1?arcSpan/(n-1):0;
    const startAngle=n>1?arcStart:(arcStart+arcEnd)/2;

    this.bubbles=[];
    replies.forEach((reply,i)=>{
      const b=el('div',`reply-bubble ${pClass}`,reply);
      const angle=startAngle+i*step;
      b._angle=angle; // 存储角度供跟随使用
      // 起始位置：远处
      const sx=cx+startRadius*Math.cos(angle);
      const sy=cy+startRadius*Math.sin(angle);
      b.style.left=sx+'px';b.style.top=sy+'px';
      b.style.transform='translate(-50%,-50%) scale(.3)';
      $('workspace').appendChild(b);
      this.bubbles.push(b);
      // 下一帧动画到终止位置（靠拢桌宠）
      setTimeout(()=>{
        b.classList.add('visible');
        b.style.transform='translate(-50%,-50%) scale(1)';
        const fx=cx+endRadius*Math.cos(angle);
        const fy=cy+endRadius*Math.sin(angle);
        b.style.left=fx+'px';b.style.top=fy+'px';
      },i*100+16);
      b.addEventListener('click',()=>{this.onReply(pet,reply);});
      b.addEventListener('mouseenter',()=>{this.isHovering=true;HoverCard.clearHideTimer();});
      b.addEventListener('mouseleave',()=>{this.isHovering=false;HoverCard.startHideTimer();});
    });
  },
  // 桌宠移动时跟随更新气泡位置
  follow(pet){
    if(this.bubbles.length===0||!this.currentPet||this.currentPet.id!==pet.id)return;
    const pe=document.querySelector(`.pet[data-id="${pet.id}"]`);
    if(!pe)return;
    const rect=pe.getBoundingClientRect();
    const wsRect=$('workspace').getBoundingClientRect();
    const cx=rect.left-wsRect.left+PET_SIZE/2;
    const cy=rect.top-wsRect.top+PET_SIZE/2;
    const radius=78;
    this.bubbles.forEach(b=>{
      if(b._angle===undefined)return;
      b.style.left=(cx+radius*Math.cos(b._angle))+'px';
      b.style.top=(cy+radius*Math.sin(b._angle))+'px';
    });
  },
  hide(){
    this.bubbles.forEach(b=>{b.classList.remove('visible');b.style.transform='translate(-50%,-50%) scale(.3)';setTimeout(()=>b.remove(),300);});
    this.bubbles=[];
    this.currentPet=null;
  },
  onReply(pet,replyText){
    pet.chatHistory.push({id:'r'+Date.now(),content:replyText,timestamp:Date.now(),isMe:true});
    PetManager.clearMessages(pet.id);
    PetManager.increaseAffinity(pet.id,1);
    if(State.chatPetId===pet.id)ChatWindow.refresh();
    showToast(`已回复 ${pet.name} · 好感度 +1 💗`,'success');
    HoverCard.hide();
    this.hide();
  }
};

// ==================== 消息引擎 ====================
const MessageEngine = {
  start(){this.poll();State.pollTimer=setInterval(()=>this.poll(),15000);$('pollStatus').textContent='轮询中 · 15s';},
  stop(){if(State.pollTimer)clearInterval(State.pollTimer);},
  async poll(){
    const msgs=await FeishuConnector.getMessages();if(msgs.length===0)return;
    for(const msg of msgs){
      const analysis=await AIAnalyzer.analyze(msg.content);
      msg.priority=analysis.priority;msg.aiSummary=analysis.summary;
      msg.quickReplies=generateQuickReplies(msg.content,msg.priority);
      PetManager.addMessageToPet(msg.senderId,msg);
      // 仅桌宠消息显示通知
      const sender=State.contacts.find(c=>c.id===msg.senderId);
      if(sender&&PetManager.getPet(msg.senderId))showMsgNotification(msg,sender);
    }
    renderMsgList();
  }
};

// ==================== 会议倒计时 ====================
const MeetingCountdown = {
  start(){this.render();State.meetingTimer=setInterval(()=>this.render(),1000);
    State.meetingGenTimer=setInterval(()=>{if(State.meetings.length<2&&Math.random()<0.5){const m=FeishuConnector.mockGenerateMeeting();State.meetings.push(m);showToast(`📅 新会议: ${m.title}`,'');}},30000);
    // 点击会议倒计时弹出详情
    $('meetingCountdown').addEventListener('click',()=>this.showModal());
    $('modalOverlay').addEventListener('click',()=>this.hideModal());
  },
  showModal(){
    const modal=$('meetingModal');const overlay=$('modalOverlay');
    const now=Date.now();
    const upcoming=State.meetings.filter(m=>m.startTime>now-60000).sort((a,b)=>a.startTime-b.startTime);
    let bodyHtml='';
    if(upcoming.length===0){bodyHtml='<div class="mm-empty">近期没有会议安排</div>';}
    else{upcoming.forEach(m=>{
      const diff=m.startTime-now;const started=diff<=0;
      const d=new Date(m.startTime);
      const timeStr=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      let countdown='';
      if(started){countdown='正在进行';}
      else{const ts=Math.floor(diff/1000);const h=Math.floor(ts/3600);const mm=Math.floor((ts%3600)/60);const s=ts%60;
        if(h>0)countdown=`${h}小时${mm}分后开始`;
        else if(mm>0)countdown=`${mm}分${s}秒后开始`;
        else countdown=`${s}秒后开始`;}
      bodyHtml+=`<div class="mm-item"><div class="mm-item-name">${m.title}</div><div class="mm-item-info">组织者：${m.organizer}<br>开始时间：${timeStr}</div><div class="mm-item-time">${countdown}</div></div>`;
    });}
    modal.innerHTML=`<div class="mm-header"><span>📅</span><span class="mm-title">会议安排</span><button class="mm-close" id="mmClose">×</button></div><div class="mm-body">${bodyHtml}</div>`;
    overlay.classList.add('visible');
    modal.classList.add('visible');
    $('mmClose').addEventListener('click',()=>this.hideModal());
  },
  hideModal(){$('meetingModal').classList.remove('visible');$('modalOverlay').classList.remove('visible');},
  stop(){if(State.meetingTimer)clearInterval(State.meetingTimer);if(State.meetingGenTimer)clearInterval(State.meetingGenTimer);},
  render(){
    const panel=$('meetingCountdown');const now=Date.now();
    State.meetings=State.meetings.filter(m=>m.startTime>now-60000);
    if(State.meetings.length===0){panel.innerHTML=`<div class="mc-header"><span class="mc-icon">📅</span><span class="mc-title-text">会议倒计时</span><span class="mc-status">暂无</span></div><div class="mc-empty"><div class="mc-empty-icon">🗓️</div><div>近期没有会议</div></div>`;return;}
    const m=State.meetings.sort((a,b)=>a.startTime-b.startTime)[0];
    const diff=m.startTime-now;const started=diff<=0;
    let timeStr,progress,barColor;
    if(started){timeStr='进行中';progress=100;barColor='var(--urgent)';}
    else{const ts=Math.floor(diff/1000);const h=Math.floor(ts/3600);const mm=Math.floor((ts%3600)/60);const s=ts%60;
      if(h>0)timeStr=`${h}<span class="mc-time-unit">时</span>${mm}<span class="mc-time-unit">分</span>`;
      else if(mm>0)timeStr=`${mm}<span class="mc-time-unit">分</span>${s}<span class="mc-time-unit">秒</span>`;
      else timeStr=`${s}<span class="mc-time-unit">秒</span>`;
      const ta=3600000;progress=Math.max(0,Math.min(100,(1-diff/ta)*100));
      if(diff<300000)barColor='var(--urgent)';else if(diff<900000)barColor='var(--high)';else barColor='#3370FF';}
    panel.innerHTML=`<div class="mc-header"><span class="mc-icon">📅</span><span class="mc-title-text">会议倒计时</span><span class="mc-status">${started?'进行中':'即将开始'}</span></div><div class="mc-body"><div class="mc-meeting-name">${m.title}</div><div class="mc-organizer">组织者: ${m.organizer}</div><div class="mc-timer"><span class="mc-time">${timeStr}</span></div><div class="mc-progress"><div class="mc-progress-bar" style="width:${progress}%;background:${barColor};"></div></div></div>`;
  }
};

function updateUI(){$('petCount').textContent=`${State.pets.length} 只桌宠`;$('workspaceHint').style.display=State.pets.length===0?'block':'none';renderMsgList();}

function renderMsgList(filter=''){
  const list=$('contactList');
  let contacts=State.contacts;
  if(filter){contacts=contacts.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase())||c.dept.toLowerCase().includes(filter.toLowerCase()));}
  let html='';
  contacts.forEach(c=>{
    const preview=State.msgPreviews[c.id];
    const previewText=preview?preview.content:'暂无消息';
    const previewTime=preview?preview.time:'';
    const unread=preview?preview.unread:0;
    html+=`<div class="msg-item" data-id="${c.id}">
      <div class="msg-avatar online" style="background:${c.color};">${c.initial}</div>
      <div class="msg-info">
        <div class="msg-name-row">
          <span class="msg-name">${c.name}</span>
          <span class="msg-time">${previewTime}</span>
        </div>
        <div class="msg-preview">${previewText}</div>
      </div>
      ${unread>0?`<div class="msg-unread">${unread}</div>`:''}
    </div>`;
  });
  if(contacts.length===0)html='<div style="padding:30px;text-align:center;color:#8F959E;font-size:13px;">未找到匹配的消息</div>';
  list.innerHTML=html;
  // 绑定拖拽（mousedown 时挂载 document 监听，mouseup 后立即移除）
  list.querySelectorAll('.msg-item').forEach(item=>{
    const contactId=item.dataset.id;
    item.addEventListener('mousedown',(e)=>{
      if(e.button!==0)return;
      let moved=false;
      const startX=e.clientX,startY=e.clientY;
      function onMove(ev){
        if(Math.abs(ev.clientX-startX)>3||Math.abs(ev.clientY-startY)>3)moved=true;
      }
      function onUp(ev){
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        if(!moved){
          // 单击：同步未读并打开对话
          const pet=PetManager.getPet(contactId);
          if(pet){
            if(State.msgPreviews[contactId])State.msgPreviews[contactId].unread=0;
            if(pet.unreadCount>0)PetManager.clearMessages(contactId);
            ChatWindow.open(contactId);
          }else{
            if(State.msgPreviews[contactId])State.msgPreviews[contactId].unread=0;
            const cc=State.contacts.find(c=>c.id===contactId);
            if(cc){
              const ws=$('workspace').getBoundingClientRect();
              PetManager.addPet(cc,randInt(120,Math.max(120,ws.width-PET_SIZE-40)),randInt(100,Math.max(100,ws.height-PET_SIZE-40)));
              ChatWindow.open(contactId);
            }
          }
        }
      }
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
      // 无桌宠时：长按进入拖拽模式（由 startDragFromList 自行处理长按检测和清理）
      if(!PetManager.getPet(contactId)){
        startDragFromList(e,contactId);
      }
    });
  });
}

// ==================== 从消息列表拖拽到桌面 ====================
let dragGhost=null,dragContactId=null;
function startDragFromList(e,contactId){
  e.preventDefault();
  const c=State.contacts.find(c=>c.id===contactId);if(!c)return;
  const startX=e.clientX,startY=e.clientY;
  let longPressTimer=null,enteredDragMode=false,moved=false;
  const existingPet=PetManager.getPet(contactId);

  if(existingPet){
    // 已有桌宠：拦截拖拽，长按仅提示
    longPressTimer=setTimeout(()=>{showToast('已有桌宠，单击可直接对话','');},500);
  }else{
    // 无桌宠：长按 500ms 后进入拖拽模式
    longPressTimer=setTimeout(()=>{
      enteredDragMode=true;
      dragContactId=contactId;
      dragGhost=el('div','drag-ghost');
      dragGhost.style.background=c.color;
      dragGhost.textContent=c.initial;
      dragGhost.style.left=startX+'px';
      dragGhost.style.top=startY+'px';
      document.body.appendChild(dragGhost);
      $('workspace').classList.add('drop-active');
    },500);
  }

  function onMove(ev){
    if(enteredDragMode){
      if(!dragGhost)return;
      dragGhost.style.left=ev.clientX+'px';
      dragGhost.style.top=ev.clientY+'px';
    }else{
      const dx=ev.clientX-startX,dy=ev.clientY-startY;
      if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;
    }
  }
  function onUp(ev){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    clearTimeout(longPressTimer);
    if(enteredDragMode){
      // 拖拽结束：检查是否在 workspace 内
      $('workspace').classList.remove('drop-active');
      if(dragGhost){dragGhost.remove();dragGhost=null;}
      const ws=$('workspace').getBoundingClientRect();
      if(ev.clientX>=ws.left&&ev.clientX<=ws.right&&ev.clientY>=ws.top&&ev.clientY<=ws.bottom){
        const cc=State.contacts.find(c=>c.id===dragContactId);
        if(cc)PetManager.addPet(cc,ev.clientX-ws.left-PET_SIZE/2,ev.clientY-ws.top-PET_SIZE/2);
      }
      dragContactId=null;
    }else if(!moved){
      // 单击：无论是否有桌宠都直接打开对话
      let pet=PetManager.getPet(contactId);
      if(!pet){
        // 无桌宠时自动创建
        const ws=$('workspace').getBoundingClientRect();
        PetManager.addPet(c,randInt(120,Math.max(120,ws.width-PET_SIZE-40)),randInt(100,Math.max(100,ws.height-PET_SIZE-40)));
        pet=PetManager.getPet(contactId);
      }
      if(pet)ChatWindow.open(contactId);
    }
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

// ==================== 飞书窗口拖动 ====================
function enableWindowDrag(){
  const win=$('sidebar');if(!win)return;
  const bar=win.querySelector('.feishu-title-bar');if(!bar)return;
  // 关闭按钮：隐藏飞书窗口
  bar.querySelector('.ftb-btn.close').addEventListener('click',(e)=>{
    e.stopPropagation();
    win.style.display='none';
    // 在任务栏添加飞书图标点击可重新打开
    showToast('飞书窗口已关闭，点击任务栏图标可重新打开','');
  });
  // 最小化按钮：隐藏飞书窗口
  bar.querySelector('.ftb-btn.min').addEventListener('click',(e)=>{
    e.stopPropagation();
    win.style.display='none';
  });
  // 最大化按钮：切换全屏/还原
  bar.querySelector('.ftb-btn.max').addEventListener('click',(e)=>{
    e.stopPropagation();
    if(win.dataset.maximized==='1'){
      win.dataset.maximized='0';
      win.style.width='';win.style.height='';win.style.top='60px';win.style.left='80px';
    }else{
      win.dataset.maximized='1';
      const ws=$('workspace').getBoundingClientRect();
      win.style.width=ws.width+'px';win.style.height=ws.height+'px';win.style.top='0';win.style.left='0';
    }
  });
  // 拖拽：mousedown 时挂载 document 监听，mouseup 后立即移除
  bar.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('ftb-btn'))return;
    const sx=e.clientX,sy=e.clientY;
    const r=win.getBoundingClientRect();const wx=r.left,wy=r.top;
    win.style.zIndex=200;
    e.preventDefault();
    function onMove(ev){
      win.style.left=(wx+ev.clientX-sx)+'px';
      win.style.top=(wy+ev.clientY-sy)+'px';
    }
    function onUp(){
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
  // 任务栏飞书图标点击：重新打开窗口
  const taskbarApp=document.querySelector('.taskbar-app.active');
  if(taskbarApp){
    taskbarApp.addEventListener('click',()=>{
      win.style.display='';win.style.zIndex=200;
    });
  }
}
function enableWindowZOrder(){
  const win=$('sidebar');if(!win)return;
  win.addEventListener('mousedown',()=>{
    const wins=document.querySelectorAll('.draggable-window');
    wins.forEach(w=>w.style.zIndex=20);
    win.style.zIndex=200;
  });
}
// ==================== 初始化 ====================
async function init(){
  loadState();
  State.contacts=await FeishuConnector.getContacts();
  // 初始化消息预览（所有联系人都有历史消息）
  State.contacts.forEach(c=>{
    const t=rand(MOCK_MSG_TEMPLATES);
    State.msgPreviews[c.id]={content:t.content,time:formatTime(Date.now()-randInt(1,120)*60000),unread:Math.random()<0.4?randInt(1,3):0};
  });
  renderMsgList();
  PetManager.renderAll();
  const im=FeishuConnector.mockGenerateMeeting();im.startTime=Date.now()+8*60000;State.meetings.push(im);
  MessageEngine.start();MeetingCountdown.start();updateUI();
  // 桌面时钟更新
  function updateClock(){
    const d=new Date();
    const hh=String(d.getHours()).padStart(2,'0');
    const mm=String(d.getMinutes()).padStart(2,'0');
    const days=['周日','周一','周二','周三','周四','周五','周六'];
    const dateStr=`${d.getMonth()+1}月${d.getDate()}日 ${days[d.getDay()]}`;
    const wt=$('widgetTime');if(wt)wt.textContent=`${hh}:${mm}`;
    const wd=$('widgetDate');if(wd)wd.textContent=dateStr;
    const tc=$('taskbarClock');if(tc)tc.innerHTML=`${hh}:${mm}<br>${dateStr}`;
  }
  updateClock();setInterval(updateClock,1000);
  $('searchInput').addEventListener('input',(e)=>renderMsgList(e.target.value));
  $('aiKeyInput').addEventListener('change',(e)=>{State.aiKey=e.target.value.trim();const b=$('aiModeBadge');if(State.aiKey){b.textContent='Real';b.className='mode-badge real';showToast('AI 分析已切换为真实 LLM 模式','success');}else{b.textContent='Mock';b.className='mode-badge mock';showToast('AI 分析已切换为 Mock 模式','');}});
  $('feishuAppIdInput').addEventListener('change',(e)=>{State.feishuAppId=e.target.value.trim();const b=$('feishuModeBadge');if(State.feishuAppId){b.textContent='Real';b.className='mode-badge real';showToast('飞书已切换为真实 API 模式','success');FeishuConnector.getContacts().then(c=>{State.contacts=c;renderMsgList();});}else{b.textContent='Mock';b.className='mode-badge mock';showToast('飞书已切换为 Mock 模式','');}});
  if(State.pets.length===0)setTimeout(()=>showToast('单击左侧消息可直接对话',''),500);
  else showToast(`欢迎回来！你有 ${State.pets.length} 只桌宠`,'success');
  enableWindowDrag();
}
init();
// 暴露到全局便于调试
window.State=State;window.PetManager=PetManager;window.ChatWindow=ChatWindow;window.MessageEngine=MessageEngine;window.HoverCard=HoverCard;window.ReplyOrbit=ReplyOrbit;
</script>
