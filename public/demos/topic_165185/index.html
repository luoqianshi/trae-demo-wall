<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电到家 · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Big+Shoulders+Display:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --base: #E5DFCC;
    --base-2: #D8D1BA;
    --paper: #EFE9D8;
    --paper-2: #F4EFE0;
    --ink: #14181A;
    --ink-2: #1E2528;
    --ink-3: #2A3236;
    --ink-soft: #3A4347;
    --volt: #C8FF3D;
    --volt-deep: #9BCC1F;
    --copper: #C26B2C;
    --copper-deep: #9A4F1C;
    --copper-soft: rgba(194, 107, 44, 0.1);
    --mute: #6E7370;
    --mute-2: #8A8E86;
    --line: #BFB59A;
    --line-soft: #D2C9B0;
    --line-dark: rgba(229, 223, 204, 0.12);
    --line-dark-2: rgba(229, 223, 204, 0.22);
    --idle: #9BCC1F;
    --busy: #C26B2C;
    --fault: #9A4F1C;
  }
  html, body {
    height: 100%;
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #2A2520;
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(194, 107, 44, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(155, 204, 31, 0.06) 0%, transparent 50%),
      #2A2520;
  }
  .serif { font-family: "Noto Serif SC", serif; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .display { font-family: "Big Shoulders Display", sans-serif; font-weight: 800; }
  .news { font-family: "Newsreader", "Noto Serif SC", serif; font-style: italic; }

  /* ============ 手机壳 ============ */
  .phone {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    max-height: 920px;
    background: var(--base);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 0 0 1px rgba(20,24,26,0.1);
  }
  @media (min-width: 480px) {
    .phone { height: 90vh; border-radius: 36px; }
  }
  /* 工业图纸点阵网格 */
  .phone::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image: radial-gradient(circle, rgba(20, 24, 26, 0.05) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.7;
  }

  /* ============ 状态栏 ============ */
  .status-bar {
    height: 36px;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    background: var(--base);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }
  .status-bar .right { display: flex; align-items: center; gap: 5px; }
  .status-bar svg { width: 14px; height: 14px; }

  /* ============ 顶部导航栏 ============ */
  .nav-bar {
    background: var(--base);
    border-bottom: 1px solid var(--line);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }
  .nav-bar-inner {
    height: 52px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-back {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    cursor: pointer;
    background: none; border: none;
  }
  .nav-back:active { opacity: 0.5; }
  .nav-title {
    font-family: "Noto Serif SC", serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    flex: 1;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .nav-title .sub {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--copper);
    letter-spacing: 1.5px;
    display: block;
    margin-top: -2px;
    font-weight: 500;
  }
  .nav-action {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    background: none; border: none;
    cursor: pointer;
  }

  /* ============ 主视图区 ============ */
  .view {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    z-index: 2;
    -webkit-overflow-scrolling: touch;
    background: var(--base);
    transition: opacity 0.25s ease;
  }
  .view.switching { opacity: 0; }
  .view::-webkit-scrollbar { width: 0; }

  .page { padding: 0; animation: pageIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes pageIn {
    from { opacity: 0; transform: translateX(12px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ============ 底部 Tab ============ */
  .tab-bar {
    height: 64px;
    background: var(--base);
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--mute);
    transition: color 0.2s;
    position: relative;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab .label {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .tab.active { color: var(--copper); }
  .tab.active::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: var(--copper);
  }
  .tab:active { opacity: 0.6; }

  /* ============ 通用组件 ============ */
  .section-pad { padding: 20px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { display: flex; justify-content: space-between; align-items: center; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 2px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .chip-volt { background: var(--volt); color: var(--ink); }
  .chip-copper { background: var(--copper); color: var(--paper); }
  .chip-outline { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .chip-soft { background: var(--copper-soft); color: var(--copper-deep); }
  .chip-mute { background: rgba(110, 115, 112, 0.15); color: var(--mute); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 24px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: "Noto Sans SC", sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    letter-spacing: 0.5px;
    width: 100%;
  }
  .btn:active { transform: scale(0.98); }
  .btn-copper { background: var(--copper); }
  .btn-copper:active { background: var(--copper-deep); }
  .btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn-volt { background: var(--volt); color: var(--ink); }
  .btn-sm { padding: 10px 16px; font-size: 13px; width: auto; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ============ 首页 ============ */
  .home-hero {
    padding: 8px 20px 20px;
    background: var(--ink);
    color: var(--base);
    position: relative;
    overflow: hidden;
  }
  .home-hero::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--volt) 0% 30%, var(--copper) 30% 60%, transparent 60%);
  }
  .home-hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .home-brand {
    font-family: "Noto Serif SC", serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--base);
    display: flex; align-items: center; gap: 8px;
  }
  .home-brand .b { color: var(--volt); font-style: italic; }
  .home-brand-mark {
    width: 24px; height: 24px;
    border: 1.5px solid var(--volt);
    display: flex; align-items: center; justify-content: center;
  }
  .home-brand-mark svg { width: 12px; height: 12px; }
  .home-loc {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--volt);
    letter-spacing: 1.5px;
    display: flex; align-items: center; gap: 6px;
  }
  .home-slogan {
    font-family: "Newsreader", "Noto Serif SC", serif;
    font-style: italic;
    font-size: 22px;
    line-height: 1.3;
    color: var(--base);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .home-slogan em { color: var(--volt); }
  .home-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding-top: 14px;
    border-top: 1px solid var(--line-dark-2);
  }
  .home-stat { padding: 0 8px; border-right: 1px solid var(--line-dark); }
  .home-stat:last-child { border-right: none; }
  .home-stat .k {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px; color: var(--mute-2); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 4px;
  }
  .home-stat .v {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 800; font-size: 24px; color: var(--base); line-height: 1;
  }
  .home-stat .v .u { font-family: "Noto Sans SC", sans-serif; font-size: 10px; color: var(--volt); margin-left: 2px; font-weight: 400; }

  /* 筛选条 */
  .filter-bar {
    padding: 16px 20px 12px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    background: var(--base);
    border-bottom: 1px solid var(--line-soft);
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 7px 14px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    font-weight: 500;
    transition: all 0.2s;
  }
  .filter-chip.active {
    background: var(--ink);
    color: var(--volt);
    border-color: var(--ink);
  }

  /* 小区分组 */
  .community-group { padding: 16px 20px; }
  .community-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .community-name {
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
  }
  .community-name .dist {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--mute);
    font-weight: 400;
    margin-left: 8px;
  }
  .community-count {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--copper);
    letter-spacing: 1px;
  }

  /* 桩卡片 */
  .pile-card {
    background: var(--paper);
    border: 1px solid var(--line-soft);
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s;
    position: relative;
  }
  .pile-card:active { transform: scale(0.98); border-color: var(--copper); }
  .pile-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .pile-id {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--copper);
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }
  .pile-name {
    font-family: "Noto Serif SC", serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
  }
  .pile-addr {
    font-size: 11.5px;
    color: var(--mute);
    margin-top: 3px;
  }
  .pile-status {
    width: 10px; height: 10px; border-radius: 50%;
    margin-top: 4px;
  }
  .pile-status.idle { background: var(--idle); box-shadow: 0 0 0 3px rgba(155, 204, 31, 0.2); }
  .pile-status.busy { background: var(--busy); }
  .pile-status.fault { background: var(--fault); opacity: 0.5; }
  .pile-card-meta {
    display: flex;
    gap: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--line-soft);
    font-size: 11px;
  }
  .pile-meta-item .k {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    color: var(--mute);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .pile-meta-item .v {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    line-height: 1;
  }
  .pile-meta-item .v .u {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 10px;
    color: var(--mute);
    font-weight: 400;
    margin-left: 2px;
  }

  /* ============ 详情页 ============ */
  .detail-hero {
    padding: 4px 20px 20px;
    background: var(--ink);
    color: var(--base);
    position: relative;
  }
  .detail-hero::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--volt);
  }
  .detail-id {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--volt);
    letter-spacing: 2px;
    margin-bottom: 8px;
    margin-top: 14px;
  }
  .detail-name {
    font-family: "Noto Serif SC", serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--base);
    line-height: 1.15;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .detail-addr {
    font-family: "Newsreader", "Noto Serif SC", serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(229, 223, 204, 0.65);
    margin-bottom: 18px;
  }
  .detail-meter {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 14px 0 0;
    border-top: 1px solid var(--line-dark-2);
  }
  .detail-meter .cell { padding-right: 8px; border-right: 1px solid var(--line-dark); }
  .detail-meter .cell:last-child { border-right: none; padding-right: 0; }
  .detail-meter .k {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    color: var(--mute-2);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .detail-meter .v {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--base);
    line-height: 1;
  }
  .detail-meter .v .u {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 10px;
    color: var(--volt);
    font-weight: 400;
    margin-left: 2px;
  }

  .detail-owner {
    margin: 16px 20px;
    padding: 14px;
    background: var(--paper);
    border: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .owner-avatar {
    width: 42px; height: 42px;
    background: var(--copper);
    color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Serif SC", serif;
    font-weight: 700;
    font-size: 17px;
  }
  .owner-info { flex: 1; }
  .owner-name {
    font-family: "Noto Serif SC", serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }
  .owner-meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--mute);
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .owner-rating {
    text-align: right;
  }
  .owner-rating .v {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--copper);
    line-height: 1;
  }
  .owner-rating .k {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    color: var(--mute);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .detail-section { padding: 8px 20px 16px; }
  .detail-section-title {
    font-family: "Noto Serif SC", serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .detail-section-title .code {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--copper);
    letter-spacing: 1.5px;
    font-weight: 500;
  }

  /* 日期切换 */
  .date-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    overflow-x: auto;
  }
  .date-tabs::-webkit-scrollbar { display: none; }
  .date-tab {
    padding: 10px 14px;
    background: var(--paper);
    border: 1px solid var(--line-soft);
    cursor: pointer;
    min-width: 90px;
    transition: all 0.2s;
  }
  .date-tab.active { background: var(--ink); color: var(--volt); border-color: var(--ink); }
  .date-tab .d { font-family: "Noto Sans SC", sans-serif; font-size: 12px; font-weight: 600; }
  .date-tab .w { font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--mute); letter-spacing: 1px; margin-top: 2px; }
  .date-tab.active .w { color: var(--volt); opacity: 0.7; }

  /* 时段网格 */
  .slot-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .slot {
    padding: 12px;
    background: var(--paper);
    border: 1px solid var(--line-soft);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .slot:active { transform: scale(0.97); }
  .slot.selected { background: var(--ink); color: var(--volt); border-color: var(--ink); }
  .slot.taken { opacity: 0.35; cursor: not-allowed; }
  .slot.taken .s-price { color: var(--fault); }
  .slot .s-time {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.5px;
  }
  .slot.selected .s-time { color: var(--volt); }
  .slot .s-price {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--copper);
  }
  .slot.selected .s-price { color: var(--volt); }

  /* 底部 CTA 栏 */
  .cta-bar {
    padding: 12px 20px;
    background: var(--base);
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }
  .cta-price { flex: 1; }
  .cta-price .k {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--mute);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .cta-price .v {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 800;
    font-size: 24px;
    color: var(--copper);
    line-height: 1;
  }
  .cta-price .v .u {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 11px;
    color: var(--mute);
    font-weight: 400;
    margin-left: 3px;
  }
  .cta-bar .btn { width: auto; padding: 12px 28px; }

  /* ============ 预约确认页 ============ */
  .confirm-section {
    padding: 20px;
    border-bottom: 1px solid var(--line-soft);
  }
  .confirm-section-title {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--copper);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .confirm-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line-soft);
    font-size: 14px;
  }
  .confirm-row:last-child { border-bottom: none; }
  .confirm-row .k { color: var(--mute); }
  .confirm-row .v { color: var(--ink); font-weight: 600; }
  .confirm-row .v.mono { font-family: "JetBrains Mono", monospace; font-size: 13px; }
  .confirm-total {
    display: flex;
    justify-content: space-between;

const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const pileById = (id) => PILES.find(p => p.id === id) || state.myPiles.find(p => p.id === id);
const communityById = (id) => COMMUNITIES.find(c => c.id === id);

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function navigate(route, params = {}) {
  state.route = route;
  state.params = params;
  state.selectedSlot = null;
  state.selectedDate = 'today';
  render();
  $('#view').scrollTop = 0;
  history.replaceState(null, '', `#/${route}${params.id ? '/' + params.id : ''}`);
}

/* ============================================================
   渲染：导航栏 + Tab + CTA
   ============================================================ */
function renderNav() {
  const navBar = $('#navBar');
  const ctaBar = $('#ctaBar');
  const tabBar = $('#tabBar');
  const r = state.route;

  const navConfig = {
    home: { title: '电到家', sub: 'CHARGING NETWORK', showBack: false, showAction: false },
    map: { title: '附近桩位', sub: 'LIVE MAP', showBack: false, showAction: false },
    detail: { title: '桩位详情', sub: 'PILE · ' + (state.params.id || ''), showBack: true, showAction: false },
    book: { title: '预约确认', sub: 'BOOKING CONFIRM', showBack: true, showAction: false },
    success: { title: '预约成功', sub: 'CONFIRMED', showBack: true, showAction: false },
    publish: { title: '上架充电桩', sub: 'NEW PILE', showBack: true, showAction: false },
    mine: { title: '我的', sub: 'ACCOUNT', showBack: false, showAction: false },
    myPiles: { title: '我的桩位', sub: 'MY PILES', showBack: true, showAction: false },
    myBookings: { title: '我的预约', sub: 'MY BOOKINGS', showBack: true, showAction: false },
    pileDetail: { title: '桩位管理', sub: 'PILE · ' + (state.params.id || ''), showBack: true, showAction: false },
  };

  const cfg = navConfig[r] || navConfig.home;

  navBar.innerHTML = `
    <div class="nav-bar-inner">
      <button class="nav-back" ${cfg.showBack ? '' : 'style="visibility:hidden"'} onclick="history.back(); navigate('${state.params.from || 'home'}')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="nav-title">${cfg.title}${cfg.sub ? `<span class="sub">${cfg.sub}</span>` : ''}</div>
      <button class="nav-action" style="visibility:hidden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
  `;

  // CTA 栏
  if (r === 'detail') {
    const p = pileById(state.params.id);
    if (p && state.selectedSlot) {
      const slots = state.selectedDate === 'today' ? TIME_SLOTS : TOMORROW_SLOTS;
      const slot = slots.find(s => s.id === state.selectedSlot);
      const hours = slot && slot.overnight ? 10 : 2;
      const cost = (p.price * hours * p.power).toFixed(2);
      ctaBar.innerHTML = `
        <div class="cta-bar">
          <div class="cta-price">
            <div class="k">${slot ? slot.start + '-' + slot.end : ''} · ${hours}h × ${p.power}kW</div>
            <div class="v">¥${cost}<span class="u">/ 次</span></div>
          </div>
          <button class="btn btn-copper" onclick="navigate('book', { id: '${p.id}', slot: '${state.selectedSlot}', date: '${state.selectedDate}' })">确认预约</button>
        </div>
      `;
    } else {
      ctaBar.innerHTML = '';
    }
  } else if (r === 'book') {
    const p = pileById(state.params.id);
    const slots = state.selectedDate === 'today' ? TIME_SLOTS : TOMORROW_SLOTS;
    const slot = state.params.slot ? slots.find(s => s.id === state.params.slot) : null;
    if (p && slot) {
      const hours = slot.overnight ? 10 : 2;
      const cost = (p.price * hours * p.power).toFixed(2);
      ctaBar.innerHTML = `
        <div class="cta-bar">
          <div class="cta-price">
            <div class="k">实付金额</div>
            <div class="v">¥${cost}<span class="u">/ 次</span></div>
          </div>
          <button class="btn btn-copper" onclick="confirmBooking()">支付并预约</button>
        </div>
      `;
    } else {
      ctaBar.innerHTML = '';
    }
  } else if (r === 'publish') {
    ctaBar.innerHTML = `
      <div class="cta-bar">
        <button class="btn btn-copper" onclick="submitPublish()">上架并开放预约</button>
      </div>
    `;
  } else {
    ctaBar.innerHTML = '';
  }

  // Tab 栏
  const showTab = ['home', 'map', 'mine', 'publish'].includes(r) || ['myPiles', 'myBookings', 'pileDetail'].includes(r);
  if (showTab) {
    const tabs = [
      { id: 'home', label: '首页', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>' },
      { id: 'map', label: '地图', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>' },
      { id: 'publish', label: '发布', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>' },
      { id: 'mine', label: '我的', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>' },
    ];
    const activeTab = ['myPiles', 'pileDetail'].includes(r) ? 'mine' : (r === 'publish' ? 'publish' : r);
    tabBar.innerHTML = tabs.map(t => `
      <button class="tab ${activeTab === t.id ? 'active' : ''}" onclick="navigate('${t.id}')">
        ${t.icon}
        <span class="label">${t.label}</span>
      </button>
    `).join('');
    tabBar.style.display = 'grid';
  } else {
    tabBar.style.display = 'none';
  }
}

/* ============================================================
   页面：首页
   ============================================================ */
function pageHome() {
  const idleCount = PILES.filter(p => p.status === 'idle').length;
  const busyCount = PILES.filter(p => p.status === 'busy').length;

  let html = `
    <div class="page">
      <div class="home-hero">
        <div class="home-hero-top">
          <div class="home-brand">
            <span class="home-brand-mark">
              <svg viewBox="0 0 24 24" fill="#C8FF3D"><path d="M13 2L4.09 12.97a.5.5 0 00.39.81H11l-2 8.22L19.91 11.03a.5.5 0 00-.39-.81H13l2-8.22z"/></svg>
            </span>
            电到<span class="b">家</span>
          </div>
          <div class="home-loc">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
            望京 · 5km 内
          </div>
        </div>
        <div class="home-slogan">下楼就能充，<br>满电<em>再出发</em>。</div>
        <div class="home-stats">
          <div class="home-stat"><div class="k">空闲桩</div><div class="v">${idleCount}<span class="u">个</span></div></div>
          <div class="home-stat"><div class="k">使用中</div><div class="v">${busyCount}<span class="u">个</span></div></div>
          <div class="home-stat"><div class="k">覆盖小区</div><div class="v">${COMMUNITIES.length}<span class="u">个</span></div></div>
        </div>
      </div>

      <div class="filter-bar">
        <button class="filter-chip ${state.filterStatus === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部</button>
        <button class="filter-chip ${state.filterStatus === 'idle' ? 'active' : ''}" onclick="setFilter('idle')">空闲</button>
        <button class="filter-chip ${state.filterStatus === 'busy' ? 'active' : ''}" onclick="setFilter('busy')">使用中</button>
        <button class="filter-chip" onclick="toast('谷电时段已高亮')">谷电优先</button>
        <button class="filter-chip" onclick="toast('已按距离排序')">距离最近</button>
      </div>
  `;

  COMMUNITIES.forEach(c => {
    let piles = PILES.filter(p => p.community === c.id);
    if (state.filterStatus !== 'all') piles = piles.filter(p => p.status === state.filterStatus);
    if (piles.length === 0) return;

    html += `
      <div class="community-group">
        <div class="community-head">
          <div class="community-name">${c.name}<span class="dist">${c.dist}</span></div>
          <div class="community-count">${piles.length} PILES</div>
        </div>
        ${piles.map(p => pileCardHtml(p)).join('')}
      </div>
    `;
  });

  if (state.filterStatus !== 'all' && PILES.filter(p => p.status === state.filterStatus).length === 0) {
    html += `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <div class="t">该状态下暂无桩位，换个筛选试试。</div>
      </div>
    `;
  }

  html += `<div style="height: 20px"></div></div>`;
  return html;
}

function pileCardHtml(p) {
  const statusText = { idle: '空闲', busy: '使用中', fault: '维护中' }[p.status];
  const statusColor = { idle: 'var(--idle)', busy: 'var(--busy)', fault: 'var(--fault)' }[p.status];
  return `
    <div class="pile-card" onclick="navigate('detail', { id: '${p.id}' })">
      <div class="pile-card-top">
        <div style="flex:1">
          <div class="pile-id">PILE · ${p.id}</div>
          <div class="pile-name">${p.name}</div>
          <div class="pile-addr">${p.addr}</div>
        </div>
        <div style="text-align:right">
          <div class="pile-status ${p.status}"></div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${statusColor};letter-spacing:1px;margin-top:6px;font-weight:600">${statusText.toUpperCase()}</div>
        </div>
      </div>
      <div class="pile-card-meta">
        <div class="pile-meta-item"><div class="k">POWER</div><div class="v">${p.power}<span class="u">kW</span></div></div>
        <div class="pile-meta-item"><div class="k">PRICE</div><div class="v">¥${p.price}<span class="u">/kWh</span></div></div>
        <div class="pile-meta-item"><div class="k">RATING</div><div class="v">${p.rating}<span class="u">/5</span></div></div>
        <div class="pile-meta-item" style="margin-left:auto;text-align:right"><div class="k">USES</div><div class="v">${p.totalUses}<span class="u">次</span></div></div>
      </div>
    </div>
  `;
}

function setFilter(s) {
  state.filterStatus = s;
  $('#view').innerHTML = pageHome();
}

  return `

      <div class="detail-hero">
        <div class="detail-id">PILE · ${p.id} · ${c ? c.name : ''}</div>

        <div class="detail-addr">${p.addr} · 距你 ${c ? c.dist : ''}</div>
        <div class="detail-meter">
          <div class="cell"><div class="k">功率</div><div class="v">${p.power}<span class="u">kW</span></div></div>
          <div class="cell"><div class="k">单价</div><div class="v">¥${p.price}<span class="u">/kWh</span></div></div>

          <div class="cell"><div class="k">状态</div><div class="v" style="font-size:13px;font-family:'Noto Sans SC';font-weight:600;color:var(--volt)">${statusText}</div></div>

        <div class="owner-rating">

          <div class="k">RATING</div>

      </div>

      <div class="detail-section">
        <div class="detail-section-title">选择预约日期 <span class="code">DATE</span></div>
        <div class="date-tabs">
          <div class="date-tab ${state.selectedDate === 'today' ? 'active' : ''}" onclick="selectDate('today')">

            <div class="w">JUL 13 · MON</div>
          </div>
          <div class="date-tab ${state.selectedDate === 'tomorrow' ? 'active' : ''}" onclick="selectDate('tomorrow')">
            <div class="d">明天</div>
            <div class="w">JUL 14 · TUE</div>
          </div>
        </div>

        <div class="detail-section-title">选择充电时段 <span class="code">SLOT</span></div>

            const isSelected = state.selectedSlot === s.id;
            const hours = s.overnight ? 10 : 2;
            const cost = (p.price * hours * p.power).toFixed(1);

              <div class="slot ${isSelected ? 'selected' : ''} ${s.taken ? 'taken' : ''}"

                </div>

              </div>

          }).join('')}

        <div class="detail-section-title">充电说明 <span class="code">NOTES</span></div>
        <div style="font-size:13px;color:var(--ink-soft);line-height:1.75;background:var(--paper);border:1px solid var(--line-soft);padding:14px">
          · 仅支持国标 GB/T 接口，兼容大多数国产电动车<br>
          · 进入小区需在门岗登记车牌，告知"充电"<br>
          · 充电完成后 30 分钟内请及时挪车，超时按 ¥1/分钟计费<br>

function selectDate(d) {
  state.selectedDate = d;
  state.selectedSlot = null;
  render();
}
function selectSlot(id) {
  state.selectedSlot = id;
  render();
}

/* ============================================================
   页面：预约确认
   ============================================================ */
function pageBook() {
  const p = pileById(state.params.id);
  const slots = state.selectedDate === 'today' ? TIME_SLOTS : TOMORROW_SLOTS;
  const slot = state.params.slot ? slots.find(s => s.id === state.params.slot) : null;
  if (!p || !slot) return '<div class="empty-state"><div class="t">请先选择时段</div></div>';

  const hours = slot.overnight ? 10 : 2;
  const energy = (p.power * hours).toFixed(1);
  const cost = (p.price * hours * p.power).toFixed(2);
  const publicCost = (1.85 * hours * p.power).toFixed(2);
  const saved = (publicCost - cost).toFixed(2);
  const dateLabel = state.selectedDate === 'today' ? '今天 7月13日' : '明天 7月14日';

  return `
    <div class="page">
      <div class="confirm-section">
        <div class="confirm-section-title">充电桩信息 · PILE</div>
        <div class="confirm-row"><span class="k">桩位名称</span><span class="v">${p.name}</span></div>
        <div class="confirm-row"><span class="k">桩位编号</span><span class="v mono">${p.id}</span></div>
        <div class="confirm-row"><span class="k">位置</span><span class="v">${p.addr}</span></div>
        <div class="confirm-row"><span class="k">桩主</span><span class="v">${p.owner} · ★ ${p.rating}</span></div>
      </div>

      <div class="confirm-section">
        <div class="confirm-section-title">预约时段 · SLOT</div>
        <div class="confirm-row"><span class="k">日期</span><span class="v">${dateLabel}</span></div>
        <div class="confirm-row"><span class="k">时段</span><span class="v mono">${slot.start} - ${slot.end}</span></div>
        <div class="confirm-row"><span class="k">时长</span><span class="v mono">${hours} 小时${slot.overnight ? ' · 谷电' : ''}</span></div>
        <div class="confirm-row"><span class="k">预计补能</span><span class="v mono">${energy} kWh</span></div>
      </div>

      <div class="confirm-section">
        <div class="confirm-section-title">费用明细 · COST</div>
        <div class="confirm-row"><span class="k">电费 (${p.power}kW × ${hours}h × ¥${p.price}/kWh)</span><span class="v mono">¥${cost}</span></div>
        <div class="confirm-row"><span class="k">平台服务费</span><span class="v mono">¥0.00</span></div>
        <div class="confirm-row" style="color:var(--copper)"><span class="k" style="color:var(--copper)">较公共站节省</span><span class="v mono" style="color:var(--copper)">- ¥${saved}</span></div>
        <div class="confirm-total">
          <span class="k">实付金额</span>
          <span class="v">¥${cost}<span class="u">/ 次</span></span>
        </div>
      </div>

      <div class="pay-method" onclick="toast('已选择微信支付')">
        <div class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9 11.5c-.7 0-1.3-.6-1.3-1.3S8.3 9 9 9s1.3.6 1.3 1.3-.6 1.2-1.3 1.2zm6 0c-.7 0-1.3-.6-1.3-1.3S14.3 9 15 9s1.3.6 1.3 1.3-.6 1.2-1.3 1.2z"/><path d="M12 2C6.5 2 2 5.8 2 10.5c0 2.7 1.5 5.1 3.8 6.7L5 21l3.7-2c1 .3 2.1.5 3.3.5 5.5 0 10-3.8 10-8.5S17.5 2 12 2z"/></svg>
        </div>
        <div class="name">微信支付</div>
        <div class="check">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
      </div>
      <div style="height: 20px"></div>
    </div>
  `;
}

function confirmBooking() {
  const p = pileById(state.params.id);
  const slots = state.selectedDate === 'today' ? TIME_SLOTS : TOMORROW_SLOTS;
  const slot = state.params.slot ? slots.find(s => s.id === state.params.slot) : null;
  if (!p || !slot) return;

  const hours = slot.overnight ? 10 : 2;
  const cost = (p.price * hours * p.power).toFixed(2);
  const dateLabel = state.selectedDate === 'today' ? '今天 7月13日' : '明天 7月14日';
  const booking = {
    id: 'B' + Date.now().toString().slice(-8),
    pileId: p.id,
    pileName: p.name,
    date: dateLabel,
    time: `${slot.start} - ${slot.end}`,
    duration: `${hours}h`,
    cost: parseFloat(cost),
    status: 'upcoming',
    community: communityById(p.community)?.name || '',
  };
  state.bookings.unshift(booking);
  navigate('success', { id: p.id, bookingId: booking.id });
}

function toggleSlot(id) {
  if (!state.publishSlots) state.publishSlots = ['s5', 's7', 's8'];
  const i = state.publishSlots.indexOf(id);
  if (i >= 0) state.publishSlots.splice(i, 1);
  else state.publishSlots.push(id);
  document.querySelectorAll('.tsb-slot').forEach(s => {
    s.classList.toggle('active', state.publishSlots.includes(s.dataset.id));
  });
  updatePricePreview();
}

function updatePricePreview() {
  const power = parseFloat(document.getElementById('f-power')?.value || 7);
  const price = parseFloat(document.getElementById('f-price')?.value || 0.5);
  const v = (power * 10 * price).toFixed(1);
  const pp = document.getElementById('pp-v');
  if (pp) pp.innerHTML = `¥${v}<span class="u">/ 次</span>`;
}

function submitPublish() {
  const name = document.getElementById('f-name').value.trim();
  const addr = document.getElementById('f-addr').value.trim();
  const community = document.getElementById('f-community').value;
  const power = parseFloat(document.getElementById('f-power').value);
  const price = parseFloat(document.getElementById('f-price').value);

  if (!name) { toast('请填写桩位名称'); return; }
  if (!addr) { toast('请填写详细位置'); return; }
  if (state.publishSlots.length === 0) { toast('请至少选择一个共享时段'); return; }

  const c = communityById(community);
  const newPile = {
    id: 'P' + (40 + state.myPiles.length),
    name: name,
    community: community,
    addr: addr,
    power: power,
    price: price,
    owner: '我',
    ownerInit: '我',
    rating: 5.0,
    reviews: 0,
    status: 'idle',
    totalUses: 0,
    x: 50, y: 50,
  };
  state.myPiles.unshift({
    id: newPile.id, name: name, community: c.name, power: power, price: price, status: 'idle', income: 0, uses: 0,
  });
  PILES.push(newPile);
  toast('桩位已上架');
  setTimeout(() => navigate('myPiles'), 600);
}

/* ============================================================
   路由 + 渲染
   ============================================================ */
function render() {
  renderNav();
  const view = $('#view');
  const routes = {
    home: pageHome,
    map: pageMap,
    detail: pageDetail,
    book: pageBook,
    success: pageSuccess,
    publish: pagePublish,
    mine: pageMine,
    myPiles: pageMyPiles,
    myBookings: pageMyBookings,
    pileDetail: pagePileDetail,
  };
  const fn = routes[state.route] || pageHome;
  view.innerHTML = fn();
}

/* ============================================================
   初始化
   ============================================================ */
function init() {
  // 时钟
  function updateClock() {
    const d = new Date();
    $('#clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  updateClock();
  setInterval(updateClock, 30000);

  // 解析初始 hash
  const hash = location.hash.replace(/^#\/?/, '');
  const [route, id] = hash.split('/');
  if (route && ['home', 'map', 'detail', 'book', 'success', 'publish', 'mine', 'myPiles', 'myBookings', 'pileDetail'].includes(route)) {
    state.route = route;
    if (id) state.params.id = id;
  }

  render();
}

window.addEventListener('hashchange', () => {
  const hash = location.hash.replace(/^#\/?/, '');
  const [route, id] = hash.split('/');
  if (route) {
    state.route = route;
    if (id) state.params.id = id;
    render();
  }
});

init();
</script>

</body>
