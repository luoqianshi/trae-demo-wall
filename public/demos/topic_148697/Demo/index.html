<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>民生档案权益助手</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .hero-section-custom {
      background: linear-gradient(135deg, #0D9488 0%, #0369A1 100%);
      padding: 24px 20px;
      border-radius: 16px;
      margin-top: 12px;
    }
    .hero-title {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.3;
    }
    .hero-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-top: 8px;
    }
    .hero-search-placeholder {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 16px;
      cursor: pointer;
    }
    .hero-search-text {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }
    .scene-icon-primary {
      background: var(--color-primary-light);
      color: var(--color-primary);
    }
    .scene-icon-secondary {
      background: var(--color-secondary-light);
      color: var(--color-secondary);
    }
    .scene-icon-warning {
      background: var(--color-warning-light);
      color: var(--color-warning);
    }
    .scene-icon-error {
      background: var(--color-error-light);
      color: var(--color-error);
    }
    .cta-banner-custom {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }
    .cta-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: white;
    }
    .cta-content {
      flex: 1;
    }
    .cta-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .cta-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .case-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .case-card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hot-question-text {
      flex: 1;
      font-size: 14px;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar"></div>
    
    <div style="padding: 0 16px;">
      <div class="hero-section-custom">
        <div class="hero-title">民生档案权益助手</div>
        <div class="hero-subtitle">找档案、懂权益、会维权</div>
        <a href="pages/search.html" class="hero-search-placeholder" style="text-decoration: none;">
          <i data-lucide="search" style="width: 18px; height: 18px; color: rgba(255,255,255,0.7);"></i>
          <span class="hero-search-text">搜索你想了解的问题...</span>
        </a>
      </div>
      
      <div class="scene-grid" style="margin-top: 20px;">
      </div>
      
      <div class="cta-banner-custom" style="margin-top: 20px;" onclick="window.location.href='pages/archive-guide.html'">
        <div class="cta-icon-wrap">
          <i data-lucide="search" style="width: 20px; height: 20px;"></i>
        </div>
        <div class="cta-content">
          <div class="cta-title">我的档案去哪儿了？</div>
          <div class="cta-desc">3步找到你的档案，获取官方查询入口</div>
        </div>
        <i data-lucide="chevron-right" style="width: 20px; height: 20px; color: var(--text-tertiary);"></i>
      </div>
      
      <div style="margin-top: 24px;">
        <div class="section-title">精选案例</div>
        <div class="h-scroll" id="case-scroll">
        </div>
      </div>
      
      <div style="margin-top: 24px; padding-bottom: 20px;">
        <div class="section-title">热门问题</div>
        <div id="hot-questions">
        </div>
      </div>
    </div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderScenes() {
      const container = document.querySelector('.scene-grid');
      let html = '';
      SCENES.forEach(scene => {
        const iconColorClass = 'scene-icon-' + scene.color;
        html += `
          <a href="pages/case-list.html?scene=${scene.id}" class="scene-card">
            <div class="scene-icon ${iconColorClass}">
              <i data-lucide="${scene.icon}" style="width: 22px; height: 22px;"></i>
            </div>
            <span style="font-size: 14px; font-weight: 500; color: var(--text-primary); margin-top: 4px;">${scene.name}</span>
          </a>
        `;
      });
      container.innerHTML = html;
    }
    
    function renderCases() {
      const container = document.getElementById('case-scroll');
      const cases = CASE_DATA.slice(0, 4);
      let html = '';
      const borderColors = ['var(--color-primary)', 'var(--color-secondary)', 'var(--color-warning)', 'var(--color-error)'];
      cases.forEach((item, index) => {
        const tagClass = 'tag-' + (SCENES.find(s => s.id === item.scene) ? SCENES.find(s => s.id === item.scene).color : 'primary');
        const shortSituation = item.situation.length > 50 ? item.situation.substring(0, 50) + '...' : item.situation;
        html += `
          <a href="pages/case-detail.html?id=${item.id}" class="h-scroll-card" style="border-left-color: ${borderColors[index % borderColors.length]};">
            <span class="tag ${tagClass}">${item.tags[0]}</span>
            <div class="case-card-title">${item.title}</div>
            <div class="case-card-desc">${shortSituation}</div>
          </a>
        `;
      });
      container.innerHTML = html;
    }
    
    function renderHotQuestions() {
      const container = document.getElementById('hot-questions');
      const questions = HOT_SEARCHES.slice(0, 8);
      const knowledgePointIds = ['archive-1', 'archive-2', 'salary-1', 'social-2'];
      let html = '';
      questions.forEach((q, index) => {
        const numClass = index < 3 ? 'top3' : 'normal';
        let link;
        if (index < 4) {
          link = `pages/case-detail.html?id=${index + 1}`;
        } else {
          link = `pages/knowledge-detail.html?id=${knowledgePointIds[index - 4]}`;
        }
        html += `
          <a href="${link}" class="hot-question-item">
            <span class="hot-num ${numClass}">${index + 1}</span>
            <span class="hot-question-text">${q}</span>
          </a>
        `;
      });
      container.innerHTML = html;
    }
    
    renderScenes();
    renderCases();
    renderHotQuestions();
    initPage('home');
  </script>
</body>
</html>
