<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>案例详情</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .action-bar button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 52px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-default);
      background: var(--bg-card);
      cursor: pointer;
      font-size: var(--text-xs);
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }
    .action-bar button:active {
      background: var(--bg-card-secondary);
    }
    .case-meta {
      font-size: var(--text-sm);
      color: var(--text-tertiary);
      margin-top: 8px;
    }
    .official-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--color-primary);
      font-size: var(--text-sm);
      font-weight: 500;
      text-decoration: none;
      margin-top: 16px;
    }
    .article-content {
      font-size: var(--text-base);
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .tip-title {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--color-warning);
      margin-bottom: var(--space-md);
    }
    .tip-content {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: var(--space-md);
    }
    .related-title {
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--text-primary);
      padding: var(--space-lg);
      padding-bottom: var(--space-sm);
    }
    .related-item-title {
      font-size: var(--text-sm);
      color: var(--text-primary);
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }
    .empty-state-text {
      font-size: var(--text-base);
      color: var(--text-tertiary);
      margin-top: 16px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="app-container" style="padding-bottom: 140px;">
    <div class="status-bar"></div>
    
    <div class="nav-header">
      <div class="nav-inner">
        <div class="nav-left">
          <button onclick="handleBack()" class="nav-btn">
            <i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
        <div class="nav-center">案例详情</div>
        <div class="nav-right" style="gap: 8px;">
          <button class="nav-btn" onclick="handleFavorite()">
            <i data-lucide="star" style="width: 16px; height: 16px;"></i>
          </button>
          <button class="nav-btn" onclick="handleShare()">
            <i data-lucide="share-2" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
      </div>
    </div>
    
    <div id="page-content" style="padding: 16px;">
    </div>
    
    <div class="action-bar" id="action-bar" style="display: none;">
      <button onclick="handleUseful()">
        <i data-lucide="thumbs-up" style="width: 20px; height: 20px;"></i>
        <span>有用</span>
      </button>
      <button onclick="handleFavoriteAction()">
        <i data-lucide="star" style="width: 20px; height: 20px;"></i>
        <span>收藏</span>
      </button>
      <button onclick="handleShare()">
        <i data-lucide="share-2" style="width: 20px; height: 20px;"></i>
        <span>分享给朋友</span>
      </button>
    </div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function getTagColorClass(tagName) {
      const scene = SCENES.find(s => tagName.includes(s.name) || s.name.includes(tagName));
      if (scene) {
        return 'tag-' + scene.color;
      }
      return 'tag-primary';
    }
    
    function renderCase(caseData) {
      const content = document.getElementById('page-content');
      const actionBar = document.getElementById('action-bar');
      actionBar.style.display = 'flex';
      
      const keyPoints = caseData.materials.slice(0, 3);
      
      let tagsHtml = '';
      caseData.tags.forEach(tag => {
        tagsHtml += `<span class="tag ${getTagColorClass(tag)}">${tag}</span> `;
      });
      
      let summaryHtml = '';
      keyPoints.forEach(point => {
        summaryHtml += `
          <div class="summary-item">
            <div class="check-icon">
              <i data-lucide="check" style="width: 12px; height: 12px; color: white;"></i>
            </div>
            <span style="font-size: var(--text-sm); color: var(--text-primary); line-height: 1.6; flex: 1;">${point}</span>
          </div>
        `;
      });
      
      let materialsHtml = '';
      caseData.materials.forEach(mat => {
        materialsHtml += `<span class="material-tag">${mat}</span> `;
      });
      
      let stepsHtml = '';
      caseData.steps.forEach((step, index) => {
        stepsHtml += `
          <div class="step-item-row">
            <div class="step-num">${index + 1}</div>
            <span style="font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.7; flex: 1; padding-top: 1px;">${step}</span>
          </div>
        `;
      });
      
      let lawsHtml = '';
      if (caseData.laws && caseData.laws.length > 0) {
        lawsHtml = `
          <div class="laws-box" style="margin-top: 12px;">
            <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 6px;">法律依据</div>
            ${caseData.laws.join('、')}
          </div>
        `;
      }
      
      const relatedCases = getRelatedCases(caseData.id, 3);
      let relatedHtml = '';
      relatedCases.forEach(rc => {
        relatedHtml += `
          <a href="case-detail.html?id=${rc.id}" class="related-item">
            <span class="related-item-title">${rc.title}</span>
            <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: var(--text-tertiary);"></i>
          </a>
        `;
      });
      
      content.innerHTML = `
        <div>
          <div>${tagsHtml}</div>
          <h1 style="font-size: 20px; font-weight: 700; color: var(--text-primary); margin-top: 12px; line-height: 1.4;">${caseData.title}</h1>
          <div class="case-meta">${caseData.readTime} · ${caseData.updateDate}</div>
        </div>
        
        <div class="summary-card" style="margin-top: 20px;">
          <div style="font-size: var(--text-base); font-weight: 600; color: var(--color-primary); margin-bottom: var(--space-md);">核心要点</div>
          ${summaryHtml}
        </div>
        
        <div class="article-section">
          <div class="article-section-title">
            <i data-lucide="file-text" style="width: 20px; height: 20px; color: var(--color-primary);"></i>
            <span>真实情境</span>
          </div>
          <div class="article-content">${caseData.situation}</div>
        </div>
        
        <div class="article-section">
          <div class="article-section-title">
            <i data-lucide="clipboard-list" style="width: 20px; height: 20px; color: var(--color-secondary);"></i>
            <span>用到的档案/材料</span>
          </div>
          <div class="material-list">${materialsHtml}</div>
        </div>
        
        <div class="article-section">
          <div class="article-section-title">
            <i data-lucide="search" style="width: 20px; height: 20px; color: var(--color-accent);"></i>
            <span>查询途径</span>
          </div>
          <div class="step-list">${stepsHtml}</div>
          <a href="official.html" class="official-link">
            <span>查看当地官方查询入口</span>
            <i data-lucide="external-link" style="width: 14px; height: 14px;"></i>
          </a>
        </div>
        
        <div class="article-section">
          <div class="article-section-title">
            <i data-lucide="check-circle" style="width: 20px; height: 20px; color: var(--color-success);"></i>
            <span>处理结果</span>
          </div>
          <div class="article-content">${caseData.result}</div>
        </div>
        
        <div class="tip-box">
          <div class="tip-title">
            <i data-lucide="alert-circle" style="width: 20px; height: 20px; color: var(--color-warning);"></i>
            <span>温馨提示</span>
          </div>
          <div class="tip-content">${caseData.tip}</div>
          ${lawsHtml}
        </div>
        
        <div class="related-list" style="margin-top: 24px;">
          <div class="related-title">相关案例</div>
          ${relatedHtml}
        </div>
      `;
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    function renderNotFound() {
      const content = document.getElementById('page-content');
      const actionBar = document.getElementById('action-bar');
      actionBar.style.display = 'none';
      
      content.innerHTML = `
        <div class="empty-state">
          <i data-lucide="file-x" style="width: 64px; height: 64px; color: var(--text-tertiary);"></i>
          <div class="empty-state-text">案例不存在</div>
          <a href="../index.html" class="btn-primary" style="width: auto; padding: 0 32px;">返回首页</a>
        </div>
      `;
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    function handleUseful() {
      showToast('操作成功');
    }
    
    function handleFavoriteAction() {
      showToast('操作成功');
    }
    
    function handleFavorite() {
      showToast('操作成功');
    }
    
    function handleShare() {
      showToast('分享功能开发中');
    }
    
    const caseId = getUrlParam('id');
    const caseData = getCaseById(caseId);
    
    if (caseData) {
      renderCase(caseData);
    } else {
      renderNotFound();
    }
    
    initPage('home');
  </script>
</body>
</html>
