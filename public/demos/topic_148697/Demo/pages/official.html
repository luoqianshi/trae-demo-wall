<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>官方查询入口 - 民生档案权益助手</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .category-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .center-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .center-address {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .center-links {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar"></div>
    
    <div class="nav-header">
      <div class="nav-inner">
        <div class="nav-left" id="back-btn"></div>
        <div class="nav-center" id="page-title">官方查询入口</div>
        <div class="nav-right"></div>
      </div>
    </div>
    
    <div style="padding: 16px;">
      <select id="city-select" class="city-select"></select>
      
      <div id="centers-container" style="margin-top: 20px;"></div>
    </div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const CATEGORY_MAP = {
      talent: { name: "人才服务中心", icon: "users" },
      social: { name: "社保局", icon: "shield" },
      fund: { name: "住房公积金管理中心", icon: "building" },
      arbitration: { name: "劳动人事争议仲裁委员会", icon: "scale" }
    };
    
    const CATEGORY_ORDER = ["talent", "social", "fund", "arbitration"];
    
    function renderCityOptions() {
      const select = document.getElementById("city-select");
      let html = "";
      CITY_DATA.forEach(city => {
        html += `<option value="${city.id}">${city.name}</option>`;
      });
      select.innerHTML = html;
    }
    
    function renderCenters(cityId) {
      const city = getCityById(cityId);
      const container = document.getElementById("centers-container");
      if (!city) {
        container.innerHTML = "";
        return;
      }
      
      const grouped = {};
      CATEGORY_ORDER.forEach(type => {
        grouped[type] = city.centers.filter(c => c.type === type);
      });
      
      let html = "";
      CATEGORY_ORDER.forEach(type => {
        const centers = grouped[type];
        if (centers.length === 0) return;
        const cat = CATEGORY_MAP[type];
        
        html += `<div class="category-title">`;
        html += `<i data-lucide="${cat.icon}" style="width: 18px; height: 18px; color: var(--color-primary);"></i>`;
        html += `<span>${cat.name}</span>`;
        html += `</div>`;
        
        centers.forEach(center => {
          html += `<div class="center-card">`;
          html += `<div class="center-name">${center.name}</div>`;
          html += `<div class="center-address">`;
          html += `<i data-lucide="map-pin" style="width: 14px; height: 14px; margin-top: 2px; flex-shrink: 0; color: var(--text-tertiary);"></i>`;
          html += `<span>${center.address}</span>`;
          html += `</div>`;
          html += `<div class="center-links">`;
          html += `<a href="tel:${center.phone}" class="center-link">`;
          html += `<i data-lucide="phone" style="width: 14px; height: 14px;"></i>`;
          html += `<span>${center.phone}</span>`;
          html += `</a>`;
          html += `<a href="${center.website}" target="_blank" class="center-link">`;
          html += `<i data-lucide="external-link" style="width: 14px; height: 14px;"></i>`;
          html += `<span>官网</span>`;
          html += `</a>`;
          html += `</div>`;
          html += `</div>`;
        });
      });
      
      container.innerHTML = html;
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    document.getElementById("city-select").addEventListener("change", function() {
      renderCenters(this.value);
    });
    
    renderCityOptions();
    renderCenters(CITY_DATA[0].id);
    initPage('home');
  </script>
</body>
</html>
