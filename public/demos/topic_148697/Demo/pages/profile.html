<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的 - 民生档案权益助手</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .app-container {
      padding-bottom: 0;
    }
    .main-content {
      margin-top: -20px;
      position: relative;
      z-index: 10;
      padding-bottom: 84px;
    }
    .profile-welcome {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .profile-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-top: 4px;
    }
    .menu-icon-warning { background: var(--color-warning-light); color: var(--color-warning); }
    .menu-icon-info { background: var(--color-info-light); color: var(--color-info); }
    .menu-icon-secondary { background: var(--color-secondary-light); color: var(--color-secondary); }
    .menu-icon-primary { background: var(--color-primary-light); color: var(--color-primary); }
    .menu-text {
      flex: 1;
      font-size: 15px;
      color: var(--text-primary);
    }
    .menu-arrow {
      color: var(--text-tertiary);
    }
    .disclaimer-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar"></div>
    
    <div class="profile-header">
      <div class="avatar">
        <i data-lucide="user" style="width: 32px; height: 32px; color: #FFFFFF;"></i>
      </div>
      <div class="profile-welcome">民生档案权益助手</div>
      <div class="profile-subtitle">了解档案，维护权益</div>
    </div>
    
    <div class="main-content">
      <div class="menu-list">
        <div class="menu-item" id="menu-favorite">
          <div class="menu-icon menu-icon-warning">
            <i data-lucide="star" style="width: 18px; height: 18px;"></i>
          </div>
          <div class="menu-text">我的收藏</div>
          <div class="menu-arrow">
            <i data-lucide="chevron-right" style="width: 20px; height: 20px;"></i>
          </div>
        </div>
        <div class="menu-item" id="menu-history">
          <div class="menu-icon menu-icon-info">
            <i data-lucide="clock" style="width: 18px; height: 18px;"></i>
          </div>
          <div class="menu-text">历史记录</div>
          <div class="menu-arrow">
            <i data-lucide="chevron-right" style="width: 20px; height: 20px;"></i>
          </div>
        </div>
        <a href="official.html" class="menu-item" style="text-decoration: none;">
          <div class="menu-icon menu-icon-secondary">
            <i data-lucide="building" style="width: 18px; height: 18px;"></i>
          </div>
          <div class="menu-text">官方查询入口</div>
          <div class="menu-arrow">
            <i data-lucide="chevron-right" style="width: 20px; height: 20px;"></i>
          </div>
        </a>
        <div class="menu-item" id="menu-about">
          <div class="menu-icon menu-icon-primary">
            <i data-lucide="info" style="width: 18px; height: 18px;"></i>
          </div>
          <div class="menu-text">关于我们</div>
          <div class="menu-arrow">
            <i data-lucide="chevron-right" style="width: 20px; height: 20px;"></i>
          </div>
        </div>
      </div>
      
      <div class="disclaimer-box" style="margin-top: 12px;">
        <div class="disclaimer-title">免责声明</div>
        <div>本工具提供民生档案与权益相关的科普信息，仅供学习参考，不构成法律意见或专业建议。具体政策以当地政府部门最新规定为准，维权行动建议咨询专业律师或相关部门。本工具不收集任何个人敏感信息，城市选择等数据仅保存在本地。</div>
      </div>
    </div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById('menu-favorite').addEventListener('click', function() {
      showToast('功能开发中');
    });
    
    document.getElementById('menu-history').addEventListener('click', function() {
      showToast('功能开发中');
    });
    
    document.getElementById('menu-about').addEventListener('click', function() {
      showToast('功能开发中');
    });
    
    initPage('profile');
  </script>
</body>
</html>
