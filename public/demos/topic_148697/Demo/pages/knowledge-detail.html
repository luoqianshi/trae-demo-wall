<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>知识详情</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .action-bar button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 52px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-default);
      background: var(--bg-card);
      cursor: pointer;
      font-size: var(--text-xs);
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }
    .action-bar button:active {
      background: var(--bg-card-secondary);
    }
    .section-title-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--space-md);
    }
    .condition-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .condition-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-sm);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .condition-item::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      flex-shrink: 0;
      margin-top: 8px;
    }
    .laws-box-section {
      margin-top: 20px;
    }
    .tip-box-section {
      margin-top: 20px;
    }
    .conditions-section {
      margin-top: 20px;
    }
    .answer-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-primary);
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }
    .empty-state-text {
      font-size: var(--text-base);
      color: var(--text-tertiary);
      margin-top: 16px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="app-container" style="padding-bottom: 140px;">
    <div class="status-bar"></div>
    
    <div class="nav-header">
      <div class="nav-inner">
        <div class="nav-left">
          <button onclick="handleBack()" class="nav-btn">
            <i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
        <div class="nav-center">知识详情</div>
        <div class="nav-right">
          <button class="nav-btn" onclick="handleShare()">
            <i data-lucide="share-2" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
      </div>
    </div>
    
    <div id="page-content" style="padding: 16px;">
    </div>
    
    <div class="action-bar" id="action-bar" style="display: none;">
      <button onclick="handleUseful()">
        <i data-lucide="thumbs-up" style="width: 20px; height: 20px;"></i>
        <span>有用</span>
      </button>
      <button onclick="handleFavoriteAction()">
        <i data-lucide="star" style="width: 20px; height: 20px;"></i>
        <span>收藏</span>
      </button>
      <button onclick="handleShareToFriend()">
        <i data-lucide="share-2" style="width: 20px; height: 20px;"></i>
        <span>分享给朋友</span>
      </button>
    </div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function getCategoryTagColor(categoryId) {
      const cat = getKnowledgeCategoryById(categoryId);
      if (cat) {
        return 'tag-' + cat.color;
      }
      return 'tag-primary';
    }
    
    function renderKnowledge(kpData) {
      const content = document.getElementById('page-content');
      const actionBar = document.getElementById('action-bar');
      actionBar.style.display = 'flex';
      
      const category = getKnowledgeCategoryById(kpData.categoryId);
      const categoryName = category ? category.name : '';
      const tagColorClass = getCategoryTagColor(kpData.categoryId);
      
      let conditionsHtml = '';
      if (kpData.conditions && kpData.conditions.length > 0) {
        let conditionsListHtml = '';
        kpData.conditions.forEach(cond => {
          conditionsListHtml += `<div class="condition-item">${cond}</div>`;
        });
        conditionsHtml = `
          <div class="conditions-section">
            <div class="section-title-row">
              <i data-lucide="list-checks" style="width: 20px; height: 20px; color: var(--color-primary);"></i>
              <span>什么情况可以要求</span>
            </div>
            <div class="condition-list">
              ${conditionsListHtml}
            </div>
          </div>
        `;
      }
      
      const relatedPoints = getRelatedKnowledgePoints(kpData.id, 3);
      let relatedHtml = '';
      relatedPoints.forEach(rp => {
        relatedHtml += `
          <a href="knowledge-detail.html?id=${rp.id}" class="related-item">
            <span style="font-size: var(--text-sm); color: var(--text-primary);">${rp.title}</span>
            <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: var(--text-tertiary);"></i>
          </a>
        `;
      });
      
      content.innerHTML = `
        <div>
          <span class="tag ${tagColorClass}">${categoryName}</span>
          <h1 style="font-size: 20px; font-weight: 700; color: var(--text-primary); margin-top: 12px; line-height: 1.4;">${kpData.title}</h1>
        </div>
        
        <div class="summary-card" style="margin-top: 20px;">
          <div class="answer-text">${kpData.answer}</div>
        </div>
        
        ${conditionsHtml}
        
        <div class="laws-box-section">
          <div class="section-title-row">
            <i data-lucide="scale" style="width: 20px; height: 20px; color: var(--color-secondary);"></i>
            <span>法律依据</span>
          </div>
          <div class="laws-box">${kpData.basis}</div>
        </div>
        
        <div class="tip-box tip-box-section">
          <div class="section-title-row" style="color: var(--color-warning); margin-bottom: var(--space-sm);">
            <i data-lucide="lightbulb" style="width: 20px; height: 20px; color: var(--color-warning);"></i>
            <span>小贴士</span>
          </div>
          <div style="font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.7;">${kpData.tip}</div>
        </div>
        
        <div class="related-list" style="margin-top: 24px;">
          <div style="font-size: var(--text-base); font-weight: 600; color: var(--text-primary); padding: var(--space-lg); padding-bottom: var(--space-sm);">相关问题</div>
          ${relatedHtml}
        </div>
      `;
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    function renderNotFound() {
      const content = document.getElementById('page-content');
      const actionBar = document.getElementById('action-bar');
      actionBar.style.display = 'none';
      
      content.innerHTML = `
        <div class="empty-state">
          <i data-lucide="file-x" style="width: 64px; height: 64px; color: var(--text-tertiary);"></i>
          <div class="empty-state-text">知识点不存在</div>
          <a href="../index.html" class="btn-primary" style="width: auto; padding: 0 32px;">返回首页</a>
        </div>
      `;
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    function handleUseful() {
      showToast('操作成功');
    }
    
    function handleFavoriteAction() {
      showToast('操作成功');
    }
    
    function handleShare() {
      showToast('分享功能开发中');
    }
    
    function handleShareToFriend() {
      showToast('操作成功');
    }
    
    const pointId = getUrlParam('id');
    const kpData = getKnowledgePointById(pointId);
    
    if (kpData) {
      renderKnowledge(kpData);
    } else {
      renderNotFound();
    }
    
    initPage('rights');
  </script>
</body>
</html>
