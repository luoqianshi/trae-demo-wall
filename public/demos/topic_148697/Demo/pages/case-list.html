<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>案例列表</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .list-item-content {
      flex: 1;
      min-width: 0;
    }
    .list-item-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
      margin-top: 6px;
    }
    .list-item-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-top: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar"></div>
    
    <div class="nav-header">
      <div class="nav-inner">
        <div class="nav-left" id="back-btn"></div>
        <div class="nav-center" id="page-title">全部案例</div>
        <div class="nav-right"></div>
      </div>
    </div>
    
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-category="全部">全部</button>
      <button class="filter-tab" data-category="入职">入职</button>
      <button class="filter-tab" data-category="离职">离职</button>
      <button class="filter-tab" data-category="档案转移">档案转移</button>
      <button class="filter-tab" data-category="公积金">公积金</button>
      <button class="filter-tab" data-category="薪资">薪资</button>
      <button class="filter-tab" data-category="买房">买房</button>
      <button class="filter-tab" data-category="维权">维权</button>
      <button class="filter-tab" data-category="仲裁">仲裁</button>
      <button class="filter-tab" data-category="社保">社保</button>
    </div>
    
    <div id="case-list-container">
    </div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let currentScene = null;
    let currentCategory = '全部';
    
    function getTagClass(sceneId) {
      const scene = getSceneById(sceneId);
      if (scene) {
        return 'tag-' + scene.color;
      }
      return 'tag-primary';
    }
    
    function matchCategory(caseCategory, filterCategory) {
      if (filterCategory === '全部') {
        return true;
      }
      if (filterCategory === '公积金') {
        return caseCategory === '公积金' || caseCategory === '公积金提取';
      }
      return caseCategory === filterCategory;
    }
    
    function renderCaseList() {
      const container = document.getElementById('case-list-container');
      let cases = getCasesByScene(currentScene);
      
      if (currentCategory !== '全部') {
        cases = cases.filter(function(item) {
          return matchCategory(item.category, currentCategory);
        });
      }
      
      if (cases.length === 0) {
        container.innerHTML = '<div style="padding: 60px 20px; text-align: center; color: var(--text-tertiary); font-size: 14px;">暂无相关案例</div>';
        return;
      }
      
      let html = '<div style="background: var(--bg-card); border-radius: 0; margin: 0;">';
      cases.forEach(function(item) {
        const tagClass = getTagClass(item.scene);
        const tagText = item.tags[0] || item.category;
        const shortSituation = item.situation.length > 60 ? item.situation.substring(0, 60) + '...' : item.situation;
        html += `
          <a href="case-detail.html?id=${item.id}" class="list-item">
            <div class="list-item-content">
              <span class="tag ${tagClass}">${tagText}</span>
              <div class="list-item-title">${item.title}</div>
              <div class="list-item-desc">${shortSituation}</div>
            </div>
            <i data-lucide="chevron-right" style="width: 20px; height: 20px; color: var(--text-tertiary); flex-shrink: 0; margin-top: 2px;"></i>
          </a>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
      
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    function initFilterTabs() {
      const tabs = document.querySelectorAll('.filter-tab');
      tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
          tabs.forEach(function(t) { t.classList.remove('active'); });
          this.classList.add('active');
          currentCategory = this.getAttribute('data-category');
          renderCaseList();
        });
      });
    }
    
    function init() {
      const sceneId = getUrlParam('scene');
      const titleEl = document.getElementById('page-title');
      
      if (sceneId) {
        currentScene = sceneId;
        const scene = getSceneById(sceneId);
        if (scene) {
          titleEl.textContent = scene.name;
        } else {
          titleEl.textContent = '全部案例';
          currentScene = null;
        }
      } else {
        titleEl.textContent = '全部案例';
        currentScene = null;
      }
      
      initFilterTabs();
      renderCaseList();
      initPage('home');
    }
    
    init();
  </script>
</body>
</html>
