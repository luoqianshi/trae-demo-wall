<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>搜索</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .list-item-main {
      flex: 1;
      min-width: 0;
    }
    .list-item-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.4;
    }
    .list-item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .no-result-text {
      font-size: 14px;
      color: var(--text-tertiary);
      text-align: center;
      margin-top: 60px;
    }
    .section-title-row {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar"></div>
    
    <div class="search-header">
      <div class="search-input-wrap">
        <i data-lucide="search" style="width: 18px; height: 18px; color: var(--text-tertiary);"></i>
        <input type="text" id="search-input" placeholder="搜索问题..." autofocus>
      </div>
      <button class="cancel-btn" onclick="handleBack()">取消</button>
    </div>
    
    <div style="padding: 16px;">
      <div id="hot-search-section">
        <div class="section-title-row">
          <i data-lucide="search" style="width: 18px; height: 18px; color: var(--color-primary);"></i>
          <span>热门搜索</span>
        </div>
        <div class="hot-search-tags" id="hot-search-tags">
        </div>
      </div>
      
      <div id="search-results" style="display: none;">
        <div class="search-result-section" id="cases-section">
          <div class="search-result-title">
            <i data-lucide="folder-open" style="width: 18px; height: 18px; color: var(--color-primary);"></i>
            <span>案例</span>
          </div>
          <div id="cases-list" style="background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-default);">
          </div>
        </div>
        
        <div class="search-result-section" id="points-section" style="margin-top: 20px;">
          <div class="search-result-title">
            <i data-lucide="book-open" style="width: 18px; height: 18px; color: var(--color-secondary);"></i>
            <span>知识点</span>
          </div>
          <div id="points-list" style="background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-default);">
          </div>
        </div>
        
        <div id="no-result" style="display: none;">
          <p class="no-result-text">未找到相关内容，试试换个关键词？</p>
        </div>
      </div>
    </div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let debounceTimer = null;
    
    function getTagClass(sceneId) {
      const scene = getSceneById(sceneId);
      if (scene) {
        return 'tag-' + scene.color;
      }
      return 'tag-primary';
    }
    
    function getKnowledgeCategoryClass(categoryId) {
      const category = getKnowledgeCategoryById(categoryId);
      if (category) {
        return 'tag-' + category.color;
      }
      return 'tag-info';
    }
    
    function renderHotSearches() {
      const container = document.getElementById('hot-search-tags');
      let html = '';
      HOT_SEARCHES.forEach(function(keyword) {
        html += '<span class="hot-tag" onclick="searchByTag(\'' + keyword.replace(/'/g, "\\'") + '\')">' + keyword + '</span>';
      });
      container.innerHTML = html;
    }
    
    function renderResults(keyword) {
      const hotSection = document.getElementById('hot-search-section');
      const resultsSection = document.getElementById('search-results');
      const casesSection = document.getElementById('cases-section');
      const pointsSection = document.getElementById('points-section');
      const noResult = document.getElementById('no-result');
      const casesList = document.getElementById('cases-list');
      const pointsList = document.getElementById('points-list');
      
      if (!keyword || keyword.trim() === '') {
        hotSection.style.display = 'block';
        resultsSection.style.display = 'none';
        return;
      }
      
      hotSection.style.display = 'none';
      resultsSection.style.display = 'block';
      
      const result = searchContent(keyword);
      const cases = result.cases;
      const points = result.points;
      
      if (cases.length === 0 && points.length === 0) {
        casesSection.style.display = 'none';
        pointsSection.style.display = 'none';
        noResult.style.display = 'block';
        return;
      }
      
      noResult.style.display = 'none';
      
      if (cases.length > 0) {
        casesSection.style.display = 'block';
        let casesHtml = '';
        cases.forEach(function(item) {
          const tagClass = getTagClass(item.scene);
          const tagText = item.tags[0] || item.category;
          casesHtml += '<a href="case-detail.html?id=' + item.id + '" class="list-item" style="border-radius: 0;">';
          casesHtml += '<i data-lucide="briefcase" style="width: 20px; height: 20px; color: var(--color-primary); flex-shrink: 0; margin-top: 2px;"></i>';
          casesHtml += '<div class="list-item-main">';
          casesHtml += '<div class="list-item-title">' + item.title + '</div>';
          casesHtml += '<div class="list-item-meta"><span class="tag ' + tagClass + '">' + tagText + '</span></div>';
          casesHtml += '</div>';
          casesHtml += '</a>';
        });
        casesList.innerHTML = casesHtml;
      } else {
        casesSection.style.display = 'none';
      }
      
      if (points.length > 0) {
        pointsSection.style.display = 'block';
        let pointsHtml = '';
        points.forEach(function(item) {
          const category = getKnowledgeCategoryById(item.categoryId);
          const catClass = getKnowledgeCategoryClass(item.categoryId);
          const catName = category ? category.name : '';
          pointsHtml += '<a href="knowledge-detail.html?id=' + item.id + '" class="list-item" style="border-radius: 0;">';
          pointsHtml += '<i data-lucide="lightbulb" style="width: 20px; height: 20px; color: var(--color-accent); flex-shrink: 0; margin-top: 2px;"></i>';
          pointsHtml += '<div class="list-item-main">';
          pointsHtml += '<div class="list-item-title">' + item.title + '</div>';
          pointsHtml += '<div class="list-item-meta"><span class="tag ' + catClass + '">' + catName + '</span></div>';
          pointsHtml += '</div>';
          pointsHtml += '</a>';
        });
        pointsList.innerHTML = pointsHtml;
      } else {
        pointsSection.style.display = 'none';
      }
      
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    function handleInput() {
      const input = document.getElementById('search-input');
      const keyword = input.value;
      
      if (debounceTimer) {
        clearTimeout(debounceTimer);
      }
      
      debounceTimer = setTimeout(function() {
        renderResults(keyword);
      }, 300);
    }
    
    function searchByTag(keyword) {
      const input = document.getElementById('search-input');
      input.value = keyword;
      renderResults(keyword);
    }
    
    function init() {
      renderHotSearches();
      
      const input = document.getElementById('search-input');
      input.addEventListener('input', handleInput);
      
      initPage('');
    }
    
    init();
  </script>
</body>
</html>
