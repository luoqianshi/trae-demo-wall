<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的档案去哪儿了 - 民生档案权益助手</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .step-content {
      display: none;
    }
    .step-content.active {
      display: block;
    }
    .btn-row {
      display: flex;
      gap: 12px;
    }
    .btn-row .btn-outline {
      flex: 1;
      height: 48px;
      font-size: 15px;
      border-radius: 8px;
    }
    .btn-row .btn-primary {
      flex: 1;
    }
    .btn-two-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-two-row .btn-row {
      gap: 12px;
    }
    .location-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 8px;
      line-height: 1.6;
    }
    .star-row {
      display: flex;
      gap: 2px;
      margin-top: 8px;
      align-items: center;
    }
    .other-locations {
      margin-top: 16px;
    }
    .other-locations-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .tip-box-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .tip-box-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-warning);
      margin-bottom: 8px;
    }
    .identity-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .identity-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.5;
    }
    .location-label {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .location-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 4px;
      line-height: 1.5;
    }
    .center-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .center-address {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.5;
    }
    .center-links {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }
    .step-label {
      font-size: 11px;
      color: var(--text-tertiary);
    }
    .step-label.active {
      color: var(--color-primary);
    }
    .step-label.inactive {
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="app-container" style="padding-bottom: 120px;">
    <div class="status-bar"></div>
    
    <div class="nav-header">
      <div class="nav-inner">
        <div class="nav-left" id="back-btn"></div>
        <div class="nav-center" id="page-title">我的档案去哪儿了</div>
        <div class="nav-right"></div>
      </div>
    </div>
    
    <div style="padding: 20px 16px;">
      <div class="progress-steps" id="progress-steps">
        <div class="step-item">
          <div class="step-circle active" data-step="1">1</div>
          <span class="step-label active" data-label="1">选择身份</span>
        </div>
        <div class="step-line" data-line="1"></div>
        <div class="step-item">
          <div class="step-circle pending" data-step="2">2</div>
          <span class="step-label" data-label="2">匹配建议</span>
        </div>
        <div class="step-line" data-line="2"></div>
        <div class="step-item">
          <div class="step-circle pending" data-step="3">3</div>
          <span class="step-label" data-label="3">查询入口</span>
        </div>
      </div>
      
      <div id="step-content">
        <div class="step-content active" id="step-1">
          <div style="font-size: 18px; font-weight: 700; color: var(--text-primary);">请选择你的当前身份</div>
          <div style="font-size: 14px; color: var(--text-secondary); margin-top: 8px;">我们将根据你的情况匹配最可能的档案存放地</div>
          <div id="identity-list" style="margin-top: 24px;"></div>
          <div style="margin-top: 32px;">
            <button class="btn-primary" id="btn-next-1" disabled onclick="goToStep(2)">下一步</button>
          </div>
        </div>
        
        <div class="step-content" id="step-2">
          <div style="font-size: 18px; font-weight: 700; color: var(--text-primary);">根据你的情况，档案可能在这里</div>
          <div id="match-result" style="margin-top: 20px;"></div>
          <div class="btn-row" style="margin-top: 32px;">
            <button class="btn-outline" onclick="goToStep(1)">上一步</button>
            <button class="btn-primary" onclick="goToStep(3)">下一步</button>
          </div>
        </div>
        
        <div class="step-content" id="step-3">
          <div style="font-size: 18px; font-weight: 700; color: var(--text-primary);">选择城市，获取官方查询入口</div>
          <select class="city-select" id="city-select" style="margin-top: 20px;" onchange="onCityChange()">
            <option value="">请选择城市</option>
          </select>
          <div id="centers-container" style="margin-top: 20px;"></div>
          <div style="font-size: 13px; color: var(--text-secondary); margin-top: 16px; text-align: center;">查询档案时记得带上身份证</div>
          <div class="btn-two-row" style="margin-top: 32px;">
            <div class="btn-row">
              <button class="btn-outline" onclick="showToast('结果已保存（Demo功能）')">保存结果</button>
              <button class="btn-outline" onclick="showToast('分享功能（Demo功能）')">分享给朋友</button>
            </div>
            <button class="btn-primary" onclick="resetGuide()">重新开始</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let currentStep = 1;
    let selectedIdentity = null;
    let selectedCity = null;
    
    function renderIdentityOptions() {
      const container = document.getElementById('identity-list');
      let html = '';
      IDENTITY_OPTIONS.forEach(option => {
        html += `
          <div class="identity-card" data-id="${option.id}" onclick="selectIdentity('${option.id}')">
            <div class="radio-circle">
              <div class="radio-dot" style="display: none;"></div>
            </div>
            <div>
              <div class="identity-name">${option.name}</div>
              <div class="identity-desc">${option.desc}</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }
    
    function selectIdentity(id) {
      selectedIdentity = id;
      const cards = document.querySelectorAll('.identity-card');
      cards.forEach(card => {
        const dot = card.querySelector('.radio-dot');
        if (card.dataset.id === id) {
          card.classList.add('selected');
          dot.style.display = 'block';
        } else {
          card.classList.remove('selected');
          dot.style.display = 'none';
        }
      });
      document.getElementById('btn-next-1').disabled = false;
    }
    
    function renderCityOptions() {
      const select = document.getElementById('city-select');
      let html = '<option value="">请选择城市</option>';
      CITY_DATA.forEach(city => {
        html += `<option value="${city.id}">${city.name}</option>`;
      });
      select.innerHTML = html;
    }
    
    function onCityChange() {
      const select = document.getElementById('city-select');
      selectedCity = select.value;
      if (selectedCity) {
        renderCenters(selectedCity);
      } else {
        document.getElementById('centers-container').innerHTML = '';
      }
    }
    
    function renderCenters(cityId) {
      const city = getCityById(cityId);
      const container = document.getElementById('centers-container');
      if (!city) {
        container.innerHTML = '';
        return;
      }
      let html = '';
      city.centers.forEach(center => {
        html += `
          <div class="center-card">
            <div class="center-name">${center.name}</div>
            <div class="center-address">${center.address}</div>
            <div class="center-links">
              <a href="tel:${center.phone}" class="center-link">
                <i data-lucide="phone" style="width: 14px; height: 14px;"></i>
                ${center.phone}
              </a>
              <a href="${center.website}" target="_blank" class="center-link">
                <i data-lucide="external-link" style="width: 14px; height: 14px;"></i>
                官网
              </a>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    function renderMatchResult() {
      const identity = getIdentityById(selectedIdentity);
      const container = document.getElementById('match-result');
      if (!identity) return;
      
      let otherHtml = '';
      if (identity.otherLocations && identity.otherLocations.length > 0) {
        otherHtml = '<div class="other-locations"><div class="other-locations-title">其他可能存放地：</div>';
        identity.otherLocations.forEach(loc => {
          otherHtml += `<div class="other-location-item">${loc}</div>`;
        });
        otherHtml += '</div>';
      }
      
      const html = `
        <div class="location-card">
          <div class="location-label">最可能的存放地</div>
          <div class="location-name">${identity.likelyLocation.name}</div>
          <div class="star-row">${renderStars(identity.likelyLocation.probability)}</div>
          <div class="location-desc">${identity.likelyLocation.desc}</div>
        </div>
        ${otherHtml}
        <div class="tip-box" style="margin-top: 20px;">
          <div class="tip-box-title">
            <i data-lucide="alert-circle" style="width: 16px; height: 16px;"></i>
            注意事项
          </div>
          <div class="tip-box-text">${identity.tip}</div>
        </div>
      `;
      container.innerHTML = html;
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    function updateProgress() {
      const circles = document.querySelectorAll('.step-circle');
      const labels = document.querySelectorAll('.step-label');
      const lines = document.querySelectorAll('.step-line');
      
      circles.forEach((circle, index) => {
        const step = index + 1;
        circle.classList.remove('active', 'inactive', 'pending');
        if (step < currentStep) {
          circle.classList.add('inactive');
          circle.innerHTML = '<i data-lucide="check" style="width: 14px; height: 14px;"></i>';
        } else if (step === currentStep) {
          circle.classList.add('active');
          circle.textContent = step;
        } else {
          circle.classList.add('pending');
          circle.textContent = step;
        }
      });
      
      labels.forEach((label, index) => {
        const step = index + 1;
        label.classList.remove('active', 'inactive');
        if (step <= currentStep) {
          label.classList.add(step < currentStep ? 'inactive' : 'active');
        }
      });
      
      lines.forEach((line, index) => {
        const lineStep = index + 1;
        line.classList.remove('active');
        if (lineStep < currentStep) {
          line.classList.add('active');
        }
      });
      
      if (window.lucide) {
        lucide.createIcons();
      }
    }
    
    function goToStep(step) {
      currentStep = step;
      const steps = document.querySelectorAll('.step-content');
      steps.forEach(s => s.classList.remove('active'));
      document.getElementById('step-' + step).classList.add('active');
      
      if (step === 2) {
        renderMatchResult();
      }
      
      updateProgress();
      window.scrollTo(0, 0);
    }
    
    function resetGuide() {
      currentStep = 1;
      selectedIdentity = null;
      selectedCity = null;
      
      const cards = document.querySelectorAll('.identity-card');
      cards.forEach(card => {
        card.classList.remove('selected');
        const dot = card.querySelector('.radio-dot');
        if (dot) dot.style.display = 'none';
      });
      document.getElementById('btn-next-1').disabled = true;
      document.getElementById('city-select').value = '';
      document.getElementById('centers-container').innerHTML = '';
      
      goToStep(1);
    }
    
    renderIdentityOptions();
    renderCityOptions();
    initPage('archive');
  </script>
</body>
</html>
