<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>权益指南 - 民生档案权益助手</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .category-info-wrap {
      flex: 1;
      min-width: 0;
    }
    .category-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
    }
    .category-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.4;
    }
    .category-count {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }
    .category-arrow {
      flex-shrink: 0;
      color: var(--text-tertiary);
    }
    .cat-icon-primary { background: #CCFBF1; color: #0D9488; }
    .cat-icon-secondary { background: #E0F2FE; color: #0369A1; }
    .cat-icon-warning { background: #FEF3C7; color: #D97706; }
    .cat-icon-info { background: #DBEAFE; color: #2563EB; }
    .cat-icon-success { background: #DCFCE7; color: #16A34A; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar"></div>
    
    <div class="nav-header">
      <div class="nav-inner">
        <div class="nav-left" id="back-btn"></div>
        <div class="nav-center" id="page-title">权益指南</div>
        <div class="nav-right"></div>
      </div>
    </div>
    
    <div style="padding: 16px;">
      <div class="search-bar" id="search-bar" style="margin-bottom: 20px; cursor: pointer;">
        <i data-lucide="search" style="width: 18px; height: 18px; color: var(--text-tertiary);"></i>
        <input type="text" placeholder="搜索权益知识..." readonly style="cursor: pointer;">
      </div>
      
      <div id="category-list"></div>
    </div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function renderCategories() {
      const container = document.getElementById('category-list');
      let html = '';
      KNOWLEDGE_CATEGORIES.forEach(cat => {
        let iconBgClass = '';
        if (cat.color === 'primary') iconBgClass = 'cat-icon-primary';
        else if (cat.color === 'secondary') iconBgClass = 'cat-icon-secondary';
        else if (cat.color === 'warning') iconBgClass = 'cat-icon-warning';
        else if (cat.color === 'info') iconBgClass = 'cat-icon-info';
        else if (cat.color === 'success') iconBgClass = 'cat-icon-success';
        
        html += `
          <a href="knowledge-list.html?category=${cat.id}" class="category-card">
            <div class="category-icon ${iconBgClass}">
              <i data-lucide="${cat.icon}" style="width: 24px; height: 24px;"></i>
            </div>
            <div class="category-info-wrap">
              <div class="category-name">${cat.name}</div>
              <div class="category-desc">${cat.desc}</div>
              <div class="category-count">${cat.count}个问题</div>
            </div>
            <div class="category-arrow">
              <i data-lucide="chevron-right" style="width: 20px; height: 20px;"></i>
            </div>
          </a>
        `;
      });
      container.innerHTML = html;
    }
    
    document.getElementById('search-bar').addEventListener('click', function() {
      window.location.href = 'search.html';
    });
    
    renderCategories();
    initPage('rights');
  </script>
</body>
</html>
