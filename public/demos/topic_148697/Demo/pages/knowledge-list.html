<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>知识点列表 - 民生档案权益助手</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .filter-tabs {
      position: sticky;
      top: 44px;
      z-index: 40;
      background: var(--bg-page);
    }
    .kp-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .kp-card-answer {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .kp-card .tag {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar"></div>
    
    <div class="nav-header">
      <div class="nav-inner">
        <div class="nav-left">
          <button onclick="handleBack()" class="nav-btn">
            <i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
        <div class="nav-center" id="nav-title">全部知识</div>
        <div class="nav-right"></div>
      </div>
    </div>
    
    <div class="filter-tabs" id="filter-tabs"></div>
    
    <div id="kp-list-container" style="background: var(--bg-card); border-radius: var(--radius-lg); margin: 0 16px; box-shadow: var(--shadow-sm); overflow: hidden;"></div>
    
    <div class="tab-bar" id="tab-bar"></div>
    <div class="tab-safe-area"></div>
  </div>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let currentCategory = 'all';

    function getTagColorClass(color) {
      const colorMap = {
        'primary': 'tag-primary',
        'secondary': 'tag-secondary',
        'warning': 'tag-warning',
        'info': 'tag-info',
        'success': 'tag-success',
        'error': 'tag-error'
      };
      return colorMap[color] || 'tag-primary';
    }

    function renderFilterTabs() {
      const container = document.getElementById('filter-tabs');
      let html = '';
      
      html += `<div class="filter-tab ${currentCategory === 'all' ? 'active' : ''}" data-category="all">全部</div>`;
      
      KNOWLEDGE_CATEGORIES.forEach(cat => {
        const isActive = currentCategory === cat.id ? 'active' : '';
        html += `<div class="filter-tab ${isActive}" data-category="${cat.id}">${cat.name}</div>`;
      });
      
      container.innerHTML = html;
      
      container.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          const catId = this.getAttribute('data-category');
          currentCategory = catId;
          updateNavTitle();
          renderFilterTabs();
          renderKnowledgeList();
        });
      });
    }

    function updateNavTitle() {
      const titleEl = document.getElementById('nav-title');
      if (!currentCategory || currentCategory === 'all') {
        titleEl.textContent = '全部知识';
      } else {
        const category = getKnowledgeCategoryById(currentCategory);
        titleEl.textContent = category ? category.name : '全部知识';
      }
    }

    function renderKnowledgeList() {
      const container = document.getElementById('kp-list-container');
      const points = getKnowledgePointsByCategory(currentCategory);
      
      if (points.length === 0) {
        container.innerHTML = '<div style="padding: 60px 20px; text-align: center; color: var(--text-tertiary); font-size: 14px;">暂无相关知识点</div>';
        return;
      }
      
      let html = '';
      points.forEach(point => {
        const category = getKnowledgeCategoryById(point.categoryId);
        const tagClass = category ? getTagColorClass(category.color) : 'tag-primary';
        const tagName = category ? category.name : '';
        const answerPreview = point.answer.length > 60 ? point.answer.substring(0, 60) + '...' : point.answer;
        
        html += `
          <a href="knowledge-detail.html?id=${point.id}" class="kp-card">
            <span class="tag ${tagClass}">${tagName}</span>
            <div class="kp-card-title">${point.title}</div>
            <div class="kp-card-answer">${answerPreview}</div>
          </a>
        `;
      });
      
      container.innerHTML = html;
      
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function init() {
      const urlCategory = getUrlParam('category');
      if (urlCategory) {
        currentCategory = urlCategory;
      }
      
      updateNavTitle();
      renderFilterTabs();
      renderKnowledgeList();
      initPage('rights');
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
