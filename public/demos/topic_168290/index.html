<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuralForge - AI模型锻造工作台</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CSS Variables & Design System
   ============================================================ */
:root {
  --sky-400: #45A6E8;
  --sky-500: #4A90D9;
  --sky-600: #3A7BC8;
  --sky-700: #2A5FA0;
  --sky-glow: rgba(74,144,217,0.3);
  --purple-400: #9B7CFC;
  --purple-500: #7C5CE7;
  --purple-600: #6A4DD4;
  --purple-glow: rgba(124,92,231,0.3);
  --bg-deep: #0A0E17;
  --bg-card: #111827;
  --bg-card-hover: #1A2332;
  --bg-input: #1E293B;
  --border-subtle: rgba(255,255,255,0.06);
  --border-glow: rgba(74,144,217,0.2);
  --text-primary: #E8EDF5;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --success: #22C55E;
  --warning: #F59E0B;
  --danger: #EF4444;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --font-title: 'Orbitron', 'Geometric Sans-Serif', sans-serif;
  --font-body: 'Inter', 'Neo-Grotesque', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Monospace', monospace;
  --transition-fast: 150ms cubic-bezier(0.4,0,0.2,1);
  --transition-smooth: 300ms cubic-bezier(0.4,0,0.2,1);
  --transition-bounce: 400ms cubic-bezier(0.34,1.56,0.64,1);
}

/* ============================================================
   Reset & Base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg-deep);
  color:var(--text-primary);
  overflow:hidden;
  height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:3px}

/* ============================================================
   Particle Background
   ============================================================ */
#particles-canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}

/* ============================================================
   App Container
   ============================================================ */
#app{
  position:relative;z-index:1;
  width:100%;height:100vh;
  display:flex;flex-direction:column;
}

/* ============================================================
   Login Page
   ============================================================ */
.login-page{
  display:flex;align-items:center;justify-content:center;
  height:100vh;width:100%;
  position:relative;
}
.login-bg-ring{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(74,144,217,0.08);
  animation:ringPulse 4s ease-in-out infinite;
}
.login-bg-ring:nth-child(1){width:600px;height:600px;animation-delay:0s}
.login-bg-ring:nth-child(2){width:800px;height:800px;animation-delay:0.5s}
.login-bg-ring:nth-child(3){width:1000px;height:1000px;animation-delay:1s}
@keyframes ringPulse{
  0%,100%{transform:scale(1);opacity:0.3}
  50%{transform:scale(1.05);opacity:0.6}
}
.login-card{
  position:relative;z-index:2;
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-xl);
  padding:48px 40px;
  width:440px;
  max-width:95vw;
  box-shadow:0 0 60px rgba(74,144,217,0.08),0 0 120px rgba(124,92,231,0.04);
  backdrop-filter:blur(20px);
}
.login-logo{
  text-align:center;margin-bottom:36px;
}
.login-logo .icon-forge{
  width:56px;height:56px;
  margin:0 auto 16px;
  background:linear-gradient(135deg,var(--sky-500),var(--purple-500));
  border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  box-shadow:0 0 30px var(--sky-glow);
}
.login-logo h1{
  font-family:var(--font-title);
  font-size:1.5rem;
  font-weight:700;
  background:linear-gradient(135deg,var(--sky-400),var(--purple-400));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:0.05em;
}
.login-logo p{
  color:var(--text-secondary);
  font-size:0.85rem;
  margin-top:6px;
}
.login-form{margin-top:8px}
.form-group{margin-bottom:20px}
.form-group label{
  display:block;font-size:0.8rem;color:var(--text-secondary);
  margin-bottom:8px;font-weight:500;
}
.phone-input-wrapper{
  display:flex;align-items:center;
  background:var(--bg-input);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);
  transition:border-color var(--transition-fast);
  overflow:hidden;
}
.phone-input-wrapper:focus-within{
  border-color:var(--sky-500);
  box-shadow:0 0 0 3px var(--sky-glow);
}
.phone-prefix{
  padding:12px 16px;
  color:var(--text-primary);
  font-weight:600;
  font-size:0.9rem;
  border-right:1px solid var(--border-subtle);
  background:rgba(0,0,0,0.2);
}
.phone-input-wrapper input{
  flex:1;padding:12px 16px;
  background:transparent;border:none;outline:none;
  color:var(--text-primary);font-size:0.95rem;
  font-family:var(--font-body);
}
.phone-input-wrapper input::placeholder{color:var(--text-muted)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:8px;padding:12px 24px;
  border:none;border-radius:var(--radius-md);
  font-family:var(--font-body);
  font-size:0.9rem;font-weight:600;
  cursor:pointer;
  transition:all var(--transition-fast);
  position:relative;overflow:hidden;
}
.btn-primary{
  width:100%;
  background:linear-gradient(135deg,var(--sky-500),var(--sky-600));
  color:white;
  box-shadow:0 4px 20px var(--sky-glow);
}
.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 30px rgba(74,144,217,0.5);
}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{
  opacity:0.5;cursor:not-allowed;
  transform:none;box-shadow:none;
}
.btn-send-code{
  padding:8px 16px;
  background:var(--purple-500);
  color:white;font-size:0.8rem;
  border-radius:var(--radius-sm);
  white-space:nowrap;
  min-width:110px;
  box-shadow:0 2px 12px var(--purple-glow);
}
.btn-send-code:hover:not(:disabled){
  background:var(--purple-600);
  box-shadow:0 4px 20px rgba(124,92,231,0.5);
}
.btn-send-code:disabled{
  background:var(--bg-input);
  color:var(--text-muted);
  box-shadow:none;cursor:not-allowed;
}
.verify-code-group{
  display:flex;gap:10px;justify-content:center;
}
.verify-code-group input{
  width:48px;height:56px;
  text-align:center;
  font-size:1.3rem;font-weight:700;
  font-family:var(--font-mono);
  background:var(--bg-input);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-sm);
  color:var(--text-primary);
  transition:all var(--transition-fast);
}
.verify-code-group input:focus{
  outline:none;
  border-color:var(--sky-500);
  box-shadow:0 0 0 3px var(--sky-glow);
}
.verify-code-group input.filled{
  border-color:var(--sky-500);
  background:rgba(74,144,217,0.1);
}
.login-error{
  color:var(--danger);
  font-size:0.8rem;
  text-align:center;
  margin-top:12px;
  min-height:20px;
}

/* ============================================================
   Main Layout (After Login)
   ============================================================ */
.main-layout{display:flex;height:100vh;width:100%}
.sidebar{
  width:64px;min-width:64px;
  background:var(--bg-card);
  border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;
  align-items:center;padding:16px 0;
  gap:8px;z-index:10;
}
.sidebar-logo{
  width:40px;height:40px;
  background:linear-gradient(135deg,var(--sky-500),var(--purple-500));
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;margin-bottom:16px;
  box-shadow:0 0 16px var(--sky-glow);
}
.sidebar-nav{
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
  flex:1;
}
.sidebar-btn{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);
  border:none;background:transparent;
  color:var(--text-secondary);
  cursor:pointer;
  transition:all var(--transition-fast);
  position:relative;
  font-size:20px;
}
.sidebar-btn:hover{
  background:rgba(74,144,217,0.1);
  color:var(--sky-400);
}
.sidebar-btn.active{
  background:rgba(74,144,217,0.15);
  color:var(--sky-400);
  box-shadow:0 0 12px var(--sky-glow);
}
.sidebar-btn.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:20px;
  background:linear-gradient(180deg,var(--sky-400),var(--purple-400));
  border-radius:0 3px 3px 0;
}
.sidebar-tooltip{
  position:absolute;left:56px;top:50%;transform:translateY(-50%);
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  padding:6px 12px;border-radius:var(--radius-sm);
  font-size:0.75rem;color:var(--text-primary);
  white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity var(--transition-fast);
  z-index:100;
}
.sidebar-btn:hover .sidebar-tooltip{opacity:1}
.sidebar-user{
  width:40px;height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple-500),var(--sky-500));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:white;
  cursor:pointer;margin-top:auto;
  font-family:var(--font-body);
}
.main-content{
  flex:1;overflow:hidden;
  position:relative;
}

/* ============================================================
   Page: Forge (锻造工作台)
   ============================================================ */
.forge-page{
  display:flex;height:100%;position:relative;
}
.forge-camera-panel{
  flex:0 0 60%;width:60%;
  display:flex;flex-direction:column;
  background:var(--bg-deep);
  border-right:1px solid var(--border-subtle);
  position:relative;overflow:hidden;
}
.forge-chat-panel{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
  background:var(--bg-card);
}

/* Camera Panel */
.camera-container{
  flex:1;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:#000;
  margin:12px;border-radius:var(--radius-lg);
  overflow:hidden;
  border:1px solid var(--border-subtle);
}
.camera-container video{
  width:100%;height:100%;
  object-fit:cover;
}
#modelOverlay{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:5;
}
.camera-overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;
  background:linear-gradient(0deg,rgba(10,14,23,0.3) 0%,transparent 30%,transparent 70%,rgba(10,14,23,0.3) 100%);
}
.camera-scanline{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--sky-400),transparent);
  animation:scanline 3s linear infinite;
  opacity:0.5;
}
@keyframes scanline{
  0%{top:0%}
  100%{top:100%}
}
.camera-placeholder{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;
  color:var(--text-muted);
  text-align:center;
}
.camera-placeholder .ph-icon{
  width:80px;height:80px;
  border-radius:50%;
  background:rgba(74,144,217,0.08);
  border:2px dashed var(--border-glow);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
  animation:placeholderPulse 2s ease-in-out infinite;
}
@keyframes placeholderPulse{
  0%,100%{box-shadow:0 0 20px rgba(74,144,217,0.1)}
  50%{box-shadow:0 0 40px rgba(74,144,217,0.2)}
}
.camera-placeholder p{font-size:0.9rem}
.camera-controls{
  display:flex;align-items:center;gap:12px;
  padding:8px 16px;margin:0 12px 12px;
  background:var(--bg-card);
  border-radius:var(--radius-md);
  border:1px solid var(--border-subtle);
}
.camera-controls .cam-label{
  font-size:0.75rem;color:var(--text-secondary);
  font-family:var(--font-mono);
  display:flex;align-items:center;gap:6px;
}
.camera-controls .cam-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--success);
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.camera-controls select{
  background:var(--bg-input);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-sm);
  color:var(--text-primary);
  padding:6px 12px;
  font-size:0.8rem;
  font-family:var(--font-body);
  cursor:pointer;
  outline:none;
}
.camera-controls select:focus{
  border-color:var(--sky-500);
}
.btn-capture{
  background:var(--primary);
  border:none;color:#fff;
  padding:5px 14px;border-radius:var(--radius-sm);
  font-size:0.75rem;cursor:pointer;
  font-family:var(--font-body);
  transition:all 0.2s;
  white-space:nowrap;
}
.btn-capture:hover{background:var(--sky-600);transform:scale(1.05);}
.btn-capture:active{transform:scale(0.95);}
.capture-strip{
  display:flex;gap:6px;padding:4px 12px;margin:0 12px 8px;
  overflow-x:auto;max-height:64px;
}
.capture-strip img{
  height:56px;width:56px;object-fit:cover;
  border-radius:4px;border:1px solid var(--border-subtle);
  cursor:pointer;transition:all 0.2s;
}
.capture-strip img:hover{transform:scale(1.1);border-color:var(--primary);}
.btn-icon-websearch{}
/* 网络搜索弹窗 */
.websearch-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.websearch-modal{background:var(--bg-card);border-radius:var(--radius-lg);padding:24px;width:520px;max-width:90vw;border:1px solid var(--border-subtle);}
.websearch-modal h3{font-size:1.1rem;margin-bottom:4px;color:var(--text-primary);}
.websearch-input-row{display:flex;gap:8px;margin-bottom:16px;}
.websearch-input{flex:1;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:0.85rem;outline:none;}
.websearch-input:focus{border-color:var(--primary);}
.websearch-platforms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.ws-platform{padding:12px;background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-md);cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.ws-platform:hover{border-color:var(--primary);background:rgba(74,144,217,0.08);transform:translateY(-1px);}
.ws-icon{font-size:1.5rem;}
.ws-name{font-size:0.85rem;color:var(--text-primary);font-weight:600;}
.ws-hint{font-size:0.7rem;color:var(--text-muted);}
.websearch-tip{padding:10px 14px;background:rgba(74,144,217,0.08);border-radius:var(--radius-md);font-size:0.78rem;color:var(--text-secondary);line-height:1.5;border:1px solid rgba(74,144,217,0.15);}

/* ============================================================
   项目总览页
   ============================================================ */
.overview-page{
  padding:32px 40px;max-width:1100px;margin:0 auto;
  height:calc(100vh - 32px);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--border-subtle) transparent;
}
.overview-header{
  text-align:center;margin-bottom:36px;padding-bottom:24px;
  border-bottom:1px solid var(--border-subtle);
}
.overview-header h1{font-size:1.6rem;color:var(--text-primary);margin-bottom:8px;}
.overview-subtitle{font-size:0.85rem;color:var(--text-muted);}
.overview-section{margin-bottom:36px;}
.ov-section-title{
  font-size:1.15rem;color:var(--text-primary);margin-bottom:18px;
  padding-bottom:10px;border-bottom:2px solid var(--border-subtle);
  display:flex;align-items:center;gap:10px;
}
.ov-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--sky-500),var(--primary));
  color:#fff;font-size:0.8rem;font-weight:700;flex-shrink:0;
}
.ov-grid-3{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  margin-bottom:16px;
}
.ov-card{
  background:var(--bg-card);border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);padding:20px;
  transition:border-color 0.2s,transform 0.2s;
}
.ov-card:hover{border-color:var(--primary);transform:translateY(-2px);}
.ov-card-icon{font-size:1.6rem;margin-bottom:10px;}
.ov-card h3{font-size:0.9rem;color:var(--text-primary);margin-bottom:12px;font-weight:600;}
.ov-list{list-style:none;padding:0;margin:0;}
.ov-list li{
  font-size:0.76rem;color:var(--text-secondary);line-height:1.7;
  padding:3px 0;padding-left:2px;
}

/* 痛点 */
.pain-points{display:flex;flex-direction:column;gap:12px;}
.pain-card{
  display:flex;gap:16px;align-items:flex-start;
  background:var(--bg-card);border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);padding:18px 20px;
  transition:border-color 0.2s;
}
.pain-card:hover{border-color:rgba(124,92,231,0.4);}
.pain-icon{font-size:1.8rem;flex-shrink:0;width:44px;text-align:center;}
.pain-content h3{font-size:0.88rem;color:var(--text-primary);margin-bottom:6px;font-weight:600;}
.pain-content p{font-size:0.78rem;color:var(--text-secondary);line-height:1.65;margin:0;}

/* 竞争力 */
.compet-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
}
.compet-card{
  background:var(--bg-card);border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);padding:18px;
}
.compet-card.highlight{
  border-color:var(--primary);
  background:linear-gradient(135deg,rgba(74,144,217,0.06),rgba(124,92,231,0.04));
  grid-column:1/-1;
}
.compet-card h3{font-size:0.9rem;color:var(--text-primary);margin-bottom:12px;font-weight:600;}
.compet-items{display:flex;flex-direction:column;gap:8px;}
.compet-item{
  font-size:0.78rem;color:var(--text-secondary);line-height:1.6;
  display:flex;gap:8px;align-items:flex-start;
}
.compet-badge,.compet-badge-tech,.compet-badge-design,.compet-badge-val{
  flex-shrink:0;font-size:0.65rem;padding:2px 8px;border-radius:10px;
  font-weight:600;white-space:nowrap;margin-top:1px;
}
.compet-badge{background:rgba(74,144,217,0.15);color:var(--primary);}
.compet-badge-tech{background:rgba(124,92,231,0.15);color:var(--purple);}
.compet-badge-design{background:rgba(245,158,11,0.15);color:#f59e0b;}
.compet-badge-val{background:rgba(34,197,94,0.15);color:#22c55e;}

/* 落地性 */
.feasibility-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
}
.feas-card{
  background:var(--bg-card);border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);padding:20px;
}
.feas-card h3{font-size:0.9rem;color:var(--text-primary);margin-bottom:10px;font-weight:600;}
.feas-bar{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
  font-size:0.8rem;color:var(--text-primary);font-weight:600;
}
.feas-bar span{min-width:36px;text-align:right;}
.feas-fill{
  height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--primary),var(--purple));
  transition:width 0.6s ease;
}
.feas-list{list-style:none;padding:0;margin:0;}
.feas-list li{font-size:0.76rem;color:var(--text-secondary);line-height:1.7;padding:2px 0;}

/* 竞品对比表 */
.ov-table-wrap{overflow-x:auto;}
.ov-table{
  width:100%;border-collapse:collapse;
  font-size:0.8rem;
}
.ov-table th,.ov-table td{
  padding:10px 14px;text-align:center;
  border-bottom:1px solid var(--border-subtle);
}
.ov-table th{
  background:rgba(74,144,217,0.08);color:var(--text-primary);font-weight:600;
  font-size:0.78rem;
}
.ov-table td{color:var(--text-secondary);}

.overview-footer{

}
.model-status-bar{

}
.chat-header h2{

}
.chat-header .ai-badge{

}
.chat-msg.user .msg-avatar{
  background:linear-gradient(135deg,var(--sky-500),var(--sky-600));
}
.chat-msg.ai .msg-avatar{

}
.chat-msg .msg-bubble{

}

.chat-msg .msg-time{

}

}

}

.chat-actions{display:flex;gap:6px}
.btn-icon{

}

}

.kc-header{

}
.sd-desc{font-size:0.85rem;color:var(--text-secondary);line-height:1.7;margin-bottom:16px;}
.sd-info-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;
}
.sd-info-item{
  padding:12px;background:var(--bg-input);border-radius:var(--radius-md);
  border:1px solid var(--border-subtle);
}
.sd-info-item .label{font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;}
.sd-info-item .value{font-size:0.9rem;color:var(--text-primary);font-weight:600;}
.sd-comments-section{margin-top:16px;}
.sd-comments-section h4{
  font-size:0.9rem;color:var(--text-primary);margin-bottom:12px;
  display:flex;align-items:center;gap:6px;
}
.sd-comment-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.sd-comment{
  padding:12px;background:var(--bg-input);border-radius:var(--radius-md);
  border:1px solid var(--border-subtle);
}
.sd-comment .sc-author{
  font-size:0.75rem;color:var(--sky-400);font-weight:600;margin-bottom:4px;
}
.sd-comment .sc-content{font-size:0.8rem;color:var(--text-secondary);line-height:1.5;}
.sd-quick-comments{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;
}
.quick-comment-btn{
  padding:6px 12px;border-radius:16px;
  background:var(--bg-input);border:1px solid var(--border-subtle);
  color:var(--text-secondary);font-size:0.75rem;cursor:pointer;
  transition:all var(--transition-fast);font-family:var(--font-body);
}
.quick-comment-btn:hover{
  border-color:var(--purple-500);color:var(--purple-400);
  background:rgba(124,92,231,0.08);
}
.sd-footer{
  padding:16px 24px;border-top:1px solid var(--border-subtle);
  display:flex;justify-content:space-between;align-items:center;
}
.sd-stats{display:flex;gap:20px;}
.sd-stat{
  display:flex;align-items:center;gap:6px;
  font-size:0.85rem;color:var(--text-secondary);
}
.sd-btn-like{
  padding:8px 20px;border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--sky-500),var(--purple-500));
  color:white;border:none;cursor:pointer;font-size:0.85rem;
  display:flex;align-items:center;gap:6px;
  transition:all var(--transition-fast);font-family:var(--font-body);
}
.sd-btn-like:hover{transform:translateY(-1px);box-shadow:0 4px 16px var(--sky-glow);}
.sd-btn-like.liked{background:linear-gradient(135deg,var(--danger),#EC4899);}

/* ============================================================
   Forge Guide (锻造指南知识库)
   ============================================================ */
.guide-page{
  display:flex;height:100%;overflow:hidden;
}
.guide-sidebar{
  width:260px;min-width:260px;
  background:var(--bg-card);border-right:1px solid var(--border-subtle);
  padding:20px 0;overflow-y:auto;
}
.guide-sidebar h3{
  font-size:0.85rem;color:var(--text-muted);
  padding:0 20px;margin-bottom:12px;
  text-transform:uppercase;letter-spacing:0.05em;
}
.guide-nav-list{list-style:none;padding:0;margin:0 0 24px 0;}
.guide-nav-item{
  padding:10px 20px;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  font-size:0.85rem;color:var(--text-secondary);
  transition:all var(--transition-fast);
  border-left:3px solid transparent;
}
.guide-nav-item:hover{
  background:rgba(74,144,217,0.05);color:var(--text-primary);
}
.guide-nav-item.active{
  background:rgba(74,144,217,0.1);color:var(--sky-400);
  border-left-color:var(--sky-500);font-weight:600;
}
.guide-nav-item .gn-icon{font-size:1rem;}
.guide-content{
  flex:1;overflow-y:auto;padding:32px 40px;
}
.guide-content h1{
  font-size:1.6rem;color:var(--text-primary);margin-bottom:8px;
}
.guide-content .guide-meta{
  font-size:0.8rem;color:var(--text-muted);margin-bottom:24px;
  padding-bottom:16px;border-bottom:1px solid var(--border-subtle);
}
.guide-content h2{
  font-size:1.15rem;color:var(--sky-400);margin-top:28px;margin-bottom:12px;
}
.guide-content h3{
  font-size:0.95rem;color:var(--text-primary);margin-top:20px;margin-bottom:8px;
}
.guide-content p{
  font-size:0.85rem;color:var(--text-secondary);line-height:1.7;margin-bottom:12px;
}
.guide-content ul,.guide-content ol{
  margin-bottom:12px;padding-left:20px;
}
.guide-content li{
  font-size:0.85rem;color:var(--text-secondary);line-height:1.7;margin-bottom:6px;
}
.guide-tip{
  padding:16px 20px;background:rgba(34,197,94,0.08);
  border-left:4px solid var(--success);border-radius:0 var(--radius-md) var(--radius-md) 0;
  margin:16px 0;
}
.guide-tip .tip-label{
  font-size:0.75rem;color:var(--success);font-weight:700;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:0.05em;
}
.guide-tip p{font-size:0.82rem;color:var(--text-secondary);margin:0;}
.guide-warning{
  padding:16px 20px;background:rgba(245,158,11,0.08);
  border-left:4px solid var(--warning);border-radius:0 var(--radius-md) var(--radius-md) 0;
  margin:16px 0;
}
.guide-warning .warn-label{
  font-size:0.75rem;color:var(--warning);font-weight:700;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:0.05em;
}
.guide-warning p{font-size:0.82rem;color:var(--text-secondary);margin:0;}
.guide-code{
  background:var(--bg-input);border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);padding:16px;
  font-family:var(--font-mono);font-size:0.78rem;
  color:var(--text-secondary);overflow-x:auto;margin:12px 0;
  line-height:1.6;
}
.guide-steps{counter-reset:step;list-style:none;padding:0;margin:16px 0;}
.guide-steps li{
  counter-increment:step;position:relative;
  padding-left:40px;margin-bottom:16px;font-size:0.85rem;
  color:var(--text-secondary);line-height:1.6;
}
.guide-steps li::before{
  content:counter(step);
  position:absolute;left:0;top:0;
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--sky-500),var(--purple-500));
  color:white;font-weight:700;font-size:0.8rem;
  display:flex;align-items:center;justify-content:center;
}
.faq-item{
  border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  margin-bottom:8px;overflow:hidden;
}
.faq-question{
  padding:14px 18px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  font-size:0.85rem;color:var(--text-primary);font-weight:500;
  transition:background var(--transition-fast);
}
.faq-question:hover{background:rgba(74,144,217,0.05);}
.faq-question .faq-toggle{
  color:var(--text-muted);transition:transform var(--transition-fast);
}
.faq-item.open .faq-question .faq-toggle{transform:rotate(180deg);}
.faq-answer{
  max-height:0;overflow:hidden;
  transition:max-height 0.3s ease-out;
}
.faq-item.open .faq-answer{max-height:500px;}
.faq-answer-inner{
  padding:0 18px 14px;font-size:0.82rem;color:var(--text-secondary);line-height:1.6;
}

/* ============================================================
   Model Config Panel (可视化需求配置 & 参数精调)
   ============================================================ */
.model-config-panel{
  background:var(--bg-card);border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);padding:20px;margin:12px;
}
.model-config-panel h4{
  font-size:0.9rem;color:var(--sky-400);margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.config-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.config-field{
  display:flex;flex-direction:column;gap:6px;
}
.config-field.full{grid-column:1/-1;}
.config-field label{
  font-size:0.75rem;color:var(--text-secondary);font-weight:500;
}
.config-field input,.config-field select,.config-field textarea{
  padding:8px 12px;background:var(--bg-input);
  border:1px solid var(--border-subtle);border-radius:var(--radius-sm);
  color:var(--text-primary);font-size:0.8rem;font-family:var(--font-body);
  outline:none;transition:border-color var(--transition-fast);
}
.config-field input:focus,.config-field select:focus,.config-field textarea:focus{
  border-color:var(--sky-500);box-shadow:0 0 0 2px var(--sky-glow);
}
.config-field input[type="range"]{
  padding:0;height:32px;
}
.config-field .range-value{
  font-size:0.75rem;color:var(--sky-400);font-family:var(--font-mono);
  text-align:right;
}
.config-toggle{
  display:flex;align-items:center;gap:10px;cursor:pointer;
}
.config-toggle input[type="checkbox"]{
  width:18px;height:18px;accent-color:var(--sky-500);
}
.config-toggle label{cursor:pointer;margin:0;}
.config-actions{
  display:flex;gap:10px;justify-content:flex-end;margin-top:16px;
  padding-top:16px;border-top:1px solid var(--border-subtle);
}
.advanced-config{
  margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--border-subtle);
}
.advanced-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:0.78rem;color:var(--text-muted);cursor:pointer;
  background:none;border:none;font-family:var(--font-body);
}
.advanced-toggle:hover{color:var(--sky-400);}
.advanced-content{
  display:none;margin-top:12px;
}
.advanced-content.open{display:block;}

/* ============================================================
   Accuracy Report (模型精度评估报告)
   ============================================================ */
.report-modal{
  width:650px;max-width:95vw;
}
.report-header{
  text-align:center;padding:24px;
  background:linear-gradient(135deg,rgba(74,144,217,0.1),rgba(124,92,231,0.1));
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  margin:-32px -32px 20px -32px;
  border-bottom:1px solid var(--border-subtle);
}
.report-grade{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--success),#10B981);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;font-weight:800;color:white;
  margin:0 auto 12px;box-shadow:0 0 30px rgba(34,197,94,0.3);
}
.report-grade.b{background:linear-gradient(135deg,var(--sky-500),var(--sky-600));box-shadow:0 0 30px var(--sky-glow);}
.report-grade.c{background:linear-gradient(135deg,var(--warning),#D97706);box-shadow:0 0 30px rgba(245,158,11,0.3);}
.report-header h2{font-size:1.3rem;color:var(--text-primary);margin-bottom:4px;}
.report-header p{font-size:0.85rem;color:var(--text-secondary);}
.report-metrics{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;
}
.report-metric{
  text-align:center;padding:14px 8px;background:var(--bg-input);
  border-radius:var(--radius-md);border:1px solid var(--border-subtle);
}
.report-metric .rm-value{
  font-size:1.2rem;font-weight:700;font-family:var(--font-mono);
  color:var(--text-primary);
}
.report-metric .rm-label{
  font-size:0.7rem;color:var(--text-muted);margin-top:4px;
}
.report-section{margin-bottom:20px;}
.report-section h3{
  font-size:0.9rem;color:var(--text-primary);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.per-class-accuracy{
  display:flex;flex-direction:column;gap:8px;
}
.pca-item{
  display:flex;align-items:center;gap:10px;
}
.pca-item .pca-label{
  width:100px;font-size:0.78rem;color:var(--text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pca-item .pca-bar{
  flex:1;height:8px;background:var(--bg-input);border-radius:4px;overflow:hidden;
}
.pca-item .pca-fill{
  height:100%;background:linear-gradient(90deg,var(--sky-500),var(--purple-500));
  border-radius:4px;transition:width 0.6s ease;
}
.pca-item .pca-value{
  width:45px;font-size:0.75rem;color:var(--text-primary);
  font-family:var(--font-mono);text-align:right;
}
.suggestion-list{
  list-style:none;padding:0;margin:0;
}
.suggestion-list li{
  padding:12px 16px 12px 40px;
  background:var(--bg-input);border-radius:var(--radius-md);
  border:1px solid var(--border-subtle);
  font-size:0.8rem;color:var(--text-secondary);line-height:1.5;
  margin-bottom:8px;position:relative;
}
.suggestion-list li::before{
  content:'💡';position:absolute;left:14px;top:12px;font-size:0.9rem;
}
.confusion-matrix{
  display:grid;gap:2px;padding:8px;background:var(--bg-input);
  border-radius:var(--radius-md);
}
.cm-cell{
  padding:8px;text-align:center;font-size:0.75rem;
  font-family:var(--font-mono);border-radius:4px;
}
.cm-cell.header{
  background:rgba(74,144,217,0.15);color:var(--sky-400);font-weight:600;
}
.cm-cell.label{
  background:rgba(124,92,231,0.1);color:var(--purple-400);font-weight:600;
}
.cm-cell.high{background:rgba(34,197,94,0.2);color:var(--success);}
.cm-cell.med{background:rgba(245,158,11,0.2);color:var(--warning);}
.cm-cell.low{background:rgba(239,68,68,0.15);color:var(--danger);}

/* ============================================================
   Model Library Enhancements (模型库管理增强)
   ============================================================ */
.model-list-view{
  padding:16px 0;
}
.model-list-item{
  display:flex;align-items:center;gap:16px;
  padding:14px 16px;background:var(--bg-card);
  border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  margin-bottom:8px;cursor:pointer;
  transition:all var(--transition-fast);
}
.model-list-item:hover{
  border-color:var(--sky-500);background:var(--bg-card-hover);
}
.model-list-item .mli-icon{
  width:44px;height:44px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--sky-500),var(--purple-500));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.model-list-item .mli-info{flex:1;min-width:0;}
.model-list-item .mli-name{
  font-size:0.9rem;color:var(--text-primary);font-weight:600;
  margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.model-list-item .mli-meta{
  font-size:0.75rem;color:var(--text-muted);
  display:flex;gap:12px;
}
.model-list-item .mli-actions{
  display:flex;gap:6px;opacity:0;
  transition:opacity var(--transition-fast);
}
.model-list-item:hover .mli-actions{opacity:1;}
.mli-action-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);
  background:var(--bg-input);border:1px solid var(--border-subtle);
  color:var(--text-secondary);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition-fast);
}
.mli-action-btn:hover{
  border-color:var(--sky-500);color:var(--sky-400);
  background:rgba(74,144,217,0.1);
}
.view-toggle{
  display:flex;background:var(--bg-input);border-radius:var(--radius-sm);
  padding:3px;border:1px solid var(--border-subtle);
}
.view-toggle button{
  width:32px;height:28px;border:none;background:transparent;
  color:var(--text-muted);cursor:pointer;border-radius:4px;
  font-size:14px;transition:all var(--transition-fast);
}
.view-toggle button.active{
  background:var(--sky-500);color:white;
}
.version-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:10px;font-size:0.65rem;
  background:rgba(124,92,231,0.15);color:var(--purple-400);
  font-family:var(--font-mono);
}

/* Training Progress */
.training-progress-bar{
  padding:8px 20px;
  border-top:1px solid var(--border-subtle);
  display:none;
}
.training-progress-bar.active{display:block}
.training-progress-bar .progress-header{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:6px;
  font-size:0.75rem;font-family:var(--font-mono);
}
.training-progress-bar .progress-header .progress-label{
  color:var(--sky-400);
  display:flex;align-items:center;gap:6px;
}
.training-progress-bar .progress-track{
  height:4px;background:var(--bg-input);
  border-radius:2px;overflow:hidden;
}
.training-progress-bar .progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--sky-500),var(--purple-500));
  border-radius:2px;
  transition:width 0.5s ease-out;
  position:relative;
}
.training-progress-bar .progress-fill::after{
  content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-radius:50%;
  background:white;box-shadow:0 0 8px white;
}
.training-progress-bar .progress-log{
  font-size:0.7rem;color:var(--text-muted);
  margin-top:4px;font-family:var(--font-mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* Image Upload Modal */
.upload-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.7);
  z-index:100;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.upload-modal{
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-xl);
  padding:32px;
  width:680px;max-width:95vw;
  max-height:85vh;
  overflow-y:auto;
  box-shadow:0 0 80px rgba(74,144,217,0.15);
}
.upload-modal h3{
  font-family:var(--font-title);
  font-size:1.1rem;color:var(--sky-400);
  margin-bottom:20px;letter-spacing:0.03em;
}
.drop-zone{
  border:2px dashed var(--border-glow);
  border-radius:var(--radius-lg);
  padding:48px;
  text-align:center;
  transition:all var(--transition-fast);
  cursor:pointer;
  background:rgba(74,144,217,0.03);
}
.drop-zone:hover,.drop-zone.drag-over{
  border-color:var(--sky-500);
  background:rgba(74,144,217,0.08);
  box-shadow:0 0 30px var(--sky-glow);
}
.drop-zone .dz-icon{
  font-size:48px;margin-bottom:12px;
}
.drop-zone p{color:var(--text-secondary);font-size:0.9rem}
.drop-zone .dz-hint{color:var(--text-muted);font-size:0.75rem;margin-top:6px}
.upload-preview-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:10px;margin-top:16px;
}
.upload-preview-item{
  position:relative;
  aspect-ratio:1;
  border-radius:var(--radius-sm);
  overflow:hidden;
  border:2px solid var(--border-subtle);
}
.upload-preview-item img{
  width:100%;height:100%;object-fit:cover;
}
.upload-preview-item .quality-badge{
  position:absolute;bottom:4px;right:4px;
  padding:2px 8px;border-radius:10px;
  font-size:0.65rem;font-weight:600;
  font-family:var(--font-mono);
}
.quality-badge.good{background:rgba(34,197,94,0.2);color:var(--success)}
.quality-badge.warning{background:rgba(245,158,11,0.2);color:var(--warning)}
.quality-badge.bad{background:rgba(239,68,68,0.2);color:var(--danger)}
.upload-modal-actions{
  display:flex;gap:10px;margin-top:20px;
  justify-content:flex-end;
}
.btn-secondary{
  padding:10px 20px;
  background:transparent;
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);
  color:var(--text-secondary);
  cursor:pointer;
  font-family:var(--font-body);
  font-size:0.85rem;
  transition:all var(--transition-fast);
}
.btn-secondary:hover{
  border-color:var(--text-muted);
  color:var(--text-primary);
}
.btn-accent{
  padding:10px 20px;
  background:linear-gradient(135deg,var(--sky-500),var(--purple-500));
  border:none;border-radius:var(--radius-md);
  color:white;cursor:pointer;
  font-family:var(--font-body);
  font-size:0.85rem;font-weight:600;
  transition:all var(--transition-fast);
  box-shadow:0 0 16px var(--sky-glow);
}
.btn-accent:hover{box-shadow:0 0 24px var(--sky-glow);transform:translateY(-1px)}

/* ============================================================
   Page: Export (导出中心)
   ============================================================ */
.page-container{
  padding:32px;height:100%;overflow-y:auto;
}
.page-title{
  font-family:var(--font-title);
  font-size:1.5rem;font-weight:700;
  margin-bottom:8px;
  letter-spacing:0.04em;
  background:linear-gradient(135deg,var(--sky-400),var(--purple-400));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.page-subtitle{
  color:var(--text-secondary);
  font-size:0.85rem;
  margin-bottom:32px;
}
.export-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
  margin-bottom:32px;
}
.export-card{

<!-- Toast Container -->

<script>
// ============================================================
// NeuralForge - AI模型锻造工作台
// ============================================================

// ============================================================
// Utility Functions
// ============================================================
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
const genId = () => 'nf_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 8);
const fmtDate = (d) => { const dt = new Date(d); return dt.toLocaleDateString('zh-CN') + ' ' + dt.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}); };
const fmtTime = () => { const d = new Date(); return d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}); };

// ============================================================
// Toast System
// ============================================================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  toast.innerHTML = `${icons[type] || 'ℹ️'} ${msg}`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// ============================================================
// Storage System（按账号隔离，每个手机号独立存储空间）
// ============================================================
const Storage = {
  _userId: null,

  // 设置当前用户ID（登录时调用），所有数据操作将自动隔离到该账号
  setUserId(phone) { this._userId = phone; },
  clearUserId() { this._userId = null; },

  _key(key) {
    if (this._userId) return 'neuralforge_' + this._userId + '_' + key;
    return 'neuralforge_' + key;
  },

  get(key) { try { return JSON.parse(localStorage.getItem(this._key(key))); } catch(e) { return null; } },
  set(key, val) { localStorage.setItem(this._key(key), JSON.stringify(val)); },
  remove(key) { localStorage.removeItem(this._key(key)); },

  // 用户信息（全局共享，用于登录检测，不受账号隔离影响）
  getUser() { try { return JSON.parse(localStorage.getItem('neuralforge_user')); } catch(e) { return null; } },
  setUser(u) { localStorage.setItem('neuralforge_user', JSON.stringify(u)); },
  removeUser() { localStorage.removeItem('neuralforge_user'); },

  // 以下数据全部按账号隔离
  getModels() { return this.get('models') || []; },
  setModels(m) { this.set('models', m); },
  addModel(m) { const models = this.getModels(); models.unshift(m); this.setModels(models); return m; },
  updateModel(id, updates) { const models = this.getModels(); const idx = models.findIndex(m => m.id === id); if (idx >= 0) { models[idx] = {...models[idx], ...updates, updatedAt: Date.now()}; this.setModels(models); } },
  getChats() { return this.get('chats') || []; },
  setChats(c) { this.set('chats', c); },
  addChat(c) { const chats = this.getChats(); chats.push(c); this.setChats(chats); return c; },
  getConversationHistory() { return this.get('convHistory') || []; },
  setConversationHistory(h) { this.set('convHistory', h); },
  getExports() { return this.get('exports') || []; },
  addExport(e) { const exports = this.getExports(); exports.unshift(e); this.set('exports', exports); return e; },
  getConversationHistory() { return this.get('conversationHistory') || []; },
  setConversationHistory(h) { this.set('conversationHistory', h); },
  getLikedProjects() { return this.get('likedProjects') || []; },
  toggleLikeProject(projectId) {
    const liked = this.getLikedProjects();
    const idx = liked.indexOf(projectId);
    if (idx >= 0) { liked.splice(idx, 1); this.set('likedProjects', liked); return false; }
    else { liked.push(projectId); this.set('likedProjects', liked); return true; }
  },
  getProjectComments(projectId) {
    const all = this.get('projectComments') || {};
    return all[projectId] || [];
  },
  addProjectComment(projectId, comment) {
    const all = this.get('projectComments') || {};
    if (!all[projectId]) all[projectId] = [];
    all[projectId].push(comment);
    this.set('projectComments', all);
  },
};

// ============================================================
// Particle Background
// ============================================================
function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animId;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() {
      this.reset();
      this.y = Math.random() * canvas.height;
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = -10;
      this.size = Math.random() * 2 + 0.5;
      this.speed = Math.random() * 0.5 + 0.2;
      this.opacity = Math.random() * 0.5 + 0.1;
      this.hue = Math.random() < 0.6 ? 200 + Math.random() * 30 : 260 + Math.random() * 20;
    }
    update() {
      this.y += this.speed;
      if (this.y > canvas.height + 10) this.reset();
      this.opacity += (Math.random() - 0.5) * 0.02;
      this.opacity = Math.max(0.05, Math.min(0.6, this.opacity));
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.opacity})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < 80; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    // Draw connections
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(74,144,217,${0.06 * (1 - dist / 120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    animId = requestAnimationFrame(animate);
  }
  animate();
}

<div class="guide-meta">基础概念 · 约4分钟阅读</div>

<h2>🤔 简单来说</h2>
<p>AI模型就像一个"智能函数"——你给它输入（比如一张图片），它给你输出（比如"这是一只猫"）。</p>

<p>传统的程序是程序员写好每一条规则，但AI模型不一样：它通过看大量数据，<strong>自己学会</strong>识别规律。</p>

<h2>🏗️ 模型的组成</h2>
<ul>
  <li><strong>结构（Architecture）</strong>：神经网络的层数、连接方式等</li>
  <li><strong>参数（Parameters）</strong>：模型学到的"知识"，就是一堆数字</li>
  <li><strong>权重（Weights）</strong>：每个连接的重要程度</li>

<p>NeuralForge默认参数已经做了优化，大多数情况下直接用就好。但如果你想深入了解，可以手动调整。</p>

<h2>⚙️ 核心参数</h2>

<h3>学习率（Learning Rate）</h3>
<p>控制每次参数更新的步长。默认0.001。</p>
<ul>
  <li>太大：训练不稳定，可能来回震荡</li>
  <li>太小：学习太慢，需要更多轮次</li>
  <li>建议：从默认值开始，效果不好再微调</li>
</ul>

<h3>批次大小（Batch Size）</h3>
<p>一次训练用多少张图片。默认32。</p>
<ul>
  <li>大批次：训练更稳定，但显存占用高</li>
  <li>小批次：显存占用低，训练更"颠簸"</li>
  <li>建议：设备好可以调大，设备一般用默认</li>
</ul>

<h3>训练轮次（Epochs）</h3>
<p>所有数据过一遍叫一个epoch。默认50。</p>
<ul>
  <li>太少：模型没学够，准确率低</li>

const AppState = {
  currentPage: 'login',
  user: null,
  isLoggedIn: false,
  trainingActive: false,
  trainingProgress: 0,
  trainingLog: '',
  currentModel: null,
  selectedExportFormat: null,
  selectedGraphNode: null,
  cameras: [],
  activeCameraId: null,
  cameraStream: null,
  uploadedImages: [],
  capturedPhotos: [],
};

function navigate(page) {
  AppState.currentPage = page;
  render();
}

function render() {
  const app = document.getElementById('app');
  const user = Storage.getUser();

  if (!user && AppState.currentPage !== 'login') {
    AppState.currentPage = 'login';
  }
  if (user && AppState.currentPage === 'login') {
    AppState.currentPage = 'forge';
  }

  AppState.isLoggedIn = !!user;
  AppState.user = user;
  // 页面刷新时恢复账号隔离
  if (user && user.phone) {
    Storage.setUserId(user.phone.replace('+86', ''));
  }

  if (AppState.currentPage === 'login') {
    app.innerHTML = renderLoginPage();
    initLoginPage();
  } else {
    app.innerHTML = renderMainLayout();
    initSidebar();
    switch (AppState.currentPage) {
      case 'forge': renderForgePage(); initForgePage(); break;
      case 'export': renderExportPage(); initExportPage(); break;
      case 'deploy': renderDeployPage(); initDeployPage(); break;
      case 'knowledge': renderKnowledgePage(); initKnowledgePage(); break;
      case 'guide': renderGuidePage(); initGuidePage(); break;
      case 'community': renderCommunityPage(); initCommunityPage(); break;
      case 'overview': renderOverviewPage(); break;
      default: navigate('forge'); break;
    }
  }
}

function renderLoginPage() {
  return `
    <div class="login-page">
      <div class="login-bg-ring"></div>

        </div>
        <div class="login-form" id="loginForm">
          <div class="form-group">
            <label>手机号</label>
            <div class="phone-input-wrapper">
              <span class="phone-prefix">+86</span>
              <input type="tel" id="phoneInput" placeholder="请输入手机号码" maxlength="11" autocomplete="tel">
            </div>
          </div>
          <div class="form-group" id="codeGroup" style="display:none">
            <label>验证码</label>
            <div class="verify-code-group" id="codeInputs">
              ${Array.from({length:6}, (_,i) => `<input type="text" maxlength="1" data-index="${i}" inputmode="numeric" pattern="[0-9]">`).join('')}
            </div>
          </div>
          <div class="login-error" id="loginError"></div>
          <button class="btn btn-primary" id="btnSendCode" type="button">
            <span>📱</span> 发送验证码
          </button>
          <button class="btn btn-primary" id="btnLogin" type="button" style="display:none">
            <span>🔐</span> 登录 / 注册
          </button>
        </div>
      </div>
    </div>
  `;
}

function initLoginPage() {
  const phoneInput = $('#phoneInput');
  const btnSendCode = $('#btnSendCode');
  const btnLogin = $('#btnLogin');
  const codeGroup = $('#codeGroup');
  const codeInputs = $$('#codeInputs input');
  const loginError = $('#loginError');
  let countdown = 0;
  let countdownTimer = null;

  phoneInput.addEventListener('input', () => {
    phoneInput.value = phoneInput.value.replace(/\D/g, '');
    btnSendCode.disabled = phoneInput.value.length !== 11;
  });

  btnSendCode.addEventListener('click', () => {
    const phone = phoneInput.value;
    if (phone.length !== 11) { showError('请输入有效的11位手机号码'); return; }
    if (!/^1[3-9]\d{9}$/.test(phone)) { showError('请输入正确的手机号码'); return; }

    // Simulate sending code
    showToast('验证码已发送（演示模式：123456）', 'success');
    loginError.textContent = '';
    codeGroup.style.display = 'block';
    btnSendCode.style.display = 'none';
    btnLogin.style.display = 'flex';
    codeInputs[0].focus();

    // Start countdown
    countdown = 60;
    btnSendCode.textContent = `${countdown}s 后重发`;
    btnSendCode.disabled = true;
    btnSendCode.style.display = 'inline-flex';
    btnLogin.style.display = 'flex';
    countdownTimer = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        clearInterval(countdownTimer);
        btnSendCode.textContent = '📱 重新发送';
        btnSendCode.disabled = false;
      } else {
        btnSendCode.textContent = `${countdown}s 后重发`;
      }
    }, 1000);
  });

  // Code input handling
  codeInputs.forEach((input, idx) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/\D/g, '');
      e.target.value = val.slice(0, 1);
      if (val && idx < 5) codeInputs[idx + 1].focus();
      if (val) e.target.classList.add('filled');
      else e.target.classList.remove('filled');
      // Check if all filled
      if ($$('#codeInputs input.filled').length === 6) {
        btnLogin.click();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && idx > 0) {
        codeInputs[idx - 1].focus();
      }
    });
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
      paste.split('').forEach((ch, i) => {
        if (codeInputs[i]) { codeInputs[i].value = ch; codeInputs[i].classList.add('filled'); }
      });
      if (paste.length === 6) btnLogin.click();
    });
  });

  btnLogin.addEventListener('click', () => {
    const code = codeInputs.map(i => i.value).join('');
    if (code.length !== 6) { showError('请输入完整的6位验证码'); return; }

    // Demo: accept 123456 or any 6-digit code
    const phone = phoneInput.value;
    const user = {
      phone: '+86' + phone,
      nickname: '用户' + phone.slice(-4),
      avatar: phone.slice(-2),
      createdAt: Date.now(),
    };
    Storage.setUser(user);
	    Storage.setUserId(phone); // 将当前账号的存储空间隔离到该手机号
	    if (countdownTimer) clearInterval(countdownTimer);
    showToast('登录成功！欢迎使用 NeuralForge', 'success');
    AppState.user = user;
    AppState.isLoggedIn = true;
    AppState.currentPage = 'forge';
    render();
  });

  function showError(msg) {
    loginError.textContent = msg;
    setTimeout(() => { loginError.textContent = ''; }, 3000);
  }
}

function initSidebar() {
  const btns = $$('#sidebarNav .sidebar-btn');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const page = btn.dataset.page;
      navigate(page);
    });
  });
  // Highlight active
  const activeBtn = $(`#sidebarNav .sidebar-btn[data-page="${AppState.currentPage}"]`);
  if (activeBtn) {
    btns.forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');
  }
  // Logout
  const sidebarUser = $('#sidebarUser');
  if (sidebarUser) {
    sidebarUser.onclick = handleLogout;
  }
}

// 全局退出登录函数（供内联 onclick 和 addEventListener 调用）
function handleLogout() {
  // 保存对话历史（排除 system prompt，只保存用户和AI的对话）
  const userMsgs = conversationHistory.filter(m => m.role === 'user' || m.role === 'assistant');
  Storage.setConversationHistory(userMsgs);
  Storage.removeUser(); // 清除全局用户登录状态
  Storage.clearUserId(); // 清除账号隔离
  AppState.user = null;
  AppState.isLoggedIn = false;
  AppState.trainingActive = false;
  AppState.trainingProgress = 0;
  AppState.trainingLog = '';
  AppState.currentModel = null;

// 手动拍摄训练图片
function initCaptureButton() {
  const btnCapture = $('#btnCapture');
  const captureStrip = $('#captureStrip');
  const captureCount = $('#captureCount');
  if (!btnCapture) return;

  AppState.capturedPhotos = [];

  btnCapture.addEventListener('click', () => {
    const video = $('#cameraVideo');
    if (!video || !video.videoWidth) {
      showToast('摄像头未就绪，无法拍摄', 'error');
      return;
    }
    // 从视频流截取一帧
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    AppState.capturedPhotos.push(dataUrl);
    updateCaptureStrip();
    showToast(`已拍摄 ${AppState.capturedPhotos.length} 张训练图片`, 'success');
  });

  function updateCaptureStrip() {
    if (!captureStrip || !captureCount) return;
    if (AppState.capturedPhotos.length === 0) {
      captureStrip.style.display = 'none';
      captureCount.style.display = 'none';
      btnCapture.style.display = 'none';
      return;
    }
    captureStrip.style.display = 'flex';
    captureCount.style.display = 'inline';
    captureCount.textContent = `${AppState.capturedPhotos.length} 张`;
    // 显示最近6张
    captureStrip.innerHTML = '';
    const recent = AppState.capturedPhotos.slice(-6);
    recent.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.title = '点击删除';
      img.addEventListener('click', () => {
        const idx = AppState.capturedPhotos.indexOf(src);
        if (idx >= 0) AppState.capturedPhotos.splice(idx, 1);
        updateCaptureStrip();
      });
      captureStrip.appendChild(img);
    });
  }

  // 当AI请求训练数据时，显示拍摄按钮
  window.showCaptureButton = function() {
    if (btnCapture) btnCapture.style.display = 'inline-block';
    updateCaptureStrip();
  };

  // 默认显示（有摄像头就显示）
  if (AppState.cameras.length > 0) {
    btnCapture.style.display = 'inline-block';
  }
}

// Camera System
// ============================================================
async function initCamera() {
  const camSelect = $('#cameraSelect');
  const camPlaceholder = $('#cameraPlaceholder');
  const camDot = $('#camDot');
  const camRes = $('#cameraRes');
  const video = $('#cameraVideo');

  if (!video || !camPlaceholder) return;

  // 第一步：先请求通用摄像头权限（不指定 deviceId），触发浏览器权限弹窗
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    // 权限已获取，直接用这个流显示画面
    video.srcObject = stream;
    video.style.display = 'block';
    video.muted = true;
    try {
      await video.play();
    } catch (playErr) {
      console.warn('Video play retry:', playErr);
    }
    AppState.cameraStream = stream;
    camDot.style.background = 'var(--success)';
    camPlaceholder.style.display = 'none';

    // 第二步：权限获取后再枚举设备，此时可获取完整的设备标签
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');
    AppState.cameras = videoDevices;

    // 填充摄像头切换下拉菜单
    if (videoDevices.length > 1) {
      videoDevices.forEach((device, idx) => {
        const opt = document.createElement('option');
        opt.value = device.deviceId;
        opt.textContent = device.label || `摄像头 ${idx + 1}`;
        camSelect.appendChild(opt);
      });
      camSelect.style.display = 'block';
      // 获取当前使用的设备ID
      const currentTrack = stream.getVideoTracks()[0];
      if (currentTrack) {
        camSelect.value = currentTrack.getSettings().deviceId || '';
      }
    }

    camSelect.addEventListener('change', async () => {
      if (camSelect.value) {
        await switchCamera(camSelect.value);
      }
    });

    // 监控分辨率
    setInterval(() => {
      if (video.videoWidth && camRes) {
        camRes.textContent = `${video.videoWidth}×${video.videoHeight}`;
      }
    }, 2000);

  } catch (err) {
    console.error('Camera init error:', err);
    camPlaceholder.innerHTML = `
      <div class="ph-icon">🔒</div>
      <p>摄像头权限未授权或无可用设备</p>
      <p style="font-size:0.75rem;color:var(--text-muted)">请在浏览器设置中允许摄像头访问后刷新页面</p>
    `;
    if (camDot) {
      camDot.style.background = 'var(--text-muted)';
      camDot.style.animation = 'none';
    }
  }
}

async function switchCamera(deviceId) {
  stopCamera();
  const video = $('#cameraVideo');
  const camPlaceholder = $('#cameraPlaceholder');
  const camDot = $('#camDot');

  if (!video) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    video.style.display = 'block';
    video.muted = true;
    await video.play();
    AppState.cameraStream = stream;
    AppState.activeCameraId = deviceId;
    if (camPlaceholder) camPlaceholder.style.display = 'none';
    if (camDot) camDot.style.background = 'var(--success)';
    // 切换摄像头后恢复模型效果演示
    if (AppState.currentModel && AppState.currentModel.status === 'completed') {
      startModelDemo(AppState.currentModel.type);
    }
  } catch (err) {
    console.error('Switch camera error:', err);
    if (camPlaceholder) {
      camPlaceholder.style.display = 'flex';
      camPlaceholder.innerHTML = `
        <div class="ph-icon">🔒</div>
        <p>摄像头切换失败</p>
        <p style="font-size:0.75rem;color:var(--text-muted)">请检查摄像头连接或刷新页面重试</p>
      `;
    }
    if (camDot) {
      camDot.style.background = 'var(--danger)';
      camDot.style.animation = 'none';
    }
  }
}

function stopCamera() {
  stopModelDemo();
  if (AppState.cameraStream) {
    AppState.cameraStream.getTracks().forEach(t => t.stop());
    AppState.cameraStream = null;
  }
}

// ============================================================
// Model Demo Overlay（摄像头实时模型效果演示）
// ============================================================
let demoAnimationId = null;
let demoActiveModel = null;

function startModelDemo(modelType) {
  stopModelDemo();
  demoActiveModel = modelType;
  const overlay = $('#modelOverlay');
  const video = $('#cameraVideo');
  if (!overlay || !video || !AppState.cameraStream) return;

  overlay.style.display = 'block';
  function resizeOverlay() {
    const container = overlay.parentElement;
    if (container) {
      overlay.width = container.clientWidth;
      overlay.height = container.clientHeight;
    }
  }
  resizeOverlay();
  window.addEventListener('resize', resizeOverlay);

  const ctx = overlay.getContext('2d');
  let frameCount = 0;

  function draw() {
    if (!demoActiveModel) return;
    frameCount++;
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    const w = overlay.width;
    const h = overlay.height;
    const t = frameCount * 0.05;

    // 根据模型类型绘制不同的可视化效果
    const type = demoActiveModel.toLowerCase();

    if (type.includes('手势') || type.includes('gesture')) {
      drawGestureDemo(ctx, w, h, t);
    } else if (type.includes('面部') || type.includes('人脸') || type.includes('表情') || type.includes('face')) {
      drawFaceDemo(ctx, w, h, t);
    } else if (type.includes('物体') || type.includes('目标') || type.includes('检测') || type.includes('object') || type.includes('detect')) {
      drawObjectDetectionDemo(ctx, w, h, t);
    } else if (type.includes('分类') || type.includes('classify') || type.includes('猫狗')) {
      drawClassificationDemo(ctx, w, h, t);
    } else if (type.includes('文字') || type.includes('ocr') || type.includes('文本')) {
      drawOCRDemo(ctx, w, h, t);
    } else if (type.includes('分割') || type.includes('segment')) {
      drawSegmentationDemo(ctx, w, h, t);
    } else {
      drawGeneralDemo(ctx, w, h, t);
    }

    demoAnimationId = requestAnimationFrame(draw);
  }

  draw();
}

function stopModelDemo() {
  demoActiveModel = null;
  if (demoAnimationId) {
    cancelAnimationFrame(demoAnimationId);
    demoAnimationId = null;
  }
  const overlay = $('#modelOverlay');
  if (overlay) overlay.style.display = 'none';
}

function drawGestureDemo(ctx, w, h, t) {
  // 模拟手势识别：手部关键点 + 手势标签
  const cx = w * 0.5 + Math.sin(t * 0.3) * w * 0.08;
  const cy = h * 0.55 + Math.cos(t * 0.4) * h * 0.05;
  const gestures = ['✊ 握拳', '✋ 张开', '👍 点赞', '👆 指向', '✌️ 胜利'];
  const gestureIdx = Math.floor(t * 0.4) % gestures.length;

  // 手部轮廓
  ctx.strokeStyle = 'rgba(74,144,217,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, 35, 0, Math.PI * 2);
  ctx.stroke();

  // 关键点
  const points = [
    [cx - 18, cy - 25], [cx, cy - 30], [cx + 18, cy - 25], [cx + 28, cy - 8],
    [cx + 20, cy + 10], [cx - 10, cy + 25], [cx - 25, cy + 5], [cx - 30, cy - 8]
  ];
  points.forEach(([px, py], i) => {
    ctx.fillStyle = '#7C5CE7';
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fill();
    if (i < 4) {
      ctx.strokeStyle = 'rgba(124,92,231,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(px, py);
      ctx.stroke();
    }
  });

  // 标签 - 更真实的置信度
  drawLabel(ctx, cx, cy - 55, gestures[gestureIdx], '#4A90D9', 0.68 + Math.sin(t * 2) * 0.1);
}

function drawFaceDemo(ctx, w, h, t) {
  // 模拟面部识别：人脸框 + 表情标签
  const cx = w * 0.5 + Math.sin(t * 0.2) * w * 0.04;
  const cy = h * 0.45 + Math.cos(t * 0.25) * h * 0.03;
  const fw = w * 0.22;
  const fh = fw * 1.25;

  // 人脸框

// 辅助函数：绘制标签
function drawLabel(ctx, x, y, text, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha || 1;
  ctx.font = 'bold 13px "Inter", sans-serif';
  const metrics = ctx.measureText(text);
  const tw = metrics.width;
  const th = 20;
  const px = x - tw / 2 - 8;
  const py = y - th / 2 - 4;

  ctx.fillStyle = 'rgba(17,24,39,0.85)';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(px, py, tw + 16, th + 8, 6);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y + 1);
  ctx.restore();
}

// 辅助函数：绘制分析面板
function drawPanel(ctx, x, y, w, h, items, color) {
  ctx.fillStyle = 'rgba(17,24,39,0.9)';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 8);
  ctx.fill();
  ctx.stroke();

  items.forEach((item, i) => {
    const iy = y + 18 + i * 22;
    ctx.fillStyle = '#94A3B8';
    ctx.font = '11px "Inter", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(item.name, x + 10, iy);

    if (item.value) {
      ctx.fillStyle = '#E8EDF5';
      ctx.font = 'bold 11px "JetBrains Mono", monospace';
      ctx.textAlign = 'right';
      ctx.fillText(item.value, x + w - 10, iy);
    } else {
      // 置信度条
      const barW = (w - 80) * item.conf;
      ctx.fillStyle = 'rgba(74,144,217,0.2)';
      ctx.fillRect(x + 60, iy - 4, w - 80, 8);
      ctx.fillStyle = color;
      ctx.fillRect(x + 60, iy - 4, barW, 8);
      ctx.fillStyle = '#E8EDF5';
      ctx.font = 'bold 11px "JetBrains Mono", monospace';
      ctx.textAlign = 'right';
      ctx.fillText((item.conf * 100).toFixed(0) + '%', x + w - 10, iy);
    }
  });
}

async function callZhipuAIStream(messages, onChunk) {
  try {
    const response = await fetch(ZHIPU_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${ZHIPU_API_KEY}`
      },
      body: JSON.stringify({
        model: 'glm-4-flash',
        messages: messages,
        temperature: 0.7,
        max_tokens: 1024,
        stream: true
      })
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error(errData.error?.message || `API请求失败 (${response.status})`);
    }

    // 读取 SSE 流式响应
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data: ')) continue;

        const dataStr = trimmed.slice(6);
        if (dataStr === '[DONE]') continue;

        try {
          const data = JSON.parse(dataStr);
          const delta = data.choices?.[0]?.delta?.content;
          if (delta) {
            fullContent += delta;
            onChunk(fullContent, delta);
          }
        } catch (e) {
          // 跳过解析失败的行
        }
      }
    }

    if (!fullContent) {
      throw new Error('API返回空内容');
    }
    return fullContent;
  } catch (err) {
    console.error('ZhipuAI stream error:', err);
    throw err;
  }
}

    '加载预训练权重 ResNet-50...', '构建数据增强流水线...', '配置 AdamW 优化器...',
    '设置余弦退火学习率调度...', '应用 MixUp 数据增强...', '启用混合精度训练 FP16...',
    '梯度累积步数=4...', 'EMA 指数移动平均...', 'Label Smoothing=0.1...',
  ];
  for (let e = 1; e <= epochs; e++) {
    const trainLoss = (2.5 - (e / epochs) * 2.2 + Math.random() * 0.15).toFixed(4);
    const valLoss = (2.6 - (e / epochs) * 2.1 + Math.random() * 0.2).toFixed(4);
    const valAcc = Math.min(99.5, (55 + (e / epochs) * 44 + Math.random() * 3)).toFixed(1);
    if (e <= 10) {
      logs.push(`Epoch ${e}/${epochs} · loss=${trainLoss} · val_loss=${valLoss} · val_acc=${valAcc}%`);
    } else if (e % Math.max(1, Math.floor(epochs / 15)) === 0) {
      logs.push(`Epoch ${e}/${epochs} · loss=${trainLoss} · val_loss=${valLoss} · val_acc=${valAcc}% · ✅ 保存检查点`);
    }
  }
  logs.push('🏁 训练完成，执行最终模型评估...');

  let step = 0;
  let vizEpoch = 0;
  const interval = setInterval(() => {
    step++;
    const pct = Math.min(100, Math.round((step / steps) * 100));
    AppState.trainingProgress = pct;
    if (progressFill) progressFill.style.width = pct + '%';
    if (progressPercent) progressPercent.textContent = pct + '%';
    if (progressLog) {
      const logIdx = Math.min(step - 1, logs.length - 1);
      progressLog.textContent = logs[logIdx] || '训练中...';
    }
    
    // 更新训练可视化数据
    if (step % Math.max(1, Math.floor(steps / 30)) === 0 || step === steps) {
      vizEpoch++;
      const progress = step / steps;
      const trainAcc = Math.min(99.5, 55 + progress * 44 + Math.random() * 2);
      const valAcc = Math.min(99, 50 + progress * 42 + Math.random() * 3);
      const trainLoss = Math.max(0.02, 2.5 - progress * 2.4 + Math.random() * 0.1);
      const valLoss = Math.max(0.03, 2.6 - progress * 2.3 + Math.random() * 0.15);
      const prec = Math.min(99, 52 + progress * 43 + Math.random() * 2);
      const rec = Math.min(99, 50 + progress * 44 + Math.random() * 2);
      
      addTrainingVizData(vizEpoch, trainAcc, valAcc, trainLoss, valLoss, prec, rec);
      updateTrainingViz();
      
      // 触发知识卡片
      triggerKnowledgeCard(0, epochs, vizEpoch);
    }

    if (step >= steps) {
      clearInterval(interval);
      completeTraining(modelType, dataCount, epochs);
    }
  }, stepDuration);
}

function completeTraining(modelType, dataCount, epochs) {
  AppState.trainingActive = false;
  AppState.trainingProgress = 100;

  const progressBar = $('#trainingProgressBar');
  const progressLog = $('#progressLog');
  const statusIndicator = $('#statusIndicator');
  const statusText = $('#statusText');
  const progressPercent = $('#progressPercent');

  if (progressPercent) progressPercent.textContent = '100%';
  if (progressLog) progressLog.textContent = '✅ 训练完成！模型已保存';
  if (statusIndicator) { statusIndicator.className = 'status-indicator done'; }
  if (statusText) statusText.textContent = '✨ 模型就绪 - 可进行测试和优化';

  // 真实的指标计算 - 基于数据量、类别数、epochs合理计算
  // 类别数量的影响：类别越多，准确率越低
  const numClasses = AppState.currentModel?.classes?.length || 3;
  const classFactor = Math.max(0.5, 1 - (numClasses - 2) * 0.08);
  
  // 数据量的影响：数据越少，准确率越低
  const dataFactor = Math.min(1, (dataCount || 30) / 200); // 200张以上才接近满值
  
  // 训练轮数的影响
  const epochFactor = Math.min(1, (epochs || 30) / 50);
  
  // 基础准确率：迁移学习 + 小数据集，不会太高
  // 对于2-3类简单任务，数据充足时约70-85%
  // 类别越多、数据越少，准确率越低
  const baseAccuracy = 50 + (dataFactor * 25) + (epochFactor * 8);
  const accuracy = Math.min(92, Math.round(baseAccuracy * classFactor + Math.random() * 5 - 2));
  
  // 其他指标基于准确率合理计算
  const precision = Math.max(45, Math.round(accuracy - 3 + Math.random() * 6 - 3));
  const recall = Math.max(45, Math.round(accuracy - 5 + Math.random() * 8 - 4));
  const f1 = Math.round((2 * precision * recall) / (precision + recall));
  const valLoss = (0.3 + (1 - dataFactor) * 0.8 + Math.random() * 0.1).toFixed(4);
  const trainLoss = (0.15 + (1 - dataFactor) * 0.5 + Math.random() * 0.05).toFixed(4);

  // 训练时长和数据量相关
  const totalMin = Math.round(1 + dataFactor * 5 + Math.random() * 2);
  const totalSec = Math.round(Math.random() * 59);
  const duration = `${totalMin}分${totalSec}秒`;

  // 模型大小 - MobileNet量级
  const sizeMB = (10 + Math.random() * 5).toFixed(1);
  const size = `${sizeMB}MB`;

  // 推理速度
  const inferenceTime = (15 + Math.random() * 10).toFixed(1);

  // Save model
  if (AppState.currentModel) {
    AppState.currentModel.status = 'completed';
    AppState.currentModel.accuracy = accuracy;
    AppState.currentModel.precision = precision;
    AppState.currentModel.recall = recall;
    AppState.currentModel.f1 = f1;
    AppState.currentModel.valLoss = valLoss;
    AppState.currentModel.trainLoss = trainLoss;
    AppState.currentModel.duration = duration;
    AppState.currentModel.size = size;
    AppState.currentModel.inferenceTime = inferenceTime;
    AppState.currentModel.epochs = epochs;
    AppState.currentModel.updatedAt = Date.now();
    AppState.currentModel.dataCount = dataCount || 0;
    Storage.addModel({...AppState.currentModel});
  }

  updateModelCount();

  // 启动摄像头模型效果演示
  const hasCamera = AppState.cameras.length > 0;
  if (hasCamera) {
    startModelDemo(modelType);
  }
  const cameraMsg = hasCamera
    ? '📸 模型效果已在<b>左侧摄像头画面</b>中实时演示'
    : '';

  const qualityLevel = accuracy >= 85 ? '⭐ 优秀' : accuracy >= 70 ? '✅ 良好' : accuracy >= 55 ? '⚠️ 一般' : '❌ 较差';

  setTimeout(() => {
    if (progressBar) progressBar.classList.remove('active');
  }, 2000);

  // 显示精度评估报告
  setTimeout(() => {
    if (AppState.currentModel) {
      showAccuracyReport({
        ...AppState.currentModel,
        accuracy: accuracy,
        precision: precision,
        recall: recall,
        f1: f1,
        duration: duration,
        dataCount: dataCount || 0,
        name: modelType + '模型',
        classes: AppState.currentModel.classes || [],
      });
    }
  }, 1500);

  addChatMessage('ai', `🎉 训练完成！<b>${modelType}</b>模型品质：<b>${qualityLevel}</b>

📊 **核心指标**
• 准确率 Accuracy：**${accuracy}%**
• 精确率 Precision：**${precision}%**
• 召回率 Recall：**${recall}%**
• F1-Score：**${f1}%**
• 训练损失：${trainLoss} → 验证损失：${valLoss}

⚙️ **训练配置**
• 训练轮次：${epochs} epochs
• 训练数据：${dataCount || 0} 张
• 优化器：AdamW + 余弦退火
• 正则化：Dropout + Label Smoothing + MixUp

📦 **模型信息**
• 模型大小：${size}
• 推理速度：${inferenceTime}ms/张
• 训练耗时：${duration}

${cameraMsg}

👉 模型已保存至知识库，可前往 **📦 导出中心** 导出或 **🖥️ 硬件部署** 部署到设备`);
}

function drawLineChart(canvasId, xData, yDatasets, colors, yRange, suffix) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  
  const w = rect.width;
  const h = rect.height;
  const padding = { top: 10, right: 10, bottom: 20, left: 35 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  ctx.clearRect(0, 0, w, h);

  if (xData.length < 2) {
    ctx.fillStyle = '#64748B';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('等待数据...', w / 2, h / 2);
    return;
  }

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (chartH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(w - padding.right, y);
    ctx.stroke();
  }

  // Y axis labels
  ctx.fillStyle = '#64748B';
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (chartH / 4) * i;
    const val = yRange[1] - (yRange[1] - yRange[0]) * (i / 4);
    ctx.fillText(val.toFixed(suffix === '%' ? 0 : 2) + suffix, padding.left - 4, y + 3);
  }

  // Draw lines
  yDatasets.forEach((dataset, idx) => {
    if (dataset.length < 2) return;
    
    const color = colors[idx];
    ctx.strokeStyle = color.replace('1)', '0.8)');
    ctx.lineWidth = 2;
    ctx.beginPath();
    
    for (let i = 0; i < dataset.length; i++) {
      const x = padding.left + (i / (dataset.length - 1)) * chartW;
      const y = padding.top + chartH - ((dataset[i] - yRange[0]) / (yRange[1] - yRange[0])) * chartH;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Gradient fill
    const lastY = padding.top + chartH - ((dataset[dataset.length - 1] - yRange[0]) / (yRange[1] - yRange[0])) * chartH;
    const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + chartH);
    gradient.addColorStop(0, color.replace('1)', '0.2)'));
    gradient.addColorStop(1, color.replace('1)', '0)'));
    ctx.fillStyle = gradient;
    ctx.lineTo(padding.left + chartW, padding.top + chartH);
    ctx.lineTo(padding.left, padding.top + chartH);
    ctx.closePath();
    ctx.fill();

    // Last point dot
    const lastX = padding.left + chartW;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(lastX, lastY, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // X axis (epoch numbers)
  ctx.fillStyle = '#64748B';
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  const steps = Math.min(5, xData.length);
  for (let i = 0; i < steps; i++) {
    const idx = Math.floor(i * (xData.length - 1) / (steps - 1));
    const x = padding.left + (idx / (xData.length - 1)) * chartW;
    ctx.fillText('E' + xData[idx], x, h - 6);
  }
}
