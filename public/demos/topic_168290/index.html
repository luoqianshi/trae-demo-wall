// Knowledge Cards (阶段式AI知识卡片)
// ============================================================
let currentKcIndex = 0;
let kcShownDuringTraining = [];

function showKnowledgeCard(index) {
  if (index < 0 || index >= KNOWLEDGE_CARDS.length) return;
  if (kcShownDuringTraining.includes(index)) return;
  
  kcShownDuringTraining.push(index);
  currentKcIndex = index;
  
  const card = KNOWLEDGE_CARDS[index];
  
  // Remove existing
  const existing = $('.knowledge-card-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'knowledge-card-overlay';
  
  let contentHtml = '';
  for (const [section, text] of Object.entries(card.content)) {
    if (section === '通俗类比') {
      contentHtml += `<div class="kc-analogy">
        <div class="kc-analogy-label">💡 通俗类比</div>
        <p>${text}</p>
      </div>`;
    } else if (Array.isArray(text)) {
      contentHtml += `<h4>${section}</h4><ul>${text.map(item => `<li>${item}</li>`).join('')}</ul>`;
    } else {
      contentHtml += `<h4>${section}</h4><p>${text}</p>`;
    }
  }

  overlay.innerHTML = `
    <div class="knowledge-card">
      <div class="kc-header">
        <div class="kc-icon">${card.icon}</div>
        <div class="kc-title-group">
          <h3>${card.title}</h3>
          <div class="kc-stage">${card.stage} · AI知识小课堂</div>
        </div>
      </div>
      <div class="kc-body">
        ${contentHtml}
      </div>
      <div class="kc-footer">
        <div class="kc-progress">
          ${KNOWLEDGE_CARDS.map((_, i) => 
            `<span class="kc-dot ${i < index ? 'done' : i === index ? 'active' : ''}"></span>`
          ).join('')}
        </div>
        <div class="kc-actions">
          <button class="kc-btn skip" id="kcSkip">跳过</button>
          <button class="kc-btn next" id="kcNext">
            ${index === KNOWLEDGE_CARDS.length - 1 ? '我知道了 ✓' : '下一个 →'}
          </button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  $('#kcSkip', overlay).addEventListener('click', () => {
    overlay.remove();
  });

  $('#kcNext', overlay).addEventListener('click', () => {
    overlay.remove();
    if (index < KNOWLEDGE_CARDS.length - 1) {
      setTimeout(() => showKnowledgeCard(index + 1), 200);
    }
  });

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.remove();
  });
}

function resetKnowledgeCards() {
  kcShownDuringTraining = [];
  currentKcIndex = 0;
}

// 训练过程中触发知识卡片的时机
function triggerKnowledgeCard(stage, totalEpochs, currentEpoch) {
  const progress = currentEpoch / totalEpochs;
  
  // 在训练的不同阶段触发不同的知识卡片
  if (progress >= 0.05 && !kcShownDuringTraining.includes(0)) {
    setTimeout(() => showKnowledgeCard(0), 500);
  } else if (progress >= 0.2 && !kcShownDuringTraining.includes(1)) {
    setTimeout(() => showKnowledgeCard(1), 500);
  } else if (progress >= 0.4 && !kcShownDuringTraining.includes(2)) {
    setTimeout(() => showKnowledgeCard(2), 500);
  } else if (progress >= 0.6 && !kcShownDuringTraining.includes(3)) {
    setTimeout(() => showKnowledgeCard(3), 500);
  } else if (progress >= 0.8 && !kcShownDuringTraining.includes(4)) {
    setTimeout(() => showKnowledgeCard(4), 500);
  }
}

function showUploadModal() {
  // Remove existing overlay
  const existing = $('.upload-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'upload-overlay';
  overlay.innerHTML = `
    <div class="upload-modal">
      <h3>📸 上传训练数据</h3>
      <div class="drop-zone" id="dropZone">
        <div class="dz-icon">📁</div>
        <p>拖拽图片到此处，或点击选择文件</p>
        <div class="dz-hint">支持 JPG、PNG、WebP 格式 · 单次最多100张</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
      <div class="upload-preview-grid" id="uploadPreview"></div>
      <div style="margin-top:16px;padding:12px;background:rgba(124,92,231,0.08);border-radius:var(--radius-md);border:1px solid rgba(124,92,231,0.15);text-align:center">
        <p style="font-size:0.8rem;color:var(--purple-400);margin-bottom:8px">💡 没有训练数据？试试精选示例数据集</p>
        <button class="btn-accent" id="btnShowDatasets" style="width:100%;background:linear-gradient(135deg,var(--purple-500),var(--sky-500))">
          📚 浏览 30+ 精选示例数据集
        </button>
      </div>
      <div class="upload-modal-actions">
        <button class="btn-secondary" id="btnCancelUpload">取消</button>
        <button class="btn-accent" id="btnStartTraining" disabled>
          🚀 开始训练（<span id="uploadCount">0</span>张图片）
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const dropZone = $('#dropZone', overlay);
  const fileInput = $('#fileInput', overlay);
  const previewGrid = $('#uploadPreview', overlay);
  const btnStart = $('#btnStartTraining', overlay);
  const uploadCount = $('#uploadCount', overlay);
  let files = [];

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    handleFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => handleFiles([...fileInput.files]));

  function handleFiles(newFiles) {
    const remaining = 100 - files.length;
    const toAdd = newFiles.slice(0, remaining);
    if (newFiles.length > remaining) {
      showToast(`最多上传100张，已忽略 ${newFiles.length - remaining} 张`, 'error');
    }
    files = [...files, ...toAdd];
    renderPreviews();
    uploadCount.textContent = files.length;
    btnStart.disabled = files.length === 0;
  }

  async function renderPreviews() {
    previewGrid.innerHTML = '';
    for (let i = 0; i < Math.min(files.length, 50); i++) {
      const file = files[i];
      const item = document.createElement('div');
      item.className = 'upload-preview-item';
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      item.appendChild(img);

      // Quality detection
      const quality = await detectImageQuality(file, img);
      const badge = document.createElement('span');
      badge.className = `quality-badge ${quality.level}`;
      badge.textContent = quality.label;
      item.appendChild(badge);

      previewGrid.appendChild(item);
    }
    if (files.length > 50) {
      const more = document.createElement('div');
      more.className = 'upload-preview-item';
      more.style.cssText = 'display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.8rem';
      more.textContent = `+${files.length - 50} 张`;
      previewGrid.appendChild(more);
    }
  }

  async function detectImageQuality(file, imgElement) {
    // Wait for image to load
    await new Promise(resolve => { imgElement.onload = resolve; });

    // Check resolution
    if (imgElement.naturalWidth < 200 || imgElement.naturalHeight < 200) {
      return { level: 'bad', label: '分辨率过低' };
    }

    // Check file size
    if (file.size < 1024) {
      return { level: 'bad', label: '文件异常' };
    }

    // Simple blur detection using canvas
    try {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const size = 64;
      canvas.width = size;
      canvas.height = size;
      ctx.drawImage(imgElement, 0, 0, size, size);
      const imageData = ctx.getImageData(0, 0, size, size);
      const data = imageData.data;

      // Calculate Laplacian variance (simplified)
      let sum = 0;
      let count = 0;
      for (let y = 1; y < size - 1; y++) {
        for (let x = 1; x < size - 1; x++) {
          const idx = (y * size + x) * 4;
          const g = (data[idx] + data[idx+1] + data[idx+2]) / 3;
          const gLeft = (data[idx-4] + data[idx-3] + data[idx-2]) / 3;
          const gRight = (data[idx+4] + data[idx+5] + data[idx+6]) / 3;
          const gUp = (data[idx-size*4] + data[idx-size*4+1] + data[idx-size*4+2]) / 3;
          const gDown = (data[idx+size*4] + data[idx+size*4+1] + data[idx+size*4+2]) / 3;
          const laplacian = Math.abs(4 * g - gLeft - gRight - gUp - gDown);
          sum += laplacian;
          count++;
        }
      }
      const variance = sum / count;

      if (variance < 5) return { level: 'bad', label: '图片模糊' };
      if (variance < 15) return { level: 'warning', label: '略模糊' };
      return { level: 'good', label: '质量良好' };
    } catch (e) {
      return { level: 'warning', label: '无法检测' };
    }
  }

  // Show datasets
  $('#btnShowDatasets', overlay).addEventListener('click', () => {
    overlay.remove();
    showDatasetModal();
  });

  // Cancel
  $('#btnCancelUpload', overlay).addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  // Start training
  btnStart.addEventListener('click', () => {
    overlay.remove();
    const modelType = AppState.currentModel?.type || '自定义';
    const capturedCount = AppState.capturedPhotos.length;
    const totalCount = files.length + capturedCount;
    const photoInfo = capturedCount > 0 ? `（含 ${capturedCount} 张拍摄照片）` : '';
    addChatMessage('user', `已上传 ${files.length} 张训练图片${photoInfo}，开始训练${modelType}模型`);
    conversationHistory.push({ role: 'user', content: `用户已上传 ${totalCount} 张训练图片（含 ${files.length} 张上传 + ${capturedCount} 张拍摄），要求开始训练${modelType}模型` });
    setTimeout(() => {
      addChatMessage('ai', `🚀 好的！开始训练<b>${modelType}</b>模型...\n\n已配置训练参数：\n• 框架：TensorFlow/PyTorch\n• 优化器：Adam\n• 学习率：0.001\n• Batch Size：32\n• Epochs：50\n\n训练正在进行中，你可以在上方进度条查看实时进度。`);
      startTraining(modelType, totalCount);
    }, 600);
  });
}

          <h4>常见问题</h4>
          <p>部署FAQ和故障排除</p>
        </div>
      </div>
      <div style="margin-top:20px;padding:16px;background:var(--bg-input);border-radius:var(--radius-md);border:1px solid var(--border-subtle)">
        <h4 style="font-size:0.85rem;margin-bottom:8px;color:var(--sky-400)">📋 部署步骤概览</h4>
        <ol style="font-size:0.8rem;color:var(--text-secondary);line-height:2;padding-left:20px">

          <li>安装Python环境和依赖库</li>
          <li>将导出的模型文件传输到设备</li>
          <li>运行部署脚本，启动推理服务</li>
          <li>验证模型推理结果</li>
        </ol>
      </div>
    `
  };

  function showStep(step) {
    activeStep = step;
    stepBtns.forEach(b => b.classList.remove('active'));
    stepBtns[step - 1].classList.add('active');
    deployContent.innerHTML = contents[step];
    // Re-bind events
    if (step === 1) {
      setTimeout(() => {
        const btnCheck = $('#btnCheckDevice');
        if (btnCheck) {
          btnCheck.addEventListener('click', async () => {
            const statuses = $$('.check-status', deployContent);
            btnCheck.disabled = true;
            btnCheck.textContent = '检测中...';
            
            // 第一项：设备连接检测 - 使用 Web Serial API 尝试检测
            statuses[0].textContent = '🔄 检测中...';
            statuses[0].className = 'check-status pending';
            
            try {
              // 尝试使用 Web Serial API 检测串口设备
              if ('serial' in navigator) {
                try {
                  const ports = await navigator.serial.getPorts();
                  if (ports.length > 0) {
                    statuses[0].textContent = '✅ 已连接';
                    statuses[0].className = 'check-status ok';
                  } else {
                    statuses[0].textContent = '❌ 未检测到';
                    statuses[0].className = 'check-status bad';
                  }
                } catch (e) {
                  statuses[0].textContent = '❌ 无法检测';
                  statuses[0].className = 'check-status bad';
                }
              } else {
                statuses[0].textContent = '⚠️ 不支持';
                statuses[0].className = 'check-status bad';
              }
            } catch (e) {
              statuses[0].textContent = '❌ 检测失败';
              statuses[0].className = 'check-status bad';
            }
            
            // 第二项：行空板M10检测
            await new Promise(r => setTimeout(r, 800));
            statuses[1].textContent = '❌ 未连接';
            statuses[1].className = 'check-status bad';
            
            // 第三项：网络连接检测
            await new Promise(r => setTimeout(r, 800));
            statuses[2].textContent = navigator.onLine ? '✅ 已连接' : '❌ 未连接';
            statuses[2].className = navigator.onLine ? 'check-status ok' : 'check-status bad';
            
            // 第四项：Python环境检测（本地浏览器无法检测远程设备）
            await new Promise(r => setTimeout(r, 800));
            statuses[3].textContent = '⚠️ 需在设备端检测';
            statuses[3].className = 'check-status bad';
            
            btnCheck.disabled = false;
            btnCheck.textContent = '🔄 重新检测';
            
            const hasOk = [...statuses].some(s => s.classList.contains('ok'));
            if (hasOk) {
              showToast('检测完成，部分设备状态正常', 'info');
            } else {
              showToast('未检测到硬件设备，请检查连接后重试', 'error');
            }
          });
        }
      }, 100);
    }
    if (step === 2) {
      setTimeout(() => {
        const btnGen = $('#btnGenScript');
        if (btnGen) {
          btnGen.addEventListener('click', () => {
            showToast('部署脚本已重新生成', 'success');
          });
        }
      }, 100);
    }
  }

  stepBtns.forEach(btn => {
    btn.addEventListener('click', () => showStep(parseInt(btn.dataset.step)));
  });

  showStep(1);
}

        question.addEventListener('click', () => {

// ============================================================
// Accuracy Report (模型精度评估报告)
// ============================================================
function showAccuracyReport(modelData) {
  const existing = $('.report-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'upload-overlay report-overlay';
  
  const accuracy = modelData.accuracy || 70;
  const precision = modelData.precision || 68;
  const recall = modelData.recall || 66;
  const f1 = modelData.f1 || Math.round((2 * precision * recall) / (precision + recall));
  
  // Determine grade - 更真实的等级评定
  let grade, gradeClass;
  if (accuracy >= 85) { grade = 'A'; gradeClass = ''; }
  else if (accuracy >= 70) { grade = 'B'; gradeClass = 'b'; }
  else if (accuracy >= 55) { grade = 'C'; gradeClass = 'c'; }
  else { grade = 'D'; gradeClass = 'c'; }
  
  const classes = modelData.classes || ['类别1', '类别2', '类别3'];
  const perClassAcc = classes.map((c, i) => ({
    name: c,
    acc: Math.round(accuracy - 5 + Math.random() * 10 - i * 2)
  }));
  
  const suggestions = generateSuggestions(accuracy, classes.length);

  overlay.innerHTML = `
    <div class="upload-modal report-modal">
      <div class="report-header">
        <div class="report-grade ${gradeClass}">${grade}</div>
        <h2>${modelData.name || '模型'} 精度评估报告</h2>
        <p>训练完成 · ${modelData.duration || '3分20秒'} · ${modelData.dataCount || 0} 张训练数据</p>
      </div>
      
      <div class="report-metrics">
        <div class="report-metric">
          <div class="rm-value">${accuracy}%</div>
          <div class="rm-label">准确率</div>
        </div>
        <div class="report-metric">
          <div class="rm-value">${precision}%</div>
          <div class="rm-label">精确率</div>
        </div>
        <div class="report-metric">
          <div class="rm-value">${recall}%</div>
          <div class="rm-label">召回率</div>
        </div>
        <div class="report-metric">
          <div class="rm-value">${f1}%</div>
          <div class="rm-label">F1分数</div>
        </div>
      </div>
      
      <div class="report-section">
        <h3>📊 各类别准确率</h3>
        <div class="per-class-accuracy">
          ${perClassAcc.map(item => `
            <div class="pca-item">
              <span class="pca-label">${item.name}</span>
              <div class="pca-bar">
                <div class="pca-fill" style="width:${item.acc}%"></div>
              </div>
              <span class="pca-value">${item.acc}%</span>
            </div>
          `).join('')}
        </div>
      </div>
      
      <div class="report-section">
        <h3>💡 优化建议</h3>
        <ul class="suggestion-list">
          ${suggestions.map(s => `<li>${s}</li>`).join('')}
        </ul>
      </div>
      
      <div class="upload-modal-actions">
        <button class="btn-secondary" onclick="this.closest('.upload-overlay').remove()">关闭</button>
        <button class="btn-accent" id="btnRetrainReport">🔄 重新训练优化</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  
  // Retrain button
  const retrainBtn = $('#btnRetrainReport', overlay);
  if (retrainBtn) {
    retrainBtn.addEventListener('click', () => {
      overlay.remove();
      showToast('即将开始新一轮优化训练...', 'info');
      setTimeout(() => {
        if (AppState.currentModel) {
          startTraining(AppState.currentModel.type, (modelData.dataCount || 100) + 50);
        }
      }, 1000);
    });
  }
}

function generateSuggestions(accuracy, numClasses) {
  const suggestions = [];
  
  if (accuracy < 70) {
    suggestions.push('⚠️ 增加训练数据量 — 当前数据量可能不足，建议每个类别至少增加到50张以上');
    suggestions.push('检查数据标注质量 — 错误标注会严重影响训练效果，请仔细核对每张图片的标签');
  }
  
  if (numClasses > 4 && accuracy < 75) {
    suggestions.push('类别数量较多 — 类别越多识别难度越大，建议先从2-3个类别开始练手');
  }
  
  suggestions.push('增加数据多样性 — 尝试在不同光照、角度、背景下拍摄，提高模型泛化能力');
  suggestions.push('使用数据增强 — 系统已自动启用翻转、旋转等数据增强，可考虑添加更多变化');
  
  if (accuracy >= 80) {
    suggestions.push('✅ 模型表现不错！可以尝试增加更多类别，或部署到硬件上进行实际测试');
  } else if (accuracy >= 60) {
    suggestions.push('模型效果一般，建议增加数据量和数据多样性后再训练一次');
  } else {
    suggestions.push('模型效果较差，建议检查数据质量，确保每个类别有足够的高质量图片');
  }
  
  suggestions.push('查看混淆矩阵 — 找出容易混淆的类别对，针对性地补充训练数据');
  
  return suggestions;
}

        <h2 class="ov-section-title"><span class="ov-num">二</span> 痛点分析</h2>
        <div class="pain-points">
          <div class="pain-card">
            <div class="pain-icon">😰</div>
            <div class="pain-content">
              <h3>AI模型训练门槛过高</h3>
              <p>传统AI模型训练需要掌握Python、TensorFlow/PyTorch、数据预处理、超参数调优等专业技能，普通用户（学生、教师、创客、中小企业）难以跨越技术门槛。NeuralForge通过<strong>自然语言对话式交互</strong>，让用户只需说出"我想训练一个手势识别模型"，即可自动完成从数据收集到模型训练的全流程。</p>
            </div>
          </div>
          <div class="pain-card">
            <div class="pain-icon">⏱️</div>
            <div class="pain-content">
              <h3>训练数据采集效率低</h3>
              <p>AI模型训练的最大瓶颈在于<strong>高质量训练数据的采集</strong>。传统方式需要手动拍摄、整理、标注，耗时数天甚至数周。NeuralForge提供三通道数据采集（拖拽批量上传/摄像头手动拍摄/网络搜索），配合自动质量检测（模糊/重复/低质量识别），将数据准备时间从数天压缩到<strong>分钟级</strong>。</p>
            </div>
          </div>
          <div class="pain-card">
            <div class="pain-icon">📱</div>
            <div class="pain-content">
              <h3>模型部署链路断裂</h3>
              <p>训练好的模型难以落地到实际场景。用户往往不知道如何将模型部署到手机、网页、小程序或嵌入式设备。NeuralForge提供<strong>五种导出格式</strong>（ZIP/Web/微信小程序/TFLite/Python SDK）和<strong>硬件部署方案</strong>（树莓派/行空板M10），打通从训练到部署的最后一公里。</p>
            </div>
          </div>
          <div class="pain-card">
            <div class="pain-icon">🔄</div>
            <div class="pain-content">
              <h3>模型效果缺乏即时反馈</h3>
              <p>传统AI训练平台训练完成后，用户需要写代码加载模型才能看到效果，反馈周期长。NeuralForge在训练完成后<strong>自动启动摄像头实时演示</strong>，六种模型类型的可视化效果（手势识别/面部识别/物体检测/图像分类/OCR/分割），让用户第一时间看到模型的实际表现。</p>
            </div>
          </div>
          <div class="pain-card">
            <div class="pain-icon">📚</div>
            <div class="pain-content">
              <h3>知识管理与复用困难</h3>
              <p>多次训练后，模型散落在不同位置，难以管理和对比。NeuralForge的<strong>动态知识图谱</strong>以可视化方式呈现所有训练过的模型及其关系，支持点击查看详细指标，让知识积累和复用变得直观高效。</p>
            </div>
          </div>
        </div>
      </div>

}

function initKnowledgePage() {
  const models = Storage.getModels();
  const canvas = $('#knowledge-canvas');
  const ctx = canvas ? canvas.getContext('2d') : null;
  const detailPanel = $('#modelDetailPanel');
  const detailContent = $('#detailContent');
  const searchInput = $('#knowledgeSearch');
  const graphView = $('#graphView');
  const listView = $('#listView');
  const viewToggle = $('#viewToggle');
  
  // 视图切换
  if (viewToggle) {
    viewToggle.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        viewToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const view = btn.dataset.view;
        if (view === 'graph') {
          if (graphView) graphView.style.display = 'block';
          if (listView) listView.style.display = 'none';
        } else {
          if (graphView) graphView.style.display = 'none';
          if (listView) listView.style.display = 'block';
          renderModelList();
        }
      });
    });
  }
  
  function renderModelList(filter = '') {
    const container = $('#modelListContainer');
    if (!container) return;
    const filtered = filter ? models.filter(m => m.name.includes(filter) || m.type.includes(filter)) : models;
    
    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px 0">暂无已训练的模型</p>';
      return;
    }
    
    container.innerHTML = filtered.map(m => `
      <div class="model-list-item" data-id="${m.id}">
        <div class="mli-icon">🤖</div>
        <div class="mli-info">
          <div class="mli-name">${m.name}</div>
          <div class="mli-meta">
            <span>${m.type}</span>
            <span>${m.accuracy ? m.accuracy + '% 准确率' : '待训练'}</span>
            <span>${fmtDate(m.createdAt)}</span>
            ${m.status === 'completed' ? '<span class="version-badge">v1.0</span>' : ''}
          </div>
        </div>
        <div class="mli-actions">
          <button class="mli-action-btn" title="查看详情" onclick="event.stopPropagation();showModelDetailById('${m.id}')">👁️</button>
          ${m.status === 'completed' ? `<button class="mli-action-btn" title="重新训练" onclick="event.stopPropagation();retrainModel('${m.id}')">🔄</button>` : ''}
          <button class="mli-action-btn" title="删除" onclick="event.stopPropagation();deleteModel('${m.id}')">🗑️</button>
        </div>
      </div>
    `).join('');
    
    // 点击查看详情
    container.querySelectorAll('.model-list-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        showModelDetailById(id);
      });
    });
  }

  let nodes = [];
  let animId;
  let hoveredNode = null;
  let selectedNode = null;

  function resize() {
    const container = canvas.parentElement;
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); buildGraph(); });

  function buildGraph(filter = '') {
    nodes = [];
    const filtered = filter ? models.filter(m => m.name.includes(filter) || m.type.includes(filter)) : models;

    if (filtered.length === 0) {
      // 无真实模型时显示空状态提示，不创建任何演示数据
      nodes = [];
    } else {
      filtered.forEach((m, i) => {
        const angle = (i / filtered.length) * Math.PI * 2 + (filtered.length === 1 ? 0 : 0);
        const radius = Math.min(canvas.width, canvas.height) * 0.3;
        nodes.push({
          ...m,
          x: canvas.width / 2 + Math.cos(angle) * (radius + Math.random() * 60),
          y: canvas.height / 2 + Math.sin(angle) * (radius + Math.random() * 60),
          targetX: canvas.width / 2 + Math.cos(angle) * radius,
          targetY: canvas.height / 2 + Math.sin(angle) * radius,
          radius: 24 + Math.random() * 14,
          vx: 0, vy: 0,
        });
      });
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 无真实模型时显示空状态提示
    if (nodes.length === 0) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      // 绘制中心光晕
      const centerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80);
      centerGlow.addColorStop(0, 'rgba(74,144,217,0.08)');
      centerGlow.addColorStop(1, 'rgba(74,144,217,0)');
      ctx.fillStyle = centerGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, 80, 0, Math.PI * 2);
      ctx.fill();
      // 空状态文字
      ctx.fillStyle = '#64748B';
      ctx.font = '16px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('暂无已训练的模型', cx, cy - 8);
      ctx.font = '12px "Inter", sans-serif';
      ctx.fillText('前往锻造工作台训练你的第一个AI模型', cx, cy + 18);
      animId = requestAnimationFrame(animate);
      return;
    }

    // Draw connections
    ctx.strokeStyle = 'rgba(74,144,217,0.12)';
    ctx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }

    // Draw connection to center
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    nodes.forEach(node => {
      ctx.beginPath();
      ctx.moveTo(node.x, node.y);
      ctx.lineTo(cx, cy);
      ctx.strokeStyle = 'rgba(124,92,231,0.06)';
      ctx.stroke();
    });

    // Draw center glow
    const centerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
    centerGlow.addColorStop(0, 'rgba(74,144,217,0.15)');
    centerGlow.addColorStop(1, 'rgba(74,144,217,0)');
    ctx.fillStyle = centerGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, 60, 0, Math.PI * 2);
    ctx.fill();

    // Update and draw nodes
    nodes.forEach(node => {
      // Spring physics
      const dx = node.targetX - node.x;
      const dy = node.targetY - node.y;
      node.vx += dx * 0.02;
      node.vy += dy * 0.02;
      node.vx *= 0.9;
      node.vy *= 0.9;
      node.x += node.vx;
      node.y += node.vy;

      // Repulsion between nodes
      nodes.forEach(other => {
        if (other === node) return;
        const dx2 = node.x - other.x;
        const dy2 = node.y - other.y;
        const dist = Math.sqrt(dx2 * dx2 + dy2 * dy2);
        if (dist < 100) {
          const force = (100 - dist) / 100 * 0.5;
          node.vx += (dx2 / dist) * force;
          node.vy += (dy2 / dist) * force;
        }
      });

      const isHovered = hoveredNode === node;
      const isSelected = selectedNode === node;
      const r = node.radius + (isHovered ? 4 : 0);

      // Glow
      let color;
      if (node.status === 'completed') color = '74,144,217';
      else if (node.status === 'training') color = '245,158,11';
      else color = '100,116,139';

      const glow = ctx.createRadialGradient(node.x, node.y, r * 0.5, node.x, node.y, r * 2);
      glow.addColorStop(0, `rgba(${color},0.3)`);
      glow.addColorStop(1, `rgba(${color},0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(node.x, node.y, r * 2, 0, Math.PI * 2);
      ctx.fill();

      // Node circle
      ctx.fillStyle = isSelected ? `rgba(${color},0.3)` : `rgba(${color},0.15)`;
      ctx.strokeStyle = `rgba(${color},0.6)`;
      ctx.lineWidth = isHovered || isSelected ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Inner dot
      ctx.fillStyle = `rgb(${color})`;
      ctx.beginPath();
      ctx.arc(node.x, node.y, r * 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Label
      ctx.fillStyle = '#E8EDF5';
      ctx.font = `${isSelected ? 'bold ' : ''}${11 + (isHovered ? 1 : 0)}px "Inter", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(node.name.length > 8 ? node.name.slice(0, 8) + '...' : node.name, node.x, node.y + r + 16);

      // Accuracy
      if (node.accuracy) {
        ctx.fillStyle = 'rgba(148,163,184,0.8)';
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillText(node.accuracy + '%', node.x, node.y + r + 30);
      }

      // Pulse if selected
      if (isSelected) {
        const pulseR = r + 6 + Math.sin(Date.now() / 500) * 4;
        ctx.strokeStyle = `rgba(${color},0.4)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(node.x, node.y, pulseR, 0, Math.PI * 2);
        ctx.stroke();
      }
    });

    animId = requestAnimationFrame(animate);
  }

  // Mouse interaction
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    hoveredNode = null;
    for (const node of nodes) {
      const dx = mx - node.x;
      const dy = my - node.y;
      if (Math.sqrt(dx * dx + dy * dy) < node.radius + 4) {
        hoveredNode = node;
        canvas.style.cursor = 'pointer';
        break;
      }
    }
    if (!hoveredNode) canvas.style.cursor = 'default';
  });

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    for (const node of nodes) {
      const dx = mx - node.x;
      const dy = my - node.y;
      if (Math.sqrt(dx * dx + dy * dy) < node.radius + 4) {
        selectedNode = node;
        showNodeDetail(node);
        return;
      }
    }
    selectedNode = null;
    detailPanel.classList.remove('visible');
  });

  function showNodeDetail(node) {
    detailPanel.classList.add('visible');
    detailContent.innerHTML = `
      <h3>${node.name}</h3>
      <div class="detail-section">
        <h4>基本信息</h4>
        <div class="detail-row"><span class="label">模型类型</span><span class="value">${node.type}</span></div>
        <div class="detail-row"><span class="label">状态</span><span class="value">${node.status === 'completed' ? '✅ 已完成' : node.status === 'training' ? '🔄 训练中' : '⏳ 待训练'}</span></div>
        <div class="detail-row"><span class="label">准确率</span><span class="value">${node.accuracy ? node.accuracy + '%' : 'N/A'}</span></div>
        <div class="detail-row"><span class="label">创建时间</span><span class="value">${fmtDate(node.createdAt)}</span></div>
        ${node.duration ? `<div class="detail-row"><span class="label">训练耗时</span><span class="value">${node.duration}</span></div>` : ''}
        ${node.size ? `<div class="detail-row"><span class="label">模型大小</span><span class="value">${node.size}</span></div>` : ''}
        ${node.dataCount ? `<div class="detail-row"><span class="label">训练数据量</span><span class="value">${node.dataCount} 张</span></div>` : ''}
      </div>
      <div class="detail-section">
        <h4>描述</h4>
        <p style="font-size:0.8rem;color:var(--text-secondary);line-height:1.5">${node.description || '暂无描述'}</p>
      </div>
      ${node.params ? `
      <div class="detail-section">
        <h4>训练参数</h4>
        <div class="detail-params">
          ${Object.entries(node.params).map(([k,v]) => `${k}: ${v}`).join('\n')}
        </div>
      </div>` : ''}
    `;
  }

  $('#closeDetail').addEventListener('click', () => {
    selectedNode = null;
    detailPanel.classList.remove('visible');
  });

  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      buildGraph(e.target.value);
    });
  }

  buildGraph();
  animate();

  // Store cleanup
  const oldCleanup = AppState._knowledgeCleanup;
  AppState._knowledgeCleanup = () => {
    if (animId) cancelAnimationFrame(animId);
  };
}

// ============================================================
// Model Library Functions
// ============================================================
function showModelDetailById(modelId) {
  const models = Storage.getModels();
  const model = models.find(m => m.id === modelId);
  if (!model) return;
  
  const detailPanel = $('#modelDetailPanel');
  const detailContent = $('#detailContent');
  if (!detailPanel || !detailContent) return;
  
  // 如果在图谱视图，选中对应的节点
  // 简化处理：直接显示详情面板
  
  detailPanel.classList.add('visible');
  detailContent.innerHTML = `
    <h3>${model.name}</h3>
    <div class="detail-section">
      <h4>基本信息</h4>
      <div class="detail-row"><span class="label">模型类型</span><span class="value">${model.type}</span></div>
      <div class="detail-row"><span class="label">状态</span><span class="value">${model.status === 'completed' ? '✅ 已完成' : model.status === 'training' ? '🔄 训练中' : '⏳ 待训练'}</span></div>
      <div class="detail-row"><span class="label">准确率</span><span class="value">${model.accuracy ? model.accuracy + '%' : 'N/A'}</span></div>
      <div class="detail-row"><span class="label">创建时间</span><span class="value">${fmtDate(model.createdAt)}</span></div>
      ${model.duration ? `<div class="detail-row"><span class="label">训练耗时</span><span class="value">${model.duration}</span></div>` : ''}
      ${model.size ? `<div class="detail-row"><span class="label">模型大小</span><span class="value">${model.size}</span></div>` : ''}
      ${model.dataCount ? `<div class="detail-row"><span class="label">训练数据量</span><span class="value">${model.dataCount} 张</span></div>` : ''}
    </div>
    <div class="detail-section">
      <h4>描述</h4>
      <p style="font-size:0.8rem;color:var(--text-secondary);line-height:1.5">${model.description || '暂无描述'}</p>
    </div>
    ${model.params ? `
    <div class="detail-section">
      <h4>训练参数</h4>
      <div class="detail-params">
        ${Object.entries(model.params).map(([k,v]) => `${k}: ${v}`).join('\n')}
      </div>
    </div>` : ''}
    <div class="detail-section" style="display:flex;gap:8px;margin-top:16px">
      ${model.status === 'completed' ? `
        <button class="btn-accent" style="flex:1;padding:8px" onclick="retrainModel('${model.id}')">🔄 重新训练</button>
        <button class="btn-secondary" style="flex:1;padding:8px" onclick="navigate('export')">📦 导出模型</button>
      ` : ''}
    </div>
  `;
}

function retrainModel(modelId) {
  const models = Storage.getModels();
  const model = models.find(m => m.id === modelId);
  if (!model) return;
  
  const detailPanel = $('#modelDetailPanel');
  if (detailPanel) detailPanel.classList.remove('visible');
  
  showToast(`开始重新训练「${model.name}」...`, 'info');
  navigate('forge');
  
  setTimeout(() => {
    AppState.currentModel = { ...model, id: genId(), status: 'pending', createdAt: Date.now(), updatedAt: Date.now() };
    startTraining(model.type, model.dataCount || 50);
  }, 500);
}

function deleteModel(modelId) {
  if (!confirm('确定要删除这个模型吗？此操作不可恢复。')) return;
  
  let models = Storage.getModels();
  models = models.filter(m => m.id !== modelId);
  Storage.setModels(models);
  
  showToast('模型已删除', 'success');
  initKnowledgePage();
}

// ============================================================
// Initialize App
// ============================================================
function initApp() {
  initParticles();
  const user = Storage.getUser();
  if (user) {
    AppState.user = user;
    AppState.isLoggedIn = true;
    AppState.currentPage = 'forge';
  } else {
    AppState.currentPage = 'login';
  }
  render();
}

// Start
document.addEventListener('DOMContentLoaded', initApp);

// Handle page unload
window.addEventListener('beforeunload', () => {
  // 保存对话历史
  if (conversationHistory && conversationHistory.length > 1) {
    const userMsgs = conversationHistory.filter(m => m.role === 'user' || m.role === 'assistant');
    Storage.setConversationHistory(userMsgs);
  }
  stopCamera();
  if (AppState._knowledgeCleanup) AppState._knowledgeCleanup();
});
</script>
