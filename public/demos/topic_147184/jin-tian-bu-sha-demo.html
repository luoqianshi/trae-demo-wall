<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天补啥 — 营养缺口智能补齐助手</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

:root {
  --bg: #0F0F13;
  --bg2: #1A1A22;
  --bg3: #22222E;
  --card: rgba(28,28,38,0.85);
  --card-solid: #1C1C26;
  --ink: #F0F0F5;
  --ink2: #C8C8D4;
  --muted: #6B6B80;
  --rule: rgba(255,255,255,0.06);
  --accent: #34D399;
  --accent-dim: rgba(52,211,153,0.12);
  --accent2: #FBBF24;
  --accent2-dim: rgba(251,191,36,0.12);
  --danger: #F87171;
  --danger-dim: rgba(248,113,113,0.12);
  --blue: #60A5FA;
  --blue-dim: rgba(96,165,250,0.12);
  --purple: #A78BFA;
  --purple-dim: rgba(167,139,250,0.12);
  --pink: #F472B6;
  --pink-dim: rgba(244,114,182,0.12);
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.4);
  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --font: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 110px;
  overflow-x: hidden;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }

/* ===== AMBIENT BACKGROUND ===== */
.ambient {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.25;
  animation: orbFloat 20s ease-in-out infinite;
}
.ambient-orb:nth-child(1) { width: 400px; height: 400px; background: #34D399; top: -100px; right: -100px; animation-delay: 0s; }
.ambient-orb:nth-child(2) { width: 350px; height: 350px; background: #60A5FA; bottom: 10%; left: -80px; animation-delay: -7s; }
.ambient-orb:nth-child(3) { width: 300px; height: 300px; background: #A78BFA; top: 50%; right: 20%; animation-delay: -14s; }
@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -40px) scale(1.05); }
  50% { transform: translate(-20px, 30px) scale(0.95); }
  75% { transform: translate(40px, 20px) scale(1.02); }
}

/* ===== LAYOUT ===== */
.container {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ===== TOP BAR ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(15,15,19,0.7);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #34D399, #059669);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900; color: #fff;
  box-shadow: 0 4px 16px rgba(52,211,153,0.3);
}
.topbar h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
.topbar-date { font-size: 0.78rem; color: var(--muted); font-weight: 400; }
.topbar-actions { display: flex; gap: 8px; }
.btn-icon {
  width: 38px; height: 38px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-xs);
  background: var(--card);
  backdrop-filter: blur(12px);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  color: var(--ink2);
  transition: all 0.25s;
}
.btn-icon:hover { background: var(--bg3); border-color: rgba(255,255,255,0.1); }

/* ===== SECTION ===== */
.section { margin-top: 24px; }
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding: 0 4px;
}
.section-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.section-action {
  font-size: 0.78rem;
  color: var(--accent);
  cursor: pointer;
  font-weight: 600;
  background: none;
  border: none;
  font-family: inherit;
  transition: opacity 0.2s;
}
.section-action:hover { opacity: 0.7; }

/* ===== GLASS CARD ===== */
.glass {
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ===== AI SUMMARY ===== */
.ai-summary {
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.ai-summary::before {
  content: '';
  position: absolute;
  top: -1px; left: 20px; right: 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.ai-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--accent-dim);
  color: var(--accent);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  margin-bottom: 10px;
}
.ai-tag .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.ai-text {
  font-size: 0.92rem;
  color: var(--ink2);
  line-height: 1.8;
  font-weight: 400;
}
.ai-text strong { color: var(--ink); font-weight: 600; }
.ai-text .hl-green { color: var(--accent); font-weight: 600; }
.ai-text .hl-yellow { color: var(--accent2); font-weight: 600; }
.ai-text .hl-red { color: var(--danger); font-weight: 600; }

/* ===== SUMMARY STATS ===== */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}
.stat-card {
  padding: 16px 14px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 20%; right: 20%;
  height: 2px;
  border-radius: 2px;
  opacity: 0.5;
}
.stat-card.c-green::after { background: var(--accent); }
.stat-card.c-yellow::after { background: var(--accent2); }
.stat-card.c-red::after { background: var(--danger); }
.stat-card.c-blue::after { background: var(--blue); }
.stat-num {
  font-size: 1.6rem;
  font-weight: 900;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--ink), var(--ink2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-num.green { background: linear-gradient(135deg, #34D399, #6EE7B7); -webkit-background-clip: text; background-clip: text; }
.stat-num.yellow { background: linear-gradient(135deg, #FBBF24, #FCD34D); -webkit-background-clip: text; background-clip: text; }
.stat-num.red { background: linear-gradient(135deg, #F87171, #FCA5A5); -webkit-background-clip: text; background-clip: text; }
.stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 4px; font-weight: 500; }

/* ===== NUTRIENT GAUGES ===== */
.gauge-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.gauge-card {
  padding: 16px 12px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.gauge-card:active { transform: scale(0.97); }
.gauge-wrap {
  width: 72px; height: 72px;
  position: relative;
  margin-bottom: 10px;
}
.gauge-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.gauge-track { fill: none; stroke: rgba(255,255,255,0.04); stroke-width: 5; }
.gauge-bar {
  fill: none;
  stroke: rgba(255,255,255,0.08);
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1), stroke 0.5s;
}
.gauge-card.good .gauge-bar { stroke: var(--accent); filter: drop-shadow(0 0 6px rgba(52,211,153,0.4)); }
.gauge-card.warn .gauge-bar { stroke: var(--accent2); filter: drop-shadow(0 0 6px rgba(251,191,36,0.4)); }
.gauge-card.bad .gauge-bar { stroke: var(--danger); filter: drop-shadow(0 0 6px rgba(248,113,113,0.4)); }
.gauge-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.gauge-pct {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: -0.02em;
  transition: color 0.3s;
}
.gauge-card.good .gauge-pct { color: var(--accent); }
.gauge-card.warn .gauge-pct { color: var(--accent2); }
.gauge-card.bad .gauge-pct { color: var(--danger); }
.gauge-name { font-size: 0.78rem; font-weight: 600; color: var(--ink2); }
.gauge-name .icon { margin-right: 4px; }
.gauge-val { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

/* ===== SUGGESTIONS ===== */
.sug-card {
  padding: 18px;
  margin-bottom: 10px;
  animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  overflow: hidden;
}
.sug-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  border-radius: 3px;
}
.sug-card.t-red::before { background: var(--danger); }
.sug-card.t-yellow::before { background: var(--accent2); }
.sug-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sug-badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
}
.sug-badge.red { background: var(--danger-dim); color: var(--danger); }
.sug-badge.yellow { background: var(--accent2-dim); color: var(--accent2); }
.sug-title { font-weight: 600; font-size: 0.88rem; color: var(--ink); }
.sug-body {
  font-size: 0.84rem;
  color: var(--muted);
  line-height: 1.7;
  padding-left: 2px;
}
.sug-body strong { color: var(--ink2); font-weight: 600; }
.sug-food-chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 8px;
  background: var(--accent-dim);
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 600;
  margin-top: 8px;
  margin-right: 6px;
}

/* ===== MEALS ===== */
.meal-section {
  margin-bottom: 10px;
  overflow: hidden;
}
.meal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  transition: background 0.2s;
}
.meal-head:hover { background: rgba(255,255,255,0.02); }
.meal-info { display: flex; align-items: center; gap: 12px; }
.meal-icon {
  width: 38px; height: 38px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.meal-icon.breakfast { background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(251,191,36,0.05)); }
.meal-icon.lunch { background: linear-gradient(135deg, rgba(52,211,153,0.15), rgba(52,211,153,0.05)); }
.meal-icon.dinner { background: linear-gradient(135deg, rgba(96,165,250,0.15), rgba(96,165,250,0.05)); }
.meal-icon.snack { background: linear-gradient(135deg, rgba(244,114,182,0.15), rgba(244,114,182,0.05)); }
.meal-name { font-weight: 600; font-size: 0.92rem; }
.meal-time { font-size: 0.72rem; color: var(--muted); font-weight: 400; }
.meal-kcal { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.meal-kcal span { color: var(--ink2); font-weight: 700; }
.btn-add {
  width: 30px; height: 30px;
  border: 1.5px dashed rgba(255,255,255,0.12);
  border-radius: 8px;
  background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  font-size: 15px;
  transition: all 0.2s;
}
.btn-add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

.meal-items { padding: 0 18px 14px; }
.food-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
  animation: fadeIn 0.3s ease;
}
.food-row:last-child { border-bottom: none; }
.food-info { flex: 1; }
.food-name { font-size: 0.85rem; font-weight: 600; color: var(--ink); }
.food-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; }
.food-del {
  width: 28px; height: 28px;
  border: none;
  background: none;
  cursor: pointer;
  color: rgba(255,255,255,0.15);
  font-size: 14px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.food-del:hover { background: var(--danger-dim); color: var(--danger); }

.meal-bar {
  padding: 10px 18px;
  background: rgba(255,255,255,0.02);
  display: flex;
  gap: 16px;
  font-size: 0.74rem;
  color: var(--muted);
  border-top: 1px solid var(--rule);
}
.meal-bar span { color: var(--ink2); font-weight: 600; }

.empty-hint {
  padding: 12px 18px 18px;
  text-align: center;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.15);
}

/* ===== TABS ===== */
.tab-bar {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--bg2);
  border-radius: 12px;
  margin-bottom: 14px;
}
.tab-btn {
  flex: 1;
  padding: 8px 0;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: #7B7B92;
  font-size: 0.78rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.25s;
}
.tab-btn.active {
  background: var(--bg3);
  color: var(--ink);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* ===== WEEK CHART ===== */
.week-chart {
  padding: 20px;
}
.week-bars {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  height: 120px;
  gap: 6px;
  margin-top: 16px;
}
.week-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  height: 100%;
  justify-content: flex-end;
}
.week-bar-wrap {
  width: 100%;
  max-width: 36px;
  height: 90px;
  display: flex;
  align-items: flex-end;
}
.week-bar {
  width: 100%;
  border-radius: 6px 6px 4px 4px;
  background: var(--bg3);
  min-height: 4px;
  transition: height 0.8s cubic-bezier(0.16,1,0.3,1), background 0.3s;
  position: relative;
}
.week-bar.active { background: linear-gradient(180deg, var(--accent), rgba(52,211,153,0.4)); }
.week-bar.over { background: linear-gradient(180deg, var(--accent2), rgba(251,191,36,0.4)); }
.week-bar.under { background: linear-gradient(180deg, var(--danger), rgba(248,113,113,0.4)); }
.week-day { font-size: 0.68rem; color: var(--muted); font-weight: 500; }
.week-day.today { color: var(--accent); font-weight: 700; }
.week-val { font-size: 0.65rem; color: var(--muted); font-weight: 600; }

/* ===== MODALS ===== */
.modal-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-bg.open { display: flex; }
.modal-sheet {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-bottom: none;
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  animation: sheetUp 0.35s cubic-bezier(0.16,1,0.3,1);
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
  width: 36px; height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  margin: 10px auto 0;
}
.modal-top {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--rule);
}
.modal-top h3 { font-size: 1rem; font-weight: 700; flex: 1; }
.search-wrap {
  flex: 1;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 11px 14px 11px 38px;
  border: 1.5px solid var(--rule);
  border-radius: 12px;
  background: var(--bg3);
  color: var(--ink);
  font-size: 0.9rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.search-wrap .s-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 14px;
}
.btn-close {
  width: 34px; height: 34px;
  border: 1px solid var(--rule);
  background: var(--bg3);
  border-radius: 10px;
  cursor: pointer;
  color: var(--ink2);
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.btn-close:hover { background: var(--danger-dim); color: var(--danger); border-color: transparent; }

/* Food list */
.food-scroll { flex: 1; overflow-y: auto; padding: 6px 8px; }
.food-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}
.food-item:hover { background: rgba(255,255,255,0.03); }
.food-item:active { background: rgba(255,255,255,0.06); }
.food-item-left { flex: 1; }
.food-item-name { font-weight: 600; font-size: 0.88rem; color: var(--ink); }
.food-item-desc { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.food-item-right { text-align: right; }
.food-item-kcal { font-size: 0.82rem; color: var(--accent); font-weight: 700; }
.food-item-unit { font-size: 0.68rem; color: var(--muted); }
.search-empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.search-empty .big { font-size: 2.5rem; margin-bottom: 8px; opacity: 0.3; }

/* Category tabs */
.cat-tabs {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.cat-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.cat-tab:hover:not(.active) { border-color: rgba(255,255,255,0.12); color: var(--ink2); }

/* Amount sheet */
.amount-body { padding: 24px 20px; }
.amount-body h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.amount-body .food-info { font-size: 0.84rem; color: var(--muted); margin-bottom: 18px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.preset {
  padding: 8px 16px;
  border: 1px solid var(--rule);
  border-radius: 20px;
  background: transparent;
  color: var(--ink2);
  font-size: 0.84rem;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.preset:hover, .preset.on { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
.amount-row {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  align-items: center;
}
.amount-row input {
  flex: 1;
  padding: 12px 14px;
  border: 1.5px solid var(--rule);
  border-radius: 12px;
  background: var(--bg3);
  color: var(--ink);
  font-size: 1.1rem;
  font-family: inherit;
  font-weight: 700;
  outline: none;
  text-align: center;
  transition: border-color 0.2s;
}
.amount-row input:focus { border-color: var(--accent); }
.amount-row .unit { font-size: 0.88rem; color: var(--muted); white-space: nowrap; }
.btn-ok {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #34D399, #059669);
  color: #fff;
  font-size: 0.95rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(52,211,153,0.3);
  transition: all 0.2s;
}
.btn-ok:hover { box-shadow: 0 6px 28px rgba(52,211,153,0.4); transform: translateY(-1px); }
.btn-ok:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

/* ===== FAB ===== */
.fab {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 90;
  border: none;
  border-radius: 18px;
  padding: 16px 36px;
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  background: linear-gradient(135deg, #34D399, #059669);
  box-shadow: 0 6px 30px rgba(52,211,153,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
  transition: all 0.25s;
  letter-spacing: 0.01em;
}
.fab:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 10px 40px rgba(52,211,153,0.45); }
.fab:active { transform: translateX(-50%) translateY(0); }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--bg3);
  border: 1px solid var(--rule);
  color: var(--ink);
  padding: 10px 22px;
  border-radius: 14px;
  font-size: 0.84rem;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
  z-index: 300;
  pointer-events: none;
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== ANIMATIONS ===== */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== ALL GOOD ===== */
.all-good {
  text-align: center;
  padding: 28px 20px;
}
.all-good .big { font-size: 3rem; margin-bottom: 8px; }
.all-good .t1 { font-weight: 700; font-size: 1.05rem; color: var(--accent); }
.all-good .t2 { font-size: 0.84rem; color: var(--muted); margin-top: 4px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 380px) {
  .stats-row { gap: 6px; }
  .stat-num { font-size: 1.3rem; }
  .gauge-wrap { width: 64px; height: 64px; }
}
</style>
</head>

function getTotal() {
  const t = {}; KEYS.forEach(k => t[k]=0);
  Object.values(meals).flat().forEach(i => KEYS.forEach(k => t[k] += i[k]||0));
  return t;
}
function allFoods() { return Object.values(meals).flat(); }

// ========== AI SUMMARY ==========
function renderAI() {
  const t = getTotal();
  const foods = allFoods();
  const el = document.getElementById('aiSummary');
  if (foods.length === 0) {
    el.innerHTML = `<div class="ai-tag"><span class="dot"></span> AI 营养助手</div>
      <div class="ai-text">点击下方 <strong>「+ 记录食物」</strong> 开始记录今天的饮食，我会实时分析你的营养状况并给出补齐建议。</div>`;
    return;
  }
  let lines = [];
  const score = KEYS.filter(k => t[k] >= DRV[k].target*0.8).length;
  const kcalPct = Math.round(t.kcal/DRV.kcal.target*100);
  if (kcalPct > 120) lines.push(`今天热量摄入 <span class="hl-yellow">${kcalPct}%</span>，稍微有点超标了`);
  else if (kcalPct > 80) lines.push(`热量摄入 <span class="hl-green">${kcalPct}%</span>，控制得不错`);
  else lines.push(`热量仅摄入 <span class="hl-red">${kcalPct}%</span>，还需要多吃一点`);

  const lowKeys = KEYS.filter(k => k!=='kcal' && t[k] < DRV[k].target*0.5);
  const midKeys = KEYS.filter(k => k!=='kcal' && t[k] >= DRV[k].target*0.5 && t[k] < DRV[k].target*0.8);
  const goodKeys = KEYS.filter(k => k!=='kcal' && t[k] >= DRV[k].target*0.8);

  if (lowKeys.length > 0) {
    lines.push(`<span class="hl-red">${DRV[lowKeys[0]].icon} ${DRV[lowKeys[0]].name}严重不足</span>（仅 ${fmtN(t[lowKeys[0]])}${DRV[lowKeys[0]].unit}），建议尽快补充`);
  }
  if (midKeys.length > 0) {
    const names = midKeys.slice(0,2).map(k => DRV[k].icon+DRV[k].name).join('、');
    lines.push(`${names} 接近达标，<span class="hl-yellow">再加把劲</span>`);
  }
  if (goodKeys.length >= 3) {
    lines.push(`${DRV[goodKeys[0]].icon}${DRV[goodKeys[0]].name}、${DRV[goodKeys[1]].icon}${DRV[goodKeys[1]].name} 等 <span class="hl-green">${goodKeys.length} 项已达标</span> 👏`);
  }
  el.innerHTML = `<div class="ai-tag"><span class="dot"></span> AI 营养分析</div>
    <div class="ai-text">${lines.join('。')}。</div>`;
}

function fmtN(v) { return v >= 10 ? Math.round(v) : v.toFixed(1); }

// ========== STATS ==========
function renderStats() {
  const t = getTotal();
  const foods = allFoods();
  const kcalEl = document.getElementById('sKcal');
  kcalEl.textContent = Math.round(t.kcal);
  kcalEl.className = 'stat-num' + (t.kcal > 2500 ? ' red' : t.kcal > 2000 ? ' yellow' : ' green');
  document.getElementById('sCount').textContent = foods.length;
  let score = 0;
  KEYS.forEach(k => { if (t[k] >= DRV[k].target*0.8) score++; });
  const sEl = document.getElementById('sScore');
  sEl.textContent = `${score}/8`;
  sEl.className = 'stat-num' + (score >= 6 ? ' green' : score >= 4 ? ' yellow' : foods.length ? ' red' : '');
}

// ========== GAUGES ==========
function renderGauges() {
  const t = getTotal();
  const foods = allFoods();
  const C = 2*Math.PI*30;
  let h = '';
  KEYS.forEach(k => {
    const pct = Math.min(t[k]/DRV[k].target, 1.5);
    const dp = Math.round(pct*100);
    const off = C*(1-Math.min(pct,1));
    let st = '';
    if (foods.length > 0) st = pct >= 0.8 ? 'good' : pct >= 0.5 ? 'warn' : 'bad';
    h += `<div class="gauge-card glass ${st}">
      <div class="gauge-wrap">
        <svg viewBox="0 0 68 68"><circle class="gauge-track" cx="34" cy="34" r="30"/>
        <circle class="gauge-bar" cx="34" cy="34" r="30" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
        <div class="gauge-center"><span class="gauge-pct">${dp}%</span></div>
      </div>
      <div class="gauge-name"><span class="icon">${DRV[k].icon}</span>${DRV[k].name}</div>
      <div class="gauge-val">${fmtN(t[k])} / ${DRV[k].target}${DRV[k].unit}</div>
    </div>`;
  });
  document.getElementById('gaugeGrid').innerHTML = h;
}

// ========== SUGGESTIONS ==========
function renderSugs() {
  const t = getTotal();
  const foods = allFoods();
  const el = document.getElementById('sugList');
  if (!foods.length) {
    el.innerHTML = `<div class="all-good glass">
      <div class="big">🍽️</div><div class="t1">还没记录今天的饮食</div>
      <div class="t2">添加食物后，我会告诉你缺什么、怎么补</div></div>`;
    return;
  }
  let h = '', any = false;
  ['vc','ca','fe','fiber','protein'].forEach(k => {
    const p = t[k]/DRV[k].target;
    if (p >= 0.8 || !SUGS[k]) return;
    any = true;
    const deficit = DRV[k].target - t[k];
    let best = SUGS[k][0];
    for (const s of SUGS[k]) { if (parseFloat(s.n) >= deficit*0.5) { best = s; break; } }
    const lv = p < 0.3 ? 'red' : 'yellow';
    const lb = p < 0.3 ? '严重不足' : '还差一点';
    h += `<div class="sug-card glass t-${lv}">
      <div class="sug-head"><span class="sug-badge ${lv}">${lb}</span>
      <span class="sug-title">${DRV[k].name}还差约 ${fmtN(deficit)}${DRV[k].unit}</span></div>
      <div class="sug-body">当前摄入 <strong>${fmtN(t[k])}${DRV[k].unit}</strong>，推荐 <strong>${DRV[k].target}${DRV[k].unit}</strong>。
      吃 <strong>${best.food}</strong>（${best.a}，含${best.n} ${DRV[k].unit}）即可大幅改善。</div>
      <span class="sug-food-chip">推荐: ${best.food}</span>
    </div>`;
  });
  if (!any) {
    h = `<div class="all-good glass"><div class="big">🎉</div>
      <div class="t1">今天的营养很均衡</div>
      <div class="t2">所有营养素都达到了推荐量的 80% 以上</div></div>`;
  }
  el.innerHTML = h;
}

// ========== WEEK CHART ==========
function renderWeek() {
  const el = document.getElementById('weekBars');
  const todayDow = new Date().getDay() || 7; // 1=Mon ... 7=Sun
  const dayNames = ['一','二','三','四','五','六','日'];
  let h = '';
  for (let i = 1; i <= 7; i++) {
    const d = new Date(); d.setDate(d.getDate() - (todayDow - i));
    const key = 'jbs_' + d.toISOString().slice(0,10);
    const data = localStorage.getItem(key);
    let kcal = 0;
    if (data) try { const m = JSON.parse(data); Object.values(m).flat().forEach(f => kcal += f.kcal||0); } catch(e) {}
    const pct = Math.min(kcal / 2000, 1.3);
    const height = Math.max(pct * 90, 4);
    const cls = i === todayDow ? 'today' : '';
    const barCls = kcal === 0 ? '' : kcal > 2200 ? 'over' : kcal >= 1600 ? 'active' : 'under';
    h += `<div class="week-col">
      <div class="week-val">${kcal > 0 ? Math.round(kcal) : ''}</div>
      <div class="week-bar-wrap"><div class="week-bar ${barCls}" style="height:${height}px"></div></div>
      <div class="week-day ${cls}">${dayNames[i-1]}</div>
    </div>`;
  }
  el.innerHTML = h;
}

// ========== TABS ==========
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tabDashboard').style.display = tab === 'dashboard' ? '' : 'none';
  document.getElementById('tabWeek').style.display = tab === 'week' ? '' : 'none';
}

// ========== MEALS ==========
function renderMeals() {
  let h = '';
  Object.keys(MEAL_CFG).forEach(mk => {
    const cfg = MEAL_CFG[mk];
    const items = meals[mk] || [];
    const mKcal = items.reduce((a,i) => a + (i.kcal||0), 0);
    const mP = items.reduce((a,i) => a + (i.protein||0), 0);
    h += `<div class="meal-section glass">
      <div class="meal-head" onclick="openSearch('${mk}')">
        <div class="meal-info">
          <div class="meal-icon ${cfg.cls}">${cfg.icon}</div>
          <div><div class="meal-name">${cfg.name}</div><div class="meal-time">${cfg.time}</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          ${items.length ? `<div class="meal-kcal"><span>${Math.round(mKcal)}</span> kcal</div>` : ''}
          <button class="btn-add" onclick="event.stopPropagation();openSearch('${mk}')">+</button>
        </div>
      </div>`;
    if (items.length) {
      h += '<div class="meal-items">';
      items.forEach((it,idx) => {
        h += `<div class="food-row"><div class="food-info">
          <div class="food-name">${it.name} ×${it.servings}</div>
          <div class="food-meta"><span>${Math.round(it.kcal)}kcal</span><span>蛋白${it.protein.toFixed(1)}g</span></div>
        </div><button class="food-del" onclick="delFood('${mk}',${idx})">✕</button></div>`;
      });
      h += `</div><div class="meal-bar">小计 <span>${Math.round(mKcal)}kcal</span> · 蛋白质 <span>${mP.toFixed(1)}g</span></div>`;
    } else {
      h += '<div class="empty-hint">点击 + 添加食物</div>';
    }
    h += '</div>';
  });
  document.getElementById('mealsBox').innerHTML = h;
}

// ========== SEARCH ==========
function renderCats() {
  let h = '';
  CATS.forEach(c => {
    h += `<button class="cat-tab${c==='全部'?' active':''}" onclick="filterCat('${c}',this)">${c}</button>`;
  });
  document.getElementById('catTabs').innerHTML = h;
}

function filterCat(cat, btn) {
  curCat = cat;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  onSearch();
}

function openSearch(mk) {
  curMeal = mk;
  document.getElementById('searchInput').value = '';
  document.getElementById('mSearch').classList.add('open');
  setTimeout(() => document.getElementById('searchInput').focus(), 100);
  curCat = '全部';
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('active', b.textContent==='全部'));
  listFoods(FOODS);
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function onSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = FOODS;
  if (curCat !== '全部') list = list.filter(f => f.cat === curCat);
  if (q) list = list.filter(f => f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q));
  listFoods(list);
}

function listFoods(list) {
  const el = document.getElementById('foodScroll');
  if (!list.length) {
    el.innerHTML = '<div class="search-empty"><div class="big">🤔</div><div>没有找到这个食物</div><div style="font-size:0.75rem;margin-top:4px">试试其他关键词或分类</div></div>';
    return;
  }
  // Sort: match current meal first, then by frequency
  const ml = {breakfast:'B',lunch:'L',dinner:'D',snack:'S'};
  const ck = ml[curMeal] || '';
  const sorted = [...list].sort((a,b) => {
    const am = (a.m||'').includes(ck) ? 0 : 1;
    const bm = (b.m||'').includes(ck) ? 0 : 1;
    if (am !== bm) return am - bm;
    return (a.f||9) - (b.f||9);
  });
  let h = '';
  sorted.forEach(f => {
    const idx = FOODS.indexOf(f);
    const isMatch = (f.m||'').includes(ck);
    const badge = isMatch ? '<span style="display:inline-block;padding:1px 6px;border-radius:4px;background:var(--accent-dim);color:var(--accent);font-size:0.65rem;font-weight:700;margin-left:6px">常吃</span>' : '';
    h += `<div class="food-item" onclick="pickFood(${idx})">
      <div class="food-item-left"><div class="food-item-name">${f.name}${badge}</div>
      <div class="food-item-desc">${f.cat} · ${f.unit}</div></div>
      <div class="food-item-right"><div class="food-item-kcal">${f.kcal}kcal</div>
      <div class="food-item-unit">${f.unit.match(/\((.+)\)/)?.[1]||''}</div></div>
    </div>`;
  });
  el.innerHTML = h;
}

// ========== AMOUNT ==========
function pickFood(idx) {
  selFood = idx;
  const f = FOODS[idx];
  document.getElementById('mSearch').classList.remove('open');
  document.getElementById('amtInfo').textContent = `${f.name}（${f.unit}）— ${f.kcal}kcal`;
  document.getElementById('amtUnit').textContent = f.unit.match(/\((.+)\)/)?.[1] || '份';
  const pd = document.getElementById('amtPresets');
  pd.innerHTML = '';
  (f.presets||[]).forEach(p => {
    const b = document.createElement('button');
    b.className = 'preset' + (p.v===1?' on':'');
    b.textContent = p.l;
    b.onclick = () => {
      document.getElementById('amtInput').value = p.v;
      pd.querySelectorAll('.preset').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      updateOk();
    };
    pd.appendChild(b);
  });
  document.getElementById('amtInput').value = 1;
  updateOk();
  document.getElementById('mAmount').classList.add('open');
}

function updateOk() {
  document.getElementById('btnOk').disabled = !(parseFloat(document.getElementById('amtInput').value) > 0);
}

function confirmAdd() {
  const v = parseFloat(document.getElementById('amtInput').value);
  if (!v || v <= 0 || selFood === null) return;
  const f = FOODS[selFood];
  const item = {name:f.name, servings:v};
  KEYS.forEach(k => item[k] = (f[k]||0)*v);
  meals[curMeal].push(item);
  save();
  renderAll();
  closeModal('mAmount');
  toast(`已添加 ${f.name} ×${v}`);
}

function delFood(mk, idx) {
  const n = meals[mk][idx].name;
  meals[mk].splice(idx,1);
  save(); renderAll();
  toast(`已移除 ${n}`);
}

function clearAll() {
  if (!allFoods().length) { toast('今天还没有记录'); return; }
  if (!confirm('确定清空今天所有饮食记录？')) return;
  meals = {breakfast:[],lunch:[],dinner:[],snack:[]};
  save(); renderAll(); toast('已清空');
}

// ========== SMART ADD ==========
function smartAdd() {
  const h = new Date().getHours();
  let mk = h<10?'breakfast':h<14?'lunch':h<20?'dinner':'snack';
  openSearch(mk);
}

// ========== TOAST ==========
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ========== GO ==========
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
