<!DOCTYPE html>
<html lang="zh-CN" data-theme="glass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诸葛云 AI 助手 - ESP32 端 UI 演示</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script>
  // 同步初始化主题，避免闪烁
  // 清除所有旧的 localStorage 主题 key（统一使用 zhugeyun-theme）
  (function() {
    var keys = ['zhuge-theme', 'zhuge-watch-theme', 'esp32-theme'];
    for (var i = 0; i < keys.length; i++) {
      try { localStorage.removeItem(keys[i]); } catch(e) {}
    }
    var saved = null;
    try { saved = localStorage.getItem('zhugeyun-theme'); } catch(e) {}
    if (!saved || (saved !== 'glass' && saved !== 'fresh' && saved !== 'cyber')) {
      saved = 'glass';
      try { localStorage.setItem('zhugeyun-theme', 'glass'); } catch(e) {}
    }
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
/* ============================================================
   全局重置
   ============================================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Noto Sans SC', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #0d0d12;
  /* PCB 纹理背景 */
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,212,170,0.03) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,160,255,0.03) 0%, transparent 50%),
    linear-gradient(90deg, transparent 49.5%, rgba(0,212,170,0.04) 49.5%, rgba(0,212,170,0.04) 50.5%, transparent 50.5%),
    linear-gradient(0deg, transparent 49.5%, rgba(0,212,170,0.04) 49.5%, rgba(0,212,170,0.04) 50.5%, transparent 50.5%);
  background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
  overflow: hidden;
}

/* ============================================================
   三套主题 CSS 变量
   ============================================================ */

/* 玻璃拟态风（默认）—— 深色渐变 + 毛玻璃 + 紫蓝渐变强调色 */
[data-theme="glass"] {
  --bg-page: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
  --bg-screen: #12121e;
  --bg-header: linear-gradient(135deg, rgba(102,126,234,0.35), rgba(118,75,162,0.35));
  --bg-chat: #14142a;
  --bg-voice: linear-gradient(135deg, #667eea, #764ba2);
  --bg-voice-recording: linear-gradient(135deg, #f093fb, #764ba2);
  --bg-statusbar: rgba(0,0,0,0.4);
  --bg-themepicker: rgba(0,0,0,0.85);
  --border-frame: #2a2a3e;
  --border-header: rgba(255,255,255,0.08);
  --border-voice: rgba(102,126,234,0.5);
  --text-primary: #f0f0f5;
  --text-secondary: rgba(255,255,255,0.6);
  --text-muted: rgba(255,255,255,0.35);
  --text-status: rgba(255,255,255,0.5);
  --text-voice: #ffffff;
  --accent-start: #667eea;
  --accent-end: #764ba2;
  --accent-mid: #f093fb;
  --bubble-ai-bg: rgba(255,255,255,0.08);
  --bubble-ai-border: rgba(255,255,255,0.06);
  --bubble-ai-text: #e0e0ec;
  --bubble-ai-prefix: #667eea;
  --bubble-user-bg: linear-gradient(135deg, #667eea, #764ba2);
  --bubble-user-border: transparent;
  --bubble-user-text: #ffffff;
  --bubble-user-prefix: #f093fb;
  --status-online: #4ade80;
  --theme-a: #667eea;
  --theme-b: #5b9bd5;
  --theme-c: #00d4aa;
  --shadow-screen: 0 0 40px rgba(102,126,234,0.15), 0 0 80px rgba(118,75,162,0.08);
}

/* 清新科技风 —— 浅色背景 + 蓝绿渐变 */
[data-theme="fresh"] {
  --bg-page: linear-gradient(160deg, #e8f0f8 0%, #e0eee8 40%, #d5e8f0 100%);
  --bg-screen: #f5f7fa;
  --bg-header: linear-gradient(135deg, rgba(91,155,213,0.2), rgba(109,191,123,0.2));
  --bg-chat: #f0f4f8;
  --bg-voice: linear-gradient(135deg, #5b9bd5, #6dbf7b);
  --bg-voice-recording: linear-gradient(135deg, #6dbf7b, #4ade80);
  --bg-statusbar: rgba(0,0,0,0.06);
  --bg-themepicker: rgba(255,255,255,0.95);
  --border-frame: #b8c4d0;
  --border-header: rgba(0,0,0,0.06);
  --border-voice: rgba(91,155,213,0.4);
  --text-primary: #1f2937;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --text-status: #6b7280;
  --text-voice: #ffffff;
  --accent-start: #5b9bd5;
  --accent-end: #6dbf7b;
  --accent-mid: #4ade80;
  --bubble-ai-bg: #ffffff;
  --bubble-ai-border: #e5e7eb;
  --bubble-ai-text: #374151;
  --bubble-ai-prefix: #5b9bd5;
  --bubble-user-bg: linear-gradient(135deg, #5b9bd5, #6dbf7b);
  --bubble-user-border: transparent;
  --bubble-user-text: #ffffff;
  --bubble-user-prefix: #6dbf7b;
  --status-online: #34d399;
  --theme-a: #667eea;
  --theme-b: #5b9bd5;
  --theme-c: #00d4aa;
  --shadow-screen: 0 0 40px rgba(91,155,213,0.12), 0 0 80px rgba(109,191,123,0.06);
}

/* 赛博朋克风 —— 纯黑背景 + 青蓝强调色 */
[data-theme="cyber"] {
  --bg-page: linear-gradient(160deg, #0a0a0f 0%, #0d0d18 40%, #0a0a14 100%);
  --bg-screen: #0a0a0f;
  --bg-header: linear-gradient(135deg, rgba(0,212,170,0.25), rgba(0,160,255,0.25));
  --bg-chat: #0a0a0f;
  --bg-voice: linear-gradient(135deg, #00d4aa, #00a0ff);
  --bg-voice-recording: linear-gradient(135deg, #00a0ff, #00d4aa);
  --bg-statusbar: rgba(0,0,0,0.5);
  --bg-themepicker: rgba(0,0,0,0.9);
  --border-frame: #1a1a2a;
  --border-header: rgba(0,212,170,0.15);
  --border-voice: rgba(0,212,170,0.5);
  --text-primary: #e8f0f0;
  --text-secondary: rgba(200,230,230,0.6);
  --text-muted: rgba(200,230,230,0.3);
  --text-status: rgba(0,212,170,0.6);
  --text-voice: #0a0a0f;
  --accent-start: #00d4aa;
  --accent-end: #00a0ff;
  --accent-mid: #00e8c0;
  --bubble-ai-bg: rgba(0,212,170,0.06);
  --bubble-ai-border: rgba(0,212,170,0.12);
  --bubble-ai-text: #c8e8e0;
  --bubble-ai-prefix: #00d4aa;
  --bubble-user-bg: linear-gradient(135deg, #00d4aa, #00a0ff);
  --bubble-user-border: transparent;
  --bubble-user-text: #0a0a0f;
  --bubble-user-prefix: #00a0ff;
  --status-online: #00d4aa;
  --theme-a: #667eea;
  --theme-b: #5b9bd5;
  --theme-c: #00d4aa;
  --shadow-screen: 0 0 40px rgba(0,212,170,0.1), 0 0 80px rgba(0,160,255,0.06);
}

/* ============================================================
   ESP32 外壳框架
   ============================================================ */
.esp32-shell {
  position: relative;
  /* 模拟 PCB 板尺寸 */
  padding: 24px;
  background: #1c1c28;
  border-radius: 16px;
  border: 2px solid #2e2e42;
  box-shadow:
    0 4px 30px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

/* PCB 纹理 */
.esp32-shell::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background-image:
    radial-gradient(circle, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 8px 8px;
  pointer-events: none;
}

/* 芯片标识 */
.esp32-chip-label {
  position: absolute;
  bottom: 6px;
  right: 12px;
  font-size: 8px;
  color: rgba(255,255,255,0.2);
  font-weight: 500;
  letter-spacing: 0.5px;
  font-family: 'Courier New', monospace;
}

/* PCB 元件装饰 */
.esp32-component {
  position: absolute;
  border-radius: 2px;
  pointer-events: none;
}

.esp32-component.usb {
  left: 50%;
  transform: translateX(-50%);
  bottom: -4px;
  width: 30px;
  height: 8px;
  background: #8a8a9a;
  border-radius: 0 0 3px 3px;
}

.esp32-component.led-power {
  top: 8px;
  left: 10px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 4px #4ade80;
}

.esp32-component.led-status {
  top: 8px;
  left: 20px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #f59e0b;
  box-shadow: 0 0 4px #f59e0b;
  animation: blink-led 2s ease-in-out infinite;
}

@keyframes blink-led {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ============================================================
   ESP32 屏幕（320x240 显示区域）
   ============================================================ */
.esp32-screen {
  width: 320px;
  height: 240px;
  border-radius: 8px;
  border: 1px solid var(--border-frame);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg-screen);
  box-shadow: var(--shadow-screen);
  position: relative;
  transition: all 0.4s ease;
  font-size: 12px;
}

/* ============================================================
   顶栏
   ============================================================ */
.esp32-header {
  flex-shrink: 0;
  height: 32px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border-header);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: relative;
  z-index: 10;
}

.esp32-header .title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.esp32-header .status {
  font-size: 9px;
  color: var(--status-online);
  display: flex;
  align-items: center;
  gap: 3px;
}

.esp32-header .status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--status-online);
  box-shadow: 0 0 4px var(--status-online);
}

/* ============================================================
   主题选择弹窗
   ============================================================ */
.theme-picker {
  position: absolute;
  top: 32px;
  left: 0;
  right: 0;
  height: 36px;
  background: var(--bg-themepicker);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 0 16px;
  z-index: 20;
  opacity: 0;
  transform: translateY(-4px);
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  border-bottom: 1px solid var(--border-header);
}

.theme-picker.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.theme-picker .theme-label {
  font-size: 8px;
  color: var(--text-secondary);
  margin-right: 4px;
}

.theme-picker .theme-btn {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.15s ease;
}

.theme-picker .theme-btn:hover {
  transform: scale(1.15);
}

.theme-picker .theme-btn.active {
  border-color: var(--text-primary);
}

.theme-picker .theme-btn.t-glass {
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.theme-picker .theme-btn.t-fresh {
  background: linear-gradient(135deg, #5b9bd5, #6dbf7b);
}

.theme-picker .theme-btn.t-cyber {
  background: linear-gradient(135deg, #00d4aa, #00a0ff);
}

/* ============================================================
   聊天区域
   ============================================================ */
.esp32-chat {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: var(--bg-chat);
  /* 隐藏滚动条 */
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.esp32-chat::-webkit-scrollbar {
  display: none;
}

/* ============================================================
   消息气泡
   ============================================================ */
.msg {
  display: flex;
  flex-direction: column;
  max-width: 88%;
  animation: fadeInUp 0.3s ease;
}

.msg.ai {
  align-self: flex-start;
}

.msg.user {
  align-self: flex-end;
}

.msg .prefix {
  font-size: 8px;
  font-weight: 700;
  margin-bottom: 1px;
  padding: 0 2px;
}

.msg.ai .prefix {
  color: var(--bubble-ai-prefix);
  text-align: left;
}

.msg.user .prefix {
  color: var(--bubble-user-prefix);
  text-align: right;
}

.msg .bubble {
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 11px;
  line-height: 1.4;
  word-break: break-all;
}

.msg.ai .bubble {
  background: var(--bubble-ai-bg);
  border: 1px solid var(--bubble-ai-border);
  color: var(--bubble-ai-text);
  border-top-left-radius: 2px;
}

.msg.user .bubble {
  background: var(--bubble-user-bg);
  color: var(--bubble-user-text);
  border-top-right-radius: 2px;
}

/* 流式打字光标 */
.msg .bubble .cursor-blink {
  display: inline-block;
  width: 1px;
  height: 10px;
  background: var(--accent-start);
  margin-left: 1px;
  vertical-align: text-bottom;
  animation: cursorBlink 0.6s step-end infinite;
}

@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ============================================================
   语音按钮区域
   ============================================================ */
.esp32-voice {
  flex-shrink: 0;
  padding: 4px 6px;
  border-top: 1px solid var(--border-header);
}

.voice-btn {
  width: 100%;
  height: 28px;
  border: 1px solid var(--border-voice);
  border-radius: 6px;
  background: var(--bg-voice);
  color: var(--text-voice);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 10px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.voice-btn:hover {
  filter: brightness(1.1);
}

.voice-btn.recording {
  background: var(--bg-voice-recording);
  animation: voicePulse 1s ease-in-out infinite;
}

/* 录音动画 —— 边框光效 */
.voice-btn.recording::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: linear-gradient(90deg, var(--accent-start), var(--accent-mid), var(--accent-end), var(--accent-mid), var(--accent-start)) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: borderRotate 2s linear infinite;
}

@keyframes voicePulse {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.25); }
}

@keyframes borderRotate {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.voice-btn .mic-icon {
  font-size: 10px;
}

.voice-btn .voice-text {
  font-size: 10px;
}

/* ============================================================
   状态栏
   ============================================================ */
.esp32-statusbar {
  flex-shrink: 0;
  height: 16px;
  background: var(--bg-statusbar);
  border-top: 1px solid var(--border-header);
  display: flex;
  align-items: center;
  padding: 0 6px;
  font-size: 9px;
  color: var(--text-status);
}

.esp32-statusbar .status-item {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.esp32-statusbar .status-item:nth-child(2) {
  justify-content: center;
}

.esp32-statusbar .status-item:nth-child(3) {
  justify-content: flex-end;
}

.esp32-statusbar .status-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  flex-shrink: 0;
}

.esp32-statusbar .status-dot.green {
  background: var(--status-online);
  box-shadow: 0 0 3px var(--status-online);
}

/* ============================================================
   动画
   ============================================================ */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ============================================================
   页面标题
   ============================================================ */
.page-title {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  font-weight: 300;
  color: rgba(255,255,255,0.25);
  letter-spacing: 2px;
  white-space: nowrap;
  user-select: none;
}

/* ============================================================
   主题切换全局过渡
   ============================================================ */
.esp32-screen,
.esp32-header,
.esp32-chat,
.esp32-voice,
.esp32-statusbar,
.msg .bubble,
.voice-btn {
  transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
}

/* ============================================================
   响应式 —— 小屏缩放
   ============================================================ */
@media (max-height: 400px) {
  .esp32-shell {
    transform: scale(0.85);
    transform-origin: center;
  }
}

@media (max-width: 400px) {
  .esp32-shell {
    transform: scale(0.9);
    transform-origin: center;
  }
}
</style>
</head>
<body>

<!-- 页面标题 -->
<div class="page-title">ESP32-S3 &middot; OLED UI Preview</div>

<!-- ESP32 外壳 -->
<div class="esp32-shell">
  <!-- PCB 元件装饰 -->
  <div class="esp32-component led-power"></div>
  <div class="esp32-component led-status"></div>
  <div class="esp32-component usb"></div>
  <div class="esp32-chip-label">ESP32-S3-WROOM-1</div>

  <!-- ESP32 屏幕 -->
  <div class="esp32-screen" id="screen">

    <!-- 顶栏 -->
    <div class="esp32-header" id="header">
      <span class="title">诸葛云</span>
      <span class="status">
        <span class="status-dot"></span>
        在线
      </span>

      <!-- 主题选择弹窗 -->
      <div class="theme-picker" id="themePicker">
        <span class="theme-label">主题</span>
        <div class="theme-btn t-glass active" data-theme="glass" title="玻璃拟态"></div>
        <div class="theme-btn t-fresh" data-theme="fresh" title="清新科技"></div>
        <div class="theme-btn t-cyber" data-theme="cyber" title="赛博朋克"></div>
      </div>
    </div>

    <!-- 聊天区域 -->
    <div class="esp32-chat" id="chatArea"></div>

    <!-- 语音按钮 -->
    <div class="esp32-voice">
      <button class="voice-btn" id="voiceBtn">
        <span class="mic-icon">&#x1F3A4;</span>
        <span class="voice-text">点击说话</span>
      </button>
    </div>

    <!-- 底部状态栏 -->
    <div class="esp32-statusbar">
      <div class="status-item">
        <span class="status-dot green"></span>
        <span>WiFi</span>
      </div>
      <div class="status-item" id="aiStatus">AI:就绪</div>
      <div class="status-item" id="memStatus">Mem:45%</div>
    </div>

  </div><!-- /.esp32-screen -->
</div><!-- /.esp32-shell -->

<script>
/* ============================================================
   诸葛云 ESP32 UI Demo —— 交互逻辑
   ============================================================ */
(function () {
  'use strict';

  /* ---------- DOM 引用 ---------- */
  const screen    = document.getElementById('screen');
  const header    = document.getElementById('header');
  const chatArea  = document.getElementById('chatArea');
  const voiceBtn  = document.getElementById('voiceBtn');
  const voiceText = voiceBtn.querySelector('.voice-text');
  const themePicker  = document.getElementById('themePicker');
  const aiStatusEl   = document.getElementById('aiStatus');
  const memStatusEl  = document.getElementById('memStatus');

  /* ---------- 模拟对话数据 ---------- */
  const conversations = [
    {
      user: '今天几号',
      ai:   '今天是2026年7月14日，星期一'
    },
    {
      user: '天气如何',
      ai:   '多云，24-31°C，空气质量良'
    },
    {
      user: '算一下 99 加 1',
      ai:   '99 + 1 = 100'
    }
  ];
  let conversationIndex = 0; // 当前对话轮次
  let isRecording  = false;
  let isTyping     = false; // AI 正在流式输出
  let themePickerVisible = false;
  let longPressTimer = null;

  /* ---------- 初始化 ---------- */
  function init() {
    loadTheme();
    showWelcome();
    bindEvents();
    // 模拟内存变化
    setInterval(simulateMemory, 5000);
  }

  /* ---------- 欢迎消息 ---------- */
  function showWelcome() {
    appendMessage('ai', '你好！我是诸葛云。', false);
  }

  /* ---------- 绑定事件 ---------- */
  function bindEvents() {
    // 语音按钮点击
    voiceBtn.addEventListener('click', handleVoiceClick);

    // 顶栏长按 —— 弹出主题选择
    header.addEventListener('mousedown', startLongPress);
    header.addEventListener('mouseup', cancelLongPress);
    header.addEventListener('mouseleave', cancelLongPress);
    header.addEventListener('touchstart', startLongPress, { passive: true });
    header.addEventListener('touchend', cancelLongPress);
    header.addEventListener('touchcancel', cancelLongPress);

    // 主题按钮
    themePicker.querySelectorAll('.theme-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setTheme(this.dataset.theme);
      });
    });

    // 点击其他区域关闭主题选择
    screen.addEventListener('click', function (e) {
      if (themePickerVisible && !themePicker.contains(e.target) && e.target !== header && !header.contains(e.target)) {
        hideThemePicker();
      }
    });
  }

  /* ---------- 语音按钮点击处理 ---------- */
  function handleVoiceClick() {
    if (isRecording || isTyping) return;
    startRecording();
  }

  /* ---------- 开始录音 ---------- */
  function startRecording() {
    isRecording = true;
    voiceBtn.classList.add('recording');
    voiceText.textContent = '正在录音...';
    aiStatusEl.textContent = 'AI:聆听中';

    // 1.5 秒后模拟识别完成
    setTimeout(function () {
      finishRecording();
    }, 1500);
  }

  /* ---------- 录音完成 ---------- */
  function finishRecording() {
    isRecording = false;
    voiceBtn.classList.remove('recording');
    voiceText.textContent = '点击说话';

    // 如果对话数据已用完，从头循环
    if (conversationIndex >= conversations.length) {
      conversationIndex = 0;
    }

    var conv = conversations[conversationIndex];
    conversationIndex++;

    // 显示用户消息
    appendMessage('user', conv.user, false);

    // 模拟 AI 流式回复
    aiStatusEl.textContent = 'AI:思考中';
    setTimeout(function () {
      aiStatusEl.textContent = 'AI:回复中';
      streamMessage('ai', conv.ai);
    }, 400);
  }

  /* ---------- 添加消息到聊天区域 ---------- */
  function appendMessage(role, text, streaming) {
    var msgDiv = document.createElement('div');
    msgDiv.className = 'msg ' + role;

    // 前缀
    var prefix = document.createElement('div');
    prefix.className = 'prefix';
    prefix.textContent = role === 'ai' ? '[诸葛云]' : '[我]';
    msgDiv.appendChild(prefix);

    // 气泡
    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (streaming) {
      // 流式模式 —— 先创建空内容 + 光标
      bubble.innerHTML = '<span class="text-content"></span><span class="cursor-blink"></span>';
      bubble.setAttribute('data-role', role);
      bubble.setAttribute('data-full-text', text);
      bubble.setAttribute('data-char-index', '0');
      msgDiv.appendChild(bubble);
      chatArea.appendChild(msgDiv);
      scrollToBottom();
      startTypingEffect(bubble);
    } else {
      bubble.textContent = text;
      msgDiv.appendChild(bubble);
      chatArea.appendChild(msgDiv);
      scrollToBottom();
    }
  }

  /* ---------- 流式打字效果 ---------- */
  function streamMessage(role, text) {
    isTyping = true;
    appendMessage(role, text, true);
  }

  function startTypingEffect(bubble) {
    var fullText   = bubble.getAttribute('data-full-text');
    var charIndex  = parseInt(bubble.getAttribute('data-char-index'), 10);
    var textSpan   = bubble.querySelector('.text-content');
    var cursorSpan = bubble.querySelector('.cursor-blink');
    var speed       = 50; // 每字符间隔（毫秒）

    function typeNext() {
      if (charIndex < fullText.length) {
        textSpan.textContent += fullText[charIndex];
        charIndex++;
        bubble.setAttribute('data-char-index', String(charIndex));
        scrollToBottom();
        setTimeout(typeNext, speed);
      } else {
        // 打字完成 —— 移除光标
        if (cursorSpan && cursorSpan.parentNode) {
          cursorSpan.parentNode.removeChild(cursorSpan);
        }
        isTyping = false;
        aiStatusEl.textContent = 'AI:就绪';
      }
    }

    typeNext();
  }

  /* ---------- 自动滚动到底部 ---------- */
  function scrollToBottom() {
    // 使用 requestAnimationFrame 确保在 DOM 更新后滚动
    requestAnimationFrame(function () {
      chatArea.scrollTop = chatArea.scrollHeight;
    });
  }

  /* ---------- 主题切换 ---------- */

  // 长按顶栏
  function startLongPress(e) {
    longPressTimer = setTimeout(function () {
      toggleThemePicker();
    }, 2000);
  }

  function cancelLongPress() {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  }

  function toggleThemePicker() {
    if (themePickerVisible) {
      hideThemePicker();
    } else {
      showThemePicker();
    }
  }

  function showThemePicker() {
    themePickerVisible = true;
    themePicker.classList.add('show');
  }

  function hideThemePicker() {
    themePickerVisible = false;
    themePicker.classList.remove('show');
  }

  function setTheme(themeName) {
    document.documentElement.setAttribute('data-theme', themeName);

    // 更新按钮 active 状态
    themePicker.querySelectorAll('.theme-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.theme === themeName);
    });

    // 持久化
    try {
      localStorage.setItem('zhugeyun-theme', themeName);
    } catch (e) {
      // 忽略 localStorage 不可用的情况
    }

    // 1 秒后关闭选择器
    setTimeout(hideThemePicker, 600);
  }

  function loadTheme() {
    try {
      var saved = localStorage.getItem('zhugeyun-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
        // 同步按钮状态
        themePicker.querySelectorAll('.theme-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.theme === saved);
        });
      }
    } catch (e) {
      // 忽略
    }
  }

  /* ---------- 模拟内存变化 ---------- */
  function simulateMemory() {
    var mem = 40 + Math.floor(Math.random() * 20);
    memStatusEl.textContent = 'Mem:' + mem + '%';
  }

  /* ---------- 启动 ---------- */
  init();

})();
</script>
</body>
</html>
