<!DOCTYPE html>
<html lang="zh-CN" data-theme="glass">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诸葛云 AI 助手 - 手表端 UI 预览</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    // 同步初始化主题，避免闪烁
    // 清除所有旧的 localStorage 主题 key（统一使用 zhugeyun-theme）
    (function() {
      var keys = ['zhuge-theme', 'zhuge-watch-theme', 'esp32-theme'];
      for (var i = 0; i < keys.length; i++) {
        try { localStorage.removeItem(keys[i]); } catch(e) {}
      }
      var saved = null;
      try { saved = localStorage.getItem('zhugeyun-theme'); } catch(e) {}
      if (!saved || (saved !== 'glass' && saved !== 'fresh' && saved !== 'cyber')) {
        saved = 'glass';
        try { localStorage.setItem('zhugeyun-theme', 'glass'); } catch(e) {}
      }
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    /* ========== 主题变量系统 ========== */
    :root {
      --watch-width: 200px;
      --watch-height: 244px;
      --watch-radius: 36px;
      --watch-border: 8px;
      --transition-speed: 0.3s;
      --font-main: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* 主题：玻璃拟态（默认） */
    [data-theme="glass"] {
      --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      --watch-bg: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      --watch-border-color: rgba(255,255,255,0.15);
      --watch-case-color: #1a1a2e;
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.65);
      --text-muted: rgba(255,255,255,0.4);
      --accent-gradient: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      --accent-color: #667eea;
      --accent-color-end: #f093fb;
      --btn-bg: rgba(255,255,255,0.1);
      --btn-hover: rgba(255,255,255,0.18);
      --msg-user-bg: linear-gradient(135deg, rgba(102,126,234,0.35), rgba(118,75,162,0.35));
      --msg-ai-bg: rgba(255,255,255,0.08);
      --divider: rgba(255,255,255,0.1);
      --status-dot: #00e676;
      --page-bg: linear-gradient(135deg, #e8eaf6, #c5cae9, #e1bee7);
      --shadow-color: rgba(30, 30, 80, 0.35);
      --glass-blur: blur(20px);
    }

    /* 主题：清新科技 */
    [data-theme="fresh"] {
      --bg-gradient: linear-gradient(160deg, #f0f7ff, #e8f5e9, #f1f8e9);
      --watch-bg: linear-gradient(145deg, rgba(255,255,255,0.85), rgba(255,255,255,0.7));
      --watch-border-color: rgba(91,155,213,0.2);
      --watch-case-color: #2c3e50;
      --text-primary: #1a2a3a;
      --text-secondary: rgba(26,42,58,0.6);
      --text-muted: rgba(26,42,58,0.35);
      --accent-gradient: linear-gradient(135deg, #5b9bd5, #6dbf7b);
      --accent-color: #5b9bd5;
      --accent-color-end: #6dbf7b;
      --btn-bg: rgba(91,155,213,0.1);
      --btn-hover: rgba(91,155,213,0.2);
      --msg-user-bg: linear-gradient(135deg, rgba(91,155,213,0.2), rgba(109,191,123,0.2));
      --msg-ai-bg: rgba(91,155,213,0.08);
      --divider: rgba(91,155,213,0.15);
      --status-dot: #4caf50;
      --page-bg: linear-gradient(135deg, #e3f2fd, #e8f5e9, #f1f8e9);
      --shadow-color: rgba(0, 60, 120, 0.15);
      --glass-blur: blur(16px);
    }

    /* 主题：极简未来 */
    [data-theme="cyber"] {
      --bg-gradient: linear-gradient(180deg, #0a0a0f, #0d0d1a, #0a0a0f);
      --watch-bg: linear-gradient(145deg, rgba(0,212,170,0.04), rgba(0,160,255,0.02));
      --watch-border-color: rgba(0,212,170,0.25);
      --watch-case-color: #0a0a0f;
      --text-primary: #e0e0e0;
      --text-secondary: rgba(224,224,224,0.5);
      --text-muted: rgba(224,224,224,0.25);
      --accent-gradient: linear-gradient(135deg, #00d4aa, #00a0ff);
      --accent-color: #00d4aa;
      --accent-color-end: #00a0ff;
      --btn-bg: rgba(0,212,170,0.08);
      --btn-hover: rgba(0,212,170,0.16);
      --msg-user-bg: linear-gradient(135deg, rgba(0,212,170,0.15), rgba(0,160,255,0.15));
      --msg-ai-bg: rgba(0,212,170,0.05);
      --divider: rgba(0,212,170,0.12);
      --status-dot: #00d4aa;
      --page-bg: linear-gradient(135deg, #0a0a12, #0d0d1a, #0a0a12);
      --shadow-color: rgba(0, 212, 170, 0.1);
      --glass-blur: blur(24px);
    }

    /* ========== 页面背景 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-speed) ease;
      overflow: hidden;
    }

    /* ========== 手表外壳 ========== */
    .watch-container {
      position: relative;
      width: calc(var(--watch-width) + var(--watch-border) * 2);
      height: calc(var(--watch-height) + var(--watch-border) * 2);
      background: var(--watch-case-color);
      border-radius: calc(var(--watch-radius) + var(--watch-border));
      box-shadow:
        0 20px 60px var(--shadow-color),
        0 4px 16px var(--shadow-color),
        inset 0 1px 0 rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
    }

    /* 右侧旋钮装饰 */
    .watch-container::after {
      content: '';
      position: absolute;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 28px;
      background: linear-gradient(180deg, #3a3a4a, #5a5a6a, #3a3a4a);
      border-radius: 0 4px 4px 0;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.3);
    }

    /* 旋钮上方小按钮 */
    .watch-container::before {
      content: '';
      position: absolute;
      right: -8px;
      top: calc(50% - 24px);
      transform: translateY(-50%);
      width: 6px;
      height: 12px;
      background: linear-gradient(180deg, #4a4a5a, #6a6a7a, #4a4a5a);
      border-radius: 0 3px 3px 0;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.25);
    }

    /* ========== 手表屏幕 ========== */
    .watch-screen {
      width: var(--watch-width);
      height: var(--watch-height);
      background: var(--bg-gradient);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: var(--watch-radius);
      border: 1px solid var(--watch-border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background var(--transition-speed) ease, border-color var(--transition-speed) ease;
      position: relative;
    }

    /* ========== 时间区域 ========== */
    .time-area {
      text-align: center;
      padding: 18px 16px 8px;
      cursor: default;
      user-select: none;
      flex-shrink: 0;
    }

    .time-display {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 2px;
      line-height: 1;
      animation: timeBreath 4s ease-in-out infinite;
      transition: color var(--transition-speed) ease;
    }

    .date-display {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 4px;
      font-weight: 300;
      transition: color var(--transition-speed) ease;
    }

    @keyframes timeBreath {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.88; }
    }

    /* ========== 分隔线 ========== */
    .divider {
      height: 1px;
      background: var(--divider);
      margin: 0 16px;
      flex-shrink: 0;
      transition: background var(--transition-speed) ease;
    }

    /* ========== 状态A - 语音等待 ========== */
    .voice-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .voice-area.hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      position: absolute;
      width: 100%;
    }

    /* 语音按钮 */
    .voice-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: var(--accent-gradient);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(102,126,234,0.3);
      animation: btnPulse 2.5s ease-in-out infinite;
      z-index: 1;
    }

    .voice-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 28px rgba(102,126,234,0.45);
    }

    .voice-btn:active {
      transform: scale(0.95);
    }

    .voice-btn.recording {
      animation: none;
      background: var(--accent-gradient);
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(102,126,234,0.5);
    }

    .voice-btn.done-bounce {
      animation: doneBounce 0.4s ease;
    }

    /* 呼吸脉冲动画 */
    @keyframes btnPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 4px 20px rgba(102,126,234,0.25);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 4px 30px rgba(102,126,234,0.4);
      }
    }

    /* 完成弹跳 */
    @keyframes doneBounce {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.15); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    /* 波纹扩散效果 */
    .ripple-ring {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      animation: rippleExpand 1.2s ease-out infinite;
      pointer-events: none;
    }

    .ripple-ring:nth-child(2) {
      animation-delay: 0.4s;
    }
    .ripple-ring:nth-child(3) {
      animation-delay: 0.8s;
    }

    @keyframes rippleExpand {
      0% {
        transform: scale(1);
        opacity: 0.6;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    /* 提示文字 */
    .voice-hint {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 12px;
      text-align: center;
      transition: color var(--transition-speed) ease;
    }

    /* ========== 状态B - 对话区域 ========== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      position: absolute;
      width: 100%;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .chat-area.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      position: relative;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
      scrollbar-width: none;
    }

    .chat-messages::-webkit-scrollbar {
      display: none;
    }

    /* 消息气泡 */
    .message {
      max-width: 88%;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 11px;
      line-height: 1.5;
      animation: fadeInUp 0.3s ease;
      word-break: break-all;
    }

    .message.user {
      align-self: flex-end;
      background: var(--msg-user-bg);
      color: var(--text-primary);
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--msg-ai-bg);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .message .sender {
      font-size: 8px;
      color: var(--accent-color);
      font-weight: 500;
      margin-bottom: 2px;
      display: block;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 对话中的小语音按钮 */
    .chat-voice-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--accent-gradient);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      margin: 6px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 12px rgba(102,126,234,0.25);
      animation: btnPulse 2.5s ease-in-out infinite;
      position: relative;
      flex-shrink: 0;
    }

    .chat-voice-btn:hover {
      transform: scale(1.1);
    }

    .chat-voice-btn:active {
      transform: scale(0.92);
    }

    .chat-voice-btn.recording {
      animation: none;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(102,126,234,0.5);
    }

    .chat-voice-btn .ripple-ring {
      width: 36px;
      height: 36px;
    }

    /* ========== 底部状态栏 ========== */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px 10px;
      flex-shrink: 0;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 8px;
      color: var(--text-muted);
      transition: color var(--transition-speed) ease;
    }

    .status-item svg {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--status-dot);
      box-shadow: 0 0 4px var(--status-dot);
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ========== 主题选择面板 ========== */
    .theme-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 14px 16px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .theme-panel.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .theme-panel-title {
      font-size: 9px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      margin-bottom: 10px;
      font-weight: 300;
    }

    .theme-options {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .theme-option {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
      position: relative;
    }

    .theme-option:hover {
      transform: scale(1.1);
    }

    .theme-option.active {
      border-color: #fff;
    }

    .theme-option.glass-opt {
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
    }

    .theme-option.fresh-opt {
      background: linear-gradient(135deg, #5b9bd5, #6dbf7b);
    }

    .theme-option.cyber-opt {
      background: linear-gradient(135deg, #00d4aa, #00a0ff);
    }

    .theme-option-label {
      font-size: 7px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-top: 4px;
    }

    .theme-option-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ========== 主题切换全局过渡 ========== */
    .watch-screen,
    .time-display,
    .date-display,
    .divider,
    .voice-hint,
    .message,
    .status-item,
    .status-dot,
    .voice-btn,
    .chat-voice-btn {
      transition: background var(--transition-speed) ease,
                  color var(--transition-speed) ease,
                  border-color var(--transition-speed) ease,
                  box-shadow var(--transition-speed) ease;
    }

    /* ========== 页面标题装饰 ========== */
    .page-label {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 300;
      color: rgba(0,0,0,0.3);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    [data-theme="cyber"] .page-label {
      color: rgba(255,255,255,0.15);
    }

    .page-sublabel {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(0,0,0,0.2);
      letter-spacing: 2px;
    }

    [data-theme="cyber"] .page-sublabel {
      color: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <!-- 页面装饰文字 -->
  <div class="page-label">ZhugeYun AI</div>
  <div class="page-sublabel">Watch UI Preview</div>

  <!-- 手表外壳 -->
  <div class="watch-container">
    <!-- 手表屏幕 -->
    <div class="watch-screen">

      <!-- 时间区域（长按2秒打开主题面板） -->
      <div class="time-area" id="timeArea">
        <div class="time-display" id="timeDisplay">14:32</div>
        <div class="date-display" id="dateDisplay">周一 7月14日</div>
      </div>

      <div class="divider"></div>

      <!-- 状态A - 语音等待区域 -->
      <div class="voice-area" id="voiceArea">
        <button class="voice-btn" id="voiceBtn" title="点击开始语音识别">
          <!-- 麦克风SVG图标 -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="1" width="6" height="12" rx="3"/>
            <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
            <line x1="12" y1="18" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <!-- 录音波纹（默认隐藏） -->
          <div class="ripple-ring" style="display:none;"></div>
          <div class="ripple-ring" style="display:none;"></div>
          <div class="ripple-ring" style="display:none;"></div>
        </button>
        <div class="voice-hint">轻点开始语音识别</div>
      </div>

      <!-- 状态B - 对话区域 -->
      <div class="chat-area" id="chatArea">
        <div class="chat-messages" id="chatMessages"></div>
        <button class="chat-voice-btn" id="chatVoiceBtn" title="继续对话">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="1" width="6" height="12" rx="3"/>
            <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
            <line x1="12" y1="18" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <div class="ripple-ring" style="display:none;"></div>
          <div class="ripple-ring" style="display:none;"></div>
          <div class="ripple-ring" style="display:none;"></div>
        </button>
      </div>

      <div class="divider"></div>

      <!-- 底部状态栏 -->
      <div class="status-bar">
        <div class="status-item">
          <div class="status-dot"></div>
          <span>在线</span>
        </div>
        <div class="status-item">
          <!-- WiFi图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.42 9a16.06 16.06 0 0 1 21.16 0"/>
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1" fill="currentColor"/>
          </svg>
          <span>WiFi</span>
        </div>
        <div class="status-item">
          <!-- 电池图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="6" width="18" height="12" rx="2"/>
            <line x1="21" y1="10" x2="21" y2="14"/>
            <rect x="3" y="8" width="11" height="8" rx="1" fill="currentColor" opacity="0.3"/>
            <rect x="3" y="8" width="11" height="8" rx="1" fill="currentColor" opacity="0.15"/>
          </svg>
          <span>85%</span>
        </div>
      </div>

      <!-- 主题选择面板（隐藏） -->
      <div class="theme-panel" id="themePanel">
        <div class="theme-panel-title">选择主题</div>
        <div class="theme-options">
          <div class="theme-option-group">
            <div class="theme-option glass-opt" data-theme-value="glass" title="玻璃拟态"></div>
            <div class="theme-option-label">玻璃</div>
          </div>
          <div class="theme-option-group">
            <div class="theme-option fresh-opt" data-theme-value="fresh" title="清新科技"></div>
            <div class="theme-option-label">清新</div>
          </div>
          <div class="theme-option-group">
            <div class="theme-option cyber-opt" data-theme-value="cyber" title="极简未来"></div>
            <div class="theme-option-label">极简</div>
          </div>
        </div>
      </div>

    </div><!-- /watch-screen -->
  </div><!-- /watch-container -->

  <script>
    /* ========================================
     *  诸葛云 AI 助手 - 手表端 UI 模拟脚本
     * ======================================== */

    // ========== 模拟对话数据 ==========
    const conversations = [
      { user: '今天天气怎么样', ai: '今日多云，气温24-31°C，空气质量良' },
      { user: '计算 125 乘 36',  ai: '4500' },
      { user: '现在几点了',     ai: '现在是 14:32' },
      { user: '帮我设一个闹钟',  ai: '已设置明天早上 7:00 的闹钟' }
    ];

    // 主题关键词映射
    const themeKeywords = {
      '清新': 'fresh',
      '绿色': 'fresh',
      '玻璃': 'glass',
      '紫色': 'glass',
      '极简': 'cyber',
      '暗黑': 'cyber',
      '赛博': 'cyber'
    };

    // ========== DOM 元素 ==========
    const htmlEl = document.documentElement;
    const timeDisplay = document.getElementById('timeDisplay');
    const dateDisplay = document.getElementById('dateDisplay');
    const timeArea = document.getElementById('timeArea');
    const voiceArea = document.getElementById('voiceArea');
    const voiceBtn = document.getElementById('voiceBtn');
    const chatArea = document.getElementById('chatArea');
    const chatMessages = document.getElementById('chatMessages');
    const chatVoiceBtn = document.getElementById('chatVoiceBtn');
    const themePanel = document.getElementById('themePanel');

    // ========== 状态 ==========
    let isRecording = false;       // 是否正在录音
    let isTyping = false;          // AI 是否正在打字
    let chatConvIndex = 0;         // 当前对话索引
    let isChatMode = false;        // 是否处于对话模式
    let longPressTimer = null;     // 长按计时器
    let longPressed = false;       // 是否触发了长按

    // ========== 初始化 ==========
    function init() {
      // 从 localStorage 恢复主题
      const savedTheme = localStorage.getItem('zhugeyun-theme') || 'glass';
      setTheme(savedTheme);
      updateThemeOptions(savedTheme);

      // 更新时间
      updateClock();
      setInterval(updateClock, 1000);

      // 绑定事件
      voiceBtn.addEventListener('click', handleVoiceClick);
      chatVoiceBtn.addEventListener('click', handleChatVoiceClick);

      // 长按时间区域打开主题面板
      timeArea.addEventListener('mousedown', startLongPress);
      timeArea.addEventListener('mouseup', cancelLongPress);
      timeArea.addEventListener('mouseleave', cancelLongPress);
      timeArea.addEventListener('touchstart', startLongPress);
      timeArea.addEventListener('touchend', cancelLongPress);
      timeArea.addEventListener('touchcancel', cancelLongPress);

      // 主题选项点击
      document.querySelectorAll('.theme-option').forEach(opt => {
        opt.addEventListener('click', (e) => {
          e.stopPropagation();
          const theme = opt.dataset.themeValue;
          setTheme(theme);
          updateThemeOptions(theme);
          localStorage.setItem('zhugeyun-theme', theme);
          themePanel.classList.remove('visible');
        });
      });

      // 点击面板外关闭
      document.addEventListener('click', (e) => {
        if (!themePanel.contains(e.target) && !timeArea.contains(e.target)) {
          themePanel.classList.remove('visible');
        }
      });
    }

    // ========== 时间更新 ==========
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      timeDisplay.textContent = `${hours}:${mins}`;

      const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const day = days[now.getDay()];
      const month = now.getMonth() + 1;
      const date = now.getDate();
      dateDisplay.textContent = `${day} ${month}月${date}日`;
    }

    // ========== 主题切换 ==========
    function setTheme(theme) {
      htmlEl.setAttribute('data-theme', theme);
    }

    function updateThemeOptions(theme) {
      document.querySelectorAll('.theme-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.themeValue === theme);
      });
    }

    // ========== 长按事件 ==========
    function startLongPress(e) {
      longPressed = false;
      longPressTimer = setTimeout(() => {
        longPressed = true;
        themePanel.classList.add('visible');
      }, 2000);
    }

    function cancelLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    // ========== 检查主题关键词 ==========
    function checkThemeKeyword(text) {
      for (const [keyword, theme] of Object.entries(themeKeywords)) {
        if (text.includes(keyword)) {
          setTheme(theme);
          updateThemeOptions(theme);
          localStorage.setItem('zhugeyun-theme', theme);
          return true;
        }
      }
      return false;
    }

    // ========== 状态A语音按钮点击 ==========
    function handleVoiceClick() {
      if (isRecording || isTyping) return;
      startRecording(voiceBtn, () => {
        // 切换到对话模式
        switchToChatMode();
        // 模拟对话
        simulateConversation();
      });
    }

    // ========== 状态B语音按钮点击 ==========
    function handleChatVoiceClick() {
      if (isRecording || isTyping) return;
      startRecording(chatVoiceBtn, () => {
        simulateConversation();
      });
    }

    // ========== 录音动画 ==========
    function startRecording(btn, onComplete) {
      isRecording = true;
      btn.classList.add('recording');

      // 显示波纹
      const ripples = btn.querySelectorAll('.ripple-ring');
      ripples.forEach(r => r.style.display = 'block');

      // 1.5秒后模拟识别完成
      setTimeout(() => {
        // 隐藏波纹
        ripples.forEach(r => r.style.display = 'none');
        btn.classList.remove('recording');

        // 弹跳效果
        btn.classList.add('done-bounce');
        setTimeout(() => btn.classList.remove('done-bounce'), 400);

        isRecording = false;
        if (onComplete) onComplete();
      }, 1500);
    }

    // ========== 切换到对话模式 ==========
    function switchToChatMode() {
      isChatMode = true;
      voiceArea.classList.add('hidden');
      chatArea.classList.add('visible');
      // 清空旧消息
      chatMessages.innerHTML = '';
      chatConvIndex = 0;
    }

    // ========== 模拟对话流程 ==========
    function simulateConversation() {
      if (chatConvIndex >= conversations.length) {
        chatConvIndex = 0; // 循环对话
      }

      const conv = conversations[chatConvIndex];
      chatConvIndex++;

      // 显示用户消息
      addUserMessage(conv.user);

      // 检查主题关键词
      checkThemeKeyword(conv.user);

      // 0.5秒后AI开始回复
      setTimeout(() => {
        typeAIMessage(conv.ai);
      }, 500);
    }

    // ========== 添加用户消息 ==========
    function addUserMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'message user';
      msg.innerHTML = `<span class="sender">我</span>${escapeHtml(text)}`;
      chatMessages.appendChild(msg);
      scrollToBottom();
    }

    // ========== AI流式打字效果 ==========
    function typeAIMessage(text) {
      isTyping = true;

      const msg = document.createElement('div');
      msg.className = 'message ai';
      msg.innerHTML = `<span class="sender">诸</span><span class="ai-text"></span>`;
      chatMessages.appendChild(msg);

      const textEl = msg.querySelector('.ai-text');
      let index = 0;

      const typingInterval = setInterval(() => {
        if (index < text.length) {
          textEl.textContent += text[index];
          index++;
          scrollToBottom();
        } else {
          clearInterval(typingInterval);
          isTyping = false;
        }
      }, 60);
    }

    // ========== 滚动到底部 ==========
    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ========== HTML 转义 ==========
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ========== 启动 ==========
    init();
  </script>
</body>
</html>
