<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BWT AI 分析报告 — Sony WH-1000XM5</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/shared.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <style>
    /* Decision banner glow background */
    .decision-banner {
      background: linear-gradient(135deg, rgba(0, 212, 170, 0.08) 0%, rgba(0, 212, 170, 0.02) 100%);
      position: relative;
    }
    .decision-banner::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 212, 170, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Module card stagger animation */
    .module-card {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .module-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .module-card:nth-child(2) { transition-delay: 0.12s; }
    .module-card:nth-child(3) { transition-delay: 0.24s; }
    .module-card:nth-child(4) { transition-delay: 0.36s; }

    /* Expandable section */
    .expandable-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .expandable-content.expanded {
      max-height: 500px;
      opacity: 1;
    }

    /* Expandable bullet */
    .bullet-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
      padding-top: 0;
      padding-bottom: 0;
    }
    .bullet-detail.expanded {
      max-height: 200px;
      padding-top: 8px;
      padding-bottom: 4px;
    }

    /* Full reasoning block */
    .reasoning-block {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
    }
    .reasoning-block.expanded {
      max-height: 2000px;
    }

    /* Sticky bottom bar */
    .bottom-action-bar {
      background: rgba(18, 22, 43, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Confidence counter glow */
    .confidence-value {
      text-shadow: 0 0 20px rgba(0, 212, 170, 0.5);
    }

    /* Factor item colors */
    .factor-green { border-left: 3px solid #00D4AA; }
    .factor-yellow { border-left: 3px solid #FFB84D; }
    .factor-red { border-left: 3px solid #FF6B6B; }

    /* Advice card subtle border */
    .advice-card {
      border: 1px solid rgba(0, 212, 170, 0.15);
      background: rgba(0, 212, 170, 0.04);
    }

    /* Alternative suggestion cards */
    .alt-card {
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .alt-card:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Product info bar */
    .product-bar {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Reasoning step number */
    .reason-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 212, 170, 0.12);
      color: #00D4AA;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Stars rating */
    .star-filled { color: #FFB84D; }
    .star-empty { color: rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body class="bg-bwt-bg text-bwt-text font-body min-h-screen flex flex-col">

  <!-- Navigation -->
  <nav class="bwt-nav">
    <div class="flex items-center gap-4">
      <a href="index.html" class="bwt-nav__logo">
        BWT<span class="bwt-nav__logo-dot"></span>
      </a>
      <ul class="bwt-nav__links">
        <li><a href="index.html" class="bwt-nav__link">首页</a></li>
        <li><a href="analysis-input.html" class="bwt-nav__link bwt-nav__link--active">单品分析</a></li>
        <li><a href="comparison.html" class="bwt-nav__link">多品对比</a></li>
        <li><a href="square.html" class="bwt-nav__link">社区广场</a></li>
        <li><a href="profile.html" class="bwt-nav__link">我的</a></li>
      </ul>
    </div>
    <div class="flex items-center gap-3">
      <a href="analysis-input.html" class="bwt-btn-ghost text-sm hidden sm:inline-flex">&larr; 返回输入</a>
      <a href="share-card.html" class="bwt-btn-ghost text-sm flex items-center gap-1.5" title="分享">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span class="hidden sm:inline">分享</span>
      </a>
      <!-- Mobile hamburger -->
      <button class="bwt-nav__hamburger" onclick="document.querySelector('.bwt-nav__links').classList.toggle('is-open')" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Spacer for fixed nav -->
  <div class="h-16"></div>

  <!-- Product Info Bar -->
  <div class="product-bar" style="border-bottom: 1px solid rgba(0,212,170,0.15);">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center gap-4">
      <!-- Product image placeholder -->
      <div class="w-[60px] h-[60px] rounded-lg flex-shrink-0"
           style="background: linear-gradient(135deg, #1a1f35 0%, #0a0e1a 50%, #00D4AA22 100%); border: 1px solid rgba(0, 212, 170, 0.15);">
        <div class="w-full h-full flex items-center justify-center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(0, 212, 170, 0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
          </svg>
        </div>
      </div>
      <div class="flex-1 min-w-0">
        <h2 id="resultProductName" class="font-body text-bwt-text text-base font-medium truncate">Sony WH-1000XM5</h2>
        <div class="flex items-center gap-2 mt-0.5">
          <span id="resultPrice" class="font-mono text-bwt-primary text-sm font-bold">&yen;2,299</span>
          <span id="resultCategoryBadge" class="bwt-badge bwt-badge--muted text-xs">耳机</span>
          <span id="resultSourceBadge" class="bwt-badge bwt-badge--muted text-xs">品类</span>
        </div>
      </div>
      <div class="hidden sm:block text-right flex-shrink-0">
        <p class="font-body text-bwt-muted text-xs">分析时间</p>
        <p class="font-mono text-bwt-muted/60 text-xs">2025-01-15 14:32</p>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 pb-28 page-enter">

    <!-- Decision Banner -->
    <section class="decision-banner py-8 px-6" style="background: linear-gradient(135deg, rgba(0,212,170,0.05), transparent); border-left: 3px solid var(--bwt-primary);">
      <div class="max-w-3xl mx-auto text-center relative z-10">
        <h1 id="resultDecision" class="bwt-text-gradient font-display text-4xl sm:text-5xl font-bold text-bwt-primary mb-3" style="text-shadow: 0 0 30px rgba(0, 212, 170, 0.3);">
          建议购买
        </h1>
        <p id="resultSummary" class="font-body text-bwt-text text-base sm:text-lg mb-4 max-w-xl mx-auto">
          降噪性能出色，性价比优秀，适合你的通勤场景
        </p>
        <div class="inline-flex items-center gap-2">
          <span id="resultConfidenceBadge" class="bwt-badge bwt-badge--primary text-xs">置信度 87%</span>
          <span class="font-mono text-bwt-primary text-2xl font-bold confidence-value" id="confidence-num">0</span>
          <span class="font-mono text-bwt-primary/60 text-lg">%</span>
        </div>
      </div>
    </section>

    <!-- Analysis Modules Grid -->
    <section class="bwt-grid-bg py-12 px-6">
      <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Module 1: Need Index -->
        <div class="module-card bwt-card bwt-card--lift bwt-section-reveal">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div class="bwt-icon-box" style="background:rgba(0,212,170,0.12);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </div>
            <h3 class="font-display text-bwt-text text-base font-semibold">刚需指数</h3>
          </div>

          <!-- Ring chart container -->
          <div id="need-ring" class="flex justify-center mb-5"></div>

          <!-- Bullet points (dynamic) -->
          <div id="needBulletsContainer" class="space-y-3"></div>
        </div>

        <!-- Module 2: Value Assessment -->
        <div class="module-card bwt-card bwt-card--lift bwt-section-reveal">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div class="bwt-icon-box" style="background:rgba(59,130,246,0.12);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <h3 class="font-display text-bwt-text text-base font-semibold">性价比评估</h3>
          </div>

          <!-- Price axis chart container -->
          <div id="price-axis" class="mb-5"></div>

          <!-- Rating stars (dynamic) -->
          <div id="valueStarsContainer" class="flex items-center gap-2 mb-3">
            <span class="font-body text-bwt-muted text-sm">性价比评级:</span>
            <div id="valueStarsInner" class="flex items-center gap-0.5"></div>
            <span id="valueLabel" class="font-display text-bwt-warning text-sm font-medium"></span>
          </div>
          <div id="valueText" class="font-body text-bwt-muted text-sm leading-relaxed"></div>
        </div>

        <!-- Module 3: Impulse Warning -->
        <div class="module-card bwt-card bwt-card--lift bwt-section-reveal">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div class="bwt-icon-box" style="background:rgba(255,107,107,0.12);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <h3 class="font-display text-bwt-text text-base font-semibold">冲动预警</h3>
          </div>

          <!-- Gauge chart container -->
          <div id="impulse-gauge" class="mb-5"></div>

          <!-- Factor list (dynamic) -->
          <div id="impulseFactorsContainer" class="space-y-2.5 mb-5"></div>

          <!-- Advice card -->
          <div class="advice-card bwt-card--glass rounded-xl px-4 py-3.5">
            <div class="flex items-start gap-2">
              <svg class="w-4 h-4 mt-0.5 text-bwt-primary flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
              <p id="impulseAdviceText" class="font-body text-bwt-text/80 text-sm leading-relaxed"></p>
            </div>
          </div>
        </div>

        <!-- Module 4: Decision Advice -->
        <div class="module-card bwt-card bwt-card--lift bwt-section-reveal">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div class="bwt-icon-box" style="background:rgba(0,212,170,0.12);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <h3 class="font-display text-bwt-text text-base font-semibold">决策建议</h3>
          </div>

          <!-- Conclusion (dynamic) -->
          <div class="text-center py-4 mb-5 rounded-xl" style="background: linear-gradient(135deg, rgba(0, 212, 170, 0.06) 0%, transparent 100%);">
            <p id="moduleConclusionText" class="font-display text-bwt-primary text-3xl font-bold mb-1"></p>
            <p class="font-body text-bwt-muted text-sm">综合评估结果</p>
          </div>

          <!-- Reasoning chain (dynamic) -->
          <div id="reasoningContainer" class="space-y-3 mb-6"></div>

          <!-- Alternative suggestions (dynamic) -->
          <div class="border-t border-white/6 pt-5">
            <h4 class="font-body text-bwt-muted text-xs uppercase tracking-wider mb-3">其他选择</h4>
            <div id="alternativesContainer" class="space-y-2.5"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- Full Reasoning (Collapsible) -->
    <section class="py-10 px-6">
      <div class="max-w-3xl mx-auto">
        <button class="w-full text-center py-3 cursor-pointer group" onclick="toggleReasoningBlock()">
          <span class="font-body text-bwt-muted text-sm group-hover:text-bwt-text transition-colors inline-flex items-center gap-2" id="reasoning-toggle-text">
            <svg class="w-4 h-4 transition-transform" id="reasoning-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
            查看 AI 完整推理过程
          </span>
        </button>
        <div class="reasoning-block" id="full-reasoning">
          <div id="fullReasoningContainer" class="bwt-card mt-4 space-y-5"></div>
        </div>
      </div>
    </section>

    <!-- Empty state (shown when no analysis data) -->
    <div id="emptyState" style="display:none;" class="flex flex-col items-center justify-center py-24 px-6">
      <div class="w-20 h-20 rounded-full bg-bwt-surface border border-bwt-border flex items-center justify-center mb-6">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(0,212,170,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
      </div>
      <h3 class="font-display text-bwt-text text-xl font-semibold mb-2">暂无分析数据</h3>
      <p class="font-body text-bwt-muted text-sm mb-6 text-center max-w-sm">请先前往单品分析页面，输入商品信息进行分析</p>
      <a href="analysis-input.html" class="bwt-btn-primary">开始分析</a>
    </div>

  </main>

  <!-- Bottom Action Bar (Sticky) -->
  <div class="bottom-action-bar fixed bottom-0 left-0 right-0 z-40">
    <div class="bwt-glow-line"></div>
    <div class="max-w-6xl mx-auto px-6 py-3.5 flex items-center gap-3 overflow-x-auto">
      <a href="share-card.html" class="bwt-btn-primary text-sm flex-shrink-0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        分享决策卡片
      </a>
      <a href="javascript:void(0)" onclick="BWTStore.set('history_'+Date.now(), BWTStore.get('currentAnalysis')); showToast('已保存到历史记录', 'success')" class="bwt-btn-secondary text-sm flex-shrink-0">保存到历史</a>
      <a href="analysis-input.html" class="bwt-btn-ghost text-sm flex-shrink-0">重新分析</a>
      <a href="comparison.html" class="bwt-btn-ghost text-sm flex-shrink-0">开始多品对比</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/toast.js"></script>
  <script src="js/data-store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/animations.js"></script>
  <script>
    // ---- Toggle functions ----
    function toggleBulletDetail(id) {
      var el = document.getElementById(id);
      var iconId = id.replace('bullet-detail', 'bullet-icon');
      var icon = document.getElementById(iconId);
      if (el) {
        el.classList.toggle('expanded');
      }
      if (icon) {
        icon.style.transform = el.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
      }
    }

    function toggleExpandable(id) {
      var el = document.getElementById(id);
      if (el) {
        el.classList.toggle('expanded');
      }
    }

    function toggleReasoningBlock() {
      var block = document.getElementById('full-reasoning');
      var icon = document.getElementById('reasoning-toggle-icon');
      var text = document.getElementById('reasoning-toggle-text');
      if (block) {
        var isExpanded = block.classList.toggle('expanded');
        if (icon) {
          icon.style.transform = isExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
        }
        // Update text content while keeping the icon
        var svgHtml = icon ? icon.outerHTML : '';
        text.innerHTML = svgHtml + (isExpanded ? ' 收起 AI 完整推理过程' : ' 查看 AI 完整推理过程');
      }
    }

    // ---- Module card stagger reveal on load ----
    document.addEventListener('DOMContentLoaded', function () {
      // ---- Read analysis data from BWTStore ----
      var analysis = BWTStore.get('currentAnalysis');
      var result = analysis ? analysis.result : null;

      // ---- Show empty state if no data ----
      if (!analysis || !result) {
        var emptyState = document.getElementById('emptyState');
        if (emptyState) emptyState.style.display = 'flex';
        // Hide main content sections
        var mainContent = document.querySelector('main');
        if (mainContent) {
          var sections = mainContent.querySelectorAll('section, .product-bar, .bottom-action-bar');
          sections.forEach(function(s) { s.style.display = 'none'; });
        }
        return; // Stop initialization when no data
      }

      // ---- Dynamic data rendering from BWTStore ----
      // Update product info bar
      var nameEl = document.getElementById('resultProductName');
      if (nameEl) nameEl.textContent = analysis.productName;

      var priceEl = document.getElementById('resultPrice');
      if (priceEl) priceEl.textContent = '\u00A5' + (analysis.price ? Number(analysis.price).toLocaleString() : '\u2014');

      var catEl = document.getElementById('resultCategoryBadge');
      if (catEl) catEl.textContent = analysis.category || '\u54C1\u7C7B';

      var srcEl = document.getElementById('resultSourceBadge');
      if (srcEl) {
        if (analysis.source === 'plugin') srcEl.textContent = '\u63D2\u4EF6\u5206\u6790';
        else if (analysis.source === 'comparison') srcEl.textContent = '\u5BF9\u6BD4\u5206\u6790';
        else srcEl.textContent = '\u624B\u52A8\u8F93\u5165';
      }

      // Update decision banner
      var decEl = document.getElementById('resultDecision');
      if (decEl && result.conclusion) decEl.textContent = result.conclusion.text;

      var sumEl = document.getElementById('resultSummary');
      if (sumEl && result.conclusion) sumEl.textContent = result.conclusion.summary;

      var confBadge = document.getElementById('resultConfidenceBadge');
      if (confBadge && result.conclusion) confBadge.textContent = '\u7F6E\u4FE1\u5EA6 ' + result.conclusion.confidence + '%';

      // Update page title
      document.title = 'BWT AI \u5206\u6790\u62A5\u544A \u2014 ' + analysis.productName;

      // ---- Dynamic module content rendering ----
      
      // Helper: escape HTML
      function escHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
      
      // Render need index bullets
      var needBulletsEl = document.getElementById('needBulletsContainer');
      if (needBulletsEl && result.needIndex && result.needIndex.bullets) {
        var bulletHtml = '';
        result.needIndex.bullets.forEach(function(b, i) {
          bulletHtml += '<div class="cursor-pointer group" onclick="toggleBulletDetail(\'dyn-bullet-' + i + '\')">' +
            '<div class="flex items-start gap-2">' +
            '<svg class="w-4 h-4 mt-0.5 text-bwt-primary flex-shrink-0 transition-transform" id="dyn-bullet-icon-' + i + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<polyline points="6 9 12 15 18 9"/></svg>' +
            '<p class="font-body text-bwt-text/80 text-sm leading-relaxed">' + escHtml(b.text) + '</p>' +
            '</div>' +
            '<div class="bullet-detail ml-6" id="dyn-bullet-' + i + '">' +
            '<p class="font-body text-bwt-muted text-xs leading-relaxed">' + escHtml(b.detail) + '</p>' +
            '</div></div>';
        });
        needBulletsEl.innerHTML = bulletHtml;
      }
      
      // Render value assessment
      var valueStarsInner = document.getElementById('valueStarsInner');
      var valueLabel = document.getElementById('valueLabel');
      var valueText = document.getElementById('valueText');
      if (result.valueRating) {
        var stars = result.valueRating.stars || 4;
        var fullStars = Math.floor(stars);
        var hasHalf = stars - fullStars >= 0.25;
        var starHtml = '';
        for (var si = 0; si < 5; si++) {
          if (si < fullStars) starHtml += '<span class="star-filled text-base">&#9733;</span>';
          else if (si === fullStars && hasHalf) starHtml += '<span class="star-filled text-base" style="opacity:0.5">&#9733;</span>';
          else starHtml += '<span class="star-empty text-base">&#9733;</span>';
        }
        if (valueStarsInner) valueStarsInner.innerHTML = starHtml;
        if (valueLabel) valueLabel.textContent = result.valueRating.label || '';
        if (valueText) valueText.innerHTML = '定价 <span class="font-mono text-bwt-text font-medium">&yen;' + Number(result.valueRating.currentPrice).toLocaleString() + '</span>，同类均价 <span class="font-mono text-bwt-warning font-medium">&yen;' + Number(result.valueRating.marketAvg).toLocaleString() + '</span>。' + (result.valueRating.summary || '');
      }
      
      // Render impulse warning factors
      var impulseFactorsEl = document.getElementById('impulseFactorsContainer');
      var impulseAdviceEl = document.getElementById('impulseAdviceText');
      if (impulseFactorsEl && result.impulseWarning) {
        var factorHtml = '';
        var typeColors = { green: 'factor-green', yellow: 'factor-yellow', red: 'factor-red' };
        var badgeColors = { green: 'bwt-badge--primary', yellow: 'bwt-badge--warning', red: 'bwt-badge--danger' };
        var badgeLabels = { green: '安全', yellow: '注意', red: '风险' };
        var icons = { green: '&#9200;', yellow: '&#128250;', red: '&#9888;' };
        (result.impulseWarning.factors || []).forEach(function(f) {
          var cls = typeColors[f.type] || typeColors.yellow;
          var badge = badgeColors[f.type] || badgeColors.yellow;
          var label = badgeLabels[f.type] || '注意';
          var icon = icons[f.type] || icons.yellow;
          factorHtml += '<div class="' + cls + ' rounded-lg bg-bwt-surface/50 px-4 py-2.5 flex items-center gap-3">' +
            '<span class="text-base flex-shrink-0">' + icon + '</span>' +
            '<div><p class="font-body text-bwt-text text-sm">' + escHtml(f.text) + '</p></div>' +
            '<span class="bwt-badge ' + badge + ' text-xs ml-auto flex-shrink-0">' + label + '</span></div>';
        });
        impulseFactorsEl.innerHTML = factorHtml;
        if (impulseAdviceEl) impulseAdviceEl.textContent = result.impulseWarning.warning || '';
      }
      
      // Render reasoning chain
      var reasoningEl = document.getElementById('reasoningContainer');
      var moduleConclusionEl = document.getElementById('moduleConclusionText');
      if (reasoningEl && result.reasoning) {
        var rHtml = '';
        result.reasoning.forEach(function(r, i) {
          rHtml += '<div class="cursor-pointer" onclick="toggleExpandable(\'dyn-reasoning-' + i + '\')">' +
            '<div class="flex items-start gap-3">' +
            '<div class="reason-step-num bwt-icon-box">' + (i + 1) + '</div>' +
            '<div class="flex-1">' +
            '<p class="font-body text-bwt-text text-sm leading-relaxed">' + escHtml(r.title) + '</p>' +
            '<div class="expandable-content" id="dyn-reasoning-' + i + '">' +
            '<p class="font-body text-bwt-muted text-xs leading-relaxed mt-2">' + escHtml(r.content) + '</p>' +
            '</div></div></div></div>';
        });
        reasoningEl.innerHTML = rHtml;
      }
      if (moduleConclusionEl && result.conclusion) {
        moduleConclusionEl.textContent = result.conclusion.text;
      }
      
      // Render alternatives
      var altEl = document.getElementById('alternativesContainer');
      if (altEl && result.alternatives) {
        var altHtml = '';
        var altColors = ['rgba(0,212,170,0.11)', 'rgba(255,184,77,0.11)'];
        var altStrokeColors = ['rgba(0,212,170,0.5)', 'rgba(255,184,77,0.5)'];
        var altTextColors = ['text-bwt-primary', 'text-bwt-warning'];
        result.alternatives.forEach(function(a, i) {
          var onclickStr = "BWTStore.saveAnalysisInput({productName:'" + a.name.replace(/'/g, "\\'") + "',category:'" + (analysis.category || '耳机') + "',price:" + a.price + ",scenario:'',source:'manual'});window.location.href='analysis-loading.html'";
          altHtml += '<a href="javascript:void(0)" onclick="' + onclickStr + '" class="alt-card rounded-lg px-4 py-3 flex items-center gap-3 group">' +
            '<div class="w-10 h-10 rounded-lg flex-shrink-0 flex items-center justify-center" style="background:linear-gradient(135deg,#1a1f35,' + altColors[i % 2] + ');">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="' + altStrokeColors[i % 2] + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>' +
            '</div>' +
            '<div class="flex-1 min-w-0">' +
            '<p class="font-body text-bwt-text text-sm truncate">' + escHtml(a.reason) + '</p>' +
            '<p class="font-mono ' + altTextColors[i % 2] + ' text-xs font-medium">&yen;' + a.price.toLocaleString() + ' &middot; 综合评分 ' + a.score + '</p>' +
            '</div>' +
            '<svg class="w-4 h-4 text-bwt-muted/40 group-hover:text-bwt-muted transition-colors flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
            '<polyline points="9 18 15 12 9 6"/></svg></a>';
        });
        altEl.innerHTML = altHtml;
      }
      
      // Render full reasoning block
      var fullReasoningEl = document.getElementById('fullReasoningContainer');
      if (fullReasoningEl && result.reasoning) {
        var frHtml = '';
        result.reasoning.forEach(function(r, i) {
          frHtml += '<div><h4 class="font-display text-bwt-text text-sm font-semibold mb-2">' + escHtml(r.title) + '</h4>' +
            '<p class="font-body text-bwt-muted text-sm leading-relaxed">' + escHtml(r.content) + '</p></div>';
        });
        fullReasoningEl.innerHTML = frHtml;
      }
      
      // Update analysis time
      var allMonoSmall = document.querySelectorAll('.font-mono');
      for (var ti = 0; ti < allMonoSmall.length; ti++) {
        if (allMonoSmall[ti].textContent && allMonoSmall[ti].textContent.indexOf('2025-') === 0) {
          allMonoSmall[ti].textContent = new Date().toLocaleString('zh-CN');
          break;
        }
      }

      // ---- Extract dynamic values for charts ----
      var needScore = (result && result.needIndex) ? result.needIndex.score : 78;
      var valueData = (result && result.valueRating) ? result.valueRating : { currentPrice: 2299, marketMin: 899, marketMax: 3999, marketAvg: 2600 };
      var impulseData = (result && result.impulseWarning) ? result.impulseWarning : { level: 35 };
      var confValue = (result && result.conclusion) ? result.conclusion.confidence : 87;

      var cards = document.querySelectorAll('.module-card');
      // Use IntersectionObserver for scroll reveal
      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        cards.forEach(function (card) {
          observer.observe(card);
        });
      } else {
        // Fallback: show all immediately
        cards.forEach(function (card) {
          card.classList.add('visible');
        });
      }

      // ---- Initialize Charts ----

      // Ring chart - Need Index
      var needRing = new BWTCharts.RingChart('need-ring', {
        value: needScore,
        label: '刚需指数',
        color: '#00D4AA'
      });
      needRing.init();
      setTimeout(function () { needRing.animate(); }, 500);

      // Price axis - Value Assessment
      var priceAxis = new BWTCharts.PriceAxis('price-axis', {
        currentPrice: valueData.currentPrice,
        marketMin: valueData.marketMin,
        marketMax: valueData.marketMax,
        marketAvg: valueData.marketAvg
      });
      priceAxis.init();
      setTimeout(function () { priceAxis.animate(); }, 800);

      // Gauge chart - Impulse Warning
      var impulseGauge = new BWTCharts.GaugeChart('impulse-gauge', {
        value: impulseData.level,
        label: '冲动指数'
      });
      impulseGauge.init();
      setTimeout(function () { impulseGauge.animate(); }, 1100);

      // Counter animation - Confidence percentage
      var confidenceEl = document.getElementById('confidence-num');
      if (confidenceEl && window.BWTAnimations) {
        BWTAnimations.counterAnimation(confidenceEl, confValue, 1200, '', '%');
      } else if (confidenceEl) {
        // Fallback counter if BWTAnimations not loaded
        var duration = 1200;
        var startTime = performance.now();
        function step(ts) {
          var elapsed = ts - startTime;
          var progress = Math.min(elapsed / duration, 1);
          var eased = 1 - Math.pow(1 - progress, 4);
          confidenceEl.textContent = Math.round(confValue * eased) + '%';
          if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
    });
    // ---- Page enter animation ----
    var pageMain = document.querySelector('.page-enter');
    if (pageMain) pageMain.classList.add('is-ready');
    document.body.classList.add('is-loaded');
  </script>

</body>
</html>
