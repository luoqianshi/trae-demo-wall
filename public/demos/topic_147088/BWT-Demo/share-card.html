<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BWT — 分享决策卡片</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>

  <!-- BWT Shared Styles -->
  <link rel="stylesheet" href="css/shared.css" />

  <!-- Page-specific styles -->
  <style>
    /* Phone mockup frame */
    .phone-mockup {
      width: 340px;
      height: 620px;
      border-radius: 36px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      background-color: var(--bwt-bg);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 80px rgba(0, 212, 170, 0.04);
    }

    .phone-mockup::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background-color: var(--bwt-bg);
      border-radius: 0 0 16px 16px;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      padding: 36px 16px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Share card frosted glass */
    .share-card {
      flex: 1;
      border-radius: 16px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, rgba(26, 31, 53, 0.95), rgba(18, 22, 43, 0.85));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .share-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--bwt-primary), transparent);
    }

    /* Card header branding */
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .card-logo {
      font-family: var(--bwt-font-display);
      font-weight: 700;
      font-size: 16px;
      color: var(--bwt-text);
    }

    .card-logo-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--bwt-primary);
      border-radius: 50%;
      margin-left: 1px;
      vertical-align: middle;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--bwt-muted);
      margin-left: auto;
    }

    /* Product info */
    .card-product-name {
      font-family: var(--bwt-font-body);
      font-weight: 600;
      font-size: 16px;
      color: var(--bwt-text);
      margin-bottom: 4px;
    }

    .card-product-price {
      font-family: var(--bwt-font-mono);
      font-weight: 600;
      font-size: 20px;
      color: var(--bwt-primary);
    }

    /* Card divider */
    .card-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      margin: 14px 0;
    }

    /* Metrics row */
    .metrics-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
    }

    .metric-item {
      text-align: center;
      flex: 1;
    }

    .metric-label {
      font-size: 10px;
      color: var(--bwt-muted);
      margin-bottom: 6px;
    }

    .metric-value {
      font-family: var(--bwt-font-display);
      font-weight: 700;
      font-size: 18px;
      color: var(--bwt-text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .metric-value.primary {
      color: var(--bwt-primary);
    }

    .metric-value.warning {
      color: var(--bwt-warning);
    }

    /* Small ring indicator */
    .ring-indicator {
      width: 22px;
      height: 22px;
      position: relative;
    }

    .ring-indicator svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    /* Star rating */
    .star-rating {
      display: flex;
      gap: 2px;
      font-size: 10px;
    }

    .star-rating .star {
      color: var(--bwt-warning);
    }

    .star-rating .star.empty {
      color: rgba(255, 184, 77, 0.2);
    }

    /* Gauge indicator */
    .gauge-indicator {
      width: 28px;
      height: 14px;
      position: relative;
      overflow: hidden;
      border-radius: 7px;
      background-color: rgba(255, 255, 255, 0.06);
    }

    .gauge-indicator::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 20%;
      height: 100%;
      border-radius: 7px;
      background: linear-gradient(90deg, var(--bwt-primary), #00ff88);
    }

    /* Conclusion box */
    .conclusion-box {
      text-align: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bwt-primary-dim);
    }

    .conclusion-title {
      font-family: var(--bwt-font-display);
      font-weight: 700;
      font-size: 22px;
      color: var(--bwt-primary);
      margin-bottom: 4px;
    }

    .conclusion-desc {
      font-size: 12px;
      color: var(--bwt-muted);
    }

    /* QR code placeholder */
    .qr-placeholder {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--bwt-primary-dim), rgba(0, 212, 170, 0.08));
      border: 1px solid rgba(0, 212, 170, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .qr-placeholder svg {
      width: 28px;
      height: 28px;
      color: var(--bwt-primary);
      opacity: 0.6;
    }

    /* Card bottom branding */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 12px;
    }

    .card-bottom-text {
      font-size: 10px;
      color: var(--bwt-muted);
    }

    /* Style option thumbnails */
    .style-option {
      width: 80px;
      height: 56px;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      overflow: hidden;
      transition: border-color var(--bwt-transition-fast), transform var(--bwt-transition-fast);
      position: relative;
    }

    .style-option:hover {
      transform: translateY(-2px);
    }

    .style-option.active {
      border-color: var(--bwt-primary);
    }

    .style-option.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .style-option__label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      font-size: 9px;
      color: var(--bwt-text);
      text-align: center;
      padding: 2px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    /* Checkbox styling */
    .bwt-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 8px 0;
    }

    .bwt-checkbox input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--bwt-muted);
      border-radius: 5px;
      background-color: transparent;
      cursor: pointer;
      position: relative;
      transition: background-color var(--bwt-transition-fast), border-color var(--bwt-transition-fast);
      flex-shrink: 0;
    }

    .bwt-checkbox input[type="checkbox"]:checked {
      background-color: var(--bwt-primary);
      border-color: var(--bwt-primary);
    }

    .bwt-checkbox input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 5px;
      width: 5px;
      height: 9px;
      border: solid #0A0E1A;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .bwt-checkbox-label {
      font-size: 14px;
      color: var(--bwt-text);
    }

    /* WeChat icon inline */
    .wechat-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      vertical-align: middle;
    }

    /* Page title */
    .page-title {
      font-family: var(--bwt-font-display);
      font-weight: 700;
      font-size: 28px;
      color: var(--bwt-text);
      letter-spacing: -0.02em;
    }

    /* Settings section label */
    .settings-label {
      font-family: var(--bwt-font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--bwt-text);
      margin-bottom: 12px;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .phone-mockup {
        width: 300px;
        height: 550px;
      }
    }

    @media (max-width: 768px) {
      .page-title {
        font-size: 22px;
      }

      .phone-mockup {
        width: 280px;
        height: 510px;
      }

      .share-card {
        padding: 16px 12px;
      }

      .card-product-name {
        font-size: 14px;
      }

      .card-product-price {
        font-size: 18px;
      }

      .metric-value {
        font-size: 16px;
      }

      .conclusion-title {
        font-size: 20px;
      }
    }

    @media (max-width: 480px) {
      .phone-mockup {
        width: 260px;
        height: 480px;
      }

      .style-option {
        width: 68px;
        height: 48px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

  <script>
    // ---- Style selector (demo only) ----
    function selectStyle(el) {
      if (el.classList.contains('disabled')) {
        showToast('该样式即将上线，敬请期待', 'info');
        return;
      }
      document.querySelectorAll('.style-option').forEach(function(opt) {
        opt.classList.remove('active');
      });
      el.classList.add('active');
    }

    // ---- Download image ----
    function handleDownload() {
      var phoneContent = document.querySelector('.phone-content');
      if (!phoneContent) {
        showToast('未找到分享卡片内容', 'error');
        return;
      }
      showToast('正在生成图片...', 'info');
      if (typeof html2canvas === 'undefined') {
        showToast('图片生成组件加载失败，请截图保存', 'error');
        return;
      }
      html2canvas(phoneContent, {
        backgroundColor: '#0A0E1A',
        scale: 2,
        useCORS: true,
        logging: false
      }).then(function(canvas) {
        var link = document.createElement('a');
        link.download = 'BWT-分享卡片.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('图片已下载', 'success');
      }).catch(function(err) {
        showToast('图片生成失败，请截图保存', 'error');
      });
    }

    // ---- Copy link (demo) ----
    function handleCopyLink() {
      var shareUrl = 'https://bwt.app/share/demo-2024';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(function() {
          showToast('分享链接已复制', 'success');
        }).catch(function() {
          fallbackCopy(shareUrl);
        });
      } else {
        fallbackCopy(shareUrl);
      }
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('分享链接已复制', 'success');
      } catch(e) {
        showToast('复制失败，请手动复制', 'error');
      }
      document.body.removeChild(ta);
    }

    // ---- Share to WeChat (demo) ----
    function handleShareWechat() {
      showToast('请截图保存后，在微信中发送', 'info');
    }
  </script>

  <script>
  // ---- Context-aware share card ----
  (function() {
    var analysis = BWTStore.get('currentAnalysis');

    // Check if coming from comparison
    if (analysis.source === 'comparison') {
      // Update card title
      var cardTitle = document.querySelector('.card-product-name');
      if (cardTitle) cardTitle.textContent = '多品对比结果';

      // Update price to show recommendation
      var cardPrice = document.querySelector('.card-product-price');
      if (cardPrice) cardPrice.textContent = '推荐: Sony XM5';

      // Update subtitle
      var cardSub = document.querySelector('.card-subtitle');
      if (cardSub) cardSub.textContent = 'Sony XM5 vs Bose QC45 vs AirPods Max';

      // Update conclusion
      var concTitle = document.querySelector('.conclusion-title');
      if (concTitle) concTitle.textContent = 'Sony XM5 胜出';

      var concDesc = document.querySelector('.conclusion-desc');
      if (concDesc) concDesc.textContent = '综合 5 维度评分，Sony XM5 以 89.4 分领先';

      // Update metrics - need index to show comparison score
      var metricItems = document.querySelectorAll('.metric-item');

        var label2 = metricItems[1].querySelector('.metric-label');
        if (label2) label2.textContent = '对比商品';
      }
    }
  })();

  document.body.classList.add('is-loaded');
    // ---- Page enter animation ----
    var pageMain = document.querySelector('.page-enter');
    if (pageMain) pageMain.classList.add('is-ready');
  </script>
