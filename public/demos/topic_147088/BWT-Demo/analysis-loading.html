<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BWT AI 分析中...</title>
  <link rel="stylesheet" href="css/shared.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Pulse ring animation for AI thinking circle */
    @keyframes aiPulseRing {
      0% {
        transform: scale(0.8);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.15;
      }
      100% {
        transform: scale(0.8);
        opacity: 0.6;
      }
    }

    @keyframes aiPulseRing2 {
      0% {
        transform: scale(0.9);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.08;
      }
      100% {
        transform: scale(0.9);
        opacity: 0.4;
      }
    }

    @keyframes aiCoreGlow {
      0%, 100% {
        box-shadow: 0 0 30px rgba(0, 212, 170, 0.3), 0 0 60px rgba(0, 212, 170, 0.1);
      }
      50% {
        box-shadow: 0 0 50px rgba(0, 212, 170, 0.5), 0 0 100px rgba(0, 212, 170, 0.2);
      }
    }

    @keyframes spinnerRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes checkPop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes stepFadeIn {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes progressBarGlow {
      0%, 100% {
        box-shadow: 0 0 8px rgba(0, 212, 170, 0.4);
      }
      50% {
        box-shadow: 0 0 16px rgba(0, 212, 170, 0.7);
      }
    }

    .ai-thinking-core {
      animation: aiCoreGlow 2.5s ease-in-out infinite;
    }

    .ai-pulse-ring-1 {
      animation: aiPulseRing 2.5s ease-in-out infinite;
    }

    .ai-pulse-ring-2 {
      animation: aiPulseRing2 2.5s ease-in-out infinite 0.5s;
    }

    .spinner-icon {
      animation: spinnerRotate 1s linear infinite;
    }

    .check-icon {
      animation: checkPop 0.35s ease-out forwards;
    }

    .step-item {
      opacity: 0;
    }

    .step-item.visible {
      animation: stepFadeIn 0.4s ease-out forwards;
    }

    .progress-bar-fill {
      animation: progressBarGlow 1.5s ease-in-out infinite;
    }

    /* Connecting line between steps */
    .step-connector {
      width: 2px;
      height: 20px;
      margin-left: 15px;
      background: linear-gradient(to bottom, rgba(0, 212, 170, 0.3), rgba(0, 212, 170, 0.08));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .step-connector.visible {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-bwt-bg min-h-screen flex flex-col">

  <!-- Navigation -->
  <nav class="bwt-nav">
    <div class="flex items-center gap-4">
      <a href="index.html" class="bwt-nav__logo">
        BWT<span class="bwt-nav__logo-dot"></span>
      </a>
    </div>
    <div class="flex items-center gap-3">
      <a href="analysis-input.html" class="bwt-btn-ghost text-sm">
        &larr; 返回
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col items-center justify-start pt-28 pb-16 px-6">
    <div class="bwt-orb bwt-orb--primary" style="width:500px;height:500px;top:-150px;left:50%;margin-left:-250px;opacity:0.06;"></div>

    <!-- Product Summary Card -->
    <div class="bwt-card flex items-center gap-4 mb-12 max-w-md w-full">
      <!-- Product image placeholder -->
      <div class="w-20 h-20 rounded-xl flex-shrink-0"
           style="background: linear-gradient(135deg, #1a1f35 0%, #0a0e1a 50%, #00D4AA22 100%); border: 1px solid rgba(0, 212, 170, 0.15);">
        <div class="w-full h-full flex items-center justify-center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(0, 212, 170, 0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
          </svg>
        </div>
      </div>
      <div class="flex-1 min-w-0">
        <h3 id="loadingProductName" class="font-body text-bwt-text text-sm font-medium truncate">Sony WH-1000XM5 降噪耳机</h3>
        <p id="loadingPrice" class="font-mono text-bwt-primary text-lg font-bold mt-0.5">&yen;2,299</p>
      </div>
      <span id="loadingBadge" class="bwt-badge bwt-badge--primary flex-shrink-0">数码</span>
    </div>

    <!-- AI Thinking Visualization -->
    <div class="flex flex-col items-center mb-10 w-full max-w-sm">

      <!-- Central Pulse Circle -->
      <div class="relative w-32 h-32 mb-10 flex items-center justify-center">
        <!-- Outer pulse ring 2 -->
        <div class="ai-pulse-ring-2 absolute inset-0 rounded-full border border-bwt-primary/30"></div>
        <!-- Outer pulse ring 1 -->
        <div class="ai-pulse-ring-1 absolute inset-2 rounded-full border border-bwt-primary/50"></div>
        <!-- Core -->
        <div class="ai-thinking-core w-16 h-16 rounded-full bg-bwt-primary/20 border-2 border-bwt-primary flex items-center justify-center relative z-10">
          <div class="w-8 h-8 rounded-full bg-bwt-primary/40 flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a4 4 0 0 1 4 4v2H8V6a4 4 0 0 1 4-4z"/>
              <path d="M12 8v13"/>
              <circle cx="12" cy="21" r="2"/>
              <path d="M8 21h8"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Analysis Steps -->
      <div class="w-full space-y-0">

        <!-- Step 1 -->
        <div class="step-item" id="step-1">
          <div class="flex items-center gap-3 py-2">
            <div class="step-icon w-8 h-8 rounded-full bg-bwt-surface border border-bwt-border flex items-center justify-center flex-shrink-0" id="step-icon-1">
              <svg class="spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </div>
            <span id="step-text-1" class="font-body text-bwt-muted text-sm">正在解析商品信息...</span>
          </div>
        </div>

        <div class="step-connector" id="connector-1"></div>

        <!-- Step 2 -->
        <div class="step-item" id="step-2">
          <div class="flex items-center gap-3 py-2">
            <div class="step-icon w-8 h-8 rounded-full bg-bwt-surface border border-bwt-border flex items-center justify-center flex-shrink-0" id="step-icon-2">
              <svg class="spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </div>
            <span id="step-text-2" class="font-body text-bwt-muted text-sm">正在检索同类商品...</span>
          </div>
        </div>

        <div class="step-connector" id="connector-2"></div>

        <!-- Step 3 -->
        <div class="step-item" id="step-3">
          <div class="flex items-center gap-3 py-2">
            <div class="step-icon w-8 h-8 rounded-full bg-bwt-surface border border-bwt-border flex items-center justify-center flex-shrink-0" id="step-icon-3">
              <svg class="spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </div>
            <span id="step-text-3" class="font-body text-bwt-muted text-sm">正在分析性价比...</span>
          </div>
        </div>

        <div class="step-connector" id="connector-3"></div>

        <!-- Step 4 -->
        <div class="step-item" id="step-4">
          <div class="flex items-center gap-3 py-2">
            <div class="step-icon w-8 h-8 rounded-full bg-bwt-surface border border-bwt-border flex items-center justify-center flex-shrink-0" id="step-icon-4">
              <svg class="spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </div>
            <span id="step-text-4" class="font-body text-bwt-muted text-sm">正在评估需求匹配度...</span>
          </div>
        </div>

        <div class="step-connector" id="connector-4"></div>

        <!-- Step 5 -->
        <div class="step-item" id="step-5">
          <div class="flex items-center gap-3 py-2">
            <div class="step-icon w-8 h-8 rounded-full bg-bwt-surface border border-bwt-border flex items-center justify-center flex-shrink-0" id="step-icon-5">
              <svg class="spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </div>
            <span id="step-text-5" class="font-body text-bwt-muted text-sm">正在生成决策报告...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="w-full max-w-sm mb-4" style="position:relative;">
      <div style="position:absolute;inset:-8px;border-radius:12px;background:radial-gradient(ellipse at center, rgba(0,212,170,0.06), transparent 70%);pointer-events:none;"></div>
      <div class="flex items-center justify-between mb-2">
        <span class="font-body text-bwt-muted text-xs">分析进度</span>
        <span class="font-mono text-bwt-primary text-xs font-medium" id="progress-text">0%</span>
      </div>
      <div class="w-full h-1.5 rounded-full bg-bwt-surface overflow-hidden">
        <div class="progress-bar-fill h-full rounded-full transition-all duration-300 ease-out"
             id="progress-bar"
             style="width: 0%; background: linear-gradient(90deg, #00D4AA, #00E5BB);"></div>
      </div>
    </div>

    <!-- Helper Text -->
    <p class="font-body text-bwt-muted/60 text-xs mt-2 mb-6">通常需要 30 秒左右，请稍候...</p>

    <!-- Skip Link -->
    <a href="analysis-result.html" class="bwt-btn-ghost text-sm text-bwt-muted hover:text-bwt-text transition-colors">
      跳过分析 &rarr;
    </a>

  </main>

  <script src="js/toast.js"></script>
  <script src="js/data-store.js"></script>
  <script>
    // Dynamic content from BWTStore
    (function() {
      var analysis = BWTStore.get('currentAnalysis');
      if (!analysis) return;

      // Update product name
      var nameEl = document.getElementById('loadingProductName');
      if (nameEl) nameEl.textContent = analysis.productName || '未知商品';

      // Update price
      var priceEl = document.getElementById('loadingPrice');
      if (priceEl && analysis.price) {
        priceEl.textContent = '¥' + Number(analysis.price).toLocaleString();
      } else if (priceEl) {
        priceEl.textContent = '分析中...';
      }

      // Update badge
      var badgeEl = document.getElementById('loadingBadge');
      if (badgeEl && analysis.category) {
        badgeEl.textContent = analysis.category;
      }

      // Update step texts based on category
      var steps = BWTStore.getLoadingSteps(analysis.category);
      if (steps) {
        for (var i = 0; i < steps.length; i++) {
          var stepText = document.getElementById('step-text-' + (i + 1));
          if (stepText) stepText.textContent = steps[i];
        }
      }

      // If source is plugin, update first step
      if (analysis.source === 'plugin') {
        var step1 = document.getElementById('step-text-1');
        if (step1) step1.textContent = '正在从浏览器插件获取商品信息...';
      }
    })();

    (function () {
      'use strict';

      var totalSteps = 5;
      var stepDelay = 1500; // ms between steps
      var stepCompleteDelay = 1200; // ms from step appears to step completes
      var redirectDelay = 10000; // ms total before redirect
      var progressDuration = 8000; // ms for progress bar to fill

      // Checkmark SVG
      var checkSvg = '<svg class="check-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

      // Spinner SVG
      var spinnerSvg = '<svg class="spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>';

      // Progress bar animation
      var progressBar = document.getElementById('progress-bar');
      var progressText = document.getElementById('progress-text');
      var progressStart = performance.now();

      function animateProgress(currentTime) {
        var elapsed = currentTime - progressStart;
        var rawProgress = Math.min(elapsed / progressDuration, 1);
        // Ease in-out
        var eased = rawProgress < 0.5
          ? 2 * rawProgress * rawProgress
          : 1 - Math.pow(-2 * rawProgress + 2, 2) / 2;
        var percent = Math.round(eased * 100);
        progressBar.style.width = percent + '%';
        progressText.textContent = '分析进度 ' + percent + '%';

        if (rawProgress < 1) {
          requestAnimationFrame(animateProgress);
        }
      }
      requestAnimationFrame(animateProgress);

      // Step animations
      for (var i = 1; i <= totalSteps; i++) {
        (function (stepNum) {
          // Show step
          var showTime = (stepNum - 1) * stepDelay;
          setTimeout(function () {
            var stepEl = document.getElementById('step-' + stepNum);
            if (stepEl) {
              stepEl.classList.add('visible');
            }
            // Show connector before this step (except step 1)
            if (stepNum > 1) {
              var conn = document.getElementById('connector-' + (stepNum - 1));
              if (conn) conn.classList.add('visible');
            }
          }, showTime);

          // Complete step (spinner -> checkmark)
          var completeTime = showTime + stepCompleteDelay;
          setTimeout(function () {
            var iconEl = document.getElementById('step-icon-' + stepNum);
            if (iconEl) {
              iconEl.innerHTML = checkSvg;
              iconEl.style.borderColor = 'rgba(0, 212, 170, 0.5)';
              iconEl.style.backgroundColor = 'rgba(0, 212, 170, 0.08)';
            }
          }, completeTime);
        })(i);
      }

      // Auto redirect after all steps complete
      setTimeout(function () {
        window.location.href = 'analysis-result.html';
      }, redirectDelay);

    })();

    // ---- Page enter animation ----
    var pageMain = document.querySelector('.page-enter');
    if (pageMain) pageMain.classList.add('is-ready');

    document.body.classList.add('is-loaded');
  </script>

</body>
</html>
