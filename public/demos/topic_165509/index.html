          ${!canBattle ? '<p class="text-muted" style="font-size:0.76rem;margin-top:0.5rem;text-align:center">对战需要至少 5 张卡片</p>' : ''}
        </div>
        ${deckDetailWrongOpen[deck.id] && wrongInDeck > 0 ? `
          <div class="section">
            <div class="section-head">
              <div class="section-title" style="color:var(--dont)">错题列表 (${wrongInDeck})</div>
              <div class="section-action" style="color:var(--ink-soft);font-size:0.76rem" onclick="clearDeckWrong('${deck.id}')">清空本组错题</div>
            </div>
            ${cards.filter(c => Store.isWrongCard(c.id)).map(c => `
              <div class="card-item">
                <div class="ci-status dont"></div>
                <div class="ci-body">
                  <div class="ci-q">${escapeHtml(c.question)}</div>
                  <div class="ci-a">${escapeHtml(c.answer)}</div>
                </div>
                <div class="ci-del" title="从错题移除" onclick="removeFromWrongBook('${c.id}','${deck.id}')">${ICON.x}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <div class="divider"></div>
        <div class="section">
          <div class="section-head">
            <div class="section-title">卡片列表</div>
          </div>
          ${cardsHtml}
        </div>
      `;
    });

    // --- New Card ---
    route('/new-card/:deckId', (p) => {
      const deck = Store.getDeck(p.deckId);
      const deckName = deck ? deck.name : '';
      return `
        <div class="topbar">
          <div class="back-btn" onclick="navigate('/deck/${p.deckId}')">${ICON.back}返回</div>
        </div>
        <div style="padding:0.5rem 1.25rem 1rem">
          <h2 style="font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:-0.02em">添加闪卡</h2>
          <p class="text-muted" style="font-size:0.88rem;margin-top:0.2rem">添加到「${escapeHtml(deckName)}」</p>
        </div>
        <form onsubmit="return false" id="newCardForm">
          <div class="form-group">
            <label class="form-label">问题（正面）</label>
            <textarea class="form-textarea" name="question" placeholder="如：environment 的中文意思？" required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">答案（背面）</label>
            <textarea class="form-textarea" name="answer" placeholder="如：环境" required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">知识点标签</label>
            <input class="form-input" name="tag" placeholder="如：词汇">
          </div>
          <div class="form-group">
            <label class="form-label">难度</label>
            <div class="difficulty-pick">
              <div class="diff-opt" data-val="easy" onclick="pickDiff(this)">简单</div>
              <div class="diff-opt active" data-val="medium" onclick="pickDiff(this)">中等</div>
              <div class="diff-opt" data-val="hard" onclick="pickDiff(this)">困难</div>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" onclick="navigate('/deck/${p.deckId}')">取消</button>
            <button class="btn btn-primary" onclick="submitNewCard('${p.deckId}')">添加卡片</button>
          </div>
        </form>
      `;
    });

    // --- Review (Self-test) ---
    route('/review/:id', (p) => {
      const deck = Store.getDeck(p.id);
      if (!deck) return '<p class="text-center" style="padding:3rem">卡组不存在</p>';
      const cards = Store.getCardsByDeck(deck.id);
      if (!cards.length) return '<p class="text-center" style="padding:3rem">没有卡片可复习</p>';

      // Build adaptive queue only once at start
      if (!reviewSession || reviewSession.deckId !== deck.id) {
        reviewSession = buildAdaptiveQueue(cards);
        reviewSession.deckId = deck.id;
        if (!reviewSession.queue.length) {
          reviewSession.queue = [...cards];
        }
      }

      return renderReviewPage(deck);
    });

    function buildAdaptiveQueue(cards) {
      // Sort: "dont" first, then "fuzzy", then unreviewed, then "know"
      const weighted = cards.map(c => {
        const r = Store.getLatestReview(c.id);
        let weight = 2; // unreviewed: medium
        if (r) {
          if (r.result === 'dont') weight = 0;
          else if (r.result === 'fuzzy') weight = 1;
          else if (r.result === 'know') weight = 3;
        }
        return { card: c, weight };
      });
      weighted.sort((a, b) => a.weight - b.weight);
      const queue = weighted.map(w => w.card);
      return { queue, index: 0, flipped: false, results: [], deckId: null, total: queue.length, requeue: [] };
    }

    function renderReviewPage(deck) {
      const s = reviewSession;
      if (s.index >= s.queue.length) {
        // Finished
        return renderReviewResult(deck);
      }
      const card = s.queue[s.index];
      const progress = s.index + 1;
      const total = s.total;
      const percent = Math.round(progress / total * 100);

      // Generate 2 distractors - smart matching based on subject and tag
      const allCards = Store.getCardsByDeck(deck.id);
      const otherCards = allCards.filter(c => c.id !== card.id && c.answer !== card.answer);
      
      let distractors = [];
      if (deck.subject === '英语') {
        const isEnglishQuestion = /^[a-zA-Z\s!?]+$/.test(card.question);
        distractors = otherCards
          .filter(c => {
            if (isEnglishQuestion) {
              return /^[a-zA-Z\s!?\/]+$/.test(c.answer);
            } else {
              return /[\u4e00-\u9fa5]/.test(c.answer);
            }
          })
          .slice(0, 2)
          .map(c => c.answer);
      } else if (deck.subject === '语文') {
        const targetTag = card.tag;
        const tagGroups = {
          '作者': ['作者'],
          '作者介绍': ['作者介绍'],
          '诗词填空': ['诗词填空'],
        };
        const allowedTags = tagGroups[targetTag] || [];
        if (allowedTags.length > 0) {
          distractors = otherCards
            .filter(c => allowedTags.includes(c.tag))
            .slice(0, 2)
            .map(c => c.answer);
        }
      }
      
      if (distractors.length < 2) {
        distractors = shuffle(otherCards).slice(0, 2).map(c => c.answer);
      }
      const options = shuffle([card.answer, ...distractors]);

      // Preserve chosen options when revealing answer
      if (!s.options || s.optionCardId !== card.id) {
        s.options = options;
        s.optionCardId = card.id;
        s.selected = null;
      }
      const isCorrect = s.selected !== null && s.options[s.selected] === card.answer;

      return `
        <div class="review-header">
          <div class="back-btn" onclick="exitReview('${deck.id}')">${ICON.back}退出</div>
          <div class="review-progress"><strong>${progress}</strong> / ${total}</div>
        </div>
        <div style="padding:0 1.25rem 0.5rem">
          <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
        </div>
        <div class="quiz-split">
          <div class="quiz-left">
            <div class="flashcard-wrap">
              <div class="flashcard static">
                <div class="fc-face fc-front">
                  <div class="fc-label">问题</div>
                  <div class="fc-question">${escapeHtml(card.question)}</div>
                  ${card.tag ? `<div class="fc-tag">${escapeHtml(card.tag)}</div>` : ''}
                </div>
              </div>
            </div>
          </div>
          <div class="quiz-right">
            <div class="mastery-bar choices">
              ${s.options.map((opt, i) => {
                const isCorrect = opt === card.answer;
                const isSelected = s.selected === i;
                let cls = 'choice-btn';
                if (s.selected !== null) {
                  if (isCorrect) cls += ' correct';
                  else if (isSelected) cls += ' wrong';
                }
                return `<button class="${cls}" onclick="chooseAnswer(${i})" ${s.selected!==null?'disabled':''}>
                  <span class="choice-letter">${String.fromCharCode(65 + i)}</span>
                  <span class="choice-text">${escapeHtml(opt)}</span>
                </button>`;
              }).join('')}
            </div>
            ${s.selected !== null ? `
              <div class="choice-feedback">
                <p class="feedback-msg ${isCorrect ? 'correct' : 'wrong'}">
                  ${isCorrect ? '答对了' : '答错了，已加入错题本'}
                </p>
              </div>
            ` : '<p class="tap-hint">选择正确的答案</p>'}
          </div>
        </div>
      `;
    }

    function chooseAnswer(idx) {
      const s = reviewSession;
      if (!s || s.selected !== null) return;
      s.selected = idx;
      const card = s.queue[s.index];
      const isCorrect = s.options[idx] === card.answer;
      const result = isCorrect ? 'know' : 'dont';
      Store.addReview({ cardId: card.id, result });
      s.results.push({ cardId: card.id, result });

      if (isCorrect) {
        render();
        setTimeout(() => { nextCard(); }, 700);
      } else {
        Store.addWrongCard(card.id);
        render();
        setTimeout(() => { nextCard(); }, 1000);
      }
    }

    function nextCard() {
      const s = reviewSession;
      if (!s) return;
      s.index++;
      s.selected = null;
      s.options = null;
      render();
    }

    function exitReview(deckId) {
      reviewSession = null;
      navigate('/deck/' + deckId);
    }

    // --- Review Result ---
    function renderReviewResult(deck) {
      const s = reviewSession;
      const results = s.results;
      const total = results.length;
      const know = results.filter(r => r.result === 'know').length;
      const fuzzy = results.filter(r => r.result === 'fuzzy').length;
      const dont = results.filter(r => r.result === 'dont').length;
      const mastery = total > 0 ? Math.round(know / total * 100) : 0;

      // Weak tags
      const weakCards = results.filter(r => r.result === 'dont').map(r => {
        return Store.state.cards.find(c => c.id === r.cardId);
      }).filter(Boolean);
      const fuzzyCards = results.filter(r => r.result === 'fuzzy').map(r => {
        return Store.state.cards.find(c => c.id === r.cardId);
      }).filter(Boolean);

      const weakTags = [...new Set(weakCards.map(c => c.tag).filter(Boolean))];
      const fuzzyTags = [...new Set(fuzzyCards.map(c => c.tag).filter(Boolean))];

      // Ring
      const circ = 2 * Math.PI * 52;
      const dashOffset = circ * (1 - mastery / 100);

      let message = '';
      if (mastery >= 80) message = '掌握得很好！可以挑战更难的内容';
      else if (mastery >= 50) message = '不错，继续巩固薄弱知识点';
      else message = '别灰心，多复习几次就会进步';

      let weakListHtml = '';
      if (weakCards.length > 0) {
        weakListHtml = `
          <div class="result-section">
            <h3>重点复习（${dont} 张）</h3>
            ${weakCards.map(c => `
              <div class="card-item">
                <div class="ci-status dont"></div>
                <div class="ci-body">
                  <div class="ci-q">${escapeHtml(c.question)}</div>
                  <div class="ci-a">${escapeHtml(c.answer)}</div>
                </div>
              </div>
            `).join('')}
          </div>`;
      }

      let fuzzyListHtml = '';
      if (fuzzyCards.length > 0) {
        fuzzyListHtml = `
          <div class="result-section">
            <h3>需要巩固（${fuzzy} 张）</h3>
            ${fuzzyCards.map(c => `
              <div class="card-item">
                <div class="ci-status fuzzy"></div>
                <div class="ci-body">
                  <div class="ci-q">${escapeHtml(c.question)}</div>
                  <div class="ci-a">${escapeHtml(c.answer)}</div>
                </div>
              </div>
            `).join('')}
          </div>`;
      }

      let tagHtml = '';
      if (weakTags.length > 0 || fuzzyTags.length > 0) {
        tagHtml = `
          <div class="result-section">
            <h3>薄弱标签</h3>
            <div class="tag-cloud">
              ${weakTags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}
              ${fuzzyTags.map(t => `<span class="tag-pill mid">${escapeHtml(t)}</span>`).join('')}
            </div>
          </div>`;
      }

      return `
        <div class="topbar">
          <div class="back-btn" onclick="exitReview('${deck.id}')">${ICON.back}返回</div>
        </div>
        <div class="result-hero">
          <div class="result-ring">
            <svg viewBox="0 0 120 120">
              <circle class="ring-bg" cx="60" cy="60" r="52"/>
              <circle class="ring-fg" cx="60" cy="60" r="52" stroke-dasharray="${circ}" stroke-dashoffset="${dashOffset}"/>
            </svg>
            <div class="ring-num">${mastery}%</div>
          </div>
          <h2>复习完成！</h2>
          <p>${message}</p>
        </div>
        <div class="result-section">
          <div class="stat-row">
            <div class="stat-mini">
              <div class="sm-num" style="color:var(--know)">${know}</div>
              <div class="sm-label">已掌握</div>
            </div>
            <div class="stat-mini">
              <div class="sm-num" style="color:var(--fuzzy)">${fuzzy}</div>
              <div class="sm-label">需巩固</div>
            </div>
            <div class="stat-mini">
              <div class="sm-num" style="color:var(--dont)">${dont}</div>
              <div class="sm-label">未掌握</div>
            </div>
          </div>
        </div>
        ${weakListHtml}
        ${fuzzyListHtml}
        ${tagHtml}
        <div class="form-actions" style="margin-bottom:2rem">
          <button class="btn btn-ghost" onclick="exitReview('${deck.id}')">返回卡组</button>
          <button class="btn btn-primary" onclick="restartReview('${deck.id}')">再复习一轮</button>
        </div>
      `;
    }

    function restartReview(deckId) {
      reviewSession = null;
      navigate('/review/' + deckId);
    }

    // --- Battle ---
    route('/battle/:id', (p) => {
      const deck = Store.getDeck(p.id);
      if (!deck) return '<p class="text-center" style="padding:3rem">卡组不存在</p>';
      const cards = Store.getCardsByDeck(deck.id);
      if (cards.length < 5) return '<p class="text-center" style="padding:3rem">至少需要 5 张卡片才能对战</p>';

      if (!battleSession) {
        return renderBattleSetup(deck);
      }
      return renderBattlePage(deck);
    });

    function renderBattleSetup(deck) {
      return `
        <div class="topbar">
          <div class="back-btn" onclick="navigate('/deck/${deck.id}')">${ICON.back}返回</div>
        </div>
        <div style="padding:0.5rem 1.25rem 1rem">
          <h2 style="font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:-0.02em">双人对战</h2>
          <p class="text-muted" style="font-size:0.88rem;margin-top:0.2rem">同一设备轮流答题，看谁得分更高</p>
        </div>
        <div class="battle-setup">
          <form onsubmit="return false" id="battleForm">
            <div class="form-group" style="padding:0">
              <label class="form-label">玩家 A 姓名</label>
              <input class="form-input" name="playerA" placeholder="如：小明" value="玩家A" required>
            </div>
            <div class="form-group" style="padding:0">
              <label class="form-label">玩家 B 姓名</label>
              <input class="form-input" name="playerB" placeholder="如：小红" value="玩家B" required>
            </div>
            <div class="form-group" style="padding:0">
              <label class="form-label">每人答题轮数</label>
              <div class="select-wrapper">
                <select class="form-select" name="rounds">
                  <option value="3">3 轮（共 6 题）</option>
                  <option value="5" selected>5 轮（共 10 题）</option>
                  <option value="8">8 轮（共 16 题）</option>
                  <option value="10">10 轮（共 20 题）</option>
                  <option value="15">15 轮（共 30 题）</option>
                </select>
                <span class="select-arrow">▼</span>
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-primary" onclick="startBattle('${deck.id}')">开始对战</button>
            </div>
          </form>
        </div>
      `;
    }

    function startBattle(deckId) {
      const form = document.getElementById('battleForm');
      const playerA = form.playerA.value.trim() || '玩家A';
      const playerB = form.playerB.value.trim() || '玩家B';
      const rounds = parseInt(form.rounds.value);
      const deck = Store.getDeck(deckId);
      const cards = Store.getCardsByDeck(deckId);
      const allQuestions = shuffle(cards);
      // Build questions: alternate between players
      const questions = [];
      for (let i = 0; i < rounds; i++) {
        questions.push({ player: 'A', card: allQuestions[(i * 2) % allQuestions.length] });
        questions.push({ player: 'B', card: allQuestions[(i * 2 + 1) % allQuestions.length] });
      }

      battleSession = {
        deckId,
        playerA, playerB,
        scoreA: 0, scoreB: 0,
        questions,
        index: 0,
        showAnswer: false,
        wrongA: [],
        wrongB: []
      };
      render();
    }

    function renderBattlePage(deck) {
      const s = battleSession;
      if (s.index >= s.questions.length) {
        return renderBattleResult(deck);
      }
      const q = s.questions[s.index];
      const currentPlayer = q.player === 'A' ? s.playerA : s.playerB;
      const card = q.card;

      return `
        <div class="topbar">
          <div class="back-btn" onclick="exitBattle('${deck.id}')">${ICON.back}退出</div>
        </div>
        <div class="battle-scoreboard">
          <div class="player-card ${q.player==='A'?'active':''}">
            <div class="pname">${escapeHtml(s.playerA)}</div>
            <div class="pscore">${s.scoreA}</div>
          </div>
          <div class="vs-divider">VS</div>
          <div class="player-card ${q.player==='B'?'active':''}">
            <div class="pname">${escapeHtml(s.playerB)}</div>
            <div class="pscore">${s.scoreB}</div>
          </div>
        </div>
        <div class="turn-indicator">${escapeHtml(currentPlayer)} 的回合 · 第 ${s.index + 1} / ${s.questions.length} 题</div>
        <div class="battle-card">
          <div class="bc-label">问题</div>
          <div class="bc-question">${escapeHtml(card.question)}</div>
          <div class="bc-answer ${s.showAnswer?'show':''}">${escapeHtml(card.answer)}</div>
        </div>
        <div class="battle-actions">
          ${!s.showAnswer ? `
            <button class="btn btn-secondary" onclick="showBattleAnswer()">${ICON.wave}看答案</button>
            <button class="btn btn-ghost" disabled>等待判定</button>
          ` : `
            <button class="btn btn-danger" onclick="judgeBattle(false)">${ICON.x}答错</button>
            <button class="btn btn-primary" onclick="judgeBattle(true)">${ICON.check}答对</button>
          `}
        </div>
        <p class="tap-hint">${s.showAnswer ? '由对方判定回答是否正确' : '心里默答后点击看答案'}</p>
      `;
    }

    function showBattleAnswer() {
      battleSession.showAnswer = true;
      render();
    }

    function judgeBattle(correct) {
      const s = battleSession;
      const q = s.questions[s.index];
      if (correct) {
        if (q.player === 'A') s.scoreA += 10;
        else s.scoreB += 10;
      } else {
        if (q.player === 'A') s.wrongA.push(q.card);
        else s.wrongB.push(q.card);
      }
      s.index++;
      s.showAnswer = false;
      render();
    }

    function exitBattle(deckId) {
      battleSession = null;
      navigate('/deck/' + deckId);
    }

    function renderBattleResult(deck) {
      const s = battleSession;
      const winner = s.scoreA > s.scoreB ? s.playerA : (s.scoreB > s.scoreA ? s.playerB : '平局');
      const isTie = s.scoreA === s.scoreB;

      const weakTagsA = [...new Set(s.wrongA.map(c => c.tag).filter(Boolean))];
      const weakTagsB = [...new Set(s.wrongB.map(c => c.tag).filter(Boolean))];

      Store.addBattle({
        playerA: s.playerA, playerB: s.playerB,
        scoreA: s.scoreA, scoreB: s.scoreB,
        deckId: s.deckId
      });

      return `
        <div class="topbar">
          <div class="back-btn" onclick="exitBattle('${deck.id}')">${ICON.back}返回</div>
        </div>
        <div class="battle-result-hero">
          ${isTie ? '<div class="winner-badge" style="background:var(--ink)">平局！</div>' : `<div class="winner-badge">${escapeHtml(winner)} 获胜！</div>`}
          <div class="battle-scoreboard" style="padding:0">
            <div class="player-card ${s.scoreA>=s.scoreB?'active':''}">
              <div class="pname">${escapeHtml(s.playerA)}</div>
              <div class="pscore">${s.scoreA}</div>
            </div>
            <div class="vs-divider">VS</div>
            <div class="player-card ${s.scoreB>s.scoreA?'active':''}">
              <div class="pname">${escapeHtml(s.playerB)}</div>
              <div class="pscore">${s.scoreB}</div>
            </div>
          </div>
        </div>
        <div class="result-section">
          <div class="stat-row">
            <div class="stat-mini">
              <div class="sm-num">${s.scoreA/10}/${s.questions.length/2}</div>
              <div class="sm-label">${escapeHtml(s.playerA)} 答对</div>
            </div>
            <div class="stat-mini">
              <div class="sm-num">${s.scoreB/10}/${s.questions.length/2}</div>
              <div class="sm-label">${escapeHtml(s.playerB)} 答对</div>
            </div>
          </div>
        </div>
        ${weakTagsA.length || weakTagsB.length ? `
        <div class="result-section">
          <h3>双方薄弱标签</h3>
          ${weakTagsA.length ? `<p style="font-size:0.8rem;color:var(--muted);margin-bottom:0.4rem">${escapeHtml(s.playerA)}</p><div class="tag-cloud" style="margin-bottom:0.6rem">${weakTagsA.map(t=>`<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${weakTagsB.length ? `<p style="font-size:0.8rem;color:var(--muted);margin-bottom:0.4rem">${escapeHtml(s.playerB)}</p><div class="tag-cloud">${weakTagsB.map(t=>`<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        </div>` : ''}
        <div class="form-actions" style="margin-bottom:2rem">
          <button class="btn btn-ghost" onclick="exitBattle('${deck.id}')">返回卡组</button>
          <button class="btn btn-primary" onclick="restartBattle('${deck.id}')">再来一局</button>
        </div>
      `;
    }

    function restartBattle(deckId) {
      battleSession = null;
      location.hash = '/battle/' + deckId;
      render();
    }

    // ==================== Form Handlers ====================
    function submitNewDeck() {
      const form = document.getElementById('newDeckForm');
      const name = form.name.value.trim();
      if (!name) { showToast('请输入卡组名称'); return; }
      Store.addDeck({
        name,
        subject: form.subject.value,
        tags: form.tags.value.trim(),
        createdAt: new Date().toISOString().slice(0, 10)
      });
      showToast('卡组已创建');
      navigate('/home');
    }

    function submitNewCard(deckId) {
      const form = document.getElementById('newCardForm');
      const question = form.question.value.trim();
      const answer = form.answer.value.trim();
      if (!question || !answer) { showToast('请填写问题和答案'); return; }
      const diff = document.querySelector('.diff-opt.active');
      Store.addCard({
        deckId,
        question,
        answer,
        tag: form.tag.value.trim(),
        level: diff ? diff.dataset.val : 'medium'
      });
      showToast('卡片已添加');
      navigate('/deck/' + deckId);
    }

    function pickDiff(el) {
      document.querySelectorAll('.diff-opt').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
    }

    function customConfirm(msg, onConfirm) {
      const modal = document.getElementById('confirmModal');
      const msgEl = document.getElementById('confirmMsg');
      const okBtn = document.getElementById('confirmOk');
      const cancelBtn = document.getElementById('confirmCancel');
      msgEl.textContent = msg;
      modal.style.display = 'flex';
      const cleanup = () => {
        modal.style.display = 'none';
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };
      okBtn.onclick = () => { cleanup(); onConfirm(); };
      cancelBtn.onclick = cleanup;
    }

    function deleteCard(cardId, deckId) {
      customConfirm('确定删除这张卡片？', () => {
        Store.deleteCard(cardId);
        showToast('已删除');
        navigate('/deck/' + deckId);
        setTimeout(render, 50);
      });
    }

    function deleteDeckConfirm(deckId) {
      customConfirm('删除卡组将同时删除所有卡片，确定？', () => {
        Store.deleteDeck(deckId);
        showToast('卡组已删除');
        navigate('/home');
      });
    }

    function resetDeckConfirm(deckId) {
      customConfirm('重置后将清空该卡组的所有练习记录和错题本，确定？', () => {
        Store.resetDeckProgress(deckId);
        showToast('已重置练习记录');
        navigate('/deck/' + deckId);
        setTimeout(render, 50);
      });
    }

    function removeFromWrongBook(cardId, deckId) {
      Store.removeWrongCard(cardId);
      showToast('已从错题移除');
      render();
    }

    function toggleWrongList(deckId) {
      deckDetailWrongOpen[deckId] = !deckDetailWrongOpen[deckId];
      render();
    }

    function clearDeckWrong(deckId) {
      const cards = Store.getCardsByDeck(deckId).filter(c => Store.isWrongCard(c.id));
      if (cards.length === 0) { showToast('本组已无错题'); return; }
      customConfirm('将清空本卡组的所有错题，确定？', () => {
        cards.forEach(c => Store.removeWrongCard(c.id));
        showToast('已清空本组错题');
        render();
      });
    }

    // ==================== Init ====================
    Store.load();
    if (!location.hash) location.hash = '/home';
    render();
  </script>
</body>
</html>
