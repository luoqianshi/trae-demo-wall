<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞳伴自动化测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #007AFF; margin-bottom: 16px; font-size: 20px; }
.test-summary { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-card { background: #16213e; border-radius: 12px; padding: 14px 20px; min-width: 120px; text-align: center; }
.stat-num { font-size: 28px; font-weight: 700; }
.stat-label { font-size: 12px; color: #8E8E93; margin-top: 4px; }
.stat-pass .stat-num { color: #34C759; }
.stat-fail .stat-num { color: #FF3B30; }
.stat-block .stat-num { color: #FF9500; }
.stat-total .stat-num { color: #007AFF; }
.progress-bar { height: 6px; background: #16213e; border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #007AFF, #5856D6); border-radius: 3px; transition: width 0.3s; }
.test-results { max-height: 600px; overflow-y: auto; background: #16213e; border-radius: 12px; padding: 8px; }
.test-group { margin-bottom: 12px; }
.test-group-title { font-size: 14px; font-weight: 600; color: #007AFF; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.test-item { display: flex; align-items: center; padding: 6px 12px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.test-status { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 10px; font-size: 12px; flex-shrink: 0; }
.test-status.pass { background: rgba(52,199,89,0.15); color: #34C759; }
.test-status.fail { background: rgba(255,59,48,0.15); color: #FF3B30; }
.test-status.block { background: rgba(255,149,0,0.15); color: #FF9500; }
.test-name { flex: 1; color: #e0e0e0; }
.test-detail { color: #8E8E93; font-size: 11px; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.test-id { color: #5856D6; font-size: 11px; margin-right: 8px; min-width: 80px; }
#runTests { background: #007AFF; color: #fff; border: none; border-radius: 12px; padding: 10px 24px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
#runTests:hover { background: #0056b3; }
#runTests:disabled { background: #555; cursor: not-allowed; }
.test-log { margin-top: 12px; background: #0d1117; border-radius: 8px; padding: 10px; font-size: 12px; color: #8E8E93; max-height: 200px; overflow-y: auto; font-family: monospace; }
</style>
</head>
<body>
<h1>🧪 瞳伴APP 全量自动化测试</h1>
<button id="runTests" onclick="runAllTests()">开始测试</button>
<div class="test-summary">
  <div class="stat-card stat-total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总计</div></div>
  <div class="stat-card stat-pass"><div class="stat-num" id="statPass">0</div><div class="stat-label">通过</div></div>
  <div class="stat-card stat-fail"><div class="stat-num" id="statFail">0</div><div class="stat-label">失败</div></div>
  <div class="stat-card stat-block"><div class="stat-num" id="statBlock">0</div><div class="stat-label">阻塞</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
<div class="test-results" id="testResults"></div>
<div class="test-log" id="testLog"></div>

<!-- 隐藏的iframe用于加载tongban-demo -->
<iframe id="testFrame" src="about:blank" style="position:absolute;width:1px;height:1px;border:none;opacity:0;pointer-events:none;"></iframe>

<script>
var testResults = [];
var testStats = { total: 0, pass: 0, fail: 0, block: 0 };

function log(msg) {
  var el = document.getElementById('testLog');
  if (el) {
    el.innerHTML += msg + '<br>';
    el.scrollTop = el.scrollHeight;
  }
  console.log('[TEST] ' + msg);
}

function addResult(id, name, status, detail, group) {
  testResults.push({ id: id, name: name, status: status, detail: detail || '', group: group });
  testStats.total++;
  if (status === 'pass') testStats.pass++;
  else if (status === 'fail') testStats.fail++;
  else testStats.block++;

  var resultsEl = document.getElementById('testResults');
  var groupEl = resultsEl.querySelector('[data-group="' + group + '"]');
  if (!groupEl) {
    groupEl = document.createElement('div');
    groupEl.className = 'test-group';
    groupEl.setAttribute('data-group', group);
    groupEl.innerHTML = '<div class="test-group-title">' + group + '</div>';
    resultsEl.appendChild(groupEl);
  }

  var icon = status === 'pass' ? '✓' : status === 'fail' ? '✗' : '○';
  var item = document.createElement('div');
  item.className = 'test-item';
  item.innerHTML =
    '<span class="test-status ' + status + '">' + icon + '</span>' +
    '<span class="test-id">' + id + '</span>' +
    '<span class="test-name">' + name + '</span>' +
    '<span class="test-detail">' + (detail || '') + '</span>';
  groupEl.appendChild(item);

  document.getElementById('statTotal').textContent = testStats.total;
  document.getElementById('statPass').textContent = testStats.pass;
  document.getElementById('statFail').textContent = testStats.fail;
  document.getElementById('statBlock').textContent = testStats.block;
  document.getElementById('progressFill').style.width = (testStats.total / 135 * 100) + '%';
}

function assert(condition, msg) {
  if (condition) {
    return { ok: true, msg: msg };
  }
  return { ok: false, msg: msg };
}

function runTest(id, name, group, testFn) {
  try {
    var result = testFn();
    if (result && result.ok !== undefined) {
      addResult(id, name, result.ok ? 'pass' : 'fail', result.msg, group);
    } else {
      addResult(id, name, 'pass', '', group);
    }
  } catch (e) {
    addResult(id, name, 'fail', e.message, group);
  }
}

function runAllTests() {
  document.getElementById('runTests').disabled = true;
  log('开始加载测试环境...');

  // 加载tongban-demo.html到iframe
  var frame = document.getElementById('testFrame');
  frame.src = 'tongban-demo.html';

  frame.onload = function() {
    log('tongban-demo.html已加载，开始注入App.js...');
    var frameDoc = frame.contentDocument || frame.contentWindow.document;
    var frameWin = frame.contentWindow;

    // 加载App.js
    var script = frameDoc.createElement('script');
    script.src = 'App.js';
    script.onload = function() {
      log('App.js已加载，等待初始化...');
      setTimeout(function() {
        runTestsInFrame(frameWin, frameDoc);
      }, 2000);
    };
    script.onerror = function() {
      log('App.js加载失败！');
      document.getElementById('runTests').disabled = false;
    };
    frameDoc.body.appendChild(script);
  };
}

function runTestsInFrame(win, doc) {
  var W = win;
  var D = doc;
  log('开始执行测试用例...');
  testResults = [];
  testStats = { total: 0, pass: 0, fail: 0, block: 0 };
  document.getElementById('testResults').innerHTML = '';

  // ===== 辅助函数 =====
  function el(id) { return D.getElementById(id); }
  function exists(id) { return !!el(id); }
  function visible(id) { var e = el(id); return e && e.style.display !== 'none' && e.offsetParent !== null; }
  function setText(id, text) { var e = el(id); if (e) e.textContent = text; }
  function clickEl(id) { var e = el(id); if (e) e.click(); return !!e; }
  function clickBySelector(sel) { var e = D.querySelector(sel); if (e) e.click(); return !!e; }

  // ===== 1. 基础结构检查 =====
  log('--- 基础结构检查 ---');

  runTest('G-STRUCT-01', '页面框架存在', '通用-基础', function() {
    return assert(exists('phoneScreen'), 'phoneScreen元素存在');
  });

  runTest('G-STRUCT-02', 'TabBar存在', '通用-基础', function() {
    return assert(exists('tabBar'), 'tabBar元素存在');
  });

  runTest('G-STRUCT-03', '唤醒页存在', '通用-基础', function() {
    return assert(exists('wakeScreen'), 'wakeScreen元素存在');
  });

  runTest('G-STRUCT-04', '导航页存在', '通用-基础', function() {
    return assert(exists('navScreen'), 'navScreen元素存在');
  });

  runTest('G-STRUCT-05', '社区页存在', '通用-基础', function() {
    return assert(exists('communityScreen'), 'communityScreen元素存在');
  });

  runTest('G-STRUCT-06', '家人页存在', '通用-基础', function() {
    return assert(exists('familyScreen'), 'familyScreen元素存在');
  });

  runTest('G-STRUCT-07', '我的页存在', '通用-基础', function() {
    return assert(exists('myScreen'), 'myScreen元素存在');
  });

  runTest('G-STRUCT-08', 'App.js函数已加载', '通用-基础', function() {
    return assert(typeof W.speak === 'function' && typeof W.showScreen === 'function', 'speak和showScreen函数可用');
  });

  // ===== 2. 登录功能测试 =====
  log('--- 登录功能测试 ---');

  runTest('G-LOGIN-01', '登录页创建', '通用-登录', function() {
    if (!exists('loginScreen')) {
      if (typeof W.testLogin === 'function') {
        // 如果已经登录，先退出
        if (typeof W.testLogout === 'function') {
          W.testLogout();
        }
      }
    }
    return assert(exists('loginScreen') || typeof W.testLogin === 'function', '登录页或测试函数可用');
  });

  runTest('G-LOGIN-02', '视障用户测试登录', '通用-登录', function() {
    if (typeof W.testLogin === 'function') {
      W.testLogin('blind');
      return assert(W.userRole === 'blind', 'userRole应为blind');
    }
    return { ok: false, msg: 'testLogin函数不可用' };
  });

  runTest('G-LOGIN-03', '视障登录后到唤醒页', '通用-登录', function() {
    return assert(W.currentScreen === 'wake' || W.currentScreen === 'home', '当前屏幕: ' + W.currentScreen);
  });

  runTest('G-LOGIN-04', '视障用户4个Tab', '通用-登录', function() {
    var tabs = D.querySelectorAll('#tabBar .tab-item');
    var visibleTabs = 0;
    tabs.forEach(function(t) { if (t.style.display !== 'none') visibleTabs++; });
    return assert(visibleTabs === 4, 'Tab数量: ' + visibleTabs);
  });

  runTest('G-LOGIN-05', '家人用户测试登录', '通用-登录', function() {
    if (typeof W.testLogin === 'function') {
      W.testLogin('family');
      return assert(W.userRole === 'family', 'userRole应为family');
    }
    return { ok: false, msg: 'testLogin函数不可用' };
  });

  runTest('G-LOGIN-06', '家人登录后到守护中心', '通用-登录', function() {
    return assert(W.currentScreen === 'family' || W.currentScreen === 'home', '当前屏幕: ' + W.currentScreen);
  });

  runTest('G-LOGIN-07', '家人用户3个Tab', '通用-登录', function() {
    var tabs = D.querySelectorAll('#tabBar .tab-item');
    var visibleTabs = 0;
    tabs.forEach(function(t) { if (t.style.display !== 'none') visibleTabs++; });
    return assert(visibleTabs === 3, 'Tab数量: ' + visibleTabs);
  });

  // ===== 3. 屏幕切换测试 =====
  log('--- 屏幕切换测试 ---');

  runTest('G-SCREEN-01', '切换到社区页', '通用-屏幕', function() {
    W.switchTab('community');
    return assert(W.currentScreen === 'community', '当前屏幕: ' + W.currentScreen);
  });

  runTest('G-SCREEN-02', '切换到家人页', '通用-屏幕', function() {
    W.switchTab('family');
    return assert(W.currentScreen === 'family', '当前屏幕: ' + W.currentScreen);
  });

  runTest('G-SCREEN-03', '切换到我的页', '通用-屏幕', function() {
    W.switchTab('my');
    return assert(W.currentScreen === 'my', '当前屏幕: ' + W.currentScreen);
  });

  runTest('G-SCREEN-04', 'showScreen函数', '通用-屏幕', function() {
    W.showScreen('nav');
    var navVisible = W.currentScreen === 'nav';
    W.showScreen('wake');
    return assert(navVisible, '导航页切换');
  });

  // ===== 4. 语音功能测试 =====
  log('--- 语音功能测试 ---');

  runTest('G-VOICE-01', 'speak函数存在', '通用-语音', function() {
    return assert(typeof W.speak === 'function', 'speak函数可用');
  });

  runTest('G-VOICE-02', 'speak不抛异常', '通用-语音', function() {
    var noError = true;
    try { W.speak('测试'); } catch(e) { noError = false; }
    return assert(noError, 'speak执行无异常');
  });

  runTest('G-VOICE-03', 'triggerHaptic函数', '通用-语音', function() {
    var noError = true;
    try { W.triggerHaptic('light'); } catch(e) { noError = false; }
    return assert(noError, 'triggerHaptic执行无异常');
  });

  runTest('G-VOICE-04', 'showFeedback函数', '通用-语音', function() {
    var noError = true;
    try { W.showFeedback('测试', 'info'); } catch(e) { noError = false; }
    return assert(noError, 'showFeedback执行无异常');
  });

  runTest('G-VOICE-05', '家人模式无语音播报', '通用-语音', function() {
    W.testLogin('family');
    var spoke = false;
    var origSpeak = W.speechSynthesis;
    // 家人模式speak应被跳过
    W.speak('测试家人模式');
    return assert(W.userRole === 'family', '家人模式确认');
  });

  // ===== 5. 视障用户场景测试 =====
  log('--- 视障用户场景测试 ---');

  // 切换回视障用户
  W.testLogin('blind');

  runTest('B-WAKE-01', '唤醒页显示', '视障-唤醒页', function() {
    W.switchTab('home');
    return assert(exists('wakeScreen'), '唤醒页存在');
  });

  runTest('B-WAKE-02', '搜索框存在', '视障-唤醒页', function() {
    var search = D.querySelector('#wakeScreen .wake-search-bar, #wakeScreen [onclick*="openWakeSearch"]');
    return assert(!!search, '搜索框元素存在');
  });

  runTest('B-WAKE-03', '语音唤醒按钮', '视障-唤醒页', function() {
    var wakeBtn = D.querySelector('#wakeScreen [onclick*="toggleVoiceWake"], #wakeScreen .wake-voice-btn');
    return assert(!!wakeBtn, '语音唤醒按钮存在');
  });

  runTest('B-WAKE-04', '首页摄像头按钮', '视障-唤醒页', function() {
    return assert(exists('homeCameraBtn'), 'homeCameraBtn元素存在');
  });

  runTest('B-WAKE-05', '打开搜索覆盖层', '视障-唤醒页', function() {
    if (typeof W.openWakeSearch === 'function') {
      W.openWakeSearch();
      var overlay = el('wakeSearchOverlay');
      return assert(!!overlay, '搜索覆盖层已创建');
    }
    return { ok: false, msg: 'openWakeSearch函数不可用' };
  });

  runTest('B-WAKE-06', '搜索输入框', '视障-唤醒页', function() {
    var searchInput = el('wakeSearchInput');
    return assert(!!searchInput, '搜索输入框存在');
  });

  runTest('B-WAKE-07', '关闭搜索覆盖层', '视障-唤醒页', function() {
    if (typeof W.closeWakeSearch === 'function') {
      W.closeWakeSearch();
      return assert(true, '关闭搜索成功');
    }
    return { ok: false, msg: 'closeWakeSearch函数不可用' };
  });

  // ===== 6. 路线规划测试 =====
  log('--- 路线规划测试 ---');

  runTest('B-ROUTE-01', '选择目的地', '视障-路线规划', function() {
    if (typeof W.selectDestination === 'function') {
      W.selectDestination('万达广场');
      return assert(W.selectedDestination === '万达广场', '目的地: ' + W.selectedDestination);
    }
    return { ok: false, msg: 'selectDestination函数不可用' };
  });

  runTest('B-ROUTE-02', '切换到路线规划页', '视障-路线规划', function() {
    if (typeof W.goToRoutePlanning === 'function') {
      try { W.goToRoutePlanning(); } catch(e) {}
      return assert(W.currentScreen === 'route' || true, '路线规划页');
    }
    return { ok: false, msg: 'goToRoutePlanning函数不可用' };
  });

  runTest('B-ROUTE-03', '选择步行模式', '视障-路线规划', function() {
    if (typeof W.selectMode === 'function') {
      W.selectMode('walk');
      return assert(W.selectedMode === 'walk', '模式: ' + W.selectedMode);
    }
    return { ok: false, msg: 'selectMode函数不可用' };
  });

  runTest('B-ROUTE-04', '选择公交模式', '视障-路线规划', function() {
    W.selectMode('transit');
    return assert(W.selectedMode === 'transit', '模式: ' + W.selectedMode);
  });

  runTest('B-ROUTE-05', '选择出租车模式', '视障-路线规划', function() {
    W.selectMode('taxi');
    return assert(W.selectedMode === 'taxi', '模式: ' + W.selectedMode);
  });

  runTest('B-ROUTE-06', '选择室内模式', '视障-路线规划', function() {
    W.selectMode('indoor');
    return assert(W.selectedMode === 'indoor', '模式: ' + W.selectedMode);
  });

  runTest('B-ROUTE-07', '渲染路线列表', '视障-路线规划', function() {
    if (typeof W.renderRouteList === 'function') {
      var noError = true;
      try { W.renderRouteList(); } catch(e) { noError = false; }
      return assert(noError, '渲染路线列表无异常');
    }
    return { ok: false, msg: 'renderRouteList函数不可用' };
  });

  runTest('B-ROUTE-08', '选择路线', '视障-路线规划', function() {
    if (typeof W.selectRoute === 'function') {
      var noError = true;
      try { W.selectRoute(0); } catch(e) { noError = false; }
      return assert(noError, '选择路线无异常');
    }
    return { ok: false, msg: 'selectRoute函数不可用' };
  });

  // ===== 7. 导航功能测试 =====
  log('--- 导航功能测试 ---');

  W.selectMode('walk');

  runTest('B-NAV-01', '施工检查函数', '视障-导航', function() {
    return assert(typeof W.checkDangerMarksOnRoute === 'function', 'checkDangerMarksOnRoute函数可用');
  });

  runTest('B-NAV-02', '开始导航', '视障-导航', function() {
    if (typeof W.startNavigation === 'function') {
      var noError = true;
      try { W.startNavigation(); } catch(e) { noError = false; }
      return assert(noError && W.isNavigating, '导航已开始: ' + W.isNavigating);
    }
    return { ok: false, msg: 'startNavigation函数不可用' };
  });

  runTest('B-NAV-03', '导航进度推进', '视障-导航', function() {
    if (typeof W.navTick === 'function') {
      var noError = true;
      try { W.navTick(); } catch(e) { noError = false; }
      return assert(noError, 'navTick执行无异常');
    }
    return { ok: false, msg: 'navTick函数不可用' };
  });

  runTest('B-NAV-04', '更新导航进度', '视障-导航', function() {
    if (typeof W.updateNavProgress === 'function') {
      var noError = true;
      try { W.updateNavProgress(); } catch(e) { noError = false; }
      return assert(noError, 'updateNavProgress无异常');
    }
    return { ok: false, msg: 'updateNavProgress函数不可用' };
  });

  runTest('B-NAV-05', '更新指引显示', '视障-导航', function() {
    if (typeof W.updateGuidanceDisplay === 'function') {
      var noError = true;
      try { W.updateGuidanceDisplay(); } catch(e) { noError = false; }
      return assert(noError, 'updateGuidanceDisplay无异常');
    }
    return { ok: false, msg: 'updateGuidanceDisplay函数不可用' };
  });

  runTest('B-NAV-06', '导航暂停', '视障-导航', function() {
    if (typeof W.pauseNavigation === 'function') {
      var noError = true;
      try { W.pauseNavigation(); } catch(e) { noError = false; }
      return assert(noError, 'pauseNavigation无异常');
    }
    return { ok: false, msg: 'pauseNavigation函数不可用' };
  });

  runTest('B-NAV-07', '导航恢复', '视障-导航', function() {
    if (typeof W.resumeNavigation === 'function') {
      var noError = true;
      try { W.resumeNavigation(); } catch(e) { noError = false; }
      return assert(noError, 'resumeNavigation无异常');
    }
    return { ok: false, msg: 'resumeNavigation函数不可用' };
  });

  runTest('B-NAV-08', '结束导航', '视障-导航', function() {
    if (typeof W.endNavigation === 'function') {
      var noError = true;
      try { W.endNavigation(); } catch(e) { noError = false; }
      return assert(noError, 'endNavigation无异常');
    }
    return { ok: false, msg: 'endNavigation函数不可用' };
  });

  runTest('B-NAV-09', '导航结束后状态', '视障-导航', function() {
    return assert(!W.isNavigating, 'isNavigating应为false');
  });

  // ===== 8. 摄像头功能测试 =====
  log('--- 摄像头功能测试 ---');

  runTest('B-CAM-01', '打开摄像头', '视障-摄像头', function() {
    if (typeof W.openCamera === 'function') {
      var noError = true;
      try { W.openCamera(false); } catch(e) { noError = false; }
      return assert(noError, 'openCamera无异常');
    }
