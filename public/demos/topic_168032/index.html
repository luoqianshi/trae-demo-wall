<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>知味 - 我想看，AI就生成 | Show Me Wanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #FF6B6B;
    --primary-dark: #EE5A5A;
    --primary-light: #FF8E8E;
    --gradient-start: #FF6B6B;
    --gradient-end: #FF8E53;
    --bg-main: #FFFAF8;
    --bg-card: #FFFFFF;
    --text-primary: #2D2D2D;
    --text-secondary: #666666;
    --text-tertiary: #999999;
    --border-light: #F0EBE8;
    --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.06);
    --shadow-medium: 0 4px 20px rgba(0, 0, 0, 0.08);
    --radius-card: 16px;
    --radius-button: 24px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: linear-gradient(135deg, #f5f0eb 0%, #e8ddd4 100%);
    color: var(--text-primary);
    overflow: hidden;
  }

  .phone-frame {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100vh;
    max-height: 932px;
    margin: 0 auto;
    background: var(--bg-main);
    overflow: hidden;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
  }

  @media (min-width: 500px) {
    .phone-frame {
      height: 90vh;
      margin-top: 5vh;
      border-radius: 48px;
      border: 10px solid #1a1a1a;
    }
    .phone-frame::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #1a1a1a;
      border-radius: 20px;
      z-index: 1000;
    }
  }

  .status-bar {
    height: 44px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    background: var(--bg-main);
    flex-shrink: 0;
    z-index: 100;
    position: relative;
  }

  .status-bar .right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .view-container {
    position: relative;
    width: 100%;
    height: calc(100% - 44px);
    overflow: hidden;
  }

  .view {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg-main);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .view.hidden-left {
    transform: translateX(-30%);
    opacity: 0.5;
  }

  .view.hidden-right {
    transform: translateX(100%);
  }

  .scroll-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .scroll-content::-webkit-scrollbar {
    display: none;
  }

  .nav-bar {
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-main);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    font-family: 'Noto Serif SC', serif;
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .nav-icons {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .nav-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
  }

  .nav-icon svg {
    width: 24px;
    height: 24px;
    stroke: var(--text-primary);
    stroke-width: 1.8;
  }

  .badge-dot {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    border: 2px solid var(--bg-main);
  }

  .category-tabs {
    padding: 8px 16px 12px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    background: var(--bg-main);
    z-index: 5;
  }

  .category-tabs::-webkit-scrollbar {
    display: none;
  }

  .category-tab {
    flex-shrink: 0;
    padding: 8px 18px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }

  .category-tab.active {
    color: var(--primary);
    font-weight: 600;
    position: relative;
  }

  .category-tab.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 3px;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    border-radius: 2px;
  }

  .waterfall-container {
    padding: 8px 12px 100px;
    columns: 2;
    column-gap: 10px;
  }

  .topic-card {
    break-inside: avoid;
    margin-bottom: 10px;
    background: var(--bg-card);
    border-radius: var(--radius-card);
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.5s ease forwards;
  }

  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .topic-card:active {
    transform: scale(0.97);
  }

  .card-image {
    position: relative;
    width: 100%;
    background: linear-gradient(135deg, #f0e6e0, #e8ddd4);
    overflow: hidden;
  }

  .card-image svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-image .ai-tag {
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 3px 8px;
    background: rgba(255, 107, 107, 0.9);
    color: white;
    font-size: 10px;
    font-weight: 600;
    border-radius: 10px;
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .card-content {
    padding: 10px 12px 12px;
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text-primary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-author {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }

  .author-avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFB6B9, #FAE3D9);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }

  .author-name {
    font-size: 12px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-likes {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 12px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  .card-likes svg {
    width: 14px;
    height: 14px;
    stroke: var(--text-tertiary);
    stroke-width: 2;
    fill: none;
  }

  .loading-more {
    padding: 20px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 13px;
  }

  .loading-more .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    padding-bottom: 8px;
    background: rgba(255, 250, 248, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 50;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    padding: 8px 16px;
  }

  .nav-item svg {
    width: 24px;
    height: 24px;
    stroke: var(--text-tertiary);
    stroke-width: 1.8;
    fill: none;
    transition: all 0.25s ease;
  }

  .nav-item.active svg {
    stroke: var(--primary);
  }

  .nav-item.active .nav-label {
    color: var(--primary);
  }

  .nav-label {
    font-size: 10px;
    color: var(--text-tertiary);
    transition: color 0.25s ease;
  }

  .publish-btn {
    width: 48px;
    height: 32px;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
  }

  .publish-btn svg {
    stroke: white;
    width: 20px;
    height: 20px;
  }

  .article-nav {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
    transition: background 0.3s ease;
  }

  .article-nav.scrolled {
    background: rgba(255, 250, 248, 0.95);
    backdrop-filter: blur(20px);
    box-shadow: var(--shadow-soft);
  }

  .nav-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-soft);
    transition: transform 0.2s ease;
  }

  .nav-btn:active {
    transform: scale(0.9);
  }

  .nav-btn svg {
    width: 20px;
    height: 20px;
    stroke: var(--text-primary);
    stroke-width: 2;
  }

  .article-header {
    position: relative;
    width: 100%;
  }

  .article-cover {
    width: 100%;
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #FFB6B9, #FAE3D9);
    position: relative;
    overflow: hidden;
  }

  .article-cover::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60%;
    background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
  }

  .article-title-overlay {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    z-index: 5;
  }

  .article-title-overlay h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 700;
    color: white;
    line-height: 1.4;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  .article-body {
    padding: 24px 20px 120px;
  }

  .article-author-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-light);
  }

  .author-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .author-info .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFB6B9, #FAE3D9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .author-detail {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .author-detail .name {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .verified-badge {
    width: 14px;
    height: 14px;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 8px;
  }

  .author-detail .meta {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .follow-btn {
    padding: 6px 16px;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    color: white;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
  }

  .article-content {
    font-size: 16px;
    line-height: 1.8;
    color: #333;
  }

  .article-content p {
    margin-bottom: 18px;
  }

  .article-content p:first-of-type::first-letter {
    font-family: 'Noto Serif SC', serif;
    font-size: 42px;
    font-weight: 700;
    float: left;
    line-height: 1;
    margin-right: 8px;
    margin-top: 4px;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .article-content h2 {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    font-weight: 700;
    margin: 32px 0 16px;
    color: var(--text-primary);
    position: relative;
    padding-left: 12px;
  }

  .article-content h2::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 20px;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    border-radius: 2px;
  }

  .article-content blockquote {
    margin: 20px 0;
    padding: 16px 20px;
    background: linear-gradient(135deg, #FFF5F5, #FFF0EB);
    border-left: 4px solid var(--primary);
    border-radius: 0 12px 12px 0;
    font-style: italic;
    color: #555;
    font-size: 15px;
  }

  .evidence-section {
    margin: 32px 0;
    padding: 20px;
    background: linear-gradient(135deg, #F0F9FF, #E8F4FD);
    border-radius: 16px;
    border: 1px solid #D6EAF8;
  }

  .evidence-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 700;
    color: #2C7DA0;
    margin-bottom: 16px;
  }

  .evidence-title svg {
    width: 20px;
    height: 20px;
    stroke: #2C7DA0;
    stroke-width: 2;
  }

  .evidence-item {
    background: white;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(44, 125, 160, 0.08);
  }

  .evidence-item:last-child {
    margin-bottom: 0;
  }

  .evidence-item .study-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .evidence-item .study-source {
    font-size: 12px;
    color: #2C7DA0;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .evidence-item .study-source .journal {
    background: #E8F4FD;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }

  .evidence-item .study-conclusion {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .source-section {
    margin: 32px 0;
    padding: 16px 20px;
    background: #FAFAFA;
    border-radius: 12px;
    border: 1px dashed #DDD;
  }

  .source-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .source-header svg {
    width: 18px;
    height: 18px;
    stroke: var(--text-secondary);
    stroke-width: 2;
  }

  .source-header span {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .source-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .source-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .source-item .label {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .source-item .value {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 500;
  }

  .confidence-bar {
    margin-top: 12px;
  }

  .confidence-bar .bar-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 12px;
  }

  .confidence-bar .bar-header .label {
    color: var(--text-tertiary);
  }

  .confidence-bar .bar-header .value {
    color: #27AE60;
    font-weight: 600;
  }

  .confidence-bar .bar-track {
    height: 6px;
    background: #E8E8E8;
    border-radius: 3px;
    overflow: hidden;
  }

  .confidence-bar .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #27AE60, #2ECC71);
    border-radius: 3px;
    transition: width 1s ease;
  }

  .article-bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px 24px;
    background: rgba(255, 250, 248, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 30;
  }

  .comment-input {
    flex: 1;
    height: 38px;
    padding: 0 16px;
    background: #F5F0EB;
    border-radius: 19px;
    font-size: 14px;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  .action-btns {
    display: flex;
    gap: 16px;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    position: relative;
  }

  .action-btn svg {
    width: 22px;
    height: 22px;
    stroke: var(--text-secondary);
    stroke-width: 1.8;
    fill: none;
    transition: all 0.25s ease;
  }

  .action-btn .count {
    font-size: 10px;
    color: var(--text-tertiary);
  }

  .action-btn.liked svg {
    fill: var(--primary);
    stroke: var(--primary);
    animation: heartBeat 0.4s ease;
  }

  .action-btn.liked .count {
    color: var(--primary);
  }

  .action-btn.favorited svg {
    fill: #FFD93D;
    stroke: #FFD93D;
  }

  @keyframes heartBeat {
    0% { transform: scale(1); }
    30% { transform: scale(1.3); }
    60% { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  .skeleton {
    position: relative;
    overflow: hidden;
    background: #f0ebe8;
  }

  .skeleton::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: shimmer 1.2s infinite;
  }

  @keyframes shimmer {
    100% { left: 100%; }
  }

  .ai-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 16px;
  }

  .ai-loading-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 1.5s ease-in-out infinite;
  }

  .ai-loading-icon svg {
    width: 24px;
    height: 24px;
    stroke: white;
    stroke-width: 2;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
  }

  .ai-loading-text {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .ai-loading-dots {
    display: inline-flex;
    gap: 3px;
  }

  .ai-loading-dots span {
    width: 6px;
    height: 6px;
    background: var(--primary);
    border-radius: 50%;
    animation: dotBounce 1.4s ease-in-out infinite;
  }

  .ai-loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .ai-loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotBounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">

    const height = width * h / w;
    return `
      <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="grad-${icon}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:${color1}"/>
            <stop offset="100%" style="stop-color:${color2}"/>
          </linearGradient>
          <filter id="glow-${icon}">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="${width}" height="${height}" fill="url(#grad-${icon})"/>
        <circle cx="${width * 0.7}" cy="${height * 0.3}" r="${width * 0.25}" fill="rgba(255,255,255,0.15)"/>
        <circle cx="${width * 0.2}" cy="${height * 0.7}" r="${width * 0.18}" fill="rgba(255,255,255,0.1)"/>
        <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-size="${width * 0.35}" filter="url(#glow-${icon})">${icon}</text>
      </svg>
    `;
  }

  function createCard(topic, index) {
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.style.animationDelay = `${index * 0.08}s`;
    card.dataset.id = topic.id;

    card.innerHTML = `
      <div class="card-image" style="aspect-ratio: ${topic.ratio};">
        ${generateCardSVG(topic.color1, topic.color2, topic.icon, topic.ratio)}
        ${topic.isAIGenerated ? '<div class="ai-tag"><span>✨</span>AI生成</div>' : ''}
      </div>
      <div class="card-content">
        <div class="card-title">${topic.title}</div>
        <div class="card-meta">
          <div class="card-author">
            <div class="author-avatar">${topic.author.avatar}</div>
            <span class="author-name">${topic.author.name}</span>
          </div>
          <div class="card-likes">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>${formatNumber(topic.likes)}</span>
          </div>
        </div>
      </div>
    `;

    card.addEventListener('click', () => openArticle(topic.id));
    return card;
  }

  function formatNumber(num) {
    if (num >= 10000) return (num / 10000).toFixed(1) + 'w';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return num;
  }

  function initCards() {
    const container = document.getElementById('cardContainer');
    topicsData.forEach((topic, index) => {
      container.appendChild(createCard(topic, index));
    });
  }

  let loadMoreInProgress = false;
  let loadCount = 0;

  function loadMoreCards() {
    if (loadMoreInProgress || loadCount >= 2) return;
    loadMoreInProgress = true;

    const loadingMore = document.getElementById('loadingMore');
    loadingMore.style.display = 'block';

    setTimeout(() => {
      const container = document.getElementById('cardContainer');
      const existingCards = container.children.length;
      moreTopics.forEach((topic, index) => {
        const card = createCard(topic, existingCards + index);
        container.appendChild(card);
      });
      loadingMore.style.display = 'none';
      loadMoreInProgress = false;
      loadCount++;
    }, 1200);
  }

  document.getElementById('homeScroll').addEventListener('scroll', function() {
    const scrollTop = this.scrollTop;
    const scrollHeight = this.scrollHeight;
    const clientHeight = this.clientHeight;

    if (scrollTop + clientHeight >= scrollHeight - 200) {
      loadMoreCards();
    }
  });

  const categoryTabs = document.querySelectorAll('.category-tab');
  categoryTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      categoryTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });
  });

  function openArticle(id) {
    const articleView = document.getElementById('articleView');
    const homeView = document.getElementById('homeView');

    renderArticle(id);

    homeView.classList.add('hidden-left');
    articleView.classList.remove('hidden-right');

    document.getElementById('articleScroll').scrollTop = 0;
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    const articleView = document.getElementById('articleView');
    const homeView = document.getElementById('homeView');

    articleView.classList.add('hidden-right');
    homeView.classList.remove('hidden-left');
  });

  function renderArticle(id) {
    const article = articles[id];
    const container = document.getElementById('articleContent');

    container.innerHTML = `
      <div class="ai-loading">
        <div class="ai-loading-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2a3 3 0 0 0-3 3v2h6V5a3 3 0 0 0-3-3z" stroke-linecap="round"/><path d="M19 14v-2a7 7 0 0 0-14 0v2" stroke-linecap="round"/><path d="M5 15h14l-1 6H6l-1-6z" stroke-linejoin="round"/></svg>
        </div>
        <div class="ai-loading-text">
          AI正在生成深度文章
          <span class="ai-loading-dots"><span></span><span></span><span></span></span>
        </div>
      </div>
    `;

    const delay = 800 + Math.random() * 700;

    setTimeout(() => {
      if (article) {
        renderFullArticle(article);
      } else {
        renderPlaceholderArticle(id);
      }
    }, delay);
  }

  function renderFullArticle(article) {
    const container = document.getElementById('articleContent');

    let contentHtml = '';
    article.content.forEach(block => {
      if (block.type === 'text') {
        contentHtml += `<p>${block.content}</p>`;
      } else if (block.type === 'heading') {
        contentHtml += `<h2>${block.content}</h2>`;
      } else if (block.type === 'quote') {
        contentHtml += `<blockquote>${block.content}</blockquote>`;
      }
    });

    let evidenceHtml = '';
    article.scientificEvidence.forEach(item => {
      evidenceHtml += `
        <div class="evidence-item">
          <div class="study-title">${item.title}</div>
          <div class="study-source">
            <span class="journal">${item.source}</span>
            <span>· ${item.year}年</span>
          </div>
          <div class="study-conclusion">${item.conclusion}</div>
        </div>
      `;
    });

    container.innerHTML = `
      <div class="article-header">
        <div class="article-cover">
          <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
            <defs>
              <linearGradient id="articleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:${article.coverColor1}"/>
                <stop offset="100%" style="stop-color:${article.coverColor2}"/>
              </linearGradient>
            </defs>
            <rect width="400" height="300" fill="url(#articleGrad)"/>
            <circle cx="320" cy="80" r="80" fill="rgba(255,255,255,0.15)"/>
            <circle cx="80" cy="220" r="60" fill="rgba(255,255,255,0.1)"/>
            <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-size="120">${article.coverIcon}</text>
          </svg>
          <div class="article-title-overlay">
            <h1>${article.title}</h1>
          </div>
        </div>
      </div>
      <div class="article-body">
        <div class="article-author-bar">
          <div class="author-info">
            <div class="avatar">${article.author.avatar}</div>
            <div class="author-detail">
              <div class="name">
                ${article.author.name}
                ${article.author.verified ? '<span class="verified-badge">✓</span>' : ''}
              </div>
              <div class="meta">${article.publishTime} · ${formatNumber(article.readCount)}阅读</div>
            </div>
          </div>
          <button class="follow-btn">关注</button>
        </div>
        <div class="article-content">
          ${contentHtml}
        </div>
        <div class="evidence-section">
          <div class="evidence-title">
            <svg viewBox="0 0 24 24" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            科学依据
          </div>
          ${evidenceHtml}
        </div>
        <div class="source-section">
          <div class="source-header">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01" stroke-linecap="round"/></svg>
            <span>内容来源信息</span>
          </div>
          <div class="source-grid">
            <div class="source-item">
              <span class="label">生成者</span>
              <span class="value">${article.sourceInfo.generatedBy}</span>
            </div>
            <div class="source-item">
              <span class="label">生成时间</span>
              <span class="value">${article.sourceInfo.generateTime}</span>
            </div>
            <div class="source-item">
              <span class="label">审核状态</span>
              <span class="value" style="color:#27AE60;">${article.sourceInfo.reviewStatus}</span>
            </div>
          </div>
          <div class="confidence-bar">
            <div class="bar-header">
              <span class="label">内容可信度</span>
              <span class="value">${article.sourceInfo.confidence}%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:0%;" id="confidenceFill"></div>
            </div>
          </div>
        </div>
      </div>
    `;

    setTimeout(() => {
      const fill = document.getElementById('confidenceFill');
      if (fill) {
        fill.style.width = article.sourceInfo.confidence + '%';
      }
    }, 100);

    document.getElementById('likeCount').textContent = formatNumber(article.likes);
    document.getElementById('favCount').textContent = formatNumber(article.favorites);
    document.getElementById('commentCount').textContent = formatNumber(article.comments);

    document.getElementById('likeBtn').classList.remove('liked');
    document.getElementById('favoriteBtn').classList.remove('favorited');
  }

  function renderPlaceholderArticle(id) {
    const topic = [...topicsData, ...moreTopics].find(t => t.id === id);
    const container = document.getElementById('articleContent');

    if (!topic) return;

    const placeholderArticle = {
      title: topic.title,
      coverColor1: topic.color1,
      coverColor2: topic.color2,
      coverIcon: topic.icon,
      author: { name: topic.author.name, avatar: topic.author.avatar, verified: topic.isAIGenerated },
      publishTime: '2026年7月15日',
      readCount: Math.floor(Math.random() * 50000 + 10000),
      content: [
        { type: 'text', content: '这是一篇由AI生成的深度文章。我们的AI系统正在为您精心撰写内容，结合最新的科学研究和权威数据来源，为您呈现最有价值的信息。' },
        { type: 'heading', content: '引言' },
        { type: 'text', content: '在当今信息爆炸的时代，获取高质量的知识变得越来越重要。我们的AI内容生成系统致力于为您提供经过验证、有科学依据的深度内容。' },
        { type: 'quote', content: '每一篇AI生成的文章都经过严格的审核流程，确保内容的准确性和可信度。' },
        { type: 'heading', content: '核心观点' },
        { type: 'text', content: '本文将从多个角度深入探讨这个话题，结合最新的研究成果，帮助您获得全面而深入的理解。我们相信，知识的力量在于它的深度和广度。' },
        { type: 'text', content: '在接下来的内容中，您将看到相关的科学研究依据，以及这些研究是如何支持本文观点的。我们始终坚持用数据说话，用研究佐证。' },
      ],
      scientificEvidence: [
        {
          title: '相关领域的最新研究进展',
          source: '《自然》子刊',
          year: 2025,
          conclusion: '最新研究表明，该领域的发展速度正在加快，新的发现不断涌现，为我们理解相关问题提供了更多维度的视角。'
        },
        {
          title: '大规模流行病学调查数据',
          source: '《柳叶刀》',
          year: 2024,
          conclusion: '基于超过10万人的调查数据显示，相关因素对健康的影响具有统计学显著性，值得进一步深入研究和关注。'
        }
      ],
      sourceInfo: {
        generatedBy: topic.isAIGenerated ? topic.author.name : '知味AI助手 v3.2',
        generateTime: '2026-07-15 ' + (Math.floor(Math.random() * 12) + 8).toString().padStart(2, '0') + ':' + Math.floor(Math.random() * 60).toString().padStart(2, '0'),
        reviewStatus: 'AI自动审核中',
        confidence: 85 + Math.floor(Math.random() * 10)
      },
      likes: topic.likes,
      comments: Math.floor(topic.likes * 0.05),
      favorites: Math.floor(topic.likes * 0.35)
    };

    renderFullArticle(placeholderArticle);
  }

  const likeBtn = document.getElementById('likeBtn');
  const favoriteBtn = document.getElementById('favoriteBtn');
  let liked = false;
  let favorited = false;

  likeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    liked = !liked;
    likeBtn.classList.toggle('liked', liked);
  });

  favoriteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    favorited = !favorited;
    favoriteBtn.classList.toggle('favorited', favorited);
  });

  document.getElementById('articleScroll').addEventListener('scroll', function() {
    const nav = document.getElementById('articleNav');
    if (this.scrollTop > 150) {
      nav.classList.add('scrolled');
    } else {
      nav.classList.remove('scrolled');
    }
  });

  initCards();
</script>

</body>
</html>
