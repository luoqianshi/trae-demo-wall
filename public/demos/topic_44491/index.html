/* ===== 生成故事 ===== */
var lastIdx={};
function getStory(habit,theme,name){
  var key=theme+'_'+habit;
  if(!S[theme]||!S[theme][habit]) return null;
  var arr=S[theme][habit];
  if(!lastIdx[key]) lastIdx[key]=-1;
  var idx=(lastIdx[key]+1+Math.floor(Math.random()*(arr.length-1)))%arr.length;
  lastIdx[key]=idx;
  var text=arr[idx].replace(/{N}/g,name);
  return text;
}
function getMission(habit,theme,name){
  var h=H[habit]||{n:'好习惯'};
  var t=T[theme]||{n:'故事'};
  var missions=[
    '像'+name+'一样，今天试试'+h.n+'，成为'+t.n+'世界里的小英雄吧！',
    name+'做到了！现在轮到你了，今天'+h.n+'，你也能做到！',
    '和'+name+'一起行动吧！今天'+h.n+'，你就是最棒的小勇士！'
  ];
  return missions[Math.floor(Math.random()*missions.length)];
}
function getTitle(habit,theme,name){
  var h=H[habit]||{n:'好习惯'};var t=T[theme]||{n:'故事'};
  var titles=[
    name+'的'+t.n+h.n+'大冒险',
    t.n+'里的'+h.n+'小英雄'+name,
    name+'和'+t.n+'的'+h.n+'魔法',
    name+'如何打败'+h.n+'小怪兽'
  ];
  return titles[Math.floor(Math.random()*titles.length)];
}

/* ===== 生成主函数 ===== */
function generateStory(){
  var name=document.getElementById('childName').value.trim()||'小宝贝';
  var habit=document.getElementById('habitSelect').value;
  var theme=document.getElementById('themeSelect').value;
  var story=getStory(habit,theme,name);
  if(!story){alert('故事生成失败，请重试');return;}
  document.getElementById('storySection').classList.remove('active');
  document.getElementById('loadingBox').classList.add('active');
  document.getElementById('loadingName').textContent=name;
  stopSpeech();
  setTimeout(function(){
    var paras=story.split('\n\n').filter(function(p){return p.trim();});
    document.getElementById('storyAvatar').textContent=T[theme].e;
    document.getElementById('storyTitle').textContent=getTitle(habit,theme,name);
    document.getElementById('storyTagHabit').textContent=(H[habit].e)+' '+H[habit].n;
    document.getElementById('storyTagTheme').textContent=(T[theme].e)+' '+T[theme].n;
    document.getElementById('storyBody').innerHTML=paras.map(function(p){
      return '<p>'+p.replace(new RegExp(name,'g'),'<strong style="color:var(--orange)">'+name+'</strong>')+'</p>';
    }).join('');
    document.getElementById('storyMission').textContent=getMission(habit,theme,name);
    document.getElementById('loadingBox').classList.remove('active');
    document.getElementById('storySection').classList.add('active');
    setTimeout(function(){document.getElementById('storySection').scrollIntoView({behavior:'smooth',block:'start'});},100);
    spawnConfetti();
    currentStoryText=story.replace(new RegExp(name,'g'),name);
  },1800+Math.random()*700);
}

/* ===== 语音朗读 ===== */
var synth=window.speechSynthesis;
var utterance=null;
var isSpeaking=false;
var isPaused=false;
var currentStoryText='';

function toggleSpeech(){
  if(!synth){document.getElementById('voiceStatus').textContent='您的浏览器不支持语音功能';return;}
  if(isSpeaking&&!isPaused){synth.pause();isPaused=true;updateVoiceBtn();return;}
  if(isPaused){synth.resume();isPaused=false;updateVoiceBtn();return;}
  if(!currentStoryText){document.getElementById('voiceStatus').textContent='没有可朗读的故事';return;}
  utterance=new SpeechSynthesisUtterance(currentStoryText+'\n\n故事讲完啦，快去完成魔法任务吧！');
  utterance.lang='zh-CN';utterance.rate=parseFloat(document.getElementById('speedRange').value);
  utterance.pitch=1.1;
  var voices=synth.getVoices();
  var zhVoice=voices.find(function(v){return v.lang.indexOf('zh')!==-1&&v.name.indexOf('Female')!==-1;})
    ||voices.find(function(v){return v.lang.indexOf('zh')!==-1;});
  if(zhVoice) utterance.voice=zhVoice;
  utterance.onend=function(){isSpeaking=false;isPaused=false;updateVoiceBtn();document.getElementById('voiceStatus').textContent='朗读完毕';};
  utterance.onerror=function(){isSpeaking=false;isPaused=false;updateVoiceBtn();};
  synth.speak(utterance);isSpeaking=true;isPaused=false;updateVoiceBtn();
}
function stopSpeech(){if(synth){synth.cancel();}isSpeaking=false;isPaused=false;updateVoiceBtn();}
function updateVoiceBtn(){
  var btn=document.getElementById('voiceBtn');
  if(isSpeaking&&!isPaused){btn.textContent='⏸ 暂停播放';btn.className='voice-btn play playing';document.getElementById('voiceStatus').textContent='正在朗读...';}
  else if(isPaused){btn.textContent='▶ 继续播放';btn.className='voice-btn play';document.getElementById('voiceStatus').textContent='已暂停';}
  else{btn.textContent='🔊 播放故事';btn.className='voice-btn play';}
}
function updateSpeed(){
  var v=parseFloat(document.getElementById('speedRange').value);
  document.getElementById('speedLabel').textContent=v.toFixed(1)+'x';
  if(utterance&&isSpeaking) utterance.rate=v;
}
if(synth){synth.onvoiceschanged=function(){synth.getVoices();};synth.getVoices();}

function scrollToForm(){window.scrollTo({top:0,behavior:'smooth'});}

/* ===== 彩纸 ===== */
function spawnConfetti(){
  var colors=['#FFD166','#FF8C42','#FF6B8A','#6CB4EE','#c084fc','#34d399'];
  for(var i=0;i<40;i++){
    var p=document.createElement('div');p.className='confetti';
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.width=(5+Math.random()*8)+'px';p.style.height=p.style.width;
    p.style.borderRadius=Math.random()>0.5?'50%':'2px';
    p.style.animationDuration=(2.5+Math.random()*2.5)+'s';
    p.style.animationDelay=(Math.random()*0.6)+'s';
    document.body.appendChild(p);
    setTimeout(function(el){return function(){el.remove();};}(p),6000);
  }
}
</script>
</body>
</html>
