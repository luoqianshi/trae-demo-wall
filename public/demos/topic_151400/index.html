<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
<title>Mycelium 3D — 菌丝词源</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- 使用直接 URL import 避免 importmap 兼容性问题 -->
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060a08;
  --bg2:#0a100c;
  --surface:rgba(12,22,16,.94);
  --surface-hi:rgba(16,28,20,.97);
  --border:rgba(0,255,140,.18);
  --border-hi:rgba(0,255,140,.35);
  --text:#eaf5ee;
  --text2:#a0c0b0;
  --text3:#6a8a7a;
  --accent:#00ff9a;
  --accent2:#00ddbb;
  --accent3:#ff66aa;
  --glow:rgba(0,255,154,.25);
  --latin:#00ff9a;
  --greek:#ffcc44;
  --oldenglish:#44dd88;
  --french:#cc66ee;
  --mixed:#00ddbb;
  --ease:cubic-bezier(.16,1,.3,1);
}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',-apple-system,sans-serif;overflow:hidden;height:100%;width:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#canvas-container{position:fixed;inset:0;z-index:1;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
/* 仅对真正需要交互的 UI 元素启用 pointer-events，避免 .cat-labels 等全屏覆盖层拦截事件 */
.legend,.controls,.detail{pointer-events:auto}

/* Header */
.header{position:fixed;top:0;left:0;right:0;z-index:20;
  padding:20px 28px;display:flex;align-items:center;justify-content:space-between;
  pointer-events:none;
}
.header>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:14px;height:14px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.98) 0%,var(--accent) 40%,transparent 70%);
  box-shadow:0 0 20px rgba(0,255,154,.5),0 0 50px rgba(0,255,154,.15);
  animation:spore-breathe 5s ease-in-out infinite;
}
@keyframes spore-breathe{
  0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(0,255,154,.5),0 0 50px rgba(0,255,154,.15)}
  50%{transform:scale(1.2);box-shadow:0 0 30px rgba(0,255,154,.7),0 0 70px rgba(0,255,154,.25)}
}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;letter-spacing:3px;color:var(--text);text-transform:uppercase;font-style:italic}
.brand-sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--text3);margin-top:2px;text-transform:uppercase;font-weight:400}

.stats{display:flex;gap:28px;align-items:center}
.stat{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.5px;text-shadow:0 0 12px rgba(0,255,154,.3)}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;font-weight:400}

/* Search */
.search-wrap{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:30;
  opacity:0;transition:opacity 1.2s var(--ease),transform 1.2s var(--ease);pointer-events:none}
.search-wrap.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.search{position:relative}
.search input{
  width:280px;background:var(--surface);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);
  border:1px solid var(--border);border-radius:24px;
  padding:12px 18px 12px 42px;color:var(--text);font-size:14px;font-family:'JetBrains Mono',monospace;font-weight:400;letter-spacing:.3px;
  outline:none;transition:all .5s var(--ease);
}
.search input::placeholder{color:var(--text3);font-weight:300}
.search input:focus{border-color:var(--border-hi);width:340px;background:var(--surface-hi);box-shadow:0 0 0 3px rgba(0,255,154,.06),0 0 20px rgba(0,255,154,.08)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:16px;pointer-events:none;opacity:.6}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:none;background:transparent;
  color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:0;transition:all .3s var(--ease)}
.search-clear.show{opacity:1}
.search-clear:hover{color:var(--accent);background:rgba(0,255,154,.08)}

/* Hint */
.hint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:15;
  font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:4px;color:var(--text2);opacity:0;transition:opacity 3s var(--ease);
  text-align:center;pointer-events:none;white-space:nowrap;font-weight:400;font-style:italic}
.hint.show{opacity:.5}

/* Category labels */
.cat-labels{position:fixed;inset:0;z-index:6;pointer-events:none}
.cat-label{position:absolute;font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:6px;color:var(--text2);font-weight:400;text-transform:lowercase;font-style:italic;
  opacity:0;transform:translate(-50%,-50%);transition:opacity 3s var(--ease);white-space:nowrap;text-shadow:0 0 30px rgba(0,255,154,.3)}
.cat-label.visible{opacity:.4}

/* Legend */
.legend{position:fixed;bottom:28px;left:28px;z-index:20;display:flex;gap:4px;opacity:0;transition:opacity 2s var(--ease);flex-wrap:wrap;max-width:50%}
.legend.visible{opacity:.7}
.legend:hover{opacity:1}
.legend-item{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2);letter-spacing:1.5px;cursor:pointer;transition:all .4s var(--ease);padding:8px 14px;border-radius:14px;font-weight:400;text-transform:uppercase}
.legend-item:hover,.legend-item.active{color:var(--text);background:rgba(0,255,154,.06)}
.legend-dot{width:8px;height:8px;border-radius:50%;transition:all .4s var(--ease);flex-shrink:0}
.legend-item:hover .legend-dot,.legend-item.active .legend-dot{box-shadow:0 0 12px currentColor;transform:scale(1.4)}

/* Controls */
.controls{position:fixed;bottom:28px;right:28px;z-index:20;display:flex;gap:10px}
.ctrl-btn{width:44px;height:44px;border-radius:50%;
  background:rgba(20,36,28,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid rgba(0,255,140,.3);color:var(--accent);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;
  transition:all .4s var(--ease);box-shadow:0 0 12px rgba(0,255,154,.08)}
.ctrl-btn:hover{border-color:var(--accent);color:#fff;background:rgba(0,255,154,.12);transform:translateY(-2px);box-shadow:0 0 20px rgba(0,255,154,.2)}
.ctrl-btn:active{transform:translateY(0)}

/* Detail panel */
.detail{position:fixed;right:0;top:0;bottom:0;width:420px;z-index:40;
  background:linear-gradient(180deg,rgba(8,14,10,.97) 0%,rgba(6,10,8,.98) 100%);
  backdrop-filter:blur(40px) saturate(1.3);-webkit-backdrop-filter:blur(40px) saturate(1.3);
  border-left:1px solid var(--border);transform:translateX(100%);transition:transform .6s var(--ease);
  overflow-y:auto;overflow-x:hidden;padding:70px 32px 80px;scrollbar-width:thin;scrollbar-color:var(--border-hi) transparent}
.detail.open{transform:translateX(0)}
.detail::-webkit-scrollbar{width:4px}
.detail::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:2px}
.detail::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;
  background:linear-gradient(180deg,transparent 0%,rgba(0,255,154,.15) 30%,rgba(0,221,187,.1) 60%,transparent 100%)}

.detail-back{position:absolute;top:24px;left:24px;width:42px;height:42px;border-radius:50%;
  background:rgba(20,36,28,.92);border:1.5px solid rgba(0,255,140,.3);color:var(--accent);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;font-weight:500;
  transition:all .4s var(--ease);font-family:'JetBrains Mono',monospace;z-index:1;box-shadow:0 0 12px rgba(0,255,154,.08)}
.detail-back:hover{border-color:var(--accent);color:#fff;background:rgba(0,255,154,.12);box-shadow:0 0 20px rgba(0,255,154,.2)}

.detail-header{margin-bottom:40px;padding-top:12px}
.detail-root{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:400;line-height:1;margin-bottom:16px;letter-spacing:-.5px;font-style:italic;text-shadow:0 0 40px currentColor}
.detail-meaning{font-size:16px;color:var(--text);font-weight:400;line-height:1.8;letter-spacing:.3px;font-family:'Noto Sans SC',sans-serif}
.detail-tags{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.dtag{padding:6px 14px;border-radius:20px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;
  border:1px solid rgba(0,255,140,.25);color:var(--text2);font-weight:400;text-transform:lowercase;transition:all .4s var(--ease);background:rgba(0,255,154,.03)}
.dtag.primary{border-color:currentColor;color:currentColor;box-shadow:0 0 10px currentColor}

.detail-section{margin-bottom:36px;opacity:0;transform:translateY(16px);transition:all .7s var(--ease)}
.detail-section.in{opacity:1;transform:translateY(0)}
.detail-section h4{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.detail-section h4::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

.conns{display:flex;flex-direction:column;gap:6px}
.conn{padding:14px 16px;border-radius:14px;background:rgba(0,255,154,.02);border:1px solid var(--border);
  font-size:14px;cursor:pointer;transition:all .4s var(--ease);color:var(--text2);display:flex;align-items:center;gap:14px}
.conn:hover{border-color:var(--border-hi);color:var(--text);background:rgba(0,255,154,.05);transform:translateX(4px)}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.conn-name{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:18px;font-style:italic}
.conn-type{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;padding:5px 10px;border-radius:6px;background:rgba(0,255,154,.05);color:var(--text2);margin-left:auto;font-weight:400;border:1px solid rgba(0,255,140,.12);transition:all .3s var(--ease)}

.word{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.01);border:1px solid var(--border);
  margin-bottom:6px;cursor:pointer;transition:all .4s var(--ease);display:flex;align-items:flex-start;gap:14px}
.word:hover{border-color:var(--border-hi);background:rgba(0,255,154,.03);transform:translateX(4px)}
.word.learned{border-color:rgba(255,204,68,.15)}
.word-star{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--text3);transition:all .4s var(--ease);margin-top:2px;cursor:pointer;border-radius:50%}
.word-star:hover{background:rgba(255,204,68,.08);color:var(--greek)}
.word.learned .word-star{color:var(--greek);text-shadow:0 0 8px rgba(255,204,68,.5)}
.word-body{flex:1;min-width:0}
.word-en{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;margin-bottom:4px;letter-spacing:.2px;font-style:italic}
.word-ph{font-size:14px;color:#00ffaa;font-family:'JetBrains Mono',monospace;opacity:1;margin-bottom:6px;font-weight:400;letter-spacing:.5px}
.word-def{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:4px;font-weight:400;font-family:'Noto Sans SC',sans-serif}
.word-cn{font-size:15px;color:var(--text);line-height:1.7;font-weight:400;opacity:1;font-family:'Noto Sans SC',sans-serif}

/* Tooltip */
.tooltip{position:fixed;z-index:50;pointer-events:none;
  background:var(--surface-hi);backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);
  border:1px solid var(--border);border-radius:14px;padding:14px 18px;
  opacity:0;transform:scale(.96) translateY(4px);transition:opacity .25s var(--ease),transform .25s var(--ease);
  max-width:260px;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 30px rgba(0,255,154,.06)}
.tooltip.show{opacity:1;transform:scale(1) translateY(0)}
.tt-root{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;letter-spacing:-.2px;font-style:italic}
.tt-meaning{font-size:13px;color:var(--text2);margin-top:6px;font-weight:400;line-height:1.6;font-family:'Noto Sans SC',sans-serif}
.tt-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);margin-top:10px;letter-spacing:.3px;display:flex;gap:14px;font-weight:400}

/* Loader */
.loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity 2s var(--ease),visibility 2s}
.loader.gone{opacity:0;visibility:hidden;pointer-events:none}
.loader-orb{width:40px;height:40px;border-radius:50%;position:relative;margin-bottom:48px;
  background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.95) 0%,var(--accent) 40%,transparent 70%);
  box-shadow:0 0 50px rgba(0,255,154,.4),0 0 100px rgba(0,255,154,.12);
  animation:germinate 4s ease-in-out infinite}
@keyframes germinate{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.25);opacity:1;box-shadow:0 0 60px rgba(0,255,154,.5),0 0 120px rgba(0,255,154,.2)}}
.loader-text{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:6px;color:var(--text3);font-weight:400;text-transform:uppercase}
.loader-bar{width:80px;height:2px;background:rgba(0,255,154,.08);border-radius:1px;margin-top:24px;overflow:hidden}
.loader-bar-inner{height:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);width:40%;animation:load-slide 2s ease-in-out infinite}
@keyframes load-slide{0%{transform:translateX(-150%)}100%{transform:translateX(350%)}}

/* Search results */
.search-results{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:30;
  background:var(--surface);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);
  border:1px solid var(--border);border-radius:16px;padding:8px;min-width:320px;max-width:420px;max-height:320px;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease),transform .4s var(--ease);box-shadow:0 16px 48px rgba(0,0,0,.5)}
.search-results.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.sr-item{padding:10px 14px;border-radius:10px;cursor:pointer;transition:all .3s var(--ease);display:flex;align-items:center;gap:10px}
.sr-item:hover{background:rgba(0,255,154,.05)}
.sr-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sr-name{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic}
.sr-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);margin-left:auto;letter-spacing:.5px}

/* Dim layer */
.dim-layer{position:fixed;inset:0;z-index:5;pointer-events:none;background:rgba(6,10,8,0);transition:background 1s var(--ease)}
.dim-layer.active{background:rgba(6,10,8,.6)}

/* Intro */
.intro{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity 1.5s var(--ease)}
.intro.done{opacity:0}
.intro-orb{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.95) 0%,var(--accent) 40%,transparent 70%);box-shadow:0 0 40px rgba(0,255,154,.4);animation:germinate 3s ease-in-out infinite;margin-bottom:32px}
.intro-title{text-align:center}
.intro-title h1{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;letter-spacing:8px;color:var(--text);text-transform:uppercase;margin-bottom:8px;font-style:italic}
.intro-title p{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:4px;color:var(--text3);text-transform:uppercase;font-weight:400}

/* Mobile */
@media(max-width:768px){
  .header{padding:14px 16px}
  .brand-name{font-size:16px;letter-spacing:2px}
  .brand-sub{font-size:9px;letter-spacing:2px}
  .brand-mark{width:10px;height:10px}
  .stats{gap:16px}
  .stat-val{font-size:13px}
  .stat-label{font-size:8px;letter-spacing:1.5px}
  .search-wrap{top:60px}
  .search input{width:200px;font-size:13px;padding:10px 14px 10px 36px}
  .search input:focus{width:240px}
  .search-icon{left:12px;font-size:14px}
  .legend{left:12px;bottom:12px;flex-wrap:wrap;max-width:calc(100% - 80px)}
  .legend-item{font-size:10px;padding:6px 10px;gap:5px}
  .legend-dot{width:6px;height:6px}
  .controls{right:12px;bottom:12px}
  .ctrl-btn{width:38px;height:38px;font-size:16px}
  .cat-label{font-size:13px;letter-spacing:3px}
  .hint{font-size:13px;letter-spacing:2px;bottom:70px}
  .zoom-hint{display:none}
  .detail{top:auto;bottom:0;left:0;right:0;width:100%;max-height:75vh;border-left:none;border-top:1px solid var(--border);border-radius:20px 20px 0 0;transform:translateY(100%);padding:50px 20px 40px}
  .detail.open{transform:translateY(0)}
  .detail::before{width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(0,255,154,.15),transparent)}
  .detail-back{top:14px;left:auto;right:14px;width:38px;height:38px;font-size:18px}
  .detail-root{font-size:42px}
  .detail-meaning{font-size:15px}
  .word-en{font-size:18px}
  .word-ph{font-size:13px}
  .word-def{font-size:13px}
  .word-cn{font-size:14px}
  .conn-name{font-size:16px}
  .intro-title h1{letter-spacing:3px}
  .intro-title p{font-size:11px;letter-spacing:3px}
}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="dim-layer" id="dim"></div>

<div class="loader" id="loader">
  <div class="loader-orb"></div>
  <div class="loader-text">GERMINATING</div>
  <div class="loader-bar"><div class="loader-bar-inner"></div></div>
</div>

<div class="intro" id="intro">
  <div class="intro-orb"></div>
  <div class="intro-title">
    <h1>Mycelium</h1>
    <p>the hidden network of meaning</p>
  </div>
</div>

<div id="ui">
  <div class="header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">MYCELIUM</div>
        <div class="brand-sub">菌丝词源</div>
      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <div class="search">
        <span class="search-icon">&#x2315;</span>
        <input type="text" id="searchInput" placeholder="search roots & words..." autocomplete="off">
        <button class="search-clear" id="searchClear">&times;</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-val" id="statRoots">0</div><div class="stat-label">ROOTS</div></div>
      <div class="stat"><div class="stat-val" id="statWords">0</div><div class="stat-label">WORDS</div></div>
      <div class="stat"><div class="stat-val" id="statKnown">0</div><div class="stat-label">KNOWN</div></div>
    </div>
  </div>

  <div class="hint" id="hint">
    <div>拖拽旋转 · 滚轮缩放 · 点击节点</div>
    <div style="font-size:11px;letter-spacing:2px;margin-top:4px;opacity:.6">drag to rotate · scroll to zoom · tap a node</div>
  </div>

  <div class="cat-labels" id="catLabels"></div>

  <div class="legend" id="legend">
    <div class="legend-item active" data-filter="all"><div class="legend-dot" style="background:var(--accent)"></div>ALL</div>
    <div class="legend-item" data-filter="latin"><div class="legend-dot" style="background:var(--latin)"></div>LATIN</div>
    <div class="legend-item" data-filter="greek"><div class="legend-dot" style="background:var(--greek)"></div>GREEK</div>
    <div class="legend-item" data-filter="mixed"><div class="legend-dot" style="background:var(--mixed)"></div>MIXED</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnZoomIn" title="放大">+</button>
    <button class="ctrl-btn" id="btnZoomOut" title="缩小">&minus;</button>
    <button class="ctrl-btn" id="btnReset" title="重置视图">&#x21bb;</button>
  </div>

  <div class="tooltip" id="tooltip">
    <div class="tt-root" id="ttRoot"></div>
    <div class="tt-meaning" id="ttMeaning"></div>
    <div class="tt-meta" id="ttMeta"></div>
  </div>

  <div class="detail" id="detail">
    <button class="detail-back" id="detailBack">&#x2190;</button>
    <div class="detail-header">
      <div class="detail-root" id="detailRoot"></div>
      <div class="detail-meaning" id="detailMeaning"></div>
      <div class="detail-tags" id="detailTags"></div>
    </div>
    <div class="detail-section" id="secConns"><h4>CONNECTED ROOTS</h4><div class="conns" id="conns"></div></div>
    <div class="detail-section" id="secWords"><h4>DERIVATIONS</h4><div id="words"></div></div>
  </div>
</div>

<script type="module">
// ============ Error Handling & Detection ============
const loaderText = document.querySelector('.loader-text');
function setError(msg) {
  loaderText.textContent = msg;
  loaderText.style.color = '#ff6666';
  console.error(msg);
}

// 1. 检测是否通过 file:// 协议打开
if (location.protocol === 'file:') {
  setError('ERROR: MUST USE HTTP SERVER');
  alert('请通过 HTTP 服务器访问本页面，不能直接用 file:// 打开。\n\n运行命令：\npython3 server.py\n\n然后访问 http://localhost:8080');
  throw new Error('file protocol not supported');
}

// 2. 检测 WebGL
let webglSupported = false;
try {
  const testCanvas = document.createElement('canvas');
  webglSupported = !!(window.WebGLRenderingContext && (testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl')));
} catch(e) { webglSupported = false; }
if (!webglSupported) {
  setError('ERROR: WEBGL NOT SUPPORTED');
  alert('您的浏览器不支持 WebGL，无法显示 3D 场景。\n请使用最新版 Chrome、Safari 或 Firefox。');
  throw new Error('WebGL not supported');
}

// 3. 加载本地 Three.js（无需网络）
let THREE, OrbitControls;
try {
  THREE = await import('./three.module.js');
  const oc = await import('./OrbitControls.js');
  OrbitControls = oc.OrbitControls;
} catch(e) {
  setError('ERROR: THREE.JS LOAD FAILED');
  alert('Three.js 加载失败。请确保 three.module.js 和 OrbitControls.js 与 index.html 在同一目录。');
  throw e;
}

// ============ Config ============
const ORIGIN_COLORS = {
  Latin: 0x00ff9a, Greek: 0xffcc44, 'Old English': 0x44dd88,
  French: 0xcc66ee, Mixed: 0x00ddbb, 'Latin/Greek': 0x00ddbb, 'Greek/Latin': 0x00ddbb
};
const CAT_POS = {
  action:    { theta: 0,        phi: Math.PI * 0.35 },
  thought:   { theta: 0.9,      phi: Math.PI * 0.3 },
  science:   { theta: 1.8,      phi: Math.PI * 0.4 },
  body:      { theta: 2.7,      phi: Math.PI * 0.35 },
  quantity:  { theta: 3.6,      phi: Math.PI * 0.3 },
  society:   { theta: 4.5,      phi: Math.PI * 0.4 },
  emotion:   { theta: 5.4,      phi: Math.PI * 0.35 }
};
const RADIUS = 60;

// ============ State ============
const S = {
  data: null, nodes: [], links: [], sel: null, hov: null,
  filter: 'all', search: [], learned: new Set(JSON.parse(localStorage.getItem('myc_learned')||'[]')),
  cam: { x: 0, y: 0, z: 120 }, mouse: { down: false }
};

// ============ Three.js Setup ============
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060a08, 0.008);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 40, 120);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x060a08, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// OrbitControls — 绑定到 renderer.domElement，但我们需要确保它能正常接收事件
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 15;
controls.maxDistance = 350;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.enablePan = true;
controls.panSpeed = 0.8;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 1.2;
controls.touches = {
  ONE: THREE.TOUCH.ROTATE,
  TWO: THREE.TOUCH.DOLLY_PAN
};

// Raycaster — 用于节点选中检测
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
raycaster.params.Mesh = { threshold: 0.5 };

// ============ Helpers ============
function hex(c) { return '#' + c.toString(16).padStart(6, '0'); }

function createTextSprite(text, color, size = 1.2) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const fontSize = 64;
  const padX = 40, padY = 20;
  ctx.font = `600 ${fontSize}px "Cormorant Garamond", serif`;
  const metrics = ctx.measureText(text);
  const textW = Math.ceil(metrics.width);
  canvas.width = Math.max(256, textW + padX * 2) * dpr;
  canvas.height = (fontSize + padY * 2) * dpr;
  canvas.style.width = (canvas.width / dpr) + 'px';
  canvas.style.height = (canvas.height / dpr) + 'px';
  ctx.scale(dpr, dpr);
  ctx.font = `600 ${fontSize}px "Cormorant Garamond", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cx = (canvas.width / dpr) / 2;
  const cy = (canvas.height / dpr) / 2;
  // 发光描边提升对比度
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  ctx.fillStyle = color;
  ctx.fillText(text, cx, cy);
  ctx.shadowBlur = 0;
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  if (renderer.capabilities) tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  const aspect = canvas.width / canvas.height;
  sprite.scale.set(size * 4 * (aspect / 4), size * 1.4, 1);
  sprite.userData.baseScale = sprite.scale.clone();
  return sprite;
}

function sph2car(r, theta, phi) {
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
}

// ============ Scene Objects ============
const nodeGroup = new THREE.Group();
const linkGroup = new THREE.Group();
const labelGroup = new THREE.Group();
const starGroup = new THREE.Group();
scene.add(nodeGroup, linkGroup, labelGroup, starGroup);

// Shared geometries
const nodeGeo = new THREE.SphereGeometry(1, 32, 32);
const glowGeo = new THREE.SphereGeometry(1, 32, 32);

// Starfield
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 2000; i++) {
  const r = 150 + Math.random() * 400;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0x88bbaa, size: 0.4, transparent: true, opacity: 0.5 });
starGroup.add(new THREE.Points(starGeo, starMat));

// Ambient light
scene.add(new THREE.AmbientLight(0x112211, 0.5));

// ============ Build Network ============
async function build() {
  let res;
  try {
    res = await fetch('./data.json');
  } catch(e) {
    throw new Error('无法加载 data.json。请确保通过 HTTP 服务器访问（运行 python3 server.py）');
  }
  if (!res.ok) throw new Error('data.json 返回错误: ' + res.status);
  let data;
  try {
    data = await res.json();
  } catch(e) {
    throw new Error('data.json 格式错误: ' + e.message);
  }
  S.data = data;
  const roots = S.data.roots;
  const conns = S.data.connections || [];

  document.getElementById('statRoots').textContent = roots.length;
  document.getElementById('statWords').textContent = roots.reduce((a, r) => a + r.words.length, 0);
  document.getElementById('statKnown').textContent = S.learned.size;

  const byCat = {};
  roots.forEach(r => { byCat[r.category] = byCat[r.category] || []; byCat[r.category].push(r); });

  // Position nodes by category cluster on sphere
  roots.forEach((r, i) => {
    const cat = r.category;
    const catRoots = byCat[cat];
    const idx = catRoots.indexOf(r);
    const catBase = CAT_POS[cat] || { theta: Math.random() * Math.PI * 2, phi: Math.PI * 0.35 };
    const golden = Math.PI * (3 - Math.sqrt(5));
    const y = 1 - (idx / Math.max(catRoots.length - 1, 1)) * 2;
    const radius = Math.sqrt(1 - y * y);
    const thetaLocal = golden * idx;
    const localOffset = new THREE.Vector3(
      radius * Math.cos(thetaLocal) * 18,
      y * 18,
      radius * Math.sin(thetaLocal) * 18
    );
    const basePos = sph2car(RADIUS, catBase.theta, catBase.phi);
    const pos = basePos.clone().add(localOffset);

    const color = ORIGIN_COLORS[r.origin] || 0xaaaaaa;
    const imp = Math.log(r.words.length + 1) + 1;
    const size = Math.max(0.6, Math.min(2.2, imp * 0.35));

    // Core sphere
    const mat = new THREE.MeshStandardMaterial({
      color: color, emissive: color, emissiveIntensity: 0.6,
      roughness: 0.4, metalness: 0.3
    });
    const mesh = new THREE.Mesh(nodeGeo, mat);
    mesh.scale.setScalar(size);
    mesh.position.copy(pos);
    mesh.userData = { id: r.id, root: r, type: 'node', baseColor: color, baseSize: size, imp };
    nodeGroup.add(mesh);

    // Glow shell
    const glowMat = new THREE.MeshBasicMaterial({
      color: color, transparent: true, opacity: 0.08, depthWrite: false
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.scale.setScalar(size * 2.5);
    glow.position.copy(pos);
    glow.userData = { parentNode: mesh };
    nodeGroup.add(glow);
    mesh.userData.glow = glow;

    // Label
    const label = createTextSprite(r.root, hex(color), size * 0.6);
    label.position.copy(pos).add(new THREE.Vector3(0, size * 1.8, 0));
    label.userData = { parentNode: mesh };
    labelGroup.add(label);
    mesh.userData.label = label;

    S.nodes.push({ id: r.id, root: r, mesh, pos, color, size, imp, glow, label });
  });

  // Links
  const nm = {};
  S.nodes.forEach(n => nm[n.id] = n);
  conns.forEach(c => {
    const a = nm[c.from], b = nm[c.to];
    if (!a || !b) return;
    const pts = [a.pos.clone(), b.pos.clone()];
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const pri = { compounding: 4, shared_origin: 3, shared_concept: 2, related: 1, opposite: 1 }[c.type] || 1;
    const alpha = { 4: 0.45, 3: 0.3, 2: 0.18, 1: 0.08 }[pri];
    const mat = new THREE.LineBasicMaterial({ color: 0x00ff9a, transparent: true, opacity: alpha });
    const line = new THREE.Line(geo, mat);
    line.userData = { from: c.from, to: c.to, type: c.type, pri, baseAlpha: alpha };
    linkGroup.add(line);
    S.links.push({ from: c.from, to: c.to, line, type: c.type, pri });
  });

  // Category labels
  const cl = document.getElementById('catLabels');
  Object.keys(byCat).forEach(cat => {
    const cp = CAT_POS[cat];
    if (!cp) return;
    const p = sph2car(RADIUS * 1.6, cp.theta, cp.phi);
    const div = document.createElement('div');
    div.className = 'cat-label';
    div.textContent = cat;
    div.style.left = '50%';
    div.style.top = '50%';
    cl.appendChild(div);
    byCat[cat].labelEl = div;
    byCat[cat].labelPos = p;
  });
  S.byCat = byCat;

  // Build search index
  roots.forEach(r => {
    S.search.push({ type: 'root', id: r.id, text: r.root.toLowerCase(), obj: r });
    r.words.forEach(w => {
      S.search.push({ type: 'word', id: r.id, text: w.word.toLowerCase(), obj: w, root: r });
    });
  });

  setTimeout(() => {
    document.getElementById('loader').classList.add('gone');
    document.getElementById('searchWrap').classList.add('visible');
    document.getElementById('legend').classList.add('visible');
    document.getElementById('hint').classList.add('show');
    setTimeout(() => document.getElementById('intro').classList.add('done'), 2000);
    setTimeout(() => {
      document.querySelectorAll('.cat-label').forEach(el => el.classList.add('visible'));
    }, 1500);
  }, 1500);
}

// ============ Selection ============
let flyAnim = null; // 飞行动画状态

function selectNode(id) {
  const n = S.nodes.find(x => x.id === id);
  if (!n) return;
  S.sel = n;

  S.nodes.forEach(x => {
    const isConn = x.id === id || S.links.some(l =>
      (l.from === id && l.to === x.id) || (l.to === id && l.from === x.id)
    );
    // 保留学习状态视觉：已学节点即使非关联也保持一定亮度
    const learnBoost = x.learnLevel >= 2 ? 0.4 : x.learnLevel >= 1 ? 0.2 : 0;
    x.mesh.material.emissiveIntensity = isConn ? 1.4 : (0.1 + learnBoost);
    x.glow.material.opacity = isConn ? 0.22 : (0.02 + learnBoost * 0.1);
    x.label.material.opacity = isConn ? 1 : (0.15 + learnBoost * 0.3);
  });
  S.links.forEach(l => {
    const active = l.from === id || l.to === id;
    l.line.material.opacity = active ? 0.6 : 0.02;
    l.line.material.color.setHex(active ? 0x00ffcc : 0x00ff9a);
  });

  document.getElementById('dim').classList.add('active');
  showDetail(n.root);

  // 平滑飞行到选中节点附近
  flyTo(n.pos.clone().add(new THREE.Vector3(8, 6, 12)), 1200);
}

function deselect() {
  S.sel = null;
  flyAnim = null;
  S.nodes.forEach(x => {
    // 恢复时基于学习状态设置不同亮度
    const learnBoost = x.learnLevel >= 2 ? 0.4 : x.learnLevel >= 1 ? 0.2 : 0;
    x.mesh.material.emissiveIntensity = 0.6 + learnBoost;
    x.glow.material.opacity = 0.08 + learnBoost * 0.1;
    x.label.material.opacity = 1;
  });
  S.links.forEach(l => {
    l.line.material.opacity = l.line.userData.baseAlpha;
    l.line.material.color.setHex(0x00ff9a);
  });
  document.getElementById('dim').classList.remove('active');
  document.getElementById('detail').classList.remove('open');
  controls.autoRotate = true;
  // 飞回全景
  flyTo(new THREE.Vector3(0, 40, 120), 1500);
}

// 平滑飞行函数 — 类似 iPhone 地图的平滑过渡
function flyTo(targetPos, duration) {
  const startPos = camera.position.clone();
  const startTime = performance.now();
  flyAnim = { startPos, targetPos, startTime, duration };
}

// 在动画循环中更新飞行动画
function updateFly() {
  if (!flyAnim) return;
  const elapsed = performance.now() - flyAnim.startTime;
  let t = Math.min(elapsed / flyAnim.duration, 1);
  // 缓出三次方 — 给人"减速着陆"的感觉
  t = 1 - Math.pow(1 - t, 3);
  camera.position.lerpVectors(flyAnim.startPos, flyAnim.targetPos, t);
  camera.lookAt(controls.target);
  if (elapsed >= flyAnim.duration) flyAnim = null;
}

// ============ Detail Panel ============
function showDetail(r) {
  const d = document.getElementById('detail');
  const color = ORIGIN_COLORS[r.origin] || 0xaaaaaa;
  document.getElementById('detailRoot').textContent = r.root;
  document.getElementById('detailRoot').style.color = hex(color);
  document.getElementById('detailMeaning').textContent = r.meaning;

  const tags = document.getElementById('detailTags');
  tags.innerHTML = '';
  const t1 = document.createElement('span');
  t1.className = 'dtag primary'; t1.style.color = hex(color); t1.style.borderColor = hex(color);
  t1.textContent = r.origin.toLowerCase();
  tags.appendChild(t1);
  const t2 = document.createElement('span');
  t2.className = 'dtag'; t2.textContent = r.category;
  tags.appendChild(t2);

  const connsDiv = document.getElementById('conns');
  connsDiv.innerHTML = '';
  const myConns = S.data.connections.filter(c => c.from === r.id || c.to === r.id);
  if (myConns.length === 0) {
    connsDiv.innerHTML = '<div style="color:var(--text3);font-size:13px;font-style:italic">暂无关联词根</div>';
  }
  myConns.forEach((c, i) => {
    const oid = c.from === r.id ? c.to : c.from;
    const on = S.nodes.find(x => x.id === oid);
    if (!on) return;
    const el = document.createElement('div');
    el.className = 'conn';
    el.style.transitionDelay = (i * 60) + 'ms';
    el.innerHTML = `<div class="conn-dot" style="background:${hex(on.color)};box-shadow:0 0 8px ${hex(on.color)}"></div><div class="conn-name">${on.root.root}</div><div class="conn-type">${c.type}</div>`;
    el.onclick = () => selectNode(oid);
    connsDiv.appendChild(el);
  });

  const wordsDiv = document.getElementById('words');
  wordsDiv.innerHTML = '';
  r.words.forEach((w, i) => {
    const el = document.createElement('div');
    el.className = 'word';
    el.style.transitionDelay = (i * 40) + 'ms';
    const key = r.id + ':' + w.word;
    const learned = S.learned.has(key);
    if (learned) el.classList.add('learned');
    el.innerHTML = `<div class="word-star" data-key="${key}">${learned ? '&#9733;' : '&#9734;'}</div><div class="word-body"><div class="word-en">${w.word}</div><div class="word-ph">${w.phonetic || ''}</div><div class="word-def">${w.definition || ''}</div><div class="word-cn">${w.definitionCn || ''}</div></div>`;
    el.querySelector('.word-star').onclick = e => {
      e.stopPropagation();
      toggleLearn(key);
      el.classList.toggle('learned');
      el.querySelector('.word-star').innerHTML = S.learned.has(key) ? '&#9733;' : '&#9734;';
      document.getElementById('statKnown').textContent = S.learned.size;
    };
    wordsDiv.appendChild(el);
  });

  d.classList.add('open');
  setTimeout(() => {
    document.querySelectorAll('.detail-section').forEach((s, i) => {
      setTimeout(() => s.classList.add('in'), 200 + i * 150);
    });
  }, 300);
  controls.autoRotate = false;
}

function toggleLearn(key) {
  if (S.learned.has(key)) S.learned.delete(key);
  else S.learned.add(key);
  localStorage.setItem('myc_learned', JSON.stringify([...S.learned]));
  updateLearnState();
}

// ============ Learning State Visualization ============
// 计算每个词根的学习进度并更新 3D 视觉表现
// 4级掌握度：0=未学(灰暗) → 1=初识(微亮) → 2=熟悉(明亮) → 3=掌握(金色光环)
function getLearnRatio(rootId) {
  const n = S.nodes.find(x => x.id === rootId);
  if (!n || !n.root.words || n.root.words.length === 0) return 0;
  const learned = n.root.words.filter(w => S.learned.has(rootId + ':' + w.word)).length;
  return learned / n.root.words.length;
}

function updateLearnState() {
  S.nodes.forEach(n => {
    const ratio = getLearnRatio(n.id);
    n.learnRatio = ratio;
    // 掌握度等级：0=未学, 1=初识(>0), 2=熟悉(>=0.5), 3=掌握(==1)
    n.learnLevel = ratio === 0 ? 0 : ratio === 1 ? 3 : ratio >= 0.5 ? 2 : 1;
  });
  document.getElementById('statKnown').textContent = S.learned.size;
}

// ============ Interaction ============
let hovered = null;
let pointerDownPos = { x: 0, y: 0 };
let pointerDownTime = 0;
let pointerMoved = false;

// 统一使用 pointermove 进行 hover 检测
container.addEventListener('pointermove', e => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(nodeGroup.children).filter(h => h.object.userData.type === 'node');
  if (hits.length > 0) {
    const n = hits[0].object.userData;
    if (hovered !== n.id) {
      hovered = n.id;
      renderer.domElement.style.cursor = 'pointer';
      showTooltip(n.root, e.clientX, e.clientY);
    }
  } else if (hovered) {
    hovered = null;
    renderer.domElement.style.cursor = 'grab';
    hideTooltip();
  }
});

// 记录 pointerdown 位置和时间，用于区分"点击"和"拖拽"
container.addEventListener('pointerdown', e => {
  pointerDownPos.x = e.clientX;
  pointerDownPos.y = e.clientY;
  pointerDownTime = Date.now();
  pointerMoved = false;
  renderer.domElement.style.cursor = 'grabbing';
});

container.addEventListener('pointermove', e => {
  // 如果按下后移动超过 5px，标记为拖拽（不触发点击）
  if (pointerDownTime > 0) {
    const dx = e.clientX - pointerDownPos.x;
    const dy = e.clientY - pointerDownPos.y;
    if (Math.sqrt(dx * dx + dy * dy) > 5) pointerMoved = true;
  }
});

// pointerup 时判断是点击还是拖拽结束
container.addEventListener('pointerup', e => {
  const elapsed = Date.now() - pointerDownTime; // 必须在重置之前保存
  pointerDownTime = 0;
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';

  // 如果移动距离小于 5px 且时间小于 500ms，视为"点击"
  if (!pointerMoved && elapsed < 500) {
    pointer.x = (e.clientX / innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(nodeGroup.children).filter(h => h.object.userData.type === 'node');
    if (hits.length > 0) {
      const id = hits[0].object.userData.id;
      if (S.sel && S.sel.id === id) deselect();
      else selectNode(id);
    } else if (S.sel) {
      deselect();
    }
  }
});

// 用户开始手动操作时暂停自动旋转
controls.addEventListener('start', () => { controls.autoRotate = false; });
controls.addEventListener('end', () => {
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
});

// 初始化光标
renderer.domElement.style.cursor = 'grab';

// ============ Tooltip ============
function showTooltip(r, x, y) {
  const tt = document.getElementById('tooltip');
  document.getElementById('ttRoot').textContent = r.root;
  document.getElementById('ttRoot').style.color = hex(ORIGIN_COLORS[r.origin] || 0xaaaaaa);
  document.getElementById('ttMeaning').textContent = r.meaning;
  const learnedCount = r.words.filter(w => S.learned.has(r.id + ':' + w.word)).length;
  const progress = r.words.length > 0 ? Math.round(learnedCount / r.words.length * 100) : 0;
  const progressStr = learnedCount > 0 ? ` · <span style="color:var(--greek)">${learnedCount}/${r.words.length} 已学 (${progress}%)</span>` : ` · <span style="color:var(--text3)">${r.words.length} words</span>`;
  document.getElementById('ttMeta').innerHTML = `<span>${r.origin}</span>${progressStr}`;
  tt.style.left = Math.min(x + 16, innerWidth - 280) + 'px';
  tt.style.top = Math.min(y + 16, innerHeight - 120) + 'px';
  tt.classList.add('show');
}
function hideTooltip() { document.getElementById('tooltip').classList.remove('show'); }

// ============ Search ============
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  searchClear.classList.toggle('show', q.length > 0);
  if (!q) { searchResults.classList.remove('show'); return; }
  const hits = S.search.filter(s => s.text.includes(q)).slice(0, 12);
  searchResults.innerHTML = '';
  hits.forEach(h => {
    const el = document.createElement('div');
    el.className = 'sr-item';
    const color = ORIGIN_COLORS[h.root ? h.root.origin : h.obj.origin] || 0xaaaaaa;
    el.innerHTML = `<div class="sr-dot" style="background:${hex(color)}"></div><div class="sr-name">${h.type === 'word' ? h.obj.word : h.obj.root}</div><div class="sr-meta">${h.type === 'word' ? h.root.root : h.obj.category}</div>`;
    el.onclick = () => {
      const rid = h.type === 'word' ? h.root.id : h.obj.id;
      selectNode(rid);
      searchResults.classList.remove('show');
      searchInput.value = '';
      searchClear.classList.remove('show');
    };
    searchResults.appendChild(el);
  });
  searchResults.classList.toggle('show', hits.length > 0);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchResults.classList.remove('show');
  searchClear.classList.remove('show');
});

window.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
});

// ============ Legend Filter ============
document.querySelectorAll('.legend-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.legend-item').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    S.filter = el.dataset.filter;
    applyFilter();
  });
});

function applyFilter() {
  S.nodes.forEach(n => {
    const visible = S.filter === 'all' || n.root.origin.toLowerCase().includes(S.filter);
    n.mesh.visible = visible;
    n.glow.visible = visible;
    n.label.visible = visible;
  });
  S.links.forEach(l => {
    const a = S.nodes.find(x => x.id === l.from);
    const b = S.nodes.find(x => x.id === l.to);
    l.line.visible = a && b && a.mesh.visible && b.mesh.visible;
  });
}

// ============ Zoom Buttons ============
document.getElementById('btnZoomIn').addEventListener('click', () => {
  const dir = new THREE.Vector3().subVectors(controls.target, camera.position).normalize();
  camera.position.addScaledVector(dir, -15);
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  const dir = new THREE.Vector3().subVectors(controls.target, camera.position).normalize();
  camera.position.addScaledVector(dir, 15);
});
document.getElementById('btnReset').addEventListener('click', () => {
  camera.position.set(0, 40, 120);
  controls.target.set(0, 0, 0);
  controls.autoRotate = true;
  deselect();
});

// ============ Detail Back ============
document.getElementById('detailBack').addEventListener('click', deselect);

// ============ Animation Loop ============
const clock = new THREE.Clock();
const RADIUS_REF = 100; // 参考距离，用于标签自适应缩放

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 更新飞行动画（优先级高于 OrbitControls）
  updateFly();
  controls.update();

  const camDist = camera.position.distanceTo(controls.target);
  const hoverNode = hovered ? S.nodes.find(x => x.id === hovered) : null;

  // 节点呼吸动画 + 悬停放大 + 选中脉冲 + 学习状态视觉
  S.nodes.forEach(n => {
    const breathe = 1 + Math.sin(t * 0.8 + n.pos.x * 0.05) * 0.03;
    let targetScale = n.size * breathe;

    // 悬停时平滑放大至 1.4x
    const isHovered = hoverNode && hoverNode.id === n.id;
    if (isHovered) targetScale *= 1.4;

    // 选中节点脉冲
    if (S.sel && S.sel.id === n.id) {
      targetScale = n.size * (1 + Math.sin(t * 3) * 0.12);
      if (isHovered) targetScale *= 1.15;
    }

    // 平滑过渡（lerp 0.15）
    const curScale = n.mesh.scale.x;
    const newScale = curScale + (targetScale - curScale) * 0.15;
    n.mesh.scale.setScalar(newScale);
    n.glow.scale.setScalar(newScale * 2.5);

    // 悬停时增亮 + 发光增强
    if (isHovered && !S.sel) {
      const targetEmissive = 1.5;
      n.mesh.material.emissiveIntensity += (targetEmissive - n.mesh.material.emissiveIntensity) * 0.15;
      const targetGlow = 0.2;
      n.glow.material.opacity += (targetGlow - n.glow.material.opacity) * 0.15;
    } else if (!S.sel) {
      // 非选中非悬停时根据学习状态设置亮度
      const learnBoost = n.learnLevel >= 2 ? 0.4 : n.learnLevel >= 1 ? 0.2 : 0;
      const targetEmissive = 0.6 + learnBoost;
      const targetGlow = 0.08 + learnBoost * 0.08 + Math.sin(t * 1.2 + n.pos.z * 0.1) * 0.03;
      n.mesh.material.emissiveIntensity += (targetEmissive - n.mesh.material.emissiveIntensity) * 0.1;
      n.glow.material.opacity += (targetGlow - n.glow.material.opacity) * 0.1;
    }

    // 标签随相机距离自适应缩放
    if (n.label && n.label.userData.baseScale) {
      const nodeDist = camera.position.distanceTo(n.pos);
      const distRatio = Math.max(0.5, Math.min(2.5, RADIUS_REF / nodeDist));
      const hoverBoost = isHovered ? 1.4 : 1;
      const bs = n.label.userData.baseScale;
      const targetLX = bs.x * distRatio * hoverBoost;
      const targetLY = bs.y * distRatio * hoverBoost;
      n.label.scale.x += (targetLX - n.label.scale.x) * 0.12;
      n.label.scale.y += (targetLY - n.label.scale.y) * 0.12;

      // 已掌握词根标签加亮
      if (n.learnLevel === 3 && !S.sel) {
        n.label.material.opacity += (1 - n.label.material.opacity) * 0.1;
      }
    }
  });

  // 选中节点的发光脉冲
  if (S.sel) {
    const pulseGlow = 0.25 + Math.sin(t * 3) * 0.1;
    S.sel.glow.material.opacity += (pulseGlow - S.sel.glow.material.opacity) * 0.2;
  }

  starGroup.rotation.y += 0.0003;

  if (S.byCat) {
    Object.keys(S.byCat).forEach(cat => {
      const info = S.byCat[cat];
      if (!info.labelEl || !info.labelPos) return;
      const v = info.labelPos.clone().project(camera);
      const x = (v.x * 0.5 + 0.5) * innerWidth;
      const y = (-v.y * 0.5 + 0.5) * innerHeight;
      const visible = v.z < 1 && x > 0 && x < innerWidth && y > 0 && y < innerHeight;
      info.labelEl.style.left = x + 'px';
      info.labelEl.style.top = y + 'px';
      info.labelEl.style.opacity = visible ? (0.15 + Math.sin(t * 0.5 + cat.length) * 0.05) : 0;
    });
  }

  renderer.render(scene, camera);
}

// ============ Resize ============
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============ Init ============
try {
  await build();
  updateLearnState();
  animate();
} catch(err) {
  console.error('Build failed:', err);
  setError('LOAD FAILED: ' + (err.message || '未知错误'));
}
</script>
