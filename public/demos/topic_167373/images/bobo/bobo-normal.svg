<?xml version="1.0" encoding="UTF-8"?>
<!--
  波波立绘 - 平静表情 (normal)
  风格：圆胖浅棕身体 + 圆眼 + 水平小嘴 + 头顶小啾啾
  viewBox 200x200
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E0C49A"/>
      <stop offset="60%" stop-color="#C8A47C"/>
      <stop offset="100%" stop-color="#9B7A52"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB0B0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFB0B0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 影子 -->
  <ellipse cx="100" cy="180" rx="55" ry="9" fill="rgba(0,0,0,0.18)"/>

  <!-- 头顶啾啾 -->
  <ellipse cx="100" cy="22" rx="14" ry="10" fill="#8B6A47"/>
  <ellipse cx="100" cy="22" rx="7" ry="5" fill="#E8A4A4"/>

  <!-- 身体（圆胖波波） -->
  <circle cx="100" cy="105" r="62" fill="url(#bodyGrad)"/>
  <!-- 身体外圈描边 -->
  <circle cx="100" cy="105" r="62" fill="none" stroke="#7A5A38" stroke-width="2" stroke-opacity="0.4"/>

  <!-- 左耳 -->
  <ellipse cx="48" cy="60" rx="14" ry="11" fill="#8B6A47" transform="rotate(-25 48 60)"/>
  <ellipse cx="48" cy="60" rx="7" ry="5.5" fill="#E8A4A4" transform="rotate(-25 48 60)"/>
  <!-- 右耳 -->
  <ellipse cx="152" cy="60" rx="14" ry="11" fill="#8B6A47" transform="rotate(25 152 60)"/>
  <ellipse cx="152" cy="60" rx="7" ry="5.5" fill="#E8A4A4" transform="rotate(25 152 60)"/>

  <!-- 头顶高光 -->
  <ellipse cx="76" cy="70" rx="22" ry="12" fill="rgba(255,255,255,0.35)"/>

  <!-- 腮红 -->
  <ellipse cx="64" cy="118" rx="11" ry="6" fill="url(#cheekGrad)"/>
  <ellipse cx="136" cy="118" rx="11" ry="6" fill="url(#cheekGrad)"/>

  <!-- 左眼 -->
  <ellipse cx="80" cy="100" rx="6" ry="9" fill="#1A1A1A"/>
  <ellipse cx="78.5" cy="96" rx="2" ry="2.5" fill="#FFFFFF"/>
  <!-- 右眼 -->
  <ellipse cx="120" cy="100" rx="6" ry="9" fill="#1A1A1A"/>
  <ellipse cx="118.5" cy="96" rx="2" ry="2.5" fill="#FFFFFF"/>

  <!-- 嘴（平静 - 小横线） -->
  <line x1="88" y1="128" x2="112" y2="128" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
</svg>
