<?xml version="1.0" encoding="UTF-8"?>
<!--
  波波立绘 - 担心表情 (worried)
  眉头下弯，眼睛上有一滴小泪，嘴下弯
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D8B988"/>
      <stop offset="60%" stop-color="#B8946A"/>
      <stop offset="100%" stop-color="#8B6843"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FB3D5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7FB3D5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 影子 -->
  <ellipse cx="100" cy="180" rx="55" ry="9" fill="rgba(0,0,0,0.18)"/>

  <!-- 头顶啾啾（略微下垂） -->
  <ellipse cx="100" cy="24" rx="14" ry="9" fill="#7A5A38"/>
  <ellipse cx="100" cy="24" rx="7" ry="4.5" fill="#D89898"/>

  <!-- 身体 -->
  <circle cx="100" cy="105" r="62" fill="url(#bodyGrad)"/>
  <circle cx="100" cy="105" r="62" fill="none" stroke="#6A4A28" stroke-width="2" stroke-opacity="0.5"/>

  <!-- 耳朵（略微下塌） -->
  <ellipse cx="48" cy="62" rx="14" ry="10" fill="#7A5A38" transform="rotate(-35 48 62)"/>
  <ellipse cx="48" cy="62" rx="7" ry="5" fill="#D89898" transform="rotate(-35 48 62)"/>
  <ellipse cx="152" cy="62" rx="14" ry="10" fill="#7A5A38" transform="rotate(35 152 62)"/>
  <ellipse cx="152" cy="62" rx="7" ry="5" fill="#D89898" transform="rotate(35 152 62)"/>

  <!-- 头顶高光 -->
  <ellipse cx="76" cy="70" rx="22" ry="12" fill="rgba(255,255,255,0.28)"/>

  <!-- 眉头下弯（担心眉） -->
  <path d="M 70 84 Q 80 80 90 86" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 110 86 Q 120 80 130 84" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- 腮红（淡蓝） -->
  <ellipse cx="64" cy="120" rx="11" ry="6" fill="url(#cheekGrad)"/>
  <ellipse cx="136" cy="120" rx="11" ry="6" fill="url(#cheekGrad)"/>

  <!-- 左眼 -->
  <ellipse cx="80" cy="102" rx="6" ry="9" fill="#1A1A1A"/>
  <ellipse cx="78.5" cy="98" rx="2" ry="2.5" fill="#FFFFFF"/>
  <!-- 右眼 -->
  <ellipse cx="120" cy="102" rx="6" ry="9" fill="#1A1A1A"/>
  <ellipse cx="118.5" cy="98" rx="2" ry="2.5" fill="#FFFFFF"/>

  <!-- 左眼泪滴 -->
  <path d="M 88 110 Q 86 117 88 120 Q 90 117 88 110 Z" fill="#7FB3D5"/>

  <!-- 嘴（担心 - 下弯） -->
  <path d="M 84 132 Q 100 120 116 132" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
