<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 非遗匠人好物商城</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🎨</span>
                <span class="logo-text">非遗匠人</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首页</a></li>
                <li><a href="products.html">商品中心</a></li>
                <li><a href="craftsmen.html">匠人溯源</a></li>
                <li class="mobile-only"><a href="profile.html">个人中心</a></li>
            </ul>
            <div class="nav-actions">
                <div class="search-box">
                    <input type="text" placeholder="搜索非遗好物...">
                    <button>🔍</button>
                </div>
                <a href="profile.html" class="user-profile active">
                    <div class="user-avatar">👤</div>
                    <span class="user-name">点心</span>
                </a>
                <button class="cart-btn" id="cartBtn">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </button>
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
            </div>
        </nav>
    </header>

    <main class="profile-container" id="profileContainer"></main>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>购物车</h3>
            <button id="cartCloseBtn">✕</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">
                <i>🛒</i>
                <p>购物车是空的</p>
            </div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>合计：</span>
                <span class="total-price" id="cartTotal">¥0.00</span>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="goToCheckout()">去结算</button>
        </div>
    </div>
    <div class="cart-overlay" id="cartOverlay"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div id="modalIcon"></div>
            <h3 id="modalTitle"></h3>
            <p id="modalMessage"></p>
            <button class="btn btn-primary" id="modalBtn">确定</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay"></div>

    <script src="assets/data/data.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
