            <stop offset="0%" style="stop-color:#FDFBF7"/>
            <stop offset="100%" style="stop-color:#F5F3EE"/>
        </linearGradient>
        <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#C4956A"/>
            <stop offset="100%" style="stop-color:#A67C52"/>
