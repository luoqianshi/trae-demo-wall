    <text x="200" y="220" font-family="Noto Serif SC, serif" font-size="16" fill="#C4956A" text-anchor="middle">非遗好物</text>
    <text x="200" y="240" font-family="Noto Serif SC, serif" font-size="12" fill="#9B9B9B" text-anchor="middle">匠心传承</text>
