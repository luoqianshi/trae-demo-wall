<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业设备监控演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(30, 58, 95, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        .header h1 {
            color: #00d4ff;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            color: #94a3b8;
            font-size: 14px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(71, 85, 105, 0.5);
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #cbd5e1;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-running {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .status-warning {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }
        .status-stopped {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .value-display {
            text-align: center;
        }
        .value {
            font-size: 48px;
            font-weight: bold;
            color: #00d4ff;
        }
        .unit {
            font-size: 16px;
            color: #94a3b8;
            margin-top: 5px;
        }
        .progress-bar {
            height: 8px;
            background: rgba(71, 85, 105, 0.5);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #1e3a5f);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .chart-section {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(71, 85, 105, 0.5);
            margin-bottom: 30px;
        }
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 20px;
        }
        .chart-container {
            height: 200px;
            position: relative;
        }
        .chart-canvas {
            width: 100%;
            height: 100%;
        }
        .device-info {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(71, 85, 105, 0.5);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .info-item {
            text-align: center;
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
        }
        .info-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 14px;
            color: #f1f5f9;
            font-weight: 500;
        }
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-left: 10px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>工业设备实时监控系统</h1>
            <p>Industrial Equipment Real-time Monitoring System</p>
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span style="color: #22c55e; font-size: 12px;">实时监控中</span>
            </div>
        </div>

        <div class="status-grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">温度</span>
                    <span class="status-badge status-running">正常</span>
                </div>
                <div class="value-display">
                    <div class="value" id="temp-value">25.8</div>
                    <div class="unit">°C</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 52%"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">压力</span>
                    <span class="status-badge status-running">正常</span>
                </div>
                <div class="value-display">
                    <div class="value" id="pressure-value">1.2</div>
                    <div class="unit">MPa</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 40%"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">转速</span>
                    <span class="status-badge status-running">正常</span>
                </div>
                <div class="value-display">
                    <div class="value" id="speed-value">1500</div>
                    <div class="unit">RPM</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 60%"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">功率</span>
                    <span class="status-badge status-warning">警告</span>
                </div>
                <div class="value-display">
                    <div class="value" id="power-value">85.5</div>
                    <div class="unit">kW</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="background: linear-gradient(90deg, #eab308, #f59e0b);" style="width: 86%"></div>
                </div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-title">温度变化趋势</div>
            <div class="chart-container">
                <canvas class="chart-canvas" id="tempChart"></canvas>
            </div>
        </div>

        <div class="device-info">
            <div class="chart-title" style="margin-bottom: 15px;">设备信息</div>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">设备编号</div>
                    <div class="info-value">DEV-2024-001</div>
                </div>
                <div class="info-item">
                    <div class="info-label">运行时间</div>
                    <div class="info-value" id="run-time">128:45:32</div>
                </div>
                <div class="info-item">
                    <div class="info-label">状态</div>
                    <div class="info-value" style="color: #22c55e;">运行中</div>
                </div>
                <div class="info-item">
                    <div class="info-label">制造商</div>
                    <div class="info-value">工业自动化</div>
                </div>
                <div class="info-item">
                    <div class="info-label">型号</div>
                    <div class="info-value">IC-9000</div>
                </div>
                <div class="info-item">
                    <div class="info-label">软件版本</div>
                    <div class="info-value">v2.1.0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateValues() {
            document.getElementById('temp-value').textContent = (25 + Math.random() * 2).toFixed(1);
            document.getElementById('pressure-value').textContent = (1.0 + Math.random() * 0.5).toFixed(1);
            document.getElementById('speed-value').textContent = Math.floor(1450 + Math.random() * 100);
            document.getElementById('power-value').textContent = (80 + Math.random() * 10).toFixed(1);
            
            const timeEl = document.getElementById('run-time');
            if (timeEl) {
                const time = timeEl.textContent.split(':');
                let hours = parseInt(time[0]);
                let minutes = parseInt(time[1]);
                let seconds = parseInt(time[2]);
                seconds++;
                if (seconds >= 60) { seconds = 0; minutes++; }
                if (minutes >= 60) { minutes = 0; hours++; }
                timeEl.textContent = `${hours.toString().padStart(3, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        function drawChart() {
            const canvas = document.getElementById('tempChart');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            const width = canvas.width;
            const height = canvas.height;
            const padding = 40;
            
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = padding + (height - padding * 2) * i / 4;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();
                
                const temp = 28 - i * 2;
                ctx.fillStyle = '#94a3b8';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(temp + '°C', padding - 10, y + 4);
            }
            
            const points = [];
            for (let i = 0; i < 20; i++) {
                const x = padding + (width - padding * 2) * i / 19;
                const y = height - padding - (Math.random() * 60 + 40);
                points.push({ x, y });
            }
            
            ctx.beginPath();
            ctx.moveTo(points[0].x, height - padding);
            
            for (let i = 0; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            
            ctx.lineTo(points[points.length - 1].x, height - padding);
            ctx.closePath();
            
            const gradient = ctx.createLinearGradient(0, padding, 0, height - padding);
            gradient.addColorStop(0, 'rgba(0, 212, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 212, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
            
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath();
            ctx.arc(points[points.length - 1].x, points[points.length - 1].y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        setInterval(updateValues, 1000);
        drawChart();
        setInterval(drawChart, 2000);
    </script>
</body>
</html>
