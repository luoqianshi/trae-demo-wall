  .submit-btn { width:100%; padding:14px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; box-shadow:0 4px 16px rgba(13,148,136,0.35); }

  .rules-card { background:var(--card); border-radius:12px; padding:16px; margin:0 16px 16px; }

  .back-btn { background:none; border:none; color:#fff; font-size:20px; display:flex; align-items:center; gap:4px; }

  /* ===== Photo tip ===== */
  .photo-tip { background:#fffbeb; border:1px solid #fcd34d; border-radius:10px; padding:10px 14px; margin:0 16px 12px; font-size:12px; color:#92400e; display:flex; align-items:center; gap:8px; }

<!-- ===== MY REPORTS PAGE ===== -->
<div id="page-reports" class="page">
  <div class="header">
    <button class="back-btn" onclick="goToHome()">&#x25c0; 返回</button>
    <h1>我的上报</h1>
    <div style="width:60px;"></div>
  </div>

  <div class="summary-card">
    <div class="summary-item">
      <div class="num" id="totalReports">6</div>
      <div class="label">累计上报</div>
    </div>
    <div class="summary-item">
      <div class="num" id="totalRewards">&#x00a5;23.5</div>
      <div class="label">累计奖励</div>
    </div>
    <div class="summary-item">
      <div class="num" id="totalResolved">4</div>
      <div class="label">已处理</div>
    </div>
  </div>

  <div class="report-list" id="reportList">
    <!-- Items injected by JS -->
  </div>

  <div class="rules-card">
    <h3>&#x1f4dc; 奖励规则说明</h3>
    <p>
      1. 每次有效上报可获得 <span class="highlight">物业费减免 1-5元</span> 或 <span class="highlight">社区消费券</span>；<br>
      2. 同一地点的乱扔垃圾被 <span class="highlight">多人举报</span>，奖励由多人 <span class="highlight">平分</span>；<br>
      3. 高空抛物举报经监控 <span class="highlight">核实属实</span>，奖励翻倍；<br>
      4. 每月排名 TOP10 可获得额外 <span class="highlight">物业大礼包</span>。
    </p>
  </div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast">
  <div class="toast-icon">&#x2705;</div>
  <div id="toastText">上报成功！</div>
</div>

<script>
  let selectedType = null;
  const reports = [
    { id:'R20250710001', type:'litter', title:'A栋3楼楼道垃圾堆放', location:'A栋3楼东侧', time:'今天 07:32', reward:5.00, rewardType:'物业费减免', status:'done', statusText:'已处理' },
    { id:'R20250709002', type:'throw', title:'B栋12楼高空抛物', location:'B栋12层北侧', time:'昨天 22:15', reward:5.00, rewardType:'物业费减免', status:'processing', statusText:'取证中' },
    { id:'R20250708003', type:'litter', title:'中心花园绿化带垃圾', location:'中心花园东南角', time:'前天 06:45', reward:3.00, rewardType:'社区消费券', status:'done', statusText:'已处理' },
    { id:'R20250708004', type:'litter', title:'地下车库C区垃圾', location:'C-23车位旁', time:'前天 09:10', reward:3.00, rewardType:'社区消费券', status:'done', statusText:'已处理' },
    { id:'R20250706005', type:'throw', title:'D栋8楼抛烟头', location:'D栋8层南侧', time:'7月6日 19:20', reward:4.50, rewardType:'物业费减免', status:'done', statusText:'已处理' },
    { id:'R20250705006', type:'litter', title:'B栋2楼消防通道垃圾', location:'B栋2楼消防通道', time:'7月5日 08:05', reward:3.00, rewardType:'社区消费券', status:'pending', statusText:'待派发' },
  ];

  function selectType(el) {
    document.querySelectorAll('.option-card').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
    selectedType = el.dataset.type;
    document.getElementById('submitBtn').disabled = false;
  }

  function submitReport() {
    if(!selectedType) return;
    showToast('&#x2705; 上报成功！\n奖励将在核实后发放');
    setTimeout(()=>{ goToMyReports(); }, 1500);
  }

  function showToast(text) {
    const t = document.getElementById('toast');
    document.getElementById('toastText').innerHTML = text.replace(/\n/g,'<br>');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2500);
  }

  function goToMyReports() {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-reports').classList.add('active');
    renderReports();
  }

  function goToHome() {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-home').classList.add('active');
  }

  function renderReports() {
    const list = document.getElementById('reportList');
    list.innerHTML = reports.map(r=>`
      <div class="report-item ${r.type}">
        <div class="type-icon">${r.type==='litter'?'&#x1f9f9;':'&#x1f4a5;'}</div>
        <div class="report-info">
          <div class="title">${r.title}</div>
          <div class="meta">
            <span>&#x1f4cd; ${r.location}</span>
            <span>&#x23f0; ${r.time}</span>
          </div>
        </div>
        <div class="report-right">
          <div class="reward-amount">+&#x00a5;${r.reward.toFixed(2)}</div>
          <div class="reward-type">${r.rewardType}</div>
          <div class="status-badge status-${r.status}">${r.statusText}</div>
        </div>
      </div>
    `).join('');
  }
</script>
</body>
