<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知识库 · 赛博论文搭子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@300;400;500;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<style>
  .kb-wrap{position:fixed;top:60px;left:0;right:0;bottom:0;overflow-y:auto;max-width:1200px;margin:0 auto;padding:24px 32px;display:flex;gap:24px}
  .kb-sidebar{width:240px;flex-shrink:0;border:1px solid var(--line);border-radius:4px;background:rgba(17,26,46,.5);padding:16px;max-height:calc(100vh - 120px);overflow-y:auto}
  .kb-main{flex:1;min-width:0}
  .tabs{display:flex;gap:12px;margin-bottom:20px}
  .tabs button{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:8px 18px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;transition:all .2s}
  .tabs button:hover{border-color:var(--line-strong);color:var(--ink)}
  .tabs button.active{background:rgba(0,240,255,.1);border-color:var(--cyan);color:var(--cyan)}
  .upload-bar{display:flex;gap:12px;align-items:center;margin-bottom:20px;padding:14px;border:1px dashed var(--line-strong);border-radius:4px;background:rgba(0,240,255,.03);flex-wrap:wrap}
  .upload-bar select,.upload-bar input[type=text]{background:rgba(0,240,255,.04);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:3px;font-family:var(--mono);font-size:12px}
  .upload-bar select{appearance:none;padding-right:24px}
  .upload-bar input[type=file]{color:var(--ink-dim);font-family:var(--mono);font-size:12px}
  .upload-bar button{background:rgba(0,240,255,.1);border:1px solid var(--cyan);color:var(--cyan);padding:8px 16px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.06em;transition:all .2s}
  .upload-bar button:hover{background:rgba(0,240,255,.18)}
  .sidebar-title{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:10px;padding:0 4px}
  .folder-tree{font-family:var(--mono);font-size:12px}
  .folder-node{padding:5px 8px;border-radius:2px;cursor:pointer;color:var(--ink-dim);transition:all .15s;display:flex;align-items:center;gap:6px}
  .folder-node:hover{background:rgba(0,240,255,.06);color:var(--ink)}
  .folder-node.active{background:rgba(0,240,255,.1);color:var(--cyan);border-left:2px solid var(--cyan)}
  .folder-node .icon{opacity:.7}
  .folder-node .actions{margin-left:auto;display:none;gap:4px}
  .folder-node:hover .actions{display:flex}
  .folder-node .actions button{background:transparent;border:none;color:var(--ink-faint);cursor:pointer;padding:0 4px;font-size:11px}
  .folder-node .actions button:hover{color:var(--amber)}
  .folder-add{margin-top:10px;padding:8px;border:1px dashed var(--line);border-radius:2px;text-align:center;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .folder-add:hover{border-color:var(--cyan);color:var(--cyan)}
  .paper-list{display:flex;flex-direction:column;gap:12px}
  .paper-card{padding:18px 22px;border:1px solid var(--line);border-radius:4px;background:rgba(17,26,46,.6);transition:border-color .2s}
  .paper-card:hover{border-color:var(--line-strong)}
  .paper-card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
  .paper-card .title{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink)}
  .paper-card .meta{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
  .paper-card .badge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:2px;letter-spacing:.08em;text-transform:uppercase}
  .badge.style_sample{background:rgba(124,92,255,.12);color:var(--violet);border:1px solid rgba(124,92,255,.3)}
  .badge.to_read{background:rgba(0,240,255,.08);color:var(--cyan);border:1px solid rgba(0,240,255,.3)}
  .badge.read_history{background:rgba(255,181,71,.08);color:var(--amber);border:1px solid rgba(255,181,71,.3)}
  .paper-card .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .paper-card .actions button{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:4px 10px;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.06em;transition:all .15s}
  .paper-card .actions button:hover{border-color:var(--line-strong);color:var(--ink)}
  .paper-card .actions button.danger:hover{border-color:#ff5f56;color:#ff5f56}
  .paper-card .actions button.primary{border-color:var(--cyan);color:var(--cyan)}
  .paper-card .actions .folder-picker{font-size:10px}
  .empty-kb{text-align:center;padding:80px 20px;color:var(--ink-faint)}
  .empty-kb .glyph{font-size:60px;margin-bottom:16px;opacity:.3}
  .empty-kb p{font-family:var(--mono);font-size:12px;letter-spacing:.1em}
  /* Preview Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(5,8,15,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:40px;backdrop-filter:blur(4px)}
  .modal-overlay.show{display:flex}
  .modal{width:100%;max-width:800px;max-height:90vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 30px 80px -30px rgba(0,240,255,.3)}
  /* Wider modal for PDF preview so the iframe has room */
  .modal-overlay.preview-pdf .modal{max-width:1100px;max-height:94vh}
  .modal-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .modal-head h3{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink)}
  .modal-head .close{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:4px 12px;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:11px}
  .modal-head .close:hover{border-color:var(--amber);color:var(--amber)}
  .modal-body{flex:1;overflow-y:auto;padding:24px;font-family:var(--body);font-size:14px;line-height:1.6;color:var(--ink-dim);white-space:pre-wrap}
  .modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .modal-foot button{background:rgba(0,240,255,.1);border:1px solid var(--cyan);color:var(--cyan);padding:8px 18px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .modal-foot button:hover{background:rgba(0,240,255,.18)}
  /* Preview body variants */
  .preview-loading,.preview-error{font-family:var(--mono);font-size:12px;color:var(--ink-faint);letter-spacing:.08em;padding:24px;text-align:center}
  .modal-body .pdf-frame{width:100%;height:calc(90vh - 220px);min-height:480px;border:1px solid var(--line);border-radius:4px;background:#fff}
  .modal-body .preview-text-toggle{text-align:center;margin-top:12px}
  .modal-body .toggle-text{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:5px 14px;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em}
  .modal-body .toggle-text:hover{border-color:var(--cyan);color:var(--cyan)}
  .modal-body pre.parsed-pre,.modal-body pre.tex-source{
    font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--ink-dim);
    background:rgba(5,10,20,.5);border:1px solid var(--line);border-radius:4px;
    padding:14px 16px;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow-y:auto;
  }
  .modal-body pre.tex-source{color:var(--cyan);opacity:.9}
  .modal-body details.parsed-section{margin-top:14px}
  .modal-body details.parsed-section summary{
    cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--ink-faint);
    letter-spacing:.08em;padding:6px 0;
  }
  .modal-body details.parsed-section summary:hover{color:var(--cyan)}
  .modal-body details.parsed-section[open] summary{margin-bottom:8px;color:var(--cyan)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-blob glow-1"></div>
<div class="glow-blob glow-2"></div>

<div class="topbar">
  <div class="left">
    <span class="dot"></span>
    <span>CyberPaper_Pal // v0.1</span>
  </div>
  <nav>
    <a href="/app">对话</a>
    <a href="/kb" class="active">知识库</a>
    <a href="/memories">记忆</a>
  </nav>
  <div><span id="userStatus"></span> <a href="#" id="logoutLink" style="color:var(--amber);text-decoration:none;display:none">登出</a></div>
</div>

<div class="kb-wrap">
  <aside class="kb-sidebar">
    <div class="sidebar-title">FOLDERS</div>
    <div class="folder-tree" id="folderTree"></div>
    <div class="folder-add" id="folderAdd">+ 新建文件夹</div>
  </aside>
  <div class="kb-main">
    <div class="tabs">
      <button class="active" data-status="">全部</button>
      <button data-status="to_read">待读</button>
      <button data-status="style_sample">风格样本</button>
      <button data-status="read_history">阅读历史</button>
    </div>

    <div class="upload-bar">
      <input type="file" id="fileInput" accept=".pdf,.tex,.latex,.txt">
      <select id="kindSelect">
        <option value="to_read">待读论文</option>
        <option value="style_sample">风格样本</option>
      </select>
      <input type="text" id="titleInput" placeholder="标题(可选)">
      <button id="uploadBtn">上传</button>
    </div>

    <div class="paper-list" id="paperList"></div>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="previewTitle">论文预览</h3>
      <button class="close" id="previewClose">关闭</button>
    </div>
    <div class="modal-body" id="previewBody">加载中…</div>
    <div class="modal-foot">
      <button id="previewChat">开始对话</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='kb.js') }}"></script>
<script>
// Auth (reuse pattern from app.js)
fetch('/api/me').then(function(r){return r.json();}).then(function(d){
  if(d.logged_in){ document.getElementById('userStatus').textContent=d.username; document.getElementById('logoutLink').style.display='inline'; }
});
document.getElementById('logoutLink').addEventListener('click',function(e){e.preventDefault();fetch('/auth/logout',{method:'POST'}).then(function(){window.location.href='/auth/login';});});
</script>
</body>
</html>
