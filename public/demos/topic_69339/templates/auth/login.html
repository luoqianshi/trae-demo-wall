<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 赛博论文搭子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@300;400;500;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1a;--panel:#111a2e;--ink:#e8e6e1;--ink-dim:#9aa3b8;--ink-faint:#5a6478;
    --cyan:#00f0ff;--amber:#ffb547;--line:rgba(0,240,255,0.14);--line-strong:rgba(0,240,255,0.35);
    --serif:'Fraunces',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--body:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:400px;padding:48px 36px;border:1px solid var(--line-strong);border-radius:6px;background:linear-gradient(180deg,rgba(17,26,46,.85),rgba(13,20,36,.6));box-shadow:0 30px 80px -40px rgba(0,240,255,.25)}
  .card h1{font-family:var(--serif);font-weight:600;font-size:28px;margin-bottom:8px}
  .card h1 em{font-style:italic;color:var(--cyan);font-weight:400}
  .card .sub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:36px}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:8px}
  input{width:100%;padding:12px 14px;background:rgba(0,240,255,.04);border:1px solid var(--line);border-radius:3px;color:var(--ink);font-family:var(--body);font-size:15px;outline:none;transition:border-color .2s}
  input:focus{border-color:var(--cyan)}
  .field{margin-bottom:22px}
  button{width:100%;padding:12px;background:rgba(0,240,255,.1);border:1px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:3px;cursor:pointer;transition:all .2s}
  button:hover{background:rgba(0,240,255,.18);box-shadow:0 0 16px -4px var(--cyan)}
  .error{color:var(--amber);font-family:var(--mono);font-size:12px;margin-top:14px;display:none}
  .link-row{margin-top:24px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
  .link-row a{color:var(--cyan);text-decoration:none}
  .link-row a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <h1>赛博论文<em>搭子</em></h1>
  <p class="sub">// login to your pal</p>
  <form id="form">
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">登录</button>
    <div class="error" id="error"></div>
  </form>
  <div class="link-row">还没有账号？<a href="/auth/register">注册</a></div>
</div>
<script>
(function(){
  var form = document.getElementById('form');
  var errEl = document.getElementById('error');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    errEl.style.display = 'none';
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    fetch('/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:username, password:password})
    })
    .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
    .then(function(res){
      if(res.status === 200 && res.data.ok){
        window.location.href = '/app';
      } else {
        errEl.textContent = res.data.error || 'login failed';
        errEl.style.display = 'block';
      }
    })
    .catch(function(){ errEl.textContent='network error'; errEl.style.display='block'; });
  });
})();
</script>
</body>
</html>
