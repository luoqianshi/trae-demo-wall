<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>游客体验 · 赛博论文搭子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@300;400;500;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<style>
  .demo-banner{
    position:fixed;top:48px;left:0;right:0;z-index:46;
    padding:10px 32px;
    background:linear-gradient(90deg, rgba(255,181,71,.18), rgba(255,181,71,.08));
    border-bottom:1px solid rgba(255,181,71,.3);
    font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.08em;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .demo-banner a{color:var(--cyan);text-decoration:none;border:1px solid var(--cyan);padding:4px 12px;border-radius:2px}
  .demo-banner a:hover{background:rgba(0,240,255,.12)}
  /* Push the dialog down below the banner */
  .chat-wrap{top:140px !important}
  .context-bar{top:96px !important}
  .input-wrap textarea{background:rgba(255,181,71,.04);color:var(--ink-faint);cursor:not-allowed}
  .input-wrap textarea::placeholder{color:var(--amber)}
  .input-wrap button{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-blob glow-1"></div>
<div class="glow-blob glow-2"></div>

<!-- topbar -->
<div class="topbar">
  <div class="left">
    <span class="dot"></span>
    <span>CyberPaper_Pal // v0.1 [DEMO]</span>
  </div>
  <nav>
    <a href="/demo" class="active">对话</a>
    <a href="#">知识库</a>
    <a href="#">记忆</a>
  </nav>
  <div>
    <span id="userStatus">游客</span>
    <a href="/auth/register" style="color:var(--amber);text-decoration:none;margin-left:12px">注册以保存进度 →</a>
  </div>
</div>

<!-- demo banner -->
<div class="demo-banner">
  <span>// 游客模式 — 以下为预置示例对话,只读浏览。注册后可上传自己的论文并与搭子对话。</span>
  <a href="/auth/register">立即注册</a>
</div>

<!-- context bar: shows the demo session's topic -->
<div class="context-bar">
  <div class="persona-switch">
    <span class="label">IDENTITY</span>
    <button class="active" data-persona="fresh">研一新生</button>
    <button data-persona="senior">博三老手</button>
    <button data-persona="cross">跨学科者</button>
  </div>
  <div class="paper-select-wrap">
    <span class="label">PAPER</span>
    <select id="paperSelect" disabled>
      <option id="demoPaperOption">加载中…</option>
    </select>
    <button id="newSessionBtn" disabled>新会话</button>
  </div>
</div>

<!-- dialog -->
<div class="chat-wrap">
  <div class="dialog" id="dialog">
    <div class="empty-hint" id="emptyHint">
      <div class="glyph">▌</div>
      <h2>正在加载示例对话…</h2>
      <p>// demo</p>
    </div>
  </div>
</div>

<!-- input (disabled in demo) -->
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="input" placeholder="游客模式下输入已禁用 — 注册后即可对话" rows="1" disabled></textarea>
    <button id="send" disabled>发送</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var dialog = document.getElementById('dialog');
  var emptyHint = document.getElementById('emptyHint');

  function appendTurn(role, content){
    if(emptyHint){ emptyHint.remove(); emptyHint = null; }
    var turn = document.createElement('div');
    turn.className = 'turn ' + role;
    var roleEl = document.createElement('div');
    roleEl.className = 'role';
    roleEl.innerHTML = '<span class="pip"></span>' + (role === 'user' ? 'YOU' : 'CYBERPAPER PAL');
    var msg = document.createElement('div');
    msg.className = 'msg';
    // Render newlines + basic emphasis. Keep it minimal — no raw HTML from content.
    msg.textContent = content;
    msg.style.whiteSpace = 'pre-wrap';
    turn.appendChild(roleEl);
    turn.appendChild(msg);
    dialog.appendChild(turn);
  }

  // Render basic markdown-ish emphasis (**bold** only) without allowing raw HTML.
  function renderText(el, text){
    el.textContent = '';
    var parts = text.split(/(\*\*[^*]+\*\*)/g);
    parts.forEach(function(p){
      if(!p) return;
      if(p.startsWith('**') && p.endsWith('**')){
        var b = document.createElement('b');
        b.textContent = p.slice(2, -2);
        el.appendChild(b);
      } else {
        el.appendChild(document.createTextNode(p));
      }
    });
    el.style.whiteSpace = 'pre-wrap';
  }

  function renderTurn(role, content){
    if(emptyHint){ emptyHint.remove(); emptyHint = null; }
    var turn = document.createElement('div');
    turn.className = 'turn ' + role;
    var roleEl = document.createElement('div');
    roleEl.className = 'role';
    roleEl.innerHTML = '<span class="pip"></span>' + (role === 'user' ? 'YOU' : 'CYBERPAPER PAL');
    var msg = document.createElement('div');
    msg.className = 'msg';
    renderText(msg, content);
    turn.appendChild(roleEl);
    turn.appendChild(msg);
    dialog.appendChild(turn);
  }

  fetch('/api/demo/sessions').then(function(r){return r.json();}).then(function(data){
    if(!data || !data.session){
      if(emptyHint){
        emptyHint.querySelector('h2').textContent = '示例对话尚未就绪';
        emptyHint.querySelector('p').textContent = '// 请稍后重试或直接注册体验';
      }
      return;
    }
    var s = data.session;
    var opt = document.getElementById('demoPaperOption');
    opt.textContent = s.paper ? (s.paper.title || s.paper.filename) : (s.topic || s.title || '示例会话');
    if(data.messages && data.messages.length){
      data.messages.forEach(function(m){ renderTurn(m.role, m.content); });
      dialog.scrollTop = dialog.scrollHeight;
    } else if(emptyHint){
      emptyHint.querySelector('h2').textContent = '示例会话为空';
    }
  }).catch(function(){
    if(emptyHint){
      emptyHint.querySelector('h2').textContent = '加载失败';
      emptyHint.querySelector('p').textContent = '// 请检查后端服务';
    }
  });
})();
</script>
</body>
</html>
