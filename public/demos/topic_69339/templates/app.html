<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>赛博论文搭子 · CyberPaper Pal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@300;400;500;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-blob glow-1"></div>
<div class="glow-blob glow-2"></div>

<!-- topbar -->
<div class="topbar">
  <div class="left">
    <span class="dot"></span>
    <span>CyberPaper_Pal // v0.1</span>
  </div>
  <nav>
    <a href="/app" class="active">对话</a>
    <a href="/kb">知识库</a>
    <a href="/memories">记忆</a>
  </nav>
  <div><span id="userStatus"></span> <a href="#" id="logoutLink" style="color:var(--amber);text-decoration:none;display:none">登出</a></div>
</div>

<!-- context bar: persona + paper selector -->
<div class="context-bar">
  <div class="persona-switch">
    <span class="label">IDENTITY</span>
    <button data-tag="研一新生">研一新生</button>
    <button data-tag="博三老手">博三老手</button>
    <button data-tag="跨学科者">跨学科者</button>
    <input type="text" id="tagInput" placeholder="+ 自定义标签" maxlength="20" />
    <span class="tag-list" id="tagList"></span>
  </div>
  <div class="paper-select-wrap">
    <span class="label">PAPERS</span>
    <select id="paperSelect" multiple size="1" title="Ctrl+点击多选">
      <option value="">自由对话(无论文)</option>
    </select>
    <input type="text" id="topicInput" placeholder="主题(可选)" maxlength="60" />
    <button id="newSessionBtn">新会话</button>
  </div>
</div>
<!-- current session topic banner -->
<div class="topic-banner" id="topicBanner" style="display:none"></div>

<!-- dialog -->
<div class="chat-wrap">
  <div class="dialog" id="dialog">
    <div class="empty-hint" id="emptyHint">
      <div class="glyph">▌</div>
      <h2>赛博论文搭子已就位</h2>
      <p>// 选择身份和论文,对搭子说点什么</p>
    </div>
  </div>
</div>

<!-- input -->
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="input" placeholder="对搭子说点什么……" rows="1"></textarea>
    <button id="send">发送</button>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
