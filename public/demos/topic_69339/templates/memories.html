<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>记忆 · 赛博论文搭子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@300;400;500;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<style>
  .mem-wrap{position:fixed;top:60px;left:0;right:0;bottom:0;overflow-y:auto;max-width:1100px;margin:0 auto;padding:24px 32px}
  .mem-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px}
  .mem-head h1{font-family:var(--serif);font-weight:600;font-size:24px;color:var(--ink)}
  .mem-head .sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
  .mem-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
  .mem-toolbar select,.mem-toolbar input[type=text]{
    background:rgba(0,240,255,.04);border:1px solid var(--line);color:var(--ink);
    padding:8px 12px;border-radius:3px;font-family:var(--mono);font-size:12px;outline:none;
  }
  .mem-toolbar select{appearance:none;padding-right:24px}
  .mem-toolbar input[type=text]{flex:1;min-width:200px}
  .mem-toolbar button{
    background:rgba(0,240,255,.1);border:1px solid var(--cyan);color:var(--cyan);
    padding:8px 16px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:12px;
    letter-spacing:.06em;transition:all .2s;
  }
  .mem-toolbar button:hover{background:rgba(0,240,255,.18)}
  .mem-empty{text-align:center;padding:80px 20px;color:var(--ink-faint)}
  .mem-empty .glyph{font-size:60px;margin-bottom:16px;opacity:.3}
  .mem-empty p{font-family:var(--mono);font-size:12px;letter-spacing:.1em}
  .mem-group{margin-bottom:24px}
  .mem-group-title{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-faint);
    text-transform:uppercase;margin-bottom:10px;padding:0 4px;
    display:flex;align-items:center;gap:8px;
  }
  .mem-group-title .count{color:var(--cyan);font-size:10px}
  .mem-card{
    border:1px solid var(--line);border-radius:4px;background:rgba(17,26,46,.6);
    padding:16px 20px;margin-bottom:10px;transition:border-color .2s;
  }
  .mem-card:hover{border-color:var(--line-strong)}
  .mem-card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
  .mem-card .name{font-family:var(--serif);font-weight:600;font-size:16px;color:var(--ink)}
  .mem-card .desc{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.04em;margin-bottom:8px}
  .mem-card .content{
    font-family:var(--body);font-size:13.5px;line-height:1.6;color:var(--ink-dim);
    background:rgba(5,10,20,.4);border:1px solid var(--line);border-radius:3px;
    padding:10px 12px;white-space:pre-wrap;word-break:break-word;margin-bottom:8px;
  }
  .mem-card .meta{
    display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;
    color:var(--ink-faint);letter-spacing:.06em;
  }
  .mem-card .meta .why::before{content:"WHY: "}
  .mem-card .meta .how::before{content:"HOW: "}
  .mem-card .actions{display:flex;gap:6px;margin-top:10px}
  .mem-card .actions button{
    background:transparent;border:1px solid var(--line);color:var(--ink-dim);
    padding:4px 10px;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:10px;
    letter-spacing:.06em;transition:all .15s;
  }
  .mem-card .actions button:hover{border-color:var(--line-strong);color:var(--ink)}
  .mem-card .actions button.danger:hover{border-color:#ff5f56;color:#ff5f56}
  .mem-card .actions button.save{border-color:var(--cyan);color:var(--cyan)}
  .mem-card .actions button.save:hover{background:rgba(0,240,255,.1)}
  /* Edit mode */
  .mem-card.editing .name-field,
  .mem-card.editing .desc-field,
  .mem-card.editing .content-field,
  .mem-card.editing .why-field,
  .mem-card.editing .how-field{
    display:block;
  }
  .mem-card .name-field,
  .mem-card .desc-field,
  .mem-card .content-field,
  .mem-card .why-field,
  .mem-card .how-field{display:none}
  .mem-card.editing .name,
  .mem-card.editing .desc,
  .mem-card.editing .content,
  .mem-card.editing .meta{display:none}
  .mem-card input[type=text].name-field,
  .mem-card input[type=text].desc-field,
  .mem-card input[type=text].why-field,
  .mem-card input[type=text].how-field{
    width:100%;background:rgba(0,240,255,.04);border:1px solid var(--line);color:var(--ink);
    padding:6px 10px;border-radius:2px;font-family:var(--mono);font-size:12px;outline:none;margin-bottom:8px;
  }
  .mem-card input[type=text].name-field{font-family:var(--serif);font-size:15px;font-weight:600}
  .mem-card textarea.content-field{
    width:100%;min-height:120px;background:rgba(5,10,20,.4);border:1px solid var(--line);
    color:var(--ink-dim);padding:10px 12px;border-radius:3px;font-family:var(--body);font-size:13.5px;
    line-height:1.6;resize:vertical;outline:none;margin-bottom:8px;
  }
  .mem-card .field-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);
    text-transform:uppercase;display:block;margin-bottom:4px;
  }
  .mem-card .badge{
    display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:2px;
    letter-spacing:.1em;text-transform:uppercase;margin-left:8px;vertical-align:middle;
  }
  .badge.user_profile{background:rgba(0,240,255,.08);color:var(--cyan);border:1px solid rgba(0,240,255,.3)}
  .badge.feedback{background:rgba(255,181,71,.08);color:var(--amber);border:1px solid rgba(255,181,71,.3)}
  .badge.research_context{background:rgba(124,92,255,.08);color:var(--violet);border:1px solid rgba(124,92,255,.3)}
  .badge.reading_insight{background:rgba(0,240,255,.08);color:var(--cyan);border:1px solid rgba(0,240,255,.3)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-blob glow-1"></div>
<div class="glow-blob glow-2"></div>

<div class="topbar">
  <div class="left">
    <span class="dot"></span>
    <span>CyberPaper_Pal // v0.1</span>
  </div>
  <nav>
    <a href="/app">对话</a>
    <a href="/kb">知识库</a>
    <a href="/memories" class="active">记忆</a>
  </nav>
  <div><span id="userStatus"></span> <a href="#" id="logoutLink" style="color:var(--amber);text-decoration:none;display:none">登出</a></div>
</div>

<div class="mem-wrap">
  <div class="mem-head">
    <h1>记忆碎片</h1>
    <span class="sub">// 模型总结 · 可手动编辑</span>
  </div>
  <div class="mem-toolbar">
    <select id="typeFilter">
      <option value="">全部类型</option>
      <option value="user_profile">user_profile</option>
      <option value="feedback">feedback</option>
      <option value="research_context">research_context</option>
      <option value="reading_insight">reading_insight</option>
    </select>
    <input type="text" id="searchInput" placeholder="按名称或内容搜索…" />
    <button id="newBtn">+ 新建记忆</button>
  </div>
  <div id="memList"></div>
</div>

<script src="{{ url_for('static', filename='memories.js') }}"></script>
<script>
fetch('/api/me').then(function(r){return r.json();}).then(function(d){
  if(d.logged_in){ document.getElementById('userStatus').textContent=d.username; document.getElementById('logoutLink').style.display='inline'; }
});
document.getElementById('logoutLink').addEventListener('click',function(e){e.preventDefault();fetch('/auth/logout',{method:'POST'}).then(function(){window.location.href='/auth/login';});});
</script>
</body>
</html>
