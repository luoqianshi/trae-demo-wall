<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="智序番茄——根据任务重要度动态规划番茄时钟，仅在明确授权后调整的工作学习助手。可体验的交互式 Demo。">
  <title>智序番茄 · 交互体验版</title>
  <style>
    :root {
      --ink: #17211b;
      --ink-soft: #5d6961;
      --paper: #f7f7f1;
      --card: rgba(255, 255, 255, .9);
      --line: rgba(23, 33, 27, .11);
      --green: #2b6b4d;
      --green-dark: #174f37;
      --mint: #dff2e4;
      --lime: #dcec76;
      --yellow: #f5d861;
      --coral: #ff7b61;
      --violet: #8d7bf2;
      --blue: #67a9e7;
      --shadow: 0 24px 70px rgba(24, 57, 39, .10);
      --shadow-sm: 0 8px 30px rgba(31, 50, 38, .04);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 4% 8%, rgba(220, 236, 118, .28), transparent 25rem),
        radial-gradient(circle at 92% 12%, rgba(103, 169, 231, .12), transparent 28rem),
        var(--paper);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      line-height: 1.55;
      min-height: 100vh;
    }
    button, select, input { font: inherit; }
    button { cursor: pointer; border: 0; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }
    [x-cloak] { display: none !important; }
    ::selection { background: var(--lime); }

    .shell { width: min(1180px, calc(100% - 36px)); margin: 0 auto; }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 14px 0;
      background: rgba(247,247,241,.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.03em; font-size: 18px; }
    .brand-mark {
      width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px;
      color: white; background: var(--green); box-shadow: 0 9px 24px rgba(43, 107, 77, .22);
    }
    .brand-mark svg { width: 21px; height: 21px; }
    .topbar-meta { display: flex; align-items: center; gap: 18px; }
    .date-pill { color: var(--ink-soft); font-size: 13px; }
    .reset-btn { color: var(--ink-soft); font-size: 12px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); transition: all .18s; }
    .reset-btn:hover { color: var(--ink); border-color: var(--ink-soft); }

    /* ---------- Layout ---------- */
    .app { display: grid; grid-template-columns: 360px 1fr; gap: 22px; padding: 24px 0 60px; align-items: start; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .panel-label { font-size: 11px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; color: var(--green); }

    /* ---------- Left: tasks ---------- */
    .add-bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 14px 16px 0; }
    .add-bar input {
      padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      outline: none; font-size: 14px; background: white;
    }
    .add-bar input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(43,107,77,.1); }
    .add-btn {
      width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--green); color: white;
      font-size: 22px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 8px 18px rgba(43,107,77,.22);
      transition: transform .15s;
    }
    .add-btn:hover { transform: translateY(-1px); }

    .task-list { list-style: none; margin: 0; padding: 10px 8px 14px; }
    .task-item {
      display: grid; grid-template-columns: 8px 1fr auto auto; gap: 10px; align-items: center;
      padding: 12px 10px; border-radius: var(--radius-md); transition: background .15s;
    }
    .task-item:hover { background: rgba(43,107,77,.04); }
    .task-item.active { background: var(--mint); }
    .task-item.done { opacity: .5; }
    .task-item.done .task-name { text-decoration: line-through; }
    .color-chip { width: 6px; height: 30px; border-radius: 999px; }
    .task-main { min-width: 0; }
    .task-name { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-meta { font-size: 11px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; margin-top: 2px; }
    .pomo-mini { display: inline-flex; gap: 2px; }
    .pomo-mini i { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
    .pomo-mini i.filled { background: var(--coral); }
    .pomo-mini i.empty { background: rgba(255,123,97,.25); }

    .priority-select {
      padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px;
      background: white; outline: none; color: var(--ink); cursor: pointer;
    }
    .priority-select:focus { border-color: var(--green); }
    .del-btn {
      width: 28px; height: 28px; border-radius: 8px; color: var(--ink-soft); font-size: 16px;
      display: grid; place-items: center; opacity: 0; transition: all .15s;
    }
    .task-item:hover .del-btn { opacity: 1; }
    .del-btn:hover { background: #f7e8e4; color: #a8402d; }

    .task-foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-soft); }
    .task-foot b { color: var(--green-dark); }

    /* ---------- Right column ---------- */
    .right-col { display: flex; flex-direction: column; gap: 18px; }

    /* ---------- Focus card ---------- */
    .focus-card {
      position: relative; overflow: hidden;
      padding: 28px 30px; border-radius: var(--radius-xl); color: white;
      background: linear-gradient(135deg, var(--green-dark) 0%, #0f3a26 100%);
      box-shadow: var(--shadow);
    }
    .focus-card::after {
      content: ""; position: absolute; width: 240px; height: 240px; right: -70px; top: -90px;
      border-radius: 50%; background: var(--lime); opacity: .14; pointer-events: none;
    }
    .focus-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; color: rgba(255,255,255,.7); font-size: 12px; position: relative; z-index: 1; }
    .mode-pill { padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.1); font-weight: 700; }
    .mode-pill.break { background: rgba(220,236,118,.22); color: var(--lime); }
    .focus-task { margin: 14px 0 6px; font-size: 18px; font-weight: 750; letter-spacing: -.01em; position: relative; z-index: 1; }
    .focus-task .muted { color: rgba(255,255,255,.5); font-weight: 500; font-size: 14px; }

    .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 6px; position: relative; z-index: 1; flex-wrap: wrap; }
    .timer {
      font-size: 64px; font-weight: 800; letter-spacing: -.05em; font-variant-numeric: tabular-nums; line-height: 1;
    }
    .timer.break { color: var(--lime); }
    .timer-controls { display: flex; gap: 9px; align-items: center; }
    .ctrl-btn {
      width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.12); color: white;
      display: grid; place-items: center; transition: all .15s; font-size: 16px;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.22); transform: translateY(-2px); }
    .ctrl-btn.primary { width: 56px; height: 56px; background: var(--lime); color: var(--green-dark); font-size: 20px; }
    .ctrl-btn.primary:hover { background: #e8f06a; }
    .ctrl-btn svg { width: 18px; height: 18px; }

    .focus-progress { height: 6px; margin-top: 18px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.16); position: relative; z-index: 1; }
    .focus-progress span { display: block; height: 100%; width: 0%; background: var(--lime); transition: width .4s linear; }

    /* ---------- Pending banner (the authorization principle) ---------- */
    .pending-banner {
      display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center;
      padding: 18px 22px; border-radius: var(--radius-lg); background: #fff7cf; border: 1px solid #f0e08a;
      animation: slideDown .25s ease;
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .pending-banner .pb-title { font-weight: 800; font-size: 14px; color: #755b07; display: flex; align-items: center; gap: 8px; }
    .pending-banner .pb-title .pulse { width: 9px; height: 9px; border-radius: 50%; background: #d4a900; box-shadow: 0 0 0 4px rgba(212,169,0,.18); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px rgba(212,169,0,.18); } 50% { box-shadow: 0 0 0 8px rgba(212,169,0,.08); } }
    .pending-reasons { margin: 8px 0 0; padding: 0; list-style: none; }
    .pending-reasons li { font-size: 12px; color: #6b5406; padding: 3px 0; padding-left: 16px; position: relative; }
    .pending-reasons li::before { content: "›"; position: absolute; left: 4px; color: #b8940a; font-weight: 800; }
    .pending-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .banner-btn { padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 750; transition: all .15s; white-space: nowrap; }
    .banner-btn.primary { background: var(--green); color: white; box-shadow: 0 8px 18px rgba(43,107,77,.22); }
    .banner-btn.primary:hover { transform: translateY(-1px); }
    .banner-btn.ghost { background: white; color: var(--ink); border: 1px solid var(--line); }

    /* protected state strip */
    .protect-strip {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--radius-md);
      background: var(--mint); color: var(--green-dark); font-size: 12px;
    }
    .protect-strip .shield { font-size: 16px; }
    .protect-strip b { font-weight: 800; }

    /* ---------- Schedule timeline ---------- */
    .schedule-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
    .schedule-meta { text-align: right; }
    .schedule-meta strong { display: block; font-size: 22px; letter-spacing: -.04em; }
    .schedule-meta span { color: var(--ink-soft); font-size: 11px; }

    .timeline { padding: 12px 22px 22px; position: relative; }
    .timeline::before { content: ""; position: absolute; left: 64px; top: 20px; bottom: 24px; width: 1px; background: var(--line); }
    .sched-item { position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 18px; padding: 7px 0; }
    .sched-time { padding-top: 14px; color: var(--ink-soft); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
    .sched-block {
      position: relative; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
      min-height: 58px; padding: 12px 15px; border-radius: 13px; background: #f6f8f5; border-left: 4px solid var(--task-color); transition: all .18s;
    }
    .sched-block::before {
      content: ""; position: absolute; left: -26px; top: 22px; width: 8px; height: 8px; border: 3px solid white;
      border-radius: 50%; background: var(--task-color); box-shadow: 0 0 0 1px var(--line);
    }
    .sched-block.done { opacity: .5; }
    .sched-block.done .sched-name { text-decoration: line-through; }
    .sched-block.active { background: #eef7f0; box-shadow: 0 6px 18px rgba(43,107,77,.1); transform: translateX(2px); }
    .sched-name { font-size: 14px; font-weight: 650; }
    .sched-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
    .sched-pomos { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; width: 56px; }
    .sched-pomos i { width: 10px; height: 10px; border-radius: 50% 50% 48% 52%; background: var(--coral); transition: all .2s; }
    .sched-pomos i.done { background: var(--green); }
    .sched-pomos i.cur { background: var(--yellow); box-shadow: 0 0 0 3px rgba(245,216,97,.3); transform: scale(1.15); }
    .sched-start-btn {
      margin-left: 8px; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700;
      background: var(--green); color: white; transition: all .15s;
    }
    .sched-start-btn:hover { transform: translateY(-1px); }
    .sched-start-btn:disabled { background: var(--mint); color: var(--green-dark); cursor: default; transform: none; }

    /* ---------- Stats ---------- */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
    .stat { padding: 18px 22px; background: white; }
    .stat strong { display: block; font-size: 26px; letter-spacing: -.04em; color: var(--green-dark); }
    .stat span { font-size: 11px; color: var(--ink-soft); }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; z-index: 50; right: 22px; bottom: 22px; max-width: 360px;
      padding: 14px 18px; border-radius: 13px; color: white; background: var(--ink);
      box-shadow: 0 16px 40px rgba(0,0,0,.18); font-size: 13px;
      opacity: 0; transform: translateY(12px); transition: all .25s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ---------- Footer note ---------- */
    .principle-note {
      margin-top: 14px; padding: 14px 18px; border-radius: var(--radius-md); border: 1px dashed var(--line);
      font-size: 12px; color: var(--ink-soft); display: flex; gap: 10px; align-items: flex-start;
    }
    .principle-note .ico { color: var(--green); font-size: 16px; flex-shrink: 0; }
    .principle-note b { color: var(--ink); }

    .empty { padding: 30px 22px; text-align: center; color: var(--ink-soft); font-size: 13px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 880px) {
      .app { grid-template-columns: 1fr; }
      .timer { font-size: 52px; }
      .pending-banner { grid-template-columns: 1fr; }
      .pending-actions { justify-content: stretch; }
      .banner-btn { flex: 1; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 20px, 1180px); }
      .topbar { flex-wrap: wrap; }
      .timer { font-size: 46px; }
      .focus-card { padding: 22px 20px; }
      .sched-block { grid-template-columns: 1fr; }
      .sched-pomos { justify-content: flex-start; width: auto; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="shell">
    <nav class="topbar" aria-label="主导航">
      <a class="brand" href="#" aria-label="智序番茄">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 4.5v2M8.5 3.5 10 6m5.5-2.5L14 6M6.3 8.2a7.3 7.3 0 1 0 11.4 0C16.1 6.8 14.2 6 12 6s-4.1.8-5.7 2.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 9v4l2.5 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span>智序番茄</span>
      </a>
      <div class="topbar-meta">
        <span class="date-pill" id="dateLabel"></span>
        <button class="reset-btn" id="resetBtn" type="button">重置示例数据</button>
      </div>
    </nav>
  </header>

  <main class="shell app">
    <!-- ============ LEFT: TASK EDITOR ============ -->
    <section class="panel" aria-label="任务清单">
      <div class="panel-head">
        <div>
          <div class="panel-label">任务输入</div>
          <h2>今日任务与重要程度</h2>
        </div>
      </div>

      <div class="add-bar">
        <input id="newTask" type="text" placeholder="新增任务，回车确认…" maxlength="40" />
        <button class="add-btn" id="addBtn" type="button" aria-label="新增任务">+</button>
      </div>

      <ul class="task-list" id="taskList"></ul>

      <div class="task-foot">
        共 <b id="taskCount">0</b> 个任务 · 修改重要程度会生成<b>待确认</b>建议，不会立刻改变右侧日程。
      </div>
    </section>

    <!-- ============ RIGHT: FOCUS + SCHEDULE ============ -->
    <div class="right-col">
      <!-- Focus card -->
      <section class="focus-card" aria-label="当前专注">
        <div class="focus-top">
          <span id="focusLabel">还没有正在专注的任务</span>
          <span class="mode-pill" id="modePill">待开始</span>
        </div>
        <div class="focus-task" id="focusTask"><span class="muted">选择下方日程中的"开始"，或新增任务后点击专注</span></div>

        <div class="timer-row">
          <div class="timer" id="timerDisplay" aria-live="polite">25:00</div>
          <div class="timer-controls">
            <button class="ctrl-btn primary" id="startBtn" type="button" aria-label="开始 / 暂停">
              <svg viewBox="0 0 24 24" fill="currentColor"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn" id="resetBtn2" type="button" aria-label="重置计时">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/></svg>
            </button>
            <button class="ctrl-btn" id="skipBtn" type="button" aria-label="跳过当前番茄">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5v14l8-7zM16 5h3v14h-3z"/></svg>
            </button>
          </div>
        </div>

        <div class="focus-progress"><span id="focusProgress"></span></div>
      </section>

      <!-- Pending banner / protect strip -->
      <div id="pendingWrap"></div>

      <!-- Schedule timeline -->
      <section class="panel" aria-label="今日番茄日程">
        <div class="schedule-head">
          <div>
            <div class="panel-label" id="schedLabel">原始方案</div>
            <h2 style="margin:2px 0 0;font-size:17px;letter-spacing:-.02em">今日番茄日程</h2>
          </div>
          <div class="schedule-meta">
            <strong id="totalPomos">0</strong>
            <span>个番茄 · 每个 25 分钟</span>
          </div>
        </div>
        <div class="timeline" id="timeline" aria-live="polite"></div>
      </section>

      <!-- Stats -->
      <section class="panel" aria-label="今日统计">
        <div class="panel-head"><div><div class="panel-label">专注复盘</div><h2>今日数据</h2></div></div>
        <div class="stats-grid">
          <div class="stat"><strong id="statDone">0</strong><span>已完成番茄</span></div>
          <div class="stat"><strong id="statTime">0m</strong><span>累计专注时长</span></div>
          <div class="stat"><strong id="statRate">0%</strong><span>任务完成率</span></div>
        </div>
        <div class="principle-note">
          <span class="ico">⌾</span>
          <span><b>计划保护机制：</b>智序番茄遵循"明确授权后再调整"。只要你不点击"明确重排计划"，右侧日程将始终保持原样，不会被优先级变化悄悄改写。</span>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
  (function () {
    "use strict";

    /* ============ Constants & state ============ */
    var POMO_MINUTES = 25;
    var BREAK_MINUTES = 5;
    var START_HOUR = 9, START_MIN = 0;
    var CATEGORY_COLORS = {
      "创作": "#ff7b61",
      "学习": "#8d7bf2",
      "沟通": "#67a9e7",
      "整理": "#5ebc88",
      "其他": "#f5a623"
    };
    var STORAGE_KEY = "zhixu-fanqie-state-v1";

    var state = {
      tasks: [],
      // live: the schedule the user actually sees (original until they confirm)
      liveSchedule: [],
      // suggested: computed when priorities change; pending until confirmed
      suggestedSchedule: null,
      pendingReasons: [],
      // timer
      activeTaskId: null,
      running: false,
      isBreak: false,
      secondsLeft: POMO_MINUTES * 60,
      timerId: null,
      // stats
      completedPomos: 0,        // total today
      focusSeconds: 0,         // accumulated focus seconds
    };

    /* ============ Default sample data ============ */
    function defaultTasks() {
      return [
        { id: uid(), name: "复习核心课程章节",   category: "学习", priority: 4, pomodoros: 3, color: CATEGORY_COLORS["学习"], donePomos: 0, completed: false, originalOrder: 1 },
        { id: uid(), name: "处理日常邮件",       category: "沟通", priority: 2, pomodoros: 1, color: CATEGORY_COLORS["沟通"], donePomos: 0, completed: false, originalOrder: 2 },
        { id: uid(), name: "完成竞赛报名材料",   category: "创作", priority: 5, pomodoros: 2, color: CATEGORY_COLORS["创作"], donePomos: 0, completed: false, originalOrder: 3 },
        { id: uid(), name: "整理本周资料归档",   category: "整理", priority: 1, pomodoros: 2, color: CATEGORY_COLORS["整理"], donePomos: 0, completed: false, originalOrder: 4 }
      ];
    }

    function uid() { return Math.random().toString(36).slice(2, 9); }

    /* ============ Persistence ============ */
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          tasks: state.tasks,
          activeTaskId: state.activeTaskId,
          completedPomos: state.completedPomos,
          focusSeconds: state.focusSeconds,
        }));
      } catch (e) {}
    }
    function load() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        var d = JSON.parse(raw);
        if (!d.tasks) return false;
        state.tasks = d.tasks;
        state.activeTaskId = d.activeTaskId || null;
        state.completedPomos = d.completedPomos || 0;
        state.focusSeconds = d.focusSeconds || 0;
        return true;
      } catch (e) { return false; }
    }

    /* ============ Scheduling algorithm ============ */
    // Allocate pomodoros based on priority (the "弹性时长" principle)
    function recommendedPomos(priority, original) {
      // weight: higher priority → more pomodoros, but never below 1 and not absurdly high
      var map = { 5: 3, 4: 3, 3: 2, 2: 1, 1: 1 };
      var rec = map[priority] || 1;
      // if original estimate is higher (heavy task), keep at least the original to avoid starving
      return Math.max(rec, Math.min(original, rec + 1));
    }

    // Build schedule: sort by priority desc (stable by originalOrder), allocate pomodoros
    function buildSchedule(tasks, dynamic) {
      var sorted = tasks.slice().sort(function (a, b) {
        if (dynamic) {
          if (b.priority !== a.priority) return b.priority - a.priority;
        }
        return a.originalOrder - b.originalOrder;
      });
      return sorted.map(function (t) {
        return {
          id: t.id,
          name: t.name,
          category: t.category,
          color: t.color,
          priority: t.priority,
          assigned: dynamic ? recommendedPomos(t.priority, t.pomodoros) : t.pomodoros,
          donePomos: t.donePomos || 0,
          completed: !!t.completed
        };
      });
    }

    // Compute human-readable reasons for the suggested rearrangement
    function computeReasons(before, after) {
      var reasons = [];
      var beforeMap = {}, afterMap = {};
      before.forEach(function (s, i) { beforeMap[s.id] = { pos: i + 1, assigned: s.assigned, priority: s.priority }; });
      after.forEach(function (s, i) { afterMap[s.id] = { pos: i + 1, assigned: s.assigned, priority: s.priority, name: s.name }; });

      Object.keys(afterMap).forEach(function (id) {
        var b = beforeMap[id], a = afterMap[id];
        if (!b) return;
        if (a.pos < b.pos) {
          reasons.push("「" + a.name + "」重要度为 " + a.priority + "/5，已前移至第 " + a.pos + " 位");
        } else if (a.pos > b.pos) {
          reasons.push("「" + a.name + "」相对重要度较低，已后置至第 " + a.pos + " 位");
        }
        if (a.assigned !== b.assigned) {
          reasons.push("「" + a.name + "」番茄数由 " + b.assigned + " 调整为 " + a.assigned + " 个");
        }
      });
      if (reasons.length === 0) reasons.push("当前优先级未引起顺序或时长变化。");
      return reasons;
    }

    /* ============ Rendering ============ */
    var $ = function (id) { return document.getElementById(id); };

    function render() {
      renderTaskList();
      renderSchedule();
      renderPending();
      renderFocus();
      renderStats();
      save();
    }

    function renderTaskList() {
      var ul = $("taskList");
      ul.innerHTML = "";
      if (state.tasks.length === 0) {
        ul.innerHTML = '<li class="empty">还没有任务，在上方新增一个开始吧</li>';
      } else {
        state.tasks.forEach(function (t) {
          var li = document.createElement("li");
          li.className = "task-item" + (t.id === state.activeTaskId ? " active" : "") + (t.completed ? " done" : "");
          li.dataset.id = t.id;

          var pomoHTML = "";
          for (var i = 0; i < t.pomodoros; i++) {
            pomoHTML += '<i class="' + (i < t.donePomos ? "filled" : "empty") + '"></i>';
          }

          li.innerHTML =
            '<i class="color-chip" style="background:' + t.color + '"></i>' +
            '<div class="task-main">' +
              '<div class="task-name">' + esc(t.name) + '</div>' +
              '<div class="task-meta">' +
                '<span>' + t.category + '</span>' +
                '<span class="pomo-mini">' + pomoHTML + '</span>' +
                '<span>' + t.donePomos + '/' + t.pomodoros + ' 番茄</span>' +
              '</div>' +
            '</div>' +
            '<select class="priority-select" data-id="' + t.id + '" aria-label="' + esc(t.name) + '的重要程度">' +
              opt(5, "非常重要", t.priority) +
              opt(4, "重要", t.priority) +
              opt(3, "一般", t.priority) +
              opt(2, "较低", t.priority) +
              opt(1, "最低", t.priority) +
            '</select>' +
            '<button class="del-btn" data-del="' + t.id + '" aria-label="删除任务">×</button>';
          ul.appendChild(li);
        });
      }
      $("taskCount").textContent = state.tasks.length;
    }

    function opt(val, label, cur) {
      return '<option value="' + val + '"' + (val === cur ? " selected" : "") + ">" + label + "</option>";
    }

    function renderSchedule() {
      var sched = state.liveSchedule;
      $("totalPomos").textContent = sched.reduce(function (s, t) { return s + t.assigned; }, 0);
      $("schedLabel").textContent = state.suggestedSchedule ? "原始方案（受保护）" : "今日方案";

      var tl = $("timeline");
      tl.innerHTML = "";
      if (sched.length === 0) {
        tl.innerHTML = '<div class="empty">还没有计划任务，先在左侧添加任务</div>';
        return;
      }

      var minutes = START_HOUR * 60 + START_MIN;
      sched.forEach(function (t, idx) {
        var time = fmtTime(minutes);
        var pomoHTML = "";
        for (var i = 0; i < t.assigned; i++) {
          var cls = "i";
          if (i < t.donePomos) cls += " done";
          else if (t.id === state.activeTaskId && i === t.donePomos) cls += " cur";
          pomoHTML += '<i class="' + cls + '"></i>';
        }
        var item = document.createElement("div");
        item.className = "sched-item";
        var isActive = (t.id === state.activeTaskId);
        item.innerHTML =
          '<div class="sched-time">' + time + '</div>' +
          '<div class="sched-block' + (t.completed ? " done" : "") + (isActive ? " active" : "") + '" style="--task-color:' + t.color + '">' +
            '<div>' +
              '<div class="sched-name">' + esc(t.name) + '</div>' +
              '<div class="sched-sub">' + t.category + ' · 重要度 ' + t.priority + '/5 · ' + t.donePomos + '/' + t.assigned + ' 番茄</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:4px">' +
              '<div class="sched-pomos" aria-label="' + t.assigned + '个番茄">' + pomoHTML + '</div>' +
              '<button class="sched-start-btn" data-start="' + t.id + '"' + (t.completed ? " disabled" : "") + '>' +
                (t.completed ? "已完成" : (isActive ? "专注中" : "开始")) +
              '</button>' +
            '</div>' +
          '</div>';
        tl.appendChild(item);
        minutes += t.assigned * (POMO_MINUTES + BREAK_MINUTES);
      });
    }

    function renderPending() {
      var wrap = $("pendingWrap");
      if (!state.suggestedSchedule) {
        // show protected strip when no pending suggestion
        wrap.innerHTML =
          '<div class="protect-strip" style="margin-top:0">' +
            '<span class="shield">🔒</span>' +
            '<span><b>计划保护中：</b>当前日程保持不变。修改左侧重要程度会生成"待确认"建议，不会自动改写计划。</span>' +
          '</div>';
        return;
      }
      var reasonsHTML = state.pendingReasons.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("");
      wrap.innerHTML =
        '<div class="pending-banner">' +
          '<div>' +
            '<div class="pb-title"><span class="pulse"></span>检测到优先级变化，系统已生成建议（尚未生效）</div>' +
            '<ul class="pending-reasons">' + reasonsHTML + '</ul>' +
          '</div>' +
          '<div class="pending-actions">' +
            '<button class="banner-btn primary" id="confirmBtn" type="button">明确重排计划</button>' +
            '<button class="banner-btn ghost" id="keepBtn" type="button">保持原计划</button>' +
          '</div>' +
        '</div>';
    }

    function renderFocus() {
      var active = getActiveTask();
      var lbl = $("focusLabel");
      var modePill = $("modePill");
      var ft = $("focusTask");
      var startBtn = $("startBtn");

      if (!active) {
        lbl.textContent = "还没有正在专注的任务";
        modePill.textContent = "待开始";
        modePill.className = "mode-pill";
        ft.innerHTML = '<span class="muted">选择下方日程中的"开始"，或新增任务后点击专注</span>';
      } else {
        lbl.textContent = "正在专注 · " + (active.donePomos + 1) + " / " + active.assigned + " 个番茄";
        modePill.textContent = state.isBreak ? "休息中" : (state.running ? "专注中" : "已暂停");
        modePill.className = "mode-pill" + (state.isBreak ? " break" : "");
        ft.innerHTML = esc(active.name) +
          ' <span class="muted">· ' + active.category + ' · 重要度 ' + active.priority + '/5</span>';
      }

      // play/pause icon
      var playIcon = $("playIcon");
      if (state.running) {
        playIcon.setAttribute("d", "M6 5h4v14H6zM14 5h4v14h-4z"); // pause
      } else {
        playIcon.setAttribute("d", "M8 5v14l11-7z"); // play
      }
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      var d = $("timerDisplay");
      var s = state.secondsLeft;
      var m = Math.floor(s / 60), ss = s % 60;
      d.textContent = (m < 10 ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
      d.className = "timer" + (state.isBreak ? " break" : "");
      var total = (state.isBreak ? BREAK_MINUTES : POMO_MINUTES) * 60;
      $("focusProgress").style.width = (((total - s) / total) * 100) + "%";
    }

    function renderStats() {
      $("statDone").textContent = state.completedPomos;
      var mins = Math.floor(state.focusSeconds / 60);
      $("statTime").textContent = mins >= 60 ? (Math.floor(mins / 60) + "h" + (mins % 60) + "m") : (mins + "m");
      var total = state.tasks.length;
      var done = state.tasks.filter(function (t) { return t.completed; }).length;
      $("statRate").textContent = total === 0 ? "0%" : Math.round((done / total) * 100) + "%";
    }

    /* ============ Helpers ============ */
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function fmtTime(totalMin) {
      var h = Math.floor(totalMin / 60), m = totalMin % 60;
      return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
    }
    function getActiveTask() {
      if (!state.activeTaskId) return null;
      return state.liveSchedule.find(function (t) { return t.id === state.activeTaskId; }) || null;
    }
    function getTaskById(id) {
      return state.tasks.find(function (t) { return t.id === id; }) || null;
    }
    // Returns true if advanced to a new task, false if no pending task remains, undefined if stayed.
    function advanceToNextPending() {
      var active = getActiveTask();
      if (!active || !active.completed) return undefined;
      var idx = state.liveSchedule.findIndex(function (t) { return t.id === active.id; });
      for (var i = idx + 1; i < state.liveSchedule.length; i++) {
        if (!state.liveSchedule[i].completed) {
          state.activeTaskId = state.liveSchedule[i].id;
          return true;
        }
      }
      // also check tasks before current index (loop wrap)
      for (var j = 0; j < idx; j++) {
        if (!state.liveSchedule[j].completed) {
          state.activeTaskId = state.liveSchedule[j].id;
          return true;
        }
      }
      return false;
    }
    function showToast(msg) {
      var t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._tm);
      t._tm = setTimeout(function () { t.classList.remove("show"); }, 2600);
    }

    /* ============ Timer logic ============ */
    function tick() {
      if (state.secondsLeft <= 0) {
        finishInterval();
        return;
      }
      state.secondsLeft--;
      if (!state.isBreak) state.focusSeconds++;
      updateTimerDisplay();
      // persist focus seconds occasionally
      if (state.focusSeconds % 15 === 0) save();
    }
    function startTimer() {
      if (state.timerId) return;
      state.running = true;
      state.timerId = setInterval(tick, 1000);
      renderFocus();
    }
    function pauseTimer() {
      state.running = false;
      clearInterval(state.timerId);
      state.timerId = null;
      renderFocus();
      save();
    }
    function resetTimer() {
      pauseTimer();
      state.isBreak = false;
      state.secondsLeft = POMO_MINUTES * 60;
      updateTimerDisplay();
      renderFocus();
    }
    function finishInterval() {
      clearInterval(state.timerId);
      state.timerId = null;
      state.running = false;

      if (state.isBreak) {
        // break ended → start next pomodoro
        state.isBreak = false;
        state.secondsLeft = POMO_MINUTES * 60;
        // if the current task is already completed, advance to the next pending one
        var advanced = advanceToNextPending();
        if (advanced === false) {
          // no pending tasks left → stop and rest
          state.activeTaskId = null;
          render();
          showToast("今日计划全部完成，辛苦了 🎉");
          return;
        }
        showToast(advanced ? "休息结束，进入下一个任务" : "休息结束，开始下一个番茄吧");
      } else {
        // pomodoro finished
        state.completedPomos++;
        var active = getActiveTask();
        if (active) {
          active.donePomos++;
          // sync to source task
          var src = getTaskById(active.id);
          if (src) {
            src.donePomos = active.donePomos;
            if (src.donePomos >= active.assigned && !src.completed) {
              src.completed = true;
              active.completed = true;
              showToast("🎉「" + active.name + "」已全部完成！");
            } else {
              showToast("🍅 一个番茄完成！休息 5 分钟");
            }
          }
        } else {
          showToast("🍅 一个番茄完成！");
        }
        // enter break
        state.isBreak = true;
        state.secondsLeft = BREAK_MINUTES * 60;
      }
      render();
      // auto-start next phase for smooth experience
      startTimer();
    }

    function setActiveTask(id) {
      pauseTimer();
      state.activeTaskId = id;
      state.isBreak = false;
      state.secondsLeft = POMO_MINUTES * 60;
      var t = getTaskById(id);
      if (t && t.donePomos >= (getActiveTask() ? getActiveTask().assigned : 0)) {
        // already completed all pomos
      }
      render();
    }

    /* ============ Priority change → suggestion (the authorization principle) ============ */
    function onPriorityChange(taskId, newPriority) {
      var t = getTaskById(taskId);
      if (!t) return;
      var oldPriority = t.priority;
      if (oldPriority === newPriority) return;
      t.priority = newPriority;

      // compute suggested schedule
      var before = state.liveSchedule.slice();
      var after = buildSchedule(state.tasks, true);
      state.suggestedSchedule = after;
      state.pendingReasons = computeReasons(before, after);

      render();
      showToast("已生成待确认建议，请在上方确认是否重排");
    }

    function confirmRearrange() {
      if (!state.suggestedSchedule) return;
      // sync donePomos & completed from live into suggested (preserve progress)
      state.suggestedSchedule.forEach(function (s) {
        var live = state.liveSchedule.find(function (x) { return x.id === s.id; });
        if (live) { s.donePomos = live.donePomos; s.completed = live.completed; }
      });
      state.liveSchedule = state.suggestedSchedule;
      state.suggestedSchedule = null;
      state.pendingReasons = [];
      // if active task, keep timer running but refresh its reference
      render();
      showToast("✅ 已收到明确指令：日程顺序与番茄时长已重新规划");
    }
    function keepOriginal() {
      state.suggestedSchedule = null;
      state.pendingReasons = [];
      render();
      showToast("已保持原有计划，优先级变化未写入日程");
    }

    /* ============ Task CRUD ============ */
    function addTask(name) {
      name = (name || "").trim();
      if (!name) return;
      var order = state.tasks.reduce(function (m, t) { return Math.max(m, t.originalOrder); }, 0) + 1;
      // guess category
      var cat = "其他";
      var t = {
        id: uid(), name: name, category: cat, priority: 3, pomodoros: 2,
        color: CATEGORY_COLORS[cat], donePomos: 0, completed: false, originalOrder: order
      };
      state.tasks.push(t);
      // rebuild live schedule preserving positions of existing tasks (append new)
      state.liveSchedule = buildSchedule(state.tasks, false);
      // if there's a pending suggestion, regenerate it too
      if (state.suggestedSchedule) {
        state.suggestedSchedule = buildSchedule(state.tasks, true);
        state.pendingReasons = computeReasons(state.liveSchedule, state.suggestedSchedule);
      }
      render();
      showToast("已新增任务：「" + name + "」");
    }
    function deleteTask(id) {
      state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
      state.liveSchedule = state.liveSchedule.filter(function (t) { return t.id !== id; });
      if (state.activeTaskId === id) {
        pauseTimer();
        state.activeTaskId = null;
        resetTimer();
      }
      if (state.suggestedSchedule) {
        state.suggestedSchedule = state.suggestedSchedule.filter(function (t) { return t.id !== id; });
        if (state.tasks.length === 0) { state.suggestedSchedule = null; state.pendingReasons = []; }
      }
      render();
      showToast("已删除任务");
    }

    /* ============ Event wiring ============ */
    function init() {
      // load or seed
      if (!load()) {
        state.tasks = defaultTasks();
      }
      // always rebuild live schedule from tasks (keeps donePomos)
      state.liveSchedule = buildSchedule(state.tasks, false);
      state.suggestedSchedule = null;
      state.pendingReasons = [];
      state.secondsLeft = POMO_MINUTES * 60;

      // date label
      var now = new Date();
      var wd = ["日","一","二","三","四","五","六"][now.getDay()];
      $("dateLabel").textContent = now.getFullYear() + " / " + pad(now.getMonth() + 1) + " / " + pad(now.getDate()) + " · 星期" + wd;

      render();

      // add task
      $("addBtn").addEventListener("click", function () {
        var inp = $("newTask");
        addTask(inp.value);
        inp.value = "";
        inp.focus();
      });
      $("newTask").addEventListener("keydown", function (e) {
        if (e.key === "Enter") { addTask(this.value); this.value = ""; }
      });

      // task list delegation (priority change + delete)
      $("taskList").addEventListener("change", function (e) {
        var sel = e.target;
        if (sel.classList.contains("priority-select")) {
          onPriorityChange(sel.dataset.id, parseInt(sel.value, 10));
        }
      });
      $("taskList").addEventListener("click", function (e) {
        var del = e.target.closest("[data-del]");
        if (del) deleteTask(del.dataset.del);
      });

      // schedule delegation (start buttons)
      $("timeline").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-start]");
        if (!btn || btn.disabled) return;
        setActiveTask(btn.dataset.start);
        startTimer();
        showToast("开始专注：「" + (getActiveTask() ? getActiveTask().name : "") + "」");
        // scroll focus card into view on mobile
        document.querySelector(".focus-card").scrollIntoView({ behavior: "smooth", block: "center" });
      });

      // pending banner buttons (delegation)
      $("pendingWrap").addEventListener("click", function (e) {
        if (e.target.id === "confirmBtn") confirmRearrange();
        if (e.target.id === "keepBtn") keepOriginal();
      });

      // timer controls
      $("startBtn").addEventListener("click", function () {
        if (!state.activeTaskId && state.liveSchedule.length > 0) {
          // auto-pick first non-completed task
          var next = state.liveSchedule.find(function (t) { return !t.completed; });
          if (next) { state.activeTaskId = next.id; render(); }
        }
        if (!state.activeTaskId) { showToast("请先添加任务或选择一个任务开始"); return; }
        if (state.running) pauseTimer();
        else startTimer();
      });
      $("resetBtn2").addEventListener("click", resetTimer);
      $("skipBtn").addEventListener("click", function () {
        if (state.activeTaskId) {
          showToast("已跳过当前番茄");
          finishInterval();
        }
      });

      // reset demo data
      $("resetBtn").addEventListener("click", function () {
        if (!confirm("重置为示例数据？当前任务与统计将被清空。")) return;
        pauseTimer();
        localStorage.removeItem(STORAGE_KEY);
        state.tasks = defaultTasks();
        state.liveSchedule = buildSchedule(state.tasks, false);
        state.suggestedSchedule = null;
        state.pendingReasons = [];
        state.activeTaskId = null;
        state.completedPomos = 0;
        state.focusSeconds = 0;
        state.isBreak = false;
        state.secondsLeft = POMO_MINUTES * 60;
        render();
        showToast("已恢复示例数据");
      });

      // persist on unload
      window.addEventListener("beforeunload", save);
      // keep timer accurate even if tab was backgrounded
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && state.running) { /* setInterval keeps running; no-op */ }
      });
    }

    function pad(n) { return n < 10 ? "0" + n : "" + n; }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
