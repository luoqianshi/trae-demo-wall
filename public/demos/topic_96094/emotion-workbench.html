<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪文案馆 · 完整版 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f0;--bg2:#f3ebdc;--bg3:#ede3cf;
  --ink:#2c241e;--ink-soft:#5a4f44;--muted:#9a8d7c;
  --rule:#e2d6bf;--accent:#7e66cf;--accent-soft:#ede7fb;
  --m-low:#6b8cae;--m-anx:#e8927c;--m-lost:#9b8ec4;--m-calm:#7aab8e;--m-joy:#e8b86d;--m-enc:#d96b8e;
  --m-low-bg:#eaf0f6;--m-anx-bg:#fcebe5;--m-lost-bg:#f0ecf8;--m-calm-bg:#ecf3ee;--m-joy-bg:#fbf3e4;--m-enc-bg:#fceaf0;
  --shadow:0 2px 16px rgba(44,36,30,.07);
  --shadow-lg:0 8px 32px rgba(44,36,30,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;
  font-size:15px;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 20% 80%,rgba(126,102,207,.04) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(232,184,109,.05) 0%,transparent 50%);
  min-height:100vh;
}

/* ===== Header ===== */
.header{background:rgba(243,235,220,.92);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
.header-inner{max-width:1000px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(126,102,207,.3);}
.brand-text h1{font-family:'Noto Serif SC',serif;font-size:1.35rem;font-weight:700;color:var(--ink);line-height:1.2;}
.brand-text p{font-size:.74rem;color:var(--muted);letter-spacing:.02em;}
.stats{display:flex;gap:16px;align-items:center;}
.stat{text-align:center;cursor:default;}
.stat.clickable{cursor:pointer;}
.stat .num{font-family:'Noto Serif SC',serif;font-size:1.4rem;font-weight:700;color:var(--accent);line-height:1;}
.stat .lbl{font-size:.66rem;color:var(--muted);margin-top:3px;letter-spacing:.04em;}

/* ===== Mood Hero ===== */
.mood-hero{max-width:1000px;margin:0 auto;padding:24px 24px 8px;text-align:center;}
.mood-hero .prompt{font-family:'Noto Serif SC',serif;font-size:1.15rem;font-weight:600;color:var(--ink);margin-bottom:4px;}
.mood-hero .sub{font-size:.82rem;color:var(--muted);margin-bottom:18px;}
.mood-pick-large{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.mpl{width:76px;height:76px;border-radius:18px;border:2px solid var(--rule);background:var(--bg);cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:500;color:var(--ink-soft);}
.mpl:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.mpl.sel{color:#fff;border-color:transparent;transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.mpl .em{font-size:1.7rem;transition:transform .3s;}
.mpl:hover .em{transform:scale(1.15);}

/* "此刻为你"推荐 */
.mood-rec{max-width:1000px;margin:0 auto;padding:8px 24px 0;text-align:center;min-height:60px;}
.mood-rec-inner{display:none;animation:fadeUp .5s ease;padding:16px 24px;background:var(--bg2);border-radius:14px;margin-top:8px;}
.mood-rec-inner.show{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.mood-rec .rec-label{font-size:.76rem;color:var(--muted);margin-bottom:4px;}
.mood-rec .rec-text{font-family:'Noto Serif SC',serif;font-size:1.1rem;color:var(--ink);font-style:italic;}
.mood-rec .rec-source{font-size:.76rem;color:var(--muted);margin-top:4px;}

/* ===== Section Nav ===== */
.section-nav{display:flex;gap:8px;max-width:1000px;margin:0 auto;padding:20px 24px 0;}
.section-nav a{padding:7px 16px;border-radius:999px;background:var(--bg2);font-size:.8rem;font-weight:500;color:var(--ink-soft);text-decoration:none;transition:all .2s;display:flex;align-items:center;gap:5px;}
.section-nav a:hover{background:var(--accent-soft);color:var(--accent);transform:translateY(-1px);}

/* ===== Main ===== */
.main{max-width:1000px;margin:0 auto;padding:20px 24px 100px;}

/* ===== Section Block ===== */
.section-block{margin-bottom:48px;animation:fadeUp .4s ease;}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.section-head .sec-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.section-head h2{font-family:'Noto Serif SC',serif;font-size:1.25rem;font-weight:700;color:var(--ink);}
.section-head .sub{font-size:.78rem;color:var(--muted);margin-left:4px;}
.section-head .count{font-size:.78rem;font-weight:400;color:var(--muted);}

/* ===== Filter Bar ===== */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.mood-chip{padding:7px 15px;border-radius:999px;border:1.5px solid var(--rule);background:var(--bg);font-family:inherit;font-size:.82rem;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.mood-chip:hover{border-color:var(--accent);transform:translateY(-1px);}
.mood-chip.active{color:#fff;border-color:transparent;}
.mood-chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.mood-chip .cnt{font-size:.7rem;opacity:.7;font-weight:600;}
.mc-all.active{background:var(--accent);}
.mc-low.active{background:var(--m-low);}
.mc-anx.active{background:var(--m-anx);}
.mc-lost.active{background:var(--m-lost);}
.mc-calm.active{background:var(--m-calm);}
.mc-joy.active{background:var(--m-joy);}
.mc-enc.active{background:var(--m-enc);}
.search-box{flex:1;min-width:140px;max-width:220px;margin-left:auto;}
.search-box input{width:100%;padding:7px 14px;border:1.5px solid var(--rule);border-radius:999px;font-family:inherit;font-size:.82rem;background:var(--bg);color:var(--ink);}
.search-box input:focus{outline:none;border-color:var(--accent);}

/* ===== Cards Grid ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.card{background:var(--bg2);border-radius:14px;padding:20px 22px;position:relative;transition:all .25s;border:1px solid transparent;}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.card .mood-tag,.card .scene-tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:10px;}
.card .quote-text{font-family:'Noto Serif SC',serif;font-size:1rem;line-height:1.75;color:var(--ink);margin-bottom:10px;}
.card .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card .source{font-size:.77rem;color:var(--muted);font-style:italic;}
.card .date{font-size:.72rem;color:var(--muted);}
.card .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:4px 6px;border-radius:6px;transition:all .2s;opacity:0;}
.card:hover .del{opacity:.6;}
.card .del:hover{opacity:1;color:#d9534f;background:rgba(217,83,79,.08);}
.lit-btn{background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-family:inherit;font-size:.74rem;color:var(--muted);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px;}
.lit-btn:hover{border-color:#e08f5e;color:#e08f5e;}
.lit-btn.lit{background:rgba(224,143,94,.12);border-color:#e08f5e;color:#e08f5e;}

/* ===== Diary ===== */
.diary-today{background:var(--bg2);border-radius:16px;padding:22px;margin-bottom:16px;text-align:center;}
.diary-today h3{font-family:'Noto Serif SC',serif;font-size:1.1rem;margin-bottom:4px;}
.diary-today .date-str{font-size:.8rem;color:var(--muted);margin-bottom:16px;}
.diary-mood-pick{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.dmp{width:54px;height:54px;border-radius:14px;border:2px solid var(--rule);background:var(--bg);cursor:pointer;transition:all .25s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;font-weight:500;color:var(--ink-soft);}
.dmp:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.dmp.sel{border-color:transparent;color:#fff;}
.dmp .em{font-size:1.3rem;}
.diary-input{max-width:440px;margin:0 auto;}
.diary-input textarea{width:100%;min-height:52px;padding:12px;border:1.5px solid var(--rule);border-radius:12px;font-family:inherit;font-size:.86rem;resize:vertical;background:var(--bg);color:var(--ink);text-align:center;}
.diary-input textarea:focus{outline:none;border-color:var(--accent);}
.diary-input .save-diary{margin-top:10px;width:100%;padding:11px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;transition:all .2s;}
.diary-input .save-diary:hover{background:#6d54c4;}
.diary-input .save-diary:disabled{background:var(--bg3);color:var(--muted);cursor:default;}
.diary-list{margin-top:8px;}
.diary-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);}
.diary-item:last-child{border-bottom:none;}
.diary-item .d-mood{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;}
.diary-item .d-content{flex:1;}
.diary-item .d-date{font-size:.74rem;color:var(--muted);margin-bottom:2px;}
.diary-item .d-note{font-size:.88rem;color:var(--ink);line-height:1.6;}

/* ===== Empty ===== */
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty .em-ic{font-size:2.2rem;margin-bottom:10px;opacity:.4;}
.empty p{font-size:.85rem;}

/* ===== Add Buttons ===== */
.add-bar{position:fixed;bottom:22px;right:22px;z-index:50;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.add-btn{width:48px;height:48px;border-radius:50%;color:#fff;border:none;font-size:1.3rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:all .25s;display:flex;align-items:center;justify-content:center;position:relative;}
.add-btn:hover{transform:scale(1.08);}
.add-btn.quote{background:var(--accent);}
.add-btn.exp{background:#e08f5e;}
.add-btn .lbl{position:absolute;right:58px;background:var(--ink);color:#fff;font-size:.7rem;padding:3px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;}
.add-btn:hover .lbl{opacity:1;}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(44,36,30,.4);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;animation:fadeIn .25s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--bg);border-radius:20px;padding:28px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);animation:popIn .3s;max-height:90vh;overflow-y:auto;}
@keyframes popIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
.modal h3{font-family:'Noto Serif SC',serif;font-size:1.15rem;margin-bottom:16px;color:var(--ink);}
.modal label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;margin-top:12px;}
.modal label:first-of-type{margin-top:0;}
.modal textarea{width:100%;min-height:80px;padding:12px;border:1.5px solid var(--rule);border-radius:12px;font-family:inherit;font-size:.88rem;resize:vertical;background:var(--bg2);color:var(--ink);transition:border-color .2s;}
.modal textarea:focus{outline:none;border-color:var(--accent);}
.modal input{width:100%;padding:10px 12px;border:1.5px solid var(--rule);border-radius:12px;font-family:inherit;font-size:.86rem;background:var(--bg2);color:var(--ink);}
.modal input:focus{outline:none;border-color:var(--accent);}
.opt-pick{display:flex;gap:7px;flex-wrap:wrap;}
.opt-item{padding:7px 14px;border-radius:999px;border:2px solid var(--rule);background:var(--bg2);font-family:inherit;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;}
.opt-item:hover{transform:translateY(-1px);}
.opt-item.sel{border-color:transparent;color:#fff;font-weight:600;}
.modal-btns{display:flex;gap:10px;margin-top:20px;}
.btn{flex:1;padding:11px;border-radius:12px;border:none;font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#6d54c4;transform:translateY(-1px);}
.btn-ghost{background:var(--bg2);color:var(--muted);}
.btn-ghost:hover{background:var(--bg3);color:var(--ink);}

/* ===== Toast ===== */
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:12px;font-size:.86rem;z-index:300;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow-lg);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== Blind Box Button ===== */
.blind-box-btn{margin-top:16px;padding:10px 24px;border-radius:999px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:8px;}
.blind-box-btn:hover{background:var(--accent);color:#fff;transform:translateY(-2px);box-shadow:0 6px 20px rgba(126,102,207,.3);}

/* ===== Blind Box Modal ===== */
.bb-overlay{position:fixed;inset:0;background:rgba(44,36,30,.6);backdrop-filter:blur(8px);z-index:250;display:none;align-items:center;justify-content:center;padding:20px;}
.bb-overlay.show{display:flex;animation:fadeIn .25s;}
.bb-card{background:var(--bg);border-radius:24px;padding:40px 32px;max-width:460px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:popIn .4s;position:relative;overflow:hidden;}
.bb-card .bb-close{position:absolute;top:14px;right:14px;background:none;border:none;font-size:1.2rem;color:var(--muted);cursor:pointer;transition:color .2s;}
.bb-card .bb-close:hover{color:var(--ink);}
.bb-card .bb-icon{font-size:2.5rem;margin-bottom:12px;}
.bb-card .bb-tag{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:4px 12px;border-radius:999px;margin-bottom:20px;color:#fff;}
.bb-card .bb-text{font-family:'Noto Serif SC',serif;font-size:1.15rem;line-height:1.8;color:var(--ink);margin-bottom:16px;min-height:60px;}
.bb-card .bb-source{font-size:.82rem;color:var(--muted);font-style:italic;margin-bottom:24px;}
.bb-actions{display:flex;gap:10px;justify-content:center;}

/* ===== Card Actions ===== */
.card-acts{display:flex;align-items:center;gap:5px;}
.act-btn{background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-family:inherit;font-size:.72rem;color:var(--muted);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px;}
.act-btn:hover{border-color:var(--accent);color:var(--accent);}
.act-btn.lit{background:rgba(126,102,207,.12);border-color:var(--accent);color:var(--accent);}

/* ===== Calendar Heatmap ===== */
.diary-layout{display:flex;gap:16px;align-items:flex-start;}
.diary-left{flex:1;min-width:0;}
.diary-right{width:260px;flex-shrink:0;}
.cal-heatmap{background:var(--bg2);border-radius:16px;padding:14px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-header h4{font-family:'Noto Serif SC',serif;font-size:.88rem;color:var(--ink);}
.cal-nav{display:flex;gap:6px;align-items:center;}
.cal-nav button{width:24px;height:24px;border-radius:6px;border:1px solid var(--rule);background:var(--bg);cursor:pointer;font-size:.75rem;color:var(--ink-soft);transition:all .2s;display:flex;align-items:center;justify-content:center;}
.cal-nav button:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.cal-nav .cal-month-label{font-size:.76rem;font-weight:600;color:var(--ink);min-width:68px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;grid-auto-rows:32px;}
.cal-weekday{font-size:.62rem;color:var(--muted);text-align:center;padding-bottom:3px;}
.cal-cell{border-radius:6px;background:var(--bg);border:1px solid var(--rule);font-size:.58rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--muted);transition:all .2s;cursor:default;position:relative;overflow:hidden;height:32px;}
.cal-cell.has-entry{color:#fff;font-weight:600;border-color:transparent;cursor:pointer;}
.cal-cell.has-entry .cal-emoji{font-size:.75rem;line-height:1;}
.cal-cell.has-entry .cal-day-num{font-size:.45rem;opacity:.85;line-height:1;margin-top:0;}
.cal-cell.has-entry:hover{transform:scale(1.18);box-shadow:var(--shadow);z-index:1;}
.cal-cell.today{outline:2px solid var(--accent);outline-offset:1px;}
.cal-cell.empty{border:none;background:transparent;}
.cal-cell.clickable{cursor:pointer;}
.cal-cell.clickable:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.cal-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:.64rem;color:var(--muted);flex-wrap:wrap;}
.cal-legend .leg-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0;}

/* ===== Mood Distribution ===== */
.mood-dist-box{background:var(--bg2);border-radius:16px;padding:20px;margin-top:16px;}
.mood-dist-box h4{font-family:'Noto Serif SC',serif;font-size:.95rem;color:var(--ink);margin-bottom:14px;}
.dist-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.dist-chart{width:120px;height:120px;border-radius:50%;flex-shrink:0;position:relative;}
.dist-chart::after{content:'';position:absolute;inset:22px;background:var(--bg2);border-radius:50%;}
.dist-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-size:.82rem;font-weight:700;color:var(--ink);z-index:1;flex-direction:column;line-height:1.3;}
.dist-center .dc-num{font-size:1.3rem;}
.dist-center .dc-lbl{font-size:.62rem;color:var(--muted);font-weight:400;}
.dist-legend{flex:1;min-width:140px;}
.dist-item{display:flex;align-items:center;gap:8px;font-size:.76rem;margin-bottom:6px;color:var(--ink-soft);}
.dist-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.dist-pct{margin-left:auto;font-weight:600;color:var(--ink);}

/* ===== Share Card Modal ===== */
.share-overlay{position:fixed;inset:0;background:rgba(44,36,30,.6);backdrop-filter:blur(8px);z-index:250;display:none;align-items:center;justify-content:center;padding:20px;}
.share-overlay.show{display:flex;animation:fadeIn .25s;}
.share-wrap{background:var(--bg);border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:popIn .3s;}
.share-wrap h3{font-family:'Noto Serif SC',serif;font-size:1.05rem;margin-bottom:14px;}
#share-canvas{width:100%;max-width:372px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;}
.share-actions{display:flex;gap:10px;justify-content:center;}

/* ===== Blind Box Float Button ===== */
.add-btn.blind{background:linear-gradient(135deg,var(--m-joy),var(--m-enc));}

/* ===== Diary Day Editor ===== */
.diary-editor{background:var(--bg);border-radius:16px;padding:20px;border:2px solid var(--accent-soft);animation:fadeUp .3s ease;}
.de-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.de-header .de-date{font-family:'Noto Serif SC',serif;font-size:1rem;font-weight:700;color:var(--ink);}
.de-header .de-hint{font-size:.72rem;color:var(--muted);}
.de-mood-pick{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.de-mp{width:52px;height:52px;border-radius:14px;border:2px solid var(--rule);background:var(--bg2);cursor:pointer;transition:all .25s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.66rem;font-weight:500;color:var(--ink-soft);}
.de-mp:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.de-mp.sel{border-color:transparent;color:#fff;}
.de-mp .em{font-size:1.3rem;}
.de-textarea{width:100%;min-height:100px;padding:12px;border:1.5px solid var(--rule);border-radius:12px;font-family:inherit;font-size:.86rem;resize:vertical;background:var(--bg2);color:var(--ink);line-height:1.6;}
.de-textarea:focus{outline:none;border-color:var(--accent);}
.de-actions{display:flex;gap:10px;margin-top:12px;align-items:center;}
.de-save{flex:1;padding:11px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;transition:all .2s;}
.de-save:hover{background:#6d54c4;transform:translateY(-1px);}
.de-save:disabled{background:var(--bg3);color:var(--muted);cursor:default;transform:none;}
.de-del{padding:11px 16px;border-radius:12px;border:1px solid #e8a;background:rgba(217,83,79,.06);color:#d9534f;font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .2s;display:none;}
.de-del.show{display:block;}
.de-del:hover{background:rgba(217,83,79,.12);}

/* responsive */
@media(max-width:480px){
  .header-inner{padding:10px 14px;}
  .stats{gap:10px;}.stat .num{font-size:1.1rem;}
  .mood-hero{padding:18px 14px 6px;}
  .mpl{width:62px;height:62px;font-size:.66rem;}.mpl .em{font-size:1.4rem;}
  .section-nav{padding:14px 14px 0;overflow-x:auto;flex-wrap:nowrap;}
  .main{padding:14px 14px 80px;}
  .grid{grid-template-columns:1fr;}
  .modal{padding:20px;margin:8px;}
  .add-bar{bottom:16px;right:16px;}.add-btn{width:44px;height:44px;font-size:1.15rem;}
  .search-box{max-width:100%;margin-left:0;flex-basis:100%;}
  .dist-wrap{flex-direction:column;gap:16px;}

  .diary-layout{flex-direction:column;}
  .diary-right{width:100%;}
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">📖</div>
      <div class="brand-text">
        <h1>情绪文案馆</h1>
        <p>每一句对的话，都在对的心情等你</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="stat-quotes">0</div><div class="lbl">文案</div></div>
      <div class="stat"><div class="num" id="stat-exp">0</div><div class="lbl">点亮</div></div>

      <div class="stat clickable" id="btn-import" title="导入数据恢复"><div class="num" style="font-size:1rem;">⬆</div><div class="lbl">导入</div></div>
    </div>
  </div>
</header>

<!-- ===== Mood Hero ===== -->
<div class="mood-hero">

  <div class="sub">选一个心情，让对的话来找你</div>
  <div class="mood-pick-large" id="mood-hero-pick">
    <div class="mpl" data-mood="低落"><span class="em">🌧️</span>低落</div>
    <div class="mpl" data-mood="焦虑"><span class="em">🌀</span>焦虑</div>
    <div class="mpl" data-mood="迷茫"><span class="em">🌫️</span>迷茫</div>
    <div class="mpl" data-mood="平静"><span class="em">🌿</span>平静</div>
    <div class="mpl" data-mood="喜悦"><span class="em">☀️</span>喜悦</div>
    <div class="mpl" data-mood="鼓励"><span class="em">💪</span>鼓励</div>
  </div>
  <button class="blind-box-btn" id="blind-box-btn">🎁 随机抽一句盲盒</button>
</div>

<!-- ===== Mood Recommendation ===== -->

    <div class="rec-text" id="rec-text"></div>
    <div class="rec-source" id="rec-source"></div>
  </div>
</div>

<!-- ===== Section Nav ===== -->
<nav class="section-nav">
  <a href="#sec-quotes">📚 我的文案馆</a>
  <a href="#sec-exp">🧓 经验墙</a>

<!-- ===== Main ===== -->
<main class="main">

  <!-- Section 1: Quotes -->
  <div class="section-block" id="sec-quotes">
    <div class="section-head">
      <div class="sec-ic">📚</div>
      <h2>我的文案馆</h2>
      <span class="sub">文字比语言更有震撼力</span>
      <span class="count" id="quotes-total"></span>
    </div>
    <div class="filter-bar" id="mood-filter">
      <button class="mood-chip mc-all active" data-mood="all">全部 <span class="cnt" id="cnt-all">0</span></button>
      <button class="mood-chip mc-low" data-mood="低落"><span class="dot" style="background:var(--m-low)"></span>低落 <span class="cnt" id="cnt-低落">0</span></button>
      <button class="mood-chip mc-anx" data-mood="焦虑"><span class="dot" style="background:var(--m-anx)"></span>焦虑 <span class="cnt" id="cnt-焦虑">0</span></button>
      <button class="mood-chip mc-lost" data-mood="迷茫"><span class="dot" style="background:var(--m-lost)"></span>迷茫 <span class="cnt" id="cnt-迷茫">0</span></button>
      <button class="mood-chip mc-calm" data-mood="平静"><span class="dot" style="background:var(--m-calm)"></span>平静 <span class="cnt" id="cnt-平静">0</span></button>
      <button class="mood-chip mc-joy" data-mood="喜悦"><span class="dot" style="background:var(--m-joy)"></span>喜悦 <span class="cnt" id="cnt-喜悦">0</span></button>
      <button class="mood-chip mc-enc" data-mood="鼓励"><span class="dot" style="background:var(--m-enc)"></span>鼓励 <span class="cnt" id="cnt-鼓励">0</span></button>
      <div class="search-box"><input type="text" id="search-quotes" placeholder="🔍 搜索文案..."></div>
    </div>
    <div class="grid" id="quotes-grid"></div>
  </div>

  <!-- Section 2: Experiences -->
  <div class="section-block" id="sec-exp">
    <div class="section-head">
      <div class="sec-ic">🧓</div>
      <h2>经验墙</h2>
      <span class="sub">世界上真的有和你一样经历的人</span>
      <span class="count" id="exp-total"></span>
    </div>
    <div class="filter-bar" id="scene-filter">
      <button class="mood-chip active" data-scene="all">全部</button>
      <button class="mood-chip" data-scene="求职">求职</button>
      <button class="mood-chip" data-scene="感情">感情</button>
      <button class="mood-chip" data-scene="成长">成长</button>
      <button class="mood-chip" data-scene="人际">人际</button>
      <button class="mood-chip" data-scene="其他">其他</button>
      <div class="search-box"><input type="text" id="search-exp" placeholder="🔍 搜索经验..."></div>
    </div>
    <div class="grid" id="exp-grid"></div>
  </div>

  <!-- Section 3: Diary -->
  <div class="section-block" id="sec-diary">
    <div class="section-head">
      <div class="sec-ic">📝</div>
      <h2>情绪日记</h2>
      <span class="sub">记录今天的心情，看见自己的轨迹</span>
    </div>
    <div class="diary-layout">
      <div class="diary-left">
        <div class="diary-editor" id="diary-editor">
          <div class="de-header">
            <span class="de-date" id="de-date-label">选择日历上的日期开始记录</span>
            <span class="de-hint" id="de-hint">💡 点击右侧日历</span>
          </div>
          <div class="de-mood-pick" id="de-mood-pick"></div>
          <textarea class="de-textarea" id="de-note" placeholder="今天发生了什么？写下来，留给未来的自己…" maxlength="300"></textarea>
          <div class="de-actions">
            <button class="de-save" id="de-save" disabled>保存日记</button>
            <button class="de-del" id="de-del">删除</button>
          </div>
        </div>
      </div>
      <div class="diary-right">
        <div class="cal-heatmap">
          <div class="cal-header">
            <h4>📝 情绪日记</h4>
            <div class="cal-nav">
              <button id="cal-prev">‹</button>
              <span class="cal-month-label" id="cal-month-label"></span>

            </div>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="cal-legend" id="cal-legend"></div>
        </div>
      </div>
    </div>
    <div class="mood-dist-box" id="mood-dist-box"></div>
    <div class="diary-list" id="diary-list"></div>
  </div>

</main>

<!-- ===== Add Buttons ===== -->

<div id="toast"></div>

</div>

<script>
/* ===== Config ===== */
const MOODS = {
  '低落':{color:'var(--m-low)',bg:'var(--m-low-bg)',emoji:'🌧️',rec:'天总会亮的，允许自己在黑暗里待一会儿。'},
  '焦虑':{color:'var(--m-anx)',bg:'var(--m-anx-bg)',emoji:'🌀',rec:'你担心的90%的事情不会发生，深呼吸。'},
  '迷茫':{color:'var(--m-lost)',bg:'var(--m-lost-bg)',emoji:'🌫️',rec:'不知道往哪走时，先走好脚下的这一步。'},
  '平静':{color:'var(--m-calm)',bg:'var(--m-calm-bg)',emoji:'🌿',rec:'此刻的风很好，这样就够了。'},
  '喜悦':{color:'var(--m-joy)',bg:'var(--m-joy-bg)',emoji:'☀️',rec:'快乐不需要理由，你在呼吸就值得开心。'},
  '鼓励':{color:'var(--m-enc)',bg:'var(--m-enc-bg)',emoji:'💪',rec:'你已经走了这么远，别在离终点最近的地方放弃。'},
};
const SCENES = {
  '求职':{color:'#5b8def',bg:'#eaf1fd'},
  '感情':{color:'#e87b9a',bg:'#fceaf0'},
  '成长':{color:'#7aab8e',bg:'#ecf3ee'},
  '人际':{color:'#c49b5e',bg:'#f8f0e4'},
  '其他':{color:'#9b8ec4',bg:'#f0ecf8'},
};

/* ===== Preset Data ===== */
const PRESET_QUOTES = [
  {id:'pq1',content:'你不是在黑暗里行走，你只是在经历一个很长的夜晚。天总会亮的。',mood:'低落',source:'佚名',lit:28,createdAt:'2026-07-01'},
  {id:'pq2',content:'允许自己偶尔崩溃，但别忘了崩溃完继续走。',mood:'低落',source:'网友分享',lit:35,createdAt:'2026-07-02'},
  {id:'pq3',content:'焦虑的本质是对未来的失控感，而你能掌控的只有此刻的呼吸。',mood:'焦虑',source:'心理学笔记',lit:22,createdAt:'2026-07-03'},
  {id:'pq4',content:'你担心的90%的事情永远不会发生，剩下10%你也能应付。',mood:'焦虑',source:'马克·吐温',lit:41,createdAt:'2026-07-03'},
  {id:'pq5',content:'不知道往哪走的时候，就先走好脚下的这一步。路是走出来的，不是想出来的。',mood:'迷茫',source:'网友分享',lit:33,createdAt:'2026-07-04'},
  {id:'pq6',content:'迷茫说明你在思考，停滞不前才该害怕。能感到困惑，本身就是在前进。',mood:'迷茫',source:'佚名',lit:26,createdAt:'2026-07-04'},
  {id:'pq7',content:'今天的风很好，阳光刚好落在窗台上。什么都不用做，这样就够了。',mood:'平静',source:'日常记录',lit:19,createdAt:'2026-07-05'},
  {id:'pq8',content:'平静不是没有波澜，而是学会在波澜中稳住自己的船。',mood:'平静',source:'佚名',lit:24,createdAt:'2026-07-05'},
  {id:'pq9',content:'快乐不需要理由。此刻微风正好，你在呼吸，这就值得开心。',mood:'喜悦',source:'佚名',lit:37,createdAt:'2026-07-06'},
  {id:'pq10',content:'你已经走了这么远，比昨天的自己又强了一点。为自己鼓掌。',mood:'鼓励',source:'日常记录',lit:45,createdAt:'2026-07-06'},
];
const PRESET_EXP = [
  {id:'pe1',content:'找工作被拒30次后我才明白：面试不是在否定你这个人，只是在找更匹配的岗位。别把拒绝当成人身评价，调整方向继续投。',scene:'求职',author:'工作8年的产品经理',lit:42,createdAt:'2026-07-01'},
  {id:'pe2',content:'第一份工作别太纠结薪资，选能学到东西的团队。前三年是能力储蓄期，30岁以后拼的是复利。',scene:'求职',author:'互联网从业者',lit:38,createdAt:'2026-07-02'},
  {id:'pe3',content:'分手时觉得天塌了，三年后回头看，那不过是一个转弯。别在情绪最烈的时候做决定，给自己90天。',scene:'感情',author:'过来人',lit:56,createdAt:'2026-07-02'},
  {id:'pe4',content:'好的关系不是不吵架，而是吵完还愿意坐下来谈。沉默比争吵更伤人。',scene:'感情',author:'结婚10年的姐姐',lit:31,createdAt:'2026-07-03'},
  {id:'pe5',content:'25岁时觉得30岁很远，30岁时发现25岁的焦虑大多没发生。别提前预支明天的烦恼。',scene:'成长',author:'30岁的自己',lit:67,createdAt:'2026-07-03'},
  {id:'pe6',content:'别人眼中的"弯路"，恰恰是你独有的经历。没有白走的路，每一步都算数。',scene:'成长',author:'转行3次的设计师',lit:44,createdAt:'2026-07-04'},
  {id:'pe7',content:'职场上不必让所有人喜欢我。做好自己的事，三五个真朋友足矣。讨好所有人的人最后谁也讨好不了。',scene:'人际',author:'职场前辈',lit:35,createdAt:'2026-07-04'},
  {id:'pe8',content:'和父母意见不合时，别急着反驳。他们的建议来自爱，只是方式可能过时。',scene:'其他',author:'30岁的女儿',lit:29,createdAt:'2026-07-05'},
];

/* ===== State ===== */
let quotes = load('el_quotes_final', PRESET_QUOTES);
let experiences = load('el_exp_final', PRESET_EXP);
let diary = load('el_diary_final', []);
let currentMoodFilter = 'all';
let currentSceneFilter = 'all';
let searchQuotes = '';
let searchExp = '';
let heroMood = null;
let modalMode = null;
let selectedMood = null;
let selectedScene = null;
let diaryMood = null;
let calCurrentMonth = new Date();
let shareQuoteId = null;

function load(key, preset){
  try{ const d = localStorage.getItem(key); return d ? JSON.parse(d) : preset; }
  catch(e){ return preset; }
}
function save(key, data){ try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){} }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function formatDate(d){ const dt = new Date(d); return (dt.getMonth()+1)+'月'+dt.getDate()+'日'; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ===== Toast ===== */
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ===== Mood Hero ===== */
function selectHeroMood(mood){
  if(heroMood === mood){
    heroMood = null;
    document.querySelectorAll('#mood-hero-pick .mpl').forEach(x=>{x.classList.remove('sel');x.style.background='';x.style.borderColor='';});
    document.getElementById('mood-rec-inner').classList.remove('show');
    currentMoodFilter = 'all';
    document.querySelectorAll('#mood-filter .mood-chip').forEach(x=>x.classList.remove('active'));
    document.querySelector('#mood-filter .mc-all').classList.add('active');
  } else {
    heroMood = mood;
    document.querySelectorAll('#mood-hero-pick .mpl').forEach(x=>{x.classList.remove('sel');x.style.background='';x.style.borderColor='';});
    var sel = document.querySelector('#mood-hero-pick .mpl[data-mood="'+mood+'"]');
    sel.classList.add('sel');
    var mc = MOODS[mood];
    sel.style.background = mc.color;
    sel.style.borderColor = 'transparent';
    // show recommendation
    var recList = quotes.filter(q=>q.mood===mood);
    var recQ = recList.length > 0 ? recList[Math.floor(Math.random()*recList.length)] : null;
    document.getElementById('rec-label').textContent = '此刻为你 · '+mood;
    document.getElementById('rec-text').textContent = recQ ? recQ.content : mc.rec;
    document.getElementById('rec-source').textContent = recQ ? '— '+recQ.source : '';
    document.getElementById('mood-rec-inner').classList.add('show');
    // sync filter
    currentMoodFilter = mood;
    document.querySelectorAll('#mood-filter .mood-chip').forEach(x=>x.classList.remove('active'));
    var chip = document.querySelector('#mood-filter .mood-chip[data-mood="'+mood+'"]');
    if(chip) chip.classList.add('active');
    // scroll to quotes
    document.getElementById('sec-quotes').scrollIntoView({behavior:'smooth',block:'start'});
  }
  renderQuotes();
}

document.querySelectorAll('#mood-hero-pick .mpl').forEach(o=>{
  o.addEventListener('click',()=>selectHeroMood(o.dataset.mood));
});

/* ===== Render Stats ===== */
function renderStats(){
  document.getElementById('stat-quotes').textContent = quotes.length;
  document.getElementById('stat-exp').textContent = experiences.reduce((s,e)=>s+e.lit,0) + quotes.reduce((s,q)=>s+(q.lit||0),0);
  document.getElementById('stat-diary').textContent = diary.length;
  document.getElementById('cnt-all').textContent = quotes.length;
  document.getElementById('quotes-total').textContent = quotes.length>0 ? '· '+quotes.length+' 条' : '';
  document.getElementById('exp-total').textContent = experiences.length>0 ? '· '+experiences.length+' 条' : '';
  Object.keys(MOODS).forEach(m=>{
    var el = document.getElementById('cnt-'+m);
    if(el) el.textContent = quotes.filter(q=>q.mood===m).length;
  });
}

/* ===== Render Quotes ===== */
function renderQuotes(){
  var grid = document.getElementById('quotes-grid');
  var list = quotes;
  if(currentMoodFilter!=='all') list = list.filter(q=>q.mood===currentMoodFilter);

  grid.innerHTML = list.map(q=>{

/* ===== Copy Quote ===== */
function copyQuote(id){
  var q = quotes.find(x=>x.id===id);
  if(!q) return;
  var text = q.content + ' —— ' + (q.source||'佚名');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ showToast('已复制到剪贴板'); }).catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showToast('已复制到剪贴板'); }catch(e){ showToast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

/* ===== Share Card ===== */
var MOOD_HEX = {'低落':'#6b8cae','焦虑':'#e8927c','迷茫':'#9b8ec4','平静':'#7aab8e','喜悦':'#e8b86d','鼓励':'#d96b8e'};
var MOOD_BG_HEX = {'低落':'#eaf0f6','焦虑':'#fcebe5','迷茫':'#f0ecf8','平静':'#ecf3ee','喜悦':'#fbf3e4','鼓励':'#fceaf0'};

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function openShareCard(id){
  var q = quotes.find(x=>x.id===id);
  if(!q) return;
  shareQuoteId = id;
  var m = MOODS[q.mood] || {emoji:'📝'};
  var color = MOOD_HEX[q.mood] || '#999';
  var bgColor = MOOD_BG_HEX[q.mood] || '#f3ebdc';
  var canvas = document.getElementById('share-canvas');
  var ctx = canvas.getContext('2d');
  var W = 760, H = 540;

  /* Background */
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);
  /* Top accent bar */
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, 10);
  /* Decorative circles */
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(680, 80, 60, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(100, 480, 40, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  /* Brand */
  ctx.fillStyle = color;
  ctx.font = 'bold 18px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('📖 情绪文案馆', 40, 55);
  /* Mood tag */
  var tagText = (m.emoji||'📝') + ' ' + q.mood;
  ctx.font = '14px "Noto Sans SC", sans-serif';
  var tagW = ctx.measureText(tagText).width + 24;
  ctx.fillStyle = color;
  roundRect(ctx, 40, 75, tagW, 28, 14);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText(tagText, 40 + tagW/2, 93);
  /* Quote marks */
  ctx.font = 'bold 80px "Noto Serif SC", serif';
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.12;
  ctx.fillText('\u201C', 50, 200);
  ctx.fillText('\u201D', W - 70, H - 100);
  ctx.globalAlpha = 1;
  /* Quote text - wrap by character */
  ctx.fillStyle = '#2c241e';
  ctx.font = '28px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  var chars = q.content.split('');
  var lines = [];
  var line = '';
  var maxW = 620;
  for(var i=0; i<chars.length; i++){
    var test = line + chars[i];
    if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = chars[i]; }
    else { line = test; }
  }
  if(line) lines.push(line);
  var lineH = 42;
  var startY = 200;
  if(lines.length > 5){ startY = 180; lineH = 38; }
  lines.forEach(function(l, i){ ctx.fillText(l, W/2, startY + i*lineH); });
  /* Source */
  ctx.font = 'italic 16px "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#9a8d7c';
  ctx.fillText('— ' + (q.source||'佚名'), W/2, startY + lines.length*lineH + 30);
  /* Slogan */
  ctx.font = '13px "Noto Sans SC", sans-serif';
  ctx.fillStyle = color;
  ctx.fillText('每一句对的话，都在对的心情等你', W/2, H - 40);

  document.getElementById('share-overlay').classList.add('show');
}

/* ===== Calendar Heatmap ===== */
function renderCalendar(){
  var year = calCurrentMonth.getFullYear();
  var month = calCurrentMonth.getMonth();
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-month-label').textContent = year + '年 ' + monthNames[month];
  var firstDay = new Date(year, month, 1);
  var startWeekday = firstDay.getDay();
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var today = new Date();
  var html = '';
  ['日','一','二','三','四','五','六'].forEach(function(w){ html += '<div class="cal-weekday">'+w+'</div>'; });
  for(var i=0; i<startWeekday; i++){ html += '<div class="cal-cell empty"></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var entry = diary.find(function(x){
      var dx = new Date(x.date);
      return dx.getFullYear()===year && dx.getMonth()===month && dx.getDate()===d;
    });
    var isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===d;
    var isFuture = new Date(year, month, d) > today;
    if(entry){
      var mc = MOODS[entry.mood] || {color:'#999',emoji:'📝'};
      var tip = entry.mood + (entry.note ? ' · ' + entry.note.substring(0,20) : '');
      html += '<div class="cal-cell has-entry'+(isToday?' today':'')+'" style="background:'+mc.color+'" title="'+esc(tip)+'" onclick="openDayEditor('+year+','+month+','+d+')"><span class="cal-emoji">'+mc.emoji+'</span><span class="cal-day-num">'+d+'</span></div>';
    } else {
      var cls = 'cal-cell'+(isToday?' today':'');
      if(!isFuture) cls += ' clickable';
      html += '<div class="'+cls+'"'+(isFuture?'':' onclick="openDayEditor('+year+','+month+','+d+')"')+' title="'+(isFuture?'':'点击记录')+'">'+d+'</div>';
    }
  }
  document.getElementById('cal-grid').innerHTML = html;
  /* Legend */
  var usedMoods = {};
  diary.forEach(function(x){
    var dx = new Date(x.date);
    if(dx.getFullYear()===year && dx.getMonth()===month) usedMoods[x.mood] = true;
  });
  var legendHtml = '<span>图例：</span>';
  Object.keys(MOODS).forEach(function(m){
    if(usedMoods[m]){
      var mc = MOODS[m];
      legendHtml += '<span style="display:inline-flex;align-items:center;gap:4px"><span class="leg-dot" style="background:'+mc.color+'"></span>'+mc.emoji+' '+m+'</span>';
    }
  });
  legendHtml += '<span style="margin-left:auto;color:var(--accent);font-size:.7rem">💡 点击日期记录心情</span>';
  document.getElementById('cal-legend').innerHTML = legendHtml;
}

  calCurrentMonth = new Date(calCurrentMonth.getFullYear(), calCurrentMonth.getMonth()-1, 1);
  renderCalendar();
});

  calCurrentMonth = new Date(calCurrentMonth.getFullYear(), calCurrentMonth.getMonth()+1, 1);

function openDayEditor(year, month, day){
  deEditingDate = new Date(year, month, day);
  deSelectedMood = null;
  var dateStr = year + '年' + (month+1) + '月' + day + '日';
  var w = ['日','一','二','三','四','五','六'];
  dateStr += ' · 星期' + w[deEditingDate.getDay()];
  document.getElementById('de-date-label').textContent = dateStr;
  document.getElementById('de-hint').textContent = '';

  /* Reset mood picker selection */
  document.querySelectorAll('#de-mood-pick .de-mp').forEach(function(x){x.classList.remove('sel');x.style.background='';x.style.borderColor='';});

  /* Check if entry exists */
  var existing = diary.find(function(x){
    var dx = new Date(x.date);
    return dx.getFullYear()===year && dx.getMonth()===month && dx.getDate()===day;
  });

  /* Pre-fill if editing */
  if(existing){
    deSelectedMood = existing.mood;
    var mc = MOODS[existing.mood];
    var selBtn = document.querySelector('#de-mood-pick .de-mp[data-mood="'+existing.mood+'"]');
    if(selBtn){
      selBtn.classList.add('sel');
      selBtn.style.background = mc.color;
      selBtn.style.borderColor = 'transparent';
    }
    document.getElementById('de-note').value = existing.note || '';
    document.getElementById('de-save').disabled = false;
    document.getElementById('de-del').classList.add('show');
    document.getElementById('de-save').textContent = '更新日记';
  } else {
    document.getElementById('de-note').value = '';
    document.getElementById('de-save').disabled = true;
    document.getElementById('de-del').classList.remove('show');
    document.getElementById('de-save').textContent = '保存日记';
  }
}

document.getElementById('de-save').addEventListener('click', function(){
  if(!deEditingDate || !deSelectedMood) return;
  var note = document.getElementById('de-note').value.trim();
  var dateKey = deEditingDate.getFullYear() + '-' +
    String(deEditingDate.getMonth()+1).padStart(2,'0') + '-' +
    String(deEditingDate.getDate()).padStart(2,'0');
  var dateLabel = deEditingDate.getFullYear() + '年' + (deEditingDate.getMonth()+1) + '月' + deEditingDate.getDate() + '日';

  /* Find existing entry for this date */
  var idx = diary.findIndex(function(x){
    var dx = new Date(x.date);
    return dx.getFullYear()===deEditingDate.getFullYear() &&
           dx.getMonth()===deEditingDate.getMonth() &&
           dx.getDate()===deEditingDate.getDate();
  });

  if(idx >= 0){
    /* Update existing */
    diary[idx].mood = deSelectedMood;
    diary[idx].note = note;
    diary[idx].date = deEditingDate.toISOString();
    diary[idx].dateLabel = dateLabel;
  } else {
    /* Create new */
    diary.unshift({
      id: uid(),
      mood: deSelectedMood,
      note: note,
      date: deEditingDate.toISOString(),
      dateLabel: dateLabel
    });
  }

  save('el_diary_final', diary);
  renderStats();
  renderDiary();
  renderCalendar();
  renderMoodDist();
  showToast('日记已保存！');
  closeDayEditor();
});

document.getElementById('de-del').addEventListener('click', function(){
  if(!deEditingDate) return;
  var idx = diary.findIndex(function(x){
    var dx = new Date(x.date);
    return dx.getFullYear()===deEditingDate.getFullYear() &&
           dx.getMonth()===deEditingDate.getMonth() &&
           dx.getDate()===deEditingDate.getDate();
  });
  if(idx >= 0){
    diary.splice(idx, 1);
    save('el_diary_final', diary);
    renderStats();
    renderDiary();
    renderCalendar();
    renderMoodDist();
    showToast('日记已删除');
  }
  closeDayEditor();
});

/* ===== Mood Distribution ===== */
function renderMoodDist(){
  var container = document.getElementById('mood-dist-box');
  if(diary.length === 0){
    container.innerHTML = '<h4>📊 心情分布</h4><div class="empty" style="padding:20px"><div class="em-ic">📊</div><p>记录日记后可见心情分布</p></div>';
    return;
  }
  var counts = {};
  Object.keys(MOODS).forEach(function(m){ counts[m] = 0; });
  diary.forEach(function(d){ if(counts[d.mood]!==undefined) counts[d.mood]++; });
  var total = diary.length;
  var segments = [];
  var legend = [];
  var acc = 0;
  Object.keys(MOODS).forEach(function(m){
    if(counts[m] > 0){
      var pct = counts[m] / total;
      var hex = MOOD_HEX[m] || '#999';
      var startPct = (acc / total * 100).toFixed(1);
      acc += counts[m];
      var endPct = (acc / total * 100).toFixed(1);
      segments.push(hex + ' ' + startPct + '% ' + endPct + '%');
      var mc = MOODS[m];
      legend.push('<div class="dist-item"><span class="dist-dot" style="background:'+hex+'"></span>'+mc.emoji+' '+m+'<span class="dist-pct">'+Math.round(pct*100)+'%</span></div>');
    }
  });
  var conicGrad = 'conic-gradient(' + segments.join(', ') + ')';
  container.innerHTML =
    '<h4>📊 心情分布</h4>' +
    '<div class="dist-wrap">' +
      '<div class="dist-chart" style="background:'+conicGrad+'"><div class="dist-center"><span class="dc-num">'+total+'</span><span class="dc-lbl">天记录</span></div></div>' +
      '<div class="dist-legend">' + legend.join('') + '</div>' +
    '</div>';
}

/* ===== Init ===== */
renderStats();
renderQuotes();
renderExperiences();
renderDiary();
renderCalendar();
renderMoodDist();
</script>
