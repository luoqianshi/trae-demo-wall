<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心港 MindHarbor - 心理互助平台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {
  --primary: #7C6CF0;
  --primary-light: #A594FF;
  --primary-dark: #5B4CC4;
  --secondary: #4ECDC4;
  --secondary-light: #7EDDD6;
  --accent: #FFB347;
  --accent-light: #FFD699;
  --bg: #F5F3FF;
  --bg-card: #FFFFFF;
  --bg-chat: #F0EDFF;
  --text-primary: #2D2B3D;
  --text-secondary: #6E6B85;
  --text-light: #A09CB5;
  --border: #E8E5F0;
  --danger: #FF6B6B;
  --success: #51CF66;
  --warning: #FFD43B;
  --shadow: 0 2px 12px rgba(124,108,240,0.08);
  --shadow-lg: 0 8px 30px rgba(124,108,240,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-full: 50px;
  --nav-height: 65px;
  --header-height: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== APP SHELL ===== */
#app {
  max-width: 480px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg);
}

/* ===== HEADER ===== */
.app-header {
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 100;
}
.app-header .logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
}
.app-header .logo i { font-size: 22px; }
.app-header .header-actions { display: flex; gap: 16px; }
.app-header .header-actions i {
  font-size: 20px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: color 0.2s;
}
.app-header .header-actions i:hover { color: var(--primary); }

/* ===== PAGES ===== */
.page-container {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.page {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 20px;
  display: none;
  -webkit-overflow-scrolling: touch;
}
.page.active {
  display: block;
}
.page::-webkit-scrollbar { display: none; }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  height: var(--nav-height);
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  padding-bottom: var(--safe-bottom);
  z-index: 100;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.nav-item i { font-size: 22px; color: var(--text-light); transition: all 0.2s; }
.nav-item span { font-size: 10px; color: var(--text-light); font-weight: 500; transition: all 0.2s; }
.nav-item.active i { color: var(--primary); }
.nav-item.active span { color: var(--primary); }
.nav-item.ai-btn {
  position: relative;
  margin-top: -18px;
}
.nav-item.ai-btn .ai-icon-wrap {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(124,108,240,0.3);
  transition: transform 0.2s, box-shadow 0.2s;
}
.nav-item.ai-btn .ai-icon-wrap i { color: #fff; font-size: 22px; }
.nav-item.ai-btn:active .ai-icon-wrap { transform: scale(0.92); }
.nav-item.ai-btn.active .ai-icon-wrap { box-shadow: 0 4px 20px rgba(124,108,240,0.5); }

/* ===== CARDS ===== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  margin: 12px 16px;
  box-shadow: var(--shadow);
}

/* ===== HOME PAGE ===== */
.home-banner {
  margin: 16px;
  padding: 20px;
  background: linear-gradient(135deg, var(--primary), #9B8BFF);
  border-radius: var(--radius);
  color: #fff;
  position: relative;
  overflow: hidden;
}
.home-banner::after {
  content: '';
  position: absolute;
  top: -20px; right: -20px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.home-banner h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.home-banner p { font-size: 13px; opacity: 0.85; line-height: 1.5; }
.home-banner .banner-mood {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.home-banner .mood-chip {
  padding: 6px 14px;
  background: rgba(255,255,255,0.2);
  border-radius: var(--radius-full);
  font-size: 12px;
  cursor: pointer;
  transition: background 0.2s;
  backdrop-filter: blur(4px);
}
.home-banner .mood-chip:hover { background: rgba(255,255,255,0.35); }

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 16px 8px;
}
.section-header h3 { font-size: 16px; font-weight: 600; }
.section-header .more { font-size: 12px; color: var(--text-light); cursor: pointer; }

/* Post composer */
.post-composer {
  margin: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
}
.post-composer textarea {
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  font-size: 14px;
  font-family: var(--font);
  color: var(--text-primary);
  background: transparent;
  min-height: 60px;
  line-height: 1.6;
}
.post-composer textarea::placeholder { color: var(--text-light); }
.post-composer .composer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.composer-left { display: flex; gap: 14px; }
.composer-left i {
  font-size: 20px;
  color: var(--text-light);
  cursor: pointer;
  transition: color 0.2s;
}
.composer-left i:hover { color: var(--primary); }
.composer-mood-select {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--bg);
  border-radius: var(--radius-full);
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
}
.btn-publish {
  padding: 6px 20px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font);
}
.btn-publish:hover { background: var(--primary-dark); }
.btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

/* Image preview in composer */
.composer-images {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.composer-img-preview {
  width: 72px; height: 72px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  position: relative;
}
.composer-img-preview img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.composer-img-preview .remove-img {
  position: absolute;
  top: 2px; right: 2px;
  width: 20px; height: 20px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  cursor: pointer;
}

/* Post card */
.post-card {
  margin: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  animation: fadeInUp 0.3s ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.post-user {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.post-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #fff;
  font-weight: 700;
  flex-shrink: 0;
}
.post-user-info { flex: 1; }
.post-user-info .name { font-size: 14px; font-weight: 600; }
.post-user-info .time { font-size: 11px; color: var(--text-light); }
.post-mood-tag {
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 500;
}
.post-content {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
  margin-bottom: 12px;
  word-break: break-word;
}
.post-images {
  display: grid;
  gap: 4px;
  margin-bottom: 12px;
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.post-images.grid-1 { grid-template-columns: 1fr; max-width: 280px; }
.post-images.grid-2 { grid-template-columns: 1fr 1fr; }
.post-images.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.post-images img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  cursor: pointer;
  transition: opacity 0.2s;
}
.post-images img:hover { opacity: 0.9; }
.post-actions {
  display: flex;
  gap: 24px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.post-action {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.post-action i { font-size: 18px; transition: all 0.2s; }
.post-action.liked { color: var(--danger); }
.post-action.liked i { animation: heartBeat 0.3s ease; }
@keyframes heartBeat {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
.post-action:hover { color: var(--primary); }

/* Comments section */
.post-comments {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.comment-item {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  animation: fadeInUp 0.2s ease;
}
.comment-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #fff;
  flex-shrink: 0;
}
.comment-body { flex: 1; }
.comment-body .comment-name { font-size: 12px; font-weight: 600; }
.comment-body .comment-text { font-size: 13px; color: var(--text-secondary); margin-top: 2px; line-height: 1.5; }
.comment-body .comment-time { font-size: 10px; color: var(--text-light); margin-top: 3px; }
.comment-input-wrap {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.comment-input-wrap input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  font-size: 13px;
  outline: none;
  font-family: var(--font);
  transition: border-color 0.2s;
}
.comment-input-wrap input:focus { border-color: var(--primary-light); }
.comment-input-wrap button {
  padding: 8px 14px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-full);
  font-size: 12px;
  cursor: pointer;
  font-family: var(--font);
}

/* ===== AI PAGE ===== */
.ai-page-header {
  padding: 20px 16px 10px;
  text-align: center;
}
.ai-page-header h2 { font-size: 20px; font-weight: 700; color: var(--text-primary); }
.ai-page-header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

.ai-tabs {
  display: flex;
  gap: 0;
  margin: 0 16px 12px;
  background: var(--bg-card);
  border-radius: var(--radius-full);
  padding: 4px;
  box-shadow: var(--shadow);
}
.ai-tab {
  flex: 1;
  text-align: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all 0.2s;
}
.ai-tab.active {
  background: var(--primary);
  color: #fff;
}

/* AI assistant cards */
.ai-assistant-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 16px;
}
.ai-assistant-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px 14px;
  text-align: center;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.25s;
  border: 2px solid transparent;
}
.ai-assistant-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  border-color: var(--primary-light);
}
.ai-assistant-card .ai-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
}
.ai-assistant-card .ai-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.ai-assistant-card .ai-desc { font-size: 11px; color: var(--text-light); line-height: 1.4; }
.ai-assistant-card .ai-tag {
  display: inline-block;
  margin-top: 8px;
  padding: 3px 10px;
  background: var(--bg);
  border-radius: var(--radius-full);
  font-size: 10px;
  color: var(--primary);
  font-weight: 500;
}

/* Group chat cards */
.group-chat-list { padding: 0 16px; }
.group-chat-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex;
  gap: 14px;
  align-items: center;
  transition: all 0.2s;
}
.group-chat-card:hover { box-shadow: var(--shadow-lg); }
.group-chat-card .group-avatars {
  display: flex;
  position: relative;
  width: 52px; height: 52px;
  flex-shrink: 0;
}
.group-chat-card .group-avatars .mini-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  position: absolute;
  border: 2px solid #fff;
}
.group-chat-card .group-avatars .mini-avatar:nth-child(1) { top: 0; left: 0; z-index: 2; }
.group-chat-card .group-avatars .mini-avatar:nth-child(2) { top: 0; left: 18px; z-index: 1; }
.group-chat-card .group-avatars .mini-avatar:nth-child(3) { bottom: 0; left: 9px; z-index: 0; }
.group-chat-info { flex: 1; }
.group-chat-info .group-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.group-chat-info .group-desc { font-size: 12px; color: var(--text-light); line-height: 1.4; }
.group-chat-info .group-members {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.group-chat-info .group-members .member-tag {
  padding: 2px 8px;
  background: var(--bg);
  border-radius: var(--radius-full);
  font-size: 10px;
  color: var(--text-secondary);
}
.group-chat-card .group-arrow {
  color: var(--text-light);
  font-size: 14px;
}

/* ===== CHAT VIEW ===== */
.chat-view {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 200;
  display: none;
  flex-direction: column;
}
.chat-view.open { display: flex; }

.chat-header {
  height: var(--header-height);
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 12px;
}
.chat-header .back-btn {
  font-size: 20px;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 4px;
}
.chat-header .chat-title { flex: 1; }
.chat-header .chat-title .name { font-size: 15px; font-weight: 600; }
.chat-header .chat-title .status { font-size: 11px; color: var(--success); }
.chat-header .chat-menu { font-size: 20px; color: var(--text-secondary); cursor: pointer; }

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chat-messages::-webkit-scrollbar { display: none; }

.chat-msg {
  display: flex;
  gap: 10px;
  max-width: 85%;
  animation: fadeInUp 0.2s ease;
}
.chat-msg.self {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.chat-msg .msg-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.chat-msg .msg-content {}
.chat-msg .msg-name { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
.chat-msg.self .msg-name { text-align: right; }
.chat-msg .msg-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}
.chat-msg:not(.self) .msg-bubble {
  background: var(--bg-card);
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
  box-shadow: var(--shadow);
}
.chat-msg.self .msg-bubble {
  background: var(--primary);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.chat-msg .msg-time {
  font-size: 10px;
  color: var(--text-light);
  margin-top: 4px;
}
.chat-msg.self .msg-time { text-align: right; }

/* Typing indicator */
.typing-indicator {
  display: flex;
  gap: 10px;
  max-width: 85%;
  animation: fadeInUp 0.2s ease;
}
.typing-indicator .msg-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.typing-dots {
  padding: 12px 16px;
  background: var(--bg-card);
  border-radius: 18px;
  border-bottom-left-radius: 4px;
  display: flex;
  gap: 4px;
  box-shadow: var(--shadow);
}
.typing-dots span {
  width: 7px; height: 7px;
  background: var(--text-light);
  border-radius: 50%;
  animation: typingBounce 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* Chat input */
.chat-input-area {
  padding: 10px 16px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}
.chat-input-area textarea {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  resize: none;
  max-height: 100px;
  line-height: 1.4;
  transition: border-color 0.2s;
}
.chat-input-area textarea:focus { border-color: var(--primary-light); }
.chat-send-btn {
  width: 40px; height: 40px;
  background: var(--primary);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.chat-send-btn:hover { background: var(--primary-dark); }

/* Group chat members bar */
.group-members-bar {
  padding: 10px 16px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  overflow-x: auto;
  flex-shrink: 0;
}
.group-members-bar::-webkit-scrollbar { display: none; }
.group-member-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px 4px 4px;
  background: var(--bg);
  border-radius: var(--radius-full);
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}
.group-member-chip .chip-avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

/* ===== MOOD PAGE ===== */
.mood-summary {
  margin: 16px;
  padding: 20px;
  background: linear-gradient(135deg, #4ECDC4, #44B8A8);
  border-radius: var(--radius);
  color: #fff;
}
.mood-summary h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.mood-summary .mood-stats {
  display: flex;
  gap: 16px;
}
.mood-stat {
  flex: 1;
  text-align: center;
  padding: 10px;
  background: rgba(255,255,255,0.15);
  border-radius: var(--radius-sm);
  backdrop-filter: blur(4px);
}
.mood-stat .stat-num { font-size: 24px; font-weight: 700; }
.mood-stat .stat-label { font-size: 11px; opacity: 0.85; margin-top: 2px; }

.mood-calendar {
  margin: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.mood-calendar .cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.mood-calendar .cal-header h4 { font-size: 15px; font-weight: 600; }
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}
.cal-weekdays span {
  text-align: center;
  font-size: 11px;
  color: var(--text-light);
  font-weight: 500;
}
.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  gap: 2px;
}
.cal-day:hover { background: var(--bg); }
.cal-day.today { background: #F0EDFF; font-weight: 600; }
.cal-day .day-mood { font-size: 14px; }
.cal-day.empty { pointer-events: none; }

.mood-trend {
  margin: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.mood-trend h4 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
.trend-chart {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 120px;
  padding: 0 4px;
}
.trend-bar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  height: 100%;
  justify-content: flex-end;
}
.trend-bar .bar {
  width: 100%;
  border-radius: 6px 6px 0 0;
  min-height: 8px;
  transition: height 0.5s ease;
}
.trend-bar .bar-label { font-size: 10px; color: var(--text-light); }
.trend-bar .bar-emoji { font-size: 16px; }

/* ===== PROFILE PAGE ===== */
.profile-header {
  text-align: center;
  padding: 30px 16px 20px;
}
.profile-avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  box-shadow: 0 4px 20px rgba(124,108,240,0.3);
}
.profile-name { font-size: 20px; font-weight: 700; }
.profile-bio { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.profile-stats-row {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 16px;
}
.profile-stat-item { text-align: center; }
.profile-stat-item .num { font-size: 20px; font-weight: 700; color: var(--primary); }
.profile-stat-item .label { font-size: 11px; color: var(--text-light); margin-top: 2px; }

.profile-menu {
  margin: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.profile-menu-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  cursor: pointer;
  transition: background 0.2s;
  border-bottom: 1px solid var(--border);
}
.profile-menu-item:last-child { border-bottom: none; }
.profile-menu-item:hover { background: var(--bg); }
.profile-menu-item .menu-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.profile-menu-item .menu-text { flex: 1; font-size: 14px; font-weight: 500; }
.profile-menu-item .menu-arrow { color: var(--text-light); font-size: 14px; }

/* ===== DISCOVER PAGE ===== */
.discover-search {
  margin: 16px;
  position: relative;
}
.discover-search input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  background: var(--bg-card);
  border: none;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  box-shadow: var(--shadow);
  color: var(--text-primary);
}
.discover-search input::placeholder { color: var(--text-light); }
.discover-search i {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-light);
  font-size: 16px;
}

.topic-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 16px;
  margin-bottom: 12px;
}
.topic-tag {
  padding: 8px 16px;
  background: var(--bg-card);
  border-radius: var(--radius-full);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.2s;
}
.topic-tag:hover, .topic-tag.active {
  background: var(--primary);
  color: #fff;
}

.hot-topics { padding: 0 16px; }
.hot-topic-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: var(--bg-card);
  border-radius: var(--radius);
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s;
}
.hot-topic-item:hover { box-shadow: var(--shadow-lg); }
.hot-topic-item .topic-rank {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  width: 28px;
  text-align: center;
}
.hot-topic-item .topic-rank.top3 { color: var(--accent); }
.hot-topic-item .topic-info { flex: 1; }
.hot-topic-item .topic-info .topic-title { font-size: 14px; font-weight: 600; }
.hot-topic-item .topic-info .topic-count { font-size: 11px; color: var(--text-light); margin-top: 2px; }

/* ===== MODAL / OVERLAY ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.modal-content {
  background: var(--bg-card);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 70vh;
  overflow-y: auto;
  padding: 20px;
  transform: translateY(100%);
  transition: transform 0.3s ease;
}
.modal-overlay.show .modal-content {
  transform: translateY(0);
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 16px;
}

/* Mood selector modal */
.mood-selector {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.mood-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid transparent;
}
.mood-option:hover { background: var(--bg); }
.mood-option.selected { border-color: var(--primary); background: #F0EDFF; }
.mood-option .mood-emoji { font-size: 28px; }
.mood-option .mood-label { font-size: 11px; color: var(--text-secondary); }

/* Image viewer */
.image-viewer {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 400;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.image-viewer.show { opacity: 1; pointer-events: auto; }
.image-viewer img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  border-radius: 8px;
}
.image-viewer .close-viewer {
  position: absolute;
  top: 20px; right: 20px;
  color: #fff;
  font-size: 28px;
  cursor: pointer;
}

/* Toast */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  padding: 10px 24px;
  background: var(--text-primary);
  color: #fff;
  border-radius: var(--radius-full);
  font-size: 13px;
  z-index: 500;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== RESPONSIVE ===== */
@media (min-width: 481px) {
  #app {
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
}

/* ===== UTILITIES ===== */
.hidden { display: none !important; }
.text-center { text-align: center; }

/* System message in chat */
.chat-system-msg {
  text-align: center;
  font-size: 12px;
  color: var(--text-light);
  padding: 8px 16px;
  background: var(--bg);
  border-radius: var(--radius-full);
  align-self: center;
}

/* Quick reply chips */
.quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.quick-reply-chip {
  padding: 6px 14px;
  background: var(--bg-card);
  border: 1px solid var(--primary-light);
  border-radius: var(--radius-full);
  font-size: 12px;
  color: var(--primary);
  cursor: pointer;
  transition: all 0.2s;
}
.quick-reply-chip:hover {
  background: var(--primary);
  color: #fff;
}
</style>
</head>

let state = {

  composerMood: -1,

};

let chatMemory = {};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
    if (!state.posts || state.posts.length === 0) {
      state.posts = SAMPLE_POSTS;
    }
  } catch(e) {
    state.posts = SAMPLE_POSTS;
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      posts: state.posts,
      moodRecords: state.moodRecords,
      userName: state.userName
    }));
  } catch(e) {}
}

// ===== NAVIGATION =====
function switchPage(page) {
  state.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === page);
  });
  renderPage(page);
}

function renderPage(page) {
  switch(page) {

}

function renderPostCard(post, idx) {
  const mood = MOODS[post.mood] || MOODS[7];
  const initial = post.user.name.charAt(0);

  let imagesHtml = '';
  if (post.images && post.images.length > 0) {
    const gridClass = post.images.length === 1 ? 'grid-1' : post.images.length === 2 ? 'grid-2' : 'grid-3';
    imagesHtml = `<div class="post-images ${gridClass}">`;
    post.images.forEach(img => {
      imagesHtml += `<img src="${img}" onclick="viewImage('${img.replace(/'/g, "\\'")}')" alt="动态图片">`;
    });
    imagesHtml += '</div>';
  }

  let commentsHtml = '';
  if (post.comments && post.comments.length > 0) {
    commentsHtml = '<div class="post-comments">';
    post.comments.forEach(c => {
      const cColor = c.user.color || '#7C6CF0';
      const cInitial = c.user.name.charAt(0);
      commentsHtml += `
        <div class="comment-item">
          <div class="comment-avatar" style="background:${cColor}">${cInitial}</div>
          <div class="comment-body">
            <div class="comment-name">${c.user.name}</div>
            <div class="comment-text">${c.text}</div>
            <div class="comment-time">${c.time}</div>
          </div>
        </div>`;
    });
    commentsHtml += `
      <div class="comment-input-wrap">
        <input type="text" id="comment-input-${idx}" placeholder="写评论..." onkeydown="if(event.key==='Enter')addComment(${idx})">
        <button onclick="addComment(${idx})">发送</button>
      </div>
    </div>`;
  }

  return `
    <div class="post-card" id="post-${idx}">
      <div class="post-user">
        <div class="post-avatar" style="background:${post.user.color}">${initial}</div>
        <div class="post-user-info">
          <div class="name">${post.user.name}</div>
          <div class="time">${post.time}</div>
        </div>
        <div class="post-mood-tag" style="background:${mood.bg};color:${mood.color}">${mood.emoji} ${mood.label}</div>
      </div>
      <div class="post-content">${post.content}</div>
      ${imagesHtml}
      <div class="post-actions">
        <div class="post-action ${post.liked ? 'liked' : ''}" onclick="toggleLike(${idx})">
          <i class="fa${post.liked ? 's' : 'r'} fa-heart"></i>
          <span>${post.likes}</span>
        </div>
        <div class="post-action" onclick="toggleComments(${idx})">
          <i class="far fa-comment"></i>
          <span>${post.comments ? post.comments.length : 0}</span>
        </div>
        <div class="post-action" onclick="showToast('已分享到广场')">
          <i class="far fa-share-from-square"></i>
          <span>分享</span>
        </div>
      </div>
      ${commentsHtml}
    </div>`;
}

function onPostInput() {
  const content = document.getElementById('postContent').value.trim();
  document.getElementById('btnPublish').disabled = !content && state.composerImages.length === 0;
}

function triggerImageUpload() {
  document.getElementById('imageUpload').click();
}

function handleImageUpload(event) {
  const files = event.target.files;
  if (!files.length) return;
  Array.from(files).slice(0, 3 - state.composerImages.length).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e) {
      if (state.composerImages.length < 3) {
        state.composerImages.push(e.target.result);
        renderComposerImages();
        onPostInput();
      }
    };
    reader.readAsDataURL(file);
  });
}

function renderComposerImages() {
  const el = document.getElementById('composerImages');
  if (!el) return;
  let html = '';
  state.composerImages.forEach((img, i) => {
    html += `
      <div class="composer-img-preview">
        <img src="${img}" alt="预览">
        <div class="remove-img" onclick="removeComposerImage(${i})"><i class="fas fa-times"></i></div>
      </div>`;
  });
  el.innerHTML = html;
}

function removeComposerImage(idx) {
  state.composerImages.splice(idx, 1);
  renderComposerImages();
  onPostInput();
}

function openMoodSelector() {
  const body = document.getElementById('modalBody');
  let html = '<h3 style="font-size:16px;font-weight:600;margin-bottom:16px;text-align:center;">选择你此刻的心情</h3>';
  html += '<div class="mood-selector">';

function selectMood(idx) {
  state.composerMood = idx;

  const display = document.getElementById('composerMoodDisplay');
  if (display) display.textContent = m.emoji + ' ' + m.label;

function quickMoodPost(moodIdx) {
  state.composerMood = moodIdx;
  const m = MOODS[moodIdx];
  const display = document.getElementById('composerMoodDisplay');
  if (display) display.textContent = m.emoji + ' ' + m.label;
  document.getElementById('postContent').focus();
}

function publishPost() {
  const content = document.getElementById('postContent').value.trim();
  if (!content && state.composerImages.length === 0) return;
  const mood = state.composerMood >= 0 ? state.composerMood : 7;
  const newPost = {
    user: { name: state.userName, color: AVATARS_COLORS[Math.floor(Math.random() * AVATARS_COLORS.length)] },
    mood: mood, content: content, time: '刚刚', likes: 0, liked: false, comments: [],
    images: state.composerImages.length > 0 ? [...state.composerImages] : undefined
  };
  state.posts.unshift(newPost);
  state.composerMood = -1;
  state.composerImages = [];
  const today = new Date().toISOString().split('T')[0];
  state.moodRecords[today] = mood;
  saveState();
  renderHome();
  showToast('发布成功！');
}

function toggleLike(idx) {
  const post = state.posts[idx];
  post.liked = !post.liked;
  post.likes += post.liked ? 1 : -1;
  saveState();
  const card = document.getElementById('post-' + idx);
  if (card) {
    const likeBtn = card.querySelector('.post-action:first-child');
    likeBtn.className = 'post-action' + (post.liked ? ' liked' : '');
    likeBtn.querySelector('i').className = `fa${post.liked ? 's' : 'r'} fa-heart`;
    likeBtn.querySelector('span').textContent = post.likes;
  }
}

function toggleComments(idx) {
  const card = document.getElementById('post-' + idx);
  let commentsEl = card.querySelector('.post-comments');
  if (commentsEl) {
    commentsEl.classList.toggle('hidden');
    return;
  }
  const post = state.posts[idx];
  if (!post.comments) post.comments = [];
  let html = '<div class="post-comments">';
  post.comments.forEach(c => {
    const cColor = c.user.color || '#7C6CF0';
    html += `
      <div class="comment-item">
        <div class="comment-avatar" style="background:${cColor}">${c.user.name.charAt(0)}</div>
        <div class="comment-body">
          <div class="comment-name">${c.user.name}</div>
          <div class="comment-text">${c.text}</div>
          <div class="comment-time">${c.time}</div>
        </div>
      </div>`;
  });
  html += `
    <div class="comment-input-wrap">
      <input type="text" id="comment-input-${idx}" placeholder="写评论..." onkeydown="if(event.key==='Enter')addComment(${idx})">
      <button onclick="addComment(${idx})">发送</button>
    </div></div>`;
  card.querySelector('.post-actions').insertAdjacentHTML('afterend', html);
  setTimeout(() => { const input = document.getElementById('comment-input-' + idx); if (input) input.focus(); }, 100);
}

function addComment(idx) {
  const input = document.getElementById('comment-input-' + idx);
  const text = input.value.trim();
  if (!text) return;
  if (!state.posts[idx].comments) state.posts[idx].comments = [];
  state.posts[idx].comments.push({
    user: { name: state.userName, color: AVATARS_COLORS[Math.floor(Math.random() * AVATARS_COLORS.length)] },
    text: text, time: '刚刚'
  });
  saveState();
  renderHome();
}

// ===== CHAT SYSTEM =====
function openSingleChat(aiId) {
  const ai = AI_ASSISTANTS.find(a => a.id === aiId);
  if (!ai) return;
  state.chatState = { type: 'single', targetId: aiId };
  const chatKey = 'single_' + aiId;
  if (!chatMemory[chatKey]) {
    chatMemory[chatKey] = [{ role: 'assistant', content: ai.greetings[0], name: ai.name, emoji: ai.emoji, color: ai.color }];
  }
  document.getElementById('chatTitleName').textContent = ai.name;
  document.getElementById('chatTitleStatus').textContent = 'AI在线';
  document.getElementById('groupMembersBar').classList.add('hidden');
  renderChatMessages(chatKey);
  document.getElementById('chatView').classList.add('open');
}

function openGroupChat(groupId) {
  const group = GROUP_CHATS.find(g => g.id === groupId);
  if (!group) return;
  state.chatState = { type: 'group', targetId: groupId };
  const chatKey = 'group_' + groupId;
  if (!chatMemory[chatKey]) {
    chatMemory[chatKey] = [{ role: 'system', content: group.welcome }];
    group.members.forEach(mid => {
      const ai = AI_ASSISTANTS.find(a => a.id === mid);
      chatMemory[chatKey].push({ role: 'assistant', content: ai.greetings[1], name: ai.name, emoji: ai.emoji, color: ai.color });
    });
  }
  document.getElementById('chatTitleName').textContent = group.name;
  document.getElementById('chatTitleStatus').textContent = `${group.members.length + 1}人在线`;
  const bar = document.getElementById('groupMembersBar');
  bar.classList.remove('hidden');
  let barHtml = `<div class="group-member-chip"><div class="chip-avatar" style="background:var(--primary);color:#fff;font-size:10px;">我</div><span>${state.userName}</span></div>`;
  group.members.forEach(mid => {
    const ai = AI_ASSISTANTS.find(a => a.id === mid);
    barHtml += `<div class="group-member-chip"><div class="chip-avatar" style="background:${ai.color}20">${ai.emoji}</div><span>${ai.name}</span></div>`;
  });
  bar.innerHTML = barHtml;
  renderChatMessages(chatKey);
  document.getElementById('chatView').classList.add('open');
}

function renderChatMessages(chatKey) {
  const container = document.getElementById('chatMessages');
  const messages = chatMemory[chatKey] || [];
  let html = '';
  messages.forEach(msg => {
    if (msg.role === 'system') {
      html += `<div class="chat-system-msg">${msg.content}</div>`;
    } else if (msg.role === 'user') {
      html += `
        <div class="chat-msg self">
          <div class="msg-avatar" style="background:var(--primary);color:#fff;font-size:14px;">我</div>
          <div class="msg-content">
            <div class="msg-name">${state.userName}</div>
            <div class="msg-bubble">${msg.content}</div>
            <div class="msg-time">${msg.time || ''}</div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="chat-msg">
          <div class="msg-avatar" style="background:${msg.color}20">${msg.emoji}</div>
          <div class="msg-content">
            <div class="msg-name">${msg.name}</div>
            <div class="msg-bubble">${msg.content}</div>
            ${msg.quickReplies ? `<div class="quick-replies">${msg.quickReplies.map(r => `<div class="quick-reply-chip" onclick="sendQuickReply('${r}')">${r}</div>`).join('')}</div>` : ''}
            <div class="msg-time">${msg.time || ''}</div>
          </div>
        </div>`;
    }
  });
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function closeChat() {
  document.getElementById('chatView').classList.remove('open');
  state.chatState = null;
}

function handleChatKey(event) {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendChatMessage(); }
}

function sendQuickReply(text) {
  document.getElementById('chatInput').value = text;
  sendChatMessage();
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !state.chatState) return;
  input.value = '';
  const chatKey = (state.chatState.type === 'single' ? 'single_' : 'group_') + state.chatState.targetId;
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  chatMemory[chatKey].push({ role: 'user', content: text, time: timeStr });
  renderChatMessages(chatKey);
  showTypingIndicator();
  if (state.chatState.type === 'single') {
    const ai = AI_ASSISTANTS.find(a => a.id === state.chatState.targetId);
    setTimeout(() => {
      removeTypingIndicator();
      const response = generateAIResponse(ai, text);
      chatMemory[chatKey].push({ role: 'assistant', content: response, name: ai.name, emoji: ai.emoji, color: ai.color, time: getTimeStr() });
      renderChatMessages(chatKey);
    }, 1000 + Math.random() * 1000);
  } else {
    const group = GROUP_CHATS.find(g => g.id === state.chatState.targetId);
    const respondingMembers = group.members.slice(0, 2 + Math.floor(Math.random() * 2));
    let delay = 800;
    respondingMembers.forEach((mid, i) => {
      setTimeout(() => {
        removeTypingIndicator();
        const ai = AI_ASSISTANTS.find(a => a.id === mid);
        const response = generateAIResponse(ai, text, true);
        chatMemory[chatKey].push({ role: 'assistant', content: response, name: ai.name, emoji: ai.emoji, color: ai.color, time: getTimeStr() });
        renderChatMessages(chatKey);
        if (i < respondingMembers.length - 1) { setTimeout(() => showTypingIndicator(), 300); }
      }, delay);
      delay += 1200 + Math.random() * 800;
    });
  }
}

function showTypingIndicator() {
  const container = document.getElementById('chatMessages');
  const ai = state.chatState.type === 'single' ? AI_ASSISTANTS.find(a => a.id === state.chatState.targetId) : AI_ASSISTANTS[0];
  const typingEl = document.createElement('div');
  typingEl.className = 'typing-indicator';
  typingEl.id = 'typingIndicator';
  typingEl.innerHTML = `<div class="msg-avatar" style="background:${ai.color}20">${ai.emoji}</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
  container.appendChild(typingEl);
  container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

      sad: ['我理解你现在的感受。让我们一起来看看，是什么让你感到难过？找到原因，我们才能更好地面对。','难过的时候，最重要的是不要否定自己的感受。你觉得现在最需要的是什么？'],

      angry: ['愤怒的背面往往藏着未被满足的需求。你觉得你的哪个需求没有被满足？','在做出反应之前，给自己10秒钟。问问自己：我真正想要的是什么？'],
      happy: ['很高兴听到你状态不错！能分享一下是什么带来了这个积极的变化吗？','好的状态值得被记录和珍惜。你觉得是什么因素促成了这样的好心情？'],
      sleep: ['睡眠问题通常和思维过度活跃有关。建议建立一个固定的睡前仪式，比如阅读或冥想10分钟。'],
      default: ['这是一个很好的话题。让我们更深入地探讨一下，你觉得这背后的核心问题是什么？','我注意到你提到了这些。你对自己目前的这个状态有什么看法？']
    },
    tree_hugger: {
      sad: ['你现在经历的这些，我都能理解。不管发生什么，你都是安全的。我会像大树一样，稳稳地在这里陪着你。','累了就靠一靠吧。你不需要总是坚强，也不需要假装没事。在我面前，你可以做最真实的自己。'],
      anxious: ['感到不安的时候，试试脚踏实地：感受双脚踩在地面上的感觉。你此刻是安全的，我在这里保护你。','风再大，树根扎得深就不会倒。你比你想象的更有力量。慢慢来，我陪着你。'],
      angry: ['你的感受是合理的。如果现在需要发泄，就在这里大声说出来吧。我不会评判你，只会在这里陪着你。'],
      happy: ['看到你开心，我也觉得很安心。记住这种感觉，它是属于你的力量源泉。'],
      sleep: ['夜晚是休息的时间。把今天的烦恼都交给我来保管吧，你只需要安心闭上眼睛。'],
      default: ['不管怎样，我都在这里。你可以随时来找我聊天，这棵大树永远为你遮风挡雨。','你的每一句话我都在认真听。有什么想说的就尽管说吧，这里是安全的。']
    },
    cat_therapist: {
      sad: ['喵~ 难过的时候就让眼泪流出来吧，猫咪也会哭的哦。不过哭完了，让本医生开个处方：一杯热可可+一条毛毯+一部治愈电影！','喵呜...听到你这么说，本医生的胡子都垂下来了。不过别担心，猫爪按摩时间到！'],
      anxious: ['焦虑的时候，来看看猫咪视频吧！科学研究表明，看猫可以降低压力荷尔蒙哦。什么？你想看真的猫？我也是！喵~'],
      angry: ['喵！生气的时候就像一只炸毛的猫。不过没关系，炸完毛顺顺就好了。来，跟我说说谁惹你生气了？'],
      happy: ['喵喵喵！你开心的话本医生也要开心得打滚了！快乐的时候就要像猫咪晒太阳一样，好好享受这一刻~'],
      sleep: ['喵~ 睡不着的话，想象自己是一只蜷在温暖窝里的猫咪。闭上眼睛，听着呼噜呼噜的声音...呼噜...呼噜...'],
      default: ['喵~ 本医生在这里听着呢。有什么心事都可以说出来，说出来就会好一半啦！','喵喵~ 你知道吗，愿意表达自己的情绪是一件很勇敢的事。本医生为你骄傲！']
    }
  };

  const aiResponses = responses[ai.id] || responses.warm_sun;
  let category = 'default';
  if (hasSad) category = 'sad';
  else if (hasAnxious) category = 'anxious';
  else if (hasAngry) category = 'angry';
  else if (hasHappy) category = 'happy';
  else if (hasSleep) category = 'sleep';
  const pool = aiResponses[category] || aiResponses.default;
  return pool[Math.floor(Math.random() * pool.length)];
}

function getTimeStr() {
  const now = new Date();
  return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}

// ===== MOOD PAGE =====
function renderMood() {
  const el = document.getElementById('page-mood');
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const recordCount = Object.keys(state.moodRecords).length;
  const todayStr = now.toISOString().split('T')[0];
  const todayMood = state.moodRecords[todayStr];
  const currentMoodEmoji = todayMood !== undefined ? MOODS[todayMood].emoji : '❓';

  const trendData = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const key = d.toISOString().split('T')[0];
    const moodIdx = state.moodRecords[key];
    const dayNames = ['日','一','二','三','四','五','六'];
    trendData.push({ label: dayNames[d.getDay()], mood: moodIdx !== undefined ? moodIdx : -1, date: d.getDate() });
  }

  let html = `
    <div class="mood-summary">
      <h3>📊 心情概览</h3>
      <div class="mood-stats">
        <div class="mood-stat"><div class="stat-num">${currentMoodEmoji}</div><div class="stat-label">今日心情</div></div>
        <div class="mood-stat"><div class="stat-num">${recordCount}</div><div class="stat-label">记录天数</div></div>
        <div class="mood-stat"><div class="stat-num">${getStreakCount()}</div><div class="stat-label">连续记录</div></div>
      </div>
    </div>
    <div class="mood-calendar">
      <div class="cal-header"><h4>${year}年${monthNames[month]}</h4></div>
      <div class="cal-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cal-days">
  `;
  for (let i = 0; i < firstDay; i++) { html += '<div class="cal-day empty"></div>'; }
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const moodIdx = state.moodRecords[key];
    const isToday = d === today;
    const moodEmoji = moodIdx !== undefined ? MOODS[moodIdx].emoji : '';
    html += `<div class="cal-day ${isToday ? 'today' : ''}" onclick="${moodIdx !== undefined ? '' : `recordMoodForDay('${key}')`}"><span class="day-mood">${moodEmoji}</span><span>${d}</span></div>`;
  }
  html += `</div></div>
    <div class="mood-trend">
      <h4>📈 近7天心情趋势</h4>
      <div class="trend-chart">
  `;
  trendData.forEach(t => {
    const mood = t.mood >= 0 ? MOODS[t.mood] : null;
    const height = mood ? (40 + Math.random() * 60) : 15;
    const color = mood ? mood.color : '#E8E5F0';
    const emoji = mood ? mood.emoji : '·';
    html += `<div class="trend-bar"><div class="bar-emoji">${emoji}</div><div class="bar" style="height:${height}%;background:${color}"></div><div class="bar-label">${t.label}</div></div>`;
  });
  html += `</div></div>
    <div class="card" style="text-align:center;">
      <h4 style="font-size:15px;font-weight:600;margin-bottom:8px;">🌱 记录今天的心情</h4>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;">点击选择你此刻的心情</p>
      <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
  `;
  MOODS.forEach((m, i) => {
    html += `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px;border-radius:12px;transition:all 0.2s;" onclick="recordMoodNow(${i})" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='transparent'"><span style="font-size:28px;">${m.emoji}</span><span style="font-size:11px;color:var(--text-light);">${m.label}</span></div>`;
  });
  html += '</div></div>';
  el.innerHTML = html;
}

function recordMoodNow(moodIdx) {
  const today = new Date().toISOString().split('T')[0];
  state.moodRecords[today] = moodIdx;
  saveState(); renderMood();
  showToast(`已记录今日心情：${MOODS[moodIdx].emoji} ${MOODS[moodIdx].label}`);
}

function recordMoodForDay(dateKey) {
  const body = document.getElementById('modalBody');
  let html = `<h3 style="font-size:16px;font-weight:600;margin-bottom:16px;text-align:center;">记录 ${dateKey} 的心情</h3><div class="mood-selector">`;
  MOODS.forEach((m, i) => {
    html += `<div class="mood-option" onclick="saveMoodForDay('${dateKey}', ${i})"><div class="mood-emoji">${m.emoji}</div><div class="mood-label">${m.label}</div></div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function saveMoodForDay(dateKey, moodIdx) {
  state.moodRecords[dateKey] = moodIdx;
  saveState(); closeModal(); renderMood();
  showToast(`已记录心情：${MOODS[moodIdx].emoji} ${MOODS[moodIdx].label}`);
}

function getStreakCount() {
  let streak = 0;
  const now = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const key = d.toISOString().split('T')[0];
    if (state.moodRecords[key] !== undefined) streak++;
    else break;
  }
  return streak;
}

// ===== UTILITIES =====
function closeModal(event) {
  if (event && event.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
}

function viewImage(src) {
  document.getElementById('viewerImage').src = src;
  document.getElementById('imageViewer').classList.add('show');
}

function closeImageViewer() {
  document.getElementById('imageViewer').classList.remove('show');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}
