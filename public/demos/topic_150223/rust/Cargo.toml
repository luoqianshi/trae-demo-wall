[package]
name = "trae_geo_core"
version = "0.1.0"
edition = "2021"
description = "TraeGeo - Native CAD Geometry Kernel Core (Rust Layer)"
license = "MIT"

[lib]
name = "trae_geo_core"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
libc = "0.2"
bytemuck = "1.14"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true