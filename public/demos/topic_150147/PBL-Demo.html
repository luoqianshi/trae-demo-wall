<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBL K-12 项目制学习平台 - 交互式 Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1a1a2e; background: #f0f2f5; }

/* ====== 导航栏 ====== */
.navbar { background: #fff; border-bottom: 1px solid #e8e8e8; position: sticky; top: 0; z-index: 100; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
.navbar .logo { font-size: 18px; font-weight: 700; color: #4361ee; text-decoration: none; }
.navbar .nav-links { display: flex; gap: 8px; }
.navbar .nav-links a { padding: 6px 16px; border-radius: 6px; text-decoration: none; color: #595959; font-size: 14px; cursor: pointer; }
.navbar .nav-links a:hover, .navbar .nav-links a.active { background: #f0f4ff; color: #4361ee; }
.navbar .user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #595959; }
.navbar .avatar { width: 32px; height: 32px; border-radius: 50%; background: #4361ee; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }

/* ====== 主体 ====== */
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* ====== 页面标题 ====== */
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; }
.page-header p { color: #8c8c8c; font-size: 14px; margin-top: 4px; }

/* ====== 统计卡片 ====== */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: #fff; border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 16px; }
.stat-card .icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; flex-shrink: 0; }
.stat-card .info .num { font-size: 28px; font-weight: 700; color: #1a1a2e; }
.stat-card .info .label { font-size: 13px; color: #8c8c8c; margin-top: 2px; }

/* ====== 筛选栏 ====== */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.filter-btn { padding: 6px 16px; border-radius: 16px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; font-size: 13px; color: #595959; transition: all 0.2s; }
.filter-btn:hover { border-color: #4361ee; color: #4361ee; }
.filter-btn.active { background: #4361ee; color: #fff; border-color: #4361ee; }

/* ====== 任务网格 ====== */
.task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
.task-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
.task-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
.task-card .cover { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 48px; position: relative; }
.task-card .cover .tag { position: absolute; top: 10px; left: 10px; padding: 2px 10px; border-radius: 10px; font-size: 11px; color: #fff; background: rgba(0,0,0,0.4); }
.task-card .body { padding: 16px; }
.task-card .body h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.task-card .body .desc { font-size: 13px; color: #8c8c8c; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task-card .body .meta { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; color: #bfbfbf; }
.task-card .body .meta span { display: flex; align-items: center; gap: 4px; }

/* ====== 详情弹窗 ====== */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; padding: 24px; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 16px; max-width: 800px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal-header { padding: 24px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; }
.modal-header h2 { font-size: 22px; font-weight: 700; }
.modal-header .close { background: none; border: none; font-size: 24px; cursor: pointer; color: #8c8c8c; padding: 4px; line-height: 1; }
.modal-body { padding: 20px 24px 24px; }
.modal-body .banner { height: 180px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 60px; margin-bottom: 20px; }
.modal-body .section-title { font-size: 16px; font-weight: 600; margin: 20px 0 10px; color: #1a1a2e; }
.modal-body .section-title:first-child { margin-top: 0; }
.modal-body p, .modal-body li { font-size: 14px; color: #595959; line-height: 1.8; }

/* ====== 步骤列表 ====== */
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 8px; background: #fafafa; border: 1px solid #f0f0f0; }
.step .num { width: 28px; height: 28px; border-radius: 50%; background: #4361ee; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.step .content { flex: 1; }
.step .content .title { font-weight: 600; font-size: 14px; }
.step .content p { font-size: 13px; color: #8c8c8c; margin-top: 2px; }

/* ====== 提交区域 ====== */
.submit-area { background: #f0f4ff; border: 1px dashed #4361ee; border-radius: 10px; padding: 20px; text-align: center; margin-top: 16px; }
.submit-area .btn { padding: 10px 32px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; font-weight: 600; }
.submit-area .btn-primary { background: #4361ee; color: #fff; }
.submit-area .btn-primary:hover { background: #3451d1; }

/* ====== 成功弹窗 ====== */
.success-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; justify-content: center; align-items: center; }
.success-overlay.show { display: flex; }
.success-modal { background: #fff; border-radius: 16px; padding: 40px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.success-modal .check { width: 64px; height: 64px; border-radius: 50%; background: #06d6a0; color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.success-modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.success-modal p { color: #8c8c8c; font-size: 14px; margin-bottom: 20px; }
.success-modal .btn { padding: 10px 32px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; font-weight: 600; }
.success-modal .btn-primary { background: #4361ee; color: #fff; }

/* ====== 证书预览 ====== */
.cert-preview { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-radius: 12px; padding: 32px; color: #fff; margin-top: 16px; text-align: center; }
.cert-preview h3 { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: 4px; }
.cert-preview .sub { color: #a8b2d1; font-size: 13px; margin-bottom: 16px; }
.cert-preview .name { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.cert-preview .project { font-size: 15px; color: #a8b2d1; margin-bottom: 20px; }
.cert-preview .line { width: 60px; height: 2px; background: #4361ee; margin: 0 auto; }
.cert-preview .badge { display: inline-block; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 16px; font-size: 12px; margin-top: 8px; }

/* ====== 标签颜色 ====== */
.cat-science { background: linear-gradient(135deg, #4361ee, #3a56d4); }
.cat-nature { background: linear-gradient(135deg, #06d6a0, #05b88a); }
.cat-creative { background: linear-gradient(135deg, #ef476f, #d63d62); }
.cat-programming { background: linear-gradient(135deg, #7209b7, #5f07a0); }
.cat-humanities { background: linear-gradient(135deg, #118ab2, #0e7a9e); }
.cat-life { background: linear-gradient(135deg, #e63946, #cc3340); }

/* ====== 响应式 ====== */
@media (max-width: 768px) {
  .container { padding: 16px; }
  .task-grid { grid-template-columns: 1fr; }
  .modal { max-height: 90vh; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .navbar .nav-links a { font-size: 13px; padding: 4px 10px; }
}

/* ====== 颜色 ====== */
.bg-blue { background: #e8f0fe; }
.bg-green { background: #e6faf5; }
.bg-orange { background: #fef0ef; }
.bg-purple { background: #f3e8ff; }
.bg-teal { background: #e6f7fb; }
.bg-red { background: #fde8ea; }
</style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <a class="logo" href="#" onclick="showPage('home')">PBL 项目学习</a>
  <div class="nav-links">

<div class="container">

  <!-- ====== 首页 ====== -->

</div>

<!-- 任务详情弹窗 -->
<div class="modal-overlay" id="task-modal">

<div class="success-overlay" id="success-modal">

<script>
// ====== 模拟数据 ======
const tasks = [
  { id: 1, title: '火山喷发实验', category: 'science', catLabel: '科学实验', difficulty: '初级', grade: '3-6年级', time: '45分钟', desc: '用小苏打和醋模拟火山喷发的化学反应，了解酸碱中和的原理。', coverBg: 'bg-blue', coverEmoji: '&#127755;', steps: ['准备小苏打、醋、红色色素和火山模型', '将小苏打放入火山口', '加入红色色素调色', '倒入醋观察反应', '记录实验现象并拍照'] },
  { id: 2, title: '水质检测员', category: 'science', catLabel: '科学实验', difficulty: '中级', grade: '4-8年级', time: '2小时', desc: '采集不同水源样本，用试纸检测pH值、硬度等指标，分析水质差异。', coverBg: 'bg-blue', coverEmoji: '&#128300;', steps: ['准备水质检测工具包', '采集3个不同水源样本', '用试纸检测各项指标', '记录数据对比分析', '撰写水质检测报告'] },
  { id: 3, title: '植物毛细现象', category: 'science', catLabel: '科学实验', difficulty: '初级', grade: '1-4年级', time: '30分钟', desc: '用纸巾和彩色水观察植物的毛细现象，了解植物是如何喝水的。', coverBg: 'bg-blue', coverEmoji: '&#127793;', steps: ['准备透明杯子、纸巾和色素', '将纸巾卷成条状', '在杯中加入有色水', '将纸巾一端放入水中观察', '记录水位上升过程'] },
  { id: 4, title: '昆虫观察日记', category: 'nature', catLabel: '自然探索', difficulty: '初级', grade: '2-5年级', time: '7天', desc: '选择一种昆虫，连续观察一周并记录它的外形、行为和习性变化。', coverBg: 'bg-green', coverEmoji: '&#128027;', steps: ['选择观察对象（蚂蚁/蜗牛/瓢虫）', '准备观察工具（放大镜、记录本）', '每天固定时间观察记录', '拍照或画图记录外形', '整理观察日记'] },
  { id: 5, title: '生态瓶制作', category: 'nature', catLabel: '自然探索', difficulty: '中级', grade: '4-7年级', time: '3天', desc: '制作一个密封的微型生态系统，观察植物、微生物和水的循环。', coverBg: 'bg-green', coverEmoji: '&#127754;', steps: ['准备透明玻璃瓶、小石子、水草', '铺设底砂和石子层', '种植水草并加水', '放入小型水生生物', '密封后观察生态变化'] },
  { id: 6, title: '星空观测手册', category: 'nature', catLabel: '自然探索', difficulty: '中级', grade: '5-8年级', time: '7天', desc: '连续一周观察夜空，认识主要星座，记录月亮相位变化。', coverBg: 'bg-green', coverEmoji: '&#127775;', steps: ['准备星空图和手电筒', '选择开阔的观测点', '每晚8点观察记录', '识别3个以上星座', '绘制月相变化图'] },
  { id: 7, title: '纸桥承重挑战', category: 'creative', catLabel: '创意制作', difficulty: '初级', grade: '3-6年级', time: '1小时', desc: '只用纸和胶水搭建一座桥，测试它能承受多少枚硬币的重量。', coverBg: 'bg-orange', coverEmoji: '&#127759;', steps: ['准备A4纸、胶水和硬币', '设计桥的结构图纸', '按要求搭建纸桥', '逐枚增加硬币测试承重', '记录并优化设计方案'] },
  { id: 8, title: '降落伞制作', category: 'creative', catLabel: '创意制作', difficulty: '初级', grade: '2-5年级', time: '45分钟', desc: '用塑料袋、线和重物制作降落伞，探究空气阻力对下落速度的影响。', coverBg: 'bg-orange', coverEmoji: '&#9729;', steps: ['准备塑料袋、棉线和小重物', '裁剪降落伞伞面', '连接伞绳和重物', '从不同高度测试下落', '记录下落时间并改进'] },
  { id: 9, title: 'Scratch打砖块', category: 'programming', catLabel: '编程入门', difficulty: '中级', grade: '4-8年级', time: '2小时', desc: '用Scratch编写一个打砖块小游戏，学习条件判断和碰撞检测。', coverBg: 'bg-purple', coverEmoji: '&#128187;', steps: ['创建角色和背景', '编写挡板移动逻辑', '实现球的反弹碰撞', '设计砖块消除规则', '添加计分和关卡系统'] },
  { id: 10, title: '古诗词里的中国', category: 'humanities', catLabel: '人文社科', difficulty: '中级', grade: '3-6年级', time: '3天', desc: '选择一首古诗词，研究它的创作背景、作者故事，用手抄报呈现。', coverBg: 'bg-teal', coverEmoji: '&#128214;', steps: ['选择一首喜欢的古诗词', '查阅作者生平和创作背景', '理解诗词意境和修辞手法', '设计手抄报版面', '图文并茂完成展示'] },
  { id: 11, title: '社区环保调查', category: 'life', catLabel: '生活实践', difficulty: '中级', grade: '4-7年级', time: '5天', desc: '调查所在社区的垃圾分类情况，提出改进建议并制作宣传海报。', coverBg: 'bg-red', coverEmoji: '&#127795;', steps: ['设计调查问卷', '实地走访社区垃圾分类点', '统计分类准确率', '分析存在的问题', '制作环保宣传海报'] },
  { id: 12, title: '非遗传承人', category: 'humanities', catLabel: '人文社科', difficulty: '中级', grade: '4-9年级', time: '14天', desc: '研究一项非物质文化遗产（剪纸/皮影/扎染等），学习并制作自己的作品。', coverBg: 'bg-teal', coverEmoji: '&#127912;', steps: ['选择一项非遗技艺', '查阅资料了解历史渊源', '准备材料和工具', '跟随教程动手制作', '展示作品并讲解文化内涵'] },
];

const categories = [
  { value: 'all', label: '全部' },
  { value: 'science', label: '科学实验' },
  { value: 'nature', label: '自然探索' },
  { value: 'creative', label: '创意制作' },
  { value: 'programming', label: '编程入门' },
  { value: 'humanities', label: '人文社科' },
  { value: 'life', label: '生活实践' },
];

const submissions = [
  { id: 1, title: '火山喷发实验', status: '已评分', score: 92, feedback: '实验步骤清晰，观察记录细致，建议补充反应方程式。', date: '2026-07-10' },
  { id: 2, title: '昆虫观察日记', status: '已评分', score: 88, feedback: '观察持续完整，绘图精美，建议增加行为分析。', date: '2026-07-08' },
  { id: 3, title: '纸桥承重挑战', status: '已评分', score: 95, feedback: '结构设计巧妙，承重测试数据翔实，非常有创意！', date: '2026-07-05' },
];

// ====== 渲染函数 ======
let currentFilter = 'all';

function renderFilters() {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = categories.map(c =>
    `<button class="filter-btn ${c.value === currentFilter ? 'active' : ''}" onclick="setFilter('${c.value}')">${c.label}</button>`
  ).join('');
}

function renderTasks() {
  const grid = document.getElementById('task-grid');
  const filtered = currentFilter === 'all' ? tasks : tasks.filter(t => t.category === currentFilter);
  grid.innerHTML = filtered.map(t => {
    const cat = categories.find(c => c.value === t.category);
    return `<div class="task-card" onclick="openTask(${t.id})">
      <div class="cover ${t.coverBg}">${t.coverEmoji}<span class="tag">${t.catLabel}</span></div>
      <div class="body">
        <h3>${t.title}</h3>
        <div class="desc">${t.desc}</div>
        <div class="meta">
          <span>${t.difficulty}</span>
          <span>${t.grade}</span>
          <span>${t.time}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderSubmissions() {
  const list = document.getElementById('submissions-list');
  list.innerHTML = submissions.map(s => `
    <div style="background:#fff;border-radius:10px;padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="font-size:16px;font-weight:600">${s.title}</h3>
        <span style="font-size:13px;color:#06d6a0;font-weight:600">${s.score}分</span>
      </div>
      <div style="margin-top:8px;font-size:13px;color:#8c8c8c">
        <span>${s.status}</span>
        <span style="margin-left:12px">${s.date}</span>
      </div>
      <div style="margin-top:8px;padding:10px;background:#f8f9fc;border-radius:6px;font-size:13px;color:#595959">
        ${s.feedback}
      </div>
    </div>
  `).join('');
}

function renderCerts() {
  const list = document.getElementById('cert-list');
  const certs = [
    { name: '张小明', project: '火山喷发实验', date: '2026-07-10', type: '优秀贡献者证书' },
    { name: '张小明', project: '昆虫观察日记', date: '2026-07-08', type: '项目贡献证书' },
    { name: '张小明', project: '纸桥承重挑战', date: '2026-07-05', type: '实践证明' },
  ];
  list.innerHTML = certs.map(c => `
    <div class="cert-preview">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3>PBL</h3>
        <span class="badge">${c.type}</span>
      </div>
      <div class="line"></div>
      <div class="name">${c.name}</div>
      <div class="project">完成项目: ${c.project}</div>
      <div style="font-size:12px;color:#a8b2d1;margin-top:12px">颁发日期: ${c.date}</div>
    </div>
  `).join('');
}

// ====== 页面切换 ======
function showPage(page) {
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
  document.querySelectorAll('.container > div').forEach(d => d.style.display = 'none');
  if (page === 'home') {
    document.getElementById('page-home').style.display = 'block';
    document.querySelector('.nav-links a:nth-child(1)').classList.add('active');
  } else if (page === 'submissions') {
    document.getElementById('page-submissions').style.display = 'block';
    document.querySelector('.nav-links a:nth-child(2)').classList.add('active');
    renderSubmissions();
  } else if (page === 'cert') {
    document.getElementById('page-cert').style.display = 'block';
    document.querySelector('.nav-links a:nth-child(3)').classList.add('active');
    renderCerts();
  }
}

// ====== 筛选 ======
function setFilter(value) {
  currentFilter = value;
  renderFilters();
  renderTasks();
}

// ====== 弹窗 ======
let currentTaskId = null;

function openTask(id) {
  currentTaskId = id;
  const t = tasks.find(x => x.id === id);
  document.getElementById('modal-title').textContent = t.title;
  document.getElementById('modal-body').innerHTML = `
    <div class="banner ${t.coverBg}" style="font-size:60px">${t.coverEmoji}</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <span style="padding:2px 8px;border-radius:4px;font-size:12px;background:#f0f0f0;color:#595959">${t.catLabel}</span>
      <span style="padding:2px 8px;border-radius:4px;font-size:12px;background:#f0f0f0;color:#595959">${t.difficulty}</span>
      <span style="padding:2px 8px;border-radius:4px;font-size:12px;background:#f0f0f0;color:#595959">${t.grade}</span>
    </div>
    <p>${t.desc}</p>
    <div class="section-title">项目步骤</div>
    <div class="steps">${t.steps.map((s, i) => `
      <div class="step">
        <div class="num">${i + 1}</div>
        <div class="content"><div class="title">${s}</div></div>
      </div>
    `).join('')}</div>
    <div class="section-title">提交作品</div>
    <div class="submit-area">
      <p style="font-size:14px;color:#595959;margin-bottom:12px">完成项目后，上传你的成果吧</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <label style="padding:10px 20px;border-radius:8px;border:1px solid #d9d9d9;background:#fff;cursor:pointer;font-size:14px">选择文件</label>
        <button class="btn btn-primary" onclick="submitTask()">提交作品</button>
      </div>
    </div>
  `;
  document.getElementById('task-modal').classList.add('show');
}

function closeModal() {
  document.getElementById('task-modal').classList.remove('show');
}

function submitTask() {
  closeModal();
  setTimeout(() => {
    document.getElementById('success-modal').classList.add('show');
  }, 300);
}

function closeSuccess() {
  document.getElementById('success-modal').classList.remove('show');
}

// ====== 点击背景关闭弹窗 ======
document.getElementById('task-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('success-modal').addEventListener('click', function(e) {
  if (e.target === this) closeSuccess();
});

// ====== 初始化 ======
renderFilters();
renderTasks();
</script>
</body>
</html>
