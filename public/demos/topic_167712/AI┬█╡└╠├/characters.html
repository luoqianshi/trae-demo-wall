<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色管理 · AI论道堂</title>
  <link rel="stylesheet" href="assets/styles/main.css">
  <style>
    body { background: var(--paper-cream); }

    .chars-page { padding-top: 72px; }

    /* ====== 顶部Hero ====== */
    .chars-hero {
      background: linear-gradient(135deg, var(--ink-black) 0%, var(--ink-deep) 100%);
      color: var(--paper-cream);
      padding: 64px 32px 48px;
      position: relative;
      overflow: hidden;
    }

    .chars-hero::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(201, 55, 86, 0.2), transparent 70%);
      border-radius: 50%;
    }

    .chars-hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(200, 169, 106, 0.15), transparent 70%);
      border-radius: 50%;
    }

    .chars-hero-inner {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .chars-hero-left { flex: 1; }

    .chars-hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .chars-hero-title {
      font-family: var(--font-display);
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .chars-hero-desc {
      color: rgba(244, 237, 224, 0.7);
      font-size: 16px;
      max-width: 500px;
      line-height: 1.8;
    }

    .chars-hero-actions {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    /* ====== 统计条 ====== */
    .stats-bar {
      background: var(--paper-light);
      border-bottom: 1px solid rgba(26, 24, 20, 0.08);
      padding: 24px 32px;
    }

    .stats-bar-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
    }

    .stat-block {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 24px;
      color: var(--paper-cream);
      flex-shrink: 0;
    }

    .stat-info { flex: 1; }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      color: var(--ink-black);
      line-height: 1;
    }

    .stat-label {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    /* ====== Tab 切换 ====== */
    .chars-tabs {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 32px 0;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid rgba(26, 24, 20, 0.08);
    }

    .chars-tab {
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-soft);
      cursor: pointer;
      transition: all 0.3s var(--ease-ink);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chars-tab:hover { color: var(--ink-black); }

    .chars-tab.active {
      color: var(--vermillion);
      border-bottom-color: var(--vermillion);
    }

    .chars-tab-count {
      padding: 2px 8px;
      background: rgba(26, 24, 20, 0.06);
      border-radius: 10px;
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .chars-tab.active .chars-tab-count {
      background: rgba(201, 55, 86, 0.15);
      color: var(--vermillion);
    }

    /* ====== 角色卡网格 ====== */
    .chars-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 32px 96px;
    }

    .chars-tab-content { display: none; }
    .chars-tab-content.active { display: block; animation: fadeIn 0.4s; }

    .chars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* 角色卡 */
    .char-manage-card {
      background: var(--paper-light);
      border: 1px solid rgba(26, 24, 20, 0.08);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.4s var(--ease-ink);
      position: relative;
      cursor: pointer;
    }

    .char-manage-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-card);
      border-color: rgba(201, 55, 86, 0.2);
    }

    .char-card-banner {
      height: 80px;
      position: relative;
      overflow: hidden;
    }

    .char-card-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.2));
    }

    .char-card-banner-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.15;
      background-image:
        radial-gradient(circle at 20% 50%, white 2px, transparent 2px),
        radial-gradient(circle at 60% 30%, white 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, white 2px, transparent 2px);
      background-size: 60px 60px;
    }

    .char-card-body {
      padding: 0 24px 24px;
      position: relative;
    }

    .char-card-avatar-wrap {
      position: relative;
      margin-top: -36px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .char-card-avatar {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 38px;
      color: var(--paper-cream);
      border: 3px solid var(--paper-light);
      box-shadow: var(--shadow-soft);
      position: relative;
    }

    .char-card-avatar::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 13px;
      pointer-events: none;
    }

    .char-card-tone {
      padding: 4px 10px;
      background: rgba(26, 24, 20, 0.06);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }

    .char-card-name {
      font-family: var(--font-title);
      font-size: 22px;
      font-weight: 700;
      color: var(--ink-black);
      margin-bottom: 4px;
    }

    .char-card-author {
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 12px;
      font-family: var(--font-mono);
    }

    .char-card-intro {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.7;
      margin-bottom: 16px;
      min-height: 44px;
    }

    .char-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .char-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(26, 24, 20, 0.08);
    }

    .char-card-stats {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--ink-soft);
    }

    .char-card-stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .char-card-stat-num {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--vermillion);
    }

    .char-card-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 5;
    }

    .char-manage-card:hover .char-card-actions { opacity: 1; }

    .char-action-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(244, 237, 224, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--ink-soft);
      transition: all 0.2s;
    }

    .char-action-btn:hover {
      background: var(--vermillion);
      color: var(--paper-cream);
      transform: scale(1.1);
    }

    .char-action-btn.danger:hover {
      background: #dc2626;
    }

    /* ====== 空状态 ====== */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      grid-column: 1 / -1;
    }

    .empty-state-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(201, 55, 86, 0.08), rgba(200, 169, 106, 0.08));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 56px;
      color: var(--vermillion);
      opacity: 0.5;
    }

    .empty-state-title {
      font-family: var(--font-title);
      font-size: 24px;
      font-weight: 600;
      color: var(--ink-black);
      margin-bottom: 8px;
    }

    .empty-state-desc {
      color: var(--ink-soft);
      margin-bottom: 32px;
    }

    /* ====== 筛选条 ====== */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-size: 13px;
      color: var(--ink-soft);
      margin-right: 8px;
    }

    .filter-chip {
      padding: 6px 14px;
      border: 1px solid rgba(26, 24, 20, 0.1);
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      background: var(--paper-light);
      color: var(--ink-soft);
    }

    .filter-chip:hover {
      border-color: var(--vermillion);
      color: var(--vermillion);
    }

    .filter-chip.active {
      background: var(--ink-black);
      color: var(--paper-cream);
      border-color: var(--ink-black);
    }

    .filter-spacer { flex: 1; }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--paper-light);
      border: 1px solid rgba(26, 24, 20, 0.1);
      border-radius: 20px;
      width: 240px;
    }

    .search-box input {
      flex: 1;
      border: none;
      background: none;
      font-size: 13px;
      outline: none;
      color: var(--ink-black);
    }

    /* ====== 角色详情弹窗 ====== */
    .detail-modal {
      position: fixed;
      inset: 0;
      background: rgba(26, 24, 20, 0.7);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .detail-modal.active { display: flex; animation: fadeIn 0.3s; }

    .detail-content {
      background: var(--paper-light);
      border-radius: var(--radius-xl);
      max-width: 640px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      animation: scaleIn 0.4s var(--ease-ink);
    }

    .detail-header {
      padding: 40px 40px 24px;
      position: relative;
      overflow: hidden;
    }

    .detail-banner-bg {
      position: absolute;
      inset: 0;
      opacity: 0.08;
    }

    .detail-header-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .detail-avatar {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 46px;
      color: var(--paper-cream);
      flex-shrink: 0;
      position: relative;
      box-shadow: var(--shadow-card);
    }

    .detail-avatar::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 17px;
    }

    .detail-name {
      font-family: var(--font-title);
      font-size: 28px;
      font-weight: 700;
      color: var(--ink-black);
    }

    .detail-author {
      font-size: 13px;
      color: var(--ink-soft);
      font-family: var(--font-mono);
      margin-top: 4px;
    }

    .detail-body { padding: 0 40px 40px; }

    .detail-section { margin-bottom: 28px; }

    .detail-section-title {
      font-family: var(--font-title);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-black);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-section-title::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--vermillion);
      border-radius: 2px;
    }

    .detail-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--ink-deep);
    }

    .detail-prompt-box {
      background: var(--ink-black);
      color: var(--paper-cream);
      border-radius: var(--radius-md);
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }

    .detail-actions {
      display: flex;
      gap: 12px;
      padding-top: 24px;
      border-top: 1px solid rgba(26, 24, 20, 0.08);
    }

    .detail-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(26, 24, 20, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s;
    }

    .detail-close:hover {
      background: var(--vermillion);
      color: var(--paper-cream);
      transform: rotate(90deg);
    }

    @media (max-width: 768px) {
      .chars-hero-inner { flex-direction: column; align-items: flex-start; }
      .stats-bar-inner { grid-template-columns: repeat(2, 1fr); gap: 20px; }
      .chars-grid { grid-template-columns: 1fr; }
      .search-box { width: 100%; }
    }
  </style>
</head>
<body class="paper-bg">

  <div class="chars-page">
    <!-- 顶部Hero -->
    <div class="chars-hero">
      <div class="chars-hero-inner">
        <div class="chars-hero-left">
          <div class="chars-hero-eyebrow">CHARACTER MANAGEMENT</div>
          <h1 class="chars-hero-title">角色簿</h1>
          <p class="chars-hero-desc">管理你创建的AI角色，浏览社区精选，导入导出角色卡，让万千灵魂汇聚一堂</p>
        </div>
        <div class="chars-hero-actions">
          <button class="btn btn-ghost" style="color: var(--paper-cream); border-color: var(--paper-cream)" onclick="importCharacter()">
            ↓ 导入角色卡
          </button>
          <a href="creator.html" class="btn btn-primary btn-lg">+ 创建新角色</a>
        </div>
      </div>
    </div>

    <!-- 统计条 -->
    <div class="stats-bar">
      <div class="stats-bar-inner">
        <div class="stat-block">
          <div class="stat-icon" style="background: var(--vermillion)">我</div>
          <div class="stat-info">
            <div class="stat-value" id="myCount">0</div>
            <div class="stat-label">我的角色</div>
          </div>
        </div>
        <div class="stat-block">
          <div class="stat-icon" style="background: var(--gold)">社</div>
          <div class="stat-info">
            <div class="stat-value" id="communityCount">0</div>
            <div class="stat-label">社区角色</div>
          </div>
        </div>
        <div class="stat-block">
          <div class="stat-icon" style="background: var(--ink-blue)">用</div>
          <div class="stat-info">
            <div class="stat-value" id="totalUses">0</div>
            <div class="stat-label">总使用次数</div>
          </div>
        </div>
        <div class="stat-block">
          <div class="stat-icon" style="background: var(--ink-deep)">藏</div>
          <div class="stat-info">
            <div class="stat-value" id="totalLikes">0</div>
            <div class="stat-label">总收藏数</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab切换 -->
    <div class="chars-tabs">
      <div class="chars-tab active" data-tab="mine" onclick="switchTab('mine')">
        我的角色 <span class="chars-tab-count" id="mineTabCount">0</span>
      </div>
      <div class="chars-tab" data-tab="community" onclick="switchTab('community')">
        社区精选 <span class="chars-tab-count" id="communityTabCount">0</span>
      </div>
    </div>

    <!-- 内容区 -->
    <div class="chars-content">
      <!-- 我的角色 -->
      <div class="chars-tab-content active" id="mineContent">
        <div class="filter-bar">
          <span class="filter-label">筛选：</span>
          <div class="filter-chip active" onclick="filterMy('all', this)">全部</div>
          <div class="filter-chip" onclick="filterMy('正式', this)">正式</div>
          <div class="filter-chip" onclick="filterMy('古风', this)">古风</div>
          <div class="filter-chip" onclick="filterMy('casual', this)">casual</div>
          <div class="filter-chip" onclick="filterMy('学术', this)">学术</div>
          <div class="filter-spacer"></div>
          <div class="search-box">
            <span>🔍</span>
            <input type="text" placeholder="搜索角色名..." oninput="searchMy(this.value)">
          </div>
        </div>
        <div class="chars-grid" id="mineGrid"></div>
      </div>

      <!-- 社区角色 -->
      <div class="chars-tab-content" id="communityContent">
        <div class="filter-bar">
          <span class="filter-label">领域：</span>
          <div class="filter-chip active" onclick="filterCommunity('all', this)">全部</div>
          <div class="filter-chip" onclick="filterCommunity('哲学', this)">哲学</div>
          <div class="filter-chip" onclick="filterCommunity('文学', this)">文学</div>
          <div class="filter-chip" onclick="filterCommunity('科技', this)">科技</div>
          <div class="filter-chip" onclick="filterCommunity('历史', this)">历史</div>
          <div class="filter-chip" onclick="filterCommunity('政治', this)">政治</div>
          <div class="filter-spacer"></div>
          <div class="search-box">
            <span>🔍</span>
            <input type="text" placeholder="搜索角色名..." oninput="searchCommunity(this.value)">
          </div>
        </div>
        <div class="chars-grid" id="communityGrid"></div>
      </div>
    </div>
  </div>

  <!-- 角色详情弹窗 -->
  <div class="detail-modal" id="detailModal">
    <div class="detail-content" id="detailContent"></div>
  </div>

  <input type="file" id="importInput" accept=".json" style="display:none">

  <script src="assets/scripts/common.js"></script>
  <script>
    initPage('characters');

    let myFilter = 'all';
    let mySearch = '';
    let communityFilter = 'all';
    let communitySearch = '';

    // 渲染统计
    function renderStats() {
      const mine = CharacterStore.getAll();
      const community = MOCK_CHARACTERS;
      document.getElementById('myCount').textContent = mine.length;
      document.getElementById('communityCount').textContent = community.length;
      document.getElementById('mineTabCount').textContent = mine.length;
      document.getElementById('communityTabCount').textContent = community.length;
      document.getElementById('totalUses').textContent = formatNum(
        mine.reduce((s, c) => s + (c.uses || 0), 0) + community.reduce((s, c) => s + c.uses, 0)
      );
      document.getElementById('totalLikes').textContent = formatNum(
        mine.reduce((s, c) => s + (c.likes || 0), 0) + community.reduce((s, c) => s + c.likes, 0)
      );
    }

    // 渲染角色卡
    function renderCharCard(c, isMine = false) {
      const bannerColors = [
        'linear-gradient(135deg, #c93756, #a52b48)',
        'linear-gradient(135deg, #c8a96a, #a08846)',
        'linear-gradient(135deg, #3d5a6c, #2d4456)',
        'linear-gradient(135deg, #2d2820, #1a1814)',
        'linear-gradient(135deg, #e85d7a, #c93756)'
      ];
      const bannerIdx = (c.name || '').charCodeAt(0) % bannerColors.length;

      return `
        <div class="char-manage-card" onclick="showDetail('${c.id}', ${isMine})">
          <div class="char-card-banner" style="background: ${bannerColors[bannerIdx]}">
            <div class="char-card-banner-pattern"></div>
          </div>
          <div class="char-card-actions">
            <div class="char-action-btn" onclick="event.stopPropagation();useCharacter('${c.id}')" title="使用">▶</div>
            <div class="char-action-btn" onclick="event.stopPropagation();exportCharacter('${c.id}', ${isMine})" title="导出">↓</div>
            ${isMine ? `<div class="char-action-btn danger" onclick="event.stopPropagation();deleteCharacter('${c.id}')" title="删除">×</div>` : `<div class="char-action-btn" onclick="event.stopPropagation();copyCharacter('${c.id}')" title="复制">+</div>`}
          </div>
          <div class="char-card-body">
            <div class="char-card-avatar-wrap">
              <div class="char-card-avatar" style="background: ${c.color}">${c.avatar}</div>
              <div class="char-card-tone">${c.tone || '正式'}</div>
            </div>
            <div class="char-card-name">${c.name}</div>
            <div class="char-card-author">by ${c.author || '匿名'}</div>
            <div class="char-card-intro">${c.intro || '暂无简介'}</div>
            <div class="char-card-tags">
              ${(c.tags || []).slice(0, 4).map(t => `<span class="tag tag-vermillion">${t}</span>`).join('')}
            </div>
            <div class="char-card-footer">
              <div class="char-card-stats">
                <div class="char-card-stat">
                  <span>♥</span>
                  <span class="char-card-stat-num">${formatNum(c.likes || 0)}</span>
                </div>
                <div class="char-card-stat">
                  <span>使用</span>
                  <span class="char-card-stat-num">${formatNum(c.uses || 0)}</span>
                </div>
              </div>
              <div style="font-size: 12px; color: var(--vermillion); font-weight: 500">查看详情 →</div>
            </div>
          </div>
        </div>
      `;
    }

    // 渲染我的角色
    function renderMine() {
      let list = CharacterStore.getAll();
      if (myFilter !== 'all') list = list.filter(c => c.tone === myFilter);
      if (mySearch) list = list.filter(c => c.name.includes(mySearch));

      const grid = document.getElementById('mineGrid');
      if (list.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">墨</div>
            <div class="empty-state-title">${CharacterStore.getAll().length === 0 ? '尚未创建任何角色' : '未找到匹配的角色'}</div>
            <div class="empty-state-desc">${CharacterStore.getAll().length === 0 ? '创建你的第一个AI角色，开启论道之旅' : '试试其他筛选条件'}</div>
            ${CharacterStore.getAll().length === 0 ? '<a href="creator.html" class="btn btn-primary btn-lg">+ 创建第一个角色</a>' : ''}
          </div>
        `;
      } else {
        grid.innerHTML = list.map(c => renderCharCard(c, true)).join('');
      }
    }

    // 渲染社区角色
    function renderCommunity() {
      let list = [...MOCK_CHARACTERS];
      if (communityFilter !== 'all') list = list.filter(c => c.domains.includes(communityFilter));
      if (communitySearch) list = list.filter(c => c.name.includes(communitySearch));

      const grid = document.getElementById('communityGrid');
      if (list.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">寻</div>
            <div class="empty-state-title">未找到匹配的角色</div>
            <div class="empty-state-desc">试试其他筛选条件</div>
          </div>
        `;
      } else {
        grid.innerHTML = list.map(c => renderCharCard(c, false)).join('');
      }
    }

    // Tab切换
    function switchTab(tab) {
      document.querySelectorAll('.chars-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.chars-tab[data-tab="${tab}"]`).classList.add('active');
      document.querySelectorAll('.chars-tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`${tab}Content`).classList.add('active');
    }

    // 筛选
    function filterMy(filter, el) {
      myFilter = filter;
      el.parentElement.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderMine();
    }

    function filterCommunity(filter, el) {
      communityFilter = filter;
      el.parentElement.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderCommunity();
    }

    function searchMy(v) { mySearch = v; renderMine(); }
    function searchCommunity(v) { communitySearch = v; renderCommunity(); }

    // 角色详情
    function showDetail(id, isMine) {
      const list = isMine ? CharacterStore.getAll() : MOCK_CHARACTERS;
      const c = list.find(c => c.id === id);
      if (!c) return;

      const content = document.getElementById('detailContent');
      content.innerHTML = `
        <div class="detail-close" onclick="closeDetail()">×</div>
        <div class="detail-header">
          <div class="detail-banner-bg" style="background: ${c.color}"></div>
          <div class="detail-header-content">
            <div class="detail-avatar" style="background: ${c.color}">${c.avatar}</div>
            <div>
              <div class="detail-name">${c.name}</div>
              <div class="detail-author">by ${c.author || '匿名'} · ${c.tone || '正式'}风格</div>
            </div>
          </div>
        </div>
        <div class="detail-body">
          <div class="detail-section">
            <div class="detail-section-title">角色简介</div>
            <div class="detail-text">${c.intro || '暂无简介'}</div>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">性格标签</div>
            <div class="detail-text" style="display:flex; gap:8px; flex-wrap:wrap">
              ${(c.tags || []).map(t => `<span class="tag tag-vermillion">${t}</span>`).join('')}
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">知识领域</div>
            <div class="detail-text" style="display:flex; gap:8px; flex-wrap:wrap">
              ${(c.domains || []).map(d => `<span class="tag tag-gold">${d}</span>`).join('')}
            </div>
          </div>

          ${c.stance ? `
          <div class="detail-section">
            <div class="detail-section-title">立场倾向</div>
            <div class="detail-text">
              ${Object.entries(c.stance).map(([k, v]) => `
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px">
                  <span style="width:60px; font-weight:500">${k}</span>
                  <div style="flex:1; height:6px; background:rgba(26,24,20,0.08); border-radius:3px; position:relative">
                    <div style="position:absolute; left:0; top:0; height:100%; width:${v}%; background:var(--vermillion); border-radius:3px"></div>
                  </div>
                  <span style="font-family:var(--font-mono); color:var(--vermillion); font-weight:600; width:30px">${v}</span>
                </div>
              `).join('')}
            </div>
          </div>
          ` : ''}

          <div class="detail-section">
            <div class="detail-section-title">System Prompt</div>
            <div class="detail-prompt-box">${c.systemPrompt || c.intro || '暂无Prompt'}</div>
          </div>

          <div class="detail-actions">
            <button class="btn btn-primary" style="flex:1" onclick="useCharacter('${c.id}')">使用此角色</button>
            <button class="btn btn-ghost" onclick="exportCharacter('${c.id}', ${isMine})">导出</button>
            ${!isMine ? `<button class="btn btn-gold" onclick="copyCharacter('${c.id}')">复制到我的</button>` : `<button class="btn btn-ghost" style="color:#dc2626;border-color:#dc2626" onclick="deleteCharacter('${c.id}')">删除</button>`}
          </div>
        </div>
      `;
      document.getElementById('detailModal').classList.add('active');
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.remove('active');
    }

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') closeDetail();
    });

    // 使用角色
    function useCharacter(id) {
      const c = CharacterStore.getById(id) || MOCK_CHARACTERS.find(c => c.id === id);
      if (!c) return;
      if (confirm(`使用「${c.name}」发起一场辩论还是进入群聊？\n确定=辩论会，取消=群聊室`)) {
        location.href = 'debate.html';
      } else {
        location.href = 'chat.html';
      }
    }

    // 删除角色
    function deleteCharacter(id) {
      const c = CharacterStore.getById(id);
      if (!c) return;
      if (confirm(`确定删除角色「${c.name}」？此操作不可撤销。`)) {
        CharacterStore.remove(id);
        renderStats();
        renderMine();
        closeDetail();
      }
    }

    // 导出角色
    function exportCharacter(id, isMine) {
      const list = isMine ? CharacterStore.getAll() : MOCK_CHARACTERS;
      const c = list.find(c => c.id === id);
      if (!c) return;
      const blob = new Blob([JSON.stringify(c, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${c.name}_角色卡.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 复制社区角色到我的
    function copyCharacter(id) {
      const c = MOCK_CHARACTERS.find(c => c.id === id);
      if (!c) return;
      const newC = { ...c, id: genId(), author: '我', likes: 0, uses: 0, createdAt: new Date().toISOString() };
      CharacterStore.save(newC);
      alert(`已将「${c.name}」复制到我的角色`);
      renderStats();
      renderMine();
    }

    // 导入角色卡
    function importCharacter() {
      document.getElementById('importInput').click();
    }

    document.getElementById('importInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (!data.name) throw new Error('缺少名称');
          data.id = genId();
          data.author = data.author || '导入';
          data.likes = data.likes || 0;
          data.uses = data.uses || 0;
          CharacterStore.save(data);
          alert(`角色「${data.name}」导入成功！`);
          renderStats();
          renderMine();
          switchTab('mine');
        } catch (err) {
          alert('导入失败：' + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // 初始化
    renderStats();
    renderMine();
    renderCommunity();
  </script>
</body>
</html>
