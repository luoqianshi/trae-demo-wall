<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>拥抱生活，拥抱AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page no-tab">
    <div class="hero" style="padding:48px 24px 48px;text-align:center;border-radius:0 0 32px 32px;">
      <div style="font-size:56px;margin-bottom:12px;">🌻</div>
      <h1 style="font-size:26px;font-weight:700;margin-bottom:8px;">拥抱生活，拥抱AI</h1>
      <p style="font-size:14px;opacity:0.92;">让每个普通人都有一个真正"懂自己"的伙伴</p>
    </div>

    <div class="card" style="margin-top:-24px;position:relative;">
      <h2 style="font-size:18px;margin-bottom:20px;text-align:center;">欢迎回来</h2>

      <div class="input-group">
        <label>手机号</label>
        <input class="input" type="tel" placeholder="请输入手机号" value="138 8888 8888">
      </div>

      <div class="input-group">
        <label>验证码</label>
        <div style="display:flex;gap:10px;">
          <input class="input" type="text" placeholder="请输入验证码" style="flex:1;">
          <button class="btn btn-ghost" style="white-space:nowrap;" onclick="showToast('验证码已发送')">获取验证码</button>
        </div>
      </div>

      <div style="padding:0 16px;margin-top:20px;">
        <a href="home.html" class="btn btn-primary btn-block">登 录</a>
      </div>

      <div style="text-align:center;margin:24px 0 8px;color:var(--text-muted);font-size:13px;">— 其他方式登录 —</div>

      <div style="display:flex;justify-content:center;gap:24px;padding:8px 0 4px;">
        <div onclick="location.href='home.html'" style="width:48px;height:48px;border-radius:50%;background:#07C160;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;cursor:pointer;">💬</div>
        <div onclick="location.href='home.html'" style="width:48px;height:48px;border-radius:50%;background:#34A853;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;cursor:pointer;">G</div>
        <div onclick="location.href='home.html'" style="width:48px;height:48px;border-radius:50%;background:#FFB347;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;cursor:pointer;">🍎</div>
      </div>

      <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:20px;line-height:1.6;">
        登录即代表同意 <span class="text-primary">《用户协议》</span> 和 <span class="text-primary">《隐私政策》</span>
      </p>
    </div>

    <div style="padding:20px 16px;text-align:center;">
      <p style="font-size:13px;color:var(--text-light);">✨ 登录即可免费使用通用AI</p>
      <p style="font-size:12px;color:var(--text-muted);margin-top:6px;">订阅后可创建专属定制AI，更懂你</p>
    </div>
  </div>
  <script src="js/common.js"></script>
</body>
</html>
