function submitRectification(id){
  var title=document.getElementById('rect-title').value.trim();
  var content=document.getElementById('rect-content').value.trim();
  var date=document.getElementById('rect-date').value;
  if(!title){alert('请填写问题描述');return}

}

function addTrainingCourse(){
  var title=prompt('课程标题：');
  if(!title)return;
  var desc=prompt('课程简介：');
  if(desc===null)return;
  var content=prompt('课程内容：');
  if(content===null)return;
  var duration=prompt('课程时长（如：约15分钟）：','约15分钟');
  if(duration===null)return;
  var level=prompt('课程级别（入门/初级/中级/高级）：','入门');
  if(level===null)return;
  var courses=D.volTrainingCourses||[];
  var newId=courses.length?Math.max.apply(null,courses.map(function(c){return c.id}))+1:1;
  courses.push({id:newId,title:title,desc:desc,content:content,duration:duration,level:level});
  renderVolTraining(document.getElementById('content-area'));
}

  if(title===null)return;
  var desc=prompt('课程简介：',course.desc);
  if(desc===null)return;
  var content=prompt('课程内容：',course.content);

  if(duration===null)return;
  var level=prompt('课程级别：',course.level);
  if(level===null)return;
  course.title=title;course.desc=desc;course.content=content;course.duration=duration;course.level=level;
  renderVolTraining(document.getElementById('content-area'));
}
function deleteTrainingCourse(id){
  if(!confirm('确认删除该课程？'))return;
  D.volTrainingCourses=(D.volTrainingCourses||[]).filter(function(c){return c.id!==id});
  renderVolTraining(document.getElementById('content-area'));
}

    stu:pick(/学生一共\s*(\d+)\s*人/),
    staff:pick(/教职工\s*(\d+)\s*人/),
    chef:pick(/厨师\s*(\d+)\s*人/),

  };

function renderSchoolLunchAlerts(page){
  if(!U||U.role!=='school')return '';

    if(!alerts.length)alerts.push({level:'ok',title:'状态正常',text:okText});
    var colors={danger:['#FFF5F5','#E74C3C'],warn:['#FFFBE6','#F39C12'],ok:['#F0FFF4','#27AE60']};

  }
  if(page==='inventory'){
    var inventoryAlerts=[];
    var safeLine=10;
    var lowStock=inv.filter(function(x){return(+x.qty||0)>0&&(+x.qty||0)<=safeLine});
    if(lowStock.length)add(inventoryAlerts,'danger','低库存',lowStock.slice(0,2).map(function(x){return(x.name||'食材')+'仅剩 '+x.qty+(x.unit||'')}).join('，')+'，请结合本周用餐人数安排补货');
    var expiredItems=inv.filter(function(x){return x.expireDate&&daysFromToday(x.expireDate)<0});
    var expireSoon=inv.filter(function(x){var d=x.expireDate?daysFromToday(x.expireDate):99;return d>=0&&d<=7});
    if(expiredItems.length)add(inventoryAlerts,'danger','过期食材',expiredItems.slice(0,2).map(function(x){return x.name||'食材'}).join('、')+' 已过期，请立即核查处理');
    if(expireSoon.length)add(inventoryAlerts,'warn','临期食材',expireSoon.slice(0,2).map(function(x){return(x.name||'食材')+' '+x.expireDate+' 到期'}).join('，')+'，请优先出库使用');
    var categoryCount=inv.map(function(x){return x.category||x.name}).filter(function(x,i,a){return x&&a.indexOf(x)===i}).length;
    if(categoryCount<3)add(inventoryAlerts,'warn','库存结构','当前库存品类偏少，建议检查主食、肉蛋、蔬菜是否齐全');
    return render('库存安全预警',inventoryAlerts,'当前库存数量和到期情况暂无明显风险');
  }
  if(page==='purchase'){
    var purchaseAlerts=[];
    var highAmountPurchases=purchases.filter(function(p){return(+p.total||0)>=1000});
    if(highAmountPurchases.length)add(purchaseAlerts,'warn','单笔采购金额偏高','有 '+highAmountPurchases.length+' 笔采购金额较高，请确认是否为集中采购，并保留票据');

    if(itemCountRisk.length)add(purchaseAlerts,'warn','采购品类异常','部分采购单食材种类过少或过多，请核对是否符合实际供餐需要');
    var oldPurchases=purchases.filter(function(p){return p.date&&daysFromToday(p.date)<-7&&!p.stocked});
    if(oldPurchases.length)add(purchaseAlerts,'danger','旧采购单未处理','存在超过 7 天仍未入库的采购单，请核对是否遗漏入库或票据');

  }
  if(page==='ingredients'){
    var ingredientAlerts=[];
    var todayRecords=ing.filter(function(i){return i.date===todayStr});
    if(!todayRecords.length)add(ingredientAlerts,'warn','今日未登记','今日暂无入库/出库记录，请确认是否已完成登记');
    var inNames=ing.filter(function(i){return i.type==='in'}).map(function(i){return i.item});
    var outNames=ing.filter(function(i){return i.type==='out'}).map(function(i){return i.item});
    var inWithoutOut=inNames.filter(function(n,i,a){return n&&a.indexOf(n)===i&&outNames.indexOf(n)===-1});

    return render('出入库记录预警',ingredientAlerts,'当前出入库登记和菜谱记录暂无明显风险');

  if(page==='dashboard'){
    var dashboardAlerts=[];

    return render('运营综合预警',dashboardAlerts,'当前学校开餐运营暂无明显风险');
  }

}

function editUnit(id){
  var D=window._data||window.defData();
  var u=(D.units||[]).find(function(x){return x.id===id});
  if(!u)return;
  _editUnitId=id;
  document.getElementById('unit-modal-title').textContent='✏️ 编辑单位';
  document.getElementById('unit-name').value=u.name;
  document.getElementById('mdl-unit').style.display='flex';
}
function saveUnit(){
  var D=window._data||window.defData();
  var name=document.getElementById('unit-name').value.trim();
  if(!name){alert('请输入单位名称');return}
  if(_editUnitId){
    var u=(D.units||[]).find(function(x){return x.id===_editUnitId});
    if(u)u.name=name;
  }else{
    if(!D.nextUnitId)D.nextUnitId=1;
    if(!D.units)D.units=[];
    D.units.push({id:D.nextUnitId++,name:name,createdAt:new Date().toISOString().slice(0,10).replace('T',' ')});
  }
  window.sd(D);
  cm('mdl-unit');
  navigateTo('measureUnit');
}
function deleteUnit(id){
  if(!confirm('确定删除该计量单位？'))return;
  var D=window._data||window.defData();
  D.units=(D.units||[]).filter(function(u){return u.id!==id});
  window.sd(D);
  navigateTo('measureUnit');
}

function showSemesterModal(){
  _editSemesterId=null;
  document.getElementById('semester-modal-title').textContent='📅 新建学期';
  document.getElementById('sem-year').value='2026';
  document.getElementById('sem-term').value='春季';

  document.getElementById('sem-start').value='';
  document.getElementById('sem-end').value='';
  document.getElementById('semester-form-extra').innerHTML='';
  document.getElementById('mdl-semester').style.display='flex';
}

function editSemester(id){
  var D=window._data||window.defData();
  var s=(D.semesters||[]).find(function(x){return x.id===id});
  if(!s)return;
  _editSemesterId=id;
  document.getElementById('semester-modal-title').textContent='✏️ 编辑学期';
  document.getElementById('sem-year').value=s.year;
  document.getElementById('sem-term').value=s.term;
  document.getElementById('sem-name').value=s.name;
  document.getElementById('sem-start').value=s.startDate;
  document.getElementById('sem-end').value=s.endDate;
  document.getElementById('semester-form-extra').innerHTML=s.status==='active'
    ?'<div class="form-group"><label>状态</label><select id="sem-status"><option value="active">进行中</option><option value="done">已结束</option></select></div>'
    :'<input type="hidden" id="sem-status" value="done">';
  document.getElementById('mdl-semester').style.display='flex';
}

function saveSemester(){
  var D=window._data||window.defData();
  var year=document.getElementById('sem-year').value;
  var term=document.getElementById('sem-term').value;
  var name=document.getElementById('sem-name').value.trim();
  var start=document.getElementById('sem-start').value;
  var end=document.getElementById('sem-end').value;
  if(!name){name=year+'年'+term+'学期';document.getElementById('sem-name').value=name}
  if(!start||!end){alert('请填写开始日期和结束日期');return}
  if(_editSemesterId){
    var s=(D.semesters||[]).find(function(x){return x.id===_editSemesterId});
    if(s){
      s.year=year;s.term=term;s.name=name;s.startDate=start;s.endDate=end;
      var stEl=document.getElementById('sem-status');
      if(stEl)s.status=stEl.value;
    }
  }else{
    if(!D.nextSemesterId)D.nextSemesterId=1;
    if(!D.semesters)D.semesters=[];
    D.semesters.push({id:D.nextSemesterId++,year:year,term:term,name:name,startDate:start,endDate:end,status:'active'});
  }
  window.sd(D);
  cm('mdl-semester');
  navigateTo('semesterList');
}

function deleteSemester(id){
  if(!confirm('确定删除该学期？'))return;
  var D=window._data||window.defData();
  D.semesters=(D.semesters||[]).filter(function(s){return s.id!==id});
  window.sd(D);
  navigateTo('semesterList');
}

function assignCommittee(id){
  var s=(D.schools||[]).find(function(x){return x.id===id});
  if(!s){return;}
  var members=COMMITTEE_MEMBERS||[];
  if(!members.length){alert('暂无审委会成员，请先到"审委会管理"添加');return;}
  var lines=members.map(function(m,i){return(i+1)+'. '+m.name+'（'+m.role+'）';});
  var def=members.findIndex(function(m){return m.name===s.assignedCommittee;});
  var input=prompt('请选择审委会成员（输入序号 1-'+members.length+'）：\n'+lines.join('\n'),(def>=0?(def+1):'1'));
  if(input===null){return;}
  var idx=parseInt(input,10);
  if(isNaN(idx)||idx<1||idx>members.length){alert('序号无效');return;}
  var picked=members[idx-1];
  s.assignedCommittee=picked.name;
  s.assignedCommitteeAccount=picked.account;
  s.assignedAt=new Date().toISOString().slice(0,10);
  sd(D);
  ASSIGN_EXPAND[id]=false;
  renderContent();
}
