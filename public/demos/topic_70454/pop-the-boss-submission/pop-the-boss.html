<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pop the Boss!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Press Start 2P',monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#1a1a2e}
  canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
  video{display:none}
  .cabinet{position:fixed;inset:0;z-index:5;pointer-events:none;border:5px solid #222;border-radius:16px;
    box-shadow:inset 0 0 30px rgba(0,0,0,0.4),0 0 0 3px #444,0 0 0 7px #222}
  .scanlines{position:fixed;inset:0;z-index:6;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px)}
  .hud{position:fixed;z-index:10;pointer-events:none}
  .hud>*{pointer-events:auto}

  .top-hud{top:0;left:0;right:0;padding:max(env(safe-area-inset-top,10px),10px) 12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .panel{background:#ffd93d;border:3px solid #222;border-radius:10px;padding:5px 10px;box-shadow:3px 3px 0 #222}
  .score-label{font-size:6px;color:#555}.score-num{font-size:14px;color:#e74c3c;font-weight:bold}
  .level-ind{display:flex;align-items:center;gap:4px;background:#fff;border:3px solid #222;border-radius:8px;padding:4px 8px;box-shadow:3px 3px 0 #222}
  .lv-dot{width:10px;height:10px;border-radius:50%;border:2px solid #222;transition:all .3s}
  .lv-dot.active{background:#ffd93d;box-shadow:0 0 8px rgba(255,217,61,0.6)}
  .lv-dot.done{background:#6bcb77}.lv-dot.future{background:#ddd}
  .lv-conn{width:6px;height:2px;background:#222;border-radius:1px}.lv-conn.done{background:#6bcb77}
  .hp-panel{background:#fff;border:3px solid #222;border-radius:10px;padding:5px 8px;box-shadow:3px 3px 0 #222;min-width:110px}
  .hp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
  .hp-label{font-size:5px;color:#555}.hp-num{font-size:7px;color:#e74c3c}
  .hp-bar{height:10px;background:#eee;border:2px solid #222;border-radius:3px;overflow:hidden}
  .hp-fill{height:100%;background:linear-gradient(90deg,#e74c3c,#ff6b6b);transition:width .4s}

  .bottom-hud{bottom:0;left:0;right:0;padding:0 12px calc(max(env(safe-area-inset-bottom,8px),8px)+10px);display:flex;align-items:flex-end;justify-content:space-between}
  /* Progress panel - redesigned */
  .progress-panel{background:#fff;border:3px solid #222;border-radius:10px;padding:8px 12px;box-shadow:3px 3px 0 #222;display:flex;flex-direction:column;gap:4px;min-width:200px}
  .progress-top{display:flex;justify-content:space-between;align-items:center}
  .progress-label{font-size:6px;color:#555}
  .progress-count{font-size:8px;color:#e74c3c}
  .progress-bar-outer{height:14px;background:#eee;border:2px solid #222;border-radius:4px;overflow:hidden;position:relative}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,#6bcb77,#ffd93d,#ff6b6b);transition:width .3s;border-radius:2px}
  .progress-bar-mark{position:absolute;top:0;bottom:0;width:2px;background:#222;z-index:2}
  .progress-hint{font-size:5px;color:#888;text-align:right}
  .btn-group{display:flex;gap:6px;align-items:flex-end}
  .reset-btn{background:#ff6b6b;border:3px solid #222;border-radius:8px;padding:6px 10px;box-shadow:3px 3px 0 #222;
    color:#fff;font:7px/1 'Press Start 2P',monospace;cursor:pointer;transition:transform .1s}
  .reset-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #222}

  .combo{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);z-index:12;pointer-events:none;opacity:0;transition:opacity .3s}
  .combo.show{opacity:1}
  .combo-text{font-size:18px;color:#ffd93d;text-shadow:3px 3px 0 #222;letter-spacing:1px}

  .overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .4s}
  .overlay.show{opacity:1;pointer-events:auto}
  .overlay-card{background:#ffd93d;border:4px solid #222;border-radius:16px;padding:28px 32px;text-align:center;
    box-shadow:6px 6px 0 #222;max-width:420px;position:relative;
    transform:translate(3px,3px) scale(0.9);transition:transform .5s cubic-bezier(0.34,1.56,0.64,1)}
  .overlay.show .overlay-card{transform:translate(0,0) scale(1)}
  .overlay-emoji{font-size:44px;margin-bottom:10px}
  .overlay-title{font-size:10px;color:#222;line-height:1.8;margin-bottom:6px}
  .overlay-sub{font-size:7px;color:#555;line-height:2.2;margin-bottom:16px}
  .overlay-btn{background:#ff6b6b;border:3px solid #222;border-radius:8px;padding:10px 20px;color:#fff;
    font:9px/1 'Press Start 2P',monospace;cursor:pointer;box-shadow:4px 4px 0 #222;transition:all .1s}
  .overlay-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #222}
  .overlay-btn.green{background:#6bcb77}
  .overlay-btn.blue{background:#4d96ff}

  /* Mode selection cards - ENHANCED */
  .mode-section-title{font-size:8px;color:#222;margin-bottom:10px;text-align:center;line-height:1.8;
    text-shadow:1px 1px 0 rgba(0,0,0,0.1)}
  .mode-cards{display:flex;gap:20px;margin:16px 0;justify-content:center;flex-wrap:wrap}
  .mode-card{background:#fff;border:4px solid #222;border-radius:14px;padding:20px 16px;width:155px;text-align:center;
    box-shadow:5px 5px 0 #222;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
  .mode-card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #222}
  .mode-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #222}
  .mode-card.selected{background:#ffd93d;animation:modePulse .6s ease}
  @keyframes modePulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  .mode-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
  .mode-card.selected::before{background:#ff6b6b}
  .mode-card:not(.selected)::before{background:#ddd}
  .mode-icon{font-size:40px;margin-bottom:10px;display:block;filter:drop-shadow(2px 2px 0 rgba(0,0,0,0.15))}
  .mode-name{font-size:8px;color:#222;margin-bottom:6px;font-weight:bold}
  .mode-desc{font-size:6px;color:#666;line-height:1.8}
  .mode-hint{font-size:5px;color:#4d96ff;line-height:1.8;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:3px}
  .mode-hint-icon{font-size:8px}
  .mode-badge{position:absolute;top:8px;right:8px;background:#ff6b6b;color:#fff;font-size:5px;padding:2px 5px;border-radius:4px;border:2px solid #222}

  .boss-name{color:#e74c3c}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:15;
    background:#fff;border:3px solid #222;border-radius:8px;padding:5px 12px;font:7px/1.4 'Press Start 2P',monospace;
    color:#222;opacity:0;box-shadow:3px 3px 0 #222;transition:all .3s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Camera preview - enhanced with motion overlay */
  .cam-preview{position:fixed;bottom:110px;right:12px;z-index:15;width:160px;height:120px;
    border:4px solid #222;border-radius:12px;overflow:hidden;box-shadow:4px 4px 0 #222;display:none}
  .cam-preview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .cam-preview canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
  .cam-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.75);color:#ffd93d;
    font:5px/1 'Press Start 2P',monospace;text-align:center;padding:4px}
  .cam-rec{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:#ff0000;animation:camBlink 1s infinite}
  @keyframes camBlink{0%,50%{opacity:1}51%,100%{opacity:0}}
  /* Cam motion dot */
  .cam-motion-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#ff6b6b;border:2px solid #fff;
    pointer-events:none;transition:left .08s,top .08s;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,107,107,0.8);z-index:2}
  /* Fist indicator */
  .fist-indicator{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);z-index:15;
    border:3px solid #222;border-radius:10px;padding:6px 14px;box-shadow:3px 3px 0 #222;
    font:6px/1.4 'Press Start 2P',monospace;color:#fff;display:none;text-align:center}
  .fist-indicator.waiting{background:rgba(77,150,255,0.9);animation:fistBounce 1s infinite}
  .fist-indicator.detecting{background:rgba(255,217,61,0.95);color:#222;animation:fistDetect .3s infinite}
  .fist-indicator.cooldown{background:rgba(150,150,150,0.9)}
  @keyframes fistBounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
  @keyframes fistDetect{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
  .fist-cooldown-bar{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);z-index:15;
    width:80px;height:8px;background:#eee;border:2px solid #222;border-radius:4px;overflow:hidden;display:none}
  .fist-cd-fill{height:100%;background:#ff6b6b;transition:width .05s}

  /* Pop count floating text */
  .pop-float{position:fixed;z-index:13;pointer-events:none;font:9px/1 'Press Start 2P',monospace;
    color:#ffd93d;text-shadow:2px 2px 0 #222;opacity:1;transition:all .6s ease-out}

  /* Boss mood indicator */
  .boss-mood{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;
    font-size:24px;opacity:0;transition:opacity .4s;text-shadow:3px 3px 0 rgba(0,0,0,0.3)}
  .boss-mood.show{opacity:0.7}

  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="cam" autoplay playsinline></video>
<div class="cabinet"></div>
<div class="scanlines"></div>

<!-- Top HUD -->
<div class="hud top-hud">
  <div class="panel"><span class="score-label">SCORE</span><br><span class="score-num" id="scoreNum">0</span></div>
  <div class="level-ind" id="lvDots"><div class="lv-dot active"></div><div class="lv-conn"></div><div class="lv-dot future"></div><div class="lv-conn"></div><div class="lv-dot future"></div></div>
  <div class="hp-panel"><div class="hp-top"><span class="hp-label">BOSS HP</span><span class="hp-num" id="hpText">100</span></div><div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div></div>
</div>
<!-- Bottom HUD - redesigned with progress panel -->
<div class="hud bottom-hud">
  <div class="progress-panel">
    <div class="progress-top">
      <span class="progress-label">PROGRESS</span>
      <span class="progress-count" id="progressCount">0 / 0</span>
    </div>
    <div class="progress-bar-outer" id="progressBarOuter">
      <div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
      <div class="progress-bar-mark" id="progressMark" style="left:100%"></div>
    </div>
    <div class="progress-hint" id="progressHint">还需捏爆 0 个过关</div>
  </div>
  <div class="btn-group">
    <button class="reset-btn" id="resetBtn">RESET</button>
  </div>
</div>
<div class="combo" id="combo"><div class="combo-text" id="comboText"></div></div>
<div class="boss-mood" id="bossMood"></div>

<!-- Camera + Fist UI -->
<div class="cam-preview" id="camPreview">
  <video id="camDisplay" autoplay playsinline muted></video>
  <canvas id="motionCanvas"></canvas>
  <div class="cam-rec"></div>
  <div class="cam-motion-dot" id="camMotionDot"></div>
  <div class="cam-label">CAMERA FIST</div>
</div>
<div class="fist-indicator waiting" id="fistIndicator">FIST MODE!<br><span id="fistStatus" style="font-size:5px">对着摄像头挥拳!</span></div>
<div class="fist-cooldown-bar" id="fistCdBar"><div class="fist-cd-fill" id="fistCdFill" style="width:100%"></div></div>

<!-- Start Screen with mode select -->
<div class="overlay show" id="startScreen">
  <div class="overlay-card">
    <div class="overlay-emoji">👾</div>
    <div class="overlay-title">POP THE BOSS!</div>
    <div class="overlay-sub">来打老板啦！哈哈哈！</div>
    <div class="mode-section-title">CHOOSE YOUR WEAPON!</div>
    <div class="mode-cards">
      <div class="mode-card selected" id="modeClick" onclick="selectMode('click')">
        <div class="mode-icon">👆</div>
        <div class="mode-name">手指模式</div>
        <div class="mode-desc">点击捏爆泡泡<br>精准打击！</div>
      </div>
      <div class="mode-card" id="modeFist" onclick="selectMode('fist')">
        <div class="mode-badge">HOT</div>
        <div class="mode-icon">✊</div>
        <div class="mode-name">拳头模式</div>
        <div class="mode-desc">摄像头捕捉挥拳<br>一拳打一片!</div>
        <div class="mode-hint"><span class="mode-hint-icon">📷</span>需要开启摄像头</div>
      </div>
    </div>
    <button class="overlay-btn" id="startBtn">GAME START!</button>
  </div>
</div>

<!-- Level Intro -->
<div class="overlay" id="levelIntro">
  <div class="overlay-card">
    <div class="overlay-emoji" id="introEmoji">😤</div>
    <div class="overlay-title" id="introTitle">STAGE 1</div>
    <div class="overlay-sub" id="introSub"></div>
    <button class="overlay-btn" id="introBtn">FIGHT!</button>
  </div>
</div>

<!-- Level Defeated -->
<div class="overlay" id="levelDefeated">
  <div class="overlay-card">
    <div class="overlay-emoji">🎉</div>
    <div class="defeated-title" style="font-size:11px;color:#222;line-height:2">恭喜你打败了<br><span class="boss-name" id="defeatedName">愚蠢老板 1.0</span>啦！</div>
    <div class="overlay-sub" id="defeatedSub">下一关更凶的老板来了...</div>
    <button class="overlay-btn green" id="defeatedBtn">NEXT →</button>
  </div>
</div>

<!-- Victory -->
<div class="overlay" id="victory">
  <div class="overlay-card">
    <div class="overlay-emoji">🏆</div>
    <div class="victory-title" style="font-size:12px;color:#222;line-height:2">ALL BOSSES DOWN!</div>
    <div class="overlay-sub">所有老板都被你打败了！</div>
    <div class="overlay-sub" id="victoryStats" style="color:#e74c3c"></div>
    <button class="overlay-btn" id="victoryBtn" style="margin-top:4px">PLAY AGAIN</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const scoreNumEl=$('scoreNum'),hpFill=$('hpFill'),hpText=$('hpText');
const progressCount=$('progressCount'),progressBarFill=$('progressBarFill'),progressMark=$('progressMark'),progressHint=$('progressHint');
const comboEl=$('combo'),comboText=$('comboText'),toastEl=$('toast');
const startScreen=$('startScreen'),startBtn=$('startBtn');
const levelIntroEl=$('levelIntro'),introEmoji=$('introEmoji'),introTitle=$('introTitle'),introSub=$('introSub'),introBtn=$('introBtn');
const levelDefeatedEl=$('levelDefeated'),defeatedName=$('defeatedName'),defeatedSub=$('defeatedSub'),defeatedBtn=$('defeatedBtn');
const victoryEl=$('victory'),victoryStats=$('victoryStats'),victoryBtn=$('victoryBtn'),resetBtn=$('resetBtn');
const camPreview=$('camPreview'),camDisplay=$('camDisplay'),motionCanvas=$('motionCanvas'),camMotionDot=$('camMotionDot');
const fistIndicator=$('fistIndicator'),fistStatus=$('fistStatus'),fistCdBar=$('fistCdBar'),fistCdFill=$('fistCdFill');
const bossMood=$('bossMood');

let W,H,dpr,bubbles=[],totalBubbles=0,popCount=0,particles=[],fireworks=[],score=0,combo=0;
let comboTimer=null,gameActive=false,levelDone=false,currentLevel=0,toastTimeout=null;
let selectedMode='click',cameraReady=false,fistCooldown=0,fistCooldownMs=500;
let bossMoodTimer=null;
// Motion detection state
let prevFrame=null,motionCtx=null,motionW=80,motionH=60,motionThreshold=30,motionCooldown=0;

// Mode selection with sound feedback
window.selectMode=function(mode){
  selectedMode=mode;
  $('modeClick').classList.toggle('selected',mode==='click');
  $('modeFist').classList.toggle('selected',mode==='fist');
  playModeSwitchSound();
};

// ===== LEVELS =====
const levels=[
  {name:'STAGE 1',bossName:'愚蠢老板 1.0',emoji:'😤',
   subtitle:'愚蠢老板正在开会！<br>一起来打老板啦！哈哈哈！',
   requiredPct:0.25,bg:'#87ceeb',bgDark:'#5ba3d9',
   bubbleColors:['#e74c3c','#ff6b6b','#ffa07a','#ffd93d','#ff8c42','#e74c3c','#ff6b6b','#ffa07a'],
   skin:'#fdd9b5',hair:'#ffd93d'},
  {name:'STAGE 2',bossName:'愤怒老板 2.0',emoji:'🤬',
   subtitle:'老板暴怒了！继续打！<br>他快撑不住了！哈哈哈！',
   requiredPct:0.30,bg:'#ff9a9e',bgDark:'#fad0c4',
   bubbleColors:['#e74c3c','#c0392b','#ff6b6b','#ff4757','#ff6348','#e74c3c','#ff6b6b','#c0392b'],
   skin:'#fdd9b5',hair:'#e74c3c'},
  {name:'FINAL STAGE',bossName:'终极老板 3.0',emoji:'👹',
   subtitle:'最终Boss！暴走模式！<br>一鼓作气击败他！',
   requiredPct:0.35,bg:'#a18cd1',bgDark:'#fbc2eb',
   bubbleColors:['#6c5ce7','#a29bfe','#fd79a8','#e84393','#6c5ce7','#a29bfe','#fd79a8','#e84393'],
   skin:'#b2bec3',hair:'#6c5ce7'},
];

// ===== AUDIO =====
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}

function playPopSound(){
  if(!audioCtx)return;const now=audioCtx.currentTime;
  const dur=0.04,buf=audioCtx.createBuffer(1,~~(audioCtx.sampleRate*dur),audioCtx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const t=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-t,5)*0.8}
  const s=audioCtx.createBufferSource();s.buffer=buf;
  const f=audioCtx.createBiquadFilter();f.type='highpass';f.frequency.setValueAtTime(4000,now);f.frequency.exponentialRampToValueAtTime(1500,now+dur);f.Q.setValueAtTime(1.2,now);
  const g=audioCtx.createGain();g.gain.setValueAtTime(0.5,now);g.gain.exponentialRampToValueAtTime(0.001,now+dur);
  s.connect(f);f.connect(g);g.connect(audioCtx.destination);s.start(now);s.stop(now+dur);
  const dur2=0.06,buf2=audioCtx.createBuffer(1,~~(audioCtx.sampleRate*dur2),audioCtx.sampleRate),d2=buf2.getChannelData(0);
  for(let i=0;i<d2.length;i++){const t=i/d2.length;d2[i]=(Math.random()*2-1)*Math.pow(1-t,3)*0.35}
  const s2=audioCtx.createBufferSource();s2.buffer=buf2;
  const f2=audioCtx.createBiquadFilter();f2.type='bandpass';f2.frequency.setValueAtTime(2000,now);f2.frequency.exponentialRampToValueAtTime(800,now+dur2);f2.Q.setValueAtTime(2.5,now);
  const g2=audioCtx.createGain();g2.gain.setValueAtTime(0.35,now);g2.gain.exponentialRampToValueAtTime(0.001,now+dur2);
  s2.connect(f2);f2.connect(g2);g2.connect(audioCtx.destination);s2.start(now);s2.stop(now+dur2);
}

// Mode switch click sound
function playModeSwitchSound(){
  if(!audioCtx)return;const now=audioCtx.currentTime;
  const o=audioCtx.createOscillator();o.type='square';o.frequency.setValueAtTime(800,now);o.frequency.setValueAtTime(1000,now+0.03);
  const g=audioCtx.createGain();g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.06);
  o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+0.06);
}

// Milestone ding
function playMilestoneSound(){
  if(!audioCtx)return;const now=audioCtx.currentTime;
  [880,1100,1320].forEach((freq,i)=>{
    const o=audioCtx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(freq,now+i*0.08);
    const g=audioCtx.createGain();g.gain.setValueAtTime(0.1,now+i*0.08);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.2);
    o.connect(g);g.connect(audioCtx.destination);o.start(now+i*0.08);o.stop(now+i*0.08+0.2);
  });
}

// Happy game start - cheerful ascending arpeggio with harmonics
function playStartJingle(){
  if(!audioCtx)return;const now=audioCtx.currentTime;
  const notes=[523,659,784,1047,1319];
  notes.forEach((freq,i)=>{
    const o=audioCtx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(freq,now+i*0.12);

// ENHANCED Punch sound - much more realistic with multi-layer synthesis
function playPunchSound(){
  if(!audioCtx)return;const now=audioCtx.currentTime;
  // Layer 1: Initial impact crack (very short, sharp)
  const dur1=0.015,buf1=audioCtx.createBuffer(1,~~(audioCtx.sampleRate*dur1),audioCtx.sampleRate),d1=buf1.getChannelData(0);
  for(let i=0;i<d1.length;i++){const t=i/d1.length;d1[i]=(Math.random()*2-1)*Math.pow(1-t,8)*1.0}
  const s1=audioCtx.createBufferSource();s1.buffer=buf1;
  const f1=audioCtx.createBiquadFilter();f1.type='highpass';f1.frequency.setValueAtTime(6000,now);f1.frequency.exponentialRampToValueAtTime(2000,now+dur1);
  const g1=audioCtx.createGain();g1.gain.setValueAtTime(0.7,now);g1.gain.exponentialRampToValueAtTime(0.001,now+dur1);
  s1.connect(f1);f1.connect(g1);g1.connect(audioCtx.destination);s1.start(now);s1.stop(now+dur1);

  // Layer 2: Meaty thud (low frequency punch body)
  const dur2=0.12,buf2=audioCtx.createBuffer(1,~~(audioCtx.sampleRate*dur2),audioCtx.sampleRate),d2=buf2.getChannelData(0);
  for(let i=0;i<d2.length;i++){const t=i/d2.length;d2[i]=(Math.random()*2-1)*Math.pow(1-t,3)*0.9}
  const s2=audioCtx.createBufferSource();s2.buffer=buf2;
  const f2=audioCtx.createBiquadFilter();f2.type='lowpass';f2.frequency.setValueAtTime(800,now);f2.frequency.exponentialRampToValueAtTime(100,now+dur2);f2.Q.setValueAtTime(1.5,now);
  const g2=audioCtx.createGain();g2.gain.setValueAtTime(0.6,now);g2.gain.exponentialRampToValueAtTime(0.001,now+dur2);
  s2.connect(f2);f2.connect(g2);g2.connect(audioCtx.destination);s2.start(now);s2.stop(now+dur2);

  // Layer 3: Resonant thump (sine sweep simulates body impact)
  const o=audioCtx.createOscillator();o.type='sine';o.frequency.setValueAtTime(120,now);o.frequency.exponentialRampToValueAtTime(40,now+0.1);
  const g3=audioCtx.createGain();g3.gain.setValueAtTime(0.4,now);g3.gain.exponentialRampToValueAtTime(0.001,now+0.1);
  o.connect(g3);g3.connect(audioCtx.destination);o.start(now);o.stop(now+0.1);

  // Layer 4: Whoosh air displacement
  const dur4=0.08,buf4=audioCtx.createBuffer(1,~~(audioCtx.sampleRate*dur4),audioCtx.sampleRate),d4=buf4.getChannelData(0);
  for(let i=0;i<d4.length;i++){const t=i/d4.length;d4[i]=(Math.random()*2-1)*Math.pow(1-t,2)*0.3}
  const s4=audioCtx.createBufferSource();s4.buffer=buf4;
  const f4=audioCtx.createBiquadFilter();f4.type='bandpass';f4.frequency.setValueAtTime(1500,now);f4.frequency.exponentialRampToValueAtTime(500,now+dur4);f4.Q.setValueAtTime(0.5,now);
  const g4=audioCtx.createGain();g4.gain.setValueAtTime(0.2,now);g4.gain.exponentialRampToValueAtTime(0.001,now+dur4);
  s4.connect(f4);f4.connect(g4);g4.connect(audioCtx.destination);s4.start(now);s4.stop(now+dur4);

  // Layer 5: Skin slap crack
  const dur5=0.03,buf5=audioCtx.createBuffer(1,~~(audioCtx.sampleRate*dur5),audioCtx.sampleRate),d5=buf5.getChannelData(0);
  for(let i=0;i<d5.length;i++){const t=i/d5.length;d5[i]=(Math.random()*2-1)*Math.pow(1-t,6)*0.5}
  const s5=audioCtx.createBufferSource();s5.buffer=buf5;
  const f5=audioCtx.createBiquadFilter();f5.type='highpass';f5.frequency.setValueAtTime(3000,now+0.01);f5.frequency.exponentialRampToValueAtTime(1000,now+0.01+dur5);
  const g5=audioCtx.createGain();g5.gain.setValueAtTime(0,now);g5.gain.linearRampToValueAtTime(0.35,now+0.01);g5.gain.exponentialRampToValueAtTime(0.001,now+0.01+dur5);
  s5.connect(f5);f5.connect(g5);g5.connect(audioCtx.destination);s5.start(now);s5.stop(now+0.01+dur5);
}

// ===== FIREWORK =====
class Firework{
  constructor(x,y){
    this.x=x;this.y=y;this.particles=[];
    const colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#a29bfe','#fd79a8','#ff8c42'];
    for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,spd=2+Math.random()*5;
      this.particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:0.01+Math.random()*0.02,
        size:2+Math.random()*3,color:colors[~~(Math.random()*colors.length)],grav:0.05})}
    this.alive=true;
  }
  update(){let alive=false;this.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=0.98;p.life-=p.decay;if(p.life>0)alive=true});
    this.alive=alive}
  draw(c){this.particles.forEach(p=>{if(p.life<=0)return;c.save();c.globalAlpha=p.life;c.beginPath();
    c.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);c.fillStyle=p.color;c.fill();c.restore()})}
}

// ===== BUBBLE & PARTICLE =====
const S_INTACT=0,S_SQUISH=1,S_POP=2,S_DONE=3;
const BR=18,GAP=4,CELL=BR*2+GAP;
let bcl=levels[0].bubbleColors;

class StarParticle{
  constructor(x,y,color){this.x=x;this.y=y;const a=Math.random()*Math.PI*2,spd=2+Math.random()*5;
    this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd-3;this.life=1;this.decay=0.025+Math.random()*0.03;
    this.size=2+Math.random()*4;this.color=color;this.rot=Math.random()*Math.PI*2;this.rotSpd=(Math.random()-0.5)*0.3}
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.1;this.vx*=0.97;this.life-=this.decay;this.rot+=this.rotSpd}
  draw(c){if(this.life<=0)return;c.save();c.globalAlpha=this.life;c.translate(this.x,this.y);c.rotate(this.rot);
    c.fillStyle=this.color;c.strokeStyle='#222';c.lineWidth=1;const s=this.size*this.life;
    c.beginPath();c.moveTo(0,-s);c.lineTo(s*0.3,-s*0.3);c.lineTo(s,0);c.lineTo(s*0.3,s*0.3);
    c.lineTo(0,s);c.lineTo(-s*0.3,s*0.3);c.lineTo(-s,0);c.lineTo(-s*0.3,-s*0.3);c.closePath();
    c.fill();c.stroke();c.restore()}
}

class Bubble{
  constructor(cx,cy,ci){this.cx=cx;this.cy=cy;this.r=BR;this.ci=ci;this.state=S_INTACT;
    this.sqDur=100;this.popDur=60;this.animStart=0;this.sx=1;this.sy=1;this.op=1;
    this.pp=Math.random()*Math.PI*2;this.eDelay=(cx/W*0.15+cy/H*0.15)*500+Math.random()*150;
    this.eStart=-1;this.entered=false}
  hit(mx,my){if(this.state!==S_INTACT||!this.entered)return false;const dx=mx-this.cx,dy=my-this.cy;return dx*dx+dy*dy<=this.r*this.r}
  pop(ts){this.state=S_SQUISH;this.animStart=ts}
  startEntry(ts){this.eStart=ts}
  update(ts){
    if(!this.entered){if(this.eStart<0)return;const el=ts-this.eStart;if(el>=this.eDelay){
      const t=Math.min((el-this.eDelay)/300,1),e=1-Math.pow(1-t,3);this.sx=e;this.sy=e;this.op=e;
      if(t>=1){this.entered=true;this.sx=1;this.sy=1;this.op=1}}return}
    if(this.state===S_INTACT)return;
    const el=ts-this.animStart,dur=this.state===S_SQUISH?this.sqDur:this.popDur,t=Math.min(el/dur,1);
    if(this.state===S_SQUISH){const e=t*t;this.sx=1+0.35*e;this.sy=1-0.55*e;
      if(t>=1){this.state=S_POP;this.animStart=ts;this.sx=1.35;this.sy=0.45}}
    else{const eo=1-Math.pow(1-t,3);this.sx=1.35+0.05*eo;this.sy=0.45+0.55*eo;this.op=1-eo*0.95;
      if(t>=1){this.state=S_DONE;this.sx=1;this.sy=1;this.op=0}}}
  draw(c,ts){
    if(this.state===S_DONE&&this.entered){c.save();c.translate(this.cx,this.cy);c.beginPath();
      c.arc(0,0,this.r,0,Math.PI*2);c.strokeStyle='rgba(34,34,34,0.12)';c.lineWidth=1.5;c.setLineDash([3,4]);c.stroke();c.setLineDash([]);c.restore();return}
    c.save();c.translate(this.cx,this.cy);let ps=1;
    if(this.state===S_INTACT&&this.entered)ps=1+Math.sin(ts*0.004+this.pp)*0.02;
    c.scale(this.sx*ps,this.sy*ps);c.globalAlpha=this.op;const r=this.r,col=bcl[this.ci%bcl.length];
    c.save();c.globalAlpha=0.2*this.op;c.beginPath();c.ellipse(2,r*0.15,r*0.85,r*0.2,0,0,Math.PI*2);c.fillStyle='#222';c.fill();c.restore();c.globalAlpha=this.op;
    c.beginPath();c.arc(0,0,r,0,Math.PI*2);
    const g=c.createRadialGradient(-r*0.25,-r*0.3,r*0.05,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(0.3,col);g.addColorStop(1,col);
    c.fillStyle=g;c.fill();c.strokeStyle='#222';c.lineWidth=2.5;c.stroke();
    c.beginPath();c.ellipse(-r*0.25,-r*0.3,r*0.35,r*0.2,-0.3,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.6)';c.fill();
    c.beginPath();c.arc(-r*0.28,-r*0.32,r*0.1,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.restore()}
}

// ===== BOSS FACE - Progressive expression from happy to crying =====
function drawBoss(c,ts,dmg){
  const lvl=levels[currentLevel],cx=W/2,cy=H/2;
  const faceR=Math.min(W,H)*0.26,alpha=0.5+dmg*0.35;
  c.save();c.globalAlpha=alpha;c.translate(cx,cy);
  const wob=1+dmg*5;c.translate(Math.sin(ts*0.003)*wob,Math.cos(ts*0.004)*wob*0.6);
  const breath=1+Math.sin(ts*0.004)*0.015;c.scale(breath,breath);
  const skin=lvl.skin,hair=lvl.hair,lw=3;
  const headW=faceR,headH=faceR*1.1;

  // Sweat drops appear as damage increases
  if(dmg>0.3){
    const sweatAlpha=Math.min((dmg-0.3)/0.7,1)*0.8;
    c.save();c.globalAlpha=sweatAlpha;c.fillStyle='#87ceeb';
    // Animated sweat drops
    const sweatY=Math.sin(ts*0.005)*(dmg*8);
    c.beginPath();c.ellipse(headW*0.7,headH*0.2+sweatY,4,6,0.2,0,Math.PI*2);c.fill();
    if(dmg>0.5){c.beginPath();c.ellipse(-headW*0.75,headH*0.15+Math.sin(ts*0.006+1)*5,3,5,-0.2,0,Math.PI*2);c.fill()}
    if(dmg>0.7){c.beginPath();c.ellipse(headW*0.5,headH*0.05+Math.sin(ts*0.007+2)*4,3,4,0,0,Math.PI*2);c.fill()}
    c.restore();
  }

  // Head (rounded square)
  c.beginPath();roundRect(c,-headW,0,headW*2,headH*2,faceR*0.35);
  const hg=c.createRadialGradient(-headW*0.2,headH*0.3,faceR*0.1,0,headH*0.5,faceR*1.5);
  hg.addColorStop(0,'#fff5e0');hg.addColorStop(0.5,skin);hg.addColorStop(1,dk(skin,15));
  c.fillStyle=hg;c.fill();c.strokeStyle='#222';c.lineWidth=lw;c.stroke();

  // Blush appears when getting hurt
  if(dmg>0.4){
    const blushAlpha=Math.min((dmg-0.4)/0.6,1)*0.5;
    c.save();c.globalAlpha=blushAlpha;c.fillStyle='rgba(255,100,100,0.4)';
    c.beginPath();c.ellipse(-headW*0.55,headH*0.7,headW*0.15,headH*0.08,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(headW*0.55,headH*0.7,headW*0.15,headH*0.08,0,0,Math.PI*2);c.fill();
    c.restore();
  }

  // Hair (spiky cartoon)
  c.beginPath();c.moveTo(-headW*0.9,headH*0.15);
  for(let i=0;i<9;i++){const a=-Math.PI*0.85+Math.PI*1.7*(i/8);
    const hx=Math.cos(a)*headW*1.18,hy=headH*0.2+Math.sin(a)*headH*0.95;c.lineTo(hx,hy)}
  c.closePath();c.fillStyle=hair;c.fill();c.strokeStyle='#222';c.lineWidth=lw;c.stroke();
  for(let i=0;i<5;i++){const a=-Math.PI*0.7+Math.PI*1.4*(i/4);
    const sx=Math.cos(a)*headW*1.08,sy=headH*0.2+Math.sin(a)*headH*0.88;
    const ex=Math.cos(a)*headW*1.4,ey=headH*0.2+Math.sin(a)*headH-Math.abs(Math.sin(ts*0.003+i))*4;
    c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.strokeStyle='#222';c.lineWidth=lw-0.5;c.stroke()}

  // Ears
  c.fillStyle=skin;c.strokeStyle='#222';c.lineWidth=2.5;
  c.beginPath();c.ellipse(-headW*1.02,headH*0.45,headW*0.12,headH*0.18,-0.15,0,Math.PI*2);c.fill();c.stroke();
  c.beginPath();c.ellipse(headW*1.02,headH*0.45,headW*0.12,headH*0.18,0.15,0,Math.PI*2);c.fill();c.stroke();

  const eyeY=headH*0.5,eyeX=headW*0.42,eyeR=headH*0.14;

  // ===== EXPRESSION INTERPOLATION =====
  // dmg 0 = happy, dmg 0.5 = worried, dmg 1.0 = crying
  const d=dmg; // 0..1

  // Eyebrows: happy (high arched) → worried (angled inward) → sad (droopy)
  const browAngle=-d*0.5; // from 0 (neutral) to -0.5 (sad)
  const browHeight=d*eyeR*1.5; // lower as damage increases
  const browInward=d*eyeR*0.4; // come together as damage increases

  c.strokeStyle='#222';c.lineWidth=3.5;c.lineCap='round';
  // Left eyebrow
  c.beginPath();
  c.moveTo(-eyeX-eyeR*(1.3-browInward),eyeY-eyeR*(1.8-browHeight*0.5));
  c.quadraticCurveTo(-eyeX,eyeY-eyeR*(2.2-browHeight),-eyeX+eyeR*(1-browInward),eyeY-eyeR*(1.5+browHeight*0.3));
  c.stroke();
  // Right eyebrow
  c.beginPath();
  c.moveTo(eyeX+eyeR*(1.3-browInward),eyeY-eyeR*(1.8-browHeight*0.5));
  c.quadraticCurveTo(eyeX,eyeY-eyeR*(2.2-browHeight),eyeX-eyeR*(1-browInward),eyeY-eyeR*(1.5+browHeight*0.3));
  c.stroke();

  // Eyes: happy (slightly squinted smile shape) → wide (worried) → teary (narrow with tears)
  c.fillStyle='#fff';c.strokeStyle='#222';c.lineWidth=2.5;
  const eyeH=d<0.5?eyeR*(1.1-d*0.6):eyeR*(0.8+d*0.3); // squint → wide → narrow
  const eyeW=eyeR*(1.3+d*0.3);
  // Left eye
  c.beginPath();c.ellipse(-eyeX,eyeY,eyeW,eyeH,0,0,Math.PI*2);c.fill();c.stroke();
  // Right eye
  c.beginPath();c.ellipse(eyeX,eyeY,eyeW,eyeH,0,0,Math.PI*2);c.fill();c.stroke();

  // Pupils: normal → wide → shrunken (crying)
  const pupilR=eyeR*(d<0.5?0.3+d*0.4:0.5-d*0.2);
  // Pupil color darkens
  if(d>0.6){
    c.fillStyle='#e74c3c'; // angry red eyes at high damage
    c.beginPath();c.arc(-eyeX+2,eyeY,eyeR*0.5,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(eyeX+2,eyeY,eyeR*0.5,0,Math.PI*2);c.fill();
  }
  c.fillStyle='#222';
  // Pupils shake when very damaged
  const pShake=d>0.7?Math.sin(ts*0.02)*3:0;
  c.beginPath();c.arc(-eyeX+2+pShake,eyeY+1,pupilR,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(eyeX+2+pShake,eyeY+1,pupilR,0,Math.PI*2);c.fill();

  // Tears when heavily damaged
  if(d>0.6){
    const tearAlpha=Math.min((d-0.6)/0.4,1)*0.8;
    c.save();c.globalAlpha=tearAlpha;c.fillStyle='#87ceeb';
    const tearDrop=Math.sin(ts*0.008)*headH*0.1;
    // Left tear stream
    c.beginPath();c.ellipse(-eyeX+eyeW*0.8,eyeY+eyeH+5+tearDrop,4,8+tearDrop*0.3,0,0,Math.PI*2);c.fill();
    if(d>0.7)c.beginPath();c.ellipse(-eyeX+eyeW*0.5,eyeY+eyeH+15+tearDrop*1.5,3,5,0,0,Math.PI*2);c.fill();
    // Right tear stream
    c.beginPath();c.ellipse(eyeX-eyeW*0.8,eyeY+eyeH+5+tearDrop,4,8+tearDrop*0.3,0,0,Math.PI*2);c.fill();
    if(d>0.7)c.beginPath();c.ellipse(eyeX-eyeW*0.5,eyeY+eyeH+15+tearDrop*1.5,3,5,0,0,Math.PI*2);c.fill();
    c.restore();
  }

  // Mouth: happy smile → flat → worried frown → crying wavy
  const mouthY=headH*0.95;
  c.strokeStyle='#222';c.lineWidth=3;c.lineCap='round';
  c.beginPath();
  if(d<0.3){
    // Happy smile
    c.moveTo(-headW*0.3,mouthY);
    c.quadraticCurveTo(0,mouthY+headH*0.2*(1-d),headW*0.3,mouthY);
    c.stroke();
  }else if(d<0.5){
    // Flat to slight frown
    const frown=(d-0.3)/0.2;
    c.moveTo(-headW*0.3,mouthY);
    c.quadraticCurveTo(0,mouthY+headH*0.2*(1-frown)-headH*0.15*frown,headW*0.3,mouthY);
    c.stroke();
  }else if(d<0.7){
    // Worried open mouth
    const openness=(d-0.5)/0.2;
    c.ellipse(0,mouthY+headH*0.05,headW*0.15,headH*0.06+headH*0.08*openness,0,0,Math.PI*2);
    c.fillStyle='#2c0a0a';c.fill();c.stroke();
  }else{
    // Crying wavy mouth
    const wobble=Math.sin(ts*0.01)*3;
    c.moveTo(-headW*0.3,mouthY+wobble);
    c.quadraticCurveTo(-headW*0.15,mouthY-headH*0.08+wobble,0,mouthY+wobble*0.5);
    c.quadraticCurveTo(headW*0.15,mouthY+headH*0.08+wobble,headW*0.3,mouthY+wobble);
    c.stroke();
    // Open mouth area (crying)
    c.beginPath();c.ellipse(0,mouthY+headH*0.08,headW*0.18,headH*0.1,0,0,Math.PI*2);
    c.fillStyle='#2c0a0a';c.fill();c.strokeStyle='#222';c.lineWidth=2.5;c.stroke();
  }

  // Anger marks (crosses) appear at higher damage
  if(d>0.6){
    c.strokeStyle='#e74c3c';c.lineWidth=2.5;
    const crossAlpha=Math.min((d-0.6)/0.4,1);
    c.save();c.globalAlpha=crossAlpha;
    drawCross(c,-headW*0.75,headH*0.2,faceR*0.08);
    drawCross(c,headW*0.75,headH*0.2,faceR*0.08);
    if(d>0.8){
      drawCross(c,-headW*0.5,headH*0.05,faceR*0.06);
      drawCross(c,headW*0.5,headH*0.05,faceR*0.06);
    }
    c.restore();
  }

  // Nose
  c.beginPath();c.moveTo(0,headH*0.6);c.lineTo(-headW*0.08,headH*0.7);c.lineTo(headW*0.08,headH*0.7);
  c.strokeStyle='#222';c.lineWidth=2.5;c.lineCap='round';c.stroke();
  c.restore();
}

function roundRect(c,x,y,w,h,r){c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y)}
function drawCross(c,x,y,s){c.beginPath();c.moveTo(x-s,y-s*0.6);c.lineTo(x-s*0.2,y);c.lineTo(x-s,y+s*0.6);c.stroke();c.beginPath();c.moveTo(x+s,y-s*0.6);c.lineTo(x+s*0.2,y);c.lineTo(x+s,y+s*0.6);c.stroke()}
function dk(hex,a){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return '#'+[Math.max(0,r-a),Math.max(0,g-a),Math.max(0,b-a)].map(v=>v.toString(16).padStart(2,'0')).join('')}

// ===== CAMERA / FIST MODE WITH MOTION DETECTION =====
async function initCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240},frameRate:{ideal:30}}});
    camDisplay.srcObject=stream;
    // Setup motion canvas (small for performance)
    motionCanvas.width=motionW;motionCanvas.height=motionH;
    motionCtx=motionCanvas.getContext('2d',{willReadFrequently:true});
    // Wait for video to be ready
    await new Promise(r=>{camDisplay.onloadedmetadata=()=>{camDisplay.play();r()}});
    camPreview.style.display='block';cameraReady=true;
    fistIndicator.style.display='block';fistCdBar.style.display='block';
    fistIndicator.className='fist-indicator waiting';
    fistStatus.textContent='对着摄像头挥拳!';
    showToast('摄像头已开启! 挥拳攻击!');
    // Start motion detection loop
    detectMotionLoop();
  }catch(e){cameraReady=false;camPreview.style.display='none';fistIndicator.style.display='none';fistCdBar.style.display='none';
    showToast('摄像头无法使用,切换手指模式');selectedMode='click';
    $('modeClick').classList.add('selected');$('modeFist').classList.remove('selected')}
}

function detectMotionLoop(){
  if(!cameraReady||!camDisplay.videoWidth){requestAnimationFrame(detectMotionLoop);return}
  const vw=camDisplay.videoWidth,vh=camDisplay.videoHeight;
  // Draw current frame to small canvas
  motionCtx.drawImage(camDisplay,0,0,motionW,motionH);
  const currFrame=motionCtx.getImageData(0,0,motionW,motionH);
  if(prevFrame){
    const curr=currFrame.data,prev=prevFrame.data;
    let totalMotion=0,motionX=0,motionY=0,motionPixels=0;
    // Downsample: check every 2nd pixel for speed
    for(let y=0;y<motionH;y+=2){for(let x=0;x<motionW;x+=2){
      const i=(y*motionW+x)*4;
      const dr=Math.abs(curr[i]-prev[i]),dg=Math.abs(curr[i+1]-prev[i+1]),db=Math.abs(curr[i+2]-prev[i+2]);
      const diff=(dr+dg+db)/3;
      if(diff>motionThreshold){
        totalMotion+=diff;motionX+=x;motionY+=y;motionPixels++}}}
    const now=performance.now();
    if(motionPixels>8&&totalMotion/motionPixels>40){
      // Significant motion detected - normalize center position
      const cx=motionX/motionPixels; // 0..motionW
      const cy=motionY/motionPixels; // 0..motionH
      // Mirror X (camera is mirrored) and map to game screen
      const gameX=(1-cx/motionW)*W;
      const gameY=(cy/motionH)*H;
      // Update motion dot position on camera preview
      camMotionDot.style.left=((1-cx/motionW)*100)+'%';
      camMotionDot.style.top=((cy/motionH)*100)+'%';
      // Trigger punch if not in cooldown and game is active
      if(now-motionCooldown>=fistCooldownMs&&gameActive&&!levelDone){
        fistPunchAt(gameX,gameY);
        fistIndicator.className='fist-indicator detecting';
        fistStatus.textContent='HIT!';
        setTimeout(()=>{if(cameraReady){fistIndicator.className='fist-indicator waiting';fistStatus.textContent='对着摄像头挥拳!'}},300);
      }
    }else if(now-motionCooldown<fistCooldownMs){
      fistIndicator.className='fist-indicator cooldown';
      fistStatus.textContent='冷却中...';
    }else{
      fistIndicator.className='fist-indicator waiting';
      fistStatus.textContent='对着摄像头挥拳!';
      camMotionDot.style.left='50%';camMotionDot.style.top='50%';
    }
  }
  prevFrame=currFrame;
  requestAnimationFrame(detectMotionLoop);
}

function fistPunchAt(x,y){
  if(!gameActive||levelDone||levelIntroEl.classList.contains('show')||levelDefeatedEl.classList.contains('show')||victoryEl.classList.contains('show'))return;
  const now=performance.now();
  if(now-fistCooldown<fistCooldownMs)return;
  fistCooldown=now;

  // Update cooldown visual
  fistCdFill.style.width='0%';
  let cdStart=now;
  const cdInterval=setInterval(()=>{
    const elapsed=performance.now()-cdStart;
    const pct=Math.min(elapsed/fistCooldownMs*100,100);
    fistCdFill.style.width=pct+'%';
    if(pct>=100)clearInterval(cdInterval);
  },16);

  playPunchSound();
  let popped=0;
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];
    if(b.state!==S_INTACT||!b.entered)continue;
    const dx=b.cx-x,dy=b.cy-y;
    if(dx*dx+dy*dy<=(BR+30)*(BR+30)){
      b.pop(now);popCount++;popped++;
      const pts=10+combo*5;score+=pts;
      const col=bcl[b.ci%bcl.length];
      for(let p=0;p<8;p++)particles.push(new StarParticle(b.cx,b.cy,col));
      if(popped>=5)break;
    }
  }
  if(popped>0){combo+=popped;if(combo>=3)showCombo(combo);updateUI();
    for(let i=0;i<12;i++)particles.push(new StarParticle(x,y,'#ffd93d'));
    // Screen flash for fist impact
    canvas.style.filter='brightness(1.3)';
    setTimeout(()=>canvas.style.filter='',80);
    showPopFloat(x,y-20,'POW! +'+(popped*10));
  }else{combo=0}
}

// ===== GRID =====
function resize(){dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function buildGrid(){
  bubbles=[];particles=[];fireworks=[];popCount=0;bcl=levels[currentLevel].bubbleColors;
  const cols=Math.ceil(W/CELL)+1,rows=Math.ceil(H/CELL)+1;
  const ox=(W-(cols-1)*CELL)/2,oy=(H-(rows-1)*CELL)/2;
  const now=performance.now();
  for(let r=0;r<rows;r++)for(let co=0;co<cols;co++){
    const cx=ox+co*CELL,cy=oy+r*CELL;
    if(cx<-BR*2||cx>W+BR*2||cy<-BR*2||cy>H+BR*2)continue;
    const b=new Bubble(cx,cy,(r*7+co*3)%bcl.length);b.startEntry(now);bubbles.push(b)}
  totalBubbles=bubbles.length;levelDone=false;updateUI()}

function startLevel(idx){
  currentLevel=idx;const lvl=levels[idx];
  introEmoji.textContent=lvl.emoji;introTitle.textContent=lvl.name;
  updateLevelDots();resize();buildGrid();
  const actualRequired=Math.ceil(totalBubbles*lvl.requiredPct);
  introSub.innerHTML=lvl.subtitle+'<br>捏爆 <span style="color:#e74c3c">'+actualRequired+'</span> 个过关！';
  levelIntroEl.classList.add('show');playStartJingle()}

// ===== INPUT =====
function doPop(mx,my){
  for(let i=bubbles.length-1;i>=0;i--){
    if(bubbles[i].hit(mx,my)){
      const b=bubbles[i];b.pop(performance.now());playPopSound();popCount++;
      const pts=10+combo*5;score+=pts;combo++;if(combo>=3)showCombo(combo);updateUI();
      const col=bcl[b.ci%bcl.length];
      for(let p=0;p<8;p++)particles.push(new StarParticle(b.cx,b.cy,col));
      showPopFloat(mx,my-10,'+'+pts);return true}}
  return false}

canvas.addEventListener('click',e=>{initAudio();
  if(startScreen.classList.contains('show')||levelIntroEl.classList.contains('show')||
    levelDefeatedEl.classList.contains('show')||victoryEl.classList.contains('show')||!gameActive)return;
  if(selectedMode==='click'){const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;if(!doPop(mx,my))combo=0}
  // In fist mode, clicks are ignored - use camera instead
});
canvas.addEventListener('touchstart',e=>{e.preventDefault();initAudio();
  if(startScreen.classList.contains('show')||levelIntroEl.classList.contains('show')||
    levelDefeatedEl.classList.contains('show')||victoryEl.classList.contains('show')||!gameActive)return;
  const t=e.touches[0],r=canvas.getBoundingClientRect(),mx=t.clientX-r.left,my=t.clientY-r.top;
  if(selectedMode==='click'){if(!doPop(mx,my))combo=0}
  // In fist mode, touches are ignored - use camera instead
},{passive:false});

startBtn.addEventListener('click',()=>{initAudio();startScreen.classList.remove('show');
  if(selectedMode==='fist')initCamera();
  playStartJingle();playLaugh();setTimeout(()=>startLevel(0),200)});
introBtn.addEventListener('click',()=>{levelIntroEl.classList.remove('show');gameActive=true});
defeatedBtn.addEventListener('click',()=>{levelDefeatedEl.classList.remove('show');startLevel(currentLevel+1)});
victoryBtn.addEventListener('click',()=>{victoryEl.classList.remove('show');score=0;startLevel(0)});
resetBtn.addEventListener('click',e=>{e.stopPropagation();score=0;
  startScreen.classList.remove('show');levelIntroEl.classList.remove('show');
  levelDefeatedEl.classList.remove('show');victoryEl.classList.remove('show');
  gameActive=false;prevFrame=null;
  // Stop camera tracks
  if(camDisplay.srcObject){camDisplay.srcObject.getTracks().forEach(t=>t.stop());camDisplay.srcObject=null}
  cameraReady=false;camPreview.style.display='none';fistIndicator.style.display='none';fistCdBar.style.display='none';
  startScreen.classList.add('show')});
window.addEventListener('resize',()=>{resize();buildGrid()});

// ===== RENDER =====
function frame(ts){
  ctx.clearRect(0,0,W,H);
  const lvl=levels[currentLevel],pct=totalBubbles>0?popCount/totalBubbles:0;
  const dmg=Math.min(pct/lvl.requiredPct,1);

  // BG
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,lvl.bg);bg.addColorStop(0.5,lvl.bgDark);bg.addColorStop(1,lvl.bg);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // Subtle dot pattern
  ctx.save();ctx.globalAlpha=0.04;ctx.fillStyle='#222';
  for(let x=0;x<W;x+=30)for(let y=0;y<H;y+=30){if((x+y)%60===0)ctx.fillRect(x,y,2,2)}
  ctx.restore();

  // Ambient glow behind boss (changes color with damage)
  const bFaceR=Math.min(W,H)*0.26;
  ctx.save();ctx.globalAlpha=0.1+dmg*0.15;
  const glowColor=dmg<0.5?'rgba(255,255,200,0.3)':'rgba(255,100,100,0.4)';
  const glowR=bFaceR*1.5+dmg*bFaceR*0.5;
  const glow=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,glowR);
  glow.addColorStop(0,glowColor);glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;ctx.fillRect(W/2-glowR,H/2-glowR,glowR*2,glowR*2);
  ctx.restore();

  drawBoss(ctx,ts,dmg);

  for(let i=0;i<bubbles.length;i++){bubbles[i].update(ts);bubbles[i].draw(ctx,ts)}

  // Particles
  ctx.save();
  for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw(ctx);if(particles[i].life<=0)particles.splice(i,1)}
  for(let i=fireworks.length-1;i>=0;i--){fireworks[i].update();fireworks[i].draw(ctx);if(!fireworks[i].alive)fireworks.splice(i,1)}
  ctx.restore();

  // Shake
  if(dmg>0.5&&gameActive){const sa=(dmg-0.5)*3;
    canvas.style.transform=`translate(${Math.sin(ts*0.015)*sa}px,${Math.cos(ts*0.018)*sa*0.5}px)`}
  else canvas.style.transform='';

  requestAnimationFrame(frame)}

resize();requestAnimationFrame(frame);
})();
</script>
