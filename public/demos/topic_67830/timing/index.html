<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timing - 专注计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            background-size: cover;
            background-position: center;
            transition: background 0.5s ease;
        }

        body.break-mode .bg-layer {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a3a0 100%);
        }

        body.has-image .bg-layer {
            background: transparent;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.has-image .bg-image {
            opacity: 0.7;
        }

        body.has-image .bg-overlay {
            opacity: 0.4;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: black;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        body.page-transition {
            opacity: 0;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .mode-label {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .timer-display {
            font-size: 6rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.9;
            }
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            min-width: 100px;
        }

        .btn-start {
            background: rgba(255, 255, 255, 0.9);
            color: #ff6b6b;
        }

        body.break-mode .btn-start {
            color: #4ecdc4;
        }

        .btn-start:hover {
            background: white;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-pause {
            background: rgba(255, 255, 255, 0.9);
            color: #ff6b6b;
        }

        body.break-mode .btn-pause {
            color: #4ecdc4;
        }

        .btn-pause:hover {
            background: white;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .btn-skip {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-skip:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .btn-todo {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            min-width: 100px;
        }

        .btn-todo:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .current-task {
            margin-top: 15px;
            font-size: 0.9rem;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
        }

        .progress-ring {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }

        .progress-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform-origin: 50% 50%;
        }

        .stats {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            justify-content: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .settings {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .setting-item label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .setting-item input {
            width: 60px;
            padding: 5px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-align: center;
            font-size: 1rem;
        }

        .setting-item input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
        }

        .setting-item input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .bg-controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-bg {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 20px;
            font-size: 0.9rem;
            min-width: auto;
        }

        .btn-bg:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        #bgFileInput {
            display: none;
        }

        .pet-controls {
            margin-top: 15px;
        }

        .btn-pet {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 20px;
            font-size: 0.9rem;
            min-width: auto;
        }

        .btn-pet:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .music-controls {
            margin-top: 15px;
        }

        .btn-music, .btn-music-toggle {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 20px;
            font-size: 0.9rem;
            min-width: auto;
            margin-right: 10px;
        }

        .btn-music:hover, .btn-music-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .pet-display {
            position: fixed;
            width: 100px;
            height: 120px;
            z-index: 100;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .pet-display.clickable {
            pointer-events: auto;
        }

        .pet-shadow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 12px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.3) 0%, transparent 70%);
            border-radius: 50%;
            transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
        }

        .pet-display.pet-jump .pet-shadow {
            width: 30px;
            height: 6px;
            opacity: 0.5;
        }

        .pet-display.pet-walking .pet-shadow {
            width: 50px;
            height: 10px;
            animation: shadow-walk 0.4s ease-in-out infinite;
        }

        @keyframes shadow-walk {
            0%, 100% { width: 50px; height: 10px; }
            50% { width: 60px; height: 8px; }
        }

        .pet-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-top: 10px;
            transform-style: preserve-3d;
            animation: pet-breathe 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
        }

        .pet-display.pet-left .pet-container {
            transform: scaleX(-1);
        }

        .pet-display.pet-walking .pet-container {
            animation: pet-walk 0.4s ease-in-out infinite;
        }

        .pet-display.pet-jump .pet-container {
            animation: pet-jump-animation 0.5s ease-in-out;
        }

        .pet-display.pet-work .pet-container {
            animation: none;
            transform: none;
        }

        @keyframes pet-breathe {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-3px) rotateX(2deg); }
        }

        @keyframes pet-walk {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            25% { transform: translateY(-8px) rotateX(5deg); }
            75% { transform: translateY(-8px) rotateX(-5deg); }
        }

        @keyframes pet-jump-animation {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-30px) rotateX(10deg) scale(1.1); }
        }

        @keyframes pet-work-idle {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-2px) rotateX(1deg); }
        }

        .pet-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .pet-modal.active {
            display: flex;
        }

        .pet-modal-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            color: #333;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .pet-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .pet-modal-header h3 {
            font-size: 1.5rem;
            margin: 0;
        }

        .pet-modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            padding: 0 10px;
        }

        .pet-modal-close:hover {
            color: #333;
        }

        .pet-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .pet-card {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .pet-card:hover {
            background: rgba(0, 0, 0, 0.08);
            transform: scale(1.05);
        }

        .pet-card.selected {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .pet-card svg {
            width: 60px;
            height: 60px;
            margin-bottom: 8px;
        }

        .pet-card .pet-name {
            font-size: 0.85rem;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .timer-display {
                font-size: 4rem;
            }

            .progress-ring {
                width: 200px;
                height: 200px;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9rem;
                min-width: 80px;
            }

            .stats {
                gap: 20px;
            }

            .pet-display {
                bottom: 20px;
                right: 20px;
            }

            .pet-container {
                width: 70px;
                height: 70px;
            }

            .pet-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="bg-image" id="bgImage"></div>
    <div class="bg-layer"></div>
    <div class="bg-overlay"></div>
    <div class="container">
        <h1>⏱️ Timing</h1>
        <div class="mode-label" id="modeLabel">工作时间</div>
        <div class="current-task" id="currentTask" style="display: none;"></div>
        
        <div class="progress-ring">
            <svg viewBox="0 0 280 280">
                <circle
                    class="progress-ring-circle"
                    stroke="rgba(255,255,255,0.3)"
                    stroke-width="8"
                    fill="transparent"
                    r="130"
                    cx="140"
                    cy="140"
                />
                <circle
                    class="progress-ring-circle"
                    id="progressCircle"
                    stroke="white"
                    stroke-width="8"
                    stroke-linecap="round"
                    fill="transparent"
                    r="130"
                    cx="140"
                    cy="140"
                />
            </svg>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                <div class="timer-display" id="timerDisplay">25:00</div>
            </div>
        </div>

        <div class="controls">
            <button id="btnStart" class="btn-start">开始</button>
            <button id="btnPause" class="btn-pause" style="display: none;">暂停</button>
            <button id="btnReset" class="btn-reset">重置</button>
            <button id="btnSkip" class="btn-skip">跳过</button>
            <button class="btn-todo" id="btnTodo">📋 待办</button>
            
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="completedPomodoros">0</div>
                <div class="stat-label">完成专注</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalFocusTime">0</div>
                <div class="stat-label">专注时长(分钟)</div>
            </div>
        </div>

        <div class="settings">
                <div class="setting-item">
                    <label>工作时长(分钟)</label>
                    <input type="number" id="workDuration" value="25" min="1" max="60">
                </div>
                <div class="setting-item">
                    <label>休息时长(分钟)</label>
                    <input type="number" id="breakDuration" value="5" min="1" max="60">
                </div>
            </div>

            <div class="bg-controls">
                <button class="btn-bg" id="btnSelectBg">选择背景图片</button>
                <input type="file" id="bgFileInput" accept="image/*">
                <button class="btn-bg" id="btnResetBg">恢复默认背景</button>
            </div>

            <div class="pet-controls">
                <button class="btn-pet" id="btnPet">🐱 选择宠物</button>
            </div>

            <div class="music-controls">
                <button class="btn-music" id="btnMusic">🎵 音乐</button>
                <button class="btn-music-toggle" id="btnMusicToggle" style="display: none;">🔇 暂停</button>
            </div>
        </div>

        <div class="pet-display clickable" id="petDisplay">
            <div class="pet-shadow" id="petShadow"></div>
            <div class="pet-container" id="petContainer"></div>
        </div>

        <div class="pet-modal" id="petModal">
            <div class="pet-modal-content">
                <div class="pet-modal-header">
                    <h3>🐾 选择你的宠物</h3>
                    <button class="pet-modal-close" id="petModalClose">✕</button>
                </div>
                <div class="pet-grid" id="petGrid"></div>
            </div>
        </div>

    <script src="pets.js"></script>
    <script src="storage.js"></script>
    <script>
        const timerDisplay = document.getElementById('timerDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const modeLabel = document.getElementById('modeLabel');
        const btnStart = document.getElementById('btnStart');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');
        const btnSkip = document.getElementById('btnSkip');
        const completedPomodoros = document.getElementById('completedPomodoros');
        const totalFocusTime = document.getElementById('totalFocusTime');
        const workDurationInput = document.getElementById('workDuration');
        const breakDurationInput = document.getElementById('breakDuration');
        const bgImage = document.getElementById('bgImage');
        const bgFileInput = document.getElementById('bgFileInput');
        const btnSelectBg = document.getElementById('btnSelectBg');
        const btnResetBg = document.getElementById('btnResetBg');
        const currentTaskEl = document.getElementById('currentTask');
        const btnPet = document.getElementById('btnPet');
        const petModal = document.getElementById('petModal');
        const petModalClose = document.getElementById('petModalClose');
        const petGrid = document.getElementById('petGrid');
        const petContainer = document.getElementById('petContainer');
        const btnMusic = document.getElementById('btnMusic');
        const btnMusicToggle = document.getElementById('btnMusicToggle');
        const btnTodo = document.getElementById('btnTodo');

        const circleRadius = progressCircle.r.baseVal.value;
        const circumference = circleRadius * 2 * Math.PI;
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = circumference;

        let currentMode = 'work';
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let timer = null;
        let isRunning = false;
        let pomodorosCount = 0;
        let focusMinutes = 0;
        let currentTodoId = null;
        let currentTodo = null;
        let currentPetId = 'beagle';
        let currentPet = PETS.beagle;

        let audioContext = null;
        let noiseNodes = [];
        let customAudio = null;
        let isMusicPlaying = false;

        class PetController {
            constructor() {
                this.x = window.innerWidth / 2 - 50;
                this.y = window.innerHeight / 2 - 60;
                this.targetX = this.x;
                this.targetY = this.y;
                this.state = 'idle';
                this.direction = 'right';
                this.speed = 70;
                this.walkAnimation = null;
                this.idleTimer = null;
                this.petDisplay = document.getElementById('petDisplay');
                this.petContainer = document.getElementById('petContainer');
            }

            init() {
                this.renderPet();
                this.startWandering();
                this.petDisplay.addEventListener('click', () => this.handleClick());
                window.addEventListener('resize', () => this.handleResize());
            }

            renderPet() {
                const svgContent = this.state === 'working' ? currentPet.work : currentPet.idle;
                this.petContainer.innerHTML = svgContent;
            }

            setPosition(x, y) {
                this.x = Math.max(0, Math.min(window.innerWidth - 100, x));
                this.y = Math.max(0, Math.min(window.innerHeight - 120, y));
                this.petDisplay.style.left = `${this.x}px`;
                this.petDisplay.style.top = `${this.y}px`;
            }

            moveTo(targetX, targetY) {
                this.targetX = Math.max(0, Math.min(window.innerWidth - 100, targetX));
                this.targetY = Math.max(0, Math.min(window.innerHeight - 120, targetY));
                
                if (this.targetX < this.x) {
                    this.direction = 'left';
                } else {
                    this.direction = 'right';
                }

                if (this.state !== 'walking') {
                    this.setState('walking');
                }

                this.startWalkingAnimation();
            }

            startWalkingAnimation() {
                if (this.walkAnimation) {
                    cancelAnimationFrame(this.walkAnimation);
                }

                const animate = () => {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 5) {
                        this.setPosition(this.targetX, this.targetY);
                        this.setState('idle');
                        this.scheduleNextMove();
                        return;
                    }

                    const moveSpeed = this.speed / 60;
                    this.x += (dx / distance) * moveSpeed;
                    this.y += (dy / distance) * moveSpeed;
                    this.setPosition(this.x, this.y);

                    if (this.targetX < this.x) {
                        this.direction = 'left';
                    } else {
                        this.direction = 'right';
                    }

                    this.updateDirectionClass();
                    this.walkAnimation = requestAnimationFrame(animate);
                };

                animate();
            }

            setState(newState) {
                this.state = newState;
                this.petDisplay.classList.remove('pet-idle', 'pet-walking', 'pet-work', 'pet-jump');
                
                switch (newState) {
                    case 'idle':
                        this.petDisplay.classList.add('pet-idle');
                        break;
                    case 'walking':
                        this.petDisplay.classList.add('pet-walking');
                        break;
                    case 'working':
                        this.petDisplay.classList.add('pet-work');
                        break;
                }

                this.renderPet();
            }

            updateDirectionClass() {
                if (this.direction === 'left') {
                    this.petDisplay.classList.add('pet-left');
                } else {
                    this.petDisplay.classList.remove('pet-left');
                }
            }

            handleClick() {
                if (this.state === 'jumping') return;
                
                this.petDisplay.classList.add('pet-jump');
                const previousState = this.state;
                this.state = 'jumping';
                
                setTimeout(() => {
                    this.petDisplay.classList.remove('pet-jump');
                    this.state = previousState;
                    if (previousState === 'idle') {
                        this.petDisplay.classList.add('pet-idle');
                    } else if (previousState === 'working') {
                        this.petDisplay.classList.add('pet-work');
                    } else if (previousState === 'walking') {
                        this.petDisplay.classList.add('pet-walking');
                    }
                }, 500);
            }

            scheduleNextMove() {
                if (this.idleTimer) clearTimeout(this.idleTimer);
                
                if (this.state === 'working') {
                    return;
                }

                const delay = 2000 + Math.random() * 3000;
                this.idleTimer = setTimeout(() => {
                    if (this.state === 'idle') {
                        this.wander();
                    }
                }, delay);
            }

            wander() {
                const margin = 100;
                const randomX = margin + Math.random() * (window.innerWidth - 200);
                const randomY = margin + Math.random() * (window.innerHeight - 240);
                this.moveTo(randomX, randomY);
            }

            startWandering() {
                setTimeout(() => {
                    if (this.state === 'idle') {
                        this.wander();
                    }
                }, 1000);
            }

            goToWork() {
                const centerX = (window.innerWidth - 100) / 2;
                const bottomY = window.innerHeight - 200;
                this.moveTo(centerX, bottomY);

                const checkArrive = setInterval(() => {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 10) {
                        clearInterval(checkArrive);
                        this.setState('working');
                    }
                }, 100);
            }

            goPlay() {
                this.setState('idle');
                this.wander();
            }

            handleResize() {
                this.setPosition(this.x, this.y);
            }
        }

        let petController = null;

        const NOISE_URLS = {
            rain: 'https://assets.mixkit.co/active_storage/sfx/2515/2515-preview.mp3',
            forest: 'https://assets.mixkit.co/active_storage/sfx/2516/2516-preview.mp3',
            cafe: 'https://assets.mixkit.co/active_storage/sfx/2514/2514-preview.mp3',
            ocean: 'https://assets.mixkit.co/active_storage/sfx/2517/2517-preview.mp3',
            fire: 'https://assets.mixkit.co/active_storage/sfx/2513/2513-preview.mp3',
            pink: null
        };

        function playOnlineNoise(type) {
            const url = NOISE_URLS[type];
            if (!url) {
                createPinkNoise();
                return;
            }
            const audio = new Audio(url);
            audio.loop = true;
            audio.volume = parseFloat(localStorage.getItem('musicVolume') || '50') / 100;
            audio.play().catch(() => {
                createFallbackNoise(type);
            });
            noiseNodes.push({ noise: audio, volume: { gain: { value: audio.volume } } });
        }

        function createFallbackNoise(type) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const volume = audioContext.createGain();
            volume.gain.value = parseFloat(localStorage.getItem('musicVolume') || '50') / 100;
            volume.connect(audioContext.destination);
            const bufferSize = 2 * audioContext.sampleRate;
            const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let lastOut = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                output[i] = (lastOut + 0.02 * white) / 1.02;
                lastOut = output[i];
                output[i] *= 3.5;
            }
            const noise = audioContext.createBufferSource();
            noise.buffer = noiseBuffer;
            noise.loop = true;
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            switch (type) {
                case 'rain': filter.frequency.value = 1500; break;
                case 'forest': filter.frequency.value = 600; break;
                case 'cafe': filter.frequency.value = 800; break;
                case 'ocean': filter.frequency.value = 400; break;
                case 'fire': filter.frequency.value = 200; break;
                default: filter.frequency.value = 2000;
            }
            noise.connect(filter);
            filter.connect(volume);
            noise.start();
            noiseNodes.push({ noise, volume, filter });
        }

        function createRainNoise() {
            playOnlineNoise('rain');
        }

        function createForestNoise() {
            playOnlineNoise('forest');
        }

        function createCafeNoise() {
            playOnlineNoise('cafe');
        }

        function createOceanNoise() {
            playOnlineNoise('ocean');
        }

        function createFireNoise() {
            playOnlineNoise('fire');
        }

        function createPinkNoise() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const volume = audioContext.createGain();
            volume.gain.value = parseFloat(localStorage.getItem('musicVolume') || '50') / 100;
            volume.connect(audioContext.destination);
            const bufferSize = 2 * audioContext.sampleRate;
            const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = noiseBuffer.getChannelData(0);

            let b0, b1, b2, b3, b4, b5, b6;
            b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.90000 * b3 + white * 0.3104856;
                b4 = 0.65000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                output[i] *= 0.11;
                b6 = white * 0.115926;
            }

            const noise = audioContext.createBufferSource();
            noise.buffer = noiseBuffer;
            noise.loop = true;
            noise.connect(volume);
            noise.start();
            noiseNodes.push({ noise, volume });
        }

        function stopNoise() {
            noiseNodes.forEach(node => {
                if (node.noise) {
                    try { node.noise.stop(); } catch (e) {}
                    try { node.noise.pause(); } catch (e) {}
                    try { node.noise.disconnect(); } catch (e) {}
                }
                if (node.volume) {
                    try { node.volume.disconnect(); } catch (e) {}
                }
                if (node.filter) {
                    try { node.filter.disconnect(); } catch (e) {}
                }
                if (node.lfo) {
                    try { node.lfo.stop(); } catch (e) {}
                    try { node.lfo.disconnect(); } catch (e) {}
                }
            });
            noiseNodes = [];
            if (audioContext) { audioContext.close(); audioContext = null; }
        }

        let musicNeedsUserGesture = false;

        async function playMusic() {
            stopMusic();
            const musicType = localStorage.getItem('selectedMusicType');
            const noiseType = localStorage.getItem('selectedNoise');
            const volume = parseFloat(localStorage.getItem('musicVolume') || '50') / 100;

            if (musicType === 'noise' && noiseType) {
                switch (noiseType) {
                    case 'rain': createRainNoise(); break;
                    case 'forest': createForestNoise(); break;
                    case 'cafe': createCafeNoise(); break;
                    case 'ocean': createOceanNoise(); break;
                    case 'fire': createFireNoise(); break;
                    case 'pink': createPinkNoise(); break;
                }
                isMusicPlaying = true;
                updateMusicToggleButton();
            } else if (musicType === 'custom') {
                try {
                    const musicBlob = await getMusic();
                    if (!musicBlob) {
                        alert('没有找到保存的音乐文件，请重新导入');
                        return;
                    }

                    const audioUrl = URL.createObjectURL(musicBlob);
                    customAudio = new Audio(audioUrl);
                    customAudio.loop = true;
                    customAudio.volume = volume;
                    
                    customAudio.play().then(() => {
                        isMusicPlaying = true;
                        updateMusicToggleButton();
                        musicNeedsUserGesture = false;
                    }).catch(err => {
                        console.error('音乐播放失败:', err);
                        URL.revokeObjectURL(audioUrl);
                        musicNeedsUserGesture = true;
                        isMusicPlaying = false;
                        updateMusicToggleButton();
                        alert('音乐播放被浏览器阻止，请点击页面上的音乐按钮尝试播放');
                    });

                    customAudio.addEventListener('ended', () => {
                        URL.revokeObjectURL(audioUrl);
                    });
                } catch (err) {
                    console.error('读取音乐文件失败:', err);
                    alert('读取音乐文件失败，请重新导入');
                }
            }
        }

        function tryPlayWithUserGesture() {
            if (musicNeedsUserGesture) {
                playMusic();
            }
        }

        function stopMusic() {
            stopNoise();
            if (customAudio) {
                customAudio.pause();
                customAudio = null;
            }
            isMusicPlaying = false;
            updateMusicToggleButton();
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                stopMusic();
            } else {
                playMusic();
            }
        }

        function updateMusicToggleButton() {
            if (isMusicPlaying) {
                btnMusic.style.display = 'none';
                btnMusicToggle.style.display = 'inline-block';
                btnMusicToggle.textContent = '🔇 暂停';
            } else {
                btnMusic.style.display = 'inline-block';
                btnMusicToggle.style.display = 'none';
            }
        }

        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function loadCurrentTodo() {
            const todoId = getUrlParam('todoId');
            if (todoId) {
                currentTodoId = parseInt(todoId);
                const savedTodos = localStorage.getItem('pomodoroTodos');
                if (savedTodos) {
                    const todos = JSON.parse(savedTodos);
                    currentTodo = todos.find(t => t.id === currentTodoId);
                    if (currentTodo) {
                        currentTaskEl.textContent = `当前专注: ${currentTodo.title}`;
                        currentTaskEl.style.display = 'inline-block';
                    }
                }
            }
        }

        function loadPet() {
            const savedPetId = localStorage.getItem('pomodoroPet');
            if (savedPetId && PETS[savedPetId]) {
                currentPetId = savedPetId;
                currentPet = PETS[savedPetId];
            }
            petController = new PetController();
            petController.init();
        }

        function openPetModal() {
            petModal.classList.add('active');
            renderPetGrid();
        }

        function closePetModal() {
            petModal.classList.remove('active');
        }

        function renderPetGrid() {
            petGrid.innerHTML = '';
            Object.values(PETS).forEach(pet => {
                const card = document.createElement('div');
                card.className = `pet-card ${currentPetId === pet.id ? 'selected' : ''}`;
                card.innerHTML = `
                    ${pet.idle}
                    <div class="pet-name">${pet.name}</div>
                `;
                card.addEventListener('click', () => {
                    selectPet(pet.id);
                });
                petGrid.appendChild(card);
            });
        }

        function selectPet(petId) {
            currentPetId = petId;
            currentPet = PETS[petId];
            localStorage.setItem('pomodoroPet', petId);
            if (petController) {
                petController.renderPet();
            }
            closePetModal();
        }

        function updateTodoProgress() {
            if (currentTodoId && currentMode === 'work') {
                const savedTodos = localStorage.getItem('pomodoroTodos');
                if (savedTodos) {
                    const todos = JSON.parse(savedTodos);
                    const todoIndex = todos.findIndex(t => t.id === currentTodoId);
                    if (todoIndex !== -1) {
                        todos[todoIndex].completedMinutes += parseInt(workDurationInput.value);
                        if (todos[todoIndex].completedMinutes >= todos[todoIndex].focusMinutes) {
                            todos[todoIndex].completed = true;
                        }
                        localStorage.setItem('pomodoroTodos', JSON.stringify(todos));
                        currentTodo = todos[todoIndex];
                    }
                }
            }
        }

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            const percent = ((totalTime - timeLeft) / totalTime) * 100;
            setProgress(percent);
        }

        function switchMode() {
            if (currentMode === 'work') {
                updateTodoProgress();
                currentMode = 'break';
                modeLabel.textContent = '休息时间';
                document.body.classList.add('break-mode');
                totalTime = parseInt(breakDurationInput.value) * 60;
                timeLeft = totalTime;
                if (petController) {
                    petController.goPlay();
                }
            } else {
                currentMode = 'work';
                modeLabel.textContent = '工作时间';
                document.body.classList.remove('break-mode');
                totalTime = parseInt(workDurationInput.value) * 60;
                timeLeft = totalTime;
                if (petController) {
                    petController.goToWork();
                }
            }
            updateDisplay();
            playNotification();
        }

        function playNotification() {
            if ('Notification' in window && Notification.permission === 'granted') {
                const title = currentMode === 'work' ? '休息时间到！' : '工作时间到！';
                const body = currentMode === 'work' ? '休息一下，放松身心吧' : '开始专注工作吧';
                new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍅</text></svg>' });
            }
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function startTimer() {
            if (isRunning) return;
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            isRunning = true;
            btnStart.style.display = 'none';
            btnPause.style.display = 'inline-block';
            
            if (petController && currentMode === 'work') {
                petController.goToWork();
            }
            
            timer = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    isRunning = false;
                    btnStart.style.display = 'inline-block';
                    btnPause.style.display = 'none';
                    
                    if (currentMode === 'work') {
                        pomodorosCount++;
                        focusMinutes += parseInt(workDurationInput.value);
                        completedPomodoros.textContent = pomodorosCount;
                        totalFocusTime.textContent = focusMinutes;
                    }
                    
                    switchMode();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timer);
            btnStart.style.display = 'inline-block';
            btnPause.style.display = 'none';
        }

        function resetTimer() {
            pauseTimer();
            if (currentMode === 'work') {
                totalTime = parseInt(workDurationInput.value) * 60;
            } else {
                totalTime = parseInt(breakDurationInput.value) * 60;
            }
            timeLeft = totalTime;
            updateDisplay();
        }

        function skipTimer() {
            pauseTimer();
            switchMode();
        }

        function handleDurationChange() {
            if (!isRunning && currentMode === 'work') {
                totalTime = parseInt(workDurationInput.value) * 60;
                timeLeft = totalTime;
                updateDisplay();
            }
        }

        function handleBreakDurationChange() {
            if (!isRunning && currentMode === 'break') {
                totalTime = parseInt(breakDurationInput.value) * 60;
                timeLeft = totalTime;
                updateDisplay();
            }
        }

        function setBackgroundImage(imageUrl) {
            if (imageUrl) {
                bgImage.style.backgroundImage = `url(${imageUrl})`;
                document.body.classList.add('has-image');
                localStorage.setItem('pomodoroBackground', imageUrl);
            } else {
                bgImage.style.backgroundImage = '';
                document.body.classList.remove('has-image');
                localStorage.removeItem('pomodoroBackground');
            }
        }

        function handleBgSelect() {
            bgFileInput.click();
        }

        function compressImage(file, maxWidth = 1920, maxHeight = 1080, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        if (height > maxHeight) {
                            width = (width * maxHeight) / height;
                            height = maxHeight;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleBgFileChange(event) {
            const file = event.target.files[0];
            if (file) {
                try {
                    const compressedUrl = await compressImage(file);
                    setBackgroundImage(compressedUrl);
                } catch (e) {
                    console.error('图片处理失败:', e);
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            setBackgroundImage(e.target.result);
                        } catch (storageError) {
                            console.error('存储失败:', storageError);
                            alert('背景图片过大，无法保存');
                        }
                    };
                    reader.readAsDataURL(file);
                }
            }
        }

        function handleBgReset() {
            setBackgroundImage(null);
            bgFileInput.value = '';
        }

        const savedBg = localStorage.getItem('pomodoroBackground');
        if (savedBg) {
            setBackgroundImage(savedBg);
        }

        loadCurrentTodo();
        loadPet();

        btnStart.addEventListener('click', startTimer);
        btnPause.addEventListener('click', pauseTimer);
        btnReset.addEventListener('click', resetTimer);
        btnSkip.addEventListener('click', skipTimer);
        workDurationInput.addEventListener('change', handleDurationChange);
        breakDurationInput.addEventListener('change', handleBreakDurationChange);
        btnSelectBg.addEventListener('click', handleBgSelect);
        bgFileInput.addEventListener('change', handleBgFileChange);
        btnResetBg.addEventListener('click', handleBgReset);
        btnPet.addEventListener('click', openPetModal);
        petModalClose.addEventListener('click', closePetModal);
        petModal.addEventListener('click', (e) => {
            if (e.target === petModal) closePetModal();
        });
        btnMusic.addEventListener('click', () => {
            document.body.classList.add('page-transition');
            setTimeout(() => {
                window.location.href = 'music.html';
            }, 300);
        });
        btnTodo.addEventListener('click', () => {
            document.body.classList.add('page-transition');
            setTimeout(() => {
                window.location.href = 'detail.html';
            }, 300);
        });
        btnMusicToggle.addEventListener('click', toggleMusic);

        if (getUrlParam('playMusic') === 'true') {
            playMusic();
        }

        document.addEventListener('click', function handleFirstClick() {
            tryPlayWithUserGesture();
            document.removeEventListener('click', handleFirstClick);
        }, { once: true });

        updateDisplay();
    </script>
</body>
