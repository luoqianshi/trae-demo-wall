<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timing - 待办事项</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            background-size: cover;
            background-position: center;
            transition: background 0.5s ease;
        }

        body.has-image .bg-layer {
            background: transparent;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.has-image .bg-image {
            opacity: 0.7;
        }

        body.has-image .bg-overlay {
            opacity: 0.4;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: black;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            color: white;
            padding: 20px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        body.page-transition {
            opacity: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            min-width: 100px;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .add-todo {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-todo input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1rem;
        }

        .add-todo input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .add-todo input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
        }

        .add-todo select {
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        .add-todo select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
        }

        .add-todo button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #ff6b6b;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-todo button:hover {
            background: white;
            transform: scale(1.05);
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .todo-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
        }

        .todo-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .todo-checkbox:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .todo-item.completed .todo-checkbox {
            background: rgba(255, 255, 255, 0.9);
        }

        .todo-checkbox svg {
            width: 14px;
            height: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .todo-item.completed .todo-checkbox svg {
            opacity: 1;
        }

        .todo-content {
            flex: 1;
            min-width: 0;
        }

        .todo-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .todo-time {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .todo-time span {
            color: rgba(255, 255, 255, 0.6);
        }

        .todo-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-focus {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #ff6b6b;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-focus:hover {
            background: white;
            transform: scale(1.05);
        }

        .btn-delete {
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.7;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 1rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-num {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-text {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .add-todo {
                flex-direction: column;
            }

            .todo-item {
                flex-wrap: wrap;
            }

            .todo-actions {
                margin-top: 10px;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="bg-image" id="bgImage"></div>
    <div class="bg-layer"></div>
    <div class="bg-overlay"></div>
    
    <div class="container">
        <div class="header">
            <h1>📋 待办事项</h1>
            <button class="btn-back" id="btnBack">⏱️ 返回 Timing</button>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-num" id="totalTodos">0</div>
                <div class="stat-text">总待办</div>
            </div>
            <div class="stat-box">
                <div class="stat-num" id="completedTodos">0</div>
                <div class="stat-text">已完成</div>
            </div>
            <div class="stat-box">
                <div class="stat-num" id="totalFocusTime">0</div>
                <div class="stat-text">总专注(分)</div>
            </div>
        </div>

        <div class="add-todo">
            <input type="text" id="todoInput" placeholder="输入待办事项...">
            <select id="timeSelect">
                <option value="25">25分钟</option>
                <option value="15">15分钟</option>
                <option value="30">30分钟</option>
                <option value="45">45分钟</option>
                <option value="60">60分钟</option>
            </select>
            <button id="addBtn">添加</button>
        </div>

        <ul class="todo-list" id="todoList">
            <li class="empty-state">
                <svg viewBox="0 0 24 24" fill="white">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                <p>暂无待办事项</p>
                <p style="font-size: 0.85rem; margin-top: 5px;">添加一个新的待办开始专注吧！</p>
            </li>
        </ul>
    </div>

    <script>
        const bgImage = document.getElementById('bgImage');
        const todoInput = document.getElementById('todoInput');
        const timeSelect = document.getElementById('timeSelect');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const totalTodosEl = document.getElementById('totalTodos');
        const completedTodosEl = document.getElementById('completedTodos');
        const totalFocusTimeEl = document.getElementById('totalFocusTime');

        let todos = [];

        function loadTodos() {
            const saved = localStorage.getItem('pomodoroTodos');
            if (saved) {
                todos = JSON.parse(saved);
            } else {
                todos = [];
            }
            renderTodos();
        }

        function saveTodos() {
            localStorage.setItem('pomodoroTodos', JSON.stringify(todos));
        }

        function renderTodos() {
            todoList.innerHTML = '';

            if (todos.length === 0) {
                todoList.innerHTML = `
                    <li class="empty-state">
                        <svg viewBox="0 0 24 24" fill="white">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                        </svg>
                        <p>暂无待办事项</p>
                        <p style="font-size: 0.85rem; margin-top: 5px;">添加一个新的待办开始专注吧！</p>
                    </li>
                `;
            } else {
                todos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                    li.innerHTML = `
                        <div class="todo-checkbox" data-id="${todo.id}">
                            ${todo.completed ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' : ''}
                        </div>
                        <div class="todo-content">
                            <div class="todo-title">${todo.title}</div>
                            <div class="todo-time">
                                <span>计划:</span> ${todo.focusMinutes}分钟
                                <span> · 已完成:</span> ${todo.completedMinutes}分钟
                            </div>
                        </div>
                        <div class="todo-actions">
                            <button class="btn-focus" data-id="${todo.id}">开始专注</button>
                            <button class="btn-delete" data-id="${todo.id}">删除</button>
                        </div>
                    `;
                    todoList.appendChild(li);
                });
            }

            updateStats();
        }

        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const totalMinutes = todos.reduce((sum, t) => sum + t.completedMinutes, 0);
            
            totalTodosEl.textContent = total;
            completedTodosEl.textContent = completed;
            totalFocusTimeEl.textContent = totalMinutes;
        }

        function addTodo() {
            const title = todoInput.value.trim();
            const focusMinutes = parseInt(timeSelect.value);
            
            if (!title) {
                alert('请输入待办事项内容');
                return;
            }

            const newTodo = {
                id: Date.now(),
                title,
                focusMinutes,
                completedMinutes: 0,
                completed: false,
                createdAt: new Date().toISOString()
            };

            todos.unshift(newTodo);
            saveTodos();
            renderTodos();
            
            todoInput.value = '';
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
            }
        }

        function deleteTodo(id) {
            if (confirm('确定要删除这个待办事项吗？')) {
                todos = todos.filter(t => t.id !== id);
                saveTodos();
                renderTodos();
            }
        }

        function startFocus(id) {
            document.body.classList.add('page-transition');
            setTimeout(() => {
                window.location.href = `index.html?todoId=${id}`;
            }, 300);
        }

        addBtn.addEventListener('click', addTodo);
        
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        todoList.addEventListener('click', (e) => {
            const checkbox = e.target.closest('.todo-checkbox');
            const focusBtn = e.target.closest('.btn-focus');
            const deleteBtn = e.target.closest('.btn-delete');

            if (checkbox) {
                toggleTodo(parseInt(checkbox.dataset.id));
            } else if (focusBtn) {
                startFocus(parseInt(focusBtn.dataset.id));
            } else if (deleteBtn) {
                deleteTodo(parseInt(deleteBtn.dataset.id));
            }
        });

        const savedBg = localStorage.getItem('pomodoroBackground');
        if (savedBg) {
            bgImage.style.backgroundImage = `url(${savedBg})`;
            document.body.classList.add('has-image');
        }

        const btnBack = document.getElementById('btnBack');
        btnBack.addEventListener('click', () => {
            document.body.classList.add('page-transition');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        });

        loadTodos();
    </script>
</body>
</html>
