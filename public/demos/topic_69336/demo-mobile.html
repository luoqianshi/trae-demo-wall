    { id: 'game_design', emoji: '🎮', name: '游戏设计', color: '#7B4C8C' },
    { id: 'literature', emoji: '📖', name: '文学', color: '#8C4C6B' },
    { id: 'anthropology', emoji: '🗿', name: '人类学', color: '#8C6B4C' }
  ];

  var randomQuestions = [
    '如何提高一个社区的活跃度？',
    '为什么我总是拖延？',
    '怎样设计一个让人愿意停留的公共空间？',
    '如何让学习变得像玩游戏一样上瘾？',
    '城市为什么让人感到孤独？',
    '怎样让一个产品被更多人自发传播？',
    '为什么要读经典？',
    '如何理解"内卷"？',
    '怎样才能做出更好的决策？',
    '为什么有些人更容易坚持？',
    '怎样让AI更好地服务老年人？',
    '如何帮一个品牌找到独特的声音？'
  ];

  var loadingPhrases = [
    '正在调配学科配方...',
    '知识正在混合中...',
    '灵感正在升温...',
    '快煮好了，再等一等...',
    '各学科正在激烈碰撞...',
    '正在萃取跨学科精华...'
  ];

  // ---- State ----
  var selectedSubjects = [];
  var currentQuestion = '';

  // ---- DOM refs ----
  var pageHome = document.getElementById('pageHome');
  var pageSelect = document.getElementById('pageSelect');
  var pageLoading = document.getElementById('pageLoading');
  var pageResult = document.getElementById('pageResult');
  var pages = [pageHome, pageSelect, pageLoading, pageResult];

  var questionInput = document.getElementById('questionInput');
  var btnGoSelect = document.getElementById('btnGoSelect');
  var btnRandomQuestion = document.getElementById('btnRandomQuestion');
  var btnBackToHome = document.getElementById('btnBackToHome');
  var btnBackToHome2 = document.getElementById('btnBackToHome2');
  var subjectGrid = document.getElementById('subjectGrid');
  var selectedPillArea = document.getElementById('selectedPillArea');
  var btnGoLoading = document.getElementById('btnGoLoading');
  var loadingText = document.getElementById('loadingText');
  var loadingSub = document.getElementById('loadingSub');
  var resultContent = document.getElementById('resultContent');
  var btnTweak = document.getElementById('btnTweak');
  var btnRestart = document.getElementById('btnRestart');

  // ---- Navigation ----
  function goToPage(target) {
    pages.forEach(function(p) {
      p.classList.remove('active', 'prev');
    });
    var targetIdx = pages.indexOf(target);
    pages.forEach(function(p, i) {
      if (i < targetIdx) {
        p.classList.add('prev');
      }
    });
    target.classList.add('active');
    // Scroll to top of scrollable pages
    if (target.classList.contains('scrollable')) {
      target.scrollTop = 0;
    }
  }

  // ---- Particles ----
  function createParticles() {
    var container = document.getElementById('particles');
    var colors = ['#D4763C', '#5B8A72', '#6B4C8C', '#D4A03C', '#C44B4B'];
    for (var i = 0; i < 8; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var size = 3 + Math.random() * 6;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (15 + Math.random() * 20) + 's';
      p.style.animationDelay = Math.random() * 10 + 's';
      container.appendChild(p);
    }
  }
  createParticles();

  // ---- Page 1: Home ----
  function updateHomeBtn() {
    if (questionInput.value.trim()) {
      btnGoSelect.disabled = false;
      btnGoSelect.textContent = '下一步：选择学科';
    } else {
      btnGoSelect.disabled = true;
      btnGoSelect.textContent = '请输入一个问题';
    }
  }

  questionInput.addEventListener('input', updateHomeBtn);

  btnGoSelect.addEventListener('click', function() {
    currentQuestion = questionInput.value.trim();
    if (!currentQuestion) return;
    goToPage(pageSelect);
    questionInput.blur();
  });

  btnRandomQuestion.addEventListener('click', function() {
    var q = randomQuestions[Math.floor(Math.random() * randomQuestions.length)];
    questionInput.value = q;
    updateHomeBtn();
    questionInput.focus();
  });

  btnBackToHome.addEventListener('click', function() {
    goToPage(pageHome);
  });

  // ---- Page 2: Select ----
  function renderSubjects() {
    subjectGrid.innerHTML = '';
    subjects.forEach(function(s) {
      var card = document.createElement('div');
      card.className = 'subject-card' + (selectedSubjects.indexOf(s.id) >= 0 ? ' selected' : '');
      card.setAttribute('data-id', s.id);
      card.innerHTML = '<span class="check">✓</span><span class="emoji">' + s.emoji + '</span><span class="name">' + s.name + '</span>';
      card.addEventListener('click', function() {
        toggleSubject(s.id);
      });
      subjectGrid.appendChild(card);
    });
    updateSelectedPill();
    updateSelectBtn();
  }

  function updateSelectedPill() {
    if (selectedSubjects.length === 0) {
      selectedPillArea.innerHTML = '<div class="selected-pill empty">还没有选学科呢 👆</div>';
      return;
    }
    var names = selectedSubjects.map(function(id) {
      var s = getSubjectById(id);
      return s ? s.emoji + ' ' + s.name : '';
    }).join(' + ');
    selectedPillArea.innerHTML = '<div class="selected-pill">当前配方：' + names + '</div>';
  }

  function updateSelectBtn() {
    var count = selectedSubjects.length;
    if (count >= 2 && count <= 4) {
      btnGoLoading.disabled = false;
      btnGoLoading.textContent = '开煮 🫕（' + count + ' 个学科）';
    } else {
      btnGoLoading.disabled = true;
      btnGoLoading.textContent = count < 2 ? '请选择 2-4 个学科' : '开煮 🫕';
    }
  }

  function toggleSubject(id) {
    var idx = selectedSubjects.indexOf(id);
    if (idx >= 0) {
      selectedSubjects.splice(idx, 1);
    } else {
      if (selectedSubjects.length >= 4) {
        selectedSubjects.shift();
      }
      selectedSubjects.push(id);
    }
    renderSubjects();
  }

  btnGoLoading.addEventListener('click', function() {
    if (selectedSubjects.length < 2) return;
    goToPage(pageLoading);
    startLoading();
  });

  // ---- Page 3: Loading ----
  function startLoading() {
    var phraseIdx = 0;
    loadingText.textContent = loadingPhrases[0];
    loadingSub.textContent = '灵感正在升温';

    var phraseInterval = setInterval(function() {
      phraseIdx = (phraseIdx + 1) % loadingPhrases.length;
      loadingText.textContent = loadingPhrases[phraseIdx];
    }, 900);

    setTimeout(function() {
      clearInterval(phraseInterval);
      generateResult();
      goToPage(pageResult);
    }, 2500);
  }

  // ---- Page 4: Result ----
  function getSubjectById(id) {
    for (var i = 0; i < subjects.length; i++) {
      if (subjects[i].id === id) return subjects[i];
    }
    return null;
  }

  function generatePerspectives(question, selected) {
    var templates = {
      psychology: { focus: '内在动机与情绪', insight: '从' + question + '这个问题来看，核心在于个体的认知偏差与行为模式。人的行为往往不是理性的，而是被情绪、习惯和潜意识驱动。理解用户的真实心理需求，比优化外部条件更有效。例如，运用"自我决定论"中的自主性、胜任感和归属感三个基本需求来重新审视这个问题。' },
      economics: { focus: '激励与资源配置', insight: '从经济学视角看，' + question + '本质上是资源分配和激励设计的问题。供需关系、边际效用、机会成本等概念能帮我们重新理解其中的权衡。关键不在于"做更多"，而在于"找到正确的激励信号"。' },
      ecology: { focus: '系统与生态位', insight: '在生态学中，任何系统都有其内生规律。' + question + '可以从生态位分化、共生关系、反馈循环等角度来理解。每个个体在系统中都占据一个生态位，系统健康取决于多样性、韧性和物质循环的效率。' },
      philosophy: { focus: '意义与价值追问', insight: '哲学视角要求我们回到问题的原点。' + question + '首先需要追问：我们为什么要解决这个问题？什么是"好"的标准？这种追问不是为了获得确切答案，而是为了揭示问题背后未言明的假设，避免在错误的方向上用力。' },
      architecture: { focus: '空间与结构', insight: '建筑学教会我们的是：形式追随功能，空间塑造行为。' + question + '可以转化为一个"空间设计"问题——什么样的结构能引导人们自然产生期望的行为？流线、节点、边界、领域感，这些空间概念可以直接迁移到组织设计、产品架构和社区规划中。' },
      arts: { focus: '感知与表达', insight: '艺术视角提醒我们：' + question + '不仅仅是功能性问题，也是感知和体验问题。美感、叙事、象征、情感共鸣——这些常常被理性分析忽略，却真正决定了人们是否愿意参与和投入。把问题当作一个"创作"而非"工程"，会打开全新的思路。' },
      cs: { focus: '算法与系统思维', insight: '计算机科学提供了系统化拆解问题的方法。' + question + '可以看作一个"输入-处理-输出"的系统，通过分解、抽象、模式识别和算法优化来逐步解决。数据驱动的反馈循环和迭代思维是核心武器。' },
      sociology: { focus: '群体与规范', insight: '社会学关注的是人与人之间的关系网络。' + question + '不是一个孤立的问题，而是社会结构、文化规范、权力关系和群体认同共同作用的结果。改变个体的努力往往不如改变环境中的社会规范有效。' },
      biology: { focus: '进化与适应', insight: '生物学视角下，' + question + '可以从进化适应、自然选择、遗传变异等角度来理解。任何系统都会朝着适应当前环境的方向演化，但"适应"不等于"最优"。理解系统的演化历史，能帮助我们找到更自然的干预点。' },
      game_design: { focus: '规则与参与', insight: '游戏设计教会我们如何创造引人入胜的体验。' + question + '可以从目标设定、即时反馈、渐进挑战、意外惊喜、社交驱动等游戏机制中寻找灵感。核心问题是：如何让参与本身变得有趣和有成就感？' },
      literature: { focus: '叙事与共情', insight: '文学是最深刻的理解人类经验的路径之一。' + question + '在文学中能找到无数种叙事可能——悲剧、喜剧、史诗、寓言。通过故事，我们能触达理性分析无法覆盖的共情和理解，找到问题的"人性内核"。' },
      anthropology: { focus: '文化与仪式', insight: '人类学提醒我们，' + question + '在不同的文化语境中可能有完全不同的意义。仪式、符号、传统、集体记忆——这些深层文化结构塑造了人们的行为和认知。理解"局内人"的视角，比施加外部方案更有效。' }
    };

    var results = [];
    selected.forEach(function(id) {
      var s = getSubjectById(id);
      var t = templates[id];
      if (s && t) {
        results.push({ emoji: s.emoji, name: s.name, focus: t.focus, insight: t.insight, color: s.color });
      }
    });
    return results;
  }

  function generateCrossInsight(question, selected) {
    var names = selected.map(function(id) { return getSubjectById(id).name; });
    var all = names.join('和');
    return '当' + all + '交叉时，一个有趣的洞察浮现了：' + question + '不是一个单一维度的问题，而是一个"多层系统"。' + names[0] + '提供了内在动力层，' + (names[1] || '') + '提供了外部结构层，' + (names[2] || names[1]) + '提供了演化与反馈层。真正的突破往往不在某一层，而在不同层之间的"连接处"——比如把心理动机转化为可衡量的激励，把空间结构转化为社会行为，把文化叙事转化为参与规则。';
  }

  function generateSolutions(question) {
    return [
      '重新定义问题：' + question + '的本质可能不是缺少方法，而是没有找到正确的衡量标准。建议先明确"成功"长什么样。',
      '最小实验：从最小的可验证单元开始，而非一次性设计完整方案。选一个学科视角，做一个小规模测试，观察反馈后再调整。',
      '反向思考：假设你想让' + question.replace('如何', '').replace('？', '') + '变得更糟，你会怎么做？反向推演往往能揭示被忽略的关键因素。'
    ];
  }

  function generateExtensions(question, selected) {
    var names = selected.map(function(id) { return getSubjectById(id).name; });
    return [
      '如果从' + (names[names.length - 1] || names[0]) + '开始，你第一个会改变什么？',
      '这个问题在100年前是否存在？如果存在，当时的人是怎么理解的？',
      '如果把' + question.replace('如何', '').replace('？', '') + '看作一个游戏，你会设计什么规则？',
      '有没有一个你已经知道答案但一直没去做的部分？如果有，是什么阻止了你？'
    ];
  }

  function generateResult() {
    var question = currentQuestion;
    var perspectives = generatePerspectives(question, selectedSubjects);
    var crossInsight = generateCrossInsight(question, selectedSubjects);
    var solutions = generateSolutions(question);
    var extensions = generateExtensions(question, selectedSubjects);

    var totalWeight = selectedSubjects.length;
    var perWeight = Math.floor(100 / totalWeight);
    var remainder = 100 - perWeight * totalWeight;
    var barHtml = '';
    selectedSubjects.forEach(function(id, i) {
      var s = getSubjectById(id);
      var w = perWeight + (i === 0 ? remainder : 0);
      barHtml += '<div class="bar" style="--target-width:' + w + '%;background:' + s.color + ';"></div>';
    });
    var legendHtml = '';
    selectedSubjects.forEach(function(id) {
      var s = getSubjectById(id);
      legendHtml += '<span><span class="dot" style="background:' + s.color + ';"></span>' + s.name + ' ' + perWeight + '%</span>';
    });

    var html = '';

    html += '<div class="recipe-badge">';
    html += '<div class="label">本次配方</div>';
    html += '<div class="bars">' + barHtml + '</div>';
    html += '<div class="legend">' + legendHtml + '</div>';
    html += '</div>';

    html += '<div class="result-block">';
    html += '<h3><span class="dot" style="background:var(--accent);"></span>问题重述</h3>';
    html += '<p>"' + question + '" —— 这个问题本质上涉及多个维度：内在动机、外部结构、系统演化。我们不妨从不同学科的角度重新审视它。</p>';
    html += '</div>';

    html += '<div class="perspective-cards">';
    perspectives.forEach(function(p) {
      html += '<div class="perspective-card">';
      html += '<span class="emoji">' + p.emoji + '</span>';
      html += '<h4>' + p.name + '视角：' + p.focus + '</h4>';
      html += '<p>' + p.insight + '</p>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="result-block">';
    html += '<h3><span class="dot" style="background:var(--accent3);"></span>混合洞察</h3>';
    html += '<p>' + crossInsight + '</p>';
    html += '</div>';

    html += '<div class="result-block">';
    html += '<h3><span class="dot" style="background:var(--accent2);"></span>可能方向</h3>';
    html += '<ul>';
    solutions.forEach(function(s) {
      html += '<li>' + s + '</li>';
    });
    html += '</ul>';
    html += '</div>';

    html += '<div class="result-block">';
    html += '<h3><span class="dot" style="background:var(--accent4);"></span>延伸问题</h3>';
    html += '<ul>';
    extensions.forEach(function(e) {
      html += '<li>' + e + '</li>';
    });
    html += '</ul>';
    html += '</div>';

    html += '<div style="height:20px;"></div>';

    resultContent.innerHTML = html;
  }

  btnBackToHome2.addEventListener('click', function() {
    goToPage(pageHome);
    selectedSubjects = [];
    renderSubjects();
    questionInput.value = '';
    updateHomeBtn();
  });

  btnTweak.addEventListener('click', function() {
    goToPage(pageSelect);
  });

  btnRestart.addEventListener('click', function() {
    goToPage(pageHome);
    selectedSubjects = [];
    renderSubjects();
    questionInput.value = '';
    updateHomeBtn();
  });

  // ---- Init ----
  renderSubjects();
  updateHomeBtn();

})();
</script>

</body>
</html>
