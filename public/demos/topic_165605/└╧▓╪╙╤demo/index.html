<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>老藏友 · 可点击 Demo</title>
  <link rel="stylesheet" href="_shared/styles.css" />
  <style>
    /* 每屏占位容器：渲染前不闪烁 */
    .spa-screen{min-height:780px}
  </style>
</head>
<body class="demo">
  <div class="phone">
    <div class="screen">

      <section class="spa-screen on" data-screen="home"></section>
      <section class="spa-screen" data-screen="detail"></section>
      <section class="spa-screen" data-screen="transit"></section>
      <section class="spa-screen" data-screen="share"></section>
      <section class="spa-screen" data-screen="mine"></section>

    </div>
  </div>

  <nav class="demo-nav" aria-label="demo 顶导">
    <div class="label">DEMO · v0.8</div>
    <button data-go="home" class="on">① 新 品 墙</button>
    <button data-go="detail">② 详 情</button>
    <button data-go="transit">③ 锁 定 中 转</button>
    <button data-go="share">④ 藏 友 晒 单</button>
    <button data-go="mine">⑤ 我 的 锁 定</button>
    <button class="reset" title="重置示例数据">归 位 · 重 置</button>
  </nav>

  <script src="_shared/app.js"></script>
</body>
</html>
