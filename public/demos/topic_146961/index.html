<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演讲进化岛 — 离线体验版</title>
<style>
:root {
  --color-primary: #6c5ce7;
  --color-primary-dark: #5849c2;
  --color-primary-light: #a29bfe;
  --color-accent: #fdcb6e;
  --color-accent-dark: #e1b04a;
  --color-success: #00b894;
  --color-warning: #fdcb6e;
  --color-danger: #e74c3c;
  --color-info: #0984e3;
  --grade-a: #00b894;
  --grade-a-bg: #d4f4ea;
  --grade-b: #0984e3;
  --grade-b-bg: #d4e9fc;
  --grade-c: #fdcb6e;
  --grade-c-bg: #fef4d4;
  --grade-d: #e74c3c;
  --grade-d-bg: #fde4e1;
  --bg-main: #f5f6fa;
  --bg-card: #ffffff;
  --text-primary: #2d3436;
  --text-secondary: #636e72;
  --text-light: #b2bec3;
  --border-color: #dfe6e9;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
  font-size: 16px; line-height: 1.6; color: var(--text-primary); background: var(--bg-main);
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg-main); position: relative; }

/* === Pages === */
.page { padding: 24px; display: none; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* === Header === */
.app-header { text-align: center; margin-bottom: 24px; }
.app-title { font-size: 28px; font-weight: 800; color: var(--color-primary); letter-spacing: 1px; }
.app-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

/* === Cards === */
.card { background: var(--bg-card); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }

/* === Character Panel === */
.char-panel { background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); color: white; border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-md); }
.char-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.char-avatar { width: 52px; height: 52px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
.char-name { font-size: 18px; font-weight: 700; }
.char-level { font-size: 13px; opacity: 0.85; }
.xp-bar-wrap { margin-top: 8px; }
.xp-label { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
.xp-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
.xp-bar-fill { height: 100%; background: var(--color-accent); border-radius: 4px; transition: width 0.6s ease; font-variant-numeric: tabular-nums; }
.streak-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; font-size: 13px; margin-top: 8px; }

/* === Section Title === */
.section-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

/* === Task Card === */
.task-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 12px; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; border: 2px solid transparent; width: 100%; text-align: left; font-family: inherit; }
.task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--color-primary-light); }
.task-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.task-card-title { font-size: 16px; font-weight: 700; }
.task-difficulty { font-size: 12px; color: var(--text-light); display: flex; gap: 2px; }
.task-card-prompt { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 8px; }
.task-card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.task-tag { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: var(--bg-main); color: var(--text-secondary); }

/* === Ability Panel === */
.ability-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); }
.ability-row:last-child { border-bottom: none; }
.ability-label { font-size: 14px; color: var(--text-secondary); }
.ability-grades { display: flex; gap: 4px; }
.mini-grade { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; }
.mini-grade.A { background: var(--grade-a); }
.mini-grade.B { background: var(--grade-b); }
.mini-grade.C { background: var(--grade-c); color: var(--text-primary); }
.mini-grade.D { background: var(--grade-d); }
.mini-grade.empty { background: var(--border-color); color: var(--text-light); }

/* === Practice Page === */
.practice-prompt { background: var(--bg-card); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
.practice-prompt-label { font-size: 12px; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.practice-prompt-text { font-size: 18px; font-weight: 600; line-height: 1.5; }
.key-points { margin-top: 12px; }
.key-points-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.key-point-tag { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 12px; background: var(--grade-b-bg); color: var(--grade-b); margin-right: 4px; margin-bottom: 4px; }

.timer-display { text-align: center; font-size: 36px; font-weight: 800; color: var(--color-primary); font-variant-numeric: tabular-nums; margin: 16px 0; }
.timer-bar { width: 100%; height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.timer-bar-fill { height: 100%; background: var(--color-primary); border-radius: 3px; transition: width 1s linear; }

.text-input-area { width: 100%; min-height: 120px; padding: 12px; border: 2px solid var(--border-color); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; resize: vertical; transition: border-color 0.2s; }
.text-input-area:focus { border-color: var(--color-primary); }

/* === Buttons === */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: var(--radius-sm); font-size: 16px; font-weight: 600; min-height: 48px; width: 100%; border: none; cursor: pointer; font-family: inherit; transition: background-color 0.2s, transform 0.2s; }
.btn-primary { background: var(--color-primary); color: white; }
.btn-primary:hover { background: var(--color-primary-dark); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { background: var(--text-light); cursor: not-allowed; }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 2px solid var(--border-color); }
.btn-secondary:hover { border-color: var(--color-primary); color: var(--color-primary); }

/* === Result Page === */
.result-header { text-align: center; margin-bottom: 20px; }
.result-overall-grade { width: 72px; height: 72px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; color: white; margin-bottom: 8px; }
.result-overall-grade.A { background: var(--grade-a); }
.result-overall-grade.B { background: var(--grade-b); }
.result-overall-grade.C { background: var(--grade-c); color: var(--text-primary); }
.result-overall-grade.D { background: var(--grade-d); }
.result-title { font-size: 22px; font-weight: 800; }
.result-xp { font-size: 16px; color: var(--color-accent-dark); font-weight: 700; margin-top: 4px; }

.score-row { display: flex; gap: 12px; margin-bottom: 16px; }
.score-card { flex: 1; background: var(--bg-card); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-sm); text-align: center; }
.score-card-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.score-card-grade { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: white; margin-bottom: 8px; }
.score-card-grade.A { background: var(--grade-a); }
.score-card-grade.B { background: var(--grade-b); }
.score-card-grade.C { background: var(--grade-c); color: var(--text-primary); }
.score-card-grade.D { background: var(--grade-d); }
.score-card-detail { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }

.detail-card { margin-bottom: 12px; }
.detail-card-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.detail-item { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; color: var(--text-secondary); }
.detail-item-value { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }

.feedback-item { padding: 8px 0; font-size: 14px; line-height: 1.6; display: flex; gap: 8px; }
.feedback-icon { flex-shrink: 0; }
.feedback-text { color: var(--text-secondary); }

.warnings-box { background: #fef9e7; border: 1px solid var(--color-warning); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 16px; font-size: 13px; color: var(--text-secondary); }

/* === Back Button === */
.back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--color-primary); cursor: pointer; margin-bottom: 16px; background: none; border: none; font-family: inherit; padding: 4px 0; }
.back-btn:hover { text-decoration: underline; }

/* === Empty State === */
.empty-state { text-align: center; padding: 32px 16px; color: var(--text-secondary); }

/* === Responsive === */
@media (max-width: 520px) {
  .page { padding: 16px; }
  .app-title { font-size: 24px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- ===== 首页 ===== -->
  <div id="page-home" class="page active">
    <div class="app-header">
      <div class="app-title">演讲进化岛</div>
      <div class="app-subtitle">AI 演讲陪练 · 离线体验版</div>
    </div>

    <div class="char-panel" id="charPanel"></div>

    <div class="card">
      <div class="section-title">能力面板</div>
      <div id="abilityPanel"></div>
    </div>

    <div class="section-title">每日任务</div>
    <div id="taskList"></div>
  </div>

  <!-- ===== 练习页 ===== -->
  <div id="page-practice" class="page">
    <button class="back-btn" onclick="goHome()">&larr; 返回</button>
    <div id="practiceContent"></div>
  </div>

  <!-- ===== 结果页 ===== -->
  <div id="page-result" class="page">
    <div id="resultContent"></div>
  </div>
</div>

<script>
// ===== 题库数据 =====
const TASKS = [
  { id:'task_001', title:'介绍一本书', prompt:'用30秒介绍你最喜欢的一本书，说说它为什么打动你', scenario_label:'课堂展示', difficulty_level:1, time_limit_seconds:30, key_points:['书名和作者','核心内容概述','推荐理由'], fluency_weight:0.6, logic_weight:0.4 },
  { id:'task_002', title:'介绍一个兴趣爱好', prompt:'用30秒向同学们介绍你的一个兴趣爱好', scenario_label:'课堂展示', difficulty_level:1, time_limit_seconds:30, key_points:['爱好名称','如何开始','收获或感受'], fluency_weight:0.6, logic_weight:0.4 },
  { id:'task_003', title:'介绍你的家乡', prompt:'用30秒介绍你的家乡，让没去过的人想去看看', scenario_label:'课堂展示', difficulty_level:2, time_limit_seconds:30, key_points:['地理位置','特色或美食','个人情感'], fluency_weight:0.6, logic_weight:0.4 },
  { id:'task_004', title:'手机应该带入课堂吗', prompt:'你认为手机应该被带入课堂吗？说出你的观点和3个理由', scenario_label:'观点陈述', difficulty_level:2, time_limit_seconds:60, key_points:['明确观点','2-3个支撑理由','逻辑因果链','总结句'], fluency_weight:0.4, logic_weight:0.6 },
  { id:'task_005', title:'AI会取代老师吗', prompt:'你认为人工智能会取代老师吗？亮出你的立场并给出理由', scenario_label:'观点陈述', difficulty_level:3, time_limit_seconds:60, key_points:['明确观点','正反面分析','支撑论据','总结'], fluency_weight:0.4, logic_weight:0.6 },
  { id:'task_006', title:'高中生应该兼职吗', prompt:'高中生应该做兼职吗？陈述你的观点和理由', scenario_label:'观点陈述', difficulty_level:2, time_limit_seconds:60, key_points:['明确观点','利弊分析','个人建议'], fluency_weight:0.4, logic_weight:0.6 },
  { id:'task_007', title:'面试自我介绍', prompt:'面试官问：请用1分钟介绍你自己。请突出你的优势和特点', scenario_label:'自我介绍', difficulty_level:2, time_limit_seconds:60, key_points:['基本信息','核心优势','独特经历','未来期望'], fluency_weight:0.5, logic_weight:0.5 },
  { id:'task_008', title:'社团招新自我介绍', prompt:'你想加入学校的辩论社，请用30秒做自我介绍，说服学长姐录取你', scenario_label:'自我介绍', difficulty_level:1, time_limit_seconds:30, key_points:['姓名','相关经历','加入动机'], fluency_weight:0.5, logic_weight:0.5 },
  { id:'task_009', title:'升学复试自我介绍', prompt:'大学面试官请你用1分钟做自我介绍，展示你的学术潜力和个人特质', scenario_label:'自我介绍', difficulty_level:3, time_limit_seconds:90, key_points:['学术背景','研究兴趣','个人特质','未来规划'], fluency_weight:0.5, logic_weight:0.5 },
  { id:'task_010', title:'如果你是校长', prompt:'如果你是校长，你会改变学校的什么？说出你的想法', scenario_label:'即兴表达', difficulty_level:2, time_limit_seconds:60, key_points:['改变方向','原因分析','预期效果'], fluency_weight:0.5, logic_weight:0.5 },
  { id:'task_011', title:'最难忘的一天', prompt:'描述你最难忘的一天，让听众感同身受', scenario_label:'即兴表达', difficulty_level:1, time_limit_seconds:60, key_points:['时间地点','关键事件','情感转折','感悟'], fluency_weight:0.5, logic_weight:0.5 },
  { id:'task_012', title:'给十年前的自己一句话', prompt:'如果能给十年前的自己带一句话，你会说什么？为什么', scenario_label:'即兴表达', difficulty_level:2, time_limit_seconds:30, key_points:['核心信息','原因','情感共鸣'], fluency_weight:0.5, logic_weight:0.5 },
  { id:'task_013', title:'一次失败的经历', prompt:'讲一次你失败的经历，以及你从中学到了什么', scenario_label:'故事演讲', difficulty_level:2, time_limit_seconds:90, key_points:['背景铺垫','冲突高潮','结果','反思成长'], fluency_weight:0.6, logic_weight:0.4 },
  { id:'task_014', title:'一个改变你的瞬间', prompt:'讲一个改变你看法或人生方向的瞬间', scenario_label:'故事演讲', difficulty_level:2, time_limit_seconds:60, key_points:['场景描述','转折点','改变内容','感悟'], fluency_weight:0.6, logic_weight:0.4 },
  { id:'task_015', title:'我最敬佩的人', prompt:'介绍你最敬佩的一个人，讲讲他/她的故事对你的影响', scenario_label:'故事演讲', difficulty_level:1, time_limit_seconds:60, key_points:['人物介绍','敬佩原因','具体事例','对你的影响'], fluency_weight:0.6, logic_weight:0.4 },
  { id:'task_016', title:'青少年理财的必要性', prompt:'论青少年应该学习理财的必要性，给出你的论证', scenario_label:'竞赛备赛', difficulty_level:3, time_limit_seconds:90, key_points:['论点明确','2-3个论据','因果论证','反方驳斥','总结升华'], fluency_weight:0.3, logic_weight:0.7 },
  { id:'task_017', title:'科技与人文的平衡', prompt:'在AI时代，如何看待科技发展与人文关怀的平衡？请展开论述', scenario_label:'竞赛备赛', difficulty_level:3, time_limit_seconds:90, key_points:['核心观点','正反论证','案例支撑','价值判断','总结'], fluency_weight:0.3, logic_weight:0.7 },
  { id:'task_018', title:'社交媒体对青少年的影响', prompt:'论述社交媒体对青少年的影响，你认为利大于弊还是弊大于利', scenario_label:'竞赛备赛', difficulty_level:2, time_limit_seconds:90, key_points:['明确立场','正面影响','负面影响','建议措施','总结'], fluency_weight:0.3, logic_weight:0.7 },
];

const FILLER_WORDS = ['嗯','啊','那个','就是','然后','这个','呃','嘛','吧','呢'];

// ===== 用户状态管理 =====
function getDefaultState() {
  return { character_level:'novice_speaker', character_name:'演讲新手', total_xp:0, current_streak_days:0, longest_streak_days:0, last_practice_date:null, ability_scores:{ fluency:[], logic:[] }, total_practices:0 };
}
function loadState() {
  try { const s = localStorage.getItem('speech_coach_state'); return s ? JSON.parse(s) : getDefaultState(); } catch { return getDefaultState(); }
}
function saveState(state) { try { localStorage.setItem('speech_coach_state', JSON.stringify(state)); } catch {} }

function getLevelInfo(totalXP) {
  if (totalXP >= 200) return { level:3, name:'辩论骑士', avatar:'K', nextXP:400 };
  if (totalXP >= 50) return { level:2, name:'演讲达人', avatar:'D', nextXP:200 };
  return { level:1, name:'演讲新手', avatar:'N', nextXP:50 };
}

function getTodayString() { return new Date().toISOString().split('T')[0]; }

function getDailyTasks() {
  const today = getTodayString();
  const seed = today.split('-').join('') | 0;
  const shuffled = [...TASKS].sort((a,b) => {
    const ha = (a.id.charCodeAt(5) * seed + a.id.charCodeAt(6) * 7) % 100;
    const hb = (b.id.charCodeAt(5) * seed + b.id.charCodeAt(6) * 7) % 100;
    return ha - hb;
  });
  return shuffled.slice(0, 3);
}

// ===== 评分逻辑 =====
function scoreFluency(transcript, durationSeconds) {
  const cleanText = transcript.replace(/\s/g, '');
  const charCount = cleanText.length;
  const durationMinutes = durationSeconds > 0 ? durationSeconds / 60 : 1;
  const charsPerMinute = durationMinutes > 0 ? Math.round(charCount / durationMinutes) : 0;
  const { fillerCount, fillerWords } = detectFillerWords(transcript);
  const pauseCount = estimatePauses(transcript, charCount);
  const repetitionCount = detectRepetition(transcript);
  const detail = { chars_per_minute:charsPerMinute, filler_count:fillerCount, filler_words:fillerWords, pause_count:pauseCount, duration_seconds:durationSeconds, char_count:charCount };
  const score = determineGrade(charsPerMinute, fillerCount, durationMinutes, repetitionCount);
  return { score, detail };
}

function detectFillerWords(text) {
  const foundWords = []; let totalCount = 0;
  for (const word of FILLER_WORDS) {
    const regex = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    const matches = text.match(regex);
    if (matches && matches.length > 0) { totalCount += matches.length; for (let i = 0; i < matches.length; i++) foundWords.push(word); }
  }
  return { fillerCount: totalCount, fillerWords: foundWords };
}

function estimatePauses(text, charCount) {
  if (charCount === 0) return 0;
  const sentenceEndMarks = text.match(/[。！？.!?]/g) || [];
  const sentenceEndCount = sentenceEndMarks.length;
  const midMarks = text.match(/[，,；;、]/g) || [];
  const midCount = midMarks.length;
  const expectedSentences = Math.ceil(charCount / 18);
  const missingPauses = Math.max(0, expectedSentences - sentenceEndCount);
  if (sentenceEndCount + midCount === 0 && charCount > 20) return Math.ceil(charCount / 15);
  return missingPauses + Math.floor(midCount / 3);
}

function detectRepetition(text) {
  const repeatPattern = /([\u4e00-\u9fa5]{1,4})\1+/g;
  const matches = text.match(repeatPattern);
  return matches ? matches.length : 0;
}

function determineGrade(charsPerMinute, fillerCount, durationMinutes, repetitionCount) {
  const fillersPerMinute = durationMinutes > 0 ? fillerCount / durationMinutes : fillerCount;
  if (charsPerMinute === 0) return 'D';
  if (fillersPerMinute > 8 || charsPerMinute < 80 || charsPerMinute > 400) return 'D';
  if (fillersPerMinute > 3 || charsPerMinute < 150 || charsPerMinute > 350) return 'C';
  if (fillersPerMinute < 3 && charsPerMinute >= 150 && charsPerMinute <= 300) {
    if (repetitionCount >= 3) return 'C';
    return 'B';
  }
  if (fillersPerMinute < 1 && charsPerMinute >= 180 && charsPerMinute <= 280 && repetitionCount <= 1) return 'A';
  return 'B';
}

function mockLogicScore(task, transcript) {
  const cleanText = transcript.replace(/\s/g, '');
  const charCount = cleanText.length;
  const coveredPoints = task.key_points.filter(kp => {
    const keywords = kp.split(/[，,、和]/).filter(w => w.length > 1);
    return keywords.some(kw => transcript.includes(kw));
  });
  const coverageRatio = task.key_points.length > 0 ? coveredPoints.length / task.key_points.length : 0;
  const hasOpening = charCount > 20;
  const hasConclusion = /总结|综上|所以|因此|总之|最后|以上/.test(transcript) || charCount > 80;
  const supportKeywords = ['因为','所以','第一','第二','第三','首先','其次','然后','另外','此外','而且','同时'];
  const supportPoints = supportKeywords.reduce((c, kw) => c + (transcript.includes(kw) ? 1 : 0), 0);
  const promptKeywords = task.prompt.replace(/[？?，,。.、！!]/g, '').split('').filter(c => /[\u4e00-\u9fa5]/.test(c));
  const onTopic = promptKeywords.length > 0 ? promptKeywords.some(kw => transcript.includes(kw)) : charCount > 10;
  let score = 'D';
  const structureScore = (hasOpening?1:0) + (hasConclusion?1:0) + (supportPoints>=2?1:0) + (onTopic?1:0) + (coverageRatio>0.5?1:0);
  if (structureScore >= 4 && coverageRatio > 0.5) score = 'B';
  else if (structureScore >= 3) score = 'C';
  else if (structureScore >= 2) score = 'C';
  else score = 'D';
  if (coverageRatio >= 0.8 && structureScore >= 4 && charCount > 50) score = 'B';
  const missingPoints = task.key_points.filter(kp => {
    const keywords = kp.split(/[，,、和]/).filter(w => w.length > 1);
    return !keywords.some(kw => transcript.includes(kw));
  });
  const strongMoments = [];
  if (hasOpening) strongMoments.push('有明确的开头');
  if (hasConclusion) strongMoments.push('有总结收尾');
  if (supportPoints >= 2) strongMoments.push('有多个支撑点');
  if (coverageRatio > 0.5) strongMoments.push('覆盖了大部分关键点');
  const oneThingToFix = missingPoints.length > 0 ? `建议补充"${missingPoints[0]}"相关内容` : '尝试让表达更有条理，使用"第一、第二、第三"等连接词';
  return { score, detail: { has_opening:hasOpening, support_points:Math.min(supportPoints,5), has_conclusion:hasConclusion, on_topic:onTopic }, one_thing_to_fix:oneThingToFix, strong_moments:strongMoments, missing_points: missingPoints.length > 0 ? missingPoints : ['暂无明确缺失点'] };
}

function aggregateGrade(fluencyScore, logicScore, fluencyWeight, logicWeight) {
  const g2n = { A:4, B:3, C:2, D:1 };
  const n2g = { 4:'A', 3:'B', 2:'C', 1:'D' };
  const weighted = g2n[fluencyScore] * fluencyWeight + g2n[logicScore] * logicWeight;
  return n2g[Math.max(1, Math.min(4, Math.round(weighted)))];
}

function calculateXP(task, overallGrade) {
  return 10 + task.difficulty_level * 5 + ({ A:15, B:10, C:5, D:0 })[overallGrade];
}

// ===== 页面渲染 =====
let currentTask = null;

function renderHome() {
  const state = loadState();
  const levelInfo = getLevelInfo(state.total_xp);
  const today = getTodayString();
  if (state.last_practice_date !== today) {
    if (state.last_practice_date) {
      const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      if (state.last_practice_date === yesterday) state.current_streak_days = 0;
    }
  }

  // 角色面板
  const xpInCurrentLevel = state.total_xp;
  const xpForNext = levelInfo.nextXP;
  const xpPercent = Math.min(100, (xpInCurrentLevel / xpForNext) * 100);
  document.getElementById('charPanel').innerHTML = `
    <div class="char-header">
      <div class="char-avatar">${levelInfo.avatar}</div>
      <div>
        <div class="char-name">${levelInfo.name}</div>
        <div class="char-level">Lv.${levelInfo.level} · 累计 XP ${state.total_xp}</div>
      </div>
    </div>
    <div class="xp-bar-wrap">
      <div class="xp-label"><span>经验值</span><span>${xpInCurrentLevel} / ${xpForNext}</span></div>
      <div class="xp-bar"><div class="xp-bar-fill" style="width:${xpPercent}%"></div></div>
    </div>
    <div class="streak-badge">连续打卡 ${state.current_streak_days} 天 · 累计练习 ${state.total_practices} 次</div>
  `;

  // 能力面板
  const fluencyGrades = state.ability_scores.fluency.slice(-5);
  const logicGrades = state.ability_scores.logic.slice(-5);
  let abilityHTML = `
    <div class="ability-row">
      <span class="ability-label">流利度</span>
      <div class="ability-grades">${renderMiniGrades(fluencyGrades)}</div>
    </div>
    <div class="ability-row">
      <span class="ability-label">逻辑力</span>
      <div class="ability-grades">${renderMiniGrades(logicGrades)}</div>
    </div>
  `;
  document.getElementById('abilityPanel').innerHTML = abilityHTML;

  // 每日任务
  const dailyTasks = getDailyTasks();
  document.getElementById('taskList').innerHTML = dailyTasks.map(t => `
    <button class="task-card" onclick="startPractice('${t.id}')">
      <div class="task-card-header">
        <div class="task-card-title">${t.title}</div>
        <div class="task-difficulty">${'★'.repeat(t.difficulty_level)}${'☆'.repeat(3-t.difficulty_level)}</div>
      </div>
      <div class="task-card-prompt">${t.prompt}</div>
      <div class="task-card-meta">
        <span class="task-tag">${t.scenario_label}</span>
        <span class="task-tag">${t.time_limit_seconds}秒</span>
      </div>
    </button>
  `).join('');
}

function renderMiniGrades(grades) {
  const slots = 5;
  let html = '';
  for (let i = 0; i < slots; i++) {
    if (i < grades.length) {
      html += `<span class="mini-grade ${grades[i]}">${grades[i]}</span>`;
    } else {
      html += `<span class="mini-grade empty">-</span>`;
    }
  }
  return html;
}

function startPractice(taskId) {
  currentTask = TASKS.find(t => t.id === taskId);
  if (!currentTask) return;
  showPage('page-practice');
  renderPractice();
}

function renderPractice() {
  const t = currentTask;
  document.getElementById('practiceContent').innerHTML = `
    <div class="practice-prompt">
      <div class="practice-prompt-label">演讲题目</div>
      <div class="practice-prompt-text">${t.prompt}</div>
      <div class="key-points">
        <div class="key-points-title">关键要点：</div>
        ${t.key_points.map(kp => `<span class="key-point-tag">${kp}</span>`).join('')}
      </div>
    </div>

    <div class="timer-display" id="timerDisplay">${formatTime(t.time_limit_seconds)}</div>
    <div class="timer-bar"><div class="timer-bar-fill" id="timerBar" style="width:100%"></div></div>

    <div class="card">
      <div class="section-title" style="font-size:16px">输入你的演讲内容</div>
      <textarea class="text-input-area" id="transcriptInput" placeholder="在此输入你的演讲内容，尽量模拟真实演讲的语速和表达..." oninput="onTextInput()"></textarea>
      <div style="font-size:13px;color:var(--text-light);margin-top:8px" id="charCount">0 字</div>
    </div>

    <button class="btn btn-primary" id="submitBtn" disabled onclick="submitPractice()">
      提交评分
    </button>
  `;
  startTimer(t.time_limit_seconds);
}

let timerInterval = null;
let timerStartTime = null;
function startTimer(duration) {
  if (timerInterval) clearInterval(timerInterval);
  timerStartTime = Date.now();
  const update = () => {
    const elapsed = Math.floor((Date.now() - timerStartTime) / 1000);
    const remaining = Math.max(0, duration - elapsed);
    document.getElementById('timerDisplay').textContent = formatTime(remaining);
    document.getElementById('timerBar').style.width = (remaining / duration * 100) + '%';
    if (remaining === 0) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  };
  update();
  timerInterval = setInterval(update, 1000);
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function onTextInput() {
  const text = document.getElementById('transcriptInput').value.trim();
  document.getElementById('charCount').textContent = `${text.replace(/\s/g,'').length} 字`;
  document.getElementById('submitBtn').disabled = text.length < 5;
}

function submitPractice() {
  const transcript = document.getElementById('transcriptInput').value.trim();
  if (transcript.length < 5) return;

  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  const elapsed = Math.floor((Date.now() - timerStartTime) / 1000);
  const duration = Math.max(elapsed, 5);

  // 评分
  const fluencyResult = scoreFluency(transcript, duration);
  const logicResult = mockLogicScore(currentTask, transcript);
  const overallGrade = aggregateGrade(fluencyResult.score, logicResult.score, currentTask.fluency_weight, currentTask.logic_weight);
  const xpEarned = calculateXP(currentTask, overallGrade);

  const result = {
    fluency_score: fluencyResult.score,
    fluency_detail: fluencyResult.detail,
    logic_score: logicResult.score,
    logic_detail: logicResult.detail,
    overall_grade: overallGrade,
    one_thing_to_fix: logicResult.one_thing_to_fix,
    strong_moments: logicResult.strong_moments,
    missing_points: logicResult.missing_points,
    confidence: 'low',
    warnings: ['演示模式：使用模拟评分（离线版不含 AI 评分）。完整版请访问线上链接。'],
    xp_earned: xpEarned,
    transcript,
    mode: 'mock',
    task_title: currentTask.title,
  };

  // 更新用户状态
  const state = loadState();
  const today = getTodayString();
  state.total_xp += xpEarned;
  state.total_practices += 1;
  if (state.last_practice_date !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
    if (state.last_practice_date === yesterday) state.current_streak_days += 1;
    else state.current_streak_days = 1;
    state.last_practice_date = today;
  }
  if (state.current_streak_days > state.longest_streak_days) state.longest_streak_days = state.current_streak_days;
  state.ability_scores.fluency.push(fluencyResult.score);
  state.ability_scores.logic.push(logicResult.score);
  if (state.ability_scores.fluency.length > 10) state.ability_scores.fluency.shift();
  if (state.ability_scores.logic.length > 10) state.ability_scores.logic.shift();
  saveState(state);

  renderResult(result);
  showPage('page-result');
}

function renderResult(r) {
  const gradeText = { A:'优秀', B:'良好', C:'及格', D:'需加油' };
  document.getElementById('resultContent').innerHTML = `
    <button class="back-btn" onclick="goHome()">&larr; 返回首页</button>

    <div class="result-header">
      <div class="result-overall-grade ${r.overall_grade}">${r.overall_grade}</div>
      <div class="result-title">${gradeText[r.overall_grade]}</div>
      <div class="result-xp">+${r.xp_earned} XP</div>
    </div>

    ${r.warnings.length > 0 ? `<div class="warnings-box">${r.warnings.join('<br>')}</div>` : ''}

    <div class="score-row">
      <div class="score-card">
        <div class="score-card-label">流利度</div>
        <div class="score-card-grade ${r.fluency_score}">${r.fluency_score}</div>
        <div class="score-card-detail">
          ${r.fluency_detail.chars_per_minute} 字/分<br>
          ${r.fluency_detail.filler_count} 个口头禅<br>
          ${r.fluency_detail.pause_count} 处停顿
        </div>
      </div>
      <div class="score-card">
        <div class="score-card-label">逻辑力</div>
        <div class="score-card-grade ${r.logic_score}">${r.logic_score}</div>
        <div class="score-card-detail">
          ${r.logic_detail.has_opening ? '有开头' : '缺开头'}<br>
          ${r.logic_detail.support_points} 个支撑点<br>
          ${r.logic_detail.has_conclusion ? '有结尾' : '缺结尾'}
        </div>
      </div>
    </div>

    <div class="card detail-card">
      <div class="detail-card-title">流利度详情</div>
      <div class="detail-item"><span>语速</span><span class="detail-item-value">${r.fluency_detail.chars_per_minute} 字/分钟</span></div>
      <div class="detail-item"><span>字数</span><span class="detail-item-value">${r.fluency_detail.char_count} 字</span></div>
      <div class="detail-item"><span>时长</span><span class="detail-item-value">${r.fluency_detail.duration_seconds} 秒</span></div>
      <div class="detail-item"><span>口头禅</span><span class="detail-item-value">${r.fluency_detail.filler_count} 次 ${r.fluency_detail.filler_words.length > 0 ? '(' + [...new Set(r.fluency_detail.filler_words)].join('、') + ')' : ''}</span></div>
      <div class="detail-item"><span>停顿估算</span><span class="detail-item-value">${r.fluency_detail.pause_count} 处</span></div>
    </div>

    <div class="card detail-card">
      <div class="detail-card-title">逻辑力分析</div>
      <div class="detail-item"><span>有明确开头</span><span class="detail-item-value">${r.logic_detail.has_opening ? '是' : '否'}</span></div>
      <div class="detail-item"><span>支撑论据数</span><span class="detail-item-value">${r.logic_detail.support_points} 个</span></div>
      <div class="detail-item"><span>有总结收尾</span><span class="detail-item-value">${r.logic_detail.has_conclusion ? '是' : '否'}</span></div>
      <div class="detail-item"><span>切合主题</span><span class="detail-item-value">${r.logic_detail.on_topic ? '是' : '否'}</span></div>
    </div>

    <div class="card detail-card">
      <div class="detail-card-title">AI 建议</div>
      <div class="feedback-item">
        <span class="feedback-icon">&#9888;</span>
        <span class="feedback-text">${r.one_thing_to_fix}</span>
      </div>
      ${r.strong_moments.map(s => `<div class="feedback-item"><span class="feedback-icon" style="color:var(--color-success)">&#10003;</span><span class="feedback-text">${s}</span></div>`).join('')}
      ${r.missing_points.map(m => `<div class="feedback-item"><span class="feedback-icon" style="color:var(--color-danger)">&#10007;</span><span class="feedback-text">缺少：${m}</span></div>`).join('')}
    </div>

    <div class="card detail-card">
      <div class="detail-card-title">你的演讲内容</div>
      <div style="font-size:14px;color:var(--text-secondary);line-height:1.8;white-space:pre-wrap">${r.transcript}</div>
    </div>

    <button class="btn btn-primary" onclick="goHome()">继续练习</button>
  `;
}

function goHome() {
  showPage('page-home');
  renderHome();
}

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  window.scrollTo(0, 0);
}

// ===== 初始化 =====
renderHome();
</script>
</body>
</html>
