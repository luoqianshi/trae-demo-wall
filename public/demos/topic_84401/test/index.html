<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手语翻译助手 - 增强版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <!-- 中国手语词汇库 (100个词) -->
    <script src="js/csl_model.js"></script>
    <!-- 中国手语TFJS模型加载器 -->
    <script src="js/model_loader.js"></script>
    <style>
        :root {
            --bg-page: #FAFAF8;
            --bg-warm: #F5F0EB;
            --surface: #FFFFFF;
            --surface-elevated: #FFFFFF;
            --border: #E8E4DE;
            --border-strong: #D8D2C8;
            --text-primary: #1A1A1A;
            --text-secondary: #5C5C5C;
            --text-tertiary: #8A8A8A;
            --text-inverse: #FFFFFF;
            --accent: #E85A4F;
            --accent-hover: #D44738;
            --accent-light: #FCE8E5;
            --accent-amber: #F4A261;
            --accent-success: #2A9D8F;
            --accent-success-light: #E0F0EE;
            --accent-danger: #E76F51;
            --accent-danger-light: #FCEAE5;
            --accent-warning: #F4A261;
            --accent-warning-light: #FCEBD9;
            --shadow-sm: 0 1px 2px rgba(26, 26, 26, 0.04);
            --shadow-md: 0 2px 8px rgba(26, 26, 26, 0.06), 0 1px 2px rgba(26, 26, 26, 0.04);
            --shadow-lg: 0 8px 24px rgba(26, 26, 26, 0.08), 0 2px 6px rgba(26, 26, 26, 0.04);
            --shadow-xl: 0 20px 48px rgba(26, 26, 26, 0.10), 0 4px 12px rgba(26, 26, 26, 0.05);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 14px;
        }

        .app-shell {
            max-width: 1280px;
            margin: 0 auto;
            padding: var(--space-lg);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-lg) var(--space-xl);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            margin-bottom: var(--space-lg);
            box-shadow: var(--shadow-sm);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-amber) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(232, 90, 79, 0.25);
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .brand-text p {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            font-weight: 400;
            margin-top: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: 6px 14px;
            background: var(--bg-warm);
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }

        .status-dot.active {
            background: var(--accent-success);
            box-shadow: 0 0 0 4px rgba(42, 157, 143, 0.2);
            animation: pulse-soft 2s ease-in-out infinite;
        }

        .status-dot.recording {
            background: var(--accent-danger);
            box-shadow: 0 0 0 4px rgba(231, 111, 81, 0.2);
            animation: pulse-soft 1s ease-in-out infinite;
        }

        .status-dot.loading {
            background: var(--accent-warning);
            animation: pulse-soft 1.5s ease-in-out infinite;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
            margin-bottom: var(--space-lg);
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-lg) var(--space-xl);
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .panel-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-icon.sign {
            background: var(--accent-light);
            color: var(--accent);
        }

        .panel-icon.voice {
            background: var(--accent-warning-light);
            color: var(--accent-warning);
        }

        .panel-icon svg {
            width: 20px;
            height: 20px;
        }

        .panel-text h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .panel-text p {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            font-weight: 400;
            margin-top: 2px;
        }

        .panel-status {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .panel-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }

        .panel-status-dot.active {
            background: var(--accent-success);
            animation: pulse-soft 2s ease-in-out infinite;
        }

        .panel-status-dot.recording {
            background: var(--accent-danger);
            animation: pulse-soft 1s ease-in-out infinite;
        }

        .panel-status-dot.loading {
            background: var(--accent-warning);
            animation: pulse-soft 1.5s ease-in-out infinite;
        }

        .panel-status-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .panel-status-label.active {
            color: var(--accent-success);
        }

        .panel-status-label.recording {
            color: var(--accent-danger);
        }

        .panel-body {
            padding: var(--space-xl);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .video-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #0F0F0F;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .video-stage video,
        .video-stage canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-stage canvas {
            z-index: 2;
            pointer-events: none;
        }

        .video-overlay {
            position: absolute;
            top: var(--space-md);
            left: var(--space-md);
            right: var(--space-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .rec-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-full);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .rec-tag::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-danger);
            border-radius: 50%;
            animation: pulse-soft 1s ease-in-out infinite;
        }

        .rec-tag.hidden {
            display: none;
        }

        .timestamp {
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-full);
            color: white;
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', monospace;
        }

        .subtitle-area {
            margin-top: var(--space-md);
            min-height: 72px;
            background: var(--bg-warm);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-md) var(--space-lg);
        }

        .subtitle-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .subtitle-label {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .subtitle-text {
            font-size: 1.25rem;
            color: var(--text-primary);
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.01em;
        }

        .subtitle-text.placeholder {
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .subtitle-confidence {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            background: var(--surface);
            padding: 4px 12px;
            border-radius: var(--radius-full);
            margin-top: 4px;
        }

        .controls {
            margin-top: var(--space-lg);
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 150ms ease;
            white-space: nowrap;
            background: var(--surface);
            color: var(--text-primary);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--text-inverse);
            border-color: var(--accent);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border-color: var(--border-strong);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-warm);
        }

        .btn-success {
            background: var(--accent-success);
            color: var(--text-inverse);
            border-color: var(--accent-success);
        }

        .btn-success:hover:not(:disabled) {
            background: #21867A;
            border-color: #21867A;
        }

        .btn-danger {
            background: var(--accent-danger);
            color: var(--text-inverse);
            border-color: var(--accent-danger);
        }

        .btn-danger:hover:not(:disabled) {
            background: #C95940;
            border-color: #C95940;
        }

        .btn-warning {
            background: var(--accent-warning);
            color: var(--text-inverse);
            border-color: var(--accent-warning);
        }

        .btn-warning:hover:not(:disabled) {
            background: #D88849;
            border-color: #D88849;
        }

        .input-block {
            background: var(--bg-warm);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-label svg {
            width: 12px;
            height: 12px;
        }

        .input-block textarea {
            width: 100%;
            min-height: 88px;
            padding: var(--space-md);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.5;
            resize: vertical;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .input-block textarea::placeholder {
            color: var(--text-tertiary);
        }

        .input-block textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .animation-stage {
            position: relative;
            width: 100%;
            height: 280px;
            background: #0F0F0F;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .animation-stage canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .animation-stage .stage-text {
            position: absolute;
            bottom: var(--space-lg);
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-full);
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .stage-empty {
            color: var(--text-tertiary);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .stage-empty svg {
            width: 32px;
            height: 32px;
            opacity: 0.5;
        }

        .gesture-guide {
            margin-top: var(--space-lg);
            padding: var(--space-md);
            background: var(--bg-warm);
            border-radius: var(--radius-md);
        }

        .gesture-guide-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .gesture-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
        }

        .gesture-list::-webkit-scrollbar {
            width: 4px;
        }

        .gesture-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .gesture-list::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: var(--radius-full);
        }

        .gesture-tag {
            padding: 4px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 150ms ease;
        }

        .gesture-tag:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        .gesture-category-header {
            width: 100%;
            padding: 8px 0 4px 0;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px dashed var(--border);
            margin-bottom: 4px;
        }

        .history-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-lg) var(--space-xl);
            border-bottom: 1px solid var(--border);
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .history-title svg {
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        .history-title h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .history-count {
            padding: 4px 10px;
            background: var(--bg-warm);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .history-list {
            max-height: 240px;
            overflow-y: auto;
            padding: var(--space-md);
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: var(--radius-full);
        }

        .history-empty {
            padding: var(--space-2xl);
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.85rem;
        }

        .history-item {
            display: flex;
            align-items: flex-start;
            gap: var(--space-md);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            margin-bottom: 4px;
            transition: background 150ms ease;
        }

        .history-item:hover {
            background: var(--bg-warm);
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.95rem;
        }

        .history-icon.sign {
            background: var(--accent-light);
            color: var(--accent);
        }

        .history-icon.voice {
            background: var(--accent-warning-light);
            color: var(--accent-warning);
        }

        .history-content {
            flex: 1;
            min-width: 0;
        }

        .history-text {
            font-size: 0.875rem;
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 2px;
            word-wrap: break-word;
        }

        .history-time {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(250, 250, 248, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: var(--space-md);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .loading-progress {
            width: 200px;
            height: 4px;
            background: var(--bg-warm);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: var(--radius-full);
            width: 0%;
            transition: width 0.3s ease;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .toast-container {
            position: fixed;
            bottom: var(--space-xl);
            right: var(--space-xl);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .model-info {
            margin-top: var(--space-lg);
            padding: var(--space-md);
            background: var(--accent-success-light);
            border: 1px solid var(--accent-success);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .model-info-icon {
            font-size: 1.2rem;
        }

        .model-info-text {
            font-size: 0.85rem;
            color: var(--accent-success);
            font-weight: 500;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            .top-bar {
                flex-direction: column;
                gap: var(--space-md);
                align-items: flex-start;
            }
        }

        @media (max-width: 640px) {
            .app-shell {
                padding: var(--space-md);
            }

            .top-bar,
            .panel-header,
            .history-header {
                padding: var(--space-md);
            }

            .panel-body {
                padding: var(--space-md);
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .animation-stage {
                height: 220px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">正在加载模型...</div>
        <div class="loading-progress">
            <div class="loading-progress-bar" id="loadingProgress"></div>
        </div>
    </div>

    <div class="app-shell">
        <header class="top-bar">
            <div class="brand">
                <div class="brand-mark">🤟</div>
                <div class="brand-text">
                    <h1>手语翻译助手</h1>
                    <p>AI驱动 · 实时识别 · 中国手语</p>
                </div>
            </div>
            <div class="status-badge" id="systemStatus">
                <span class="status-dot" id="systemStatusDot"></span>
                <span id="systemStatusText">系统就绪</span>
            </div>
        </header>

        <div class="workspace">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <div class="panel-icon sign">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                        </div>
                        <div class="panel-text">
                            <h2>手语识别</h2>
                            <p>AI实时捕捉手部动作</p>
                        </div>
                    </div>
                    <div class="panel-status">
                        <span class="panel-status-dot" id="signStatusDot"></span>
                        <span class="panel-status-label" id="signStatusLabel">待启动</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="video-stage">
                        <video id="signVideo" playsinline autoplay muted></video>
                        <canvas id="signCanvas"></canvas>
                        <div class="video-overlay">
                            <div class="rec-tag hidden" id="recTag">REC</div>
                            <div class="timestamp" id="timestamp">00:00</div>
                        </div>
                    </div>
                    <div class="subtitle-area">
                        <div class="subtitle-content">
                            <div class="subtitle-label">识别结果</div>
                            <div class="subtitle-text placeholder" id="signSubtitle">准备就绪</div>
                            <div class="subtitle-confidence" id="confidenceText" style="display: none;">置信度: --%</div>
                            <div class="subtitle-debug" id="debugText" style="display: none; font-size: 0.7rem; color: #888; margin-top: 4px;"></div>
                        </div>
                    </div>
                    <div class="controls">
                        <button class="btn btn-primary" id="startSignBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            开始识别
                        </button>
                        <button class="btn btn-secondary" id="stopSignBtn" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="6" y="6" width="12" height="12"/>
                            </svg>
                            停止
                        </button>
                        <button class="btn btn-success" id="speakBtn" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                            </svg>
                            播放语音
                        </button>
                    </div>
                    <div class="model-info" id="modelInfo" style="display: none;">
                        <span class="model-info-icon">🧠</span>
                        <span class="model-info-text">AI模型已加载，支持50+种手势识别</span>
                    </div>
                    <div class="gesture-guide">
                        <div class="gesture-guide-header">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
                                <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74"/>
                                <path d="M18.37 16.37c-.78.78-2.05.78-2.83 0L14 14.83V17c0 .55-.45 1-1 1H9c-.55 0-1-.45-1-1v-4.17l-1.54 1.54c-.78.78-2.05.78-2.83 0"/>
                            </svg>
                            支持的手势（50+种）
                        </div>
                        <div class="gesture-list" id="gestureList">
                            <span class="gesture-tag">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <div class="panel-icon voice">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="23"/>
                                <line x1="8" y1="23" x2="16" y2="23"/>
                            </svg>
                        </div>
                        <div class="panel-text">
                            <h2>语音转手语</h2>
                            <p>文字转换为手势动画</p>
                        </div>
                    </div>
                    <div class="panel-status">
                        <span class="panel-status-dot" id="voiceStatusDot"></span>
                        <span class="panel-status-label" id="voiceStatusLabel">待启动</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="input-block">
                        <div class="input-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 7V4h16v3"/>
                                <path d="M9 20h6"/>
                                <path d="M12 4v16"/>
                            </svg>
                            输入文字或语音
                        </div>
                        <textarea id="textInput" placeholder="输入要转换的文字，或点击下方按钮进行语音输入..."></textarea>
                    </div>
                    <div class="controls">
                        <button class="btn btn-warning" id="startVoiceBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="23"/>
                                <line x1="8" y1="23" x2="16" y2="23"/>
                            </svg>
                            语音输入
                        </button>
                        <button class="btn btn-primary" id="convertBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                            </svg>
                            转换手语
                        </button>
                    </div>
                    <div class="animation-stage" id="animationStage">
                        <canvas id="animationCanvas"></canvas>
                        <div class="stage-text" id="animationText">等待输入</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <div class="history-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <h2>翻译历史</h2>
                </div>
                <span class="history-count" id="historyCount">0 条</span>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">暂无历史记录</div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
