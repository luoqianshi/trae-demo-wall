  position: fixed;
  padding: 8px 8px 8px 10px;
  height: 28px;
  width: 130px;
  z-index: 9999;
}

.trae-badge:hover.trae-badge--light {
  background-color: #EDEFF2;
}

.trae-badge:hover.trae-badge--dark {
  background-color: #2A2D31;
}

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

}

  visibility: hidden;
  z-index: 10001;

  justify-content: center;

}

}

          function getLuminance(r, g, b) {
            return 0.299 * r + 0.587 * g + 0.114 * b;
          }
          
          function parseColor(color) {
            const rgbaMatch = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*[\d.]+)?\)/);
            if (rgbaMatch) {
              return [parseInt(rgbaMatch[1]), parseInt(rgbaMatch[2]), parseInt(rgbaMatch[3])];
            }
            
            const hexMatch = color.match(/^#([0-9a-f]{6})$/i);
            if (hexMatch) {
              const hex = hexMatch[1];
              return [
                parseInt(hex.substr(0, 2), 16),
                parseInt(hex.substr(2, 2), 16),
                parseInt(hex.substr(4, 2), 16)
              ];
            }
            
            const hexShortMatch = color.match(/^#([0-9a-f]{3})$/i);
            if (hexShortMatch) {
              const hex = hexShortMatch[1];
              return [
                parseInt(hex[0] + hex[0], 16),
                parseInt(hex[1] + hex[1], 16),
                parseInt(hex[2] + hex[2], 16)
              ];
            }
            
            return null;
          }
          
          function detectBackgroundColor(element) {
            let targetElement;
            
            if (typeof element === 'string') {
              const found = document.querySelector(element);
              console.debug('Target element found:', found);
              if (!found) return 'rgb(255, 255, 255)';
              targetElement = found;
            } else if (element) {
              targetElement = element;
            } else {
              targetElement = document.body;
            }
            
            let currentElement = targetElement;
            
            while (currentElement && currentElement !== document.documentElement) {
              const computedStyle = window.getComputedStyle(currentElement);
              const backgroundColor = computedStyle.backgroundColor;
              
              console.debug('Checking element:', currentElement.tagName, currentElement.id, currentElement.className);
              console.debug('Background color:', backgroundColor);
              
              if (backgroundColor && backgroundColor !== 'rgba(0, 0, 0, 0)' && backgroundColor !== 'transparent') {
                console.debug('Found background color:', backgroundColor, 'on element:', currentElement);
                return backgroundColor;
              }
              
              currentElement = currentElement.parentElement;
            }
            
            const bodyStyle = window.getComputedStyle(document.body);
            const bodyBackground = bodyStyle.backgroundColor;
            console.debug('Body background:', bodyBackground);
            if (bodyBackground && bodyBackground !== 'rgba(0, 0, 0, 0)' && bodyBackground !== 'transparent') {
              return bodyBackground;
            }
            
            const htmlStyle = window.getComputedStyle(document.documentElement);
            const htmlBackground = htmlStyle.backgroundColor;
            console.debug('HTML background:', htmlBackground);
            if (htmlBackground && htmlBackground !== 'rgba(0, 0, 0, 0)' && htmlBackground !== 'transparent') {
              return htmlBackground;
            }
            
            console.debug('No background found, returning default white');
            return 'rgb(255, 255, 255)';
          }
          
          function autoSelectTheme(container) {
            const backgroundColor = detectBackgroundColor(container);
            const rgb = parseColor(backgroundColor);
            
            console.debug('TRAE Badge Plugin - Background detection:', {
              container,
              backgroundColor,
              rgb
            });
            
            if (!rgb) {
              console.debug('TRAE Badge Plugin - No RGB found, using dark theme');
              return 'dark';
            }
            
            const [r, g, b] = rgb;
            const luminance = getLuminance(r, g, b);
            const selectedTheme = luminance > 128 ? 'dark' : 'light';
            
            console.debug('TRAE Badge Plugin - Theme selection:', {
              luminance,
              selectedTheme,
              reason: luminance > 128 ? 'Light background -> Dark badge' : 'Dark background -> Light badge'
            });
            
            return selectedTheme;
          }
        
              
              // 注入样式
              const style = document.createElement('style');
              style.id = 'trae-badge-plugin-styles';
              style.textContent = css;
              document.head.appendChild(style);
              
              // 创建 Badge 函数
              function createBadge() {
                // 移除已存在的 badge
                const existingBadge = document.getElementById('trae-badge-plugin');
                if (existingBadge) {
                  existingBadge.remove();
                }
                
                // 确定主题
                let variant = 'dark';
                if (true) {
                  variant = autoSelectTheme('#root');
                }
                
                const isDarkBackground = variant === 'dark';
                const logoType = isDarkBackground ? 'light' : 'dark';
                const cancelIcon = isDarkBackground ? cancelLight : cancelDark;
                
                const badge = document.createElement('div');
                badge.id = 'trae-badge-plugin';
                badge.className = `trae-badge trae-badge--${variant} trae-badge--bottom-right`;
                badge.innerHTML = `
                  <div class="trae-badge-content">
                    <div class="trae-badge-logo">${logos[logoType]}</div>
                    <div class="trae-badge-share">${shareIcon}</div>
                  </div>
                  <div class="trae-badge-cancel">${cancelIcon}</div>
                `;
                
                // 添加点击事件
                
                badge.style.cursor = 'pointer';
                badge.addEventListener('click', (e) => {
                  if (e.target.closest('.trae-badge-cancel')) return;
                  window.open('https://www.trae.ai/solo?showJoin=1', '_blank');
                });
                
                
                // 添加取消按钮事件
                const cancelButton = badge.querySelector('.trae-badge-cancel');
                if (cancelButton) {
                  cancelButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    badge.remove();
                  });
                }
                
                document.body.appendChild(badge);
                return badge;
              }
              
              // 初始创建 badge
              // 等待 React 组件渲染完成后再创建 badge
              function initBadge() {
                // 使用 requestAnimationFrame 等待渲染完成
                requestAnimationFrame(() => {
                  // 再次检查目标元素是否存在
                  const targetElement = document.querySelector('#root');
                  if (targetElement) {
                    const badge = createBadge();
                  } else {
                    // 如果还没有找到，等待一段时间再试
                    setTimeout(() => {
                      const badge = createBadge();
                    }, 500);
                  }
                });
              }
              
              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBadge);
              } else {
                // DOM 已经加载完成，但 React 可能还没渲染
                initBadge();
              }
              
              window.TraeBadgePlugin = { 
                destroy: () => {
                  const badge = document.getElementById('trae-badge-plugin');
                  if (badge) badge.remove();
                  style.remove();
                  delete window.TraeBadgePlugin;
                },
                recreate: createBadge
              };
            })();

s:{lens:"内在秩序",shortLine:"外面喧闹时，先守住你能支配的那一小块心。",method:"我会问这个选择是否让你更安定、更不被外界牵着走。真正要紧的，不是别人如何评价，而是你如何管理自己的判断。",because:"它更能守住你的内在秩序",followUp:"若没人评价你，你还会这样选吗？"},descartes:{lens:"清晰证据",shortLine:"把模糊的感觉擦亮一点，答案才有地方站住。",method:"我会先怀疑那些最顺手的念头：这是事实，还是你替事实穿上的外衣？清楚之后再投票，才不算被雾牵走。",because:"它让事实和理由更清楚",followUp:"你现在最确定的一条事实是什么？最不确定的一条又是什么？"},austen:{lens:"体面下的真心",shortLine:"礼貌可以保护你，但别让礼貌替真心坐牢。",method:"我会细看那些细小信号：谁在主动，谁在回避，谁只是在维持好看的场面。好的选择应当既保留体面，也不牺牲真实。",because:"它更能兼顾体面和真心",followUp:"你是在等一个明确回应，还是在替对方的含糊找理由？"},dickens:{lens:"真实处境",shortLine:"别只审判自己，也看看生活把你推到了哪里。",method:"我会把你的疲惫、钱、关系和日常都算进去。人不是在抽象里做选择，而是在一间有灯、有账单、有心事的屋子里做选择。",because:"它更贴近你真实的生活处境",followUp:"如果把现实压力也算作证人，它会替哪一边说话？"},tolstoy:{lens:"不自欺的生活",shortLine:"最难的不是选择，而是不再替欲望起一个高尚的名字。",method:"我会追问你是否在用漂亮理由遮住真实欲望。若一个选择让你更诚实地面对爱、责任与虚荣，它就已经胜过许多体面的答案。",because:"它更少自欺，也更接近真实生活",followUp:"你给这件事的理由里，哪一句最像借口？"},tagore:{lens:"轻与自由",shortLine:"让心透一口气，路才会自己显出一点光。",method:"我会听这件事有没有让生命变得更开阔。不是逃避现实，而是在现实里给心留一扇窗。",because:"它让心更轻，也让生活有一点风",followUp:"哪一个选择让你想到明天时，呼吸更松一点？"},twain:{lens:"拆穿装腔",shortLine:"人最累的时候，常常是在认真扮演一个没那么想当的人。",method:"我会先戳破那些太体面的说法。若一个选择只是为了显得成熟、懂事、漂亮，那它很可能比看上去更贵。",because:"它少一点装样子，多一点真实",followUp:"如果不用显得懂事，你会怎么选？"},andersen:{lens:"童话里的刺",shortLine:"温柔的故事里，也常藏着一根很清醒的针。",method:"我会看这个选择有没有保护你心里那点柔软。天真不是糊涂，真正的童话也会提醒人别把冷风当成命运。",because:"它更珍惜你心里那点柔软",followUp:"这件事里，你最想被谁温柔地看见？"},hugo:{lens:"尊严与宽阔",shortLine:"人在低处做的选择，更要给尊严留一盏灯。",method:"我会把人的处境看得大一些：痛苦、误解、责任都在场。好的选择不是最轻松，而是让你不必缩小自己。",because:"它更能保住你的尊严和宽阔",followUp:"哪一个选择会让你以后回头看时，不觉得自己被压低了？"},davinci:{lens:"跨界试验",shortLine:"先画一张草图，别急着给整个人生封顶。",method:"我会把选择当成一张可以修改的手稿。先观察结构，再做小样，灵感往往在手动起来之后才肯出现。",because:"它给好奇心和试错留了空间",followUp:"这件事有没有一个可以先画草图的小版本？"},michelangelo:{lens:"雕刻掉多余",shortLine:"有时答案不是加出来的，是把多余的恐惧凿掉。",method:"我会问哪一个选择更像在释放你原本的形状。别被石块外面那层粗糙吓住，真正的线条要靠持续敲打出来。",because:"它更像把你真实的轮廓雕出来",followUp:"你现在最该凿掉的，是外界期待，还是自己的胆怯？"},monet:{lens:"此刻的光",shortLine:"同一片水面，换一束光，心里的颜色就不同。",method:"我会看这个选择给你带来的日常光线。别只算终点，也看看过程里你会不会重新看见颜色。",because:"它让当下的生活更有颜色",followUp:"想到哪一边时，你的日常画面会亮一点？"},vangogh:{lens:"燃烧的热爱",shortLine:"若心里那团火还在，就别急着把自己过成灰。",method:"我会认真对待你的热爱和疼痛。不是每份强烈都该被压下去，有些光如果总被否认，会在心里烧得更孤单。",because:"它更尊重你心里那团还没熄的火",followUp:"这件事里，哪一部分让你疼，但也让你觉得自己还活着？"},beethoven:{lens:"逆境里的主旋律",shortLine:"命运敲门时，也可以把它写进你的节拍。",method:"我会听哪一个选择更像你的主旋律。困难不会因为退后就消失，但你可以决定它是噪音，还是乐章的一部分。",because:"它让你继续掌握自己的主旋律",followUp:"如果这是一段乐章，哪一个选择让你听见继续往前的力度？"},mozart:{lens:"轻盈的天赋",shortLine:"别把所有快乐都审问成罪，有些旋律本来就该轻轻响起。",method:"我会替轻盈投一票。生活不只需要正确，也需要一点自然而然的流动感。",because:"它让你少一点沉重，多一点自然的轻快",followUp:"哪一个选择让你觉得事情开始有旋律，而不是只有规矩？"},bach:{lens:"秩序与复调",shortLine:"再复杂的心事，也可以找到自己的和声。",method:"我会把你的几重顾虑当作复调来听。好的选择不是消灭所有声音，而是让它们不再互相打架。",because:"它让复杂关系更有秩序",followUp:"这件事里，哪几条声音其实可以共存？"},hokusai:{lens:"浪头与尺度",shortLine:"浪看似要吞人，换个尺度，它也只是一笔。",method:"我会把眼前的巨浪放远一点看。若一个选择能让你从恐惧里退半步，重新看见整体构图，它就值得考虑。",because:"它让你从更大的尺度看见局面",followUp:"这件事如果放到三个月后看，还会像现在这么大吗？"},xuxiake:{lens:"亲自走到现场",shortLine:"路在纸上总嫌远，走出去才知道山风多大。",method:"我会相信脚下的验证。若一直在屋里想，山永远只是传闻；先走一段，才知道自己真正怕什么、爱什么。",because:"它能让你亲自得到答案",followUp:"你能不能先走一小段，而不是一次把全程走完？"},xuanzang:{lens:"初心与远路",shortLine:"路远不怕，怕的是走着走着忘了为何出发。",method:"我会问这个选择是否仍朝向你的初心。辛苦可以忍，偏离却要警惕。",because:"它没有离开你真正要去的方向",followUp:"你最初想要的那个东西，现在还在这条路上吗？"},zhenghe:{lens:"远航与筹备",shortLine:"想去远海，就先把船、风和粮都算清楚。",method:"我会支持开阔，但不支持莽撞。真正的远航不是一时兴起，而是把风险、资源和回程都想过。",because:"它既有开阔，也留了航海的准备",followUp:"如果要出海，你现在缺的是勇气、地图，还是补给？"},amundsen:{lens:"极地计划",shortLine:"浪漫可以点火，但穿越冰原靠的是预案。",method:"我会看哪一边准备更充分。真正的冒险不是不怕冷，而是知道冷会从哪里来。",because:"它更重视风险和预案",followUp:"最坏情况出现时，你有哪一条退路？"},nightingale:{lens:"照护与秩序",shortLine:"先把灯点亮，人才能看见自己还撑得住。",method:"我会先看你的身心是否还能承受。好的选择要照顾现实，也要照顾那个已经很累的你。",because:"它更照顾你的能量和恢复",followUp:"你现在最需要的是答案，还是先被好好照顾一下？"},montessori:{lens:"成长环境",shortLine:"人会在合适的环境里，慢慢长出自己的答案。",method:"我会问哪个选择更能给你空间、节奏和自主感。被催出来的决定，常常不是长出来的决定。",because:"它更像一个能让你成长的环境",followUp:"哪一边给你的成长空间更多，而不是只给压力？"},"helen-keller":{lens:"黑暗里的触感",shortLine:"看不见全路时，也可以先握住一件真实的东西。",method:"我会珍惜那些可触摸的线索：谁让你更有力量，哪件事让你更清楚地活着。希望不是口号，是下一步能摸到的扶手。",because:"它给你更真实的力量感",followUp:"这件事里，哪一个细节让你觉得自己还有力量？"},dewey:{lens:"从经验中学习",shortLine:"决定不是考试，是一次会反过来教育你的经验。",method:"我会选择能带来学习反馈的那边。别把答案想成终点，它也可以是一堂课。",because:"它能让你从经验里学到东西",followUp:"如果这次选择是一堂课，你最想学会什么？"},"sha-seng":{lens:"踏实收拾残局",shortLine:"挑担的人知道，路不是靠热闹走完的。",method:"我会看哪一边更踏实、更少后患。风头可以给别人，日子还得自己一步步担着。",because:"它更稳，也更能把后面的路走完",followUp:"热闹散了以后，哪一个选择更经得起日常？"},watson:{lens:"普通人的可靠观察",shortLine:"天才会破案，朋友会问你疼不疼。",method:"我会把人的感受和事实一起记下来。别只追求聪明的答案，也要看它是否让你被好好对待。",because:"它更像一个可靠朋友会支持的选择",followUp:"如果你最好的朋友听见这件事，会先担心你哪里？"},robinson:{lens:"孤岛预案",shortLine:"先看手里有什么，再谈远处的海。",method:"我会从资源、风险和自救能力看这件事。再大的选择，也要先问今天能不能搭起一间小屋。",because:"它更利于你在现实里站稳",followUp:"如果只能靠你现有资源，哪一边更撑得住？"},gulliver:{lens:"换一个国家看自己",shortLine:"换个地方看，同一件事会露出不同的荒唐。",method:"我会把你从熟悉的比例里拿出来看。也许你以为天大的顾虑，在另一个尺度里只是习惯的绳结。",because:"它让你跳出原来的尺度和偏见",followUp:"如果换一个完全不同的人来看，他会觉得你被什么困住了？"},jigong:{lens:"破规矩里的慈悲",shortLine:"鞋破一点不要紧，心别被规矩磨破了。",method:"我会先看人心是否通畅。太讲面子、太怕不像样，有时反而把活路堵住了；能让你松一口气的选择，不一定就不正经。",because:"它让人心更通，也少些死规矩",followUp:"你怕的是真后果，还是怕别人说你不像样？"},jobs:{lens:"聚焦与取舍",shortLine:"真正重要的东西，值得你把噪音都关掉。",method:"我会先问这件事是不是足够重要，重要到值得你为它删掉别的东西。好的选择不是功能最多，而是能让你把注意力重新收回来。",because:"它更聚焦，也更接近你真正想留下的东西",followUp:"如果只能保留一个理由，哪一个选择还站得住？"},musk:{lens:"第一性原理",shortLine:"别先问大家怎么做，先问这件事物理上能不能成立。",method:"我会把恐惧、面子和惯例拆掉，只留下成本、速度、反馈和真实限制。若一个选择能快速验证核心假设，就比原地优化焦虑更有价值。",because:"它能更快验证问题的底层假设",followUp:"如果把这件事拆到最小事实，哪一条是真的限制，哪一条只是惯例？"},feynman:{lens:"好奇心实验",shortLine:"如果你不能把它讲简单，可能还没真正想清楚。",method:"我会先把这个选择讲给一个聪明的小孩听：哪里会让你兴奋，哪里只是吓人的术语。能被亲手试一下、讲明白的那边，通常更靠谱。",because:"它更能通过亲手验证把复杂问题变简单",followUp:"你能不能用一句最朴素的话说明，你到底想验证什么？"},munger:{lens:"反过来想",shortLine:"想变聪明之前，先避开那些显而易见的蠢事。",method:"我会先反过来想：哪一个选择更容易让你后悔、上头、重复旧错误。少犯大错，本身就是很高级的判断。",because:"它更少暴露在愚蠢风险里",followUp:"如果这事最后失败，最可能是因为哪一个低级错误？"},buffett:{lens:"长期和安全边际",shortLine:"别为一晚上的情绪，买下一整年的麻烦。",method:"我会看这件事能不能长期持有：成本是否清楚，最坏情况是否承受得住，十天后你是否还愿意为它买单。",because:"它更有长期安全边际",followUp:"如果把时间拉长到一年，哪一边仍然值得你持有？"},"wang-yangming":{lens:"知行合一",shortLine:"心里已知的事，别再拿犹豫装作不知道。",method:"我会问你真正的良知已经偏向哪里。若只是困在脑中反复推演，不如从一个可行的小行动开始，让心和手重新合在一起。",because:"它让内心判断落到真实行动里",followUp:"你心里其实已经知道哪一步，只是还没敢做？"},"zhuge-liang":{lens:"审势与后手",shortLine:"未出茅庐先看三分，动身之前先看后路。",method:"我会先盘资源、时机、对方反应和退路。不是每个愿望都要立刻北伐，能把局势算清再动，胜算才不靠运气。",because:"它更能兼顾时机、资源和后手",followUp:"若明日局势有变，你手里还有哪一张牌？"},caesar:{lens:"跨河的决断",shortLine:"有些河不能永远站在岸边研究水温。",method:"我会看窗口是否已经打开，代价是否已经明摆着。若继续观望只是在消耗机会，跨过去反而比停在岸边更诚实。",because:"它更像一次承担后果的明确行动",followUp:"你是在等待更好的时机，还是在害怕跨河之后不能回头？"},liucixin:{lens:"尺度和长期后果",shortLine:"把镜头拉远一点，眼前的风浪会露出真正的形状。",method:"我会把这件事放到更长的时间尺度里看：它会改变你的轨道，还是只改变今晚的心情。尺度一变，很多紧张会变小，真正重要的也会凸显。",because:"它更经得起长期尺度的审视",followUp:"如果从三年后的你回看，哪一个选择仍然有意义？"},yuhua:{lens:"荒诞里的真实",shortLine:"生活有时很荒唐，但人不能连自己的疼都不承认。",method:"我会先承认这事里有点可笑，也有点疼。别急着把自己包装得很体面，普通人的选择常常就是在难受里找一条还能走的路。",because:"它更诚实地承认了普通人的真实处境",followUp:"这件事里最荒唐、但也最真实的地方是什么？"},moyan:{lens:"人性和命运",shortLine:"人心不是白纸，选择也不是干净的算术题。",method:"我会看欲望、人情、面子和命运怎样缠在一起。若一个选择承认复杂，却仍给你留一点活路，它比漂亮口号更可靠。",because:"它更能容纳人性的复杂和现实的牵扯",followUp:"你最不愿承认的那个欲望，是否也在替某一边说话？"},qiongyao:{lens:"爱与表达",shortLine:"爱若总被咽下去，委屈就会替它开口。",method:"我会认真看这段关系里的表达欲。若你一直把想说的话压成体面，最后伤人的未必是选择，而是那些没被说出口的心。",because:"它让情感被认真表达，而不是被委屈代替",followUp:"你最想被对方听见的一句话是什么？"},"eileen-chang":{lens:"爱情里的冷眼",shortLine:"漂亮的体面底下，常有一点凉得很真实。",method:"我会看那些细节：谁在等，谁在躲，谁把体面当作感情的遮羞布。能让你看清真实关系的选择，哪怕凉一点，也比热闹的自欺好。",because:"它更能看清关系里真实的欲望和隐痛",followUp:"这段关系里，哪一个细节最能说明真相？"}},b2={科学派:{lens:"证据和实验",shortLine:"先让现实给一点反馈，再让情绪下结论。",method:"我会把这件事拆成可观察的小实验，先看事实如何回应，再决定要不要继续。",because:"它更利于观察和验证",followUp:"最小的一次验证可以怎么做？"},艺术派:{lens:"体验和生命感",shortLine:"有些答案不是算出来的，是心里先亮了一下。",method:"我会看哪一边让你的生活重新有颜色，同时也不把现实成本丢到画框外。",because:"它让体验更有生命感",followUp:"哪一个选择让你想到明天时更有颜色？"},文学派:{lens:"情绪暗线",shortLine:"真正难选的，从来不是选项，而是选项背后那点人心。",method:"我会看这件事里没说出口的委屈、期待和体面，别让心事只在夜里演独角戏。",because:"它更诚实地回应了你的处境",followUp:"你最没有说出口的那句话是什么？"},思想派:{lens:"自我和价值",shortLine:"一个小选择，也会暴露你把什么看得更重。",method:"我会问你在守住什么、躲开什么，以及这个选择会把你带成怎样的人。",because:"它更接近你想成为什么样的人",followUp:"这个选择会让你更像谁期待的你，还是更像真实的你？"},行动探索派:{lens:"小步行动",shortLine:"地图看一百遍，也替代不了脚下第一步。",method:"我会看哪一边能打开局面；只要风险可控，先走一小段，世界会给你回声。",because:"它能让事情从脑内走到现实",followUp:"你能先走
