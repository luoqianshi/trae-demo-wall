<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心晴日记 — AI校园情绪日记</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #fdf6f0 0%, #e8f4f8 50%, #f0e6f6 100%);
            min-height: 100vh;
            color: #4a4a4a;
            line-height: 1.6;
        }

        /* ===== 页头 ===== */
        header {
            text-align: center;
            padding: 36px 20px 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(200, 180, 180, 0.2);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff9a9e, #a18cd1, #89b5e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.95rem;
            color: #888;
            letter-spacing: 2px;
        }

        /* ===== 主布局 ===== */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 60px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* ===== 卡片通用 ===== */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 4px 24px rgba(160, 140, 180, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: box-shadow 0.3s;
        }

        .card:hover {
            box-shadow: 0 6px 32px rgba(160, 140, 180, 0.18);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #6b5b95;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            font-size: 1.3rem;
        }

        /* ===== 日记输入区 ===== */
        .diary-card {
            grid-column: 1 / 2;
        }

        .date-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .date-row input[type="date"] {
            padding: 8px 14px;
            border: 1.5px solid #e0d4e8;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #6b5b95;
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            transition: border-color 0.3s;
        }

        .date-row input[type="date"]:focus {
            border-color: #a18cd1;
        }

        .uid-info {
            font-size: 0.78rem;
            color: #aaa;
            margin-left: auto;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 16px;
            border: 1.5px solid #e0d4e8;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.8;
            resize: vertical;
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            transition: border-color 0.3s;
            color: #4a4a4a;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #bbb;
        }

        textarea:focus {
            border-color: #a18cd1;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a18cd1, #89b5e0);
            color: #fff;
            box-shadow: 0 4px 14px rgba(161, 140, 209, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(161, 140, 209, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(161, 140, 209, 0.12);
            color: #6b5b95;
        }

        .btn-secondary:hover {
            background: rgba(161, 140, 209, 0.22);
        }

        .btn-export {
            background: linear-gradient(135deg, #89b5e0, #a8d8ea);
            color: #fff;
            box-shadow: 0 4px 14px rgba(137, 181, 224, 0.3);
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(137, 181, 224, 0.4);
        }

        /* ===== 情绪识别结果 ===== */
        .emotion-result {
            text-align: center;
            padding: 18px;
            margin-top: 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.6);
            display: none;
        }

        .emotion-result.show {
            display: block;
            animation: fadeInUp 0.4s ease;
        }

        .emotion-tag {
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        .emotion-label {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .emotion-confidence {
            font-size: 0.85rem;
            color: #999;
        }

        /* ===== 疏导建议 ===== */
        .advice-card {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }

        .advice-content {
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 235, 235, 0.5), rgba(235, 245, 255, 0.5));
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.9;
            color: #5a5a5a;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .advice-content.has-advice {
            justify-content: flex-start;
            text-align: left;
        }

        .advice-placeholder {
            color: #bbb;
            font-size: 0.9rem;
        }

        /* ===== 数据看板 ===== */
        .dashboard-card {
            grid-column: 1 / -1;
        }

        .chart-container {
            width: 100%;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chart-container canvas {
            width: 100% !important;
            max-height: 360px;
        }

        .chart-empty {
            color: #bbb;
            font-size: 0.95rem;
            text-align: center;
        }

        .dashboard-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .month-selector {
            padding: 8px 16px;
            border: 1.5px solid #e0d4e8;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #6b5b95;
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .month-selector:focus {
            border-color: #a18cd1;
        }

        /* ===== 日记历史列表 ===== */
        .history-card {
            grid-column: 1 / -1;
        }

        .diary-list {
            max-height: 420px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .diary-list::-webkit-scrollbar {
            width: 5px;
        }

        .diary-list::-webkit-scrollbar-thumb {
            background: #d4c5e0;
            border-radius: 4px;
        }

        .diary-item {
            padding: 16px 18px;
            border-radius: 14px;
            background: rgba(245, 240, 248, 0.6);
            margin-bottom: 12px;
            border-left: 4px solid #a18cd1;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition: background 0.3s;
        }

        .diary-item:hover {
            background: rgba(245, 240, 248, 0.9);
        }

        .diary-item .diary-emoji {
            font-size: 1.8rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .diary-item .diary-body {
            flex: 1;
            min-width: 0;
        }

        .diary-item .diary-date {
            font-size: 0.82rem;
            color: #999;
            margin-bottom: 4px;
        }

        .diary-item .diary-text {
            font-size: 0.92rem;
            color: #5a5a5a;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .diary-item .diary-mood-label {
            font-size: 0.78rem;
            color: #a18cd1;
            font-weight: 600;
            margin-top: 4px;
        }

        .diary-item .btn-delete {
            padding: 6px 14px;
            border: 1.5px solid #f0b8b8;
            border-radius: 8px;
            background: rgba(255, 220, 220, 0.4);
            color: #d48080;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .diary-item .btn-delete:hover {
            background: rgba(255, 200, 200, 0.7);
            border-color: #e8a0a0;
        }

        .empty-history {
            text-align: center;
            color: #bbb;
            font-size: 0.92rem;
            padding: 40px 0;
        }

        /* ===== 页脚 ===== */
        footer {
            text-align: center;
            padding: 24px 20px 36px;
            font-size: 0.82rem;
            color: #bbb;
            letter-spacing: 1px;
        }

        footer span.highlight {
            color: #a18cd1;
            font-weight: 600;
        }

        /* ===== Toast 通知 ===== */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 14px 24px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            font-size: 0.9rem;
            color: #4a4a4a;
            animation: slideIn 0.35s ease;
            backdrop-filter: blur(10px);
            border-left: 4px solid #a18cd1;
        }

        .toast.success {
            border-left-color: #81c995;
        }

        .toast.warning {
            border-left-color: #f5c06e;
        }

        /* ===== 动画 ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.5s ease;
        }

        /* ===== 删除确认弹窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: 18px;
            padding: 32px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
        }

        .modal-box h3 {
            font-size: 1.1rem;
            color: #4a4a4a;
            margin-bottom: 10px;
        }

        .modal-box p {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-cancel {
            padding: 10px 24px;
            border: 1.5px solid #e0d4e8;
            border-radius: 12px;
            background: transparent;
            color: #888;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background: rgba(0, 0, 0, 0.04);
        }

        .btn-danger {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #f093a0, #e88090);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(240, 147, 160, 0.4);
        }

        /* ===== 音乐推荐弹窗 ===== */
        .music-box {
            background: #fff;
            border-radius: 22px;
            padding: 32px 30px 24px;
            max-width: 400px;
            width: 92%;
            text-align: center;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.12);
        }

        .music-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .music-header .music-icon {
            font-size: 1.6rem;
        }

        .music-header h3 {
            font-size: 1.08rem;
            color: #6b5b95;
            font-weight: 600;
        }

        .music-mood-label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 18px;
        }

        .music-player-card {
            display: flex;
            align-items: center;
            gap: 18px;
            background: linear-gradient(135deg, rgba(255,235,235,0.4), rgba(235,245,255,0.4));
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 18px;
        }

        .music-disc {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8d5f5, #d5e8f5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(160, 140, 180, 0.2);
            animation: none;
        }

        .music-disc.spinning {
            animation: spin 4s linear infinite;
        }

        .music-disc-inner {
            font-size: 1.4rem;
            color: #8b7aad;
        }

        .music-info {
            text-align: left;
            min-width: 0;
        }

        .music-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #5a5a5a;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-artist {
            font-size: 0.82rem;
            color: #aaa;
        }

        .music-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 14px;
        }

        .music-btn {
            padding: 9px 22px;
            border: none;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .music-btn-play {
            background: linear-gradient(135deg, #a18cd1, #89b5e0);
            color: #fff;
            box-shadow: 0 3px 12px rgba(161, 140, 209, 0.3);
        }

        .music-btn-play:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 16px rgba(161, 140, 209, 0.4);
        }

        .music-btn-pause {
            background: linear-gradient(135deg, #f5c06e, #f0b060);
            color: #fff;
            box-shadow: 0 3px 12px rgba(245, 192, 110, 0.3);
        }

        .music-btn-stop {
            background: rgba(160, 140, 180, 0.12);
            color: #6b5b95;
        }

        .music-btn-stop:hover {
            background: rgba(160, 140, 180, 0.22);
        }

        .music-btn-close {
            background: transparent;
            border: 1.5px solid #e0d4e8;
            color: #aaa;
            font-size: 0.82rem;
            padding: 8px 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .music-btn-close:hover {
            background: rgba(0, 0, 0, 0.03);
            color: #888;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- ===== 页头 ===== -->
    <header>
        <h1>☁️ 心晴日记</h1>
        <p>AI 校园情绪日记 — 你的心灵小树洞</p>
    </header>

    <!-- ===== 主内容 ===== -->
    <main>
        <!-- 日记输入 -->
        <section class="card diary-card fade-in">
            <h2 class="card-title"><span class="icon">✏️</span> 记录此刻心情</h2>
            <div class="date-row">
                <input type="date" id="diaryDate">
                <span class="uid-info" id="uidDisplay"></span>
            </div>
            <textarea id="diaryText" placeholder="今天心情如何？写下你的故事吧……&#10;&#10;可以分享你的学业压力、社交困惑、生活小确幸，任何想说的话都可以写在这里 🌿"></textarea>

            <!-- 情绪识别结果 -->
            <div class="emotion-result" id="emotionResult">
                <div class="emotion-tag" id="emotionTag"></div>
                <div class="emotion-label" id="emotionLabel"></div>
                <div class="emotion-confidence" id="emotionConfidence"></div>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" id="btnAnalyze">🔍 识别情绪</button>
                <button class="btn btn-primary" id="btnSave" style="display:none;">💾 保存日记</button>
            </div>
        </section>

        <!-- 疏导建议 -->
        <section class="card advice-card fade-in">
            <h2 class="card-title"><span class="icon">💚</span> 温暖小提示</h2>
            <div class="advice-content" id="adviceContent">
                <span class="advice-placeholder">写下你的心情日记后，点击"识别情绪"，这里会出现专属于你的暖心小建议 ✨</span>
            </div>
        </section>

        <!-- 数据看板 -->
        <section class="card dashboard-card fade-in">
            <h2 class="card-title"><span class="icon">📊</span> 月度情绪看板</h2>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
                <label style="font-size:0.88rem;color:#888;">选择月份：</label>
                <input type="month" class="month-selector" id="chartMonth">
            </div>
            <div class="chart-container" id="chartContainer">
                <canvas id="moodChart"></canvas>
            </div>
            <div class="chart-empty" id="chartEmpty" style="display:none;">暂无该月数据，快去记录你的第一篇日记吧 🌱</div>
            <div class="dashboard-actions">
                <button class="btn btn-export" id="btnExport">📥 导出全部日记 (CSV)</button>
            </div>
        </section>

        <!-- 日记历史 -->
        <section class="card history-card fade-in">
            <h2 class="card-title"><span class="icon">📖</span> 日记回顾</h2>
            <div class="diary-list" id="diaryList">
                <div class="empty-history">还没有日记记录，开始书写你的第一篇心情日记吧 🌸</div>
            </div>
        </section>
    </main>

    <!-- ===== 页脚 ===== -->
    <footer>
        <span class="highlight">造份新善意</span> · 校园心理健康公益项目 · 心晴日记 &copy; 2026
    </footer>

    <!-- ===== Toast 容器 ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== 删除确认弹窗 ===== -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <h3>确认删除</h3>
            <p>删除后无法恢复，确定要删除这篇日记吗？</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="btnCancelDelete">取消</button>
                <button class="btn-danger" id="btnConfirmDelete">确认删除</button>
            </div>
        </div>
    </div>

    <!-- ===== 舒缓音乐推荐弹窗 ===== -->
    <div class="modal-overlay" id="musicModal">
        <div class="music-box">
            <div class="music-header">
                <span class="music-icon">🎵</span>
                <h3>为你推荐一首舒缓音乐</h3>
            </div>
            <p class="music-mood-label" id="musicMoodLabel"></p>
            <div class="music-player-card">
                <div class="music-disc" id="musicDisc">
                    <div class="music-disc-inner">♫</div>
                </div>
                <div class="music-info">
                    <div class="music-name" id="musicName">--</div>
                    <div class="music-artist" id="musicArtist">--</div>
                </div>
            </div>
            <audio id="musicAudio" preload="auto"></audio>
            <div class="music-controls">
                <button class="music-btn music-btn-play" id="musicBtnPlay">▶ 播放</button>
                <button class="music-btn music-btn-pause" id="musicBtnPause" style="display:none;">⏸ 暂停</button>
                <button class="music-btn music-btn-stop" id="musicBtnStop">⏹ 关闭</button>
            </div>
            <button class="music-btn-close" id="musicBtnClose">暂不收听，我很好</button>
        </div>
    </div>

    <!-- ===== 引入核心逻辑 ===== -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="mood_logic.js"></script>
</body>
</html>
