<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记一笔 · AI 趣味记账助手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <!-- 顶部 -->
  <header class="header">
    <h1 class="logo">记一笔</h1>
    <p class="tagline">说句话，就记好了</p>
  </header>

  <!-- 录入区 -->
  <section class="input-section">
    <div class="input-row">
      <input
        type="text"
        id="recordInput"
        class="record-input"
        placeholder='试试输入"午饭25"或"星巴克35"'
        autocomplete="off"
      >
      <button id="parseBtn" class="btn-primary">记一笔</button>
    </div>

    <!-- 解析预览 -->
    <div id="parsePreview" class="parse-preview" style="display:none;">
      <div class="preview-header">AI 解析结果</div>
      <div class="preview-body">
        <div class="preview-item">
          <span class="preview-label">描述</span>
          <span id="previewDesc" class="preview-value"></span>
        </div>
        <div class="preview-item">
          <span class="preview-label">金额</span>
          <span id="previewAmount" class="preview-value accent"></span>
        </div>
        <div class="preview-item">
          <span class="preview-label">分类</span>
          <span id="previewCategory" class="preview-value"></span>
        </div>
        <div class="preview-item">
          <span class="preview-label">日期</span>
          <span id="previewDate" class="preview-value"></span>
        </div>
      </div>
      <div class="preview-actions">
        <button id="confirmBtn" class="btn-primary">确认记录</button>
        <button id="cancelBtn" class="btn-secondary">取消</button>
      </div>
    </div>

    <!-- 解析失败提示 -->
    <div id="parseError" class="parse-error" style="display:none;">
      没看懂这句话，试试类似"午饭25"的格式吧
    </div>

    <!-- 快捷示例 -->
    <div id="quickChips" class="quick-chips">
      <span class="chip" data-text="午饭25">午饭25</span>
      <span class="chip" data-text="星巴克35">星巴克35</span>
      <span class="chip" data-text="打车12.5">打车12.5</span>
      <span class="chip" data-text="奶茶15">奶茶15</span>
      <span class="chip" data-text="买衣服200">买衣服200</span>
    </div>
  </section>

  <!-- 今日概览 -->
  <section class="summary-section">
    <div class="summary-card">
      <div class="summary-item">
        <div id="todayTotal" class="summary-value accent">¥0.00</div>
        <div class="summary-label">今日支出</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div id="todayCount" class="summary-value">0</div>
        <div class="summary-label">今日笔数</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div id="monthTotal" class="summary-value">¥0.00</div>
        <div class="summary-label">本月支出</div>
      </div>
    </div>
  </section>

  <!-- 消费洞察 -->
  <section class="insight-section">
    <div class="records-header">
      <h2 class="section-title">消费洞察</h2>
      <span id="insightPeriod" class="insight-period">本周</span>
    </div>
    <div id="insightContent" class="insight-content">
      <div class="empty-state">记几笔账，AI 就能帮你分析消费规律</div>
    </div>
  </section>

  <!-- 记录列表 -->
  <section class="records-section">
    <div class="records-header">
      <h2 class="section-title">记账记录</h2>
      <button id="clearBtn" class="btn-text">清空</button>
    </div>
    <div id="recordsList" class="records-list">
      <div class="empty-state">
        还没记过账，试试输入"午饭25"
      </div>
    </div>
  </section>

  <!-- 底部 -->
  <footer class="footer">
    <div class="footer-line"></div>
    <p class="footer-brand">记一笔 · AI 趣味记账助手</p>
    <p class="footer-meta">TRAE AI 创造力大赛 · 生活娱乐赛道</p>
  </footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
