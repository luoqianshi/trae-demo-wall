力回落`,steps:`1. 觉察到精力下降时不对抗 2. 对自己说「精力回落是自然的」 3. 允许自己放慢节奏 4. 将回落视为蓄力而非退步`,duration:10,timeAnchor:`全天`,evidence:`A`,category:`emotionRegulation`,sourceMantra:`姤`,why:`参同契云「姤始端绪，履霜最先」，接纳回落是姤卦心法——阴长是天道，对抗只会加速消耗，接纳方能蓄力待时`,studentLabel:`随时`,studentScenario:`anytime`},{id:`gou_time_1`,title:`巳时集中处理要务`,steps:`1. 列出今日1-2件必要事务 2. 巳时集中精力完成 3. 午时前确认核心任务完成 4. 午后不再开启新任务`,duration:30,timeAnchor:`巳时`,evidence:`B`,category:`timeManagement`,sourceMantra:`姤`,why:`参同契云「阴伸阳屈」，巳时是姤卦最后的阳气高峰，集中处理要务是趁阳尚盛时完成核心工作，午后阴长则精力不济`,studentLabel:`上午课/自习`,studentScenario:`study`},{id:`gou_comm_2`,title:`观察他人态度变化`,steps:`1. 今日留意1位关系密切者的态度 2. 记录其语气或行为有无微妙变化 3. 若有变化则找时机温和询问 4. 及时沟通化解潜在误解`,duration:5,timeAnchor:`全天`,evidence:`D`,category:`communication`,sourceMantra:`姤`,why:`参同契云「井底寒泉」，人际变数如井底寒泉暗暗涌动，观察微妙变化是履霜知坚冰的警觉，及时沟通方能防微杜渐`,studentLabel:`随时`,studentScenario:`anytime`}],totalDuration:65},actionReviewQuestions:[`今天做了哪些行动？哪个行动让你最贴近心法「一阴初生，防微杜渐」？`,`哪个计划行动没有完成？是什么阻碍了你？`,`明日最想继续哪个行动？想新增什么？`],cantongqiDaily:{verse:{id:`gou_04`,original:`阴伸阳屈，没阳姓名`,translation:`阴气伸展而阳气屈缩，阳气的名号逐渐被淹没。`,interpretation:`此句描述姤卦之后阴长阳消的趋势。「阴伸」指阴气从初生开始伸展壮大，「阳屈」指阳气从极盛开始屈缩退让。「没阳姓名」形容阳气的影响力逐渐消退，连名号都被淹没——从乾卦的「广被四邻」到姤卦的「没阳姓名」，落差巨大。参同契以此警示：衰退不是突然降临的，而是从最微小的阴气初生开始，若不及早警觉，等到「没阳姓名」时已来不及。`,connection:`今日姤卦，阴气初生但已开始「阴伸阳屈」。今日虽仍有五阳在上，精力尚可，但此句提醒我们：不可被表面的旺盛所迷惑，阴气的伸展已经开始，今日应主动减少消耗、收敛锋芒，为后续的遁卦退守做好准备。`,chapter:`上篇·十二消息`},dayIndex:4,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,modernEquivalent:`深度心理清理与目标聚焦训练。`,dailyRoutine:`晨起发愿精进，日中持咒净心，晚间回向。`},schools:[{schoolName:`钟吕传道`,method:`炼气化神决断精进，去染成净。 成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先 。修心者当知：衰退的起点往往伪装成繁荣的延续。`,connection:`今日姤卦，一阴初生，此句「女壮」警示我们：今日看似精力仍旺（五阳在上），但底层的阴气已在暗长。今日最忌讳的是贪恋表面的旺盛而继续全力输出，应当开始有意识地收敛，为后续的阴长阶段储备能量。`,chapter:`上篇·十二消息（化用《周易·姤卦·卦辞》）`},dayIndex:2,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大 qiDaily:{verse:{id:`gou_03`,original:`午之蕤宾，宾服于阴`,translation:`五月建午，蕤宾律管与之相应，阳气开始宾服于阴气之下。`,interpretation:`此句以律吕配月说明姤卦的时令特征。「蕤宾」是十二律中对应五月（午月）的律管。「宾服于阴」极为精妙——「宾」指客人，阳气从主人之位退为宾客，开始服从阴气的主导。夏至日阳极阴生，正是这种主客易位的时刻。参同契以此说明：姤卦是阴阳力量对比的转折点，从此阳气将逐步退让。修心者当顺应这种转变，主动从进攻转为防守。`,connection:`今日姤卦，对应午月蕤宾，阳气开始「宾服于阴」——从主导者退为从属者。今日行动应体现这种转变：从主动出击转为防守巩固，从向外拓展转为向内收敛，顺应阴阳易位的大势。`,chapter:`上篇·十二消息`},dayIndex:3,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,modernEquivalent:`深度心理清理与目标聚焦训练。`,dailyRoutine:`晨起发愿精进，日中持咒净心，晚间回向。`},schools:[{schoolName:`钟吕传道`,method:`炼气化神决断精进，去染成净。`,classicRef:`《钟吕传道集》“炼气化神，去粗留精”`},{schoolName:`正一派`,method:`正一真传，承师口诀，行持精进。`,classicRef:`《正一修真略仪》“真传者，口传心授也”`}],isCurrent:!1},{title:`纯阳极盛`,hexagram:`乾`,safetyLevel:3,safetyLabel:`仅作认知框架·需师承·不可妄修`,requiresLineage:!0,classicSource:`《周易参同契》“乾健盛明，广被四邻”`,summary:`纯阳极盛，知进思退，防过亢之危。`,detail:{originalText:`乾健盛明，广被四邻，阳终于巳，中而相干。`,practiceMethod:`《参同契》：乾健盛明防过亢，盛极知退。《悟真篇》：知进思退火候要诀，阳极转阴，防危虑险。`,safetyTip:`纯阳之境极易过亢，非有明师护持不可妄修，仅作认知框架。`,modernEquivalent:`极限状态下的自我觉察与及时止损意识。`,dailyRoutine:`此阶段仅作认知了解，日常仍以温养守中为主。`},schools:[{schoolName:`参同契宗`,method:`乾健盛明防过亢，盛极知退。`,classicRef:`《周易参同契》“乾健盛明，广被四邻”`},{schoolName:`南宗`,method:`知进思退火候要诀，阳极转阴，防危虑险。`,classicRef:`《悟真篇》“知进思退，不骄不盈”`}],isCurrent:!1},{title:`一阴初生`,hexagram:`姤`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“姤始端绪，履霜最先”`,summary:`一阴初生，防微杜渐，收心为要。`,detail:{originalText:`姤始端绪，履霜最先，井底寒泉，斗入深渊。`,practiceMethod:`全真派：防危虑险，觉察微阴初生，及时收敛。正一派：收心，回光返照，不随境转。`,safetyTip:`此阶段无风险，重在觉察与收敛，防微杜渐。`,modernEquivalent:`情绪早期预警与 studentLabel:`上午课/自习`,studentScenario:`study`}],totalDuration:65},actionReviewQuestions:[`今天做了哪些行动？哪个行动让你最贴近心法「一阴初生，防微杜渐」？`,`哪个计划行动没有完成？是什么阻碍了你？`,`明日最想继续哪个行动？想新增什么？`],cantongqiDaily:{verse:{id:`gou_04`,original:`阴伸阳屈，没阳姓名`,translation:`阴气伸展而阳气屈缩，阳气的名号逐渐被淹没。`,interpretation:`此句描述姤卦之后阴长阳消的趋势。「阴伸」指阴气从初生开始伸展壮大，「阳屈」指阳气从极盛开始屈缩退让。「没阳姓名」形容阳气的影响力逐渐消退，连名号都被淹没——从乾卦的「广被四邻」到姤卦的「没阳姓名」，落差巨大。参同契以此警示：衰退不是突然降临的，而是从最微小的阴气初生开始，若不及早警觉，等到「没阳姓名」时已来不及。`,connection:`今日姤卦，阴气初生但已开始「阴伸阳屈」。今日虽仍有五阳在上，精力尚可，但此句提醒我们：不可被表面的旺盛所迷惑，阴气的伸展已经开始，今日应主动减少消耗、收敛锋芒，为后续的遁卦退守做好准备。`,chapter:`上篇·十二消息`},dayIndex:4,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需 0分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,modernEquivalent:`深度心理清理与目标聚焦训练。`,dailyRoutine:`晨起发愿精进，日中持咒净心，晚间回向。`},schools:[{schoolName:`钟吕传道`,method:`炼气化神决断精进，去染成净。`,classicRef:`《钟吕传道集》“炼气化神，去粗留精”`},{schoolName:`正一派`,method:`正一真传，承师口诀，行持精进。`,classicRef:`《正一修真略仪》“真传者，口传心授也”`}],isCurrent:!1},{title:`纯阳极盛`,hexagram:`乾`,safetyLevel:3,safetyLabel:`仅作认知框架·需师承·不可妄修`,requiresLineage:!0,classicSource:`《周易参同契》“乾健盛明，广被四邻”`,summary:`纯阳极盛，知进思退，防过亢之危。`,detail:{originalText:`乾健盛明，广被四邻，阳终于巳，中而相干。`,practiceMe 派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexa otalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernE 至」，强调在阴气最微弱时就应警觉。「井底寒泉」比喻阴气从最深处涌出——如同井底的水，表面看不见但已在暗暗涌动。参同契以此说明：姤卦一阴虽微，却是整个阴长阳消进程的起点，不可轻视。修心者当在盛时知退，防微杜渐。`,connection:`今日姤卦，一阴初生，正合「姤始纪绪」之象——阴气刚刚萌生，看似微不足道，实则是趋势转变的起点。今日行动应注意：精力虽仍充沛但已开始回落，不可再像乾卦时那样全力冲刺，应开始有意识地收敛。`,chapter:`上篇·十二消息`},dayIndex:1,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2 ons:[`今天做了哪些行动？哪个行动让你最贴近心法「一阴初生，防微杜渐」？`,`哪个计划行动没有完成？是什么阻碍了你？`,`明日最想继续哪个行动？想新增什么？`],cantongqiDaily:{verse:{id:`gou_02`,original:`女壮，勿用取女`,translation:`女子壮盛，不宜娶此女为妻。`,interpretation:`此句源自《周易·姤卦·卦辞》，参同契化用以说明姤卦一阴初生的特性。「女壮」指初六一爻虽微，却有壮盛之势——阴气虽初生，其增长势头不可小觑。「勿用取女」不是性别歧视，而是比喻：当阴气开始暗长时，不可与之正面交合，否则阳气将被消耗。参同契以此说明：在阴气初生之时，阳气应收敛自守，不可贪恋外在的繁华而过度消耗。修心者当知：衰退的起点往往伪装成繁荣的延续。`,connection:`今日姤卦，一阴初生，此句「女壮」警示我们：今日看似精力仍旺（五阳在上），但底层的阴气已在暗长。今日最忌讳的是贪恋表面的旺盛而继续全力输出，应当开始有意识地收敛，为后续的阴长阶段储备能量。`,chapter:`上篇·十二消息（化用《周易·姤卦·卦辞》）`},dayIndex:2,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,modernEquivalent:`深度心理清理与目标聚焦训练。`,dailyRoutine:`晨起发愿精进，日中持咒净心，晚间回向。`},schools:[{schoolName:`钟吕传道`,method:`炼气化神决断精进，去染成净。`,classicRef:`《钟吕传道集》“炼气化神，去粗留精”`},{schoolName:`正一派`,method:`正一真传，承师口诀，行持精进。`,classicRef:`《正一修真略仪》“真传者，口传心授也”`}],isCurrent:!1},{title:`纯阳极盛`,hexagram:`乾`,safetyLevel:3,safetyLabel:`仅作认知框架·需师承·不可妄修`,requiresLineage:!0,classicSource:`《周易参同契》“乾健盛明，广被四邻”`,summary:`纯阳极盛，知进思退，防过亢之危。`,detail:{originalText:`乾健盛明，广被四邻，阳终于巳，中而相干。`,practiceMethod:`《参同契》：乾健盛明防过亢，盛极知退。《悟真篇》：知进思退火候要诀，阳极转阴，防危虑险。`,safetyTip:`纯阳之境极易过亢，非有明师护持不可妄修，仅作认知框架。`,modernEquivalent:`极限状态下的自我觉察与及时止损意识。`,dailyRoutine:`此阶段仅作认知了解，日常仍以温养守中为主。`},schools:[{schoolName:`参同契宗`,method:`乾健盛明防过亢，盛极知退。`,classicRef:`《周易参同契》“乾健盛明，广被四邻”`},{schoolName:`南宗`,method:`知进思退火候要诀，阳极转阴，防危虑险。`,classicRef:`《悟真篇》“知进思退，不骄不盈”`}],isCurrent:!1},{title:`一阴初生`,hexagram:`姤`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“姤始端绪，履霜最先”`,summary:`一阴初生，防微杜渐，收心为要。`,detail:{originalText:`姤始端绪，履霜最先，井 :`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,modernEquivalent:`深度心理清理与目标聚焦训练。`,dailyRoutine:`晨起发愿精进，日中持咒净心，晚间回向。`},schools:[{schoolName:`钟吕传道`,method:`炼气化神决断精进，去染成净。`,classicRef:`《钟吕传道集》“炼气化神，去粗留精”`},{schoolName:`正一派`,method:`正一真传，承师口诀，行持精进。`,classicRef:`《正一修真略仪》“真传者，口传心授也”`}],isCurrent:!1},{title:`纯阳极盛`,hexagram:`乾`,safetyLevel:3,safetyLabel:`仅作认知框架·需师承·不可妄修`,requiresLineage:!0,classicSource:`《周易参同契》“乾健盛明，广被四邻”`,summary:`纯阳极盛，知进思退，防过亢之危。`,detail:{originalText:`乾健盛明，广被四邻，阳终于巳，中而相干。`,practiceMethod:`《参同契》：乾健盛明防过亢，盛极知退。《悟真篇》：知进思退火候要诀，阳极转阴，防危虑险。`,safetyTip:`纯阳之境极易过亢，非有明师护持不可妄修，仅作认知框架。`,modernEquivalent:`极限状态下的自我觉察与及时止损意识。`,dailyRoutine:`此阶段仅作认知了解，日常仍以温养守中为主。`},schools:[{schoolName:`参同契宗`,method:`乾健盛明防过亢，盛极知退。`,classicRef:`《周易参同契》“乾健盛明，广被四邻”`},{schoolName:`南宗`,method:`知进思退火候要诀，阳极转阴，防危虑险。`,classicRef:`《悟真篇》“知进思退，不骄 y:`参同契云「姤始端绪」，一阴初生阳气始收，泡脚引阳下行归藏于肾，按摩涌泉助阳入阴，正合姤卦收敛阳气之道`,studentLabel:`晚餐/晚自习`,studentScenario:`evening_study`},{id:`gou_time_1`,title:`巳时集中处理要务`,steps:`1. 列出今日1-2件必要事务 2. 巳时集中精力完成 3. 午时前确认核心任务完成 4. 午后不再开启新任务`,duration:30,timeAnchor:`巳时`,evidence:`B`,category:`timeManagement`,sourceMantra:`姤`,why:`参同契云「阴伸阳屈」，巳时是姤卦最后的阳气高峰，集中处理要务是趁阳尚盛时完成核心工作，午后阴长则精力不济`,studentLabel:`上午课/自习`,studentScenario:`study`}],totalDuration:65},actionReviewQuestions:[`今天做了哪些行动？哪个行动让你最贴近心法「一阴初生，防微杜渐」？`,`哪个计划行动没有完成？是什么阻碍了你？`,`明日最想继续哪个行动？想新增什么？`],cantongqiDaily:{verse:{id:`gou_04`,original:`阴伸阳屈，没阳姓名`,translation:`阴气伸展而阳气屈缩，阳气的名号逐渐被淹没。`,interpretation:`此句描述姤卦之后阴长阳消的趋势。「阴伸」指阴气从初生开始伸展壮大，「阳屈」指阳气从极盛开始屈缩退让。「没阳姓名」形容阳气的影响力逐渐消退，连名号都被淹没——从乾卦的「广被四邻」到姤卦的「没阳姓名」，落差巨大。参同契以此警示：衰退不是突然降临的，而是从最微小的阴气初生开始，若不及早警觉，等到「没阳姓名」时已来不及。`,connection:`今日姤卦，阴气初生但已开始「阴伸阳屈」。今日虽仍有五阳在上，精力尚可，但此句提醒我们：不可被表面的旺盛所迷惑，阴气的伸展已经开始，今日应主动减少消耗、收敛锋芒，为后续的遁卦退守做好准备。`,chapter:`上篇·十二消息`},dayIndex:4,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,modernEquivalent:`深度心理清理与目标聚焦训练。`,dailyRoutine:`晨起发愿精进，日中持咒净心，晚间回向。`},schools:[{schoolName:`钟吕传道`,method:`炼气化神决断精进，去染成净。`,classicRef:`《钟吕传道集》“炼气化神，去粗留精”`},{schoolName:`正一派`,method:`正一真传，承师口诀，行持精进。`,classicRef:`《正一修真略仪》“真传者，口传心授也”`}],isCurrent:!1},{title:`纯阳极盛`,hexagram:`乾`,safetyLevel:3,safetyLabel:`仅作认知框架·需师承·不可妄修`,requiresLineage:!0,classicSource:`《周易参同契》“乾健盛明，广被四邻”`,summary:`纯阳极盛，知进思退，防过亢之危。`,detail:{originalText:`乾健盛明，广被四邻，阳终于巳，中而相干。`,practiceMethod:`《参同契》：乾健盛明防过亢，盛极知退。《悟真篇》：知进思退火候要诀，阳极转阴，防危虑险。`,safetyTip:`纯阳之境极易过亢，非有明师护持不可妄修，仅作认知框架。`,modernEquivalent:`极限 :`ACT接纳精力回落`,steps:`1. 觉察到精力下降时不对抗 2. 对自己说「精力回落是自然的」 3. 允许自己放慢节奏 4. 将回落视为蓄力而非退步`,duration:10,timeAnchor:`全天`,evidence:`A`,category:`emotionRegulation`,sourceMantra:`姤`,why:`参同契云「姤始端绪，履霜最先」，接纳回落是姤卦心法——阴长是天道，对抗只会加速消耗，接纳方能蓄力待时`,studentLabel:`随时`,studentScenario:`anytime`},{id:`gou_living_1`,title:`晚间泡脚助眠敛阳`,steps:`1. 酉时取温水40度左右 2. 浸泡双脚15分钟 3. 擦干后按摩涌泉穴1分钟 4. 泡脚后30分钟内入睡`,duration:15,timeAnchor:`酉时`,evidence:`D`,category:`living`,sourceMantra:`姤`,why:`参同契云「姤始端绪」，一阴初生阳气始收，泡脚引阳下行归藏于肾，按摩涌泉助阳入阴，正合姤卦收敛阳气之道`,studentLabel:`晚餐/晚自习`,studentScenario:`evening_study`},{id:`gou_time_1`,title:`巳时集中处理要务`,steps:`1. 列出今日1-2件必要事务 2. 巳时集中精力完成 3. 午时前确认核心任务完成 4. 午后不再开启新任务`,duration:30,timeAnchor:`巳时`,evidence:`B`,category:`timeManagement`,sourceMantra:`姤`,why:`参同契云「阴伸阳屈」，巳时是姤卦最后的阳气高峰，集中处理要务是趁阳尚盛时完成核心工作，午后阴长则精力不济`,studentLabel:`上午课/自习`,studentScenario:`study`}],totalDuration:65},actionReviewQuestions:[`今天做了哪些行动？哪个行动让你最贴近心法「一阴初生，防微杜渐」？`,`哪个计划行动没有完成？是什么阻碍了你？`,`明日最想继续哪个行动？想新增什么？`],cantongqiDaily:{verse:{id:`gou_01`,original:`姤始纪绪，履霜最先，井底寒泉`,translation:`姤卦开始纪理阴气之端绪，如履霜而知坚冰将至，如井底涌出寒泉。`,interpretation:`此句描述姤卦一阴初生的微妙状态。「始纪绪」指阴气开始有了端绪——从无到有的最初征兆。「履霜最先」化用坤卦「履霜坚冰至」，强调在阴气最微弱时就应警觉。「井底寒泉」比喻阴气从最深处涌出——如同井底的水，表面看不见但已在暗暗涌动。参同契以此说明：姤卦一阴虽微，却是整个阴长阳消进程的起点，不可轻视。修心者当在盛时知退，防微杜渐。`,connection:`今日姤卦，一阴初生，正合「姤始纪绪」之象——阴气刚刚萌生，看似微不足道，实则是趋势转变的起点。今日行动应注意：精力虽仍充沛但已开始回落，不可再像乾卦时那样全力冲刺，应开始有意识地收敛。`,chapter:`上篇·十二消息`},dayIndex:1,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,modernEquivalent:`深度心理清理与目标聚焦训练。`,dailyRoutine:`晨起发愿精进，日中持咒净心，晚间回向。`},schools:[{schoolName:`钟吕传道`,met 察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,d 之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主 锋芒，为后续的遁卦退守做好准备。`,chapter:`上篇·十二消息`},dayIndex:4,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚 。「始纪绪」指阴气开始有了端绪——从无到有的最初征兆。「履霜最先」化用坤卦「履霜坚冰至」，强调在阴气最微弱时就应警觉。「井底寒泉」比喻阴气从最深处涌出——如同井底的水，表面看不见但已在暗暗涌动。参同契以此说明：姤卦一阴虽微，却是整个阴长阳消进程的起点，不可轻视。修心者当在盛时知退，防微杜渐。`,connection:`今日姤卦，一阴初生，正合「姤始纪绪」之象——阴气刚刚萌生，看似微不足道，实则是趋势转变的起点。今日行动应注意：精力虽仍充沛但已开始回落，不可再像乾卦时那样全力冲刺，应开始有意识地收敛。`,chapter:`上篇·十二消息`},dayIndex:1,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1} nario:`anytime`}],totalDuration:65},actionReviewQuestions:[`今天做了哪些行动？哪个行动让你最贴近心法「一阴初生，防微杜渐」？`,`哪个计划行动没有完成？是什么阻碍了你？`,`明日最想继续哪个行动？想新增什么？`],cantongqiDaily:{verse:{id:`gou_02`,original:`女壮，勿用取女`,translation:`女子壮盛，不宜娶此女为妻。`,interpretation:`此句源自《周易·姤卦·卦辞》，参同契化用以说明姤卦一阴初生的特性。「女壮」指初六一爻虽微，却有壮盛之势——阴气虽初生，其增长势头不可小觑。「勿用取女」不是性别歧视，而是比喻：当阴气开始暗长时，不可与之正面交合，否则阳气将被消耗。参同契以此说明：在阴气初生之时，阳气应收敛自守，不可贪恋外在的繁华而过度消耗。修心者当知：衰退的起点往往伪装成繁荣的延续。`,connection:`今日姤卦，一阴初生，此句「女壮」警示我们：今日看似精力仍旺（五阳在上），但底层的阴气已在暗长。今日最忌讳的是贪恋表面的旺盛而继续全力输出，应当开始有意识地收敛，为后续的阴长阶段储备能量。`,chapter:`上篇·十二消息（化用《周易·姤卦·卦辞》）`},dayIndex:2,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,modernEquivalent:`深度心理清理与目标聚焦训练。`,dailyRoutine:`晨起发愿精进，日中持咒净心，晚间回向。`},schools:[{schoolName:`钟吕传道`,method:`炼气化神决断精进，去染成净。`,classicRef:`《钟吕传道集》“炼气化神，去粗留精”`},{schoolName:`正一派`,method:`正一真传，承师口诀，行持精进。`,classicRef:`《正一修真略仪》“真传者，口传心授也”`}],isCurrent:!1},{title:`纯阳极盛`,hexagram:`乾`,safetyLevel:3,safetyLabel:`仅作认知框架·需师承·不可妄修`,requiresLineage:!0,classicSource:`《周易参同契》“乾健盛明，广被四邻”`,summary:`纯阳极盛，知进思退，防过亢之危。`,detail:{originalText:`乾健盛明，广被四邻，阳终于巳，中而相干。`,practiceMethod:`《参同契》：乾健盛明防过亢，盛极知退。《悟真篇》：知进思退火候要诀，阳极转阴，防危虑险。`,safetyTip:`纯阳之境极易过亢，非有明师护持不可妄修，仅作认知框架。`,modernEquivalent:`极限状态下的自我觉察与及时止损意识。`,dailyRoutine:`此阶段仅作认知了解，日常仍以温养守中为主。`},schools:[{schoolName:`参同契宗`,method:`乾健盛明防过亢，盛极知退。`,classicRef:`《周易参同契》“乾健盛明，广被四邻”`},{schoolName:`南宗`,method:`知进思退火候要诀，阳极转阴，防危虑险。`,classicRef:`《悟真篇》“知进思退，不骄不盈”`}],isCurrent:!1},{title:`一阴初生`,hexagram:`姤`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“姤始端绪，履霜最先”`,summa 时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,modernEquivalent:`深度心理清理与目标聚焦训练。`,dailyRoutine:`晨起发愿精进，日中持咒净心，晚间回向。`},schools:[{schoolName:`钟吕传道`,method:`炼气化神决断精进，去染成净。`,classicRef:`《钟吕传道集》“炼气化神，去粗留精”`},{schoolName:`正一派`,method:`正一真传，承师口诀，行持精进。`,classicRef:`《正一修真略仪》“真传者，口传心授也”`}],isCurre 收敛，不待衰而后悔`,studentLabel:`午休`,studentScenario:`break`}],topThree:[{id:`gou_emotion_1`,title:`ACT接纳精力回落`,steps:`1. 觉察到精力下降时不对抗 2. 对自己说「精力回落是自然的」 3. 允许自己放慢节奏 4. 将回落视为蓄力而非退步`,duration:10,timeAnchor:`全天`,evidence:`A`,category:`emotionRegulation`,sourceMantra:`姤`,why:`参同契云「姤始端绪，履霜最先」，接纳回落是姤卦心法——阴长是天道，对抗只会加速消耗，接纳方能蓄力待时`,studentLabel:`随时`,studentScenario:`anytime`},{id:`gou_time_1`,title:`巳时集中处理要务`,steps:`1. 列出今日1-2件必要事务 2. 巳时集中精力完成 3. 午时前确认核心任务完成 4. 午后不再开启新任务`,duration:30,timeAnchor:`巳时`,evidence:`B`,category:`timeManagement`,sourceMantra:`姤`,why:`参同契云「阴伸阳屈」，巳时是姤卦最后的阳气高峰，集中处理要务是趁阳尚盛时完成核心工作，午后阴长则精力不济`,studentLabel:`上午课/自习`,studentScenario:`study`},{id:`gou_comm_2`,title:`观察他人态度变化`,steps:`1. 今日留意1位关系密切者的态度 2. 记录其语气或行为有无微妙变化 3. 若有变化则找时机温和询问 4. 及时沟通化解潜在误解`,duration:5,timeAnchor:`全天`,evidence:`D`,category:`communication`,sourceMantra:`姤`,why:`参同契云「井底寒泉」，人际变数如井底寒泉暗暗涌动，观察微妙变化是履霜知坚冰的警觉，及时沟通方能防微杜渐`,studentLabel:`随时`,studentScenario:`anytime`}],totalDuration:65},actionReviewQuestions:[`今天做了哪些行动？哪个行动让你最贴近心法「一阴初生，防微杜渐」？`,`哪个计划行动没有完成？是什么阻碍了你？`,`明日最想继续哪个行动？想新增什么？`],cantongqiDaily:{verse:{id:`gou_01`,original:`姤始纪绪，履霜最先，井底寒泉`,translation:`姤卦开始纪理阴气之端绪，如履霜而知坚冰将至，如井底涌出寒泉。`,interpretation:`此句描述姤卦一阴初生的微妙状态。「始纪绪」指阴气开始有了端绪——从无到有的最初征兆。「履霜最先」化用坤卦「履霜坚冰至」，强调在阴气最微弱时就应警觉。「井底寒泉」比喻阴气从最深处涌出——如同井底的水，表面看不见但已在暗暗涌动。参同契以此说明：姤卦一阴虽微，却是整个阴长阳消进程的起点，不可轻视。修心者当在盛时知退，防微杜渐。`,connection:`今日姤卦，一阴初生，正合「姤始纪绪」之象——阴气刚刚萌生，看似微不足道，实则是趋势转变的起点。今日行动应注意：精力虽仍充沛但已开始回落，不可再像乾卦时那样全力冲刺，应开始有意识地收敛。`,chapter:`上篇·十二消息`},dayIndex:1,totalInPhase:5},cultivationProgress:{stages:[{title:`一阳来复`,hexagram:`复`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“朔旦为复，阳炁始通”`,summary:`一阳初生，万物萌动，实修入门之基。`,detail:{originalText:`朔旦为复，阳炁始通，出入无疾，立表微刚。`,practiceMethod:`正一派：太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。全真派：炼己收心，基础静坐，每日15-30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“夬阴以退，阳升而先”`,summary:`五阳决阴，决断精进，炼气化神之始。`,detail:{originalText:`夬阴以退，阳升而先，洗濯羽翮，振索宿尘。`,practiceMethod:`钟吕：炼气化神决断精进，去染成净。正一派：正一真传，承师口诀，行持精进。`,safetyTip:`决断之时易生偏执，需师承印证，不可独断。`,moder -30分钟，观呼吸、收摄心神。`,safetyTip:`此阶段无风险，重在养成习惯，不可急于求成。`,modernEquivalent:`正念冥想入门，呼吸觉察训练。`,dailyRoutine:`晨起静坐15分钟，晚间复盘一日心念。`},schools:[{schoolName:`正一派`,method:`太上三五正一盟威宝箓入门修持，诵持宝诰，建立坛场基础。`,classicRef:`《正一修真略仪》“授箓之始，先正其心”`},{schoolName:`全真派`,method:`炼己收心，基础静坐，观呼吸、收摄心神。`,classicRef:`《全真集》“炼己者，炼其心也”`}],isCurrent:!1},{title:`二阳浸长`,hexagram:`临`,safetyLevel:1,safetyLabel:`本APP核心内容·无风险`,requiresLineage:!1,classicSource:`《周易参同契》“临炉施条，开云正光”`,summary:`二阳渐长，温养待时，持戒调息。`,detail:{originalText:`临炉施条，开云正光，光耀浸进，日以益长。`,practiceMethod:`正一派：正一盟威持戒，斋戒沐浴，清净身心。全真派：调息凝神，逐步延长静坐时间至30-45分钟，心息相依。`,safetyTip:`此阶段无风险，持戒重在自律，不可流于形式。`,modernEquivalent:`规律作息与自律训练，延长冥想时长。`,dailyRoutine:`晨起调息30分钟，日中持戒守规，晚间反省。`},schools:[{schoolName:`正一派`,method:`正一盟威持戒，斋戒沐浴，清净身心。`,classicRef:`《正一盟威经》“持戒者，持身口意之戒也”`},{schoolName:`全真派`,method:`调息凝神，逐步延长静坐时间，心息相依。`,classicRef:`《全真集》“调息者，调其呼吸也”`}],isCurrent:!1},{title:`阴阳交泰`,hexagram:`泰`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“仰以成泰，刚柔并隆”`,summary:`阴阳交泰，心肾相交，筑基补亏。`,detail:{originalText:`仰以成泰，刚柔并隆，阴阳交接，小往大来。`,practiceMethod:`南宗：抽坎填离心肾相交法，意守丹田，令水火既济。钟吕：筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,safetyTip:`需明师指导，不可自行意守过重，以免气机紊乱。`,modernEquivalent:`腹式呼吸训练与身心整合疗法。`,dailyRoutine:`早晚各静坐45分钟，配合逆腹式呼吸，意守丹田。`},schools:[{schoolName:`南宗`,method:`抽坎填离心肾相交法，意守丹田，令水火既济。`,classicRef:`《悟真篇》“取将坎位中心实，点化离宫腹内阴”`},{schoolName:`钟吕传道`,method:`筑基补亏逆腹式呼吸，深吸缓呼，纳气归根。`,classicRef:`《钟吕传道集》“筑基者，筑其根基也”`}],isCurrent:!1},{title:`四阳盛壮`,hexagram:`大壮`,safetyLevel:2,safetyLabel:`需师承指导`,requiresLineage:!0,classicSource:`《周易参同契》“渐历大壮，侠列卯门”`,summary:`四阳盛壮，防过刚易折，守中为要。`,detail:{originalText:`渐历大壮，侠列卯门，榆荚堕落，归还本根。`,practiceMethod:`全真派：炼精化气防过刚，火候宜柔不宜猛。南宗：守中火候，不偏不倚，温养为主。`,safetyTip:`阳气盛时易生躁动，需防过刚，守柔方能长久。`,modernEquivalent:`高强度运动后的恢复与平衡训练。`,dailyRoutine:`晨起动功适度，午后静坐守中，晚间早睡养阳。`},schools:[{schoolName:`全真派`,method:`炼精化气防过刚，火候宜柔不宜猛。`,classicRef:`《全真集》“炼精化气，柔火长温”`},{schoolName:`南宗`,method:`守中火候，不偏不倚，温养为主。`,classicRef:`《悟真篇》“守中者，守其黄庭也”`}],isCurrent:!1},{title:`五阳决阴`,hexagram:`夬`,safetyLevel:2,safetyLabel:`需师承指导`,requ <p>八卦是《周易》的基本符号体系，由阳爻（—）和阴爻（--）三个一组排列而成，共八种组合。</p>
<table><tr><th>卦名</th><th>符号</th><th>自然象</th><th>阴阳</th><th>含义</th></tr>
<tr><td>乾</td><td>☰</td><td>天</td><td>阳</td><td>健——刚健不息</td></tr>
<tr><td>坤</td><td>☷</td><td>地</td><td>阴</td><td>顺——柔顺包容</td></tr>
<tr><td>震</td><td>☳</td><td>雷</td><td>阳</td><td>动——奋发震动</td></tr>
<tr><td>巽</td><td>☴</td><td>风</td><td>阴</td><td>入——柔顺渗入</td></tr>
<tr><td>坎</td><td>☵</td><td>水</td><td>阳</td><td>险——险陷困难</td></tr>
<tr><td>离</td><td>☲</td><td>火</td><td>阴</td><td>丽——光明附丽</td></tr>
<tr><td>艮</td><td>☶</td><td>山</td><td>阳</td><td>止——静止安止</td></tr>
<tr><td>兑</td><td>☱</td><td>泽</td><td>阴</td><td>悦——和悦欢欣</td></tr>
</table>
<h4>先天八卦与后天八卦</h4>
<p>先天八卦（伏羲八卦）以天地定位，乾坤南北相对，体现宇宙本体结构。后天八卦（文王八卦）以方位用事，离南坎北，体现万物运行规律。参同契主要使用先天八卦序。</p>`},{id:`ganzhi`,num:`二`,title:`天干地支`,content:`<h4>十天干</h4>
<table><tr><th>天干</th><th>阴阳</th><th>五行</th></tr>
<tr><td>甲</td><td>阳</td><td>木</td></tr><tr><td>乙</td><td>阴</td><td>木</td></tr>
<tr><td>丙</td><td>阳</td><td>火</td></tr><tr><td>丁</td><td>阴</td><td>火</td></tr>
<tr><td>戊</td><td>阳</td><td>土</td></tr><tr><td>己</td><td>阴</td><td>土</td></tr>
<tr><td>庚</td><td>阳</td><td>金</td></tr><tr><td>辛</td><td>阴</td><td>金</td></tr>
<tr><td>壬</td><td>阳</td><td>水</td></tr><tr><td>癸</td><td>阴</td><td>水</td></tr>
</table>
<h4>十二地支</h4>
<table><tr><th>地支</th><th>阴阳</th><th>五行</th><th>对应时辰</th></tr>
<tr><td>子</td><td>阳</td><td>水</td><td>23-01</td></tr><tr><td>丑</td><td>阴</td><td>土</td><td>01-03</td></tr>
<tr><td>寅</td><td>阳</td><td>木</td><td>03-05</td></tr><tr><td>卯</td><td>阴</td><td>木</td><td>05-07</td></tr>
<tr><td>辰</td><td>阳</td><td>土</td><td>07-09</td></tr><tr><td>巳</td><td>阴</td><td>火</td><td>09-11</td></tr>
<tr><td>午</td><td>阳</td><td>火</td><td>11-13</td></tr><tr><td>未</td><td>阴</td><td>土</td><td>13-15</td></tr>
<tr><td>申</td><td>阳</td><td>金</td><td>15-17</td></tr><tr><td>酉</td><td>阴</td><td>金</td><td>17-19</td></tr>
<tr><td>戌</td><td>阳</td><td>土</td><td>19-21</td></tr><tr><td>亥</td><td>阴</td><td>水</td><td>21-23</td></tr>
</table>
<h4>六十甲子</h4>
<p>天干与地支按顺序两两组合，阳干配阳支、阴干配阴支，形成六十甲子循环，用于纪年纪月纪日纪时。</p>`},{id:`najia`,num:`三`,title:`纳甲法`,content:`<h4>什么是纳甲</h4>
<p>纳甲是将十天干纳入八卦的对应体系。《周易参同契》以纳甲法将日月运行与八卦对应，是参同契推演的核心方法。</p>
<h4>参同契纳甲表</h4>
<table><tr><th>天干</th><th>八卦</th><th>说明</th></tr>
<tr><td>甲、壬</td><td>乾</td><td>乾纳甲壬，甲为内干壬为外干</td></tr>
<tr><td>乙、癸</td><td>坤</td><td>坤纳乙癸，乙为内干癸为外干</td></tr>
<tr><td>丙</td><td>艮</td><td>艮纳丙</td></tr>
<tr><td>丁</td><td>兑</td><td>兑纳丁</td></tr>
<tr><td>戊</td><td>坎</td><td>坎纳戊</td></tr>
<tr><td>己</td><td>离</td><td>离纳己</td></tr>
<tr><td>庚</td><td>震</td><td>震纳庚</td></tr>
<tr><td>辛</td><td>巽</td><td>巽纳辛</td></tr>
</table>
<h4>月体纳甲</h4>
<p>参同契将月相变化与八卦对应：三日震庚（新月始现）、八日兑丁（上弦月）、十五乾甲（满月）、十六巽辛（月始亏）、二十三艮丙（下弦月）、三十坤乙（晦月）。坎戊离己居中，象征日月本体。</p>
<h4>纳支法</h4>
<p>纳支是将十二地支纳入八卦六爻的体系。阳卦（乾震坎艮）纳阳支（子寅辰午申戌），阴卦（坤巽离兑）纳阴支（丑卯巳未酉亥）。每个卦从初爻到上爻依次纳入六个地支。</p>
<h4>纳支规则详述</h4>
<p>阳卦纳阳支规则：乾震坎艮从下往上纳子→寅→辰→午→申→戌。乾卦从子起，震卦亦从子起（长子继父体），坎卦从寅起，艮卦从辰起，各卦依次错开两位。</p>
<p>阴卦纳阴支规则：坤巽离兑从下往上纳未→巳→卯→丑→亥→酉（逆行）。坤卦从未起，巽卦从丑起，离卦从卯起，兑卦从巳起，各卦亦依次错开两位。</p>
<p>乾震同纳支序（长子继父体），坤巽离兑各有不同起始。此规则源于京房纳甲体系，参同契沿用之。</p>`},{id:`message`,num:`四`,title:`十二消息卦`,content:`<h4>阴阳消长</h4>
<p>十二消息卦是《周易》中描述阴阳消长规律的核心体系。从全阴的坤卦到全阳的乾卦，再从乾卦回到坤卦，循环往复。</p>
<h4>进火（阳长阴消）</h4>
<table><tr><th>农历月</th><th>卦名</th><th>阳爻</th><th>阴爻</th><th>含义</th></tr>
<tr><td>十一月</td><td>复䷗</td><td>1</td><td>5</td><td>一阳来复，冬至阳生</td></tr>
<tr><td>十二月</td><td>临䷒</td><td>2</td><td>4</td><td>二阳浸长，阳气渐盛</td></tr>
<tr><td>正月</td><td>泰䷊</td><td>3</td><td>3</td><td>三阳开泰，天地交通</td></tr>
<tr><td>二月</td><td>大壮䷡</td><td>4</td><td>2</td><td>四阳盛壮，阳气充沛</td></tr>
<tr><td>三月</td><td>夬䷪</td><td>5</td><td>1</td><td>五阳决阴，阳气将极</td></tr>
<tr><td>四月</td><td>乾䷀</td><td>6</td><td>0</td><td>纯阳极盛，刚健至极</td></tr>
</table>
<h4>退符（阴长阳消）</h4>
<table><tr><th>农历月</th><th>卦名</th><th>阳爻</th><th>阴爻</th><th>含义</th></tr>
<tr><td>五月</td><td>姤䷫</td><td>5</td><td>1</td><td>一阴初生，阴气暗长</td></tr>
<tr><td>六月</td><td>遁䷠</td><td>4</td><td>2</td><td>二阴渐长，阳气退避</td></tr>
<tr><td>七月</td><td>否䷋</td><td>3</td><td>3</td><td>天地不交，阴阳隔绝</td></tr>
<tr><td>八月</td><td>观䷓</td><td>2</td><td>4</td><td>四阴观瞻，阴气渐盛</td></tr>
<tr><td>九月</td><td>剥䷖</td><td>1</td><td>5</td><td>五阴剥阳，阳气将尽</td></tr>
<tr><td>十月</td><td>坤䷁</td><td>0</td><td>6</td><td>纯阴极盛，柔顺至极</td></tr>
</table>
<h4>参同契火候论</h4>
<p>参同契以消息卦论火候：进火时阳气渐长，宜顺势进取；退符时阴气渐长，宜收敛退守。火候之妙在于知时知量，不违天时。</p>
<h4>进退火候精确对应</h4>
<p>进火六卦精确对应：复（十一月）→临（十二月）→泰（正月）→大壮（二月）→夬（三月）→乾（四月），阳气从初爻渐长至上爻，由一阳来复至纯阳极盛。</p>
<p>退符六卦精确对应：姤（五月）→遁（六月）→否（七月）→观（八月）→剥（九月）→坤（十月），阴气从初爻渐长至上爻，由一阴初生至纯阴极盛。</p>
<p>参同契原文引用：「朔旦为复，阳炁始通」「道穷则反，归乎坤元」——此二句概括了消息卦从复至坤的完整循环，阳极则阴生，阴极则阳复，周而复始。</p>`},{id:`cantongqi`,num:`五`,title:`参同契概要`,content:`<h4>魏伯阳与《周易参同契》</h4>
<p>《周易参同契》为东汉魏伯阳所著，被誉为"万古丹经王"。全书以周易卦象为框架，将大易、黄老、炉火三道合一，阐述内丹修炼之理。</p>
<h4>三道合一</h4>
<p>参同契的核心思想是"三道合一"：大易言阴阳变化之理，黄老言虚无自然之道，炉火言修炼实践之法。三者参同，故名参同契。</p>
<h4>乾坤为鼎器，坎离为药物</h4>
<p>参同契以乾坤为鼎器（修炼的容器），坎离为药物（修炼的原料）。乾为性体之刚，坤为命基之柔；坎为月精（阴中之阳），离为日魂（阳中之阴）。坎离交媾，即水火既济，是内丹修炼的核心。</p>
<h4>月相火候</h4>
<p>参同契以月相变化喻火候进退：朔旦为复（一阳生），望日为乾（纯阳极盛），晦日为坤（纯阴极盛）。修炼者当法月相之盈虚，进火退符，不违天时。</p>`},{id:`wuxing`,num:`六`,title:`五行生克`,content:`<h4>五行属性表</h4>
<table><tr><th>五行</th><th>方位</th><th>季节</th><th>颜色</th></tr>
<tr><td>木</td><td>东</td><td>春</td><td>青</td></tr>
<tr><td>火</td><td>南</td><td>夏</td><td>赤</td></tr>
<tr><td>土</td><td>中</td><td>长夏</td><td>黄</td></tr>
<tr><td>金</td><td>西</td><td>秋</td><td>白</td></tr>
<tr><td>水</td><td>北</td><td>冬</td><td>黑</td></tr>
</table>
<h4>相生关系</h4>
<p>木生火、火生土、土生金、金生水、水生木。相生表示一行对另一行的滋生助长，如木燃烧生火，火焚后成灰土，土中蕴金矿，金凝露生水，水滋润草木。</p>
<h4>相克关系</h4>
<p>木克土、土克水、水克火、火克金、金克木。相克表示一行对另一行的制约克制，如树木破土，堤坝挡水，水灭火焰，烈火熔金，利斧伐木。</p>
<h4>天干配五行</h4>
<table><tr><th>天干</th><th>五行</th></tr>
<tr><td>甲、乙</td><td>木</td></tr>
<tr><td>丙、丁</td><td>火</td></tr>
<tr><td>戊、己</td><td>土</td></tr>
<tr><td>庚、辛</td><td>金</td></tr>
<tr><td>壬、癸</td><td>水</td></tr>
</table>
<h4>地支配五行</h4>
<table><tr><th>地支</th><th>五行</th></tr>
<tr><td>寅、卯</td><td>木</td></tr>
<tr><td>巳、午</td><td>火</td></tr>
<tr><td>辰、戌、丑、未</td><td>土</td></tr>
<tr><td>申、酉</td><td>金</td></tr>
<tr><td>亥、子</td><td>水</td></tr>
</table>
<h4>五行与八卦</h4>
<table><tr><th>五行</th><th>八卦</th></tr>
<tr><td>金</td><td>乾、兑</td></tr>
<tr><td>木</td><td>震、巽</td></tr>
<tr><td>水</td><td>坎</td></tr>
<tr><td>火</td><td>离</td></tr>
<tr><td>土</td><td>坤、艮</td></tr>
</table>`},{id:`nazhi_full`,num:`七`,title:`完整纳支表`,content:`<h4>纳支法核心规则</h4>
<p>纳支法将十二地支分配于八卦六爻之中。阳卦纳阳支（子寅辰午申戌），阴卦纳阴支（丑卯巳未酉亥）。每卦六爻，从初爻到上爻依次纳入六个地支。阳卦顺行，阴卦逆行。</p>
<h4>八卦纳支全表</h4>
<table><tr><th>卦名</th><th>初爻</th><th>二爻</th><th>三爻</th><th>四爻</th><th>五爻</th><th>上爻</th></tr>
<tr><td>乾</td><td>子</td><td>寅</td><td>辰</td><td>午</td><td>申</td><td>戌</td></tr>
<tr><td>坎</td><td>寅</td><td>辰</td><td>午</td><td>申</td><td>戌</td><td>子</td></tr>
<tr><td>艮</td><td>辰</td><td>午</td><td>申</td><td>戌</td><td>子</td><td>寅</td></tr>
<tr><td>震</td><td>子</td><td>寅</td><td>辰</td><td>午</td><td>申</td><td>戌</td></tr>
<tr><td>坤</td><td>未</td><td>巳</td><td>卯</td><td>丑</td><td>亥</td><td>酉</td></tr>
<tr><td>离</td><td>卯</td><td>丑</td><td>亥</td><td>酉</td><td>未</td><td>巳</td></tr>
<tr><td>兑</td><td>巳</td><td>卯</td><td>丑</td><td>亥</td><td>酉</td><td>未</td></tr>
<tr><td>巽</td><td>丑</td><td>亥</td><td>酉</td><td>未</td><td>巳</td><td>卯</td></tr>
</table>
<h4>纳支选择规则</h4>
<p>推演时，以时辰地支查纳支表，找到该地支所在爻位，即为变爻位置。例如：乾卦时辰为午，查表可知午在四爻，则四爻为变爻。若同一地支在同一卦中出现两次（如坎卦中子出现在上爻），则取最接近的爻位。</p>`},{id:`hetu_luoshu`,num:`八`,title:`河图洛书`,content:`<h4>河图五行生成数</h4>
<p>河图以天地之数配五行，揭示五行生成的数理根源：</p>
<table><tr><th>五行</th><th>生数（天）</th><th>成数（地）</th><th>口诀</th></tr>
<tr><td>水</td><td>一</td><td>六</td><td>天一生水，地六成之</td></tr>
<tr><td>火</td><td>二</td><td>七</td><td>地二生火，天七成之</td></tr>
<tr><td>木</td><td>三</td><td>八</td><td>天三生木，地八成之</td></tr>
<tr><td>金</td><td>四</td><td>九</td><td>地四生金，天九成之</td></tr>
<tr><td>土</td><td>五</td><td>十</td><td>天五生土，地十成之</td></tr>
</table>
<h4>河图与纳甲的关联</h4>
<p>河图五行生成数与纳甲体系密切相关：乾纳甲壬，甲为天三生木之始，壬为天一生水之成；坤纳乙癸，乙为地二生火之始，癸为地十成土之终。河图的数理结构为纳甲配天干提供了哲学基础。</p>
<h4>洛书九宫数</h4>
<p>洛书为九宫之数，口诀为「戴九履一、左三右七、二四为肩、六八为足、五居中央」：</p>
<table><tr><th>宫位</th><th>数字</th><th>方位</th></tr>
<tr><td>上（南）</td><td>九</td><td>离</td></tr>
<tr><td>下（北）</td><td>一</td><td>坎</td></tr>
<tr><td>左（东）</td><td>三</td><td>震</td></tr>
<tr><td>右（西）</td><td>七</td><td>兑</td></tr>
<tr><td>左上（东南）</td><td>四</td><td>巽</td></tr>
<tr><td>右上（西南）</td><td>二</td><td>坤</td></tr>
<tr><td>左下（东北）</td><td>八</td><td>艮</td></tr>
<tr><td>右下（西北）</td><td>六</td><td>乾</td></tr>
<tr><td>中央</td><td>五</td><td>中宫</td></tr>
</table>
<h4>洛书与后天八卦方位</h4>
<p>洛书九宫数与后天八卦方位一一对应：一坎居北、九离居南、三震居东、七兑居西、二坤居西南、四巽居东南、六乾居西北、八艮居东北、五居中央。此即文王后天八卦方位的数理依据，参同契中坎离定位即源于此。</p>`},{id:`changing_yao`,num:`九`,title:`变爻规则详述`,content:`<h4>变爻定位法</h4>
<p>变爻定位的步骤：取当前时辰的地支，在所得卦象的纳支表中查找该地支对应的爻位，该爻即为变爻位置。</p>
<p>具体流程：时地支→纳支表→爻位→变爻位置。例如：得乾卦，时辰为午，查乾卦纳支表，午在四爻，则变爻为第四爻。</p>
<h4>变爻计算</h4>
<p>变爻位置的计算方式：yao_position % 6，若结果为0则取6。即爻位以六为周期循环，确保变爻始终落在初爻至上爻之间。</p>
<h4>变卦计算</h4>
<p>确定变爻后，将该爻的阴阳翻转（阳爻变阴爻，阴爻变阳爻），重新组合上下卦，即得变卦。例如：乾卦（纯阳）四爻变，则四爻由阳变阴，上卦由乾变为巽，下卦仍为乾，变卦为天风姤。</p>
<h4>趋势研判（辅助）</h4>
<p>消息卦阶段与卦象趋势的协调性分析：若当前处于进火阶段（复至乾），变卦趋势亦为阳长阴消，则趋势与天时相合；若变卦趋势为阴长阳消，则与天时相逆，需谨慎对待。反之亦然。</p>
<p>⚠️ 趋势研判为辅助参考，非参同契原文规则，仅供推演时综合研判之用。</p>`},{id:`derivation_flow`,num:`十`,title:`推演全流程`,content:`<h4>完整七步推演链</h4>
<p>参同契推演包含以下七个步骤，环环相扣：</p>
<table><tr><th>步骤</th><th>输入</th><th>规则</th><th>输出</th></tr>
<tr><td>一、定日干支</td><td>公历日期</td><td>六十甲子纪日法</td><td>日天干、日地支</td></tr>
<tr><td>二、定时干支</td><td>当前时辰</td><td>十二地支纪时法</td><td>时天干、时地支</td></tr>
<tr><td>三、纳甲定卦</td><td>日天干</td><td>纳甲表：天干→八卦</td><td>本卦</td></tr>
<tr><td>四、消息定时</td><td>农历月份</td><td>十二消息卦表</td><td>消息卦</td></tr>
<tr><td>五、纳支定爻</td><td>时地支+本卦</td><td>纳支表：地支→爻位</td><td>变爻位置</td></tr>
<tr><td>六、变爻得变卦</td><td>本卦+变爻</td><td>阴阳翻转，重组上下卦</td><td>变卦</td></tr>
<tr><td>七、趋势研判（辅助）</td><td>消息卦+变卦</td><td>阶段协调性分析</td><td>趋势判断</td></tr>
</table>
<h4>示例推演（丙午日辰时）</h4>
<p>第一步：定日干支——丙午日，日天干为丙，日地支为午。</p>
<p>第二步：定时干支——辰时，时地支为辰。</p>
<p>第三步：纳甲定卦——丙纳艮，本卦为艮卦☶。</p>
<p>第四步：消息定时——假设当前为正月，消息卦为泰卦䷊。</p>
<p>第五步：纳支定爻——艮卦纳支表：初爻辰、二爻午、三爻申、四爻戌、五爻子、上爻寅。时地支为辰，查表得辰在初爻，变爻位置为1。</p>
<p>第六步：变爻得变卦——艮卦初爻变（阳变阴），下卦由艮☶变为离☲，上卦仍为艮☶，变卦为火山旅䷷。</p>
<p>第七步：趋势研判——正月泰卦为进火阶段，旅卦趋势需结合卦义综合分析。</p>
<h4>辅助步骤与原文步骤的区分</h4>
<p>步骤一至六为参同契原文推演规则，步骤七（趋势研判）为辅助参考，非参同契原文规则。推演时以步骤一至六为核心，步骤七仅作综合研判之参考。</p>`},{id:`cultivation_basics`,num:`十一`,title:`修心心法`,content:`<h4>心法来源</h4>
<p>参同契原文中蕴含丰富的修心要诀，其核心在于"内以养己，安静虚无"，以静定之功涵养本元。以下心法口诀皆源自参同契原文，按消息卦阶段分组，便于修炼者依时用功。</p>
<h4>进火阶段心法（复至乾）</h4>
<table><tr><th>消息卦</th><th>农历月</th><th>心法口诀</th></tr>
<tr><td>复</td><td>十一月</td><td>一阳初动，收视返听，温养下丹</td></tr>
<tr><td>临</td><td>十二月</td><td>二阳浸长，守中抱一，勿忘勿助</td></tr>
<tr><td>泰</td><td>正月</td><td>三阳开泰，心息相依，水火既济</td></tr>
<tr><td>大壮</td><td>二月</td><td>四阳盛壮，防危虑险，不可纵逸</td></tr>
<tr><td>夬</td><td>三月</td><td>五阳决阴，刚决柔断，一意冲和</td></tr>
<tr><td>乾</td><td>四月</td><td>纯阳极盛，含光默默，不骄不盈</td></tr>
</table>
<h4>退符阶段心法（姤至坤）</h4>
<table><tr><th>消息卦</th><th>农历月</th><th>心法口诀</th></tr>
<tr><td>姤</td><td>五月</td><td>一阴初生，防微杜渐，收敛心神</td></tr>
<tr><td>遁</td><td>六月</td><td>二阴渐长，退藏于密，养精蓄锐</td></tr>
<tr><td>否</td><td>七月</td><td>天地不交，安于静定，不妄作为</td></tr>
<tr><td>观</td><td>八月</td><td>四阴观瞻，返观内照，照见本心</td></tr>
<tr><td>剥</td><td>九月</td><td>五阴剥阳，守一不失，静待阳复</td></tr>
<tr><td>坤</td><td>十月</td><td>纯阴极盛，归根复命，静极生动</td></tr>
</table>
<h4>践行方法</h4>
<p>每日静坐：择安静之所，盘膝端坐，脊直肩松，舌抵上腭，双目微闭。先调身，再调息，后调心。</p>
<p>观想：进火时观想丹田温暖，阳气自下而上渐升；退符时观想月华如水，清凉自上而下润泽全身。</p>
<p>调息：呼吸绵绵若存，进火时息稍长，退符时息稍细，以不疾不徐为度，自然为宗。</p>
<h4>参同契修心原文选录</h4>
<p>「内以养己，安静虚无」——修炼之根本在于内养己身，安守静定虚无之境。</p>
<p>「闭塞其兑，筑固灵株」——关闭感官外驰之门，筑牢灵根之基。</p>

p><p data-v-35bfe4e5><strong data-v-35bfe4e5>想解决的问题：</strong></p><ul data-v-35bfe4e5><li data-v-35bfe4e5>易学知识门槛高，缺乏把卦象转化为「今日该做什么」的实用工具</li><li data-v-35bfe4e5>现有黄历应用多停留在吉凶宜忌，缺少心性修炼与反思的闭环</li><li data-v-35bfe4e5>节气养生建议笼统，无法结合当日卦象给出个性化指导</li></ul><p data-v-35bfe4e5><strong data-v-35bfe4e5>为什么做这个方向：</strong>选择把抽象的易学理论工程化为可计算、可体验的日历应用，让评审与用户能直观感受「古老智慧 + 现代工程」的结合价值。参同契的火候论（进火/退符）天然适合做时间维度的指导，十二消息卦与节气月的映射提供了稳定的算法骨架。</p></div></section><section class="block" data-v-35bfe4e5><h2 class="block-title" data-v-35bfe4e5>三、技术栈与架构</h2><div class="block-body" data-v-35bfe4e5><table class="tech-table" data-v-35bfe4e5><thead data-v-35bfe4e5><tr data-v-35bfe4e5><th data-v-35bfe4e5>层级</th><th data-v-35bfe4e5>技术</th><th data-v-35bfe4e5>用途</th></tr></thead><tbody data-v-35bfe4e5><tr data-v-35bfe4e5><td data-v-35bfe4e5>后端</td><td data-v-35bfe4e5>Python 3.13 / FastAPI / SQLAlchemy</td><td data-v-35bfe4e5>API 服务与计算引擎</td></tr><tr data-v-35bfe4e5><td data-v-35bfe4e5>前端</td><td data-v-35bfe4e5>Vue 3 / TypeScript / Vite</td><td data-v-35bfe4e5>渐进式分层 UI</td></tr><tr data-v-35bfe4e5><td data-v-35bfe4e5>天文计算</td><td data-v-35bfe4e5>寿星简化算法（VSOP87）</td><td data-v-35bfe4e5>24 节气精确计算</td></tr><tr data-v-35bfe4e5><td data-v-35bfe4e5>历法计算</td><td data-v-35bfe4e5>lunarcalendar</td><td data-v-35bfe4e5>农历与干支推算</td></tr><tr data-v-35bfe4e5><td data-v-35bfe4e5>数据</td><td data-v-35bfe4e5>JSON 数据文件 + SQLite</td><td data-v-35bfe4e5>卦象文本与待办存储</td></tr><tr data-v-35bfe4e5><td data-v-35bfe4e5>测试</td><td data-v-35bfe4e5>pytest</td><td data-v-35bfe4e5>81 个用例覆盖全部引擎</td></tr></tbody></table><p class="note" data-v-35bfe4e5>核心计算由 <code data-v-35bfe4e5>CantongqiEngine</code> 编排，按 历法 → 消息卦 → 日卦 → 时辰 → 推导链 → 行动指南 → 修心口诀 → 生活指导 → 引导问题 的流水线依次调用 9 个子引擎。</p></div></section><section class="block" data-v-35bfe4e5><h2 class="block-title" data-v-35bfe4e5>四、TRAE 实践过程</h2><div class="block-body" data-v-35bfe4e5><p data-v-35bfe4e5>本项目全程使用 TRAE IDE 完成开发，关键实践包括：</p><ul data-v-35bfe4e5><li data-v-35bfe4e5><strong data-v-35bfe4e5>需求拆解：</strong>用 TRAE 智能体把参同契理论拆解为可计算的算法模块（节气计算、纳甲法、纳支法、消息卦映射等）</li><li data-v-35bfe4e5><strong data-v-35bfe4e5>引擎开发：</strong>9 个子引擎逐个实现，每个引擎配 JSON 数据文件 + pytest 测试用例</li><li data-v-35bfe4e5><strong data-v-35bfe4e5>前后端联调：</strong>用 TRAE 生成 Pydantic Schema 与 TypeScript 类型，保证前后端契约一致</li><li data-v-35bfe4e5><strong data-v-35bfe4e5>代码审查：</strong>用 TRAE 的审查能力发现并修复了引擎硬编码、JSON 中文引号、前后端 key 不一致等问题（详见项目规则记忆库）</li></ul><p class="note" data-v-35bfe4e5>开发关键步骤截图与关键任务对话的 Session ID 详见参赛帖正文。</p></div></section><section class="block" data-v-35bfe4e5><h2 class="block-title" data-v-35bfe4e5>五、安全声明</h2><div class="block-body" data-v-35bfe4e5><p class="safety-note" data-v-35bfe4e5>本项目以《周易参同契》的哲学思想与历法智慧为研究对象，提供文化学习与生活指导，<strong data-v-35bfe4e5>不涉及任何宗教、迷信或实体修炼行为</strong>。所有「修持」「火候」等术语均为传统文化概念的工程化表达，不构成医疗、养生或宗教建议。请以理性、学术的态度使用。</p></div></section><section class="block" data-v-35bfe4e5><h2 class="block-title" data-v-35bfe4e5>六、体验方式</h2><div class="block-body" data-v-35bfe4e5><p data-v-35bfe4e5><strong data-v-35bfe4e5>本地启动：</strong>项目根目录运行 <code data-v-35bfe4e5>start.bat</code>，自动安装依赖、构建前端、启动服务，访问 <code data-v-35bfe4e5>http://localhost:8000</code></p><p data-v-35bfe4e5><strong data-v-35bfe4e5>云端体验：</strong>部署指引见 <code data-v-35bfe4e5>SUBMISSION.md</code> 文档。</p><p data-v-35bfe4e5>打开后默认进入「每日总览」页，可使用顶部日期导航切换日期，点击「深入」按钮逐层展开生活指导与推演链。</p></div></section>`,7)]])}var fb,pb,mb,hb=t((()=>{K(),lb(),Ns(),fb={},pb={class:`about-view`},mb=Ms(fb,[[`render`,db],[`__scopeId`,`data-v-35bfe4e5`]])}));Kl();var gb=Al({history:cl(),routes:[{path:`/`,name:`daily`,component:()=>Xl(()=>Promise.resolve().then(()=>(Bv(),Rv)),void 0,import.meta.url)},{path:`/basics`,name:`basics`,component:()=>Xl(()=>Promise.resolve().then(()=>($v(),Zv)),void 0,import.meta.url)},{path:`/basics/:section`,name:`basics-section`,component:()=>Xl(()=>Promise.resolve().then(()=>($v(),Zv)),void 0,import.meta.url)},{path:`/todos`,name:`todos`,component:()=>Xl(()=>Promise.resolve().then(()=>(Ey(),wy)),void 0,import.meta.url)},{path:`/review`,name:`rev
