<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时记 - AI沉浸式专注舱</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg-deep: #0a0e27;
    --bg-surface: rgba(20,25,55,0.85);
    --bg-card: rgba(25,30,60,0.9);
    --text: #e8eaf6;
    --text-secondary: #8892b0;
    --accent: #00d4ff;
    --accent-glow: rgba(0,212,255,0.3);
    --accent-warm: #ff6b9d;
    --accent-warm-glow: rgba(255,107,157,0.3);
    --success: #00e5a0;
    --warning: #ffd700;
    --border: rgba(255,255,255,0.08);
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.1);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  #particle-canvas {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index: 0;
    pointer-events: none;
  }
  .app-container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: opacity 0.6s ease;
  }
  .app-container.immersive {
    opacity: 0;
    pointer-events: none;
  }

  /* Loading */
  .loading-screen {
    position: fixed; inset: 0;
    background: var(--bg-deep);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10000;
    transition: opacity 0.8s ease;
  }
  .loading-screen.hidden { opacity: 0; pointer-events: none; }
  .loading-logo {
    font-size: 56px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-warm));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: loadingPulse 2s ease infinite;
  }
  .loading-subtitle {
    margin-top: 12px; font-size: 14px;
    color: var(--text-secondary); letter-spacing: 4px;
  }
  .loading-bar {
    width: 200px; height: 3px;
    background: var(--glass-border);
    border-radius: 3px; margin-top: 24px;
    overflow: hidden;
  }
  .loading-bar-inner {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-warm));
    border-radius: 3px;
    animation: loadingBar 1.5s ease forwards;
  }
  @keyframes loadingPulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.7; }
  }
  @keyframes loadingBar {
    0% { width: 0%; }
    100% { width: 100%; }
  }

  /* Immersive overlay */
  .immersive-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; cursor: none;
  }
  .immersive-overlay.active { display: flex; }
  .immersive-hint {
    position: absolute; bottom: 40px;
    font-size: 12px; color: rgba(255,255,255,0.25);
    letter-spacing: 2px;
    animation: fadeInUp 1s ease 2s both;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .immersive-timer {
    font-size: 96px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -3px;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 60px var(--accent-glow);
  }
  .immersive-activity {
    font-size: 18px; color: var(--accent);
    margin-top: 12px; font-weight: 600;
    opacity: 0.8;
  }
  .immersive-breath {
    position: absolute;
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 2px solid rgba(0,212,255,0.3);
    top: calc(50% - 180px);
    animation: breathe 19s ease infinite;
  }
  .immersive-breath-label {
    position: absolute;
    top: calc(50% - 180px);
    font-size: 13px; color: var(--accent);
    opacity: 0.6; font-weight: 500;
    width: 160px; text-align: center;
    line-height: 160px;
  }
  @keyframes breathe {
    0%,100% { transform: scale(0.5); opacity: 0.2; }
    21% { transform: scale(1); opacity: 0.6; }
    57.8% { transform: scale(1); opacity: 0.6; }
    78.9% { transform: scale(0.5); opacity: 0.2; }
  }
  .immersive-stop-btn {
    position: absolute; bottom: 80px;
    padding: 12px 40px; border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5);
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.3s;
    backdrop-filter: blur(10px);
    opacity: 0;
    animation: fadeInUp 0.5s ease 1.5s both;
  }
  .immersive-stop-btn:hover {
    background: rgba(255,71,87,0.2);
    border-color: rgba(255,71,87,0.4);
    color: #ff6b9d;
  }

  /* Firework canvas */
  #firework-canvas {
    position: fixed; inset: 0; z-index: 9998;
    pointer-events: none;
  }

  /* Reflection modal */
  .reflection-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(10,14,39,0.9);
    backdrop-filter: blur(20px);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    animation: fadeIn 0.4s ease;
  }
  .reflection-overlay.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  .reflection-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px; width: 90%;
    max-width: 440px;
    text-align: center;
    animation: slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .reflection-icon { font-size: 48px; margin-bottom: 16px; }
  .reflection-title {
    font-size: 20px; font-weight: 700;
    margin-bottom: 8px;
  }
  .reflection-subtitle {
    font-size: 14px; color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .reflection-input {
    width: 100%; padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--text);
    font-size: 15px; font-family: inherit;
    outline: none; resize: none;
    transition: border-color 0.3s;
    margin-bottom: 16px;
  }
  .reflection-input:focus {
    border-color: var(--accent);
  }
  .reflection-input::placeholder {
    color: var(--text-secondary); opacity: 0.5;
  }
  .reflection-actions {
    display: flex; gap: 10px; justify-content: center;
  }
  .reflection-btn {
    padding: 10px 24px; border-radius: 12px;
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    border: none;
  }
  .reflection-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-warm));
    color: #fff;
  }
  .reflection-btn.secondary {
    background: var(--glass);
    color: var(--text-secondary);
    border: 1px solid var(--glass-border);
  }

  /* Navigation */
  .nav-bar {
    display: flex; justify-content: space-between;
    align-items: center; padding: 20px 0;
    position: sticky; top: 0;
    background: linear-gradient(180deg, var(--bg-deep) 60%, transparent);
    z-index: 100;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
  }
  .nav-logo-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-warm));
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .nav-logo-icon svg {
    width: 20px; height: 20px;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-title {
    font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-warm));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .nav-right {
    display: flex; align-items: center; gap: 12px;
  }
  .streak-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    font-size: 13px; font-weight: 600;
    color: var(--warning);
    cursor: default;
    transition: all 0.3s;
  }
  .streak-badge:hover {
    box-shadow: 0 0 20px rgba(255,215,0,0.2);
  }
  .streak-flame {
    font-size: 16px;
    animation: flameWiggle 0.5s ease infinite alternate;
  }
  @keyframes flameWiggle {
    from { transform: rotate(-3deg) scale(1); }
    to { transform: rotate(3deg) scale(1.1); }
  }
  .streak-badge.inactive {
    color: var(--text-secondary);
    opacity: 0.5;
  }
  .streak-badge.inactive .streak-flame {
    animation: none;
    opacity: 0.4;
  }
  .nav-links {
    display: flex; gap: 6px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 4px;
    backdrop-filter: blur(20px);
  }
  .nav-link {
    padding: 8px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer; transition: all 0.3s;
    border: none; background: transparent;
  }
  .nav-link:hover { color: var(--text); }
  .nav-link.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-warm));
    color: #fff; font-weight: 600;
    box-shadow: 0 4px 20px var(--accent-glow);
  }

  /* Pages */
  .page {
    display: none; flex: 1;
    flex-direction: column;
    animation: pageEnter 0.5s ease;
    padding-bottom: 40px;
  }
  .page.active { display: flex; }
  @keyframes pageEnter {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== FOCUS CHAMBER ===== */
  .focus-chamber {
    flex: 1; display: flex;
    flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    position: relative;
    padding: 20px 0;
  }
  .focus-greeting {
    font-size: 15px; color: var(--text-secondary);
    margin-bottom: 8px; letter-spacing: 1px;
  }
  .focus-title {
    font-size: 32px; font-weight: 700;
    margin-bottom: 32px;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .activity-bar {
    display: flex; flex-wrap: wrap;
    gap: 8px; justify-content: center;
    margin-bottom: 40px; max-width: 500px;
  }
  .activity-pill {
    padding: 10px 22px; border-radius: 24px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.3s;
    color: var(--text-secondary);
    backdrop-filter: blur(10px);
  }
  .activity-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .activity-pill.selected {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(255,107,157,0.15));
    color: var(--accent);
    box-shadow: 0 0 25px var(--accent-glow);
  }

  .focus-button-wrapper {
    position: relative;
    width: 260px; height: 260px;
    display: flex; align-items: center; justify-content: center;
  }
  .focus-button-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid var(--glass-border);
    animation: ringPulse 3s ease infinite;
  }
  .focus-button-ring::before,
  .focus-button-ring::after {
    content: ''; position: absolute;
    border-radius: 50%; border: 1px solid var(--glass-border);
  }
  .focus-button-ring::before { inset: -15px; animation: ringPulse 3s ease infinite 0.5s; }
  .focus-button-ring::after { inset: -30px; animation: ringPulse 3s ease infinite 1s; }
  @keyframes ringPulse {
    0%,100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.02); opacity: 0.6; }
  }

  .focus-button {
    width: 200px; height: 200px;
    border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-warm));
    color: #fff; font-size: 18px; font-weight: 700;
    cursor: pointer; transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 0 60px var(--accent-glow), 0 0 120px rgba(0,212,255,0.1);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px; position: relative; z-index: 2;
    letter-spacing: 2px;
  }
  .focus-button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 80px var(--accent-glow), 0 0 160px rgba(0,212,255,0.15);
  }
  .focus-button.recording {
    background: linear-gradient(135deg, #ff4757, #ff6b9d);
    box-shadow: 0 0 60px var(--accent-warm-glow), 0 0 120px rgba(255,107,157,0.1);
    animation: recordingPulse 2s ease infinite;
  }
  @keyframes recordingPulse {
    0%,100% { box-shadow: 0 0 60px var(--accent-warm-glow), 0 0 120px rgba(255,107,157,0.1); }
    50% { box-shadow: 0 0 80px var(--accent-warm-glow), 0 0 160px rgba(255,107,157,0.2); }
  }
  .focus-button .btn-icon { font-size: 36px; }
  .focus-button .btn-label { font-size: 14px; font-weight: 600; }

  .timer-display {
    font-size: 64px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    margin-top: 36px;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .timer-activity {
    font-size: 16px; font-weight: 600;
    color: var(--accent); margin-top: 8px;
  }
  .timer-hint {
    font-size: 12px; color: var(--text-secondary);
    margin-top: 16px; opacity: 0.7;
  }

  /* ===== DASHBOARD ===== */
  .page-header {
    font-size: 28px; font-weight: 700;
    margin: 24px 0 20px;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stats-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; margin-bottom: 20px;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 20px;
    text-align: center;
    backdrop-filter: blur(20px);
    transition: all 0.3s;
  }
  .stat-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 30px var(--accent-glow);
  }
  .stat-value {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-warm));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 11px; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 1px;
  }

  .chart-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(20px);
  }
  .chart-title {
    font-size: 15px; font-weight: 600;
    margin-bottom: 16px; color: var(--text);
  }

  .history-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px; overflow: hidden;
    backdrop-filter: blur(20px);
  }
  .history-item {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
    align-items: center;
  }
  .history-item:last-child { border-bottom: none; }
  .history-activity { font-weight: 600; font-size: 14px; }
  .history-time { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .history-duration { font-weight: 700; font-size: 16px; color: var(--accent); }

  /* ===== AI COACH ===== */
  .coach-header {
    display: flex; align-items: center; gap: 12px;
    margin: 24px 0 20px;
  }
  .coach-avatar {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-warm));
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; box-shadow: 0 4px 20px var(--accent-glow);
  }
  .coach-name { font-size: 20px; font-weight: 700; }
  .coach-role { font-size: 12px; color: var(--text-secondary); }

  .coach-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 24px;
    margin-bottom: 16px;
    backdrop-filter: blur(20px);
    transition: all 0.3s;
  }
  .coach-card:hover { border-color: var(--accent); }
  .coach-card-title {
    font-size: 16px; font-weight: 700;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .coach-progress {
    height: 8px; background: var(--glass);
    border-radius: 4px; overflow: hidden;
    margin: 12px 0;
  }
  .coach-progress-bar {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-warm));
    transition: width 1s ease;
  }
  .coach-insight {
    display: flex; gap: 14px; margin-bottom: 16px;
    padding: 16px; background: var(--glass);
    border-radius: 14px; border: 1px solid var(--glass-border);
  }
  .coach-insight-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .coach-insight-icon.good { background: rgba(0,229,160,0.1); }
  .coach-insight-icon.tip { background: rgba(255,215,0,0.1); }
  .coach-insight-icon.info { background: rgba(0,212,255,0.1); }
  .coach-insight-text { font-size: 14px; line-height: 1.7; }
  .coach-insight-label {
    font-size: 11px; font-weight: 700;
    color: var(--text-secondary); margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 1px;
  }

  /* ===== SETTINGS ===== */
  .settings-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 24px;
    margin-bottom: 16px;
    backdrop-filter: blur(20px);
  }
  .settings-title {
    font-size: 16px; font-weight: 700;
    margin-bottom: 16px;
  }
  .activity-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; background: var(--glass);
    border-radius: 12px; margin-bottom: 8px;
    border: 1px solid var(--glass-border);
  }
  .activity-input {
    flex: 1; border: none; background: transparent;
    font-size: 15px; font-family: inherit;
    color: var(--text); outline: none;
  }
  .activity-delete {
    width: 32px; height: 32px; border-radius: 8px;
    border: none; background: rgba(255,71,87,0.1);
    color: #ff4757; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .activity-delete:hover { background: #ff4757; color: #fff; }
  .add-btn {
    width: 100%; padding: 12px;
    border: 1px dashed var(--glass-border);
    border-radius: 12px; background: transparent;
    color: var(--text-secondary); font-size: 15px;
    font-weight: 500; cursor: pointer; transition: all 0.2s;
    margin-top: 8px;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-secondary {
    background: var(--glass); color: var(--text);
    border: 1px solid var(--glass-border);
    padding: 10px 20px; border-radius: 12px;
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    background: rgba(255,71,87,0.1); color: #ff4757;
    border: none; padding: 10px 20px;
    border-radius: 12px; font-size: 14px;
    font-weight: 500; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-danger:hover { background: #ff4757; color: #fff; }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-secondary);
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-text { font-size: 16px; margin-bottom: 8px; }
  .empty-subtext { font-size: 14px; opacity: 0.7; }

  /* Toast */
  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--bg-card); color: var(--text);
    padding: 14px 28px; border-radius: 14px;
    font-size: 14px; font-weight: 500;
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 10000; opacity: 0;

  }

</style>
</head>

<div class="toast" id="toast"></div>

<script>
// ===== PARTICLE SYSTEM =====
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let particleSpeed = 0.3;

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * particleSpeed;
    this.speedY = (Math.random() - 0.5) * particleSpeed;
    this.opacity = Math.random() * 0.5 + 0.1;
    this.hue = Math.random() > 0.5 ? 190 : 340;
  }
  update() {
    this.x += this.speedX; this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, ${this.opacity})`;
    ctx.fill();
  }
}
for (let i = 0; i < 80; i++) particles.push(new Particle());

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(0,212,255,${0.08 * (1 - dist / 120)})`;
        ctx.lineWidth = 0.5; ctx.stroke();
      }
    }
  }
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// ===== FIREWORK SYSTEM =====
const fwCanvas = document.getElementById('firework-canvas');
const fwCtx = fwCanvas.getContext('2d');
let fireworkParticles = [];

function resizeFwCanvas() { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; }
resizeFwCanvas();
window.addEventListener('resize', resizeFwCanvas);

function launchFirework(cx, cy) {
  const colors = ['#00d4ff','#ff6b9d','#00e5a0','#ffd700','#a78bfa','#f472b6','#fff'];
  for (let i = 0; i < 60; i++) {
    const angle = (Math.PI * 2 / 60) * i;
    const speed = Math.random() * 5 + 2;
    fireworkParticles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.02 + 0.01,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: Math.random() * 3 + 1
    });
  }
  animateFireworks();
}

function animateFireworks() {
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  fireworkParticles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05; // gravity
    p.life -= p.decay;
    if (p.life <= 0) return;
    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    fwCtx.fillStyle = p.color;
    fwCtx.globalAlpha = p.life;
    fwCtx.fill();
    fwCtx.globalAlpha = 1;
  });
  fireworkParticles = fireworkParticles.filter(p => p.life > 0);
  if (fireworkParticles.length > 0) requestAnimationFrame(animateFireworks);
}

// ===== APP STATE =====
const App = {
  activities: JSON.parse(localStorage.getItem('sj_activities')) || ['深度工作','阅读学习','运动健身','写作创作','冥想休息'],
  records: JSON.parse(localStorage.getItem('sj_records')) || [],
  goals: JSON.parse(localStorage.getItem('sj_goals')) || {},
  reflections: JSON.parse(localStorage.getItem('sj_reflections')) || [],
  streak: JSON.parse(localStorage.getItem('sj_streak')) || { count: 0, lastDate: null },
  currentActivity: null, startTime: null,
  timerInterval: null, selectedActivity: null,
  audioCtx: null, immersiveActive: false
};

// ===== UTILS =====
const $ = id => document.getElementById(id);
const fmtDur = ms => {
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
};
const fmtShort = ms => {
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h > 0 ? `${h}小时${m}分` : `${m}分钟`;
};
const fmtDate = d => {
  const x = new Date(d);
  return `${x.getMonth()+1}月${x.getDate()}日 ${x.getHours().toString().padStart(2,'0')}:${x.getMinutes().toString().padStart(2,'0')}`;
};
const toast = msg => {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
};
const save = () => {
  localStorage.setItem('sj_activities', JSON.stringify(App.activities));
  localStorage.setItem('sj_records', JSON.stringify(App.records));
  localStorage.setItem('sj_goals', JSON.stringify(App.goals));
  localStorage.setItem('sj_reflections', JSON.stringify(App.reflections));
  localStorage.setItem('sj_streak', JSON.stringify(App.streak));
};

// ===== STREAK =====
function updateStreak() {
  const today = new Date().toDateString();
  if (App.streak.lastDate === today) return; // already updated today
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (App.streak.lastDate === yesterday) {
    App.streak.count++;
  } else if (App.streak.lastDate !== today) {
    App.streak.count = 1;
  }
  App.streak.lastDate = today;
  save();
  renderStreak();
}

function renderStreak() {
  const badge = $('streak-badge');
  const text = $('streak-text');
  text.textContent = `连续${App.streak.count}天`;
  if (App.streak.count > 0) {
    badge.classList.remove('inactive');
  } else {
    badge.classList.add('inactive');
  }
}

// ===== BREATHING LABEL =====
function startBreathLabel() {
  const label = $('breath-label');
  if (!label) return;
  // 4-7-8 pattern: inhale 4s, hold 7s, exhale 8s = 19s total
  const phases = [
    { text: '吸气', start: 0 },
    { text: '屏息', start: 4 },
    { text: '呼气', start: 11 },
  ];
  function updateLabel() {
    if (!App.immersiveActive) return;
    const t = (Date.now() / 1000) % 19;
    let current = phases[0];
    for (const p of phases) { if (t >= p.start) current = p; }
    label.textContent = current.text;
    requestAnimationFrame(updateLabel);
  }
  updateLabel();
}

// ===== AUDIO =====
function initAudio() {
  if (!App.audioCtx) App.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
  try {
    initAudio();
    if (App.audioCtx.state === 'suspended') App.audioCtx.resume();
    const o = App.audioCtx.createOscillator();
    const g = App.audioCtx.createGain();
    o.connect(g); g.connect(App.audioCtx.destination);
    if (type === 'start') {
      o.type = 'sine';
      o.frequency.setValueAtTime(523, App.audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(880, App.audioCtx.currentTime + 0.15);
      g.gain.setValueAtTime(0.1, App.audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, App.audioCtx.currentTime + 0.2);
      o.start(); o.stop(App.audioCtx.currentTime + 0.2);
    } else if (type === 'stop') {
      o.type = 'sine';
      o.frequency.setValueAtTime(880, App.audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(523, App.audioCtx.currentTime + 0.15);
      g.gain.setValueAtTime(0.1, App.audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, App.audioCtx.currentTime + 0.2);
      o.start(); o.stop(App.audioCtx.currentTime + 0.2);
    } else if (type === 'complete') {
      [523,659,784].forEach((f,i) => {
        const o2 = App.audioCtx.createOscillator();
        const g2 = App.audioCtx.createGain();
        o2.connect(g2); g2.connect(App.audioCtx.destination);
        o2.frequency.setValueAtTime(f, App.audioCtx.currentTime + i * 0.12);
        g2.gain.setValueAtTime(0.08, App.audioCtx.currentTime + i * 0.12);
        g2.gain.exponentialRampToValueAtTime(0.001, App.audioCtx.currentTime + i * 0.12 + 0.15);
        o2.start(App.audioCtx.currentTime + i * 0.12);
        o2.stop(App.audioCtx.currentTime + i * 0.12 + 0.15);
      });
    }
  } catch(e) {}
}

// ===== NAVIGATION =====
document.querySelectorAll('.nav-link').forEach(l => {
  l.addEventListener('click', () => {
    document.querySelectorAll('.nav-link').forEach(x => x.classList.remove('active'));
    l.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $(l.dataset.page + '-page').classList.add('active');
    if (l.dataset.page === 'dashboard') renderDashboard();
    if (l.dataset.page === 'coach') renderCoach();
    if (l.dataset.page === 'settings') renderSettings();
  });
});

// ===== FOCUS CHAMBER =====
function renderPills() {
  $('activity-pills').innerHTML = '';
  App.activities.forEach(a => {
    const p = document.createElement('button');
    p.className = 'activity-pill' + (App.selectedActivity === a ? ' selected' : '');
    p.textContent = a;
    p.addEventListener('click', () => {
      if (App.startTime) return;
      App.selectedActivity = a;
      renderPills();
    });
    $('activity-pills').appendChild(p);
  });
}

function updateTimer() {
  if (!App.startTime) return;
  const t = fmtDur(Date.now() - App.startTime);
  $('timer-display').textContent = t;
  if (App.immersiveActive) $('immersive-timer').textContent = t;
}

function enterImmersive() {
  App.immersiveActive = true;
  $('immersive-overlay').classList.add('active');
  $('app-container').classList.add('immersive');
  $('immersive-activity').textContent = App.currentActivity;
  $('immersive-timer').textContent = fmtDur(Date.now() - App.startTime);
  startBreathLabel();
}

function exitImmersive() {
  App.immersiveActive = false;
  $('immersive-overlay').classList.remove('active');
  $('app-container').classList.remove('immersive');
}

function stopFocus() {
  const end = Date.now(), dur = end - App.startTime;
  App.records.push({ activity: App.currentActivity, startTime: App.startTime, endTime: end, duration: dur });
  const today = new Date().toDateString();
  if (!App.goals[today]) App.goals[today] = { target: 120, actual: 0 };
  App.goals[today].actual += Math.floor(dur / 60000);
  updateStreak();
  save();

  clearInterval(App.timerInterval);

  // Exit immersive if active
  exitImmersive();

  App.startTime = null; App.currentActivity = null;
  $('focus-button').classList.remove('recording');
  $('btn-icon').textContent = '\u25B6';
  $('btn-label').textContent = '开始专注';
  $('timer-display').style.display = 'none';
  $('timer-activity').style.display = 'none';
  $('focus-title').textContent = '选择活动，开启专注';
  $('focus-greeting').textContent = '准备好进入心流状态了吗？';
  $('activity-pills').style.pointerEvents = 'auto';
  $('activity-pills').style.opacity = '1';
  $('timer-hint').textContent = '按空格键快速开始 · 专注后自动进入沉浸模式';
  particleSpeed = 0.3;

  playSound('stop');
  setTimeout(() => playSound('complete'), 250);

  // Firework!
  launchFirework(window.innerWidth / 2, window.innerHeight / 2);
  setTimeout(() => launchFirework(window.innerWidth / 2 - 60, window.innerHeight / 2 - 30), 200);
  setTimeout(() => launchFirework(window.innerWidth / 2 + 60, window.innerHeight / 2 + 30), 400);

  // Show reflection modal
  showReflection(dur, App.records[App.records.length - 1].activity);
}

function showReflection(dur, activity) {
  $('reflection-title').textContent = `${activity} · ${fmtShort(dur)}`;
  $('reflection-subtitle').textContent = '这段时间最大的收获是？';
  $('reflection-input').value = '';
  $('reflection-overlay').classList.add('active');
  setTimeout(() => $('reflection-input').focus(), 400);
}

function hideReflection(saveText) {
  const input = $('reflection-input').value.trim();
  $('reflection-overlay').classList.remove('active');
  if (saveText && input) {
    App.reflections.push({
      text: input,
      activity: App.records[App.records.length - 1].activity,
      duration: App.records[App.records.length - 1].duration,
      time: App.records[App.records.length - 1].startTime
    });
    save();
    toast('收获已记录');
  } else {
    toast('专注完成！');
  }
}

$('focus-button').addEventListener('click', () => {
  if (!App.startTime) {
    if (!App.selectedActivity) { toast('请先选择一项活动'); return; }
    App.startTime = Date.now();
    App.currentActivity = App.selectedActivity;
    $('focus-button').classList.add('recording');
    $('btn-icon').textContent = '\u23F9';
    $('btn-label').textContent = '停止专注';
    $('timer-display').style.display = 'block';
    $('timer-activity').style.display = 'block';
    $('timer-activity').textContent = App.currentActivity;
    $('focus-title').textContent = '保持专注，享受心流';
    $('focus-greeting').textContent = '深呼吸，全情投入';
    $('activity-pills').style.pointerEvents = 'none';
    $('activity-pills').style.opacity = '0.4';
    $('timer-hint').textContent = '3秒后进入沉浸模式...';
    particleSpeed = 1.2;
    playSound('start');
    App.timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
    // Enter immersive after 3 seconds
    setTimeout(() => {
      if (App.startTime) enterImmersive();
    }, 3000);
  } else {
    stopFocus();
  }
});

$('immersive-stop').addEventListener('click', () => { if (App.startTime) stopFocus(); });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (App.immersiveActive) {
      // In immersive: tap to exit first (show button), then again to stop
      // Actually Space in immersive -> stop
      if (App.startTime) stopFocus();
    } else {
      $('focus-button').click();
    }
  }
  if (e.code === 'Escape' && App.immersiveActive) {
    if (App.startTime) stopFocus();
  }
  if (e.key >= '1' && e.key <= '9' && !App.startTime) {
    const idx = parseInt(e.key) - 1;
    const pills = document.querySelectorAll('.activity-pill');
    if (pills[idx]) pills[idx].click();
  }
});

// Reflection buttons
$('reflection-save').addEventListener('click', () => hideReflection(true));
$('reflection-skip').addEventListener('click', () => hideReflection(false));
$('reflection-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    hideReflection(true);
  }
});

// Page visibility
document.addEventListener('visibilitychange', () => { if (App.startTime) updateTimer(); });

// Before unload
window.addEventListener('beforeunload', () => {
  if (App.startTime) {
    sessionStorage.setItem('sj_running', JSON.stringify({ running: true, startTime: App.startTime, activity: App.currentActivity }));
  } else {
    sessionStorage.removeItem('sj_running');
  }
});

function recoverTimer() {
  const saved = sessionStorage.getItem('sj_running');
  if (!saved) return;
  try {
    const s = JSON.parse(saved);
    if (s.running && s.startTime && s.activity) {
      App.startTime = s.startTime;
      App.currentActivity = s.activity;
      App.selectedActivity = s.activity;
      $('focus-button').classList.add('recording');
      $('btn-icon').textContent = '\u23F9';
      $('btn-label').textContent = '停止专注';
      $('timer-display').style.display = 'block';
      $('timer-activity').style.display = 'block';
      $('timer-activity').textContent = App.currentActivity;
      $('focus-title').textContent = '保持专注，享受心流';
      $('focus-greeting').textContent = '深呼吸，全情投入（已恢复）';
      $('activity-pills').style.pointerEvents = 'none';
      $('activity-pills').style.opacity = '0.4';
      $('timer-hint').textContent = '按空格键停止';
      particleSpeed = 1.2;
      App.timerInterval = setInterval(updateTimer, 1000);
      updateTimer();
      renderPills();
      // Don't auto-enter immersive on recovery, let user settle
    }
  } catch(e) { sessionStorage.removeItem('sj_running'); }
}

// ===== DASHBOARD =====
function renderDashboard() {
  const dc = $('dashboard-content');
  if (App.records.length === 0) {
    dc.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128202;</div><div class="empty-text">暂无数据</div><div class="empty-subtext">开始专注后，这里将展示你的数据统计</div></div>';
    return;
  }
  const total = App.records.reduce((s,r) => s+r.duration, 0);
  const sessions = App.records.length;
  const avg = total / sessions;
  const today = new Date(); today.setHours(0,0,0,0);
  const todayMs = App.records.filter(r => new Date(r.startTime) >= today).reduce((s,r) => s+r.duration, 0);

  const actStats = {};
  App.records.forEach(r => {
    if (!actStats[r.activity]) actStats[r.activity] = { dur: 0, count: 0 };
    actStats[r.activity].dur += r.duration;
    actStats[r.activity].count++;
  });

  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const nd = new Date(d); nd.setDate(nd.getDate()+1);
    const mins = Math.round(App.records.filter(r => new Date(r.startTime) >= d && new Date(r.startTime) < nd).reduce((s,r) => s+r.duration, 0) / 60000);
    last7.push({ label: i === 0 ? '今天' : `${d.getMonth()+1}/${d.getDate()}`, mins });
  }

  dc.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${fmtShort(total)}</div><div class="stat-label">总专注时间</div></div>
      <div class="stat-card"><div class="stat-value">${sessions}</div><div class="stat-label">专注次数</div></div>
      <div class="stat-card"><div class="stat-value">${fmtShort(avg)}</div><div class="stat-label">平均时长</div></div>
      <div class="stat-card"><div class="stat-value">${fmtShort(todayMs)}</div><div class="stat-label">今日专注</div></div>
    </div>
    <div class="chart-card"><div class="chart-title">近7天专注趋势（分钟）</div><canvas id="trend-chart"></canvas></div>
    <div class="chart-card"><div class="chart-title">活动时间分布</div><canvas id="act-chart"></canvas></div>
    ${App.reflections.length > 0 ? `
    <div class="chart-card">
      <div class="chart-title">&#9997;&#65039; 专注日志</div>
      ${App.reflections.slice().reverse().slice(0,5).map(r => `
        <div style="padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;">
          <div style="font-size:12px;color:var(--accent);white-space:nowrap;margin-top:2px;">${fmtDate(r.time)}</div>
          <div><div style="font-size:13px;line-height:1.6;">${r.text}</div><div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">${r.activity} · ${fmtShort(r.duration)}</div></div>
        </div>
      `).join('')}
    </div>` : ''}
    <div class="history-card">${App.records.slice().reverse().slice(0,10).map(r => `
      <div class="history-item"><div><div class="history-activity">${r.activity}</div><div class="history-time">${fmtDate(r.startTime)}</div></div><div class="history-duration">${fmtShort(r.duration)}</div></div>
    `).join('')}</div>
  `;

  requestAnimationFrame(() => {
    const tc = $('trend-chart');
    if (tc) new Chart(tc, {
      type: 'line',
      data: { labels: last7.map(d => d.label), datasets: [{
        label: '专注分钟', data: last7.map(d => d.mins),
        borderColor: '#00d4ff', backgroundColor: 'rgba(0,212,255,0.08)',
        borderWidth: 3, tension: 0.4, fill: true, pointRadius: 4, pointBackgroundColor: '#00d4ff'
      }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: {
        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8892b0' } },
        x: { grid: { display: false }, ticks: { color: '#8892b0' } }
      } }
    });
    const ac = $('act-chart');
    if (ac) {
      const labs = Object.keys(actStats);
      const dat = labs.map(l => Math.round(actStats[l].dur / 60000));
      const cols = ['#00d4ff','#00e5a0','#ffd700','#ff6b9d','#a78bfa','#f472b6'];
      new Chart(ac, {
        type: 'doughnut',
        data: { labels: labs, datasets: [{ data: dat, backgroundColor: cols.slice(0,labs.length), borderWidth: 0 }] },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#e8eaf6', padding: 16, usePointStyle: true } } }, cutout: '65%' }
      });
    }
  });
}

// ===== AI COACH =====
function renderCoach() {
  const cc = $('coach-content');
  if (App.records.length < 3) {
    cc.innerHTML = '<div class="empty-state"><div class="empty-icon">&#129302;</div><div class="empty-text">数据不足</div><div class="empty-subtext">至少专注3次后，AI教练将为你生成专属计划</div></div>';
    return;
  }
  const actStats = {};
  App.records.forEach(r => {
    if (!actStats[r.activity]) actStats[r.activity] = { dur: 0, count: 0 };
    actStats[r.activity].dur += r.duration;
    actStats[r.activity].count++;
  });
  const sorted = Object.entries(actStats).sort((a,b) => b[1].dur - a[1].dur);
  const total = App.records.reduce((s,r) => s+r.duration, 0);
  const avgMin = (total / App.records.length) / 60000;

  const hourStats = {};
  App.records.forEach(r => { const h = new Date(r.startTime).getHours(); hourStats[h] = (hourStats[h] || 0) + r.duration; });
  const bestHour = Object.entries(hourStats).sort((a,b) => b[1] - a[1])[0];

  const daily = {};
  App.records.forEach(r => { daily[new Date(r.startTime).toDateString()] = (daily[new Date(r.startTime).toDateString()] || 0) + 1; });
  const activeDays = Object.keys(daily).length;
  const first = Math.min(...App.records.map(r => r.startTime));
  const last = Math.max(...App.records.map(r => r.startTime));
  const totalDays = Math.max(1, Math.ceil((last - first) / 86400000) + 1);
  const consistency = Math.round((activeDays / totalDays) * 100);

  const todayStr = new Date().toDateString();
  if (!App.goals[todayStr]) App.goals[todayStr] = { target: 120, actual: 0 };
  const goal = App.goals[todayStr];
  const goalPct = Math.min(100, Math.round((goal.actual / goal.target) * 100));

  let durMsg = avgMin >= 45 ? '你的平均专注时长较长，深度专注能力出色。' : avgMin >= 25 ? '你的平均专注时长适中，节奏把握很好。' : '你的单次专注偏短，建议尝试延长，减少中断。';
  let consMsg = consistency >= 70 ? '连续性强！你保持着非常好的使用习惯。' : consistency >= 40 ? '使用频率不错，可以尝试固定时段培养习惯。' : '使用频率较低，建议设置每日提醒，哪怕只专注5分钟。';

  const suggestions = [];
  if (sorted.length === 1) suggestions.push('活动类型较单一，建议添加更多类别平衡生活。');
  if (avgMin < 25) suggestions.push('尝试番茄工作法：专注25分钟，休息5分钟，逐步提升。');
  if (consistency < 50) suggestions.push('选定一个固定时段（如早晨9点），每天同一时间开始专注。');
  const workActs = ['深度工作','写作创作','阅读学习'], restActs = ['冥想休息','运动健身'];
  if (sorted.some(([n]) => workActs.includes(n)) && !sorted.some(([n]) => restActs.includes(n)))
    suggestions.push('工作学习较多，别忘了安排冥想和运动，劳逸结合更持久。');
  if (suggestions.length === 0) suggestions.push('你的专注习惯很棒！尝试挑战更长时段，或探索新活动类型。');

  const weekTotal = App.records.filter(r => (Date.now() - new Date(r.startTime)) < 7 * 86400000).reduce((s,r) => s + r.duration, 0);

  cc.innerHTML = `
    <div class="coach-card">
      <div class="coach-card-title">&#127919; 今日专注目标</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:14px;color:var(--text-secondary);">已完成 ${goal.actual} / ${goal.target} 分钟</span>
        <span style="font-size:20px;font-weight:800;color:var(--accent);">${goalPct}%</span>
      </div>
      <div class="coach-progress"><div class="coach-progress-bar" style="width:${goalPct}%"></div></div>
      <p style="font-size:13px;color:var(--text-secondary);margin-top:12px;">
        ${goalPct >= 100 ? '&#127881; 今日目标已达成！' : goalPct >= 50 ? '&#128170; 已过半，再加把劲！' : '&#128640; 新的一天，从一次专注开始。'}
      </p>
    </div>
    <div class="coach-card">
      <div class="coach-card-title">&#128161; AI 智能洞察</div>
      <div class="coach-insight">
        <div class="coach-insight-icon good">&#9200;</div>
        <div><div class="coach-insight-label">黄金时段</div><div class="coach-insight-text">你在 <strong>${bestHour[0]}:00-${bestHour[0]}:59</strong> 效率最高，建议将重要任务安排在此时间段。</div></div>
      </div>
      <div class="coach-insight">
        <div class="coach-insight-icon info">&#128200;</div>
        <div><div class="coach-insight-label">专注质量</div><div class="coach-insight-text">${durMsg} 平均每次 <strong>${Math.round(avgMin)} 分钟</strong>。</div></div>
      </div>
      <div class="coach-insight">
        <div class="coach-insight-icon tip">&#127942;</div>
        <div><div class="coach-insight-label">习惯强度</div><div class="coach-insight-text">${consMsg} 活跃天数占比 <strong>${consistency}%</strong>。</div></div>
      </div>
    </div>
    <div class="coach-card">
      <div class="coach-card-title">&#128221; 本周专注报告</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;">
        <div style="text-align:center;padding:16px;background:var(--glass);border-radius:14px;">
          <div style="font-size:24px;font-weight:800;color:var(--accent);">${fmtShort(weekTotal)}</div>
          <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">本周专注</div>
        </div>
        <div style="text-align:center;padding:16px;background:var(--glass);border-radius:14px;">
          <div style="font-size:24px;font-weight:800;color:var(--accent-warm);">${sorted[0][0]}</div>
          <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">最投入</div>
        </div>
        <div style="text-align:center;padding:16px;background:var(--glass);border-radius:14px;">
          <div style="font-size:24px;font-weight:800;color:var(--success);">${App.streak.count}</div>
          <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">连续打卡</div>
        </div>
      </div>
    </div>
    <div class="coach-card">
      <div class="coach-card-title">&#128640; AI 改进计划</div>
      <div style="font-size:14px;line-height:1.8;color:var(--text-secondary);">
        ${suggestions.map((s,i) => `<p style="margin-bottom:10px;padding-left:20px;position:relative;"><span style="position:absolute;left:0;color:var(--accent);font-weight:700;">${i+1}.</span>${s}</p>`).join('')}
      </div>
    </div>
  `;
}

// ===== SETTINGS =====
function renderSettings() {
  const list = $('settings-activity-list');
  list.innerHTML = '';
  App.activities.forEach((a, i) => {
    const row = document.createElement('div');
    row.className = 'activity-row';
    row.innerHTML = `<input type="text" class="activity-input" value="${a}" data-idx="${i}"><button class="activity-delete" data-idx="${i}">&#215;</button>`;
    list.appendChild(row);
  });
  document.querySelectorAll('.activity-input').forEach(inp => {
    inp.addEventListener('change', e => { App.activities[parseInt(e.target.dataset.idx)] = e.target.value.trim(); save(); renderPills(); toast('活动已更新'); });
  });
  document.querySelectorAll('.activity-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx);
      if (App.activities.length <= 1) { toast('至少保留一项'); return; }
      App.activities.splice(idx, 1); save(); renderSettings(); renderPills(); toast('已删除');
    });
  });
}

$('add-activity').addEventListener('click', () => { App.activities.push('新活动'); save(); renderSettings(); });

$('export-data').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ version: 2, exportTime: Date.now(), activities: App.activities, records: App.records, goals: App.goals, reflections: App.reflections, streak: App.streak }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `时记备份_${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url); toast('数据已导出');
});

$('import-data-btn').addEventListener('click', () => $('import-file').click());
$('import-file').addEventListener('change', e => {
  if (!e.target.files[0]) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.activities) App.activities = d.activities;
      if (d.records) App.records = d.records;
      if (d.goals) App.goals = d.goals;
      if (d.reflections) App.reflections = d.reflections;
      if (d.streak) App.streak = d.streak;
      save(); renderPills(); renderStreak(); toast('数据导入成功');
    } catch(err) { toast('导入失败：格式错误'); }
  };
  r.readAsText(e.target.files[0]);
  e.target.value = '';
});

$('clear-data').addEventListener('click', () => {
  if (confirm('确定清除所有数据？不可撤销。')) {
    App.records = []; App.goals = {}; App.reflections = []; App.streak = { count: 0, lastDate: null };
    save(); renderStreak(); toast('数据已清除');
  }
});

// ===== INIT =====
renderPills();
renderStreak();
recoverTimer();
setTimeout(() => $('loading-screen').classList.add('hidden'), 1500);
</script>
</body>
</html>
