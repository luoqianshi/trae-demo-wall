    <nav>
      <div class="logo">👶 育儿帮</div>
      <ul class="nav-links">

      <div class="mobile-menu-btn">☰</div>
    </nav>
  </header>

  <main>
    <section class="section">
      <h2 class="section-title">🧸 玩具推荐</h2>
      <p style="text-align: center; color: #666; margin-bottom: 2rem;">选对玩具，激发宝宝潜能</p>
      
      <div class="toy-list" id="toys-container"></div>
    </section>

    <section class="section" style="background: white; margin-top: -2rem;">
      <h2 class="section-title">💡 选购玩具小贴士</h2>
      
      <div class="cards-container" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
        <div class="card">
          <div class="card-icon">🔒</div>
          <h3 class="card-title">安全第一</h3>
          <p class="card-description">选择无毒材质、无细小零件的玩具，避免宝宝误吞或受伤。</p>
        </div>
        <div class="card">
          <div class="card-icon">👶</div>
          <h3 class="card-title">适龄玩具</h3>
          <p class="card-description">根据宝宝月龄选择适合的玩具，过难或过简单都会影响兴趣。</p>
        </div>
        <div class="card">
          <div class="card-icon">🎯</div>
          <h3 class="card-title">寓教于乐</h3>
          <p class="card-description">选择能锻炼宝宝感官、运动、认知能力的玩具，在玩耍中学习。</p>
        </div>
        <div class="card">
          <div class="card-icon">👨‍👩‍👧</div>
          <h3 class="card-title">亲子互动</h3>
          <p class="card-description">陪伴宝宝一起玩玩具，不仅增进感情，还能引导宝宝正确玩耍。</p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
