// ===== RENDER CAR GRID =====
function renderCars(cars) {
  var grid = document.getElementById('carGrid');
  var countEl = document.getElementById('resultsCount');
  if (cars.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="icon">&#x1F50D;</div><p>没有找到匹配的车型，换个关键词试试</p></div>';
    countEl.textContent = '0 款车型';
    return;
  }
  countEl.textContent = cars.length + ' 款车型';
  var html = '';
  cars.forEach(function(car) {
    var sel = selectedCars.some(function(c){return c.id===car.id});
    html += '<div class="car-card'+(sel?' selected':'')+'" data-id="'+car.id+'">';
    html += '<div class="check">'+(sel?'&#x2713;':'')+'</div>';
    html += '<h4>'+car.name+'</h4>';
    html += '<div class="brand">'+car.brand+' · '+car.type+'</div>';
    html += '<div class="meta">';
    html += '<span>&#x1F4B0; '+car.price+' 万</span>';
    html += '<span style="font-size:0.72rem;color:var(--muted)">二手 ~'+car.usedPrice+'万</span>';
    if(car.range>0) html += '<span>&#x1F50B; '+car.range+' km</span>';
    if(car.fuel!=='纯电'&&car.fuel!=='燃油') html += '<span>&#x26FD; '+car.fuel+'</span>';
    html += '</div></div>';
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.car-card').forEach(function(card){
    card.addEventListener('click', function(){ toggleCar(parseInt(this.dataset.id)); });
  });
}

// ===== TOGGLE CAR SELECTION =====
function toggleCar(id) {
  var idx = -1;
  selectedCars.forEach(function(c,i){if(c.id===id) idx=i;});
  if(idx>=0) {
    selectedCars.splice(idx,1);
  } else {
    if(selectedCars.length>=5) { showToast('最多同时对比 5 款车型'); return; }
    var car = carDB.find(function(c){return c.id===id;});
    if(car) selectedCars.push(car);
  }
  updateSelection();
}

function updateSelection() {
  var grid = document.getElementById('carGrid');
  grid.querySelectorAll('.car-card').forEach(function(card){
    var id = parseInt(card.dataset.id);
    var sel = selectedCars.some(function(c){return c.id===id});
    card.classList.toggle('selected',sel);
    card.querySelector('.check').innerHTML = sel?'&#x2713;':'';
  });
  var bar = document.getElementById('compareBar');
  var chips = document.getElementById('compareChips');
  var empty = document.getElementById('emptyState');
  if(selectedCars.length>0) {
    bar.style.display='flex';
    empty.style.display='none';
    var html='';
    selectedCars.forEach(function(car,i){
      html+='<div class="chip"><div class="dot" style="background:'+COLORS[i]+'"></div>'+car.name+'<span class="remove" data-id="'+car.id+'">&#x2715;</span></div>';
    });
    chips.innerHTML=html;
    chips.querySelectorAll('.remove').forEach(function(el){
      el.addEventListener('click',function(e){e.stopPropagation();toggleCar(parseInt(this.dataset.id));});
    });
  } else {
    bar.style.display='none';
    empty.style.display='block';
  }
}

// ===== SEARCH =====
function search(query) {
  var q = query.toLowerCase().trim();
  if(!q) { renderCars(carDB); document.getElementById('resultsTitle').textContent='全部车型'; return; }
  var results = carDB.filter(function(car){
    var text = (car.name+car.brand+car.type+car.fuel+car.level+car.tags.join(' ')).toLowerCase();
    // keyword match
    var words = q.replace(/[,，]/g,' ').split(/\s+/);
    for(var i=0;i<words.length;i++){
      if(words[i] && text.indexOf(words[i])>=0) return true;
    }
    // price filter
    var priceMatch = q.match(/(\d+)万/);
    if(priceMatch){
      var budget = parseInt(priceMatch[1]);
      if(q.indexOf('以内')>=0||q.indexOf('以下')>=0){ return car.price<=budget; }
      if(q.indexOf('以上')>=0){ return car.price>=budget; }
    }
    return false;
  });
  var title = q.indexOf('以内')>=0?q.replace(/以内/,'以下')+'车型':q+' 相关';
  document.getElementById('resultsTitle').textContent = title;
  renderCars(results);
}

// ===== GENERATE REPORT =====
function generateReport() {
  if(selectedCars.length<2) { showToast('请至少选择 2 款车型进行对比'); return; }
  var result = document.getElementById('compareResult');
  result.style.display='block';
  result.scrollIntoView({behavior:'smooth',block:'start'});
  renderTable();
  renderRadar();
  renderBar();
  renderScore();
  renderRecommend();
}

// ===== RECOMMENDATION =====
function renderRecommend() {
  var cars = selectedCars.slice();
  var container = document.getElementById('recommendContent');
  var html = '';

  // Dimension weights for different user types
  var angles = [
    {name:'家用实用派',desc:'注重空间、安全和日常经济性，适合家庭出行',
     weights:{price:0.2,range:0.1,power:0.05,space:0.3,safe:0.25,adas:0.1},
     tags:['大空间','高安全性','经济实惠']},
    {name:'性能操控派',desc:'追求动力强劲、加速快感，享受驾驶乐趣',
     weights:{price:0.1,range:0.1,power:0.3,space:0.05,safe:0.1,adas:0.05},
     tags:['强动力','操控感','运动']},
    {name:'科技智能派',desc:'看重智能驾驶、辅助系统和前沿科技配置',
     weights:{price:0.1,range:0.1,power:0.1,space:0.1,safe:0.1,adas:0.5},
     tags:['智能驾驶','高阶辅助','科技感']},
    {name:'经济省钱派',desc:'预算敏感，追求最低用车成本和最长续航',
     weights:{price:0.3,range:0.2,power:0.05,space:0.1,safe:0.1,adas:0.05,usedSave:0.2},
     tags:['低油耗','长续航','性价比']},
    {name:'二手捡漏派',desc:'追求以最低价格买到心仪车型，看重保值率和二手差价',
     weights:{price:0.05,range:0.1,power:0.1,space:0.1,safe:0.1,adas:0.1,usedSave:0.45},
     tags:['二手低价','高保值','差价大']}
  ];

  angles.forEach(function(angle) {
    var best = null, bestScore = -1;
    cars.forEach(function(car) {
      var pScore = Math.max(0,100 - car.price*2.5);
      var rScore = Math.min(100, car.range/7*100);
      var pwScore = Math.min(100, car.motorKw/3.6);
      var sScore = Math.min(100, (car.wheelbase-2000)/10);
      var sfScore = Math.min(100, car.airbags*15);
      var aScore = car.adas==='标配(高阶)'?95:car.adas==='标配'?80:car.adas==='选装'?60:30;
      var uScore = Math.min(100, (car.price - car.usedPrice)/car.price * 200); // 二手省钱比例
      var total = pScore*angle.weights.price + rScore*angle.weights.range + pwScore*angle.weights.power + sScore*angle.weights.space + sfScore*angle.weights.safe + aScore*angle.weights.adas + (uScore*(angle.weights.usedSave||0));
      if(total > bestScore) { bestScore = total; best = car; }
    });

    html += '<div class="recommend-card'+(angle.name==='家用实用派'?' winner':'')+'">';
    html += '<h4>'+angle.name;
    if(best.score === Math.max.apply(null,cars.map(function(c){return c.score}))) {
      html += ' <span class="badge">综合最优</span>';
    }
    html += '</h4>';
    html += '<p><strong>推荐：'+best.name+'</strong> — '+angle.desc+'。';
    html += best.name+'在';
    var reasons = [];
    if(angle.weights.space>=0.25) reasons.push('轴距'+best.wheelbase+'mm、后备箱'+best.trunk+'L的大空间');
    if(angle.weights.price>=0.3) reasons.push('仅'+best.price+'万的亲民价格');
    if(angle.weights.power>=0.25) reasons.push(best.motorKw+'kW功率、扭矩'+best.motorNm+'Nm的强劲动力');
    if(angle.weights.adas>=0.3) reasons.push(best.adas==='标配(高阶)'?'高阶智能驾驶辅助系统':'智能驾驶辅助');
    if(angle.weights.range>=0.25) reasons.push(best.range+'km的长续航能力');
    if(angle.weights.safe>=0.2) reasons.push(best.airbags+'个安全气囊的安全保障');
    if(angle.weights.usedSave>=0.3) reasons.push('二手仅'+best.usedPrice+'万，比新车省'+(best.price-best.usedPrice).toFixed(1)+'万');
    html += reasons.join('，')+'方面表现突出，得分 '+Math.round(bestScore)+' 分。</p>';
    html += '<div class="tags">';
    angle.tags.forEach(function(t){html+='<span>'+t+'</span>';});
    html+='</div></div>';
  });

  container.innerHTML = html;
}

// ===== RENDER TABLE =====
function renderTable() {
  var dims = [
    {key:'price',label:'指导价（万元）',lower:true,unit:'万',dec:2},
    {key:'usedPrice',label:'二手均价（万元）',lower:true,unit:'万',dec:1},
    {key:'range',label:'纯电续航（km）',lower:false,unit:'km'},
    {key:'motorKw',label:'电机功率（kW）',lower:false,unit:'kW'},
    {key:'motorNm',label:'电机扭矩（Nm）',lower:false,unit:'Nm'},
    {key:'wheelbase',label:'轴距（mm）',lower:false,unit:'mm'},
    {key:'trunk',label:'后备箱容积（L）',lower:false,unit:'L'},
    {key:'airbags',label:'安全气囊（个）',lower:false,unit:'个'},
  ];
  var html='<thead><tr><th>对比维度</th>';
  selectedCars.forEach(function(car,i){
    html+='<th class="car-header" style="color:'+COLORS[i]+'"><div class="car-name">'+car.name+'</div><div class="car-sub">'+car.brand+' · '+car.type+'</div></th>';
  });
  html+='</tr></thead><tbody>';
  dims.forEach(function(dim){
    html+='<tr class="dim-row"><td>'+dim.label+'</td>';
    var vals = selectedCars.map(function(c){return c[dim.key]||0;});
    var best = dim.lower ? Math.min.apply(null,vals) : Math.max.apply(null,vals);
    selectedCars.forEach(function(car){
      var v = car[dim.key]||0;
      var display = v>0 ? (dim.dec?v.toFixed(dim.dec):v)+' '+dim.unit : (car.fuel==='燃油'?'--':car.speed||'--');
      var isBest = v===best && v>0;
      html+='<td'+(isBest?' class="best"':'')+'>'+(dim.dec&&v>0?v.toFixed(dim.dec):v>0?v:'--')+(v>0?' '+dim.unit:'')+'</td>';
    });
    html+='</tr>';
  });
  // ADAS row
  html+='<tr class="dim-row"><td>智能驾驶辅助</td>';
  selectedCars.forEach(function(car){html+='<td>'+(car.adas||'无')+'</td>';});
  html+='</tr>';
  // Score row
  html+='<tr class="dim-row" style="border-top:2px solid var(--rule)"><td style="font-weight:900;color:var(--ink)">综合评分</td>';
  selectedCars.forEach(function(car,i){
    var isMax = car.score===Math.max.apply(null,selectedCars.map(function(c){return c.score;}));
    html+='<td style="font-weight:900;font-size:1.05rem;'+(isMax?'color:var(--ink);background:rgba(0,0,0,0.06)':'')+'">&#x2B50; '+car.score+' 分</td>';
  });
  html+='</tr></tbody>';
  document.getElementById('compareTable').innerHTML=html;
}

function renderRadar() {
  var indicators = [
    {name:'价格优势',max:100},{name:'续航能力',max:100},{name:'动力性能',max:100},
    {name:'空间舒适',max:100},{name:'安全配置',max:100},{name:'智能驾驶',max:100}
  ];
  var data = selectedCars.map(function(car,i){
    var priceScore = Math.max(0,100 - car.price*2.5);
    var rangeScore = Math.min(100, car.range/7*100);
    var powerScore = Math.min(100, car.motorKw/3.6);
    var spaceScore = Math.min(100, (car.wheelbase-2000)/10);
    var safeScore = Math.min(100, car.airbags*15);
    var adasScore = car.adas==='标配(高阶)'?95:car.adas==='标配'?80:car.adas==='选装'?60:30;
    return {
      value:[Math.round(priceScore),Math.round(rangeScore),Math.round(powerScore),Math.round(spaceScore),Math.round(safeScore),Math.round(adasScore)],
      name:car.name,
      lineStyle:{color:COLORS[i],width:2},
      areaStyle:{color:COLORS[i]+'33'},
      itemStyle:{color:COLORS[i]}
    };
  });
  radarChart.setOption({
    animation:true,animationDuration:800,
    tooltip:{appendToBody:true},
    legend:{bottom:0,textStyle:{color:'#6b7394',fontSize:11},itemWidth:12,itemHeight:8},
    radar:{
      indicator:indicators,center:['50%','45%'],radius:'62%',
      axisName:{color:'#6b7394',fontSize:10},
      splitArea:{areaStyle:{color:['transparent','rgba(37,99,235,0.03)']}},
      axisLine:{lineStyle:{color:'rgba(0,0,0,0.08)'}},
      splitLine:{lineStyle:{color:'rgba(0,0,0,0.06)'}}

function renderBar() {
  var categories = ['价格(万)','续航(km)','功率(kW)','扭矩(Nm)','轴距(mm)','后备箱(L)'];
  var series = selectedCars.map(function(car,i){
    return {
      name:car.name,type:'bar',barWidth:'18%',
      itemStyle:{color:COLORS[i],borderRadius:[3,3,0,0]},
      data:[car.price,car.range,car.motorKw,car.motorNm,car.wheelbase,car.trunk]
    };
  });
  barChart.setOption({
    animation:true,animationDuration:800,
    tooltip:{appendToBody:true,trigger:'axis',axisPointer:{type:'shadow'}},
    legend:{bottom:0,textStyle:{color:'#6b7394',fontSize:11},itemWidth:12,itemHeight:8},
    grid:{left:'3%',right:'4%',bottom:'14%',top:'6%',containLabel:true},
    xAxis:{type:'category',data:categories,axisLabel:{color:'#6b7394',fontSize:10},axisLine:{lineStyle:{color:'rgba(0,0,0,0.08)'}}},
    yAxis:{type:'value',axisLabel:{color:'#6b7394',fontSize:10},splitLine:{lineStyle:{color:'rgba(0,0,0,0.06)',type:'dashed'}}},
    series:series
  });
}

function renderScore() {
  var names = selectedCars.map(function(c){return c.name;});
  var scores = selectedCars.map(function(c){return c.score;});
  var colors = selectedCars.map(function(_,i){return COLORS[i];});
  var maxIdx = scores.indexOf(Math.max.apply(null,scores));
  var itemColors = scores.map(function(s,i){
    return i===maxIdx?{type:'linear',x:0,y:0,x2:1,y2:0,colorStops:[{offset:0,color:'#1a1d2e'},{offset:1,color:'#4a4a6a'}]}:colors[i]+'88';
  });
  scoreChart.setOption({
    animation:true,animationDuration:1000,
    tooltip:{appendToBody:true,trigger:'axis',axisPointer:{type:'shadow'}},
    grid:{left:'3%',right:'8%',bottom:'6%',top:'6%',containLabel:true},
    xAxis:{type:'category',data:names,axisLabel:{color:'#6b7394',fontSize:11,rotate:names.length>3?15:0},axisLine:{lineStyle:{color:'rgba(0,0,0,0.08)'}}},
    yAxis:{type:'value',min:50,max:100,axisLabel:{color:'#6b7394',fontSize:10,formatter:'{value}分'},splitLine:{lineStyle:{color:'rgba(0,0,0,0.06)',type:'dashed'}}},
    series:[{
      type:'bar',barWidth:'40%',label:{show:true,position:'top',color:'#1a1d2e',fontSize:13,fontWeight:700,formatter:'{c}分'},
      data:scores.map(function(s,i){return {value:s,itemStyle:{color:itemColors[i]}};})
    }]
  });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

// ===== BIND EVENTS =====
function bindEvents() {
  document.getElementById('searchBtn').addEventListener('click',function(){
    search(document.getElementById('searchInput').value);
  });
  document.getElementById('searchInput').addEventListener('keydown',function(e){
    if(e.key==='Enter') search(this.value);
  });
  document.getElementById('clearBtn').addEventListener('click',function(){
    document.getElementById('searchInput').value='';
    selectedCars=[];
    updateSelection();
    search('');
    document.getElementById('compareResult').style.display='none';
    document.getElementById('emptyState').style.display='block';
  });
  document.getElementById('compareBtn').addEventListener('click',generateReport);
  document.getElementById('quickTags').addEventListener('click',function(e){
    if(e.target.classList.contains('quick-tag')){
      document.querySelectorAll('.quick-tag').forEach(function(t){t.classList.remove('active');});
      e.target.classList.add('active');
      var q = e.target.dataset.q;
      document.getElementById('searchInput').value=q;
      search(q);
    }
  });
}

// ===== PARALLAX CAR =====
(function(){
  var wrapper = document.getElementById('parallaxCar');
  var canvas = document.getElementById('parallaxCanvas');
  if(!wrapper || !canvas) return;
  var ctx = canvas.getContext('2d');
  var currentText = '车鉴通';
  var targetText = '车鉴通';
  var displayText = '车鉴通';
  var animAlpha = 0;
  var fadeDir = 1; // 1=fading in, -1=fading out
  var ticking = false;
  var carNameMap = {};
  var dpr = window.devicePixelRatio || 1;
  var scrollAlpha = 0; // alpha driven by scroll (0 = hidden, 1 = full)

  function resize(){
    canvas.width = 700 * dpr;
    canvas.height = 300 * dpr;
    ctx.scale(dpr, dpr);
  }
  resize();
  window.addEventListener('resize', resize);

  // Listen for mouse hover on car cards
  function initCardListeners(){
    document.querySelectorAll('.car-card').forEach(function(card){
      card.addEventListener('mouseenter',function(){
        var id = parseInt(this.dataset.id);
        var car = carDB.find(function(c){return c.id===id;});
        if(car) setCarName(car.name);
      });
    });
  }
  // Re-init after each render
  var observer = new MutationObserver(function(){ initCardListeners(); });
  observer.observe(document.getElementById('carGrid'),{childList:true});
  initCardListeners();

  function setCarName(name){
    if(name === targetText) return;
    if(fadeDir === 1){
      // Currently showing, fade out first then change
      fadeDir = -1;
      currentText = targetText;
      setTimeout(function(){
        targetText = name;
        fadeDir = 1;
        animAlpha = 0;
      },300);
    } else {
      targetText = name;
      fadeDir = 1;
      animAlpha = 0;
    }
  }

  function draw(){
    ctx.clearRect(0,0,700,300);
    var text = targetText;
    var alpha = animAlpha * scrollAlpha * 0.25;
    // Detect if text is Chinese (use larger font) or mixed
    var fontSize = text.length <= 3 ? 120 : text.length <= 6 ? 90 : 60;
    ctx.font = '900 '+fontSize+'px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Draw shadow layers
    ctx.fillStyle = 'rgba(0,0,0,'+alpha*0.6+')';
    ctx.fillText(text, 360, 160);
    // Slight offset for depth
    ctx.fillStyle = 'rgba(0,0,0,'+alpha*0.3+')';
    ctx.fillText(text, 358, 158);
    // Main text
    ctx.fillStyle = 'rgba(26,29,46,'+alpha+')';
    ctx.fillText(text, 355, 155);
  }

  function tick(){
    if(fadeDir === 1){
      animAlpha = Math.min(1, animAlpha + 0.04);
      if(animAlpha >= 1) fadeDir = 0;
    } else if(fadeDir === -1){
      animAlpha = Math.max(0, animAlpha - 0.06);
    }
    draw();
  }

  window.addEventListener('scroll', function(){
    if(!ticking){
      requestAnimationFrame(function(){
        var scrollY = window.pageYOffset || document.documentElement.scrollTop;
        var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        var progress = maxScroll > 0 ? scrollY / maxScroll : 0;
        var xOffset = 50 - progress * 170;
        var yOffset = Math.sin(progress * Math.PI * 3) * 6;
        // Text appears only after scrolling starts, fades in during first 10% of scroll
        if(progress < 0.1) scrollAlpha = progress / 0.1;
        else if(progress > 0.9) scrollAlpha = (1 - progress) / 0.1;
        else scrollAlpha = 1;
        wrapper.style.transform = 'translateY(calc(-50% + ' + yOffset + 'px)) translateX(' + xOffset + '%)';
        ticking = false;
      });
      ticking = true;
    }
  });

  // Animation loop for fade
  function loop(){ tick(); requestAnimationFrame(loop); }
  // Initial fade in of default text
  fadeDir = 1;
  loop();
})();
