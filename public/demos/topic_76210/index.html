<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>人潮同城 - 本地生活地图</title>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; }
        body { background: #000; }
        
        .phone-screen { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 375px; height: 812px; border-radius: 40px; overflow: hidden; background: #F5F5F5; box-shadow: 0 20px 60px rgba(0,0,0,0.6); z-index: 10000; }
        
        .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: #000; border-radius: 3px; z-index: 2000; opacity: 0.3; }
        
        .app-container { width: 375px; height: 812px; position: relative; overflow: hidden; }
        
        .map-view { position: absolute; inset: 0; z-index: 1; }
        #map { width: 100%; height: 100%; }
        
        .top-bar { position: absolute; top: 0; left: 0; right: 0; width: 375px; padding: 44px 16px 8px; z-index: 1000; background: #fff; }
        .search-box { width: 100%; height: 34px; background: #F5F5F5; border-radius: 17px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: 1px solid #E5E5E5; }
        .search-icon { font-size: 13px; color: #999; }
        .search-text { font-size: 13px; color: #666; flex: 1; }
        .search-voice { width: 22px; height: 22px; background: #FF6B35; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
        
        .info-bar { position: absolute; top: 88px; left: 0; right: 0; width: 375px; z-index: 999; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 6px 16px; background: #fff; border-bottom: 1px solid #F0F0F0; white-space: nowrap; }
        .info-bar::-webkit-scrollbar { display: none; }
        .info-chip { flex-shrink: 0; padding: 4px 10px; border-radius: 20px; font-size: 11px; display: flex; align-items: center; gap: 3px; }
        .info-chip.weather { background: linear-gradient(135deg, #667EEA, #764BA2); color: #fff; }
        .info-chip.festival { background: linear-gradient(135deg, #EC4899, #F43F5E); color: #fff; }
        .info-chip.hot { background: linear-gradient(135deg, #FF6B35, #FF8C42); color: #fff; }
        .info-chip.normal { background: #F5F5F5; color: #333; }
        
        .custom-marker { background: transparent; border: none; }
        .shop-marker { position: relative; }
        .shop-card { background: #fff; border-radius: 12px; width: 110px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 1px solid rgba(0,0,0,0.08); overflow: hidden; }
        .shop-card::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 12px; height: 12px; background: #fff; border-right: 1px solid rgba(0,0,0,0.08); border-bottom: 1px solid rgba(0,0,0,0.08); }
        .shop-image { width: 100%; height: 50px; background-size: cover; background-position: center; }
        .shop-info { padding: 6px 8px; }
        .shop-name { font-size: 11px; font-weight: 600; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shop-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; }
        .shop-distance { font-size: 9px; color: #3B82F6; }
        .shop-count { font-size: 9px; color: #FF6B35; font-weight: 600; }
        .shop-tag { font-size: 8px; padding: 1px 5px; background: rgba(255,107,53,0.1); color: #FF6B35; border-radius: 4px; margin-top: 3px; display: inline-block; }
        
        .user-marker { position: relative; }
        .user-card { background: #fff; border-radius: 12px; width: 120px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 1px solid rgba(0,0,0,0.08); overflow: hidden; }
        .user-card::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 12px; height: 12px; background: #fff; border-right: 1px solid rgba(0,0,0,0.08); border-bottom: 1px solid rgba(0,0,0,0.08); }
        .user-image { width: 100%; height: 60px; background-size: cover; background-position: center; }
        .user-info { padding: 6px 8px; }
        .user-header { display: flex; align-items: center; gap: 5px; }
        .user-avatar { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; }
        .user-name { font-size: 10px; font-weight: 600; color: #333; }
        .user-content { font-size: 9px; color: #666; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .user-likes { font-size: 9px; color: #FF6B35; }
        .user-time { font-size: 8px; color: #999; }
        
        .bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; width: 375px; background: #fff; border-radius: 24px 24px 0 0; z-index: 1500; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94); max-height: 80vh; overflow: hidden; }
        .bottom-sheet.show { transform: translateY(0); }
        .bottom-sheet-handle { width: 40px; height: 4px; background: #D1D1D1; border-radius: 2px; margin: 12px auto; }
        .bottom-sheet-content { padding: 0 16px 20px; overflow-y: auto; max-height: calc(80vh - 40px); }
        
        .feed-view { position: absolute; inset: 0; width: 375px; z-index: 2; transform: translate3d(0, 100%, 0); transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); background: #F5F5F5; overflow: hidden; }
        .feed-view.expanded { transform: translate3d(0, 0, 0); }
        
        .feed-header { position: absolute; top: 0; left: 0; right: 0; width: 375px; padding: 118px 12px 12px; background: #F5F5F5; z-index: 200; }
        .feed-title { font-size: 20px; font-weight: 700; color: #333; }
        .time-tabs { display: flex; gap: 4px; background: #E5E5E5; border-radius: 8px; padding: 2px; margin-top: 8px; display: inline-flex; }
        .time-tab { padding: 4px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; }
        .time-tab.active { background: #fff; color: #FF6B35; font-weight: 600; }
        .time-count { font-size: 12px; color: #999; margin-top: 4px; }
        
        .feed-scroll { position: absolute; top: 165px; left: 0; right: 0; bottom: 80px; overflow-y: auto; padding: 0 12px; }
        .waterfall-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        
        .waterfall-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
        .waterfall-image { width: 100%; aspect-ratio: 1; background-size: cover; background-position: center; position: relative; }
        .waterfall-tag { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.5); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .waterfall-content { padding: 8px; }
        .waterfall-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; line-height: 1.4; }
        .waterfall-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .waterfall-user { display: flex; align-items: center; gap: 4px; }
        .waterfall-avatar { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .waterfall-name { font-size: 11px; color: #999; }
        .waterfall-actions { display: flex; gap: 10px; }
        .waterfall-action { display: flex; align-items: center; gap: 2px; font-size: 12px; color: #999; }
        .waterfall-comments { padding-top: 6px; border-top: 1px solid #F5F5F5; }
        .waterfall-comment-item { display: flex; gap: 6px; margin-bottom: 6px; }
        .waterfall-comment-avatar { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; }
        .waterfall-comment-text { font-size: 11px; color: #666; }
        
        .drag-handle { position: absolute; bottom: 0; left: 0; right: 0; width: 375px; height: 50px; z-index: 400; cursor: grab; display: flex; justify-content: center; align-items: flex-start; padding-top: 8px; background: linear-gradient(to top, rgba(245,245,245,0.98), transparent); }
        .drag-handle:active { cursor: grabbing; }
        
        .post-btn { position: absolute; bottom: 80px; right: 16px; width: 52px; height: 52px; background: linear-gradient(135deg, #FF6B35, #FF8C42); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; box-shadow: 0 4px 16px rgba(255,107,53,0.4); z-index: 500; cursor: pointer; }
        
        .toast { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(50px); background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 25px; font-size: 13px; color: #fff; z-index: 3000; transition: transform 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        
        .legend-panel { position: absolute; top: 140px; left: 12px; background: rgba(255,255,255,0.95); padding: 8px 10px; border-radius: 10px; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #666; margin-bottom: 3px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
        
        @media (max-width: 400px) {
            .phone-screen { width: 100%; height: 100%; border-radius: 0; top: 0; left: 0; transform: none; box-shadow: none; }
            .home-indicator { display: none; }
            .app-container { width: 100%; height: 100%; }
            .top-bar, .info-bar, .feed-view, .feed-header, .drag-handle, .bottom-sheet { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="phone-screen">
        <div class="app-container">
            <div class="map-view">
                <div id="map"></div>
                
                <div class="top-bar">
                    <div class="search-box">
                        <span class="search-icon">📍</span>
                        <span class="search-text">搜索附近美食、景点...</span>
                        <div class="search-voice">🎤</div>
                    </div>
                </div>
                
                <div class="info-bar">
                    <div class="info-chip weather">☀️ 晴 26°C</div>
                    <div class="info-chip festival">🎂 周末特惠</div>
                    <div class="info-chip normal">📍 万达广场</div>
                    <div class="info-chip hot">🔥 328人</div>
                    <div class="info-chip normal">🎡 游乐场5折</div>
                    <div class="info-chip normal">🍔 麦当劳半价</div>
                </div>
                
                <div class="legend-panel">
                    <div class="legend-item"><div class="legend-dot" style="background:#10B981;"></div><span>宽松</span></div>
                    <div class="legend-item"><div class="legend-dot" style="background:#FFC857;"></div><span>适中</span></div>
                    <div class="legend-item"><div class="legend-dot" style="background:#FF6B35;"></div><span>拥挤</span></div>
                </div>
            </div>
            
            <div class="feed-view" id="feedView">
                <div class="feed-header">
                    <div class="feed-title">身边热帖</div>
                    <div class="time-tabs">
                        <div class="time-tab active" onclick="switchTimeTab(this, '6h')">6h</div>
                        <div class="time-tab" onclick="switchTimeTab(this, '12h')">12h</div>
                        <div class="time-tab" onclick="switchTimeTab(this, '24h')">24h</div>
                    </div>
                    <div class="time-count" id="timeCount">过去6小时 · 1,284人来过</div>
                </div>
                
                <div class="feed-scroll">
                    <div class="waterfall-grid" id="waterfallGrid"></div>
                </div>
            </div>
            
            <div class="drag-handle" id="dragHandle">
                <div class="bottom-sheet-handle"></div>
            </div>
            
            <div class="post-btn" onclick="openPostModal()">+</div>
            
            <div class="bottom-sheet" id="bottomSheet">
                <div class="bottom-sheet-handle" onclick="closeBottomSheet()"></div>
                <div class="bottom-sheet-content" id="sheetContent"></div>
            </div>
            
            <div class="home-indicator"></div>
            <div class="toast" id="toast"></div>
        </div>
    </div>

    <script>
        const zones = [
            { name: '麦当劳', count: 128, status: 'medium', lat: 39.9042, lng: 116.4064, distance: '180m', tag: '周四半价', image: 'https://images.unsplash.com/photo-1556678695-3ba209267935?w=150&h=80&fit=crop' },
            { name: '星巴克', count: 89, status: 'medium', lat: 39.9042, lng: 116.4084, distance: '400m', tag: '新品上市', image: 'https://images.unsplash.com/photo-1525153537368-098d8047a7b2?w=150&h=80&fit=crop' },
            { name: '海底捞', count: 245, status: 'high', lat: 39.9032, lng: 116.4064, distance: '200m', tag: '排队20分', image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150&h=80&fit=crop' },
            { name: '优衣库', count: 156, status: 'low', lat: 39.9032, lng: 116.4074, distance: '250m', tag: '全场8折', image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=150&h=80&fit=crop' },
            { name: '电影院', count: 312, status: 'medium', lat: 39.9032, lng: 116.4084, distance: '380m', tag: '新片上映', image: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=150&h=80&fit=crop' },
            { name: '游乐场', count: 891, status: 'high', lat: 39.9042, lng: 116.4074, distance: '320m', tag: '暑期5折', image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&h=80&fit=crop' },
            { name: '书店', count: 89, status: 'low', lat: 39.9052, lng: 116.4064, distance: '280m', tag: '安静阅读', image: 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=150&h=80&fit=crop' },
            { name: '电玩城', count: 178, status: 'high', lat: 39.9052, lng: 116.4074, distance: '350m', tag: '周末特惠', image: 'https://images.unsplash.com/photo-1516383987617-843687233d25?w=150&h=80&fit=crop' },
            { name: '美妆店', count: 128, status: 'medium', lat: 39.9052, lng: 116.4084, distance: '420m', tag: '会员8折', image: 'https://images.unsplash.com/photo-1527224857830-43a7acc85264?w=150&h=80&fit=crop' },
            { name: '奶茶店', count: 145, status: 'high', lat: 39.9012, lng: 116.4084, distance: '380m', tag: '第二杯半价', image: 'https://images.unsplash.com/photo-1576941089049-77670f6cc903?w=150&h=80&fit=crop' },
            { name: 'KTV', count: 67, status: 'medium', lat: 39.9022, lng: 116.4074, distance: '220m', tag: '小包特惠', image: 'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=150&h=80&fit=crop' },
            { name: '甜品店', count: 78, status: 'medium', lat: 39.9062, lng: 116.4074, distance: '480m', tag: '新品推荐', image: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=150&h=80&fit=crop' }
        ];

        const userPins = [
            { id: 1, user: '小橙子', avatar: '橙', avatarColor: '#667EEA', lat: 39.9038, lng: 116.4078, likes: 128, content: '发现超美的角落！', time: '5分钟前', image: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=150&h=90&fit=crop' },
            { id: 2, user: '晓晓', avatar: '晓', avatarColor: '#764BA2', lat: 39.9048, lng: 116.4070, likes: 89, content: '拍照太好看了', time: '18分钟前', image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=150&h=90&fit=crop' },
            { id: 3, user: '阿杰', avatar: '杰', avatarColor: '#EC4899', lat: 39.9030, lng: 116.4080, likes: 234, content: '隐藏美食打卡地！', time: '25分钟前', image: 'https://images.unsplash.com/photo-1476610182048-b716b8518aae?w=150&h=90&fit=crop' }
        ];

        const posts = [
            { id: 1, user: '小橙子', avatar: '橙', time: '5分钟前', content: '过山车排队1小时！', location: '游乐场', image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300&h=300&fit=crop', likes: 128, comments: 23, type: 'user', commentList: [
                { user: '小明', text: '刚到门口' },
                { user: '阿花', text: '建议下午4点后' }
            ]},
            { id: 2, user: '麦当劳', avatar: '麦', time: '1小时前', content: '周四全场半价！', location: '麦当劳', image: 'https://images.unsplash.com/photo-1556678695-3ba209267935?w=300&h=300&fit=crop', likes: 234, comments: 18, type: 'shop', commentList: [
                { user: '省钱达人', text: '太划算了' },
                { user: '汉堡控', text: '麦辣鸡腿堡必点' }
            ]},
            { id: 3, user: '阿杰', avatar: '杰', time: '25分钟前', content: '川味火锅味道绝了！', location: '餐饮区', image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&h=300&fit=crop', likes: 156, comments: 34, type: 'user', commentList: [
                { user: '吃货王', text: '人均多少？' },
                { user: '辣味爱好者', text: '番茄锅底绝了' }
            ]},
            { id: 4, user: '优衣库', avatar: '衣', time: '2小时前', content: '夏季新品全场8折', location: '优衣库', image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&h=300&fit=crop', likes: 345, comments: 22, type: 'shop', commentList: [
                { user: '时尚达人', text: '性价比超高' },
                { user: '学生党', text: '基础款必备' }
            ]},
            { id: 5, user: '思思', avatar: '思', time: '48分钟前', content: '书店很安静，舒服！', location: '书店', image: 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=300&h=300&fit=crop', likes: 78, comments: 12, type: 'user', commentList: [
                { user: '爱书人', text: '周末就去' },
                { user: '安静美男子', text: '有咖啡吗？' }
            ]},
            { id: 6, user: '奶茶店', avatar: '茶', time: '3小时前', content: '夏日特饮第二杯半价', location: '奶茶店', image: 'https://images.unsplash.com/photo-1576941089049-77670f6cc903?w=300&h=300&fit=crop', likes: 189, comments: 15, type: 'shop', commentList: [
                { user: '奶茶控', text: '多肉葡萄好喝' },
                { user: '甜品爱好者', text: '买一送一太香了' }
            ]}
        ];

        let map;
        let shopMarkers = [];
        let userMarkerLayer;

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([39.9037, 116.4074], 16);
            L.tileLayer('http://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=7', { subdomains: '1234' }).addTo(map);
            
            userMarkerLayer = L.layerGroup().addTo(map);
            renderShopMarkers();
            renderUserPins();
        }

        function renderShopMarkers() {
            shopMarkers.forEach(m => map.removeLayer(m));
            shopMarkers = [];
            
            zones.forEach(zone => {
                const html = `
                    <div class="shop-card">
                        <div class="shop-image" style="background-image:url('${zone.image}')"></div>
                        <div class="shop-info">
                            <div class="shop-name">${zone.name}</div>
                            <div class="shop-meta">
                                <span class="shop-distance">${zone.distance}</span>
                                <span class="shop-count">${zone.count}人</span>
                            </div>
                            <div class="shop-tag">${zone.tag}</div>
                        </div>
                    </div>
                `;
                
                const icon = L.divIcon({ className: 'custom-marker', html, iconSize: [110, 80], iconAnchor: [55, 80] });
                const marker = L.marker([zone.lat, zone.lng], { icon });
                marker.on('click', () => showBottomSheet(zone));
                map.addLayer(marker);
                shopMarkers.push(marker);
            });
        }

        function renderUserPins() {
            userMarkerLayer.clearLayers();
            
            userPins.forEach(pin => {
                const html = `
                    <div class="user-card">
                        <div class="user-image" style="background-image:url('${pin.image}')"></div>
                        <div class="user-info">
                            <div class="user-header">
                                <div class="user-avatar" style="background:${pin.avatarColor};color:#fff;">${pin.avatar}</div>
                                <div class="user-name">${pin.user}</div>
                            </div>
                            <div class="user-content">${pin.content}</div>
                            <div class="user-footer">
                                <span class="user-likes">❤️ ${pin.likes}</span>
                                <span class="user-time">${pin.time}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                const icon = L.divIcon({ className: 'custom-marker', html, iconSize: [120, 90], iconAnchor: [60, 90] });
                const marker = L.marker([pin.lat, pin.lng], { icon });
                marker.on('click', () => showUserSheet(pin));
                userMarkerLayer.addLayer(marker);
            });
        }

        function showBottomSheet(zone) {
            const content = `
                <div style="width:100%;height:180px;border-radius:16px;background-size:cover;background-position:center;margin-bottom:16px;background-image:url('${zone.image}');"></div>
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
                    <div style="font-size:20px;font-weight:700;color:#333;">${zone.name}</div>
                    <div style="font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(16,185,129,0.1);color:#10B981;">${zone.status === 'high' ? '拥挤' : zone.status === 'medium' ? '适中' : '宽松'}</div>
                </div>
                <div style="display:flex;gap:16px;margin-bottom:12px;font-size:13px;color:#666;">
                    <div>📍 ${zone.distance}</div>
                    <div>👥 ${zone.count}人</div>
                </div>
            `;
            document.getElementById('sheetContent').innerHTML = content;
            document.getElementById('bottomSheet').classList.add('show');
        }

        function showUserSheet(pin) {
            const content = `
                <div style="width:100%;height:180px;border-radius:16px;background-size:cover;background-position:center;margin-bottom:16px;background-image:url('${pin.image}');"></div>
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
                    <div style="font-size:20px;font-weight:700;color:#333;">${pin.content}</div>
                </div>
                <div style="display:flex;gap:16px;margin-bottom:12px;font-size:13px;color:#666;">
                    <div>👤 ${pin.user}</div>
                    <div>❤️ ${pin.likes}点赞</div>
                </div>
            `;
            document.getElementById('sheetContent').innerHTML = content;
            document.getElementById('bottomSheet').classList.add('show');
        }

        function closeBottomSheet() {
            document.getElementById('bottomSheet').classList.remove('show');
        }

        function openPostModal() {
            showToast('请长按地图选择打卡位置');
        }

        function renderWaterfall() {
            const grid = document.getElementById('waterfallGrid');
            grid.innerHTML = posts.map(post => {
                const commentsHtml = post.commentList.map(c => `
                    <div class="waterfall-comment-item">
                        <div class="waterfall-comment-avatar" style="background:#667EEA;color:#fff;">${c.user[0]}</div>
                        <div class="waterfall-comment-text">${c.user}: ${c.text}</div>
                    </div>
                `).join('');
                
                return `
                    <div class="waterfall-card">
                        <div class="waterfall-image" style="background-image:url('${post.image}')">
                            <div class="waterfall-tag">${post.type === 'shop' ? '🏪' : '👤'} ${post.location}</div>
                        </div>
                        <div class="waterfall-content">
                            <div class="waterfall-title">${post.content}</div>
                            <div class="waterfall-meta">
                                <div class="waterfall-user">
                                    <div class="waterfall-avatar" style="background:#FF6B35;color:#fff;">${post.avatar}</div>
                                    <div class="waterfall-name">${post.user}</div>
                                </div>
                                <div style="font-size:10px;color:#999;">${post.time}</div>
                            </div>
                            <div class="waterfall-actions">
                                <div class="waterfall-action">❤️ ${post.likes}</div>
                                <div class="waterfall-action">💬 ${post.comments}</div>
                            </div>
                            <div class="waterfall-comments">${commentsHtml}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchTimeTab(el, period) {
            document.querySelectorAll('.time-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            const counts = { '6h': 1284, '12h': 3567, '24h': 8923 };
            document.getElementById('timeCount').textContent = `过去${period} · ${counts[period].toLocaleString()}人来过`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function initDrag() {
            const handle = document.getElementById('dragHandle');
            const feedView = document.getElementById('feedView');
            let touchStartY = 0;
            let isDragging = false;
            
            const handleMove = (clientY) => {
                if (!isDragging) return;
                const delta = clientY - touchStartY;
                if (delta < -50) feedView.classList.add('expanded');
                else if (delta > 50) feedView.classList.remove('expanded');
            };
            
            const handleEnd = () => { isDragging = false; };
            
            handle.addEventListener('touchstart', (e) => { 
                touchStartY = e.touches[0].clientY; 
                isDragging = true; 
                e.preventDefault(); 
            }, { passive: false });
            
            handle.addEventListener('touchmove', (e) => {
                handleMove(e.touches[0].clientY);
                e.preventDefault();
            }, { passive: false });
            
            handle.addEventListener('touchend', handleEnd);
            
            handle.addEventListener('mousedown', (e) => { 
                touchStartY = e.clientY; 
                isDragging = true; 
            });
            
            window.addEventListener('mousemove', (e) => { handleMove(e.clientY); });
            window.addEventListener('mouseup', handleEnd);
        }

        initMap();
        renderWaterfall();
        initDrag();
    </script>
</body>
</html>
