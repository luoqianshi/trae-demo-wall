<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云空精修 SkyLab</title><style>
:root{--bg0:#0a0a0b;--bg1:#0f0f11;--bg2:#16161a;--bg3:#1d1d22;--bg4:#25252b;--sf:rgba(255,255,255,.03);--sh:rgba(255,255,255,.05);--ss:rgba(255,255,255,.06);--bs:rgba(255,255,255,.06);--b:rgba(255,255,255,.1);--bs2:rgba(255,255,255,.16);--a:#3b82f6;--b2:#06b6d4;--c:#8b5cf6;--ag:linear-gradient(135deg,#3b82f6,#06b6d4 50%,#8b5cf6);--tp:#f8fafc;--ts:#94a3b8;--tt:#64748b;--tm:#475569;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--r1:6px;--r2:10px;--r3:14px;--r4:20px;--rf:9999px;--f:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--pw:360px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--f);background:var(--bg0);color:var(--tp);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:-50%;width:200%;height:200%;background:radial-gradient(ellipse 600px 400px at 18% 22%,rgba(59,130,246,.07),transparent 70%),radial-gradient(ellipse 500px 350px at 82% 78%,rgba(139,92,246,.06),transparent 70%),radial-gradient(ellipse 400px 300px at 60% 30%,rgba(6,182,212,.05),transparent 70%);pointer-events:none;z-index:0;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-30px,20px)}}
.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--sf);backdrop-filter:blur(20px);border-bottom:1px solid var(--bs);flex-shrink:0;position:relative}
header::after{content:'';position:absolute;bottom:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,var(--b),transparent);opacity:.5}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:34px;height:34px;border-radius:var(--r2);background:var(--ag);display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(59,130,246,.35);position:relative;overflow:hidden}
.logo-icon::before{content:'';position:absolute;inset:1px;border-radius:9px;background:var(--bg2)}
.logo-icon svg{width:20px;height:20px;position:relative;z-index:1}
.logo-text{display:flex;flex-direction:column;line-height:1.2}
.logo-text .t{background:var(--ag);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700;font-size:15px}
.logo-text .s{font-size:11px;color:var(--tt);font-weight:500;letter-spacing:.6px}
.hinfo{display:flex;align-items:center;gap:12px;font-size:12px}
.hbadge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ss);border:1px solid var(--bs);border-radius:var(--rf);font-size:11px;font-weight:500;color:var(--ts)}
.hbadge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pul 2s ease-in-out infinite}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.4}}
main{display:flex;flex:1;overflow:hidden;gap:14px;padding:14px}
.pv{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg1);border:1px solid var(--bs);border-radius:var(--r3);position:relative;overflow:hidden;min-width:0}
.pv::before{content:'';position:absolute;inset:0;background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25%),linear-gradient(-45deg,var(--bg2) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--bg2) 75%),linear-gradient(-45deg,transparent 75%,var(--bg2) 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;opacity:.3;pointer-events:none}
.pv.drag-over{border-color:var(--b2);background:rgba(6,182,212,.05)}
.stage{position:relative;display:flex;align-items:center;justify-content:center;max-width:calc(100% - 48px);max-height:calc(100% - 48px);display:none}
.stage.show{display:flex;animation:fi .4s cubic-bezier(.16,1,.3,1)}
@keyframes fi{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
#pc{max-width:100%;max-height:calc(100vh - 160px);box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px var(--bs);border-radius:var(--r2);display:block;position:relative;z-index:1;transition:transform .25s cubic-bezier(.16,1,.3,1),opacity .15s cubic-bezier(.16,1,.3,1)}
#oc{position:absolute;border-radius:var(--r2);display:none;z-index:2;pointer-events:none;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px var(--bs)}
.ch{position:absolute;top:0;bottom:0;width:2px;background:var(--b2);box-shadow:0 0 12px rgba(6,182,212,.6);z-index:5;display:none;cursor:ew-resize;transform:translateX(-50%)}
.ch.show{display:block}
.ch::before{content:'';position:absolute;top:50%;left:50%;width:36px;height:36px;border-radius:50%;background:var(--bg2);border:2px solid var(--b2);transform:translate(-50%,-50%);box-shadow:0 4px 16px rgba(0,0,0,.5)}
.ch::after{content:'⇄';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--b2);font-size:16px;font-weight:700;z-index:1}
.cl{position:absolute;top:12px;z-index:6;padding:3px 10px;background:rgba(10,10,11,.85);backdrop-filter:blur(8px);border:1px solid var(--b);border-radius:var(--rf);font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--ts);display:none}
.cl.show{display:block}
.empty{text-align:center;padding:32px 24px;max-width:400px;position:relative;z-index:1}
.sf{position:absolute;inset:-100px;overflow:hidden;pointer-events:none;opacity:.6}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.ei{width:76px;height:76px;margin:0 auto 18px;border-radius:var(--r4);background:var(--sf);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ei::before{content:'';position:absolute;inset:0;background:var(--ag);opacity:.08}
.ei svg{width:34px;height:34px;color:var(--ts);position:relative;z-index:1}
.empty h3{font-size:16px;font-weight:600;margin-bottom:8px}
.empty p{font-size:12px;line-height:1.7;color:var(--tt);margin-bottom:18px}
.eh{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.eh kbd{display:inline-flex;align-items:center;padding:3px 8px;background:var(--ss);border:1px solid var(--b);border-bottom-width:2px;border-radius:var(--r1);font-family:inherit;font-size:11px;font-weight:500;color:var(--ts)}
.eh span{color:var(--tm);font-size:11px}
.ptb{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;z-index:7;pointer-events:none;opacity:0;transition:opacity .25s cubic-bezier(.16,1,.3,1)}
.ptb.show{opacity:1}
.iinf{display:flex;gap:8px;pointer-events:auto}
.iichip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(15,15,17,.75);backdrop-filter:blur(12px);border:1px solid var(--bs);border-radius:var(--rf);font-size:11px;color:var(--ts);font-variant-numeric:tabular-nums}
.ta{display:flex;gap:6px;pointer-events:auto}
.tbtn{height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;background:rgba(15,15,17,.75);backdrop-filter:blur(12px);border:1px solid var(--bs);border-radius:var(--rf);color:var(--ts);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s cubic-bezier(.16,1,.3,1);font-family:inherit}
.tbtn:hover{color:var(--tp);border-color:var(--b)}
.tbtn.active{color:var(--b2);border-color:rgba(6,182,212,.4);background:rgba(6,182,212,.1)}
.tbtn:active{transform:scale(.96)}
.tbtn svg{width:14px;height:14px}
.tbtn.danger:hover{color:var(--err);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1)}
.tdiv{width:1px;height:20px;background:var(--b);margin:0 2px;align-self:center}
.zc{position:absolute;bottom:16px;right:16px;display:flex;gap:4px;z-index:7;opacity:0;transition:opacity .25s cubic-bezier(.16,1,.3,1)}
.zc.show{opacity:1}
.zbtn{width:30px;height:30px;padding:0;background:rgba(15,15,17,.75);backdrop-filter:blur(12px);border:1px solid var(--bs);border-radius:var(--r1);color:var(--ts);font-size:15px;cursor:pointer;transition:all .15s cubic-bezier(.16,1,.3,1)}
.zbtn:hover{color:var(--tp);border-color:var(--b)}
.status{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(15,15,17,.92);backdrop-filter:blur(16px);border:1px solid var(--b);padding:8px 16px;border-radius:var(--rf);font-size:11px;color:var(--ts);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.16,1,.3,1);z-index:10;display:flex;align-items:center;gap:8px}
.status.show{opacity:1}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--b2);box-shadow:0 0 8px var(--b2);animation:pul 1.5s ease-in-out infinite}
.ctrl{width:var(--pw);min-width:280px;background:var(--bg2);border:1px solid var(--bs);border-radius:var(--r3);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.chdr{padding:14px 18px;border-bottom:1px solid var(--bs);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.chdr .t{font-size:11px;font-weight:600;color:var(--ts);text-transform:uppercase;letter-spacing:1.2px}
.chdr .c{font-size:11px;color:var(--tm);font-variant-numeric:tabular-nums;padding:2px 8px;background:var(--sf);border-radius:var(--rf);border:1px solid var(--bs)}
.sc{flex:1;overflow-y:auto;padding:14px 18px;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.sc::-webkit-scrollbar{width:5px}
.sc::-webkit-scrollbar-thumb{background:var(--b);border-radius:var(--rf)}
.ps{margin-bottom:16px}
.st{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;color:var(--tt);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-top:4px}
.st::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--b2)}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pc{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;background:var(--sf);border:1px solid var(--bs);border-radius:var(--r2);cursor:pointer;transition:all .15s cubic-bezier(.16,1,.3,1);font-family:inherit}
.pc:hover{background:var(--sh);border-color:var(--b);transform:translateY(-1px)}
.pc.active{border-color:rgba(6,182,212,.5);background:rgba(6,182,212,.08);box-shadow:0 0 0 1px rgba(6,182,212,.3)}
.pc .pi{font-size:18px;line-height:1;filter:drop-shadow(0 0 6px rgba(6,182,212,.4))}
.pc .pn{font-size:10px;font-weight:500;color:var(--ts)}
.pc.active .pn{color:var(--b2)}
.hw{height:64px;background:var(--sf);border:1px solid var(--bs);border-radius:var(--r2);padding:6px;margin-bottom:14px;position:relative}
#hc{width:100%;height:100%;display:block}
.hl{position:absolute;top:6px;right:8px;display:flex;gap:8px;font-size:9px;font-weight:600}
.hl span{display:flex;align-items:center;gap:3px;color:var(--tm)}
.hl i{width:7px;height:7px;border-radius:1px;display:inline-block}
.cg{margin-bottom:14px}
.cg:last-child{margin-bottom:0}
.clb{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cn{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--ts);transition:color .15s cubic-bezier(.16,1,.3,1)}
.cg:hover .cn{color:var(--tp)}
.cn .ic{width:15px;height:15px;display:flex;align-items:center;justify-content:center;color:var(--tt);transition:color .15s cubic-bezier(.16,1,.3,1);font-size:13px}
.cg:hover .cn .ic{color:var(--b2)}
.cv{font-variant-numeric:tabular-nums;font-weight:600;font-size:11px;color:var(--tp);background:var(--sf);border:1px solid var(--bs);padding:3px 9px;border-radius:var(--r1);min-width:48px;text-align:center;transition:all .15s cubic-bezier(.16,1,.3,1)}
.cg:hover .cv{border-color:var(--b);color:var(--b2)}
.cv.ch{color:var(--b2);border-color:rgba(6,182,212,.3);background:rgba(6,182,212,.08)}
.sw{position:relative;height:20px;display:flex;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:transparent;border-radius:var(--rf);outline:none;cursor:pointer;position:relative;z-index:2}
.sw::before{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:4px;background:var(--bg4);border-radius:var(--rf);z-index:1}
.sf2{position:absolute;left:0;top:50%;transform:translateY(-50%);height:4px;background:var(--ag);border-radius:var(--rf);z-index:1;pointer-events:none;transition:width 50ms linear;box-shadow:0 0 8px rgba(59,130,246,.3)}
.sm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2px;height:8px;background:var(--bs2);border-radius:1px;z-index:1;pointer-events:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--b2);margin-top:-6px;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:all .15s cubic-bezier(.16,1,.3,1);cursor:grab}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);box-shadow:0 2px 12px rgba(0,0,0,.4),0 0 0 4px rgba(6,182,212,.15)}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.2)}
input[type=range]::-moz-range-track{height:4px;background:transparent}
input[type=range]::-moz-range-progress{height:4px;background:var(--ag);border-radius:var(--rf)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--b2);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:grab}
.dr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{padding:14px 18px 18px;border-top:1px solid var(--bs);display:flex;flex-direction:column;gap:10px;background:var(--bg1);flex-shrink:0}
.ar{display:flex;gap:8px}
button{border:none;border-radius:var(--r2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s cubic-bezier(.16,1,.3,1);letter-spacing:.2px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;position:relative;overflow:hidden}
button:active{transform:scale(.97)}
.bp{width:100%;padding:12px 16px;color:#fff;background:var(--ag);background-size:200% 200%;background-position:0% 50%;box-shadow:0 4px 16px rgba(59,130,246,.25)}
.bp:hover{background-position:100% 50%;transform:translateY(-1px);box-shadow:0 6px 24px rgba(59,130,246,.35)}
.bp::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 50%);pointer-events:none}
.bs2{flex:1;padding:10px 12px;background:var(--sf);color:var(--ts);border:1px solid var(--b);font-size:11px;font-weight:500}
.bs2:hover{background:var(--sh);color:var(--tp);border-color:var(--bs2)}
.bo{width:100%;padding:12px 16px;background:transparent;color:var(--tp);border:1px solid var(--bs2)}
.bo:hover:not(:disabled){border-color:var(--b2);color:var(--b2);background:rgba(6,182,212,.04)}
.bo:disabled{opacity:.4;cursor:not-allowed}
.bo .ic{width:16px;height:16px}
.pb{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);z-index:50;display:none;opacity:0;transition:opacity .25s cubic-bezier(.16,1,.3,1)}
.pb.show{display:block;opacity:1}
.ep{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:340px;background:var(--bg2);border:1px solid var(--b);border-radius:var(--r3);padding:20px;z-index:51;display:none;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.ep.show{display:block;animation:pi .25s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pi{to{transform:translate(-50%,-50%) scale(1)}}
.ep h3{font-size:14px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ep h3 svg{width:16px;height:16px;color:var(--b2)}
.ef{margin-bottom:14px}
.ef label{display:block;font-size:11px;color:var(--tt);margin-bottom:7px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.ef select{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--b);border-radius:var(--r2);color:var(--tp);font-size:12px;font-family:inherit;cursor:pointer}
.ef select:focus{outline:none;border-color:var(--b2)}
.qr{display:flex;align-items:center;gap:12px}
.qr .cv{flex-shrink:0}
.ea{display:flex;gap:8px;margin-top:6px}
@media(max-width:960px){main{flex-direction:column;gap:10px}.ctrl{width:100%;min-width:auto;max-height:48vh}.pv{min-height:42vh}}
@media(max-width:600px){header{padding:12px 14px}.hinfo{display:none}main{padding:10px}.logo-text .s{display:none}}
</style></head><body><div class="app">
<header><div class="logo"><div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.78A6 6 0 0 0 5 12a4 4 0 0 0 0 8h12.5z"/><circle cx="18" cy="6" r="2.5" fill="url(#lg)" stroke="none" opacity=".9"/></svg></div><div class="logo-text"><span class="t">云空精修 SkyLab</span><span class="s">SKY · NATURE PHOTO FINISHER</span></div></div><div class="hinfo"><span class="hbadge"><span class="dot"></span>本地实时渲染</span><span class="hbadge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>高清导出</span></div></header>
<main><section class="pv" id="dz"><div class="sf" id="sfd"></div>
<div class="ptb" id="ptb"><div class="iinf"><span class="iichip" id="isz">—</span><span class="iichip" id="inm">—</span></div><div class="ta"><button class="tbtn" id="hob" title="按住查看原图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/></svg>按住看原图</button><button class="tbtn" id="cmb" title="前后对比"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>对比</button><span class="tdiv"></span><button class="tbtn" id="cib" title="更换图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>更换</button><button class="tbtn danger" id="rib" title="删除图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button></div></div>
<div class="stage" id="stg"><canvas id="pc"></canvas><canvas id="oc"></canvas><div class="ch" id="ch"></div><span class="cl" id="cll" style="left:12px">原图</span><span class="cl" id="clr" style="right:12px">精修</span></div>
<div class="empty" id="emp"><div class="ei"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.78A6 6 0 0 0 5 12a4 4 0 0 0 0 8h12.5z"/><circle cx="18" cy="6" r="2.5"/></svg></div><h3>拖拽天空图片到此处开始精修</h3><p>支持 JPG / PNG / WebP。云、月亮、星空、银河、极光、日落……自动匹配专业摄影调色方案，所有处理均在本地浏览器完成。</p><div class="eh"><span>或</span><kbd>Ctrl + O</kbd><span>打开文件</span></div></div>

function bsf(){const sf=$('sfd');for(let i=0;i<40;i++){const s=document.createElement('div');s.className='star';const z=Math.random()*2+0.5;s.style.width=z+'px';s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';s.style.animationDuration=(2+Math.random()*3)+'s';sf.appendChild(s)}}

function fmt(v,u){return(v>0?'+':'')+v+u}

function lf(file){ss('正在读取图片…');inm.textContent=file.name.length>22?file.name.substring(0,19)+'…':file.name;const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);S.img=img;S.fw=img.naturalWidth;S.fh=img.naturalHeight;pp();emp.style.display='none';stg.classList.add('show');ptb.classList.add('show');zc.classList.add('show');eb.disabled=false;isz.textContent=`${S.fw} × ${S.fh}`;ub.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>更换图片';rpu();ss(`已加载 ${S.fw}×${S.fh}`);setTimeout(hs,1800)};img.onerror=()=>{alert('图片加载失败，请尝试其他格式。');hs()};img.src=url}
function ri(){if(!S.img)return;S.img=null;S.fw=0;S.fh=0;S.pw=0;S.ph=0;S.pod=null;S.ds=null;SC.forEach(c=>{S.params[c.key]=c.def;spu(c.key)});S.ap='original';mpa();upc();if(S.cm){S.cm=false;cmb.classList.remove('active');ch.classList.remove('show');cll.classList.remove('show');clr.classList.remove('show');oc.style.display='none';oc.style.clipPath='none'}S.zl=1;pc.style.transform='';pctx.clearRect(0,0,pc.width,pc.height);octx.clearRect(0,0,oc.width,oc.height);pc.width=0;pc.height=0;oc.width=0;oc.height=0;stg.classList.remove('show');ptb.classList.remove('show');zc.classList.remove('show');eb.disabled=true;emp.style.display='';isz.textContent='—';inm.textContent='—';ub.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>选择图片';dh(new ImageData(new Uint8ClampedArray(4),1,1));ss('已移除图片');setTimeout(hs,1200)}
function pp(){const s=Math.min(1,MPS/Math.max(S.fw,S.fh));S.pw=Math.round(S.fw*s);S.ph=Math.round(S.fh*s);pc.width=S.pw;pc.height=S.ph;oc.width=S.pw;oc.height=S.ph;pctx.drawImage(S.img,0,0,S.pw,S.ph);octx.drawImage(S.img,0,0,S.pw,S.ph);S.pod=pctx.getImageData(0,0,S.pw,S.ph)}
function rpu(){if(!S.img)return;S.nu=true;if(!S.rs){S.rs=true;requestAnimationFrame(()=>{S.rs=false;if(S.nu){rp();S.nu=false}})}}
function rp(){const{pw:w,ph:h,pod:src,params:p}=S;if(!src)return;const out=aa(src,p);pctx.putImageData(out,0,0);dh(out)}
function c255(v){return v<0?0:(v>255?255:Math.round(v))}
function btl(p){const lut=new Float32Array(256);const dz=p.dehaze/100,cl=p.clarity/100;for(let i=0;i<256;i++){let x=i/255;x*=Math.pow(2,p.exposure/100);const c=p.contrast/100;x=(x-0.5)*(1+c)+0.5;const sh=p.shadows/100;x+=sh*Math.max(0,0.5-x)*0.5;const hl=p.highlights/100;x+=hl*Math.max(0,x-0.5)*0.5;x+=dz*Math.max(0,0.4-x)*0.35;const cb=cl*Math.max(0,1-Math.abs(x-0.5)*2)*0.4;x=(x-0.5)*(1+cl*0.6)+0.5+cb*0;const wh=p.whites/100;x*=1+wh*0.25;const bl=p.blacks/100;x+=bl*0.1;x=Math.max(0.0001,Math.min(1,x));lut[i]=x/(i/255||0.0001)}return lut}
function aa(sd,p){const w=sd.width,h=sd.height,src=sd.data;const dst=new Uint8ClampedArray(src.length);const tone=btl(p);const rm=1+p.temp*0.0040-p.tint*0.0020;const gm=1-p.temp*0.0015-p.tint*0.0040;const bm=1-p.temp*0.0040+p.tint*0.0020;const ss2=1+p.saturation/100;const da=p.dehaze/100,ca=p.clarity/100;const hh=p.splitHLHue,hs=p.splitHLSat/100;const sh2=p.splitSHHue,ss3=p.splitSHSat/100;const hc=hs>0?h2r(hh,1,0.5):[0,0,0];const sc2=ss3>0?h2r(sh2,1,0.5):[0,0,0];const va=p.vibrance/100;for(let i=0,l=src.length;i<l;i+=4){let r=src[i],g=src[i+1],b=src[i+2];const a=src[i+3];r*=tone[r];g*=tone[g];b*=tone[b];r*=rm;g*=gm;b*=bm;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));const y=0.299*r+0.587*g+0.114*b;if(da!==0){const ns=1+da*0.4;r=y+(r-y)*ns;g=y+(g-y)*ns;b=y+(b-y)*ns}if(ca!==0){const yn=y/255-0.5;const bst=ca*0.5*Math.sign(yn)*Math.min(Math.abs(yn),0.3);r+=bst*255;g+=bst*255;b+=bst*255}if(va!==0){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const cur=(mx-mn)/255;const f=va*(1-cur)*0.8;const ny=0.299*r+0.587*g+0.114*b;r=ny+(r-ny)*(1+f);g=ny+(g-ny)*(1+f);b=ny+(b-ny)*(1+f)}if(ss2!==1){const ny2=0.299*r+0.587*g+0.114*b;r=ny2+(r-ny2)*ss2;g=ny2+(g-ny2)*ss2;b=ny2+(b-ny2)*ss2}if(hs>0||ss3>0){const yn2=y/255;if(yn2>0.5&&hs>0){const w2=(yn2-0.5)*2*hs;r=r+(hc[0]*255-r)*w2;g=g+(hc[1]*255-g)*w2;b=b+(hc[2]*255-b)*w2}if(yn2<0.5&&ss3>0){const w2=(0.5-yn2)*2*ss3;r=r+(sc2[0]*255-r)*w2;g=g+(sc2[1]*255-g)*w2;b=b+(sc2[2]*255-b)*w2}}dst[i]=c255(r);dst[i+1]=c255(g);dst[i+2]=c255(b);dst[i+3]=a}let res=new ImageData(dst,w,h);if(p.glow>0)res=ag(res,p.glow/100);if(p.vignette!==0)av(res,p.vignette/100);if(p.denoise>0)adn(res,p.denoise/100);if(p.sharpness>0)ash(res,p.sharpness/100);return res}

function ag(id,amt){const w=id.width,h=id.height,src=id.data;const ds=4,dw=Math.max(2,Math.floor(w/ds)),dh=Math.max(2,Math.floor(h/ds));const sm=new Uint8ClampedArray(dw*dh*4);for(let y=0;y<dh;y++){for(let x=0;x<dw;x++){const sx=x*ds,sy=y*ds;const si=(Math.min(sy,h-1)*w+Math.min(sx,w-1))*4;const idx=(y*dw+x)*4;sm[idx]=src[si];sm[idx+1]=src[si+1];sm[idx+2]=src[si+2];sm[idx+3]=255}}bbl(sm,dw,dh,1);bbl(sm,dw,dh,1);for(let y=0;y<h;y++){for(let x=0;x<w;x++){const idx=(y*w+x)*4;const sx=Math.min(dw-1,Math.floor(x/ds)),sy=Math.min(dh-1,Math.floor(y/ds));const sidx=(sy*dw+sx)*4;const br=(src[idx]+src[idx+1]+src[idx+2])/3;const wt=amt*Math.max(0,(br-140)/115);src[idx]=src[idx]+(255-src[idx])*(sm[sidx]/255)*wt;src[idx+1]=src[idx+1]+(255-src[idx+1])*(sm[sidx+1]/255)*wt;src[idx+2]=src[idx+2]+(255-src[idx+2])*(sm[sidx+2]/255)*wt}}return id}
