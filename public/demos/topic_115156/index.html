<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安药伴｜智能服药提醒</title>
  <style>
    :root {

      --ink: #24302d;
      --muted: #6d7773;
      --rule: #eadfce;
      --accent: #1f8a70;
      --accent2: #f28c38;
      --soft: #eaf7f2;
      --warn: #fff0dc;
      --danger: #e05555;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top nav */
    .topbar {
      background: linear-gradient(135deg, var(--accent), #167a5f);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(31,138,112,.15);
    }
    .topbar h1 {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .topbar p {
      font-size: .82rem;
      opacity: .85;
    }

    /* Tab bar */
    .tabbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--rule);
      display: flex;
      position: sticky;
      top: 60px;
      z-index: 99;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .tab-item {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      font-size: .88rem;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all .2s;
      user-select: none;
    }
    .tab-item:hover { color: var(--accent); }
    .tab-item.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Main */
    .main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px 24px;
    }
    .page {
      display: none;
      padding-top: 20px;
    }
    .page.active { display: block; }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(.85);
      background: rgba(36,48,45,.92);
      color: #fff;
      border-radius: 16px;
      padding: 18px 36px;
      font-size: 1.1rem;
      font-weight: 900;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ===== HOME ===== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 18px 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.06em;
    }
    .stat-num.green { color: var(--accent); }
    .stat-num.orange { color: var(--accent2); }
    .stat-num.gray { color: var(--muted); }
    .stat-label {
      font-size: .82rem;
      color: var(--muted);
      font-weight: 800;
      margin-top: 2px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 14px;
      text-align: center;
    }

    .med-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .med-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: box-shadow .2s, transform .15s;
    }
    .med-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .med-card:active { transform: scale(.98); }
    .med-card.done { opacity: .5; }
    .med-card.done .med-name { text-decoration: line-through; }
    .med-icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      background: var(--soft);
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .med-icon.orange { background: var(--warn); }
    .med-info { flex: 1; }
    .med-name { font-weight: 800; font-size: .95rem; margin-bottom: 2px; }
    .med-detail { font-size: .82rem; color: var(--muted); font-weight: 700; }
    .med-status {
      font-size: .75rem;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge-done { background: var(--soft); color: var(--accent); }
    .badge-pending { background: var(--warn); color: var(--accent2); }
    .badge-overdue { background: #fde2e2; color: var(--danger); }

    /* ===== ADD ===== */
    .add-title {
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .add-subtitle {
      font-size: .88rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .add-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: .85rem;
      font-weight: 800;
      color: var(--muted);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--bg2);
      border: 1.5px solid var(--rule);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: .92rem;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }
    .form-group textarea { resize: none; height: 64px; }
    .form-group.full { grid-column: 1 / -1; }

    .photo-upload {
      background: var(--soft);
      border: 2px dashed rgba(31,138,112,.3);
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      cursor: pointer;
      color: var(--accent);
      font-weight: 800;
      font-size: .9rem;
      transition: background .2s;
    }
    .photo-upload:active { background: #d8f0e8; }
    .photo-upload .photo-icon { font-size: 2rem; margin-bottom: 4px; }

    .family-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .family-tag {
      background: var(--soft);
      border: 1px solid rgba(31,138,112,.2);
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: .82rem;
      font-weight: 800;
      cursor: pointer;
      transition: all .15s;
    }
    .family-tag.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(31,138,112,.22);
      transition: transform .15s;
      font-family: inherit;
      grid-column: 1 / -1;
      justify-self: start;
    }
    .btn-primary:active { transform: scale(.97); }

    /* ===== REMINDER ===== */
    .reminder-hero {
      background: linear-gradient(180deg, var(--warn), var(--bg));
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      margin-bottom: 20px;
    }
    .reminder-time {
      font-size: .9rem;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 4px;
    }
    .reminder-prompt {
      font-size: .85rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 20px;
    }
    .reminder-drug-card {
      display: inline-block;
      background: var(--bg2);
      border: 2px solid var(--accent2);
      border-radius: 24px;
      padding: 28px 40px;
      box-shadow: 0 12px 40px rgba(242,140,56,.15);
      margin-bottom: 20px;
    }
    .reminder-drug-label {
      font-size: .88rem;
      color: var(--muted);
      font-weight: 800;
    }
    .reminder-drug-name {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--accent2);
      letter-spacing: -0.04em;
      margin: 6px 0;
    }
    .reminder-drug-photo {
      width: 80px; height: 80px;
      background: var(--soft);
      border-radius: 18px;
      margin: 10px auto;
      display: grid;
      place-items: center;
      font-size: 2rem;
      border: 1px solid var(--rule);
    }

    .reminder-details {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .reminder-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 18px;
      font-size: .95rem;
      border-bottom: 1px solid var(--rule);
    }
    .reminder-row:last-child { border-bottom: none; }
    .reminder-row b { color: var(--ink); }
    .reminder-row span { color: var(--muted); font-weight: 700; }

    .voice-bar {
      background: var(--warn);
      border: 1px solid rgba(242,140,56,.25);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      font-weight: 800;
      font-size: .92rem;
      margin-bottom: 20px;
    }
    .voice-bar .wave { display: inline-block; margin-right: 6px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }

    .confirm-btns {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-confirm {
      background: var(--accent2);
      color: #fff;
      border: none;
      border-radius: 18px;
      padding: 16px 36px;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(242,140,56,.25);
      font-family: inherit;
      transition: transform .15s;
    }
    .btn-confirm:active { transform: scale(.97); }
    .btn-secondary {
      background: var(--bg2);
      border: 1.5px solid var(--rule);
      border-radius: 14px;
      padding: 12px 20px;
      font-size: .88rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
    }
    .btn-secondary:active { background: var(--soft); color: var(--accent); }
    .btn-skip {
      background: none;
      border: none;
      font-size: .85rem;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      padding: 8px;
    }

    /* ===== RECORDS ===== */
    .records-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .records-header h2 { font-size: 1.1rem; font-weight: 900; }
    .records-header span { font-size: .85rem; color: var(--muted); font-weight: 800; }

    .records-tabs {
      display: flex;
      gap: 0;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .records-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: .88rem;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
    }
    .records-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .record-item {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .record-dot {
      width: 10px; height: 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .record-dot.green { background: var(--accent); }
    .record-dot.orange { background: var(--accent2); }
    .record-dot.red { background: var(--danger); }
    .record-info { flex: 1; }
    .record-name { font-weight: 800; font-size: .92rem; }
    .record-time { font-size: .78rem; color: var(--muted); font-weight: 700; }
    .record-badge {
      font-size: .75rem;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .stock-section {
      background: var(--warn);
      border: 1px solid rgba(242,140,56,.2);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .stock-title {
      font-size: .88rem;
      font-weight: 900;
      color: var(--accent2);
      margin-bottom: 10px;
    }
    .stock-item {
      display: flex;
      justify-content: space-between;
      font-size: .9rem;
      padding: 5px 0;
      font-weight: 700;
    }
    .stock-item span { color: var(--muted); }

    .safety-note {
      background: #fde2e2;
      border: 1px solid rgba(224,85,85,.15);
      border-radius: 14px;
      padding: 16px;
      font-size: .85rem;
      color: var(--danger);
      font-weight: 700;
      margin-top: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 8px; }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: .82rem;
      color: var(--muted);
      font-weight: 700;
      border-top: 1px solid var(--rule);
      margin-top: auto;
    }

    @media (max-width: 600px) {
      .main { padding: 0 10px 16px; }
      .stats-row { gap: 8px; }
      .stat-card { padding: 12px 8px; }
      .stat-num { font-size: 1.6rem; }
      .med-grid { grid-template-columns: 1fr; }
      .add-grid { grid-template-columns: 1fr; }
      .reminder-drug-card { padding: 20px 28px; }
      .reminder-drug-name { font-size: 1.8rem; }
      .confirm-btns { flex-direction: column; }
      .btn-confirm { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div>
      <h1>安药伴</h1>
      <p>安心吃药，陪伴左右</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabbar">
    <div class="tab-item active" data-page="page-home">首页</div>
    <div class="tab-item" data-page="page-add">添加药品</div>
    <div class="tab-item" data-page="page-reminder">服药提醒</div>
    <div class="tab-item" data-page="page-records">服药记录</div>
  </div>

  <!-- Pages -->
  <div class="main">
    <!-- HOME -->
    <div class="page active" id="page-home">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-num green" id="stat-done">0</div>
          <div class="stat-label">今日已服</div>
        </div>
        <div class="stat-card">
          <div class="stat-num orange" id="stat-pending">0</div>
          <div class="stat-label">待确认</div>
        </div>
        <div class="stat-card">
          <div class="stat-num gray" id="stat-total">0</div>
          <div class="stat-label">药品总数</div>
        </div>
      </div>
      <div class="section-title">今日服药提醒</div>
      <div class="med-grid" id="home-med-list">
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <p>还没有药品，去"添加药品"页面录入吧</p>
        </div>
      </div>
    </div>

    <!-- ADD -->
    <div class="page" id="page-add">
      <div class="add-title">添加服药提醒</div>
      <div class="add-subtitle">为老人设置每天的用药计划</div>
      <div class="add-grid">
        <div class="form-group full">
          <label>药品照片</label>
          <div class="photo-upload" id="photo-upload">
            <div class="photo-icon">📷</div>
            <span>点击拍照或上传药盒照片</span>
          </div>
        </div>
        <div class="form-group">
          <label>药品名称</label>
          <input type="text" id="input-name" placeholder="例如：降压药 A">
        </div>
        <div class="form-group">
          <label>每次剂量</label>
          <input type="text" id="input-dose" placeholder="例如：1 片">
        </div>
        <div class="form-group">
          <label>总量</label>
          <input type="text" id="input-total" placeholder="例如：30 片">
        </div>
        <div class="form-group">
          <label>提醒时间</label>
          <select id="input-time">
            <option value="早餐后 7:00">早餐后 7:00</option>
            <option value="早餐后 8:00" selected>早餐后 8:00</option>
            <option value="午餐后 12:00">午餐后 12:00</option>
            <option value="午餐后 12:30">午餐后 12:30</option>
            <option value="晚餐后 18:00">晚餐后 18:00</option>
            <option value="晚餐后 19:00">晚餐后 19:00</option>
            <option value="睡前 21:00">睡前 21:00</option>
            <option value="睡前 22:00">睡前 22:00</option>
          </select>
        </div>
        <div class="form-group full">
          <label>语音说明（老人听到的话）</label>
          <textarea id="input-voice" placeholder="例如：饭后温水服用，不要和牛奶一起吃"></textarea>
        </div>
        <div class="form-group">
          <label>每日用量</label>
          <input type="text" id="input-daily" placeholder="例如：1 片（估算剩余天数）">
        </div>
        <div class="form-group">
          <label>共同照护家人</label>
          <div class="family-tags">
            <span class="family-tag selected">女儿</span>
            <span class="family-tag">儿子</span>
            <span class="family-tag">配偶</span>
          </div>
        </div>
        <button class="btn-primary" id="btn-save">保存并提醒老人</button>
      </div>
    </div>

    <!-- REMINDER -->
    <div class="page" id="page-reminder">
      <div class="reminder-hero">
        <div class="reminder-time" id="reminder-time-display">当前提醒时间</div>
        <div class="reminder-prompt">到了服药时间啦</div>
        <div class="reminder-drug-card">
          <div class="reminder-drug-label">现在该服用</div>
          <div class="reminder-drug-name" id="reminder-name">--</div>
          <div class="reminder-drug-photo" id="reminder-photo">💊</div>
        </div>
      </div>
      <div class="reminder-details">
        <div class="reminder-row"><b>每次剂量</b><span id="reminder-dose">--</span></div>
        <div class="reminder-row"><b>提醒时间</b><span id="reminder-time">--</span></div>
        <div class="reminder-row"><b>服用说明</b><span id="reminder-voice">--</span></div>
      </div>
      <div class="voice-bar">
        <span class="wave">🔊</span> 语音播报中...
      </div>
      <div class="confirm-btns">
        <button class="btn-confirm" id="btn-confirm">我吃过了</button>
        <button class="btn-secondary" id="btn-voice-confirm">🎤 也可以说"我吃过了"</button>
        <button class="btn-skip" id="btn-skip">暂时不吃</button>
      </div>
    </div>

    <!-- RECORDS -->
    <div class="page" id="page-records">
      <div class="records-header">
        <h2>服药记录</h2>
        <span>近 7 天</span>
      </div>
      <div class="records-tabs">
        <div class="records-tab active" data-tab="today">今日</div>
        <div class="records-tab" data-tab="week">本周</div>
        <div class="records-tab" data-tab="stock">库存</div>
      </div>
      <div id="records-content"></div>
    </div>
  </div>

  <div class="footer">安药伴 · 安心吃药，陪伴左右</div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      var medicines = [];
      var records = [];
      var toastEl = document.getElementById('toast');
      var toastTimer = null;

      function showToast(msg) {
        toastEl.textContent = msg || '已成功';
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 1600);
      }

      // Tabs
      var tabs = document.querySelectorAll('.tab-item');
      tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
          var pageId = tab.getAttribute('data-page');
          switchPage(pageId);
          tabs.forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
        });
      });

      function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
        var target = document.getElementById(pageId);
        if (target) target.classList.add('active');
        if (pageId === 'page-home') renderHome();
        if (pageId === 'page-reminder') renderReminder();
        if (pageId === 'page-records') renderRecords();
      }

      // Family tags
      document.querySelectorAll('.family-tag').forEach(function(tag) {
        tag.addEventListener('click', function() { tag.classList.toggle('selected'); });
      });

      // Photo
      document.getElementById('photo-upload').addEventListener('click', function() {
        showToast('已拍下药盒照片');
        this.innerHTML = '<div class="photo-icon">✅</div><span>药盒照片已保存</span>';
      });

      // Save
      document.getElementById('btn-save').addEventListener('click', function() {
        var name = document.getElementById('input-name').value.trim();
        var dose = document.getElementById('input-dose').value.trim();
        var total = document.getElementById('input-total').value.trim();
        var time = document.getElementById('input-time').value;
        var voice = document.getElementById('input-voice').value.trim();
        var daily = document.getElementById('input-daily').value.trim();
        if (!name) { showToast('请输入药品名称'); return; }
        if (!dose) { showToast('请输入每次剂量'); return; }

        var familyArr = [];
        document.querySelectorAll('.family-tag.selected').forEach(function(t) { familyArr.push(t.textContent); });

        medicines.push({
          id: Date.now(), name: name, dose: dose,
          total: total ? parseInt(total) : 0, time: time,
          voice: voice || '按说明服用',
          daily: daily ? parseInt(daily) : 0,
          family: familyArr, done: false, doneTime: null
        });

        showToast('已成功添加：' + name);
        document.getElementById('input-name').value = '';
        document.getElementById('input-dose').value = '';
        document.getElementById('input-total').value = '';
        document.getElementById('input-voice').value = '';
        document.getElementById('input-daily').value = '';
        var pu = document.getElementById('photo-upload');
        pu.innerHTML = '<div class="photo-icon">📷</div><span>点击拍照或上传药盒照片</span>';

        switchPage('page-home');
        tabs.forEach(function(t) { t.classList.remove('active'); });
        document.querySelector('[data-page="page-home"]').classList.add('active');
      });

      // Home
      function renderHome() {
        var listEl = document.getElementById('home-med-list');
        var doneCount = 0, pendingCount = 0;
        if (medicines.length === 0) {
          listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>还没有药品，去"添加药品"页面录入吧</p></div>';
          document.getElementById('stat-done').textContent = '0';
          document.getElementById('stat-pending').textContent = '0';
          document.getElementById('stat-total').textContent = '0';
          return;
        }
        var html = '';
        medicines.forEach(function(med) {
          if (med.done) doneCount++; else pendingCount++;
          var sc = med.done ? 'done' : '';
          var bc = med.done ? 'badge-done' : 'badge-pending';
          var bt = med.done ? '已服用' : '待确认';
          var ic = med.done ? '' : 'orange';
          html += '<div class="med-card ' + sc + '" data-id="' + med.id + '">';
          html += '<div class="med-icon ' + ic + '">💊</div>';
          html += '<div class="med-info"><div class="med-name">' + med.name + '</div>';
          html += '<div class="med-detail">' + med.time + ' · ' + med.dose + '</div></div>';
          html += '<span class="med-status ' + bc + '">' + bt + '</span></div>';
        });
        listEl.innerHTML = html;
        document.getElementById('stat-done').textContent = doneCount;
        document.getElementById('stat-pending').textContent = pendingCount;
        document.getElementById('stat-total').textContent = medicines.length;

        listEl.querySelectorAll('.med-card').forEach(function(card) {
          card.addEventListener('click', function() {
            var id = parseInt(card.getAttribute('data-id'));
            var med = medicines.find(function(m) { return m.id === id; });
            if (med) { currentReminderMed = med; switchPage('page-reminder'); tabs.forEach(function(t) { t.classList.remove('active'); }); document.querySelector('[data-page="page-reminder"]').classList.add('active'); }
          });
        });
      }

      // Reminder
      var currentReminderMed = null;
      function renderReminder() {
        var med = currentReminderMed || medicines.find(function(m) { return !m.done; });
        if (!med) {
          document.getElementById('reminder-name').textContent = '没有待确认的药品';
          document.getElementById('reminder-dose').textContent = '--';
          document.getElementById('reminder-time').textContent = '--';
          document.getElementById('reminder-voice').textContent = '--';
          document.getElementById('reminder-time-display').textContent = '所有药品已确认';
          return;
        }
        document.getElementById('reminder-time-display').textContent = med.time;
        document.getElementById('reminder-name').textContent = med.name;
        document.getElementById('reminder-dose').textContent = med.dose;
        document.getElementById('reminder-time').textContent = med.time;
        document.getElementById('reminder-voice').textContent = med.voice;
      }

      document.getElementById('btn-confirm').addEventListener('click', confirmMed);
      document.getElementById('btn-voice-confirm').addEventListener('click', function() {
        showToast('语音识别：我吃过了');
        setTimeout(confirmMed, 600);
      });
      document.getElementById('btn-skip').addEventListener('click', function() { showToast('已记录：暂时不吃'); });

      function confirmMed() {
        if (!currentReminderMed) return;
        currentReminderMed.done = true;
        currentReminderMed.doneTime = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        records.push({ name: currentReminderMed.name, dose: currentReminderMed.dose, time: currentReminderMed.time, doneTime: currentReminderMed.doneTime, status: 'done' });
        showToast('已成功确认：' + currentReminderMed.name);
        currentReminderMed = null;
        setTimeout(renderReminder, 300);
      }

      // Records
      var currentRecordTab = 'today';
      document.querySelectorAll('.records-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.records-tab').forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
          currentRecordTab = tab.getAttribute('data-tab');
          renderRecords();
        });
      });

      function renderRecords() {
        var container = document.getElementById('records-content');
        if (currentRecordTab === 'stock') { renderStock(container); return; }
        if (medicines.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><p>暂无服药记录</p></div>';
          return;
        }
        var html = '';
        medicines.forEach(function(med) {
          var dc = med.done ? 'green' : 'orange';
          var bc = med.done ? 'badge-done' : 'badge-pending';
          var bt = med.done ? '已服用 ' + (med.doneTime || '') : '待确认';
          html += '<div class="record-item"><div class="record-dot ' + dc + '"></div>';
          html += '<div class="record-info"><div class="record-name">' + med.name + ' · ' + med.dose + '</div>';
          html += '<div class="record-time">' + med.time + '</div></div>';
          html += '<span class="record-badge ' + bc + '">' + bt + '</span></div>';
        });
        if (medicines.some(function(m) { return !m.done; })) {
          html += '<div class="safety-note">⚠ 漏服提示：如果老人超时未确认，请先联系老人确认情况。是否补服应按医生建议处理，不要自行补服。</div>';
        }
        container.innerHTML = html;
      }

      function renderStock(container) {
        if (medicines.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><p>暂无药品库存信息</p></div>';
          return;
        }
        var html = '<div class="stock-section"><div class="stock-title">药品库存估算</div>';
        medicines.forEach(function(med) {
          var daysLeft = '--';
          if (med.total && med.daily) {
            daysLeft = Math.floor(med.total / med.daily);
            daysLeft = daysLeft <= 5 ? daysLeft + '（快用完，提醒购买）' : daysLeft + ' 天';
          }
          html += '<div class="stock-item"><b>' + med.name + '</b><span>剩余约 ' + daysLeft + '</span></div>';
        });
        html += '</div>';
        container.innerHTML = html;
      }
    })();
  </script>
</body>
</html>
