<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户中心 - Budget Buddy 预算伙伴</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="header-logo">
          <div class="header-logo-icon"><span class="icon" data-icon="wallet"></span></div>
          <span class="header-logo-text">Budget Buddy</span>
        </a>
        
        <nav class="header-nav">
          <a href="index.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="home"></span></span>
            <span>首页</span>
          </a>
          <a href="templates.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="templates"></span></span>
            <span>方案库</span>
          </a>
          <a href="customize.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="customize"></span></span>
            <span>定制预算</span>
          </a>
          <a href="profile.html" class="header-nav-item active">
            <span class="header-nav-icon"><span class="icon" data-icon="profile"></span></span>
            <span>我的方案</span>
          </a>
        </nav>

        <div class="header-search">
          <div class="search-bar">
            <span class="search-icon"><span class="icon" data-icon="search"></span></span>
            <input type="text" placeholder="搜索预算方案、活动类型、关键词...">
          </div>
        </div>

        <div class="header-actions">
          <button class="topbar-icon-btn" title="通知"><span class="icon" data-icon="bell"></span></button>
          <button class="topbar-icon-btn" title="收藏"><span class="icon" data-icon="heart"></span></button>
          <div class="topbar-avatar" title="个人中心"><span class="icon" data-icon="user"></span></div>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="page-content">
        <div class="page-header-simple">
          <div class="breadcrumb">
            <a href="index.html">首页</a>
            <span class="breadcrumb-sep">/</span>
            <span>个人中心</span>
          </div>
          <h1 class="page-title">个人中心</h1>
          <p class="page-subtitle">管理你的预算方案和账户设置</p>
        </div>

        <div class="profile-layout">
          <aside class="profile-side-card">
            <div class="profile-head">
              <div class="profile-avatar-lg"><span class="icon" data-icon="user"></span></div>
              <div class="profile-name-lg">用户昵称</div>
              <div class="profile-email-lg">user@example.com</div>
            </div>
            <ul class="profile-nav">
              <li class="profile-nav-item active" data-tab="plans">
                <span class="profile-nav-icon" data-icon="clipboard"></span>
                <span>我的方案</span>
              </li>
              <li class="profile-nav-item" data-tab="favorites">
                <span class="profile-nav-icon" data-icon="heart"></span>
                <span>收藏方案</span>
              </li>
              <li class="profile-nav-item" data-tab="exports">
                <span class="profile-nav-icon" data-icon="download"></span>
                <span>导出记录</span>
              </li>
              <li class="profile-nav-item" data-tab="settings">
                <span class="profile-nav-icon" data-icon="settings"></span>
                <span>账号设置</span>
              </li>
            </ul>
          </aside>

          <div class="profile-main-card">
            <div class="profile-tab" id="tab-plans">
              <h2 class="profile-tab-title">我的方案</h2>
              <div class="user-plans-grid" id="myPlansGrid">
              </div>
            </div>

            <div class="profile-tab" id="tab-favorites" style="display: none;">
              <h2 class="profile-tab-title">收藏方案</h2>
              <div class="empty-box">
                <div class="empty-box-icon" data-icon="heart"></div>
                <div class="empty-box-title">暂无收藏</div>
                <div class="empty-box-desc">去方案库发现更多优质方案吧</div>
                <a href="templates.html" class="btn btn-primary">浏览方案库</a>
              </div>
            </div>

            <div class="profile-tab" id="tab-exports" style="display: none;">
              <h2 class="profile-tab-title">导出记录</h2>
              <div class="data-table-wrap">
                <table class="data-table" id="exportTable">
                  <thead>
                    <tr>
                      <th>方案名称</th>
                      <th>导出格式</th>
                      <th>导出时间</th>
                      <th>文件大小</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="profile-tab" id="tab-settings" style="display: none;">
              <h2 class="profile-tab-title">账号设置</h2>
              <div class="settings-wrap">
                <div class="avatar-change">
                  <div class="avatar-preview"><span class="icon" data-icon="user"></span></div>
                  <div>
                    <button class="btn btn-outline btn-sm">更换头像</button>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">支持 JPG、PNG 格式，小于 2MB</p>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">昵称</label>
                  <input type="text" class="form-input" value="用户昵称">
                </div>

                <div class="form-group">
                  <label class="form-label">邮箱</label>
                  <input type="email" class="form-input" value="user@example.com">
                </div>

                <div class="form-group">
                  <label class="form-label">手机号</label>
                  <input type="tel" class="form-input" placeholder="请输入手机号">
                </div>

                <div class="form-group">
                  <label class="form-label">公司/组织</label>
                  <input type="text" class="form-input" placeholder="请输入公司或组织名称">
                </div>

                <div class="form-group">
                  <label class="form-label">行业</label>
                  <select class="form-input">
                    <option value="">请选择行业</option>
                    <option value="internet">互联网/科技</option>
                    <option value="finance">金融</option>
                    <option value="education">教育</option>
                    <option value="medical">医疗健康</option>
                    <option value="manufacturing">制造业</option>
                    <option value="retail">零售/电商</option>
                    <option value="other">其他</option>
                  </select>
                </div>

                <button class="btn btn-primary">保存修改</button>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer">
          <p class="footer-slogan"><span data-icon="abacus"></span> <strong>Budget Buddy 预算伙伴</strong> — 让每一次活动预算都简单高效</p>
        </footer>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initProfilePage();
  </script>

  <div class="custom-modal-overlay" id="logoutModal" style="display: none;">
    <div class="custom-modal">
      <div class="custom-modal-content">
        <div class="custom-modal-icon">💔</div>
        <div class="custom-modal-title">答应我你还会来好吗？Buddy～</div>
        <div class="custom-modal-buttons">
          <button class="btn btn-outline custom-modal-btn" onclick="closeLogoutModal()">不走了</button>
          <button class="btn btn-primary custom-modal-btn" onclick="confirmLogout()">好的</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
