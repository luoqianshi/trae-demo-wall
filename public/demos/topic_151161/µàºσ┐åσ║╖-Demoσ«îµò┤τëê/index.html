<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>慧忆康 — 选择入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================
   DESIGN SYSTEM — 温暖花园 · 入口选择
   ========================================== */
:root {
  --paper: #FAF8F4;
  --paper-2: #F3F0EA;
  --fg: #2A3028;
  --fg-muted: #6A6E68;
  --fg-light: #A0A49E;
  --border: #E6E3DC;
  --sage: #5E7A6A;
  --sage-light: #E4EDE8;
  --sage-dark: #3D5A48;
  --terracotta: #C17B5C;
  --terracotta-light: #F5E6DA;
  --terracotta-dark: #A05E40;
  --peach: #F5EDE3;
  --gold: #C4A265;
  --gold-light: #F5EDD8;
  --rose: #D4839A;
  --rose-light: #F5E4EA;
  --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(30, 50, 40, 0.06);
  --shadow-md: 0 4px 16px rgba(30, 50, 40, 0.08);
  --shadow-lg: 0 12px 40px rgba(30, 50, 40, 0.12);
  --shadow-phone: 0 30px 80px -20px rgba(30, 50, 40, 0.35), 0 10px 30px -10px rgba(30, 50, 40, 0.2);
  --r-md: 20px;
  --r-lg: 28px;
  --r-xl: 36px;
  --font-display: 'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--font-body);
  font-size: 20px;
  line-height: 1.6;
  color: var(--fg);
  background: #E8E4DC;
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

/* ==========================================
   PHONE FRAME
   ========================================== */
.phone-frame {
  width: 393px;
  height: 852px;
  border-radius: 54px;
  background: #1A1A1A;
  padding: 11px;
  box-shadow: var(--shadow-phone);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

.phone-frame::before {
  content: '';
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 37px;
  background: #1A1A1A;
  border-radius: 0 0 22px 22px;
  z-index: 50;
}

.phone-frame::after {
  content: '';
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 5px;
  background: rgba(255,255,255,0.3);
  border-radius: 3px;
  z-index: 50;
}

.phone-screen {
  width: 100%;
  height: 100%;
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  background: var(--paper);
}

/* ==========================================
   STATUS BAR
   ========================================== */
.status-bar {
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px 0 32px;
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}

/* ==========================================
   WARM BACKGROUND IMAGE
   ========================================== */
.entry-bg {
  position: absolute;
  inset: 0;
  background-image: url('entry-bg-warm.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: 0;
}

/* Semi-transparent overlay for readability while showing background image */
.entry-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(250, 248, 244, 0.45) 0%,
    rgba(250, 248, 244, 0.35) 35%,
    rgba(245, 237, 227, 0.55) 100%
  );
  z-index: 1;
}

/* ==========================================
   ENTRY CONTENT — Compact, no scroll
   ========================================== */
.entry-content {
  position: relative;
  z-index: 2;
  height: calc(100% - 54px);
  padding: 40px 24px 16px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* Welcome back banner */
.welcome-back {
  display: none;
  text-align: center;
  margin-bottom: 8px;
  padding: 8px 16px;
  background: linear-gradient(135deg, var(--gold-light), #FBF3DF);
  border-radius: 14px;
  border: 1px solid rgba(196, 162, 101, 0.3);
}
.welcome-back.show { display: block; }
.welcome-back p { font-size: 14px; color: #8A6B35; line-height: 1.4; }
.welcome-back strong { color: var(--terracotta-dark); }

/* Brand — compact */
.brand {
  text-align: center;
  padding: 4px 0 2px;
}
.brand-logo {
  width: 72px;
  height: 72px;
  margin: 0 auto 8px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.brand-logo img { width: 64px; height: 64px; object-fit: contain; }
.brand-name {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: var(--sage-dark);
  letter-spacing: 2px;
}
.brand-tagline {
  font-size: 14px;
  color: var(--fg-muted);
  margin-top: 2px;
  letter-spacing: 1px;
}

/* Question — compact */
.entry-question {
  text-align: center;
  margin: 10px 0 10px;
}
.entry-question h1 {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.3;
}
.entry-question h1 em {
  font-style: normal;
  color: var(--terracotta-dark);
  font-weight: 700;
}
.entry-question p {
  font-size: 15px;
  color: var(--fg-muted);
  margin-top: 4px;
}

/* Role cards — compact */
.role-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: auto;
  margin-bottom: 8px;
}
.role-card {
  position: relative;
  border-radius: 18px;
  padding: 12px 16px;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  gap: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.role-card:active { transform: scale(0.97); }
.role-card:hover { transform: translateY(-2px); }

.role-card.elder {
  background: linear-gradient(135deg, rgba(245, 228, 234, 0.75) 0%, rgba(251, 240, 243, 0.70) 100%);
  border-color: rgba(212, 131, 154, 0.25);
  box-shadow: 0 6px 22px rgba(212, 131, 154, 0.15);
}
.role-card.family {
  background: linear-gradient(135deg, rgba(228, 237, 232, 0.75) 0%, rgba(247, 250, 248, 0.70) 100%);
  border-color: rgba(94, 122, 106, 0.25);
  box-shadow: 0 6px 22px rgba(94, 122, 106, 0.15);
}
.role-card.institution {
  background: linear-gradient(135deg, rgba(245, 237, 216, 0.75) 0%, rgba(251, 246, 232, 0.70) 100%);
  border-color: rgba(196, 162, 101, 0.25);
  box-shadow: 0 6px 22px rgba(196, 162, 101, 0.15);
}

.role-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.role-card.elder .role-icon {
  background: linear-gradient(135deg, var(--rose), #C7738B);
  box-shadow: 0 4px 14px rgba(212, 131, 154, 0.4);
}
.role-card.family .role-icon {
  background: linear-gradient(135deg, var(--sage), var(--sage-dark));
  box-shadow: 0 4px 14px rgba(94, 122, 106, 0.4);
}
.role-card.institution .role-icon {
  background: linear-gradient(135deg, var(--gold), #B08D45);
  box-shadow: 0 4px 14px rgba(196, 162, 101, 0.4);
}
.role-icon svg { width: 24px; height: 24px; stroke: #fff; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.role-text { flex: 1; min-width: 0; }
.role-title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 2px;
}
.role-card.elder .role-title { color: #A8456A; }
.role-card.family .role-title { color: var(--sage-dark); }
.role-card.institution .role-title { color: #8A6B2A; }
.role-desc {
  font-size: 13px;
  color: var(--fg-muted);
  line-height: 1.4;
}

.role-arrow {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.2s;
}
.role-card:hover .role-arrow { transform: translateX(4px); }
.role-card.elder .role-arrow { background: rgba(212, 131, 154, 0.18); color: #A8456A; }
.role-card.family .role-arrow { background: rgba(94, 122, 106, 0.18); color: var(--sage-dark); }
.role-card.institution .role-arrow { background: rgba(196, 162, 101, 0.18); color: #8A6B2A; }
.role-arrow svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* Feature tags — compact */
.role-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.role-tag {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 16px;
  background: rgba(255,255,255,0.65);
  color: var(--fg-muted);
  font-weight: 500;
}
.role-card.elder .role-tag { color: #A8456A; }
.role-card.family .role-tag { color: var(--sage-dark); }
.role-card.institution .role-tag { color: #8A6B2A; }

/* Footer — compact */
.entry-footer {
  text-align: center;
  padding-top: 12px;
}
.entry-footer p {
  font-size: 13px;
  color: var(--fg-light);
  line-height: 1.5;
}
.entry-footer strong {
  color: var(--terracotta-dark);
  font-weight: 600;
}
.switch-hint {
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--fg-light);
  background: rgba(243, 240, 234, 0.7);
  padding: 5px 12px;
  border-radius: 16px;
}
.switch-hint svg { width: 14px; height: 14px; stroke: var(--fg-light); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-in { animation: fadeUp 0.5s ease both; }
.anim-d1 { animation-delay: 0.05s; }
.anim-d2 { animation-delay: 0.15s; }
.anim-d3 { animation-delay: 0.25s; }
.anim-d4 { animation-delay: 0.35s; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-screen">
    <!-- Warm background image -->
    <div class="entry-bg"></div>
    <div class="entry-overlay"></div>

    <div class="status-bar">
      <span class="status-time">9:41</span>
      <span style="display:flex;gap:4px;align-items:center">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="2" width="15" height="5" rx="1" opacity="0.3"/><rect x="0" y="2" width="11" height="5" rx="1"/><rect x="16" y="3.5" width="2" height="2" rx="0.5"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="currentColor"><rect x="0" y="3.5" width="20" height="5" rx="1" opacity="0.3"/><rect x="0" y="3.5" width="16" height="5" rx="1"/></svg>
      </span>
    </div>

    <div class="entry-content">
      <!-- Welcome back banner -->
      <div class="welcome-back anim-in" id="welcomeBack">
        <p>您当前是 <strong id="currentRoleName">长者端</strong>，可继续使用，或重新选择</p>
      </div>

      <!-- Brand -->
      <div class="brand anim-in anim-d1">
        <div class="brand-logo">
          <img src="hyk-logo.png" alt="慧忆康">
        </div>
        <div class="brand-name">慧忆康</div>
        <div class="brand-tagline">温暖回忆 · 陪伴生命</div>
      </div>

      <!-- Question -->
      <div class="entry-question anim-in anim-d2">
        <h1>您好，请选择<em>进入方式</em></h1>
        <p>每端各有侧重，可随时在「我的」中切换</p>
      </div>

      <!-- Role cards -->
      <div class="role-cards">
        <!-- Elder -->
        <div class="role-card elder anim-in anim-d3" onclick="chooseRole('elder')">
          <div class="role-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M9 8h.01M15 8h.01"/><path d="M10 9c.5.5 1.2.8 2 .8s1.5-.3 2-.8"/></svg>
          </div>
          <div class="role-text">
            <div class="role-title">长者端</div>
            <div class="role-desc">大字大按钮，简单温暖</div>
          </div>
          <div class="role-arrow">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
          </div>
        </div>

        <!-- Family -->
        <div class="role-card family anim-in anim-d4" onclick="chooseRole('family')">
          <div class="role-icon">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="role-text">
            <div class="role-title">家属端</div>
            <div class="role-desc">陪伴回忆、共建相册</div>
          </div>
          <div class="role-arrow">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
          </div>
        </div>

        <!-- Institution -->
        <div class="role-card institution anim-in anim-d4" onclick="chooseRole('institution')">
          <div class="role-icon">
            <svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg>
          </div>
          <div class="role-text">
            <div class="role-title">机构端</div>
            <div class="role-desc">一对多关怀、状态管理</div>
          </div>
          <div class="role-arrow">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
          </div>
        </div>
      </div>

      <!-- Footer hint -->
      <div class="entry-footer anim-in anim-d4">
        <p>每个端都各有侧重，之后可以在<strong>「我的」</strong>里随时切换</p>
        <div class="switch-hint">
          <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span>选择后进入对应端，之后在「我的」中切换</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================
// ROLE SELECTION & PERSISTENCE
// ============================================
const ROLE_KEY = 'hyk-role';
const ELDER_PAGE = 'huiyikang-elder-demo.html';
const FAMILY_PAGE = 'huiyikang-app-demo.html';
const INSTITUTION_PAGE = 'huiyikang-institution-demo.html';
const ROLE_NAMES = { elder: '长者端', family: '家属端', institution: '机构端' };

// 入口页始终展示三端全部卡片，每次打开 demo 都从入口开始
(function initEntry() {
  const role = localStorage.getItem(ROLE_KEY);
  showWelcomeBack(role);
})();

function showWelcomeBack(role) {
  const banner = document.getElementById('welcomeBack');
  const name = document.getElementById('currentRoleName');
  const r = role || localStorage.getItem(ROLE_KEY);
  if (r) {
    banner.classList.add('show');
    name.textContent = ROLE_NAMES[r] || '长者端';
  }
}

function chooseRole(role) {
  localStorage.setItem(ROLE_KEY, role);
  let target;
  if (role === 'elder') target = ELDER_PAGE;
  else if (role === 'institution') target = INSTITUTION_PAGE;
  else target = FAMILY_PAGE;
  // small delay for visual feedback
  const card = event.currentTarget;
  card.style.transform = 'scale(0.96)';
  setTimeout(() => {
    window.location.href = target + '?t=' + Date.now();
  }, 200);
}
</script>

</body>
</html>
