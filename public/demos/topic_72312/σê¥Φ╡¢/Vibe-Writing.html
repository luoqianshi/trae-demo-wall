<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe Writing</title>
  <meta name="author" content="Miles">
  <style>
    :root{
      --paper:#f8f4ec;
      --soft:#f5eee1;
      --ink:#1d1814;
      --muted:#6a6057;
      --line:#d7cdc2;
      --rust:#b45309;
      --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      overflow:hidden;
      color:var(--ink);
      background:var(--paper);
      font-family:var(--sans);
    }
    button,input{font:inherit;color:inherit}
    button{cursor:default}
    .app{
      height:100%;
      display:flex;
      flex-direction:column;
      padding:20px 18px 22px;
    }
    header{
      display:flex;
      align-items:center;
      gap:8px;
      padding-bottom:12px;
    }
    h1{
      flex:1;
      margin:0 8px;
      font:700 26px/1 var(--serif);
      letter-spacing:-.03em;
    }
    .icon{
      width:44px;
      height:44px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:10px;
      background:transparent;
    }
    svg{
      width:22px;
      height:22px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.75;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .workspace{
      flex:1;
      min-height:0;
      display:flex;
      justify-content:center;
    }
    .editor{
      width:min(100%,1040px);
      height:100%;
      display:flex;
      flex-direction:column;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--soft);
    }
    .title-row{
      height:48px;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .title{
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      font-size:20px;
      font-weight:650;
      padding:0 4px;
    }
    .count{font-size:12px;color:var(--muted)}
    .toolbar{
      height:50px;
      margin-top:8px;
      padding:3px 4px;
      display:flex;
      align-items:center;
      gap:2px;
      border:1px solid var(--line);
      border-radius:5px;
      background:var(--paper);
    }
    .tool{
      min-width:40px;
      height:40px;
      padding:0 12px;
      border:0;
      border-radius:7px;
      background:transparent;
      font-size:13px;
      font-weight:600;
    }
    .tool.bold{font:700 17px var(--serif)}
    .tool.italic{font:italic 17px var(--serif)}
    .page{
      flex:1;
      min-height:0;
      margin-top:8px;
      padding:23px 20px;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:5px;
      background:var(--paper);
      font:16px/1.8 var(--serif);
    }
    .page p{max-width:720px;margin:0 0 1.25em}
    .page .hint{color:var(--muted)}
    .cursor{
      display:inline-block;
      width:1px;
      height:1.15em;
      margin-left:2px;
      vertical-align:-.17em;
      background:var(--rust);
      animation:blink 1.1s steps(1) infinite;
    }
    .suggestion{
      max-width:680px;
      margin-top:26px;
      padding:13px 15px;
      border-left:2px solid var(--rust);
      color:var(--muted);
      background:rgba(180,83,9,.055);
      font-size:14px;
    }
    .suggestion small{
      display:block;
      margin-bottom:4px;
      color:var(--rust);
      font:600 11px var(--sans);
      letter-spacing:.08em;
    }
    @keyframes blink{50%{opacity:0}}
    @media(max-width:620px){
      .app{padding:12px 10px 14px}
      h1{font-size:22px}
      .icon{width:40px;height:40px}
      .editor{padding:9px}
      .toolbar{overflow:hidden}
      .tool{padding:0 10px}
      .page{padding:18px 14px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <button class="icon" aria-label="文章列表">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1>Vibe Writing</h1>
      <button class="icon" aria-label="复制">
        <svg viewBox="0 0 24 24"><path d="M5 14V6a2 2 0 0 1 2-2h8"/><rect x="7" y="8" width="12" height="12" rx="2"/></svg>
      </button>
      <button class="icon" aria-label="写作上下文">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
      </button>
      <button class="icon" aria-label="设置">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="10.5" cy="17" r="1.8"/></svg>
      </button>
    </header>

    <section class="workspace">
      <div class="editor">
        <div class="title-row">
          <input class="title" value="从一个念头，到一篇文章" readonly aria-label="文章标题">
          <span class="count">字数 128</span>
        </div>

        <div class="toolbar" aria-label="格式工具栏">
          <button class="tool" aria-label="撤销">
            <svg viewBox="0 0 24 24"><path d="M9 7 5 11l4 4M5.5 11h9a5 5 0 1 1 0 10H11"/></svg>
          </button>
          <button class="tool bold">B</button>
          <button class="tool italic">I</button>
          <button class="tool">标题</button>
          <button class="tool">列表</button>
          <button class="tool">清除</button>
          <button class="tool" aria-label="图片">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m4 17 5-5 4 4 2-2 5 5"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
          </button>
          <button class="tool" aria-label="语音">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
          </button>
        </div>

        <article class="page">
          <p>写作常常不是从一个完整的答案开始，而是从一个还没有说清楚的念头开始。</p>
          <p>你先把它写下来，让句子带着你继续往前走。那些零散的感受，会在表达的过程中慢慢找到自己的位置。<span class="cursor"></span></p>
          <div class="suggestion">
            <small>VIBE SUGGESTION</small>
            真正重要的并不是一次写对，而是让想法有机会继续生长。
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
