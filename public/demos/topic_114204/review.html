<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智途规划小程序｜产品原型展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #f8f9ff;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .phone-shell {
            width: 375px;
            height: 700px;
            background: #fff;
            border-radius: 40px;
            box-shadow: 0 8px 30px rgba(64, 158, 255, 0.2);
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        .phone-top {
            height: 30px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        .app-header {
            text-align: center;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: #409eff;
            border-bottom: 1px solid #f5f5f5;
        }
        .app-page {
            padding: 20px 10px;
            height: 520px;
            overflow-y: auto;
            display: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .app-page.active {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }
        .app-page.fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-status {
            background: linear-gradient(135deg, #409eff, #66b1ff);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .user-status:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(64, 158, 255, 0.3);
        }
        .user-status h2 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        .user-status p {
            font-size: 13px;
            opacity: 0.9;
        }
        .progress-box {
            margin-top: 15px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #fff;
            border-radius: 3px;
            transition: width 1s ease;
        }
        .func-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .func-item {
            background: #f0f5ff;
            border-radius: 12px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .func-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.2);
            border-color: #409eff;
        }
        .func-item:active {
            transform: translateY(0);
        }
        .func-item .icon {
            width: 40px;
            height: 40px;
            line-height: 40px;
            border-radius: 50%;
            background: #409eff;
            color: #fff;
            margin: 0 auto 10px;
            font-size: 20px;
            transition: transform 0.2s ease;
        }
        .func-item:hover .icon {
            transform: scale(1.1);
        }
        .func-item p {
            font-size: 14px;
            color: #333;
        }
        .task-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        .task-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .task-card:hover {
            border-color: #409eff;
            box-shadow: 0 2px 8px rgba(64, 158, 255, 0.15);
            transform: translateX(3px);
        }
        .task-card.completed {
            background: #f5f7fa;
            opacity: 0.7;
        }
        .task-card.completed h3 {
            text-decoration: line-through;
            color: #999;
        }
        .task-card h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        .task-card p {
            font-size: 12px;
            color: #999;
        }
        .task-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 2px 8px;
            background: #e8f4ff;
            color: #409eff;
            border-radius: 4px;
            font-size: 12px;
        }
        .task-checkbox {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        .task-card.completed .task-checkbox {
            background: #67c23a;
            border-color: #67c23a;
        }
        .task-card.completed .task-checkbox::after {
            content: '✓';
            display: block;
            color: #fff;
            font-size: 12px;
            text-align: center;
            line-height: 20px;
        }
        .app-footer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 50px;
            background: #fff;
            border-top: 1px solid #f5f5f5;
            border-radius: 0 0 20px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            text-align: center;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            transition: color 0.2s ease;
            padding: 5px 10px;
            border-radius: 8px;
        }
        .nav-item:hover {
            background: #f0f5ff;
        }
        .nav-item.active {
            color: #409eff;
            font-weight: bold;
        }
        .nav-item.active::before {
            content: '';
            display: block;
            width: 4px;
            height: 4px;
            background: #409eff;
            border-radius: 50%;
            margin: 0 auto 2px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            width: 320px;
            border-radius: 16px;
            padding: 20px;
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .modal-body {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-btn-group {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            background: #409eff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s ease;
        }
        .modal-btn:hover {
            background: #66b1ff;
        }
        .modal-btn-cancel {
            background: #f5f7fa;
            color: #666;
        }
        .modal-btn-cancel:hover {
            background: #e8eaec;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #409eff;
            margin-bottom: 5px;
        }
        .stat-card .label {
            font-size: 12px;
            color: #999;
        }
        .list-item {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        .list-item:hover {
            border-color: #409eff;
        }
        .list-item h4 {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        .list-item p {
            font-size: 12px;
            color: #999;
        }
        .user-info {
            text-align: center;
            padding: 20px 0;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #409eff, #66b1ff);
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #fff;
        }
        .username {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .user-level {
            font-size: 12px;
            color: #999;
        }
        .setting-item {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .setting-item:hover {
            border-color: #409eff;
            background: #f8fcff;
        }
        .setting-item span {
            font-size: 14px;
            color: #333;
        }
        .setting-item .arrow {
            font-size: 16px;
            color: #999;
        }
        .add-task-btn {
            position: absolute;
            bottom: 80px;
            right: 20px;
            transform: none;
            width: 44px;
            height: 44px;
            background: #409eff;
            color: #fff;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3);
            transition: all 0.2s ease;
            z-index: 100;
        }
        .add-task-btn:hover {
            transform: translateX(50%) scale(1.1);
            background: #66b1ff;
        }
        .add-task-modal .modal-body input {
            width: 100%;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .add-task-modal .modal-body select {
            width: 100%;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        /* 提醒设置弹窗：设置行与开关组件样式 */
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .switch-row:last-child {
            border-bottom: none;
        }
        .switch-row .switch-label {
            font-size: 14px;
            color: #333;
        }
        .switch-row .switch-time {
            font-size: 13px;
            color: #409eff;
            padding: 4px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f8fcff;
        }
        .switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #ddd;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .switch.active {
            background: #409eff;
        }
        .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }
        .switch.active::after {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <div class="phone-shell">
        <div class="phone-top">9:30</div>
        <div class="app-header">智途规划</div>

        <div class="app-page active" id="page-home">
            <div class="user-status" onclick="showEfficiencyDetail()">
                <h2>今日效率概览</h2>
                <p>今日任务完成率 <span id="completion-rate">0%</span>｜剩余<span id="remaining-count">0</span>项待完成</p>
                <div class="progress-box">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </div>

            <div class="func-list">
                <div class="func-item" onclick="showFuncDetail('智能任务拆解')">
                    <div class="icon">📋</div>
                    <p>智能任务拆解</p>
                </div>
                <div class="func-item" onclick="showFuncDetail('时间智能适配')">
                    <div class="icon">⏰</div>
                    <p>时间智能适配</p>
                </div>
                <div class="func-item" onclick="showFuncDetail('进度追踪')">
                    <div class="icon">📊</div>
                    <p>进度追踪</p>
                </div>
                <div class="func-item" onclick="showFuncDetail('数据复盘')">
                    <div class="icon">📈</div>
                    <p>数据复盘</p>
                </div>
            </div>

            <div class="task-title">
                <span>今日待办任务</span>
                <span style="font-size:12px;color:#409eff">智能排序中</span>
            </div>

            <div id="home-task-list"></div>
        </div>

        <div class="app-page" id="page-tasks">
            <div class="task-title">
                <span>任务库</span>
                <span style="font-size:12px;color:#409eff" id="library-total">共0项</span>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="library-pending">0</div>
                    <div class="label">待完成</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="library-completed">0</div>
                    <div class="label">已完成</div>
                </div>
            </div>
            <div id="library-task-list"></div>
        </div>

        <div class="app-page" id="page-review">
            <div class="task-title">
                <span>数据复盘</span>
                <span style="font-size:12px;color:#409eff">本周数据</span>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="review-rate">0%</div>
                    <div class="label">完成率</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="review-completed">0</div>
                    <div class="label">完成任务</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="review-focus">0h</div>
                    <div class="label">专注时长</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="review-streak">0天</div>
                    <div class="label">连续打卡</div>
                </div>
            </div>
            <div class="list-item">
                <h4>效率分析</h4>
                <p id="review-analysis"></p>
            </div>
            <div class="list-item">
                <h4>时间分布</h4>
                <p id="review-distribution"></p>
            </div>
            <div class="list-item">
                <h4>改进建议</h4>
                <p id="review-suggestion"></p>
            </div>
        </div>

        <div class="app-page" id="page-profile">
            <div class="user-info">
                <div class="avatar">👤</div>
                <div class="username" id="profile-username">智途用户</div>
                <div class="user-level" id="profile-level">Lv.1 规划新人</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="profile-completed">0</div>
                    <div class="label">完成任务</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="profile-join-days">0</div>
                    <div class="label">连续天数</div>
                </div>
            </div>
            <div class="setting-item" onclick="showSettingDetail('个人资料')">
                <span>个人资料</span>
                <span class="arrow">›</span>
            </div>
            <div class="setting-item" onclick="showSettingDetail('提醒设置')">
                <span>提醒设置</span>
                <span class="arrow">›</span>
            </div>
            <div class="setting-item" onclick="showSettingDetail('数据统计')">
                <span>数据统计</span>
                <span class="arrow">›</span>
            </div>
            <div class="setting-item" onclick="showSettingDetail('关于我们')">
                <span>关于我们</span>
                <span class="arrow">›</span>
            </div>
        </div>

        <div class="add-task-btn" onclick="showAddTask()">+</div>

        <div class="app-footer">
            <div class="nav-item active" onclick="switchPage('home', event)">首页</div>
            <div class="nav-item" onclick="switchPage('tasks', event)">任务库</div>
            <div class="nav-item" onclick="switchPage('review', event)">复盘</div>
            <div class="nav-item" onclick="switchPage('profile', event)">我的</div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modal-title">标题</div>
            <div class="modal-body" id="modal-body">内容</div>
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn" onclick="closeModal()">确定</button>
            </div>
        </div>
    </div>

    <div class="modal add-task-modal" id="add-task-modal">
        <div class="modal-content">
            <div class="modal-header">添加新任务</div>
            <div class="modal-body">
                <input type="text" id="new-task-name" placeholder="输入任务名称">
                <select id="new-task-type">
                    <option value="学习任务">学习任务</option>
                    <option value="工作任务">工作任务</option>
                    <option value="备考任务">备考任务</option>
                </select>
                <input type="text" id="new-task-deadline" placeholder="截止时间（如：今日 21:00）">
            </div>
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-cancel" onclick="cancelAddTask()">取消</button>
                <button class="modal-btn" onclick="addNewTask()">添加</button>
            </div>
        </div>
    </div>

    <!-- 提醒设置专用弹窗：包含可交互的开关与时间选择 -->
    <div class="modal" id="notification-modal">
        <div class="modal-content">
            <div class="modal-header">提醒设置</div>
            <div class="modal-body">
                <div class="switch-row">
                    <span class="switch-label">任务截止提醒</span>
                    <div class="switch" id="switch-deadline" onclick="toggleNotification('deadline')"></div>
                </div>
                <div class="switch-row">
                    <span class="switch-label">每日复盘提醒</span>
                    <div class="switch" id="switch-review" onclick="toggleNotification('review')"></div>
                </div>
                <div class="switch-row">
                    <span class="switch-label">提醒时间</span>
                    <select id="remind-time-select" onchange="changeRemindTime(this.value)" class="switch-time" style="padding:4px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;color:#409eff;background:#f8fcff;">
                        <option value="08:00">08:00</option>
                        <option value="12:00">12:00</option>
                        <option value="18:00">18:00</option>
                        <option value="20:00">20:00</option>
                        <option value="22:00">22:00</option>
                    </select>
                </div>
            </div>
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-cancel" onclick="closeNotificationModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
         * 数据源层：统一任务数据源，所有页面基于此渲染，避免硬编码虚拟数据
         * ============================================================ */
        var taskData = [
            { id: 1, name: '期末高数知识点梳理', deadline: '今日 21:00', type: '学习任务', priority: '高', subtasks: 3, completed: false, desc: '智能拆分3个子任务' },
            { id: 2, name: '职场项目文档校对', deadline: '明日 12:00', type: '工作任务', priority: '低', subtasks: 0, completed: false, desc: '低优先级' },
            { id: 3, name: '英语真题刷题训练', deadline: '今日 19:00', type: '备考任务', priority: '中', subtasks: 0, completed: false, desc: '中等优先级' },
            { id: 4, name: '完成项目周报', deadline: '本周六 18:00', type: '工作任务', priority: '高', subtasks: 0, completed: false, desc: '高优先级' },
            { id: 5, name: '复习线性代数', deadline: '明日 20:00', type: '学习任务', priority: '中', subtasks: 0, completed: false, desc: '中等优先级' },
            { id: 6, name: '准备面试题库', deadline: '下周一 09:00', type: '备考任务', priority: '高', subtasks: 0, completed: false, desc: '高优先级' },
            { id: 7, name: '整理会议记录', deadline: '今日 17:00', type: '工作任务', priority: '低', subtasks: 0, completed: false, desc: '低优先级' }
        ];

        /* 用户档案数据：历史性统计，非任务列表可推导项 */
        var userProfile = {
            username: '智途用户',
            joinDays: 42,
            focusHours: 12,
            streakDays: 3,
            /* 提醒设置配置：记录开关状态与提醒时间 */
            notifications: {
                deadline: true,
                review: true,
                remindTime: '20:00'
            }
        };

        /* ============================================================
         * 统计函数层：基于 taskData 实时计算各项统计指标
         * ============================================================ */
        // 获取已完成任务数
        function getCompletedCount() {
            return taskData.filter(function(t) { return t.completed; }).length;
        }
        // 获取未完成任务数
        function getPendingCount() {
            return taskData.filter(function(t) { return !t.completed; }).length;
        }
        // 获取任务总数
        function getTotalCount() {
            return taskData.length;
        }
        // 获取完成率（百分比整数）
        function getCompletionRate() {
            var total = getTotalCount();
            if (total === 0) return 0;
            return Math.round((getCompletedCount() / total) * 100);
        }
        // 按任务类型统计数量，返回 { 学习任务: n, 工作任务: n, 备试任务: n }
        function getTypeStats() {
            var stats = {};
            taskData.forEach(function(t) {
                stats[t.type] = (stats[t.type] || 0) + 1;
            });
            return stats;
        }
        // 根据已完成任务数计算用户等级
        function calcUserLevel() {
            var n = getCompletedCount();
            if (n >= 20) return 'Lv.5 高效达人';
            if (n >= 10) return 'Lv.4 效率专家';
            if (n >= 5) return 'Lv.3 规划能手';
            if (n >= 1) return 'Lv.2 初级规划';
            return 'Lv.1 规划新人';
        }

        /* ============================================================
         * 渲染函数层：基于数据源渲染各页面内容
         * ============================================================ */
        // 构建单个任务卡片的 HTML 字符串
        function buildTaskCard(task) {
            var descText = task.subtasks > 0
                ? '截止时间：' + task.deadline + '｜智能拆分' + task.subtasks + '个子任务'
                : '截止时间：' + task.deadline + '｜' + task.desc;
            return '<div class="task-card' + (task.completed ? ' completed' : '') + '" onclick="toggleTaskById(' + task.id + ')">' +
                '<h3>' + task.name + '</h3>' +
                '<p>' + descText + '</p>' +
                '<span class="task-tag">' + task.type + '</span>' +
                '<div class="task-checkbox"></div>' +
                '</div>';
        }

        // 渲染首页待办任务列表
        function renderHomeTasks() {
            document.getElementById('home-task-list').innerHTML = taskData.map(buildTaskCard).join('');
        }

        // 渲染任务库：统计数字 + 任务列表
        function renderTaskLibrary() {
            document.getElementById('library-task-list').innerHTML = taskData.map(buildTaskCard).join('');
            document.getElementById('library-total').textContent = '共' + getTotalCount() + '项';
            document.getElementById('library-pending').textContent = getPendingCount();
            document.getElementById('library-completed').textContent = getCompletedCount();
        }

        // 渲染首页顶部效率概览：完成率、剩余数、进度条
        function renderEfficiencyOverview() {
            var rate = getCompletionRate();
            document.getElementById('progress-fill').style.width = rate + '%';
            document.getElementById('completion-rate').textContent = rate + '%';
            document.getElementById('remaining-count').textContent = getPendingCount();
        }

        // 渲染复盘页面：统计卡片 + 效率分析 + 时间分布 + 改进建议
        function renderReviewStats() {
            document.getElementById('review-rate').textContent = getCompletionRate() + '%';
            document.getElementById('review-completed').textContent = getCompletedCount();
            document.getElementById('review-focus').textContent = userProfile.focusHours + 'h';
            document.getElementById('review-streak').textContent = userProfile.streakDays + '天';

            // 效率分析：基于完成率生成文案
            var rate = getCompletionRate();
            var analysisText = rate >= 80
                ? '完成率优秀，本周任务执行情况良好，请保持当前节奏'
                : rate >= 50
                    ? '完成率一般，建议加强任务时间管理，优先处理高优先级任务'
                    : '完成率偏低，建议拆分复杂任务，逐项推进避免堆积';
            document.getElementById('review-analysis').textContent = analysisText;

            // 时间分布：基于任务类型占比动态生成
            var typeStats = getTypeStats();
            var total = getTotalCount();
            var distribution = Object.keys(typeStats).map(function(t) {
                var percent = Math.round((typeStats[t] / total) * 100);
                return t.replace('任务', '') + '占比' + percent + '%';
            }).join('，');
            document.getElementById('review-distribution').textContent = distribution;

            // 改进建议：基于高优先级未完成任务数生成
            var highPending = taskData.filter(function(t) {
                return !t.completed && t.priority === '高';
            }).length;
            document.getElementById('review-suggestion').textContent = highPending > 0
                ? '当前有' + highPending + '项高优先级任务未完成，建议优先处理'
                : '当前无高优先级待办，可适当安排学习提升任务';
        }

        // 渲染我的页面：完成任务数、连续天数、用户等级
        function renderProfileStats() {
            document.getElementById('profile-completed').textContent = getCompletedCount();
            document.getElementById('profile-join-days').textContent = userProfile.joinDays;
            document.getElementById('profile-username').textContent = userProfile.username;
            document.getElementById('profile-level').textContent = calcUserLevel();
        }

        // 统一渲染所有页面（任务状态变更后调用）
        function renderAll() {
            renderEfficiencyOverview();
            renderHomeTasks();
            renderTaskLibrary();
            renderReviewStats();
            renderProfileStats();
        }

        /* ============================================================
         * 交互函数层：处理用户操作
         * ============================================================ */
        // 初始化：渲染所有页面并触发进度条动画
        function init() {
            renderAll();
            // 延时触发进度条过渡动画
            setTimeout(function() {
                document.getElementById('progress-fill').style.width = getCompletionRate() + '%';
            }, 300);
        }

        // 切换底部导航页面
        function switchPage(pageName, event) {
            document.querySelectorAll('.app-page').forEach(function(page) {
                page.classList.remove('active');
            });
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.classList.remove('active');
            });
            document.getElementById('page-' + pageName).classList.add('active');
            event.target.classList.add('active');
        }

        // 根据任务ID切换完成状态，并重新渲染所有受影响页面
        function toggleTaskById(taskId) {
            var task = taskData.find(function(t) { return t.id === taskId; });
            if (task) {
                task.completed = !task.completed;
                renderAll();
            }
        }

        // 显示功能模块详情弹窗
        function showFuncDetail(funcName) {
            var content = '';
            switch(funcName) {
                case '智能任务拆解':
                    content = '智能任务拆解功能可以将复杂任务自动拆分为多个子任务，根据任务难度和时间要求，合理分配每个子任务的完成时间，帮助您更高效地完成大型项目。';
                    break;
                case '时间智能适配':
                    content = '时间智能适配功能会根据您的日常作息习惯和任务优先级，自动推荐最佳的任务执行时间，避免时间冲突，最大化利用碎片时间。';
                    break;
                case '进度追踪':
                    content = '进度追踪功能实时记录您的任务完成情况，通过可视化图表展示每日、每周的完成进度，让您清晰了解自己的效率变化。';
                    break;
                case '数据复盘':
                    content = '数据复盘功能通过分析您的历史任务数据，生成详细的效率报告和改进建议，帮助您不断优化时间管理策略。';
                    break;
            }
            showModal(funcName, content);
        }

        // 显示效率详情弹窗（基于真实任务数据计算）
        function showEfficiencyDetail() {
            var content = '今日已完成任务：' + getCompletedCount() + '项\n' +
                '待完成任务：' + getPendingCount() + '项\n' +
                '任务总数：' + getTotalCount() + '项\n' +
                '效率评分：' + getCompletionRate() + '分';
            showModal('效率详情', content);
        }

        // 显示设置项详情：根据设置项名称分发到对应功能函数
        function showSettingDetail(settingName) {
            switch(settingName) {
                case '个人资料':
                    showProfileDetail();
                    break;
                case '提醒设置':
                    showNotificationSetting();
                    break;
                case '数据统计':
                    showDataStatistics();
                    break;
                case '关于我们':
                    showAboutUs();
                    break;
            }
        }

        // 个人资料：基于真实用户档案与任务数据展示
        function showProfileDetail() {
            var content = '用户名：' + userProfile.username + '\n' +
                '用户等级：' + calcUserLevel() + '\n' +
                '注册天数：' + userProfile.joinDays + '天\n' +
                '完成任务数：' + getCompletedCount() + '项\n' +
                '任务总数：' + getTotalCount() + '项\n' +
                '完成率：' + getCompletionRate() + '%';
            showModal('个人资料', content);
        }

        // 数据统计：基于 taskData 详细展示分类统计
        function showDataStatistics() {
            var typeStats = getTypeStats();
            var content = '任务总数：' + getTotalCount() + '项\n' +
                '已完成：' + getCompletedCount() + '项\n' +
                '待完成：' + getPendingCount() + '项\n' +
                '完成率：' + getCompletionRate() + '%\n' +
                '———\n' +
                '学习任务：' + (typeStats['学习任务'] || 0) + '项\n' +
                '工作任务：' + (typeStats['工作任务'] || 0) + '项\n' +
                '备考任务：' + (typeStats['备考任务'] || 0) + '项';
            showModal('数据统计', content);
        }

        // 关于我们：展示应用版本与简介
        function showAboutUs() {
            var content = '智途规划 v1.0.0\n' +
                '———\n' +
                '一款轻量化、智能化的学习工作规划工具\n' +
                '支持任务智能拆分、时间适配、进度追踪和数据复盘\n' +
                '———\n' +
                '团队：智途开发组';
            showModal('关于我们', content);
        }

        // 提醒设置：打开可交互弹窗，同步当前开关状态与提醒时间
        function showNotificationSetting() {
            document.getElementById('switch-deadline').classList.toggle('active', userProfile.notifications.deadline);
            document.getElementById('switch-review').classList.toggle('active', userProfile.notifications.review);
            document.getElementById('remind-time-select').value = userProfile.notifications.remindTime;
            document.getElementById('notification-modal').classList.add('active');
        }

        // 切换提醒开关状态（任务截止/每日复盘）
        function toggleNotification(key) {
            userProfile.notifications[key] = !userProfile.notifications[key];
            document.getElementById('switch-' + key).classList.toggle('active', userProfile.notifications[key]);
        }

        // 修改提醒时间
        function changeRemindTime(time) {
            userProfile.notifications.remindTime = time;
        }

        // 关闭提醒设置弹窗
        function closeNotificationModal() {
            document.getElementById('notification-modal').classList.remove('active');
        }

        // 显示通用弹窗
        function showModal(title, body) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = body;
            document.getElementById('modal').classList.add('active');
        }

        // 关闭所有弹窗
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('add-task-modal').classList.remove('active');
        }

        // 取消添加任务：清空输入并关闭弹窗
        function cancelAddTask() {
            document.getElementById('new-task-name').value = '';
            document.getElementById('new-task-deadline').value = '';
            closeModal();
        }

        // 显示添加任务弹窗
        function showAddTask() {
            document.getElementById('add-task-modal').classList.add('active');
        }

        // 添加新任务：写入数据源并重新渲染所有页面
        function addNewTask() {
            var name = document.getElementById('new-task-name').value;
            var type = document.getElementById('new-task-type').value;
            var deadline = document.getElementById('new-task-deadline').value;

            if (!name) {
                showModal('提示', '请输入任务名称');
                return;
            }

            // 生成新任务对象，加入统一数据源
            var newId = taskData.length > 0 ? taskData[taskData.length - 1].id + 1 : 1;
            taskData.push({
                id: newId,
                name: name,
                deadline: deadline || '待定',
                type: type,
                priority: '中',
                subtasks: 0,
                completed: false,
                desc: '中等优先级'
            });

            // 清空输入并关闭弹窗
            document.getElementById('new-task-name').value = '';
            document.getElementById('new-task-deadline').value = '';
            closeModal();

            // 重新渲染所有页面
            renderAll();
        }

        init();
    </script>
</body>
</html>
