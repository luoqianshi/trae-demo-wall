<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻诗阁 Demo - AI识图</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&family=Long+Cang&display=swap" rel="stylesheet">
  <style>
    .ai-vision-hero {
      background: linear-gradient(135deg, rgba(255,255,255,.7) 0%, rgba(250,248,240,.5) 100%);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-xl);
      padding: 48px 32px;
      border: 1px solid rgba(255,255,255,.7);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      text-align: center;
      margin-bottom: 32px;
    }

    .ai-vision-hero::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(76,175,127,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .ai-vision-hero::after {
      content: "";
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212,175,90,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .ai-vision-title {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 36px;
      color: var(--text-ink);
      letter-spacing: 6px;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .ai-vision-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .upload-area {
      max-width: 500px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .upload-box {
      border: 2px dashed rgba(76,175,127,.3);
      border-radius: var(--radius-lg);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255,255,255,.5);
    }

    .upload-box:hover {
      border-color: var(--accent-bamboo);
      background: rgba(76,175,127,.05);
      transform: translateY(-2px);
    }

    .upload-box.dragover {
      border-color: var(--accent-bamboo);
      background: rgba(76,175,127,.1);
    }

    .upload-icon {
      margin-bottom: 16px;
      color: var(--accent-bamboo);
    }

    .upload-text {
      font-size: 16px;
      color: var(--text-ink);
      font-family: "ZCOOL XiaoWei", serif;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .upload-hint {
      font-size: 13px;
      color: var(--text-muted);
    }

    .upload-input {
      display: none;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }

    .section-head::before {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-bamboo), transparent);
    }

    .section-title {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 24px;
      color: var(--text-ink);
      letter-spacing: 2px;
    }

    .section-sub {
      font-size: 14px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
    }

    .sample-images {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .sample-image-card {
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      box-shadow: var(--shadow-card);
      aspect-ratio: 4/3;
    }

    .sample-image-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,.12);
    }

    .sample-image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sample-image-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 12px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,.6));
      color: #fff;
      font-size: 13px;
      font-family: "ZCOOL XiaoWei", serif;
      text-align: center;
      letter-spacing: 1px;
    }

    .sample-image-title {
      font-size: 15px;
      margin-bottom: 4px;
      font-family: "Ma Shan Zheng", cursive;
      letter-spacing: 2px;
    }

    .sample-image-author {
      font-size: 12px;
      opacity: .8;
    }

    .result-section {
      display: none;
    }

    .result-section.show {
      display: block;
    }

    .result-card {
      background: linear-gradient(135deg, rgba(255,255,255,.8) 0%, rgba(250,248,240,.6) 100%);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-xl);
      padding: 32px;
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-bamboo), var(--accent-cyan));
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .result-match {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(76,175,127,.1);
      border-radius: 100px;
      color: var(--accent-bamboo);
      font-size: 14px;
      font-family: "ZCOOL XiaoWei", serif;
    }

    .result-match-value {
      font-weight: 600;
      font-size: 18px;
      font-family: "Ma Shan Zheng", cursive;
    }

    .result-poem-title {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 32px;
      color: var(--text-ink);
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }

    .result-poem-author {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .result-poem-content {
      text-align: center;
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 18px;
      line-height: 2.2;
      color: var(--text-ink);
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    .result-poem-content p {
      margin: 0;
    }

    .result-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .result-btn {
      padding: 10px 24px;
      border-radius: 100px;
      font-size: 14px;
      font-family: "ZCOOL XiaoWei", serif;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      letter-spacing: 1px;
    }

    .result-btn-primary {
      background: linear-gradient(135deg, var(--accent-bamboo) 0%, #4a9d70 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(76,175,127,.25);
    }

    .result-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(76,175,127,.35);
    }

    .result-btn-secondary {
      background: rgba(255,255,255,.8);
      color: var(--text-ink);
      border: 1px solid var(--border-soft);
    }

    .result-btn-secondary:hover {
      background: #fff;
      border-color: var(--accent-bamboo);
    }

    .loading-section {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }

    .loading-section.show {
      display: block;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(76,175,127,.1);
      border-top-color: var(--accent-bamboo);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 16px;
      color: var(--text-ink);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .loading-subtext {
      font-size: 13px;
      color: var(--text-muted);
    }

    .preview-image {
      max-width: 300px;
      max-height: 200px;
      margin: 0 auto 16px;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .preview-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 768px) {
      .sample-images {
        grid-template-columns: repeat(2, 1fr);
      }

      .ai-vision-title {
        font-size: 28px;
      }

      .result-poem-title {
        font-size: 26px;
      }

      .result-poem-content {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="page-container active" id="page-ai-vision">
    <div id="nav-placeholder"></div>

    <div class="content-wrap">
      <section class="ai-vision-hero reveal">
        <h1 class="ai-vision-title">AI识图 · 看图猜诗</h1>
        <p class="ai-vision-subtitle">画意诗情，一拍即合</p>
        <div class="upload-area">
          <div class="upload-box" id="upload-box">
            <div class="upload-icon">
              <svg class="svg-icon svg-icon-lg" style="width:48px;height:48px;"><use xlink:href="svg/icons.svg#icon-image"/></svg>
            </div>
            <div class="upload-text">点击或拖拽图片到此处</div>
            <div class="upload-hint">支持 JPG、PNG 格式，或选择下方示例图片</div>
            <input type="file" class="upload-input" id="upload-input" accept="image/*">
          </div>
        </div>
      </section>

      <section class="reveal">
        <div class="section-head">
          <h2 class="section-title">示例图片</h2>
          <span class="section-sub">点击图片体验识别</span>
        </div>
        <div class="sample-images" id="sample-images"></div>
      </section>

      <section class="loading-section reveal" id="loading-section">
        <div class="preview-image" id="loading-preview"></div>
        <div class="loading-spinner"></div>
        <div class="loading-text">正在分析图片意境...</div>
        <div class="loading-subtext">AI 正在为您寻找最匹配的诗词</div>
      </section>

      <section class="result-section reveal" id="result-section">
        <div class="section-head">
          <h2 class="section-title">识别结果</h2>
          <span class="section-sub">为您找到最匹配的诗词</span>
        </div>
        <div class="result-card" id="result-card">
        </div>
      </section>
    </div>
  </div>

  <script src="js/demo-data.js"></script>
  <script src="js/demo-utils.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/bg-decor.js"></script>
  <script>
    (function () {
      var samplePoemIds = [1, 2, 3, 4];

      function renderSampleImages() {
        var container = document.getElementById('sample-images');
        if (!container) return;

        var html = '';
        samplePoemIds.forEach(function (id) {
          var poem = DemoApp.getPoemById(id);
          if (!poem) return;
          html += '<div class="sample-image-card" data-id="' + poem.id + '">';
          html += '  <img src="' + poem.image + '" alt="' + poem.title + '">';
          html += '  <div class="sample-image-overlay">';
          html += '    <div class="sample-image-title">' + poem.title + '</div>';
          html += '    <div class="sample-image-author">' + (poem.dynasty ? '[' + poem.dynasty + '] ' : '') + poem.author + '</div>';
          html += '  </div>';
          html += '</div>';
        });
        container.innerHTML = html;

        container.querySelectorAll('.sample-image-card').forEach(function (card) {
          card.addEventListener('click', function () {
            var id = parseInt(card.getAttribute('data-id'));
            var poem = DemoApp.getPoemById(id);
            if (poem) {
              startRecognition(poem.image, poem);
            }
          });
        });
      }

      function startRecognition(imageSrc, targetPoem) {
        var loadingSection = document.getElementById('loading-section');
        var resultSection = document.getElementById('result-section');
        var preview = document.getElementById('loading-preview');

        resultSection.classList.remove('show');
        loadingSection.classList.add('show');
        preview.innerHTML = '<img src="' + imageSrc + '" alt="预览图">';

        loadingSection.scrollIntoView({ behavior: 'smooth', block: 'center' });

        setTimeout(function () {
          showResult(targetPoem);
        }, 1500);
      }

      function showResult(poem) {
        var loadingSection = document.getElementById('loading-section');
        var resultSection = document.getElementById('result-section');
        var resultCard = document.getElementById('result-card');

        var matchPercent = Math.floor(Math.random() * 15) + 85;

        var contentHtml = '';
        if (poem.content && poem.content.length > 0) {
          poem.content.forEach(function (line) {
            contentHtml += '<p>' + line + '</p>';
          });
        }

        var html = '';
        html += '<div class="result-header">';
        html += '  <div class="result-match">';
        html += '    <svg class="svg-icon" style="width:18px;height:18px;"><use xlink:href="svg/icons.svg#icon-target"/></svg>';
        html += '    <span>匹配度</span>';
        html += '    <span class="result-match-value">' + matchPercent + '%</span>';
        html += '  </div>';
        html += '</div>';
        html += '<div class="result-poem-title">' + poem.title + '</div>';
        html += '<div class="result-poem-author">' + (poem.dynasty ? '[' + poem.dynasty + '] ' : '') + poem.author + '</div>';
        html += '<div class="result-poem-content">' + contentHtml + '</div>';
        html += '<div class="result-footer">';
        html += '  <button class="result-btn result-btn-primary" onclick="location.href=\'poem.html?id=' + poem.id + '\'">';
        html += '    查看详情';
        html += '    <svg class="svg-icon" style="width:16px;height:16px;vertical-align:middle;margin-left:4px;"><use xlink:href="svg/icons.svg#icon-arrow-right"/></svg>';
        html += '  </button>';
        html += '  <button class="result-btn result-btn-secondary" onclick="resetRecognition()">重新识别</button>';
        html += '</div>';

        resultCard.innerHTML = html;

        loadingSection.classList.remove('show');
        resultSection.classList.add('show');
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function resetRecognition() {
        var resultSection = document.getElementById('result-section');
        resultSection.classList.remove('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function initUpload() {
        var uploadBox = document.getElementById('upload-box');
        var uploadInput = document.getElementById('upload-input');

        uploadBox.addEventListener('click', function () {
          uploadInput.click();
        });

        uploadInput.addEventListener('change', function (e) {
          var file = e.target.files[0];
          if (file && file.type.startsWith('image/')) {
            var reader = new FileReader();
            reader.onload = function (event) {
              var randomPoem = DemoApp.getRandomPoem(true);
              startRecognition(event.target.result, randomPoem);
            };
            reader.readAsDataURL(file);
          }
        });

        uploadBox.addEventListener('dragover', function (e) {
          e.preventDefault();
          uploadBox.classList.add('dragover');
        });

        uploadBox.addEventListener('dragleave', function (e) {
          e.preventDefault();
          uploadBox.classList.remove('dragover');
        });

        uploadBox.addEventListener('drop', function (e) {
          e.preventDefault();
          uploadBox.classList.remove('dragover');
          var file = e.dataTransfer.files[0];
          if (file && file.type.startsWith('image/')) {
            var reader = new FileReader();
            reader.onload = function (event) {
              var randomPoem = DemoApp.getRandomPoem(true);
              startRecognition(event.target.result, randomPoem);
            };
            reader.readAsDataURL(file);
          }
        });
      }

      function initReveal() {
        var reveals = document.querySelectorAll('.reveal');
        if (!('IntersectionObserver' in window)) {
          reveals.forEach(function (el) { el.classList.add('in'); });
          return;
        }
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });
        reveals.forEach(function (el) { observer.observe(el); });
      }

      window.resetRecognition = resetRecognition;

      function init() {
        DemoApp.initNav('ai-vision');
        renderSampleImages();
        initUpload();
        initReveal();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
