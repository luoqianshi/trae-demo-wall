<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻诗阁 Demo - 诗人</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&family=Long+Cang&display=swap" rel="stylesheet">
  <style>
    .poet-page-wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-title {
      font-size: 42px;
      font-weight: 700;
      color: var(--text-ink);
      font-family: "Ma Shan Zheng", cursive;
      letter-spacing: 12px;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 4px;
    }

    .poet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .poet-card-item {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(20px);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .poet-card-item::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(185,153,82,.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .poet-card-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(185,153,82,.25);
    }

    .poet-card-item:hover::before {
      transform: scale(1.2);
    }

    .poet-card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .poet-avatar-large {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4a84b, #b8860b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(185,153,82,.3);
      font-family: "Ma Shan Zheng", cursive;
      font-size: 28px;
    }

    .poet-card-info {
      flex: 1;
      min-width: 0;
    }

    .poet-card-name {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-ink);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .poet-card-dynasty {
      font-size: 13px;
      color: var(--text-muted);
      font-family: "Noto Serif SC", serif;
    }

    .poet-card-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 14px;
      border-top: 1px solid var(--border-soft);
      font-size: 14px;
      color: var(--text-ink-light);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
    }

    .poet-card-stats .count-num {
      color: var(--accent-gold);
      font-weight: 600;
      font-size: 18px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border-soft);
      border-radius: 100px;
      font-size: 14px;
      color: var(--text-ink-light);
      cursor: pointer;
      transition: all 0.2s;
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
    }

    .back-btn:hover {
      background: rgba(58,138,157,0.08);
      border-color: rgba(58,138,157,0.2);
      color: var(--accent-cyan);
      transform: translateX(-2px);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
    }

    .breadcrumb a {
      color: var(--accent-cyan);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .breadcrumb a:hover {
      color: var(--accent-cyan-dark);
    }

    .breadcrumb .sep {
      color: var(--accent-mist);
    }

    .breadcrumb .current {
      color: var(--text-ink-light);
    }

    .poet-detail-hero {
      background: linear-gradient(135deg, rgba(255,248,235,0.9) 0%, rgba(248,240,220,0.8) 100%);
      border-radius: var(--radius-xl);
      padding: 40px 48px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(185,153,82,.2);
      position: relative;
      overflow: hidden;
    }

    .poet-detail-hero::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(185,153,82,.12) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .poet-detail-hero::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: -60px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(58,138,157,.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .poet-hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .poet-avatar-xl {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4a84b, #b8860b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(185,153,82,.35);
      font-family: "Ma Shan Zheng", cursive;
      font-size: 44px;
    }

    .poet-hero-info {
      flex: 1;
      min-width: 0;
    }

    .poet-hero-name {
      font-size: 48px;
      font-weight: 700;
      color: var(--text-ink);
      font-family: "Ma Shan Zheng", cursive;
      letter-spacing: 8px;
      margin-bottom: 8px;
    }

    .poet-hero-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .poet-hero-dynasty {
      font-size: 16px;
      color: var(--accent-gold);
      padding: 4px 14px;
      background: rgba(185,153,82,.12);
      border-radius: 100px;
      border: 1px solid rgba(185,153,82,.2);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
    }

    .poet-hero-count {
      font-size: 15px;
      color: var(--text-ink-light);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .poet-hero-count .num {
      color: var(--accent-cyan);
      font-weight: 600;
      font-size: 20px;
    }

    .poet-detail-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 36px 40px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .poet-detail-card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(185,153,82,.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .detail-section {
      position: relative;
      z-index: 1;
    }

    .detail-section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }

    .detail-section-title::before {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-gold), transparent);
    }

    .detail-section-title .title-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: var(--accent-gold);
    }

    .detail-section-title .title-text {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-ink);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 3px;
    }

    .poet-bio-text {
      font-size: 15px;
      line-height: 2.2;
      color: var(--text-ink-light);
      font-family: "Noto Serif SC", serif;
      text-align: justify;
      text-indent: 2em;
    }

    .poems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .poem-mini-card {
      background: linear-gradient(135deg, rgba(245,235,220,.4) 0%, rgba(238,230,216,.25) 100%);
      border-radius: 16px;
      padding: 20px 22px;
      border: 1px solid rgba(185,153,82,.15);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .poem-mini-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, var(--accent-gold), var(--accent-cyan));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .poem-mini-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card);
      border-color: rgba(185,153,82,.3);
    }

    .poem-mini-card:hover::before {
      opacity: 1;
    }

    .poem-mini-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-ink);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .poem-mini-excerpt {
      font-size: 13px;
      line-height: 1.8;
      color: var(--text-ink-light);
      font-family: "Noto Serif SC", serif;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state .empty-text {
      font-size: 16px;
      letter-spacing: 2px;
    }

    @media (max-width: 768px) {
      .page-title {
        font-size: 32px;
        letter-spacing: 8px;
      }

      .poet-grid {
        grid-template-columns: 1fr;
      }

      .poet-detail-hero {
        padding: 28px 24px;
      }

      .poet-hero-content {
        flex-direction: column;
        text-align: center;
        gap: 20px;
      }

      .poet-hero-name {
        font-size: 36px;
        letter-spacing: 6px;
      }

      .poet-hero-meta {
        justify-content: center;
      }

      .poet-detail-card {
        padding: 24px 20px;
      }

      .poems-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-container active" id="page-poet">
    <div id="nav-placeholder"></div>

    <div class="content-wrap">
      <div class="poet-page-wrap">
        <div id="poet-list-view">
          <div class="page-header reveal">
            <h1 class="page-title">名家荟萃</h1>
            <p class="page-subtitle">千古风流人物，诗词瑰宝共赏</p>
          </div>
          <div class="poet-grid" id="poet-grid"></div>
        </div>

        <div id="poet-detail-view" style="display:none;">
          <div class="back-btn" onclick="goBackToList()">
            <svg class="svg-icon svg-icon-sm" style="width:16px;height:16px;"><use xlink:href="svg/icons.svg#icon-back"/></svg>
            <span>返回诗人列表</span>
          </div>

          <div class="breadcrumb">
            <a href="poet.html">诗人</a>
            <span class="sep">/</span>
            <span class="current" id="breadcrumb-poet-name"></span>
          </div>

          <div class="poet-detail-hero reveal">
            <div class="poet-hero-content">
              <div class="poet-avatar-xl" id="detail-avatar"></div>
              <div class="poet-hero-info">
                <h1 class="poet-hero-name" id="detail-name"></h1>
                <div class="poet-hero-meta">
                  <span class="poet-hero-dynasty" id="detail-dynasty"></span>
                  <span class="poet-hero-count">
                    <svg class="svg-icon" style="width:16px;height:16px;color:var(--accent-cyan);"><use xlink:href="svg/icons.svg#icon-book-open"/></svg>
                    共 <span class="num" id="detail-count">0</span> 首诗词
                  </span>
                </div>
              </div>
            </div>
          </div>

          <div class="poet-detail-card reveal">
            <div class="detail-section">
              <div class="detail-section-title">
                <span class="title-icon">
                  <svg class="svg-icon" style="width:22px;height:22px;"><use xlink:href="svg/icons.svg#icon-user"/></svg>
                </span>
                <span class="title-text">诗人简介</span>
              </div>
              <p class="poet-bio-text" id="detail-bio"></p>
            </div>
          </div>

          <div class="poet-detail-card reveal">
            <div class="detail-section">
              <div class="detail-section-title">
                <span class="title-icon">
                  <svg class="svg-icon" style="width:22px;height:22px;"><use xlink:href="svg/icons.svg#icon-star"/></svg>
                </span>
                <span class="title-text">代表作品</span>
              </div>
              <div class="poems-grid" id="poems-grid"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/demo-data.js"></script>
  <script src="js/demo-utils.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/bg-decor.js"></script>
  <script>
    (function () {
      function getQueryParam(name) {
        var search = window.location.search.substring(1);
        var params = search.split('&');
        for (var i = 0; i < params.length; i++) {
          var pair = params[i].split('=');
          if (decodeURIComponent(pair[0]) === name) {
            return decodeURIComponent(pair[1] || '');
          }
        }
        return null;
      }

      function renderPoetList() {
        var poets = DemoApp.getPoets();
        var grid = document.getElementById('poet-grid');
        if (!grid) return;

        if (poets.length === 0) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">📜</div><div class="empty-text">暂无诗人数据</div></div>';
          return;
        }

        var html = '';
        poets.forEach(function (poet) {
          html += '<div class="poet-card-item reveal" onclick="goToPoetDetail(\'' + encodeURIComponent(poet.name) + '\')">';
          html += '  <div class="poet-card-header">';
          html += '    <div class="poet-avatar-large">' + poet.name.charAt(0) + '</div>';
          html += '    <div class="poet-card-info">';
          html += '      <div class="poet-card-name">' + poet.name + '</div>';
          html += '      <div class="poet-card-dynasty">' + (poet.dynasty ? poet.dynasty + '代诗人' : '') + '</div>';
          html += '    </div>';
          html += '  </div>';
          html += '  <div class="poet-card-stats">';
          html += '    <svg class="svg-icon" style="width:16px;height:16px;color:var(--accent-gold);"><use xlink:href="svg/icons.svg#icon-book-open"/></svg>';
          html += '    收录诗词 <span class="count-num">' + poet.count + '</span> 首';
          html += '  </div>';
          html += '</div>';
        });
        grid.innerHTML = html;
        initReveal();
      }

      function getPoetBio(poetName, poems) {
        if (poems && poems.length > 0 && poems[0].poetBiography) {
          return poems[0].poetBiography;
        }
        var bios = {
          '李白': '李白（701年－762年），字太白，号青莲居士，唐代伟大的浪漫主义诗人，被后人誉为"诗仙"。他的诗歌风格豪放飘逸，想象力丰富，语言流转自然，音律和谐多变。其诗以抒情为主，表现出蔑视权贵的傲岸精神，对人民疾苦表示同情，又善于描绘自然景色，表达对祖国山河的热爱。',
          '杜甫': '杜甫（712年－770年），字子美，自号少陵野老，唐代伟大的现实主义诗人，被后人誉为"诗圣"。他的诗歌风格沉郁顿挫，多反映社会现实和人民疾苦，被称为"诗史"。杜甫忧国忧民，人格高尚，诗艺精湛，在中国古典诗歌中备受推崇，影响深远。',
          '苏轼': '苏轼（1037年－1101年），字子瞻，号东坡居士，北宋著名文学家、书画家，"唐宋八大家"之一。他的诗词风格豪放洒脱，意境开阔，与辛弃疾并称"苏辛"。苏轼在诗、词、散文、书、画等方面都取得了很高的成就，是中国文学艺术史上罕见的全才。',
          '王维': '王维（701年－761年），字摩诘，号摩诘居士，唐代著名诗人、画家，与孟浩然并称为"王孟"。他的诗歌风格清新淡雅，意境深远，多描写山水田园风光。王维精通诗、书、画、音乐等，其诗融诗情画意于一体，有"诗佛"之称。',
          '李清照': '李清照（1084年－约1155年），号易安居士，宋代著名女词人，婉约派代表人物。她的词作风格清新婉约，情感真挚细腻，前期多写闺情，后期多抒发身世之悲。李清照在词坛中独树一帜，形成了独特的"易安体"，被誉为"千古第一才女"。',
          '辛弃疾': '辛弃疾（1140年－1207年），字幼安，号稼轩，南宋著名词人，豪放派代表人物，与苏轼并称"苏辛"。他的词作风格豪放雄浑，多抒发爱国情怀和壮志未酬的感慨。辛弃疾一生以恢复为志，以功业自许，却命运多舛、壮志难酬。',
          '曹操': '曹操（155年－220年），字孟德，东汉末年著名政治家、军事家、文学家。他的诗歌风格慷慨悲凉，多抒发政治抱负和人生感慨。曹操是建安文学的开创者和代表人物，与子曹丕、曹植合称"三曹"，其诗气魄雄伟、情感深沉。',
          '孟浩然': '孟浩然（689年－740年），字浩然，号孟山人，唐代著名的山水田园派诗人，与王维并称为"王孟"。他的诗歌风格清淡自然，意境深远，多描写山水田园风光和隐居生活。孟浩然是唐代第一个大量写山水诗的诗人，对后世影响深远。',
          '王之涣': '王之涣（688年－742年），字季凌，唐代著名诗人。他的诗歌风格豪放洒脱，多描写边塞风光和自然景观，意境开阔，气势磅礴。王之涣的诗现存仅六首，但首首都是精品，其中《登鹳雀楼》《凉州词》更是千古绝唱。',
          '柳宗元': '柳宗元（773年－819年），字子厚，唐代著名文学家、思想家，"唐宋八大家"之一。他的诗歌风格清峭峻拔，多抒发愤懑之情。柳宗元与韩愈共同倡导唐代古文运动，并称"韩柳"，其诗文俱佳，成就卓著。',
          '王翰': '王翰（687年－726年），字子羽，唐代著名诗人。他的诗歌风格豪放洒脱，多描写边塞风光和军旅生活，气势磅礴。王翰的《凉州词》被誉为唐代边塞诗的杰作，"醉卧沙场君莫笑，古来征战几人回"成为千古名句。',
          '张继': '张继（约715年－约779年），字懿孙，唐代诗人。他的诗歌风格清远，多描写自然景物和羁旅情怀。张继的《枫桥夜泊》是其最著名的作品，诗中描绘的江南水乡夜景和羁旅愁思，千百年来打动了无数读者。',
          '孟郊': '孟郊（751年－814年），字东野，唐代著名诗人。他的诗歌风格清寒瘦硬，多描写贫苦生活和亲情友情。孟郊与贾岛齐名，有"郊寒岛瘦"之称。其《游子吟》一诗，以朴素的语言表达了深沉的母爱，成为千古传诵的名篇。',
          '李绅': '李绅（772年－846年），字公垂，唐代诗人。他的诗歌多反映社会现实和民生疾苦。李绅是新乐府运动的参与者，其《悯农》二首，以浅显的语言表达了对农民的深切同情和对粮食的珍惜，千百年来广为传诵。',
          '王昌龄': '王昌龄（698年－757年），字少伯，唐代著名边塞诗人。他的诗歌风格雄浑悲壮，多描写边塞风光和军旅生活。王昌龄以七绝见长，被誉为"七绝圣手"，其《出塞》一诗被誉为唐人七绝的压卷之作。'
        };
        return bios[poetName] || (poetName + '，中国古代著名诗人，其诗词作品流传千古，为后世所传颂。');
      }

      function renderPoetDetail(name) {
        var poems = DemoApp.getPoemsByAuthor(name);
        if (poems.length === 0) {
          return;
        }

        var poets = DemoApp.getPoets();
        var poetInfo = poets.find(function (p) { return p.name === name; });
        var dynasty = poetInfo ? poetInfo.dynasty : '';
        var count = poetInfo ? poetInfo.count : poems.length;

        document.title = name + ' - 轻诗阁 Demo';

        var avatarEl = document.getElementById('detail-avatar');
        if (avatarEl) avatarEl.textContent = name.charAt(0);

        var nameEl = document.getElementById('detail-name');
        if (nameEl) nameEl.textContent = name;

        var dynastyEl = document.getElementById('detail-dynasty');
        if (dynastyEl) dynastyEl.textContent = dynasty ? dynasty + '代诗人' : '';

        var countEl = document.getElementById('detail-count');
        if (countEl) countEl.textContent = count;

        var breadcrumbName = document.getElementById('breadcrumb-poet-name');
        if (breadcrumbName) breadcrumbName.textContent = name;

        var bioEl = document.getElementById('detail-bio');
        if (bioEl) bioEl.textContent = getPoetBio(name, poems);

        var poemsGrid = document.getElementById('poems-grid');
        if (poemsGrid) {
          var poemsHtml = '';
          poems.forEach(function (poem) {
            var excerpt = '';
            if (poem.content && poem.content.length > 0) {
              excerpt = poem.content.slice(0, 2).join('');
            }
            poemsHtml += '<div class="poem-mini-card" onclick="location.href=\'poem.html?id=' + poem.id + '\'">';
            poemsHtml += '  <div class="poem-mini-title">' + poem.title + '</div>';
            poemsHtml += '  <div class="poem-mini-excerpt">' + excerpt + '</div>';
            poemsHtml += '</div>';
          });
          poemsGrid.innerHTML = poemsHtml;
        }

        document.getElementById('poet-list-view').style.display = 'none';
        document.getElementById('poet-detail-view').style.display = 'block';
        initReveal();
      }

      function goToPoetDetail(name) {
        window.location.href = 'poet.html?name=' + encodeURIComponent(name);
      }

      function goBackToList() {
        window.location.href = 'poet.html';
      }

      function initReveal() {
        var reveals = document.querySelectorAll('.reveal');
        if (!('IntersectionObserver' in window)) {
          reveals.forEach(function (el) { el.classList.add('in'); });
          return;
        }
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });
        reveals.forEach(function (el) { observer.observe(el); });
      }

      window.goToPoetDetail = goToPoetDetail;
      window.goBackToList = goBackToList;

      function init() {
        DemoApp.initNav('poet');

        var name = getQueryParam('name');
        if (name) {
          renderPoetDetail(name);
        } else {
          renderPoetList();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
