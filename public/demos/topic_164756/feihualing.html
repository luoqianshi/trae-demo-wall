<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞花令 - 轻诗阁</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&family=Long+Cang&display=swap" rel="stylesheet">
  <style>
    .feihualing-wrap {
      max-width: 720px;
      margin: 0 auto;
    }

    .start-screen {
      text-align: center;
      padding: 40px 20px;
      animation: fadeInUp 0.6s ease;
    }

    .game-title {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 56px;
      color: var(--accent-cyan);
      letter-spacing: 12px;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(58,138,157,.15);
    }

    .game-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 3px;
      margin-bottom: 36px;
    }

    .keyword-section {
      margin-bottom: 32px;
    }

    .keyword-label {
      font-size: 16px;
      color: var(--text-ink-light);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .keyword-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .keyword-btn {
      padding: 14px 32px;
      background: var(--bg-card);
      border: 2px solid var(--border-soft);
      border-radius: 100px;
      font-size: 20px;
      font-family: "Ma Shan Zheng", cursive;
      color: var(--text-ink);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 4px;
      position: relative;
      overflow: hidden;
    }

    .keyword-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(58,138,157,.08), transparent);
      transition: left 0.5s ease;
    }

    .keyword-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(58,138,157,.15);
    }

    .keyword-btn:hover::before {
      left: 100%;
    }

    .keyword-btn.selected {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-cyan-dark) 100%);
      color: #fff;
      border-color: var(--accent-cyan);
      box-shadow: 0 4px 16px rgba(58,138,157,.3);
    }

    .start-btn {
      margin-top: 20px;
      padding: 16px 48px;
      font-size: 18px;
    }

    .game-screen {
      display: none;
      animation: fadeInUp 0.5s ease;
    }

    .game-screen.active {
      display: block;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
    }

    .game-keyword {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .keyword-badge {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-cyan-dark) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Ma Shan Zheng", cursive;
      font-size: 24px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(58,138,157,.3);
      animation: pulse 2s ease-in-out infinite;
    }

    .keyword-text {
      font-size: 14px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
    }

    .keyword-text strong {
      display: block;
      font-size: 18px;
      color: var(--text-ink);
      font-family: "Ma Shan Zheng", cursive;
      letter-spacing: 2px;
      margin-top: 2px;
    }

    .game-stats {
      display: flex;
      gap: 20px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-item .stat-num {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-cyan);
      font-family: "Ma Shan Zheng", cursive;
    }

    .stat-item .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
    }

    .game-prompt {
      text-align: center;
      padding: 32px 24px;
      background: linear-gradient(135deg, rgba(250,248,240,.95) 0%, rgba(245,238,224,.9) 100%);
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      border: 1px solid rgba(185,153,82,.15);
      position: relative;
      overflow: hidden;
    }

    .game-prompt::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(58,138,157,.08) 0%, transparent 70%);
      border-radius: 50%;
    }

    .game-prompt::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(200,160,80,.06) 0%, transparent 70%);
      border-radius: 50%;
    }

    .prompt-text {
      font-size: 22px;
      color: var(--text-ink);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }

    .prompt-text .highlight {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 32px;
      color: var(--accent-cyan);
      margin: 0 6px;
    }

    .input-area {
      margin-bottom: 20px;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
    }

    .poem-input {
      flex: 1;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-md);
      font-size: 16px;
      color: var(--text-ink);
      font-family: "Noto Serif SC", serif;
      transition: all 0.3s ease;
      outline: none;
    }

    .poem-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(58,138,157,.1);
      background: #fff;
    }

    .submit-btn {
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-cyan-dark) 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(58,138,157,.2);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(58,138,157,.3);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .feedback {
      padding: 12px 20px;
      border-radius: var(--radius-md);
      margin-top: 12px;
      font-size: 14px;
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .feedback.show {
      display: block;
    }

    .feedback.success {
      background: rgba(90,138,106,.1);
      border: 1px solid rgba(90,138,106,.3);
      color: var(--accent-bamboo);
    }

    .feedback.error {
      background: rgba(200,160,160,.1);
      border: 1px solid rgba(200,160,160,.3);
      color: var(--accent-lotus-dark);
    }

    .dialogue-section {
      margin-bottom: 20px;
    }

    .dialogue-title {
      font-size: 16px;
      color: var(--text-ink-light);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-soft);
    }

    .dialogue-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 360px;
      overflow-y: auto;
      padding: 4px;
    }

    .dialogue-item {
      display: flex;
      gap: 12px;
      animation: fadeInUp 0.4s ease;
    }

    .dialogue-item.user {
      flex-direction: row-reverse;
    }

    .dialogue-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .dialogue-item.user .dialogue-avatar {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-cyan-dark) 100%);
      color: #fff;
    }

    .dialogue-item.ai .dialogue-avatar {
      background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
      color: #fff;
    }

    .dialogue-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      position: relative;
      line-height: 1.7;
    }

    .dialogue-item.user .dialogue-bubble {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-cyan-dark) 100%);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .dialogue-item.ai .dialogue-bubble {
      background: var(--bg-card);
      color: var(--text-ink);
      border: 1px solid var(--border-card);
      border-bottom-left-radius: 4px;
    }

    .dialogue-content {
      font-size: 16px;
      font-family: "Noto Serif SC", serif;
      letter-spacing: 1px;
    }

    .dialogue-meta {
      font-size: 12px;
      margin-top: 6px;
      opacity: 0.8;
      font-family: "ZCOOL XiaoWei", serif;
    }

    .dialogue-item.user .dialogue-meta {
      text-align: right;
      opacity: 0.7;
    }

    .game-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .action-btn {
      padding: 12px 24px;
      background: rgba(138,120,100,.06);
      color: var(--text-ink-light);
      border: 1px solid var(--border-soft);
      border-radius: 100px;
      font-size: 14px;
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      background: rgba(58,138,157,.08);
      border-color: rgba(58,138,157,.2);
      color: var(--accent-cyan);
    }

    .end-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
      animation: fadeInUp 0.6s ease;
    }

    .end-screen.active {
      display: block;
    }

    .end-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounce 1s ease;
      box-shadow: 0 8px 24px rgba(200,160,80,.3);
    }

    .end-icon svg {
      width: 40px;
      height: 40px;
      color: #fff;
    }

    .end-title {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 36px;
      color: var(--text-ink);
      letter-spacing: 6px;
      margin-bottom: 8px;
    }

    .end-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }

    .end-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 32px;
    }

    .end-stat {
      text-align: center;
    }

    .end-stat .num {
      font-size: 42px;
      font-weight: 700;
      color: var(--accent-cyan);
      font-family: "Ma Shan Zheng", cursive;
    }

    .end-stat .label {
      font-size: 13px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .shake {
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    @media (max-width: 640px) {
      .game-title {
        font-size: 40px;
        letter-spacing: 8px;
      }

      .input-wrapper {
        flex-direction: column;
      }

      .submit-btn {
        width: 100%;
      }

      .game-header {
        flex-direction: column;
        gap: 16px;
      }

      .end-stats {
        gap: 24px;
      }

      .end-stat .num {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="page-container active" id="page-feihualing">
    <div id="nav-placeholder"></div>

    <div class="cloud">
      <div class="cloud-3"></div>
    </div>
    <div class="bamboo-decoration"></div>
    <div class="mountain">
      <div class="mountain-3"></div>
    </div>
    <div class="particles-container" id="particles-container"></div>
    <div class="page-corner-decoration top-left"></div>
    <div class="page-corner-decoration bottom-right"></div>

    <div class="content-wrap">
      <div class="feihualing-wrap">

        <div class="start-screen" id="start-screen">
          <h1 class="game-title">飞花令</h1>
          <p class="game-subtitle">以诗会友 · 妙语连珠</p>

          <div class="keyword-section">
            <div class="keyword-label">请选择关键字</div>
            <div class="keyword-grid" id="keyword-grid"></div>
          </div>

          <button class="btn-primary start-btn" id="start-btn" disabled onclick="startGame()">
            <svg class="svg-icon" style="width:20px;height:20px;"><use xlink:href="svg/icons.svg#icon-game"/></svg>
            开始游戏
          </button>
        </div>

        <div class="game-screen" id="game-screen">
          <div class="game-header">
            <div class="game-keyword">
              <div class="keyword-badge" id="keyword-badge">月</div>
              <div class="keyword-text">
                当前关键字
                <strong id="current-keyword">月</strong>
              </div>
            </div>
            <div class="game-stats">
              <div class="stat-item">
                <div class="stat-num" id="round-num">1</div>
                <div class="stat-label">回合</div>
              </div>
              <div class="stat-item">
                <div class="stat-num" id="score-num">0</div>
                <div class="stat-label">得分</div>
              </div>
            </div>
          </div>

          <div class="game-prompt">
            <div class="prompt-text">
              请说出带<span class="highlight" id="prompt-keyword">月</span>字的诗句
            </div>
          </div>

          <div class="input-area">
            <div class="input-wrapper">
              <input type="text" class="poem-input" id="poem-input" placeholder="在此输入诗句..." onkeydown="handleInputKeydown(event)">
              <button class="submit-btn" onclick="submitAnswer()">
                <svg class="svg-icon" style="width:18px;height:18px;"><use xlink:href="svg/icons.svg#icon-arrow-right"/></svg>
                提交
              </button>
            </div>
            <div class="feedback" id="feedback"></div>
          </div>

          <div class="dialogue-section">
            <div class="dialogue-title">
              <svg class="svg-icon" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;color:var(--accent-cyan);"><use xlink:href="svg/icons.svg#icon-chat"/></svg>
              历史对话
            </div>
            <div class="dialogue-list" id="dialogue-list"></div>
          </div>

          <div class="game-actions">
            <button class="action-btn" onclick="showHint()">
              <svg class="svg-icon" style="width:16px;height:16px;"><use xlink:href="svg/icons.svg#icon-lightbulb"/></svg>
              提示
            </button>
            <button class="action-btn" onclick="endGame()">
              <svg class="svg-icon" style="width:16px;height:16px;"><use xlink:href="svg/icons.svg#icon-exit"/></svg>
              结束游戏
            </button>
          </div>
        </div>

        <div class="end-screen" id="end-screen">
          <div class="end-icon">
            <svg class="svg-icon"><use xlink:href="svg/icons.svg#icon-trophy"/></svg>
          </div>
          <h2 class="end-title">游戏结束</h2>
          <p class="end-subtitle">以诗会友，不亦乐乎</p>

          <div class="end-stats">
            <div class="end-stat">
              <div class="num" id="final-score">0</div>
              <div class="label">总得分</div>
            </div>
            <div class="end-stat">
              <div class="num" id="final-rounds">0</div>
              <div class="label">总回合</div>
            </div>
          </div>

          <div class="game-actions">
            <button class="btn-primary" onclick="restartGame()">
              <svg class="svg-icon" style="width:18px;height:18px;"><use xlink:href="svg/icons.svg#icon-refresh"/></svg>
              再玩一局
            </button>
            <button class="action-btn" onclick="backToStart()">
              <svg class="svg-icon" style="width:16px;height:16px;"><use xlink:href="svg/icons.svg#icon-home"/></svg>
              返回首页
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/demo-data.js"></script>
  <script src="js/demo-utils.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/bg-decor.js"></script>
  <script>
    (function () {
      let selectedKeyword = null;
      let currentKeyword = null;
      let score = 0;
      let round = 1;
      let usedPoems = new Set();
      let poemList = [];

      function initKeywords() {
        const keywords = DemoApp.getFeihualingKeywords();
        const grid = document.getElementById('keyword-grid');
        if (!grid) return;

        var html = '';
        keywords.forEach(function (kw) {
          html += '<button class="keyword-btn" onclick="selectKeyword(\'' + kw + '\')">' + kw + '</button>';
        });
        grid.innerHTML = html;
      }

      window.selectKeyword = function (keyword) {
        selectedKeyword = keyword;
        const buttons = document.querySelectorAll('.keyword-btn');
        buttons.forEach(function (btn) {
          if (btn.textContent === keyword) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
          startBtn.disabled = false;
        }
      };

      window.startGame = function () {
        if (!selectedKeyword) return;

        currentKeyword = selectedKeyword;
        score = 0;
        round = 1;
        usedPoems = new Set();
        poemList = DemoApp.getFeihualingByKeyword(currentKeyword);

        document.getElementById('keyword-badge').textContent = currentKeyword;
        document.getElementById('current-keyword').textContent = currentKeyword;
        document.getElementById('prompt-keyword').textContent = currentKeyword;
        document.getElementById('round-num').textContent = round;
        document.getElementById('score-num').textContent = score;
        document.getElementById('dialogue-list').innerHTML = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').textContent = '';
        document.getElementById('poem-input').value = '';

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('end-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');

        setTimeout(function () {
          const input = document.getElementById('poem-input');
          if (input) input.focus();
        }, 300);
      };

      window.handleInputKeydown = function (event) {
        if (event.key === 'Enter') {
          submitAnswer();
        }
      };

      function normalizeText(text) {
        if (!text) return '';
        return text.replace(/[，。！？、；：,.!?;:\s]/g, '').trim();
      }

      window.submitAnswer = function () {
        const input = document.getElementById('poem-input');
        const feedback = document.getElementById('feedback');
        const userInput = input.value.trim();

        if (!userInput) {
          showFeedback('请输入诗句', 'error');
          shakeInput();
          return;
        }

        if (!userInput.includes(currentKeyword)) {
          showFeedback('诗句中没有包含「' + currentKeyword + '」字，请重试', 'error');
          shakeInput();
          return;
        }

        const normalizedInput = normalizeText(userInput);

        let matchedPoem = null;
        for (let i = 0; i < poemList.length; i++) {
          const poem = poemList[i];
          const normalizedPoem = normalizeText(poem.content);
          if (normalizedPoem.includes(normalizedInput) || normalizedInput.includes(normalizedPoem)) {
            matchedPoem = poem;
            break;
          }
        }

        if (!matchedPoem) {
          showFeedback('未找到该诗句，请确认后重试', 'error');
          shakeInput();
          return;
        }

        const poemKey = matchedPoem.id;
        if (usedPoems.has(poemKey)) {
          showFeedback('这句诗已经用过了，换一句吧', 'error');
          shakeInput();
          return;
        }

        usedPoems.add(poemKey);
        score++;
        round++;

        document.getElementById('score-num').textContent = score;
        document.getElementById('round-num').textContent = round;

        addDialogueItem('user', userInput);
        showFeedback('答对了！+1分', 'success');

        input.value = '';
        input.disabled = true;

        setTimeout(function () {
          aiRespond();
        }, 800);
      };

      function aiRespond() {
        const availablePoems = poemList.filter(function (p) {
          return !usedPoems.has(p.id);
        });

        if (availablePoems.length === 0) {
          showFeedback('太棒了！你已经答完了所有诗句！', 'success');
          setTimeout(function () {
            endGame();
          }, 1500);
          return;
        }

        const randomIdx = Math.floor(Math.random() * availablePoems.length);
        const aiPoem = availablePoems[randomIdx];
        usedPoems.add(aiPoem.id);

        addDialogueItem('ai', aiPoem.content, aiPoem);

        const input = document.getElementById('poem-input');
        input.disabled = false;
        input.focus();
      }

      function addDialogueItem(type, content, poemData) {
        const list = document.getElementById('dialogue-list');
        const item = document.createElement('div');
        item.className = 'dialogue-item ' + type;

        let avatarIcon = '';
        if (type === 'user') {
          avatarIcon = '<svg class="svg-icon" style="width:20px;height:20px;"><use xlink:href="svg/icons.svg#icon-user"/></svg>';
        } else {
          avatarIcon = '<svg class="svg-icon" style="width:20px;height:20px;"><use xlink:href="svg/icons.svg#icon-book-open"/></svg>';
        }

        let meta = '';
        if (poemData) {
          meta = '<div class="dialogue-meta">—— [' + poemData.dynasty + '] ' + poemData.author + '《' + poemData.source + '》</div>';
        }

        item.innerHTML =
          '<div class="dialogue-avatar">' + avatarIcon + '</div>' +
          '<div class="dialogue-bubble">' +
          '  <div class="dialogue-content">' + content + '</div>' +
          meta +
          '</div>';

        list.appendChild(item);
        list.scrollTop = list.scrollHeight;
      }

      function showFeedback(message, type) {
        const feedback = document.getElementById('feedback');
        feedback.textContent = message;
        feedback.className = 'feedback show ' + type;

        setTimeout(function () {
          feedback.classList.remove('show');
        }, 2500);
      }

      function shakeInput() {
        const input = document.getElementById('poem-input');
        input.classList.add('shake');
        setTimeout(function () {
          input.classList.remove('shake');
        }, 500);
      }

      window.showHint = function () {
        const availablePoems = poemList.filter(function (p) {
          return !usedPoems.has(p.id);
        });

        if (availablePoems.length === 0) {
          showFeedback('没有更多提示了', 'error');
          return;
        }

        const hintPoem = availablePoems[Math.floor(Math.random() * availablePoems.length)];
        const content = hintPoem.content;
        const hint = content.substring(0, Math.ceil(content.length / 3)) + '...';

        showFeedback('提示：' + hint, 'success');
      };

      window.endGame = function () {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('final-score').textContent = score;
        document.getElementById('final-rounds').textContent = round - 1;
        document.getElementById('end-screen').classList.add('active');
      };

      window.restartGame = function () {
        startGame();
      };

      window.backToStart = function () {
        document.getElementById('end-screen').classList.remove('active');
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('start-screen').style.display = 'block';
        selectedKeyword = null;
        const buttons = document.querySelectorAll('.keyword-btn');
        buttons.forEach(function (btn) {
          btn.classList.remove('selected');
        });
        document.getElementById('start-btn').disabled = true;
      };

      function init() {
        DemoApp.initNav('feihualing');
        initKeywords();

        if (window.ParticleSystem) {
          ParticleSystem.init({
            container: 'particles-container',
            type: 'petal',
            count: 15,
            speed: 0.5
          });
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
