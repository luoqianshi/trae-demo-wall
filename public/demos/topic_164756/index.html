<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻诗阁 Demo - 学诗</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&family=Long+Cang&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-container active" id="page-index">
    <div id="nav-placeholder"></div>

    <div class="content-wrap">
      <section class="hero-banner reveal">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-checkin">
          <div class="hero-poem-card" id="hero-poem-card">
            <div class="corner-tl"></div>
            <div class="corner-br"></div>
            <span class="quote-mark open">"</span>
            <span class="quote-mark close">"</span>
            <div class="poem-seal">诗</div>
            <div class="poem-content">
              <div class="poem-line" id="hero-poem-line"></div>
              <span class="poem-info" id="hero-poem-info"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="section-block reveal">
        <div class="section-head">
          <h2 class="section-title">功能入口</h2>
          <span class="section-sub">开启诗意之旅</span>
        </div>
        <div class="hero-actions">
          <div class="function-card learn-card" onclick="location.href='index.html'">
            <div class="card-icon-large">
              <svg class="svg-icon svg-icon-lg" style="width:40px;height:40px;color:var(--accent-cyan)"><use xlink:href="svg/icons.svg#icon-book-open"/></svg>
            </div>
            <div class="card-info">
              <div class="card-title">开始学习</div>
              <div class="card-number">每日一首，日积月累</div>
            </div>
          </div>
          <div class="function-card" onclick="location.href='feihualing.html'" style="border-left: 4px solid var(--accent-lotus);">
            <div class="card-icon-large">
              <svg class="svg-icon svg-icon-lg" style="width:40px;height:40px;color:var(--accent-lotus)"><use xlink:href="svg/icons.svg#icon-game"/></svg>
            </div>
            <div class="card-info">
              <div class="card-title">飞花令</div>
              <div class="card-number">诗词对战，以诗会友</div>
            </div>
          </div>
          <div class="function-card" onclick="location.href='ai-vision.html'" style="border-left: 4px solid var(--accent-bamboo);">
            <div class="card-icon-large">
              <svg class="svg-icon svg-icon-lg" style="width:40px;height:40px;color:var(--accent-bamboo)"><use xlink:href="svg/icons.svg#icon-image"/></svg>
            </div>
            <div class="card-info">
              <div class="card-title">AI识图</div>
              <div class="card-number">看图识诗，画意诗情</div>
            </div>
          </div>
          <div class="function-card" onclick="location.href='poet.html'" style="border-left: 4px solid var(--accent-gold);">
            <div class="card-icon-large">
              <svg class="svg-icon svg-icon-lg" style="width:40px;height:40px;color:var(--accent-gold)"><use xlink:href="svg/icons.svg#icon-users"/></svg>
            </div>
            <div class="card-info">
              <div class="card-title">搜索诗人</div>
              <div class="card-number">名家荟萃，佳作共赏</div>
            </div>
          </div>
        </div>
      </section>

      <section class="section-block reveal">
        <div class="section-head">
          <h2 class="section-title">诗词库</h2>
          <span class="section-sub">千古名篇，品味经典</span>
        </div>
        <div class="poem-library" id="poem-library"></div>
      </section>

      <section class="section-block reveal">
        <div class="section-head">
          <h2 class="section-title">诗人大全</h2>
          <span class="section-sub">名家风采，流芳百世</span>
        </div>
        <div class="stats-dashboard" id="poet-list"></div>
      </section>
    </div>
  </div>

  <script src="js/demo-data.js"></script>
  <script src="js/demo-utils.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/bg-decor.js"></script>
  <script>
    (function () {
      function randomHeroImage() {
        const poems = window.DEMO_POEMS || [];
        const withImages = poems.filter(function (p) { return p.image && p.image.startsWith('images/'); });
        if (withImages.length === 0) return '';
        const idx = Math.floor(Math.random() * withImages.length);
        return withImages[idx].image;
      }

      function renderHeroPoem() {
        const poem = DemoApp.getRandomPoem(true);
        if (!poem) return;

        const bgEl = document.getElementById('hero-bg');
        if (bgEl && poem.image) {
          bgEl.style.backgroundImage = "url('" + poem.image + "')";
        }

        const lineEl = document.getElementById('hero-poem-line');
        const infoEl = document.getElementById('hero-poem-info');
        if (lineEl && poem.content && poem.content.length > 0) {
          lineEl.textContent = poem.content[0].replace(/[，。！？、；：]/g, '');
        }
        if (infoEl) {
          infoEl.textContent = '—— ' + (poem.dynasty ? '[' + poem.dynasty + ']' : '') + poem.author + '《' + poem.title + '》';
        }

        const card = document.getElementById('hero-poem-card');
        if (card) {
          card.onclick = function () {
            window.location.href = 'poem.html?id=' + poem.id;
          };
          card.style.cursor = 'pointer';
        }
      }

      function renderPoemLibrary() {
        const container = document.getElementById('poem-library');
        if (!container) return;

        const poems = DemoApp.getRandomPoems(12, true);
        var html = '';
        poems.forEach(function (poem) {
          var excerpt = '';
          if (poem.content && poem.content.length > 0) {
            excerpt = poem.content.slice(0, 2).join('');
          }
          html += '<div class="poem-card" onclick="location.href=\'poem.html?id=' + poem.id + '\'">';
          html += '  <div class="poem-cover" style="background-image:url(\'' + poem.image + '\');background-size:cover;background-position:center;"></div>';
          html += '  <div class="poem-body">';
          html += '    <div class="poem-name">' + poem.title + '</div>';
          html += '    <div class="poem-meta">' + (poem.dynasty ? '[' + poem.dynasty + '] ' : '') + poem.author + '</div>';
          html += '    <div class="poem-excerpt">' + excerpt + '</div>';
          html += '    <div class="poem-tags">';
          if (poem.scenes && poem.scenes.length > 0) {
            poem.scenes.slice(0, 2).forEach(function (s) {
              html += '<span class="poem-tag">' + s + '</span>';
            });
          }
          html += '    </div>';
          html += '  </div>';
          html += '</div>';
        });
        container.innerHTML = html;
      }

      function renderPoetList() {
        const container = document.getElementById('poet-list');
        if (!container) return;

        const poets = DemoApp.getPoets().slice(0, 5);
        var html = '';
        poets.forEach(function (poet) {
          html += '<div class="stat-panel" onclick="location.href=\'poet.html?name=' + encodeURIComponent(poet.name) + '\'" style="cursor:pointer;">';
          html += '  <div class="stat-emoji">';
          html += '    <svg class="svg-icon" style="width:28px;height:28px;color:var(--accent-cyan)"><use xlink:href="svg/icons.svg#icon-user"/></svg>';
          html += '  </div>';
          html += '  <div class="stat-detail">';
          html += '    <div class="stat-num">' + poet.name + '</div>';
          html += '    <div class="stat-name">' + (poet.dynasty ? poet.dynasty + '代 · ' : '') + poet.count + ' 首诗词</div>';
          html += '  </div>';
          html += '</div>';
        });
        container.innerHTML = html;
      }

      function initReveal() {
        var reveals = document.querySelectorAll('.reveal');
        if (!('IntersectionObserver' in window)) {
          reveals.forEach(function (el) { el.classList.add('in'); });
          return;
        }
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });
        reveals.forEach(function (el) { observer.observe(el); });
      }

      function init() {
        DemoApp.initNav('index');
        renderHeroPoem();
        renderPoemLibrary();
        renderPoetList();
        initReveal();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
