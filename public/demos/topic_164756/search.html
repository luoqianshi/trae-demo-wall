<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻诗阁 Demo - 搜索</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&family=Long+Cang&display=swap" rel="stylesheet">
  <style>
    .search-page-hero {
      background: linear-gradient(135deg, rgba(255,255,255,.7) 0%, rgba(250,248,240,.5) 100%);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-xl);
      padding: 48px 32px;
      border: 1px solid rgba(255,255,255,.7);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      text-align: center;
      margin-bottom: 32px;
    }

    .search-page-hero::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(42,157,179,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .search-page-hero::after {
      content: "";
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212,175,90,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .search-page-title {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 36px;
      color: var(--text-ink);
      letter-spacing: 6px;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .search-page-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .search-page-input-wrap {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .search-page-input {
      width: 100%;
      padding: 16px 56px 16px 24px;
      font-size: 16px;
      font-family: "ZCOOL XiaoWei", serif;
      border: 2px solid rgba(90,85,80,.12);
      border-radius: 100px;
      background: rgba(255,255,255,.9);
      color: var(--text-ink);
      outline: none;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .search-page-input:focus {
      border-color: rgba(58,138,157,.4);
      box-shadow: 0 0 0 4px rgba(58,138,157,.08);
      background: #fff;
    }

    .search-page-input::placeholder {
      color: var(--text-muted);
    }

    .search-page-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-cyan-dark) 100%);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(58,138,157,.25);
    }

    .search-page-btn:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 6px 16px rgba(58,138,157,.35);
    }

    .search-page-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .search-result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }

    .search-result-header::before {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-cyan), transparent);
    }

    .search-result-title {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 24px;
      color: var(--text-ink);
      letter-spacing: 2px;
    }

    .search-result-count {
      font-size: 14px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
    }

    .search-result-count .keyword {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .search-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .search-empty-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.4;
      color: var(--text-muted);
    }

    .search-empty-text {
      font-size: 16px;
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .search-empty-hint {
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .search-hot-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }

    .search-hot-tag {
      padding: 6px 16px;
      background: rgba(58,138,157,.06);
      color: var(--accent-cyan);
      border-radius: 100px;
      font-size: 13px;
      font-family: "ZCOOL XiaoWei", serif;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(58,138,157,.1);
    }

    .search-hot-tag:hover {
      background: rgba(58,138,157,.12);
      border-color: rgba(58,138,157,.25);
      transform: translateY(-1px);
    }

    .search-hot-label {
      font-size: 13px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
      margin-bottom: 8px;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="page-container active" id="page-search">
    <div id="nav-placeholder"></div>

    <div class="content-wrap">
      <section class="search-page-hero reveal">
        <h1 class="search-page-title">诗词搜索</h1>
        <p class="search-page-subtitle">千古名篇，随心寻觅</p>
        <div class="search-page-input-wrap">
          <input type="text" class="search-page-input" id="search-input" placeholder="输入标题、作者或诗句关键词...">
          <button class="search-page-btn" id="search-btn">
            <svg class="svg-icon svg-icon-md" style="width:20px;height:20px;"><use xlink:href="svg/icons.svg#icon-search"/></svg>
          </button>
        </div>
        <div class="search-hot-label">热门搜索</div>
        <div class="search-hot-tags" id="hot-tags">
        </div>
      </section>

      <section class="reveal">
        <div class="search-result-header">
          <h2 class="search-result-title">搜索结果</h2>
          <span class="search-result-count" id="result-count"></span>
        </div>
        <div class="poem-library" id="search-results"></div>
      </section>
    </div>
  </div>

  <script src="js/demo-data.js"></script>
  <script src="js/demo-utils.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/bg-decor.js"></script>
  <script>
    (function () {
      var hotKeywords = ['李白', '杜甫', '月', '春', '山水', '思乡', '苏轼', '李清照'];

      function getUrlParam(name) {
        var params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      function renderPoemCard(poem) {
        var excerpt = '';
        if (poem.content && poem.content.length > 0) {
          excerpt = poem.content.slice(0, 2).join('');
        }
        var html = '';
        html += '<div class="poem-card" onclick="location.href=\'poem.html?id=' + poem.id + '\'">';
        html += '  <div class="poem-cover" style="background-image:url(\'' + (poem.image || 'images/hero/poem_1.jpg') + '\');background-size:cover;background-position:center;"></div>';
        html += '  <div class="poem-body">';
        html += '    <div class="poem-name">' + poem.title + '</div>';
        html += '    <div class="poem-meta">' + (poem.dynasty ? '[' + poem.dynasty + '] ' : '') + poem.author + '</div>';
        html += '    <div class="poem-excerpt">' + excerpt + '</div>';
        html += '    <div class="poem-tags">';
        if (poem.scenes && poem.scenes.length > 0) {
          poem.scenes.slice(0, 2).forEach(function (s) {
            html += '<span class="poem-tag">' + s + '</span>';
          });
        }
        html += '    </div>';
        html += '  </div>';
        html += '</div>';
        return html;
      }

      function renderResults(keyword) {
        var results = DemoApp.searchPoems(keyword);
        var container = document.getElementById('search-results');
        var countEl = document.getElementById('result-count');

        if (keyword && keyword.trim()) {
          countEl.innerHTML = '找到 <span class="keyword">' + results.length + '</span> 首与「' + keyword + '」相关的诗词';
        } else {
          countEl.textContent = '共 ' + results.length + ' 首诗词';
        }

        if (results.length === 0) {
          container.innerHTML =
            '<div class="search-empty">' +
            '  <svg class="search-empty-icon"><use xlink:href="svg/icons.svg#icon-search"/></svg>' +
            '  <div class="search-empty-text">未找到相关诗词</div>' +
            '  <div class="search-empty-hint">试试换个关键词搜索吧</div>' +
            '</div>';
          return;
        }

        var html = '';
        results.forEach(function (poem) {
          html += renderPoemCard(poem);
        });
        container.innerHTML = html;
      }

      function doSearch() {
        var input = document.getElementById('search-input');
        var keyword = input.value.trim();
        if (keyword) {
          var newUrl = window.location.pathname + '?q=' + encodeURIComponent(keyword);
          history.pushState({ q: keyword }, '', newUrl);
        }
        renderResults(keyword);
      }

      function renderHotTags() {
        var container = document.getElementById('hot-tags');
        var html = '';
        hotKeywords.forEach(function (kw) {
          html += '<span class="search-hot-tag" data-kw="' + kw + '">' + kw + '</span>';
        });
        container.innerHTML = html;

        container.querySelectorAll('.search-hot-tag').forEach(function (tag) {
          tag.addEventListener('click', function () {
            var kw = tag.getAttribute('data-kw');
            document.getElementById('search-input').value = kw;
            doSearch();
          });
        });
      }

      function initReveal() {
        var reveals = document.querySelectorAll('.reveal');
        if (!('IntersectionObserver' in window)) {
          reveals.forEach(function (el) { el.classList.add('in'); });
          return;
        }
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });
        reveals.forEach(function (el) { observer.observe(el); });
      }

      function init() {
        DemoApp.initNav('search');
        renderHotTags();

        var q = getUrlParam('q');
        if (q) {
          document.getElementById('search-input').value = q;
        }
        renderResults(q);

        document.getElementById('search-btn').addEventListener('click', doSearch);
        document.getElementById('search-input').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            doSearch();
          }
        });

        window.addEventListener('popstate', function (e) {
          var q = e.state ? e.state.q : getUrlParam('q');
          if (q) {
            document.getElementById('search-input').value = q;
          } else {
            document.getElementById('search-input').value = '';
          }
          renderResults(q);
        });

        initReveal();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
