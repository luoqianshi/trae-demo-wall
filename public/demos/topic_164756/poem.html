<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻诗阁 Demo - 诗词详情</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&family=Long+Cang&display=swap" rel="stylesheet">
  <style>
    .poem-detail-wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .poem-hero {
      position: relative;
      width: 100%;
      height: 360px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 32px;
      box-shadow: var(--shadow-cloud);
    }

    .poem-hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.6s ease;
    }

    .poem-hero:hover .poem-hero-bg {
      transform: scale(1.03);
    }

    .poem-hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(42,40,37,0.15) 0%, rgba(42,40,37,0.35) 50%, rgba(42,40,37,0.7) 100%);
    }

    .poem-hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 48px;
      z-index: 2;
    }

    .poem-hero-title {
      font-size: 44px;
      font-weight: 700;
      color: #fff;
      font-family: "Ma Shan Zheng", cursive;
      letter-spacing: 8px;
      margin-bottom: 12px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    .poem-hero-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .poem-hero-author {
      font-size: 20px;
      color: rgba(255,255,255,0.9);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 3px;
    }

    .poem-hero-dynasty {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      padding: 4px 12px;
      background: rgba(255,255,255,0.15);
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.2);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--text-muted);
      font-family: "ZCOOL XiaoWei", serif;
    }

    .breadcrumb a {
      color: var(--accent-cyan);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .breadcrumb a:hover {
      color: var(--accent-cyan-dark);
    }

    .breadcrumb .sep {
      color: var(--accent-mist);
    }

    .breadcrumb .current {
      color: var(--text-ink-light);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border-soft);
      border-radius: 100px;
      font-size: 14px;
      color: var(--text-ink-light);
      cursor: pointer;
      transition: all 0.2s;
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
    }

    .back-btn:hover {
      background: rgba(58,138,157,0.08);
      border-color: rgba(58,138,157,0.2);
      color: var(--accent-cyan);
      transform: translateX(-2px);
    }

    .poem-detail-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 40px 48px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .poem-detail-card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(185,153,82,.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .poem-detail-card::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -40px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(58,138,157,.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .detail-section {
      position: relative;
      z-index: 1;
      margin-bottom: 32px;
    }

    .detail-section:last-child {
      margin-bottom: 0;
    }

    .detail-section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }

    .detail-section-title::before {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-cyan), transparent);
    }

    .detail-section-title .title-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: var(--accent-cyan);
    }

    .detail-section-title .title-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-ink);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 2px;
    }

    .poem-content-area {
      background: linear-gradient(135deg, rgba(245,235,220,.5) 0%, rgba(238,230,216,.3) 100%);
      border-radius: 16px;
      padding: 36px 32px;
      text-align: center;
      border-left: 3px solid rgba(185,153,82,.5);
      position: relative;
    }

    .poem-content-area::before,
    .poem-content-area::after {
      content: '"';
      position: absolute;
      font-family: "Ma Shan Zheng", cursive;
      font-size: 60px;
      color: var(--accent-cyan);
      opacity: 0.1;
      line-height: 1;
    }

    .poem-content-area::before {
      top: 12px;
      left: 20px;
    }

    .poem-content-area::after {
      bottom: 0px;
      right: 20px;
      transform: rotate(180deg);
    }

    .poem-content-line {
      display: block;
      font-size: 24px;
      line-height: 2.2;
      color: var(--text-ink);
      font-family: "Noto Serif SC", serif;
      letter-spacing: 4px;
    }

    .poem-translation-area {
      padding: 4px 0;
    }

    .poem-translation-line {
      display: block;
      font-size: 15px;
      line-height: 2;
      color: var(--text-ink-light);
      font-family: "Noto Serif SC", serif;
    }

    .poem-interpretation {
      font-size: 15px;
      line-height: 2;
      color: var(--text-ink-light);
      font-family: "Noto Serif SC", serif;
      text-align: justify;
      text-indent: 2em;
    }

    .poet-card {
      background: linear-gradient(135deg, rgba(255,248,235,0.8) 0%, rgba(248,240,220,0.7) 100%);
      border-radius: 16px;
      border: 1px solid rgba(185,153,82,.2);
      overflow: hidden;
      position: relative;
    }

    .poet-card::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(185,153,82,.12) 0%, transparent 70%);
      border-radius: 50%;
    }

    .poet-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px 16px;
      border-bottom: 1px solid rgba(185,153,82,.12);
      position: relative;
      z-index: 1;
    }

    .poet-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4a84b, #b8860b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(185,153,82,.3);
      font-family: "Ma Shan Zheng", cursive;
      font-size: 20px;
    }

    .poet-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .poet-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-ink);
      font-family: 'ZCOOL XiaoWei', serif;
      letter-spacing: 2px;
    }

    .poet-dynasty {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'Noto Serif SC', serif;
    }

    .poet-bio {
      padding: 16px 24px 20px;
      font-size: 14px;
      line-height: 2;
      color: var(--text-ink-light);
      font-family: 'Noto Serif SC', serif;
      text-align: justify;
      position: relative;
      z-index: 1;
    }

    .scenes-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .scene-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: linear-gradient(135deg, rgba(58,138,157,0.08), rgba(58,138,157,0.04));
      border: 1px solid rgba(58,138,157,0.15);
      border-radius: 100px;
      font-size: 14px;
      color: var(--accent-cyan);
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .scene-tag:hover {
      background: rgba(58,138,157,0.12);
      transform: translateY(-1px);
    }

    .scene-tag .scene-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poem-nav-buttons {
      display: flex;
      gap: 16px;
      margin-top: 32px;
    }

    .nav-btn {
      flex: 1;
      padding: 16px 20px;
      border-radius: 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      font-family: "ZCOOL XiaoWei", serif;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--border-soft);
      background: rgba(255,255,255,0.8);
      color: var(--text-ink-light);
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    .nav-btn.prev-btn:hover {
      border-color: rgba(58,138,157,0.3);
      color: var(--accent-cyan);
      background: rgba(58,138,157,0.05);
    }

    .nav-btn.random-btn {
      background: linear-gradient(135deg, var(--accent-gold) 0%, #b8860b 100%);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(200,160,80,0.25);
    }

    .nav-btn.random-btn:hover {
      box-shadow: 0 8px 24px rgba(200,160,80,0.35);
    }

    .nav-btn.next-btn:hover {
      border-color: rgba(58,138,157,0.3);
      color: var(--accent-cyan);
      background: rgba(58,138,157,0.05);
    }

    .nav-btn .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .poem-hero {
        height: 280px;
        border-radius: var(--radius-lg);
      }

      .poem-hero-content {
        padding: 24px 28px;
      }

      .poem-hero-title {
        font-size: 32px;
        letter-spacing: 4px;
      }

      .poem-hero-author {
        font-size: 16px;
      }

      .poem-detail-card {
        padding: 24px 20px;
      }

      .poem-content-area {
        padding: 24px 16px;
      }

      .poem-content-line {
        font-size: 20px;
        letter-spacing: 2px;
      }

      .poem-nav-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page-container active" id="page-poem">
    <div id="nav-placeholder"></div>

    <div class="content-wrap">
      <div class="poem-detail-wrap">
        <div class="back-btn" onclick="history.length > 1 ? history.back() : location.href='index.html'">
          <svg class="svg-icon svg-icon-sm" style="width:16px;height:16px;"><use xlink:href="svg/icons.svg#icon-back"/></svg>
          <span>返回</span>
        </div>

        <div class="breadcrumb">
          <a href="index.html">首页</a>
          <span class="sep">/</span>
          <span class="current" id="breadcrumb-title">诗词详情</span>
        </div>

        <div class="poem-hero" id="poem-hero">
          <div class="poem-hero-bg" id="poem-hero-bg"></div>
          <div class="poem-hero-overlay"></div>
          <div class="poem-hero-content">
            <h1 class="poem-hero-title" id="poem-hero-title"></h1>
            <div class="poem-hero-meta">
              <span class="poem-hero-dynasty" id="poem-hero-dynasty"></span>
              <span class="poem-hero-author" id="poem-hero-author"></span>
            </div>
          </div>
        </div>

        <div class="poem-detail-card">
          <div class="detail-section">
            <div class="detail-section-title">
              <span class="title-icon">
                <svg class="svg-icon" style="width:20px;height:20px;"><use xlink:href="svg/icons.svg#icon-book-open"/></svg>
              </span>
              <span class="title-text">诗词原文</span>
            </div>
            <div class="poem-content-area" id="poem-content-area"></div>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">
              <span class="title-icon">
                <svg class="svg-icon" style="width:20px;height:20px;"><use xlink:href="svg/icons.svg#icon-document"/></svg>
              </span>
              <span class="title-text">译文</span>
            </div>
            <div class="poem-translation-area" id="poem-translation-area"></div>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">
              <span class="title-icon">
                <svg class="svg-icon" style="width:20px;height:20px;"><use xlink:href="svg/icons.svg#icon-lightbulb"/></svg>
              </span>
              <span class="title-text">赏析</span>
            </div>
            <p class="poem-interpretation" id="poem-interpretation"></p>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">
              <span class="title-icon">
                <svg class="svg-icon" style="width:20px;height:20px;"><use xlink:href="svg/icons.svg#icon-user"/></svg>
              </span>
              <span class="title-text">诗人简介</span>
            </div>
            <div class="poet-card">
              <div class="poet-card-header">
                <div class="poet-avatar" id="poet-avatar"></div>
                <div class="poet-info">
                  <div class="poet-name" id="poet-name"></div>
                  <div class="poet-dynasty" id="poet-dynasty"></div>
                </div>
              </div>
              <div class="poet-bio" id="poet-bio"></div>
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">
              <span class="title-icon">
                <svg class="svg-icon" style="width:20px;height:20px;"><use xlink:href="svg/icons.svg#icon-star"/></svg>
              </span>
              <span class="title-text">应用场景</span>
            </div>
            <div class="scenes-wrap" id="scenes-wrap"></div>
          </div>

          <div class="poem-nav-buttons">
            <button class="nav-btn prev-btn" onclick="goPrevPoem()">
              <span class="btn-icon">
                <svg class="svg-icon" style="width:18px;height:18px;"><use xlink:href="svg/icons.svg#icon-back"/></svg>
              </span>
              <span>上一首</span>
            </button>
            <button class="nav-btn random-btn" onclick="goRandomPoem()">
              <span class="btn-icon">
                <svg class="svg-icon" style="width:18px;height:18px;"><use xlink:href="svg/icons.svg#icon-refresh"/></svg>
              </span>
              <span>随机一首</span>
            </button>
            <button class="nav-btn next-btn" onclick="goNextPoem()">
              <span>下一首</span>
              <span class="btn-icon">
                <svg class="svg-icon" style="width:18px;height:18px;"><use xlink:href="svg/icons.svg#icon-arrow-right"/></svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/demo-data.js"></script>
  <script src="js/demo-utils.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/bg-decor.js"></script>
  <script>
    (function () {
      var currentPoemId = 1;
      var poems = window.DEMO_POEMS || [];

      function getQueryParam(name) {
        var search = window.location.search.substring(1);
        var params = search.split('&');
        for (var i = 0; i < params.length; i++) {
          var pair = params[i].split('=');
          if (decodeURIComponent(pair[0]) === name) {
            return decodeURIComponent(pair[1] || '');
          }
        }
        return null;
      }

      function getPoemIndexById(id) {
        for (var i = 0; i < poems.length; i++) {
          if (poems[i].id === Number(id)) {
            return i;
          }
        }
        return -1;
      }

      function renderPoem(poem) {
        if (!poem) return;

        currentPoemId = poem.id;

        document.title = poem.title + ' - 轻诗阁 Demo';

        var bgEl = document.getElementById('poem-hero-bg');
        if (bgEl) {
          bgEl.style.backgroundImage = "url('" + (poem.image || 'images/hero/poem_1.jpg') + "')";
        }

        var titleEl = document.getElementById('poem-hero-title');
        if (titleEl) titleEl.textContent = poem.title;

        var dynastyEl = document.getElementById('poem-hero-dynasty');
        if (dynastyEl) dynastyEl.textContent = poem.dynasty ? '[' + poem.dynasty + ']' : '';

        var authorEl = document.getElementById('poem-hero-author');
        if (authorEl) authorEl.textContent = poem.author || '';

        var breadcrumbTitle = document.getElementById('breadcrumb-title');
        if (breadcrumbTitle) breadcrumbTitle.textContent = poem.title;

        var contentArea = document.getElementById('poem-content-area');
        if (contentArea && poem.content) {
          var html = '';
          poem.content.forEach(function (line) {
            html += '<span class="poem-content-line">' + line + '</span>';
          });
          contentArea.innerHTML = html;
        }

        var translationArea = document.getElementById('poem-translation-area');
        if (translationArea && poem.translations) {
          var transHtml = '';
          poem.translations.forEach(function (line) {
            transHtml += '<span class="poem-translation-line">' + line + '</span>';
          });
          translationArea.innerHTML = transHtml;
        }

        var interpretationEl = document.getElementById('poem-interpretation');
        if (interpretationEl) {
          interpretationEl.textContent = poem.interpretation || poem.analysis || '';
        }

        var poetAvatar = document.getElementById('poet-avatar');
        if (poetAvatar && poem.author) {
          poetAvatar.textContent = poem.author.charAt(0);
        }

        var poetName = document.getElementById('poet-name');
        if (poetName) poetName.textContent = poem.author || '';

        var poetDynasty = document.getElementById('poet-dynasty');
        if (poetDynasty) poetDynasty.textContent = poem.dynasty ? poem.dynasty + '代诗人' : '';

        var poetBio = document.getElementById('poet-bio');
        if (poetBio) poetBio.textContent = poem.poetBiography || '';

        var scenesWrap = document.getElementById('scenes-wrap');
        if (scenesWrap && poem.scenes && poem.scenes.length > 0) {
          var scenesHtml = '';
          poem.scenes.forEach(function (scene) {
            scenesHtml += '<span class="scene-tag">';
            scenesHtml += '  <span class="scene-icon">';
            scenesHtml += '    <svg class="svg-icon" style="width:14px;height:14px;"><use xlink:href="svg/icons.svg#icon-sparkle"/></svg>';
            scenesHtml += '  </span>';
            scenesHtml += '  <span>' + scene + '</span>';
            scenesHtml += '</span>';
          });
          scenesWrap.innerHTML = scenesHtml;
        }
      }

      function goPrevPoem() {
        var idx = getPoemIndexById(currentPoemId);
        if (idx <= 0) {
          idx = poems.length - 1;
        } else {
          idx--;
        }
        var prevPoem = poems[idx];
        if (prevPoem) {
          window.location.href = 'poem.html?id=' + prevPoem.id;
        }
      }

      function goNextPoem() {
        var idx = getPoemIndexById(currentPoemId);
        if (idx >= poems.length - 1) {
          idx = 0;
        } else {
          idx++;
        }
        var nextPoem = poems[idx];
        if (nextPoem) {
          window.location.href = 'poem.html?id=' + nextPoem.id;
        }
      }

      function goRandomPoem() {
        var poem = DemoApp.getRandomPoem(true);
        if (poem) {
          window.location.href = 'poem.html?id=' + poem.id;
        }
      }

      window.goPrevPoem = goPrevPoem;
      window.goNextPoem = goNextPoem;
      window.goRandomPoem = goRandomPoem;

      function init() {
        DemoApp.initNav('search');

        var id = getQueryParam('id');
        var poem;
        if (id) {
          poem = DemoApp.getPoemById(id);
        } else {
          poem = DemoApp.getRandomPoem(true);
        }
        renderPoem(poem);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
