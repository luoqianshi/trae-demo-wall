<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华夏山河志·地理记忆 — 全民记忆·散落民间 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600;900&family=Long+Cang&display=swap" rel="stylesheet">
<!-- Leaflet 地图引擎：选择 Leaflet 是因为它轻量、无需 API Key、CDN 引入即可用 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- 点位聚合插件：海口点位密集时避免图钉互相遮挡 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
/* ========== 设计系统：山河为卷，史为墨（沿用演示页墨色体系） ========== */
:root{
  --ink-deep:#0a0806;
  --ink:#15110d;
  --ink-soft:#241d16;
  --paper:#e8dcc4;
  --paper-soft:#c9bca0;
  --paper-dim:#8a7d65;
  --cinnabar:#c0392b;
  --cinnabar-bright:#e74c3c;
  --bronze:#b8860b;
  --bronze-soft:#8b6914;
  --jade:#4a5d4a;
  --jade-soft:#6b7d6b;
  /* 核实等级色阶：让用户一眼判断记忆可信度 */
  --lv0:#6b7d6b;  /* L0 未经考证 - 暗灰青 */
  --lv1:#8b6914;  /* L1 民间记忆 - 暗青铜 */
  --lv2:#b8860b;  /* L2 文献佐证 - 青铜 */
  --lv3:#c0392b;  /* L3 机构核实 - 朱砂 */
  --lv4:#e74c3c;  /* L4 权威认证 - 亮朱砂 */
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Noto Serif SC',serif;
  background:var(--ink-deep);
  color:var(--paper);
  overflow:hidden;
}

/* ========== 顶部导航 ========== */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:64px;padding:0 32px;
  background:linear-gradient(180deg,rgba(10,8,6,0.98),rgba(10,8,6,0.85));
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(184,134,11,0.2);
  display:flex;align-items:center;justify-content:space-between;
}
.nav-brand{
  font-family:'Ma Shan Zheng',cursive;
  font-size:26px;color:var(--paper);
  letter-spacing:3px;
  display:flex;align-items:center;gap:10px;
}
.nav-brand .seal-mark{
  width:28px;height:28px;background:var(--cinnabar);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--paper);border-radius:3px;
  font-family:'Ma Shan Zheng',cursive;
}
.nav-brand .sub{font-size:13px;color:var(--bronze);letter-spacing:4px;font-family:'ZCOOL XiaoWei',serif}
.nav-tabs{display:flex;gap:4px}
.nav-tab{
  padding:8px 18px;font-family:'ZCOOL XiaoWei',serif;font-size:15px;
  color:var(--paper-soft);cursor:pointer;border-radius:2px;
  transition:all 0.3s;letter-spacing:2px;
  border:1px solid transparent;
}
.nav-tab:hover{color:var(--paper);background:rgba(184,134,11,0.08)}
.nav-tab.active{
  color:var(--paper);background:rgba(192,57,43,0.15);
  border-color:rgba(192,57,43,0.4);
}

/* ========== 主布局：地图 + 右侧面板 ========== */
.main{
  position:fixed;top:64px;left:0;right:0;bottom:36px;
  display:flex;
}
/* 地图区 */
.map-wrap{
  flex:1;position:relative;
  background:var(--ink-deep);
}
#map{
  position:absolute;inset:0;
  /* 滤镜下沉到各瓦片层（.tone-*），避免影响图钉与控件 */
}
/* 多瓦片样式：滤镜经 tileLayer 的 className 作用于瓦片层，图钉控件不受影响 */
.leaflet-layer.tone-ink .leaflet-tile{
  /* 矢量图反转墨色化：浅底变深墨，道路化为淡线 */
  filter:invert(1) hue-rotate(180deg) brightness(0.95) contrast(1.05) saturate(0.5);
}
.leaflet-layer.tone-sat .leaflet-tile{
  /* 卫星图反转后大幅降饱和：绿色植被不再变紫粉，呈现黑白墨韵，不辣眼 */
  filter:invert(1) hue-rotate(180deg) brightness(0.8) contrast(1.1) saturate(0.25);
}
.leaflet-layer.tone-real .leaflet-tile{
  /* 实景保留自然色，仅轻微压暗融入主题 */
  filter:brightness(0.82) saturate(0.88) contrast(1.02);
}
/* Leaflet 控件墨色化 */
.leaflet-control-zoom a{
  background:var(--ink)!important;color:var(--paper)!important;
  border-color:var(--bronze-soft)!important;
}
.leaflet-control-zoom a:hover{background:var(--ink-soft)!important}
.leaflet-control-attribution{
  background:rgba(10,8,6,0.8)!important;color:var(--paper-dim)!important;
}
.leaflet-control-attribution a{color:var(--bronze)!important}
/* 图层切换控件墨色化 */
.leaflet-control-layers{
  background:rgba(10,8,6,0.92)!important;
  border:1px solid rgba(184,134,11,0.3)!important;
  border-radius:2px!important;
  color:var(--paper)!important;
  box-shadow:0 2px 12px rgba(0,0,0,0.5)!important;
}
.leaflet-control-layers-expanded{padding:12px 14px!important}
.leaflet-control-layers-section{margin-bottom:6px}
.leaflet-control-layers-list{
  font-family:'ZCOOL XiaoWei',serif!important;font-size:13px!important;
  letter-spacing:1px;
}
.leaflet-control-layers-base label{
  display:flex;align-items:center;gap:6px;
  padding:4px 0;cursor:pointer;
  color:var(--paper-soft);transition:color 0.2s;
}
.leaflet-control-layers-base label:hover{color:var(--paper)}
.leaflet-control-layers-base input[type=radio]{
  accent-color:var(--cinnabar);margin:0;cursor:pointer;
}
.leaflet-control-layers-toggle{
  background-image:none!important;width:auto!important;height:auto!important;
}
.leaflet-control-layers-toggle::before{
  content:'层';font-family:'Ma Shan Zheng',cursive;color:var(--bronze);
  font-size:18px;display:block;padding:4px 6px;cursor:pointer;
}

/* 自定义图钉：印章造型，边框色=核实等级，虚线=待审/样例 */
.seal-pin{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Ma Shan Zheng',cursive;font-size:15px;color:var(--paper);
  background:var(--ink);
  border:2px solid var(--lv3);
  box-shadow:0 0 8px rgba(0,0,0,0.6);
  cursor:pointer;transition:transform 0.2s, box-shadow 0.2s;
  position:relative;
}
.seal-pin:hover{
  transform:scale(1.2);
  box-shadow:0 0 16px currentColor;
  z-index:1000;
}
/* 待审与样例点用虚线边框，诚实区分可信度 */
.seal-pin.pending{border-style:dashed;background:rgba(21,17,13,0.7)}
/* L4 权威认证加金色光晕 */
.seal-pin.lv4{box-shadow:0 0 12px var(--lv4),0 0 4px var(--bronze)}

/* 聚合簇样式 */
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{
  background:rgba(184,134,11,0.3)!important;
  border:1px solid var(--bronze)!important;
}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{
  background:var(--ink)!important;color:var(--bronze)!important;
  font-family:'Ma Shan Zheng',cursive;
}

/* 地图左上角浮层：当前视图说明 */
.map-overlay{
  position:absolute;top:20px;left:20px;z-index:500;
  background:rgba(10,8,6,0.85);backdrop-filter:blur(8px);
  border:1px solid rgba(184,134,11,0.25);border-radius:3px;
  padding:16px 20px;max-width:300px;
  pointer-events:none;
}
.map-overlay .ov-title{
  font-family:'ZCOOL XiaoWei',serif;font-size:16px;color:var(--paper);
  margin-bottom:6px;letter-spacing:2px;
}
.map-overlay .ov-desc{font-size:12px;color:var(--paper-dim);line-height:1.7}
.map-overlay .ov-hint{
  margin-top:8px;padding-top:8px;border-top:1px solid rgba(184,134,11,0.15);
  font-size:11px;color:var(--bronze);
}

/* ========== 右侧面板 ========== */
.panel{
  width:420px;flex-shrink:0;
  background:linear-gradient(180deg,var(--ink) 0%,var(--ink-deep) 100%);
  border-left:1px solid rgba(184,134,11,0.2);
  overflow-y:auto;position:relative;
}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:var(--bronze-soft);border-radius:3px}

/* 面板默认状态：图例与说明 */
.panel-default{padding:28px}
.panel-default h2{
  font-family:'Ma Shan Zheng',cursive;font-size:30px;color:var(--paper);
  margin-bottom:6px;
}
.panel-default .pd-sub{font-size:13px;color:var(--bronze);letter-spacing:3px;margin-bottom:24px}
.legend-block{margin-bottom:24px}
.legend-block h3{
  font-family:'ZCOOL XiaoWei',serif;font-size:15px;color:var(--paper-soft);
  margin-bottom:12px;letter-spacing:2px;
  padding-bottom:8px;border-bottom:1px solid rgba(184,134,11,0.15);
}
.legend-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13px;color:var(--paper-soft)}
.legend-pin{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Ma Shan Zheng',cursive;font-size:11px;color:var(--paper);
  background:var(--ink);border:2px solid currentColor;
}
.legend-line{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:12px;color:var(--paper-dim)}
.legend-line .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* 点位详情 */
.detail{padding:0}
/* 主图区域 */
.detail-photo{
  position:relative;height:220px;overflow:hidden;
  background:var(--ink-soft);
  cursor:pointer;
}
.detail-photo img{
  width:100%;height:100%;object-fit:cover;
  /* 真实照片轻微压暗+降饱和+复古色调，融入墨色主题而非刺眼亮色 */
  filter:brightness(0.85) contrast(1.1) saturate(0.7) sepia(0.15);
  transition:opacity 0.4s ease;
}
.detail-photo img.switching{opacity:0}
.detail-photo .photo-veil{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0%,rgba(10,8,6,0.4) 50%,var(--ink) 100%);
}
.detail-photo .photo-caption{
  position:absolute;bottom:12px;left:16px;right:16px;
  font-size:12px;color:var(--paper-soft);
  display:flex;justify-content:space-between;align-items:flex-end;
}
.detail-photo .photo-credit{font-size:10px;color:var(--paper-dim);font-style:italic}
/* 图片计数与切换指示 */
.photo-indicator{
  position:absolute;top:12px;right:12px;z-index:5;
  background:rgba(10,8,6,0.75);backdrop-filter:blur(4px);
  padding:3px 10px;border-radius:2px;
  font-size:11px;color:var(--paper-soft);
  font-family:'ZCOOL XiaoWei',serif;letter-spacing:1px;
  border:1px solid rgba(184,134,11,0.2);
}
.photo-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:5;
  width:32px;height:32px;border-radius:50%;
  background:rgba(10,8,6,0.6);backdrop-filter:blur(4px);
  border:1px solid rgba(184,134,11,0.3);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--paper-soft);font-size:14px;
  transition:all 0.2s;
}
.photo-nav:hover{background:rgba(184,134,11,0.3);color:var(--paper)}
.photo-nav.prev{left:10px}
.photo-nav.next{right:10px}
/* 缩略图条 */
.photo-thumbs{
  display:flex;gap:4px;padding:6px 8px;
  background:var(--ink-deep);
  overflow-x:auto;
}
.photo-thumbs::-webkit-scrollbar{height:3px}
.photo-thumbs::-webkit-scrollbar-thumb{background:var(--bronze-soft);border-radius:2px}
.photo-thumb{
  flex-shrink:0;width:48px;height:36px;border-radius:2px;
  overflow:hidden;cursor:pointer;
  border:1px solid transparent;
  opacity:0.5;transition:all 0.2s;
}
.photo-thumb.active{border-color:var(--bronze);opacity:1}
.photo-thumb:hover{opacity:0.8}
.photo-thumb img{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(0.85) contrast(1.1) saturate(0.7) sepia(0.15);
}

.detail-body{padding:24px}
.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{
  padding:3px 12px;font-size:11px;border-radius:2px;
  font-family:'ZCOOL XiaoWei',serif;letter-spacing:1px;
}
.tag-era{background:rgba(192,57,43,0.15);color:var(--cinnabar-bright);border:1px solid rgba(192,57,43,0.3)}
.tag-cat{background:rgba(184,134,11,0.12);color:var(--bronze);border:1px solid rgba(184,134,11,0.25)}
.tag-sample{background:rgba(107,125,107,0.15);color:var(--jade-soft);border:1px dashed var(--jade-soft)}
.tag-pending{background:rgba(107,125,107,0.15);color:var(--lv0);border:1px dashed var(--lv0)}

/* 核实等级徽章 */
.verify-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;font-size:11px;border-radius:2px;
  font-family:'ZCOOL XiaoWei',serif;letter-spacing:1px;
  margin-bottom:14px;
}
.verify-dot{width:8px;height:8px;border-radius:50%}

.detail-title{
  font-family:'ZCOOL XiaoWei',serif;font-size:24px;color:var(--paper);
  margin-bottom:8px;line-height:1.3;
}
.detail-summary{font-size:14px;color:var(--cinnabar-bright);margin-bottom:16px;font-style:italic}

.detail-coord{
  background:rgba(232,220,196,0.04);border-left:2px solid var(--bronze);
  padding:12px 14px;margin-bottom:16px;
}
.detail-coord .coord-label{font-size:10px;color:var(--paper-dim);letter-spacing:2px;margin-bottom:4px}
.detail-coord .coord-val{font-size:12px;color:var(--bronze);font-family:monospace}
.detail-coord .obj-desc{font-size:13px;color:var(--paper-soft);margin-top:8px;line-height:1.7}

.detail-story{
  font-size:14px;color:var(--paper-soft);line-height:2;
  margin-bottom:16px;text-indent:2em;
}
.detail-source{
  font-size:11px;color:var(--paper-dim);
  padding:10px 0;border-top:1px solid rgba(184,134,11,0.15);
  margin-top:16px;
}
.detail-source .src-label{color:var(--bronze);letter-spacing:1px}

/* 审核溯源链 */
.review-chain{margin-top:16px}
.review-chain h4{
  font-family:'ZCOOL XiaoWei',serif;font-size:13px;color:var(--bronze);
  margin-bottom:10px;letter-spacing:2px;
}
.review-item{
  display:flex;gap:10px;padding:8px 0;
  border-bottom:1px dashed rgba(184,134,11,0.1);
  font-size:12px;
}
.review-item .r-role{color:var(--cinnabar-bright);min-width:110px}
.review-item .r-action{color:var(--paper-soft);flex:1}
.review-item .r-time{color:var(--paper-dim);font-size:10px}

/* 面板关闭 */
.panel-close{
  position:absolute;top:12px;right:12px;z-index:10;
  width:28px;height:28px;border-radius:50%;
  background:rgba(10,8,6,0.7);border:1px solid var(--bronze-soft);
  color:var(--paper);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;
}
.panel-close:hover{background:var(--cinnabar);border-color:var(--cinnabar)}

/* ========== 表单样式（个人时光志 / 全民维护共用） ========== */
.form-block{padding:28px}
.form-block h2{
  font-family:'Ma Shan Zheng',cursive;font-size:28px;color:var(--paper);
  margin-bottom:6px;
}
.form-block .fb-sub{font-size:12px;color:var(--bronze);letter-spacing:3px;margin-bottom:24px}
.form-group{margin-bottom:18px}
.form-label{
  display:block;font-family:'ZCOOL XiaoWei',serif;font-size:13px;
  color:var(--paper-soft);margin-bottom:6px;letter-spacing:1px;
}
.form-label .req{color:var(--cinnabar)}
.form-input,.form-textarea,.form-select{
  width:100%;padding:10px 12px;
  background:rgba(232,220,196,0.04);
  border:1px solid rgba(184,134,11,0.2);
  color:var(--paper);font-family:'Noto Serif SC',serif;font-size:14px;
  border-radius:2px;outline:none;transition:border-color 0.3s;
}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--cinnabar)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.7}
.form-select{cursor:pointer}
.form-select option{background:var(--ink)}
.form-coord-display{
  padding:8px 12px;background:rgba(184,134,11,0.08);
  border:1px dashed var(--bronze-soft);border-radius:2px;
  font-size:12px;color:var(--bronze);font-family:monospace;
}
.form-hint{font-size:11px;color:var(--paper-dim);margin-top:4px;line-height:1.6}

/* 核实等级选择卡片 */
.verify-picker{display:flex;gap:8px;flex-wrap:wrap}
.verify-opt{
  flex:1;min-width:80px;padding:10px 8px;
  border:1px solid rgba(184,134,11,0.2);border-radius:2px;
  cursor:pointer;text-align:center;transition:all 0.3s;
  background:rgba(232,220,196,0.03);
}
.verify-opt:hover{border-color:var(--bronze)}
.verify-opt.selected{border-color:currentColor;background:rgba(192,57,43,0.08)}
.verify-opt .vo-dot{width:12px;height:12px;border-radius:50%;margin:0 auto 6px}
.verify-opt .vo-name{font-size:12px;color:var(--paper);font-family:'ZCOOL XiaoWei',serif}
.verify-opt .vo-lv{font-size:10px;color:var(--paper-dim);margin-top:2px}

/* 按钮 */
.btn{
  padding:10px 24px;border:none;border-radius:2px;cursor:pointer;
  font-family:'ZCOOL XiaoWei',serif;font-size:15px;letter-spacing:2px;
  transition:all 0.3s;
}
.btn-primary{background:var(--cinnabar);color:var(--paper)}
.btn-primary:hover{background:var(--cinnabar-bright);box-shadow:0 0 12px rgba(192,57,43,0.4)}
.btn-ghost{background:transparent;color:var(--paper-soft);border:1px solid var(--bronze-soft)}
.btn-ghost:hover{border-color:var(--bronze);color:var(--paper)}
.btn-row{display:flex;gap:10px;margin-top:8px}

/* 列表项（我的提交 / 时光志列表） */
.item-list{margin-top:20px}
.list-item{
  padding:14px;border:1px solid rgba(184,134,11,0.15);
  border-radius:2px;margin-bottom:10px;cursor:pointer;
  transition:all 0.3s;background:rgba(232,220,196,0.02);
}
.list-item:hover{border-color:var(--cinnabar);background:rgba(192,57,43,0.05)}
.list-item .li-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.list-item .li-title{font-family:'ZCOOL XiaoWei',serif;font-size:16px;color:var(--paper)}
.list-item .li-meta{font-size:11px;color:var(--paper-dim)}
.list-item .li-feeling{font-family:'Long Cang',cursive;font-size:16px;color:var(--paper-soft);margin-top:6px}
.list-item .li-status{
  font-size:10px;padding:2px 8px;border-radius:2px;
  border:1px solid currentColor;
}

/* 空状态 */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--paper-dim);
}
.empty-state .es-icon{font-family:'Ma Shan Zheng',cursive;font-size:48px;color:var(--bronze-soft);opacity:0.4}
.empty-state .es-text{font-size:14px;margin-top:12px;line-height:1.8}

/* ========== 底部状态栏 ========== */
.statusbar{
  position:fixed;bottom:0;left:0;right:0;height:36px;z-index:1000;
  background:var(--ink-deep);border-top:1px solid rgba(184,134,11,0.15);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:11px;color:var(--paper-dim);
}
.statusbar .sb-left{display:flex;gap:20px;align-items:center}
.statusbar .sb-right{color:var(--bronze-soft);font-style:italic}
.sb-count{color:var(--bronze)}

/* ========== 关于视图 ========== */
.about-view{padding:32px;line-height:2}
.about-view h2{font-family:'Ma Shan Zheng',cursive;font-size:30px;color:var(--paper);margin-bottom:6px}

/* ---------- 全局状态 ---------- */
let map = null;           // Leaflet 地图实例
let markerLayer = null;   // 当前图层（所有图钉的聚合层）
let currentView = 'history'; // 当前视图：history/memory/contribute/about
let mapClickMode = 'view';   // 地图点击模式：view/browse/add-memory/add-point
let pendingLatLng = null;    // 全民维护/时光志点击地图暂存的坐标

/* localStorage 键名：个人时光志与全民提交分开存储，互不干扰 */
const MEM_KEY = 'shanhe_memory_v1';
const SUB_KEY = 'shanhe_submissions_v1';

/* ---------- 存取工具函数 ---------- */
/** 读取个人时光志：从 localStorage 取出，失败返回空数组 */
function loadMemories(){
  try{ return JSON.parse(localStorage.getItem(MEM_KEY)) || []; }catch(e){ return []; }
}
/** 保存个人时光志 */
function saveMemories(arr){
  try{ localStorage.setItem(MEM_KEY, JSON.stringify(arr)); }catch(e){}
}
/** 读取全民提交点位 */
function loadSubmissions(){
  try{ return JSON.parse(localStorage.getItem(SUB_KEY)) || []; }catch(e){ return []; }
}
/** 保存全民提交点位 */
function saveSubmissions(arr){
  try{ localStorage.setItem(SUB_KEY, JSON.stringify(arr)); }catch(e){}
}

/** Toast 轻提示：用于表单提交成功等非阻塞反馈 */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- 点位照片引用 ----------
 * 每个点位配多张示意图（photos数组），
 * 经 CSS 墨色滤镜处理后融入山河夜色主题。正式版替换为实地拍摄照片。
 */
/** 兼容旧数据：若点位仍用 photo 单张格式，自动转为 photos 数组 */
function ensurePhotos(point){
  if(point.photos && point.photos.length) return point.photos;
  if(point.photo) return [{src:'images/' + point.id + '.jpg', caption:point.photo.caption||'', credit:point.photo.credit||''}];
  return [{src:'images/' + point.id + '.jpg', caption:'', credit:''}];
}
/** 获取点位主图URL（用于列表缩略图等场景） */
function photoUrl(point){
  var photos = ensurePhotos(point);
  return photos[0].src;
}

/* ---------- 图片画廊状态与切换 ----------
 * 记录当前查看的点位的图片索引，支持左右切换和缩略图点击
 */
let galleryState = {pointId:null, index:0};

/** 切换到指定图片索引，带淡入淡出过渡 */
function switchPhoto(pointId, newIndex){
  var photos = null;
  var point = null;
  for(var i = 0; i < HISTORY_POINTS.length; i++){
    if(HISTORY_POINTS[i].id === pointId){point = HISTORY_POINTS[i]; break;}
  }
  // 同时检查全民维护提交
  if(!point) point = loadSubmissions().find(function(s){return s.id===pointId;});
  if(!point) return;
  photos = ensurePhotos(point);
  if(newIndex < 0) newIndex = photos.length - 1;
  if(newIndex >= photos.length) newIndex = 0;
  galleryState.index = newIndex;

  // 主图淡出再换源淡入
  var mainImg = document.getElementById('gallery-main-img');
  var captionEl = document.getElementById('gallery-caption');
  var creditEl = document.getElementById('gallery-credit');
  var indicatorEl = document.getElementById('gallery-indicator');
  if(mainImg){
    mainImg.classList.add('switching');
    setTimeout(function(){
      mainImg.src = photos[newIndex].src;
      mainImg.alt = point.name;
      if(captionEl) captionEl.textContent = photos[newIndex].caption;
      if(creditEl) creditEl.textContent = photos[newIndex].credit;
      if(indicatorEl) indicatorEl.textContent = (newIndex+1) + ' / ' + photos.length;
      mainImg.classList.remove('switching');
    }, 300);
  }
  // 更新缩略图激活状态
  var thumbs = document.querySelectorAll('.photo-thumb');
  thumbs.forEach(function(t, idx){
    t.classList.toggle('active', idx === newIndex);
  });
}

/** 生成缩略图条的HTML */
function thumbsHtml(photos){
  if(photos.length <= 1) return '';
  var html = '<div class="photo-thumbs">';
  photos.forEach(function(ph, idx){
    html += '<div class="photo-thumb'+(idx===0?' active':'')+'" onclick="switchPhoto(galleryState.pointId,'+idx+')">' +
            '<img src="'+ph.src+'" alt="缩略图" onerror="this.parentElement.style.display=\'none\'"></div>';
  });
  html += '</div>';
  return html;
}

/* ---------- 图钉 divIcon 生成 ----------
 * 印章造型：圆 + 类别字，边框色 = 核实等级色，虚线 = 待审/样例
 */
function makePin(point){
  const lv = VERIFY_LEVELS[point.verifyLevel] || VERIFY_LEVELS[0];
  const cat = CATEGORIES[point.category] || CATEGORIES.local;
  const isPending = point.isSample || point.verifyLevel <= 0;
  const lvClass = 'lv' + point.verifyLevel;
  const html = '<div class="seal-pin '+(isPending?'pending ':'')+lvClass+'" style="border-color:'+lv.color+';color:'+lv.color+'">'+cat.symbol+'</div>';
  return L.divIcon({html:html,className:'',iconSize:[30,30],iconAnchor:[15,15]});
}

/* ---------- WGS-84 ↔ GCJ-02 坐标转换 ----------
 * 国内地图瓦片（高德/腾讯）采用 GCJ-02 火星坐标系，而 GPS 与国际标准经纬度
 * 为 WGS-84。两者直接混用会产生几十至几百米偏移。本 demo 数据统一存储 WGS-84
 * （国际标准，便于迁移），仅渲染到高德瓦片时转 GCJ-02；地图点击返回的 GCJ-02
 * 坐标在存入数据前转回 WGS-84，保证坐标体系统一。
 */
const COORD = {
  a: 6378245.0,
  ee: 0.00669342162296594323,
  // GCJ 偏移仅限中国境内，境外坐标原样返回
  inChina(lng, lat){
    return lng >= 72.004 && lng <= 137.8347 && lat >= 0.8293 && lat <= 55.8271;
  },
  tLat(x, y){
    let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
    r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
    return r;
  },
  tLng(x, y){
    let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
    r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
    return r;
  },
  // WGS-84 → GCJ-02，返回 [lat, lng]，供渲染 marker 与 setView 使用
  w2g(lat, lng){
    if(!this.inChina(lng, lat)) return [lat, lng];
    let dLat = this.tLat(lng-105, lat-35);
    let dLng = this.tLng(lng-105, lat-35);
    const radLat = lat*Math.PI/180;
    let magic = Math.sin(radLat);
    magic = 1 - this.ee*magic*magic;
    const sm = Math.sqrt(magic);
    dLat = (dLat*180)/((this.a*(1-this.ee))/(magic*sm)*Math.PI);
    dLng = (dLng*180)/(this.a/sm*Math.cos(radLat)*Math.PI);
    return [lat+dLat, lng+dLng];
  },
  // GCJ-02 → WGS-84，迭代反算，返回 [lat, lng]，供地图点击存数据前转换
  g2w(lat, lng){
    if(!this.inChina(lng, lat)) return [lat, lng];
    let wl = lng, wa = lat;
    for(let i=0;i<10;i++){
      const g = this.w2g(wa, wl);
      wl += lng - g[1];
      wa += lat - g[0];
    }
    return [wa, wl];
  }
};

/* ---------- 初始化地图 ---------- */
function initMap(){
  // 数据中心为 WGS-84，渲染前转 GCJ-02 以匹配高德瓦片
  const cv = COORD.w2g(19.95, 110.36);
  map = L.map('map',{zoomControl:true,attributionControl:true}).setView(cv,11);

  // 三种瓦片样式：滤镜经 className 作用于瓦片层，图钉与控件不受影响
  // 墨韵地形：矢量图（style=7）带地名标注，反转后呈深墨底淡线，地理名称可读
  const inkLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}',{
    maxZoom:18, subdomains:'1234', attribution:'© 高德地图', className:'tone-ink'
  });
  // 山河卫星：卫星图（style=6）无任何标注，反转后降饱和呈黑白墨韵，最干净且不辣眼
  const satLayer = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{
    maxZoom:18, subdomains:'1234', attribution:'© 高德地图', className:'tone-sat'
  });
  // 实景卫星：卫星图保留自然地表色彩，仅轻微压暗融入主题
  const realLayer = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{
    maxZoom:18, subdomains:'1234', attribution:'© 高德地图', className:'tone-real'
  });

  inkLayer.addTo(map); // 默认墨韵地形

  // 图层切换控件：右上角，展开式，三种底图互斥切换
  L.control.layers({
    '墨韵地形':inkLayer,
    '山河卫星':satLayer,
    '实景卫星':realLayer
  }, null, {position:'topright', collapsed:false}).addTo(map);
  // 使用聚合图层：海口范围内点位密集，聚合后远看归拢、近看散开，避免图钉互相遮挡
  markerLayer = L.markerClusterGroup({
    showCoverageOnHover:false,
    maxClusterRadius:40,
    iconCreateFunction:function(cluster){
      const n = cluster.getChildCount();
      return L.divIcon({html:'<div style="width:36px;height:36px;border-radius:50%;background:rgba(184,134,11,0.25);border:1px solid var(--bronze,#b8860b);display:flex;align-items:center;justify-content:center;font-family:Ma Shan Zheng,cursive;color:#b8860b;font-size:16px">'+n+'</div>',className:'marker-cluster-custom',iconSize:[36,36]});
    }
  }).addTo(map);
  renderPoints();
  // 地图点击：瓦片为 GCJ-02，点击返回亦为 GCJ-02，转回 WGS-84 后再传给表单存入数据
  map.on('click', function(e){
    const w = COORD.g2w(e.latlng.lat, e.latlng.lng);
    const wgs = {lat:w[0], lng:w[1]};
    if(mapClickMode === 'add-memory'){ showMemoryForm(wgs); }
    else if(mapClickMode === 'add-point'){ showContributeForm(wgs); }
  });
}

/* ---------- 渲染历史点位（散落记忆图层） ----------
 * 根据当前视图决定渲染哪些图钉：
 * - history/contribute：历史点位 + 用户提交点位
 * - memory：个人时光志点位（青铜色，区别于历史图钉）
 */
function renderPoints(){
  markerLayer.clearLayers();
  let all;
  if(currentView === 'memory'){
    // 个人时光志视图：只渲染用户自己的记忆点，避免与历史图层混淆
    all = loadMemories().map(function(m){
      return {id:m.id,lat:m.lat,lng:m.lng,category:'local',verifyLevel:2,isSample:false,_mem:m};
    });
  }else{
    // 历史图层与全民维护视图：合并内置点位与用户提交点位
    all = HISTORY_POINTS.concat(loadSubmissions());
  }
  all.forEach(function(p){
    // 数据存 WGS-84，渲染到 GCJ-02 瓦片前需转换，否则图钉会偏离实地几十至几百米
    const m = L.marker(COORD.w2g(p.lat,p.lng),{icon:makePin(p)});
    m.on('click', function(){
      if(p._mem){ showMemoryDetail(p._mem.id); }
      else{ showPointDetail(p); }
    });
    m.addTo(markerLayer);
  });
  updateStatusbar(HISTORY_POINTS.concat(loadSubmissions()));
}

/* ---------- 更新底部状态栏计数 ---------- */
function updateStatusbar(all){
  all = all || HISTORY_POINTS.concat(loadSubmissions());
  document.getElementById('sbCount').textContent = all.length;
  document.getElementById('sbReal').textContent = all.filter(function(p){return !p.isSample && p.verifyLevel>=2;}).length;
  document.getElementById('sbSample').textContent = all.filter(function(p){return p.isSample || p.verifyLevel<2;}).length;
}

/* ---------- 渲染点位详情 ---------- */
function showPointDetail(p){
  const lv = VERIFY_LEVELS[p.verifyLevel] || VERIFY_LEVELS[0];
  const cat = CATEGORIES[p.category] || CATEGORIES.local;
  const photos = ensurePhotos(p);

  // 初始化画廊状态
  galleryState = {pointId:p.id, index:0};
  const ph = photos[0];

  // 多图时显示导航箭头和计数指示器
  const navHtml = photos.length > 1 ?
    '<div class="photo-indicator" id="gallery-indicator">1 / '+photos.length+'</div>' +
    '<div class="photo-nav prev" onclick="switchPhoto(galleryState.pointId,galleryState.index-1)">‹</div>' +
    '<div class="photo-nav next" onclick="switchPhoto(galleryState.pointId,galleryState.index+1)">›</div>' : '';

  const photoAreaHtml =
    '<div class="detail-photo">' +
      '<img id="gallery-main-img" src="'+ph.src+'" alt="'+p.name+'" onerror="this.style.display=\'none\'">' +
      '<div class="photo-veil"></div>' +
      '<div class="photo-caption"><span id="gallery-caption">'+ph.caption+'</span><span class="photo-credit" id="gallery-credit">'+ph.credit+'</span></div>' +
      navHtml +
    '</div>' + thumbsHtml(photos);

  const tagsHtml =
    '<span class="tag tag-era">'+p.eraLabel+'</span>' +
    '<span class="tag tag-cat">'+cat.name+'</span>' +
    (p.isSample ? '<span class="tag tag-sample">演示样例</span>' : '') +
    (p.verifyLevel <= 0 && !p.isSample ? '<span class="tag tag-pending">待审·自评</span>' : '');

  // 审核溯源链：展示这条记忆是如何被逐步核实的
  let reviewHtml = '';
  if(p.review && p.review.length){
    reviewHtml = '<div class="review-chain"><h4>审核溯源</h4>';
    p.review.forEach(function(r){
      reviewHtml += '<div class="review-item"><span class="r-role">'+r.role+'</span><span class="r-action">'+r.action+(r.note?'· '+r.note:'')+'</span><span class="r-time">'+r.time+'</span></div>';
    });
    reviewHtml += '</div>';
  }

  // 全民维护提交的点位附带"模拟审核"按钮，演示等级提升流程
  const isSubmission = loadSubmissions().some(function(s){return s.id===p.id;});
  const reviewBtn = isSubmission ?
    '<div class="btn-row"><button class="btn btn-primary" onclick="simulateReview(\''+p.id+'\')">模拟审核提升等级</button><button class="btn btn-ghost" onclick="deleteSubmission(\''+p.id+'\')">删除</button></div>' : '';

  document.getElementById('panel').innerHTML =
    '<div class="detail">' +
      '<button class="panel-close" onclick="renderPanelDefault()">×</button>' +

/* ---------- 导出/导入个人时光志 ---------- */
function exportMemory(){
  const arr = loadMemories();
  if(!arr.length){ toast('暂无记录可导出'); return; }
  const blob = new Blob([JSON.stringify(arr,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-shanhe-memory.json';
  a.click();
  toast('已导出 '+arr.length+' 条时光志');
}
function importMemory(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const arr = JSON.parse(e.target.result);
      if(Array.isArray(arr)){ saveMemories(arr); toast('已导入 '+arr.length+' 条'); renderMemoryView(); }
      else{ toast('文件格式不正确'); }
    }catch(err){ toast('文件解析失败'); }
  };
  reader.readAsText(file);
}

/* ---------- 模拟审核：演示等级提升流程 ---------- */
function simulateReview(id){
  const arr = loadSubmissions();
  const idx = arr.findIndex(function(s){return s.id===id;});
  if(idx < 0) return;
  const cur = arr[idx].verifyLevel;
  // 逐级提升：L0→L1→L2→L3→L4，到顶则循环回 L1
  const next = cur >= 4 ? 1 : cur + 1;
  const reviewers = ['历史协会','地方志办公室','文旅部门','史学馆','文物部门'];
  const actions = ['口述记录整理','文献佐证通过','实地踏勘确认','机构核实通过','权威认证立碑'];
  arr[idx].verifyLevel = next;
  arr[idx].review = arr[idx].review || [];
  arr[idx].review.push({
    role:reviewers[Math.min(cur,4)],
    action:actions[Math.min(cur,4)],
    time:new Date().toISOString().slice(0,7),
    note:'模拟审核·演示等级提升'
  });
  if(next >= 2){ arr[idx].summary = arr[idx].summary.replace('待审核','已核实'); }
  saveSubmissions(arr);
  toast('等级提升至 L'+next+' · '+(VERIFY_LEVELS[next].name));
  showPointDetail(arr[idx]);
  renderPoints();
}

    t.addEventListener('click', function(){ switchView(t.dataset.view); });
  });
});
</script>
