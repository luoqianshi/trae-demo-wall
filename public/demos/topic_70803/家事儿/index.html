<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="member-switcher" id="memberSwitcher">
                    <div class="current-member" id="currentMember">
                        <div class="member-avatar" id="headerAvatar"></div>
                        <span class="member-name" id="headerName"></span>
                    </div>
                    <div class="member-dropdown" id="memberDropdown"></div>
                </div>
                <h1 class="page-title" id="pageTitle">首页</h1>
                <div class="header-action" id="headerAction"></div>
            </div>
        </header>

        <main class="app-main">
            <div class="page-container" id="page-home"></div>
            <div class="page-container" id="page-todo" style="display:none"></div>
            <div class="page-container" id="page-moments" style="display:none"></div>
            <div class="page-container" id="page-profile" style="display:none"></div>
            <div class="page-container" id="page-album" style="display:none"></div>
            <div class="page-container" id="page-album-detail" style="display:none"></div>
            <div class="page-container" id="page-books" style="display:none"></div>
            <div class="page-container" id="page-shopping" style="display:none"></div>
            <div class="page-container" id="page-events" style="display:none"></div>
        </main>

        <nav class="app-bottom-nav">
            <div class="nav-item active" data-page="home">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <span class="nav-text">首页</span>
            </div>
            <div class="nav-item" data-page="todo">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 11 12 14 22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                </div>
                <span class="nav-text">待办</span>
            </div>
            <div class="nav-item" data-page="moments">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                    </svg>
                </div>
                <span class="nav-text">家庭圈</span>
            </div>
            <div class="nav-item" data-page="profile">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <span class="nav-text">我的</span>
            </div>
        </nav>

        <div class="modal-overlay" id="modalOverlay" style="display:none">
            <div class="modal-container" id="modalContainer"></div>
        </div>

        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/lunar.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modules/home.js"></script>
    <script src="js/modules/todo.js"></script>
    <script src="js/modules/moments.js"></script>
    <script src="js/modules/profile.js"></script>
    <script src="js/modules/album.js"></script>
    <script src="js/modules/books.js"></script>
    <script src="js/modules/shopping.js"></script>
    <script src="js/modules/events.js"></script>
</body>
</html>
