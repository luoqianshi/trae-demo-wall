<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>编辑个人信息</title>
    <style id="theme-vars">
/* Friend List Holder H5 — Brand Design Tokens */
/* Dark theme + Glassmorphism + Brand Blue accent */

:root {
  /* — Backgrounds — */
  --bg-deepest: #0b101e;
  --bg-card-mid: #172033;
  --bg-card-top: #1e293b;
  --bg-card-gradient: linear-gradient(135deg, var(--bg-card-top) 0%, var(--bg-deepest) 100%);
  --bg-glass: rgba(30, 41, 59, 0.6);
  --bg-glass-strong: rgba(30, 41, 59, 0.8);

  /* — Text — */
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-tertiary: #94a3b8;
  --text-weak: #64748b;

  /* — Brand — */
  --brand-500: #3b82f6;
  --brand-600: #2563eb;

  /* — Accent colors — */
  --violet-400: #8b5cf6;
  --amber-400: #f59e0b;
  --pink-400: #ec4899;
  --emerald-400: #22c55e;
  --rose-400: #f43f5e;
  --rose-500: #f43f5e;
  --rose-600: #e11d48;

  /* — Borders — */
  --border-card: #1e293b;
  --border-outer: #334155;

  /* — Typography — */
  --font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* — Radius — */
  --radius-card: 1.5rem;
  --radius-input: 1.5rem;
  --radius-btn: 1.5rem;
  --radius-avatar: 9999px;

  /* — Shadows — */
  --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.25);
  --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.3);

  /* — Spacing — */
  --page-padding: 1.25rem;
  --card-padding: 1.25rem;
  --card-gap: 1rem;

  /* — Animations — */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --duration-slide-up: 400ms;
  --duration-fade-in: 300ms;
  --duration-toggle: 300ms;

  /* — Glass blur — */
  --blur-glass: 24px;

  /* — Safe area — */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .anim-slide-up {
        opacity: 0;
        animation: slideUp 0.5s var(--ease-out-expo) forwards;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes toastOut {
        from {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateY(-10px) scale(0.95);
        }
      }

      .toast-enter {
        animation: toastIn 0.3s var(--ease-out-expo) forwards;
      }
      .toast-exit {
        animation: toastOut 0.25s ease-in forwards;
      }

      .dialog-overlay {
        animation: fadeIn 0.2s ease forwards;
      }
      .dialog-box {
        animation: slideUp 0.3s var(--ease-out-expo) forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased no-scrollbar" style="background:#f0f4f8; color:#1e293b; font-family: var(--font-family);">

  <div style="position:fixed;inset:0;z-index:0;background:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80') center center/cover no-repeat;background-color:#8bafc4;"></div>
  <div style="position:fixed;inset:0;z-index:1;background:rgba(240,244,248,0.75);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);"></div>

  <div style="position:relative;z-index:2;">

  <!-- Top Bar -->
  <div class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-3"
       style="background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.6); padding-top: calc(12px + var(--safe-top));">
    <button data-dom-id="btn-back-edit" class="text-[#64748b] text-xs flex items-center gap-1 active:text-[#1e293b] transition-colors">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>返回</span>
    </button>
    <span class="text-sm font-semibold text-[#1e293b]">编辑个人信息</span>
    <div class="w-12"></div>
  </div>

  <!-- Scrollable Form -->
  <div class="no-scrollbar overflow-y-auto pt-20 pb-12 px-5" style="height: 100vh; max-width: 28rem; margin: 0 auto;">

    <div class="flex flex-col gap-4 mt-2">

      <!-- 1. 昵称 -->
      <div class="anim-slide-up" style="animation-delay: 40ms;">
        <label class="block text-slate-500 text-[10px] mb-1.5 pl-1">昵称</label>
        <input type="text" value="小明, 阿三" class="w-full bg-slate-900/60 border border-slate-700 rounded-2xl text-slate-300 text-xs px-4 py-3 outline-none focus:border-blue-500/50 transition-colors" />
      </div>

      <!-- 2. 班级 -->
      <div class="anim-slide-up" style="animation-delay: 70ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">班级</label>
        <input type="text" value="高三(2)班" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 3. 座位号 -->
      <div class="anim-slide-up" style="animation-delay: 100ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">座位号</label>
        <input type="text" value="35" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 4. 生日 -->
      <div class="anim-slide-up" style="animation-delay: 130ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">生日</label>
        <input type="date" value="2008-05-20" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);color-scheme: light;" />
      </div>

      <!-- 5. QQ -->
      <div class="anim-slide-up" style="animation-delay: 160ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">QQ</label>
        <input type="text" value="123456789" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 6. 微信 -->
      <div class="anim-slide-up" style="animation-delay: 190ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">微信</label>
        <input type="text" value="zhangsan_wx" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 7. 手机 -->
      <div class="anim-slide-up" style="animation-delay: 220ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">手机</label>
        <input type="text" value="138****1234" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 8. 未来学校 -->
      <div class="anim-slide-up" style="animation-delay: 250ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">未来学校</label>
        <input type="text" value="浙江大学" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 9. 家乡 -->
      <div class="anim-slide-up" style="animation-delay: 280ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">家乡</label>
        <input type="text" value="浙江杭州" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 10. 爱好/偶像 -->
      <div class="anim-slide-up" style="animation-delay: 310ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">爱好/偶像</label>
        <input type="text" value="篮球 · 科比 · 周杰伦" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 11. 爱吃/讨厌 -->
      <div class="anim-slide-up" style="animation-delay: 340ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">爱吃/讨厌</label>
        <input type="text" value="火锅 · 抹茶 / 苦瓜" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 12. 理想职业 -->
      <div class="anim-slide-up" style="animation-delay: 370ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">理想职业</label>
        <input type="text" value="软件工程师" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 13. 口头禅 -->
      <div class="anim-slide-up" style="animation-delay: 400ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">口头禅</label>
        <input type="text" value="这也行？" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- 14. 喜欢书影音 -->
      <div class="anim-slide-up" style="animation-delay: 430ms;">
        <label class="block text-[#64748b] text-[10px] mb-1.5 pl-1">喜欢书影音</label>
        <input type="text" value="《三体》·《星际穿越》·《晴天》" class="w-full border border-[#e2e8f0] rounded-2xl text-[#475569] text-xs px-4 py-3 outline-none focus:border-[#2d8a4e]/50 transition-colors" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);" />
      </div>

      <!-- Save Button -->
      <div class="anim-slide-up pt-4" style="animation-delay: 460ms;">
        <button data-dom-id="btn-save-profile" class="w-full text-white rounded-3xl py-3 text-sm font-semibold active:bg-[#236b3d] transition-colors" style="background:rgba(45,138,78,0.9);backdrop-filter:blur(4px);">
          保存
        </button>
      </div>

      <!-- Discard Link -->
      <div class="anim-slide-up pb-8 flex justify-center" style="animation-delay: 490ms;">
        <button data-dom-id="btn-discard-edit" class="text-[#94a3b8] text-xs active:text-[#64748b] transition-colors">
          放弃修改
        </button>
      </div>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-20 left-0 right-0 flex justify-center z-[100] pointer-events-none"></div>

  <!-- Confirm Dialog -->
  <div id="confirm-dialog" class="fixed inset-0 z-[90] hidden">
    <div class="dialog-overlay absolute inset-0 bg-black/60"></div>
    <div class="dialog-box absolute left-4 right-4 rounded-2xl p-5 flex flex-col items-center gap-4" style="background: #ffffff; max-width: 20rem; margin: 0 auto; top: 50%; transform: translateY(-50%); border: 1px solid #e2e8f0;">
      <p class="text-[#1e293b] text-sm text-center">确定放弃修改吗？</p>
      <div class="flex gap-3 w-full">
        <button id="dialog-cancel" class="flex-1 rounded-2xl py-2.5 text-xs font-medium text-[#64748b] active:text-[#1e293b] transition-colors" style="background: rgba(255,255,255,0.7); border: 1px solid #e2e8f0;">取消</button>
        <button id="dialog-confirm" class="flex-1 rounded-2xl py-2.5 text-xs font-medium text-white bg-rose-500 active:bg-rose-600 transition-colors">确认</button>
      </div>
    </div>
  </div>

  <script>
    // Toast utility
    function showToast(message, type) {
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      var bgColor = type === 'green' ? 'rgba(34, 197, 94, 0.9)' : type === 'red' ? 'rgba(244, 63, 94, 0.9)' : 'rgba(59, 130, 246, 0.9)';
      toast.className = 'toast-enter pointer-events-auto';
      toast.style.cssText = 'background:' + bgColor + ';color:#fff;padding:10px 24px;border-radius:9999px;font-size:13px;font-weight:500;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,0.3);';
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(function() {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        toast.addEventListener('animationend', function() {
          toast.remove();
        });
      }, 1800);
    }

    // Save button
    document.querySelector('[data-dom-id="btn-save-profile"]').addEventListener('click', function() {
      showToast('已保存', 'green');
    });

    // Discard button - show confirm dialog
    var dialog = document.getElementById('confirm-dialog');
    document.querySelector('[data-dom-id="btn-discard-edit"]').addEventListener('click', function() {
      dialog.classList.remove('hidden');
    });
    document.getElementById('dialog-cancel').addEventListener('click', function() {
      dialog.classList.add('hidden');
    });
    document.getElementById('dialog-confirm').addEventListener('click', function() {
      dialog.classList.add('hidden');
      showToast('已放弃修改', 'red');
    });
    dialog.querySelector('.dialog-overlay').addEventListener('click', function() {
      dialog.classList.add('hidden');
    });
  </script>

  </div>

</body>
</html>
