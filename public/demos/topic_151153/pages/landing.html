<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Friend List</title>
    <style id="theme-vars">:root{--text-background:transparent;--text-foreground:#1a1a1a;}</style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <style type="text/tailwindcss">
  @theme inline { --color-primary: var(--text-primary); }
  @layer base { body { background: var(--text-background); color: var(--text-foreground); } }
    </style>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif; }

        /* Full-screen background image */
        .landing-bg {
            position: fixed; inset: 0; z-index: 0;
            background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80') center center / cover no-repeat;
            background-color: #2c5f7c;
        }
        /* Subtle bottom gradient for readability */
        .landing-bg::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.12) 0%,
                rgba(0,0,0,0.08) 25%,
                rgba(255,255,255,0.05) 50%,
                rgba(0,0,0,0.15) 70%,
                rgba(0,0,0,0.45) 90%,
                rgba(0,0,0,0.55) 100%
            );
        }

        .landing-content {
            position: relative; z-index: 1;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 15vh 1.5rem 3rem;
            max-width: 420px; margin: 0 auto;
        }

        /* ===== Outlined "FRIEND LIST" Title ===== */
        .brand-title {
            font-family: 'Inter', 'Arial Black', sans-serif;
            font-size: 3rem; font-weight: 900; letter-spacing: 0.15em;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255,255,255,0.85);
            text-shadow:
                0 0 30px rgba(255,255,255,0.15),
                0 2px 8px rgba(0,0,0,0.2);
            user-select: none;
            line-height: 1;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3));
        }
        /* Horizontal lines inside letters */
        .brand-title span {
            background: repeating-linear-gradient(
                0deg,
                transparent, transparent 3px,
                rgba(255,255,255,0.2) 3px, rgba(255,255,255,0.2) 4px
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255,255,255,0.85);
        }

        /* ===== Login Area ===== */
        .login-area {
            width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 1.5rem; padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .login-label {
            color: rgba(255,255,255,0.85); font-size: 0.8rem; font-weight: 500; align-self: flex-start;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            margin-bottom: 0.25rem;
        }
        .login-row {
            display: flex; align-items: center; gap: 0; width: 100%;
        }
        .login-input {
            flex: 1; height: 44px; border: 1.5px solid rgba(255,255,255,0.25); border-right: none;
            border-radius: 22px 0 0 22px; padding: 0 18px;
            font-size: 0.8rem; color: #1a1a1a; background: rgba(255,255,255,0.85);
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .login-input::placeholder { color: #888; }
        .login-input:focus { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.95); }
        .login-btn {
            width: 44px; height: 44px; border-radius: 0 22px 22px 0;
            background: rgba(45,138,78,0.9); border: 1.5px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: background 150ms;
        }
        .login-btn:active { background: rgba(35,107,61,0.95); }
        .login-btn svg { width: 18px; height: 18px; }

        /* ===== Demo Button ===== */
        .demo-btn {
            width: 100%; height: 40px; border-radius: 20px;
            border: 1.5px dashed rgba(255,255,255,0.35); background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.85); font-size: 0.75rem; font-weight: 500;
            cursor: pointer; transition: background 150ms;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .demo-btn:active { background: rgba(255,255,255,0.18); }

        /* ===== Footer Links ===== */
        .footer-links {
            display: flex; align-items: center; gap: 1.5rem;
        }
        .footer-links a {
            color: rgba(255,255,255,0.6); font-size: 0.7rem; text-decoration: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            transition: color 150ms;
        }
        .footer-links a:hover { color: rgba(255,255,255,0.9); }
        .footer-sep { color: rgba(255,255,255,0.25); font-size: 0.6rem; }

        /* ===== Contact Modal ===== */
        .contact-modal {
            position: fixed; inset: 0; z-index: 100; display: none;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
        }
        .contact-modal.show { display: flex; }
        .contact-card {
            background: rgba(255,255,255,0.92); backdrop-filter: blur(16px);
            border-radius: 1.5rem; padding: 2rem 1.5rem; width: 85%; max-width: 300px;
            text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .contact-card h3 { color: #1a1a1a; font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; }
        .contact-item { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; text-align: left; }
        .contact-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; }
        .contact-label { font-size: 0.65rem; color: #888; }
        .contact-value { font-size: 0.8rem; color: #1a1a1a; font-weight: 500; }
        .contact-close { margin-top: 0.5rem; padding: 8px 32px; border-radius: 20px; border: 1px solid #ddd; background: transparent; color: #666; font-size: 0.75rem; cursor: pointer; }
        .contact-close:active { background: #f0f0f0; }

        /* ===== Slide-up animation ===== */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-up { animation: fadeSlideUp 500ms cubic-bezier(0.16,1,0.3,1) both; }
    </style>
</head>
<body>
    <!-- Full-screen background -->
    <div class="landing-bg"></div>

    <!-- Content overlay -->
    <div class="landing-content">
        <!-- Title -->
        <div class="anim-up" style="animation-delay:0ms;">
            <h1 class="brand-title"><span>FRIEND LIST</span></h1>
        </div>

        <!-- Login Area -->
        <div class="login-area anim-up" style="animation-delay:200ms;">
            <div class="login-label">登录：</div>
            <div class="login-row">
                <input class="login-input" type="password" placeholder="请输入卡片密钥" >
                <button class="login-btn" data-dom-id="btn-login">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>

            <!-- Demo button -->
            <button class="demo-btn" data-dom-id="btn-demo"> 一键体验Demo</button>

            <!-- Error hint (hidden) -->
            <p id="error-hint" style="display:none; color:#c0392b; font-size:0.75rem; text-align:center;">已错误 1/5 次</p>
        </div>

        <!-- Footer -->
        <div class="footer-links anim-up" style="animation-delay:400ms;">
            <a href="javascript:void(0)">联系我们</a>
            <span class="footer-sep">|</span>
            <a href="javascript:void(0)" data-dom-id="link-loss-report">卡片挂失</a>
        </div>
    </div>

    <!-- Contact Us Modal -->
    <div id="contactModal" class="contact-modal">
        <div class="contact-card">
            <h3>联系我们</h3>
            <div class="contact-item">
                <div class="contact-icon" style="background:#f0f0f0;">📧</div>
                <div><div class="contact-label">邮箱</div><div class="contact-value">support@friendlist.cn</div></div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;margin-top:0.5rem;">
                <div class="contact-label">微信扫码联系我们</div>
                <div style="width:120px;height:120px;background:white;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;">
                    <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
                        <rect width="96" height="96" rx="8" fill="white"/>
                        <rect x="8" y="8" width="80" height="80" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
                        <rect x="16" y="16" width="12" height="12" rx="2" fill="#1f2937"/>
                        <rect x="32" y="16" width="8" height="8" rx="1" fill="#374151"/>
                        <rect x="44" y="16" width="16" height="4" rx="1" fill="#9ca3af"/>
                        <rect x="44" y="24" width="12" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="16" y="32" width="8" height="4" rx="1" fill="#9ca3af"/>
                        <rect x="28" y="32" width="20" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="52" y="32" width="16" height="4" rx="1" fill="#9ca3af"/>
                        <rect x="16" y="40" width="16" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="36" y="40" width="8" height="4" rx="1" fill="#9ca3af"/>
                        <rect x="48" y="40" width="20" height="4" rx="1" fill="#374151"/>
                        <rect x="16" y="48" width="12" height="4" rx="1" fill="#374151"/>
                        <rect x="32" y="48" width="16" height="4" rx="1" fill="#9ca3af"/>
                        <rect x="52" y="48" width="8" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="16" y="56" width="20" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="40" y="56" width="12" height="4" rx="1" fill="#374151"/>
                        <rect x="56" y="56" width="16" height="4" rx="1" fill="#9ca3af"/>
                        <rect x="16" y="64" width="8" height="8" rx="2" fill="#374151"/>
                        <rect x="28" y="64" width="12" height="4" rx="1" fill="#9ca3af"/>
                        <rect x="44" y="64" width="20" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="28" y="72" width="16" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="48" y="72" width="8" height="4" rx="1" fill="#374151"/>
                        <rect x="60" y="64" width="12" height="12" rx="2" fill="#374151"/>
                        <rect x="16" y="72" width="8" height="8" rx="2" fill="#9ca3af"/>
                    </svg>
                </div>
                <div class="contact-label" style="font-size:0.6rem;color:#aaa;">（演示二维码）</div>
            </div>
            <button class="contact-close" id="closeContact">关闭</button>
        </div>
    </div>

    <script>
        document.querySelector('.footer-links a').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('contactModal').classList.add('show');
        });
        document.getElementById('closeContact').onclick = function() {
            document.getElementById('contactModal').classList.remove('show');
        };
        document.getElementById('contactModal').onclick = function(e) {
            if (e.target === this) this.classList.remove('show');
        };
    </script>
</body>
</html>
