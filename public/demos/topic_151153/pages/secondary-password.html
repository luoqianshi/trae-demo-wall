<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二级密码验证</title>
    <style id="theme-vars">
/* Friend List Holder H5 — Brand Design Tokens */
/* Dark theme + Glassmorphism + Brand Blue accent */

:root {
  /* — Backgrounds — */
  --bg-deepest: #0b101e;
  --bg-card-mid: #172033;
  --bg-card-top: #1e293b;
  --bg-card-gradient: linear-gradient(135deg, var(--bg-card-top) 0%, var(--bg-deepest) 100%);
  --bg-glass: rgba(30, 41, 59, 0.6);
  --bg-glass-strong: rgba(30, 41, 59, 0.8);

  /* — Text — */
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-tertiary: #94a3b8;
  --text-weak: #64748b;

  /* — Brand — */
  --brand-500: #3b82f6;
  --brand-600: #2563eb;

  /* — Accent colors — */
  --violet-400: #8b5cf6;
  --amber-400: #f59e0b;
  --pink-400: #ec4899;
  --emerald-400: #22c55e;
  --rose-400: #f43f5e;
  --rose-500: #f43f5e;
  --rose-600: #e11d48;

  /* — Borders — */
  --border-card: #1e293b;
  --border-outer: #334155;

  /* — Typography — */
  --font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* — Radius — */
  --radius-card: 1.5rem;
  --radius-input: 1.5rem;
  --radius-btn: 1.5rem;
  --radius-avatar: 9999px;

  /* — Shadows — */
  --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.25);
  --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.3);

  /* — Spacing — */
  --page-padding: 1.25rem;
  --card-padding: 1.25rem;
  --card-gap: 1rem;

  /* — Animations — */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --duration-slide-up: 400ms;
  --duration-fade-in: 300ms;
  --duration-toggle: 300ms;

  /* — Glass blur — */
  --blur-glass: 24px;

  /* — Safe area — */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-family); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .slide-up {
        animation: slideUp 400ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: #f0f4f8;">
    <div style="position:fixed;inset:0;z-index:0;background:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80') center center/cover no-repeat;background-color:#8bafc4;"></div>
    <div style="position:fixed;inset:0;z-index:1;background:rgba(240,244,248,0.75);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);"></div>

    <div style="position:relative;z-index:2;">
    <main class="flex flex-col items-center justify-start min-h-screen px-5 py-6 max-w-md mx-auto">

        <!-- Back Button -->
        <div class="w-full slide-up" style="animation-delay: 0ms;">
            <button data-dom-id="btn-back" class="text-[#64748b] hover:text-[#1e293b] text-sm font-medium transition-colors duration-200 active:opacity-70 cursor-pointer">
                &larr; 返回
            </button>
        </div>

        <!-- Title Card -->
        <div class="w-full mt-8 slide-up" style="animation-delay: 100ms;">
            <div class="rounded-3xl border border-[#e2e8f0] p-5 shadow-lg" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow: 0 4px 12px -2px rgba(0,0,0,0.06);">
                <p class="text-lg font-bold text-[#1e293b] text-center">该卡片已开启二级密码</p>
            </div>
        </div>

        <!-- Input Card -->
        <div class="w-full mt-4 slide-up" style="animation-delay: 200ms;">
            <div class="rounded-3xl border border-[#e2e8f0] p-5 shadow-lg" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow: 0 4px 12px -2px rgba(0,0,0,0.06);">
                <div class="relative">
                    <input
                        id="password-input"
                        type="password"
                        placeholder="输入二级密码"
                        class="w-full backdrop-blur-xl border border-[#e2e8f0] rounded-3xl px-5 py-3.5 pr-12 text-[#1e293b] placeholder-[#94a3b8] text-base outline-none focus:border-[#2d8a4e] focus:ring-1 focus:ring-[#2d8a4e] transition-colors duration-200"
                        style="background:rgba(255,255,255,0.9)"
                    >
                    <button
                        id="toggle-password"
                        type="button"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-[#64748b] hover:text-[#1e293b] transition-colors duration-200 cursor-pointer"
                        aria-label="切换密码可见性"
                    >
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Confirm Button -->
        <div class="w-full mt-4 slide-up" style="animation-delay: 300ms;">
            <button
                data-dom-id="btn-verify"
                class="w-full bg-[#2d8a4e] hover:bg-[#236b3d] text-white font-semibold rounded-3xl py-3.5 text-base transition-colors duration-200 active:scale-95 cursor-pointer"
            >
                确 认
            </button>
        </div>

        <!-- Forgot Password Card -->
        <div class="w-full mt-4 slide-up" style="animation-delay: 400ms;">
            <div class="rounded-3xl border border-[#e2e8f0] p-5 shadow-lg" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow: 0 4px 12px -2px rgba(0,0,0,0.06);">
                <p class="text-center text-[#2d8a4e] hover:text-[#236b3d] transition-colors duration-200 cursor-pointer text-sm">忘记密码？联系发卡人</p>
            </div>
        </div>

    </main>
    </div>

    <script>
        lucide.createIcons();

        // Toggle password visibility
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password-input');
        const eyeIcon = document.getElementById('eye-icon');
        const eyeOffIcon = document.getElementById('eye-off-icon');

        toggleBtn.addEventListener('click', function () {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.classList.toggle('hidden', isPassword);
            eyeOffIcon.classList.toggle('hidden', !isPassword);
        });
    </script>
</body>
</html>
