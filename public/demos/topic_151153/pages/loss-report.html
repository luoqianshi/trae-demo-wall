<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片挂失</title>
    <style id="theme-vars">
/* Friend List Holder H5 — Brand Design Tokens */
/* Dark theme + Glassmorphism + Brand Blue accent */

:root {
  /* — Backgrounds — */
  --bg-deepest: #0b101e;
  --bg-card-mid: #172033;
  --bg-card-top: #1e293b;
  --bg-card-gradient: linear-gradient(135deg, var(--bg-card-top) 0%, var(--bg-deepest) 100%);
  --bg-glass: rgba(30, 41, 59, 0.6);
  --bg-glass-strong: rgba(30, 41, 59, 0.8);

  /* — Text — */
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-tertiary: #94a3b8;
  --text-weak: #64748b;

  /* — Brand — */
  --brand-500: #3b82f6;
  --brand-600: #2563eb;

  /* — Accent colors — */
  --violet-400: #8b5cf6;
  --amber-400: #f59e0b;
  --pink-400: #ec4899;
  --emerald-400: #22c55e;
  --rose-400: #f43f5e;
  --rose-500: #f43f5e;
  --rose-600: #e11d48;

  /* — Borders — */
  --border-card: #1e293b;
  --border-outer: #334155;

  /* — Typography — */
  --font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* — Radius — */
  --radius-card: 1.5rem;
  --radius-input: 1.5rem;
  --radius-btn: 1.5rem;
  --radius-avatar: 9999px;

  /* — Shadows — */
  --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.25);
  --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.3);

  /* — Spacing — */
  --page-padding: 1.25rem;
  --card-padding: 1.25rem;
  --card-gap: 1rem;

  /* — Animations — */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --duration-slide-up: 400ms;
  --duration-fade-in: 300ms;
  --duration-toggle: 300ms;

  /* — Glass blur — */
  --blur-glass: 24px;

  /* — Safe area — */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: #f0f4f8; color: #1e293b;">
    <div style="position:fixed;inset:0;z-index:0;background:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80') center center/cover no-repeat;background-color:#8bafc4;"></div>
    <div style="position:fixed;inset:0;z-index:1;background:rgba(240,244,248,0.75);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);"></div>

    <div style="position:relative;z-index:2;">

    <style>
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-slide-up {
        animation: slideUp var(--duration-slide-up) var(--ease-out-expo) both;
      }
    </style>

    <main class="flex flex-col items-center justify-start min-h-screen px-[var(--page-padding)] pt-[calc(var(--safe-top)+1rem)] pb-[calc(var(--safe-bottom)+2rem)] max-w-md mx-auto w-full">

      <!-- Back Button -->
      <button
        data-dom-id="btn-back-loss"
        class="self-start text-[#64748b] hover:text-[#1e293b] text-sm transition-colors duration-200 mb-6"
      >
        ← 返回
      </button>

      <!-- Title Card -->
      <div
        class="w-full text-center mb-8 animate-slide-up"
        style="animation-delay: 100ms;"
      >
        <h1 class="text-xl font-bold text-[#1e293b]">卡片挂失</h1>
      </div>

      <!-- Input Card -->
      <div
        class="w-full rounded-[var(--radius-card)] p-[var(--card-padding)] mb-[var(--card-gap)] animate-slide-up"
        style="
          background: rgba(255, 255, 255, 0.8);
          backdrop-filter: blur(var(--blur-glass));
          -webkit-backdrop-filter: blur(var(--blur-glass));
          border: 1px solid #e2e8f0;
          box-shadow: 0 4px 12px -2px rgba(0,0,0,0.06);
          animation-delay: 200ms;
        "
      >
        <label class="block text-sm text-[#64748b] mb-3">请输入个人ID：</label>
        <input
          type="text"
          placeholder="输入你的个人ID"
          class="w-full px-5 py-3 text-[#1e293b] placeholder-[#94a3b8] rounded-[var(--radius-input)] text-sm outline-none transition-colors duration-200"
          style="
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #e2e8f0;
          "
          onfocus="this.style.borderColor='var(--rose-500)'"
          onblur="this.style.borderColor='#e2e8f0'"
        />
      </div>

      <!-- Warning Card -->
      <div
        class="w-full rounded-[var(--radius-card)] p-[var(--card-padding)] mb-[var(--card-gap)] animate-slide-up"
        style="
          background: rgba(244, 63, 94, 0.06);
          backdrop-filter: blur(var(--blur-glass));
          -webkit-backdrop-filter: blur(var(--blur-glass));
          border: 1px solid rgba(244, 63, 94, 0.3);
          box-shadow: 0 4px 12px -2px rgba(0,0,0,0.06);
          animation-delay: 300ms;
        "
      >
        <div class="flex items-center gap-2">
          <span class="text-rose-400 text-xs">&#x26A0;&#xFE0F;</span>
          <span class="text-rose-400 text-xs">需联系发卡人重置新卡</span>
        </div>
      </div>

      <!-- Submit Button -->
      <div
        class="w-full animate-slide-up"
        style="animation-delay: 400ms;"
      >
        <button
          class="w-full py-3.5 text-white font-semibold rounded-[var(--radius-btn)] text-sm transition-all duration-200 active:scale-95"
          style="
            background: var(--rose-500);
            box-shadow: 0 8px 20px -4px rgba(244, 63, 94, 0.4);
          "
          onmouseenter="this.style.background='var(--rose-600)'"
          onmouseleave="this.style.background='var(--rose-500)'"
          ontouchstart="this.style.background='var(--rose-600)'"
          ontouchend="this.style.background='var(--rose-500)'"
        >
          确认挂失
        </button>
      </div>

    </main>

    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
