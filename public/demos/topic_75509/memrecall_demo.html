<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MemRecall · 个人记忆助手 - 交互式演示</title>
<style>
/* ===== 主题变量 ===== */
:root,[data-theme="dark"]{
--bg-primary:#0a0a1a;--bg-secondary:#0f0f23;--bg-card:#13132b;--bg-hover:#1a1a3a;--bg-input:#0d0d20;
--accent-primary:#5b4aff;--accent-secondary:#7c6fff;--accent-hover:#4a3aff;--accent-soft:rgba(91,74,255,.15);
--text-primary:#e2e8f0;--text-secondary:#a0aec0;--text-muted:#718096;
--border-color:#2d2d4a;--border-soft:rgba(255,255,255,.06);
--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 24px rgba(0,0,0,.5);--shadow-glow:0 0 20px rgba(91,74,255,.3);
--success:#48bb78;--warning:#ed8936;--danger:#f56565;--info:#4299e1;
--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--transition-fast:.15s ease;--transition-base:.25s ease
}
[data-theme="light"]{
--bg-primary:#f8f7ff;--bg-secondary:#f0efff;--bg-card:#fff;--bg-hover:#edeaff;--bg-input:#fff;
--accent-primary:#6b5cff;--accent-secondary:#8b7dff;--accent-hover:#5a4cff;--accent-soft:rgba(107,92,255,.1);
--text-primary:#1e1b4b;--text-secondary:#4a4a6a;--text-muted:#718096;
--border-color:#e2e0f0;--border-soft:rgba(0,0,0,.05);
--shadow-sm:0 1px 2px rgba(107,92,255,.08);--shadow-md:0 4px 12px rgba(107,92,255,.12);--shadow-lg:0 8px 24px rgba(107,92,255,.16);--shadow-glow:0 0 20px rgba(107,92,255,.2);
--success:#38a169;--warning:#dd6b20;--danger:#e53e3e;--info:#3182ce
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;overflow:hidden}
body{font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);font-size:14px;display:flex;flex-direction:column}
[x-cloak]{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg-secondary)}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--accent-primary)}

/* ===== 顶部栏 ===== */
.app-header{height:56px;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:12px}
.logo svg{display:block}
.app-title{font-size:16px;font-weight:600;letter-spacing:.5px}
.header-right{display:flex;align-items:center;gap:4px}
.icon-btn{width:36px;height:36px;border:none;background:transparent;color:var(--text-secondary);border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all var(--transition-fast)}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.icon-btn-danger:hover{background:rgba(245,101,101,.15);color:var(--danger)}

/* ===== 主区域三栏 ===== */
.app-main{flex:1;display:flex;overflow:hidden;min-height:0}

/* 左侧栏 */
.sidebar-left{width:200px;background:var(--bg-secondary);border-right:1px solid var(--border-color);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px}
.sidebar-content{flex:1;overflow-y:auto;padding:8px}
.sidebar-footer{padding:12px;border-top:1px solid var(--border-color)}
.empty-hint{padding:24px 12px;text-align:center;color:var(--text-muted);font-size:12px}
.history-item{padding:10px 12px;border-radius:var(--radius-md);cursor:pointer;transition:all var(--transition-fast);display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.history-item:hover{background:var(--bg-hover)}
.history-text{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-time{font-size:11px;color:var(--text-muted);font-family:"JetBrains Mono",monospace}

/* 中间主区域 */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.search-box-wrapper{padding:16px 20px;border-bottom:1px solid var(--border-color);background:var(--bg-secondary);flex-shrink:0}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:4px 4px 4px 16px;transition:all var(--transition-fast)}
.search-box:focus-within{border-color:var(--accent-primary);box-shadow:var(--shadow-glow)}
.search-icon{font-size:16px;color:var(--text-muted)}
.search-input{flex:1;border:none;background:transparent;color:var(--text-primary);font-size:14px;padding:10px 0;outline:none;font-family:inherit}
.search-input::placeholder{color:var(--text-muted)}
.filter-bar{padding:12px 20px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--border-color);background:var(--bg-secondary);flex-wrap:wrap;flex-shrink:0}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-label{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.filter-value{font-size:12px;color:var(--accent-primary);font-family:"JetBrains Mono",monospace;min-width:24px}
select{background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-primary);padding:4px 8px;border-radius:var(--radius-md);font-size:12px;font-family:inherit;outline:none}
select:focus{border-color:var(--accent-primary)}
input[type=range]{-webkit-appearance:none;width:80px;height:4px;background:var(--border-color);border-radius:4px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent-primary);border-radius:50%;cursor:pointer}
.main-scroll-area{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column}

/* 右侧栏 */
.sidebar-right{width:260px;background:var(--bg-secondary);border-left:1px solid var(--border-color);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.panel{border-bottom:1px solid var(--border-color)}
.panel-header{padding:14px 16px;border-bottom:1px solid var(--border-soft)}
.panel-header h3{font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px}
.panel-content{padding:12px 16px}
.entity-section{margin-bottom:16px}
.entity-section:last-child{margin-bottom:0}
.entity-section-title{font-size:12px;color:var(--text-secondary);margin-bottom:8px;font-weight:500}
.entity-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition-fast);margin-bottom:2px}
.entity-item:hover{background:var(--bg-hover)}
.entity-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entity-count{font-size:11px;color:var(--text-muted);font-family:"JetBrains Mono",monospace;flex-shrink:0;margin-left:8px}
.checkbox-item{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.checkbox-item:hover{color:var(--accent-primary)}
.checkbox-item input[type=checkbox]{-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--border-color);border-radius:3px;background:var(--bg-input);cursor:pointer;position:relative}
.checkbox-item input[type=checkbox]:checked{background:var(--accent-primary);border-color:var(--accent-primary)}
.checkbox-item input[type=checkbox]:checked::after{content:"✓";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:11px;font-weight:bold}
.checkbox-label{font-size:13px;user-select:none}

/* 底部状态栏 */
.app-footer{height:32px;background:var(--bg-secondary);border-top:1px solid var(--border-color);display:flex;align-items:center;padding:0 20px;gap:24px;flex-shrink:0;font-size:12px}
.status-item{display:flex;align-items:center;gap:6px}
.status-label{color:var(--text-muted)}
.status-value{color:var(--text-secondary);font-family:"JetBrains Mono",monospace}
.status-ok{color:var(--success)}
.status-warn{color:var(--warning)}

/* 搜索结果 */
.results-area{padding:20px}
.results-list{display:flex;flex-direction:column;gap:12px}
.result-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:16px;transition:all var(--transition-base);cursor:pointer}
.result-card:hover{border-color:var(--accent-primary);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.result-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.result-score{display:flex;align-items:center;gap:6px}
.score-stars{color:var(--warning);font-size:12px;letter-spacing:1px}
.score-value{font-size:11px;color:var(--text-muted);font-family:"JetBrains Mono",monospace}
.result-type-tag{display:inline-block;padding:2px 10px;border-radius:var(--radius-sm);font-size:11px;font-weight:500}
.type-wechat{background:rgba(7,193,96,.15);color:#07c160}
.type-email{background:rgba(244,124,50,.15);color:#f47c32}
.type-calendar{background:rgba(217,83,79,.15);color:#d9534f}
.type-note{background:var(--accent-soft);color:var(--accent-primary)}
.result-source{font-size:11px;color:var(--accent-primary);background:var(--accent-soft);padding:2px 8px;border-radius:var(--radius-sm)}
.result-time{font-size:11px;color:var(--text-muted);font-family:"JetBrains Mono",monospace;margin-left:auto}
.result-meta{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 0 8px 0;font-size:12px;color:var(--text-secondary);border-bottom:1px dashed var(--border-soft);margin-bottom:8px}
.meta-participants{color:var(--text-primary);font-weight:500}
.result-content{color:var(--text-primary);font-size:14px;line-height:1.7;margin-bottom:8px}
.result-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border-soft)}
.footer-label{font-size:11px;color:var(--text-muted)}
.entity-tag{font-size:11px;color:var(--accent-secondary);background:var(--accent-soft);padding:2px 8px;border-radius:var(--radius-sm)}
.empty-results,.loading-results{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--text-muted);text-align:center}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.6}
.empty-results p{font-size:16px}
.empty-sub{font-size:13px!important;opacity:.7}
.spinner{width:40px;height:40px;border:3px solid var(--border-color);border-top-color:var(--accent-primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 按钮 */
.btn{border:none;border-radius:var(--radius-md);padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;transition:all var(--transition-fast);font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn-primary{background:var(--accent-primary);color:#fff}
.btn-primary:hover{background:var(--accent-hover);box-shadow:var(--shadow-glow)}
.btn-secondary{background:var(--bg-hover);color:var(--text-primary);border:1px solid var(--border-color)}
.btn-secondary:hover{background:var(--border-color)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{width:100%}
.btn-group{display:flex;gap:8px}
.btn-group .btn{flex:1}
.text-input{background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-primary);padding:6px 10px;border-radius:var(--radius-md);font-size:13px;font-family:inherit;outline:none;transition:all var(--transition-fast)}
.text-input:focus{border-color:var(--accent-primary)}
.text-input-block{width:100%;margin-top:8px}

/* narrative区域 */
.narrative-area{margin:16px 20px 0;background:linear-gradient(135deg,var(--bg-card),var(--bg-secondary));border:1px solid var(--accent-soft);border-radius:var(--radius-lg);padding:16px 20px;box-shadow:var(--shadow-glow)}
.narrative-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.narrative-icon{font-size:18px}
.narrative-title{font-size:14px;font-weight:600;color:var(--accent-secondary);flex:1}
.narrative-confidence{font-size:12px;padding:2px 10px;border-radius:12px;font-weight:500}
.confidence-high{background:rgba(72,187,120,.15);color:var(--success);border:1px solid rgba(72,187,120,.3)}
.narrative-body{font-size:15px;line-height:1.7;margin-bottom:10px}
.narrative-facts{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-color)}
.facts-label{font-size:12px;color:var(--text-secondary);margin-bottom:6px;font-weight:500}
.fact-item{font-size:13px;color:var(--text-secondary);padding:4px 0 4px 16px;position:relative;line-height:1.5}
.fact-item::before{content:"▸";position:absolute;left:0;color:var(--accent-secondary)}

/* 弹窗 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);width:520px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px}
.modal-body{padding:20px}
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-soft)}
.setting-item:last-child{border-bottom:none}
.setting-item label{font-size:13px;color:var(--text-secondary)}
.setting-control{display:flex;align-items:center;gap:8px}

/* toast */
.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:var(--radius-md);font-size:13px;z-index:2000;box-shadow:var(--shadow-lg);cursor:pointer;display:none}
.toast.show{display:block}
.toast-error{background:var(--danger);color:#fff}

/* 模拟展示提示 */
.demo-badge{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--warning);color:#1e1b4b;padding:4px 16px;border-radius:0 0 8px 8px;font-size:12px;font-weight:600;z-index:99;pointer-events:none;opacity:.9}

/* 响应式 - 窄屏时隐藏侧栏 */
@media(max-width:900px){
.sidebar-left,.sidebar-right{display:none}
.app-footer{gap:12px;font-size:11px;flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="demo-badge">🎯 交互式演示 · 模拟实际界面</div>

<!-- ===== 顶部标题栏 ===== -->
<header class="app-header">
  <div class="header-left">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="12" stroke="var(--accent-primary)" stroke-width="2"/><path d="M9 14 L13 18 L20 10" stroke="var(--accent-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1 class="app-title">MemRecall · 个人记忆助手</h1>
  </div>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
    <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
    <button class="icon-btn icon-btn-danger" onclick="showToast('窗口关闭（演示模式）')">✕</button>
  </div>
</header>

<!-- ===== 主体三栏 ===== -->
<main class="app-main">
  <!-- 左侧栏 -->
  <aside class="sidebar-left">
    <div class="sidebar-header"><h2>搜索历史</h2></div>
    <div class="sidebar-content" id="historyList"></div>
    <div class="sidebar-footer">
      <button class="btn btn-primary btn-block" onclick="showToast('📥 数据导入（演示模式）')">📥 导入数据源</button>
      <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="showToast('📤 导出记忆（演示模式）')">📤 导出记忆</button>
    </div>
  </aside>

  <!-- 中间主区域 -->
  <section class="main-area">
    <!-- 搜索框 -->
    <div class="search-box-wrapper">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="输入要回忆的内容... (回车搜索)" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn btn-primary" id="searchBtn" onclick="doSearch()">搜索</button>
      </div>
    </div>

    <!-- 过滤栏 -->
    <div class="filter-bar">
      <div class="filter-group">
        <label class="filter-label">最小置信度:</label>
        <input type="range" min="0" max="1" step="0.1" value="0.5" id="confSlider" oninput="document.getElementById('confVal').textContent=parseFloat(this.value).toFixed(1)">
        <span class="filter-value" id="confVal">0.5</span>
      </div>
      <div class="filter-group">
        <label class="filter-label">时间范围:</label>
        <select id="timeRange"><option value="all">全部时间</option><option value="today">今天</option><option value="week">最近一周</option><option value="month">最近一月</option><option value="year">最近一年</option></select>
      </div>
      <div class="filter-group">
        <label class="filter-label">搜索模式:</label>
        <select id="searchMode"><option value="qa">问答模式</option><option value="keyword">关键词模式</option><option value="semantic">语义模式</option></select>
      </div>
    </div>

    <!-- 可滚动区域 -->
    <div class="main-scroll-area" id="scrollArea">
      <!-- 默认空状态 -->
      <div id="defaultView">
        <div class="empty-results">
          <div class="empty-icon">💭</div>
          <p>开始你的记忆探索之旅</p>
          <p class="empty-sub">输入关键词或问题，MemRecall 将帮你找回遗忘的瞬间</p>
        </div>
      </div>
      <!-- 叙事回答区 -->
      <div id="narrativeArea" style="display:none"></div>
      <!-- 结果列表 -->
      <div class="results-area" id="resultsArea"></div>
    </div>
  </section>

  <!-- 右侧栏 -->
  <aside class="sidebar-right">
    <!-- 实体面板 -->
    <div class="panel">
      <div class="panel-header"><h3>实体面板</h3></div>
      <div class="panel-content" id="entityPanel">
        <div class="entity-section"><h4 class="entity-section-title">👤 人物</h4><div id="entityPersons"></div></div>
        <div class="entity-section"><h4 class="entity-section-title">📍 地点</h4><div id="entityPlaces"></div></div>
        <div class="entity-section"><h4 class="entity-section-title">📅 事件</h4><div id="entityEvents"></div></div>
      </div>
    </div>
    <!-- 来源过滤 -->
    <div class="panel">
      <div class="panel-header"><h3>来源过滤</h3></div>
      <div class="panel-content">
        <label class="checkbox-item"><input type="checkbox" value="wechat" checked onchange="doSearch()"><span class="checkbox-label">💬 微信</span></label>
        <label class="checkbox-item"><input type="checkbox" value="email" checked onchange="doSearch()"><span class="checkbox-label">📧 邮件</span></label>
        <label class="checkbox-item"><input type="checkbox" value="note" checked onchange="doSearch()"><span class="checkbox-label">📝 笔记</span></label>
        <label class="checkbox-item"><input type="checkbox" value="calendar" checked onchange="doSearch()"><span class="checkbox-label">📅 日历</span></label>
      </div>
    </div>
    <!-- 遗忘操作 -->
    <div class="panel">
      <div class="panel-header"><h3>选择性遗忘</h3></div>
      <div class="panel-content">
        <select id="forgetMode" class="text-input" style="width:100%"><option value="person">按人物</option><option value="topic">按主题</option><option value="time">按时间</option><option value="source">按来源</option></select>
        <input type="text" class="text-input text-input-block" id="forgetValue" placeholder="输入要遗忘的内容...">
        <div class="btn-group" style="margin-top:8px">
          <button class="btn btn-secondary btn-sm" onclick="showToast('🔍 预览模式：未实际删除（演示）')">预览</button>
          <button class="btn btn-danger btn-sm" onclick="showToast('🧹 遗忘操作已执行（演示模拟）')">遗忘</button>
        </div>
      </div>
    </div>
  </aside>
</main>

<!-- 底部状态栏 -->
<footer class="app-footer">
  <div class="status-item"><span class="status-label">记忆库:</span><span class="status-value" id="statusCount">20 条</span></div>
  <div class="status-item"><span class="status-label">模型版本:</span><span class="status-value" id="statusModel">skipgram v1.0 · siamese v1.0</span></div>
  <div class="status-item"><span class="status-label">加密:</span><span class="status-value status-ok" id="statusCrypto">已启用 🔒</span></div>
  <div class="status-item"><span class="status-label">状态:</span><span class="status-value status-ok">● 离线可用</span></div>
</footer>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header"><h3>设置</h3><button class="icon-btn" onclick="toggleSettings()">✕</button></div>
    <div class="modal-body">
      <div class="setting-item"><label>主题</label><div class="setting-control"><button class="btn btn-secondary btn-sm" onclick="toggleTheme()">🌓 切换</button></div></div>
      <div class="setting-item"><label>最小置信度</label><div class="setting-control"><input type="range" min="0" max="1" step="0.1" value="0.5" oninput="document.getElementById('confVal2').textContent=parseFloat(this.value).toFixed(1)"><span id="confVal2">0.5</span></div></div>
      <div class="setting-item"><label>刷新数据</label><div class="setting-control"><button class="btn btn-primary btn-sm" onclick="showToast('🔄 数据已刷新');toggleSettings()">刷新</button></div></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast toast-error" id="toast" onclick="this.classList.remove('show')"></div>

<script>
// ===== 样本数据 =====
const DATA = [
  {id:1,type:'wechat',label:'微信消息',score:.92,source:'工作群聊',time:'2024-01-15 14:30',content:'下午3点开项目评审会，请大家准备好材料',sender:'王经理',receivers:'全体成员',entities:['王经理','评审会','Q1项目']},
  {id:2,type:'email',label:'邮件',score:.88,source:'finance@company.com',time:'2024-01-15 10:15',content:'关于Q1预算审批的回复：已批准，请按照计划执行',meta:'主题: Re: Q1预算申请 | 收件人: me@company.com',entities:['Q1预算','finance']},
  {id:3,type:'calendar',label:'日历事件',score:.95,source:'日历',time:'2024-01-14 09:00',content:'与客户进行产品演示会议',meta:'标题: 产品演示 | 地点: 线上会议',entities:['客户','产品演示']},
  {id:4,type:'note',label:'笔记',score:.91,source:'我的笔记',time:'2024-01-13 16:45',content:'项目进度：完成80%，预计下周可以交付初版',meta:'标签: 工作、项目、进度',entities:['项目进度']},
  {id:5,type:'wechat',label:'微信消息',score:.76,source:'球友群',time:'2024-01-12 18:20',content:'周末一起打篮球吗？老地方见',sender:'小李',receivers:'全体',entities:['小李']},
  {id:6,type:'email',label:'邮件',score:.84,source:'hr@company.com',time:'2024-01-11 15:30',content:'邀请您参加技术分享会，主题是AI在记忆管理中的应用',meta:'主题: 技术分享会邀请',entities:['技术分享会']},
  {id:7,type:'calendar',label:'日历事件',score:.97,source:'日历',time:'2024-01-10 14:00',content:'项目启动会议，讨论Q1目标和里程碑',meta:'标题: Q1项目启动会 | 地点: 会议室A',entities:['Q1项目','张三','李四','王五']},
  {id:8,type:'wechat',label:'微信消息',score:.93,source:'工作群聊',time:'2024-01-10 09:00',content:'早，新年开工大吉，Q1项目今天正式启动。',sender:'张三',receivers:'李四、王五',entities:['张三','Q1项目']},
  {id:9,type:'note',label:'笔记',score:.82,source:'我的笔记',time:'2024-01-09 20:00',content:'读书笔记：《深度学习》第5章，循环神经网络部分',meta:'标签: 学习、AI',entities:['深度学习']},
  {id:10,type:'email',label:'邮件',score:.79,source:'service@shop.com',time:'2024-01-08 11:20',content:'您的订单已发货，预计3天内到达，请留意查收',meta:'主题: 订单发货通知',entities:[]},
  {id:11,type:'wechat',label:'微信消息',score:.87,source:'私聊',time:'2024-01-07 20:10',content:'明天下午方便的话来我办公室一趟，讨论一下晋升材料',sender:'导师',receivers:'我',entities:['导师']},
  {id:12,type:'calendar',label:'日历事件',score:.90,source:'日历',time:'2024-01-06 10:00',content:'团队周会 - 各模块进度同步',meta:'标题: 团队周会',entities:[]},
  {id:13,type:'note',label:'笔记',score:.85,source:'我的笔记',time:'2024-01-05 22:30',content:'明天记得带身份证，出差去深圳拜访客户',meta:'标签: 出差、深圳',entities:['深圳']},
  {id:14,type:'wechat',label:'微信消息',score:.72,source:'好友群',time:'2024-01-04 12:00',content:'中午一起吃饭吗？楼下新开了家川菜馆',sender:'老友',receivers:'我',entities:[]},
  {id:15,type:'email',label:'邮件',score:.94,source:'hr@company.com',time:'2024-01-03 09:45',content:'年度绩效评估结果已发布，请登录系统查看',meta:'主题: 绩效评估通知',entities:['绩效评估']},
];

// ===== 实体数据 =====
const ENTITIES = {
  persons:[{name:'张三',count:4},{name:'李四',count:3},{name:'王五',count:3},{name:'王经理',count:2},{name:'导师',count:1},{name:'小李',count:1}],
  places:[{name:'会议室A',count:2},{name:'深圳',count:1}],
  events:[{name:'Q1项目启动会',count:3},{name:'评审会',count:2},{name:'产品演示',count:1},{name:'技术分享会',count:1},{name:'团队周会',count:1}]
};

// ===== 搜索历史 =====
let history = [];

function addHistory(q){
  if(!q||history.some(h=>h.query===q)) return;
  history.unshift({query:q,time:new Date().toLocaleString()});
  if(history.length>10) history.pop();
  renderHistory();
}

function renderHistory(){
  const el=document.getElementById('historyList');
  if(!history.length){el.innerHTML='<div class="empty-hint">暂无搜索历史</div>';return}
  el.innerHTML=history.map(h=>`<div class="history-item" onclick="document.getElementById('searchInput').value='${h.query.replace(/'/g,"\\'")}';doSearch()"><span class="history-text">${h.query}</span><span class="history-time">${h.time}</span></div>`).join('');
}

// ===== 搜索 =====
function doSearch(){
  const q=document.getElementById('searchInput').value.trim();
  if(!q){document.getElementById('defaultView').style.display='block';document.getElementById('resultsArea').innerHTML='';return}
  document.getElementById('defaultView').style.display='none';

  // 获取来源过滤
  const checked=[...document.querySelectorAll('.checkbox-item input:checked')].map(c=>c.value);

  // 模拟搜索延迟
  const btn=document.getElementById('searchBtn');
  btn.disabled=true;btn.textContent='搜索中...';
  document.getElementById('resultsArea').innerHTML='<div class="loading-results"><div class="spinner"></div><p>正在检索记忆...</p></div>';

  setTimeout(()=>{
    btn.disabled=false;btn.textContent='搜索';
    addHistory(q);
    const kw=q.toLowerCase();
    let results=DATA.filter(d=>checked.includes(d.type)&&(d.content.toLowerCase().includes(kw)||(d.sender&&d.sender.includes(kw))||(d.meta&&d.meta.toLowerCase().includes(kw))||d.entities.some(e=>e.toLowerCase().includes(kw))));
    results.sort((a,b)=>b.score-a.score);
    renderResults(results,q);
  },600);
}

function renderResults(data,q){
  const el=document.getElementById('resultsArea');
  if(!data.length){el.innerHTML='<div class="empty-results"><div class="empty-icon">🔍</div><p>未找到相关记忆</p><p class="empty-sub">试试其他关键词</p></div>';return}

  // 生成叙事回答
  renderNarrative(data,q);

  el.innerHTML='<div class="results-list">'+data.map(r=>{
    const stars=r.score>=.9?'★★★★★':r.score>=.7?'★★★★☆':r.score>=.5?'★★★☆☆':'★★☆☆☆';
    const color={wechat:'#07c160',email:'#f47c32',calendar:'#d9534f',note:'var(--accent-primary)'}[r.type];
    const typeBg={wechat:'rgba(7,193,96,.15)',email:'rgba(244,124,50,.15)',calendar:'rgba(217,83,79,.15)',note:'var(--accent-soft)'}[r.type];
    let meta='';
    if(r.type==='wechat') meta=`<span class="meta-participants">👤 ${r.sender||''} → ${r.receivers||''}</span>`;
    else if(r.meta) meta=`<span>${r.meta}</span>`;

    return `<article class="result-card">
      <div class="result-header">
        <div class="result-score"><span class="score-stars">${stars}</span><span class="score-value">${(r.score*100).toFixed(1)}%</span></div>
        <span class="result-type-tag" style="background:${typeBg};color:${color}">${r.label}</span>
        <span class="result-source">${r.source}</span>
        <span class="result-time">${r.time}</span>
      </div>
      <div class="result-meta">${meta}</div>
      <div class="result-content">${highlight(r.content,q)}</div>
      ${r.entities.length?`<div class="result-footer"><span class="footer-label">相关实体:</span>${r.entities.map(e=>`<span class="entity-tag">${e}</span>`).join('')}</div>`:''}
    </article>`;
  }).join('')+'</div>';
}

function highlight(text,q){
  if(!q) return text;
  const idx=text.toLowerCase().indexOf(q.toLowerCase());
  if(idx===-1) return text;
  return text.slice(0,idx)+'<strong style="color:var(--accent-secondary)">'+text.slice(idx,idx+q.length)+'</strong>'+text.slice(idx+q.length);
}

function renderNarrative(data,q){
  const el=document.getElementById('narrativeArea');
  if(!data.length){el.style.display='none';return}
  const conf=data[0].score;
  const level=conf>=.85?'高':conf>=.7?'中':'低';
  const cls=conf>=.85?'confidence-high':conf>=.7?'confidence-high':'confidence-high';
  const keyFacts=data.slice(0,3).map(r=>`${r.label}「${r.content.slice(0,20)}…」`);
  el.style.display='block';
  el.innerHTML=`<div class="narrative-area">
    <div class="narrative-header">
      <span class="narrative-icon">💬</span>
      <span class="narrative-title">MemRecall 回答</span>
      <span class="narrative-confidence ${cls}">置信度 ${level}</span>
    </div>
    <div class="narrative-body">关于「${q}」，找到了 ${data.length} 条相关记忆。最相关的是 ${data[0].label}：${data[0].content.slice(0,40)}…</div>
    <div class="narrative-facts">
      <div class="facts-label">关键事实：</div>
      ${keyFacts.map(f=>`<div class="fact-item">${f}</div>`).join('')}
    </div>
  </div>`;
}

// ===== 主题 =====
function toggleTheme(){
  const html=document.documentElement;
  html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';
  document.getElementById('themeBtn').textContent=html.dataset.theme==='dark'?'☀️':'🌙';
}

// ===== 设置 =====
function toggleSettings(){
  document.getElementById('settingsModal').classList.toggle('show');
}

// ===== Toast =====
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ===== 实体渲染 =====
function renderEntities(){
  const render=(data,containerId)=>{
    const el=document.getElementById(containerId);
    if(!data.length){el.innerHTML='<div class="empty-hint" style="padding:8px;font-size:11px">暂无</div>';return}
    el.innerHTML=data.map(e=>`<div class="entity-item" onclick="document.getElementById('searchInput').value='${e.name}';doSearch()"><span class="entity-name">${e.name}</span><span class="entity-count">${e.count}次</span></div>`).join('');
  };
  render(ENTITIES.persons,'entityPersons');
  render(ENTITIES.places,'entityPlaces');
  render(ENTITIES.events,'entityEvents');
}

// ===== 初始化 =====
renderEntities();
</script>
</body>
</html>
