<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嘴替 — 谈判练习</title>
<style>
/* ========== Reset & Base ========== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Palette — warm neutrals, Swiss spa */
  --bg:#F7F4F0;--bg-elevated:#FDFBF8;--bg-sunken:#EFEAE3;
  --surface:rgba(255,253,250,0.72);
  --line:#E4DDD3;--line-soft:#EDE8E0;
  --text:#2B2926;--text-secondary:#6B655E;--text-tertiary:#A39C92;
  --accent:#8B7355;--accent-soft:#B8A689;--accent-bg:rgba(139,115,85,0.06);
  --success:#6B8E6B;
  --radius:18px;--radius-sm:12px;--radius-xs:8px;
  --shadow:0 1px 3px rgba(43,41,38,0.04),0 8px 24px rgba(43,41,38,0.06);
  --shadow-sm:0 1px 2px rgba(43,41,38,0.04);
  --transition:0.32s cubic-bezier(0.4,0,0.2,1);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;
  --space-6:32px;--space-7:48px;--space-8:64px;
}
html{font-size:16px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
  color:var(--text);line-height:1.6;
  background:var(--bg);min-height:100vh;overflow-x:hidden;
  letter-spacing:-0.005em;
}
button{cursor:pointer;font-family:inherit;border:none;outline:none;background:none}
input,select,textarea{font-family:inherit;outline:none;border:none}
a{color:inherit}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}

/* ========== Pages ========== */
.page{
  position:fixed;inset:0;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity 0.5s ease,transform 0.5s ease;
  display:flex;flex-direction:column;overflow:hidden;
}
.page.active{opacity:1;transform:translateY(0);pointer-events:all}

/* ========== Decorations (subtle) ========== */
#decorations{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco-dot{
  position:absolute;border-radius:50%;background:var(--accent-soft);
  opacity:0;animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{transform:translateY(100vh);opacity:0}
  8%{opacity:0.12}
  92%{opacity:0.12}
  100%{transform:translateY(-10vh);opacity:0}
}

/* ========== Mascot — refined, minimalist ========== */
.mascot{position:relative;display:inline-flex;flex-direction:column;align-items:center;flex-shrink:0}
.mascot-md{transform:scale(1)}
.mascot-sm{transform:scale(0.6);transform-origin:top center}
.mascot-lg{transform:scale(1.15);transform-origin:top center}
.mascot-head{
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(160deg,#FDFBF8,#F0EAE0);
  border:1px solid var(--line);
  position:relative;z-index:2;
  box-shadow:0 2px 8px rgba(43,41,38,0.04);
}
.mascot-eye{
  width:4px;height:4px;background:var(--text);border-radius:50%;
  position:absolute;top:40%;
}
.mascot-eye.left{left:28%}
.mascot-eye.right{right:28%}
.mascot-cheek{
  width:7px;height:5px;background:rgba(184,166,137,0.22);border-radius:50%;
  position:absolute;top:58%;
}
.mascot-cheek.left{left:14%}
.mascot-cheek.right{right:14%}
.mascot-mouth{
  position:absolute;bottom:26%;left:50%;transform:translateX(-50%);
  width:8px;height:4px;border-bottom:1.5px solid var(--text);border-radius:0 0 50% 50%;
}
.mascot-body{
  width:28px;height:20px;margin:-3px auto 0;position:relative;z-index:1;
  background:var(--accent);border-radius:40% 40% 45% 45%;
}
.mascot-arm{
  width:8px;height:16px;background:linear-gradient(160deg,#FDFBF8,#F0EAE0);
  border:1px solid var(--line);border-radius:6px;position:absolute;top:2px;
}
.mascot-arm.left{left:-6px;transform:rotate(12deg)}
.mascot-arm.right{right:-6px;transform:rotate(-12deg)}

.mascot-wave .mascot-arm.right{transform:rotate(-130deg);transform-origin:bottom center;animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{0%{transform:rotate(-130deg)}100%{transform:rotate(-155deg)}}

.mascot-tilt .mascot-head{transform:rotate(-6deg)}
.mascot-tilt .mascot-eye{transform:translateY(1px)}

.mascot-think .mascot-eye{transform:translateY(-1.5px)}
.mascot-think .mascot-mouth{width:4px;height:4px;border-radius:50%;border:none;background:var(--text);border-bottom:none;bottom:26%}
.think-dots{display:none;gap:3px;position:absolute;top:-14px;left:50%;transform:translateX(-50%)}
.mascot-think .think-dots{display:flex}
.mascot-think .think-dots span{width:3px;height:3px;border-radius:50%;background:var(--accent);animation:thinkDot 1.4s ease-in-out infinite}
.mascot-think .think-dots span:nth-child(2){animation-delay:0.2s}
.mascot-think .think-dots span:nth-child(3){animation-delay:0.4s}
@keyframes thinkDot{0%,60%,100%{opacity:0.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.mascot-happy .mascot-mouth{width:12px;height:7px;border-bottom:2px solid var(--text);border-radius:0 0 50% 50%}
.mascot-happy{animation:bounce 0.7s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.mascot-encourage .mascot-mouth{width:10px;height:5px;border-bottom:1.5px solid var(--text);border-radius:0 0 50% 50%}
.mascot-encourage .mascot-arm.right{transform:rotate(-40deg)}

.mascot-cheer .mascot-mouth{width:8px;height:4px;border-bottom:2px solid var(--text);border-radius:0 0 50% 50%}
.mascot-cheer .mascot-arm.left{transform:rotate(40deg)}
.mascot-cheer .mascot-arm.right{transform:rotate(-160deg)}

.mascot-smile .mascot-mouth{width:8px;height:4px;border-bottom:1.5px solid var(--text);border-radius:0 0 50% 50%}

/* ========== Icons ========== */
.icon-svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon-svg-sm{width:16px;height:16px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon-svg-lg{width:24px;height:24px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ========== Scene Page ========== */
#page-scenes{padding:var(--space-5) var(--space-4) var(--space-8);overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1}
.scene-header{text-align:center;padding:var(--space-6) 0 var(--space-5);position:relative}
.scene-header h1{
  font-size:1.75rem;font-weight:600;letter-spacing:-0.02em;color:var(--text);
  margin-top:var(--space-3);
}
.scene-header .subtitle{color:var(--text-secondary);font-size:0.9rem;margin-top:var(--space-2);font-weight:400}
.scene-header .hint{font-size:0.75rem;color:var(--text-tertiary);margin-top:var(--space-1);font-weight:400}
.scene-mascot-wrap{display:flex;justify-content:center}
.scene-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3);
  max-width:620px;margin:0 auto;padding:var(--space-2) 0 100px;
}
.scene-card{
  background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--space-5) var(--space-4);text-align:center;
  transition:var(--transition);position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);cursor:pointer;
}
.scene-card:active{transform:scale(0.97)}
.scene-card.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent),var(--shadow);
  transform:scale(1.02);
  background:var(--bg-elevated);
}
.scene-icon-wrap{
  width:44px;height:44px;margin:0 auto var(--space-3);
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);background:var(--accent-bg);
  color:var(--accent);transition:var(--transition);
}
.scene-card.selected .scene-icon-wrap{background:var(--accent);color:#fff}
.scene-name{font-weight:600;font-size:0.92rem;letter-spacing:-0.01em;margin-bottom:var(--space-1)}
.scene-desc{font-size:0.76rem;color:var(--text-tertiary);line-height:1.5;font-weight:400}
.btn-start{
  position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%);z-index:10;
  background:var(--text);color:var(--bg-elevated);
  font-size:0.92rem;font-weight:500;letter-spacing:0.01em;
  padding:var(--space-4) var(--space-7);border-radius:50px;
  box-shadow:0 4px 20px rgba(43,41,38,0.15);
  transition:var(--transition);
}
.btn-start:active{transform:translateX(-50%) scale(0.96)}
.btn-start:disabled{opacity:0.35;box-shadow:none}

/* ========== Chat Page ========== */
#page-chat{z-index:2;background:var(--bg)}
.chat-header{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-4) var(--space-5);
  background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line-soft);
  flex-shrink:0;position:relative;z-index:3;
}
.btn-back{
  width:36px;height:36px;border-radius:50%;
  background:transparent;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);flex-shrink:0;color:var(--text-secondary);
}
.btn-back:hover{background:var(--bg-sunken)}
.btn-back:active{transform:scale(0.9)}
.chat-info{flex:1;min-width:0;text-align:center}
.chat-scene-name{font-weight:600;font-size:0.92rem;letter-spacing:-0.01em;display:block;color:var(--text)}
.chat-ai-role{font-size:0.72rem;color:var(--text-tertiary);display:block;margin-top:1px;font-weight:400}
.chat-mascot-wrap{position:absolute;right:64px;top:50%;transform:translateY(-50%);pointer-events:none;z-index:4;opacity:0.5}
.chat-actions{display:flex;gap:var(--space-1);flex-shrink:0;align-items:center}
.btn-icon{
  width:36px;height:36px;border-radius:50%;
  background:transparent;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);color:var(--text-secondary);
}
.btn-icon:hover{background:var(--bg-sunken)}
.btn-icon:active{transform:scale(0.9)}
.btn-end-chat{
  font-size:0.78rem;font-weight:500;color:var(--text-secondary);
  padding:7px var(--space-3);border-radius:50px;
  border:1px solid var(--line);background:var(--bg-elevated);
  transition:var(--transition);
}
.btn-end-chat:hover{border-color:var(--accent);color:var(--accent)}
.btn-end-chat:active{transform:scale(0.96)}

.chat-messages{
  flex:1;overflow-y:auto;padding:var(--space-5) var(--space-5) var(--space-3);
  display:flex;flex-direction:column;gap:var(--space-3);
  -webkit-overflow-scrolling:touch;
}
.msg{max-width:78%;animation:msgIn 0.4s cubic-bezier(0.32,0.72,0,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-user{
  align-self:flex-end;
  background:var(--text);color:var(--bg-elevated);
  padding:var(--space-3) var(--space-4);
  border-radius:var(--radius) var(--radius) 4px var(--radius);
  font-size:0.9rem;line-height:1.55;font-weight:400;
}
.msg-ai-wrap{align-self:flex-start;display:flex;gap:var(--space-2);align-items:flex-end;max-width:82%}
.msg-ai-avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:var(--bg-sunken);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:0.68rem;color:var(--text-secondary);font-weight:600;
}
.msg-ai{
  background:var(--bg-elevated);border:1px solid var(--line-soft);
  padding:var(--space-3) var(--space-4);
  border-radius:var(--radius) var(--radius) var(--radius) 4px;
  font-size:0.9rem;line-height:1.55;color:var(--text);font-weight:400;
  box-shadow:var(--shadow-sm);
}
.typing-indicator{display:flex;gap:4px;padding:2px 0;align-items:center}
.typing-indicator span{
  width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);
  animation:typingBounce 1.2s ease-in-out infinite;
}
.typing-indicator span:nth-child(2){animation-delay:0.15s}
.typing-indicator span:nth-child(3){animation-delay:0.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

.chat-input-wrap{
  padding:var(--space-3) var(--space-5) var(--space-6);
  background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line-soft);
  display:flex;gap:var(--space-3);align-items:center;flex-shrink:0;
}
.chat-input{
  flex:1;padding:var(--space-3) var(--space-5);border-radius:50px;
  font-size:0.9rem;font-weight:400;
  background:var(--bg-elevated);border:1px solid var(--line);
  color:var(--text);transition:var(--transition);
}
.chat-input:focus{border-color:var(--accent-soft);background:#fff}
.chat-input::placeholder{color:var(--text-tertiary)}
.btn-send{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:var(--text);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(43,41,38,0.12);
  transition:var(--transition);color:var(--bg-elevated);
}
.btn-send:active{transform:scale(0.9)}

/* ========== Report Page ========== */
#page-report{z-index:3;overflow-y:auto;padding:var(--space-5) var(--space-4) var(--space-8);-webkit-overflow-scrolling:touch}
.report-container{max-width:580px;margin:0 auto;padding-bottom:var(--space-6)}
.report-header{text-align:center;margin-bottom:var(--space-6)}
.report-header h2{font-size:1.5rem;font-weight:600;letter-spacing:-0.02em;margin-top:var(--space-4);color:var(--text)}
.report-mascot-wrap{display:flex;justify-content:center}

.score-section{
  text-align:center;margin-bottom:var(--space-5);
  background:var(--bg-elevated);border:1px solid var(--line);
  border-radius:var(--radius);padding:var(--space-6) var(--space-5);
  box-shadow:var(--shadow-sm);
}
.score-main{position:relative;width:132px;height:132px;margin:0 auto var(--space-5)}
.score-main svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring-bg{fill:none;stroke:var(--line);stroke-width:6}
.score-ring-fill{
  fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;
  stroke-dasharray:414.69;stroke-dashoffset:414.69;
  transition:stroke-dashoffset 1.6s ease-out;
}
.score-number{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:600;letter-spacing:-0.03em;color:var(--text)}
.score-number small{font-size:0.82rem;font-weight:400;color:var(--text-tertiary)}
.grade-label{
  display:inline-block;padding:7px var(--space-5);border-radius:50px;
  font-size:0.85rem;font-weight:500;letter-spacing:0.01em;color:var(--bg-elevated);
  background:var(--text);
}
.score-details{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);margin-top:var(--space-5)}
.score-dim{text-align:center;padding:var(--space-3) var(--space-1)}
.score-dim-ring{width:54px;height:54px;margin:0 auto var(--space-2);position:relative}
.score-dim-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.dim-ring-bg{fill:none;stroke:var(--line);stroke-width:4}
.dim-ring-fill{
  fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:157.08;stroke-dashoffset:157.08;
  transition:stroke-dashoffset 1.3s ease-out 0.3s;
}
.dim-score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:0.8rem;font-weight:600;color:var(--text)}
.dim-label{font-size:0.7rem;color:var(--text-tertiary);font-weight:500}

.report-section{
  background:var(--bg-elevated);border:1px solid var(--line);
  border-radius:var(--radius);padding:var(--space-5);margin-bottom:var(--space-4);
  box-shadow:var(--shadow-sm);
}
.report-section h3{
  font-size:0.95rem;font-weight:600;letter-spacing:-0.01em;margin-bottom:var(--space-4);
  display:flex;align-items:center;gap:var(--space-2);color:var(--text);
}
.report-section h3 .icon-wrap{
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  color:var(--accent);
}
.missed-item{display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--line-soft)}
.missed-item:last-child{border-bottom:none}
.missed-num{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  border:1px solid var(--line);background:var(--bg-sunken);
  color:var(--text-secondary);font-size:0.68rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;
}
.missed-text{font-size:0.84rem;line-height:1.55;flex:1}
.missed-text strong{color:var(--text);font-weight:600;display:block}
.missed-text p{color:var(--text-secondary);font-size:0.78rem;margin-top:2px;font-weight:400}

.price-bar-wrap{margin-bottom:var(--space-3)}
.price-bar-label{display:flex;justify-content:space-between;font-size:0.76rem;color:var(--text-tertiary);margin-bottom:var(--space-2);font-weight:500}
.price-bar-label span:nth-child(2){color:var(--accent);font-weight:600}
.price-bar{height:6px;border-radius:3px;background:var(--bg-sunken);overflow:visible;position:relative}
.price-bar-fill{height:100%;border-radius:3px;transition:width 1.1s ease-out 0.4s;background:var(--accent)}
.price-bar-marker{position:absolute;top:-3px;width:2px;height:12px;background:var(--text);border-radius:1px;transition:left 1.1s ease-out 0.4s}
.price-eval{font-size:0.82rem;color:var(--text-secondary);margin-top:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--accent-bg);border-radius:var(--radius-xs);line-height:1.55;font-weight:400}

.phrase-table{width:100%;font-size:0.8rem;border-collapse:collapse}
.phrase-table th{text-align:left;padding:var(--space-2) var(--space-2);font-weight:600;color:var(--text-tertiary);border-bottom:1px solid var(--line);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em}
.phrase-table td{padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5;font-weight:400}
.phrase-table tr:last-child td{border-bottom:none}
.phrase-orig{color:var(--text);font-weight:500}
.phrase-issue{color:var(--text-secondary)}
.phrase-suggest{color:var(--accent);font-weight:500}

.report-actions{display:flex;gap:var(--space-3);justify-content:center;margin-top:var(--space-5)}
.btn-primary{
  background:var(--text);color:var(--bg-elevated);
  font-weight:500;padding:var(--space-3) var(--space-7);border-radius:50px;
  box-shadow:0 2px 12px rgba(43,41,38,0.12);transition:var(--transition);font-size:0.9rem;letter-spacing:0.01em;
}
.btn-primary:active{transform:scale(0.96)}
.btn-share{
  background:transparent;border:1px solid var(--line);
  color:var(--text-secondary);font-weight:500;
  padding:var(--space-3) var(--space-5);border-radius:50px;
  transition:var(--transition);font-size:0.9rem;
  display:flex;align-items:center;gap:var(--space-2);
}
.btn-share:hover{border-color:var(--accent);color:var(--accent)}
.btn-share:active{transform:scale(0.96)}

/* ========== Modals ========== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(43,41,38,0.25);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:100;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.3s ease;padding:var(--space-5);
}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal-box{
  background:var(--bg-elevated);border:1px solid var(--line);
  border-radius:var(--radius);padding:var(--space-6) var(--space-5);
  width:100%;max-width:380px;box-shadow:var(--shadow);
  transform:translateY(12px) scale(0.98);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
}
.modal-overlay.show .modal-box{transform:translateY(0) scale(1)}
.modal-box h3{font-size:1.1rem;font-weight:600;letter-spacing:-0.01em;margin-bottom:var(--space-1);text-align:center;color:var(--text)}
.modal-box .modal-desc{font-size:0.82rem;color:var(--text-secondary);text-align:center;margin-bottom:var(--space-5);font-weight:400}
.modal-field{margin-bottom:var(--space-4)}
.modal-field label{display:block;font-size:0.76rem;font-weight:600;color:var(--text-secondary);margin-bottom:var(--space-2);letter-spacing:0.02em}
.modal-field input,.modal-field select{
  width:100%;padding:var(--space-3) var(--space-4);border-radius:var(--radius-xs);
  font-size:0.86rem;font-weight:400;
  background:var(--bg);border:1px solid var(--line);color:var(--text);
  transition:var(--transition);
}
.modal-field input:focus,.modal-field select:focus{border-color:var(--accent-soft);background:var(--bg-elevated)}
.api-hint{font-size:0.7rem;color:var(--text-tertiary);margin-top:var(--space-2);font-weight:400}
.api-hint a{color:var(--accent);text-decoration:none}
.api-hint a:hover{text-decoration:underline}
.modal-actions{display:flex;gap:var(--space-3);margin-top:var(--space-5)}
.modal-actions button{flex:1;padding:var(--space-3);border-radius:var(--radius-xs);font-weight:500;font-size:0.86rem;transition:var(--transition);letter-spacing:0.01em}
.btn-modal-cancel{background:var(--bg-sunken);color:var(--text-secondary)}
.btn-modal-cancel:hover{background:var(--line)}
.btn-modal-cancel:active{transform:scale(0.97)}
.btn-modal-confirm{background:var(--text);color:var(--bg-elevated);box-shadow:0 1px 8px rgba(43,41,38,0.1)}
.btn-modal-confirm:active{transform:scale(0.97)}

/* ========== Toast ========== */
.toast{
  position:fixed;top:var(--space-6);left:50%;transform:translateX(-50%) translateY(-16px);
  background:var(--text);color:var(--bg-elevated);
  padding:var(--space-3) var(--space-5);border-radius:50px;
  font-size:0.82rem;font-weight:400;z-index:200;opacity:0;
  transition:opacity 0.3s,transform 0.3s;pointer-events:none;
  box-shadow:var(--shadow);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== Loading ========== */
.loading-overlay{
  position:fixed;inset:0;background:rgba(247,244,240,0.88);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.3s;
}
.loading-overlay.show{opacity:1;pointer-events:all}
.loading-text{margin-top:var(--space-4);font-size:0.88rem;font-weight:500;color:var(--text-secondary);letter-spacing:0.01em}

/* ========== Responsive ========== */
@media(min-width:640px){
  .scene-grid{grid-template-columns:repeat(4,1fr);max-width:820px;gap:var(--space-4)}
  #page-scenes{padding:var(--space-6) var(--space-6) var(--space-8)}
  .scene-header h1{font-size:2rem}
  .chat-messages{padding:var(--space-6) var(--space-6) var(--space-3)}
  .chat-input-wrap{padding:var(--space-3) var(--space-6) var(--space-6)}
  .chat-header{padding:var(--space-4) var(--space-6)}
  #page-report{padding:var(--space-6) var(--space-6) var(--space-8)}
}
@media(max-width:380px){
  .scene-grid{gap:var(--space-2)}
  .scene-card{padding:var(--space-4) var(--space-3)}
  .scene-header h1{font-size:1.6rem}
  .score-details{grid-template-columns:repeat(2,1fr);gap:var(--space-3)}
}
</style>
</head>
<body>

<!-- Decorations -->
<div id="decorations"></div>

<!-- ===== Page: Scene Selection ===== -->
<div id="page-scenes" class="page active">
  <div class="scene-header">
    <div class="scene-mascot-wrap">
      <div class="mascot mascot-wave mascot-md" id="mascot-scene">
        <div class="think-dots"><span></span><span></span><span></span></div>
        <div class="mascot-head">
          <div class="mascot-eye left"></div>
          <div class="mascot-eye right"></div>
          <div class="mascot-cheek left"></div>
          <div class="mascot-cheek right"></div>
          <div class="mascot-mouth"></div>
        </div>
        <div class="mascot-body">
          <div class="mascot-arm left"></div>
          <div class="mascot-arm right"></div>
        </div>
      </div>
    </div>
    <h1>嘴替</h1>
    <p class="subtitle">选择场景，开始练习谈判</p>
    <p class="hint">已配置智谱 AI，直接开始即可</p>
  </div>
  <div class="scene-grid" id="sceneGrid"></div>
  <button class="btn-start" id="btnStart" disabled>开始谈判</button>
</div>

        <div class="mascot-head">
          <div class="mascot-eye left"></div>
          <div class="mascot-eye right"></div>
          <div class="mascot-cheek left"></div>
          <div class="mascot-cheek right"></div>
          <div class="mascot-mouth"></div>
        </div>
        <div class="mascot-body">
          <div class="mascot-arm left"></div>
          <div class="mascot-arm right"></div>
        </div>
      </div>
    </div>
    <div class="chat-actions">

          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
      <button class="btn-end-chat" id="btnEndChat">结束</button>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-wrap">
    <input class="chat-input" id="chatInput" type="text" placeholder="输入消息..." autocomplete="off">
    <button class="btn-send" id="btnSend">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- ===== Page: Report ===== -->
<div id="page-report" class="page">
  <div class="report-container">

      <div class="report-mascot-wrap">
        <div class="mascot mascot-smile mascot-lg" id="mascot-report">

          <div class="mascot-head">
            <div class="mascot-eye left"></div>
            <div class="mascot-eye right"></div>
            <div class="mascot-cheek left"></div>
            <div class="mascot-cheek right"></div>
            <div class="mascot-mouth"></div>
          </div>
          <div class="mascot-body">
            <div class="mascot-arm left"></div>
            <div class="mascot-arm right"></div>
          </div>
        </div>
      </div>

    </div>

      <div class="score-main">

      </div>

            <span class="dim-score" data-dim-score="info">0</span>
          </div>
          <div class="dim-label">信息收集</div>
        </div>
        <div class="score-dim">
          <div class="score-dim-ring">
            <svg viewBox="0 0 60 60"><circle class="dim-ring-bg" cx="30" cy="30" r="25"/><circle class="dim-ring-fill" data-dim="price" cx="30" cy="30" r="25"/></svg>
            <span class="dim-score" data-dim-score="price">0</span>
          </div>
          <div class="dim-label">价格谈判</div>
        </div>
        <div class="score-dim">
          <div class="score-dim-ring">
            <svg viewBox="0 0 60 60"><circle class="dim-ring-bg" cx="30" cy="30" r="25"/><circle class="dim-ring-fill" data-dim="comm" cx="30" cy="30" r="25"/></svg>
            <span class="dim-score" data-dim-score="comm">0</span>
          </div>
          <div class="dim-label">沟通技巧</div>
        </div>
        <div class="score-dim">
          <div class="score-dim-ring">
            <svg viewBox="0 0 60 60"><circle class="dim-ring-bg" cx="30" cy="30" r="25"/><circle class="dim-ring-fill" data-dim="strat" cx="30" cy="30" r="25"/></svg>

<!-- ===== Settings Modal ===== -->
<div class="modal-overlay" id="modalSettings">
  <div class="modal-box">
    <h3>接口设置</h3>
    <p class="modal-desc">配置大模型接口以驱动对话</p>
    <div class="modal-field">

      <select id="selectPreset">
        <option value="">选择预设...</option>
        <option value="0">智谱 GLM-4-Flash（免费，已配置）</option>
        <option value="1">本地演示（无需 Key）</option>

        <option value="3">豆包（免费额度）</option>
        <option value="4">OpenAI</option>
      </select>
    </div>
    <div class="modal-field">
      <label>API Key</label>
      <input id="inputApiKey" type="password" placeholder="控制台获取">
      <div class="api-hint">获取免费 Key：<a href="https://open.bigmodel.cn/" target="_blank">智谱AI</a> · <a href="https://dashscope.aliyuncs.com/" target="_blank">阿里云通义</a> · <a href="https://www.doubao.com/" target="_blank">豆包</a></div>

      <button class="btn-modal-confirm" id="btnSettingsSave">保存</button>

  </div>
</div>

<div class="modal-overlay" id="modalConfirm">

    <h3>结束谈判</h3>

    <div class="modal-actions">
      <button class="btn-modal-cancel" id="btnConfirmCancel">再聊聊</button>
      <button class="btn-modal-confirm" id="btnConfirmOk">确认结束</button>
    </div>
  </div>
</div>

function animateNumber(el,target,duration=1300){
  const start=performance.now();
  function tick(now){
    const elapsed=now-start;
    const progress=Math.min(elapsed/duration,1);
    const eased=1-Math.pow(1-progress,3);
    el.textContent=Math.round(target*eased);
    if(progress<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

async function callAPI(messages){
  const settings=loadSettings();
  if(settings.apiUrl==='local-demo'){
    await new Promise(r=>setTimeout(r,700+Math.random()*500));
    const assistantCount=messages.filter(m=>m.role==='assistant').length;
    return getDemoResponse(scenesData[currentScene].id,assistantCount);
  }
  if(!settings.apiKey){
    showToast('Key 为空，切换到演示模式');
    saveSettings('','local-demo','demo');
    await new Promise(r=>setTimeout(r,700+Math.random()*500));
    const assistantCount=messages.filter(m=>m.role==='assistant').length;
    return getDemoResponse(scenesData[currentScene].id,assistantCount);
  }
  try{
    const resp=await fetch(settings.apiUrl+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},
      body:JSON.stringify({model:settings.apiModel,messages,temperature:0.85,max_tokens:300})
    });
    if(!resp.ok){
      showToast('接口错误，切换演示模式');
      saveSettings('','local-demo','demo');
      await new Promise(r=>setTimeout(r,700+Math.random()*500));
      const assistantCount=messages.filter(m=>m.role==='assistant').length;
      return getDemoResponse(scenesData[currentScene].id,assistantCount);
    }
    const data=await resp.json();
    return data.choices[0].message.content;
  }catch(e){
    showToast('网络错误，切换演示模式');
    saveSettings('','local-demo','demo');
    await new Promise(r=>setTimeout(r,700+Math.random()*500));
    const assistantCount=messages.filter(m=>m.role==='assistant').length;
    return getDemoResponse(scenesData[currentScene].id,assistantCount);
  }
}

async function callAPIForEval(messages){
  const settings=loadSettings();
  if(settings.apiUrl==='local-demo'){return null}
  if(!settings.apiKey){return null}
  try{
    const resp=await fetch(settings.apiUrl+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},
      body:JSON.stringify({model:settings.apiModel,messages,temperature:0.3,max_tokens:2000})
    });
    if(!resp.ok)throw new Error('API错误: '+resp.status);
    const data=await resp.json();
    return data.choices[0].message.content;
  }catch(e){return null}
}

function addMessage(role,content){
  conversationHistory.push({role,content});
  const wrap=document.createElement('div');
  if(role==='user'){
    wrap.className='msg msg-user';
    wrap.textContent=content;
  }else{
    wrap.className='msg-ai-wrap';
    const avatar=currentScene!==null?scenesData[currentScene].aiAvatar:'?';
    wrap.innerHTML=`<div class="msg-ai-avatar">${avatar}</div><div class="msg msg-ai"></div>`;
    wrap.querySelector('.msg-ai').textContent=content;
  }
  chatMessages.appendChild(wrap);
  scrollChatToBottom();
}

function showTyping(){
  const wrap=document.createElement('div');
  wrap.className='msg-ai-wrap';wrap.id='typingIndicator';
  const avatar=currentScene!==null?scenesData[currentScene].aiAvatar:'?';
  wrap.innerHTML=`<div class="msg-ai-avatar">${avatar}</div><div class="msg msg-ai"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  chatMessages.appendChild(wrap);
  scrollChatToBottom();
}
function hideTyping(){const el=$('typingIndicator');if(el)el.remove()}

async function startChat(){
  const scene=scenesData[currentScene];
  chatSceneName.textContent=scene.name;
  chatAiRole.textContent=scene.aiTag;
  chatMessages.innerHTML='';
  conversationHistory=[];
  const sysPrompt=buildSystemPrompt(scene);
  conversationHistory.push({role:'system',content:sysPrompt});
  navigateTo(pageChat);
  showTyping();
  $('mascot-chat').className='mascot mascot-think mascot-sm';
  const firstMsg=await callAPI([{role:'system',content:sysPrompt},{role:'user',content:'你好'}]);
  hideTyping();
  $('mascot-chat').className='mascot mascot-tilt mascot-sm';
  addMessage('assistant',firstMsg);
  conversationHistory.push({role:'assistant',content:firstMsg});
}

async function sendMessage(){
  const text=chatInput.value.trim();
  if(!text||isAiResponding)return;
  chatInput.value='';
  isAiResponding=true;
  addMessage('user',text);
  showTyping();
  $('mascot-chat').className='mascot mascot-think mascot-sm';
  const aiMsg=await callAPI(conversationHistory);
  hideTyping();
  $('mascot-chat').className='mascot mascot-tilt mascot-sm';
  addMessage('assistant',aiMsg);
  conversationHistory.push({role:'assistant',content:aiMsg});
  isAiResponding=false;
}

// ========== End & Report ==========
async function endNegotiation(){
  hideModal(modalConfirm);
  showLoading('正在评估你的表现');
  const scene=scenesData[currentScene];
  const evalPrompt=buildEvalPrompt(scene);
  const evalMessages=[
    {role:'system',content:'你是一个谈判评估专家，请严格按照要求的JSON格式返回评估结果。'},
    {role:'user',content:evalPrompt}
  ];
  const evalResult=await callAPIForEval(evalMessages);
  hideLoading();
  let report;
  if(evalResult){
    try{
      let jsonStr=evalResult.trim();
      const fenceMatch=jsonStr.match(/```(?:json)?\s*([\s\S]*?)```/);
      if(fenceMatch)jsonStr=fenceMatch[1].trim();
      report=JSON.parse(jsonStr);
    }catch(e){report=generateFallbackReport(scene)}
  }else{
    report=generateFallbackReport(scene);
  }
  renderReport(report,scene);
  navigateTo(pageReport);
}

function generateFallbackReport(scene){
  const userMsgs=conversationHistory.filter(m=>m.role==='user');
  const askedTips=scene.tips.filter(tip=>userMsgs.some(m=>m.content.includes(tip.substring(0,4))));
  const missedTips=scene.tips.filter(tip=>!askedTips.includes(tip));
  const score=Math.max(10,Math.round(60-missedTips.length*8+Math.random()*10));
  return {
    missed_questions:missedTips.map(q=>({question:q,explanation:'这是谈判中很重要但你没有问到的问题'})),
    price_analysis:{deal_price:null,bottom_price:scene.bottomPrice,market_range:scene.marketRange,evaluation:'你似乎没有达成明确的价格约定'},
    better_phrases:userMsgs.slice(0,3).map(m=>({original:m.content,issue:'表达可以更具体',suggestion:'尝试用更明确的方式提出你的要求'})),
    scores:{
      info_collection:Math.max(5,25-missedTips.length*4),
      price_negotiation:Math.max(5,Math.round(score/4)),
      communication:Math.max(5,Math.round(15+Math.random()*5)),
      strategy:Math.max(5,Math.round(12+Math.random()*8))
    },
    overall_comment:'继续加油，多练习会让你更加得心应手。'
  };
}

function renderReport(report,scene){
  // Missed questions
  const missedList=$('missedList');
  missedList.innerHTML='';
  if(report.missed_questions&&report.missed_questions.length>0){
    report.missed_questions.forEach((q,i)=>{
      const item=document.createElement('div');
      item.className='missed-item';
      item.innerHTML=`<div class="missed-num">${i+1}</div><div class="missed-text"><strong></strong><p></p></div>`;
      item.querySelector('strong').textContent=q.question;
      item.querySelector('p').textContent=q.explanation;
      missedList.appendChild(item);
    });
  }else{
    missedList.innerHTML='<div style="text-align:center;color:var(--text-tertiary);padding:var(--space-4);font-size:0.82rem">关键问题都问到了</div>';
  }

  // Price analysis
  const priceDiv=$('priceAnalysis');
  const bp=report.price_analysis.bottom_price;
  const dp=report.price_analysis.deal_price;
  const ap=scene.askPrice;
  const maxVal=Math.max(ap,parseFloat(scene.marketRange.split('-')[1]));
  const minVal=Math.min(bp,parseFloat(scene.marketRange.split('-')[0]));
  let priceBarHtml='';
  if(dp!==null&&dp!==undefined){
    const fillPct=Math.min(100,((dp-minVal)/(maxVal-minVal))*100);
    const bottomPct=((bp-minVal)/(maxVal-minVal))*100;
    priceBarHtml=`<div class="price-bar-wrap"><div class="price-bar-label"><span>底价 ${bp}</span><span>成交 ${dp}</span><span>标价 ${ap}</span></div><div class="price-bar"><div class="price-bar-fill" style="width:0%" data-width="${fillPct}%"></div><div class="price-bar-marker" style="left:0%" data-left="${bottomPct}%"></div></div></div>`;
  }else{
    const bottomPct=((bp-minVal)/(maxVal-minVal))*100;
    priceBarHtml=`<div class="price-bar-wrap"><div class="price-bar-label"><span>底价 ${bp}</span><span>未成交</span><span>标价 ${ap}</span></div><div class="price-bar"><div class="price-bar-marker" style="left:0%" data-left="${bottomPct}%"></div></div></div>`;
  }
  priceBarHtml+=`<div class="price-eval">${report.price_analysis.evaluation}</div>`;
  priceDiv.innerHTML=priceBarHtml;

  // Better phrases
  const phraseDiv=$('phraseTable');
  if(report.better_phrases&&report.better_phrases.length>0){
    let tableHtml='<table class="phrase-table"><thead><tr><th>原话</th><th>问题</th><th>建议</th></tr></thead><tbody>';
    report.better_phrases.forEach(p=>{
      const row=document.createElement('tr');
      row.innerHTML=`<td class="phrase-orig"></td><td class="phrase-issue"></td><td class="phrase-suggest"></td>`;
      row.cells[0].textContent=p.original;
      row.cells[1].textContent=p.issue;
      row.cells[2].textContent=p.suggestion;
      tableHtml+=row.outerHTML;
    });
    tableHtml+='</tbody></table>';
    phraseDiv.innerHTML=tableHtml;
  }else{
    phraseDiv.innerHTML='<div style="text-align:center;color:var(--text-tertiary);padding:var(--space-4);font-size:0.82rem">表达都很到位</div>';
  }

  // Scores
  const scores=report.scores;
  const total=(scores.info_collection||0)+(scores.price_negotiation||0)+(scores.communication||0)+(scores.strategy||0);
  const mascotReport=$('mascot-report');
  mascotReport.className='mascot mascot-lg';
  let gradeText='';
  if(total>=90){gradeText='谈判王者';mascotReport.classList.add('mascot-happy')}
  else if(total>=70){gradeText='砍价高手';mascotReport.classList.add('mascot-encourage')}
  else if(total>=50){gradeText='初出茅庐';mascotReport.classList.add('mascot-smile')}
  else{gradeText='还需多练';mascotReport.classList.add('mascot-cheer')}
  $('gradeLabel').textContent=gradeText;

  setTimeout(()=>{
    animateNumber($('scoreNum'),total,1500);
    const mainCircumference=2*Math.PI*66;
    $('scoreRingFill').style.strokeDashoffset=mainCircumference*(1-total/100);
    const dimCircumference=2*Math.PI*25;
    const dims={info:scores.info_collection,price:scores.price_negotiation,comm:scores.communication,strat:scores.strategy};
    Object.entries(dims).forEach(([key,val])=>{
      const ring=document.querySelector(`.dim-ring-fill[data-dim="${key}"]`);
      const scoreEl=document.querySelector(`[data-dim-score="${key}"]`);
      if(ring){ring.style.strokeDashoffset=dimCircumference*(1-val/25)}
      if(scoreEl){animateNumber(scoreEl,val,1000)}
    });
    document.querySelectorAll('.price-bar-fill').forEach(el=>{if(el.dataset.width)el.style.width=el.dataset.width});
    document.querySelectorAll('.price-bar-marker').forEach(el=>{if(el.dataset.left)el.style.left=el.dataset.left});
  },300);
}

// ========== Event Listeners ==========
btnStart.addEventListener('click',()=>{if(currentScene===null)return;startChat()});
$('btnSend').addEventListener('click',sendMessage);
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
$('btnBack').addEventListener('click',()=>navigateTo(pageScenes));
$('btnSettings').addEventListener('click',()=>{populateSettingsFields();showModal(modalSettings)});
$('btnEndChat').addEventListener('click',()=>showModal(modalConfirm));
$('btnConfirmCancel').addEventListener('click',()=>hideModal(modalConfirm));
$('btnConfirmOk').addEventListener('click',endNegotiation);
$('btnSettingsCancel').addEventListener('click',()=>hideModal(modalSettings));
$('btnSettingsSave').addEventListener('click',()=>{
  const key=$('inputApiKey').value.trim();
  const url=$('inputApiUrl').value.trim();
  const model=$('inputApiModel').value.trim();
  if(url!=='local-demo'&&!key){showToast('请填写 API Key');return}
  saveSettings(key,url||'local-demo',model||'demo');
  hideModal(modalSettings);
  showToast('已保存');
});
$('selectPreset').addEventListener('change',()=>{
  const idx=$('selectPreset').value;
  if(idx!==''){const preset=freePresets[idx];$('inputApiUrl').value=preset.url;$('inputApiModel').value=preset.model}
});
$('btnRestart').addEventListener('click',()=>{
  currentScene=null;conversationHistory=[];
  document.querySelectorAll('.scene-card').forEach(c=>c.classList.remove('selected'));
  btnStart.disabled=true;
  $('scoreRingFill').style.strokeDashoffset=2*Math.PI*66;
  $('scoreNum').textContent='0';
  navigateTo(pageScenes);
});
$('btnShare').addEventListener('click',()=>showToast('分享功能开发中'));
[modalSettings,modalConfirm].forEach(modal=>{modal.addEventListener('click',e=>{if(e.target===modal)hideModal(modal)})});

// ========== Init ==========
createDecorations();
renderSceneCards();
populateSettingsFields();
</script>
</body>
</html>
