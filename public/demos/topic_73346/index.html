人这一辈子，追求啥呢？钱再多，房再大，不如身边有个人说说话。奶奶这一辈子，没享过什么福，但是有你爷爷，有你们这些娃，奶奶觉得比谁都幸福。孩子啊，记住了，一家人整整齐齐的，比啥都强。",audioDuration:16}]},{id:"father",name:"李先生",role:"父亲",avatar:"👨",voiceType:"深沉稳重",description:"从山村走出去的第一代大学生，靠知识改变命运",presetQuestions:[{id:"q1",question:"爸，你第一次出远门是什么感觉？",answer:"第一次出远门啊……是去城里上大学。那时候你爷爷借了全村人的钱，才凑够我的学费。我坐了十二个小时的绿皮火车，站票，腿都肿了。到了城里，我看着高楼大厦，看着街上的车水马龙，心里既激动又害怕。我是我们村第一个大学生，全村人的希望都在我身上。那时候我就暗下决心，一定要混出个人样来，不辜负你爷爷的期望，也不让村里人失望。这一走啊，就再也没能回去……",audioDuration:18},{id:"q2",question:"爸，你后悔过吗？",answer:"后悔……说不后悔是假的。最遗憾的是，你奶奶走的时候，我都没能赶上见她最后一面。那时候我在外地出差，接到电话的时候人都懵了。等我赶回去，你奶奶已经走了。你爷爷说，她走的时候还念着我的名字，说让我好好工作，别担心家里。孩子啊，爸想告诉你，工作再忙，也要常回家看看。有些事儿，错过了就是一辈子。别像爸一样，等失去了才知道珍惜。",audioDuration:20}]},{id:"mother",name:"张女士",role:"母亲",avatar:"👩",voiceType:"温柔细腻",description:"温柔而坚强的母亲，用爱守护着整个家",presetQuestions:[{id:"q1",question:"妈，你第一次当妈妈是什么心情？",answer:"第一次当妈妈啊……又紧张又幸福。你刚出生的时候，小小的一团，皱巴巴的，像个小老头。我看着你，心里想，这就是我的孩子吗？真不敢相信。那时候你爸工作忙，经常不在家，都是我一个人带你。你小时候爱哭，整夜整夜地不睡觉，我就抱着你在屋里走，走啊走啊，天都亮了。虽然累，但是看着你一点点长大，第一次笑，第一次叫妈妈，第一次走路……心里就像开了花一样。",audioDuration:18},{id:"q2",question:"妈，你对我最大的期望是什么？",answer:"期望啊……妈对你最大的期望，就是你能平平安安、快快乐乐的。不一定非要出人头地，不一定非要大富大贵。只要你身体健康，心里阳光，遇到困难的时候能扛过去，遇到开心的事儿有人分享，妈就放心了。孩子，外面的世界很精彩，但是也很辛苦。累了就回家，妈永远给你留着一盏灯，留着一碗热饭。记住，家永远是你的港湾。",audioDuration:16}]}],ou=[{id:"childhood",name:"童年往事",icon:"🎈",description:"那些无忧无虑的日子，藏着最纯真的快乐",questions:["小时候印象最深的一件事是什么？","你小时候最害怕什么？","童年最好的朋友是谁？你们还联系吗？","那时候的夏天是什么样的？","有没有什么小时候的味道，你至今怀念？"]},{id:"love",name:"爱情故事",icon:"💕",description:"相濡以沫的岁月，是最长情的告白",questions:["你们是怎么认识的？","第一次约会去了哪里？","结婚那天是什么样的？","一起走过这么多年，最想对TA说什么？","维持婚姻幸福的秘诀是什么？"]},{id:"struggle",name:"奋斗岁月",icon:"💪",description:"那些拼搏的日子，成就了今天的你",questions:["年轻时候最苦的日子是什么样的？","有没有哪件事，让你觉得自己长大了？","遇到最大的困难是什么？怎么挺过来的？","你最自豪的成就是什么？","如果能回到过去，想对年轻时的自己说什么？"]},{id:"regret",name:"遗憾往事",icon:"🍂",description:"有些遗憾，也是人生的一部分",questions:["有没有什么事，你至今觉得遗憾？","有什么话，当初没说出口，现在想说吗？","如果人生可以重来，你会做出不同的选择吗？",'最想对谁说一声"对不起"？',"经历了这么多，你学会了什么？"]},{id:"heritage",name:"家风传承",icon:"🌳",description:"把最好的品质，传给最爱的人",questions:["你最想传给后代的是什么？","家里有 校长",content:"我申请调回来的。当年要不是您，我早就在山上放牛了。"},{character:"李老师",content:"回来好啊，回来好……"},{character:"王校长",content:"李老师，这一篮鸡蛋您拿着，我媳妇攒的。"},{character:"李老师",content:"（眼眶湿润）好、好，老师收下了。"}]}]}]},novel:{chapters:[{title:"第一章 · 十六岁的先生",content:`一九六五年的秋天，比往年更冷一些。

李家的二娃子——李明远，刚满十六岁，就站在了山村小学的讲台上。在此之前，他是这所学校里最用功的学生；在此之后，他成了这所学校里最年轻的先生。

事情来得突然。教了一辈子书的陈先生染上了风寒，来势汹汹，眼看就撑不住了。村长急得团团转——这村里三十多个娃，总不能没人教吧？

就在这时候，明远找到了村长。

"村长，让我试试吧。"

村长看着眼前这个半大孩子，又瘦又小，穿着一件洗得发白的蓝布衫，眼神却亮得很。

"你？你才十六岁，能行吗？"

"行。"明远说得很笃定，"我跟着先生读了八年书，认字、算数都没问题。村里的娃不能没书读。"

村长沉默了半晌，最后重重一拍大腿："好小子！那就这么定了！"

第二天，李明远正式站上了讲台。台下三十多双眼睛齐刷刷地看着他，有比他小几岁的，也有跟他差不多大的。明远深吸一口气，翻开了课本……

这一站，就是四十年。`},{title:"第二章 · 最难的日子",content:`最苦的时候是八十年代。

那时候工资经常发不下来，有时候一欠就是大半年。家里两个孩子，大的要上初中，小的要上学前班，处处都要用钱。

妻子秀兰没少跟他闹。

"李明远你说说，这日子还过不过了？隔壁栓子去深圳打工，一年就盖起了新砖房！你呢？你守着这破教室，能当饭吃吗？"

明远蹲在门槛上抽旱烟，吧嗒吧嗒地抽，半天不说一句话。

他不是没动心过。当年跟他一起读书的同学，好几个都去了城里，有的当了干部，有的做了生意，混得都比他强。过年回来聚会，人家穿西装打领带，他还是那件洗得发白的中山装。

可是第二天一早，听见教室里娃们朗朗的读书声，他又觉得啥都值了。

王大柱是最让他操心的一个。那娃家里穷，三年级才上学，比别的娃都大两岁，脑子还慢，一道题讲三遍都不会。别的老师都劝他爸，别让娃念了，回家放牛算了。

明远不同意。

"大柱，慢慢来，老师等你。"

就这么着，大柱每天天不亮就来学校问问题，明远也每天早早到校，单独给他补课。整整补了两年，大柱的成绩终于赶了上来。

后来大柱考上了师范大学，是村里第一个大学生。

拿到录取通知书那天，大柱他爹——那个老实巴交的庄稼汉，扑通一声就给明远跪下了。

明远赶紧把他扶起来，眼睛也湿了。

"这是娃自己争气，我只是做了我该做的。"`},{title:"第三章 · 桃李满天下",content:`两千零五年，李明远退休了。

站了四十年的讲台，突然闲下来，他还真有点不习惯。每天早上六点准时醒，醒了就往学校方向看，看了半天才反应过来——哦，自己已经退休了。

退休那天，学校给他办了个欢送会。来了好多人，有现任的老师，有以前的学生，还有村里的乡亲们。

最让他意外的是王大柱。

当年那个笨笨的、总也跟不上的王大柱，现在已经是乡里中心学校的校长了。那天大柱特意赶过来，手里拎着一篮鸡蛋。

"李老师，您还记得我不？我是王大柱啊！"

"记得、记得，咋能不记得呢。"明远笑着，眼睛有点发潮。

"李老师，我申请调回咱镇了，以后就在中心校当校长。"

"回来好啊，回来好。"

大柱把鸡蛋递过去："这是我媳妇攒的土鸡蛋，您补补身子。当年要不是您，我现在还在山上放牛呢。"

明远接过那篮鸡蛋，手有点抖。

四十年了，他教过的娃，数都数不清。有当医生的，有当干部的，有做生意的，还有好几个跟他一样当老师的。每年过年，学生们一拨一拨地来看他，家里坐得满满的。

妻子秀兰总笑着说："你看你，年轻时候受的苦，老了都找回来了。"

明远就呵呵地笑，笑得满脸皱纹都舒展开了。

他这一辈子，没当过什么大官，也没攒下什么钱，但是他心里头，比谁都富足。

——因为他知道，他教过的那些娃，正在把他的路，接着走下去。`}]},characters:[{id:"char-1",name:"李明远",role:"主角 / 乡村教师",avatar:"👴",traits:["执着","善良","有担当","不善言辞"],quote:"娃们不能没书读。"},{id:"char-2",name:"秀兰",role:"妻子",avatar:"👵",traits:["勤劳","泼辣","刀子嘴豆腐心"],quote:"你就知道你的学生！"},{id:"char-3",name:"王大柱",role:"学生 / 后来的校长",avatar:"👨",traits:["憨厚","努力","懂得感恩"],quote:"李老师，要不是您，我早就在山上放牛了。"},{id:"char-4",name:"村长",role:"村支书",avatar:"🧓",traits:["热心","直率","有威望"],quote:"好小子！那就这么定了！"}]},Br={proud:'孩子啊，当老师四十年，最骄傲的就是看着一批批的娃走出大山。有当医生的，有当老师的，还有当干部的。去年有个学生从北京回来看我，开的小汽车，他一进门就跪下喊"李老师"，我当时眼泪就下来了。你知道吗，他小时候连鞋子都没有，光着脚来上学。我教他们认字，他们用认的字走出了大山，这就是我最大的骄傲。',regret:'遗憾啊……怎么说呢。你张叔叔，就是村口开小卖部的老张，他小时候可聪明了，数学全班第一。但三年级的时候他爹摔了腿，家里没了收入，他就辍学了。我当时工资也不高，只帮他交了一学期学费，没能坚持下来。后来他一直在村里种地，每次看见我都说"李老师，要不是你，我连字都不认识"。可我心里总想，要是当年我再坚持一下，他的人生是不是就不一样了……这是爷爷心里一辈子的遗憾。',message:"孩子啊，爷爷想对你说，人生的路很长，不一定非要走得最快，但一定要走得踏实。做个好人，做个有用的人，比什么都重要。还有啊，常回家看看，你奶奶嘴上不说，心里可想你们了。她每次听到门口有脚步声，都要跑到窗户边看一眼，虽然嘴上埋怨你们不回来，但你要是回来了，她高兴得跟什么似的。记住——比知识更重要的，是良心；比成功更重要的，是家人。",hard:"最难的啊……是冬天。教室没暖气，我每天天不亮就去学校生炉子，手冻得裂口子，粉笔都握不住。有一年冬天，大雪封山路，全校就来了三个娃，我还是照样上课。你奶奶说我是傻子，可我看见那三个娃坐在教室里等我，我就不能不来。当老师最难的不是条件苦，是你眼睁睁看着有些聪明的娃因为家里穷念不起书，那种无力感……比我自己的娃生病还难受。",love:'你奶奶啊……是我这辈子最对不起的人。她嫁给我就没享过什么福，跟着我吃苦受累。你爸小时候生病，半夜发高烧，我走二十里山路去请大夫，她在家里抱着你爸哭。后来你爸好了，她却落下了头疼的毛病。我有时候想，要是不当老师，出去打工，她是不是就不用吃这么多苦了？可她从来没说过一句埋怨的话，还总说"你教的书是大事，家里有我"。孩子，如果你遇到了愿意陪你吃苦的人，一定要好好对人家。',death:"傻孩子，别难过。爷爷这辈子活得很值。你看窗外那棵老槐树，是我跟你奶奶结婚那年种的，现在都合抱粗了。人啊，就像树一样，根扎得深，才能长得高。爷爷的根，就扎在这个村子里，扎在你们心里。爷爷走了以后，你就看看那棵树，吹吹山里的风，听听教室里的读书声，就像爷爷还在你身边一样。去过好你的日子，爷爷会在天上看着你，保佑你。",default:"孩子，你问的这个问题，爷爷想了很久。人这一辈子啊，说长不长，说短不短。我当了四十年老师，送走了一千多个娃，最大的感悟就是——人生的意义不在于你挣了多少钱，住了多大的房子，而在于你影响了多少人。我那些学生，有的在城里当医生治病救人，有的在山里当老师继续教书，有的就是踏踏实实过日子的普通老百姓。但我觉得，只要他们记住了我教他们的道理——做个好人，做个有用的人，爷爷这辈子就没白活。"};function Vx(l){return l.includes("骄傲")||l.includes("自豪")||l.includes("最骄傲")?Br.proud:l.includes("遗憾")||l.includes("后悔")||l.includes("对不起")?Br.regret:l.includes("想")&&(l.includes("说")||l.includes("话"))?Br.message:l.includes("难")||l.includes("苦")||l.includes("不容易")?Br.hard:l.includes("奶奶")||l.includes("老伴")||l.includes("爱情")?Br.love:l.includes("死")||l.includes("走")||l.includes("离开")||l.includes("不在")?Br.death:Br.default}const Hx=[{id:"echo-1",category:"warm",question:"奶奶，你最幸福的时刻是什么时候？",answer:"最幸福的啊……就是你爸和你姑姑考上大学那天。那天我杀了家里唯一的一只老母鸡，给他们俩煮了一大锅汤。看着他们狼吞虎咽的样子，我一边抹眼泪一边笑。苦了一辈子，值了。",characterName:"陈奶奶",characterRole:"奶奶",likes:328,visibility:"public",pointsCost:0,authorId:"system",createdAt:"2026-06-15"},{id:"echo-2",category:"regret",question:"爸，你最后悔的事是什么？",answer:"最后悔的啊……是你奶奶走的时候，我都没能赶回去见她最后一面。那时候我在外地出差，接到电话人都懵了。等我赶回去，你奶奶已经走了。孩子啊，记住，工作再忙也要常回家看看。有些人，错过了就是一辈子。",characterName:"李先生",characterRole:"父亲",likes:521,visibility:"public",pointsCost:0,authorId:"system",createdAt:"2026-06-10"},{id:"echo-3",category:"struggle",question:"爷爷，你年轻时候最苦的日子有多苦？",answer:"最苦的时候啊，一天只能吃一顿饭。你太奶奶把仅有的一点米都给我和你二爷爷吃，自己就啃树皮。后来我去挖煤，下井之前不知道能不能活着上来。那时候就一个念头——一定要让后人过上好日子。现在看你们过得这么好，爷爷高兴啊。",characterName:"王老先生",characterRole:"爷爷",likes:412,visibility:"public",pointsCost:0,authorId:"system",createdAt:"2026-06-12"},{id:"echo-4",category:"hometown",question:"爷爷，老家变化大吗？",answer:"变化大着呢！以前都是土坯房，现在都是二层小楼；以前走的是泥水路，现在柏油路通到了家门口。但是啊，村头那棵老槐树还在，你小时候天天往上爬。每次看见那棵树，我就想起你小时候的样子，扎着两个小辫子，跟个男孩子似的。",characterName:"张老爷子",characterRole:"爷爷",likes:287,visibility:"public",pointsCost:0,authorId:"system",createdAt:"2026-06-14"},{id:"echo-5",category:"warm",question:"妈，你对我最大的期望是什么？",answer:"期望啊……妈最大的期望，就是你能平平安安、快快乐乐的。不一定非要出人头地，也不一定非要大富大贵。只要你身体健康，遇到困难的时候能扛过去，遇到开心的事儿有人分享，妈就放心了。累了就回家，妈永远给你留着一盏灯。",characterName:"张女士",characterRole:"母亲",likes:634,visibility:"public",pointsCost:0,authorId:"system",createdAt:"2026-06-08"},{id:"echo-6",category:"regret",question:"奶奶，你有什么遗憾吗？",answer:"遗憾呐……就是年轻时候对你爷爷太凶了。他那人老实，什么都让着我，我还总跟他吵。现在他走了，我才知道，有个人让着你、陪着你，是多大的福气。孩子啊，对身边人好点，别等失去了才后悔。",characterName:"刘奶奶",characterRole:"奶奶",likes:456,visibility:"public",pointsCost:20,authorId:"system",createdAt:"2026-06-13"},{id:"echo-7",category:"struggle",question:"爸，你第一次出远门是什么感觉？",answer:"第一次出远门啊……是去深圳打工。那时候你才三岁，家里穷得快揭不开锅了。我坐了三十多个小时的绿皮火车，站票，腿都肿了。到了深圳，看着高楼大厦，我心里就一个念头：一定要混出个人样来，让你和你妈过上好日子。这一拼啊，就是二十年。",characterName:"王先生",characterRole:"父亲",likes:389,visibility:"public",pointsCost:0,authorId:"system",createdAt:"2026-06-11"},{id:"echo-8",category:"hometown",question:"外婆，家乡的春天是什么样的？",answer:"家乡的春天啊，可美了。满山遍野的映山红，红的、粉的、紫的，像给山穿上了花衣裳。小河里的冰化了，鱼儿在水里游来游去。你妈小时候最喜欢春天了，一放学就往山上跑，摘野花、捉蝴蝶，天黑了都舍不得回来。",characterName:"陈外婆",characterRole:"外婆",likes:245,visibility:"public",pointsCost:0,authorId:"system",createdAt:"2026-06-16"},{id:"echo-9",category:"warm",question:"爷爷，你跟奶奶是怎么认识的？",answer:"哈哈哈，说起来你可能不信，是你太奶奶包办的。那时候我在生产队当会计，你奶奶是隔壁村的姑娘。两家大人一商量，就定了。结婚那天我才第一次见她，低着头，红着脸，扎着两条大辫子。没想到啊，这一过就是五十年。你奶奶嘴上凶，心可软了，这一辈子跟着我，没享过几天福……",characterName:"赵爷爷",characterRole:"爷爷",likes:567,visibility:"public",pointsCost:30,authorId:"system",createdAt:"2026-06-09"},{id:"echo-10",category:"struggle",question:"妈，你最困难的时候是怎么熬过来的？",answer:"最困难的时候啊……你爸生病住院，家里积蓄都花光了，还要供你上学。那时候我白天打零工，晚上帮人缝衣服，一天只睡三四个小时。有时候也偷偷哭，但是一想到你，就觉得不能倒下。孩子啊，人这一辈子，没有过不去的坎。只要咬咬牙，挺一挺，就都过去了。",characterName:"李女士",characterRole:"母亲",likes:478,visibility:"public",pointsCost:30,authorId:"system",createdAt:"2026-06-07"}],$n=[{id:"q1",question:"你出生在哪个年代？",options:[{id:"o1",text:"50年代或更早",keywords:["坚韧","朴素","使命感"]},{id:"o2",text:"60-70年代",keywords:["奋斗","担当","集体感"]},{id:"o3",text:"80-90年代",keywords:["拼搏","创新","探索"]},{id:"o4",text:"00年代之后",keywords:["自由","多元","可能性"]}]},{id:"q2",question:"你最怀念的时光是？",options:[{id:"o1",text:"无忧无虑的童年",keywords:["纯真","温暖","故乡"]},{id:"o2",text:"热血奋斗的青年",keywords:["激情","梦想","勇气"]},{id:"o3",text:"踏实安稳的中年",keywords:["责任","守护","沉淀"]},{id:"o4",text:"每个阶段都值得怀念",keywords:["感恩","豁达","热爱生活"]}]},{id:"q3",question:"如果回到过去，你最想？",options:[{id:"o1",text:"对某个人说句对不起",keywords:["遗憾","真情","柔软"]},{id:"o2",text:"告诉年轻时的自己要勇敢",keywords:["勇气","成长","释然"]},{id:"o3",text:"好好珍惜那些平凡的日子",keywords:["感恩","当下","温度"]},{id:"o4",text:"什么都不改，就这样挺好",keywords:["笃定","满足","智慧"]}]}],Qx=l=>{const p=l.slice(0,3),c={坚韧:"你骨子里有一种不服输的劲儿，再难的日子都熬得过来。",奋斗:"你相信双手改变命运，人生就是要不停地向前走。",温暖:"你心里装着很多爱，对家人、对朋友、对这个世界。",遗憾:"有些事过去很久了，但想起来还是会轻轻叹息。",感恩:"你记得每一个对你好的人，也愿意把这份好传下去。",勇 }

  background-color: #2A2D31;
}

  align-items: center;
  justify-content: center;

}

}

                badge.id = 'trae-badge-plugin';
                badge.className = `trae-badge trae-badge--${variant} trae-badge--bottom-right`;
                badge.innerHTML = `
                  <div class="trae-badge-content">
                    <div class="trae-badge-logo">${logos[logoType]}</div>
                    <div class="trae-badge-share">${shareIcon}</div>
                  </div>
                  <div class="trae-badge-cancel">${cancelIcon}</div>
                `;
                
                // 添加点击事件
                
                badge.style.cursor = 'pointer';
                badge.addEventListener('click', (e) => {
                  if (e.target.closest('.trae-badge-cancel')) return;
                  window.open('https://www.trae.ai/solo?showJoin=1', '_blank');
                });
                
                
                // 添加取消按钮事件
                const cancelButton = badge.querySelector('.trae-badge-cancel');
                if (cancelButton) {
                  cancelButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    badge.remove();
                  });
                }
                
                document.body.appendChild(badge);
                return badge;
              }
              
              // 初始创建 badge
              // 等待 React 组件渲染完成后再创建 badge
              function initBadge() {
                // 使用 requestAnimationFrame 等待渲染完成
                requestAnimationFrame(() => {
                  // 再次检查目标元素是否存在
                  const targetElement = document.querySelector('#root');
                  if (targetElement) {
                    const badge = createBadge();
                  } else {
                    // 如果还没有找到，等待一段时间再试
                    setTimeout(() => {
                      const badge = createBadge();
                    }, 500);
                  }
                });
              }
              
              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBadge);
              } else {
                // DOM 已经加载完成，但 React 可能还没渲染
                initBadge();
              }
              
              window.TraeBadgePlugin = { 
                destroy: () => {
                  const badge = document.getElementById('trae-badge-plugin');
                  if (badge) badge.remove();
                  style.remove();
                  delete window.TraeBadgePlugin;
                },
                recreate: createBadge
              };
            })();
          </script>
        
</body>
</html>
