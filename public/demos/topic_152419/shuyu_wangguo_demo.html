<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>数趣王国 — 数学思维探险</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --geo:#4ECDC4;--alg:#A78BFA;--ana:#FF8C42;--num:#FF85A1;--log:#6BCB77;--com:#89CFF0;
  --dark:#2D3436;--mid:#636E72;--light:#B2BEC3;--bg:#FFF9F0;--card:#fff;
  --gold:#FFD700;--pk:#FF85A1;--r:#FF6B6B;--g:#6BCB77;--y:#FFD93D;
}
body{font-family:'Noto Sans SC','PingFang SC',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ===== 浮动符号背景 ===== */
.pbg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.pbg .pp{position:absolute;font-weight:700;animation:pdr linear infinite;user-select:none;pointer-events:none}
@keyframes pdr{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}

/* ===== 头部导航 ===== */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,249,240,.95);backdrop-filter:blur(10px);padding:8px 12px 6px;border-bottom:1px solid rgba(0,0,0,.04)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back-btn{width:32px;height:32px;border:none;background:#f0f0f0;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mid);transition:all .2s;flex-shrink:0}
.back-btn:active{transform:scale(.9)}
.back-btn.hide{visibility:hidden}
.hdr h1{font-size:16px;font-weight:900;text-align:center;flex:1;letter-spacing:1px}
.hdr h1 .ho{color:var(--ana)}.hdr h1 .hs{color:var(--com)}
.collect-btn{width:32px;height:32px;border:none;background:#f0f0f0;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;position:relative}
.collect-btn:active{transform:scale(.9)}
.collect-badge{position:absolute;top:-4px;right:-4px;background:var(--r);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.breadcrumb{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px;font-size:10px;color:var(--mid);font-weight:600}
.breadcrumb .bc-item{cursor:pointer;transition:color .2s}
.breadcrumb .bc-item:hover{color:var(--ana)}
.breadcrumb .bc-sep{color:var(--light)}
.breadcrumb .bc-cur{color:var(--dark);font-weight:700}
.stats{display:flex;gap:10px;justify-content:center;margin-top:4px;font-size:10px;color:var(--mid);font-weight:700;align-items:center;flex-wrap:wrap}
.stats b{color:var(--ana)}
.stats .combo-display{display:none;align-items:center;gap:2px;color:var(--r);font-weight:900;animation:comboPop .3s ease}
.stats .combo-display.active{display:inline-flex}
@keyframes comboPop{0%{transform:scale(1.3);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

/* ===== 屏幕管理 ===== */
.screen{display:none;padding:12px;padding-bottom:80px;animation:scrnIn .3s ease;position:relative;z-index:1}
.screen.on{display:block}
@keyframes scrnIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== 数学大门 ===== */
.gate-wrap{display:flex;flex-direction:column;align-items:center;padding-top:20px;position:relative;z-index:2}

/* 【优化1】大门弹性缩放动画 */
.gate-card{width:280px;aspect-ratio:5/7;border-radius:20px;background:linear-gradient(145deg,#FF8C42 0%,#FF6B6B 40%,#A78BFA 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 40px rgba(255,140,66,.35);position:relative;overflow:hidden;transition:all .3s;z-index:2;animation:gateBounce 1.2s cubic-bezier(.68,-.55,.27,1.55) forwards}
.gate-card:active{transform:scale(.97)!important}
.gate-card::before{content:'';position:absolute;inset:5px;border:2px solid rgba(255,255,255,.25);border-radius:15px;pointer-events:none}
.gate-card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.15),transparent 60%);pointer-events:none}
@keyframes gateBounce{
  0%{transform:scale(.3);opacity:0}
  40%{transform:scale(1.08);opacity:1}
  60%{transform:scale(.95)}
  80%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
.gate-door{font-size:60px;animation:gateGlow 2s ease-in-out infinite;z-index:1}
@keyframes gateGlow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(255,255,255,.5))}50%{transform:scale(1.08);filter:drop-shadow(0 0 18px rgba(255,255,255,.8))}}
.gate-title{font-size:26px;font-weight:900;color:#fff;margin-top:14px;letter-spacing:3px;text-shadow:0 2px 12px rgba(0,0,0,.25);z-index:1}
.gate-sub{font-size:12px;color:rgba(255,255,255,.85);margin-top:6px;z-index:1}
.gate-stats{display:flex;gap:20px;margin-top:20px;z-index:1}
.gate-stat{text-align:center}
.gate-stat .gs-n{font-size:22px;font-weight:900;color:#fff;display:block}
.gate-stat .gs-l{font-size:9px;color:rgba(255,255,255,.7);margin-top:2px}
.gate-hint{font-size:11px;color:rgba(255,255,255,.6);margin-top:18px;animation:pulse 2s ease-in-out infinite;z-index:1}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.gate-intro{text-align:center;margin-top:24px;font-size:12px;color:var(--mid);line-height:2}
.gate-intro b{color:var(--dark)}

/* 【优化1】星星/光点粒子效果 */
.gate-particles{position:absolute;width:100%;height:100%;top:0;left:0;pointer-events:none;z-index:1;overflow:visible}
.gate-particle{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;animation:gateFloat linear infinite}
.gate-particle:nth-child(1){left:5%;animation-duration:4s;animation-delay:0s;box-shadow:0 0 8px #FFD700}
.gate-particle:nth-child(2){left:15%;animation-duration:5s;animation-delay:.5s;box-shadow:0 0 6px #FF8C42;width:4px;height:4px}
.gate-particle:nth-child(3){left:25%;animation-duration:3.5s;animation-delay:1s;box-shadow:0 0 10px #A78BFA;width:5px;height:5px}
.gate-particle:nth-child(4){left:35%;animation-duration:4.5s;animation-delay:.3s;box-shadow:0 0 7px #4ECDC4}
.gate-particle:nth-child(5){left:50%;animation-duration:3s;animation-delay:.8s;box-shadow:0 0 9px #FFD700;width:7px;height:7px}
.gate-particle:nth-child(6){left:65%;animation-duration:5.5s;animation-delay:1.2s;box-shadow:0 0 6px #FF85A1;width:4px;height:4px}
.gate-particle:nth-child(7){left:75%;animation-duration:4.2s;animation-delay:.2s;box-shadow:0 0 8px #89CFF0}
.gate-particle:nth-child(8){left:85%;animation-duration:3.8s;animation-delay:.7s;box-shadow:0 0 10px #FFD93D;width:5px;height:5px}
.gate-particle:nth-child(9){left:10%;animation-duration:6s;animation-delay:1.5s;box-shadow:0 0 5px #FF8C42;width:3px;height:3px}
.gate-particle:nth-child(10){left:45%;animation-duration:4.8s;animation-delay:.4s;box-shadow:0 0 7px #A78BFA;width:3px;height:3px}
.gate-particle:nth-child(11){left:55%;animation-duration:3.2s;animation-delay:1.8s;box-shadow:0 0 9px #4ECDC4;width:4px;height:4px}
.gate-particle:nth-child(12){left:90%;animation-duration:5.2s;animation-delay:.9s;box-shadow:0 0 6px #FF85A1}
@keyframes gateFloat{
  0%{transform:translateY(0) translateX(0) scale(0);opacity:0}
  15%{opacity:.8;transform:scale(1)}
  50%{opacity:.6}
  85%{opacity:.3}
  100%{transform:translateY(-120px) translateX(var(--dx,20px)) scale(.3);opacity:0}
}

/* 【优化1】数学名言轮播 */
.gate-quotes{width:280px;margin-top:20px;text-align:center;min-height:36px;position:relative;z-index:2}
.gate-quote{position:absolute;width:100%;font-size:11px;color:var(--mid);font-style:italic;line-height:1.5;opacity:0;transition:opacity .6s ease;font-weight:500}
.gate-quote.active{opacity:1}
.gate-quote-author{font-size:9px;color:var(--light);margin-top:2px;display:block;font-style:normal}

/* 【优化5】新手引导气泡 */
.guide-bubble{position:absolute;z-index:100;animation:guideFloat 2s ease-in-out infinite;pointer-events:none}
.guide-bubble-tip{background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.15);font-size:12px;font-weight:700;color:var(--dark);white-space:nowrap;position:relative}
.guide-bubble-tip::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #fff}
.guide-bubble-close{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--r);color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 2px 6px rgba(255,107,107,.4)}
@keyframes guideFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.guide-bubble-gate{top:-80px;left:50%;transform:translateX(-50%)}
.guide-bubble-branch{position:relative;text-align:center;margin-bottom:16px;padding:12px 20px;background:rgba(255,140,66,.08);border-radius:16px;border:2px dashed var(--ana);font-size:13px;font-weight:700;color:var(--ana);animation:guideFloat 2s ease-in-out infinite;display:inline-block}

/* ===== 扑克卡片 ===== */
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:600px;margin:0 auto}
@media(min-width:500px){.card-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.card-grid{grid-template-columns:repeat(4,1fr)}}

.pcard{aspect-ratio:5/7.2;border-radius:12px;background:linear-gradient(145deg,#fff,#f9f9f9);box-shadow:0 3px 14px rgba(0,0,0,.07);position:relative;overflow:hidden;cursor:pointer;transition:all .25s;border:2px solid var(--bc);display:flex;flex-direction:column;perspective:800px}
.pcard:active{transform:scale(.96)}
.pcard.locked{cursor:default}
.pcard.locked:active{transform:none}

/* 【优化3】卡片hover微上浮发光 */
.pcard:not(.locked):hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12),0 0 16px var(--bc)}

/* 卡牌正面 */
.pcard-hdr{display:flex;justify-content:space-between;align-items:center;padding:5px 7px;font-size:8px;font-weight:800}
.pcard-rarity{color:var(--bc);letter-spacing:.5px}
.pcard-branch{color:var(--mid);font-size:7px}
.pcard-portrait{display:flex;align-items:center;justify-content:center;flex:1;font-size:38px;position:relative;padding:4px}
.pcard-portrait::after{content:'';position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,var(--bc) 0%,transparent 70%);opacity:.12}
.pcard-info{text-align:center;padding:0 6px}
.pcard-name{font-size:13px;font-weight:900;line-height:1.2}
.pcard-year{font-size:8px;color:var(--light);margin-top:1px}
.pcard-ability{margin:5px 6px;padding:3px 6px;background:var(--bc);color:#fff;border-radius:5px;font-size:9px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-contrib{font-size:8px;color:var(--mid);text-align:center;padding:0 6px;margin-bottom:3px;line-height:1.3}
.pcard-flavor{font-size:7px;color:var(--light);text-align:center;font-style:italic;padding:2px 8px;border-top:1px solid rgba(0,0,0,.04);line-height:1.4}
.pcard-ftr{display:flex;justify-content:space-between;padding:2px 7px;font-size:7px;color:var(--light)}
.pcard-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:#eee}
.pcard-progress .fill{height:100%;background:var(--bc);transition:width .5s}

/* 卡牌背面（锁定） */
.pcard-back{position:absolute;inset:0;background:repeating-linear-gradient(45deg,var(--bc) 0px,var(--bc) 8px,rgba(0,0,0,.15) 8px,rgba(0,0,0,.15) 16px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;border-radius:10px}
.pcard-back::before{content:'';position:absolute;inset:6px;border:2px solid rgba(255,255,255,.2);border-radius:8px}
.pcard-back-icon{font-size:28px;opacity:.7;margin-bottom:6px}
.pcard-back-text{font-size:11px;font-weight:800;opacity:.8;letter-spacing:1px}
.pcard-back-hint{font-size:8px;opacity:.6;margin-top:4px}

/* 稀有度效果 */
.pcard.r-R{box-shadow:0 3px 14px rgba(0,0,0,.07),0 0 5px var(--bc)}
.pcard.r-SR{box-shadow:0 3px 16px rgba(0,0,0,.08),0 0 10px var(--bc);background:linear-gradient(145deg,#fff,#f8fcff)}
.pcard.r-SSR{box-shadow:0 4px 20px rgba(0,0,0,.1),0 0 14px var(--bc);background:linear-gradient(145deg,#fff,#fffaf5);overflow:hidden}
.pcard.r-SSR::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);animation:shimmer 3s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.pcard.r-UR{border-color:var(--gold);box-shadow:0 4px 25px rgba(255,215,0,.35),0 0 18px var(--bc);background:linear-gradient(145deg,#fff,#fffacd,#fff);animation:cardShine 3s ease-in-out infinite}
@keyframes cardShine{0%,100%{box-shadow:0 4px 25px rgba(255,215,0,.35),0 0 18px var(--bc)}50%{box-shadow:0 4px 35px rgba(255,215,0,.65),0 0 28px var(--bc)}}

/* 【优化3】SSR/UR卡片微光旋转效果 */
.pcard.r-SSR .glow-bg,.pcard.r-UR .glow-bg{position:absolute;inset:0;pointer-events:none;z-index:0}
.pcard.r-SSR .glow-bg{background:conic-gradient(from var(--glow-angle,0deg),transparent 0%,rgba(78,205,196,.08) 10%,transparent 20%,rgba(167,139,250,.08) 30%,transparent 40%,rgba(255,140,66,.08) 50%,transparent 60%,rgba(78,205,196,.08) 70%,transparent 80%,rgba(255,215,0,.08) 90%,transparent 100%);animation:glowRotate 6s linear infinite}
.pcard.r-UR .glow-bg{background:conic-gradient(from var(--glow-angle,0deg),transparent 0%,rgba(255,215,0,.12) 10%,transparent 20%,rgba(255,140,66,.1) 30%,transparent 40%,rgba(255,215,0,.12) 50%,transparent 60%,rgba(255,140,66,.1) 70%,transparent 80%,rgba(255,215,0,.12) 90%,transparent 100%);animation:glowRotate 4s linear infinite}
@keyframes glowRotate{from{--glow-angle:0deg}to{--glow-angle:360deg}}
@property --glow-angle{syntax:'<angle>';initial-value:0deg;inherits:false}

/* 【优化3】卡片3D翻转 */
.card-flip-container{perspective:800px}
.card-flip-inner{transition:transform .6s ease;transform-style:preserve-3d;position:relative;width:100%;height:100%}
.card-flip-inner.flipped{transform:rotateY(180deg)}
.card-flip-front,.card-flip-back{backface-visibility:hidden;position:absolute;inset:0}
.card-flip-back{transform:rotateY(180deg);background:#fff;border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card-flip-back .cfb-emoji{font-size:36px;margin-bottom:8px}
.card-flip-back .cfb-name{font-size:14px;font-weight:900;margin-bottom:4px}
.card-flip-back .cfb-method{font-size:11px;color:var(--bc);font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.04);margin-bottom:4px}
.card-flip-back .cfb-desc{font-size:9px;color:var(--mid);text-align:center;line-height:1.5}
.card-flip-back .cfb-flip-hint{font-size:8px;color:var(--light);margin-top:8px;animation:pulse 2s ease-in-out infinite}

/* 已收集标记 */
.pcard.collected::before{content:'✓';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:18px;height:18px;background:var(--g);color:#fff;border-radius:50%;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 6px rgba(107,203,119,.4)}

/* 分支标题 */
.branch-title{text-align:center;margin-bottom:14px}
.branch-title h2{font-size:16px;font-weight:900;color:var(--dark)}
.branch-title p{font-size:11px;color:var(--mid);margin-top:4px}
.branch-tag{display:inline-block;font-size:9px;padding:2px 10px;border-radius:10px;font-weight:700;margin-top:6px;color:#fff}

/* ===== 挑战屏幕 ===== */
.ch-wrap{max-width:520px;margin:0 auto}
.ch-math-info{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.05);border:2px solid var(--bc)}
.ch-math-emoji{font-size:36px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.03);border-radius:12px;flex-shrink:0;position:relative}
.ch-math-emoji::after{content:'';position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,var(--bc) 0%,transparent 70%);opacity:.1}
.ch-math-info .ch-mn{font-size:15px;font-weight:900}
.ch-math-info .ch-mm{font-size:10px;color:var(--mid)}
.ch-math-info .ch-mc{font-size:9px;color:var(--bc);font-weight:700;margin-top:2px}

/* 【优化7】挑战页面进度条 */
.ch-progress-bar{height:6px;background:#f0f0f0;border-radius:3px;margin:0 0 6px;overflow:hidden}
.ch-progress-bar .fill{height:100%;border-radius:3px;transition:width .5s ease}

.ch-progress{text-align:center;font-size:11px;color:var(--mid);font-weight:700;margin-bottom:4px}
.ch-progress .ch-pcur{color:var(--ana)}
.ch-qbox{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 12px rgba(0,0,0,.05);border:2px solid #f0f0f0;transition:all .3s ease;position:relative}
.ch-q{font-size:14px;font-weight:700;line-height:1.7;margin-bottom:8px}
.ch-svg{display:flex;justify-content:center;margin:8px 0}
.ch-opts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.ch-opt{background:#fff;border:2px solid #e8e8e8;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;font-family:inherit;position:relative;overflow:hidden}
/* 【优化7】选项hover左边框高亮 */
.ch-opt:hover{border-left-color:var(--ana);border-left-width:4px;padding-left:10px}
.ch-opt:active{transform:scale(.98)}
.ch-opt.ok{border-color:var(--g);background:rgba(107,203,119,.08);animation:correctPulse .5s ease}
.ch-opt.bad{border-color:var(--r);background:rgba(255,107,107,.08);animation:shk .4s ease}
@keyframes shk{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}90%{transform:translateX(2px)}}
@keyframes correctPulse{0%{box-shadow:0 0 0 0 rgba(107,203,119,.4)}70%{box-shadow:0 0 0 12px rgba(107,203,119,0)}100%{box-shadow:0 0 0 0 rgba(107,203,119,0)}}
.ch-oi{width:22px;height:22px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.ch-opt.ok .ch-oi{background:var(--g);color:#fff}
.ch-opt.bad .ch-oi{background:var(--r);color:#fff}
.ch-opt.disabled{pointer-events:none;opacity:.6}
.ch-fill-row{display:flex;gap:8px;margin-top:10px}
.ch-input{flex:1;height:40px;border:3px solid var(--com);border-radius:10px;padding:0 12px;font-size:16px;font-weight:900;font-family:inherit;outline:none;color:var(--com);text-align:center}
.ch-input:focus{border-color:var(--ana)}
.ch-submit{padding:0 18px;border:none;background:var(--ana);color:#fff;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s}
.ch-submit:active{transform:scale(.95)}
.ch-hint{background:rgba(255,217,61,.1);border-radius:8px;padding:8px 11px;font-size:11px;color:var(--mid);margin-top:8px;display:none;line-height:1.6}
.ch-hint.on{display:block}
.ch-hint-btn{margin-top:8px;font-size:11px;color:var(--ana);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;padding:4px 0}
.ch-fb{font-size:12px;font-weight:800;text-align:center;min-height:18px;margin-top:8px}
.ch-fb.ok{color:var(--g)}
.ch-fb.bad{color:var(--r)}
.ch-exp{background:rgba(78,205,196,.07);border-radius:8px;padding:10px 12px;font-size:11px;line-height:1.7;color:var(--mid);margin-top:8px;display:none}
.ch-exp.on{display:block}
.ch-exp b{color:var(--geo)}
.ch-next{display:block;width:100%;padding:11px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--ana),var(--pk));color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:10px;transition:all .2s}
.ch-next:active{transform:scale(.97)}

/* 【优化2】得分飘字动画 */
.score-float{position:fixed;z-index:2500;pointer-events:none;font-size:18px;font-weight:900;color:var(--g);text-shadow:0 2px 6px rgba(107,203,119,.4);animation:scoreUp 1.2s ease forwards}
@keyframes scoreUp{0%{opacity:1;transform:translateY(0) scale(1)}50%{opacity:1;transform:translateY(-40px) scale(1.2)}100%{opacity:0;transform:translateY(-80px) scale(.8)}}

/* 通关画面 */
.ch-complete{text-align:center;padding:20px 14px}
.ch-complete-icon{font-size:56px;animation:pop .4s ease}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.ch-complete h3{font-size:18px;font-weight:900;margin:12px 0 6px}
.ch-complete p{font-size:12px;color:var(--mid);line-height:1.8}
.ch-complete .ch-mg{background:linear-gradient(135deg,rgba(78,205,196,.08),rgba(107,203,119,.04));border-radius:12px;padding:12px;margin:14px 0;font-size:13px;line-height:1.7;color:var(--dark);border-left:3px solid var(--geo)}
.ch-complete .ch-mg strong{color:var(--geo)}
.ch-cont-btn{display:block;width:100%;padding:12px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--alg),var(--com));color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:10px;transition:all .2s;box-shadow:0 4px 14px rgba(167,139,250,.25)}
.ch-cont-btn:active{transform:scale(.97)}
.ch-cont-note{font-size:9px;color:var(--light);margin-top:8px;line-height:1.5}

/* 【优化6/7】五彩纸屑confetti */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:4000;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:8px;top:-20px;animation:confettiFall linear forwards}
.confetti-piece.big{width:12px;height:12px}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0deg)}
  100%{opacity:0;transform:translateY(100vh) rotate(720deg)}
}

/* ===== 弹窗 ===== */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:1000;align-items:flex-end;justify-content:center}
.ov.on{display:flex;animation:ovf .2s ease}
@keyframes ovf{from{opacity:0}to{opacity:1}}
.ov-panel{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:14px 12px 30px;animation:ovs .3s ease;position:relative}
@media(min-width:640px){.ov-panel{border-radius:20px;margin:14px;max-height:86vh}}
@keyframes ovs{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.ov-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:none;background:#f0f0f0;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mid);z-index:1}
.ov-title{font-size:16px;font-weight:900;text-align:center;margin-bottom:12px}

/* ===== 聊天 ===== */
.chat-box{max-height:50vh;overflow-y:auto;margin-bottom:8px;padding-right:4px}
.chat-box::-webkit-scrollbar{width:4px}
.chat-box::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.chat-msg{display:flex;gap:6px;margin-bottom:8px;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.r{flex-direction:row-reverse}
.chat-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chat-av.ai{background:linear-gradient(135deg,var(--ana),var(--pk))}
.chat-av.me{background:var(--com)}
.chat-txt{padding:8px 11px;border-radius:12px;font-size:12px;line-height:1.6;max-width:78%;white-space:pre-wrap;word-break:break-word}
.chat-msg:not(.r) .chat-txt{background:#fff;border:1px solid #f0f0f0}
.chat-msg.r .chat-txt{background:var(--com);color:#fff}
.chat-typing{display:flex;gap:4px;padding:8px 12px}
.chat-typing span{width:6px;height:6px;border-radius:50%;background:var(--light);animation:typ 1.2s ease-in-out infinite}
.chat-typing span:nth-child(2){animation-delay:.2s}
.chat-typing span:nth-child(3){animation-delay:.4s}
@keyframes typ{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chat-input{display:flex;gap:6px;position:sticky;bottom:0;background:var(--bg);padding:6px 0}
.chat-in{flex:1;height:38px;border:2px solid #e8e8e8;border-radius:19px;padding:0 14px;font-size:12px;font-family:inherit;outline:none;transition:border-color .2s}
.chat-in:focus{border-color:var(--ana)}
.chat-send{width:38px;height:38px;border:none;background:linear-gradient(135deg,var(--ana),var(--pk));color:#fff;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;transition:all .2s}
.chat-send:active{transform:scale(.9)}

/* ===== 收藏 ===== */
.collect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:500px;margin:0 auto}
@media(min-width:500px){.collect-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:768px){.collect-grid{grid-template-columns:repeat(5,1fr)}}
.collect-card{aspect-ratio:5/7;border-radius:8px;position:relative;overflow:hidden;cursor:pointer;transition:all .2s}
.collect-card:active{transform:scale(.95)}
.collect-card.small .pcard-portrait{font-size:24px}
.collect-card.small .pcard-name{font-size:9px}
.collect-card.small .pcard-ability{font-size:7px;padding:2px 4px;margin:3px 4px}
.collect-card.small .pcard-contrib{font-size:6px}
.collect-card.small .pcard-flavor{font-size:6px;padding:1px 4px}
.collect-card.small .pcard-hdr,.collect-card.small .pcard-ftr{font-size:6px;padding:2px 4px}
.collect-card.small .pcard-year{font-size:6px}
.collect-summary{text-align:center;margin-bottom:14px;font-size:12px;color:var(--mid)}
.collect-summary b{color:var(--ana);font-size:16px}

/* 【优化4】收藏环形进度图 */
.collect-ring{display:flex;justify-content:center;margin-bottom:16px}
.collect-ring svg{transform:rotate(-90deg)}
.collect-ring .ring-bg{fill:none;stroke:#f0f0f0;stroke-width:8}
.collect-ring .ring-fill{fill:none;stroke:var(--ana);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.collect-ring .ring-text{font-size:14px;font-weight:900;fill:var(--ana);text-anchor:middle;dominant-baseline:central;transform:rotate(90deg);transform-origin:center}

/* 【优化4】稀有度筛选标签颜色 */
.collect-fbtn{padding:4px 10px;border-radius:12px;border:2px solid #e8e8e8;background:#fff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--mid);transition:all .2s}
.collect-fbtn.on{border-color:var(--ana);color:var(--ana);background:rgba(255,140,66,.06)}
.collect-fbtn[data-f="R"].on{border-color:#FF6B6B;color:#FF6B6B;background:rgba(255,107,107,.06)}
.collect-fbtn[data-f="SR"].on{border-color:#A78BFA;color:#A78BFA;background:rgba(167,139,250,.06)}
.collect-fbtn[data-f="SSR"].on{border-color:#FF8C42;color:#FF8C42;background:rgba(255,140,66,.06)}
.collect-fbtn[data-f="UR"].on{border-color:#FFD700;color:#FFD700;background:rgba(255,215,0,.06)}

.collect-filter{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}

/* ===== Toast ===== */
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:2000;background:linear-gradient(135deg,var(--ana),var(--pk));color:#fff;padding:10px 20px;border-radius:24px;font-size:12px;font-weight:700;box-shadow:0 5px 20px rgba(255,140,66,.3);animation:ti .4s ease,to .4s ease 2.4s forwards;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes to{to{opacity:0;transform:translateX(-50%) translateY(-20px)}}

/* 【优化2】Combo成就toast */
.toast-combo{background:linear-gradient(135deg,#FFD700,#FF8C42);font-size:14px;padding:12px 24px;box-shadow:0 5px 24px rgba(255,215,0,.4)}

/* 新卡片获得动画 */
.card-get-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:3000;display:none;align-items:center;justify-content:center;animation:ovf .3s ease}
.card-get-overlay.on{display:flex}
.card-get-content{text-align:center;animation:pop .5s ease}
.card-get-label{font-size:14px;font-weight:900;color:var(--gold);margin-bottom:12px;letter-spacing:2px;text-shadow:0 0 10px rgba(255,215,0,.5)}
.card-get-card{width:200px;margin:0 auto}
.card-get-tap{font-size:11px;color:rgba(255,255,255,.6);margin-top:16px;animation:pulse 1.5s ease-in-out infinite}

/* 【优化6】SSR/UR获得时金色光环 */
.card-get-overlay.ssr-ur .card-get-content{animation:pop .6s ease}
.card-get-overlay.ssr-ur .card-get-card{width:240px}
.card-get-overlay.ssr-ur .card-get-label{font-size:18px;animation:goldPulse 1s ease-in-out infinite}
@keyframes goldPulse{0%,100%{text-shadow:0 0 10px rgba(255,215,0,.5)}50%{text-shadow:0 0 30px rgba(255,215,0,.9),0 0 60px rgba(255,215,0,.4)}}
.card-gold-ring{position:absolute;width:260px;height:260px;border-radius:50%;border:3px solid rgba(255,215,0,.4);animation:ringExpand 1.5s ease-out forwards;pointer-events:none}
.card-gold-ring:nth-child(2){animation-delay:.3s}
.card-gold-ring:nth-child(3){animation-delay:.6s}
@keyframes ringExpand{0%{transform:scale(.5);opacity:1}100%{transform:scale(2);opacity:0}}

/* 【优化7】聊天打字机光标 */
.typing-cursor{display:inline-block;width:2px;height:14px;background:var(--ana);animation:blink .6s step-end infinite;margin-left:2px;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>

  return '☆';
}

// 【优化7】聊天AI打字机效果
function addChatMsgTyping(who,text,callback){
  var box=document.getElementById('chatBox');
  var div=document.createElement('div');
  div.className='chat-msg'+(who==='me'?' r':'');
  div.innerHTML='<div class="chat-av '+(who==='me'?'me':'ai')+'">'+(who==='me'?'🙋':'🤖')+'</div><div class="chat-txt"></div>';
  box.appendChild(div);
  var txtEl=div.querySelector('.chat-txt');
  var safeText=text.replace(/</g,'&lt;');
  var cursor=document.createElement('span');
  cursor.className='typing-cursor';
  txtEl.appendChild(cursor);
  var idx=0;
  var speed=who==='ai'?25:12;
  function typeNext(){
    if(idx<safeText.length){
      txtEl.insertBefore(document.createTextNode(safeText[idx]),cursor);
      idx++;
      box.scrollTop=box.scrollHeight;
      setTimeout(typeNext,speed);
    } else {
      if(cursor.parentNode)cursor.remove();
      if(callback)callback();
    }
  }
  typeNext();
}

// ===== 挑战系统 =====
function startChallenge(mathId){
  nav.math=mathId;
  nav.qIdx=0;
  nav.answered=false;
  renderChallenge();
  showScreen('challenge');
}

function renderChallenge(){
  var m=getMath(nav.math);
  var br=getBranch(m.b);
  var wrap=document.getElementById('chWrap');

  // 通关画面
  if(nav.qIdx>=m.q.length){
    var isCollected=state.collected.indexOf(m.id)>=0;
    var isNew=false;
    if(!isCollected){
      state.collected.push(m.id);
      isNew=true;
    }
    state.completed[m.id]=true;
    saveState();
    updateStats();

    wrap.innerHTML=
      '<div class="ch-complete">'+
      '<div class="ch-complete-icon">'+(isNew?'🎉':'✅')+'</div>'+
      '<h3>'+(isNew?'卡片收集成功！':'再次通关！')+'</h3>'+
      '<p>你完成了 <b>'+m.n+'</b> 的思维挑战</p>'+
      '<div class="ch-mg"><strong>思维魔力：</strong>'+m.mg+'</div>'+
      '<p>题目做完了吗？挑战才刚刚开始！</p>'+
      '<button class="ch-cont-btn" id="chContBtn">🤖 继续挑战（AI出题）</button>'+
      '<div class="ch-cont-note">demo中由预设题库模拟大模型出题<br>正式版将接入真实大模型，生成无限新题</div>'+
      '</div>';

    document.getElementById('chContBtn').addEventListener('click',function(){
      openChat(m.id);
    });

    if(isNew){
      // 【优化6】通关庆祝增强
      var isPremium=(m.r==='SSR'||m.r==='UR');
      showCardGet(m);
      setTimeout(function(){
        launchConfetti(isPremium?100:50,isPremium);
      },300);
    }
    return;
  }

  var q=m.q[nav.qIdx];
  var progressPct=((nav.qIdx)/m.q.length*100);
  var html=
    '<div class="ch-math-info" style="--bc:'+br.color+'">'+
    '<div class="ch-math-emoji">'+m.e+'</div>'+
    '<div><div class="ch-mn">'+m.n+'</div><div class="ch-mm">'+m.m+' · '+m.c+'</div><div class="ch-mc">⚡ '+m.m+'</div></div>'+
    '</div>'+
    // 【优化7】进度条
    '<div class="ch-progress-bar"><div class="fill" style="width:'+progressPct+'%;background:'+br.color+'"></div></div>'+
    '<div class="ch-progress">第 <span class="ch-pcur">'+(nav.qIdx+1)+'</span>/'+m.q.length+' 题</div>'+
    '<div class="ch-qbox" id="chQbox">'+
    '<div class="ch-q">'+q.q+'</div>';

  if(q.svg){
    html+='<div class="ch-svg">'+q.svg+'</div>';
  }

  if(q.t==='choice'){
    html+='<div class="ch-opts" id="chOpts">';
    q.o.forEach(function(opt,i){
      html+='<div class="ch-opt" data-idx="'+i+'"><span class="ch-oi">'+'ABCD'[i]+'</span><span>'+opt+'</span></div>';
    });
    html+='</div>';
  } else {
    html+='<div class="ch-fill-row"><input type="text" class="ch-input" id="chInput" placeholder="输入答案" autocomplete="off"><button class="ch-submit" id="chSubmit">提交</button></div>';
  }

  if(q.h){
    html+='<button class="ch-hint-btn" id="chHintBtn">💡 提示</button><div class="ch-hint" id="chHint">'+q.h+'</div>';
  }
  html+='<div class="ch-fb" id="chFb"></div><div class="ch-exp" id="chExp"></div>';
  html+='<button class="ch-next" id="chNext" style="display:none">下一题 →</button>';
  html+='</div>';

  wrap.innerHTML=html;

  // 事件绑定
  if(q.t==='choice'){
    document.querySelectorAll('#chOpts .ch-opt').forEach(function(opt){
      opt.addEventListener('click',function(){
        if(nav.answered)return;
        var idx=parseInt(opt.getAttribute('data-idx'));
        submitAnswer(idx,q);
      });
    });
  } else {
    var inp=document.getElementById('chInput');
    var submit=function(){
      if(nav.answered)return;
      var val=inp.value.trim();
      if(!val){inp.focus();return;}
      submitAnswer(val,q);
    };
    document.getElementById('chSubmit').addEventListener('click',submit);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
    inp.focus();
  }

  if(q.h){
    document.getElementById('chHintBtn').addEventListener('click',function(){
      document.getElementById('chHint').classList.add('on');
      this.style.display='none';
    });
  }

  var chNextBtn=document.getElementById('chNext');
  if(chNextBtn){
    chNextBtn.addEventListener('click',nextQuestion);
  }
}

function submitAnswer(userAns,q){
  nav.answered=true;
  var correct=false;
  if(q.t==='choice'){
    correct=(userAns===q.a);
    var opts=document.querySelectorAll('#chOpts .ch-opt');
    opts.forEach(function(opt,i){
      opt.classList.add('disabled');
      if(i===q.a)opt.classList.add('ok');
      else if(i===userAns)opt.classList.add('bad');
    });
    // 【优化2】绿色脉冲动画
    if(correct){
      var qbox=document.getElementById('chQbox');
      qbox.style.borderColor='var(--g)';
      qbox.style.boxShadow='0 0 0 4px rgba(107,203,119,.15)';
    }
  } else {
    correct=(String(userAns).trim()===String(q.a).trim());
    var fbEl2=document.getElementById('chFb');
    if(!correct){
      fbEl2.innerHTML='正确答案：<b>'+q.a+'</b>';
    }
  }

  var fbEl=document.getElementById('chFb');
  var expEl=document.getElementById('chExp');
  if(correct){
    state.streak++;state.correct++;
    fbEl.textContent='✅ 答对了！';fbEl.classList.add('ok');
    // 【优化2】得分飘字+combo检测
    showScoreFloat();
    checkComboMilestone();
    updateComboDisplay();
  } else {
    state.streak=0;
    shownComboMilestones={};
    fbEl.classList.add('bad');
    updateComboDisplay();
    if(q.t==='choice')fbEl.textContent='❌ 再想想';
  }
  state.total++;
  saveState();
  updateStats();

  expEl.innerHTML='<b>思维解析：</b>'+q.e;
  expEl.classList.add('on');
  document.getElementById('chNext').style.display='block';
}

function nextQuestion(){
  nav.qIdx++;
  nav.answered=false;
  renderChallenge();
}

// ===== 聊天系统（模拟LLM） =====
function openChat(mathId){
  var m=getMath(mathId);
  chatSt.mathId=mathId;
  chatSt.qIdx=0;
  chatSt.waiting=false;

  var questions=[];
  if(m.ex&&m.ex.length)questions=questions.concat(m.ex);
  if(SHARED_EXTRA[m.m]&&SHARED_EXTRA[m.m].length)questions=questions.concat(SHARED_EXTRA[m.m]);
  chatSt.questions=questions;

  document.getElementById('chatTitle').textContent=m.e+' '+m.n+' · 无限挑战';
  var box=document.getElementById('chatBox');
  box.innerHTML='';

  addChatMsgTyping('ai','👋 欢迎来到'+m.n+'的无限挑战！\n\n我是数数AI，专门出【'+m.m+'】的题目。做完预设题库后，在正式版中我可以无限生成新题！\n\n准备好了吗？第一题来啦～');

  setTimeout(function(){
    showChatQuestion();
  },1800);

  document.getElementById('ovChat').classList.add('on');
  document.getElementById('chatInput').focus();
}

function showChatQuestion(){
  var box=document.getElementById('chatBox');
  if(chatSt.qIdx>=chatSt.questions.length){
    var m=getMath(chatSt.mathId);
    addChatMsgTyping('ai','🎉 太棒了！你已经完成了所有【'+m.m+'】的挑战题目！\n\n在正式版中，大模型将为你生成无限的新题目。现在去探索其他数学家的思维吧！');
    return;
  }

  var q=chatSt.questions[chatSt.qIdx];
  chatSt.waiting=true;

  var msg='📝 第'+(chatSt.qIdx+1)+'题：\n\n'+q.q;
  if(q.t==='choice'){
    msg+='\n';
    q.o.forEach(function(opt,i){msg+='\n'+ 'ABCD'[i]+'. '+opt;});
  }

  showTyping();
  setTimeout(function(){
    removeTyping();
    addChatMsgTyping('ai',msg);
  },800);
}

function sendChat(){
  var inp=document.getElementById('chatInput');
  var text=inp.value.trim();
  if(!text)return;
  inp.value='';
  addChatMsg('me',text);

  if(!chatSt.waiting){
    showTyping();
    setTimeout(function(){
      removeTyping();
      var resp=getKeywordResponse(text);
      addChatMsgTyping('ai',resp);
    },600);
    return;
  }

  chatSt.waiting=false;
  var q=chatSt.questions[chatSt.qIdx];
  var correct=false;

  if(q.t==='choice'){
    var idx='ABCD'.indexOf(text.toUpperCase());
    if(idx>=0){correct=(idx===q.a);}
    else{correct=(text===q.o[q.a]);}
  } else {
    correct=(String(text).trim()===String(q.a).trim());
  }

  showTyping();
  setTimeout(function(){
    removeTyping();
    if(correct){
      state.streak++;state.correct++;state.total++;
      addChatMsgTyping('ai','✅ 答对了！\n\n'+q.e);
      checkComboMilestone();
      updateComboDisplay();
    } else {
      state.streak=0;state.total++;
      shownComboMilestones={};
      updateComboDisplay();
      addChatMsgTyping('ai','❌ 答案是 '+(q.t==='choice'?q.o[q.a]:q.a)+'\n\n'+q.e);
    }
    saveState();updateStats();
    chatSt.qIdx++;
    setTimeout(function(){showChatQuestion();},1800);
  },800);
}

function getKeywordResponse(text){
  var m=getMath(chatSt.mathId);
  if(/提示|hint|不会|不懂|怎么/.test(text)){
    return '💡 '+m.m+'的秘诀：'+m.mg+'\n\n试试从已知条件出发，一步步推导！';
  }
  if(/为什么|why|原理/.test(text)){
    return m.m+'是'+m.n+'的核心思维。\n\n'+m.s+'\n\n'+m.mg;
  }
  if(/下一题|继续|next/.test(text)){
    chatSt.qIdx++;
    setTimeout(function(){showChatQuestion();},500);
    return '好的，下一题来了！';
  }
  if(/你好|hi|hello|嗨/.test(text)){
    return '你好呀！我是数数AI 🤖\n准备好继续挑战'+m.m+'了吗？';
  }
  return '这是个好问题！在正式版中，大模型会为你详细解答。\n\n现在让我们继续做题吧！输入答案即可作答～';
}

  var box=document.getElementById('chatBox');

  div.className='chat-msg'+(who==='me'?' r':'');
  div.innerHTML='<div class="chat-av '+(who==='me'?'me':'ai')+'">'+(who==='me'?'🙋':'🤖')+'</div><div class="chat-txt">'+text.replace(/</g,'&lt;')+'</div>';

function showTyping(){
  var box=document.getElementById('chatBox');
  var div=document.createElement('div');
  div.className='chat-msg';div.id='chatTyping';
  div.innerHTML='<div class="chat-av ai">🤖</div><div class="chat-typing"><span></span><span></span><span></span></div>';
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}
function removeTyping(){var t=document.getElementById('chatTyping');if(t)t.remove();}

// ===== 收藏系统 =====
function renderCollect(){
  var grid=document.getElementById('collectGrid');
  var summary=document.getElementById('collectSummary');
  var filterEl=document.getElementById('collectFilter');
  var ringEl=document.getElementById('collectRing');

  var count=state.collected.length;
  var pct=Math.round(count/21*100);

  // 【优化4】环形进度图
  var circumference=2*Math.PI*42;
  var offset=circumference-(pct/100)*circumference;
  ringEl.innerHTML='<svg width="100" height="100" viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="42"/><circle class="ring-fill" cx="50" cy="50" r="42" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'"/><text class="ring-text" x="50" y="50">'+pct+'%</text></svg>';

  summary.innerHTML='已收集 <b>'+count+'</b> / 21 张卡片';

  // 【优化4】稀有度筛选
  filterEl.innerHTML='<button class="collect-fbtn on" data-f="all">全部</button>';
  var rarities=['R','SR','SSR','UR'];
  var rarityColors={R:'#FF6B6B',SR:'#A78BFA',SSR:'#FF8C42',UR:'#FFD700'};
  rarities.forEach(function(r){
    var cnt=MATHS.filter(function(m){return m.r===r&&state.collected.indexOf(m.id)>=0;}).length;
    if(cnt>0||r==='SR'||r==='SSR'||r==='UR'){
      filterEl.innerHTML+='<button class="collect-fbtn" data-f="'+r+'" style="'+(cnt>0?'border-color:'+rarityColors[r]+';color:'+rarityColors[r]:'')+'">'+rarityStars(r).replace(/<[^>]*>/g,'')+' '+r+' ('+cnt+')</button>';
    }
  });
  BRANCHES.forEach(function(br){
    var cnt=MATHS.filter(function(m){return m.b===br.id&&state.collected.indexOf(m.id)>=0;}).length;
    filterEl.innerHTML+='<button class="collect-fbtn" data-f="'+br.id+'">'+br.emoji+' '+br.name+'('+cnt+')</button>';
  });

  grid.innerHTML='';
  MATHS.forEach(function(m){
    var brc=getBranch(m.b);
    var isCollected=state.collected.indexOf(m.id)>=0;
    var card=document.createElement('div');
    card.className='collect-card small pcard r-'+m.r;
    card.style.setProperty('--bc',brc.color);
    if(isCollected)card.classList.add('collected');

    // 【优化3】SSR/UR微光
    if((m.r==='SSR'||m.r==='UR')&&isCollected){
      var glowDiv=document.createElement('div');
      glowDiv.className='glow-bg';
      card.insertBefore(glowDiv,card.firstChild);
    }

    if(isCollected){
      card.innerHTML=
        '<div class="pcard-hdr"><span class="pcard-rarity">'+rarityStars(m.r)+'</span><span class="pcard-branch">'+brc.name+'</span></div>'+
        '<div class="pcard-portrait">'+m.e+'</div>'+
        '<div class="pcard-info"><div class="pcard-name">'+m.n+'</div><div class="pcard-year">'+m.y+'</div></div>'+
        '<div class="pcard-ability">'+m.m+'</div>'+
        '<div class="pcard-contrib">'+m.c+'</div>'+
        '<div class="pcard-flavor">'+m.f+'</div>'+
        '<div class="pcard-ftr"><span>'+String(m.id+1).padStart(3,'0')+'/021</span><span>✓</span></div>';
      card.addEventListener('click',function(){
        startChallenge(m.id);
        document.getElementById('ovCollect').classList.remove('on');
      });
    } else {
      card.innerHTML='<div class="pcard-back"><div class="pcard-back-icon">❓</div><div class="pcard-back-text">未收集</div><div class="pcard-back-hint">'+String(m.id+1).padStart(3,'0')+'/021</div></div>';
      card.style.cursor='default';
    }
    grid.appendChild(card);
  });

  // 过滤事件
  filterEl.querySelectorAll('.collect-fbtn').forEach(function(btn){
    btn.addEventListener('click',function(){
      filterEl.querySelectorAll('.collect-fbtn').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      var f=btn.getAttribute('data-f');
      grid.querySelectorAll('.collect-card').forEach(function(c,idx){
        var m=MATHS[idx];
        if(f==='all'){
          c.style.display='';
        } else if(f==='R'||f==='SR'||f==='SSR'||f==='UR'){
          c.style.display=(m.r===f)?'':'none';
        } else {
          c.style.display=(m.b===f)?'':'none';
        }
      });
    });
  });

  // 【优化4】里程碑检测
  var milestones=[5,10,15,21];
  var shownMilestonesKey='sywg_milestones_v1';
  var shownMilestonesArr=[];
  try{shownMilestonesArr=JSON.parse(localStorage.getItem(shownMilestonesKey))||[];}catch(e){}
  if(milestones.indexOf(count)>=0&&shownMilestonesArr.indexOf(count)<0){
    shownMilestonesArr.push(count);
    localStorage.setItem(shownMilestonesKey,JSON.stringify(shownMilestonesArr));
    var msgs={5:'🎊 收集5张！小小收藏家！',10:'🎉 收集10张！数学探索者！',15:'🏆 收集15张！数学大师！',21:'👑 收集全部21张！传奇收藏家！'};
    showToast(msgs[count]||'🎉 里程碑达成！','toast-combo');
    launchConfetti(count===21?120:70,count>=15);
  }
}

// ===== 新卡片获得动画 =====
function showCardGet(m){
  var ov=document.getElementById('cardGetOv');
  var cardEl=document.getElementById('cardGetCard');
  var br=getBranch(m.b);
  var isPremium=(m.r==='SSR'||m.r==='UR');
  ov.className='card-get-overlay on'+(isPremium?' ssr-ur':'');
  cardEl.className='card-get-card pcard r-'+m.r+' collected';
  cardEl.style.setProperty('--bc',br.color);

  // 【优化3】SSR/UR微光背景
  var glowHtml='';
  if(isPremium){
    glowHtml='<div class="glow-bg"></div>';
  }

  cardEl.innerHTML=glowHtml+
    '<div class="pcard-hdr"><span class="pcard-rarity">'+rarityStars(m.r)+' '+m.r+'</span><span class="pcard-branch">'+br.name+'</span></div>'+
    '<div class="pcard-portrait" style="font-size:'+(isPremium?'56px':'48px')+'">'+m.e+'</div>'+
    '<div class="pcard-info"><div class="pcard-name" style="font-size:'+(isPremium?'18px':'16px')+'">'+m.n+'</div><div class="pcard-year">'+m.y+'</div></div>'+
    '<div class="pcard-ability" style="font-size:'+(isPremium?'12px':'11px')+'">⚡ '+m.m+'</div>'+
    '<div class="pcard-contrib">'+m.c+'</div>'+
    '<div class="pcard-flavor">'+m.f+'</div>'+
    '<div class="pcard-ftr"><span>'+String(m.id+1).padStart(3,'0')+'/021</span><span>数趣王国</span></div>';

  var label=ov.querySelector('.card-get-label');
  if(isPremium){
    label.textContent='✨ 超稀有卡片 ✨';
    label.style.fontSize='18px';
  } else {
    label.textContent='✨ 获得新卡片 ✨';
    label.style.fontSize='14px';
  }
}

// ===== 更新统计 =====
function updateStats(){
  document.getElementById('stCollect').textContent=state.collected.length;
  document.getElementById('stStreak').textContent=state.streak;
  document.getElementById('stTotal').textContent=state.total;
  var badge=document.getElementById('collectBadge');
  badge.textContent=state.collected.length;
  badge.style.display=state.collected.length>0?'flex':'none';
}

// ===== 新手引导系统 =====
function checkGuideBubbles(){
  var guideKey='sywg_guide_v1';
  var guidesShown={};
  try{guidesShown=JSON.parse(localStorage.getItem(guideKey))||{};}catch(e){}

  // 大门引导
  if(!guidesShown.gate){
    var guideGate=document.getElementById('guideGate');
    if(guideGate)guideGate.style.display='block';
    var closeBtn=document.getElementById('guideGateClose');
    if(closeBtn){
      closeBtn.addEventListener('click',function(){
        guideGate.style.display='none';
        guidesShown.gate=true;
        try{localStorage.setItem(guideKey,JSON.stringify(guidesShown));}catch(e){}
      });
    }
    // 点击大门也关闭引导
    document.getElementById('gateCard').addEventListener('click',function(){
      guideGate.style.display='none';
      guidesShown.gate=true;
      try{localStorage.setItem(guideKey,JSON.stringify(guidesShown));}catch(e){}
    },true);
  } else {
    var guideGate=document.getElementById('guideGate');
    if(guideGate)guideGate.style.display='none';
  }

  // 分支引导
  if(!guidesShown.branch){
    var guideBranch=document.getElementById('guideBranch');
    if(guideBranch)guideBranch.style.display='inline-block';
  } else {
    var guideBranch2=document.getElementById('guideBranch');
    if(guideBranch2)guideBranch2.style.display='none';
  }
}

function dismissBranchGuide(){
  var guideBranch=document.getElementById('guideBranch');
  if(guideBranch)guideBranch.style.display='none';
  var guideKey='sywg_guide_v1';
  var guidesShown={};
  try{guidesShown=JSON.parse(localStorage.getItem(guideKey))||{};}catch(e){}
  guidesShown.branch=true;
  try{localStorage.setItem(guideKey,JSON.stringify(guidesShown));}catch(e){}
}

// ===== 事件绑定 =====
function bindEvents(){
  // 大门
  document.getElementById('gateCard').addEventListener('click',function(){
    dismissBranchGuide();
    renderBranch();
    showScreen('branch');
  });

  // 返回
  document.getElementById('backBtn').addEventListener('click',goBack);

  // 收藏
  document.getElementById('collectBtn').addEventListener('click',function(){
    renderCollect();
    document.getElementById('ovCollect').classList.add('on');
  });
  document.getElementById('collectX').addEventListener('click',function(){
    document.getElementById('ovCollect').classList.remove('on');
  });

  // 聊天
  document.getElementById('chatX').addEventListener('click',function(){
    document.getElementById('ovChat').classList.remove('on');
  });
  document.getElementById('chatSend').addEventListener('click',sendChat);
  document.getElementById('chatInput').addEventListener('keydown',function(e){
    if(e.key==='Enter')sendChat();
  });

  // 新卡片获得点击关闭
  document.getElementById('cardGetOv').addEventListener('click',function(){
    this.classList.remove('on');
  });
}

// ===== 初始化 =====
try{loadState();}catch(e){console.error('loadState:',e);}
try{bindEvents();}catch(e){console.error('bindEvents:',e);}
try{updateStats();}catch(e){console.error('updateStats:',e);}
try{renderGate();}catch(e){console.error('renderGate:',e);}
try{checkGuideBubbles();}catch(e){console.error('checkGuideBubbles:',e);}
</script>
