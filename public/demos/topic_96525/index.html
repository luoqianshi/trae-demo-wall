<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>印迹 — 网页转PDF/PNG工具</title>

<style>
  @font-face {
    font-family: 'InstrumentSans';
    src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'InstrumentSans';
    src: url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'InstrumentSans';
    src: url('./_shared/fonts/InstrumentSans-BoldItalic.ttf') format('truetype');
    font-weight: 700;
    font-style: italic;
  }
  @font-face {
    font-family: 'JetBrainsMono';
    src: url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
</style>

<style>
  :root {
    --bg: #0b0b14;
    --bg2: #151520;
    --bg3: #1e1e2e;
    --ink: #e8e8f0;
    --muted: #7878a0;
    --rule: #2a2a3e;
    --rule-hover: #3a3a50;
    --accent: #6366f1;
    --accent2: #22d3ee;
    --green: #34d399;
    --green-bg: rgba(52,211,153,0.08);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.08);
    --font: 'InstrumentSans', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrainsMono', monospace;
    --max: 780px;
    --radius: 12px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    right: -30%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -40%;
    left: -20%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(34,211,238,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  article.page {
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
    position: relative;
    z-index: 1;
  }

  /* ===== Hero ===== */
  .hero {
    text-align: center;
    padding: 4rem 0 3rem;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 3rem;
  }

  .hero-badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent2);
    background: rgba(34,211,238,0.08);
    border: 1px solid rgba(34,211,238,0.15);
    padding: 0.3rem 0.9rem;
    border-radius: 100px;
    margin-bottom: 1.5rem;
  }

  .hero h1 {
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 0.6rem;
    background: linear-gradient(135deg, var(--ink) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero .subtitle {
    font-size: 1.1rem;
    color: var(--muted);
    font-weight: 400;
  }

  .hero .tagline {
    margin-top: 1.2rem;
    display: flex;
    justify-content: center;
    gap: 0.8rem;
    flex-wrap: wrap;
  }

  .hero .tagline span {
    font-size: 0.82rem;
    color: var(--muted);
    background: var(--bg2);
    border: 1px solid var(--rule);
    padding: 0.3rem 0.8rem;
    border-radius: 6px;
  }

  /* ===== Section ===== */
  section { margin-bottom: 2.4rem; }

  h2 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 1.2rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
    letter-spacing: -0.01em;
  }

  /* ===== Card ===== */
  .card {
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 1.5rem 1.8rem;
    margin-bottom: 1.2rem;
  }
  .card:last-child { margin-bottom: 0; }

  /* ===== Tabs ===== */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 1.5rem;
  }
  .tab {
    padding: 0.7rem 1.5rem;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.2s;
    font-family: var(--font);
  }
  .tab.active {
    color: var(--accent2);
    border-bottom-color: var(--accent);
  }
  .tab:hover { color: var(--ink); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ===== Select Zone ===== */
  .select-zone {
    border: 2px dashed var(--rule);
    border-radius: var(--radius);
    padding: 3rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }
  .select-zone:hover, .select-zone.drag-over {
    border-color: var(--accent);
    background: rgba(99,102,241,0.04);
  }
  .select-zone .icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    color: var(--accent);
  }
  .select-zone .text {
    font-size: 1rem;
    color: var(--ink);
    font-weight: 500;
  }
  .select-zone .hint {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 0.4rem;
  }
  .select-zone .or-divider {
    font-size: 0.75rem;
    color: var(--rule);
    margin: 0.8rem 0;
  }

  /* ===== File Info ===== */
  .file-info {
    display: none;
    margin-top: 0.8rem;
    padding: 0.7rem 1rem;
    background: var(--green-bg);
    border: 1px solid rgba(52,211,153,0.15);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    color: var(--green);
    font-weight: 500;
  }
  .file-info.show { display: block; }

  /* ===== URL Input ===== */
  .input-group {
    display: flex;
    gap: 0.6rem;
  }
  .input-group .input {
    flex: 1;
    padding: 0.7rem 1rem;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    outline: none;
    font-family: var(--font);
    color: var(--ink);
    transition: all 0.2s;
  }
  .input-group .input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
  }
  .input-group .input::placeholder {
    color: var(--muted);
    font-family: var(--font);
  }

  .save-name-row .input {
    flex: 1;
    padding: 0.7rem 1rem;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    outline: none;
    font-family: var(--font);
    color: var(--ink);
    transition: all 0.2s;
  }
  .save-name-row .input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
  }
  .save-name-row .input::placeholder {
    color: var(--muted);
    font-family: var(--font);
  }

  /* ===== Options ===== */
  .options-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .option .label {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .option .select, .option .input-number {
    padding: 0.5rem 0.6rem;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 0.82rem;
    outline: none;
    font-family: var(--font);
    color: var(--ink);
    transition: all 0.2s;
    cursor: pointer;
  }
  .option .select:focus, .option .input-number:focus {
    border-color: var(--accent);
  }
  .option .select option {
    background: var(--bg2);
    color: var(--ink);
  }
  .option .input-number {
    width: 60px;
  }

  .option-hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-left: 0.2rem;
  }

  /* ===== Toggle ===== */
  .toggle-switch {
    position: relative;
    width: 40px;
    height: 22px;
    cursor: pointer;
  }
  .toggle-switch input { display: none; }
  .toggle-slider {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--rule);
    border-radius: 22px;
    transition: 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    left: 3px; bottom: 3px;
    background: var(--muted);
    border-radius: 50%;
    transition: 0.3s;
  }
  .toggle-switch input:checked + .toggle-slider {
    background: var(--accent);
  }
  .toggle-switch input:checked + .toggle-slider::before {
    background: #fff;
    transform: translateX(18px);
  }

  /* ===== Buttons ===== */
  .btn {
    padding: 0.65rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--font);
    letter-spacing: 0.01em;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover {
    background: #4f46e5;
    box-shadow: 0 0 20px rgba(99,102,241,0.3);
  }
  .btn-primary:disabled {
    background: var(--rule);
    color: var(--muted);
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule);
  }
  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent2);
  }

  .btn-row {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ===== Progress ===== */
  .progress-wrapper {
    display: none;
    margin-bottom: 1.2rem;
  }
  .progress-wrapper.show { display: block; }

  .progress-bar {
    height: 4px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    animation: progress 2s ease-in-out infinite;
  }
  @keyframes progress {
    0% { width: 0%; }
    50% { width: 70%; }
    100% { width: 100%; }
  }
  .progress-text {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.5rem;
    text-align: center;
  }

  /* ===== Error ===== */
  .error-msg {
    display: none;
    margin-bottom: 1.2rem;
    padding: 0.8rem 1rem;
    background: var(--red-bg);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: var(--radius-sm);
    color: var(--red);
    font-size: 0.85rem;
  }
  .error-msg.show { display: block; }

  /* ===== Result ===== */
  .result-wrapper { display: none; }
  .result-wrapper.show { display: block; }

  .result-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding: 0.7rem 1rem;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    font-size: 0.82rem;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 0.5rem;
    font-family: var(--font-mono);
  }
  .result-info .resource-count {
    color: var(--green);
  }

  .save-name-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1rem;
  }
  .save-name-row .label {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .save-name-row .ext {
    font-size: 0.85rem;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  .preview-frame {
    width: 100%;
    height: 550px;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: var(--bg);
    margin-top: 1rem;
  }

  /* ===== Footer ===== */
  .page-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    text-align: center;
  }
  .page-footer p {
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* ===== Divider ===== */
  .divider {
    height: 1px;
    background: var(--rule);
    margin: 2rem 0;
  }

  /* ===== Responsive ===== */
  @media (max-width: 600px) {
    .hero h1 { font-size: 2rem; }
    .hero { padding: 2.5rem 0 2rem; }
    article.page { padding: 0 1rem 3rem; }
    .input-group { flex-direction: column; }
    .options-row { flex-direction: column; gap: 0.6rem; }
    .btn-row { flex-direction: column; }
    .card { padding: 1.2rem; }
    .select-zone { padding: 2rem 1rem; }
  }
</style>
</head>
<body>
  <article class="page">

    <!-- ===== HERO ===== -->
    <header class="hero">
      <div class="hero-badge">LOCAL TOOL</div>
      <h1>印迹</h1>
      <p class="subtitle">网页一键转 PDF / PNG，干净、快速、零折腾</p>
      <div class="tagline">
        <span>本地运行</span>
        <span>自动关联资源</span>
        <span>自适应宽高</span>
      </div>
    </header>

    <!-- ===== 选择来源 ===== -->
    <section>
      <h2>选择来源</h2>

      <div class="card">
        <div class="tabs">
          <div class="tab active" data-tab="file">本地文件</div>
          <div class="tab" data-tab="url">URL 链接</div>
        </div>

        <!-- 本地文件 -->
        <div class="tab-content active" id="tab-file">
          <div class="select-zone" id="selectZone">
            <div class="icon">&#128196;</div>
            <div class="text">点击选择或拖拽 HTML 文件到此处</div>
            <div class="hint">点击弹出系统文件对话框，自动关联同目录下的图片、CSS 等资源</div>
            <div class="or-divider">—— 也支持 ——</div>
            <div class="hint" style="margin-top:0;">拖拽 .zip 压缩包，自动解压并查找 HTML 文件</div>
            <input type="file" id="fileInput" accept=".html,.htm,.zip" style="display:none;">
          </div>
          <div class="file-info" id="fileInfo"></div>
          <div class="btn-row" style="margin-top:1rem;">
            <button class="btn btn-primary" id="btnFileConvert" disabled>开始转换</button>
          </div>
        </div>

        <!-- URL链接 -->
        <div class="tab-content" id="tab-url">
          <div class="input-group">
            <input class="input" type="text" id="urlInput" placeholder="输入网页 URL，例如 https://example.com">
            <button class="btn btn-primary" id="btnUrlConvert">开始转换</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 转换选项 ===== -->
    <section>
      <h2>转换选项</h2>

      <div class="card">
        <div class="options-row">
          <div class="option">
            <span class="label">输出格式</span>
            <select class="select" id="outputType">
              <option value="pdf">PDF</option>
              <option value="png">PNG 高清图片</option>
            </select>
          </div>
          <div class="option" id="pdfOptions">
            <span class="label">页面大小</span>
            <select class="select" id="format">
              <option value="A4">A4</option>
              <option value="A3">A3</option>
              <option value="A5">A5</option>
              <option value="Letter">Letter</option>
              <option value="Legal">Legal</option>
              <option value="Tabloid">Tabloid</option>
            </select>
          </div>
          <div class="option">
            <span class="label">方向</span>
            <select class="select" id="landscape">
              <option value="false">纵向</option>
              <option value="true">横向</option>
            </select>
          </div>
          <div class="option">
            <span class="label">缩放</span>
            <input class="input-number" type="number" id="scale" value="1" min="0.5" max="3" step="0.1">
          </div>
          <div class="option">
            <label class="toggle-switch">
              <input type="checkbox" id="singlePage" checked>
              <span class="toggle-slider"></span>
            </label>
            <span class="label">长单页 / 长图</span>
            <span class="option-hint">自适应宽高，不分页</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Progress ===== -->
    <div class="progress-wrapper" id="progressWrapper">
      <div class="progress-bar"><div class="progress-fill"></div></div>
      <div class="progress-text">正在转换中，请稍候...</div>
    </div>

    <!-- ===== Error ===== -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- ===== Result ===== -->
    <div class="result-wrapper" id="resultWrapper">
      <section>
        <h2>转换结果</h2>

        <div class="card">
          <div class="result-info" id="resultInfo"></div>

          <div class="save-name-row">
            <span class="label">保存为：</span>
            <input class="input" type="text" id="saveName" placeholder="输入文件名">
            <span class="ext" id="saveExt">.pdf</span>
          </div>

          <div class="btn-row" style="margin-bottom:0.8rem;">
            <button class="btn btn-primary" id="btnDownload">浏览器下载</button>
            <button class="btn btn-primary" id="btnSaveAs">系统另存为</button>
            <button class="btn btn-secondary" id="btnNewTab">新窗口打开</button>
          </div>

          <iframe class="preview-frame" id="previewFrame"></iframe>
        </div>
      </section>
    </div>

    <!-- ===== Footer ===== -->
    <footer class="page-footer">
      <p>印迹 · 本地运行 · 数据安全</p>
    </footer>

  </article>

<script>
  let currentResult = null;
  let selectedFilePath = null;
  let selectedFile = null;

  // ===== Tabs =====
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      clearResult();
    });
  });

  // ===== Output type toggle =====
  document.getElementById('outputType').addEventListener('change', function() {
    document.getElementById('pdfOptions').style.display = this.value === 'pdf' ? '' : 'none';
    document.getElementById('saveExt').textContent = this.value === 'png' ? '.png' : '.pdf';
    clearResult();
  });

  // ===== Utility functions =====
  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function getOptions() {
    return {
      format: document.getElementById('format').value,
      landscape: document.getElementById('landscape').value,
      scale: document.getElementById('scale').value,
      singlePage: document.getElementById('singlePage').checked,
      outputType: document.getElementById('outputType').value,
      saveName: document.getElementById('saveName').value.trim()
    };
  }

  function showResult(data) {
    currentResult = data;
    document.getElementById('resultWrapper').classList.add('show');
    var infoHtml = '<span>文件大小: ' + formatSize(data.size) + '</span>';
    if (data.resourceCount !== undefined) {
      infoHtml += ' <span class="resource-count">已关联 ' + data.resourceCount + ' 个资源文件</span>';
    }
    infoHtml += '<span>' + new Date().toLocaleTimeString() + '</span>';
    document.getElementById('resultInfo').innerHTML = infoHtml;
    document.getElementById('previewFrame').src = '/api/preview/' + data.filename;
    document.getElementById('resultWrapper').scrollIntoView({ behavior: 'smooth' });
  }

  function clearResult() {
    currentResult = null;
    document.getElementById('resultWrapper').classList.remove('show');
    document.getElementById('previewFrame').src = '';
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('errorMsg').textContent = '';
  }

  function showError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 10000);
  }

  function showProgress(show) {
    document.getElementById('progressWrapper').classList.toggle('show', show);
  }

  function updateFileUI(fileName) {
    var info = document.getElementById('fileInfo');
    var isPath = selectedFilePath && !selectedFile;
    info.innerHTML = '已选择: ' + fileName +
      (isPath ? ' <span style="color:#a5b4fc;">（路径模式，自动关联资源）</span>' : '');
    info.classList.add('show');
    document.getElementById('btnFileConvert').disabled = false;
    // Always update save name when new file selected
    document.getElementById('saveName').value = fileName.replace(/\.(html?|htm|zip)$/i, '');
    clearResult();
  }

  // ===== Select Zone =====
  var selectZone = document.getElementById('selectZone');
  var fileInput = document.getElementById('fileInput');
  var btnFileConvert = document.getElementById('btnFileConvert');

  selectZone.addEventListener('click', function() {
    btnFileConvert.disabled = true;
    document.getElementById('fileInfo').classList.remove('show');
    clearResult();
    fetch('/api/browse-file', { method: 'POST' })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.cancelled) return;
        if (data.success && data.filePath) {
          selectedFilePath = data.filePath;
          selectedFile = null;
          var name = data.filePath.replace(/\\/g, '/').split('/').pop();
          updateFileUI(name);
        }
      })
      .catch(function(err) {
        showError('原生对话框打开失败，请尝试拖拽文件到此处');
      });
  });

  // Drag & Drop
  selectZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    selectZone.classList.add('drag-over');
  });
  selectZone.addEventListener('dragleave', function() {
    selectZone.classList.remove('drag-over');
  });
  selectZone.addEventListener('drop', function(e) {
    e.preventDefault();
    selectZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      handleBrowserFile(e.dataTransfer.files[0]);
    }
  });
  fileInput.addEventListener('change', function() {
    if (fileInput.files.length) handleBrowserFile(fileInput.files[0]);
  });

  function handleBrowserFile(file) {
    selectedFilePath = null;
    selectedFile = file;
    updateFileUI(file.name);
  }

  // ===== Convert: 本地文件 =====
  btnFileConvert.addEventListener('click', function() {
    document.getElementById('errorMsg').classList.remove('show');
    if (selectedFilePath && !selectedFile) {
      convertByPath(selectedFilePath);
    } else if (selectedFile) {
      convertByUpload(selectedFile);
    } else {
      showError('请先选择文件');
    }
  });

  function convertByPath(filePath) {
    var btn = btnFileConvert;
    btn.disabled = true;
    showProgress(true);
    var opts = getOptions();
    if (!opts.saveName) {
      var name = filePath.replace(/\\/g, '/').split('/').pop().replace(/\.html?$/i, '');
      document.getElementById('saveName').value = name;
    }
    fetch('/api/convert-path', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ filePath: filePath }, opts))
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      showResult(data);
    })
    .catch(function(err) {
      showError(err.message);
    })
    .finally(function() {
      btn.disabled = false;
      showProgress(false);
    });
  }

  function convertByUpload(file) {
    var formData = new FormData();
    formData.append('htmlFile', file);
    var opts = getOptions();
    Object.keys(opts).forEach(function(k) {
      formData.append(k, opts[k]);
    });
    if (!opts.saveName) {
      document.getElementById('saveName').value = file.name.replace(/\.(html?|htm|zip)$/i, '');
    }
    var btn = btnFileConvert;
    btn.disabled = true;
    showProgress(true);
    fetch('/api/convert-file', { method: 'POST', body: formData })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      showResult(data);
    })
    .catch(function(err) {
      showError(err.message);
    })
    .finally(function() {
      btn.disabled = false;
      showProgress(false);
    });
  }

  // ===== Convert: URL =====
  document.getElementById('btnUrlConvert').addEventListener('click', function() {
    var url = document.getElementById('urlInput').value.trim();
    if (!url) {
      showError('请输入网页 URL');
      return;
    }
    var finalUrl = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    var opts = getOptions();
    if (!opts.saveName) {
      try {
        document.getElementById('saveName').value = new URL(finalUrl).hostname.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_');
      } catch(e) {}
    }
    var btn = document.getElementById('btnUrlConvert');
    btn.disabled = true;
    showProgress(true);
    document.getElementById('errorMsg').classList.remove('show');
    fetch('/api/convert-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ url: finalUrl }, opts))
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      showResult(data);
    })
    .catch(function(err) {
      showError(err.message);
    })
    .finally(function() {
      btn.disabled = false;
      showProgress(false);
    });
  });

  // ===== 浏览器下载 =====
  document.getElementById('btnDownload').addEventListener('click', function() {
    if (!currentResult) return;
    var name = document.getElementById('saveName').value.trim() || 'output';
    window.open('/api/download/' + currentResult.filename + '?name=' + encodeURIComponent(name), '_blank');
  });

  // ===== 系统另存为 =====
  document.getElementById('btnSaveAs').addEventListener('click', function() {
    if (!currentResult) return;
    var name = document.getElementById('saveName').value.trim() || 'output';
    fetch('/api/save-as', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: currentResult.filename, saveName: name })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.cancelled) return;
      if (data.success) {
        showError('已保存到: ' + data.destPath);
      } else {
        showError('保存失败: ' + (data.error || '未知错误'));
      }
    })
    .catch(function(err) {
      showError('另存为失败: ' + err.message);
    });
  });

  // ===== 新窗口打开 =====
  document.getElementById('btnNewTab').addEventListener('click', function() {
    if (!currentResult) return;
    window.open('/api/preview/' + currentResult.filename, '_blank');
  });

  // ===== Enter key for URL input =====
  document.getElementById('urlInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('btnUrlConvert').click();
  });
</script>

</body>
</html>
