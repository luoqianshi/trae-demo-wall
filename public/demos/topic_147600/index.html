<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智邻管家 - 智慧社区服务系统 Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <script src="data.js?v=2"></script>
  <style>
/* ============================================================
 * CSS Design System (Ant Design 5.x inspired)
 * ============================================================ */
:root {
  --primary: #1677ff;
  --primary-hover: #4096ff;
  --primary-active: #0958d9;
  --primary-bg: #e6f4ff;
  --success: #52c41a;
  --success-bg: #f6ffed;
  --warning: #faad14;
  --warning-bg: #fffbe6;
  --error: #ff4d4f;
  --error-bg: #fff2f0;
  --bg: #f5f5f5;
  --bg-white: #ffffff;
  --text: #1f1f1f;
  --text-secondary: #666666;
  --text-muted: #999999;
  --border: #e8e8e8;
  --border-light: #f0f0f0;
  --sidebar-bg: #001529;
  --sidebar-text: #ffffffb3;
  --sidebar-active: #1677ff;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 6px 16px rgba(0,0,0,0.12);
  --radius: 8px;
  --radius-sm: 4px;
  --radius-lg: 12px;
  --sidebar-width: 220px;
  --sidebar-collapsed-width: 64px;
  --topbar-height: 56px;
  --transition: all 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--primary); text-decoration: none; }
a:hover { color: var(--primary-hover); }

/* ========== Login Page ========== */
.login-container {
  display: flex; min-height: 100vh; background: #f0f2f5;
}
.login-brand {
  flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: linear-gradient(135deg, #1677ff 0%, #0958d9 50%, #003eb3 100%);
  color: #fff; padding: 60px; position: relative; overflow: hidden;
}
.login-brand::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
  animation: brandPulse 8s ease-in-out infinite;
}
@keyframes brandPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.login-brand-icon { font-size: 80px; margin-bottom: 24px; position: relative; z-index: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
.login-brand h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; position: relative; z-index: 1; letter-spacing: 2px; }
.login-brand p { font-size: 16px; opacity: 0.85; position: relative; z-index: 1; }
.login-brand-features { display: flex; gap: 40px; margin-top: 40px; position: relative; z-index: 1; }
.login-brand-feature { text-align: center; }
.login-brand-feature .f-icon { font-size: 32px; margin-bottom: 8px; }
.login-brand-feature .f-label { font-size: 14px; opacity: 0.9; }

.login-form-area {
  width: 480px; display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: 60px; background: #fff;
}
.login-form-card {
  width: 100%; max-width: 360px;
}
.login-form-card h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; text-align: center; }
.login-form-card .subtitle { color: var(--text-secondary); margin-bottom: 32px; text-align: center; font-size: 14px; }
.login-role-buttons { display: flex; flex-direction: column; gap: 12px; }
.login-role-btn {
  display: flex; align-items: center; gap: 12px; padding: 14px 20px; border: 2px solid var(--border);
  border-radius: var(--radius); cursor: pointer; transition: var(--transition); background: #fff;
  font-size: 15px; color: var(--text); text-align: left;
}
.login-role-btn:hover { border-color: var(--primary); background: var(--primary-bg); transform: translateY(-1px); box-shadow: var(--shadow); }
.login-role-btn .role-icon { font-size: 28px; width: 40px; text-align: center; }
.login-role-btn .role-info { flex: 1; }
.login-role-btn .role-name { font-weight: 600; display: block; }
.login-role-btn .role-desc { font-size: 12px; color: var(--text-muted); display: block; }
.login-hint { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 13px; }

/* ========== App Layout ========== */
.app-container { display: none; min-height: 100vh; }
.app-container.logged-in { display: flex; }

.sidebar {
  width: var(--sidebar-width); min-width: var(--sidebar-width); background: var(--sidebar-bg);
  color: var(--sidebar-text); display: flex; flex-direction: column; transition: var(--transition);
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; overflow-y: auto; overflow-x: hidden;
}
.sidebar.collapsed { width: var(--sidebar-collapsed-width); min-width: var(--sidebar-collapsed-width); }
.sidebar-logo {
  height: var(--topbar-height); display: flex; align-items: center; padding: 0 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 18px; font-weight: 700; color: #fff;
  white-space: nowrap; gap: 10px;
}
.sidebar.collapsed .sidebar-logo { padding: 0 16px; justify-content: center; }
.sidebar.collapsed .sidebar-logo span { display: none; }
.sidebar-menu { flex: 1; padding: 8px 0; }
.sidebar-menu-item {
  display: flex; align-items: center; gap: 10px; padding: 12px 20px; cursor: pointer;
  transition: var(--transition); color: var(--sidebar-text); white-space: nowrap;
  border-left: 3px solid transparent; font-size: 14px; margin: 2px 0;
}
.sidebar-menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
.sidebar-menu-item.active { color: #fff; background: var(--sidebar-active); border-left-color: #fff; }
.sidebar-menu-item .menu-icon { font-size: 18px; width: 24px; text-align: center; }
.sidebar.collapsed .sidebar-menu-item { padding: 12px 0; justify-content: center; }
.sidebar.collapsed .sidebar-menu-item .menu-label { display: none; }
.sidebar-footer {
  padding: 12px; border-top: 1px solid rgba(255,255,255,0.1);
}
.sidebar.collapsed .sidebar-footer { display: none; }

.main-area {
  flex: 1; margin-left: var(--sidebar-width); transition: var(--transition);
  display: flex; flex-direction: column; min-height: 100vh; min-width: 0;
}
.main-area.expanded { margin-left: var(--sidebar-collapsed-width); }

.topbar {
  height: var(--topbar-height); background: var(--bg-white); display: flex; align-items: center;
  padding: 0 24px; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 50; gap: 16px;
}
.topbar-hamburger {
  font-size: 20px; cursor: pointer; color: var(--text); padding: 4px; border-radius: var(--radius-sm);
  transition: var(--transition); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
}
.topbar-hamburger:hover { background: var(--bg); }
.topbar-title { font-size: 18px; font-weight: 600; flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.topbar-role-select { padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; background: #fff; }
.topbar-bell { position: relative; cursor: pointer; font-size: 20px; padding: 6px; border-radius: var(--radius-sm); }
.topbar-bell:hover { background: var(--bg); }
.topbar-bell .badge { position: absolute; top: 2px; right: 2px; background: var(--error); color: #fff; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.topbar-user { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); }
.topbar-user:hover { background: var(--bg); }
.topbar-user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.topbar-user-name { font-size: 14px; }
.topbar-logout { font-size: 13px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); }
.topbar-logout:hover { color: var(--error); background: var(--error-bg); }

.content { flex: 1; padding: 24px; overflow-y: auto; }

/* ========== Page Header ========== */
.page-header { margin-bottom: 24px; }
.page-header h2 { font-size: 22px; font-weight: 600; }
.page-header .breadcrumb { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* ========== Cards ========== */
.card {
  background: var(--bg-white); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; margin-bottom: 16px;
}
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-size: 16px; font-weight: 600; }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--bg-white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 16px; transition: var(--transition);
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat-card-icon { width: 48px; height: 48px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 24px; }
.stat-card-icon.blue { background: #e6f4ff; color: #1677ff; }
.stat-card-icon.green { background: #f6ffed; color: #52c41a; }
.stat-card-icon.orange { background: #fff7e6; color: #fa8c16; }
.stat-card-icon.red { background: #fff2f0; color: #ff4d4f; }
.stat-card-info { flex: 1; }
.stat-card-value { font-size: 28px; font-weight: 700; line-height: 1.2; }
.stat-card-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

.chart-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 16px; }
.chart-full { margin-bottom: 16px; }
.chart-box { background: var(--bg-white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.chart-box-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.chart-container { width: 100%; height: 300px; }

/* ========== Tables ========== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 13px; }
table th { background: #fafafa; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
table tbody tr:hover { background: #fafafa; }
table tbody tr { cursor: pointer; transition: background 0.15s; }
.table-actions { display: flex; gap: 8px; }

/* ========== Badges ========== */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; white-space: nowrap;
}
.badge-default { background: #f0f0f0; color: #666; }
.badge-primary { background: #e6f4ff; color: #1677ff; }
.badge-success { background: #f6ffed; color: #52c41a; }
.badge-warning { background: #fffbe6; color: #d48806; }
.badge-error { background: #fff2f0; color: #ff4d4f; }
.badge-processing { background: #e6f4ff; color: #1677ff; }
.badge-info { background: #e6fffb; color: #13c2c2; }

.badge-status-submitted { background: #e6f4ff; color: #1677ff; }
.badge-status-pending { background: #fff7e6; color: #d46b08; }
.badge-status-assigned { background: #f0f5ff; color: #2f54eb; }
.badge-status-in_progress { background: #e6fffb; color: #08979c; }
.badge-status-resolved { background: #f6ffed; color: #389e0d; }
.badge-status-closed { background: #f0f0f0; color: #8c8c8c; }
.badge-status-rejected { background: #fff2f0; color: #cf1322; }
.badge-status-escalated { background: #fff0f6; color: #c41d7f; }

.badge-priority-urgent { background: #fff2f0; color: #ff4d4f; }
.badge-priority-high { background: #fff7e6; color: #fa8c16; }
.badge-priority-medium { background: #e6f4ff; color: #1677ff; }
.badge-priority-low { background: #f0f0f0; color: #8c8c8c; }

.badge-sentiment-positive { background: #f6ffed; color: #52c41a; }
.badge-sentiment-neutral { background: #e6f4ff; color: #1677ff; }
.badge-sentiment-negative { background: #fff2f0; color: #ff4d4f; }

/* ========== Buttons ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 16px; border-radius: var(--radius-sm); font-size: 14px; cursor: pointer;
  border: 1px solid transparent; transition: var(--transition); font-weight: 400; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-default { background: #fff; color: var(--text); border-color: var(--border); }
.btn-default:hover { color: var(--primary); border-color: var(--primary); }
.btn-success { background: var(--success); color: #fff; border-color: var(--success); }
.btn-success:hover { opacity: 0.85; }
.btn-danger { background: var(--error); color: #fff; border-color: var(--error); }
.btn-danger:hover { opacity: 0.85; }
.btn-warning { background: var(--warning); color: #fff; border-color: var(--warning); }
.btn-sm { padding: 2px 10px; font-size: 12px; }
.btn-lg { padding: 8px 24px; font-size: 16px; }
.btn-text { background: none; border: none; color: var(--primary); padding: 4px 8px; }
.btn-text:hover { background: var(--primary-bg); }
.btn-block { display: flex; width: 100%; }

/* ========== Tabs ========== */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab-item {
  padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent;
  transition: var(--transition); font-size: 14px; color: var(--text-secondary);
}
.tab-item:hover { color: var(--primary); }
.tab-item.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

.filter-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }

/* ========== Forms ========== */
.form-group { margin-bottom: 16px; }
.form-label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: var(--text); }
.form-label .required { color: var(--error); margin-left: 2px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; transition: var(--transition); outline: none; font-family: inherit;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.form-checkbox input { width: 16px; height: 16px; }

/* ========== Modal ========== */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45);
  z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-white); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  max-height: 85vh; overflow-y: auto; min-width: 400px; max-width: 90vw;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between; padding: 16px 24px;
  border-bottom: 1px solid var(--border-light);
}
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { font-size: 20px; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: var(--radius-sm); border: none; background: none; }
.modal-close:hover { background: var(--bg); color: var(--text); }
.modal-body { padding: 24px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--border-light); }

/* ========== Toast ========== */
.toast-container { position: fixed; top: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 16px; border-radius: var(--radius); box-shadow: var(--shadow-lg); font-size: 14px;
  display: flex; align-items: center; gap: 8px; animation: toastIn 0.3s ease; max-width: 360px;
  cursor: pointer;
}
.toast-success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
.toast-error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
.toast-warning { background: #fffbe6; color: #d48806; border: 1px solid #ffe58f; }
.toast-info { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; }
@keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ========== Confirm Dialog ========== */
.confirm-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45);
  z-index: 1500; align-items: center; justify-content: center;
}
.confirm-overlay.show { display: flex; }
.confirm-dialog {
  background: var(--bg-white); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-lg);
  min-width: 320px; max-width: 420px;
}
.confirm-dialog h3 { font-size: 16px; margin-bottom: 12px; }
.confirm-dialog p { color: var(--text-secondary); margin-bottom: 20px; font-size: 14px; }
.confirm-dialog .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ========== Stars ========== */
.stars { display: inline-flex; gap: 2px; }
.star { font-size: 18px; color: #f0f0f0; cursor: pointer; transition: var(--transition); }
.star.filled { color: #faad14; }
.star.interactive:hover { color: #faad14; transform: scale(1.2); }

/* ========== Pagination ========== */
.pagination { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 16px; }
.pagination button {
  padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: #fff; cursor: pointer; font-size: 13px; transition: var(--transition);
}
.pagination button:hover { border-color: var(--primary); color: var(--primary); }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ========== Search ========== */
.search-box { display: flex; gap: 8px; margin-bottom: 16px; }
.search-box input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; }
.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
.search-highlight { background: #fff566; padding: 0 2px; border-radius: 2px; }

/* ========== Chat ========== */
.chat-layout { display: flex; height: calc(100vh - var(--topbar-height) - 48px); gap: 0; background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.chat-sidebar { width: 260px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.chat-sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
.chat-conv-list { flex: 1; overflow-y: auto; }
.chat-conv-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border-light); transition: var(--transition); }
.chat-conv-item:hover { background: #fafafa; }
.chat-conv-item.active { background: var(--primary-bg); }
.chat-conv-item .conv-title { font-size: 14px; font-weight: 500; }
.chat-conv-item .conv-preview { font-size: 12px; color: var(--text-muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-conv-item .conv-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.chat-main { flex: 1; display: flex; flex-direction: column; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.chat-msg { display: flex; gap: 10px; max-width: 80%; }
.chat-msg.assistant { align-self: flex-start; }
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
.chat-msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.chat-msg.assistant .chat-msg-avatar { background: #e6f4ff; color: #1677ff; }
.chat-msg.user .chat-msg-avatar { background: #1677ff; color: #fff; }
.chat-msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
.chat-msg.assistant .chat-msg-bubble { background: #f0f0f0; border-bottom-left-radius: 4px; }
.chat-msg.user .chat-msg-bubble { background: #1677ff; color: #fff; border-bottom-right-radius: 4px; }
.chat-msg-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.chat-input-area { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.chat-input-area input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 14px; outline: none; }
.chat-input-area input:focus { border-color: var(--primary); }
.chat-typing { padding: 4px 16px; font-size: 12px; color: var(--text-muted); font-style: italic; }

/* ========== Monitor ========== */
.monitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
.monitor-card { background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); cursor: pointer; transition: var(--transition); }
.monitor-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.monitor-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.monitor-card-name { font-weight: 600; font-size: 14px; }
.monitor-status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.monitor-status-dot.online { background: #52c41a; box-shadow: 0 0 6px rgba(82,196,26,0.5); }

/* ========== Parking ========== */

/* ========== Materials ========== */
.materials-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

<script>
/* ============================================================
 * 智邻管家 - 应用逻辑
 * ============================================================ */

// ========== State ==========
const state = {
  currentUser: null,
  currentPage: 'dashboard',
  currentRole: 'owner',
  sidebarCollapsed: false,
  viewMode: 'web',
  workOrderFilter: 'all',
  announcementFilter: 'all',
  careFilter: 'all',
  parkingFilter: 'all',
  courierFilter: 'all',
  materialTab: 'inventory',
  messageFilter: 'all',
  userFilter: 'all',
  searchQuery: '',
  searchModule: 'all',
  searchHistory: JSON.parse(localStorage.getItem('zhilin_search_history') || '[]'),
  currentChatId: null,
  chatMessages: [],
  confirmCallback: null,
  pageState: {},
};

// ========== Menu Items ==========
const MENU_ITEMS = [
  { key: 'dashboard', icon: '📊', label: '工作台' },
  { key: 'work-orders', icon: '🔧', label: '工单管理' },
  { key: 'announcements', icon: '📢', label: '公告管理' },
  { key: 'care', icon: '❤️', label: '老人关怀', roles: ['staff','grid_worker','admin','sys_admin'] },
  { key: 'monitor', icon: '📹', label: '安防监控', roles: ['staff','grid_worker','admin','sys_admin'] },
  { key: 'parking', icon: '🅿️', label: '车位管理', roles: ['staff','grid_worker','admin','sys_admin'] },
  { key: 'courier', icon: '📦', label: '快递代办' },
  { key: 'materials', icon: '📋', label: '物资领用' },
  { key: 'suggestions', icon: '💡', label: '意见箱' },
  { key: 'chat', icon: '🤖', label: 'AI 助手' },
  { key: 'users', icon: '👥', label: '用户管理', roles: ['admin','sys_admin'] },
  { key: 'ops-dashboard', icon: '⚙️', label: '运维监控', roles: ['admin','sys_admin'] },
  { key: 'search', icon: '🔍', label: '全局搜索' },
  { key: 'messages', icon: '💬', label: '消息中心' },
  { key: 'profile', icon: '👤', label: '个人信息' },
];

// ========== Auth ==========
function login(role) {
  const D = window.__DATA__;
  const user = D.users.find(u => u.role === role);
  if (user) {
    state.currentUser = user;
    state.currentRole = role;
    state.currentPage = 'dashboard';
    state.currentChatId = null;
    state.chatMessages = [];
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appContainer').classList.add('logged-in');
    renderApp();
    showMessage('success', '欢迎回来，' + user.real_name + '！');
  }
}

function logout() {
  state.currentUser = null;
  state.currentChatId = null;
  state.chatMessages = [];
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('appContainer').classList.remove('logged-in');
}

function switchRole(role) {
  const D = window.__DATA__;
  const user = D.users.find(u => u.role === role);
  if (user) {
    state.currentUser = user;
    state.currentRole = role;
    state.currentPage = 'dashboard';
    state.currentChatId = null;
    state.chatMessages = [];
    renderApp();
    showMessage('info', '已切换为：' + D.roles[role].label);
  }
}

function getAvailableMenus() {
  const D = window.__DATA__;
  const roleMenus = D.roles[state.currentRole]?.menus || [];
  return MENU_ITEMS.filter(item => {
    if (!item.roles) return true;
    return item.roles.includes(state.currentRole);
  });
}

// ========== Router ==========
function navigate(page) {
  state.currentPage = page;
  renderPage();
  highlightMenu();
  updateBellBadge();
}

// ========== Render App ==========
function renderApp() {
  renderSidebar();
  updateTopBar();
  renderPage();
  highlightMenu();
  updateBellBadge();
}

function renderSidebar() {
  const menus = getAvailableMenus();
  const html = menus.map(m => {
    const active = state.currentPage === m.key ? ' active' : '';
    return '<div class="sidebar-menu-item' + active + '" onclick="navigate(\'' + m.key + '\')" data-key="' + m.key + '">' +
      '<span class="menu-icon">' + m.icon + '</span>' +
      '<span class="menu-label">' + m.label + '</span>' +
    '</div>';
  }).join('');
  document.getElementById('sidebarMenu').innerHTML = html;
}

function highlightMenu() {
  document.querySelectorAll('.sidebar-menu-item').forEach(el => {
    el.classList.toggle('active', el.dataset.key === state.currentPage);
  });
}

function updateTopBar() {
  if (!state.currentUser) return;
  document.getElementById('topbarAvatar').textContent = state.currentUser.real_name.charAt(0);
  document.getElementById('topbarUserName').textContent = state.currentUser.real_name;
  document.getElementById('topbarRoleSelect').value = state.currentRole;
}

function updateBellBadge() {
  const D = window.__DATA__;
  const unread = D.notifications.filter(n => n.user_id === state.currentUser?.id && !n.is_read).length;
  const badge = document.getElementById('bellBadge');
  badge.textContent = unread;
  badge.style.display = unread > 0 ? 'flex' : 'none';
}

function toggleSidebar() {
  state.sidebarCollapsed = !state.sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', state.sidebarCollapsed);
  document.getElementById('mainArea').classList.toggle('expanded', state.sidebarCollapsed);
}

// ========== Render Page ==========
function renderPage() {
  const content = document.getElementById('content');
  const page = state.currentPage;
  const renderers = {
    'dashboard': renderDashboard,
    'work-orders': renderWorkOrders,
    'announcements': renderAnnouncements,
    'care': renderCare,
    'monitor': renderMonitor,
    'parking': renderParking,
    'courier': renderCourier,
    'materials': renderMaterials,
    'suggestions': renderSuggestions,
    'chat': renderChat,
    'users': renderUsers,
    'ops-dashboard': renderOpsDashboard,
    'search': renderSearch,
    'messages': renderMessages,
    'profile': renderProfile,
  };
  if (renderers[page]) {
    content.innerHTML = renderers[page]();
  }
  if (page === 'dashboard') {
    setTimeout(initDashboardCharts, 150);
  }
  if (page === 'chat') {
    setTimeout(initChat, 100);
  }
}

// ========== Utility Functions ==========
function formatTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

function renderBadge(text, type) {
  if (!text) return '';
  let cls = 'badge-default';
  if (type === 'status') cls = 'badge-status-' + text;
  else if (type === 'priority') cls = 'badge-priority-' + text;
  else if (type === 'sentiment') cls = 'badge-sentiment-' + text;
  else if (text === 'urgent' || text === '紧急') cls = 'badge-error';
  else if (text === 'high' || text === '高') cls = 'badge-warning';
  else if (text === 'medium' || text === '中') cls = 'badge-primary';
  else if (text === 'low' || text === '低') cls = 'badge-default';
  else if (text === 'online' || text === '在线') cls = 'badge-success';
  else if (text === 'offline' || text === '离线') cls = 'badge-error';
  const labels = {
    submitted: '已提交', pending: '待处理', assigned: '已分配', in_progress: '处理中',
    resolved: '已解决', closed: '已关闭', rejected: '已驳回', escalated: '已升级',
    available: '空闲', occupied: '已占用', reserved: '预留', maintenance: '维护中',
    new: '新建议', processing: '处理中', replied: '已回复', adopted: '已采纳',
    pending_c: '待处理', delivering: '配送中', delivered: '已送达', cancelled: '已取消',
    assigned_c: '已分配', picked_up: '已取件',
    borrowed: '借用中', returned: '已归还', overdue: '已逾期', lost: '已丢失',
    active: '启用', disabled: '禁用',
    positive: '正面', neutral: '中性', negative: '负面',
    urgent: '紧急', notice: '通知', activity: '活动', urgent_ann: '紧急',
    standard: '标准', electric: '充电', disabled_t: '无障碍',
    repair: '维修', cleaning: '清洁', security: '安防', complaint: '投诉', suggestion: '建议', other: '其他',
    '视频监控': '视频监控', '门禁': '门禁', '报警': '报警', '闸机': '闸机', '对讲': '对讲',
    facility: '设施', service: '服务', safety: '安全', environment: '环境',

function showModal(title, content, width) {
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  box.style.width = width || '600px';
  box.innerHTML = '<div class="modal-header"><h3>' + title + '</h3><button class="modal-close" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body">' + content + '</div>';
  overlay.classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function showConfirm(title, text, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmOverlay').classList.add('show');
  state.confirmCallback = onConfirm;
  document.getElementById('confirmOkBtn').onclick = function() {
    closeConfirm();
    if (state.confirmCallback) state.confirmCallback();
  };
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('show');
  state.confirmCallback = null;
}

function showMessage(type, text) {
  const container = document.getElementById('toastContainer');
  const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.innerHTML = '<span>' + (icons[type] || '') + '</span><span>' + text + '</span>';
  toast.onclick = function() { toast.remove(); };
  container.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

function renderFormField(label, type, name, placeholder, options) {
  let html = '<div class="form-group"><label class="form-label">' + label + '</label>';
  if (type === 'select') {
    html += '<select class="form-select" id="' + name + '">';
    if (options) {
      options.forEach(function(o) {
        html += '<option value="' + o.value + '">' + o.label + '</option>';
      });
    }
    html += '</select>';
  } else if (type === 'textarea') {
    html += '<textarea class="form-textarea" id="' + name + '" placeholder="' + (placeholder || '') + '"></textarea>';
  } else if (type === 'checkbox') {
    html += '<label class="form-checkbox"><input type="checkbox" id="' + name + '"> ' + (placeholder || '') + '</label>';
  } else {
    html += '<input class="form-input" type="' + type + '" id="' + name + '" placeholder="' + (placeholder || '') + '">';
  }
  html += '</div>';
  return html;
}

function renderPagination(total, current, pageSize, onChange) {
  var totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) return '';
  var html = '<div class="pagination">';
  html += '<button ' + (current <= 1 ? 'disabled' : '') + ' onclick="' + onChange + '(' + (current - 1) + ')">上一页</button>';
  for (var i = 1; i <= totalPages; i++) {
    html += '<button class="' + (i === current ? 'active' : '') + '" onclick="' + onChange + '(' + i + ')">' + i + '</button>';
  }
  html += '<button ' + (current >= totalPages ? 'disabled' : '') + ' onclick="' + onChange + '(' + (current + 1) + ')">下一页</button>';
  html += '</div>';
  return html;
}

function renderTabs(tabs, active, onChange) {
  var html = '<div class="tabs">';
  tabs.forEach(function(t) {
    html += '<div class="tab-item' + (t.key === active ? ' active' : '') + '" onclick="' + onChange + '(\'' + t.key + '\')">' + t.label + '</div>';
  });
  html += '</div>';
  return html;
}

function renderPageHeader(title, actions) {
  return '<div class="page-header flex-between"><h2>' + title + '</h2>' + (actions || '') + '</div>';
}

// ========== 4. Care ==========
function renderCare() {
  const D = window.__DATA__;
  const filter = state.careFilter || 'all';
  let records = D.careRecords;
  if (filter === 'completed') records = records.filter(r => r.is_completed);
  else if (filter === 'pending') records = records.filter(r => !r.is_completed);

  let html = renderPageHeader('老人关怀',
    '<button class="btn btn-primary" onclick="showCreateCareModal()">+ 创建关怀记录</button>');

  const tabs = [
    { key: 'all', label: '全部(' + D.careRecords.length + ')' },
    { key: 'pending', label: '待关怀' },
    { key: 'completed', label: '已完成' },
  ];
  html += renderTabs(tabs, filter, 'setCareFilter');

  html += '<div class="card"><div class="table-wrap"><table><thead><tr>';
  html += '<th>老人姓名</th><th>关怀类型</th><th>走访时间</th><th>完成状态</th><th>工作人员</th><th>备注</th><th>操作</th>';
  html += '</tr></thead><tbody>';
  records.forEach(function(r) {
    const staff = D.users.find(u => u.id === r.staff_id);
    html += '<tr onclick="showCareDetail(' + r.id + ')">';
    html += '<td><strong>' + r.resident_name + '</strong><br><span class="text-muted">' + r.resident_address + '</span></td>';
    html += '<td>' + renderBadge(r.care_type) + '</td>';
    html += '<td>' + formatTime(r.scheduled_at) + '</td>';
    html += '<td>' + (r.is_completed ? '<span class="badge badge-success">已完成</span>' : '<span class="badge badge-warning">待关怀</span>') + '</td>';
    html += '<td>' + (staff ? staff.real_name : '-') + '</td>';
    html += '<td class="truncate" style="max-width:200px;">' + (r.notes || '-') + '</td>';
    html += '<td><div class="table-actions">';
    html += '<button class="btn btn-sm btn-default" onclick="event.stopPropagation();showCareDetail(' + r.id + ')">详情</button>';
    if (!r.is_completed) {
      html += '<button class="btn btn-sm btn-success" onclick="event.stopPropagation();completeCare(' + r.id + ')">完成</button>';
    }
    html += '</div></td></tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}

function renderParking() {
  const D = window.__DATA__;
  const filter = state.parkingFilter || 'all';
  let spaces = D.parkingSpaces;
  if (filter !== 'all') spaces = spaces.filter(s => s.status === filter);

  const total = D.parkingSpaces.length;
  const occupied = D.parkingSpaces.filter(s => s.status === 'occupied').length;
  const available = D.parkingSpaces.filter(s => s.status === 'available').length;
  const reserved = D.parkingSpaces.filter(s => s.status === 'reserved').length;
  const maintenance = D.parkingSpaces.filter(s => s.status === 'maintenance').length;

  let html = renderPageHeader('车位管理',
    '<button class="btn btn-primary" onclick="showCreateParkingModal()">+ 申请车位</button>');

  html += '<div class="parking-stats">';
  html += '<div class="parking-stat"><div class="ps-value" style="color:#1677ff;">' + total + '</div><div class="ps-label">总车位</div></div>';
  html += '<div class="parking-stat"><div class="ps-value" style="color:#52c41a;">' + available + '</div><div class="ps-label">空闲</div></div>';
  html += '<div class="parking-stat"><div class="ps-value" style="color:#1677ff;">' + occupied + '</div><div class="ps-label">已占用</div></div>';
  html += '<div class="parking-stat"><div class="ps-value" style="color:#faad14;">' + reserved + '</div><div class="ps-label">预留</div></div>';
  html += '<div class="parking-stat"><div class="ps-value" style="color:#ff4d4f;">' + maintenance + '</div><div class="ps-label">维护</div></div>';
  html += '</div>';

  const tabs = [
    { key: 'all', label: '全部(' + total + ')' },
    { key: 'available', label: '空闲' },
    { key: 'occupied', label: '已占用' },
    { key: 'reserved', label: '预留' },
    { key: 'maintenance', label: '维护' },
  ];
  html += renderTabs(tabs, filter, 'setParkingFilter');

  html += '<div class="parking-grid">';
  spaces.forEach(function(s) {
    const typeLabels = { standard: '标准', electric: '充电', disabled: '无障碍' };
    html += '<div class="parking-card status-' + s.status + '">';
    html += '<div class="flex-between"><span class="ps-num">' + s.space_number + '</span>' + renderStatusBadge(s.status) + '</div>';
    html += '<div class="ps-area">' + s.area + ' | ' + (typeLabels[s.type] || s.type) + '</div>';
    if (s.vehicle_plate) html += '<div class="ps-plate">🚗 ' + s.vehicle_plate + '</div>';
    html += '<div class="text-muted" style="font-size:12px;">月费：' + s.monthly_fee + '元/月</div>';
    if (s.occupant_name) html += '<div class="text-muted" style="font-size:12px;">使用人：' + s.occupant_name + '</div>';
    html += '</div>';
  });
  html += '</div>';

  return html;
}

  const D = window.__DATA__;
  let html = renderPageHeader('意见箱');

  // Submit form
  html += '<div class="suggestion-form">';
  html += '<h3 style="margin-bottom:16px;">提交建议</h3>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">';
  html += renderFormField('标题', 'text', 'sg_title', '请输入建议标题');
  html += renderFormField('分类', 'select', 'sg_category', '', [
    { value: 'facility', label: '设施' }, { value: 'service', label: '服务' },
    { value: 'safety', label: '安全' }, { value: 'environment', label: '环境' },
    { value: 'other', label: '其他' }
  ]);
  html += '</div>';
  html += renderFormField('内容', 'textarea', 'sg_content', '请详细描述您的建议');
  html += renderFormField('', 'checkbox', 'sg_anonymous', '匿名提交');
  html += '<button class="btn btn-primary" onclick="submitSuggestion()">提交建议</button>';
  html += '</div>';

  // List
  html += '<div class="suggestion-cards">';
  D.suggestions.forEach(function(s) {
    html += '<div class="suggestion-card" onclick="showSuggestionDetail(' + s.id + ')">';
    html += '<div class="sc-header">';
    html += '<span class="sc-title">' + s.title + '</span>';
    html += '<div class="flex gap-8">' + renderSentimentBadge(s.ai_sentiment) + renderStatusBadge(s.status) + '</div>';
    html += '</div>';
    html += '<div class="sc-content">' + s.description.substring(0, 120) + '...</div>';
    html += '<div class="sc-meta">';
    html += '<span class="text-muted">' + (s.creator_name || '匿名') + ' | ' + formatTime(s.created_at) + '</span>';
    html += renderBadge(s.ai_category);
    s.ai_keywords.forEach(function(k) {
      html += '<span class="sc-keyword">' + k + '</span>';
    });
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';

  return html;
}

function submitSuggestion() {
  const title = document.getElementById('sg_title')?.value;
  const content = document.getElementById('sg_content')?.value;
  if (!title || !content) { showMessage('warning', '请填写标题和内容'); return; }
  showMessage('success', '建议已提交，感谢您的反馈！');
  renderPage();
}

function showSuggestionDetail(id) {
  const D = window.__DATA__;
  const s = D.suggestions.find(su => su.id === id);
  if (!s) return;
  let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">';
  html += '<div><strong>提交人：</strong>' + (s.creator_name || '匿名') + '</div>';
  html += '<div><strong>分类：</strong>' + renderBadge(s.ai_category) + '</div>';
  html += '<div><strong>状态：</strong>' + renderStatusBadge(s.status) + '</div>';
  html += '<div><strong>AI情感：</strong>' + renderSentimentBadge(s.ai_sentiment) + '</div>';
  html += '<div><strong>时间：</strong>' + formatTime(s.created_at) + '</div>';
  html += '<div><strong>关键词：</strong>' + s.ai_keywords.map(k => '<span class="sc-keyword">' + k + '</span>').join(' ') + '</div>';
  html += '</div>';
  html += '<div class="mt-16"><strong>建议内容：</strong><p style="margin-top:4px;color:var(--text-secondary);white-space:pre-wrap;">' + s.description + '</p></div>';
  if (s.reply_content) {
    html += '<div class="mt-16" style="background:#f6ffed;padding:12px;border-radius:8px;border-left:3px solid #52c41a;">';
    html += '<strong>回复：</strong><span class="text-muted">（' + formatTime(s.reply_at) + '）</span>';
    html += '<p style="margin-top:4px;white-space:pre-wrap;">' + s.reply_content + '</p>';
    html += '</div>';
  }
  html += '<div class="modal-footer">';
  if (state.currentRole !== 'owner' && !s.reply_content && (s.status === 'new' || s.status === 'processing')) {
    html += '<button class="btn btn-primary" onclick="replySuggestion(' + s.id + ')">回复</button>';
  }
  html += '<button class="btn btn-default" onclick="closeModal()">关闭</button>';
  html += '</div>';
  showModal('建议详情 - ' + s.title, html, '600px');
}

function replySuggestion(id) {
  const D = window.__DATA__;
  const s = D.suggestions.find(su => su.id === id);
  if (s) {
    s.reply_content = '感谢您的反馈！我们已经收到您的建议，正在积极处理中。';
    s.reply_at = new Date().toISOString();
    s.replier_id = state.currentUser.id;
    s.status = 'replied';
  }
  closeModal();
  showMessage('success', '已回复');
  renderPage();
}

// ========== 10. Chat (AI助手) ==========
function renderChat() {
  const D = window.__DATA__;
  let html = '<div class="chat-layout">';

  // Sidebar
  html += '<div class="chat-sidebar">';
  html += '<div class="chat-sidebar-header">💬 对话列表</div>';
  html += '<div class="chat-conv-list">';
  D.conversations.forEach(function(c) {
    const active = state.currentChatId === c.id ? ' active' : '';
    html += '<div class="chat-conv-item' + active + '" onclick="openChat(' + c.id + ')">';
    html += '<div class="conv-title">' + c.title + '</div>';
    html += '<div class="conv-preview">' + (c.messages[c.messages.length - 1]?.content || '') + '</div>';
    html += '<div class="conv-time">' + formatTime(c.updated_at) + '</div>';
    html += '</div>';
  });
  html += '<div class="chat-conv-item" onclick="openNewChat()" style="text-align:center;color:var(--primary);">+ 新建对话</div>';
  html += '</div></div>';

  // Main chat
  html += '<div class="chat-main">';
  html += '<div class="chat-messages" id="chatMessages">';
  if (state.currentChatId) {
    const conv = D.conversations.find(c => c.id === state.currentChatId);
    if (conv) {
      conv.messages.forEach(function(m) {
        html += renderChatMessage(m);
      });
    }
    state.chatMessages.forEach(function(m) {
      html += renderChatMessage(m);
    });
  }
  if (!state.currentChatId && state.chatMessages.length === 0) {
    html += '<div class="empty-state">';
    html += '<div style="font-size:48px;margin-bottom:12px;">🤖</div>';
    html += '<div>选择一个对话或新建对话开始交流</div>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="chat-typing" id="chatTyping" style="display:none;">AI 正在思考...</div>';
  html += '<div class="chat-input-area">';
  html += '<input type="text" id="chatInput" placeholder="输入消息..." onkeydown="if(event.key===\'Enter\')sendChatMessage()">';
  html += '<button class="btn btn-primary" onclick="sendChatMessage()">发送</button>';
  html += '</div>';
  html += '</div>';

  html += '</div>';
  return html;
}

function renderChatMessage(m) {
  let html = '<div class="chat-msg ' + m.role + '">';
  html += '<div class="chat-msg-avatar">' + (m.role === 'assistant' ? '🤖' : '👤') + '</div>';
  html += '<div><div class="chat-msg-bubble">' + m.content.replace(/\n/g, '<br>') + '</div>';
  html += '<div class="chat-msg-time">' + formatTime(m.created_at) + '</div></div>';
  html += '</div>';
  return html;
}

function openChat(id) {
  state.currentChatId = id;
  state.chatMessages = [];
  renderPage();
  setTimeout(scrollChatToBottom, 100);
}

function openNewChat() {
  state.currentChatId = null;
  state.chatMessages = [];
  renderPage();
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  const msg = { id: Date.now(), role: 'user', content: text, created_at: new Date().toISOString() };
  state.chatMessages.push(msg);
  if (!state.currentChatId) state.currentChatId = -1;
  input.value = '';
  renderPage();
  setTimeout(scrollChatToBottom, 100);

  // Simulate typing
  const typingEl = document.getElementById('chatTyping');
  if (typingEl) typingEl.style.display = 'block';
  setTimeout(function() {
    if (typingEl) typingEl.style.display = 'none';
    const replies = [
      '好的，我已经收到您的消息。作为智邻管家AI助手，我会尽快为您处理。',
      '感谢您的反馈！我已经记录下您的需求，稍后会有工作人员跟进处理。',
      '您好！关于您提到的问题，建议您通过工单系统提交详细描述，这样我们可以更高效地为您服务。',
      '收到！如果您需要查询小区公告、提交报修工单或了解社区服务，请随时告诉我。',
      '已为您记录。如需帮助，请随时联系我或拨打物业服务中心电话。',
    ];
    const reply = replies[Math.floor(Math.random() * replies.length)];
    const aiMsg = { id: Date.now() + 1, role: 'assistant', content: reply, created_at: new Date().toISOString() };
    state.chatMessages.push(aiMsg);
    renderPage();
    setTimeout(scrollChatToBottom, 100);
  }, 1500);
}

function scrollChatToBottom() {
  const el = document.getElementById('chatMessages');
  if (el) el.scrollTop = el.scrollHeight;
}

function initChat() {
  setTimeout(scrollChatToBottom, 100);
}

// ========== 13. Search ==========
function renderSearch() {
  const D = window.__DATA__;
  const query = state.searchQuery || '';
  const module = state.searchModule || 'all';

  let html = renderPageHeader('全局搜索');

  // Search box
  html += '<div class="search-box">';
  html += '<input type="text" id="searchInput" value="' + query.replace(/"/g, '&quot;') + '" placeholder="输入关键词搜索..." onkeydown="if(event.key===\'Enter\')performSearch()">';
  html += '<button class="btn btn-primary" onclick="performSearch()">搜索</button>';
  html += '</div>';

  // Module tabs
  const searchTabs = [
    { key: 'all', label: '全部' },
    { key: 'work-orders', label: '工单' },
    { key: 'announcements', label: '公告' },
    { key: 'suggestions', label: '意见' },
    { key: 'courier', label: '快递' },
  ];
  html += renderTabs(searchTabs, module, 'setSearchModule');

  // Search history
  if (state.searchHistory.length > 0 && !query) {
    html += '<div class="card"><div class="card-header flex-between"><span class="card-title">搜索历史</span><button class="btn btn-sm btn-text" onclick="clearSearchHistory()">清空</button></div>';
    html += '<div class="flex gap-8 flex-wrap">';
    state.searchHistory.forEach(function(h) {
      html += '<span style="background:#f0f0f0;padding:4px 12px;border-radius:16px;cursor:pointer;font-size:13px;" onclick="searchFromHistory(\'' + h.replace(/'/g, "\\'") + '\')">' + h + '</span>';
    });
    html += '</div></div>';
  }

  // Results
  if (query) {
    const results = [];
    const lowerQ = query.toLowerCase();

    if (module === 'all' || module === 'work-orders') {
      D.workOrders.forEach(function(o) {
        if (o.title.toLowerCase().includes(lowerQ) || o.order_no.toLowerCase().includes(lowerQ) || o.description.toLowerCase().includes(lowerQ)) {
          results.push({ type: '工单', title: o.title, desc: o.order_no, id: o.id, link: 'work-orders' });
        }
      });
    }
    if (module === 'all' || module === 'announcements') {
      D.announcements.forEach(function(a) {
        if (a.title.toLowerCase().includes(lowerQ) || a.content.toLowerCase().includes(lowerQ)) {
          results.push({ type: '公告', title: a.title, desc: a.content.substring(0, 80) + '...', id: a.id, link: 'announcements' });
        }
      });
    }
    if (module === 'all' || module === 'suggestions') {
      D.suggestions.forEach(function(s) {
        if (s.title.toLowerCase().includes(lowerQ) || s.description.toLowerCase().includes(lowerQ)) {
          results.push({ type: '建议', title: s.title, desc: s.description.substring(0, 80) + '...', id: s.id, link: 'suggestions' });
        }
      });
    }
    if (module === 'all' || module === 'courier') {
      D.courierTasks.forEach(function(c) {
        if (c.tracking_no.toLowerCase().includes(lowerQ) || c.courier_company.toLowerCase().includes(lowerQ) || c.recipient_name.toLowerCase().includes(lowerQ)) {
          results.push({ type: '快递', title: c.courier_company + ' - ' + c.tracking_no, desc: c.recipient_name, id: c.id, link: 'courier' });
        }
      });
    }

    html += '<div class="card"><div class="card-header"><span class="card-title">搜索结果（' + results.length + '条）</span></div>';
    if (results.length === 0) {
      html += '<div class="empty-state">未找到相关结果</div>';
    } else {
      results.forEach(function(r) {
        html += '<div style="padding:10px 0;border-bottom:1px solid var(--border-light);cursor:pointer;" onclick="navigate(\'' + r.link + '\')">';
        html += '<div class="flex-between"><span style="font-weight:600;">' + highlightKeyword(r.title, query) + '</span><span class="badge badge-primary">' + r.type + '</span></div>';
        html += '<div class="text-muted" style="font-size:13px;">' + highlightKeyword(r.desc, query) + '</div>';
        html += '</div>';
      });
    }
    html += '</div>';
  }

  return html;
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;
  const regex = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(regex, '<span class="search-highlight">$1</span>');
}

function performSearch() {
  const input = document.getElementById('searchInput');
  if (!input) return;
  const query = input.value.trim();
  if (!query) return;
  state.searchQuery = query;
  if (!state.searchHistory.includes(query)) {
    state.searchHistory.unshift(query);
    if (state.searchHistory.length > 20) state.searchHistory.pop();
    localStorage.setItem('zhilin_search_history', JSON.stringify(state.searchHistory));
  }
  renderPage();
}

function searchFromHistory(query) {
  state.searchQuery = query;
  document.getElementById('searchInput').value = query;
  renderPage();
}

function setSearchModule(module) { state.searchModule = module; renderPage(); }

function clearSearchHistory() {
  state.searchHistory = [];
  localStorage.removeItem('zhilin_search_history');
  renderPage();
}

  const D = window.__DATA__;

  if (filter === 'unread') notifications = notifications.filter(n => !n.is_read);
  else if (filter !== 'all') notifications = notifications.filter(n => n.type === filter);

  let html = renderPageHeader('消息中心',
    '<button class="btn btn-default" onclick="markAllRead()">全部已读</button>');

  const msgTabs = [
    { key: 'all', label: '全部(' + notifications.length + ')' },
    { key: 'unread', label: '未读(' + D.notifications.filter(n => n.user_id === state.currentUser?.id && !n.is_read).length + ')' },
    { key: 'work_order', label: '工单' },
    { key: 'announcement', label: '公告' },
    { key: 'system', label: '系统' },
  ];
  html += renderTabs(msgTabs, filter, 'setMessageFilter');

  const typeIcons = { work_order: '🔧', announcement: '📢', system: '⚙️', suggestion: '💡' };
  html += '<div class="card"><div class="msg-list">';
  notifications.forEach(function(n) {
    html += '<div class="msg-item' + (!n.is_read ? ' unread' : '') + '" onclick="markRead(' + n.id + ')">';
    html += '<div class="msg-dot' + (n.is_read ? ' read' : '') + '"></div>';
    html += '<div class="msg-icon">' + (typeIcons[n.type] || '💬') + '</div>';
    html += '<div class="msg-body">';
    html += '<div class="msg-title">' + n.title + '</div>';
    html += '<div class="msg-content">' + n.content + '</div>';
    html += '</div>';
    html += '<div class="msg-time">' + formatTime(n.created_at) + '</div>';
    html += '</div>';
  });
  if (notifications.length === 0) {
    html += '<div class="empty-state">暂无消息</div>';
  }
  html += '</div></div>';

  return html;
}

function setMessageFilter(filter) { state.messageFilter = filter; renderPage(); }

function markRead(id) {
  const D = window.__DATA__;
  const n = D.notifications.find(no => no.id === id);
  if (n) n.is_read = true;
  updateBellBadge();
  renderPage();
}

function markAllRead() {
  const D = window.__DATA__;
  D.notifications.forEach(function(n) {
    if (n.user_id === state.currentUser?.id) n.is_read = true;
  });
  updateBellBadge();
  showMessage('success', '已全部标记为已读');
  renderPage();
}

// ========== 15. Profile ==========
function renderProfile() {
  const D = window.__DATA__;
  const u = state.currentUser;
  if (!u) return '';
  const roleLabels = { owner: '业主', staff: '物业人员', grid_worker: '网格员', admin: '管理员', sys_admin: '系统管理员' };
  let html = renderPageHeader('个人信息');

  html += '<div class="profile-card">';
  html += '<div class="profile-avatar">' + u.real_name.charAt(0) + '</div>';
  html += '<div class="profile-info">';
  html += '<h3>' + u.real_name + '</h3>';
  html += '<div class="pi-role">' + (roleLabels[u.role] || u.role) + '</div>';
  html += '<div class="pi-detail"><span class="pi-label">用户名：</span><span>' + u.username + '</span></div>';
  html += '<div class="pi-detail"><span class="pi-label">手机号：</span><span>' + u.phone + '</span></div>';
  html += '<div class="pi-detail"><span class="pi-label">住址：</span><span>' + (u.building ? u.building + (u.unit ? u.unit : '') + (u.room ? u.room : '') : '未设置') + '</span></div>';
  html += '<div class="pi-detail"><span class="pi-label">信用分：</span><span style="color:#52c41a;font-weight:600;">' + u.credit_score + '</span></div>';
  html += '</div>';
  html += '</div>';

  // Edit profile form
  html += '<div class="card mt-16"><div class="card-header"><span class="card-title">编辑资料</span></div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">';
  html += renderFormField('真实姓名', 'text', 'pf_name', '', null);
  html += renderFormField('手机号', 'text', 'pf_phone', '', null);
  html += '</div>';
  html += renderFormField('住址', 'text', 'pf_address', '', null);
  html += '<button class="btn btn-primary" onclick="saveProfile()">保存修改</button>';
  html += '</div>';

  // Change password
  html += '<div class="card mt-16"><div class="card-header"><span class="card-title">修改密码</span></div>';
  html += renderFormField('当前密码', 'password', 'pf_old_pwd', '', null);
  html += renderFormField('新密码', 'password', 'pf_new_pwd', '', null);
  html += renderFormField('确认新密码', 'password', 'pf_confirm_pwd', '', null);
  html += '<button class="btn btn-primary" onclick="changePassword()">修改密码</button>';
  html += '</div>';

  return html;
}

function saveProfile() {
  const name = document.getElementById('pf_name')?.value;
  const phone = document.getElementById('pf_phone')?.value;
  if (name) state.currentUser.real_name = name;
  if (phone) state.currentUser.phone = phone;
  updateTopBar();
  showMessage('success', '个人信息已更新');
  renderPage();
}

function changePassword() {
  showMessage('success', '密码修改成功（Demo模式）');
}

// ========== Init Ops Chart ==========
function initOpsChart() {
  const dom = document.getElementById('chartApiStats');
  if (!dom) return;
  const chart = echarts.init(dom);
  chart.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: ['请求数', '错误数'], bottom: '0%' },
    grid: { left: '3%', right: '4%', bottom: '15%', containLabel: true },
    xAxis: { type: 'category', data: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'] },
    yAxis: { type: 'value' },
    series: [
      { name: '请求数', type: 'bar', data: [120, 80, 320, 450, 380, 200], color: '#1677ff', barWidth: '30%' },
      { name: '错误数', type: 'bar', data: [2, 0, 5, 8, 3, 1], color: '#ff4d4f', barWidth: '30%' },
    ]
  });
}

// Override renderPage to handle ops chart
const _origRenderPage = renderPage;
renderPage = function() {
  _origRenderPage();
  if (state.currentPage === 'ops-dashboard') {
    setTimeout(initOpsChart, 150);
  }
};

// ========== Init ==========
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('appContainer').classList.remove('logged-in');
  document.getElementById('loginPage').style.display = 'flex';
});
</script>
