<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岗位判官 - 你的职场决策顾问</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('./_shared/fonts/BricolageGrotesque-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('./_shared/fonts/BricolageGrotesque-Bold.ttf') format('truetype');
      font-weight: 700;
    }
  </style>
  <style>
    :root {
      --bg: #0f0f1a;
      --bg2: #1a1a2e;
      --bg3: #25253d;
      --ink: #e8e8f0;
      --muted: #8888aa;
      --rule: #2a2a44;
      --accent: #ff6b35;
      --accent2: #ffd166;
      --accent3: #06d6a0;
      --accent4: #ef476f;
      --font: 'Noto Sans SC', 'BricolageGrotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --max: 720px;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.7;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === Animated Background === */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 20% 50%, rgba(255,107,53,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, rgba(255,209,102,0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(6,214,160,0.05) 0%, transparent 50%);
      z-index: -1;
      animation: bgFloat 20s ease-in-out infinite alternate;
    }
    @keyframes bgFloat {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-5%, 3%) rotate(3deg); }
    }

    /* === Layout === */
    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    /* === Header === */
    .site-header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      position: relative;
    }
    .site-header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
    }
    .site-header .subtitle {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 4px;
    }
    .gavel-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 1rem;
      animation: gavelBounce 2s ease-in-out infinite;
    }
    @keyframes gavelBounce {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
    }

    /* === Tab Navigation === */
    .tab-nav {
      display: flex;
      gap: 0;
      background: var(--bg2);
      border-radius: var(--radius);
      padding: 4px;
      margin: 2rem 0;
      border: 1px solid var(--rule);
    }
    .tab-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-family: var(--font);
    }
    .tab-btn:hover {
      color: var(--ink);
      background: var(--bg3);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), #ff8c5a);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 2px 12px rgba(255,107,53,0.3);
    }

    /* === Tab Panels === */
    .tab-panel {
      display: none;
      animation: fadeSlideIn 0.4s ease;
    }
    .tab-panel.active {
      display: block;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === Module Cards === */
    .module-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    /* === Section Title === */
    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-title .icon {
      font-size: 1.5rem;
    }

    /* ==============================
       MODULE 1: Random Draw
    ============================== */
    .draw-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem 0;
    }
    .draw-card {
      width: 200px;
      height: 280px;
      perspective: 1000px;
      cursor: pointer;
    }
    .draw-card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .draw-card.flipped .draw-card-inner {
      transform: rotateY(180deg);
    }
    .draw-card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
    }
    .draw-card-front {
      background: linear-gradient(135deg, var(--bg3), var(--bg2));
      border: 2px solid var(--rule);
    }
    .draw-card-front .card-label {
      font-size: 1.1rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 1rem;
    }
    .draw-card-front .card-gavel {
      font-size: 4rem;
      animation: gavelBounce 2s ease-in-out infinite;
    }
    .draw-card-front .card-hint {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 1.5rem;
      opacity: 0.7;
    }
    .draw-card-back {
      background: linear-gradient(135deg, var(--bg3), var(--bg2));
      border: 2px solid var(--rule);
      transform: rotateY(180deg);
      padding: 1.5rem;
    }
    .draw-card-back .result-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    .draw-card-back .result-text {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 3px;
    }
    .draw-card-back .result-text.leave {
      background: linear-gradient(135deg, var(--accent4), #ff6b8a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .draw-card-back .result-text.stay {
      background: linear-gradient(135deg, var(--accent3), #34e8b5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .draw-card-back .result-desc {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      margin-top: 0.5rem;
    }

    .draw-btn {
      padding: 1rem 3rem;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #ff8c5a);
      color: #fff;
      box-shadow: 0 4px 20px rgba(255,107,53,0.4);
      transition: all 0.3s ease;
      font-family: var(--font);
    }
    .draw-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(255,107,53,0.5);
    }
    .draw-btn:active {
      transform: translateY(0);
    }
    .draw-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ==============================
       MODULE 2: Assessment
    ============================== */
    .assess-progress {
      margin-bottom: 2rem;
    }
    .progress-bar-wrap {
      background: var(--bg3);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.5s ease;
      width: 0%;
    }
    .progress-text {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    .dimension-badge {
      display: inline-block;
      padding: 0.3rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .dim-career { background: rgba(255,107,53,0.15); color: var(--accent); }
    .dim-experience { background: rgba(255,209,102,0.15); color: var(--accent2); }
    .dim-salary { background: rgba(6,214,160,0.15); color: var(--accent3); }
    .dim-company { background: rgba(118,120,237,0.15); color: #7678ed; }
    .dim-life { background: rgba(239,71,111,0.15); color: var(--accent4); }

    .question-card {
      background: var(--bg3);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 1.5rem;
      animation: fadeSlideIn 0.4s ease;
    }
    .question-number {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .question-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.8;
      margin-bottom: 1.5rem;
      color: var(--ink);
    }
    .answer-btns {
      display: flex;
      gap: 1rem;
    }
    .answer-btn {
      flex: 1;
      padding: 1rem;
      font-size: 1.05rem;
      font-weight: 700;
      border: 2px solid var(--rule);
      border-radius: var(--radius);
      cursor: pointer;
      background: var(--bg2);
      color: var(--ink);
      transition: all 0.3s ease;
      font-family: var(--font);
    }
    .answer-btn.yes:hover {
      border-color: var(--accent3);
      background: rgba(6,214,160,0.1);
      color: var(--accent3);
    }
    .answer-btn.no:hover {
      border-color: var(--accent4);
      background: rgba(239,71,111,0.1);
      color: var(--accent4);
    }
    .answer-btn.yes.selected {
      border-color: var(--accent3);
      background: rgba(6,214,160,0.2);
      color: var(--accent3);
      box-shadow: 0 0 12px rgba(6,214,160,0.2);
    }
    .answer-btn.no.selected {
      border-color: var(--accent4);
      background: rgba(239,71,111,0.2);
      color: var(--accent4);
      box-shadow: 0 0 12px rgba(239,71,111,0.2);
    }

    /* === Result Panel === */
    .result-panel {
      display: none;
      animation: fadeSlideIn 0.5s ease;
    }
    .result-panel.active {
      display: block;
    }
    .result-verdict {
      text-align: center;
      padding: 3rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 2rem;
    }
    .result-verdict.leave {
      background: linear-gradient(135deg, rgba(239,71,111,0.1), rgba(255,107,53,0.05));
      border: 1px solid rgba(239,71,111,0.3);
    }
    .result-verdict.stay {
      background: linear-gradient(135deg, rgba(6,214,160,0.1), rgba(255,209,102,0.05));
      border: 1px solid rgba(6,214,160,0.3);
    }
    .verdict-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .verdict-text {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 0.5rem;
    }
    .verdict-text.leave {
      background: linear-gradient(135deg, var(--accent4), #ff6b8a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .verdict-text.stay {
      background: linear-gradient(135deg, var(--accent3), #34e8b5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .verdict-score {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--accent2);
      margin: 1rem 0;
    }
    .verdict-score span {
      font-size: 1.2rem;
      color: var(--muted);
      font-weight: 400;
    }

    /* === Job Type Card === */
    .job-type-card {
      background: var(--bg3);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .job-type-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .job-type-name {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    .job-type-comment {
      font-size: 1rem;
      color: var(--ink);
      line-height: 1.8;
      padding: 1rem;
      background: var(--bg2);
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }

    /* === Dimension Breakdown === */
    .dim-breakdown {
      margin-top: 1.5rem;
    }
    .dim-breakdown-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--ink);
    }
    .dim-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      background: var(--bg2);
      border-radius: 8px;
      border: 1px solid var(--rule);
    }
    .dim-row-label {
      width: 80px;
      font-size: 0.85rem;
      font-weight: 600;
      flex-shrink: 0;
    }
    .dim-row-bar {
      flex: 1;
      height: 8px;
      background: var(--bg3);
      border-radius: 4px;
      overflow: hidden;
    }
    .dim-row-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1s ease;
    }
    .dim-row-score {
      width: 60px;
      text-align: right;
      font-size: 0.9rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .dim-pass {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .dim-pass.pass { background: rgba(6,214,160,0.15); color: var(--accent3); }
    .dim-pass.fail { background: rgba(239,71,111,0.15); color: var(--accent4); }

    /* === Retake Button === */
    .retake-btn {
      display: block;
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      border: 2px solid var(--rule);
      border-radius: var(--radius);
      cursor: pointer;
      background: var(--bg2);
      color: var(--ink);
      transition: all 0.3s ease;
      margin-top: 1.5rem;
      font-family: var(--font);
    }
    .retake-btn:hover {
      border-color: var(--accent);
      background: rgba(255,107,53,0.1);
      color: var(--accent);
    }

    /* === Start Assessment Area === */
    .assess-start {
      text-align: center;
      padding: 3rem 1rem;
    }
    .assess-start .start-desc {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .assess-start .feature-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .feature-tag {
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      background: var(--bg3);
      border: 1px solid var(--rule);
      color: var(--muted);
    }

    /* ==============================
       MODULE 3: Tips / Experience
    ============================== */
    .tips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .tip-card {
      background: var(--bg3);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tip-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .tip-card .tip-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }
    .tip-card .tip-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .tip-card .tip-preview {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .tip-card .tip-expand-icon {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.75rem;
    }

    /* === Tip Modal === */
    .tip-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .tip-modal-overlay.active {
      display: flex;
    }
    .tip-modal {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .tip-modal .modal-close {
      float: right;
      width: 36px;
      height: 36px;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: var(--bg3);
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .tip-modal .modal-close:hover {
      border-color: var(--accent4);
      color: var(--accent4);
    }
    .tip-modal h3 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
    }
    .tip-modal .modal-content {
      margin-top: 1.5rem;
    }
    .tip-modal .tip-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--rule);
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }
    .tip-modal .tip-item:last-child {
      border-bottom: none;
    }
    .tip-modal .tip-bullet {
      color: var(--accent2);
      font-weight: 700;
      flex-shrink: 0;
      width: 24px;
    }
    .tip-modal .tip-item-text {
      color: var(--ink);
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .tip-modal .tip-warning {
      color: var(--accent4);
      font-weight: 600;
    }

    /* === Responsive === */
    @media (max-width: 600px) {
      .site-header h1 { font-size: 2rem; }
      .gavel-icon { font-size: 2.5rem; }
      .tab-btn { font-size: 0.85rem; padding: 0.6rem 0.3rem; }
      .draw-card { width: 160px; height: 240px; }
      .answer-btns { flex-direction: column; }
      .tips-grid { grid-template-columns: 1fr; }
      .verdict-text { font-size: 1.6rem; }
      .verdict-score { font-size: 2.5rem; }
      .module-card { padding: 1.25rem; }
    }

    /* === Scrollbar === */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* === Shine animation for draw === */
    @keyframes shine {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    .shine-effect {
      position: relative;
      overflow: hidden;
    }
    .shine-effect::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      animation: shine 3s infinite;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <span class="gavel-icon">⚖️</span>
    <h1>岗位判官</h1>
    <div class="subtitle">你的职场决策顾问</div>
  </header>

  <div class="container">
    <!-- Tab Navigation -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="draw" onclick="switchTab('draw')">🎲 随机抽签</button>
      <button class="tab-btn" data-tab="assess" onclick="switchTab('assess')">📋 岗位测评</button>
      <button class="tab-btn" data-tab="tips" onclick="switchTab('tips')">📖 经验贴</button>
    </nav>

    <!-- ===== TAB 1: Random Draw ===== -->
    <div class="tab-panel active" id="panel-draw">
      <div class="module-card">

    // ==========================
    // TAB SWITCHING
    // ==========================
    function switchTab(tabName) {
      // Reset states when leaving tabs
      const activeTab = document.querySelector('.tab-btn.active').dataset.tab;

      // If leaving draw tab, reset draw card to front
      if (activeTab === 'draw' && tabName !== 'draw') {
        resetDraw();
      }
      // If leaving assess tab, reset assessment to start screen
      if (activeTab === 'assess' && tabName !== 'assess') {
        resetAssess();
      }

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`.tab-btn[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById(`panel-${tabName}`).classList.add('active');
    }

    function resetDraw() {
      const card = document.getElementById('drawCard');
      const back = document.getElementById('drawBack');
      card.classList.remove('flipped');
      card.style.transform = '';
      back.innerHTML = '';
      drawAnimating = false;
      document.getElementById('drawBtn').disabled = false;
    }

    function resetAssess() {
      currentQ = 0;
      answers = {};
      document.getElementById('assessStart').style.display = 'block';
      document.getElementById('assessQuestions').style.display = 'none';
      document.getElementById('assessResult').classList.remove('active');
    }

    // ==========================
    // MODULE 1: RANDOM DRAW
    // ==========================
    let drawAnimating = false;
    function flipCard() {
      if (drawAnimating) return;
      doDraw();
    }

    function doDraw() {
      if (drawAnimating) return;
      drawAnimating = true;
      const card = document.getElementById('drawCard');
      const back = document.getElementById('drawBack');
      const btn = document.getElementById('drawBtn');
      const isFlipped = card.classList.contains('flipped');

      btn.disabled = true;

      // Step 1: If already flipped, flip back to front first
      if (isFlipped) {
        card.classList.remove('flipped');
        // Wait for flip-back animation (0.8s) before shaking
        setTimeout(startShake, 850);
      } else {
        startShake();
      }

      function startShake() {
        // Step 2: Shaking animation
        let shakeCount = 0;
        const shakeInterval = setInterval(() => {
          card.style.transform = `translateX(${(Math.random()-0.5)*12}px) rotate(${(Math.random()-0.5)*4}deg)`;
          shakeCount++;
          if (shakeCount > 18) {
            clearInterval(shakeInterval);
            card.style.transform = '';

            // Step 3: Generate NEW result
            const isLeave = Math.random() < 0.5;
            if (isLeave) {
              back.innerHTML = `
                <div class="result-icon">🏃</div>
                <div class="result-text leave">离 职</div>
                <div class="result-desc">判官建议：收拾东西，赶紧跑</div>
              `;
            } else {
              back.innerHTML = `
                <div class="result-icon">🛡️</div>
                <div class="result-text stay">不 离 职</div>
                <div class="result-desc">判官建议：苟住，先观察观察</div>
              `;
            }

            // Step 4: Flip to show result
            setTimeout(() => {
              card.classList.add('flipped');
              btn.disabled = false;
              drawAnimating = false;
            }, 150);
          }
        }, 55);
      }
    }

    // ==========================
    // MODULE 2: ASSESSMENT
    // ==========================
    let currentQ = 0;
    let answers = {};

    function startAssess() {
      currentQ = 0;
      answers = {};
      document.getElementById('assessStart').style.display = 'none';
      document.getElementById('assessQuestions').style.display = 'block';
      document.getElementById('assessResult').classList.remove('active');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQ];
      const dim = dimConfig[q.dim];

      document.getElementById('progressFill').style.width = `${((currentQ + 1) / questions.length) * 100}%`;
      document.getElementById('progressText').textContent = `${currentQ + 1} / ${questions.length}`;
      document.getElementById('questionNumber').textContent = `第 ${q.id} 题`;
      document.getElementById('questionText').textContent = q.text;

      const badge = document.getElementById('dimBadge');
      badge.className = `dimension-badge ${dim.cssClass}`;
      badge.textContent = dim.name;

      // Reset button states
      document.querySelectorAll('.answer-btn').forEach(b => b.classList.remove('selected'));

      // Animate card
      const card = document.getElementById('questionCard');
      card.style.animation = 'none';
      card.offsetHeight; // trigger reflow
      card.style.animation = 'fadeSlideIn 0.4s ease';
    }

    function answerQuestion(isYes) {
      const q = questions[currentQ];
      answers[q.id] = isYes;

      // Visual feedback
      document.querySelectorAll('.answer-btn').forEach(b => b.classList.remove('selected'));
      if (isYes) {
        document.querySelector('.answer-btn.yes').classList.add('selected');
      } else {
        document.querySelector('.answer-btn.no').classList.add('selected');
      }

      setTimeout(() => {
        currentQ++;
        if (currentQ < questions.length) {
          showQuestion();
        } else {
          showResult();
        }
      }, 300);
    }

    function showResult() {
      document.getElementById('assessQuestions').style.display = 'none';

      // Calculate scores
      const dimScores = {};
      dimOrder.forEach(d => dimScores[d] = 0);
      questions.forEach(q => {
        if (answers[q.id]) dimScores[q.dim] += q.score;
      });

      const totalScore = Object.values(dimScores).reduce((a,b) => a+b, 0);
      const isLeave = totalScore <= 60;

      // Verdict
      const verdict = document.getElementById('resultVerdict');
      const verdictIcon = document.getElementById('verdictIcon');
      const verdictText = document.getElementById('verdictText');
      const verdictScore = document.getElementById('verdictScore');

      verdict.className = `result-verdict ${isLeave ? 'leave' : 'stay'}`;
      verdictIcon.textContent = isLeave ? '🚨' : '🎉';
      verdictText.className = `verdict-text ${isLeave ? 'leave' : 'stay'}`;
      verdictText.textContent = isLeave ? '建议离职' : '建议不离职';
      verdictScore.innerHTML = `${totalScore} <span>/ 100</span>`;

      // Job type
      const key = dimOrder.map(d => dimScores[d] >= dimConfig[d].pass ? '1' : '0').join('');
      const job = jobTypes[key] || { name:'未知岗位类型', comment:'数据异常，请重新测评' };
      document.getElementById('jobTypeName').textContent = job.name;
      document.getElementById('jobTypeComment').textContent = job.comment;

      // Dimension breakdown
      const breakdownBody = document.getElementById('dimBreakdownBody');
      breakdownBody.innerHTML = '';
      dimOrder.forEach(d => {
        const dim = dimConfig[d];
        const score = dimScores[d];
        const pct = (score / dim.total) * 100;
        const pass = score >= dim.pass;
        breakdownBody.innerHTML += `
          <div class="dim-row">
            <div class="dim-row-label" style="color:${dim.color}">${dim.name}</div>
            <div class="dim-row-bar">
              <div class="dim-row-fill" style="width:${pct}%;background:${dim.color}"></div>
            </div>
            <div class="dim-row-score">${score}/${dim.total}</div>
            <div class="dim-pass ${pass ? 'pass' : 'fail'}">${pass ? '及格' : '不及格'}</div>
          </div>
        `;
      });

      // Show result
      document.getElementById('assessResult').classList.add('active');
    }

    function retakeAssess() {
      document.getElementById('assessResult').classList.remove('active');
      document.getElementById('assessStart').style.display = 'block';
    }

    // ==========================
    // MODULE 3: TIPS
    // ==========================
    function renderTips() {
      const grid = document.getElementById('tipsGrid');
      grid.innerHTML = '';
      tipsData.forEach((tip, idx) => {
        grid.innerHTML += `
          <div class="tip-card" onclick="openTipModal(${idx})">
            <div class="tip-icon">${tip.icon}</div>
            <div class="tip-title">${tip.title}</div>
            <div class="tip-preview">${tip.preview}</div>
            <div class="tip-expand-icon">点击查看详情 →</div>
          </div>
        `;
      });
    }

    function openTipModal(idx) {
      const tip = tipsData[idx];
      document.getElementById('modalTitle').textContent = tip.title;
      const content = document.getElementById('modalContent');
      content.innerHTML = '';
      tip.items.forEach((item, i) => {
        content.innerHTML += `
          <div class="tip-item">
            <div class="tip-bullet">${item.type === 'warning' ? '⚠️' : '✅'}</div>
            <div class="tip-item-text">${item.text}</div>
          </div>
        `;
      });
      document.getElementById('tipModalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeTipModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('tipModalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    // ==========================
    // INIT
    // ==========================
    renderTips();
  </script>
</body>
</html>
