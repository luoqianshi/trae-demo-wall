      { id: 'pdd_201', title: '三只松鼠每日坚果750g', platform: 'pdd', price: 89, sales: 400000, rating: 0.94, image: 'https://picsum.photos/seed/nuts/200/200', url: 'https://mobile.yangkeduo.com/goods.html?goods_id=xxx' },
      { id: 'jd_201', title: '良品铺子每日坚果750g', platform: 'jd', price: 159, sales: 200000, rating: 0.97, image: 'https://picsum.photos/seed/nuts/200/200', url: 'https://union-click.jd.com/jdc?e=xxx' },
      { id: 'tb_301', title: '全棉时代一次性洗脸巾 纯棉柔巾 100抽*6包', platform: 'taobao', price: 89, sales: 800000, rating: 0.98, image: 'https://picsum.photos/seed/tissue/200/200', url: 'https://s.click.taobao.com/t?e=m=2&s=xxx' },
      { id: 'pdd_301', title: '全棉时代洗脸巾100抽*6包', platform: 'pdd', price: 59, sales: 600000, rating: 0.95, image: 'https://picsum.photos/seed/tissue/200/200', url: 'https://mobile.yangkeduo.com/goods.html?goods_id=xxx' },
    ];

    const keywordMap = {
      '耳机': ['耳机', 'airpods', '蓝牙', '降噪', 'freebuds', '索尼'],
      '无线耳机': ['耳机', 'airpods', '蓝牙', '降噪', 'freebuds', '索尼', '无线'],
      '充电宝': ['充电宝', '移动电源', '罗马仕', '小米'],
      '零食': ['零食', '坚果', '三只松鼠', '良品铺子'],
      '家居': ['家居', '洗脸巾', '全棉时代'],
      '防晒霜': ['防晒'],
      '运动鞋': ['运动鞋', '鞋'],
      '保温杯': ['保温杯'],
      '数据线': ['数据线', '充电线']
    };

    // ==================== AI Algorithm ====================
    function calculateAIScore(goods) {
      if (goods.sales < 1000) return -1;
      if (goods.rating < 0.90) return -1;
      if (goods.price < 1 || goods.price > 100000) return -1;

      const maxSales = 1000000;
      const salesScore = Math.min(Math.log10(goods.sales) / Math.log10(maxSales), 1) * 60;
      const priceScore = Math.max(0, (1 - goods.price / 5000)) * 20;
      const ratingScore = (goods.rating - 0.90) / 0.10 * 20;

      return salesScore + priceScore + ratingScore;
    }

    function getAITags(goods, allGoods) {
      const tags = [];
      const sameCategory = allGoods.filter(g =>
        g.title.includes(goods.title.split(' ')[0]) ||
        g.title.includes(goods.title.split(/[\s\d]/)[0])
      );
      if (sameCategory.length === 0) return tags;

      const avgPrice = sameCategory.reduce((sum, g) => sum + g.price, 0) / sameCategory.length;
      const maxSales = Math.max(...sameCategory.map(g => g.sales));
      const maxRating = Math.max(...sameCategory.map(g => g.rating));

      const scores = sameCategory.map(g => ({ id: g.id, score: calculateAIScore(g) }));
      scores.sort((a, b) => b.score - a.score);
      const topThreshold = scores[Math.floor(scores.length * 0.2)]?.score || 0;

      if (calculateAIScore(goods) >= topThreshold && calculateAIScore(goods) > 0) {
        tags.push('AI优选');
      }
      if (goods.price < avgPrice * 0.9 && goods.sales > maxSales * 0.3) {
        tags.push('低价高销');
      }
      if (goods.rating >= maxRating - 0.01) {
        tags.push('口碑好物');
      }
      return tags;
    }

    function formatSales(num) {
      if (num >= 10000) return (num / 10000).toFixed(1) + '万+';
      return num + '+';
    }

    // ==================== Search Logic ====================
    function searchGoods(keyword) {
      if (!keyword || keyword.trim() === '') return [];

      const kw = keyword.toLowerCase().trim();
      let matchedGoods = mockGoodsDB.filter(goods => {
        const title = goods.title.toLowerCase();
        if (title.includes(kw)) return true;
        for (const [key, synonyms] of Object.entries(keywordMap)) {
          if (key.includes(kw) || kw.includes(key)) {
            return synonyms.some(s => title.includes(s));
          }
        }
        return false;
      });

      // Deduplicate: keep lowest price for same title
      const titleMap = new Map();
      matchedGoods.forEach(goods => {
        const key = goods.title.split(' ')[0];
        if (!titleMap.has(key) || titleMap.get(key).price > goods.price) {
          titleMap.set(key, goods);
        }
      });
      matchedGoods = Array.from(titleMap.values());

      // AI scoring
      const scoredGoods = matchedGoods.map(goods => {
        const score = calculateAIScore(goods);
        const aiTags = score > 0 ? getAITags(goods, matchedGoods) : [];
        return { ...goods, aiScore: score, aiTags };
      }).filter(g => g.aiScore > 0);

      scoredGoods.sort((a, b) => b.aiScore - a.aiScore);
      return scoredGoods;
    }

    // ==================== UI State ====================
    let currentKeyword = '';
    let currentSort = 'ai';
    let goodsList = [];

    // ==================== DOM Elements ====================
    const homeSearchInput = document.getElementById('home-search-input');
    const homeSearchBtn = document.getElementById('home-search-btn');
    const hotTags = document.getElementById('hot-tags');
    const backBtn = document.getElementById('back-btn');
    const searchInput = document.getElementById('search-input');
    const searchContent = document.getElementById('search-content');
    const toast = document.getElementById('toast');

    // ==================== Navigation ====================
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ==================== Home Page Events ====================
    homeSearchBtn.addEventListener('click', () => {
      const keyword = homeSearchInput.value.trim();
      if (!keyword) { showToast('请输入商品名称'); return; }
      goSearch(keyword);
    });

    homeSearchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const keyword = homeSearchInput.value.trim();
        if (!keyword) { showToast('请输入商品名称'); return; }
        goSearch(keyword);
      }
    });

    hotTags.addEventListener('click', (e) => {
      if (e.target.classList.contains('hot-tag')) {
        const keyword = e.target.dataset.keyword;
        homeSearchInput.value = keyword;
        goSearch(keyword);
      }
    });

    // ==================== Search Page ====================
    function goSearch(keyword) {
      currentKeyword = keyword;
      currentSort = 'ai';
      searchInput.value = keyword;
      showPage('page-search');
      document.querySelectorAll('.filter-item').forEach(f => f.classList.remove('active'));
      document.querySelector('.filter-item[data-sort="ai"]').classList.add('active');
      performSearch();
    }

    function performSearch() {
      searchContent.innerHTML = `
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <div class="loading-title">AI正在全网甄选</div>
          <div class="loading-desc">正在对比淘宝、京东、拼多多<br>高性价比好物马上呈现...</div>
        </div>
      `;

      // Simulate network delay
      setTimeout(() => {
        goodsList = searchGoods(currentKeyword);
        renderResults();
      }, 800);
    }

    function renderResults() {
      // Sort
      let sorted = [...goodsList];
      switch (currentSort) {
        case 'price_asc': sorted.sort((a, b) => a.price - b.price); break;
        case 'price_desc': sorted.sort((a, b) => b.price - a.price); break;
        case 'sales': sorted.sort((a, b) => b.sales - a.sales); break;
        case 'rating': sorted.sort((a, b) => b.rating - a.rating); break;
        default: sorted.sort((a, b) => b.aiScore - a.aiScore); break;
      }

      if (sorted.length === 0) {
        searchContent.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#x1F50D;</div>
            <div class="empty-title">暂无相关好物</div>
            <div class="empty-desc">换个关键词试试吧</div>
            <button class="empty-btn" onclick="goBack()">重新搜索</button>
          </div>
        `;
        return;
      }

      const platformNameMap = { taobao: '淘宝', jd: '京东', pdd: '拼多多', vip: '唯品会' };

      let html = `<div class="result-count">共找到 ${sorted.length} 件好物</div>`;
      html += '<div class="goods-list">';

      sorted.forEach(item => {
        const aiTagsHtml = item.aiTags.map(tag => {
          let cls = 'ai-hot';
          if (tag === 'AI优选') cls = 'ai-best';
          if (tag === '低价高销') cls = 'ai-value';
          return `<span class="ai-tag ${cls}">${tag}</span>`;
        }).join('');

        html += `
          <div class="goods-card">
            <img class="goods-img" src="${item.image}" alt="" loading="lazy" onerror="this.src='https://via.placeholder.com/200'">
            <div class="goods-info">
              <div class="goods-title">${item.title}</div>
              <div class="goods-tags">
                <span class="platform-tag platform-${item.platform}">${platformNameMap[item.platform] || item.platform}</span>
                ${aiTagsHtml}
              </div>
              <div class="goods-meta">
                <span class="goods-price"><span class="price-symbol">&yen;</span>${item.price}</span>
                <span class="goods-sales">销量 ${formatSales(item.sales)}</span>
                <span class="goods-rating">&#x2B50; ${Math.round(item.rating * 100)}%</span>
              </div>
            </div>
            <button class="buy-btn" data-url="${item.url}">去购买</button>
          </div>
        `;
      });

      html += `
        <div class="ad-banner">
          <span class="ad-text">&#x1F3AF; 广告位</span>
          <span class="ad-label">广告</span>
        </div>
        <div class="no-more">已经到底了</div>
      `;
      html += '</div>';

      searchContent.innerHTML = html;

      // Attach buy button events
      searchContent.querySelectorAll('.buy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const url = btn.dataset.url;
          window.open(url, '_blank');
        });
      });
    }

    // ==================== Sort Events ====================
    document.querySelectorAll('.filter-item').forEach(item => {
      item.addEventListener('click', () => {
        const sort = item.dataset.sort;
        if (sort === currentSort) return;
        currentSort = sort;
        document.querySelectorAll('.filter-item').forEach(f => f.classList.remove('active'));
        item.classList.add('active');
        renderResults();
      });
    });

    // ==================== Back Button ====================
    backBtn.addEventListener('click', goBack);

    function goBack() {
      showPage('page-home');
      homeSearchInput.value = '';
    }

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const keyword = searchInput.value.trim();
        if (!keyword) { showToast('请输入商品名称'); return; }
        currentKeyword = keyword;
        currentSort = 'ai';
        document.querySelectorAll('.filter-item').forEach(f => f.classList.remove('active'));
        document.querySelector('.filter-item[data-sort="ai"]').classList.add('active');
        performSearch();
      }
    });

    // Make goBack globally accessible for empty state button
    window.goBack = goBack;
  </script>
</body>
</html>
