<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>援力通 2.0 - 民间救援队伍数字化管理平台 · 完整功能 Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1e40af;--primary-light:#3b82f6;--primary-dark:#1e3a8a;--accent:#f59e0b;--danger:#ef4444;--success:#10b981;--warning:#f59e0b;--purple:#8b5cf6;--cyan:#06b6d4;--pink:#ec4899;--bg:#0a0f1e;--bg2:#0f172a;--card:#1e293b;--hover:#334155;--border:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;font-size:14px}
.topbar{height:56px;background:linear-gradient(135deg,#0c1e3e,#1e40af);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:relative;z-index:200;border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#d97706);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 8px rgba(245,158,11,.4)}
.brand{font-size:17px;font-weight:700;letter-spacing:.5px}
.brand-sub{font-size:10px;color:var(--text2);margin-top:-2px}
.platform-switcher{display:flex;gap:2px;background:rgba(0,0,0,.3);border-radius:10px;padding:3px}
.platform-btn{padding:7px 14px;border-radius:8px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:.3s;display:flex;align-items:center;gap:6px}
.platform-btn:hover{color:var(--text)}
.platform-btn.active{background:var(--primary-light);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.4)}
.user-area{display:flex;align-items:center;gap:14px}
.notif{position:relative;cursor:pointer;font-size:18px;color:var(--text2);transition:.3s}
.notif:hover{color:var(--text)}
.notif-dot{position:absolute;top:-4px;right:-6px;background:var(--danger);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center;font-weight:700}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#d97706);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.user-name{font-size:12px;font-weight:600}
.user-role{font-size:10px;color:var(--text2)}
.main{display:flex;height:calc(100vh - 56px)}
.sidebar{width:230px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--hover);border-radius:3px}
.nav-section{padding:10px 0}
.nav-section-title{padding:8px 20px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.nav-item{padding:9px 20px;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:10px;color:var(--text2);border-left:3px solid transparent;font-size:13px}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(59,130,246,.15),transparent);color:var(--primary-light);border-left-color:var(--primary-light);font-weight:600}
.nav-icon{font-size:16px;width:18px;text-align:center}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700}
.content{flex:1;overflow-y:auto;padding:18px}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:var(--hover);border-radius:4px}
.page{display:none;animation:fadeIn .3s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.page-subtitle{font-size:12px;color:var(--text2);margin-top:2px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;border:none;font-weight:600;cursor:pointer;transition:.25s;font-size:13px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:var(--primary-light);color:#fff}
.btn-primary:hover{background:var(--primary);transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:var(--hover);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#000}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);transition:.3s}
.card:hover{border-color:var(--primary-light)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stat-card{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);transition:.3s;cursor:pointer;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary-light)}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.3);border-color:var(--primary-light)}
.stat-card.danger::before{background:var(--danger)}
.stat-card.success::before{background:var(--success)}
.stat-card.warning::before{background:var(--warning)}
.stat-card.purple::before{background:var(--purple)}
.stat-card.cyan::before{background:var(--cyan)}
.stat-label{color:var(--text2);font-size:12px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;color:#fff}
.stat-trend{font-size:11px;margin-top:4px}
.trend-up{color:var(--success)}
.trend-down{color:var(--danger)}
.trend-warn{color:var(--warning)}
.table-wrap{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{background:var(--hover);padding:10px 12px;text-align:left;font-size:12px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover td{background:var(--hover)}
tr:last-child td{border-bottom:none}
.badge{padding:3px 9px;border-radius:10px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.badge-urgent{background:rgba(239,68,68,.2);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.badge-progress{background:rgba(59,130,246,.2);color:var(--primary-light);border:1px solid rgba(59,130,246,.3)}
.badge-done{background:rgba(16,185,129,.2);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.badge-pending{background:rgba(245,158,11,.2);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
.badge-gray{background:rgba(148,163,184,.15);color:var(--text2);border:1px solid rgba(148,163,184,.2)}
.badge-purple{background:rgba(139,92,246,.2);color:var(--purple);border:1px solid rgba(139,92,246,.3)}
.badge-cyan{background:rgba(6,182,212,.2);color:var(--cyan);border:1px solid rgba(6,182,212,.3)}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:5px 12px;border-radius:16px;background:var(--card);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:.25s;font-size:12px}
.filter-btn:hover{border-color:var(--primary-light);color:var(--text)}
.filter-btn.active{background:var(--primary-light);color:#fff;border-color:var(--primary-light)}
.progress-bar{height:6px;background:var(--hover);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary-light),var(--success));transition:width .6s;border-radius:3px}
.progress-fill.danger{background:linear-gradient(90deg,var(--danger),var(--accent))}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.item-card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);transition:.3s;cursor:pointer}
.item-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.3);border-color:var(--primary-light)}
.map-box{background:var(--card);border-radius:12px;height:480px;position:relative;overflow:hidden;border:1px solid var(--border)}
.map-bg{position:absolute;inset:0;background:radial-gradient(circle at 25% 35%,rgba(59,130,246,.15),transparent 50%),radial-gradient(circle at 75% 65%,rgba(245,158,11,.1),transparent 50%),linear-gradient(135deg,#0a0f1e,#1e293b)}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.06) 1px,transparent 1px);background-size:40px 40px}
.map-marker{position:absolute;width:32px;height:32px;border-radius:50%;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:10;animation:pulse 2s infinite}
.map-marker:hover{transform:scale(1.4);z-index:20}
.m-team{background:var(--primary-light);box-shadow:0 0 12px var(--primary-light)}
.m-task{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.m-sos{background:var(--danger);box-shadow:0 0 12px var(--danger);animation:pulseD 1s infinite}
.m-drone{background:var(--purple);box-shadow:0 0 12px var(--purple)}
.m-shelter{background:var(--success);box-shadow:0 0 12px var(--success)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.8}}
@keyframes pulseD{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.5}}
.map-legend{position:absolute;bottom:14px;right:14px;background:rgba(15,23,42,.95);padding:12px;border-radius:8px;border:1px solid var(--border);font-size:11px}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.map-ctrls{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:5px}
.map-ctrl{width:30px;height:30px;background:var(--card);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:.3s}
.map-ctrl:hover{background:var(--hover);border-color:var(--primary-light)}
.map-info{position:absolute;top:14px;left:14px;background:rgba(15,23,42,.95);padding:10px 14px;border-radius:8px;border:1px solid var(--border);font-size:12px}
.phone-frame{width:340px;height:680px;background:#111;border-radius:32px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);flex-shrink:0;margin:0 auto}
.phone-screen{background:var(--bg);border-radius:24px;height:100%;overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone-status{height:30px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:10px;color:var(--text2)}
.phone-nav{height:42px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#fff;position:relative}
.phone-nav .back{position:absolute;left:12px;font-size:18px;cursor:pointer}
.phone-body{flex:1;overflow-y:auto;padding:12px}
.phone-tabbar{height:48px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text2);cursor:pointer;transition:.3s;padding:4px}
.tab.active{color:var(--primary-light)}
.tab-icon{font-size:16px}
.mini-card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid var(--border)}
.mini-title{font-size:13px;font-weight:600;margin-bottom:5px}
.mini-info{font-size:11px;color:var(--text2);line-height:1.6}
.mini-btn{width:100%;padding:9px;background:var(--primary-light);color:#fff;border:none;border-radius:7px;font-weight:600;cursor:pointer;transition:.3s;font-size:12px;margin-top:8px}
.mini-btn:hover{background:var(--primary)}
.mini-btn.danger{background:var(--danger)}
.mini-btn.success{background:var(--success)}
.mini-btn.secondary{background:var(--hover);color:var(--text)}
.role-tabs{display:flex;gap:4px;margin-bottom:14px;justify-content:center}
.role-tab{padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:.3s;font-size:12px;font-weight:600}
.role-tab:hover{color:var(--text)}
.role-tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
.phone-layout{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.phone-desc{max-width:340px;flex:1;min-width:280px}
.phone-desc h3{font-size:16px;margin-bottom:10px}
.phone-desc p{color:var(--text2);font-size:13px;line-height:1.7;margin-bottom:12px}
.feature-list{background:var(--card);border-radius:10px;padding:12px;border:1px solid var(--border);margin-bottom:10px}
.feature-list h4{font-size:13px;margin-bottom:6px;font-weight:600}
.feature-list ul{list-style:none;font-size:12px;color:var(--text2);line-height:1.8}
.feature-list li::before{content:'✓ ';color:var(--success)}
.flow-container{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border);margin-bottom:14px}
.flow-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.flow-steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow-node{background:var(--bg2);border:2px solid var(--primary-light);border-radius:10px;padding:12px;text-align:center;min-width:140px;transition:.3s}
.flow-node:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.flow-node-title{font-size:12px;font-weight:600;margin-bottom:3px}
.flow-node-desc{font-size:10px;color:var(--text2);line-height:1.4}
.flow-arrow{font-size:22px;color:var(--primary-light);animation:flowPulse 1.5s infinite}
@keyframes flowPulse{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:.4;transform:translateX(3px)}}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal.show{display:flex}
.modal-box{background:var(--card);border-radius:14px;padding:24px;max-width:600px;width:92%;max-height:85vh;overflow-y:auto;border:1px solid var(--border);animation:modalIn .3s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
@keyframes modalIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:700}
.modal-close{width:28px;height:28px;border-radius:6px;background:var(--hover);border:none;color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.3s}
.modal-close:hover{background:var(--danger);color:#fff}
.modal-body{color:var(--text2);line-height:1.7;font-size:13px;margin-bottom:16px}
.modal-body p{margin-bottom:6px}
.modal-body ul{margin-left:16px;margin-top:4px}
.modal-body li{margin-bottom:3px}
.modal-body strong{color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--border)}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--text)}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 12px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;transition:.3s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 2px rgba(59,130,246,.2)}
.form-textarea{resize:vertical;min-height:70px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.toast{position:fixed;top:70px;right:16px;background:var(--card);padding:12px 18px;border-radius:8px;border-left:3px solid var(--success);display:none;animation:slideIn .3s;z-index:3000;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:300px}
.toast.show{display:block}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.timeline{position:relative;padding-left:18px;margin-top:8px}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:12px}
.timeline-item::before{content:'';position:absolute;left:-15px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--primary-light);border:2px solid var(--card)}
.timeline-item.done::before{background:var(--success)}
.timeline-time{font-size:10px;color:var(--text3)}
.timeline-content{font-size:12px;color:var(--text)}
.members{display:flex}
.member-av{width:24px;height:24px;border-radius:50%;background:var(--primary-light);border:2px solid var(--card);margin-left:-5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.member-av:first-child{margin-left:0}
.member-more{background:var(--hover);color:var(--text2)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.icon-item{background:var(--card);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;transition:.3s;border:1px solid var(--border)}
.icon-item:hover{transform:translateY(-2px);border-color:var(--primary-light);background:var(--hover)}
.icon-emoji{font-size:24px;margin-bottom:4px}
.icon-text{font-size:11px;color:var(--text2)}
@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{width:180px}.phone-layout{flex-direction:column}}
.btn-lg{padding:12px 28px;font-size:15px}
/* 三端协同分屏 */
.collab-split{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.collab-split{grid-template-columns:1fr}}
.collab-panel{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.collab-header{padding:12px 14px;color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;font-size:13px}
.collab-tag{margin-left:auto;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500}
.collab-body{padding:12px;min-height:200px}
.collab-event:hover{background:var(--hover)!important}
/* 详情面板 */
.detail-drawer{position:fixed;right:0;top:56px;bottom:0;width:480px;background:var(--bg2);border-left:1px solid var(--border);z-index:500;transform:translateX(100%);transition:transform .3s;overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,.3)}
.detail-drawer.show{transform:translateX(0)}
.detail-header{padding:16px 20px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.detail-body{padding:16px 20px}
/* 表格行可点击 */
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(59,130,246,.08)}
/* 演示中心入口横幅 */
.demo-banner{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(139,92,246,.1));border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.demo-banner-icon{font-size:32px}
.demo-banner-title{font-weight:700;font-size:15px;color:var(--accent)}
.demo-banner-desc{font-size:12px;color:var(--text2);margin-top:2px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">🚨</div>
    <div>
      <div class="brand">援力通 2.0</div>
      <div class="brand-sub">民间救援队伍数字化管理平台</div>
    </div>
  </div>
  <div class="platform-switcher">
    <button class="platform-btn active" data-platform="web">🖥️ Web 管理后台</button>
    <button class="platform-btn" data-platform="mini">📱 微信小程序</button>
    <button class="platform-btn" data-platform="app">📲 Flutter APP</button>
  </div>
