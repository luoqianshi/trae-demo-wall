<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平静情绪 - 溪流隐去 | 听心</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <div class="mobile-shell" id="mobileShell">

    <!-- Ambient particles -->
    <div class="ambient-particles" id="ambientParticles"></div>

    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title"><span>听</span>心</h1>
      <div class="emotion-indicator" id="emotionIndicator">
        <div class="emotion-dot"></div>
        <span class="emotion-label">平静</span>
      </div>
    </header>

    <!-- Letter Area -->
    <section class="letter-container">
      <div class="letter-paper" id="letterPaper">
        <!-- Water overlays -->
        <div class="water-overlay" id="waterOverlay">
          <svg class="water-wave water-wave-1" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,60 C100,40 150,80 250,60 C350,40 400,80 500,60 C600,40 650,80 750,60 C850,40 900,80 1000,60 C1100,40 1150,80 1200,60 L1200,120 L0,120 Z" fill="rgba(126,184,160,0.18)"/>
          </svg>
          <svg class="water-wave water-wave-2" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,55 C120,75 180,35 300,55 C420,75 480,35 600,55 C720,75 780,35 900,55 C1020,75 1080,35 1200,55 L1200,120 L0,120 Z" fill="rgba(160,215,195,0.22)"/>
          </svg>
          <svg class="water-wave water-wave-3" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,65 C80,50 140,75 220,55 C320,38 380,72 480,58 C580,42 640,76 740,60 C840,44 900,78 1000,62 C1100,46 1160,74 1200,65 L1200,120 L0,120 Z" fill="rgba(106,168,150,0.15)"/>
          </svg>
          <div class="water-surface-shimmer"></div>
        </div>

        <!-- Ripple container -->
        <div class="ripple-container" id="rippleContainer"></div>

        <!-- Letter content -->
        <div class="letter-content font-body" id="letterContent">
        </div>
      </div>

      <!-- Completion message overlay -->
      <div class="complete-message" id="completeMessage">
        <svg class="complete-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 44C35.0457 44 44 35.0457 44 24C44 12.9543 35.0457 4 24 4C12.9543 4 4 12.9543 4 24C4 35.0457 12.9543 44 24 44Z" fill="rgba(126,184,160,0.1)" stroke="rgba(126,184,160,0.4)" stroke-width="1.5"/>
          <path d="M16 24L22 30L32 18" stroke="rgba(126,184,160,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="complete-text font-body">平静的日常已随溪流自然飘走</p>
        <p class="complete-subtext font-caption">此刻，心里很轻</p>
      </div>
    </section>

    <!-- CTA Area -->
    <div class="cta-area">
      <button class="cta-btn" id="releaseBtn" type="button">轻轻放下</button>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons" id="actionButtons">
      <button class="action-btn action-btn-secondary font-body" id="replayBtn">再看一次</button>
      <button class="action-btn action-btn-primary font-body" id="completeBtn">完成</button>
    </div>

  </div>

  <script>
    // ============================
    // Calm Release Animation Controller
    // ============================
    (function() {
      'use strict';

      const shell = document.getElementById('mobileShell');
      const letterPaper = document.getElementById('letterPaper');
      const letterContent = document.getElementById('letterContent');
      const waterOverlay = document.getElementById('waterOverlay');
      const rippleContainer = document.getElementById('rippleContainer');
      const completeMessage = document.getElementById('completeMessage');
      const emotionIndicator = document.getElementById('emotionIndicator');
      const releaseBtn = document.getElementById('releaseBtn');
      const replayBtn = document.getElementById('replayBtn');
      const completeBtn = document.getElementById('completeBtn');
      const actionButtons = document.getElementById('actionButtons');
      const ambientParticles = document.getElementById('ambientParticles');

      let isAnimating = false;
      let isComplete = false;
      let rippleInterval = null;

      // Initialize ambient particles
      function createAmbientParticles() {
        for (let i = 0; i < 6; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.style.left = (Math.random() * 100) + '%';
          particle.style.bottom = '-10px';
          particle.style.animationDuration = (8 + Math.random() * 12) + 's';
          particle.style.animationDelay = (Math.random() * 10) + 's';
          particle.style.width = (3 + Math.random() * 3) + 'px';
          particle.style.height = particle.style.width;
          ambientParticles.appendChild(particle);
        }
      }

      // Create a single ripple at random position within the letter
      function createRipple() {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        const x = 10 + Math.random() * 80;
        const y = 10 + Math.random() * 80;
        ripple.style.left = x + '%';
        ripple.style.top = y + '%';
        ripple.style.borderColor = 'rgba(126, 184, 160, ' + (0.15 + Math.random() * 0.15) + ')';
        rippleContainer.appendChild(ripple);

        // Remove after animation completes
        ripple.addEventListener('animationend', function() {
          ripple.remove();
        });
      }

      // Start ripple generation
      function startRipples() {
        rippleInterval = setInterval(createRipple, 600);
      }

      // Stop ripple generation
      function stopRipples() {
        if (rippleInterval) {
          clearInterval(rippleInterval);
          rippleInterval = null;
        }
      }

      // Main release animation sequence
      function startRelease() {
        if (isAnimating || isComplete) return;
        isAnimating = true;

        // Phase 1: Add sway and water (0s - 0.8s)
        shell.classList.add('animating');
        letterPaper.classList.add('swaying');

        setTimeout(function() {
          waterOverlay.classList.add('active');
          startRipples();
        }, 300);

        // Phase 2: Begin text fade and paper dissolve (0.8s - 4s)
        setTimeout(function() {
          letterContent.classList.add('fading');
          letterPaper.classList.add('dissolving');
        }, 800);

        // Phase 3: Hide emotion indicator (1.5s)
        setTimeout(function() {
          emotionIndicator.classList.add('hidden');
        }, 1500);

        // Phase 4: Stop ripples & show completion (4s)
        setTimeout(function() {
          stopRipples();
          waterOverlay.classList.remove('active');
        }, 4200);

        // Phase 5: Show complete message (4.5s)
        setTimeout(function() {
          shell.classList.remove('animating');
          shell.classList.add('complete');
          completeMessage.classList.add('visible');
          releaseBtn.classList.add('disabled');
          isAnimating = false;
          isComplete = true;

          // Show action buttons after a moment
          setTimeout(function() {
            actionButtons.style.display = 'flex';
          }, 800);
        }, 4500);
      }

      // Reset everything for replay
      function resetAnimation() {
        if (isAnimating) return;

        isComplete = false;

        // Remove all animation classes
        shell.classList.remove('animating', 'complete');
        letterPaper.classList.remove('swaying', 'dissolving');
        letterContent.classList.remove('fading');
        waterOverlay.classList.remove('active');
        completeMessage.classList.remove('visible');
        emotionIndicator.classList.remove('hidden');
        releaseBtn.classList.remove('disabled');
        actionButtons.style.display = 'none';

        // Clear any remaining ripples
        stopRipples();
        rippleContainer.innerHTML = '';

        // Force reflow to ensure animations can replay
        void letterPaper.offsetWidth;
      }

      // Event listeners
      releaseBtn.addEventListener('click', startRelease);
      replayBtn.addEventListener('click', resetAnimation);

      // Get URL parameters
      function getUrlParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      const recordId = getUrlParam('id');
      const content = getUrlParam('content');
      const autoplay = getUrlParam('autoplay');

      // Set letter content from URL param or use default
      if (content) {
        letterContent.textContent = content;
      } else {
        letterContent.textContent = '下午坐在窗边看书，阳光从纱帘缝隙里漏进来，猫咪蜷在脚边打盹。很普通的一天，但很安心。';
      }

      // Send message to parent when release is complete
      function notifyParentComplete() {
        if (window.parent && window.parent.postMessage) {
          window.parent.postMessage({ type: 'releaseComplete', id: recordId }, '*');
        }
      }

      completeBtn.addEventListener('click', notifyParentComplete);

      // Check if in iframe
      if (window.self !== window.top) {
        document.body.classList.add('in-iframe');
      }

      // Initialize
      createAmbientParticles();

      // 自动播放：来自"完成记录"或"重新释放"时自动触发释放动画
      if (autoplay === '1') {
        setTimeout(startRelease, 800);
      }

    })();
  </script>

    <style>
    /* ============================
       Base & Reset
       ============================ */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--color-bg);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 24px;
    }

    body.in-iframe {
      padding: 0;
      min-height: 100%;
      display: block;
    }

    /* Mobile container */
    .mobile-shell {
      width: 375px;
      min-height: 720px;
      background: var(--color-bg);
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 12px 48px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
      transition: background 2s ease;
    }

    body.in-iframe .mobile-shell {
      width: 100%;
      min-height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }

    .mobile-shell.animating {
      background: #eef5f2;
    }

    .mobile-shell.complete {
      background: var(--emotion-calm-bg);
    }

    /* ============================
       Header
       ============================ */
    .app-header {
      padding: 56px 24px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
      letter-spacing: -0.02em;
    }

    .app-title span {
      color: var(--emotion-calm);
    }

    /* ============================
       Emotion Indicator
       ============================ */
    .emotion-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--emotion-calm-bg);
      border-radius: var(--radius-full);
      transition: opacity 1.5s ease;
    }

    .emotion-indicator.hidden {
      opacity: 0;
    }

    .emotion-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emotion-calm);
      box-shadow: 0 0 8px var(--emotion-calm-glow);
    }

    .emotion-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--emotion-calm);
    }

    /* ============================
       Rice Paper Letter
       ============================ */
    .letter-container {
      padding: 20px 28px;
      position: relative;
    }

    .letter-paper {
      position: relative;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(126, 184, 160, 0.15);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      min-height: 260px;
      box-shadow: 0 2px 12px rgba(126, 184, 160, 0.06);
      transition: transform 0.8s ease, opacity 0.8s ease;
    }

    /* Rice paper texture overlay */
    .letter-paper::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 28px,
          rgba(126, 184, 160, 0.04) 28px,
          rgba(126, 184, 160, 0.04) 29px
        );
      pointer-events: none;
    }

    /* Subtle fiber texture */
    .letter-paper::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-image:
        radial-gradient(ellipse 1px 1px at 15% 20%, rgba(126,184,160,0.12) 0%, transparent 100%),
        radial-gradient(ellipse 1px 1px at 45% 65%, rgba(126,184,160,0.08) 0%, transparent 100%),
        radial-gradient(ellipse 1px 1px at 78% 35%, rgba(126,184,160,0.10) 0%, transparent 100%),
        radial-gradient(ellipse 1px 1px at 30% 85%, rgba(126,184,160,0.06) 0%, transparent 100%),
        radial-gradient(ellipse 1px 1px at 60% 10%, rgba(126,184,160,0.09) 0%, transparent 100%),
        radial-gradient(ellipse 1px 1px at 88% 75%, rgba(126,184,160,0.07) 0%, transparent 100%);
      pointer-events: none;
    }

    .letter-content {
      position: relative;
      z-index: 1;
      font-size: 15px;
      line-height: 1.85;
      color: var(--color-text-primary);
      font-weight: 300;
      letter-spacing: 0.02em;
      text-align: justify;
      transition: opacity 2.5s ease, transform 2.5s ease;
    }

    /* ============================
       Water Stream Overlay
       ============================ */
    /* ============================
       Water Wave SVGs
       ============================ */
    .water-overlay {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
      z-index: 2;
    }

    .water-overlay.active {
      opacity: 1;
    }

    .water-wave {
      position: absolute;
      left: -100%;
      width: 300%;
      height: 55%;
      bottom: 0;
    }

    .water-wave-1 {
      bottom: 0;
      animation: wave-drift 6s linear infinite;
    }

    .water-wave-2 {
      bottom: -10px;
      opacity: 0.7;
      animation: wave-drift 8s linear infinite reverse;
    }

    .water-wave-3 {
      bottom: 8px;
      opacity: 0.5;
      height: 45%;
      animation: wave-drift 10s linear infinite;
    }

    @keyframes wave-drift {
      0%   { transform: translateX(0); }
      100% { transform: translateX(33.33%); }
    }

    /* Shimmer: moving light spots on water surface */
    .water-surface-shimmer {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 30px 8px at 20% 60%, rgba(180,225,210,0.30) 0%, transparent 70%),
        radial-gradient(ellipse 25px 6px at 55% 55%, rgba(160,215,195,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 35px 7px at 80% 58%, rgba(190,230,218,0.28) 0%, transparent 70%);
      background-size: 200% 100%;
      animation: shimmer-slide 4s linear infinite;
    }

    @keyframes shimmer-slide {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* ============================
       Ripple Container
       ============================ */
    .ripple-container {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(126, 184, 160, 0.35);
      box-shadow: 0 0 6px rgba(126, 184, 160, 0.12);
      animation: ripple-effect 3s ease-out forwards;
      pointer-events: none;
    }

    /* ============================
       Completion Message
       ============================ */
    .complete-message {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
      z-index: 10;
      padding: 32px;
      text-align: center;
    }

    .complete-message.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .complete-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.7;
    }

    .complete-text {
      font-size: 15px;
      font-weight: 400;
      color: var(--emotion-calm);
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .complete-subtext {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-top: 8px;
    }

    /* ============================
       CTA Button Area
       ============================ */
    .cta-area {
      padding: 16px 28px 32px;
      position: relative;
      z-index: 5;
    }

    .cta-btn {
      width: 100%;
      padding: 16px 32px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--emotion-calm);
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      font-family: var(--font-family);
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--emotion-calm-glow);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .cta-btn:hover {
      box-shadow: 0 6px 24px rgba(126, 184, 160, 0.4);
      transform: translateY(-1px);
    }

    .cta-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px var(--emotion-calm-glow);
    }

    .cta-btn.disabled {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    /* Action Buttons */
    .action-buttons {
      position: absolute;
      z-index: 30;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 80%;
      padding: 0 24px;
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-family: var(--font-family);
      font-size: var(--font-size-sm);
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.3s ease;
    }

    .action-btn-secondary {
      border: 1px solid rgba(126, 184, 160, 0.3);
      background: rgba(126, 184, 160, 0.08);
      color: var(--emotion-calm);
    }

    .action-btn-secondary:hover {
      background: rgba(126, 184, 160, 0.15);
    }

    .action-btn-primary {
      border: none;
      background: linear-gradient(135deg, var(--emotion-calm) 0%, #5a9a80 100%);
      color: #fff;
      box-shadow: 0 4px 16px var(--emotion-calm-glow);
    }

    .action-btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px var(--emotion-calm-glow);
    }

    /* ============================
       Background Ambient Particles
       ============================ */
    .ambient-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(126, 184, 160, 0.15);
      animation: float-particle linear infinite;
    }

    /* ============================
       CSS Keyframe Animations
       ============================ */

    /* 1. Text fade - gradual dissolution with upward drift */
    @keyframes text-fade {
      0% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
      40% {
        opacity: 0.6;
        transform: translateY(-4px);
        filter: blur(0.3px);
      }
      100% {
        opacity: 0;
        transform: translateY(-14px);
        filter: blur(2px);
      }
    }

    /* 3. Paper dissolve - translucent to fully transparent */
    @keyframes paper-dissolve {
      0% {
        opacity: 1;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-color: rgba(126, 184, 160, 0.15);
        box-shadow: 0 2px 12px rgba(126, 184, 160, 0.06);
      }
      50% {
        opacity: 0.5;
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        border-color: rgba(126, 184, 160, 0.08);
        box-shadow: 0 2px 12px rgba(126, 184, 160, 0.02);
      }
      100% {
        opacity: 0;
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
        border-color: rgba(126, 184, 160, 0);
        box-shadow: 0 0 0 rgba(126, 184, 160, 0);
      }
    }

    /* 4. Ripple effect - expanding circles */
    @keyframes ripple-effect {
      0% {
        width: 0;
        height: 0;
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(0);
      }
      50% {
        opacity: 0.3;
      }
      100% {
        width: 200px;
        height: 200px;
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* 5. Gentle sway - letter paper floating in water */
    @keyframes gentle-sway {
      0%, 100% {
        transform: rotate(0deg) translateY(0);
      }
      25% {
        transform: rotate(0.3deg) translateY(-2px);
      }
      50% {
        transform: rotate(0deg) translateY(-1px);
      }
      75% {
        transform: rotate(-0.3deg) translateY(-3px);
      }
    }

    /* Floating particles */
    @keyframes float-particle {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.15;
      }
      90% {
        opacity: 0.15;
      }
      100% {
        transform: translateY(-400px) translateX(30px);
        opacity: 0;
      }
    }

    /* Gentle fade in for complete state */
    @keyframes gentle-appear {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ============================
       Animation States
       ============================ */

    /* When animating */
    .letter-paper.swaying {
      animation: gentle-sway 4s ease-in-out infinite;
    }

    .letter-content.fading {
      animation: text-fade 4s ease-out forwards;
    }

    .letter-paper.dissolving {
      animation: paper-dissolve 4s ease-out forwards;
    }

    .complete-message.visible .complete-text {
      animation: gentle-appear 1.2s ease-out 0.3s both;
    }

    .complete-message.visible .complete-subtext {
      animation: gentle-appear 1.2s ease-out 0.8s both;
    }

    /* ============================
       Utility
       ============================ */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
