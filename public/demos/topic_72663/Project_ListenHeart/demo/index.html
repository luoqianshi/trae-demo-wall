<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>听心 - 情绪陪伴</title>
  <style>
:root {
  --color-primary: #d4a5a5;
  --color-primary-light: #ecd5d5;
  --color-primary-dark: #b88989;
  --color-bg: #faf8f7;
  --color-bg-warm: #fdf5f5;
  --color-bg-cool: #f0f5f4;
  --color-bg-purple: #f5f0f5;
  --color-surface: #ffffff;
  --color-text-primary: #3a3333;
  --color-text-secondary: #8a7e7e;
  --color-text-muted: #b5aaaa;
  --color-border: #ebe0e0;

  --emotion-positive: #f5a623;
  --emotion-positive-bg: #fff9f0;
  --emotion-positive-glow: rgba(245, 166, 35, 0.3);
  --emotion-calm: #7eb8a0;
  --emotion-calm-bg: #f0f7f4;
  --emotion-calm-glow: rgba(126, 184, 160, 0.3);
  --emotion-negative: #9b8ec4;
  --emotion-negative-bg: #f3f0f8;
  --emotion-negative-glow: rgba(155, 142, 196, 0.3);

  --font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.25rem;
  --font-size-xl: 1.5rem;
  --font-size-2xl: 2rem;
  --font-size-3xl: 2.5rem;

  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.05);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  font-family: var(--font-family);
  background: var(--color-bg);
  color: var(--color-text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.font-title {
  font-family: var(--font-family);
  font-weight: 600;
  letter-spacing: -0.02em;
}

.font-body {
  font-family: var(--font-family);
  font-weight: 400;
  line-height: 1.6;
}

.font-caption {
  font-family: var(--font-family);
  font-weight: 400;
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
  line-height: 1.5;
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}

.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

.phone-frame {
  width: 90vw;
  max-width: 375px;
  height: 95vh;
  max-height: 812px;
  background: var(--color-bg);
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 2px rgba(0,0,0,0.05);
  flex-shrink: 0;
}

@media (max-width: 375px) {
  .phone-frame {
    width: 100vw;
    height: 100vh;
    max-height: none;
    border-radius: 0;
    box-shadow: none;
  }
}
  </style>
  <style>
    .page-container {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    .page-container.active {
      display: flex;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .app-header {
      padding: 56px 24px 24px;
      text-align: center;
    }

    .app-title {
      font-size: 32px;
      font-weight: 300;
      color: var(--color-text-primary);
      letter-spacing: 8px;
      margin-bottom: 8px;
    }

    .app-slogan {
      font-size: 14px;
      color: var(--color-text-muted);
      letter-spacing: 2px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--color-border);
      margin: 20px auto;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 24px;
      flex: 1;
      align-content: center;
    }

    .mood-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 24px 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mood-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .mood-card:active {
      transform: translateY(-2px);
    }

    .mood-card.mood-positive {
      background: var(--emotion-positive-bg);
      border-color: rgba(245, 166, 35, 0.2);
    }

    .mood-card.mood-calm {
      background: var(--emotion-calm-bg);
      border-color: rgba(126, 184, 160, 0.2);
    }

    .mood-card.mood-negative {
      background: var(--emotion-negative-bg);
      border-color: rgba(155, 142, 196, 0.2);
    }

    .mood-icon {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .mood-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-primary);
    }

    .mood-desc {
      font-size: 12px;
      color: var(--color-text-muted);
      line-height: 1.5;
      margin-top: 4px;
    }

    .mood-card.mood-positive .mood-name { color: var(--emotion-positive); }
    .mood-card.mood-calm .mood-name { color: var(--emotion-calm); }
    .mood-card.mood-negative .mood-name { color: var(--emotion-negative); }

    .bottom-nav {
      padding: 16px 24px 32px;
      display: flex;
      justify-content: center;
      gap: 48px;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--color-text-muted);
      transition: color 0.2s ease;
    }

    .nav-item.active {
      color: var(--color-primary);
    }

    .nav-item:hover {
      color: var(--color-text-secondary);
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-text {
      font-size: 12px;
    }

    .prompt-text {
      text-align: center;
      padding: 0 32px;
      margin-bottom: 24px;
      font-size: 15px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }

    @keyframes gentle-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    #history-list {
      flex: 1;
      padding: 0 24px;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #d9d4cc transparent;
    }

    #history-list::-webkit-scrollbar {
      width: 4px;
    }

    #history-list::-webkit-scrollbar-track {
      background: transparent;
    }

    #history-list::-webkit-scrollbar-thumb {
      background: #d9d4cc;
      border-radius: 2px;
    }

    .history-item-wrapper {
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
      border-radius: var(--radius-lg);
    }

    .history-item {
      position: relative;
      z-index: 2;
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease;
      touch-action: pan-y;
      user-select: none;
    }

    .history-item.swiped {
      transform: translateX(-72px);
    }

    .history-delete-btn {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 72px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      font-family: var(--font-family);
    }
  </style>
</head>
<body>

      <header class="app-header">
        <div class="app-title">听心</div>

      </header>

      <p class="prompt-text">此刻的你，是什么心情？</p>

      <div class="mood-grid">
        <div class="mood-card mood-positive" data-emotion="positive">
          <span class="mood-icon">&#127775;</span>

      <nav class="bottom-nav">
        <div class="nav-item active" data-nav="home">

    <div id="record-page" class="page-container">
      <header class="app-header">
        <button class="back-btn" id="record-back-btn" style="

        <textarea id="record-textarea" style="

        <button id="submit-btn" style="

      <nav class="bottom-nav">

          <span class="nav-icon">&#128247;</span>

        </div>
        <div class="nav-item" data-nav="history">
          <span class="nav-icon">&#128190;</span>

    <div id="history-page" class="page-container">

        <div class="app-title">历史</div>

      </header>

      <div id="history-list"></div>

      <div id="empty-state" style="
        flex: 1;

    <div id="release-page" class="page-container" style="position: relative;">

  <script>
    class Router {
      constructor(routes, options = {}) {
        this.routes = routes;
        this.currentRoute = null;
        this.mode = options.mode || 'hash';
        this.base = options.base || '';
        this.init();
      }

      init() {
        if (this.mode === 'hash') {
          window.addEventListener('hashchange', () => this.handleRouteChange());
        } else {
          window.addEventListener('popstate', () => this.handleRouteChange());
        }
        this.handleRouteChange();
      }

      getCurrentPath() {
        if (this.mode === 'hash') {
          const hash = window.location.hash.slice(1);
          return hash.split('?')[0] || '/';
        }
        let path = window.location.pathname;
        if (this.base && path.startsWith(this.base)) {
          path = path.slice(this.base.length) || '/';
        }
        return path;
      }

      getQueryParams() {
        const params = {};
        let search;
        if (this.mode === 'hash') {
          const hash = window.location.hash.slice(1);
          const qIndex = hash.indexOf('?');
          search = qIndex !== -1 ? hash.substring(qIndex + 1) : '';
        } else {
          search = window.location.search.substring(1);
        }
        if (search) {
          const pairs = search.split('&');
          pairs.forEach(pair => {
            const [key, value] = pair.split('=');
            if (key && value) {
              params[key] = decodeURIComponent(value);
            }
          });
        }
        return params;
      }

      navigate(path, params = {}) {
        const queryString = Object.keys(params).length > 0
          ? '?' + Object.entries(params).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&')
          : '';
        
        if (this.mode === 'hash') {
          window.location.hash = path + queryString;
        } else {
          const fullPath = this.base + path + queryString;
          window.history.pushState({}, '', fullPath);
        }
        this.handleRouteChange();
      }

      replace(path, params = {}) {
        const queryString = Object.keys(params).length > 0
          ? '?' + Object.entries(params).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&')
          : '';
        
        if (this.mode === 'hash') {
          window.location.replace('#' + path + queryString);
        } else {
          const fullPath = this.base + path + queryString;
          window.history.replaceState({}, '', fullPath);
        }
        this.handleRouteChange();
      }

      handleRouteChange() {
        const path = this.getCurrentPath();
        const params = this.getQueryParams();
        
        const route = this.routes.find(r => {
          if (typeof r.path === 'string') {
            return r.path === path;
          }
          if (r.path instanceof RegExp) {
            return r.path.test(path);
          }
          return false;
        });

        if (route) {
          this.currentRoute = route;
          if (route.handler) {
            route.handler(params);
          }
        } else {
          this.navigate('/');
        }
      }

      goBack() {
        window.history.back();
      }
    }

    const STORAGE_KEY = 'listen_heart_records';

    const storage = {
      getAllRecords() {
        try {
          const data = localStorage.getItem(STORAGE_KEY);
          return data ? JSON.parse(data) : [];
        } catch {
          return [];
        }
      },

      getRecordById(id) {
        const records = this.getAllRecords();
        return records.find(r => r.id === id);
      },

      saveRecord(record) {
        const records = this.getAllRecords();
        const newRecord = {
          id: record.id || Date.now().toString(),
          emotion: record.emotion,
          content: record.content,
          timestamp: record.timestamp || Date.now(),
          released: record.released || false
        };
        records.push(newRecord);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        return newRecord;
      },

      updateRecord(id, updates) {
        const records = this.getAllRecords();
        const index = records.findIndex(r => r.id === id);
        if (index !== -1) {
          records[index] = { ...records[index], ...updates };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
          return records[index];
        }
        return null;
      },

      deleteRecord(id) {
        const records = this.getAllRecords();
        const filtered = records.filter(r => r.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
        return filtered;
      },

      clearAllRecords() {
        localStorage.removeItem(STORAGE_KEY);
      }
    };

    const app = document.getElementById('app');
    console.log('=== NEW CODE LOADED ===');
    console.log('Setting app dimensions');
    app.style.width = '375px';
    app.style.height = '812px';
    app.style.overflow = 'hidden';
    app.style.position = 'relative';
    app.style.display = 'block';
    console.log('app style.height:', app.style.height);
    const homePage = document.getElementById('home-page');
    const recordPage = document.getElementById('record-page');
    const historyPage = document.getElementById('history-page');
    const releasePage = document.getElementById('release-page');
    const releaseIframe = document.getElementById('release-iframe');
    const releaseBackBtn = document.getElementById('release-back-btn');

    function showPage(pageId) {
      document.querySelectorAll('.page-container').forEach(page => {
        page.classList.remove('active');
      });
      document.getElementById(pageId).classList.add('active');

      // 返回按钮只在释放页显示
      releaseBackBtn.style.display = (pageId === 'release-page') ? 'block' : 'none';

      const bottomNav = document.querySelector('.bottom-nav');
      if (pageId === 'release-page') {
        bottomNav.style.display = 'none';
        return;
      }
      bottomNav.style.display = 'flex';

      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.nav === pageId.replace('-page', '')) {
          item.classList.add('active');
        }
      });
    }

    // 合法情绪类型白名单，用于参数校验
    const VALID_EMOTIONS = ['positive', 'calm', 'negative'];
    const emotionConfig = {
      positive: { name: '积极', color: 'var(--emotion-positive)', bg: 'var(--emotion-positive-bg)', border: 'rgba(245, 166, 35, 0.3)' },
      calm: { name: '平静', color: 'var(--emotion-calm)', bg: 'var(--emotion-calm-bg)', border: 'rgba(126, 184, 160, 0.3)' },
      negative: { name: '消极', color: 'var(--emotion-negative)', bg: 'var(--emotion-negative-bg)', border: 'rgba(155, 142, 196, 0.3)' }
    };

    function sanitizeEmotion(emotion) {
      return VALID_EMOTIONS.includes(emotion) ? emotion : 'calm';
    }

    function initRecordPage(params) {
      const emotion = sanitizeEmotion(params.emotion);
      const textarea = document.getElementById('record-textarea');
      const emotionTag = document.getElementById('record-emotion-tag');

      // cloneNode 重置 backBtn 和 submitBtn，消除旧监听器
      const oldBackBtn = document.getElementById('record-back-btn');
      const newBackBtn = oldBackBtn.cloneNode(true);
      oldBackBtn.parentNode.replaceChild(newBackBtn, oldBackBtn);

      const oldSubmitBtn = document.getElementById('submit-btn');
      const newSubmitBtn = oldSubmitBtn.cloneNode(true);
      oldSubmitBtn.parentNode.replaceChild(newSubmitBtn, oldSubmitBtn);

      const config = emotionConfig[emotion];

      emotionTag.textContent = config.name;
      emotionTag.style.color = config.color;
      emotionTag.style.background = config.bg;
      emotionTag.style.border = `1px solid ${config.border}`;

      newSubmitBtn.style.background = config.color;
      newSubmitBtn.style.boxShadow = `0 4px 16px ${config.border}`;

      textarea.value = '';

      newBackBtn.addEventListener('click', () => router.navigate('/'));

      newSubmitBtn.addEventListener('click', () => {
        const content = textarea.value;
        if (!content.trim()) {
          // 温和校验：用情绪主题色脉冲提示，不使用红色错误状态
          textarea.style.borderColor = config.color;
          textarea.placeholder = '写下心情，才能释放哦～';
          newSubmitBtn.style.animation = 'gentle-shake 0.4s ease';
          setTimeout(() => {
            textarea.style.borderColor = '';
            newSubmitBtn.style.animation = '';
          }, 2000);
          return;
        }

        const record = storage.saveRecord({
          emotion,
          content,
          released: false
        });

        // 完成记录后不自动播放，让用户手动点击释放按钮体验仪式感
        router.navigate('/release', {
          id: record.id,
          emotion,
          content,
          autoplay: '0',
          from: 'record'
        });
      });
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const hour = date.getHours().toString().padStart(2, '0');
      const minute = date.getMinutes().toString().padStart(2, '0');
      return `${year}年${month}月${day}日 ${hour}:${minute}`;
    }

    function getEmotionInfo(emotion) {
      const info = {
        positive: { icon: '&#127775;', color: 'var(--emotion-positive)', bg: 'var(--emotion-positive-bg)', name: '积极' },
        calm: { icon: '&#127807;', color: 'var(--emotion-calm)', bg: 'var(--emotion-calm-bg)', name: '平静' },
        negative: { icon: '&#127912;', color: 'var(--emotion-negative)', bg: 'var(--emotion-negative-bg)', name: '消极' }
      };
      return info[emotion] || info.calm;
    }

    function renderHistory() {
      const records = storage.getAllRecords();
      const historyList = document.getElementById('history-list');
      const emptyState = document.getElementById('empty-state');

      historyList.innerHTML = '';

      // 只显示已释放的记录
      const releasedRecords = records.filter(r => r.released);

      if (releasedRecords.length === 0) {
        emptyState.style.display = 'flex';
        historyList.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      historyList.style.display = 'block';

      const sortedRecords = [...releasedRecords].sort((a, b) => b.timestamp - a.timestamp);

      sortedRecords.forEach(record => {
        const emotionInfo = getEmotionInfo(record.emotion);

        const wrapper = document.createElement('div');
        wrapper.className = 'history-item-wrapper';
        wrapper.dataset.id = record.id;

        const item = document.createElement('div');
        item.className = 'history-item';
        item.dataset.id = record.id;

        const header = document.createElement('div');
        header.style.cssText = `
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 12px;
        `;

        const emotionBadge = document.createElement('div');
        emotionBadge.style.cssText = `
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 4px 12px;
          border-radius: var(--radius-full);
          background: ${emotionInfo.bg};
          color: ${emotionInfo.color};
          font-size: 13px;
          font-weight: 500;
        `;
        emotionBadge.innerHTML = `<span>${emotionInfo.icon}</span><span>${emotionInfo.name}</span>`;

        const date = document.createElement('span');
        date.style.cssText = `
          font-size: 12px;
          color: var(--color-text-muted);
        `;
        date.textContent = formatDate(record.timestamp);

        header.appendChild(emotionBadge);
        header.appendChild(date);

        const content = document.createElement('p');
        content.style.cssText = `
          font-size: 14px;
          color: var(--color-text-primary);
          line-height: 1.6;
          margin-bottom: 12px;
          display: -webkit-box;
          -webkit-line-clamp: 3;
          -webkit-box-orient: vertical;
          overflow: hidden;
        `;
        content.textContent = record.content;

        const actions = document.createElement('div');
        actions.style.cssText = `
          display: flex;
          justify-content: flex-end;
          gap: 12px;
        `;

        const releaseBtn = document.createElement('button');
        releaseBtn.textContent = '重新释放';
        releaseBtn.className = 'history-release-btn';
        releaseBtn.style.cssText = `
          padding: 8px 16px;
          border: none;
          border-radius: var(--radius-full);
          font-family: var(--font-family);
          font-size: 12px;
          font-weight: 500;
          cursor: pointer;
          background: ${emotionInfo.color};
          color: #fff;
          transition: opacity 0.2s;
        `;

        actions.appendChild(releaseBtn);

        item.appendChild(header);
        item.appendChild(content);
        item.appendChild(actions);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'history-delete-btn';
        deleteBtn.textContent = '删除';
        deleteBtn.dataset.id = record.id;

        wrapper.appendChild(item);
        wrapper.appendChild(deleteBtn);

        historyList.appendChild(wrapper);
      });
    }

    let swipeState = {
      startX: 0,
      startY: 0,
      currentItem: null,
      isSwiping: false,
      initialTranslate: 0
    };

    function closeAllSwipedItems() {
      document.querySelectorAll('.history-item.swiped').forEach(item => {
        item.classList.remove('swiped');
        item.style.transform = '';
      });
    }

    function handleSwipeStart(clientX, clientY, item) {
      swipeState.startX = clientX;
      swipeState.startY = clientY;
      swipeState.currentItem = item;
      swipeState.isSwiping = false;

      const transform = item.style.transform;
      const match = transform.match(/translateX\((-?\d+)px\)/);
      swipeState.initialTranslate = match ? parseInt(match[1]) : 0;
    }

    function handleSwipeMove(clientX, clientY) {
      if (!swipeState.currentItem) return false;

      const diffX = clientX - swipeState.startX;
      const diffY = clientY - swipeState.startY;

      if (!swipeState.isSwiping) {
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
          swipeState.isSwiping = true;
        } else {
          return false;
        }
      }

      let newTranslate = swipeState.initialTranslate + diffX;
      newTranslate = Math.max(-72, Math.min(0, newTranslate));
      swipeState.currentItem.style.transform = `translateX(${newTranslate}px)`;
      swipeState.currentItem.style.transition = 'none';
      return true;
    }

    function handleSwipeEnd() {
      if (!swipeState.currentItem) return;

      const item = swipeState.currentItem;
      item.style.transition = '';

      const transform = item.style.transform;
      const match = transform.match(/translateX\((-?\d+)px\)/);
      const currentTranslate = match ? parseInt(match[1]) : 0;

      if (currentTranslate < -36) {
        item.classList.add('swiped');
        item.style.transform = 'translateX(-72px)';
      } else {
        item.classList.remove('swiped');
        item.style.transform = '';
      }

      swipeState.currentItem = null;
      swipeState.isSwiping = false;
    }

    function initHistorySwipe() {
      const historyList = document.getElementById('history-list');

      historyList.addEventListener('touchstart', (e) => {
        const item = e.target.closest('.history-item');
        if (!item) return;
        const touch = e.touches[0];
        handleSwipeStart(touch.clientX, touch.clientY, item);
      }, { passive: true });

      historyList.addEventListener('touchmove', (e) => {
        if (!swipeState.currentItem) return;
        const touch = e.touches[0];
        if (handleSwipeMove(touch.clientX, touch.clientY)) {
          e.preventDefault();
        }
      }, { passive: false });

      historyList.addEventListener('touchend', handleSwipeEnd);

      historyList.addEventListener('mousedown', (e) => {
        const item = e.target.closest('.history-item');
        if (!item) return;
        handleSwipeStart(e.clientX, e.clientY, item);
      });

      document.addEventListener('mousemove', (e) => {
        if (!swipeState.currentItem) return;
        if (handleSwipeMove(e.clientX, e.clientY)) {
          e.preventDefault();
        }
      });

      document.addEventListener('mouseup', handleSwipeEnd);

      let mouseDownX = 0;
      historyList.addEventListener('mousedown', (e) => {
        mouseDownX = e.clientX;
      });

      historyList.addEventListener('click', (e) => {
        if (Math.abs(e.clientX - mouseDownX) > 5) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }

        const deleteBtn = e.target.closest('.history-delete-btn');
        if (deleteBtn) {
          const id = deleteBtn.dataset.id;
          storage.deleteRecord(id);
          renderHistory();
          return;
        }

        const releaseBtn = e.target.closest('.history-release-btn');
        if (releaseBtn) {
          const wrapper = releaseBtn.closest('.history-item-wrapper');
          const id = wrapper?.dataset.id;
          const record = storage.getRecordById(id);
          if (record) {
            const emotion = sanitizeEmotion(record.emotion);
            router.navigate('/release', {
              id: record.id,
              emotion,
              content: record.content,
              autoplay: '1',
              from: 'history'
            });
          }
          return;
        }

        const item = e.target.closest('.history-item');
        if (item && item.classList.contains('swiped')) {
          closeAllSwipedItems();
          return;
        }

        closeAllSwipedItems();
      });
    }

    let historySwipeInitialized = false;

    function initHistoryPage() {
      renderHistory();
      if (!historySwipeInitialized) {
        initHistorySwipe();
        historySwipeInitialized = true;
      }
    }

    const router = new Router([
      { path: '/', handler: () => { showPage('home-page'); } },
      { path: '/record', handler: (params) => { showPage('record-page'); initRecordPage(params); } },
      { path: '/history', handler: () => { showPage('history-page'); initHistoryPage(); } },
      { path: '/release', handler: (params) => {
          showPage('release-page');
          const emotion = sanitizeEmotion(params.emotion);
          const id = params.id || '';
          const content = params.content || '';
          const autoplay = params.autoplay === '1' ? '1' : '0';
          releaseBackBtn.dataset.from = params.from || 'home';
          const releaseUrl = `../listen-heart-release-anim/pages/${emotion}-release.html?id=${encodeURIComponent(id)}&content=${encodeURIComponent(content)}&autoplay=${autoplay}`;
          releaseIframe.src = releaseUrl;
        }
      }
    ], { mode: 'hash' });

    // 事件委托：情绪卡片 + 底部导航，避免监听器累积泄漏
    app.addEventListener('click', (e) => {
      const moodCard = e.target.closest('.mood-card');
      if (moodCard) {
        const emotion = moodCard.dataset.emotion;
        router.navigate('/record', { emotion });
        return;
      }
      const navItem = e.target.closest('.nav-item');
      if (navItem) {
        const nav = navItem.dataset.nav;
        if (nav === 'home') {
          router.navigate('/');
        } else if (nav === 'history') {
          router.navigate('/history');
        }
        return;
      }
    });

    // 释放页返回按钮
    releaseBackBtn.addEventListener('click', () => {
      releaseIframe.src = '';
      const from = releaseBackBtn.dataset.from || 'home';
      if (from === 'history') {
        router.navigate('/history');
      } else {
        router.navigate('/');
      }
    });

    window.addEventListener('message', (event) => {
      const isValidOrigin = event.origin === window.location.origin ||
        event.origin === 'null' ||
        event.origin === '' ||
        (window.location.protocol === 'file:' && event.origin === 'null');
      if (!isValidOrigin) {
        return;
      }
      if (event.data && event.data.type === 'releaseComplete') {
        const recordId = event.data.id;
        if (recordId) {
          storage.updateRecord(recordId, { released: true });
        }
        releaseIframe.src = '';
        renderHistory();
        router.navigate('/');
      }
    });
  </script>
</body>
</html>
