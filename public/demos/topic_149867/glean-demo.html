  var url = document.getElementById('urlInput').value.trim();
  if (!url) return;

  var inputType = detectType(url);

  document.getElementById('clipProgress').classList.add('show');
  document.getElementById('clipResult').classList.remove('show');

  var stepIndex = 0;
  function nextStep() {
    if (stepIndex > 0) {
      var prev = document.getElementById(steps[stepIndex - 1]);
      prev.classList.remove('active');
      prev.classList.add('done');
      prev.querySelector('.progress-dot').textContent = '✓';
    }
    if (stepIndex < steps.length) {
      document.getElementById(steps[stepIndex]).classList.add('active');
      stepIndex++;
      setTimeout(nextStep, 600);
    } else {
      showResult(clipData);
    }
  }
  nextStep();

}

function generateClipResult(url, type) {
  // Pick a random mock item matching the type, or generate generic
  var matching = mockData.filter(function(m) { return m.type === type; });
  var base = matching.length > 0 ? matching[Math.floor(Math.random() * matching.length)] : {
    typeName: '网页', category: '其他收藏', backend: 'httpx（本地）', files: ['article.md']
  };

  var titles = {
    web: '使用 Glean 剪藏的网页内容已自动归档',
    video: 'B站视频信息与字幕已自动归档',
    doc: '文档正文已抽取并归档',
    image: '图片已保存原图归档'
  };

  return {
    type: type,
    typeName: base.typeName,
    title: base.title || titles[type],
    category: base.category,
    backend: base.backend,
    source: url,
    time: new Date().toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(/\//g, '-'),
    files: base.files,
    subtitle: base.subtitle,
    preview: base.preview
  };
}

function showResult(data) {
  document.getElementById('clipProgress').classList.remove('show');

  var typeEl = document.getElementById('resultType');
  typeEl.textContent = data.typeName;
  typeEl.className = 'result-type ' + data.type;

  document.getElementById('resultTitle').textContent = data.title;

  var metaHtml = '';
  metaHtml += '<div class="meta-item"><span class="key">领域</span><span class="val">' + data.category + '</span></div>';
  metaHtml += '<div class="meta-item"><span class="key">抓取后端</span><span class="val">' + data.backend + '</span></div>';
  metaHtml += '<div class="meta-item"><span class="key">来源</span><span class="val">' + data.source + '</span></div>';
  metaHtml += '<div class="meta-item"><span class="key">归档时间</span><span class="val">' + data.time + '</span></div>';
  if (data.subtitle) {
    metaHtml += '<div class="meta-item"><span class="key">字幕来源</span><span class="val">' + data.subtitle + '</span></div>';
  }
  document.getElementById('resultMeta').innerHTML = metaHtml;

  var filesHtml = data.files.map(function(f) {
    return '<span class="file-tag">✓ ' + f + '</span>';
  }).join('');
  document.getElementById('resultFiles').innerHTML = filesHtml;

  if (data.preview) {
    document.getElementById('resultPreview').style.display = 'block';
    document.getElementById('previewContent').textContent = data.preview.substring(0, 200) + '...';
  } else {
    document.getElementById('resultPreview').style.display = 'none';
  }

  document.getElementById('clipResult').classList.add('show');

  // Add to mock data
  mockData.unshift({
    type: data.type, typeName: data.typeName, title: data.title,
    category: data.category, source: data.source, time: data.time,
    files: data.files, backend: data.backend, subtitle: data.subtitle
  });
  document.getElementById('totalCount').textContent = mockData.length;
}

// ── Archive ──
function renderArchive() {
  var list = document.getElementById('archiveList');
  var filtered = currentFilter === 'all' ? mockData : mockData.filter(function(m) { return m.category === currentFilter; });

  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:0.9rem;">暂无内容</div>';
    return;
  }

  list.innerHTML = filtered.map(function(item) {
    var typeBadge = '<span class="result-type ' + item.type + '">' + item.typeName + '</span>';
    return '<div class="archive-item">' +
      '<div class="archive-item-header">' +
        typeBadge +
        '<span class="archive-item-title">' + item.title + '</span>' +
      '</div>' +
      '<div class="archive-item-meta">' +
        '<span class="cat">' + item.category + '</span>' +
        '<span>' + item.time + '</span>' +
        '<span>' + item.source + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function filterArchive(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderArchive();
}

function searchArchive() {
  var keyword = document.getElementById('searchInput').value.toLowerCase();
  var list = document.getElementById('archiveList');
  var filtered = mockData.filter(function(m) {
    return (currentFilter === 'all' || m.category === currentFilter) &&
           (m.title.toLowerCase().indexOf(keyword) >= 0 || m.category.toLowerCase().indexOf(keyword) >= 0);
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:0.9rem;">未找到匹配内容</div>';
    return;
  }

  list.innerHTML = filtered.map(function(item) {
    var typeBadge = '<span class="result-type ' + item.type + '">' + item.typeName + '</span>';
    return '<div class="archive-item">' +
      '<div class="archive-item-header">' +
        typeBadge +
        '<span class="archive-item-title">' + item.title + '</span>' +
      '</div>' +
      '<div class="archive-item-meta">' +
        '<span class="cat">' + item.category + '</span>' +
        '<span>' + item.time + '</span>' +
        '<span>' + item.source + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── Stats ──
function renderStats() {
  var cats = {};
  mockData.forEach(function(m) {
    cats[m.category] = (cats[m.category] || 0) + 1;
  });

  var maxCount = Math.max.apply(null, Object.values(cats));
  var colors = { '科技与AI': '#7c6cff', '工具与技巧': '#00d9b2', '财经与商业': '#ffb84d', '视频与影音': '#ff6b9d', '其他收藏': '#7a8092' };

  var html = Object.keys(cats).map(function(cat) {
    var count = cats[cat];
    var pct = (count / maxCount * 100);
    var color = colors[cat] || '#7a8092';
    return '<div class="cat-bar">' +
      '<span class="cat-name">' + cat + '</span>' +
      '<div class="cat-track"><div class="cat-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
      '<span class="cat-count">' + count + '</span>' +
    '</div>';
  }).join('');

  document.getElementById('categoryBars').innerHTML = html;
  document.getElementById('statTotal').textContent = mockData.length;
}

// ── Init ──
renderArchive();
</script>
