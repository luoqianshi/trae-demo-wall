<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 方言童谣传声筒</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<canvas id="particles"></canvas>

<a href="index.html" class="login-back">← 返回首页</a>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="login-logo__icon">🎙️</span>
      <div class="login-logo__title">欢迎回来</div>
      <div class="login-logo__sub">用乡音唤醒童年记忆</div>
    </div>

    <div class="login-tabs">
      <div class="login-tab active" data-mode="login">登录</div>
      <div class="login-tab" data-mode="register">注册</div>
    </div>

    <form class="login-form" onsubmit="return false">
      <div class="form-group" id="registerGroup" style="display:none">
        <label class="form-label">昵称</label>
        <input type="text" class="form-input" id="nickname" placeholder="给自己起个好听的名字">
        <div class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label">手机号</label>
        <input type="tel" class="form-input" id="phone" placeholder="请输入手机号" maxlength="11">
        <div class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="password" placeholder="请输入密码">
        <div class="form-error"></div>
      </div>

      <div class="form-group" id="confirmGroup" style="display:none">
        <label class="form-label">确认密码</label>
        <input type="password" class="form-input" id="confirm" placeholder="再次输入密码">
        <div class="form-error"></div>
      </div>

      <div class="login-options">
        <label><input type="checkbox"> 记住我</label>
        <a href="#" onclick="alert('请联系管理员重置密码');return false;">忘记密码？</a>
      </div>

      <button type="submit" class="btn-login">登录</button>
    </form>

    <div class="login-divider">其他登录方式</div>
    <div class="login-socials">
      <div class="social-btn" title="微信登录" onclick="alert('微信登录功能开发中')">💬</div>
      <div class="social-btn" title="QQ登录" onclick="alert('QQ登录功能开发中')">🐧</div>
      <div class="social-btn" title="微博登录" onclick="alert('微博登录功能开发中')">🌐</div>
    </div>

    <div class="login-footer">
      还没有账号？<a href="#" onclick="switchMode('register');return false;">立即注册</a>
    </div>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
