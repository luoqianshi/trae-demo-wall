<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频测试</title>
<style>
body{font-family:sans-serif;background:#0a0a1a;color:#e2e8f0;padding:2rem;font-size:14px}
button{padding:1rem 2rem;font-size:1rem;margin:0.5rem;cursor:pointer;background:#a78bfa;color:#000;border:none;border-radius:8px}
#log{background:#111;padding:1rem;border-radius:8px;margin-top:1rem;white-space:pre-wrap;font-family:monospace;font-size:12px;max-height:400px;overflow:auto}
</style>
</head>
<body>
<h2>音频诊断测试</h2>
<button onclick="testWav()">测试 WAV 旋律播放</button>
<button onclick="testSpeech()">测试语音合成</button>
<div id="log">等待测试...</div>
<script>
function log(msg) {
  const el = document.getElementById('log')
  el.textContent = new Date().toLocaleTimeString() + ' | ' + msg + '\n' + el.textContent
}

/* 生成 WAV 数据 URI */
function generateWav(frequencies, noteDuration, sampleRate) {
  noteDuration = noteDuration || 0.3
  sampleRate = sampleRate || 22050
  const numNotes = frequencies.length
  const samplesPerNote = Math.ceil(noteDuration * sampleRate)
  const totalSamples = numNotes * samplesPerNote
  const buffer = new ArrayBuffer(44 + totalSamples * 2)
  const view = new DataView(buffer)
  const writeStr = function(offset, str) {
    for (var i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i))
  }
  writeStr(0, 'RIFF')
  view.setUint32(4, 36 + totalSamples * 2, true)
  writeStr(8, 'WAVE')
  writeStr(12, 'fmt ')
  view.setUint32(16, 16, true)
  view.setUint16(20, 1, true)
  view.setUint16(22, 1, true)
  view.setUint32(24, sampleRate, true)
  view.setUint32(28, sampleRate * 2, true)
  view.setUint16(32, 2, true)
  view.setUint16(34, 16, true)
  writeStr(36, 'data')
  view.setUint32(40, totalSamples * 2, true)
  var offset = 44
  for (var n = 0; n < numNotes; n++) {
    var freq = frequencies[n]
    for (var j = 0; j < samplesPerNote; j++) {
      var t = j / sampleRate
      var env = Math.min(1, j / (sampleRate * 0.02)) * Math.exp(-t * 2.5)
      var sample = Math.sin(2 * Math.PI * freq * t) * env * 0.4
      view.setInt16(offset, sample * 32767, true)
      offset += 2
    }
  }
  var binary = ''
  var bytes = new Uint8Array(buffer)
  for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i])
  return 'data:audio/wav;base64,' + btoa(binary)
}

function testWav() {
  log('开始测试 WAV 旋律...')
  var notes = [523, 587, 659, 523, 659, 698, 784]
  var wavUri = generateWav(notes, 0.3)
  log('WAV 数据长度: ' + wavUri.length + ' 字符')
  
  var audio = new Audio(wavUri)
  audio.volume = 1
  audio.onended = function() { log('WAV 播放结束') }
  audio.onerror = function(e) { log('WAV 播放错误: ' + e) }
  
  audio.play().then(function() {
    log('WAV 开始播放成功!')
  }).catch(function(err) {
    log('WAV 播放失败: ' + err.message)
  })
}

function testSpeech() {
  log('开始测试语音合成...')
  if (!('speechSynthesis' in window)) {
    log('浏览器不支持 speechSynthesis')
    return
  }
  var voices = window.speechSynthesis.getVoices()
  log('可用语音数量: ' + voices.length)
  
  var utter = new SpeechSynthesisUtterance('月亮走，我也走')
  utter.lang = 'zh-CN'
  utter.rate = 0.9
  utter.onstart = function() { log('语音开始播放') }
  utter.onend = function() { log('语音播放结束') }
  utter.onerror = function(e) { log('语音错误: ' + e.error) }
  window.speechSynthesis.speak(utter)
  log('已调用 speak()')
}

window.addEventListener('load', function() {
  log('页面已加载')
  log('Audio 支持: ' + ('AudioContext' in window || 'webkitAudioContext' in window))
  log('speechSynthesis 支持: ' + ('speechSynthesis' in window))
  log('请点击上方按钮测试音频（浏览器要求用户点击才能播放）')
})
</script>
</body>
</html>
