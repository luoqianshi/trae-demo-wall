<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学小游戏 - 数学练习软件</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:linear-gradient(135deg,#eff6ff 0%,#fff 50%,#faf5ff 100%); min-height:100vh; color:#333; }
.container { max-width:1200px; margin:0 auto; padding:20px; }
.text-center { text-align:center; }
.mb-2 { margin-bottom:8px; }
.mb-4 { margin-bottom:16px; }
.mb-6 { margin-bottom:24px; }
.mb-8 { margin-bottom:32px; }
.mt-4 { margin-top:16px; }
.mt-12 { margin-top:48px; }
.ml-2 { margin-left:8px; }
.flex { display:flex; }
.items-center { align-items:center; }
.justify-center { justify-content:center; }
.justify-between { justify-content:space-between; }
.gap-2 { gap:8px; }
.gap-3 { gap:12px; }
.gap-6 { gap:24px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; max-width:900px; margin:0 auto; }
@media (max-width:640px) { .grid { grid-template-columns:1fr; } }

/* 首页 */
.hero-icon { width:80px; height:80px; background:linear-gradient(135deg,#3b82f6,#9333ea); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; box-shadow:0 10px 25px rgba(59,130,246,.3); }
.hero-icon svg { width:40px; height:40px; fill:#fff; }
.hero-title { font-size:2.5rem; font-weight:700; background:linear-gradient(90deg,#2563eb,#9333ea); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:12px; }
.hero-subtitle { color:#6b7280; font-size:1.125rem; }

/* 年级卡片 */
.grade-card { background:#fff; border-radius:16px; padding:24px; cursor:pointer; transition:all .3s; border:2px solid transparent; position:relative; overflow:hidden; }
.grade-card:hover { transform:translateY(-4px); box-shadow:0 20px 40px rgba(0,0,0,.1); border-color:currentColor; }
.grade-card .color-bar { position:absolute; top:0; left:0; right:0; height:4px; border-radius:16px 16px 0 0; }
.grade-card .grade-num { font-size:2rem; font-weight:700; margin-bottom:4px; }
.grade-card .grade-desc { color:#6b7280; font-size:.875rem; }
.grade-card .arrow { position:absolute; right:16px; top:50%; transform:translateY(-50%); opacity:0; transition:all .3s; }
.grade-card:hover .arrow { opacity:1; transform:translateY(-50%) translateX(4px); }

/* 游戏页面 */
.header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:32px; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; background:#fff; border:none; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); cursor:pointer; font-size:.875rem; color:#374151; transition:all .2s; }
.btn:hover { box-shadow:0 4px 12px rgba(0,0,0,.12); }
.stat-box { display:flex; align-items:center; gap:8px; padding:8px 16px; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); font-size:.875rem; }
.stat-box .stat-val { font-weight:700; color:#1f2937; }
.stat-box .stat-label { color:#9ca3af; }

/* 标签页 */
.tabs { display:flex; justify-content:center; margin-bottom:24px; }
.tabs-inner { display:inline-flex; background:#fff; border-radius:12px; padding:4px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.tab-btn { padding:8px 24px; border:none; border-radius:8px; font-size:.875rem; font-weight:500; cursor:pointer; transition:all .2s; background:transparent; color:#6b7280; }
.tab-btn.active { background:#3b82f6; color:#fff; box-shadow:0 2px 8px rgba(59,130,246,.3); }
.tab-btn.active.purple { background:#a855f7; }

/* 题目卡片 */
.q-card { background:linear-gradient(135deg,#3b82f6,#2563eb); border-radius:24px; padding:32px; color:#fff; box-shadow:0 20px 40px rgba(59,130,246,.3); margin-bottom:24px; }
.q-card.purple { background:linear-gradient(135deg,#a855f7,#ec4899); box-shadow:0 20px 40px rgba(168,85,247,.3); }
.q-card .q-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.q-card .q-icon { width:48px; height:48px; background:rgba(255,255,255,.2); border-radius:12px; display:flex; align-items:center; justify-content:center; }
.q-card .q-icon svg { width:24px; height:24px; fill:#fff; }
.q-card .q-type { font-size:.875rem; opacity:.8; }
.q-card .q-title { font-size:1.25rem; font-weight:700; }
.q-card .q-expr { background:rgba(255,255,255,.1); backdrop-filter:blur(10px); border-radius:16px; padding:24px; font-size:2rem; font-weight:700; text-align:center; }
.q-card .q-hint { margin-top:12px; font-size:.875rem; opacity:.8; text-align:center; }

/* 大题 */
.big-desc { background:rgba(255,255,255,.1); backdrop-filter:blur(10px); border-radius:16px; padding:20px; font-size:1.125rem; line-height:1.8; white-space:pre-wrap; margin-bottom:16px; }
.big-label { color:rgba(255,255,255,.8); font-size:.875rem; margin-top:8px; }
.big-textarea { width:100%; min-height:120px; padding:16px; border-radius:12px; border:none; font-size:1rem; line-height:1.6; resize:vertical; font-family:inherit; }
.big-textarea:focus { outline:2px solid rgba(255,255,255,.5); }

/* 输入框 */
.input-wrap { display:flex; gap:12px; margin-bottom:16px; }
.answer-input { flex:1; padding:16px 20px; border:2px solid #e5e7eb; border-radius:16px; font-size:1.125rem; transition:all .2s; }
.answer-input:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.2); }
.submit-btn { padding:16px 32px; background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border:none; border-radius:16px; font-size:1rem; font-weight:700; cursor:pointer; transition:all .2s; box-shadow:0 4px 12px rgba(59,130,246,.3); }
.submit-btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(59,130,246,.4); }
.submit-btn.purple { background:linear-gradient(135deg,#a855f7,#ec4899); box-shadow:0 4px 12px rgba(168,85,247,.3); }
.submit-btn.purple:hover { box-shadow:0 8px 20px rgba(168,85,247,.4); }

/* 结果 */
.result-box { padding:20px; border-radius:16px; margin-bottom:16px; }
.result-box.correct { background:rgba(34,197,94,.15); }
.result-box.wrong { background:rgba(239,68,68,.15); }
.result-box .result-title { text-align:center; font-size:1.25rem; font-weight:700; margin-bottom:12px; }
.result-box.correct .result-title { color:#16a34a; }
.result-box.wrong .result-title { color:#dc2626; }
.result-box .result-answer { background:rgba(255,255,255,.2); border-radius:12px; padding:16px; }
.result-box .result-answer .ans-label { font-size:.875rem; opacity:.7; }
.result-box .result-answer .ans-val { font-size:1.5rem; font-weight:700; }
.next-btn { width:100%; padding:14px; background:#fff; color:#3b82f6; border:none; border-radius:16px; font-size:1rem; font-weight:700; cursor:pointer; transition:all .2s; box-shadow:0 4px 12px rgba(0,0,0,.1); }
.next-btn:hover { background:#f3f4f6; }
.next-btn.purple { color:#a855f7; }

/* 提示弹窗 */
.hint-btn { position:fixed; top:100px; right:16px; z-index:100; display:flex; align-items:center; gap:8px; padding:12px 20px; background:linear-gradient(135deg,#fbbf24,#f97316); color:#fff; font-weight:700; border:none; border-radius:999px; box-shadow:0 8px 24px rgba(251,191,36,.4); cursor:pointer; animation:bounceHint 1.5s infinite; }
.hint-btn:hover { animation:none; transform:scale(1.05); }
@keyframes bounceHint { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(4px); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal { background:#fff; border-radius:24px; padding:24px; max-width:480px; width:100%; box-shadow:0 25px 50px rgba(0,0,0,.25); }
.modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.modal-title { display:flex; align-items:center; gap:12px; font-size:1.25rem; font-weight:700; }
.modal-icon { width:40px; height:40px; background:linear-gradient(135deg,#fbbf24,#f97316); border-radius:12px; display:flex; align-items:center; justify-content:center; }
.modal-icon svg { width:20px; height:20px; fill:#fff; }
.modal-close { width:32px; height:32px; border:none; background:#f3f4f6; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-close:hover { background:#e5e7eb; }
.modal-body { background:linear-gradient(135deg,#fffbeb,#fff7ed); border-radius:16px; padding:20px; border-left:4px solid #fbbf24; }
.modal-body pre { font-family:inherit; white-space:pre-wrap; line-height:1.8; color:#374151; font-size:.9375rem; }
.modal-footer { text-align:center; margin-top:12px; font-size:.875rem; color:#9ca3af; }

.info-tag { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; background:#dbeafe; border-radius:999px; font-size:.875rem; color:#2563eb; }
.page-info { text-align:center; color:#9ca3af; font-size:.875rem; margin-top:16px; }
.auto-hint { color:#22c55e; margin-left:8px; }

.hidden { display:none !important; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============ 工具函数 ============
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function simplifyFraction(n, d) { const c = gcd(Math.abs(n), Math.abs(d)); return { numerator: n / c, denominator: d / c }; }

// ============ 年级列表 ============
const gradeList = [
  { name: '一年级', color: '#FF6B6B', description: '20以内加减法' },
  { name: '二年级', color: '#4ECDC4', description: '100以内加减法' },
  { name: '三年级', color: '#45B7D1', description: '乘法口诀、两位数加减法' },
  { name: '四年级', color: '#96CEB4', description: '三位数加减法、两位数乘一位数' },
  { name: '五年级', color: '#FFEAA7', description: '小数加减法、四则运算' },
  { name: '六年级', color: '#DDA0DD', description: '分数运算、比例' },
  { name: '七年级', color: '#98D8C8', description: '一元一次方程、有理数运算' },
  { name: '八年级', color: '#F7DC6F', description: '二元一次方程组、勾股定理' },
  { name: '九年级', color: '#BB8FCE', description: '一元二次方程、三角函数' },
];

// ============ 计算题生成器 ============
function generateGrade1Question(id) {
  const type = randomChoice(['addition', 'subtraction']);
  if (type === 'addition') { const a = randomInt(1, 10), b = randomInt(1, 10); return { id, grade: '一年级', type, expression: a + ' + ' + b + ' = ?', answer: a + b }; }
  else { const a = randomInt(1, 10), b = randomInt(1, a); return { id, grade: '一年级', type, expression: a + ' - ' + b + ' = ?', answer: a - b }; }
}
function generateGrade2Question(id) {
  const type = randomChoice(['addition', 'subtraction']);
  if (type === 'addition') { const a = randomInt(10, 50), b = randomInt(10, 50); return { id, grade: '二年级', type, expression: a + ' + ' + b + ' = ?', answer: a + b }; }
  else { const a = randomInt(20, 100), b = randomInt(10, a); return { id, grade: '二年级', type, expression: a + ' - ' + b + ' = ?', answer: a - b }; }
}
function generateGrade3Question(id) {
  const type = randomChoice(['addition', 'subtraction', 'multiplication']);
  if (type === 'addition') { const a = randomInt(10, 99), b = randomInt(10, 99); return { id, grade: '三年级', type, expression: a + ' + ' + b + ' = ?', answer: a + b }; }
  if (type === 'subtraction') { const a = randomInt(20, 99), b = randomInt(10, a); return { id, grade: '三年级', type, expression: a + ' - ' + b + ' = ?', answer: a - b }; }
  const a = randomInt(1, 9), b = randomInt(1, 9); return { id, grade: '三年级', type, expression: a + ' \u00d7 ' + b + ' = ?', answer: a * b };
}
function generateGrade4Question(id) {
  const type = randomChoice(['addition', 'subtraction', 'multiplication']);
  if (type === 'addition') { const a = randomInt(100, 500), b = randomInt(100, 500); return { id, grade: '四年级', type, expression: a + ' + ' + b + ' = ?', answer: a + b }; }
  if (type === 'subtraction') { const a = randomInt(200, 999), b = randomInt(100, a); return { id, grade: '四年级', type, expression: a + ' - ' + b + ' = ?', answer: a - b }; }
  const a = randomInt(10, 99), b = randomInt(1, 9); return { id, grade: '四年级', type, expression: a + ' \u00d7 ' + b + ' = ?', answer: a * b };
}
function generateGrade5Question(id) {
  const type = randomChoice(['addition', 'subtraction', 'multiplication', 'division']);
  if (type === 'addition') { const a = parseFloat((Math.random() * 9 + 1).toFixed(1)), b = parseFloat((Math.random() * 9 + 1).toFixed(1)); return { id, grade: '五年级', type, expression: a + ' + ' + b + ' = ?', answer: parseFloat((a + b).toFixed(1)) }; }
  if (type === 'subtraction') { const a = parseFloat((Math.random() * 9 + 1).toFixed(1)), b = parseFloat((Math.random() * a).toFixed(1)); return { id, grade: '五年级', type, expression: a + ' - ' + b + ' = ?', answer: parseFloat((a - b).toFixed(1)) }; }
  if (type === 'multiplication') { const a = randomInt(10, 20), b = randomInt(2, 9); return { id, grade: '五年级', type, expression: a + ' \u00d7 ' + b + ' = ?', answer: a * b }; }
  const b = randomInt(2, 9), ans = randomInt(10, 99), a = b * ans; return { id, grade: '五年级', type, expression: a + ' \u00f7 ' + b + ' = ?', answer: ans };
}
function generateGrade6Question(id) {
  const type = randomChoice(['addition', 'subtraction', 'multiplication', 'division']);
  if (type === 'addition') {
    const num1 = randomInt(1, 9), den1 = randomInt(2, 9), num2 = randomInt(1, 9), den2 = randomInt(2, 9);
    const ansN = num1 * den2 + num2 * den1, ansD = den1 * den2, simp = simplifyFraction(ansN, ansD);
    return { id, grade: '六年级', type, expression: '(' + num1 + '/' + den1 + ') + (' + num2 + '/' + den2 + ') = ?', answer: ansN / ansD, fractionAnswer: simp, hint: '\u8bf7\u8f93\u5165\u5206\u6570\u5f62\u5f0f\uff0c\u4f8b\u5982\uff1a5/6' };
  }
  if (type === 'subtraction') {
    const den1 = randomInt(2, 9), den2 = randomInt(2, 9), ansN = randomInt(1, 9), ansD = den1 * den2;
    const num2 = randomInt(1, Math.floor(ansN / den1) || 1), num1 = (ansN + num2 * den1) / den2;
    const fn1 = Math.floor(num1);
    if (Number.isInteger(num1) && fn1 > 0) {
      const simp = simplifyFraction(ansN, ansD);
      return { id, grade: '六年级', type, expression: '(' + fn1 + '/' + den1 + ') - (' + num2 + '/' + den2 + ') = ?', answer: ansN / ansD, fractionAnswer: simp, hint: '\u8bf7\u8f93\u5165\u5206\u6570\u5f62\u5f0f\uff0c\u4f8b\u5982\uff1a5/6' };
    }
    return generateGrade6Question(id);
  }
  if (type === 'multiplication') { const a = randomInt(10, 99), b = randomInt(10, 99); return { id, grade: '六年级', type, expression: a + ' \u00d7 ' + b + ' = ?', answer: a * b }; }
  const b = randomInt(10, 99), ans = randomInt(2, 9), a = b * ans; return { id, grade: '六年级', type, expression: a + ' \u00f7 ' + b + ' = ?', answer: ans };
}
function generateGrade7Question(id) {
  const type = randomChoice(['addition', 'subtraction', 'multiplication', 'equation']);
  if (type === 'addition') { const a = randomInt(-99, 99), b = randomInt(-99, 99); return { id, grade: '七年级', type, expression: a + ' + ' + b + ' = ?', answer: a + b }; }
  if (type === 'subtraction') { const a = randomInt(-99, 99), b = randomInt(-99, 99); return { id, grade: '七年级', type, expression: a + ' - ' + b + ' = ?', answer: a - b }; }
  if (type === 'multiplication') { const a = randomInt(-12, 12), b = randomInt(-12, 12); return { id, grade: '七年级', type, expression: a + ' \u00d7 ' + b + ' = ?', answer: a * b }; }
  const a = randomInt(2, 9), b = randomInt(10, 99); return { id, grade: '七年级', type, expression: a + 'x = ' + b + '\uff0c\u6c42 x = ?', answer: b / a };
}
function generateGrade8Question(id) {
  const type = randomChoice(['multiplication', 'division', 'equation']);
  if (type === 'multiplication') { const a = randomInt(10, 99), b = randomInt(10, 99); return { id, grade: '八年级', type, expression: a + ' \u00d7 ' + b + ' = ?', answer: a * b }; }
  if (type === 'division') { const b = randomInt(10, 49), ans = randomInt(2, 9), a = b * ans; return { id, grade: '八年级', type, expression: a + ' \u00f7 ' + b + ' = ?', answer: ans }; }
  const a = randomInt(2, 5), b = randomInt(10, 50), c = randomInt(1, 9); return { id, grade: '八年级', type, expression: a + 'x + ' + c + ' = ' + b + '\uff0c\u6c42 x = ?', answer: (b - c) / a };
}
function generateGrade9Question(id) {
  const type = randomChoice(['multiplication', 'equation']);
  if (type === 'multiplication') { const a = randomInt(10, 99), b = randomInt(10, 99); return { id, grade: '九年级', type, expression: a + ' \u00d7 ' + b + ' = ?', answer: a * b }; }
  const a = randomInt(1, 3), b = randomInt(-9, 9), c = randomInt(-99, 99);
  const disc = b * b - 4 * a * c;
  if (disc >= 0) { const ans = (-b + Math.sqrt(disc)) / (2 * a); return { id, grade: '九年级', type, expression: a + 'x\u00b2 + ' + b + 'x + ' + c + ' = 0\uff0c\u6c42 x = ?', answer: parseFloat(ans.toFixed(2)), hint: '\u8bf7\u8f93\u5165\u8f83\u5c0f\u7684\u90a3\u4e2a\u6839\uff08\u4fdd\u7559\u4e24\u4f4d\u5c0f\u6570\uff09' }; }
  return { id, grade: '九年级', type, expression: a + 'x\u00b2 + ' + b + 'x + ' + c + ' = 0\uff0c\u5224\u522b\u5f0f < 0\uff0c\u6c42\u5b9e\u6570\u6839\u7684\u4e2a\u6570', answer: 0, hint: '\u65e0\u5b9e\u6570\u6839\u65f6\u7b54\u6848\u4e3a0' };
}

const gradeGenerators = {
  '一年级': generateGrade1Question, '二年级': generateGrade2Question, '三年级': generateGrade3Question,
  '四年级': generateGrade4Question, '五年级': generateGrade5Question, '六年级': generateGrade6Question,
  '七年级': generateGrade7Question, '八年级': generateGrade8Question, '九年级': generateGrade9Question,
};
function generateQuestion(grade, id) { const g = gradeGenerators[grade]; return g ? g(id) : generateGrade1Question(id); }

// ============ 大题模板 ============
function makeBigQ(id, grade, title, desc, ans, sol, hint) { return { id, grade, title, description: desc, answer: ans, solution: sol, hint }; }
const bigTemplates = {

// ============ 渲染函数 ============
function render() {
  const app = document.getElementById('app');
  if (!state.currentGrade) {
    app.innerHTML = renderHome();
    return;
  }
  app.innerHTML = renderGame();
}

function renderHome() {
  let cards = gradeList.map(g => `
    <div class="grade-card" onclick="selectGrade('${g.name}')" style="color:${g.color}">
      <div class="color-bar" style="background:${g.color}"></div>
      <div style="margin-top:8px">
        <div class="grade-num" style="color:${g.color}">${g.name}</div>
        <div class="grade-desc">${g.description}</div>
      </div>
      <div class="arrow" style="font-size:1.5rem">&#8594;</div>
    </div>
  `).join('');

  return `
    <div class="container">
      <div class="text-center mb-12">
        <div class="hero-icon">
          <svg viewBox="0 0 24 24"><path d="M7 2h10v2H7V2zM5 6h14v2H5V6zm-2 4h18v12H3V10zm2 2v8h14v-8H5z"/></svg>
        </div>
        <h1 class="hero-title">数学小游戏</h1>
        <p class="hero-subtitle">选择你的年级，开始数学练习吧！</p>
      </div>
      <div class="grid">${cards}</div>
      <div class="text-center mt-12">
        <div class="info-tag">&#128161; 提示：每个年级都有对应的数学知识点哦</div>
      </div>
    </div>
  `;
}

function renderGame() {
  const q = state.currentQuestion;
  const bq = state.currentBigQuestion;
  if (!q || !bq) return '<div class="container"><div class="text-center">加载中...</div></div>';

  const acc = state.totalQuestions > 0 ? Math.round((state.score / state.totalQuestions) * 100) : 0;
  const isResultShowing = state.activeTab === 'calc' ? state.showResult : state.showBigResult;
  const currentHint = state.activeTab === 'calc' ? (q.hint || '这是一道计算题，请认真计算。') : bq.hint;

  return `
    <div class="container">
      <div class="header">
        <button class="btn" onclick="goHome()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          返回首页
        </button>
        <div class="flex" style="gap:12px">
          <div class="stat-box"><span class="stat-val">${state.score}</span><span class="stat-label">正确</span></div>
          <div class="stat-box"><span class="stat-val">${acc}%</span><span class="stat-label">正确率</span></div>
        </div>
      </div>

      <div class="tabs">
        <div class="tabs-inner">
          <button class="tab-btn ${state.activeTab === 'calc' ? 'active' : ''}" onclick="switchTab('calc')">&#128290; 计算题</button>
          <button class="tab-btn ${state.activeTab === 'big' ? 'active purple' : ''}" onclick="switchTab('big')">&#128221; 大题</button>
        </div>
      </div>

      <div style="max-width:640px;margin:0 auto;position:relative">
        ${state.isIdle && !isResultShowing ? `
          <button class="hint-btn" onclick="showHintModal()" onmouseenter="state.isHoveringHint=true" onmouseleave="state.isHoveringHint=false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            需要帮助吗？
          </button>
        ` : ''}

        ${state.activeTab === 'calc' ? renderCalcTab(q) : renderBigTab(bq)}

        <div class="page-info">
          第 ${state.activeTab === 'calc' ? q.id : bq.id} 题 · 共答 ${state.totalQuestions} 题
          ${(state.activeTab === 'calc' ? state.isAnswerCorrect === true : state.isBigCorrect === true) ? '<span class="auto-hint">· 1.5秒后自动跳转下一题...</span>' : ''}
        </div>
      </div>
    </div>

    ${state.hintModalOpen ? `
      <div class="modal-overlay" onclick="closeHintModal()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-header">
            <div class="modal-title">
              <div class="modal-icon"><svg viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg></div>
              解题思路
            </div>
            <button class="modal-close" onclick="closeHintModal()">&#10005;</button>
          </div>
          <div class="modal-body"><pre>${currentHint}</pre></div>
          <div class="modal-footer">加油！你一定可以的 &#128170;</div>
        </div>
      </div>
    ` : ''}
  `;
}

function renderCalcTab(q) {
  return `
    <div class="q-card">
      <div class="q-header">
        <div class="q-icon"><svg viewBox="0 0 24 24"><path d="M7 2h10v2H7V2zM5 6h14v2H5V6zm-2 4h18v12H3V10zm2 2v8h14v-8H5z"/></svg></div>
        <div><div class="q-type">${q.grade}</div><div class="q-title">计算题</div></div>
      </div>
      <div class="q-expr">${q.expression}</div>
      ${q.hint ? '<div class="q-hint">' + q.hint + '</div>' : ''}
    </div>

    ${!state.showResult ? `
      <div class="input-wrap">
        <input type="text" id="calcInput" class="answer-input" placeholder="输入答案，按回车提交" onkeydown="if(event.key==='Enter')submitCalc()">
        <button class="submit-btn" onclick="submitCalc()">提交</button>
      </div>
    ` : `
      <div class="result-box ${state.isAnswerCorrect ? 'correct' : 'wrong'}">
        <div class="result-title">${state.isAnswerCorrect ? '\u1f389 回答正确！' : '\u274c 回答错误'}</div>
        ${!state.isAnswerCorrect ? `
          <div class="result-answer">
            <div class="ans-label">正确答案</div>
            <div class="ans-val">${q.fractionAnswer ? q.fractionAnswer.numerator + '/' + q.fractionAnswer.denominator : q.answer}</div>
          </div>
        ` : ''}
      </div>
      <button class="next-btn" onclick="nextCalc()">下一题 &#8594;</button>
    `}
  `;
}

function renderBigTab(bq) {
  return `
    <div class="q-card purple">
      <div class="q-header">
        <div class="q-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></div>
        <div><div class="q-type">大题</div><div class="q-title">${bq.title}</div></div>
      </div>
      <div class="big-desc">${bq.description}</div>

      ${!state.showBigResult ? `
        <div class="big-label">解：</div>
        <textarea class="big-textarea" id="bigInput" placeholder="在这里写下你的解题过程...">${state.bigAnswer}</textarea>
        <button class="submit-btn purple" style="width:100%;margin-top:12px" onclick="submitBig()">提交答案</button>
      ` : `
        <div class="result-box ${state.isBigCorrect ? 'correct' : 'wrong'}">
          <div class="result-title">${state.isBigCorrect ? '\u1f389 回答正确！' : '\u1f4a1 参考答案'}</div>
          <div class="result-answer">
            <pre style="white-space:pre-wrap;line-height:1.6;font-family:inherit;font-size:.875rem">${bq.solution}</pre>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3)">
              <span style="opacity:.7;font-size:.875rem">最终答案：</span>
              <span style="font-size:1.25rem;font-weight:700">${bq.answer}</span>
            </div>
          </div>
        </div>
        <button class="next-btn purple" onclick="nextBig()">下一题 &#8594;</button>
      `}
    </div>
  `;
}

// ============ 交互函数 ============
window.selectGrade = function(grade) {
  state.currentGrade = grade;
  state.currentQuestion = generateQuestion(grade, 1);
  state.currentBigQuestion = generateBigQuestion(grade, 1);
  state.score = 0; state.totalQuestions = 0;
  state.isAnswerCorrect = null; state.showResult = false;
  state.bigAnswer = ''; state.isBigCorrect = null; state.showBigResult = false;
  state.activeTab = 'calc'; state.isIdle = false;
  render();
};

window.goHome = function() {
  state.currentGrade = ''; state.currentQuestion = null; state.currentBigQuestion = null;
  state.score = 0; state.totalQuestions = 0;
  state.isAnswerCorrect = null; state.showResult = false;
  state.bigAnswer = ''; state.isBigCorrect = null; state.showBigResult = false;
  state.activeTab = 'calc';
  render();
};

window.switchTab = function(tab) {
  state.activeTab = tab;
  render();
};

window.submitCalc = function() {
  const input = document.getElementById('calcInput');
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;

  const q = state.currentQuestion;
  state.totalQuestions++;

  let correct = false;
  if (q.fractionAnswer) {
    const parts = val.split('/');
    if (parts.length === 2) {
      const un = parseInt(parts[0]), ud = parseInt(parts[1]);
      if (!isNaN(un) && !isNaN(ud) && ud !== 0) {
        const simp = simplifyFraction(un, ud);
        correct = simp.numerator === q.fractionAnswer.numerator && simp.denominator === q.fractionAnswer.denominator;
      }
    }
    if (!correct) {
      const num = parseFloat(val);
      if (!isNaN(num)) correct = Math.abs(num - q.answer) < 0.0001;
    }
  } else {
    const num = parseFloat(val);
    if (!isNaN(num)) correct = Math.abs(num - q.answer) < 0.01;
  }

  if (correct) state.score++;
  state.isAnswerCorrect = correct;
  state.showResult = true;
  render();

  if (correct) {
    state.autoNextTimer = setTimeout(() => nextCalc(), 1500);
  }
};

window.nextCalc = function() {
  clearTimeout(state.autoNextTimer);
  if (!state.currentGrade || !state.currentQuestion) return;
  state.currentQuestion = generateQuestion(state.currentGrade, state.currentQuestion.id + 1);
  state.isAnswerCorrect = null; state.showResult = false;
  render();
};

window.submitBig = function() {
  const input = document.getElementById('bigInput');
  if (!input) return;
  const val = input.value.trim();
  state.bigAnswer = val;

  const bq = state.currentBigQuestion;
  state.totalQuestions++;

  const match = val.match(/-?\d+\.?\d*/);
  const userAns = match ? parseFloat(match[0]) : NaN;
  const correct = !isNaN(userAns) && Math.abs(userAns - bq.answer) < 0.1;

  if (correct) state.score++;
  state.isBigCorrect = correct;
  state.showBigResult = true;
  render();

  if (correct) {
    state.autoNextTimer = setTimeout(() => nextBig(), 1500);
  }
};

window.nextBig = function() {
  clearTimeout(state.autoNextTimer);
  if (!state.currentGrade || !state.currentBigQuestion) return;
  state.currentBigQuestion = generateBigQuestion(state.currentGrade, state.currentBigQuestion.id + 1);
  state.bigAnswer = ''; state.isBigCorrect = null; state.showBigResult = false;
  render();
};

window.showHintModal = function() {
  state.hintModalOpen = true;
  render();
};

window.closeHintModal = function() {
  state.hintModalOpen = false;
  render();
};

// ============ 初始化 ============
render();
setupIdleListeners();
</script>
</body>
</html>
