    window.__INLINE_DATA__ = {"/data/game-configs/game-1.json":{"id":"game-1","title":"规则工厂 vs 学习工厂","description":"通过对比手动编写规则和让AI从数据中学习，理解规则编程与机器学习的本质区别","type":"contrast","stage":1,"order":1,"estimatedMinutes":20,"knowledgePoints":["规则编程 vs 机器学习的区别","AI从数据中自动学习规律","边界情况的处理"],"gameConfig":{"testItems":[{"id":"f1","image":"🍎","label":"红苹果","category":"水果","color":"红色","shape":"圆形","isEdgeCase":false},{"id":"f2","image":"🍌","label":"香蕉","category":"水果","color":"黄色","shape":"长条形","isEdgeCase":false},{"id":"f3","image":"🥕","label":"胡萝卜","category":"蔬菜","color":"橙色","shape":"长条形","isEdgeCase":false},{"id":"f4","image":"🍏","label":"青苹果","category":"水果","color":"绿色","shape":"圆形","isEdgeCase":true},{"id":"v1","image":"🍐","label":"梨","category":"水果","color":"黄色","shape":"梨形","isEdgeCase":false},{"id":"v2","image":"🍒","label":"樱桃","category":"水果","color":"红色","shape":"圆形","isEdgeCase":false}],"trainingData":[{"features":{"color":"红色","shape":"圆形"},"label":"水果"},{"features":{"color":"黄色","shape":"长条形"},"label":"水果"},{"features":{"color":"橙色","shape":"长条形"},"label":"蔬菜"},{"features":{"color":"黄色","shape":"梨形"},"label":"水果"},{"features":{"color":"红色","shape":"圆形"},"label":"水果"},{"features":{"color":"绿色","shape":"圆形"},"label":"水果"},{"features":{"color":"紫色","shape":"长条形"},"label":"蔬菜"},{"features":{"color":"绿色","shape":"圆形"},"label":"水果"}],"ruleFactory":{"maxRules":5,"availableConditions":[{"field":"color","options":["红色","黄色","绿色","橙色","紫色"]},{"field":"shape","options":["圆形","长条形","梨形"]}],"availableCategories":["水果","蔬菜"]},"learningFactory":{"trainingRounds":3,"learnedPattern":"AI学会了：大多数圆形的是水果，长条形的需要看颜色来判断"},"boundaryCase":{"itemId":"f4","description":"青苹果 - 绿色但是圆形，是水果不是蔬菜","ruleFactoryResult":{"reason":"如果你的规则只看颜色（绿色=蔬菜），就会把青苹果错误分类为蔬菜"},"learningFactoryResult":{"reason":"AI从训练数据中学到圆形的通常是水果，所以能正确识别青苹果"}},"scoring":{"criteria":[{"name":"规则数量","description":"使用尽量少的规则覆盖更多情况","weight":0.3},{"name":"准确率","description":"规则工厂的分类准确率","weight":0.4},{"name":"反思深度","description":"反思环节回答的深度","weight":0.3}]}},"reflectionPanel":{"type":"standard","questions":[{"id":"q1","question":"规则工厂和学习工厂，哪个处理青苹果更好？为什么？","hint":"想想规则工厂为什么会在青苹果上出错","required":true},{"id":"q2","question":"如果你是程序员，你会选择写规则还是让AI学习？说说你的理由。","hint":"考虑不同场景下的优缺点","required":true},{"id":"q3","question":"在生活中，你能想到哪些事情适合用规则处理，哪些适合让AI学习？","hint":"比如：红绿灯是规则，语音助手是AI学习","required":false}],"keyInsight":"规则编程需要人类把所有规律都写出来，遇到意外情况就容易出错；而AI可以从大量数据中自动发现规律，包括人类可能忽略的特殊情况。但AI也有局限——它只能从见过的数据中学习，遇到完全没见过的情况也可能犯错。"}},"/data/game-configs/game-10.json":{"id":"game-10","title":"工具匹配","description":"为AI Agent选择正确的工具，理解工具调用机制","type":"tool-matching","stage":4,"order":10,"estimatedMinutes":20,"knowledgePoints":["Agent工具选择","工具描述匹配","任务分解"],"gameConfig":{"tools":[{"id":"search","name":"网络搜索","icon":"🔍","description":"搜索互联网，获取最新的实时信息和网页内容","type":"搜索"},{"id":"calculate","name":"计算器","icon":"🔢","description":"执行数学计算，处理数值运算、统计和公式求解","type":"计算"},{"id":"translate","name":"翻译器","icon":"🌐","description":"在不同语言之间进行文本翻译与转换","type":"翻译"},{"id":"summarize","name":"摘要工具","icon":"📝","description":"将长文本压缩提炼为简短的摘要与核心要点","type":"总结"},{"id":"code","name":"代码执行器","icon":"💻","description":"执行编程代码，运行脚本和程序完成数据分析","type":"编程"},{"id":"draw","name":"画图工具","icon":"🎨","description":"生成图片、图表和可视化图形","type":"绘图"}],"tasks":[{"id":"task-1","description":"查找2024年巴黎奥运会的最新举办信息","correctToolId":"search","hint":"任务需要获取互联网上的实时资讯"},{"id":"task-2","description":"计算班级平均分：40名同学数学成绩的统计与方差求解","correctToolId":"calculate","hint":"涉及数值运算和统计计算"},{"id":"task-3","description":"翻译一篇英文文章：将科技报道译为中文","correctToolId":"translate","hint":"需要在两种语言之间转换文本"},{"id":"task-4","description":"为一份100页的行业研究报告提炼核心要点","correctToolId":"summarize","hint":"需要把长文本压缩成简短内容"},{"id":"task-5","description":"运行Python脚本分析销售数据的增长趋势","correctToolId":"code","hint":"需要执行程序代码来完成分析"}],"scoring":{"criteria":[{"name":"工具匹配率","description":"能否为任务选择最合适的工具，体现对工具能力的理解","weight":0.4},{"name":"任务理解","description":"能否准确分析任务需求并匹配工具的核心功能","weight":0.35},{"name":"反思深度","description":"对Agent工具调用机制和任务分解的思考深度","weight":0.25}]}},"reflectionPanel":{"type":"standard","questions":[{"id":"q1","question":"你是根据什么来判断一个任务应该使用哪种工具的？","hint":"思考任务的关键动作与工具核心能力之间的匹配关系","required":true},{"id":"q2","question":"为什么AI Agent需要调用外部工具，而不是仅凭语言模型直接回答？","hint":"想想语言模型的能力边界，比如实时信息、精确计算、执行代码","required":true},{"id":"q3","question":"如果一个任务需要多个工具配合完成，你会如何规划它们的调用顺序？","hint":"考虑任务分解、工具间的依赖关系和数据传递","required":false}],"keyInsight":"AI Agent 的强大不在于'无所不知'，而在于'善用工具'。语言模型本身存在能力边界——它无法获取实时信息、不能保证数学计算完全准确、也无法直接执行代码或作图。Agent 通过'理解任务→匹配工具→调用执行→整合结果'的流程，把合适的工作交给合适的工具，从而突破单一模型的能力边界。其中，工具描述的质量直接决定 Agent 能否选对工具——这正是'工具描述匹配'成为 Agent 开发核心技能的原因。"}},"/data/game-configs/game-11.json":{"id":"game-11","title":"多工具协作","description":"设计多工具协作流程，理解Agent如何链式调用工具完成复杂任务","type":"多工具协作","stage":4,"order":11,"estimatedMinutes":25,"knowledgePoints":["多工具协作","工具链设计","任务分解与编排"],"gameConfig":{"tools":[{"id":"search","name":"网络搜索","description":"从互联网检索和获取相关信息资料","icon":"🔍","type":"搜索"},{"id":"calculate","name":"计算器","description":"执行数学运算和统计分析计算","icon":"🔢","type":"计算"},{"id":"translate","name":"翻译器","description":"在中文、英文等多种语言之间翻译文本","icon":"🌐","type":"翻译"},{"id":"draw","name":"画图工具","description":"生成图表和可视化图像","icon":"🎨","type":"绘图"},{"id":"summarize","name":"摘要工具","description":"提炼长文本的核心要点并生成摘要","icon":"📝","type":"总结"},{"id":"code","name":"代码执行器","description":"编写和运行程序代码处理数据","icon":"💻","type":"编程"}],"challenges":[{"id":"challenge-1","description":"写一篇关于气候变化的英文报告","correctSequence":["search","translate","summarize"],"explanation":"先搜索资料 → 翻译英文资料 → 总结成报告"},{"id":"challenge-2","description":"分析全班数学成绩并生成可视化图表","correctSequence":["calculate","draw","summarize"],"explanation":"先计算成绩统计 → 绘制分布图表 → 总结分析结论"},{"id":"challenge-3","description":"用代码实现数据清洗与统计流程","correctSequence":["search","code","calculate"],"explanation":"先搜索处理方法 → 编写清洗代码 → 计算验证结果"}],"scoring":{"criteria":[{"name":"工具链设计","description":"是否合理选择工具并按正确顺序编排协作链","weight":0.4},{"name":"执行效果","description":"工具链执行任务的顺畅度与效率","weight":0.3},{"name":"反思深度","description":"对多工具协作与任务分解原理的理解深度","weight":0.3}]}},"reflectionPanel":{"type":"标准","questions":[{"id":"q1","question":"你是如何把一个复杂任务拆解成多个步骤，并决定每一步需要哪个工具的？","hint":"想想任务的输入、中间产物和最终目标之间的关系","required":true},{"id":"q2","question":"为什么工具的调用顺序很重要？如果顺序颠倒了会出现什么问题？","hint":"考虑上一步的输出是否是下一步的输入","required":true},{"id":"q3","question":"Agent是如何判断该在何时调用下一个工具的？请结合你的执行体验说明。","hint":"想想思维链、中间结果验证和任务编排","required":false}],"keyInsight":"多工具协作是AI Agent完成复杂任务的核心能力。面对一个复杂任务，Agent会先把它分解成若干子任务，再为每个子任务选择合适的工具，并按照“上一步的输出是下一步的输入”的依赖关系编排成一条工具链。工具的选择要匹配子任务的需求，顺序要符合数据流向——顺序错了，就像先装修再打地基，后续步骤无法进行。理解了任务分解与工具编排，你就能设计出高效可靠的Agent工作流。"}},"/data/game-configs/game-12.json":{"id":"game-12","title":"单Agent局限","description":"体验单个AI Agent处理复杂任务时的局限性，理解为什么需要多Agent协作","type":"单Agent局限","stage":4,"order":12,"estimatedMinutes":20,"knowledgePoints":["单Agent的能力边界","多Agent协作的必要性","任务复杂度与Agent能力"],"gameConfig":{"scenarios":[{"id":"scenario-1","name":"研究报告","description":"完成一份关于AI发展史的研究报告","singleAgentResult":{"success":false,"time":"15分钟","quality":60,"issues":["知识面有限，难以覆盖所有领域","无法同时搜索和整理，只能串行处理","上下文切换频繁，容易遗漏要点"]},"multiAgentResult":{"success":true,"time":"5分钟","quality":92,"advantages":["分工明确，各Agent专注自己的领域","并行处理，搜索与整理同时进行","结果交叉验证，质量更高"]},"comparison":"单Agent需要串行完成搜索、整理、撰写，容易顾此失彼；多Agent可以分工并行，研究员负责搜集资料、分析师负责提炼观点、编辑负责撰写成文，效率和质量都大幅提升。"},{"id":"scenario-2","name":"市场调研分析","description":"对某新产品的目标市场进行调研分析并给出推广建议","singleAgentResult":{"success":false,"time":"20分钟","quality":55,"issues":["数据收集与分析相互阻塞，流程卡顿","缺乏专业视角，建议停留在表面","报告与策略反复修改，耗时严重"]},"multiAgentResult":{"success":true,"time":"6分钟","quality":90,"advantages":["数据、分析、策略各司其职","结果可交叉验证，减少偏差","并行作业，整体推进更顺畅"]},"comparison":"市场调研涉及数据采集、趋势分析、策略制定等多个专业环节，单Agent容易在环节切换中丢失上下文；多Agent团队可以让数据员、分析师、策略师并行工作，结论更专业也更可靠。"},{"id":"scenario-3","name":"软件开发项目","description":"开发一个待办事项Web应用并完成测试上线","singleAgentResult":{"success":false,"time":"30分钟","quality":50,"issues":["前后端切换上下文损耗大","无法边写代码边测试，问题晚发现","一个人包揽全流程，质量难以保证"]},"multiAgentResult":{"success":true,"time":"8分钟","quality":88,"advantages":["前端、后端、测试并行推进","测试Agent实时反馈，问题早暴露","代码评审交叉进行，质量更高"]},"comparison":"软件开发是典型的多角色协作任务，单Agent在前后端与测试之间反复切换，效率低、Bug多；多Agent团队让前端工程师、后端工程师、测试工程师各司其职并行开发，交付速度和代码质量都明显更好。"}],"scoring":{"criteria":[{"name":"理解深度","description":"是否理解单Agent的能力边界与多Agent协作的必要性","weight":0.35},{"name":"对比分析","description":"能否准确分析单Agent与多Agent在不同任务上的效果差异","weight":0.35},{"name":"反思深度","description":"对任务复杂度与Agent能力匹配关系的反思质量","weight":0.3}]}},"reflectionPanel":{"type":"标准","questions":[{"id":"q1","question":"在刚才的场景中，单Agent处理复杂任务时主要遇到了哪些问题？这些问题为什么会出现？","hint":"想想串行处理、上下文切换和能力边界","required":true},{"id":"q2","question":"多Agent协作是如何解决单Agent的局限的？请结合执行过程举例说明分工与并行带来的好处。","hint":"考虑任务分解、角色分工、并行执行和结果交叉验证","required":true},{"id":"q3","question":"是不是所有任务都适合用多Agent？什么样的任务用单Agent就足够，什么样的任务必须多Agent协作？","hint":"想想任务的复杂度、是否需要多种专业能力、是否可以并行","required":false}],"keyInsight":"单个AI Agent虽然强大，但面对需要多种专业能力、可并行处理的复杂任务时，会暴露出能力边界：它只能串行处理、频繁切换上下文、难以兼顾多个环节。多Agent协作通过任务分解、角色分工和并行执行，让每个Agent专注于自己擅长的部分，再通过通信与交叉验证整合结果，从而在效率和质量上都远超单Agent。理解任务复杂度与Agent能力的匹配关系，是设计高效AI系统的关键——简单任务用单Agent即可，复杂任务则需要多Agent协作。"}},"/data/game-configs/game-13.json":{"id":"game-13","title":"AI小队组建","description":"组建自己的AI小队，为不同任务分配合适的Agent角色","type":"团队组建","stage":5,"order":13,"estimatedMinutes":25,"knowledgePoints":["Agent角色分工","团队能力互补","协作模式设计"],"gameConfig":{"agentPool":[{"id":"researcher","name":"研究员","role":"信息搜集","skills":["搜索","分析"],"icon":"🔍"},{"id":"analyst","name":"分析师","role":"数据分析","skills":["统计","建模","洞察"],"icon":"📊"},{"id":"writer","name":"文案","role":"内容创作","skills":["写作","润色"],"icon":"✍️"},{"id":"designer","name":"设计师","role":"视觉设计","skills":["绘图","排版"],"icon":"🎨"},{"id":"coder","name":"程序员","role":"代码开发","skills":["编程","调试"],"icon":"💻"},{"id":"planner","name":"规划师","role":"任务统筹","skills":["拆解","调度"],"icon":"📋"},{"id":"reviewer","name":"审核员","role":"质量把控","skills":["校对","评估"],"icon":"✅"},{"id":"translator","name":"翻译官","role":"语言转换","skills":["翻译","本地化"],"icon":"🌐"}],"missions":[{"id":"mission-1","name":"市场调研报告","description":"撰写一份关于新能源汽车市场的深度调研报告，需要搜集资料、分析数据并成文输出","requiredRoles":["researcher","analyst","writer"],"maxAgents":4},{"id":"mission-2","name":"软件产品开发","description":"开发一个在线学习网站的核心功能模块，需要统筹规划、编码实现、界面设计与质量审核","requiredRoles":["planner","coder","designer","reviewer"],"maxAgents":5},{"id":"mission-3","name":"跨语言内容出海","description":"将公司的中文产品资料翻译并本地化为多语言版本，需要资料调研、翻译转换、视觉适配与最终审核","requiredRoles":["researcher","translator","designer","reviewer"],"maxAgents":5}],"scoring":{"criteria":[{"name":"团队设计","description":"是否根据任务需求合理挑选角色，团队规模与分工是否恰当","weight":0.4},{"name":"角色匹配","description":"所选Agent是否覆盖任务所需的关键角色与核心技能","weight":0.35},{"name":"反思深度","description":"对Agent角色分工、能力互补与协作模式设计的理解深度","weight":0.25}]}},"reflectionPanel":{"type":"标准","questions":[{"id":"q1","question":"你是如何根据任务需求，决定需要挑选哪些Agent角色的？","hint":"想想任务的关键环节，以及每个角色的核心能力是否与之对应","required":true},{"id":"q2","question":"如果团队中缺少某个关键角色，会对任务完成产生什么影响？你会如何弥补？","hint":"考虑角色之间的能力互补与替代关系，以及技能覆盖度","required":true},{"id":"q3","question":"多Agent协作相比单Agent，在效率和效果上有哪些优势？又可能带来什么挑战？","hint":"想想分工带来的专业收益，以及通信成本与冲突协调","required":false}],"keyInsight":"组建AI小队的核心是“按需配人、能力互补”。面对一个复杂任务，先拆解出关键环节，再为每个环节挑选最擅长的Agent角色——研究员负责搜集信息、分析师负责挖掘规律、文案负责成稿输出、审核员负责质量把关。团队成员的技能应当相互补充而非重叠，从而覆盖任务所需的全部能力。同时，还要设计Agent之间的信息流转顺序，让前一步的产出成为后一步的输入，形成顺畅的协作链。理解了角色分工与能力互补，你就能像优秀的项目经理一样，组建出一支高效协同的AI小队。"}},"/data/game-configs/game-14.json":{"id":"game-14","title":"AI小队挑战赛","description":"指挥AI小队完成复杂挑战，体验多Agent协作的完整流程","type":"挑战赛","stage":5,"order":14,"estimatedMinutes":30,"knowledgePoints":["多Agent协作全流程","冲突解决与协调","复杂任务编排"],"gameConfig":{"challenges":[{"id":"challenge-1","name":"新闻报道","description":"完成一篇关于校园运动会的新闻报道","difficulty":"中等","phases":["采访","写作","编辑","审核"],"successCriteria":{"accuracy":0.8,"completeness":0.85,"timeliness":0.9}},{"id":"challenge-2","name":"新品发布会","description":"策划并执行一场科技新品发布会的全套内容","difficulty":"困难","phases":["市场调研","方案策划","内容制作","终审发布"],"successCriteria":{"accuracy":0.85,"completeness":0.9,"timeliness":0.8}},{"id":"challenge-3","name":"科普短视频","description":"制作一支关于人工智能的科普短视频","difficulty":"中等","phases":["选题调研","脚本撰写","视频制作","质量审核"],"successCriteria":{"accuracy":0.8,"completeness":0.8,"timeliness":0.85}}],"agentRoles":[{"id":"reporter","name":"记者","role":"记者","icon":"📰","skills":["采访","信息收集","提问"],"description":"擅长采访与信息收集，负责一线资料获取与现场记录"},{"id":"editor","name":"编辑","role":"编辑","icon":"✍️","skills":["写作","编辑","文案"],"description":"擅长文字撰写与编辑，负责内容打磨与结构组织"},{"id":"reviewer","name":"审核员","role":"审核员","icon":"✅","skills":["审核","校对","质量把控"],"description":"负责质量审核与校对，确保内容准确合规、符合标准"},{"id":"photographer","name":"摄影师","role":"摄影师","icon":"📷","skills":["拍摄","视觉设计","素材采集"],"description":"负责视觉素材采集与设计，提供图像与多媒体支持"},{"id":"coordinator","name":"协调员","role":"协调员","icon":"🤝","skills":["协调","任务分配","冲突解决"],"description":"负责团队协调与冲突解决，保障协作流程顺畅高效"}],"scoring":{"criteria":[{"name":"任务规划","description":"能否合理拆解任务并为每个阶段匹配合适的Agent角色","weight":0.4},{"name":"协作效果","description":"多Agent协作执行的顺畅度、冲突处理与产出质量","weight":0.35},{"name":"反思深度","description":"对多Agent协作全流程与冲突协调机制的理解深度","weight":0.25}]}},"reflectionPanel":{"type":"标准","questions":[{"id":"q1","question":"在规划阶段，你是如何决定每个执行阶段由哪个Agent角色负责的？依据是什么？","hint":"想想每个角色的核心能力与阶段任务之间的匹配关系","required":true},{"id":"q2","question":"当多个Agent协作时，如果出现意见分歧或任务冲突，应该如何协调解决？","hint":"考虑协调员的作用、优先级排序以及折中方案的制定","required":true},{"id":"q3","question":"不同的任务编排方案会带来怎样的产出差异？这对设计真实的多Agent系统有什么启发？","hint":"想想角色组合、执行顺序对最终结果质量和效率的影响","required":false}],"keyInsight":"多Agent协作是AI完成复杂任务的终极形态。一个完整的多Agent系统包含四个核心环节：任务分解（把大目标拆成可并行的子任务）、角色分工（按能力匹配Agent，让专业的人做专业的事）、协作通信（Agent之间传递中间结果、协商方案）和冲突协调（当意见不一时由协调者裁决或折中）。成功的协作不只取决于每个Agent有多强，更取决于编排是否合理——角色搭配、执行顺序、冲突处理机制共同决定了最终产出。从单Agent到多Agent，AI的能力从‘独自完成’升级为‘团队作战’，这正是构建真实AI智能体系统的核心思想。"}},"/data/game-configs/game-15.json":{"id":"game-15","title":"AI系统设计师","description":"运用你学到的所有AI知识，设计一个完整的AI系统来解决真实问题","stage":5,"type":"graduation","domains":[{"id":"customer-service","name":"智能客服","icon":"💬","description":"为一家电商公司设计AI客服系统，能理解用户问题并给出准确回答","requirements":["需要理解用户意图","需要产品知识库","需要多轮对话能力","需要人工转接机制"],"correctDataSources":["product-catalog","faq","chat-history "跳过清洗——直接用原始数据训练，节省时间","correct":false,"feedback":"不太对哦。跳过清洗会让噪声数据影响模型，导致准确率下降。"}]},{"id":"q2","question":"噪声数据对AI模型有什么影响？","hint":"对比清洗前后的模型表现","required":true,"type":"choice","options":[{"id":"a","text":"噪声数据会让AI学到错误规律，降低准确率","correct":true,"feedback":"正确！噪声数据就像错误的教科书，AI会学到错误的知识。"},{"id":"b","text":"噪声数据对模型没有影响，AI能自动忽略","correct":false,"feedback":"不对哦。AI无法自动区分正确和错误数据，会把噪声也当作规律学习。"},{"id":"c","text":"噪声数据越多，模型越聪明","correct":false,"feedback":"错误。噪声数据越多，模型学到错误规律越多，准确率越低。"}]},{"id":"q3","question":"在真实的AI项目中，如何预防噪声数据？","hint":"考虑数据收集、标注、审核等环节","required":false,"type":"choice","options":[{"id":"a","text":"只靠一种方式就够了","correct":false,"feedback":"单一方式难以覆盖所有问题，实际项目需要多环节配合。"},{"id":"b","text":"从数据收集、标注规范、多人审核等多环节联合把控","correct":true,"feedback":"正确！专业AI团队会在数据收集、标注规范、多人交叉审核等环节层层把关。"},{"id":"c","text":"等模型训练完再发现问题处理","correct":false,"feedback":"不推荐。事后发现问题成本很高，最好在数据阶段就做好预防。"}]}],"keyInsight":"噪声数据就像错误的教科书，会让AI学到错误的知识。数据清洗是AI工程中不可或缺的一环，虽然耗时，但能显著提升模型质量。专业的AI团队会投入大量精力进行数据质量检查和清洗工作。"}},"/data/game-configs/game-5.json":{"id":"game-5","title":"训练进度条","description":"通过迷宫实验理解过拟合现象，学习如何平衡训练性能和泛化能力","type":"overfitting","stage":2,"order":5,"estimatedMinutes":25,"knowledgePoints":["过拟合是指模型在训练数据上表现很好，但在新数据上表现差","训练轮数过多容易导致过拟合","验证集用于检测过拟合","泛化能力是模型的核心指标"],"gameConfig":{"mazeScenarios":[{"id":"scenario-1","name":"简单迷宫","description":"一个3x3的小迷宫","gridSize":3,"trainingExamples":5,"testExamples":10},{"id":"scenario-2","name":"中等迷宫","description":"一个5x5的中等迷宫","gridSize":5,"trainingExamples":10,"testExamples":15},{"id":"scenario-3","name":"复杂迷宫","description":"一个7x7的复杂迷宫","gridSize":7,"trainingExamples":15,"testExamples":20}],"trainingStrategies":[{"id":"欠拟合","name":"欠拟合策略","description":"训练轮数太少，模型没学会","icon":"📉","epochs":5,"expectedTrainAcc":0.6,"expectedTestAcc":0.55,"color":"#ef4444"},{"id":"平衡","name":"平衡策略","description":"训练轮数适中，模型泛化好","icon":"⚖️","epochs":20,"expectedTrainAcc":0.85,"expectedTestAcc":0.82,"color":"#10b981"},{"id":"过拟合","name":"过拟合策略","description":"训练轮数太多，模型死记硬背","icon":"📈","epochs":50,"expectedTrainAcc":0.98,"expectedTestAcc":0.65,"color":"#f59e0b"}],"trainingParams":{"learningRate":0.01,"batchSize":8,"validationSplit":0.2},"scoring":{"criteria":[{"name":"策略选择","description":"是否选择了平衡策略","weight":0.3},{"name":"测试准确率","description":"模型在新迷宫上的表现","weight":0.3},{"name":"过拟合识别","description":"能否识别过拟合现象","weight":0.2},{"name":"反思深度","description":"对过拟合的理解深度","weight":0.2}]}},"reflectionPanel":{"type":"standard","questions":[{"id":"q1","question":"你选择了哪种训练策略？训练准确率和测试准确率分别是多少？","hint":"记录你观察到的数据","required":true},{"id":"q2","question":"为什么训练准确率高但测试准确率低的现象叫做'过拟合'？","hint":"想想学生在考试前死记硬背的情况","required":true},{"id":"q3","question":"在真实的AI训练中，如何避免过拟合？","hint":"考虑验证集、早停、正则化等方法","required":false}],"keyInsight":"过拟合是AI学习中的常见问题，就像学生死记硬背答案但不懂原理一样。真正好的AI模型不是'记住'训练数据，而是'理解'其中的规律，这样才能应对新的情况。AI工程师会使用验证集、早停、正则化等技术来防止过拟合，让模型既有好的学习能力，又有强的泛化能力。"}},"/data/game-configs/game-6.json":{"id":"game-6","title":"AI健忘症","description":"探索AI的注意力机制，理解AI如何记忆和处理信息","type":"attention","stage":2,"order":6,"estimatedMinutes":20,"knowledgePoints":["注意力机制","上下文窗口","信息遗忘"],"gameConfig":{"sentences":[{"id":"s1","text":"小猫 喜欢 在 阳光 下 睡觉","focusWord":"小猫"},{"id":"s2","text":"老师 用 粉笔 在 黑板 上 写字","focusWord":"粉笔"},{"id":"s3","text":"春天 的 花朵 开满 整个 山坡","focusWord":"花朵"},{"id":"s4","text":"小明 每天 早上 喝 一杯 牛奶","focusWord":"牛奶"},{"id":"s5","text":"机器人 能够 帮助 人类 完成 任务","focusWord":"机器人"}],"attentionLevels":[{"id":"low","name":"低注意力","factor":0.3},{"id":"medium","name":"中等注意力","factor":0.6},{"id":"high","name":"高注意力","factor":0.9}],"testQuestions":[{"sentenceId":"s1","question":"句子中，谁喜欢在阳光下睡觉？","options":["小猫","小狗","小兔","小鸟"],"answer":"小猫"},{"sentenceId":"s2","question":"老师用什么工具在黑板上写字？","options":["铅笔","粉笔","钢笔","毛笔"],"answer":"粉笔"},{"sentenceId":"s3","question":"什么开满了整个山坡？","options":["树叶","小草","花朵","蝴蝶"],"answer":"花朵"},{"sentenceId":"s4","question":"小明每天早上喝什么？","options":["咖啡","果汁","牛奶","豆浆"],"answer":"牛奶"},{"sentenceId":"s5","question":"谁能够帮助人类完成任务？","options":["机器人","外星人","动物","电脑"],"answer":"机器人"}],"scoring":{"criteria":[{"name":"记忆准确率","description":"在测验中正确回答问题的比例","weight":0.4},{"name":"注意力选择","description":"是否理解不同注意力级别对记忆的影响","weight":0.3},{"name":"反思深度","description":"对注意力机制和信息遗忘的理解","weight":0.3}]}},"reflectionPanel":{"type":"standard","questions":[{"id":"q1","question":"在低注意力和高注意力下，你的记忆准确率有什么差别？为什么？","hint":"想想显示时间的长短对记忆的影响","required":true},{"id":"q2","question":"AI的'注意力机制'和人类的注意力有什么相似之处？为什么AI需要注意力？","hint":"考虑AI如何决定关注句子中的哪些词","required":true},{"id":"q3","question":"什么是AI的'上下文窗口'？它和人类的短期记忆有什么关系？","hint":"想想你能同时记住多少信息","required":false}],"keyInsight":"注意力机制是现代AI（如Transformer）的核心。就像人类无法同时关注所有信息一样，AI也通过注意力机制来决定'重点关照'哪些内容。注意力越高，AI对关键信息的记忆和处理就越准确；注意力低时，信息容易被'遗忘'。而上下文窗口就像人类的短期记忆容量，决定了AI一次能处理多少信息。理解这些机制，能帮助我们更好地使用和优化AI。"}},"/data/game-configs/game-7.json":{"id":"game-7","title":"知识仓库RAG","description":"体验RAG检索增强生成，理解AI如何从知识库中查找信息","type":"rag","stage":3,"order":7,"estimatedMinutes":25,"knowledgePoints":["RAG检索增强生成","知识库构建","信息检索与引用"],"gameConfig":{"knowledgeBase":[{"id":"doc-1","text":"机器学习是人工智能的核心分支，它让计算机从数据中自动学习规律并做出预测。机器学习通过训练模型来完成任务，无需为每个问题手动编写规则。","tags":["机器学习","人工智能","数据","训练","模型","预测","规律"]},{"id":"doc-2","text":"深度学习是机器学习的一个分支，使用多层神经网络来学习数据的复杂特征。深度学习通过层层抽象，能够自动提取高层次特征，在图像和语音识别中表现优异。","tags":["深度学习","神经网络","层","特征","复杂","机器学习"]},{"id":"doc-3","text":"RAG（检索增强生成）是一种结合知识库检索和大模型生成的技术。RAG先从知识库中检索相关文档，再让模型基于检索结果生成答案，从而减少幻觉并支持引用来源。","tags":["RAG","检索","知识","知识库","检索增强","引用","生成"]},{"id":"doc-4","text":"过拟合是指模型在训练数据上表现很好，但在新数据上表现很差的现象。过拟合的模型死记硬背了训练数据，缺乏泛化能力，无法应对未见过的数据。","tags":["过拟合","训练","泛化","新数据","记忆","模型"]},{"id":"doc-5","text":"大语言模型（LLM）是一种拥有海量参数的预训练神经网络，通过学习大量文本数据来理解和生成自然语言。大语言模型能够完成问答、翻译、写作等多种任务。","tags":["大语言模型","LLM","参数","预训练","文本","神经网络"]},{"id":"doc-6","text":"监督学习是机器学习的一种方式，使用带标签的数据进行训练。监督学习让模型学习输入与标签之间的映射关系，常用于分类和回归任务。","tags":["监督学习","标签","数据","训练","分类","回归","机器学习"]},{"id":"doc-7","text":"神经网络是一种模仿人脑神经元结构的模型，由多个层和神经元组成。神经网络通过激活函数处理信息，层与层之间通过权重连接，是深度学习的基础。","tags":["神经网络","层","神经元","激活","权重","深度学习"]},{"id":"doc-8","text":"模型评估是衡量机器学习模型性能的过程，常用指标包括准确率、召回率和F1值。模型评估需要在独立的测试集上进行，以反映模型的真实泛化能力。","tags":["模型评估","准确率","召回率","测试","泛化","指标"]}],"noiseDocuments":[{"id":"noise-1","text":"今天天气晴朗，气温25度，适合出门散步和运动。明天多云转阴，下午可能有短时阵雨，出门记得带伞。","tags":["天气","生活"]},{"id":"noise-2","text":"我喜欢吃苹果，苹果很好吃，大家都喜欢苹果，苹果又甜又脆，每天一个苹果身体好。","tags":["生活","食物"]}],"queries":[{"id":"q1","text":"什么是机器学习？"},{"id":"q2","text":"什么是深度学习？"},{"id":"q3","text":"RAG是什么？"},{"id":"q4","text":"什么是过拟合？"},{"id":"q5","text":"什么是大语言模型？"}],"topKOptions":[1,3,5],"scoring":{"criteria":[{"name":"知识库质量","description":"构建知识库时是否选择了高质量、相关的文档并排除噪声","weight":0.35},{"name":"检索效果","description":"检索结果的相关性以及 Top-K 设置的合理性","weight":0.35},{"name":"反思深度","description":"对 RAG 原理和知识库构建的理解深度","weight":0.3}]}},"reflectionPanel":{"type":"standard","questions":[{"id":"q1","question":"你构建知识库时是如何选择文档的？为什么排除了某些文档？","hint":"思考文档的相关性、质量以及对噪声文档的处理","required":true},{"id":"q2","question":"RAG 相比直接让 AI 凭记忆回答，有什么优势？","hint":"考虑准确性、可更新性、可追溯性等方面","required":true},{"id":"q3","question":"如果知识库里没有相关信息，RAG 系统会怎样？如何改进？","hint":"考虑低相关度警告、扩充知识库、调整检索策略等","required":false}],"keyInsight":"RAG（检索增强生成）将'检索'和'生成'结合：先从知识库中查找相关文档，再让大模型基于这些文档生成答案。这样 AI 的回答既有依据、可追溯，又能随时通过更新知识库获取新知识，而无需重新训练模型。知识库的质量（是否包含相关、准确、无噪声的文档）直接决定了 RAG 的检索效果，这就是'垃圾进，垃圾出'的道理。"}},"/data/game-configs/game-8.json":{"id":"game-8","title":"检索精度挑战","description":"探索向量检索的奥秘，理解AI如何通过相似度找到相关信息","type":"vector","stage":3,"order":8,"estimatedMinutes":20,"knowledgePoints":["向量化","余弦相似度","语义搜索vs关键词搜索"],"gameConfig":{"textLibrary":[{"id":"t1","text":"人工智能技术让电脑和手机变得更聪明，能理解人类语言","category":"科技"},{"id":"t2","text":"程序员用编程语言开发软件，编写各种应用程序","category":"科技"},{"id":"t3","text":"猫和狗是人类最喜爱的宠物，它们温顺可爱又忠诚","category":"动物"},{"id":"t4","text":"鸟在天空中自由飞翔，鱼在水中欢快地游泳","category":"动物"},{"id":"t5","text":"苹果和香蕉是常见的水果，富含维生素营养丰富","category":"食物"},{"id":"t6","text":"早餐吃面包喝牛奶，再加一块蛋糕作为甜点","category":"食物"},{"id":"t7","text":"足球和篮球是受欢迎的团队运动，需要多人配合","category":"运动"},{"id":"t8","text":"跑步和游泳是很好的有氧锻炼方式，能增强体质","category":"运动"},{"id":"t9","text":"学校里的老师会布置作业，并定期组织考试","category":"教育"},{"id":"t10","text":"山上的树和花在太阳下生长，河水清澈地流淌","category":"自然"},{"id":"t11","text":"汽车和火车在地上跑，飞机在天上飞，出行很方便","category":"交通"},{"id":"t12","text":"这座房子旁边有一座桥和一座高高的塔","category":"建筑"}],"searchQueries":["电脑和手机哪个更聪明","兔子怎么喂养","苹果和香蕉营养好吗","跑步和游泳锻炼效果","汽车和飞机哪个快"],"searchModes":[{"id":"keyword","name":"关键词搜索","icon":"🔎"},{"id":"semantic","name":"语义搜索","icon":"🧠"}],"scoring":{"criteria":[{"name":"搜索准确率","description":"能否选择合适的搜索模式找到相关信息","weight":0.4},{"name":"模式理解","description":"理解关键词搜索与语义搜索的本质区别","weight":0.3},{"name":"反思深度","description":"对向量检索原理与适用场景的思考深度","weight":0.3}]}},"reflectionPanel":{"type":"standard","questions":[{"id":"q1","question":"关键词搜索和语义搜索，分别在什么情况下效果更好？","hint":"想想查询词是否精确出现在文本中","required":true},{"id":"q2","question":"为什么语义搜索能找到“没有包含查询关键词”的相关文本？","hint":"考虑向量化如何把文本映射到向量空间并捕捉语义","required":true},{"id":"q3","question":"在生活中，你能想到哪些场景更适合用语义搜索？","hint":"比如智能客服、问答系统、推荐系统","required":false}],"keyInsight":"向量检索是现代AI搜索的核心技术。它先把文本转换成向量（一串数字），再用余弦相似度衡量向量间的“方向”是否一致——方向越接近，语义越相似。这使得AI能理解“意思”而不仅仅是“字面”，即使查询词从未出现在文本中，也能找到相关内容。这也是为什么 ChatGPT、智能客服、推荐系统能“猜到”你真正想问什么。"}},"/data/game-configs/game-9.json":{"id":"game-9","title":"思维链侦探","description":"探索AI的思维链(Chain of Thought)，理解AI如何一步步推理","type":"cot","stage":3,"order":9,"estimatedMinutes":20,"knowledgePoints":["思维链推理","分步思考","推理透明性"],"gameConfig":{"tasks":[{"id":"task-1","description":"小明有3个苹果，给了小红1个，又买了2个，现在有几个？","steps":["小明有3个苹果","给了小红1个：3-1=2","又买了2个：2+2=4","答案：4个"],"wrongSteps":["小明有3个苹果，直接加上2个得到5个","忽略了给了小红1个这个条件"],"answer":"4个"},{"id":"task-2","description":"教室里有5排座位，每排6个，已经坐了20人，还能坐多少人？","steps":["计算总座位：5×6=30个","已经坐了20人","剩余座位：30-20=10个","答案：还能坐10人"],"wrongSteps":["直接用5+6=11个座位","把已坐人数20人当成了剩余座位"],"answer":"还能坐10人"},{"id":"task-3","description":"小红比小明大2岁，小明今年8岁，5年后小红几岁？","steps":["小明今年8岁","小红比小明大2岁，所以小红今年8+2=10岁","5年后小红：10+5=15岁","答案：15岁"],"wrongSteps":["5年后小明13岁，小红也是13岁，忽略了年龄差不变","直接用8+5=13岁作为小红5年后的年龄"],"answer":"15岁"},{"id":"task-4","description":"做一顿饭需要：洗菜5分钟、切菜3分钟、炒菜8分钟、煮饭15分钟。煮饭可以同时进行，最少需要多少分钟？","steps":["煮饭需要15分钟，可与其他步骤同时进行","洗菜5分钟+切菜3分钟+炒菜8分钟=16分钟","16分钟大于15分钟，总时间由炒菜流程决定","答案：最少需要16分钟"],"wrongSteps":["把所有时间相加：5+3+8+15=31分钟","只算煮饭时间15分钟作为总时间"],"answer":"最少需要16分钟"},{"id":"task-5","description":"一个水池，进水管3小时注满，出水管6小时放完。同时打开两管，几小时能注满？","steps":["进水速度：1/3 池/小时","出水速度：1/6 池/小时","净进水速度：1/3 - 1/6 = 1/6 池/小时","注满时间：1 ÷ 1/6 = 6小时","答案：6小时"],"wrongSteps":["进水3小时出水6小时，平均(3+6)/2=4.5小时","直接用出水时间6小时作为注满时间"],"answer":"6小时"}],"scoring":{"criteria":[{"name":"推理正确率","description":"能否识别正确的推理步骤并排除错误步骤","weight":0.4},{"name":"步骤排序","description":"能否将推理步骤按正确的逻辑顺序排列","weight":0.35},{"name":"反思深度","description":"对思维链推理原理与推理透明性的理解深度","weight":0.25}]}},"reflectionPanel":{"type":"standard","questions":[{"id":"q1","question":"思维链（CoT）推理和直接给出答案相比，有什么优势？","hint":"想想分步推理对准确性和可理解性的影响","required":true},{"id":"q2","question":"为什么AI展示推理过程（推理透明性）很重要？","hint":"考虑可信度、可调试性、教育价值等方面","required":true},{"id":"q3","question":"在生活中，你遇到过哪些需要分步思考才能解决的问题？","hint":"比如做计划、解数学题、排查故障","required":false}],"keyInsight":"思维链（Chain of Thought）让AI像人一样'分步思考'，把复杂问题拆解成一系列中间推理步骤，再得出最终答案。这不仅提高了AI在数学、逻辑等复杂任务上的准确率，还让推理过程'透明可见'——我们能看清AI是怎么想的，从而判断它是否合理、在哪里出错。推理透明性是建立人类对AI信任的关键：一个能解释'为什么'的AI，远比一个只会甩答案的AI更可靠。"}},"/data/modules.json":[{"id":"mod-stage1","title":"第1关：认识AI","stageId":1,"order":1,"narrative":"AI核心的第一个模块损坏了！只有理解AI的基本概念，才能开始修复。","lessons":[{"id":"lesson-1-1","title":"AI是什么？","order":1,"games":[{"id":"game-1","gameId":"game-1","title":"规则工厂 vs 学习工厂","type":"classification","stageId":1,"order":1}]},{"id":"lesson-1-2","title":"数据是AI的燃料","order":2,"games":[{"id":"game-2","gameId":"game-2","title":"数据厨房","type":"data-preparation","stageId":1,"order":2},{"id":"game-3","gameId":"game-3","title":"标签大师","type":"labeling","stageId":1,"order":3}]}]},{"id":"mod-stage2","title":"第2关：训练AI","stageId":2,"order":2,"narrative":"数据模块修复中！现在需要学习如何训练AI，让它从数据中学习。","lessons":[{"id":"lesson-2-1","title":"训练的秘密","order":1,"games":[{"id":"game-4","gameId":"game-4","title":"噪声陷阱","type":"noise-detection","stageId":2,"order":4},{"id":"game-5","gameId":"game-5","title":"过拟合迷宫","type":"overfitting","stageId":2,"order":5}]},{"id":"lesson-2-2","title":"AI的注意力","order":2,"games":[{"id":"game-6","gameId":"game-6","title":"AI健忘症","type":"attention","stageId":2,"order":6}]}]},{"id":"mod-stage3","title":"第3关：记忆与知识","stageId":3,"order":3,"narrative":"记忆模块需要修复！AI如何记住海量知识并快速检索？","lessons":[{"id":"lesson-3-1","title":"RAG知识检索","order":1,"games":[{"id":"game-7","gameId":"game-7","title":"知识仓库","type":"rag","stageId":3,"order":7},{"id":"game-8","gameId":"game-8","title":"检索精度","type":"vector-search","stageId":3,"order":8}]},{"id":"lesson-3-2","title":"AI推理","order":2,"games":[{"id":"game-9","gameId":"game-9","title":"思维链侦探","type":"chain-of-thought","stageId":3,"order":9}]}]},{"id":"mod-stage4","title":"第4关：思考与行动","stageId":4,"order":4,"narrative":"行动模块损坏严重！AI需要学会使用工具并做出决策。","lessons":[{"id":"lesson-4-1","title":"AI使用工具","order":1,"games":[{"id":"game-10","gameId":"game-10","title":"工具匹配大师","type":"tool-selection","stageId":4,"order":10},{"id":"game-11","gameId":"game-11","title":"多工具协作链","type":"multi-tool-chain","stageId":4,"order":11}]},{"id":"lesson-4-2","title":"单Agent的边界","order":2,"games":[{"id":"game-12","gameId":"game-12","title":"单Agent的局限","type":"single-agent","stageId":4,"order":12}]}]},{"id":"mod-stage5","title":"第5关：多AI协作","stageId":5,"order":5,"narrative":"最终关卡！多个AI模块需要协同工作才能完全修复AI核心。","lessons":[{"id":"lesson-5-1","title":"AI小队协作","order":1,"games":[{"id":"game-13","gameId":"game-13","title":"AI小队组建","type":"team-building","stageId":5,"order":13},{"id":"game-14","gameId":"game-14","title":"AI小队挑战赛","type":"multi-agent-challenge","stageId":5,"order":14}]}]}],"/data/real-ai-reveals/game-1.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"你按照固定规则让角色移动和做动作","realConcept":"规则编程 vs 机器学习","explanation":"传统的程序就像你按照菜谱做菜——每一步都写好了，电脑只需要照着做。但机器学习不一样，它不是按照规则来的，而是自己从大量例子中'发现'规则。就像你不是靠背菜谱学会做饭，而是做了好多次之后自己摸索出了诀窍！","realWorldExample":"自动驾驶汽车不是靠程序员写好'看到红灯就停'这种规则，而是通过看几百万张道路照片，自己学会了认识红绿灯、行人和各种交通标志。"},{"gameMechanic":"角色通过不断尝试变得越来越厉害","realConcept":"AI从数据中学习模式","explanation":"AI学习的方式有点像你学骑自行车——一开始会摔，但试了很多次之后，你的大脑就'学会'了怎么保持平衡。AI也是通过看大量的数据，慢慢找到里面的规律和模式。看得越多，学得越好！","realWorldExample":"你用的语音助手（比如小爱同学、Siri）就是听了几百万个人的说话声音，才学会了听懂你在说什么。每个人说话方式不一样，但AI能从这些数据中找到共同的规律。"}],"funFact":"世界上第一个机器学习程序是1959年Arthur Samuel写的跳棋程序。这个程序越下越厉害，最后竟然能赢过它的主人！在那个年代，大部分人还以为电脑只能按照人写的规则做事呢。"},"/data/real-ai-reveals/game-10.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"角色遇到不会的问题时使用工具来帮忙","realConcept":"工具调用（Function Call）","explanation":"AI本身只能生成文字，它不会算数学、不会上网搜索、也不会画画。但科学家可以给AI配备各种'工具'——计算器、搜索引擎、画图软件等。当AI遇到需要这些工具的问题时，它会自动选择正确的工具来使用。就像一个聪明的管家，自己不会做饭但会叫外卖！","realWorldExample":"你问ChatGPT'北京今天天气怎么样'，它自己不知道，但它可以调用天气查询工具去获取实时天气数据，然后把结果告诉你。这就是工具调用的魔力——让AI拥有了'超能力'！"},{"gameMechanic":"角色通过特定接口连接外部系统获取信息","realConcept":"API接口","explanation":"API就像一个标准化的'传话人'。AI不能直接打开一个网站或者访问一个数据库，但它可以通过API来'点菜'——告诉外部系统'我要什么数据'，然后外部系统把数据'送'过来。就像你在餐厅不能自己去厨房做菜，但你可以通过服务员点菜，服务员就是API。","realWorldExample":"当你用旅行App让AI帮你订机票时，AI通过航空公司的API查询航班信息和价格。AI自己不存机票信息，但它能通过API实时获取最新数据来帮你做决定。"},{"gameMechanic":"角色的能力因为可以使用工具而大大增强","realConcept":"AI的能力扩展","explanation":"没有工具的AI就像一个只会说话的人——能聊天但不能做事。有了工具之后，AI就'进化'了：能算数学（计算器）、能查天气（天气API）、能写代码并运行（代码解释器）、能搜索最新信息（搜索引擎）。工具让AI从一个'聊天机器人'变成了一个'全能助手'！","realWorldExample":"ChatGPT的代码解释器就是一个强大的工具。你可以让AI帮你分析一份Excel表格的数据、画一张图表、甚至做一个小游戏——这些光靠'说'是做不到的，必须真正执行代码才行。"}],"funFact":"ChatGPT能调用计算器、搜索引擎、代码解释器等几十种工具。想象一下，一个本来只会写作文的AI，突然学会了算数、上网查资料、写代码、画画……工具调用让AI从'文科生'变成了'全能学霸'！"},"/data/real-ai-reveals/game-11.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"角色需要同时使用多个工具来完成一个复杂任务","realConcept":"多工具编排","explanation":"现实中的复杂任务往往不是一个工具就能搞定的。比如你要AI帮你规划一次旅行，它需要先用搜索工具查目的地信息，再用天气工具查天气，然后用地图工具规划路线，最后用日历工具安排时间。把这些工具组合起来按正确的顺序使用，就叫做多工具编排。","realWorldExample":"你让AI助手帮你'找到附近评分最高的餐厅并导航过去'，AI需要先调用搜索工具找餐厅，再调用评价系统查评分，然后调用地图工具规划路线——三个工具串联起来才能完成这个任务。"},{"gameMechanic":"角色必须按照正确的顺序使用工具，先查再算再显示","realConcept":"工具调用顺序","explanation":"使用多个工具时，顺序非常重要！你不可能还没查天气就决定穿什么衣服。AI也是一样，它需要先搞清楚哪个工具先用、哪个后用，后一个工具可能需要前一个工具的结果才能工作。搞错顺序的话，整个任务就可能失败。","realWorldExample":"AI帮你网购时，正确顺序是：先搜索商品→再比较价格→再查库存→最后下单。如果先下单再查库存，发现没货就尴尬了。AI必须学会像人一样理清做事的顺序。"},{"gameMechanic":"当某个工具出问题时，角色会尝试其他方法","realConcept":"错误处理","explanation":"工具不总是可靠的——网站可能打不开、数据可能查不到、计算可能出错。好的AI系统在遇到工具错误时不会直接'崩溃'，而是会想办法处理：换一个工具试试、等一会儿重试、或者告诉用户'这个暂时做不到'。这叫做错误处理，是让AI变得可靠的关键。","realWorldExample":"AI帮你在网上查资料，如果第一个搜索工具没找到结果，它会自动换一种搜索方式，或者去另一个知识库查找。就像你在一本书里没找到答案，会去翻另一本书或者上网搜索一样。"}],"funFact":"复杂的AI任务往往需要串联多个工具，就像工厂的流水线一样。每个工具负责一道工序，前一个工具的输出变成下一个工具的输入。这种'流水线'方式让AI能处理非常复杂的任务，比如从一张照片自动识别出里面的商品并帮你下单购买！"},"/data/real-ai-reveals/game-12.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"一个人同时要管太多事情，结果每件事都做不好","realConcept":"单Agent局限","explanation":"一个AI Agent就像一个超级能干的人，但再能干的人也有极限。一个Agent要同时处理对话、查资料、写代码、做计划……任务太多的时候，它就会顾此失彼，每件事都做得不够好。就像你同时写三篇作文，肯定不如一篇一篇认真写来得好。","realWorldExample":"让一个AI同时做项目管理、写代码、做测试、写文档，它可能在写代码的时候忘了项目管理的事情，或者写文档的时候把之前的代码细节搞混了。任务太多太杂，一个AI真的忙不过来！"},{"gameMechanic":"角色的记忆有限，太长的对话会忘记开头说了什么","realConcept":"上下文窗口","explanation":"每个AI都有一个'记忆容量'，叫做上下文窗口。就像你的工作台只有那么大，放了太多东西就会把旧的挤掉。AI在读一段很长的对话或文档时，如果内容超过了它的窗口大小，最早的内容就会被'遗忘'。这就是为什么长对话中AI有时会忘记之前说过的话。","realWorldExample":"你和ChatGPT聊了很久，聊了两个小时之后问它'我最开始问你什么问题来着'，它可能完全想不起来。因为最早的对话已经被挤出它的上下文窗口了。不过现在的AI窗口越来越大，能记住的内容也越来越多。"},{"gameMechanic":"角色在不同任务之间切换时会变慢变笨","realConcept":"任务切换成本","explanation":"你在做数学作业的时候突然被叫去写作文，是不是需要一点时间来'切换大脑'？AI也一样！当它在做一件事的时候突然被要求去做另一件事，它需要重新'调整状态'，这个调整过程会消耗时间和计算资源，而且切换太频繁的话，每件事的质量都会下降。","realWorldExample":"一个AI助手如果一会儿帮你查天气，一会儿帮你写邮件，一会儿又帮你算数学，它可能在写邮件的时候不小心把天气预报的内容混进去。就像你一边写作业一边看电视，作业质量肯定不高。"}],"funFact":"即使是最强的AI模型，同时处理太多任务也会'大脑过载'。这就像你同时听两个人说话，结果哪个人说的都没听清。科学家们发现，与其让一个AI做所有事情，不如让多个专门的AI分工合作效果更好！"},"/data/real-ai-reveals/game-13.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"多个角色组队，每人负责自己最擅长的事情","realConcept":"多Agent系统","explanation":"多Agent系统就是让好几个AI一起合作完成任务，就像一个AI团队。每个Agent都有自己的专长——有的擅长搜索信息，有的擅长写代码，有的擅长检查错误。大家各司其职，合作完成一个人搞不定的大项目。这就像你们做小组作业一样，每个人分工做自己最擅长的部分！","realWorldExample":"一个AI编程团队可能有四个Agent：一个负责理解用户需求，一个负责写代码，一个负责测试代码，还有一个负责审查代码质量。它们像一个真正的开发团队一样合作！"},{"gameMechanic":"团队中每个角色有明确的职责和身份","realConcept":"角色分工","explanation":"在一个多Agent团队中，每个Agent都有明确的'人设'和任务。就像一个足球队有前锋、中场、后卫、守门员，每个人知道自己该干什么。如果一个Agent专门负责搜集信息，另一个专门负责分析数据，它们就不会互相抢活干，效率也更高。","realWorldExample":"AI模拟一家餐厅的运营：一个Agent扮演顾客点菜，一个Agent扮演厨师做菜，一个Agent扮演服务员传菜。每个Agent都只需要做好自己的角色，整个餐厅就能运转起来。"},{"gameMechanic":"角色之间通过消息来沟通和协调行动","realConcept":"Agent通信","explanation":"多个Agent合作的时候需要互相交流，就像你们做小组项目要在群里讨论一样。Agent之间通过发送消息来传递信息：'我搜到了这些资料'、'我发现了一个bug'、'我需要你帮我算一下这个'。良好的通信机制让Agent团队能高效协作，不会出现重复劳动或者信息不同步的问题。","realWorldExample":"在一个AI客服系统中，一个Agent负责理解你的问题，然后发消息给另一个Agent去查订单，查到结果后再发消息给第三个Agent来给你回复。它们之间的对话就像同事之间的工作沟通一样。"}],"funFact":"AutoGen、CrewAI等框架能让多个AI自动分工合作完成复杂项目。你可以告诉AI团队'帮我写一个小游戏'，然后产品经理Agent会分析需求，程序员Agent会写代码，测试Agent会找bug——整个过程就像一个真正的软件公司在运作！"},"/data/real-ai-reveals/game-14.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"你安排多个角色的工作流程，决定谁先做谁后做","realConcept":"Agent编排","explanation":"Agent编排就像是导演一场话剧——你需要决定哪个演员什么时候上场、做什么、做完之后交给谁。在多Agent系统中，一个好的编排能让任务顺利完成，一个差的编排会让Agent们互相等待或者做重复的工作。就像你们班级组织活动，需要有人统筹指挥一样。","realWorldExample":"做一个AI新闻报道系统：编排顺序是——记者Agent先去搜集素材→编辑Agent整理成文章→审核Agent检查事实→发布Agent发布到网站。如果顺序乱了，比如先发后审，就可能出大问题。"},{"gameMechanic":"不同角色对同一个问题有不同看法时需要协调","realConcept":"冲突解决","explanation":"当多个Agent一起工作时，它们有时候会有不同意见。比如一个Agent说这段代码没问题，另一个Agent说有bug。这时候就需要冲突解决机制来做出最终决定——是投票决定？让更权威的Agent判断？还是让人类来拍板？好的冲突解决机制让团队更高效。","realWorldExample":"在AI设计团队中，一个Agent觉得应该用红色做主色调，另一个觉得蓝色更好。这时候可以让第三个Agent根据用户偏好数据来做最终决定，或者生成两个方案让用户自己选。这就是AI世界的'冲突解决'。"},{"gameMechanic":"你评价团队合作的效果，不只看个人表现","realConcept":"协作评分","explanation":"评价一个多Agent系统好不好，不能只看每个Agent单独表现怎么样，更重要的是看它们合作起来效果如何。就像评价一个篮球队，不只看每个球员进了多少球，还要看他们的配合、传球和最终的比分。协作评分关注的是团队的'化学反应'——1+1能不能大于2。","realWorldExample":"一个AI写作团队中，创意Agent单独写文章可能只有70分，编辑Agent单独写也只有70分，但它们合作起来，一个负责创意一个负责润色，可能就能写出90分的文章。这就是好的协作——团队合作大于个人！"}],"funFact":"多个AI合作有时候比一个AI做得更好，就像团队合作一样。科学家们发现，三个普通AI合作的效果有时候能超过一个最强的AI！这就像'三个臭皮匠赛过诸葛亮'——在AI世界里这句话也是成立的。"},"/data/real-ai-reveals/game-15.json":{"title":"你已经成为AI系统设计师！","concepts":[{"gameMechanic":"你选择了数据源和处理步骤","realConcept":"数据工程 (Data Engineering)","explanation":"在真实AI项目中，数据工程师负责收集、清洗和标注数据。这通常占整个项目60-80%的时间。","realWorldExample":"OpenAI的GPT-4训练数据处理花了数月，动用了上千名标注员"},{"gameMechanic":"你选择了训练方法和参数","realConcept":"模型训练 (Model Training)","explanation":"选择正确的训练策略和超参数是AI工程师的核心技能。不同的任务需要不同的训练方法。","realWorldExample":"ChatGPT使用了预训练+SFT+RLHF三阶段训练策略"},{"gameMechanic":"你构建了知识库","realConcept":"RAG系统 (Retrieval-Augmented Generation)","explanation":"企业AI系统几乎都会使用RAG来增强模型的知识。选择合适的知识源和检索策略至关重要。","realWorldExample":"企业级AI助手如Microsoft Copilot都使用RAG架构"},{"gameMechanic":"你编排了多个Agent协作","realConcept":"多Agent系统 (Multi-Agent Systems)","explanation":"复杂的AI任务通常需要多个专门化的Agent分工合作。Agent编排是当前AI工程最热门的方向。","realWorldExample":"AutoGen、CrewAI、LangGraph等框架正在推动多Agent应用落地"}],"funFact":"恭喜你完成了全部学习！你现在掌握的AI系统设计理念，和真正的AI工程师每天在做的事情是一样的。区别只是他们用真实的代码和数据，而你在游戏里用拖拽完成了同样的思考过程。"},"/data/real-ai-reveals/game-2.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"你挑选新鲜的食材来做美味佳肴","realConcept":"数据质量（干净 vs 脏数据）","explanation":"想象你要做一道菜，如果食材是坏的或者过期的，做出来的菜肯定不好吃。AI也是一样！如果给AI的数据是错误的、不完整的，那它学到的东西也是错的。所以在训练AI之前，科学家们会花很多时间'清洗'数据，把错误的、重复的、不相关的信息去掉。","realWorldExample":"医院用AI来帮医生看X光片的时候，如果训练用的X光片是模糊的或者标注错了，AI就可能给出错误的诊断。所以医疗AI的数据必须经过医生仔细检查和清洗。"},{"gameMechanic":"你用各种不同的食材搭配出丰富的口味","realConcept":"数据多样性","explanation":"如果你只吃过川菜，那你可能完全不会做粤菜和日料。AI也是一样！如果只给它看某一类数据，它就只能处理那一类问题。为了让AI更厉害，科学家会尽量收集各种各样、来自不同场景的数据，让AI见识'大千世界'。","realWorldExample":"人脸识别AI需要看到不同肤色、不同年龄、不同光线下的人脸照片，否则它可能只认识某一种类型的人，对其他人的识别就不准了。这就是为什么多样性特别重要。"},{"gameMechanic":"你给每道菜贴上标签，告诉大家这是什么菜","realConcept":"数据标注","explanation":"AI看到一张图片，它一开始完全不知道这是什么。需要有人在图片上'贴标签'，告诉它'这是一只猫'、'那是一辆车'。这个贴标签的过程就叫做数据标注。标注得越多越准，AI学得就越好。","realWorldExample":"训练一个能识别动物的AI，需要人工给几十万张动物照片标上'猫'、'狗'、'兔子'等标签。这个工作量非常大，有时候需要成千上万的人一起帮忙标注！"}],"funFact":"训练GPT-4用了数万亿个文字，相当于人类几千年的阅读量！如果把训练GPT-4用的数据全部打印成书，堆起来可能比珠穆朗玛峰还要高。不过别担心，AI读得比人快多了！"},"/data/real-ai-reveals/game-3.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"你给图片分类贴标签，告诉AI正确答案","realConcept":"监督学习","explanation":"监督学习就像是有老师教你学习。老师（标注员）给每道题标上正确答案，然后AI照着这些'标准答案'来学习。你给AI看一张猫的照片并告诉它'这是猫'，看了几万次之后，AI就能自己认出猫来了。大部分AI都是这样训练出来的！","realWorldExample":"你手机里的垃圾短信过滤功能，就是通过学习人类标注过的'垃圾短信'和'正常短信'来工作的。有人提前告诉AI哪些是垃圾短信，它才学会了帮你过滤。"},{"gameMechanic":"不同的人对同一张图片可能有不同的标签","realConcept":"标注一致性（Inter-annotator agreement）","explanation":"假设你让五个同学给一张图片打标签。一个人说图片上是'开心'，另一个人说是'平静'——到底谁对呢？这就是标注一致性的问题。科学家们需要想办法让不同的标注员尽量达成共识，否则AI会很困惑，不知道该听谁的。","realWorldExample":"在标注'这句话是正面的还是负面的'时候，不同标注员可能有不同看法。比如'这家餐厅的菜还行'，有人觉得是好评，有人觉得一般。AI公司会计算标注员之间的一致率，太低的话就需要重新定义标注规则。"},{"gameMechanic":"标签贴错了，AI就学错了","realConcept":"标注质量影响模型表现","explanation":"如果老师给学生的答案是错的，学生就会学到错误的知识。同样，如果数据标注不准确，AI就会学到错误的模式。一个标注错误看起来很小，但如果成千上万个这样的小错误堆积起来，AI的表现就会大打折扣。所以标注质量超级重要！","realWorldExample":"如果有人在训练数据里把哈士奇标注成了狼，那AI长大后可能会把所有哈士奇都认成狼。虽然它们长得很像，但对于AI来说，错误的标注会导致完全错误的判断。"}],"funFact":"OpenAI雇佣了数千名标注员来教ChatGPT什么是好的回答。这些标注员每天阅读AI的回答并打分，告诉AI哪个回答更好、哪个不好。ChatGPT之所以能和你正常聊天，全靠这些幕后英雄！"},"/data/real-ai-reveals/game-4.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"你把混在好食材里的坏食材挑出来","realConcept":"噪声数据清洗","explanation":"真实世界的数据往往是'脏'的——有拼写错误、有重复、有乱七八糟的无关信息，这些就叫做噪声。就像你在做沙拉之前要把坏的菜叶挑出来一样，训练AI之前也需要把数据里的噪声清洗掉。噪声太多的话，AI就会被干扰，学不到真正有用的东西。","realWorldExample":"网上抓取的文本数据里经常有广告、乱码、重复内容。训练大语言模型之前，工程师们会花大量时间写程序来自动清洗这些数据，确保AI吃到的是'干净的食物'。"},{"gameMechanic":"你给AI的表现打分，告诉它哪个做得好哪个做得不好","realConcept":"RLHF（人类反馈强化学习）","explanation":"RLHF听起来很复杂，但其实原理很简单——就像训练小狗一样！小狗做对了你就给它奖励，做错了就不给。对于AI，人类会看它的不同回答，然后选择更好的那个。AI根据人类的选择来调整自己，慢慢学会说出人类喜欢的话。这就是为什么ChatGPT说话比较有礼貌！","realWorldExample":"ChatGPT在训练的时候，会让它生成多个不同的回答，然后由人类标注员选择最好的那个。AI会根据这些选择来更新自己，下次就知道什么样的回答更好了。这个过程重复很多次之后，AI就变得很会'说话'了。"},{"gameMechanic":"你根据反馈不断调整评分标准","realConcept":"奖励模型","explanation":"在RLHF的过程中，AI需要学会判断'什么是好回答'。科学家会先训练一个'打分机器人'（奖励模型），它学会了人类的喜好，然后给AI的每个回答打分。AI就根据这个分数来改进自己。就像你写作文之前先了解老师喜欢什么样的作文一样！","realWorldExample":"AI写了一首诗，奖励模型看了给它打8分。AI又写了一首，这次只有5分。AI就会想办法往8分的方向靠。久而久之，AI写的诗就越来越接近人类喜欢的风格。"}],"funFact":"ChatGPT之所以能说人话、懂礼貌，就是因为人类标注员不断告诉它哪个回答更好。这就像爸妈教你说话一样——你说了不礼貌的话会被纠正，说了好的会被表扬。AI也是这样被'教育'出来的！"},"/data/real-ai-reveals/game-5.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"角色把答案全背下来了，但换个题型就不会了","realConcept":"过拟合（死记硬背）","explanation":"想象有个同学把整本数学书的答案都背下来了，做书上的题全部正确，但考试出了新题目就完全不会。这就是过拟合！AI如果'太用功'，把训练数据里的每个细节都记住了，它就无法处理没见过的新问题。这就像你背单词只记住了顺序，换个语境就不认识了一样。","realWorldExample":"有一个AI被训练来识别狼和哈士奇。结果它'偷懒'学会了看背景——有雪的就是狼，有沙发的就是哈士奇。因为它训练数据里的狼都在雪地里，哈士奇都在家里。这就是典型的过拟合！"},{"gameMechanic":"角色学得太少，连基本操作都做不好","realConcept":"欠拟合（学得太少）","explanation":"如果过拟合是'学太多但没学懂'，那欠拟合就是'学得太少了'。就像你只看了两页数学书就去考试，肯定什么都不会。AI如果训练时间不够，或者训练数据太少，它连最基本的规律都没学到，不管是老问题还是新问题都做不好。","realWorldExample":"如果只给AI看10张猫的照片就让它学认猫，它可能连猫的基本特征都没搞清楚，看到一只橘猫会说'不确定是什么'。这就是欠拟合——学得不够。"},{"gameMechanic":"角色能灵活应对从没见过的关卡","realConcept":"泛化能力","explanation":"泛化能力是AI最重要的能力之一！它的意思是AI能不能把学到的知识用到全新的、没见过的问题上。就像你学会了加法之后，不管数字怎么变你都会算。一个好的AI不是记忆力好，而是理解力强，能举一反三！","realWorldExample":"一个翻译AI如果泛化能力强，它不仅能翻译训练时见过的句子，还能翻译从没见过的新句子。这就是为什么泛化能力比死记硬背重要得多。"},{"gameMechanic":"你用不同的题目来练习和考试","realConcept":"训练集 vs 测试集","explanation":"老师出题的时候不会把考试题给你提前练习，对吧？AI训练也是一样！科学家会把数据分成两部分：一部分用来训练（训练集），另一部分留着考试（测试集）。测试集的数据AI在训练时绝对看不到，这样才能真实检测AI到底学会了没有，还是只是死记硬背。","realWorldExample":"训练人脸识别时，科学家用一批人的照片来训练，用另一批完全不同的人的照片来测试。如果AI在没见过的脸上也能认对，说明它真的学会了，而不是只记住了训练时的那几个人。"}],"funFact":"一个过拟合的AI能在考试中考100分，但做新题目时会考0分！就像一个只会背答案不会思考的学生，老师原题改一个数字就不会了。所以AI科学家们最重要的一项工作就是防止AI'死记硬背'。"},"/data/real-ai-reveals/game-6.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"角色有时候会说出完全不对但看起来很自信的话","realConcept":"AI幻觉","explanation":"AI幻觉是指AI编造看起来非常真实但实际上是假的信息。这不是AI故意骗你，而是因为AI的工作原理是预测'下一个最可能的词'，有时候它会'自信地编故事'。就像一个同学不懂装懂，说得头头是道但其实全是瞎编的！","realWorldExample":"ChatGPT有时候会非常自信地编造不存在的论文、法律案例甚至历史事件。有个律师曾把ChatGPT编造的假案例提交给法院，结果被法官发现了，闹了大笑话！"},{"gameMechanic":"角色特别关注对话中的关键词来做回应","realConcept":"注意力机制","explanation":"AI在读一段话的时候，不是每个字都一样重要的。注意力机制让AI学会'重点看哪些词'。比如你说'那只白色的猫在睡觉'，AI会把更多注意力放在'猫'和'睡觉'上，而不是'那只'和'的'。这就像你读书的时候会不自觉地重点关注重要的句子一样。","realWorldExample":"当你问ChatGPT'中国最高的山是什么'时，注意力机制帮助它重点关注'中国'、'最高'和'山'这几个关键词，而不是被其他无关的词分散注意力。这就是为什么AI能理解你的意思。"},{"gameMechanic":"角色对自己不知道的问题会乱猜","realConcept":"知识边界","explanation":"每个AI都有自己不知道的东西，这就是它的知识边界。AI只知道它在训练时看到的内容，对于训练之后发生的新事情或者训练数据里没有的信息，它就'两眼一抹黑'了。好的AI应该能识别自己的知识边界，遇到不知道的就说'我不确定'，而不是瞎编。","realWorldExample":"大部分AI模型的知识都停留在训练截止日期。比如训练数据截止到2024年，那它就不知道2025年发生了什么。你问它最新新闻，它要么说不知道，要么就开始'幻觉'了。"}],"funFact":"ChatGPT有时候会非常自信地编造不存在的论文和法律案例，而且编得像模像样，连引用格式都是对的！这就是为什么用AI查资料时一定要核实信息来源，不能100%相信AI说的每一句话。"},"/data/real-ai-reveals/game-7.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"角色遇到问题时会先去资料库查找相关信息","realConcept":"检索增强生成（RAG）","explanation":"RAG就像给AI配了一个图书馆管理员。AI回答问题之前，先去知识库里搜索相关信息，找到有用的资料后再结合这些资料来回答。这比AI只靠自己'记忆'回答靠谱多了！就像你考试的时候如果能翻书，肯定比闭卷考试考得好。","realWorldExample":"很多公司的客服AI就用了RAG技术。它会先去公司的产品手册和常见问题库里搜索，找到相关答案后再回复你。这样它就不会瞎编产品信息了，因为所有回答都有据可查。"},{"gameMechanic":"角色随身携带一本百科全书用来查资料","realConcept":"知识库","explanation":"知识库就像是AI的'参考书'。它可以是数据库、文档集合、网页内容等任何存储了知识的地方。有了知识库，AI就不需要把所有知识都存在自己的'大脑'里，需要的时候去查就行了。就像你不需要背下整个图书馆的书，知道去哪里找就好！","realWorldExample":"维基百科就是一个巨大的知识库。有些AI系统会先去维基百科搜索你的问题，然后把找到的相关内容拿来帮助回答。这也是为什么有些AI能回答非常专业和具体的问题。"},{"gameMechanic":"角色可以选择凭记忆回答还是翻书回答","realConcept":"开卷考试 vs 闭卷考试","explanation":"不用RAG的AI就像闭卷考试——全靠记忆，可能会记错或者记不全。用了RAG的AI就像开卷考试——可以翻资料，回答更准确。但开卷考试也有缺点：翻书需要时间，而且你得知道去哪里找。所以最好的AI会结合两者：简单问题直接回答，复杂问题先查资料再回答。","realWorldExample":"医疗AI在回答常见感冒问题时可以直接回答，但遇到罕见疾病时就需要先去医学数据库查资料。这种'能查就查、能答就答'的策略让AI既快速又准确。"}],"funFact":"RAG就像给AI一本开卷考试的书，让它查资料再回答。这个技术让AI的'幻觉'大大减少了，因为它可以引用真实的资料。现在很多企业级AI应用都在用RAG，可以说是目前最实用的AI增强技术之一！"},"/data/real-ai-reveals/game-8.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"你把词语变成数字编码来进行搜索匹配","realConcept":"向量/Embedding","explanation":"AI不认识文字，它只认识数字。所以我们需要把文字变成一串数字，这就叫做向量或Embedding。每个词变成向量后，就有了一个'数字地址'。有意思的是，意思相近的词会变成相近的数字！比如'开心'和'高兴'的向量就很接近，而'开心'和'石头'的向量就离得很远。","realWorldExample":"搜索引擎把每篇文章变成向量存起来，你搜索的时候，你的搜索词也变成向量，然后系统找离你搜索向量最近的文章给你看。这就是为什么你搜'怎么做红烧肉'能找到红烧肉教程，而不是红烧石头的教程。"},{"gameMechanic":"你根据意思的相似程度来找到最匹配的内容","realConcept":"语义相似度","explanation":"传统的搜索是看你搜的'字'有没有出现在文章里。但语义搜索更聪明——它看的是'意思'像不像。你搜'如何烹制猪肉'，即使文章里写的是'红烧肉的做法'，一个字都对不上，但语义搜索能知道它们说的是类似的事情，然后把结果给你。","realWorldExample":"你在音乐App里搜'适合跑步听的歌'，App不是去找名字里有'跑步'的歌，而是理解了你的意思——节奏快、让人兴奋的音乐——然后给你推荐合适的歌单。这就是语义相似度在工作。"},{"gameMechanic":"你比较两个内容之间的'距离'来判断有多像","realConcept":"余弦距离","explanation":"余弦距离是衡量两个向量之间有多'像'的一种方法。想象两个向量是两个方向箭头，如果它们指向几乎同一个方向，距离就很近（意思是相似的）；如果指向完全相反的方向，距离就很远。科学家们用这个数学方法来量化'两个东西有多像'，非常精确！","realWorldExample":"在AI的世界里，'猫'和'狗'的距离很近，因为都是小宠物；但和'汽车'很远。'国王'减去'男人'再加上'女人'，得到的向量会和'女王'非常接近！这就是向量世界的奇妙之处。"}],"funFact":"在AI的世界里，'猫'和'狗'的距离很近，但和'汽车'很远。更神奇的是，如果你把'国王'的向量减去'男人'的向量再加上'女人'的向量，你会得到一个非常接近'女王'的向量！AI竟然自己发现了'国王和女王的关系就像男人和女人的关系'这个规律！"},"/data/real-ai-reveals/game-9.json":{"title":"真实AI揭秘","concepts":[{"gameMechanic":"角色遇到难题时把大问题拆成小步骤来解决","realConcept":"思维链（Chain of Thought）","explanation":"思维链是一种让AI'展示解题过程'的技巧。就像数学老师总说'要写解题步骤'一样，让AI把大问题拆成一步一步的小问题来解决，正确率会大大提高。不让AI写步骤的话，它经常直接猜一个答案，容易出错；但让它一步一步来，就像开了外挂一样准确！","realWorldExample":"让ChatGPT直接算'23×47等于多少'，它可能算错。但如果你说'请一步一步来算'，它会先算20×47=940，再算3×47=141，最后940+141=1081，正确率大幅提升！"},{"gameMechanic":"角色按顺序一步步推理出最终答案","realConcept":"分步推理","explanation":"分步推理就是把一个复杂问题拆成好几个小问题，一个一个来解决。就像你要组装一个乐高模型，不是一下子就拼好，而是先看说明书，然后一步一步来。AI用分步推理的时候，每一步都有明确的小目标，这样最终答案更靠谱。","realWorldExample":"AI在帮你规划旅行时会用分步推理：第一步确定目的地，第二步查机票，第三步订酒店，第四步安排行程。每一步都基于上一步的结果来做决定，这样规划出来的行程才合理。"},{"gameMechanic":"角色在没有例子和有例子的情况下表现不同","realConcept":"零样本推理 vs 少样本推理","explanation":"零样本推理就是AI在没有任何例子的情况下直接解决问题，就像考试不看例题直接做题。少样本推理则是先给AI看几个例子，让它模仿着来，就像先做几道例题再做新题。大部分情况下，给AI看几个例子（少样本推理）的效果会更好，因为AI能通过例子理解你到底想要什么。","realWorldExample":"你对AI说'把这段话翻译成可爱的语气'（零样本），AI可能不太确定'可爱'是什么风格。但如果你先给它看两个例子：'今天天气好→今天天气超级棒呀~'，'我饿了→肚子咕噜咕噜叫啦~'（少样本），AI就秒懂你要的风格了！"}],"funFact":"对AI说'让我们一步一步来思考'（Let's think step by step）就能显著提高它的数学成绩！这个神奇的咒语是2022年由Google的研究人员发现的，简单加一句话就能让AI的数学能力暴涨，连科学家们都觉得不可思议。"}};
  </script>
