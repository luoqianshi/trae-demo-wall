<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悬崖峭壁 - 古代与现代武器融合的冒险之旅</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
    user-select: none;
}

#gameCanvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
}

#ui-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* HUD */
#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    pointer-events: none;
}

#hp-bar-container {
    width: 200px;
    height: 24px;
    background: #333;
    border: 2px solid #555;
    border-radius: 4px;
    position: relative;
    margin-bottom: 6px;
}

#hp-bar-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #ff4444, #cc0000);
    border-radius: 2px;
    transition: width 0.3s;
}

#hp-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 1px 1px 2px #000;
}

#stamina-bar-container {
    width: 200px;
    height: 24px;
    background: #333;
    border: 2px solid #555;
    border-radius: 4px;
    position: relative;
}

#stamina-bar-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #44cc44, #228822);
    border-radius: 2px;
    transition: width 0.3s;
}

#stamina-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 1px 1px 2px #000;
}

#weapon-display {
    margin-top: 6px;
    color: #ffcc00;
    font-size: 13px;
    text-shadow: 1px 1px 2px #000;
}

#weapon-display span {
    display: block;
}

/* 右侧武器面板 */
#weapon-panel {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 200px;
    background: rgba(0, 0, 0, 0.8);
    border: 2px solid #8B4513;
    border-radius: 8px;
    padding: 10px;
    color: #fff;
    pointer-events: none;
}

#weapon-panel h3 {
    text-align: center;
    color: #ffcc00;
    font-size: 14px;
    margin-bottom: 8px;
    border-bottom: 1px solid #8B4513;
    padding-bottom: 4px;
}

#weapon-panel-content {
    font-size: 12px;
    max-height: 300px;
    overflow-y: auto;
}

#weapon-panel-content .weapon-entry {
    padding: 4px 0;
    border-bottom: 1px solid #333;
}

#weapon-panel-content .weapon-entry .wname {
    color: #ffcc00;
    font-weight: bold;
}

#weapon-panel-content .weapon-entry .wtype {
    color: #aaa;
    font-size: 10px;
}

#weapon-panel-content .weapon-entry .wattack {
    color: #ff8844;
}

#weapon-panel-content .weapon-entry .wdmg {
    color: #ff4444;
}

#weapon-panel-content .weapon-entry.equipped {
    background: rgba(255, 204, 0, 0.15);
    border-left: 3px solid #ffcc00;
    padding-left: 4px;
}

/* 对话框 */
#dialog-box {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    max-width: 90%;
    background: rgba(0, 0, 0, 0.85);
    border: 3px solid #8B4513;
    border-radius: 10px;
    padding: 16px 20px;
    color: #fff;
    pointer-events: none;
}

#dialog-name {
    color: #ffcc00;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
}

#dialog-text {
    font-size: 14px;
    line-height: 1.6;
    min-height: 40px;
}

#dialog-hint {
    text-align: right;
    color: #aaa;
    font-size: 11px;
    margin-top: 10px;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

/* 背包 */
#inventory-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    background: rgba(0, 0, 0, 0.9);
    border: 3px solid #8B4513;
    border-radius: 10px;
    padding: 16px;
    color: #fff;
    pointer-events: auto;
}

#inventory-panel h3 {
    text-align: center;
    color: #ffcc00;
    margin-bottom: 12px;
}

#inventory-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
}

#inventory-grid .slot {
    width: 60px;
    height: 60px;
    background: #333;
    border: 2px solid #555;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #aaa;
    text-align: center;
    position: relative;
}

#inventory-grid .slot.filled {
    border-color: #8B4513;
    color: #fff;
}

#inventory-grid .slot .count {
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: 10px;
    color: #ffcc00;
}

#inventory-close-hint {
    text-align: center;
    color: #aaa;
    font-size: 11px;
    margin-top: 10px;
}

/* 制作UI */
#crafting-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 420px;
    background: rgba(0, 0, 0, 0.9);
    border: 3px solid #8B4513;
    border-radius: 10px;
    padding: 16px;
    color: #fff;
    pointer-events: auto;
}

#crafting-panel h3 {
    text-align: center;
    color: #ffcc00;
    margin-bottom: 12px;
}

#crafting-recipes {
    max-height: 300px;
    overflow-y: auto;
}

#crafting-recipes .recipe {
    padding: 8px;
    border: 1px solid #555;
    border-radius: 4px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.2s;
}

#crafting-recipes .recipe:hover {
    background: rgba(255, 204, 0, 0.1);
}

#crafting-recipes .recipe .rname {
    color: #ffcc00;
    font-weight: bold;
}

#crafting-recipes .recipe .rmaterials {
    color: #aaa;
    font-size: 11px;
}

#crafting-recipes .recipe .rcraft-btn {
    color: #44cc44;
    font-size: 11px;
    margin-top: 4px;
}

#crafting-recipes .recipe.locked {
    opacity: 0.5;
    cursor: not-allowed;
}

#crafting-close-hint {
    text-align: center;
    color: #aaa;
    font-size: 11px;
    margin-top: 10px;
}

/* 击杀计数 */
#kill-counter {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #ff4444;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 1px 1px 2px #000;
    pointer-events: none;
}

/* 提示 */
#tooltip {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    color: #ffcc00;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.5s;
}
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
        <div id="hud">
            <div id="hp-bar-container">
                <div id="hp-bar-fill"></div>
                <span id="hp-text">HP: 100/100</span>
            </div>
            <div id="stamina-bar-container">
                <div id="stamina-bar-fill"></div>
                <span id="stamina-text">体力: 100/100</span>
            </div>
            <div id="weapon-display">
                <span id="weapon-name"></span>
                <span id="weapon-attack"></span>
            </div>
        </div>
        <div id="weapon-panel">
            <h3>武器面板</h3>
            <div id="weapon-panel-content"></div>
        </div>
        <div id="dialog-box" style="display:none;">
            <div id="dialog-name"></div>
            <div id="dialog-text"></div>
            <div id="dialog-hint">按 A 继续</div>
        </div>
        <div id="inventory-panel" style="display:none;">
            <h3>背包</h3>
            <div id="inventory-grid"></div>
            <div id="inventory-close-hint">按 Tab 关闭</div>
        </div>
        <div id="crafting-panel" style="display:none;">
            <h3>制作</h3>
            <div id="crafting-recipes"></div>
            <div id="crafting-close-hint">按 E 关闭</div>
        </div>
        <div id="kill-counter">击杀: 0/10</div>
        <div id="tooltip"></div>
    </div>

<script>
// ========== 资源管理 - 用代码绘制所有图形 ==========
const Assets = {
    drawPlayer(ctx, x, y, w, h, facing, state) {
        ctx.save();
        ctx.fillStyle = '#4488ff';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.arc(x + w/2, y - 10, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        const eyeX = facing > 0 ? x + w/2 + 4 : x + w/2 - 4;
        ctx.beginPath();
        ctx.arc(eyeX, y - 12, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#3355aa';
        ctx.fillRect(x + 4, y + h, 8, 10);
        ctx.fillRect(x + w - 12, y + h, 8, 10);
        if (state === 'carrying') {
            ctx.fillStyle = '#3355aa';
            ctx.fillRect(x + w, y + 10, 8, 20);
            ctx.fillRect(x - 8, y + 10, 8, 20);
        }
        ctx.restore();
    },

    drawPlayerTopDown(ctx, x, y, r, facing) {
        ctx.save();
        ctx.fillStyle = '#4488ff';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2266cc';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.arc(x + Math.cos(facing) * r * 0.5, y + Math.sin(facing) * r * 0.5, r * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    },

    drawEnemy(ctx, x, y, w, h, alive) {
        ctx.save();
        ctx.fillStyle = alive ? '#ff4444' : '#884444';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = alive ? '#ff6666' : '#996666';
        ctx.beginPath();
        ctx.arc(x + w/2, y - 8, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x + w/2 - 3, y - 10, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.arc(x + w/2 + 3, y - 10, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(x + w/2 - 3, y - 10, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.arc(x + w/2 + 3, y - 10, 1.5, 0, Math.PI * 2);
        ctx.fill();
        if (!alive) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.strokeRect(x, y, w, h);
            ctx.setLineDash([]);
        }
        ctx.restore();
    },

    drawEnemyTopDown(ctx, x, y, r, alive) {
        ctx.save();
        ctx.fillStyle = alive ? '#ff4444' : '#884444';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#cc0000';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x - r*0.3, y - r*0.2, r*0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.arc(x + r*0.3, y - r*0.2, r*0.25, 0, Math.PI * 2);
        ctx.fill();
        if (!alive) {
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeText('敌人', x, y - r - 4);
        ctx.fillText('敌人', x, y - r - 4);
        ctx.textAlign = 'start';
        ctx.restore();
    },

    drawTrebuchet(ctx, x, y, w, h) {
        ctx.save();
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x, y + h*0.6, w, h*0.4);
        ctx.fillStyle = '#654321';
        ctx.fillRect(x + w*0.3, y + h*0.2, w*0.1, h*0.6);
        ctx.fillRect(x + w*0.6, y + h*0.2, w*0.1, h*0.6);
        ctx.fillRect(x + w*0.2, y + h*0.2, w*0.6, h*0.1);
        ctx.fillStyle = '#A0522D';
        ctx.fillRect(x + w*0.35, y - h*0.3, w*0.08, h*0.6);
        ctx.fillStyle = '#D2691E';
        ctx.beginPath();
        ctx.arc(x + w*0.39, y - h*0.3, w*0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText('投石机', x + w/2, y - h*0.5);
        ctx.fillText('投石机', x + w/2, y - h*0.5);
        ctx.textAlign = 'start';
        ctx.restore();
    },

    drawBungee(ctx, x, y, w, h) {
        ctx.save();
        ctx.fillStyle = '#666';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#888';
        ctx.fillRect(x, y - 5, w, 5);
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x + w/2, y - 5);
        ctx.lineTo(x + w/2, y + h + 50);
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText('蹦极', x + w/2, y - 10);
        ctx.fillText('蹦极', x + w/2, y - 10);
        ctx.textAlign = 'start';
        ctx.restore();
    },

    drawTrampoline(ctx, x, y, w, h) {
        ctx.save();
        ctx.fillStyle = '#ff6600';
        ctx.fillRect(x, y, w, h * 0.3);
        ctx.fillStyle = '#ff9933';
        ctx.fillRect(x + 5, y + h * 0.3, w - 10, h * 0.7);
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(x + 10 + i * 20, y);
            ctx.lineTo(x + 10 + i * 20, y + h * 0.3);
            ctx.stroke();
        }
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText('蹦床', x + w/2, y - 5);
        ctx.fillText('蹦床', x + w/2, y - 5);
        ctx.textAlign = 'start';
        ctx.restore();
    },

    drawSedan(ctx, x, y, w, h) {
        ctx.save();
        ctx.fillStyle = '#cc3333';
        ctx.fillRect(x, y + h*0.2, w, h*0.8);
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.moveTo(x - 5, y + h*0.2);
        ctx.lineTo(x + w/2, y - h*0.2);
        ctx.lineTo(x + w + 5, y + h*0.2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x - 20, y + h*0.3, w + 40, 6);
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.arc(x - 15, y + h, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + w + 15, y + h, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText('轿子', x + w/2, y - h*0.3);
        ctx.fillText('轿子', x + w/2, y - h*0.3);
        ctx.textAlign = 'start';
        ctx.restore();
    },

    drawRiver(ctx, x, y, w, h) {
        ctx.save();
        const gradient = ctx.createLinearGradient(x, y, x, y + h);
        gradient.addColorStop(0, '#4488cc');
        gradient.addColorStop(0.5, '#3366aa');
        gradient.addColorStop(1, '#225588');
        ctx.fillStyle = gradient;
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            const wy = y + h * 0.2 + i * h * 0.15;
            for (let wx = x; wx < x + w; wx += 5) {
                ctx.lineTo(wx, wy + Math.sin(wx * 0.05 + Date.now() * 0.002) * 5);
            }
            ctx.stroke();
        }
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText('大河', x + w/2, y + h/2);
        ctx.fillText('大河', x + w/2, y + h/2);
        ctx.textAlign = 'start';
        ctx.restore();
    },

    drawCampfire(ctx, x, y, r, lit) {
        ctx.save();
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x - r, y - 3, r * 2, 6);
        ctx.fillRect(x - 3, y - r, 6, r * 2);
        if (lit) {
            const t = Date.now() * 0.005;
            for (let i = 0; i < 5; i++) {
                const fx = x + Math.sin(t + i) * r * 0.3;
                const fy = y - r * 0.5 - Math.abs(Math.cos(t + i)) * r * 0.8;
                const fs = r * 0.3 + Math.abs(Math.sin(t + i)) * r * 0.2;
                ctx.fillStyle = i % 2 === 0 ? '#ff6600' : '#ffcc00';
                ctx.beginPath();
                ctx.arc(fx, fy, fs, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText('篝火', x, y - r - 8);
        ctx.fillText('篝火', x, y - r - 8);
        ctx.textAlign = 'start';
        ctx.restore();
    },

    drawMount(ctx, x, y, w, h) {
        ctx.save();
        ctx.fillStyle = '#8B6914';
        ctx.beginPath();
        ctx.ellipse(x + w/2, y + h/2, w/2, h/3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#A0782C';
        ctx.beginPath();
        ctx.arc(x + w - 5, y + h*0.3, h*0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#6B4F12';
        ctx.fillRect(x + w*0.2, y + h*0.6, 8, h*0.4);
        ctx.fillRect(x + w*0.5, y + h*0.6, 8, h*0.4);
        ctx.fillRect(x + w*0.7, y + h*0.6, 8, h*0.4);
        ctx.fillStyle = '#D4A030';
        ctx.beginPath();
        ctx.arc(x + w - 5, y + h*0.15, h*0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    },

    drawNPC(ctx, x, y, w, h) {
        ctx.save();
        ctx.fillStyle = '#44aa44';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.arc(x + w/2, y - 10, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x + w/2 - 10, y - 22, 20, 5);
        ctx.fillRect(x + w/2 - 6, y - 30, 12, 10);
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(x + w/2 - 3, y - 12, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.arc(x + w/2 + 3, y - 12, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText('NPC', x + w/2, y - 35);
        ctx.fillText('NPC', x + w/2, y - 35);
        ctx.textAlign = 'start';
        ctx.restore();
    },

    drawGround(ctx, x, y, w, h, color) {
        ctx.fillStyle = color || '#4a7c2e';
        ctx.fillRect(x, y, w, h);
    },

    drawPlatform(ctx, x, y, w, h) {
        ctx.fillStyle = '#8B7355';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#A0896C';
        ctx.fillRect(x, y, w, 4);
        ctx.strokeStyle = '#6B5B45';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, w, h);
    },

    drawMountain(ctx, x, y, w, h) {
        ctx.fillStyle = '#5a6e4a';
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        ctx.lineTo(x + w/2, y);
        ctx.lineTo(x + w, y + h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#4a5e3a';
        ctx.beginPath();
        ctx.moveTo(x + w/4, y + h);
        ctx.lineTo(x + w/2, y + h*0.3);
        ctx.lineTo(x + w*3/4, y + h);
        ctx.closePath();
        ctx.fill();
    },

    drawCloud(ctx, x, y, w) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(x, y, w*0.3, 0, Math.PI*2);
        ctx.arc(x + w*0.3, y - w*0.1, w*0.25, 0, Math.PI*2);
        ctx.arc(x + w*0.6, y, w*0.3, 0, Math.PI*2);
        ctx.arc(x + w*0.3, y + w*0.1, w*0.25, 0, Math.PI*2);
        ctx.fill();
    },

    drawTree(ctx, x, y, h) {
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x - 4, y - h*0.4, 8, h*0.4);
        ctx.fillStyle = '#228B22';
        ctx.beginPath();
        ctx.moveTo(x, y - h);
        ctx.lineTo(x - h*0.3, y - h*0.3);
        ctx.lineTo(x + h*0.3, y - h*0.3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#2E8B2E';
        ctx.beginPath();
        ctx.moveTo(x, y - h*0.7);
        ctx.lineTo(x - h*0.25, y - h*0.1);
        ctx.lineTo(x + h*0.25, y - h*0.1);
        ctx.closePath();
        ctx.fill();
    },

    drawHouse(ctx, x, y, w, h) {
        ctx.fillStyle = '#D2B48C';
        ctx.fillRect(x, y + h*0.3, w, h*0.7);
        ctx.fillStyle = '#8B4513';
        ctx.beginPath();
        ctx.moveTo(x - 5, y + h*0.3);
        ctx.lineTo(x + w/2, y);
        ctx.lineTo(x + w + 5, y + h*0.3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#654321';
        ctx.fillRect(x + w*0.35, y + h*0.5, w*0.3, h*0.5);
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(x + w*0.15, y + h*0.45, w*0.15, w*0.15);
        ctx.fillRect(x + w*0.7, y + h*0.45, w*0.15, w*0.15);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText('房子', x + w/2, y - 5);
        ctx.fillText('房子', x + w/2, y - 5);
        ctx.textAlign = 'start';
    },

    drawMountCoin(ctx, x, y, r) {
        ctx.save();
        const t = Date.now() * 0.003;
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(x, y + Math.sin(t) * 3, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#cc9900';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = `${r}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('M', x, y + Math.sin(t) * 3);
        ctx.restore();
    },

    drawProjectile(ctx, x, y, type) {
        ctx.save();
        switch(type) {
            case 'arrow':
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x - 8, y - 2, 16, 4);
                ctx.fillStyle = '#ccc';
                ctx.beginPath();
                ctx.moveTo(x + 8, y);
                ctx.lineTo(x + 14, y - 4);
                ctx.lineTo(x + 14, y + 4);
                ctx.closePath();
                ctx.fill();
                break;
            case 'bullet':
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                break;
            case 'laser':
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(x - 10, y - 1, 20, 2);
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 8;
                ctx.fillRect(x - 10, y - 1, 20, 2);
                ctx.shadowBlur = 0;
                break;
            case 'explosion':
                ctx.fillStyle = '#ff4400';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                break;
            default:
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
        }
        ctx.restore();
    },

    drawMaterial(ctx, x, y, type) {
        ctx.save();
        switch(type) {
            case 'wood':
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x - 3, y - 8, 6, 16);
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 1;
                ctx.strokeRect(x - 3, y - 8, 6, 16);
                break;
            case 'ore':
                ctx.fillStyle = '#888';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#aaa';
                ctx.beginPath();
                ctx.arc(x - 2, y - 2, 2, 0, Math.PI * 2);
                ctx.fill();
                break;
            case 'herb':
                ctx.fillStyle = '#44cc44';
                ctx.beginPath();
                ctx.moveTo(x, y - 8);
                ctx.lineTo(x - 4, y + 4);
                ctx.lineTo(x + 4, y + 4);
                ctx.closePath();
                ctx.fill();
                break;
            default:
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
        }
        ctx.restore();
    }
};
</script>

<script>
// ========== 碰撞检测工具 ==========
const Collision = {
    rectRect(r1, r2) {
        return r1.x < r2.x + r2.w &&
               r1.x + r1.w > r2.x &&
               r1.y < r2.y + r2.h &&
               r1.y + r1.h > r2.y;
    },
    circleCircle(c1, c2) {
        const dx = c1.x - c2.x;
        const dy = c1.y - c2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        return dist < c1.r + c2.r;
    },
    pointRect(px, py, r) {
        return px >= r.x && px <= r.x + r.w &&
               py >= r.y && py <= r.y + r.h;
    },
    pointCircle(px, py, c) {
        const dx = px - c.x;
        const dy = py - c.y;
        return dx * dx + dy * dy < c.r * c.r;
    },
    rectCircle(r, c) {
        const closestX = Math.max(r.x, Math.min(c.x, r.x + r.w));
        const closestY = Math.max(r.y, Math.min(c.y, r.y + r.h));
        const dx = c.x - closestX;
        const dy = c.y - closestY;
        return dx * dx + dy * dy < c.r * c.r;
    },
    getOverlap(r1, r2) {
        const overlapX = Math.min(r1.x + r1.w, r2.x + r2.w) - Math.max(r1.x, r2.x);
        const overlapY = Math.min(r1.y + r1.h, r2.y + r2.h) - Math.max(r1.y, r2.y);
        return { x: overlapX, y: overlapY };
    }
};
</script>

<script>
// ========== 动画系统 ==========
const Animation = {
    animations: [],
    tween(obj, props, duration, easing, onComplete) {
        const anim = {
            obj,
            startProps: {},
            endProps: props,
            duration,
            elapsed: 0,
            easing: easing || 'easeOutQuad',
            onComplete: onComplete || null,
            active: true
        };
        for (let key in props) {
            anim.startProps[key] = obj[key];
        }
        this.animations.push(anim);
        return anim;
    },
    easingFuncs: {
        linear: t => t,
        easeInQuad: t => t * t,
        easeOutQuad: t => t * (2 - t),
        easeInOutQuad: t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
        easeOutBounce: t => {
            if (t < 1/2.75) return 7.5625 * t * t;
            if (t < 2/2.75) return 7.5625 * (t -= 1.5/2.75) * t + 0.75;
            if (t < 2.5/2.75) return 7.5625 * (t -= 2.25/2.75) * t + 0.9375;
            return 7.5625 * (t -= 2.625/2.75) * t + 0.984375;
        },
        easeOutElastic: t => {
            if (t === 0 || t === 1) return t;
            return Math.pow(2, -10 * t) * Math.sin((t - 1) * (2 * Math.PI) / 0.3) + 1;
        }
    },
    update(dt) {
        for (let i = this.animations.length - 1; i >= 0; i--) {
            const anim = this.animations[i];
            if (!anim.active) {
                this.animations.splice(i, 1);
                continue;
            }
            anim.elapsed += dt;
            const progress = Math.min(anim.elapsed / anim.duration, 1);
            const easedProgress = this.easingFuncs[anim.easing](progress);
            for (let key in anim.endProps) {
                anim.obj[key] = anim.startProps[key] + (anim.endProps[key] - anim.startProps[key]) * easedProgress;
            }
            if (progress >= 1) {
                anim.active = false;
                if (anim.onComplete) anim.onComplete();
                this.animations.splice(i, 1);
            }
        }
    },
    clear() {
        this.animations = [];
    },
    particles: [],
    spawnParticles(x, y, count, color, speed, life) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = speed * (0.5 + Math.random());
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd - spd * 0.5,
                life: life * (0.5 + Math.random() * 0.5),
                maxLife: life,
                color,
                size: 2 + Math.random() * 3
            });
        }
    },
    updateParticles(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 200 * dt;
            p.life -= dt;
            if (p.life <= 0) {
                this.particles.splice(i, 1);
            }
        }
    },
    drawParticles(ctx) {
        for (const p of this.particles) {
            const alpha = p.life / p.maxLife;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
};
</script>

<script>
// ========== 键盘输入管理 ==========
const Input = {
    keys: {},
    justPressed: {},
    justReleased: {},

    init() {
        this.keys = {};
        this.justPressed = {};
        this.justReleased = {};

        window.addEventListener('keydown', (e) => {
            let keyName = e.key.toLowerCase();
            if (e.code === 'Space') keyName = 'space';

            const blockedKeys = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'space', 'f1', 'f8', 'f10', 'tab'];
            if (blockedKeys.includes(keyName) || e.code === 'Space' || e.key === 'F1' || e.key === 'F8' || e.key === 'F10' || e.key === 'Tab') {
                e.preventDefault();
            }

            if (!this.keys[keyName]) {
                this.justPressed[keyName] = true;
            }
            this.keys[keyName] = true;
        });

        window.addEventListener('keyup', (e) => {
            let keyName = e.key.toLowerCase();
            if (e.code === 'Space') keyName = 'space';

            if (e.key === 'F1' || e.key === 'F8' || e.key === 'F10' || e.key === 'Tab') {
                e.preventDefault();
            }

            this.keys[keyName] = false;
            this.justReleased[keyName] = true;
        });
    },

    isKeyDown(key) {
        return !!this.keys[key.toLowerCase()];
    },

    isKeyPressed(key) {
        const k = key.toLowerCase();
        if (this.justPressed[k]) {
            this.justPressed[k] = false;
            return true;
        }
        return false;
    },

    isKeyReleased(key) {
        const k = key.toLowerCase();
        if (this.justReleased[k]) {
            this.justReleased[k] = false;
            return true;
        }
        return false;
    },

    clearFrame() {
        this.justPressed = {};
        this.justReleased = {};
    }
};
</script>

<script>
// ========== 摄像机 ==========
const Camera = {
    x: 0, y: 0, targetX: 0, targetY: 0, smoothFactor: 0.1,

    init() {
        this.x = 0; this.y = 0;
        this.targetX = 0; this.targetY = 0;
    },

    follow(target, canvasW, canvasH, mapW, mapH) {
        this.targetX = target.x - canvasW / 2;
        this.targetY = target.y - canvasH / 2;
        this.x += (this.targetX - this.x) * this.smoothFactor;
        this.y += (this.targetY - this.y) * this.smoothFactor;
        this.x = Math.max(0, Math.min(mapW - canvasW, this.x));
        this.y = Math.max(0, Math.min(mapH - canvasH, this.y));
    },

    reset() {
        this.x = 0; this.y = 0;
        this.targetX = 0; this.targetY = 0;
    },

    apply(ctx) {
        ctx.save();
        ctx.translate(-this.x, -this.y);
    },

    restore(ctx) {
        ctx.restore();
    }
};
</script>

<script>
// ========== 体力值系统 ==========
const StaminaSystem = {
    maxStamina: 100,
    currentStamina: 100,
    runningCost: 5,
    jumpCost: 10,
    regenStill: 3,
    regenWalk: 1,

    init() {
        this.currentStamina = this.maxStamina;
    },

    update(dt, isRunning, isJumping, isMoving) {
        if (isRunning) {
            this.currentStamina -= this.runningCost * dt;
        } else if (isJumping) {
            this.currentStamina -= this.jumpCost;
        }
        if (!isRunning && !isJumping) {
            if (!isMoving) {
                this.currentStamina += this.regenStill * dt;
            } else {
                this.currentStamina += this.regenWalk * dt;
            }
        }
        this.currentStamina = Math.max(0, Math.min(this.maxStamina, this.currentStamina));
    },

    canRun() {
        return this.currentStamina > 0;
    },

    canJump() {
        return this.currentStamina >= this.jumpCost;
    },

    consumeJump() {
        this.currentStamina = Math.max(0, this.currentStamina - this.jumpCost);
    },

    getRatio() {
        return this.currentStamina / this.maxStamina;
    },

    reset() {
        this.currentStamina = this.maxStamina;
    }
};
</script>

<script>
// ========== 背包系统 ==========
const InventorySystem = {
    slots: [],
    maxSlots: 20,

    init() {
        this.slots = new Array(this.maxSlots).fill(null);
        this.addItem('wood', 5);
        this.addItem('ore', 3);
        this.addItem('herb', 2);
    },

    addItem(itemId, count) {
        for (let i = 0; i < this.slots.length; i++) {
            if (this.slots[i] && this.slots[i].id === itemId) {
                this.slots[i].count += count;
                return true;
            }
        }
        for (let i = 0; i < this.slots.length; i++) {
            if (!this.slots[i]) {
                this.slots[i] = { id: itemId, count: count };
                return true;
            }
        }
        return false;
    },

    removeItem(itemId, count) {
        for (let i = 0; i < this.slots.length; i++) {
            if (this.slots[i] && this.slots[i].id === itemId) {
                this.slots[i].count -= count;
                if (this.slots[i].count <= 0) {
                    this.slots[i] = null;
                }
                return true;
            }
        }
        return false;
    },

    hasItem(itemId, count) {
        count = count || 1;
        for (let i = 0; i < this.slots.length; i++) {
            if (this.slots[i] && this.slots[i].id === itemId) {
                if (this.slots[i].count >= count) return true;
            }
        }
        return false;
    },

    getItemCount(itemId) {
        for (let i = 0; i < this.slots.length; i++) {
            if (this.slots[i] && this.slots[i].id === itemId) {
                return this.slots[i].count;
            }
        }
        return 0;
    },

    getItems() {
        return this.slots.filter(s => s !== null);
    },

    reset() {
        this.slots = new Array(this.maxSlots).fill(null);
    }
};
</script>

<script>

    addWeapon(weaponId) {

        if (weapon && !this.weapons.find(w => w.id === weaponId)) {
            this.weapons.push({ ...weapon });

<script>
// ========== 制作系统 ==========
const CraftingSystem = {
    recipes: [
        { id: 'stone_sword', name: '石剑', type: 'weapon', materials: { wood: 2, ore: 1 } },
        { id: 'iron_sword', name: '铁剑', type: 'weapon', materials: { wood: 2, ore: 3 } },
        { id: 'spear', name: '长矛', type: 'weapon', materials: { wood: 3, ore: 2 } },
        { id: 'bow', name: '弓箭', type: 'weapon', materials: { wood: 4, ore: 1 } },
        { id: 'pistol', name: '手枪', type: 'weapon', materials: { ore: 4, herb: 1 } },
        { id: 'rifle', name: '步枪', type: 'weapon', materials: { ore: 5, herb: 2 } },
        { id: 'stun_baton', name: '电击棒', type: 'weapon', materials: { ore: 3, herb: 2 } },
        { id: 'laser_sword', name: '激光剑', type: 'weapon', materials: { ore: 6, herb: 3, wood: 2 } },
        { id: 'explosive_bow', name: '爆炸弓', type: 'weapon', materials: { ore: 5, herb: 3, wood: 3 } },
        { id: 'railgun', name: '电磁炮', type: 'weapon', materials: { ore: 8, herb: 4 } },
        { id: 'armor_light', name: '轻甲', type: 'armor', materials: { ore: 3, wood: 2 }, defense: 5 },
        { id: 'armor_heavy', name: '重甲', type: 'armor', materials: { ore: 6, herb: 2 }, defense: 10 },
        { id: 'healing_salve', name: '回伤药膏', type: 'consumable', materials: { herb: 3, wood: 1 }, healAmount: 5 },
        { id: 'campfire', name: '篝火', type: 'building', materials: { wood: 5 }, special: 'campfire' },
    ],

    init() {},

    getRecipes() {
        return this.recipes;
    },

    canCraft(recipe) {
        for (let mat in recipe.materials) {
            if (!InventorySystem.hasItem(mat, recipe.materials[mat])) {
                return false;
            }
        }
        return true;
    },

    craft(recipeId) {
        const recipe = this.recipes.find(r => r.id === recipeId);
        if (!recipe) return { success: false, message: '未知配方' };
        if (!this.canCraft(recipe)) {
            return { success: false, message: '材料不足' };
        }
        for (let mat in recipe.materials) {
            InventorySystem.removeItem(mat, recipe.materials[mat]);
        }
        if (recipe.type === 'weapon') {
            WeaponSystem.addWeapon(recipe.id);
            return { success: true, message: `制作成功: ${recipe.name}` };
        } else if (recipe.type === 'armor') {
            InventorySystem.addItem(recipe.id, 1);
            return { success: true, message: `制作成功: ${recipe.name} (防御+${recipe.defense})` };
        } else if (recipe.type === 'consumable') {
            InventorySystem.addItem(recipe.id, 1);
            return { success: true, message: `制作成功: ${recipe.name} (+${recipe.healAmount} HP)` };
        } else if (recipe.type === 'building') {
            InventorySystem.addItem(recipe.id, 1);
            return { success: true, message: `制作成功: ${recipe.name}` };
        }
        return { success: false, message: '制作失败' };
    },

    reset() {}
};
</script>

<script>
// ========== 战斗系统 ==========
const CombatSystem = {
    projectiles: [],
    attackCooldown: 0,
    baseAttackCooldown: 0.5,
    ultimateCooldown: 0,
    ultimateMaxCooldown: 8,

    init() {
        this.projectiles = [];
        this.attackCooldown = 0;
        this.ultimateCooldown = 0;
    },

    update(dt) {
        if (this.attackCooldown > 0) this.attackCooldown -= dt;
        if (this.ultimateCooldown > 0) this.ultimateCooldown -= dt;
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const p = this.projectiles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) this.projectiles.splice(i, 1);
        }
    },

    attack(player, weapon, targetX, targetY) {
        if (this.attackCooldown > 0) return null;
        this.attackCooldown = this.baseAttackCooldown;
        if (!weapon) return null;

        const isCrit = weapon.critChance && Math.random() < weapon.critChance;
        const damage = isCrit ? (weapon.critDamage || weapon.damage) : weapon.damage;

        const dx = targetX - player.x;
        const dy = targetY - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const nx = dist > 0 ? dx / dist : 1;
        const ny = dist > 0 ? dy / dist : 0;

        if (weapon.category === 'melee') {
            return { type: 'melee', x: player.x + nx * weapon.range, y: player.y + ny * weapon.range, range: weapon.range, damage, isCrit, weaponId: weapon.id };
        } else {
            const speed = 500;
            const projectileType = WeaponSystem.getProjectileType(weapon);
            this.projectiles.push({ x: player.x + nx * 20, y: player.y + ny * 20, vx: nx * speed, vy: ny * speed, damage, isCrit, life: 2, type: projectileType, weaponId: weapon.id });
            return null;
        }
    },

    useUltimate(player) {
        if (this.ultimateCooldown > 0) return null;
        this.ultimateCooldown = this.ultimateMaxCooldown;
        return { type: 'ultimate', x: player.x, y: player.y, radius: 200, damage: 80 };
    },

    canUseUltimate() {
        return this.ultimateCooldown <= 0;
    },

    getUltimateCooldown() {
        return Math.max(0, this.ultimateCooldown);
    },

    checkProjectileHit(px, py, pr, enemy) {
        const dx = px - enemy.x;
        const dy = py - enemy.y;
        return Math.sqrt(dx * dx + dy * dy) < pr + enemy.radius;
    },

    draw(ctx) {
        for (const p of this.projectiles) {
            Assets.drawProjectile(ctx, p.x, p.y, p.type);
        }
    },

    reset() {
        this.projectiles = [];
        this.attackCooldown = 0;
        this.ultimateCooldown = 0;
    }
};
</script>

<script>
// ========== 玩家 ==========
const Player = {
    x: 100, y: 300, w: 30, h: 40, vx: 0, vy: 0,
    speed: 200, runSpeed: 350, jumpForce: -450,
    onGround: false, facing: 1,
    hp: 100, maxHp: 100,
    state: 'idle',
    carryingEnemy: null, defense: 0,
    hasShield: true,
    radius: 15, angle: 0,
    inHouse: false,

    init() {
        this.x = 100; this.y = 300;
        this.vx = 0; this.vy = 0;
        this.onGround = false; this.facing = 1;
        this.hp = this.maxHp; this.state = 'idle';
        this.carryingEnemy = null; this.defense = 0;
        this.inHouse = false;
        StaminaSystem.reset();
    },

    update(dt, input, platforms, levelType) {
        if (levelType === 'canyon') this.updateCanyon(dt, input, platforms);
        else this.updateGrassland(dt, input);
    },

    updateCanyon(dt, input, platforms) {
        const isRunning = input.isKeyDown('shift') && StaminaSystem.canRun();
        const speed = isRunning ? this.runSpeed : this.speed;

        if (input.isKeyDown('a') || input.isKeyDown('arrowleft')) { this.vx = -speed; this.facing = -1; }
        else if (input.isKeyDown('d') || input.isKeyDown('arrowright')) { this.vx = speed; this.facing = 1; }
        else { this.vx *= 0.8; if (Math.abs(this.vx) < 10) this.vx = 0; }

        if (input.isKeyPressed('space') && this.onGround && StaminaSystem.canJump() && this.state !== 'trebuchet' && this.state !== 'bungee' && this.state !== 'sedan') {
            this.vy = this.jumpForce;
            this.onGround = false;
            StaminaSystem.consumeJump();
        }

        this.vy += 980 * dt;
        if (this.vy > 800) this.vy = 800;
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.onGround = false;
        for (const p of platforms) {
            if (Collision.rectRect({ x: this.x, y: this.y, w: this.w, h: this.h }, { x: p.x, y: p.y, w: p.w, h: p.h })) {
                if (this.vy > 0 && this.y + this.h - this.vy * dt <= p.y + 5) {
                    this.y = p.y - this.h; this.vy = 0; this.onGround = true;
                } else if (this.vy < 0 && this.y - this.vy * dt >= p.y + p.h - 5) {
                    this.y = p.y + p.h; this.vy = 0;
                } else if (this.vx > 0) { this.x = p.x - this.w; this.vx = 0; }
                else if (this.vx < 0) { this.x = p.x + p.w; this.vx = 0; }
            }
        }

        if (this.x < 0) this.x = 0;
        if (this.y > 600) { this.y = 300; this.x = 100; this.vy = 0; this.hp -= 5; }

        if (!this.onGround) this.state = this.vy < 0 ? 'jumping' : 'falling';
        else if (Math.abs(this.vx) > 10) this.state = isRunning ? 'running' : 'walking';
        else this.state = 'idle';

        StaminaSystem.update(dt, isRunning && this.state === 'running', false, this.state === 'walking');
    },

    updateGrassland(dt, input) {
        const isRunning = input.isKeyDown('shift') && StaminaSystem.canRun();
        const speed = isRunning ? this.runSpeed * 0.7 : this.speed * 0.7;
        let dx = 0, dy = 0;
        if (input.isKeyDown('a') || input.isKeyDown('arrowleft')) dx -= 1;
        if (input.isKeyDown('d') || input.isKeyDown('arrowright')) dx += 1;
        if (input.isKeyDown('w') || input.isKeyDown('arrowup')) dy -= 1;
        if (input.isKeyDown('s') || input.isKeyDown('arrowdown')) dy += 1;

        if (dx !== 0 || dy !== 0) {
            const len = Math.sqrt(dx * dx + dy * dy);
            dx /= len; dy /= len;
            this.angle = Math.atan2(dy, dx);
        }
        this.x += dx * speed * dt;
        this.y += dy * speed * dt;
        this.x = Math.max(this.radius, Math.min(1600 - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(1200 - this.radius, this.y));
        this.state = (dx !== 0 || dy !== 0) ? (isRunning ? 'running' : 'walking') : 'idle';
        StaminaSystem.update(dt, isRunning && (dx !== 0 || dy !== 0), false, this.state === 'walking');
    },

    takeDamage(amount) {
        let actualDmg = amount;
        if (this.hasShield) actualDmg = amount * 0.5;
        actualDmg = Math.max(1, actualDmg - this.defense);
        this.hp -= actualDmg;
        if (this.hp <= 0) { this.hp = 0; this.state = 'dead'; }
        return actualDmg;
    },

    heal(amount) {
        this.hp = Math.min(this.maxHp, this.hp + amount);
    },

    isAlive() {
        return this.hp > 0;
    },

    draw(ctx, levelType) {
        if (levelType === 'canyon') {
            Assets.drawPlayer(ctx, this.x, this.y, this.w, this.h, this.facing, this.state);
            if (this.carryingEnemy && this.state === 'carrying') {
                Assets.drawEnemy(ctx, this.x + this.w, this.y - 10, 20, 25, false);
            }
        } else {
            Assets.drawPlayerTopDown(ctx, this.x, this.y, this.radius, this.angle);
        }
    }
};
</script>

<script>
// ========== 敌人 ==========
const Enemy = {
    enemies: [],

    spawn(x, y, levelType) {
        this.enemies.push({
            x, y, radius: levelType === 'grassland' ? 15 : 0, w: 25, h: 30,
            hp: 20, maxHp: 20, damage: 1, speed: 80, alive: true,
            state: 'patrol', patrolX: x, patrolRange: 100, patrolDir: 1,
            levelType: levelType || 'grassland', attackCooldown: 0, vx: 0, vy: 0, inWater: false
        });
    },

    spawnGrasslandEnemies(count) {
        this.enemies = [];
        for (let i = 0; i < count; i++) {
            this.spawn(200 + Math.random() * 1200, 200 + Math.random() * 800, 'grassland');
        }
    },

    update(dt, player, riverBounds) {
        for (const enemy of this.enemies) {
            if (!enemy.alive) continue;
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (riverBounds) enemy.inWater = Collision.pointRect(enemy.x, enemy.y, riverBounds);
            if (dist < 50) enemy.state = 'attack';
            else if (dist < 250) enemy.state = 'chase';
            else enemy.state = 'patrol';

            switch (enemy.state) {
                case 'patrol':
                    enemy.x += enemy.patrolDir * enemy.speed * 0.5 * dt;
                    if (Math.abs(enemy.x - enemy.patrolX) > enemy.patrolRange) enemy.patrolDir *= -1;
                    break;
                case 'chase':
                    if (dist > 0) {
                        const speed = enemy.inWater ? enemy.speed * 0.4 : enemy.speed;
                        enemy.x += (dx / dist) * speed * dt;
                        enemy.y += (dy / dist) * speed * dt;
                    }
                    break;
                case 'attack':
                    enemy.attackCooldown -= dt;
                    if (enemy.attackCooldown <= 0 && dist < 50) {
                        if (!player.inHouse) player.takeDamage(enemy.damage);
                        enemy.attackCooldown = 1.5;
                        Animation.spawnParticles(player.x, player.y, 5, '#ff4444', 100, 0.3);
                    }
                    break;
            }
            enemy.x = Math.max(20, Math.min(1580, enemy.x));
            enemy.y = Math.max(20, Math.min(1180, enemy.y));
        }
    },

    hitEnemy(enemy, damage) {
        if (!enemy.alive) return false;
        enemy.hp -= damage;
        Animation.spawnParticles(enemy.x, enemy.y, 8, '#ffaa00', 80, 0.4);
        if (enemy.hp <= 0) { enemy.hp = 0; enemy.alive = false; enemy.state = 'dead'; return true; }
        return false;
    },

    getDeadEnemyAt(x, y, radius) {
        for (const enemy of this.enemies) {
            if (!enemy.alive) {
                const dx = enemy.x - x, dy = enemy.y - y;
                if (Math.sqrt(dx*dx + dy*dy) < radius + enemy.radius) return enemy;
            }
        }
        return null;
    },

    getAliveCount() { return this.enemies.filter(e => e.alive).length; },

    draw(ctx) {
        for (const enemy of this.enemies) {
            if (enemy.levelType === 'grassland') Assets.drawEnemyTopDown(ctx, enemy.x, enemy.y, enemy.radius, enemy.alive);
            else Assets.drawEnemy(ctx, enemy.x, enemy.y, enemy.w, enemy.h, enemy.alive);
        }
    },

    reset() { this.enemies = []; }
};
</script>

<script>
// ========== 坐骑 ==========
const MountSystem = {
    mount: null, active: false, coin: null, coinCollected: false,

    init() { this.mount = null; this.active = false; this.coin = null; this.coinCollected = false; },

    spawnCoin(x, y) { this.coin = { x, y, r: 12, collected: false }; },

    collectCoin(player) {
        if (!this.coin || this.coin.collected) return false;
        const dx = player.x - this.coin.x, dy = player.y - this.coin.y;
        if (Math.sqrt(dx*dx + dy*dy) < player.radius + this.coin.r) {
            this.coin.collected = true;
            this.coinCollected = true;
            this.activateMount(player.x, player.y);
            return true;
        }
        return false;
    },

    activateMount(x, y) { this.mount = { x: x + 40, y: y + 40, w: 50, h: 30 }; this.active = true; },

    update(player) {
        if (this.active && this.mount) {
            const dx = player.x - this.mount.x, dy = player.y - this.mount.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 60) {
                this.mount.x += (dx / dist) * 200 * 0.016;
                this.mount.y += (dy / dist) * 200 * 0.016;
            }
        }
    },

    draw(ctx) {
        if (this.coin && !this.coin.collected) Assets.drawMountCoin(ctx, this.coin.x, this.coin.y, this.coin.r);
        if (this.active && this.mount) Assets.drawMount(ctx, this.mount.x, this.mount.y, this.mount.w, this.mount.h);
    },

    reset() { this.mount = null; this.active = false; this.coin = null; this.coinCollected = false; }
};
</script>

<script>
// ========== 投石机 ==========
const Trebuchet = {
    x: 520, y: 340, w: 80, h: 60,
    active: false, launching: false, launchProgress: 0, launchDuration: 2, playerOn: false,

    init() { this.active = false; this.launching = false; this.launchProgress = 0; this.playerOn = false; },

    mountPlayer(player) {
        if (this.playerOn) return false;
        const dx = player.x + player.w/2 - (this.x + this.w/2);
        const dy = player.y + player.h - this.y;
        if (Math.abs(dx) < 100 && dy > -40 && dy < 100) {
            this.playerOn = true;
            player.state = 'trebuchet';
            player.x = this.x + this.w/2 - player.w/2;
            player.y = this.y - player.h + 10;
            player.vx = 0; player.vy = 0;
            return true;
        }
        return false;
    },

    launch(player) {
        this.launching = true; this.launchProgress = 0; this.playerOn = false;
        player.state = 'jumping';
        player.vy = -500; player.vx = 450;
        player.onGround = false;
        return true;
    },

    update(dt, player) {
        if (this.launching) {
            this.launchProgress += dt;
            if (this.launchProgress >= this.launchDuration) { this.launching = false; this.launchProgress = 0; }
        }

    draw(ctx) { Assets.drawTrebuchet(ctx, this.x, this.y, this.w, this.h); }

<script>
// ========== 蹦极 ==========
const Bungee = {
    x: 820, y: 160, w: 120, h: 15,
    active: false, playerOn: false, bungeeY: 0, bungeeVy: 0,
    bungeeActive: false, ropeLength: 200, anchorY: 160,

    init() { this.active = false; this.playerOn = false; this.bungeeY = 0; this.bungeeVy = 0; this.bungeeActive = false; },

    mountPlayer(player) {
        if (this.bungeeActive) return false;
        const dx = player.x + player.w/2 - (this.x + this.w/2);
        const dy = Math.abs(player.y + player.h - this.y);
        if (Math.abs(dx) < 80 && dy < 60) {
            this.playerOn = true;
            player.state = 'bungee';
            player.x = this.x + this.w/2 - player.w/2;
            player.y = this.y + this.h;
            player.vx = 0; player.vy = 0;
            this.bungeeY = this.y + this.h;
            return true;
        }
        return false;
    },

    startBungee(player) {
        if (!this.playerOn) return false;
        this.bungeeActive = true;
        this.bungeeY = this.y + this.h; this.bungeeVy = 0;
        player.state = 'bungee';
        player.x = this.x + this.w/2 - player.w/2;
        player.y = this.bungeeY;
        return true;
    },

    stopBungee(player) {
        if (!this.bungeeActive) return false;
        this.bungeeActive = false; this.playerOn = false;
        player.state = 'idle';
        player.y = this.y - player.h;
        player.vy = 0; player.vx = 0;
        player.onGround = true;
        return true;
    },

    update(dt, player) {
        if (this.bungeeActive) {
            this.bungeeVy += 980 * dt;
            this.bungeeY += this.bungeeVy * dt;
            const stretch = this.bungeeY - this.anchorY;
            if (stretch > this.ropeLength) {
                const force = (stretch - this.ropeLength) * 8;
                this.bungeeVy -= force * dt;
                if (this.bungeeY > this.anchorY + this.ropeLength + 80) {
                    this.bungeeVy = Math.min(this.bungeeVy, -150);
                }
            }
            player.y = this.bungeeY;
        }
    },

    draw(ctx) {
        Assets.drawPlatform(ctx, this.x, this.y, this.w, this.h);
        if (this.bungeeActive) {
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(this.x + this.w/2, this.anchorY);
            ctx.lineTo(this.x + this.w/2, this.bungeeY);
            ctx.stroke();
        }
        ctx.fillStyle = '#666';
        ctx.fillRect(this.x + 5, this.y - 20, 8, 20);
        ctx.fillRect(this.x + this.w - 13, this.y - 20, 8, 20);
    }
};
</script>

<script>
// ========== 蹦床 ==========
const Trampoline = {
    x: 940, y: 300, w: 80, h: 20,
    active: false,
    bouncePower: 520, superBouncePower: 780,
    bounceCount: 0, requiredBounces: 3,

    init() { this.active = false; this.bounceCount = 0; },

    isPlayerOn(player) {
        const playerBottom = player.y + player.h;
        const playerMidX = player.x + player.w / 2;
        return playerMidX > this.x && playerMidX < this.x + this.w &&
               Math.abs(playerBottom - this.y) < 10;
    },

    checkBounce(player, isSuperJump, pressedSpace) {
        const playerBottom = player.y + player.h;
        const playerMidX = player.x + player.w / 2;
        const onTrampoline = playerMidX > this.x && playerMidX < this.x + this.w &&
                            playerBottom >= this.y && playerBottom <= this.y + this.h + 15;
        if (onTrampoline && player.vy >= 0) {
            if (player.vy > 0 || pressedSpace) {
                const power = isSuperJump ? this.superBouncePower : this.bouncePower;
                player.vy = -power;
                player.onGround = false;
                this.bounceCount++;
                return true;
            }
        }
        return false;
    },

    draw(ctx) {
        Assets.drawTrampoline(ctx, this.x, this.y, this.w, this.h);
        if (this.bounceCount > 0) {
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 14px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText(`${this.bounceCount}/${this.requiredBounces}`, this.x + this.w/2, this.y - 5);
            ctx.textAlign = 'start';
        }
    }
};
</script>

<script>

    init() { this.active = false; this.playerOn = false; this.movingX = 0; this.started = false; this.transitionComplete = false; },

    mountPlayer(player) {

        const dy = Math.abs(player.y + player.h - this.y);

            player.y = this.y + this.h/2 - player.h/2;

            return true;

        return false;

    update(dt) {
        if (this.started) {
            this.movingX += 150 * dt;
            this.x += 150 * dt;
            if (this.movingX > 300) this.transitionComplete = true;

<script>
// ========== 篝火 ==========
const Campfire = {
    x: 150, y: 600, radius: 20,
    lit: false, hasEnemy: false, cookingProgress: 0, cookDuration: 10, cooked: false,

    init() { this.lit = false; this.hasEnemy = false; this.cookingProgress = 0; this.cooked = false; },

    canBuild(player) {
        const dx = player.x - this.x, dy = player.y - this.y;
        return Math.sqrt(dx*dx + dy*dy) < 50;
    },

    build() {
        if (InventorySystem.hasItem('campfire')) {
            InventorySystem.removeItem('campfire', 1);
            this.lit = true;
            return true;
        }
        return false;
    },

    throwEnemy(player) {
        if (!this.lit || this.hasEnemy) return false;
        const dx = player.x - this.x, dy = player.y - this.y;
        if (Math.sqrt(dx*dx + dy*dy) < 60) {
            this.hasEnemy = true; this.cookingProgress = 0; this.cooked = false;
            return true;
        }
        return false;
    },

    takeFood() {
        if (!this.cooked) return false;
        this.hasEnemy = false; this.cooked = false; this.cookingProgress = 0;
        return true;
    },

    update(dt) {
        if (this.hasEnemy && this.lit && !this.cooked) {
            this.cookingProgress += dt;
            if (this.cookingProgress >= this.cookDuration) {
                this.cooked = true;
                return { cookingDone: true };
            }
        }
        return null;
    },

    draw(ctx) {
        Assets.drawCampfire(ctx, this.x, this.y, this.radius, this.lit);
        if (this.hasEnemy && !this.cooked) {
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(this.x - 30, this.y - 40, 60, 12);
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(this.x - 28, this.y - 38, 56 * (this.cookingProgress / this.cookDuration), 8);
            ctx.fillStyle = '#fff';
            ctx.font = '10px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText(`烤制中 ${Math.ceil(this.cookDuration - this.cookingProgress)}s`, this.x, this.y - 45);
            ctx.textAlign = 'start';
            ctx.restore();
        }
        if (this.cooked) {
            ctx.save();
            ctx.fillStyle = '#44cc44';
            ctx.font = 'bold 12px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.strokeText('烤好了！按回车取出', this.x, this.y - 50);
            ctx.fillText('烤好了！按回车取出', this.x, this.y - 50);
            ctx.textAlign = 'start';
            ctx.restore();
        }
    }
};
</script>

<script>
// ========== HUD ==========
const HUD = {
    init() { this.updateHP(); this.updateStamina(); },

    updateHP() {
        const ratio = Player.hp / Player.maxHp;
        document.getElementById('hp-bar-fill').style.width = (ratio * 100) + '%';
        document.getElementById('hp-text').textContent = `HP: ${Player.hp}/${Player.maxHp}`;
        if (ratio < 0.3) {
            document.getElementById('hp-bar-fill').style.background = 'linear-gradient(to bottom, #ff0000, #880000)';
        } else {
            document.getElementById('hp-bar-fill').style.background = 'linear-gradient(to bottom, #ff4444, #cc0000)';
        }
    },

    updateStamina() {
        const ratio = StaminaSystem.getRatio();
        document.getElementById('stamina-bar-fill').style.width = (ratio * 100) + '%';
        document.getElementById('stamina-text').textContent = `体力: ${Math.round(StaminaSystem.currentStamina)}/${StaminaSystem.maxStamina}`;
    },

    updateWeapon() {

    updateKillCount(count, max) {

    showTooltip(text, duration) {

        if (duration) setTimeout(() => { el.style.opacity = '0'; }, duration);

    update() { this.updateHP(); this.updateStamina(); this.updateWeapon(); }
};
</script>

<script>
// ========== 武器面板 ==========
const WeaponPanel = {
    init() { this.refresh(); },

    refresh() {
        const container = document.getElementById('weapon-panel-content');
        const allWeapons = WeaponSystem.getAllWeapons();
        const ownedWeapons = WeaponSystem.getOwnedWeapons();
        const equipped = WeaponSystem.getEquippedWeapon();
        const ownedIds = ownedWeapons.map(w => w.id);
        let html = '';
        for (const weapon of allWeapons) {
            const owned = ownedIds.includes(weapon.id);
            const isEquipped = equipped && equipped.id === weapon.id;
            html += `<div class="weapon-entry${isEquipped ? ' equipped' : ''}" style="opacity:${owned ? '1' : '0.3'}">`;
            html += `<div class="wname">${weapon.name} ${isEquipped ? '[装备中]' : ''}</div>`;
            html += `<div class="wtype">[${weapon.type}] ${weapon.category === 'melee' ? '近战' : '远程'}</div>`;
            html += `<div class="wattack">攻击方式: ${weapon.attack}</div>`;
            html += `<div class="wdmg">伤害: ${weapon.damage}${weapon.critDamage ? ' (暴击:' + weapon.critDamage + ')' : ''}</div>`;
            if (!owned && weapon.recipe) {
                const mats = [];
                for (let m in weapon.recipe) {
                    const matNames = { wood: '木头', ore: '矿石', herb: '草药' };
                    mats.push(`${matNames[m] || m}x${weapon.recipe[m]}`);
                }
                html += `<div style="color:#888;font-size:10px;">需要: ${mats.join(', ')}</div>`;
            }
            html += '</div>';
        }
        container.innerHTML = html;
    },

    update() { this.refresh(); }
};
</script>
