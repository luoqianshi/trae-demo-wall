<script>
// ========== 制作UI ==========
const CraftingUI = {
    visible: false,

    toggle() {
        this.visible = !this.visible;
        document.getElementById('crafting-panel').style.display = this.visible ? 'block' : 'none';
        if (this.visible) this.refresh();
    },

    hide() { this.visible = false; document.getElementById('crafting-panel').style.display = 'none'; },

    refresh() {
        const container = document.getElementById('crafting-recipes');
        const recipes = CraftingSystem.getRecipes();
        const itemNames = { wood: '木头', ore: '矿石', herb: '草药' };
        let html = '';
        for (const recipe of recipes) {
            const canCraft = CraftingSystem.canCraft(recipe);
            const mats = [];
            for (let m in recipe.materials) mats.push(`${itemNames[m] || m}: ${recipe.materials[m]}`);
            html += `<div class="recipe${canCraft ? '' : ' locked'}" onclick="CraftingUI.craftRecipe('${recipe.id}')">
                <div class="rname">${recipe.name} [${recipe.type}]</div>
                <div class="rmaterials">材料: ${mats.join(', ')}</div>
                ${canCraft ? '<div class="rcraft-btn">点击制作</div>' : '<div style="color:#ff4444;font-size:10px;">材料不足</div>'}
            </div>`;
        }
        container.innerHTML = html;
    },

    craftRecipe(recipeId) {
        const result = CraftingSystem.craft(recipeId);
        if (result.success) {
            WeaponPanel.refresh(); this.refresh(); InventoryUI.refresh();
            HUD.showTooltip(result.message, 2000);
        } else {
            HUD.showTooltip(result.message, 1500);
        }
    },

    initGlobal() { window.CraftingUI = CraftingUI; }
};
</script>

<script>
// ========== 峡谷关卡 ==========
const CanyonLevel = {
    platforms: [],
    stage: 'walk', stageTimer: 0, flyTimer: 0,
    showPrompt: false, promptText: '', promptTimer: 0,
    mountains: [], clouds: [], trees: [],
    logicW: 1200, logicH: 600,

    init() {
        this.platforms = [
            { x: 0, y: 400, w: 500, h: 200 },
            { x: 480, y: 380, w: 200, h: 220 },
            { x: 750, y: 400, w: 250, h: 200 },
            { x: 950, y: 320, w: 100, h: 15 },
            { x: 880, y: 240, w: 80, h: 15 },
            { x: 800, y: 160, w: 120, h: 15 },
            { x: 920, y: 320, w: 100, h: 15 },
            { x: 880, y: 80, w: 150, h: 15 },
        ];
        this.stage = 'walk'; this.stageTimer = 0; this.flyTimer = 0;
        this.showPrompt = true; this.promptText = '按 F1 上投石机'; this.promptTimer = 0;
        this.mountains = [{x:100,y:200,w:200,h:200},{x:400,y:180,w:250,h:220},{x:700,y:150,w:300,h:250},{x:1000,y:100,w:200,h:200}];
        this.clouds = [{x:150,y:50,w:80},{x:500,y:30,w:100},{x:850,y:60,w:70}];
        this.trees = [{x:150,y:370,h:50},{x:300,y:360,h:60},{x:50,y:380,h:45}];

        Trebuchet.init(); Trebuchet.x = 520; Trebuchet.y = 340;
        NPC.init(580, 340);
        Bungee.init(); Bungee.x = 820; Bungee.y = 160; Bungee.anchorY = 160;
        Trampoline.init(); Trampoline.x = 940; Trampoline.y = 300;
        Sedan.init(); Sedan.x = 910; Sedan.y = 80;
        Player.init(); Player.x = 80; Player.y = 350;
    },

    update(dt, input) {
        this.stageTimer += dt;
        this.updatePrompts();
        switch (this.stage) {
            case 'walk': this.updateWalk(dt, input); break;
            case 'trebuchet': this.updateTrebuchet(dt, input); break;
            case 'trebuchet_dialog': this.updateTrebuchetDialog(dt, input); break;
            case 'launching': this.updateLaunching(dt); break;
            case 'flying': this.updateFlying(dt); break;
            case 'land': this.updateLand(dt, input); break;
            case 'bungee': this.updateBungee(dt, input); break;
            case 'trampoline': this.updateTrampoline(dt, input); break;
            case 'sedan': this.updateSedan(dt); break;
            case 'complete': break;
        }
        Animation.update(dt);
        Animation.updateParticles(dt);
    },

    updateWalk(dt, input) {
        Player.updateCanyon(dt, input, this.platforms);
        const dxToTreb = Math.abs(Player.x - Trebuchet.x);
        if (dxToTreb < 100 && this.stage === 'walk') {
            this.showPrompt = true; this.promptText = '按 F1 上投石机'; this.promptTimer = 0;
        }
        if (input.isKeyPressed('f1')) {
            if (Trebuchet.mountPlayer(Player)) {
                this.stage = 'trebuchet';
                this.showPrompt = true; this.promptText = '按 A 与工作人员对话'; this.promptTimer = 0;
            } else {
                this.showPrompt = true; this.promptText = '靠近投石机再按 F1！'; this.promptTimer = 0;
            }
        }
    },

    updateTrebuchet(dt, input) {
        if (input.isKeyPressed('a') && !DialogBox.isActive()) {
            const text = NPC.startDialogue();
            if (text) { DialogBox.show(text); this.stage = 'trebuchet_dialog'; }
        }
    },

    updateTrebuchetDialog(dt, input) {
        if (input.isKeyPressed('a') && DialogBox.isActive()) {
            const text = NPC.nextDialogue();
            if (text === null) {
                DialogBox.hide();
                Trebuchet.launch(Player);
                this.stage = 'launching'; this.flyTimer = 0;
                this.showPrompt = false;
                Animation.spawnParticles(Trebuchet.x + Trebuchet.w/2, Trebuchet.y, 15, '#ffcc00', 150, 0.5);
            } else { DialogBox.show(text); }
        }
    },

    updateLaunching(dt) {
        this.flyTimer += dt;
        Player.vy += 980 * dt;
        Player.x += Player.vx * dt;
        Player.y += Player.vy * dt;
        if (Player.x > 750 && Player.y > 200) this.stage = 'flying';
        if (Player.y > 620) {
            Player.x = 80; Player.y = 350; Player.vx = 0; Player.vy = 0; Player.onGround = true;
            Trebuchet.playerOn = false; Trebuchet.launching = false; Trebuchet.launchProgress = 0;
            NPC.dialogueIndex = 0; NPC.isTalking = false;
            this.stage = 'walk';
            this.showPrompt = true; this.promptText = '没飞过去！再按 F1 上投石机'; this.promptTimer = 0;
        }
    },

    updateFlying(dt) {
        this.flyTimer += dt;
        Player.vy += 980 * dt;
        Player.x += Player.vx * 0.5 * dt;
        Player.y += Player.vy * dt;
        if (Player.y + Player.h >= 400 && Player.x > 750) {
            Player.y = 400 - Player.h; Player.vy = 0; Player.vx = 0; Player.onGround = true;
            this.stage = 'land'; this.stageTimer = 0;
            this.showPrompt = true; this.promptText = '向右走，跳上台阶，按 T 上蹦极台'; this.promptTimer = 0;
        }
        if (Player.y > 620) {
            Player.x = 80; Player.y = 350; Player.vx = 0; Player.vy = 0; Player.onGround = true;
            Trebuchet.playerOn = false;
            this.stage = 'walk';
            this.showPrompt = true; this.promptText = '没飞过去！再按 F1 上投石机'; this.promptTimer = 0;
        }
    },

    updateLand(dt, input) {
        Player.updateCanyon(dt, input, this.platforms);
        if (input.isKeyPressed('t')) {
            if (Bungee.mountPlayer(Player)) {
                this.stage = 'bungee';
                this.showPrompt = true; this.promptText = '按 空格 跳下蹦极'; this.promptTimer = 0;
            } else {
                this.showPrompt = true; this.promptText = '靠近蹦极台再按 T！'; this.promptTimer = 0;
            }
        }
    },

    updateBungee(dt, input) {
        if (!Bungee.bungeeActive) {
            if (input.isKeyPressed('space')) { Bungee.startBungee(Player); this.showPrompt = false; }
        } else {
            Bungee.update(dt, Player);
            if (input.isKeyPressed('1')) {
                Bungee.stopBungee(Player);
                this.stage = 'trampoline';
                this.showPrompt = true; this.promptText = '走到蹦床上，按 空格 弹跳！'; this.promptTimer = 0;
            }
        }
    },

    updateTrampoline(dt, input) {
        const onTrampoline = Trampoline.isPlayerOn(Player);
        const originalCanJump = StaminaSystem.canJump;
        if (onTrampoline) StaminaSystem.canJump = () => false;
        Player.updateCanyon(dt, input, this.platforms);
        StaminaSystem.canJump = originalCanJump;

        const spaceDown = input.isKeyDown('space');
        const isSuper = input.isKeyDown('shift');
        if (spaceDown || Player.vy > 0) {
            if (Trampoline.checkBounce(Player, isSuper, spaceDown)) {
                Animation.spawnParticles(Player.x + Player.w/2, Player.y + Player.h, 5, '#ffaa00', 60, 0.3);
                if (Trampoline.bounceCount >= Trampoline.requiredBounces) {
                    Player.y = 80 - Player.h; Player.vy = 0; Player.onGround = true;
                    this.stage = 'sedan';
                    this.showPrompt = true; this.promptText = '轿子来接你了！前往大草原...'; this.promptTimer = 0;
                    Sedan.mountPlayer(Player);
                } else {
                    this.showPrompt = true;
                    this.promptText = `弹跳 ${Trampoline.bounceCount}/${Trampoline.requiredBounces} 次，继续按空格！按 Shift 超级跳`;
                    this.promptTimer = 0;
                }
            }
        }
        if (onTrampoline && Trampoline.bounceCount === 0 && !spaceDown) {
            this.showPrompt = true;
            this.promptText = `在蹦床上按空格弹跳 ${Trampoline.requiredBounces} 次到达轿子（按 Shift 超级跳）`;
            this.promptTimer = 0;
        }
    },

    updateSedan(dt) {
        Sedan.update(dt);
        if (Sedan.playerOn) {
            Player.x = Sedan.x + Sedan.w/2 - Player.w/2;
            Player.y = Sedan.y + Sedan.h/2 - Player.h/2;
        }
        if (Sedan.transitionComplete) { this.stage = 'complete'; this.showPrompt = false; }
    },

    updatePrompts() {
        this.promptTimer += 0.016;
        if (this.promptTimer > 5) this.showPrompt = false;
    },

    isComplete() { return this.stage === 'complete'; },

    draw(ctx) {
        const gradient = ctx.createLinearGradient(0, 0, 0, this.logicH);
        gradient.addColorStop(0, '#87CEEB');
        gradient.addColorStop(0.6, '#B0E0E6');
        gradient.addColorStop(1, '#E0F0FF');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, this.logicW, this.logicH);

        for (const m of this.mountains) Assets.drawMountain(ctx, m.x, m.y, m.w, m.h);
        for (const c of this.clouds) Assets.drawCloud(ctx, c.x + Math.sin(Date.now()*0.0005 + c.x) * 10, c.y, c.w);
        for (const t of this.trees) Assets.drawTree(ctx, t.x, t.y, t.h);
        for (const p of this.platforms) Assets.drawPlatform(ctx, p.x, p.y, p.w, p.h);

        ctx.fillStyle = '#2a1a0a';
        ctx.fillRect(660, 400, 110, 200);

        Trebuchet.draw(ctx);
        NPC.draw(ctx);
        Bungee.draw(ctx);
        Trampoline.draw(ctx);
        if (this.stage === 'sedan' || this.stage === 'complete') Sedan.draw(ctx);
        Player.draw(ctx, 'canyon');
        Animation.drawParticles(ctx);

        if (this.showPrompt && this.promptText) {
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 18px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText(this.promptText, this.logicW/2, 50);
            ctx.textAlign = 'start';
        }
    }
};
</script>

<script>
// ========== 大草原关卡 ==========
const GrasslandLevel = {
    mapW: 1600, mapH: 1200,
    materials: [], killTarget: 10, killCount: 0,
    showPrompt: false, promptText: '', promptTimer: 0,
    hasBuiltCampfire: false, hasMadeSalve: false,
    trees: [], houses: [],

    init() {
        this.materials = []; this.killCount = 0;
        this.showPrompt = false; this.promptText = ''; this.promptTimer = 0;
        this.hasBuiltCampfire = false; this.hasMadeSalve = false;
        this.trees = [];
        for (let i = 0; i < 20; i++) {
            this.trees.push({ x: 100 + Math.random() * 1400, y: 100 + Math.random() * 1000, h: 30 + Math.random() * 40 });
        }
        this.houses = [{ x: 80, y: 550, w: 100, h: 80 }];

        Player.init();
        Player.x = 200; Player.y = 600; Player.radius = 15;
        StaminaSystem.init(); InventorySystem.init(); WeaponSystem.init();
        CraftingSystem.init(); CombatSystem.init();
        Enemy.reset(); Enemy.spawnGrasslandEnemies(12);
        MountSystem.init(); MountSystem.spawnCoin(800, 400);
        Campfire.init(); Campfire.x = 150; Campfire.y = 600;
        this.spawnMaterials();
        this.showPrompt = true;
        this.promptText = '收集材料，按 E 制作！7/5 攻击，6 大招，空格举敌人，F 扔篝火，回车取出，F8 吃烤肉+10HP，H 进房子';
        this.promptTimer = 0;
    },

    spawnMaterials() {
        this.materials = [];
        for (let i = 0; i < 15; i++) this.materials.push({ x: 100 + Math.random() * 1400, y: 100 + Math.random() * 1000, type: 'wood', collected: false });
        for (let i = 0; i < 10; i++) this.materials.push({ x: 100 + Math.random() * 1400, y: 100 + Math.random() * 1000, type: 'ore', collected: false });
        for (let i = 0; i < 8; i++) this.materials.push({ x: 100 + Math.random() * 1400, y: 100 + Math.random() * 1000, type: 'herb', collected: false });
    },

    update(dt, input) {
        this.promptTimer += dt;
        Player.updateGrassland(dt, input);
        MountSystem.collectCoin(Player);
        MountSystem.update(Player);
        this.collectMaterials();
        Enemy.update(dt, Player, River.bounds);
        CombatSystem.update(dt);

        // 攻击 - 按 7、5、J 键
        if (input.isKeyDown('7') || input.isKeyDown('5') || input.isKeyDown('j')) {
            const weapon = WeaponSystem.getEquippedWeapon();
            const targetX = Player.x + Math.cos(Player.angle) * 50;
            const targetY = Player.y + Math.sin(Player.angle) * 50;
            const result = CombatSystem.attack(Player, weapon, targetX, targetY);
            if (result && result.type === 'melee') {
                for (const enemy of Enemy.enemies) {
                    if (!enemy.alive) continue;
                    const dx = enemy.x - result.x, dy = enemy.y - result.y;
                    if (Math.sqrt(dx*dx + dy*dy) < result.range) {
                        const killed = Enemy.hitEnemy(enemy, result.damage);
                        if (result.isCrit) {
                            HUD.showTooltip('暴击！' + result.damage + ' 伤害！', 1000);
                            Animation.spawnParticles(enemy.x, enemy.y, 15, '#ff00ff', 150, 0.5);
                        }
                        if (killed) {
                            this.killCount++;
                            HUD.updateKillCount(this.killCount, this.killTarget);
                            Animation.spawnParticles(enemy.x, enemy.y, 12, '#ff4444', 120, 0.6);
                        }
                    }
                }
            }
        }

        // 大招 - 按 6 键
        if (input.isKeyPressed('6')) {
            if (CombatSystem.canUseUltimate()) {
                const ult = CombatSystem.useUltimate(Player);
                if (ult) {
                    for (const enemy of Enemy.enemies) {
                        if (!enemy.alive) continue;
                        const dx = enemy.x - ult.x, dy = enemy.y - ult.y;
                        if (Math.sqrt(dx*dx + dy*dy) < ult.radius) {
                            const killed = Enemy.hitEnemy(enemy, ult.damage);
                            if (killed) { this.killCount++; HUD.updateKillCount(this.killCount, this.killTarget); }
                        }
                    }
                    Animation.spawnParticles(Player.x, Player.y, 30, '#ff00ff', 250, 1.0);
                    Animation.spawnParticles(Player.x, Player.y, 20, '#ffcc00', 200, 0.8);
                    HUD.showTooltip('大招释放！范围伤害 80！', 2000);
                }
            } else {
                HUD.showTooltip('大招冷却中... 剩余 ' + Math.ceil(CombatSystem.getUltimateCooldown()) + ' 秒', 1000);
            }
        }

        // 远程弹丸命中检测
        for (let i = CombatSystem.projectiles.length - 1; i >= 0; i--) {
            const p = CombatSystem.projectiles[i];
            for (const enemy of Enemy.enemies) {
                if (!enemy.alive) continue;
                if (CombatSystem.checkProjectileHit(p.x, p.y, 5, enemy)) {
                    const killed = Enemy.hitEnemy(enemy, p.damage);
                    if (killed) { this.killCount++; HUD.updateKillCount(this.killCount, this.killTarget); }
                    CombatSystem.projectiles.splice(i, 1);
                    break;
                }
            }
        }

        // 举起/放下敌人 - 空格键
        if (input.isKeyPressed('space')) {
            if (Player.carryingEnemy) {
                const dropped = Player.carryingEnemy;
                dropped.x = Player.x + Math.cos(Player.angle) * 30;
                dropped.y = Player.y + Math.sin(Player.angle) * 30;
                Player.carryingEnemy = null; Player.state = 'idle';
                if (River.isInWater(dropped.x, dropped.y, dropped.radius)) {
                    HUD.showTooltip('敌人被扔进水里了！', 2000);
                    dropped.inWater = true;
                }
            } else {
                const deadEnemy = Enemy.getDeadEnemyAt(Player.x, Player.y, 30);
                if (deadEnemy) {
                    Player.carryingEnemy = deadEnemy; Player.state = 'carrying';
                    HUD.showTooltip('举起了敌人！到篝火旁按F扔上去', 2000);
                }
                if (River.isInWater(Player.x, Player.y, Player.radius)) {
                    const waterEnemy = Enemy.getDeadEnemyAt(Player.x, Player.y, 50);
                    if (waterEnemy) {
                        Player.carryingEnemy = waterEnemy; Player.state = 'carrying';
                        HUD.showTooltip('在水中找到了敌人！', 2000);
                    }
                }
            }
        }

        // F键：举着敌人时扔到篝火上
        if (input.isKeyPressed('f') && Player.carryingEnemy) {
            if (Campfire.lit && Campfire.throwEnemy(Player)) {
                const dropped = Player.carryingEnemy;
                dropped.x = -100; dropped.y = -100;
                Player.carryingEnemy = null; Player.state = 'idle';
                HUD.showTooltip('敌人扔到篝火上了！烤制中...', 2000);
            } else if (!Campfire.lit) {
                HUD.showTooltip('篝火未点燃！先建篝火', 1500);
            } else {
                HUD.showTooltip('靠近篝火再扔！或篝火上已有敌人', 1500);
            }
        }

        // 篝火更新
        const cookResult = Campfire.update(dt);
        if (cookResult && cookResult.cookingDone) {
            HUD.showTooltip('敌人烤好了！按回车取出', 3000);
        }

        // 回车键：取出烤好的食物
        if (input.isKeyPressed('enter')) {
            if (Campfire.takeFood()) {
                InventorySystem.addItem('roasted_meat', 1);
                HUD.showTooltip('获得烤肉！按 F8 直接吃掉回10血', 2000);
                InventoryUI.refresh();
            }
        }

        // F8键：直接吃烤肉回10血
        if (input.isKeyPressed('f8')) {
            if (InventorySystem.hasItem('roasted_meat')) {
                InventorySystem.removeItem('roasted_meat', 1);
                Player.heal(10);
                HUD.showTooltip('吃掉烤肉！+10 HP', 2000);
                Animation.spawnParticles(Player.x, Player.y, 12, '#44cc44', 100, 0.6);
            } else {
                HUD.showTooltip('没有烤肉！先烤敌人', 1500);
            }
        }

        // 进入/退出房子 - H键
        if (input.isKeyPressed('h')) {
            const house = this.houses[0];
            const dx = Player.x - (house.x + house.w/2);
            const dy = Player.y - (house.y + house.h/2);
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (!Player.inHouse && dist < 70) {
                Player.inHouse = true;
                HUD.showTooltip('进入房子！敌人无法攻击你', 2000);
            } else if (Player.inHouse) {
                Player.inHouse = false;
                HUD.showTooltip('离开房子', 1500);
            }
        }

        // E键处理
        const ePressed = input.isKeyPressed('e');
        if (ePressed) {
            if (Campfire.canBuild(Player) && !Campfire.lit) {
                if (Campfire.build()) {
                    this.hasBuiltCampfire = true;
                    HUD.showTooltip('篝火已搭建！', 2000);
                }
            } else {
                CraftingUI.toggle();
            }
        }

        // 使用回伤药膏
        if (input.isKeyPressed('f10')) {
            if (InventorySystem.hasItem('healing_salve')) {
                InventorySystem.removeItem('healing_salve', 1);
                Player.heal(5);
                HUD.showTooltip('使用了回伤药膏！+5 HP', 2000);
                Animation.spawnParticles(Player.x, Player.y, 10, '#44cc44', 80, 0.5);
            } else {
                HUD.showTooltip('没有回伤药膏！', 1500);
            }
        }

        if (input.isKeyPressed('tab')) { InventoryUI.toggle(); CraftingUI.hide(); }
        Animation.update(dt);
        Animation.updateParticles(dt);
        this.updatePrompts();
    },

    collectMaterials() {
        for (const mat of this.materials) {
            if (mat.collected) continue;
            const dx = Player.x - mat.x, dy = Player.y - mat.y;
            if (Math.sqrt(dx*dx + dy*dy) < Player.radius + 10) {
                mat.collected = true;
                InventorySystem.addItem(mat.type, 1);
                HUD.showTooltip(`收集了 ${mat.type}`, 1000);
            }
        }
        for (const mat of this.materials) {
            if (mat.collected) {
                mat.collected = false;
                mat.x = 100 + Math.random() * 1400;
                mat.y = 100 + Math.random() * 1000;
            }
        }
    },

    updatePrompts() {
        if (this.promptTimer > 6) this.showPrompt = false;
    },

    draw(ctx) {
        ctx.fillStyle = '#4a8c2a';
        ctx.fillRect(0, 0, this.mapW, this.mapH);
        ctx.fillStyle = '#5a9c3a';
        for (let i = 0; i < 50; i++) {
            const gx = (i * 137 + 50) % this.mapW;
            const gy = (i * 251 + 80) % this.mapH;
            ctx.fillRect(gx, gy, 3, 8);
        }
        ctx.fillStyle = '#8B7355';
        ctx.fillRect(0, 580, 300, 60);
        ctx.fillRect(0, 400, this.mapW, 20);
        ctx.fillRect(700, 350, 30, 200);

        River.draw(ctx);
        for (const t of this.trees) Assets.drawTree(ctx, t.x, t.y, t.h);
        for (const h of this.houses) Assets.drawHouse(ctx, h.x, h.y, h.w, h.h);
        Campfire.draw(ctx);
        for (const mat of this.materials) {
            if (!mat.collected) Assets.drawMaterial(ctx, mat.x, mat.y, mat.type);
        }
        MountSystem.draw(ctx);
        Enemy.draw(ctx);
        CombatSystem.draw(ctx);

        if (Player.inHouse) {
            ctx.save();
            ctx.globalAlpha = 0.5;
            Player.draw(ctx, 'grassland');
            ctx.restore();
        } else {
            Player.draw(ctx, 'grassland');
        }

        Animation.drawParticles(ctx);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.strokeText('大草原', this.mapW/2, 35);
        ctx.fillText('大草原', this.mapW/2, 35);

        if (Player.inHouse) {
            ctx.fillStyle = '#44cc44';
            ctx.font = 'bold 16px "Microsoft YaHei"';
            ctx.strokeText('在房子里 - 敌人无法攻击你（按H离开）', this.mapW/2, 60);
            ctx.fillText('在房子里 - 敌人无法攻击你（按H离开）', this.mapW/2, 60);
        }
        ctx.textAlign = 'start';

        if (this.showPrompt && this.promptText) {
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 16px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText(this.promptText, this.mapW/2, 30);
            ctx.textAlign = 'start';
        }
    }
};
</script>

<script>
// ========== 关卡管理器 ==========
const LevelManager = {
    currentLevel: 'title', previousLevel: null,

    init() { this.currentLevel = 'title'; this.previousLevel = null; },

    switchTo(levelName) {
        this.previousLevel = this.currentLevel;
        this.currentLevel = levelName;
        switch (levelName) {
            case 'title': break;
            case 'canyon':
                CanyonLevel.init(); Camera.reset(); HUD.init(); WeaponPanel.init();
                break;
            case 'grassland':
                GrasslandLevel.init(); Camera.reset(); HUD.init(); WeaponPanel.init();
                InventoryUI.hide(); CraftingUI.hide(); DialogBox.hide();
                HUD.updateKillCount(0, 10);
                break;
            case 'gameover': break;
        }
    },

    update(dt, input) {
        switch (this.currentLevel) {
            case 'title':
                if (input.isKeyPressed('enter') || input.isKeyPressed('space')) this.switchTo('canyon');
                break;
            case 'canyon':
                CanyonLevel.update(dt, input);
                if (CanyonLevel.isComplete()) this.switchTo('grassland');
                if (!Player.isAlive()) this.switchTo('gameover');
                break;
            case 'grassland':
                GrasslandLevel.update(dt, input);
                if (!Player.isAlive()) this.switchTo('gameover');
                break;
            case 'gameover':
                if (input.isKeyPressed('enter') || input.isKeyPressed('r')) this.switchTo('title');
                break;
        }
    },

    draw(ctx, canvasW, canvasH) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvasW, canvasH);
        switch (this.currentLevel) {
            case 'title':
                this.drawTitle(ctx, canvasW, canvasH);
                break;
            case 'canyon':
                ctx.save();
                const scale = Math.min(canvasW / CanyonLevel.logicW, canvasH / CanyonLevel.logicH);
                const offsetX = (canvasW - CanyonLevel.logicW * scale) / 2;
                const offsetY = (canvasH - CanyonLevel.logicH * scale) / 2;
                ctx.translate(offsetX, offsetY);
                ctx.scale(scale, scale);
                CanyonLevel.draw(ctx);
                ctx.restore();
                break;
            case 'grassland':
                Camera.follow(Player, canvasW, canvasH, GrasslandLevel.mapW, GrasslandLevel.mapH);
                Camera.apply(ctx);
                GrasslandLevel.draw(ctx);
                Camera.restore(ctx);
                break;
            case 'gameover':
                this.drawGameOver(ctx, canvasW, canvasH);
                break;
        }
        if (this.currentLevel === 'canyon' || this.currentLevel === 'grassland') {
            HUD.update();
        }
    },

    drawTitle(ctx, w, h) {
        const gradient = ctx.createLinearGradient(0, 0, 0, h);
        gradient.addColorStop(0, '#1a0a2e');
        gradient.addColorStop(0.5, '#2d1b4e');
        gradient.addColorStop(1, '#1a3a2e');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#0d0d1a';
        ctx.beginPath();
        ctx.moveTo(0, h);
        for (let i = 0; i < w; i += 10) {
            ctx.lineTo(i, h * 0.4 + Math.sin(i * 0.008) * 80 + Math.sin(i * 0.02) * 40);
        }
        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 48px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.fillText('悬崖峭壁', w/2, h * 0.3);

        ctx.fillStyle = '#fff';
        ctx.font = '18px "Microsoft YaHei"';
        ctx.fillText('古代与现代武器融合的冒险之旅', w/2, h * 0.3 + 50);

        const t = Date.now() * 0.001;
        if (Math.sin(t * 3) > 0) {
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 20px "Microsoft YaHei"';
            ctx.fillText('按 回车键 或 空格 开始游戏', w/2, h * 0.55);
        }

        ctx.fillStyle = '#aaa';
        ctx.font = '14px "Microsoft YaHei"';
        const instructions = [
            '== 峡谷关卡 ==',
            'A/D 移动 | 空格 跳跃 | F1 上投石机 | A 对话',
            'T 上蹦极 | 空格 跳下 | 1 停止蹦极 | 空格(蹦床)',
            '',
            '== 大草原关卡 ==',
            'WASD 移动 | 7/5 攻击 | 6 大招 | 空格 举敌人',
            'F 扔篝火 | 回车 取出 | F8 吃烤肉+10HP | H 进房子',
            'E 制作 | Tab 背包 | F10 药膏 | Shift 跑步'
        ];
        for (let i = 0; i < instructions.length; i++) {
            ctx.fillText(instructions[i], w/2, h * 0.65 + i * 22);
        }
        ctx.textAlign = 'start';
    },

    drawGameOver(ctx, w, h) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 48px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.fillText('游戏结束', w/2, h/2 - 20);
        const t = Date.now() * 0.001;
        if (Math.sin(t * 3) > 0) {
            ctx.fillStyle = '#fff';
            ctx.font = '20px "Microsoft YaHei"';
            ctx.fillText('按 回车键 或 R 重新开始', w/2, h/2 + 40);
        }
        ctx.textAlign = 'start';
    }
};
</script>

<script>
// ========== 游戏主入口 ==========
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let lastTime = 0;
    let running = true;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function init() {
        Input.init();
        Camera.init();
        LevelManager.init();
        CraftingUI.initGlobal();
        lastTime = performance.now();
    }

    function gameLoop(timestamp) {
        if (!running) return;
        let dt = (timestamp - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1;
        lastTime = timestamp;
        LevelManager.update(dt, Input);
        LevelManager.draw(ctx, canvas.width, canvas.height);
        Input.clearFrame();
        requestAnimationFrame(gameLoop);
    }

    init();
    requestAnimationFrame(gameLoop);
    console.log('悬崖峭壁 - 游戏已启动！');
})();
</script>
