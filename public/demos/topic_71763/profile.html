  <!-- 未登录提示弹窗 -->
  <div id="loginModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center px-4 hidden">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center">

  <!-- 修改状态弹窗 -->
  <div id="statusModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center px-4 hidden">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full">
      <div class="flex items-center justify-between mb-5">

        <button onclick="closeStatusModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <p class="text-xs text-gray-500 mb-4">请根据当前实际情况选择最新的处理进度</p>
      <div class="space-y-2 mb-6">
        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-primary-light transition">
          <input type="radio" name="editStatus" value="待处理" class="w-4 h-4 text-primary border-gray-300 focus:ring-primary">
          <span class="text-sm text-gray-700">待处理</span>
        </label>
        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-primary-light transition">
          <input type="radio" name="editStatus" value="酒店已响应" class="w-4 h-4 text-primary border-gray-300 focus:ring-primary">
          <span class="text-sm text-gray-700">酒店已响应</span>
        </label>
        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-primary-light transition">
          <input type="radio" name="editStatus" value="已报警/立案" class="w-4 h-4 text-primary border-gray-300 focus:ring-primary">
          <span class="text-sm text-gray-700">已报警/立案</span>
        </label>
      </div>

        <button onclick="closeStatusModal()" class="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition">

        </button>
        <button onclick="saveStatusChange()" class="flex-1 py-3 bg-primary text-white rounded-xl font-medium hover:bg-primary-dark transition">
          保存
        </button>

  <script src="assets/js/data.js"></script>
  <script>
    let currentUser = null;
    let activeTab = 'reports';

    // 初始化
    function initPage() {
      currentUser = Storage.getCurrentUser();
      renderUserInfo();
      renderMyReports();
      renderFavorites();
    }

    // 渲染用户信息
    function renderUserInfo() {
      const card = document.getElementById('userInfoCard');

      if (currentUser) {
        const verifyIcon = currentUser.verifyType === 'alipay' ? 'fab fa-alipay' : 'fab fa-taobao';
        const verifyText = currentUser.verifyType === 'alipay' ? '支付宝认证' : '淘宝认证';
        const verifyColor = currentUser.verifyType === 'alipay' ? 'bg-blue-400/30' : 'bg-orange-400/30';
        card.innerHTML = `
          <div class="relative">
            <img src="${currentUser.avatar}" alt="头像" class="w-20 h-20 rounded-2xl border-4 border-white/30 shadow-lg">
            <div class="absolute -bottom-1 -right-1 ${verifyColor} backdrop-blur text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-0.5">
              <i class="${verifyIcon}"></i>
              已认证
            </div>
          </div>
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <h2 class="text-xl font-bold">${currentUser.username}</h2>
            </div>
            <p class="text-white/80 text-sm mt-1">${verifyText} · 实名可信用户</p>
          </div>
          <button class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
            <i class="fas fa-edit text-white text-sm"></i>
          </button>
        `;

        const myReports = Storage.getMyReports();
        const favorites = Storage.getFavorites();
        document.getElementById('statReports').textContent = myReports.length;
        document.getElementById('statFavorites').textContent = favorites.length;
        document.getElementById('statContrib').textContent = myReports.length * 10;
      } else {
        card.innerHTML = `
          <div class="w-20 h-20 rounded-2xl bg-white/20 flex items-center justify-center border-4 border-white/30">
            <i class="fas fa-user text-white text-3xl"></i>
          </div>
          <div class="flex-1">
            <h2 class="text-xl font-bold">未登录</h2>
            <p class="text-blue-200 text-sm mt-1">登录后查看更多功能</p>
          </div>
          <a href="login.html" class="bg-white text-primary px-5 py-2.5 rounded-full text-sm font-medium hover:bg-blue-50 transition">
            登录
          </a>
        `;
        document.getElementById('statReports').textContent = '-';
        document.getElementById('statFavorites').textContent = '-';
        document.getElementById('statContrib').textContent = '-';
      }
    }

    // 渲染我的举报
    function renderMyReports() {
      const listEl = document.getElementById('myReportList');
      const emptyEl = document.getElementById('emptyReports');

      if (!currentUser) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }

      const reports = Storage.getMyReports();

      if (reports.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      listEl.innerHTML = reports.map(report => {
        const statusColor = report.status === '已处理' || report.status === '已报警/立案' ? 'bg-green-100 text-green-600'
                          : report.status === '酒店已响应' || report.status === '处理中' ? 'bg-yellow-100 text-yellow-600'
                          : 'bg-gray-100 text-gray-500';
        return `
          <div class="bg-white rounded-2xl card-shadow p-5">
            <div class="flex items-start justify-between gap-3 mb-3">
              <h4 class="font-bold text-gray-800 flex-1">${report.hotel_name}</h4>
              <span class="${statusColor} text-xs font-medium px-2.5 py-1 rounded-full flex-shrink-0">${report.status}</span>
            </div>
            <p class="text-sm text-gray-600 line-clamp-2 mb-3">${report.description}</p>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 text-xs text-gray-400">
                <i class="far fa-clock"></i>
                <span>${Utils.formatDate(report.created_at)}</span>
              </div>
              <div class="flex items-center gap-3">
                <button onclick="openStatusModal(${report.id})" class="text-primary text-sm font-medium hover:underline">
                  修改状态
                </button>
                <button onclick="viewReportDetail(${report.id})" class="text-primary text-sm font-medium hover:underline">
                  查看详情
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 渲染收藏列表
    function renderFavorites() {
      const listEl = document.getElementById('favoriteList');
      const emptyEl = document.getElementById('emptyFavorites');

      if (!currentUser) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }

      const favoriteIds = Storage.getFavorites();
      const hotels = favoriteIds.map(id => Storage.getHotel(id)).filter(h => h);

      if (hotels.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      listEl.innerHTML = hotels.map(hotel => {
        const risk = Utils.getRiskLevel(hotel.risk_score);
        return `
          <a href="hotel-detail.html?id=${hotel.id}" class="bg-white rounded-2xl card-shadow overflow-hidden hover:shadow-lg transition">
            <div class="relative h-32">
              <img src="${hotel.image}" alt="${hotel.name}" class="w-full h-full object-cover">
              <div class="absolute top-2 right-2 ${risk.bg} ${risk.color} text-xs font-medium px-2 py-1 rounded-full">
                ${risk.text}
              </div>
            </div>
            <div class="p-4">
              <h4 class="font-bold text-gray-800 truncate">${hotel.name}</h4>
              <p class="text-xs text-gray-500 mt-1 truncate">${hotel.address}</p>
            </div>
          </a>
        `;
      }).join('');
    }

    // Tab 切换
    function switchTab(tab) {
      activeTab = tab;
      const reportsBtn = document.getElementById('tabReports');
      const favsBtn = document.getElementById('tabFavorites');
      const reportsPanel = document.getElementById('panelReports');
      const favsPanel = document.getElementById('panelFavorites');

      if (tab === 'reports') {
        reportsBtn.classList.add('bg-primary', 'text-white', 'shadow-md');
        reportsBtn.classList.remove('text-gray-500');
        favsBtn.classList.remove('bg-primary', 'text-white', 'shadow-md');
        favsBtn.classList.add('text-gray-500');
        reportsPanel.classList.remove('hidden');
        favsPanel.classList.add('hidden');
      } else {
        favsBtn.classList.add('bg-primary', 'text-white', 'shadow-md');
        favsBtn.classList.remove('text-gray-500');
        reportsBtn.classList.remove('bg-primary', 'text-white', 'shadow-md');
        reportsBtn.classList.add('text-gray-500');
        favsPanel.classList.remove('hidden');
        reportsPanel.classList.add('hidden');
      }
    }

    // 查看举报详情
    function viewReportDetail(reportId) {
      window.location.href = `hotel-detail.html?id=${Storage.getReport(reportId).hotel_id}`;
    }

    // 设置
    function handleSettings() {
      if (!currentUser) {
        showLoginModal();
        return;
      }
      Utils.showToast('设置功能开发中');
    }

    // 退出登录
    function handleLogout() {
      if (!currentUser) {
        showLoginModal();
        return;
      }
      if (confirm('确定要退出登录吗？')) {
        Storage.logout();
        Utils.showToast('已退出登录');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      }
    }

    // 显示登录弹窗
    function showLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    // 状态修改弹窗
    let editingReportId = null;

    function openStatusModal(reportId) {
      editingReportId = reportId;
      const report = Storage.getReport(reportId);
      if (!report) return;

      // 初始化选中状态
      const radios = document.querySelectorAll('input[name="editStatus"]');
      radios.forEach(radio => {
        radio.checked = radio.value === report.status;
      });

      document.getElementById('statusModal').classList.remove('hidden');
    }

    function closeStatusModal() {
      document.getElementById('statusModal').classList.add('hidden');
      editingReportId = null;
    }

    function saveStatusChange() {
      if (!editingReportId) return;
      const status = document.querySelector('input[name="editStatus"]:checked')?.value;
      if (!status) {
        Utils.showToast('请选择状态', 'error');
        return;
      }

      Storage.updateReportStatus(editingReportId, status);
      Utils.showToast('状态更新成功');
      renderMyReports();
      closeStatusModal();
    }

    // 点击弹窗背景关闭
    document.getElementById('statusModal')?.addEventListener('click', function(e) {
      if (e.target === this) {
        closeStatusModal();
      }
    });

    // 初始化
    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
