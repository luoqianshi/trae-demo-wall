<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投产历史记录 - 投产管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        .hist-timeline { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px 24px; }
        .hist-node { position:relative; padding:16px 0 16px 28px; border-left:3px solid var(--border); }
        .hist-node:last-child { border-left:3px solid transparent; }
        .hist-node::before { content:''; position:absolute; left:-9px; top:22px; width:15px; height:15px; border-radius:50%; background:#fff; border:3px solid var(--primary); }
        .hist-card { background:#f8fafc; border-radius:6px; padding:14px 16px; border:1px solid var(--border); }
        .hist-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
        .hist-title { font-size:14px; font-weight:700; color:var(--text-primary); }
        .hist-no { font-size:12px; color:var(--text-secondary); margin-top:3px; font-family:'Segoe UI'; }
        .hist-info { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; padding:8px 0; font-size:12px; border-top:1px dashed var(--border); }
        .hist-info > div .label { color:var(--text-secondary); font-size:11px; margin-bottom:2px; }
        .hist-info > div .val { color:var(--text-primary); font-weight:600; font-size:13px; }
        .hist-action { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); display:flex; justify-content:flex-end; gap:10px; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-history" style="color:var(--primary);margin-right:8px"></i>投产历史记录</h2>
            <div class="page-desc">
                首页 / 投产管理 / 投产历史记录 - 按时间倒序展示所有已完成的投产批次，提供历史追溯、审计查询与应急回滚入口
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="showToast('历史报告导出中...')"><i class="fa fa-file-excel-o"></i> 导出历史报告</button>
        </div>
    </div>

    <!-- ====== 筛选区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>时间范围</label>
                <div style="display:flex;align-items:center;gap:6px">
                    <input type="date" class="form-control" id="filterDateStart" placeholder="开始日期" title="选择起始日期">
                    <span style="color:var(--text-secondary)">~</span>
                    <input type="date" class="form-control" id="filterDateEnd" placeholder="结束日期" title="选择结束日期">
                </div>
            </div>
            <div class="form-item">
                <label>批次类型</label>
                <select class="form-control" id="filterType" onchange="searchHistory()">
                    <option value="">全部</option>
                    <option value="常规投产">常规投产</option>
                    <option value="紧急投产">紧急投产</option>
                    <option value="重大升级">重大升级</option>
                </select>
            </div>
            <div class="form-item">
                <label>负责人</label>
                <input type="text" class="form-control" id="filterOwner" placeholder="姓名" onkeyup="if(event.key==='Enter')searchHistory()">
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary" onclick="searchHistory()"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default" onclick="resetHistoryFilter()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 统计概览 ====== -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
        <div class="stat-card" style="text-align:center;padding:16px;border:1px solid var(--border);border-radius:8px">
            <div style="font-size:28px;font-weight:700;color:var(--primary)" id="statTotal">8</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">总投产次数</div>
        </div>
        <div class="stat-card" style="text-align:center;padding:16px;border:1px solid var(--border);border-radius:8px">
            <div style="font-size:28px;font-weight:700;color:#52c41a" id="statSuccess">6</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">成功(含部分)</div>
        </div>
        <div class="stat-card" style="text-align:center;padding:16px;border:1px solid var(--border);border-radius:8px">
            <div style="font-size:28px;font-weight:700;color:#52c41a" id="statRate">75.0%</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">成功率</div>
        </div>
        <div class="stat-card" style="text-align:center;padding:16px;border:1px solid var(--border);border-radius:8px">
            <div style="font-size:28px;font-weight:700;color:#f5222d" id="statFail">2</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">失败/回滚次数</div>
        </div>
    </div>

    <!-- ====== 历史时间线 ====== -->
    <div class="hist-timeline">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)">
            <span style="font-size:13px;font-weight:600;color:var(--text-primary)"><i class="fa fa-list"></i> 历史记录列表</span>
            <span style="font-size:12px;color:var(--text-secondary)">共 <span id="totalCount" style="color:var(--primary);font-weight:600">8</span> 条记录</span>
        </div>
        <div id="histBody"></div>
        <div style="text-align:center; padding:14px; border-top:1px solid var(--border); margin-top:16px">
            <button class="btn btn-default" style="font-size:12px" onclick="loadMoreHistory()"><i class="fa fa-angle-double-down" style="margin-right:6px"></i>加载更多历史</button>
        </div>
    </div>

</div>

<script>
var items = [
    { no:'BAT-20260615', title:'6月中旬核心系统投产批次', date:'2026-06-15 22:45', chg:3, api:'18接口/4文件', owner:'张工', status:'成功', tag:'tag-success', type:'常规投产', remark:'核心账务 v2.4 升级顺利，业务验证通过' },
    { no:'BAT-20260618', title:'客户信息接口专项批次', date:'2026-06-18 22:30', chg:2, api:'6接口/1文件', owner:'王工', status:'成功', tag:'tag-success', type:'常规投产', remark:'客户信息字段改造完成' },
    { no:'BAT-20260610', title:'文件服务 v2.1 合并批次', date:'2026-06-10 22:18', chg:4, api:'12接口/8文件', owner:'刘工', status:'部分成功', tag:'tag-warning', type:'常规投产', remark:'文件 FILE-CDP-0088 未能在窗口内完成，已纳入下次批次' },
    { no:'BAT-20260605', title:'ECIF 客户信息平台升级', date:'2026-06-05 22:50', chg:2, api:'10接口/0文件', owner:'许工', status:'失败', tag:'tag-danger', type:'紧急投产', remark:'数据库连接异常，已启动回滚' },
    { no:'BAT-20260605-RB', title:'ECIF 客户信息平台回滚', date:'2026-06-05 23:15', chg:1, api:'—', owner:'运维组', status:'已回滚', tag:'tag-default', type:'紧急投产', remark:'按回滚预案执行，15 分钟内恢复至 v2.0' },
    { no:'BAT-20260528', title:'5月末常规批次', date:'2026-05-28 22:30', chg:5, api:'22接口/6文件', owner:'陈工', status:'成功', tag:'tag-success', type:'常规投产', remark:'常规月度投产，业务验证通过' },
    { no:'BAT-20260520', title:'支付清算 v3.0 Beta', date:'2026-05-20 22:40', chg:1, api:'9接口/0文件', owner:'陈工', status:'成功', tag:'tag-success', type:'重大升级', remark:'v3.0 Beta 灰度发布' },
    { no:'BAT-20260612', title:'反洗钱监测调整批次', date:'2026-06-12 22:28', chg:1, api:'5接口/1文件', owner:'吕工', status:'成功', tag:'tag-success', type:'常规投产', remark:'规则引擎参数调整' }
];

/* ====== 渲染历史列表 ====== */
function renderHistory(list) {
    if (!list || !list.length) {
        document.getElementById('histBody').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)"><i class="fa fa-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>暂无历史记录</div>';
        return;
    }
    document.getElementById('histBody').innerHTML = list.map(i => `
        <div class="hist-node" data-row data-type="${i.type}" data-owner="${i.owner}" data-status="${i.status}" data-date="${i.date.substring(0,10)}">
            <div class="hist-card">
                <div class="hist-head">
                    <div>
                        <div class="hist-title">${i.title}</div>
                        <div class="hist-no"><i class="fa fa-hashtag" style="margin-right:4px"></i>${i.no} · ${i.date} · <span style="color:var(--primary)">${i.type}</span></div>
                    </div>
                    <span class="tag ${i.tag}" style="font-size:12px;padding:4px 10px">${i.status}</span>
                </div>
                <div style="font-size:12px;color:var(--text-secondary);line-height:1.8;padding-bottom:6px">${i.remark}</div>
                <div class="hist-info">
                    <div><div class="label">变更单数</div><div class="val">${i.chg}</div></div>
                    <div><div class="label">接口/文件</div><div class="val">${i.api}</div></div>
                    <div><div class="label">负责人</div><div class="val">${i.owner}</div></div>
                    <div><div class="label">投产时间</div><div class="val">${i.date}</div></div>
                    <div><div class="label">状态</div><div class="val" style="color:var(--primary)">${i.status}</div></div>
                </div>
                <div class="hist-action">
                    <a class="btn-link" onclick="govNav('pages/deploy/batch-detail.html', ['首页','投产管理','投产批次管理','批次详情'], {batch:'${i.no}'})"><i class="fa fa-eye"></i> 查看详情</a>
                    <a class="btn-link" onclick="govNav('pages/deploy/report.html', ['首页','投产管理','投产报告'], {batch:'${i.no}', name:'${i.title}'})"><i class="fa fa-file-pdf-o"></i> 查看报告</a>
                    ${i.status==='成功' || i.status==='部分成功' ? `<a class="btn-link" style="color:#dc2626" onclick="rollbackHistory('${i.no}')"><i class="fa fa-undo"></i> 回滚</a>` : ''}
                </div>
            </div>
        </div>
    `).join('');
}

/* ====== 筛选查询 ====== */
function searchHistory() {
    var type = (document.getElementById('filterType')||{}).value || '';
    var owner = (document.getElementById('filterOwner')||{}).value || '';
    var dateStart = (document.getElementById('filterDateStart')||{}).value || '';
    var dateEnd = (document.getElementById('filterDateEnd')||{}).value || '';
    var nodes = document.querySelectorAll('#histBody .hist-node[data-row]');
    var visible = 0;
    nodes.forEach(function(node) {
        var show = true;
        if (type && node.getAttribute('data-type') !== type) show = false;
        if (owner && (node.getAttribute('data-owner') || '').indexOf(owner) === -1) show = false;
        /* 日期范围筛选：data-date 格式为 YYYY-MM-DD，可直接字符串比较 */
        var nodeDate = node.getAttribute('data-date') || '';
        if (dateStart && nodeDate < dateStart) show = false;
        if (dateEnd && nodeDate > dateEnd) show = false;
        node.style.display = show ? '' : 'none';
        if (show) visible++;
    });
    // 空状态处理
    var emptyEl = document.getElementById('emptyFilterMsg');
    if (visible === 0) {
        if (!emptyEl) {
            var histBody = document.getElementById('histBody');
            var div = document.createElement('div');
            div.id = 'emptyFilterMsg';
            div.style.cssText = 'text-align:center;padding:40px;color:var(--text-secondary)';
            div.innerHTML = '<i class="fa fa-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>暂无符合条件的历史记录';
            histBody.appendChild(div);
        }
    } else if (emptyEl) {
        emptyEl.remove();
    }
    // 更新总记录数
    var totalEl = document.getElementById('totalCount');
    if (totalEl) totalEl.textContent = visible;
    showToast('筛选完成，共 ' + visible + ' 条记录');
}

/* ====== 重置筛选 ====== */
function resetHistoryFilter() {
    var typeEl = document.getElementById('filterType');
    var ownerEl = document.getElementById('filterOwner');
    var dateStartEl = document.getElementById('filterDateStart');
    var dateEndEl = document.getElementById('filterDateEnd');
    if (typeEl) typeEl.value = '';
    if (ownerEl) ownerEl.value = '';
    if (dateStartEl) dateStartEl.value = '';
    if (dateEndEl) dateEndEl.value = '';
    // 移除空状态
    var emptyEl = document.getElementById('emptyFilterMsg');
    if (emptyEl) emptyEl.remove();
    // 恢复所有节点显示
    var nodes = document.querySelectorAll('#histBody .hist-node[data-row]');
    nodes.forEach(function(node) { node.style.display = ''; });
    // 更新总记录数
    var totalEl = document.getElementById('totalCount');
    if (totalEl) totalEl.textContent = nodes.length;
    showToast('筛选条件已重置');
}

/* ====== 回滚历史批次（二次确认） ====== */
function rollbackHistory(batchNo) {
    if (!confirm('确认回滚批次 ' + batchNo + '？\n回滚将撤销该批次的所有投产变更，此操作不可撤销。')) return;
    if (!confirm('二次确认：真的要回滚吗？')) return;
    showToast('批次 ' + batchNo + ' 回滚执行中...', 'warning');
    setTimeout(function() {
        showToast('批次 ' + batchNo + ' 已回滚', 'warning');
    }, 2000);
}

/* ====== 加载更多历史 ====== */
function loadMoreHistory() {
    showToast('加载更多历史记录...');
}

/* ====== 初始化 ====== */
renderHistory(items);
</script>
</body>
</html>
