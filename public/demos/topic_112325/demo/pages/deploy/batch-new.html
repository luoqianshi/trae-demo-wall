<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增批次 - 投产管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        .batch-form { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
        .form-section { margin-bottom:24px; }
        .form-section-title { font-size:14px; font-weight:600; color:var(--text-primary); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
        .form-section-title i { color:var(--primary); }
        .form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px 20px; }
        .form-grid .full { grid-column:1/-1; }
        .selector-panel { background:#f8fafc; border:1px solid var(--border); border-radius:6px; padding:14px; }
        .order-card { display:flex; align-items:center; gap:12px; padding:10px 12px; background:#fff; border:1px solid var(--border); border-radius:6px; margin-bottom:8px; transition:all 0.15s; cursor:pointer; }
        .order-card:hover { border-color:var(--primary); box-shadow:0 2px 6px rgba(24,144,255,.1); }
        .order-card.selected { border-color:var(--primary); background:#eff6ff; }
        .order-card input[type=checkbox] { width:16px; height:16px; }
        .order-info { flex:1; }
        .order-info .title { font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:4px; }
        .order-info .meta { font-size:11px; color:var(--text-secondary); display:flex; gap:12px; }
        .order-info .meta span i { margin-right:3px; }
        .selected-count-bar { background:#eff6ff; padding:10px 14px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#1e40af; margin-bottom:10px; }
        .search-bar { display:flex; gap:8px; margin-bottom:10px; }
        .tag-mini { display:inline-block; padding:2px 8px; font-size:10px; border-radius:3px; }
        .quick-btn { display:inline-block; padding:4px 10px; font-size:12px; background:#fff; border:1px solid var(--border); border-radius:4px; cursor:pointer; color:var(--text-secondary); }
        .quick-btn:hover { color:var(--primary); border-color:var(--primary); }
        .quick-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        /* 环境选择样式 */
        .env-select-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
        .env-select-card {
            padding:14px; border:2px solid var(--border); border-radius:8px;
            cursor:pointer; transition:all 0.2s; text-align:center; position:relative;
        }
        .env-select-card:hover { border-color:var(--primary); }
        .env-select-card.selected { border-color:var(--primary); background:#eff6ff; }
        .env-select-card .esc-dot { width:10px; height:10px; border-radius:50%; margin:0 auto 6px; }
        .env-select-card .esc-name { font-size:13px; font-weight:600; color:var(--text-primary); }
        .env-select-card .esc-desc { font-size:11px; color:var(--text-light); margin-top:4px; }
        .env-select-card .esc-check {
            position:absolute; top:6px; right:6px; width:18px; height:18px;
            border-radius:50%; background:var(--primary); color:#fff;
            display:none; align-items:center; justify-content:center; font-size:10px;
        }
        .env-select-card.selected .esc-check { display:flex; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-plus-circle" style="color:var(--primary);margin-right:8px"></i>新增投产批次</h2>
            <div class="page-desc">
                首页 / 投产管理 / 投产批次管理 / 新增投产批次 - 选择已确认的变更单，统一编排为投产批次进行管理
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="govNav('pages/deploy/batch.html', ['首页','投产管理','投产批次管理'], {})"><i class="fa fa-arrow-left"></i> 返回列表</button>
            <button class="btn btn-default" onclick="showToast('保存为草稿')"><i class="fa fa-floppy-o"></i> 保存草稿</button>
            <button class="btn btn-primary" onclick="submitBatch()"><i class="fa fa-check-circle"></i> 提交批次</button>
        </div>
    </div>

    <!-- ====== 基本信息 ====== -->
    <div class="batch-form form-section">
        <div class="form-section-title"><i class="fa fa-info-circle"></i>一、基本信息</div>
        <div class="form-grid">
            <div class="form-item">
                <label>批次编号 <span style="color:var(--danger)">*</span></label>
                <input class="form-control" id="batchNo" value="BAT-20260608-001" readonly style="background:#f8fafc">
            </div>
            <div class="form-item">
                <label>批次名称 <span style="color:var(--danger)">*</span></label>
                <input class="form-control" id="batchName" placeholder="如：6月中旬核心系统投产批次">
            </div>
            <div class="form-item">
                <label>计划投产时间 <span style="color:var(--danger)">*</span></label>
                <input class="form-control" id="planTime" type="text" value="2026-06-15 22:00">
            </div>
            <div class="form-item">
                <label>投产负责人 <span style="color:var(--danger)">*</span></label>
                <input class="form-control" id="owner" placeholder="选择负责人">
            </div>
            <div class="form-item full">
                <label>备注说明</label>
                <textarea class="form-control" rows="3" placeholder="描述本次投产的主要目的与风险点"></textarea>
            </div>
        </div>
    </div>

    <!-- ====== 目标环境选择 ====== -->
    <div class="batch-form form-section">
        <div class="form-section-title"><i class="fa fa-server"></i>二、目标投产环境</div>
        <div style="font-size:12px; color:var(--text-secondary); margin-bottom:10px">
            <i class="fa fa-exclamation-triangle" style="color:#d97706"></i>
            选择本次批次需要投产的目标环境，可多选。系统将按 DEV → SIT → UAT → PROD 顺序依次部署
        </div>
        <div class="env-select-grid">
            <div class="env-select-card" data-env="DEV" onclick="toggleBatchEnv(this)">
                <div class="esc-check"><i class="fa fa-check"></i></div>
                <div class="esc-dot" style="background:#3b82f6"></div>
                <div class="esc-name">DEV</div>
                <div class="esc-desc">开发环境</div>
            </div>
            <div class="env-select-card" data-env="SIT" onclick="toggleBatchEnv(this)">
                <div class="esc-check"><i class="fa fa-check"></i></div>
                <div class="esc-dot" style="background:#8b5cf6"></div>
                <div class="esc-name">SIT</div>
                <div class="esc-desc">集成测试</div>
            </div>
            <div class="env-select-card selected" data-env="UAT" onclick="toggleBatchEnv(this)">
                <div class="esc-check"><i class="fa fa-check"></i></div>
                <div class="esc-dot" style="background:#f59e0b"></div>
                <div class="esc-name">UAT</div>
                <div class="esc-desc">验收测试</div>
            </div>
            <div class="env-select-card selected" data-env="PROD" onclick="toggleBatchEnv(this)">
                <div class="esc-check"><i class="fa fa-check"></i></div>
                <div class="esc-dot" style="background:#ef4444"></div>
                <div class="esc-name">PROD</div>
                <div class="esc-desc">生产环境</div>
            </div>
        </div>
    </div>

    <!-- ====== 变更单选择 ====== -->
    <div class="batch-form form-section">
        <div class="form-section-title"><i class="fa fa-tasks"></i>三、选择变更单（仅显示已确认）</div>

        <div class="selector-panel">
            <div class="selected-count-bar" id="selectBar" style="display:none">
                <span><i class="fa fa-check-circle"></i> 已选择 <b id="selCount">0</b> 个变更单</span>
                <a class="quick-btn" onclick="clearAll()">清空选择</a>
            </div>

            <div class="search-bar">
                <input class="form-control" id="orderSearch" placeholder="搜索变更单号 / 标题 / 系统名称..." style="flex:1" oninput="renderOrders()">
                <span class="quick-btn active" onclick="filterByStatus(this,'all')">全部</span>
                <span class="quick-btn" onclick="filterByStatus(this,'core')">核心+客户系统</span>
                <span class="quick-btn" onclick="filterByStatus(this,'customer')">客户系统</span>
                <span class="quick-btn" onclick="selectAll()" style="color:#16a34a;border-color:#16a34a"><i class="fa fa-check-square-o"></i> 全选</span>
            </div>

            <div id="orderList" style="max-height:420px; overflow-y:auto; padding-right:6px"></div>
        </div>
    </div>

    <!-- ====== 批次预览 ====== -->
    <div class="batch-form form-section" id="previewSection" style="display:none">
        <div class="form-section-title"><i class="fa fa-eye"></i>四、本次投产预览</div>
        <div class="form-grid" style="grid-template-columns:repeat(4,1fr)">
            <div style="background:#f8fafc; padding:12px; border-radius:6px; text-align:center">
                <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px">变更单数</div>
                <div style="font-size:22px; font-weight:700; color:var(--primary)" id="pChg">0</div>
            </div>
            <div style="background:#f8fafc; padding:12px; border-radius:6px; text-align:center">
                <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px">接口变更数</div>
                <div style="font-size:22px; font-weight:700; color:#16a34a" id="pApi">0</div>
            </div>
            <div style="background:#f8fafc; padding:12px; border-radius:6px; text-align:center">
                <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px">文件变更数</div>
                <div style="font-size:22px; font-weight:700; color:#d97706" id="pFile">0</div>
            </div>
            <div style="background:#f8fafc; padding:12px; border-radius:6px; text-align:center">
                <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px">关联系统数</div>
                <div style="font-size:22px; font-weight:700; color:#7c3aed" id="pSys">0</div>
            </div>
        </div>
    </div>

</div>

<script>
// 环境选择切换
function toggleBatchEnv(el) {
    el.classList.toggle('selected');
}

const orders = [
    { no:'CHG-20260601-002', title:'客户信息查询接口增加新客户类型字段', apis:4, files:1, sys:'客户管理系统', owner:'王工', type:'core', date:'2026-06-18', apiCount:4, fileCount:1 },
    { no:'CHG-20260601-003', title:'信贷额度占用接口改造（非标字段统一）', apis:10, files:2, sys:'信贷管理系统', owner:'刘工', type:'other', date:'2026-06-22', apiCount:10, fileCount:2 },
    { no:'CHG-20260601-005', title:'风险评分模型 v1.7 → v1.8 字段调整', apis:6, files:0, sys:'风险管理系统', owner:'孙工', type:'other', date:'2026-07-01', apiCount:6, fileCount:0 },
    { no:'CHG-20260601-006', title:'商户结算文件格式调整（新增结算币种字段）', apis:3, files:3, sys:'商户管理系统', owner:'周工', type:'core', date:'2026-06-20', apiCount:3, fileCount:3 },
    { no:'CHG-20260601-009', title:'ECIF 客户信息平台 v2.1 字段变更', apis:12, files:1, sys:'客户管理系统', owner:'许工', type:'customer', date:'2026-06-30', apiCount:12, fileCount:1 },
    { no:'CHG-20260525-001', title:'核心账务接口 v2.4 升级（字段标准化）', apis:18, files:0, sys:'核心账务系统', owner:'张工', type:'core', date:'2026-06-15', apiCount:18, fileCount:0 }
];

let selected = new Set();
let currentFilter = 'all';

function renderOrders() {
    const kw = document.getElementById('orderSearch').value.trim().toLowerCase();
    const list = document.getElementById('orderList');
    const filtered = orders.filter(o => {
        if (currentFilter !== 'all') {
            if (currentFilter === 'core' && !(o.sys.indexOf('核心')>=0 || o.sys.indexOf('客户')>=0)) return false;
            if (currentFilter === 'customer' && o.sys.indexOf('客户')<0) return false;
            if (currentFilter === 'other' && (o.sys.indexOf('核心')>=0 || o.sys.indexOf('客户')>=0)) return false;
        }
        if (kw && o.no.toLowerCase().indexOf(kw)<0 && o.title.toLowerCase().indexOf(kw)<0 && o.sys.toLowerCase().indexOf(kw)<0) return false;
        return true;
    });
    if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-secondary); font-size:12px"><i class="fa fa-inbox" style="font-size:32px; display:block; margin-bottom:10px"></i>未找到匹配的变更单</div>';
        return;
    }
    list.innerHTML = filtered.map(o => {
        const isSel = selected.has(o.no);
        return `<div class="order-card ${isSel?'selected':''}" onclick="toggleOrder('${o.no}')">
            <input type="checkbox" ${isSel?'checked':''} onclick="event.stopPropagation(); toggleOrder('${o.no}')">
            <div class="order-info">
                <div class="title">${o.title}</div>
                <div class="meta">
                    <span><i class="fa fa-hashtag"></i>${o.no}</span>
                    <span><i class="fa fa-server"></i>${o.sys}</span>
                    <span><i class="fa fa-user-o"></i>${o.owner}</span>
                    <span><i class="fa fa-calendar"></i>计划投产 ${o.date}</span>
                </div>
            </div>
            <div style="text-align:right; font-size:11px; color:var(--text-secondary)">
                <span class="tag-mini" style="background:#eff6ff; color:#1e40af">${o.apiCount} 接口</span>
                <span class="tag-mini" style="background:#fff7ed; color:#9a3412; margin-left:4px">${o.fileCount} 文件</span>
            </div>
        </div>`;
    }).join('');
    updateBar();
}

function toggleOrder(no) {
    if (selected.has(no)) selected.delete(no);
    else selected.add(no);
    renderOrders();
}

function selectAll() {
    const kw = document.getElementById('orderSearch').value.trim().toLowerCase();
    orders.forEach(o => {
        if (kw && o.no.toLowerCase().indexOf(kw)<0 && o.title.toLowerCase().indexOf(kw)<0 && o.sys.toLowerCase().indexOf(kw)<0) return;
        if (currentFilter !== 'all') {
            if (currentFilter === 'core' && !(o.sys.indexOf('核心')>=0 || o.sys.indexOf('客户')>=0)) return;
            if (currentFilter === 'customer' && o.sys.indexOf('客户')<0) return;
        }
        selected.add(o.no);
    });
    renderOrders();
}

function clearAll() {
    selected.clear();
    renderOrders();
}

function filterByStatus(btn, type) {
    document.querySelectorAll('.quick-btn').forEach(b => {
        if (b.textContent.indexOf('全选')>=0) return;
        if (b.textContent.indexOf('清空')>=0) return;
        b.classList.remove('active');
    });
    btn.classList.add('active');
    currentFilter = type;
    renderOrders();
}

function updateBar() {
    const bar = document.getElementById('selectBar');
    const count = selected.size;
    document.getElementById('selCount').textContent = count;
    bar.style.display = count > 0 ? 'flex' : 'none';

    if (count > 0) {
        document.getElementById('previewSection').style.display = 'block';
        const selectedOrders = orders.filter(o => selected.has(o.no));
        const totalApi = selectedOrders.reduce((s,o)=>s+o.apiCount, 0);
        const totalFile = selectedOrders.reduce((s,o)=>s+o.fileCount, 0);
        const sysSet = new Set(selectedOrders.map(o=>o.sys));
        document.getElementById('pChg').textContent = count;
        document.getElementById('pApi').textContent = totalApi;
        document.getElementById('pFile').textContent = totalFile;
        document.getElementById('pSys').textContent = sysSet.size;
    } else {
        document.getElementById('previewSection').style.display = 'none';
    }
}

function submitBatch() {
    if (!document.getElementById('batchName').value.trim()) { showToast('请填写批次名称'); return; }
    if (selected.size === 0) { showToast('请至少选择一个变更单'); return; }
    if (!confirm(`确认创建投产批次？\n已选择 ${selected.size} 个变更单，包含 ${Array.from(selected).reduce((s,n)=>{const o=orders.find(x=>x.no===n);return s+(o?o.apiCount:0)},0)} 个接口变更。`)) return;
    showToast('批次创建成功！\n\n批次编号：BAT-20260608-001\n变更单数：' + selected.size);
    govNav('pages/deploy/batch.html', ['首页','投产管理','投产批次管理'], {});
}

renderOrders();
</script>
</body>
</html>
