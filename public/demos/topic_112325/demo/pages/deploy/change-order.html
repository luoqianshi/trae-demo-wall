<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变更单管理 - 投产管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        .co-tag { display:inline-block; font-family:'Segoe UI'; font-weight:600; color:#1e40af; font-size:13px; }
        .env-tag { display:inline-block; padding:1px 6px; font-size:11px; border:1px solid #c7d2fe; background:#eef2ff; color:#1e40af; border-radius:3px; margin-right:2px; }
        .env-tag-only { display:inline-block; padding:2px 8px; font-size:11px; border:1px solid #fbbf24; background:#fffbeb; color:#92400e; border-radius:3px; }
        .ver-tag { display:inline-block; font-family:'Segoe UI'; font-weight:600; color:#0f766e; font-size:12px; }
        /* Toast 提示条 */
        .co-toast { position:fixed; top:24px; left:50%; transform:translateX(-50%); background:#10b981; color:#fff; padding:10px 18px; border-radius:6px; font-size:13px; z-index:10000; box-shadow:0 6px 16px rgba(0,0,0,0.15); opacity:0; transition:opacity .2s; pointer-events:none; }
        .co-toast.show { opacity:1; }
        /* 空状态行 */
        .empty-row td { padding:40px 0; text-align:center; color:#94a3b8; font-size:13px; }
        /* 分页按钮禁用态 */
        .page-item:disabled { opacity:0.4; cursor:not-allowed; }

        /* ========== 环境胶囊切换器（统一规范） ========== */
        .env-switcher { display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:14px; }
        .env-switcher .env-label { font-size:13px; color:#64748b; font-weight:600; margin-right:4px; }
        .env-pill { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:500; color:#475569; background:#f1f5f9; border:1px solid transparent; transition:all .2s ease; user-select:none; }
        .env-pill:hover { box-shadow:0 2px 6px rgba(0,0,0,.08); }
        .env-pill.active { background:#1e40af; color:#fff; border-color:#1e40af; box-shadow:0 2px 8px rgba(30,64,175,.25); }
        .env-pill .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#cbd5e1; }
        .env-pill.active .dot { background:#fff; }
        .env-pill .dot.green { background:#16a34a; }
        .env-pill .dot.yellow { background:#eab308; }
        .env-pill .dot.blue { background:#2563eb; }
        .env-pill .dot.purple { background:#9333ea; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-file-text-o" style="color:var(--primary);margin-right:8px"></i>变更单管理</h2>
            <div class="page-desc">
                首页 / 投产管理 / 变更单管理 - 对接口与文件服务的变更请求进行登记、跟踪，是投产批次管理与变更审计的基础单据
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-primary" onclick="govNav('pages/deploy/change-new.html', ['首页','投产管理','变更单管理','新增变更单'],{})"><i class="fa fa-plus-circle"></i> 新增变更单</button>
            <button class="btn btn-default" onclick="showToast('模板下载中...')"><i class="fa fa-file-text-o"></i> 变更单模板</button>
        </div>
    </div>

    <!-- ===== 环境胶囊切换器 ===== -->
    <div class="env-switcher" id="envSwitcher">
        <span class="env-label">环境:</span>
        <span class="env-pill" data-env="dev">DEV · 开发 <span class="dot purple"></span></span>
        <span class="env-pill" data-env="sit">SIT · 测试 <span class="dot yellow"></span></span>
        <span class="env-pill" data-env="uat">UAT · 验收 <span class="dot blue"></span></span>
        <span class="env-pill active" data-env="prod">PROD · 生产 <span class="dot green"></span></span>
    </div>

    <!-- ====== 筛选区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>状态</label>
                <select id="filterStatus" class="form-control"><option value="">全部</option><option value="草稿">草稿</option><option value="待投产">待投产</option><option value="已投产">已投产</option><option value="已回滚">已回滚</option></select>
            </div>
            <div class="form-item">
                <label>创建时间</label>
                <input id="filterDate" type="text" class="form-control" placeholder="2026-06-01 至 2026-06-30">
            </div>
            <div class="form-item">
                <label>负责人</label>
                <input id="filterOwner" type="text" class="form-control" placeholder="姓名">
            </div>
            <div class="form-item">
                <label>关联系统</label>
                <select id="filterSystem" class="form-control"><option value="">全部系统</option><option value="核心账务系统">核心账务系统</option><option value="客户管理系统">客户管理系统</option><option value="信贷管理系统">信贷管理系统</option><option value="支付清算系统">支付清算系统</option><option value="风险管理系统">风险管理系统</option><option value="商户管理系统">商户管理系统</option><option value="对账中心">对账中心</option></select>
            </div>
            <div class="form-item">
                <label>基准版本</label>
                <input id="filterVersion" type="text" class="form-control" placeholder="如 v2.3.0">
            </div>
            <div class="form-item">
                <label>影响环境</label>
                <select id="filterEnv" class="form-control">
                    <option value="">全部</option>
                    <option value="仅 DEV">仅 DEV</option>
                    <option value="仅 SIT">仅 SIT</option>
                    <option value="仅 UAT">仅 UAT</option>
                    <option value="仅 PROD">仅 PROD</option>
                    <option value="多环境">多环境</option>
                </select>
            </div>
            <div class="form-item">
                <label>关键词</label>
                <input id="filterKeyword" type="text" class="form-control" placeholder="变更单号/标题">
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary" onclick="searchOrders()"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default" onclick="resetFilter()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 变更单列表 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-list"></i> 变更单列表</div>
            <div class="card-action"><span style="font-size:12px;color:var(--text-secondary)">共 <span id="totalCount">9</span> 条</span></div>
        </div>
        <div class="table-wrapper" style="border-left:none;border-right:none;border-top:none;border-radius:0">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:150px">变更单号</th>
                        <th>变更标题</th>
                        <th style="width:100px" class="text-center">关联接口数</th>
                        <th style="width:160px">关联系统</th>
                        <th style="width:100px">负责人</th>
                        <th style="width:130px">计划投产日期</th>
                        <th style="width:90px" class="text-center">当前状态</th>
                        <th style="width:100px">基准版本</th>
                        <th style="width:180px">影响环境</th>
                        <th style="width:130px">创建时间</th>
                        <th style="width:200px" class="text-center op-col">操作</th>
                    </tr>
                </thead>
                <tbody id="coBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary" id="pageInfoTotal">9</span> 条</div>
            <div class="page-list" id="pageList"></div>
            <div class="page-size">
                <select id="pageSizeSelect" class="form-control" style="height:32px" onchange="changePageSize(this.value)"><option value="10">10 条/页</option><option value="20">20 条/页</option></select>
            </div>
        </div>
    </div>

</div>

<!-- Toast 提示 -->
<div class="co-toast" id="coToast">操作成功</div>

<script>
/* ============================================================
 * 变更单数据源（Demo 数据）
 * ============================================================ */
var allOrders = [
    { no:'CHG-20260601-001', title:'核心账务系统接口 v2.4 升级（字段标准化改造）', apis:18, sys:'核心账务系统', owner:'张工', date:'2026-06-15', status:'已投产', created:'2026-05-28 09:30', baseVersion:'v2.3.8', affectedEnvs:['DEV','SIT','UAT','PROD'] },
    { no:'CHG-20260601-002', title:'客户信息查询接口增加新客户类型字段', apis:4, sys:'客户管理系统', owner:'王工', date:'2026-06-18', status:'待投产', created:'2026-05-30 14:12', baseVersion:'v1.5.0', affectedEnvs:['DEV','SIT','UAT'] },
    { no:'CHG-20260601-003', title:'信贷额度占用接口改造（非标字段统一）', apis:10, sys:'信贷管理系统', owner:'刘工', date:'2026-06-22', status:'待投产', created:'2026-06-02 10:58', baseVersion:'v2.1.3', affectedEnvs:['DEV','SIT','UAT','PROD'] },
    { no:'CHG-20260601-004', title:'支付清算系统 v3.0 接口升级', apis:9, sys:'支付清算系统', owner:'陈工', date:'2026-06-28', status:'待投产', created:'2026-06-03 16:45', baseVersion:'v3.0.0', affectedEnvs:['PROD'] },
    { no:'CHG-20260601-005', title:'风险评分模型 v1.7 → v1.8 字段调整', apis:6, sys:'风险管理系统', owner:'孙工', date:'2026-07-01', status:'草稿', created:'2026-06-05 11:22', baseVersion:'v1.7.0', affectedEnvs:['DEV','SIT'] },
    { no:'CHG-20260601-006', title:'商户结算文件格式调整（新增结算币种字段）', apis:3, sys:'商户管理系统', owner:'周工', date:'2026-06-20', status:'已投产', created:'2026-05-22 15:08', baseVersion:'v1.2.5', affectedEnvs:['DEV','SIT','UAT','PROD'] },
    { no:'CHG-20260601-007', title:'反洗钱监测接口字段调整', apis:5, sys:'风险管理系统', owner:'吕工', date:'2026-06-12', status:'已回滚', created:'2026-05-18 09:58', baseVersion:'v2.0.1', affectedEnvs:['UAT'] },
    { no:'CHG-20260601-008', title:'对账中心文件生成规则优化', apis:2, sys:'对账中心', owner:'吴工', date:'2026-06-25', status:'草稿', created:'2026-06-06 17:32', baseVersion:'v1.0.0', affectedEnvs:['DEV'] },
    { no:'CHG-20260601-009', title:'ECIF 客户信息平台 v2.1 字段变更', apis:12, sys:'客户管理系统', owner:'许工', date:'2026-06-30', status:'待投产', created:'2026-06-07 13:10', baseVersion:'v2.1.0', affectedEnvs:['DEV','SIT','UAT','PROD'] }
];

var statusMap = { '草稿':'tag-default', '待投产':'tag-warning', '已投产':'tag-success', '已回滚':'tag-danger' };

/* 分页与筛选状态 */
var filteredOrders = allOrders;
var currentPage = 1;
var pageSize = 10;
/* Demo 总条数（代表完整数据集，实际展示 9 条样本） */
var totalCount = 9;

/* ============================================================
 * 渲染影响环境标签
 * ============================================================ */
function renderEnvs(envs) {
    if (!envs || envs.length === 0) return '<span style="color:#94a3b8;font-size:12px">-</span>';
    if (envs.length === 1) {
        return '<span class="env-tag-only">仅 ' + envs[0] + '</span>';
    }
    return envs.map(function(e) { return '<span class="env-tag">' + e + '</span>'; }).join('');
}

/* ============================================================
 * 获取环境类型描述（用于 data-env 属性与筛选匹配）
 * ============================================================ */
function getEnvType(envs) {
    if (!envs || envs.length === 0) return '';
    if (envs.length === 1) return '仅 ' + envs[0];
    return '多环境';
}

/* ============================================================
 * 渲染表格（含分页截断与空状态）
 * ============================================================ */
function renderTable() {
    var body = document.getElementById('coBody');

    /* 空状态 */
    if (filteredOrders.length === 0) {
        body.innerHTML = '<tr class="empty-row"><td colspan="11"><i class="fa fa-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>暂无符合条件的变更单</td></tr>';
        renderPagination();
        return;
    }

    /* 分页截取当前页数据 */
    var start = (currentPage - 1) * pageSize;
    var pageData = filteredOrders.slice(start, start + pageSize);

    body.innerHTML = pageData.map(function(o) {
        return '<tr data-row="' + o.no + '" data-status="' + o.status + '" data-system="' + o.sys + '" data-env="' + getEnvType(o.affectedEnvs) + '">' +
            '<td><span class="co-tag">' + o.no + '</span></td>' +
            '<td>' + o.title + '</td>' +
            '<td class="text-center num">' + o.apis + '</td>' +
            '<td>' + o.sys + '</td>' +
            '<td>' + o.owner + '</td>' +
            '<td>' + o.date + '</td>' +
            '<td class="text-center"><span class="tag ' + statusMap[o.status] + '" style="font-size:11px">' + o.status + '</span></td>' +
            '<td><span class="ver-tag">' + o.baseVersion + '</span></td>' +
            '<td>' + renderEnvs(o.affectedEnvs) + '</td>' +
            '<td style="font-size:12px">' + o.created + '</td>' +
            '<td class="text-center op-col">' +
                '<a class="btn-link" onclick="viewOrder(\'' + o.no + '\')"><i class="fa fa-eye"></i> 查看</a> ' +
                '<a class="btn-link" onclick="editOrder(\'' + o.no + '\')"><i class="fa fa-pencil"></i> 编辑</a> ' +
                '<a class="btn-link" style="color:var(--danger)" onclick="deleteOrder(\'' + o.no + '\')"><i class="fa fa-trash-o"></i> 删除</a>' +
            '</td>' +
        '</tr>';
    }).join('');

    renderPagination();
}

/* ============================================================
 * 渲染分页器
 * ============================================================ */
function renderPagination() {
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages < 1) totalPages = 1;

    var html = '';
    /* 上一页 */
    html += '<button class="page-item"' + (currentPage <= 1 ? ' disabled' : '') + ' onclick="goToPage(' + (currentPage - 1) + ')"><i class="fa fa-angle-left"></i></button>';
    /* 页码 */
    for (var i = 1; i <= totalPages; i++) {
        html += '<button class="page-item' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
    }
    /* 下一页 */
    html += '<button class="page-item"' + (currentPage >= totalPages ? ' disabled' : '') + ' onclick="goToPage(' + (currentPage + 1) + ')"><i class="fa fa-angle-right"></i></button>';

    document.getElementById('pageList').innerHTML = html;
    document.getElementById('totalCount').textContent = totalCount;
    document.getElementById('pageInfoTotal').textContent = totalCount;
}

/* ============================================================
 * 行内操作：查看变更单
 * ============================================================ */
function viewOrder(orderId) {
    govNav('pages/deploy/change-new.html', ['首页','投产管理','变更单管理','查看变更单'], {mode:'view', order:orderId});
}

/* ============================================================
 * 行内操作：编辑变更单
 * ============================================================ */
function editOrder(orderId) {
    govNav('pages/deploy/change-new.html', ['首页','投产管理','变更单管理','编辑变更单'], {id:orderId});
}

/* ============================================================
 * 行内操作：删除变更单（二次确认）
 * ============================================================ */
function deleteOrder(orderId) {
    if (!confirm('确认删除变更单 ' + orderId + '？此操作不可撤销。')) return;
    var row = document.querySelector('[data-row="' + orderId + '"]');
    if (row) row.remove();
    /* 同步移除数据源中的记录 */
    allOrders = allOrders.filter(function(o) { return o.no !== orderId; });
    filteredOrders = filteredOrders.filter(function(o) { return o.no !== orderId; });
    totalCount = Math.max(0, totalCount - 1);
    showToast('已删除变更单 ' + orderId);
    renderTable();
}

/* ============================================================
 * 查询筛选
 * ============================================================ */
function searchOrders() {
    var status = document.getElementById('filterStatus').value;
    var system = document.getElementById('filterSystem').value;
    var env = document.getElementById('filterEnv').value;
    var owner = document.getElementById('filterOwner').value.trim();
    var version = document.getElementById('filterVersion').value.trim();
    var keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

    filteredOrders = allOrders.filter(function(o) {
        if (status && o.status !== status) return false;
        if (system && o.sys !== system) return false;
        if (env && getEnvType(o.affectedEnvs) !== env) return false;
        if (owner && o.owner.indexOf(owner) === -1) return false;
        if (version && o.baseVersion.indexOf(version) === -1) return false;
        /* 关键词匹配变更单号或标题 */
        if (keyword && o.no.toLowerCase().indexOf(keyword) === -1 && o.title.toLowerCase().indexOf(keyword) === -1) return false;
        return true;
    });

    currentPage = 1;
    totalCount = filteredOrders.length;
    renderTable();
    showToast('查询完成，共 ' + filteredOrders.length + ' 条');
}

/* ============================================================
 * 重置筛选条件
 * ============================================================ */
function resetFilter() {
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterSystem').value = '';
    document.getElementById('filterEnv').value = '';
    document.getElementById('filterOwner').value = '';
    document.getElementById('filterVersion').value = '';
    document.getElementById('filterDate').value = '';
    document.getElementById('filterKeyword').value = '';
    filteredOrders = allOrders;
    currentPage = 1;
    /* 恢复 Demo 总条数 */
    totalCount = 9;
    renderTable();
    showToast('筛选条件已重置');
}

/* ============================================================
 * 翻页
 * ============================================================ */
function goToPage(n) {
    var totalPages = Math.ceil(totalCount / pageSize);
    if (n < 1 || n > totalPages) return;
    currentPage = n;
    renderTable();
}

/* ============================================================
 * 切换每页条数
 * ============================================================ */
function changePageSize(size) {
    pageSize = parseInt(size, 10) || 10;
    currentPage = 1;
    renderTable();
    showToast('已切换为每页 ' + pageSize + ' 条');
}

/* ====== 环境切换器 ====== */
document.querySelectorAll('#envSwitcher .env-pill').forEach(function(pill) {
    pill.addEventListener('click', function() {
        document.querySelectorAll('#envSwitcher .env-pill').forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');
        var env = this.getAttribute('data-env');
        showToast('已切换到 ' + (env === 'prod' ? 'PROD · 生产' : env === 'sit' ? 'SIT · 测试' : env === 'uat' ? 'UAT · 验收' : 'DEV · 开发') + ' 环境');
    });
});

/* ============================================================
 * 页面启动
 * ============================================================ */
renderTable();
</script>
</body>
</html>
