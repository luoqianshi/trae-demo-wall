<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投产批次管理 - 投产管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        .view-toggle { display:inline-flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
        .view-toggle button { padding:6px 14px; background:#fff; color:var(--text-secondary); font-size:12px; border:none; cursor:pointer; }
        .view-toggle button.active { background:var(--primary); color:#fff; }
        .batch-sub { font-size:11px; color:var(--text-secondary); margin-top:4px; }
        .batch-line { border-left:3px solid var(--border); padding-left:20px; position:relative; margin:20px 10px; }
        .batch-line::before { content:''; position:absolute; left:-8px; top:8px; width:13px; height:13px; border-radius:50%; background:var(--primary); border:3px solid #eff6ff; }
        .batch-line-card { background:#fff; border:1px solid var(--border); border-radius:6px; padding:14px; }
        .chg-chip { display:inline-block; padding:2px 8px; background:#eff6ff; color:var(--primary); font-size:11px; border-radius:3px; margin:3px 4px 0 0; }
        /* 三态报告按钮样式 */
        .report-btn {
            display:inline-flex; align-items:center; gap:4px; padding:4px 12px; font-size:12px;
            border:1px solid var(--border); border-radius:4px; cursor:pointer; background:#fff; color:var(--text-primary);
            transition:all 0.15s;
        }
        .report-btn:hover { border-color:var(--primary); color:var(--primary); }
        .report-btn.generating { background:#fef3c7; color:#92400e; border-color:#fcd34d; cursor:not-allowed; }
        .report-btn.generating i { animation:spin 1s linear infinite; }
        .report-btn.ready { background:#dcfce7; color:#166534; border-color:#86efac; }
        .report-btn.ready:hover { background:#bbf7d0; }
        @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        /* 环境标签样式 */
        .env-tag { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:3px; font-size:11px; font-weight:500; }
        .env-tag .et-dot { width:6px; height:6px; border-radius:50%; }
        .env-tag-DEV { background:#dbeafe; color:#1e40af; }
        .env-tag-SIT { background:#ede9fe; color:#5b21b6; }
        .env-tag-UAT { background:#fef3c7; color:#92400e; }
        .env-tag-PROD { background:#fee2e2; color:#991b1b; }
        .env-tag-multi { background:#f1f5f9; color:#475569; }

        /* ========== 环境胶囊切换器（统一规范） ========== */
        .env-switcher { display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:14px; }
        .env-switcher .env-label { font-size:13px; color:#64748b; font-weight:600; margin-right:4px; }
        .env-pill { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:500; color:#475569; background:#f1f5f9; border:1px solid transparent; transition:all .2s ease; user-select:none; }
        .env-pill:hover { box-shadow:0 2px 6px rgba(0,0,0,.08); }
        .env-pill.active { background:#1e40af; color:#fff; border-color:#1e40af; box-shadow:0 2px 8px rgba(30,64,175,.25); }
        .env-pill .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#cbd5e1; }
        .env-pill.active .dot { background:#fff; }
        .env-pill .dot.green { background:#16a34a; }
        .env-pill .dot.yellow { background:#eab308; }
        .env-pill .dot.blue { background:#2563eb; }
        .env-pill .dot.purple { background:#9333ea; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-cubes" style="color:var(--primary);margin-right:8px"></i>投产批次管理</h2>
            <div class="page-desc">
                首页 / 投产管理 / 投产批次管理 - 统一编排各变更单为投产批次，管理实际投产时间，提供时间线视角
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-primary" onclick="govNav('pages/deploy/batch-new.html', ['首页','投产管理','投产批次管理','新增批次'], {})"><i class="fa fa-plus-circle"></i> 新增批次</button>
        </div>
    </div>

    <!-- ===== 环境胶囊切换器 ===== -->
    <div class="env-switcher" id="envSwitcher">
        <span class="env-label">环境:</span>
        <span class="env-pill active" data-env="prod">PROD · 生产 <span class="dot green"></span></span>
        <span class="env-pill" data-env="sit">SIT · 测试 <span class="dot yellow"></span></span>
        <span class="env-pill" data-env="uat">UAT · 验收 <span class="dot blue"></span></span>
        <span class="env-pill" data-env="dev">DEV · 开发 <span class="dot purple"></span></span>
    </div>

    <!-- ====== 筛选区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>批次状态</label>
                <select class="form-control" id="filterStatus" onchange="searchBatch()">
                    <option value="">全部</option>
                    <option value="待投产">待投产</option>
                    <option value="已投产">已投产</option>
                    <option value="已回滚">已回滚</option>
                </select>
            </div>
            <div class="form-item">
                <label>目标环境</label>
                <select class="form-control" id="filterEnv" onchange="searchBatch()">
                    <option value="">全部环境</option>
                    <option value="DEV">DEV · 开发环境</option>
                    <option value="SIT">SIT · 集成测试</option>
                    <option value="UAT">UAT · 验收测试</option>
                    <option value="PROD">PROD · 生产环境</option>
                    <option value="multi">多环境投产</option>
                </select>
            </div>
            <div class="form-item">
                <label>时间范围</label>
                <input type="date" class="form-control" id="filterDateRange" placeholder="2026-06-01 至 2026-06-30" title="选择起始日期进行筛选">
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary" onclick="searchBatch()"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default" onclick="resetFilter()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
            <div class="form-item" style="flex:1; text-align:right">
                <div class="view-toggle">
                    <button class="active" onclick="switchView('table', this)"><i class="fa fa-th-list"></i> 表格视图</button>
                    <button onclick="switchView('line', this)"><i class="fa fa-clock-o"></i> 时间线视图</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 表格视图 ====== -->
    <div class="card" id="viewTable">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-th-list"></i> 批次列表</div>
            <div class="card-action"><span style="font-size:12px;color:var(--text-secondary)">共 8 个批次</span></div>
        </div>
        <div class="table-wrapper" style="border-left:none;border-right:none;border-top:none;border-radius:0">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:150px">批次编号</th>
                        <th>批次名称</th>
                        <th style="width:90px" class="text-center">变更单数</th>
                        <th style="width:120px" class="text-center">接口/文件数</th>
                        <th style="width:140px" class="text-center">目标环境</th>
                        <th style="width:150px">计划投产时间</th>
                        <th style="width:150px">实际投产时间</th>
                        <th style="width:90px" class="text-center">状态</th>
                        <th style="width:230px" class="text-center op-col">操作</th>
                    </tr>
                </thead>
                <tbody id="batchBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">8</span> 条</div>
            <div class="page-list">
                <button onclick="goToPage('prev')"><i class="fa fa-angle-left"></i></button>
                <button class="active" onclick="goToPage(1)">1</button>
                <button onclick="goToPage('next')"><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px"><option>10 条/页</option></select>
            </div>
        </div>
    </div>

    <!-- ====== 时间线视图 ====== -->
    <div class="card" id="viewLine" style="display:none">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-clock-o"></i> 批次时间线</div>
            <div class="card-action"><span style="font-size:12px;color:var(--text-secondary)">按投产时间排序</span></div>
        </div>
        <div id="lineBody" style="padding:10px 16px"></div>
    </div>

</div>

<script>
const batches = [
    { no:'BAT-20260615', name:'6月中旬核心系统投产批次', chg:3, api:'18接口 / 4文件', envs:['DEV','SIT','UAT','PROD'], plan:'2026-06-15 22:00', real:'2026-06-15 22:45', status:'已投产', reportStatus:'ready', items:['CHG-20260601-002','CHG-20260601-003','CHG-20260601-006'] },
    { no:'BAT-20260618', name:'客户信息接口专项批次', chg:2, api:'6接口 / 1文件', envs:['UAT','PROD'], plan:'2026-06-18 22:00', real:'2026-06-18 22:30', status:'已投产', reportStatus:'ready', items:['CHG-20260601-002','CHG-20260601-009'] },
    { no:'BAT-20260620', name:'信贷系统月度投产', chg:3, api:'12接口 / 2文件', envs:['DEV','SIT','UAT','PROD'], plan:'2026-06-20 22:00', real:'—', status:'待投产', reportStatus:'none', items:['CHG-20260601-003','CHG-20260601-010','CHG-20260601-011'] },
    { no:'BAT-20260622', name:'支付清算 v3.0 重大升级', chg:1, api:'9接口 / 0文件', envs:['PROD'], plan:'2026-06-22 23:00', real:'—', status:'待投产', reportStatus:'none', items:['CHG-20260601-004'] },
    { no:'BAT-20260625', name:'对账中心规则优化批次', chg:1, api:'2接口 / 3文件', envs:['SIT','UAT'], plan:'2026-06-25 22:00', real:'—', status:'待投产', reportStatus:'none', items:['CHG-20260601-008'] },
    { no:'BAT-20260628', name:'6月末常规投产批次', chg:4, api:'15接口 / 5文件', envs:['DEV','SIT','UAT','PROD'], plan:'2026-06-28 22:00', real:'—', status:'待投产', reportStatus:'none', items:[] },
    { no:'BAT-20260612', name:'反洗钱监测调整', chg:1, api:'5接口 / 1文件', envs:['PROD'], plan:'2026-06-12 22:00', real:'2026-06-12 22:28', status:'已回滚', reportStatus:'ready', items:['CHG-20260601-007'] },
    { no:'BAT-20260701', name:'7月初风险模型升级', chg:1, api:'6接口 / 0文件', envs:['UAT','PROD'], plan:'2026-07-01 22:00', real:'—', status:'待投产', reportStatus:'none', items:['CHG-20260601-005'] }
];

const statusMap = { '待投产':'tag-warning', '已投产':'tag-success', '已回滚':'tag-danger' };

function renderBatchTable() {
    // 空数据时渲染空状态行
    if (!batches.length) {
        document.getElementById('batchBody').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-secondary)"><i class="fa fa-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>暂无批次数据</td></tr>';
        return;
    }
    document.getElementById('batchBody').innerHTML = batches.map(b => {
        let reportBtn = '';
        if (b.reportStatus === 'ready') {
            reportBtn = `<a class="report-btn ready" onclick="govNav('pages/deploy/report.html', ['首页','投产管理','投产报告'], {batch:'${b.no}', name:'${b.name}'})"><i class="fa fa-file-pdf-o"></i> 查看报告</a>`;
        } else if (b.reportStatus === 'generating') {
            reportBtn = `<a class="report-btn generating" onclick="event.stopPropagation()"><i class="fa fa-spinner"></i> 生成中...</a>`;
        } else if (b.status === '已投产') {
            reportBtn = `<a class="report-btn" onclick="generateReport('${b.no}')"><i class="fa fa-file-text-o"></i> 生成报告</a>`;
        } else {
            reportBtn = `<span style="font-size:12px;color:#cbd5e1"><i class="fa fa-lock"></i> 未投产</span>`;
        }
        // 生成环境标签
        var envColors = { DEV:'#3b82f6', SIT:'#8b5cf6', UAT:'#f59e0b', PROD:'#ef4444' };
        var envHtml = '';
        if (b.envs.length === 1) {
            envHtml = `<span class="env-tag env-tag-${b.envs[0]}"><span class="et-dot" style="background:${envColors[b.envs[0]]}"></span>${b.envs[0]}</span>`;
        } else if (b.envs.length === 4) {
            envHtml = `<span class="env-tag env-tag-multi"><i class="fa fa-layer-group"></i> 全环境</span>`;
        } else {
            envHtml = b.envs.map(function(e) {
                return `<span class="env-tag env-tag-${e}" style="margin-right:2px"><span class="et-dot" style="background:${envColors[e]}"></span>${e}</span>`;
            }).join('');
        }
        return `<tr data-row data-status="${b.status}" data-env="${b.envs.join(',')}">
            <td><span style="font-family:'Segoe UI';font-weight:600;color:var(--primary);font-size:13px">${b.no}</span></td>
            <td>${b.name}
                <div class="batch-sub">${b.items.slice(0,3).map(i=>`<span class="chg-chip">${i}</span>`).join('')}${b.items.length>3?`<span style="font-size:11px;color:var(--text-secondary)">+${b.items.length-3}</span>`:''}</div>
            </td>
            <td class="text-center num">${b.chg}</td>
            <td class="text-center" style="font-size:12px">${b.api}</td>
            <td class="text-center">${envHtml}</td>
            <td style="font-size:12px">${b.plan}</td>
            <td style="font-size:12px">${b.real}</td>
            <td class="text-center"><span class="tag ${statusMap[b.status]}" style="font-size:11px">${b.status}</span></td>
            <td class="text-center" style="white-space:nowrap">
                <a class="btn-link" style="padding:0 6px" onclick="govNav('pages/deploy/batch-detail.html', ['首页','投产管理','投产批次管理','批次详情'], {batch:'${b.no}'})"><i class="fa fa-eye"></i> 详情</a>
                ${reportBtn}
                ${b.status==='已投产' ? `<a class="btn-link" style="padding:0 6px;color:var(--danger)" onclick="rollbackBatch('${b.no}')"><i class="fa fa-undo"></i> 回滚</a>` : ''}
            </td>
        </tr>`;
    }).join('');
}

function generateReport(no) {
    const batch = batches.find(b => b.no === no);
    if (!batch) return;
    if (!confirm(`确认生成【${batch.no} ${batch.name}】的投产报告？\n\n报告将汇总所有变更单、接口/文件清单与回滚方案信息。`)) return;
    batch.reportStatus = 'generating';
    renderBatchTable();
    renderBatchLine();
    setTimeout(() => {
        batch.reportStatus = 'ready';
        renderBatchTable();
        renderBatchLine();
        showToast('投产报告已生成！\n点击"查看报告"可查看完整内容。');
    }, 2000);
}

function renderBatchLine() {
    // 空数据时渲染空状态
    if (!batches.length) {
        document.getElementById('lineBody').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)"><i class="fa fa-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>暂无批次数据</div>';
        return;
    }
    document.getElementById('lineBody').innerHTML = batches.map(b => {
        let reportBtn = '';
        if (b.reportStatus === 'ready') {
            reportBtn = `<a class="report-btn ready" onclick="govNav('pages/deploy/report.html', ['首页','投产管理','投产报告'], {batch:'${b.no}', name:'${b.name}'})"><i class="fa fa-file-pdf-o"></i> 查看报告</a>`;
        } else if (b.reportStatus === 'generating') {
            reportBtn = `<a class="report-btn generating"><i class="fa fa-spinner"></i> 生成中...</a>`;
        } else if (b.status === '已投产') {
            reportBtn = `<a class="report-btn" onclick="generateReport('${b.no}')"><i class="fa fa-file-text-o"></i> 生成报告</a>`;
        }
        return `<div class="batch-line">
            <div class="batch-line-card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start">
                    <div>
                        <div style="font-weight:700;color:var(--text-primary);font-size:14px">${b.name}</div>
                        <div class="batch-sub"><i class="fa fa-hashtag" style="margin-right:4px"></i>${b.no} · ${b.chg} 个变更单 · ${b.api} · 计划 ${b.plan}</div>
                    </div>
                    <span class="tag ${statusMap[b.status]}" style="font-size:11px">${b.status}</span>
                </div>
                <div style="margin-top:10px">${b.items.map(i=>`<span class="chg-chip">${i}</span>`).join('')}</div>
                <div style="margin-top:10px;display:flex;gap:12px;font-size:12px">
                    <a class="btn-link" onclick="govNav('pages/deploy/batch-detail.html', ['首页','投产管理','投产批次管理','批次详情'], {batch:'${b.no}'})"><i class="fa fa-eye"></i> 查看详情</a>
                    ${reportBtn}
                    ${b.status==='已投产' ? `<a class="btn-link" style="color:var(--danger)" onclick="rollbackBatch('${b.no}')"><i class="fa fa-undo"></i> 回滚</a>` : ''}
                </div>
            </div>
        </div>`;
    }).join('');
}

function switchView(type, btn) {
    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('viewTable').style.display = type === 'table' ? '' : 'none';
    document.getElementById('viewLine').style.display = type === 'line' ? '' : 'none';
}

/* ====== 环境切换器 ====== */
document.querySelectorAll('#envSwitcher .env-pill').forEach(function(pill) {
    pill.addEventListener('click', function() {
        document.querySelectorAll('#envSwitcher .env-pill').forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');
        var env = this.getAttribute('data-env');
        showToast('已切换到 ' + (env === 'prod' ? 'PROD · 生产' : env === 'sit' ? 'SIT · 测试' : env === 'uat' ? 'UAT · 验收' : 'DEV · 开发') + ' 环境');
    });
});

/* ====== 筛选查询 ====== */
function searchBatch() {
    var status = (document.getElementById('filterStatus')||{}).value || '';
    var env = (document.getElementById('filterEnv')||{}).value || '';
    var rows = document.querySelectorAll('#batchBody tr[data-row]');
    var visible = 0;
    rows.forEach(function(row) {
        var show = true;
        if (status && row.getAttribute('data-status') !== status) show = false;
        if (env) {
            // 环境为数组，需判断是否包含选中环境
            var rowEnvs = (row.getAttribute('data-env') || '').split(',');
            if (env === 'multi') {
                show = rowEnvs.length > 1;
            } else {
                show = rowEnvs.indexOf(env) !== -1;
            }
        }
        row.style.display = show ? '' : 'none';
        if (show) visible++;
    });
    // 空状态处理
    var emptyRow = document.getElementById('emptyFilterRow');
    if (visible === 0) {
        if (!emptyRow) {
            var tbody = document.getElementById('batchBody');
            var tr = document.createElement('tr');
            tr.id = 'emptyFilterRow';
            tr.innerHTML = '<td colspan="9" style="text-align:center;padding:40px;color:var(--text-secondary)"><i class="fa fa-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>暂无符合条件的批次记录</td>';
            tbody.appendChild(tr);
        }
    } else if (emptyRow) {
        emptyRow.remove();
    }
    showToast('筛选完成，共 ' + visible + ' 条记录');
}

/* ====== 重置筛选 ====== */
function resetFilter() {
    var statusEl = document.getElementById('filterStatus');
    var envEl = document.getElementById('filterEnv');
    var dateEl = document.getElementById('filterDateRange');
    if (statusEl) statusEl.value = '';
    if (envEl) envEl.value = '';
    if (dateEl) dateEl.value = '';
    // 移除空状态行
    var emptyRow = document.getElementById('emptyFilterRow');
    if (emptyRow) emptyRow.remove();
    // 恢复所有行显示
    var rows = document.querySelectorAll('#batchBody tr[data-row]');
    rows.forEach(function(row) { row.style.display = ''; });
    showToast('筛选条件已重置');
}

/* ====== 回滚批次（高危操作，二次确认） ====== */
function rollbackBatch(batchNo) {
    if (!confirm('确认回滚批次 ' + batchNo + '？\n回滚将撤销该批次的所有投产变更，此操作不可撤销。')) return;
    if (!confirm('二次确认：真的要回滚吗？回滚后需重新执行投产。')) return;
    showToast('批次 ' + batchNo + ' 回滚执行中...', 'warning');
    setTimeout(function() {
        showToast('批次 ' + batchNo + ' 已回滚', 'warning');
        location.reload();
    }, 2000);
}

/* ====== 分页跳转 ====== */
function goToPage(page) {
    if (page === 'prev' || page === 'next') {
        showToast(page === 'prev' ? '已是第一页' : '已是最后一页');
        return;
    }
    showToast('跳转到第 ' + page + ' 页');
}

/* ====== 初始加载状态 ====== */
