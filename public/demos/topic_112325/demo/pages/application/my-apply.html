<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的申请 - 工作台</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
<script src="../../js/nav-helper.js"></script>
<style>
    .apply-dropdown { position: relative; display: inline-block; }
    .apply-dropdown .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; z-index: 1000; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); min-width: 180px; padding: 4px 0; margin-top: 4px; }
    .apply-dropdown.show .dropdown-menu { display: block; }
    .apply-dropdown .dropdown-menu > div { padding: 10px 16px; cursor: pointer; font-size: 13px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
    .apply-dropdown .dropdown-menu > div:hover { background: #eff6ff; }
    .apply-dropdown .dropdown-menu .dropdown-sep { border-top: 1px solid #e2e8f0; margin: 4px 0; padding: 0; cursor: default; }
    .apply-dropdown .dropdown-menu .dropdown-sep:hover { background: transparent; }
</style>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-file-text-o" style="color:var(--primary);margin-right:8px"></i>我的申请</h2>
            <div class="page-desc">
                首页 / 工作台 / 我的申请 · 当前用户：李经理（零售业务部）
            </div>
        </div>
        <div class="action-group">
            <div style="position:relative;display:inline-block" class="apply-dropdown">
                <button class="btn btn-primary" onclick="document.querySelector('.apply-dropdown').classList.toggle('show')"><i class="fa fa-plus-circle"></i> 发起申请 <i class="fa fa-caret-down" style="margin-left:4px"></i></button>
                <div class="dropdown-menu">
                    <div onclick="navTo('pages/application/register-apply.html','接口注册申请',{type:'REGISTER'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-plus-circle" style="color:#2563eb"></i> 接口注册申请</div>
                    <div onclick="navTo('pages/application/change-apply.html','接口变更申请',{type:'CHANGE'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-pencil-square-o" style="color:#d97706"></i> 接口变更申请</div>
                    <div onclick="navTo('pages/application/api-call-apply.html','接口服务调用申请',{type:'API_CALL'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-plug" style="color:#059669"></i> 接口服务调用申请</div>
                    <div onclick="navTo('pages/application/file-subscription-apply.html','文件服务订阅申请',{type:'FILE_SUB'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-file-archive-o" style="color:#0891b2"></i> 文件服务订阅申请</div>
                    <div onclick="navTo('pages/application/offline-apply.html','服务下线申请',{type:'OFFLINE'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-power-off" style="color:#dc2626"></i> 服务下线申请</div>
                    <div class="dropdown-sep"></div>
                    <div onclick="navTo('pages/application/file-register-apply.html','文件服务注册申请');document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-file-o" style="color:#7c3aed"></i> 文件服务注册申请</div>
                    <div onclick="navTo('pages/application/file-change-apply.html','文件服务变更申请');document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-exchange" style="color:#d97706"></i> 文件服务变更申请</div>
                    <div class="dropdown-sep"></div>
                    <div onclick="navTo('pages/system/system-apply.html','系统接入申请',{type:'SYSTEM'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-desktop" style="color:#7c3aed"></i> 系统接入申请</div>
                </div>
            </div>
            <script>
            document.addEventListener('click',function(e){if(!e.target.closest('.apply-dropdown')){var m=document.querySelector('.apply-dropdown');if(m)m.classList.remove('show');}});
            </script>
            <button class="btn btn-default" onclick="exportApplies()"><i class="fa fa-download"></i> 导出</button>
        </div>
    </div>

    <!-- 快捷说明横幅 -->
    <div style="background:linear-gradient(90deg,#fffbeb,#eff6ff);border:1px solid #fde68a;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:13px;color:#92400e;display:flex;align-items:center;gap:12px">
        <i class="fa fa-lightbulb-o" style="font-size:18px;color:#d97706"></i>
        <span><b>快捷操作说明：</b>点击申请单号查看详情 · "审核进度"实时追踪审批节点 · 待审核状态申请可撤回 · 顶部"新建申请"选择申请类型快速发起</span>
    </div>

    <!-- ====== 筛选操作区 + Tab 切换 ====== -->
    <div class="filter-bar">
        <div class="tabs" style="border-bottom:none;padding:0;margin-bottom:12px">
            <div class="tab-item active" data-tab="all" onclick="switchApplyTab('all')">全部 <span style="color:#94a3b8">(42)</span></div>
            <div class="tab-item" data-tab="pending" onclick="switchApplyTab('pending')">待提交 <span style="color:#94a3b8">(3)</span></div>
            <div class="tab-item" data-tab="audit" onclick="switchApplyTab('audit')">待审核 <span style="color:#d97706">(8)</span></div>
            <div class="tab-item" data-tab="pass" onclick="switchApplyTab('pass')">已通过 <span style="color:#059669">(26)</span></div>
            <div class="tab-item" data-tab="reject" onclick="switchApplyTab('reject')">已驳回 <span style="color:#dc2626">(4)</span></div>
            <div class="tab-item" data-tab="closed" onclick="switchApplyTab('closed')">已关闭 <span style="color:#94a3b8">(1)</span></div>
        </div>
        <div class="form-row">
            <div class="form-item">
                <label>申请单号</label>
                <input class="form-control" id="filtCode" placeholder="输入申请单号">
            </div>
            <div class="form-item">
                <label>申请标题</label>
                <input class="form-control" id="filtTitle" placeholder="模糊匹配申请标题，如：客户信息、接口、v2" style="min-width:220px">
            </div>
            <div class="form-item">
                <label>申请类型</label>
                <select class="form-control" id="filtType">
                    <option value="">全部</option>
                    <option>接口注册</option>
                    <option>接口变更</option>
                    <option>接口服务调用</option>
                    <option>文件服务订阅</option>
                    <option>服务下线</option>
                    <option>文件服务注册</option>
                    <option>文件服务变更</option>
                    <option>系统接入</option>
                </select>
            </div>
            <div class="form-item">
                <label>提交时间</label>
                <div style="display:flex;gap:6px;align-items:center">
                    <input type="date" class="form-control" id="filtDateStart" placeholder="开始日期" style="flex:1">
                    <span style="color:#94a3b8">至</span>
                    <input type="date" class="form-control" id="filtDateEnd" placeholder="结束日期" style="flex:1">
                </div>
            </div>
            <div class="form-item" style="gap:8px">
                <button class="btn btn-primary" onclick="renderApplies()"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default" onclick="resetFilters()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 表格内容区 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-list"></i> 申请列表</div>
            <div class="card-action">
                <a href="javascript:;" onclick="batchSubmit()">批量提交</a>
                <a href="javascript:;" onclick="batchWithdraw()">批量撤回</a>
            </div>
        </div>
        <div class="card-body" style="padding:0">
            <div class="table-wrapper" style="border:none;border-radius:0">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width:40px;text-align:center"><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                            <th>申请单号</th>
                            <th>申请类型</th>
                            <th style="width:100px" class="text-center">目标环境</th>
                            <th>申请标题</th>
                            <th class="text-center">提交时间</th>
                            <th class="text-center">状态</th>
                            <th class="text-center op-col">操作</th>
                        </tr>
                    </thead>
                    <tbody id="applyBody"></tbody>
                </table>
            </div>
        </div>
        <div class="pagination">
            <div class="page-info" id="pageInfo">共 42 条 · 第1页/共5页</div>
            <div class="page-list" id="pageList">
                <button disabled><i class="fa fa-angle-left"></i></button>
                <button class="active" onclick="goToPage(1)">1</button>
                <button onclick="goToPage(2)">2</button>
                <button onclick="goToPage(3)">3</button>
                <button onclick="goToPage(4)">4</button>
                <button onclick="goToPage(5)">5</button>
                <button onclick="goToPage(2)"><i class="fa fa-angle-right"></i></button>
            </div>
        </div>
    </div>

</div>

<script src="../../js/mock-data.js"></script>
<script>
(function () {
    // ====== 工具函数 ======
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function pad3(n) { return n < 10 ? '00' + n : n < 100 ? '0' + n : String(n); }

    // ====== 模拟数据生成（共42条，状态分布：待提交3/待审核8/已通过26/已驳回4/已关闭1） ======
    var statusPlan = [];
    var s;
    for (s = 0; s < 3; s++) statusPlan.push('待提交');
    for (s = 0; s < 8; s++) statusPlan.push('待审核');
    for (s = 0; s < 26; s++) statusPlan.push('已通过');
    for (s = 0; s < 4; s++) statusPlan.push('已驳回');
    statusPlan.push('已关闭');

    var typeCycle = ['接口注册', '接口变更', '接口服务调用', '文件服务订阅', '服务下线', '文件服务注册', '文件服务变更', '系统接入'];
    var typeNameCycle = ['注册申请', '变更申请', '调用申请', '订阅申请', '下线申请', '注册申请', '变更申请', '接入申请'];
    var titleCycle = [
        '客户基本信息查询', '账户余额查询', '反洗钱名单校验', '贷款余额查询',
        '客户对账单文件服务', '交易明细文件服务', '信用评分查询', '支付转账',
        '反欺诈评估服务', '监管报送文件服务', '风险预警文件服务', '核心系统接入',
        '监管报送文件订阅', '交易明细文件订阅', '风险指标文件订阅'
    ];

    // 申请类型 → 目标环境映射（按项目硬约束：不同申请类型对应不同目标环境）
    var envMap = {
        '接口注册': 'SIT',
        '接口变更': 'PROD',
        '接口服务调用': 'SIT',
        '文件服务订阅': 'SIT',
        '服务下线': 'PROD',
        '文件服务注册': 'UAT',
        '文件服务变更': 'PROD',
        '系统接入': 'DEV'
    };

    var applies = [];
    for (var i = 0; i < 42; i++) {
        var status = statusPlan[i];
        var typeIdx = i % typeCycle.length;
        var titleIdx = i % titleCycle.length;
        var dayOffset = Math.floor(i / 2);
        var day = 24 - dayOffset;
        var month = 6;
        if (day < 1) { month = 5; day = 31 + day; }
        var hour = 8 + (i % 10);
        var min = (i * 7) % 60;
        var node;
        if (status === '已通过') node = '已完成';
        else if (status === '已驳回') node = '已驳回';
        else if (status === '待提交') node = '草稿';
        else if (status === '已关闭') node = '已关闭';
        else node = ['业务审核', '技术审核', '安全审核'][i % 3];

        applies.push({
            code: 'APP-2026-' + pad(month) + pad(day) + '-' + pad3(i + 1),
            type: typeCycle[typeIdx],
            typeName: typeNameCycle[typeIdx],
            title: titleCycle[titleIdx] + ' v' + (1 + (i % 4)) + '.' + (i % 10) + ' ' + (i % 2 === 0 ? '新增' : '调整'),
            time: '2026-' + pad(month) + '-' + pad(day) + ' ' + pad(hour) + ':' + pad(min),
            node: node,
            status: status,
            env: envMap[typeCycle[typeIdx]] || '-'
        });
    }

    var tagMap = { '待审核': 'tag-warning', '已通过': 'tag-success', '已驳回': 'tag-danger', '待提交': 'tag-default', '已关闭': 'tag-default', '已撤回': 'tag-default' };

    // ====== 分页与筛选状态 ======
    var currentPage = 1;
    var pageSize = 10;
    var currentTab = 'all';

    // Tab → 状态映射
    var tabStatusMap = {
        all: null, pending: '待提交', audit: '待审核',
        pass: '已通过', reject: '已驳回', closed: '已关闭'
    };


    // ====== 关键词高亮 ======
    function highlight(text, keyword) {
        if (!keyword) return text;
        var escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var reg = new RegExp('(' + escaped + ')', 'gi');
        return text.replace(reg, '<span style="background:#fef3c7;color:#92400e;font-weight:600;border-radius:2px;padding:0 2px">$1</span>');
    }

    // ====== 获取筛选后的数据（Tab状态 + 搜索条件 + 日期范围） ======
    function getFilteredData() {
        var code = document.getElementById('filtCode').value.trim().toLowerCase();
        var title = document.getElementById('filtTitle').value.trim().toLowerCase();
        var type = document.getElementById('filtType').value;
        var dateStart = document.getElementById('filtDateStart') ? document.getElementById('filtDateStart').value : '';
        var dateEnd = document.getElementById('filtDateEnd') ? document.getElementById('filtDateEnd').value : '';
        var tabStatus = tabStatusMap[currentTab];

        return applies.filter(function(a) {
            if (tabStatus) {
                // "已关闭" Tab 同时包含"已关闭"和"已撤回"状态
                if (tabStatus === '已关闭') {
                    if (a.status !== '已关闭' && a.status !== '已撤回') return false;
                } else if (a.status !== tabStatus) {
                    return false;
                }
            }
            if (code && a.code.toLowerCase().indexOf(code) === -1) return false;
            if (title && a.title.toLowerCase().indexOf(title) === -1) return false;
            if (type && a.type !== type) return false;
            if (dateStart && a.time.substring(0, 10) < dateStart) return false;
            if (dateEnd && a.time.substring(0, 10) > dateEnd) return false;
            return true;
        });
    }

    // ====== 渲染表格（含分页） ======
    window.renderApplies = function () {
        var filtered = getFilteredData();
        var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;

        var start = (currentPage - 1) * pageSize;
        var pageData = filtered.slice(start, start + pageSize);

        var codeKw = document.getElementById('filtCode').value.trim();
        var titleKw = document.getElementById('filtTitle').value.trim();

        var body = document.getElementById('applyBody');
        if (pageData.length === 0) {
            body.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8"><i class="fa fa-inbox" style="font-size:32px;color:#cbd5e1;margin-bottom:12px;display:block"></i>暂无符合条件的申请记录</td></tr>';
        } else {
            body.innerHTML = pageData.map(function(a) {
                var isPending = a.status === '待审核';
                var isDraft = a.status === '待提交';
                var withdrawBtn = (isPending || isDraft)
                    ? '<button class="btn btn-sm" style="padding:2px 8px;margin-left:4px;background:#fff;color:#dc2626;border:1px solid #fecaca" onclick="withdrawApply(\'' + a.code + '\')"><i class="fa fa-undo"></i> 撤回申请</button>'
                    : '';
                return '<tr>' +
                    '<td style="text-align:center"><input type="checkbox" class="row-check" data-code="' + a.code + '"></td>' +
                    '<td class="num"><a href="javascript:void(0)" onclick="navTo(\'pages/application/apply-detail.html\',\'申请详情\',{id:\'' + a.code + '\', type:\'' + a.typeName + '\'})" style="color:var(--primary);font-weight:600">' + highlight(a.code, codeKw) + '</a></td>' +
                    '<td><span class="tag tag-info">' + a.type + '</span></td>' +
                    '<td class="text-center"><span class="tag tag-default">' + a.env + '</span></td>' +
                    '<td>' + highlight(a.title, titleKw) + '</td>' +
                    '<td class="text-center">' + a.time + '</td>' +
                    '<td class="text-center"><span class="tag ' + (tagMap[a.status] || 'tag-default') + '" data-status-code="' + a.code + '">' + a.status + '</span></td>' +
                    '<td class="text-center" style="white-space:nowrap">' +
                        '<button class="btn btn-link" style="padding:2px 4px" onclick="navTo(\'pages/application/apply-detail.html\',\'申请详情\',{id:\'' + a.code + '\', type:\'' + a.typeName + '\'})"><i class="fa fa-eye"></i> 查看详情</button>' +
                        '<button class="btn btn-link" style="padding:2px 4px" onclick="navTo(\'pages/application/apply-detail.html\',\'审核进度\',{id:\'' + a.code + '\', tab:\'progress\'})"><i class="fa fa-line-chart"></i> 审核进度</button>' +
                        withdrawBtn +
                    '</td>' +
                '</tr>';
            }).join('');
        }

        // 更新分页信息与按钮
        updatePagination(filtered.length, totalPages);
    };

    // ====== 更新分页器 ======
    function updatePagination(total, totalPages) {
        var info = document.getElementById('pageInfo');
        if (info) {
            info.textContent = '共 ' + total + ' 条 · 第' + currentPage + '页/共' + totalPages + '页';
        }
        var pageList = document.getElementById('pageList');
        if (pageList) {
            var html = '';
            html += '<button onclick="goToPage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '><i class="fa fa-angle-left"></i></button>';
            for (var p = 1; p <= totalPages; p++) {
                html += '<button' + (p === currentPage ? ' class="active"' : '') + ' onclick="goToPage(' + p + ')">' + p + '</button>';
            }
            html += '<button onclick="goToPage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '><i class="fa fa-angle-right"></i></button>';
            pageList.innerHTML = html;
        }
    }

    // ====== Tab 切换 ======
    window.switchApplyTab = function(tab) {
        currentTab = tab;
        currentPage = 1;
        document.querySelectorAll('.tab-item').forEach(function(t) {
            t.classList.toggle('active', t.getAttribute('data-tab') === tab);
        });
        renderApplies();
    };

    // ====== 导出（Demo占位） ======
    window.exportApplies = function() {
        showToast('正在导出申请列表Excel...');
    };

    // ====== 页码跳转 ======
    window.goToPage = function(page) {
        var filtered = getFilteredData();
        var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        currentPage = page;
        renderApplies();
    };

    // ====== 撤回申请（更新状态标签 + Toast提示 + 动态更新Tab计数） ======
    window.withdrawApply = function(code) {
        if (!confirm('确认撤回申请【' + code + '】吗？')) return;
        // 更新数据中的状态
        for (var i = 0; i < applies.length; i++) {
            if (applies[i].code === code) {
                applies[i].status = '已撤回';
                applies[i].node = '已撤回';
                break;
            }
        }
        // 动态更新 Tab 计数（当前 Tab -1，已关闭 Tab +1）
        updateTabCounts();
        // 重新渲染表格（撤回后记录离开当前 Tab 视图）
        renderApplies();
        // 显示 Toast 提示
        showToast('申请已撤回成功');
    };

    // ====== 动态更新 Tab 计数（根据 applies 数据实时计算） ======
    function updateTabCounts() {
        var counts = { all: applies.length, pending: 0, audit: 0, pass: 0, reject: 0, closed: 0 };
        for (var i = 0; i < applies.length; i++) {
            var st = applies[i].status;
            if (st === '待提交') counts.pending++;
            else if (st === '待审核') counts.audit++;
            else if (st === '已通过') counts.pass++;
            else if (st === '已驳回') counts.reject++;
            else if (st === '已关闭' || st === '已撤回') counts.closed++;
        }
        // 更新各 Tab 的计数 span
        document.querySelectorAll('.tab-item').forEach(function(t) {
            var tab = t.getAttribute('data-tab');
            var span = t.querySelector('span');
            if (tab && span && counts.hasOwnProperty(tab)) {
                span.textContent = '(' + counts[tab] + ')';
            }
        });
    }

    // ====== 批量提交（Demo占位） ======
    window.batchSubmit = function() {
        var checked = document.querySelectorAll('.row-check:checked');
        if (checked.length === 0) { showToast('请先勾选要提交的申请'); return; }
        showToast('已批量提交 ' + checked.length + ' 条申请');
    };

    // ====== 批量撤回（Demo占位） ======
    window.batchWithdraw = function() {
        var checked = document.querySelectorAll('.row-check:checked');
        if (checked.length === 0) { showToast('请先勾选要撤回的申请'); return; }
        showToast('已批量撤回 ' + checked.length + ' 条申请');
    };

    // ====== 全选/取消全选 ======
    window.toggleAll = function(checkAll) {
        document.querySelectorAll('.row-check').forEach(function(c) {
            c.checked = checkAll.checked;
        });
    };

    // ====== 重置筛选（仅重置实际存在的元素） ======
    window.resetFilters = function() {
        document.getElementById('filtCode').value = '';
        document.getElementById('filtTitle').value = '';
        document.getElementById('filtType').value = '';
        var ds = document.getElementById('filtDateStart'); if (ds) ds.value = '';
        var de = document.getElementById('filtDateEnd'); if (de) de.value = '';
        currentPage = 1;
        renderApplies();
    };

    // ====== 首次渲染 + 实时搜索 ======
    ['filtCode', 'filtTitle', 'filtDateStart', 'filtDateEnd'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', function() { renderApplies(); });
    });
    renderApplies();
})();

// ====== 统一导航函数 ======
function navTo(url, title, params) {
    var bc = ['首页', '工作台', '我的申请'];
    if (title) bc = ['首页', '工作台', '我的申请', title];
    if (window.govNav) { window.govNav(url, bc, params || {}); return; }
    try {
        if (window.parent && window.parent.governancePlatform && typeof window.parent.governancePlatform.navigate === 'function') {
            window.parent.governancePlatform.navigate(url, bc, params || {});
            return;
        }
    } catch (e) { /* fall through */ }
    var fallback = '../../index.html?nav=' + encodeURIComponent(url);
    if (params && typeof params === 'object') {
        var qs = Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
        if (qs) fallback += '&' + qs;
    }
    try { window.parent.location.href = fallback; } catch(e) { window.location.href = fallback; }
}
</script>
