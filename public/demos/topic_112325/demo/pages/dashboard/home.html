<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页驾驶舱</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        /* ====== 可点击元素视觉反馈 ====== */
        .card-clickable {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .card-clickable:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.15);
            border-color: #bfdbfe;
        }
        .row-clickable {
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .row-clickable:hover {
            background-color: #eff6ff;
            border-radius: 4px;
        }
        .text-link {
            color: #2563eb;
            cursor: pointer;
            font-size: 12px;
        }
        .text-link:hover {
            text-decoration: underline;
            color: #1d4ed8;
        }
        .stat-card {
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #e2e8f0;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
            border-color: #bfdbfe;
        }


        /* ====== 业务域治理情况表格 ====== */
        .domain-table {
            width: 100%;
            border-collapse: separate;
            font-size: 13px;
        }
        .domain-table th {
            text-align: left;
            padding: 8px 10px;
            color: #64748b;
            font-weight: 600;
            font-size: 12px;
            border-bottom: 2px solid #e2e8f0;
            background: #f8fafc;
        }
        .domain-table th.num-col,
        .domain-table td.num-col {
            text-align: right;
        }
        .domain-table td {
            padding: 9px 10px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
        }
        .domain-table tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }
        .domain-table tbody tr:hover {
            background: #eff6ff;
        }
        .rate-bar {
            display: inline-block;
            width: 50px;
            height: 6px;
            background: #f1f5f9;
            border-radius: 3px;
            overflow: hidden;
            vertical-align: middle;
            margin-right: 6px;
        }
        .rate-bar > span {
            display: block;
            height: 100%;
            border-radius: 3px;
        }

        /* ====== 实时预警卡片 ====== */
        .alert-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .alert-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #fff;
        }
        .alert-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
            border-color: #bfdbfe;
        }
        .alert-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .alert-num {
            font-size: 22px;
            font-weight: 700;
            line-height: 1;
        }
        .alert-label {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        /* ====== 变更时间线 ====== */
        .timeline-list {
            position: relative;
            padding-left: 4px;
        }
        .timeline-item {
            position: relative;
            padding: 8px 0 8px 24px;
            border-left: 2px solid #e2e8f0;
        }
        .timeline-item:last-child {
            border-left-color: transparent;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 12px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2563eb;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #2563eb;
        }
        .timeline-item.type-change::before {
            background: #f59e0b;
            box-shadow: 0 0 0 1px #f59e0b;
        }
        .timeline-item.type-register::before {
            background: #10b981;
            box-shadow: 0 0 0 1px #10b981;
        }
        .timeline-item.type-file::before {
            background: #7c3aed;
            box-shadow: 0 0 0 1px #7c3aed;
        }
        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 6px;
        }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-tachometer" style="color:var(--primary);margin-right:8px"></i>首页驾驶舱</h2>
            <div class="page-desc">
                首页 / 首页驾驶舱 - 银行服务治理全景视图 · 数据更新时间：<span id="updateTime"></span>
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="location.reload()"><i class="fa fa-refresh"></i> 刷新数据</button>
        </div>
    </div>

    <!-- ====== 第1行：治理概览指标（4个统一卡片） ====== -->
    <div class="stat-grid" id="statGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px"></div>

    <!-- ====== 第2行：快捷申请 + 实时预警 ====== -->
    <div style="display:grid; grid-template-columns: 2fr 3fr; gap:16px; margin-bottom:16px;">

        <!-- 左列：发起申请快捷入口（纵向排列） -->
        <div class="card" id="card-applyShortcut">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-plus-circle" style="color:#2563eb;margin-right:6px"></i>发起申请</div>
                <div class="card-action">
                    <span class="text-link" onclick="govNav('pages/application/my-apply.html', ['首页', '工作台', '我的申请'], {})">我的申请 →</span>
                </div>
            </div>
            <div class="card-body" id="applyShortcutBody" style="padding:16px 16px 4px"></div>
        </div>

        <!-- 右列：实时预警 -->
        <div class="card" id="card-realtimeAlert">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-bell-o" style="color:#f59e0b;margin-right:6px"></i>实时预警</div>
            </div>
            <div class="card-body" id="realtimeAlertBody" style="padding:16px"></div>
        </div>
    </div>

    <!-- ====== 第3行：业务域治理 + 变更时间线 ====== -->
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px;">

        <!-- 左列：各业务域接口治理情况 -->
        <div class="card" id="card-domainStats">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-sitemap" style="color:#2563eb;margin-right:6px"></i>各业务域接口治理情况 (TOP5)</div>
                <div class="card-action">
                    <span class="text-link" onclick="govNav('pages/category/stats.html', ['首页','治理总览','分类分布总览'], {})">查看全部 →</span>
                </div>
            </div>
            <div class="card-body" id="domainStatsBody" style="padding:8px 16px 16px"></div>
        </div>

        <!-- 右列：最新变更时间线 -->
        <div class="card" id="card-changeTimeline">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-clock-o" style="color:#2563eb;margin-right:6px"></i>最新变更时间线</div>
                <div class="card-action">
                    <span class="text-link" onclick="govNav('pages/logaudit/op-log.html', ['首页','日志审计','操作日志'], {})">查看全部 →</span>
                </div>
            </div>
            <div class="card-body" id="changeTimelineBody" style="padding:12px 20px"></div>
        </div>
    </div>

    <!-- ====== 第4行：常用功能入口（6项） ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-th-large" style="color:#2563eb;margin-right:6px"></i>常用功能入口</div>
        </div>
        <div class="card-body" id="shortcutBody" style="padding:20px 16px"></div>
    </div>

</div>

<script>
/**
 * 统一导航函数：调用父框架的 navigate 方法
 * @param {string} url - 目标页面URL
 * @param {string[]} crumb - 面包屑数组
 * @param {object} params - URL参数对象
 */
function navTo(url, crumb, params) {
    var bc = crumb || [];
    if (window.govNav) { window.govNav(url, bc, params || {}); return; }
    try {
        if (window.parent && window.parent.governancePlatform && typeof window.parent.governancePlatform.navigate === 'function') {
            window.parent.governancePlatform.navigate(url, bc, params || {});
            return;
        }
    } catch (e) { /* fall through */ }
    var fallback = '../../index.html?nav=' + encodeURIComponent(url);
    if (params && typeof params === 'object') {
        var qs = Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
        if (qs) fallback += '&' + qs;
    }
    try { window.parent.location.href = fallback; } catch(e) { window.location.href = fallback; }
}

// ====== 页面标题区：更新时间 ======
(function() {
    var now = new Date();
    var pad = function(n) { return n < 10 ? '0' + n : n; };
    var t = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
              ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    var el = document.getElementById('updateTime');
    if (el) el.textContent = t;
})();

// ====== 第1行：治理概览指标（4个统一卡片） ======
(function() {
    var statConfig = [
        { label: '可调用接口', value: 3981, unit: '', foot: '较上月 +56', trend: 'up', icon: 'fa-plug', style: 'primary',
          url: 'pages/interface/list.html', crumb: ['首页', '服务目录', '接口服务清单'], params: { type: 'API', scope: 'mine' } },
        { label: '可订阅文件服务', value: 826, unit: '', foot: '较上月 +68', trend: 'up', icon: 'fa-file-text-o', style: 'purple',
          url: 'pages/interface/file-list.html', crumb: ['首页', '服务目录', '文件服务清单'], params: {} },
        { label: '待办事项', value: 38, unit: '', foot: '待审批18 + 待审核9 + 待处理8 + 提醒3', trend: 'warn', icon: 'fa-file-text', style: 'orange',
          url: 'pages/workspace/todo.html', crumb: ['首页', '工作台', '待办事项'], params: {} },
        { label: '未读消息', value: 24, unit: '', foot: '较昨日 +5', trend: 'up', icon: 'fa-bell-o', style: 'cyan',
          url: 'pages/workspace/message.html', crumb: ['首页', '工作台', '消息中心'], params: {} }
    ];

    var statGrid = document.getElementById('statGrid');
    if (!statGrid) return;

    var html = '';
    for (var i = 0; i < statConfig.length; i++) {
        var s = statConfig[i];
        var arrowColor = s.trend === 'up' ? '#10b981' : s.trend === 'warn' ? '#d97706' : '#dc2626';
        var bgMap = { primary: '#eff6ff', cyan: '#ecfeff', purple: '#f5f3ff', green: '#ecfdf5', orange: '#fff7ed' };
        var iconBg = bgMap[s.style] || '#eff6ff';
        var styleColor = { primary: '#2563eb', cyan: '#0891b2', purple: '#7c3aed', green: '#10b981', orange: '#d97706' };
        var iconColor = styleColor[s.style] || '#2563eb';

        html += '<div class="stat-card" data-nav-index="' + i + '">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
                '<div style="font-size:13px;color:#64748b;font-weight:500">' + s.label + '</div>' +
                '<div style="width:36px;height:36px;border-radius:8px;background:' + iconBg + ';color:' + iconColor + ';display:flex;align-items:center;justify-content:center;font-size:16px">' +
                    '<i class="fa ' + s.icon + '"></i>' +
                '</div>' +
            '</div>' +
            '<div style="font-size:28px;font-weight:700;color:#1e293b;margin-bottom:8px;line-height:1">' +
                s.value + '<span style="font-size:14px;font-weight:500;color:#64748b;margin-left:4px">' + s.unit + '</span>' +
            '</div>' +
            '<div style="font-size:12px;color:#64748b;display:flex;align-items:center">' +
                '<i class="fa fa-arrow-' + (s.trend === 'up' ? 'up' : s.trend === 'warn' ? 'circle-o-notch' : 'down') + '" style="color:' + arrowColor + ';margin-right:4px;font-size:10px"></i>' +
                s.foot +
            '</div>' +
        '</div>';
    }
    statGrid.innerHTML = html;

    var cards = statGrid.querySelectorAll('.stat-card');
    cards.forEach(function(card, idx) {
        var s = statConfig[idx];
        card.addEventListener('click', function() {
            navTo(s.url, s.crumb, s.params);
        });
    });
})();

// ====== 第2行左：发起申请快捷入口（4项，纵向排列） ======
(function() {
    // 保留：接口注册申请、接口变更申请、文件服务注册申请、文件服务变更申请
    // 移除：系统接入申请、调用权限申请（低频项）
    var applyShortcuts = [
        { title: '接口注册申请',      desc: '新接口注册、提交基本信息并定义接口',     color: '#2563eb', bg: '#eff6ff', icon: 'fa-plus-circle',
          url: 'pages/application/register-apply.html',     crumb: ['首页', '工作台', '我的申请', '接口注册申请'] },
        { title: '接口变更申请',      desc: '已上线接口的字段、版本变更申请',         color: '#d97706', bg: '#fff7ed', icon: 'fa-pencil-square-o',
          url: 'pages/application/change-apply.html',       crumb: ['首页', '工作台', '我的申请', '接口变更申请'] },
        { title: '文件服务注册申请',  desc: '新增文件服务的字段、格式定义',           color: '#7c3aed', bg: '#f5f3ff', icon: 'fa-file-o',
          url: 'pages/application/file-register-apply.html', crumb: ['首页', '工作台', '我的申请', '文件服务注册申请'] },
        { title: '文件服务变更申请',  desc: '已发布文件服务的字段调整、版本更新',     color: '#be185d', bg: '#fdf2f8', icon: 'fa-exchange',
          url: 'pages/application/file-change-apply.html',   crumb: ['首页', '工作台', '我的申请', '文件服务变更申请'] }
    ];
    var body = document.getElementById('applyShortcutBody');
    if (!body) return;

    var html = '<div style="display:grid;grid-template-columns:1fr;gap:10px">';
    for (var i = 0; i < applyShortcuts.length; i++) {
        var s = applyShortcuts[i];
        html += '<div data-apply-index="' + i + '" class="row-clickable" style="display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;transition:all 0.15s"' +
            ' onmouseover="this.style.background=\'' + s.bg + '\';this.style.borderColor=\'' + s.color + '\'"' +
            ' onmouseout="this.style.background=\'#fff\';this.style.borderColor=\'#e2e8f0\'">' +
                '<div style="width:36px;height:36px;border-radius:8px;background:' + s.bg + ';color:' + s.color + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px">' +
                    '<i class="fa ' + s.icon + '"></i>' +
                '</div>' +
                '<div style="flex:1;min-width:0">' +
                    '<div style="font-size:13px;color:#1e293b;font-weight:600;margin-bottom:4px">' + s.title + '</div>' +
                    '<div style="font-size:12px;color:#64748b;line-height:1.5">' + s.desc + '</div>' +
                '</div>' +
            '</div>';
    }
    html += '</div>';
    body.innerHTML = html;

    body.querySelectorAll('[data-apply-index]').forEach(function(row) {
        var idx = parseInt(row.getAttribute('data-apply-index'));
        var s = applyShortcuts[idx];
        row.addEventListener('click', function() {
            navTo(s.url, s.crumb, {});
        });
    });
})();

// ====== 第3行左：各业务域接口治理情况（TOP5表格） ======
(function() {
    var domainData = [
        { name: '个人存款', apiCount: 45, fileCount: 12, rate: 92 },
        { name: '个人贷款', apiCount: 38, fileCount: 8,  rate: 85 },
        { name: '对公业务', apiCount: 52, fileCount: 15, rate: 78 },
        { name: '支付清算', apiCount: 30, fileCount: 6,  rate: 95 },
        { name: '风险管理', apiCount: 28, fileCount: 10, rate: 82 }
    ];

    var body = document.getElementById('domainStatsBody');
    if (!body) return;

    // 根据标准化率返回对应颜色
    function getRateColor(rate) {
        if (rate >= 90) return '#10b981';
        if (rate >= 80) return '#2563eb';
        return '#f59e0b';
    }

    var html = '<table class="domain-table">' +
        '<thead><tr>' +
            '<th>业务域</th>' +
            '<th class="num-col">接口数</th>' +
            '<th class="num-col">文件服务数</th>' +
            '<th>标准化率</th>' +
        '</tr></thead><tbody>';

    for (var i = 0; i < domainData.length; i++) {
        var d = domainData[i];
        var barColor = getRateColor(d.rate);
        html += '<tr data-domain="' + d.name + '">' +
            '<td style="font-weight:600">' + d.name + '</td>' +
            '<td class="num-col">' + d.apiCount + '</td>' +
            '<td class="num-col">' + d.fileCount + '</td>' +
            '<td>' +
                '<span class="rate-bar"><span style="width:' + d.rate + '%;background:' + barColor + '"></span></span>' +
                '<span style="font-size:12px;color:' + barColor + ';font-weight:600">' + d.rate + '%</span>' +
            '</td>' +
        '</tr>';
    }
    html += '</tbody></table>';
    body.innerHTML = html;

    // 每行点击跳转到分类分布总览（带业务域筛选）
    body.querySelectorAll('tr[data-domain]').forEach(function(row) {
        var domain = row.getAttribute('data-domain');
        row.addEventListener('click', function() {
            navTo('pages/category/stats.html', ['首页', '治理总览', '分类分布总览'], { domain: domain });
        });
    });
})();

// ====== 第2行右：实时预警（2×2网格） ======
(function() {
    // 四项预警：SLA超时、僵尸接口、完整性异常、规范告警
    var alertList = [
        { title: 'SLA超时',     count: 3, desc: '接口响应超时', icon: 'fa-clock-o',           color: '#dc2626', bg: '#fee2e2',
          url: 'pages/report/sla-report.html',     crumb: ['首页', '治理总览', 'SLA报表'] },
        { title: '僵尸接口',     count: 5, desc: '长期未调用接口', icon: 'fa-bug',             color: '#f59e0b', bg: '#fef3c7',
          url: 'pages/interface/zombie.html',      crumb: ['首页', '服务治理', '僵尸接口'] },
        { title: '完整性异常',   count: 2, desc: '完整性校验未通过', icon: 'fa-puzzle-piece',   color: '#8b5cf6', bg: '#f5f3ff',
          url: 'pages/integrity/check.html',       crumb: ['首页', '服务治理', '完整性检查'] },
        { title: '规范告警',     count: 8, desc: '不符合标准规范', icon: 'fa-info-circle',     color: '#0284c7', bg: '#e0f2fe',
          url: 'pages/standard/user-query.html',   crumb: ['首页', '标准规范', '规范文档中心'] }
    ];

    var body = document.getElementById('realtimeAlertBody');
    if (!body) return;

    var html = '<div class="alert-grid">';
    for (var i = 0; i < alertList.length; i++) {
        var a = alertList[i];
        html += '<div class="alert-item" data-alert-index="' + i + '">' +
            '<div class="alert-icon" style="background:' + a.bg + ';color:' + a.color + '">' +
                '<i class="fa ' + a.icon + '"></i>' +
            '</div>' +
            '<div style="flex:1;min-width:0">' +
                '<div class="alert-num" style="color:' + a.color + '">' + a.count + '</div>' +
                '<div class="alert-label">' + a.title + ' · ' + a.desc + '</div>' +
            '</div>' +
            '<i class="fa fa-angle-right" style="color:#cbd5e1;font-size:14px"></i>' +
        '</div>';
    }
    html += '</div>';
    body.innerHTML = html;

    // 每项点击跳转到对应页面
    body.querySelectorAll('[data-alert-index]').forEach(function(item) {
        var idx = parseInt(item.getAttribute('data-alert-index'));
        var a = alertList[idx];
        item.addEventListener('click', function() {
            navTo(a.url, a.crumb, {});
        });
    });
})();

// ====== 第3行右：最新变更时间线（5条） ======
(function() {
    // 近5条接口/文件变更记录
    var changeList = [
        { time: '2026-06-24 10:30', type: '接口变更', typeName: 'change',   service: 'ACC-QUERY-001 账户余额查询',  summary: '新增返回字段',
          badgeColor: '#f59e0b', badgeBg: '#fff7ed' },
        { time: '2026-06-24 09:15', type: '文件变更', typeName: 'file',     service: 'FILE-DEP-0023 交易明细文件',  summary: 'v1.2→v1.3',
