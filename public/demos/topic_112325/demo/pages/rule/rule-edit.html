<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>规则编辑 - 规则引擎管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-pencil-square-o" style="color:var(--primary);margin-right:8px"></i><span id="page-title">接口命名格式校验 - 规则编辑</span></h2>
            <div class="page-desc">
                首页 / 规则引擎管理 / 规则编辑 - 编辑规则的基础信息、适用范围及校验逻辑
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="govNav('pages/rule/rule-list.html', ['首页', '规则引擎管理', '规则管理'], {})"><i class="fa fa-arrow-left"></i> 返回列表</button>
            <button class="btn btn-default" onclick="resetForm()"><i class="fa fa-refresh"></i> 重置</button>
            <button class="btn btn-primary" onclick="saveRule()"><i class="fa fa-save"></i> 保存</button>
        </div>
    </div>

    <!-- ====== 基本信息 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-info-circle" style="color:var(--primary);margin-right:6px"></i>基本信息</div>
        </div>
        <div class="card-body">
            <div class="form-row" style="grid-template-columns:repeat(2,1fr)">
                <div class="form-item">
                    <label>规则编码</label>
                    <input class="form-control" id="ruleCode" value="R-FMT-0001" readonly style="background:#f8fafc">
                </div>
                <div class="form-item">
                    <label>规则名称</label>
                    <input class="form-control" id="ruleName" value="接口命名格式校验">
                </div>
                <div class="form-item">
                    <label>规则类型</label>
                    <select class="form-control" id="ruleType">
                        <option selected>校验规则</option>
                        <option>审核规则</option>
                        <option>完整性规则</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>规则分类</label>
                    <select class="form-control" id="ruleCategory">
                        <option>格式校验</option>
                        <option>标准合规</option>
                        <option>业务规则</option>
                        <option>关联关系</option>
                        <option>文件完整性</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>严重程度</label>
                    <select class="form-control" id="ruleSeverity">
                        <option>阻断</option>
                        <option selected>警告</option>
                        <option>提示</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>当前版本</label>
                    <input class="form-control" id="ruleVersion" value="v3.2" readonly style="background:#f8fafc">
                </div>
                <div class="form-item" style="grid-column:span 2">
                    <label>规则描述</label>
                    <textarea class="form-control" id="ruleDesc" rows="3">校验接口命名是否符合 RESTful 规范，使用小驼峰命名法，前缀必须符合标准业务域定义。</textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 适用范围 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-sitemap" style="color:var(--primary);margin-right:6px"></i>适用范围</div>
        </div>
        <div class="card-body">
            <div class="form-row" style="grid-template-columns:repeat(2,1fr)">
                <div class="form-item">
                    <label>适用业务域</label>
                    <select class="form-control" id="ruleTarget">
                        <option selected>所有接口</option>
                        <option>接口报文</option>
                        <option>接口入参</option>
                        <option>接口出参</option>
                        <option>文件服务</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>例外白名单（可选）</label>
                    <input class="form-control" id="ruleWhitelist" placeholder="多个以逗号分隔，如：OA,HR">
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 规则逻辑 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-code" style="color:var(--primary);margin-right:6px"></i>规则逻辑</div>
        </div>
        <div class="card-body">
            <div class="form-item">
                <label>校验表达式（正则 / 脚本）</label>
                <textarea class="form-control" id="ruleExpression" rows="8" style="font-family:'Consolas','Monaco',monospace;font-size:13px;line-height:1.6">^[a-z][a-z0-9]*([A-Z][a-z0-9]*)*$
// 匹配规则：
// 1. 以小写字母开头
// 2. 使用小驼峰（camelCase）命名
// 3. 仅允许字母和数字
// 4. 不可使用特殊字符或连续大写</textarea>
            </div>
            <div class="form-item">
                <label>命中提示文案</label>
                <input class="form-control" id="ruleHitMsg" value="接口命名不符合小驼峰规范，请修正。">
            </div>
        </div>
    </div>

    <!-- ====== 规则测试 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-flask" style="color:var(--primary);margin-right:6px"></i>规则测试</div>
        </div>
        <div class="card-body">
            <div class="form-item">
                <label>测试数据（输入模拟数据，每行一条）</label>
                <textarea class="form-control" id="testData" rows="5" style="font-family:'Consolas','Monaco',monospace;font-size:13px" placeholder="例如：&#10;crm.customer.getInfo&#10;CustomerInfo&#10;getOrderList"></textarea>
            </div>
            <div style="margin-top:12px">
                <button class="btn btn-primary" onclick="runRuleTest()"><i class="fa fa-play"></i> 执行测试</button>
                <button class="btn btn-default" onclick="clearTestResult()"><i class="fa fa-eraser"></i> 清空结果</button>
            </div>
            <!-- 测试结果区 -->
            <div id="testResult" style="display:none;margin-top:16px;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden">
                <div style="padding:10px 16px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-weight:600;color:#334155">
                    <i class="fa fa-terminal"></i> 测试结果
                </div>
                <div id="testResultBody" style="padding:14px 16px;font-size:13px;line-height:2;font-family:'Consolas','Monaco',monospace">
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    /* ============================================================
     * 规则编辑页面逻辑
     * 支持：新建模式(mode=new)、编辑模式(name=xxx)、保存、重置、规则测试
     * ============================================================ */

    /** 表单字段 id 列表（用于快照保存/恢复） */
    var FORM_FIELD_IDS = ['ruleCode', 'ruleName', 'ruleType', 'ruleCategory', 'ruleSeverity', 'ruleVersion', 'ruleDesc', 'ruleTarget', 'ruleWhitelist', 'ruleExpression', 'ruleHitMsg'];

    /** 规则数据源（扩展字段用于编辑页回填） */
    var RULES = [
        { code: 'R-FMT-0001', name: '接口命名格式校验', type: '校验规则', category: '格式校验', severity: '阻断', version: 'v3.2', target: '所有接口', desc: '校验接口命名是否符合 RESTful 规范，使用小驼峰命名法，前缀必须符合标准业务域定义。', expression: "^[a-z][a-z0-9]*([A-Z][a-z0-9]*)*$\n// 匹配规则：\n// 1. 以小写字母开头\n// 2. 使用小驼峰（camelCase）命名\n// 3. 仅允许字母和数字\n// 4. 不可使用特殊字符或连续大写", hitMsg: '接口命名不符合小驼峰规范，请修正。' },
        { code: 'R-FMT-0002', name: '字段命名小驼峰校验', type: '校验规则', category: '格式校验', severity: '警告', version: 'v2.1', target: '接口报文', desc: '校验接口请求/响应字段是否采用小驼峰命名，禁止下划线或连续大写。', expression: "^[a-z][a-zA-Z0-9]*$", hitMsg: '字段命名不符合小驼峰规范，请修正。' },
        { code: 'R-STD-0003', name: '返回码标准合规检查', type: '校验规则', category: '标准合规', severity: '阻断', version: 'v4.0', target: '接口出参', desc: '校验返回码是否符合行内统一返回码标准，成功/失败/异常码需在标准码表范围内。', expression: "^([0-9]{4}|E[0-9]{4})$", hitMsg: '返回码不在标准码表范围内。' },
        { code: 'R-STD-0004', name: '数据字典引用合规', type: '校验规则', category: '标准合规', severity: '警告', version: 'v1.3', target: '接口字段', desc: '校验枚举类型字段是否引用已发布的数据字典，避免硬编码枚举值。', expression: "DICT_[A-Z_]+", hitMsg: '字段未引用标准数据字典。' },
        { code: 'R-BIZ-0005', name: '敏感字段脱敏检查', type: '审核规则', category: '业务规则', severity: '阻断', version: 'v1.5', target: '接口出参', desc: '检查身份证号、手机号、银行卡号等敏感字段在响应中是否已脱敏处理。', expression: "(idCard|mobile|cardNo).*masked", hitMsg: '敏感字段未脱敏，存在数据泄露风险。' },
        { code: 'R-BIZ-0006', name: '接口幂等性要求', type: '审核规则', category: '业务规则', severity: '警告', version: 'v2.0', target: '写操作接口', desc: '写操作接口需实现幂等控制，避免重复提交导致业务异常。', expression: "idempotent.*true", hitMsg: '写操作接口未声明幂等控制。' },
        { code: 'R-BIZ-0007', name: '超时时间设置检查', type: '审核规则', category: '业务规则', severity: '提示', version: 'v1.2', target: '接口配置', desc: '校验核心链路接口超时时间设置是否合理，建议不超过 3000ms。', expression: "timeout.*(\\d+)", hitMsg: '接口超时时间设置不合理。' },
        { code: 'R-REL-0008', name: '输入输出字段关联校验', type: '校验规则', category: '关联关系', severity: '警告', version: 'v2.3', target: '接口报文', desc: '校验接口输入字段与输出字段的关联关系是否完整，避免无关联的孤立字段。', expression: "input.*output", hitMsg: '输入输出字段缺少关联映射。' },
        { code: 'R-REL-0009', name: '主外键引用一致性', type: '校验规则', category: '关联关系', severity: '阻断', version: 'v1.8', target: '接口字段', desc: '校验数据模型中主外键引用关系在接口字段中是否保持一致。', expression: "FK_[A-Z_]+", hitMsg: '外键引用关系不一致。' },
        { code: 'R-INT-0010', name: '必填字段完整性校验', type: '完整性规则', category: '完整性', severity: '阻断', version: 'v2.8', target: '接口入参', desc: '校验接口必填字段是否完整，避免空值或缺失关键字段导致业务异常。', expression: "required.*true", hitMsg: '必填字段缺失。' },
        { code: 'R-INT-0011', name: '接口文档完整性', type: '完整性规则', category: '完整性', severity: '警告', version: 'v1.6', target: '接口元数据', desc: '校验接口文档、字段说明、示例报文是否完整。', expression: "doc.*complete", hitMsg: '接口文档不完整。' },
        { code: 'R-FILE-0012', name: '文件命名规范校验', type: '校验规则', category: '格式校验', severity: '阻断', version: 'v2.2', target: '文件服务', desc: '校验文件命名是否符合统一命名规范。', expression: "filename_std", hitMsg: '文件命名不符合规范。' },
        { code: 'R-FILE-0013', name: '文件编码格式检查', type: '校验规则', category: '格式校验', severity: '警告', version: 'v1.4', target: '文件服务', desc: '校验文件编码是否为 UTF-8。', expression: "encoding.*UTF-8", hitMsg: '文件编码格式不正确。' },
        { code: 'R-FILE-0014', name: 'CSV分隔符合规', type: '校验规则', category: '标准合规', severity: '提示', version: 'v1.0', target: '文件服务', desc: '校验 CSV 文件是否使用指定分隔符。', expression: "delimiter.*,", hitMsg: 'CSV 分隔符不符合规范。' },
        { code: 'R-FILE-0015', name: '文件目录规范检查', type: '审核规则', category: '业务规则', severity: '警告', version: 'v1.1', target: '文件服务', desc: '校验文件存放目录是否符合行内目录规范。', expression: "/data/files/[A-Z_]+", hitMsg: '文件目录不符合规范。' },
        { code: 'R-FILE-0016', name: '文件MD5完整性校验', type: '完整性规则', category: '完整性', severity: '阻断', version: 'v3.0', target: '文件服务', desc: '校验文件 MD5 校验值是否匹配，防止传输损坏。', expression: "md5.*match", hitMsg: '文件 MD5 校验失败。' },
        { code: 'R-SEC-0017', name: '敏感信息明文传输检查', type: '审核规则', category: '业务规则', severity: '阻断', version: 'v2.4', target: '所有接口', desc: '检查敏感信息是否通过明文传输。', expression: "sensitive.*plaintext", hitMsg: '敏感信息存在明文传输风险。' },
        { code: 'R-SEC-0018', name: 'HTTPS协议要求', type: '校验规则', category: '标准合规', severity: '阻断', version: 'v2.6', target: '外部接口', desc: '校验外部接口是否使用 HTTPS 协议。', expression: "^https://", hitMsg: '外部接口未使用 HTTPS。' },
        { code: 'R-PERF-0019', name: '接口响应时间规范', type: '审核规则', category: '业务规则', severity: '警告', version: 'v1.7', target: '在线接口', desc: '校验接口响应时间是否符合 SLA 要求。', expression: "responseTime.*<.*3000", hitMsg: '接口响应时间超出规范。' },
        { code: 'R-DEP-0020', name: '循环依赖检测', type: '完整性规则', category: '关联关系', severity: '阻断', version: 'v1.9', target: '接口依赖', desc: '检测接口间是否存在循环依赖。', expression: "circularDependency.*false", hitMsg: '检测到接口循环依赖。' }
    ];

    /** 获取 URL 参数 */
    function getParam(key) {
        var params = new URLSearchParams(window.location.search);
        return params.get(key);
    }

    /** 保存表单快照（用于重置功能） */
    var formSnapshot = {};

    function saveFormSnapshot() {
        FORM_FIELD_IDS.forEach(function (id) {
            var el = document.getElementById(id);
            if (el) {
                if (el.tagName === 'SELECT') {
                    formSnapshot[id] = el.selectedIndex;
                } else {
                    formSnapshot[id] = el.value;
                }
            }
        });
        // 保存 readonly 状态
        var codeEl = document.getElementById('ruleCode');
        if (codeEl) formSnapshot._codeReadonly = codeEl.readOnly;
        var verEl = document.getElementById('ruleVersion');
        if (verEl) formSnapshot._verReadonly = verEl.readOnly;
    }

    /** 恢复表单快照 */
    function restoreFormSnapshot() {
        FORM_FIELD_IDS.forEach(function (id) {
            var el = document.getElementById(id);
            if (el && formSnapshot[id] !== undefined) {
                if (el.tagName === 'SELECT') {
                    el.selectedIndex = formSnapshot[id];
                } else {
                    el.value = formSnapshot[id];
                }
            }
        });
        var codeEl = document.getElementById('ruleCode');
        if (codeEl) codeEl.readOnly = formSnapshot._codeReadonly;
        var verEl = document.getElementById('ruleVersion');
        if (verEl) verEl.readOnly = formSnapshot._verReadonly;
    }

    /** 新建模式：清空表单，规则编码可编辑 */
    function enterNewMode() {
        var titleEl = document.getElementById('page-title');
        if (titleEl) titleEl.textContent = '新增规则';
        document.title = '新增规则 - 规则编辑';

        // 清空表单
        FORM_FIELD_IDS.forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            if (el.tagName === 'SELECT') {
                el.selectedIndex = 0;
            } else {
                el.value = '';
            }
        });

        // 规则编码可编辑
        var codeEl = document.getElementById('ruleCode');
        if (codeEl) {
            codeEl.readOnly = false;
            codeEl.style.background = '#fff';
            codeEl.placeholder = '请输入规则编码，如 R-FMT-0020';
        }

        // 版本显示"新建"
        var verEl = document.getElementById('ruleVersion');
        if (verEl) {
            verEl.value = '新建';
            verEl.readOnly = true;
        }

        // 如果有 template 参数，预填模板数据
        var template = getParam('template');
        if (template) {
            if (codeEl) codeEl.value = template;
            var nameEl = document.getElementById('ruleName');
            if (nameEl) nameEl.value = '基于 ' + template + ' 创建的规则';
        }

        // 保存新建模式的快照（用于重置）
        saveFormSnapshot();
    }

    /** 编辑模式：根据 code/name 参数回填规则数据 */
    function enterEditMode() {
        var code = getParam('code');
        var name = getParam('name');
        var rule = RULES[0];
        if (code) {
            rule = RULES.find(function (r) { return r.code === code; }) || RULES[0];
        } else if (name) {
            rule = RULES.find(function (r) { return r.name === name; }) || RULES[0];
        }
        var titleEl = document.getElementById('page-title');
        if (titleEl) titleEl.textContent = rule.name + ' - 规则编辑';
        document.title = rule.name + ' - 规则编辑';

        // 回填表单
        setField('ruleCode', rule.code);
        setField('ruleName', rule.name);
        setSelect('ruleType', rule.type);
        setSelect('ruleCategory', rule.category);
        setSelect('ruleSeverity', rule.severity);
        setField('ruleVersion', rule.version);
        setField('ruleDesc', rule.desc);
        setSelect('ruleTarget', rule.target);
        setField('ruleExpression', rule.expression);
        setField('ruleHitMsg', rule.hitMsg);

        // 保存编辑模式的快照
        saveFormSnapshot();
    }

    function setField(id, value) {
        var el = document.getElementById(id);
        if (el) el.value = value || '';
    }
    function setSelect(id, value) {
        var el = document.getElementById(id);
        if (!el) return;
        var matched = false;
        for (var i = 0; i < el.options.length; i++) {
            if (el.options[i].text === value || el.options[i].value === value) {
                el.selectedIndex = i;
                matched = true;
                break;
            }
        }
        if (!matched && value) {
            // 若未匹配，追加一个选项
            var opt = document.createElement('option');
            opt.text = value;
            opt.value = value;
            el.add(opt);
            el.selectedIndex = el.options.length - 1;
        }
    }

    /** 保存规则 */
    function saveRule() {
        // 简单校验
        var nameEl = document.getElementById('ruleName');
        if (nameEl && !nameEl.value.trim()) {
            showToast('请填写规则名称', 'warning');
            return;
        }
        var codeEl = document.getElementById('ruleCode');
        if (codeEl && !codeEl.value.trim()) {
            showToast('请填写规则编码', 'warning');
            return;
        }

        showToast('规则保存成功', 'success');
        // 1.5 秒后返回列表
        setTimeout(function () {
            govNav('pages/rule/rule-list.html', ['首页', '规则引擎管理', '规则管理'], {});
        }, 1500);
    }

    /** 重置表单到初始状态 */
    function resetForm() {
        restoreFormSnapshot();
        showToast('已重置为初始内容');
    }

    /** 执行规则测试 */
    function runRuleTest() {
        var dataEl = document.getElementById('testData');
        if (!dataEl || !dataEl.value.trim()) {
            showToast('请输入测试数据', 'warning');
            return;
        }

        showToast('正在执行规则测试...');

        // 读取测试数据（按行分割）
        var lines = dataEl.value.trim().split('\n').filter(function (l) { return l.trim(); });

        // 读取正则表达式（取第一行，忽略注释行）
        var exprEl = document.getElementById('ruleExpression');
        var exprText = exprEl ? exprEl.value : '';
        var regexLine = exprText.split('\n').find(function (l) { return l.trim() && !l.trim().startsWith('//'); });
        var hitMsg = (document.getElementById('ruleHitMsg') || {}).value || '规则命中';

        // 模拟测试执行
        var resultHtml = '';
        var hitCount = 0;
        lines.forEach(function (line, idx) {
            var data = line.trim();
            var isHit = false;
            // 尝试使用正则匹配
            if (regexLine) {
                try {
                    var regex = new RegExp(regexLine.trim());
                    isHit = !regex.test(data);
                } catch (e) {
                    // 正则无效时，模拟部分命中
                    isHit = (idx % 2 === 1);
                }
            } else {
                isHit = (idx % 2 === 1);
            }

            if (isHit) hitCount++;
            var icon = isHit
                ? '<i class="fa fa-times-circle" style="color:#dc2626"></i>'
                : '<i class="fa fa-check-circle" style="color:#16a34a"></i>';
            var status = isHit
                ? '<span style="color:#dc2626;font-weight:600">命中</span> <span style="color:#991b1b">— ' + hitMsg + '</span>'
                : '<span style="color:#16a34a;font-weight:600">未命中</span>';
            resultHtml += '<div>' + icon + ' ' + data + ' → ' + status + '</div>';
        });

        resultHtml += '<div style="margin-top:10px;padding-top:10px;border-top:1px dashed #e2e8f0;color:#64748b">共测试 ' + lines.length + ' 条数据，命中 ' + hitCount + ' 条</div>';

        var resultBox = document.getElementById('testResult');
        var resultBody = document.getElementById('testResultBody');
        if (resultBox) resultBox.style.display = '';
        if (resultBody) resultBody.innerHTML = resultHtml;
    }

    /** 清空测试结果 */
    function clearTestResult() {
        var dataEl = document.getElementById('testData');
        if (dataEl) dataEl.value = '';
        var resultBox = document.getElementById('testResult');
        if (resultBox) resultBox.style.display = 'none';
        var resultBody = document.getElementById('testResultBody');
        if (resultBody) resultBody.innerHTML = '';
        showToast('已清空测试数据和结果');
    }

    /* ============================================================
     * 初始化
     * ============================================================ */
    (function init() {
        var mode = getParam('mode');
        if (mode === 'new') {
            enterNewMode();
        } else {
            enterEditMode();
        }
    })();
</script>
</body>
</html>
