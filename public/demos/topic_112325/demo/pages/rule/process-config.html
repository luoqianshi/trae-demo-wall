/** 确认创建流程，进入画布视图 */
function confirmCreateFlow() {
    var name = $('new-flow-name').value.trim();
    if (!name) {
        showToast('请输入流程名称', 'error');
        return;
    }
    var businessType = $('new-flow-type').value;
    var desc = $('new-flow-desc').value.trim();
    var defaultData = buildDefaultFlowData(businessType);
    var flow = {
        id: genFlowId(),
        name: name,
        businessType: businessType,
        desc: desc,
        status: 'draft',
        version: 1,
        updatedAt: formatDate(new Date()),
        nodes: defaultData.nodes,
        connections: defaultData.connections
    };
    FLOWS.push(flow);
    hideModal();
    showCanvasView(flow.id);
    showToast('流程「' + name + '」已创建，请编排节点', 'success');
}

/** 根据业务类型生成默认流程数据（节点 + 连接关系） */
function buildDefaultFlowData(businessType) {
    var startId = genNodeId();
    var endId = genNodeId();
    var baseStart = { id: startId, type: 'start', name: '提交', x: 100, y: 200, allowWithdraw: true, withdrawLimit: 24, withdrawUnit: '小时' };
    var baseEnd = { id: endId, type: 'end', name: '结束', x: 280, y: 200 };
    var nodes, connections;

    if (businessType === 'apiCall') {
        var n2 = genNodeId(), n3 = genNodeId(), n4 = genNodeId(), n5 = genNodeId();
        nodes = [
            baseStart,
            { id: n2, type: 'approval', name: '技术审核', code: genApprovalCode(), x: 280, y: 200, approverType: '角色', approver: '技术审核员', method: '单人审批', timeout: 24, timeoutUnit: '小时', timeoutAction: '转上级', desc: '审核调用技术可行性', operations: getDefaultOperations() },
            { id: n3, type: 'approval', name: '业务审核', code: genApprovalCode(), x: 460, y: 200, approverType: '角色', approver: '业务审核员', method: '单人审批', timeout: 24, timeoutUnit: '小时', timeoutAction: '通知提醒', desc: '审核业务必要性', operations: getDefaultOperations() },
            { id: n4, type: 'approval', name: '安全审核', code: genApprovalCode(), x: 640, y: 200, approverType: '角色', approver: '安全审核员', method: '单人审批', timeout: 24, timeoutUnit: '小时', timeoutAction: '转上级', desc: '审核调用安全性', operations: getDefaultOperations() },
            { id: n5, type: 'approval', name: '最终核准', code: genApprovalCode(), x: 820, y: 200, approverType: '角色', approver: '最终核准人', method: '会签', timeout: 48, timeoutUnit: '小时', timeoutAction: '通知提醒', desc: '', operations: getDefaultOperations() },
            { id: endId, type: 'end', name: '结束', x: 1000, y: 200 }
        ];
    } else if (businessType === 'fileSubscription') {
        var m2 = genNodeId(), m3 = genNodeId(), m4 = genNodeId(), m5 = genNodeId(), m6 = genNodeId();
        nodes = [
            baseStart,
            { id: m2, type: 'approval', name: '技术审核', code: genApprovalCode(), x: 280, y: 200, approverType: '角色', approver: '技术审核员', method: '单人审批', timeout: 24, timeoutUnit: '小时', timeoutAction: '转上级', desc: '审核订阅技术可行性', operations: getDefaultOperations() },
            { id: m3, type: 'approval', name: '合规审核', code: genApprovalCode(), x: 460, y: 200, approverType: '角色', approver: '合规审核员', method: '单人审批', timeout: 24, timeoutUnit: '小时', timeoutAction: '转上级', desc: '审核订阅合规性', operations: getDefaultOperations() },
            { id: m4, type: 'approval', name: '业务审核', code: genApprovalCode(), x: 640, y: 200, approverType: '角色', approver: '业务审核员', method: '单人审批', timeout: 24, timeoutUnit: '小时', timeoutAction: '通知提醒', desc: '审核业务必要性', operations: getDefaultOperations() },
            { id: m5, type: 'approval', name: '安全审核', code: genApprovalCode(), x: 820, y: 200, approverType: '角色', approver: '安全审核员', method: '单人审批', timeout: 24, timeoutUnit: '小时', timeoutAction: '转上级', desc: '审核订阅安全性', operations: getDefaultOperations() },
            { id: m6, type: 'approval', name: '最终核准', code: genApprovalCode(), x: 1000, y: 200, approverType: '角色', approver: '最终核准人', method: '会签', timeout: 48, timeoutUnit: '小时', timeoutAction: '通知提醒', desc: '', operations: getDefaultOperations() },
            { id: endId, type: 'end', name: '结束', x: 1180, y: 200 }
        ];
    } else {
        nodes = [baseStart, baseEnd];
    }

    connections = [];
    for (var i = 0; i < nodes.length - 1; i++) {
        connections.push({ from: nodes[i].id, to: nodes[i + 1].id });
    }
    return { nodes: nodes, connections: connections };
}

/** 保存草稿 */
function onSaveDraft() {
    var flow = getCurrentFlow();
    if (!flow) {
        showToast('请先选择流程', 'warning');
        return;
    }
    flow.status = 'draft';
    flow.updatedAt = formatDate(new Date());
    renderFlowList();
    updateFlowInfo();
    showToast('草稿已保存', 'success');
}

/** 发布流程（含完整性校验） */
function onPublishFlow() {
    var flow = getCurrentFlow();
    if (!flow) {
        showToast('请先选择流程', 'warning');
        return;
    }
    var error = validateFlow(flow);
    if (error) {
        showToast(error, 'error');
        return;
    }
    flow.status = 'published';
    flow.updatedAt = formatDate(new Date());
    renderFlowList();
    updateFlowInfo();
    showToast('流程「' + flow.name + '」已发布', 'success');
}

/** 校验流程完整性 */
function validateFlow(flow) {
    var startCount = 0, endCount = 0;
    for (var i = 0; i < flow.nodes.length; i++) {
        if (flow.nodes[i].type === 'start') startCount++;
        if (flow.nodes[i].type === 'end') endCount++;
    }
    if (startCount === 0) return '缺少开始节点';
    if (startCount > 1) return '只能有1个开始节点';
    if (endCount === 0) return '缺少结束节点';
    if (endCount > 1) return '只能有1个结束节点';
    if (flow.connections.length === 0) return '请至少创建1条连接线';
    var connectedNodes = {};
    for (var k = 0; k < flow.connections.length; k++) {
        connectedNodes[flow.connections[k].from] = true;
        connectedNodes[flow.connections[k].to] = true;
    }
    for (var m = 0; m < flow.nodes.length; m++) {
        if (!connectedNodes[flow.nodes[m].id]) {
            return '节点「' + flow.nodes[m].name + '」未连接到流程中';
        }
    }
    for (var j = 0; j < flow.nodes.length; j++) {
        var node = flow.nodes[j];
        if (node.type === 'approval' && !node.approver) {
            return '节点「' + node.name + '」未配置审批人';
        }
    }
    return null;
}

/** 预览流程（支持传入flowId从列表预览） */
function onPreviewFlow(flowId) {
    var flow = flowId ? findFlowById(flowId) : getCurrentFlow();
    if (!flow) {
        showToast('请先选择流程', 'warning');
        return;
    }
    var body = buildPreviewContent(flow);
    var footer = '<button class="btn btn-default" onclick="hideModal()">关闭</button>';
    var version = flow.version || 1;
    showModal('流程预览 · ' + flow.name + ' V' + version, body, footer);
}

/** 构建预览内容HTML */
function buildPreviewContent(flow) {
    var ordered = orderNodes(flow);
    var version = flow.version || 1;
    var html = '<div style="margin-bottom:16px">' +
        '<span class="tag ' + (flow.status === 'published' ? 'tag-success' : 'tag-warning') + '">' + getStatusText(flow.status) + '</span>' +
        '<span style="margin-left:8px;font-size:12px;font-weight:600;color:var(--primary);background:#eff6ff;border:1px solid #bfdbfe;padding:1px 8px;border-radius:4px">V' + version + '</span>' +
        '<span style="margin-left:12px;color:var(--text-secondary);font-size:13px">节点数：' + flow.nodes.length + ' | 连接数：' + flow.connections.length + '</span>' +
    '</div>';
    html += '<div class="preview-flow">';
    for (var i = 0; i < ordered.length; i++) {
        var node = ordered[i];
        html += buildPreviewNode(node);
        if (i < ordered.length - 1) {
            html += '<i class="fa fa-long-arrow-right preview-arrow"></i>';
        }
    }
    html += '</div>';
    html += '<div style="margin-top:24px"><h4 style="font-size:14px;margin-bottom:12px"><i class="fa fa-list" style="color:var(--primary)"></i> 节点详情</h4>';
    html += '<table class="data-table"><thead><tr><th>节点名称</th><th>类型</th><th>审批人</th><th>审批方式</th><th>超时</th><th>超时处理</th></tr></thead><tbody>';
    for (var j = 0; j < flow.nodes.length; j++) {
        var n = flow.nodes[j];
        html += '<tr>' +
            '<td><strong>' + escapeHtml(n.name) + '</strong></td>' +
            '<td>' + NODE_TYPE_CONFIG[n.type].name + '</td>' +
            '<td>' + escapeHtml(n.approver || '-') + '</td>' +
            '<td>' + escapeHtml(n.method || '-') + '</td>' +
            '<td>' + (n.timeout ? n.timeout + n.timeoutUnit : '-') + '</td>' +
            '<td>' + escapeHtml(n.timeoutAction || '-') + '</td>' +
        '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
}

/** 构建预览节点HTML */
function buildPreviewNode(node) {
    var config = NODE_TYPE_CONFIG[node.type];
    var info = '';
    if (node.type === 'approval') {
        info = '<div class="pn-info">' + escapeHtml(node.approver || '') + '</div>' +
               '<div class="pn-info">' + escapeHtml(node.method || '') + ' · ' + (node.timeout || '') + (node.timeoutUnit || '') + '</div>';
    }
    return '<div class="preview-node ' + node.type + '">' +
        '<div class="pn-icon"><i class="fa ' + config.icon + '"></i></div>' +
        '<div class="pn-name">' + escapeHtml(node.name) + '</div>' +
        info + '</div>';
}

/** 按连接关系排序节点（从开始节点出发） */
function orderNodes(flow) {
    var startNode = null;
    for (var i = 0; i < flow.nodes.length; i++) {
        if (flow.nodes[i].type === 'start') { startNode = flow.nodes[i]; break; }
    }
    if (!startNode) return flow.nodes.slice();
    var ordered = [startNode];
    var current = startNode;
    var visited = {};
    visited[current.id] = true;
    while (current) {
        var next = null;
        for (var j = 0; j < flow.connections.length; j++) {
            if (flow.connections[j].from === current.id && !visited[flow.connections[j].to]) {
                next = findNode(flow, flow.connections[j].to);
                break;
            }
        }
        if (next) {
            ordered.push(next);
            visited[next.id] = true;
            current = next;
        } else {
            current = null;
        }
    }
    return ordered;
}

/** 从列表复制流程（按flowId） */
function copyFlowFromList(flowId) {
    var flow = findFlowById(flowId);
    if (!flow) {
        showToast('请先选择要复制的流程', 'warning');
        return;
    }
    var newFlow = JSON.parse(JSON.stringify(flow));
    newFlow.id = genFlowId();
    newFlow.name = flow.name + ' (副本)';
    newFlow.status = 'draft';
    newFlow.version = 1;
    newFlow.updatedAt = formatDate(new Date());
    var idMap = {};
    for (var i = 0; i < newFlow.nodes.length; i++) {
        var oldId = newFlow.nodes[i].id;
        var newId = genNodeId();
        idMap[oldId] = newId;
        newFlow.nodes[i].id = newId;
        if (newFlow.nodes[i].code) newFlow.nodes[i].code = genApprovalCode();
    }
    for (var j = 0; j < newFlow.connections.length; j++) {
        newFlow.connections[j].from = idMap[newFlow.connections[j].from];
        newFlow.connections[j].to = idMap[newFlow.connections[j].to];
    }
    FLOWS.push(newFlow);
    renderFlowList();
    showToast('流程「' + flow.name + '」已复制', 'success');
}

/** 复制当前流程（画布视图中使用） */
function onCopyFlow() {
    var flow = getCurrentFlow();
    if (!flow) {
        showToast('请先选择要复制的流程', 'warning');
        return;
    }
    copyFlowFromList(flow.id);
}

/* ================================================================
 * 默认流程配置（弹窗）
 * ================================================================ */

/** 渲染单个默认流程配置项 */
function buildDefaultConfigItem(key, cfg) {
    return '<div class="dc-modal-item">' +
        '<div class="dc-label"><i class="fa ' + cfg.icon + '"></i>' + cfg.label + '</div>' +
        '<select class="dc-select" id="dc-select-' + key + '">' + buildPublishedFlowOptions(cfg.flowId) + '</select>' +
        '</div>';
}

/** 打开默认流程配置弹窗 */
function openDefaultConfigModal() {
    var body = '' +
    '<div class="dc-modal-tip">' +
        '<i class="fa fa-info-circle"></i>' +
        '<span>服务类申请按风险等级统一匹配通用审批流程；系统接入等不适用风险等级的业务单独配置。</span>' +
    '</div>';

    // 风险等级分组
    for (var riskKey in RISK_FLOW_MAPPING) {
        if (!RISK_FLOW_MAPPING.hasOwnProperty(riskKey)) continue;
        body += buildDefaultConfigItem(riskKey, RISK_FLOW_MAPPING[riskKey]);
    }

    // 特殊业务类型分组
    body += '<hr class="dc-group-divider">';
    body += '<div class="dc-group-desc">以下业务类型不适用风险等级，单独绑定默认流程</div>';
    for (var specialKey in SPECIAL_FLOW_MAPPING) {
        if (!SPECIAL_FLOW_MAPPING.hasOwnProperty(specialKey)) continue;
        body += buildDefaultConfigItem(specialKey, SPECIAL_FLOW_MAPPING[specialKey]);
    }

    var footer = '<button class="btn btn-default" onclick="hideModal()">取消</button>' +
        '<button class="btn btn-primary" onclick="saveDefaultConfig()"><i class="fa fa-save"></i> 保存配置</button>';
    showModal('默认流程配置', body, footer);
}

/** 构建默认流程下拉选项（包含所有流程，标注状态） */
function buildPublishedFlowOptions(selectedFlowId) {
    var html = '';
    for (var i = 0; i < FLOWS.length; i++) {
        var flow = FLOWS[i];
        var version = flow.version || 1;
        var sel = flow.id === selectedFlowId ? ' selected' : '';
        var statusTag = '';
        if (flow.status === 'draft') statusTag = ' [草稿]';
        else if (flow.status === 'disabled') statusTag = ' [已停用]';
        html += '<option value="' + flow.id + '"' + sel + '>' +
            escapeHtml(flow.name) + ' V' + version + statusTag + '</option>';
    }
    if (!html) {
        html = '<option value="">暂无可用流程</option>';
    }
    return html;
}

/** 保存单个映射项的默认流程配置 */
function saveMappingItem(mapping, key, stateHolder) {
    var select = $('dc-select-' + key);
    if (!select) return;
    var newFlowId = select.value;
    if (newFlowId && newFlowId !== mapping[key].flowId) {
        mapping[key].flowId = newFlowId;
        stateHolder.hasChange = true;
        var selectedFlow = findFlowById(newFlowId);
        if (selectedFlow && selectedFlow.status === 'draft') {
            stateHolder.hasDraftWarning = true;
        }
    }
}

/** 保存默认流程配置（检查草稿状态并提示） */
function saveDefaultConfig() {
    var state = { hasChange: false, hasDraftWarning: false };

    for (var riskKey in RISK_FLOW_MAPPING) {
        if (!RISK_FLOW_MAPPING.hasOwnProperty(riskKey)) continue;
        saveMappingItem(RISK_FLOW_MAPPING, riskKey, state);
    }

    for (var specialKey in SPECIAL_FLOW_MAPPING) {
        if (!SPECIAL_FLOW_MAPPING.hasOwnProperty(specialKey)) continue;
        saveMappingItem(SPECIAL_FLOW_MAPPING, specialKey, state);
    }

    if (state.hasChange) {
        if (state.hasDraftWarning) {
            showToast('配置已保存，但所选流程中包含草稿状态，发布后生效', 'warning');
        } else {
            showToast('默认流程配置已保存', 'success');
        }
    } else {
        showToast('配置无变更', 'info');
    }
    hideModal();
}

/* ================================================================
 * 模态框
 * ================================================================ */

/** 显示模态框 */
function showModal(title, body, footer) {
    $('pc-modal-title').textContent = title;
    $('pc-modal-body').innerHTML = body;
    $('pc-modal-footer').innerHTML = footer || '<button class="btn btn-default" onclick="hideModal()">关闭</button>';
    $('pc-modal-overlay').classList.add('show');
}

/** 隐藏模态框 */
function hideModal() {
    $('pc-modal-overlay').classList.remove('show');
}

/* ================================================================
 * 初始化
 * ================================================================ */

/** 初始化所有功能 */
function init() {
    // 默认显示列表视图
    state.currentView = 'list';
    renderFlowList();

    // 初始化拖拽
    initToolbarDrag();
    // 初始化画布操作
    initCanvasPan();
    initCanvasZoom();

    // 全局点击隐藏右键菜单
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#pc-context-menu')) hideContextMenu();
    });

    // 点击模态框遮罩关闭
    $('pc-modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) hideModal();
    });

    // ESC关闭模态框和抽屉
    document.addEventListener('keydown', function(e) {
        if (e.code === 'Escape') {
            hideModal();
            hideContextMenu();
            closeDrawer();
        }
    });
}

// DOM加载完成后初始化
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
