<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务导航 - 服务目录</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <script src="../../js/nav-helper.js"></script>
    <style>
        /* 紧凑的总览条：替代原大KPI卡片区 */
        .overview-bar {
            background: linear-gradient(135deg, #eff6ff, #ecfeff);
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 32px;
            font-size: 13px;
        }
        .overview-bar .title {
            font-weight: 600;
            color: #1e40af;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .overview-bar .ov-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #334155;
        }
        .overview-bar .ov-item .num {
            font-weight: 600;
            color: var(--primary);
            font-size: 15px;
        }
        .overview-bar .ov-item .sub {
            color: #64748b;
            font-size: 12px;
            margin-left: 2px;
        }
        .overview-bar .divider {
            width: 1px;
            height: 18px;
            background: #cbd5e1;
            margin: 0 4px;
        }

        /* 主体两列布局 */
        .catalog-layout {
            display: flex;
            gap: 14px;
            align-items: stretch;
        }
        .tree-panel {
            flex: 0 0 300px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-height: 600px;
        }
        .tree-panel .tree-head {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .tree-panel .tree-head .sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 6px;
        }
        .tree-panel .tree-head .actions a {
            font-size: 12px;
            color: var(--primary);
            margin-left: 8px;
            font-weight: 400;
            cursor: pointer;
        }
        .tree-panel .tree-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }
        .tree-panel .tree-foot {
            padding: 8px 14px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
            background: #f8fafc;
            border-radius: 0 0 8px 8px;
        }

        .tree-node { position: relative; }
        .tree-node .node-row {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.6;
        }
        .tree-node .node-row:hover { background: #f0f7ff; }
        .tree-node .node-row.active {
            background: #e0edff;
            color: var(--primary);
            font-weight: 600;
        }
        .tree-node .node-row .toggle {
            width: 14px;
            color: #8ba3c7;
            font-size: 11px;
            text-align: center;
            flex-shrink: 0;
        }
        .tree-node .node-row .icon {
            width: 18px;
            font-size: 12px;
            text-align: center;
            flex-shrink: 0;
        }
        .tree-node.l1 > .node-row .icon { color: #2563eb; }
        .tree-node.l2 > .node-row .icon { color: #0891b2; }
        .tree-node.l3 > .node-row .icon { color: #059669; }
        .tree-node.l4 > .node-row .icon { color: #d97706; }
        .tree-node .node-row .label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tree-node .node-row .badge {
            background: #f1f5f9;
            color: #475569;
            font-size: 10px;
            border-radius: 10px;
            padding: 1px 6px;
            margin-left: 4px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .tree-node .node-row.active .badge {
            background: var(--primary);
            color: #fff;
        }
        .tree-node .node-row .stage {
            font-size: 10px;
            color: #94a3b8;
            margin-left: 4px;
        }
        .tree-children { padding-left: 14px; display: none; }
        .tree-children.open { display: block; }
        .tree-node.l1 > .node-row { font-weight: 500; }

        /* 右侧面板 */
        .right-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        /* 面包屑：合并到头部 */
        .bc-bar {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .bc-bar .left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .bc-bar .prefix { color: var(--text-secondary); }
        .bc-bar .path {
            color: var(--primary);
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bc-bar .separator { margin: 0 4px; color: #cbd5e1; }
        .bc-bar .right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .bc-bar .count-badge {
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 10px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 600;
        }

        /* 筛选区 */
        .nav-filter {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
        }
        .nav-filter .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            align-items: center;
        }
        .nav-filter .form-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-filter .form-item label {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .nav-filter .form-control {
            height: 30px;
            font-size: 12px;
            padding: 0 8px;
        }
        .nav-filter .form-control[type="text"] {
            min-width: 200px;
        }
        .nav-filter .btn {
            height: 30px;
            padding: 0 14px;
            font-size: 12px;
        }

        /* 主内容区：接口列表 */
        .list-panel {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            flex: 1;
            min-height: 480px;
            display: flex;
            flex-direction: column;
        }
        .list-panel .list-head {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .list-panel .list-head .title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .list-panel .list-head .title i {
            color: var(--primary);
            margin-right: 4px;
        }
        .list-panel .list-head .meta {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .list-panel .list-head .meta b {
            color: var(--primary);
            margin: 0 2px;
        }

        .table-wrapper { flex: 1; overflow: auto; }

        /* 空状态 */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .empty-state i {
            font-size: 36px;
            color: #cbd5e1;
            display: block;
            margin-bottom: 10px;
        }
        .empty-state b { color: var(--text-primary); }

        /* 接口列表区域：顶部提示条 */
        .list-panel .hint-bar {
            padding: 8px 14px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .list-panel .hint-bar i { color: #d97706; }
    </style>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-th-large" style="color:var(--primary);margin-right:8px"></i>服务导航</h2>
            <div class="page-desc">
                首页 / 服务目录 / 服务导航 - 按业务领域 / 价值流 / 业务活动 / 任务的五级建模方式自上而下查找服务和接口
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="window.print()"><i class="fa fa-print"></i> 打印</button>
            <button class="btn btn-primary" onclick="govNav('pages/application/call-apply.html', ['首页', '工作台', '我的申请', '服务调用申请'], {})"><i class="fa fa-paper-plane"></i> 申请调用</button>
        </div>
    </div>

    <!-- ====== 紧凑概览条：替代原大KPI卡片区 ====== -->
    <div class="overview-bar" id="overviewBar">
        <span class="title"><i class="fa fa-tachometer"></i>服务目录概览</span>
        <span class="divider"></span>
        <span class="ov-item"><span class="num" id="ovL1">8</span><span class="sub">治理域</span></span>
        <span class="ov-item"><span class="num" id="ovL2">21</span><span class="sub">价值流</span></span>
        <span class="ov-item"><span class="num" id="ovL3">28</span><span class="sub">业务活动</span></span>
        <span class="ov-item"><span class="num" id="ovL4">27</span><span class="sub">任务节点</span></span>
        <span class="ov-item"><span class="num">3,155</span><span class="sub">API 接口</span></span>
        <span class="ov-item"><span class="num">826</span><span class="sub">文件服务</span></span>
    </div>

    <!-- ====== 主体：左树 + 右内容 ====== -->
    <div class="catalog-layout">

        <!-- 左：五级分类树 -->
        <div class="tree-panel">
            <div class="tree-head">
                <span>五级分类导航<span class="sub">按业务路径逐级展开</span></span>
                <span class="actions">
                    <a href="javascript:expandAll(true)">展开</a>
                    <a href="javascript:expandAll(false)">收起</a>
                </span>
            </div>
            <div class="tree-body" id="treeContainer"></div>
            <div class="tree-foot">
                <i class="fa fa-lightbulb-o" style="color:#d97706;margin-right:4px"></i>
                点击节点查看挂载的接口与文件服务
            </div>
        </div>

        <!-- 右：面包屑 + 筛选 + 接口列表 + 快速入口 -->
        <div class="right-panel">

            <!-- 面包屑栏 -->
            <div class="bc-bar">
                <div class="left">
                    <span class="prefix"><i class="fa fa-map-marker" style="color:var(--primary)"></i> 当前路径：</span>
                    <span class="path" id="bcPath">全部服务（默认展示所有接口，从左侧选择分类可精准定位）</span>
                </div>
                <div class="right">
                    <span class="count-badge" id="bcCount">共 15 个接口</span>
                </div>
            </div>

            <!-- 筛选 -->
            <div class="nav-filter">
                <div class="form-row">
                    <div class="form-item">
                        <label>接口类型</label>
                        <select class="form-control" id="fKind">
                            <option value="">全部</option>
                            <option value="API">API</option>
                            <option value="文件">文件服务</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>分级</label>
                        <select class="form-control" id="fLevel">
                            <option value="">全部</option>
                            <option value="A">A 级（核心）</option>
                            <option value="B">B 级（重要）</option>
                            <option value="C">C 级（一般）</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>状态</label>
                        <select class="form-control" id="fStatus">
                            <option value="">全部</option>
                            <option value="运行中">运行中</option>
                            <option value="待审核">待审核</option>
                            <option value="异常">异常</option>
                            <option value="已停用">已停用</option>
                        </select>
                    </div>
                    <div class="form-item" style="flex:1">
                        <label>关键词</label>
                        <input type="text" class="form-control" id="fKeyword" placeholder="接口名称 / 编码 / 所属系统">
                    </div>
                    <div class="form-item">
                        <button class="btn btn-primary" onclick="applyFilter()"><i class="fa fa-search"></i> 查询</button>
                        <button class="btn btn-default" onclick="resetFilter()"><i class="fa fa-eraser"></i> 重置</button>
                    </div>
                </div>
            </div>

            <!-- 接口列表面板 -->
            <div class="list-panel">
                <div class="list-head">
                    <span class="title"><i class="fa fa-list"></i>接口与文件服务列表</span>
                    <span class="meta" id="listSummary">共 <b>15</b> 条 · 当前展示全部</span>
                </div>

                <div class="table-wrapper" style="border-radius:0;border:none">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width:70px">类型</th>
                                <th style="width:160px">接口编码</th>
                                <th>接口名称</th>
                                <th style="width:150px">所属系统</th>
                                <th style="width:70px" class="text-center">分级</th>
                                <th style="width:100px" class="text-right">调用方数</th>
                                <th style="width:80px" class="text-center">状态</th>
                                <th style="width:120px" class="text-center">最近更新</th>
                                <th style="width:260px" class="text-center op-col">操作</th>
                            </tr>
                        </thead>
                        <tbody id="interfaceBody">
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="paginationBox">
                    <div class="page-info" id="pageInfo">共 <span class="text-primary">15</span> 条记录</div>
                    <div class="page-list" id="pageList"></div>
                    <div class="page-size">
                        <select class="form-control" style="height:32px" id="pageSize">
                            <option value="10">10 条/页</option>
                            <option value="20" selected>20 条/页</option>
                            <option value="50">50 条/页</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../../js/mock-data.js"></script>
<script>
(function () {
    var mockData = window.GovernanceMockData;
    var cls = mockData.classification;

    // 快速索引：code -> 对象；父code -> 子数组
    var idx = { l1: {}, l2: {}, l3: {}, l4: {}, l2ByL1: {}, l3ByL2: {}, l4ByL3: {} };
    cls.l1.forEach(function (x) { idx.l1[x.code] = x; });
    cls.l2.forEach(function (x) { idx.l2[x.code] = x; (idx.l2ByL1[x.parent] = idx.l2ByL1[x.parent] || []).push(x); });
    cls.l3.forEach(function (x) { idx.l3[x.code] = x; (idx.l3ByL2[x.parent] = idx.l3ByL2[x.parent] || []).push(x); });
    cls.l4.forEach(function (x) { idx.l4[x.code] = x; (idx.l4ByL3[x.parent] = idx.l4ByL3[x.parent] || []).push(x); });

    // 预计算每个节点下挂载的接口数量
    var countByCode = {};
    Object.keys(cls.interfaceMapping).forEach(function (l4Code) {
        var n = cls.interfaceMapping[l4Code].length;
        countByCode[l4Code] = n;
        var l4 = idx.l4[l4Code];
        if (!l4) return;
        var l3 = idx.l3[l4.parent];
        var l2 = l3 ? idx.l2[l3.parent] : null;
        var l1 = l2 ? idx.l1[l2.parent] : null;
        if (l3) countByCode[l3.code] = (countByCode[l3.code] || 0) + n;
        if (l2) countByCode[l2.code] = (countByCode[l2.code] || 0) + n;
        if (l1) countByCode[l1.code] = (countByCode[l1.code] || 0) + n;
    });

    // 当前选中状态
    var current = { level: 0, code: null }; // level=0 表示全部
    var pageState = { page: 1, size: 20 };

    // ============ 概览条数字 ============
    document.getElementById('ovL1').textContent = cls.l1.length;
    document.getElementById('ovL2').textContent = cls.l2.length;
    document.getElementById('ovL3').textContent = cls.l3.length;
    document.getElementById('ovL4').textContent = cls.l4.length;

    // ============ 树渲染 ============
    function renderTree() {
        var container = document.getElementById('treeContainer');
        var html = '';
        cls.l1.forEach(function (l1) {
            var l2List = idx.l2ByL1[l1.code] || [];
            html += '<div class="tree-node l1" data-code="' + l1.code + '" data-level="1">';
            html += '<div class="node-row" onclick="selectNode(1,\'' + l1.code + '\',event)">';
            html += '<span class="toggle" onclick="toggleNode(this,event)"><i class="fa fa-angle-right"></i></span>';
            html += '<span class="icon"><i class="fa fa-bookmark-o"></i></span>';
            html += '<span class="label" title="' + l1.name + '">' + l1.name + '</span>';
            html += '<span class="badge">' + (countByCode[l1.code] || 0) + '</span>';
            html += '</div>';
            if (l2List.length) {
                html += '<div class="tree-children">';
                l2List.forEach(function (l2) {
                    var l3List = idx.l3ByL2[l2.code] || [];
                    html += '<div class="tree-node l2" data-code="' + l2.code + '" data-level="2">';
                    html += '<div class="node-row" onclick="selectNode(2,\'' + l2.code + '\',event)">';
                    html += '<span class="toggle" onclick="toggleNode(this,event)"><i class="fa fa-angle-right"></i></span>';
                    html += '<span class="icon"><i class="fa fa-sitemap"></i></span>';
                    html += '<span class="label">' + l2.name + '</span>';
                    html += '<span class="stage">' + (l2.stage || '') + '</span>';
                    html += '<span class="badge">' + (countByCode[l2.code] || 0) + '</span>';
                    html += '</div>';
                    if (l3List.length) {
                        html += '<div class="tree-children">';
                        l3List.forEach(function (l3) {
                            var l4List = idx.l4ByL3[l3.code] || [];
                            html += '<div class="tree-node l3" data-code="' + l3.code + '" data-level="3">';
                            html += '<div class="node-row" onclick="selectNode(3,\'' + l3.code + '\',event)">';
                            html += '<span class="toggle" onclick="toggleNode(this,event)"><i class="fa fa-angle-right"></i></span>';
                            html += '<span class="icon"><i class="fa fa-cube"></i></span>';
                            html += '<span class="label">' + l3.name + '</span>';
                            html += '<span class="badge">' + (countByCode[l3.code] || 0) + '</span>';
                            html += '</div>';
                            if (l4List.length) {
                                html += '<div class="tree-children">';
                                l4List.forEach(function (l4) {
                                    html += '<div class="tree-node l4" data-code="' + l4.code + '" data-level="4">';
                                    html += '<div class="node-row" onclick="selectNode(4,\'' + l4.code + '\',event)">';
                                    html += '<span class="toggle" style="visibility:hidden"><i class="fa fa-angle-right"></i></span>';
                                    html += '<span class="icon"><i class="fa fa-cog"></i></span>';
                                    html += '<span class="label">' + l4.name + '</span>';
                                    html += '<span class="badge">' + (countByCode[l4.code] || 0) + '</span>';
                                    html += '</div></div>';
                                });
                                html += '</div>';
                            }
                            html += '</div>';
                        });
                        html += '</div>';
                    }
                    html += '</div>';
                });
                html += '</div>';
            }
            html += '</div>';
        });
        container.innerHTML = html;
    }

    window.toggleNode = function (el, ev) {
        ev.stopPropagation();
        var parent = el.closest('.tree-node');
        var children = parent.querySelector(':scope > .tree-children');
        if (!children) return;
        var opened = children.classList.toggle('open');
        var icon = el.querySelector('i');
        icon.className = opened ? 'fa fa-angle-down' : 'fa fa-angle-right';
    };

    window.expandAll = function (open) {
        var els = document.querySelectorAll('#treeContainer .tree-children');
        var toggles = document.querySelectorAll('#treeContainer .tree-node > .node-row .toggle i');
        els.forEach(function (e) { if (open) e.classList.add('open'); else e.classList.remove('open'); });
        toggles.forEach(function (i) { i.className = open ? 'fa fa-angle-down' : 'fa fa-angle-right'; });
    };

    function clearActive() {
        document.querySelectorAll('#treeContainer .node-row.active').forEach(function (r) { r.classList.remove('active'); });
    }
    function openParentsAndHighlight(level, code) {
        clearActive();
        var node = document.querySelector('.tree-node[data-level="' + level + '"][data-code="' + code + '"]');
        if (!node) return;
        node.querySelector('.node-row').classList.add('active');
        var parent = node.parentElement;
        while (parent && parent.id !== 'treeContainer') {
            if (parent.classList.contains('tree-children')) {
                parent.classList.add('open');
                var pn = parent.closest('.tree-node');
                if (pn) {
                    var tog = pn.querySelector(':scope > .node-row .toggle i');
                    if (tog) tog.className = 'fa fa-angle-down';
                }
            }
            parent = parent.parentElement;
        }
    }

    window.selectNode = function (level, code, ev) {
        if (ev) ev.stopPropagation();
        current.level = level;
        current.code = code;
        openParentsAndHighlight(level, code);
        refreshBreadcrumb();
        pageState.page = 1;
        applyFilter();
    };

    // ============ 过滤接口 ============
    function filterByNode(list) {
        if (current.level === 0 || !current.code) return list; // 全部
        var field = 'l' + current.level + 'Code';
        return list.filter(function (it) { return it[field] === current.code; });
    }

    function applyUserFilter(list) {
        var kind = document.getElementById('fKind').value;
        var level = document.getElementById('fLevel').value;
        var status = document.getElementById('fStatus').value;
        var kw = document.getElementById('fKeyword').value.trim().toLowerCase();
        return list.filter(function (it) {
            if (kind && it.kind !== kind) return false;
            if (level && it.level !== level) return false;
            if (status && it.status !== status) return false;
            if (kw) {
                var s = (it.code + ' ' + it.name + ' ' + it.system + ' ' + (it.path || '')).toLowerCase();
                if (s.indexOf(kw) === -1) return false;
            }
            return true;
        });
    }

    window.applyFilter = function () {
        var all = filterByNode(mockData.interfaceListFull);
        var rows = applyUserFilter(all);
        renderRows(rows);
    };

    window.resetFilter = function () {
        document.getElementById('fKind').value = '';
        document.getElementById('fLevel').value = '';
        document.getElementById('fStatus').value = '';
        document.getElementById('fKeyword').value = '';
        pageState.page = 1;
        applyFilter();
    };

    document.addEventListener('change', function (e) {
        if (e.target && e.target.id === 'pageSize') {
            pageState.size = parseInt(e.target.value, 10) || 20;
            pageState.page = 1;
            applyFilter();
        }
    });
    document.addEventListener('keydown', function (e) {
        if (e.target && e.target.id === 'fKeyword' && e.keyCode === 13) {
            pageState.page = 1;
            applyFilter();
        }
    });

    // ============ 渲染列表 + 分页 ============
    function renderRows(rows) {
        var tbody = document.getElementById('interfaceBody');
        document.getElementById('listSummary').innerHTML = '共 <b>' + rows.length + '</b> 条 · ' + (current.level === 0 ? '当前展示全部' : '当前路径筛选结果');
        document.getElementById('bcCount').textContent = '共 ' + rows.length + ' 个';

        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-secondary)"><i class="fa fa-inbox" style="margin-right:6px"></i>当前条件下没有匹配的接口</td></tr>';
            renderPagination(0);
            return;
        }
        var total = rows.length;
        var size = pageState.size;
        var maxPage = Math.max(1, Math.ceil(total / size));
        if (pageState.page > maxPage) pageState.page = maxPage;
        var start = (pageState.page - 1) * size;
        var pageRows = rows.slice(start, start + size);

        tbody.innerHTML = pageRows.map(function (r) {
            var isAPI = r.kind === 'API';
            var detailPage = isAPI ? 'pages/interface/api-detail.html' : 'pages/interface/file-detail.html';
            var typeParam = isAPI ? 'API' : 'FILE';
            var statusClass = r.status === '运行中' ? 'tag-success'
                : r.status === '待审核' ? 'tag-warning'
                : r.status === '异常' ? 'tag-danger' : 'tag-default';
            return '<tr>' +
                '<td class="text-center"><span class="tag ' + (isAPI ? 'tag-info' : 'tag-purple') + '" style="font-size:11px"><i class="fa fa-' + (isAPI ? 'plug' : 'file-text-o') + '"></i> ' + r.kind + '</span></td>' +
                '<td style="font-family:Segoe UI,sans-serif;color:var(--primary);font-weight:600"><a href="javascript:void(0)" onclick="govNav(\'' + detailPage + '\',[\'首页\',\'服务目录\',\'接口详情(API)\'],{id:\'' + r.code + '\',type:\'' + typeParam + '\'})">' + r.code + '</a></td>' +
                '<td>' + r.name + '</td>' +
                '<td>' + r.system + '</td>' +
                '<td class="text-center"><span class="tag tag-level-' + r.level.toLowerCase() + '" style="font-size:11px">' + r.level + '</span></td>' +
                '<td class="text-right num">' + r.consumers + '</td>' +
                '<td class="text-center"><span class="tag ' + statusClass + '" style="font-size:11px">' + r.status + '</span></td>' +
                '<td class="text-center" style="font-size:12px;color:var(--text-secondary)">' + r.changed + '</td>' +
                '<td class="text-center" style="white-space:nowrap">' +
                    '<button class="btn btn-link" style="padding:2px 4px" onclick="govNav(\'' + detailPage + '\',[\'首页\',\'服务目录\',\'接口详情(API)\'],{id:\'' + r.code + '\',type:\'' + typeParam + '\'})"><i class="fa fa-eye"></i> 查看</button>' +
                    '<button class="btn btn-link" style="padding:2px 4px" onclick="govNav(\'pages/application/call-apply.html\',[\'首页\',\'工作台\',\'我的申请\',\'服务调用申请\'],{id:\'' + r.code + '\'})"><i class="fa fa-share"></i> 调用申请</button>' +
                    '<button class="btn btn-link" style="padding:2px 4px" onclick="govNav(\'pages/application/change-apply.html\',[\'首页\',\'工作台\',\'我的申请\',\'接口变更申请\'],{id:\'' + r.code + '\',name:\'' + r.name + '\'})"><i class="fa fa-pencil"></i> 变更</button>' +
                    '<button class="btn btn-link" style="padding:2px 4px" onclick="govNav(\'pages/lineage/graph-view.html\',[\'首页\',\'追溯与血缘\',\'血缘图谱\'],{id:\'' + r.code + '\'})"><i class="fa fa-sitemap"></i> 血缘</button>' +
                '</td></tr>';
        }).join('');

        renderPagination(total);
    }

    function renderPagination(total) {
        var size = pageState.size;
        var maxPage = Math.max(1, Math.ceil(total / size));
        document.getElementById('pageInfo').innerHTML = '共 <span class="text-primary">' + total + '</span> 条记录';
        var list = document.getElementById('pageList');
        var html = '';
        html += '<button onclick="goPage(' + (pageState.page - 1) + ')" ' + (pageState.page <= 1 ? 'disabled' : '') + '><i class="fa fa-angle-left"></i></button>';
        for (var p = 1; p <= maxPage; p++) {
            html += '<button class="' + (p === pageState.page ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
        }
        html += '<button onclick="goPage(' + (pageState.page + 1) + ')" ' + (pageState.page >= maxPage ? 'disabled' : '') + '><i class="fa fa-angle-right"></i></button>';
        list.innerHTML = html;
    }
    window.goPage = function (p) {
        pageState.page = p;
        applyFilter();
    };

    // ============ 面包屑 ============
    function computePathFor(level, code) {
        var result = { l1: null, l2: null, l3: null, l4: null };
        if (level === 1) { result.l1 = idx.l1[code]; }
        else if (level === 2) { result.l2 = idx.l2[code]; result.l1 = result.l2 ? idx.l1[result.l2.parent] : null; }
        else if (level === 3) { result.l3 = idx.l3[code]; result.l2 = result.l3 ? idx.l2[result.l3.parent] : null; result.l1 = result.l2 ? idx.l1[result.l2.parent] : null; }
        else if (level === 4) { result.l4 = idx.l4[code]; result.l3 = result.l4 ? idx.l3[result.l4.parent] : null; result.l2 = result.l3 ? idx.l2[result.l3.parent] : null; result.l1 = result.l2 ? idx.l1[result.l2.parent] : null; }
        return result;
    }
    function refreshBreadcrumb() {
        var el = document.getElementById('bcPath');
        if (current.level === 0) {
            el.textContent = '全部服务（默认展示所有接口，从左侧选择分类可精准定位）';
            return;
        }
        var p = computePathFor(current.level, current.code);
        var parts = [];
        if (p.l1) parts.push(p.l1.name);
        if (p.l2) parts.push(p.l2.name);
        if (p.l3) parts.push(p.l3.name);
        if (p.l4) parts.push(p.l4.name);
        el.textContent = parts.join(' / ');
    }

    // ============ URL 参数预选中 ============
    function parseUrlAndSelect() {
        var q = new URLSearchParams(window.location.search);
        var l4 = q.get('l4'), l3 = q.get('l3'), l2 = q.get('l2'), l1 = q.get('l1');
        var level = 0, code = null;
        if (l4) { var o = cls.l4.find(function (x) { return x.code.toLowerCase() === l4.toLowerCase(); }); if (o) { level = 4; code = o.code; } }
        if (!code && l3) { var o = cls.l3.find(function (x) { return x.code.toLowerCase() === l3.toLowerCase(); }); if (o) { level = 3; code = o.code; } }
        if (!code && l2) { var o = cls.l2.find(function (x) { return x.code.toLowerCase() === l2.toLowerCase(); }); if (o) { level = 2; code = o.code; } }
        if (!code && l1) { var o = cls.l1.find(function (x) { return x.code.toLowerCase() === l1.toLowerCase() || x.name === l1; }); if (o) { level = 1; code = o.code; } }
        if (code) {
            current.level = level; current.code = code;
            openParentsAndHighlight(level, code);
        }
        refreshBreadcrumb();
        applyFilter();
    }

    // ============ 初始化 ============
    renderTree();
    parseUrlAndSelect();
})();
</script>
