<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接口变更记录 - 工作台</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <script src="../../js/nav-helper.js"></script>
    <style>
        /* ====== 加载中遮罩 ====== */
        .loading-mask {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.3s;
        }
        .loading-mask .spinner { font-size: 32px; color: var(--primary); }
        .loading-mask .loading-text { margin-left: 12px; color: var(--text-secondary); font-size: 14px; }

        /* ====== 面包屑 ====== */
        .page-breadcrumb {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .page-breadcrumb .bc-item { color: var(--text-secondary); }
        .page-breadcrumb .bc-item.active { color: var(--text-primary); font-weight: 600; }
        .page-breadcrumb .bc-sep { color: var(--text-light); }

        /* ====== 接口基本信息卡片 ====== */
        .info-card {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            color: #fff; border-radius: var(--radius); padding: 20px 24px;
            margin-bottom: 16px; box-shadow: var(--shadow);
        }
        .info-card .ic-title {
            font-size: 16px; font-weight: 700; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .info-card .ic-row { display: flex; flex-wrap: wrap; gap: 16px 40px; }
        .info-card .ic-item { min-width: 180px; }
        .info-card .ic-label { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
        .info-card .ic-value { font-size: 15px; font-weight: 600; }
        .info-card .ic-value .tag {
            background: rgba(255,255,255,0.18); color: #fff;
            border-color: rgba(255,255,255,0.3);
        }

        /* ====== 变更类型标签颜色（按类型区分） ====== */
        .tag-type-version  { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
        .tag-type-field    { background: #fef3c7; color: #b45309; border-color: #fde68a; }
        .tag-type-param    { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }
        .tag-type-status   { background: #cffafe; color: #0e7490; border-color: #a5f3fc; }
        .tag-type-offline  { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }

        /* ====== 时间线 ====== */
        .timeline {
            position: relative;
            padding: 8px 0 8px 32px;
        }
        /* 左侧竖线 */
        .timeline::before {
            content: "";
            position: absolute;
            left: 11px; top: 12px; bottom: 12px;
            width: 2px;
            background: linear-gradient(180deg, var(--border) 0%, var(--border) 100%);
            border-radius: 1px;
        }

        .tl-item {
            position: relative;
            margin-bottom: 20px;
        }
        .tl-item:last-child { margin-bottom: 0; }

        /* 彩色圆点 */
        .tl-dot {
            position: absolute;
            left: -27px; top: 14px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--primary);
            box-shadow: 0 0 0 4px rgba(30,64,175,0.08);
            z-index: 2;
        }
        .tl-dot.dot-version { border-color: var(--info); box-shadow: 0 0 0 4px rgba(2,132,199,0.10); }
        .tl-dot.dot-field   { border-color: var(--warning); box-shadow: 0 0 0 4px rgba(217,119,6,0.10); }
        .tl-dot.dot-param   { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124,58,237,0.10); }
        .tl-dot.dot-status  { border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(8,145,178,0.10); }
        .tl-dot.dot-offline { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(220,38,38,0.10); }

        .tl-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: box-shadow 0.2s;
        }
        .tl-card:hover { box-shadow: var(--shadow-hover); }

        .tl-head {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
        }
        .tl-head .tl-head-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .tl-head .tl-time { font-size: 12px; color: var(--text-secondary); }
        .tl-head .tl-applicant { font-size: 12px; color: var(--primary); }
        .tl-head .tl-head-right { display: flex; align-items: center; gap: 8px; }

        .tl-body { padding: 14px 16px; }
        .tl-desc { font-size: 13px; color: var(--text-primary); line-height: 1.7; margin-bottom: 10px; }
        .tl-toggle {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--primary); cursor: pointer;
            user-select: none;
        }
        .tl-toggle:hover { color: var(--primary-light); }
        .tl-toggle i { transition: transform 0.2s; }
        .tl-toggle.open i { transform: rotate(90deg); }

        /* 展开/折叠的对比区 */
        .tl-compare { display: none; margin-top: 12px; }
        .tl-compare.show { display: block; }
        .compare-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .compare-box {
            border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden;
        }
        .compare-box .cb-title {
            padding: 8px 12px; font-size: 12px; font-weight: 600;
            background: #f8fafc; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 6px;
        }
        .compare-box.before .cb-title { color: var(--danger); }
        .compare-box.after  .cb-title { color: var(--success); }
        .compare-box .cb-body { padding: 0; }
        .kv-mini { width: 100%; font-size: 12px; }
        .kv-mini td { padding: 6px 12px; border-bottom: 1px solid var(--border-light); }
        .kv-mini td.k { color: var(--text-secondary); width: 50%; background: #fafbfc; }
        .kv-mini td.v { color: var(--text-primary); font-weight: 500; }
        .kv-mini tr:last-child td { border-bottom: none; }
        .kv-mini .added   { color: var(--success); font-weight: 600; }
        .kv-mini .removed { color: var(--danger); font-weight: 600; text-decoration: line-through; }

        /* 空状态 */
        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
        .empty-state .empty-icon { font-size: 64px; color: #cbd5e1; margin-bottom: 16px; }
        .empty-state .empty-text { font-size: 14px; }

        /* 操作按钮组 */
        .tl-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    </style>
</head>
<body>

<!-- ====== 加载中遮罩 ====== -->
<div class="loading-mask" id="loadingMask">
    <i class="fa fa-spinner fa-pulse spinner"></i>
    <span class="loading-text">正在加载接口变更记录...</span>
</div>

<div class="page-wrapper">

    <!-- ====== 面包屑 ====== -->
    <div class="page-breadcrumb">
        <span class="bc-item">首页</span>
        <span class="bc-sep">/</span>
        <span class="bc-item"><i class="fa fa-cubes"></i> 工作台</span>
        <span class="bc-sep">/</span>
        <span class="bc-item active">接口变更记录</span>
    </div>

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-history" style="color:var(--primary);margin-right:8px"></i>接口变更记录</h2>
            <div class="page-desc">
                首页 / 工作台 / 影响分析预警 / 接口变更记录 - 展示该接口完整的版本演进与字段变更历史 · 当前接口：<span id="descCode">--</span> · <span id="descName">--</span>
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="goBack()"><i class="fa fa-arrow-left"></i> 返回影响预警</button>
            <button class="btn btn-default" onclick="window.location.reload()"><i class="fa fa-refresh"></i> 刷新</button>
        </div>
    </div>

    <!-- ====== 接口基本信息卡片 ====== -->
    <div class="info-card">
        <div class="ic-title"><i class="fa fa-info-circle"></i> 接口基本信息</div>
        <div class="ic-row">
            <div class="ic-item">
                <div class="ic-label">接口编码</div>
                <div class="ic-value" id="infoCode">API-CUS-0001</div>
            </div>
            <div class="ic-item">
                <div class="ic-label">接口名称</div>
                <div class="ic-value" id="infoName">客户基本信息查询</div>
            </div>
            <div class="ic-item">
                <div class="ic-label">当前版本</div>
                <div class="ic-value" id="infoVersion">v2.3</div>
            </div>
            <div class="ic-item">
                <div class="ic-label">状态</div>
                <div class="ic-value"><span class="tag" id="infoStatus">运行中</span></div>
            </div>
            <div class="ic-item">
                <div class="ic-label">所属系统</div>
                <div class="ic-value" id="infoSystem">核心业务系统</div>
            </div>
            <div class="ic-item">
                <div class="ic-label">累计变更次数</div>
                <div class="ic-value" id="infoChangeCount">5 次</div>
            </div>
        </div>
    </div>

    <!-- ====== 变更历史时间线 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-clock-o"></i> 变更历史时间线</div>
            <div class="card-action">
                <a href="javascript:;" onclick="expandAll()"><i class="fa fa-expand"></i> 全部展开</a>
                <a href="javascript:;" onclick="collapseAll()"><i class="fa fa-compress"></i> 全部折叠</a>
            </div>
        </div>
        <div class="card-body">
            <!-- 空数据状态 -->
            <div class="empty-state" id="emptyState" style="display:none">
                <div class="empty-icon"><i class="fa fa-inbox"></i></div>
                <div class="empty-text">该接口暂无变更记录</div>
            </div>
            <!-- 时间线容器 -->
            <div class="timeline" id="timeline"></div>
        </div>
    </div>

</div>

<script>
/**
 * 变更记录 mock 数据（覆盖5种变更类型）
 * type: version(版本升级) field(字段变更) param(参数变更) status(状态变更) offline(下线申请)
 * status: done(已生效) pending(审核中) rejected(已驳回)
 */
var CHANGE_RECORDS = [
    {
        id: 'CHG-2026-0051',
        type: 'version', typeText: '版本升级',
        time: '2026-06-01 14:30',
        applicant: '张明（核心系统组）',
        desc: '接口由 v2.2 升级至 v2.3，新增 frozen_amount（冻结金额）响应字段，向下兼容，不影响存量调用方。建议消费方在下次发布中接入新字段以完善账户冻结信息展示。',
        versionFrom: 'v2.2', versionTo: 'v2.3',
        status: 'done', statusText: '已生效',
        before: [
            { k: '版本号', v: 'v2.2' },
            { k: '响应字段·冻结金额', v: '无' },

        ],

            { k: '版本号', v: 'v2.3', cls: 'added' },
            { k: '响应字段·冻结金额', v: 'frozen_amount（Decimal）', cls: 'added' },
            { k: '兼容性', v: '向下兼容', cls: 'added' }
        ]
    },
    {
        id: 'CHG-2026-0048',
        type: 'field', typeText: '字段变更',
        time: '2026-05-20 09:15',
        applicant: '李华（核心系统组）',
        desc: '响应新增 customer_level（客户等级）、customer_tag（客户标签）两个字段，用于下游系统识别客户分层。纯新增字段，向后兼容，无需消费方改动即可继续运行。',
        versionFrom: 'v3.1', versionTo: 'v3.1',
        status: 'done', statusText: '已生效',
        before: [
            { k: 'customer_level', v: '无' },
            { k: 'customer_tag', v: '无' },
            { k: '影响范围', v: '8 个下游系统' }
        ],
        after: [
            { k: 'customer_level', v: '新增（String，枚举）', cls: 'added' },
            { k: 'customer_tag', v: '新增（String）', cls: 'added' },
            { k: '影响范围', v: '向后兼容，无需改动' }
        ]
    },
    {
        id: 'CHG-2026-0042',
        type: 'param', typeText: '参数变更',
        time: '2026-05-08 16:42',
        applicant: '王芳（核心系统组）',
        desc: '请求参数 query_type 由可选调整为必填，并新增枚举值 COMPOSITE（综合查询）。本次变更需消费方显式传参，正在审核中，预计 2026-06-15 生效。',
        versionFrom: 'v3.1', versionTo: 'v3.1',
        status: 'pending', statusText: '审核中',
        before: [
            { k: 'query_type·必填', v: '否（可选）' },
            { k: 'query_type·枚举', v: 'BASIC / FULL' },
            { k: '默认值', v: 'BASIC' }
        ],
        after: [
            { k: 'query_type·必填', v: '是（必填）', cls: 'added' },
            { k: 'query_type·枚举', v: 'BASIC / FULL / COMPOSITE', cls: 'added' },
            { k: '默认值', v: '无（需显式传参）', cls: 'added' }
        ]
    },
    {
        id: 'CHG-2026-0035',
        type: 'status', typeText: '状态变更',
        time: '2026-04-12 11:08',
        applicant: '赵强（运维组）',
        desc: '接口状态由"测试发布"切换为"正式运行"，正式对外提供服务。灰度期间累计调用 12.6 万次，成功率 99.96%，符合正式发布标准。',
        versionFrom: 'v3.0', versionTo: 'v3.0',
        status: 'done', statusText: '已生效',
        before: [
            { k: '接口状态', v: '测试发布' },
            { k: '测试覆盖', v: '30%' },
            { k: '监控结论', v: '观察中' }
        ],
        after: [
            { k: '接口状态', v: '正式运行', cls: 'added' },
            { k: '测试覆盖', v: '100%（全量）', cls: 'added' },
            { k: '监控结论', v: '成功率 99.96%，达标', cls: 'added' }
        ]
    },
    {
        id: 'CHG-2026-0028',
        type: 'offline', typeText: '下线申请',
        time: '2026-03-22 18:55',
        applicant: '孙伟（架构组）',
        desc: '申请下线 v1.x 旧版本接口，计划 2026-05-01 停服。该版本已被 v2.x 完全替代，但仍检测到 3 个系统存量调用。因存量迁移未完成，本次下线申请被驳回，待迁移完成后重新提交。',
        versionFrom: 'v1.2', versionTo: '—（下线）',
        status: 'rejected', statusText: '已驳回',
        before: [
            { k: '下线版本', v: 'v1.2' },
            { k: '计划停服日', v: '2026-05-01' },
            { k: '存量调用系统', v: '3 个' }
        ],
        after: [
            { k: '下线版本', v: 'v1.2（驳回，未下线）', cls: 'removed' },
            { k: '计划停服日', v: '待迁移完成后重新提交', cls: 'removed' },
            { k: '存量调用系统', v: '需先完成迁移', cls: 'removed' }
        ]
    }
];

/**
 * 读取 URL 参数填充接口基本信息
 */
function fillInterfaceInfo() {
    var code = govGetParam('code') || 'API-CUS-0001';
    var name = govGetParam('name') || '客户基本信息查询';
    document.getElementById('infoCode').textContent = code;
    document.getElementById('infoName').textContent = name;
    document.getElementById('descCode').textContent = code;
    document.getElementById('descName').textContent = name;
}

/**
 * 根据变更类型返回 dot class
 */
function getDotClass(type) {
    var map = { version: 'dot-version', field: 'dot-field', param: 'dot-param', status: 'dot-status', offline: 'dot-offline' };
    return map[type] || 'dot-version';
}

/**
 * 根据变更类型返回 tag class
 */
function getTagClass(type) {
    var map = { version: 'tag-type-version', field: 'tag-type-field', param: 'tag-type-param', status: 'tag-type-status', offline: 'tag-type-offline' };
    return map[type] || 'tag-type-version';
}

/**
 * 根据状态返回标签 class
 */
function getStatusTagClass(status) {
    var map = { done: 'tag-success', pending: 'tag-warning', rejected: 'tag-danger' };
    return map[status] || 'tag-default';
}

/**
 * 渲染单条对比表格
 */
function renderCompareBox(title, rows, boxClass) {
    var rowHtml = rows.map(function (r) {
        var cls = r.cls ? ' class="' + r.cls + '"' : '';
        return '<tr><td class="k">' + r.k + '</td><td class="v"' + cls + '>' + r.v + '</td></tr>';
    }).join('');
    return '<div class="compare-box ' + boxClass + '">' +
        '<div class="cb-title">' + title + '</div>' +
        '<div class="cb-body"><table class="kv-mini">' + rowHtml + '</table></div>' +
        '</div>';
}

/**
 * 渲染单条变更记录卡片
 */
function renderTimelineItem(rec) {
    var dotClass = getDotClass(rec.type);
    var tagClass = getTagClass(rec.type);
    var statusClass = getStatusTagClass(rec.status);

    var versionText = rec.versionFrom === rec.versionTo
        ? rec.versionFrom
        : (rec.versionFrom + ' → ' + rec.versionTo);

    var beforeBox = renderCompareBox('变更前', rec.before, 'before');
    var afterBox = renderCompareBox('变更后', rec.after, 'after');

    return '<div class="tl-item">' +
        '<span class="tl-dot ' + dotClass + '"></span>' +
        '<div class="tl-card">' +
            '<div class="tl-head">' +
                '<div class="tl-head-left">' +
                    '<span class="tag ' + tagClass + '">' + rec.typeText + '</span>' +
                    '<span class="tl-time"><i class="fa fa-clock-o"></i> ' + rec.time + '</span>' +
                    '<span class="tl-applicant"><i class="fa fa-user-o"></i> ' + rec.applicant + '</span>' +
                    '<span class="tl-time">编号：' + rec.id + '</span>' +
                '</div>' +
                '<div class="tl-head-right">' +
                    '<span class="tag ' + statusClass + '">' + rec.statusText + '</span>' +
                '</div>' +
            '</div>' +
            '<div class="tl-body">' +
                '<div class="tl-desc">' + rec.desc + '</div>' +
                '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">' +
                    '<b>涉及版本：</b>' + versionText +
                '</div>' +
                '<span class="tl-toggle" onclick="toggleCompare(this)">' +
                    '<i class="fa fa-caret-right"></i> 查看变更前后字段对比' +
                '</span>' +
                '<div class="tl-compare">' +
                    '<div class="compare-grid">' + beforeBox + afterBox + '</div>' +
                '</div>' +
                '<div class="tl-actions">' +
                    '<button class="btn btn-default btn-sm" onclick="viewLineage(\'' + rec.id + '\')"><i class="fa fa-sitemap"></i> 查看血缘影响</button>' +
                    '<button class="btn btn-link btn-sm" onclick="showToast(\'已下载变更单 ' + rec.id + '\',\'success\')"><i class="fa fa-download"></i> 下载变更单</button>' +
                '</div>' +
            '</div>' +
        '</div>' +
    '</div>';
}

/**
 * 渲染全部时间线
 */
function renderTimeline() {
    var container = document.getElementById('timeline');
    var empty = document.getElementById('emptyState');
    if (!CHANGE_RECORDS || CHANGE_RECORDS.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    container.innerHTML = CHANGE_RECORDS.map(renderTimelineItem).join('');
    document.getElementById('infoChangeCount').textContent = CHANGE_RECORDS.length + ' 次';
}

/**
 * 展开/折叠单条变更对比
 */
function toggleCompare(el) {
    var compare = el.nextElementSibling;
    if (!compare) return;
    var isOpen = compare.classList.contains('show');
    if (isOpen) {
        compare.classList.remove('show');
        el.classList.remove('open');
        el.innerHTML = '<i class="fa fa-caret-right"></i> 查看变更前后字段对比';
    } else {
        compare.classList.add('show');
        el.classList.add('open');
        el.innerHTML = '<i class="fa fa-caret-right"></i> 收起变更前后字段对比';
    }
}

/**
 * 全部展开
 */
function expandAll() {
    document.querySelectorAll('.tl-toggle').forEach(function (el) {
        var compare = el.nextElementSibling;
        if (compare && !compare.classList.contains('show')) {
            toggleCompare(el);
        }
    });
    showToast('已展开全部变更对比', 'success');
}

/**
 * 全部折叠
 */
function collapseAll() {
    document.querySelectorAll('.tl-toggle').forEach(function (el) {
        var compare = el.nextElementSibling;
        if (compare && compare.classList.contains('show')) {
            toggleCompare(el);
        }
    });
    showToast('已折叠全部变更对比', 'success');
}

/**
 * 跳转血缘影响
 */
function viewLineage(changeId) {
    var code = govGetParam('code') || 'API-CUS-0001';
    govNav('pages/lineage/graph-view.html', ['首页', '追溯与血缘', '血缘图谱'], { code: code, type: 'API', change: changeId });
}

/**
 * 返回上一页 — 优先根据来源参数判断目标页
 * from=detail 返回接口详情页，否则使用 history.back() 回到来源页
 */
function goBack() {
    var from = govGetParam('from');
    if (from === 'detail') {
        var code = govGetParam('code') || 'API-CUS-0001';
        govNav('pages/interface/api-detail.html', ['首页', '服务目录', '接口服务清单', '接口详情'], { code: code });
    } else {
        history.back();
    }
}

/**
 * 页面加载完成后初始化
 */
window.addEventListener('load', function () {
    fillInterfaceInfo();
    renderTimeline();
    // 模拟加载延迟后隐藏遮罩
    setTimeout(function () {
        var mask = document.getElementById('loadingMask');
        if (mask) {
            mask.style.opacity = '0';
            setTimeout(function () { mask.style.display = 'none'; }, 300);
        }
    }, 400);
});
</script>
