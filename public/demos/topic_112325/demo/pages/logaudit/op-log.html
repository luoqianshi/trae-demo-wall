<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志 - 日志审计</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        /* ========== 环境胶囊切换器 + 横幅（统一规范） ========== */
        .env-switcher { display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:14px; }
        .env-switcher .env-label { font-size:13px; color:#64748b; font-weight:600; margin-right:4px; }
        .env-pill { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:500; color:#475569; background:#f1f5f9; border:1px solid transparent; transition:all .2s ease; user-select:none; }
        .env-pill:hover { box-shadow:0 2px 6px rgba(0,0,0,.08); }
        .env-pill.active { background:#1e40af; color:#fff; border-color:#1e40af; box-shadow:0 2px 8px rgba(30,64,175,.25); }
        .env-pill .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#cbd5e1; }
        .env-pill.active .dot { background:#fff; }
        .env-pill .dot.green { background:#16a34a; }
        .env-pill .dot.yellow { background:#eab308; }
        .env-pill .dot.blue { background:#2563eb; }
        .env-pill .dot.purple { background:#9333ea; }
        .env-pill.active .dot.green, .env-pill.active .dot.yellow, .env-pill.active .dot.blue, .env-pill.active .dot.purple { opacity:0.9; }
        .env-pill .count { font-size:11px; padding:1px 8px; border-radius:999px; background:rgba(0,0,0,0.06); font-weight:500; }
        .env-pill.active .count { background:rgba(255,255,255,0.18); }

        .env-banner { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 20px; background:linear-gradient(90deg,#eff6ff,#f0fdfa); border:1px solid #bfdbfe; border-radius:8px; margin-bottom:14px; font-size:13px; color:#1e40af; }
        .env-banner .bn-left { display:flex; align-items:center; gap:10px; flex:1; flex-wrap:wrap; }
        .env-banner .bn-left i { font-size:16px; color:#2563eb; }
        .env-banner .bn-right { display:flex; gap:8px; }
        .env-banner .btn { padding:6px 12px; font-size:12px; border-radius:6px; cursor:pointer; border:1px solid #cbd5e1; background:#fff; color:#1e293b; }
        .env-banner .btn:hover { background:#f8fafc; }
    </style>
<script src="../../js/nav-helper.js"></script>
    <style>
@keyframes skeleton-loading{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-bar{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:skeleton-loading 1.5s infinite;border-radius:4px}
</style>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-history" style="color:var(--primary);margin-right:8px"></i>操作日志</h2>
            <div class="page-desc">
                首页 / 日志审计 / 操作日志 - 记录系统所有操作行为，支持按模块、类型、人员等维度查询审计
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="showToast('导出操作日志')"><i class="fa fa-download"></i> 导出日志</button>
            <button class="btn btn-default" onclick="showToast('刷新操作日志')"><i class="fa fa-refresh"></i> 刷新</button>
        </div>
    </div>

    <!-- ===== 环境胶囊切换器 ===== -->
    <div class="env-switcher" id="envSwitcher">
        <span class="env-label">环境:</span>
        <span class="env-pill active" data-env="all">全部环境 <span class="dot green"></span></span>
        <span class="env-pill" data-env="prod">PROD · 生产 <span class="dot green"></span><span class="count" id="cnt-PROD">-</span></span>
        <span class="env-pill" data-env="sit">SIT · 测试 <span class="dot yellow"></span><span class="count" id="cnt-SIT">-</span></span>
        <span class="env-pill" data-env="uat">UAT · 验收 <span class="dot blue"></span><span class="count" id="cnt-UAT">-</span></span>
        <span class="env-pill" data-env="dev">DEV · 开发 <span class="dot purple"></span><span class="count" id="cnt-DEV">-</span></span>
    </div>
    <div class="env-banner" id="envBanner">
        <div class="bn-left"><i class="fa fa-history"></i><span id="envBannerText">当前视角: 全部环境</span></div>
        <div class="bn-right">
            <span class="btn" onclick="showToast('导出操作日志')"><i class="fa fa-download"></i> 导出</span>
            <span class="btn" onclick="showToast('按操作类型过滤')"><i class="fa fa-filter"></i> 高级筛选</span>
        </div>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>操作模块</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>接口管理</option>
                    <option>申请审核</option>
                    <option>分类管理</option>
                    <option>规则管理</option>
                    <option>系统管理</option>
                    <option>版本管理</option>
                </select>
            </div>
            <div class="form-item">
                <label>操作类型</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>新增</option>
                    <option>编辑</option>
                    <option>删除</option>
                    <option>审核</option>
                    <option>导出</option>
                </select>
            </div>
            <div class="form-item">
                <label>操作人</label>
                <input type="text" class="form-control" placeholder="姓名/工号">
            </div>
            <div class="form-item">
                <label>操作结果</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>成功</option>
                    <option>失败</option>
                </select>
            </div>
            <div class="form-item">
                <label>时间范围</label>
                <input type="date" class="form-control" value="2026-06-01">
            </div>
            <div class="form-item">
                <label>至</label>
                <input type="date" class="form-control" value="2026-06-04">
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary" onclick="envFilterApply()"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default" onclick="envFilterReset()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 操作日志表格 ====== -->
    <div class="card" style="margin-bottom:0">
        <div class="card-header">
            <div class="card-title">操作日志列表</div>
            <div class="card-action">
                <a href="javascript:;" onclick="showToast('批量清理已选日志')"><i class="fa fa-trash-o"></i> 批量清理</a>
            </div>
        </div>
        <div class="table-wrapper" style="border-radius:0;border-left:none;border-right:none;border-top:none;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:40px"><input type="checkbox"></th>
                        <th style="width:90px">日志ID</th>
                        <th style="width:110px" class="text-center">操作环境</th>
                        <th style="width:100px">操作模块</th>
                        <th style="width:80px" class="text-center">操作类型</th>
                        <th style="width:80px">操作人</th>
                        <th style="width:120px">操作人部门</th>
                        <th style="width:140px" class="text-center">操作时间</th>
                        <th>操作对象</th>
                        <th style="width:70px" class="text-center">操作结果</th>
                        <th style="width:120px">IP地址</th>
                        <th style="width:220px" class="text-center op-col">操作</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                    <tr id="loadingRow"><td colspan="12" style="padding:20px"><div style="display:flex;flex-direction:column;gap:12px"><div class="skeleton-bar" style="width:100%;height:16px"></div><div class="skeleton-bar" style="width:80%;height:16px"></div><div class="skeleton-bar" style="width:60%;height:16px"></div></div></td></tr>
                    <tr id="emptyRow" style="display:none"><td colspan="12" class="text-center" style="padding:40px;color:#94a3b8"><i class="fa fa-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>暂无数据</td></tr></tbody>
            </table>
            <div id="errorState" style="display:none;padding:60px 20px;text-align:center"><i class="fa fa-exclamation-triangle" style="font-size:48px;color:#dc2626;margin-bottom:12px"></i><p style="font-size:14px;color:#64748b;margin-bottom:16px">数据加载失败</p><button class="btn btn-primary" onclick="location.reload()"><i class="fa fa-refresh"></i> 重新加载</button></div>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary" id="logTotalCount">1,256</span> 条记录</div>
            <div class="page-list">
                <button onclick="showToast('跳转至上一页')"><i class="fa fa-angle-left"></i></button>
                <button class="active" onclick="showToast('当前第1页')">1</button>
                <button onclick="showToast('翻页演示')">2</button>
                <button onclick="showToast('翻页演示')">3</button>
                <button onclick="showToast('跳转至指定页')">...</button>
                <button onclick="showToast('翻页演示')">126</button>
                <button onclick="showToast('跳转至下一页')"><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px">
                    <option>10 条/页</option>
                    <option>20 条/页</option>
                    <option>50 条/页</option>
                </select>
            </div>
        </div>
    </div>

</div>

<script src="../../js/mock-data.js"></script>
<script>
// 环境标签渲染
function envBadge(env) {
    const map = {
        prod: { cls: 'tag-danger',  label: 'PROD' },
        uat:  { cls: 'tag-warning', label: 'UAT' },
        sit:  { cls: 'tag-info',    label: 'SIT' },
        dev:  { cls: 'tag-purple',  label: 'DEV' }
    };
    const item = map[env] || { cls: 'tag-default', label: env.toUpperCase() };
    return '<span class="tag ' + item.cls + '" style="font-size:11px">' + item.label + '</span>';
}

// 日志数据（含环境字段）
const LOGS = [
    { id:'LOG-10001', env:'prod', module:'接口管理', opType:{t:'新增',cls:'tag-info'},    user:'张运维', dept:'科技运维部', time:'2026-06-04 10:30', target:'API-ACCT-001 账户余额查询',     result:{t:'成功',cls:'tag-success'}, ip:'192.168.1.101' },
    { id:'LOG-10002', env:'prod', module:'申请审核', opType:{t:'审核',cls:'tag-success'}, user:'李审核', dept:'科技治理组', time:'2026-06-04 10:28', target:'REG-20260604-001 注册申请',       result:{t:'成功',cls:'tag-success'}, ip:'192.168.1.102' },
    { id:'LOG-10003', env:'uat',  module:'接口管理', opType:{t:'编辑',cls:'tag-warning'}, user:'王开发', dept:'核心研发部', time:'2026-06-04 09:45', target:'API-CDP-003 个人贷款申请',      result:{t:'成功',cls:'tag-success'}, ip:'192.168.2.55' },
    { id:'LOG-10004', env:'prod', module:'申请审核', opType:{t:'审核',cls:'tag-success'}, user:'李审核', dept:'科技治理组', time:'2026-06-04 09:40', target:'CHG-20260603-005 变更申请',       result:{t:'失败',cls:'tag-danger'},  ip:'192.168.1.102' },
    { id:'LOG-10005', env:'uat',  module:'分类管理', opType:{t:'编辑',cls:'tag-warning'}, user:'张运维', dept:'科技运维部', time:'2026-06-04 09:15', target:'L3-客户信息维护 分类调整',        result:{t:'成功',cls:'tag-success'}, ip:'192.168.1.101' },
    { id:'LOG-10006', env:'sit',  module:'系统管理', opType:{t:'新增',cls:'tag-info'},    user:'管理员', dept:'系统管理部', time:'2026-06-03 17:30', target:'用户 赵测试 账号创建',           result:{t:'成功',cls:'tag-success'}, ip:'10.0.0.1' },
    { id:'LOG-10007', env:'prod', module:'规则管理', opType:{t:'编辑',cls:'tag-warning'}, user:'张运维', dept:'科技运维部', time:'2026-06-03 16:20', target:'INT-R004 数据同步规则',          result:{t:'成功',cls:'tag-success'}, ip:'192.168.1.101' },
    { id:'LOG-10008', env:'uat',  module:'版本管理', opType:{t:'新增',cls:'tag-info'},    user:'王开发', dept:'核心研发部', time:'2026-06-03 14:10', target:'API-RISK-001 v2.1.0',              result:{t:'成功',cls:'tag-success'}, ip:'192.168.2.55' },
    { id:'LOG-10009', env:'prod', module:'接口管理', opType:{t:'删除',cls:'tag-danger'},  user:'张运维', dept:'科技运维部', time:'2026-06-03 11:00', target:'API-OLD-005 旧版转账接口',        result:{t:'成功',cls:'tag-success'}, ip:'192.168.1.101' },
    { id:'LOG-10010', env:'prod', module:'接口管理', opType:{t:'导出',cls:'tag-purple'},  user:'李审核', dept:'科技治理组', time:'2026-06-03 10:30', target:'接口清单导出（3981条）',          result:{t:'成功',cls:'tag-success'}, ip:'192.168.1.102' },
    { id:'LOG-10011', env:'sit',  module:'系统管理', opType:{t:'编辑',cls:'tag-warning'}, user:'管理员', dept:'系统管理部', time:'2026-06-02 17:00', target:'角色 运营管理员 权限调整',         result:{t:'成功',cls:'tag-success'}, ip:'10.0.0.1' },
    { id:'LOG-10012', env:'prod', module:'申请审核', opType:{t:'审核',cls:'tag-success'}, user:'李审核', dept:'科技治理组', time:'2026-06-02 15:20', target:'OFF-20260601-003 下线申请',        result:{t:'成功',cls:'tag-success'}, ip:'192.168.1.102' },
    { id:'LOG-10013', env:'sit',  module:'接口管理', opType:{t:'新增',cls:'tag-info'},    user:'王开发', dept:'核心研发部', time:'2026-06-02 11:05', target:'API-CUS-0021 客户画像查询(v2)',     result:{t:'成功',cls:'tag-success'}, ip:'10.20.0.21' },
    { id:'LOG-10014', env:'sit',  module:'规则管理', opType:{t:'编辑',cls:'tag-warning'}, user:'赵测试', dept:'科技治理组', time:'2026-06-02 09:50', target:'分类规则 R-SIT-088 调整',         result:{t:'失败',cls:'tag-danger'},  ip:'10.20.0.22' },
    { id:'LOG-10015', env:'dev',  module:'接口管理', opType:{t:'新增',cls:'tag-info'},    user:'赵测试', dept:'核心研发部', time:'2026-06-01 18:30', target:'API-DEV-0012 调试接口（测试）',    result:{t:'成功',cls:'tag-success'}, ip:'172.16.1.10' },
    { id:'LOG-10016', env:'dev',  module:'分类管理', opType:{t:'编辑',cls:'tag-warning'}, user:'王开发', dept:'核心研发部', time:'2026-06-01 15:12', target:'L2-客户信息 分类草稿',             result:{t:'成功',cls:'tag-success'}, ip:'172.16.1.11' },
    { id:'LOG-10017', env:'dev',  module:'版本管理', opType:{t:'新增',cls:'tag-info'},    user:'王开发', dept:'核心研发部', time:'2026-06-01 10:45', target:'API-CDP-DEV v0.9.3',              result:{t:'成功',cls:'tag-success'}, ip:'172.16.1.11' }
];

// 各环境总条数与最近时间
const ENV_TOTAL = {
    all:  { count:1256, label:'全部环境',  latest:'2026-06-04 10:30' },
    prod: { count:642,  label:'PROD(生产)', latest:'2026-06-04 10:30' },
    sit:  { count:184,  label:'SIT(测试)',  latest:'2026-06-02 09:50' },
    uat:  { count:310,  label:'UAT(验收)',  latest:'2026-06-04 09:45' },
    dev:  { count:120,  label:'DEV(开发)',  latest:'2026-06-01 18:30' }
};

function renderLogs(env) {
    var list = env === 'all' ? LOGS : LOGS.filter(function(l){ return l.env === env; });
    var body = document.getElementById('logBody');
    if (body) {
        body.innerHTML = list.map(function(l){
            return '<tr>'
                + '<td><input type="checkbox"></td>'
                + '<td style="font-family:\'Segoe UI\';color:var(--text-secondary)">' + l.id + '</td>'
                + '<td class="text-center">' + envBadge(l.env) + '</td>'
                + '<td>' + l.module + '</td>'
                + '<td class="text-center"><span class="tag ' + l.opType.cls + '" style="font-size:11px">' + l.opType.t + '</span></td>'
                + '<td>' + l.user + '</td>'
                + '<td>' + l.dept + '</td>'
                + '<td class="text-center" style="font-size:12px;color:var(--text-secondary)">' + l.time + '</td>'
                + '<td>' + l.target + '</td>'
                + '<td class="text-center"><span class="tag ' + l.result.cls + '" style="font-size:11px">' + l.result.t + '</span></td>'
                + '<td style="font-family:\'Segoe UI\';font-size:12px">' + l.ip + '</td>'
                + '<td class="text-center">'
                + '<button class="btn btn-sm btn-primary" onclick="showToast(\'查看操作详情 ' + l.id + '\n操作人：' + l.user + '\n模块：' + l.module + '\n对象：' + l.target + '\n请求参数：...\')"><i class="fa fa-eye"></i> 详情</button> '
                + '<button class="btn btn-sm btn-link" onclick="govNav(\'pages/system/user-mgmt.html\', [\'首页\', \'系统管理\', \'用户管理\'], {user:\'' + l.user + '\'})"><i class="fa fa-user"></i> 关联用户</button>'
                + '</td></tr>';
        }).join('');
    }
    var tc = document.getElementById('logTotalCount');
    var total = ENV_TOTAL[env] || ENV_TOTAL.all;
    if (tc) tc.textContent = total.count.toLocaleString();

    // 胶囊角标计数
    var cntIds = { prod:'cnt-PROD', sit:'cnt-SIT', uat:'cnt-UAT', dev:'cnt-DEV' };
    Object.keys(cntIds).forEach(function(k){
        var el = document.getElementById(cntIds[k]);
        if (el) el.textContent = ENV_TOTAL[k].count;
    });
    // 横幅
    var banner = document.getElementById('envBannerText');
    if (banner) banner.textContent = '当前视角: ' + total.label + ' · 操作日志 ' + total.count.toLocaleString() + ' 条 · 最近操作: ' + total.latest;
}

function switchEnv(env) {
    document.querySelectorAll('#envSwitcher .env-pill').forEach(function(p){
        p.classList.toggle('active', p.getAttribute('data-env') === env);
    });
    renderLogs(env);
}

document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('#envSwitcher .env-pill').forEach(function(p){
        p.addEventListener('click', function(){ switchEnv(this.getAttribute('data-env')); });
    });
    renderLogs('all');
});

function envFilterApply() { renderLogs('all'); }
function envFilterReset() { renderLogs('all'); }

function _getParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name) || '';
}
</script>
    <script>
// 模拟加载状态：800ms后隐藏loadingRow
(function(){
    var lr=document.getElementById('loadingRow');
    if(lr){setTimeout(function(){lr.style.display='none';},800);}
})();
</script>
