<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版本对比 - 服务治理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <script src="../../js/nav-helper.js"></script>
    <style>
        .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
        .compare-box { border: 1px solid var(--border); border-radius: 8px; background: #fff; }
        .compare-head { padding: 14px 16px; background: #f8fafc; border-bottom: 1px solid var(--border); font-weight: 600; }
        .compare-body { padding: 16px; font-size: 13px; line-height: 1.8; }
        .empty-tip { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-columns" style="color:var(--primary);margin-right:8px"></i>版本批量对比</h2>
            <div class="page-desc">首页 / 服务治理 / 版本列表 / 版本对比 - 对比选中接口的版本差异</div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="govNav('pages/version/list.html', ['首页','服务治理','版本列表'], {})"><i class="fa fa-arrow-left"></i> 返回列表</button>
        </div>
    </div>
    <div id="compareRoot"></div>
</div>
<script>
function _getParam(key) { return govGetParam(key); }
(function() {
    var codes = (_getParam('codes') || '').split(',').filter(function(c){ return !!c; });
    var root = document.getElementById('compareRoot');
    if (codes.length < 2) {
        root.innerHTML = '<div class="empty-tip"><i class="fa fa-info-circle" style="font-size:32px;margin-bottom:12px;display:block"></i>请至少选择 2 个接口进行对比</div>';
        return;
    }
    var pairs = codes.slice(0, 2);
    if (codes.length > 2) {
        root.innerHTML = '<div style="margin-bottom:12px;color:var(--text-secondary);font-size:13px"><i class="fa fa-info-circle"></i> 仅展示前两个选中接口的对比</div>';
    }
    var html = '<div class="compare-grid">';
    pairs.forEach(function(code) {
        html += '<div class="compare-box">' +
            '<div class="compare-head"><i class="fa fa-cube"></i> ' + code + '</div>' +
            '<div class="compare-body">' +
            '<p><strong>当前环境版本：</strong>PROD v1.0</p>' +
            '<p><strong>基础信息：</strong>服务编码 ' + code + '</p>' +
            '<p><strong>版本状态：</strong><span class="tag tag-success">正式版本</span></p>' +
            '<p><strong>对比说明：</strong>此处为简化对比视图，正式环境可通过选中接口进入详情页查看完整版本信息。</p>' +
            '</div></div>';
    });
    html += '</div>';
    root.innerHTML = html;
})();
</script>
</body>
</html>
