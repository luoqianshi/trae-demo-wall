<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限总览 - 系统管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        /* ====== 页面私有样式 ====== */
        .main-content {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
        }

        /* 用户列表面板 */
        .user-list-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            height: calc(100vh - 180px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .search-box {
            margin-bottom: 12px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--primary);
        }
        .org-filter-tree {
            margin-bottom: 12px;
            padding: 8px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
        }
        .org-filter-tree .tree-node {
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .org-filter-tree .tree-node:hover {
            background: #eff6ff;
            color: var(--primary);
        }
        .org-filter-tree .tree-node.active {
            background: var(--primary);
            color: white;
        }
        .user-list {
            flex: 1;
            overflow-y: auto;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
        }
        .user-item:hover {
            background: #f8fafc;
        }
        .user-item.active {
            background: #eff6ff;
            border-left: 3px solid var(--primary);
        }
        .user-item.active .user-name {
            color: var(--primary);
            font-weight: 600;
        }
        .user-item.active .user-meta,
        .user-item.active .user-role-count {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.12);
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 10px;
            font-size: 13px;
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .user-meta {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .user-role-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: #f8fafc;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 权限详情面板 */
        .permission-detail-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            min-height: calc(100vh - 180px);
        }

        /* 用户信息卡片：统一为标准指标卡风格 */
        .user-info-card {
            background: #fff;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            padding: 20px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }
        .user-info-card .avatar-lg {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            margin-right: 20px;
            flex-shrink: 0;
        }
        .user-info-card .user-details {
            flex: 1;
        }
        .user-info-card .user-details h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .user-info-card .user-details h3 small {
            color: var(--text-secondary);
            font-weight: normal;
            font-size: 13px;
        }
        .user-info-card .user-details .sub-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .user-info-card .permission-stats-row {
            display: flex;
            gap: 16px;
            margin-top: 12px;
        }
        .user-info-card .stat-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            min-width: 90px;
            text-align: center;
        }
        .user-info-card .stat-box .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }
        .user-info-card .stat-box .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Tab 导航：统一为胶囊/分段式 */
        .tab-nav {
            display: inline-flex;
            gap: 6px;
            padding: 5px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 999px;
            margin-bottom: 16px;
        }
        .tab-nav .tab {
            padding: 8px 18px;
            cursor: pointer;
            font-size: 13px;
            color: #475569;
            border-radius: 999px;
            transition: all 0.2s;
            user-select: none;
        }
        .tab-nav .tab:hover {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.06);
        }
        .tab-nav .tab.active {
            background: #fff;
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .tab-nav .tab .badge {
            background: var(--danger);
            color: white;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 4px;
        }

        .tab-content.hidden {
            display: none;
        }

        /* 角色列表 */
        .role-section {
            margin-bottom: 20px;
        }
        .role-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .role-section-title .icon {
            margin-right: 8px;
        }
        .role-card {
            background: #fff;
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            transition: all 0.2s;
        }
        .role-card:hover {
            background: #eff6ff;
        }
        .role-card.source-static { border-left-color: #7c3aed; }
        .role-card.source-dynamic { border-left-color: #0891b2; }
        .role-card.source-override { border-left-color: #f59e0b; }

        .role-card .role-main {
            flex: 1;
        }
        .role-card .role-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .role-card .role-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .role-card .role-source-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 8px;
        }
        .role-card .role-source-tag.static { background: #e9d5ff; color: #7c3aed; }
        .role-card .role-source-tag.dynamic { background: #a5f3fc; color: #0891b2; }
        .role-card .role-source-tag.override { background: #fef3c7; color: #f59e0b; }

        .role-card .role-actions {
            display: flex;
            gap: 8px;
        }
        .role-card .role-actions .view-perms {
            font-size: 12px;
            color: var(--primary);
            cursor: pointer;
        }

        /* 权限详情弹窗 */
        .perm-detail-list {
            margin-top: 8px;
            padding: 8px 12px;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .perm-detail-list .perm-item {
            padding: 6px 0;
            font-size: 12px;
            border-bottom: 1px dashed var(--border);
        }
        .perm-detail-list .perm-item:last-child {
            border-bottom: none;
        }
        .perm-detail-list .perm-item .perm-path {
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 2px;
        }

        /* 权限冲突：左侧红边 callout */
        .conflict-card {
            background: #fff;
            border: 1px solid var(--border);
            border-left: 4px solid var(--danger);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 10px;
        }
        .conflict-card .conflict-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .conflict-card .conflict-title {
            font-size: 13px;
            font-weight: 500;
            color: #991b1b;
        }
        .conflict-card .conflict-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .conflict-card .conflict-sources {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        .conflict-card .conflict-sources .source-box {
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            flex: 1;
            font-size: 12px;
        }
        .conflict-card .conflict-sources .source-box .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .conflict-card .conflict-sources .source-box .value {
            font-weight: 500;
        }
        .conflict-card .conflict-actions {
            display: flex;
            gap: 8px;
        }

        /* 变更历史 */
        .history-timeline {
            position: relative;
            padding-left: 20px;
        }
        .history-timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }
        .history-item {
            position: relative;
            padding-bottom: 16px;
        }
        .history-item::before {
            content: '';
            position: absolute;
            left: -17px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid white;
            box-shadow: 0 0 0 1px var(--primary);
        }
        .history-item .history-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .history-item .history-content {
            font-size: 12px;
            color: var(--text-primary);
        }
        .history-item .history-operator {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .history-item.add::before { background: var(--success); box-shadow: 0 0 0 1px var(--success); }
        .history-item.remove::before { background: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
        .history-item.change::before { background: var(--warning); box-shadow: 0 0 0 1px var(--warning); }

        /* 空状态 */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
            display: block;
        }

        /* 筛选组 */
        .filter-group {
            display: flex;
            gap: 8px;
        }
        .filter-group select {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            background: var(--bg-card);
            cursor: pointer;
        }
    </style>
    <script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-shield" style="color:#7c3aed;margin-right:8px"></i>权限总览</h2>
            <div class="page-desc">首页 / 系统管理 / 权限总览 - 查看用户最终生效权限，包括静态分配、动态解析及人工调整</div>
        </div>
        <div class="action-group">
            <div class="filter-group">
                <select id="orgFilter" onchange="filterUsers()">
                    <option value="">所有组织</option>
                    <option value="beijing">北京分行</option>
                    <option value="shanghai">上海分行</option>
                    <option value="guangzhou">广州分行</option>
                    <option value="shenzhen">深圳分行</option>
                </select>
                <select id="sourceFilter" onchange="filterUsers()">
                    <option value="">所有来源</option>
                    <option value="static">仅静态分配</option>
                    <option value="dynamic">仅动态解析</option>
                    <option value="override">仅人工调整</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="exportPermissions()"><i class="fa fa-download"></i> 导出权限清单</button>
        </div>
    </div>

    <!-- ====== 主内容区 ====== -->
    <div class="main-content">

        <!-- 左侧用户列表 -->
        <div class="user-list-panel">
            <div class="search-box">
                <input type="text" id="userSearch" placeholder="搜索用户姓名或工号..." oninput="searchUsers(this.value)">
            </div>
            <div class="org-filter-tree" id="orgFilterTree">
                <div class="tree-node active" data-org="all"><i class="fa fa-sitemap"></i> 全部组织</div>
                <div class="tree-node" data-org="hq" style="padding-left:20px"><i class="fa fa-building"></i> 总行</div>
                <div class="tree-node" data-org="beijing" style="padding-left:28px"><i class="fa fa-bank"></i> 北京分行</div>
                <div class="tree-node" data-org="shanghai" style="padding-left:28px"><i class="fa fa-bank"></i> 上海分行</div>
                <div class="tree-node" data-org="guangzhou" style="padding-left:28px"><i class="fa fa-bank"></i> 广州分行</div>
                <div class="tree-node" data-org="shenzhen" style="padding-left:28px"><i class="fa fa-bank"></i> 深圳分行</div>
            </div>
            <div class="user-list" id="userList">
                <div id="loadingRow" style="text-align:center; padding:40px 20px;">
                    <div style="display:inline-block;">
                        <i class="fa fa-spinner fa-pulse fa-2x fa-fw" style="color:var(--primary);"></i>
                        <p style="margin-top:12px;color:var(--text-secondary);font-size:13px;">数据加载中...</p>
                    </div>
                </div>
                <!-- 用户列表将由JS动态生成 -->
            </div>
            <div id="errorState" style="display:none; text-align:center; padding:40px 20px;">
                <i class="fa fa-exclamation-circle" style="font-size:36px;color:var(--danger);"></i>
                <p style="margin-top:12px;color:var(--text-secondary);font-size:13px;">数据加载失败</p>
                <button class="btn btn-default" style="margin-top:12px;" onclick="location.reload()"><i class="fa fa-refresh"></i> 重新加载</button>
            </div>
        </div>

        <!-- 右侧权限详情 -->
        <div class="permission-detail-panel">

            <!-- 用户信息卡片 -->
            <div class="user-info-card" id="userInfoCard">
                <!-- 用户信息卡片将由JS动态生成 -->
            </div>

            <!-- Tab 导航 -->
            <div class="tab-nav">
                <div class="tab active" data-tab="effective-roles">最终生效角色</div>
                <div class="tab" data-tab="conflicts">权限冲突 <span class="badge" id="conflictBadge">0</span></div>
                <div class="tab" data-tab="history">变更历史</div>
            </div>

            <!-- Tab: 最终生效角色 -->
            <div class="tab-content" id="tab-effective-roles">
                <div id="effectiveRolesContent">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- Tab: 权限冲突 -->
            <div class="tab-content hidden" id="tab-conflicts">
                <div id="conflictsContent">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- Tab: 变更历史 -->
            <div class="tab-content hidden" id="tab-history">
                <div id="historyContent">
                    <!-- 动态生成 -->
                </div>
            </div>

        </div>
    </div>
</div>

<script src="../../js/mock-data.js"></script>
<script>
// ==================== 模拟数据 ====================
const MOCK_USERS = [
    {
        id: 'U001', name: '张伟', dept: '信息科技部 / 架构设计组', org: 'hq',
        staticRoles: [
            { id: 'R001', name: '系统管理员', desc: '拥有系统全部管理权限', perms: ['用户管理', '角色管理', '参数配置', '数据权限'] }
        ],
        dynamicRoles: [],
        overrideRoles: [],
        conflicts: []
    },
    {
        id: 'U002', name: '李娜', dept: '信息科技部 / 开发一组', org: 'hq',
        staticRoles: [
            { id: 'R002', name: '服务开发人员', desc: '负责服务的开发和注册维护', perms: ['服务查询', '服务注册申请', '版本管理'] }
        ],
        dynamicRoles: [
            { id: 'R003', name: '部门负责人', desc: '基于组织架构自动解析', perms: ['部门服务审批', '部门成员管理'], source: 'direct:dept_head', reason: '开发一组组长' }
        ],
        overrideRoles: [],
        conflicts: [
            { id: 'C001', title: '数据范围冲突', desc: '静态角色"服务开发人员"的本部门数据范围与动态角色"部门负责人"的全部门数据范围不一致', sources: [{ label: '静态分配', value: '本组数据' }, { label: '动态解析', value: '全部门数据' }], resolution: '已自动采用较大范围: 全部门数据' }
        ]
    },
    {
        id: 'U003', name: '王强', dept: '风险部 / 模型验证组', org: 'beijing',
        staticRoles: [
            { id: 'R004', name: '风控分析师', desc: '风控模型的分析和验证工作', perms: ['风控数据查询', '模型验证'] }
        ],
        dynamicRoles: [
            { id: 'R005', name: '直属上级审批人', desc: '动态角色: 当用户作为他人的直属上级时获得', perms: ['下属申请审批'] , source: 'dynamic:manager', reason: '管理3名下属'}
        ],
        overrideRoles: [],
        conflicts: []
    },
    {
        id: 'U004', name: '陈静', dept: '北京分行 / 营业部', org: 'beijing',
        staticRoles: [],
        dynamicRoles: [
            { id: 'R006', name: '分行负责人', desc: '基于组织架构自动解析', perms: ['分行业务审批', '分行业务数据查询'], source: 'dynamic:branch_head', reason: '北京分行营业部经理' }
        ],
        overrideRoles: [
            { id: 'R007', name: '特殊业务权限', desc: '临时覆盖: 支持跨境业务审批', perms: ['跨境业务审批'], source: 'override:temporary', reason: '临时业务调整', expiresAt: '2026-12-31' }
        ],
        conflicts: []
    },
    {
        id: 'U005', name: '刘洋', dept: '上海分行 / 信息科技部', org: 'shanghai',
        staticRoles: [
            { id: 'R008', name: '运维人员', desc: '负责系统日常运维', perms: ['系统监控', '日志查询'] }
        ],
        dynamicRoles: [],
        overrideRoles: [],
        conflicts: []
    },
    {
        id: 'U006', name: '赵敏', dept: '广州分行 / 风险部', org: 'guangzhou',
        staticRoles: [
            { id: 'R009', name: '业务审查员', desc: '负责业务合规审查', perms: ['业务数据查询', '合规审查'] }
        ],
        dynamicRoles: [],
        overrideRoles: [],
        conflicts: []
    }
];

let currentUser = MOCK_USERS[0];

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', function() {
    renderUserList();
    renderUserDetail(currentUser);

    // 组织筛选交互
    document.querySelectorAll('.org-filter-tree .tree-node').forEach(node => {
        node.addEventListener('click', function() {
            document.querySelectorAll('.org-filter-tree .tree-node').forEach(n => n.classList.remove('active'));
            this.classList.add('active');
            filterByOrg(this.dataset.org);
        });
    });

    // Tab 切换
    document.querySelectorAll('.tab-nav .tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tab-nav .tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const tabId = this.dataset.tab;
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        });
    });
});

// ==================== 用户列表渲染 ====================
function renderUserList(users) {
    const list = document.getElementById('userList');
    const displayUsers = users || MOCK_USERS;

    list.innerHTML = displayUsers.map(user => {
        const totalRoles = user.staticRoles.length + user.dynamicRoles.length + user.overrideRoles.length;
        const initial = user.name.charAt(0);
        const isActive = user.id === currentUser.id ? 'active' : '';
        return `
            <div class="user-item ${isActive}" onclick="selectUser('${user.id}')">
                <div class="user-avatar">${initial}</div>
                <div class="user-info">
                    <div class="user-name">${user.name} <small style="color:var(--text-secondary);font-weight:normal">(${user.id})</small></div>
                    <div class="user-meta">${user.dept}</div>
                </div>
                <div class="user-role-count">${totalRoles} 角色</div>
            </div>
        `;
    }).join('');
}

function searchUsers(keyword) {
    if (!keyword.trim()) {
        renderUserList();
        return;
    }
    const filtered = MOCK_USERS.filter(u =>
        u.name.includes(keyword) || u.id.toLowerCase().includes(keyword.toLowerCase())
    );
    renderUserList(filtered);
}

function filterByOrg(orgCode) {
    if (orgCode === 'all') {
        renderUserList();
        return;
    }
    const filtered = MOCK_USERS.filter(u => u.org === orgCode);
    renderUserList(filtered);
}

function filterUsers() {
    // 综合筛选
    const org = document.getElementById('orgFilter').value;
    const source = document.getElementById('sourceFilter').value;
    let filtered = MOCK_USERS;
    if (org) filtered = filtered.filter(u => u.org === org);
    if (source === 'static') filtered = filtered.filter(u => u.staticRoles.length > 0);
    if (source === 'dynamic') filtered = filtered.filter(u => u.dynamicRoles.length > 0);
    if (source === 'override') filtered = filtered.filter(u => u.overrideRoles.length > 0);
    renderUserList(filtered);
}

function selectUser(userId) {
    currentUser = MOCK_USERS.find(u => u.id === userId);
    renderUserList();
    renderUserDetail(currentUser);
}

// ==================== 用户详情渲染 ====================
function renderUserDetail(user) {
    // 用户信息卡片
    const infoCard = document.getElementById('userInfoCard');
    const totalStatic = user.staticRoles.length;
    const totalDynamic = user.dynamicRoles.length;
    const totalOverride = user.overrideRoles.length;
    const totalRoles = totalStatic + totalDynamic + totalOverride;

    infoCard.innerHTML = `
        <div class="avatar-lg">${user.name.charAt(0)}</div>
        <div class="user-details">
            <h3>${user.name} <small>(${user.id})</small></h3>
            <div class="sub-info"><i class="fa fa-building"></i> ${user.dept}</div>
            <div class="permission-stats-row">
                <div class="stat-box">
                    <div class="stat-value">${totalRoles}</div>
                    <div class="stat-label">总角色数</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${totalStatic}</div>
                    <div class="stat-label">静态分配</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${totalDynamic}</div>
                    <div class="stat-label">动态解析</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${totalOverride}</div>
                    <div class="stat-label">人工调整</div>
                </div>
            </div>
        </div>
    `;

    // 最终生效角色
    renderEffectiveRoles(user);

    // 权限冲突
    renderConflicts(user);

    // 变更历史
    renderHistory(user);

    // 更新冲突标记
    document.getElementById('conflictBadge').textContent = user.conflicts.length;
    document.getElementById('conflictBadge').style.display = user.conflicts.length > 0 ? 'inline' : 'none';
}

function renderEffectiveRoles(user) {
    const content = document.getElementById('effectiveRolesContent');
    let html = '';

    // 静态分配角色
    html += `
        <div class="role-section">
            <div class="role-section-title">
                <i class="fa fa-user-plus icon" style="color:#7c3aed"></i>
                静态分配角色 (${user.staticRoles.length})
            </div>
            ${user.staticRoles.length === 0 ? '<div class="empty-state" style="padding:20px;font-size:12px">暂无静态分配角色</div>' :
                user.staticRoles.map(role => renderRoleCard(role, 'static')).join('')
            }
        </div>
    `;

    // 动态解析角色
    html += `
        <div class="role-section">
            <div class="role-section-title">
                <i class="fa fa-refresh icon" style="color:#0891b2"></i>
                动态解析角色 (${user.dynamicRoles.length})
                <small style="margin-left:12px;color:var(--text-secondary);font-weight:normal;font-size:11px">
                    <i class="fa fa-info-circle"></i> 基于组织架构自动解析，随架构变化动态更新
                </small>
            </div>
            ${user.dynamicRoles.length === 0 ? '<div class="empty-state" style="padding:20px;font-size:12px">暂无动态解析的角色</div>' :
                user.dynamicRoles.map(role => renderRoleCard(role, 'dynamic')).join('')
            }
        </div>
    `;

    // 人工调整（覆盖）角色
    html += `
        <div class="role-section">
            <div class="role-section-title">
                <i class="fa fa-pencil icon" style="color:#f59e0b"></i>
                人工调整 (${user.overrideRoles.length})
                <small style="margin-left:12px;color:var(--text-secondary);font-weight:normal;font-size:11px">
                    <i class="fa fa-info-circle"></i> 管理员手动调整，优先级最高
                </small>
            </div>
            ${user.overrideRoles.length === 0 ? '<div class="empty-state" style="padding:20px;font-size:12px">暂无人工调整</div>' :
                user.overrideRoles.map(role => renderRoleCard(role, 'override')).join('')
            }
        </div>
    `;

    content.innerHTML = html;
}

function renderRoleCard(role, sourceType) {
    const sourceText = sourceType === 'static' ? '静态分配' : sourceType === 'dynamic' ? '动态解析' : '人工调整';
    const extraInfo = role.reason ? `<span style="color:var(--text-secondary);font-size:11px;margin-left:8px">· ${role.reason}</span>` : '';
    const expiryInfo = role.expiresAt ? `<span style="color:var(--warning);font-size:11px;margin-left:8px">· 有效期至 ${role.expiresAt}</span>` : '';

    return `
        <div class="role-card source-${sourceType}">
            <div class="role-main">
                <div class="role-name">
                    <span class="role-source-tag ${sourceType}">${sourceText}</span>
                    ${role.name}
                    ${extraInfo}
                    ${expiryInfo}
                </div>
                <div class="role-desc">${role.desc}</div>
            </div>
            <div class="role-actions">
                <span class="view-perms" onclick="togglePermDetail('${role.id}')">
                    <i class="fa fa-list-alt"></i> 查看权限 (${role.perms.length})
                </span>
            </div>
            <div class="perm-detail-list" id="perm-detail-${role.id}" style="display:none;grid-column:1/-1;margin-top:10px">
                ${role.perms.map(p => `
                    <div class="perm-item">
                        <i class="fa fa-check-circle" style="color:var(--success);margin-right:6px"></i>${p}
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

function togglePermDetail(roleId) {
    const el = document.getElementById('perm-detail-' + roleId);
    if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
}

function renderConflicts(user) {
    const content = document.getElementById('conflictsContent');

    if (user.conflicts.length === 0) {
        content.innerHTML = `
            <div class="empty-state">
                <i class="fa fa-check-circle" style="color:var(--success)"></i>
                当前用户的权限配置无冲突
            </div>
        `;
        return;
    }

    content.innerHTML = user.conflicts.map(c => `
        <div class="conflict-card">
            <div class="conflict-header">
                <div class="conflict-title">
                    <i class="fa fa-exclamation-triangle" style="margin-right:6px"></i>${c.title}
                </div>
                <span class="tag tag-warning">待处理</span>
            </div>
            <div class="conflict-desc">${c.desc}</div>
            <div class="conflict-sources">
                ${c.sources.map(s => `
                    <div class="source-box">
                        <div class="label">${s.label}</div>
                        <div class="value">${s.value}</div>
                    </div>
                `).join('')}
            </div>
            <div style="font-size:11px;color:var(--success);margin-bottom:10px">
                <i class="fa fa-check-circle"></i> 当前解析结果: ${c.resolution}
            </div>
            <div class="conflict-actions">
                <button class="btn btn-sm btn-primary"><i class="fa fa-check"></i> 保留当前方案</button>
                <button class="btn btn-sm"><i class="fa fa-pencil"></i> 手动调整</button>
            </div>
        </div>
    `).join('');
}

function renderHistory(user) {
    const content = document.getElementById('historyContent');
    const history = [
        { time: '2026-06-08 14:23', type: 'add', content: `新增静态角色"${user.staticRoles[0]?.name || '服务开发人员'}"`, operator: '系统管理员(张伟)' },
        { time: '2026-06-07 09:15', type: 'change', content: '组织架构调整: 由"开发二组"调至"开发一组"，触发动态角色重解析', operator: '组织架构变更(自动)' },
        { time: '2026-06-07 09:15', type: 'add', content: `动态解析新增角色"${user.dynamicRoles[0]?.name || '部门负责人'}"`, operator: '系统(自动)' },
        { time: '2026-06-01 10:00', type: 'remove', content: '移除临时角色"项目评审员"', operator: '李经理' }
    ];

    content.innerHTML = `
        <div class="history-timeline">
            ${history.map(h => `
                <div class="history-item ${h.type}">
                    <div class="history-time">${h.time}</div>
                    <div class="history-content">${h.content}</div>
                    <div class="history-operator">操作人: ${h.operator}</div>
                </div>
            `).join('')}
        </div>
    `;
}

function exportPermissions() {
    showToast('已生成 ' + currentUser.name + ' 的权限清单报告 (PDF)');
}

// 加载状态自动隐藏
window.addEventListener('load', function() {
    setTimeout(function() {
        var lr = document.getElementById('loadingRow');
        if (lr) lr.style.display = 'none';
    }, 800);
});
</script>
</body>
</html>
