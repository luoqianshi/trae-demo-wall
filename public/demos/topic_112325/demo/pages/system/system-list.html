<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接入系统清单 - 服务目录</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-cubes" style="color:var(--primary);margin-right:8px"></i>接入系统清单</h2>
            <div class="page-desc">
                首页 / 服务目录 / 接入系统清单 - 全行接入系统统一查询，支持查看系统完整档案、接口与文件服务清单
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="showToast('正在导出系统清单...')"><i class="fa fa-download"></i> 导出</button>
            <button class="btn btn-primary" onclick="govNav('pages/system/system-apply.html', ['首页','服务目录','新增系统接入'], {})"><i class="fa fa-plus-circle"></i> 新增系统接入</button>
        </div>
    </div>

    <!-- 快捷说明横幅 -->
    <div style="background:linear-gradient(90deg,#eff6ff,#f0fdfa);border:1px solid #bfdbfe;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:13px;color:#1e40af;display:flex;align-items:center;gap:12px">
        <i class="fa fa-info-circle" style="font-size:18px;color:#2563eb"></i>
        <span><b>快捷操作说明：</b>点击"查看档案"查看系统完整信息 · "接口清单"查看该系统对外提供的接口服务</span>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>系统名称</label>
                <input type="text" id="searchName" class="form-control" placeholder="请输入系统名称">
            </div>
            <div class="form-item">
                <label>所属部门</label>
                <select id="searchDept" class="form-control">
                    <option value="">全部</option>
                    <option>科技部</option>
                    <option>业务部</option>
                    <option>风险部</option>
                    <option>运营部</option>
                    <option>财务部</option>
                </select>
            </div>
            <div class="form-item">
                <label>状态</label>
                <select id="searchStatus" class="form-control">
                    <option value="">全部</option>
                    <option>启用</option>
                    <option>停用</option>
                </select>
            </div>
            <div class="form-item">
                <button class="btn btn-primary" onclick="filterSystems()"><i class="fa fa-search"></i> 搜索</button>
                <button class="btn btn-default" onclick="resetSystemFilters()"><i class="fa fa-refresh"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 表格内容区 ====== -->
    <div class="card" style="position:relative">
        <!-- 加载中状态 -->
        <div id="systemLoading" style="display:flex;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.8);z-index:10;align-items:center;justify-content:center;">
            <div style="text-align:center;">
                <i class="fa fa-spinner fa-pulse fa-2x" style="color:var(--primary)"></i>
                <div style="margin-top:8px;color:var(--text-secondary);font-size:13px">加载中...</div>
            </div>
        </div>
        <div class="table-wrapper" style="border:none;border-radius:0;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>系统编码</th>
                        <th>系统名称</th>
                        <th>所属部门</th>
                        <th>负责人</th>
                        <th class="text-center">接口数量</th>
                        <th class="text-center">文件服务数量</th>
                        <th class="text-center">状态</th>
                        <th>创建时间</th>
                        <th class="text-center op-col" style="min-width:120px">操作</th>
                    </tr>
                </thead>
                <tbody id="systemBody"></tbody>
            </table>
        </div>

        <!-- 空数据状态 -->
        <div id="systemEmpty" style="display:none;padding:40px;text-align:center;color:var(--text-secondary);">
            <i class="fa fa-inbox" style="font-size:48px;color:#d9d9d9"></i>
            <div style="margin-top:12px;font-size:14px">暂无符合条件的系统</div>
        </div>

        <!-- ====== 分页器 ====== -->
        <div class="pagination">
            <div class="page-info">共 <b>128</b> 条记录，当前第 <b>1</b> / <b>13</b> 页</div>
            <div class="page-list">
                <button disabled onclick="goToPage(1)"><i class="fa fa-angle-double-left"></i></button>
                <button disabled onclick="goToPage(0)"><i class="fa fa-angle-left"></i></button>
                <button class="active" onclick="goToPage(1)">1</button>
                <button onclick="goToPage(2)">2</button>
                <button onclick="goToPage(3)">3</button>
                <button onclick="goToPage(4)">4</button>
                <button onclick="goToPage(5)">5</button>
                <button onclick="goToPage(2)"><i class="fa fa-angle-right"></i></button>
                <button onclick="goToPage(13)"><i class="fa fa-angle-double-right"></i></button>
            </div>
            <div class="page-size">
                <span>每页</span>
                <select><option>10</option><option>20</option><option>50</option></select>
                <span>条</span>
            </div>
        </div>
    </div>

</div>

<script src="../../js/mock-data.js"></script>
<script>
// ====== 接入系统清单页面交互逻辑 ======

// 系统数据
var systems = [
    { code: 'SYS-0001', name: '核心业务系统',      dept: '科技部', owner: '李建华', apiCount: 186, fileCount: 23, status: '启用', created: '2026-03-15 09:32' },
    { code: 'SYS-0002', name: '信贷管理系统',      dept: '业务部', owner: '王志强', apiCount: 142, fileCount: 18, status: '启用', created: '2026-04-02 14:20' },
    { code: 'SYS-0003', name: '客户关系管理系统',  dept: '业务部', owner: '陈晓明', apiCount: 98,  fileCount: 12, status: '启用', created: '2026-05-18 11:05' },
    { code: 'SYS-0004', name: '风险管理系统',      dept: '风险部', owner: '赵丽华', apiCount: 76,  fileCount: 9,  status: '启用', created: '2026-06-10 16:48' },
    { code: 'SYS-0005', name: '财务管理系统',      dept: '财务部', owner: '孙海涛', apiCount: 54,  fileCount: 8,  status: '启用', created: '2026-06-22 10:15' },
    { code: 'SYS-0006', name: '反洗钱监测系统',    dept: '风险部', owner: '周文斌', apiCount: 42,  fileCount: 6,  status: '启用', created: '2026-06-03 13:40' },
    { code: 'SYS-0007', name: '电子银行渠道系统',  dept: '运营部', owner: '吴美玲', apiCount: 128, fileCount: 15, status: '启用', created: '2026-06-12 08:55' },
    { code: 'SYS-0008', name: '人力资源管理系统',  dept: '运营部', owner: '郑文博', apiCount: 35,  fileCount: 4,  status: '停用', created: '2026-06-05 15:22' },
    { code: 'SYS-0009', name: '数据仓库平台',      dept: '科技部', owner: '马天宇', apiCount: 215, fileCount: 28, status: '启用', created: '2026-06-18 17:08' },
    { code: 'SYS-0010', name: '理财产品销售系统',  dept: '业务部', owner: '刘雅婷', apiCount: 67,  fileCount: 11, status: '启用', created: '2025-01-09 11:30' },
    { code: 'SYS-0011', name: '信用卡核心系统',    dept: '业务部', owner: '黄嘉诚', apiCount: 153, fileCount: 19, status: '停用', created: '2025-02-14 09:45' },
    { code: 'SYS-0012', name: '运营监控平台',      dept: '运营部', owner: '徐佳慧', apiCount: 29,  fileCount: 3,  status: '启用', created: '2025-03-28 14:12' }
];

// 渲染系统表格（P0修复：面包屑改为 ['首页','服务目录','接入系统清单']）
function renderSystems(list) {
    var tbody = document.getElementById('systemBody');
    var empty = document.getElementById('systemEmpty');
    if (list.length === 0) {
        tbody.innerHTML = '';
        if (empty) empty.style.display = 'block';
        return;
    }
    if (empty) empty.style.display = 'none';
    tbody.innerHTML = list.map(function(s) {
        var isActive = s.status === '启用';
        return '<tr>' +
            '<td class="num"><a href="javascript:void(0)" onclick="govNav(\'pages/system/system-profile.html\', [\'首页\', \'服务目录\', \'接入系统清单\'], {id:\'' + s.code + '\'})" style="color:var(--primary);font-weight:600">' + s.code + '</a></td>' +
            '<td>' + s.name + '</td>' +
            '<td>' + s.dept + '</td>' +
            '<td>' + s.owner + '</td>' +
            '<td class="text-center num">' + s.apiCount + '</td>' +
            '<td class="text-center num">' + s.fileCount + '</td>' +
            '<td class="text-center"><span class="tag ' + (isActive ? 'tag-success' : 'tag-default') + '">' + s.status + '</span></td>' +
            '<td>' + s.created + '</td>' +
            '<td class="text-center" style="white-space:nowrap">' +
                '<button class="btn btn-link" style="padding:2px 4px" onclick="govNav(\'pages/system/system-profile.html\', [\'首页\', \'服务目录\', \'接入系统清单\'], {id:\'' + s.code + '\'})"><i class="fa fa-eye"></i> 查看档案</button>' +
                '<button class="btn btn-link" style="padding:2px 4px" onclick="govNav(\'pages/service/service-list.html\', [\'首页\', \'服务目录\', \'服务清单\'], {system:\'' + s.name + '\'})"><i class="fa fa-list"></i> 服务清单</button>' +
            '</td>' +
        '</tr>';
    }).join('');
}

// 按条件搜索系统：读取筛选条件，过滤数据后重新渲染
function filterSystems() {
    var name = document.getElementById('searchName').value.trim().toLowerCase();
    var dept = document.getElementById('searchDept').value;
    var status = document.getElementById('searchStatus').value;

    var filtered = systems.filter(function(s) {
        if (name && s.name.toLowerCase().indexOf(name) < 0) return false;
        if (dept && s.dept !== dept) return false;
        if (status && s.status !== status) return false;
        return true;
    });
    renderSystems(filtered);
}

// 重置筛选条件，显示所有系统
function resetSystemFilters() {
    document.getElementById('searchName').value = '';
    document.getElementById('searchDept').selectedIndex = 0;
    document.getElementById('searchStatus').selectedIndex = 0;
    renderSystems(systems);
}

// 翻页（Demo占位）
function goToPage(pageNum) {
    showToast('跳转到第 ' + pageNum + ' 页');
}

// 隐藏加载状态
function hideSystemLoading() {
    var el = document.getElementById('systemLoading');
    if (el) el.style.display = 'none';
}

// 页面初始化：渲染数据 + 模拟加载延迟
renderSystems(systems);
setTimeout(hideSystemLoading, 500);
</script>
</body>
</html>
