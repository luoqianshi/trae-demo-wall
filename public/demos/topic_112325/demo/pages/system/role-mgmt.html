<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色权限管理 - 系统管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        .role-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: all 0.15s; }
        .role-item:hover { background: #f8fafc; }
        .role-item.active { background: #eff6ff; border-left: 3px solid var(--primary); }
        .role-item .role-name { font-weight: 600; margin-bottom: 4px; }
        .role-desc { font-size: 12px; color: var(--text-secondary); }
        .perm-tree { font-size: 13px; }
        .perm-row { padding: 8px 12px; border-bottom: 1px dashed var(--border); display: flex; align-items: center; justify-content: space-between; }
        .perm-row:last-child { border-bottom: none; }
        .perm-row .module { font-weight: 600; }
        .perm-actions { display: flex; gap: 20px; font-size: 13px; align-items: center; }
        .perm-actions label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
        .perm-actions input[type=checkbox] { cursor: pointer; }
        .indent-1 { padding-left: 36px; background: #fafbfc; }
        .indent-2 { padding-left: 56px; }

        /* ========== 角色来源表格专用样式 ========== */
        /* 动态角色行：左侧青色竖条标记 */
        .dynamic-role {
            border-left: 3px solid #0891b2 !important;
            background: #f0fdfa;
        }
        .dynamic-role:hover { background: #e0f7f5; }

        /* 行内多标签间距 */
        .role-source-tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

        /* "已覆盖" 额外标记 */
        .tag-overridden {
            background: #fff7ed;
            color: #c2410c;
            border: 1px solid #fed7aa;
            font-weight: 600;
        }

        /* 操作列按钮紧凑样式 */
        .op-btn {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            cursor: pointer;
            margin-right: 4px;
            transition: all 0.15s;
        }
        .op-btn:hover { border-color: var(--primary); color: var(--primary); }
        .op-btn:active { background: #eff6ff; }
        .op-btn.primary { border-color: var(--primary); color: var(--primary); }
        .op-btn.primary:hover { background: var(--primary); color: #fff; }
        .op-btn.warn { border-color: #f97316; color: #f97316; }
        .op-btn.warn:hover { background: #f97316; color: #fff; }
        .op-btn.danger { border-color: var(--danger); color: var(--danger); }
        .op-btn.danger:hover { background: var(--danger); color: #fff; }
        .op-btn.disabled,
        .op-btn[disabled] {
            color: #cbd5e1;
            border-color: #e2e8f0;
            cursor: not-allowed;
            background: #f8fafc;
        }
        .op-btn[disabled]:hover {
            border-color: #e2e8f0;
            color: #cbd5e1;
            background: #f8fafc;
        }

        /* ========== 覆盖弹窗 ========== */
        .modal-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .modal-mask.show { display: flex; }
        .modal-box {
            width: 480px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .modal-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; }
        .modal-close {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 16px;
            padding: 4px;
            line-height: 1;
        }
        .modal-close:hover { color: var(--text); }
        .modal-body { padding: 20px; }
        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            text-align: right;
            background: #f8fafc;
        }
        .form-row { margin-bottom: 16px; }
        .form-row:last-child { margin-bottom: 0; }
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-label .req { color: var(--danger); margin-right: 2px; }
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            color: var(--text);
            background: #fff;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-input[readonly] { background: #f1f5f9; color: var(--text-secondary); cursor: not-allowed; }
        .form-textarea { resize: vertical; min-height: 72px; }
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.15);
        }

        /* 提示条 */
        .dynamic-tip {
            font-size: 12px;
            color: #0e7490;
            background: #ecfeff;
            border: 1px solid #a5f3fc;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 12px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        /* ========== 新增：角色行选中态 ========== */
        .role-row { transition: background 0.15s; }
        .role-row.active { background: #eff6ff; box-shadow: inset 3px 0 0 var(--primary); }

        /* ========== 新增：权限数据范围下拉 ========== */
        .perm-data-scope {
            padding: 3px 6px;
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            color: var(--text);
            margin-left: 4px;
        }
        .perm-data-scope:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.15);
        }

        /* ========== 新增：权限面板切换闪烁动画 ========== */
        @keyframes permPanelFlash {
            0%   { background: #fff; }
            35%  { background: #eff6ff; }
            100% { background: #fff; }
        }
        .perm-panel-flash { animation: permPanelFlash 0.7s ease; }

        /* ========== 新增：单选按钮组 ========== */
        .radio-group { display: flex; gap: 24px; padding-top: 4px; }
        .radio-group label {
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .radio-group input[type=radio] { cursor: pointer; }
        .form-hint { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

        /* ========== 新增：空状态 ========== */
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-state i { font-size: 36px; color: var(--text-secondary); }
        .empty-state p { margin-top: 12px; color: var(--text-secondary); font-size: 13px; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-key" style="color:var(--primary);margin-right:8px"></i>角色权限管理</h2>
            <div class="page-desc">
                首页 / 系统管理 / 角色权限管理 - 管理系统角色及各模块权限配置，支持查看、编辑、审批等权限颗粒度配置
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="openCopyRoleModal()"><i class="fa fa-copy"></i> 复制角色</button>
            <button class="btn btn-primary" onclick="openAddRoleModal()"><i class="fa fa-plus"></i> 新增角色</button>
        </div>
    </div>

    <!-- ====== 主内容：左侧角色列表表格 + 右侧权限配置 ====== -->
    <div style="display:grid;grid-template-columns:480px 1fr;gap:16px;align-items:start;">

        <!-- ====== 左侧：角色列表（含角色来源列） ====== -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">角色列表</div>
                <div class="card-action"><a href="javascript:;" onclick="renderRoleList();showToast('角色列表已刷新')"><i class="fa fa-refresh"></i> 刷新</a></div>
            </div>
            <div class="table-wrapper" style="border:none;border-radius:0;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="min-width:110px;">角色名称</th>
                            <th style="min-width:160px;">角色来源</th>
                            <th class="text-center" style="min-width:60px;">人数</th>
                            <th class="text-center op-col" style="min-width:210px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="roleTbody">
                        <!-- 由 renderRoleList() 动态渲染 -->
                    </tbody>
                </table>
            </div>
            <div id="errorState" style="display:none; text-align:center; padding:40px 20px;">
                <i class="fa fa-exclamation-circle" style="font-size:36px;color:var(--danger);"></i>
                <p style="margin-top:12px;color:var(--text-secondary);font-size:13px;">数据加载失败</p>
                <button class="btn btn-default" style="margin-top:12px;" onclick="location.reload()"><i class="fa fa-refresh"></i> 重新加载</button>
            </div>
            <div class="dynamic-tip">
                <i class="fa fa-info-circle" style="margin-top:2px;"></i>
                <span>带青色边框的行为动态解析角色，由系统规则自动计算，不可直接编辑。如需临时调整，请点击"覆盖"按钮进行人工调整。</span>
            </div>
        </div>

        <!-- ====== 右侧：权限配置 ====== -->
        <div class="card" id="permPanel">
            <div class="card-header">
                <div class="card-title" id="permPanelTitle">权限配置 - 系统管理员</div>
                <div class="card-action"><a href="javascript:;"><i class="fa fa-users"></i> 关联用户 (<span id="permUserCount">5</span>人)</a></div>
            </div>
            <div class="card-body" id="permPanelBody">
                <!-- 由 renderPermissionPanel() 动态渲染 -->
            </div>
        </div>
    </div>

    <!-- ====== 覆盖弹窗（保持不变） ====== -->
    <div class="modal-mask" id="overrideModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fa fa-exclamation-triangle" style="color:#f97316;margin-right:6px;"></i>覆盖动态角色 — <span id="overrideRoleName"></span></h3>
                <span class="modal-close" onclick="closeOverrideModal()"><i class="fa fa-times"></i></span>
            </div>
            <div class="modal-body">
                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;padding:10px 12px;background:#f0fdfa;border:1px solid #a5f3fc;border-radius:4px;">
                    该角色由动态规则 <b id="overrideRuleName" style="color:#0e7490;"></b> 自动解析，覆盖后将以人工配置为准。
                </div>

                <div class="form-row">
                    <label class="form-label"><span class="req">*</span>覆盖原因</label>
                    <select class="form-select" id="overrideReason">
                        <option value="">请选择覆盖原因</option>
                        <option value="临时调整">临时调整</option>
                        <option value="特殊情况">特殊情况</option>
                        <option value="系统解析错误">系统解析错误</option>
                        <option value="其他原因">其他原因</option>
                    </select>
                </div>

                <div class="form-row">
                    <label class="form-label"><span class="req">*</span>备注说明</label>
                    <textarea class="form-textarea" id="overrideRemark" placeholder="请详细说明此次覆盖的具体原因，便于审计追溯..."></textarea>
                </div>

                <div class="form-row">
                    <label class="form-label"><span class="req">*</span>有效期至</label>
                    <input type="date" class="form-input" id="overrideExpire">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" onclick="closeOverrideModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmOverride()"><i class="fa fa-check"></i> 确认覆盖</button>
            </div>
        </div>
    </div>

    <!-- ====== 新增/编辑/复制角色弹窗 ====== -->
    <div class="modal-mask" id="roleModal">
        <div class="modal-box" style="width:520px;">
            <div class="modal-header">
                <h3><i class="fa fa-user-plus" style="color:var(--primary);margin-right:6px;"></i><span id="roleModalTitle">新增角色</span></h3>
                <span class="modal-close" onclick="closeRoleModal()"><i class="fa fa-times"></i></span>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label class="form-label"><span class="req">*</span>角色名称</label>
                    <input type="text" class="form-input" id="roleNameInput" placeholder="请输入角色名称" maxlength="20">
                </div>
                <div class="form-row">
                    <label class="form-label"><span class="req">*</span>角色编码（大写字母+下划线，如 ROLE_TECH_AUDITOR）</label>
                    <input type="text" class="form-input" id="roleCodeInput" placeholder="ROLE_XXX" maxlength="50">
                </div>
                <div class="form-row">
                    <label class="form-label">角色描述</label>
                    <textarea class="form-textarea" id="roleDescInput" placeholder="请输入角色描述（选填）" maxlength="200"></textarea>
                </div>
                <div class="form-row">
                    <label class="form-label"><span class="req">*</span>角色类型</label>
                    <div class="radio-group">
                        <label><input type="radio" name="roleType" value="静态分配"> 静态分配</label>
                        <label><input type="radio" name="roleType" value="人工调整"> 人工调整</label>
                    </div>
                    <div class="form-hint">注：动态解析类型角色由系统规则自动生成，不可手动新建。</div>
                </div>
                <div class="form-row">
                    <label class="form-label"><span class="req">*</span>数据权限范围</label>
                    <select class="form-select" id="roleDataScopeInput">
                        <option value="">请选择数据权限范围</option>
                        <option value="全行">全行</option>
                        <option value="本部门">本部门</option>
                        <option value="指定部门">指定部门</option>
                        <option value="指定业务域">指定业务域</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" onclick="closeRoleModal()">取消</button>
                <button class="btn btn-primary" onclick="saveRole()"><i class="fa fa-save"></i> 保存</button>
            </div>
        </div>
    </div>

</div>

<script>
/* ============================================================
 * 角色权限管理 - 数据模型与交互逻辑
 * ============================================================ */

/**
 * 构建单个权限项
 * @param {boolean} view 查看
 * @param {boolean} edit 编辑
 * @param {boolean} approve 审批
 * @param {string} [dataScope] 数据范围（仅顶层模块）
 */
function p(view, edit, approve, dataScope) {
    var o = { view: !!view, edit: !!edit, approve: !!approve };
    if (dataScope) o.dataScope = dataScope;
    return o;
}

/* ---------- 权限模块树结构 ---------- */
var PERMISSION_MODULES = [
    { key: 'system', name: '系统管理', icon: 'fa-cube', iconColor: 'var(--primary)', children: [
        { key: 'system_list', name: '系统清单' },
        { key: 'system_access', name: '系统接入申请' },
        { key: 'system_archive', name: '系统档案' }
    ]},
    { key: 'interface', name: '接口管理', icon: 'fa-plug', iconColor: 'var(--info)', children: [
        { key: 'interface_register', name: '接口注册' },
        { key: 'interface_grade', name: '接口分级' }
    ]},
    { key: 'file', name: '文件服务管理', icon: 'fa-file-archive-o', iconColor: 'var(--warning)', children: [
        { key: 'file_register', name: '文件服务注册' }
    ]},
    { key: 'audit', name: '审核中心', icon: 'fa-check-square-o', iconColor: 'var(--success)', children: [] },
    { key: 'monitor', name: '监控中心', icon: 'fa-bar-chart', iconColor: 'var(--accent)', children: [] },
    { key: 'settings', name: '系统设置', icon: 'fa-cog', iconColor: 'var(--text-secondary)', children: [
        { key: 'user_mgmt', name: '用户管理' },
        { key: 'role_mgmt', name: '角色权限管理' },
        { key: 'param_config', name: '参数配置' }
    ]}
];

/* ---------- 各角色默认权限配置（用于区分角色） ---------- */
// 系统管理员：全权限
var PERM_ADMIN = {
    'system': p(true, true, true, '全行'),
    'system_list': p(true, true, false),
    'system_access': p(true, true, true),
    'system_archive': p(true, true, false),
    'interface': p(true, true, true, '全行'),
    'interface_register': p(true, true, true),
    'interface_grade': p(true, true, false),
    'file': p(true, true, true, '全行'),
    'file_register': p(true, true, true),
    'audit': p(true, true, true, '全行'),
    'monitor': p(true, true, false, '全行'),
    'settings': p(true, true, true, '全行'),
    'user_mgmt': p(true, true, false),
    'role_mgmt': p(true, true, true),
    'param_config': p(true, true, true)
};
// 申请人：仅查看+提交申请，无审批
var PERM_APPLICANT = {
    'system': p(true, false, false, '本部门'),
    'system_list': p(true, false, false),
    'system_access': p(true, true, false),
    'system_archive': p(true, false, false),
    'interface': p(true, false, false, '本部门'),
    'interface_register': p(true, true, false),
    'interface_grade': p(true, false, false),
    'file': p(true, false, false, '本部门'),
    'file_register': p(true, true, false),
    'audit': p(true, false, false, '仅本人'),
    'monitor': p(false, false, false, '本部门'),
    'settings': p(false, false, false, '本部门'),
    'user_mgmt': p(false, false, false),
    'role_mgmt': p(false, false, false),
    'param_config': p(false, false, false)
};
// 接口注册申请人：可编辑接口模块
var PERM_IFACE_APPLICANT = {
    'system': p(true, false, false, '本部门'),
    'system_list': p(true, false, false),
    'system_access': p(true, true, false),
    'system_archive': p(true, false, false),
    'interface': p(true, true, false, '本部门'),
    'interface_register': p(true, true, false),
    'interface_grade': p(true, true, false),
    'file': p(true, false, false, '本部门'),
    'file_register': p(true, true, false),
    'audit': p(true, false, false, '仅本人'),
    'monitor': p(true, false, false, '本部门'),
    'settings': p(false, false, false, '本部门'),
    'user_mgmt': p(false, false, false),
    'role_mgmt': p(false, false, false),
    'param_config': p(false, false, false)
};
// 技术审核员：查看全部 + 技术模块审批
var PERM_TECH_AUDITOR = {
    'system': p(true, false, true, '全行'),
    'system_list': p(true, false, false),
    'system_access': p(true, false, true),
    'system_archive': p(true, false, false),
    'interface': p(true, false, true, '全行'),
    'interface_register': p(true, false, true),
    'interface_grade': p(true, false, true),
    'file': p(true, false, true, '全行'),
    'file_register': p(true, false, true),
    'audit': p(true, true, true, '全行'),
    'monitor': p(true, false, false, '全行'),
    'settings': p(false, false, false, '全行'),
    'user_mgmt': p(false, false, false),
    'role_mgmt': p(false, false, false),
    'param_config': p(false, false, false)
};
// 安全审核员：查看全部 + 安全合规审批
var PERM_SEC_AUDITOR = {
    'system': p(true, false, true, '全行'),
    'system_list': p(true, false, false),
    'system_access': p(true, false, true),
    'system_archive': p(true, false, false),
    'interface': p(true, false, true, '全行'),
    'interface_register': p(true, false, true),
    'interface_grade': p(true, false, true),
    'file': p(true, false, true, '全行'),
    'file_register': p(true, false, true),
    'audit': p(true, true, true, '全行'),
    'monitor': p(true, false, true, '全行'),
    'settings': p(false, false, false, '全行'),
    'user_mgmt': p(false, false, false),
    'role_mgmt': p(false, false, false),
    'param_config': p(false, false, false)
};
// 行领导：查看全部 + 高级别审批
var PERM_LEADER = {
    'system': p(true, false, true, '全行'),
    'system_list': p(true, false, false),
    'system_access': p(true, false, true),
    'system_archive': p(true, false, false),
    'interface': p(true, false, true, '全行'),
    'interface_register': p(true, false, true),
    'interface_grade': p(true, false, true),
    'file': p(true, false, true, '全行'),
    'file_register': p(true, false, true),
    'audit': p(true, true, true, '全行'),
    'monitor': p(true, false, false, '全行'),
    'settings': p(false, false, false, '全行'),
    'user_mgmt': p(false, false, false),
    'role_mgmt': p(false, false, false),
    'param_config': p(false, false, false)
};
// 外包测试员：仅查看指定模块
var PERM_OUTSOURCE = {
    'system': p(true, false, false, '指定部门'),

/* ---------- 运行时状态 ---------- */
var currentRoleId = 'r5';      // 当前选中角色（默认系统管理员）
var roleModalMode = 'add';     // 弹窗模式：add | edit | copy
var roleModalSourceId = null;  // 编辑/复制时的源角色ID

/* ============================================================
 * 通用工具函数
 * ============================================================ */

/** 按ID查找角色 */
function getRoleById(id) {
    for (var i = 0; i < ROLES_DATA.length; i++) {
        if (ROLES_DATA[i].id === id) return ROLES_DATA[i];
    }
    return null;
}

/** 深拷贝权限配置对象 */
function clonePermissions(perm) {
    var result = {};
    for (var k in perm) {
        if (!perm.hasOwnProperty(k)) continue;
        result[k] = {};
        for (var prop in perm[k]) {
            if (perm[k].hasOwnProperty(prop)) result[k][prop] = perm[k][prop];
        }
    }
    return result;
}

/** 构建全空的权限配置（用于新增角色） */
function buildEmptyPermissions() {
    var result = {};
    PERMISSION_MODULES.forEach(function (mod) {
        result[mod.key] = { view: false, edit: false, approve: false, dataScope: '全行' };
        mod.children.forEach(function (child) {
            result[child.key] = { view: false, edit: false, approve: false };
        });
    });
    return result;
}

/** 初始化各角色的初始权限快照（用于重置） */
function initData() {
    ROLES_DATA.forEach(function (role) {
        role._initialPermissions = clonePermissions(role.permissions);
    });
}

/** 清空单选按钮组 */
function clearRadios(name) {
    var radios = document.getElementsByName(name);
    for (var i = 0; i < radios.length; i++) radios[i].checked = false;
}

/** 设置单选按钮组选中值 */
function setRadioValue(name, value) {
    var radios = document.getElementsByName(name);
    for (var i = 0; i < radios.length; i++) {
        radios[i].checked = (radios[i].value === value);
    }
}

/** 获取单选按钮组选中值 */
function getRadioValue(name) {
    var radios = document.getElementsByName(name);
    for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) return radios[i].value;
    }
    return null;
}

/* ============================================================
 * 渲染：角色列表
 * ============================================================ */
function renderRoleList() {
    var tbody = document.getElementById('roleTbody');
    var html = '';

    // 加载态行（保持隐藏，覆盖加载场景）
    html += '<tr id="loadingRow" style="display:none">' +
            '<td colspan="4" style="text-align:center; padding:40px 20px;">' +
                '<div style="display:inline-block;">' +
                    '<i class="fa fa-spinner fa-pulse fa-2x fa-fw" style="color:var(--primary);"></i>' +
                    '<p style="margin-top:12px;color:var(--text-secondary);font-size:13px;">数据加载中...</p>' +
                '</div>' +
            '</td></tr>';

    // 空状态
    if (ROLES_DATA.length === 0) {
        html += '<tr><td colspan="4" class="empty-state">' +
                '<i class="fa fa-inbox"></i><p>暂无角色数据，请点击"新增角色"创建</p>' +
                '</td></tr>';
        tbody.innerHTML = html;
        return;
    }

    // 角色行
    ROLES_DATA.forEach(function (role) {
        var isActive = role.id === currentRoleId ? ' active' : '';
        var dynClass = role.dynamic ? ' dynamic-role' : '';
        html += '<tr class="role-row' + dynClass + isActive + '" data-id="' + role.id + '">';

        // 名称列
        html += '<td><div style="font-weight:600;">' + role.name;
        if (role.dynamic) {
            var spin = role.overridden ? '' : ' fa-spin';
            var title = role.overridden ? '动态角色（已覆盖）' : '动态角色';
            html += ' <i class="fa fa-refresh' + spin + '" style="font-size:11px;color:#0891b2;margin-left:4px;" title="' + title + '"></i>';
        }
        html += '</div><div class="role-desc">' + role.desc + '</div></td>';

        // 角色来源列
        html += '<td><div class="role-source-tags">';
        if (role.dynamic) {
            if (role.overridden) {
                html += '<span class="tag tag-warning">人工调整</span>';
                html += '<span class="tag tag-cyan" style="opacity:0.7;">动态解析</span>';
                html += '<span class="tag tag-overridden">已覆盖</span>';
            } else {
                html += '<span class="tag tag-cyan">动态解析</span>';
                html += '<span class="role-desc" style="font-size:11px;">' + role.dynamicRule + '</span>';
            }
        } else {
            var tagClass = role.type === '静态分配' ? 'tag-info' : 'tag-warning';
            html += '<span class="tag ' + tagClass + '">' + role.type + '</span>';
        }
        html += '</div></td>';

        // 人数列
        html += '<td class="text-center">' + role.userCount + '</td>';

        // 操作列
        html += '<td class="text-center op-col">';
        if (role.dynamic) {
            // 动态角色：编辑禁用 + 权限 + 覆盖
            html += '<button class="op-btn primary" disabled title="动态角色不可直接编辑">编辑</button>';
            html += '<button class="op-btn" onclick="switchPermission(\'' + role.id + '\')">权限</button>';
            html += '<button class="op-btn warn" onclick="openOverrideModal(\'' + role.name + '\', \'' + role.dynamicRule + '\')">覆盖</button>';
        } else {
            // 静态分配/人工调整：编辑 + 权限 + 删除
            html += '<button class="op-btn primary" onclick="openEditRoleModal(\'' + role.id + '\')">编辑</button>';
            html += '<button class="op-btn" onclick="switchPermission(\'' + role.id + '\')">权限</button>';
            html += '<button class="op-btn danger" onclick="deleteRole(\'' + role.id + '\')">删除</button>';
        }
        html += '</td>';

        html += '</tr>';
    });

    tbody.innerHTML = html;
}

/* ============================================================
 * 渲染：权限配置面板
 * ============================================================ */
function renderPermissionPanel() {
    var role = getRoleById(currentRoleId);
    var titleEl = document.getElementById('permPanelTitle');
    var userCountEl = document.getElementById('permUserCount');
    var body = document.getElementById('permPanelBody');

    // 无选中角色时显示空状态
    if (!role) {
        titleEl.textContent = '权限配置';
        userCountEl.textContent = '0';
        body.innerHTML = '<div class="empty-state">' +
            '<i class="fa fa-lock"></i><p>请先在左侧选择一个角色</p></div>';
        return;
    }

    titleEl.textContent = '权限配置 - ' + role.name;
    userCountEl.textContent = role.userCount;

    var html = '';

    // 快速操作栏
    html += '<div style="display:flex;gap:12px;margin-bottom:16px;padding:12px 16px;background:#f1f5f9;border-radius:6px;align-items:center;">';
    html += '<span style="font-size:13px;color:var(--text-secondary);">快速操作：</span>';
    html += '<label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="qaView" checked style="margin-right:4px;cursor:pointer;">全部查看</label>';
    html += '<label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="qaEdit" checked style="margin-right:4px;cursor:pointer;">全部编辑</label>';
    html += '<label style="font-size:13px;cursor:pointer;"><input type="checkbox" id="qaApprove" style="margin-right:4px;cursor:pointer;">全部审批</label>';
    html += '<button class="btn btn-default" style="margin-left:auto;padding:4px 12px;font-size:12px;" onclick="applyQuickAction()"><i class="fa fa-check"></i> 应用</button>';
    html += '</div>';

    // 权限树
    html += '<div class="perm-tree">';
    PERMISSION_MODULES.forEach(function (mod) {
        var perm = role.permissions[mod.key] || { view: false, edit: false, approve: false, dataScope: '全行' };
        var scope = perm.dataScope || '全行';

        // 顶层模块行（含数据范围下拉）
        html += '<div class="perm-row">';
        html += '<div class="module"><i class="fa ' + mod.icon + '" style="color:' + mod.iconColor + ';margin-right:6px;"></i>' + mod.name + '</div>';
        html += '<div class="perm-actions">';
        html += buildCheckbox(mod.key, 'view', perm.view);
        html += buildCheckbox(mod.key, 'edit', perm.edit);
        html += buildCheckbox(mod.key, 'approve', perm.approve);
        html += '<select class="perm-data-scope" data-mod="' + mod.key + '" onchange="updateDataScope(this)" title="数据范围">';
        ['全行', '本部门', '仅本人'].forEach(function (s) {
            html += '<option value="' + s + '"' + (s === scope ? ' selected' : '') + '>' + s + '</option>';
        });
        html += '</select>';
        html += '</div>';
        html += '</div>';

        // 子菜单行（继承父级数据范围，无需下拉）
        mod.children.forEach(function (child) {
            var cperm = role.permissions[child.key] || { view: false, edit: false, approve: false };
            html += '<div class="perm-row indent-1">';
            html += '<div>' + child.name + '</div>';
            html += '<div class="perm-actions">';
            html += buildCheckbox(child.key, 'view', cperm.view);
            html += buildCheckbox(child.key, 'edit', cperm.edit);
            html += buildCheckbox(child.key, 'approve', cperm.approve);
            html += '</div>';
            html += '</div>';
        });
    });
    html += '</div>';

    // 保存/重置按钮
    html += '<div style="margin-top:20px;text-align:right;">';
    html += '<button class="btn btn-default" onclick="resetPermissionConfig()"><i class="fa fa-refresh"></i> 重置</button>';
    html += '<button class="btn btn-primary" onclick="savePermissionConfig()"><i class="fa fa-save"></i> 保存配置</button>';
    html += '</div>';

    body.innerHTML = html;

    // 切换闪烁动画提示
    var panel = document.getElementById('permPanel');
    panel.classList.remove('perm-panel-flash');
    void panel.offsetWidth; // 触发重绘以重启动画
    panel.classList.add('perm-panel-flash');
}

/** 构建权限复选框 label */
function buildCheckbox(modKey, act, checked) {
    var labels = { view: '查看', edit: '编辑', approve: '审批' };
    return '<label><input type="checkbox" data-mod="' + modKey + '" data-act="' + act + '" onchange="onPermChange(this)"' + (checked ? ' checked' : '') + '> ' + labels[act] + '</label>';
}

/* ============================================================
 * 角色列表交互：切换/编辑/删除
 * ============================================================ */

/** 点击"权限"按钮：切换右侧面板到该角色 */
function switchPermission(roleId) {
    currentRoleId = roleId;
    renderRoleList();
    renderPermissionPanel();
    var role = getRoleById(roleId);
    showToast('已切换到角色：' + role.name);
}

/** 点击"编辑"按钮：打开编辑弹窗 */
function openEditRoleModal(roleId) {
    var role = getRoleById(roleId);
    if (!role) return;
    roleModalMode = 'edit';
    roleModalSourceId = roleId;
    document.getElementById('roleModalTitle').textContent = '编辑角色';
    document.getElementById('roleNameInput').value = role.name;
    document.getElementById('roleCodeInput').value = role.code;
    document.getElementById('roleCodeInput').readOnly = true; // 编辑时编码只读
    document.getElementById('roleDescInput').value = role.desc;
    setRadioValue('roleType', role.type);
    document.getElementById('roleDataScopeInput').value = role.dataScope;
    document.getElementById('roleModal').classList.add('show');
}

/** 点击"删除"按钮：确认后删除角色 */
function deleteRole(roleId) {
    var role = getRoleById(roleId);
    if (!role) return;
    if (role.dynamic) { showToast('动态角色不可删除'); return; }
    var msg = '确认删除' + role.name + '？该角色下' + role.userCount + '个用户将需要重新分配角色';
    if (!confirm(msg)) return;

    // 从数据中移除
    var idx = -1;
    for (var i = 0; i < ROLES_DATA.length; i++) {
        if (ROLES_DATA[i].id === roleId) { idx = i; break; }
    }
    if (idx >= 0) ROLES_DATA.splice(idx, 1);

    showToast('角色 [' + role.name + '] 已删除');

    // 若删除的是当前选中角色，切换到第一个
    if (currentRoleId === roleId) {
        currentRoleId = ROLES_DATA.length > 0 ? ROLES_DATA[0].id : null;
        renderPermissionPanel();
    }
    renderRoleList();
}

/* ============================================================
 * 新增/编辑/复制角色弹窗
 * ============================================================ */

/** 打开新增角色弹窗 */
function openAddRoleModal() {
    roleModalMode = 'add';
    roleModalSourceId = null;
    document.getElementById('roleModalTitle').textContent = '新增角色';
    document.getElementById('roleNameInput').value = '';
    document.getElementById('roleCodeInput').value = '';
    document.getElementById('roleCodeInput').readOnly = false;
    document.getElementById('roleDescInput').value = '';
    clearRadios('roleType');
    document.getElementById('roleDataScopeInput').value = '';
    document.getElementById('roleModal').classList.add('show');
}

/** 打开复制角色弹窗（预填当前选中角色） */
function openCopyRoleModal() {
    if (!currentRoleId) { showToast('请先在左侧列表选择一个角色'); return; }
    var role = getRoleById(currentRoleId);
    if (!role) { showToast('请先在左侧列表选择一个角色'); return; }

    roleModalMode = 'copy';
    roleModalSourceId = currentRoleId;
    document.getElementById('roleModalTitle').textContent = '复制角色（复制自 ' + role.name + '）';
    document.getElementById('roleNameInput').value = '';       // 名称置空
    document.getElementById('roleCodeInput').value = '';       // 编码置空
    document.getElementById('roleCodeInput').readOnly = false;
    document.getElementById('roleDescInput').value = role.desc;
    setRadioValue('roleType', role.type);
    document.getElementById('roleDataScopeInput').value = role.dataScope;
    document.getElementById('roleModal').classList.add('show');
}

/** 关闭角色弹窗 */
function closeRoleModal() {
    document.getElementById('roleModal').classList.remove('show');
}

/** 保存角色（新增/编辑/复制） */
function saveRole() {
    var mode = roleModalMode;
    var sourceId = roleModalSourceId;

    var name = document.getElementById('roleNameInput').value.trim();
    var code = document.getElementById('roleCodeInput').value.trim();
    var desc = document.getElementById('roleDescInput').value.trim();
    var type = getRadioValue('roleType');
    var dataScope = document.getElementById('roleDataScopeInput').value;

    // 必填校验
    if (!name) { showToast('请输入角色名称'); return; }
    if (!code) { showToast('请输入角色编码'); return; }
    // 编码格式：大写字母+下划线，字母开头
    if (!/^[A-Z][A-Z_]*$/.test(code)) {
        showToast('角色编码只能包含大写字母和下划线，且以字母开头');
        return;
    }
    if (!type) { showToast('请选择角色类型'); return; }
    if (!dataScope) { showToast('请选择数据权限范围'); return; }

    if (mode === 'edit') {
        // 编辑：更新现有角色（编码不可改）
        var role = getRoleById(sourceId);
        if (!role) { showToast('角色不存在'); return; }
        role.name = name;
        role.desc = desc;
        role.type = type;
        role.dataScope = dataScope;
        showToast('角色 [' + name + '] 已更新');
    } else {
        // 新增/复制：校验编码唯一
        for (var i = 0; i < ROLES_DATA.length; i++) {
            if (ROLES_DATA[i].code === code) { showToast('角色编码已存在，请更换'); return; }
        }
        var newRole = {
            id: 'r_' + Date.now(),
            name: name,
            code: code,
            desc: desc,
            type: type,
            dataScope: dataScope,
            userCount: 0,
            dynamic: false,
            overridden: false,
            dynamicRule: '',
            permissions: {}
        };
        if (mode === 'copy') {
            // 复制源角色权限
            var src = getRoleById(sourceId);
            newRole.permissions = clonePermissions(src.permissions);
        } else {
            // 新增：默认空权限
            newRole.permissions = buildEmptyPermissions();
        }
        newRole._initialPermissions = clonePermissions(newRole.permissions);
        ROLES_DATA.push(newRole);
        showToast(mode === 'copy' ? '角色 [' + name + '] 已复制创建' : '角色 [' + name + '] 已创建');
    }

    closeRoleModal();
    renderRoleList();
    // 若编辑的是当前角色，刷新面板标题/人数
    if (mode === 'edit' && sourceId === currentRoleId) {
        renderPermissionPanel();
    }
}

/* ============================================================
 * 权限配置交互：勾选/数据范围/保存/重置/应用
 * ============================================================ */

/** 权限复选框变更：同步到角色数据 */
function onPermChange(el) {
    var role = getRoleById(currentRoleId);
    if (!role) return;
    var mod = el.getAttribute('data-mod');
    var act = el.getAttribute('data-act');
    if (role.permissions[mod]) {
        role.permissions[mod][act] = el.checked;
    }
}

/** 数据范围下拉变更：同步到角色数据 */
function updateDataScope(el) {
    var role = getRoleById(currentRoleId);
    if (!role) return;
    var mod = el.getAttribute('data-mod');
    if (role.permissions[mod]) {
        role.permissions[mod].dataScope = el.value;
    }
}

/** 保存配置：确认后快照当前权限 */
function savePermissionConfig() {
    var role = getRoleById(currentRoleId);
    if (!role) return;
    if (!confirm('确认修改' + role.name + '的权限配置？')) return;
    // 将当前权限快照为初始状态（重置基准更新为已保存状态）
    role._initialPermissions = clonePermissions(role.permissions);
    showToast('角色 [' + role.name + '] 的权限配置已保存');
}

/** 重置：恢复到上次保存的配置 */
function resetPermissionConfig() {
    var role = getRoleById(currentRoleId);
    if (!role) return;
    role.permissions = clonePermissions(role._initialPermissions);
    renderPermissionPanel();
    showToast('已重置为上次保存的配置');
}

/** 应用快速操作：将全选状态应用到所有权限项 */
function applyQuickAction() {
    var role = getRoleById(currentRoleId);
    if (!role) return;
    var view = document.getElementById('qaView').checked;
    var edit = document.getElementById('qaEdit').checked;
    var approve = document.getElementById('qaApprove').checked;
    for (var key in role.permissions) {
        if (!role.permissions.hasOwnProperty(key)) continue;
        role.permissions[key].view = view;
        role.permissions[key].edit = edit;
        role.permissions[key].approve = approve;
    }
    renderPermissionPanel();
    showToast('快速操作已应用到全部权限项');
}

/* ============================================================
 * 覆盖弹窗（保持原有功能不变）
 * ============================================================ */

/**
 * 打开覆盖动态角色的弹窗
 * @param {string} roleName 角色名
 * @param {string} ruleName 动态规则名
 */
function openOverrideModal(roleName, ruleName) {
    document.getElementById('overrideRoleName').textContent = roleName;
    document.getElementById('overrideRuleName').textContent = ruleName;
    document.getElementById('overrideReason').value = '';
    document.getElementById('overrideRemark').value = '';
    // 默认有效期为 30 天后
    var today = new Date();
    today.setDate(today.getDate() + 30);
    document.getElementById('overrideExpire').value = today.toISOString().slice(0, 10);
    document.getElementById('overrideModal').classList.add('show');
}

/** 关闭覆盖弹窗 */
function closeOverrideModal() {
    document.getElementById('overrideModal').classList.remove('show');
}

/** 确认覆盖 */
function confirmOverride() {
    var reason = document.getElementById('overrideReason').value;
    var remark = document.getElementById('overrideRemark').value.trim();
    var expire = document.getElementById('overrideExpire').value;

    if (!reason) { showToast('请选择覆盖原因'); return; }
    if (!remark) { showToast('请填写备注说明'); return; }
    if (!expire) { showToast('请选择有效期'); return; }

    showToast('覆盖成功！\n\n角色：' + document.getElementById('overrideRoleName').textContent +
          '\n原因：' + reason +
          '\n备注：' + remark +
          '\n有效期至：' + expire +
          '\n\n该角色将被标记为"已覆盖"。');
    closeOverrideModal();
}

/* ============================================================
 * 初始化
 * ============================================================ */
document.addEventListener('DOMContentLoaded', function () {
    initData();
    renderRoleList();
    renderPermissionPanel();

    // 点击遮罩关闭角色弹窗
    document.getElementById('roleModal').addEventListener('click', function (e) {
        if (e.target === this) closeRoleModal();
    });
    // 点击遮罩关闭覆盖弹窗
    document.getElementById('overrideModal').addEventListener('click', function (e) {
        if (e.target === this) closeOverrideModal();
    });
});
</script>
