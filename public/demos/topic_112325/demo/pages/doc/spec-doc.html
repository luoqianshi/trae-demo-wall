<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件规范说明书 - 文档与帮助</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
  <style>
    .toc-item { padding:10px 12px; border-radius:6px; font-size:13px; color:#475569; cursor:pointer; margin-bottom:6px; }
    .toc-item:hover { background:#f1f5f9; }
    .toc-item.active { background:#eff6ff; color:#1e40af; font-weight:600; }
    .doc-section-title { font-size:18px; font-weight:700; color:#1e293b; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #e2e8f0; }
  </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

  <div class="page-header">
    <div class="title-group">
      <h2><i class="fa fa-book" style="margin-right:8px;color:#2563eb"></i>文件规范说明书</h2>
      <p class="page-desc">首页 / 文档与帮助 / 文件规范说明书 - 集中查阅接口文档、文件规范、操作手册等资料，用于消费方接入与合规审计。</p>
    </div>
    <div class="action-group">
      <button class="btn btn-default" onclick="govNav('pages/doc/list.html', ['首页','文档与帮助','文件规范说明书'])"><i class="fa fa-arrow-left"></i> 返回列表</button>
      <button class="btn btn-default" onclick="showToast('PDF生成中...')"><i class="fa fa-download"></i> 导出PDF</button>
      <button class="btn btn-primary" onclick="showToast('编辑规范')"><i class="fa fa-edit"></i> 编辑规范</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:260px 1fr;gap:16px;">
    <div class="card">
      <div class="card-header"><div class="card-title"><i class="fa fa-list"></i> 文件服务目录</div></div>
      <div class="card-body" style="padding:8px 16px;" id="docToc">
        <div class="toc-item active" data-id="BATCH-EOF-SVC" data-title="日终批处理文件交换" onclick="selectDocItem(this)">日终批处理文件交换</div>
        <div class="toc-item" data-id="CC-TRX-FILE" data-title="信用卡交易流水" onclick="selectDocItem(this)">信用卡交易流水</div>
        <div class="toc-item" data-id="PAYROLL-FILE" data-title="代发工资文件" onclick="selectDocItem(this)">代发工资文件</div>
        <div class="toc-item" data-id="CUP-RECON-FILE" data-title="银联清分对账" onclick="selectDocItem(this)">银联清分对账</div>
        <div class="toc-item" data-id="AML-LIST-SVC" data-title="反洗钱名单" onclick="selectDocItem(this)">反洗钱名单</div>
        <div class="toc-item" data-id="E-VOUCHER-FMT" data-title="电子凭证" onclick="selectDocItem(this)">电子凭证</div>
        <div class="toc-item" data-id="ACCT-BAL-API" data-title="对公账户余额" onclick="selectDocItem(this)">对公账户余额</div>
        <div class="toc-item" data-id="CI-QUERY-API" data-title="客户基本信息" onclick="selectDocItem(this)">客户基本信息</div>
      </div>
    </div>

    <div id="docContent">
      <div id="docSectionTitle" class="doc-section-title">日终批处理文件交换</div>
      <div class="card"><div class="card-header"><div class="card-title"><i class="fa fa-info-circle"></i> 概览</div></div><div class="card-body"><p>规范编号：BATCH-EOF-SVC，版本 v1.8.0，文件格式 CSV（UTF-8）。</p></div></div><div class="card"><div class="card-header"><div class="card-title"><i class="fa fa-file-code-o"></i> 格式说明</div></div><div class="card-body"><p>日终批处理文件用于各业务系统与核心银行之间每日交换当日交易数据，采用 CSV 格式。</p></div></div><div class="card"><div class="card-header"><div class="card-title"><i class="fa fa-th-list"></i> 字段列表</div></div><div class="card-body"><p>包含交易日期、机构代码、账户号、币种、金额、借贷标识、摘要等字段。</p></div></div>
    </div>
  </div>
</div>
<script src="../../js/mock-data.js"></script>
<script>
  var DOC_CONTENTS = {
        "日终批处理文件交换": "<div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-info-circle\"></i> 概览</div></div><div class=\"card-body\"><p>规范编号：BATCH-EOF-SVC，版本 v1.8.0，文件格式 CSV（UTF-8）。</p></div></div><div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-file-code-o\"></i> 格式说明</div></div><div class=\"card-body\"><p>日终批处理文件用于各业务系统与核心银行之间每日交换当日交易数据，采用 CSV 格式。</p></div></div><div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-th-list\"></i> 字段列表</div></div><div class=\"card-body\"><p>包含交易日期、机构代码、账户号、币种、金额、借贷标识、摘要等字段。</p></div></div>",
        "信用卡交易流水": "<div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-info-circle\"></i> 文件规范</div></div><div class=\"card-body\"><p>信用卡交易流水文件规范：涵盖消费、取现、还款等交易类型的文件格式与字段定义。</p></div></div><div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-exchange\"></i> 传输要求</div></div><div class=\"card-body\"><p>每日 T+1 生成，通过 SFTP 推送至数据仓库及监管报送平台。</p></div></div>",
        "代发工资文件": "<div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-info-circle\"></i> 文件规范</div></div><div class=\"card-body\"><p>代发工资文件用于企业客户批量代发，支持 TXT/CSV 格式，需包含户名、账号、金额等字段。</p></div></div><div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-book\"></i> 操作手册</div></div><div class=\"card-body\"><p>上传前需完成企业协议签约，文件需通过 MD5 校验，失败记录将生成回盘文件。</p></div></div>",
        "银联清分对账": "<div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-info-circle\"></i> 文件规范</div></div><div class=\"card-body\"><p>银联清分对账文件遵循银联接口规范，包含交易流水、手续费、清算金额等字段。</p></div></div><div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-exchange\"></i> 对账流程</div></div><div class=\"card-body\"><p>日终接收银联清算文件，与核心交易流水进行勾兑，生成差异报表。</p></div></div>",
        "反洗钱名单": "<div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-info-circle\"></i> 接口规范</div></div><div class=\"card-body\"><p>反洗钱名单校验接口：输入客户身份信息，返回命中名单及风险等级。</p></div></div><div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-shield\"></i> 安全要求</div></div><div class=\"card-body\"><p>调用需经过 OAuth 2.0 鉴权，涉及敏感字段必须加密传输。</p></div></div>",
        "电子凭证": "<div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-info-circle\"></i> 文件规范</div></div><div class=\"card-body\"><p>电子凭证文件规范：定义 PDF/OFD 版式凭证的命名规则、元数据与归档要求。</p></div></div><div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-book\"></i> 操作手册</div></div><div class=\"card-body\"><p>凭证生成后通过消息队列通知各渠道，支持按交易流水号检索下载。</p></div></div>",
        "对公账户余额": "<div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-info-circle\"></i> 接口规范</div></div><div class=\"card-body\"><p>对公账户余额查询接口：支持按账号/客户号查询活期、定期、保证金等余额。</p></div></div><div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-plug\"></i> 接入说明</div></div><div class=\"card-body\"><p>消费方需申请调用权限，返回字段需遵循统一返回码标准。</p></div></div>",
        "客户基本信息": "<div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-info-circle\"></i> 接口规范</div></div><div class=\"card-body\"><p>客户基本信息查询接口：返回客户姓名、证件信息、联系方式等，敏感字段需脱敏。</p></div></div><div class=\"card\"><div class=\"card-header\"><div class=\"card-title\"><i class=\"fa fa-refresh\"></i> 变更说明</div></div><div class=\"card-body\"><p>v2.3 新增手机号中间四位脱敏，v2.2 统一返回码标准。</p></div></div>"
    };

    // 左侧目录切换：高亮当前项并在右侧显示对应章节标题
  function selectDocItem(el) {
    document.querySelectorAll('#docToc .toc-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    var title = el.getAttribute('data-title') || el.textContent;
    var titleEl = document.getElementById('docSectionTitle');
    if (titleEl) titleEl.textContent = title;
    var contentEl = document.getElementById('docContent');
    if (!contentEl) return;
    var html = DOC_CONTENTS[title] || '<div class="card"><div class="card-body"><p>该目录项暂无内容</p></div></div>';
    var titleNode = document.getElementById('docSectionTitle');
    contentEl.innerHTML = '';
    if (titleNode) contentEl.appendChild(titleNode);
    contentEl.innerHTML += html;
  }

  // 根据 URL id 参数自动高亮目录项并切换内容
  document.addEventListener('DOMContentLoaded', function() {
      var id = govGetParam('id');
      if (id) {
          var item = document.querySelector('#docToc .toc-item[data-id="' + id + '"]');
          if (item) selectDocItem(item);
      }
  });
</script>
</body>
</html>
