<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血缘维护 - 服务治理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        .toolbar-row { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); background:var(--bg); }
        .toolbar-row .title { font-size:13px; font-weight:600; color:var(--text-primary); }
        .toolbar-row .actions { display:flex; gap:8px; }
        .btn-import { background:#fff; border:1px dashed var(--primary); color:var(--primary); padding:6px 12px; font-size:12px; border-radius:4px; cursor:pointer; }
        .btn-import:hover { background:rgba(59,130,246,0.05); }
        .upload-panel { background:linear-gradient(135deg, rgba(59,130,246,0.04), rgba(139,92,246,0.04)); border:1px dashed var(--primary); padding:16px; border-radius:8px; margin:12px; display:flex; justify-content:space-between; align-items:center; }
        .upload-panel .upload-info { font-size:12px; color:var(--text-primary); }
        .upload-panel .upload-info .sub { font-size:11px; color:var(--text-secondary); margin-top:4px; }
        .quick-stat-mini { display:inline-block; padding:2px 8px; border-radius:3px; font-size:11px; margin-right:6px; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">
    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-wrench" style="color:var(--primary);margin-right:8px"></i>血缘维护</h2>
            <div class="page-desc">
                首页 / 服务治理 / 血缘维护 - 手工新增 / 编辑 / 删除血缘关系，补充日志分析未覆盖的调用场景，支持批量导入
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="loadTableData()"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default" onclick="downloadTemplate()"><i class="fa fa-file-excel-o"></i> 下载模板</button>
            <button class="btn btn-primary" onclick="openLineageModal()"><i class="fa fa-plus-circle"></i> 新增血缘</button>
        </div>
    </div>
    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>维护类型</label>
                <select class="form-control" id="filterMaintType">
                    <option value="">全部</option>
                    <option>新增</option>
                    <option>修改</option>
                    <option>删除</option>
                </select>
            </div>
            <div class="form-item">
                <label>血缘类型</label>
                <select class="form-control" id="filterRelType">
                    <option value="">全部</option>
                    <option>同步调用</option>
                    <option>异步调用</option>
                    <option>文件传输</option>
                </select>
            </div>
            <div class="form-item">
                <label>维护人</label>
                <select class="form-control" id="filterMaintainer">
                    <option value="">全部</option>
                    <option>张工程师</option>
                    <option>李主管</option>
                    <option>王经理</option>
                    <option>赵产品</option>
                    <option>周合规</option>
                    <option>孙经理</option>
                </select>
            </div>
            <div class="form-item">
                <label>状态</label>
                <select class="form-control" id="filterStatus">
                    <option value="">全部</option>
                    <option>已生效</option>
                    <option>待审批</option>
                    <option>已驳回</option>
                </select>
            </div>
            <div class="form-item" style="flex:1">
                <label>关键字</label>
                <input type="text" class="form-control" id="filterKeyword" placeholder="提供方 / 消费方 / 接口名">
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary" onclick="doSearch()"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default" onclick="doReset()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>
    <!-- ====== 批量导入区 ====== -->
    <div class="upload-panel">
        <div class="upload-info">
            <i class="fa fa-cloud-upload" style="color:var(--primary); font-size:18px; margin-right:8px"></i>
            <b>批量导入血缘关系</b>
            <div class="sub">支持 Excel (.xlsx) 批量导入，每次最多 500 条。导入后需要经过数据治理专员审批。</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px">
            <span class="quick-stat-mini" style="background:#dbeafe;color:#1e40af">本月已导入: 186 条</span>
            <span class="quick-stat-mini" style="background:#dcfce7;color:#166534">已生效: 152 条</span>
            <span class="quick-stat-mini" style="background:#fef3c7;color:#92400e">待审批: 34 条</span>
            <button class="btn-import" onclick="selectFile()"><i class="fa fa-file-excel-o"></i> 选择 Excel 文件</button>
        </div>
    </div>
    <input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleFileSelect(this)">
    <!-- ====== 表格内容区 ====== -->
    <div class="card" style="margin-bottom:0">
        <div class="toolbar-row">
            <span class="title"><i class="fa fa-list"></i> 血缘维护记录 <span id="batchCountHint" style="font-size:12px;color:var(--primary);margin-left:8px"></span></span>
            <span class="actions">
                <button class="btn btn-default" style="height:30px; font-size:12px; padding:0 12px" onclick="batchSubmit()"><i class="fa fa-check"></i> 批量提交</button>
                <button class="btn btn-default" style="height:30px; font-size:12px; padding:0 12px" onclick="batchDelete()"><i class="fa fa-trash-o"></i> 批量删除</button>
            </span>
        </div>
        <div class="table-wrapper" style="border-radius:0; border-left:none; border-right:none; border-top:none">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:40px"><input type="checkbox" onchange="toggleAll(this)"></th>
                        <th style="width:120px">血缘ID</th>
                        <th>提供方信息</th>
                        <th>消费方信息</th>
                        <th style="width:100px">关系类型</th>
                        <th style="width:90px" class="text-center">维护类型</th>
                        <th style="width:110px">维护人</th>
                        <th style="width:140px" class="text-center">维护时间</th>
                        <th style="width:90px" class="text-center">状态</th>
                        <th style="width:180px" class="text-center op-col">操作</th>
                    </tr>
                </thead>
                <tbody id="lineageTableBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">318</span> 条记录</div>
            <div class="page-list">
                <button class="page-item" onclick="goToPage(1)"><i class="fa fa-angle-left"></i></button>
                <button class="page-item active" onclick="goToPage(1)">1</button>
                <button class="page-item" onclick="goToPage(2)">2</button>
                <button class="page-item" onclick="goToPage(3)">3</button>
                <button class="page-item" onclick="goToPage(4)">4</button>
                <button class="page-item" disabled>...</button>
                <button class="page-item" onclick="goToPage(16)">16</button>
                <button class="page-item" onclick="goToPage(2)"><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px">
                    <option>20 条/页</option>
                    <option>50 条/页</option>
                    <option>100 条/页</option>
                </select>
            </div>
        </div>
    </div>
</div>
<!-- ====== 新增/编辑血缘关系弹窗 ====== -->
<div class="modal-overlay" id="lineageModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:9999">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:8px;width:680px;max-height: 85vh; height: auto;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0">
            <h3 style="font-size:15px;color:#1e293b;margin:0" id="lineageModalTitle"><i class="fa fa-wrench" style="color:var(--primary);margin-right:6px"></i>新增血缘关系</h3>
            <a href="javascript:;" onclick="closeLineageModal()" style="font-size:18px;color:#94a3b8"><i class="fa fa-times"></i></a>
        </div>
        <div style="padding:20px">
            <div class="form-group" style="margin-bottom:14px">
                <label style="font-size:13px;color:#334155;display:block;margin-bottom:6px">提供方系统 <span style="color:#f5222d">*</span></label>
                <select id="providerSystem" class="form-control">
                    <option value="">请选择</option>
                    <option>核心业务系统</option>
                    <option>风险管理系统</option>
                    <option>交易清算系统</option>
                    <option>组织架构系统</option>
                    <option>信用卡核心</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:14px">
                <label style="font-size:13px;color:#334155;display:block;margin-bottom:6px">提供方接口/文件 <span style="color:#f5222d">*</span></label>
                <input type="text" id="providerApi" class="form-control" placeholder="请输入接口编码或文件名称">
            </div>
            <div class="form-group" style="margin-bottom:14px">
                <label style="font-size:13px;color:#334155;display:block;margin-bottom:6px">消费方系统 <span style="color:#f5222d">*</span></label>
                <select id="consumerSystem" class="form-control">
                    <option value="">请选择</option>
                    <option>信贷管理系统</option>
                    <option>会计总账系统</option>
                    <option>电子渠道</option>
                    <option>人力资源系统</option>
                    <option>客户关系管理</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:14px">
                <label style="font-size:13px;color:#334155;display:block;margin-bottom:6px">消费方接口/文件 <span style="color:#f5222d">*</span></label>
                <input type="text" id="consumerApi" class="form-control" placeholder="请输入接口编码或文件名称">
            </div>
            <div class="form-group" style="margin-bottom:14px">
                <label style="font-size:13px;color:#334155;display:block;margin-bottom:6px">关系类型 <span style="color:#f5222d">*</span></label>
                <select id="relType" class="form-control">
                    <option value="同步调用">同步调用</option>
                    <option value="异步调用">异步调用</option>
                    <option value="文件传输">文件传输</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:14px">
                <label style="font-size:13px;color:#334155;display:block;margin-bottom:6px">备注</label>
                <textarea id="lineageRemark" class="form-control" rows="3" placeholder="请输入备注信息"></textarea>
            </div>
            <!-- 血缘关系预览 -->
            <div class="form-group" style="margin-bottom:0">
                <label style="font-size:13px;color:#334155;display:block;margin-bottom:6px">血缘关系预览</label>
                <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:16px;text-align:center">
                    <svg width="100%" height="80" id="lineagePreview">
                        <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
                        <text x="20" y="40" fill="#64748b" font-size="12">提供方</text>
                        <line x1="80" y1="35" x2="280" y2="35" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
                        <text x="300" y="40" fill="#64748b" font-size="12">消费方</text>
                    </svg>
                </div>
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #e2e8f0">
            <button class="btn btn-default" onclick="closeLineageModal()" style="padding:6px 14px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;cursor:pointer;font-size:12px">取消</button>
            <button class="btn btn-primary" onclick="saveLineage()" style="padding:6px 14px;border:none;background:var(--primary);color:#fff;border-radius:4px;cursor:pointer;font-size:12px">提交审批</button>
        </div>
    </div>
</div>
<script src="../../js/mock-data.js"></script>
<script>
(function () {
    'use strict';
    /* ============================================================
     * Toast 通用提示
     * ============================================================ */
    /* ============================================================
     * Mock 数据：血缘维护记录
     * ============================================================ */
    var lineageData = [
        { id: 'LINE-20241008', providerSys: '核心业务系统', providerApi: '客户基本信息查询', consumerSys: '信贷管理系统', consumerApi: '贷款受理服务', relType: '同步调用', maintType: '新增', maintainer: '张工程师', maintTime: '2026-06-08 10:12', status: '待审批' },
        { id: 'LINE-20241007', providerSys: '风险管理系统', providerApi: '反洗钱名单校验', consumerSys: '信贷管理系统', consumerApi: '贷款审批服务', relType: '异步调用', maintType: '修改', maintainer: '李主管', maintTime: '2026-06-07 15:48', status: '已生效' },
        { id: 'LINE-20241006', providerSys: '交易清算系统', providerApi: '日终交易流水文件', consumerSys: '会计总账系统', consumerApi: '流水入账服务', relType: '文件传输', maintType: '新增', maintainer: '王经理', maintTime: '2026-06-06 09:25', status: '已生效' },
        { id: 'LINE-20241005', providerSys: '核心业务系统', providerApi: '账户余额查询', consumerSys: '电子渠道', consumerApi: '账户首页', relType: '同步调用', maintType: '删除', maintainer: '赵产品', maintTime: '2026-06-05 14:30', status: '已驳回' },
        { id: 'LINE-20241004', providerSys: '组织架构系统', providerApi: '机构信息查询', consumerSys: '人力资源系统', consumerApi: '员工归属查询', relType: '同步调用', maintType: '新增', maintainer: '周合规', maintTime: '2026-06-04 11:18', status: '已生效' },
        { id: 'LINE-20241003', providerSys: '信用卡核心', providerApi: '月度客户对账单文件', consumerSys: '客户关系管理', consumerApi: '对账单发送', relType: '文件传输', maintType: '修改', maintainer: '孙经理', maintTime: '2026-06-03 16:42', status: '待审批' }
    ];
    /* ============================================================
     * 分页状态
     * ============================================================ */
    var currentPage = 1;
    var totalPages = 16;
    /* ============================================================
     * 渲染维护类型标签样式
     * ============================================================ */
    function getMaintTypeClass(type) {
        return type === '新增' ? 'tag-success' : type === '修改' ? 'tag-info' : 'tag-danger';
    }
    /* ============================================================
     * 渲染状态标签样式
     * ============================================================ */
    function getStatusClass(status) {
        return status === '已生效' ? 'tag-success' : status === '待审批' ? 'tag-warning' : 'tag-danger';
    }
    /* ============================================================
     * 渲染行内操作按钮
     * ============================================================ */
    function getActionButtons(item) {
        var btns = '<a class="btn-link" style="padding:0 4px;cursor:pointer" onclick="viewLineageDetail(\'' + item.id + '\')"><i class="fa fa-eye"></i> 详情</a>';
        if (item.status === '待审批') {
            btns += ' <a class="btn-link" style="padding:0 4px;cursor:pointer" onclick="editLineage(\'' + item.id + '\')"><i class="fa fa-pencil"></i> 编辑</a>';
            btns += ' <a class="btn-link" style="padding:0 4px;cursor:pointer;color:#ef4444" onclick="deleteLineage(\'' + item.id + '\')"><i class="fa fa-trash-o"></i> 删除</a>';
        } else if (item.status === '已驳回') {
            btns += ' <a class="btn-link" style="padding:0 4px;cursor:pointer" onclick="editLineage(\'' + item.id + '\')"><i class="fa fa-pencil"></i> 重新编辑</a>';
            btns += ' <a class="btn-link" style="padding:0 4px;cursor:pointer" onclick="viewRejectReason(\'' + item.id + '\')"><i class="fa fa-comment-o"></i> 查看意见</a>';
        } else {
            btns += ' <a class="btn-link" style="padding:0 4px;cursor:pointer" onclick="viewLineageGraph(\'' + item.id + '\')"><i class="fa fa-sitemap"></i> 查看图谱</a>';
        }
        return btns;
    }
    /* ============================================================
     * 渲染表格
     * ============================================================ */
    function renderTable(data) {
        var tbody = document.getElementById('lineageTableBody');
        if (!tbody) return;
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#94a3b8"><i class="fa fa-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>暂无血缘记录</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(function(item) {
            return '<tr data-row="' + item.id + '" data-type="' + item.maintType + '" data-rel="' + item.relType + '" data-maintainer="' + item.maintainer + '" data-status="' + item.status + '">' +
                '<td><input type="checkbox" class="row-check" value="' + item.id + '" onchange="updateBatchCount()"></td>' +
                '<td style="font-family:\'Segoe UI\'; color:var(--primary); font-weight:600">' + item.id + '</td>' +
                '<td><div>' + item.providerSys + '</div><div style="font-size:11px;color:var(--text-secondary)">' + item.providerApi + '</div></td>' +
                '<td><div>' + item.consumerSys + '</div><div style="font-size:11px;color:var(--text-secondary)">' + item.consumerApi + '</div></td>' +
                '<td>' + item.relType + '</td>' +
                '<td class="text-center"><span class="tag ' + getMaintTypeClass(item.maintType) + '" style="font-size:11px">' + item.maintType + '</span></td>' +
                '<td>' + item.maintainer + '</td>' +
                '<td class="text-center" style="font-size:12px;color:var(--text-secondary)">' + item.maintTime + '</td>' +
                '<td class="text-center"><span class="tag ' + getStatusClass(item.status) + '" style="font-size:11px">' + item.status + '</span></td>' +
                '<td class="text-center">' + getActionButtons(item) + '</td>' +
                '</tr>';
        }).join('');
    }
    /* ============================================================
     * 加载状态
     * ============================================================ */
    function showLoading() {
        var tbody = document.getElementById('lineageTableBody');
        if (tbody) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#94a3b8"><i class="fa fa-spinner fa-pulse"></i> 加载中...</td></tr>';
        }
    }
    /* ============================================================
     * 刷新表格数据
     * ============================================================ */
    window.loadTableData = function() {
        showLoading();
        setTimeout(function() {
            renderTable(lineageData);
            showToast('数据已刷新');
        }, 300);
    };
    /* ============================================================
     * 筛选/搜索
     * ============================================================ */
    window.doSearch = function() {
        var keyword = (document.getElementById('filterKeyword').value || '').toLowerCase();
        var maintType = document.getElementById('filterMaintType').value;
        var relType = document.getElementById('filterRelType').value;
        var maintainer = document.getElementById('filterMaintainer').value;
        var status = document.getElementById('filterStatus').value;
        var filtered = lineageData.filter(function(item) {
            var match = true;
            if (keyword) {
                var text = (item.id + item.providerSys + item.providerApi + item.consumerSys + item.consumerApi).toLowerCase();
                if (text.indexOf(keyword) === -1) match = false;
            }
            if (maintType && item.maintType !== maintType) match = false;
            if (relType && item.relType !== relType) match = false;
            if (maintainer && item.maintainer !== maintainer) match = false;
            if (status && item.status !== status) match = false;
            return match;
        });
        renderTable(filtered);
        showToast('筛选完成，共 ' + filtered.length + ' 条记录');
    };
    window.doReset = function() {
        ['filterKeyword', 'filterMaintType', 'filterRelType', 'filterMaintainer', 'filterStatus'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.value = '';
        });
        renderTable(lineageData);
        showToast('已重置筛选条件');
    };
    /* ============================================================
     * 全选/取消全选
     * ============================================================ */
    window.toggleAll = function(cb) {
        var checks = document.querySelectorAll('input.row-check');
        checks.forEach(function(c) { c.checked = cb.checked; });
        updateBatchCount();
    };
    window.updateBatchCount = function() {
        var count = document.querySelectorAll('input.row-check:checked').length;
        var hint = document.getElementById('batchCountHint');
        if (hint) hint.textContent = count > 0 ? '已选 ' + count + ' 条' : '';
    };
    /* ============================================================
     * 分页
     * ============================================================ */
    window.goToPage = function(page) {
        if (page < 1 || page > totalPages || page === currentPage) return;
        currentPage = page;
        var btns = document.querySelectorAll('.pagination .page-list button');
        btns.forEach(function(btn) {
            btn.classList.remove('active');
            if (parseInt(btn.textContent) === page) btn.classList.add('active');
        });
        showToast('已跳转到第 ' + page + ' 页');
    };
    /* ============================================================
     * 新增/编辑血缘弹窗
     * ============================================================ */
    window.openLineageModal = function(id) {
        var title = document.getElementById('lineageModalTitle');
        title.innerHTML = id ? '<i class="fa fa-pencil" style="color:var(--primary);margin-right:6px"></i>编辑血缘关系' : '<i class="fa fa-wrench" style="color:var(--primary);margin-right:6px"></i>新增血缘关系';
        if (id) {
            var item = lineageData.find(function(d) { return d.id === id; });
            if (item) {
                document.getElementById('providerSystem').value = item.providerSys;
                document.getElementById('providerApi').value = item.providerApi;
                document.getElementById('consumerSystem').value = item.consumerSys;
                document.getElementById('consumerApi').value = item.consumerApi;
                document.getElementById('relType').value = item.relType;
            }
        }
        document.getElementById('lineageModal').style.display = 'block';
    };
    window.closeLineageModal = function() {
        document.getElementById('lineageModal').style.display = 'none';
        // 清空表单
        ['providerSystem', 'providerApi', 'consumerSystem', 'consumerApi', 'relType', 'lineageRemark'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.value = '';
        });
    };
    window.saveLineage = function() {
        var required = ['providerSystem', 'providerApi', 'consumerSystem', 'consumerApi', 'relType'];
        for (var i = 0; i < required.length; i++) {
            var el = document.getElementById(required[i]);
            if (!el.value) { showToast('请填写必填字段', 'warning'); el.focus(); return; }
        }
        showToast('血缘关系已提交审批');
        closeLineageModal();
    };
    /* ============================================================
     * 行内操作
     * ============================================================ */
    window.viewLineageDetail = function(id) {
        var item = lineageData.find(function(d) { return d.id === id; });
        if (!item) return;
        showToast('查看血缘详情：' + id + '（' + item.providerSys + ' → ' + item.consumerSys + '）');
    };
    window.editLineage = function(id) {
        openLineageModal(id);
    };
    window.deleteLineage = function(id) {
        if (!confirm('确认删除血缘关系 ' + id + '？此操作不可撤销。')) return;
        lineageData = lineageData.filter(function(d) { return d.id !== id; });
        renderTable(lineageData);
        showToast('已删除血缘关系 ' + id);
    };
    window.viewRejectReason = function(id) {
        showToast('查看驳回意见：' + id + '（原因：提供方与消费方系统归属不一致，需补充业务说明）');
    };
    window.viewLineageGraph = function(id) {
        govNav('pages/lineage/graph-view.html', ['首页', '追溯与血缘', '血缘图谱'], { lineageId: id });
    };
    /* ============================================================
     * 批量操作
     * ============================================================ */
    window.batchSubmit = function() {
        var checked = document.querySelectorAll('input.row-check:checked');
        if (checked.length === 0) { showToast('请先选择需要提交的记录', 'warning'); return; }
        if (!confirm('确认批量提交 ' + checked.length + ' 条血缘关系？')) return;
        showToast('已提交 ' + checked.length + ' 条血缘关系审批');
    };
    window.batchDelete = function() {
        var checked = document.querySelectorAll('input.row-check:checked');
        if (checked.length === 0) { showToast('请先选择需要删除的记录', 'warning'); return; }
        if (!confirm('确认批量删除 ' + checked.length + ' 条血缘关系？此操作不可撤销。')) return;
        showToast('已删除 ' + checked.length + ' 条血缘关系', 'warning');
    };
    /* ============================================================
     * 文件上传
     * ============================================================ */
    window.selectFile = function() {
        document.getElementById('excelFile').click();
    };
    window.handleFileSelect = function(input) {
        if (!input.files || !input.files[0]) return;
        var fileName = input.files[0].name;
        if (!confirm('确认上传文件 "' + fileName + '" 并解析血缘关系？')) return;
        showToast('文件上传中，正在解析...');
        setTimeout(function() {
            showToast('解析完成，新增 12 条血缘记录，其中 8 条待审批');
        }, 2000);
        input.value = '';
    };
    /* ============================================================
     * 下载模板
     * ============================================================ */
    window.downloadTemplate = function() {
        showToast('模板下载中...');
        setTimeout(function() { showToast('模板已下载'); }, 1000);
    };
    /* ============================================================
     * 初始化
     * ============================================================ */
    showLoading();
    setTimeout(function() {
        renderTable(lineageData);
    }, 200);
})();
</script>
</body>
</html>
