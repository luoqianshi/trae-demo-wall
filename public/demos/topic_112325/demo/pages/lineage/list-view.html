<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血缘列表 - 追溯与血缘</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-list-alt" style="color:var(--primary);margin-right:8px"></i>血缘列表</h2>
            <div class="page-desc">
                首页 / 追溯与血缘 / 血缘列表 - 以表格形式展示所有注册的血缘关系 · 总计 2,648 条血缘 · 已验证 2,412 条
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="window.location.reload()"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default" onclick="govNav('pages/lineage/graph-view.html', ['首页', '追溯与血缘', '血缘图谱'], {})"><i class="fa fa-sitemap"></i> 切换到图谱</button>
            <button class="btn btn-primary" onclick="govNav('pages/lineage/maintain.html', ['首页','服务治理','血缘维护'], {})"><i class="fa fa-wrench"></i> 前往血缘维护</button>
        </div>
    </div>

    <!-- 快捷说明横幅 -->
    <div style="background:linear-gradient(90deg,#f5f3ff,#ecfdf5);border:1px solid #ddd6fe;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:13px;color:#5b21b6;display:flex;align-items:center;gap:12px">
        <i class="fa fa-sitemap" style="font-size:18px;color:#7c3aed"></i>
        <span><b>快捷操作说明：</b>"查看图谱"可视化展示上下游调用关系 · "查看提供方接口 / 消费方接口"跳转到对应接口详情页</span>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>血缘类型</label>
                <select class="form-control" id="filterLineageType">
                    <option value="">全部</option>
                    <option value="API">API 调用</option>
                    <option value="FILE">文件传输</option>
                    <option value="HYBRID">交叉血缘</option>
                </select>
            </div>
            <div class="form-item">
                <label>关系类型</label>
                <select class="form-control" id="filterRelType">
                    <option value="">全部</option>
                    <option value="同步调用">同步调用</option>
                    <option value="异步调用">异步调用</option>
                    <option value="文件传输">文件传输</option>
                </select>
            </div>
            <div class="form-item">
                <label>提供方系统</label>
                <select class="form-control" id="filterProviderSys">
                    <option value="">全部</option>
                    <option value="核心业务系统">核心业务系统</option>
                    <option value="信贷管理系统">信贷管理系统</option>
                    <option value="风险管理系统">风险管理系统</option>
                </select>
            </div>
            <div class="form-item">
                <label>消费方系统</label>
                <select class="form-control" id="filterConsumerSys">
                    <option value="">全部</option>
                    <option value="信用卡核心">信用卡核心</option>
                    <option value="电子渠道">电子渠道</option>
                    <option value="监管报送平台">监管报送平台</option>
                </select>
            </div>
            <div class="form-item">
                <label>数据来源</label>
                <select class="form-control" id="filterDataSource">
                    <option value="">全部</option>
                    <option value="日志分析">日志分析</option>
                    <option value="自登记">自登记</option>
                    <option value="手工维护">手工维护</option>
                </select>
            </div>
            <div class="form-item">
                <label>验证状态</label>
                <select class="form-control" id="filterVerifyStatus">
                    <option value="">全部</option>
                    <option value="已验证">已验证</option>
                    <option value="待确认">待确认</option>
                    <option value="异常">异常</option>
                </select>
            </div>
            <div class="form-item" style="flex:1; min-width:180px">
                <label>关键字</label>
                <input type="text" class="form-control" id="filterKeyword" placeholder="搜索血缘ID / 接口 / 系统">
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary" onclick="doSearch()"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default" onclick="doReset()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 表格内容区 ====== -->
    <div class="card" style="margin-bottom:0">
        <div class="card-header">
            <div class="card-title">血缘关系列表</div>
            <div class="card-action">
                <a href="javascript:;" onclick="showToast('血缘列表导出中...')"><i class="fa fa-download"></i> 导出</a>
            </div>
        </div>
        <div class="table-wrapper" style="border-radius:0; border-left:none; border-right:none; border-top:none;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:40px"><input type="checkbox" onchange="toggleAll(this)"></th>
                        <th style="width:120px">血缘ID</th>
                        <th style="width:90px">血缘类型</th>
                        <th>提供方路径 / 系统 / 接口</th>
                        <th>消费方路径 / 系统 / 接口</th>
                        <th style="width:90px">关系类型</th>
                        <th style="width:90px">数据来源</th>
                        <th style="width:90px" class="text-center">验证状态</th>
                        <th style="width:130px" class="text-center">更新时间</th>
                        <th style="width:160px" class="text-center op-col">操作</th>
                    </tr>
                </thead>
                <tbody id="lineageTableBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info"><span class="total">共 2,648 条记录</span></div>
            <div class="page-list">
                <button class="page-item" onclick="goToPage(currentPage - 1)"><i class="fa fa-angle-left"></i></button>
                <button class="page-item active" onclick="goToPage(1)">1</button>
                <button class="page-item" onclick="goToPage(2)">2</button>
                <button class="page-item" onclick="goToPage(3)">3</button>
                <button class="page-item" onclick="goToPage(4)">4</button>
                <button class="page-item" onclick="goToPage(5)">5</button>
                <button class="page-item" disabled>...</button>
                <button class="page-item" onclick="goToPage(133)">133</button>
                <button class="page-item" onclick="goToPage(currentPage + 1)"><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px">
                    <option>20 条/页</option>
                    <option>50 条/页</option>
                    <option>100 条/页</option>
                </select>
            </div>
        </div>
    </div>
</div>
<script src="../../js/mock-data.js"></script>
<script>
(function () {
    // type: 'API' | 'FILE' | 'HYBRID' (交叉血缘)
    const lineages = [
        { id: 'LINE-20241005', type: 'API',    providerDomain: '信贷 / 零售信贷',   providerSys: '核心业务系统',   providerApi: '客户基本信息查询 (API-CUS-0001)',    consumerDomain: '信贷 / 贷款审批',   consumerSys: '信贷管理系统',   consumerApi: '贷款受理服务 (API-CDP-0023)',    relation: '同步调用', source: '日志分析', status: '已验证', updated: '2026-06-05 14:23', providerCode: 'API-CUS-0001', consumerCode: 'API-CDP-0023' },
        { id: 'LINE-20241004', type: 'FILE',   providerDomain: '交易 / 清算',       providerSys: '交易清算系统',   providerApi: '日终交易流水文件 (FILE-TRX-0045)',   consumerDomain: '财务 / 总账',      consumerSys: '会计总账系统',   consumerApi: '流水入账服务 (SVC-ACC-0078)',     relation: '文件传输', source: '自登记',   status: '已验证', updated: '2026-06-04 09:12', providerCode: 'FILE-TRX-0045', consumerCode: 'SVC-ACC-0078' },
        { id: 'LINE-20241003', type: 'HYBRID', providerDomain: '风险 / 反洗钱',     providerSys: '风控系统',       providerApi: '反洗钱名单校验 (API-RISK-0078)',    consumerDomain: '信贷 / 贷款审批',   consumerSys: '信贷管理系统',   consumerApi: '贷款审批服务',                        relation: '异步调用', source: '手工维护', status: '待确认', updated: '2026-06-03 17:45', providerCode: 'API-RISK-0078', consumerCode: 'API-CDP-0023' },
        { id: 'LINE-20241002', type: 'API',    providerDomain: '客户 / 基础信息',   providerSys: '核心业务系统',   providerApi: '账户余额查询 (API-DEP-0012)',        consumerDomain: '渠道 / 手机银行',   consumerSys: '电子渠道',       consumerApi: '账户首页服务',                           relation: '同步调用', source: '日志分析', status: '已验证', updated: '2026-06-02 11:08', providerCode: 'API-DEP-0012', consumerCode: 'API-DEP-0012' },
        { id: 'LINE-20241001', type: 'FILE',   providerDomain: '信用卡 / 对账单',   providerSys: '信用卡核心',     providerApi: '月度客户对账单文件 (FILE-STMT-0056)',consumerDomain: '渠道 / 邮件',       consumerSys: '客户关系管理',   consumerApi: '对账单发送服务',                         relation: '文件传输', source: '日志分析', status: '异常',   updated: '2026-06-01 20:30', providerCode: 'FILE-STMT-0056', consumerCode: 'API-CUS-0062' },
        { id: 'LINE-20240928', type: 'API',    providerDomain: '信贷 / 授信',       providerSys: '风险管理系统',   providerApi: '信用评分查询 (API-CRD-0068)',        consumerDomain: '信贷 / 贷款审批',   consumerSys: '信贷管理系统',   consumerApi: '贷款审批服务',                           relation: '同步调用', source: '自登记',   status: '已验证', updated: '2026-06-28 15:15', providerCode: 'API-CRD-0068', consumerCode: 'API-CDP-0023' },
        { id: 'LINE-20240925', type: 'API',    providerDomain: '客户 / 画像',       providerSys: '核心业务系统',   providerApi: '客户信息查询 (API-CUS-0005)',        consumerDomain: '营销 / 推荐',       consumerSys: '营销系统',       consumerApi: '客户画像服务',                           relation: '同步调用', source: '日志分析', status: '已验证', updated: '2026-06-25 10:42', providerCode: 'API-CUS-0005', consumerCode: 'API-OP-0091' },

        { id: 'LINE-20240915', type: 'API',    providerDomain: '风控 / 名单',       providerSys: '风控系统',       providerApi: '黑名单校验 (API-RISK-0032)',         consumerDomain: '支付 / 结算',       consumerSys: '支付清算系统',   consumerApi: '支付拦截服务',                           relation: '同步调用', source: '日志分析', status: '已验证', updated: '2026-06-15 13:08', providerCode: 'API-RISK-0032', consumerCode: 'API-PAY-0078' }

    document.getElementById('lineageTableBody').innerHTML = lineages.map(l => {
        const t = typeTag(l.type);

<script>

/* ====== 筛选查询 ====== */
function doSearch() {
    var keyword = (document.getElementById('filterKeyword') || {}).value || '';
    keyword = keyword.toLowerCase();
    var lineageType = (document.getElementById('filterLineageType') || {}).value || '';
    var relType = (document.getElementById('filterRelType') || {}).value || '';
    var dataSource = (document.getElementById('filterDataSource') || {}).value || '';
    var verifyStatus = (document.getElementById('filterVerifyStatus') || {}).value || '';
    var providerSys = (document.getElementById('filterProviderSys') || {}).value || '';
    var consumerSys = (document.getElementById('filterConsumerSys') || {}).value || '';
    var rows = document.querySelectorAll('#lineageTableBody tr[data-row]');
    var visible = 0;
    rows.forEach(function(row) {
        var show = true;
        if (keyword) {
            var text = row.textContent.toLowerCase();
            if (text.indexOf(keyword) === -1) show = false;
        }
        if (lineageType && row.getAttribute('data-lineage-type') !== lineageType) show = false;
        if (relType && row.getAttribute('data-type') !== relType) show = false;
        if (dataSource && row.getAttribute('data-source') !== dataSource) show = false;
        if (verifyStatus && row.getAttribute('data-status') !== verifyStatus) show = false;
        if (providerSys && row.getAttribute('data-provider') !== providerSys) show = false;
        if (consumerSys && row.getAttribute('data-consumer') !== consumerSys) show = false;
        row.style.display = show ? '' : 'none';
        if (show) visible++;
    });
    // 更新分页总数
    var totalEl = document.querySelector('.page-info .total');
    if (totalEl) totalEl.textContent = '共 ' + visible + ' 条记录';
    // 空状态处理
    var emptyRow = document.getElementById('emptyRow');
    if (emptyRow) emptyRow.style.display = visible === 0 ? '' : 'none';
    showToast('筛选完成，共 ' + visible + ' 条记录');
}

/* ====== 重置筛选 ====== */
function doReset() {
    var ids = ['filterKeyword','filterLineageType','filterRelType','filterDataSource','filterVerifyStatus','filterProviderSys','filterConsumerSys'];
    ids.forEach(function(id) { var el = document.getElementById(id); if (el) el.value = ''; });
    var rows = document.querySelectorAll('#lineageTableBody tr[data-row]');
    rows.forEach(function(row) { row.style.display = ''; });
    var totalEl = document.querySelector('.page-info .total');
    if (totalEl) totalEl.textContent = '共 2,648 条记录';
    // 隐藏空状态
    var emptyRow = document.getElementById('emptyRow');
    if (emptyRow) emptyRow.style.display = 'none';
    showToast('已重置筛选条件');
}

/* ====== 分页跳转 ====== */
var currentPage = 1;
var totalPages = 133;
function goToPage(page) {
    if (page < 1 || page > totalPages || page === currentPage) return;
    currentPage = page;
    var btns = document.querySelectorAll('.pagination .page-list button');
    btns.forEach(function(btn) {
        btn.classList.remove('active');
        if (parseInt(btn.textContent) === page) btn.classList.add('active');
    });
    showToast('已跳转到第 ' + page + ' 页');
}

/* ====== 表头全选/取消全选 ====== */
function toggleAll(cb) {
    var checks = document.querySelectorAll('input.row-check');
    checks.forEach(function(c) { c.checked = cb.checked; });
}
</script>
</body>
</html>
