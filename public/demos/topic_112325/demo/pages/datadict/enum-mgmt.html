<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>枚举值管理 - 标准规范管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        /* 左右分栏布局：左侧300px固定，右侧自适应 */
        .enum-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: var(--space-lg);
            align-items: start;
        }

        /* ====== 左侧面板 ====== */
        .field-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 160px);
        }
        .field-panel-header {
            padding: var(--space-lg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .field-panel-header .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }
        .field-panel-header .panel-title::before {
            content: "";
            width: 3px;
            height: 14px;
            background: var(--primary);
            border-radius: 2px;
        }
        .field-search-box {
            position: relative;
        }
        .field-search-box input {
            width: 100%;
            height: 32px;
            padding: 4px 10px 4px 30px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            transition: all 0.2s;
        }
        .field-search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .field-search-box .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 13px;
        }

        /* 字段列表 */
        .field-list {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-sm) 0;
        }
        .field-item {
            padding: 10px var(--space-lg);
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            border-bottom: 1px solid var(--border-light);
        }
        .field-item:hover {
            background: #f0f7ff;
        }
        .field-item.active {
            background: #eff6ff;
            border-left-color: var(--primary);
        }
        .field-item .field-code {
            font-family: "Segoe UI", sans-serif;
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .field-item .field-name {
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .field-item .field-count {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .field-item .field-count .count-num {
            color: var(--success);
            font-weight: 600;
        }

        /* 左侧空状态 */
        .field-empty {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-light);
        }
        .field-empty i {
            font-size: 36px;
            margin-bottom: var(--space-md);
            display: block;
        }
        .field-empty p {
            font-size: 13px;
        }

        /* ====== 右侧面板 ====== */
        .enum-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            min-width: 0; /* 确保表格可以水平滚动 */
        }
        .enum-panel-header {
            padding: var(--space-lg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--space-sm);
        }
        .enum-panel-header .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        .enum-panel-header .panel-title::before {
            content: "";
            width: 3px;
            height: 14px;
            background: var(--primary);
            border-radius: 2px;
        }
        .enum-panel-header .panel-title .field-tag {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: var(--space-sm);
        }
        .enum-panel-actions {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        /* 右侧表格容器 */
        .enum-table-wrapper {
            overflow-x: auto;
        }

        /* 状态标签 */
        .tag-status-active { background: #d1fae5; color: #047857; border-color: #a7f3d0; }
        .tag-status-inactive { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }

        /* 变更历史类型标签颜色 */
        .change-tag-create    { background:#dbeafe; color:#1d4ed8; border-color:#bfdbfe; }  /* 创建-蓝色 */
        .change-tag-add       { background:#d1fae5; color:#047857; border-color:#a7f3d0; }  /* 枚举值新增-绿色 */
        .change-tag-modify    { background:#fef3c7; color:#b45309; border-color:#fde68a; }  /* 枚举值修改-橙色 */
        .change-tag-deprecate { background:#fee2e2; color:#dc2626; border-color:#fecaca; }  /* 枚举值停用-红色 */
        .change-tag-attr      { background:#f1f5f9; color:#475569; border-color:#e2e8f0; }  /* 属性修改-灰色 */

        /* 弹窗内表格 */
        .modal-table {
            width: 100%;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .modal-table th {
            background: #f8fafc;
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .modal-table td {
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-light);
        }
        .modal-table tr:last-child td {
            border-bottom: none;
        }
        .modal-table tr:hover {
            background: #eff6ff;
        }

        /* 弹窗表单 */
        .enum-form-group {
            margin-bottom: var(--space-lg);
        }
        .enum-form-group label {
            display: block;
            margin-bottom: var(--space-sm);
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .enum-form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }
        .enum-form-group input {
            width: 100%;
            height: 34px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            transition: all 0.2s;
        }
        .enum-form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        /* 备注文本域样式 */
        .enum-form-group textarea {
            width: 100%;
            min-height: 72px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .enum-form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            outline: none;
        }
        .enum-form-group .error-tip {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .enum-form-group.has-error input {
            border-color: var(--danger);
        }
        .enum-form-group.has-error .error-tip {
            display: block;
        }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

</div>

var CHANGE_TAG_MAP = {
    '创建':       'change-tag-create',
    '枚举值新增': 'change-tag-add',
    '枚举值修改': 'change-tag-modify',
    '枚举值停用': 'change-tag-deprecate',
    '属性修改':   'change-tag-attr'

/* ====== 全局状态 ====== */
var state = {
    isReadonly: false,
    selectedFieldCode: null,
    currentPage: 1,
    pageSize: 10,
    filteredFields: []
};

/* ====== HTML转义 ====== */
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ====== 初始化：解析URL参数，判断只读模式 ====== */
function initMode() {
    var mode = govGetParam('mode');
    state.isReadonly = (mode === 'readonly');

    var titleEl = document.getElementById('pageTitle');
    if (state.isReadonly) {
        // 只读模式：用户侧标题为"枚举值查询"
        if (titleEl) titleEl.innerHTML = '<i class="fa fa-search" style="color:var(--primary);margin-right:8px"></i>枚举值查询';
        document.getElementById('pageDesc').textContent = '查询字典中枚举值类型字段的具体枚举值（只读模式）';
        document.getElementById('bcLevel2').textContent = '标准规范';
        document.getElementById('bcLevel3').textContent = '枚举值查询';
        document.title = '枚举值查询 - 标准规范管理';
    } else {
        // 管理侧标题为"枚举值管理"
        if (titleEl) titleEl.innerHTML = '<i class="fa fa-list-ul" style="color:var(--primary);margin-right:8px"></i>枚举值管理';
        document.getElementById('pageDesc').textContent = '首页 / 标准规范管理 / 枚举值管理 - 管理字典中枚举值类型字段的具体枚举值，支持新增、编辑、批量导入与变更追踪';
        document.getElementById('bcLevel2').textContent = '标准规范管理';
        document.getElementById('bcLevel3').textContent = '枚举值管理';
        document.title = '枚举值管理 - 标准规范管理';
    }
}

/* ====== 渲染左侧字段列表 ====== */
function renderFieldList() {
    var keyword = (document.getElementById('fieldSearchInput').value || '').trim().toLowerCase();
    var listEl = document.getElementById('fieldList');

    // 按关键字过滤
    state.filteredFields = ENUM_FIELDS.filter(function(f) {
        if (!keyword) return true;
        return f.code.toLowerCase().indexOf(keyword) >= 0 ||
               f.name.toLowerCase().indexOf(keyword) >= 0;
    });

    // 空状态
    if (state.filteredFields.length === 0) {
        listEl.innerHTML = '<div class="field-empty">' +
            '<i class="fa fa-inbox"></i>' +
            '<p>未找到匹配的字段</p>' +
            '</div>';
        return;
    }

    listEl.innerHTML = state.filteredFields.map(function(f) {
        var isActive = f.code === state.selectedFieldCode;
        return '<div class="field-item' + (isActive ? ' active' : '') + '" onclick="selectField(\'' + f.code + '\')">' +
            '<div class="field-code">' + escapeHtml(f.code) + '</div>' +
            '<div class="field-name">' + escapeHtml(f.name) + '</div>' +
            '<div class="field-count"><span class="count-num">' + f.count + '</span> 个枚举值</div>' +
            '</div>';
    }).join('');
}

/* ====== 处理左侧搜索 ====== */
function handleFieldSearch() {
    renderFieldList();
}

/* ====== 选中字段，渲染右侧枚举值 ====== */
function selectField(code) {
    state.selectedFieldCode = code;
    state.currentPage = 1;
    renderFieldList();
    renderEnumPanel();
}

/* ====== 获取当前选中字段对象 ====== */
function getCurrentField() {
    return ENUM_FIELDS.find(function(f) { return f.code === state.selectedFieldCode; });
}

/* ====== 获取当前字段的枚举值数据（副本，避免直接修改原始数据） ====== */
function getCurrentEnumData() {
    var data = ENUM_DATA[state.selectedFieldCode];
    return data ? data : [];
}

/* ====== 渲染右侧面板（标题+操作按钮+表格+分页） ====== */
function renderEnumPanel() {
    var field = getCurrentField();
    if (!field) return;

    // 渲染标题
    var titleEl = document.getElementById('enumPanelTitle');
    titleEl.innerHTML = escapeHtml(field.name) +
        ' <span class="field-tag">(' + escapeHtml(field.code) + ') 的枚举值</span>';

    // 渲染操作按钮
    renderPanelActions();

    // 渲染表格
    renderEnumTable();

    // 渲染分页
    renderEnumPagination();
}

/* ====== 渲染操作按钮区 ====== */
function renderPanelActions() {
    var actionsEl = document.getElementById('enumPanelActions');
    if (state.isReadonly) {
        // 只读模式：仅变更历史
        actionsEl.innerHTML =
            '<button class="btn btn-default" onclick="showChangeHistory()"><i class="fa fa-history"></i> 变更历史</button>';
    } else {
        // 编辑模式：新增枚举值 + 批量导入 + 变更历史
        actionsEl.innerHTML =
            '<button class="btn btn-primary" onclick="showAddEnumModal()"><i class="fa fa-plus-circle"></i> 新增枚举值</button>' +
            '<button class="btn btn-default" onclick="showBatchImportModal()"><i class="fa fa-upload"></i> 批量导入</button>' +
            '<button class="btn btn-default" onclick="showChangeHistory()"><i class="fa fa-history"></i> 变更历史</button>';
    }
}

/* ====== 渲染表头 ====== */
function renderEnumTableHeader() {
    var headerEl = document.getElementById('enumTableHeader');
    if (state.isReadonly) {
        // 只读模式：5列（无操作列）
        headerEl.innerHTML =
            '<th style="width:160px">枚举值</th>' +
            '<th>描述</th>' +
            '<th>备注</th>' +
            '<th style="width:100px" class="text-center">排序号</th>' +
            '<th style="width:100px" class="text-center">状态</th>';
    } else {
        // 编辑模式：6列（含操作列）
        headerEl.innerHTML =
            '<th style="width:160px">枚举值</th>' +
            '<th>描述</th>' +
            '<th>备注</th>' +
            '<th style="width:100px" class="text-center">排序号</th>' +
            '<th style="width:100px" class="text-center">状态</th>' +
            '<th style="width:160px" class="text-center op-col">操作</th>';
    }
}

/* ====== 渲染枚举值表格 ====== */
function renderEnumTable() {
    renderEnumTableHeader();

    var data = getCurrentEnumData();
    var tbody = document.getElementById('enumTableBody');
    var totalCount = data.length;
    document.getElementById('totalCount').textContent = totalCount;

    // 空数据状态
    var colspan = state.isReadonly ? 5 : 6;
    if (totalCount === 0) {
        tbody.innerHTML = '<tr><td colspan="' + colspan + '" style="text-align:center;padding:48px 0;color:#94a3b8">' +
            '<i class="fa fa-inbox" style="font-size:48px;display:block;margin-bottom:12px;color:#cbd5e1"></i>' +
            '<div style="font-size:14px">暂无枚举值数据</div>' +
            '<div style="font-size:12px;margin-top:4px">请新增枚举值或通过批量导入添加</div>' +
            '</td></tr>';
        return;
    }

    // 分页计算
    var startIndex = (state.currentPage - 1) * state.pageSize;
    var endIndex = Math.min(startIndex + state.pageSize, totalCount);
    var pageData = data.slice(startIndex, endIndex);

    tbody.innerHTML = pageData.map(function(item, idx) {
        var realIndex = startIndex + idx;
        var statusTag = item.status === '有效'
            ? '<span class="tag tag-status-active" style="font-size:11px">有效</span>'
            : '<span class="tag tag-status-inactive" style="font-size:11px">无效</span>';

        var actions = '';
        if (!state.isReadonly) {
            actions = '<a class="btn-link" style="padding:0 4px;cursor:pointer" onclick="showEditEnumModal(' + realIndex + ')"><i class="fa fa-edit"></i> 编辑</a>';
            if (item.status === '有效') {
                actions += '<a class="btn-link" style="padding:0 4px;cursor:pointer;color:var(--danger)" onclick="toggleEnumStatus(' + realIndex + ', \'无效\')"><i class="fa fa-stop-circle"></i> 停用</a>';
            } else {
                actions += '<a class="btn-link" style="padding:0 4px;cursor:pointer;color:var(--success)" onclick="toggleEnumStatus(' + realIndex + ', \'有效\')"><i class="fa fa-play-circle"></i> 启用</a>';
            }
        }

        return '<tr>' +
            '<td style="font-family:\'Segoe UI\',sans-serif;color:var(--primary);font-weight:600">' + escapeHtml(item.value) + '</td>' +
            '<td>' + escapeHtml(item.desc) + '</td>' +
            '<td style="color:#64748b;font-size:13px">' + escapeHtml(item.remark || '-') + '</td>' +
            '<td class="text-center num">' + item.sort + '</td>' +
            '<td class="text-center">' + statusTag + '</td>' +
            (state.isReadonly ? '' : '<td class="text-center">' + actions + '</td>') +
            '</tr>';
    }).join('');
}

/* ====== 渲染分页器 ====== */
function renderEnumPagination() {
    var data = getCurrentEnumData();
    var totalCount = data.length;
    var totalPages = Math.ceil(totalCount / state.pageSize) || 1;
    var currentPage = state.currentPage;
    var pageListEl = document.getElementById('pageList');

    var html = '';

    // 上一页按钮
    html += '<button onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage <= 1 ? 'disabled' : '') + '><i class="fa fa-angle-left"></i></button>';

    // 页码按钮（最多显示5个）
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) {
        startPage = Math.max(1, endPage - 4);
    }

    for (var i = startPage; i <= endPage; i++) {
        html += '<button onclick="goToPage(' + i + ')" class="' + (i === currentPage ? 'active' : '') + '">' + i + '</button>';
    }

    // 下一页按钮
    html += '<button onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage >= totalPages ? 'disabled' : '') + '><i class="fa fa-angle-right"></i></button>';

    pageListEl.innerHTML = html;
}

/* ====== 跳转到指定页 ====== */
function goToPage(page) {
    var data = getCurrentEnumData();
    var totalPages = Math.ceil(data.length / state.pageSize) || 1;
    if (page < 1 || page > totalPages) return;
    state.currentPage = page;
    renderEnumTable();
    renderEnumPagination();
}

/* ====== 处理每页条数变化 ====== */
function changePageSize() {
    state.pageSize = parseInt(document.getElementById('pageSizeSelect').value, 10);
    state.currentPage = 1;
    renderEnumTable();
    renderEnumPagination();
}

/* ====== 新增枚举值弹窗 ====== */
function showAddEnumModal() {
    var field = getCurrentField();
    if (!field) return;

    var modal = createModal('addEnumModal', '新增枚举值 - ' + field.name, 480);
    var body = modal.querySelector('.modal-body');
    body.innerHTML =
        '<div class="enum-form-group" id="formGroup-value">' +
            '<label>枚举值<span class="required">*</span></label>' +
            '<input type="text" id="inputEnumValue" placeholder="请输入枚举值" oninput="clearFormError(\'formGroup-value\')">' +
            '<div class="error-tip">枚举值不能为空</div>' +
        '</div>' +
        '<div class="enum-form-group" id="formGroup-desc">' +
            '<label>描述<span class="required">*</span></label>' +
            '<input type="text" id="inputEnumDesc" placeholder="请输入描述" oninput="clearFormError(\'formGroup-desc\')">' +
            '<div class="error-tip">描述不能为空</div>' +
        '</div>' +
        '<div class="enum-form-group" id="formGroup-sort">' +
            '<label>排序号<span class="required">*</span></label>' +
            '<input type="number" id="inputEnumSort" placeholder="请输入数字" oninput="clearFormError(\'formGroup-sort\')">' +
            '<div class="error-tip">排序号必须为数字</div>' +
        '</div>' +
        '<div class="enum-form-group" id="formGroup-remark">' +
            '<label>备注</label>' +
            '<textarea id="inputEnumRemark" placeholder="请输入备注说明（选填）" maxlength="100"></textarea>' +
        '</div>';

    var footer = modal.querySelector('.modal-footer');
    footer.innerHTML =
        '<button class="btn btn-default btn-sm" onclick="closeModal(\'addEnumModal\')">取消</button>' +
        '<button class="btn btn-primary btn-sm" onclick="confirmAddEnum()">确认新增</button>';

    document.body.appendChild(modal);
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });

    // 自动填充建议排序号
    var data = getCurrentEnumData();
    var maxSort = data.reduce(function(max, item) { return Math.max(max, item.sort); }, 0);
    document.getElementById('inputEnumSort').value = maxSort + 1;
}

/* ====== 确认新增枚举值 ====== */
function confirmAddEnum() {
    var value = document.getElementById('inputEnumValue').value.trim();
    var desc = document.getElementById('inputEnumDesc').value.trim();
    var sortStr = document.getElementById('inputEnumSort').value.trim();
    var remark = document.getElementById('inputEnumRemark').value.trim();

    // 校验
    var hasError = false;
    if (!value) {
        document.getElementById('formGroup-value').classList.add('has-error');
        hasError = true;
    }
    if (!desc) {
        document.getElementById('formGroup-desc').classList.add('has-error');
        hasError = true;
    }
    if (!sortStr || isNaN(Number(sortStr))) {
        document.getElementById('formGroup-sort').classList.add('has-error');
        hasError = true;
    }
    if (hasError) return;

    // 校验枚举值是否重复
    var data = ENUM_DATA[state.selectedFieldCode];
    var isDuplicate = data.some(function(item) { return item.value === value; });
    if (isDuplicate) {
        showToast('枚举值"' + value + '"已存在，请勿重复添加');
        return;
    }

    // 添加到数据
    data.push({
        value: value,
        desc: desc,
        sort: parseInt(sortStr, 10),
        status: '有效',
        remark: remark
    });

    closeModal('addEnumModal');
    showToast('枚举值"' + value + '"新增成功');

    // 跳转到最后一页
    var totalCount = data.length;
    var totalPages = Math.ceil(totalCount / state.pageSize) || 1;
    state.currentPage = totalPages;
    renderEnumTable();
    renderEnumPagination();
}

    body.innerHTML =

            '<div style="font-size:12px;color:var(--text-light);margin-top:4px">枚举值不可修改</div>' +
        '</div>' +
        '<div class="enum-form-group" id="formGroup-desc">' +
            '<label>描述<span class="required">*</span></label>' +
            '<input type="text" id="inputEnumDesc" value="' + escapeHtml(item.desc) + '" oninput="clearFormError(\'formGroup-desc\')">' +
            '<div class="error-tip">描述不能为空</div>' +
        '</div>' +
        '<div class="enum-form-group" id="formGroup-sort">' +
            '<label>排序号<span class="required">*</span></label>' +
            '<input type="number" id="inputEnumSort" value="' + item.sort + '" oninput="clearFormError(\'formGroup-sort\')">' +
            '<div class="error-tip">排序号必须为数字</div>' +
        '</div>' +
        '<div class="enum-form-group" id="formGroup-remark">' +
            '<label>备注</label>' +
            '<textarea id="inputEnumRemark" placeholder="请输入备注说明（选填）" maxlength="100">' + escapeHtml(item.remark || '') + '</textarea>' +
        '</div>';

    var footer = modal.querySelector('.modal-footer');
    footer.innerHTML =
        '<button class="btn btn-default btn-sm" onclick="closeModal(\'editEnumModal\')">取消</button>' +
        '<button class="btn btn-primary btn-sm" onclick="confirmEditEnum(' + index + ')">保存</button>';

    document.body.appendChild(modal);
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
}

/* ====== 确认编辑枚举值 ====== */
function confirmEditEnum(index) {
    var desc = document.getElementById('inputEnumDesc').value.trim();
    var sortStr = document.getElementById('inputEnumSort').value.trim();
    var remark = document.getElementById('inputEnumRemark').value.trim();

    // 校验
    var hasError = false;
    if (!desc) {
        document.getElementById('formGroup-desc').classList.add('has-error');
        hasError = true;
    }
    if (!sortStr || isNaN(Number(sortStr))) {
        document.getElementById('formGroup-sort').classList.add('has-error');
        hasError = true;
    }
    if (hasError) return;

    // 更新数据
    var data = ENUM_DATA[state.selectedFieldCode];
    data[index].desc = desc;
    data[index].sort = parseInt(sortStr, 10);
    data[index].remark = remark;

    closeModal('editEnumModal');
    showToast('枚举值修改成功');
    renderEnumTable();
}

/* ====== 切换枚举值状态（停用/启用） ====== */
function toggleEnumStatus(index, newStatus) {
    var data = ENUM_DATA[state.selectedFieldCode];
    var item = data[index];
    if (!item) return;

    item.status = newStatus;
    var action = newStatus === '无效' ? '停用' : '启用';
    showToast('枚举值"' + item.value + '"已' + action);
    renderEnumTable();
}

/* ====== 清除表单错误状态 ====== */
function clearFormError(groupId) {
    var group = document.getElementById(groupId);
    if (group) group.classList.remove('has-error');
}

/* ====== 批量导入弹窗 ====== */
function showBatchImportModal() {
    var field = getCurrentField();
    if (!field) return;

    var modal = createModal('batchImportModal', '批量导入枚举值 - ' + field.name, 560);
    var body = modal.querySelector('.modal-body');
    body.innerHTML =
        '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:12px;margin-bottom:16px;font-size:12px;color:#92400e;line-height:1.8">' +
            '<div style="font-weight:600;margin-bottom:4px"><i class="fa fa-exclamation-triangle" style="margin-right:6px"></i>导入说明</div>' +
            '<div>1. 必须使用平台下载的固定模板</div>' +
            '<div>2. 导入时校验枚举值是否在字典中已创建（即左侧列表中存在的字段）</div>' +
            '<div>3. 导入时校验枚举值是否重复</div>' +
            '<div>4. 导入后自动更新排序号</div>' +
        '</div>' +
        '<div id="uploadArea" style="border:2px dashed #cbd5e1;border-radius:8px;padding:32px 20px;text-align:center;cursor:pointer;transition:all 0.15s" onmouseover="this.style.borderColor=\'var(--primary)\';this.style.background=\'#eff6ff\'" onmouseout="this.style.borderColor=\'#cbd5e1\';this.style.background=\'transparent\'" onclick="simulateUpload()">' +
            '<i class="fa fa-cloud-upload" style="font-size:36px;color:#94a3b8;margin-bottom:8px"></i>' +
            '<div style="font-size:13px;color:#64748b">点击或拖拽文件到此处上传</div>' +
            '<div style="font-size:11px;color:#94a3b8;margin-top:4px">支持 .xlsx / .xls 格式，最大 5MB</div>' +
        '</div>' +
        '<div style="margin-top:12px">' +
            '<a href="javascript:;" onclick="downloadTemplate()" style="font-size:12px;color:var(--primary)"><i class="fa fa-download"></i> 下载导入模板</a>' +
        '</div>' +
        '<div id="importResult" style="margin-top:16px"></div>';

    var footer = modal.querySelector('.modal-footer');
    footer.innerHTML =
        '<button class="btn btn-default btn-sm" onclick="closeModal(\'batchImportModal\')">取消</button>' +
        '<button class="btn btn-primary btn-sm" id="btnConfirmImport" onclick="confirmImport()" style="display:none">确认导入</button>';

    document.body.appendChild(modal);
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
}

/* ====== 模拟上传并校验 ====== */
function simulateUpload() {
    var resultEl = document.getElementById('importResult');
    var field = getCurrentField();
    if (!field) return;

    // 模拟校验过程
    resultEl.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text-secondary)"><i class="fa fa-spinner fa-pulse"></i> 正在校验文件内容...</div>';

    setTimeout(function() {
        // 模拟校验结果：校验通过
        var mockImportCount = 3;
        var html = '<div style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:6px;padding:12px;margin-bottom:12px">' +
            '<div style="font-size:13px;color:#047857;font-weight:600"><i class="fa fa-check-circle" style="margin-right:6px"></i>校验通过</div>' +
            '<div style="font-size:12px;color:#065f46;margin-top:4px">共 ' + mockImportCount + ' 条枚举值，校验通过，确认导入？</div>' +
        '</div>';

        // 模拟校验明细
        html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">校验明细：</div>';
        html += '<table class="modal-table"><thead><tr><th>枚举值</th><th>描述</th><th>排序号</th><th>校验结果</th></tr></thead><tbody>';
        html += '<tr><td>TEST1</td><td>测试枚举1</td><td>11</td><td><span style="color:var(--success)">通过</span></td></tr>';
        html += '<tr><td>TEST2</td><td>测试枚举2</td><td>12</td><td><span style="color:var(--success)">通过</span></td></tr>';
        html += '<tr><td>TEST3</td><td>测试枚举3</td><td>13</td><td><span style="color:var(--success)">通过</span></td></tr>';
        html += '</tbody></table>';

        resultEl.innerHTML = html;
        document.getElementById('btnConfirmImport').style.display = 'inline-flex';
    }, 800);
}

/* ====== 确认导入 ====== */
function confirmImport() {
    var data = ENUM_DATA[state.selectedFieldCode];
    var maxSort = data.reduce(function(max, item) { return Math.max(max, item.sort); }, 0);

    // 模拟添加导入的枚举值
    data.push({ value: 'TEST1', desc: '测试枚举1', sort: maxSort + 1, status: '有效', remark: '批量导入测试数据' });
    data.push({ value: 'TEST2', desc: '测试枚举2', sort: maxSort + 2, status: '有效', remark: '批量导入测试数据' });
    data.push({ value: 'TEST3', desc: '测试枚举3', sort: maxSort + 3, status: '有效', remark: '批量导入测试数据' });

    closeModal('batchImportModal');
    showToast('批量导入成功，共导入 3 条枚举值');

    // 跳转到最后一页
    var totalCount = data.length;
    var totalPages = Math.ceil(totalCount / state.pageSize) || 1;
    state.currentPage = totalPages;
    renderEnumTable();
    renderEnumPagination();
}

/* ====== 下载模板 ====== */
function downloadTemplate() {
    showToast('下载「枚举值导入」标准模板（Excel）\n\n模板包含以下列：\n  - 枚举值（必填）\n  - 描述（必填）\n  - 排序号（必填，数字）\n  - 状态（选填）\n\n注意：必须使用平台下载的固定模板，其他格式将被拒绝。');
}

/* ====== 生成变更历史Mock数据（每个字段3-5条） ====== */
function getChangeHistory(code) {
    var field = ENUM_FIELDS.find(function(f) { return f.code === code; });
    if (!field) return [];

    var data = ENUM_DATA[code] || [];
    var history = [];

    // 创建记录
    history.push({
        time: '2026-03-20 11:20',
        type: '创建',
        content: '创建枚举值字段，初始' + field.count + '个枚举值',
        operator: '张明'
    });

    // 属性修改
    history.push({
        time: '2026-04-10 16:00',
        type: '属性修改',
        content: '更新字段描述信息',
        operator: '王强'
    });

    // 枚举值修改
    if (data.length >= 1) {
        history.push({
            time: '2026-05-15 09:15',
            type: '枚举值修改',
            content: '修改枚举值"' + data[0].value + '"的描述',
            operator: '李华'
        });
    }

    // 枚举值新增
    if (data.length >= 2) {
        history.push({
            time: '2026-06-20 14:30',
            type: '枚举值新增',
            content: '新增枚举值"' + data[data.length - 1].value + '"',
            operator: '张明'
        });
    }

    // 枚举值停用
    history.push({
        time: '2026-06-05 10:45',
        type: '枚举值停用',
        content: '停用枚举值"OBSOLETE"',
        operator: '李华'
    });

    // 按时间倒序排列
    history.sort(function(a, b) { return b.time.localeCompare(a.time); });
    return history;
}

/* ====== 变更历史弹窗 ====== */
function showChangeHistory() {
    var field = getCurrentField();
    if (!field) return;

    var history = getChangeHistory(field.code);

    // 生成变更记录行
    var rowsHtml = history.map(function(r) {
        var tagClass = CHANGE_TAG_MAP[r.type] || 'change-tag-attr';
        return '<tr>' +
            '<td style="white-space:nowrap;font-family:\'Segoe UI\',sans-serif;font-size:12px">' + r.time + '</td>' +
            '<td><span class="tag ' + tagClass + '" style="font-size:11px">' + r.type + '</span></td>' +
            '<td style="font-size:12px">' + escapeHtml(r.content) + '</td>' +
            '<td style="white-space:nowrap">' + escapeHtml(r.operator) + '</td>' +
            '</tr>';
    }).join('');

    var modal = createModal('changeHistoryModal', '变更历史 - ' + field.name, 640);
    var body = modal.querySelector('.modal-body');
    body.innerHTML =
        '<table class="modal-table"><thead><tr>' +
            '<th style="width:140px">时间</th>' +
            '<th style="width:100px">变更类型</th>' +
            '<th>变更内容</th>' +
            '<th style="width:80px">操作人</th>' +
        '</tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
        '<div style="margin-top:12px;font-size:12px;color:var(--text-secondary)">共 ' + history.length + ' 条变更记录</div>';

    var footer = modal.querySelector('.modal-footer');
    footer.innerHTML = '<button class="btn btn-default btn-sm" onclick="closeModal(\'changeHistoryModal\')">关闭</button>';

    document.body.appendChild(modal);
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
}

/* ====== 创建弹窗通用函数 ====== */
function createModal(id, title, width) {
    var modal = document.createElement('div');
    modal.id = id;
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:99999;display:flex;justify-content:center;align-items:center';
    modal.innerHTML = '<div style="background:#fff;border-radius:8px;width:' + width + 'px;max-width:90vw;max-height: 80vh; height: auto;box-shadow:0 10px 40px rgba(0,0,0,0.2);overflow:hidden;display:flex;flex-direction:column">' +
        // 头部
        '<div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0">' +
            '<div style="font-size:15px;font-weight:700;color:#1e293b">' + escapeHtml(title) + '</div>' +
            '<button onclick="closeModal(\'' + id + '\')" style="border:none;background:transparent;font-size:18px;cursor:pointer;color:#64748b">&times;</button>' +
        '</div>' +
        // 内容区
        '<div class="modal-body" style="padding:20px;overflow-y:auto;flex:1"></div>' +
        // 底部
        '<div class="modal-footer" style="padding:12px 20px;border-top:1px solid var(--border);background:#f8fafc;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0"></div>' +
    '</div>';
    return modal;
}

/* ====== 关闭弹窗 ====== */
function closeModal(id) {
    var modal = document.getElementById(id);
    if (modal) modal.remove();
}

/* ====== 页面初始化入口 ====== */
(function init() {
    // 初始化模式
    initMode();
    // 默认选中第一个字段
    state.selectedFieldCode = ENUM_FIELDS[0].code;
    // 渲染左侧字段列表
    renderFieldList();
    // 渲染右侧枚举值面板
    renderEnumPanel();
})();
</script>
</body>
</html>
