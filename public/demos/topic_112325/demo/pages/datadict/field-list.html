<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标准字段列表 - 标准规范管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        /* 超长文本省略号样式，鼠标悬停通过 title 属性显示完整内容 */
        .col-name {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .col-code {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'Segoe UI', monospace;
            font-weight: 600;
            color: var(--primary);
        }
        .col-en-name {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'Segoe UI', monospace;
            color: #475569;
        }
        .col-category {
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* 码值列链接颜色 */
        .col-codevalue {
            color: var(--primary);
        }
        .col-codevalue a {
            color: var(--primary);
            margin-left: 4px;
            cursor: pointer;
            text-decoration: none;
        }
        .col-codevalue a:hover {
            text-decoration: underline;
        }
        .col-codevalue .dash {
            color: var(--text-secondary, #999);
        }
        /* 优先级标签 */
        .tag-p0 { color: #dc2626; background: #fee2e2; border-color: transparent; }
        .tag-p1 { color: #d97706; background: #fffbeb; border-color: transparent; }
        .tag-p2 { color: #2563eb; background: #eff6ff; border-color: transparent; }
        .tag-p3 { color: #64748b; background: #f1f5f9; border-color: transparent; }
        /* 数据分级标签 */
        .tag-level-inner { color: #16a34a; background: #f0fdf4; border-color: transparent; }
        .tag-level-sensitive { color: #dc2626; background: #fee2e2; border-color: transparent; }
        /* 异常状态容器 */
        .table-state {
            display: none;
            padding: 48px 20px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }
        .table-state.active { display: block; }
        .table-state i { font-size: 40px; display: block; margin-bottom: 12px; color: #cbd5e1; }
        .table-state.error i { color: #f59e0b; }
        .table-state.forbidden i { color: #dc2626; }
        .table-state .state-title { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .table-state .state-action { margin-top: 16px; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区（根据 mode=readonly 切换为只读模式） ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2 id="pageTitle"><i class="fa fa-list-alt" style="color:var(--primary);margin-right:8px"></i>标准字段列表</h2>
            <div class="page-desc" id="pageDesc">
                首页 / 标准规范管理 / 标准字段列表 - 管理全行标准字段定义
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default"><i class="fa fa-download"></i> 导出</button>
            <button class="btn btn-primary" id="btnAddField"><i class="fa fa-plus-circle"></i> 新增字段</button>
        </div>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>标准中文名称</label>
                <input type="text" class="form-control" placeholder="请输入标准中文名称">
            </div>
            <div class="form-item">
                <label>标准项编号</label>
                <input type="text" class="form-control" placeholder="请输入标准项编号">
            </div>
            <div class="form-item">
                <label>数据项分类</label>
                <select class="form-control">
                    <option value="">全部</option>
                    <option value="基础数据项">基础数据项</option>
                    <option value="结构数据项">结构数据项</option>
                    <option value="复合数据项">复合数据项</option>
                </select>
            </div>
            <div class="form-item">
                <label>数据标准分类</label>
                <select class="form-control">
                    <option value="">全部</option>
                    <option value="标识类">标识类</option>
                    <option value="分类类">分类类</option>
                    <option value="状态类">状态类</option>
                    <option value="度量类">度量类</option>
                    <option value="时间类">时间类</option>
                    <option value="描述类">描述类</option>
                    <option value="结构类">结构类</option>
                    <option value="未分类">未分类</option>
                </select>
            </div>
            <div class="form-item">
                <label>业务数据类型</label>
                <select class="form-control">
                    <option value="">全部</option>
                    <option value="文本">文本</option>
                    <option value="编号">编号</option>
                    <option value="代码">代码</option>
                    <option value="金额">金额</option>
                    <option value="日期">日期</option>
                    <option value="数值">数值</option>
                    <option value="时间">时间</option>
                    <option value="标志">标志</option>
                </select>
            </div>
            <div class="form-item">
                <label>优先级</label>
                <select class="form-control">
                    <option value="">全部</option>
                    <option value="P0">P0</option>
                    <option value="P1">P1</option>
                    <option value="P2">P2</option>
                    <option value="P3">P3</option>
                </select>
            </div>
            <div class="form-item">
                <label>管理状态</label>
                <select class="form-control">
                    <option value="">全部</option>
                    <option value="草稿">草稿</option>
                    <option value="发布">发布</option>
                    <option value="废弃">废弃</option>
                </select>
            </div>
            <div class="form-item">
                <label>监管标志</label>
                <select class="form-control">
                    <option value="">全部</option>
                    <option value="是">是</option>
                    <option value="否">否</option>
                </select>
            </div>
            <div class="form-item">
                <label>数据分级</label>
                <select class="form-control">
                    <option value="">全部</option>
                    <option value="内部">内部</option>
                    <option value="敏感">敏感</option>
                </select>
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary" onclick="showToast('查询完成')"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default" onclick="showToast('已重置')"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 表格内容区 ====== -->
    <div class="card" style="margin-bottom:0">
        <div class="card-header">
            <div class="card-title">字段列表</div>
        </div>
        <div class="table-wrapper" style="border-radius:0; border-left:none; border-right:none; border-top:none;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:40px"><input type="checkbox"></th>
                        <th style="width:120px">标准项编号</th>
                        <th style="min-width:180px">标准中文名称</th>
                        <th style="width:150px">标准英文名称</th>
                        <th style="width:100px">数据项分类</th>
                        <th style="width:100px">数据标准分类</th>
                        <th style="width:140px">业务分类</th>
                        <th style="width:100px">业务数据类型</th>
                        <th style="width:130px">数据格式</th>
                        <th style="width:120px" class="text-center">码值引用</th>
                        <th style="width:80px" class="text-center">数据分级</th>
                        <th style="width:70px" class="text-center">优先级</th>
                        <th style="width:90px" class="text-center">管理状态</th>
                        <th style="width:100px" class="text-right">引用字段数</th>
                        <th style="width:120px" class="text-center op-col">操作</th>
                    </tr>
                </thead>
                <tbody id="fieldListBody"></tbody>
            </table>
            <!-- 加载中 -->
            <div id="stateLoading" class="table-state">
                <div class="spinner"></div>
                <div class="state-title">数据加载中</div>
                <div>正在加载标准字段数据，请稍候...</div>
            </div>
            <!-- 空数据 -->
            <div id="stateEmpty" class="table-state">
                <i class="fa fa-inbox"></i>
                <div class="state-title">暂无数据</div>
                <div>未找到符合条件的标准字段，请调整筛选条件后重试</div>
                <div class="state-action"><button class="btn btn-primary" onclick="showToast('已重置筛选条件')"><i class="fa fa-refresh"></i> 重置筛选</button></div>
            </div>
            <!-- 网络错误 -->
            <div id="stateError" class="table-state error">
                <i class="fa fa-exclamation-circle"></i>
                <div class="state-title">加载失败</div>
                <div>网络异常或服务器繁忙，请检查网络后重试</div>
                <div class="state-action"><button class="btn btn-primary" onclick="showToast('重新加载中')"><i class="fa fa-refresh"></i> 重新加载</button></div>
            </div>
            <!-- 权限不足 -->
            <div id="stateForbidden" class="table-state forbidden">
                <i class="fa fa-lock"></i>
                <div class="state-title">权限不足</div>
                <div>您当前没有查看该页面数据的权限，请联系管理员</div>
                <div class="state-action"><button class="btn btn-default" onclick="history.back()"><i class="fa fa-arrow-left"></i> 返回</button></div>
            </div>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">24</span> 条记录</div>
            <div class="page-list">
                <button onclick="showToast('上一页')"><i class="fa fa-angle-left"></i></button>
                <button class="active">1</button>
                <button onclick="showToast('第2页')">2</button>
                <button onclick="showToast('第3页')">3</button>
                <button onclick="showToast('第4页')">4</button>
                <button onclick="showToast('第5页')">5</button>
                <button onclick="showToast('下一页')"><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px">
                    <option>10 条/页</option>
                    <option>20 条/页</option>
                    <option>50 条/页</option>
                </select>
            </div>
        </div>
    </div>
</div>

<script src="../../js/mock-data.js"></script>
<script>
(function () {
    /** 解析URL参数 */
    function getParam(key) {
        const params = new URLSearchParams(window.location.search);
        return params.get(key);
    }

    /** 只读模式处理：用户侧的"数据标准查询"菜单会以 mode=readonly 进入 */
    const isReadonly = getParam('mode') === 'readonly';
    if (isReadonly) {
        const titleEl = document.getElementById('pageTitle');
        const descEl = document.getElementById('pageDesc');
        const addBtn = document.getElementById('btnAddField');
        if (titleEl) titleEl.innerHTML = '<i class="fa fa-search" style="color:var(--primary);margin-right:8px"></i>数据标准查询';
        if (descEl) descEl.textContent = '查询全行标准字段与码值（只读模式）';
        if (addBtn) addBtn.style.display = 'none';
    }

    /**
     * 渲染码值引用列：有码值时显示引用数量 + 查看链接；无码值时显示"—"
     */
    function renderCodeValueCell(field) {
        const codeRef = field['码值引用'] || '';
        if (!codeRef.trim()) {
            return '<span class="dash">—</span>';
        }
        const count = codeRef.split(',').filter(function(s) { return s.trim(); }).length;
        return `<span>${count}</span><a onclick="govNav('pages/datadict/field-detail.html', ['首页', '数据标准管理', '字段详情'], {code:'${field['标准项编号']}', from:'list'${isReadonly ? ", mode:'readonly'" : ''}})">查看</a>`;
    }

    /**
     * 渲染优先级标签
     */
    function renderPriorityCell(field) {
        const p = field['优先级'] || 'P3';
        const clsMap = { 'P0': 'tag-p0', 'P1': 'tag-p1', 'P2': 'tag-p2', 'P3': 'tag-p3' };
        return `<span class="tag ${clsMap[p] || 'tag-p3'}" style="font-size:11px">${p}</span>`;
    }

    /**
     * 渲染数据分级标签
     */
    function renderLevelCell(field) {
        const level = field['数据分级'] || '内部';
        const cls = level === '敏感' ? 'tag-level-sensitive' : 'tag-level-inner';
        return `<span class="tag ${cls}" style="font-size:11px">${level}</span>`;
    }

    /**
     * 渲染管理状态标签
     */
    function renderStatusCell(field) {
        const status = field['管理状态'] || '草稿';
        const clsMap = {
            '发布': 'tag-success',
            '草稿': 'tag-warning',
            '废弃': 'tag-default'
        };
        const iconMap = {
            '发布': 'check-circle',
            '草稿': 'clock-o',
            '废弃': 'ban'
        };
        const cls = clsMap[status] || 'tag-default';
        const icon = iconMap[status] || 'circle';
        return `<span class="tag ${cls}" style="font-size:11px"><i class="fa fa-${icon}"></i> ${status}</span>`;
    }

    /** 控制表格异常状态显示 */
    function showState(state) {
        const states = ['stateLoading', 'stateEmpty', 'stateError', 'stateForbidden'];
        states.forEach(function(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('active', id === 'state' + state);
        });
        const table = document.querySelector('.data-table');
        if (table) table.style.visibility = (state === 'Loading' || state === 'Error' || state === 'Forbidden') ? 'hidden' : 'visible';
        if (state === 'Empty') {
            if (table) table.style.visibility = 'visible';
            document.getElementById('fieldListBody').innerHTML = '';
        }
    }

    const rows = window.GovernanceMockData.standardFields;
    if (!rows || rows.length === 0) {
        showState('Empty');
    } else {
        showState(''); // 正常状态
        document.getElementById('fieldListBody').innerHTML = rows.map(r => `
            <tr>
                <td><input type="checkbox"></td>
                <td class="col-code" title="${r['标准项编号']}">${r['标准项编号']}</td>
                <td class="col-name" title="${r['标准中文名称']}">${r['标准中文名称']}</td>
                <td class="col-en-name" title="${r['标准英文名称']}">${r['标准英文名称']}</td>
                <td><span class="tag tag-default" style="font-size:11px">${r['数据项分类']}</span></td>
                <td><span class="tag tag-info" style="font-size:11px">${r['数据标准分类']}</span></td>
                <td class="col-category" title="${r['业务分类']}"><span class="tag tag-default" style="font-size:11px">${r['业务分类']}</span></td>
                <td><span class="tag tag-info" style="font-size:11px">${r['业务数据类型']}</span></td>
                <td class="num" style="font-family:'Segoe UI',monospace">${r['数据格式']}</td>
                <td class="col-codevalue text-center">${renderCodeValueCell(r)}</td>
                <td class="text-center">${renderLevelCell(r)}</td>
                <td class="text-center">${renderPriorityCell(r)}</td>
                <td class="text-center">${renderStatusCell(r)}</td>
                <td class="text-right num">${r['引用字段数']}</td>
                <td class="text-center op-col">
                    <a class="btn-link" style="padding:0 4px;cursor:pointer" onclick="govNav('pages/datadict/field-detail.html', ['首页', '数据标准管理', '字段详情'], {code:'${r['标准项编号']}', from:'list'${isReadonly ? ", mode:'readonly'" : ''}})"><i class="fa fa-eye"></i> 查看</a>
                </td>
            </tr>
        `).join('');
    }
})();
</script>
</body>
</html>
