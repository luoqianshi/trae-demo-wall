<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitleTag">字典管理 - 标准规范管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        /* ====== 统计卡片行 ====== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        /* ====== 业务域分类树节点（两级树结构） ====== */
        .tree-node {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.15s ease;
            margin-bottom: 2px;
            user-select: none;
        }
        .tree-node:hover {
            background: #f1f5f9;
        }
        .tree-node.active {
            background: #eff6ff;
            color: var(--primary);
        }
        .tree-node .fa {
            color: #94a3b8;
            flex-shrink: 0;
            width: 16px;
            text-align: center;
        }
        .tree-node.active .fa {
            color: var(--primary);
        }
        .tree-node .node-name {
            flex: 1;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tree-node .node-count {
            font-size: 12px;
            color: #94a3b8;
            font-family: 'Segoe UI', sans-serif;
            flex-shrink: 0;
        }
        .tree-node.active .node-count {
            color: var(--primary);
        }

        /* 一级节点：加粗、左缩进10px */
        .tree-node-level1 {
            padding-left: 10px;
            font-weight: 600;
        }

        /* 二级节点：常规字重、左缩进28px、字号13px */
        .tree-node-level2 {
            padding-left: 28px;
            font-weight: normal;
            font-size: 13px;
        }

        /* 展开/折叠箭头图标 */
        .tree-arrow {
            transition: transform 0.2s ease;
            width: 14px !important;
            cursor: pointer;
        }
        .tree-arrow.expanded {
            transform: rotate(90deg);
        }

        /* 二级子节点容器 */
        .tree-children {
            margin-bottom: 2px;
        }

        /* ====== 优先级标签 ====== */
        .tag-p0 { background: #fee2e2; color: #b91c1c; border-color: #fecaca; font-weight: 700; }
        .tag-p1 { background: #fef3c7; color: #b45309; border-color: #fde68a; font-weight: 700; }
        .tag-p2 { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; font-weight: 700; }
        .tag-p3 { background: #dcfce7; color: #15803d; border-color: #bbf7d0; font-weight: 700; }

        /* ====== 代码文本 ====== */
        .code-text {
            font-family: 'Segoe UI', 'Consolas', monospace;
            font-weight: 600;
            font-size: 12px;
        }

        /* ====== 表格列样式微调 ====== */
        .data-table thead th {
            white-space: nowrap;
        }
        .data-table tbody td {
            white-space: nowrap;
        }
        .data-table tbody td .sub-text {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        /* ====== 可交互元素 ====== */
        .interactive {
            cursor: pointer;
        }
        .interactive:hover {
            opacity: 0.85;
        }

        /* ====== Modal 弹窗统一样式 ====== */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:9998; }
        .modal-box { background:#fff; border-radius:8px; width:560px; max-width:92vw; max-height: 88vh; height: auto; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,0.25); }
        .modal-header { padding:16px 20px; border-bottom:1px solid var(--border,#e2e8f0); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:#fff; z-index:2; }
        .modal-title { font-size:15px; font-weight:700; color:var(--text-primary,#1e293b); }
        .modal-close { cursor:pointer; font-size:20px; color:var(--text-secondary,#64748b); line-height:1; padding:0 4px; }
        .modal-close:hover { color:#ef4444; }
        .modal-body { padding:20px; }
        .modal-footer { padding:14px 20px; border-top:1px solid var(--border,#e2e8f0); display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; background:#fff; }
        .modal-body .m-form-row { display:flex; gap:14px; margin-bottom:14px; }
        .modal-body .m-form-item { flex:1; }
        .modal-body .m-form-item > label { display:block; font-size:12px; color:var(--text-secondary,#64748b); margin-bottom:6px; font-weight:600; }
        .modal-body .m-form-item .form-control { width:100%; padding:7px 10px; border:1px solid var(--border,#e2e8f0); border-radius:4px; font-size:13px; box-sizing:border-box; }
        .modal-body .m-form-item .form-control:disabled { background:#f1f5f9; color:#94a3b8; }
    </style>
    <script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区（支持 mode=readonly 只读模式） ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2 id="pageTitle"><i class="fa fa-sitemap" style="color:var(--primary);margin-right:8px"></i>字典管理</h2>
            <div class="page-desc" id="pageDesc">
                首页 / 标准规范管理 / 字典管理 - 管理全行数据标准分类体系
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default interactive" onclick="showToast('正在刷新数据...')"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default interactive" onclick="showToast('正在导出字典数据...')"><i class="fa fa-download"></i> 导出</button>
            <button class="btn btn-primary interactive" id="btnAddCategory" onclick="openCategoryModal()"><i class="fa fa-plus-circle"></i> 新增分类</button>
        </div>
    </div>

    <!-- ====== 统计卡片 ====== -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon primary"><i class="fa fa-database"></i></div>
            <div class="stat-label">标准数据项总数</div>
            <div class="stat-value">26,143</div>
            <div class="stat-foot">覆盖18个数据标准业务域（与接口分类的18个业务域不同维度）</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange"><i class="fa fa-star"></i></div>
            <div class="stat-label">P0 核心标准项</div>
            <div class="stat-value">123</div>
            <div class="stat-foot">引用 ≥ 100次</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange"><i class="fa fa-flag"></i></div>
            <div class="stat-label">P1 重要标准项</div>
            <div class="stat-value">707</div>
            <div class="stat-foot">引用 20-99次</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon cyan"><i class="fa fa-tags"></i></div>

            <div class="stat-value">52</div>
            <div class="stat-foot">如编号/币种/类型/状态等</div>
        </div>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>关键字</label>
                <input type="text" class="form-control" id="filterKeyword" placeholder="标准项编号 / 中文名称 / 英文名称" onkeyup="if(event.key==='Enter') applyFilters()">
            </div>
            <div class="form-item">
                <label>业务数据类型</label>
                <select class="form-control" id="filterBizType">
                    <option value="">全部</option>
                    <option value="文本">文本</option>
                    <option value="编号">编号</option>
                    <option value="代码">代码</option>
                    <option value="金额">金额</option>
                    <option value="日期">日期</option>
                    <option value="数值">数值</option>
                    <option value="标志">标志</option>
                    <option value="时间">时间</option>
                </select>
            </div>
            <div class="form-item">
                <label>优先级</label>
                <select class="form-control" id="filterPriority">
                    <option value="">全部</option>
                    <option value="P0">P0 - 核心</option>
                    <option value="P1">P1 - 重要</option>
                    <option value="P2">P2 - 一般</option>
                    <option value="P3">P3 - 低频</option>
                </select>
            </div>
            <div class="form-item">
                <label>来源</label>
                <select class="form-control" id="filterSource">
                    <option value="">全部</option>
                    <option value="全行标准">全行标准</option>
                    <option value="自定义升级">自定义升级</option>
                </select>
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary interactive" onclick="applyFilters()"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default interactive" onclick="resetFilters()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 表格/表单内容区：左树 + 右表 ====== -->
    <div style="display:grid; grid-template-columns: 260px 1fr; gap:16px;">

        <!-- 左侧分类树 -->
        <div class="card" style="margin-bottom:0; min-width:0">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-folder-open-o"></i> 业务域分类</div>
                <div class="card-action"><span style="font-size:12px;color:var(--text-secondary)">共18个</span></div>
            </div>
            <div class="card-body" id="categoryTree" style="padding:8px 12px; max-height:620px; overflow-y:auto">
                <!-- JS 动态渲染 -->
            </div>
        </div>

        <!-- 右侧字段列表 -->
        <div class="card" style="margin-bottom:0; min-width:0; overflow:hidden">
            <div class="card-header">
                <div class="card-title" id="rightTitle">其他 · 标准项列表</div>
                <div class="card-action">
                    <a id="btnAddFieldLink" href="javascript:;" class="interactive" onclick="openFieldModal()"><i class="fa fa-plus"></i> 新增字段</a>
                    <a id="btnBatchDisable" href="javascript:;" class="interactive" onclick="if(confirm('确认批量停用选中的标准项？\n\n停用后相关系统将无法引用这些标准项。')) showToast('已批量停用选中标准项')"><i class="fa fa-trash-o"></i> 批量停用</a>
                </div>
            </div>
            <div class="table-wrapper" style="border-radius:0; border-left:none; border-right:none; border-top:none;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width:36px"><input type="checkbox"></th>
                            <th style="width:140px">标准项编号</th>
                            <th style="width:130px">标准中文名称</th>
                            <th style="width:130px">标准英文名称</th>
                            <th style="width:100px">类别词</th>
                            <th style="width:90px">数据标准分类</th>
                            <th style="width:80px">业务数据类型</th>
                            <th style="width:110px">数据格式</th>
                            <th style="width:120px">枚举值引用</th>
                            <th style="width:70px" class="text-center">优先级</th>
                            <th style="width:80px" class="text-right">引用字段数</th>
                            <th style="width:110px" class="text-center">来源</th>
                            <th style="width:180px" class="text-center op-col">操作</th>
                        </tr>
                    </thead>
                    <tbody id="fieldTable"></tbody>
                </table>
            </div>
            <div class="pagination">
                <div class="page-info">共 <span class="text-primary" id="totalCount">0</span> 条记录</div>
                <div class="page-list" id="pageList"></div>
                <div class="page-size">
                    <select class="form-control" style="height:32px" onchange="changePageSize(this)">
                        <option value="10">10 条/页</option>
                        <option value="20">20 条/页</option>
                        <option value="50">50 条/页</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ====== 新增/编辑分类 Modal ====== -->
<div class="modal-overlay" id="categoryModal" style="display:none">
    <div class="modal-box" style="width:520px">
        <div class="modal-header">
            <span class="modal-title" id="categoryModalTitle"><i class="fa fa-folder-plus-o" style="margin-right:8px;color:var(--primary)"></i>新增分类</span>
            <span class="modal-close" onclick="closeCategoryModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="m-form-item" style="margin-bottom:14px">
                <label>分类名称 <span style="color:#ef4444">*</span></label>
                <input type="text" class="form-control" id="catName" placeholder="请输入分类名称">
            </div>
            <div class="m-form-item" style="margin-bottom:14px">
                <label>上级分类</label>
                <select class="form-control" id="catParent">
                    <option value="">无（顶级分类）</option>
                </select>
            </div>
            <div class="m-form-row">
                <div class="m-form-item">
                    <label>分类编码 <span style="color:#ef4444">*</span></label>
                    <input type="text" class="form-control" id="catCode" placeholder="如 DEP、PAY">
                </div>
                <div class="m-form-item">
                    <label>排序权重</label>
                    <input type="number" class="form-control" id="catSort" placeholder="0">
                </div>
            </div>
            <div class="m-form-item">
                <label>描述</label>
                <textarea class="form-control" id="catDesc" rows="2" placeholder="请输入分类描述"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeCategoryModal()">取消</button>
            <button class="btn btn-primary" onclick="saveCategory()">确认保存</button>
        </div>
    </div>
</div>

<!-- ====== 新增/编辑标准项 Modal ====== -->
<div class="modal-overlay" id="fieldModal" style="display:none">
    <div class="modal-box" style="width:640px">
        <div class="modal-header">
            <span class="modal-title" id="fieldModalTitle"><i class="fa fa-plus-circle" style="margin-right:8px;color:var(--primary)"></i>新增标准项</span>
            <span class="modal-close" onclick="closeFieldModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="m-form-row">
                <div class="m-form-item">
                    <label>标准项编号</label>
                    <input type="text" class="form-control" id="fieldCode" readonly placeholder="自动生成">
                </div>
                <div class="m-form-item">
                    <label>优先级</label>
                    <select class="form-control" id="fieldPriority">
                        <option value="P0">P0 - 核心</option>
                        <option value="P1">P1 - 重要</option>
                        <option value="P2">P2 - 一般</option>
                    </select>
                </div>
            </div>
            <div class="m-form-row">
                <div class="m-form-item">
                    <label>标准中文名称 <span style="color:#ef4444">*</span></label>
                    <input type="text" class="form-control" id="fieldCnName" placeholder="请输入中文名称">
                </div>
                <div class="m-form-item">
                    <label>标准英文名称 <span style="color:#ef4444">*</span></label>
                    <input type="text" class="form-control" id="fieldEnName" placeholder="如 customerName">
                </div>
            </div>
            <div class="m-form-row">
                <div class="m-form-item">
                    <label>类别词</label>
                    <select class="form-control" id="fieldCategoryWord">
                        <option>客户</option>
                        <option>账户</option>
                        <option>交易</option>
                        <option>产品</option>
                        <option>渠道</option>
                        <option>协议</option>
                        <option>金额</option>
                        <option>日期</option>
                        <option>状态</option>
                        <option>机构</option>
                    </select>
                </div>
                <div class="m-form-item">
                    <label>数据标准分类</label>
                    <select class="form-control" id="fieldStdCategory">
                        <option>基础数据</option>
                        <option>业务数据</option>
                        <option>管理数据</option>
                        <option>技术数据</option>
                    </select>
                </div>
            </div>
            <div class="m-form-row">
                <div class="m-form-item">
                    <label>业务数据类型</label>
                    <select class="form-control" id="fieldBizType">
                        <option>字符串</option>
                        <option>整数</option>
                        <option>小数</option>
                        <option>日期</option>
                        <option>布尔</option>
                        <option>枚举</option>
                        <option>JSON</option>
                    </select>
                </div>
                <div class="m-form-item">
                    <label>来源</label>
                    <select class="form-control" id="fieldSource">
                        <option>全行标准</option>
                        <option>自定义升级</option>
                    </select>
                </div>
            </div>
            <div class="m-form-item" style="margin-bottom:14px">
                <label>数据格式</label>
                <input type="text" class="form-control" id="fieldFormat" placeholder="如 VARCHAR(64)、DECIMAL(18,2)">
            </div>
            <div class="m-form-item">
                <label>备注</label>
                <textarea class="form-control" id="fieldRemark" rows="2" placeholder="请输入备注"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeFieldModal()">取消</button>
            <button class="btn btn-primary" onclick="saveField()">确认保存</button>
        </div>
    </div>
</div>

</script>

    /* ====== 页面状态 ====== */
    var state = {
        currentDomainIdx: 0,       // 当前选中的业务域索引
        currentSubIdx: -1,         // 当前选中的子分类索引（-1表示选中整个业务域）
        expandedDomains: { 0: true }, // 展开的业务域（默认展开第一个）
        currentPage: 1,
        pageSize: 10,
        filters: {
            keyword: '',
            bizDataType: '',
            priority: '',
            source: ''
        }
    };

    /* ====== 标签样式映射 ====== */
    function getPriorityTagClass(priority) {
        var map = { 'P0': 'tag-p0', 'P1': 'tag-p1', 'P2': 'tag-p2', 'P3': 'tag-p3' };
        return map[priority] || 'tag-default';
    }

    function getStdCategoryTagClass(category) {
        var map = {
            '标识类': 'tag-info', '度量类': 'tag-purple', '描述类': 'tag-default',
            '分类类': 'tag-cyan', '时间类': 'tag-info', '状态类': 'tag-warning',
            '结构类': 'tag-purple', '未分类': 'tag-default'
        };
        return map[category] || 'tag-default';
    }

    function getSourceTagClass(source) {
        var map = { '全行标准': 'tag-info', '自定义升级': 'tag-warning' };
        return map[source] || 'tag-default';
    }

    function getBizTypeTagClass(type) {
        var map = {
            '文本': 'tag-default', '编号': 'tag-info', '代码': 'tag-cyan',
            '金额': 'tag-warning', '日期': 'tag-info', '数值': 'tag-purple',
            '标志': 'tag-success', '时间': 'tag-info'
        };
        return map[type] || 'tag-default';
    }

    /* ====== 渲染左侧业务域两级分类树 ====== */
    function renderCategoryTree() {
        var tree = document.getElementById('categoryTree');
        var html = '';

        DOMAIN_TREE.forEach(function(d, idx) {
            var isExpanded = !!state.expandedDomains[idx];
            var isDomainActive = idx === state.currentDomainIdx && state.currentSubIdx === -1;
            var folderIcon = isDomainActive ? 'fa-folder-open' : 'fa-folder-o';

            // 一级节点：业务域名 + 总数，点击展开/折叠并筛选
            html += '<div class="tree-node tree-node-level1 interactive' + (isDomainActive ? ' active' : '') + '" onclick="selectNode(' + idx + ', -1)">' +
                '<i class="fa fa-caret-right tree-arrow' + (isExpanded ? ' expanded' : '') + '"></i>' +
                '<i class="fa ' + folderIcon + '"></i>' +
                '<span class="node-name">' + d.name + '</span>' +
                '<span class="node-count">' + d.count.toLocaleString() + '</span>' +
                '</div>';

            // 二级子节点：仅在展开时渲染
            if (isExpanded) {
                html += '<div class="tree-children">';
                d.children.forEach(function(c, cIdx) {
                    var isChildActive = idx === state.currentDomainIdx && cIdx === state.currentSubIdx;
                    html += '<div class="tree-node tree-node-level2 interactive' + (isChildActive ? ' active' : '') + '" onclick="selectNode(' + idx + ', ' + cIdx + ')">' +
                        '<span class="node-name">' + c.name + '</span>' +
                        '<span class="node-count">' + c.count.toLocaleString() + '</span>' +
                        '</div>';
                });
                html += '</div>';
            }
        });

        tree.innerHTML = html;
    }

    /* ====== 选择树节点（一级/二级通用） ======
     * domainIdx: 业务域索引
     * subIdx: 子分类索引（-1表示选中整个业务域）
     * 点击一级节点：切换展开/折叠 + 筛选该域所有标准项
     * 点击二级节点：筛选该子分类下的标准项
     */
    window.selectNode = function (domainIdx, subIdx) {
        state.currentDomainIdx = domainIdx;
        state.currentSubIdx = subIdx;
        state.currentPage = 1;

        // 点击一级节点时切换展开/折叠状态
        if (subIdx === -1) {
            state.expandedDomains[domainIdx] = !state.expandedDomains[domainIdx];
        }

        renderCategoryTree();
        renderFieldTable();
    };

    /* ====== 获取筛选后的字段列表 ====== */
    function getFilteredFields() {
        var domain = DOMAIN_TREE[state.currentDomainIdx];
        var fields = domain.fields;
        var f = state.filters;

        return fields.filter(function(item) {
            // 子分类筛选：选中二级节点时仅显示对应子分类的标准项
            if (state.currentSubIdx >= 0) {
                var subCat = domain.children[state.currentSubIdx];
                if (item.subCategory !== subCat.name) return false;
            }
            // 关键字搜索（编号/中文名/英文名/常用名）
            if (f.keyword) {
                var kw = f.keyword.toLowerCase();
                var match = item.stdCode.toLowerCase().indexOf(kw) !== -1 ||
                            item.cnName.toLowerCase().indexOf(kw) !== -1 ||
                            item.enName.toLowerCase().indexOf(kw) !== -1 ||
                            (item.commonName !== '-' && item.commonName.toLowerCase().indexOf(kw) !== -1);
                if (!match) return false;
            }
            // 业务数据类型筛选
            if (f.bizDataType && item.bizDataType !== f.bizDataType) return false;
            // 优先级筛选
            if (f.priority && item.priority !== f.priority) return false;
            // 来源筛选
            if (f.source && item.source !== f.source) return false;
            return true;
        });
    }

    /* ====== 渲染单行字段 ====== */
    function renderFieldRow(f) {
        // 常用名称子文本
        var commonNameHtml = (f.commonName && f.commonName !== '-')
            ? '<div class="sub-text">常用: ' + f.commonName + '</div>'
            : '';

        // 枚举值引用
        var codeRefHtml = f.codeRef === '-'
            ? '<span style="color:#cbd5e1">-</span>'
            : '<span class="code-text" style="color:var(--secondary)">' + f.codeRef + '</span>';

        // 操作列
        var opsHtml = '<a class="btn-link interactive" style="padding:0 6px;cursor:pointer" onclick="viewField(\'' + f.stdCode + '\')"><i class="fa fa-eye"></i> 查看</a>';
        if (!isReadonly) {
            opsHtml += '<a class="btn-link interactive" style="padding:0 6px;cursor:pointer" onclick="openFieldModal(\'edit\',\'' + f.stdCode + '\')"><i class="fa fa-edit"></i> 编辑</a>';
            opsHtml += '<a class="btn-link interactive" style="padding:0 6px;color:var(--danger);cursor:pointer" onclick="deleteField(\'' + f.stdCode + '\',\'' + f.cnName + '\')"><i class="fa fa-trash-o"></i> 删除</a>';
            opsHtml += '<a class="btn-link interactive" style="padding:0 6px;color:var(--danger);cursor:pointer" onclick="disableField(\'' + f.stdCode + '\',\'' + f.cnName + '\')"><i class="fa fa-ban"></i> 停用</a>';
        }

        // 来源列：全行标准显示蓝色标签，自定义升级显示橙色标签+来源接口名
        var sourceHtml = '<span class="tag ' + getSourceTagClass(f.source) + '" style="font-size:11px">' + f.source + '</span>';
        if (f.source === '自定义升级' && f.sourceInterface) {
            sourceHtml += '<div class="sub-text">' + f.sourceInterface + '</div>';
        }

        return '<tr>' +
            '<td><input type="checkbox"></td>' +
            '<td><span class="code-text text-primary">' + f.stdCode + '</span></td>' +
            '<td><div>' + f.cnName + '</div>' + commonNameHtml + '</td>' +
            '<td><span class="code-text">' + f.enName + '</span></td>' +
            '<td><span class="tag tag-default" style="font-size:11px">' + f.categoryWord + '</span></td>' +
            '<td><span class="tag ' + getStdCategoryTagClass(f.stdCategory) + '" style="font-size:11px">' + f.stdCategory + '</span></td>' +
            '<td><span class="tag ' + getBizTypeTagClass(f.bizDataType) + '" style="font-size:11px">' + f.bizDataType + '</span></td>' +
            '<td><span class="code-text">' + f.dataFormat + '</span></td>' +
            '<td>' + codeRefHtml + '</td>' +
            '<td class="text-center"><span class="tag ' + getPriorityTagClass(f.priority) + '" style="font-size:11px">' + f.priority + '</span></td>' +
            '<td class="text-right num">' + f.refCount.toLocaleString() + '</td>' +
            '<td class="text-center">' + sourceHtml + '</td>' +
            '<td class="text-center op-col">' + opsHtml + '</td>' +
            '</tr>';
    }

    /* ====== 渲染字段表格 ====== */
    function renderFieldTable() {
        var domain = DOMAIN_TREE[state.currentDomainIdx];
        var filtered = getFilteredFields();
        var totalItems = filtered.length;
        var totalPages = Math.max(1, Math.ceil(totalItems / state.pageSize));

        // 修正当前页
        if (state.currentPage > totalPages) state.currentPage = totalPages;

        // 切片分页
        var start = (state.currentPage - 1) * state.pageSize;
        var pageData = filtered.slice(start, start + state.pageSize);

        // 更新标题：显示当前业务域 + 子分类（如有）
        var title = domain.name;
        if (state.currentSubIdx >= 0) {
            title += ' · ' + domain.children[state.currentSubIdx].name;
        }
        document.getElementById('rightTitle').textContent = title + ' · 标准项列表';
        document.getElementById('totalCount').textContent = totalItems.toLocaleString();

        // 渲染表格内容
        var tbody = document.getElementById('fieldTable');
        if (pageData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="13" style="text-align:center;padding:48px 0;color:#94a3b8">' +
                '<i class="fa fa-inbox" style="font-size:48px;display:block;margin-bottom:12px;color:#cbd5e1"></i>' +
                '<div style="font-size:14px">暂无标准项数据</div>' +
                '<div style="font-size:12px;margin-top:4px">该分类下暂无符合条件的数据，请调整筛选条件</div>' +
                '</td></tr>';
        } else {
            tbody.innerHTML = pageData.map(renderFieldRow).join('');
        }

        // 渲染分页器
        renderPagination(totalItems, totalPages);
    }

    /* ====== 渲染分页器 ====== */
    function renderPagination(totalItems, totalPages) {
        if (totalPages < 1) totalPages = 1;
        var currentPage = state.currentPage;
        var html = '';

        // 上一页按钮
        html += '<button onclick="goToPage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '><i class="fa fa-angle-left"></i></button>';

        // 页码按钮（不超过7页时全部展示，超过时展示首尾及当前页附近）
        if (totalPages <= 7) {
            for (var i = 1; i <= totalPages; i++) {
                html += '<button onclick="goToPage(' + i + ')"' + (i === currentPage ? ' class="active"' : '') + '>' + i + '</button>';
            }
        } else {
            // 首页
            html += '<button onclick="goToPage(1)"' + (1 === currentPage ? ' class="active"' : '') + '>1</button>';
            if (currentPage > 3) html += '<button disabled>...</button>';
            // 当前页附近
            var startPage = Math.max(2, currentPage - 1);
            var endPage = Math.min(totalPages - 1, currentPage + 1);
            for (var j = startPage; j <= endPage; j++) {
                html += '<button onclick="goToPage(' + j + ')"' + (j === currentPage ? ' class="active"' : '') + '>' + j + '</button>';
            }
            if (currentPage < totalPages - 2) html += '<button disabled>...</button>';
            // 尾页
            html += '<button onclick="goToPage(' + totalPages + ')"' + (totalPages === currentPage ? ' class="active"' : '') + '>' + totalPages + '</button>';
        }

        // 下一页按钮
        html += '<button onclick="goToPage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '><i class="fa fa-angle-right"></i></button>';

        document.getElementById('pageList').innerHTML = html;
    }

    /* ====== 分页跳转 ====== */
    window.goToPage = function (page) {
        var totalItems = getFilteredFields().length;
        var totalPages = Math.max(1, Math.ceil(totalItems / state.pageSize));
        if (page < 1 || page > totalPages) return;
        state.currentPage = page;
        renderFieldTable();
    };

    /* ====== 切换每页条数 ====== */
    window.changePageSize = function (select) {
        state.pageSize = parseInt(select.value, 10);
        state.currentPage = 1;
        renderFieldTable();
    };

    /* ====== 应用筛选 ====== */
    window.applyFilters = function () {
        state.filters.keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();
        state.filters.bizDataType = document.getElementById('filterBizType').value;
        state.filters.priority = document.getElementById('filterPriority').value;
        state.filters.source = document.getElementById('filterSource').value;
        state.currentPage = 1;
        renderFieldTable();
        showToast('已按条件筛选');
    };

    /* ====== 重置筛选 ====== */
    window.resetFilters = function () {
        document.getElementById('filterKeyword').value = '';
        document.getElementById('filterBizType').value = '';
        document.getElementById('filterPriority').value = '';
        document.getElementById('filterSource').value = '';
        state.filters = { keyword: '', bizDataType: '', priority: '', source: '' };
        state.currentPage = 1;
        renderFieldTable();
        showToast('已重置筛选条件');
    };

    /* ====== 查看标准项详情 ====== */
    window.viewField = function (stdCode) {
        var breadcrumb = isReadonly
            ? ['首页', '标准规范', '数据标准查询', '字段详情']
            : ['首页', '标准规范管理', '数据标准分类', '字段详情'];
        var params = { stdCode: stdCode, from: 'category' };
        if (isReadonly) params.mode = 'readonly';
        govNav('pages/datadict/field-detail.html', breadcrumb, params);
    };

    /* ====== 删除标准项 ====== */
    window.deleteField = function (stdCode, cnName) {
        if (confirm('确认删除标准项【' + stdCode + ' - ' + cnName + '】？\n\n注意：该标准项被多个系统引用，删除后将影响引用方的字段解析与校验。')) {
            showToast('标准项已删除（实际环境需校验引用为空后方可删除）');
        }
    };

    /* ====== 停用标准项 ====== */
    window.disableField = function (stdCode, cnName) {
        if (confirm('确认停用标准项【' + stdCode + ' - ' + cnName + '】？\n\n停用后相关系统将无法引用该标准项。')) {
            showToast('标准项【' + stdCode + '】已停用');
        }
    };

    /* ====== 打开新增/编辑分类 Modal ======
     * mode: 'add' 新增 | 'edit' 编辑
     * catName: 编辑模式下传入的分类名称
     */
    window.openCategoryModal = function (mode, catName) {
        var modal = document.getElementById('categoryModal');
        var titleEl = document.getElementById('categoryModalTitle');
        var parentSelect = document.getElementById('catParent');

        // 设置标题
        if (mode === 'edit') {
            titleEl.innerHTML = '<i class="fa fa-edit" style="margin-right:8px;color:var(--primary)"></i>编辑分类';
        } else {
            titleEl.innerHTML = '<i class="fa fa-folder-plus-o" style="margin-right:8px;color:var(--primary)"></i>新增分类';
        }

        // 动态填充上级分类（基于左侧树）
        var html = '<option value="">无（顶级分类）</option>';
        DOMAIN_TREE.forEach(function (d) {
            html += '<option value="' + d.name + '">' + d.name + '</option>';
            d.children.forEach(function (c) {
                html += '<option value="' + c.name + '">　' + c.name + '</option>';
            });
        });
        parentSelect.innerHTML = html;

        // 填充表单
        if (mode === 'edit' && catName) {
            document.getElementById('catName').value = catName;
            var found = DOMAIN_TREE.find(function (d) { return d.name === catName; });
            document.getElementById('catCode').value = found ? found.code : '';
            document.getElementById('catSort').value = '0';
            document.getElementById('catDesc').value = '';
            parentSelect.value = '';
        } else {
            document.getElementById('catName').value = '';
            document.getElementById('catCode').value = '';
            document.getElementById('catSort').value = '';
            document.getElementById('catDesc').value = '';
            // 默认选中当前业务域作为上级
            var currentDomain = DOMAIN_TREE[state.currentDomainIdx];
            if (currentDomain) {
                parentSelect.value = currentDomain.name;
            }
        }

        modal.style.display = 'flex';
    };

    /* ====== 关闭分类 Modal ====== */
    window.closeCategoryModal = function () {
        document.getElementById('categoryModal').style.display = 'none';
    };

    /* ====== 保存分类 ====== */
    window.saveCategory = function () {
        var name = document.getElementById('catName').value.trim();
        var code = document.getElementById('catCode').value.trim();
        if (!name) {
            showToast('请输入分类名称');
            return;
        }
        if (!code) {
            showToast('请输入分类编码');
            return;
        }
        showToast('分类【' + name + '】已保存');
        closeCategoryModal();
        renderCategoryTree();
    };

    /* ====== 打开新增/编辑标准项 Modal ======
     * mode: 'add' 新增 | 'edit' 编辑
     * fieldId: 编辑模式下传入的标准项编号
     */
    window.openFieldModal = function (mode, fieldId) {
        var modal = document.getElementById('fieldModal');
        var titleEl = document.getElementById('fieldModalTitle');

        // 设置标题
        if (mode === 'edit') {
            titleEl.innerHTML = '<i class="fa fa-edit" style="margin-right:8px;color:var(--primary)"></i>编辑标准项';
        } else {
            titleEl.innerHTML = '<i class="fa fa-plus-circle" style="margin-right:8px;color:var(--primary)"></i>新增标准项';
        }

        // 填充表单
        if (mode === 'edit' && fieldId) {
            // 查找标准项
            var foundField = null;
            DOMAIN_TREE.forEach(function (d) {
                d.fields.forEach(function (f) {
                    if (f.stdCode === fieldId) foundField = f;
                });
            });
            if (foundField) {
                document.getElementById('fieldCode').value = foundField.stdCode;
                document.getElementById('fieldCnName').value = foundField.cnName;
                document.getElementById('fieldEnName').value = foundField.enName;
                document.getElementById('fieldFormat').value = foundField.dataFormat;
                document.getElementById('fieldRemark').value = '';
            }
        } else {
            // 新增模式，清空表单
            document.getElementById('fieldCode').value = '';
            document.getElementById('fieldCnName').value = '';
            document.getElementById('fieldEnName').value = '';
            document.getElementById('fieldFormat').value = '';
            document.getElementById('fieldRemark').value = '';
        }

        modal.style.display = 'flex';
    };

    /* ====== 关闭标准项 Modal ====== */
    window.closeFieldModal = function () {
        document.getElementById('fieldModal').style.display = 'none';
    };

    /* ====== 保存标准项 ====== */
    window.saveField = function () {
        var cnName = document.getElementById('fieldCnName').value.trim();
        var enName = document.getElementById('fieldEnName').value.trim();
        if (!cnName) {
            showToast('请输入标准中文名称');
            return;
        }
        if (!enName) {
            showToast('请输入标准英文名称');
            return;
        }
        showToast('标准项【' + cnName + '】已保存');
        closeFieldModal();
        renderFieldTable();
    };

    /* ====== 只读模式处理 ====== */
    function handleReadonlyMode() {
        var tEl = document.getElementById('pageTitle');
        var dEl = document.getElementById('pageDesc');
        if (isReadonly) {
            // 只读模式：用户侧标题为"数据标准查询"
            if (tEl) tEl.innerHTML = '<i class="fa fa-search" style="color:var(--primary);margin-right:8px"></i>数据标准查询';
            if (dEl) dEl.textContent = '按业务域查询全行标准数据项与枚举值配置（只读模式）';
            document.title = '数据标准查询 - 标准规范管理';
        } else {
            // 管理侧标题为"字典管理"
            if (tEl) tEl.innerHTML = '<i class="fa fa-sitemap" style="color:var(--primary);margin-right:8px"></i>字典管理';
            if (dEl) dEl.textContent = '首页 / 标准规范管理 / 字典管理 - 管理全行数据标准分类体系';
            document.title = '字典管理 - 标准规范管理';
        }

        // 隐藏操作按钮
        var addCat = document.getElementById('btnAddCategory');
        var addField = document.getElementById('btnAddFieldLink');
        var batchDisable = document.getElementById('btnBatchDisable');
        if (addCat) addCat.style.display = 'none';
        if (addField) addField.style.display = 'none';
        if (batchDisable) batchDisable.style.display = 'none';
    }

    /* ====== 初始化 ====== */
    function init() {
        handleReadonlyMode();
        renderCategoryTree();
        renderFieldTable();
    }

    // 执行初始化（兼容DOMContentLoaded已触发的情况）
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
