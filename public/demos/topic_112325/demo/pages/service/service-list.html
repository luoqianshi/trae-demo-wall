<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务清单 - 服务目录</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <script src="../../js/nav-helper.js"></script>
    <style>
        /* ====== 加载中遮罩 ====== */
        .loading-mask {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.3s;
        }
        .loading-mask .spinner { font-size: 32px; color: var(--primary); }
        .loading-mask .loading-text { margin-left: 12px; color: var(--text-secondary); font-size: 14px; }

        /* ====== 面包屑 ====== */
        .page-breadcrumb {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .page-breadcrumb .bc-item { color: var(--text-secondary); }
        .page-breadcrumb .bc-item.active { color: var(--text-primary); font-weight: 600; }
        .page-breadcrumb .bc-sep { color: var(--text-light); }

        /* ====== 系统上下文横幅 ====== */
        .sys-context {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: linear-gradient(90deg,#eff6ff,#f0fdfa);
            border: 1px solid #bfdbfe; border-radius: 8px; margin-bottom: 16px;
            font-size: 13px; color: #1e40af;
        }
        .sys-context .sys-sep { margin: 0 10px; color: #94a3b8; }

        /* ====== Tab 计数徽章 ====== */
        .tab-item .tab-count {
            display: inline-block; min-width: 18px; height: 18px; line-height: 18px;
            padding: 0 6px; margin-left: 6px; border-radius: 9px;
            background: #f1f5f9; color: var(--text-secondary);
            font-size: 11px; font-weight: 600; text-align: center;
        }
        .tab-item.active .tab-count { background: rgba(37,99,235,0.15); color: var(--primary); }

        /* ====== 搜索框 ====== */
        .search-box { position: relative; }
        .search-box input { padding-left: 30px; }
        .search-box .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

        /* ====== 服务类型标签 ====== */
        .tag-type-api  { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
        .tag-type-file { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }

        /* ====== 空状态 ====== */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state .empty-icon { font-size: 48px; color: #cbd5e1; margin-bottom: 12px; }
    </style>
</head>
<body>

<!-- ====== 加载中遮罩 ====== -->
<div class="loading-mask" id="loadingMask">
    <i class="fa fa-spinner fa-pulse spinner"></i>
    <span class="loading-text">正在加载服务清单...</span>
</div>

<div class="page-wrapper">

    <!-- ====== 面包屑 ====== -->
    <div class="page-breadcrumb">
        <span class="bc-item">首页</span>
        <span class="bc-sep">/</span>
        <span class="bc-item"><i class="fa fa-sitemap"></i> 服务目录</span>
        <span class="bc-sep">/</span>
        <span class="bc-item active">服务清单</span>
    </div>

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-list" style="color:var(--primary);margin-right:8px"></i>服务清单</h2>
            <div class="page-desc">
                首页 / 服务目录 / 服务清单 - 按系统维度统一展示其名下所有服务（API 接口 + 文件服务）· 当前筛选系统：<span id="descSystem">全部系统</span>
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="window.location.reload()"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default" onclick="showToast('正在导出服务清单...')"><i class="fa fa-download"></i> 导出</button>
        </div>
    </div>

    <!-- ====== 系统上下文 ====== -->
    <div class="sys-context">
        <div>
            <i class="fa fa-server" style="margin-right:6px"></i>
            当前系统：<b id="ctxSystem">全部系统</b>
            <span class="sys-sep">·</span>
            服务总数 <b id="ctxTotal">8</b>
            <span class="sys-sep">·</span>
            API 接口 <b id="ctxApiCount">4</b>
            <span class="sys-sep">·</span>
            文件服务 <b id="ctxFileCount">4</b>
        </div>
        <div>
            <button class="btn btn-link btn-sm" onclick="clearSystemFilter()"><i class="fa fa-remove"></i> 清除系统筛选</button>
        </div>
    </div>

    <!-- ====== 服务类型 Tab ====== -->
    <div class="tabs" id="typeTabs">
        <div class="tab-item active" data-type="all"><i class="fa fa-th-large"></i> 全部 <span class="tab-count" id="cnt-all">8</span></div>
        <div class="tab-item" data-type="API"><i class="fa fa-plug"></i> API 接口 <span class="tab-count" id="cnt-API">4</span></div>
        <div class="tab-item" data-type="FILE"><i class="fa fa-file-text-o"></i> 文件服务 <span class="tab-count" id="cnt-FILE">4</span></div>
    </div>

    <!-- ====== 筛选区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>服务名称/编码</label>
                <div class="search-box">
                    <i class="fa fa-search search-icon"></i>
                    <input type="text" class="form-control" id="fKeyword" placeholder="搜索服务名称或编码..." oninput="onFilterChange()">
                </div>
            </div>
            <div class="form-item">
                <label>所属系统</label>
                <select class="form-control" id="fSystem" onchange="onFilterChange()">
                    <option value="">全部系统</option>
                    <option value="核心业务系统">核心业务系统</option>
                    <option value="信贷管理系统">信贷管理系统</option>
                    <option value="风险管理系统">风险管理系统</option>
                    <option value="会计总账系统">会计总账系统</option>
                    <option value="客户关系管理">客户关系管理</option>
                    <option value="电子渠道系统">电子渠道系统</option>
                    <option value="支付清算系统">支付清算系统</option>
                </select>
            </div>
            <div class="form-item">
                <label>状态</label>
                <select class="form-control" id="fStatus" onchange="onFilterChange()">
                    <option value="">全部</option>
                    <option value="运行中">运行中</option>
                    <option value="异常">异常</option>
                    <option value="已停用">已停用</option>
                    <option value="已废弃">已废弃</option>
                </select>
            </div>
            <div class="form-item">
                <label>分类</label>
                <select class="form-control" id="fCategory" onchange="onFilterChange()">
                    <option value="">全部分类</option>
                    <option value="客户服务">客户服务</option>
                    <option value="账户服务">账户服务</option>
                    <option value="信贷服务">信贷服务</option>
                    <option value="风控服务">风控服务</option>
                    <option value="清算报表">清算报表</option>
                    <option value="对账文件">对账文件</option>
                    <option value="财务报表">财务报表</option>
                    <option value="数据导出">数据导出</option>
                </select>
            </div>
            <div class="form-item" style="gap:8px">
                <button class="btn btn-primary" onclick="onFilterChange()"><i class="fa fa-search"></i> 筛选</button>
                <button class="btn btn-default" onclick="resetFilters()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 数据表格 ====== -->
    <div class="card">
        <div class="card-body" style="padding:0">
            <div class="table-wrapper" style="border:none; border-radius:0">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width:50px" class="text-center">序号</th>
                            <th style="width:160px">服务编码</th>
                            <th>服务名称</th>
                            <th style="width:90px" class="text-center">服务类型</th>
                            <th style="width:90px" class="text-center">状态</th>
                            <th style="width:140px">所属系统</th>
                            <th style="width:120px">分类</th>
                            <th style="width:100px" class="text-center">SLA级别</th>
                            <th style="width:180px" class="text-center op-col">操作</th>
                        </tr>
                    </thead>
                    <tbody id="svcBody"></tbody>
                </table>
            </div>
            <!-- 空状态 -->
            <div class="empty-state" id="emptyState" style="display:none">
                <div class="empty-icon"><i class="fa fa-inbox"></i></div>
                <div>未找到匹配的服务</div>
            </div>
            <!-- 分页器 -->
            <div class="pagination" id="pager"></div>
        </div>
    </div>

</div>

<script>
(function () {
    'use strict';

    // ============ 服务清单 mock 数据（4 API + 4 FILE 混合） ============
    var SERVICES = [
        { code: 'API-CUS-0001',    name: '客户基本信息查询',     type: 'API',  status: '运行中', system: '核心业务系统', category: '客户服务', sla: 'L1' },
        { code: 'API-DEP-0012',    name: '账户余额查询',         type: 'API',  status: '运行中', system: '核心业务系统', category: '账户服务', sla: 'L1' },
        { code: 'API-LOAN-0023',   name: '贷款账户明细查询',     type: 'API',  status: '异常',   system: '信贷管理系统', category: '信贷服务', sla: 'L2' },
        { code: 'API-RISK-0008',   name: '风险评级查询',         type: 'API',  status: '运行中', system: '风险管理系统', category: '风控服务', sla: 'L2' },
        { code: 'FILE-PAY-0088',   name: '大额支付日报表',       type: 'FILE', status: '运行中', system: '支付清算系统', category: '清算报表', sla: 'L2' },
        { code: 'FILE-RECON-0156', name: '银联清分对账文件',     type: 'FILE', status: '异常',   system: '支付清算系统', category: '对账文件', sla: 'L1' },
        { code: 'FILE-GL-0042',    name: '总账科目余额表',       type: 'FILE', status: '已停用', system: '会计总账系统', category: '财务报表', sla: 'L3' },
        { code: 'FILE-CUST-0118',  name: '客户信息全量导出',     type: 'FILE', status: '运行中', system: '客户关系管理', category: '数据导出', sla: 'L3' }
    ];

    var PAGE_SIZE = 10;
    var currentPage = 1;
    var currentType = 'all';

    /** 数字格式化 */
    function fmtNum(n) { return Number(n).toLocaleString('en-US'); }

    /** 读取筛选条件 */
    function readFilters() {
        return {
            keyword: document.getElementById('fKeyword').value.trim().toLowerCase(),
            system: document.getElementById('fSystem').value,
            status: document.getElementById('fStatus').value,
            category: document.getElementById('fCategory').value
        };
    }

    /** 过滤数据（应用 Tab 类型 + 各筛选条件） */
    function getFilteredServices() {
        var f = readFilters();
        return SERVICES.filter(function (s) {
            // Tab 类型过滤
            if (currentType !== 'all' && s.type !== currentType) return false;
            // 关键词（名称或编码）
            if (f.keyword) {
                var hit = s.name.toLowerCase().indexOf(f.keyword) >= 0 ||
                          s.code.toLowerCase().indexOf(f.keyword) >= 0;
                if (!hit) return false;
            }
            // 所属系统
            if (f.system && s.system !== f.system) return false;
            // 状态
            if (f.status && s.status !== f.status) return false;
            // 分类
            if (f.category && s.category !== f.category) return false;
            return true;
        });
    }

    /** 状态标签 class */
    function getStatusTagClass(status) {
        var map = { '运行中': 'tag-success', '异常': 'tag-danger', '已停用': 'tag-warning', '已废弃': 'tag-default' };
        return map[status] || 'tag-default';
    }

    /** SLA 级别标签 class + 文本 */
    function getSlaTag(sla) {
        var map = {
            'L1': { cls: 'tag-level-a', text: 'L1·关键' },
            'L2': { cls: 'tag-level-b', text: 'L2·重要' },
            'L3': { cls: 'tag-level-c', text: 'L3·一般' }
        };
        return map[sla] || { cls: 'tag-default', text: sla };
    }

    /** 渲染表格（当前页） */
    function renderTable() {
        var list = getFilteredServices();
        var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        var start = (currentPage - 1) * PAGE_SIZE;
        var pageData = list.slice(start, start + PAGE_SIZE);

        var body = document.getElementById('svcBody');
        var empty = document.getElementById('emptyState');

        if (list.length === 0) {
            body.innerHTML = '';
            empty.style.display = 'block';
            renderPager(0, totalPages);
            updateTabCounts();
            return;
        }
        empty.style.display = 'none';

        body.innerHTML = pageData.map(function (s, i) {
            var typeTag = s.type === 'API'
                ? '<span class="tag tag-type-api"><i class="fa fa-plug"></i> API</span>'
                : '<span class="tag tag-type-file"><i class="fa fa-file-text-o"></i> FILE</span>';
            var sla = getSlaTag(s.sla);
            var detailIcon = s.type === 'API' ? 'fa-search' : 'fa-file-text-o';
            var applyLink = s.type === 'API'
                ? '<a class="btn-link" style="cursor:pointer;margin-left:8px" onclick="navTo(\'pages/application/api-call-apply.html\',\'接口服务调用申请\',{type:\'API_CALL\',code:\'' + s.code + '\',name:\'' + s.name + '\'})"><i class="fa fa-share"></i> 申请调用</a>'
                : '<a class="btn-link" style="cursor:pointer;margin-left:8px" onclick="navTo(\'pages/application/file-subscription-apply.html\',\'文件服务订阅申请\',{type:\'FILE_SUB\',code:\'' + s.code + '\',name:\'' + s.name + '\'})"><i class="fa fa-file-text-o"></i> 订阅</a>';
            return '<tr>' +
                '<td class="text-center num">' + (start + i + 1) + '</td>' +
                '<td><span style="font-family:\'Segoe UI\',sans-serif;font-weight:600;color:var(--primary)">' + s.code + '</span></td>' +
                '<td style="font-weight:500">' + s.name + '</td>' +
                '<td class="text-center">' + typeTag + '</td>' +
                '<td class="text-center"><span class="tag ' + getStatusTagClass(s.status) + '">' + s.status + '</span></td>' +
                '<td>' + s.system + '</td>' +
                '<td>' + s.category + '</td>' +
                '<td class="text-center"><span class="tag ' + sla.cls + '">' + sla.text + '</span></td>' +
                '<td class="text-center op-col">' +
                    '<a class="btn-link" style="cursor:pointer" onclick="goDetail(\'' + s.type + '\',\'' + s.code + '\',\'' + s.name + '\')"><i class="fa ' + detailIcon + '"></i> 查看详情</a>' +
                    applyLink +
                '</td>' +
            '</tr>';
        }).join('');

        renderPager(list.length, totalPages);
        updateTabCounts();
    }

    /** 更新 Tab 计数（基于当前非类型筛选条件，分类型统计） */
    function updateTabCounts() {
        var f = readFilters();
        // 统计时排除类型过滤，仅按其他条件
        var base = SERVICES.filter(function (s) {
            if (f.keyword) {
                var hit = s.name.toLowerCase().indexOf(f.keyword) >= 0 ||
                          s.code.toLowerCase().indexOf(f.keyword) >= 0;
                if (!hit) return false;
            }
            if (f.system && s.system !== f.system) return false;
            if (f.status && s.status !== f.status) return false;
            if (f.category && s.category !== f.category) return false;
            return true;
        });
        var apiCnt = base.filter(function (s) { return s.type === 'API'; }).length;
        var fileCnt = base.filter(function (s) { return s.type === 'FILE'; }).length;
        document.getElementById('cnt-all').textContent = base.length;
        document.getElementById('cnt-API').textContent = apiCnt;
        document.getElementById('cnt-FILE').textContent = fileCnt;

        // 上下文横幅同步
        document.getElementById('ctxTotal').textContent = base.length;
        document.getElementById('ctxApiCount').textContent = apiCnt;
        document.getElementById('ctxFileCount').textContent = fileCnt;
    }

    /** 渲染分页器 */
    function renderPager(total, totalPages) {
        var pager = document.getElementById('pager');
        var start = total === 0 ? 0 : (currentPage - 1) * PAGE_SIZE + 1;
        var end = Math.min(currentPage * PAGE_SIZE, total);

        var btns = '';
        btns += '<button onclick="goPage(' + (currentPage - 1) + ')"><i class="fa fa-angle-left"></i></button>';
        for (var p = 1; p <= totalPages; p++) {
            btns += '<button class="' + (p === currentPage ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
        }
        btns += '<button onclick="goPage(' + (currentPage + 1) + ')"><i class="fa fa-angle-right"></i></button>';

        pager.innerHTML =
            '<div class="page-info">共 ' + total + ' 条，当前第 ' + start + '-' + end + ' 条 / 每页 ' + PAGE_SIZE + ' 条</div>' +
            '<div class="page-list">' + btns + '</div>';
    }

    /** 翻页 */
    window.goPage = function (page) {
        var totalPages = Math.max(1, Math.ceil(getFilteredServices().length / PAGE_SIZE));
        if (page < 1) { showToast('已是第一页', 'warning'); return; }
        if (page > totalPages) { showToast('已是最后一页', 'warning'); return; }
        currentPage = page;
        renderTable();
    };

    /** 筛选条件变化 */
    window.onFilterChange = function () {
        currentPage = 1;
        renderTable();
    };

    /** 重置筛选 */
    window.resetFilters = function () {
        document.getElementById('fKeyword').value = '';
        document.getElementById('fSystem').value = '';
        document.getElementById('fStatus').value = '';
        document.getElementById('fCategory').value = '';
        currentPage = 1;
        renderTable();
        showToast('已重置筛选条件', 'success');
    };

    /** 清除系统筛选 */
    window.clearSystemFilter = function () {
        document.getElementById('fSystem').value = '';
        currentPage = 1;
        renderTable();
        document.getElementById('ctxSystem').textContent = '全部系统';
        document.getElementById('descSystem').textContent = '全部系统';
    };

    /** 跳转服务详情（按类型分流） */
    window.goDetail = function (type, code, name) {
        if (type === 'API') {
            govNav('pages/interface/api-detail.html', ['首页', '服务目录', '接口服务清单', name], { code: code });
        } else {
            govNav('pages/interface/file-detail.html', ['首页', '服务目录', '文件服务清单', name], { code: code });
        }
    };

    /** Tab 切换 */
    function bindTabs() {
        document.querySelectorAll('#typeTabs .tab-item').forEach(function (tab) {
            tab.addEventListener('click', function () {
                document.querySelectorAll('#typeTabs .tab-item').forEach(function (t) { t.classList.remove('active'); });
                tab.classList.add('active');
                currentType = tab.getAttribute('data-type');
                currentPage = 1;
                renderTable();
            });
        });
    }

    /** 从 URL 读取 system 参数并预填筛选 */
    function applySystemParam() {
        var system = govGetParam('system');
        if (system) {
            document.getElementById('fSystem').value = system;
            document.getElementById('ctxSystem').textContent = system;
            document.getElementById('descSystem').textContent = system;
        }
    }

    // 初始化
    applySystemParam();
    bindTabs();
    renderTable();

    // 模拟加载延迟后隐藏遮罩
    setTimeout(function () {
        var mask = document.getElementById('loadingMask');
        if (mask) {
            mask.style.opacity = '0';
            setTimeout(function () { mask.style.display = 'none'; }, 300);
        }
    }, 400);
})();
</script>
</body>
</html>
