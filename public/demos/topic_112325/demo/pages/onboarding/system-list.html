<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统清单管理 - 存量数据纳管</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../fonts/font-awesome/css/font-awesome.min.css">
    <style>
        .sys-stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:14px; }
        .sys-stat { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:14px; display:flex; justify-content:space-between; align-items:center; }
        .sys-stat .icon-circle { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; }
        .sys-stat .label { font-size:11px; color:var(--text-secondary); }
        .sys-stat .value { font-size:20px; font-weight:700; color:var(--text-primary); font-family:'Segoe UI'; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-server" style="color:var(--primary);margin-right:8px"></i>系统清单管理</h2>
            <div class="page-desc">
                首页 / 存量数据纳管 / 系统清单管理 - 统一管理全行信息系统清单，用于接口/文件服务的归属与责任体系，是后续治理工作的基础数据
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="govNav('pages/onboarding/import-page.html', ['首页','存量数据纳管','系统清单管理','导入页面'], {})"><i class="fa fa-upload"></i> 批量导入系统</button>
            <button class="btn btn-primary" onclick="govNav('pages/system/system-profile.html', ['首页','存量数据纳管','系统清单管理','系统详情'],{mode:'add'})"><i class="fa fa-plus-circle"></i> 新增系统</button>
            <button class="btn btn-default" onclick="govNav('pages/category/stats.html', ['首页','存量数据纳管','系统清单管理','系统状态统计'],{})"><i class="fa fa-bar-chart"></i> 系统状态统计</button>
        </div>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
            <label>所属部门</label>
            <select class="form-control"><option>全部</option><option>零售业务部</option><option>公司业务部</option><option>信贷管理部</option><option>风险管理部</option><option>运营管理部</option></select>
        </div>
        <div class="form-item">
            <label>系统状态</label>
            <select class="form-control"><option>全部</option><option>运行中</option><option>已下线</option><option>规划中</option></select>
        </div>
        <div class="form-item" style="flex:1">
            <label>关键字</label>
            <input type="text" class="form-control" placeholder="系统名称 / 系统编号 / 负责人">
        </div>
        <div class="form-item" style="min-width:auto">
            <button class="btn btn-primary" onclick="showToast('按条件查询系统清单')"><i class="fa fa-search"></i> 查询</button>
            <button class="btn btn-default" onclick="showToast('已重置查询条件')"><i class="fa fa-eraser"></i> 重置</button>
        </div>
        </div>
    </div>

    <!-- ====== 顶部指标卡 ====== -->
    <div class="sys-stats">
        <div class="sys-stat">
            <div><div class="label">总系统数</div><div class="value">42</div></div>
            <div class="icon-circle" style="background:#3b82f6"><i class="fa fa-server"></i></div>
        </div>
        <div class="sys-stat">
            <div><div class="label">运行中</div><div class="value">12</div></div>
            <div class="icon-circle" style="background:#10b981"><i class="fa fa-check-circle"></i></div>
        </div>
        <div class="sys-stat">
            <div><div class="label">已下线</div><div class="value">1</div></div>
            <div class="icon-circle" style="background:#64748b"><i class="fa fa-power-off"></i></div>
        </div>
        <div class="sys-stat">
            <div><div class="label">规划中</div><div class="value">1</div></div>
            <div class="icon-circle" style="background:#f59e0b"><i class="fa fa-clock-o"></i></div>
        </div>
        <div class="sys-stat">
            <div><div class="label">负责人数量</div><div class="value">13</div></div>
            <div class="icon-circle" style="background:#7c3aed"><i class="fa fa-users"></i></div>
        </div>
    </div>

    <!-- ====== 系统列表 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-list"></i> 系统清单</div>
            <div class="card-action"><span style="font-size:12px;color:var(--text-secondary)">当前展示 14 个系统样本（全行共 42 个系统）</span></div>
        </div>
        <div class="table-wrapper" style="border-left:none;border-right:none;border-top:none;border-radius:0">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:40px"><input type="checkbox"></th>
                        <th style="width:110px">系统编号</th>
                        <th>系统名称</th>
                        <th style="width:130px">所属部门</th>
                        <th style="width:110px">技术负责人</th>
                        <th style="width:110px">业务负责人</th>
                        <th style="width:90px" class="text-center">系统状态</th>
                        <th style="width:110px" class="text-right">纳管接口数</th>
                        <th style="width:130px">最后同步时间</th>
                        <th style="width:230px" class="text-center op-col">操作</th>
                    </tr>
                </thead>
                <tbody id="sysBody">
                    <tr id="loadingRow">
                        <td colspan="10" style="text-align:center; padding:40px 20px;">
                            <div style="display:inline-block;">
                                <i class="fa fa-spinner fa-pulse fa-2x fa-fw" style="color:var(--primary);"></i>
                                <p style="margin-top:12px;color:var(--text-secondary);font-size:13px;">数据加载中...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">14</span> 条记录</div>
            <div class="page-list">
                <button onclick="showToast('已是第一页')"><i class="fa fa-angle-left"></i></button>
                <button class="active" onclick="showToast('当前第 1 页')">1</button><button onclick="showToast('跳转到第 2 页')">2</button>
                <button onclick="showToast('跳转到第 2 页')"><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px"><option>10 条/页</option><option>20 条/页</option></select>
            </div>
        </div>
        <div id="errorState" style="display:none; text-align:center; padding:40px 20px;">
            <i class="fa fa-exclamation-circle" style="font-size:36px;color:var(--danger);"></i>
            <p style="margin-top:12px;color:var(--text-secondary);font-size:13px;">数据加载失败</p>
            <button class="btn btn-default" style="margin-top:12px;" onclick="location.reload()"><i class="fa fa-refresh"></i> 重新加载</button>
        </div>
    </div>

</div>
<script>
(function () {
    const data = [
        { no:'SYS-001', name:'核心账务系统', dept:'运营管理部', tech:'张工', biz:'李经理', status:'运行中', api:685, time:'2026-06-08 10:23' },
        { no:'SYS-002', name:'客户管理系统', dept:'零售业务部', tech:'王工', biz:'赵主管', status:'运行中', api:128, time:'2026-06-07 18:02' },
        { no:'SYS-003', name:'信贷管理系统', dept:'信贷管理部', tech:'刘工', biz:'陈经理', status:'运行中', api:156, time:'2026-06-07 15:11' },
        { no:'SYS-004', name:'支付清算系统', dept:'运营管理部', tech:'陈工', biz:'吴主管', status:'运行中', api:94, time:'2026-06-06 09:58' },
        { no:'SYS-005', name:'风险管理系统', dept:'风险管理部', tech:'孙工', biz:'周经理', status:'运行中', api:82, time:'2026-06-06 14:21' },
        { no:'SYS-006', name:'商户管理系统', dept:'公司业务部', tech:'周工', biz:'吴经理', status:'运行中', api:67, time:'2026-06-05 11:30' },
        { no:'SYS-007', name:'对账中心', dept:'运营管理部', tech:'吴工', biz:'郑主管', status:'运行中', api:52, time:'2026-06-05 08:42' },
        { no:'SYS-008', name:'理财产品销售系统', dept:'零售业务部', tech:'郑工', biz:'王经理', status:'运行中', api:74, time:'2026-06-04 16:19' },
        { no:'SYS-009', name:'ECIF 客户信息平台', dept:'零售业务部', tech:'冯工', biz:'许经理', status:'运行中', api:88, time:'2026-06-04 09:05' },
        { no:'SYS-010', name:'渠道接入平台', dept:'运营管理部', tech:'许工', biz:'何经理', status:'运行中', api:103, time:'2026-06-03 17:44' },
        { no:'SYS-011', name:'反洗钱监控系统', dept:'风险管理部', tech:'何工', biz:'吕主管', status:'运行中', api:46, time:'2026-06-03 13:22' },
        { no:'SYS-012', name:'原综合业务系统（旧）', dept:'运营管理部', tech:'吕工', biz:'施经理', status:'已下线', api:0, time:'2025-12-31 23:59' },
        { no:'SYS-013', name:'新一代网银系统（V2', dept:'零售业务部', tech:'施工', biz:'张主管', status:'规划中', api:0, time:'2026-06-02 10:15' },
        { no:'SYS-014', name:'监管报送平台', dept:'风险管理部', tech:'张工', biz:'孔经理', status:'运行中', api:38, time:'2026-06-02 15:48' }
    ];
    const sysBody = document.getElementById('sysBody');
    if (data.length === 0) {
        sysBody.innerHTML = '<tr><td colspan="10" class="empty-state"><i class="fa fa-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>暂无系统数据，请点击「新增系统」或「批量导入系统」</td></tr>';
    } else {
    sysBody.innerHTML = data.map(d => {
        let tag = 'tag-success';
        if (d.status === '已下线') tag = 'tag-default';
        else if (d.status === '规划中') tag = 'tag-warning';
        return `
        <tr>
            <td><input type="checkbox"></td>
            <td style="font-family:'Segoe UI';color:var(--primary);font-weight:600">${d.no}</td>
            <td>${d.name}</td>
            <td>${d.dept}</td>
            <td>${d.tech}</td>
            <td>${d.biz}</td>
            <td class="text-center"><span class="tag ${tag}" style="font-size:11px">${d.status}</span></td>
            <td class="text-right num">${d.api}</td>
            <td>${d.time}</td>
            <td class="text-center op-col">
                <a class="btn-link" style="cursor:pointer" onclick="govNav('pages/system/system-profile.html', ['首页','存量数据纳管','系统清单管理','系统详情'],{sysNo:'${d.no}'})"><i class="fa fa-eye"></i> 查看</a>
                <a class="btn-link" style="cursor:pointer" onclick="showToast('编辑「${d.name}」系统信息')"><i class="fa fa-pencil"></i> 编辑</a>
                <a class="btn-link" style="cursor:pointer" onclick="showToast('同步「${d.name}」接口数据')"><i class="fa fa-refresh"></i> 同步</a>
                <a class="btn-link" style="color:var(--danger);cursor:pointer" onclick="if(confirm('确认下线「${d.name}」？下线后关联接口将不可调用，此操作不可逆')){showToast('系统「${d.name}」下线操作已提交')}"><i class="fa fa-power-off"></i> 下线</a>
            </td>
        </tr>`;
    }).join('');
    }
})();

window.addEventListener('load', function() {
    setTimeout(function() {
        var lr = document.getElementById('loadingRow');
        if (lr) lr.style.display = 'none';
    }, 800);
});
</script>
</body>
</html>
