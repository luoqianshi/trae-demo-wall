<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银行服务治理平台 - Bank Service Governance Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="fonts/font-awesome/css/font-awesome.min.css">
<style>
    /* 顶部标签栏样式 */
    .tab-bar {
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
        padding: 0 8px;
        display: flex;
        align-items: center;
        overflow-x: auto;
        white-space: nowrap;
        min-height: 38px;
        flex-shrink: 0;
    }
    .tab-bar::-webkit-scrollbar { height: 0; }
    .tab-item-tab {
        display: inline-flex;
        align-items: center;
        padding: 8px 14px;
        font-size: 13px;
        color: #64748b;
        cursor: pointer;
        border-right: 1px solid #e2e8f0;
        position: relative;
        user-select: none;
        transition: all 0.15s;
        gap: 8px;
        flex-shrink: 0;
    }
    .tab-item-tab:first-child { border-left: 1px solid #e2e8f0; }
    .tab-item-tab:hover { background: #f8fafc; color: #334155; }
    .tab-item-tab.active {
        background: #eff6ff;
        color: #2563eb;
        border-bottom: 2px solid #2563eb;
        font-weight: 500;
    }
    .tab-item-tab .tab-icon {
        font-size: 12px;
        color: #94a3b8;
    }
    .tab-item-tab.active .tab-icon { color: #2563eb; }
    .tab-item-tab .tab-close {
        width: 16px; height: 16px;
        display: inline-flex;
        align-items: center; justify-content: center;
        border-radius: 50%;
        color: #94a3b8;
        font-size: 11px;
    }
    .tab-item-tab .tab-close:hover { background: #e2e8f0; color: #dc2626; }
    .tab-item-tab.active .tab-close { color: #2563eb; }
    .tab-item-tab.active .tab-close:hover { background: #2563eb; color: #fff; }

    .main-wrapper { display: flex; flex-direction: column; height: 100vh; }
    .topbar { flex-shrink: 0; }
    .content-area { flex: 1; min-height: 0; position: relative; background: #f1f5f9; }
    .content-area iframe {
        width: 100%; height: 100%;
        border: none; display: block;
        position: absolute; top: 0; left: 0;
    }
    .content-area iframe.hidden-frame { display: none; }

    /* ===== 全局环境切换器 ===== */
    .env-switcher-wrapper { position: relative; }
    .env-switcher-btn {
        display: flex; align-items: center; gap: 8px;
        height: 36px; padding: 0 14px;
        background: #f1f5f9; border: 1px solid #e2e8f0;
        border-radius: 6px; cursor: pointer;
        font-size: 13px; color: #334155;
        transition: all 0.2s; white-space: nowrap;
    }
    .env-switcher-btn:hover { background: #fff; border-color: #2563eb; }
    .env-switcher-btn .env-dot {
        width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .env-switcher-btn .env-label { font-weight: 600; }
    .env-switcher-btn .env-desc { font-size: 11px; color: #94a3b8; }
    .env-switcher-btn .fa { font-size: 11px; color: #94a3b8; margin-left: 4px; }

    .env-switcher-dropdown {
        position: absolute; top: 42px; right: 0;
        width: 320px; background: #fff;
        border: 1px solid #e2e8f0; border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        z-index: 200; display: none;
    }
    .env-switcher-dropdown.show { display: block; }
    .env-switcher-dropdown .esd-header {
        padding: 10px 14px; border-bottom: 1px solid #f1f5f9;
        font-size: 12px; color: #64748b; font-weight: 600;
        display: flex; align-items: center; gap: 6px;
    }
    .env-switcher-dropdown .esd-list { padding: 6px 0; }
    .env-switcher-dropdown .esd-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 14px; cursor: pointer; transition: background 0.15s;
    }
    .env-switcher-dropdown .esd-item:hover { background: #f8fafc; }
    .env-switcher-dropdown .esd-item.active { background: #eff6ff; }
    .env-switcher-dropdown .esd-item .esd-dot {
        width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .env-switcher-dropdown .esd-item .esd-info { flex: 1; }
    .env-switcher-dropdown .esd-item .esd-name { font-size: 13px; font-weight: 600; color: #1e293b; }
    .env-switcher-dropdown .esd-item .esd-desc { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .env-switcher-dropdown .esd-item .esd-check { color: #2563eb; font-size: 14px; }
    .env-switcher-dropdown .esd-item:not(.active) .esd-check { display: none; }
    .env-switcher-dropdown .esd-footer {
        padding: 8px 14px; border-top: 1px solid #f1f5f9;
        font-size: 11px; color: #94a3b8; text-align: center;
    }
    /* 环境颜色定义 */
    .env-color-DEV { background: #3b82f6; }
    .env-color-SIT { background: #8b5cf6; }
    .env-color-UAT { background: #f59e0b; }
    .env-color-PROD { background: #ef4444; }
</style>
</head>
<body>

<div class="app-container">

    <!-- ========== 左侧侧边栏 ========== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fa fa-shield"></i></div>
            <div class="logo-text">
                <div class="logo-title">服务治理平台</div>
                <div class="logo-sub">Service Governance</div>
            </div>
        </div>
        <div class="sidebar-menu" id="sidebarMenu"><!-- 菜单项 JS 生成 --></div>
        <div class="sidebar-footer">
            <div class="version"><i class="fa fa-info-circle"></i> <span>版本 V2.3.0</span></div>
        </div>
    </aside>

    <!-- ========== 主内容区 ========== -->
    <div class="main-wrapper">

        <!-- 顶部导航栏 -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" title="收起/展开侧边栏"><i class="fa fa-bars"></i></button>
                <nav class="breadcrumb" id="breadcrumb">
                    <span class="bc-icon"><i class="fa fa-home"></i></span>
                    <span class="bc-item">首页</span>
                    <span class="bc-sep">/</span>
                    <span class="bc-item active">首页驾驶舱</span>
                </nav>
            </div>
            <div class="topbar-right">
                <div class="global-search">
                    <i class="fa fa-search"></i>
                    <input type="text" placeholder="全局搜索：接口/系统/字段/申请..." id="globalSearch">
                </div>

                <!-- 全局环境切换器 -->
                <div class="topbar-action env-switcher-wrapper">
                    <button class="env-switcher-btn" id="envSwitcherBtn" title="切换当前操作环境">
                        <span class="env-dot env-color-PROD" id="envDot"></span>
                        <span class="env-label" id="envLabel">PROD</span>
                        <span class="env-desc" id="envDesc">生产环境</span>
                        <i class="fa fa-caret-down"></i>
                    </button>
                    <div class="env-switcher-dropdown" id="envSwitcherDropdown">
                        <div class="esd-header"><i class="fa fa-server"></i> 切换操作环境</div>
                        <div class="esd-list">
                            <div class="esd-item" data-env="DEV" data-name="开发环境" onclick="switchEnvironment('DEV', '开发环境')">
                                <span class="esd-dot env-color-DEV"></span>
                                <div class="esd-info">
                                    <div class="esd-name">DEV · 开发环境</div>
                                    <div class="esd-desc">开发联调，版本迭代最快</div>
                                </div>
                                <i class="fa fa-check esd-check"></i>
                            </div>
                            <div class="esd-item" data-env="SIT" data-name="集成测试环境" onclick="switchEnvironment('SIT', '集成测试环境')">
                                <span class="esd-dot env-color-SIT"></span>
                                <div class="esd-info">
                                    <div class="esd-name">SIT · 集成测试</div>
                                    <div class="esd-desc">系统集成测试，验证接口联调</div>
                                </div>
                                <i class="fa fa-check esd-check"></i>
                            </div>
                            <div class="esd-item" data-env="UAT" data-name="验收测试环境" onclick="switchEnvironment('UAT', '验收测试环境')">
                                <span class="esd-dot env-color-UAT"></span>
                                <div class="esd-info">
                                    <div class="esd-name">UAT · 验收测试</div>
                                    <div class="esd-desc">用户验收测试，准生产数据</div>
                                </div>
                                <i class="fa fa-check esd-check"></i>
                            </div>
                            <div class="esd-item active" data-env="PROD" data-name="生产环境" onclick="switchEnvironment('PROD', '生产环境')">
                                <span class="esd-dot env-color-PROD"></span>
                                <div class="esd-info">
                                    <div class="esd-name">PROD · 生产环境</div>
                                    <div class="esd-desc">正式运行环境，最高管控等级</div>
                                </div>
                                <i class="fa fa-check esd-check"></i>
                            </div>
                        </div>
                        <div class="esd-footer">
                            <i class="fa fa-info-circle"></i> 切换环境后，各页面将展示对应环境的接口版本与配置
                        </div>
                    </div>
                </div>

                <!-- 消息通知 -->
                <div class="topbar-action notify-wrapper">
                    <button class="icon-btn" id="notifyBtn">
                        <i class="fa fa-bell-o"></i>
                        <span class="badge-dot">9</span>
                    </button>
                    <div class="dropdown notify-dropdown" id="notifyDropdown">
                        <div class="dropdown-header">
                            <span>消息通知</span>
                            <a href="pages/notify/message-list.html" class="dd-link">查看全部</a>
                        </div>
                        <div class="dropdown-list">
                            <div class="dd-item"><div class="dd-icon"><i class="fa fa-file-text-o"></i></div><div class="dd-content"><div class="dd-title">新的申请待审核</div><div class="dd-desc">您有 3 个接口变更申请待审核</div><div class="dd-time">10 分钟前</div></div></div>
                            <div class="dd-item"><div class="dd-icon"><i class="fa fa-exclamation-triangle"></i></div><div class="dd-content"><div class="dd-title">完整性预警</div><div class="dd-desc">客户信息文件服务存在依赖缺失</div><div class="dd-time">1 小时前</div></div></div>
                            <div class="dd-item"><div class="dd-icon"><i class="fa fa-tachometer"></i></div><div class="dd-content"><div class="dd-title">SLA 超阈值</div><div class="dd-desc">账户查询接口响应超时，请关注</div><div class="dd-time">2 小时前</div></div></div>
                        </div>
                    </div>
                </div>

                <!-- 管理后台切换 -->
                <div class="topbar-action">
                    <button class="btn btn-default btn-sm" id="modeSwitchBtn"><i class="fa fa-cogs"></i> 管理后台</button>
                </div>

                <!-- 用户 -->
                <div class="topbar-action user-wrapper">
                    <button class="user-btn" id="userBtn">
                        <div class="user-avatar"><span>ZY</span></div>
                        <div class="user-info">
                            <div class="user-name">张运维</div>
                            <div class="user-role">系统管理员</div>
                        </div>
                        <i class="fa fa-caret-down"></i>
                    </button>
                    <div class="dropdown user-dropdown" id="userDropdown">
                        <div class="dd-item" data-url="pages/system/profile.html"><i class="fa fa-user-circle-o"></i><span>个人中心</span></div>
                        <div class="dd-divider"></div>
                        <div class="dd-item" onclick="alert('退出登录')"><i class="fa fa-sign-out"></i><span>退出系统</span></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- ========== 顶部标签栏（新增） ========== -->
        <div class="tab-bar" id="tabBar">
            <!-- 标签页由 JS 动态生成 -->
        </div>

        <!-- 内容 iframe 容器（多标签共享，每个标签一个 iframe） -->
        <main class="content-area" id="contentArea">
            <!-- iframe 由 JS 动态创建 -->
        </main>
    </div>

</div>

<script src="js/global-data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/nav-helper.js"></script>
<script>
// ===== 全局环境切换器逻辑 =====
(function() {
    var envBtn = document.getElementById('envSwitcherBtn');
    var envDropdown = document.getElementById('envSwitcherDropdown');

    // 切换下拉面板显示
    envBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        envDropdown.classList.toggle('show');
    });

    // 点击外部关闭下拉
    document.addEventListener('click', function() {
        envDropdown.classList.remove('show');
    });
    envDropdown.addEventListener('click', function(e) { e.stopPropagation(); });
})();

// 切换环境函数（全局可调用）
function switchEnvironment(env, envName) {
    // 更新按钮显示
    document.getElementById('envDot').className = 'env-dot env-color-' + env;
    document.getElementById('envLabel').textContent = env;
    document.getElementById('envDesc').textContent = envName;

    // 更新下拉项选中状态
    document.querySelectorAll('.esd-item').forEach(function(item) {
        item.classList.toggle('active', item.dataset.env === env);
    });

    // 关闭下拉
    document.getElementById('envSwitcherDropdown').classList.remove('show');

    // 存储到 localStorage
    localStorage.setItem('currentEnv', env);
    localStorage.setItem('currentEnvName', envName);

    // 通知所有 iframe 子页面
    var iframes = document.querySelectorAll('.content-area iframe');
    iframes.forEach(function(frame) {
        try {
            frame.contentWindow.postMessage({ type: 'envChanged', env: env, envName: envName }, '*');
        } catch(e) {}
    });

    // 同时通知当前活跃 iframe 的 URL 参数更新
    var activeFrame = document.querySelector('.content-area iframe:not(.hidden-frame)');
    if (activeFrame) {
        try {
            var url = new URL(activeFrame.src, window.location.origin);
            url.searchParams.set('env', env);
            // 不立即刷新，仅提示
        } catch(e) {}
    }
}

// 页面加载时恢复环境选择
(function() {
    var savedEnv = localStorage.getItem('currentEnv');
    var savedName = localStorage.getItem('currentEnvName');
    if (savedEnv && savedName && savedEnv !== 'PROD') {
        switchEnvironment(savedEnv, savedName);
    }
})();
</script>
</body>
</html>
