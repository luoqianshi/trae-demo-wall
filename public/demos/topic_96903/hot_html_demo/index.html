<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>热点圈 · HTML Demo</title>
  <link rel="stylesheet" href="styles.css?v=heat11" />
</head>
<body>
  <!-- 手机壳容器，模拟移动端视口 -->
  <div id="app-shell">
    <!-- 顶部状态栏占位 -->
    <div class="status-bar">
      <span class="time" id="clock">09:41</span>
      <span class="indicators">●●● 5G ▮</span>
    </div>

    <!-- 页面容器 -->
    <main id="page-container">
      <!-- 首页 Feed -->
      <section class="page page-feed active" id="page-feed">
        <div class="focus-selector" id="focus-selector">
          <span class="focus-icon">📍</span>
          <span class="focus-name" id="focus-name">当前位置</span>
          <span class="focus-arrow">▾</span>
        </div>
        <!-- 首页范围选择按钮（右上角，复用地图页样式） -->
        <button class="range-tag feed-range-tag" id="feed-range-tag-btn">
          <span class="rt-icon">📡</span>
          <span class="rt-value" id="feed-range-value">10km</span>
        </button>

        <div class="feed-vertical" id="feed-vertical">
          <!-- 由 JS 动态生成 PageView 纵向滑动 -->
        </div>

        <!-- 首页范围选择滑出面板 -->
        <div class="range-sheet" id="feed-range-sheet">
          <div class="range-sheet-mask" id="feed-range-sheet-mask"></div>
          <div class="range-sheet-panel">
            <div class="rs-header">
              <span class="rs-title">发现范围</span>
              <span class="rs-current" id="feed-rs-current">10km</span>
            </div>
            <div class="rs-presets" id="feed-rs-presets">
              <button class="rs-preset" data-km="1">1km</button>
              <button class="rs-preset" data-km="5">5km</button>
              <button class="rs-preset active" data-km="10">10km</button>
              <button class="rs-preset" data-km="20">20km</button>
              <button class="rs-preset" data-km="30">30km</button>
            </div>
            <div class="rs-slider-wrap">
              <input type="range" min="1" max="30" value="10" step="1" class="rs-slider" id="feed-rs-slider" />
              <div class="rs-slider-labels">
                <span>1km</span>
                <span>10km</span>
                <span>30km</span>
              </div>
            </div>
            <button class="rs-confirm" id="feed-rs-confirm">确定</button>
          </div>
        </div>
      </section>

      <!-- 行程 -->
      <section class="page page-trip" id="page-trip">
        <header class="page-header">
          <h1>📋 行程</h1>
          <button class="icon-btn" id="open-calendar" aria-label="选择日期">📅</button>
        </header>
        <div class="trip-body">
          <!-- 日历快捷条：今天 + 未来 3 天 -->
          <div class="calendar-bar" id="calendar-bar"></div>
          <!-- 选中日期标题 -->
          <div class="trip-date-title" id="trip-date-title"></div>
          <!-- 行程列表 -->
          <div class="trip-list" id="trip-list"></div>
          <!-- 浮动可收缩微型地图 -->
          <div class="trip-mini-map" id="trip-mini-map">
            <div class="tmm-header" id="tmm-toggle">
              <span class="tmm-title">🧭 行程路径</span>
              <span class="tmm-toggle-icon">▾</span>
            </div>
            <div class="tmm-body" id="tmm-body">
              <div class="tmm-canvas" id="tmm-canvas"></div>
              <div class="tmm-summary" id="tmm-summary"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 地图 -->
      <section class="page page-map" id="page-map">
        <header class="page-header">
          <h1>附近热点</h1>
          <button class="range-tag" id="range-tag-btn">
            <span class="rt-icon">📡</span>
            <span class="rt-value" id="range-value">10km</span>
          </button>
        </header>
        <div class="map-canvas" id="map-canvas">
          <div class="map-bg-layer" id="map-bg-layer"></div>
          <div class="map-grid"></div>
          <div class="map-center">
            <div class="me-dot"></div>
            <div class="me-label">我的位置</div>
          </div>
          <div class="map-markers" id="map-markers"></div>
        </div>
        <!-- 范围选择滑出面板 -->
        <div class="range-sheet" id="range-sheet">
          <div class="range-sheet-mask" id="range-sheet-mask"></div>
          <div class="range-sheet-panel">
            <div class="rs-header">
              <span class="rs-title">发现范围</span>
              <span class="rs-current" id="rs-current">10km</span>
            </div>
            <div class="rs-presets" id="rs-presets">
              <button class="rs-preset" data-km="1">1km</button>
              <button class="rs-preset" data-km="5">5km</button>
              <button class="rs-preset active" data-km="10">10km</button>
              <button class="rs-preset" data-km="20">20km</button>
              <button class="rs-preset" data-km="30">30km</button>
            </div>
            <div class="rs-slider-wrap">
              <input type="range" min="1" max="30" value="10" step="1" class="rs-slider" id="rs-slider" />
              <div class="rs-slider-labels">
                <span>1km</span>
                <span>10km</span>
                <span>30km</span>
              </div>
            </div>
            <button class="rs-confirm" id="rs-confirm">确定</button>
          </div>
        </div>
        <div class="map-list" id="map-list"></div>
      </section>

      <!-- 我的 -->
      <section class="page page-profile" id="page-profile">
        <header class="page-header">
          <h1>我的</h1>
          <button class="icon-btn" aria-label="设置">⚙</button>
        </header>
        <div class="profile-body" id="profile-body"></div>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="feed">
        <span class="nav-icon">🏠</span><span class="nav-label">首页</span>
      </button>
      <button class="nav-item" data-tab="map">
        <span class="nav-icon">🗺️</span><span class="nav-label">地图</span>
      </button>
      <button class="nav-item nav-center" data-tab="upload">
        <span class="nav-plus">+</span>
      </button>
      <button class="nav-item" data-tab="trip">
        <span class="nav-icon">📋</span><span class="nav-label">行程</span>
        <span class="nav-badge" id="trip-badge" style="display:none;">0</span>
      </button>
      <button class="nav-item" data-tab="profile">
        <span class="nav-icon">👤</span><span class="nav-label">我的</span>
      </button>
    </nav>

    <!-- 行程 Tab 提示气泡 -->
    <div class="trip-tip" id="trip-tip">已加入行程 ✓</div>
  </div>
  <div class="modal-mask" id="upload-modal">
    <div class="upload-sheet">
      <button class="upload-item" data-upload-action="shoot">📷 拍摄视频</button>
      <button class="upload-item" data-upload-action="album">🖼 从相册选择</button>
    </div>
  </div>

  <!-- 发布设置弹层（全屏：上传后的视频 + 热点绑定/滤镜/隐私等设置） -->
  <div class="modal-mask publish-mask" id="publish-modal">
    <div class="publish-sheet" id="publish-sheet"></div>
  </div>

  <!-- 焦点选择弹层 -->
  <div class="modal-mask" id="focus-modal">
    <div class="focus-sheet">
      <h3>选择焦点</h3>
      <div class="focus-options" id="focus-options"></div>
    </div>
  </div>

  <!-- 日历选择弹层 -->
  <div class="modal-mask" id="calendar-modal">
    <div class="calendar-sheet">
      <div class="calendar-sheet-head">
        <button class="cal-nav" id="cal-prev">‹</button>
        <h3 id="cal-title"></h3>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="calendar-week">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
  </div>

  <!-- 足迹详情弹层 -->
  <div class="modal-mask" id="footprint-modal">
    <div class="footprint-sheet">
      <div class="footprint-sheet-head">
        <h3>🐾 我的足迹</h3>
        <button class="icon-btn" id="footprint-close">✕</button>
      </div>
      <div class="footprint-tabs">
        <button class="fp-tab active" data-range="30">近30天</button>
        <button class="fp-tab" data-range="90">近3个月</button>
        <button class="fp-tab" data-range="365">全部</button>
      </div>
      <div class="footprint-modal-list" id="footprint-modal-list"></div>
    </div>
  </div>

  <!-- 内容查看弹层（视频/图文） -->
  <div class="modal-mask" id="content-modal">
    <div class="content-sheet" id="content-sheet"></div>
  </div>

  <!-- 购票弹层（选择票档） -->
  <div class="modal-mask" id="ticket-modal">
    <div class="ticket-sheet" id="ticket-sheet"></div>
  </div>

  <!-- 支付弹层 -->
  <div class="modal-mask" id="pay-modal">
    <div class="pay-sheet" id="pay-sheet"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js?v=heat11"></script>
</body>
</html>
