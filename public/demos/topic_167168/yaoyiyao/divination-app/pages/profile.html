<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Prefix: divination ===== */

  /* --- Color System --- */
  --color-background: #0a0a0f;
  --color-background-elevated: #12121c;
  --color-background-surface: #1a1a28;
  --color-foreground-primary: #e8e4d9;
  --color-foreground-secondary: #9a96a6;
  --color-foreground-muted: #5a5666;
  --color-brand: #00e5a0;
  --color-brand-muted: rgba(0, 229, 160, 0.15);
  --color-brand-strong: #00ffb3;
  --color-accent-gold: #d4a853;
  --color-accent-gold-muted: rgba(212, 168, 83, 0.15);
  --color-accent-red: #ff3366;
  --color-accent-red-muted: rgba(255, 51, 102, 0.12);
  --color-border: rgba(255, 255, 255, 0.06);
  --color-border-strong: rgba(255, 255, 255, 0.12);

  /* State colors */
  --state-success: #00e5a0;
  --state-warning: #d4a853;
  --state-error: #ff3366;
  --state-info: #6ec6ff;

  /* --- Typography --- */
  --font-display: 'Noto Serif SC', 'Songti SC', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;
  --text-4xl: 2.5rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;
  --spacing-4xl: 64px;

  /* --- Radius --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-elevated: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-glow-brand: 0 0 20px rgba(0, 229, 160, 0.2);
  --shadow-glow-gold: 0 0 20px rgba(212, 168, 83, 0.2);

  /* --- Transitions --- */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms ease;
}

/* Typography classes */
.divination-display {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title-lg {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-subtitle {
  font-family: var(--font-body);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-normal);
  color: var(--color-foreground-secondary);
}

.divination-body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 400;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-relaxed);
  color: var(--color-foreground-primary);
}

.divination-caption {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 400;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-foreground-muted);
}

.divination-mono {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-weight: 400;
  letter-spacing: var(--tracking-wide);
  color: var(--color-foreground-secondary);
}

/* I Ching trigram glyph style */
.divination-glyph {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  font-weight: 700;
  line-height: 1;
  color: var(--color-accent-gold);
  text-shadow: 0 0 12px rgba(212, 168, 83, 0.3);
}

/* Cyber neon text glow */
.divination-neon {
  text-shadow:
    0 0 4px rgba(0, 229, 160, 0.6),
    0 0 12px rgba(0, 229, 160, 0.3);
}

.divination-neon-gold {
  text-shadow:
    0 0 4px rgba(212, 168, 83, 0.6),
    0 0 12px rgba(212, 168, 83, 0.3);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground-primary); font-family: var(--font-body); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main data-node-id="page-profile" class="relative min-h-screen pb-24">

      <!-- Background decorative elements -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <svg class="absolute inset-0 w-full h-full opacity-[0.03]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M0 20h15M20 20h20M20 0v15M20 20v20" stroke="var(--color-brand)" stroke-width="0.5" fill="none"/>
              <circle cx="20" cy="20" r="1.5" fill="var(--color-brand)"/>
              <circle cx="0" cy="20" r="1" fill="var(--color-brand)"/>
              <circle cx="40" cy="20" r="1" fill="var(--color-brand)"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#circuit)"/>
        </svg>
        <svg class="absolute top-0 right-0 w-32 h-32 opacity-[0.04]" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 60 Q20 40 35 40 Q35 25 50 30 Q55 15 70 25 Q85 20 85 35 Q95 40 90 55 Q95 65 85 65 L20 65 Q10 65 20 60Z" fill="var(--color-accent-gold)"/>
        </svg>
        <div class="absolute top-[12%] left-[6%] w-1 h-1 rounded-full opacity-20" style="background:var(--color-brand); animation: float-dot 4s ease-in-out infinite;"></div>
        <div class="absolute top-[45%] right-[8%] w-0.5 h-0.5 rounded-full opacity-15" style="background:var(--color-accent-gold); animation: float-dot 5s ease-in-out 1s infinite;"></div>
        <div class="absolute top-[75%] left-[12%] w-0.5 h-0.5 rounded-full opacity-15" style="background:var(--color-accent-gold); animation: float-dot 6s ease-in-out 0.5s infinite;"></div>
      </div>

      <!-- Page content container -->
      <div class="relative z-10 px-4 pt-12">

        <!-- ===== Profile Header Card ===== -->
        <section class="text-center mb-6">
          <!-- Avatar -->
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-full mb-4" style="
            background: var(--color-background-surface);
            border: 2px solid var(--color-brand);
            box-shadow: 0 0 24px rgba(0, 229, 160, 0.2), 0 0 48px rgba(0, 229, 160, 0.08);
          ">
            <span class="divination-display text-2xl" style="color: var(--color-brand);">张</span>
          </div>
          <!-- Username -->
          <h1 class="divination-title-lg divination-neon-gold text-[1.5rem]" style="color: var(--color-accent-gold); text-wrap: balance; word-break: keep-all;">
            张玄机
          </h1>
          <!-- Tagline -->
          <p class="mt-1.5 text-xs tracking-[0.08em]" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">
            探索命运的旅者
          </p>
          <!-- Member since -->
          <p class="mt-2 text-[11px] tracking-[0.1em]" style="color: var(--color-foreground-muted); font-family: var(--font-mono); opacity: 0.7;">
            注册于 2025.03.15
          </p>
        </section>

        <!-- ===== Personal Info Section ===== -->
        <section class="rounded-lg mb-5" style="
          background: rgba(18, 18, 28, 0.6);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid var(--color-border-strong);
        ">
          <!-- Section header -->
          <div class="flex items-center justify-between px-4 py-3" style="border-bottom: 1px solid var(--color-border);">
            <h2 class="divination-title text-sm" style="color: var(--color-foreground-primary);">个人信息</h2>
            <button class="inline-flex items-center justify-center w-7 h-7 rounded-md transition-colors duration-150" style="color: var(--color-foreground-muted);" aria-label="编辑个人信息">
              <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <!-- Info rows -->
          <div class="px-4">
            <!-- 姓名 -->
            <div class="flex items-center justify-between py-3" style="border-bottom: 1px solid var(--color-border);">
              <span class="text-xs tracking-[0.06em] flex-shrink-0" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">姓名</span>
              <span class="text-sm" style="color: var(--color-foreground-primary); font-family: var(--font-body);">张玄机</span>
            </div>
            <!-- 出生日期 -->
            <div class="flex items-center justify-between py-3" style="border-bottom: 1px solid var(--color-border);">
              <span class="text-xs tracking-[0.06em] flex-shrink-0" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">出生日期</span>
              <span class="text-sm text-right" style="color: var(--color-foreground-primary); font-family: var(--font-body);">
                1990年农历三月初八
              </span>
            </div>
            <!-- 祖籍 -->
            <div class="flex items-center justify-between py-3" style="border-bottom: 1px solid var(--color-border);">
              <span class="text-xs tracking-[0.06em] flex-shrink-0" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">祖籍</span>
              <span class="text-sm" style="color: var(--color-foreground-primary); font-family: var(--font-body);">山东济南</span>
            </div>
            <!-- 生活地 -->
            <div class="flex items-center justify-between py-3">
              <span class="text-xs tracking-[0.06em] flex-shrink-0" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">生活地</span>
              <span class="text-sm" style="color: var(--color-foreground-primary); font-family: var(--font-body);">北京朝阳</span>
            </div>
          </div>
        </section>

        <!-- ===== Five Elements Card ===== -->
        <section class="rounded-lg mb-5 overflow-hidden" style="
          background: rgba(18, 18, 28, 0.6);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid var(--color-border-strong);
        ">
          <!-- Section header -->
          <div class="flex items-center justify-between px-4 py-3" style="border-bottom: 1px solid var(--color-border);">
            <h2 class="divination-title text-sm divination-neon-gold" style="color: var(--color-accent-gold);">五行分析</h2>
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] tracking-[0.08em]" style="
              background: var(--color-accent-gold-muted);
              color: var(--color-accent-gold);
              font-family: var(--font-mono);
            ">均衡</span>
          </div>
          <!-- Element bars -->
          <div class="px-4 py-4 flex flex-col gap-3">
            <!-- 金 Metal -->
            <div class="flex items-center gap-3">
              <span class="w-5 text-center text-sm font-semibold flex-shrink-0" style="color: #d4a853; font-family: var(--font-display);">金</span>
              <div class="flex-1 h-2 rounded-full overflow-hidden" style="background: rgba(255,255,255,0.04);">
                <div class="h-full rounded-full transition-all duration-500" style="width: 40%; background: #d4a853; box-shadow: 0 0 8px rgba(212,168,83,0.3);"></div>
              </div>
              <span class="w-4 text-center text-[11px] flex-shrink-0" style="color: var(--color-foreground-secondary); font-family: var(--font-mono);">2</span>
            </div>
            <!-- 木 Wood -->
            <div class="flex items-center gap-3">
              <span class="w-5 text-center text-sm font-semibold flex-shrink-0" style="color: #4ade80; font-family: var(--font-display);">木</span>
              <div class="flex-1 h-2 rounded-full overflow-hidden" style="background: rgba(255,255,255,0.04);">
                <div class="h-full rounded-full transition-all duration-500" style="width: 20%; background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.3);"></div>
              </div>
              <span class="w-4 text-center text-[11px] flex-shrink-0" style="color: var(--color-foreground-secondary); font-family: var(--font-mono);">1</span>
            </div>
            <!-- 水 Water -->
            <div class="flex items-center gap-3">
              <span class="w-5 text-center text-sm font-semibold flex-shrink-0" style="color: #60a5fa; font-family: var(--font-display);">水</span>
              <div class="flex-1 h-2 rounded-full overflow-hidden" style="background: rgba(255,255,255,0.04);">
                <div class="h-full rounded-full transition-all duration-500" style="width: 20%; background: #60a5fa; box-shadow: 0 0 8px rgba(96,165,250,0.3);"></div>
              </div>
              <span class="w-4 text-center text-[11px] flex-shrink-0" style="color: var(--color-foreground-secondary); font-family: var(--font-mono);">1</span>
            </div>
            <!-- 火 Fire -->
            <div class="flex items-center gap-3">
              <span class="w-5 text-center text-sm font-semibold flex-shrink-0" style="color: #f87171; font-family: var(--font-display);">火</span>
              <div class="flex-1 h-2 rounded-full overflow-hidden" style="background: rgba(255,255,255,0.04);">
                <div class="h-full rounded-full transition-all duration-500" style="width: 40%; background: #f87171; box-shadow: 0 0 8px rgba(248,113,113,0.3);"></div>
              </div>
              <span class="w-4 text-center text-[11px] flex-shrink-0" style="color: var(--color-foreground-secondary); font-family: var(--font-mono);">2</span>
            </div>
            <!-- 土 Earth -->
            <div class="flex items-center gap-3">
              <span class="w-5 text-center text-sm font-semibold flex-shrink-0" style="color: #a8856e; font-family: var(--font-display);">土</span>
              <div class="flex-1 h-2 rounded-full overflow-hidden" style="background: rgba(255,255,255,0.04);">
                <div class="h-full rounded-full transition-all duration-500" style="width: 40%; background: #a8856e; box-shadow: 0 0 8px rgba(168,133,110,0.3);"></div>
              </div>
              <span class="w-4 text-center text-[11px] flex-shrink-0" style="color: var(--color-foreground-secondary); font-family: var(--font-mono);">2</span>
            </div>
          </div>
        </section>

        <!-- ===== Eight Characters Card ===== -->
        <section class="rounded-lg mb-5" style="
          background: rgba(18, 18, 28, 0.6);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid var(--color-border-strong);
        ">
          <!-- Section header -->
          <div class="px-4 py-3" style="border-bottom: 1px solid var(--color-border);">
            <h2 class="divination-title text-sm divination-neon-gold" style="color: var(--color-accent-gold);">八字命盘</h2>
          </div>
          <!-- Four pillars grid -->
          <div class="grid grid-cols-4 gap-2 px-4 pt-4">
            <!-- 年柱 -->

              background: rgba(212, 168, 83, 0.06);
              border: 1px solid rgba(212, 168, 83, 0.15);
            ">
              <span class="block text-[10px] tracking-[0.08em] mb-1.5" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">年柱</span>
              <span class="divination-display text-base" style="color: var(--color-accent-gold);">庚午</span>
            </div>
            <!-- 月柱 -->
            <div class="text-center rounded-lg py-3" style="
              background: rgba(212, 168, 83, 0.06);
              border: 1px solid rgba(212, 168, 83, 0.15);
            ">
              <span class="block text-[10px] tracking-[0.08em] mb-1.5" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">月柱</span>
              <span class="divination-display text-base" style="color: var(--color-accent-gold);">丁亥</span>
            </div>
            <!-- 日柱 -->
            <div class="text-center rounded-lg py-3" style="
              background: rgba(212, 168, 83, 0.06);
              border: 1px solid rgba(212, 168, 83, 0.15);
            ">
              <span class="block text-[10px] tracking-[0.08em] mb-1.5" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">日柱</span>
              <span class="divination-display text-base" style="color: var(--color-accent-gold);">壬寅</span>
            </div>
            <!-- 时柱 -->
            <div class="text-center rounded-lg py-3" style="
              background: rgba(212, 168, 83, 0.06);
              border: 1px solid rgba(212, 168, 83, 0.15);
            ">
              <span class="block text-[10px] tracking-[0.08em] mb-1.5" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">时柱</span>
              <span class="divination-display text-base" style="color: var(--color-accent-gold);">丙午</span>
            </div>
          </div>
          <!-- Day Master tag -->
          <div class="px-4 pt-4 pb-2">
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg" style="
              background: var(--color-accent-gold-muted);
              border: 1px solid rgba(212, 168, 83, 0.2);
            ">
              <span class="text-[11px] tracking-[0.06em]" style="color: var(--color-foreground-secondary); font-family: var(--font-mono);">日主</span>
              <span class="divination-display text-sm" style="color: var(--color-accent-gold);">壬水</span>
            </div>
          </div>
          <!-- Brief note -->
          <p class="px-4 pb-4 text-xs leading-relaxed" style="color: var(--color-foreground-secondary); font-family: var(--font-body);">
            壬水生于亥月，水旺之地
          </p>
        </section>

        <!-- ===== Statistics Row ===== -->
        <section class="rounded-lg mb-4" style="
          background: rgba(18, 18, 28, 0.6);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid var(--color-border-strong);
        ">
          <div class="flex items-center">
            <div class="flex-1 flex items-center justify-center gap-2 py-3" style="border-right: 1px solid var(--color-border);">
              <span class="text-xs tracking-[0.06em]" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">已算</span>
              <span class="text-sm font-semibold" style="color: var(--color-brand); font-family: var(--font-body);">128</span>
              <span class="text-xs tracking-[0.06em]" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">卦</span>
            </div>
            <div class="flex-1 flex items-center justify-center gap-2 py-3">
              <span class="text-xs tracking-[0.06em]" style="color: var(--color-foreground-muted); font-family: var(--font-mono);">最常得卦</span>
              <span class="divination-display text-sm" style="color: var(--color-accent-gold);">謙</span>
            </div>
          </div>
        </section>

      </div>

      <!-- ===== Bottom Tab Bar ===== -->
      <nav class="fixed bottom-0 left-0 right-0 z-50" style="
        background: rgba(10, 10, 15, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid var(--color-border);
        padding-bottom: env(safe-area-inset-bottom, 0);
      ">
        <div class="flex items-center justify-around max-w-md mx-auto" style="height: 56px;">
          <!-- 首页 -->
          <button data-dom-id="tab-home" data-target-page="page-shake" class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full transition-colors duration-150" style="color: var(--color-foreground-muted);" aria-label="首页">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] tracking-[0.04em]" style="font-family: var(--font-body);">首页</span>
          </button>
          <!-- 分享 -->
          <button data-dom-id="tab-share" data-target-page="page-share" class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full transition-colors duration-150" style="color: var(--color-foreground-muted);" aria-label="分享">
            <i data-lucide="share-2" class="w-5 h-5"></i>
            <span class="text-[10px] tracking-[0.04em]" style="font-family: var(--font-body);">分享</span>
          </button>
          <!-- 我 (active) -->
          <button data-dom-id="tab-profile" class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full transition-colors duration-150" style="color: var(--color-brand); text-shadow: 0 0 8px rgba(0, 229, 160, 0.4);" aria-label="我" aria-current="page">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[10px] tracking-[0.04em] font-semibold" style="font-family: var(--font-body);">我</span>
          </button>
