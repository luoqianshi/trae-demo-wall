<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卦象广场</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Prefix: divination ===== */

  /* --- Color System --- */
  /* Cyberpunk x Chinese: deep obsidian + electric jade + gold imperial */
  --color-background: #0a0a0f;
  --color-background-elevated: #12121c;
  --color-background-surface: #1a1a28;
  --color-foreground-primary: #e8e4d9;
  --color-foreground-secondary: #9a96a6;
  --color-foreground-muted: #5a5666;
  --color-brand: #00e5a0;
  --color-brand-muted: rgba(0, 229, 160, 0.15);
  --color-brand-strong: #00ffb3;
  --color-accent-gold: #d4a853;
  --color-accent-gold-muted: rgba(212, 168, 83, 0.15);
  --color-accent-red: #ff3366;
  --color-accent-red-muted: rgba(255, 51, 102, 0.12);
  --color-border: rgba(255, 255, 255, 0.06);
  --color-border-strong: rgba(255, 255, 255, 0.12);

  /* State colors */
  --state-success: #00e5a0;
  --state-warning: #d4a853;
  --state-error: #ff3366;
  --state-info: #6ec6ff;

  /* --- Typography --- */
  --font-display: 'Noto Serif SC', 'Songti SC', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;
  --text-4xl: 2.5rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;
  --spacing-4xl: 64px;

  /* --- Radius --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-elevated: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-glow-brand: 0 0 20px rgba(0, 229, 160, 0.2);
  --shadow-glow-gold: 0 0 20px rgba(212, 168, 83, 0.2);

  /* --- Transitions --- */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms ease;
}

/* Typography classes */
.divination-display {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title-lg {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-subtitle {
  font-family: var(--font-body);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-normal);
  color: var(--color-foreground-secondary);
}

.divination-body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 400;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-relaxed);
  color: var(--color-foreground-primary);
}

.divination-caption {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 400;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-foreground-muted);
}

.divination-mono {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-weight: 400;
  letter-spacing: var(--tracking-wide);
  color: var(--color-foreground-secondary);
}

/* I Ching trigram glyph style */
.divination-glyph {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  font-weight: 700;
  line-height: 1;
  color: var(--color-accent-gold);
  text-shadow: 0 0 12px rgba(212, 168, 83, 0.3);
}

/* Cyber neon text glow */
.divination-neon {
  text-shadow:
    0 0 4px rgba(0, 229, 160, 0.6),
    0 0 12px rgba(0, 229, 160, 0.3);
}

.divination-neon-gold {
  text-shadow:
    0 0 4px rgba(212, 168, 83, 0.6),
    0 0 12px rgba(212, 168, 83, 0.3);
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground-primary); font-family: var(--font-body); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style>
      /* === Page-scoped custom styles === */

      /* Glass card base */
      .glass-card {
        background: rgba(18, 18, 28, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-lg);
        transition: border-color 160ms cubic-bezier(.2,.8,.2,1), box-shadow 160ms cubic-bezier(.2,.8,.2,1);
      }

      .glass-card:hover {
        border-color: rgba(0, 229, 160, 0.25);
        box-shadow: 0 0 16px rgba(0, 229, 160, 0.06);
      }

      /* Jade border accent card */
      .glass-card-jade {
        background: rgba(18, 18, 28, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 229, 160, 0.25);
        border-radius: var(--radius-lg);
        box-shadow: 0 0 24px rgba(0, 229, 160, 0.08);
      }

      /* Decorative top bar pattern */
      .deco-bar {
        width: 100%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(212, 168, 83, 0.15) 20%,
          rgba(212, 168, 83, 0.25) 50%,
          rgba(212, 168, 83, 0.15) 80%,
          transparent 100%
        );
      }

      /* Small neon outline button */
      .btn-neon-jade-sm {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 16px;
        border: 1px solid var(--color-brand);
        border-radius: var(--radius-md);
        background: rgba(0, 229, 160, 0.08);
        color: var(--color-brand);
        font-family: var(--font-body);
        font-size: var(--text-sm);
        font-weight: 600;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: background 160ms cubic-bezier(.2,.8,.2,1), box-shadow 160ms cubic-bezier(.2,.8,.2,1);
        box-shadow: 0 0 8px rgba(0, 229, 160, 0.1);
        text-decoration: none;
        white-space: nowrap;
      }

      .btn-neon-jade-sm:hover {
        background: rgba(0, 229, 160, 0.15);
        box-shadow: 0 0 16px rgba(0, 229, 160, 0.18);
      }

      .btn-neon-jade-sm:active {
        background: rgba(0, 229, 160, 0.10);
      }

      .btn-neon-jade-sm:focus-visible {
        outline: 2px solid var(--color-brand);
        outline-offset: 2px;
      }

      /* Tab bar glass */
      .tab-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background: rgba(10, 10, 15, 0.82);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid var(--color-border-strong);
      }

      .tab-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 0 12px;
        flex: 1;
        text-decoration: none;
        cursor: pointer;
        transition: color 160ms cubic-bezier(.2,.8,.2,1);
      }

      .tab-item.active {
        color: var(--color-brand);
      }

      .tab-item.active .tab-icon {
        filter: drop-shadow(0 0 4px rgba(0, 229, 160, 0.4));
      }

      .tab-item:not(.active) {
        color: var(--color-foreground-muted);
      }

      .tab-item:not(.active):hover {
        color: var(--color-foreground-secondary);
      }

      .tab-icon {
        width: 20px;
        height: 20px;
      }

      .tab-label {
        font-family: var(--font-body);
        font-size: 10px;
        letter-spacing: 0.02em;
      }

      /* Avatar circle */
      .avatar-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: var(--text-sm);
        font-weight: 700;
        flex-shrink: 0;
        color: var(--color-brand);
        background: var(--color-brand-muted);
        border: 1px solid rgba(0, 229, 160, 0.2);
      }

      /* Post interaction */
      .post-action {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--color-foreground-muted);
        cursor: pointer;
        transition: color 160ms cubic-bezier(.2,.8,.2,1);
        padding: 2px 0;
      }

      .post-action:hover {
        color: var(--color-foreground-secondary);
      }

      /* Entrance animation */
      .reveal-up {
        opacity: 0;
        transform: translateY(16px);
        animation: revealUp 480ms cubic-bezier(.32,.72,0,1) forwards;
      }

      @keyframes revealUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .delay-1 { animation-delay: 80ms; }
      .delay-2 { animation-delay: 160ms; }
      .delay-3 { animation-delay: 240ms; }
      .delay-4 { animation-delay: 320ms; }
      .delay-5 { animation-delay: 400ms; }
      .delay-6 { animation-delay: 480ms; }

      @keyframes float-dot {
        0%, 100% { transform: translateY(0px); opacity: 0.15; }
        50% { transform: translateY(-8px); opacity: 0.25; }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .reveal-up {
          animation-duration: 0.01ms;
        }
        .btn-neon-jade-sm,
        .glass-card,
        .tab-item {
          transition-duration: 0.01ms;
        }
      }

      /* Touch device: disable hover transitions */
      @media (hover: none) {
        .btn-neon-jade-sm,
        .glass-card,
        .tab-item {
          transition: none;
        }
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-background); color: var(--color-foreground-primary);">
    <main id="page-share" style="max-width: 375px; margin: 0 auto; padding: 0 16px; padding-bottom: 72px;">

      <!-- Background decorative elements -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden" style="position:fixed; z-index:0;" aria-hidden="true">
        <!-- Faint circuit board pattern -->
        <svg class="absolute inset-0 w-full h-full opacity-[0.03]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="circuit-share" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M0 20h15M20 20h20M20 0v15M20 20v20" stroke="var(--color-brand)" stroke-width="0.5" fill="none"/>
              <circle cx="20" cy="20" r="1.5" fill="var(--color-brand)"/>
              <circle cx="0" cy="20" r="1" fill="var(--color-brand)"/>
              <circle cx="40" cy="20" r="1" fill="var(--color-brand)"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#circuit-share)"/>
        </svg>
        <!-- Floating dots -->
        <div class="absolute top-[12%] left-[8%] w-1 h-1 rounded-full opacity-20" style="background:var(--color-brand); animation: float-dot 4s ease-in-out infinite;"></div>
        <div class="absolute top-[30%] right-[10%] w-0.5 h-0.5 rounded-full opacity-15" style="background:var(--color-accent-gold); animation: float-dot 5s ease-in-out 1s infinite;"></div>
        <div class="absolute top-[55%] left-[6%] w-0.5 h-0.5 rounded-full opacity-15" style="background:var(--color-accent-gold); animation: float-dot 6s ease-in-out 0.5s infinite;"></div>
        <div class="absolute top-[75%] right-[12%] w-1 h-1 rounded-full opacity-20" style="background:var(--color-brand); animation: float-dot 4.5s ease-in-out 2s infinite;"></div>
      </div>

      <!-- Decorative top bar -->
      <div class="deco-bar" style="margin-bottom: 16px;"></div>

      <!-- === PAGE HEADER === -->
      <header class="reveal-up" style="position:relative; z-index:10; text-align:center; padding: 16px 0 4px;">
        <h1 class="divination-display divination-neon" style="font-size: var(--text-2xl); margin: 0; text-wrap: balance; word-break: keep-all; color: var(--color-brand);">
          卦象广场
        </h1>
        <p class="divination-mono" style="margin-top: 6px; font-size: var(--text-xs); color: var(--color-foreground-muted); letter-spacing: 0.08em;">
          分享你的卦象，解读命运
        </p>
        <!-- Decorative separator -->
        <div class="flex items-center justify-center gap-3 mt-4">
          <div class="h-px w-10" style="background:linear-gradient(to right, transparent, var(--color-brand)); opacity:0.4;"></div>
          <svg class="w-4 h-4 opacity-40" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 1 Q12 4 12 8 Q12 12 8 15 Q4 12 4 8 Q4 4 8 1Z" stroke="var(--color-accent-gold)" stroke-width="0.8" fill="none"/>
            <circle cx="8" cy="8" r="2" stroke="var(--color-brand)" stroke-width="0.6" fill="none"/>
          </svg>
          <div class="h-px w-10" style="background:linear-gradient(to left, transparent, var(--color-brand)); opacity:0.4;"></div>
        </div>
      </header>

      <!-- === SHARE MY HEXAGRAM CARD === -->
      <section class="reveal-up delay-1 glass-card-jade" style="position:relative; z-index:10; padding: 16px; margin-top: 20px; margin-bottom: 24px;" aria-label="发布卦象">
        <div style="display: flex; align-items: center; gap: 12px;">
          <!-- Mini hexagram glyph -->
          <div style="width: 44px; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--color-accent-gold-muted); border: 1px solid rgba(212, 168, 83, 0.2);">
            <span class="divination-glyph" style="font-size: 1.25rem;">謙</span>
          </div>
          <div style="flex: 1; min-width: 0;">
            <div style="display: flex; align-items: baseline; gap: 8px;">
              <span style="font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; color: var(--color-accent-gold); white-space: nowrap;">謙 #15</span>
            </div>
            <p style="font-family: var(--font-body); font-size: var(--text-sm); color: var(--color-foreground-secondary); margin: 2px 0 0;">
              今日卦象：地山謙
            </p>
          </div>
          <button class="btn-neon-jade-sm" aria-label="发布到广场">
            发布到广场
          </button>
        </div>
      </section>

      <!-- === COMMUNITY FEED === -->
      <section style="position:relative; z-index:10; display: flex; flex-direction: column; gap: 16px;" aria-label="社区动态">

        <!-- Post 1: 玄机道人 - 乾 -->
        <article class="reveal-up delay-2 glass-card" style="padding: 16px;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
            <div class="avatar-circle">玄</div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600; color: var(--color-foreground-primary);">玄机道人</div>
              <div style="font-family: var(--font-mono); font-size: 10px; color: var(--color-foreground-muted); letter-spacing: 0.06em;">3 小时前</div>
            </div>
            <!-- Hexagram badge -->
            <div style="padding: 2px 8px; border-radius: var(--radius-sm); background: var(--color-accent-gold-muted); border: 1px solid rgba(212, 168, 83, 0.15); flex-shrink: 0;">
              <span style="font-family: var(--font-display); font-size: var(--text-xs); font-weight: 600; color: var(--color-accent-gold);">#1 乾</span>
            </div>
          </div>
          <!-- Hexagram name -->
          <div style="margin-bottom: 8px;">
            <span style="font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; color: var(--color-accent-gold);">乾为天</span>
          </div>
          <!-- Comment -->
          <p class="divination-body" style="font-size: var(--text-sm); margin-bottom: 12px; line-height: 1.6;">
            今日大吉，天行健，君子以自强不息！
          </p>
          <!-- Actions -->
          <div style="display: flex; align-items: center; gap: 16px;">
            <span class="post-action" aria-label="点赞">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
              42
            </span>
            <span class="post-action" aria-label="评论">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
              8
            </span>
          </div>
        </article>

        <!-- Post 2: 风水小王子 - 坤 -->
        <article class="reveal-up delay-3 glass-card" style="padding: 16px;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
            <div class="avatar-circle">风</div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600; color: var(--color-foreground-primary);">风水小王子</div>
              <div style="font-family: var(--font-mono); font-size: 10px; color: var(--color-foreground-muted); letter-spacing: 0.06em;">5 小时前</div>
            </div>
            <div style="padding: 2px 8px; border-radius: var(--radius-sm); background: var(--color-accent-gold-muted); border: 1px solid rgba(212, 168, 83, 0.15); flex-shrink: 0;">
              <span style="font-family: var(--font-display); font-size: var(--text-xs); font-weight: 600; color: var(--color-accent-gold);">#2 坤</span>
            </div>
          </div>
          <div style="margin-bottom: 8px;">
            <span style="font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; color: var(--color-accent-gold);">坤为地</span>
          </div>
          <p class="divination-body" style="font-size: var(--text-sm); margin-bottom: 12px; line-height: 1.6;">
            坤卦厚德载物，适合静待时机
          </p>
          <div style="display: flex; align-items: center; gap: 16px;">
            <span class="post-action" aria-label="点赞">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
              28
            </span>
            <span class="post-action" aria-label="评论">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
              5
            </span>
          </div>
        </article>

        <!-- Post 3: 赛博算命师 - 屯 -->
        <article class="reveal-up delay-4 glass-card" style="padding: 16px;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
            <div class="avatar-circle">赛</div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600; color: var(--color-foreground-primary);">赛博算命师</div>
              <div style="font-family: var(--font-mono); font-size: 10px; color: var(--color-foreground-muted); letter-spacing: 0.06em;">8 小时前</div>
            </div>
            <div style="padding: 2px 8px; border-radius: var(--radius-sm); background: var(--color-accent-gold-muted); border: 1px solid rgba(212, 168, 83, 0.15); flex-shrink: 0;">
              <span style="font-family: var(--font-display); font-size: var(--text-xs); font-weight: 600; color: var(--color-accent-gold);">#3 屯</span>
            </div>
