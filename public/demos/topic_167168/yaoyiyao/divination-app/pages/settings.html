<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Prefix: divination ===== */

  /* --- Color System --- */
  /* Cyberpunk x Chinese: deep obsidian + electric jade + gold imperial */
  --color-background: #0a0a0f;
  --color-background-elevated: #12121c;
  --color-background-surface: #1a1a28;
  --color-foreground-primary: #e8e4d9;
  --color-foreground-secondary: #9a96a6;
  --color-foreground-muted: #5a5666;
  --color-brand: #00e5a0;
  --color-brand-muted: rgba(0, 229, 160, 0.15);
  --color-brand-strong: #00ffb3;
  --color-accent-gold: #d4a853;
  --color-accent-gold-muted: rgba(212, 168, 83, 0.15);
  --color-accent-red: #ff3366;
  --color-accent-red-muted: rgba(255, 51, 102, 0.12);
  --color-border: rgba(255, 255, 255, 0.06);
  --color-border-strong: rgba(255, 255, 255, 0.12);

  /* State colors */
  --state-success: #00e5a0;
  --state-warning: #d4a853;
  --state-error: #ff3366;
  --state-info: #6ec6ff;

  /* --- Typography --- */
  --font-display: 'Noto Serif SC', 'Songti SC', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;
  --text-4xl: 2.5rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;
  --spacing-4xl: 64px;

  /* --- Radius --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-elevated: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-glow-brand: 0 0 20px rgba(0, 229, 160, 0.2);
  --shadow-glow-gold: 0 0 20px rgba(212, 168, 83, 0.2);

  /* --- Transitions --- */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms ease;
}

/* Typography classes */
.divination-display {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title-lg {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-subtitle {
  font-family: var(--font-body);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-normal);
  color: var(--color-foreground-secondary);
}

.divination-body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 400;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-relaxed);
  color: var(--color-foreground-primary);
}

.divination-caption {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 400;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-foreground-muted);
}

.divination-mono {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-weight: 400;
  letter-spacing: var(--tracking-wide);
  color: var(--color-foreground-secondary);
}

.divination-neon {
  text-shadow:
    0 0 4px rgba(0, 229, 160, 0.6),
    0 0 12px rgba(0, 229, 160, 0.3);
}

.divination-neon-gold {
  text-shadow:
    0 0 4px rgba(212, 168, 83, 0.6),
    0 0 12px rgba(212, 168, 83, 0.3);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground-primary); font-family: var(--font-body); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background:var(--color-background); color:var(--color-foreground-primary);">

    <main class="relative min-h-screen flex flex-col pb-[72px] overflow-hidden">

      <!-- Background decorative elements -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <svg class="absolute inset-0 w-full h-full opacity-[0.03]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M0 20h15M20 20h20M20 0v15M20 20v20" stroke="var(--color-brand)" stroke-width="0.5" fill="none"/>
              <circle cx="20" cy="20" r="1.5" fill="var(--color-brand)"/>
              <circle cx="0" cy="20" r="1" fill="var(--color-brand)"/>
              <circle cx="40" cy="20" r="1" fill="var(--color-brand)"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#circuit)"/>
        </svg>
        <svg class="absolute top-0 left-0 w-32 h-32 opacity-[0.04]" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 60 Q20 40 35 40 Q35 25 50 30 Q55 15 70 25 Q85 20 85 35 Q95 40 90 55 Q95 65 85 65 L20 65 Q10 65 20 60Z" fill="var(--color-accent-gold)"/>
        </svg>
        <div class="absolute top-[15%] left-[10%] w-1 h-1 rounded-full opacity-20" style="background:var(--color-brand); animation: float-dot 4s ease-in-out infinite;"></div>
        <div class="absolute top-[45%] right-[12%] w-0.5 h-0.5 rounded-full opacity-15" style="background:var(--color-accent-gold); animation: float-dot 5s ease-in-out 1s infinite;"></div>
      </div>

      <!-- Page Header -->
      <header class="relative z-10 pt-12 pb-2 text-center flex-shrink-0">
        <h1 class="divination-display divination-neon-gold text-[1.75rem] leading-[1.25] tracking-[0.05em] whitespace-nowrap" style="color:var(--color-accent-gold); text-wrap:balance; word-break:keep-all;">
          设置
        </h1>
        <p class="mt-2 text-xs tracking-[0.08em]" style="color:var(--color-foreground-muted); font-family:var(--font-mono);">
          系统与账户
        </p>
        <div class="flex items-center justify-center gap-3 mt-4">
          <div class="h-px w-10" style="background:linear-gradient(to right, transparent, var(--color-accent-gold)); opacity:0.4;"></div>
          <svg class="w-4 h-4 opacity-40" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 1 Q12 4 12 8 Q12 12 8 15 Q4 12 4 8 Q4 4 8 1Z" stroke="var(--color-accent-gold)" stroke-width="0.8" fill="none"/>
            <circle cx="8" cy="8" r="2" stroke="var(--color-brand)" stroke-width="0.6" fill="none"/>
          </svg>
          <div class="h-px w-10" style="background:linear-gradient(to left, transparent, var(--color-accent-gold)); opacity:0.4;"></div>
        </div>
      </header>

      <!-- Scrollable content area -->
      <div class="relative z-10 flex-1 mt-6 px-4 flex flex-col gap-5">

        <!-- Account Info Section -->
        <section class="rounded-lg" style="background:var(--color-background-elevated); border:1px solid var(--color-border-strong); backdrop-filter:blur(8px);">
          <div class="px-4 pt-4 pb-2">
            <h2 class="divination-caption text-[11px] tracking-[0.12em]" style="color:var(--color-accent-gold);">账户信息</h2>
          </div>

          <!-- Phone -->
          <button class="w-full flex items-center justify-between px-4 py-3 transition-colors duration-150" style="min-height:48px;" onmouseenter="this.style.background='var(--color-background-surface)'" onmouseleave="this.style.background='transparent'">
            <div class="flex items-center gap-3">
              <i data-lucide="smartphone" style="width:16px; height:16px; color:var(--color-foreground-muted);"></i>
              <span class="divination-mono text-xs" style="color:var(--color-foreground-secondary);">手机号</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm" style="color:var(--color-foreground-primary);">138****5678</span>
              <i data-lucide="chevron-right" style="width:16px; height:16px; color:var(--color-foreground-muted);"></i>
            </div>
          </button>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Email -->
          <button class="w-full flex items-center justify-between px-4 py-3 transition-colors duration-150" style="min-height:48px;" onmouseenter="this.style.background='var(--color-background-surface)'" onmouseleave="this.style.background='transparent'">
            <div class="flex items-center gap-3">
              <i data-lucide="mail" style="width:16px; height:16px; color:var(--color-foreground-muted);"></i>
              <span class="divination-mono text-xs" style="color:var(--color-foreground-secondary);">邮箱</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm" style="color:var(--color-foreground-primary);">zhang***@email.com</span>
              <i data-lucide="chevron-right" style="width:16px; height:16px; color:var(--color-foreground-muted);"></i>
            </div>
          </button>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Username -->
          <button class="w-full flex items-center justify-between px-4 py-3 transition-colors duration-150" style="min-height:48px;" onmouseenter="this.style.background='var(--color-background-surface)'" onmouseleave="this.style.background='transparent'">
            <div class="flex items-center gap-3">
              <i data-lucide="user" style="width:16px; height:16px; color:var(--color-foreground-muted);"></i>
              <span class="divination-mono text-xs" style="color:var(--color-foreground-secondary);">用户名</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm" style="color:var(--color-foreground-primary);">张玄机</span>
              <i data-lucide="chevron-right" style="width:16px; height:16px; color:var(--color-foreground-muted);"></i>
            </div>
          </button>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Change Password -->
          <button class="w-full flex items-center justify-between px-4 py-3 transition-colors duration-150" style="min-height:48px;" onmouseenter="this.style.background='var(--color-background-surface)'" onmouseleave="this.style.background='transparent'">
            <div class="flex items-center gap-3">
              <i data-lucide="key" style="width:16px; height:16px; color:var(--color-brand);"></i>
              <span class="text-sm" style="color:var(--color-brand);">修改密码</span>
            </div>
            <i data-lucide="chevron-right" style="width:16px; height:16px; color:var(--color-brand); opacity:0.5;"></i>
          </button>
        </section>

        <!-- Notification Settings Section -->
        <section class="rounded-lg" style="background:var(--color-background-elevated); border:1px solid var(--color-border-strong); backdrop-filter:blur(8px);">
          <div class="px-4 pt-4 pb-2">
            <h2 class="divination-caption text-[11px] tracking-[0.12em]" style="color:var(--color-accent-gold);">通知设置</h2>
          </div>

          <!-- Push Notifications: ON -->
          <div class="flex items-center justify-between px-4 py-3" style="min-height:48px;">
            <span class="text-sm" style="color:var(--color-foreground-primary);">推送通知</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" checked>
              <div class="w-10 h-[22px] rounded-full peer transition-colors duration-200"
                   style="background:var(--color-background-surface); border:1px solid var(--color-border-strong);"
                   ></div>
              <div class="absolute left-[3px] top-[3px] w-4 h-4 rounded-full transition-all duration-200"
                   style="background:var(--color-foreground-muted);"
                   ></div>
            </label>
          </div>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Divination Reminder: OFF -->
          <div class="flex items-center justify-between px-4 py-3" style="min-height:48px;">
            <span class="text-sm" style="color:var(--color-foreground-primary);">卦象提醒</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer">
              <div class="w-10 h-[22px] rounded-full peer transition-colors duration-200"
                   style="background:var(--color-background-surface); border:1px solid var(--color-border-strong);"
                   ></div>
              <div class="absolute left-[3px] top-[3px] w-4 h-4 rounded-full transition-all duration-200"
                   style="background:var(--color-foreground-muted);"
                   ></div>
            </label>
          </div>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Community Messages: ON -->
          <div class="flex items-center justify-between px-4 py-3" style="min-height:48px;">
            <span class="text-sm" style="color:var(--color-foreground-primary);">社区消息</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" checked>
              <div class="w-10 h-[22px] rounded-full peer transition-colors duration-200"
                   style="background:var(--color-background-surface); border:1px solid var(--color-border-strong);"
                   ></div>
              <div class="absolute left-[3px] top-[3px] w-4 h-4 rounded-full transition-all duration-200"
                   style="background:var(--color-foreground-muted);"
                   ></div>
            </label>
          </div>
        </section>

        <!-- Display Settings Section -->
        <section class="rounded-lg" style="background:var(--color-background-elevated); border:1px solid var(--color-border-strong); backdrop-filter:blur(8px);">
          <div class="px-4 pt-4 pb-2">
            <h2 class="divination-caption text-[11px] tracking-[0.12em]" style="color:var(--color-accent-gold);">显示设置</h2>
          </div>

          <!-- Dark Mode: ON (locked) -->
          <div class="flex items-center justify-between px-4 py-3" style="min-height:48px;">
            <div class="flex items-center gap-2">
              <span class="text-sm" style="color:var(--color-foreground-primary);">深色模式</span>
              <i data-lucide="lock" style="width:12px; height:12px; color:var(--color-foreground-muted);"></i>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" checked disabled>
              <div class="w-10 h-[22px] rounded-full peer transition-colors duration-200"
                   style="background:var(--color-background-surface); border:1px solid var(--color-border-strong);"
                   ></div>
              <div class="absolute left-[3px] top-[3px] w-4 h-4 rounded-full transition-all duration-200"
                   style="background:var(--color-foreground-muted);"
                   ></div>
            </label>
          </div>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Animation Effects: ON -->
          <div class="flex items-center justify-between px-4 py-3" style="min-height:48px;">
            <span class="text-sm" style="color:var(--color-foreground-primary);">动画效果</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" checked>
              <div class="w-10 h-[22px] rounded-full peer transition-colors duration-200"
                   style="background:var(--color-background-surface); border:1px solid var(--color-border-strong);"
                   ></div>
              <div class="absolute left-[3px] top-[3px] w-4 h-4 rounded-full transition-all duration-200"
                   style="background:var(--color-foreground-muted);"
                   ></div>
            </label>
          </div>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Haptic Feedback: ON -->
          <div class="flex items-center justify-between px-4 py-3" style="min-height:48px;">
            <span class="text-sm" style="color:var(--color-foreground-primary);">震动反馈</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" checked>
              <div class="w-10 h-[22px] rounded-full peer transition-colors duration-200"
                   style="background:var(--color-background-surface); border:1px solid var(--color-border-strong);"
                   ></div>
              <div class="absolute left-[3px] top-[3px] w-4 h-4 rounded-full transition-all duration-200"
                   style="background:var(--color-foreground-muted);"
                   ></div>
            </label>
          </div>
        </section>

        <!-- About Section -->
        <section class="rounded-lg" style="background:var(--color-background-elevated); border:1px solid var(--color-border-strong); backdrop-filter:blur(8px);">
          <div class="px-4 pt-4 pb-2">
            <h2 class="divination-caption text-[11px] tracking-[0.12em]" style="color:var(--color-accent-gold);">关于</h2>
          </div>

          <!-- Version -->
          <div class="flex items-center justify-between px-4 py-3" style="min-height:48px;">
            <span class="divination-mono text-xs" style="color:var(--color-foreground-secondary);">软件版本</span>
            <span class="divination-mono text-xs" style="color:var(--color-foreground-muted);">v1.0.0</span>
          </div>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Developer -->
          <div class="flex items-center justify-between px-4 py-3" style="min-height:48px;">
            <span class="divination-mono text-xs" style="color:var(--color-foreground-secondary);">开发者</span>
            <span class="text-sm" style="color:var(--color-foreground-primary);">玄机科技</span>
          </div>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Check for Updates -->
          <button class="w-full flex items-center justify-between px-4 py-3 transition-colors duration-150" style="min-height:48px;" onmouseenter="this.style.background='var(--color-background-surface)'" onmouseleave="this.style.background='transparent'">
            <div class="flex items-center gap-3">
              <i data-lucide="refresh-cw" style="width:16px; height:16px; color:var(--color-brand);"></i>
              <span class="text-sm" style="color:var(--color-brand);">检查更新</span>
            </div>
            <i data-lucide="chevron-right" style="width:16px; height:16px; color:var(--color-brand); opacity:0.5;"></i>
          </button>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- User Agreement -->
          <button class="w-full flex items-center justify-between px-4 py-3 transition-colors duration-150" style="min-height:48px;" onmouseenter="this.style.background='var(--color-background-surface)'" onmouseleave="this.style.background='transparent'">
            <span class="text-sm" style="color:var(--color-foreground-primary);">用户协议</span>
            <i data-lucide="chevron-right" style="width:16px; height:16px; color:var(--color-foreground-muted);"></i>
          </button>

          <div class="mx-4 h-px" style="background:var(--color-border);"></div>

          <!-- Privacy Policy -->
          <button class="w-full flex items-center justify-between px-4 py-3 transition-colors duration-150" style="min-height:48px;" onmouseenter="this.style.background='var(--color-background-surface)'" onmouseleave="this.style.background='transparent'">
            <span class="text-sm" style="color:var(--color-foreground-primary);">隐私政策</span>
            <i data-lucide="chevron-right" style="width:16px; height:16px; color:var(--color-foreground-muted);"></i>
          </button>
        </section>

        <!-- Danger Zone -->
        <section class="rounded-lg" style="background:var(--color-accent-red-muted); border:1px solid rgba(255, 51, 102, 0.2); backdrop-filter:blur(8px);">
          <div class="px-4 pt-4 pb-2">
            <h2 class="divination-caption text-[11px] tracking-[0.12em]" style="color:var(--color-accent-red);">危险区域</h2>
          </div>

          <!-- Deactivate Account -->
          <button class="w-full flex items-center justify-between px-4 py-3 transition-colors duration-150" style="min-height:48px;" onmouseenter="this.style.background='rgba(255,51,102,0.06)'" onmouseleave="this.style.background='transparent'">
            <div class="flex items-center gap-3">
              <i data-lucide="alert-triangle" style="width:16px; height:16px; color:var(--color-accent-red);"></i>
              <span class="text-sm" style="color:var(--color-accent-red);">注销账户</span>
            </div>
            <i data-lucide="chevron-right" style="width:16px; height:16px; color:var(--color-accent-red); opacity:0.5;"></i>
          </button>

          <div class="mx-4 h-px" style="background:rgba(255,51,102,0.15);"></div>

          <!-- Logout -->
          <div class="px-4 py-4">
            <button
              id="btn-logout"
              data-dom-id="btn-logout"
              class="w-full flex items-center justify-center rounded-lg py-3 text-sm font-semibold tracking-[0.06em] transition-all duration-200"
              style="
                border: 1px solid var(--color-brand);
                color: var(--color-brand);
                background: transparent;
                min-height: 44px;
                font-family: var(--font-body);
              "
              onmouseenter="this.style.background='var(--color-brand-muted)'; this.style.boxShadow='0 0 16px rgba(0,229,160,0.2)'"
              onmouseleave="this.style.background='transparent'; this.style.boxShadow='none'"
            >
              退出登录
            </button>
