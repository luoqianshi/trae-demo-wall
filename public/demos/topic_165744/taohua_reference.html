<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃花参考</title>
<style>
  body {
    background: #faf9f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Noto Serif SC', serif;
    color: #141413;
  }
  h1 { font-size: 1.5rem; font-weight: 400; color: #b0aea5; margin-bottom: 2rem; }
  .row { display: flex; gap: 4rem; flex-wrap: wrap; justify-content: center; align-items: center; }
  .item { text-align: center; }
  .item svg { display: block; margin-bottom: 0.5rem; }
  .label { font-size: 0.85rem; color: #b0aea5; }
  .note { margin-top: 2rem; color: #b0aea5; font-size: 0.85rem; max-width: 500px; text-align: center; line-height: 1.6; }
  code { background: #f2f0ea; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.8rem; }
</style>
</head>
<body>
  <h1>桃花形状参考</h1>
  <div class="row">

    <!-- 单瓣 -->
    <div class="item">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <defs>
          <radialGradient id="g1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e8a892"/>
            <stop offset="100%" stop-color="#d97757"/>
          </radialGradient>
        </defs>
        <!-- 5片花瓣，使用贝塞尔曲线 -->
        <g transform="translate(80,80)">
          <!-- 花瓣1 (上) -->
          <path d="M0,-8 C18,-18 28,-42 8,-58 C0,-64 -8,-58 -12,-46 C-18,-30 -8,-18 0,-8Z" fill="url(#g1)" opacity="0.9"/>
          <!-- 花瓣2 (右上) -->
          <path d="M8,0 C22,12 48,16 56,-4 C60,-14 48,-20 36,-20 C22,-18 14,-8 8,0Z" fill="url(#g1)" opacity="0.9"/>
          <!-- 花瓣3 (右下) -->
          <path d="M4,6 C16,20 40,32 52,18 C58,10 50,2 38,2 C24,2 12,6 4,6Z" fill="url(#g1)" opacity="0.85"/>
          <!-- 花瓣4 (左下) -->
          <path d="M-4,6 C-14,20 -36,32 -48,18 C-54,10 -46,2 -34,2 C-22,2 -10,6 -4,6Z" fill="url(#g1)" opacity="0.85"/>
          <!-- 花瓣5 (左上) -->
          <path d="M-8,0 C-22,12 -48,16 -56,-4 C-60,-14 -48,-20 -36,-20 C-22,-18 -14,-8 -8,0Z" fill="url(#g1)" opacity="0.9"/>
          <!-- 花蕊 -->
          <circle cx="0" cy="0" r="10" fill="#faf9f5" opacity="0.6"/>
          <circle cx="0" cy="0" r="6" fill="#e8a892"/>
          <circle cx="0" cy="0" r="3" fill="#d97757"/>
          <!-- 蕊丝 -->
          <g stroke="#c26243" stroke-width="0.6" opacity="0.6">
            <line x1="0" y1="-6" x2="-4" y2="-14"/>
            <line x1="0" y1="-6" x2="4" y2="-14"/>
            <line x1="6" y1="0" x2="14" y2="-4"/>
            <line x1="6" y1="0" x2="14" y2="4"/>
            <line x1="0" y1="6" x2="-4" y2="14"/>
            <line x1="0" y1="6" x2="4" y2="14"/>
            <line x1="-6" y1="0" x2="-14" y2="-4"/>
            <line x1="-6" y1="0" x2="-14" y2="4"/>
          </g>
          <!-- 蕊头 -->
          <g fill="#d97757" opacity="0.7">
            <circle cx="-4" cy="-14" r="1.5"/>
            <circle cx="4" cy="-14" r="1.5"/>
            <circle cx="14" cy="-4" r="1.5"/>
            <circle cx="14" cy="4" r="1.5"/>
            <circle cx="-4" cy="14" r="1.5"/>
            <circle cx="4" cy="14" r="1.5"/>
            <circle cx="-14" cy="-4" r="1.5"/>
            <circle cx="-14" cy="4" r="1.5"/>
          </g>
        </g>
      </svg>
      <div class="label">整朵桃花</div>
    </div>

    <!-- 单片花瓣 -->
    <div class="item">
      <svg width="120" height="160" viewBox="0 0 120 160">
        <defs>
          <radialGradient id="g2" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#e8a892"/>
            <stop offset="100%" stop-color="#d97757"/>
          </radialGradient>
        </defs>
        <g transform="translate(60,80)">
          <!-- 一片花瓣 -->
          <path d="M0,-10 C22,-22 36,-50 12,-64 C0,-72 -12,-64 -18,-50 C-28,-30 -12,-18 0,-10Z" fill="url(#g2)" opacity="0.85"/>
          <!-- 花瓣中线高光 -->
          <path d="M0,-10 C2,-30 0,-55 0,-62" fill="none" stroke="#faf9f5" stroke-width="0.8" opacity="0.3"/>
        </g>
      </svg>
      <div class="label">单片花瓣</div>
    </div>

    <!-- 花苞 -->
    <div class="item">
      <svg width="120" height="160" viewBox="0 0 120 160">
        <defs>
          <radialGradient id="g3" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#e8a892"/>
            <stop offset="100%" stop-color="#c26243"/>
          </radialGradient>
        </defs>
        <g transform="translate(60,80)">
          <!-- 花苞主体 -->
          <path d="M-8,10 C-18,8 -22,-6 -18,-18 C-14,-28 -4,-36 0,-38 C4,-36 14,-28 18,-18 C22,-6 18,8 8,10Z" fill="url(#g3)" opacity="0.9"/>
          <!-- 花苞缝隙 -->
          <path d="M0,10 C0,-4 2,-22 0,-36" fill="none" stroke="#faf9f5" stroke-width="0.6" opacity="0.4"/>
          <!-- 花萼 -->
          <path d="M-6,10 C-8,18 -4,22 0,22 C4,22 8,18 6,10Z" fill="#788c5d" opacity="0.5"/>
        </g>
      </svg>
      <div class="label">花苞</div>
    </div>
  </div>

  <div class="note">
    <p>画花瓣的关键：<br>
    <strong>起点</strong>（花心附近）→ 先向外扩大到最宽处 → 再收窄到尖端 → 回到起点<br>
    花瓣最宽处大约在距离花心 60%-70% 的位置，<br>
    尖端不要尖锐，要有自然的弧度。<br>
    单个花瓣用 <code>M x,y C x1,y1 x2,y2 x3,y3 C x4,y4 x5,y5 x,y Z</code> 绘制。</p>
  </div>
</body>
</html>
