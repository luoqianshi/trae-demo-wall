<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:${c.font};background:${c.bg};color:${c.text};min-height:100vh;-webkit-font-smoothing:antialiased;}
.container{max-width:800px;margin:0 auto;padding:20px;}
h1{font-size:22px;text-align:center;margin-bottom:8px;color:${c.accent};}
.subtitle{text-align:center;font-size:14px;opacity:0.6;margin-bottom:24px;}
.tabs{display:flex;gap:0;border-bottom:2px solid ${c.border};margin-bottom:24px;}
.tab{padding:12px 20px;cursor:pointer;border-bottom:2.5px solid transparent;font-size:14px;opacity:0.7;transition:all .2s;}
.tab.active{color:${c.accent};border-bottom-color:${c.accent};opacity:1;}
.q-card{background:${c.card};border:1px solid ${c.border};border-radius:${c.radius};padding:24px;margin-bottom:16px;}
.q-number{font-size:13px;opacity:0.6;margin-bottom:8px;}
.q-title{font-size:17px;line-height:1.6;margin-bottom:16px;font-weight:500;}
.q-option{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid ${c.border};border-radius:${c.radius};cursor:pointer;margin-bottom:8px;background:transparent;color:${c.text};font-family:inherit;font-size:15px;width:100%;text-align:left;transition:all .2s;}
.q-option:hover{border-color:${c.accent};}
.q-option.correct{border-color:${c.accent};background:rgba(${parseInt(c.accent.slice(1,3),16)},${parseInt(c.accent.slice(3,5),16)},${parseInt(c.accent.slice(5,7),16)},0.12);}
.q-option.wrong{border-color:${c.wrong};background:rgba(${parseInt(c.wrong.slice(1,3),16)},${parseInt(c.wrong.slice(3,5),16)},${parseInt(c.wrong.slice(5,7),16)},0.12);}
.q-option-letter{width:28px;height:28px;border-radius:50%;border:1.5px solid ${c.border};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.q-option.correct .q-option-letter{background:${c.accent};border-color:${c.accent};color:${c.bg};}
.q-option.wrong .q-option-letter{background:${c.wrong};border-color:${c.wrong};color:#fff;}
.q-explanation{margin-top:16px;padding:16px;border-radius:${c.radius};background:rgba(${parseInt(c.accent.slice(1,3),16)},${parseInt(c.accent.slice(3,5),16)},${parseInt(c.accent.slice(5,7),16)},0.08);border-left:3px solid ${c.accent};font-size:14px;line-height:1.7;display:none;}
.q-explanation.show{display:block;}
.q-feedback{font-size:14px;font-weight:600;margin-bottom:8px;display:none;}
.q-feedback.show{display:block;}
.q-feedback.correct{color:${c.accent};}
.q-feedback.wrong{color:${c.wrong};}
.q-tag{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;background:rgba(${parseInt(c.accent.slice(1,3),16)},${parseInt(c.accent.slice(3,5),16)},${parseInt(c.accent.slice(5,7),16)},0.12);color:${c.accent};margin-right:6px;}
.q-nav{display:flex;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap;justify-content:center;}
.q-nav-btn{padding:8px 20px;border:1.5px solid ${c.border};border-radius:${c.radius};background:transparent;color:${c.text};cursor:pointer;font-family:inherit;font-size:14px;}
.q-nav-btn:hover{border-color:${c.accent};}
.q-nav-btn.primary{background:${c.accent};color:${c.bg};border-color:${c.accent};}
.q-num-cell{width:34px;height:34px;border-radius:${c.radius};border:1.5px solid ${c.border};display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:transparent;color:${c.text};font-family:inherit;}
.q-num-cell.current{border-color:${c.accent};background:${c.accent};color:${c.bg};}
.q-num-cell.done{border-color:${c.accent};color:${c.accent};}
.q-num-cell.wrong{border-color:${c.wrong};color:${c.wrong};}
.q-progress-bar{height:6px;background:${c.border};border-radius:3px;overflow:hidden;margin-bottom:20px;}
.q-progress-fill{height:100%;background:${c.accent};border-radius:3px;transition:width .3s;}
.footer{text-align:center;padding:24px;font-size:12px;opacity:0.4;}
.empty{text-align:center;padding:40px;opacity:0.5;}
</style>
</head>
<body>
<div class="container">
<h1>📚 ${document.getElementById('quizTopic').textContent}</h1>
<div class="subtitle">题境 QuizForge · 离线刷题站</div>
<div class="tabs">
<div class="tab active" onclick="switchTab('practice')">✏️ 真题速刷</div>
<div class="tab" onclick="switchTab('errorbook')">📕 错题本</div>
<div class="tab" onclick="switchTab('progress')">📊 进度追踪</div>
</div>
<div id="content"></div>
<div class="footer">由 题境 QuizForge 生成 · ${new Date().toLocaleDateString('zh-CN')}</div>
</div>
<script>
var QUESTIONS = ${data};
var currentTab='practice',currentIndex=0,answers={},wrongQuestions=[];
var lsKey='quizforge_${App.quizId}';
try{var saved=JSON.parse(localStorage.getItem(lsKey));if(saved){answers=saved.answers||{};wrongQuestions=saved.wrongQuestions||[];}}catch(e){}

function saveData(){try{localStorage.setItem(lsKey,JSON.stringify({answers:answers,wrongQuestions:wrongQuestions}));}catch(e){}}

function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});event.target.classList.add('active');if(tab==='practice')renderPractice();else if(tab==='errorbook')renderErrorBook();else if(tab==='progress')renderProgress();}

function renderPractice(){
var c=document.getElementById('content');
if(currentIndex>=QUESTIONS.length)currentIndex=0;
var q=QUESTIONS[currentIndex];var total=QUESTIONS.length;
var progressPct=((currentIndex+1)/total)*100;
var answered=Object.keys(answers).length;

c.innerHTML='<div class="q-progress-bar"><div class="q-progress-fill" style="width:'+progressPct+'%"></div></div>'+
'<div style="display:flex;justify-content:space-between;margin-bottom:20px;font-size:13px;opacity:0.6;">'+
'<span>第 '+(currentIndex+1)+' 题 / 共 '+total+' 题</span><span>已答 '+answered+' 题</span></div>'+
'<div class="q-card"><div class="q-number"><span class="q-tag">'+(q.knowledgeTag||'通用')+'</span></div>'+
'<div class="q-title">'+q.question+'</div><div id="opts">'+
q.options.map(function(opt,i){return '<button class="q-option" onclick="selectAnswer('+i+')"><span class="q-option-letter">'+String.fromCharCode(65+i)+'</span><span>'+opt+'</span></button>';}).join('')+
'</div><div class="q-feedback" id="fb"></div><div class="q-explanation" id="ex"><strong>📖 解析：</strong>'+q.explanation+'</div></div>'+
'<div class="q-nav"><button class="q-nav-btn" onclick="prev()" '+(currentIndex===0?'disabled':'')+'>← 上一题</button>'+
'<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;">'+
QUESTIONS.map(function(_,i){var cls='q-num-cell';if(i===currentIndex)cls+=' current';else if(answers[i]!==undefined)cls+=answers[i]===QUESTIONS[i].answer?' done':' wrong';return '<button class="'+cls+'" onclick="goTo('+i+')">'+(i+1)+'</button>';}).join('')+
'</div><button class="q-nav-btn primary" onclick="next()" '+(currentIndex===total-1?'disabled':'')+'>下一题 →</button></div>';

if(answers[currentIndex]!==undefined)restoreAns();
}

function restoreAns(){var sel=answers[currentIndex];var cor=QUESTIONS[currentIndex].answer;var opts=document.querySelectorAll('#opts .q-option');var fb=document.getElementById('fb');var ex=document.getElementById('ex');
opts.forEach(function(o,i){o.style.pointerEvents='none';if(i===sel)o.classList.add(sel===cor?'correct':'wrong');if(i===cor&&sel!==cor)o.classList.add('correct');});
fb.classList.add('show');if(sel===cor){fb.classList.add('correct');fb.textContent='✓ 回答正确！';}else{fb.classList.add('wrong');fb.textContent='✗ 回答错误，正确答案是 '+String.fromCharCode(65+cor);}
ex.classList.add('show');}

function selectAnswer(i){if(answers[currentIndex]!==undefined)return;answers[currentIndex]=i;saveData();
var cor=QUESTIONS[currentIndex].answer;var opts=document.querySelectorAll('#opts .q-option');var fb=document.getElementById('fb');var ex=document.getElementById('ex');
opts.forEach(function(o,j){o.style.pointerEvents='none';if(j===i)o.classList.add(i===cor?'correct':'wrong');if(j===cor&&i!==cor)o.classList.add('correct');});
fb.classList.add('show');if(i===cor){fb.classList.add('correct');fb.textContent='✓ 回答正确！';}else{fb.classList.add('wrong');fb.textContent='✗ 回答错误，正确答案是 '+String.fromCharCode(65+cor);if(wrongQuestions.indexOf(currentIndex)===-1)wrongQuestions.push(currentIndex);saveData();}
ex.classList.add('show');renderPractice();}

function prev(){if(currentIndex>0){currentIndex--;renderPractice();}}
function next(){if(currentIndex<QUESTIONS.length-1){currentIndex++;renderPractice();}}
function goTo(i){currentIndex=i;renderPractice();}

function renderErrorBook(){var c=document.getElementById('content');
if(wrongQuestions.length===0){c.innerHTML='<div class="empty">📕 暂无错题，继续加油！</div>';return;}
c.innerHTML='<h3 style="margin-bottom:16px;">错题本（共'+wrongQuestions.length+'题）</h3>'+
wrongQuestions.map(function(qIdx){var q=QUESTIONS[qIdx];var ua=answers[qIdx];return '<div class="q-card"><div class="q-number"><span class="q-tag">'+(q.knowledgeTag||'通用')+'</span> 第'+(qIdx+1)+'题</div><div class="q-title">'+q.question+'</div><div style="font-size:13px;opacity:0.6;color:${c.wrong};">你的答案：'+String.fromCharCode(65+ua)+'.'+q.options[ua]+'</div><div style="font-size:13px;color:${c.accent};">正确答案：'+String.fromCharCode(65+q.answer)+'.'+q.options[q.answer]+'</div><div class="q-explanation show" style="margin-top:8px;"><strong>📖 解析：</strong>'+q.explanation+'</div></div>';}).join('');
}

function renderProgress(){var c=document.getElementById('content');var total=QUESTIONS.length;var answered=Object.keys(answers).length;
var correct=Object.entries(answers).filter(function(e){return e[1]===QUESTIONS[parseInt(e[0])].answer;}).length;
var comp=total>0?Math.round(answered/total*100):0;var acc=answered>0?Math.round(correct/answered*100):0;
c.innerHTML='<div style="text-align:center;margin-bottom:24px;"><div style="font-size:48px;font-weight:700;color:'+('${c.accent}')+';">'+acc+'%</div><div style="font-size:14px;opacity:0.6;">正确率</div></div>'+
'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;">'+
'<div class="q-card" style="text-align:center;"><div style="font-size:28px;font-weight:700;">'+answered+'</div><div style="font-size:12px;opacity:0.6;">已答</div></div>'+
'<div class="q-card" style="text-align:center;"><div style="font-size:28px;font-weight:700;color:'+('${c.accent}')+';">'+correct+'</div><div style="font-size:12px;opacity:0.6;">正确</div></div>'+
'<div class="q-card" style="text-align:center;"><div style="font-size:28px;font-weight:700;color:${c.wrong};">'+(answered-correct)+'</div><div style="font-size:12px;opacity:0.6;">错误</div></div></div>'+
'<div class="q-card"><div style="font-size:14px;margin-bottom:12px;">完成度：'+comp+'%</div><div class="q-progress-bar"><div class="q-progress-fill" style="width:'+comp+'%"></div></div></div>'+
'<div style="text-align:center;margin-top:20px;"><button class="q-nav-btn" onclick="answers={};wrongQuestions=[];saveData();renderPractice();">重置进度</button></div>';
}

renderPractice();
<\/script>
</body>
</html>`;
}

// Close template selector when clicking outside
document.addEventListener('click', (e) => {
  const selector = document.getElementById('templateSelector');
  if (selector.classList.contains('active') && !e.target.closest('.quiz-toolbar-actions') && !e.target.closest('.template-selector')) {
    selector.classList.remove('active');
  }
});

// Initialize
init();
</script>
</body>
</html>
