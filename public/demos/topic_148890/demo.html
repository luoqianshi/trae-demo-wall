<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>暖归 AI 智能体 Demo - 婚姻家事法律服务</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=20260714">
  <style>
    @font-face {
      font-family: 'Noto Sans SC';
      src: local('Microsoft YaHei'), local('PingFang SC'), local('Hiragino Sans GB'), local('WenQuanYi Micro Hei');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Noto Sans SC';
      src: local('Microsoft YaHei'), local('PingFang SC'), local('Hiragino Sans GB'), local('WenQuanYi Micro Hei');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Noto Sans SC';
      src: local('Microsoft YaHei'), local('PingFang SC'), local('Hiragino Sans GB'), local('WenQuanYi Micro Hei');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Noto Sans SC';
      src: local('Microsoft YaHei'), local('PingFang SC'), local('Hiragino Sans GB'), local('WenQuanYi Micro Hei');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Noto Serif SC';
      src: local('SimSun'), local('STSong'), local('Noto Serif CJK SC');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Noto Serif SC';
      src: local('SimSun'), local('STSong'), local('Noto Serif CJK SC');
      font-weight: 700;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family-body);
      background: var(--color-bg-primary);
      min-height: 100vh;
      color: var(--color-text-primary);
      transition: background 0.3s;
    }

    /* ========== 场景主题色 ========== */
    body.scene-therapy {
      --scene-primary: #E8A87C;
      --scene-primary-light: #FBE8D8;
      --scene-bg: linear-gradient(135deg, #FFF8F0 0%, #FBE8D8 40%, #F5D5B0 100%);
    }
    body.scene-law {
      --scene-primary: #4E7A5C;
      --scene-primary-light: #E0EBE4;
      --scene-bg: linear-gradient(135deg, #FAFAF5 0%, #E0EBE4 40%, #C8D8CE 100%);
    }
    body.scene-document {
      --scene-primary: #C57B57;
      --scene-primary-light: #F3E0D2;
      --scene-bg: linear-gradient(135deg, #FFF9F5 0%, #F3E0D2 40%, #E8C4A8 100%);
    }

    /* ========== 顶部导航 ========== */
    .demo-header {
      background: var(--scene-bg);
      padding: 24px 32px;
      border-bottom: 1px solid var(--color-border-default);
    }
    .demo-header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .demo-header h1 {
      font-family: var(--font-family-display);
      font-size: 22px;
      color: var(--color-text-primary);
    }
    .demo-header p {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-top: 4px;
    }
    .demo-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-tag {
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--color-border-default);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--color-text-secondary);
    }
    .stat-tag strong { color: var(--scene-primary); }

    /* ========== 场景切换 Tabs ========== */
    .scene-tabs {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.7);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--color-border-default);
    }
    .scene-tab {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--color-text-secondary);
      font-family: inherit;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .scene-tab:hover { background: rgba(255,255,255,0.8); }
    .scene-tab.active {
      background: var(--scene-primary);
      color: white;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .scene-title {
      font-size: 12px;
      color: var(--scene-primary);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ========== 主体布局 ========== */
    .demo-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 900px) {
      .demo-container { grid-template-columns: 2fr 1fr; }
    }

    /* ========== 聊天面板 ========== */
    .chat-panel {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(42, 37, 32, 0.08);
      display: flex;
      flex-direction: column;
      height: 70vh;
      min-height: 500px;
      overflow: hidden;
    }
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--scene-primary-light);
      display: flex; align-items: center; justify-content: center;
      color: var(--scene-primary);
      font-family: var(--font-family-display);
      font-weight: 700;
    }
    .chat-title { font-size: 15px; font-weight: 600; }
    .chat-subtitle { font-size: 12px; color: var(--scene-primary); }

    /* ========== 婚姻金句轮播 ========== */
    .quote-banner {
      padding: 10px 20px;
      background: linear-gradient(90deg, transparent 0%, var(--scene-primary-light) 50%, transparent 100%);
      font-size: 12px;
      color: var(--color-text-secondary);
      font-style: italic;
      text-align: center;
      border-top: 1px solid var(--color-border-subtle);
      animation: fadeSlide 0.6s ease;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .quote-banner::before {
      content: "💛 ";
      font-style: normal;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ========== 律师团队数据卡片 ========== */
    .lawyer-stats-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--color-border-default);
    }
    .lawyer-stats-card h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .stat-item {
      text-align: center;
      padding: 8px 4px;
      background: var(--color-bg-secondary);
      border-radius: 8px;
    }
    .stat-num {
      font-size: 16px;
      font-weight: 700;
      color: var(--scene-primary);
      font-family: var(--font-family-display);
    }
    .stat-label {
      font-size: 11px;
      color: var(--color-text-muted);
      margin-top: 2px;
    }
    .stats-footer {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--color-border-default);
      font-size: 11px;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ========== 情绪表情反应 ========== */
    .emotion-reaction {
      position: absolute;
      right: 12px;
      top: -8px;
      font-size: 18px;
      animation: emotionPop 0.6s ease;
      pointer-events: none;
    }
    @keyframes emotionPop {
      0% { transform: scale(0) translateY(10px); opacity: 0; }
      50% { transform: scale(1.3) translateY(0); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* ========== 已读回执 ========== */
    .read-receipt {
      font-size: 11px;
      color: var(--color-text-muted);
      padding: 4px 12px;
      text-align: right;
      animation: fadeIn 0.3s ease;
    }

    /* ========== 用户成就小勋章 ========== */
    .user-achievement {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #FFE4B5 0%, #FFD700 100%);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 4px 16px rgba(255, 215, 0, 0.4);
      font-size: 13px;
      color: #5D4E0E;
      z-index: 100;
      animation: achievementSlide 0.5s ease;
      max-width: 260px;
    }
    @keyframes achievementSlide {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .user-achievement .achievement-close {
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 14px;
      cursor: pointer;
      opacity: 0.6;
    }
    .user-achievement .achievement-close:hover { opacity: 1; }
    .user-achievement .achievement-icon {
      font-size: 20px;
      margin-right: 8px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      animation: msgIn 0.3s ease;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.user {
      align-self: flex-end;
      background: var(--scene-primary);
      color: var(--color-text-inverse);
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: var(--color-bg-secondary);
      color: var(--color-text-primary);
      border-bottom-left-radius: 4px;
    }
    .message .meta {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--color-border-subtle);
      font-size: 11px;
      color: var(--color-text-muted);
      flex-wrap: wrap;
    }
    .message .confidence {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .confidence-bar {
      width: 50px; height: 4px;
      background: var(--color-border-default);
      border-radius: 2px;
      overflow: hidden;
    }
    .confidence-fill { height: 100%; transition: width 0.5s; }
    .message .typing { display: inline-block; }
    .typing::after {
      content: '▎';
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .message strong { color: var(--color-text-primary); font-weight: 600; }
    .message blockquote {
      background: var(--scene-primary-light);
      border-left: 3px solid var(--scene-primary);
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: 4px;
      font-size: 13px;
    }
    .message hr {
      border: none;
      border-top: 1px dashed var(--color-border-default);
      margin: 12px 0;
    }
    .chat-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--color-border-subtle);
      display: flex;
      gap: 8px;
    }
    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--color-border-default);
      border-radius: 999px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input:focus { border-color: var(--scene-primary); }
    .chat-send {
      padding: 10px 20px;
      background: var(--scene-primary);
      color: white;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .chat-send:hover { opacity: 0.88; }
    .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ========== 右侧信息面板 ========== */
    .side-panel {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(42, 37, 32, 0.08);
      padding: 20px;
      height: 70vh;
      min-height: 500px;
      overflow-y: auto;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-title::before {
      content: '';
      width: 3px; height: 14px;
      background: var(--scene-primary);
      border-radius: 2px;
    }
    .source-item {
      padding: 12px;
      background: var(--color-bg-secondary);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      transition: all 0.2s;
    }
    .source-item:hover { background: var(--scene-primary-light); }
    .source-item .src-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .source-item .src-type {
      background: var(--scene-primary);
      color: white;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 10px;
    }
    .source-item .src-type.case { background: var(--state-warning); }
    .source-item .src-type.qa { background: #7A9E7E; }
    .source-item .src-type.doc { background: #C57B57; }
    .source-item .src-score {
      font-family: var(--font-family-mono, monospace);
      color: var(--color-text-muted);
      font-size: 11px;
    }
    .source-item .src-title { font-weight: 600; color: var(--color-text-primary); margin-bottom: 2px; }
    .source-item .src-source { color: var(--color-text-muted); font-size: 11px; }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--color-text-muted);
      font-size: 13px;
    }
    .empty-state-icon { font-size: 28px; margin-bottom: 6px; opacity: 0.4; }

    .quick-questions {
      margin-bottom: 16px;
    }
    .quick-category {
      margin-bottom: 12px;
    }
    .cat-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cat-count {
      font-size: 11px;
      font-weight: normal;
      color: var(--color-text-muted);
      background: var(--color-bg-secondary);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .cat-questions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .quick-q {
      padding: 5px 10px;
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border-default);
      border-radius: 999px;
      font-size: 12px;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-q:hover {
      background: var(--scene-primary-light);
      color: var(--scene-primary);
      border-color: var(--scene-primary-light);
    }

    .retrieval-process {
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border-subtle);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-family: var(--font-family-mono, monospace);
      font-size: 11px;
      color: var(--color-text-muted);
      display: none;
    }
    .retrieval-process.active { display: block; }
    .retrieval-process .step {
      margin: 4px 0;
      padding-left: 16px;
      position: relative;
    }
    .retrieval-process .step::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--scene-primary);
    }

    /* ========== 疗愈小屋 - 聊天室样式 ========== */

    /* 聊天室成员列表 */
    .room-members {
      background: var(--color-bg-secondary);
      border-radius: 10px;
      padding: 14px;
    }
    .room-member {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .room-member:last-child { border-bottom: none; padding-bottom: 0; }
    .room-member:first-child { padding-top: 0; }
    .member-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      color: white;
      flex-shrink: 0;
    }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-status { font-size: 11px; color: var(--color-text-muted); }
    .online-dot {
      width: 8px; height: 8px;
      border-radius: 50%; background: #4E7A5C;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* 系统消息（进出通知） */
    .msg-system {
      text-align: center;
      max-width: 90% !important;
      align-self: center !important;
      background: transparent !important;
      color: var(--color-text-muted) !important;
      font-size: 12px !important;
      padding: 4px 16px !important;
      border-radius: 999px !important;
      line-height: 1.5 !important;
    }
    .msg-system::after { content: none !important; }

    /* 其他人的消息 */
    .message.other {
      align-self: flex-start;
      background: #FFF5EE;
      color: var(--color-text-primary);
      border-bottom-left-radius: 4px;
      border-top-left-radius: 16px;
    }
    .message.other .sender-name {
      font-size: 11px;
      color: var(--scene-primary);
      font-weight: 600;
      margin-bottom: 2px;
      display: flex; align-items: center; gap: 4px;
    }
    .message.other .sender-name .mini-avatar {
      width: 18px; height: 18px;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: white; font-size: 9px; font-weight: 700;
    }
    .role-badge {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 4px;
      letter-spacing: 0.5px;
    }

    /* 用户自己的消息保持原样（右侧绿色）*/

    /* 小屋氛围装饰 */
    .room-vibe {
      text-align: center;
      padding: 10px;
      font-size: 20px;
      letter-spacing: 8px;
      opacity: 0.15;
    }

    /* 打字指示器 - 多人版 */
    .typing-others {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; color: var(--color-text-muted); margin-left: 4px;
    }
    .typing-dot {
      width: 5px; height: 5px;
      border-radius: 50%; background: var(--color-text-muted);
      animation: typingBounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.16s; }
    .typing-dot:nth-child(3) { animation-delay: 0.32s; }
    @keyframes typingBounce {
      0%,80%,100%{transform:scale(0.7)} 40%{transform:scale(1)}
    }

    /* 房间信息条 */
    .room-info-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px;
      background: var(--scene-primary-light);
      border-bottom: 1px solid var(--color-border-subtle);
      font-size: 12px;
      color: var(--color-text-secondary);
    }
    .room-count { display: flex; align-items: center; gap: 6px; }
    .room-count strong { color: var(--scene-primary); }
    .room-topic { font-style: italic; }

    /* ========== 文书生成专属 ========== */
    .doc-form {
      background: var(--color-bg-secondary);
      border-radius: 8px;
      padding: 16px;
      margin: 8px 0;
    }
    .doc-form label {
      display: block;
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
      margin-top: 10px;
    }
    .doc-form label:first-child { margin-top: 0; }
    .doc-form input, .doc-form textarea, .doc-form select {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--color-border-default);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: white;
    }
    .doc-form input:focus, .doc-form textarea:focus, .doc-form select:focus {
      border-color: var(--scene-primary);
    }
    .doc-form textarea { min-height: 60px; resize: vertical; }
    .doc-form .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .doc-preview {
      background: white;
      border: 1px solid var(--color-border-default);
      border-radius: 8px;
      padding: 16px;
      margin: 8px 0;
      font-size: 13px;
      line-height: 1.8;
      max-height: 300px;
      overflow-y: auto;
    }
    .doc-preview h3 {
      text-align: center;
      font-family: var(--font-family-display);
      margin-bottom: 12px;
    }
    .doc-btn {
      width: 100%;
      padding: 10px;
      background: var(--scene-primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
          .replace(/^---$/gm, '<hr>')
          .replace(/^(\d+)\. (.+)$/gm, '<div style="margin:4px 0 4px 12px">$1. $2</div>')
          .replace(/\n/g, '<br>');
      }

      // 更新右侧面板"导出完整咨询报告"按钮状态
      function updateLawReportButton() {
        const btn = document.getElementById('lawReportBtn');
        if (!btn) return;
        const count = lawConsultHistory.length;
        if (count > 0) {
          btn.disabled = false;
          btn.textContent = '📋 导出完整咨询报告（' + count + ' 轮咨询）';
        } else {
          btn.disabled = true;
          btn.textContent = '📋 导出完整咨询报告（暂无咨询记录）';
        }
      }

      // ========== 情绪疗愈 - 聊天室逻辑 ==========

      function getResident(id) {
        return ROOM_RESIDENTS.find(r => r.id === id);
      }

      // 添加其他居民的消息
      function addOtherMessage(resident, text) {
        const div = document.createElement('div');
        div.className = 'message other';
        const badge = resident.badge ? `<span class="role-badge" style="background:${resident.color}22;color:${resident.color}">${resident.badge.split(' ')[0]}</span>` : '';
        div.innerHTML = `
          <div class="sender-name">
            <span class="mini-avatar" style="background:${resident.color}">${resident.initial}</span>
            ${escapeHtml(resident.name)}
            ${badge}
          </div>
          <div class="content">${escapeHtml(text)}</div>
        `;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      // 添加系统通知
      function addSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'message msg-system';
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      // 显示"正在输入"
      function showTypingIndicator(resident) {
        const existing = document.getElementById('typing-' + resident.id);
        if (existing) return;
        const badge = resident.badge ? `<span class="role-badge" style="background:${resident.color}22;color:${resident.color}">${resident.badge.split(' ')[0]}</span>` : '';
        const div = document.createElement('div');
        div.className = 'message other';
        div.id = 'typing-' + resident.id;
        div.innerHTML = `
          <div class="sender-name">
            <span class="mini-avatar" style="background:${resident.color}">${resident.initial}</span>
            ${escapeHtml(resident.name)}
            ${badge}
          </div>
          <div class="content">
            <span class="typing-others">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
            </span>
          </div>
        `;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function removeTypingIndicator(residentId) {
        const el = document.getElementById('typing-' + residentId);
        if (el) el.remove();
      }

      // 启动聊天室
      function startRoom() {
        stopRoom();

        // AI暖归是常驻守护者，一定在线
        const nuangui = ROOM_RESIDENTS.find(r => r.id === 'nuangui');
        // 随机选 2-3 个普通居民
        const normalUsers = ROOM_RESIDENTS.filter(r => r.role === 'user');
        const shuffled = [...normalUsers].sort(() => Math.random() - 0.5);
        const randomUsers = shuffled.slice(0, 2 + Math.floor(Math.random() * 2));

        // 有 50% 概率有咨询师或律师在第一个话题就出现
        const extras = [];
        if (Math.random() > 0.5) {
          extras.push(ROOM_RESIDENTS.find(r => r.id === 'counselor'));
        }
        if (Math.random() > 0.6) {
          extras.push(ROOM_RESIDENTS.find(r => r.id === 'lawyer'));
        }

        roomState.activeResidents = [nuangui, ...randomUsers, ...extras.filter(Boolean)];
        roomState.conversationIndex = Math.floor(Math.random() * ROOM_CONVERSATIONS.length);
        roomState.messageIndex = 0;

        const onlineCount = roomState.activeResidents.length + 1;
        chatSubtitleEl.textContent = `● ${onlineCount}人在线 · 温暖相遇`;

        const conv = ROOM_CONVERSATIONS[roomState.conversationIndex];

        // 显示房间信息条
        roomInfoBar.style.display = 'flex';
        roomInfoBar.innerHTML = `
          <div class="room-count">🟡 <strong>${onlineCount}</strong> 人在线</div>
          <div class="room-topic">💡 ${escapeHtml(conv.topic)}</div>
        `;

        // 0s: 系统消息 - 推门
        roomState.timers.push(setTimeout(() => {
          addSystemMessage('🚪 你推开了疗愈小屋的门...');
        }, 400));

        // 0.6s: AI暖归先欢迎
        roomState.timers.push(setTimeout(() => {
          showTypingIndicator(nuangui);
        }, 900));
        roomState.timers.push(setTimeout(() => {
          removeTypingIndicator(nuangui.id);
          addOtherMessage(nuangui, '你好呀，欢迎来到疗愈小屋 💛 我是暖归，这里的守护者。慢慢坐，喝口水，这里很安全，没有评判，只有陪伴。');
        }, 2200));

        // 2.5s: 话题
        roomState.timers.push(setTimeout(() => {
          addSystemMessage(`💡 今日话题：${conv.topic}`);
        }, 3000));

        // 3.5s: 居民陆续进来
        const otherResidents = roomState.activeResidents.filter(r => r.id !== 'nuangui');
        otherResidents.forEach((r, i) => {
          roomState.timers.push(setTimeout(() => {
            addSystemMessage(`${r.name} 来到了小屋 — ${r.status}`);
          }, 3500 + i * 1000));
        });

        // 居民消息依次出现（跳过 AI 暖归，它会在话题里说话）
        let delayOffset = 3500 + otherResidents.length * 1000 + 1500;
        conv.messages.forEach((msg, i) => {
          const resident = getResident(msg.who);
          if (!resident) return;

          const baseDelay = delayOffset + i * 3000;
          // 确保说话的人是已在线的；如果没有，动态让他进来
          if (!roomState.activeResidents.find(r => r.id === msg.who)) {
            roomState.timers.push(setTimeout(() => {
              if (currentScene !== 'therapy') return;
              roomState.activeResidents.push(resident);
              addSystemMessage(`${resident.name} 来到了小屋 — ${resident.status}`);
              const oc = roomState.activeResidents.length + 1;
              chatSubtitleEl.textContent = `● ${oc}人在线 · 温暖相遇`;
              roomInfoBar.innerHTML = `
                <div class="room-count">🟡 <strong>${oc}</strong> 人在线</div>
                <div class="room-topic">💡 ${escapeHtml(conv.topic)}</div>
              `;
              // 更新右侧面板（只更新成员列表部分简化处理：不更新了，避免刷新）
            }, baseDelay - 800));
          }

          roomState.timers.push(setTimeout(() => {
            if (currentScene !== 'therapy') return;
            showTypingIndicator(resident);
          }, baseDelay));

          roomState.timers.push(setTimeout(() => {
            if (currentScene !== 'therapy') return;
            removeTypingIndicator(resident.id);
            addOtherMessage(resident, msg.text);
          }, baseDelay + 1200 + Math.random() * 1000));
        });

        // 最后一条之后，10s 后换话题
        roomState.timers.push(setTimeout(() => {
          if (currentScene !== 'therapy') return;
          rotateConversation();
        }, delayOffset + conv.messages.length * 3000 + 10000));
      }

      // 话题轮换
      function rotateConversation() {
        if (currentScene !== 'therapy') return;
        roomState.conversationIndex = (roomState.conversationIndex + 1) % ROOM_CONVERSATIONS.length;
        roomState.messageIndex = 0;
        const conv = ROOM_CONVERSATIONS[roomState.conversationIndex];

        // 更新房间信息条
        const onlineCount = roomState.activeResidents.length + 1;
        if (roomInfoBar) {
          roomInfoBar.innerHTML = `
            <div class="room-count">🟡 <strong>${onlineCount}</strong> 人在线</div>
            <div class="room-topic">💡 ${escapeHtml(conv.topic)}</div>
          `;
        }

        addSystemMessage(`💡 新话题：${conv.topic}`);

        conv.messages.forEach((msg, i) => {
          const resident = getResident(msg.who);
          // 换话题时让更多居民参与
          if (!resident) return;

          const baseDelay = 2000 + i * 3000;
          roomState.timers.push(setTimeout(() => {
            if (currentScene !== 'therapy') return;
            // 动态让居民上线
            if (!roomState.activeResidents.find(r => r.id === msg.who)) {
              roomState.activeResidents.push(resident);
              addSystemMessage(`${resident.name} 来到了小屋 — ${resident.status}`);
              const onlineCount = roomState.activeResidents.length + 1;
              chatSubtitleEl.textContent = `● ${onlineCount}人在线 · 温暖相遇`;
            }
            showTypingIndicator(resident);
          }, baseDelay));

          roomState.timers.push(setTimeout(() => {
            if (currentScene !== 'therapy') return;
            removeTypingIndicator(resident.id);
            addOtherMessage(resident, msg.text);
          }, baseDelay + 1200 + Math.random() * 800));
        });

        // 循环
        roomState.timers.push(setTimeout(() => {
          if (currentScene !== 'therapy') return;
          rotateConversation();
        }, 2000 + conv.messages.length * 3000 + 10000));
      }

      // 停止聊天室
      function stopRoom() {
        roomState.timers.forEach(t => clearTimeout(t));
        roomState.typingTimers.forEach(t => clearTimeout(t));
        roomState.timers = [];
        roomState.typingTimers = [];
        roomState.activeResidents = [];
      }

      // 用户在疗愈小屋发消息时，居民的反应
      function therapyRoomRespond(text, history = []) {

              '夫妻共同财产原则上平均分割，但法院会考虑双方的贡献和实际情况。抚养费需结合子女需求和父母能力确定。',
              '财产分割需要区分婚前个人财产和婚后共同财产，建议提前收集相关证据材料。',
              '子女抚养权的判定以最有利于未成年子女为原则，抚养费根据对方收入和当地生活水平确定。'
            ],
            default: [
              '你好，我是周律师。你的问题涉及法律方面，建议保留好相关证据。如果需要更详细的解答，可以到"法律咨询"板块问我。',
              '法律问题需要具体分析，建议你整理相关材料，我们可以在法律咨询板块详细讨论。',
              '遇到法律问题不用慌张，保留好证据是关键。如需进一步帮助，可以预约专业律师咨询。',
              '你的问题涉及法律层面，建议先收集证据材料，具体情况可以在法律咨询板块深入沟通。'
            ]
          };

          if (lower.includes('家暴') || lower.includes('报警') || lower.includes('保护令')) {
            primaryText = lawResponses.domesticViolence[Math.floor(Math.random() * lawResponses.domesticViolence.length)];
          } else if (lower.includes('离婚')) {
            primaryText = lawResponses.divorce[Math.floor(Math.random() * lawResponses.divorce.length)];
          } else if (lower.includes('财产') || lower.includes('抚养费') || lower.includes('抚养权')) {
            primaryText = lawResponses.property[Math.floor(Math.random() * lawResponses.property.length)];
          } else {
            primaryText = lawResponses.default[Math.floor(Math.random() * lawResponses.default.length)];
          }

          if (nuangui) {
            hasSecond = true;
            secondResponder = nuangui;
            const lawyerSupplements = [
              '周律师说得很专业 ✨ 你的安全和权益最重要，别害怕求助',
              '谢谢你周律师的解答 🤍 记住，你不是一个人在面对',

            ];
            secondText = lawyerSupplements[Math.floor(Math.random() * lawyerSupplements.length)];
          }
        } else if (isCounselQuestion && counselor) {
          primaryResponder = counselor;
          const counselResponses = {

          if (currentScene !== 'therapy') return;

            addOtherMessage(secondResponder, secondText);
          }, secondDelay));
        }

      function lawRespond(query, history = []) {
        const startTime = performance.now();
        
        const queryTokens = window.NuanguiRetriever.tokenize(query);
        const topResults = window.NuanguiRetriever.search(index, query, 5);
        const top3 = topResults.slice(0, 3);
        const result = window.NuanguiGenerator.generate(query, topResults);
        const latency = Math.round(performance.now() - startTime);

        return { ...result, top3, latency, queryTokens, query };
      }

      // ========== 发送消息 ==========
      function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = '';
        sendBtn.disabled = true;

        // 文书场景不使用聊天功能
        if (currentScene === 'document') {
          sendBtn.disabled = false;
          return;
        }

        // 情绪识别 + 头像反应
        const emotion = detectEmotion(text);
        showEmotionOnAvatar(emotion);

        // 用户成就计数
        incrementUsageCount();

        const userMsgDiv = addMessage('user', text);

        chatHistory.push({ role: 'user', content: text });
        if (chatHistory.length > 20) chatHistory.shift();

        // 已读回执
        setTimeout(() => showReadReceipt(userMsgDiv), 300);

        if (currentScene === 'therapy') {
          // 在疗愈小屋中，居民会回复用户的消息
          therapyRoomRespond(text, chatHistory);
        } else if (currentScene === 'law') {
          const warmText = getWarmTypingText();
          const thinkingDiv = addMessage('bot', '');
          const contentEl = thinkingDiv.querySelector('.content');
          if (contentEl) {
            contentEl.innerHTML = `<span style="color:var(--color-text-muted);">${warmText}</span><span class="typing"></span>`;
          }
          // 隐藏这条消息的反馈栏（暂时的）
          const feedbackBar = thinkingDiv.querySelector('.feedback-bar');
          if (feedbackBar) feedbackBar.style.display = 'none';

          setTimeout(() => {
            messagesEl.removeChild(thinkingDiv);
            const result = lawRespond(text, chatHistory);

            // 显示检索过程
            const procEl = document.getElementById('retrievalProcess');
            if (procEl) {
              procEl.classList.add('active');
              document.getElementById('stepQuery').innerHTML = '查询: <span>' + escapeHtml(result.query) + '</span>';
              document.getElementById('stepTokens').innerHTML = '分词结果: <span>' + result.queryTokens.length + ' 个词元（' + result.queryTokens.slice(0, 8).map(escapeHtml).join(' / ') + '...）</span>';
              document.getElementById('stepHits').innerHTML = '命中文档: <span>Top ' + result.top3.length + ' 候选</span>';
            }



            const botDiv = addMessage('bot', '', {
              confidence: result.confidence,
              sources: result.sources,
              latency: result.latency
            });
            const consultRecord = {
              query: text,
              answer: maybeAppendWarmReminder(result.answer),
              sources: result.top3,
              confidence: result.confidence,
              latency: result.latency,
              timestamp: new Date()
            };
            lawConsultHistory.push(consultRecord);
            
            chatHistory.push({ role: 'assistant', content: consultRecord.answer });
            if (chatHistory.length > 20) chatHistory.shift();
            
            streamMessage(botDiv, consultRecord.answer, function() {
              updateLawReportButton();
            });

            // 低置信度兜底提示
            if (result.needsLawyer) {
              setTimeout(() => {
                addMessage('bot', '由于您的问题涉及复杂情况，<strong>建议预约专业律师</strong>进行一对一咨询。');
              }, 2000);
            }

            sendBtn.disabled = false;
            inputEl.focus();
          }, 800);
        } else if (currentScene === 'document') {
          const botDiv = addMessage('bot', '');
          streamMessage(botDiv, '请在左侧选择文书类型并填写信息，我会为您生成文书草稿。\n\n支持：离婚协议书、民事起诉状、民事起诉状（二次起诉）、民事答辩状。');
          sendBtn.disabled = false;
          inputEl.focus();
        }

        if (currentScene === 'therapy') {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      // ========== 场景切换 ==========
      function switchScene(scene) {
        if (currentScene === scene) return;

        // 离开疗愈小屋时停止聊天室
        if (currentScene === 'therapy') {
          stopRoom();
          roomInfoBar.style.display = 'none';
        }

        currentScene = scene;
        document.body.className = 'scene-' + scene;
        const config = SCENES[scene];

        sceneTitleEl.textContent = config.title;
        chatTitleEl.textContent = config.chatTitle;
        chatSubtitleEl.textContent = config.chatSubtitle;
        inputEl.placeholder = config.placeholder;

        // 更新 Tab 状态
        document.querySelectorAll('.scene-tab').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.scene === scene);
        });

        // 切换左侧面板
        const chatPanel = document.getElementById('chatPanel');
        const docMainPanel = document.getElementById('docMainPanel');

        if (scene === 'document') {
          chatPanel.style.display = 'none';
          docMainPanel.style.display = 'flex';

          chatPanel.style.display = 'flex';
          docMainPanel.style.display = 'none';
          messagesEl.innerHTML = '';

        // 咨询报告按钮仅在法律咨询场景显示
        const lawReportBar = document.getElementById('lawReportBar');

          lawReportBar.style.display = (scene === 'law') ? 'block' : 'none';

          startRoom();

          // 其他场景（非文书）：显示欢迎语
          addMessage('bot', getSceneWelcome(scene));
        }

        // 渲染右侧面板
        renderSidePanel();
      }

      function bindDocDropdown() {
        const trigger = document.getElementById('docTypeTrigger');
        const menu = document.getElementById('docTypeMenu');
        if (!trigger) return;

        const kb = window.NUANGUI_KNOWLEDGE_BASE || [];
        const docTemplates = kb.filter(d => d.type === '文书');
        
        const categoryOrder = ['离婚协议', '起诉状', '诉讼程序', '保护令申请', '子女抚养', '财产分割', '债务纠纷', '损害赔偿', '其他'];
        const categorized = {};
        docTemplates.forEach(doc => {
          const cat = categoryOrder.includes(doc.category) ? doc.category : '其他';
          if (!categorized[cat]) categorized[cat] = [];
          categorized[cat].push(doc);
        });

        let menuHtml = '';
        categoryOrder.forEach(cat => {
          if (categorized[cat] && categorized[cat].length > 0) {
            menuHtml += `<div class="doc-type-category"><div class="cat-name">${cat}</div>`;
            categorized[cat].forEach((doc, idx) => {
              const icon = getDocIcon(doc.title);
              const isFirst = idx === 0 && cat === categoryOrder[0];
              menuHtml += `<div class="doc-type-option ${isFirst ? 'active' : ''}" data-doc="${doc.id}" data-category="${doc.category}">
                <span class="option-icon">${icon}</span>${doc.title.replace(/[-—] .*/, '')}
              </div>`;
            });
            menuHtml += '</div>';
          }
        });
        menu.innerHTML = menuHtml;

        if (docTemplates.length > 0) {
          const firstDoc = docTemplates[0];
          document.getElementById('docTypeIcon').textContent = getDocIcon(firstDoc.title);
          document.getElementById('docTypeLabel').textContent = firstDoc.title.replace(/[-—] .*/, '');
        }

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          trigger.classList.toggle('open');
          menu.classList.toggle('open');
        });

        document.querySelectorAll('.doc-type-option').forEach(opt => {
          opt.addEventListener('click', () => {
            const docId = opt.dataset.doc;
            document.querySelectorAll('.doc-type-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            document.getElementById('docTypeIcon').textContent = opt.querySelector('.option-icon').textContent;
            document.getElementById('docTypeLabel').textContent = opt.textContent.trim();
            trigger.classList.remove('open');
            menu.classList.remove('open');
            switchDocType(docId);
          });
        });

        document.addEventListener('click', (e) => {
          if (!document.getElementById('docTypeDropdown').contains(e.target)) {
            trigger.classList.remove('open');
            menu.classList.remove('open');
          }
        });

        document.querySelectorAll('.doc-tab').forEach(tab => {
          tab.addEventListener('click', () => switchDocTab(tab.dataset.doctab));
        });
      }

      function getDocIcon(title) {
        if (title.includes('协议')) return '协';
        if (title.includes('起诉状') || title.includes('起诉')) return '诉';
        if (title.includes('保护令')) return '保';
        if (title.includes('变更') || title.includes('申请')) return '申';
        if (title.includes('抚养') || title.includes('子女')) return '子';
        if (title.includes('财产') || title.includes('分割')) return '财';
        if (title.includes('债务')) return '债';
        if (title.includes('赔偿')) return '赔';
        if (title.includes('答辩')) return '答';
        if (title.includes('上诉')) return '上';
        if (title.includes('证据')) return '证';
        return '文';
      }

      function switchDocType(docId) {
        docFormState.type = docId;
        
        const kb = window.NUANGUI_KNOWLEDGE_BASE || [];
        const doc = kb.find(d => d.id === docId);
        const formType = mapDocIdToFormType(docId);
        
        if (formType) {
          document.getElementById('docFormArea').innerHTML = renderDocForm(formType);
          document.getElementById('docPreviewArea').innerHTML = `
            <div class="empty-state" style="padding:60px 20px;">
              <div class="empty-state-icon">📄</div>
              <div>请填写表单后点击"生成文书"</div>
            </div>
          `;
          bindGenerateBtn(formType);
          switchDocTab('form');
        } else if (doc) {
          document.getElementById('docPreviewArea').innerHTML = `<pre class="doc-content-preview">${doc.content}</pre>`;
          document.getElementById('docFormArea').innerHTML = `
            <div class="doc-form">
              <div class="form-section-title">文书内容预览</div>
              <div class="doc-preview-hint">以下是文书模板的完整内容，您可以直接复制使用。</div>

            </div>
          `;
          switchDocTab('preview');
        }
      }

      function mapDocIdToFormType(docId) {
        const map = {
          'doc-001': 'divorce',
          'doc-005': 'complaint',
          'doc-054': 'complaint2',
          'doc-055': 'reply'

        return map[docId] || null;

        logArea.style.display = 'block';
        const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        const div = document.createElement('div');
        div.className = 'doc-log-item';
        div.innerHTML = `<div class="log-time">${time}</div>已生成《${typeName}》草稿`;
        logList.appendChild(div);
        logList.scrollTop = logList.scrollHeight;
      }

      // ========== 入驻申请弹窗逻辑 ==========
      function openApplyModal() {
        const overlay = document.getElementById('applyModalOverlay');
        const modal = document.getElementById('applyModal');
        let existingApply = null;
        try {
          existingApply = JSON.parse(localStorage.getItem('nuangui_professional_apply') || 'null');
        } catch (e) {}

        if (existingApply) {
          const statusClass = {
            pending: 'status-pending',
            approved: 'status-approved',
            rejected: 'status-rejected'
          }[existingApply.status] || 'status-pending';
          const statusText = {
            pending: '审核中',
            approved: '已通过',
            rejected: '未通过'
          }[existingApply.status] || '审核中';
          const statusIcon = {
            pending: '⏳',
            approved: '✓',
            rejected: '✗'
          }[existingApply.status] || '⏳';

          let stepClasses = ['', '', '', ''];
          if (existingApply.status === 'approved') {
            stepClasses = ['done', 'done', 'done', 'done'];
          } else if (existingApply.status === 'rejected') {
            stepClasses = ['done', 'done', 'done', ''];
          } else {
            stepClasses = ['done', 'done', 'active', ''];
          }

          modal.innerHTML = `
            <button class="apply-modal-close" onclick="closeApplyModal()">&times;</button>
            <h3>👩‍⚖️ 入驻申请状态</h3>
            <div class="modal-subtitle">查看您的专业人士入驻申请进度</div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
              <span class="status-badge ${statusClass}">${statusIcon} ${statusText}</span>
              <span style="font-size:12px;color:var(--color-text-muted);">申请时间：${new Date(existingApply.timestamp).toLocaleDateString()}</span>
            </div>
            <div class="review-steps" style="margin-bottom:20px;">
              <div class="review-step ${stepClasses[0]}">
                <div class="step-icon">1</div>
                <div class="step-label">提交申请</div>
              </div>
              <div class="review-step ${stepClasses[1]}">
                <div class="step-icon">2</div>
                <div class="step-label">资质审核</div>
              </div>
              <div class="review-step ${stepClasses[2]}">
                <div class="step-icon">3</div>
                <div class="step-label">面试评估</div>
              </div>
              <div class="review-step ${stepClasses[3]}">
                <div class="step-icon">4</div>
                <div class="step-label">入驻生效</div>
              </div>
            </div>
            ${existingApply.status === 'rejected' ? `<div style="font-size:13px;color:#A84E4E;margin-bottom:16px;padding:10px;background:#FCE8E8;border-radius:8px;"><strong>审核意见：</strong>${existingApply.reason || '未达到入驻标准，请完善资质后重新申请'}</div>` : ''}
            <button class="apply-btn secondary" onclick="clearApplyData();openApplyModal();">重新申请</button>
          `;
        } else {
          modal.innerHTML = `
            <button class="apply-modal-close" onclick="closeApplyModal()">&times;</button>
            <h3>👩‍⚖️ 专业人士入驻申请</h3>
            <div class="modal-subtitle">婚姻家事律师或心理咨询师均可申请入驻暖归平台</div>
            <label style="display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;margin-top:0;">申请类型</label>
            <select id="modal_ap_type" style="width:100%;padding:8px 10px;border:1px solid var(--color-border-default);border-radius:6px;font-size:13px;margin-bottom:12px;background:white;">
              <option value="lawyer">婚姻家事律师</option>
              <option value="counselor">心理咨询师</option>
            </select>
            <label style="display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">姓名</label>
            <input type="text" id="modal_ap_name" placeholder="请输入您的姓名" style="width:100%;padding:8px 10px;border:1px solid var(--color-border-default);border-radius:6px;font-size:13px;margin-bottom:12px;background:white;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
              <div><label style="display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">手机号码</label><input type="text" id="modal_ap_phone" placeholder="请输入手机号" style="width:100%;padding:8px 10px;border:1px solid var(--color-border-default);border-radius:6px;font-size:13px;background:white;"></div>
              <div><label style="display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">执业年限</label><input type="text" id="modal_ap_exp" placeholder="如：5年" style="width:100%;padding:8px 10px;border:1px solid var(--color-border-default);border-radius:6px;font-size:13px;background:white;"></div>
            </div>
            <label style="display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">执业证书编号</label>
            <input type="text" id="modal_ap_license" placeholder="律师执业证号/心理咨询师证书号" style="width:100%;padding:8px 10px;border:1px solid var(--color-border-default);border-radius:6px;font-size:13px;margin-bottom:12px;background:white;">
            <label style="display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">所属机构</label>
            <input type="text" id="modal_ap_org" placeholder="律所名称/心理咨询机构" style="width:100%;padding:8px 10px;border:1px solid var(--color-border-default);border-radius:6px;font-size:13px;margin-bottom:12px;background:white;">
            <label style="display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">专业特长</label>
            <textarea id="modal_ap_skills" placeholder="请简述您的专业领域和擅长处理的案件类型" style="width:100%;padding:8px 10px;border:1px solid var(--color-border-default);border-radius:6px;font-size:13px;margin-bottom:12px;min-height:60px;resize:vertical;background:white;"></textarea>
            <label style="display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">入驻动机</label>
            <textarea id="modal_ap_motivation" placeholder="请简述您希望加入暖归平台的原因" style="width:100%;padding:8px 10px;border:1px solid var(--color-border-default);border-radius:6px;font-size:13px;margin-bottom:16px;min-height:60px;resize:vertical;background:white;"></textarea>
            <button class="apply-btn" id="modalSubmitApplyBtn">提交申请</button>
            <div style="font-size:11px;color:var(--color-text-muted);text-align:center;margin-top:10px;">提交后将进入审核流程，审核结果将通过短信通知您</div>
          `;

          document.getElementById('modalSubmitApplyBtn').addEventListener('click', () => {
            const get = id => {
              const el = document.getElementById(id);
              return el ? el.value : '';
            };

            const name = get('modal_ap_name');
            const phone = get('modal_ap_phone');
            const license = get('modal_ap_license');

            if (!name || !phone || !license) {
              alert('请填写完整的基本信息（姓名、手机号、执业证书编号）');
              return;
            }

            const applyData = {
              type: get('modal_ap_type'),
              name: name,
              phone: phone,
              exp: get('modal_ap_exp'),
              license: license,
              org: get('modal_ap_org'),
              skills: get('modal_ap_skills'),
              motivation: get('modal_ap_motivation'),
              timestamp: Date.now(),
              status: Math.random() > 0.3 ? 'pending' : (Math.random() > 0.5 ? 'approved' : 'rejected'),
              reason: Math.random() > 0.5 ? '' : '证书编号无法验证，请联系客服核实'
            };

            try { localStorage.setItem('nuangui_professional_apply', JSON.stringify(applyData)); } catch (e) {}
            alert(`申请提交成功！您的申请已进入审核流程，我们将通过短信通知您审核结果。\\n\\n当前状态：${applyData.status === 'approved' ? '已通过' : applyData.status === 'rejected' ? '未通过' : '审核中'}`);
            openApplyModal();
          });
        }

        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      window.closeApplyModal = function() {
        const overlay = document.getElementById('applyModalOverlay');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      };

      document.getElementById('applyModalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'applyModalOverlay') {
          closeApplyModal();
        }
      });

      document.getElementById('headerApplyBtn').addEventListener('click', openApplyModal);

      // ========== 绑定事件 ==========
      document.querySelectorAll('.scene-tab').forEach(tab => {
        tab.addEventListener('click', () => switchScene(tab.dataset.scene));
      });

      sendBtn.addEventListener('click', sendMessage);
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
      });

      // 绑定导出完整咨询报告按钮
      const lawReportBtn = document.getElementById('lawReportBtn');
      if (lawReportBtn) {
        lawReportBtn.addEventListener('click', () => {
          if (lawConsultHistory.length === 0) {
            alert('暂无咨询记录，请先进行法律咨询后再导出报告。');
            return;
          }
          exportConsultReport(false);
        });
      }

      // ========== 婚姻金句轮播 ==========
      let currentQuoteIndex = 0;
      let quoteTimer = null;

      function startQuoteRotation() {
        if (quoteTimer) clearInterval(quoteTimer);
        const banner = document.getElementById('quoteBanner');
        const docBanner = document.getElementById('docQuoteBanner');

        // 随机选第一条
        currentQuoteIndex = Math.floor(Math.random() * MARRIAGE_QUOTES.length);
        updateQuote(banner);
        updateQuote(docBanner);

        quoteTimer = setInterval(() => {
          currentQuoteIndex = (currentQuoteIndex + 1) % MARRIAGE_QUOTES.length;
          updateQuote(banner);
          updateQuote(docBanner);
        }, 15000);
      }

      function updateQuote(el) {
        if (!el) return;
        el.style.animation = 'none';
        el.offsetHeight;
        el.textContent = MARRIAGE_QUOTES[currentQuoteIndex];
        el.style.animation = '';
      }

      // ========== 获取带时段的欢迎语 ==========
      function getSceneWelcome(sceneKey) {
        const scene = SCENES[sceneKey];
        const greeting = getTimeGreeting();
        const suffix = getTimeSuffix();
        const base = scene.welcome.replace(/^(你好，|您好，)/, '');
        return `${greeting}${suffix}。\n\n${base}`;
      }

      // ========== 温柔提醒（法律咨询场景低概率出现） ==========
      function maybeAppendWarmReminder(text) {
        if (currentScene !== 'law') return text;
        if (Math.random() > 0.15) return text;
        const reminder = WARM_REMINDERS[Math.floor(Math.random() * WARM_REMINDERS.length)];
        return text + `\n\n<span style="color:var(--color-text-muted);font-size:12px;">💛 ${reminder}</span>`;
      }

      // ========== 柔化加载文案 ==========
      function getWarmTypingText() {
        const options = [
          '正在为您梳理情况...',
          '正在翻阅相关资料...',
          '正在认真思考中...',
          '稍等一下，正在整理...',
          '别急，正在为您解答...',
        ];
        return options[Math.floor(Math.random() * options.length)];
      }

      // ========== 情绪识别表情 ==========
      const EMOTION_MAP = {
        '难过': '🥺', '伤心': '🥺', '哭': '🥺', '痛苦': '🥺',
        '生气': '😤', '愤怒': '😤', '气死': '😤',
        '焦虑': '😰', '担心': '😰', '紧张': '😰', '害怕': '😰',
        '累': '😔', '疲惫': '😔', '撑不住': '😔',
        '开心': '😊', '高兴': '😊', '谢谢': '😊',
        '孤独': '🥺', '一个人': '🥺',
        '绝望': '💔', '想放弃': '💔',
      };

      function detectEmotion(text) {
        const lower = text.toLowerCase();
        for (const [keyword, emoji] of Object.entries(EMOTION_MAP)) {
          if (lower.includes(keyword)) return emoji;
        }
        return null;
      }

      function showEmotionOnAvatar(emoji) {
        if (!emoji) return;
        const avatar = document.getElementById('chatAvatar');
        if (!avatar) return;
        // 移除旧的
        const oldReaction = avatar.querySelector('.emotion-reaction');
        if (oldReaction) oldReaction.remove();
        // 添加新的
        const reaction = document.createElement('span');
        reaction.className = 'emotion-reaction';
        reaction.textContent = emoji;
        avatar.appendChild(reaction);
        // 3秒后消失
        setTimeout(() => reaction.remove(), 3000);
      }

      // ========== 已读回执 ==========
      function showReadReceipt(userMsgDiv) {
        const receipt = document.createElement('div');
        receipt.className = 'read-receipt';
        receipt.textContent = '✓ 暖归已读';
        userMsgDiv.after(receipt);
        setTimeout(() => receipt.remove(), 2000);
      }

      // ========== 用户成就系统 ==========
      function getUserUsageCount() {
        try {
          return parseInt(localStorage.getItem('nuangui_usage_count') || '0');
        } catch (e) { return 0; }
      }

      function incrementUsageCount() {
        const count = getUserUsageCount() + 1;
        try { localStorage.setItem('nuangui_usage_count', count.toString()); } catch (e) {}
        checkAndShowAchievement(count);
        return count;
      }

      const ACHIEVEMENTS = [
        { count: 1, icon: '🌱', title: '迈出第一步', desc: '你已经开始使用暖归了' },
        { count: 3, icon: '🌟', title: '探索者', desc: '你已经使用暖归3次了' },
        { count: 5, icon: '💪', title: '信任者', desc: '感谢你的信任，我们会继续努力' },
        { count: 10, icon: '🏆', title: '忠实用户', desc: '你已经是暖归的老朋友了' },
      ];

      let shownAchievements = new Set();
      try {
        shownAchievements = new Set(JSON.parse(localStorage.getItem('nuangui_shown_achievements') || '[]'));
      } catch (e) {}

      function checkAndShowAchievement(count) {
        for (const ach of ACHIEVEMENTS) {
          if (count >= ach.count && !shownAchievements.has(ach.count)) {
            showAchievement(ach);
            shownAchievements.add(ach.count);
            try { localStorage.setItem('nuangui_shown_achievements', JSON.stringify([...shownAchievements])); } catch (e) {}
            break;
          }
        }
      }

      function showAchievement(ach) {
        const div = document.createElement('div');
        div.className = 'user-achievement';
        div.innerHTML = `
          <span class="achievement-close" onclick="this.parentElement.remove()">×</span>
          <span class="achievement-icon">${ach.icon}</span>
          <strong>${ach.title}</strong><br>
          <span style="font-size:12px;">${ach.desc}</span>
        `;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 5000);
      }

      // ========== 初始化 ==========
      bindDocDropdown();
      startQuoteRotation();

      const initReportBar = document.getElementById('lawReportBar');
      if (initReportBar) {
        initReportBar.style.display = (currentScene === 'law') ? 'block' : 'none';
      }

      const initConfig = SCENES[currentScene];
      sceneTitleEl.textContent = initConfig.title;
      chatTitleEl.textContent = initConfig.chatTitle;
      chatSubtitleEl.textContent = initConfig.chatSubtitle;
      inputEl.placeholder = initConfig.placeholder;

      if (currentScene === 'therapy') {
        startRoom();
      } else if (currentScene !== 'document') {
        addMessage('bot', getSceneWelcome(currentScene));
      }

      renderSidePanel();
      updateLawReportButton();
      inputEl.focus();
    })();
  </script>
</body>
</html>
