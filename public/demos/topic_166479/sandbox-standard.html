<script>
// ═══════════════════════════════════════════
//  标准沙盘 — 72×57×7cm
//  沙面 24×18 格，每格 3cm×3.167cm
//  沙单位 3×3（8×6=48 个完整）
//  墙体 1格厚，外侧木色/内侧天蓝，沙面 4cm
// ═══════════════════════════════════════════

(function() {
  const SAND_COLS = 24;       // 沙面列数
  const SAND_ROWS = 18;       // 沙面行数
  const WALL_CELLS = 1;       // 墙体厚度（格）
  const SAND_CM = 4;          // 沙面高度 cm
  const WALL_H_CM = 7;        // 墙总高 cm
  const UNIT_SIZE = 3;        // 沙单位 3×3 (8×6=48 个)

  // 俯视 — 单元格尺寸（矩形：3cm×3.167cm → 18:19 像素，精确匹配 72:57）
  const TOP_CW = 18;          // 沙格宽（3cm）
  const TOP_CH = 19;          // 沙格高（3.167cm）
  const TOP_BORDER = 6;       // 俯视边框厚度（6px）

  // 轴测 — tile 2:1 宽高比，产生倾斜视角（顶面不正对用户）
  const ISO_TW = 24;          // tile 半宽
  const ISO_TH = 12;          // tile 半高
  const ISO_WALL_H = 35;      // 墙总像素高（保留未用）
  const ISO_SAND_GAP = Math.round(ISO_WALL_H * (WALL_H_CM - SAND_CM) / WALL_H_CM); // 沙面以上墙体像素（15px）
  const PX_PER_CM = Math.round(ISO_WALL_H / WALL_H_CM);     // 5px/cm
  const UNIT_COLS = Math.floor(SAND_COLS / UNIT_SIZE);       // 8 列
  const UNIT_ROWS = Math.floor(SAND_ROWS / UNIT_SIZE);       // 6 行

  // 沙高度数据：每个单位 0/2/4/6 cm
  // 初始状态：标准正态分布，平均高度 4cm，相邻高度差 ≤ 2
  const sandHeights = [];

  // ═══ 沙具放置系统 ═══
  // 每个沙具：{ type, col, row, label }  — col/row 为单元格坐标(0-23, 0-17)
  // 宇航员尺寸：1.6×1.6×5.5cm → 8×8×28px
  const placedToys = [
    { type: 'astronaut', col: 12.5, row: 9.5, label: '宇航员' },
    { type: 'cow', col: 4.5, row: 4.5, label: '牛' },
    { type: 'cactus', col: 8.5, row: 13.5, label: '仙人掌' }
  ];

  // 伪随机数生成器（mulberry32，可复现）
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function generateInitialHeights() {
    const seed = Date.now();
    const rand = mulberry32(seed);

    // Box-Muller 变换生成标准正态分布 N(0,1)
    function normalRand() {
      let u1, u2;
      do { u1 = rand(); } while (u1 === 0);
      u2 = rand();
      return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    }

    // 清空旧数据
    for (let uc = 0; uc < UNIT_COLS; uc++) {
      sandHeights[uc] = [];
      for (let ur = 0; ur < UNIT_ROWS; ur++) {
        sandHeights[uc][ur] = 0;
      }
    }

    // ── 第一步：正态分布随机赋值 ──
    // 阈值设计：P(0)≈4%, P(2)≈21%, P(4)≈46%, P(6)≈29% → 期望均值 ≈ 4.0
    // z < -1.75 → 0, -1.75 ≤ z < -0.52 → 2, -0.52 ≤ z < 0.52 → 4, z ≥ 0.52 → 6
    for (let uc = 0; uc < UNIT_COLS; uc++) {
      for (let ur = 0; ur < UNIT_ROWS; ur++) {
        let z = normalRand();
        let h;
        if (z < -1.75) h = 0;
        else if (z < -0.52) h = 2;
        else if (z < 0.52) h = 4;
        else h = 6;
        sandHeights[uc][ur] = h;
      }
    }

    // ── 第二步：松弛迭代修复相邻高度差 > 2 的违规 ──
    for (let iter = 0; iter < 50; iter++) {
      let violations = 0;
      for (let uc = 0; uc < UNIT_COLS; uc++) {
        for (let ur = 0; ur < UNIT_ROWS; ur++) {
          let h = sandHeights[uc][ur];
          let neighbors = [];
          if (uc > 0) neighbors.push({uc: uc - 1, ur});
          if (uc < UNIT_COLS - 1) neighbors.push({uc: uc + 1, ur});
          if (ur > 0) neighbors.push({uc, ur: ur - 1});
          if (ur < UNIT_ROWS - 1) neighbors.push({uc, ur: ur + 1});

          for (let n of neighbors) {
            let nh = sandHeights[n.uc][n.ur];
            if (Math.abs(h - nh) > 2) {
              // 将两者拉向中点并取最近的偶数
              let mid = (h + nh) / 2;
              let newH = Math.round(mid / 2) * 2;
              newH = Math.max(0, Math.min(6, newH));
              sandHeights[uc][ur] = newH;
              violations++;
              break;
            }
          }
        }
      }
      if (violations === 0) break;
    }

    // ── 第三步：调整总高度使平均值精确为 4cm（总高度 = 192）──
    let total = 0;
    for (let uc = 0; uc < UNIT_COLS; uc++)
      for (let ur = 0; ur < UNIT_ROWS; ur++)
        total += sandHeights[uc][ur];

    let target = UNIT_COLS * UNIT_ROWS * 4; // 192
    let diff = target - total;

    while (diff !== 0) {
      let delta = diff > 0 ? 2 : -2;
      let candidates = [];
      for (let uc = 0; uc < UNIT_COLS; uc++) {
        for (let ur = 0; ur < UNIT_ROWS; ur++) {
          let h = sandHeights[uc][ur];
          let nh = h + delta;
          if (nh < 0 || nh > 6) continue;
          // 检查调整后是否违反相邻约束
          let ok = true;
          if (uc > 0 && Math.abs(nh - sandHeights[uc - 1][ur]) > 2) ok = false;
          if (uc < UNIT_COLS - 1 && Math.abs(nh - sandHeights[uc + 1][ur]) > 2) ok = false;
          if (ur > 0 && Math.abs(nh - sandHeights[uc][ur - 1]) > 2) ok = false;
          if (ur < UNIT_ROWS - 1 && Math.abs(nh - sandHeights[uc][ur + 1]) > 2) ok = false;
          if (ok) candidates.push({uc, ur});
        }
      }
      if (candidates.length === 0) break;
      let pick = candidates[Math.floor(rand() * candidates.length)];
      sandHeights[pick.uc][pick.ur] += delta;
      diff -= delta;
    }

    // 输出统计信息
    let counts = {0: 0, 2: 0, 4: 0, 6: 0};
    let finalTotal = 0;
    for (let uc = 0; uc < UNIT_COLS; uc++) {
      for (let ur = 0; ur < UNIT_ROWS; ur++) {
        let h = sandHeights[uc][ur];
        counts[h]++;
        finalTotal += h;
      }
    }
    console.log(
      '🏜️ 沙初始状态 — 分布:', counts,
      '| 平均:', (finalTotal / (UNIT_COLS * UNIT_ROWS)).toFixed(2), 'cm',
      '| 总高度:', finalTotal
    );
  }

  // ═══════════════════════════════════════════
  //  沙物理滑落逻辑
  //  当沙单位和相邻沙单位高度差 > 2 时，从最高相邻单位取 2cm 沙
  //  迭代直到所有相邻高度差 ≤ 2，实现沙的滑落效果
  // ═══════════════════════════════════════════
  function applySandSliding() {
    let changed = true;
    let maxIterations = UNIT_COLS * UNIT_ROWS * 2; // 防止无限循环
    let slideCount = 0;

    while (changed && maxIterations-- > 0) {
      changed = false;
      for (let uc = 0; uc < UNIT_COLS; uc++) {
        for (let ur = 0; ur < UNIT_ROWS; ur++) {
          let h = sandHeights[uc][ur];

          // 收集所有相邻单位
          let neighbors = [];
          if (uc > 0) neighbors.push({uc: uc - 1, ur, h: sandHeights[uc - 1][ur]});
          if (uc < UNIT_COLS - 1) neighbors.push({uc: uc + 1, ur, h: sandHeights[uc + 1][ur]});
          if (ur > 0) neighbors.push({uc, ur: ur - 1, h: sandHeights[uc][ur - 1]});
          if (ur < UNIT_ROWS - 1) neighbors.push({uc, ur: ur + 1, h: sandHeights[uc][ur + 1]});

          // 找到高度差 > 2 的最高相邻单位
          let highest = null;
          for (let n of neighbors) {
            if (n.h > h + 2 && (!highest || n.h > highest.h)) {
              highest = n;
            }
          }

          if (highest) {
            // 从最高相邻单位取 2cm 沙滑落到当前单位
            sandHeights[highest.uc][highest.ur] -= 2;
            sandHeights[uc][ur] += 2;
            changed = true;
            slideCount++;
          }
        }
      }
    }

    if (slideCount > 0) {
      console.log('🏔️ 沙滑落完成 — 滑动次数:', slideCount);
    }
  }

  // ═══════════════════════════════════════════
  //  宇航员沙具渲染（1.6×1.6×5.5cm → 8×8×28px）
  //  像素风轴测图：垂直站立在沙单位顶面中心
  // ═══════════════════════════════════════════
  function renderAstronaut(col, row, isHovered, isDragging) {
    let uc = Math.floor(col / UNIT_SIZE);
    let ur = Math.floor(row / UNIT_SIZE);
    let hCm = sandHeights[uc][ur];

    let s = isoSize();
    let hw = ISO_TW / 2; let hh = ISO_TH / 2;
    let cx = Math.round((s.w - (SAND_COLS - SAND_ROWS) * hw) / 2);
    let cy = Math.round((s.h - (SAND_COLS + SAND_ROWS) * hh + ISO_OUTER_H) / 2 - ISO_H) + 14 + ISO_VERTICAL_SHIFT;
    let zTop = Math.round(hCm * PX_PER_CM);

    const SHD = '#969696';

      pxR(ox+2, oy+1, 4, 1, W);
      pxR(ox+1, oy+2, 2, 1, W);
      pxR(ox+3, oy+2, 2, 1, D);
      pxR(ox+5, oy+2, 2, 1, W);
      pxR(ox+1, oy+3, 1, 1, W);
      pxR(ox+2, oy+3, 4, 1, D);
      pxR(ox+6, oy+3, 1, 1, W);
      pxR(ox+1, oy+4, 1, 1, W);
      pxR(ox+2, oy+4, 4, 1, D);
      pxR(ox+6, oy+4, 1, 1, W);
      pxR(ox+1, oy+5, 1, 1, W);
      pxR(ox+2, oy+5, 4, 1, D);
      pxR(ox+6, oy+5, 1, 1, W);

    pxR(x+28, y+7, 2, 1, HRN);
    pxR(x+3, y+8, 6, 1, B);
    pxR(x+9, y+8, 11, 1, W);
    pxR(x+20, y+8, 2, 1, B);
    pxR(x+22, y+8, 3, 1, W);
    pxR(x+25, y+8, 1, 1, B2);
    pxR(x+26, y+8, 3, 1, W);
    pxR(x+3, y+9, 6, 1, B);
    pxR(x+9, y+9, 10, 1, W);
    pxR(x+19, y+9, 3, 1, B);
    pxR(x+22, y+9, 7, 1, W);
    pxR(x+3, y+10, 3, 1, B);
    pxR(x+6, y+10, 13, 1, W);
    pxR(x+19, y+10, 4, 1, B);
    pxR(x+23, y+10, 5, 1, W);
    pxR(x+3, y+11, 4, 1, B);
    pxR(x+7, y+11, 11, 1, W);
    pxR(x+18, y+11, 10, 1, B);
    pxR(x+5, y+12, 3, 1, B);
    pxR(x+8, y+12, 9, 1, W);
    pxR(x+17, y+12, 10, 1, B);

    ctx.fillStyle = isDragging ? 'rgba(0,0,0,0.08)' : 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(ax, ay + 8, 15, 4, 0, 0, Math.PI * 2); ctx.fill();
    if (isDragging) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x, y, FW, FH); }
    if (isHovered && !isDragging) { ctx.strokeStyle = 'rgba(226,176,74,0.7)'; ctx.lineWidth = 1; ctx.strokeRect(x - 1, y - 1, FW + 2, FH + 2); }
  }

  // 首次调用
  generateInitialHeights();

  const PIXEL_SCALE = 2;
  const canvas = document.getElementById('sandbox');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  let currentView = 'isometric';
  let rotated = false;
  let groomingMode = false;   // 理沙模式：true=可挖沙(沙锁定), false=可移沙具(沙锁定)
  let dragSource = null;      // 拖拽源 {uc, ur}，null 表示未拖拽（理沙模式）
  let dragToy = null;         // 拖拽中的沙具 {toy, origUc, origUr}（非理沙模式）
  let hoverUnit = null;       // 悬停单位 {uc, ur}，null 表示未悬停
  let hoverToy = null;        // 悬停的沙具索引，null 表示未悬停

  // 获取沙单位的有效高度（考虑拖拽预览）
  function effH(uc, ur) {
    let h = sandHeights[uc][ur];
    if (dragSource && dragSource.uc === uc && dragSource.ur === ur) h -= 2;
    return h;
  }

  // 命中检测：返回点击的沙单位坐标，或 null
  function hitTestUnit(px, py) {
    let s = isoSize();
    let hw = ISO_TW / 2;
    let hh = ISO_TH / 2;
    let cx = Math.round((s.w - (SAND_COLS - SAND_ROWS) * hw) / 2);
    let cy = Math.round((s.h - (SAND_COLS + SAND_ROWS) * hh + ISO_OUTER_H) / 2 - ISO_H) + 14 + ISO_VERTICAL_SHIFT;

    function sv(col, row, z) {
      let x = cx + (col - row) * hw;
      let y = cy + (col + row) * hh - z;
      return { x: Math.round(x), y: Math.round(y) };
    }

    // 从前往后检测
    for (let sum = (UNIT_COLS - 1) + (UNIT_ROWS - 1); sum >= 0; sum--) {
      for (let uc = UNIT_COLS - 1; uc >= 0; uc--) {
        let ur = sum - uc;
        if (ur < 0 || ur >= UNIT_ROWS) continue;

        let hCm = effH(uc, ur);
        let zTop = Math.round(hCm * PX_PER_CM);
        let sc = uc * UNIT_SIZE;
        let sr = ur * UNIT_SIZE;
        let ec = sc + UNIT_SIZE;
        let er = sr + UNIT_SIZE;

        let t1 = sv(sc, sr, zTop);
        let t2 = sv(ec, sr, zTop);
        let t4 = sv(sc, er, zTop);

        let vx = t2.x - t1.x, vy = t2.y - t1.y;
        let wx = t4.x - t1.x, wy = t4.y - t1.y;
        let dx = px - t1.x, dy = py - t1.y;
        let det = vx * wy - vy * wx;
        if (Math.abs(det) < 0.01) continue;
        let a = (dx * wy - dy * wx) / det;
        let b = (vx * dy - vy * dx) / det;

        if (a >= 0 && a <= 1 && b >= 0 && b <= 1) {
          return { uc, ur };
        }
      }
    }
    return null;
  }

  // 沙具命中检测：返回被点击的沙具在 placedToys 中的索引，或 -1
  function hitTestToy(px, py) {
    for (let i = placedToys.length - 1; i >= 0; i--) {
      let toy = placedToys[i];
      if (toy.type !== 'astronaut' && toy.type !== 'cow' && toy.type !== 'cactus') continue;
      let uc = Math.floor(toy.col / UNIT_SIZE);
      let ur = Math.floor(toy.row / UNIT_SIZE);
      let hCm = sandHeights[uc][ur];

      let s = isoSize();
      let hw = ISO_TW / 2;
      let hh = ISO_TH / 2;
      let cx = Math.round((s.w - (SAND_COLS - SAND_ROWS) * hw) / 2);
      let cy = Math.round((s.h - (SAND_COLS + SAND_ROWS) * hh + ISO_OUTER_H) / 2 - ISO_H) + 14 + ISO_VERTICAL_SHIFT;

      let zTop = Math.round(hCm * PX_PER_CM);
      let bx = Math.round(cx + (toy.col - toy.row) * hw);
      let by = Math.round(cy + (toy.col + toy.row) * hh - zTop);

      let tx, ty, tw, th;
      if (toy.type === 'cow') {
        tx = bx - 15; ty = by - 22; tw = 30; th = 22;
      } else if (toy.type === 'cactus') {
        tx = bx - 5; ty = by - 20; tw = 10; th = 20;
      } else {
        tx = bx - 5; ty = by - 30; tw = 11; th = 32;
      }
      if (px >= tx && px <= tx + tw && py >= ty && py <= ty + th) return i;
    }
    return -1;
  }

  // ═══════════════════════════════════════════
  //  俯视沙具命中检测
  // ═══════════════════════════════════════════
  function hitTestToyTopDown(px, py) {
    let fs = topDownFixedSize();
    let s = topDownSize();
    let ls = getLogicalSize();
    let B = TOP_BORDER;

    let maxContentW = Math.max(fs.normalW, fs.rotatedW);
    let maxContentH = Math.max(fs.normalH, fs.rotatedH);
    let scale = Math.min(fs.w / maxContentW, fs.h / maxContentH);
    let offsetX = (fs.w - s.w * scale) / 2;
    let offsetY = (fs.h - s.h * scale) / 2;

    let lx = (px - offsetX) / scale;
    let ly = (py - offsetY) / scale;

    let lc = Math.floor((lx - B) / ls.cw);
    let lr = Math.floor((ly - B) / ls.ch);
    if (lc < 0 || lc >= ls.cols || lr < 0 || lr >= ls.rows) return -1;

    let col, row;
    if (rotated) {
      col = lr;
      row = SAND_ROWS - 1 - lc;
    } else {
      col = lc;
      row = lr;
    }

    for (let i = placedToys.length - 1; i >= 0; i--) {
      let toy = placedToys[i];
      if (toy.type !== 'astronaut' && toy.type !== 'cow' && toy.type !== 'cactus') continue;
      if (Math.floor(toy.col) === col && Math.floor(toy.row) === row) return i;
    }
    return -1;
  }

  // 俯视单元格中心命中检测：返回 {col, row} 或 null
  function hitTestCellTopDown(px, py) {
    let fs = topDownFixedSize();
    let s = topDownSize();
    let ls = getLogicalSize();
    let B = TOP_BORDER;

    let maxContentW = Math.max(fs.normalW, fs.rotatedW);
    let maxContentH = Math.max(fs.normalH, fs.rotatedH);
    let scale = Math.min(fs.w / maxContentW, fs.h / maxContentH);
    let offsetX = (fs.w - s.w * scale) / 2;
    let offsetY = (fs.h - s.h * scale) / 2;

    let lx = (px - offsetX) / scale;
    let ly = (py - offsetY) / scale;

    let lc = Math.floor((lx - B) / ls.cw);
    let lr = Math.floor((ly - B) / ls.ch);
    if (lc < 0 || lc >= ls.cols || lr < 0 || lr >= ls.rows) return null;

    let col, row;
    if (rotated) {
      col = lr;
      row = SAND_ROWS - 1 - lc;
    } else {
      col = lc;
      row = lr;
    }
    return { col: col + 0.5, row: row + 0.5 };
  }

  // 单元格命中检测（24×18格）：返回 {col, row} 或 null
  // 用于沙具模式下的精确放置
  function hitTestCell(px, py) {
    let s = isoSize();
    let hw = ISO_TW / 2;
    let hh = ISO_TH / 2;
    let cx = Math.round((s.w - (SAND_COLS - SAND_ROWS) * hw) / 2);
    let cy = Math.round((s.h - (SAND_COLS + SAND_ROWS) * hh + ISO_OUTER_H) / 2 - ISO_H) + 14 + ISO_VERTICAL_SHIFT;

    function sv(col, row, z) {
      let x = cx + (col - row) * hw;
      let y = cy + (col + row) * hh - z;
      return { x: Math.round(x), y: Math.round(y) };
    }

    // 从前往后检测每个单元格
    for (let sum = (SAND_COLS - 1) + (SAND_ROWS - 1); sum >= 0; sum--) {
      for (let col = SAND_COLS - 1; col >= 0; col--) {
        let row = sum - col;
        if (row < 0 || row >= SAND_ROWS) continue;

        let uc = Math.floor(col / UNIT_SIZE);
        let ur = Math.floor(row / UNIT_SIZE);
        let hCm = sandHeights[uc][ur];
        let zTop = Math.round(hCm * PX_PER_CM);

        let t1 = sv(col, row, zTop);
        let t2 = sv(col + 1, row, zTop);
        let t4 = sv(col, row + 1, zTop);

        let vx = t2.x - t1.x, vy = t2.y - t1.y;
        let wx = t4.x - t1.x, wy = t4.y - t1.y;
        let dx = px - t1.x, dy = py - t1.y;
        let det = vx * wy - vy * wx;
        if (Math.abs(det) < 0.01) continue;
        let a = (dx * wy - dy * wx) / det;
        let b = (vx * dy - vy * dx) / det;

        if (a >= 0 && a <= 1 && b >= 0 && b <= 1) {
          return { col: col + 0.5, row: row + 0.5 };
        }
      }
    }
    return null;
  }

  // 俯视命中检测：返回点击的沙单位坐标，或 null
  function hitTestUnitTopDown(px, py) {
    let fs = topDownFixedSize();
    let s = topDownSize();
    let ls = getLogicalSize();
    let B = TOP_BORDER;

    let maxContentW = Math.max(fs.normalW, fs.rotatedW);
    let maxContentH = Math.max(fs.normalH, fs.rotatedH);
    let scale = Math.min(fs.w / maxContentW, fs.h / maxContentH);
    let offsetX = (fs.w - s.w * scale) / 2;
    let offsetY = (fs.h - s.h * scale) / 2;

    let lx = (px - offsetX) / scale;
    let ly = (py - offsetY) / scale;

    let lu = Math.floor((lx - B) / (UNIT_SIZE * ls.cw));
    let lr = Math.floor((ly - B) / (UNIT_SIZE * ls.ch));

    let logicalUnitCols = rotated ? UNIT_ROWS : UNIT_COLS;
    let logicalUnitRows = rotated ? UNIT_COLS : UNIT_ROWS;

    if (lu < 0 || lu >= logicalUnitCols || lr < 0 || lr >= logicalUnitRows) return null;

    let uc, ur;
    if (rotated) {
      uc = lr;
      ur = UNIT_ROWS - 1 - lu;
    } else {
      uc = lu;
      ur = lr;
    }
    return { uc, ur };
  }

  // ===== 颜色 =====
  const C = {
    bg:           '#1a1a2e',
    woodOuter:    '#6b4226',
    woodOuterDk:  '#5a3218',
    woodTop:      '#8b6b4a',
    woodTopLt:    '#9b7b5a',
    skyBlue:      '#7bb8d0',
    skyBlueDk:    '#6aa8c0',
    sandA:        '#d4b060',
    sandB:        '#c4a050',
    sandC:        '#d0ac58',
    sandD:        '#c8a454',
    accent:       '#e2b04a',
    unitLine:     'rgba(0,0,0,0.30)',
    cellLine:     'rgba(0,0,0,0.10)',
  };

  // 俯视高度黑色叠加：0→蓝底, 2→深罩, 4→浅罩, 6→无罩
  const HEIGHT_OVERLAY = {
    0: '#4a8090',  // 蓝色容器底（无沙）
    2: 'rgba(0,0,0,0.35)',
    4: 'rgba(0,0,0,0.08)',
    6: null,
  };

  // ===== 工具 =====
  function darken(hex, f) {
    let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    r = Math.floor(r*(1-f)); g = Math.floor(g*(1-f)); b = Math.floor(b*(1-f));
    return '#'+[r,g,b].map(v=>Math.max(0,v).toString(16).padStart(2,'0')).join('');
  }
  function pxR(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

  // 沙粒纹理
  function grain(x, y, w, h, base) {
    let s = (x*31 + y*17) % 100;
    for (let dy=0; dy<h; dy++) for (let dx=0; dx<w; dx++) {
      let r = ((s+dx*13+dy*7)%100)/100;
      if (r<0.08) pxR(x+dx,y+dy,1,1,darken(base,0.18));
      else if (r<0.14) pxR(x+dx,y+dy,1,1,darken(base,-0.10));
      else pxR(x+dx,y+dy,1,1,base);
    }
  }

  // 旋转坐标变换
  function getLogicalSize() {
    return rotated ? { cols: SAND_ROWS, rows: SAND_COLS, cw: TOP_CH, ch: TOP_CW }
                   : { cols: SAND_COLS, rows: SAND_ROWS, cw: TOP_CW, ch: TOP_CH };
  }

  // ===== Canvas 尺寸 =====
  // 固定画布尺寸（取旋转前后的最大值）
  function topDownFixedSize() {
    let pad = TOP_BORDER;
    // 正常状态：24×18，单元格 18×19
    let normalW = SAND_COLS * TOP_CW + pad * 2;
    let normalH = SAND_ROWS * TOP_CH + pad * 2;
    // 旋转状态：18×24，单元格 19×18（宽高交换）
    let rotatedW = SAND_ROWS * TOP_CH + pad * 2;
    let rotatedH = SAND_COLS * TOP_CW + pad * 2;
    return {
      w: Math.max(normalW, rotatedW),
      h: Math.max(normalH, rotatedH),
      normalW, normalH, rotatedW, rotatedH
    };
  }

  function topDownSize() {
    let ls = getLogicalSize();
    let pad = TOP_BORDER;
    return {
      w: ls.cols * ls.cw + pad * 2,
      h: ls.rows * ls.ch + pad * 2,
      pad: pad
    };
  }

  const ISO_H = 24;          // 4cm 沙色长方体高度像素
  const ISO_OUTER_H = 42;    // 7cm 外墙高度像素
  const ISO_VERTICAL_SHIFT = 21; // 轴测视角整体下移，使沙盘下方角点与铲子图标最低点齐平

  function isoSize() {
    let dW = (SAND_COLS + SAND_ROWS) * ISO_TW / 2;
    let dH = (SAND_COLS + SAND_ROWS) * ISO_TH / 2;
    return {
      w: Math.ceil(dW + ISO_TW * 4),
      h: Math.ceil(dH + ISO_OUTER_H + ISO_TH * 4 + 20),
      dW, dH
    };
  }

  function displayScale() {
    let maxW = window.innerWidth - 100;
    let s = currentView === 'topdown' ? topDownSize() : isoSize();
    return Math.max(1.0, Math.min(PIXEL_SCALE, Math.floor(maxW/s.w*10)/10));
  }

  function resize() {
    if (currentView === 'topdown') {
      // 俯视使用固定画布尺寸
      let fs = topDownFixedSize();
      let sc = displayScale();
      canvas.width = fs.w; canvas.height = fs.h;
      canvas.style.width = Math.round(fs.w*sc) + 'px';
      canvas.style.height = Math.round(fs.h*sc) + 'px';
    } else {
      let s = isoSize();
      let sc = displayScale();
      canvas.width = s.w; canvas.height = s.h;
      canvas.style.width = Math.round(s.w*sc) + 'px';
      canvas.style.height = Math.round(s.h*sc) + 'px';
    }
  }

  // ═══════════════ 俯视视图 ═══════════════
  // 木质纹理边框（俯视用）
  function drawWoodBorder(x, y, w, h, isHorizontal) {
    pxR(x, y, w, h, C.woodOuter);
    let grainColors = [
      C.woodOuter,
      darken(C.woodOuter, 0.06),
      darken(C.woodOuter, -0.05),
      darken(C.woodOuter, 0.10),
      C.woodOuter,
      darken(C.woodOuter, -0.07),
      darken(C.woodOuter, 0.08),
    ];
    if (isHorizontal) {
      for (let gy = y + 1; gy < y + h - 1; gy += 2) {
        pxR(x, gy, w, 1, grainColors[Math.floor((gy - y) / 2) % grainColors.length]);
      }
    } else {
      for (let gx = x + 1; gx < x + w - 1; gx += 2) {
        pxR(gx, y, 1, h, grainColors[Math.floor((gx - x) / 2) % grainColors.length]);
      }
    }
  }

  function renderTopDown() {
    let fs = topDownFixedSize();  // 固定画布尺寸
    let s = topDownSize();        // 内容尺寸
    let ls = getLogicalSize();
    let B = TOP_BORDER;

    // 固定缩放：基于旋转前后最大内容尺寸，确保转动前后沙盘显示大小一致
    let maxContentW = Math.max(fs.normalW, fs.rotatedW);
    let maxContentH = Math.max(fs.normalH, fs.rotatedH);
    let scale = Math.min(fs.w / maxContentW, fs.h / maxContentH);

    // 计算居中偏移
    let offsetX = Math.round((fs.w - s.w * scale) / 2);
    let offsetY = Math.round((fs.h - s.h * scale) / 2);

    // 背景
    pxR(0, 0, fs.w, fs.h, C.bg);

    // 应用缩放和偏移
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);

    // 沙面区域起止（在缩放后的坐标系中）
    let sandX = B;
    let sandY = B;
    let sandW = ls.cols * ls.cw;
    let sandH = ls.rows * ls.ch;

    // ═══ 深木色边框（木质纹理）═══
    drawWoodBorder(0, 0, s.w, B, true);
    drawWoodBorder(0, s.h - B, s.w, B, true);
    drawWoodBorder(0, B, B, s.h - 2*B, false);
    drawWoodBorder(s.w - B, B, B, s.h - 2*B, false);

    // ═══ 沙面（先铺满原始棋盘格纹理，再按高度罩黑色）═══
    let ssX = B;
    let ssY = B;

    for (let c = 0; c < ls.cols; c++) {
      for (let r = 0; r < ls.rows; r++) {
        let cx = ssX + c * ls.cw;
        let cy = ssY + r * ls.ch;
        let color = ((c+r)%2===0) ? C.sandA : C.sandB;
        grain(cx, cy, ls.cw, ls.ch, color);
      }
    }

    // 高度叠加层
    let logicalUnitCols = rotated ? UNIT_ROWS : UNIT_COLS;
    let logicalUnitRows = rotated ? UNIT_COLS : UNIT_ROWS;

    for (let lu = 0; lu < logicalUnitCols; lu++) {
      for (let lr = 0; lr < logicalUnitRows; lr++) {
        let h;
        if (rotated) {
          h = effH(lr, UNIT_ROWS - 1 - lu);
        } else {
          h = effH(lu, lr);
        }
        let overlay = HEIGHT_OVERLAY[h];
        let ux = ssX + lu * UNIT_SIZE * ls.cw;
        let uy = ssY + lr * UNIT_SIZE * ls.ch;
        let uw = UNIT_SIZE * ls.cw;
        let uh = UNIT_SIZE * ls.ch;
        if (h === 0) {
          // 蓝色容器底，覆盖沙纹理
          pxR(ux, uy, uw, uh, overlay);
        } else if (overlay) {
          // 黑色半透明罩层
          pxR(ux, uy, uw, uh, overlay);
        }
      }
    }

    // ═══ 单元格细线 ═══
    for (let c = 0; c <= ls.cols; c++) {
      let x = ssX + c * ls.cw;
      pxR(x, ssY, 1, ls.rows * ls.ch, C.cellLine);
    }
    for (let r = 0; r <= ls.rows; r++) {
      let y = ssY + r * ls.ch;
      pxR(ssX, y, ls.cols * ls.cw, 1, C.cellLine);
    }

    // ═══ 沙单位粗线（3×3） ═══
    let uc = Math.floor(ls.cols / UNIT_SIZE);  // 8
    let ur = Math.floor(ls.rows / UNIT_SIZE);  // 6
    for (let i = 0; i <= uc; i++) {
      let x = ssX + i * UNIT_SIZE * ls.cw;
      pxR(x, ssY, 1, ur * UNIT_SIZE * ls.ch, C.unitLine);
    }
    for (let j = 0; j <= ur; j++) {
      let y = ssY + j * UNIT_SIZE * ls.ch;
      pxR(ssX, y, uc * UNIT_SIZE * ls.cw, 1, C.unitLine);
    }

    // ═══ 悬停高亮（半透明亮色叠加）═══
    if (hoverUnit) {
      let hu, hr;
      if (rotated) {
        hu = UNIT_ROWS - 1 - hoverUnit.ur;
        hr = hoverUnit.uc;
      } else {
        hu = hoverUnit.uc;
        hr = hoverUnit.ur;
      }
      let hx = ssX + hu * UNIT_SIZE * ls.cw;
      let hy = ssY + hr * UNIT_SIZE * ls.ch;
      let hw = UNIT_SIZE * ls.cw;
      let hh = UNIT_SIZE * ls.ch;
      pxR(hx, hy, hw, hh, 'rgba(255,255,255,0.22)');
    }

    // ═══ 沙具渲染（俯视）═══
    for (let i = 0; i < placedToys.length; i++) {
      let toy = placedToys[i];
      let isHovered = hoverToy === i;
      let isDragging = dragToy && dragToy.toy === toy;
      let showCol = isDragging ? dragToy.origCol : toy.col;
      let showRow = isDragging ? dragToy.origRow : toy.row;

      // 旋转坐标变换
      let lc, lr;
      if (rotated) {
        lc = SAND_ROWS - showRow;
        lr = showCol;
      } else {
        lc = showCol;
        lr = showRow;
      }

      let ax = ssX + lc * ls.cw;
      let ay = ssY + lr * ls.ch;

      if (toy.type === 'astronaut') {
        renderAstronautTopDown(ax, ay, isHovered, isDragging);
      } else if (toy.type === 'cow') {
        renderCowTopDown(ax, ay, isHovered, isDragging);
      } else if (toy.type === 'cactus') {
        renderCactusTopDown(ax, ay, isHovered, isDragging);
      }
    }

    ctx.restore();  // 恢复上下文
  }

  // ══════════════ 轴测视图 ═══════════════
  // 沙面厚度像素（4cm 对应的高度）
  const ISO_SAND_THICK = Math.round(ISO_WALL_H * SAND_CM / WALL_H_CM); // 20px
  // 沙面以上墙体像素（3cm 对应的高度）
  const ISO_WALL_ABOVE = ISO_WALL_H - ISO_SAND_THICK; // 15px

  function isoToScreen(col, row, zOffset) {
    let s = isoSize();
    let ox = s.w / 2;
    let oy = 30 + ISO_WALL_H;
    let x = ox + (col - row) * ISO_TW / 2;
    let y = oy + (col + row) * ISO_TH / 2 - (zOffset || 0);
    return { x: Math.round(x), y: Math.round(y) };
  }

  // 绘制单个菱形 tile（顶部）
  function drawDiamond(cx, cy, hw, hh, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + hw, cy + hh);
    ctx.lineTo(cx, cy + hh * 2);
    ctx.lineTo(cx - hw, cy + hh);
    ctx.closePath();
    ctx.fill();
  }

  // 绘制四边形（连续墙面/侧面）
  function drawQuad(p1, p2, p3, p4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath();
    ctx.fill();
  }

  // 绘制木质纹理墙面（p1-p2为底边，p3-p4为顶边，p1→p4为左边，p2→p3为右边）
  function drawWoodTexture(p1, p2, p3, p4, baseColor) {
    // 先填充底色
    drawQuad(p1, p2, p3, p4, baseColor);

    let wallHeight = Math.abs(p4.y - p1.y);
    if (wallHeight < 2) return;

    // 木纹色阶：深浅交替模拟年轮纹理
    let grainColors = [
      baseColor,
      darken(baseColor, 0.06),
      darken(baseColor, -0.05),
      darken(baseColor, 0.11),
      baseColor,
      darken(baseColor, -0.07),
      darken(baseColor, 0.08),
      darken(baseColor, -0.04),
      darken(baseColor, 0.13),
      baseColor,
      darken(baseColor, -0.06),
      darken(baseColor, 0.09),
    ];

    let grainSpacing = 2; // 每2px一条纹理线
    let grainCount = Math.floor(wallHeight / grainSpacing);

    for (let i = 0; i < grainCount; i++) {
      let t = (i + 0.5) / grainCount;
      // 沿左边插值 p1→p4
      let lx = p1.x + (p4.x - p1.x) * t;
      let ly = p1.y + (p4.y - p1.y) * t;
      // 沿右边插值 p2→p3
      let rx = p2.x + (p3.x - p2.x) * t;
      let ry = p2.y + (p3.y - p2.y) * t;

      let ci = i % grainColors.length;
      ctx.strokeStyle = grainColors[ci];
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.round(lx), Math.round(ly));
      ctx.lineTo(Math.round(rx), Math.round(ry));
      ctx.stroke();
    }

  }

  function renderIsometric() {
    let s = isoSize();
    pxR(0, 0, s.w, s.h, C.bg);

    let hw = ISO_TW / 2;
    let hh = ISO_TH / 2;

    let cx = Math.round((s.w - (SAND_COLS - SAND_ROWS) * hw) / 2);
    let cy = Math.round((s.h - (SAND_COLS + SAND_ROWS) * hh + ISO_OUTER_H) / 2 - ISO_H) + 14 + ISO_VERTICAL_SHIFT;

    // 沙格 → 屏幕坐标（z 为像素高度，越大越靠上）
    function sv(col, row, z) {
      let x = cx + (col - row) * hw;
      let y = cy + (col + row) * hh - z;
      return { x: Math.round(x), y: Math.round(y) };
    }

    // ── 容器 8 个顶点 ──
    let vb1 = sv(0, 0, 0);
    let vb2 = sv(SAND_COLS, 0, 0);
    let vb3 = sv(SAND_COLS, SAND_ROWS, 0);
    let vb4 = sv(0, SAND_ROWS, 0);
    let vt1 = sv(0, 0, ISO_OUTER_H);
    let vt2 = sv(SAND_COLS, 0, ISO_OUTER_H);
    let vt3 = sv(SAND_COLS, SAND_ROWS, ISO_OUTER_H);
    let vt4 = sv(0, SAND_ROWS, ISO_OUTER_H);

    // ── 内墙面（仅从沙面到墙顶，各沙单位独立计算）──
    // v4→v1 边 (uc=0)
    for (let ur = 0; ur < UNIT_ROWS; ur++) {
      let hCm = effH(0, ur);
      let zSand = Math.round(hCm * PX_PER_CM);
      let sr = ur * UNIT_SIZE;
      let er = sr + UNIT_SIZE;
      let ws1 = sv(0, sr, zSand);
      let ws4 = sv(0, er, zSand);
      let wt1 = sv(0, sr, ISO_OUTER_H);
      let wt4 = sv(0, er, ISO_OUTER_H);
      drawQuad(ws1, ws4, wt4, wt1, C.skyBlue);
    }
    // v1→v2 边 (ur=0)
    for (let uc = 0; uc < UNIT_COLS; uc++) {
      let hCm = effH(uc, 0);
      let zSand = Math.round(hCm * PX_PER_CM);
      let sc = uc * UNIT_SIZE;
      let ec = sc + UNIT_SIZE;
      let ws1 = sv(sc, 0, zSand);
      let ws2 = sv(ec, 0, zSand);
      let wt1 = sv(sc, 0, ISO_OUTER_H);
      let wt2 = sv(ec, 0, ISO_OUTER_H);
      drawQuad(ws1, ws2, wt2, wt1, C.skyBlueDk);
    }

    // ── 底面（高度为0的沙单位露出深天蓝色容器底）──
    for (let sum = 0; sum <= (UNIT_COLS - 1) + (UNIT_ROWS - 1); sum++) {
      for (let uc = 0; uc < UNIT_COLS; uc++) {
        let ur = sum - uc;
        if (ur < 0 || ur >= UNIT_ROWS) continue;
        if (effH(uc, ur) > 0) continue;
        let sc = uc * UNIT_SIZE;
        let sr = ur * UNIT_SIZE;
        let ec = sc + UNIT_SIZE;
        let er = sr + UNIT_SIZE;
        let b1 = sv(sc, sr, 0);
        let b2 = sv(ec, sr, 0);
        let b3 = sv(ec, er, 0);
        let b4 = sv(sc, er, 0);
        drawQuad(b1, b2, b3, b4, '#3a6a80');

        // 菱形格线
        ctx.strokeStyle = C.cellLine;
        ctx.lineWidth = 0.5;
        for (let c = 0; c < UNIT_SIZE; c++) {
          for (let r = 0; r < UNIT_SIZE; r++) {
            let col = sc + c;
            let row = sr + r;
            let x = cx + (col - row) * hw;
            let y = cy + (col + row) * hh;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + hw, y + hh);
            ctx.lineTo(x, y + hh * 2);
            ctx.lineTo(x - hw, y + hh);
            ctx.closePath();
            ctx.stroke();
          }
        }
      }
    }

    // ── 沙单位（从后到前，画家算法）──
    const sandColors = [C.sandA, C.sandB, C.sandC, C.sandD];
    for (let sum = 0; sum <= (UNIT_COLS - 1) + (UNIT_ROWS - 1); sum++) {
      for (let uc = 0; uc < UNIT_COLS; uc++) {
        let ur = sum - uc;
        if (ur < 0 || ur >= UNIT_ROWS) continue;
        renderOneUnit(uc, ur);
      }
    }

    // ── 渲染所有沙具地面阴影（在沙面之上、沙具之下）──
    for (let i = 0; i < placedToys.length; i++) {
      let toy = placedToys[i];
      let isDragging = dragToy && dragToy.toy === toy;
      let showCol = isDragging ? dragToy.origCol : toy.col;
      let showRow = isDragging ? dragToy.origRow : toy.row;
      let uc = Math.floor(showCol / UNIT_SIZE);
      let ur = Math.floor(showRow / UNIT_SIZE);
      let hCm = sandHeights[uc][ur];
      let zTop = Math.round(hCm * PX_PER_CM);
      let bx = Math.round(cx + (showCol - showRow) * hw);
      let by = Math.round(cy + (showCol + showRow) * hh - zTop);
      const shadowAngle = Math.atan2(ISO_TH / 2, ISO_TW / 2); // 长边方向角
      ctx.fillStyle = isDragging ? 'rgba(0,0,0,0.08)' : 'rgba(0,0,0,0.20)';
      ctx.beginPath();
      if (toy.type === 'cow') {
        ctx.ellipse(bx, by, 15, 4, shadowAngle, 0, Math.PI * 2);
        ctx.fill();
      } else if (toy.type === 'cactus') {
        ctx.ellipse(bx, by, 5, 3, shadowAngle, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ── 渲染所有沙具（在外墙之前，避免穿模）──
    for (let i = 0; i < placedToys.length; i++) {
      let toy = placedToys[i];
      if (toy.type === 'astronaut') {
        let isHovered = hoverToy === i;
        let isDragging = dragToy && dragToy.toy === toy;
        let showCol = isDragging ? dragToy.origCol : toy.col;
        let showRow = isDragging ? dragToy.origRow : toy.row;
        renderAstronaut(showCol, showRow, isHovered, isDragging);
      } else if (toy.type === 'cow') {
        let isHovered = hoverToy === i;
        let isDragging = dragToy && dragToy.toy === toy;
        let showCol = isDragging ? dragToy.origCol : toy.col;
        let showRow = isDragging ? dragToy.origRow : toy.row;
        renderCow(showCol, showRow, isHovered, isDragging);
      } else if (toy.type === 'cactus') {
        let isHovered = hoverToy === i;
        let isDragging = dragToy && dragToy.toy === toy;
        let showCol = isDragging ? dragToy.origCol : toy.col;
        let showRow = isDragging ? dragToy.origRow : toy.row;
        renderCactus(showCol, showRow, isHovered, isDragging);
      }
    }

    // ── 外墙面（深木色木质纹理，从底面到墙顶，最顶层）──
    drawWoodTexture(vb2, vb3, vt3, vt2, C.woodOuter);
    drawWoodTexture(vb3, vb4, vt4, vt3, darken(C.woodOuter, 0.12));

    // ── 渲染单个沙单位 ──
    function renderOneUnit(uc, ur) {
      let hCm = effH(uc, ur);
      if (hCm <= 0) return;

      let zTop = Math.round(hCm * PX_PER_CM);
      let sc = uc * UNIT_SIZE;
      let sr = ur * UNIT_SIZE;
      let ec = sc + UNIT_SIZE;
      let er = sr + UNIT_SIZE;

      let t1 = sv(sc, sr, zTop);
      let t2 = sv(ec, sr, zTop);
      let t3 = sv(ec, er, zTop);
      let t4 = sv(sc, er, zTop);

      // ── 侧面 v2→v3（右下侧，正对用户）──
      let rNh = (uc + 1 < UNIT_COLS) ? effH(uc + 1, ur) * PX_PER_CM : 0;
      if (zTop > rNh) {
        let n2 = sv(ec, sr, rNh);
        let n3 = sv(ec, er, rNh);
        drawQuad(t2, t3, n3, n2, darken(C.sandA, 0.20));
      }

      // ── 侧面 v3→v4（左下侧，正对用户）──
      let bNh = (ur + 1 < UNIT_ROWS) ? effH(uc, ur + 1) * PX_PER_CM : 0;
      if (zTop > bNh) {
        let n3 = sv(ec, er, bNh);
        let n4 = sv(sc, er, bNh);
        drawQuad(t3, t4, n4, n3, darken(C.sandA, 0.30));
      }

      // ── 顶面不透明底层（遮住蓝色内墙，无透明度）──
      drawQuad(t1, t2, t3, t4, C.sandB);

      // ── 顶面 6×6 菱形网格 ──
      for (let c = 0; c < UNIT_SIZE; c++) {
        for (let r = 0; r < UNIT_SIZE; r++) {
          let col = sc + c;
          let row = sr + r;
          let x = cx + (col - row) * hw;
          let y = cy + (col + row) * hh - zTop;
          let base = sandColors[(col + row) % sandColors.length];
          drawDiamond(x, y, hw, hh, base);

          let seed = (col * 31 + row * 17) % 100;
          for (let i = 0; i < 3; i++) {
            let gx = x - hw + 2 + ((seed + i * 13) % (ISO_TW - 4));
            let gy = y + 1 + ((seed + i * 7) % (ISO_TH * 2 - 2));
            let dx = Math.abs(gx - x) / hw;
            let dy = Math.abs(gy - (y + hh)) / hh;
            if (dx + dy < 0.85) pxR(Math.round(gx), Math.round(gy), 1, 1, darken(base, 0.12));
          }
        }
      }

      // ── 单元格细线 ──
      ctx.strokeStyle = C.cellLine;
      ctx.lineWidth = 0.5;
      for (let c = 0; c < UNIT_SIZE; c++) {
        for (let r = 0; r < UNIT_SIZE; r++) {
          let col = sc + c;
          let row = sr + r;
          let x = cx + (col - row) * hw;
          let y = cy + (col + row) * hh - zTop;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + hw, y + hh);
          ctx.lineTo(x, y + hh * 2);
          ctx.lineTo(x - hw, y + hh);
          ctx.closePath();
          ctx.stroke();
        }
      }

      // ── 悬停高亮（半透明亮色叠加顶面）──
      if (hoverUnit && hoverUnit.uc === uc && hoverUnit.ur === ur) {
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath();
        ctx.moveTo(t1.x, t1.y);
        ctx.lineTo(t2.x, t2.y);
        ctx.lineTo(t3.x, t3.y);
        ctx.lineTo(t4.x, t4.y);
        ctx.closePath();
        ctx.fill();

        // 侧面也加轻微高亮
        if (zTop > rNh) {
          let n2 = sv(ec, sr, rNh);
          let n3 = sv(ec, er, rNh);
          ctx.fillStyle = 'rgba(255,255,255,0.10)';
          ctx.beginPath();
          ctx.moveTo(t2.x, t2.y);
          ctx.lineTo(t3.x, t3.y);
          ctx.lineTo(n3.x, n3.y);
          ctx.lineTo(n2.x, n2.y);
          ctx.closePath();
          ctx.fill();
        }
        if (zTop > bNh) {
          let n3 = sv(ec, er, bNh);
          let n4 = sv(sc, er, bNh);
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.beginPath();
          ctx.moveTo(t3.x, t3.y);
          ctx.lineTo(t4.x, t4.y);
          ctx.lineTo(n4.x, n4.y);
          ctx.lineTo(n3.x, n3.y);
          ctx.closePath();
          ctx.fill();
        }
      }
    }
  }

  // ===== 主渲染 =====
  function render() {
    resize();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (currentView === 'topdown') renderTopDown();
    else renderIsometric();
  }

  // ===== 视角切换 =====
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      let rb = document.getElementById('rotBtn');
      if (currentView === 'isometric') { rotated = false; rb.classList.remove('active'); rb.style.display = 'none'; }
      else { rb.style.display = ''; }
      render(); });
  });

  // ===== 旋转 =====
  document.getElementById('rotBtn').addEventListener('click', function() {
    if (currentView !== 'topdown') return;
    rotated = !rotated;
    this.classList.toggle('active', rotated);
    render(); });

  // ===== 理沙模式切换 =====
  document.getElementById('groomBtn').addEventListener('click', function() {
    groomingMode = !groomingMode;
    if (groomingMode) {
      this.classList.add('active');
      this.setAttribute('aria-pressed', 'true');
      this.title = '退出理沙模式';
      canvas.style.cursor = '';
    } else {
      this.classList.remove('active');
      this.setAttribute('aria-pressed', 'false');
      this.title = '理沙模式';
      canvas.style.cursor = '';
    }
    dragSource = null;
    dragToy = null;
    hoverUnit = null;
    hoverToy = null;
    render();
    });

  // ===== 鼠标事件 =====
  canvas.addEventListener('mousedown', function(e) {
    let rect = canvas.getBoundingClientRect();
    let scaleX = canvas.width / rect.width;
    let scaleY = canvas.height / rect.height;
    let px = (e.clientX - rect.left) * scaleX;
    let py = (e.clientY - rect.top) * scaleY;

    if (groomingMode) {
      // ── 理沙模式：挖沙/堆沙 ──
      let hit = (currentView === 'isometric') ? hitTestUnit(px, py) : hitTestUnitTopDown(px, py);
      if (!hit) return;
      let { uc, ur } = hit;
      if (sandHeights[uc][ur] < 2) return;
      dragSource = { uc, ur };
      canvas.style.cursor = 'grabbing';
      render();
      e.preventDefault();
    } else {
      // ── 沙具模式：移动沙具 ──
      let toyIdx = (currentView === 'isometric') ? hitTestToy(px, py) : hitTestToyTopDown(px, py);
      if (toyIdx < 0) return;
      let toy = placedToys[toyIdx];
      dragToy = { toy, origCol: toy.col, origRow: toy.row };
      canvas.style.cursor = 'grabbing';
      render();
      e.preventDefault();
    }
  });

  canvas.addEventListener('mousemove', function(e) {
    let rect = canvas.getBoundingClientRect();
    let scaleX = canvas.width / rect.width;
    let scaleY = canvas.height / rect.height;
    let px = (e.clientX - rect.left) * scaleX;
    let py = (e.clientY - rect.top) * scaleY;

    if (groomingMode) {
      // ── 理沙模式悬停 ──
      if (dragSource) return;
      let hit = (currentView === 'isometric') ? hitTestUnit(px, py) : hitTestUnitTopDown(px, py);
      let prevHover = hoverUnit;
      if (hit && sandHeights[hit.uc][hit.ur] >= 2) {
        canvas.style.cursor = 'grab';
        if (!prevHover || prevHover.uc !== hit.uc || prevHover.ur !== hit.ur) {
          hoverUnit = hit;
          render();
        }
      } else {
        canvas.style.cursor = '';
        if (prevHover) { hoverUnit = null; render(); }
      }
    } else {
      // ── 沙具模式悬停 ──
      if (dragToy) return;
      let toyIdx = (currentView === 'isometric') ? hitTestToy(px, py) : hitTestToyTopDown(px, py);
      let prevToy = hoverToy;
      if (toyIdx >= 0) {
        canvas.style.cursor = 'grab';
        if (prevToy !== toyIdx) { hoverToy = toyIdx; render(); }
      } else {
        canvas.style.cursor = '';
        if (prevToy !== null) { hoverToy = null; render(); }
      }
    }
  });

  canvas.addEventListener('mouseup', function(e) {
    let rect = canvas.getBoundingClientRect();
    let scaleX = canvas.width / rect.width;
    let scaleY = canvas.height / rect.height;
    let px = (e.clientX - rect.left) * scaleX;
    let py = (e.clientY - rect.top) * scaleY;

    if (groomingMode) {
      // ── 理沙模式释放 ──
      if (!dragSource) return;
      let src = dragSource;
      dragSource = null;
      canvas.style.cursor = '';

      let hit = (currentView === 'isometric') ? hitTestUnit(px, py) : hitTestUnitTopDown(px, py);
      if (!hit) { render(); return; }
      let { uc, ur } = hit;
      if ((uc === src.uc && ur === src.ur) || sandHeights[uc][ur] >= 6) {
        render();
        return;
      }
      sandHeights[src.uc][src.ur] -= 2;
      sandHeights[uc][ur] += 2;
      applySandSliding();
      render();
      } else {
      // ── 沙具模式释放 ──
      if (!dragToy) return;
      let dt = dragToy;
      dragToy = null;
      canvas.style.cursor = '';

      let hit = (currentView === 'isometric') ? hitTestCell(px, py) : hitTestCellTopDown(px, py);
      if (!hit) { dt.toy.col = dt.origCol; dt.toy.row = dt.origRow; render(); return; }
      let { col, row } = hit;
      let uc = Math.floor(col / UNIT_SIZE);
      let ur = Math.floor(row / UNIT_SIZE);
      // 检查目标单元格是否已有沙具
      let occupied = placedToys.some(t => t !== dt.toy && t.col === col && t.row === row);
      if (occupied) { dt.toy.col = dt.origCol; dt.toy.row = dt.origRow; render(); return; }
      dt.toy.col = col;
      dt.toy.row = row;
      render();
      }
  });

  // 拖拽离开画布时取消
  canvas.addEventListener('mouseleave', function() {
    if (dragSource) {
      dragSource = null;
      canvas.style.cursor = '';
      render();
    }
    if (dragToy) {
      dragToy.toy.col = dragToy.origCol;
      dragToy.toy.row = dragToy.origRow;
      dragToy = null;
      canvas.style.cursor = '';
      render();
    }
    if (hoverUnit) { hoverUnit = null; render(); }
    if (hoverToy !== null) { hoverToy = null; render(); }
  });

  // ===== 快照模式（入口页使用）=====
  const isSnapshot = new URLSearchParams(location.search).has('snapshot');
  if (isSnapshot) {
    document.body.classList.add('snapshot-mode');
    canvas.style.pointerEvents = 'none';
    // 随机放置 3-5 个沙具
    placedToys.length = 0;
    const toyTypes = ['astronaut', 'cow', 'cactus'];
    const toyLabels = { astronaut: '宇航员', cow: '牛', cactus: '仙人掌' };
    const count = 3 + Math.floor(Math.random() * 3); // 3-5
    const used = new Set();
    for (let i = 0; i < count; i++) {
      let col, row, key;
      do {
        col = 0.5 + Math.random() * (SAND_COLS - 1);
        row = 0.5 + Math.random() * (SAND_ROWS - 1);
        key = Math.round(col * 100) + '_' + Math.round(row * 100);
      } while (used.has(key));
      used.add(key);
      let type = toyTypes[i % toyTypes.length];
      placedToys.push({ type, col, row, label: toyLabels[type] });
    }
    // New Case 按钮 — 弹出沙盘选择
    document.getElementById('entryNewBtn').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.add('show');
    });
    // 模态框：标准沙盘点击跳转
    var modalStdBtn = document.querySelector('.modal-option[data-type="standard"]');
    if (modalStdBtn) modalStdBtn.addEventListener('click', () => {
      location.href = 'sandbox-standard.html';
    });
    // 取消按钮关闭模态框
    var modalCloseBtn = document.getElementById('modalClose');
    if (modalCloseBtn) modalCloseBtn.addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('show');
    });
    // 点击遮罩关闭
    var overlay = document.getElementById('modalOverlay');
    if (overlay) overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('show');
    });
  }

  // ===== 初始化 =====
  render();
  window.addEventListener('resize', () => { render(); });
  console.log('🏜️ 标准沙盘 — 24×18 格 · 3×3 沙单位 · 48 个');
  // 调试接口：浏览器控制台可用 __sand.heights[uc][ur] 读写，__sand.refresh() 刷新
  window.__sand = { heights: sandHeights, refresh: () => { render(); }, get drag() { return dragSource; }, set drag(v) { dragSource = v; }, get hover() { return hoverUnit; }, toys: placedToys, get isRotated() { return rotated; }, set isRotated(v) { rotated = v; render(); }, get isGrooming() { return groomingMode; }, set isGrooming(v) { groomingMode = v; render(); }, get dragT() { return dragToy; }, get hoverT() { return hoverToy; }, get view() { return currentView; }, set view(v) { currentView = v; render(); }, refreshAll: () => { render(); } };
})();
