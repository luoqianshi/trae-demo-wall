<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心灵沙境</title>
<style>
  :root { --bg: #1a1a2e; --cent: #e2b04a; --accent: #e2b04a; --ink: #e0e0e0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: #e0e0e0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 24px;
    overflow: hidden;
  }

  .snapshot-wrap {
    width: 432px; height: 288px;
    margin-bottom: 16px;
    margin-left: 28px;
  }
  .snapshot-wrap img {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .title-section {
    text-align: center;
    margin-bottom: 16px;
  }
  .title-section h1 {
    font-size: 1.2rem; color: var(--cent); letter-spacing: 3px; margin-bottom: 2px;
  }
  .title-section .subtitle {
    font-size: 0.7rem; color: #888; letter-spacing: 1px;
  }

  .new-case-btn {
    margin-top: 12px;
    padding: 14px 56px;
    font-size: 1.1rem;
    background: var(--cent);
    color: #1a1a2e;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 2px;
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(226,176,74,0.25);
  }
  .new-case-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(226,176,74,0.4);
  }
  .new-case-btn:active { transform: translateY(0); }

  /* 沙盘选择模态框 */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 100; justify-content: center; align-items: center; }
  .modal-overlay.show { display: flex; }
  .modal-overlay .modal-box { background: rgba(22,33,62,0.95); border: 1px solid rgba(226,176,74,0.3); border-radius: 16px; padding: 40px 48px; text-align: center; max-width: 420px; width: 90%; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal-overlay .modal-box h2 { font-size: 1.1rem; color: #aaa; letter-spacing: 2px; margin-bottom: 28px; font-weight: 400; }
  .modal-overlay .modal-option { display: block; width: 100%; padding: 16px 20px; margin-bottom: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: var(--ink); cursor: pointer; font-family: inherit; font-size: 0.95rem; letter-spacing: 1px; transition: all 0.2s; text-align: center; }
  .modal-overlay .modal-option:hover { background: rgba(226,176,74,0.1); border-color: var(--accent); }
  .modal-overlay .modal-option .size { font-size: 0.72rem; color: #777; margin-top: 4px; }
  .modal-overlay .modal-option.active { background: rgba(226,176,74,0.15); border-color: var(--accent); }
  .modal-overlay .modal-option.disabled { opacity: 0.45; cursor: not-allowed; }
  .modal-overlay .modal-option.disabled:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); }
  .modal-overlay .modal-close { margin-top: 20px; background: none; border: none; color: #666; cursor: pointer; font-family: inherit; font-size: 0.8rem; letter-spacing: 1px; }
</style>
</head>
<body>

<div class="snapshot-wrap">
  <img src="snapshot-preview.png" alt="沙盘预览">
</div>

<div class="title-section">
  <h1>心灵沙境</h1>
  <p class="subtitle">BLOCK SANDBOX</p>
</div>

<button class="new-case-btn" id="newCaseBtn">New Case</button>

<!-- 沙盘选择模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2>选择沙盘类型</h2>
    <button class="modal-option active" data-type="standard">
      标准沙盘
      <div class="size">72cm × 57cm × 7cm</div>
    </button>
    <button class="modal-option disabled" data-type="group" disabled>
      团体沙盘
      <div class="size">120cm × 60cm × 7cm（实现中）</div>
    </button>
    <button class="modal-option disabled" data-type="child" disabled>
      儿童沙盘
      <div class="size">54cm × 46cm × 7cm（实现中）</div>
    </button>
    <button class="modal-close" id="modalClose">取消</button>
  </div>
</div>

<script>
(function() {
  var newCaseBtn = document.getElementById('newCaseBtn');
  var modalOverlay = document.getElementById('modalOverlay');
  var modalClose = document.getElementById('modalClose');
  var modalStdBtn = document.querySelector('.modal-option[data-type="standard"]');

  newCaseBtn.addEventListener('click', function() {
    modalOverlay.classList.add('show');
  });

  modalClose.addEventListener('click', function() {
    modalOverlay.classList.remove('show');
  });

  modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) {
      modalOverlay.classList.remove('show');
    }
  });

  if (modalStdBtn) {
    modalStdBtn.addEventListener('click', function() {
      location.href = 'sandbox-standard.html';
    });
  }
})();
</script>

</body>
</html>
