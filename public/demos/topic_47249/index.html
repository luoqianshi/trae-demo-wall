<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphForge · 创意科学函数图形工坊</title>
<style>
:root{--bg-deep:#050810;--bg-primary:#0a0f1e;--bg-card:#162040;--text-primary:#eaf0ff;--text-secondary:#8494b7;--text-muted:#4d5f82;--accent:#00d4ff;--accent2:#7c5cfc;--accent3:#ff5c8a;--accent4:#00e89d;--accent5:#ffb84d;--border:rgba(255,255,255,0.06);--border-hover:rgba(255,255,255,0.12);--glass:rgba(10,15,30,0.92);--glow-cyan:rgba(0,212,255,0.15);--radius:12px;--radius-sm:8px;--radius-xs:6px;--shadow:0 8px 32px rgba(0,0,0,0.5);--transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-deep);color:var(--text-primary);overflow:hidden;height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.app{display:grid;grid-template-columns:60px 1fr 300px;grid-template-rows:48px 1fr 32px;height:100vh}
.header{grid-column:1/-1;background:var(--glass);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);z-index:100}
.brand{display:flex;align-items:center;gap:8px}
.brand-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;box-shadow:0 0 16px var(--glow-cyan)}
.brand-name{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px}
.brand-tag{font-size:9px;color:var(--text-muted);font-weight:500;padding:2px 8px;border:1px solid var(--border);border-radius:20px}
.header-right{display:flex;gap:4px;align-items:center}
.hdr-btn{padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-secondary);font-size:10px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:4px}
.hdr-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,0.05)}
.sidebar{background:var(--glass);backdrop-filter:blur(24px);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;border-right:1px solid var(--border);overflow-y:auto}
.nav-item{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);cursor:pointer;transition:var(--transition);position:relative;border:1px solid transparent;color:var(--text-muted);flex-shrink:0}
.nav-item:hover{background:var(--bg-card);border-color:var(--border);color:var(--text-secondary);transform:scale(1.05)}
.nav-item.active{background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(124,92,252,0.08));border-color:var(--accent);color:var(--accent);box-shadow:0 0 16px var(--glow-cyan),inset 0 0 16px rgba(0,212,255,0.03)}
.nav-item.active::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--accent);border-radius:0 3px 3px 0;box-shadow:0 0 6px var(--accent)}
.nav-item svg{width:18px;height:18px}
.nav-tip{position:absolute;left:48px;background:var(--bg-card);padding:4px 8px;border-radius:var(--radius-xs);font-size:10px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:var(--transition);z-index:200;border:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(-4px);color:var(--text-secondary)}
.nav-item:hover .nav-tip{opacity:1;transform:translateX(0)}
.sidebar-sep{width:20px;height:1px;background:var(--border);margin:4px 0;flex-shrink:0}
.main{background:var(--bg-deep);position:relative;overflow:hidden}
.canvas-wrap{width:100%;height:100%;position:relative;z-index:1}
canvas{width:100%;height:100%;display:block;transition:opacity .15s ease}
.canvas-wrap.switching canvas{opacity:0}
.canvas-badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;z-index:5}
.canvas-badge .icon{width:26px;height:26px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border)}
.canvas-badge .label{font-size:11px;font-weight:600;background:var(--glass);backdrop-filter:blur(12px);padding:4px 10px;border-radius:var(--radius-xs);border:1px solid var(--border)}
.canvas-hint{position:absolute;bottom:10px;left:10px;background:var(--glass);backdrop-filter:blur(12px);padding:5px 10px;border-radius:var(--radius-xs);font-size:9px;color:var(--text-muted);pointer-events:none;border:1px solid var(--border)}
.coord-box{position:absolute;bottom:10px;right:10px;background:var(--glass);backdrop-filter:blur(12px);padding:4px 8px;border-radius:var(--radius-xs);font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--text-muted);pointer-events:none;border:1px solid var(--border)}
.panel{background:var(--glass);backdrop-filter:blur(24px);padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--border)}
.psec{background:var(--bg-card);border-radius:var(--radius);padding:12px;border:1px solid var(--border);transition:var(--transition)}
.psec:hover{border-color:var(--border-hover)}
.psec-title{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.psec-title::before{content:'';width:3px;height:10px;background:var(--accent);border-radius:2px}
.sgrp{margin-bottom:8px}
.sgrp label{display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.sgrp label span{color:var(--accent);font-family:'JetBrains Mono',monospace}
input[type="range"]{width:100%;-webkit-appearance:none;height:3px;border-radius:2px;background:var(--bg-primary);outline:none;border:1px solid var(--border)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 6px var(--glow-cyan)}
.play-btn{width:100%;padding:8px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:11px;font-family:'Inter',sans-serif;font-weight:700;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.3px}
.play-btn.go{background:linear-gradient(135deg,var(--accent),#00a8cc);color:var(--bg-deep)}
.play-btn.go:hover{box-shadow:0 4px 20px var(--glow-cyan);transform:translateY(-1px)}
.play-btn.stop{background:linear-gradient(135deg,var(--accent3),#d6336c);color:#fff}
.play-btn.stop:hover{box-shadow:0 4px 20px rgba(255,92,138,.3);transform:translateY(-1px)}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.tab{padding:4px 10px;border-radius:var(--radius-xs);cursor:pointer;font-size:10px;font-weight:600;transition:var(--transition);background:var(--bg-primary);border:1px solid var(--border);color:var(--text-muted)}
.tab:hover{border-color:var(--accent);color:var(--text-primary)}
.tab.active{background:var(--accent);color:var(--bg-deep);border-color:var(--accent)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pre-btn{padding:5px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--text-muted);transition:var(--transition)}
.pre-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.04)}
.fn-list{display:flex;flex-direction:column;gap:4px}
.fn-item{display:flex;align-items:center;gap:5px;padding:5px 6px;background:var(--bg-primary);border-radius:var(--radius-xs);border:1px solid var(--border)}
.fn-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;box-shadow:0 0 4px currentColor}
.fn-input{flex:1;background:transparent;border:none;color:var(--text-primary);font-family:'JetBrains Mono',monospace;font-size:10px;outline:none}
.fn-rm{cursor:pointer;opacity:.3;transition:var(--transition);font-size:10px;color:var(--text-muted)}
.fn-rm:hover{opacity:1;color:var(--accent3)}
.add-btn{width:100%;padding:5px;border:1px dashed var(--border);border-radius:var(--radius-xs);cursor:pointer;font-size:10px;color:var(--text-muted);background:transparent;transition:var(--transition);font-family:'Inter',sans-serif}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.03)}
.cpick{display:flex;gap:5px;flex-wrap:wrap}
.copt{width:20px;height:20px;border-radius:var(--radius-xs);cursor:pointer;border:2px solid transparent;transition:var(--transition)}
.copt:hover,.copt.active{border-color:#fff;transform:scale(1.15);box-shadow:0 0 8px rgba(255,255,255,.15)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stat-card{background:var(--bg-primary);padding:8px;border-radius:var(--radius-xs);text-align:center;border:1px solid var(--border)}
.stat-val{font-size:14px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:'JetBrains Mono',monospace}
.stat-lbl{font-size:8px;color:var(--text-muted);margin-top:1px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.info{font-size:9px;color:var(--text-muted);line-height:1.7}
.info b{color:var(--text-secondary)}
.footer{grid-column:1/-1;background:var(--glass);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-top:1px solid var(--border);font-size:9px;color:var(--text-muted)}
.footer-left{display:flex;align-items:center;gap:12px}
.footer-dot{width:5px;height:5px;border-radius:50%;background:var(--accent4);box-shadow:0 0 4px var(--accent4)}
.toast{position:fixed;top:56px;right:16px;background:var(--bg-card);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:8px 14px;font-size:11px;color:var(--accent);z-index:999;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none;box-shadow:0 4px 16px var(--glow-cyan)}
.toast.show{opacity:1;transform:translateY(0)}
</style>

</head>
<body>
<div class="app">
<div class="header">
<div class="brand"><div class="brand-icon">G</div><div class="brand-name">GraphForge</div><span class="brand-tag">V1.0</span></div>
<div class="header-right">
<button class="hdr-btn" onclick="exportPNG()"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出PNG</button>

<div class="sidebar">

<div class="nav-item" onclick="switchMod('stats')" data-mod="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg><span class="nav-tip">统计分析</span></div>
<div class="nav-item" onclick="switchMod('physics')" data-mod="physics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83"/></svg><span class="nav-tip">物理模拟</span></div>
<div class="sidebar-sep"></div>
<div class="nav-item" onclick="switchMod('vector')" data-mod="vector"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span class="nav-tip">向量场</span></div>
<div class="nav-item" onclick="switchMod('fourier')" data-mod="fourier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9"/></svg><span class="nav-tip">傅里叶绘图</span></div>
<div class="nav-item" onclick="switchMod('cellular')" data-mod="cellular"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg><span class="nav-tip">元胞自动机</span></div>
<div class="nav-item" onclick="switchMod('lorenz')" data-mod="lorenz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20c4-14 12-2 16-16"/><path d="M4 4c4 14 12 2 16 16"/></svg><span class="nav-tip">洛伦兹吸引子</span></div>

<div class="nav-item" onclick="switchMod('projectile')" data-mod="projectile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20L12 4"/><circle cx="12" cy="4" r="1"/><path d="M4 20l8-4 4-4 4 4"/></svg><span class="nav-tip">抛体运动</span></div>
<div class="nav-item" onclick="switchMod('solar')" data-mod="solar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="11" stroke-dasharray="3 3"/></svg><span class="nav-tip">太阳系</span></div>
<div class="nav-item" onclick="switchMod('target')" data-mod="target"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="3" x2="12" y2="21"/><circle cx="12" cy="8" r="3"/><path d="M12 11v10"/><path d="M8 21h8"/><path d="M10 18h4"/></svg><span class="nav-tip">自由落体</span></div>

<div class="main">
<div class="canvas-wrap" id="cWrap"><canvas id="cv"></canvas>
<div class="canvas-badge"><div class="icon" id="mIcon">📐</div><div class="label" id="mLabel">函数绘图</div></div>

<script>console.log('SCRIPT_START');
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
let W,H,curMod='function',DPR=window.devicePixelRatio||1;
const MODS=['function','fractal','stats','physics','vector','fourier','cellular','lorenz','wave','interference','projectile','solar','target'];
const modState={};
MODS.forEach(m=>modState[m]={on:false,t:0,aid:null});
modState["function"].mode='wave';
const modMeta={
'function':{icon:'📐',label:'函数绘图',hint:'拖拽平移·滚轮缩放·悬停查看函数值·双击重置'},
fractal:{icon:'🎨',label:'分形艺术',hint:'左侧Mandelbrot·右侧Julia·动画时颜色流动'},
stats:{icon:'📊',label:'统计分析',hint:'选择分布生成200样本·悬停柱状图查看详情'},
physics:{icon:'🔬',label:'物理模拟',hint:'点击画布添加引力源·切换模式观察不同运动'},
vector:{icon:'📍',label:'向量场',hint:'悬停查看向量·调节参数改变场型'},
fourier:{icon:'🔘',label:'傅里叶绘图',hint:'调节频率/振幅/相位·观察合成波形'},
cellular:{icon:'🧬',label:'元胞自动机',hint:'点击画布放置细胞·观察生命演化'},
lorenz:{icon:'🌀',label:'洛伦兹吸引子',hint:'蝴蝶效应·混沌吸引子三维投影'},
wave:{icon:'🌊',label:'波动方程',hint:'二维波动传播·干涉衍射模拟'},
interference:{icon:'〰️',label:'声波干涉',hint:'点击画布移动波源·调节波长观察干涉条纹'},
projectile:{icon:'🎯',label:'抛体运动',hint:'调节初速度与角度·观察抛物线轨迹'},
solar:{icon:'🪐',label:'太阳系',hint:'观察行星椭圆轨道运动·太阳居中'},
target:{icon:'🍎',label:'自由落体',hint:'对比真空与不同介质中的下落·观察空气阻力影响'}
};
let mouseX=-1,mouseY=-1,dragging=false,lastM={x:0,y:0};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),2200);}
function resize(){const c=cv.parentElement;W=c.clientWidth;H=c.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);render();}
window.addEventListener('resize',resize);
const _exprCache=new Map();
function evalExpr(expr,x,t){let fn=_exprCache.get(expr);if(!fn){try{fn=new Function('x','t','time','sin','cos','tan','sqrt','exp','log','ln','abs','pow','PI','E','random','return '+expr+';');_exprCache.set(expr,fn);}catch(e){return NaN;}}try{return fn(x,t,t,Math.sin,Math.cos,Math.tan,Math.sqrt,Math.exp,Math.log,Math.log,Math.abs,Math.pow,Math.PI,Math.E,Math.random);}catch(e){return NaN;}}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function easeOutBack(t){const c=2.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}

function getAnimatedY(fn,wx,t){const mode=modState["function"].mode,amp=animP.amplitude,damp=animP.damping,ws=animP.waveSpeed;let wy=evalExpr(fn.expr,wx,t);if(mode==='wave')wy=evalExpr(fn.expr,wx-t*ws,0);else if(mode==='pulse')wy=wy*(1+0.5*Math.sin(t*2));else if(mode==='morph'){const m=(Math.sin(t)+1)/2;wy=evalExpr(fn.expr,wx,0)*(1-m)+evalExpr(fn.expr,wx*(1+0.5*Math.sin(t)),0)*m;}else if(mode==='spiral'){const a=t*ws,ry=wx*Math.sin(a)+wy*Math.cos(a);wy=ry;}wy=wy*amp*Math.exp(-damp*Math.abs(wx)/10);return wy;}

let fracP={maxIter:120,zoom:1,offX:0,offY:0,scheme:'fire'};
function fracColor(iter,max,cyc){if(iter>=max)return[5,8,16];const tt=Math.min(1,(iter+1-Math.log2(Math.log2(Math.max(Math.sqrt(4),1e-10))))/max);const c=(cyc||0)/360;if(fracP.scheme==='fire')return[Math.min(255,tt*512),Math.min(255,tt*256),Math.min(255,tt*128)];if(fracP.scheme==='ocean')return[Math.min(255,tt*128),Math.min(255,tt*300),Math.min(255,tt*512)];if(fracP.scheme==='rainbow'){const h=(tt*360+cyc)%360,s=0.85,l=0.5;const cc=(1-Math.abs(2*l-1))*s,x=cc*(1-Math.abs((h/60)%2-1)),m=l-cc/2;let r,g,b;if(h<60)[r,g,b]=[cc,x,0];else if(h<120)[r,g,b]=[x,cc,0];else if(h<180)[r,g,b]=[0,cc,x];else if(h<240)[r,g,b]=[0,x,cc];else if(h<300)[r,g,b]=[x,0,cc];else[r,g,b]=[cc,0,x];return[(r+m)*255,(g+m)*255,(b+m)*255];}return[Math.min(255,100+tt*400),Math.min(255,50+Math.sin(tt*Math.PI)*200),Math.min(255,200+tt*100)];}
function renderFractalHalf(img,data,t,cyc,isLeft,hw,hh){const ox=isLeft?0:hw;const jcx=-0.7+Math.sin(t*0.5)*0.3,jcy=0.27015+Math.cos(t*0.5)*0.1;for(let py=0;py<hh;py++){for(let px=0;px<hw;px++){const x0=(px-hw/2)*4/(hw*fracP.zoom)+fracP.offX;const y0=(py-hh/2)*4/(hh*fracP.zoom)+fracP.offY;let x=0,y=0,it=0;if(isLeft){while(x*x+y*y<=4&&it<fracP.maxIter){const xt=x*x-y*y+x0;y=2*x*y+y0;x=xt;it++;}}else{x=x0;y=y0;while(x*x+y*y<=4&&it<fracP.maxIter){const xt=x*x-y*y+jcx;y=2*x*y+jcy;x=xt;it++;}}const[r,g,b]=fracColor(it,fracP.maxIter,cyc);const idx=((py)*W+(ox+px))*4;data[idx]=r;data[idx+1]=g;data[idx+2]=b;data[idx+3]=255;}}}

let sData=[],sampleCount=200,hoveredBar=-1,currentDist='normal',sAnim={cur:[],tgt:[],prog:1,active:false};
function generateDistData(type,n){
  if(type==='normal'){const mean=50,std=15;return Array.from({length:n},()=>{let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return mean+std*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);});}
  else if(type==='uniform'){return Array.from({length:n},()=>Math.random()*100);}
  else if(type==='exponential'){const lambda=0.05;return Array.from({length:n},()=>-Math.log(1-Math.random())/lambda);}
  else if(type==='bimodal'){return Array.from({length:n},()=>{if(Math.random()<0.5)return 25+Math.random()*15;else return 70+Math.random()*15;});}
  return Array.from({length:n},()=>Math.random()*100);
}
sData=generateDistData('normal',200);
function calcStats(d){const n=d.length,sum=d.reduce((a,b)=>a+b,0),mean=sum/n;const vari=d.reduce((a,b)=>a+Math.pow(b-mean,2),0)/n,std=Math.sqrt(vari);const mn=Math.min(...d),mx=Math.max(...d);const sorted=[...d].sort((a,b)=>a-b);const med=n%2===0?(sorted[Math.floor(n/2)-1]+sorted[Math.floor(n/2)])/2:sorted[Math.floor(n/2)];return{mean,vari,std,min:mn,max:mx,median:med};}
function sturgesBins(n){return Math.max(5,Math.ceil(1+3.322*Math.log10(n)));}
function getHistData(data){
  const st=calcStats(data),pad=55,cw=W-pad*2,ch=H-pad*2;
  const bins=sturgesBins(data.length),bw=(st.max-st.min)/bins||1,barW=cw/bins;
  const hist=new Array(bins).fill(0);
  data.forEach(v=>{const idx=Math.min(Math.floor((v-st.min)/bw),bins-1);hist[idx]++;});
  const mc=Math.max(...hist,1);
  return{st,pad,cw,ch,bins,bw,barW,hist,mc};
}
function normalPDF(x,mean,std){return(1/(std*Math.sqrt(2*Math.PI)))*Math.exp(-0.5*Math.pow((x-mean)/std,2));}
function updateStatsHover(){if(curMod!=='stats'){hoveredBar=-1;return;}const{pad,cw,bins,barW,hist,mc,ch}=getHistData(sData);hoveredBar=-1;for(let i=0;i<bins;i++){const x=pad+i*barW;const barH=(hist[i]/mc)*ch*0.6;const barTop=H-pad-barH;if(mouseX>=x&&mouseX<x+barW&&mouseY>=barTop&&mouseY<=H-pad){hoveredBar=i;break;}}}
function renderStats(){
  cx.fillStyle='#050810';cx.fillRect(0,0,W,H);
  cx.strokeStyle='rgba(255,255,255,0.012)';cx.lineWidth=1;

  if(sAnim.active){sAnim.prog+=0.03;if(sAnim.prog>=1){sAnim.prog=1;sAnim.active=false;}const et=easeOutCubic(sAnim.prog);dd=sAnim.cur.map((v,i)=>v+((sAnim.tgt[i]||v)-v)*et);}
  const{st,pad,cw,ch,bins,bw,barW,hist,mc}=getHistData(dd);
  const chartTop=pad,chartBot=H-pad-80,chartH=chartBot-chartTop;
  hist.forEach((cnt,i)=>{

    g.addColorStop(1,'hsla(190,75%,22%,'+(isHov?0.5:0.3)+')');
    cx.fillStyle=g;
    const bww=barW-3;

2);cx.stroke();}cx.fillStyle='rgba(255,92,138,'+(0.6*pulse)+')';cx.shadowColor='rgba(255,92,138,0.5)';cx.shadowBlur=15;cx.beginPath();cx.arc(p.x,p.y,6*pulse,0,Math.PI*2);cx.fill();cx.fillStyle='#fff';cx.shadowBlur=8;cx.beginPath();cx.arc(p.x,p.y,2,0,Math.PI*2);cx.fill();cx.shadowBlur=0;return;}const dx=cX-p.x,dy=cY-p.y,dist=Math.sqrt(dx*dx+dy*dy)+1;let fx=0,fy=0;if(pMode==='orbit'){const f=pGrav/dist;fx=dx/dist*f*0.1*(pSpd/20)+(-dy/dist*f*0.05*(pSpd/20));fy=dy/dist*f*0.1*(pSpd/20)+(dx/dist*f*0.05*(pSpd/20));}else if(pMode==='vortex'){const f=pGrav/dist;fx=-dy/dist*f*0.15*(pSpd/20)+dx/dist*f*0.02;fy=dx/dist*f*0.15*(pSpd/20)+dy/dist*f*0.02;}else if(pMode==='swarm'){const f=pGrav/(dist*0.5);fx=dx/dist*f*0.08*(pSpd/20)+(Math.random()-.5)*0.3;fy=dy/dist*f*0.08*(pSpd/20)+(Math.random()-.5)*0.3;}else{const f=-pGrav/(dist*0.3);fx=dx/dist*f*0.1*(pSpd/20);fy=dy/dist*f*0.1*(pSpd/20);}parts.forEach(src=>{if(!src.isSource)return;const sdx=src.x-p.x,sdy=src.y-p.y,sd=Math.sqrt(sdx*sdx+sdy*sdy)+1;const sf=pGrav*0.8/sd;fx+=sdx/sd*sf*0.05*(pSpd/20);fy+=sdy/sd*sf*0.05*(pSpd/20);});p.vx+=fx;p.vy+=fy;p.x+=p.vx;p.y+=p.vy;p.life--;p.vx*=0.995;p.vy*=0.995;const alpha=Math.min(1,p.life/p.ml);const hue=(t*40+i*1.8+dist*0.1)%360;const sat=70+20*Math.sin(t*2+i),light=50+15*Math.sin(t*3+i*0.5);const rad=Math.max(0.1,p.sz*alpha);cx.shadowColor='hsla('+hue+','+sat+'%,'+light+'%,'+alpha*0.4+')';cx.shadowBlur=12;cx.fillStyle='hsla('+hue+','+sat+'%,'+light+'%,'+alpha*0.25+')';cx.beginPath();cx.arc(p.x,p.y,rad*2,0,Math.PI*2);cx.fill();cx.shadowColor='hsla('+hue+','+sat+'%,'+(light+20)+'%,'+alpha+')';cx.shadowBlur=6;cx.fillStyle='hsla('+hue+','+sat+'%,'+(light+10)+'%,'+alpha+')';cx.beginPath();cx.arc(p.x,p.y,rad,0,Math.PI*2);cx.fill();cx.shadowBlur=0;if(i%6===0){const vl=Math.sqrt(p.vx*p.vx+p.vy*p.vy);if(vl>0.5){const vs=7/vl;cx.strokeStyle='hsla('+hue+',40%,65%,'+alpha*0.3+')';cx.lineWidth=0.8;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x+p.vx*vs,p.y+p.vy*vs);cx.stroke();}}if(p.life<=0||p.x<-50||p. // ============ SPEECH SYSTEM ============
let speechUtt=null,speechPlaying=false,speechTimer=null,speechStartTime=0,speechMod=null;
let zhVoice=null;
const SPEECH_DURATION_LIMIT=60;
function loadZhVoice(){if(!hasSpeech())return;const voices=window.speechSynthesis.getVoices();if(!voices.length)return;zhVoice=voices.find(v=>v.lang==='zh-CN'&&v.localService)||voices.find(v=>v.lang==='zh-CN')||voices.find(v=>v.lang==='cmn-Hans-CN')||voices.find(v=>v.lang==='zh')||voices.find(v=>v.lang.startsWith('zh'))||null;if(zhVoice)console.log('Chinese voice loaded:',zhVoice.name);else console.log('No Chinese voice found');}
if(typeof window!=='undefined'){window.addEventListener('DOMContentLoaded',loadZhVoice);if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadZhVoice;}}
function hasSpeech(){return 'speechSynthesis' in window;}
function playSpeech(mod){try{if(!hasSpeech()){toast('浏览器不支持语音');return;}if(speechPlaying){window.speechSynthesis.cancel();speechPlaying=false;if(speechTimer){clearInterval(speechTimer);speechTimer=null;}}if(!zhVoice){loadZhVoice();}const txt=moduleSpeech[mod];if(!txt){toast('暂无讲解');return;}window.speechSynthesis.cancel();speechUtt=new SpeechSynthesisUtterance(txt);speechUtt.lang='zh-CN';speechUtt.rate=1.0;speechUtt.pitch=1.0;speechUtt.volume=1;if(zhVoice){speechUtt.voice=zhVoice;}speechUtt.onstart=function(){speechPlaying=true;speechMod=mod;speechStartTime=Date.now();if(bgmAudio&&bgmPlaying){bgmAudio.volume=0.1;}buildPanel();};speechUtt.onend=function(){speechPlaying=false;speechMod=null;if(speechTimer){clearInterval(speechTimer);speechTimer=null;}if(bgmAudio&&bgmPlaying){bgmAudio.volume=0.4;}buildPanel();};speechUtt.onerror=function(e){console.warn('Speech error:',e.error);if(e.error!=='canceled' && e.error!=='interrupted'){speechPlaying=false;speechMod=null;if(speechTimer){clearInterval(speechTimer);speechTimer=null;}buildPanel();toast('语音播放出错: '+e.error);}};window.speechSynthesis.speak(speechUtt);speechPlaying=true;speechMod=mod;speechStartTime=Date.now();if(speechTimer){clearInterval(speechTimer);}speechTimer=setInterval(function(){if(speechPlaying){var elapsed=Math.floor((Date.now()-speechStartTime)/1000);if(elapsed>=SPEECH_DURATION_LIMIT){window.speechSynthesis.cancel();speechPlaying=false;speechMod=null;if(speechTimer){clearInterval(speechTimer);speechTimer=null;}buildPanel();toast('讲解已完成（1分钟）');}else{buildPanel();}}},1000);buildPanel();}catch(err){console.error('playSpeech error:',err);speechPlaying=false;speechMod=null;if(speechTimer){clearInterval(speechTimer);speechTimer=null;}buildPanel();toast('语音播放失败');}}
function stopSpeech(){try{if(speechPlaying){window.speechSynthesis.cancel();}}catch(e){}speechPlaying=false;speechMod=null;if(speechTimer){clearInterval(speechTimer);speechTimer=null;}buildPanel();}
const moduleSpeech={function:'欢迎来到函数绘图模块。这里展示了四个核心参数对波形的影响：振幅控制波的高度，频率控制波的疏密，相位控制左右平移，偏移控制上下移动。你可以同时绘制多条函数曲线。打开动画后，行波让波浪向前传播，脉冲像心跳跳动，变形让曲线自然过渡，螺旋模式能画出类似向日葵的美丽图案，这种螺旋从向日葵到银河系到处可见。拖拽平移画布，滚轮缩放，悬停查看函数值。试着调整参数，感受数学之美吧！人生也像函数，调好努力的振幅、节奏的频率、时机的相位和起点的偏移，你的人生曲线一定会画出漂亮的弧线。',fractal:'欢迎来到分形艺术模块。左侧是Mandelbrot集，右侧是Julia集，两者通过同一个公式z的平方加c反复迭代生成。分形最神奇的特性是自相似性，放大任何局部都能看到与整体相似的图案。调节迭代次数控制细节精度，切换配色方案探索不同风格。动画时Julia集参数c随时间变化，图案动态演化。分形在自然界无处不在，从雪花到海岸线都是分形的杰作。生活启示：再复杂的东西也可能来自最简单的规则，每天坚持小习惯，简单重复也能绽放出令人惊叹的复杂之美。',stats:'欢迎来到统计分析模块。这里可以生成四种经典分布：正态分布呈钟形曲线，均匀分布每个值概率相等，指数分布描述等待时间，双峰分布暗示两个群体。柱状图展示实际分布，粉色虚线显示理论概率密度，箱线图呈现五数概括。悬停柱状图可查看频数和占比。统计学告诉我们，单个数据点虽微不足道，但大量独立数据之和终将呈现规律，这就是中心极限定理的力量。生活启示：不要因为一次失败就否定自己，坚持做对的事，大量独立努力的总和最终会趋向好的方向。',physics:'欢迎来到粒子物理模拟模块。四种运动模式各有特色：轨道模式模拟行星环绕，漩涡模式展示角动量守恒，群聚模式体现涌现现象，每个粒子只看邻居却能形成整体队形，爆发模式模拟超新星扩散。点击画布可添加引力源改变力场。这些简单规则产生的复杂行为，正是大自然的运行法则。生活启示：再微小的个体只要简单互动就能产生壮丽的集体秩序，每个人做好自己的事，美妙的集体秩序会自然涌现。',vector:'欢迎来到向量场模块。五种经典向量场：源场向外发散，汇场向内汇聚，涡场旋转环绕，鞍点场一维收缩一维扩张，偶极场模拟磁铁的两极。箭头方向表示场的方向，长度表示强度，颜色映射矢量大小。点击画布移动力源，实时观察场的变化。向量场是描述力、速度和电磁场的基础工具。生活启示：我们每个人都生活在各种场中，家庭是温暖的引力场，选对场比努力更重要。',fourier:'欢迎来到傅里叶绘图模块。傅里叶分析的核心思想：任何复杂波形都可以分解为简单正弦波的叠加。上方旋转矢量图展示各分量如何旋转合成，下方是合成波形。调节各分量振幅，观察波形变化。这就是傅里叶变换的精髓：时域复杂的信号，在频域可能只是几个简单的频率分量。声音合成、信号处理、图像压缩都依赖这个原理。生活启示：任何复杂问题都可以拆解成简单部分，找到你的核心频率分量，调好健康、家庭和事业的比例，生活乐章就和谐了。',cellular:'欢迎来到元胞自动机模块，运行着经典的康威生命游戏。规则极简：每个细胞生死取决于八个邻居的数量，存活需二到三个邻居，恰好三个邻居时新细胞诞生。点击画布放置或消除细胞。简单规则却产生令人惊叹的复杂行为：稳定的静物、周期振荡器和能自我移动的滑翔机。它甚至图灵完备，理论上能模拟任何计算机。生活启示：孤独会死，拥挤也会死，保持适度的社交连接才能生存。简单的规则反复执行，时间会生长出令人惊叹的复杂结构。',lorenz:'欢迎来到洛伦兹吸引子模块。混沌理论的经典模型，由气象学家洛伦兹发现。三个微分方程描述，参数西格马十，柔二十八，贝塔八分之三。初始条件的微小差异导致完全不同的结果，这就是蝴蝶效应。一只蝴蝶扇动翅膀可能引发龙卷风。轨迹在两个瓣之间跳跃，形成美丽的蝴蝶形状。生活启示：你今天的一个微小善举，一次真诚的微笑，可能在某个时刻掀起改变命运的风暴，别小看任何微小的努力。',wave:'欢迎来到波动方程模块，模拟二维波动传播。方程描述水面波、声波和电磁波的规律。点击画布添加扰动源，观察圆形波纹向四周扩散。两列波相遇时优雅叠加：波峰碰波峰振幅翻倍叫建设性干涉，波峰碰波谷振幅抵消叫破坏性干涉，降噪耳机就利用这个原理。生活启示：你的影响力就像波纹，从一个点开始向外扩散，不要低估一个善举的传播力量，涟漪终将变成浪潮。',interference:'欢迎来到声波干涉模块，展示两列相干波的叠加效果。波峰相遇产生建设性干涉形成亮纹，波峰与波谷相遇产生破坏性干涉形成暗纹。点击画布移动波源，实时观察干涉图样变化。调节波长、频率和振幅探索不同效果。干涉是波动性的核心证据，杨氏双缝实验利用此原理证明了光的波动性，开启了量子力学大门。生活启示：志同道合的人产生建设性干涉，一加一远大于二。选择和谁在一起，就是选择你的叠加方式。',projectile:'欢迎来到抛体运动模块，模拟经典斜抛运动。水平方向匀速直线，竖直方向匀加速减速，两个方向互不干扰。当发射角为四十五度时射程最远，因为水平和竖直分量完全相等。增大角度飞得更高但距离变近，减小角度飞得更远但高度降低。绿色点标记零点，橙色点标记极值点。生活启示：过于追求速度会降低质量，过于追求完美会错失良机，找到最佳平衡角，才能飞得最远。',solar:'欢迎来到太阳系微缩版。太阳居中发光，八颗行星围绕旋转。水星最快八十八天一圈，金星表面四百六十度，地球在宜居带，火星是人类下一个目标，木星体积是地球一千三百倍，土星带华丽光环，天王星歪着身子转，海王星风速超过两千公里每小时。内侧行星公转快外侧慢，这就是开普勒第三定律。生活启示：每颗行星有自己的轨道和节奏，找到你人生的太阳，围绕它建立自己的轨道，保持自己的节奏就好。',target:'欢迎来到自由落体对比实验。左侧真空，右侧空气。真空中五克羽毛和五千克铅球以完全相同速度下落同时触地，这就是伽利略自由落体定律，因为质量大的惯性大但重力也大，效果抵消。空气中羽毛因质量小面积大受显著阻力，终端速度仅每秒零点五米。生活启示：环境对个体表现的影响远超想象，评判一个人之前，请先看看他处在什么环境中。'};

function getSpeechHTML(mod){const isPlaying=speechPlaying&&speechMod===mod;const elapsed=isPlaying?Math.floor((Date.now()-speechStartTime)/1000):0;const remaining=isPlaying?Math.max(0,SPEECH_DURATION_LIMIT-elapsed):0;const statusText=isPlaying?'剩余 '+remaining+'s / '+SPEECH_DURATION_LIMIT+'s':'1分钟限时讲解';return '<div class="psec"><div class="psec-title">🔊 语音讲解</div><button class="play-btn '+(isPlaying?'stop':'go')+'" onclick="'+(isPlaying?'stopSpeech()':'playSpeech(\''+mod+'\')')+'">'+(isPlaying?'⏹ 停止':'▶ 播放讲解')+'</button><div style="margin-top:6px;font-size:9px;color:var(--text-muted)">'+statusText+'</div>'+(isPlaying?'<div style="margin-top:4px;width:100%;height:3px;background:var(--bg-primary);border-radius:2px;overflow:hidden"><div style="width:'+(remaining/SPEECH_DURATION_LIMIT*100)+'%;height:100%;background:var(--accent);transition:width 1s linear"></div></div>':'')+'</div>';}
function buildPanel(){const p=document.getElementById('panel'),s=modState[curMod];switch(curMod){
case'function':p.innerHTML='<div class="psec"><div class="psec-title">动画控制</div><button class="play-btn '+(s.on?'stop':'go')+'" onclick="togglePlay(\'function\')">'+(s.on?'⏸ 暂停':'▶ 开始')+'</button><div style="margin-top:6px;font-size:9px;color:var(--text-muted)">时间: '+s.t.toFixed(2)+'s · '+{wave:'行波',pulse:'脉冲',morph:'变形',spiral:'螺旋'}[s.mode]+'</div></div><div class="psec"><div class="psec-title">动画模式</div><div class="tabs">'+['wave','pulse','morph','spiral'].map(m=>'<div class="tab '+(s.mode===m?'active':'')+'" onclick="setAnimMode(\''+m+'\')">'+{wave:'行波',pulse:'脉冲',morph:'变形',spiral:'螺旋'}[m]+'</div>').join('')+'</div></div><div class="psec"><div class="psec-title">参数</div><div class="sgrp"><label>波速 <span>'+animP.waveSpeed.toFixed(1)+'</span></label><input type="range" min="0.1" max="5" step="0.1" value="'+animP.waveSpeed+'" oninput="animP.waveSpeed=+this.value;buildPanel()"></div><div class="sgrp"><label>振幅 <span>'+animP.amplitude.toFixed(1)+'</span></label><input type="range" min="0.1" max="3" step="0.1" value="'+animP.amplitude+'" oninput="animP.amplitude=+this.value;buildPanel()"></div><div class="sgrp"><label>阻尼 <span>'+animP.damping.toFixed(1)+'</span></label><input type="range" min="0" max="2" step="0.1" value="'+animP.damping+'" oninput="animP.damping=+this.value;buildPanel()"></div></div><div class="psec"><div class="psec-title">函数</div><div class="fn-list">'+fns.map((f,i)=>'<div class="fn-item"><div class="fn-dot" style="background:'+f.color+'"></div><input class="fn-input" value="'+f.expr+'" onchange="fns['+i+'].expr=this.value;if(!modState[\'function\'].on)render()"><span class="fn-rm" onclick="fns.splice('+i+',1);buildPanel();if(!modState[\'function\'].on)render()">✕</span></div>').join('')+'</div><button class="add-btn" onclick="addFn()">+ 添加</button></div><div class="psec"><div class="psec-title">颜色</div><div class="cpick">'+['#00d4ff','#7c5cfc','#ff5c8a','#00e89d','#ffb84d','#f472b6','#4ade80','#fbbf24'].map(c=>'<div class="copt" style="background:'+c+'" onclick="if(fns.length){fns[fns.length-1].color=\''+c+'\';if(!modState[\'function\'].on)render()}"></div>').join('')+'</div></div><div class="psec"><div class="psec-title">预设</div><div class="presets">'+[['sin(x)','sin(x)'],['x*x','x²'],['exp(-x*x)','Gauss'],['sin(x)/x','sinc'],['tan(x)','tan(x)'],['log(abs(x))','log|x|']].map(([e,l])=>'<button class="pre-btn" onclick="loadPre(\''+e+'\')">'+l+'</button>').join('')+'</div></div><div class="psec"><div class="psec-title">操作</div><button class="play-btn go" onclick="view={xMin:-10,xMax:10,yMin:-6,yMax:6};fns=[{expr:\'sin(x)*exp(-x*x/10)\',color:\'#00d4ff\',vis:true},{expr:\'cos(x)*0.5\',color:\'#7c5cfc\',vis:true}];animP={waveSpeed:1,amplitude:1,damping:0};modState[\'function\'].mode=\'wave\';buildPanel();render();toast(\'已重置\')">🔄 重置</button></div>'+getSpeechHTML('function');break;
case'fractal':p.innerHTML='<div class="psec"><div class="psec-title">动画控制</div><button class="play-btn '+(s.on?'stop':'go')+'" onclick="togglePlay(\'fractal\')">'+(s.on?'⏸ 暂停':'▶ 开始')+'</button><div style="margin-top:6px;font-size:9px;color:var(--text-muted)">'+(s.on?'朱利亚集动态演化中':'点击开始观看动态变化')+'</div></div><div class="psec"><div class="psec-title">参数</div><div class="sgrp"><label>迭代 <span>'+fracP.maxIter+'</span></label><input type="range" min="50" max="500" value="'+fracP.maxIter+'" oninput="fracP.maxIter=+this.value;buildPanel();if(!modState.fractal.on)render()"></div><div class="sgrp"><label>缩放 <span>'+fracP.zoom.toFixed(1)+'x</span></label><input type="range" min="0.5" max="10" step="0.1" value="'+fracP.zoom+'" oninput="fracP.zoom=+this.value;buildPanel();if(!modState.fractal.on)render()"></div></div><div class="psec"><div class="psec-title">配色</div><div class="cpick">'+[{n:'fire',c:'#ff4400'},{n:'ocean',c:'#0088ff'},{n:'rainbow',c:'#ff00ff'},{n:'neon',c:'#00ff88'}].map(sc=>'<div class="copt '+(fracP.scheme===sc.n?'active':'')+'" style="background:'+sc.c+'" onclick="fracP.scheme=\''+sc.n+'\';buildPanel();if(!modState.fractal.on)render()"></div>').join('')+'</div></div><div class="psec"><div class="psec-title">说明</div><div class="info"><b>左侧</b>: Mandelbrot 集 z²+c<br><b>右侧</b>: Julia 集动态演化<br>动画时两侧颜色同步流动</div></div><div class="psec"><div class="psec-title">操作</div><button class="play-btn go" onclick="fracP={maxIter:120,zoom:1,offX:0,offY:0,scheme:\'fire\'};buildPanel();render();toast(\'已重置\')">🔄 重置</button></div>'+ getSpeechHTML('fractal');break;
case'stats':const st=calcStats(sData);p.innerHTML='<div class="psec"><div class="psec-title">统计概览</div><div class="stats-grid"><div class="stat-card"><div class="stat-val">'+st.mean.toFixed(1)+'</div><div class="stat-lbl">均值</div></div><div class="stat-card"><div class="stat-val">'+st.median.toFixed(1)+'</div><div class="stat-lbl">中位数</div></div><div class="stat-card"><div class="stat-val">'+st.std.toFixed(1)+'</div><div class="stat-lbl">标准差</div></div><div class="stat-card"><div class="stat-val">'+sData.length+'</div><div class="stat-lbl">样本数</div></div></div></div><div class="psec"><div class="psec-title">样本数量</div><div class="sgrp"><label>生成个数 <span>'+sampleCount+'</span></label><input type="range" min="50" max="1000" step="50" value="'+sampleCount+'" oninput="sampleCount=+this.value;buildPanel();"></div></div><div class="psec"><div class="psec-title">生成数据</div><div class="presets"><button class="pre-btn '+(currentDist==='normal'?'active':'')+'" onclick="genData(\'normal\')">正态分布</button><button class="pre-btn '+(currentDist==='uniform'?'active':'')+'" onclick="genData(\'uniform\')">均匀分布</button><button class="pre-btn '+(currentDist==='exponential'?'active':'')+'" onclick="genData(\'exponential\')">指数分布</button><button class="pre-btn '+(currentDist==='bimodal'?'active':'')+'" onclick="genData(\'bimodal\')">双峰分布</button></div></div><div class="psec"><div class="psec-title">操作</div><button class="play-btn go" onclick="sData=generateDistData(currentDist,sampleCount);sAnim.active=false;sAnim.prog=1;buildPanel();render();toast(\'已重置\')">🔄 重置当前分布</button></div><div class="psec"><div class="psec-title">说明</div><div class="info"><b>Sturges公式</b>: 自动计算最优分箱数<br><b>粉色曲线</b>: 理论正态概率密度<br><b>箱线图</b>: min-Q1-med-Q3-max<br><b>悬停</b>: 查看区间详情与理论概率</div></div>'+ getSpeechHTML('stats');break;
case'physics':const ts=Math.floor(s.t),mn=Math.floor(ts/60),sc=ts%60,ms=Math.floor((s.t%1)*100);const tStr=mn>0?mn+'分'+String(sc).padStart(2,'0')+'秒':sc+'.'+String(ms).padStart(2,'0')+'秒';p.innerHTML='<div class="psec"><div class="psec-title">模拟控制</div><button class="play-btn '+(s.on?'stop':'go')+'" onclick="togglePlay(\'physics\')">'+(s.on?'⏸ 暂停':'▶ 开始')+'</button><div style="margin-top:6px;font-size:9px;color:var(--text-muted)">时间: '+tStr+' · 粒子: '+NP+'</div></div><div class="psec"><div class="psec-title">运动模式</div><div class="tabs">'+['orbit','vortex','swarm','explosion'].map(m=>'<div class="tab '+(pMode===m?'active':'')+'" onclick="setPM(\''+m+'\')">'+{orbit:'轨道',vortex:'漩涡',swarm:'群聚',explosion:'爆发'}[m]+'</div>').join('')+'</div></div><div class="psec"><div class="psec-title">参数</div><div class="sgrp"><label>引力 <span>'+pGrav+'</span></label><input type="range" min="1" max="100" value="'+pGrav+'" oninput="pGrav=+this.value;buildPanel()"></div><div class="sgrp"><label>速度 <span>'+pSpd+'</span></label><input type="range" min="1" max="50" value="'+pSpd+'" oninput="pSpd=+this.value;buildPanel()"></div><div class="sgrp"><label>拖尾 <span>'+Math.round(pTrail*100)+'%</span></label><input type="range" min="0" max="100" value="'+Math.round(pTrail*100)+'" oninput="pTrail=+this.value/100;buildPanel()"></div></div><div class="psec"><div class="psec-title">说明</div><div class="info"><b>轨道</b>: 椭圆环绕<br><b>漩涡</b>: 螺旋吸入<br><b>群聚</b>: 跟随+抖动<br><b>爆发</b>: 向外扩散<br><b>点击画布</b>: 添加引力源</div></div><div class="psec"><div class="psec-title">操作</div><button class="play-btn go" onclick="initParts();buildPanel();render();toast(\'已重置\')">🔄 重置</button></div>'+ getSpeechHTML('physics');break;

function addFn(){const cs=['#00d4ff','#7c5cfc','#ff5c8a','#00e89d','#ffb84d'];fns.push({expr:'sin(x)',color:cs[fns.length%cs.length],vis:true});buildPanel();if(!modState["function"].on)render();}
function loadPre(e){const cs=['#00d4ff','#7c5cfc','#ff5c8a','#00e89d','#ffb84d'];fns.push({expr:e,color:cs[fns.length%cs.length],vis:true});buildPanel();if(!modState["function"].on)render();}
function setPM(m){pMode=m;initParts();buildPanel();if(!modState.physics.on)render();}
function setVecMode(m){vecMode=m;render();buildPanel();}
function setComplexFunc(m){complexFunc=m;render();buildPanel();}
function genData(type){const n=sampleCount||200;sData=generateDistData(type,n);currentDist=type;sAnim.active=false;sAnim.prog=1;buildPanel();render();toast('已生成'+n+'个'+{normal:'正态',uniform:'均匀',exponential:'指数',bimodal:'双峰'}[type]+'分布数据');}
function exportPNG(){const a=document.createElement('a');a.download='graphforge-'+curMod+'-'+Date.now()+'.png';a.href=cv.toDataURL();a.click();toast('PNG 已导出');}
function exportGIF(){toast('GIF导出：请使用浏览器扩展录制');}
console.log('BEFORE_RESETALL');function resetAll(){stopBGM();Object.keys(modState).forEach(m=>{if(modState[m].aid)cancelAnimationFrame(modState[m].aid);modState[m].on=false;modState[m].t=0;modState[m].aid=null;});view={xMin:-10,xMax:10,yMin:-6,yMax:6};fns=[{expr:'sin(x)*exp(-x*x/10)',color:'#00d4ff',vis:true},{expr:'cos(x)*0.5',color:'#7c5cfc',vis:true}];animP={waveSpeed:1,amplitude:1,damping:0};modState["function"].mode='wave';fracP={maxIter:120,zoom:1,offX:0,offY:0,scheme:'fire'};pGrav=50;pSpd=20;pMode='orbit';pTrail=0.3;sAnim={cur:[],tgt:[],prog:1,active:false};sampleCount=200;sData=generateDistData('normal',200);currentDist='normal';hoveredBar=-1;vecMode='source';vecScale=20;fourFreqs=[1,3,5];fourAmps=[60,20,10];fourPhases=[0,0.5,1.5];cellPaused=false;intWavelength=40;intFrequency=1;intAmplitude=1;lorenzPts=[];lorenzX=0.1;lorenzY=0;lorenzZ=0;initParts();initCellular();initWave();initInterference();initProjectile();initSolar();initTarget();buildPanel();render();toast('已重置所有模块');}

document.addEventListener('DOMContentLoaded',function(){resize();initParts();initCellular();initWave();initInterference();initSolar();initTarget();buildPanel();render();});
