<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>背包</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; touch-action: manipulation; }

    .bag-page {
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .bag-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px;
      flex-shrink: 0;
    }
    .bag-header .title-wrap h2 { font-size: 22px; color: #222; margin-bottom: 2px; }
    .bag-header .title-wrap p { font-size: 12px; color: #999; }
    .bag-header .sort-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #888;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .bag-header .sort-btn:active { background: #f0f0f0; }

    .bag-header .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .coin-display {
      display: flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, rgba(232,147,12,0.12), rgba(212,116,10,0.08));
      border: 1px solid rgba(232,147,12,0.25);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 700;
      color: #e8930c;
    }

    .bag-info-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px 12px;
      flex-shrink: 0;
    }
    .bag-capacity {
      flex: 1;
      height: 5px;
      background: #e8e8e8;
      border-radius: 3px;
      overflow: hidden;
    }
    .bag-capacity-fill {
      height: 100%;
      background: linear-gradient(90deg, #8e44ad, #e8930c);
      border-radius: 3px;
      transition: width 0.3s;
    }
    .bag-capacity-text {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
    }

    .grid-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 20px 16px;
      display: flex;
      justify-content: center;
    }
    .grid-wrapper {
      position: relative;
      width: 314px;
      margin: 0 auto;
    }

    .grid-bg {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(8, 60px);
      gap: 2px;
      padding: 3px;
      background: #e8e8e8;
      border-radius: 16px;
      border: 2px solid #d0d0d0;
      position: relative;
    }
    .grid-cell {
      background: #fff;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .grid-cell.highlight-valid { background: rgba(46,204,113,0.3); }
    .grid-cell.highlight-invalid { background: rgba(231,76,60,0.25); }
    .grid-cell.highlight-target { background: rgba(52,152,219,0.35); }
    .grid-cell.highlight-push { background: rgba(52,152,219,0.15); }
    .grid-cell.highlight-merge { background: rgba(142,68,173,0.35); }

    .grid-item {
      position: absolute;
      background: #fff;
      border-radius: 10px;
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.15s;
      z-index: 10;
      user-select: none;
      -webkit-user-select: none;
      border: 2px solid #e8e8e8;
      overflow: hidden;
      touch-action: none;
    }
    .grid-item:active { cursor: grabbing; }
    .grid-item.dragging {
      z-index: 999;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      transform: scale(1.08);
      opacity: 0.92;
      border-color: #c0c0c0;
    }
    .grid-item.placement-invalid { box-shadow: 0 0 0 3px rgba(231,76,60,0.5); }
    .grid-item.placement-valid { box-shadow: 0 0 0 3px rgba(46,204,113,0.5); }
    .grid-item.placement-swap { box-shadow: 0 0 0 3px rgba(52,152,219,0.5); }
    .grid-item.placement-merge { box-shadow: 0 0 0 3px rgba(142,68,173,0.5); animation: mergePulse 0.6s infinite; }
    @keyframes mergePulse {
      0%,100% { box-shadow: 0 0 0 3px rgba(142,68,173,0.5); }
      50% { box-shadow: 0 0 0 6px rgba(142,68,173,0.2); }
    }

    .grid-item.q-common { border-color: #bdc3c7; }
    .grid-item.q-rare { border-color: #3498db; box-shadow: 0 0 8px rgba(52,152,219,0.2); }
    .grid-item.q-epic { border-color: #8e44ad; box-shadow: 0 0 12px rgba(142,68,173,0.25); }
    .grid-item.q-legendary { border-color: #e8930c; box-shadow: 0 0 16px rgba(232,147,12,0.3); }

    .grid-item .item-quality-dot {
      position: absolute;
      top: 4px; right: 4px;
      width: 7px; height: 7px;
      border-radius: 50%;
    }
    .grid-item .item-quality-dot.q-common { background: #bdc3c7; }
    .grid-item .item-quality-dot.q-rare { background: #3498db; }
    .grid-item .item-quality-dot.q-epic { background: #8e44ad; }
    .grid-item .item-quality-dot.q-legendary { background: #e8930c; }

    .grid-item .item-icon {
      width: 32px; height: 32px;
      object-fit: contain;
      pointer-events: none;
      image-rendering: auto;
    }
    .grid-item .item-label {
      font-size: 9px; color: #777;
      margin-top: 1px; text-align: center;
      line-height: 1.2; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      pointer-events: none;
    }
    .grid-item .item-count {
      position: absolute;
      bottom: 3px; right: 5px;
      background: #333; color: #fff;
      font-size: 10px; padding: 1px 6px;
      border-radius: 7px; font-weight: 600;
      pointer-events: none;
    }

    .grid-item.size-2x1 .item-icon { width: 44px; height: 44px; }
    .grid-item.size-1x2 .item-icon { width: 44px; height: 44px; }
    .grid-item.size-2x2 .item-icon { width: 50px; height: 50px; }
    .grid-item.size-1x3 .item-icon { width: 44px; height: 44px; }
    .grid-item.size-3x1 .item-icon { width: 48px; height: 48px; }
    .grid-item.size-3x2 .item-icon { width: 52px; height: 52px; }

    /* 物品操作弹窗 */
    .item-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 20px;
    }
    .item-modal.show { display: flex; animation: fadeIn 0.2s; }
    .item-modal-card {
      background: #fff;
      border-radius: 24px;
      padding: 0;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: dropBounce 0.4s ease;
      overflow: hidden;
    }

    /* 弹窗顶部 - 物品展示 + 关闭 */
    .m-top {
      position: relative;
      padding: 28px 24px 0;
      text-align: center;
      background: linear-gradient(180deg, #fafafb 0%, #fff 100%);
    }
    .m-close {
      position: absolute;
      top: 12px; right: 12px;
      width: 32px; height: 32px;
      border-radius: 10px;
      background: rgba(0,0,0,0.06);
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .m-icon-wrap {
      width: 72px; height: 72px;
      border-radius: 18px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #eee;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .m-icon-wrap.q-legendary { border-color: rgba(232,147,12,0.4); box-shadow: 0 4px 20px rgba(232,147,12,0.15); }
    .m-icon-wrap.q-epic { border-color: rgba(142,68,173,0.4); box-shadow: 0 4px 20px rgba(142,68,173,0.12); }
    .m-icon-wrap.q-rare { border-color: rgba(52,152,219,0.4); box-shadow: 0 4px 20px rgba(52,152,219,0.10); }
    .m-icon-wrap.q-common { border-color: rgba(189,195,199,0.4); }
    .m-icon-wrap img {
      width: 48px; height: 48px;
      object-fit: contain;
    }
    .m-name { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
    .m-qtag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .m-desc {
      font-size: 13px; color: #888;
      line-height: 1.5;
      padding: 0 24px 12px;
      text-align: center;
      background: #fff;
    }

    /* 分隔 */
    .m-divider { height: 1px; background: #f0f0f0; margin: 0 24px; }

    /* 数量选择区 */
    .m-count-section {
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .m-count-label { font-size: 14px; font-weight: 600; color: #333; }
    .m-count-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f5f5f5;
      border-radius: 12px;
      padding: 3px;
    }
    .m-count-btn {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e8e8e8;
      font-size: 18px;
      cursor: pointer;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      transition: background 0.15s;
    }
    .m-count-btn:active { background: #eee; }
    .m-count-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .m-count-val {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      min-width: 32px;
      text-align: center;
    }

    /* 操作按钮区 */
    .m-actions {
      padding: 0 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .m-btn {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .m-btn:active { opacity: 0.85; transform: scale(0.97); }
    .m-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .m-btn-craft {
      background: linear-gradient(135deg, #8e44ad, #9b59b6);
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .m-btn-craft .craft-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: rgba(255,255,255,0.35);
      border-radius: 0 0 0 14px;
      transition: width 0.3s;
    }

    .m-btn-market {
      background: linear-gradient(135deg, #2c3e50, #34495e);
      color: #fff;
    }
    .m-btn-recycle {
      background: transparent;
      color: #888;
      border: 1px solid #e8e8e8;
    }

    .m-btn-split {
      background: linear-gradient(135deg, #e67e22, #d35400);
      color: #fff;
    }

    .m-btn-use {
      background: linear-gradient(135deg, #27ae60, #229954);
      color: #fff;
    }

    .m-btn-info {
      font-size: 12px;
      color: #bbb;
      text-align: center;
      padding: 4px 0;
      margin-top: -4px;
    }
    .m-btn-info .price-highlight { color: #e8930c; font-weight: 600; }

    /* 合成成功弹窗 */
    .craft-success {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 350;
      flex-direction: column;
      padding: 20px;
    }
    .craft-success.show { display: flex; animation: fadeIn 0.3s; }
    .craft-success .success-icon {
      width: 80px; height: 80px;
      object-fit: contain;
      margin-bottom: 15px;
      animation: bounce 0.6s infinite;
    }
    .craft-success .success-card {
      background: #fff;
      border-radius: 24px;
      padding: 30px;
      max-width: 300px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: dropBounce 0.5s ease;
    }
    .craft-success h3 { color: #222; font-size: 20px; margin-bottom: 6px; }
    .craft-success p { color: #888; font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
    .craft-success .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #e8930c, #d4740a);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .action-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%) scale(0.8);
      background: rgba(0,0,0,0.78);
      color: #fff;
      padding: 10px 20px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      z-index: 400;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s;
      backdrop-filter: blur(8px);
    }
    .action-toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dropBounce {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>
<body class="bag-page-body">

<div class="bag-page">
  <div class="bag-header">
    <div class="title-wrap">
      <h2>我的背包</h2>
      <p>点击物品管理 · 拖拽移动整叠</p>
    </div>
    <div class="header-right">
      <div class="coin-display" id="coin-display">
        <i data-lucide="coins" style="width:16px;height:16px;"></i>
        <span id="coin-val">186</span>
      </div>
      <button class="sort-btn" onclick="autoSort()" title="整理背包">
        <i data-lucide="arrow-down-up" style="width:18px;height:18px;"></i>
      </button>
    </div>
  </div>

  <div class="bag-info-bar">
    <div class="bag-capacity">
      <div class="bag-capacity-fill" id="capacity-fill" style="width:20%;"></div>
    </div>
    <span class="bag-capacity-text" id="capacity-text">12/40</span>
  </div>

  <div class="grid-container">
    <div class="grid-wrapper" id="grid-wrapper">
      <div class="grid-bg" id="grid-bg"></div>
    </div>
  </div>
</div>

<!-- 物品操作弹窗 -->
<div class="item-modal" id="item-modal" onclick="if(event.target===this)closeItemModal()">
  <div class="item-modal-card">
    <div class="m-top">
      <button class="m-close" onclick="closeItemModal()">&times;</button>
      <div class="m-icon-wrap" id="m-icon-wrap">
        <img id="modal-icon" src="icons/diamond_frag.jpg" alt="物品">
      </div>
      <div class="m-name" id="modal-name">海洋之泪碎片</div>
      <span class="m-qtag" id="modal-quality">史诗</span>
    </div>
    <div class="m-desc" id="modal-desc">集齐 10 片可合成完整「海洋之泪」</div>
    <div class="m-divider"></div>

    <div class="m-count-section" id="count-ctrl">
      <span class="m-count-label">选择数量</span>
      <div class="m-count-row">
        <button class="m-count-btn" id="cc-minus" onclick="adjCount(-1)">−</button>
        <span class="m-count-val" id="cc-val">1</span>
        <button class="m-count-btn" id="cc-plus" onclick="adjCount(1)">+</button>
      </div>
    </div>

    <div class="m-divider"></div>

    <div class="m-actions">
      <button class="m-btn m-btn-use" id="btn-use" onclick="doUse()" style="display:none;">
        <i data-lucide="zap" style="width:15px;height:15px;"></i>
        <span id="use-label">使用</span>
      </button>
      <button class="m-btn m-btn-craft" id="btn-craft" onclick="doCraft()">
        <i data-lucide="sparkles" style="width:18px;height:18px;"></i>
        <span id="craft-label">合成</span>
        <div class="craft-bar" id="craft-bar" style="width:0%"></div>
      </button>
      <button class="m-btn m-btn-market" id="btn-market" onclick="doMarket()">
        <i data-lucide="shopping-cart" style="width:18px;height:18px;"></i> 上架交易行
      </button>
      <button class="m-btn m-btn-recycle" id="btn-recycle" onclick="doRecycle()">
        <i data-lucide="banknote" style="width:18px;height:18px;"></i>
        <span id="recycle-label">回收换得 8 探币</span>
      </button>
      <button class="m-btn m-btn-split" id="btn-split" onclick="doSplit()" style="display:none;">
        <i data-lucide="scissors" style="width:18px;height:18px;"></i>
        <span id="split-label">拆分出 1 个</span>
      </button>
      <div class="m-btn-info" id="m-info-hint"></div>
    </div>
  </div>
</div>

<!-- 合成成功弹窗 -->
<div class="craft-success" id="craft-success">
  <div class="success-card">
    <img class="success-icon" id="craft-success-icon" src="icons/diamond_frag.jpg">
    <h3 id="craft-success-name">合成成功！</h3>
    <p id="craft-success-desc">恭喜获得完整道具</p>
    <button class="btn-primary" onclick="closeCraftSuccess()">太棒了</button>
  </div>
</div>

<div class="action-toast" id="action-toast"></div>

<script>
const GRID_ROWS = 8;
const GRID_COLS = 5;
const CELL_SIZE = 60;
const CELL_GAP = 2;
const GRID_PADDING = 3;

const ITEM_DEFS = {
  diamond_frag:  { id:'diamond_frag',  icon:'icons/diamond_frag.jpg',  name:'海洋之泪碎片', size:{w:1,h:1}, quality:'epic',      type:'fragment', qualityText:'史诗', refPrice:8, desc:'集齐 10 片可合成完整「海洋之泪」' },
  sword_frag:    { id:'sword_frag',    icon:'icons/sword_frag.jpg',    name:'古剑残片',     size:{w:1,h:1}, quality:'rare',       type:'fragment', qualityText:'稀有', refPrice:5, desc:'集齐 8 片可合成完整「青铜古剑」' },
  map_frag:      { id:'map_frag',      icon:'icons/map_frag.jpg',      name:'藏宝图残卷',   size:{w:1,h:1}, quality:'epic',      type:'fragment', qualityText:'史诗', refPrice:10, desc:'集齐 5 片可合成完整「神秘藏宝图」' },
  milk_tea:      { id:'milk_tea',      icon:'icons/milk_tea.jpg',      name:'奶茶券',       size:{w:1,h:1}, quality:'common',     type:'item',    qualityText:'普通', refPrice:20, desc:'可到任意合作门店兑换指定饮品一杯' },
  mask:          { id:'mask',          icon:'icons/mask.jpg',          name:'脸谱道具',     size:{w:1,h:2}, quality:'rare',       type:'item',    qualityText:'稀有', refPrice:35, desc:'非遗系列收藏道具，集齐一整套可兑换实体纪念品' },
  ancient_sword: { id:'ancient_sword', icon:'icons/ancient_sword.jpg', name:'青铜古剑',     size:{w:1,h:3}, quality:'rare',       type:'item',    qualityText:'稀有', refPrice:80, desc:'完整青铜古剑，拥有它可以挑战高级副本' },
  ocean_tear:    { id:'ocean_tear',    icon:'icons/ocean_tear.jpg',    name:'海洋之泪',     size:{w:2,h:2}, quality:'epic',      type:'item',    qualityText:'史诗', refPrice:120, desc:'完整的海洋之泪，可在交易行兑换限定道具' },
  treasure_map:  { id:'treasure_map',  icon:'icons/treasure_map.jpg',   name:'神秘藏宝图',   size:{w:2,h:1}, quality:'legendary',  type:'item',    qualityText:'传说', refPrice:200, desc:'指引你找到隐藏的传说宝箱' },
  potion:        { id:'potion',        icon:'icons/potion.jpg',        name:'神秘药剂',     size:{w:1,h:1}, quality:'epic',      type:'item',    qualityText:'史诗', refPrice:25, desc:'使用后随机获得一种永久 buff' },
  gold_bar:      { id:'gold_bar',      icon:'icons/gold_bar.jpg',      name:'金砖',         size:{w:2,h:1}, quality:'legendary',  type:'item',    qualityText:'传说', refPrice:150, desc:'纯金打造，可在交易行卖个好价钱' },
  signal_amp:    { id:'signal_amp',    icon:'icons/signal_amp.jpg',    name:'信号增幅器',   size:{w:1,h:1}, quality:'rare',       type:'item',    qualityText:'稀有', refPrice:30, desc:'使用后30分钟内扫描范围扩大2倍，发现更多打卡点' },
  radar_module:  { id:'radar_module',  icon:'icons/radar_module.jpg',  name:'雷达模块',     size:{w:1,h:1}, quality:'epic',      type:'item',    qualityText:'史诗', refPrice:55, desc:'使用后60分钟内显示周围所有隐藏宝箱的精确坐标' },
  compass:       { id:'compass',       icon:'icons/compass.jpg',       name:'探宝罗盘',     size:{w:1,h:1}, quality:'rare',       type:'item',    qualityText:'稀有', refPrice:40, desc:'使用后指引最近未探索打卡点的方向，持续45分钟' },
  dog_whistle:   { id:'dog_whistle',   icon:'icons/dog_whistle.jpg',   name:'寻宝犬哨',     size:{w:1,h:1}, quality:'rare',       type:'item',    qualityText:'稀有', refPrice:35, desc:'召唤寻宝犬帮你搜寻附近20米内的隐藏物资' },
};

const RECIPES = {
  diamond_frag: { need:10, resultId:'ocean_tear',   resultName:'海洋之泪' },
  sword_frag:   { need:8,  resultId:'ancient_sword', resultName:'青铜古剑' },
  map_frag:     { need:5,  resultId:'treasure_map',  resultName:'神秘藏宝图' },
};

// 背包实例：{ instanceId, defId, count, row, col }
let bagInstances = [];
let instanceCounter = 0;
let gridState = [];
let dragState = null;
let currentModalItem = null;
let modalSelCount = 1;
let myCoins = 186;

function initGridState() {
  gridState = [];
  for (let r = 0; r < GRID_ROWS; r++) gridState[r] = new Array(GRID_COLS).fill(null);
}

function canPlace(row, col, w, h, excludeId) {
  if (row < 0 || col < 0 || row + h > GRID_ROWS || col + w > GRID_COLS) return false;
  for (let r = row; r < row + h; r++)
    for (let c = col; c < col + w; c++)
      if (gridState[r][c] !== null && gridState[r][c] !== excludeId) return false;
  return true;
}

function occupyGrid(id, row, col, w, h) {
  for (let r = row; r < row + h; r++)
    for (let c = col; c < col + w; c++)
      gridState[r][c] = id;
}

function clearGrid(id) {
  for (let r = 0; r < GRID_ROWS; r++)
    for (let c = 0; c < GRID_COLS; c++)
      if (gridState[r][c] === id) gridState[r][c] = null;
}

function findEmptySlot(w, h) {
  for (let r = 0; r <= GRID_ROWS - h; r++)
    for (let c = 0; c <= GRID_COLS - w; c++)
      if (canPlace(r, c, w, h)) return { row: r, col: c };
  return null;
}

// ===== 初始化 =====
function initBag() {
  initGridState();
  bagInstances = [];
  instanceCounter = 0;

  const initial = [
    { defId:'diamond_frag', count:5 },
    { defId:'sword_frag',   count:6 },
    { defId:'milk_tea',     count:3 },
    { defId:'mask',         count:2 },
    { defId:'map_frag',     count:3 },
    { defId:'ancient_sword',count:1 },
    { defId:'ocean_tear',   count:1 },
    { defId:'potion',       count:1 },
    { defId:'gold_bar',     count:1 },
    { defId:'signal_amp',   count:2 },
    { defId:'radar_module', count:1 },
    { defId:'compass',      count:1 },
    { defId:'dog_whistle',  count:2 },
  ];

  // 按大小降序排列
  const toPlace = [];
  initial.forEach(e => {
    const d = ITEM_DEFS[e.defId];
    if (!d) return;
    toPlace.push({ defId:e.defId, count:e.count, size:d.size });
  });
  toPlace.sort((a, b) => (b.size.w * b.size.h) - (a.size.w * a.size.h));

  toPlace.forEach(item => {
    const pos = findEmptySlot(item.size.w, item.size.h);
    if (pos) {
      const inst = { instanceId: ++instanceCounter, defId: item.defId, count: item.count, row: pos.row, col: pos.col };
      bagInstances.push(inst);
      occupyGrid(inst.instanceId, pos.row, pos.col, item.size.w, item.size.h);
    }
  });
}

// ===== 渲染 =====
function renderGridBg() {
  let h = '';
  for (let r = 0; r < GRID_ROWS; r++)
    for (let c = 0; c < GRID_COLS; c++)
      h += `<div class="grid-cell" data-row="${r}" data-col="${c}"></div>`;
  document.getElementById('grid-bg').innerHTML = h;
}

function renderItems() {
  const w = document.getElementById('grid-wrapper');
  w.querySelectorAll('.grid-item').forEach(el => el.remove());

  bagInstances.forEach(inst => {
    const def = ITEM_DEFS[inst.defId];
    if (!def) return;

    const el = document.createElement('div');
    el.className = `grid-item q-${def.quality} size-${def.size.w}x${def.size.h}`;
    el.dataset.instanceId = inst.instanceId;
    el.style.left = (GRID_PADDING + inst.col * (CELL_SIZE + CELL_GAP)) + 'px';
    el.style.top = (GRID_PADDING + inst.row * (CELL_SIZE + CELL_GAP)) + 'px';
    el.style.width = (def.size.w * CELL_SIZE + (def.size.w - 1) * CELL_GAP) + 'px';
    el.style.height = (def.size.h * CELL_SIZE + (def.size.h - 1) * CELL_GAP) + 'px';

    el.innerHTML = `
      <div class="item-quality-dot q-${def.quality}"></div>
      <img class="item-icon" src="${def.icon}" alt="${def.name}">
      <div class="item-label">${def.name}</div>
    `;

    if (inst.count > 1) {
      const badge = document.createElement('div');
      badge.className = 'item-count';
      badge.textContent = inst.count;
      el.appendChild(badge);
    }

    el.addEventListener('mousedown', e => onDragStart(e, inst));
    el.addEventListener('touchstart', e => onDragStart(e, inst), { passive: false });
    el.addEventListener('dblclick', e => showItemModal(inst));

    w.appendChild(el);
  });

  updateCapacity();
  updateCoinDisplay();
  lucide.createIcons();
}

function updateCoinDisplay() {
  const el = document.getElementById('coin-val');
  if (el) el.textContent = myCoins;
}

function updateCapacity() {
  const total = GRID_ROWS * GRID_COLS;
  let occ = 0;
  for (let r = 0; r < GRID_ROWS; r++)
    for (let c = 0; c < GRID_COLS; c++)
      if (gridState[r][c] !== null) occ++;
  document.getElementById('capacity-text').textContent = occ + '/' + total;
  document.getElementById('capacity-fill').style.width = (occ / total * 100) + '%';
}

// ===== 拖拽 =====
function onDragStart(e, inst) {
  e.preventDefault();
  const def = ITEM_DEFS[inst.defId];
  if (!def) return;

  const cX = e.touches ? e.touches[0].clientX : e.clientX;
  const cY = e.touches ? e.touches[0].clientY : e.clientY;
  const el = document.querySelector(`.grid-item[data-instance-id="${inst.instanceId}"]`);
  if (!el) return;
  const rect = el.getBoundingClientRect();

  dragState = {
    instanceId: inst.instanceId,
    defId: inst.defId,
    count: inst.count,
    size: { w: def.size.w, h: def.size.h },
    el: el,
    srcInst: inst,
    startRow: inst.row,
    startCol: inst.col,
    offsetX: cX - rect.left,
    offsetY: cY - rect.top,
    curRow: inst.row,
    curCol: inst.col,
    moved: false,
  };

  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
  document.addEventListener('touchmove', onDragMove, { passive: false });
  document.addEventListener('touchend', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  e.preventDefault();

  if (!dragState.moved) {
    dragState.moved = true;
    clearGrid(dragState.instanceId);
    dragState.el.classList.add('dragging');
    dragState.el.style.zIndex = '999';
  }

  dragState.moved = true;

  const wr = document.getElementById('grid-wrapper').getBoundingClientRect();
  const cX = e.touches ? e.touches[0].clientX : e.clientX;
  const cY = e.touches ? e.touches[0].clientY : e.clientY;

  const left = cX - wr.left - dragState.offsetX;
  const top = cY - wr.top - dragState.offsetY;
  dragState.el.style.left = left + 'px';
  dragState.el.style.top = top + 'px';

  const col = Math.round((left - GRID_PADDING) / (CELL_SIZE + CELL_GAP));
  const row = Math.round((top - GRID_PADDING) / (CELL_SIZE + CELL_GAP));
  dragState.curRow = row;
  dragState.curCol = col;

  // 清除旧的 placement class
  dragState.el.classList.remove('placement-valid','placement-invalid','placement-swap','placement-merge');

  // 扫描整个覆盖区域，收集所有被覆盖的物品（不只是左上角）
  const overlapIds = new Set();
  for (let r = row; r < row + dragState.size.h; r++)
    for (let c = col; c < col + dragState.size.w; c++) {
      const id = gridState[r]?.[c];
      if (id != null && id !== dragState.instanceId) overlapIds.add(id);
    }

  if (overlapIds.size === 0) {
    // 无冲突 → 可移动
    highlightTarget(row, col, dragState.size.w, dragState.size.h, 'highlight-valid');
    dragState.el.classList.add('placement-valid');
    dragState.dropMode = 'move';
  } else {
    // 收集所有被覆盖的物品
    const overlapItems = [];
    overlapIds.forEach(id => {
      const inst = bagInstances.find(i => i.instanceId === id);
      if (inst) overlapItems.push(inst);
    });

    // 检查是否只有一个同类物品 → 合并
    if (overlapItems.length === 1) {
      const target = overlapItems[0];
      const tDef = ITEM_DEFS[target.defId];
      const sDef = ITEM_DEFS[dragState.defId];
      if (sDef.type === 'fragment' && tDef.type === 'fragment' && target.defId === dragState.defId) {
        const recipe = RECIPES[dragState.defId];
        const total = target.count + (bagInstances.find(i => i.instanceId === dragState.instanceId)?.count || 1);
        if (recipe && total >= recipe.need) {
          highlightTarget(row, col, tDef.size.w, tDef.size.h, 'highlight-merge');
          dragState.el.classList.add('placement-merge');
          dragState.dropMode = 'merge';
          dragState.mergeTarget = target;
        } else {
          highlightTarget(row, col, tDef.size.w, tDef.size.h, 'highlight-valid');
          dragState.el.classList.add('placement-valid');
          dragState.dropMode = 'mergeCount';
          dragState.mergeTarget = target;
        }
        return;
      } else if (target.defId === dragState.defId && sDef.type !== 'fragment') {
        highlightTarget(row, col, tDef.size.w, tDef.size.h, 'highlight-valid');
        dragState.el.classList.add('placement-valid');
        dragState.dropMode = 'mergeCount';
        dragState.mergeTarget = target;
        return;
      }
    }

    // 非同类合并 → 尝试 swap / push / invalid
    const res = canPlaceHere(dragState.instanceId, row, col);
    if (res === 'move') {
      highlightTarget(row, col, dragState.size.w, dragState.size.h, 'highlight-valid');
      dragState.el.classList.add('placement-valid');
      dragState.dropMode = 'move';
    } else if (res === 'swap') {
      highlightTarget(row, col, dragState.size.w, dragState.size.h, 'highlight-target');
      highlightCells(dragState.startRow, dragState.startCol, dragState.size.w, dragState.size.h, 'highlight-push');
      dragState.el.classList.add('placement-swap');
      dragState.dropMode = 'swap';
    } else if (res === 'push') {
      highlightTarget(row, col, dragState.size.w, dragState.size.h, 'highlight-target');
      dragState.el.classList.add('placement-swap');
      dragState.dropMode = 'push';
    } else {
      highlightTarget(row, col, dragState.size.w, dragState.size.h, 'highlight-invalid');
      dragState.el.classList.add('placement-invalid');
      dragState.dropMode = 'invalid';
    }
  }
}

function getItemAt(row, col) {
  const id = gridState[row]?.[col];
  if (!id) return null;
  return bagInstances.find(i => i.instanceId === id);
}

function highlightTarget(row, col, w, h, cls) {
  document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('highlight-valid','highlight-invalid','highlight-target','highlight-push','highlight-merge'));
  for (let r = row; r < row + h; r++)
    for (let c = col; c < col + w; c++) {
      const cell = document.querySelector(`.grid-cell[data-row="${r}"][data-col="${c}"]`);
      if (cell) cell.classList.add(cls);
    }
}

function highlightCells(row, col, w, h, cls) {
  for (let r = row; r < row + h; r++)
    for (let c = col; c < col + w; c++) {
      const cell = document.querySelector(`.grid-cell[data-row="${r}"][data-col="${c}"]`);
      if (cell) cell.classList.add(cls);
    }
}

function canPlaceHere(srcId, tgtRow, tgtCol) {
  const result = evaluateDrop(srcId, tgtRow, tgtCol);
  return result ? result.mode : null;
}

// ===== 纯模拟：不修改 gridState，返回完整放置方案或 null =====
function evaluateDrop(srcId, tgtRow, tgtCol) {
  const src = bagInstances.find(i => i.instanceId === srcId);
  if (!src) return null;
  const def = ITEM_DEFS[src.defId];
  const sw = def.size.w, sh = def.size.h;

  // 边界检查
  if (tgtRow < 0 || tgtCol < 0 || tgtRow + sh > GRID_ROWS || tgtCol + sw > GRID_COLS) return null;

  // 收集目标区域被占用的物品
  const targetIds = new Set();
  for (let r = tgtRow; r < tgtRow + sh; r++)
    for (let c = tgtCol; c < tgtCol + sw; c++) {
      const id = gridState[r]?.[c];
      if (id != null && id !== srcId) targetIds.add(id);
    }

  // 无冲突 → 直接移动
  if (targetIds.size === 0) {
    return { mode: 'move', newPositions: [{ instId: srcId, row: tgtRow, col: tgtCol }] };
  }

  // 收集 targets 完整信息
  const targets = [];
  targetIds.forEach(id => {
    const inst = bagInstances.find(i => i.instanceId === id);
    if (inst) targets.push(inst);
  });
  if (targets.length === 0) return null;

  // 按面积降序排列（大的先放）
  const sorted = [...targets].sort((a, b) => {
    const dA = ITEM_DEFS[a.defId], dB = ITEM_DEFS[b.defId];
    return (dB.size.w * dB.size.h) - (dA.size.w * dA.size.h);
  });

  // --- 尝试 swap：targets 放到 src 原位置区域 ---
  const swapResult = simulatePlacement(sorted, src.row, src.col, sw, sh, srcId, tgtRow, tgtCol, 'swap');
  if (swapResult) {
    return { mode: 'swap', newPositions: swapResult };
  }

  // --- 尝试 push：targets 放到全背包任意空位 ---
  const pushResult = simulatePlacement(sorted, 0, 0, GRID_COLS, GRID_ROWS, srcId, tgtRow, tgtCol, 'push');
  if (pushResult) {
    return { mode: 'push', newPositions: pushResult };
  }

  return null;
}

// 模拟放置 targets，返回完整方案或 null
function simulatePlacement(targets, searchR, searchC, searchW, searchH, srcId, tgtRow, tgtCol, mode) {
  // 构建模拟网格：移除 src 和所有 targets
  const sim = gridState.map(r => [...r]);
  for (let r = 0; r < GRID_ROWS; r++)
    for (let c = 0; c < GRID_COLS; c++)
      if (sim[r][c] === srcId) sim[r][c] = null;
  targets.forEach(t => {
    for (let r = 0; r < GRID_ROWS; r++)
      for (let c = 0; c < GRID_COLS; c++)
        if (sim[r][c] === t.instanceId) sim[r][c] = null;
  });

  // src 放到目标位置
  const srcDef = ITEM_DEFS[bagInstances.find(i => i.instanceId === srcId).defId];
  for (let r = tgtRow; r < tgtRow + srcDef.size.h; r++)
    for (let c = tgtCol; c < tgtCol + srcDef.size.w; c++)
      sim[r][c] = srcId;

  // 逐个放置 targets
  const placements = [{ instId: srcId, row: tgtRow, col: tgtCol }];

  for (const item of targets) {
    const d = ITEM_DEFS[item.defId];
    let found = false;

    if (mode === 'swap') {
      // swap: 只在源区域内搜索
      for (let r = searchR; r <= searchR + searchH - d.size.h && r < GRID_ROWS; r++) {
        for (let c = searchC; c <= searchC + searchW - d.size.w && c < GRID_COLS; c++) {
          if (canPlaceOnSim(sim, r, c, d.size.w, d.size.h)) {
            occupySim(sim, item.instanceId, r, c, d.size.w, d.size.h);
            placements.push({ instId: item.instanceId, row: r, col: c });
            found = true; break;
          }
        }
        if (found) break;
      }
    } else {
      // push: 全背包搜索
      const pos = findEmptyOnSim(sim, d.size.w, d.size.h);
      if (pos) {
        occupySim(sim, item.instanceId, pos.row, pos.col, d.size.w, d.size.h);
        placements.push({ instId: item.instanceId, row: pos.row, col: pos.col });
        found = true;
      }
    }

    if (!found) return null; // 放不下 → 整体失败
  }

  return placements;
}

function canPlaceOnSim(sim, row, col, w, h) {
  if (row < 0 || col < 0 || row + h > GRID_ROWS || col + w > GRID_COLS) return false;
  for (let r = row; r < row + h; r++)
    for (let c = col; c < col + w; c++)
      if (sim[r][c] !== null) return false;
  return true;
}

function occupySim(sim, id, row, col, w, h) {
  for (let r = row; r < row + h; r++)
    for (let c = col; c < col + w; c++)
      sim[r][c] = id;
}

function findEmptyOnSim(sim, w, h) {
  for (let r = 0; r <= GRID_ROWS - h; r++)
    for (let c = 0; c <= GRID_COLS - w; c++)
      if (canPlaceOnSim(sim, r, c, w, h)) return { row: r, col: c };
  return null;
}

function onDragEnd(e) {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('touchend', onDragEnd);

  if (!dragState) return;

  // 纯点击（从未移动）→ 弹出管理界面
  if (!dragState.moved) {
    showItemModal(dragState.srcInst);
    dragState = null;
    return;
  }

  const { instanceId, curRow, curCol, size, startRow, startCol, el, dropMode } = dragState;

  document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('highlight-valid','highlight-invalid','highlight-target','highlight-push','highlight-merge'));
  if (el) {
    el.classList.remove('dragging','placement-valid','placement-invalid','placement-swap','placement-merge');
    el.style.zIndex = '10';
  }

  const srcInst = bagInstances.find(i => i.instanceId === instanceId);
  let changed = false;

  if (dropMode === 'mergeCount') {
    const tgt = dragState.mergeTarget;
    if (tgt && srcInst) {
      tgt.count += srcInst.count;
      bagInstances = bagInstances.filter(i => i.instanceId !== instanceId);
      clearGrid(instanceId);
      changed = true;
    } else {
      occupyGrid(instanceId, startRow, startCol, size.w, size.h);
    }
  } else if (dropMode === 'merge') {
    const tgt = dragState.mergeTarget;
    if (tgt && srcInst) {
      tgt.count += srcInst.count;
      bagInstances = bagInstances.filter(i => i.instanceId !== instanceId);
      clearGrid(instanceId);
      triggerCraft(tgt.defId);
      changed = true;
    } else {
      occupyGrid(instanceId, startRow, startCol, size.w, size.h);
    }
  } else if (dropMode === 'move' || dropMode === 'swap' || dropMode === 'push') {
    // 统一用 evaluateDrop 做原子评估
    const result = evaluateDrop(instanceId, curRow, curCol);
    if (result && (result.mode === 'move' || result.mode === 'swap' || result.mode === 'push')) {
      // 全部成功 → 原子提交：先清除所有涉及物品的旧占位，再按新方案占位
      result.newPositions.forEach(np => clearGrid(np.instId));
      result.newPositions.forEach(np => {
        const npInst = bagInstances.find(i => i.instanceId === np.instId);
        const npDef = npInst ? ITEM_DEFS[npInst.defId] : null;
        if (npInst && npDef) {
          npInst.row = np.row;
          npInst.col = np.col;
          occupyGrid(np.instId, np.row, np.col, npDef.size.w, npDef.size.h);
        }
      });
      if (result.mode === 'swap') {
        const numMoved = result.newPositions.length - 1;
        showToast(numMoved === 1 ? '已交换位置' : numMoved + ' 件物品已互换');
      } else if (result.mode === 'push') {
        const numMoved = result.newPositions.length - 1;
        showToast(numMoved === 1 ? '已推开 1 件物品' : '已推开 ' + numMoved + ' 件物品');
      }
      changed = true;
    } else {
      // 无法放置 → 放回原位
      occupyGrid(instanceId, startRow, startCol, size.w, size.h);
    }
  } else {
    // invalid 或未移动 → 放回原位
    occupyGrid(instanceId, startRow, startCol, size.w, size.h);
  }

  dragState = null;
  // 只要发生过拖拽移动，就必须刷新 DOM（否则 DOM 元素还停在拖拽位置 → 视觉重叠）
  renderItems();
}

// ===== 物品弹窗 =====
function showItemModal(inst) {
  if (!inst) return;
  const def = ITEM_DEFS[inst.defId];
  if (!def) return;
  currentModalItem = inst;
  modalSelCount = 1;

  document.getElementById('modal-icon').src = def.icon;
  const iconWrap = document.getElementById('m-icon-wrap');
  iconWrap.className = 'm-icon-wrap q-' + def.quality;

  document.getElementById('modal-name').textContent = def.name;
  document.getElementById('modal-quality').textContent = def.qualityText;
  const qColors = { legendary:'background:rgba(232,147,12,0.12);color:#e8930c', epic:'background:rgba(155,89,182,0.10);color:#8e44ad', rare:'background:rgba(52,152,219,0.10);color:#2980b9', common:'background:rgba(149,165,166,0.12);color:#7f8c8d' };
  document.getElementById('modal-quality').style.cssText = qColors[def.quality] || qColors.common;

  document.getElementById('modal-desc').textContent = def.desc;

  const ctrl = document.getElementById('count-ctrl');
  const btnSplit = document.getElementById('btn-split');
  if (inst.count > 1) {
    ctrl.style.display = 'flex';
    btnSplit.style.display = 'flex';
    document.getElementById('cc-val').textContent = '1';
    document.getElementById('split-label').textContent = '拆分出 1 个';
    updateCountBtns();
  } else {
    ctrl.style.display = 'none';
    btnSplit.style.display = 'none';
  }

  const btnCraft = document.getElementById('btn-craft');
  const craftLabel = document.getElementById('craft-label');
  const craftBar = document.getElementById('craft-bar');
  const recipe = RECIPES[inst.defId];
  if (recipe) {
    btnCraft.style.display = 'flex';
    const frags = getTotalCount(inst.defId);
    const pct = Math.min(100, frags / recipe.need * 100);
    craftLabel.textContent = '合成 ' + recipe.resultName;
    craftBar.style.width = pct + '%';
    btnCraft.disabled = frags < recipe.need;
    if (frags < recipe.need) {
      craftLabel.textContent += ' (' + frags + '/' + recipe.need + ')';
    }
  } else {
    btnCraft.style.display = 'none';
  }

  // 使用按钮：成品物品显示
  const btnUse = document.getElementById('btn-use');
  if (def.type !== 'fragment') {
    btnUse.style.display = 'flex';
    document.getElementById('use-label').textContent = '使用' + def.name;
  } else {
    btnUse.style.display = 'none';
  }

  const btnMarket = document.getElementById('btn-market');
  if (def.type === 'fragment') {
    btnMarket.disabled = true;
    btnMarket.innerHTML = '<i data-lucide="shopping-cart" style="width:18px;height:18px;"></i> 合成后才能上架';
  } else {
    btnMarket.disabled = false;
    btnMarket.innerHTML = '<i data-lucide="shopping-cart" style="width:18px;height:18px;"></i> 上架交易行';
  }

  const price = (def.refPrice || 1) * modalSelCount;
  document.getElementById('recycle-label').textContent = '回收换得 ' + price + ' 探币';

  const hint = document.getElementById('m-info-hint');
  hint.textContent = '占 ' + def.size.w + '\u00d7' + def.size.h + ' 格 \u00b7 共拥有 ' + getTotalCount(inst.defId) + ' 个';
  if (def.refPrice > 0) {
    hint.innerHTML += ' \u00b7 单价 <span class="price-highlight">' + def.refPrice + '</span> 探币';
  }

  document.getElementById('item-modal').classList.add('show');
  lucide.createIcons();
}

function getTotalCount(defId) {
  return bagInstances.filter(i => i.defId === defId).reduce((s, i) => s + i.count, 0);
}

function adjCount(d) {
  if (!currentModalItem) return;
  modalSelCount = Math.max(1, Math.min(modalSelCount + d, currentModalItem.count));
  document.getElementById('cc-val').textContent = modalSelCount;
  document.getElementById('split-label').textContent = '拆分出 ' + modalSelCount + ' 个';
  updateCountBtns();
  const def = ITEM_DEFS[currentModalItem.defId];
  const price = (def.refPrice || 1) * modalSelCount;
  document.getElementById('recycle-label').textContent = '回收换得 ' + price + ' 探币';
}

function updateCountBtns() {
  const max = currentModalItem?.count || 1;
  document.getElementById('cc-minus').disabled = modalSelCount <= 1;
  document.getElementById('cc-plus').disabled = modalSelCount >= max;
  const btnSplit = document.getElementById('btn-split');
  if (btnSplit) btnSplit.disabled = modalSelCount >= max;
}

function closeItemModal() {
  document.getElementById('item-modal').classList.remove('show');
  currentModalItem = null;
}

// ===== 操作 =====
function doCraft() {
  if (!currentModalItem) return;
  triggerCraft(currentModalItem.defId);
  closeItemModal();
}

function triggerCraft(defId) {
  const recipe = RECIPES[defId];
  if (!recipe) return;
  let total = getTotalCount(defId);
  if (total < recipe.need) { showToast('碎片还不够哦'); return; }

  // 消耗碎片
  let deducted = 0;
  bagInstances = bagInstances.filter(i => {
    if (i.defId === defId && deducted < recipe.need) {
      const take = Math.min(i.count, recipe.need - deducted);
      i.count -= take;
      deducted += take;
      if (i.count <= 0) { clearGrid(i.instanceId); return false; }
    }
    return true;
  });

  // 生成成品
  const resultDef = ITEM_DEFS[recipe.resultId];
  if (resultDef) {
    const pos = findEmptySlot(resultDef.size.w, resultDef.size.h);
    if (pos) {
      const inst = { instanceId: ++instanceCounter, defId: resultDef.id, count: 1, row: pos.row, col: pos.col };
      bagInstances.push(inst);
      occupyGrid(inst.instanceId, pos.row, pos.col, resultDef.size.w, resultDef.size.h);
    }
  }

  document.getElementById('craft-success-icon').src = resultDef ? resultDef.icon : '';
  document.getElementById('craft-success-name').textContent = '合成「' + recipe.resultName + '」成功！';
  document.getElementById('craft-success-desc').textContent = '消耗 ' + recipe.need + ' 个碎片，获得完整道具';
  document.getElementById('craft-success').classList.add('show');
  renderItems();
}

function doMarket() {
  if (!currentModalItem) return;
  const def = ITEM_DEFS[currentModalItem.defId];
  if (def.type === 'fragment') { showToast('碎片需要合成后才能上架交易行'); return; }
  closeItemModal();
  window.parent?.postMessage?.({ action:'navigate', page:'market', itemId:currentModalItem.defId }, '*');
}

function doRecycle() {
  if (!currentModalItem) return;
  const def = ITEM_DEFS[currentModalItem.defId];
  const count = currentModalItem.count > 1 ? modalSelCount : 1;
  const price = (def.refPrice || 1) * count;

  currentModalItem.count -= count;
  if (currentModalItem.count <= 0) {
    clearGrid(currentModalItem.instanceId);
    bagInstances = bagInstances.filter(i => i.instanceId !== currentModalItem.instanceId);
  }

  myCoins += price;
  showToast('回收获得 ' + price + ' 探币');
  closeItemModal();
  renderItems();
}

function doSplit() {
  if (!currentModalItem) return;
  const splitCount = modalSelCount;
  const remain = currentModalItem.count - splitCount;
  if (remain <= 0) { showToast('至少保留 1 个'); return; }

  const def = ITEM_DEFS[currentModalItem.defId];
  // 找空位放拆分出的物品
  const pos = findEmptySlot(def.size.w, def.size.h);
  if (!pos) { showToast('背包空间不足，无法拆分'); return; }

  // 创建新实例
  currentModalItem.count = remain;
  const newInst = { instanceId: ++instanceCounter, defId: currentModalItem.defId, count: splitCount, row: pos.row, col: pos.col };
  bagInstances.push(newInst);
  occupyGrid(newInst.instanceId, pos.row, pos.col, def.size.w, def.size.h);

  showToast('已拆分出 ' + splitCount + ' 个' + def.name);
  closeItemModal();
  renderItems();
}

function doUse() {
  if (!currentModalItem) return;
  const def = ITEM_DEFS[currentModalItem.defId];
  const count = currentModalItem.count > 1 ? modalSelCount : 1;

  // 扣除使用数量
  currentModalItem.count -= count;
  if (currentModalItem.count <= 0) {
    clearGrid(currentModalItem.instanceId);
    bagInstances = bagInstances.filter(i => i.instanceId !== currentModalItem.instanceId);
  }

  // 不同物品不同效果文案
  let msg = '已使用 ' + count + ' 个' + def.name;
  if (def.id === 'potion') msg = '使用了神秘药剂，获得随机 buff：探宝成功率+15%（8小时）';
  else if (def.id === 'gold_bar') msg = '使用了金砖，直接获得 150 探币';
  else if (def.id === 'treasure_map') msg = '使用了藏宝图，地图上已标注新的隐藏宝箱位置';
  else if (def.id === 'mask') msg = '使用了脸谱道具，非遗图鉴已收录';
  else if (def.id === 'ocean_tear') msg = '使用了海洋之泪，获得水系探宝加成';
  else if (def.id === 'ancient_sword') msg = '装备了青铜古剑，可挑战高级副本';
  else if (def.id === 'signal_amp') msg = '信号增幅器已激活！扫描范围扩大2倍，持续30分钟';
  else if (def.id === 'radar_module') msg = '雷达模块已启动！显示周围所有隐藏宝箱坐标，持续60分钟';
  else if (def.id === 'compass') msg = '探宝罗盘已校准！正指向最近的未探索打卡点，持续45分钟';
  else if (def.id === 'dog_whistle') msg = '寻宝犬已出发！正在搜寻附近20米内的隐藏物资';

  if (def.id === 'gold_bar') myCoins += 150 * count;

  showToast(msg);
  closeItemModal();
  renderItems();
}

function closeCraftSuccess() {
  document.getElementById('craft-success').classList.remove('show');
}

// ===== 自动整理 / Toast =====
function autoSort() {
  bagInstances.forEach(i => clearGrid(i.instanceId));
  bagInstances.sort((a, b) => {
    const qOrder = { legendary:0, epic:1, rare:2, common:3 };
    const dA = ITEM_DEFS[a.defId], dB = ITEM_DEFS[b.defId];
    const qDiff = (qOrder[dA.quality]||9) - (qOrder[dB.quality]||9);
    if (qDiff !== 0) return qDiff;
    return (dB.size.w * dB.size.h) - (dA.size.w * dA.size.h);
  });
  const unplaced = [];
  bagInstances.forEach(i => {
    const d = ITEM_DEFS[i.defId];
    const pos = findEmptySlot(d.size.w, d.size.h);
    if (pos) { i.row = pos.row; i.col = pos.col; occupyGrid(i.instanceId, pos.row, pos.col, d.size.w, d.size.h); }
    else unplaced.push(i);
  });
  bagInstances = bagInstances.filter(i => !unplaced.includes(i)).concat(unplaced);
  showToast('整理完成');
  renderItems();
}

function showToast(msg) {
  const t = document.getElementById('action-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1500);
}

// ===== 启动 =====
renderGridBg();
initBag();
renderItems();
lucide.createIcons();
</script>
