<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开箱</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }

    .chest-page {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #f5f5f5 0%, #e8e8e8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ===== 阶段1：雷达扫描 ===== */
    .radar-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .radar-wrap.show { display: flex; }
    .radar-circle {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(232,147,12,0.3);
    }
    .radar-circle:nth-child(1) { width: 60px; height: 60px; animation: radarPulse 2s infinite; }
    .radar-circle:nth-child(2) { width: 120px; height: 120px; animation: radarPulse 2s infinite 0.5s; }
    .radar-circle:nth-child(3) { width: 180px; height: 180px; animation: radarPulse 2s infinite 1s; }
    .radar-dot {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e8930c;
      animation: radarDot 1.5s infinite;
    }
    .radar-center {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8930c, #d68310);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(232,147,12,0.4);
      animation: radarCenter 1s infinite;
    }
    @keyframes radarPulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    @keyframes radarDot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes radarCenter {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* ===== 阶段2：进度验证 ===== */
    .verify-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .verify-wrap.show { display: flex; }
    .verify-progress {
      width: 200px;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
    }
    .verify-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e8930c, #f5b041);
      border-radius: 3px;
      transition: width 0.3s;
    }
    .verify-check {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: #27ae60;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: #fff;
      animation: checkPop 0.4s ease;
      box-shadow: 0 4px 20px rgba(39,174,96,0.4);
    }
    .verify-check.show { display: flex; }
    @keyframes checkPop {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* ===== 阶段3：宝箱 ===== */
    .chest-wrap {
      position: relative;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .chest-wrap.show { display: flex; }
    .chest-outer {
      position: relative;
      width: 140px;
      height: 110px;
      cursor: pointer;
    }
    .chest-outer.shaking { animation: chestShake 0.15s infinite; }
    @keyframes chestShake {
      0%, 100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(-3px) rotate(-1deg); }
      75% { transform: translateX(3px) rotate(1deg); }
    }
    .chest-body {
      position: absolute;
      bottom: 0;
      width: 140px;
      height: 80px;
      background: linear-gradient(180deg, #8B6914, #6B4F0B);
      border-radius: 8px 8px 14px 14px;
      border: 3px solid #D4A843;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 30px rgba(139,105,20,0.3);
    }
    .chest-lid {
      position: absolute;
      top: 0;
      width: 140px;
      height: 40px;
      background: linear-gradient(180deg, #A67C2E, #8B6914);
      border-radius: 14px 14px 4px 4px;
      border: 3px solid #D4A843;
      border-bottom: none;
      transform-origin: bottom center;
      transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 2;
    }
    .chest-lid.open { transform: rotateX(-110deg); }
    .chest-lock {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 32px;
      background: linear-gradient(180deg, #D4A843, #B8922A);
      border-radius: 4px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.3s;
    }
    .chest-lock.open {
      transform: translateX(-50%) scale(0);
      opacity: 0;
    }

    /* 开箱粒子 */
    .particles {
      position: absolute;
      top: 50%; left: 50%;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e8930c;
      opacity: 0;
    }
    .particle.p1 { animation: particleFly 1s ease-out 0s forwards; }
    .particle.p2 { animation: particleFly 1s ease-out 0.1s forwards; }
    .particle.p3 { animation: particleFly 1s ease-out 0.2s forwards; }
    .particle.p4 { animation: particleFly 1s ease-out 0.3s forwards; }
    .particle.p5 { animation: particleFly 1s ease-out 0.4s forwards; }
    .particle.p6 { animation: particleFly 1s ease-out 0.5s forwards; }
    .particle.p7 { animation: particleFly 1s ease-out 0.6s forwards; }
    .particle.p8 { animation: particleFly 1s ease-out 0.7s forwards; }
    @keyframes particleFly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* 光柱 */
    .light-beam {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) scaleY(0);
      width: 80px;
      height: 200px;
      background: linear-gradient(180deg, rgba(232,147,12,0.6), transparent);
      border-radius: 50% 50% 0 0;
      filter: blur(20px);
      opacity: 0;
      transition: all 0.5s;
    }
    .light-beam.show {
      transform: translateX(-50%) scaleY(1);
      opacity: 1;
    }

    /* ===== 阶段4：物品飞出 ===== */
    .fly-item {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 80px;
      z-index: 50;
      filter: drop-shadow(0 0 30px rgba(232,147,12,0.6));
      animation: flyOut 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
    }
    @keyframes flyOut {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); }
      60% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    }

    /* ===== 阶段5：结果展示 ===== */
    .result-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(15px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .result-overlay.show { display: flex; opacity: 1; }

    .result-card {
      background: #fff;
      border-radius: 28px;
      padding: 32px 28px;
      max-width: 300px;
      width: 85%;
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      overflow: hidden;
    }
    .result-overlay.show .result-card { transform: scale(1); }

    /* 品质光效背景 */
    .result-glow {
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      border-radius: 50%;
      opacity: 0.15;
      filter: blur(40px);
      animation: glowRotate 4s linear infinite;
    }
    @keyframes glowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .result-quality {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
      animation: qualityPulse 1.5s infinite;
    }
    @keyframes qualityPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .result-icon {
      position: relative;
      z-index: 1;
      font-size: 72px;
      margin-bottom: 12px;
      animation: iconBounce 0.6s ease;
    }
    @keyframes iconBounce {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .result-name {
      position: relative;
      z-index: 1;
      font-size: 20px;
      font-weight: 700;
      color: #222;
      margin-bottom: 8px;
    }
    .result-desc {
      position: relative;
      z-index: 1;
      color: #888;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .result-stars {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 20px;
    }
    .result-stars .star {
      font-size: 20px;
      opacity: 0;
      animation: starIn 0.3s ease forwards;
    }
    .result-stars .star:nth-child(1) { animation-delay: 0.3s; }
    .result-stars .star:nth-child(2) { animation-delay: 0.45s; }
    .result-stars .star:nth-child(3) { animation-delay: 0.6s; }
    .result-stars .star:nth-child(4) { animation-delay: 0.75s; }
    .result-stars .star:nth-child(5) { animation-delay: 0.9s; }
    @keyframes starIn {
      from { transform: scale(0) rotate(-180deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }

    .result-btn {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #e8930c, #d68310);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    /* 状态文字 */
    .chest-status {
      margin-top: 30px;
      font-size: 16px;
      color: #444;
      font-weight: 600;
      text-align: center;
    }
    .chest-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #999;
      text-align: center;
      line-height: 1.6;
    }

    /* 跳过按钮 */
    .skip-btn {
      position: absolute;
      top: 16px; right: 16px;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(255,255,255,0.8);
      color: #999;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      backdrop-filter: blur(10px);
    }

    /* 开始按钮 */
    .start-btn {
      padding: 16px 48px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #e8930c, #d68310);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 8px 30px rgba(232,147,12,0.3);
      animation: startPulse 2s infinite;
    }
    @keyframes startPulse {
      0%, 100% { box-shadow: 0 8px 30px rgba(232,147,12,0.3); }
      50% { box-shadow: 0 8px 40px rgba(232,147,12,0.5); }
    }
  </style>
</head>
<body class="chest-page-body">

<div class="chest-page">
  <button class="skip-btn" id="skip-btn" onclick="skipAnim()" style="display:none;">跳过</button>

  <!-- 开始界面 -->
  <div id="stage-start" style="display:flex;flex-direction:column;align-items:center;gap:20px;">
    <div style="font-size:80px;filter:drop-shadow(0 4px 12px rgba(232,147,12,0.3));"><i data-lucide="gift" style="width:60px;height:60px;color:#e8930c;opacity:0.8;"></i></div>
    <div style="font-size:18px;font-weight:700;color:#222;">发现宝箱！</div>
    <div style="font-size:13px;color:#999;text-align:center;">蓝牙信号已锁定<br>点击下方按钮开始开箱</div>
    <button class="start-btn" onclick="startAnim()"><i data-lucide="unlock"></i>开始开箱</button>
  </div>

  <!-- 阶段1：雷达扫描 -->
  <div class="radar-wrap" id="stage-radar">
    <div class="radar-circle"></div>
    <div class="radar-circle"></div>
    <div class="radar-circle"></div>
    <div class="radar-dot" style="top:20%;left:30%;"></div>
    <div class="radar-dot" style="top:70%;left:20%;animation-delay:0.3s;"></div>
    <div class="radar-dot" style="top:60%;left:75%;animation-delay:0.6s;"></div>
    <div class="radar-center"><i data-lucide="search" style="width:22px;height:22px;color:#fff;"></i></div>
  </div>

  <!-- 阶段2：验证 -->
  <div class="verify-wrap" id="stage-verify">
    <div class="verify-check" id="verify-check">✓</div>
    <div class="verify-progress" id="verify-bar-wrap">
      <div class="verify-progress-fill" id="verify-bar"></div>
    </div>
  </div>

  <!-- 阶段3：宝箱 -->
  <div class="chest-wrap" id="stage-chest">
    <div class="chest-outer" id="chest-outer" onclick="openChest()">
      <div class="chest-lid" id="chest-lid"></div>
      <div class="chest-body" id="chest-body"></div>
      <div class="chest-lock" id="chest-lock"><i data-lucide="lock" style="width:14px;height:14px;color:#fff;"></i></div>
      <div class="light-beam" id="light-beam"></div>
    </div>
  </div>

  <!-- 状态文字 -->
  <div class="chest-status" id="chest-status"></div>
  <div class="chest-hint" id="chest-hint"></div>
</div>

<!-- 结果 -->
<div class="result-overlay" id="result-overlay">
  <div class="result-card">
    <div class="result-glow" id="result-glow" style="background:#e8930c;"></div>
    <div class="result-quality" id="result-quality">史诗掉落！</div>
    <div class="result-stars" id="result-stars">
      <span class="star">*</span><span class="star">*</span><span class="star">*</span>
    </div>
    <div class="result-icon" id="result-icon"></div>
    <div class="result-name" id="result-name">海洋之泪碎片</div>
    <div class="result-desc" id="result-desc">集齐 10 片可合成完整「海洋之泪」</div>
    <button class="result-btn" onclick="collectDrop()"><i data-lucide="package"></i>收入背包</button>
  </div>
</div>

<script>
function $(id) { return document.getElementById(id); }

const DROPS = {
  purple: { quality:'史诗掉落！', qBg:'rgba(155,89,182,0.15)', qColor:'#8e44ad', stars:5, icon:'✦', name:'海洋之泪碎片', desc:'集齐 10 片可合成完整「海洋之泪」，兑换限定皮肤或奶茶券', glow:'#9b59b6' },
  gold:   { quality:'稀有掉落！', qBg:'rgba(52,152,219,0.15)', qColor:'#2980b9', stars:4, icon:'★', name:'泡泡玛特盲盒兑换券', desc:'凭券可到门店兑换指定系列盲盒一个', glow:'#3498db' },
  blue:   { quality:'稀有掉落！', qBg:'rgba(52,152,219,0.15)', qColor:'#2980b9', stars:4, icon:'◆', name:'青铜古剑残片', desc:'集齐 8 片可合成完整「青铜古剑」道具', glow:'#3498db' },
  green:  { quality:'普通掉落',   qBg:'rgba(149,165,166,0.15)', qColor:'#7f8c8d', stars:3, icon:'●', name:'奶茶兑换券', desc:'可到任意合作门店兑换指定饮品一杯', glow:'#95a5a6' },
};

const urlParams = new URLSearchParams(window.location.search);
let pointId = urlParams.get('point') || 'purple';
let animStage = 0;
let _timers = [];
let _scanInterval = null;

const statusEl = $('chest-status');
const hintEl = $('chest-hint');
const skipBtn = $('skip-btn');

function setStatus(s, h) {
  statusEl.textContent = s;
  hintEl.textContent = h || '';
}

function showStage(id) {
  ['stage-start','stage-radar','stage-verify','stage-chest'].forEach(s => {
    $(s).classList.remove('show');
  });
  if (id) $(id).classList.add('show');
}

function startAnim() {
  // 清除所有待执行的定时器
  _timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  _timers = [];
  if (_scanInterval) { clearInterval(_scanInterval); _scanInterval = null; }

  skipBtn.style.display = 'block';
  $('stage-start').style.display = 'none';
  showStage('stage-radar');
  setStatus('正在扫描蓝牙信号...', '请保持靠近打卡点');
  animStage = 1;

  _timers.push(setTimeout(() => {
    showStage('stage-verify');
    setStatus('正在验证位置...', '');
    animStage = 2;

    // 进度条动画
    const bar = $('verify-bar');
    let pct = 0;
    _scanInterval = setInterval(() => {
      pct += Math.random() * 20 + 10;
      if (pct >= 100) {
        pct = 100;
        clearInterval(_scanInterval);
        _scanInterval = null;
        $('verify-check').classList.add('show');
        setStatus('验证通过！', '');
        _timers.push(setTimeout(() => {
          showStage('stage-chest');
          setStatus('点击宝箱开启', '宝库已解锁');
          animStage = 3;
        }, 600));
      }
      bar.style.width = pct + '%';
    }, 200);
  }, 2000));
}

function openChest() {
  if (animStage !== 3) return;
  animStage = 4;

  const outer = $('chest-outer');
  const lid = $('chest-lid');
  const lock = $('chest-lock');
  const body = $('chest-body');
  const beam = $('light-beam');

  // 震动
  outer.classList.add('shaking');
  setStatus('开箱中...', '');

  _timers.push(setTimeout(() => {
    outer.classList.remove('shaking');
    lid.classList.add('open');
    lock.classList.add('open');
    body.textContent = '';
    beam.classList.add('show');
    setStatus('发现宝藏！', '');

    // 粒子爆炸
    spawnParticles();

    // 物品飞出
    _timers.push(setTimeout(() => {
      showDrop();
    }, 600));
  }, 800));
}

function spawnParticles() {
  const outer = $('chest-outer');
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'particle p' + (i + 1);
    const angle = (i / 8) * Math.PI * 2;
    const dist = 60 + Math.random() * 60;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    p.style.background = ['#e8930c','#f5b041','#fff','#ffeb3b'][Math.floor(Math.random()*4)];
    outer.appendChild(p);
  }
}

function showDrop() {
  const drop = DROPS[pointId] || DROPS.purple;

  const glow = $('result-glow');
  glow.style.background = drop.glow;

  const qEl = $('result-quality');
  qEl.textContent = drop.quality;
  qEl.style.background = drop.qBg;
  qEl.style.color = drop.qColor;

  // 星星
  const starsEl = $('result-stars');
  starsEl.innerHTML = '';
  for (let i = 0; i < drop.stars; i++) {
    const s = document.createElement('span');
    s.className = 'star';
    s.textContent = '*';
    s.style.animationDelay = (0.3 + i * 0.15) + 's';
    starsEl.appendChild(s);
  }

  $('result-icon').textContent = drop.icon;
  $('result-name').textContent = drop.name;
  $('result-desc').textContent = drop.desc;

  $('result-overlay').classList.add('show');
  skipBtn.style.display = 'none';
  lucide.createIcons();
}

function collectDrop() {
  $('result-overlay').classList.remove('show');
  window.parent.postMessage({ action: 'navigate', page: 'map' }, '*');
}

function skipAnim() {
  // 清除所有待执行的定时器
  _timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  _timers = [];
  if (_scanInterval) { clearInterval(_scanInterval); _scanInterval = null; }
  showDrop();
}
</script>

<script>lucide.createIcons();</script>

</body>
</html>
