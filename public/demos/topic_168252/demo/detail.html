<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打卡点详情</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }

    .detail-page {
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* ===== 顶部大图 ===== */
    .detail-hero {
      position: relative;
      height: 280px;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 20px 24px;
    }
    .hero-img {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    .hero-gradient {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.02) 35%,
        rgba(0,0,0,0.45) 100%);
      z-index: 1;
    }
    .detail-back {
      position: absolute;
      top: 16px; left: 16px;
      width: 36px; height: 36px;
      border-radius: 12px;
      background: rgba(255,255,255,0.95);
      border: none;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      color: #333;
      backdrop-filter: blur(10px);
    }
    .detail-hero .hero-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
    }
    .hero-tag {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }
    .hero-tag.quality-epic { background: rgba(155,89,182,0.25); color: #fff; }
    .hero-tag.quality-rare { background: rgba(52,152,219,0.25); color: #fff; }
    .hero-tag.quality-common { background: rgba(255,255,255,0.25); color: #eee; }
    .hero-tag.walk { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); }
    .detail-hero h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
      position: relative;
      z-index: 2;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    .detail-hero .hero-meta {
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .hero-meta span { display: flex; align-items: center; gap: 4px; }

    /* ===== 信息卡片 ===== */
    .info-cards {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      margin-top: -16px;
      position: relative;
      z-index: 3;
      flex-shrink: 0;
    }
    .info-card {
      flex: 1;
      background: #fff;
      border-radius: 16px;
      padding: 16px 12px 12px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.04);
    }
    .info-card .ic-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .info-card .ic-icon.ic-gold { background: rgba(232,147,12,0.12); color: #e8930c; }
    .info-card .ic-icon.ic-coin { background: rgba(241,196,15,0.12); color: #f1c40f; }
    .info-card .ic-icon.ic-fire { background: rgba(231,76,60,0.10); color: #e74c3c; }
    .info-card .ic-value { font-size: 20px; font-weight: 800; color: #1a1a1a; margin-bottom: 2px; }
    .info-card .ic-label { font-size: 11px; color: #999; }

    /* ===== 内容区 ===== */
    .detail-body { padding: 0 16px; flex: 1; }

    .section-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
      border: 1px solid rgba(0,0,0,0.04);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .section-card .sc-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .section-card .sc-icon {
      width: 32px; height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .section-card .sc-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      flex: 1;
    }
    .section-card .sc-badge {
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* 打卡模式 */
    .mode-card {
      background: linear-gradient(135deg, #fffdf7, #fff8e8);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(232,147,12,0.12);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .mode-card .mode-icon-wrap {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e8930c, #f0a020);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
    }
    .mode-card .mode-content { flex: 1; min-width: 0; }
    .mode-card .mode-title {
      font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px;
    }
    .mode-card .mode-desc {
      font-size: 13px; color: #777; line-height: 1.6;
    }

    /* 奖励池 */
    .reward-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .reward-line {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      background: #f9f9f9;
      border-radius: 14px;
      transition: transform 0.15s;
      border: 1px solid transparent;
    }
    .reward-line:active { transform: scale(0.98); background: #f2f2f2; }
    .reward-line .rl-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 1px solid rgba(0,0,0,0.06);
      flex-shrink: 0;
    }
    .reward-line .rl-info { flex: 1; min-width: 0; }
    .reward-line .rl-name { font-size: 14px; font-weight: 600; color: #222; }
    .reward-line .rl-prob-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }
    .reward-line .rl-prob-bar {
      flex: 1; height: 4px;
      background: #e8e8e8;
      border-radius: 2px;
      overflow: hidden;
    }
    .reward-line .rl-prob-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .reward-line .rl-prob {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
    }
    .reward-line .rl-tag {
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      letter-spacing: 0.3px;
    }
    .rl-epic { background: rgba(155,89,182,0.10); color: #8e44ad; }
    .rl-rare { background: rgba(52,152,219,0.10); color: #2980b9; }
    .rl-common { background: rgba(149,165,166,0.12); color: #7f8c8d; }
    .bar-epic { background: linear-gradient(90deg, #8e44ad, #c39bd3); }
    .bar-rare { background: linear-gradient(90deg, #2980b9, #85c1e9); }
    .bar-common { background: linear-gradient(90deg, #95a5a6, #d5dbdb); }

    /* 文化背景 */
    .culture-text {
      color: #555;
      font-size: 14px;
      line-height: 1.85;
      margin-bottom: 14px;
    }
    .culture-text .highlight {
      color: #e8930c;
      font-weight: 600;
      background: rgba(232,147,12,0.08);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .culture-img-placeholder {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #f0e6d8 0%, #e8ddd0 40%, #d8cbb8 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .culture-img-placeholder::before {
      content: '';
      position: absolute;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      top: 20px; left: 50%;
      transform: translateX(-50%);
    }
    .culture-img-placeholder::after {
      content: '';
      position: absolute;
      width: 120px; height: 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.25);
      bottom: 30px; left: 50%;
      transform: translateX(-50%);
    }

    /* 附近推荐 */
    .nearby-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 4px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .nearby-item {
      min-width: 130px;
      flex-shrink: 0;
      scroll-snap-align: start;
      background: #f9f9f9;
      border-radius: 14px;
      padding: 14px 12px;
      cursor: pointer;
      text-align: center;
      border: 1px solid rgba(0,0,0,0.04);
      transition: background 0.2s;
    }
    .nearby-item:active { background: #eee; }
    .nearby-item .nb-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      margin: 0 auto 8px;
    }
    .nearby-item .nb-dot.dot-epic { background: #8e44ad; }
    .nearby-item .nb-dot.dot-rare { background: #2980b9; }
    .nearby-item .nb-dot.dot-common { background: #95a5a6; }
    .nearby-item .nb-name {
      font-size: 13px; font-weight: 600; color: #222;
      margin-bottom: 2px;
    }
    .nearby-item .nb-dist {
      font-size: 11px; color: #999;
    }

    /* 底部按钮 */
    .detail-action {
      padding: 12px 16px 20px;
      background: linear-gradient(180deg, rgba(245,245,245,0) 0%, rgba(245,245,245,0.92) 16%, rgba(245,245,245,0.98) 100%);
      flex-shrink: 0;
    }
    .detail-action .btn-primary {
      width: 100%;
      justify-content: center;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 16px;
      letter-spacing: 0.5px;
    }

    /* ===== 谜题弹窗 ===== */
    .puzzle-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      z-index: 500;
    }
    .puzzle-overlay.show { display: flex; animation: fadeIn 0.25s; }
    .puzzle-card {
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 28px 24px 32px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      position: relative;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .puzzle-card .pz-lock {
      width: 52px; height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #e8930c, #d4740a);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      color: #fff;
    }
    .puzzle-card h3 { font-size: 18px; color: #1a1a1a; margin-bottom: 4px; font-weight: 700; }
    .puzzle-card .pz-subtitle { font-size: 13px; color: #999; margin-bottom: 18px; }
    .puzzle-card .pz-question {
      background: #f9f7f5;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: left;
      border: 1px solid rgba(232,147,12,0.08);
    }
    .puzzle-card .pz-question .q-label {
      font-size: 11px; color: #e8930c; font-weight: 700; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 1.5px;
    }
    .puzzle-card .pz-question .q-text {
      font-size: 15px; color: #333; line-height: 1.6; font-weight: 500;
    }
    .puzzle-card .pz-ar-hint {
      background: rgba(103,58,183,0.05);
      border: 1px solid rgba(103,58,183,0.10);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
    }
    .puzzle-card .pz-ar-hint .hint-label {
      font-size: 11px; color: #673ab7; font-weight: 700; margin-bottom: 2px;
    }
    .puzzle-card .pz-ar-hint .hint-text {
      font-size: 12px; color: #888; line-height: 1.5;
    }
    .puzzle-card .pz-input {
      width: 100%; padding: 14px 16px;
      border: 2px solid #e8e8e8; border-radius: 14px;
      font-size: 16px; font-family: inherit; outline: none;
      transition: border-color 0.2s; margin-bottom: 14px; box-sizing: border-box;
    }
    .puzzle-card .pz-input:focus { border-color: #e8930c; }
    .puzzle-card .pz-input.error {
      border-color: #e74c3c; animation: shake 0.4s;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .puzzle-card .pz-submit {
      width: 100%; padding: 15px;
      font-size: 16px; font-weight: 700; font-family: inherit;
      background: linear-gradient(135deg, #e8930c, #d4740a);
      color: #fff; border: none; border-radius: 14px; cursor: pointer;
      transition: all 0.2s;
    }
    .puzzle-card .pz-submit:active { opacity: 0.85; transform: scale(0.97); }
    .puzzle-card .pz-cancel {
      width: 100%; padding: 12px; margin-top: 8px;
      font-size: 14px; font-family: inherit;
      background: transparent; color: #aaa;
      border: none; cursor: pointer;
    }
    .puzzle-card .pz-close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px; border-radius: 10px;
      background: rgba(0,0,0,0.05); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px; color: #999;
    }
    .puzzle-card .pz-error-msg {
      color: #e74c3c; font-size: 13px; margin-bottom: 10px; display: none;
      font-weight: 500;
    }
  </style>
</head>
<body class="detail-page-body">

<div class="detail-page">
  <div class="detail-hero" id="detail-hero">
    <div class="hero-img" id="hero-img" style="background-image:url('icons/icon_museum.jpg');"></div>
    <div class="hero-gradient"></div>
    <button class="detail-back" onclick="goBack()"><i data-lucide="arrow-left" style="width:18px;height:18px;"></i></button>
    <div class="hero-tags">
      <span class="hero-tag quality-epic" id="tag-quality">史诗</span>
      <span class="hero-tag walk" id="tag-walk"><i data-lucide="footprints" style="width:12px;height:12px;"></i> 步行可达</span>
    </div>
    <h1 id="detail-name">市博物馆</h1>
    <div class="hero-meta">
      <span id="meta-dist"><i data-lucide="map-pin" style="width:14px;height:14px;"></i> 580m</span>
      <span id="meta-time"><i data-lucide="footprints" style="width:14px;height:14px;"></i> 8分钟</span>
      <span><i data-lucide="wifi" style="width:14px;height:14px;"></i> 已连接</span>
    </div>
  </div>

  <div class="info-cards">
    <div class="info-card">
      <div class="ic-icon ic-gold"><i data-lucide="gift" style="width:18px;height:18px;"></i></div>
      <div class="ic-value" id="ic-rewards">3</div>
      <div class="ic-label">可获奖励</div>
    </div>
    <div class="info-card">
      <div class="ic-icon ic-coin"><i data-lucide="coins" style="width:18px;height:18px;"></i></div>
      <div class="ic-value" id="ic-coins">50</div>
      <div class="ic-label">保底探币</div>
    </div>
    <div class="info-card">
      <div class="ic-icon ic-fire"><i data-lucide="flame" style="width:18px;height:18px;"></i></div>
      <div class="ic-value" id="ic-hot">128</div>
      <div class="ic-label">今日打卡</div>
    </div>
  </div>

  <div class="detail-body">
    <div class="section-card">
      <div class="sc-header">
        <div class="sc-icon" style="background:rgba(232,147,12,0.10);color:#e8930c;"><i data-lucide="crosshair" style="width:16px;height:16px;"></i></div>
        <div class="sc-title">打卡模式</div>
        <div class="sc-badge" id="mode-badge" style="background:rgba(232,147,12,0.12);color:#e8930c;">谜题解锁</div>
      </div>
      <div class="mode-card">
        <div class="mode-icon-wrap"><i data-lucide="puzzle" style="width:20px;height:20px;"></i></div>
        <div class="mode-content">
          <div class="mode-title">如何开箱？</div>
          <div class="mode-desc" id="mode-desc">在馆内古籍展厅完成谜题挑战，输入正确口令即可开箱寻宝</div>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="sc-header">
        <div class="sc-icon" style="background:rgba(155,89,182,0.10);color:#8e44ad;"><i data-lucide="package" style="width:16px;height:16px;"></i></div>
        <div class="sc-title">可能获得</div>
      </div>
      <div class="reward-grid" id="reward-grid"></div>
    </div>

    <div class="section-card">
      <div class="sc-header">
        <div class="sc-icon" style="background:rgba(52,152,219,0.10);color:#2980b9;"><i data-lucide="scroll" style="width:16px;height:16px;"></i></div>
        <div class="sc-title">文化背景</div>
      </div>
      <div class="culture-text" id="culture-text"></div>
      <div class="culture-img-placeholder" id="culture-img"></div>
    </div>

    <div class="section-card">
      <div class="sc-header">
        <div class="sc-icon" style="background:rgba(231,76,60,0.10);color:#e74c3c;"><i data-lucide="map-pin" style="width:16px;height:16px;"></i></div>
        <div class="sc-title">附近其他打卡点</div>
      </div>
      <div class="nearby-list" id="nearby-list"></div>
    </div>
  </div>

  <div class="detail-action">
    <button class="btn-primary" onclick="showPuzzle()"><i data-lucide="key"></i> 开始解密开箱</button>
  </div>
</div>

<div class="puzzle-overlay" id="puzzle-overlay" onclick="if(event.target===this)closePuzzle()">
  <div class="puzzle-card">
    <button class="pz-close" onclick="closePuzzle()">×</button>
    <div class="pz-lock"><i data-lucide="lock"></i></div>
    <h3>解密开箱</h3>
    <p class="pz-subtitle" id="pz-location-name">市博物馆</p>
    <div class="pz-question">
      <div class="q-label">谜题</div>
      <div class="q-text" id="pz-question-text"></div>
    </div>
    <div class="pz-ar-hint">
      <i data-lucide="scan-line" style="color:#673ab7;flex-shrink:0;margin-top:2px;"></i>
      <div>
        <div class="hint-label">AR 扫描线索</div>
        <div class="hint-text" id="pz-ar-hint-text"></div>
      </div>
    </div>
    <div class="pz-error-msg" id="pz-error-msg"></div>
    <input class="pz-input" id="pz-input" type="text" placeholder="输入口令 / 密码 / 答案..." autocomplete="off" onkeydown="if(event.key==='Enter')checkAnswer()">
    <button class="pz-submit" onclick="checkAnswer()">确认解锁</button>
    <button class="pz-cancel" onclick="closePuzzle()">稍后再来</button>
  </div>
</div>

<script>
const POINTS = {
  purple: {
    name: '市博物馆', quality: '史诗', qClass: 'quality-epic', bgClass: 'purple',
    heroImg: 'icons/icon_museum.jpg',
    dist: '580m', time: '8分钟', modeType: '谜题解锁',
    mode: '在馆内古籍展厅完成谜题挑战，输入正确口令即可开箱寻宝',
    puzzle: {
      question: '《诗经·大雅·灵台》第七页第三行第十二个字是什么？',
      answer: '囿',
      arHint: '扫描博物馆古籍展厅夹层获取密码，解密后可得：第七页第三行第十二个字 = "囿"',
      errorMsg: '字不对，需要先用AR扫描获取页面线索再查出那个字'
    },

const urlParams = new URLSearchParams(window.location.search);
let pointId = urlParams.get('point') || 'purple';
let p = POINTS[pointId] || POINTS.purple;

const Q_COLORS = {
  epic: 'quality-epic', rare: 'quality-rare', common: 'quality-common'
};

function loadData() {
  document.getElementById('detail-name').textContent = p.name;
  document.getElementById('hero-img').style.backgroundImage = `url('${p.heroImg}')`;
  document.getElementById('tag-quality').textContent = p.quality;
  document.getElementById('tag-quality').className = 'hero-tag ' + p.qClass;
  document.getElementById('meta-dist').innerHTML = `<i data-lucide="map-pin" style="width:14px;height:14px;"></i> ${p.dist}`;
  document.getElementById('meta-time').innerHTML = `<i data-lucide="footprints" style="width:14px;height:14px;"></i> ${p.time}`;
  document.getElementById('mode-badge').textContent = p.modeType;
  document.getElementById('mode-desc').textContent = p.mode;
  document.getElementById('culture-text').innerHTML = p.culture;

  // 奖励
  const rg = document.getElementById('reward-grid');
  rg.innerHTML = p.rewards.map(r => `
    <div class="reward-line">
      <div class="rl-info">
        <div class="rl-name">${r.name}</div>
        <div class="rl-prob-bar-wrap">
          <div class="rl-prob-bar"><div class="rl-prob-bar-fill ${r.barClass}" style="width:${r.prob}%;"></div></div>
          <div class="rl-prob">${r.prob}%</div>
        </div>
      </div>
      <div class="rl-tag ${r.tagClass}">${r.tag}</div>
    </div>
  `).join('');

  // 附近推荐
  const nl = document.getElementById('nearby-list');
  nl.innerHTML = p.nearby.map(n => `
    <div class="nearby-item" onclick="jumpTo('${n.name}')">
      <div class="nb-dot dot-${n.quality}"></div>
      <div class="nb-name">${n.name}</div>
      <div class="nb-dist">${n.dist}</div>
    </div>
  `).join('');

  lucide.createIcons();
}

function goBack() {
  window.parent.postMessage({ action: 'navigate', page: 'map' }, '*');
}

function showPuzzle() {
  const pz = document.getElementById('puzzle-overlay');
  document.getElementById('pz-location-name').textContent = p.name;
  document.getElementById('pz-question-text').textContent = p.puzzle.question;
  document.getElementById('pz-ar-hint-text').textContent = p.puzzle.arHint;
  document.getElementById('pz-input').value = '';
  document.getElementById('pz-input').classList.remove('error');
  document.getElementById('pz-error-msg').style.display = 'none';
  pz.classList.add('show');
  setTimeout(() => document.getElementById('pz-input').focus(), 400);
}

function closePuzzle() {
  document.getElementById('puzzle-overlay').classList.remove('show');
}

function checkAnswer() {
  const input = document.getElementById('pz-input');
  const userAnswer = input.value.trim().toLowerCase();
  const correctAnswer = p.puzzle.answer.toLowerCase();

  const acceptable = [correctAnswer];
  if (pointId === 'purple') acceptable.push('you', 'yòu');
  if (pointId === 'gold') acceptable.push('sos', 'sos cuaricc');
  if (pointId === 'blue') acceptable.push('甲午辰戌');
  if (pointId === 'green') acceptable.push('zqdl');

  const isCorrect = acceptable.some(a => userAnswer.replace(/\s+/g,'') === a.replace(/\s+/g,''));

  if (isCorrect) {
    closePuzzle();
    setTimeout(() => {
      window.parent.postMessage({ action: 'navigate', page: 'chest', pointId: pointId }, '*');
    }, 300);
  } else {
    input.classList.add('error');
    document.getElementById('pz-error-msg').textContent = p.puzzle.errorMsg;
    document.getElementById('pz-error-msg').style.display = 'block';
    input.value = '';
    input.focus();
    setTimeout(() => input.classList.remove('error'), 400);
  }
}

function jumpTo(name) {
  const map = { '市博物馆':'purple', '万象城':'gold', '古城墙遗址':'blue', '喜茶门店':'green', '万象城':'gold', '古城墙':'blue' };
  const id = map[name] || 'purple';
  window.parent.postMessage({ action: 'navigate', page: 'detail', pointId: id }, '*');
}

loadData();
