<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交易行</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }

    .market-page {
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .market-page::-webkit-scrollbar { display: none; }

    /* ===== 顶部 ===== */
    .market-top {
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .market-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f5f5f5;
      border-radius: 12px;
      padding: 10px 14px;
      color: #999;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .market-cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .market-cats::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 6px 14px;
      border-radius: 16px;
      border: none;
      background: #f5f5f5;
      color: #666;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: #e8930c;
      color: #fff;
    }

    /* ===== 物品列表（列表形式） ===== */
    .market-list {
      padding: 8px 16px 20px;
    }
    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform 0.1s;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .list-item:active { transform: scale(0.98); }
    .list-item .li-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }
    .list-item .li-info { flex: 1; min-width: 0; }
    .list-item .li-name {
      font-size: 15px;
      font-weight: 600;
      color: #222;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .list-item .li-quality {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
    }
    .list-item .li-meta {
      font-size: 12px;
      color: #999;
    }
    .list-item .li-price-box {
      text-align: right;
      flex-shrink: 0;
    }
    .list-item .li-price {
      font-size: 18px;
      font-weight: 700;
      color: #e8930c;
    }
    .list-item .li-vol {
      font-size: 11px;
      color: #bbb;
      margin-top: 2px;
    }
    .list-item .li-spark {
      width: 50px;
      height: 24px;
      flex-shrink: 0;
    }

    /* ===== 底部详情面板 ===== */
    .item-panel {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
    }
    .item-panel.show { display: flex; }
    .item-panel-content {
      background: #fff;
      border-radius: 24px 24px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .panel-drag {
      width: 40px; height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 10px auto;
    }

    /* 面板头部 */
    .panel-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 20px 14px;
    }
    .ph-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
    }
    .ph-info { flex: 1; }
    .ph-name { font-size: 18px; font-weight: 700; color: #222; }
    .ph-quality {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }
    .ph-ref { font-size: 12px; color: #999; margin-top: 3px; }

    /* 价格统计 */
    .price-stats {
      display: flex;
      justify-content: space-around;
      padding: 0 20px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .ps-item { text-align: center; }
    .ps-val { font-size: 16px; font-weight: 700; color: #222; }
    .ps-label { font-size: 10px; color: #999; margin-top: 2px; }

    /* 走势图 */
    .chart-wrap {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .chart-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .chart-label .cl-tag {
      font-size: 11px;
      padding: 2px 8px;
      background: #f5f5f5;
      border-radius: 8px;
      color: #666;
    }
    .chart-canvas {
      width: 100%;
      height: 100px;
    }

    /* 当前最低售价区 */
    .offer-zone {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .offer-zone .oz-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
    }
    .offer-zone .oz-price {
      font-size: 40px;
      font-weight: 700;
      color: #e8930c;
      line-height: 1;
      margin-bottom: 6px;
    }
    .offer-zone .oz-unit {
      font-size: 14px;
      color: #e8930c;
      font-weight: 400;
    }
    .offer-zone .oz-stock {
      font-size: 13px;
      color: #666;
      margin-bottom: 14px;
    }
    .offer-zone .oz-bar {
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .offer-zone .oz-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #e8930c, #f5b041);
      border-radius: 3px;
      transition: width 0.3s;
    }
    .btn-buy {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #e8930c, #d68310);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-buy:disabled {
      background: #ddd;
      cursor: not-allowed;
    }

    /* ===== 挂单深度图 ===== */
    .depth-section {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .depth-title {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .depth-title span { font-weight: 400; color: #bbb; font-size: 11px; }
    .depth-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      position: relative;
    }
    .depth-row .dr-price {
      width: 56px;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      flex-shrink: 0;
      text-align: right;
    }
    .depth-row .dr-bar-wrap {
      flex: 1;
      height: 28px;
      background: #f5f5f5;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }
    .depth-row .dr-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 6px;
      transition: width 0.3s;
    }
    .depth-row .dr-bar-text {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      z-index: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .depth-row .dr-count {
      width: 50px;
      font-size: 11px;
      color: #999;
      text-align: right;
      flex-shrink: 0;
    }
    .depth-row.active .dr-price { color: #e8930c; }
    .depth-row.active .dr-bar { background: linear-gradient(90deg, #e8930c, #f5b041); }
    .depth-row.waiting .dr-bar { background: linear-gradient(90deg, #bdc3c7, #d5dbdb); }
    .depth-row.waiting .dr-bar-text { color: #666; text-shadow: none; }

    /* 我的出售 */
    .my-sell-section {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .my-sell-title {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      margin-bottom: 10px;
    }
    .my-sell-empty {
      color: #bbb;
      font-size: 12px;
      text-align: center;
      padding: 14px;
    }
    .sell-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .sell-row:last-child { border-bottom: none; }
    .sell-row .sr-info { font-size: 13px; color: #666; }
    .sell-row .sr-price { font-size: 15px; font-weight: 700; color: #e8930c; }
    .sell-row .sr-cancel {
      background: rgba(0,0,0,0.06);
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-sell-big {
      width: calc(100% - 40px);
      margin: 12px 20px 20px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #e8930c, #d68310);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    /* ===== 出售弹窗 ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      max-width: 340px;
      width: 100%;
      animation: dropBounce 0.4s ease;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-card h3 {
      font-size: 17px;
      color: #222;
      margin-bottom: 16px;
      text-align: center;
    }
    .mc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #fafafa;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .mc-item .mc-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
    .mc-item .mc-name { font-size: 15px; font-weight: 600; }
    .mc-item .mc-count { font-size: 12px; color: #999; }

    .mc-input { margin-bottom: 12px; }
    .mc-input label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
    }
    .mc-input input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      box-sizing: border-box;
    }
    .mc-hint {
      font-size: 11px;
      color: #999;
      margin-bottom: 12px;
    }

    /* 弹窗内的深度预览 */
    .mc-depth {
      margin-bottom: 14px;
    }
    .mc-depth-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }
    .mc-depth-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .mc-depth-row .mcd-price {
      width: 50px;
      font-size: 12px;
      font-weight: 600;
      text-align: right;
    }
    .mcd-price.now { color: #e8930c; }
    .mcd-price.wait { color: #999; }
    .mc-depth-row .mcd-bar-bg {
      flex: 1;
      height: 22px;
      background: #f5f5f5;
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }
    .mc-depth-row .mcd-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 5px;
    }
    .mcd-bar.now { background: linear-gradient(90deg, #e8930c, #f5b041); }
    .mcd-bar.wait { background: #ddd; }
    .mc-depth-row .mcd-count {
      font-size: 11px;
      color: #999;
      width: 40px;
      text-align: right;
    }

    .mc-fee {
      background: #fff8ee;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #666;
      margin-bottom: 14px;
      border: 1px solid rgba(232,147,12,0.15);
      line-height: 1.7;
    }
    .mc-fee .fee-highlight {
      color: #e8930c;
      font-weight: 700;
    }
    .mc-actions {
      display: flex;
      gap: 10px;
    }
    .mc-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-cancel { background: rgba(0,0,0,0.06); color: #666; }
    .btn-confirm { background: #e8930c; color: #fff; }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 14px;
      z-index: 400;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s, visibility 0.2s;
      white-space: nowrap;
    }
    .toast.show { visibility: visible; opacity: 1; animation: fadeIn 0.2s; }

    @keyframes dropBounce {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="market-page-body">

<div class="market-page">
  <div class="market-top">
    <div class="market-search">搜索道具名称...</div>
    <div class="market-cats">
      <button class="cat-btn active" data-cat="all" onclick="filterCat('all', this)">全部</button>
      <button class="cat-btn" data-cat="fragment" onclick="filterCat('fragment', this)">碎片</button>
      <button class="cat-btn" data-cat="item" onclick="filterCat('item', this)">道具</button>
      <button class="cat-btn" data-cat="coupon" onclick="filterCat('coupon', this)">兑换券</button>
    </div>
  </div>

  <div class="market-list" id="market-list">
    <!-- 动态生成 -->
  </div>
</div>

<!-- 物品详情面板 -->
<div class="item-panel" id="item-panel">
  <div class="item-panel-content">
    <div class="panel-drag"></div>

    <div class="panel-header">
      <div class="ph-icon" id="ph-icon"></div>
      <div class="ph-info">
        <div class="ph-name" id="ph-name">古剑残片</div>
        <div class="ph-quality" id="ph-quality" style="background:rgba(52,152,219,0.12);color:#2980b9;">稀有</div>
        <div class="ph-ref" id="ph-ref">参考价 45 探币</div>
      </div>
    </div>

    <div class="price-stats">
      <div class="ps-item">
        <div class="ps-val" id="ps-low">--</div>
        <div class="ps-label">最低售价</div>
      </div>
      <div class="ps-item">
        <div class="ps-val" id="ps-avg">--</div>
        <div class="ps-label">成交均价</div>
      </div>
      <div class="ps-item">
        <div class="ps-val" id="ps-high">--</div>
        <div class="ps-label">最高售价</div>
      </div>
      <div class="ps-item">
        <div class="ps-val" id="ps-vol">--</div>
        <div class="ps-label">24h成交</div>
      </div>
    </div>

    <div class="chart-wrap">
      <div class="chart-label">
        <span>价格走势</span>
        <span class="cl-tag" id="chart-tag">近7天</span>
      </div>
      <canvas class="chart-canvas" id="chart-canvas"></canvas>
    </div>

    <div class="offer-zone">
      <div class="oz-label">当前最低售价</div>
      <div class="oz-price"><span id="oz-price">--</span><span class="oz-unit"></span></div>
      <div class="oz-stock" id="oz-stock">--</div>
      <div class="oz-bar">
        <div class="oz-bar-fill" id="oz-bar-fill" style="width:0%"></div>
      </div>
      <button class="btn-buy" id="btn-buy" onclick="buyCheapest()"><i data-lucide="shopping-cart"></i>立即购买</button>
    </div>

    <div class="depth-section">
      <div class="depth-title">挂单深度 <span>共 <span id="depth-total">0</span> 个在售</span></div>
      <div id="depth-content">
        <!-- 动态 -->
      </div>
    </div>

    <div class="my-sell-section">
      <div class="my-sell-title">我的出售</div>
      <div id="my-sell-content">
        <div class="my-sell-empty">暂无该物品在售</div>
      </div>
    </div>

    <button class="btn-sell-big" id="btn-sell" onclick="openSellModal()"><i data-lucide="store"></i>出售该物品</button>
  </div>
</div>

<!-- 购买确认弹窗 -->
<div class="modal-overlay" id="buy-modal">
  <div class="modal-card">
    <h3>确认购买</h3>
    <div class="mc-item">
      <div class="mc-icon" id="bm-icon"></div>
      <div>
        <div class="mc-name" id="bm-name">古剑残片</div>
        <div class="mc-count" id="bm-count">单价 45 探币</div>
      </div>
    </div>
    <div class="mc-fee" style="text-align:center;font-size:14px;">
      实际支付 <span class="fee-highlight" id="bm-total" style="font-size:20px;">45</span> <span class="fee-highlight">探币</span>
    </div>
    <div class="mc-actions">
      <button class="btn-cancel" onclick="closeBuyModal()">取消</button>
      <button class="btn-confirm" onclick="confirmBuy()">确认购买</button>
    </div>
  </div>
</div>

<!-- 出售弹窗 -->
<div class="modal-overlay" id="sell-modal">
  <div class="modal-card">
    <h3>挂单出售</h3>
    <div class="mc-item">
      <div class="mc-icon" id="sm-icon"></div>
      <div>
        <div class="mc-name" id="sm-name">古剑残片</div>
        <div class="mc-count" id="sm-count">拥有 5 个</div>
      </div>
    </div>

    <div class="mc-depth" id="sm-depth">
      <div class="mc-depth-label">当前市场行情</div>
      <div id="sm-depth-list">
        <!-- 动态 -->
      </div>
    </div>

    <div class="mc-input">
      <label>设置单价（探币）</label>
      <input type="number" id="sm-price" placeholder="输入价格">
    </div>
    <div class="mc-hint" id="sm-hint">可设置范围：22 ~ 67 探币</div>
    <div class="mc-fee" id="sm-fee">
      系统参考价 45 探币<br>
      成交后平台收取手续费 <span class="fee-highlight">10%</span><br>
      预计实际到账：<span class="fee-highlight">--</span> 探币
    </div>
    <div class="mc-actions">
      <button class="btn-cancel" onclick="closeSellModal()">取消</button>
      <button class="btn-confirm" onclick="confirmSell()">确认挂单</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 数据 =====
const ITEM_DB = [
  { id:'sword_frag',    icon:'icons/sword_frag.jpg',    name:'古剑残片',     quality:'稀有', qBg:'rgba(52,152,219,0.12)', qTxt:'#2980b9',  type:'fragment', ref: 45,  myCount: 5, spark: [40,42,41,44,43,45,42,44,46,45,43,44] },

// ===== 初始化 =====
function init() {

// ===== 渲染物品列表 =====
function renderList(cat) {
  const el = document.getElementById('market-list');
  const items = cat === 'all' ? ITEM_DB : ITEM_DB.filter(it => it.type === cat);
  el.innerHTML = items.map(it => {
    const listings = LISTINGS.filter(l => l.itemId === it.id);
    const minPrice = listings.length > 0 ? Math.min(...listings.map(l => l.price)) : it.ref;
    const vol = Math.floor(Math.random() * 800) + 100;
    return `
      <div class="list-item" onclick="openPanel('${it.id}')">
        <div class="li-icon"><img src="${it.icon}" style="width:32px;height:32px;object-fit:cover;border-radius:8px;"></div>
        <div class="li-info">
          <div class="li-name">${it.name} <span class="li-quality" style="background:${it.qBg};color:${it.qTxt};">${it.quality}</span></div>
          <div class="li-meta">参考价 ${it.ref} · 24h成交 ${vol}</div>
        </div>
        <canvas class="li-spark" id="spark-${it.id}"></canvas>
        <div class="li-price-box">
          <div class="li-price">${minPrice}</div>
          <div class="li-vol">最低</div>
        </div>
      </div>
    `;
  }).join('');

  // 绘制迷你走势图
  setTimeout(() => {
    items.forEach(it => drawSpark(it.id, it.spark));
  }, 10);
}

function filterCat(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList(cat);
}

// ===== 迷你走势图 =====
function drawSpark(itemId, data) {
  const canvas = document.getElementById('spark-' + itemId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width, h = rect.height;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;

  ctx.strokeStyle = data[data.length - 1] >= data[0] ? '#e74c3c' : '#27ae60';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * h * 0.7 - h * 0.15;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

// ===== 打开详情面板 =====
function openPanel(itemId) {
  currentItem = ITEM_DB.find(it => it.id === itemId);
  if (!currentItem) return;

  document.getElementById('ph-icon').innerHTML = '<img src="' + currentItem.icon + '" style="width:40px;height:40px;object-fit:cover;border-radius:10px;">';
  document.getElementById('ph-name').textContent = currentItem.name;
  const qEl = document.getElementById('ph-quality');
  qEl.textContent = currentItem.quality;
  qEl.style.cssText = `background:${currentItem.qBg};color:${currentItem.qTxt};`;
  document.getElementById('ph-ref').textContent = '参考价 ' + currentItem.ref + ' 探币';

  const listings = LISTINGS.filter(l => l.itemId === itemId);
  const prices = listings.map(l => l.price);
  const minP = prices.length > 0 ? Math.min(...prices) : '--';
  const maxP = prices.length > 0 ? Math.max(...prices) : '--';
  const avgP = prices.length > 0 ? Math.round(prices.reduce((a,b)=>a+b,0)/prices.length) : '--';
  document.getElementById('ps-low').textContent = minP;
  document.getElementById('ps-high').textContent = maxP;
  document.getElementById('ps-avg').textContent = avgP;
  document.getElementById('ps-vol').textContent = Math.floor(Math.random() * 500) + 50;

  // 先显示面板，让 canvas 获得正确尺寸
  document.getElementById('item-panel').classList.add('show');

  // 等一帧再绘制走势图（面板 display:none → flex 后 canvas 才有尺寸）
  requestAnimationFrame(() => {
    drawPanelChart(currentItem.spark);
  });

  // 当前最低售价
  updateOfferZone(itemId);

  // 挂单深度图
  renderDepth(itemId);

  // 我的出售
  renderMySell(itemId);

  // 出售按钮
  const sellBtn = document.getElementById('btn-sell');
  if (currentItem.myCount > 0) {
    sellBtn.style.display = 'block';
    sellBtn.innerHTML = '<i data-lucide="store"></i>出售该物品（拥有 ' + currentItem.myCount + ' 个）';
  } else {
    sellBtn.style.display = 'none';
  }
  lucide.createIcons();
}

function closePanel() {
  document.getElementById('item-panel').classList.remove('show');
}
document.getElementById('item-panel').addEventListener('click', function(e) {
  if (e.target === this) closePanel();
});

// ===== 面板走势图 =====
function drawPanelChart(data) {
  if (!currentItem || !currentItem.spark) return;
  const canvas = document.getElementById('chart-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width, h = rect.height;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;

  ctx.clearRect(0, 0, w, h);

  // 网格
  ctx.strokeStyle = 'rgba(0,0,0,0.04)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    const y = h * i / 3;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const isUp = data[data.length - 1] >= data[0];
  ctx.strokeStyle = isUp ? '#e74c3c' : '#27ae60';
  ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * h * 0.7 - h * 0.15;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.fillStyle = isUp ? 'rgba(231,76,60,0.06)' : 'rgba(39,174,96,0.06)';
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
}

// ===== 当前最低售价区 =====
function updateOfferZone(itemId) {
  const listings = LISTINGS.filter(l => l.itemId === itemId).sort((a,b) => a.price - b.price);
  const priceEl = document.getElementById('oz-price');
  const stockEl = document.getElementById('oz-stock');
  const barFill = document.getElementById('oz-bar-fill');
  const btn = document.getElementById('btn-buy');

  if (listings.length === 0) {
    priceEl.textContent = '--';
    stockEl.textContent = '暂无人出售';
    barFill.style.width = '0%';
    btn.disabled = true;
    btn.innerHTML = '暂无可购';
    return;
  }

  const cheapest = listings[0];
  const samePrice = listings.filter(l => l.price === cheapest.price);
  const totalAtPrice = samePrice.reduce((s, l) => s + l.amount, 0);
  const totalAll = listings.reduce((s, l) => s + l.amount, 0);

  priceEl.textContent = cheapest.price;
  stockEl.textContent = '当前档位库存 ' + totalAtPrice + ' 个 · 总计在售 ' + totalAll + ' 个';
  barFill.style.width = Math.min(100, (totalAtPrice / totalAll * 100 * 2)) + '%';
  btn.disabled = false;
  btn.innerHTML = '<i data-lucide="shopping-cart"></i>立即购买';
  lucide.createIcons();
}

// ===== 挂单深度图 =====
function renderDepth(itemId) {
  const listings = LISTINGS.filter(l => l.itemId === itemId);
  const el = document.getElementById('depth-content');
  document.getElementById('depth-total').textContent = listings.reduce((s, l) => s + l.amount, 0);

  if (listings.length === 0) {
    el.innerHTML = '<div style="color:#bbb;font-size:12px;text-align:center;padding:10px;">暂无人出售</div>';
    return;
  }

  // 按价格分组
  const grouped = {};
  listings.forEach(l => {
    if (!grouped[l.price]) grouped[l.price] = 0;
    grouped[l.price] += l.amount;
  });
  const prices = Object.keys(grouped).map(Number).sort((a,b) => a - b);
  const maxAmt = Math.max(...Object.values(grouped));

  el.innerHTML = prices.map((price, idx) => {
    const isActive = idx === 0;
    const amt = grouped[price];
    const width = Math.max(15, (amt / maxAmt * 100));
    return `
      <div class="depth-row ${isActive ? 'active' : 'waiting'}">
        <div class="dr-price">${price}</div>
        <div class="dr-bar-wrap">
          <div class="dr-bar" style="width:${width}%"></div>
          <div class="dr-bar-text">${amt} 个</div>
        </div>
        <div class="dr-count">${isActive ? '可购' : '等待'}</div>
      </div>
    `;
  }).join('');
}

// ===== 我的出售 =====
function renderMySell(itemId) {
  const mySells = MY_LISTINGS.filter(l => l.itemId === itemId);
  const el = document.getElementById('my-sell-content');
  if (mySells.length === 0) {
    el.innerHTML = '<div class="my-sell-empty">暂无该物品在售</div>';
    return;
  }
  el.innerHTML = mySells.map(l => `
    <div class="sell-row">
      <div class="sr-info">我的挂单 · 数量 ${l.amount}</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="sr-price">${l.price}</span>
        <button class="sr-cancel" onclick="event.stopPropagation();cancelMyListing(${l.id})">撤单</button>
      </div>
    </div>
  `).join('');
}

// ===== 手续费计算 =====
function calcFee(price, ref) {
  const ratio = price / ref;
  if (ratio > 1.5) return { rate: 0.30, label: '30%（严重溢价）' };
  if (ratio > 1.2) return { rate: 0.20, label: '20%（溢价抑制）' };
  if (ratio < 0.5) return { rate: 0.05, label: '5%（低价鼓励）' };
  return { rate: 0.10, label: '10%（标准费率）' };
}

// ===== 购买 =====
function buyCheapest() {
  if (!currentItem) return;
  const itemListings = LISTINGS.filter(l => l.itemId === currentItem.id).sort((a,b) => a.price - b.price);
  if (itemListings.length === 0) { showToast('暂无可购买物品'); return; }

  const cheapest = itemListings[0];
  if (myCoins < cheapest.price) {
    showToast('探币不足！需要 ' + cheapest.price + ' 探币');
    return;
  }

  currentListing = cheapest;
  document.getElementById('bm-icon').innerHTML = '<img src="' + currentItem.icon + '" style="width:28px;height:28px;object-fit:cover;border-radius:6px;">';
  document.getElementById('bm-name').textContent = currentItem.name;
  document.getElementById('bm-count').textContent = '单价 ' + cheapest.price + ' 探币';
  document.getElementById('bm-total').textContent = cheapest.price;
  document.getElementById('buy-modal').classList.add('show');
}

function closeBuyModal() {
  document.getElementById('buy-modal').classList.remove('show');
  currentListing = null;
}

function confirmBuy() {
  if (!currentListing || !currentItem) return;
  if (myCoins < currentListing.price) {
    showToast('探币不足！');
    closeBuyModal();
    return;
  }

  myCoins -= currentListing.price;
  currentItem.myCount++;

  const idx = LISTINGS.findIndex(l => l.id === currentListing.id);
  if (idx >= 0) {
    LISTINGS[idx].amount--;
    if (LISTINGS[idx].amount <= 0) LISTINGS.splice(idx, 1);
  }

  closeBuyModal();
  openPanel(currentItem.id);
  renderList(document.querySelector('.cat-btn.active').dataset.cat);
  showToast('购买成功！' + currentItem.name + ' 已放入背包');
}

// ===== 出售 =====
function openSellModal() {
  if (!currentItem || currentItem.myCount <= 0) return;
  document.getElementById('sm-icon').innerHTML = '<img src="' + currentItem.icon + '" style="width:28px;height:28px;object-fit:cover;border-radius:6px;">';
  document.getElementById('sm-name').textContent = currentItem.name;
  document.getElementById('sm-count').textContent = '拥有 ' + currentItem.myCount + ' 个';

  const minP = Math.round(currentItem.ref * 0.5);
  const maxP = Math.round(currentItem.ref * 1.5);
  document.getElementById('sm-hint').textContent = '可设置范围：' + minP + ' ~ ' + maxP + ' 探币';

  const input = document.getElementById('sm-price');
  input.value = currentItem.ref;
  input.min = minP;
  input.max = maxP;

  // 弹窗内深度预览
  const depthList = document.getElementById('sm-depth-list');
  const listings = LISTINGS.filter(l => l.itemId === currentItem.id);
  if (listings.length === 0) {
    depthList.innerHTML = '<div style="color:#bbb;font-size:12px;">暂无人出售，你是第一个！</div>';
  } else {
    const grouped = {};
    listings.forEach(l => { if (!grouped[l.price]) grouped[l.price] = 0; grouped[l.price] += l.amount; });
    const prices = Object.keys(grouped).map(Number).sort((a,b) => a - b);
    const maxAmt = Math.max(...Object.values(grouped));
    depthList.innerHTML = prices.map((price, idx) => {
      const w = Math.max(12, (grouped[price] / maxAmt * 100));
      return `
        <div class="mc-depth-row">
          <div class="mcd-price ${idx===0?'now':'wait'}">${price}</div>
          <div class="mcd-bar-bg">
            <div class="mcd-bar ${idx===0?'now':'wait'}" style="width:${w}%"></div>
          </div>
          <div class="mcd-count">${grouped[price]}个</div>
        </div>
      `;
    }).join('');
  }

  updateSellFee();
  document.getElementById('sell-modal').classList.add('show');
}

function updateSellFee() {
  const price = parseFloat(document.getElementById('sm-price').value) || 0;
  if (!currentItem) return;
  const fee = calcFee(price, currentItem.ref);
  const net = Math.max(0, Math.round(price * (1 - fee.rate)));
  document.getElementById('sm-fee').innerHTML =
    '系统参考价 ' + currentItem.ref + ' 探币<br>' +
    '成交后平台收取手续费 <span class="fee-highlight">' + fee.label +
    '</span><br>预计实际到账：<span class="fee-highlight">' + net + '</span> 探币';
}
document.getElementById('sm-price').addEventListener('input', updateSellFee);

function closeSellModal() {
  document.getElementById('sell-modal').classList.remove('show');
}

function confirmSell() {
  if (!currentItem) return;
  if (currentItem.myCount <= 0) return;
  const price = parseFloat(document.getElementById('sm-price').value);
  if (!price || price <= 0) { showToast('请输入有效价格'); return; }

  const minP = Math.round(currentItem.ref * 0.5);
  const maxP = Math.round(currentItem.ref * 1.5);
  if (price < minP || price > maxP) {
    showToast('价格必须在 ' + minP + ' ~ ' + maxP + ' 之间');
    return;
  }

  currentItem.myCount--;
  MY_LISTINGS.push({ id: Date.now(), itemId: currentItem.id, price: price, amount: 1 });

  closeSellModal();
  closePanel();
  renderList(document.querySelector('.cat-btn.active').dataset.cat);
  showToast('挂单成功！');
}

function cancelMyListing(id) {
  if (!currentItem) return;
  const idx = MY_LISTINGS.findIndex(l => l.id === id);
  if (idx < 0) return;
  const l = MY_LISTINGS[idx];
  const item = ITEM_DB.find(it => it.id === l.itemId);
  if (item) item.myCount++;
  MY_LISTINGS.splice(idx, 1);
  openPanel(currentItem.id);
  renderList(document.querySelector('.cat-btn.active').dataset.cat);
  showToast('撤单成功');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// 弹窗背景关闭
document.getElementById('buy-modal').addEventListener('click', function(e) { if (e.target === this) closeBuyModal(); });
document.getElementById('sell-modal').addEventListener('click', function(e) { if (e.target === this) closeSellModal(); });

window.addEventListener('resize', () => {
  if (!currentItem) return;
  drawPanelChart(currentItem.spark);
});

init();
