<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* 覆盖 Leaflet 默认 attribution 样式，让它更小巧 */
    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(0,0,0,0.5) !important;
      color: #666 !important;
      border-radius: 4px 0 0 0 !important;
      padding: 2px 6px !important;
    }
    .leaflet-control-attribution a { color: #888 !important; }
    /* 隐藏默认缩放控件，我们用自定义按钮 */
    .leaflet-control-zoom { display: none !important; }
    /* 亮色主题，高德瓦片原色显示 */
    /* 自定义地图标记 */
    .map-marker {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.3);
      position: relative;
    }
    .map-marker::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid inherit;
    }
    .map-marker:hover { transform: scale(1.15); }
    .marker-epic {
      background: linear-gradient(135deg, #9b59b6, #8e44ad);
      border-top-color: #8e44ad;
    }
    .marker-rare {
      background: linear-gradient(135deg, #3498db, #2980b9);
      border-top-color: #2980b9;
    }
    .marker-common {
      background: linear-gradient(135deg, #27ae60, #229954);
      border-top-color: #229954;
    }
    /* 标记上的品质标签 */
    .marker-label {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
      white-space: nowrap;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    .marker-img {
       width: 34px; height: 34px;
       border-radius: 50%;
       background-size: cover;
       background-position: center;
       box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
     }
     /* 用户位置脉冲 */
    .user-dot {
      width: 16px;
      height: 16px;
      background: #3498db;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(52,152,219,0.6);
      position: relative;
    }
    .user-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border: 2px solid rgba(52,152,219,0.3);
      border-radius: 50%;
      animation: user-pulse 2s infinite;
    }
    @keyframes user-pulse {
      0% { width: 16px; height: 16px; opacity: 1; top: 50%; left: 50%; }
      100% { width: 60px; height: 60px; opacity: 0; top: 25%; left: 25%; }
    }
  </style>
</head>
<body class="map-page-body">

<!-- 真实地图容器 -->
<div id="map"></div>

<!-- 顶部搜索栏（覆盖在地图上方） -->
<div class="map-header" style="position:absolute; top:10px; left:15px; right:15px; z-index:1000; display:flex; justify-content:space-between; align-items:center;">
  <div class="map-search" style="flex:1; background:rgba(255,255,255,0.9); backdrop-filter:blur(12px); border-radius:20px; padding:10px 16px; color:#666; font-size:13px; display:flex; align-items:center; gap:8px; margin-right:10px; border:1px solid rgba(0,0,0,0.06); box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <i data-lucide="search"></i>搜索附近打卡点...
  </div>
  <div class="map-radar" style="width:40px; height:40px; background:rgba(232,147,12,0.12); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#e8930c; font-size:18px; border:1px solid rgba(232,147,12,0.25); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <i data-lucide="satellite"></i>
  </div>
</div>

<!-- 右侧悬浮功能按钮 -->
<div class="map-float-btns" style="position:absolute; top:80px; right:12px; z-index:1000; display:flex; flex-direction:column; background:rgba(255,255,255,0.92); border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.10);">
  <!-- AR 扫描 -->
  <div class="float-btn" onclick="goToAR()" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#555; position:relative; border-bottom:1px solid #f0f0f0; transition:background 0.15s;" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='transparent'">
    <i data-lucide="scan-line" style="width:18px;height:18px;"></i>
    <span style="position:absolute; top:2px; right:2px; background:#e8930c; color:#fff; font-size:7px; padding:1px 4px; border-radius:6px; font-weight:600; line-height:1.3;">新</span>
  </div>
  <!-- 定位 -->
  <div class="float-btn" onclick="locateMe()" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#555; border-bottom:1px solid #f0f0f0; transition:background 0.15s;" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='transparent'">
    <i data-lucide="crosshair" style="width:18px;height:18px;"></i>
  </div>
  <!-- 图层 -->
  <div class="float-btn" onclick="toggleLayer()" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#555; transition:background 0.15s;" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='transparent'">
    <i data-lucide="layers" style="width:18px;height:18px;"></i>
  </div>
</div>

<!-- 底部推荐卡片 -->
<div class="nearby-panel" style="position:absolute; bottom:0; left:0; right:0; background:linear-gradient(180deg, transparent, rgba(250,248,245,0.95) 20%); padding:30px 15px 15px; z-index:1000;">
  <div class="nearby-title" style="color:#333; font-size:16px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px;">
    <i data-lucide="map-pin"></i>附近推荐
  </div>
  <div class="nearby-list" style="display:flex; gap:12px; overflow-x:auto; overflow-y:hidden; padding-bottom:8px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; -ms-overflow-style:none;">
    <div class="nearby-card" onclick="goToDetail('purple')" style="min-width:140px; scroll-snap-align:start; background:#fff; border-radius:16px; padding:12px; border:1px solid rgba(0,0,0,0.06); cursor:pointer; transition:transform 0.2s; flex-shrink:0; box-shadow:0 2px 12px rgba(0,0,0,0.06);">
      <span class="quality quality-epic" style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; margin-bottom:6px; background:rgba(155,89,182,0.15); color:#8e44ad;">史诗</span>
      <h4 style="color:#222; font-size:14px; margin-bottom:4px;">市博物馆</h4>
      <p style="color:#888; font-size:11px;"><i data-lucide="footprints"></i>步行 8 分钟</p>
    </div>
    <div class="nearby-card" onclick="goToDetail('gold')" style="min-width:140px; scroll-snap-align:start; background:#fff; border-radius:16px; padding:12px; border:1px solid rgba(0,0,0,0.06); cursor:pointer; transition:transform 0.2s; flex-shrink:0; box-shadow:0 2px 12px rgba(0,0,0,0.06);">
      <span class="quality quality-rare" style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; margin-bottom:6px; background:rgba(52,152,219,0.15); color:#2980b9;">稀有</span>
      <h4 style="color:#222; font-size:14px; margin-bottom:4px;">万象城</h4>
      <p style="color:#888; font-size:11px;"><i data-lucide="footprints"></i>步行 3 分钟</p>
    </div>
    <div class="nearby-card" onclick="goToDetail('blue')" style="min-width:140px; scroll-snap-align:start; background:#fff; border-radius:16px; padding:12px; border:1px solid rgba(0,0,0,0.06); cursor:pointer; transition:transform 0.2s; flex-shrink:0; box-shadow:0 2px 12px rgba(0,0,0,0.06);">
      <span class="quality quality-rare" style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; margin-bottom:6px; background:rgba(52,152,219,0.15); color:#2980b9;">稀有</span>
      <h4 style="color:#222; font-size:14px; margin-bottom:4px;">古城墙遗址</h4>
      <p style="color:#888; font-size:11px;"><i data-lucide="bike"></i>骑行 12 分钟</p>
    </div>
    <div class="nearby-card" onclick="goToDetail('green')" style="min-width:140px; scroll-snap-align:start; background:#fff; border-radius:16px; padding:12px; border:1px solid rgba(0,0,0,0.06); cursor:pointer; transition:transform 0.2s; flex-shrink:0; box-shadow:0 2px 12px rgba(0,0,0,0.06);">
      <span class="quality quality-common" style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; margin-bottom:6px; background:rgba(149,165,166,0.2); color:#7f8c8d;">普通</span>
      <h4 style="color:#222; font-size:14px; margin-bottom:4px;">喜茶门店</h4>
      <p style="color:#888; font-size:11px;"><i data-lucide="footprints"></i>步行 5 分钟</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 西安市中心坐标（模拟城市）
const CENTER = [34.2600, 108.9425];
const ZOOM = 15;

// 初始化地图
const map = L.map('map', {
  center: CENTER,
  zoom: ZOOM,
  zoomControl: false,
  attributionControl: true
});

// 使用本地预下载的高德瓦片（避免浏览器外网限制）
L.tileLayer('/tiles/{z}/{x}/{y}.png', {
  attribution: '&copy; 高德地图'
}).addTo(map);

// 打卡点数据（模拟西安地标附近的坐标）
const MARKERS = [
  { id: 'purple', name: '博物馆', img: 'icons/icon_museum.jpg', quality: 'marker-epic', label: '史诗', lat: 34.2648, lng: 108.9460 },
  { id: 'gold',   name: '万象城', img: 'icons/icon_mall.jpg', quality: 'marker-rare',  label: '稀有', lat: 34.2565, lng: 108.9390 },
  { id: 'blue',   name: '古城墙', img: 'icons/icon_wall.jpg', quality: 'marker-rare',  label: '稀有', lat: 34.2630, lng: 108.9550 },
  { id: 'green',  name: '奶茶店', img: 'icons/icon_tea.jpg', quality: 'marker-common', label: '普通', lat: 34.2580, lng: 108.9360 }
];

// 添加打卡点标记
MARKERS.forEach(function(m) {
  var markerEl = document.createElement('div');
  markerEl.className = 'map-marker ' + m.quality;
  markerEl.innerHTML = '<span class="marker-label">' + m.label + '</span><div class="marker-img" style="background-image:url(\'' + m.img + '\');"></div>';

  var icon = L.divIcon({
    className: '',
    html: markerEl.outerHTML,
    iconSize: [44, 52],
    iconAnchor: [22, 52]
  });

  var leafletMarker = L.marker([m.lat, m.lng], { icon: icon }).addTo(map);
  leafletMarker.on('click', function() {
    goToDetail(m.id);
  });

  // 添加悬浮提示
  leafletMarker.bindTooltip(m.name, {
    permanent: false,
    direction: 'top',
    offset: [0, -30],
    className: 'custom-tooltip'
  });
});

// 添加用户位置标记
var userIcon = L.divIcon({
  className: '',
  html: '<div class="user-dot"></div>',
  iconSize: [16, 16],
  iconAnchor: [8, 8]
});
L.marker(CENTER, { icon: userIcon, interactive: false }).addTo(map);

// 添加tooltip样式
var tooltipStyle = document.createElement('style');
tooltipStyle.textContent = '.custom-tooltip { background:rgba(0,0,0,0.8) !important; color:#fff !important; border:none !important; border-radius:8px !important; padding:4px 10px !important; font-size:12px !important; font-family:inherit !important; box-shadow:0 2px 8px rgba(0,0,0,0.4) !important; } .custom-tooltip::before { border-top-color:rgba(0,0,0,0.8) !important; }';
document.head.appendChild(tooltipStyle);

function goToDetail(pointId) {
  window.parent.postMessage({ action: 'navigate', page: 'detail', pointId: pointId }, '*');
}

// 右侧悬浮按钮功能
function goToAR() {
  window.parent.postMessage({ action: 'navigate', page: 'arscan' }, '*');
}
function locateMe() {
  map.flyTo(CENTER, ZOOM, { duration: 1 });
}
function toggleLayer() {
  alert('当前显示：标准地图\n\n切换图层功能将在正式版开放\n· 卫星图\n· 文化地图\n· 骑行路线图');
}
</script>

<script>lucide.createIcons();</script>

</body>
</html>
