﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>我的健康记录 - 银发就医小棉袄</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/app-layout.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
  <style>
    /* ===== 顶部快捷录入卡片（置顶，方便使用） ===== */
    .quick-input-card {
      margin: 0 var(--space-xl) var(--space-md);
      background: #fff;
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.04);
    }
    .quick-input-title {
      font-size: var(--font-l);
      font-weight: 700;
      margin-bottom: var(--space-sm);
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .quick-input-textarea {
      width: 100%;
      min-height: 80px;
      padding: var(--space-sm) var(--space-md);
      font-size: var(--font-m);
      font-family: inherit;
      border: 2px solid var(--color-border, #e5e7eb);
      border-radius: var(--radius-md);
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .quick-input-textarea:focus {
      border-color: var(--color-primary, #D84315);
    }
    .quick-input-actions {
      display: flex;
      gap: var(--space-sm);
      margin-top: var(--space-sm);
    }
    .quick-input-btn {
      flex: 1;
      padding: var(--space-sm) var(--space-md);
      font-size: var(--font-m);
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      min-height: 48px;
      transition: all 0.2s;
      font-family: inherit;
    }
    .quick-input-btn-primary {
      background: var(--color-primary, #D84315);
      color: #fff;
    }
    .quick-input-btn-primary:active {
      transform: scale(0.98);
    }
    .quick-input-btn-secondary {
      background: var(--color-bg-gray, #f3f4f6);
      color: var(--color-text);
      border: 1px solid var(--color-border, #e5e7eb);
      flex: 0 0 auto;
      min-width: 80px;
    }
    .quick-input-type {
      display: flex;
      gap: 6px;
      margin-bottom: var(--space-sm);
      flex-wrap: wrap;
    }
    .quick-type-tag {
      padding: 6px 12px;
      font-size: var(--font-s);
      border: 1px solid var(--color-border, #e5e7eb);
      border-radius: 16px;
      background: #fff;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .quick-type-tag.active {
      background: var(--color-primary-light, #FFE0D6);
      border-color: var(--color-primary, #D84315);
      color: var(--color-primary, #D84315);
      font-weight: 600;
    }

    /* 适老模式：输入区增强 */
    .theme-accessible .quick-input-textarea {
      min-height: 100px;
      font-size: 20px;
      padding: var(--space-md);
    }
    .theme-accessible .quick-input-btn {
      min-height: 60px;
      font-size: 20px;
    }
    .theme-accessible .quick-type-tag {
      padding: 8px 16px;
      font-size: 18px;
    }
  </style>
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">我的健康记录</span>
    </nav>
    <main class="page-content has-tab-bar">
      <!-- 免责声明横幅 -->
      <div class="disclaimer-banner">⚠️ 概念演示 · 非医疗记录 · 仅供参考</div>

      <!-- ===== 顶部快捷录入卡片（置顶，方便使用） ===== -->
      <div class="quick-input-card">
        <div class="quick-input-title">✏️ 记一笔</div>

        <!-- 记录类型选择 -->
        <div class="quick-input-type">
          <button class="quick-type-tag active" data-type="feel" onclick="selectType(this, 'feel')">🤒 身体感受</button>
          <button class="quick-type-tag" data-type="bp" onclick="selectType(this, 'bp')">📊 血压</button>
          <button class="quick-type-tag" data-type="sugar" onclick="selectType(this, 'sugar')">🩸 血糖</button>
          <button class="quick-type-tag" data-type="other" onclick="selectType(this, 'other')">📝 其他</button>
        </div>

        <!-- 输入框 -->
        <textarea class="quick-input-textarea" id="quickInput" placeholder="点击这里输入要记录的内容，例如：今天血压有点高，头有点晕"></textarea>

        <!-- 操作按钮 -->
        <div class="quick-input-actions">
          <button class="quick-input-btn quick-input-btn-secondary" onclick="clearInput()">清空</button>
          <button class="quick-input-btn quick-input-btn-primary" onclick="submitInput()">💾 保存记录</button>
        </div>
      </div>

      <!-- 今日记录卡片 -->
      <div class="card">
        <div class="card-header">今日记录</div>
        <div class="card-body" id="todayRecords">
          <!-- 记录项1：语音记录 -->
          <div class="list-item">
            <div>
              <div>🎤 语音记录</div>
              <div class="record-content">"今天血压有点高，头有点晕，胃口不太好。吃完药后胃有点不舒服。"</div>
              <div class="text-s text-weak">⏰ 14:30</div>
              <div class="confidence-tag green">🟢 置信度 85%</div>
              <div class="source-tag">来源：语音输入</div>
            </div>
          </div>
          <!-- 记录项2：血压 -->
          <div class="list-item">
            <div>
              <div>📊 血压 148/92 mmHg</div>
              <div class="text-s text-weak">⏰ 08:00</div>
              <div class="confidence-tag green">🟢 置信度 95%</div>
              <div class="source-tag">来源：手动输入</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 历史记录卡片 -->
      <div class="card">
        <div class="card-header">历史记录</div>
        <div class="card-body" id="historyRecords">
          <div class="list-item">
            <span>6月26日 头晕缓解</span>
            <span class="confidence-tag yellow">🟡 置信度 72%</span>
          </div>
          <div class="list-item">
            <span>6月25日 血压正常</span>
            <span class="confidence-tag green">🟢 置信度 88%</span>
          </div>
        </div>
      </div>

    <!-- 免责声明底部 -->
    <div class="disclaimer-footer" style="position: static; margin-top: var(--space-md); border-radius: 12px;">
      本记录为个人自述，非医疗记录，不构成诊断建议。如有不适请及时就医。
    </div>
    </main>

    <nav class="tab-bar">
      <a class="tab-item active" href="me_home.html">
        <span class="tab-icon">❤️</span>
        <span class="tab-label">健康</span>
      </a>
      <a class="tab-item" href="me_diagnosis.html">
        <span class="tab-icon">🏥</span>
        <span class="tab-label">就医</span>
      </a>
      <a class="tab-item" href="../family/family_home.html">
        <span class="tab-icon">👨‍👩‍👧</span>
        <span class="tab-label">亲人</span>
      </a>
      <a class="tab-item" href="me_profile.html">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>
  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script src="../../shared/js/safety-engine.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    // ===== 记一笔：类型选择 =====
    var currentType = 'feel';
    var typePlaceholders = {
      'feel': '点击这里输入要记录的内容，例如：今天血压有点高，头有点晕',
      'bp': '请输入血压值，例如：145/90',
      'sugar': '请输入血糖值，例如：空腹 6.5',
      'other': '记录其他健康相关信息'
    };
    var typeIcons = {
      'feel': '🤒',
      'bp': '📊',
      'sugar': '🩸',
      'other': '📝'
    };
    var typeLabels = {
      'feel': '身体感受',
      'bp': '血压',
      'sugar': '血糖',
      'other': '其他'
    };

    function selectType(btn, type) {
      currentType = type;
      document.querySelectorAll('.quick-type-tag').forEach(function(t) { t.classList.remove('active'); });
      btn.classList.add('active');
      var input = document.getElementById('quickInput');
      input.placeholder = typePlaceholders[type];
      input.focus();
    }

    // ===== 清空输入 =====
    function clearInput() {
      document.getElementById('quickInput').value = '';
      document.getElementById('quickInput').focus();
    }

    // ===== 紧急症状阻断弹窗（老年用户代理反馈：健康记录需检测致命症状） =====
    function showEmergencyBlock(result) {
      var isRed = result.level === 'red';
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);';
      var box = document.createElement('div');
      box.style.cssText = 'background:#fff;border-radius:16px;padding:24px 20px;max-width:320px;text-align:center;';
      var titleColor = isRed ? '#F44336' : '#FF9800';
      var titleText = isRed ? '🚨 检测到紧急症状' : '⚠️ 检测到需关注症状';
      var descText = result.message;
      var suggestionText = result.suggestion || (isRed ? '建议立即拨打 120' : '建议尽快就诊');
      var btnText = isRed ? '拨打 120' : '我知道了';
      var btnColor = isRed ? '#F44336' : '#FF9800';
      box.innerHTML =
        '<div style="font-size:22px;font-weight:700;color:' + titleColor + ';margin-bottom:12px;">' + titleText + '</div>' +
        '<div style="font-size:15px;color:#424242;margin-bottom:8px;line-height:1.5;">' + descText + '</div>' +
        '<div style="font-size:14px;color:' + titleColor + ';font-weight:600;margin-bottom:16px;">' + suggestionText + '</div>' +
        '<div style="display:flex;gap:8px;">' +
          '<button id="emgCancelBtn" style="flex:1;padding:12px;background:#E0E0E0;color:#424242;border:none;border-radius:8px;font-size:15px;font-weight:600;">取消</button>' +
          '<button id="emgConfirmBtn" style="flex:1;padding:12px;background:' + btnColor + ';color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;">' + btnText + '</button>' +
        '</div>';
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      document.getElementById('emgCancelBtn').onclick = function() { overlay.remove(); };
      document.getElementById('emgConfirmBtn').onclick = function() {
        if (isRed) {
          // 二次确认拨打 120
          box.innerHTML =
            '<div style="font-size:22px;font-weight:700;color:#F44336;margin-bottom:12px;">确认拨打 120？</div>' +
            '<div style="font-size:15px;color:#424242;margin-bottom:16px;">您确定要立即拨打急救电话 120 吗？</div>' +
            '<div style="display:flex;gap:8px;">' +
              '<button id="emgFinalCancelBtn" style="flex:1;padding:12px;background:#E0E0E0;color:#424242;border:none;border-radius:8px;font-size:15px;font-weight:600;">再想想</button>' +
              '<button id="emgFinalConfirmBtn" style="flex:1;padding:12px;background:#F44336;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;">确认拨打</button>' +
            '</div>';
          document.getElementById('emgFinalCancelBtn').onclick = function() { overlay.remove(); };
          document.getElementById('emgFinalConfirmBtn').onclick = function() {
            // Demo 模式不真实拨打
            console.log('[Demo] 拨打 120');
            alert('📞 已拨打 120（体验模式，未真实拨打）');
            overlay.remove();
          };
        } else {
          overlay.remove();
        }
      };
    }

    // ===== 提交记录（保存到 localStorage 并实时显示） =====
    function submitInput() {
      var input = document.getElementById('quickInput');
      var text = input.value.trim();
      if (!text) {
        showToast('请输入要记录的内容', 'warning');
        input.focus();
        return;
      }

      // ===== 紧急症状检测（接入 SafetyEngine） =====
      // 老年用户代理测试反馈：健康记录输入框必须检测致命症状
      if (typeof SafetyEngine !== 'undefined') {
        var checkResult = SafetyEngine.checkEmergencySymptoms(text);
        if (checkResult.level === 'red' || checkResult.level === 'yellow') {
          // 触发紧急阻断
          showEmergencyBlock(checkResult);
          return; // 阻止保存，等用户确认
        }
      }

      // 获取当前时间
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      var timeStr = h + ':' + m;

      // 构造新记录项
      var icon = typeIcons[currentType];
      var label = typeLabels[currentType];
      var newRecordHtml = '<div class="list-item" style="background: rgba(216,67,21,0.04); border-left: 3px solid var(--color-primary); padding-left: 12px; border-radius: 8px;">' +
        '<div>' +
          '<div>' + icon + ' ' + label + '</div>' +
          '<div class="record-content">' + escapeHtml(text) + '</div>' +
          '<div class="text-s text-weak">⏰ ' + timeStr + '（刚刚）</div>' +
          '<div class="confidence-tag green">🟢 已保存</div>' +
          '<div class="source-tag">来源：手动输入</div>' +
        '</div>' +
      '</div>';

      // 插入到今日记录顶部
      var todayRecords = document.getElementById('todayRecords');
      var tempDiv = document.createElement('div');
      tempDiv.innerHTML = newRecordHtml;
      todayRecords.insertBefore(tempDiv.firstChild, todayRecords.firstChild);

      // 清空输入框
      input.value = '';
      input.focus();

      // 提示
      showToast('✅ 已保存：' + text.substring(0, 20) + (text.length > 20 ? '...' : ''), 'success');
    }

    // 简单的 HTML 转义
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 键盘支持：Ctrl+Enter 提交
    document.getElementById('quickInput').addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        submitInput();
      }
    });
  </script>
</body>
</html>
