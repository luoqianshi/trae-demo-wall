<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>我的就医 - 银发就医小棉袄</title>

  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/app-layout.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
  <style>
    /* ===== 后续就医计划：紧凑、可点击 ===== */
    .followup-card {
      margin: 0 var(--space-xl) var(--space-md);
      padding: var(--space-md);
      background: linear-gradient(135deg, #E3F2FD 0%, #F5F9FF 100%);
      border: 1px solid rgba(25,118,210,0.18);
      border-left: 4px solid #1976D2;
      border-radius: var(--radius-md);
    }
    .followup-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: var(--space-xs);
    }
    .followup-card-title {
      font-size: var(--font-m); font-weight: 700;
      color: #1976D2;
      display: flex; align-items: center; gap: 6px;
    }
    .followup-count {
      font-size: var(--font-xs); color: #5D4037;
      background: #FFF3E0; padding: 2px 8px; border-radius: 10px;
    }
    .followup-list { display: flex; flex-direction: column; gap: 6px; }
    .followup-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; background: rgba(255,255,255,0.85); border-radius: var(--radius-sm);
      font-size: var(--font-s); color: var(--color-text);
      cursor: pointer; transition: background 0.15s;
    }
    .followup-item:active { background: rgba(255,255,255,1); }
    .followup-item-date { color: #1976D2; font-weight: 600; }
    .followup-item-text { flex: 1; margin: 0 8px; }
    .followup-item-arrow { color: var(--color-text-weak); }
    .same-day-tag {
      font-size: 10px; color: #fff; background: #FF9800;
      padding: 1px 6px; border-radius: 8px; margin-left: 6px;
    }

    /* ===== 挂号卡片（按挂号维度组织） ===== */
    .visit-section-title {
      font-size: var(--font-l); font-weight: 700;
      margin: 0 var(--space-xl) var(--space-sm);
      padding-left: 8px; border-left: 4px solid var(--color-primary);
      display: flex; align-items: center; justify-content: space-between;
    }
    .visit-section-hint {
      font-size: var(--font-xs); color: var(--color-text-weak); font-weight: 400;
    }
    .visit-card {
      margin: 0 var(--space-xl) var(--space-sm);
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .visit-card-header {
      display: flex; align-items: center; gap: 10px;
      padding: var(--space-sm) var(--space-md);
      background: linear-gradient(135deg, #FFF8F0 0%, #FFFFFF 100%);
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
    }
    .visit-card-header:active { background: #FFF3E0; }
    .visit-card-icon {
      font-size: 22px; flex-shrink: 0;
    }
    .visit-card-info { flex: 1; min-width: 0; }
    .visit-card-title {
      font-size: var(--font-m); font-weight: 700; color: var(--color-text);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .visit-card-meta {
      font-size: var(--font-xs); color: var(--color-text-secondary);
      margin-top: 2px;
    }
    .visit-card-arrow {
      color: var(--color-text-weak); font-size: 18px;
      transition: transform 0.2s;
    }
    .visit-card.expanded .visit-card-arrow { transform: rotate(90deg); }
    .visit-card-summary {
      padding: 8px var(--space-md);
      font-size: var(--font-s); color: var(--color-text-secondary);
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .visit-card-detail {
      display: none;
      padding: var(--space-sm) var(--space-md);
      background: #FAFAFA;
    }
    .visit-card.expanded .visit-card-detail { display: block; }
    .visit-detail-block {
      margin-bottom: var(--space-sm);
      padding-bottom: var(--space-sm);
      border-bottom: 1px dashed rgba(0,0,0,0.06);
    }
    .visit-detail-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .visit-detail-label {
      font-size: var(--font-xs); color: var(--color-text-weak);
      margin-bottom: 4px; font-weight: 600;
    }
    .visit-detail-content {
      font-size: var(--font-s); color: var(--color-text); line-height: 1.6;
    }
    .visit-detail-actions {
      display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
    }
    .visit-action-btn {
      padding: 6px 12px; font-size: var(--font-xs);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: #fff; color: var(--color-text);
      cursor: pointer;
    }
    .visit-action-btn.primary {
      background: var(--color-primary); color: #fff; border-color: var(--color-primary);
    }
    .recording-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px; background: #E8F5E9; border-radius: 10px;
      font-size: var(--font-xs); color: #2E7D32;
    }
    .lab-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px; background: #E3F2FD; border-radius: 10px;
      font-size: var(--font-xs); color: #1976D2;
      cursor: pointer; margin-right: 4px;
    }
  </style>
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <span class="navbar-title">我的就医</span>
    </nav>

    <main class="page-content has-tab-bar">

      <!-- ===== 新就诊录音入口（置顶，最高频操作） ===== -->
      <div style="margin: var(--space-md) var(--space-xl) var(--space-md); padding: var(--space-md); background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 4px 12px rgba(216,67,21,0.2);">
        <div>
          <div style="font-size: var(--font-l); font-weight: 700; color: #fff;">🎙️ 新就诊？点这里录音</div>
          <div style="font-size: var(--font-s); color: rgba(255,255,255,0.9); margin-top: 4px;">录音自动整理为本次挂号摘要</div>
        </div>
        <a class="btn-primary" href="me_recording.html" style="padding: 10px 18px; font-size: var(--font-m); background: #fff; color: var(--color-primary); border: none;">开始录音</a>
      </div>

      <!-- ===== 后续就医计划 ===== -->
      <div class="followup-card" id="followupCard">
        <div class="followup-card-header">
          <div class="followup-card-title">📅 后续就医计划</div>
          <span class="followup-count" id="followupCount">加载中...</span>
        </div>
        <div class="followup-list" id="followupList">
          <!-- JS 动态渲染：每个挂号下若有 follow_up，按日期排序展示 -->
        </div>
      </div>

      <!-- ===== 就医记录（以挂号为维度） ===== -->
      <div class="visit-section-title">
        <span>🏥 就医记录 · 按挂号</span>
        <span class="visit-section-hint">点击展开详情</span>
      </div>
      <div id="visitList">
        <!-- JS 动态渲染挂号卡片列表 -->
      </div>

    </main>

    <!-- ===== 底部主菜单：健康 / 就医 / 亲人 / 我的 ===== -->
    <nav class="tab-bar">
      <a class="tab-item" href="me_home.html">
        <span class="tab-icon">❤️</span>
        <span class="tab-label">健康</span>
      </a>
      <a class="tab-item active" href="me_diagnosis.html">
        <span class="tab-icon">🏥</span>
        <span class="tab-label">就医</span>
      </a>
      <a class="tab-item" href="../family/family_home.html">
        <span class="tab-icon">👨‍👩‍👧</span>
        <span class="tab-label">亲人</span>
      </a>
      <a class="tab-item" href="me_profile.html">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我的</span>
      </a>
    </nav>

  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script src="../../shared/js/safety-engine.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    // ===== 工具：按日期分组挂号（同一天多个挂号标记 "同日"） =====
    function groupVisitsByDate(visits) {
      var groups = {};
      visits.forEach(function(v) {
        if (!groups[v.date]) groups[v.date] = [];
        groups[v.date].push(v);
      });
      // 同一天有多个挂号时，按时间排序
      Object.keys(groups).forEach(function(d) {
        groups[d].sort(function(a, b) {
          return (a.time || '').localeCompare(b.time || '');
        });
      });
      return groups;
    }

    // ===== 渲染：后续就医计划（从所有挂号的 follow_up 聚合） =====
    function renderFollowupPlan(visits) {
      var list = document.getElementById('followupList');
      var countEl = document.getElementById('followupCount');
      if (!list || !countEl) return;

      var items = [];
      visits.forEach(function(v) {
        if (v.follow_up && v.follow_up.date) {
          items.push({
            visitId: v.id,
            dept: v.department,
            date: v.follow_up.date,
            items: v.follow_up.items,
            sourceDept: v.follow_up.department || v.department
          });
        }
      });

      // 按日期升序
      items.sort(function(a, b) { return a.date.localeCompare(b.date); });

      if (items.length === 0) {
        list.innerHTML = '<div style="font-size: var(--font-s); color: var(--color-text-weak); padding: 6px 0;">暂无后续就医计划</div>';
        countEl.textContent = '0 项待办';
        return;
      }

      countEl.textContent = items.length + ' 项待办';

      // 计算距今天数
      function daysUntil(target) {
        var today = new Date();
        var t = new Date(target);
        return Math.ceil((t.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      var html = '';
      items.forEach(function(it) {
        var days = daysUntil(it.date);
        var daysLabel = days > 0 ? '还有 ' + days + ' 天' : (days === 0 ? '今天' : '已过 ' + Math.abs(days) + ' 天');
        var urgencyColor = days <= 7 && days >= 0 ? '#FF9800' : '#1976D2';
        html += '<div class="followup-item" onclick="navigateTo(\'me_summary.html?v=' + it.visitId + '\')">' +
                  '<span class="followup-item-date">' + it.date + '</span>' +
                  '<span class="followup-item-text">' + it.items + ' · ' + it.sourceDept + '</span>' +
                  '<span style="font-size: var(--font-xs); color: ' + urgencyColor + ';">' + daysLabel + '</span>' +
                  '<span class="followup-item-arrow">→</span>' +
                '</div>';
      });
      list.innerHTML = html;
    }

    // ===== 渲染：挂号卡片列表（按日期倒序，同日分组） =====
    function renderVisitList(visits) {
      var container = document.getElementById('visitList');
      if (!container) return;

      // 按日期倒序
      var sorted = visits.slice().sort(function(a, b) {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return (b.time || '').localeCompare(a.time || '');
      });

      var groups = groupVisitsByDate(sorted);
      var dates = Object.keys(groups).sort(function(a, b) { return b.localeCompare(a); });

      var html = '';
      dates.forEach(function(date) {
        var sameDay = groups[date].length > 1;
        groups[date].forEach(function(v, idx) {
          var visitId = v.id;
          var sameDayTag = sameDay ? '<span class="same-day-tag">同日 ' + (v.time || '') + '</span>' : '';
          var deptIcon = '🏥';
          if (v.department === '心内科') deptIcon = '❤️';
          else if (v.department === '内分泌科') deptIcon = '🩺';
          else if (v.department === '神经内科') deptIcon = '🧠';
          else if (v.department === '骨科') deptIcon = '🦴';

          // 概要
          var medNames = (v.medications || []).map(function(m) { return m.generic; }).join('、') || '无用药';
          var summary = '<strong>诊断</strong>：' + v.diagnosis.text + ' · <strong>处方</strong>：' + medNames;

          // 详情：录音 / 化验 / 用药方案 / 服药规则
          var detailHtml = '';

          // 录音（支持一次挂号下多段录音）
          var recordings = v.recordings || (v.recording ? [v.recording] : []);
          if (recordings.length > 0) {
            var recHtml = recordings.map(function(r, idx) {
              var title = r.title || ('第 ' + (idx + 1) + ' 段');
              return '<div style="padding: 8px; background: #fff; border-radius: 8px; margin-bottom: 6px; border-left: 3px solid #4CAF50;">' +
                '<div style="font-size: var(--font-xs); color: var(--color-text-weak); margin-bottom: 4px;">🎙️ ' + title + ' · ' + r.source + ' · ' + r.duration + '</div>' +
                '<div style="font-size: var(--font-s); color: var(--color-text); line-height: 1.5;">' + r.text.substring(0, 60) + (r.text.length > 60 ? '...' : '') + '</div>' +
                '<div style="margin-top: 4px;"><button class="visit-action-btn" style="padding: 2px 8px; font-size: 10px;" onclick="showToast(\'🎧 录音回放\', \'info\')">🎧 回放</button></div>' +
              '</div>';
            }).join('');
            detailHtml += '<div class="visit-detail-block">' +
              '<div class="visit-detail-label">🎙️ 就诊录音（' + recordings.length + ' 段）</div>' +
              '<div class="visit-detail-content">' + recHtml + '</div>' +
              '<div class="visit-detail-actions">' +
                '<a class="visit-action-btn primary" href="me_recording.html">🎙️ 录新一段</a>' +
              '</div>' +
            '</div>';
          }

          // 用药方案（简化：只展示药品清单，不展示服药规则/禁忌——不是 Demo 重点）
          if (v.medications && v.medications.length > 0) {
            var medHtml = v.medications.map(function(m) {
              return '· <strong>' + m.generic + '</strong>（' + m.brand + '）' + m.dosage + ' ' + m.amount + ' · ' + m.frequency + ' · ' + m.time;
            }).join('<br>');
            detailHtml += '<div class="visit-detail-block">' +
              '<div class="visit-detail-label">💊 用药方案</div>' +
              '<div class="visit-detail-content">' + medHtml + '</div>' +
              '<div class="visit-detail-actions">' +
                '<a class="visit-action-btn" href="me_medication.html">📋 用药详情</a>' +
              '</div>' +
            '</div>';
          }

          // 化验单
          if (v.lab_reports && v.lab_reports.length > 0) {
            var labHtml = v.lab_reports.map(function(l) {
              return '<span class="lab-chip" onclick="showLabDetail(\'' + v.id + '\', \'' + l.name + '\')">🔬 ' + l.name + ' · ' + l.date + '</span>';
            }).join('');
            detailHtml += '<div class="visit-detail-block">' +
              '<div class="visit-detail-label">🔬 化验单</div>' +
              '<div class="visit-detail-content">' + labHtml + '</div>' +
            '</div>';
          }

          // 后续就医计划
          if (v.follow_up) {
            detailHtml += '<div class="visit-detail-block">' +
              '<div class="visit-detail-label">📅 后续计划</div>' +
              '<div class="visit-detail-content">' + v.follow_up.date + ' 复查 ' + v.follow_up.items + ' · ' + v.follow_up.department + '</div>' +
              '<div class="visit-detail-actions">' +
                '<a class="visit-action-btn" href="me_review.html">📋 查看复查提醒</a>' +
              '</div>' +
            '</div>';
          }

          // 完整摘要入口
          detailHtml += '<div class="visit-detail-actions" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--color-border);">' +
            '<a class="visit-action-btn primary" href="me_summary.html?v=' + visitId + '">📄 查看完整摘要</a>' +
          '</div>';

          html += '<div class="visit-card" id="visit-' + visitId + '">' +
            '<div class="visit-card-header" onclick="toggleVisit(\'' + visitId + '\')">' +
              '<span class="visit-card-icon">' + deptIcon + '</span>' +
              '<div class="visit-card-info">' +
                '<div class="visit-card-title">' +
                  v.department + ' · ' + v.date + (v.time ? ' ' + v.time : '') +
                  sameDayTag +
                '</div>' +
                '<div class="visit-card-meta">' + v.doctor + ' · ' + v.hospital + '</div>' +
              '</div>' +
              '<span class="visit-card-arrow">›</span>' +
            '</div>' +
            '<div class="visit-card-summary">' + summary + '</div>' +
            '<div class="visit-card-detail">' + detailHtml + '</div>' +
          '</div>';
        });
      });

      container.innerHTML = html;
    }

    function toggleVisit(visitId) {
      var card = document.getElementById('visit-' + visitId);
      if (!card) return;
      card.classList.toggle('expanded');
    }

    // ===== 化验单详情 =====
    function showLabDetail(visitId, labName) {
      var visits = (typeof MOCK_DATA !== 'undefined' && MOCK_DATA.visit_records) || [];
      var v = visits.find(function(x) { return x.id === visitId; });
      if (!v || !v.lab_reports) return;
      var lab = v.lab_reports.find(function(l) { return l.name === labName; });
      if (!lab) return;
      var statusText = lab.status === 'normal' ? '✅ 正常' : '⚠️ 异常';
      showToast(lab.name + ' · ' + lab.date + '\n\n' + lab.detail + '\n\n状态：' + statusText + '\n\nDemo：正式版将接入医院HIS系统自动同步', 'info');
    }

    // ===== 兼容旧函数（处方记录/方言翻译入口） =====
    function startDialectTranslate() { navigateTo('me_recording.html'); }
    function showPrescriptions() { navigateTo('me_medication.html'); }

    // ===== 加载并渲染 =====
    (function() {
      var visits = (typeof MOCK_DATA !== 'undefined' && MOCK_DATA.visit_records) || [];
      // 合并 localStorage 中可能新增的就诊记录
      try {
        var stored = localStorage.getItem('my_visit_records');
        if (stored) {
          var storedVisits = JSON.parse(stored);
          if (Array.isArray(storedVisits) && storedVisits.length > 0) {
            visits = storedVisits;
          }
        }
      } catch (e) {}
      renderFollowupPlan(visits);
      renderVisitList(visits);
    })();
  </script>
</body>
</html>
