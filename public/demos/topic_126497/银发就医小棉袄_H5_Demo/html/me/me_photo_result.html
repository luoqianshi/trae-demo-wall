<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>识别结果 - 银发就医小棉袄</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/app-layout.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
  <style>
    /* ===== 原图缩略图 ===== */
    .photo-thumb-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: var(--space-md);
    }
    .photo-thumb {
      width: 120px;
      height: 150px;
      object-fit: cover;
      border-radius: var(--radius-md);
      border: 2px solid var(--color-border);
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s;
      background: var(--color-bg-gray);
    }
    .photo-thumb:active {
      transform: scale(0.96);
    }
    .photo-thumb-placeholder {
      width: 120px;
      height: 150px;
      border-radius: var(--radius-md);
      border: 2px dashed var(--color-border);
      background: var(--color-bg-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-weak);
      font-size: var(--font-s);
      text-align: center;
      line-height: 1.4;
    }

    /* ===== 文档类型标签 ===== */
    .doc-type-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: var(--font-s);
      font-weight: 600;
      margin-bottom: var(--space-sm);
    }
    .doc-type-tag.prescription { background: var(--color-primary-light); color: var(--color-primary); }
    .doc-type-tag.lab_report { background: var(--color-warn-light); color: #E65100; }
    .doc-type-tag.registration { background: var(--color-safe-light); color: #2E7D32; }
    .doc-type-tag.other { background: var(--color-bg-gray); color: var(--color-text-secondary); }
    .theme-accessible .doc-type-tag { font-size: 20px; padding: 8px 20px; }

    /* ===== 药品列表项 ===== */
    .med-item {
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .med-item:last-child {
      border-bottom: none;
    }
    .med-item-name {
      font-size: var(--font-m);
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 4px;
    }
    .med-item-meta {
      font-size: var(--font-s);
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .med-item-note {
      font-size: var(--font-s);
      color: var(--color-warn);
      margin-top: 4px;
    }
    .theme-accessible .med-item-name { font-size: 26px; }
    .theme-accessible .med-item-meta { font-size: 22px; }

    /* ===== 化验指标表格 ===== */
    .lab-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-m);
    }
    .lab-table th,
    .lab-table td {
      padding: var(--space-xs) var(--space-sm);
      text-align: left;
      border-bottom: 1px solid var(--color-border);
    }
    .lab-table th {
      font-weight: 600;
      color: var(--color-text-secondary);
      font-size: var(--font-s);
    }
    .lab-table td.lab-value {
      font-weight: 600;
    }
    .lab-table tr.lab-abnormal td {
      color: var(--color-danger);
    }
    .lab-table tr.lab-abnormal td.lab-value::after {
      content: attr(data-arrow);
      margin-left: 4px;
    }
    .theme-accessible .lab-table { font-size: 22px; }
    .theme-accessible .lab-table th { font-size: 20px; }

    /* ===== OCR 文本摘要 ===== */
    .ocr-summary {
      font-size: var(--font-m);
      color: var(--color-text);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--color-bg-gray);
      padding: var(--space-sm);
      border-radius: var(--radius-sm);
      max-height: 240px;
      overflow-y: auto;
    }
    .theme-accessible .ocr-summary { font-size: 22px; }

    /* ===== 安全检查详情项 ===== */
    .safety-detail-item {
      padding: var(--space-xs) var(--space-sm);
      margin: var(--space-xs) 0;
      border-radius: var(--radius-sm);
      font-size: var(--font-s);
      line-height: 1.5;
    }
    .safety-detail-item.red {
      background: var(--color-danger-light);
      color: #C62828;
      border-left: 3px solid var(--color-danger);
    }
    .safety-detail-item.yellow {
      background: var(--color-warn-light);
      color: #E65100;
      border-left: 3px solid var(--color-warn);
    }
    .theme-accessible .safety-detail-item { font-size: 20px; }

    /* ===== 信息行 ===== */
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-xs) 0;
      font-size: var(--font-m);
      min-height: 44px;
      align-items: center;
    }
    .info-row .info-label {
      color: var(--color-text-secondary);
      flex-shrink: 0;
    }
    .info-row .info-value {
      color: var(--color-text);
      font-weight: 500;
      text-align: right;
      margin-left: var(--space-sm);
    }
    .theme-accessible .info-row { font-size: 24px; min-height: 56px; }

    /* ===== 底部操作按钮 ===== */
    .result-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      padding: var(--space-md) 0 var(--space-xxl);
    }
    .result-actions .btn-primary,
    .result-actions .btn-secondary {
      height: 72px;
    }
    .theme-accessible .result-actions .btn-primary,
    .theme-accessible .result-actions .btn-secondary {
      height: 80px;
      font-size: 26px;
    }

    /* ===== 原图放大弹窗 ===== */
    .image-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: var(--space-md);
    }
    .image-modal.active {
      display: flex;
    }
    .image-modal img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: var(--radius-md);
    }
    .image-modal-close {
      position: absolute;
      top: var(--space-md);
      right: var(--space-md);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 28px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== 空状态 ===== */
    .empty-result {
      text-align: center;
      padding: var(--space-xxl) var(--space-md);
      color: var(--color-text-weak);
    }
    .empty-result-icon {
      font-size: 64px;
      margin-bottom: var(--space-md);
    }
  </style>
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">识别结果</span>
    </nav>

    <main class="page-content" id="resultContent">
      <!-- 动态渲染 -->
    </main>
  </div>

  <!-- 原图放大弹窗 -->
  <div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <button class="image-modal-close" onclick="closeImageModal()">×</button>
    <img id="modalImage" alt="原图放大">
  </div>

  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script src="../../shared/js/safety-engine.js"></script>
  <script src="../../shared/js/photo-ocr.js"></script>
  <script>
    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    // 文档类型显示配置
    var TYPE_MAP = {
      prescription: { label: '处方单', icon: '💊', cls: 'prescription' },
      lab_report: { label: '化验单', icon: '🔬', cls: 'lab_report' },
      registration: { label: '挂号单', icon: '🏥', cls: 'registration' },
      other: { label: '其他单据', icon: '📄', cls: 'other' }
    };
    // 安全等级 emoji 映射
    var SAFETY_EMOJI = { green: '🟢', yellow: '🟡', red: '🔴' };
    var SAFETY_TEXT = { green: '安全', yellow: '需注意', red: '有风险' };

    var resultData = null;

    // ===== 初始化：从 sessionStorage 读取结果 =====
    (function init() {
      var raw = sessionStorage.getItem('photo_analysis_result');
      if (!raw) {
        renderEmpty();
        return;
      }
      try {
        resultData = JSON.parse(raw);
        renderResult();
      } catch (e) {
        renderEmpty();
      }
    })();

    // ===== 渲染空状态 =====
    function renderEmpty() {
      document.getElementById('resultContent').innerHTML =
        '<div class="empty-result">' +
        '<div class="empty-result-icon">📷</div>' +
        '<p style="font-size: var(--font-l); margin-bottom: var(--space-md);">未获取到识别结果</p>' +
        '<button class="btn-primary" style="height: 72px;" onclick="navigateTo(\'me_photo.html\')">去拍照</button>' +
        '</div>';
    }

    // ===== 渲染结果（按类型分发） =====
    function renderResult() {
      var type = resultData.type || 'other';
      var cfg = TYPE_MAP[type] || TYPE_MAP.other;
      var html = '';

      // 文档类型标签
      html += '<div style="text-align:center; padding-top: var(--space-sm);">' +
        '<span class="doc-type-tag ' + cfg.cls + '">' + cfg.icon + ' ' + cfg.label + '</span>' +
        '</div>';

      // 原图缩略图
      html += renderThumbnail();

      // 按类型渲染具体内容
      if (type === 'prescription') {
        html += renderPrescription();
      } else if (type === 'lab_report') {
        html += renderLabReport();
      } else if (type === 'registration') {
        html += renderRegistration();
      } else {
        html += renderOther();
      }

      // 底部操作按钮
      html += renderActions(type);

      document.getElementById('resultContent').innerHTML = html;
    }

    // ===== 原图缩略图 =====
    function renderThumbnail() {
      if (resultData.imageBase64) {
        return '<div class="photo-thumb-wrap">' +
          '<img class="photo-thumb" src="' + resultData.imageBase64 + '" alt="原图缩略图" onclick="openImageModal()">' +
          '</div>';
      }
      return '<div class="photo-thumb-wrap">' +
        '<div class="photo-thumb-placeholder">📋<br>示例演示<br>无原图</div>' +
        '</div>';
    }

    // ===== 处方单渲染 =====
    function renderPrescription() {
      var html = '';

      // 诊断信息卡片
      html += '<div class="card"><div class="card-header">诊断信息</div><div class="card-body">' +
        '<p style="font-size: var(--font-m);">' + escapeHtml(resultData.diagnosis || '未识别到诊断信息') + '</p>' +
        '</div></div>';

      // 药品列表卡片
      var meds = resultData.medications || [];
      html += '<div class="card"><div class="card-header">药品列表（' + meds.length + ' 种）</div><div class="card-body">';
      if (meds.length === 0) {
        html += '<p class="text-weak">未识别到药品</p>';
      } else {
        meds.forEach(function (m) {
          html += '<div class="med-item">' +
            '<div class="med-item-name">' + escapeHtml(m.name || m.generic || '') +
              (m.brand ? '（' + escapeHtml(m.brand) + '）' : '') + '</div>' +
            (m.dosage ? '<div class="med-item-meta">剂量：' + escapeHtml(m.dosage) + '</div>' : '') +
            (m.frequency ? '<div class="med-item-meta">频次：' + escapeHtml(m.frequency) + '</div>' : '') +
            (m.usage ? '<div class="med-item-meta">用法：' + escapeHtml(m.usage) + '</div>' : '') +
            (m.note ? '<div class="med-item-note">⚠️ ' + escapeHtml(m.note) + '</div>' : '') +
            '</div>';
        });
      }
      html += '</div></div>';

      // 安全检查卡片
      html += renderSafetyCard();

      // 复诊信息
      if (resultData.followUp) {
        html += '<div class="card" style="border-color: var(--color-warn);"><div class="card-header">' +
          '<span>复诊提醒</span><span class="safety-badge yellow">📅</span></div><div class="card-body">' +
          '<p style="font-size: var(--font-m);">' + escapeHtml(resultData.followUp) + '</p>' +
          '</div></div>';
      }

      return html;
    }

    // ===== 安全检查卡片 =====
    function renderSafetyCard() {
      var s = resultData.safetyResult;
      if (!s) return '';
      var level = s.level || 'green';
      var html = '<div class="card"><div class="card-header">' +
        '<span>安全检查</span>' +
        '<span class="safety-badge ' + level + '">' + SAFETY_EMOJI[level] + ' ' + SAFETY_TEXT[level] + '</span>' +
        '</div><div class="card-body">';
      html += '<p style="font-size: var(--font-m); margin-bottom: var(--space-sm);">' + escapeHtml(s.message || '') + '</p>';
      if (s.details && s.details.length > 0) {
        s.details.forEach(function (d) {
          html += '<div class="safety-detail-item ' + d.level + '">' +
            '<strong>' + escapeHtml(d.drugs) + '</strong>：' + escapeHtml(d.risk) +
            '</div>';
        });
      }
      if (level === 'red') {
        html += '<p class="text-danger" style="font-size: var(--font-s); margin-top: var(--space-sm);">⚠️ 检测到严重药物风险，请务必咨询医生</p>';
      }
      html += '</div></div>';
      return html;
    }

    // ===== 化验单渲染 =====
    function renderLabReport() {
      var html = '';
      var items = resultData.labItems || [];

      // 指标列表卡片（表格）
      html += '<div class="card"><div class="card-header">检验指标</div><div class="card-body">';
      if (items.length === 0) {
        html += '<p class="text-weak">未识别到检验指标</p>';
      } else {
        html += '<table class="lab-table"><thead><tr>' +
          '<th>项目</th><th>结果</th><th>参考范围</th>' +
          '</tr></thead><tbody>';
        items.forEach(function (it) {
          var abnormal = it.status === 'high' || it.status === 'low';
          var arrow = it.status === 'high' ? '↑' : (it.status === 'low' ? '↓' : '');
          html += '<tr class="' + (abnormal ? 'lab-abnormal' : '') + '">' +
            '<td>' + escapeHtml(it.name) + '</td>' +
            '<td class="lab-value" data-arrow="' + arrow + '">' + escapeHtml(it.value) + '</td>' +
            '<td>' + escapeHtml(it.reference || '') + '</td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        // 异常项提示
        var abnormalCount = items.filter(function (i) { return i.status === 'high' || i.status === 'low'; }).length;
        if (abnormalCount > 0) {
          html += '<p class="text-danger" style="font-size: var(--font-s); margin-top: var(--space-sm);">⚠️ 共 ' + abnormalCount + ' 项指标异常（红色高亮），请咨询医生</p>';
        }
      }
      html += '</div></div>';
      return html;
    }

    // ===== 挂号单渲染 =====
    function renderRegistration() {
      var html = '';
      html += '<div class="card"><div class="card-header">就诊信息</div><div class="card-body">';
      html += infoRow('医院', resultData.hospital);
      html += infoRow('科室', resultData.department || '—');
      html += infoRow('医生', resultData.doctor || '—');
      html += infoRow('日期', resultData.date || '—');
      html += '</div></div>';
      return html;
    }

    // ===== 其他类型渲染 =====
    function renderOther() {
      var html = '';
      html += '<div class="card"><div class="card-header">识别内容</div><div class="card-body">';
      var summary = resultData.summary || resultData.ocrText || '';
      html += '<div class="ocr-summary">' + escapeHtml(summary) + '</div>';
      html += '</div></div>';
      // 通用就诊信息
      if (resultData.hospital || resultData.doctor || resultData.date) {
        html += '<div class="card"><div class="card-header">单据信息</div><div class="card-body">';
        html += infoRow('医院', resultData.hospital || '—');
        html += infoRow('医生', resultData.doctor || '—');
        html += infoRow('日期', resultData.date || '—');
        html += '</div></div>';
      }
      return html;
    }

    // ===== 信息行 =====
    function infoRow(label, value) {
      return '<div class="info-row"><span class="info-label">' + label + '</span>' +
        '<span class="info-value">' + escapeHtml(value || '—') + '</span></div>';
    }

    // ===== 底部操作按钮 =====
    function renderActions(type) {
      var html = '<div class="result-actions">';
      if (type === 'prescription') {
        html += '<button class="btn-primary" onclick="confirmPrescription()">确认生成用药提醒 →</button>';
        html += '<button class="btn-secondary" onclick="goBack()">取消</button>';
      } else if (type === 'lab_report') {
        html += '<button class="btn-primary" onclick="saveToHealthLog()">保存到健康档案 →</button>';
      } else if (type === 'registration') {
        html += '<button class="btn-primary" onclick="createVisitRecord()">创建就诊记录 →</button>';
      } else {
        html += '<button class="btn-primary" onclick="saveToHealthLog()">保存到健康档案 →</button>';
      }
      html += '</div>';
      return html;
    }

    // ===== 处方确认：生成用药提醒 =====
    function confirmPrescription() {
      if (!resultData) return;
      var safetyResult = resultData.safetyResult || checkPrescriptionSafety(resultData.medications || []);
      // 红色风险二次确认
      if (safetyResult.level === 'red') {
        if (!confirm('检测到严重药物风险，确定仍要生成用药提醒吗？\n\n' + safetyResult.message)) {
          return;
        }
      }
      // 生成用药提醒（存入就诊记录 + 开启提醒）
      var record = generateMedicationReminder(resultData, safetyResult);
      // 存入拍照记录
      addPhotoRecord(buildPhotoRecord('prescription'));
      // 清理 sessionStorage
      sessionStorage.removeItem('photo_analysis_result');
      showToast('已生成用药提醒', 'success');
      setTimeout(function () {
        navigateTo('me_medication.html');
      }, 600);
    }

    // ===== 保存到健康档案（化验单 / 其他） =====
    function saveToHealthLog() {
      if (!resultData) return;
      var logs = getHealthLogs();
      var today = getTodayStr();
      var entry = {
        date: resultData.date || today,
        time: getNowTimeStr(),
        source: 'photo',
        type: resultData.type,
        content: buildHealthLogContent(),
        extracted: buildHealthLogExtracted()
      };
      logs.unshift(entry);
      saveHealthLogs(logs);
      addPhotoRecord(buildPhotoRecord(resultData.type));
      sessionStorage.removeItem('photo_analysis_result');
      showToast('已保存到健康档案', 'success');
      setTimeout(function () {
        navigateTo('me_health_log.html');
      }, 600);
    }

    // 构造健康日志内容文本
    function buildHealthLogContent() {
      if (resultData.type === 'lab_report') {
        var items = resultData.labItems || [];
        return '化验单识别：' + items.map(function (i) {
          return i.name + ' ' + i.value + (i.status === 'high' ? '↑' : i.status === 'low' ? '↓' : '');
        }).join('，');
      }
      return resultData.summary || resultData.ocrText || '拍照记录';
    }

    // 构造健康日志提取数据（供 me_summary 渲染测量值）
    function buildHealthLogExtracted() {
      if (resultData.type !== 'lab_report') return null;
      var extracted = { measurements: {} };
      (resultData.labItems || []).forEach(function (it) {
        var name = it.name || '';
        var val = parseFloat(it.value);
        if (isNaN(val)) return;
        if (name.indexOf('血糖') !== -1) extracted.measurements.glucose = val;
        else if (name.indexOf('胆固醇') !== -1 && name.indexOf('低密度') === -1 && name.indexOf('高密度') === -1) extracted.measurements.chol = val;
      });
      return extracted;
    }

    // ===== 创建就诊记录（挂号单） =====
    function createVisitRecord() {
      if (!resultData) return;
      addPhotoRecord(buildPhotoRecord('registration'));
      sessionStorage.removeItem('photo_analysis_result');
      showToast('已创建就诊记录', 'success');
      setTimeout(function () {
        navigateTo('me_diagnosis.html');
      }, 600);
    }

    // ===== 构造拍照记录 =====
    function buildPhotoRecord(type) {
      return {
        id: 'photo_' + Date.now(),
        type: type,
        source: resultData.source || '',
        imageBase64: resultData.imageBase64 || '',
        ocrText: (resultData.ocrText || '').substring(0, 500),
        timestamp: resultData.timestamp || new Date().toISOString(),
        date: getTodayStr()
      };
    }

    // ===== 原图放大弹窗 =====
    function openImageModal() {
      if (!resultData || !resultData.imageBase64) return;
      document.getElementById('modalImage').src = resultData.imageBase64;
      document.getElementById('imageModal').classList.add('active');
    }
    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('active');
      document.getElementById('modalImage').removeAttribute('src');
    }
  </script>
</body>
</html>
