<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>分享给亲人</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">分享给亲人</span>
    </nav>
    <main class="page-content">
      <!-- 分享说明卡片 -->
      <div class="card">
        <div class="card-title">分享就诊记录</div>
        <div class="card-body">
          <p class="text-m text-secondary">将您的就诊摘要分享给亲人，让他们了解您的健康状况。</p>
        </div>
      </div>

      <!-- 选择就诊记录卡片 -->
      <div class="card">
        <div class="card-title">选择就诊记录</div>
        <div class="card-body" id="visit-list">
          <!-- 动态填充 -->
        </div>
      </div>

      <!-- 分享对象卡片 -->
      <div class="card">
        <div class="card-title">分享给</div>
        <div class="card-body" id="family-list">
          <!-- 动态填充 -->
        </div>
      </div>

      <!-- 已分享记录卡片 -->
      <div class="card">
        <div class="card-title">已分享记录</div>
        <div class="card-body" id="share-log-list">
          <!-- 动态填充 -->
        </div>
      </div>

      <!-- 确认分享按钮 -->
      <button class="btn-primary" onclick="showShareModal()">确认分享</button>
    </main>
  </div>

  <!-- 授权弹窗 -->
  <div class="modal-overlay" id="share-modal" style="display:none;">
    <div class="modal-card">
      <div class="modal-title">确认分享</div>
      <div class="modal-body" id="modal-body-text">
        <!-- 动态填充 -->
      </div>
      <label class="checkbox-label" id="modal-checkbox-label">
        <input type="checkbox" id="share-agree" onchange="updateConfirmBtn()">
        <span>我已阅读并同意分享以上信息</span>
      </label>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="hideShareModal()">取消</button>
        <button class="btn-primary" id="confirm-share-btn" disabled onclick="confirmShare()">确认分享</button>
      </div>
    </div>
  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    let selectedVisitId = null;
    let selectedFamilyMember = null;

    // 模拟数据
    const visitRecords = [
      { id: 1, date: '6月27日', dept: '心内科', diagnosis: '冠心病、高脂血症' },
      { id: 2, date: '6月10日', dept: '内分泌科', diagnosis: '2型糖尿病' }
    ];

    const familyMembers = [
      { id: 1, name: '小芳', relation: '女儿', hasShareRecord: true },
      { id: 2, name: '小明', relation: '儿子', hasShareRecord: false },
      { id: 3, name: '张建国', relation: '配偶', hasShareRecord: false }
    ];

    const shareLogs = [
      { visitId: 1, familyId: 1, date: '6月27日' }
    ];

    // 渲染就诊记录列表
    function renderVisitList() {
      const container = document.getElementById('visit-list');
      visitRecords.forEach((v, i) => {
        const div = document.createElement('div');
        div.className = 'list-item clickable' + (i === 0 ? ' selected' : '');
        div.dataset.id = v.id;
        div.innerHTML = '<span>' + v.date + ' ' + v.dept + ' ' + v.diagnosis + '</span><span>→</span>';
        div.onclick = function() {
          document.querySelectorAll('#visit-list .list-item').forEach(el => el.classList.remove('selected'));
          this.classList.add('selected');
          selectedVisitId = v.id;
        };
        container.appendChild(div);
        if (i === 0) selectedVisitId = v.id;
      });
    }

    // 渲染分享对象列表
    function renderFamilyList() {
      const container = document.getElementById('family-list');
      familyMembers.forEach(m => {
        const label = document.createElement('label');
        label.className = 'checkbox-label';
        const checked = m.hasShareRecord ? ' checked' : '';
        label.innerHTML = '<input type="checkbox"' + checked + ' data-id="' + m.id + '" data-name="' + m.name + '" data-relation="' + m.relation + '"> <span>' + m.relation + ' ' + m.name + '</span>';
        label.querySelector('input').onchange = function() {
          selectedFamilyMember = this.checked ? { id: parseInt(this.dataset.id), name: this.dataset.name, relation: this.dataset.relation } : null;
        };
        container.appendChild(label);
        if (m.hasShareRecord) {
          selectedFamilyMember = { id: m.id, name: m.name, relation: m.relation };
        }
      });
    }

    // 渲染已分享记录
    function renderShareLogs() {
      const container = document.getElementById('share-log-list');
      if (shareLogs.length === 0) {
        container.innerHTML = '<p class="text-s text-weak">暂无分享记录</p>';
        return;
      }
      shareLogs.forEach(log => {
        const visit = visitRecords.find(v => v.id === log.visitId);
        const member = familyMembers.find(m => m.id === log.familyId);
        if (visit && member) {
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = '<span>' + visit.date + ' → ' + member.relation + ' ' + member.name + '</span><span class="badge confirmed">已分享</span>';
          container.appendChild(div);
        }
      });
    }

    // 显示分享弹窗
    function showShareModal() {
      if (!selectedVisitId) {
        alert('请选择就诊记录');
        return;
      }
      if (!selectedFamilyMember) {
        alert('请选择分享对象');
        return;
      }
      const visit = visitRecords.find(v => v.id === selectedVisitId);
      const modalBody = document.getElementById('modal-body-text');
      modalBody.textContent = '您确定将本次就诊摘要（诊断、用药、服药规则）分享给 ' + selectedFamilyMember.relation + ' ' + selectedFamilyMember.name + ' 吗？分享后对方可查看您的健康记录。您可随时撤回分享。';
      document.getElementById('share-agree').checked = false;
      document.getElementById('confirm-share-btn').disabled = true;
      document.getElementById('share-modal').style.display = 'flex';
    }

    function hideShareModal() {
      document.getElementById('share-modal').style.display = 'none';
    }

    function updateConfirmBtn() {
      document.getElementById('confirm-share-btn').disabled = !document.getElementById('share-agree').checked;
    }

    function confirmShare() {
      if (!document.getElementById('share-agree').checked) return;
      shareLogs.push({
        visitId: selectedVisitId,
        familyId: selectedFamilyMember.id,
        date: visitRecords.find(v => v.id === selectedVisitId).date
      });
      hideShareModal();
      renderShareLogs();
      alert('分享成功！');
    }

    // 初始化
    renderVisitList();
    renderFamilyList();
    renderShareLogs();
  </script>
</body>
</html>
