﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>我的亲人 - 银发就医小棉袄</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="../../favicon-180.png" sizes="180x180">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css?v=20260711c">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/app-layout.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
  <style>
    /* ===== 家人总览（紧凑） ===== */
    .family-overview-card {
      margin: 0 var(--space-xl) var(--space-md);
      padding: var(--space-md);
      background: linear-gradient(135deg, #E3F2FD 0%, #FBE9E7 100%);
      border-radius: var(--radius-md);
      border-left: 4px solid #1976D2;
    }
    .family-overview-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: var(--font-xs); color: var(--color-text-secondary);
    }
    .family-overview-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-xs);
      margin: var(--space-sm) 0;
    }
    .family-stat {
      text-align: center; padding: 6px 4px;
      background: rgba(255,255,255,0.7); border-radius: var(--radius-sm);
    }
    .family-stat-num { font-size: var(--font-l); font-weight: 700; }
    .family-stat-label { font-size: 10px; color: var(--color-text-secondary); }

    /* ===== 简化亲人卡片（只显示概要） ===== */
    .person-card {
      display: flex; align-items: center; gap: 12px;
      margin: 0 var(--space-xl) var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .person-card:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .person-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px; font-weight: 700;
      flex-shrink: 0;
    }
    .person-info { flex: 1; min-width: 0; }
    .person-name-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .person-name {
      font-size: var(--font-m); font-weight: 700; color: var(--color-text);
    }
    .person-relation {
      font-size: var(--font-xs); color: var(--color-text-secondary);
    }
    .person-meta {
      font-size: var(--font-xs); color: var(--color-text-secondary);
      margin-top: 2px;
    }
    .person-status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; margin-right: 4px;
    }
    .person-status-dot.green { background: #4CAF50; }
    .person-status-dot.yellow { background: #FF9800; }
    .person-status-dot.red { background: #F44336; }
    .person-arrow {
      color: var(--color-text-weak); font-size: 18px;
    }
    .person-badge-new {
      font-size: 10px; color: #fff; background: #FF6B35;
      padding: 1px 6px; border-radius: 8px;
    }

    /* ===== 同步动画（设计师 P1：增强温度感） ===== */
    .live-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: #4CAF50; margin-right: 4px;
      animation: live-pulse 1.8s ease-in-out infinite;
    }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(76,175,80,0.6); }
      50% { opacity: 0.85; transform: scale(1.2); box-shadow: 0 0 0 6px rgba(76,175,80,0); }
    }
    .sync-timestamp {
      font-size: 10px; color: var(--color-text-weak);
      margin-top: 2px;
    }
  </style>
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <span class="navbar-title">我的亲人</span>
      <button class="navbar-action" onclick="showToast('添加亲人 - 概念演示', 'info')">+ 添加</button>
    </nav>

    <main class="page-content has-tab-bar">

      <!-- ===== 家人总览（简化） ===== -->
      <div class="family-overview-card">
        <div class="family-overview-row">
          <span style="font-weight: 700; color: #1976D2;">👨‍👩‍👧 家人总状态</span>
          <span style="background: #FFF3E0; color: #5D4037; padding: 2px 8px; border-radius: 10px;">🆕 2 条更新</span>
        </div>
        <div class="family-overview-stats">
          <div class="family-stat">
            <div class="family-stat-num" style="color: #2E7D32;">3</div>
            <div class="family-stat-label">家人</div>
          </div>
          <div class="family-stat">
            <div class="family-stat-num" style="color: #1976D2;">2/3</div>
            <div class="family-stat-label">已服药</div>
          </div>
          <div class="family-stat">
            <div class="family-stat-num" style="color: #FF9800;">1</div>
            <div class="family-stat-label">需关注</div>
          </div>
        </div>
      </div>

      <!-- ===== 亲人列表（每张卡只显示概要，点击进入详情页） ===== -->
      <div id="personList">
        <!-- JS 动态渲染 -->
      </div>

      <!-- ===== 关怀提醒（保留但简化） ===== -->
      <div style="margin: var(--space-md) var(--space-xl); padding: 10px var(--space-md); background: #FFF8E1; border-left: 3px solid #FF9800; border-radius: var(--radius-sm); font-size: var(--font-s); color: #5D4037; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <span>⚠️ 妈妈连续3天未确认提醒</span>
        <button class="btn-secondary" style="padding: 4px 10px; font-size: var(--font-xs);" onclick="showToast('已发送提醒给妈妈', 'success')">去提醒</button>
      </div>

    </main>

    <!-- ===== 底部主菜单 ===== -->
    <nav class="tab-bar">
      <a class="tab-item" href="../me/me_home.html">
        <span class="tab-icon">❤️</span>
        <span class="tab-label">健康</span>
      </a>
      <a class="tab-item" href="../me/me_diagnosis.html">
        <span class="tab-icon">🏥</span>
        <span class="tab-label">就医</span>
      </a>
      <a class="tab-item active" href="family_home.html">
        <span class="tab-icon">👨‍👩‍👧</span>
        <span class="tab-label">亲人</span>
      </a>
      <a class="tab-item" href="../me/me_profile.html">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script src="../../shared/js/safety-engine.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    // ===== 家人数据（简化的概要） =====
    var FAMILY_MEMBERS = [
      {
        id: 'mom',
        name: '张秀兰',
        relation: '母亲',
        avatar: '张',
        avatarColor: 'linear-gradient(135deg, #FF7B42, #E06A35)',
        age: 72, dialect: '四川话',
        lastVisit: '6月27日 心内科',
        lastDiagnosis: '冠心病、高脂血症稳定期',
        todayMeds: { taken: 1, total: 2 },
        safetyLevel: 'yellow',
        safetyText: '需关注',
        hasUpdate: true,
        nextFollowup: '7月24日 复查',
        syncTime: '2 分钟前'
      },
      {
        id: 'dad',
        name: '张国强',
        relation: '父亲',
        avatar: '国',
        avatarColor: 'linear-gradient(135deg, #4A6CF7, #3B5DE7)',
        age: 75, dialect: '普通话',
        lastVisit: '6月10日 骨科',
        lastDiagnosis: '膝关节退行性病变',
        todayMeds: { taken: 2, total: 2 },
        safetyLevel: 'green',
        safetyText: '良好',
        hasUpdate: false,
        nextFollowup: null,
        syncTime: '15 分钟前'
      },
      {
        id: 'spouse',
        name: '张建国',
        relation: '配偶',
        avatar: '建',
        avatarColor: 'linear-gradient(135deg, #4CAF50, #388E3C)',
        age: 70, dialect: '普通话',
        lastVisit: '5月15日 体检中心',
        lastDiagnosis: '各项指标正常',
        todayMeds: { taken: 0, total: 0 },
        safetyLevel: 'green',
        safetyText: '良好',
        hasUpdate: false,
        nextFollowup: null,
        syncTime: '1 小时前'
      }
    ];

    function renderPersonList() {
      var container = document.getElementById('personList');
      if (!container) return;
      var html = '';
      FAMILY_MEMBERS.forEach(function(p) {
        var statusDot = '<span class="person-status-dot ' + p.safetyLevel + '"></span>';
        var newBadge = p.hasUpdate ? '<span class="person-badge-new">新</span>' : '';
        var medText = p.todayMeds.total > 0
          ? '💊 今日服药 ' + p.todayMeds.taken + '/' + p.todayMeds.total
          : '💊 暂无用药';
        var medColor = p.todayMeds.total > 0 && p.todayMeds.taken === p.todayMeds.total ? '#4CAF50' : '#666';
        var followupText = p.nextFollowup ? ' · 📅 ' + p.nextFollowup : '';
        // 同步状态：hasUpdate 显示活跃绿点，否则显示时间戳
        var syncBadge = p.hasUpdate
          ? '<span class="live-dot"></span>刚刚同步'
          : '<span class="sync-timestamp">⏱ ' + p.syncTime + '</span>';
        html += '<div class="person-card" onclick="navigateTo(\'family_detail.html?id=' + p.id + '\')">' +
                  '<div class="person-avatar" style="background: ' + p.avatarColor + ';">' + p.avatar + '</div>' +
                  '<div class="person-info">' +
                    '<div class="person-name-row">' +
                      '<span class="person-name">' + p.name + '</span>' +
                      '<span class="person-relation">' + p.relation + ' · ' + p.age + '岁</span>' +
                      newBadge +
                    '</div>' +
                    '<div class="person-meta">' +
                      statusDot + p.safetyText + ' · ' + p.lastVisit +
                    '</div>' +
                    '<div class="person-meta" style="color: ' + medColor + ';">' +
                      medText + followupText +
                    '</div>' +
                    '<div class="person-meta">' + syncBadge + '</div>' +
                  '</div>' +
                  '<span class="person-arrow">›</span>' +
                '</div>';
      });
      container.innerHTML = html;
    }

    renderPersonList();
  </script>
</body>
</html>
