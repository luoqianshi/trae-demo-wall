<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>离线模式</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">离线模式</span>
    </nav>
    <main class="page-content">

      <!-- 当前状态 -->
      <div class="card">
        <div class="text-l" style="font-weight: 600; margin-bottom: var(--space-sm);">当前状态</div>
        <div id="statusIndicator" style="text-align: center; padding: var(--space-md) 0;">
          <div id="statusIcon" style="font-size: 48px; margin-bottom: var(--space-xs);">🟢</div>
          <div id="statusText" class="text-l text-safe" style="font-weight: 600;">在线模式</div>
        </div>
        <p id="statusDesc" class="text-m text-secondary" style="text-align: center; margin-bottom: var(--space-md);">正常连接后端服务</p>
        <button class="btn-primary" id="toggleBtn" onclick="toggleMode()">模拟断网</button>
      </div>

      <!-- 离线模式说明 -->
      <div class="card">
        <div class="text-l" style="font-weight: 600; margin-bottom: var(--space-sm);">离线模式说明</div>
        <p class="text-m">当网络故障时，系统自动切换至离线模式，使用预置录音样本和示例数据。</p>
        <div class="text-l" style="font-weight: 600; margin-top: var(--space-md); margin-bottom: var(--space-sm);">预置数据：</div>
        <ul style="list-style: none; padding: 0;">
          <li class="text-m" style="padding: 4px 0;">✅ 3段就诊录音样本</li>
          <li class="text-m text-secondary" style="padding: 2px 0 2px 24px;">普通话：心内科复诊</li>
          <li class="text-m text-secondary" style="padding: 2px 0 2px 24px;">四川话：糖尿病随访</li>
          <li class="text-m text-secondary" style="padding: 2px 0 2px 24px;">粤语：高血压初诊</li>
          <li class="text-m" style="padding: 4px 0;">✅ 结构化摘要示例数据</li>
          <li class="text-m" style="padding: 4px 0;">✅ 服药记录示例数据</li>
          <li class="text-m" style="padding: 4px 0;">✅ 方言映射表（150条）</li>
        </ul>
      </div>

      <!-- 降级方案 -->
      <div class="card">
        <div class="text-l" style="font-weight: 600; margin-bottom: var(--space-sm);">降级方案</div>
        <ul style="list-style: none; padding: 0;">
          <li class="text-m" style="padding: 6px 0;"><strong>Plan B：</strong>1-2 项未通过 → 砍自动症状功能，核心闭环</li>
          <li class="text-m" style="padding: 6px 0;"><strong>Plan C：</strong>3+ 项未通过 → 仅保留录音+摘要+同步</li>
          <li class="text-m" style="padding: 6px 0;"><strong>Plan D：</strong>无法交付 → 视频+PPT纯演示</li>
        </ul>
      </div>

    </main>
  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    function updateStatusUI() {
      var mode = getDemoMode();
      var statusIcon = document.getElementById('statusIcon');
      var statusText = document.getElementById('statusText');
      var statusDesc = document.getElementById('statusDesc');
      var toggleBtn = document.getElementById('toggleBtn');

      if (mode === 'offline') {
        statusIcon.textContent = '🔴';
        statusText.textContent = '离线模式';
        statusText.className = 'text-l text-danger';
        statusText.style.fontWeight = '600';
        statusDesc.textContent = '使用预置数据演示';
        toggleBtn.textContent = '恢复在线';
      } else {
        statusIcon.textContent = '🟢';
        statusText.textContent = '在线模式';
        statusText.className = 'text-l text-safe';
        statusText.style.fontWeight = '600';
        statusDesc.textContent = '正常连接后端服务';
        toggleBtn.textContent = '模拟断网';
      }
    }

    function toggleMode() {
      var currentMode = getDemoMode();
      var newMode = currentMode === 'offline' ? 'online' : 'offline';
      setDemoMode(newMode);
      updateStatusUI();
    }

    updateStatusUI();
  </script>
</body>
</html>
