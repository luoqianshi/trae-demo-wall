﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>风险确认 - 银发就医小棉袄</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <style>
    /* ===== 红色主题：背景浅红 ===== */
    body, .page {
      background: var(--color-danger-light);
    }

    /* ===== 顶部警告区 ===== */
    .alert-header {
      text-align: center;
      padding: var(--space-xl) 0 var(--space-md);
      animation: scale-in 0.4s ease-out forwards;
    }
    .alert-icon {
      font-size: 88px;
      line-height: 1;
      display: inline-block;
      animation: pulse-record 2s ease-in-out infinite;
    }
    .alert-title {
      color: var(--color-danger);
      font-size: var(--font-xl);
      font-weight: 700;
      margin-top: var(--space-sm);
    }
    .alert-subtitle {
      color: var(--color-danger);
      font-size: var(--font-m);
      margin-top: var(--space-xs);
    }

    /* ===== 风险详情中的风险条目 ===== */
    .risk-item {
      padding: var(--space-xs) 0;
      font-size: var(--font-m);
      line-height: 1.6;
    }
    .risk-item + .risk-item {
      border-top: 1px dashed var(--color-border);
      margin-top: var(--space-xs);
    }

    /* ===== 长按确认按钮 ===== */
    .ack-wrapper {
      margin-top: var(--space-sm);
    }
    .ack-btn {
      position: relative;
      overflow: hidden;
      border-color: var(--color-danger);
      color: var(--color-danger);
      touch-action: none;          /* 防止长按触发系统菜单/缩放 */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .ack-btn .ack-label {
      position: relative;
      z-index: 2;
    }
    .ack-progress {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      background: var(--color-danger);
      opacity: 0.18;
      z-index: 1;
      pointer-events: none;
    }
    .ack-btn.confirmed {
      background: var(--color-danger);
      color: #FFFFFF;
      border-color: var(--color-danger);
    }
    .ack-btn.confirmed .ack-progress {
      width: 100% !important;
      opacity: 0;
    }
    .ack-hint {
      text-align: center;
      font-size: var(--font-s);
      color: var(--color-text-weak);
      margin-top: var(--space-xs);
      min-height: 28px;
    }

    .trae-mark {
      text-align: center;
      padding: var(--space-lg) 0 var(--space-xl);
      color: var(--color-text-weak);
      font-size: var(--font-xs);
    }
  </style>
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">风险确认</span>
    </nav>

    <main class="page-content">

      <!-- 1. 顶部红色警告区 -->
      <div class="alert-header">
        <div class="alert-icon">⚠️</div>
        <h1 class="alert-title">检测到潜在风险</h1>
        <p class="alert-subtitle">安全规则引擎已触发红色硬中断</p>
      </div>

      <!-- 2. 风险详情卡片 -->
      <div class="card" style="border-left: 6px solid var(--color-danger);">
        <div class="card-header">
          <span>风险详情</span>
          <span class="safety-badge red" id="riskTypeBadge">🔴 药物禁忌</span>
        </div>
        <div class="card-body" id="riskDetailBody">
          <!-- 由 JS 根据 URL 参数填充 -->
        </div>
      </div>

      <!-- 3. 就医建议卡片 -->
      <div class="card" style="border-left: 6px solid var(--color-warn); background: var(--color-warn-light);">
        <div class="card-header">
          <span>就医建议</span>
          <span class="safety-badge yellow">🟡 建议</span>
        </div>
        <div class="card-body">
          <p style="font-size: var(--font-m); font-weight: 600;">建议您立即咨询医生确认，不要自行用药。</p>
          <p style="font-size: var(--font-s); color: var(--color-text-secondary); margin-top: var(--space-sm);">
            出于安全考虑，该条医嘱暂不同步至子女端。
          </p>
        </div>
      </div>

      <!-- 4. 底部操作区 -->
      <div style="padding: var(--space-md) 0 var(--space-sm);">
        <!-- 立即咨询医生：主按钮（红色背景） -->
        <button class="btn-primary" id="btnCall" style="background: var(--color-danger); box-shadow: 0 4px 12px rgba(244,67,54,0.3);">
          📞 立即咨询医生
        </button>

        <!-- 我已了解风险：需长按 2 秒确认 -->
        <div class="ack-wrapper">
          <button class="btn-secondary ack-btn" id="btnAck" aria-label="长按确认了解风险">
            <span class="ack-label">我已了解风险</span>
            <span class="ack-progress" id="ackProgress"></span>
          </button>
          <p class="ack-hint" id="ackHint">长按 2 秒以确认了解风险</p>
        </div>
      </div>

      <div class="trae-mark">⚡ 由 TRAE 生成</div>

    </main>
  </div>

  <!-- 拨打电话模态框（模拟） -->
  <div class="modal-overlay" id="callModal" style="display: none;" onclick="closeCallModalOnOverlay(event)">
    <div class="modal">
      <div style="text-align:center; font-size:56px; margin-bottom: var(--space-sm);">📞</div>
      <div class="modal-title" style="color: var(--color-danger);">正在接通医生热线</div>
      <div class="modal-body" style="text-align:center;">
        <p style="margin-bottom: var(--space-sm);">银发就医小棉袄 · 24小时医生热线</p>
        <p style="font-size: var(--font-l); font-weight:700; letter-spacing: 1px;">400-000-0000</p>
        <p class="text-weak" style="margin-top: var(--space-sm); font-size: var(--font-s);">（Demo 演示，不会真实拨号）</p>
      </div>
      <button class="btn-secondary" onclick="closeCallModal()">挂断</button>
    </div>
  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    // ===== 风险类型映射 =====
    // URL 参数：?type=drug&msg=xxx
    // type: drug(药物禁忌) | symptom(紧急症状) | confidence(置信度过低)
    var RISK_TYPES = {
      drug:       { label: '药物禁忌',     icon: '💊' },
      symptom:    { label: '紧急症状',     icon: '🚨' },
      confidence: { label: '置信度过低',   icon: '📊' }
    };

    // 各类型默认风险详情（当 URL 未传 msg 时使用）
    var DEFAULT_DETAILS = {
      drug: [
        '华法林 5mg qd + 阿司匹林 100mg qd',
        '该组合存在出血风险，不建议自行同时服用。'
      ],
      symptom: [
        '录音中检测到紧急症状描述：胸痛、呼吸困难',
        '请立即就医或拨打 120 急救电话。'
      ],
      confidence: [
        '关键字段置信度低于 65%',
        'AI 输出结果不可靠，请咨询医生人工确认。'
      ]
    };

    // 从 URL 参数读取风险类型与详情
    var typeKey = getUrlParam('type') || 'drug';
    var typeInfo = RISK_TYPES[typeKey] || RISK_TYPES.drug;
    var msgParam = getUrlParam('msg');

    // 渲染风险类型徽章
    var riskBadge = document.getElementById('riskTypeBadge');
    riskBadge.textContent = '🔴 ' + typeInfo.label;

    // 渲染风险详情
    var detailBody = document.getElementById('riskDetailBody');
    var details;
    if (msgParam) {
      details = msgParam.split('|'); // 多条详情用 | 分隔
    } else {
      details = DEFAULT_DETAILS[typeKey] || DEFAULT_DETAILS.drug;
    }
    details.forEach(function (line) {
      var p = document.createElement('div');
      p.className = 'risk-item';
      p.textContent = typeInfo.icon + ' ' + line;
      detailBody.appendChild(p);
    });

    // ===== 立即咨询医生（模拟拨打电话）=====
    var callModal = document.getElementById('callModal');
    document.getElementById('btnCall').addEventListener('click', function () {
      callModal.style.display = 'flex';
    });

    function closeCallModal() {
      callModal.style.display = 'none';
    }
    function closeCallModalOnOverlay(e) {
      if (e.target === e.currentTarget) closeCallModal();
    }

    // ===== 长按确认按钮（需长按 2 秒）=====
    var HOLD_DURATION = 2000; // 长按判定时长 2 秒
    var holdTimer = null;
    var confirmed = false;

    var btnAck = document.getElementById('btnAck');
    var ackProgress = document.getElementById('ackProgress');
    var ackHint = document.getElementById('ackHint');

    function startHold(e) {
      if (confirmed) return;
      e.preventDefault();
      // 用 CSS transition 驱动进度条填充
      ackProgress.style.transition = 'none';
      ackProgress.style.width = '0%';
      // 强制回流后启动 2s 线性过渡
      void ackProgress.offsetWidth;
      ackProgress.style.transition = 'width ' + HOLD_DURATION + 'ms linear';
      ackProgress.style.width = '100%';
      ackHint.textContent = '请保持长按...';
      holdTimer = setTimeout(completeHold, HOLD_DURATION);
    }

    function cancelHold() {
      if (confirmed) return;
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      ackProgress.style.transition = 'width 0.2s linear';
      ackProgress.style.width = '0%';
      ackHint.textContent = '长按 2 秒以确认了解风险';
    }

    function completeHold() {
      confirmed = true;
      holdTimer = null;
      ackProgress.style.transition = 'none';
      ackProgress.style.width = '100%';
      btnAck.classList.add('confirmed');
      btnAck.querySelector('.ack-label').textContent = '✅ 已确认风险';
      ackHint.textContent = '已确认，即将返回...';
      // 确认后返回上一页
      setTimeout(function () { goBack(); }, 500);
    }

    // 指针事件（兼容鼠标/触摸）
    btnAck.addEventListener('pointerdown', startHold);
    btnAck.addEventListener('pointerup', cancelHold);
    btnAck.addEventListener('pointerleave', cancelHold);
    btnAck.addEventListener('pointercancel', cancelHold);
    // 阻止移动端长按默认行为（选中文本/弹出菜单）
    btnAck.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  </script>
</body>
</html>
