<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>darkroom — 光影探照式沉浸阅读装置</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #050506;
    --bg-dark: #0a0a0c;
    --text-primary: #e8e4da;
    --text-dim: #8a8478;
    --accent-warm: #d4a853;
    --accent-cool: #5a8fb8;
    --card-bg: rgba(15, 15, 18, 0.92);
    --card-border: rgba(212, 168, 83, 0.2);
    --glow-warm: rgba(212, 168, 83, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
    color: var(--text-primary);
    cursor: none;
    user-select: none;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 1000;
  }

  /* ---- Title Screen ---- */
  #title-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-deep);
    z-index: 500;
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }

  #title-screen.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .title-main {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
    animation: titleFade 2.5s ease-out;
  }

  .title-sub {
    font-size: clamp(0.8rem, 1.5vw, 1rem);
    color: var(--text-dim);
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    margin-bottom: 4rem;
    animation: titleFade 2.5s ease-out 0.5s both;
  }

  .title-divider {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--accent-warm), transparent);
    margin-bottom: 3rem;
    animation: dividerGrow 2s ease-out 1s both;
  }

  .enter-btn {
    position: relative;
    padding: 1rem 3rem;
    background: var(--bg-deep);
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    cursor: pointer;
    transition: all 0.5s ease;
    animation: titleFade 2s ease-out 1.5s both;
    overflow: hidden;
    isolation: isolate;
  }

  .enter-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(
      circle at var(--light-x, 50%) var(--light-y, 50%),
      rgba(212, 168, 83, calc(var(--light-intensity, 0) * 0.15)) 0%,
      rgba(212, 168, 83, calc(var(--light-intensity, 0) * 0.08)) 30%,
      transparent 60%
    );
    pointer-events: none;
    transition: background 0.1s ease;
    z-index: -1;
  }

  .enter-btn::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: inherit;
    background: 
      linear-gradient(var(--light-angle, 0deg),
        transparent calc(50% - 40% * var(--light-intensity, 0)),
        rgba(212, 168, 83, calc(0.6 * var(--light-intensity, 0))) 50%,
        transparent calc(50% + 40% * var(--light-intensity, 0))
      );
    -webkit-mask: 
      linear-gradient(#fff 0 0) content-box, 
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    padding: 1px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 1;
  }

  .enter-btn:hover::after {
    opacity: 1;
  }

  .enter-btn:hover {
    border-color: var(--accent-warm);
    color: var(--accent-warm);
    box-shadow: 
      0 0 30px var(--glow-warm),
      inset 0 0 20px rgba(212, 168, 83, 0.1);
  }

  .enter-btn:hover .btn-text {
    text-shadow: 0 0 20px rgba(212, 168, 83, 0.5);
  }

  .btn-text {
    position: relative;
    z-index: 2;
    transition: text-shadow 0.3s ease;
  }

  .btn-light-ray {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300px;
    height: 100px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 0;
    transform-origin: center center;
  }

  .enter-btn:hover .btn-light-ray {
    opacity: calc(0.15 + var(--ray-intensity, 0) * 0.25);
  }

  .btn-light-ray::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%) rotate(var(--ray-angle, 0deg));
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 230, 180, 0.1) 20%,
      rgba(255, 220, 160, 0.3) 50%,
      rgba(255, 230, 180, 0.1) 80%,
      transparent 100%
    );
    filter: blur(8px);
  }

  .btn-light-ray::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80%;
    height: 60%;
    transform: translate(-50%, -50%) rotate(var(--ray-angle, 0deg));
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 240, 210, 0.15) 30%,
      rgba(255, 230, 190, 0.4) 50%,
      rgba(255, 240, 210, 0.15) 70%,
      transparent 100%
    );
    filter: blur(4px);
  }

  @keyframes titleFade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes dividerGrow {
    from { height: 0; opacity: 0; }
    to { height: 60px; opacity: 1; }
  }

  /* ---- Reader Layout ---- */
  #reader {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
  }

  .text-container {
    flex: 1;
    padding: 6vh 8vw;
    overflow-y: auto;
    scrollbar-width: none;
  }

  .text-container::-webkit-scrollbar { display: none; }

  .chapter-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 300;
    font-style: italic;
    text-align: center;
    margin-bottom: 3rem;
    color: var(--text-primary);
    letter-spacing: 0.1em;
  }

  .chapter-author {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    margin-bottom: 4rem;
    text-transform: uppercase;
  }

  .text-body {
    max-width: 640px;
    margin: 0 auto;
    font-size: 1.05rem;
    line-height: 2.2;
    text-align: justify;
    color: var(--text-primary);
  }

  .text-body p {
    margin-bottom: 1.8em;
    text-indent: 2em;
  }

  .text-body p:first-of-type::first-letter {
    font-family: 'Cormorant Garamond', serif;
    font-size: 4rem;
    float: left;
    line-height: 1;
    margin-right: 0.1em;
    margin-top: 0.1em;
    font-style: italic;
    color: var(--accent-warm);
  }

  .char {
    display: inline;
    transition: color 0.3s ease;
  }

  /* ---- Darkroom Overlay (Canvas) ---- */
  #darkroom-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
    mix-blend-mode: multiply;
  }

  /* ---- Custom Cursor (Flashlight) ---- */
  #cursor-light {
    position: fixed;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 200;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,240,200,0.8) 0%, rgba(255,220,150,0.3) 40%, transparent 70%);
    mix-blend-mode: screen;
  }

  /* ---- Control Panel ---- */
  #control-panel {
    position: fixed;
    right: 2rem;
    top: 50%;
    transform: translateY(-50%);
    width: 260px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 2rem 1.5rem;
    z-index: 300;
    backdrop-filter: blur(10px);
    cursor: default;
    user-select: none;
  }

  #control-panel.collapsed {
    width: 48px;
    padding: 1rem 0;
    right: 1rem;
  }

  #control-panel.collapsed .panel-content { display: none; }
  #control-panel.collapsed .panel-toggle { transform: rotate(180deg); }

  .panel-toggle {
    position: absolute;
    left: -12px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    background: var(--bg-dark);
    border: 1px solid var(--card-border);
    border-radius: 50%;
    color: var(--text-dim);
    font-size: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .panel-toggle:hover {
    color: var(--accent-warm);
    border-color: var(--accent-warm);
  }

  .panel-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    text-align: center;
    margin-bottom: 1.5rem;
    color: var(--accent-warm);
    padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--card-border);
  }

  .control-group {
    margin-bottom: 1.5rem;
  }

  .control-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-bottom: 0.6rem;
    display: flex;
    justify-content: space-between;
  }

  .control-value {
    color: var(--accent-warm);
    font-family: 'Cormorant Garamond', serif;
  }

  .slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: var(--card-border);
    outline: none;
    border-radius: 1px;
  }

  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-warm);
    cursor: pointer;
    box-shadow: 0 0 10px var(--glow-warm);
    transition: transform 0.2s ease;
  }

  .slider::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  .slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-warm);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 10px var(--glow-warm);
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .toggle-label {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .toggle-switch {
    position: relative;
    width: 36px;
    height: 18px;
    background: var(--card-border);
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .toggle-switch.active {
    background: var(--accent-warm);
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    background: var(--text-primary);
    border-radius: 50%;
    transition: transform 0.3s ease;
  }

  .toggle-switch.active::after {
    transform: translateX(18px);
  }

  /* ---- Cards Panel ---- */
  #cards-panel {
    position: fixed;
    left: 0;
    top: 0;
    width: 320px;
    height: 100%;
    background: var(--card-bg);
    border-right: 1px solid var(--card-border);
    z-index: 300;
    transform: translateX(-100%);
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(10px);
    cursor: default;
    user-select: none;
    display: flex;
    flex-direction: column;
  }

  #cards-panel.open {
    transform: translateX(0);
  }

  .cards-header {
    padding: 2rem 1.5rem 1rem;
    border-bottom: 1px solid var(--card-border);
  }

  .cards-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    letter-spacing: 0.2em;
    color: var(--accent-warm);
    margin-bottom: 0.3rem;
  }

  .cards-count {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .cards-list {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    scrollbar-width: thin;
    scrollbar-color: var(--card-border) transparent;
  }

  .cards-list::-webkit-scrollbar { width: 4px; }
  .cards-list::-webkit-scrollbar-track { background: transparent; }
  .cards-list::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 2px; }

  .knowledge-card {
    background: rgba(20, 20, 24, 0.8);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    margin-bottom: 1rem;
    overflow: hidden;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .knowledge-card:hover {
    border-color: var(--accent-warm);
    transform: translateX(4px);
  }

  .card-header {
    padding: 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .card-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--glow-warm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .card-meta {
    flex: 1;
    min-width: 0;
  }

  .card-label {
    font-size: 0.7rem;
    color: var(--accent-warm);
    letter-spacing: 0.1em;
    margin-bottom: 0.2rem;
  }

  .card-quote {
    font-size: 0.8rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-style: italic;
  }

  .card-body {
    padding: 0 1rem 1rem;
    display: none;
  }

  .knowledge-card.expanded .card-body {
    display: block;
  }

  .card-quote-full {
    font-size: 0.85rem;
    line-height: 1.8;
    color: var(--text-primary);
    font-style: italic;
    padding: 0.8rem;
    border-left: 2px solid var(--accent-warm);
    margin-bottom: 1rem;
    background: rgba(212, 168, 83, 0.05);
  }

  .card-analysis {
    font-size: 0.8rem;
    line-height: 1.7;
    color: var(--text-dim);
    margin-bottom: 0.8rem;
  }

  .card-knowledge {
    font-size: 0.78rem;
    line-height: 1.7;
    color: var(--text-dim);
    padding: 0.8rem;
    background: rgba(90, 143, 184, 0.08);
    border-radius: 3px;
    border-left: 2px solid var(--accent-cool);
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.8rem;
  }

  .card-tag {
    font-size: 0.65rem;
    padding: 0.2rem 0.6rem;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .card-jump {
    margin-top: 0.8rem;
    font-size: 0.72rem;
    color: var(--accent-warm);
    letter-spacing: 0.1em;
    text-align: right;
  }

  /* Cards toggle button */
  #cards-toggle {
    position: fixed;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 50%;
    z-index: 350;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 1.2rem;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }

  #cards-toggle:hover {
    color: var(--accent-warm);
    border-color: var(--accent-warm);
    box-shadow: 0 0 20px var(--glow-warm);
  }

  #cards-toggle.hidden { display: none; }

  .card-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 18px;
    height: 18px;
    background: var(--accent-warm);
    border-radius: 50%;
    font-size: 0.65rem;
    color: var(--bg-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
  }

  /* ---- Progress Bar ---- */
  #progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--card-border);
    z-index: 400;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-cool), var(--accent-warm));
    width: 0%;
    transition: width 0.1s ease;
  }

  /* ---- Hidden text (for mask effect) ---- */
  .text-container {
    position: relative;
  }

  /* Responsive */
  @media (max-width: 768px) {
    #control-panel { width: 200px; right: 1rem; padding: 1.5rem 1rem; }
    #cards-panel { width: 280px; }
    .text-container { padding: 4vh 6vw; }
    .text-body { font-size: 0.95rem; line-height: 2; }
  }
</style>
</head>
<body>

<!-- Title Screen -->
<div id="title-screen">
  <div class="title-main">darkroom</div>
  <div class="title-sub">光 影 探 照 式 沉 浸 阅 读</div>
  <div class="title-divider"></div>
  <button class="enter-btn" id="enter-btn">
    <div class="btn-light-ray" id="btn-light-ray"></div>
    <span class="btn-text">进 入 暗 室</span>
  </button>
</div>

<!-- Cursor Light -->
<div id="cursor-light"></div>

<!-- Cards Toggle -->
<div id="cards-toggle" class="hidden">
  ◈
  <span class="card-badge" id="card-badge">0</span>
</div>

<!-- Cards Panel -->
<div id="cards-panel">
  <div class="cards-header">
    <div class="cards-title">知 识 卡 片</div>
    <div class="cards-count" id="cards-count">已收集 0 / 0 张</div>
  </div>
  <div class="cards-list" id="cards-list">
  </div>
</div>

<!-- Control Panel -->
<div id="control-panel">
  <div class="panel-toggle" id="panel-toggle">‹</div>
  <div class="panel-content">
    <div class="panel-title">暗 室 控 制</div>
    
    <div class="control-group">
      <div class="control-label">
        <span>光斑大小</span>
        <span class="control-value" id="radius-value">120px</span>
      </div>
      <input type="range" class="slider" id="radius-slider" min="40" max="200" value="120">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>黑暗深度</span>
        <span class="control-value" id="darkness-value">85%</span>
      </div>
      <input type="range" class="slider" id="darkness-slider" min="40" max="98" value="85">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>光晕柔度</span>
        <span class="control-value" id="feather-value">60%</span>
      </div>
      <input type="range" class="slider" id="feather-slider" min="10" max="90" value="60">
    </div>

    <div class="toggle-row">
      <span class="toggle-label">情绪着色</span>
      <div class="toggle-switch active" id="emotion-toggle"></div>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">显示光标</span>
      <div class="toggle-switch" id="cursor-toggle"></div>
    </div>
  </div>
</div>

<!-- Reader -->
<div id="reader">
  <div class="text-container" id="text-container">
    <h1 class="chapter-title">变色龙</h1>
    <div class="chapter-author">安东 · 契诃夫</div>
    <div class="text-body" id="text-body">
      <!-- Text will be injected by JS -->
    </div>
  </div>
</div>

<!-- Darkroom Canvas -->
<canvas id="darkroom-canvas"></canvas>

<!-- Progress Bar -->
<div id="progress-bar">
  <div id="progress-fill"></div>
</div>

<script>
// ==================== CONFIG ====================

// ==================== EMOTION ANALYSIS (SIMULATED) ====================
function analyzeEmotions(text) {
  const emotions = {};
  const sentences = text.split(/[。！？…]+/).filter(s => s.trim().length > 0);
  
  sentences.forEach((sentence, idx) => {
    const s = sentence.trim();
    
    // Simulate 3D emotion analysis based on keywords and context
    let warmth = 0.5;    // cold(0) <-> warm(1)
    let tension = 0.5;   // calm(0) <-> intense(1)
    let depth = 0.7;     // light(0) <-> deep(1)
    
    // Warmth keywords
    if (/笑|高兴|喜欢|高兴|温暖|爱|高兴|乐意|高兴/.test(s)) warmth += 0.3;
    if (/冷|冰|寒|凄凉|孤独|死|亡|黑暗/.test(s)) warmth -= 0.3;
    
    // Tension keywords
    if (/咬|打|抓|嚷|怒|严厉|混蛋|该死|坏|荒唐|蠢|蠢货/.test(s)) tension += 0.4;
    if (/寂静|平静|慢慢|微微|沉思|深思/.test(s)) tension -= 0.2;
    
    // Depth / weight
    if (/死|亡|尸体|血|恐怖|可怕/.test(s)) depth -= 0.2;
    if (/法律|将军|长官|高贵|名贵/.test(s)) depth += 0.1;
    
    // Climax in middle of story
    const progress = idx / sentences.length;
    if (progress > 0.3 && progress < 0.7) {
      tension += 0.15;
    }
    
    // Apply some randomness for natural feel
    warmth += (Math.random() - 0.5) * 0.1;
    tension += (Math.random() - 0.5) * 0.1;
    depth += (Math.random() - 0.5) * 0.05;
    
    // Clamp
    warmth = Math.max(0, Math.min(1, warmth));
    tension = Math.max(0, Math.min(1, tension));
    depth = Math.max(0.3, Math.min(0.95, depth));
    
    // Map to HSL
    // Hue: cold(blue 200) -> warm(orange/red 30-0)
    const hue = 200 - warmth * 180;
    // Saturation: tension drives saturation
    const saturation = 30 + tension * 50;
    // Lightness: depth drives lightness
    const lightness = 40 + depth * 35;
    
    emotions[idx] = {
      h: hue,
      s: saturation,
      l: lightness,
      warmth,
      tension,
      depth,
      sentence: s
    };
  });
  
  return emotions;
}

// ==================== TEXT RENDERING ====================
function renderText() {
  const container = document.getElementById('text-body');
  const text = CONFIG.sampleText;
  const paragraphs = text.split('\n\n');
  const emotions = analyzeEmotions(text);
  
  let sentenceIdx = 0;
  let html = '';
  
  paragraphs.forEach((para, pIdx) => {
    html += '<p>';
    
    // Split into sentences and punctuation
    const parts = para.split(/([。！？…]+)/);
    
    for (let i = 0; i < parts.length; i += 2) {
      const sentence = parts[i];
      const punct = parts[i + 1] || '';
      
      if (sentence.trim()) {
        const emo = emotions[sentenceIdx] || { h: 45, s: 60, l: 85 };
        
        // Each character gets a slightly varied color
        for (let c = 0; c < sentence.length; c++) {
          const char = sentence[c];
          if (char === ' ' || char === '\u3000') {
            html += char;
            continue;
          }
          
          const charVariation = (Math.sin(c * 0.5 + sentenceIdx * 0.3) + 1) / 2;
          const h = emo.h + (charVariation - 0.5) * 20;
          const s = emo.s + (charVariation - 0.5) * 15;
          const l = emo.l + (charVariation - 0.5) * 10;
          
          html += `<span class="char" data-h="${h.toFixed(1)}" data-s="${s.toFixed(1)}" data-l="${l.toFixed(1)}" data-sentence="${sentenceIdx}">${char}</span>`;
        }
        
        // Punctuation
        for (let p = 0; p < punct.length; p++) {
          html += `<span class="char" data-h="${emo.h}" data-s="${emo.s}" data-l="${emo.l}" data-sentence="${sentenceIdx}">${punct[p]}</span>`;
        }
        
        sentenceIdx++;
      }
    }
    
    html += '</p>';
  });
  
  container.innerHTML = html;
  CONFIG.totalSentences = sentenceIdx;
}

// ==================== DARKROOM CANVAS ====================
const canvas = document.getElementById('darkroom-canvas');
const ctx = canvas.getContext('2d');

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let targetMouseX = mouseX;
let targetMouseY = mouseY;

let lightRadius = 120;
let darkness = 0.85;
let feather = 0.6;
let emotionEnabled = true;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function drawDarkroom() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Smooth follow
  mouseX += (targetMouseX - mouseX) * 0.15;
  mouseY += (targetMouseY - mouseY) * 0.15;
  
  // Draw darkness with hole
  ctx.save();
  
  // Create radial gradient for the light spot
  const innerRadius = lightRadius * (1 - feather * 0.6);
  const outerRadius = lightRadius;
  
  const gradient = ctx.createRadialGradient(
    mouseX, mouseY, innerRadius * 0.3,
    mouseX, mouseY, outerRadius
  );
  
  // Center: fully transparent (light), edges: dark
  gradient.addColorStop(0, `rgba(0, 0, 0, 0)`);
  gradient.addColorStop(0.5, `rgba(0, 0, 0, ${darkness * 0.3})`);
  gradient.addColorStop(1, `rgba(0, 0, 0, ${darkness})`);
  
  ctx.fillStyle = `rgba(0, 0, 0, ${darkness})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, outerRadius, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
  
  // Subtle warm glow
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const glowGradient = ctx.createRadialGradient(
    mouseX, mouseY, 0,
    mouseX, mouseY, lightRadius * 1.5
  );
  glowGradient.addColorStop(0, 'rgba(255, 230, 180, 0.08)');
  glowGradient.addColorStop(0.5, 'rgba(255, 200, 130, 0.03)');
  glowGradient.addColorStop(1, 'rgba(255, 180, 100, 0)');
  ctx.fillStyle = glowGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
  
  requestAnimationFrame(drawDarkroom);
}

// ==================== EMOTION COLORING ====================
function updateEmotionColoring() {
  if (!emotionEnabled) {
    document.querySelectorAll('.char').forEach(el => {
      el.style.color = '';
    });
    return;
  }
  
  const chars = document.querySelectorAll('.char');
  const container = document.getElementById('text-container');
  
  chars.forEach(el => {
    const rect = el.getBoundingClientRect();
    const charX = rect.left + rect.width / 2;
    const charY = rect.top + rect.height / 2;
    
    const dx = charX - mouseX;
    const dy = charY - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < lightRadius * 1.2) {
      const h = parseFloat(el.dataset.h);
      const s = parseFloat(el.dataset.s);
      const l = parseFloat(el.dataset.l);
      
      // Intensity based on distance from center
      const intensity = Math.max(0, 1 - dist / (lightRadius * 1.2));
      const boost = intensity * 0.4;
      
      el.style.color = `hsl(${h}, ${s + boost * 20}%, ${l + boost * 15}%)`;
      el.style.textShadow = intensity > 0.5 
        ? `0 0 ${(intensity - 0.5) * 20}px hsla(${h}, ${s}%, ${l}%, 0.3)` 
        : 'none';
    } else {
      el.style.color = '';
      el.style.textShadow = 'none';
    }
  });
}

    analysis: '确认是将军哥哥的狗后，奥楚蔑洛夫极尽谄媚之能事，对小狗赞不绝口，甚至用亲昵的语气"夸奖"狗咬人咬得好。',
    knowledge: '将军哥哥的出现将讽刺推向顶峰——连将军的亲戚都能让一个警官如此卑躬屈膝，足见权势对人性的扭曲之深。',
    tags: ['高潮', '讽刺极致', '主题深化'],
    icon: '△',
    position: 0.85
  }
];

let collectedCards = new Set();
let lastScrollProgress = 0;

function renderCards() {
  const list = document.getElementById('cards-list');
  const badge = document.getElementById('card-badge');
  const count = document.getElementById('cards-count');
  
  list.innerHTML = '';
  
  KNOWLEDGE_CARDS.forEach((card, idx) => {
    const isCollected = collectedCards.has(card.id);
    
    const cardEl = document.createElement('div');
    cardEl.className = 'knowledge-card' + (isCollected ? ' collected' : ' locked');
    cardEl.dataset.id = card.id;
    cardEl.innerHTML = `
      <div class="card-header">
        <div class="card-icon">${isCollected ? card.icon : '?'}</div>
        <div class="card-meta">
          <div class="card-label">${isCollected ? card.label : '未发现'}</div>
          <div class="card-quote">${isCollected ? card.quote : '继续阅读以解锁……'}</div>
        </div>
      </div>
      ${isCollected ? `
        <div class="card-body">
          <div class="card-quote-full">"${card.fullQuote}"</div>
          <div class="card-analysis">${card.analysis}</div>
          <div class="card-knowledge">${card.knowledge}</div>
          <div class="card-tags">
            ${card.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
          </div>
          <div class="card-jump">→ 跳转至原文</div>
        </div>
      ` : ''}
    `;
    
    if (isCollected) {
      cardEl.querySelector('.card-header').addEventListener('click', () => {
        cardEl.classList.toggle('expanded');
      });
      
      cardEl.querySelector('.card-jump').addEventListener('click', (e) => {
        e.stopPropagation();
        jumpToPosition(card.position);
      });
    }
    
    list.appendChild(cardEl);
  });
  
  badge.textContent = collectedCards.size;
  count.textContent = `已收集 ${collectedCards.size} / ${KNOWLEDGE_CARDS.length} 张`;
}

function checkCardUnlock() {
  const container = document.getElementById('text-container');
  const scrollTop = container.scrollTop;
  const scrollHeight = container.scrollHeight - container.clientHeight;
  const progress = scrollTop / scrollHeight;
  
  KNOWLEDGE_CARDS.forEach(card => {
    if (!collectedCards.has(card.id) && progress >= card.position) {
      collectedCards.add(card.id);
      showCardNotification(card);
      renderCards();
      saveProgress();
    }
  });
  
  // Update progress bar
  document.getElementById('progress-fill').style.width = `${Math.min(100, progress * 100)}%`;
}

function showCardNotification(card) {
  const notification = document.createElement('div');
  notification.style.cssText = `
    position: fixed;
    top: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(15, 15, 18, 0.95);
    border: 1px solid var(--card-border);
    border-color: rgba(212, 168, 83, 0.5);
    padding: 1rem 2rem;
    border-radius: 4px;
    z-index: 600;
    text-align: center;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(10px);
    cursor: default;
  `;
  notification.innerHTML = `
    <div style="font-family: 'Cormorant Garamond', serif; font-size: 0.8rem; letter-spacing: 0.2em; color: var(--accent-warm); margin-bottom: 0.3rem;">◈ 发现知识卡片 ◈</div>
    <div style="font-size: 0.9rem; color: var(--text-primary);">${card.label}</div>
  `;
  
  document.body.appendChild(notification);
  
  requestAnimationFrame(() => {
    notification.style.transform = 'translateX(-50%) translateY(0)';
  });
  
  setTimeout(() => {
    notification.style.transform = 'translateX(-50%) translateY(-100px)';
    setTimeout(() => notification.remove(), 500);
  }, 2500);
}

function jumpToPosition(position) {
  const container = document.getElementById('text-container');
  const scrollHeight = container.scrollHeight - container.clientHeight;
  container.scrollTo({
    top: position * scrollHeight,
    behavior: 'smooth'
  });
}

// ==================== PROGRESS PERSISTENCE ====================
function saveProgress() {
  try {
    const container = document.getElementById('text-container');
    const data = {
      scrollTop: container.scrollTop,
      collectedCards: Array.from(collectedCards),
      settings: {
        lightRadius,
        darkness,
        feather,
        emotionEnabled
      }
    };
    localStorage.setItem('darkroom-progress', JSON.stringify(data));
  } catch (e) {}
}

function loadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem('darkroom-progress') || '{}');
    
    if (data.collectedCards) {
      collectedCards = new Set(data.collectedCards);
    }
    if (data.settings) {
      lightRadius = data.settings.lightRadius || 120;
      darkness = data.settings.darkness ?? 0.85;
      feather = data.settings.feather ?? 0.6;
      emotionEnabled = data.settings.emotionEnabled !== false;
      
      // Update UI
      document.getElementById('radius-slider').value = lightRadius;
      document.getElementById('radius-value').textContent = lightRadius + 'px';
      document.getElementById('darkness-slider').value = darkness * 100;
      document.getElementById('darkness-value').textContent = Math.round(darkness * 100) + '%';
      document.getElementById('feather-slider').value = feather * 100;
      document.getElementById('feather-value').textContent = Math.round(feather * 100) + '%';
      
      const emoToggle = document.getElementById('emotion-toggle');
      if (!emotionEnabled) emoToggle.classList.remove('active');
    }
  } catch (e) {}
}

// ==================== TITLE SCREEN LIGHT EFFECT ====================
function initTitleLightEffect() {
  const btn = document.getElementById('enter-btn');
  const titleScreen = document.getElementById('title-screen');
  if (!btn || !titleScreen) return;

  let rafId = null;
  let targetIntensity = 0;
  let currentIntensity = 0;
  let targetLightX = 50;
  let targetLightY = 50;
  let currentLightX = 50;
  let currentLightY = 50;
  let targetRayAngle = 0;
  let currentRayAngle = 0;
  let targetRayIntensity = 0;
  let currentRayIntensity = 0;

  function update() {
    currentIntensity += (targetIntensity - currentIntensity) * 0.08;
    currentLightX += (targetLightX - currentLightX) * 0.1;
    currentLightY += (targetLightY - currentLightY) * 0.1;
    
    let angleDiff = targetRayAngle - currentRayAngle;
    if (angleDiff > 180) angleDiff -= 360;
    if (angleDiff < -180) angleDiff += 360;
    currentRayAngle += angleDiff * 0.08;
    
    currentRayIntensity += (targetRayIntensity - currentRayIntensity) * 0.08;

    btn.style.setProperty('--light-x', currentLightX + '%');
    btn.style.setProperty('--light-y', currentLightY + '%');
    btn.style.setProperty('--light-intensity', currentIntensity);
    btn.style.setProperty('--light-angle', currentRayAngle + 'deg');
    btn.style.setProperty('--ray-angle', currentRayAngle + 'deg');
    btn.style.setProperty('--ray-intensity', currentRayIntensity);

    if (titleScreen.classList.contains('hidden')) return;
    rafId = requestAnimationFrame(update);
  }

  document.addEventListener('mousemove', (e) => {
    if (titleScreen.classList.contains('hidden')) return;

    const rect = btn.getBoundingClientRect();
    const btnCenterX = rect.left + rect.width / 2;
    const btnCenterY = rect.top + rect.height / 2;
    
    const dx = e.clientX - btnCenterX;
    const dy = e.clientY - btnCenterY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    const maxDist = 400;
    const proximity = Math.max(0, 1 - dist / maxDist);
    
    targetIntensity = proximity;
    targetRayIntensity = Math.max(0, (proximity - 0.3) / 0.7);
    
    const lightX = ((e.clientX - rect.left) / rect.width) * 100;
    const lightY = ((e.clientY - rect.top) / rect.height) * 100;
    targetLightX = Math.max(0, Math.min(100, lightX));
    targetLightY = Math.max(0, Math.min(100, lightY));
    
    const angle = Math.atan2(dy, dx) * (180 / Math.PI);
    targetRayAngle = angle;
  });

  btn.addEventListener('mouseenter', () => {
    targetIntensity = 1;
    targetRayIntensity = 1;
  });

  btn.addEventListener('mouseleave', () => {
  });

  update();
}

// ==================== EVENT HANDLERS ====================
function initEvents() {
  // Mouse move
  document.addEventListener('mousemove', (e) => {
    targetMouseX = e.clientX;
    targetMouseY = e.clientY;
    
    const cursor = document.getElementById('cursor-light');
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });
  
  // Enter button
  document.getElementById('enter-btn').addEventListener('click', () => {
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('cards-toggle').classList.remove('hidden');
    saveProgress();
  });
  
  // Resize
  window.addEventListener('resize', () => {
    resizeCanvas();
  });
  
  // Scroll
  document.getElementById('text-container').addEventListener('scroll', () => {
    checkCardUnlock();
    updateEmotionColoring();
    
    clearTimeout(window.scrollTimer);
    window.scrollTimer = setTimeout(saveProgress, 500);
  });
  
  // Animation loop for emotion coloring
  setInterval(updateEmotionColoring, 50);
  
  // Sliders
  document.getElementById('radius-slider').addEventListener('input', (e) => {
    lightRadius = parseInt(e.target.value);
    document.getElementById('radius-value').textContent = lightRadius + 'px';
    saveProgress();
  });
  
  document.getElementById('darkness-slider').addEventListener('input', (e) => {
    darkness = parseInt(e.target.value) / 100;
    document.getElementById('darkness-value').textContent = e.target.value + '%';
    saveProgress();
  });
  
  document.getElementById('feather-slider').addEventListener('input', (e) => {
    feather = parseInt(e.target.value) / 100;
    document.getElementById('feather-value').textContent = e.target.value + '%';
    saveProgress();
  });
  
  // Toggles
  document.getElementById('emotion-toggle').addEventListener('click', function() {
    this.classList.toggle('active');
    emotionEnabled = this.classList.contains('active');
    updateEmotionColoring();
    saveProgress();
  });
  
  document.getElementById('cursor-toggle').addEventListener('click', function() {
    this.classList.toggle('active');
    document.body.style.cursor = this.classList.contains('active') ? 'auto' : 'none';
  });
  
  // Panel toggle
  document.getElementById('panel-toggle').addEventListener('click', () => {
    document.getElementById('control-panel').classList.toggle('collapsed');
  });
  
  // Cards panel toggle
  document.getElementById('cards-toggle').addEventListener('click', () => {
    document.getElementById('cards-panel').classList.toggle('open');
  });
}

// ==================== INIT ====================
function init() {
  resizeCanvas();
  renderText();
  loadProgress();
  renderCards();
  initEvents();
  initTitleLightEffect();
  drawDarkroom();
  
  // Restore scroll position after a short delay to ensure text is rendered
  setTimeout(() => {
    try {
      const data = JSON.parse(localStorage.getItem('darkroom-progress') || '{}');
      if (data.scrollTop) {
        document.getElementById('text-container').scrollTop = data.scrollTop;
        checkCardUnlock();
      }
    } catch (e) {}
  }, 100);
}

init();
</script>
