<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>口袋快应用</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(13, 23, 42, .9);
      --border: rgba(148, 163, 184, .18);
      --text: #e5eefc;
      --muted: #9fb3d9;
      --blue: #60a5fa;
      --pink: #f472b6;
      --shadow: 0 24px 60px rgba(0, 0, 0, .3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 10%, rgba(96, 165, 250, .22), transparent 30%),
        radial-gradient(circle at 84% 8%, rgba(244, 114, 182, .18), transparent 28%),
        linear-gradient(180deg, #08101d, var(--bg));
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .shell {
      width: min(1080px, 100%);
      display: grid;
      gap: 18px;
    }
    .hero,
    .card {
      border: 1px solid var(--border);
      border-radius: 32px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .hero {
      padding: clamp(24px, 5vw, 44px);
      text-align: center;
    }
    .pill {
      display: inline-flex;
      padding: 8px 13px;
      border-radius: 999px;
      color: #dceafe;
      background: rgba(96, 165, 250, .16);
      border: 1px solid rgba(96, 165, 250, .2);
      font-size: 13px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 68px);
      letter-spacing: 1px;
    }
    p {
      margin: 12px auto 0;
      max-width: 680px;
      color: var(--muted);
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      min-height: 260px;
      padding: 28px;
      text-decoration: none;
      color: var(--text);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(96, 165, 250, .38);
      background: rgba(15, 23, 42, .96);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 22px;
    }
    .blue { background: linear-gradient(135deg, #06b6d4, #2563eb); }
    .pink { background: linear-gradient(135deg, #f472b6, #be185d); }
    h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
    }
    .meta {
      margin-top: 18px;
      color: var(--muted);
      line-height: 1.7;
    }
    .go {
      margin-top: 24px;
      display: inline-flex;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 16px;
      color: #07111f;
      background: linear-gradient(135deg, #dbeafe, #60a5fa);
      font-weight: 900;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 220px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="pill">精简版</div>
      <h1>口袋快应用</h1>
      <p>已按你的要求只保留两个模块：百宝箱和游戏厅。其他番茄钟、便签、账本、打卡等入口都已移除。</p>
    </section>
    <section class="grid">
      <a class="card" href="./toolbox.html">
        <div>
          <div class="icon blue">百</div>
          <h2>百宝箱</h2>
          <div class="meta">394 个轻量小工具，支持搜索、分类、输入运行和复制结果。</div>
        </div>
        <span class="go">打开百宝箱</span>
      </a>
      <a class="card" href="./game-hall.html">
        <div>
          <div class="icon pink">游</div>
          <h2>游戏厅</h2>
          <div class="meta">100 个小游戏，支持搜索、分类、选择玩法和开始游戏。</div>
        </div>
        <span class="go">打开游戏厅</span>
      </a>
    </section>
  </main>
</body>
</html>
