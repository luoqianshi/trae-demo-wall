<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-tertiary: #aaaaaa;
            --text-quaternary: #666666;
            --border: #1a1a1a;
            --selection-line: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        .view {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            transition: opacity 0.4s ease;
        }

        .view.hidden {
            display: none;
        }

        .view.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* ---------- Setup View ---------- */
        #setupView {
            gap: 56px;
        }

        .brand {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .setup-form {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 44px;
        }

        .time-input-label {
            font-size: 14px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 500;
            text-align: center;
        }

        /* ---------- iOS Wheel Picker (Virtual Scroll) ---------- */
        .picker {
            position: relative;
            display: flex;
            gap: 8px;
            width: 100%;
            height: 240px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .picker-column {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            cursor: grab;
        }

        .picker-column:active {
            cursor: grabbing;
        }

        .picker-items {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .picker-item {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-variant-numeric: tabular-nums;
            font-weight: 400;
            color: var(--text-tertiary);
            transform-origin: center center;
            will-change: transform, opacity;
        }

        .picker-column::before,
        .picker-column::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 100px;
            z-index: 2;
            pointer-events: none;
        }

        .picker-column::before {
            top: 0;
            background: linear-gradient(to bottom, var(--bg) 0%, rgba(0,0,0,0) 100%);
        }

        .picker-column::after {
            bottom: 0;
            background: linear-gradient(to top, var(--bg) 0%, rgba(0,0,0,0) 100%);
        }

        .picker-selection {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 48px;
            transform: translateY(-50%);
            border-top: 1px solid var(--selection-line);
            border-bottom: 1px solid var(--selection-line);
            pointer-events: none;
            z-index: 1;
        }

        .picker-colon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 400;
            color: var(--text-secondary);
            z-index: 3;
            pointer-events: none;
        }

        /* ---------- Confirm Button ---------- */
        .confirm-btn {
            background: var(--text-primary);
            color: var(--bg);
            border: none;
            padding: 16px 60px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 1px;
            border-radius: 30px;
            transition: opacity 0.2s ease, transform 0.15s ease;
            min-width: 200px;
        }

        .confirm-btn:hover {
            opacity: 0.85;
        }

        .confirm-btn:active {
            transform: scale(0.97);
        }

        .footer-hint {
            position: fixed;
            bottom: 32px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: var(--text-quaternary);
            letter-spacing: 1px;
        }

        /* ---------- Result View ---------- */
        #resultView {
            justify-content: flex-start;
            padding-top: 18vh;
            position: relative;
        }

        .result-back {
            position: fixed;
            top: 24px;
            left: 24px;
            font-size: 15px;
            color: var(--text-tertiary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 8px 16px;
            font-family: inherit;
            font-weight: 500;
            border-radius: 20px;
            transition: color 0.2s ease, background 0.2s ease;
            z-index: 10;
        }

        .result-back:hover {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        .result-main {
            text-align: center;
            margin-bottom: 80px;
        }

        .result-label {
            font-size: 13px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .result-time {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            margin-bottom: 24px;
        }

        .result-sub {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }

        .result-sub strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: var(--text-tertiary);
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .scroll-hint-arrow {
            width: 1px;
            height: 24px;
            background: var(--text-tertiary);
            position: relative;
            animation: scrollBounce 2s ease-in-out infinite;
        }

        .scroll-hint-arrow::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -3px;
            width: 7px;
            height: 7px;
            border-right: 1px solid var(--text-tertiary);
            border-bottom: 1px solid var(--text-tertiary);
            transform: rotate(45deg);
        }

        @keyframes scrollBounce {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(6px); opacity: 0.5; }
        }

        .alt-section {
            width: 100%;
            max-width: 320px;
            padding-bottom: 80px;
        }

        .alt-divider {
            width: 40px;
            height: 1px;
            background: var(--border);
            margin: 0 auto 32px;
        }

        .alt-title {
            font-size: 14px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 500;
        }

        .alt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }

        .alt-item:first-child {
            border-top: 1px solid var(--border);
        }

        .alt-item-time {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        .alt-item-info {
            text-align: right;
        }

        .alt-item-cycles {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .alt-item-countdown {
            font-size: 1rem;
            color: var(--text-tertiary);
            margin-top: 6px;
        }

        .alt-item.past {
            opacity: 0.4;
        }

        /* ---------- Alert ---------- */
        .alert-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-primary);
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 480px) {
            .result-time {
                font-size: 5rem;
            }

            #resultView {
                padding-top: 16vh;
            }

            .alt-section {
                max-width: 280px;
            }

            .picker {
                height: 220px;
            }

            .result-sub {
                font-size: 1.1rem;
            }

            .brand {
                font-size: 14px;
            }

            .time-input-label {
                font-size: 13px;
            }
        }

        @media (max-width: 360px) {
            .result-time {
                font-size: 4rem;
            }

            .result-sub {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Setup View -->
    <div class="view" id="setupView">
        <div class="brand">Sleep</div>
        <div class="setup-form">
            <div class="time-input-label">起床时间</div>
            <div class="picker" id="timePicker">
                <div class="picker-column" id="hourColumn">
                    <div class="picker-items" id="hourItems"></div>
                </div>
                <div class="picker-colon">:</div>
                <div class="picker-column" id="minuteColumn">
                    <div class="picker-items" id="minuteItems"></div>
                </div>
                <div class="picker-selection"></div>
            </div>
            <button class="confirm-btn" id="confirmBtn">确定</button>
        </div>
        <div class="footer-hint">90 分钟周期</div>
    </div>

    <!-- Result View -->
    <div class="view hidden" id="resultView">
        <button class="result-back" id="backBtn">返回</button>

        <div class="result-main">
            <div class="result-label">入睡时间</div>
            <div class="result-time" id="resultTime">--:--</div>
            <div class="result-sub" id="resultSub">计算中...</div>
        </div>

        <div class="scroll-hint">
            <span>更多选项</span>
            <div class="scroll-hint-arrow"></div>
        </div>

        <div class="alt-section">
            <div class="alt-divider"></div>
            <div class="alt-title">其他方案</div>
            <div id="altList"></div>
        </div>
    </div>

    <script>
        // ========== Virtual Wheel Picker ==========
        const ITEM_HEIGHT = 48;
        const VISIBLE_RANGE = 5;

        const FISHEYE_KEYFRAMES = [
            { px: 0,  scale: 1.30, opacity: 1.00, weight: 700 },
            { px: 30, scale: 1.00, opacity: 0.60, weight: 500 },
            { px: 60, scale: 0.80, opacity: 0.30, weight: 400 },
            { px: 100, scale: 0.60, opacity: 0.10, weight: 300 }
        ];

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function fisheye(distancePx) {
            const d = Math.abs(distancePx);
            for (let i = 0; i < FISHEYE_KEYFRAMES.length - 1; i++) {
                const k0 = FISHEYE_KEYFRAMES[i];
                const k1 = FISHEYE_KEYFRAMES[i + 1];
                if (d >= k0.px && d < k1.px) {
                    const t = (d - k0.px) / (k1.px - k0.px);
                    return {
                        scale: lerp(k0.scale, k1.scale, t),
                        opacity: lerp(k0.opacity, k1.opacity, t),
                        weight: Math.round(lerp(k0.weight, k1.weight, t))
                    };
                }
            }
            const last = FISHEYE_KEYFRAMES[FISHEYE_KEYFRAMES.length - 1];
            return { scale: last.scale, opacity: last.opacity, weight: last.weight };
        }

        function createWheel(columnEl, itemsEl, max, initialIndex, dampingFactor) {
            const state = {
                offset: initialIndex * ITEM_HEIGHT,
                velocity: 0,
                isDragging: false,
                touchStartY: 0,
                touchStartOffset: 0,
                lastMoveTime: 0,
                lastMoveY: 0,
                animId: null,
                isSnapping: false
            };

            let html = '';
            for (let i = 0; i < max; i++) {
                html += `<div class="picker-item" data-idx="${i}">${String(i).padStart(2, '0')}</div>`;
            }
            itemsEl.innerHTML = html;

            const itemEls = itemsEl.querySelectorAll('.picker-item');

            function getNormalizedIndex(itemIndex) {
                const centerOffset = state.offset;
                const centerFloatIndex = centerOffset / ITEM_HEIGHT;
                let rawDist = itemIndex - centerFloatIndex;
                const half = max / 2;
                if (rawDist > half) rawDist -= max;
                if (rawDist < -half) rawDist += max;
                return rawDist;
            }

            function render() {
                const columnHeight = columnEl.clientHeight;
                const centerY = columnHeight / 2;

                itemEls.forEach((el, i) => {
                    const rawDist = getNormalizedIndex(i);
                    const distancePx = rawDist * ITEM_HEIGHT;

                    if (Math.abs(distancePx) > columnHeight * 0.7) {
                        el.style.display = 'none';
                        return;
                    }
                    el.style.display = 'flex';

                    const fish = fisheye(distancePx);
                    const yPos = distancePx;

                    el.style.transform = `translateY(${yPos}px) translate(-50%, -50%) scale(${fish.scale})`;
                    el.style.left = '50%';
                    el.style.opacity = fish.opacity;
                    el.style.fontWeight = fish.weight;
                    el.style.fontSize = `${20 * fish.scale}px`;

                    const grayVal = Math.round(255 * fish.opacity);
                    el.style.color = `rgb(${grayVal}, ${grayVal}, ${grayVal})`;
                });
            }

            function snapToNearest() {
                state.isSnapping = true;
                const target = Math.round(state.offset / ITEM_HEIGHT) * ITEM_HEIGHT;
                const startOffset = state.offset;
                const distance = target - startOffset;
                const duration = Math.min(300, Math.abs(distance) * 3);
                const startTime = performance.now();

                function easeOutCubic(t) {
                    return 1 - Math.pow(1 - t, 3);
                }

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = easeOutCubic(progress);
                    state.offset = startOffset + distance * eased;

                    if (progress < 1) {
                        state.animId = requestAnimationFrame(animate);
                    } else {
                        state.offset = target;
                        state.isSnapping = false;
                        state.animId = null;
                    }
                    render();
                }

                if (state.animId) cancelAnimationFrame(state.animId);
                state.animId = requestAnimationFrame(animate);
            }

            function inertiaLoop() {
                if (state.isDragging) return;

                state.velocity *= dampingFactor;
                state.offset += state.velocity;

                render();

                if (Math.abs(state.velocity) > 0.1) {
                    state.animId = requestAnimationFrame(inertiaLoop);
                } else {
                    state.velocity = 0;
                    state.animId = null;
                    snapToNearest();
                }
            }

            function startDrag(clientY) {
                if (state.animId) {
                    cancelAnimationFrame(state.animId);
                    state.animId = null;
                }
                state.isDragging = true;
                state.isSnapping = false;
                state.velocity = 0;
                state.touchStartY = clientY;
                state.touchStartOffset = state.offset;
                state.lastMoveTime = performance.now();
                state.lastMoveY = clientY;
            }

            function moveDrag(clientY) {
                if (!state.isDragging) return;
                const now = performance.now();
                const dt = now - state.lastMoveTime;

                if (dt > 0) {
                    const dy = state.lastMoveY - clientY;
                    state.velocity = dy / dt * 16;
                }

                state.lastMoveTime = now;
                state.lastMoveY = clientY;

                const delta = state.touchStartY - clientY;
                state.offset = state.touchStartOffset + delta;
                render();
            }

            function endDrag() {
                if (!state.isDragging) return;
                state.isDragging = false;

                if (Math.abs(state.velocity) > 0.3) {
                    inertiaLoop();
                } else {
                    state.velocity = 0;
                    snapToNearest();
                }
            }

            columnEl.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startDrag(e.touches[0].clientY);
            }, { passive: false });

            columnEl.addEventListener('touchmove', (e) => {
                e.preventDefault();
                moveDrag(e.touches[0].clientY);
            }, { passive: false });

            columnEl.addEventListener('touchend', (e) => {
                e.preventDefault();
                endDrag();
            }, { passive: false });

            columnEl.addEventListener('mousedown', (e) => {
                e.preventDefault();
                startDrag(e.clientY);
            });

            document.addEventListener('mousemove', (e) => {
                if (state.isDragging) {
                    e.preventDefault();
                    moveDrag(e.clientY);
                }
            });

            document.addEventListener('mouseup', () => {
                if (state.isDragging) endDrag();
            });

            columnEl.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (state.animId && !state.isSnapping) {
                    cancelAnimationFrame(state.animId);
                    state.animId = null;
                }

                const wheelMultiplier = max === 60 ? 2.5 : 1.5;
                state.offset += e.deltaY * wheelMultiplier * 0.15;
                state.velocity = e.deltaY * wheelMultiplier * 0.02;

                render();

                clearTimeout(columnEl._wheelTimer);
                columnEl._wheelTimer = setTimeout(() => {
                    if (!state.isDragging) {
                        inertiaLoop();
                    }
                }, 60);
            }, { passive: false });

            render();

            return {
                getValue: () => {
                    const rawIndex = Math.round(state.offset / ITEM_HEIGHT);
                    let idx = rawIndex % max;
                    if (idx < 0) idx += max;
                    return idx;
                }
            };
        }

        // ========== Core Logic ==========
        function formatTimeShort(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function calculateSleepTime(wakeDate, cycles) {
            const cycleDuration = 90 * 60 * 1000;
            const bufferDuration = 15 * 60 * 1000;
            return new Date(wakeDate.getTime() - bufferDuration - cycles * cycleDuration);
        }

        const CYCLE_OPTIONS = [6, 5, 4, 3, 2, 1];

        function findRecommendedTime(wakeDate) {
            const now = new Date();

            for (const cycles of CYCLE_OPTIONS) {
                const sleepTime = calculateSleepTime(wakeDate, cycles);
                if (sleepTime >= now) {
                    return { time: sleepTime, cycles: cycles };
                }
            }

            // 极限兜底：连 1 个周期都来不及，仍给出最极限的 1 周期方案
            const fallbackCycles = 1;
            return {
                time: calculateSleepTime(wakeDate, fallbackCycles),
                cycles: fallbackCycles,
                isExtreme: true
            };
        }

        function getAlternativeTimes(wakeDate, recommendedCycles) {
            const alternatives = [];

            CYCLE_OPTIONS.forEach(cycles => {
                if (cycles === recommendedCycles) return;
                alternatives.push({
                    time: calculateSleepTime(wakeDate, cycles),
                    cycles: cycles
                });
            });

            return alternatives.sort((a, b) => b.cycles - a.cycles);
        }

        function getCountdown(targetTime) {
            const now = new Date();
            const diffMs = targetTime - now;
            const diffMinutes = Math.floor(diffMs / 1000 / 60);

            if (diffMinutes > 0) {
                const hours = Math.floor(diffMinutes / 60);
                const mins = diffMinutes % 60;
                if (hours > 0) {
                    return `还有 ${hours}小时 ${mins}分钟`;
                } else {
                    return `还有 ${mins}分钟`;
                }
            } else if (diffMinutes >= -15) {
                return '现在';
            } else {
                return '已过';
            }
        }

        function isNearSleepTime(targetTime) {
            const now = new Date();
            const diffMs = targetTime - now;
            const diffMinutes = Math.floor(diffMs / 1000 / 60);
            return diffMinutes <= 5 && diffMinutes >= -5;
        }

        // ========== View Switching ==========
        let hourWheel = null;
        let minuteWheel = null;
        let currentWakeDate = null;
        let currentRecommended = null;

        function showResults(wakeHour, wakeMinute) {
            const now = new Date();
            const wakeDate = new Date(now);
            wakeDate.setHours(wakeHour, wakeMinute, 0, 0);

            if (wakeDate <= now) {
                wakeDate.setDate(wakeDate.getDate() + 1);
            }

            currentWakeDate = wakeDate;
            currentRecommended = findRecommendedTime(wakeDate);
            const alternatives = getAlternativeTimes(wakeDate, currentRecommended.cycles);

            document.getElementById('resultTime').textContent = formatTimeShort(currentRecommended.time);

            updateResultSub();

            const altList = document.getElementById('altList');
            altList.innerHTML = alternatives.map(item => {
                const isPast = item.time < now;
                const hours = (item.cycles * 1.5).toFixed(item.cycles * 1.5 % 1 === 0 ? 0 : 1);
                return `
                    <div class="alt-item ${isPast ? 'past' : ''}">
                        <div class="alt-item-time">${formatTimeShort(item.time)}</div>
                        <div class="alt-item-info">
                            <div class="alt-item-cycles">可睡 ${item.cycles} 周期（${hours}小时）</div>
                            <div class="alt-item-countdown">${getCountdown(item.time)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            const setupView = document.getElementById('setupView');
            setupView.classList.add('fade-out');

            setTimeout(() => {
                setupView.classList.add('hidden');
                setupView.classList.remove('fade-out');
                document.getElementById('resultView').classList.remove('hidden');
                window.scrollTo(0, 0);
            }, 400);
        }

        function updateResultSub() {
            if (!currentRecommended) return;

            const isNear = isNearSleepTime(currentRecommended.time);
            const countdown = getCountdown(currentRecommended.time);
            const cyclesText = `${currentRecommended.cycles} 个周期`;
            const hoursText = `（${(currentRecommended.cycles * 1.5).toFixed(currentRecommended.cycles * 1.5 % 1 === 0 ? 0 : 1)}小时）`;

            if (currentRecommended.isExtreme) {
                document.getElementById('resultSub').innerHTML =
                    `<span class="alert-dot"></span>睡眠极为不足，<strong>立即入睡</strong>保证至少 1 个基本周期`;
            } else if (isNear) {
                document.getElementById('resultSub').innerHTML =
                    `<span class="alert-dot"></span><strong>${countdown}</strong>，快上床吧`;
            } else {
                document.getElementById('resultSub').innerHTML =
                    `最佳：<strong>${cyclesText}${hoursText}</strong> · ${countdown}`;
            }
        }

        function goBack() {
            const resultView = document.getElementById('resultView');
            resultView.classList.add('fade-out');

            setTimeout(() => {
                resultView.classList.add('hidden');
                resultView.classList.remove('fade-out');
                document.getElementById('setupView').classList.remove('hidden');
                currentWakeDate = null;
                currentRecommended = null;
            }, 400);
        }

        function refreshCountdowns() {
            if (!currentWakeDate || !currentRecommended) return;

            updateResultSub();

            const now = new Date();
            const altItems = document.querySelectorAll('.alt-item');
            const alternatives = getAlternativeTimes(currentWakeDate, currentRecommended.cycles);

            altItems.forEach((itemEl, index) => {
                const item = alternatives[index];
                if (!item) return;

                const countdownEl = itemEl.querySelector('.alt-item-countdown');
                if (countdownEl) {
                    countdownEl.textContent = getCountdown(item.time);
                }

                const isPast = item.time < now;
                if (isPast) {
                    itemEl.classList.add('past');
                } else {
                    itemEl.classList.remove('past');
                }
            });
        }

        // ========== Init ==========
        function init() {
            hourWheel = createWheel(
                document.getElementById('hourColumn'),
                document.getElementById('hourItems'),
                24,
                7,
                0.92
            );

            minuteWheel = createWheel(
                document.getElementById('minuteColumn'),
                document.getElementById('minuteItems'),
                60,
                0,
                0.95
            );

            document.getElementById('confirmBtn').addEventListener('click', () => {
                const hour = hourWheel.getValue();
                const minute = minuteWheel.getValue();
                showResults(hour, minute);
            });

            document.getElementById('backBtn').addEventListener('click', goBack);

            setInterval(refreshCountdowns, 1000);
        }

        init();
    </script>
</body>
</html>
