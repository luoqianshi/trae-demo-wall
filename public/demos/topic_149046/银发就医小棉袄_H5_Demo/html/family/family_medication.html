<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>服药记录</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <div style="text-align: center;">
        <span class="navbar-title">服药记录</span>
        <div class="navbar-subtitle">母亲 张秀兰</div>
      </div>
    </nav>
    <main class="page-content">
      <!-- 今日状态卡片 -->
      <div class="card">
        <div class="card-title">今日状态</div>
        <div class="card-body">
          <div class="text-m">已服用 1/2 种药</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: 50%;"></div>
          </div>
        </div>
      </div>

      <!-- 今日用药卡片 -->
      <div class="card">
        <div class="card-title">2026年6月27日 周六</div>
        <div class="card-body">
          <div class="list-item">
            <span>✅ 8:15 美托洛尔 已服用 🎤 语音记录</span>
          </div>
          <div class="list-item">
            <span>❌ 阿托伐他汀 待服用（睡前）</span>
          </div>
        </div>
      </div>

      <!-- 昨日用药卡片 -->
      <div class="card">
        <div class="card-title">2026年6月26日 周日</div>
        <div class="card-body">
          <div class="list-item">
            <span>✅ 8:10 美托洛尔 已服用</span>
          </div>
          <div class="list-item">
            <span>✅ 20:30 阿托伐他汀 已服用</span>
          </div>
        </div>
      </div>

      <!-- 周统计卡片 -->
      <div class="card">
        <div class="card-title">周统计</div>
        <div class="card-body">
          <div class="text-m">本周服药率：85%（12/14）</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: 85%;"></div>
          </div>
        </div>
      </div>

      <!-- 补充记录卡片 -->
      <div class="card">
        <div class="card-title">补充记录</div>
        <div class="card-body">
          <button class="btn-secondary btn-concept" onclick="showSupplementModal()">✏️ 手动补充服药记录</button>
        </div>
      </div>

      <!-- 法律声明卡片 -->
      <div class="card">
        <div class="card-body">
          <div class="text-s text-weak">本记录为用户自述，非医疗记录，仅供参考</div>
        </div>
      </div>
    </main>
  </div>

  <!-- 补充记录弹窗 -->
  <div class="modal-overlay" id="supplement-modal" style="display:none;">
    <div class="modal-card">
      <div class="modal-title">补充服药记录</div>
      <div class="modal-body">
        <div class="form-group">
          <label>药品</label>
          <select id="med-select" class="form-select">
            <option value="metoprolol">美托洛尔（倍他乐克）</option>
            <option value="atorvastatin">阿托伐他汀（立普妥）</option>
          </select>
        </div>
        <div class="form-group">
          <label>时间</label>
          <input type="time" id="med-time" class="form-input" value="08:00">
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="supplement-confirm">
          <span>此记录由我代为补充</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="hideSupplementModal()">取消</button>
        <button class="btn-primary" onclick="confirmSupplement()">确认添加</button>
      </div>
    </div>
  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    function showSupplementModal() {
      document.getElementById('supplement-modal').style.display = 'flex';
    }

    function hideSupplementModal() {
      document.getElementById('supplement-modal').style.display = 'none';
    }

    function confirmSupplement() {
      if (!document.getElementById('supplement-confirm').checked) {
        showToast('请确认此记录由您代为补充', 'warning');
        return;
      }
      hideSupplementModal();
      showToast('概念演示 - 记录已添加', 'info');
    }
  </script>
</body>
</html>
