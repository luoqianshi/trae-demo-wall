﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>就诊摘要</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <div style="text-align: center;">
        <span class="navbar-title">就诊摘要</span>
        <div class="navbar-subtitle">母亲 张秀兰</div>
      </div>
    </nav>
    <main class="page-content">
      <!-- ===== 顶部快捷按钮区（方便家人快速操作，不必滚到底部） ===== -->
      <div style="position: sticky; top: 56px; z-index: 40; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); margin: 0 0 var(--space-md); padding: var(--space-sm) 0; border-bottom: 1px solid rgba(0,0,0,0.04); display: flex; gap: var(--space-sm);">
        <button class="btn-primary" id="confirm-btn-top" onclick="confirmKnown()" style="flex: 1; padding: var(--space-sm) var(--space-md); font-size: var(--font-m); font-weight: 600; min-height: 48px;">
          确认已知
        </button>
        <button class="btn-secondary" id="reminder-btn-top" onclick="toggleMedicationReminder()" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: var(--space-sm) var(--space-md); font-size: var(--font-m); font-weight: 600; min-height: 48px;">
          <span>🔔</span>
          <span id="reminder-btn-top-text">为亲人开启用药提醒</span>
        </button>
      </div>

      <!-- 基本信息卡片 -->
      <div class="card">
        <div class="card-title">母亲 张秀兰</div>
        <div class="card-body">
          <div class="text-s text-secondary">2026年6月27日 心内科</div>
          <div class="text-s text-secondary">李医生 XX市人民医院</div>
          <div style="margin-top: 12px;">
            <a href="family_medication.html" style="display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; background: var(--color-primary-light, #FFE0D6); color: var(--color-primary, #D84315); border-radius: var(--radius-sm); font-size: var(--font-s); font-weight: 600; text-decoration: none;">💊 查看服药记录 →</a>
          </div>
        </div>
      </div>

      <!-- D7: 录音转写卡片（读取老人端ASR识别结果） -->
      <div class="card" id="asrTranscriptCard" style="display: none;">
        <div class="card-title" id="asrCardTitle">🎵 录音转写</div>
        <div class="card-body">
          <div id="asrMetaInfo" style="margin-bottom: 8px;"></div>
          <div id="asrTranscriptText" style="background: #F5F5F5; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; color: #424242;"></div>
        </div>
      </div>

      <!-- 诊断卡片 -->
      <div class="card">
        <div class="card-title">诊断 🟢</div>
        <div class="card-body">
          <div class="text-m">冠心病、高脂血症稳定期</div>
          <div class="confidence-tag green">置信度 92%</div>
        </div>
      </div>

      <!-- 用药方案卡片 -->
      <div class="card">
        <div class="card-title">用药方案 🟢</div>
        <div class="card-body">
          <div class="list-item">
            <span>美托洛尔（倍他乐克）25mg 半片 每日2次</span>
            <span class="confidence-tag green">置信度 94%</span>
          </div>
          <div class="list-item">
            <span>阿托伐他汀（立普妥）20mg 1片 每日1次</span>
            <span class="confidence-tag green">置信度 91%</span>
          </div>
        </div>
      </div>

      <!-- 复诊卡片 -->
      <div class="card">
        <div class="card-title">复诊 🟡</div>
        <div class="card-body">
          <div class="text-m">1个月后复查肝功能+心电图</div>
          <div class="confidence-tag yellow">置信度 78%</div>
          <div class="text-warning text-s">⚠️ 建议就诊时与医生确认</div>
        </div>
      </div>

      <!-- 底部操作按钮已移除：顶部 sticky 按钮已提供相同功能，避免重复 -->
    </main>
  </div>
  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    // ===== D7: 读取老人端ASR录音结果，在摘要顶部显示转写原文 =====
    (function renderAsrTranscript() {
      var payload = null;
      try {
        var raw = localStorage.getItem('silvercare_last_asr_result');
        if (raw) payload = JSON.parse(raw);
      } catch (e) {
        console.warn('[family_summary] 读取ASR结果失败:', e);
      }

      var card = document.getElementById('asrTranscriptCard');
      if (!card) return;

      if (!payload || !payload.timestamp) {
        // 无录音数据，隐藏卡片
        return;
      }

      var ageMs = Date.now() - payload.timestamp;
      var ageHours = ageMs / (1000 * 60 * 60);
      if (ageHours > 48) return; // 超过48小时不显示

      var isReal = payload.asrSource === 'asr-engine';
      var asrText = isReal ? payload.asrText : (payload.mockText || '');
      if (!asrText) return;

      var cardTitle = document.getElementById('asrCardTitle');
      var metaInfo = document.getElementById('asrMetaInfo');
      var transcriptText = document.getElementById('asrTranscriptText');

      // 卡片标题含来源标识
      cardTitle.textContent = isReal ? '🎵 录音转写（ASR引擎）' : '🎵 录音转写（模拟数据）';

      // 元信息：录音时长 + 置信度 + 识别耗时 + 录制时间
      var audioDuration = payload.audioDuration || 0;
      var ageMin = Math.floor(ageMs / (1000 * 60));
      var ageLabel = ageMin < 1 ? '刚刚' : (ageMin < 60 ? ageMin + '分钟前' : Math.floor(ageMin / 60) + '小时前');

      var metaHtml = '<div class="text-s text-secondary">🎤 录音时长 ' + audioDuration + ' 秒 · ' + ageLabel + '</div>';
      if (isReal) {
        var confidence = Math.round((payload.asrConfidence || 0) * 100);
        var inferMs = payload.asrInferMs || 0;
        metaHtml += '<div class="text-s" style="color: #2E7D32;">✅ 置信度 ' + confidence + '% · 识别耗时 ' + inferMs + 'ms</div>';
      } else {
        metaHtml += '<div class="text-s" style="color: #F57C00;">ℹ️ 体验模式，以下为预置示例文本</div>';
      }
      metaInfo.innerHTML = metaHtml;

      // 转写原文（HTML转义）
      var escaped = asrText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      transcriptText.textContent = escaped;

      // 显示卡片
      card.style.display = 'block';
    })();

    // D8 方言守护卡片已移除（方言翻译不是 Demo 重点）
    // renderFamilyDialectGuard 函数和相关 HTML 卡片已一并删除

    let confirmed = false;
    let reminderOn = false;

    function confirmKnown() {
      if (confirmed) return;
      confirmed = true;
      // 底部按钮
      const btn = document.getElementById('confirm-btn');
      if (btn) {
        btn.textContent = '已确认';
        btn.disabled = true;
        btn.classList.add('confirmed');
      }
      // 顶部快捷按钮
      const btnTop = document.getElementById('confirm-btn-top');
      if (btnTop) {
        btnTop.textContent = '已确认';
        btnTop.disabled = true;
        btnTop.classList.add('confirmed');
      }

      let records = [];
      try {
        const stored = localStorage.getItem('family_confirmed_records');
        if (stored) records = JSON.parse(stored);
      } catch (e) {}
      records.push({ date: '2026-06-27', patient: '张秀兰', dept: '心内科' });
      localStorage.setItem('family_confirmed_records', JSON.stringify(records));
    }

    function toggleMedicationReminder() {
      reminderOn = !reminderOn;
      // 底部按钮
      const btn = document.getElementById('reminder-btn');
      // 顶部快捷按钮文本
      const btnTopText = document.getElementById('reminder-btn-top-text');
      if (reminderOn) {
        if (btn) { btn.textContent = '🔕 关闭用药提醒'; btn.classList.add('active'); }
        if (btnTopText) btnTopText.textContent = '关闭用药提醒';
      } else {
        if (btn) { btn.textContent = '🔔 为亲人开启用药提醒'; btn.classList.remove('active'); }
        if (btnTopText) btnTopText.textContent = '为亲人开启用药提醒';
      }
    }
  </script>
</body>
</html>
