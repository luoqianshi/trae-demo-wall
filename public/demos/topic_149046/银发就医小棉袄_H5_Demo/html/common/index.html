<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
</head>
<body class="theme-accessible">
  <div class="page">
    <main class="page-content" style="padding-top: var(--space-xxl);">

      <!-- 产品标题区域 -->

        <h1 class="text-xxl">银发就医小棉袄</h1>

      </div>

      <!-- 开始演示按钮 -->
      <div style="text-align: center; margin: var(--space-lg) var(--space-xl);">
        <button class="btn-primary" onclick="navigateTo('../me/me_home.html')">开始演示 →</button>
      </div>

      <div class="divider"></div>

      <!-- 页面导航区域 -->
      <div style="padding: 0 var(--space-xl);">
        <h2 class="text-xl">页面导航</h2>

        <h3 class="text-l" style="margin-top: var(--space-md);">❤️ 健康标签</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); margin-top: var(--space-sm);">
          <button class="btn-secondary" onclick="navigateTo('../me/me_home.html')">我的健康</button>
          <button class="btn-secondary" onclick="navigateTo('../me/me_health_log.html')">健康记录</button>
          <button class="btn-secondary" onclick="navigateTo('../me/me_medication.html')">服药提醒</button>
        </div>

        <h3 class="text-l" style="margin-top: var(--space-lg);">🏥 就医标签</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); margin-top: var(--space-sm);">
          <button class="btn-secondary" onclick="navigateTo('../me/me_diagnosis.html')">我的就医</button>
          <button class="btn-secondary" onclick="navigateTo('../me/me_recording.html')">医嘱录音</button>
          <button class="btn-secondary" onclick="navigateTo('../me/me_summary.html')">就诊摘要</button>
          <button class="btn-secondary" onclick="navigateTo('../me/me_review.html')">复查提醒</button>
        </div>

        <h3 class="text-l" style="margin-top: var(--space-lg);">👨‍👩‍👧 亲人标签</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); margin-top: var(--space-sm);">
          <button class="btn-secondary" onclick="navigateTo('../family/family_home.html')">我的亲人</button>
          <button class="btn-secondary" onclick="navigateTo('../family/family_summary.html')">就诊详情</button>
          <button class="btn-secondary" onclick="navigateTo('../family/family_medication.html')">服药记录</button>
        </div>

        <h3 class="text-l" style="margin-top: var(--space-lg);">👤 我的标签</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); margin-top: var(--space-sm);">
          <button class="btn-secondary" onclick="navigateTo('../me/me_profile.html')">我的</button>
          <button class="btn-secondary" onclick="navigateTo('../me/me_share.html')">分享管理</button>
        </div>

        <h3 class="text-l" style="margin-top: var(--space-lg);">🔧 通用页面</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); margin-top: var(--space-sm);">
          <button class="btn-secondary" onclick="navigateTo('common_safety_level.html')">安全分级</button>
          <button class="btn-secondary" onclick="navigateTo('common_offline_demo.html')">离线演示</button>
          <button class="btn-secondary" onclick="navigateTo('common_privacy.html')">隐私政策</button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- 核心功能流程 -->
      <div style="text-align: center;">
        <h2 class="text-xl">核心功能流程</h2>
        <div style="display: flex; justify-content: center; gap: var(--space-sm); margin: var(--space-md) 0; flex-wrap: wrap;">
          <div style="background: var(--color-primary-light); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); text-align: center;">
            <div class="text-m" style="font-weight: 600;">录音</div>
          </div>
          <div style="display: flex; align-items: center; font-size: var(--font-l);">→</div>
          <div style="background: var(--color-primary-light); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); text-align: center;">
            <div class="text-m" style="font-weight: 600;">ASR</div>
          </div>
          <div style="display: flex; align-items: center; font-size: var(--font-l);">→</div>
          <div style="background: var(--color-primary-light); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); text-align: center;">
            <div class="text-m" style="font-weight: 600;">结构化</div>
          </div>
          <div style="display: flex; align-items: center; font-size: var(--font-l);">→</div>
          <div style="background: var(--color-primary-light); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); text-align: center;">
            <div class="text-m" style="font-weight: 600;">摘要</div>
          </div>
          <div style="display: flex; align-items: center; font-size: var(--font-l);">→</div>
          <div style="background: var(--color-primary-light); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); text-align: center;">
            <div class="text-m" style="font-weight: 600;">同步</div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- 产品信息 -->
      <div style="padding: 0 var(--space-xl);">
        <h2 class="text-l">产品信息</h2>
        <ul style="list-style: none; padding: 0; margin-top: var(--space-sm);">
          <li class="text-m text-secondary" style="padding: 4px 0;">产品形态：H5 网页（兼容微信小程序）</li>
          <li class="text-m text-secondary" style="padding: 4px 0;">核心技术：Fun-ASR + DeepSeek</li>
          <li class="text-m text-secondary" style="padding: 4px 0;">支持方言：四川话/粤语/闽南语</li>
          <li class="text-m text-secondary" style="padding: 4px 0;">TRAE 工具链占比：68.3%</li>
        </ul>
        <p class="text-s text-weak" style="margin-top: var(--space-md);">版本：Demo V2.0 | 2026-06-27</p>
      </div>

    </main>
  </div>
  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    // 修复 iframe 或本地文件协议下部分浏览器可能阻止 window.location 跳转的问题
    document.querySelectorAll('button[onclick^="navigateTo"]').forEach(function(btn) {
      var match = btn.getAttribute('onclick').match(/navigateTo\(['"]([^'"]+)['"]\)/);
      if (match && match[1]) {
        var href = match[1];
        btn.removeAttribute('onclick');
        btn.addEventListener('click', function() {
          navigateTo(href);
        });
      }
    });
  </script>
</body>
</html>
