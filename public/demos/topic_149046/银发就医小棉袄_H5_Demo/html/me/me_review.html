<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>我的复查提醒</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">我的复查提醒</span>
    </nav>
    <main class="page-content">
      <!-- 下次复查卡片 -->
      <div class="card">
        <div class="card-title">下次复查</div>
        <div class="card-body">
          <div class="text-l text-primary">7月24日（周六）</div>
          <div class="list-item">
            <span>项目</span>
            <span>肝功能、心电图</span>
          </div>
          <div class="list-item">
            <span>科室</span>
            <span>心内科</span>
          </div>
          <div class="list-item">
            <span>倒计时</span>
            <span class="text-warning">距现在还有<span id="days-until">27</span>天</span>
          </div>
          <div class="confidence-tag yellow">🟡 置信度 78%</div>
        </div>
      </div>

      <!-- 历史复查卡片 -->
      <div class="card">
        <div class="card-title">历史复查</div>
        <div class="card-body">
          <div class="list-item">
            <span>6月25日</span>
            <span>血压监测 心内科 <span class="badge confirmed">已完成</span></span>
          </div>
          <div class="list-item">
            <span>6月10日</span>
            <span>糖化血红蛋白 内分泌科 <span class="badge confirmed">已完成</span></span>
          </div>
        </div>
      </div>

      <!-- 开启复查提醒按钮 -->
      <button class="btn-primary toggle-switch" id="reminder-toggle" onclick="toggleReminder()">
        <span id="toggle-label">开启复查提醒</span>
      </button>
    </main>
  </div>
  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    // 计算距下次复查的天数
    (function() {
      const targetDate = new Date(2026, 6, 24); // 7月24日
      const today = new Date();
      const diffTime = targetDate.getTime() - today.getTime();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if (typeof getDaysUntil === 'function') {
        document.getElementById('days-until').textContent = getDaysUntil('2026-07-24');
      } else {
        document.getElementById('days-until').textContent = diffDays;
      }
    })();

    let reminderOn = false;
    function toggleReminder() {
      reminderOn = !reminderOn;
      const btn = document.getElementById('reminder-toggle');
      const label = document.getElementById('toggle-label');
      if (reminderOn) {
        btn.classList.add('active');
        label.textContent = '关闭复查提醒';
      } else {
        btn.classList.remove('active');
        label.textContent = '开启复查提醒';
      }
    }
  </script>
</body>
</html>
