﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>健康录音 - 银发就医小棉袄</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
  <style>
    /* ===== 录音引导说明 ===== */
    .record-guide {
      text-align: center;
      padding: var(--space-lg) var(--space-md) var(--space-sm);
    }
    .record-guide-title {
      font-size: var(--font-xl);
      font-weight: 700;
      color: var(--color-text, #1f2937);
      margin: 0 0 var(--space-sm);
      line-height: 1.4;
    }
    .record-guide-example {
      font-size: var(--font-s);
      color: var(--color-text-weak, #6b7280);
      margin: 0;
      line-height: 1.5;
    }

    /* ===== 录音波形动画 ===== */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 64px;
      margin: 0 auto var(--space-md);
      max-width: 280px;
    }
    .waveform .wave-bar {
      width: 6px;
      height: 12px;
      background: var(--color-primary);
      border-radius: 3px;
      transition: height 0.08s ease-out;
    }
    .waveform.mock-mode .wave-bar {
      animation: wave-mock 1.1s ease-in-out infinite;
    }
    .waveform.mock-mode .wave-bar:nth-child(1) { animation-delay: 0.0s; }
    .waveform.mock-mode .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .waveform.mock-mode .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .waveform.mock-mode .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .waveform.mock-mode .wave-bar:nth-child(5) { animation-delay: 0.4s; }
    .waveform.mock-mode .wave-bar:nth-child(6) { animation-delay: 0.5s; }
    .waveform.mock-mode .wave-bar:nth-child(7) { animation-delay: 0.2s; }
    .waveform.mock-mode .wave-bar:nth-child(8) { animation-delay: 0.35s; }
    .waveform.mock-mode .wave-bar:nth-child(9) { animation-delay: 0.15s; }
    .waveform.mock-mode .wave-bar:nth-child(10) { animation-delay: 0.45s; }
    .waveform.mock-mode .wave-bar:nth-child(11) { animation-delay: 0.25s; }
    .waveform.mock-mode .wave-bar:nth-child(12) { animation-delay: 0.05s; }
    @keyframes wave-mock {
      0%, 100% { height: 10px; }
      50% { height: 48px; }
    }

    /* ===== 计时器 ===== */
    .record-timer {
      font-size: var(--font-l);
      font-weight: 600;
      color: var(--color-primary);
      margin: var(--space-sm) 0 0;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .record-mode-hint {
      font-size: var(--font-xs);
      color: var(--color-text-weak, #6b7280);
      margin: var(--space-xs) 0 0;
    }

    /* ===== 快捷标签（健康类型） ===== */
    .health-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 var(--space-xl) var(--space-md);
    }
    .health-tag {
      padding: 8px 14px;
      font-size: var(--font-s);
      border: 2px solid var(--color-border, #e5e7eb);
      border-radius: 20px;
      background: #fff;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .health-tag.active {
      background: var(--color-primary-light, #FFE0D6);
      border-color: var(--color-primary, #D84315);
      color: var(--color-primary, #D84315);
      font-weight: 600;
    }

    /* ===== 处理过渡动画 ===== */
    .processing-transition {
      text-align: center;
      padding: var(--space-lg) 0;
    }
    .processing-spinner {
      width: 56px;
      height: 56px;
      margin: 0 auto var(--space-sm);
      border: 5px solid rgba(255,123,66,0.2);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spinner-rotate 0.9s linear infinite;
    }
    @keyframes spinner-rotate {
      to { transform: rotate(360deg); }
    }
    .processing-text {
      font-size: var(--font-m);
      color: var(--color-text, #1f2937);
      margin: 0;
    }

    /* ===== 适老模式放大 ===== */
    .theme-accessible .record-guide-title { font-size: var(--font-xxl); }
    .theme-accessible .record-guide-example { font-size: var(--font-m); }
    .theme-accessible .record-timer { font-size: var(--font-xxl); }
    .theme-accessible .processing-text { font-size: var(--font-l); }
    .theme-accessible .processing-spinner { width: 72px; height: 72px; border-width: 6px; }
    .theme-accessible .waveform { height: 80px; }
    .theme-accessible .waveform .wave-bar { width: 8px; }
    .theme-accessible .health-tag { font-size: 18px; min-height: 48px; padding: 10px 18px; }
  </style>
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">健康录音</span>
    </nav>

    <main class="page-content">

      <!-- 录音前引导说明 -->
      <div class="record-guide" id="recordGuide">
        <h2 class="record-guide-title">说说今天的身体感受</h2>
        <p class="record-guide-example">例如：今天血压有点高、头有点晕、睡得不太好、心情不错……<br>说一句话就能记录日常健康</p>
      </div>

      <!-- 健康类型快捷标签（录音前可选，便于分类） -->
      <div class="health-tags" id="healthTags">
        <button class="health-tag active" data-type="feel" onclick="selectHealthType(this, 'feel')">🤒 身体感受</button>
        <button class="health-tag" data-type="bp" onclick="selectHealthType(this, 'bp')">📊 血压</button>
        <button class="health-tag" data-type="sugar" onclick="selectHealthType(this, 'sugar')">🩸 血糖</button>
        <button class="health-tag" data-type="sleep" onclick="selectHealthType(this, 'sleep')">😴 睡眠</button>
        <button class="health-tag" data-type="mood" onclick="selectHealthType(this, 'mood')">😊 心情</button>
        <button class="health-tag" data-type="other" onclick="selectHealthType(this, 'other')">📝 其他</button>
      </div>

      <!-- 录音状态区域 -->
      <div style="text-align:center; padding: var(--space-md) 0;">
        <!-- 录音波形动画（录音中显示） -->
        <div class="waveform mock-mode" id="waveform" style="display: none;">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </div>

        <button class="btn-record" id="recordBtn" onclick="onRecordClick()">
          <span class="record-icon" id="recordIcon">🎙️</span>
          <span class="record-label" id="recordLabel">点击说话</span>
        </button>
        <p class="record-timer" id="recordDuration" style="display: none;"></p>
        <p class="record-mode-hint" id="recordModeHint" style="display: none;">🔇 示例录音中</p>
      </div>

      <!-- 处理过渡动画（默认隐藏） -->
      <div id="processingTransition" class="processing-transition" style="display: none;">
        <div class="processing-spinner"></div>
        <p class="processing-text">正在保存健康记录...</p>
      </div>

      <!-- 完成后的提示（默认隐藏） -->
      <div id="doneSection" style="display: none; padding: var(--space-md) 0;">
        <div class="card" style="border-color: var(--color-safe); background: linear-gradient(135deg, #E8F5E9 0%, #FFFFFF 100%);">
          <div class="card-header" style="color: var(--color-safe);">✅ 已保存今日健康记录</div>
          <div class="card-body">
            <p style="font-size: var(--font-m); margin-bottom: var(--space-sm);" id="savedContent"></p>
            <p class="text-s text-weak" id="savedTime"></p>
            <p class="text-s text-secondary" style="margin-top: var(--space-sm);">📋 已同步到「健康」首页的近期记录</p>
            <p class="text-s text-secondary">👨‍👩‍👧 子女端也会收到您的健康更新</p>
          </div>
        </div>
        <div style="height: var(--space-sm);"></div>
        <button class="btn-primary" onclick="resetAll()">再录一条</button>
        <div style="height: var(--space-sm);"></div>
        <a class="btn-secondary" href="me_home.html" style="display: block; text-align: center; text-decoration: none;">返回健康首页</a>
      </div>

      <!-- 与就医录音的区别说明（评委易用） -->
      <div style="margin: var(--space-md) var(--space-xl); padding: 10px 12px; background: #E3F2FD; border-radius: var(--radius-sm); border-left: 3px solid #1976D2; font-size: var(--font-xs); color: #0D47A1; line-height: 1.5;">
        💡 <strong>健康录音 vs 就医录音</strong>：<br>
        · 本页用于<strong>日常健康记录</strong>（血压、症状、心情等每日变化）<br>
        · 「就医」页的<strong>就诊录音</strong>用于记录医生诊断、处方（每次就医时使用）
      </div>

    </main>
  </div>

  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script src="../../shared/js/safety-engine.js"></script>
  <script>
    initMockData();

    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    var recordBtn = document.getElementById('recordBtn');
    var recordIcon = document.getElementById('recordIcon');
    var recordLabel = document.getElementById('recordLabel');
    var recordDuration = document.getElementById('recordDuration');
    var recordGuide = document.getElementById('recordGuide');
    var waveform = document.getElementById('waveform');
    var recordModeHint = document.getElementById('recordModeHint');
    var processingTransition = document.getElementById('processingTransition');
    var doneSection = document.getElementById('doneSection');
    var healthTags = document.getElementById('healthTags');

    // 当前选中的健康类型
    var currentHealthType = 'feel';
    var typeLabels = {
      'feel': '🤒 身体感受',
      'bp': '📊 血压',
      'sugar': '🩸 血糖',
      'sleep': '😴 睡眠',
      'mood': '😊 心情',
      'other': '📝 其他'
    };
    // 各类型的模拟识别文本（演示用）
    var mockTexts = {
      'feel': '今天头有点晕，胃口不太好，下午犯困',
      'bp': '今天血压 148/92，比昨天高一点',
      'sugar': '空腹血糖 6.5，饭后 8.2',
      'sleep': '昨晚睡得不太好，凌晨 3 点就醒了',
      'mood': '今天心情不错，孩子们来看我了',
      'other': '今天喝了两次水，去了三趟厕所'
    };

    function selectHealthType(btn, type) {
      currentHealthType = type;
      healthTags.querySelectorAll('.health-tag').forEach(function(t) { t.classList.remove('active'); });
      btn.classList.add('active');
    }

    // ===== 紧急症状阻断弹窗（老年用户代理反馈：健康记录需检测致命症状） =====
    function showHealthRecordEmergency(result) {
      var isRed = result.level === 'red';
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);';
      var box = document.createElement('div');
      box.style.cssText = 'background:#fff;border-radius:16px;padding:24px 20px;max-width:320px;text-align:center;';
      var titleColor = isRed ? '#F44336' : '#FF9800';
      var titleText = isRed ? '🚨 检测到紧急症状' : '⚠️ 检测到需关注症状';
      var btnText = isRed ? '拨打 120' : '我知道了';
      var btnColor = isRed ? '#F44336' : '#FF9800';
      box.innerHTML =
        '<div style="font-size:22px;font-weight:700;color:' + titleColor + ';margin-bottom:12px;">' + titleText + '</div>' +
        '<div style="font-size:15px;color:#424242;margin-bottom:8px;line-height:1.5;">' + result.message + '</div>' +
        '<div style="font-size:14px;color:' + titleColor + ';font-weight:600;margin-bottom:16px;">' + (result.suggestion || '') + '</div>' +
        '<div style="display:flex;gap:8px;">' +
          '<button id="emgCancelBtn" style="flex:1;padding:12px;background:#E0E0E0;color:#424242;border:none;border-radius:8px;font-size:15px;font-weight:600;">取消</button>' +
          '<button id="emgConfirmBtn" style="flex:1;padding:12px;background:' + btnColor + ';color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;">' + btnText + '</button>' +
        '</div>';
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      document.getElementById('emgCancelBtn').onclick = function() { overlay.remove(); };
      document.getElementById('emgConfirmBtn').onclick = function() {
        if (isRed) {
          box.innerHTML =
            '<div style="font-size:22px;font-weight:700;color:#F44336;margin-bottom:12px;">确认拨打 120？</div>' +
            '<div style="font-size:15px;color:#424242;margin-bottom:16px;">您确定要立即拨打急救电话 120 吗？</div>' +
            '<div style="display:flex;gap:8px;">' +
              '<button id="emgFinalCancelBtn" style="flex:1;padding:12px;background:#E0E0E0;color:#424242;border:none;border-radius:8px;font-size:15px;font-weight:600;">再想想</button>' +
              '<button id="emgFinalConfirmBtn" style="flex:1;padding:12px;background:#F44336;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;">确认拨打</button>' +
            '</div>';
          document.getElementById('emgFinalCancelBtn').onclick = function() { overlay.remove(); };
          document.getElementById('emgFinalConfirmBtn').onclick = function() {
            console.log('[Demo] 拨打 120');
            alert('📞 已拨打 120（体验模式，未真实拨打）');
            overlay.remove();
          };
        } else {
          overlay.remove();
        }
      };
    }

    // ===== 录音状态机（简化版：idle / recording / saving / done） =====
    var state = 'idle';
    var recordingSeconds = 0;
    var timerInterval = null;

    function onRecordClick() {
      if (state === 'idle') {
        startRecording();
      } else if (state === 'recording') {
        stopRecording();
      }
    }

    function startRecording() {
      state = 'recording';
      recordingSeconds = 0;
      recordGuide.style.display = 'none';
      healthTags.style.display = 'none';
      recordBtn.classList.add('recording');
      recordBtn.classList.add('animate-pulse-record');
      recordIcon.textContent = '🎙️';
      recordLabel.textContent = '点击停止';
      waveform.style.display = 'flex';
      recordDuration.style.display = 'block';
      recordModeHint.style.display = 'block';
      recordDuration.textContent = '00:00';
      processingTransition.style.display = 'none';
      doneSection.style.display = 'none';

      timerInterval = setInterval(function() {
        recordingSeconds++;
        recordDuration.textContent = formatTime(recordingSeconds);
      }, 1000);

      showToast('开始录音（示例模式）', 'info');
    }

    function stopRecording() {
      state = 'saving';
      clearInterval(timerInterval);
      recordBtn.classList.remove('recording');
      recordBtn.classList.remove('animate-pulse-record');
      recordIcon.textContent = '⏳';
      recordLabel.textContent = '保存中...';
      waveform.style.display = 'none';
      recordDuration.style.display = 'none';
      recordModeHint.style.display = 'none';
      processingTransition.style.display = 'block';

      // 模拟保存过程（1.2秒）
      setTimeout(function() {
        finishSaving();
      }, 1200);
    }

    function finishSaving() {
      state = 'done';
      processingTransition.style.display = 'none';
      doneSection.style.display = 'block';
      recordBtn.classList.remove('animate-ripple');
      recordIcon.textContent = '✅';
      recordLabel.textContent = '录音完成';

      // 显示保存内容
      var content = mockTexts[currentHealthType] || mockTexts.feel;
      var typeLabel = typeLabels[currentHealthType] || '健康记录';

      // ===== 紧急症状检测（接入 SafetyEngine） =====
      // 老年用户代理反馈：健康记录输入框必须检测致命症状
      if (typeof SafetyEngine !== 'undefined') {
        var checkResult = SafetyEngine.checkEmergencySymptoms(content);
        if (checkResult.level === 'red' || checkResult.level === 'yellow') {
          showHealthRecordEmergency(checkResult);
          return; // 阻止保存
        }
      }

      document.getElementById('savedContent').textContent = typeLabel + '：' + content;

      // 显示时间
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('savedTime').textContent = '⏰ ' + (now.getMonth()+1) + '月' + now.getDate() + '日 ' + h + ':' + m + '（刚刚）';

      // 同步到 localStorage（健康记录日志）
      try {
        var logs = [];
        var stored = localStorage.getItem('my_health_logs');
        if (stored) logs = JSON.parse(stored);
        logs.unshift({
          date: getTodayStr ? getTodayStr() : (now.getMonth()+1) + '月' + now.getDate() + '日',
          time: h + ':' + m,
          type: currentHealthType,
          typeLabel: typeLabel,
          content: content,
          source: 'voice'
        });
        localStorage.setItem('my_health_logs', JSON.stringify(logs));
      } catch (e) {
        console.warn('[health_record] 保存失败:', e);
      }

      showToast('✅ 健康记录已保存', 'success');
    }

    function resetAll() {
      state = 'idle';
      recordingSeconds = 0;
      recordGuide.style.display = 'block';
      healthTags.style.display = 'flex';
      recordBtn.classList.remove('recording');
      recordBtn.classList.remove('animate-pulse-record');
      recordBtn.classList.remove('animate-ripple');
      recordIcon.textContent = '🎙️';
      recordLabel.textContent = '点击说话';
      waveform.style.display = 'none';
      recordDuration.style.display = 'none';
      recordModeHint.style.display = 'none';
      processingTransition.style.display = 'none';
      doneSection.style.display = 'none';
    }

    function formatTime(sec) {
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
  </script>
</body>
</html>
