<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>拍照记录 - 银发就医小棉袄</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/app-layout.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
  <style>
    /* ===== 拍照引导区 ===== */
    .photo-guide {
      text-align: center;
      padding: var(--space-lg) var(--space-md) var(--space-sm);
    }
    .photo-guide-title {
      font-size: var(--font-xl);
      font-weight: 700;
      color: var(--color-text);
      margin: 0 0 var(--space-sm);
      line-height: 1.4;
    }
    .photo-guide-desc {
      font-size: var(--font-m);
      color: var(--color-text-secondary);
      margin: 0;
      line-height: 1.5;
    }
    .theme-accessible .photo-guide-title {
      font-size: var(--font-xxl);
    }
    .theme-accessible .photo-guide-desc {
      font-size: var(--font-l);
    }

    /* ===== 拍照预览区 ===== */
    .photo-preview {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto var(--space-md);
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--color-border);
    }
    .photo-preview video,
    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-preview .preview-placeholder {
      color: #999;
      font-size: var(--font-m);
      text-align: center;
      padding: var(--space-md);
      line-height: 1.6;
    }
    /* 十字对准线 */
    .photo-crosshair {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: none;
    }
    .photo-crosshair.active {
      display: block;
    }
    .photo-crosshair::before,
    .photo-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
    }
    .photo-crosshair::before {
      /* 横线 */
      top: 50%;
      left: 20%;
      right: 20%;
      height: 2px;
      transform: translateY(-50%);
    }
    .photo-crosshair::after {
      /* 竖线 */
      left: 50%;
      top: 20%;
      bottom: 20%;
      width: 2px;
      transform: translateX(-50%);
    }

    /* ===== 三个入口按钮 ===== */
    .photo-entry-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      padding: var(--space-sm) 0 var(--space-md);
    }
    .photo-entry-btn {
      height: 72px;
      border-radius: var(--btn-primary-radius);
      font-size: var(--btn-font-size);
      font-weight: 600;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .photo-entry-btn.primary {
      background: var(--color-primary);
      color: #fff;
    }
    .photo-entry-btn.primary:active {
      background: var(--color-primary-dark);
      transform: scale(0.98);
    }
    .photo-entry-btn.secondary {
      background: transparent;
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
    }
    .photo-entry-btn.secondary:active {
      background: var(--color-primary-light);
    }
    .photo-entry-btn.tertiary {
      background: var(--color-bg-gray);
      color: var(--color-text);
      border: 2px solid var(--color-border);
    }
    .photo-entry-btn.tertiary:active {
      background: var(--color-border);
    }
    .theme-accessible .photo-entry-btn {
      height: 80px;
      font-size: 26px;
    }

    /* ===== 拍照后操作按钮 ===== */
    .photo-action-group {
      display: none;
      flex-direction: column;
      gap: var(--space-sm);
      padding: var(--space-sm) 0 var(--space-md);
    }

    /* ===== OCR 进度区 ===== */
    .ocr-progress {
      display: none;
      text-align: center;
      padding: var(--space-lg) 0;
    }
    .ocr-progress-text {
      font-size: var(--font-l);
      color: var(--color-text);
      margin: 0 0 var(--space-sm);
      font-weight: 600;
    }
    .ocr-progress-bar {
      width: 100%;
      height: 16px;
      background: var(--color-bg-gray);
      border-radius: 8px;
      overflow: hidden;
    }
    .ocr-progress-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: 8px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .theme-accessible .ocr-progress-text {
      font-size: var(--font-xl);
    }
    .theme-accessible .ocr-progress-bar {
      height: 20px;
    }

    /* 隐藏的文件选择 input */
    .file-input-hidden {
      display: none;
    }
  </style>
</head>
<body class="theme-accessible">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <span class="navbar-title">拍照记录</span>
    </nav>

    <main class="page-content">

      <!-- 拍照引导区 -->
      <div class="photo-guide" id="photoGuide">
        <h2 class="photo-guide-title">请把单据平放在桌上，对准拍照</h2>
        <p class="photo-guide-desc">支持处方单、化验单、挂号单的自动识别</p>
        <!-- 体验模式标注：透明告知当前能力状态 -->
        <p style="margin-top: var(--space-sm); padding: 6px 12px; background: #E3F2FD; border-radius: var(--radius-sm); border-left: 3px solid #1976D2; font-size: var(--font-xs); color: #0D47A1; line-height: 1.5; display: inline-block;">
          ℹ️ 体验模式：点击「使用示例演示」查看示例处方单图片与 OCR 识别结果（真实 OCR 引擎接入中）
        </p>
      </div>

      <!-- 拍照预览区 -->
      <div class="photo-preview" id="photoPreview">
        <div class="preview-placeholder" id="previewPlaceholder">
          📷<br>点击下方按钮拍照或选择图片
        </div>
        <video id="videoPreview" autoplay playsinline style="display: none;"></video>
        <img id="imagePreview" alt="拍照预览" style="display: none;">
        <div class="photo-crosshair" id="photoCrosshair"></div>
      </div>

      <!-- 三个入口按钮 -->
      <div class="photo-entry-group" id="entryGroup">
        <button class="photo-entry-btn primary" onclick="onStartCamera()">
          <span>📷</span><span>拍照</span>
        </button>
        <button class="photo-entry-btn secondary" onclick="document.getElementById('fileInput').click()">
          <span>📁</span><span>从相册选择</span>
        </button>
        <button class="photo-entry-btn tertiary" onclick="onUseDemo()">
          <span>📋</span><span>使用示例演示</span>
        </button>
        <input type="file" id="fileInput" class="file-input-hidden" accept="image/*" onchange="onFileChange(event)">
      </div>

      <!-- 拍照后操作按钮 -->
      <div class="photo-action-group" id="actionGroup">
        <button class="photo-entry-btn primary" onclick="onStartRecognize()">
          <span>🔍</span><span>开始识别</span>
        </button>
        <button class="photo-entry-btn secondary" onclick="onReset()">
          <span>↻</span><span>重新拍</span>
        </button>
      </div>

      <!-- OCR 进度区 -->
      <div class="ocr-progress" id="ocrProgress">
        <p class="ocr-progress-text" id="ocrProgressText">正在识别文字... 0%</p>
        <div class="ocr-progress-bar">
          <div class="ocr-progress-fill" id="ocrProgressFill"></div>
        </div>
      </div>

    </main>
  </div>

  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script src="../../shared/js/safety-engine.js"></script>
  <script src="../../shared/js/photo-ocr.js"></script>
  <script>
    // ===== 加载主题 =====
    (function() {
      var savedTheme = getCurrentTheme();
      document.body.classList.remove('theme-standard','theme-accessible'); document.body.classList.add(savedTheme === 'standard' ? 'theme-standard' : 'theme-accessible');
    })();

    var videoPreview = document.getElementById('videoPreview');
    var imagePreview = document.getElementById('imagePreview');
    var previewPlaceholder = document.getElementById('previewPlaceholder');
    var photoCrosshair = document.getElementById('photoCrosshair');
    var entryGroup = document.getElementById('entryGroup');
    var actionGroup = document.getElementById('actionGroup');
    var ocrProgress = document.getElementById('ocrProgress');
    var ocrProgressFill = document.getElementById('ocrProgressFill');
    var ocrProgressText = document.getElementById('ocrProgressText');

    // 当前状态：'idle' | 'camera' | 'captured' | 'recognizing'
    var state = 'idle';
    var cameraStream = null;
    // 当前图片 base64（拍照或相册选择后）
    var currentImageBase64 = '';
    // 当前来源：'camera' | 'album' | 'demo'
    var currentSource = '';

    // ===== 启动摄像头 =====
    async function onStartCamera() {
      if (state === 'camera') {
        // 已在预览，执行拍照
        onCapture();
        return;
      }
      try {
        showToast('正在打开摄像头...', 'info');
        cameraStream = await startCamera(videoPreview);
        state = 'camera';
        // 显示视频预览 + 对准线
        videoPreview.style.display = 'block';
        imagePreview.style.display = 'none';
        previewPlaceholder.style.display = 'none';
        photoCrosshair.classList.add('active');
        // 隐藏其余入口，把"拍照"按钮改为"立即拍照"提示再次点击即拍摄
        var btns = entryGroup.querySelectorAll('.photo-entry-btn');
        btns[0].innerHTML = '<span>📸</span><span>立即拍照</span>';
        btns[1].style.display = 'none';
        btns[2].style.display = 'none';
      } catch (err) {
        showToast('摄像头无法启动：' + err.message + '，请改用相册选择或示例演示', 'warning');
        resetToIdle();
      }
    }

    // ===== 拍照（从摄像头预览中捕获） =====
    function onCapture() {
      if (!videoPreview.videoWidth) {
        showToast('摄像头还未准备好，请稍候', 'warning');
        return;
      }
      currentImageBase64 = capturePhoto(videoPreview);
      currentSource = 'camera';
      showCapturedPreview(currentImageBase64);
      stopCameraStream();
    }

    // ===== 从相册选择 =====
    async function onFileChange(event) {
      var file = event.target.files[0];
      event.target.value = ''; // 重置，便于重复选择同一文件
      if (!file) return;
      try {
        showToast('正在处理图片...', 'info');
        currentImageBase64 = await handleFileSelect(file);
        currentSource = 'album';
        showCapturedPreview(currentImageBase64);
      } catch (err) {
        showToast('图片处理失败：' + err.message, 'error');
      }
    }

    // ===== 使用示例演示 =====
    function onUseDemo() {
      currentSource = 'demo';
      currentImageBase64 = ''; // 体验模式无原图
      // 直接进入识别流程（用示例 OCR 文本）
      state = 'captured';
      imagePreview.style.display = 'none';
      videoPreview.style.display = 'none';
      photoCrosshair.classList.remove('active');
      previewPlaceholder.style.display = 'block';
      previewPlaceholder.innerHTML = '📋<br>已选择示例处方演示<br>点击"开始识别"';
      entryGroup.style.display = 'none';
      actionGroup.style.display = 'flex';
      showToast('已加载示例处方，点击"开始识别"查看效果', 'success');
    }

    // ===== 显示拍照后的预览图 =====
    function showCapturedPreview(base64) {
      state = 'captured';
      imagePreview.src = base64;
      imagePreview.style.display = 'block';
      videoPreview.style.display = 'none';
      previewPlaceholder.style.display = 'none';
      photoCrosshair.classList.remove('active');
      entryGroup.style.display = 'none';
      actionGroup.style.display = 'flex';
    }

    // ===== 开始识别 =====
    async function onStartRecognize() {
      if (state === 'recognizing') return;
      state = 'recognizing';
      actionGroup.style.display = 'none';
      ocrProgress.style.display = 'block';

      var ocrText = '';
      try {
        if (currentSource === 'demo') {
          // 体验模式：直接用示例处方文本，模拟进度
          ocrText = await simulateDemoProgress();
        } else {
          // 真实图片：调用 Tesseract.js OCR
          if (!currentImageBase64) {
            throw new Error('未获取到图片');
          }
          ocrText = await recognizeImageWithProgress(currentImageBase64);
        }

        // 调用后端分析（失败自动降级到前端解析）
        updateProgress(100, '正在分析内容...');
        var structured = await analyzeDocument(ocrText);
        structured.imageBase64 = currentImageBase64;
        structured.source = currentSource;
        structured.timestamp = new Date().toISOString();

        // 处方类自动做安全检查
        if (structured.type === 'prescription') {
          structured.safetyResult = checkPrescriptionSafety(structured.medications || []);
        }

        // 存入 sessionStorage，供结果页读取
        sessionStorage.setItem('photo_analysis_result', JSON.stringify(structured));
        // 跳转结果页
        navigateTo('me_photo_result.html', { from: 'photo' });
      } catch (err) {
        console.error('[me_photo] 识别失败：', err);
        showToast('识别失败：' + err.message + '，可使用示例演示', 'error');
        resetToIdle();
      }
    }

    // ===== Tesseract.js 识别（带进度回调） =====
    async function recognizeImageWithProgress(imageBase64) {
      updateProgress(0, '正在识别文字... 0%');
      var text = await recognizeImage(imageBase64, function (p) {
        updateProgress(p, '正在识别文字... ' + p + '%');
      });
      // 若识别结果过短，给出提示但仍继续
      if (!text || text.trim().length < 5) {
        showToast('识别到的文字较少，将尝试解析', 'warning');
      }
      return text;
    }

    // ===== 体验模式：模拟 OCR 进度 =====
    function simulateDemoProgress() {
      return new Promise(function (resolve) {
        var p = 0;
        var timer = setInterval(function () {
          p += Math.random() * 18 + 6;
          if (p >= 100) {
            p = 100;
            clearInterval(timer);
            updateProgress(100, '识别完成');
            setTimeout(function () {
              resolve(DEMO_PRESCRIPTION_OCR);
            }, 300);
          } else {
            updateProgress(Math.round(p), '正在识别文字... ' + Math.round(p) + '%');
          }
        }, 200);
      });
    }

    // ===== 更新进度条 =====
    function updateProgress(percent, text) {
      ocrProgressFill.style.width = percent + '%';
      ocrProgressText.textContent = text;
    }

    // ===== 重新拍 =====
    function onReset() {
      stopCameraStream();
      resetToIdle();
    }

    // ===== 重置为初始状态 =====
    function resetToIdle() {
      state = 'idle';
      currentImageBase64 = '';
      currentSource = '';
      videoPreview.style.display = 'none';
      imagePreview.style.display = 'none';
      imagePreview.removeAttribute('src');
      previewPlaceholder.style.display = 'block';
      previewPlaceholder.innerHTML = '📷<br>点击下方按钮拍照或选择图片';
      photoCrosshair.classList.remove('active');
      entryGroup.style.display = 'flex';
      var btns = entryGroup.querySelectorAll('.photo-entry-btn');
      btns[0].innerHTML = '<span>📷</span><span>拍照</span>';
      btns[1].style.display = '';
      btns[2].style.display = '';
      actionGroup.style.display = 'none';
      ocrProgress.style.display = 'none';
      ocrProgressFill.style.width = '0%';
      ocrProgressText.textContent = '正在识别文字... 0%';
    }

    // ===== 关闭摄像头流 =====
    function stopCameraStream() {
      if (cameraStream) {
        stopCamera(cameraStream, videoPreview);
        cameraStream = null;
      }
    }

    // 页面卸载时关闭摄像头
    window.addEventListener('beforeunload', stopCameraStream);
    // 页面隐藏时也关闭摄像头（节省资源）
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && state === 'camera') {
        stopCameraStream();
      }
    });
  </script>
</body>
</html>
