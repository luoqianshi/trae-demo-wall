<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我的 - 拍板鸭</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="app">
    <main class="page" aria-labelledby="mineTitle">
      <div class="topbar">
        <div>
          <h1 class="page-title" id="mineTitle">我的</h1>
        </div>
      </div>

      <div class="mine-profile">
        <img class="profile-avatar" src="assets/duck-mascot.png" alt="拍板鸭头像">
        <div>
          <p class="profile-name">拍板鸭用户</p>
          <div class="profile-meta">
            <span class="meta-pill" id="profileTemplateCount">模板 0</span>
            <span class="meta-pill" id="profileRecordCount">记录 0</span>
          </div>
        </div>
      </div>

      <div class="section-head">
        <div>
          <h2 class="section-title">我创建编辑的决策</h2>
          <p class="section-note">可再次编辑或直接开拍</p>
        </div>
      </div>
      <div class="list-stack" id="savedDecisionList"></div>

      <div class="section-head">
        <div>
          <h2 class="section-title">我的决策记录</h2>
          <p class="section-note">只保存在当前浏览器</p>
        </div>
      </div>
      <div class="list-stack" id="recordList"></div>
    </main>
    <div id="tabbar"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="scripts/common.js"></script>
  <script src="scripts/mine.js"></script>
</body>
</html>
