<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>创建决策 - 拍板鸭</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="app">
    <main class="page" aria-labelledby="createTitle">
      <div class="topbar">
        <div>
          <h1 class="page-title" id="createTitle">创建决策</h1>
          <p class="page-subtitle">写下选项，剩下交给拍板鸭。</p>
        </div>
        <button class="link-btn" type="button" id="resetDraftBtn">清空</button>
      </div>

      <div class="source-strip" id="sourceStrip">
        <span id="sourceText">已带入模板</span>
        <button class="mini-btn" type="button" id="detachTemplateBtn">从空白开始</button>
      </div>

      <div class="form-block">
        <label class="field-label" for="decisionTitle">决策标题</label>
        <input class="input" id="decisionTitle" maxlength="28" placeholder="比如：今晚吃什么">
      </div>

      <div class="form-block">
        <div class="section-head">
          <div>
            <h2 class="section-title">选项</h2>
            <p class="section-note">至少保留 2 个有效选项</p>
          </div>
          <button class="link-btn" type="button" id="addOptionBtn">添加</button>
        </div>
        <div id="optionList"></div>
      </div>

      <div class="form-block">
        <h2 class="section-title">决策动效</h2>
        <div class="effect-picker" id="effectPicker"></div>
      </div>

      <div class="button-row">
        <button class="secondary-btn" type="button" id="saveTemplateBtn">保存到我的模板</button>
        <button class="primary-btn" type="button" id="startDecisionBtn">交给拍板鸭</button>
      </div>
    </main>
    <div id="tabbar"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="scripts/common.js"></script>
  <script src="scripts/create.js"></script>
</body>
</html>
