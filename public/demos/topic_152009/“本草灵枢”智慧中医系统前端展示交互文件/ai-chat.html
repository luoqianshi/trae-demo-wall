<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 问诊 · 本草灵枢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tcm: {
              primary: '#2D5A4A',
              primaryLight: '#3D7A64',
              primaryDark: '#1F4035',
              secondary: '#8B5A2B',
              secondaryLight: '#A67B4D',
              accent: '#B83A3A',
              accentLight: '#C95A5A',
              paper: '#F1EBD8',
              paperDark: '#E5DEC3',
              ink: '#2C2622',
              inkLight: '#6B6259',
              card: '#1E2622',
              cardLight: '#2A3530',
              gold: '#C9A227',
              border: '#D8CEB3'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'STSong', 'SimSun', 'serif'],
            sans: ['"Noto Sans SC"', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            calligraphy: ['"Ma Shan Zheng"', 'cursive']
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --primary: #2D5A4A;
      --primaryLight: #3D7A64;
      --primaryDark: #1F4035;
      --secondary: #8B5A2B;
      --accent: #B83A3A;
      --paper: #F1EBD8;
      --paperDark: #E5DEC3;
      --ink: #2C2622;
      --inkLight: #6B6259;
      --gold: #C9A227;
      --border: #D8CEB3;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
    }

    .font-calligraphy {
      font-family: 'Ma Shan Zheng', 'Noto Serif SC', cursive;
    }

    /* 宣纸纹理 */
    .paper-texture::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(201, 162, 39, 0.05) 0%, transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(139, 90, 43, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(45, 90, 74, 0.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* 导航栏 */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(241, 235, 216, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(45, 90, 74, 0.1);
    }
    .nav-link {
      color: var(--inkLight);
      font-size: 14px;
      letter-spacing: 0.05em;
      transition: color 0.3s ease;
      position: relative;
      white-space: nowrap;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 2px;
      background: var(--primary);
      transition: width 0.3s ease;
    }
    .nav-link:hover { color: var(--primary); }
    .nav-link:hover::after { width: 100%; }
    .nav-link.active { color: var(--primary); font-weight: 500; }
    .nav-link.active::after { width: 100%; }

    /* 聊天容器 */
    .chat-container {
      height: calc(100vh - 200px);
      min-height: 320px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: rgba(45, 90, 74, 0.2); border-radius: 3px; }
    .chat-container::-webkit-scrollbar-thumb:hover { background: rgba(45, 90, 74, 0.4); }

    /* 消息淡入动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 消息气泡通用 */
    .msg-row { display: flex; gap: 12px; align-items: flex-start; }
    .msg-row.user { flex-direction: row-reverse; }

    .ai-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primaryDark) 100%);
      color: #F1EBD8;
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(45, 90, 74, 0.25);
    }

    .bubble {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 15px;
      word-break: break-word;
    }
    .bubble.ai {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--ink);
      backdrop-filter: blur(4px);
    }
    .bubble.user {
      background: var(--primary);
      color: #fff;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(45, 90, 74, 0.2);
    }

    /* AI 回复结构化样式 */
    .reply-intro { margin-bottom: 10px; }
    .reply-section { margin: 10px 0; }
    .reply-label {
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.15em;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .reply-label::before {
      content: '';
      width: 3px; height: 12px;
      background: var(--accent);
      border-radius: 2px;
    }
    .reply-list { margin: 0; padding: 0; list-style: none; }
    .reply-list li {
      padding: 6px 0 6px 16px;
      position: relative;
      font-size: 14px;
      color: var(--ink);
      border-bottom: 1px dashed rgba(216, 206, 179, 0.6);
    }
    .reply-list li:last-child { border-bottom: none; }
    .reply-list li::before {
      content: '◆';
      position: absolute;
      left: 0; top: 6px;
      color: var(--gold);
      font-size: 10px;
    }
    .reply-list li b { color: var(--primary); font-weight: 600; }
    .reply-list li .tag {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 8px;
      font-size: 11px;
      margin-left: 4px;
    }
    .tag-nature { background: rgba(45, 90, 74, 0.1); color: var(--primary); }
    .tag-acupoint { background: rgba(201, 162, 39, 0.15); color: #8a6f15; }
    .tag-herb { background: rgba(139, 90, 43, 0.12); color: var(--secondary); }

    .reply-disclaimer {
      margin-top: 12px;
      padding: 8px 12px;
      background: rgba(184, 58, 58, 0.06);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      font-size: 12px;
      color: var(--accent);
    }

    /* 打字光标 */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--primary);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* 思考中三点动画 */
    .thinking-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--primary);
      margin: 0 2px;
      animation: dotBounce 1.4s infinite ease-in-out both;
    }
    .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* 快捷问题按钮 */
    .quick-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      font-size: 13px;
      color: var(--inkLight);
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .quick-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-1px);
    }

    /* 输入区 */
    .input-wrap {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border);
      border-radius: 24px;
      transition: all 0.3s ease;
    }
    .input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(45, 90, 74, 0.1);
      background: #fff;
    }
    .input-wrap input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      font-size: 15px;
      color: var(--ink);
      font-family: inherit;
    }
    .input-wrap input::placeholder { color: var(--inkLight); }

    .send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      flex-shrink: 0;
      border: none;
    }
    .send-btn:hover { background: var(--primaryDark); transform: scale(1.05); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

    /* 免责声明条 */
    .disclaimer-bar {
      font-size: 11px;
      color: var(--inkLight);
      text-align: center;
      padding: 4px 12px;
    }

    /* 底部面板 */
    .bottom-panel {
      background: rgba(241, 235, 216, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(45, 90, 74, 0.1);
    }

    /* 清空按钮 */
    .clear-btn {
      font-size: 12px;
      color: var(--inkLight);
      cursor: pointer;
      transition: color 0.3s ease;
    }
    .clear-btn:hover { color: var(--accent); }

    /* 响应式 */
    @media (max-width: 640px) {
      .bubble { max-width: 88%; font-size: 14px; padding: 12px 14px; }
      .ai-avatar { width: 34px; height: 34px; font-size: 16px; }
      .nav-links-scroll { overflow-x: auto; }
    }
  </style>
</head>
<body class="paper-texture flex flex-col h-screen overflow-hidden">

  <!-- 统一导航栏 -->
  <div id="nav-mount"></div>

  <!-- 标题区 -->
  <section class="flex-shrink-0 px-6 pt-4 pb-3 text-center relative z-10">
    <div class="flex items-center justify-center gap-3 mb-1">
      <span class="hidden sm:block w-12 h-px bg-tcm-border"></span>
      <h1 class="font-calligraphy text-3xl md:text-4xl text-tcm-primaryDark">AI 问诊</h1>
      <span class="hidden sm:block w-12 h-px bg-tcm-border"></span>
    </div>
    <p class="text-tcm-inkLight text-xs md:text-sm tracking-[0.15em]">千年岐黄术，一问便知之</p>
  </section>

  <!-- 聊天容器 -->
  <main id="chatBox" class="chat-container max-w-3xl w-full mx-auto px-4 sm:px-6 py-4 relative z-10">
    <!-- 消息动态生成 -->
  </main>

  <!-- 底部面板：免责声明 + 快捷问题 + 输入 -->
  <div class="bottom-panel flex-shrink-0 relative z-10">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-1 pb-3">
      <p class="disclaimer-bar">本AI助手提供的信息仅供参考学习，不能替代专业医疗诊断和治疗</p>

      <!-- 快捷问题 -->
      <div class="flex flex-wrap gap-2 mb-2 justify-center" id="quickQuestions">
        <button class="quick-btn" data-q="气虚怎么调理？">气虚怎么调理？</button>
        <button class="quick-btn" data-q="感冒了吃什么好？">感冒了吃什么好？</button>
        <button class="quick-btn" data-q="失眠怎么改善？">失眠怎么改善？</button>
        <button class="quick-btn" data-q="湿气重怎么办？">湿气重怎么办？</button>
      </div>

      <!-- 输入区 -->
      <div class="flex items-center gap-2">
        <div class="input-wrap flex items-center flex-1 px-5 py-2.5">
          <svg class="w-5 h-5 text-tcm-inkLight flex-shrink-0 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
          </svg>
          <input type="text" id="msgInput" placeholder="描述您的症状或疑问，如：最近总是失眠多梦..." autocomplete="off">
        </div>
        <button class="send-btn" id="sendBtn" aria-label="发送">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
        </button>
        <button class="clear-btn flex-shrink-0 px-2" id="clearBtn" title="清空对话" aria-label="清空对话">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/herbs-data.js"></script>
  <script src="js/formulas-data.js"></script>
  <script src="js/acupoints-data.js"></script>
  <script>
    'use strict';

    // ===== 常量 =====
    const STORAGE_KEY = 'tcm_chat_history';
    const MAX_HISTORY = 50;

    const QUICK_QUESTIONS = [
      '气虚怎么调理？',
      '感冒了吃什么好？',
      '失眠怎么改善？',
      '湿气重怎么办？'
    ];

    const WELCOME_TEXT = '您好，我是本草灵枢AI问诊助手「枢」。我可以根据您的症状描述，为您推荐对症的药材、方剂与穴位，并提供日常养生建议。请描述您的不适，或点击下方快捷问题开始问诊。';

    // 养生建议（按症状分类）
    const ADVICE_BY_CATEGORY = {
      '脾胃': '饮食宜清淡易消化，少食生冷油腻，定时定量，可配合顺时针腹部按摩。',
      '肺系': '注意保暖防寒，多饮温水，保持室内空气流通，避免烟尘刺激。',
      '心系': '保持心情平和，避免过度劳累与情绪激动，保证充足睡眠。',
      '肝系': '保持心情舒畅，避免熬夜与动怒，适度运动以疏肝理气。',
      '肾系': '注意腰部保暖，避免过度劳累，可艾灸关元、命门以温补肾阳。',
      '气血': '加强营养，规律作息，可练习八段锦、太极等柔缓运动以调养气血。',
      '外感': '注意防寒保暖，多饮温水，饮食清淡，避免辛辣油腻。',
      '虚损': '注意休息调养，饮食有节，适度运动，循序渐进增强体质。'
    };

    // 特殊食疗建议（关键词规则）
    const FOOD_ADVICE = [
      { keywords: ['失眠', '睡不着', '多梦'], advice: '可取酸枣仁10-15g泡水代茶饮，睡前温水泡脚引火下行。' },
      { keywords: ['感冒', '风寒', '怕冷'], advice: '生姜红糖水趁热饮用，盖被取微汗，避风保暖。' },
      { keywords: ['风热', '咽喉', '咽痛'], advice: '金银花、菊花泡水代茶，清热利咽，多饮温水。' },
      { keywords: ['湿气', '湿重', '湿热'], advice: '薏苡仁、赤小豆煮粥食用，健脾利湿，少食肥甘。' },
      { keywords: ['气虚', '乏力', '没力气'], advice: '黄芪、党参各10g炖鸡或泡水饮用，益气健脾。' },
      { keywords: ['血虚', '面色', '头晕眼花'], advice: '当归、熟地黄煲汤，或红枣桂圆煮粥，养血补血。' },
      { keywords: ['阴虚', '盗汗', '口干'], advice: '银耳、百合、枸杞煮羹，滋阴润燥，忌食辛辣。' },
      { keywords: ['阳虚', '怕冷', '手脚凉'], advice: '羊肉、生姜、桂圆温补，可艾灸神阙、关元。' },
      { keywords: ['咳嗽', '痰'], advice: '陈皮泡水理气化痰，梨炖冰糖润肺止咳，忌食甜腻。' },
      { keywords: ['便秘', '大便干'], advice: '晨起温水一杯，多食蔬菜粗粮，蜂蜜润肠通便。' },
      { keywords: ['腹胀', '食少', '消化'], advice: '山楂、陈皮泡水消食化滞，少食多餐，细嚼慢咽。' }
    ];

    // ===== DOM =====
    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');

    let isReplying = false;

    // ===== 历史记录 =====
    function loadHistory() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(data) ? data : null;
      } catch { return null; }
    }

    function saveHistory(history) {
      try {
        const trimmed = history.slice(-MAX_HISTORY);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
      } catch {}
    }

    function clearHistory() {
      localStorage.removeItem(STORAGE_KEY);
      chatBox.innerHTML = '';
      renderMessage('ai', WELCOME_TEXT, false);
      const history = [{ role: 'ai', text: WELCOME_TEXT, html: null }];
      saveHistory(history);
    }

    // ===== 渲染消息（不含打字效果） =====
    function renderMessage(role, content, isHTML) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + role + ' mb-4 msg-fade-in';

      const avatar = document.createElement('div');
      avatar.className = 'ai-avatar';
      avatar.textContent = '枢';

      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + role;
      if (isHTML) {
        bubble.innerHTML = content;
      } else {
        bubble.textContent = content;
      }

      if (role === 'ai') {
        row.appendChild(avatar);
        row.appendChild(bubble);
      } else {
        row.appendChild(bubble);
      }
      chatBox.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ===== 知识库匹配核心逻辑 =====

    // 工具：判断输入是否在询问某药材
    function findHerbInInput(input) {
      return HERBS_DATA.find(h => {
        if (input.includes(h.name)) return true;
        const aliases = h.alias.split('、');
        return aliases.some(a => a && input.includes(a));
      });
    }

    // 工具：匹配症状
    function matchSymptoms(input) {
      return SYMPTOMS_DATA.filter(s => {
        if (input.includes(s.name)) return true;
        return s.keywords.some(k => input.includes(k));
      });
    }

    // 工具：根据症状匹配方剂
    function matchFormulas(symptoms, input) {
      let formulas = [];
      if (symptoms.length > 0) {
        const sids = symptoms.map(s => s.id);
        formulas = FORMULAS_DATA.filter(f => f.symptoms.some(sid => sids.includes(sid)));
      }
      // 直接方剂名匹配
      FORMULAS_DATA.forEach(f => {
        if (input.includes(f.name) && !formulas.includes(f)) formulas.push(f);
      });
      return formulas.slice(0, 4);
    }

    // 工具：根据方剂/症状推荐药材
    function recommendHerbs(symptoms, formulas, herbMatch) {
      const result = [];
      const seen = new Set();

      if (herbMatch) { result.push(herbMatch); seen.add(herbMatch.id); }

      // 从方剂取药材
      formulas.forEach(f => {
        f.herbs.forEach(hid => {
          const h = HERBS_DATA.find(x => x.id === hid);
          if (h && !seen.has(h.id)) { result.push(h); seen.add(h.id); }
        });
      });

      // 从症状匹配药材（按主治）
      if (result.length < 3) {
        HERBS_DATA.forEach(h => {
          if (seen.has(h.id)) return;
          const hit = symptoms.some(s =>
            h.indication.includes(s.name) ||
            s.keywords.some(k => h.indication.includes(k))
          );
          if (hit) { result.push(h); seen.add(h.id); }
        });
      }
      return result.slice(0, 5);
    }

    // 工具：根据症状推荐穴位
    function recommendAcupoints(symptoms, input) {
      const points = [];
      const seen = new Set();
      ACUPOINTS_DATA.forEach(a => {
        const hit = symptoms.some(s =>
          a.indication.includes(s.name) ||
          s.keywords.some(k => a.indication.includes(k))
        );
        if (hit && !seen.has(a.id)) { points.push(a); seen.add(a.id); }
      });
      return points.slice(0, 4);
    }

    // 工具：生成养生建议
    function generateAdvice(symptoms, input) {
      const tips = [];
      // 特殊食疗
      FOOD_ADVICE.forEach(item => {
        if (item.keywords.some(k => input.includes(k))) tips.push(item.advice);
      });
      // 按分类通用建议
      const cats = [...new Set(symptoms.map(s => s.category))];
      cats.forEach(c => {
        if (ADVICE_BY_CATEGORY[c] && !tips.includes(ADVICE_BY_CATEGORY[c])) {
          tips.push(ADVICE_BY_CATEGORY[c]);
        }
      });
      if (tips.length === 0) {
        tips.push('保持规律作息，饮食有节，起居有常，适度运动，保持心情舒畅。');
      }
      return tips.slice(0, 3);
    }

    // 主匹配：生成结构化回复（返回分段数组）
    function generateReply(userInput) {
      const input = userInput.trim();
      const segments = [];

      // 1. 药材名直接询问
      const herbMatch = findHerbInInput(input);
      if (herbMatch) {
        segments.push({ type: 'text', content: `您问到的「${herbMatch.name}」，是中医常用的${herbMatch.category}，为您介绍如下：` });
        segments.push({ type: 'header', content: '性味归经' });
        segments.push({ type: 'text', content: `性${herbMatch.nature}，味${herbMatch.flavor.join('、')}，归${herbMatch.meridian.join('、')}经。` });
        segments.push({ type: 'header', content: '功效主治' });
        segments.push({ type: 'list', items: [`<b>功效：</b>${herbMatch.efficacy}`, `<b>主治：</b>${herbMatch.indication}`] });
        segments.push({ type: 'header', content: '用法禁忌' });
        segments.push({ type: 'list', items: [`<b>用法：</b>${herbMatch.usage}`, `<b>禁忌：</b><span style="color:var(--accent)">${herbMatch.contraindication}</span>`] });
        // 关联方剂
        const relFormulas = FORMULAS_DATA.filter(f => f.herbs.includes(herbMatch.id)).slice(0, 3);
        if (relFormulas.length > 0) {
          segments.push({ type: 'header', content: '含此药的方剂' });
          segments.push({ type: 'list', items: relFormulas.map(f => `<b>${f.name}</b> — ${f.efficacy}`) });
        }
        segments.push({ type: 'disclaimer' });
        return segments;
      }

      // 2. 症状匹配
      const symptoms = matchSymptoms(input);
      const formulas = matchFormulas(symptoms, input);
      const acupoints = recommendAcupoints(symptoms, input);
      const herbs = recommendHerbs(symptoms, formulas, null);
      const advice = generateAdvice(symptoms, input);

      // 无匹配 → 通用建议
      if (symptoms.length === 0 && formulas.length === 0 && herbs.length === 0) {
        segments.push({ type: 'text', content: '抱歉，我暂时未能从您的描述中识别出明确的症状。您可以尝试更具体地描述不适，例如「失眠多梦」「气虚乏力」「感冒咳嗽」等，或直接输入药材名（如「黄芪」）查询其性味功效。' });
        segments.push({ type: 'header', content: '日常养生建议' });
        segments.push({ type: 'list', items: [
          '起居有常，子时（23点）前入睡，养肝护胆。',
          '饮食有节，不偏食偏嗜，少食生冷油腻。',
          '动静结合，可练习八段锦、太极等柔缓运动。',
          '保持心情舒畅，避免过度劳累与情绪波动。'
        ]});
        segments.push({ type: 'disclaimer' });
        return segments;
      }

      // 证候分析
      segments.push({ type: 'text', content: '根据您的描述，我为您做了如下分析，供参考：' });
      segments.push({ type: 'header', content: '证候分析' });
      const symText = symptoms.length > 0
        ? symptoms.slice(0, 5).map(s => s.name).join('、')
        : '相关证候';
      segments.push({ type: 'text', content: `初步识别可能涉及：<b style="color:var(--primary)">${symText}</b>${symptoms.length > 0 ? '（' + [...new Set(symptoms.map(s => s.category))].join('、') + '类）' : ''}。` });

      // 推荐方剂
      if (formulas.length > 0) {
        segments.push({ type: 'header', content: '推荐方剂' });
        segments.push({ type: 'list', items: formulas.map(f => `<b>${f.name}</b> <span class="tag tag-nature">${f.source}</span> — ${f.efficacy}。主治：${f.indication}`) });
      }

      // 推荐药材
      if (herbs.length > 0) {
        segments.push({ type: 'header', content: '推荐药材' });
        segments.push({ type: 'list', items: herbs.map(h => `<b>${h.name}</b> <span class="tag tag-herb">性${h.nature}·味${h.flavor.join('、')}</span> — ${h.efficacy}`) });
      }

      // 推荐穴位
      if (acupoints.length > 0) {
        segments.push({ type: 'header', content: '推荐穴位' });
        segments.push({ type: 'list', items: acupoints.map(a => `<b>${a.name}</b> <span class="tag tag-acupoint">${a.code}</span> — 主治：${a.indication}。定位：${a.location}`) });
      }

      // 养生建议
      if (advice.length > 0) {
        segments.push({ type: 'header', content: '养生建议' });
        segments.push({ type: 'list', items: advice });
      }

      segments.push({ type: 'disclaimer' });
      return segments;
    }

    // 将分段渲染为完整 HTML（用于历史记录还原）
    function segmentsToHTML(segments) {
      let html = '';
      segments.forEach(seg => {
        if (seg.type === 'text') html += `<p class="reply-intro">${seg.content}</p>`;
        else if (seg.type === 'header') html += `<div class="reply-label">${seg.content}</div>`;
        else if (seg.type === 'list') html += `<ul class="reply-list">${seg.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
        else if (seg.type === 'disclaimer') html += `<div class="reply-disclaimer">⚠ 以上建议仅供参考，不构成医疗诊断。如症状持续或加重，请及时就医。</div>`;
      });
      return html;
    }

    // ===== 打字效果（分段逐字输出） =====
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function typeText(el, text, speed) {
      return new Promise(resolve => {
        el.textContent = '';
        let i = 0;
        function step() {
          if (i < text.length) {
            el.textContent = text.substring(0, i + 1);
            scrollToBottom();
            i += 2;
            setTimeout(step, speed);
          } else {
            resolve();
          }
        }
        step();
      });
    }

    // 去除 HTML 标签取纯文本（用于逐字输入）
    function stripTags(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || '';
    }

    async function typeOutSegments(bubble, segments) {
      const cursor = document.createElement('span');
      cursor.className = 'typing-cursor';
      bubble.appendChild(cursor);

      for (const seg of segments) {
        if (seg.type === 'text') {
          const p = document.createElement('p');
          p.className = 'reply-intro';
          bubble.insertBefore(p, cursor);
          // 含 HTML 的文本，逐字输入纯文本后替换为富文本
          const plain = stripTags(seg.content);
          await typeText(p, plain, 22);
          p.innerHTML = seg.content;
          scrollToBottom();
        } else if (seg.type === 'header') {
          const div = document.createElement('div');
          div.className = 'reply-label';
          bubble.insertBefore(div, cursor);
          await typeText(div, seg.content, 26);
          scrollToBottom();
        } else if (seg.type === 'list') {
          const ul = document.createElement('ul');
          ul.className = 'reply-list';
          bubble.insertBefore(ul, cursor);
          for (const item of seg.items) {
            const li = document.createElement('li');
            ul.appendChild(li);
            const plain = stripTags(item);
            await typeText(li, plain, 18);
            li.innerHTML = item;
            scrollToBottom();
            await sleep(60);
          }
        } else if (seg.type === 'disclaimer') {
          const div = document.createElement('div');
          div.className = 'reply-disclaimer';
          bubble.insertBefore(div, cursor);
          const txt = '⚠ 以上建议仅供参考，不构成医疗诊断。如症状持续或加重，请及时就医。';
          await typeText(div, txt, 16);
          scrollToBottom();
        }
      }
      cursor.remove();
    }

    // ===== 思考中指示器 =====
    function showThinking() {
      const row = document.createElement('div');
      row.className = 'msg-row ai mb-4 msg-fade-in';
      row.id = 'thinkingRow';
      const avatar = document.createElement('div');
      avatar.className = 'ai-avatar';
      avatar.textContent = '枢';
      const bubble = document.createElement('div');
      bubble.className = 'bubble ai';
      bubble.innerHTML = '<span class="thinking-dots"><span></span><span></span><span></span></span> 正在思考...';
      row.appendChild(avatar);
      row.appendChild(bubble);
      chatBox.appendChild(row);
      scrollToBottom();
    }
    function removeThinking() {
      const r = document.getElementById('thinkingRow');
      if (r) r.remove();
    }

    // ===== 发送消息 =====
    async function sendMessage(text) {
      if (isReplying) return;
      const content = (text || msgInput.value).trim();
      if (!content) return;

      isReplying = true;
      sendBtn.disabled = true;
      msgInput.value = '';

      // 渲染用户消息
      renderMessage('user', content, false);

      // 保存用户消息
      let history = loadHistory() || [];
      history.push({ role: 'user', text: content });
      saveHistory(history);

      // 思考动画
      showThinking();
      await sleep(700);
      removeThinking();

      // 生成回复
      const segments = generateReply(content);
      const bubble = renderMessage('ai', '', false);
      await typeOutSegments(bubble, segments);

      // 保存 AI 消息（存分段以便还原时渲染富文本）
      history = loadHistory() || [];
      history.push({ role: 'ai', text: '', segments: segments });
      saveHistory(history);

      isReplying = false;
      sendBtn.disabled = false;
      msgInput.focus();
    }

    // ===== 还原历史记录 =====
    function restoreHistory(history) {
      chatBox.innerHTML = '';
      history.forEach(msg => {
        if (msg.role === 'user') {
          renderMessage('user', msg.text, false);
        } else if (msg.role === 'ai') {
          if (msg.segments && msg.segments.length) {
            const html = segmentsToHTML(msg.segments);
            renderMessage('ai', html, true);
          } else {
            renderMessage('ai', msg.text, false);
          }
        }
      });
    }

    // ===== 初始化 =====
    function init() {
      const history = loadHistory();
      if (history && history.length > 0) {
        restoreHistory(history);
      } else {
        // 欢迎语
        renderMessage('ai', WELCOME_TEXT, false);
        saveHistory([{ role: 'ai', text: WELCOME_TEXT, segments: null }]);
      }

      // 发送按钮
      sendBtn.addEventListener('click', () => sendMessage());

      // 回车发送
      msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // 快捷问题
      document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const q = btn.getAttribute('data-q');
          sendMessage(q);
        });
      });

      // 清空对话
      clearBtn.addEventListener('click', () => {
        if (confirm('确定要清空所有对话记录吗？')) {
          clearHistory();
        }
      });

      scrollToBottom();
      msgInput.focus();
    }

    // 等待数据加载完成
    if (typeof HERBS_DATA !== 'undefined') {
      init();
    } else {
      window.addEventListener('load', init);
    }
  </script>
</body>
</html>
