<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 本草灵枢hwb</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tcm: {
              primary: '#2D5A4A',
              primaryLight: '#3D7A64',
              primaryDark: '#1F4035',
              secondary: '#8B5A2B',
              secondaryLight: '#A67B4D',
              accent: '#B83A3A',
              accentLight: '#C95A5A',
              paper: '#F1EBD8',
              paperDark: '#E5DEC3',
              ink: '#2C2622',
              inkLight: '#6B6259',
              card: '#1E2622',
              cardLight: '#2A3530',
              gold: '#C9A227',
              border: '#D8CEB3'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'STSong', 'SimSun', 'serif'],
            sans: ['"Noto Sans SC"', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            calligraphy: ['"Ma Shan Zheng"', 'cursive']
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --primary: #2D5A4A;
      --primaryLight: #3D7A64;
      --primaryDark: #1F4035;
      --secondary: #8B5A2B;
      --accent: #B83A3A;
      --paper: #F1EBD8;
      --ink: #2C2622;
      --inkLight: #6B6259;
      --card: #1E2622;
      --cardLight: #2A3530;
      --gold: #C9A227;
      --border: #D8CEB3;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 宣纸纹理 */
    .paper-texture::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(201, 162, 39, 0.05) 0%, transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(139, 90, 43, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(45, 90, 74, 0.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* 浮动印章 */
    .seal {
      position: absolute;
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      writing-mode: vertical-rl;
      pointer-events: none;
      user-select: none;
    }

    /* 左侧装饰面板 */
    .deco-panel {
      background: linear-gradient(160deg, var(--card) 0%, var(--primaryDark) 50%, var(--cardLight) 100%);
      position: relative;
      overflow: hidden;
    }
    .deco-panel::before {
      content: '';
      position: absolute;
      top: -30%; right: -30%;
      width: 80%; height: 80%;
      background: radial-gradient(circle, rgba(201, 162, 39, 0.1) 0%, transparent 60%);
      animation: decoGlow 6s ease-in-out infinite alternate;
    }
    .deco-panel::after {
      content: '';
      position: absolute;
      bottom: -20%; left: -20%;
      width: 60%; height: 60%;
      background: radial-gradient(circle, rgba(45, 90, 74, 0.15) 0%, transparent 60%);
      animation: decoGlow 8s ease-in-out infinite alternate-reverse;
    }
    @keyframes decoGlow {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.08); }
    }

    /* 装饰线条 */
    .deco-line {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), transparent);
      border-radius: 1px;
    }

    /* 表单输入框 */
    .form-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      color: var(--ink);
      transition: all 0.3s ease;
      outline: none;
    }
    .form-input::placeholder { color: var(--inkLight); font-size: 14px; }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 74, 0.1);
      background: rgba(255, 255, 255, 0.9);
    }
    .form-input.error {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(184, 58, 58, 0.08);
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px; height: 20px;
      color: var(--inkLight);
      transition: color 0.3s ease;
      pointer-events: none;
    }
    .form-input:focus ~ .input-icon,
    .input-group:focus-within .input-icon { color: var(--primary); }

    /* 主登录按钮 */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primaryDark) 100%);
      color: #F7F3E9;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s ease;
    }
    .btn-primary:hover {
      box-shadow: 0 8px 24px rgba(45, 90, 74, 0.3);
      transform: translateY(-1px);
    }
    .btn-primary:hover::before { left: 100%; }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 切换标签 */
    .tab-btn {
      padding: 10px 0;
      font-size: 15px;
      letter-spacing: 0.1em;
      color: var(--inkLight);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      background: none;
      border-top: none; border-left: none; border-right: none;
      flex: 1;
      text-align: center;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 500;
    }

    /* 错误提示 */
    .error-msg {
      font-size: 12px;
      color: var(--accent);
      margin-top: 4px;
      display: none;
      align-items: center;
      gap: 4px;
    }
    .error-msg.show { display: flex; }

    /* 密码可见性切换 */
    .pwd-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--inkLight);
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s ease;
    }
    .pwd-toggle:hover { color: var(--primary); }

    /* 记住我复选框 */
    .checkbox-custom {
      width: 18px; height: 18px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      background: rgba(255,255,255,0.5);
    }
    .checkbox-custom.checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* 分隔线 */
    .divider-line {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--inkLight);
      font-size: 12px;
    }
    .divider-line::before,
    .divider-line::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    /* 第三方登录 */
    .social-btn {
      width: 48px; height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .social-btn:hover {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(45, 90, 74, 0.1);
    }

    /* Toast 通知 */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 8px 32px rgba(30, 38, 34, 0.15);
      animation: toastIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 360px;
    }
    .toast.success {
      background: var(--primary);
      color: #F7F3E9;
    }
    .toast.error {
      background: var(--accent);
      color: #F7F3E9;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(40px); }
    }

    /* 加载动画 */
    .btn-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(247, 243, 233, 0.3);
      border-top-color: #F7F3E9;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 左侧浮动元素 */
    .float-herb {
      position: absolute;
      font-family: 'Noto Serif SC', serif;
      font-size: 28px;
      opacity: 0.08;
      animation: floatHerb 12s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes floatHerb {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    /* 响应式 */
    @media (max-width: 1024px) {
      .deco-panel { display: none; }
    }
    @media (max-width: 640px) {
      .form-input { padding: 12px 14px 12px 40px; font-size: 14px; }
    }
  </style>
</head>
<body class="paper-texture">

  <!-- 统一导航栏 -->
  <div id="nav-mount"></div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="min-h-screen flex">
    <!-- 左侧装饰面板 -->
    <div class="deco-panel hidden lg:flex lg:w-5/12 xl:w-5/12 flex-col justify-center items-center px-12 relative">
      <!-- 浮动草药字符 -->
      <div class="float-herb" style="top:15%;left:15%;animation-delay:-2s;color:#C9A227;">参</div>
      <div class="float-herb" style="top:30%;right:20%;animation-delay:-5s;color:#3D7A64;">术</div>
      <div class="float-herb" style="bottom:25%;left:25%;animation-delay:-8s;color:#A67B4D;">苓</div>
      <div class="float-herb" style="bottom:15%;right:15%;animation-delay:-3s;color:#C95A5A;">归</div>
      <div class="float-herb" style="top:55%;left:10%;animation-delay:-10s;color:#C9A227;">芪</div>

      <!-- 浮动印章 -->
      <div class="seal" style="top:60px;left:30px;font-size:100px;color:rgba(184,58,58,0.06);">医</div>
      <div class="seal" style="bottom:40px;right:20px;font-size:80px;color:rgba(201,162,39,0.05);">草</div>

      <div class="relative z-10 text-center">
        <!-- 品牌 Logo -->
        <div class="mb-8 flex justify-center">
          <div class="w-20 h-20 rounded-2xl bg-tcm-gold/20 border border-tcm-gold/30 flex items-center justify-center backdrop-blur-sm">
            <span class="font-calligraphy text-4xl text-tcm-gold">本</span>
          </div>
        </div>

        <!-- 品牌名 -->
        <h1 class="font-calligraphy text-5xl xl:text-6xl text-white mb-4" style="letter-spacing:0.15em;text-shadow:0 4px 20px rgba(0,0,0,0.3);">
          本草灵枢
        </h1>

        <div class="deco-line mx-auto mb-6"></div>

        <p class="font-serif text-lg text-white/70 tracking-[0.2em] mb-8">
          让千年中医智慧，融入现代生活
        </p>

        <!-- 功能亮点 -->
        <div class="space-y-4 max-w-xs mx-auto">
          <div class="flex items-center gap-3 text-white/50 text-sm">
            <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center flex-shrink-0">
              <svg class="w-4 h-4 text-tcm-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <span>58 味药材 · 性味归经 · 关系图谱</span>
          </div>
          <div class="flex items-center gap-3 text-white/50 text-sm">
            <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center flex-shrink-0">
              <svg class="w-4 h-4 text-tcm-accentLight" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </div>
            <span>AI 智能问诊 · 症状辨证 · 方剂推荐</span>
          </div>
          <div class="flex items-center gap-3 text-white/50 text-sm">
            <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center flex-shrink-0">
              <svg class="w-4 h-4 text-tcm-primaryLight" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </div>
            <span>节气养生 · 体质调理 · 日常护理</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧表单区域 -->
    <div class="flex-1 flex flex-col justify-center items-center px-6 py-12 relative z-10">
      <div class="w-full max-w-md">
        <!-- 移动端 Logo -->
        <div class="lg:hidden text-center mb-8">
          <a href="index.html" class="inline-flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-tcm-primary flex items-center justify-center text-tcm-paper font-serif text-xl font-bold">本</div>
            <span class="font-calligraphy text-3xl text-tcm-primary tracking-widest">本草灵枢</span>
          </a>
        </div>

        <!-- 返回首页 -->
        <a href="index.html" class="inline-flex items-center gap-2 text-sm text-tcm-inkLight hover:text-tcm-primary transition-colors mb-8">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          返回首页
        </a>

        <!-- 标题 -->
        <div class="mb-8">
          <h2 class="font-serif text-2xl font-bold text-tcm-ink tracking-wide" id="formTitle">欢迎回来</h2>
          <p class="text-sm text-tcm-inkLight mt-2 tracking-wider" id="formSubtitle">登录您的账户，探索中医智慧</p>
        </div>

        <!-- 登录/注册 标签切换 -->
        <div class="flex border-b border-tcm-border mb-8">
          <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">登录</button>
          <button class="tab-btn" data-tab="register" onclick="switchTab('register')">注册</button>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="space-y-5">
            <!-- 用户名 -->
            <div>
              <div class="relative input-group">
                <input type="text" id="loginUsername" class="form-input" placeholder="用户名 / 邮箱" autocomplete="username">
                <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              </div>
              <div class="error-msg" id="loginUsernameError">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                <span></span>
              </div>
            </div>

            <!-- 密码 -->
            <div>
              <div class="relative input-group">
                <input type="password" id="loginPassword" class="form-input" placeholder="密码" autocomplete="current-password" style="padding-right:44px;">
                <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <span class="pwd-toggle" onclick="togglePassword('loginPassword', this)">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </span>
              </div>
              <div class="error-msg" id="loginPasswordError">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                <span></span>
              </div>
            </div>

            <!-- 记住我 + 忘记密码 -->
            <div class="flex items-center justify-between">
              <label class="flex items-center gap-2 cursor-pointer select-none" onclick="toggleRemember()">
                <div class="checkbox-custom" id="rememberCheck">
                  <svg class="w-3 h-3 text-white hidden" id="rememberIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <span class="text-sm text-tcm-inkLight">记住我</span>
              </label>
              <a href="#" class="text-sm text-tcm-primary hover:text-tcm-primaryDark transition-colors" onclick="showToast('请联系管理员重置密码','error');return false;">忘记密码？</a>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="btn-primary" id="loginBtn">
              <span id="loginBtnText">登 录</span>
            </button>
          </div>
        </form>

        <!-- 注册表单 -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
          <div class="space-y-5">
            <!-- 用户名 -->
            <div>
              <div class="relative input-group">
                <input type="text" id="regUsername" class="form-input" placeholder="用户名" autocomplete="username">
                <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              </div>
              <div class="error-msg" id="regUsernameError">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                <span></span>
              </div>
            </div>

            <!-- 邮箱 -->
            <div>
              <div class="relative input-group">
                <input type="email" id="regEmail" class="form-input" placeholder="邮箱地址" autocomplete="email">
                <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              </div>
              <div class="error-msg" id="regEmailError">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                <span></span>
              </div>
            </div>

            <!-- 密码 -->
            <div>
              <div class="relative input-group">
                <input type="password" id="regPassword" class="form-input" placeholder="设置密码（至少6位）" autocomplete="new-password" style="padding-right:44px;" oninput="checkPasswordStrength(this.value)">
                <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <span class="pwd-toggle" onclick="togglePassword('regPassword', this)">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </span>
              </div>
              <!-- 密码强度指示 -->
              <div class="flex gap-1.5 mt-2" id="strengthBar">
                <div class="h-1 flex-1 rounded-full bg-tcm-border/50 transition-colors duration-300" id="str1"></div>
                <div class="h-1 flex-1 rounded-full bg-tcm-border/50 transition-colors duration-300" id="str2"></div>
                <div class="h-1 flex-1 rounded-full bg-tcm-border/50 transition-colors duration-300" id="str3"></div>
              </div>
              <p class="text-xs text-tcm-inkLight mt-1" id="strengthText"></p>
              <div class="error-msg" id="regPasswordError">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                <span></span>
              </div>
            </div>

            <!-- 确认密码 -->
            <div>
              <div class="relative input-group">
                <input type="password" id="regConfirm" class="form-input" placeholder="确认密码" autocomplete="new-password" style="padding-right:44px;">
                <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                <span class="pwd-toggle" onclick="togglePassword('regConfirm', this)">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </span>
              </div>
              <div class="error-msg" id="regConfirmError">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                <span></span>
              </div>
            </div>

            <!-- 同意条款 -->
            <label class="flex items-start gap-2 cursor-pointer select-none" onclick="toggleAgree()">
              <div class="checkbox-custom mt-0.5" id="agreeCheck">
                <svg class="w-3 h-3 text-white hidden" id="agreeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
              </div>
              <span class="text-xs text-tcm-inkLight leading-relaxed">
                注册即表示您已阅读并同意
                <a href="#" class="text-tcm-primary hover:underline">用户协议</a>
                和
                <a href="#" class="text-tcm-primary hover:underline">隐私政策</a>
              </span>
            </label>

            <!-- 注册按钮 -->
            <button type="submit" class="btn-primary" id="registerBtn">
              <span id="registerBtnText">注 册</span>
            </button>
          </div>
        </form>

        <!-- 第三方登录 -->
        <div class="mt-8">
          <div class="divider-line mb-6">其他方式</div>
          <div class="flex justify-center gap-4">
            <button class="social-btn" title="微信登录" onclick="showToast('微信登录功能开发中','error')">
              <svg class="w-5 h-5 text-tcm-inkLight" viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.045c.134 0 .24-.111.24-.247 0-.06-.024-.12-.04-.178l-.325-1.233a.492.492 0 0 1 .177-.554C23.025 18.205 24 16.43 24 14.416c0-3.065-2.845-5.508-7.062-5.558zM14.51 13.17c.535 0 .969.44.969.983a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.543.434-.983.97-.983zm4.844 0c.535 0 .969.44.969.983a.976.976 0 0 1-.97.983.976.976 0 0 1-.968-.983c0-.543.434-.983.969-.983z"/></svg>
            </button>
            <button class="social-btn" title="QQ登录" onclick="showToast('QQ登录功能开发中','error')">
              <svg class="w-5 h-5 text-tcm-inkLight" viewBox="0 0 24 24" fill="currentColor"><path d="M12.003 2C6.756 2 3.002 5.987 3.002 10.421v.381c-.618 1.97-1.48 4.672-.902 5.792.344.667 1.532.402 2.205.162.249 1.398.846 2.576 1.765 3.371-1.06.448-2.14 1.194-2.043 1.947.08.629.99.926 2.38.926 1.588 0 2.744-.416 3.597-.852a8.678 8.678 0 0 0 2 .236c.69 0 1.357-.08 1.997-.236.853.436 2.01.852 3.597.852 1.39 0 2.3-.297 2.38-.926.097-.753-.984-1.5-2.043-1.947.919-.795 1.516-1.973 1.765-3.371.673.24 1.861.505 2.205-.162.578-1.12-.284-3.822-.902-5.792v-.38C20.998 5.986 17.247 2 12.003 2z"/></svg>
            </button>
            <button class="social-btn" title="手机号登录" onclick="showToast('手机号登录功能开发中','error')">
              <svg class="w-5 h-5 text-tcm-inkLight" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
            </button>
          </div>
        </div>

        <!-- 底部声明 -->
        <p class="text-center text-xs text-tcm-inkLight mt-8 leading-relaxed">
          本平台健康建议仅供参考，不能替代专业医生诊断与治疗
        </p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    // ===== 标签切换 =====
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('formTitle').textContent = tab === 'login' ? '欢迎回来' : '创建账户';
      document.getElementById('formSubtitle').textContent = tab === 'login' ? '登录您的账户，探索中医智慧' : '注册新账户，开启中医之旅';
      clearErrors();
    }

    // ===== 密码可见性切换 =====
    function togglePassword(inputId, toggleEl) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      toggleEl.innerHTML = isPassword
        ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>'
        : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>';
    }

    // ===== 复选框切换 =====
    let rememberMe = false;
    function toggleRemember() {
      rememberMe = !rememberMe;
      document.getElementById('rememberCheck').classList.toggle('checked', rememberMe);
      document.getElementById('rememberIcon').classList.toggle('hidden', !rememberMe);
    }

    let agreeTerms = false;
    function toggleAgree() {
      agreeTerms = !agreeTerms;
      document.getElementById('agreeCheck').classList.toggle('checked', agreeTerms);
      document.getElementById('agreeIcon').classList.toggle('hidden', !agreeTerms);
    }

    // ===== 密码强度检测 =====
    function checkPasswordStrength(pwd) {
      const bars = [document.getElementById('str1'), document.getElementById('str2'), document.getElementById('str3')];
      const text = document.getElementById('strengthText');
      let score = 0;
      if (pwd.length >= 6) score++;
      if (pwd.length >= 10 && /[A-Z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd) && /[^A-Za-z0-9]/.test(pwd)) score++;

      const colors = ['#B83A3A', '#C9A227', '#2D5A4A'];
      const labels = ['弱', '中等', '强'];
      bars.forEach((bar, i) => {
        bar.style.background = i < score ? colors[Math.min(score - 1, 2)] : 'rgba(216,206,179,0.5)';
      });
      text.textContent = pwd.length > 0 ? `密码强度：${labels[Math.min(score - 1, 2)] || '弱'}` : '';
      text.style.color = pwd.length > 0 ? colors[Math.min(score - 1, 2)] || colors[0] : '';
    }

    // ===== 错误处理 =====
    function showError(id, msg) {
      const el = document.getElementById(id);
      el.querySelector('span').textContent = msg;
      el.classList.add('show');
      const input = el.previousElementSibling?.querySelector?.('input') || el.parentElement.querySelector('input');
      if (input) input.classList.add('error');
    }

    function clearErrors() {
      document.querySelectorAll('.error-msg').forEach(el => {
        el.classList.remove('show');
        el.querySelector('span').textContent = '';
      });
      document.querySelectorAll('.form-input').forEach(input => input.classList.remove('error'));
    }

    // ===== Toast 通知 =====
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success'
        ? '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
        : '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
      toast.innerHTML = `${icon}<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'toastOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ===== 登录处理 =====
    function handleLogin(e) {
      e.preventDefault();
      clearErrors();

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      let valid = true;
      if (!username) { showError('loginUsernameError', '请输入用户名或邮箱'); valid = false; }
      if (!password) { showError('loginPasswordError', '请输入密码'); valid = false; }
      if (!valid) return;

      // 模拟加载
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      btn.disabled = true;
      btnText.innerHTML = '<div class="btn-spinner mx-auto"></div>';

      setTimeout(() => {
        const result = Auth.login(username, password, rememberMe);
        btn.disabled = false;
        btnText.textContent = '登 录';

        if (result.success) {
          showToast('登录成功，欢迎回来！');
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
          showToast(result.message, 'error');
          if (result.field === 'username') showError('loginUsernameError', result.message);
          else if (result.field === 'password') showError('loginPasswordError', result.message);
        }
      }, 1200);
    }

    // ===== 注册处理 =====
    function handleRegister(e) {
      e.preventDefault();
      clearErrors();

      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;

      let valid = true;
      if (!username || username.length < 2) { showError('regUsernameError', '用户名至少2个字符'); valid = false; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('regEmailError', '请输入有效的邮箱地址'); valid = false; }
      if (!password || password.length < 6) { showError('regPasswordError', '密码至少6位'); valid = false; }
      if (password !== confirm) { showError('regConfirmError', '两次输入的密码不一致'); valid = false; }
      if (!agreeTerms) { showToast('请先同意用户协议和隐私政策', 'error'); valid = false; }
      if (!valid) return;

      const btn = document.getElementById('registerBtn');
      const btnText = document.getElementById('registerBtnText');
      btn.disabled = true;
      btnText.innerHTML = '<div class="btn-spinner mx-auto"></div>';

      setTimeout(() => {
        const result = Auth.register(username, email, password);
        btn.disabled = false;
        btnText.textContent = '注 册';

        if (result.success) {
          showToast('注册成功！已自动登录');
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
          showToast(result.message, 'error');
          if (result.field === 'username') showError('regUsernameError', result.message);
          else if (result.field === 'email') showError('regEmailError', result.message);
        }
      }, 1200);
    }

    // 如果已登录则跳转首页
    if (Auth.isLoggedIn()) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
