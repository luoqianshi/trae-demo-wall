<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>药材百科 · 本草灵枢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tcm: {
              primary: '#2D5A4A',
              primaryLight: '#3D7A64',
              primaryDark: '#1F4035',
              secondary: '#8B5A2B',
              secondaryLight: '#A67B4D',
              accent: '#B83A3A',
              accentLight: '#C95A5A',
              paper: '#F1EBD8',
              paperDark: '#E5DEC3',
              ink: '#2C2622',
              inkLight: '#6B6259',
              card: '#1E2622',
              cardLight: '#2A3530',
              gold: '#C9A227',
              border: '#D8CEB3'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'STSong', 'SimSun', 'serif'],
            sans: ['"Noto Sans SC"', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            calligraphy: ['"Ma Shan Zheng"', 'cursive']
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --primary: #2D5A4A;
      --secondary: #8B5A2B;
      --accent: #B83A3A;
      --paper: #F1EBD8;
      --ink: #2C2622;
      --card: #1E2622;
      --gold: #C9A227;
      --border: #D8CEB3;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
    }

    /* 宣纸纹理 */
    .paper-texture::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(201, 162, 39, 0.05) 0%, transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(139, 90, 43, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(45, 90, 74, 0.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* 导航栏 */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(241, 235, 216, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(45, 90, 74, 0.1);
    }

    /* 搜索框 */
    .search-input {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 74, 0.12);
      background: rgba(255, 255, 255, 0.9);
    }

    /* 筛选标签 */
    .filter-tag {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--inkLight);
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.4);
    }
    .filter-tag:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .filter-tag.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* 药材卡片 */
    .herb-card {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }
    .herb-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: var(--card-color, var(--primary));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .herb-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(45, 90, 74, 0.15);
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.8);
    }
    .herb-card:hover::before {
      opacity: 1;
    }

    /* 药性徽章 */
    .nature-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .nature-cold { background: #E0F0F5; color: #3A6B8C; }
    .nature-cool { background: #E5F0E8; color: #3D7A64; }
    .nature-neutral { background: #F0EDE0; color: #8B7D5A; }
    .nature-warm { background: #F5E8E0; color: #B85A2B; }
    .nature-hot { background: #F5E0E0; color: #B83A3A; }

    /* 归经标签 */
    .meridian-tag {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      background: rgba(45, 90, 74, 0.08);
      color: var(--primary);
      border-radius: 4px;
      margin-right: 4px;
      margin-bottom: 4px;
    }

    /* 模态框 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(30, 38, 34, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: var(--paper);
      border-radius: 12px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.95);
      transition: transform 0.3s ease;
      box-shadow: 0 24px 80px rgba(30, 38, 34, 0.3);
    }
    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    /* 模态框滚动条 */
    .modal-content::-webkit-scrollbar { width: 6px; }
    .modal-content::-webkit-scrollbar-track { background: transparent; }
    .modal-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* 详情字段 */
    .detail-section {
      margin-bottom: 20px;
    }
    .detail-label {
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.15em;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .detail-value {
      font-size: 15px;
      color: var(--ink);
      line-height: 1.7;
    }

    /* 关系图谱容器 */
    #relationGraph {
      width: 100%;
      height: 360px;
      border-radius: 8px;
      background: rgba(30, 38, 34, 0.03);
    }

    /* 关系药材按钮 */
    .related-herb-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.5);
      margin: 0 8px 8px 0;
    }
    .related-herb-btn:hover {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      transform: translateY(-2px);
    }
    .related-herb-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--inkLight);
    }

    /* 加载动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.4s ease forwards;
    }

    /* 响应式 */
    @media (max-width: 640px) {
      .modal-content { border-radius: 8px; }
      #relationGraph { height: 280px; }
    }
  </style>
</head>
<body class="paper-texture">

  <!-- 统一导航栏 -->
  <div id="nav-mount"></div>

  <!-- 页面标题 -->
  <section class="py-12 md:py-16 px-6 text-center relative z-10">
    <p class="text-tcm-accent text-sm tracking-[0.3em] mb-3">HERBAL ENCYCLOPEDIA</p>
    <h1 class="font-calligraphy text-4xl md:text-6xl text-tcm-primaryDark mb-4">药材百科</h1>
    <p class="text-tcm-inkLight tracking-[0.1em] text-sm md:text-base">识本草之性味，明配伍之妙用</p>
    <div class="w-20 h-1 bg-gradient-to-r from-tcm-primary via-tcm-secondary to-tcm-accent mx-auto mt-6 rounded-full"></div>
  </section>

  <!-- 搜索与筛选 -->
  <section class="px-6 mb-8 relative z-10">
    <div class="max-w-6xl mx-auto">
      <!-- 搜索框 -->
      <div class="relative mb-6">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-tcm-inkLight" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input w-full pl-12 pr-4 py-3 rounded-lg text-sm"
          placeholder="搜索药材名称、功效、归经..."
        >
      </div>

      <!-- 分类筛选 -->
      <div class="flex flex-wrap gap-2" id="categoryFilters"></div>
    </div>
  </section>

  <!-- 药材列表 -->
  <section class="px-6 pb-20 relative z-10">
    <div class="max-w-6xl mx-auto">
      <!-- 结果统计 -->
      <div class="flex items-center justify-between mb-6">
        <p class="text-sm text-tcm-inkLight">
          共找到 <span id="resultCount" class="text-tcm-primary font-bold">0</span> 味药材
        </p>
      </div>

      <!-- 药材网格 -->
      <div id="herbGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- 动态生成 -->
      </div>

      <!-- 空状态 -->
      <div id="emptyState" class="empty-state hidden">
        <div class="text-6xl mb-4 opacity-20">草</div>
        <p class="text-lg mb-2">未找到相关药材</p>
        <p class="text-sm">试试其他关键词或分类</p>
      </div>
    </div>
  </section>

  <!-- 详情模态框 -->
  <div class="modal-overlay" id="herbModal">
    <div class="modal-content">
      <!-- 关闭按钮 -->
      <button onclick="closeModal()" class="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center transition-colors">
        <svg class="w-5 h-5 text-tcm-ink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <div class="p-6 md:p-10" id="modalBody">
        <!-- 动态生成 -->
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="py-8 px-6 border-t border-tcm-border relative z-10">
    <div class="max-w-6xl mx-auto text-center">
      <p class="text-tcm-inkLight text-xs">
        © 2026 本草灵枢 · 智慧中医平台 · 本平台健康建议仅供参考.平台由HWB开发
      </p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/herbs-data.js"></script>
  <script>
    // ===== 状态管理 =====
    let currentCategory = '';
    let currentKeyword = '';

    // ===== 工具函数 =====
    function getNatureClass(nature) {
      const map = {
        '寒': 'nature-cold', '凉': 'nature-cool', '微寒': 'nature-cool',
        '平': 'nature-neutral',
        '温': 'nature-warm', '微温': 'nature-warm', '热': 'nature-hot'
      };
      return map[nature] || 'nature-neutral';
    }

    function getHerbById(id) {
      return HERBS_DATA.find(h => h.id === id);
    }

    // ===== 渲染分类筛选 =====
    function renderCategories() {
      const container = document.getElementById('categoryFilters');
      container.innerHTML = HERB_CATEGORIES.map(cat => 
        `<span class="filter-tag ${cat.value === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat.value}')">${cat.name}</span>`
      ).join('');
    }

    function selectCategory(value) {
      currentCategory = value;
      renderCategories();
      renderHerbs();
    }

    // ===== 渲染药材列表 =====
    function renderHerbs() {
      const grid = document.getElementById('herbGrid');
      const emptyState = document.getElementById('emptyState');
      
      let filtered = HERBS_DATA;

      // 分类筛选
      if (currentCategory) {
        filtered = filtered.filter(h => h.category === currentCategory);
      }

      // 关键词搜索
      if (currentKeyword) {
        const kw = currentKeyword.toLowerCase();
        filtered = filtered.filter(h =>
          h.name.toLowerCase().includes(kw) ||
          h.alias.toLowerCase().includes(kw) ||
          h.efficacy.toLowerCase().includes(kw) ||
          h.meridian.join('').toLowerCase().includes(kw) ||
          h.category.toLowerCase().includes(kw)
        );
      }

      // 更新计数
      document.getElementById('resultCount').textContent = filtered.length;

      // 空状态
      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      // 渲染卡片
      grid.innerHTML = filtered.map((herb, i) => `
        <div class="herb-card fade-in" style="--card-color: ${herb.imageColor}; animation-delay: ${i * 0.03}s" onclick="showHerbDetail(${herb.id})">
          <div class="flex items-start justify-between mb-3">
            <div>
              <h3 class="font-serif text-xl font-bold text-tcm-ink mb-1">${herb.name}</h3>
              <p class="text-xs text-tcm-inkLight">${herb.alias}</p>
            </div>
            <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: ${herb.imageColor}20">
              <span class="font-serif text-lg font-bold" style="color: ${herb.imageColor}">${herb.name.charAt(0)}</span>
            </div>
          </div>
          <div class="flex gap-2 mb-3">
            <span class="nature-badge ${getNatureClass(herb.nature)}">${herb.nature}</span>
            <span class="nature-badge nature-neutral">${herb.flavor.join(' · ')}</span>
          </div>
          <p class="text-sm text-tcm-inkLight leading-relaxed line-clamp-2 mb-3">${herb.efficacy}</p>
          <div>
            ${herb.meridian.map(m => `<span class="meridian-tag">${m}</span>`).join('')}
          </div>
          <div class="mt-3 pt-3 border-t border-tcm-border/50 flex items-center justify-between">
            <span class="text-xs text-tcm-gold font-medium">${herb.category}</span>
            <span class="text-xs text-tcm-primary flex items-center gap-1">
              查看详情
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
            </span>
          </div>
        </div>
      `).join('');
    }

    // ===== 搜索 =====
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentKeyword = e.target.value.trim();
      renderHerbs();
    });

    // ===== 详情模态框 =====
    function showHerbDetail(id) {
      const herb = getHerbById(id);
      if (!herb) return;

      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = `
        <!-- 顶部信息 -->
        <div class="flex items-start gap-5 mb-8 pb-6 border-b border-tcm-border">
          <div class="w-16 h-16 rounded-xl flex items-center justify-center flex-shrink-0" style="background: ${herb.imageColor}20">
            <span class="font-serif text-2xl font-bold" style="color: ${herb.imageColor}">${herb.name.charAt(0)}</span>
          </div>
          <div class="flex-1">
            <h2 class="font-calligraphy text-3xl text-tcm-primaryDark mb-1">${herb.name}</h2>
            <p class="text-sm text-tcm-inkLight mb-2">${herb.alias}</p>
            <div class="flex flex-wrap gap-2">
              <span class="nature-badge ${getNatureClass(herb.nature)}">性${herb.nature}</span>
              <span class="nature-badge nature-neutral">味${herb.flavor.join(' · ')}</span>
              <span class="nature-badge" style="background: ${herb.imageColor}15; color: ${herb.imageColor}">${herb.category}</span>
            </div>
          </div>
        </div>

        <!-- 两栏布局 -->
        <div class="grid md:grid-cols-2 gap-8">
          <!-- 左侧：详细信息 -->
          <div>
            <div class="detail-section">
              <div class="detail-label">归经</div>
              <div class="detail-value">
                ${herb.meridian.map(m => `<span class="meridian-tag">${m}经</span>`).join('')}
              </div>
            </div>
            <div class="detail-section">
              <div class="detail-label">功效</div>
              <div class="detail-value">${herb.efficacy}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">主治</div>
              <div class="detail-value">${herb.indication}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">用法用量</div>
              <div class="detail-value font-medium">${herb.usage}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">使用禁忌</div>
              <div class="detail-value text-tcm-accent">${herb.contraindication}</div>
            </div>
          </div>

          <!-- 右侧：关系图谱 -->
          <div>
            <div class="detail-label mb-3">药材关系图谱</div>
            <div id="relationGraph"></div>
            <p class="text-xs text-tcm-inkLight mt-2 leading-relaxed">
              点击图谱中的药材节点可跳转查看详情，了解药材间的配伍与功效关联。
            </p>

            <!-- 关联药材列表 -->
            <div class="mt-5">
              <div class="detail-label mb-3">关联药材</div>
              <div id="relatedHerbs">
                ${herb.relations.map(rid => {
                  const r = getHerbById(rid);
                  return r ? `<span class="related-herb-btn" onclick="showHerbDetail(${r.id})">
                    <span class="related-herb-dot" style="background: ${r.imageColor}"></span>
                    ${r.name}
                  </span>` : '';
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      // 显示模态框
      document.getElementById('herbModal').classList.add('active');
      document.body.style.overflow = 'hidden';

      // 渲染关系图谱
      setTimeout(() => renderRelationGraph(herb), 200);
    }

    function closeModal() {
      document.getElementById('herbModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // 点击遮罩关闭
    document.getElementById('herbModal').addEventListener('click', (e) => {
      if (e.target.id === 'herbModal') closeModal();
    });

    // ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // ===== 关系图谱（ECharts 力导向图） =====
    let chartInstance = null;

    function renderRelationGraph(herb) {
      const container = document.getElementById('relationGraph');
      if (!container) return;

      if (chartInstance) {
        chartInstance.dispose();
        chartInstance = null;
      }

      chartInstance = echarts.init(container);

      // 构建节点与边
      const nodes = [];
      const links = [];
      const categories = [
        { name: '当前药材', itemStyle: { color: herb.imageColor } },
        { name: '关联药材', itemStyle: { color: '#3D7A64' } }
      ];

      // 中心节点
      nodes.push({
        name: herb.name,
        value: herb.id,
        category: 0,
        symbolSize: 55,
        label: { show: true, fontSize: 16, fontWeight: 'bold', color: '#fff' },
        itemStyle: { color: herb.imageColor }
      });

      // 关联节点
      herb.relations.forEach(rid => {
        const r = getHerbById(rid);
        if (!r) return;

        nodes.push({
          name: r.name,
          value: r.id,
          category: 1,
          symbolSize: 38,
          label: { show: true, fontSize: 13, color: '#2C2622' },
          itemStyle: { color: r.imageColor + 'CC', borderColor: r.imageColor, borderWidth: 2 }
        });

        links.push({
          source: herb.name,
          target: r.name,
          lineStyle: { color: '#D8CEB3', width: 1.5, curveness: 0.1 }
        });
      });

      const option = {
        tooltip: {
          formatter: (params) => {
            if (params.dataType === 'node') {
              const h = getHerbById(params.data.value);
              return h ? `<b>${h.name}</b><br/>${h.efficacy.substring(0, 30)}...` : params.data.name;
            }
            return '';
          }
        },
        series: [{
          type: 'graph',
          layout: 'force',
          roam: true,
          draggable: true,
          categories: categories,
          data: nodes,
          links: links,
          force: {
            repulsion: 300,
            edgeLength: 120,
            gravity: 0.1
          },
          emphasis: {
            focus: 'adjacency',
            lineStyle: { width: 3, color: '#B83A3A' },
            itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' }
          },
          lineStyle: { color: '#D8CEB3', width: 1.5, curveness: 0.1 }
        }]
      };

      chartInstance.setOption(option);

      // 点击节点跳转
      chartInstance.on('click', (params) => {
        if (params.dataType === 'node' && params.data.value !== herb.id) {
          showHerbDetail(params.data.value);
        }
      });

      // 自适应
      window.addEventListener('resize', () => {
        chartInstance && chartInstance.resize();
      });
    }

    // ===== 初始化 =====
    renderCategories();
    renderHerbs();
  </script>
</body>
</html>
