<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全局药材图谱 · 本草灵枢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tcm: {
              primary: '#2D5A4A', primaryLight: '#3D7A64', primaryDark: '#1F4035',
              secondary: '#8B5A2B', secondaryLight: '#A67B4D',
              accent: '#B83A3A', accentLight: '#C95A5A',
              paper: '#F1EBD8', paperDark: '#E5DEC3',
              ink: '#2C2622', inkLight: '#6B6259',
              card: '#1E2622', cardLight: '#2A3530',
              gold: '#C9A227', border: '#D8CEB3'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            sans: ['"Noto Sans SC"', 'sans-serif'],
            calligraphy: ['"Ma Shan Zheng"', 'cursive']
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --primary: #2D5A4A;
      --accent: #B83A3A;
      --paper: #F1EBD8;
      --ink: #2C2622;
      --card: #1E2622;
      --gold: #C9A227;
      --border: #D8CEB3;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
    }

    /* 导航栏 */
    .nav-bar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(241, 235, 216, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(45, 90, 74, 0.1);
    }

    /* 图谱容器 */
    #mainGraph {
      width: 100%;
      height: 75vh;
      min-height: 500px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1E2622 0%, #2A3530 100%);
      box-shadow: 0 20px 60px rgba(30, 38, 34, 0.3);
    }

    /* 控制面板 */
    .control-panel {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }

    /* 搜索框 */
    .search-input {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 74, 0.12);
      background: rgba(255, 255, 255, 0.95);
    }

    /* 分类标签 */
    .cat-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; border-radius: 20px;
      font-size: 12px; cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.4);
      color: var(--inkLight);
      white-space: nowrap;
    }
    .cat-tag:hover { border-color: var(--primary); color: var(--primary); }
    .cat-tag.active { color: #fff; border-color: transparent; }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* 统计卡片 */
    .stat-card {
      background: var(--card);
      color: #F7F3E9;
      border-radius: 8px;
      padding: 16px 20px;
      text-align: center;
    }
    .stat-num {
      font-family: 'Noto Serif SC', serif;
      font-size: 32px; font-weight: 700;
      color: var(--gold);
    }
    .stat-label { font-size: 11px; color: rgba(247, 243, 233, 0.6); letter-spacing: 0.15em; }

    /* 详情面板 */
    .detail-panel {
      position: fixed; top: 0; right: -420px;
      width: 400px; height: 100vh;
      background: var(--paper);
      box-shadow: -8px 0 32px rgba(30, 38, 34, 0.2);
      z-index: 100;
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }
    .detail-panel.active { right: 0; }
    .detail-panel::-webkit-scrollbar { width: 5px; }
    .detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* 详情字段 */
    .detail-label { font-size: 11px; color: var(--accent); letter-spacing: 0.15em; margin-bottom: 4px; font-weight: 500; }
    .detail-value { font-size: 14px; color: var(--ink); line-height: 1.6; }

    /* 药性徽章 */
    .nature-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; }
    .nature-cold { background: #E0F0F5; color: #3A6B8C; }
    .nature-cool { background: #E5F0E8; color: #3D7A64; }
    .nature-neutral { background: #F0EDE0; color: #8B7D5A; }
    .nature-warm { background: #F5E8E0; color: #B85A2B; }
    .nature-hot { background: #F5E0E0; color: #B83A3A; }

    .meridian-tag {
      display: inline-block; padding: 2px 8px; font-size: 11px;
      background: rgba(45, 90, 74, 0.08); color: var(--primary);
      border-radius: 4px; margin-right: 4px; margin-bottom: 4px;
    }

    .related-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; cursor: pointer;
      transition: all 0.3s ease; background: rgba(255, 255, 255, 0.5);
      margin: 0 6px 6px 0; color: var(--ink);
    }
    .related-btn:hover { border-color: var(--primary); background: var(--primary); color: #fff; }
    .related-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* 遮罩 */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30, 38, 34, 0.3); z-index: 99;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .overlay.active { opacity: 1; visibility: visible; }

    @media (max-width: 768px) {
      .detail-panel { width: 100%; right: -100%; }
      #mainGraph { height: 60vh; }
    }
  </style>
</head>
<body>

  <!-- 统一导航栏 -->
  <div id="nav-mount"></div>

  <!-- 标题区 -->
  <section class="py-8 md:py-12 px-6 text-center">
    <p class="text-tcm-accent text-xs tracking-[0.3em] mb-2">GLOBAL HERB RELATION GRAPH</p>
    <h1 class="font-calligraphy text-3xl md:text-5xl text-tcm-primaryDark mb-3">全局药材关系图谱</h1>
    <p class="text-tcm-inkLight tracking-[0.1em] text-sm md:text-base">纵览本草经纬，洞察配伍玄机</p>
    <div class="w-20 h-1 bg-gradient-to-r from-tcm-primary via-tcm-secondary to-tcm-accent mx-auto mt-5 rounded-full"></div>
  </section>

  <!-- 统计栏 -->
  <section class="px-6 mb-6">
    <div class="max-w-7xl mx-auto grid grid-cols-3 gap-4">
      <div class="stat-card">
        <div class="stat-num" id="herbCount">0</div>
        <div class="stat-label">药材总数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="edgeCount">0</div>
        <div class="stat-label">关联连线</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="catCount">0</div>
        <div class="stat-label">药材分类</div>
      </div>
    </div>
  </section>

  <!-- 控制面板 -->
  <section class="px-6 mb-4">
    <div class="max-w-7xl mx-auto">
      <div class="control-panel">
        <!-- 搜索 -->
        <div class="flex flex-col md:flex-row gap-4 mb-4">
          <div class="relative flex-1">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-tcm-inkLight" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="text" id="searchInput" class="search-input w-full pl-10 pr-4 py-2 rounded-lg text-sm" placeholder="搜索药材名称...">
          </div>
          <button onclick="resetGraph()" class="px-4 py-2 rounded-lg bg-tcm-primary text-white text-sm font-medium hover:bg-tcm-primaryDark transition-colors whitespace-nowrap">
            重置图谱
          </button>
        </div>
        <!-- 分类筛选 -->
        <div class="flex flex-wrap gap-2" id="categoryTags"></div>
      </div>
    </div>
  </section>

  <!-- 图谱 -->
  <section class="px-6 pb-20">
    <div class="max-w-7xl mx-auto">
      <div id="mainGraph"></div>
      <p class="text-center text-tcm-inkLight text-xs mt-4">
        滚轮缩放 · 拖拽移动 · 点击节点查看详情 · 双击节点聚焦关联
      </p>
    </div>
  </section>

  <!-- 遮罩 -->
  <div class="overlay" id="overlay" onclick="closeDetailPanel()"></div>

  <!-- 详情面板 -->
  <div class="detail-panel" id="detailPanel">
    <div class="p-6" id="panelContent"></div>
  </div>

  <!-- 页脚 -->
  <footer class="py-8 px-6 border-t border-tcm-border">
    <div class="max-w-7xl mx-auto text-center">
      <p class="text-tcm-inkLight text-xs">© 2026 本草灵枢 · 智慧中医平台 · 本平台健康建议仅供参考 HWB开发</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/herbs-data.js"></script>
  <script>
    let chart = null;
    let activeCategories = new Set();
    let allCategories = [];

    // 工具函数
    function getHerbById(id) { return HERBS_DATA.find(h => h.id === id); }

    function getNatureClass(nature) {
      const map = { '寒': 'nature-cold', '凉': 'nature-cool', '微寒': 'nature-cool', '平': 'nature-neutral', '温': 'nature-warm', '微温': 'nature-warm', '热': 'nature-hot' };
      return map[nature] || 'nature-neutral';
    }

    // 初始化分类
    function initCategories() {
      allCategories = [...new Set(HERBS_DATA.map(h => h.category))];
      activeCategories = new Set(allCategories);

      const container = document.getElementById('categoryTags');
      container.innerHTML = allCategories.map(cat => {
        const color = CATEGORY_COLORS[cat] || '#888';
        return `<span class="cat-tag active" style="background: ${color}" onclick="toggleCategory('${cat}')">
          <span class="cat-dot" style="background: ${color}; box-shadow: 0 0 0 2px rgba(255,255,255,0.3)"></span>
          ${cat}
        </span>`;
      }).join('');
    }

    function toggleCategory(cat) {
      if (activeCategories.has(cat)) {
        activeCategories.delete(cat);
      } else {
        activeCategories.add(cat);
      }
      updateCategoryTags();
      renderGraph();
    }

    function updateCategoryTags() {
      const tags = document.querySelectorAll('.cat-tag');
      tags.forEach(tag => {
        const cat = tag.textContent.trim();
        const color = CATEGORY_COLORS[cat] || '#888';
        if (activeCategories.has(cat)) {
          tag.classList.add('active');
          tag.style.background = color;
          tag.style.color = '#fff';
        } else {
          tag.classList.remove('active');
          tag.style.background = 'rgba(255,255,255,0.4)';
          tag.style.color = 'var(--inkLight)';
        }
      });
    }

    // 构建图谱数据
    function buildGraphData(searchKeyword) {
      const nodes = [];
      const links = [];
      const nodeIds = new Set();

      // 过滤可见节点
      const visibleHerbs = HERBS_DATA.filter(h => activeCategories.has(h.category));

      visibleHerbs.forEach(herb => {
        // 搜索过滤
        if (searchKeyword && !herb.name.includes(searchKeyword) && !herb.alias.includes(searchKeyword)) {
          return;
        }
        nodeIds.add(herb.id);
      });

      // 构建节点
      nodeIds.forEach(id => {
        const herb = getHerbById(id);
        // 计算连接数
        const degree = herb.relations.filter(r => nodeIds.has(r)).length;
        nodes.push({
          id: String(herb.id),
          name: herb.name,
          symbolSize: 20 + degree * 4,
          category: herb.category,
          itemStyle: { color: CATEGORY_COLORS[herb.category] || '#888' },
          label: {
            show: true,
            position: 'right',
            fontSize: 12,
            color: '#E8E2D6',
            formatter: herb.name
          },
          value: herb.id,
          degree: degree
        });
      });

      // 构建边
      const edgeSet = new Set();
      nodeIds.forEach(id => {
        const herb = getHerbById(id);
        herb.relations.forEach(rid => {
          if (nodeIds.has(rid)) {
            const key = id < rid ? `${id}-${rid}` : `${rid}-${id}`;
            if (!edgeSet.has(key)) {
              edgeSet.add(key);
              links.push({
                source: String(id),
                target: String(rid),
                lineStyle: { color: 'rgba(216, 206, 179, 0.15)', width: 1, curveness: 0.1 }
              });
            }
          }
        });
      });

      return { nodes, links };
    }

    // 渲染图谱
    function renderGraph() {
      const keyword = document.getElementById('searchInput').value.trim();
      const { nodes, links } = buildGraphData(keyword);

      // 更新统计
      document.getElementById('herbCount').textContent = nodes.length;
      document.getElementById('edgeCount').textContent = links.length;
      document.getElementById('catCount').textContent = allCategories.length;

      if (!chart) {
        chart = echarts.init(document.getElementById('mainGraph'));
      }

      // ECharts 分类配置
      const categories = allCategories.map(cat => ({
        name: cat,
        itemStyle: { color: CATEGORY_COLORS[cat] || '#888' }
      }));

      const option = {
        backgroundColor: 'transparent',
        tooltip: {
          formatter: (params) => {
            if (params.dataType === 'node') {
              const h = getHerbById(params.data.value);
              if (!h) return params.data.name;
              return `<div style="font-size:14px;font-weight:bold;color:${CATEGORY_COLORS[h.category]};margin-bottom:4px">${h.name}</div>
                <div style="font-size:11px;color:#999">${h.category} · 性${h.nature} · 味${h.flavor.join('')}</div>
                <div style="font-size:12px;color:#ccc;margin-top:4px;max-width:250px">${h.efficacy.substring(0, 40)}...</div>
                <div style="font-size:11px;color:${'#C9A227'};margin-top:4px">关联: ${h.relations.length} 味药材</div>`;
            }
            return '';
          },
          backgroundColor: 'rgba(30, 38, 34, 0.95)',
          borderColor: 'rgba(201, 162, 39, 0.3)',
          borderWidth: 1,
          padding: [10, 14],
          textStyle: { color: '#E8E2D6' }
        },
        series: [{
          type: 'graph',
          layout: 'force',
          roam: true,
          draggable: true,
          categories: categories,
          data: nodes,
          links: links,
          force: {
            repulsion: 220,
            edgeLength: [60, 120],
            gravity: 0.08,
            layoutAnimation: true
          },
          emphasis: {
            focus: 'adjacency',
            lineStyle: { width: 2.5, color: 'rgba(201, 162, 39, 0.6)' },
            label: { fontSize: 16, fontWeight: 'bold' }
          },
          lineStyle: { color: 'rgba(216, 206, 179, 0.12)', width: 1, curveness: 0.1 },
          animationDuration: 1200,
          animationEasingUpdate: 'cubicOut'
        }]
      };

      chart.setOption(option, true);
    }

    // 搜索
    document.getElementById('searchInput').addEventListener('input', () => {
      renderGraph();
    });

    // 重置
    function resetGraph() {
      document.getElementById('searchInput').value = '';
      activeCategories = new Set(allCategories);
      updateCategoryTags();
      renderGraph();
    }

    // 节点点击 → 详情面板
    chart && chart.on('click', (params) => {
      if (params.dataType === 'node') {
        showDetailPanel(params.data.value);
      }
    });

    function showDetailPanel(id) {
      const herb = getHerbById(id);
      if (!herb) return;

      const panel = document.getElementById('detailPanel');
      const overlay = document.getElementById('overlay');
      const content = document.getElementById('panelContent');

      const relatedHerbs = herb.relations.map(rid => getHerbById(rid)).filter(Boolean);

      content.innerHTML = `
        <div class="flex items-start justify-between mb-6">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-xl flex items-center justify-center flex-shrink-0" style="background: ${herb.imageColor}20">
              <span class="font-serif text-2xl font-bold" style="color: ${herb.imageColor}">${herb.name.charAt(0)}</span>
            </div>
            <div>
              <h2 class="font-calligraphy text-2xl text-tcm-primaryDark">${herb.name}</h2>
              <p class="text-xs text-tcm-inkLight mt-1">${herb.alias}</p>
            </div>
          </div>
          <button onclick="closeDetailPanel()" class="w-8 h-8 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>

        <div class="flex flex-wrap gap-2 mb-5">
          <span class="nature-badge ${getNatureClass(herb.nature)}">性${herb.nature}</span>
          <span class="nature-badge nature-neutral">味${herb.flavor.join(' · ')}</span>
          <span class="nature-badge" style="background: ${herb.imageColor}15; color: ${herb.imageColor}">${herb.category}</span>
        </div>

        <div class="mb-5">
          <div class="detail-label">归经</div>
          <div>${herb.meridian.map(m => `<span class="meridian-tag">${m}经</span>`).join('')}</div>
        </div>
        <div class="mb-5">
          <div class="detail-label">功效</div>
          <div class="detail-value">${herb.efficacy}</div>
        </div>
        <div class="mb-5">
          <div class="detail-label">主治</div>
          <div class="detail-value">${herb.indication}</div>
        </div>
        <div class="mb-5">
          <div class="detail-label">用法用量</div>
          <div class="detail-value font-medium">${herb.usage}</div>
        </div>
        <div class="mb-5">
          <div class="detail-label">使用禁忌</div>
          <div class="detail-value text-tcm-accent">${herb.contraindication}</div>
        </div>

        <div class="mt-6 pt-5 border-t border-tcm-border">
          <div class="detail-label mb-3">关联药材（${relatedHerbs.length} 味）</div>
          <div>
            ${relatedHerbs.map(r => `
              <span class="related-btn" onclick="showDetailPanel(${r.id})">
                <span class="related-dot" style="background: ${r.imageColor}"></span>
                ${r.name}
                <span class="text-tcm-inkLight text-xs ml-1">${r.category}</span>
              </span>
            `).join('')}
          </div>
        </div>

        <a href="herbs.html" class="block mt-6 text-center text-sm text-tcm-primary hover:underline">
          前往药材百科查看更多 →
        </a>
      `;

      panel.classList.add('active');
      overlay.classList.add('active');
    }

    function closeDetailPanel() {
      document.getElementById('detailPanel').classList.remove('active');
      document.getElementById('overlay').classList.remove('active');
    }

    // ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetailPanel();
    });

    // 初始化
    initCategories();
    renderGraph();

    // 图谱点击事件
    setTimeout(() => {
      chart.on('click', (params) => {
        if (params.dataType === 'node') {
          showDetailPanel(params.data.value);
        }
      });
    }, 500);

    // 自适应
    window.addEventListener('resize', () => {
      chart && chart.resize();
    });
  </script>
</body>
</html>
