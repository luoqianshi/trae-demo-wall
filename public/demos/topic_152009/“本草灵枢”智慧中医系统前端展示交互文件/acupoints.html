<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>针灸穴位 · 本草灵枢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tcm: {
              primary: '#2D5A4A',
              primaryLight: '#3D7A64',
              primaryDark: '#1F4035',
              secondary: '#8B5A2B',
              secondaryLight: '#A67B4D',
              accent: '#B83A3A',
              accentLight: '#C95A5A',
              paper: '#F1EBD8',
              paperDark: '#E5DEC3',
              ink: '#2C2622',
              inkLight: '#6B6259',
              card: '#1E2622',
              cardLight: '#2A3530',
              gold: '#C9A227',
              border: '#D8CEB3'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'STSong', 'SimSun', 'serif'],
            sans: ['"Noto Sans SC"', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            calligraphy: ['"Ma Shan Zheng"', 'cursive']
          }
        }
      }
    }
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --primary: #2D5A4A;
      --secondary: #8B5A2B;
      --accent: #B83A3A;
      --paper: #F1EBD8;
      --ink: #2C2622;
      --card: #1E2622;
      --gold: #C9A227;
      --border: #D8CEB3;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
    }

    /* 宣纸纹理 */
    .paper-texture::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(201, 162, 39, 0.05) 0%, transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(139, 90, 43, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(45, 90, 74, 0.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* 导航栏 */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(241, 235, 216, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(45, 90, 74, 0.1);
    }

    /* 搜索框 */
    .search-input {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 74, 0.12);
      background: rgba(255, 255, 255, 0.9);
    }

    /* 经络按钮 */
    .meridian-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 22px;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.55);
    }
    .meridian-btn:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.9);
    }
    .meridian-btn.active {
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
    .meridian-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .meridian-count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.06);
      margin-left: 2px;
    }
    .meridian-btn.active .meridian-count {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    /* 部位筛选标签 */
    .filter-tag {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--inkLight);
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.4);
    }
    .filter-tag:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .filter-tag.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* 经络循行描述面板 */
    .meridian-desc-panel {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.4));
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 18px 22px;
      animation: fadeIn 0.4s ease forwards;
    }

    /* 穴位卡片 */
    .acupoint-card {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }
    .acupoint-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: var(--card-color, var(--primary));
      transition: width 0.3s ease;
    }
    .acupoint-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(45, 90, 74, 0.15);
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.85);
    }
    .acupoint-card:hover::before {
      width: 6px;
    }

    /* 经络标签（卡片内） */
    .meridian-tag {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.05);
    }

    /* 模态框 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(30, 38, 34, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      position: relative;
      background: var(--paper);
      border-radius: 12px;
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.95);
      transition: transform 0.3s ease;
      box-shadow: 0 24px 80px rgba(30, 38, 34, 0.3);
    }
    .modal-overlay.active .modal-content {
      transform: scale(1);
    }
    .modal-content::-webkit-scrollbar { width: 6px; }
    .modal-content::-webkit-scrollbar-track { background: transparent; }
    .modal-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* 详情字段 */
    .detail-section { margin-bottom: 20px; }
    .detail-label {
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.15em;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .detail-value {
      font-size: 15px;
      color: var(--ink);
      line-height: 1.7;
    }

    /* 关闭按钮 */
    .modal-close {
      position: absolute;
      top: 14px; right: 14px;
      z-index: 10;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.25s ease;
    }
    .modal-close:hover { background: rgba(0, 0, 0, 0.12); }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--inkLight);
    }

    /* 加载动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease forwards; }

    /* 行截断 */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 响应式 */
    @media (max-width: 640px) {
      .modal-content { border-radius: 8px; }
    }

    /* ===== 3D 人体模型 ===== */
    .body3d-wrap {
      position: relative; width: 100%; height: 560px;
      background: radial-gradient(ellipse at center, rgba(45,90,74,0.04) 0%, transparent 70%);
      border-radius: 16px; overflow: hidden;
    }
    #body3dCanvas { width: 100%; height: 100%; display: block; cursor: grab; }
    #body3dCanvas:active { cursor: grabbing; }
    .body3d-loader {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .body3d-controls {
      position: absolute; top: 16px; left: 16px;
      display: flex; flex-direction: column; gap: 8px; z-index: 5;
    }
    .body3d-btn {
      background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 14px; font-size: 12px; color: var(--ink);
      cursor: pointer; transition: all 0.25s ease;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .body3d-btn:hover { background: rgba(255,255,255,1); border-color: var(--primary); color: var(--primary); }
    .body3d-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .body3d-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: var(--inkLight);
      background: rgba(255,255,255,0.6); padding: 4px 14px; border-radius: 20px;
      backdrop-filter: blur(8px); white-space: nowrap;
    }
    .body3d-legend {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px; max-height: 200px; overflow-y: auto; z-index: 5;
    }
    .body3d-legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--ink); cursor: pointer;
      padding: 2px 0; transition: opacity 0.2s ease;
    }
    .body3d-legend-item:hover { opacity: 0.6; }
    .body3d-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .body3d-info {
      position: absolute; bottom: 16px; right: 16px;
      background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 20px; max-width: 280px; z-index: 5;
      opacity: 0; transform: translateY(10px); transition: all 0.3s ease;
      pointer-events: none;
    }
    .body3d-info.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .body3d-info-close {
      position: absolute; top: 8px; right: 8px;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s ease;
    }
    .body3d-info-close:hover { background: rgba(0,0,0,0.12); }
    @media (max-width: 768px) {
      .body3d-wrap { height: 420px; }
      .body3d-legend { max-height: 120px; font-size: 10px; }
      .body3d-info { max-width: 220px; padding: 12px 16px; }
    }
  </style>
</head>
<body class="paper-texture">

  <!-- 统一导航栏 -->
  <div id="nav-mount"></div>

  <!-- 页面标题 -->
  <section class="py-12 md:py-16 px-6 text-center relative z-10">
    <p class="text-tcm-accent text-sm tracking-[0.3em] mb-3">ACUPOINTS &amp; MERIDIANS</p>
    <h1 class="font-calligraphy text-4xl md:text-6xl text-tcm-primaryDark mb-4">针灸穴位</h1>
    <p class="text-tcm-inkLight tracking-[0.1em] text-sm md:text-base">明经络之循行，知穴位之定位</p>
    <div class="w-20 h-1 bg-gradient-to-r from-tcm-primary via-tcm-secondary to-tcm-accent mx-auto mt-6 rounded-full"></div>
  </section>

  <!-- ===== 3D 交互式人体穴位模型 ===== -->
  <section class="px-6 mb-10 relative z-10">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-6">
        <p class="text-tcm-accent text-xs tracking-[0.3em] mb-2">3D INTERACTIVE BODY MODEL</p>
        <h2 class="font-serif text-xl font-bold text-tcm-ink">3D 人体穴位模型</h2>
        <p class="text-xs text-tcm-inkLight mt-1">旋转查看 · 点击穴位标记查看详情</p>
      </div>
      <div class="body3d-wrap" id="body3dWrap">
        <canvas id="body3dCanvas"></canvas>
        <div class="body3d-loader" id="body3dLoader">
          <div class="text-center">
            <div class="w-10 h-10 mx-auto mb-3 border-3 border-tcm-primary border-t-transparent rounded-full animate-spin" style="border-width:3px;"></div>
            <p class="text-xs text-tcm-inkLight tracking-widest">加载3D模型...</p>
          </div>
        </div>
        <div class="body3d-controls">
          <button class="body3d-btn" id="body3dReset" title="重置视角">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            重置视角
          </button>
          <button class="body3d-btn" id="body3dFront" title="正面">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            正面
          </button>
          <button class="body3d-btn" id="body3dBack" title="背面">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>
            背面
          </button>
          <button class="body3d-btn" id="body3dTogglePoints" title="显示/隐藏穴位">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            穴位
          </button>
        </div>
        <div class="body3d-legend" id="body3dLegend"></div>
        <div class="body3d-info" id="body3dInfo">
          <div class="body3d-info-close" onclick="document.getElementById('body3dInfo').classList.remove('show')">
            <svg class="w-3.5 h-3.5 text-tcm-ink" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </div>
          <div id="body3dInfoContent"></div>
        </div>
        <div class="body3d-hint">拖拽旋转 · 滚轮缩放 · 点击穴位标记</div>
      </div>
    </div>
  </section>

  <!-- 搜索与筛选 -->
  <section class="px-6 mb-6 relative z-10">
    <div class="max-w-6xl mx-auto">
      <!-- 搜索框 -->
      <div class="relative mb-5">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-tcm-inkLight" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input w-full pl-12 pr-4 py-3 rounded-lg text-sm"
          placeholder="搜索穴位名称、主治、部位..."
        >
      </div>

      <!-- 经络导航条 -->
      <div class="mb-3">
        <p class="text-xs text-tcm-inkLight mb-2 tracking-widest">经络 · MERIDIANS</p>
        <div class="flex flex-wrap gap-2" id="meridianFilters"></div>
      </div>

      <!-- 部位筛选 -->
      <div>
        <p class="text-xs text-tcm-inkLight mb-2 tracking-widest">部位 · LOCATION</p>
        <div class="flex flex-wrap gap-2" id="categoryFilters"></div>
      </div>
    </div>
  </section>

  <!-- 经络循行描述 -->
  <section class="px-6 mb-6 relative z-10">
    <div class="max-w-6xl mx-auto">
      <div id="meridianDescPanel" class="hidden"></div>
    </div>
  </section>

  <!-- 穴位列表 -->
  <section class="px-6 pb-20 relative z-10">
    <div class="max-w-6xl mx-auto">
      <!-- 结果统计 -->
      <div class="flex flex-wrap items-center justify-between gap-2 mb-6">
        <p class="text-sm text-tcm-inkLight">
          穴位总览：<span class="text-tcm-primary font-bold" id="totalCount">0</span> 穴 ·
          当前结果 <span class="text-tcm-accent font-bold" id="resultCount">0</span> 穴
        </p>
        <button id="resetBtn" class="text-xs text-tcm-inkLight hover:text-tcm-accent transition-colors flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          重置筛选
        </button>
      </div>

      <!-- 穴位网格 -->
      <div id="acupointGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

      <!-- 空状态 -->
      <div id="emptyState" class="empty-state hidden">
        <div class="text-6xl mb-4 opacity-20 font-calligraphy">穴</div>
        <p class="text-lg mb-2">未找到相关穴位</p>
        <p class="text-sm">试试其他经络、部位或关键词</p>
      </div>
    </div>
  </section>

  <!-- 详情模态框 -->
  <div class="modal-overlay" id="acupointModal">
    <div class="modal-content">
      <div class="modal-close" onclick="closeModal()">
        <svg class="w-5 h-5 text-tcm-ink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </div>
      <div class="p-6 md:p-10" id="modalBody"></div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="py-8 px-6 border-t border-tcm-border relative z-10">
    <div class="max-w-6xl mx-auto text-center">
      <p class="text-tcm-inkLight text-xs">
        © 2026 本草灵枢 · 智慧中医平台 · 针灸操作须由专业医师进行 · 本平台内容仅供学习参考，HWB开发
      </p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/acupoints-data.js"></script>
  <script>
    // ===== 状态管理 =====
    let currentMeridian = '';   // 经络名称
    let currentCategory = '';   // 部位（不含"全部"）
    let currentKeyword = '';

    // ===== 工具函数 =====
    function getMeridianByName(name) {
      return MERIDIANS_DATA.find(m => m.name === name);
    }

    function getAcupointById(id) {
      return ACUPOINTS_DATA.find(a => a.id === id);
    }

    // 统计某经络在数据中的穴位数
    function countAcupointsByMeridian(name) {
      return ACUPOINTS_DATA.filter(a => a.meridian === name).length;
    }

    // ===== 渲染经络导航条 =====
    function renderMeridianFilters() {
      const container = document.getElementById('meridianFilters');
      container.innerHTML = MERIDIANS_DATA.map(m => {
        const count = countAcupointsByMeridian(m.name);
        const isActive = currentMeridian === m.name;
        const styleAttr = isActive
          ? `style="background:${m.color}; border-color:${m.color};"`
          : `style="--dot-color:${m.color};"`;
        return `
          <span
            class="meridian-btn ${isActive ? 'active' : ''}"
            ${styleAttr}
            onclick="selectMeridian('${m.name}')"
          >
            <span class="meridian-dot" style="background:${m.color};"></span>
            <span>${m.name}</span>
            <span class="meridian-count">${count}</span>
          </span>
        `;
      }).join('');
    }

    // ===== 渲染部位筛选 =====
    function renderCategoryFilters() {
      const container = document.getElementById('categoryFilters');
      container.innerHTML = ACUPOINT_CATEGORIES.map(cat => {
        const isActive = (cat === '全部' && !currentCategory) || cat === currentCategory;
        return `<span class="filter-tag ${isActive ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</span>`;
      }).join('');
    }

    // ===== 选择经络 =====
    function selectMeridian(name) {
      // 再次点击同一个经络则取消
      if (currentMeridian === name) {
        currentMeridian = '';
      } else {
        currentMeridian = name;
      }
      renderMeridianFilters();
      renderMeridianDesc();
      renderAcupoints();
    }

    // ===== 选择部位 =====
    function selectCategory(cat) {
      if (cat === '全部' || cat === currentCategory) {
        currentCategory = '';
      } else {
        currentCategory = cat;
      }
      renderCategoryFilters();
      renderAcupoints();
    }

    // ===== 渲染经络循行描述 =====
    function renderMeridianDesc() {
      const panel = document.getElementById('meridianDescPanel');
      if (!currentMeridian) {
        panel.classList.add('hidden');
        panel.innerHTML = '';
        return;
      }
      const m = getMeridianByName(currentMeridian);
      if (!m) {
        panel.classList.add('hidden');
        return;
      }
      const count = countAcupointsByMeridian(m.name);
      panel.classList.remove('hidden');
      panel.style.borderLeftColor = m.color;
      panel.innerHTML = `
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 rounded-lg flex items-center justify-center flex-shrink-0 font-serif font-bold text-lg"
               style="background:${m.color}1f; color:${m.color};">

            <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-2">
              <h3 class="font-serif text-xl font-bold text-tcm-primaryDark">${m.name}</h3>
              <span class="text-xs text-tcm-inkLight">英文代码 · ${m.code}</span>
              <span class="text-xs px-2 py-0.5 rounded-full" style="background:${m.color}1f; color:${m.color};">本经共 ${m.points} 穴</span>
              <span class="text-xs text-tcm-inkLight">· 本库收录 ${count} 穴</span>
            </div>
            <p class="text-sm text-tcm-ink leading-relaxed">${m.description}</p>
          </div>
        </div>
      `;
    }

    // ===== 渲染穴位列表 =====
    function renderAcupoints() {
      const grid = document.getElementById('acupointGrid');
      const emptyState = document.getElementById('emptyState');

      let filtered = ACUPOINTS_DATA.slice();

      // 经络筛选
      if (currentMeridian) {
        filtered = filtered.filter(a => a.meridian === currentMeridian);
      }

      // 部位筛选
      if (currentCategory) {
        filtered = filtered.filter(a => a.category === currentCategory);
      }

      // 关键词搜索：穴位名/主治/部位/经络/编号
      if (currentKeyword) {
        const kw = currentKeyword.toLowerCase();
        filtered = filtered.filter(a =>
          a.name.toLowerCase().includes(kw) ||
          a.indication.toLowerCase().includes(kw) ||
          a.category.toLowerCase().includes(kw) ||
          a.meridian.toLowerCase().includes(kw) ||
          a.code.toLowerCase().includes(kw)
        );
      }

      // 更新计数
      document.getElementById('totalCount').textContent = ACUPOINTS_DATA.length;
      document.getElementById('resultCount').textContent = filtered.length;

      // 空状态
      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      // 渲染卡片
      grid.innerHTML = filtered.map((ap, i) => {
        const m = getMeridianByName(ap.meridian) || { color: '#2D5A4A' };
        return `
          <div class="acupoint-card fade-in" style="--card-color:${m.color}; animation-delay:${i * 0.025}s" onclick="showAcupointDetail(${ap.id})">
            <div class="flex items-start justify-between mb-3">
              <div>
                <h3 class="font-serif text-xl font-bold text-tcm-ink mb-1">${ap.name}</h3>
                <p class="text-xs text-tcm-inkLight tracking-wider">${ap.code}</p>
              </div>
              <span class="meridian-tag" style="background:${m.color}1a; color:${m.color};">
                <span class="inline-block w-1.5 h-1.5 rounded-full mr-1 align-middle" style="background:${m.color};"></span>${ap.meridian}
              </span>
            </div>
            <div class="space-y-2 text-sm">
              <p class="text-tcm-inkLight leading-relaxed line-clamp-2">
                <span class="text-tcm-secondary text-xs mr-1">定位</span>${ap.location}
              </p>
              <p class="text-tcm-inkLight leading-relaxed line-clamp-2">
                <span class="text-tcm-accent text-xs mr-1">主治</span>${ap.indication}

                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== 重置筛选 =====
    document.getElementById('resetBtn').addEventListener('click', () => {
      currentMeridian = '';
      currentCategory = '';
      currentKeyword = '';
      document.getElementById('searchInput').value = '';
      renderMeridianFilters();
      renderCategoryFilters();
      renderMeridianDesc();
      renderAcupoints();
    });

    // ===== 搜索 =====
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentKeyword = e.target.value.trim();
      renderAcupoints();
    });

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4a2 2 0 00-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"></path>
          </svg>
          <p class="text-xs text-tcm-inkLight leading-relaxed">
            针灸操作须由具备资质的专业医师进行，请勿自行施针。孕妇、出血性疾病患者及特定穴位须严格遵照禁忌。
          </p>

    function closeModal() {
      document.getElementById('acupointModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // 点击遮罩关闭
    document.getElementById('acupointModal').addEventListener('click', (e) => {
      if (e.target.id === 'acupointModal') closeModal();

    // ESC 关闭
    document.addEventListener('keydown', (e) => {

    // ===== 初始化 =====
    renderMeridianFilters();
    renderCategoryFilters();
    renderMeridianDesc();
    renderAcupoints();
  </script>

  <!-- ===== Three.js 3D 人体穴位模型 ===== -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 穴位 3D 坐标映射（基于人体比例）=====
    // y: 0=脚底, 7=头顶; x: 左右; z: 前(+)后(-)
    const ACUPOINT_3D = {
      '百会': [0, 7.0, 0], '印堂': [0, 6.3, 0.42], '太阳': [0.55, 6.1, 0.15],
      '攒竹': [0.2, 6.2, 0.4], '睛明': [0.08, 6.1, 0.4], '四白': [0.22, 5.9, 0.42],
      '地仓': [0.28, 5.65, 0.38], '迎香': [0.3, 5.95, 0.42], '下关': [0.45, 5.75, 0.15],
      '风池': [0.35, 5.9, -0.38], '风府': [0, 5.85, -0.35], '大椎': [0, 5.3, -0.2],
      '肩髃': [1.3, 5.3, 0.05], '肩井': [0.7, 5.5, -0.15], '天宗': [1.0, 4.6, -0.3],
      '膻中': [0, 4.8, 0.35], '中府': [0.7, 4.9, 0.25], '期门': [0.8, 4.4, 0.3],
      '中脘': [0, 4.2, 0.32], '神阙': [0, 3.7, 0.3], '气海': [0, 3.4, 0.3],
      '关元': [0, 3.1, 0.3], '中极': [0, 2.85, 0.28], '天枢': [0.5, 3.7, 0.28],
      '命门': [0, 3.8, -0.3], '肾俞': [0.4, 3.8, -0.28], '腰阳关': [0, 3.5, -0.3],
      '合谷': [1.55, 2.7, 0], '曲池': [1.5, 3.8, 0.05], '曲泽': [1.45, 3.9, 0.1],
      '内关': [1.4, 3.1, 0.08], '外关': [1.4, 3.1, -0.08], '神门': [1.35, 2.9, 0.05],
        '列缺': [1.4, 3.0, 0.05], '太渊': [1.35, 2.9, 0.05], '鱼际': [1.42, 2.75, 0.1],
      '尺泽': [1.45, 3.9, 0.05], '少商': [1.5, 2.65, 0.05],
      '足三里': [0.38, 1.8, 0.18], '上巨虚': [0.36, 1.4, 0.15], '下巨虚': [0.34, 1.1, 0.12],
      '丰隆': [0.45, 1.3, 0.1], '解溪': [0.32, 0.7, 0.1], '内庭': [0.3, 0.4, 0.08],
      '三阴交': [0.3, 1.2, -0.08], '阴陵泉': [0.35, 1.7, -0.05], '血海': [0.4, 2.5, 0.05],
      '阳陵泉': [0.45, 1.8, -0.1], '足临泣': [0.4, 0.4, -0.05],
      '委中': [0.35, 1.8, -0.25], '承山': [0.32, 1.1, -0.2], '昆仑': [0.3, 0.5, -0.15],
      '太溪': [0.3, 0.55, -0.05], '涌泉': [0.3, 0.1, 0.1],
      '太冲': [0.32, 0.35, 0.05], '行间': [0.3, 0.25, 0.05],
      '环跳': [0.6, 3.0, -0.25], '风市': [0.5, 2.3, -0.15],
      '百虫窝': [0.4, 2.6, 0.05],
    };

    // 暴露给全局，使列表点击可以联动3D
    window.__body3d = null;

    const canvas = document.getElementById('body3dCanvas');
    const loader = document.getElementById('body3dLoader');
    const wrap = document.getElementById('body3dWrap');
    const legendEl = document.getElementById('body3dLegend');
    const infoEl = document.getElementById('body3dInfo');
    const infoContent = document.getElementById('body3dInfoContent');

    if (canvas) initBody3D();

    function initBody3D() {
      const scene = new THREE.Scene();
      const w = wrap.clientWidth, h = wrap.clientHeight;
      const camera = new THREE.PerspectiveCamera(35, w / h, 0.1, 100);
      camera.position.set(0, 3.5, 12);

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // ===== 灯光 =====
      scene.add(new THREE.AmbientLight(0xfff5e6, 0.5));
      const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
      keyLight.position.set(3, 6, 5);
      scene.add(keyLight);
      const fillLight = new THREE.DirectionalLight(0x2d5a4a, 0.3);
      fillLight.position.set(-3, 2, 3);
      scene.add(fillLight);
      const rimLight = new THREE.DirectionalLight(0xc9a227, 0.4);
      rimLight.position.set(0, 3, -5);
      scene.add(rimLight);

      // ===== 创建人体模型 =====
      const bodyGroup = new THREE.Group();
      const bodyMat = new THREE.MeshPhongMaterial({
        color: 0x2D5A4A, transparent: true, opacity: 0.12,
        shininess: 30, specular: 0x3d7a64,
        side: THREE.DoubleSide
      });
      const bodyOutlineMat = new THREE.MeshBasicMaterial({
        color: 0x2D5A4A, wireframe: true, transparent: true, opacity: 0.08
      });

      // 头部
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 32), bodyMat);
      head.position.set(0, 6.5, 0);
      bodyGroup.add(head);

      // 颈部
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.5, 16), bodyMat);
      neck.position.set(0, 5.85, 0);
      bodyGroup.add(neck);

      // 躯干（使用 LatheGeometry 创建躯干轮廓）
      const torsoPoints = [
        new THREE.Vector2(0.01, 0), new THREE.Vector2(0.5, 0.05),
        new THREE.Vector2(0.7, 0.2), new THREE.Vector2(0.85, 0.5),
        new THREE.Vector2(0.82, 1.0), new THREE.Vector2(0.7, 1.5),
        new THREE.Vector2(0.55, 1.9), new THREE.Vector2(0.4, 2.1),
        new THREE.Vector2(0.01, 2.15)
      ];
      const torsoGeo = new THREE.LatheGeometry(torsoPoints, 32);
      const torso = new THREE.Mesh(torsoGeo, bodyMat);
      torso.position.set(0, 3.2, 0);
      bodyGroup.add(torso);

      // 肩膀
      const shoulderL = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), bodyMat);
      shoulderL.position.set(1.15, 5.3, 0);
      bodyGroup.add(shoulderL);
      const shoulderR = shoulderL.clone();
      shoulderR.position.x = -1.15;
      bodyGroup.add(shoulderR);

      // 手臂
      function makeArm(side) {
        const armGroup = new THREE.Group();
        // 上臂
        const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 1.5, 16), bodyMat);
        upperArm.position.set(0, -0.75, 0);
        armGroup.add(upperArm);
        // 肘关节
        const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), bodyMat);
        elbow.position.set(0, -1.5, 0);
        armGroup.add(elbow);
        // 前臂
        const lowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.09, 1.3, 16), bodyMat);
        lowerArm.position.set(0, -2.15, 0);
        armGroup.add(lowerArm);
        // 手
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), bodyMat);
        hand.position.set(0, -2.85, 0);
        hand.scale.set(0.8, 1.2, 0.5);
        armGroup.add(hand);
        armGroup.position.set(side * 1.15, 5.3, 0);
        armGroup.rotation.z = side * 0.12;
        return armGroup;
      }
      bodyGroup.add(makeArm(1));
      bodyGroup.add(makeArm(-1));

      // 髋部
      const hip = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), bodyMat);
      hip.position.set(0, 3.2, 0);
      hip.scale.set(1.3, 0.6, 1);
      bodyGroup.add(hip);

      // 腿
      function makeLeg(side) {
        const legGroup = new THREE.Group();
        // 大腿
        const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.13, 1.6, 16), bodyMat);
        thigh.position.set(0, -0.8, 0);
        legGroup.add(thigh);
        // 膝关节
        const knee = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), bodyMat);
        knee.position.set(0, -1.6, 0);
        legGroup.add(knee);
        // 小腿
        const calf = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 1.5, 16), bodyMat);
        calf.position.set(0, -2.35, 0);
        legGroup.add(calf);
        // 脚
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.4), bodyMat);
        foot.position.set(0, -3.15, 0.08);
        legGroup.add(foot);
        legGroup.position.set(side * 0.3, 3.1, 0);
        return legGroup;
      }
      bodyGroup.add(makeLeg(1));
      bodyGroup.add(makeLeg(-1));

      scene.add(bodyGroup);

      // ===== 创建穴位标记 =====
      const pointGroup = new THREE.Group();
      const pointMeshes = [];
      const meridianColors = {};
      MERIDIANS_DATA.forEach(m => { meridianColors[m.name] = m.color; });

      ACUPOINTS_DATA.forEach(ap => {
        const pos = ACUPOINT_3D[ap.name];
        if (!pos) return;
        const color = meridianColors[ap.meridian] || '#2D5A4A';
        const colorHex = parseInt(color.replace('#', ''), 16);

        // 穴位发光球
        const pointGeo = new THREE.SphereGeometry(0.09, 16, 16);
        const pointMat = new THREE.MeshBasicMaterial({ color: colorHex });
        const point = new THREE.Mesh(pointGeo, pointMat);
        point.position.set(pos[0], pos[1], pos[2]);
        point.userData = { acupoint: ap, color: colorHex, baseScale: 1 };

        // 外层光晕
        const glowGeo = new THREE.SphereGeometry(0.16, 16, 16);
        const glowMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.3 });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.copy(point.position);
        point.userData.glow = glow;

        pointGroup.add(point);
        pointGroup.add(glow);
        pointMeshes.push(point);
      });
      scene.add(pointGroup);

      // ===== 经络连线 =====
      const meridianLines = [];
      MERIDIANS_DATA.forEach(m => {
        const points = ACUPOINTS_DATA
          .filter(a => a.meridian === m.name && ACUPOINT_3D[a.name])
          .map(a => new THREE.Vector3(...ACUPOINT_3D[a.name]));
        if (points.length < 2) return;
        const colorHex = parseInt(m.color.replace('#', ''), 16);
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const lineMat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.25 });
        const line = new THREE.Line(lineGeo, lineMat);
        meridianLines.push(line);
        scene.add(line);
      });

      // ===== 控制器 =====
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 3.5, 0);
      controls.minDistance = 6;
      controls.maxDistance = 20;
      controls.minPolarAngle = Math.PI / 6;
      controls.maxPolarAngle = Math.PI / 1.1;

      // ===== Raycaster =====
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let hoveredPoint = null;
      let selectedPoint = null;

      function onPointerMove(event) {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }
      canvas.addEventListener('pointermove', onPointerMove);

      function onClick(event) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(pointMeshes);
        if (intersects.length > 0) {
          const point = intersects[0].object;
          showPointInfo(point.userData.acupoint);
          // 高亮选中
          if (selectedPoint) {
            selectedPoint.userData.glow.material.opacity = 0.3;
            selectedPoint.scale.setScalar(1);
          }
          selectedPoint = point;
          point.scale.setScalar(1.5);
          point.userData.glow.material.opacity = 0.6;
        }
      }
      canvas.addEventListener('click', onClick);

      // ===== 显示穴位信息 =====
      function showPointInfo(ap) {
        const m = getMeridianByName(ap.meridian) || { color: '#2D5A4A', code: '' };
        infoContent.innerHTML = `
          <div class="mb-2">
            <span class="font-serif text-lg font-bold text-tcm-ink">${ap.name}</span>
            <span class="text-xs text-tcm-inkLight ml-2">${ap.code}</span>
          </div>
          <div class="inline-block px-2 py-0.5 rounded text-xs mb-2" style="background:${m.color}1a;color:${m.color};">
            <span class="inline-block w-1.5 h-1.5 rounded-full mr-1 align-middle" style="background:${m.color};"></span>${ap.meridian}
          </div>
          <div class="text-xs text-tcm-inkLight mb-1"><span class="text-tcm-secondary">定位：</span>${ap.location}</div>
          <div class="text-xs text-tcm-inkLight mb-1"><span class="text-tcm-accent">主治：</span>${ap.indication}</div>
          <div class="text-xs text-tcm-primary"><span class="font-medium">针法：</span>${ap.method}</div>
          <button onclick="showAcupointDetail(${ap.id})" class="mt-2 text-xs text-tcm-gold hover:underline">查看完整详情 →</button>
        `;
        infoEl.classList.add('show');
      }
      window.showPointInfo = showPointInfo;

      // ===== 按钮控制 =====
      document.getElementById('body3dReset').addEventListener('click', () => {
        camera.position.set(0, 3.5, 12);
        controls.target.set(0, 3.5, 0);
        controls.update();
      });
      document.getElementById('body3dFront').addEventListener('click', () => {
        animateCamera(new THREE.Vector3(0, 3.5, 12));
      });
      document.getElementById('body3dBack').addEventListener('click', () => {
        animateCamera(new THREE.Vector3(0, 3.5, -12));
      });

      let pointsVisible = true;
      document.getElementById('body3dTogglePoints').addEventListener('click', (e) => {
        pointsVisible = !pointsVisible;
        pointGroup.visible = pointsVisible;
        e.currentTarget.classList.toggle('active', !pointsVisible);
      });

      function animateCamera(targetPos) {
        const start = camera.position.clone();
        const duration = 800;
        const startTime = performance.now();
        function step(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(start, targetPos, ease);
          controls.update();
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      // ===== 图例 =====
      const legendMeridians = MERIDIANS_DATA.filter(m =>
        ACUPOINTS_DATA.some(a => a.meridian === m.name && ACUPOINT_3D[a.name])
      );
      legendEl.innerHTML = legendMeridians.map(m => {
        const count = ACUPOINTS_DATA.filter(a => a.meridian === m.name && ACUPOINT_3D[a.name]).length;
        return `<div class="body3d-legend-item" data-meridian="${m.name}">
          <span class="body3d-legend-dot" style="background:${m.color};"></span>
          <span>${m.name}</span>
          <span class="text-tcm-inkLight ml-auto">${count}</span>
        </div>`;
      }).join('');

      // 图例点击 — 高亮该经络穴位
      legendEl.querySelectorAll('.body3d-legend-item').forEach(item => {
        item.addEventListener('click', () => {
          const meridianName = item.dataset.meridian;
          pointMeshes.forEach(pm => {
            const isMatch = pm.userData.acupoint.meridian === meridianName;
            pm.visible = isMatch || item.classList.contains('dimmed');
            if (pm.userData.glow) pm.userData.glow.visible = pm.visible;
          });
          if (item.classList.contains('dimmed')) {
            item.classList.remove('dimmed');
            item.style.opacity = '1';
          } else {
            legendEl.querySelectorAll('.body3d-legend-item').forEach(i => { i.classList.remove('dimmed'); i.style.opacity = '1'; });
            item.classList.add('dimmed');
            legendEl.querySelectorAll('.body3d-legend-item').forEach(i => { if (i !== item) i.style.opacity = '0.3'; });
          }
        });
      });

      // ===== 动画循环 =====
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        // 穴位呼吸动画
        pointMeshes.forEach((pm, i) => {
          if (pm === selectedPoint) return;
          const pulse = 1 + Math.sin(elapsed * 2 + i * 0.3) * 0.15;
          if (pm.userData.glow) {
            pm.userData.glow.scale.setScalar(pulse);
            pm.userData.glow.material.opacity = 0.2 + Math.sin(elapsed * 2 + i * 0.3) * 0.1;
          }
        });

        // Hover 检测
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(pointMeshes.filter(p => p.visible));
        if (intersects.length > 0) {
          if (hoveredPoint !== intersects[0].object) {
            if (hoveredPoint && hoveredPoint !== selectedPoint) {
              hoveredPoint.scale.setScalar(1);
            }
            hoveredPoint = intersects[0].object;
            if (hoveredPoint !== selectedPoint) hoveredPoint.scale.setScalar(1.4);
            canvas.style.cursor = 'pointer';
          }
        } else {
          if (hoveredPoint && hoveredPoint !== selectedPoint) {
            hoveredPoint.scale.setScalar(1);
          }
          hoveredPoint = null;
          canvas.style.cursor = 'grab';
        }

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // 隐藏加载器
      loader.style.display = 'none';

      // ===== 响应式 =====
      function onResize() {
        const nw = wrap.clientWidth, nh = wrap.clientHeight;
        camera.aspect = nw / nh;
        camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      }
      window.addEventListener('resize', onResize);

      // 暴露接口供外部联动
      window.__body3d = { showPointInfo, animateCamera, camera, controls };
    }
  </script>
</body>
</html>
