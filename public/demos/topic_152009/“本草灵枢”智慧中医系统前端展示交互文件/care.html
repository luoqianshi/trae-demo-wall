<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日常护理 · 本草灵枢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="js/acupoints-data.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tcm: {
              primary: '#2D5A4A',
              primaryLight: '#3D7A64',
              primaryDark: '#1F4035',
              secondary: '#8B5A2B',
              secondaryLight: '#A67B4D',
              accent: '#B83A3A',
              accentLight: '#C95A5A',
              paper: '#F1EBD8',
              paperDark: '#E5DEC3',
              ink: '#2C2622',
              inkLight: '#6B6259',
              card: '#1E2622',
              cardLight: '#2A3530',
              gold: '#C9A227',
              border: '#D8CEB3'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'STSong', 'SimSun', 'serif'],
            sans: ['"Noto Sans SC"', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            calligraphy: ['"Ma Shan Zheng"', 'cursive']
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --primary: #2D5A4A;
      --primaryLight: #3D7A64;
      --primaryDark: #1F4035;
      --secondary: #8B5A2B;
      --accent: #B83A3A;
      --paper: #F1EBD8;
      --ink: #2C2622;
      --inkLight: #6B6259;
      --gold: #C9A227;
      --border: #D8CEB3;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
    }

    .font-calligraphy {
      font-family: 'Ma Shan Zheng', 'Noto Serif SC', cursive;
    }

    /* 宣纸纹理 */
    .paper-texture::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(201, 162, 39, 0.05) 0%, transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(139, 90, 43, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(45, 90, 74, 0.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* 浮动印章 */
    .seal {
      position: absolute;
      font-family: 'Noto Serif SC', serif;
      color: rgba(184, 58, 58, 0.06);
      font-weight: 900;
      writing-mode: vertical-rl;
      pointer-events: none;
      user-select: none;
    }

    /* 导航栏 */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(241, 235, 216, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(45, 90, 74, 0.08);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav-bar.scrolled {
      box-shadow: 0 4px 24px rgba(30, 38, 34, 0.1);
    }
    .nav-link {
      color: var(--inkLight);
      font-size: 14px;
      letter-spacing: 0.05em;
      transition: color 0.3s ease;
      position: relative;
      white-space: nowrap;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 2px;
      background: var(--primary);
      transition: width 0.3s ease;
    }
    .nav-link:hover { color: var(--primary); }
    .nav-link:hover::after { width: 100%; }
    .nav-link.active { color: var(--primary); font-weight: 500; }
    .nav-link.active::after { width: 100%; }

    /* 标题区分隔线 */
    .title-divider {
      width: 80px; height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
      border-radius: 999px;
    }

    /* Tab 切换 */
    .tab-btn {
      padding: 12px 32px;
      font-size: 15px;
      color: var(--inkLight);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      border: 1px solid transparent;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .tab-btn:hover {
      color: var(--primary);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 6px 20px rgba(45, 90, 74, 0.25);
    }
    .tab-panel {
      display: none;
      animation: fadeIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tab-panel.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 体质卡片 */
    .constitution-card {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }
    .constitution-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--primaryLight));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }
    .constitution-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(45, 90, 74, 0.14);
      border-color: var(--primaryLight);
      background: rgba(255, 255, 255, 0.8);
    }
    .constitution-card:hover::before {
      transform: scaleX(1);
    }
    .constitution-card.expanded {
      background: rgba(255, 255, 255, 0.85);
      border-color: var(--primary);
      box-shadow: 0 14px 40px rgba(45, 90, 74, 0.16);
    }
    .constitution-card.expanded::before {
      transform: scaleX(1);
    }

    .feature-tag {
      display: inline-block;
      padding: 3px 10px;
      font-size: 11px;
      background: rgba(45, 90, 74, 0.08);
      color: var(--primary);
      border-radius: 4px;
      margin: 0 4px 4px 0;
      transition: background 0.2s ease;
    }
    .constitution-card:hover .feature-tag {
      background: rgba(45, 90, 74, 0.12);
    }

    .detail-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease, margin 0.4s ease;
      opacity: 0;
      margin-top: 0;
    }
    .detail-panel.open {
      max-height: 600px;
      opacity: 1;
      margin-top: 16px;
    }

    .detail-section {
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(241, 235, 216, 0.5);
      border-left: 3px solid var(--primary);
    }
    .detail-section.diet { border-left-color: var(--secondary); }
    .detail-section.exercise { border-left-color: var(--gold); }

    .detail-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 节气卡片 */
    .season-group {
      margin-bottom: 32px;
    }
    .season-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .season-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.5);
    }
    .season-spring { color: #3D7A64; }
    .season-spring .season-dot { background: #3D7A64; }
    .season-spring .season-label-bg { background: rgba(61, 122, 100, 0.1); }

    .season-summer { color: #B83A3A; }
    .season-summer .season-dot { background: #B83A3A; }
    .season-summer .season-label-bg { background: rgba(184, 58, 58, 0.1); }

    .season-autumn { color: #C9A227; }
    .season-autumn .season-dot { background: #C9A227; }
    .season-autumn .season-label-bg { background: rgba(201, 162, 39, 0.1); }

    .season-winter { color: #3A6B8C; }
    .season-winter .season-dot { background: #3A6B8C; }
    .season-winter .season-label-bg { background: rgba(58, 107, 140, 0.1); }

    .solar-card {
      background: rgba(255, 255, 255, 0.55);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid var(--border);
      border-left-width: 4px;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      height: 100%;
      position: relative;
    }
    .solar-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(30, 38, 34, 0.1);
      background: rgba(255, 255, 255, 0.8);
    }
    .solar-card.spring { border-left-color: #3D7A64; }
    .solar-card.summer { border-left-color: #B83A3A; }
    .solar-card.autumn { border-left-color: #C9A227; }
    .solar-card.winter { border-left-color: #3A6B8C; }

    .solar-card.current {
      box-shadow: 0 8px 30px rgba(45, 90, 74, 0.18);
    }
    .solar-card.current::after {
      content: '当季';
      position: absolute;
      top: 12px; right: 12px;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    /* 测试按钮 */
    .test-btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accentLight, #C95A5A) 100%);
      color: #fff;
      padding: 14px 36px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.1em;
      box-shadow: 0 8px 24px rgba(184, 58, 58, 0.3);
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      border: none;
    }
    .test-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(184, 58, 58, 0.4);
    }

    /* 模态框 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(30, 38, 34, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: var(--paper);
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.92);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    }
    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .quiz-option {
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      font-size: 14px;
      background: rgba(255,255,255,0.5);
    }
    .quiz-option:hover {
      border-color: var(--primary);
      background: rgba(255,255,255,0.9);
    }
    .quiz-option.selected {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 进度条 */
    .quiz-progress {
      height: 4px;
      background: rgba(45, 90, 74, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }
    .quiz-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primaryLight, #3D7A64));
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 999px;
    }

    /* 滚动显示动画 */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* 回到顶部 */
    .back-to-top {
      position: fixed;
      bottom: 32px; right: 32px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(45, 90, 74, 0.3);
    }
    .back-to-top.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .back-to-top:hover {
      background: var(--primaryDark, #1F4035);
      transform: translateY(-2px);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .nav-mobile-hidden { display: none; }
    }
  </style>
</head>
<body class="paper-texture">

  <!-- 统一导航栏 -->
  <div id="nav-mount"></div>

  <!-- 页面标题区 -->
  <section class="py-14 md:py-20 px-6 text-center relative z-10 overflow-hidden">
    <div class="seal" style="top:60px;right:8%;font-size:120px;">养</div>
    <div class="seal" style="bottom:40px;left:6%;font-size:90px;color:rgba(45,90,74,0.05);">护</div>

    <div class="relative z-10 max-w-3xl mx-auto reveal">
      <p class="text-tcm-accent text-sm tracking-[0.3em] mb-3">DAILY WELLNESS</p>
      <h1 class="font-calligraphy text-5xl md:text-7xl text-tcm-primaryDark mb-4" style="text-shadow:0 2px 0 rgba(255,255,255,0.4),0 8px 28px rgba(45,90,74,0.18);letter-spacing:0.1em;">
        日常护理
      </h1>
      <p class="font-serif text-lg md:text-xl text-tcm-ink mb-6 tracking-[0.12em]">顺四时之序，养身心之本</p>
      <div class="title-divider mx-auto"></div>
      <p class="text-tcm-inkLight text-sm mt-6 leading-relaxed max-w-xl mx-auto">
        中医养生重在顺应天时，辨体施养。这里汇集九种体质调理与二十四节气养生智慧，助您找到适合自己的养生之道。
      </p>
    </div>
  </section>

  <!-- 体质测试入口 -->
  <section class="px-6 pb-8 relative z-10">
    <div class="max-w-3xl mx-auto reveal">
      <div class="bg-white/50 border border-tcm-border rounded-2xl p-6 md:p-8 text-center" style="background:linear-gradient(135deg, rgba(255,255,255,0.7), rgba(241,235,216,0.5));">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4" style="background:rgba(184,58,58,0.1);">
          <svg class="w-7 h-7 text-tcm-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
        </div>
        <h3 class="font-serif text-xl font-bold text-tcm-ink mb-2">不知道自己是什么体质？</h3>
        <p class="text-tcm-inkLight text-sm mb-5">通过简单的六个问题，快速了解您的中医体质倾向</p>
        <button class="test-btn" onclick="openQuiz()">
          <span class="inline-flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            测试我的体质
          </span>
        </button>
      </div>
    </div>
  </section>

  <!-- Tab 切换 -->
  <section class="px-6 pb-16 relative z-10">
    <div class="max-w-6xl mx-auto">
      <!-- Tab 按钮 -->
      <div class="flex justify-center mb-10 reveal">
        <div class="inline-flex p-1.5 rounded-full" style="background:rgba(45,90,74,0.08);">
          <button class="tab-btn active" data-tab="constitution" onclick="switchTab('constitution')">体质调理</button>
          <button class="tab-btn" data-tab="solar" onclick="switchTab('solar')">节气养生</button>
        </div>
      </div>

      <!-- 体质调理面板 -->
      <div class="tab-panel active" id="tab-constitution">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="constitutionGrid"></div>
      </div>

      <!-- 节气养生面板 -->
      <div class="tab-panel" id="tab-solar">
        <div id="solarContainer"></div>
      </div>
    </div>
  </section>

  <!-- 免责声明 -->
  <footer class="py-12 px-6 border-t border-tcm-border relative z-10">
    <div class="max-w-6xl mx-auto">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-tcm-primary flex items-center justify-center text-tcm-paper font-serif text-lg font-bold">本</div>
          <span class="font-serif text-xl font-bold text-tcm-primary tracking-widest">本草灵枢</span>
        </div>
        <div class="text-center md:text-right">
          <p class="text-tcm-inkLight text-sm">
            本平台的健康建议仅供参考，不能替代专业医生诊断与治疗。
          </p>
          <p class="text-tcm-inkLight text-xs mt-1">
            体质测试结果仅为简化版评估，具体体质判断请咨询专业中医师。
          </p>
        </div>
      </div>
      <p class="text-tcm-inkLight text-xs text-center mt-8">
        © 2026 本草灵枢 · 智慧中医平台
      </p>
    </div>
  </footer>

  <!-- 回到顶部 -->
  <div class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
  </div>

  <!-- 体质测试模态框 -->
  <div class="modal-overlay" id="quizModal">
    <div class="modal-content p-6 md:p-8">
      <div id="quizContent"></div>
    </div>
  </div>

  <script>
    // ===== 1. 渲染体质卡片 =====
    const constitutionGrid = document.getElementById('constitutionGrid');

    function renderConstitutions() {
      constitutionGrid.innerHTML = CONSTITUTIONS_DATA.map((c, idx) => `
        <div class="constitution-card reveal" style="transition-delay:${idx * 0.05}s;" data-id="${c.id}" onclick="toggleConstitution(${c.id})">
          <div class="flex items-start justify-between mb-3">
            <h3 class="font-serif text-2xl font-bold text-tcm-primaryDark">${c.name}</h3>
            <svg class="w-5 h-5 text-tcm-inkLight transition-transform duration-300 chevron-${c.id}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
          <p class="text-sm text-tcm-inkLight leading-relaxed mb-3">${c.description}</p>
          <div class="flex flex-wrap">
            ${c.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
          </div>
          <div class="detail-panel" id="detail-${c.id}">
            <div class="space-y-3">
              <div class="detail-section">
                <div class="detail-label" style="color:var(--primary);">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  养生建议
                </div>
                <p class="text-sm text-tcm-ink leading-relaxed">${c.advice}</p>
              </div>
              <div class="detail-section diet">
                <div class="detail-label" style="color:var(--secondary);">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                  饮食建议
                </div>
                <p class="text-sm text-tcm-ink leading-relaxed">${c.diet}</p>
              </div>
              <div class="detail-section exercise">
                <div class="detail-label" style="color:#8B7D5A;">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                  运动建议
                </div>
                <p class="text-sm text-tcm-ink leading-relaxed">${c.exercise}</p>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleConstitution(id) {
      const card = document.querySelector(`.constitution-card[data-id="${id}"]`);
      const detail = document.getElementById(`detail-${id}`);
      const chevron = document.querySelector(`.chevron-${id}`);
      const isOpen = detail.classList.contains('open');

      // 收起所有已展开的
      document.querySelectorAll('.detail-panel.open').forEach(d => d.classList.remove('open'));
      document.querySelectorAll('.constitution-card.expanded').forEach(c => c.classList.remove('expanded'));
      document.querySelectorAll('[class*="chevron-"]').forEach(ch => ch.style.transform = 'rotate(0deg)');

      if (!isOpen) {
        detail.classList.add('open');
        card.classList.add('expanded');
        chevron.style.transform = 'rotate(180deg)';
      }
    }

    // ===== 2. 渲染节气卡片 =====
    function getCurrentSeason() {
      const month = new Date().getMonth() + 1;
      if (month >= 3 && month <= 5) return '春';
      if (month >= 6 && month <= 8) return '夏';
      if (month >= 9 && month <= 11) return '秋';
      return '冬';
    }

    const SEASON_MAP = {
      '春': { class: 'spring', color: '#3D7A64' },
      '夏': { class: 'summer', color: '#B83A3A' },
      '秋': { class: 'autumn', color: '#C9A227' },
      '冬': { class: 'winter', color: '#3A6B8C' }
    };

    function renderSolarTerms() {
      const container = document.getElementById('solarContainer');
      const currentSeason = getCurrentSeason();
      const seasons = ['春', '夏', '秋', '冬'];

      container.innerHTML = seasons.map(season => {
        const terms = SOLAR_TERMS_DATA.filter(t => t.season === season);
        const seasonInfo = SEASON_MAP[season];
        const isCurrent = season === currentSeason;
        return `
          <div class="season-group season-${seasonInfo.class} reveal">
            <div class="season-header">
              <span class="season-dot"></span>
              <h3 class="font-serif text-2xl font-bold" style="color:${seasonInfo.color};">${season}季养生</h3>
              ${isCurrent ? `<span class="season-label-bg text-xs px-3 py-1 rounded-full ml-2" style="color:${seasonInfo.color};">当前季节</span>` : ''}
              <span class="text-tcm-inkLight text-sm ml-2">${terms.length}个节气</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              ${terms.map(t => `
                <div class="solar-card ${seasonInfo.class} ${isCurrent ? 'current' : ''}">
                  <h4 class="font-serif text-xl font-bold text-tcm-ink mb-2 pr-12">${t.name}</h4>
                  <p class="text-sm text-tcm-inkLight leading-relaxed">${t.advice}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== 3. Tab 切换 =====
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === `tab-${tab}`);
      });
    }

    // ===== 4. 体质测试问卷 =====
    const QUIZ_QUESTIONS = [
      { id: 1, question: '你容易疲乏吗？', scores: { yes: '气虚质', no: null } },
      { id: 2, question: '你怕冷吗（手足不温）？', scores: { yes: '阳虚质', no: null } },
      { id: 3, question: '你容易口干、咽干吗？', scores: { yes: '阴虚质', no: null } },
      { id: 4, question: '你容易长痘、面部出油吗？', scores: { yes: '湿热质', no: null } },
      { id: 5, question: '你情绪容易低落吗？', scores: { yes: '气郁质', no: null } },
      { id: 6, question: '你容易过敏吗（花粉、食物等）？', scores: { yes: '特禀质', no: null } }
    ];

    let quizState = { current: 0, answers: [] };

    function openQuiz() {
      quizState = { current: 0, answers: [] };
      document.getElementById('quizModal').classList.add('active');
      renderQuizQuestion();
    }

    function closeQuiz() {
      document.getElementById('quizModal').classList.remove('active');
    }

    function renderQuizQuestion() {
      const content = document.getElementById('quizContent');
      const q = QUIZ_QUESTIONS[quizState.current];
      const progress = ((quizState.current) / QUIZ_QUESTIONS.length) * 100;

      content.innerHTML = `
        <div class="flex justify-between items-center mb-6">
          <h3 class="font-serif text-xl font-bold text-tcm-primaryDark">体质测试</h3>
          <button onclick="closeQuiz()" class="text-tcm-inkLight hover:text-tcm-accent transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="quiz-progress mb-2">
          <div class="quiz-progress-bar" style="width:${progress}%;"></div>
        </div>
        <p class="text-xs text-tcm-inkLight mb-6">第 ${quizState.current + 1} / ${QUIZ_QUESTIONS.length} 题</p>
        <div class="text-center mb-6">
          <p class="font-serif text-lg text-tcm-ink mb-6 leading-relaxed">${q.question}</p>
          <div class="grid grid-cols-2 gap-3">
            <div class="quiz-option" onclick="answerQuiz('yes')">
              <span class="font-medium">是</span>
            </div>
            <div class="quiz-option" onclick="answerQuiz('no')">
              <span class="font-medium">否</span>
            </div>
          </div>
        </div>
      `;
    }

    function answerQuiz(answer) {
      const q = QUIZ_QUESTIONS[quizState.current];
      quizState.answers.push({ questionId: q.id, answer, score: q.scores[answer] });
      quizState.current++;

      if (quizState.current < QUIZ_QUESTIONS.length) {
        renderQuizQuestion();
      } else {
        showQuizResult();
      }
    }

    function showQuizResult() {
      const content = document.getElementById('quizContent');
      // 统计得分
      const scoreMap = {};
      quizState.answers.forEach(a => {
        if (a.score) {
          scoreMap[a.score] = (scoreMap[a.score] || 0) + 1;
        }
      });

      // 取最高分体质，若全为否则平和质
      let resultName = '平和质';
      let maxScore = 0;
      Object.entries(scoreMap).forEach(([name, score]) => {
        if (score > maxScore) {
          maxScore = score;
          resultName = name;
        }
      });

      const result = CONSTITUTIONS_DATA.find(c => c.name === resultName) || CONSTITUTIONS_DATA[0];
      const progress = 100;

      content.innerHTML = `
        <div class="flex justify-between items-center mb-6">
          <h3 class="font-serif text-xl font-bold text-tcm-primaryDark">测试结果</h3>
          <button onclick="closeQuiz()" class="text-tcm-inkLight hover:text-tcm-accent transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="quiz-progress mb-6">
          <div class="quiz-progress-bar" style="width:${progress}%;"></div>
        </div>
        <div class="text-center py-4">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4" style="background:rgba(45,90,74,0.1);">
            <svg class="w-8 h-8 text-tcm-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
          </div>
          <p class="text-sm text-tcm-inkLight mb-2 tracking-wider">您的体质倾向为</p>
          <h4 class="font-calligraphy text-4xl text-tcm-primaryDark mb-4">${result.name}</h4>
          <p class="text-sm text-tcm-ink mb-6 leading-relaxed px-2">${result.description}</p>

          <div class="text-left space-y-3 mb-6">
            <div class="detail-section">
              <div class="detail-label" style="color:var(--primary);">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                养生建议
              </div>
              <p class="text-sm text-tcm-ink leading-relaxed">${result.advice}</p>
            </div>
            <div class="detail-section diet">
              <div class="detail-label" style="color:var(--secondary);">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                饮食建议
              </div>
              <p class="text-sm text-tcm-ink leading-relaxed">${result.diet}</p>
            </div>
            <div class="detail-section exercise">
              <div class="detail-label" style="color:#8B7D5A;">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                运动建议
              </div>
              <p class="text-sm text-tcm-ink leading-relaxed">${result.exercise}</p>
            </div>
          </div>

          <div class="flex gap-3">
            <button onclick="openQuiz()" class="flex-1 py-3 rounded-lg text-sm font-medium border border-tcm-border text-tcm-inkLight hover:bg-white/60 transition-colors">重新测试</button>
            <button onclick="closeQuiz(); switchTab('constitution'); document.getElementById('tab-constitution').scrollIntoView({behavior:'smooth', block:'start'});" class="flex-1 py-3 rounded-lg text-sm font-medium bg-tcm-primary text-white hover:bg-tcm-primaryDark transition-colors">查看全部体质</button>
          </div>
        </div>
      `;
    }

    // 点击遮罩关闭模态框
    document.getElementById('quizModal').addEventListener('click', (e) => {
      if (e.target.id === 'quizModal') closeQuiz();
    });

    // ===== 5. 滚动动画 =====
    function revealOnScroll() {
      document.querySelectorAll('.reveal').forEach(el => {
        if (el.getBoundingClientRect().top < window.innerHeight - 60) {
          el.classList.add('active');
        }
      });
    }

    // ===== 6. 导航滚动效果 + 回到顶部 =====
    const navbar = document.getElementById('navbar');
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 60) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
      if (window.scrollY > 500) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
      revealOnScroll();
    });

    // ===== 初始化 =====
    renderConstitutions();
    renderSolarTerms();
    window.addEventListener('load', revealOnScroll);
    setTimeout(revealOnScroll, 100);
  </script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
