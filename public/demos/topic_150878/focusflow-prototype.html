<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FocusFlow 专注流</title>
  <style>
    :root {
      --bg: #F3F6F4;
      --bg2: #E8F0EB;
      --ink: #1C2B24;
      --muted: #6B7D73;
      --rule: rgba(107, 125, 115, 0.16);
      --accent: #2D6A4F;
      --accent-light: #74C69D;
      --accent-soft: rgba(45, 106, 79, 0.14);
      --radius: 28px;
      --shadow: 0 16px 48px var(--accent-soft);
      --shadow-lg: 0 28px 72px var(--accent-soft);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.8s ease;
    }

    .app {
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 900px;
      background: linear-gradient(165deg, var(--bg) 0%, var(--bg2) 55%, var(--bg) 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.8s ease;
    }

    @media (min-width: 480px) {
      .app {
        height: 90vh;
        border-radius: 40px;
        box-shadow: var(--shadow-lg);
      }
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 28px 20px;
    }
    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.25rem;
      box-shadow: 0 8px 24px var(--accent-soft);
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .icon-btn:hover { transform: scale(1.06); box-shadow: 0 12px 32px var(--accent-soft); }
    .icon-btn.active { background: var(--accent-soft); color: var(--accent); }

    /* Main content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      position: relative;
    }

    /* Mode title */
    .mode-title {
      text-align: center;
      margin-bottom: 46px;
      transition: opacity 0.4s ease;
    }
    .mode-name {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1.1;
    }

    /* Player circle */
    .player-wrapper {
      position: relative;
      width: 270px;
      height: 270px;
      margin-bottom: 20px;
    }
    .progress-ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
      filter: drop-shadow(0 4px 12px var(--accent-soft));
    }
    .progress-ring circle {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke 0.5s ease;
    }
    .progress-ring .track { stroke: var(--rule); }
    .progress-ring .progress { stroke: var(--accent); stroke-dasharray: 785; stroke-dashoffset: 785; transition: stroke-dashoffset 1s linear, stroke 0.5s ease; }

    .play-btn {
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, var(--accent-light), var(--accent));
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 56px var(--accent-soft);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, filter 0.3s ease;
      user-select: none;
    }
    .play-btn:hover { transform: scale(1.04); }
    .play-btn:active { transform: scale(0.97); }
    .play-btn.playing { animation: pulse 2.6s ease-in-out infinite; }
    .play-btn.generating { cursor: wait; filter: saturate(0.7); }
    .play-btn svg { width: 52px; height: 52px; fill: currentColor; transition: transform 0.3s ease; }
    .play-btn.playing svg { transform: scale(0.88); }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 20px 56px var(--accent-soft); }
      50% { box-shadow: 0 26px 68px var(--accent-soft); }
    }

    .timer-display {
      position: absolute;
      bottom: -44px;
      left: 50%;
      transform: translateX(-50%);
      font-variant-numeric: tabular-nums;
      font-size: 1.15rem;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .next-track {
      margin-top: 56px;
      padding: 11px 22px;
      border-radius: 999px;
      border: 1px solid var(--rule);
      background: var(--bg2);
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
      user-select: none;
    }
    .next-track:hover { border-color: var(--accent-light); background: var(--accent-soft); color: var(--accent); }
    .next-track:disabled { opacity: 0.45; cursor: not-allowed; color: var(--muted); }

    /* Mode selector */
    .mode-selector {
      display: flex;
      gap: 10px;
      padding: 0 24px 36px;
      overflow-x: auto;
      scrollbar-width: none;
      width: 100%;
      justify-content: center;
    }
    .mode-selector::-webkit-scrollbar { display: none; }
    .mode-chip {
      flex: 0 0 auto;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--rule);
      background: var(--bg2);
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.35s ease;
      white-space: nowrap;
      box-shadow: var(--shadow);
      user-select: none;
    }
    .mode-chip:hover { border-color: var(--accent-light); transform: translateY(-1px); }
    .mode-chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 8px 28px var(--accent-soft);
    }

    /* Ticker / long-press tooltip */
    .ticker {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      max-width: 86%;
      min-width: 180px;
      background: var(--accent);
      color: white;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
      white-space: nowrap;
      box-shadow: 0 10px 30px var(--accent-soft);
      z-index: 40;
    }
    .ticker.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .ticker-inner {
      display: inline-block;
      padding-right: 24px;
    }
    .ticker.scroll .ticker-inner {
      animation: tickerScroll 6s linear infinite;
    }
    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Stats view */
    .stats-view {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 28px;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .stats-view.open { transform: translateY(0); }
    .stats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .stats-title { font-size: 1.35rem; font-weight: 700; color: var(--ink); }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg2);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      transition: color 0.5s ease;
    }
    .stat-label { font-size: 0.78rem; color: var(--muted); }
    .stat-bars {
      background: var(--bg2);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      flex: 1;
    }
    .stat-bars h3 { font-size: 0.95rem; margin-bottom: 18px; color: var(--ink); }
    .bar-item { margin-bottom: 18px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--ink); margin-bottom: 6px; }
    .bar-label span:last-child { color: var(--muted); }
    .bar-track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; width: 0; transition: width 0.6s ease, background 0.5s ease; }

    /* Settings panel */
    .settings-overlay {
      position: absolute;
      inset: 0;
      background: var(--ink);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 20;
    }
    .settings-overlay.open { opacity: 0.12; pointer-events: auto; }
    .settings-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px 32px 0 0;
      padding: 30px 28px 44px;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 21;
      box-shadow: 0 -8px 48px var(--accent-soft);
    }
    .settings-panel.open { transform: translateY(0); }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .settings-title { font-size: 1.15rem; font-weight: 700; color: var(--ink); }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 17px 0;
      border-bottom: 1px solid var(--rule);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-info h4 { font-size: 0.92rem; margin-bottom: 4px; color: var(--ink); font-weight: 600; }
    .setting-info p { font-size: 0.78rem; color: var(--muted); }

    /* Toggle */
    .toggle {
      width: 50px;
      height: 28px;
      border-radius: 999px;
      background: var(--rule);
      position: relative;
      cursor: pointer;
      transition: background 0.35s ease;
      flex-shrink: 0;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transition: transform 0.35s ease;
    }
    .toggle.on { background: var(--accent); }
    .toggle.on::after { transform: translateX(22px); }

    .cache-action {
      font-size: 0.8rem;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }
    .cache-action:hover { opacity: 0.7; }

    /* Toast */
    .toast {
      position: absolute;
      top: 88px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--ink);
      color: white;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 50;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 380px) {
      .mode-name { font-size: 2.1rem; }
      .player-wrapper { width: 240px; height: 240px; }
      .play-btn svg { width: 46px; height: 46px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo-icon">🌿</div>
      <div style="display: flex; gap: 12px;">
        <button class="icon-btn" id="statsBtn" title="统计">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="设置">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="mode-title">
        <div class="mode-name" id="modeName">深度专注</div>
      </div>

      <div class="player-wrapper">
        <svg class="progress-ring" viewBox="0 0 270 270">
          <circle class="track" cx="135" cy="135" r="125"></circle>
          <circle class="progress" id="progressCircle" cx="135" cy="135" r="125"></circle>
        </svg>
        <button class="play-btn" id="playBtn" aria-label="播放">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="timer-display" id="timerDisplay">25:00</div>
      </div>

      <button class="next-track" id="nextTrackBtn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        换一首
      </button>
    </main>

    <nav class="mode-selector" id="modeSelector">
      <button class="mode-chip active" data-mode="focus">深度专注</button>
      <button class="mode-chip" data-mode="read">阅读学习</button>
      <button class="mode-chip" data-mode="create">创意工作</button>
      <button class="mode-chip" data-mode="rest">放松休息</button>
    </nav>

    <!-- Long-press ticker -->
    <div class="ticker" id="ticker">
      <div class="ticker-inner" id="tickerInner"></div>
    </div>

    <!-- Stats View -->
    <section class="stats-view" id="statsView">
      <div class="stats-header">
        <h2 class="stats-title">专注统计</h2>
        <button class="icon-btn" id="closeStatsBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="statTotal">12.5h</div>
          <div class="stat-label">本周专注</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statStreak">5</div>
          <div class="stat-label">连续天数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statToday">2.5h</div>
          <div class="stat-label">今日专注</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statSessions">8</div>
          <div class="stat-label">今日次数</div>
        </div>
      </div>
      <div class="stat-bars">
        <h3>场景分布</h3>
        <div class="bar-item">
          <div class="bar-label"><span>深度专注</span><span>45%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:45%"></div></div>
        </div>
        <div class="bar-item">
          <div class="bar-label"><span>阅读学习</span><span>30%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:30%"></div></div>
        </div>
        <div class="bar-item">
          <div class="bar-label"><span>创意工作</span><span>15%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:15%"></div></div>
        </div>
        <div class="bar-item">
          <div class="bar-label"><span>放松休息</span><span>10%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:10%"></div></div>
        </div>
      </div>
    </section>

    <!-- Settings Panel -->
    <div class="settings-overlay" id="settingsOverlay"></div>
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-header">
        <h3 class="settings-title">设置</h3>
        <button class="icon-btn" id="closeSettingsBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <h4>AI 实时生成</h4>
          <p>根据状态自动调用云 API 生成音乐</p>
        </div>
        <div class="toggle on" id="aiGenToggle"></div>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <h4>高品质音频</h4>
          <p>生成更高音质，消耗更多额度</p>
        </div>
        <div class="toggle" id="qualityToggle"></div>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <h4>本地缓存</h4>
          <p id="cacheCount">已缓存 0 首</p>
        </div>
        <span class="cache-action" id="clearCacheBtn">清除</span>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <h4>勿扰模式</h4>
          <p>播放时隐藏通知</p>
        </div>
        <div class="toggle" id="dndToggle"></div>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <h4>屏幕常亮</h4>
          <p>专注时保持亮屏</p>
        </div>
        <div class="toggle on" id="screenToggle"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    // Full color palettes for each mode - no pure white
    const palettes = {
      focus: {
        bg: '#F3F6F4', bg2: '#E8F0EB', ink: '#1C2B24', muted: '#6B7D73',
        accent: '#2D6A4F', accentLight: '#74C69D'
      },
      read: {
        bg: '#F2F5F8', bg2: '#E8EEF4', ink: '#1C2834', muted: '#6B7D8C',
        accent: '#3A7CA5', accentLight: '#8FC1E3'
      },
      create: {
        bg: '#FAF5F0', bg2: '#F5EBE2', ink: '#2E241C', muted: '#8C7B6B',
        accent: '#C78D5B', accentLight: '#E9B87A'
      },
      rest: {
        bg: '#F5F3F8', bg2: '#EDEAF2', ink: '#27222E', muted: '#7A7285',
        accent: '#8B7EAA', accentLight: '#B8AED1'
      }
    };

    const modes = {
      focus: {
        name: '深度专注',
        desc: '屏蔽干扰，进入心流',
        bpm: 70,
        keywords: ['极简钢琴', '低频铺底', '重复循环', '无歌词', '克制', '深沉', '冥想氛围', '慢速电子'],
        preset: 'Minimal ambient piano, slow electronic pad, no vocals, meditative focus'
      },
      read: {
        name: '阅读学习',
        desc: '舒缓旋律，延长专注',
        bpm: 80,
        keywords: ['舒缓钢琴', '弦乐', '轻吉他', '清晰', '柔和', '学院氛围', '午后阳光', '阅读背景'],
        preset: 'Soft piano and strings, gentle guitar, calm study atmosphere, no lyrics'
      },
      create: {
        name: '创意工作',
        desc: '轻快律动，激发灵感',
        bpm: 95,
        keywords: ['轻电子', '爵士钢琴', '世界音乐', '律动', '启发', '暖色调', '创意流动', '轻快节奏'],
        preset: 'Light electronic jazz piano, warm groove, world music elements, uplifting instrumental'
      },
      rest: {
        name: '放松休息',
        desc: '自然氛围，舒缓身心',
        bpm: 60,
        keywords: ['自然采样', '风声', '溪流', '慢速旋律', '放松', '睡眠', '疗愈', '氛围铺底'],
        preset: 'Nature ambient, soft wind and stream textures, slow healing pads, instrumental relaxation'
      }
    };

    const timerPresets = [15, 25, 45, 60];
    let currentPresetIndex = 1;
    let timeLeft = timerPresets[currentPresetIndex] * 60;
    let totalTime = timeLeft;
    let isPlaying = false;
    let isGenerating = false;
    let timerInterval = null;
    let currentMode = 'focus';
    let aiGenerationEnabled = true;
    let cachedCount = 0;
    let currentPrompt = '';

    // Audio engine
    let audioCtx = null;
    let masterGain = null;
    let sequenceInterval = null;
    let activeNodes = [];

    // DOM
    const root = document.documentElement;
    const body = document.body;
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressCircle = document.getElementById('progressCircle');
    const timerDisplay = document.getElementById('timerDisplay');
    const modeName = document.getElementById('modeName');
    const nextTrackBtn = document.getElementById('nextTrackBtn');
    const modeChips = document.querySelectorAll('.mode-chip');
    const ticker = document.getElementById('ticker');
    const tickerInner = document.getElementById('tickerInner');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const statsBtn = document.getElementById('statsBtn');
    const statsView = document.getElementById('statsView');
    const closeStatsBtn = document.getElementById('closeStatsBtn');
    const toast = document.getElementById('toast');
    const aiGenToggle = document.getElementById('aiGenToggle');
    const qualityToggle = document.getElementById('qualityToggle');
    const dndToggle = document.getElementById('dndToggle');
    const screenToggle = document.getElementById('screenToggle');
    const cacheCount = document.getElementById('cacheCount');
    const clearCacheBtn = document.getElementById('clearCacheBtn');
    const logoIcon = document.querySelector('.logo-icon');

    const CIRCUMFERENCE = 2 * Math.PI * 125;
    progressCircle.style.strokeDasharray = CIRCUMFERENCE;
    progressCircle.style.strokeDashoffset = CIRCUMFERENCE;

    function updateProgress() {
      const pct = timeLeft / totalTime;
      progressCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    let tickerTimer = null;
    function showTicker(text) {
      clearTimeout(tickerTimer);
      tickerInner.innerHTML = `<span>${text}</span><span>${text}</span>`;
      ticker.classList.add('show');
      // Enable scroll if text is long
      const firstSpan = tickerInner.querySelector('span');
      ticker.classList.toggle('scroll', firstSpan && firstSpan.offsetWidth > 220);
      tickerTimer = setTimeout(() => ticker.classList.remove('show'), 3000);
    }

    function setMode(mode) {
      currentMode = mode;
      const palette = palettes[mode];

      root.style.setProperty('--bg', palette.bg);
      root.style.setProperty('--bg2', palette.bg2);
      root.style.setProperty('--ink', palette.ink);
      root.style.setProperty('--muted', palette.muted);
      root.style.setProperty('--rule', hexToRgba(palette.muted, 0.16));
      root.style.setProperty('--accent', palette.accent);
      root.style.setProperty('--accent-light', palette.accentLight);
      root.style.setProperty('--accent-soft', hexToRgba(palette.accent, 0.14));
      body.style.background = palette.bg;

      modeName.textContent = modes[mode].name;

      modeChips.forEach(chip => {
        chip.classList.toggle('active', chip.dataset.mode === mode);
      });

      logoIcon.style.background = palette.accent;

      if (isPlaying) {
        stopAllNodes();
        playSequencer();
        startGeneration(true);
      } else {
        currentPrompt = '';
        nextTrackBtn.disabled = true;
      }
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function shuffle(array) {
      return array.slice().sort(() => Math.random() - 0.5);
    }

    function generatePrompt(mode) {
      const picks = shuffle(modes[mode].keywords).slice(0, 3);
      return `${modes[mode].name}，${picks.join('，')}，无歌词，纯音乐`;
    }

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.22;
      masterGain.connect(audioCtx.destination);
    }

    function stopAllNodes() {
      const now = audioCtx ? audioCtx.currentTime : 0;
      activeNodes.forEach(n => {
        try {
          if (n.stop) n.stop(now + 0.1);
          if (n.disconnect) n.disconnect();
        } catch(e) {}
      });
      activeNodes = [];
      if (sequenceInterval) { clearInterval(sequenceInterval); sequenceInterval = null; }
    }

    function stopPlayback() {
      isPlaying = false;
      clearInterval(timerInterval);
      stopAllNodes();
      playBtn.classList.remove('playing');
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }

    function playSequencer() {
      if (!audioCtx) return;
      stopAllNodes();

      const config = modes[currentMode];
      const baseFreqs = {
        focus: [110.00, 130.81, 164.81, 196.00],
        read: [196.00, 246.94, 293.66, 349.23],
        create: [261.63, 329.63, 392.00, 493.88],
        rest: [82.41, 98.00, 123.47, 146.83]
      };
      const freqs = baseFreqs[currentMode];
      const beatMs = 60000 / config.bpm;
      let step = 0;

      function playChord() {
        const now = audioCtx.currentTime;
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = currentMode === 'create' ? 'triangle' : 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.045 * (i === 0 ? 1.2 : 1), now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (beatMs * 3.5 / 1000));
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(now);
          osc.stop(now + (beatMs * 4 / 1000));
          activeNodes.push(osc, gain);
        });
      }

      function playKick() {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.16);
        activeNodes.push(osc, gain);
      }

      function playHiHat() {
        const now = audioCtx.currentTime;
        const bufferSize = audioCtx.sampleRate * 0.05;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 7000;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        noise.start(now);
        noise.stop(now + 0.06);
        activeNodes.push(noise, filter, gain);
      }

      playChord();
      sequenceInterval = setInterval(() => {
        if (!isPlaying) return;
        playChord();
        if (step % 2 === 0) playKick();
        if (step % 4 === 2) playHiHat();
        step++;
      }, beatMs * 4);
    }

    function startGeneration(autoPlayAfter) {
      if (isGenerating) return;
      isGenerating = true;
      playBtn.classList.add('generating');
      playBtn.disabled = true;
      nextTrackBtn.disabled = true;
      playIcon.innerHTML = '<div class="spinner"></div>';

      currentPrompt = aiGenerationEnabled ? generatePrompt(currentMode) : modes[currentMode].preset;
      showTicker('AI 生成中：' + currentPrompt);

      const delay = aiGenerationEnabled ? 1800 + Math.random() * 1400 : 400;
      setTimeout(() => {
        isGenerating = false;
        playBtn.classList.remove('generating');
        playBtn.disabled = false;
        nextTrackBtn.disabled = false;
        cachedCount = Math.min(cachedCount + 1, 12);
        updateCacheDisplay();

        if (autoPlayAfter) {
          isPlaying = true;
          playBtn.classList.add('playing');
          playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
          playSequencer();
          startTimer();
        }
      }, delay);
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          timerDisplay.textContent = formatTime(timeLeft);
          updateProgress();
        } else {
          completeSession();
        }
      }, 1000);
    }

    function togglePlay() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (isGenerating) return;

      if (isPlaying) {
        stopPlayback();
      } else {
        if (!currentPrompt) {
          startGeneration(true);
        } else {
          isPlaying = true;
          playBtn.classList.add('playing');
          playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
          playSequencer();
          startTimer();
        }
      }
    }

    function nextTrack() {
      if (isGenerating) return;
      stopAllNodes();
      startGeneration(isPlaying);
    }

    function completeSession() {
      stopPlayback();
      showToast('专注完成');
      timeLeft = totalTime;
      timerDisplay.textContent = formatTime(timeLeft);
      updateProgress();
      currentPrompt = '';
      nextTrackBtn.disabled = true;
    }

    function updateCacheDisplay() {
      cacheCount.textContent = `已缓存 ${cachedCount} 首`;
    }

    // Long press helper
    function bindPress(el, onClick, onLongPress) {
      let timer = null;
      let isLongPress = false;
      const start = (e) => {
        if (e.button && e.button !== 0) return;
        isLongPress = false;
        timer = setTimeout(() => {
          isLongPress = true;
          if (onLongPress) onLongPress();
        }, 500);
      };
      const end = (e) => {
        clearTimeout(timer);
        if (!isLongPress && onClick) onClick();
        isLongPress = false;
      };
      const cancel = () => {
        clearTimeout(timer);
        isLongPress = false;
      };
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', end);
      el.addEventListener('pointerleave', cancel);
      el.addEventListener('pointercancel', cancel);
      el.addEventListener('contextmenu', e => e.preventDefault());
    }

    // Mode chips: click to switch, long press to show description
    modeChips.forEach(chip => {
      const mode = chip.dataset.mode;
      bindPress(chip, () => setMode(mode), () => showTicker(modes[mode].desc));
    });

    // Play button: long press to show prompt
    bindPress(playBtn, togglePlay, () => {
      if (currentPrompt) showTicker(currentPrompt);
      else showTicker('轻触开始生成音乐');
    });

    // Next track button: long press to show hint
    bindPress(nextTrackBtn, () => {
      if (!nextTrackBtn.disabled) nextTrack();
    }, () => showTicker('长按已触发：重新生成一首匹配音乐'));

    timerDisplay.addEventListener('click', () => {
      if (isPlaying || isGenerating) return;
      currentPresetIndex = (currentPresetIndex + 1) % timerPresets.length;
      totalTime = timerPresets[currentPresetIndex] * 60;
      timeLeft = totalTime;
      timerDisplay.textContent = formatTime(timeLeft);
      updateProgress();
    });

    function openSettings() {
      settingsOverlay.classList.add('open');
      settingsPanel.classList.add('open');
      settingsBtn.classList.add('active');
    }
    function closeSettings() {
      settingsOverlay.classList.remove('open');
      settingsPanel.classList.remove('open');
      settingsBtn.classList.remove('active');
    }
    settingsBtn.addEventListener('click', openSettings);
    closeSettingsBtn.addEventListener('click', closeSettings);
    settingsOverlay.addEventListener('click', closeSettings);

    function openStats() {
      statsView.classList.add('open');
      statsBtn.classList.add('active');
    }
    function closeStats() {
      statsView.classList.remove('open');
      statsBtn.classList.remove('active');
    }
    statsBtn.addEventListener('click', openStats);
    closeStatsBtn.addEventListener('click', closeStats);

    function bindToggle(el, callback) {
      el.addEventListener('click', () => {
        el.classList.toggle('on');
        if (callback) callback(el.classList.contains('on'));
      });
    }
    bindToggle(aiGenToggle, on => {
      aiGenerationEnabled = on;
      showToast(on ? '已开启 AI 实时生成' : '已切换至预置曲');
    });
    bindToggle(qualityToggle, on => {
      const label = qualityToggle.previousElementSibling.querySelector('p');
      label.textContent = on ? '生成更高音质，消耗更多额度' : '标准音质，节省生成成本';
      showToast(on ? '已切换至高音质' : '已切换至标准音质');
    });
    bindToggle(dndToggle, on => showToast(on ? '勿扰模式已开启' : '勿扰模式已关闭'));
    bindToggle(screenToggle, on => showToast(on ? '屏幕常亮已开启' : '屏幕常亮已关闭'));

    clearCacheBtn.addEventListener('click', () => {
      cachedCount = 0;
      updateCacheDisplay();
      showToast('缓存已清除');
    });

    // Initialize
    timerDisplay.textContent = formatTime(timeLeft);
    updateProgress();
    updateCacheDisplay();
  </script>
</body>
</html>
