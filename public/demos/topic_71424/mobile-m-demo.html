<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>同城技匠 - M站Demo</title>
<style>
:root {
  --bg: #0a0a0f;
  --bg-soft: #13131a;
  --card: rgba(255,255,255,0.05);
  --card-hover: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.15);
  --text: #ffffff;
  --text-sec: rgba(255,255,255,0.7);
  --text-muted: rgba(255,255,255,0.45);
  --brand: #8b5cf6;
  --brand-2: #3b82f6;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
#app { height: 100%; position: relative; }
.page { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; background: var(--bg); }
.page.active { display: flex; }
.page.with-tab { padding-bottom: calc(64px + var(--safe-bottom)); }
.page-content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.page-content::-webkit-scrollbar { display: none; }

/* Splash */
.splash-screen { background: linear-gradient(135deg, #1a103c 0%, #0a0a0f 100%); display: flex !important; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 100; }
.splash-logo { width: 96px; height: 96px; border-radius: 28px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); display: flex; align-items: center; justify-content: center; font-size: 48px; margin-bottom: 24px; box-shadow: 0 16px 48px rgba(139,92,246,0.35); }
.splash-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.splash-sub { color: var(--text-sec); font-size: 15px; margin-bottom: 48px; }
.splash-btn { padding: 14px 56px; border-radius: 28px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; font-size: 16px; font-weight: 600; border: none; }

/* Login */
.login-screen { background: linear-gradient(180deg, #1a103c 0%, var(--bg) 60%); padding: 80px 32px 32px; }
.login-title { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
.login-sub { color: var(--text-sec); margin-bottom: 40px; font-size: 15px; }
.login-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }
.login-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.login-input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text); font-size: 15px; margin-bottom: 20px; outline: none; }
.login-input:focus { border-color: var(--brand); }
.role-select { display: flex; gap: 12px; margin-bottom: 24px; }
.role-option { flex: 1; padding: 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: var(--radius-md); text-align: center; cursor: pointer; transition: all .2s; }
.role-option.active { border-color: var(--brand); background: rgba(139,92,246,0.12); }
.role-option .emoji { font-size: 28px; display: block; margin-bottom: 6px; }
.role-option .txt { font-size: 14px; color: var(--text-sec); }
.login-btn { width: 100%; padding: 16px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; font-size: 16px; font-weight: 600; border: none; }

/* Header */
.page-header { position: sticky; top: 0; z-index: 20; background: rgba(10,10,15,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.page-header h1 { flex: 1; font-size: 18px; font-weight: 700; text-align: center; }
.back-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.06); border: none; color: var(--text); display: flex; align-items: center; justify-content: center; }
.header-action { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.06); border: none; color: var(--text); display: flex; align-items: center; justify-content: center; }

/* Feed */
.feed-page { padding: 0; }
.feed-header { position: absolute; top: var(--safe-top); left: 0; right: 0; z-index: 20; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); }
.feed-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.feed-chips { display: flex; gap: 8px; }
.feed-chip { padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: var(--text-sec); font-size: 13px; }
.feed-chip.active { background: var(--text); color: var(--bg); font-weight: 600; }
.feed-search { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.12); border: none; color: var(--text); display: flex; align-items: center; justify-content: center; }

.feed-swiper { flex: 1; position: relative; overflow: hidden; }
.feed-slide { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .3s; }
.feed-slide.active { opacity: 1; pointer-events: auto; }
.feed-video { width: 100%; height: 100%; object-fit: cover; background: #000; }
.feed-cover { position: absolute; inset: 0; background-size: cover; background-position: center; }
.feed-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 40%, rgba(0,0,0,0.2) 100%); }

.feed-hud { position: absolute; bottom: 100px; left: 16px; right: 88px; z-index: 10; }
.feed-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px); font-size: 12px; }
.pill.ai { background: linear-gradient(135deg, rgba(139,92,246,0.85), rgba(59,130,246,0.85)); color: #fff; border: none; animation: aiPulse 2s infinite; }
@keyframes aiPulse { 0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,0.3)} 50%{box-shadow:0 0 12px 2px rgba(139,92,246,0.4)} }
.pill.primary { background: rgba(255,255,255,0.2); color: #fff; }
.feed-h1 { font-size: 18px; font-weight: 700; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
.feed-h2 { font-size: 14px; color: var(--text-sec); margin-bottom: 4px; }
.feed-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

.feed-actions { position: absolute; right: 12px; bottom: 110px; z-index: 10; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.feed-action { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.feed-action-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-size: 22px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
.feed-action-btn.liked { background: var(--danger); }
.feed-action-btn.bookmarked { background: var(--warning); color: #000; }
.feed-action-label { font-size: 11px; color: var(--text-sec); }
.feed-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }

.feed-nav-dots { position: absolute; top: calc(var(--safe-top) + 60px); left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 8px; }
.feed-nav-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); }
.feed-nav-dot.active { background: #fff; width: 18px; border-radius: 3px; }

/* Bottom Tab */
.tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: calc(64px + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); font-size: 11px; border: none; background: transparent; }
.tab-item.active { color: var(--brand); }
.tab-item.mid { margin-top: -24px; }
.tab-mid-btn { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; border: 4px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 8px 24px rgba(139,92,246,0.35); }

/* Cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
.card-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }

/* Talent Page */
.talent-hero { position: relative; height: 180px; background: linear-gradient(135deg, #1a103c, #0f172a); }
.talent-hero-content { position: absolute; bottom: -40px; left: 16px; right: 16px; display: flex; align-items: flex-end; gap: 16px; }
.talent-avatar-lg { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 4px solid var(--bg); }
.talent-info { flex: 1; padding-bottom: 8px; }
.talent-name { font-size: 20px; font-weight: 800; }
.talent-meta { font-size: 13px; color: var(--text-sec); margin-top: 4px; }
.talent-body { padding: 56px 16px 16px; }
.talent-section { margin-bottom: 20px; }
.talent-section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.talent-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { padding: 6px 12px; border-radius: 20px; background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.25); color: #c4b5fd; font-size: 13px; }
.tag.light { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--text-sec); }
.talent-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.talent-stat { text-align: center; padding: 12px; background: var(--card); border-radius: var(--radius-md); }
.talent-stat .num { font-size: 20px; font-weight: 800; color: var(--brand); }
.talent-stat .lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.talent-videos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.talent-video-thumb { aspect-ratio: 9/16; border-radius: var(--radius-md); background-size: cover; background-position: center; position: relative; overflow: hidden; }
.talent-video-thumb .dist { position: absolute; bottom: 6px; left: 6px; padding: 2px 8px; background: rgba(0,0,0,0.6); border-radius: 10px; font-size: 11px; }
.talent-bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px calc(12px + var(--safe-bottom)); background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; gap: 12px; }
.btn { flex: 1; padding: 14px; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; border: none; text-align: center; }
.btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; }
.btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--border); }

/* Lead Form */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.form-input, .form-textarea, .form-select { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text); font-size: 15px; outline: none; }
.form-input:focus, .form-textarea:focus { border-color: var(--brand); }
.form-textarea { min-height: 90px; resize: none; }
.budget-options { display: flex; flex-wrap: wrap; gap: 8px; }
.budget-opt { padding: 8px 14px; border-radius: 20px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-sec); font-size: 13px; cursor: pointer; }
.budget-opt.active { background: rgba(139,92,246,0.15); border-color: var(--brand); color: #c4b5fd; }

/* Messages */
.conv-list { padding: 12px 16px; }
.conv-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.conv-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
.conv-main { flex: 1; min-width: 0; }
.conv-name { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
.conv-time { font-size: 12px; color: var(--text-muted); font-weight: 400; }
.conv-msg { font-size: 13px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; }

/* Chat */
.chat-page { padding: 0; }
.chat-header { position: absolute; top: var(--safe-top); left: 0; right: 0; z-index: 20; padding: 10px 12px; display: flex; align-items: center; gap: 10px; background: rgba(10,10,15,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.chat-title { flex: 1; }
.chat-name { font-size: 16px; font-weight: 700; }
.chat-role { font-size: 12px; color: var(--text-muted); }
.chat-ai-toggle { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(59,130,246,0.3)); border: 1px solid rgba(139,92,246,0.4); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.chat-ai-panel { background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,27,75,0.9)); border-bottom: 1px solid rgba(139,92,246,0.2); padding: 12px 16px; }
.chat-ai-actions { display: flex; gap: 8px; margin-bottom: 10px; }
.ai-btn { flex: 1; padding: 10px; background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.3); border-radius: var(--radius-md); color: #fff; font-size: 13px; }
.ai-result { background: rgba(255,255,255,0.04); border-radius: var(--radius-md); padding: 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.6; }
.ai-result-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.ai-chip { display: block; width: 100%; text-align: left; padding: 10px; background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; margin-bottom: 6px; }

.lead-card { margin: 12px 16px; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.lead-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.lead-status { padding: 3px 10px; border-radius: 12px; font-size: 12px; background: rgba(245,158,11,0.15); color: var(--warning); }
.lead-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sec); margin-bottom: 6px; }
.lead-actions { display: flex; gap: 10px; margin-top: 12px; }

.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 10px; max-width: 80%; }
.msg.own { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-2)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.msg-bubble { padding: 10px 14px; border-radius: var(--radius-lg); background: rgba(255,255,255,0.08); font-size: 14px; line-height: 1.5; }
.msg.own .msg-bubble { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; }
.msg-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.msg.system { align-self: center; max-width: 90%; }
.msg.system .msg-bubble { background: rgba(255,255,255,0.05); color: var(--text-muted); font-size: 12px; }

.chat-input-bar { padding: 10px 12px calc(10px + var(--safe-bottom)); background: rgba(10,10,15,0.95); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
.chat-input { flex: 1; padding: 12px 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 15px; max-height: 100px; outline: none; }
.chat-send { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-2)); border: none; color: #fff; display: flex; align-items: center; justify-content: center; }

/* Search */
.search-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; background: var(--bg-soft); border-bottom: 1px solid var(--border); }
.search-box { flex: 1; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 22px; }
.search-box input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 15px; outline: none; }
.search-box input::placeholder { color: var(--text-muted); }
.filter-bar { padding: 12px 16px; display: flex; gap: 10px; overflow-x: auto; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-pill { padding: 8px 14px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-sec); font-size: 13px; white-space: nowrap; }
.filter-pill.active { background: rgba(139,92,246,0.15); border-color: var(--brand); color: #c4b5fd; }
.results { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.result-card { display: flex; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.result-thumb { width: 90px; height: 120px; border-radius: var(--radius-md); background-size: cover; background-position: center; position: relative; flex-shrink: 0; }
.result-thumb .ai-tag { position: absolute; top: 6px; left: 6px; padding: 2px 6px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); border-radius: 8px; font-size: 10px; }
.result-thumb .dist { position: absolute; bottom: 6px; right: 6px; padding: 2px 6px; background: rgba(0,0,0,0.6); border-radius: 8px; font-size: 10px; }
.result-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.result-title { font-size: 15px; font-weight: 600; }
.result-meta { font-size: 13px; color: var(--text-sec); }

/* Member */
.member-banner { padding: 32px 24px; background: linear-gradient(135deg, #1a103c, #0f172a); text-align: center; }
.member-banner h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.member-banner p { color: var(--text-sec); font-size: 14px; }
.member-plans { padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
.plan-card { padding: 20px; border-radius: var(--radius-lg); border: 2px solid var(--border); background: var(--card); position: relative; }
.plan-card.pop { border-color: var(--brand); }
.plan-badge { position: absolute; top: -10px; right: 16px; padding: 4px 12px; background: var(--brand); border-radius: 12px; font-size: 11px; font-weight: 600; }
.plan-price { font-size: 32px; font-weight: 800; margin: 8px 0; }
.plan-price span { font-size: 14px; color: var(--text-muted); font-weight: 400; }
.plan-feature { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-sec); margin-bottom: 8px; }

/* Me */
.me-header { padding: 40px 20px 24px; background: linear-gradient(135deg, #1a103c, #0f172a); text-align: center; }
.me-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--brand); margin-bottom: 12px; }
.me-name { font-size: 22px; font-weight: 800; }
.me-role { display: inline-block; margin-top: 6px; padding: 4px 12px; border-radius: 12px; background: rgba(139,92,246,0.15); color: #c4b5fd; font-size: 12px; }
.me-menu { padding: 16px; }
.me-menu-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; }
.me-menu-item .left { display: flex; align-items: center; gap: 12px; font-size: 15px; }

/* Review */
.review-form { padding: 16px; }
.review-dims { display: flex; flex-direction: column; gap: 14px; }
.review-dim { display: flex; justify-content: space-between; align-items: center; }
.review-dim span { font-size: 14px; color: var(--text-sec); }
.stars { display: flex; gap: 6px; }
.star { font-size: 22px; color: var(--text-muted); cursor: pointer; }
.star.active { color: var(--warning); }

/* Publish */
.publish-steps { padding: 16px; }
.upload-area { aspect-ratio: 9/16; max-height: 360px; border: 2px dashed var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-muted); margin-bottom: 16px; }
.upload-area.active { border-color: var(--brand); color: var(--text); }

/* Map Placeholder */
.map-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text-sec); text-align: center; padding: 40px; }
.map-placeholder .icon { font-size: 64px; }

/* Toast */

// ===== 工具函数 =====
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function getAiTag(score, dist) {
  if (score > 1.2) return '🔥 AI精选';
  if (score > 0.8) return '✨ 附近优选';
  if (dist < 0.5) return '📍 近在咫尺';
  return '';
}
function calcScore(item) {
  const dist = item.distanceKm;
  const distScore = 1 / Math.max(0.2, dist);
  const hotScore = 0.4 + Math.random() * 0.4;
  const freshScore = 0.5 + Math.random() * 0.5;
  return 0.45 * distScore + 0.35 * hotScore + 0.20 * freshScore;
}
const processedVideos = VIDEOS.map(v => {
  const score = calcScore(v);
  return { ...v, score, aiTag: getAiTag(score, v.distanceKm) };
}).sort((a, b) => b.score - a.score);

// ===== 路由 =====
function go(screen, opts = {}) {
  state.screen = screen;
  if (opts.talentId) state.currentTalentId = opts.talentId;
  if (opts.conversationId) state.currentConversationId = opts.conversationId;
  render();
}

// ===== 渲染框架 =====
function render() {
  const app = $('#app');
  app.innerHTML = '';
  if (state.screen === 'splash') app.appendChild(renderSplash());
  else if (state.screen === 'login') app.appendChild(renderLogin());
  else {
    app.appendChild(renderPage());
    app.appendChild(renderTabBar());
  }
  bindEvents();
}

function renderSplash() {

  `;

}

function renderLogin() {

function renderPage() {
  const div = document.createElement('div');
  const screensWithTab = ['feed','map','messages','me'];
  const withTab = screensWithTab.includes(state.screen);
  div.className = `page ${withTab ? 'with-tab' : ''} active ${state.screen}-page`;
  switch (state.screen) {
    case 'feed': div.appendChild(renderFeed()); break;
    case 'talent': div.appendChild(renderTalent()); break;
    case 'lead': div.appendChild(renderLead()); break;
    case 'messages': div.appendChild(renderMessages()); break;
    case 'chat': div.appendChild(renderChat()); break;

    case 'member': div.appendChild(renderMember()); break;
    case 'review': div.appendChild(renderReview()); break;
    case 'me': div.appendChild(renderMe()); break;
    case 'publish': div.appendChild(renderPublish()); break;
    case 'map': div.appendChild(renderMap()); break;
    default: div.appendChild(renderFeed());
  }
  return div;
}

function renderTabBar() {
  const bar = document.createElement('div');

  const tabs = [

    { id: 'map', label: '地图', icon: '🗺️' },

    { id: 'messages', label: '消息', icon: '💬' },
    { id: 'me', label: '我的', icon: '👤' }
  ];
  bar.innerHTML = tabs.map(t => {

    return `<button class="tab-item ${state.screen === t.id ? 'active' : ''}" data-tab="${t.id}"><span style="font-size:20px">${t.icon}</span><span>${t.label}</span></button>`;
  }).join('');
  return bar;
}

// ===== Feed =====
function renderFeed() {
  const page = document.createElement('div');

      <div style="display:flex;align-items:center;gap:8px">
        <div class="feed-chips">${channels.map(c => `<button class="feed-chip ${state.feedChannel === c ? 'active' : ''}" data-channel="${c}">${c}</button>`).join('')}</div>

    <div class="feed-nav-dots">${channels.map((c,i) => `<div class="feed-nav-dot ${state.feedChannel === c ? 'active' : ''}"></div>`).join('')}</div>

function renderFeedSlide(v, i) {

      <div class="feed-shade"></div>
      <div class="feed-hud">
        <div class="feed-badges">
          <span class="pill primary">📍 ${v.distanceKm}km</span>
          <span class="pill">${v.skillTag}</span>
          ${v.aiTag ? `<span class="pill ai">${v.aiTag}</span>` : ''}
          ${v.serviceModes.map(m => `<span class="pill">${m}</span>`).join('')}
        </div>
        <div class="feed-h1">${escapeHtml(v.title)}</div>
        <div class="feed-h2">${talent.name} · Lv${talent.level}</div>
        <div class="feed-desc">${escapeHtml(v.desc)}</div>
      </div>
      <div class="feed-actions">
        <div class="feed-action">
          <img class="feed-avatar" src="${talent.avatar}" onclick="go('talent',{talentId:'${v.talentId}'})">
          <span class="feed-action-label">主页</span>
        </div>
        <div class="feed-action">
          <button class="feed-action-btn ${liked ? 'liked' : ''}" data-like="${v.id}">${liked ? '❤️' : '🤍'}</button>

        </div>
        <div class="feed-action">
          <button class="feed-action-btn ${bookmarked ? 'bookmarked' : ''}" data-bookmark="${v.id}">${bookmarked ? '⭐' : '☆'}</button>
          <span class="feed-action-label">收藏</span>
        </div>
        <div class="feed-action">
          <button class="feed-action-btn" data-lead="${v.talentId}">📋</button>
          <span class="feed-action-label">预约</span>
        </div>
      </div>
    </div>
  `;
}

function initFeedGestures() {
  const swiper = $('#feedSwiper');
  if (!swiper) return;
  let startY = 0;
  swiper.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  swiper.addEventListener('touchend', e => {
    const endY = e.changedTouches[0].clientY;
    const dy = startY - endY;
    if (Math.abs(dy) < 50) return;
    if (dy > 0 && state.feedIndex < processedVideos.length - 1) {
      state.feedIndex++;
      render();
    } else if (dy < 0 && state.feedIndex > 0) {
      state.feedIndex--;
      render();
    }
  }, { passive: true });
}

}

// ===== Search =====
function renderSearch() {
  const skills = ['全部', ...SKILL_TAGS];
  const distances = ['不限', '1km', '3km', '5km', '10km'];
  const sorts = ['智能推荐', '距离最近', '等级最高'];
  let results = processedVideos;
  if (state.searchKeyword) {
    const kw = state.searchKeyword.toLowerCase();
    results = results.filter(v => v.title.toLowerCase().includes(kw) || TALENTS[v.talentId].name.toLowerCase().includes(kw) || v.skillTag.includes(kw));
  }
  if (state.searchSkill !== '全部') results = results.filter(v => v.skillTag === state.searchSkill);
  if (state.searchDistance !== '不限') {
    const max = parseInt(state.searchDistance);
    results = results.filter(v => v.distanceKm <= max);
  }
  if (state.searchSort === '距离最近') results.sort((a,b) => a.distanceKm - b.distanceKm);
  else if (state.searchSort === '等级最高') results.sort((a,b) => TALENTS[b.talentId].level - TALENTS[a.talentId].level);
  else results.sort((a,b) => b.score - a.score);

  const div = document.createElement('div');
  div.className = 'page-content';
  div.innerHTML = `
    <div class="search-header">
      <button class="back-btn" data-back>←</button>
      <div class="search-box">
        <span>🔍</span>
        <input id="searchInput" placeholder="搜索手艺人、技能..." value="${escapeHtml(state.searchKeyword)}">
      </div>
    </div>
    <div class="filter-bar">
      ${skills.map(s => `<button class="filter-pill ${state.searchSkill === s ? 'active' : ''}" data-skill="${s}">${s}</button>`).join('')}
    </div>
    <div class="filter-bar">
      ${distances.map(d => `<button class="filter-pill ${state.searchDistance === d ? 'active' : ''}" data-dist="${d}">${d}</button>`).join('')}
    </div>
    <div class="filter-bar">
      ${sorts.map(s => `<button class="filter-pill ${state.searchSort === s ? 'active' : ''}" data-sort="${s}">${s}</button>`).join('')}
    </div>
    <div style="padding:0 16px 12px;color:var(--text-muted);font-size:13px">共找到 ${results.length} 位附近手艺人</div>
    <div class="results">
      ${results.map(v => {
        const t = TALENTS[v.talentId];
        return `
          <div class="result-card" data-result-talent="${v.talentId}">
            <div class="result-thumb" style="background-image:url('${v.cover}')">
              ${v.aiTag ? `<span class="ai-tag">${v.aiTag}</span>` : ''}
              <span class="dist">${v.distanceKm}km</span>
            </div>
            <div class="result-info">
              <div class="result-title">${escapeHtml(v.title)}</div>
              <div class="result-meta">${t.name} · Lv${t.level} · ${t.stats.rating}分</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
                <span class="tag" style="padding:2px 8px;font-size:11px">${v.skillTag}</span>
                ${v.serviceModes.map(m => `<span class="tag light" style="padding:2px 8px;font-size:11px">${m}</span>`).join('')}
              </div>
              <div style="font-size:13px;color:var(--brand);margin-top:4px">¥${t.priceMin}-${t.priceMax}</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
  const page = document.createElement('div');
  page.appendChild(div);
  return page;
}

// ===== 事件绑定 =====
function bindEvents() {
  // Tab bar
  $$('[data-tab]').forEach(btn => {
    btn.onclick = () => {
      const tab = btn.dataset.tab;
      if (tab === 'publish' && state.user.role !== 'talent') {
        toast('请先以达人身份登录');
        return;
      }
      go(tab);
    };
  });

  // Login
  const loginBtn = $('#loginBtn');
  if (loginBtn) {
    $$('.role-option').forEach(el => {
      el.onclick = () => {
        $$('.role-option').forEach(o => o.classList.remove('active'));
        el.classList.add('active');
      };
    });
    loginBtn.onclick = () => {
      const role = $('.role-option.active').dataset.role;
      const name = $('#loginName').value || '体验用户';
      state.user = { id: 'u1', name, role };
      go('feed');
    };
  }

  // Feed channel
  $$('[data-channel]').forEach(btn => {
    btn.onclick = () => { state.feedChannel = btn.dataset.channel; render(); };
  });

  // Search from feed
  const searchBtn = $('[data-action="search"]');
  if (searchBtn) searchBtn.onclick = () => go('search');

  // Like / Bookmark / Lead
  $$('[data-like]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.like;
      state.likes.has(id) ? state.likes.delete(id) : state.likes.add(id);
      render();
    };
  });
  $$('[data-bookmark]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.bookmark;
      state.bookmarks.has(id) ? state.bookmarks.delete(id) : state.bookmarks.add(id);
      render();
    };
  });
  $$('[data-lead]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      if (!state.user) return;
      go('lead', { talentId: btn.dataset.lead });
    };
  });

  // Back buttons
  $$('[data-back]').forEach(btn => {
    btn.onclick = () => {
      if (state.screen === 'lead' || state.screen === 'talent') go('feed');
      else if (state.screen === 'chat') go('messages');
      else if (state.screen === 'search') go('feed');
      else if (['member','review','publish'].includes(state.screen)) go('me');
      else go('feed');
    };
  });

  // Talent click from search/feed
  $$('[data-result-talent]').forEach(card => {
    card.onclick = () => go('talent', { talentId: card.dataset.resultTalent });
  });

  // Lead budget
  $$('.budget-opt').forEach(btn => {
    btn.onclick = () => {
      $$('.budget-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  // Submit lead
  const submitLead = $('#submitLead');
  if (submitLead) {
    submitLead.onclick = () => {
      const time = $('#leadTime').value;
      const address = $('#leadAddress').value;
      const note = $('#leadNote').value;
      const budget = $('.budget-opt.active').dataset.budget;
      const talentId = state.currentTalentId;
      const convId = 'c' + Date.now();
      state.conversations.unshift({
        id: convId,
        talentId,
        lastMsg: '已发送预约：' + note.slice(0, 20),
        time: '刚刚',
        unread: 0
      });
      state.messages[convId] = [
        { id: 'm0', type: 'system', text: '已发送需求，等待达人回复。' },
        { id: 'm1', type: 'text', sender: 'me', text: `预约时间：${time}\n地址：${address}\n预算：${budget}\n需求：${note}`, time: '刚刚' }
      ];
      state.leads.push({ time, address, note, budget, talentId });
      toast('预约成功，已创建会话');
      go('chat', { conversationId: convId });
    };
  }

  // Conversation click
  $$('[data-conv]').forEach(item => {
    item.onclick = () => {
      const convId = item.dataset.conv;
      const conv = state.conversations.find(c => c.id === convId);
      if (conv) conv.unread = 0;
      go('chat', { conversationId: convId });
    };
  });

  // Chat send
  const sendBtn = $('#sendMsg');
  if (sendBtn) {
    sendBtn.onclick = sendChatMsg;
    $('#chatInput').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMsg(); } };
  }

  // AI toggle
  const aiToggle = $('[data-ai-toggle]');
  if (aiToggle) {
    aiToggle.onclick = () => {
      state.showAiPanel = !state.showAiPanel;
      state.aiSummary = '';
      state.aiSuggestions = [];
      render();
    };
  }

  // AI summary
  const aiSummary = $('[data-ai-summary]');
  if (aiSummary) {
    aiSummary.onclick = () => {
      toast('AI 正在总结...');
      setTimeout(() => {
        state.aiSummary = '用户需要在 2026-07-06 上午9点，于浦东世纪花园处理厨房水管渗水问题，预算100-300元，希望尽快上门。';
        render();
      }, 600);
    };
  }

  // AI reply
  const aiReply = $('[data-ai-reply]');
  if (aiReply) {
    aiReply.onclick = () => {
      toast('AI 正在生成回复...');
      setTimeout(() => {
        state.aiSuggestions = [
          '您好！明天上午9点可以上门，我先检查一下水管接口。',
          '收到您的预约，厨房渗水问题一般1小时内可以解决，费用在预算范围内。',
          '好的，地址已记录。请问您方便我提前10分钟联系您吗？'
        ];
        render();
      }, 800);
    };
  }

  // Use suggestion
  $$('[data-use-suggestion]').forEach(btn => {
    btn.onclick = () => {
      $('#chatInput').value = btn.dataset.useSuggestion;
      state.aiSuggestions = [];
      render();
    };
  });

  // Search filters
  $('#searchInput') && ($('#searchInput').oninput = (e) => { state.searchKeyword = e.target.value; render(); });
  $$('[data-skill]').forEach(btn => {
    btn.onclick = () => { state.searchSkill = btn.dataset.skill; render(); };
  });
  $$('[data-dist]').forEach(btn => {
    btn.onclick = () => { state.searchDistance = btn.dataset.dist; render(); };
  });
  $$('[data-sort]').forEach(btn => {
    btn.onclick = () => { state.searchSort = btn.dataset.sort; render(); };
  });

  // Member tab
  $$('[data-member-tab]').forEach(btn => {
    btn.onclick = () => { state.memberTab = btn.dataset.memberTab; render(); };
  });

  // Me menu navigation
  $$('[data-go]').forEach(btn => {
    btn.onclick = () => go(btn.dataset.go);
  });

  // Talent chat button
  $$('[data-action="chat"]').forEach(btn => {
    btn.onclick = () => {
      const talentId = state.currentTalentId;
      let conv = state.conversations.find(c => c.talentId === talentId);
      if (!conv) {
        conv = { id: 'c' + Date.now(), talentId, lastMsg: '你好，想咨询一下服务', time: '刚刚', unread: 0 };
        state.conversations.unshift(conv);
        state.messages[conv.id] = [{ id: 'm0', type: 'system', text: '已创建会话，可以开始沟通。' }];
      }
      go('chat', { conversationId: conv.id });
    };
  });

  // Review stars
  $$('.star').forEach(star => {
    star.onclick = () => {
      const dim = star.parentElement;
      const val = parseInt(star.dataset.star);
      dim.querySelectorAll('.star').forEach(s => s.classList.toggle('active', parseInt(s.dataset.star) <= val));
    };
  });

  // Publish upload area
  const uploadArea = $('#uploadArea');
  if (uploadArea) {
    uploadArea.onclick = () => {
      uploadArea.classList.add('active');
      uploadArea.innerHTML = '<div style="font-size:48px">✅</div><div>已选择示例视频</div>';
    };
  }
  $$('.publish-tag').forEach(tag => {
    tag.onclick = () => tag.classList.toggle('light');
  });
}

function sendChatMsg() {
  const input = $('#chatInput');
  const text = input.value.trim();
  if (!text) return;
  const convId = state.currentConversationId;
  if (!state.messages[convId]) state.messages[convId] = [];
  state.messages[convId].push({ id: 'm' + Date.now(), type: 'text', sender: 'me', text, time: '刚刚' });
  const conv = state.conversations.find(c => c.id === convId);
  if (conv) conv.lastMsg = text;
  input.value = '';
  render();
  // Simulate reply
  setTimeout(() => {
    state.messages[convId].push({ id: 'm' + Date.now(), type: 'text', sender: 'other', text: '收到，我会尽快安排时间联系您。', time: '刚刚' });
    if (conv) conv.lastMsg = '收到，我会尽快安排时间联系您。';
    render();
  }, 1500);
}

// ===== 初始化 =====
render();
</script>
</body>
</html>
