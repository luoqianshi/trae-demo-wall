<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跑腿人首页 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="../login.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='../login.html'">← 选择角色</a>
      <h3>村里有人 · 跑腿人</h3>
      <a href="messages.html" style="position:relative;text-decoration:none;font-size:1.1rem;color:var(--ink);">💬
        <span id="msg-badge" style="position:absolute;top:-6px;right:-6px;min-width:14px;height:14px;background:var(--red);color:#fff;font-size:0.55rem;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:700;padding:0 3px;">0</span>
      </a>
    </div>
    <div class="screen-content">
      <!-- 头部 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <div>
          <p style="font-size:0.78rem;color:var(--muted);" id="greeting">下午好，</p>
          <h2 style="font-size:1.25rem;font-weight:800;" id="user-name">王大海</h2>
        </div>
      </div>

      <!-- 信誉卡片 -->
      <div class="card">
        <div class="card-title">🏅 我的信誉</div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="font-size:2.8rem;font-weight:800;color:var(--accent);line-height:1;" id="user-rating">4.9</div>
          <div>
            <div class="stars" style="font-size:1.1rem;" id="star-display">
              <span class="star active">★</span>
              <span class="star active">★</span>
              <span class="star active">★</span>
              <span class="star active">★</span>
              <span class="star active">★</span>
            </div>
            <p style="font-size:0.78rem;color:var(--muted);margin:4px 0 0;" id="user-meta">本村信得过 · 已服务32单</p>
          </div>
          <span class="tag tag-green" style="margin-left:auto;">小王村</span>
        </div>
      </div>

      <!-- 统计 -->
      <div class="runner-stats">
        <div class="runner-stat">
          <div class="stat-num" id="stat-today">¥0</div>
          <div class="stat-label">今日收入</div>
        </div>
        <div class="runner-stat">
          <div class="stat-num" id="stat-ongoing">0</div>
          <div class="stat-label">进行中</div>
        </div>
        <div class="runner-stat">
          <div class="stat-num" id="stat-completed">0</div>
          <div class="stat-label">累计完成</div>
        </div>
      </div>

      <!-- AI智能推荐 -->
      <div class="card" style="border:1.5px solid var(--purple);background:rgba(142,106,173,0.06);">
        <div class="card-title" style="color:var(--purple);">🤖 AI智能推荐</div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
          <div style="font-size:1.6rem;">✨</div>
          <div style="flex:1;">
            <div style="font-weight:600;font-size:0.9rem;">系统根据您的位置、技能和信誉，为您推荐以下任务</div>
            <div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">匹配度高 · 优先接单</div>
          </div>
          <span class="tag tag-purple">AI推荐</span>
        </div>
        <div id="ai-recommendations"></div>
      </div>

      <!-- 附近任务 -->
      <div class="section-title">
        <span>📍 附近任务</span>
        <span class="tag tag-green">小王村</span>
      </div>
      <div id="nearby-tasks"></div>
    </div>

    <!-- 底部导航 -->
    <div class="tab-bar">
      <a href="home.html" class="tab-item active">
        <span class="tab-icon">📋</span>
        <span>接单</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">📝</span>
        <span>我的</span>
      </a>
      <a href="earnings.html" class="tab-item">
        <span class="tab-icon">💰</span>
        <span>收入</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  setCurrentUser('runner1');

  // 动态问候语
  const hour = new Date().getHours();
  const greeting = hour < 6 ? '凌晨好' : hour < 11 ? '上午好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
  document.getElementById('greeting').textContent = greeting + '，';

  // 消息徽章
  const unread = getUnreadCount();
  const badge = document.getElementById('msg-badge');
  if (unread > 0) {
    badge.textContent = unread;
    badge.style.display = 'flex';
  }

  // 动态渲染用户信息
  document.getElementById('user-name').textContent = currentUser.name;
  document.getElementById('user-rating').textContent = currentUser.rating || 5.0;
  document.getElementById('user-meta').textContent = '本村信得过 · 已服务' + (currentUser.completed || 0) + '单';

  // 星星渲染
  const rating = currentUser.rating || 5.0;
  const starContainer = document.getElementById('star-display');
  const fullStars = Math.floor(rating);
  let starHTML = '';
  for (let i = 0; i < 5; i++) {
    starHTML += `<span class="star ${i < fullStars ? 'active' : ''}">★</span>`;
  }
  starContainer.innerHTML = starHTML;

  // 统计动态计算
  const todayIncome = DB.earnings.filter(e => e.date === '今天').reduce((sum, e) => sum + e.amount, 0);
  const ongoingCount = DB.tasks.filter(t => t.runnerId === 'runner1' && (t.status === 'ongoing' || t.status === 'delivering')).length;
  const completedCount = DB.tasks.filter(t => t.runnerId === 'runner1' && t.status === 'done').length;

  document.getElementById('stat-today').textContent = '¥' + todayIncome;
  document.getElementById('stat-ongoing').textContent = ongoingCount;
  document.getElementById('stat-completed').textContent = completedCount;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  const aiContainer = document.getElementById('ai-recommendations');
  const pendingTasks = getTasksByStatus('pending');
  
  function calculateMatch(task) {
    let base = 60;
    if (task.type === 'shop') base += 20;
    if (task.type === 'visit') base += 15;
    if (task.budget >= 50) base += 10;
    if (task.budget >= 80) base += 5;
    base += Math.floor(Math.random() * 10);
    return Math.min(100, base);
  }
  
  const aiTasks = pendingTasks
    .map(t => ({ ...t, match: calculateMatch(t) }))
    .sort((a, b) => b.match - a.match)
    .slice(0, 2);
  
  if (aiTasks.length === 0) {
    aiContainer.innerHTML = `
      <div style="text-align:center;padding:20px;color:var(--muted-light);font-size:0.85rem;">
        🤖 暂无AI推荐任务
      </div>`;
  } else {
    aiContainer.innerHTML = aiTasks.map(t => `
      <div style="background:rgba(255,255,255,0.7);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--rule);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span>${t.typeIcon}</span>
            <span style="font-weight:700;font-size:0.9rem;">${t.title}</span>
            <span class="tag tag-purple" style="font-size:0.55rem;">匹配 ${t.match}%</span>
          </div>
          <span style="font-weight:800;color:var(--accent);">¥${t.budget}</span>
        </div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:10px;">${t.desc}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:0.78rem;color:var(--muted);">${t.elderName} · ${t.address}</span>
          <a href="task-detail.html?id=${t.id}" class="btn btn-primary btn-sm">立即接单</a>
        </div>
      </div>
    `).join('');
  }

  const container = document.getElementById('nearby-tasks');
  const pending = getTasksByStatus('pending');

  if (pending.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <p>附近暂无新任务</p>
      </div>`;
  } else {
    container.innerHTML = pending.map(t => `
      <a href="task-detail.html?id=${t.id}" class="task-item">
        <div class="task-item-header">
          <span class="task-item-title">${t.typeIcon} ${t.title}</span>
          <span class="task-item-price">¥${t.budget}</span>
        </div>
        <p class="task-item-desc">${t.desc}</p>
        <div class="task-item-footer">
          <span class="task-item-meta">${t.elderAvatar} ${t.elderName} · ${t.address}</span>
          <span class="tag tag-orange">待接单</span>
        </div>
      </a>
    `).join('');
  }

  window.showToast = showToast;
})();
</script>

</body>
</html>
