<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>任务详情 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="home.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='home.html'">← 返回</a>
      <h3>任务详情</h3>
      <span></span>
    </div>

    <div class="screen-content" style="padding-top:16px;" id="detail-content"></div>

    <div class="tab-bar">
      <a href="home.html" class="tab-item">
        <span class="tab-icon">📋</span>
        <span>接单</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">📝</span>
        <span>我的</span>
      </a>
      <a href="earnings.html" class="tab-item">
        <span class="tab-icon">💰</span>
        <span>收入</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="modal-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center;">
    <div id="modal-content" style="background:#fff;border-radius:20px;width:320px;overflow:hidden;transform:scale(0.95);transition:transform 0.2s;">
      <div id="modal-header" style="padding:20px 20px 0;font-weight:700;font-size:1.1rem;text-align:center;"></div>
      <div id="modal-body" style="padding:16px 20px;"></div>
      <div id="modal-footer" style="padding:12px 20px 20px;display:flex;gap:10px;"></div>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  setCurrentUser('runner1');
  const urlParams = new URLSearchParams(window.location.search);
  const taskId = parseInt(urlParams.get('id'));
  const task = getTaskById(taskId);
  const container = document.getElementById('detail-content');

  if (!task) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">❓</div><p>任务不存在</p></div>';
    return;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function showModal(header, body, footer) {
    const overlay = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');
    document.getElementById('modal-header').innerHTML = header;
    document.getElementById('modal-body').innerHTML = body;
    document.getElementById('modal-footer').innerHTML = footer;
    overlay.style.display = 'flex';
    setTimeout(() => content.style.transform = 'scale(1)', 10);
  }

  function hideModal() {
    const overlay = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');
    content.style.transform = 'scale(0.95)';
    setTimeout(() => overlay.style.display = 'none', 200);
  }

  const photoIcons = ['📷', '🏠', '💊', '👵', '🌽', '🐔', '📦', '🛒', '🌾', '✅'];

  // 操作区域
  let actionArea = '';
  if (task.status === 'pending') {
    actionArea = `
      <button class="btn btn-primary btn-block" onclick="acceptCurrentTask()" style="margin-bottom:12px;">
        立即接单
      </button>
      <div class="card">
        <div class="card-title">💰 任务报酬</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:0.85rem;color:var(--muted);">任务金额</span>
          <span style="font-size:1.4rem;font-weight:800;color:var(--accent);">¥${task.budget}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
          <span style="font-size:0.85rem;color:var(--muted);">平台服务费（5%）</span>
          <span style="font-size:0.9rem;color:var(--muted);">-¥${Math.floor(task.budget * 0.05)}</span>
        </div>
        <div style="height:1px;background:var(--rule);margin:10px 0;"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:0.9rem;font-weight:700;">实际收入</span>
          <span style="font-size:1.2rem;font-weight:800;color:var(--accent2);">¥${Math.floor(task.budget * 0.95)}</span>
        </div>
      </div>`;
  } else if (task.status === 'ongoing') {
    actionArea = `
      <div style="display:flex;gap:10px;margin-bottom:10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="uploadPhoto()">📷 拍照</button>
        <button class="btn btn-secondary" style="flex:1;" onclick="uploadVoice()">🎙️ 录音</button>
      </div>
      <button class="btn btn-outline btn-block" onclick="updateProgress()" style="margin-bottom:10px;">📝 更新进度</button>
      <button class="btn btn-green btn-block" onclick="deliverTask()">✅ 确认完成交付</button>`;
  } else if (task.status === 'delivering') {
    actionArea = `
      <div class="card" style="text-align:center;">
        <div style="font-size:2.5rem;margin-bottom:8px;">⏳</div>
        <div style="font-size:1rem;font-weight:700;margin-bottom:4px;">已交付，等待子女确认</div>
        <div style="font-size:0.85rem;color:var(--muted);">对方确认后收入将自动到账</div>
      </div>`;
  } else {
    const settlement = getSettlementByTaskId(task.id);
    let incomeText = `¥${Math.floor(task.budget * 0.95)}`;
    if (settlement) incomeText = `¥${settlement.runnerIncome}`;
    actionArea = `
      <div class="card" style="text-align:center;">
        <div style="font-size:2.5rem;margin-bottom:8px;">✅</div>
        <div style="font-size:1rem;font-weight:700;margin-bottom:4px;">任务已完成</div>
        <div style="font-size:0.85rem;color:var(--muted);">收入 ${incomeText} 已到账</div>
      </div>`;
  }

  // 照片区
  let photoArea = '';
  if (task.photos && task.photos.length > 0) {
    photoArea = `
      <div class="card">
        <div class="card-title">📷 过程记录 (${task.photos.length}张)</div>
        <div class="photo-grid">
          ${task.photos.map(p => `<div class="photo-thumb">${p}</div>`).join('')}
        </div>
      </div>`;
  }

  // 语音区
  let voiceArea = '';
  if (task.voice) {
    voiceArea = `
      <div class="card">
        <div class="card-title">🎵 语音反馈</div>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:10px;">"${task.voice.text}"</p>
        <div class="voice-player">
          <button class="play-btn" onclick="showToast('播放语音...')">▶</button>
          <div class="voice-wave">
            ${Array(12).fill(0).map(() => `<span style="height:${8+Math.random()*14}px"></span>`).join('')}
          </div>
          <span class="voice-time">${task.voice.duration}</span>
        </div>
      </div>`;
  }

  container.innerHTML = `
    <div class="detail-hero">
      <div class="status-icon">${task.typeIcon}</div>
      <h2>${task.title}</h2>
      <span class="status-badge status-${task.status === 'delivering' ? 'ongoing' : task.status}">${task.statusLabel}</span>
    </div>

    <div class="card">
      <div class="card-title">👤 服务对象信息</div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
        <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#d4956a);display:flex;align-items:center;justify-content:center;font-size:1.6rem;">${task.elderAvatar}</div>
        <div>
          <div style="font-weight:700;font-size:0.95rem;">${task.elderName}</div>
          <div style="font-size:0.78rem;color:var(--muted);">${task.address}</div>
        </div>
      </div>
      <div style="font-size:0.85rem;color:var(--muted);line-height:1.6;background:var(--bg2);border-radius:10px;padding:12px;">
        ${task.desc}
      </div>
    </div>

    <div class="card">
      <div class="card-title">📍 任务进度</div>
      <div class="timeline">
        ${task.timeline.map(item => `
          <div class="timeline-item ${item.done ? 'done' : 'pending'}">
            <h5>${item.title}</h5>
            <p>${item.desc}</p>
            <div class="time">${item.time}</div>
          </div>
        `).join('')}
      </div>
    </div>

    ${photoArea}
    ${voiceArea}
    ${actionArea}
  `;

  window.acceptCurrentTask = function() {
    if (acceptTask(taskId, 'runner1', '王大海', '🤝')) {
      showToast('接单成功！');
      setTimeout(() => window.location.href = 'task-detail.html?id=' + taskId, 600);
    }
  };

  window.uploadPhoto = function() {
    const icon = photoIcons[Math.floor(Math.random() * photoIcons.length)];
    if (addTaskPhoto(taskId, icon)) {
      showToast('照片已上传');
      setTimeout(() => window.location.reload(), 400);
    }
  };

  window.uploadVoice = function() {
    if (addTaskVoice(taskId, '0:08', '已录制服务现场语音反馈')) {
      showToast('语音已上传');
      setTimeout(() => window.location.reload(), 400);
    }
  };

  window.updateProgress = function() {
    showModal(
      '📝 更新进度',
      `
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <div style="font-size:0.82rem;color:var(--muted);margin-bottom:6px;">进度标题</div>
            <input type="text" id="progress-title" class="form-input" placeholder="例如：已采购完成、已上门" style="font-size:0.85rem;padding:12px;">
          </div>
          <div>
            <div style="font-size:0.82rem;color:var(--muted);margin-bottom:6px;">进度描述</div>
            <textarea id="progress-desc" class="form-textarea" placeholder="描述当前进度详情..." style="font-size:0.85rem;padding:12px;min-height:80px;"></textarea>
          </div>
        </div>
      `,
      `
        <button class="btn btn-outline btn-block" onclick="hideModal()">取消</button>
        <button class="btn btn-primary btn-block" onclick="submitProgress()">确认更新</button>
      `
    );
  };

  window.submitProgress = function() {
    const title = document.getElementById('progress-title').value.trim();
    const desc = document.getElementById('progress-desc').value.trim();
    if (!title) {
      showToast('请输入进度标题');
      return;
    }
    hideModal();
    if (updateTaskProgress(taskId, title, desc)) {
      showToast('进度已更新');
      setTimeout(() => window.location.reload(), 400);
    }
  };

  window.deliverTask = function() {
    showModal(
      '✅ 确认交付',
      `
        <div style="text-align:center;padding:16px 0;">
          <div style="font-size:2.5rem;margin-bottom:12px;">📦</div>
          <div style="font-size:0.9rem;color:var(--muted);line-height:1.6;">
            确认已完成服务并交付吗？<br>交付后将通知子女确认并支付。
          </div>
        </div>
      `,
      `
        <button class="btn btn-outline btn-block" onclick="hideModal()">取消</button>
        <button class="btn btn-green btn-block" onclick="confirmDeliver()">确认交付</button>
      `
    );
  };

  window.confirmDeliver = function() {
    hideModal();
    if (runnerDeliverTask(taskId)) {
      showToast('已交付，等待子女确认');
      setTimeout(() => window.location.reload(), 600);
    }
  };

  window.showToast = showToast;
})();
</script>

</body>
</html>
