<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>农时银行 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .time-bank-overview {
      background: linear-gradient(135deg, var(--accent2), #3d9970);
      border-radius: 16px;
      padding: 28px 20px;
      color: #fff;
      text-align: center;
      box-shadow: 0 4px 16px rgba(61, 153, 112, 0.3);
    }
    .time-bank-overview .hours-label {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    .time-bank-overview .hours-value {
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .time-bank-overview .hours-unit {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-top: 6px;
    }
    .time-bank-overview .stats-row {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.25);
    }
    .time-bank-overview .stat-item .stat-val {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .time-bank-overview .stat-item .stat-desc {
      font-size: 0.72rem;
      opacity: 0.8;
      margin-top: 2px;
    }
    .exchange-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: var(--card);
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .exchange-item .exchange-arrow {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .exchange-item .exchange-arrow.earn {
      background: rgba(93, 173, 110, 0.15);
      color: var(--accent2);
    }
    .exchange-item .exchange-arrow.use {
      background: rgba(255, 152, 56, 0.15);
      color: var(--accent);
    }
    .exchange-item .exchange-info {
      flex: 1;
      min-width: 0;
    }
    .exchange-item .exchange-info .exchange-desc {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .exchange-item .exchange-info .exchange-date {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .exchange-item .exchange-hours {
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .exchange-item .exchange-hours.earn {
      color: var(--accent2);
    }
    .exchange-item .exchange-hours.use {
      color: var(--accent);
    }
    .view-needs-btn {
      display: block;
      width: 100%;
      padding: 14px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent2);
      background: rgba(93, 173, 110, 0.1);
      border: 1.5px solid rgba(93, 173, 110, 0.3);
      border-radius: 12px;
      text-decoration: none;
      margin-top: 6px;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .view-needs-btn:active {
      background: rgba(93, 173, 110, 0.2);
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="profile.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='profile.html'">← 返回</a>
      <h3>农时银行</h3>
      <span></span>
    </div>

    <div class="screen-content" style="padding-top:16px;">
      <!-- 概览卡片 -->
      <div class="time-bank-overview" id="overview-card">
        <div class="hours-label">可用工时</div>
        <div class="hours-value" id="available-hours">0</div>
        <div class="hours-unit">小时</div>
        <div class="stats-row">
          <div class="stat-item">
            <div class="stat-val" id="total-earned">0</div>
            <div class="stat-desc">累计赚取（小时）</div>
          </div>
        </div>
      </div>

      <!-- 工时明细 -->
      <div class="section-title" style="margin-top:16px;">📊 工时明细</div>
      <div id="exchange-list"></div>

      <!-- 查看附近互助需求按钮 -->
      <a href="home.html" class="view-needs-btn">查看附近互助需求</a>
    </div>

    <div class="tab-bar">
      <a href="home.html" class="tab-item">
        <span class="tab-icon">📋</span>
        <span>接单</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">📝</span>
        <span>我的</span>
      </a>
      <a href="earnings.html" class="tab-item">
        <span class="tab-icon">💰</span>
        <span>收入</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  setCurrentUser('runner1');

  // 渲染概览数据
  document.getElementById('available-hours').textContent = DB.timeBank.hours;
  document.getElementById('total-earned').textContent = DB.timeBank.totalEarned;

  // 渲染工时明细
  var container = document.getElementById('exchange-list');
  container.innerHTML = DB.timeBank.exchanges.map(function(ex) {
    var isEarn = ex.type === 'earn';
    var arrowClass = isEarn ? 'earn' : 'use';
    var hoursClass = isEarn ? 'earn' : 'use';
    var arrowIcon = isEarn ? '&#9650;' : '&#9660;'; // 上三角 / 下三角
    var hoursText = isEarn ? ('+' + ex.hours) : (ex.hours + '');

    return '<div class="exchange-item">' +
      '<div class="exchange-arrow ' + arrowClass + '">' + arrowIcon + '</div>' +
      '<div class="exchange-info">' +
        '<div class="exchange-desc">' + ex.desc + '</div>' +
        '<div class="exchange-date">' + ex.date + '</div>' +
      '</div>' +
      '<div class="exchange-hours ' + hoursClass + '">' + hoursText + ' 工时</div>' +
    '</div>';
  }).join('');
})();
</script>

</body>
</html>
