<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>收入明细 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="home.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='home.html'">← 返回</a>
      <h3>收入明细</h3>
      <span></span>
    </div>

    <div class="screen-content" style="padding-top:16px;">
      <div class="card" style="text-align:center;padding:28px 20px;">
        <div style="font-size:0.85rem;color:var(--muted);margin-bottom:8px;">累计收入</div>
        <div style="font-size:2.8rem;font-weight:800;color:var(--accent);line-height:1;" id="total-income">¥0</div>
        <div style="display:flex;justify-content:center;gap:24px;margin-top:16px;">
          <div>
            <div style="font-size:1rem;font-weight:700;" id="today-income">¥0</div>
            <div style="font-size:0.72rem;color:var(--muted);">今日</div>
          </div>
          <div>
            <div style="font-size:1rem;font-weight:700;" id="month-income">¥0</div>
            <div style="font-size:0.72rem;color:var(--muted);">本月</div>
          </div>
          <div>
            <div style="font-size:1rem;font-weight:700;" id="avg-income">¥0</div>
            <div style="font-size:0.72rem;color:var(--muted);">日均</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📈 收入趋势</div>
        <div style="padding:16px;">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:8px;">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;">
              <div style="width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:6px 6px 0 0;margin-bottom:8px;transition:height 0.5s;" id="bar-0"></div>
              <div style="font-size:0.65rem;color:var(--muted);">今天</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;">
              <div style="width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:6px 6px 0 0;margin-bottom:8px;transition:height 0.5s;" id="bar-1"></div>
              <div style="font-size:0.65rem;color:var(--muted);">昨天</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;">
              <div style="width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:6px 6px 0 0;margin-bottom:8px;transition:height 0.5s;" id="bar-2"></div>
              <div style="font-size:0.65rem;color:var(--muted);">前天</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;">
              <div style="width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:6px 6px 0 0;margin-bottom:8px;transition:height 0.5s;" id="bar-3"></div>
              <div style="font-size:0.65rem;color:var(--muted);">7/3</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;">
              <div style="width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:6px 6px 0 0;margin-bottom:8px;transition:height 0.5s;" id="bar-4"></div>
              <div style="font-size:0.65rem;color:var(--muted);">7/1</div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:0.78rem;color:var(--muted);">
            <span>过去5天收入</span>
            <span>总收入: ¥<span id="chart-total">0</span></span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🏆 服务统计</div>
        <div style="display:flex;justify-content:space-around;text-align:center;">
          <div>
            <div style="font-size:1.6rem;font-weight:800;color:var(--accent);" id="stat-completed">0</div>
            <div style="font-size:0.72rem;color:var(--muted);margin-top:4px;">完成订单</div>
          </div>
          <div style="width:1px;background:var(--rule);"></div>
          <div>
            <div style="font-size:1.6rem;font-weight:800;color:var(--blue);" id="stat-rating">0.0</div>
            <div style="font-size:0.72rem;color:var(--muted);margin-top:4px;">服务评分</div>
          </div>
          <div style="width:1px;background:var(--rule);"></div>
          <div>
            <div style="font-size:1.6rem;font-weight:800;color:var(--accent2);" id="stat-rate">0%</div>
            <div style="font-size:0.72rem;color:var(--muted);margin-top:4px;">接单率</div>
          </div>
        </div>
      </div>

      <div class="section-title">📊 近期收入</div>
      <div id="earnings-list"></div>
    </div>

    <div class="tab-bar">
      <a href="home.html" class="tab-item">
        <span class="tab-icon">📋</span>
        <span>接单</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">📝</span>
        <span>我的</span>
      </a>
      <a href="earnings.html" class="tab-item active">
        <span class="tab-icon">💰</span>
        <span>收入</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  setCurrentUser('runner1');

  const runner = currentUser;
  const total = runner.earnings || DB.earnings.reduce((sum, e) => sum + e.amount, 0);
  const today = DB.earnings.filter(e => e.date === '今天').reduce((sum, e) => sum + e.amount, 0);
  const month = DB.earnings.slice(0, 5).reduce((sum, e) => sum + e.amount, 0);
  const avg = Math.round(month / 5);
  const chartTotal = DB.earnings.reduce((sum, e) => sum + e.amount, 0);

  document.getElementById('total-income').textContent = '¥' + total.toLocaleString();
  document.getElementById('today-income').textContent = '¥' + today;
  document.getElementById('month-income').textContent = '¥' + month;
  document.getElementById('avg-income').textContent = '¥' + avg;
  document.getElementById('chart-total').textContent = chartTotal;

  document.getElementById('stat-completed').textContent = runner.completed || 0;
  document.getElementById('stat-rating').textContent = runner.rating || 5.0;
  document.getElementById('stat-rate').textContent = '98%';

  setTimeout(() => {
    const amounts = DB.earnings.map(e => e.amount);
    const maxAmount = Math.max(...amounts);
    
    amounts.forEach((amount, index) => {
      const height = (amount / maxAmount) * 100;
      const bar = document.getElementById(`bar-${index}`);
      if (bar) bar.style.height = height + '%';
    });
  }, 300);

  const container = document.getElementById('earnings-list');
  container.innerHTML = DB.earnings.map(e => `
    <div class="earning-card">
      <div class="earning-info">
        <h4>${e.task}</h4>
        <p>${e.date}</p>
      </div>
      <div class="earning-amount">+¥${e.amount}</div>
    </div>
  `).join('');
})();
</script>

</body>
</html>
