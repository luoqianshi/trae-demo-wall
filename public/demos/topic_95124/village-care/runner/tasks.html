<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的任务 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="home.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='home.html'">← 返回</a>
      <h3>我的任务</h3>
      <span></span>
    </div>

    <div class="screen-content" style="padding-top:16px;">
      <!-- 筛选标签 -->
      <div style="display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;white-space:nowrap;padding-bottom:4px;">
        <button class="btn btn-sm btn-primary" onclick="filterTasks('all')" id="filter-all">全部</button>
        <button class="btn btn-sm btn-outline" onclick="filterTasks('ongoing')" id="filter-ongoing">进行中</button>
        <button class="btn btn-sm btn-outline" onclick="filterTasks('delivering')" id="filter-delivering">待确认</button>
        <button class="btn btn-sm btn-outline" onclick="filterTasks('done')" id="filter-done">已完成</button>
      </div>

      <div id="task-list"></div>
    </div>

    <div class="tab-bar">
      <a href="home.html" class="tab-item">
        <span class="tab-icon">📋</span>
        <span>接单</span>
      </a>
      <a href="tasks.html" class="tab-item active">
        <span class="tab-icon">📝</span>
        <span>我的</span>
      </a>
      <a href="earnings.html" class="tab-item">
        <span class="tab-icon">💰</span>
        <span>收入</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  let currentFilter = 'all';

  function renderTasks() {
    const container = document.getElementById('task-list');
    let tasks = DB.tasks.filter(t => t.runnerId === 'runner1');
    if (currentFilter !== 'all') {
      if (currentFilter === 'ongoing') {
        tasks = tasks.filter(t => t.status === 'ongoing' || t.status === 'delivering');
      } else {
        tasks = tasks.filter(t => t.status === currentFilter);
      }
    }

    if (tasks.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📝</div>
          <p>暂无${currentFilter === 'all' ? '' : '该类'}任务</p>
        </div>`;
      return;
    }

    container.innerHTML = tasks.map(t => `
      <a href="task-detail.html?id=${t.id}" class="task-item">
        <div class="task-item-header">
          <span class="task-item-title">${t.typeIcon} ${t.title}</span>
          <span class="status-badge status-${t.status === 'delivering' ? 'ongoing' : t.status}">${t.statusLabel}</span>
        </div>
        <p class="task-item-desc">${t.elderAvatar} ${t.elderName} · ${t.address}</p>
        <div class="task-item-footer">
          <span class="task-item-meta">${t.createdAt}</span>
          <span class="task-item-price">¥${t.budget}</span>
        </div>
      </a>
    `).join('');
  }

  window.filterTasks = function(filter) {
    currentFilter = filter;
    ['all','ongoing','delivering','done'].forEach(f => {
      const btn = document.getElementById('filter-' + f);
      if (!btn) return;
      if (f === filter) {
        btn.className = 'btn btn-sm btn-primary';
      } else {
        btn.className = 'btn btn-sm btn-outline';
      }
    });
    renderTasks();
  };

  renderTasks();
})();
</script>

</body>
</html>
