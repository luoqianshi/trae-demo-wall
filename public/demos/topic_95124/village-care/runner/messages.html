<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>消息中心 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .conversation-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.85);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .conversation-item:active { transform: scale(0.98); }
    .conversation-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .conversation-body {
      flex: 1;
      min-width: 0;
    }
    .conversation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .conversation-name {
      font-size: 0.95rem;
      font-weight: 700;
    }
    .conversation-time {
      font-size: 0.72rem;
      color: var(--muted-light);
      flex-shrink: 0;
    }
    .conversation-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .conversation-preview {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .conversation-preview.unread {
      color: var(--ink);
      font-weight: 600;
    }
    .conversation-badge {
      background: var(--red);
      color: #fff;
      font-size: 0.65rem;
      min-width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      padding: 0 5px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="home.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='home.html'">← 返回</a>
      <h3>消息中心</h3>
      <span></span>
    </div>

    <div class="screen-content" style="padding-top:16px;">
      <div id="conversation-list"></div>
    </div>

    <div class="tab-bar">
      <a href="home.html" class="tab-item">
        <span class="tab-icon">📋</span>
        <span>接单</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">📝</span>
        <span>我的任务</span>
      </a>
      <a href="earnings.html" class="tab-item">
        <span class="tab-icon">💰</span>
        <span>收入</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  setCurrentUser('runner1');
  markAllMessagesRead(currentUser.id);

  function getOtherInfo(otherId) {
    const user = DB.users.find(u => u.id === otherId);
    if (user) return { name: user.name, avatar: user.avatar };
    const sysMsg = DB.messages.find(m => m.from === otherId);
    if (sysMsg) return { name: sysMsg.fromName, avatar: sysMsg.fromAvatar };
    return { name: otherId, avatar: '👤' };
  }

  const container = document.getElementById('conversation-list');
  const msgs = getMessagesForUser(currentUser.id);

  if (msgs.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">💬</div>
        <p>暂无消息</p>
      </div>`;
    return;
  }

  const convMap = new Map();
  msgs.forEach(m => {
    const otherId = m.from === currentUser.id ? m.to : m.from;
    if (!convMap.has(otherId)) {
      convMap.set(otherId, { latest: m, unread: 0 });
    }
    if (m.to === currentUser.id && !m.read) {
      convMap.get(otherId).unread++;
    }
  });

  container.innerHTML = Array.from(convMap.entries()).map(([otherId, data]) => {
    const info = getOtherInfo(otherId);
    const unreadClass = data.unread > 0 ? 'unread' : '';
    const badgeHtml = data.unread > 0 ? `<span class="conversation-badge">${data.unread}</span>` : '';
    return `
      <a href="message-detail.html?with=${otherId}" class="conversation-item">
        <div class="conversation-avatar">${info.avatar}</div>
        <div class="conversation-body">
          <div class="conversation-header">
            <span class="conversation-name">${info.name}</span>
            <span class="conversation-time">${data.latest.time}</span>
          </div>
          <div class="conversation-footer">
            <span class="conversation-preview ${unreadClass}">${data.latest.text}</span>
            ${badgeHtml}
          </div>
        </div>
      </a>
    `;
  }).join('');
})();
</script>

</body>
</html>
