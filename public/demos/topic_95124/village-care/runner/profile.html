<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人中心 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="home.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='home.html'">← 返回</a>
      <h3>个人中心</h3>
      <a href="../login.html" style="font-size:0.82rem;color:var(--accent);font-weight:600;text-decoration:none;">切换角色</a>
    </div>
    <div class="screen-content" id="profile-content">
      <!-- 动态渲染 -->
    </div>

    <div class="tab-bar">
      <a href="home.html" class="tab-item">
        <span class="tab-icon">📋</span>
        <span>接单</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">📝</span>
        <span>我的</span>
      </a>
      <a href="earnings.html" class="tab-item">
        <span class="tab-icon">💰</span>
        <span>收入</span>
      </a>
      <a href="profile.html" class="tab-item active">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
  setCurrentUser('runner1');

  const stats = getUserStats('runner1');
  const rating = stats.rating || 5.0;
  const fullStars = Math.floor(rating);
  const starsHtml = Array.from({length: 5}, (_, i) =>
    `<span class="star ${i < fullStars ? 'active' : ''}">★</span>`
  ).join('');

  document.getElementById('profile-content').innerHTML = `
    <div style="text-align:center;padding:30px 0 20px;">
      <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),#5aad6e);display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 14px;">${currentUser.avatar}</div>
      <h2 style="font-size:1.2rem;font-weight:800;">${currentUser.name}</h2>
      <p style="font-size:0.82rem;color:var(--muted);">河北省保定市顺平县${currentUser.village} · 跑腿人</p>
      <div class="stars" style="justify-content:center;margin-top:8px;font-size:1.1rem;">
        ${starsHtml}
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-around;text-align:center;">
        <div>
          <div style="font-size:1.4rem;font-weight:800;">${stats.totalTasks}</div>
          <div style="font-size:0.72rem;color:var(--muted);">总任务</div>
        </div>
        <div style="width:1px;background:var(--rule);"></div>
        <div>
          <div style="font-size:1.4rem;font-weight:800;">${stats.completedTasks}</div>
          <div style="font-size:0.72rem;color:var(--muted);">已完成</div>
        </div>
        <div style="width:1px;background:var(--rule);"></div>
        <div>
          <div style="font-size:1.4rem;font-weight:800;">¥${stats.totalIncome}</div>
          <div style="font-size:0.72rem;color:var(--muted);">总收入</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden;">
      <a href="tasks.html" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);">
        <span style="font-size:1.3rem;">📝</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">任务记录</div>
          <div style="font-size:0.78rem;color:var(--muted);">查看所有接过的任务</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
      <a href="earnings.html" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);">
        <span style="font-size:1.3rem;">💰</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">收入明细</div>
          <div style="font-size:0.78rem;color:var(--muted);">查看收入记录和统计</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
      <a href="farm.html" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);">
        <span style="font-size:1.3rem;">🌾</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">时间银行</div>
          <div style="font-size:0.78rem;color:var(--muted);">${DB.timeBank.hours} 可用工时</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
      <a href="../login.html" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;">
        <span style="font-size:1.3rem;">🔄</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">切换角色</div>
          <div style="font-size:0.78rem;color:var(--muted);">切换到子女端</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
    </div>
  `;
</script>

</body>
</html>
