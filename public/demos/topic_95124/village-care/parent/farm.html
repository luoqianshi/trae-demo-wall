<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>农时互助 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .farm-intro {
      background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
      border-radius: 14px;
      padding: 20px 18px;
      margin-bottom: 18px;
      border: 1px solid rgba(76, 175, 80, 0.15);
    }
    .farm-intro h4 {
      font-size: 1rem;
      font-weight: 700;
      color: #2e7d32;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .farm-intro p {
      font-size: 0.82rem;
      color: #555;
      line-height: 1.65;
      margin: 0;
    }
    .farm-intro .feature-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .farm-intro .feature-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      background: rgba(76, 175, 80, 0.12);
      border-radius: 20px;
      font-size: 0.72rem;
      color: #2e7d32;
      font-weight: 600;
    }
    .farm-section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .farm-task-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      background: var(--accent2);
      color: #fff;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .publish-farm-btn {
      display: block;
      width: 100%;
      padding: 14px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent2), #3d9970);
      border: none;
      border-radius: 12px;
      text-decoration: none;
      margin-top: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(61, 153, 112, 0.3);
      transition: opacity 0.2s;
      cursor: pointer;
    }
    .publish-farm-btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="home.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='home.html'">&larr; 返回</a>
      <h3>农时互助</h3>
      <span></span>
    </div>

    <div class="screen-content" style="padding-top:16px;">
      <!-- 农时互助说明区 -->
      <div class="farm-intro">
        <h4>&#127806; 什么是农时互助？</h4>
        <p>农忙时节，邻里之间互相帮忙干农活。您可以为家中的老人发布农时求助，也可以查看村里其他人的互助需求。每次互助都会记录工时，存入时间银行，随时可以兑换。</p>
        <div class="feature-tags">
          <span class="feature-tag">&#129309; 邻里互助</span>
          <span class="feature-tag">&#9200; 时间银行</span>
          <span class="feature-tag">&#128176; 工时存兑</span>
          <span class="feature-tag">&#127793; 农忙帮手</span>
        </div>
      </div>

      <!-- 附近农时任务 -->
      <div class="farm-section-title">
        <span>&#127793; 附近农时任务</span>
        <span class="farm-task-count" id="task-count">0</span>
      </div>
      <div id="farm-task-list"></div>

      <!-- 发布农时互助任务按钮 -->
      <a href="new-task.html?type=farm" class="publish-farm-btn" onclick="window.location.href='new-task.html?type=farm'">
        &#127793; 发布农时互助任务
      </a>
    </div>

    <!-- 底部导航 -->
    <div class="tab-bar">
      <a href="home.html" class="tab-item">
        <span class="tab-icon">&#127968;</span>
        <span>首页</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">&#128203;</span>
        <span>任务</span>
      </a>
      <a href="messages.html" class="tab-item">
        <span class="tab-icon">&#128172;</span>
        <span>消息</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="tab-icon">&#128100;</span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  setCurrentUser('parent1');

  // 筛选 farm 类型任务
  var farmTasks = DB.tasks.filter(function(t) {
    return t.type === 'farm';
  });

  var countEl = document.getElementById('task-count');
  var listEl = document.getElementById('farm-task-list');

  countEl.textContent = farmTasks.length;

  if (farmTasks.length === 0) {
    listEl.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">&#127793;</div>' +
        '<p>附近暂无农时互助任务</p>' +
        '<p style="font-size:0.75rem;color:var(--muted);margin-top:4px;">点击下方按钮发布一个吧</p>' +
      '</div>';
  } else {
    listEl.innerHTML = farmTasks.map(function(t) {
      var statusClass = t.status === 'delivering' ? 'ongoing' : t.status;
      return '<a href="task-detail.html?id=' + t.id + '" class="task-item" onclick="window.location.href=\'task-detail.html?id=' + t.id + '\'">' +
        '<div class="task-item-header">' +
          '<span class="task-item-title">' + t.typeIcon + ' ' + t.title + '</span>' +
          '<span class="status-badge status-' + statusClass + '">' + t.statusLabel + '</span>' +
        '</div>' +
        '<p class="task-item-desc">' + t.desc + '</p>' +
        '<div class="task-item-footer">' +
          '<span class="task-item-meta">' + t.createdAt + ' &middot; ' + t.elderName + (t.runnerName ? ' &middot; ' + t.runnerName : '') + '</span>' +
          '<span class="task-item-price">&yen;' + t.budget + '</span>' +
        '</div>' +
      '</a>';
    }).join('');
  }
})();
</script>

</body>
</html>
