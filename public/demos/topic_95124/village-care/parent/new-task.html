<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>发布任务 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="home.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='home.html'">← 返回</a>
      <h3>发布任务</h3>
      <span></span>
    </div>

    <div class="screen-content" style="padding-top:16px;">
      <p style="font-size:0.82rem;color:var(--muted);margin-bottom:14px;">选择任务类型</p>
      <div class="type-grid">
        <button class="type-option" data-type="shop" onclick="selectType('shop')">
          <div class="type-icon">🛒</div>
          <h4>代购代办</h4>
          <p>买药买菜、缴费取件</p>
        </button>
        <button class="type-option" data-type="visit" onclick="selectType('visit')">
          <div class="type-icon">👀</div>
          <h4>上门探视</h4>
          <p>看望老人、拍照反馈</p>
        </button>
        <button class="type-option" data-type="voice" onclick="selectType('voice')">
          <div class="type-icon">🎙️</div>
          <h4>捎句话</h4>
          <p>语音传递、双向沟通</p>
        </button>
        <button class="type-option" data-type="farm" onclick="selectType('farm')">
          <div class="type-icon">🌾</div>
          <h4>农时互助</h4>
          <p>收玉米、喂鸡、种菜</p>
        </button>
      </div>

      <div class="form-group">
        <label class="form-label">服务对象</label>
        <select class="form-select" id="elder-select">
          <option value="1">👵 李秀兰 · 小王村东头第二户</option>
          <option value="2">👴 王德顺 · 小王村西头第五户</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">任务描述</label>
        <textarea class="form-textarea" id="task-desc" placeholder="请详细描述您的需求，例如：去镇上药店买降压药（硝苯地平），送到我家..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">预算金额（元）</label>
        <input type="number" class="form-input" id="task-budget" placeholder="50" value="50">
        <p style="font-size:0.75rem;color:var(--muted-light);margin-top:6px;">包含货款和跑腿费，多退少补</p>
      </div>

      <div class="form-group">
        <label class="form-label">期望完成时间</label>
        <select class="form-select" id="task-time">
          <option>今天内</option>
          <option>明天</option>
          <option>三天内</option>
          <option>一周内</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">备注（可选）</label>
        <input type="text" class="form-input" id="task-note" placeholder="例如：老人耳背，请大声一点">
      </div>

      <button class="btn btn-primary btn-block" onclick="submitTask()" style="margin-top:8px;margin-bottom:20px;">
        发布任务
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  let selectedType = null;
  const typeMap = {
    shop: { label: '代购代办', icon: '🛒' },
    visit: { label: '上门探视', icon: '👀' },
    voice: { label: '捎句话', icon: '🎙️' },
    farm: { label: '农时互助', icon: '🌾' }
  };

  // URL参数预选择类型
  const urlParams = new URLSearchParams(window.location.search);
  const preType = urlParams.get('type');
  if (preType && typeMap[preType]) {
    selectType(preType);
  }

  window.selectType = function(type) {
    selectedType = type;
    document.querySelectorAll('.type-option').forEach(el => el.classList.remove('selected'));
    document.querySelector(`.type-option[data-type="${type}"]`).classList.add('selected');
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  window.submitTask = function() {
    const descEl = document.getElementById('task-desc');
    const budgetEl = document.getElementById('task-budget');
    const desc = descEl.value.trim();
    const budget = parseInt(budgetEl.value) || 0;

    // 清除错误状态
    descEl.classList.remove('error');
    budgetEl.classList.remove('error');

    if (!selectedType) {
      showToast('请选择任务类型');
      return;
    }
    if (!desc) {
      descEl.classList.add('error');
      showToast('请填写任务描述');
      descEl.focus();
      return;
    }
    if (desc.length < 5) {
      descEl.classList.add('error');
      showToast('任务描述至少5个字');
      descEl.focus();
      return;
    }
    if (budget < 10) {
      budgetEl.classList.add('error');
      showToast('预算金额至少10元');
      budgetEl.focus();
      return;
    }
    if (budget > 1000) {
      budgetEl.classList.add('error');
      showToast('预算金额不能超过1000元');
      budgetEl.focus();
      return;
    }

    const tm = typeMap[selectedType];
    const newTask = createTask({
      type: selectedType,
      typeLabel: tm.label,
      typeIcon: tm.icon,
      title: desc.substring(0, 14) + (desc.length > 14 ? '...' : ''),
      desc: desc,
      budget: budget
    });

    showToast('任务发布成功！');
    setTimeout(() => {
      window.location.href = 'task-detail.html?id=' + newTask.id;
    }, 800);
  };
})();
</script>

</body>
</html>
