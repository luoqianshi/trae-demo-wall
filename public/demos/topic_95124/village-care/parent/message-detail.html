<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>聊天 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .chat-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 16px;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      scrollbar-width: none;
    }
    .chat-content::-webkit-scrollbar { display: none; }
    .chat-input-bar {
      flex-shrink: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--rule);
      padding: 10px 14px 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 50;
    }
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--rule);
      border-radius: 24px;
      font-size: 0.9rem;
      font-family: inherit;
      background: rgba(255,255,255,0.7);
      color: var(--ink);
      outline: none;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a05a2a);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chat-send-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="messages.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='messages.html'">← 返回</a>
      <h3 id="chat-title">聊天</h3>
      <span></span>
    </div>

    <div class="chat-content" id="chat-messages"></div>

    <div class="chat-input-bar">
      <input type="text" class="chat-input" id="chat-input" placeholder="输入消息..." maxlength="200">
      <button class="chat-send-btn" id="chat-send">➤</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  setCurrentUser('parent1');

  const params = new URLSearchParams(window.location.search);
  const otherId = params.get('with') || '';

  function getOtherInfo(id) {
    const user = DB.users.find(u => u.id === id);
    if (user) return { name: user.name, avatar: user.avatar };
    const sysMsg = DB.messages.find(m => m.from === id);
    if (sysMsg) return { name: sysMsg.fromName, avatar: sysMsg.fromAvatar };
    return { name: id, avatar: '👤' };
  }

  const otherInfo = getOtherInfo(otherId);
  document.getElementById('chat-title').textContent = otherInfo.name || '聊天';

  markMessagesRead(currentUser.id, otherId);

  function renderMessages() {
    const container = document.getElementById('chat-messages');
    const conversation = getConversation(currentUser.id, otherId);

    if (conversation.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <p>暂无消息，开始聊天吧</p>
        </div>`;
      return;
    }

    container.innerHTML = conversation.map(m => {
      const isMe = m.from === currentUser.id;
      return `
        <div class="msg-bubble ${isMe ? 'me' : ''}">
          <div class="msg-avatar">${isMe ? currentUser.avatar : otherInfo.avatar}</div>
          <div class="msg-body">
            <div class="msg-text">${m.text}</div>
            <div class="msg-time">${m.time}${!m.read && !isMe ? ' · 未读' : ''}</div>
          </div>
        </div>
      `;
    }).join('');

    // 滚动到底部
    const chatEl = document.getElementById('chat-messages');
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  renderMessages();

  function send() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    sendMessage(currentUser.id, currentUser.name, currentUser.avatar, otherId, text);
    input.value = '';
    renderMessages();
  }

  document.getElementById('chat-send').addEventListener('click', send);
  document.getElementById('chat-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') send();
  });
})();
</script>

</body>
</html>
