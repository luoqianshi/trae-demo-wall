<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人中心 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="home.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='home.html'">← 返回</a>
      <h3>个人中心</h3>
      <a href="../login.html" style="font-size:0.82rem;color:var(--accent);font-weight:600;text-decoration:none;">切换角色</a>
    </div>
    <div class="screen-content" id="profile-content">
      <!-- 动态渲染 -->
    </div>

    <div class="tab-bar">
      <a href="home.html" class="tab-item">
        <span class="tab-icon">🏠</span>
        <span>首页</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">📋</span>
        <span>任务</span>
      </a>
      <a href="messages.html" class="tab-item">
        <span class="tab-icon">💬</span>
        <span>消息</span>
      </a>
      <a href="profile.html" class="tab-item active">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
  setCurrentUser('parent1');

  const stats = getUserStats('parent1');
  const elderNames = currentUser.elders.map(eid => {
    const e = DB.elders.find(el => el.id === eid);
    return e ? e.name : '';
  }).filter(Boolean).join(' · ');

  document.getElementById('profile-content').innerHTML = `
    <div style="text-align:center;padding:30px 0 20px;">
      <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#d4956a);display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 14px;">${currentUser.avatar}</div>
      <h2 style="font-size:1.2rem;font-weight:800;">${currentUser.name}</h2>
      <p style="font-size:0.82rem;color:var(--muted);">河北省保定市顺平县${currentUser.village}</p>
    </div>

    <div class="card">
        <div style="display:flex;justify-content:space-around;text-align:center;padding-bottom:14px;border-bottom:1px solid var(--rule);">
          <div>
            <div style="font-size:1.4rem;font-weight:800;">${stats.totalTasks}</div>
            <div style="font-size:0.72rem;color:var(--muted);">总任务</div>
          </div>
          <div style="width:1px;background:var(--rule);"></div>
          <div>
            <div style="font-size:1.4rem;font-weight:800;">${stats.completedTasks}</div>
            <div style="font-size:0.72rem;color:var(--muted);">已完成</div>
          </div>
          <div style="width:1px;background:var(--rule);"></div>
          <div>
            <div style="font-size:1.4rem;font-weight:800;">¥${stats.totalSpent}</div>
            <div style="font-size:0.72rem;color:var(--muted);">总支出</div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-around;text-align:center;padding-top:14px;">
          <div>
            <div style="font-size:1.3rem;font-weight:800;color:var(--accent);">${stats.pendingTasks}</div>
            <div style="font-size:0.72rem;color:var(--muted);">待处理</div>
          </div>
          <div style="width:1px;background:var(--rule);"></div>
          <div>
            <div style="font-size:1.3rem;font-weight:800;color:var(--blue);">${stats.ongoingTasks}</div>
            <div style="font-size:0.72rem;color:var(--muted);">进行中</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📊 任务完成率</div>
        <div style="padding:16px;">
          <div style="display:flex;align-items:center;gap:16px;">
            <div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent2) ${stats.totalTasks > 0 ? (stats.completedTasks/stats.totalTasks)*360 : 0}deg, var(--bg3) 0deg);display:flex;align-items:center;justify-content:center;">
              <div style="width:48px;height:48px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;">
                <span style="font-size:0.9rem;font-weight:800;color:var(--accent2);">${stats.totalTasks > 0 ? Math.round(stats.completedTasks/stats.totalTasks*100) : 0}%</span>
              </div>
            </div>
            <div style="flex:1;">
              <div style="font-size:0.88rem;font-weight:600;margin-bottom:8px;">服务完成情况</div>
              <div style="display:flex;flex-direction:column;gap:6px;">
                <div style="display:flex;align-items:center;gap:8px;">
                  <div style="width:12px;height:12px;border-radius:50%;background:var(--accent2);"></div>
                  <span style="font-size:0.8rem;color:var(--muted);">已完成 ${stats.completedTasks} 单</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <div style="width:12px;height:12px;border-radius:50%;background:var(--blue);"></div>
                  <span style="font-size:0.8rem;color:var(--muted);">进行中 ${stats.ongoingTasks} 单</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <div style="width:12px;height:12px;border-radius:50%;background:var(--accent);"></div>
                  <span style="font-size:0.8rem;color:var(--muted);">待接单 ${stats.pendingTasks} 单</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📍 服务覆盖</div>
        <div style="padding:16px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
            <div style="font-size:0.88rem;color:var(--muted);">覆盖村庄</div>
            <div style="font-size:0.95rem;font-weight:700;color:var(--accent);">小王村 · 周边3村</div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
            <div style="font-size:0.88rem;color:var(--muted);">服务老人</div>
            <div style="font-size:0.95rem;font-weight:700;color:var(--accent2);">2位老人</div>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <div style="font-size:0.88rem;color:var(--muted);">累计探视</div>
            <div style="font-size:0.95rem;font-weight:700;color:var(--blue);">12次上门</div>
          </div>
          <div style="margin-top:16px;height:80px;background:var(--bg2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;gap:10px;">
            <span>🏡</span><span>📍</span><span>👵</span>
          </div>
        </div>
      </div>

    <div class="card" style="padding:0;overflow:hidden;">
      <a href="elders.html" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);">
        <span style="font-size:1.3rem;">👵</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">老人管理</div>
          <div style="font-size:0.78rem;color:var(--muted);">${elderNames || '暂无关联老人'}</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
      <a href="tasks.html" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);">
        <span style="font-size:1.3rem;">📋</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">任务记录</div>
          <div style="font-size:0.78rem;color:var(--muted);">查看所有历史任务</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
      <a href="pricing.html" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);">
        <span style="font-size:1.3rem;">💰</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">定价规则</div>
          <div style="font-size:0.78rem;color:var(--muted);">熟人折扣、平台抽成说明</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
      <a href="security.html" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);">
        <span style="font-size:1.3rem;">🛡️</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">安全保障</div>
          <div style="font-size:0.78rem;color:var(--muted);">实名认证、信用评分、服务轨迹</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
      <a href="#" onclick="toggleFontSize()" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);">
        <span style="font-size:1.3rem;">🔤</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">大字体模式</div>
          <div style="font-size:0.78rem;color:var(--muted);" id="font-size-status">当前：标准字体</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
      <a href="../login.html" style="display:flex;align-items:center;gap:12px;padding:16px 18px;text-decoration:none;color:inherit;">
        <span style="font-size:1.3rem;">🔄</span>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:0.9rem;">切换角色</div>
          <div style="font-size:0.78rem;color:var(--muted);">切换到跑腿人端</div>
        </div>
        <span style="color:var(--muted-light);">›</span>
      </a>
    </div>
  `;

  window.toggleFontSize = function() {
    const body = document.body;
    const status = document.getElementById('font-size-status');
    if (body.classList.contains('large-font')) {
      body.classList.remove('large-font');
      status.textContent = '当前：标准字体';
    } else {
      body.classList.add('large-font');
      status.textContent = '当前：大字体模式';
    }
  };
</script>

</body>
</html>
