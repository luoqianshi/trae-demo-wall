<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>老人详情 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="elders.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='elders.html'">← 返回</a>
      <h3>老人详情</h3>
      <div style="width:56px;"></div>
    </div>
    <div class="screen-content" id="detail-content">
      <!-- 动态渲染 -->
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
  setCurrentUser('parent1');

  function showToast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  const params = new URLSearchParams(window.location.search);
  const elderId = parseInt(params.get('id'));
  const elder = DB.elders.find(e => e.id === elderId);

  const container = document.getElementById('detail-content');

  if (!elder) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">❓</div>
        <p>未找到该老人信息</p>
      </div>
    `;
  } else {
    const relatedTasks = DB.tasks.filter(t => t.elderId === elder.id);
    const statusClass = elder.status === 'warning' ? 'tag-red' : 'tag-green';
    const statusText = elder.status === 'warning' ? '关注' : '正常';

    container.innerHTML = `
      <div style="text-align:center;padding:30px 0 20px;">
        <div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#d4956a);display:flex;align-items:center;justify-content:center;font-size:3rem;margin:0 auto 14px;">${elder.avatar}</div>
        <h2 style="font-size:1.3rem;font-weight:800;">${elder.name}</h2>
        <p style="font-size:0.85rem;color:var(--muted);margin-top:4px;">${elder.age}岁 · ${elder.village}</p>
        <span class="tag ${statusClass}" style="margin-top:10px;display:inline-block;">${statusText}</span>
      </div>

      <div class="card">
        <div style="font-size:0.9rem;font-weight:700;margin-bottom:12px;">基本信息</div>
        <div style="display:flex;flex-direction:column;gap:10px;font-size:0.85rem;color:var(--muted);">
          <div style="display:flex;justify-content:space-between;">
            <span>姓名</span>
            <span style="color:var(--ink);font-weight:600;">${elder.name}</span>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span>年龄</span>
            <span style="color:var(--ink);font-weight:600;">${elder.age}岁</span>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span>地址</span>
            <span style="color:var(--ink);font-weight:600;text-align:right;">${elder.address}</span>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span>健康状况</span>
            <span style="color:var(--ink);font-weight:600;text-align:right;">${elder.health}</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="font-size:0.9rem;font-weight:700;margin-bottom:12px;">🏥 健康状态</div>
        <div style="display:flex;gap:10px;">
          <div style="flex:1;background:${elder.status === 'warning' ? 'rgba(245,166,35,0.1)' : 'rgba(74,140,92,0.1)'} ;border-radius:12px;padding:14px;text-align:center;">
            <div style="font-size:1.8rem;margin-bottom:6px;">${elder.status === 'warning' ? '⚠️' : '✅'}</div>
            <div style="font-size:0.78rem;font-weight:600;color:${elder.status === 'warning' ? '#f5a623' : 'var(--accent2)'};">${elder.status === 'warning' ? '需关注' : '状态良好'}</div>
          </div>
          <div style="flex:1;background:rgba(61,126,166,0.1);border-radius:12px;padding:14px;text-align:center;">
            <div style="font-size:1.8rem;margin-bottom:6px;">💊</div>
            <div style="font-size:0.78rem;font-weight:600;color:var(--blue);">需定期服药</div>
          </div>
          <div style="flex:1;background:rgba(142,106,173,0.1);border-radius:12px;padding:14px;text-align:center;">
            <div style="font-size:1.8rem;margin-bottom:6px;">📞</div>
            <div style="font-size:0.78rem;font-weight:600;color:var(--purple);">紧急联系人</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="font-size:0.9rem;font-weight:700;margin-bottom:12px;">📞 紧急联系</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--bg2);border-radius:10px;">
            <div>
              <div style="font-weight:600;font-size:0.88rem;">村卫生室</div>
              <div style="font-size:0.75rem;color:var(--muted);">小王村卫生所 · 王医生</div>
            </div>
            <button class="btn btn-green btn-sm" onclick="showToast('正在拨打电话...')">📞 拨打</button>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--bg2);border-radius:10px;">
            <div>
              <div style="font-weight:600;font-size:0.88rem;">村支书</div>
              <div style="font-size:0.75rem;color:var(--muted);">李明 · 138****9999</div>
            </div>
            <button class="btn btn-green btn-sm" onclick="showToast('正在拨打电话...')">📞 拨打</button>
          </div>
        </div>
      </div>

      <div class="section-title">
        <span>📅 最近探视记录</span>
      </div>
      <div class="card">
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="font-size:1.2rem;">👀</div>
            <div style="flex:1;">
              <div style="font-weight:600;font-size:0.88rem;">上门探视</div>
              <div style="font-size:0.75rem;color:var(--muted);">王大海 · 今天 10:45</div>
            </div>
            <span class="tag tag-green">已完成</span>
          </div>
          <div style="height:1px;background:var(--rule);"></div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="font-size:1.2rem;">💊</div>
            <div style="flex:1;">
              <div style="font-weight:600;font-size:0.88rem;">代买降压药</div>
              <div style="font-size:0.75rem;color:var(--muted);">王大海 · 昨天 16:20</div>
            </div>
            <span class="tag tag-green">已完成</span>
          </div>
          <div style="height:1px;background:var(--rule);"></div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="font-size:1.2rem;">🎙️</div>
            <div style="flex:1;">
              <div style="font-weight:600;font-size:0.88rem;">捎句话</div>
              <div style="font-size:0.75rem;color:var(--muted);">王大海 · 7月5日</div>
            </div>
            <span class="tag tag-green">已完成</span>
          </div>
        </div>
      </div>

      <div class="section-title">
        <span>关联任务</span>
        <span style="font-size:0.78rem;color:var(--muted);font-weight:400;">共 ${relatedTasks.length} 个</span>
      </div>

      ${relatedTasks.length === 0 ? `
        <div class="empty-state" style="padding:30px 20px;">
          <div class="empty-icon">📋</div>
          <p>暂无关联任务</p>
        </div>
      ` : relatedTasks.map(task => `
        <a href="task-detail.html?id=${task.id}" class="task-item">
          <div class="task-item-header">
            <div>
              <div class="task-item-title">${task.typeIcon} ${task.title}</div>
            </div>
            <span class="tag ${task.status === 'done' ? 'tag-green' : task.status === 'ongoing' || task.status === 'delivering' ? 'tag-blue' : 'tag-orange'}">${task.statusLabel}</span>
          </div>
          <div class="task-item-desc">${task.desc}</div>
          <div class="task-item-footer">
            <div class="task-item-price">¥${task.budget}</div>
            <div class="task-item-meta">${task.createdAt}</div>
          </div>
        </a>
      `).join('')}

      <div style="padding-bottom:20px;">
        <button class="btn btn-primary btn-block" onclick="window.location.href='new-task.html?type=visit'">📝 发布探视任务</button>
      </div>
    `;
  }
</script>

</body>
</html>
