<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>老人管理 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="home.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='home.html'">← 返回</a>
      <h3>老人管理</h3>
      <div style="width:56px;"></div>
    </div>
    <div class="screen-content" id="elders-content">
      <!-- 动态渲染 -->
    </div>

    <div class="tab-bar">
      <a href="home.html" class="tab-item">
        <span class="tab-icon">🏠</span>
        <span>首页</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">📋</span>
        <span>任务</span>
      </a>
      <a href="messages.html" class="tab-item">
        <span class="tab-icon">💬</span>
        <span>消息</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
  setCurrentUser('parent1');

  const elderIds = currentUser.elders || [];
  const myElders = DB.elders.filter(e => elderIds.includes(e.id));

  const container = document.getElementById('elders-content');

  if (myElders.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👵</div>
        <p>暂无关联老人</p>
      </div>
    `;
  } else {
    container.innerHTML = myElders.map(elder => `
      <a href="elder-detail.html?id=${elder.id}" class="elder-card" style="text-decoration:none;color:inherit;">
        <div class="elder-avatar">${elder.avatar}</div>
        <div class="elder-info">
          <h4>${elder.name}</h4>
          <p>${elder.age}岁 · ${elder.village}</p>
          <p>${elder.address}</p>
        </div>
        <div class="elder-status">
          <div class="dot ${elder.status === 'warning' ? 'yellow' : ''}"></div>
          <span>${elder.status === 'warning' ? '关注' : '正常'}</span>
        </div>
      </a>
    `).join('');
  }
</script>

</body>
</html>
