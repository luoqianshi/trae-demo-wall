<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>编辑任务 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="tasks.html" class="nav-back" onclick="window.location.href='tasks.html'" style="font-size:0.85rem;">← 返回</a>
      <h3>编辑任务</h3>
      <span></span>
    </div>

    <div class="screen-content" style="padding-top:16px;">
      <p style="font-size:0.82rem;color:var(--muted);margin-bottom:14px;">选择任务类型</p>
      <div class="type-grid">
        <button class="type-option" data-type="shop" onclick="selectType('shop')">
          <div class="type-icon">🛒</div>
          <h4>代购代办</h4>
          <p>买药买菜、缴费取件</p>
        </button>
        <button class="type-option" data-type="visit" onclick="selectType('visit')">
          <div class="type-icon">👀</div>
          <h4>上门探视</h4>
          <p>看望老人、拍照反馈</p>
        </button>
        <button class="type-option" data-type="voice" onclick="selectType('voice')">
          <div class="type-icon">🎙️</div>
          <h4>捎句话</h4>
          <p>语音传递、双向沟通</p>
        </button>
        <button class="type-option" data-type="farm" onclick="selectType('farm')">
          <div class="type-icon">🌾</div>
          <h4>农时互助</h4>
          <p>收玉米、喂鸡、种菜</p>
        </button>
      </div>

      <div class="form-group">
        <label class="form-label">服务对象</label>
        <select class="form-select" id="elder-select">
          <!-- 动态生成 -->
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">任务描述</label>
        <textarea class="form-textarea" id="task-desc" placeholder="请详细描述您的需求，例如：去镇上药店买降压药（硝苯地平），送到我家..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">预算金额（元）</label>
        <input type="number" class="form-input" id="task-budget" placeholder="50" value="50">
        <p style="font-size:0.75rem;color:var(--muted-light);margin-top:6px;">包含货款和跑腿费，多退少补</p>
      </div>

      <div class="form-group">
        <label class="form-label">期望完成时间</label>
        <select class="form-select" id="task-time">
          <option>今天内</option>
          <option>明天</option>
          <option>三天内</option>
          <option>一周内</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">备注（可选）</label>
        <input type="text" class="form-input" id="task-note" placeholder="例如：老人耳背，请大声一点">
      </div>

      <button class="btn btn-primary btn-block" onclick="saveTask()" style="margin-top:8px;margin-bottom:12px;">
        保存修改
      </button>

      <button class="btn btn-block" onclick="deleteCurrentTask()" style="background:transparent;border:1px solid #e74c3c;color:#e74c3c;margin-bottom:20px;">
        删除任务
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="modal-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center;">
    <div id="modal-content" style="background:#fff;border-radius:20px;width:320px;overflow:hidden;transform:scale(0.95);transition:transform 0.2s;">
      <div id="modal-header" style="padding:20px 20px 0;font-weight:700;font-size:1.1rem;text-align:center;"></div>
      <div id="modal-body" style="padding:16px 20px;"></div>
      <div id="modal-footer" style="padding:12px 20px 20px;display:flex;gap:10px;"></div>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  setCurrentUser('parent1');

  let selectedType = null;
  let currentTaskId = null;

  const typeMap = {
    shop: { label: '代购代办', icon: '🛒' },
    visit: { label: '上门探视', icon: '👀' },
    voice: { label: '捎句话', icon: '🎙️' },
    farm: { label: '农时互助', icon: '🌾' }
  };

  const timeOptions = ['今天内', '明天', '三天内', '一周内'];

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function showModal(header, body, footer) {
    const overlay = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');
    document.getElementById('modal-header').innerHTML = header;
    document.getElementById('modal-body').innerHTML = body;
    document.getElementById('modal-footer').innerHTML = footer;
    overlay.style.display = 'flex';
    setTimeout(() => content.style.transform = 'scale(1)', 10);
  }

  function hideModal() {
    const overlay = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');
    content.style.transform = 'scale(0.95)';
    setTimeout(() => overlay.style.display = 'none', 200);
  }

  window.selectType = function(type) {
    selectedType = type;
    document.querySelectorAll('.type-option').forEach(el => el.classList.remove('selected'));
    document.querySelector(`.type-option[data-type="${type}"]`).classList.add('selected');
  };

  // 动态生成 elder options
  function populateElders(selectedElderId) {
    const select = document.getElementById('elder-select');
    select.innerHTML = '';
    DB.elders.forEach(function(elder) {
      const option = document.createElement('option');
      option.value = elder.id;
      option.textContent = elder.avatar + ' ' + elder.name + ' · ' + elder.address;
      if (elder.id === selectedElderId) {
        option.selected = true;
      }
      select.appendChild(option);
    });
  }

  // 初始化页面
  function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    if (!id) {
      showToast('任务ID不存在');
      setTimeout(function() {
        window.location.href = 'tasks.html';
      }, 1000);
      return;
    }

    const task = getTaskById(id);
    if (!task) {
      showToast('任务不存在');
      setTimeout(function() {
        window.location.href = 'tasks.html';
      }, 1000);
      return;
    }

    if (task.status !== 'pending') {
      showToast('只能编辑待接单状态的任务');
      setTimeout(function() {
        window.location.href = 'tasks.html';
      }, 1000);
      return;
    }

    currentTaskId = task.id;

    // 预填充表单
    if (task.type && typeMap[task.type]) {
      selectType(task.type);
    }

    populateElders(task.elderId);

    document.getElementById('task-desc').value = task.desc || '';
    document.getElementById('task-budget').value = task.budget || 50;

    if (task.expectTime && timeOptions.indexOf(task.expectTime) !== -1) {
      document.getElementById('task-time').value = task.expectTime;
    }

    document.getElementById('task-note').value = task.note || '';
  }

  window.saveTask = function() {
    const descEl = document.getElementById('task-desc');
    const budgetEl = document.getElementById('task-budget');
    const desc = descEl.value.trim();
    const budget = parseInt(budgetEl.value) || 0;
    const elderId = parseInt(document.getElementById('elder-select').value);
    const expectTime = document.getElementById('task-time').value;
    const note = document.getElementById('task-note').value.trim();

    descEl.classList.remove('error');
    budgetEl.classList.remove('error');

    if (!selectedType) {
      showToast('请选择任务类型');
      return;
    }
    if (!desc) {
      descEl.classList.add('error');
      showToast('请填写任务描述');
      descEl.focus();
      return;
    }
    if (desc.length < 5) {
      descEl.classList.add('error');
      showToast('任务描述至少5个字');
      descEl.focus();
      return;
    }
    if (budget < 10) {
      budgetEl.classList.add('error');
      showToast('预算金额至少10元');
      budgetEl.focus();
      return;
    }
    if (budget > 1000) {
      budgetEl.classList.add('error');
      showToast('预算金额不能超过1000元');
      budgetEl.focus();
      return;
    }

    const tm = typeMap[selectedType];
    const elder = getElderById(elderId);

    updateTask(currentTaskId, {
      type: selectedType,
      typeLabel: tm.label,
      typeIcon: tm.icon,
      title: desc.substring(0, 14) + (desc.length > 14 ? '...' : ''),
      desc: desc,
      budget: budget,
      elderId: elder.id,
      elderName: elder.name,
      elderAvatar: elder.avatar,
      address: elder.address,
      expectTime: expectTime,
      note: note
    });

    showToast('保存成功！');
    setTimeout(function() {
      window.location.href = 'task-detail.html?id=' + currentTaskId;
    }, 800);
  };

  window.deleteCurrentTask = function() {
    showModal(
      '🗑️ 删除任务',
      `
        <div style="text-align:center;padding:16px 0;">
          <div style="font-size:2.5rem;margin-bottom:12px;">⚠️</div>
          <div style="font-size:0.9rem;color:var(--muted);line-height:1.6;">
            确定要删除这个任务吗？<br>删除后无法恢复。
          </div>
        </div>
      `,
      `
        <button class="btn btn-outline btn-block" onclick="hideModal()">取消</button>
        <button class="btn btn-red btn-block" onclick="confirmDelete()">确认删除</button>
      `
    );
  };

  window.confirmDelete = function() {
    hideModal();
    const result = deleteTask(currentTaskId);
    if (result) {
      showToast('任务已删除');
      setTimeout(function() {
        window.location.href = 'tasks.html';
      }, 800);
    } else {
      showToast('删除失败');
    }
  };

  init();
})();
</script>

</body>
</html>
