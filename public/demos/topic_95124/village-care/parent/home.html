<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>子女端首页 - 村里有人</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="status-bar"></div>
    <div class="nav-header">
      <a href="../login.html" class="nav-back" style="font-size:0.85rem;" onclick="window.location.href='../login.html'">← 选择角色</a>
      <h3>村里有人 · 子女端</h3>
      <a href="messages.html" style="position:relative;text-decoration:none;font-size:1.1rem;color:var(--ink);">💬
        <span id="msg-badge" style="position:absolute;top:-6px;right:-6px;min-width:14px;height:14px;background:var(--red);color:#fff;font-size:0.55rem;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:700;padding:0 3px;">0</span>
      </a>
    </div>
    <div class="screen-content">
      <!-- 头部 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <div>
          <p style="font-size:0.78rem;color:var(--muted);" id="greeting">下午好，</p>
          <h2 style="font-size:1.25rem;font-weight:800;" id="user-name">张建国</h2>
        </div>
        <a href="../login.html" class="btn btn-xs btn-outline">切换角色</a>
      </div>

      <!-- 老人卡片 -->
      <div id="elder-cards"></div>

      <!-- 紧急呼叫 -->
      <button onclick="showEmergencyModal()" style="width:100%;padding:18px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:16px;font-size:1.05rem;font-weight:800;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 16px rgba(192,57,43,0.3);transition:transform 0.1s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">
        <span style="font-size:1.5rem;">🚨</span>
        <span>老人紧急求助</span>
      </button>

      <!-- 快捷入口 -->
      <div class="quick-grid">
        <a href="new-task.html?type=shop" class="quick-item">
          <div class="quick-icon">🛒</div>
          <span>跑腿代购</span>
        </a>
        <a href="new-task.html?type=voice" class="quick-item">
          <div class="quick-icon">🎙️</div>
          <span>捎句话</span>
        </a>
        <a href="farm.html" class="quick-item" onclick="window.location.href='farm.html'">
          <div class="quick-icon">🌾</div>
          <span>农时互助</span>
        </a>
        <a href="../modules/market.html" class="quick-item">
          <div class="quick-icon">📹</div>
          <span>云赶集</span>
        </a>
      </div>

      <!-- 任务状态概览 -->
      <div class="card" style="padding:14px;display:flex;justify-content:space-around;text-align:center;margin-bottom:18px;">
        <div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--accent);" id="stat-pending">0</div>
          <div style="font-size:0.7rem;color:var(--muted);">待接单</div>
        </div>
        <div style="width:1px;background:var(--rule);"></div>
        <div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--blue);" id="stat-ongoing">0</div>
          <div style="font-size:0.7rem;color:var(--muted);">进行中</div>
        </div>
        <div style="width:1px;background:var(--rule);"></div>
        <div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--accent2);" id="stat-done">0</div>
          <div style="font-size:0.7rem;color:var(--muted);">已完成</div>
        </div>
      </div>

      <!-- 最近任务 -->
      <div class="section-title">
        <span>📋 最近任务</span>
        <a href="tasks.html" class="nav-action">查看全部</a>
      </div>
      <div id="task-list"></div>
    </div>

    <!-- 底部导航 -->
    <div class="tab-bar">
      <a href="home.html" class="tab-item active">
        <span class="tab-icon">🏠</span>
        <span>首页</span>
      </a>
      <a href="tasks.html" class="tab-item">
        <span class="tab-icon">📋</span>
        <span>任务</span>
      </a>
      <a href="messages.html" class="tab-item">
        <span class="tab-icon">💬</span>
        <span>消息</span>
      </a>
      <a href="profile.html" class="tab-item">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<!-- 紧急求助弹窗 -->
<div id="emergency-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;justify-content:center;align-items:center;padding:24px;">
  <div style="background:#fff;border-radius:20px;width:100%;max-width:340px;overflow:hidden;animation:slideUp 0.3s ease-out;">
    <div style="background:linear-gradient(135deg,#c0392b,#e74c3c);padding:24px;text-align:center;color:#fff;">
      <div style="font-size:3rem;margin-bottom:12px;">🚨</div>
      <div style="font-size:1.2rem;font-weight:800;">紧急求助</div>
      <div style="font-size:0.85rem;opacity:0.9;margin-top:4px;">请确认老人状况</div>
    </div>
    <div style="padding:24px;">
      <div style="margin-bottom:16px;">
        <div style="font-size:0.85rem;font-weight:700;color:#2d2418;margin-bottom:8px;">选择紧急类型：</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <button onclick="selectEmergencyType('medical')" id="type-medical" style="padding:14px;border-radius:12px;border:2px solid rgba(192,57,43,0.2);background:rgba(192,57,43,0.05);font-size:0.85rem;font-weight:600;color:#c0392b;">🩺 医疗急救</button>
          <button onclick="selectEmergencyType('fire')" id="type-fire" style="padding:14px;border-radius:12px;border:2px solid rgba(243,156,18,0.2);background:rgba(243,156,18,0.05);font-size:0.85rem;font-weight:600;color:#e67e22;">🔥 火灾报警</button>
          <button onclick="selectEmergencyType('police')" id="type-police" style="padding:14px;border-radius:12px;border:2px solid rgba(52,152,219,0.2);background:rgba(52,152,219,0.05);font-size:0.85rem;font-weight:600;color:#3498db;">👮 治安报警</button>
          <button onclick="selectEmergencyType('other')" id="type-other" style="padding:14px;border-radius:12px;border:2px solid rgba(142,68,173,0.2);background:rgba(142,68,173,0.05);font-size:0.85rem;font-weight:600;color:#8e44ad;">📞 其他求助</button>
        </div>
      </div>
      <div style="margin-bottom:20px;">
        <div style="font-size:0.85rem;font-weight:700;color:#2d2418;margin-bottom:8px;">附加信息：</div>
        <textarea id="emergency-note" placeholder="请简要描述老人状况或位置..." style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(122,110,94,0.2);background:#faf7f2;font-size:0.85rem;resize:none;height:70px;"></textarea>
      </div>
      <div style="display:flex;gap:12px;">
        <button onclick="closeEmergencyModal()" style="flex:1;padding:14px;border-radius:12px;border:1px solid rgba(122,110,94,0.2);background:#faf7f2;font-size:0.9rem;font-weight:700;color:#7a6e5e;">取消</button>
        <button onclick="confirmEmergency()" style="flex:1;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#c0392b,#e74c3c);font-size:0.9rem;font-weight:700;color:#fff;">确认发送</button>
      </div>
    </div>
  </div>
</div>

<!-- 求助成功弹窗 -->
<div id="emergency-success" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;justify-content:center;align-items:center;padding:24px;">
  <div style="background:#fff;border-radius:20px;width:100%;max-width:320px;overflow:hidden;text-align:center;padding:32px;">
    <div style="width:80px;height:80px;background:rgba(74,140,92,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <span style="font-size:3rem;">✅</span>
    </div>
    <div style="font-size:1.1rem;font-weight:800;color:#2d2418;margin-bottom:8px;">求助已发送</div>
    <div style="font-size:0.85rem;color:#7a6e5e;line-height:1.6;margin-bottom:24px;">
      已通知附近跑腿人和村委会<br>
      预计5分钟内有人响应
    </div>
    <button onclick="closeEmergencySuccess()" style="width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#4a8c5c,#5aad6e);font-size:0.9rem;font-weight:700;color:#fff;">知道了</button>
  </div>
</div>
</div>

<script src="../js/data.js"></script>
<script>
(function() {
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  setCurrentUser('parent1');

  // 动态问候语
  const hour = new Date().getHours();
  const greeting = hour < 6 ? '凌晨好' : hour < 11 ? '上午好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
  document.getElementById('greeting').textContent = greeting + '，';
  document.getElementById('user-name').textContent = currentUser.name;

  // 动态老人卡片
  const elderIds = currentUser.elders || [];
  const myElders = DB.elders.filter(e => elderIds.includes(e.id));
  document.getElementById('elder-cards').innerHTML = myElders.map(elder => `
    <a href="elders.html" class="elder-card" style="text-decoration:none;color:inherit;" onclick="window.location.href='elders.html'">
      <div class="elder-avatar">${elder.avatar}</div>
      <div class="elder-info">
        <h4>母亲 · ${elder.name}</h4>
        <p>${elder.village} · ${elder.age}岁</p>
      </div>
      <div class="elder-status">
        <div class="dot ${elder.status === 'warning' ? 'yellow' : ''}"></div>
        <span>${elder.status === 'warning' ? '需关注' : '状态正常'}</span>
      </div>
    </a>
  `).join('');

  // 消息徽章
  const unread = getUnreadCount();
  const badge = document.getElementById('msg-badge');
  if (unread > 0) {
    badge.textContent = unread;
    badge.style.display = 'flex';
  }

  // 统计（进行中包含 delivering）
  document.getElementById('stat-pending').textContent = getTasksByStatus('pending').length;
  document.getElementById('stat-ongoing').textContent = DB.tasks.filter(t => t.status === 'ongoing' || t.status === 'delivering').length;
  document.getElementById('stat-done').textContent = getTasksByStatus('done').length;

  // 任务列表
  const container = document.getElementById('task-list');
  const tasks = DB.tasks.slice(0, 3);
  if (tasks.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>暂无任务，点击上方按钮发布</p>
      </div>`;
  } else {
    container.innerHTML = tasks.map(t => `
      <a href="task-detail.html?id=${t.id}" class="task-item">
        <div class="task-item-header">
          <span class="task-item-title">${t.typeIcon} ${t.title}</span>
          <span class="status-badge status-${t.status === 'delivering' ? 'ongoing' : t.status}">${t.statusLabel}</span>
        </div>
        <p class="task-item-desc">${t.desc}</p>
        <div class="task-item-footer">
          <span class="task-item-meta">${t.createdAt} · ${t.runnerName || '待分配'}</span>
          <span class="task-item-price">¥${t.budget}</span>
        </div>
      </a>
    `).join('');
  }
})();

let selectedEmergencyType = '';

function showEmergencyModal() {
  document.getElementById('emergency-modal').style.display = 'flex';
  selectedEmergencyType = '';
  document.querySelectorAll('[id^="type-"]').forEach(b => b.style.borderColor = 'rgba(122,110,94,0.2)');
}

function closeEmergencyModal() {
  document.getElementById('emergency-modal').style.display = 'none';
}

function selectEmergencyType(type) {
  selectedEmergencyType = type;
  document.querySelectorAll('[id^="type-"]').forEach(b => {
    b.style.borderColor = b.id === `type-${type}` ? '#c0392b' : 'rgba(122,110,94,0.2)';
  });
}

function confirmEmergency() {
  if (!selectedEmergencyType) {
    showToast('请选择紧急类型');
    return;
  }
  closeEmergencyModal();
  document.getElementById('emergency-success').style.display = 'flex';
}

function closeEmergencySuccess() {
  document.getElementById('emergency-success').style.display = 'none';
}
</script>

</body>
</html>
