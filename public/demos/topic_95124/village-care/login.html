<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>选择角色 - 村里有人</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <div class="screen">
    <div class="screen-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;padding-top:80px;">
      <div style="font-size:3.5rem;margin-bottom:18px;">🏘️</div>
      <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:8px;">村里有人</h1>
      <p style="font-size:0.85rem;color:var(--muted);margin-bottom:44px;">选择您的身份进入平台</p>

      <div style="display:flex;flex-direction:column;gap:16px;width:100%;">
        <a href="parent/home.html" style="background:rgba(255,255,255,0.8);border:2px solid var(--rule);border-radius:20px;padding:28px 20px;text-decoration:none;color:inherit;transition:all 0.3s;display:block;"
           onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--rule)'">
          <div style="font-size:2.5rem;margin-bottom:12px;">👨‍💼</div>
          <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:6px;">我是子女</h3>
          <p style="font-size:0.8rem;color:var(--muted);margin:0;">为留守在农村的父母发布任务、查看状态</p>
        </a>

        <a href="runner/home.html" style="background:rgba(255,255,255,0.8);border:2px solid var(--rule);border-radius:20px;padding:28px 20px;text-decoration:none;color:inherit;transition:all 0.3s;display:block;"
           onmouseover="this.style.borderColor='var(--accent2)'" onmouseout="this.style.borderColor='var(--rule)'">
          <div style="font-size:2.5rem;margin-bottom:12px;">🤝</div>
          <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:6px;">我是跑腿人</h3>
          <p style="font-size:0.8rem;color:var(--muted);margin:0;">接单帮邻里办事、赚取跑腿收入</p>
        </a>
      </div>

      <a href="index.html" style="margin-top:30px;font-size:0.8rem;color:var(--muted-light);text-decoration:none;" onclick="window.location.href='index.html'">← 返回首页</a>
    </div>
  </div>
</div>

</body>
</html>
