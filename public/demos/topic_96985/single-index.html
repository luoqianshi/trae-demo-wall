    function relativeTime(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);
      if (minutes < 1) return '刚刚';
      if (minutes < 60) return `${minutes}分钟前`;
      if (hours < 24) return `${hours}小时前`;
      if (days < 30) return `${days}天前`;
      return new Date(iso).toLocaleDateString('zh-CN');
    }

    function formatNumber(n) {
      return n.toLocaleString('zh-CN');
    }

    let appState = {
      selectedCity: 'all',
      page: 'map',
      selectedPlace: null,
      cityDropdownOpen: false,
      reports: [],
    };

    function getFilteredPlaces() {
      if (appState.selectedCity === 'all') return PLACES;
      return PLACES.filter(p => p.city === appState.selectedCity);
    }

    function getTotalReports() {
      return getFilteredPlaces().reduce((sum, p) => sum + p.totalReports, 0);
    }

    function getRectifiedRate() {
      const places = getFilteredPlaces();
      if (places.length === 0) return 0;
      return Math.round((places.filter(p => p.rectified).length / places.length) * 100);
    }

            <span class="logo-text">烟迹 <span>SmokeTrace</span></span>
          </div>
          <div class="header-right">

            <button class="report-btn" onclick="openReportModal()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>

            </button>
          </div>
        </header>
        ${appState.cityDropdownOpen ? renderCityDropdown() : ''}
      `;

    function renderCityDropdown() {
      return `

      `;

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-value">${formatNumber(getTotalReports())}</span>
            <span class="stat-label">条标记</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-value" style="color: #fff;">${getFilteredPlaces().length}</span>
            <span class="stat-label">场所</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-value" style="color: #10b981;">${getRectifiedRate()}%</span>
            <span class="stat-label">整改率</span>
          </div>
        </div>
      `;
    }

    function renderMap() {
      return `
        <div class="main-content">
          <div class="map-container" id="map"></div>
          <div class="side-panel">
            ${renderSidePanel()}
          </div>
          <div class="heat-legend">
            <div class="legend-label">标记热度</div>
            <div class="legend-bar">
              <span class="legend-text">少</span>
              <div class="legend-gradient"></div>
              <span class="legend-text">多</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderSidePanel() {
      const places = [...getFilteredPlaces()].sort((a, b) => b.totalReports - a.totalReports).slice(0, 8);
      return `
        <div class="panel-title">
          <h3>重点场所</h3>
          <span class="data-link" onclick="showDataPage()">城市数据</span>
        </div>
        <div>
          ${places.map(place => `
            <div class="place-card" onclick="showPlaceDetail('${place.id}')">
              <div class="place-header">
                <span class="place-name">${place.name}</span>
                <span class="place-count">${place.totalReports}</span>
              </div>
              <div class="place-meta">${place.cityName} · ${PLACE_TYPES[place.type].label}</div>
              <div class="place-footer">
                <span class="status-tag ${place.rectified ? 'status-rectified' : 'status-pending'}">
                  ${place.rectified ? '已整改' : '待整改'}
                </span>
                <span class="time-ago">最近 ${relativeTime(place.lastReportAt)}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderPlaceDetail() {
      const place = PLACES.find(p => p.id === appState.selectedPlace);
      if (!place) return '';
      return `
        <div class="main-content">
          <div class="side-panel" style="width: 100%;">
            <button class="back-btn" onclick="goBack()">← 返回地图</button>
            <div class="place-detail">
              <div class="detail-header">
                <h2 class="detail-title">${place.name}</h2>
                <p class="detail-meta">${place.cityName} · ${PLACE_TYPES[place.type].label}</p>
              </div>
              <div class="detail-stats">
                <div class="detail-stat">
                  <div class="detail-stat-value" style="color: #f59e0b;">${formatNumber(place.totalReports)}</div>
                  <div class="detail-stat-label">累计标记</div>
                </div>
                <div class="detail-stat">
                  <div class="detail-stat-value" style="color: ${place.rectified ? '#10b981' : '#ef4444'};">${place.rectified ? '已整改' : '待整改'}</div>
                  <div class="detail-stat-label">处理状态</div>
                </div>
                <div class="detail-stat">
                  <div class="detail-stat-value" style="color: #fff;">${relativeTime(place.lastReportAt)}</div>
                  <div class="detail-stat-label">最近标记</div>
                </div>
              </div>
              <div class="detail-map" id="detail-map"></div>
              <div class="detail-reports">
                <h4>最新举报</h4>
                ${Array(Math.min(5, place.totalReports)).fill(0).map((_, i) => `
                  <div class="report-item">
                    <p class="report-desc">用户标记该场所存在违规吸烟行为</p>
                    <p class="report-time">${relativeTime(place.lastReportAt)}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDataPage() {
      const stats = CITIES.map(city => {
        const cityPlaces = PLACES.filter(p => p.city === city.code);
        const totalReports = cityPlaces.reduce((sum, p) => sum + p.totalReports, 0);
        const rectifiedCount = cityPlaces.filter(p => p.rectified).length;
        return { city, totalReports, rectifiedCount, rectifiedRate: cityPlaces.length ? rectifiedCount / cityPlaces.length : 0 };
      }).sort((a, b) => b.totalReports - a.totalReports);

      const best = [...stats].sort((a, b) => b.rectifiedRate - a.rectifiedRate)[0];
      const worst = stats[0];
      const totalReports = stats.reduce((sum, s) => sum + s.totalReports, 0);
      const avgRectified = stats.reduce((sum, s) => sum + s.rectifiedRate, 0) / stats.length;

      return `
        <div class="main-content">
          <div class="side-panel" style="width: 100%;">
            <button class="back-btn" onclick="goBack()">← 返回地图</button>
            <div class="data-page">
              <h2 style="font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 20px;">城市数据中心</h2>
              <div class="data-cards">
                <div class="data-card">
                  <div class="data-card-value" style="color: #f59e0b;">${formatNumber(totalReports)}</div>
                  <div class="data-card-label">全国总标记</div>
                </div>
                <div class="data-card">
                  <div class="data-card-value" style="color: #fff;">${stats.length}</div>
                  <div class="data-card-label">覆盖城市</div>
                </div>
                <div class="data-card">
                  <div class="data-card-value" style="color: #10b981;">${(avgRectified * 100).toFixed(1)}%</div>
                  <div class="data-card-label">平均整改率</div>
                </div>
                <div class="data-card">
                  <div class="data-card-value" style="color: #ef4444;">${worst.city.name}</div>
                  <div class="data-card-label">举报最多城市</div>
                </div>
              </div>
              <h3 style="font-size: 16px; font-weight: 600; color: #fff; margin: 20px 0 12px;">城市举报排行</h3>
              <div class="ranking-list">
                ${stats.map((s, idx) => {
                  const max = stats[0].totalReports;
                  const width = (s.totalReports / max) * 100;
                  return `
                    <div class="ranking-item">
                      <span class="ranking-num">${idx + 1}</span>
                      <span class="ranking-name">${s.city.name}</span>
                      <div class="ranking-bar">
                        <div class="ranking-fill" style="width: ${width}%"></div>
                      </div>
                      <span class="ranking-count">${s.totalReports}</span>
                    </div>
                  `;
                }).join('')}
              </div>
              <div class="best-worst">
                <div class="bw-card good">
                  <div class="bw-label">整改最好</div>
                  <div class="bw-value" style="color: #10b981;">${best.city.name}</div>
                </div>
                <div class="bw-card bad">
                  <div class="bw-label">举报最多</div>
                  <div class="bw-value" style="color: #ef4444;">${worst.city.name}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderReportModal() {
      return `
        <div class="modal-overlay" onclick="closeReportModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeReportModal()">×</button>
            <h2>拍照标记投诉</h2>
            <p>记录身边的违规吸烟行为，共同守护无烟环境</p>
            <form onsubmit="handleReportSubmit(event)">
              <div class="form-row">
                <div class="form-group">
                  <label>城市</label>
                  <select id="report-city">
                    ${CITIES.map(city => `<option value="${city.code}">${city.name}</option>`).join('')}
                  </select>
                </div>
                <div class="form-group">
                  <label>场所类型</label>
                  <select id="report-type">
                    ${Object.entries(PLACE_TYPES).map(([key, val]) => `<option value="${key}">${val.label}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label>场所名称</label>
                <input type="text" id="report-name" placeholder="如：某某餐厅、地铁站" required>
              </div>
              <div class="form-group">
                <label>详细地址</label>
                <input type="text" id="report-address" placeholder="补充具体位置信息">
              </div>
              <div class="form-group">
                <label>描述（选填）</label>
                <textarea id="report-desc" placeholder="补充描述现场情况…" maxlength="200"></textarea>
              </div>
              <button type="submit" class="submit-btn">提交标记</button>
            </form>
          </div>
        </div>
      `;
    }

    function renderSuccessModal() {
      return `
        <div class="modal-overlay" onclick="closeSuccessModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <div class="success-msg">
              <div class="check-icon">✓</div>
              <h3>提交成功</h3>
              <p>感谢您的标记，地图将自动更新</p>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      let html = renderHeader() + renderStatsBar();
      if (appState.page === 'map') {
        html += renderMap();
      } else if (appState.page === 'place') {
        html += renderPlaceDetail();
      } else if (appState.page === 'data') {
        html += renderDataPage();
      }
      document.getElementById('root').innerHTML = html;
      initMap();
    }

    let mapInstance = null;
    let detailMapInstance = null;

    function initMap() {
      if (appState.page !== 'map') return;
      setTimeout(() => {
        const mapDiv = document.getElementById('map');
        if (!mapDiv || mapInstance) return;
        const center = appState.selectedCity === 'all' ? [35.8617, 104.1954] : CITIES.find(c => c.code === appState.selectedCity).latLng || [35.8617, 104.1954];
        mapInstance = L.map('map', { zoomControl: false }).setView(center, appState.selectedCity === 'all' ? 5 : 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(mapInstance);
        getFilteredPlaces().forEach(place => {
          const type = PLACE_TYPES[place.type];
          const size = Math.min(48, Math.max(28, 24 + Math.log10(place.totalReports + 1) * 8));
          const icon = L.divIcon({
            className: 'custom-marker',
            html: `<div style="width: ${size}px; height: ${size}px; background: ${type.color}; border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #07090d; font-weight: 800; font-size: ${Math.max(10, size * 0.35)}px; box-shadow: 0 0 16px ${type.color}80;">${place.totalReports}</div>`,
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2],
            popupAnchor: [0, -size / 2],
          });
          L.marker([place.lat, place.lng], { icon }).addTo(mapInstance)
            .bindPopup(`<div style="padding: 8px; min-width: 160px;"><h4 style="font-weight: 700; color: #fff; margin: 0 0 4px;">${place.name}</h4><p style="font-size: 12px; color: #6c757d; margin: 0 0 8px;">${place.cityName} · ${type.label}</p><div style="display: flex; align-items: center; gap: 4px; margin-bottom: 8px;"><span style="color: #f59e0b; font-weight: 700; font-size: 18px;">${place.totalReports}</span><span style="font-size: 11px; color: #6c757d;">条标记</span></div><button onclick="showPlaceDetail('${place.id}'); this.closest('.leaflet-popup').remove();" style="width: 100%; padding: 6px; border-radius: 6px; background: rgba(245,158,11,0.2); color: #f59e0b; font-size: 12px; font-weight: 600; border: none; cursor: pointer;">查看详情</button></div>`);
        });
      }, 100);
    }

    function initDetailMap() {
      setTimeout(() => {
        const mapDiv = document.getElementById('detail-map');
        if (!mapDiv || detailMapInstance) return;
        const place = PLACES.find(p => p.id === appState.selectedPlace);
        if (!place) return;
        detailMapInstance = L.map('detail-map', { zoomControl: false }).setView([place.lat, place.lng], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(detailMapInstance);
        const type = PLACE_TYPES[place.type];
        const icon = L.divIcon({
          className: 'custom-marker',
          html: `<div style="width: 36px; height: 36px; background: ${type.color}; border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #07090d; font-weight: 800; font-size: 14px; box-shadow: 0 0 16px ${type.color}80;">${place.totalReports}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18],
        });
        L.marker([place.lat, place.lng], { icon }).addTo(detailMapInstance);
      }, 100);
    }

    function toggleCityDropdown() {
      appState.cityDropdownOpen = !appState.cityDropdownOpen;
      render();
    }

    function selectCity(city) {
      appState.selectedCity = city;
      appState.cityDropdownOpen = false;
      mapInstance = null;
      render();
    }

    function openReportModal() {
      document.getElementById('root').innerHTML += renderReportModal();
    }

    function closeReportModal() {
      const overlay = document.querySelector('.modal-overlay');
      if (overlay) overlay.remove();
    }

    function handleReportSubmit(e) {
      e.preventDefault();
      const city = document.getElementById('report-city').value;
      const type = document.getElementById('report-type').value;
      const name = document.getElementById('report-name').value;
      const cityData = CITIES.find(c => c.code === city);
      PLACES.push({
        id: 'new_' + Date.now(),
        name,
        type,
        city,
        cityName: cityData.name,
        lat: cityData.lat + (Math.random() - 0.5) * 0.02,
        lng: cityData.lng + (Math.random() - 0.5) * 0.02,
        totalReports: 1,
        rectified: false,
        lastReportAt: new Date().toISOString(),
      });
      closeReportModal();
      document.getElementById('root').innerHTML += renderSuccessModal();
      mapInstance = null;
      setTimeout(() => {
        closeSuccessModal();
        render();
      }, 1500);
    }

    function closeSuccessModal() {
      const overlay = document.querySelector('.modal-overlay');
      if (overlay) overlay.remove();
    }

    function showPlaceDetail(id) {
      appState.selectedPlace = id;
      appState.page = 'place';
      detailMapInstance = null;
      render();
      initDetailMap();
    }

    function showDataPage() {
      appState.page = 'data';
      render();
    }

    function goBack() {
      appState.page = 'map';
      appState.selectedPlace = null;
      mapInstance = null;
      render();
    }

    document.addEventListener('click', () => {
      if (appState.cityDropdownOpen) {
        appState.cityDropdownOpen = false;
        render();
      }
    });

    render();
  </script>
</body>
</html>
