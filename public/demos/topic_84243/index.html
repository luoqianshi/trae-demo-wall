<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原理图设计器 - Schematic Designer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text-primary:#e0e0e0;--text-secondary:#8b949e;--accent:#00d4ff;--accent-dim:#1a3a4a;--danger:#ff4444;--warning:#ffaa00;--success:#3fb950;--font-mono:"Consolas","Courier New",monospace;--font-sans:"Segoe UI","Microsoft YaHei",sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans)}
#app{display:flex;flex-direction:column;height:100vh}
#toolbar{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#toolbar .brand{font-size:16px;font-weight:bold;color:var(--accent);margin-right:12px;white-space:nowrap}
#toolbar .meta-title{font-size:12px;color:var(--text-secondary);margin-right:12px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
#toolbar .separator{width:1px;height:24px;background:var(--border);margin:0 4px}
.toolbar-btn{padding:5px 10px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);cursor:pointer;font-size:12px;white-space:nowrap;transition:all 0.15s}
.toolbar-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.toolbar-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:bold}
.toolbar-btn.primary:hover{background:#00e8ff}
.toolbar-btn.danger{color:var(--danger)}
.toolbar-btn.danger:hover{background:#2a1111;border-color:var(--danger)}
#main-content{display:flex;flex:1;overflow:hidden}
#left-panel{width:380px;min-width:300px;display:flex;flex-direction:column;background:var(--bg-secondary);border-right:1px solid var(--border);resize:horizontal;overflow:hidden}
#panel-header{padding:8px 12px;font-size:12px;font-weight:bold;color:var(--text-secondary);background:var(--bg-tertiary);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#code-editor{flex:1;width:100%;padding:12px;background:var(--bg-primary);color:var(--accent);border:none;resize:none;font-family:var(--font-mono);font-size:12px;line-height:1.5;tab-size:2;outline:none;overflow:auto}
#code-editor::placeholder{color:var(--text-secondary);opacity:0.5}
#status-bar{padding:6px 12px;font-size:11px;background:var(--bg-tertiary);border-top:1px solid var(--border);min-height:28px}
#status-message{color:var(--text-secondary)}
#status-message.success{color:var(--success)}
#status-message.error{color:var(--danger)}
#status-message.warning{color:var(--warning)}
#right-panel{flex:1;position:relative;overflow:hidden;background:var(--bg-primary)}
#schematic-canvas{width:100%;height:100%;display:block}
#schematic-canvas svg{width:100%;height:100%}
#component-panel{display:none;position:absolute;top:10px;right:10px;width:280px;max-height:70vh;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:100;overflow:hidden}
#component-panel .panel-header{padding:10px 14px;font-size:13px;font-weight:bold;color:var(--accent);background:var(--bg-tertiary);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#component-panel .panel-header .close-btn{cursor:pointer;color:var(--text-secondary);font-size:16px;padding:0 4px}
#component-panel .panel-header .close-btn:hover{color:var(--danger)}
#lcsc-search-wrap{padding:8px 12px;border-bottom:1px solid var(--border)}
#lcsc-search{width:100%;padding:6px 10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);font-size:12px;outline:none}
#lcsc-search:focus{border-color:var(--accent)}
#lcsc-results{display:none;max-height:200px;overflow-y:auto;border-bottom:1px solid var(--border)}
.lcsc-item{padding:6px 12px;font-size:11px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.lcsc-item:hover{background:var(--accent-dim)}
.lcsc-code{color:var(--accent);font-family:var(--font-mono);font-weight:bold;min-width:60px}
.lcsc-value{color:var(--text-primary);min-width:50px}
.lcsc-desc{color:var(--text-secondary);font-size:10px}
#component-list{max-height:400px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px}
.component-item{padding:8px 10px;font-size:11px;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:6px;transition:all 0.1s;color:var(--text-secondary)}
.component-item:hover{background:var(--accent-dim);color:var(--accent)}
.comp-icon{width:22px;height:18px;display:inline-flex;align-items:center;justify-content:center}.comp-icon svg{display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-secondary)}
@media(max-width:768px){#left-panel{width:100%;min-width:0}#main-content{flex-direction:column}}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="brand">原理图设计器</span>
    <span class="meta-title" id="meta-title">Untitled</span>
    <span class="separator"></span>
    <button class="toolbar-btn" id="btn-sample" title="加载示例电路">示例</button>
    <button class="toolbar-btn" id="btn-import" title="导入JSON文件 (Ctrl+O)">导入</button>
    <input type="file" id="file-input" accept=".json" style="display:none">
    <button class="toolbar-btn" id="btn-export-json" title="导出JSON (Ctrl+S)">导出JSON</button>
    <button class="toolbar-btn" id="btn-export-svg" title="导出SVG矢量图">导出SVG</button>
    <button class="toolbar-btn" id="btn-export-png" title="导出PNG图片">导出PNG</button>
    <span class="separator"></span>
    <button class="toolbar-btn primary" id="btn-render" title="渲染电路图 (Ctrl+Enter)">渲染</button>
    <span class="separator"></span>
    <button class="toolbar-btn" id="btn-zoom-in" title="放大">+</button>
    <button class="toolbar-btn" id="btn-zoom-out" title="缩小">-</button>
    <button class="toolbar-btn" id="btn-zoom-fit" title="适应窗口">适应</button>
    <button class="toolbar-btn" id="btn-zoom-reset" title="重置视图 (Ctrl+0)">重置</button>
    <span class="separator"></span>
    <button class="toolbar-btn" id="btn-add-component" title="从元件库添加">添加元件</button>
    <button class="toolbar-btn danger" id="btn-clear" title="清空画布">清空</button>
  </div>
  <div id="main-content">
    <div id="left-panel">
      <div id="panel-header"><span>JSON 电路描述代码</span><span style="font-size:10px;color:var(--text-secondary)">Ctrl+Enter 渲染</span></div>
      <textarea id="code-editor" placeholder="在此粘贴或输入 JSON 电路代码..." spellcheck="false"></textarea>
      <div id="status-bar"><span id="status-message">点击"示例"按钮加载示例电路</span></div>
    </div>
    <div id="right-panel">
      <div id="schematic-canvas"></div>
      <div id="component-panel">
        <div class="panel-header"><span>元件库</span><span class="close-btn" id="btn-close-panel">X</span></div>
        <div id="lcsc-search-wrap"><input type="text" id="lcsc-search" placeholder="搜索 LCSC 元件 (编号/型号/类型)..."></div>
        <div id="lcsc-results"></div>
        <div id="component-list"></div>
      </div>
    </div>
  </div>
</div>

_setupComponentLibrary(){var list=document.getElementById("component-list"),types=getComponentTypes();
for(var i=0;i<types.length;i++){var t=types[i],item=document.createElement("div");item.className="component-item";item.innerHTML='<span class="comp-icon">'+t.icon+'</span><span>'+t.name+"</span>";item.title=t.name;item.addEventListener("click",function(ct){return function(){this._addComponentToCanvas(ct)}}.bind(this)(t));list.appendChild(item)}}
_setupKeyboardShortcuts(){var a=this;document.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey){switch(e.key.toLowerCase()){case"s":e.preventDefault();a._exportJSON();break;case"z":e.preventDefault();a._undo();break;case"y":e.preventDefault();a._redo();break;case"o":e.preventDefault();document.getElementById("file-input").click();break;case"0":e.preventDefault();a.renderer.resetView()}}})}
_loadSample(){document.getElementById("code-editor").value=SCHEMATIC_PARSER.generateSample();this._parseAndRender()}
_parseAndRender(){var json=document.getElementById("code-editor").value.trim();if(!json){this._clear();return}
var result=SCHEMATIC_PARSER.parse(json),status=document.getElementById("status-message");
if(result.errors&&result.errors.length>0){status.innerHTML=result.errors.map(function(e){return'<span class="error">❌ '+e+"</span>"}).join("<br>");status.className="status error";return}
if(result.warnings&&result.warnings.length>0){status.innerHTML=result.warnings.map(function(w){return'<span class="warning">⚠ '+w+"</span>"}).join("<br>");status.className="status warning"}
else{status.innerHTML="✅ "+result.components.length+" 个元件, "+result.wires.length+" 条连线, "+result.nets.length+" 个网络标签";status.className="status success"}
document.getElementById("meta-title").textContent=result.meta.title||"Untitled";this.currentSchematic=result;this._pushHistory(result);this.renderer.render(result)}
_importFile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader;r.onload=function(ev){document.getElementById("code-editor").value=ev.target.result;this._parseAndRender()}.bind(this);r.readAsText(f);e.target.value=""}
_exportJSON(){var j=document.getElementById("code-editor").value;this._download(new Blob([j],{type:"application/json"}),"schematic.json")}
_exportSVG(){this._download(new Blob([this.renderer.exportSVG()],{type:"image/svg+xml"}),"schematic.svg")}
_exportPNG(){this.renderer.exportPNG(function(b){this._download(b,"schematic.png")}.bind(this))}
_download(blob,fn){var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)}
_clear(){document.getElementById("code-editor").value="";document.getElementById("status-message").innerHTML="";document.getElementById("status-message").className="status";document.getElementById("meta-title").textContent="Untitled";this.currentSchematic={components:[],wires:[],nets:[],errors:[],warnings:[]};this.renderer.render(this.currentSchematic)}
_addComponentToCanvas(ci){var r=document.getElementById("schematic-canvas").getBoundingClientRect(),cx=(r.width/2-this.renderer.offsetX)/this.renderer.scale,cy=(r.height/2-this.renderer.offsetY)/this.renderer.scale,ids=this.currentSchematic.components.map(function(c){return c.id}),n=1,p=ci.id.charAt(0).toUpperCase(),nid=p+n;while(ids.includes(nid))n++,nid=p+n;var nc={id:nid,type:ci.id,value:"",x:Math.round(cx/10)*10,y:Math.round(cy/10)*10,rotation:0,mirror:"none"};this.currentSchematic.components.push(nc);this._updateEditorFromSchematic();this._parseAndRender()}
_updateEditorFromSchematic(){var d={meta:this.currentSchematic.meta||{title:"Untitled"},components:this.currentSchematic.components,wires:this.currentSchematic.wires.map(function(w){return{from:w.from.isNet?w.from.id:w.from.id+":"+w.from.pin,to:w.to.isNet?w.to.id:w.to.id+":"+w.to.pin}}),nets:this.currentSchematic.nets};document.getElementById("code-editor").value=JSON.stringify(d,null,2)}
_searchLCSC(kw){var r=document.getElementById("lcsc-results");if(!kw||kw.length<1){r.innerHTML="";r.style.display="none";return}var results=searchLCSC(kw);r.style.display="block";if(results.length===0){r.innerHTML='<div class="lcsc-item">未找到匹配的元件</div>';return}r.innerHTML=results.slice(0,20).map(function(x){return'<div class="lcsc-item" data-lcsc="'+x.lcsc+'" data-type="'+x.type+'" data-value="'+x.value+'"><span class="lcsc-code">'+x.lcsc+'</span><span class="lcsc-value">'+x.value+'</span><span class="lcsc-desc">'+x.desc+"</span></div>"}).join("");var a=this;r.querySelectorAll(".lcsc-item").forEach(function(item){item.addEventListener("click",function(){var l=this.dataset.lcsc,t=this.dataset.type,v=this.dataset.value;a._addLCSCComponent(l,t,v);r.style.display="none";document.getElementById("lcsc-search").value=""})})}
_addLCSCComponent(lcsc,type,val){var r=document.getElementById("schematic-canvas").getBoundingClientRect(),cx=(r.width/2-this.renderer.offsetX)/this.renderer.scale,cy=(r.height/2-this.renderer.offsetY)/this.renderer.scale,ids=this.currentSchematic.components.map(function(c){return c.id}),n=1,p=type.charAt(0).toUpperCase(),nid=p+n;while(ids.includes(nid))n++,nid=p+n;var info=lookupLCSC(lcsc),nc={id:nid,type:type,lcsc:lcsc,lcscInfo:info,value:val,designator:nid,x:Math.round(cx/10)*10,y:Math.round(cy/10)*10,rotation:0,mirror:"none",pins:info?info.pins:null,desc:info?info.desc:""};this.currentSchematic.components.push(nc);this._updateEditorFromSchematic();this._parseAndRender()}
_pushHistory(sc){this.history=this.history.slice(0,this.historyIndex+1);this.history.push(JSON.parse(JSON.stringify(sc)));this.historyIndex=this.history.length-1;if(this.history.length>50){this.history.shift();this.historyIndex--}}
_undo(){if(this.historyIndex>0){this.historyIndex--;this._restoreFromHistory()}}
_redo(){if(this.historyIndex<this.history.length-1){this.historyIndex++;this._restoreFromHistory()}}
_restoreFromHistory(){var sc=JSON.parse(JSON.stringify(this.history[this.historyIndex]));this.currentSchematic=sc;this._updateEditorFromSchematic();this.renderer.render(sc);document.getElementById("status-message").innerHTML="↩ 已撤销/重做";document.getElementById("status-message").className="status"}}
document.addEventListener("DOMContentLoaded",function(){window.app=new SchematicApp})
</script>
