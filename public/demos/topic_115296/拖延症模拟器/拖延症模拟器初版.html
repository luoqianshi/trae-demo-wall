<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>拖延症模拟器 - 从7天模拟到循证干预</title>
<style>
:root{
  --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#e94560;
  --accent2:#533483; --text:#eaeaea; --muted:#8892a0; --border:#2a2a4a;
  --green:#4ecca3; --yellow:#f9c80e; --red:#ee5253; --blue:#34e7e4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
.container{max-width:680px;margin:0 auto;padding:16px}
.header{text-align:center;padding:20px 16px 12px}
.header h1{font-size:22px;color:var(--accent);margin-bottom:4px}
.header p{font-size:13px;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:8px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:8px 0}
.nav a{padding:6px 12px;font-size:13px;color:var(--muted);text-decoration:none;border-radius:6px;transition:.2s;cursor:pointer}
.nav a:hover{color:var(--text);background:var(--surface)}
.nav a.active{color:var(--accent);background:var(--surface);font-weight:600}
.view{display:none;padding:16px 0}
.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:12px}
.card h2{font-size:18px;margin-bottom:8px;color:var(--accent)}
.card h3{font-size:15px;margin:12px 0 6px;color:var(--yellow)}
.card p{font-size:14px;margin-bottom:8px;color:var(--text)}
.card .lede{font-size:15px;color:var(--muted);margin-bottom:12px}
.btn{display:inline-block;padding:10px 24px;font-size:14px;border:none;border-radius:8px;cursor:pointer;text-decoration:none;margin:4px 4px 4px 0;transition:.2s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#ff5e7e}
.btn.outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.ghost{background:var(--border);color:var(--muted)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.lg{padding:12px 32px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.muted{color:var(--muted);font-size:13px}
.divider{height:1px;background:var(--border);margin:16px 0}

/* 角色创建 */
.char-section{margin-bottom:16px}
.char-section label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.opt-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.opt-btn{padding:4px 10px;font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;cursor:pointer}
.opt-btn.selected{border-color:var(--accent);background:var(--accent2);color:#fff}
.swatch{width:24px;height:24px;border-radius:4px;border:2px solid var(--border);cursor:pointer}
.swatch.selected{border-color:var(--accent);border-width:3px}
.char-input{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;margin-bottom:8px}
.char-canvas-wrap{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
#char-canvas{image-rendering:pixelated;border:1px solid var(--border);border-radius:8px;background:#2a3a5a}

/* 任务选择 */
.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.task-card{background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;text-align:center}
.task-card.selected{border-color:var(--accent);background:var(--accent2)}
.task-card .emoji{font-size:24px}
.task-card .name{font-size:13px;margin-top:4px}
.task-card .desc{font-size:11px;color:var(--muted);margin-top:2px}

/* 场景选择 */
.scene-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.scene-btn{background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;text-align:left}
.scene-btn.selected{border-color:var(--accent);background:var(--accent2)}
.scene-btn .title{font-size:14px;font-weight:600}
.scene-btn .sub{font-size:11px;color:var(--muted);margin-top:2px}

/* 游戏画面 */
#sim-game canvas{image-rendering:pixelated;width:100%;max-width:480px;border:1px solid var(--border);border-radius:8px;display:block;margin:0 auto}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}
.hud-item{text-align:center}
.hud-item .lbl{font-size:10px;color:var(--muted)}
.hud-item .val{font-size:14px;font-weight:700}
.hud-bar{height:6px;background:var(--border);border-radius:3px;margin-top:2px;overflow:hidden}
.hud-bar-fill{height:100%;border-radius:3px;transition:.3s}
.dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:4px;justify-content:center;margin:12px auto}
.dpad button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dpad button:active{background:var(--accent2)}
.dpad .empty{visibility:hidden}
.game-controls{text-align:center;margin:8px 0}

/* 活动弹窗 */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;color:var(--accent);margin-bottom:6px}
.modal .loc-desc{font-size:13px;color:var(--muted);margin-bottom:12px}
.act-list{list-style:none}
.act-item{display:block;width:100%;text-align:left;padding:10px;margin-bottom:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;cursor:pointer}
.act-item:hover{border-color:var(--accent)}
.act-item .effects{font-size:11px;color:var(--muted);margin-top:2px}
.act-type{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:4px}
.act-type.work{background:#3d1a1a;color:var(--red)}
.act-type.rest{background:#1a3d2a;color:var(--green)}
.act-type.eat{background:#3d3a1a;color:var(--yellow)}
.act-type.procrastinate{background:#2a1a3d;color:#a78bfa}
.act-type.mixed{background:#1a2a3d;color:var(--blue)}
.act-type.social{background:#3d2a1a;color:#fb923c}
.act-type.exercise{background:#1a3d3a;color:var(--blue)}
.act-type.professional{background:#3d1a2a;color:#f472b6}

/* 结局 */
.outcome{text-align:center;padding:20px}
.outcome .stamp{display:inline-block;padding:4px 16px;border:2px solid var(--accent);border-radius:4px;color:var(--accent);font-size:14px;font-weight:700;margin-bottom:12px}
.outcome-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.outcome-stat{background:var(--bg);border-radius:8px;padding:10px;text-align:center}
.outcome-stat .num{font-size:20px;font-weight:700;color:var(--accent)}
.outcome-stat .lbl{font-size:11px;color:var(--muted)}

/* 诊断量表 */
.scale-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.scale-card .q{font-size:14px;margin-bottom:8px}
.scale-card .opts{display:flex;flex-wrap:wrap;gap:4px}
.scale-card .opt-btn{flex:1;min-width:60px;text-align:center;padding:6px 4px;font-size:11px}
.scale-progress{font-size:12px;color:var(--muted);text-align:center;margin:8px 0}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:.3s}

/* 类型卡片 */
.types-grid{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 0}
.type-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px}
.type-card .name{font-size:16px;color:var(--accent);font-weight:700}
.type-card .sub{font-size:12px;color:var(--muted);margin-bottom:6px}
.type-card .signs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.type-card .signs span{font-size:11px;padding:2px 8px;background:var(--bg);border-radius:4px;color:var(--yellow)}

/* 治疗方法卡 */
.method-grid{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 0}
.method-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px}
.method-card .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.method-card .abbr{font-size:12px;padding:2px 8px;background:var(--accent2);border-radius:4px;color:#fff}
.method-card .name{font-size:15px;font-weight:600}
.method-card .principle{font-size:13px;color:var(--muted);margin-bottom:8px}
.method-card .steps{margin:8px 0;padding-left:20px;font-size:13px}
.method-card .steps li{margin-bottom:2px}
.method-card .evidence{font-size:12px;color:var(--green);margin-top:8px}
.method-card .source{font-size:11px;color:var(--muted);margin-top:4px}

/* 追踪 */
.track-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.track-day{text-align:center}
.track-day .d{font-size:11px;color:var(--muted)}
.track-day .cb{width:24px;height:24px;cursor:pointer}
.plan-list{margin:12px 0}
.plan-item{background:var(--bg);border-radius:6px;padding:10px;margin-bottom:6px;font-size:13px}
.plan-item .iff{color:var(--yellow)}
.plan-item .then{color:var(--green)}
textarea.char-input{min-height:60px;resize:vertical}

@media(max-width:480px){
  .task-grid,.scene-grid{grid-template-columns:1fr}
  .hud{grid-template-columns:repeat(5,1fr)}
  .outcome-stats{grid-template-columns:repeat(2,1fr)}
  .track-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>拖延症模拟器</h1>
    <p>从7天模拟到循证干预</p>
  </div>

  <nav class="nav" id="nav">
    <a data-route="intro">序章</a>
    <a data-route="simulator">7天模拟</a>
    <a data-route="diagnosis">自我诊断</a>
    <a data-route="comorbidity">共病筛查</a>
    <a data-route="treatment">干预方案</a>
    <a data-route="professional">专业评估</a>
    <a data-route="references">溯源</a>
  </nav>

  <div id="app"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal-overlay"></div>

<script>
'use strict';

// ========== 工具 ==========
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){
  var d = document.createElement(tag);
  if(cls) d.className = cls;
  if(html !== undefined) d.innerHTML = html;
  return d;
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

// ========== 数据持久化 ==========
var STORE_KEY = 'proc_sim_v2';
function saveState(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadState(){
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  } catch(e) {}
  return { simulator:null, diagnosis:null, comorbidity:null, treatment:null,
    tracking:{ days:[] }, plans:[] };
}
function clearAll(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
var state = loadState();

// ========== 路由 ==========
var currentRoute = '';
function navigate(route){
  currentRoute = route;
  // 高亮导航
  var links = document.querySelectorAll('.nav a');
  for(var i=0; i<links.length; i++){
    if(links[i].getAttribute('data-route') === route) links[i].classList.add('active');
    else links[i].classList.remove('active');
  }
  // 渲染对应视图
  var app = $('app');
  app.innerHTML = '';
  switch(route){
    case 'intro': renderIntro(app); break;
    case 'simulator': renderSimulator(app); break;
    case 'diagnosis': renderDiagnosis(app); break;
    case 'comorbidity': renderComorbidity(app); break;
    case 'treatment': renderTreatment(app); break;
    case 'professional': renderProfessional(app); break;
    case 'references': renderReferences(app); break;
    default: renderIntro(app);
  }
  window.scrollTo(0, 0);
}

// 绑定导航
window.addEventListener('DOMContentLoaded', function(){
  var links = document.querySelectorAll('.nav a');
  for(var i=0; i<links.length; i++){
    (function(link){
      link.addEventListener('click', function(e){
        e.preventDefault();
        navigate(link.getAttribute('data-route'));
      });
    })(links[i]);
  }
  // 启动
  navigate('intro');
});

// ========== 序章 ==========
function renderIntro(app){
  var card = el('div', 'card',
    '<h2>这不是又一个列待办清单的工具</h2>' +
    '<p class="lede">我们先用7天的微型人生模拟，让你安全地体会如果按现在的拖延方式继续下去会发生什么；然后用心理学界用了40年的权威量表，告诉你你究竟属于哪种拖延；最后给出Pychyl、Steel、Sirois、Rozental等学者验证过的循证干预路径。</p>' +
    '<p style="margin:16px 0"><b>拖延不是懒，也不是时间管理失败。</b>它是一次情绪调节的失败——我们用回避任务的方式，暂时让自己感觉好一点，却把代价推给了未来的自己。</p>'
  );
  var consent = el('div', 'card',
    '<h3>知情同意</h3>' +
    '<p style="font-size:13px;color:var(--muted)">本工具基于公开的心理学量表和研究文献，不构成医疗诊断。如果你正在经历严重的情绪困扰，请联系当地心理援助热线。</p>' +
    '<label style="display:block;margin:12px 0;font-size:13px;cursor:pointer">' +
    '<input type="checkbox" id="consent" style="margin-right:8px"/>我已阅读并理解上述说明' +
    '</label>'
  );
  var btn = el('a', 'btn primary lg', '开始7天模拟 →');
  btn.style.opacity = '.4';
  btn.style.pointerEvents = 'none';
  btn.addEventListener('click', function(){ navigate('simulator'); });
  var wrap = el('div', '', '');
  wrap.appendChild(btn);
  consent.appendChild(wrap);
  app.appendChild(card);
  app.appendChild(consent);

  $('consent').addEventListener('change', function(){
    if(this.checked){
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
      toast('已同意，可以开始了');
    } else {
      btn.style.opacity = '.4';
      btn.style.pointerEvents = 'none';
    }
  });
}

function drawCharPreview(){
  var canvas = $('char-canvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,48,48);
  ctx.save();
  ctx.translate(12, 6);
  ctx.scale(2, 2);
  drawPixelChar(ctx, charSettings, 0, 0, 'front', 0);
  ctx.restore();
}

// 像素角色绘制
function drawPixelChar(ctx, char, x, y, facing, walkFrame){
  var skin = char.skin;
  var hair = char.hairColor;
  var outfit = OUTFIT_COLORS[char.outfit] || OUTFIT_COLORS.casual;
  var topC = outfit.top;
  var botC = outfit.bottom;
  var eyeC = '#2B2118';

  ctx.save();
  ctx.translate(x, y);

  var bodyW = char.body === 'slim' ? 8 : char.body === 'plus' ? 12 : 10;
  var bodyH = char.body === 'slim' ? 14 : char.body === 'plus' ? 12 : 13;
  var headW = char.gender === 'male' ? 9 : 8;
  var headH = char.gender === 'male' ? 10 : 9;
  var headX = Math.floor((12 - headW) / 2);
  var headY = 0;

  // 头发
  ctx.fillStyle = hair;
  if(char.hairStyle === 'long'){
    ctx.fillRect(headX-1, headY+1, headW+2, 5);
    ctx.fillRect(headX-1, headY+4, 2, 8);
    ctx.fillRect(headX+headW-1, headY+4, 2, 8);
  } else if(char.hairStyle === 'short'){
    ctx.fillRect(headX, headY, headW, 4);
    ctx.fillRect(headX-1, headY+1, 1, 3);
    ctx.fillRect(headX+headW, headY+1, 1, 3);
  } else if(char.hairStyle === 'ponytail'){
    ctx.fillRect(headX, headY, headW, 4);
    ctx.fillRect(headX+headW, headY+2, 2, 4);
  } else if(char.hairStyle === 'buzz'){
    ctx.fillRect(headX, headY+1, headW, 2);
  } else if(char.hairStyle === 'curly'){
    ctx.fillRect(headX-1, headY, headW+2, 5);
    ctx.fillRect(headX-1, headY+4, 2, 4);
    ctx.fillRect(headX+headW-1, headY+4, 2, 4);
  }

  // 脸
  ctx.fillStyle = skin;
  ctx.fillRect(headX, headY+2, headW, headH-2);

  // 眼睛
  ctx.fillStyle = eyeC;
  if(facing === 'front'){
    ctx.fillRect(headX+2, headY+5, 1, 1);
    ctx.fillRect(headX+headW-3, headY+5, 1, 1);
    ctx.fillStyle = '#A23B2B';
    ctx.fillRect(headX+Math.floor(headW/2)-1, headY+7, 2, 1);
  } else if(facing === 'left'){
    ctx.fillRect(headX+2, headY+5, 1, 1);
  } else if(facing === 'right'){
    ctx.fillRect(headX+headW-3, headY+5, 1, 1);
  }

  // 身体
  var bodyY = headY + headH + 1;
  var bodyX = Math.floor((12 - bodyW) / 2);
  ctx.fillStyle = topC;
  ctx.fillRect(bodyX, bodyY, bodyW, bodyH);
  // 领口
  ctx.fillStyle = char.gender === 'male' ? '#1A252F' : '#D4A574';
  ctx.fillRect(bodyX + Math.floor(bodyW/2)-1, bodyY, 2, 2);

  // 手臂
  var armSwing = walkFrame % 2 === 0 ? 1 : -1;
  ctx.fillStyle = topC;
  ctx.fillRect(bodyX-2, bodyY+1+armSwing, 2, bodyH-3);
  ctx.fillRect(bodyX+bodyW, bodyY+1-armSwing, 2, bodyH-3);
  // 手
  ctx.fillStyle = skin;
  ctx.fillRect(bodyX-2, bodyY+bodyH-3+armSwing, 2, 2);
  ctx.fillRect(bodyX+bodyW, bodyY+bodyH-3-armSwing, 2, 2);

  // 腿
  var legY = bodyY + bodyH;
  ctx.fillStyle = botC;
  ctx.fillRect(bodyX+1, legY, Math.floor(bodyW/2)-1, 7);
  ctx.fillRect(bodyX+Math.ceil(bodyW/2), legY, Math.floor(bodyW/2)-1, 7);

  // 鞋
  var legSwing = walkFrame % 2 === 0 ? 1 : -1;
  ctx.fillStyle = '#2B2118';
  ctx.fillRect(bodyX, legY+7-legSwing, Math.floor(bodyW/2), 2);
  ctx.fillRect(bodyX+Math.ceil(bodyW/2)-1, legY+7+legSwing, Math.floor(bodyW/2), 2);

  ctx.restore();
}

// 像素场景绘制
function drawScene(ctx, scene, char, px, py, facing, walkFrame, period){
  var W = 240, H = 150;

  // 天空
  var sky1, sky2, g1, g2;
  if(period === 0){ sky1='#FFE4B5'; sky2='#87CEEB'; g1='#8BC34A'; g2='#689F38'; }
  else if(period === 1){ sky1='#87CEEB'; sky2='#B0E0E6'; g1='#7CB342'; g2='#558B2F'; }
  else { sky1='#4A3B6B'; sky2='#2C3E50'; g1='#33691E'; g2='#1B5E20'; }

  var sg = ctx.createLinearGradient(0,0,0,95);
  sg.addColorStop(0, sky1); sg.addColorStop(1, sky2);
  ctx.fillStyle = sg; ctx.fillRect(0,0,W,95);

  // 太阳/月亮
  if(period < 2){
    ctx.fillStyle = period === 0 ? '#FFD700' : '#FFEB3B';
    ctx.beginPath(); ctx.arc(210, 26, 8, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#ECF0F1';
    ctx.beginPath(); ctx.arc(210, 26, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    var stars = [[20,12],[45,8],[70,15],[100,7],[130,20],[55,25],[90,28],[30,22],[160,10],[185,18]];
    for(var i=0;i<stars.length;i++) ctx.fillRect(stars[i][0], stars[i][1], 1, 1);
  }

  // 云
  ctx.fillStyle = period === 2 ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.85)';
  var clouds = [[20,22],[75,14],[140,24],[195,16]];
  for(var i=0;i<clouds.length;i++){
    var cx = clouds[i][0], cy = clouds[i][1];
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+4, cy-2, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+8, cy, 5, 0, Math.PI*2); ctx.fill();
  }

  // 远山
  ctx.fillStyle = period === 2 ? '#2C3E50' : 'rgba(100,130,160,0.4)';
  ctx.beginPath();
  ctx.moveTo(0,95); ctx.lineTo(40,65); ctx.lineTo(80,80); ctx.lineTo(120,60);
  ctx.lineTo(160,75); ctx.lineTo(200,62); ctx.lineTo(240,78);
  ctx.lineTo(240,95); ctx.lineTo(0,95); ctx.fill();

  // 地面
  var gg = ctx.createLinearGradient(0,95,0,H);
  gg.addColorStop(0, g1); gg.addColorStop(1, g2);
  ctx.fillStyle = gg; ctx.fillRect(0,95,W,H-95);

  // 路径
  ctx.fillStyle = '#D7CCC8'; ctx.fillRect(0,95,W,10);
  ctx.fillStyle = '#BCAAA4';
  for(var i=0;i<W;i+=8) ctx.fillRect(i,98,4,2);

  // 建筑
  for(var i=0;i<scene.locations.length;i++){
    drawBuilding(ctx, scene.locations[i], period);
  }

  // 树
  drawTree(ctx, 50, 88);
  drawTree(ctx, 100, 86);
  drawTree(ctx, 150, 88);
  drawTree(ctx, 220, 86);

  // 路灯
  drawLamp(ctx, 30, 95, period);
  drawLamp(ctx, 130, 95, period);
  drawLamp(ctx, 200, 95, period);

  // 长椅
  drawBench(ctx, 70, 130);
  drawBench(ctx, 180, 132);

  // 角色
  drawPixelChar(ctx, char, px, py, facing, walkFrame);

  // 夜间叠加
  if(period === 2){
    ctx.fillStyle = 'rgba(0,0,30,0.3)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(255,224,130,0.12)';
    ctx.beginPath(); ctx.arc(30,85,14,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(130,85,14,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(200,85,14,0,Math.PI*2); ctx.fill();
  }
}

function drawBuilding(ctx, loc, period){
  var x=loc.x, y=loc.y, w=loc.w, h=loc.h;
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(x+2, y+h, w, 3);
  // 主体
  ctx.fillStyle = loc.color; ctx.fillRect(x, y, w, h);
  // 屋顶
  ctx.fillStyle = loc.roof;
  ctx.fillRect(x-1, y-4, w+2, 5);
  ctx.fillRect(x-2, y, 1, 2);
  ctx.fillRect(x+w+1, y, 1, 2);
  // 窗户
  ctx.fillStyle = period === 2 ? '#FFE082' : '#81D4FA';
  var cols = Math.floor((w-4)/5);
  var rows = Math.floor((h-8)/6);
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      ctx.fillRect(x+2+c*5, y+4+r*6, 3, 4);
    }
  }
  // 门
  ctx.fillStyle = loc.roof;
  ctx.fillRect(x+Math.floor(w/2)-2, y+h-6, 4, 6);
  // 标签
  ctx.font = '6px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = period === 2 ? 'rgba(255,255,255,0.8)' : 'rgba(43,33,24,0.7)';
  ctx.fillText(loc.name, x+w/2, y-6);
}

function drawTree(ctx, x, y){
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.beginPath(); ctx.arc(x, y+7, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#8D6E63'; ctx.fillRect(x-1, y, 2, 6);
  ctx.fillStyle = '#2E7D32'; ctx.beginPath(); ctx.arc(x, y-2, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#43A047';
  ctx.beginPath(); ctx.arc(x-2, y, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+2, y, 3, 0, Math.PI*2); ctx.fill();
}

function drawLamp(ctx, x, y, period){
  ctx.fillStyle = '#546E7A'; ctx.fillRect(x, y-10, 1, 10);
  ctx.fillStyle = period === 2 ? '#FFE082' : '#E0E0E0';
  ctx.fillRect(x-1, y-12, 3, 2);
}

function drawBench(ctx, x, y){
  ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(x, y+3, 8, 1);
  ctx.fillStyle = '#8D6E63'; ctx.fillRect(x, y, 8, 1);
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(x+1, y+1, 1, 3);
  ctx.fillRect(x+6, y+1, 1, 3);
}

var gameCtx = null;
function startGameLoop(){
  if(gameLoopId) return;
  var canvas = $('game-canvas');
  if(!canvas) return;
  gameCtx = canvas.getContext('2d');
  gameCtx.imageSmoothingEnabled = false;

  function loop(){
    if(!sim || !gameCtx) return;
    updatePlayer();
    render();
    gameLoopId = requestAnimationFrame(loop);
  }
  gameLoopId = requestAnimationFrame(loop);
}

function stopGameLoop(){
  if(gameLoopId){ cancelAnimationFrame(gameLoopId); gameLoopId = null; }
  window.removeEventListener('keydown', onKeyDown);
  window.removeEventListener('keyup', onKeyUp);
}

function onKeyDown(e){
  var k = e.key.toLowerCase();
  if(k === 'arrowup' || k === 'w') keys.up = true;
  else if(k === 'arrowdown' || k === 's') keys.down = true;
  else if(k === 'arrowleft' || k === 'a') keys.left = true;
  else if(k === 'arrowright' || k === 'd') keys.right = true;
  else if(k === ' ') { e.preventDefault(); tryInteract(); }
}
function onKeyUp(e){
  var k = e.key.toLowerCase();
  if(k === 'arrowup' || k === 'w') keys.up = false;
  else if(k === 'arrowdown' || k === 's') keys.down = false;
  else if(k === 'arrowleft' || k === 'a') keys.left = false;
  else if(k === 'arrowright' || k === 'd') keys.right = false;
}

function updatePlayer(){
  var p = sim.player;
  var dx = 0, dy = 0;
  if(keys.up) { dy -= 1; p.facing = 'back'; }
  if(keys.down) { dy += 1; p.facing = 'front'; }
  if(keys.left) { dx -= 1; p.facing = 'left'; }
  if(keys.right) { dx += 1; p.facing = 'right'; }

  var speed = 1.5;
  var newX = Math.max(2, Math.min(226, p.x + dx * speed));
  var newY = Math.max(40, Math.min(132, p.y + dy * speed));
  p.x = newX; p.y = newY;

  if(dx !== 0 || dy !== 0){
    p.walkTimer++;
    if(p.walkTimer > 8){ p.walkFrame = (p.walkFrame + 1) % 4; p.walkTimer = 0; }
  } else {
    p.walkFrame = 0;
  }

  // 检测附近地点
  var scene = SCENES[sim.scene];
  var near = null;
  for(var i=0;i<scene.locations.length;i++){
    var loc = scene.locations[i];
    var cx = loc.x + loc.w/2;
    var cy = loc.y + loc.h/2;
    var dist = Math.hypot(p.x+6 - cx, p.y+9 - cy);
    if(dist < 24){ near = loc; break; }
  }
  sim.currentLocation = near;
}

function render(){
  if(!sim || !gameCtx) return;
  var scene = SCENES[sim.scene];
  gameCtx.clearRect(0,0,240,150);
  drawScene(gameCtx, scene, sim.char, sim.player.x, sim.player.y, sim.player.facing, sim.player.walkFrame, sim.period);

  // 提示
  if(sim.currentLocation){
    gameCtx.fillStyle = 'rgba(0,0,0,0.7)';
    gameCtx.fillRect(60, 5, 120, 14);
    gameCtx.fillStyle = '#fff';
    gameCtx.font = '7px Microsoft YaHei, sans-serif';
    gameCtx.textAlign = 'center';
    gameCtx.fillText('按空格进入 ' + sim.currentLocation.name, 120, 14);
  }
}

function tryInteract(){
  if(!sim || !sim.currentLocation) { toast('附近没有地点，走过去看看'); return; }
  showActivityModal(sim.currentLocation);
}

function showActivityModal(loc){
  var overlay = $('modal-overlay');
  var html = '<div class="modal">';
  html += '<h3>' + loc.name + '</h3>';
  html += '<div class="loc-desc">' + loc.desc + '</div>';
  html += '<div class="act-list">';
  for(var i=0;i<loc.acts.length;i++){
    var a = loc.acts[i];
    var effStr = '';
    var e = a.e;
    if(e.energy) effStr += (e.energy>0?'+':'') + e.energy + '精力 ';
    if(e.stress) effStr += (e.stress>0?'+':'') + e.stress + '压力 ';
    if(e.mood) effStr += (e.mood>0?'+':'') + e.mood + '心情 ';
    if(e.hunger) effStr += (e.hunger>0?'+':'') + e.hunger + '饱腹 ';
    if(e.progress) effStr += '+' + e.progress + '进度 ';
    html += '<button class="act-item" data-idx="'+i+'">' + a.n;
    html += '<span class="act-type ' + a.t + '">' + a.t + '</span>';
    html += '<div class="effects">' + effStr + '</div>';
    html += '</button>';
  }
  html += '</div>';
  html += '<button class="btn ghost sm" id="close-modal" style="margin-top:8px">取消</button>';
  html += '</div>';
  overlay.innerHTML = html;
  overlay.classList.add('show');

  $('close-modal').addEventListener('click', function(){
    overlay.classList.remove('show');
  });

  var actBtns = overlay.querySelectorAll('.act-item');
  for(var i=0;i<actBtns.length;i++){
    actBtns[i].addEventListener('click', function(){
      var idx = parseInt(this.getAttribute('data-idx'));
      performActivity(loc, loc.acts[idx]);
      overlay.classList.remove('show');
    });
  }
}

function performActivity(loc, act){
  var s = sim.stats;
  var e = act.e;
  if(e.energy) s.energy = Math.max(0, Math.min(100, s.energy + e.energy));
  if(e.stress) s.stress = Math.max(0, Math.min(100, s.stress + e.stress));
  if(e.mood) s.mood = Math.max(0, Math.min(100, s.mood + e.mood));
  if(e.hunger) s.hunger = Math.max(0, Math.min(100, s.hunger + e.hunger));
  if(e.progress) s.progress = Math.max(0, Math.min(100, s.progress + e.progress));

  sim.totalSessions++;
  if(act.t === 'procrastinate') sim.procrastinateSessions++;
  if(act.t === 'work') sim.workSessions++;

  sim.activityLog.push({ day: sim.day, period: sim.period, loc: loc.name, act: act.n, type: act.t });

  toast(act.n + ' 完成！');
  updateHUD();

  // 如果是工作类活动，检查任务是否完成
  if(s.progress >= 100){
    toast('任务完成度已达100%！');
  }
}

function updateHUD(){
  if(!sim) return;
  var stats = sim.stats;
  var keys = ['stress','energy','mood','hunger','progress'];
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    var bar = $('bar-' + k);
    if(bar) bar.style.width = Math.min(100, Math.round(stats[k])) + '%';
    var val = $(k);
    // 更新数值
    var hudItems = document.querySelectorAll('.hud-item');
    if(hudItems[i]) {
      var valEl = hudItems[i].querySelector('.val');
      if(valEl) valEl.textContent = Math.round(stats[k]);
    }
  }
}

function nextPeriod(){
  if(!sim) return;
  sim.period++;
  if(sim.period >= 3){
    sim.period = 0;
    sim.day++;
    if(sim.day > 7){
      endGame();
      return;
    }
  }
  // 饥饿和精力随时间消耗
  sim.stats.hunger = Math.max(0, sim.stats.hunger - 8);
  sim.stats.energy = Math.max(0, sim.stats.energy - 5);
  if(sim.stats.hunger < 20) sim.stats.mood = Math.max(0, sim.stats.mood - 5);
  if(sim.stats.energy < 20) sim.stats.stress = Math.min(100, sim.stats.stress + 5);

  saveState();
  stopGameLoop();
  renderGameScreen($('app'));

  var periods = ['上午','下午','晚上'];
  toast('Day ' + sim.day + '/7 · ' + periods[sim.period]);
}

function endGame(){
  stopGameLoop();
  sim.outcome = true;
  saveState();
  renderOutcome($('app'));
}

  app.innerHTML = html;
  renderQuestion();
}

function renderQuestion(){
  var area = $('diag-area');
  if(!area) return;
  var q, opts, progress;
  if(currentScale === 'tps'){
    q = TPS_QUESTIONS[diagIdx];
    opts = TPS_OPTS;
    progress = Math.round(((diagIdx) / (TPS_QUESTIONS.length + PASS_QUESTIONS.length)) * 100);
  } else {
    q = PASS_QUESTIONS[diagIdx].q;
    opts = TPS_OPTS;
    progress = Math.round(((TPS_QUESTIONS.length + diagIdx) / (TPS_QUESTIONS.length + PASS_QUESTIONS.length)) * 100);
  }

  var html = '<div class="scale-progress">进度：' + progress + '%</div>';
  html += '<div class="bar"><div class="bar-fill" style="width:' + progress + '%"></div></div>';
  html += '<div class="scale-card">';
  html += '<div class="q">' + (currentScale === 'tps' ? (diagIdx+1) : (TPS_QUESTIONS.length + diagIdx + 1)) + '. ' + q + '</div>';
  html += '<div class="opts">';
  for(var i=0;i<opts.length;i++){
    html += '<button class="opt-btn" data-val="' + i + '">' + opts[i] + '</button>';
  }
  html += '</div></div>';
  area.innerHTML = html;

  var btns = area.querySelectorAll('.opt-btn');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(){
      var val = parseInt(this.getAttribute('data-val'));
      if(currentScale === 'tps'){
        diagAnswers.push(val);
      } else {
        passAnswers.push(val);
      }
      diagIdx++;
      nextQuestion();
    });
  }
}

function nextQuestion(){
  if(currentScale === 'tps' && diagIdx >= TPS_QUESTIONS.length){
    currentScale = 'pass';
    diagIdx = 0;
  }
  if(currentScale === 'pass' && diagIdx >= PASS_QUESTIONS.length){
    finishDiagnosis();
    return;
  }
  renderQuestion();
}

function finishDiagnosis(){
  // TPS 总分
  var tpsScore = 0;
  for(var i=0;i<diagAnswers.length;i++) tpsScore += diagAnswers[i];
  var tpsMax = TPS_QUESTIONS.length * 3;
  var tpsPct = Math.round((tpsScore / tpsMax) * 100);

  // PASS 维度
  var dimScores = {decisional:0, arousal:0};
  for(var i=0;i<passAnswers.length;i++){
    var dim = PASS_QUESTIONS[i].dim;
    dimScores[dim] += passAnswers[i];
  }

  // 推断类型
  var guessedType = 'emotion_regulation';
  if(dimScores.decisional > dimScores.arousal) guessedType = 'decision_difficulty';
  else if(tpsPct >= 70) guessedType = 'task_avoidant';
  else if(tpsPct >= 50) guessedType = 'impulsive';

  var severity = 'mild';
  if(tpsPct >= 70) severity = 'severe';
  else if(tpsPct >= 45) severity = 'moderate';

  state.diagnosis = {
    completed: true,
    tpsScore: tpsScore, tpsMax: tpsMax, tpsPct: tpsPct,
    passDim: dimScores,
    type: guessedType, severity: severity
  };
  saveState();
  renderDiagResult($('app'));
}

function renderDiagResult(app){

// ========== 共病筛查 ==========
var ASRS = ['你经常难以集中注意力完成工作？','你经常忘记约定或截止日期？','你经常感到坐立不安？','你经常在需要安静时无法安静？','你经常打断别人或抢话？'];
var PHQ9 = ['你对做事没有兴趣或乐趣？','你感到情绪低落或沮丧？','你入睡困难或睡太多？','你感到疲倦或没有精力？','你觉得自己很糟糕或是个失败者？'];
var GAD7 = ['你感到紧张焦虑或烦躁？','你无法停止或控制担忧？','你过度担忧各种事情？','你难以放松？','你感到坐立不安？','你变得容易烦躁？','你感到害怕好像可怕的事要发生？'];
var COMORB_OPTS = ['完全没有','好几天','一半以上时间','几乎每天']; // 0-3

var comorbIdx = 0;
var comorbAnswers = {};
var comorbScale = 'asrs';

function renderComorbidity(app){
  if(state.comorbidity && state.comorbidity.completed){
    renderComorbResult(app);
    return;
  }
  comorbIdx = 0; comorbAnswers = {}; comorbScale = 'asrs';

  var html = '<div class="card">';
  html += '<h2>共病筛查</h2>';
  html += '<p class="lede">拖延常与ADHD、抑郁、焦虑共病。以下3个简短量表帮你判断是否需要专业评估。</p>';
  html += '<div id="comorb-area"></div>';
  html += '</div>';
  app.innerHTML = html;
  renderComorbQuestion();
}

function renderComorbQuestion(){
  var area = $('comorb-area');
  if(!area) return;
  var q, scales = {asrs:ASRS, phq9:PHQ9, gad7:GAD7};
  var scaleNames = {asrs:'ADHD筛查(ASRS-5)', phq9:'抑郁筛查(PHQ-9简版)', gad7:'焦虑筛查(GAD-7)'};
  var arr = scales[comorbScale];
  if(comorbIdx >= arr.length){
    comorbScale = comorbScale === 'asrs' ? 'phq9' : comorbScale === 'phq9' ? 'gad7' : null;
    if(!comorbScale){ finishComorbidity(); return; }
    comorbIdx = 0;
    arr = scales[comorbScale];
  }
  q = arr[comorbIdx];
  var total = ASRS.length + PHQ9.length + GAD7.length;
  var done = (comorbScale === 'phq9' ? ASRS.length : comorbScale === 'gad7' ? ASRS.length + PHQ9.length : 0) + comorbIdx;
  var progress = Math.round((done / total) * 100);

  var html = '<div class="scale-progress">' + scaleNames[comorbScale] + ' · ' + progress + '%</div>';
  html += '<div class="bar"><div class="bar-fill" style="width:' + progress + '%"></div></div>';
  html += '<div class="scale-card">';
  html += '<div class="q">' + (done+1) + '. ' + q + '</div>';
  html += '<div class="opts">';
  for(var i=0;i<COMORB_OPTS.length;i++){
    html += '<button class="opt-btn" data-val="' + i + '">' + COMORB_OPTS[i] + '</button>';
  }
  html += '</div></div>';
  area.innerHTML = html;

  var btns = area.querySelectorAll('.opt-btn');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(){
      var val = parseInt(this.getAttribute('data-val'));
      if(!comorbAnswers[comorbScale]) comorbAnswers[comorbScale] = [];
      comorbAnswers[comorbScale].push(val);
      comorbIdx++;
      renderComorbQuestion();
    });
  }
}

function finishComorbidity(){
  var result = { completed:true };
  // ASRS: >=10 提示可能ADHD
  var asrsScore = 0;
  for(var i=0;i<(comorbAnswers.asrs||[]).length;i++) asrsScore += comorbAnswers.asrs[i];
  result.asrs = asrsScore;
  result.asrsFlag = asrsScore >= 10;

  // PHQ9: 5-9轻度 10-14中度 15+中重度
  var phqScore = 0;
  for(var i=0;i<(comorbAnswers.phq9||[]).length;i++) phqScore += comorbAnswers.phq9[i];
  result.phq9 = phqScore;
  result.phqLevel = phqScore < 5 ? 'none' : phqScore < 10 ? 'mild' : phqScore < 15 ? 'moderate' : 'severe';

  // GAD7: 5-9轻度 10-14中度 15+重度
  var gadScore = 0;
  for(var i=0;i<(comorbAnswers.gad7||[]).length;i++) gadScore += comorbAnswers.gad7[i];
  result.gad7 = gadScore;
  result.gadLevel = gadScore < 5 ? 'none' : gadScore < 10 ? 'mild' : gadScore < 15 ? 'moderate' : 'severe';

  state.comorbidity = result;
  saveState();
  renderComorbResult($('app'));
}

function renderComorbResult(app){
  var c = state.comorbidity;
  var html = '<div class="card"><h2>共病筛查结果</h2>';

  // ASRS
  html += '<div class="scale-card">';
  html += '<div class="q">ADHD筛查 (ASRS-5) 得分：' + c.asrs + '/15</div>';
  html += '<div class="bar"><div class="bar-fill" style="width:' + Math.round(c.asrs/15*100) + '%;background:' + (c.asrsFlag ? 'var(--red)' : 'var(--green)') + '"></div></div>';
  html += '<p class="muted">' + (c.asrsFlag ? '得分>=10，建议进一步专业评估是否共病ADHD' : '得分正常范围') + '</p>';
  html += '</div>';

  // PHQ9
  var phqText = c.phqLevel === 'none' ? '无明显抑郁症状' : c.phqLevel === 'mild' ? '轻度抑郁症状' : c.phqLevel === 'moderate' ? '中度抑郁症状' : '中重度抑郁症状';
  html += '<div class="scale-card">';
  html += '<div class="q">抑郁筛查 (PHQ-9简版) 得分：' + c.phq9 + '/15</div>';
  html += '<div class="bar"><div class="bar-fill" style="width:' + Math.round(c.phq9/15*100) + '%;background:' + (c.phqLevel === 'severe' || c.phqLevel === 'moderate' ? 'var(--red)' : c.phqLevel === 'mild' ? 'var(--yellow)' : 'var(--green)') + '"></div></div>';
  html += '<p class="muted">' + phqText + '</p>';
  html += '</div>';

  // GAD7
  var gadText = c.gadLevel === 'none' ? '无明显焦虑症状' : c.gadLevel === 'mild' ? '轻度焦虑症状' : c.gadLevel === 'moderate' ? '中度焦虑症状' : '重度焦虑症状';
  html += '<div class="scale-card">';
  html += '<div class="q">焦虑筛查 (GAD-7) 得分：' + c.gad7 + '/21</div>';
  html += '<div class="bar"><div class="bar-fill" style="width:' + Math.round(c.gad7/21*100) + '%;background:' + (c.gadLevel === 'severe' || c.gadLevel === 'moderate' ? 'var(--red)' : c.gadLevel === 'mild' ? 'var(--yellow)' : 'var(--green)') + '"></div></div>';
  html += '<p class="muted">' + gadText + '</p>';
  html += '</div>';

  html += '</div>';

  html += '<div style="text-align:center;margin:16px 0">';
  html += '<button class="btn primary" id="go-treat">继续：获取干预方案 →</button>';
  html += '<br/><button class="btn ghost sm" id="redo-comorb" style="margin-top:8px">重新筛查</button>';
  html += '</div>';

  app.innerHTML = html;

  $('go-treat').addEventListener('click', function(){ navigate('treatment'); });
  $('redo-comorb').addEventListener('click', function(){
    state.comorbidity = null; saveState(); navigate('comorbidity');
  });
}

function addPlan(){
  var ifEl = $('if-input');
  var thenEl = $('then-input');
  if(!ifEl.value.trim() || !thenEl.value.trim()){ toast('请填写IF和THEN'); return; }
  state.plans = state.plans || [];
  state.plans.push({ iff: ifEl.value.trim(), then: thenEl.value.trim() });
  saveState();
  ifEl.value = ''; thenEl.value = '';
  renderPlans(); toast('已加入计划');
}

function renderPlans(){
  var list = $('plan-list');
  if(!list) return;
  if(!state.plans || state.plans.length === 0){
    list.innerHTML = '<p class="muted">还没有计划</p>';
    return;
  }
  var html = '';
  for(var i=0;i<state.plans.length;i++){
    var p = state.plans[i];
    html += '<div class="plan-item">';
    html += '<span class="iff">IF ' + p.iff + '</span><br/>';
    html += '<span class="then">THEN ' + p.then + '</span>';
    html += ' <button class="btn ghost sm" data-del="'+i+'" style="float:right">删除</button>';
    html += '</div>';
  }
  list.innerHTML = html;
  var dels = list.querySelectorAll('[data-del]');
  for(var i=0;i<dels.length;i++){
    dels[i].addEventListener('click', function(){
      var idx = parseInt(this.getAttribute('data-del'));
      state.plans.splice(idx, 1);
      saveState();
      renderPlans();
    });
  }
}

    if(c.asrsFlag) html += '<p style="color:var(--red)">你的ASRS得分较高，建议到精神科评估是否共病ADHD</p>';
    if(c.phqLevel === 'moderate' || c.phqLevel === 'severe') html += '<p style="color:var(--red)">你的PHQ-9得分提示中度以上抑郁症状，建议就医</p>';
    if(c.gadLevel === 'moderate' || c.gadLevel === 'severe') html += '<p style="color:var(--red)">你的GAD-7得分提示中度以上焦虑症状，建议就医</p>';
    if(!c.asrsFlag && c.phqLevel !== 'moderate' && c.phqLevel !== 'severe' && c.gadLevel !== 'moderate' && c.gadLevel !== 'severe'){
      html += '<p style="color:var(--green)">你的共病筛查结果在正常范围，可以先尝试上面的干预方案</p>';
    }
    html += '</div>';
  }

  html += '<div style="text-align:center;margin:16px 0">';
  html += '<button class="btn primary" id="go-ref">查看参考文献 →</button>';
  html += '</div>';

  app.innerHTML = html;
  $('go-ref').addEventListener('click', function(){ navigate('references'); });
}
