<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掌师 - 工业运维 AI 随行助手</title>
<style>
/* ===== 全局重置与设计令牌 ===== */
:root{
  --bg:#0B1121; --bg2:#121D2E; --bg3:#18273A; --rule:#263548;
  --ink:#E2E8F0; --muted:#8899B0; --weak:#5A6B82;
  --blue:#3B82F6; --blue-d:#2563EB; --purple:#8B5CF6; --pink:#EC4899;
  --green:#22C55E; --warn:#F59E0B; --red:#EF4444;
  --radius:8px; --r-card:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--ink);background:#000;overflow:hidden}
/* body 弹性布局，让手机外壳水平垂直双居中 */
body{display:flex;align-items:center;justify-content:center}

/* ===== 手机外壳（Apple iOS 风格外壳 + 上下留白） ===== */
/* 用固定 px 尺寸，浏览器 Ctrl+滚轮缩放时会整体等比例缩放（vh/vw 不跟随缩放） */
.device-frame{
  position:relative;width:393px;height:852px;flex-shrink:0;
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
  border-radius:48px;
  box-shadow:0 0 0 12px #1a1a1a,0 0 80px rgba(0,0,0,0.5);
  transform-origin:center center;
}
/* 窗口尺寸不足时，用 transform 等比缩小以适配视口（保持 393:852 比例 + 居中） */
@media (max-height: 892px){
  .device-frame{transform:scale(calc((100vh - 40px) / 892))}
}

/* 状态栏 */
.status-bar{
  height:44px;flex-shrink:0;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px 4px;font-size:12px;color:var(--ink);font-weight:600;
}
.status-bar .sb-right{display:flex;align-items:center;gap:5px}
.sb-signal{display:inline-flex;gap:1px;align-items:flex-end}
.sb-signal i{display:block;width:3px;background:var(--ink);border-radius:1px}
.sb-signal i:nth-child(1){height:4px}.sb-signal i:nth-child(2){height:6px}
.sb-signal i:nth-child(3){height:8px}.sb-signal i:nth-child(4){height:10px}
.sb-battery{width:22px;height:11px;border:1px solid var(--ink);border-radius:2px;position:relative;padding:1px}
.sb-battery::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:var(--ink);border-radius:0 1px 1px 0}
.sb-battery span{display:block;height:100%;width:80%;background:var(--green);border-radius:1px}

/* 导航栏 */
.nav-bar{
  height:44px;flex-shrink:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;position:relative;
  border-bottom:1px solid var(--rule);
}
.nav-title{font-size:16px;font-weight:600;color:var(--ink)}
.nav-back{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-size:22px;cursor:pointer;
}
.nav-back::before{content:'';display:block;width:10px;height:10px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}

/* 页面容器 */
.page-host{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;background:var(--bg);-webkit-overflow-scrolling:touch}
.page-host::-webkit-scrollbar{width:0}
.page-view{min-height:100%;padding:16px 12px 24px}
.page-view.no-pad{padding:0}

/* TabBar */
.tab-bar{
  height:74px;flex-shrink:0;background:var(--bg2);border-top:1px solid var(--rule);
  display:flex;padding-bottom:20px;
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--muted);cursor:pointer;font-size:10px;transition:color .2s;
}
.tab-item.active{color:var(--blue)}
.tab-item .ti-icon{font-size:20px;line-height:1}
.tab-item:active{opacity:.7}

/* ===== 通用组件 ===== */
.card{background:var(--bg3);border:1px solid var(--rule);border-radius:var(--r-card);padding:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .2s}
.btn:active{opacity:.85}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--bg3);color:var(--ink);border:1px solid var(--rule)}
.btn-block{display:flex;width:100%}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.tag-success{background:rgba(34,197,94,.15);color:var(--green)}
.tag-warning{background:rgba(245,158,11,.15);color:var(--warn)}
.tag-danger{background:rgba(239,68,68,.15);color:var(--red)}
.tag-info{background:rgba(59,130,246,.15);color:var(--blue)}
.empty-tip{text-align:center;padding:30px 0;color:var(--weak);font-size:13px}

/* Toast */
.toast-mask{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;pointer-events:none}
.toast-box{
  background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:8px;
  font-size:13px;max-width:260px;text-align:center;min-width:80px;
}
/* Modal */
.modal-mask{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:0 40px}
.modal-box{background:var(--bg3);border-radius:12px;width:100%;max-width:280px;overflow:hidden}
.modal-title{padding:16px 20px 8px;font-size:16px;font-weight:600;text-align:center}
.modal-content{padding:0 20px 16px;font-size:14px;color:var(--muted);text-align:center}
.modal-input{display:block;width:calc(100% - 40px);margin:0 20px 16px;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:14px}
.modal-footer{display:flex;border-top:1px solid var(--rule)}
.modal-footer .mb-btn{flex:1;padding:12px 0;text-align:center;font-size:15px;cursor:pointer}
.modal-footer .mb-cancel{color:var(--muted);border-right:1px solid var(--rule)}
.modal-footer .mb-confirm{color:var(--blue);font-weight:600}
</style>
</head>
<body>
<div class="device-frame">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span class="sb-time" id="sbTime">9:41</span>
    <span class="sb-right">
      <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
      <span style="font-size:10px">WiFi</span>
      <span class="sb-battery"><span></span></span>
    </span>
  </div>
  <!-- 导航栏 -->
  <div class="nav-bar" id="navBar">
    <div class="nav-back" id="navBack" style="display:none"></div>
    <div class="nav-title" id="navTitle">掌师</div>
  </div>
  <!-- 页面容器 -->
  <div class="page-host" id="pageHost">
    <div class="page-view" id="pageView"></div>
  </div>
  <!-- TabBar -->
  <div class="tab-bar" id="tabBar"></div>
</div>

<!-- Toast / Modal 容器 -->
<div id="toastHost"></div>
<div id="modalHost"></div>

<script src="app.js"></script>
<script src="pages-tabs.js"></script>
<script src="pages-diag.js"></script>
<script src="pages-know.js"></script>
<script src="pages-tools.js"></script>
<script>
// 启动应用
App.init();
</script>
</body>
</html>
