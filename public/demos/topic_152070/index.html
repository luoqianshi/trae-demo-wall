<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小熊的成长旅程</title>
  <style>
    /* ====== 基础重置与配色 ====== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-cream: #FFF8E7;
      --bg-warm: #FFEFD5;
      --primary: #E8943A;
      --primary-dark: #D4802E;
      --secondary: #8B6F47;
      --accent: #6BBF5E;
      --accent-warm: #E8C547;
      --text-main: #5C3D2E;
      --text-light: #8B7355;
      --card-bg: #FFFFFF;
      --shadow: rgba(140, 100, 50, 0.15);
      --locked: #C4B8A8;
      --completed: #6BBF5E;
    }
    body {
      font-family: "Rounded Mplus 1c", "M PLUS Rounded 1c", "Nunito", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background: #FFF8E7;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== 动画（放慢节奏，适合儿童） ====== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes clickPop {
      0% { transform: scale(1); }
      40% { transform: scale(0.95); }
      70% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    @keyframes starSpin {
      0% { transform: rotate(0deg) scale(0); opacity: 0; }
      60% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); opacity: 1; }
    }
    .fade-in { animation: fadeIn 0.8s ease-out both; }
    .pop-in { animation: popIn 0.7s ease-out both; }
    .bounce { animation: bounce 2.5s ease-in-out infinite; }
    .float { animation: float 4s ease-in-out infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }

    /* ====== 容器 ====== */
    .game-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px 20px;
      position: relative;
    }

    /* ====== 通用按钮（大尺寸，圆润） ====== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 14px 36px;
      font-size: 22px;
      font-weight: 700;
      border: none;
      border-radius: 32px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 1px;
      box-shadow: 0 4px 16px var(--shadow);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--shadow);
    }
    .btn:active {
      animation: clickPop 0.3s ease-out;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #F0A050 0%, #E8943A 100%);
    }
    .btn-secondary {
      background: white;
      color: var(--secondary);
      border: 3px solid var(--secondary);
    }
    .btn-secondary:hover {
      background: var(--secondary);
      color: white;
    }

    /* ====== 选择按钮（大卡片式） ====== */
    .btn-choice {
      width: 100%;
      min-height: 58px;
      padding: 18px 24px;
      font-size: 20px;
      text-align: left;
      background: white;
      color: var(--text-main);
      border: 3px solid #F0E8DC;
      border-radius: 30px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 14px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-choice:hover {
      border-color: var(--primary);
      background: #FFF5E6;
      transform: translateX(8px);
      box-shadow: 0 4px 14px var(--shadow);
    }
    .btn-choice:active {
      animation: clickPop 0.3s ease-out;
      border-color: var(--primary-dark);
      background: #FFE8CC;
    }
    .btn-choice .emoji { font-size: 32px; }
    .btn-choice .text { font-weight: 600; }

    /* ====== 返回按钮 ====== */
    .btn-back {
      background: transparent;
      color: var(--text-light);
      border: 2px solid var(--text-light);
      min-height: 44px;
      padding: 10px 24px;
      font-size: 16px;
      border-radius: 22px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .btn-back:hover {
      background: var(--text-light);
      color: white;
    }

    /* ====== 屏幕切换 ====== */
    .screen {
      display: none;
      animation: fadeIn 0.7s ease-out;
    }
    .screen.active {
      display: block;
    }

    /* ====== 开始页面 ====== */
    .start-screen {
      text-align: center;
      padding-top: 60px;
    }
    .start-bear {
      font-size: 110px;
      margin-bottom: 20px;
      display: inline-block;
      animation: bounce 2.5s ease-in-out infinite;
    }
    .start-title {
      font-size: 38px;
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .start-subtitle {
      font-size: 20px;
      color: var(--text-light);
      margin-bottom: 48px;
    }
    .start-decor {
      font-size: 36px;
      margin: 10px;
      display: inline-block;
    }

    /* ====== 关卡地图 ====== */
    .map-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .map-title {
      font-size: 30px;
      font-weight: 700;
      color: var(--secondary);
    }
    .map-subtitle {
      font-size: 18px;
      color: var(--text-light);
      margin-top: 8px;
      font-weight: 600;
    }
    .level-path {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 32px 0;
    }
    .level-card {
      width: 100%;
      max-width: 360px;
      padding: 24px 24px 20px;
      border-radius: 28px;
      background: var(--card-bg);
      box-shadow: 0 4px 20px var(--shadow);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }
    .level-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 30px var(--shadow);
    }
    .level-card.locked {
      opacity: 0.5;
      background: #F5F0E8;
      cursor: not-allowed;
    }
    .level-card.locked:hover {
      transform: none;
      box-shadow: 0 4px 16px var(--shadow);
    }
    .level-card.completed {
      border: 3px solid var(--completed);
    }
    .level-card.unlocked {
      border: 3px solid var(--primary);
      cursor: pointer;
    }
    .level-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 22px;
      font-weight: 700;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .level-num.locked { background: var(--locked); color: white; }
    .level-num.unlocked { background: var(--primary); color: white; }
    .level-num.completed { background: var(--completed); color: white; }
    .level-info { display: flex; align-items: center; }
    .level-name { font-size: 20px; font-weight: 700; }
    .level-desc { font-size: 14px; color: var(--text-light); margin-top: 4px; line-height: 1.4; }
    .level-status {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 14px;
    }
    .level-status.locked { background: #E8E0D4; color: #999; }
    .level-status.unlocked { background: #FFE8CC; color: var(--primary-dark); }
    .level-status.completed { background: #D4F5D0; color: #3A8C30; }
    .path-line {
      width: 3px;
      height: 24px;
      background: linear-gradient(to bottom, var(--primary), var(--accent-warm));
      border-radius: 2px;
    }

    /* ====== 已完成关卡星星标记 ====== */
    .completed-star {
      display: inline-block;
      font-size: 18px;
      margin-left: 6px;
      animation: starSpin 0.8s ease-out;
    }

    /* ====== 关卡内页面 ====== */
    .level-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .level-header-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--secondary);
    }
    .step-dots {
      display: flex;
      gap: 10px;
    }
    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #DDD5C8;
      transition: all 0.4s ease;
    }
    .step-dot.active { background: var(--primary); transform: scale(1.4); }
    .step-dot.done { background: var(--accent); }

    .scene-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 32px 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px var(--shadow);
    }
    .scene-emoji {
      font-size: 80px;
      text-align: center;
      margin-bottom: 20px;
      display: block;
    }
    .scene-text {
      font-size: 22px;
      line-height: 1.8;
      text-align: center;
      color: var(--text-main);
      font-weight: 500;
    }
    .scene-hint {
      font-size: 17px;
      color: var(--text-light);
      text-align: center;
      margin-top: 14px;
      font-style: italic;
    }

    #observe-feedback div {
      border-radius: 20px !important;
      padding: 20px !important;
      font-size: 20px !important;
    }

    .reflect-card {
      background: linear-gradient(135deg, #FFF8E7, #FFEFD5);
      border: 3px solid var(--accent-warm);
      border-radius: 28px;
      padding: 28px;
      margin-bottom: 24px;
      text-align: center;
    }
    .reflect-emoji { font-size: 64px; margin-bottom: 16px; }
    .reflect-text {
      font-size: 22px;
      font-weight: 600;
      color: var(--secondary);
      line-height: 1.7;
    }
    .reflect-tag {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 20px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 700;
    }
    .tag-normal { background: #E8E0D4; color: #7A6B5A; }
    .tag-thought { background: #D4E8F5; color: #3A6B8C; }
    .tag-unique { background: #F5E0D4; color: #8C5A3A; }

    /* ====== 结局页面 ====== */
    .ending-screen {
      text-align: center;
      padding-top: 20px;
    }
    .ending-trophy {
      font-size: 90px;
      margin-bottom: 20px;
      display: inline-block;
      animation: bounce 2.5s ease-in-out infinite;
    }
    .ending-title {
      font-size: 34px;
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 8px;
    }
    .ending-subtitle {
      font-size: 19px;
      color: var(--text-light);
      margin-bottom: 32px;
    }
    .ending-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .ending-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 16px var(--shadow);
      text-align: left;
      border-left: 5px solid var(--primary);
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards;
    }
    .ending-card:nth-child(1) { animation-delay: 0.3s; }
    .ending-card:nth-child(2) { animation-delay: 0.7s; }
    .ending-card:nth-child(3) { animation-delay: 1.1s; }
    .ending-card .card-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ending-card .card-text {
      font-size: 17px;
      color: var(--text-main);
      line-height: 1.7;
    }
    .choice-summary {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .choice-badge {
      padding: 8px 18px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 700;
    }
    .choice-badge.tag-normal { background: #E8E0D4; color: #7A6B5A; }
    .choice-badge.tag-thought { background: #D4E8F5; color: #3A6B8C; }
    .choice-badge.tag-unique { background: #F5E0D4; color: #8C5A3A; }

    /* ====== 主题色变体 ====== */
    .level-theme-yellow .scene-card {
      border: 3px solid #F5C96A;
    }
    .level-theme-yellow .btn-primary {
      background: linear-gradient(135deg, #F5C96A 0%, #E8B84A 100%) !important;
      color: #5C3D2E;
    }
    .level-theme-yellow .step-dot.active {
      background: #F5C96A;
    }
    .level-theme-yellow .btn-choice:hover {
      border-color: #F5C96A;
      background: #FFF5E0;
    }

    .level-theme-green .scene-card {
      border: 3px solid #7CCD7C;
    }
    .level-theme-green .btn-primary {
      background: linear-gradient(135deg, #7CCD7C 0%, #5FB85F 100%) !important;
      color: #2D5A2D;
    }
    .level-theme-green .step-dot.active {
      background: #7CCD7C;
    }
    .level-theme-green .btn-choice:hover {
      border-color: #7CCD7C;
      background: #E8F5E8;
    }

    .level-theme-blue .scene-card {
      border: 3px solid #6A8CBF;
    }
    .level-theme-blue .btn-primary {
      background: linear-gradient(135deg, #6A8CBF 0%, #4E72A8 100%) !important;
      color: #FFFFFF;
    }
    .level-theme-blue .step-dot.active {
      background: #6A8CBF;
    }
    .level-theme-blue .btn-choice:hover {
      border-color: #6A8CBF;
      background: #E8F0FA;
    }

    /* ====== 地图卡片增强样式 ====== */
    .level-theme-badge {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 2px;
      font-weight: 500;
    }
    .level-choice-badge {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #E8DED0;
      font-size: 14px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .choice-tag {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .choice-tag.tag-normal { background: #E8E0D4; color: #7A6B5A; }
    .choice-tag.tag-thought { background: #D4E8F5; color: #3A6B8C; }
    .choice-tag.tag-unique { background: #F5E0D4; color: #8C5A3A; }
    .level-card.completed { cursor: pointer; }
    .level-card.completed:hover {
      border-color: var(--accent) !important;
      box-shadow: 0 8px 24px rgba(107, 191, 94, 0.25);
    }

    /* ====== 结局页面增强样式 ====== */
    .card-subtitle {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .ending-extras {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .extra-card {
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards;
    }
    .ending-message {
      background: linear-gradient(135deg, #FFF8E7, #FFEFD5);
      border: 3px solid var(--accent-warm);
      border-radius: 24px;
      padding: 22px;
      margin: 24px 0;
      text-align: center;
    }
    .ending-message p {
      font-size: 19px;
      font-weight: 700;
      color: var(--secondary);
      line-height: 1.7;
    }

    @media (max-width: 400px) {
      .game-container { padding: 16px 12px; }
      .start-title { font-size: 30px; }
      .start-bear { font-size: 80px; }
      .btn { min-height: 48px; padding: 12px 28px; font-size: 20px; }
      .btn-choice { min-height: 52px; padding: 14px 20px; font-size: 18px; }
      .scene-text { font-size: 19px; }
      .scene-emoji { font-size: 64px; }
      .level-card { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="game-container">

    <!-- 开始页面 -->
    <div class="screen active" id="screen-start">
      <div class="start-screen">
        <div class="start-bear">🐻</div>
        <h1 class="start-title">小熊的成长旅程</h1>
        <p class="start-subtitle">一个关于勇气、思考和创意的互动故事</p>
        <div>
          <span class="start-decor float" style="animation-delay:0s">🌳</span>
          <span class="start-decor float" style="animation-delay:0.5s">✨</span>
          <span class="start-decor float" style="animation-delay:1s">🌿</span>
        </div>
        <div style="margin-top: 48px;">
          <button class="btn btn-primary" onclick="goToMap()">
            开始冒险 🎯
          </button>
        </div>
      </div>
    </div>

    <!-- 关卡地图 -->
    <div class="screen" id="screen-map">
      <div class="map-header">
        <h2 class="map-title">🗺️ 成长地图</h2>
        <p class="map-subtitle" id="progress-text">已完成 0/3 关</p>
      </div>
      <div class="level-path" id="level-path"></div>
    </div>

    <!-- 关卡内页面 -->
    <div class="screen" id="screen-level">
      <div class="level-header">
        <button class="btn-back" onclick="backToMap()">← 返回地图</button>
        <div class="step-dots" id="step-dots">
          <div class="step-dot active"></div>
          <div class="step-dot"></div>
          <div class="step-dot"></div>
        </div>
      </div>
      <div id="level-content"></div>
    </div>

    <!-- 结局页面 -->
    <div class="screen" id="screen-ending">
      <div class="ending-screen">
        <div class="ending-trophy">🏆</div>
        <h2 class="ending-title">冒险完成！</h2>
        <p class="ending-subtitle">看看小熊在旅程中收获了什么吧</p>
        <div class="ending-cards" id="ending-cards">
          <div class="ending-card" style="border-left-color: #E8943A;">
            <div class="card-title">⭐ 完美结局</div>
            <div class="card-subtitle">保底结局</div>
            <div class="card-text">你走完了全程。每一步都算数。你已经是一个善良、有判断力的孩子了。</div>
          </div>
        </div>
        <div class="ending-extras" id="ending-extras" style="display:none;"></div>
        <div class="choice-summary" id="choice-summary"></div>
        <div class="ending-message" id="ending-message">
          <p>请把在游戏中积累的品质，在现实的关卡里好好表现出来吧！</p>
        </div>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
          <button class="btn btn-secondary" onclick="goToMap()">
            ← 返回地图
          </button>
          <button class="btn btn-primary" onclick="restartGame()">
            重新开始 📌
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const LEVELS = [
      {
        id: 1,
        name: "善良的奇奇",
        desc: "小熊奇奇在森林里遇到一只饿坏了的小松鼠",
        emoji: "🐿️",
        sceneEmoji: "🌳",
        themeColor: "#F5C96A",
        observeText: "小熊奇奇在森林里散步，发现一只小松鼠蜷缩在树洞旁，看起来无精打采的……",
        observeHint: "点击「点击观察」按钮，看看发生了什么吧！",
        observeButton: "🔍 点击观察",
        observeFeedback: "小松鼠抬起头，虚弱地说：「我好几天没吃东西了……」",
        exploreItems: [],
        choices: [
          { emoji: "🌰", text: "给它一些坚果", type: "normal" },
          { emoji: "🍱", text: "把自己的午餐全部给它", type: "unique" }
        ],
        reflectQuestion: "奇奇帮助完小松鼠后，心里有什么感受呢？",
        reflectHint: "选择一个感受，结束这一关吧！",
        reflectChoices: [
          { emoji: "😊", text: "很开心", type: "normal" },
          { emoji: "🤔", text: "觉得还可以做得更好", type: "thought" }
        ],
        reflectTexts: {
          normal: "奇奇帮助了小松鼠，心里感到暖暖的。善良就是看见别人的需要，并愿意回应。",
          thought: "奇奇想：虽然帮助了小松鼠，但以后可以多准备一些食物带在身边，帮助更多需要的朋友。",
          unique: "奇奇把自己的午餐全部给了小松鼠，虽然自己饿了，但看到小松鼠开心的样子，觉得很值得。"
        }
      },
      {
        id: 2,
        name: "智慧的奇奇",
        desc: "一个陌生的动物向奇奇问路，周围没有其他人",
        emoji: "🦉",
        sceneEmoji: "🌲",
        themeColor: "#7CCD7C",
        observeText: "奇奇正在森林里采野果，突然一只陌生的动物跑过来，气喘吁吁地问：「请问去山顶的小路怎么走？」周围没有其他人……",
        observeHint: "点击「点击观察」按钮，看看有什么细节吧！",
        observeButton: "🔍 点击观察",
        observeFeedback: "你注意到了：那个陌生人神色慌张，附近也没有标志牌。",
        exploreItems: [],
        choices: [
          { emoji: "🚶", text: "直接带路", type: "normal" },
          { emoji: "👀", text: "先观察再决定", type: "thought" },
          { emoji: "👨‍👩‍👧", text: "找大人帮忙", type: "unique" }
        ],
        reflectQuestion: "奇奇处理完这件事后，你觉得他的做法对吗？",
        reflectHint: "选择一个评价，结束这一关吧！",
        reflectChoices: [
          { emoji: "✅", text: "对", type: "normal" },
          { emoji: "💭", text: "还可以更谨慎", type: "thought" }
        ],
        reflectTexts: {
          normal: "奇奇直接给陌生人指了路，陌生人很快离开了。但奇奇总觉得哪里有点不对劲。",
          thought: "奇奇先观察了一下，发现陌生人说话时眼神飘忽不定，决定先不回答，去问问附近的长辈。",
          unique: "奇奇机智地说：「我也不太清楚，我去找大人来帮你吧！」然后赶紧跑去找大人帮忙。"
        }
      },
      {
        id: 3,
        name: "担当的奇奇",
        desc: "好朋友不小心弄坏了奇奇最心爱的玩具",
        emoji: "🧸",
        sceneEmoji: "🏡",
        themeColor: "#6A8CBF",
        observeText: "奇奇最好的朋友小兔来家里玩，不小心把奇奇最心爱的音乐盒碰掉在地上，摔坏了。小兔吓得眼泪都快掉出来了……",
        observeHint: "点击「点击观察」按钮，看看奇奇是怎么想的吧！",
        observeButton: "🔍 点击观察",
        observeFeedback: "你理清了思路：先冷静，再沟通，最后一起解决。",
        exploreItems: [],
        choices: [
          { emoji: "🤗", text: "直接原谅", type: "normal" },
          { emoji: "💬", text: "先聊聊再决定", type: "thought" },
          { emoji: "🔧", text: "一起修好它", type: "unique" }
        ],
        reflectQuestion: "如果下次遇到类似的事情，你还会选择原谅和担当吗？",
        reflectHint: "选择一个答案，结束这一关吧！",
        reflectChoices: [
          { emoji: "💪", text: "会", type: "normal" },
          { emoji: "🤝", text: "会，但会更温柔", type: "thought" }
        ],
        reflectTexts: {
          normal: "奇奇深吸一口气说：「没关系，我知道你不是故意的。」小兔感激地抱住了奇奇。",
          thought: "奇奇和小兔聊了聊，发现小兔其实很自责。奇奇安慰他说：「下次小心就好啦，我们还是好朋友。」",
          unique: "奇奇说：「我们一起把它修好吧！」两个小伙伴一起动手，音乐盒虽然有点不一样了，但变得更加特别。"
        }
      }
    ];

    const ENDINGS = {
      perfect: {
        title: "完美结局",
        emoji: "⭐",
        sub: "保底结局",
        text: "你走完了全程。每一步都算数。你已经是一个善良、有判断力的孩子了。"
      },
      better: {
        title: "思考者结局",
        emoji: "💡",
        sub: "更好结局",
        text: "而且你多想了一下，这种能力比任何答案都重要。"
      },
      special: {
        title: "创意大师结局",
        emoji: "✨",
        sub: "特殊结局",
        text: "你有一个独特想法，世界需要更多敢想的孩子。"
      }
    };

    let gameState = {
      unlockedLevels: [1],
      completedLevels: [],
      levelChoices: {},
      currentLevel: null,
      currentStep: null,
      foundItems: []
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + id).classList.add('active');
    }

    function goToMap() {
      renderMap();
      showScreen('map');
    }

    function goBackToMap() {
      renderMap();
      showScreen('map');
    }

    function backToMap() {
      if (gameState.currentStep !== null && gameState.currentStep !== 'done') {
        if (!confirm('确定要返回地图吗？当前关卡的进度不会保存哦！')) return;
      }
      gameState.currentLevel = null;
      gameState.currentStep = null;
      gameState.foundItems = [];
      renderMap();
      showScreen('map');
    }

    function renderMap() {
      const container = document.getElementById('level-path');
      container.innerHTML = '';
      const allCompleted = gameState.completedLevels.length === LEVELS.length;

      // 更新进度文字
      document.getElementById('progress-text').textContent =
        `已完成 ${gameState.completedLevels.length}/${LEVELS.length} 关`;

      const themeWords = ['善良', '智慧', '担当'];

      LEVELS.forEach((level, index) => {
        const isUnlocked = gameState.unlockedLevels.includes(level.id);
        const isCompleted = gameState.completedLevels.includes(level.id);
        let statusClass = 'locked';
        let statusText = '🔒 锁定';
        let statusDot = 'locked';

        if (isCompleted) {
          statusClass = 'completed';
          statusText = '✅ 已完成';
          statusDot = 'completed';
        } else if (isUnlocked) {
          statusClass = 'unlocked';
          statusText = '▶️ 可玩';
          statusDot = 'unlocked';
        }

        const card = document.createElement('div');
        card.className = `level-card ${statusClass} pop-in`;
        card.style.animationDelay = `${index * 0.15}s`;

        // 已完成的关卡显示选择类型标签
        let choiceTagHtml = '';
        if (isCompleted) {
          const choiceType = gameState.levelChoices[level.id];
          const tagText = { normal: '常规', thought: '思考', unique: '独特' }[choiceType];
          const tagClass = `tag-${choiceType}`;
          choiceTagHtml = `<span class="choice-tag ${tagClass}">${tagText}</span>`;
        }

        card.innerHTML = `
          <div class="level-status ${statusText.includes('锁定') ? 'locked' : statusText.includes('可玩') ? 'unlocked' : 'completed'}">${isCompleted ? '⭐ ' : ''}${statusText}</div>
          <div class="level-info">
            <div class="level-num ${statusDot}">${level.id}</div>
            <div>
              <div class="level-name">${level.emoji} ${level.name}${isCompleted ? ' <span class="completed-star">⭐</span>' : ''}</div>
              <div class="level-theme-badge">主题：${themeWords[index]}</div>
              <div class="level-desc">${level.desc}</div>
            </div>
          </div>
          ${choiceTagHtml ? `<div class="level-choice-badge">选择：${choiceTagHtml}</div>` : ''}
        `;

        // 可玩 或 已完成的关卡都可以点击进入
        if (isUnlocked) {
          card.onclick = () => {
            if (isCompleted) {
              if (confirm('此关卡已完成，确定要重新挑战吗？之前的记录将被覆盖。')) {
                // 清除旧记录
                delete gameState.levelChoices[level.id];
                const idx = gameState.completedLevels.indexOf(level.id);
                if (idx !== -1) gameState.completedLevels.splice(idx, 1);
                // 如果下一关已解锁，但当前关卡重玩，不影响下一关的解锁状态
                startLevel(level.id);
              }
            } else {
              startLevel(level.id);
            }
          };
        }
        container.appendChild(card);

        if (index < LEVELS.length - 1) {
          const line = document.createElement('div');
          line.className = 'path-line';
          container.appendChild(line);
        }
      });

      if (allCompleted && !document.getElementById('ending-btn')) {
        const endingDiv = document.createElement('div');
        endingDiv.className = 'pop-in';
        endingDiv.style.marginTop = '16px';
        endingDiv.innerHTML = `
          <button class="btn btn-primary" id="ending-btn" onclick="showEnding()">
            查看结局 ✨
          </button>
        `;
        container.appendChild(endingDiv);
      }
    }

    function startLevel(levelId) {
      gameState.currentLevel = levelId;
      gameState.currentStep = 'observe';
      gameState.foundItems = [];
      const level = LEVELS.find(l => l.id === levelId);
      const content = document.getElementById('level-content');
      const container = document.querySelector('.game-container');
      container.classList.remove('level-theme-yellow', 'level-theme-green', 'level-theme-blue');
      if (level.themeColor === '#F5C96A') {
        container.classList.add('level-theme-yellow');
      } else if (level.themeColor === '#7CCD7C') {
        container.classList.add('level-theme-green');
      } else if (level.themeColor === '#6A8CBF') {
        container.classList.add('level-theme-blue');
      }
      renderLevel();
      showScreen('level');
    }

    function renderLevel() {
      const level = LEVELS.find(l => l.id === gameState.currentLevel);
      const content = document.getElementById('level-content');
      const dots = document.querySelectorAll('.step-dot');

      const stepIndex = { observe: 0, choose: 1, reflect: 2 }[gameState.currentStep];
      dots.forEach((dot, i) => {
        dot.classList.remove('active', 'done');
        if (i < stepIndex) dot.classList.add('done');
        else if (i === stepIndex) dot.classList.add('active');
      });

      if (gameState.currentStep === 'observe') {
        if (level.observeButton) {
          content.innerHTML = `
            <div class="scene-card">
              <span class="scene-emoji">${level.sceneEmoji}</span>
              <p class="scene-text">${level.observeText}</p>
              <p class="scene-hint">${level.observeHint}</p>
              <div id="observe-feedback" style="margin-top:16px; display:none;">
                <div style="background: linear-gradient(135deg, #FFF8E7, #FFEFD5); border: 3px solid var(--accent-warm); border-radius: 16px; padding: 16px; text-align: center; font-size: 18px; font-weight: 600; color: var(--secondary);">
                  ${level.observeFeedback}
                </div>
              </div>
              <div style="text-align:center; margin-top:16px;">
                <button class="btn btn-primary" id="observe-btn" onclick="doObserve()">
                  ${level.observeButton}
                </button>
                <button class="btn btn-secondary" id="observe-continue" onclick="goToChoose()" style="display:none; margin-left:8px;">
                  继续 →
                </button>
              </div>
            </div>
          `;
        } else {
          content.innerHTML = `
            <div class="scene-card">
              <span class="scene-emoji">${level.sceneEmoji}</span>
              <p class="scene-text">${level.observeText}</p>
              <p class="scene-hint">${level.observeHint}</p>
              <div class="explore-area" id="explore-area"></div>
            </div>
            <div style="text-align:center; margin-top:8px;">
              <button class="btn btn-secondary" onclick="goToChoose()">
                观察完了，继续 →
              </button>
            </div>
          `;
          renderExploreItems(level);
        }
      } else if (gameState.currentStep === 'choose') {
        content.innerHTML = `
          <div class="scene-card">
            <span class="scene-emoji">🤔</span>
            <p class="scene-text">小熊打算怎么做呢？</p>
            <p class="scene-hint">选择一个动作，每个选择都有不同的结果哦！</p>
          </div>
          <div id="choice-area"></div>
        `;
        renderChoices(level);
      } else if (gameState.currentStep === 'reflect') {
        if (level.reflectChoices) {
          content.innerHTML = `
            <div class="scene-card">
              <span class="scene-emoji">💭</span>
              <p class="scene-text">${level.reflectQuestion}</p>
              <p class="scene-hint">${level.reflectHint}</p>
            </div>
            <div id="reflect-choice-area"></div>
          `;
          renderReflectChoices(level);
        } else {
          const choiceType = gameState.levelChoices[level.id];
          const tagClass = `tag-${choiceType}`;
          const tagText = { normal: '常规选择', thought: '思考选择', unique: '独特选择' }[choiceType];
          const reflectText = level.reflectTexts[choiceType];

          content.innerHTML = `
            <div class="reflect-card">
              <div class="reflect-emoji">🐻</div>
              <p class="reflect-text">${reflectText}</p>
              <span class="reflect-tag ${tagClass}">${tagText}</span>
            </div>
            <div style="text-align:center;">
              <button class="btn btn-primary" onclick="completeLevel()">
                完成关卡 ✨
              </button>
            </div>
          `;
        }
      }
    }

    function renderExploreItems(level) {
      const area = document.getElementById('explore-area');
      if (!area) return;
      area.innerHTML = '';
      level.exploreItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'explore-item';
        div.innerHTML = `<div class="icon">${item.icon}</div><div class="label">${item.label}</div>`;
        div.onclick = () => {
          if (gameState.foundItems.includes(index)) return;
          gameState.foundItems.push(index);
          div.classList.add('found');
          div.querySelector('.label').textContent = item.found;
          div.style.cursor = 'default';
        };
        area.appendChild(div);
      });
    }

    function doObserve() {
      const feedback = document.getElementById('observe-feedback');
      const btn = document.getElementById('observe-btn');
      const cont = document.getElementById('observe-continue');
      if (feedback) feedback.style.display = 'block';
      if (btn) btn.style.display = 'none';
      if (cont) cont.style.display = 'inline-flex';
    }

    function goToChoose() {
      gameState.currentStep = 'choose';
      renderLevel();
    }

    function renderChoices(level) {
      const area = document.getElementById('choice-area');
      if (!area) return;
      area.innerHTML = '';
      level.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn-choice';
        btn.innerHTML = `<span class="emoji">${choice.emoji}</span><span class="text">${choice.text}</span>`;
        btn.onclick = () => makeChoice(choice.type);
        area.appendChild(btn);
      });
    }

    function renderReflectChoices(level) {
      const area = document.getElementById('reflect-choice-area');
      if (!area) return;
      area.innerHTML = '';
      level.reflectChoices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn-choice';
        btn.innerHTML = `<span class="emoji">${choice.emoji}</span><span class="text">${choice.text}</span>`;
        btn.onclick = () => makeReflectChoice(choice.type);
        area.appendChild(btn);
      });
    }

    function makeChoice(type) {
      gameState.levelChoices[gameState.currentLevel] = type;
      gameState.currentStep = 'reflect';
      renderLevel();
    }

    function makeReflectChoice(type) {
      const level = LEVELS.find(l => l.id === gameState.currentLevel);
      if (type === 'thought' || type === 'unique') {
        gameState.levelChoices[level.id] = type;
      }
      const reflectText = level.reflectTexts[gameState.levelChoices[level.id]];
      const tagClass = `tag-${gameState.levelChoices[level.id]}`;
      const tagText = { normal: '常规选择', thought: '思考选择', unique: '独特选择' }[gameState.levelChoices[level.id]];

      const content = document.getElementById('level-content');
      content.innerHTML = `
        <div class="reflect-card">
          <div class="reflect-emoji">🐻</div>
          <p class="reflect-text">${reflectText}</p>
          <span class="reflect-tag ${tagClass}">${tagText}</span>
        </div>
        <div style="text-align:center;">
          <button class="btn btn-primary" onclick="completeLevel()">
            完成关卡 ✨
          </button>
        </div>
      `;
    }

    function completeLevel() {
      const levelId = gameState.currentLevel;
      if (!gameState.completedLevels.includes(levelId)) {
        gameState.completedLevels.push(levelId);
      }
      const nextId = levelId + 1;
      if (nextId <= LEVELS.length && !gameState.unlockedLevels.includes(nextId)) {
        gameState.unlockedLevels.push(nextId);
      }
      gameState.currentLevel = null;
      gameState.currentStep = null;
      gameState.foundItems = [];

      // 先回到地图（渲染"查看结局"按钮或更新进度）
      renderMap();
      showScreen('map');

      // 全部完成后自动弹出结局
      if (gameState.completedLevels.length === LEVELS.length) {
        setTimeout(() => {
          if (confirm('所有关卡已完成！要查看结局吗？')) {
            showEnding();
          }
        }, 500);
      }
    }

    function showEnding() {
      const choices = gameState.levelChoices;
      const hasThought = Object.values(choices).includes('thought');
      const hasUnique = Object.values(choices).includes('unique');

      // 关卡选择摘要
      const summary = document.getElementById('choice-summary');
      summary.innerHTML = '';
      LEVELS.forEach(level => {
        const type = choices[level.id];
        if (!type) return;
        const tagClass = `tag-${type}`;
        const tagText = { normal: '常规', thought: '思考', unique: '独特' }[type];
        const span = document.createElement('span');
        span.className = `choice-badge ${tagClass}`;
        span.textContent = `${level.name}: ${tagText}`;
        summary.appendChild(span);
      });

      // 主结局卡片（完美结局保底）
      const cards = document.getElementById('ending-cards');
      cards.innerHTML = `
        <div class="ending-card" style="border-left-color: #E8943A;">
          <div class="card-title">${ENDINGS.perfect.emoji} ${ENDINGS.perfect.title}</div>
          <div class="card-subtitle">${ENDINGS.perfect.sub}</div>
          <div class="card-text">${ENDINGS.perfect.text}</div>
        </div>
      `;

      // 追加结局容器
      const extras = document.getElementById('ending-extras');
      extras.style.display = 'flex';
      extras.innerHTML = '';

      if (hasThought) {
        const div = document.createElement('div');
        div.className = 'ending-card extra-card';
        div.style.borderLeftColor = '#5B8DEF';
        div.style.animationDelay = '0.4s';
        div.innerHTML = `
          <div class="card-title">${ENDINGS.better.emoji} ${ENDINGS.better.title}</div>
          <div class="card-subtitle">${ENDINGS.better.sub}</div>
          <div class="card-text">${ENDINGS.better.text}</div>
        `;
        extras.appendChild(div);
      }

      if (hasUnique) {
        const div = document.createElement('div');
        div.className = 'ending-card extra-card';
        div.style.borderLeftColor = '#E8A853';
        div.style.animationDelay = hasThought ? '0.6s' : '0.4s';
        div.innerHTML = `
          <div class="card-title">${ENDINGS.special.emoji} ${ENDINGS.special.title}</div>
          <div class="card-subtitle">${ENDINGS.special.sub}</div>
          <div class="card-text">${ENDINGS.special.text}</div>
        `;
        extras.appendChild(div);
      }

      showScreen('ending');
    }

    function restartGame() {
      gameState = {
        unlockedLevels: [1],
        completedLevels: [],
        levelChoices: {},
        currentLevel: null,
        currentStep: null,
        foundItems: []
      };
      // 清理结局页面残留
      document.getElementById('ending-cards').innerHTML = '';
      document.getElementById('ending-extras').innerHTML = '';
      document.getElementById('ending-extras').style.display = 'none';
      document.getElementById('choice-summary').innerHTML = '';
      showScreen('start');
    }

    showScreen('start');
  </script>
</body>
</html>
