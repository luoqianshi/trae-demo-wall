<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妙迹 - 打卡待办</title>
<style>
  :root {
    --primary: #6C5CE7;
    --primary-light: #A29BFE;
    --primary-bg: #F0EEFF;
    --success: #00B894;
    --success-light: #E6F9F4;
    --warning: #FDCB6E;
    --danger: #E17055;
    --bg: #F8F9FD;
    --card: #FFFFFF;
    --text: #2D3436;
    --text-secondary: #636E72;
    --text-muted: #B2BEC3;
    --border: #E8E8F0;
    --shadow: 0 2px 16px rgba(108,92,231,0.08);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 90px;
    position: relative;
  }

  .header {
    padding: 24px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; font-weight: 700;
  }
  .app-title { font-size: 22px; font-weight: 700; }
  .date-display { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .header-right { display: flex; gap: 6px; }
  .btn-icon {
    width: 36px; height: 36px;
    border: none; border-radius: 10px;
    background: var(--card); color: var(--text-secondary);
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    box-shadow: var(--shadow);
  }
  .btn-icon:hover { background: var(--primary-bg); color: var(--primary); }

  .today-stats {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 12px 0 16px;
    box-shadow: var(--shadow);
    display: none;
  }
  .today-stats.show { display: block; }
  .stats-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .stats-label { font-size: 13px; color: var(--text-secondary); }
  .stats-count { font-size: 13px; font-weight: 600; color: var(--primary); }
  .progress-track {
    width: 100%; height: 6px;
    background: var(--border); border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    transition: width 0.4s ease;
    width: 0%;
  }

  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 0;
    background: var(--card);
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -2px 16px rgba(108,92,231,0.06);
    z-index: 30;
    border-top: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    padding: 6px 0;
    border: none; border-radius: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px; font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .tab-btn .tab-icon { display: block; font-size: 22px; margin-bottom: 0; transition: transform 0.2s; }
  .tab-btn.active {
    background: transparent;
    color: var(--primary);
    font-weight: 600;
  }
  .tab-btn.active .tab-icon { transform: scale(1.15) translateY(-1px); }
  .tab-btn:active .tab-icon { transform: scale(0.95); }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .mode-switcher {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 4px;
    box-shadow: var(--shadow);
  }
  .mode-btn {
    flex: 1;
    padding: 8px 0;
    border: none; border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
  }
  .mode-btn .mode-label { display: block; font-size: 11px; font-weight: 400; color: var(--text-muted); margin-top: 1px; }
  .mode-btn.active {
    background: var(--primary-bg);
    color: var(--primary);
    font-weight: 600;
  }
  .mode-btn.active .mode-label { color: var(--primary-light); }

  .task-list { display: flex; flex-direction: column; gap: 8px; }

  .task-card {
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
    cursor: default;
    position: relative;
  }
  .task-card:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(108,92,231,0.12); }

  .task-check {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
    background: var(--card);
  }
  .task-check:hover { border-color: var(--primary-light); }
  .task-check.checked {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
    font-size: 12px;
  }
  .task-body { flex: 1; min-width: 0; }
  .task-title {
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    word-break: break-word;
  }
  .task-card.done .task-title { text-decoration: line-through; color: var(--text-muted); }
  .task-time {
    font-size: 12px;
    color: var(--primary-light);
    display: flex; align-items: center; gap: 4px;
    margin-top: 3px;
  }
  .task-delete {
    width: 28px; height: 28px;
    border: none; border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .task-card:hover .task-delete { opacity: 1; }
  .task-delete:hover { background: #FFF0ED; color: var(--danger); }

  .add-btn-wrap {
    margin-top: 14px;
    display: flex;
    justify-content: center;
  }
  .add-btn {
    width: 48px; height: 48px;
    border: none; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(108,92,231,0.3);
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
  }
  .add-btn:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(108,92,231,0.4); }
  .add-btn:active { transform: scale(0.95); }

  .timeline { position: relative; padding-left: 28px; }
  .timeline::before {
    content: '';
    position: absolute; left: 10px; top: 8px; bottom: 8px;
    width: 2px;
    background: var(--border);
    border-radius: 1px;
  }
  .timeline-item { position: relative; margin-bottom: 8px; }
  .timeline-dot {
    position: absolute; left: -22px; top: 16px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--primary-bg);
    border: 2px solid var(--primary);
    z-index: 1;
  }
  .timeline-item.done .timeline-dot { background: var(--success); border-color: var(--success); }
  .timeline .task-card { border-left: 3px solid var(--primary-light); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 14px; }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 20px 36px;
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; }
  .modal-field { margin-bottom: 16px; }
  .modal-field label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  .modal-field input, .modal-field select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    background: var(--bg);
  }
  .modal-field input:focus, .modal-field select:focus { border-color: var(--primary); }
  .modal-field .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions button {
    flex: 1;
    padding: 12px;
    border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-actions .btn-cancel { background: var(--bg); color: var(--text-secondary); }
  .modal-actions .btn-cancel:hover { background: var(--border); }
  .modal-actions .btn-confirm { background: var(--primary); color: #fff; }
  .modal-actions .btn-confirm:hover { box-shadow: 0 2px 12px rgba(108,92,231,0.3); }

  .habit-grid { display: flex; flex-direction: column; gap: 10px; }
  .habit-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }
  .habit-card:hover { transform: translateY(-1px); }
  .habit-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .habit-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .habit-icon.habit-daily { background: #FFF3E0; }
  .habit-icon.habit-weekly { background: #E8F5E9; }
  .habit-icon.habit-monthly { background: #E3F2FD; }
  .habit-icon.habit-custom { background: #F3E5F5; }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name { font-size: 15px; font-weight: 600; }
  .habit-period { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .habit-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  .habit-stat {
    text-align: center;
    flex: 1;
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 4px;
  }
  .habit-stat-num { font-size: 20px; font-weight: 700; color: var(--primary); }
  .habit-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .habit-checkin-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .habit-checkin-btn {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    cursor: pointer;
    font-size: 12px; font-weight: 600;
    color: var(--text-secondary);
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .habit-checkin-btn:hover { border-color: var(--primary-light); color: var(--primary); }
  .habit-checkin-btn.checked {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }
  .habit-checkin-btn.today-label {
    border-color: var(--primary-light);
    background: var(--primary-bg);
    color: var(--primary);
    font-size: 10px;
    width: auto; padding: 0 8px;
  }
  .habit-checkin-btn.today-label.checked {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }
  .habit-actions { display: flex; gap: 6px; margin-left: auto; }
  .habit-edit-btn {
    width: 28px; height: 28px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .habit-edit-btn:hover { background: var(--primary-bg); color: var(--primary); }
  .habit-del-btn {
    width: 28px; height: 28px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .habit-del-btn:hover { background: #FFF0ED; color: var(--danger); }

  /* ===== Celebration Animation ===== */
  .celebration-overlay {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .celebration-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    background: var(--card);
    padding: 12px 24px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(20px) scale(0.9);
    animation: celebratePop 2s ease forwards;
    text-align: center;
    max-width: 300px;
  }
  @keyframes celebratePop {
    0% { opacity: 0; transform: translateY(20px) scale(0.9); }
    15% { opacity: 1; transform: translateY(0) scale(1.05); }
    25% { transform: translateY(0) scale(1); }
    85% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(0.95); }
  }
  .confetti {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 2px;
    animation: confettiFall 1.5s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(200px) rotate(720deg); }
  }

  /* ===== AI Encourage Badge ===== */
  .ai-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    background: linear-gradient(135deg, var(--primary-bg), #E8F0FF);
    color: var(--primary);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
    margin-top: 6px;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ===== Streak Badge ===== */
  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
    margin-left: 6px;
    color: #fff;
  }
  .streak-badge.bronze { background: linear-gradient(135deg, #CD7F32, #B87333); }
  .streak-badge.silver { background: linear-gradient(135deg, #C0C0C0, #A9A9A9); }
  .streak-badge.gold { background: linear-gradient(135deg, #FFD700, #FFA500); }
  .streak-badge.diamond { background: linear-gradient(135deg, #B9F2FF, #89CFF0); }

  /* ===== AI Encourage Badge ===== */
  .ai-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    background: linear-gradient(135deg, var(--primary-bg), #E8F0FF);
    color: var(--primary);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
    margin-top: 6px;
  }

  /* ===== Theme Switcher ===== */
  .theme-panel {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border-radius: 24px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    z-index: 40;
    max-width: 480px;
    width: calc(100% - 32px);
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .theme-title {
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .theme-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 3px solid var(--card);
    cursor: pointer;
    transition: transform 0.2s;
    position: relative;
  }
  .theme-btn:hover { transform: scale(1.1); }
  .theme-btn.active {
    transform: scale(1.15);
    box-shadow: 0 0 0 2px var(--primary), 0 2px 8px rgba(0,0,0,0.15);
  }
  .theme-purple { background: linear-gradient(135deg, #6C5CE7, #A29BFE); }
  .theme-green { background: linear-gradient(135deg, #00B894, #55EFC4); }
  .theme-blue { background: linear-gradient(135deg, #0984E3, #74B9FF); }
  .theme-orange { background: linear-gradient(135deg, #E17055, #FAB1A0); }
  .theme-dark { background: linear-gradient(135deg, #2d3436, #636E72); }
  .theme-toggle-label {
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  @media (max-width: 380px) {
    .app { padding: 0 12px 90px; }
    .tab-btn { font-size: 10px; }
    .tab-btn .tab-icon { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="header">
    <div class="header-left">
      <div class="logo">迹</div>
      <div>
        <div class="app-title">妙迹</div>
        <div class="date-display" id="dateDisplay"></div>
        <div id="highestStreakBadge" style="display:none;margin-top:4px;"></div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-icon" onclick="openStatsModal()" title="数据统计" id="statsBtn">📊</button>
      <button class="btn-icon" onclick="showAchievementWall()" title="成就墙" id="achievementBtn">🏅</button>
      <button class="btn-icon" onclick="toggleThemePanel()" title="更换主题" id="themeToggleBtn">🎨</button>
      <button class="btn-icon" onclick="clearDoneTasks()" title="清除已完成">✓</button>
    </div>
  </header>

  <div class="today-stats" id="todayStats">
    <div class="stats-row">
      <span class="stats-label" id="statsLabel">今日进度</span>
      <span class="stats-count" id="statsCount">0/0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="panel active" id="panelToday">
    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="p" onclick="switchMode('p')">
        🌿 悠然视图
        <span class="mode-label">自由罗列 · 轻松打卡</span>
      </button>
      <button class="mode-btn" data-mode="j" onclick="switchMode('j')">
        ⏳ 时光轴
        <span class="mode-label">时间有序 · 严谨规划</span>
      </button>
    </div>
    <div id="todayList"></div>
    <div class="add-btn-wrap">
      <button class="add-btn" onclick="openAddModal('today')">+</button>
    </div>
  </div>

  <div class="panel" id="panelLongterm">
    <div id="longtermList"></div>
    <div class="add-btn-wrap">
      <button class="add-btn" onclick="openAddModal('longterm')">+</button>
    </div>
  </div>

  <div class="panel" id="panelHabits">
    <div id="habitList"></div>
    <div class="add-btn-wrap">
      <button class="add-btn" onclick="openAddModal('habit')">+</button>
    </div>
  </div>
</div>

<!-- Bottom Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="today" onclick="switchTab('today')">
    <span class="tab-icon">📋</span>今日待办
  </button>
  <button class="tab-btn" data-tab="longterm" onclick="switchTab('longterm')">
    <span class="tab-icon">📦</span>远期栈
  </button>
  <button class="tab-btn" data-tab="habits" onclick="switchTab('habits')">
    <span class="tab-icon">🔥</span>习惯营
  </button>
</div>

<!-- Theme Panel -->
<div class="theme-panel" id="themePanel" style="display:none;">
  <div class="theme-title">🎨 选择主题色</div>
  <button class="theme-btn theme-purple" onclick="setTheme('purple')" title="紫韵" data-theme="purple"></button>
  <button class="theme-btn theme-green" onclick="setTheme('green')" title="青翠" data-theme="green"></button>
  <button class="theme-btn theme-blue" onclick="setTheme('blue')" title="碧蓝" data-theme="blue"></button>
  <button class="theme-btn theme-orange" onclick="setTheme('orange')" title="暖橙" data-theme="orange"></button>
  <button class="theme-btn theme-dark" onclick="setTheme('dark')" title="暗夜" data-theme="dark"></button>
  <div class="theme-toggle-label">点击切换，自动保存</div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent">

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d.habits) {
          d.habits = d.habits.map(h => ({
            ...h,
            records: h.records || {},
            periodType: h.periodType || 'daily',
            periodDays: h.periodDays || 1,
            icon: h.icon || '💪'
          }));
        }
        return d;

    } catch(e) {}
    return defaultData();
  }

  function getToday() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function getOffsetDate(offset) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function getTodayCN() {
    const d = new Date();

    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${weekdays[d.getDay()]}`;
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2,4);

    const map = { daily: '每天', weekly: '每周', monthly: '每月' };

  function getWeekDates() {
    const arr = [];
    const now = new Date();
    const dayOfWeek = now.getDay();
    const monday = new Date(now);
    monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      arr.push(`${y}-${m}-${day}`);
    }
    return arr;
  }

  function getMonthDates() {
    const arr = [];
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const day = String(d).padStart(2,'0');
      const month = String(m+1).padStart(2,'0');
      arr.push(`${y}-${month}-${day}`);
    }
    return arr;
  }

  function getCustomDates(days) {
    const arr = [];
    const now = new Date();
    for (let i = 0; i < days; i++) {
      const d = new Date(now);
      d.setDate(now.getDate() - (days - 1 - i));
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      arr.push(`${y}-${m}-${day}`);
    }
    return arr;
  }

  function getHabitDates(h) {
    if (h.periodType === 'weekly') return getWeekDates();
    if (h.periodType === 'monthly') return getMonthDates();
    if (h.periodType === 'custom') return getCustomDates(h.periodDays || 7);
    const arr = [];
    const now = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(now.getDate() - i);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      arr.push(`${y}-${m}-${day}`);

    return arr;
  }

  // ===== Badge System =====
  const BADGE_LEVELS = [
    { min: 3, max: 6, key: 'bronze', icon: '🥉', label: '铜', name: '初露锋芒' },
    { min: 7, max: 13, key: 'silver', icon: '🥈', label: '银', name: '稳扎稳打' },
    { min: 14, max: 29, key: 'gold', icon: '🥇', label: '金', name: '坚持不懈' },
    { min: 30, max: 999, key: 'diamond', icon: '👑', label: '钻', name: '登峰造极' }
  ];

  function getStreakBadge(streak) {
    if (streak < 3) return null;
    const level = BADGE_LEVELS.find(l => streak >= l.min && streak <= l.max);
    if (!level) return null;
    return level;
  }

  function getStreakBadgeHTML(streak) {
    const badge = getStreakBadge(streak);
    if (!badge) return '';
    return `<span class="streak-badge ${badge.key}">${badge.icon} ${badge.name}</span>`;
  }

  function getHabitStreak(habit) {
    let streak = 0;
    const todayD = new Date();
    for (let i = 0; i < 365; i++) {
      const d = new Date(todayD);
      d.setDate(todayD.getDate() - i);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      const key = `${y}-${m}-${day}`;
      if (habit.records[key]) streak++;
      else break;
    }
    return streak;
  }

  function getHighestStreak() {
    let maxStreak = 0;
    let bestHabit = null;
    data.habits.forEach(h => {
      const s = getHabitStreak(h);
      if (s > maxStreak) {
        maxStreak = s;
        bestHabit = h;
      }
    });
    return { streak: maxStreak, habit: bestHabit };
  }

  function updateHighestStreakBadge() {
    const el = document.getElementById('highestStreakBadge');
    const { streak, habit } = getHighestStreak();
    if (streak >= 3 && habit) {
      const badge = getStreakBadge(streak);
      el.style.display = 'block';
      el.innerHTML = `<span class="streak-badge ${badge.key}" style="font-size:11px;cursor:pointer;" onclick="showAchievementWall()" title="点击查看成就墙">${badge.icon} ${badge.name} · ${habit.name} ${streak}天</span>`;
    } else {
      el.style.display = 'none';
    }
  }

  function showAchievementWall() {
    modalContext = { type: null };

    let maxStreak = 0;
    let bestHabit = null;
    data.habits.forEach(h => {
      const s = getHabitStreak(h);
      if (s > maxStreak) { maxStreak = s; bestHabit = h; }
    });

    let wallHtml = `<div style="max-height:60vh;overflow-y:auto;padding-right:4px;">
      <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;text-align:center;">🏆 坚持打卡，解锁荣誉徽章</p>
      <div style="display:flex;flex-direction:column;gap:12px;">`;

    BADGE_LEVELS.forEach(level => {
      const unlocked = maxStreak >= level.min;
      wallHtml += `
        <div style="display:flex;align-items:center;gap:14px;padding:14px;background:${unlocked ? 'var(--primary-bg)' : 'var(--bg)'};border-radius:12px;opacity:${unlocked ? 1 : 0.4};">
          <div style="font-size:32px;">${unlocked ? level.icon : '🔒'}</div>
          <div style="flex:1;">
            <div style="font-size:15px;font-weight:600;">${level.name} <span class="streak-badge ${level.key}">${level.icon} ${level.label}</span></div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">连续打卡 ${level.min}${level.max === 999 ? '+' : `-${level.max}`} 天</div>
            ${unlocked && bestHabit ? `<div style="font-size:12px;color:var(--primary);margin-top:4px;">✅ 已解锁 · 来自「${bestHabit.name}」</div>` : ''}
            ${!unlocked ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">还差 ${level.min - maxStreak} 天解锁</div>` : ''}
          </div>
        </div>`;
    });

    wallHtml += `</div></div>`;

    showModalView('🏅 成就墙', wallHtml);
  }

      const cnt = Object.keys(h.records).length;

    document.getElementById('statsCount').textContent = `${done}/${total}`;

    container.innerHTML = `<div class="habit-grid">${habits.map(h => {
      const dates = getHabitDates(h);
      const doneInPeriod = dates.filter(d => h.records[d]).length;
      const totalInPeriod = dates.length;
      const ratio = totalInPeriod > 0 ? Math.round((doneInPeriod/totalInPeriod)*100) : 0;
      const todayStr = getToday();
      const todayChecked = !!h.records[todayStr];

      let streak = 0;
      const todayD = new Date();
      for (let i = 0; i < 365; i++) {
        const d = new Date(todayD);
        d.setDate(todayD.getDate() - i);
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        const key = `${y}-${m}-${day}`;
        if (h.records[key]) streak++;
        else break;
      }

      const streakBadgeHTML = getStreakBadgeHTML(streak);
      const aiBadge = streak >= 2 ? `<div class="ai-badge">🤖 AI: 连续${streak}天打卡，保持这个节奏！</div>` : '';

      return `

            <div class="habit-icon ${getHabitIcon(h)}">${h.icon || '💪'}</div>

            </div>

          <div class="habit-checkin-row">
            ${dates.map(d => {
              const checked = !!h.records[d];

              return `<button class="habit-checkin-btn${checked ? ' checked' : ''}${isToday ? ' today-label' : ''}" onclick="toggleHabitCheckin('${h.id}','${d}')">${isToday ? '今日' : getShortDate(d)}</button>`;

  function toggleToday(id) {
    const tasks = currentMode === 'p' ? data.todayP : data.todayJ;
    const t = tasks.find(x => x.id === id);
    if (t) {
      const wasDone = t.done;
      t.done = !t.done;
      if (!wasDone && t.done) {
        showCelebration(getAIMessage('task'));
      }
      renderAll();
    }
  }

  function deleteToday(id) {
    if (currentMode === 'p') {
      data.todayP = data.todayP.filter(x => x.id !== id);
    } else {
      data.todayJ = data.todayJ.filter(x => x.id !== id);
    }
    renderAll();
  }

  function toggleLongterm(id) {
    const t = data.longterm.find(x => x.id === id);
    if (t) {
      const wasDone = t.done;
      t.done = !t.done;
      if (!wasDone && t.done) {
        showCelebration(getAIMessage('task'));
      }
      renderAll();
    }
  }

  function deleteLongterm(id) {
    data.longterm = data.longterm.filter(x => x.id !== id);
    renderAll();
  }

  function toggleHabitCheckin(habitId, dateStr) {
    const h = data.habits.find(x => x.id === habitId);
    if (!h) return;
    const wasChecked = !!h.records[dateStr];
    if (wasChecked) {
      delete h.records[dateStr];
    } else {
      h.records[dateStr] = true;
      let streak = 0;
      const todayD = new Date();
      for (let i = 0; i < 365; i++) {
        const d = new Date(todayD);
        d.setDate(todayD.getDate() - i);
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        const key = `${y}-${m}-${day}`;
        if (h.records[key]) streak++;
        else break;
      }
      // Check for badge milestone
      const badge = getStreakBadge(streak);
      const prevBadge = getStreakBadge(streak - 1);
      if (badge && (!prevBadge || prevBadge.key !== badge.key)) {
        showCelebration(`🏆 解锁新徽章！${badge.icon} ${badge.name}（连续${streak}天）`);
      } else {
        showCelebration(getAIMessage('habit', streak));
      }
    }
    renderAll();
  }

    if (!confirm('确定删除这个习惯吗？打卡记录也将被清除。')) return;
    data.habits = data.habits.filter(x => x.id !== id);
    renderAll();

  function clearDoneTasks() {
    if (currentTab === 'today') {
      const tasks = currentMode === 'p' ? data.todayP : data.todayJ;
      const doneCount = tasks.filter(t => t.done).length;
      if (doneCount === 0) return;
      if (!confirm(`清除${currentMode === 'p' ? '悠然视图' : '时光轴'}中所有已完成的任务？`)) return;
      if (currentMode === 'p') data.todayP = data.todayP.filter(t => !t.done);
      else data.todayJ = data.todayJ.filter(t => !t.done);
      renderAll();
    } else if (currentTab === 'longterm') {
      const doneCount = data.longterm.filter(t => t.done).length;
      if (doneCount === 0) return;
      if (!confirm('清除远期栈中所有已完成的任务？')) return;
      data.longterm = data.longterm.filter(t => !t.done);
      renderAll();
    }
  }

    document.getElementById('modalTitle').textContent = title;

  function confirmModal() {
    if (!modalContext) { closeModal(); return; }
    // 纯展示弹窗（数据统计、成就墙等），直接关闭
    if (modalContext.type === null) { closeModal(); return; }

    const title = document.getElementById('modalInputTitle')?.value?.trim();
    if (!title) {
      alert('请输入内容');
      return;
    }

    const { type } = modalContext;

    if (type === 'today') {
      const isP = currentMode === 'p';
      const task = { id: genId(), title, done: false, createdAt: Date.now() };
      if (!isP) {
        const time = document.getElementById('modalInputTime')?.value || '00:00';
        task.time = time;
        data.todayJ.push(task);
      } else {
        data.todayP.push(task);
      }
    } else if (type === 'longterm') {
      data.longterm.push({ id: genId(), title, done: false, createdAt: Date.now() });
    } else if (type === 'habit') {
      const periodType = document.getElementById('modalInputPeriod')?.value || 'daily';
      let periodDays = 1;
      if (periodType === 'custom') {
        periodDays = parseInt(document.getElementById('modalInputDays')?.value) || 7;
        if (periodDays < 2) periodDays = 2;
        if (periodDays > 90) periodDays = 90;
      }
      const icon = document.getElementById('modalInputIcon')?.value || '💪';
      data.habits.push({
        id: genId(),
        name: title,
        icon,
        periodType,
        periodDays,
        records: {},
        createdAt: Date.now()
      });
    } else if (type === 'editHabit') {
      const h = data.habits.find(x => x.id === modalContext.editId);
      if (h) {
        h.name = title;
        h.periodType = document.getElementById('modalInputPeriod')?.value || 'daily';
        if (h.periodType === 'custom') {
          h.periodDays = parseInt(document.getElementById('modalInputDays')?.value) || 7;
          if (h.periodDays < 2) h.periodDays = 2;
          if (h.periodDays > 90) h.periodDays = 90;
        } else {
          h.periodDays = 1;
        }
        h.icon = document.getElementById('modalInputIcon')?.value || '💪';
      }
    }

    closeModal();
    renderAll();
  }

  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('show')) {
      closeModal();
    }
    if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('show')) {
      confirmModal();
    }
  });

  function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== Celebration =====
  function showCelebration(message) {
    const overlay = document.getElementById('celebrationOverlay');
    overlay.innerHTML = '';
    overlay.style.display = 'flex';

    const text = document.createElement('div');
    text.className = 'celebration-text';
    text.textContent = message;
    overlay.appendChild(text);

    const colors = ['#6C5CE7', '#A29BFE', '#00B894', '#FDCB6E', '#E17055', '#74B9FF'];
    for (let i = 0; i < 20; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + '%';
      conf.style.top = '30%';
      conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      conf.style.animationDelay = Math.random() * 0.5 + 's';
      conf.style.animationDuration = (1 + Math.random() * 0.8) + 's';
      overlay.appendChild(conf);
    }

    setTimeout(() => {
      overlay.style.display = 'none';
      overlay.innerHTML = '';
    }, 2200);
  }

  // ===== Demo Data =====
  function clearDemoData() {
    if (!confirm('重置为演示数据？当前数据将被替换。')) return;
    data = getDemoData();
    renderAll();
  }

  // ===== Theme =====
  const THEME_KEY = 'riji_theme';
  const THEMES = {
    purple: {
      '--primary': '#6C5CE7', '--primary-light': '#A29BFE', '--primary-bg': '#F0EEFF',
      '--success': '#00B894', '--bg': '#F8F9FD', '--card': '#FFFFFF',
      '--text': '#2D3436', '--text-secondary': '#636E72', '--text-muted': '#B2BEC3',
      '--border': '#E8E8F0',
      shadow: 'rgba(108,92,231,0.08)',
      name: '紫韵', pageBg: '#F8F9FD', cardBg: '#FFFFFF'
    },
    green: {
      '--primary': '#00B894', '--primary-light': '#55EFC4', '--primary-bg': '#E6F9F4',
      '--success': '#00B894', '--bg': '#F0FFF8', '--card': '#FFFFFF',
      '--text': '#2D3436', '--text-secondary': '#636E72', '--text-muted': '#B2BEC3',
      '--border': '#D4EDDA',
      shadow: 'rgba(0,184,148,0.08)',
      name: '青翠', pageBg: '#F0FFF8', cardBg: '#FFFFFF'
    },
    blue: {
      '--primary': '#0984E3', '--primary-light': '#74B9FF', '--primary-bg': '#E8F4FD',
      '--success': '#00B894', '--bg': '#F0F8FF', '--card': '#FFFFFF',
      '--text': '#2D3436', '--text-secondary': '#636E72', '--text-muted': '#B2BEC3',
      '--border': '#D6E9F8',
      shadow: 'rgba(9,132,227,0.08)',
      name: '碧蓝', pageBg: '#F0F8FF', cardBg: '#FFFFFF'
    },
    orange: {
      '--primary': '#E17055', '--primary-light': '#FAB1A0', '--primary-bg': '#FFF0ED',
      '--success': '#00B894', '--bg': '#FFF8F5', '--card': '#FFFFFF',
      '--text': '#2D3436', '--text-secondary': '#636E72', '--text-muted': '#B2BEC3',
      '--border': '#F5E1D8',
      shadow: 'rgba(225,112,85,0.08)',
      name: '暖橙', pageBg: '#FFF8F5', cardBg: '#FFFFFF'
    },
    dark: {
      '--primary': '#A29BFE', '--primary-light': '#6C5CE7', '--primary-bg': '#2D2D4A',
      '--success': '#55EFC4', '--bg': '#1A1A2E', '--card': '#252542',
      '--text': '#E8E8F0', '--text-secondary': '#B2BEC3', '--text-muted': '#636E72',
      '--border': '#3D3D5C',
      shadow: 'rgba(162,155,254,0.1)',
      name: '暗夜', pageBg: '#1A1A2E', cardBg: '#252542'
    }
  };

  function applyTheme(name) {
    const theme = THEMES[name] || THEMES.purple;
    const root = document.documentElement;
    Object.keys(theme).forEach(key => {
      if (key === 'name' || key === 'shadow' || key === 'pageBg' || key === 'cardBg') return;
      root.style.setProperty(key, theme[key]);
    });
    // Update shadow
    root.style.setProperty('--shadow', `0 2px 16px ${theme.shadow}`);
    // Update body background
    document.body.style.backgroundColor = theme.pageBg || theme['--bg'];
    // Save
    localStorage.setItem(THEME_KEY, name);
    currentTheme = name;
    // Update active button
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === name);
    });
  }

  let currentTheme = localStorage.getItem(THEME_KEY) || 'purple';

  function toggleThemePanel() {
    const panel = document.getElementById('themePanel');
    const isVisible = panel.style.display !== 'none';
    panel.style.display = isVisible ? 'none' : 'flex';
    // Update active state
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === currentTheme);
    });
  }

  function setTheme(name) {
    applyTheme(name);
    // Close panel after a short delay
    setTimeout(() => {
      document.getElementById('themePanel').style.display = 'none';
    }, 400);
  }

  // ===== Init =====
  if (!data.todayP) data.todayP = [];
  if (!data.todayJ) data.todayJ = [];
  if (!data.longterm) data.longterm = [];
  if (!data.habits) data.habits = [];

  const demoLoaded = localStorage.getItem(DEMO_KEY);
  const hasUserData = data.todayP.length > 0 || data.todayJ.length > 0 || data.longterm.length > 0 || data.habits.length > 0;

  if (!demoLoaded && !hasUserData) {
    data = getDemoData();
    localStorage.setItem(DEMO_KEY, 'true');
  }

  // Apply saved theme
  applyTheme(currentTheme);

  renderAll();
</script>
</body>
</html>
