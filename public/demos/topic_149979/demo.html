    participants: [
      { name: '周医生', role: '发起人' }
    ]
  },
  {
    id: 'seed-4', title: '城市流浪动物TNR地图',
    problem: '城市流浪动物数量多，投喂点分散，TNR（捕捉-绝育-放归）行动缺乏协调和数据记录。',
    solution: '建立一张协作式TNR地图，志愿者可标记投喂点、记录绝育状态、协调救助资源。',
    target: '流浪动物救助志愿者、公益组织', tag: '公益', stage: 'mature',
    author: '喵星人联盟', needs: ['传播推广','资金资源'],
    created: '2026-05-15', views: 892, joined: 15,
    timeline: [
      { time: '2026-05-15', text: '创意提出：协作式TNR地图。' },
      { time: '2026-05-20', text: 'AI 帮助梳理功能：地图标记、状态追踪、志愿者协作、数据看板。' },
      { time: '2026-06-01', text: '小程序原型上线，首批10名志愿者试用。' },
      { time: '2026-06-15', text: '与当地两家宠物医院达成合作，提供绝育优惠。' },
      { time: '2026-07-01', text: '获得小额公益基金支持，进入规模化阶段。' }
    ],
    participants: [
      { name: '喵星人联盟', role: '发起人' },
      { name: '阿杰', role: '技术开发' },
      { name: '爱心医院A', role: '合作机构' },
      { name: '李记者', role: '媒体传播' }
    ]
  }
];

function initData() {
  if (ideas.length === 0) {
    ideas = JSON.parse(JSON.stringify(seedIdeas));
    saveIdeas();
  }
}
function saveIdeas() { localStorage.setItem(STORAGE_KEY, JSON.stringify(ideas)); }

/* ---------- Routing ---------- */
function go(page, param) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector('.nav-links button[data-page="' + page + '"]')?.classList.add('active');
  window.scrollTo(0,0);
  if (page === 'home') { renderPlaza(); updateStats(); }
  if (page === 'match') { renderMatch(); }
  if (page === 'profile') { renderProfile(); }
  if (page === 'detail' && param) { renderDetail(param); }
}

/* ---------- Plaza ---------- */
function renderPlaza() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const st = document.getElementById('filter-stage').value;
  const tg = document.getElementById('filter-tag').value;
  const grid = document.getElementById('plaza-grid');
  let filtered = ideas.filter(i => {
    if (q && !i.title.toLowerCase().includes(q) && !i.problem.toLowerCase().includes(q)) return false;
    if (st && i.stage !== st) return false;
    if (tg && i.tag !== tg) return false;
    return true;
  });
  if (filtered.length === 0) {
    grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px;">暂无符合条件的创意，试着换个筛选条件，或成为第一个发布者。</p>';
    return;
  }
  grid.innerHTML = filtered.map(i => ideaCardHTML(i)).join('');
}

function ideaCardHTML(i) {
  const stageNames = { seed:'种子期', grow:'成长期', mature:'成熟期' };
  return `
    <div class="idea-card" onclick="go('detail','${i.id}')">
      <div class="tags">
        <span class="tag">${i.tag}</span>
        ${i.needs.map(n => `<span class="tag tag-want">${n}</span>`).join('')}
      </div>
      <h3>${i.title}</h3>
      <p class="desc">${i.problem}</p>
      <div class="idea-meta">
        <span class="author"><span class="avatar">${i.author[0]}</span>${i.author}</span>
        <span class="stage-badge stage-${i.stage}">${stageNames[i.stage]}</span>
      </div>
    </div>
  `;
}

function updateStats() {
  document.getElementById('stat-ideas').textContent = ideas.length;
  const people = ideas.reduce((s,i) => s + (i.participants?.length||1), 0);
  document.getElementById('stat-people').textContent = people;
  const matches = ideas.reduce((s,i) => s + (i.joined||0), 0);
  document.getElementById('stat-matches').textContent = matches;
  const stages = ideas.filter(i => i.stage === 'mature').length;
  document.getElementById('stat-stages').textContent = stages;
}

/* ---------- Publish ---------- */
function publishIdea() {
  const title = document.getElementById('pub-title').value.trim();
  const problem = document.getElementById('pub-problem').value.trim();
  const solution = document.getElementById('pub-solution').value.trim();
  const target = document.getElementById('pub-target').value.trim();
  const tag = document.getElementById('pub-tag').value;
  const needs = Array.from(document.querySelectorAll('.need-check:checked')).map(c => c.value);
  if (!title || !problem) { showToast('请填写标题和问题描述'); return; }

  // Simulate AI analysis
  const aiHTML = `
    <div class="ai-box">
      <h4>AI 创意提案摘要</h4>
      <p><strong>核心洞察：</strong>该创意聚焦「${tag}」领域，试图解决「${problem.slice(0,30)}…」的问题。</p>
      <ul>
        <li>目标受益人：${target || '待明确'}</li>
        <li>建议 MVP 方向：先验证最小可行方案，再逐步扩展</li>
        <li>潜在匹配资源：${needs.join('、') || '待补充'}</li>
        <li>平台建议：记录创意演化轨迹，持续吸引同路人加入</li>
      </ul>
    </div>
  `;
  document.getElementById('ai-preview').innerHTML = aiHTML;
  document.getElementById('ai-preview').style.display = 'block';

  const newIdea = {
    id: 'idea-' + Date.now(), title, problem, solution, target, tag, stage: 'seed',
    author: currentUser.name, needs: needs.length ? needs : ['待补充'],
    created: new Date().toISOString().slice(0,10), views: 0, joined: 0,
    timeline: [
      { time: new Date().toISOString().slice(0,10), text: '创意种子被种下，记录了问题与初步构想。' },
      { time: new Date().toISOString().slice(0,10), text: 'AI 生成提案摘要，帮助梳理表达与方向。' }
    ],
    participants: [{ name: currentUser.name, role: '发起人' }]
  };
  ideas.unshift(newIdea);
  saveIdeas();
  showToast('创意已发布！AI 提案摘要已生成。');
  setTimeout(() => go('home'), 1200);
}

/* ---------- Detail ---------- */
function renderDetail(id) {
  const i = ideas.find(x => x.id === id);
  if (!i) { go('home'); return; }
  const stageNames = { seed:'种子期', grow:'成长期', mature:'成熟期' };
  const container = document.getElementById('detail-container');
  container.innerHTML = `
    <div class="detail-header">
      <div class="tags">
        <span class="tag">${i.tag}</span>
        <span class="stage-badge stage-${i.stage}">${stageNames[i.stage]}</span>
      </div>
      <h1>${i.title}</h1>
      <div class="meta">
        发起人：${i.author} · ${i.created} · ${i.views} 次浏览 · ${i.joined} 人参与
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-main">
        <div>
          <h3>问题与痛点</h3>
          <p>${i.problem}</p>
        </div>
        <div>
          <h3>解决方案构想</h3>
          <p>${i.solution || '暂未填写详细方案。'}</p>
        </div>
        <div>
          <h3>AI 提案摘要</h3>
          <div class="ai-box" style="margin-top:0;">
            <p>该创意聚焦「${i.tag}」领域，目标受益人为「${i.target || '待明确'}」。</p>
            <ul>
              <li>所需支持：${i.needs.join('、')}</li>
              <li>建议先验证最小可行方案，再逐步扩展影响力</li>
            </ul>
          </div>
        </div>
        <div>
          <h3>创意成长时间线</h3>
          <div class="timeline">
            ${(i.timeline||[]).map(t => `
              <div class="timeline-item">
                <div class="time">${t.time}</div>
                <div class="text">${t.text}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
      <div class="detail-sidebar">
        <div>
          <h3>参与共创</h3>
          <p style="font-size:14px;color:var(--muted);margin:0 0 12px;">如果你有能力或资源帮助这个创意落地，请点击加入。</p>
          <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="joinIdea('${i.id}')">我想加入</button>
        </div>
        <div>
          <h3>已有伙伴</h3>
          ${(i.participants||[]).map(p => `
            <div class="participant">
              <span class="avatar">${p.name[0]}</span>
              <div>
                <div style="font-weight:600;font-size:14px;">${p.name}</div>
                <span class="role">${p.role}</span>
              </div>
            </div>
          `).join('')}
        </div>
        <div>
          <h3>所需支持</h3>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${i.needs.map(n => `<span class="tag tag-want">${n}</span>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

function joinIdea(id) {
  const i = ideas.find(x => x.id === id);
  if (!i) return;
  i.joined = (i.joined||0) + 1;
  i.participants = i.participants || [];
  if (!i.participants.find(p => p.name === currentUser.name)) {
    i.participants.push({ name: currentUser.name, role: '新加入成员' });
    i.timeline = i.timeline || [];
    i.timeline.push({ time: new Date().toISOString().slice(0,10), text: `${currentUser.name} 表达参与意愿，等待发起人确认。` });
  }
  saveIdeas();
  showToast('已表达参与意愿！');
  renderDetail(id);
}

/* ---------- Match ---------- */
function renderMatch() {
  const role = document.getElementById('match-role').value;
  const skill = document.getElementById('match-skill').value;
  const grid = document.getElementById('match-grid');
  let filtered = ideas.filter(i => i.stage !== 'mature');
  if (skill) {
    filtered = filtered.filter(i => i.needs.includes(skill));
  }
  if (filtered.length === 0) {
    grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px;">暂无匹配项目，换个筛选条件试试。</p>';
    return;
  }
  grid.innerHTML = filtered.map(i => ideaCardHTML(i)).join('');
}

/* ---------- Profile ---------- */
function renderProfile() {
  const mine = ideas.filter(i => i.author === currentUser.name);
  const joined = ideas.filter(i => i.participants?.some(p => p.name === currentUser.name && p.role !== '发起人'));
  document.getElementById('prof-ideas').textContent = mine.length;
  document.getElementById('prof-joined').textContent = joined.length;
  document.getElementById('prof-views').textContent = mine.reduce((s,i) => s + (i.views||0), 0);
  document.getElementById('my-ideas').innerHTML = mine.length ? mine.map(i => ideaCardHTML(i)).join('') : '<p style="color:var(--muted);">你还没有发布创意，去「发布创意」种下一颗种子吧。</p>';
  document.getElementById('my-joined').innerHTML = joined.length ? joined.map(i => ideaCardHTML(i)).join('') : '<p style="color:var(--muted);">你还没有参与任何创意，去「资源匹配」发现好项目吧。</p>';
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.getElementById(tab).style.display = 'grid';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

/* ---------- Toast ---------- */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ---------- Init ---------- */
initData();
renderPlaza();
updateStats();
</script>
</body>
</html>
