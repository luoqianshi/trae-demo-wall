<body>
<div class="app-container">
  <!-- Header -->
  <div class="app-header">
    腹膜透析记录本
    <small>CAPD 持续非卧床腹膜透析</small>
  </div>

  <!-- Tab Navigation -->
  <div class="tab-nav">
    <button class="tab-btn active" data-tab="exchange">换液记录</button>
    <button class="tab-btn" data-tab="vital">体征记录</button>
    <button class="tab-btn" data-tab="summary">数据汇总</button>
  </div>

  <!-- ====== Tab 1: Exchange Records ====== -->
  <div class="tab-content active" id="tab-exchange">
    <!-- Today Progress -->
    <div class="today-progress">
      <div class="progress-text" id="todayProgressText">今日已完成 0/4 次换液</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="todayProgressBar" style="width:0%"></div>
      </div>
    </div>

    <!-- Alert for abnormal colors -->
    <div id="colorAlert" class="alert alert-danger hidden">
      ⚠ 警告：透析液颜色异常！请及时联系医生。
    </div>

    <!-- New Exchange Form -->
    <div class="form-section">
      <h3>➕ 新建换液记录</h3>
      <div class="form-row">
        <label>日期</label>
        <input type="date" id="exDate">
      </div>
      <div class="form-row">
        <label>换液序号</label>
        <div class="calc-field" id="exSeqNum">第 1 次</div>
      </div>
      <div class="form-row">
        <label>换液时间</label>
        <input type="time" id="exTime">
      </div>
      <div class="form-row">
        <label>腹透液浓度</label>
        <div class="radio-group">
          <label><input type="radio" name="concentration" value="1.5%"> 1.5%</label>
          <label><input type="radio" name="concentration" value="2.5%" checked> 2.5%</label>
          <label><input type="radio" name="concentration" value="4.25%"> 4.25%</label>
        </div>
      </div>
      <div class="form-row">
        <label>灌入量总重(g)</label>
        <input type="number" id="inWeight" placeholder="如 2520" inputmode="decimal">
      </div>
      <div class="form-row">
        <label>空袋皮重(g)</label>
        <input type="number" id="inTare" placeholder="如 32" inputmode="decimal">
      </div>
      <div class="form-row">
        <label>实际灌入量</label>
        <div class="calc-field" id="calcInVol">-- g</div>
      </div>
      <div class="form-row">
        <label>引流量总重(g)</label>
        <input type="number" id="outWeight" placeholder="如 2610" inputmode="decimal">
      </div>
      <div class="form-row">
        <label>引流袋皮重(g)</label>
        <input type="number" id="outTare" placeholder="如 28" inputmode="decimal">
      </div>
      <div class="form-row">
        <label>实际引流量</label>
        <div class="calc-field" id="calcOutVol">-- g</div>
      </div>
      <div class="form-row">
        <label>超滤量</label>
        <div class="uf-display zero" id="calcUF" style="flex:1">-- ml</div>
      </div>
      <div class="form-row">
        <label>透析液颜色</label>
        <div class="radio-group color-group">
          <label><input type="radio" name="fluidColor" value="清亮" checked> 清亮</label>
          <label><input type="radio" name="fluidColor" value="淡黄"> 淡黄</label>
          <label><input type="radio" name="fluidColor" value="浑浊"> 浑浊</label>
          <label><input type="radio" name="fluidColor" value="血性"> 血性</label>
        </div>
      </div>
      <div class="form-row">
        <label>备注</label>
        <input type="text" id="exNote" placeholder="选填">
      </div>
      <button class="btn btn-primary" id="saveExchangeBtn">💾 保存换液记录</button>
    </div>

    <!-- Today's Records -->
    <h3 class="mb-12" style="color:#4A90D9;">📋 今日换液记录</h3>
    <div id="todayExchangeList"></div>

    <!-- Daily Summary Footer -->
    <div class="daily-summary-footer">
      <div class="dsf-item">
        <span class="dsf-value" id="todayTotalUF">--</span>
        <span class="dsf-label">累计超滤(ml)</span>
      </div>
      <div class="dsf-item">
        <span class="dsf-value" id="todayExchangeCount">0</span>
        <span class="dsf-label">换液次数</span>
      </div>
    </div>

    <!-- History -->
    <h3 class="mt-12 mb-12" style="color:#555;">📅 历史换液记录</h3>
    <div class="form-row mb-12">
      <label>查看日期</label>
      <input type="date" id="historyDate">
    </div>

<script>
// ============================================================
// 腹膜透析记录本 - CAPD Peritoneal Dialysis Record App
// ============================================================

// ===== Data Layer =====
const STORAGE_KEY_EXCHANGE = 'pd_exchange_records';
const STORAGE_KEY_VITAL = 'pd_vital_records';
const STORAGE_KEY_DEMO_SEED = 'pd_demo_seeded';

function loadData(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('Load data error:', e);
    return [];
  }
}

function saveData(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify(data));
  } catch (e) {
    console.error('Save data error:', e);
  }
}

function getExchangeRecords() { return loadData(STORAGE_KEY_EXCHANGE); }
function getVitalRecords() { return loadData(STORAGE_KEY_VITAL); }
function setExchangeRecords(data) { saveData(STORAGE_KEY_EXCHANGE, data); }
function setVitalRecords(data) { saveData(STORAGE_KEY_VITAL, data); }

// ===== UUID Generator =====
function generateId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return crypto.randomUUID();
  }
  return Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 9);
}

// ===== Date Helpers =====
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function nowTimeStr() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function parseDate(str) {
  const parts = str.split('-');
  return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
}

function formatDateCN(str) {
  const d = parseDate(str);
  const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + weekNames[d.getDay()];
}

function getWeekRange(offset) {
  const now = new Date();
  const dayOfWeek = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - dayOfWeek + 1 + offset * 7);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return [dateToStr(monday), dateToStr(sunday)];
}

function getMonthRange(offset) {
  const now = new Date();
  now.setMonth(now.getMonth() + offset, 1);
  const start = dateToStr(now);
  const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  const end = dateToStr(lastDay);
  return [start, end];
}

function dateToStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getDateRange(type) {
  switch (type) {
    case 'thisWeek': return getWeekRange(0);
    case 'lastWeek': return getWeekRange(-1);
    case 'thisMonth': return getMonthRange(0);
    case 'lastMonth': return getMonthRange(-1);
    case 'custom':
      const s = document.getElementById('rangeStart').value;
      const e = document.getElementById('rangeEnd').value;
      return (s && e) ? [s, e] : getWeekRange(0);
    default: return getWeekRange(0);
  }
}

// ===== Calculation Helpers =====
function calcActualIn(rec) { return (rec.inWeight || 0) - (rec.inTare || 0); }
function calcActualOut(rec) { return (rec.outWeight || 0) - (rec.outTare || 0); }
function calcUF(rec) { return calcActualOut(rec) - calcActualIn(rec); }

function getDayExchanges(date) {
  return getExchangeRecords().filter(r => r.date === date).sort((a, b) => a.seqNum - b.seqNum);
}

function getDayTotalUF(date) {
  return getDayExchanges(date).reduce((sum, r) => sum + calcUF(r), 0);
}

function getNextSeqNum(date) {
  const recs = getDayExchanges(date);
  return recs.length > 0 ? Math.max(...recs.map(r => r.seqNum)) + 1 : 1;
}

// ===== Toast =====
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== Confirm Dialog =====
function showConfirm(title, msg) {
  return new Promise((resolve) => {
    const dialog = document.getElementById('confirmDialog');
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMsg').textContent = msg;
    dialog.classList.add('show');
    const ok = document.getElementById('confirmOK');
    const cancel = document.getElementById('confirmCancel');
    function cleanup() {
      dialog.classList.remove('show');
      ok.removeEventListener('click', onOk);
      cancel.removeEventListener('click', onCancel);
    }
    function onOk() { cleanup(); resolve(true); }
    function onCancel() { cleanup(); resolve(false); }
    ok.addEventListener('click', onOk);
    cancel.addEventListener('click', onCancel);
  });
}

// ===== Cloud Sync Placeholders =====
async function syncToCloud(data) {
  // TODO: 接入云数据库（如 Firebase、Supabase 等）
  console.log('Cloud sync: not configured');
}

async function syncFromCloud() {
  // TODO: 从云端拉取数据
  console.log('Cloud sync: not configured');
  return null;
}

// ===== Tab Navigation =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'summary') renderSummary();
    if (btn.dataset.tab === 'vital') renderVitalHistory();
  });
});

// ===== Exchange Tab =====
// Set defaults
document.getElementById('exDate').value = todayStr();
document.getElementById('exTime').value = nowTimeStr();
updateExSeqNum();

document.getElementById('exDate').addEventListener('change', () => {
  updateExSeqNum();
});

function updateExSeqNum() {
  const date = document.getElementById('exDate').value;
  const seq = getNextSeqNum(date);
  document.getElementById('exSeqNum').textContent = '第 ' + seq + ' 次';
}

// Real-time calculations
['inWeight', 'inTare', 'outWeight', 'outTare'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateCalculatedFields);
});

function updateCalculatedFields() {
  const iw = parseFloat(document.getElementById('inWeight').value) || 0;
  const it = parseFloat(document.getElementById('inTare').value) || 0;
  const ow = parseFloat(document.getElementById('outWeight').value) || 0;
  const ot = parseFloat(document.getElementById('outTare').value) || 0;

  const actualIn = iw - it;
  const actualOut = ow - ot;
  const uf = actualOut - actualIn;

  const inEl = document.getElementById('calcInVol');
  const outEl = document.getElementById('calcOutVol');
  const ufEl = document.getElementById('calcUF');

  inEl.textContent = iw > 0 ? actualIn + ' g' : '-- g';
  outEl.textContent = ow > 0 ? actualOut + ' g' : '-- g';

  if (iw > 0 && ow > 0) {
    ufEl.textContent = uf + ' ml';
    ufEl.className = 'uf-display ' + (uf > 0 ? 'positive' : uf < 0 ? 'negative' : 'zero');
    ufEl.innerHTML = uf + ' ml<span class="uf-label">' + (uf > 0 ? '（脱水）' : uf < 0 ? '（蓄水）' : '（持平）') + '</span>';
  } else {
    ufEl.textContent = '-- ml';
    ufEl.className = 'uf-display zero';
  }

  // Check abnormal color
  updateColorAlert();
}

document.querySelectorAll('input[name="fluidColor"]').forEach(r => {
  r.addEventListener('change', updateColorAlert);
});

function updateColorAlert() {
  const color = document.querySelector('input[name="fluidColor"]:checked');
  const alertEl = document.getElementById('colorAlert');
  if (color && (color.value === '浑浊' || color.value === '血性')) {
    alertEl.classList.remove('hidden');
    alertEl.textContent = '⚠ 警告：透析液颜色异常（' + color.value + '）！请及时联系医生。';
  } else {
    alertEl.classList.add('hidden');
  }
}

// Save Exchange
document.getElementById('saveExchangeBtn').addEventListener('click', () => {
  const date = document.getElementById('exDate').value;
  const time = document.getElementById('exTime').value;
  const concentration = (document.querySelector('input[name="concentration"]:checked') || {}).value || '2.5%';
  const inWeight = parseFloat(document.getElementById('inWeight').value);
  const inTare = parseFloat(document.getElementById('inTare').value) || 0;
  const outWeight = parseFloat(document.getElementById('outWeight').value);
  const outTare = parseFloat(document.getElementById('outTare').value) || 0;
  const color = (document.querySelector('input[name="fluidColor"]:checked') || {}).value || '清亮';
  const note = document.getElementById('exNote').value.trim();

  if (!date || !time) { showToast('请填写日期和时间'); return; }
  if (isNaN(inWeight) || isNaN(outWeight)) { showToast('请填写灌入量和引流量'); return; }

  const seqNum = getNextSeqNum(date);
  const record = {
    id: generateId(),
    date, seqNum, time, concentration,
    inWeight, inTare, outWeight, outTare, color, note
  };

  const records = getExchangeRecords();
  records.push(record);
  setExchangeRecords(records);

  syncToCloud({ type: 'exchange', action: 'add', record });

  // Reset form
  document.getElementById('inWeight').value = '';
  document.getElementById('outWeight').value = '';
  document.getElementById('exNote').value = '';
  document.getElementById('exTime').value = nowTimeStr();
  updateExSeqNum();
  updateCalculatedFields();

  renderTodayExchanges();
  showToast('换液记录已保存');
});

// Render today's exchanges
function renderTodayExchanges() {
  const today = todayStr();
  const recs = getDayExchanges(today);
  const list = document.getElementById('todayExchangeList');

  // Update progress
  const totalUF = recs.reduce((s, r) => s + calcUF(r), 0);
  document.getElementById('todayProgressText').textContent = '今日已完成 ' + recs.length + '/4 次换液';
  document.getElementById('todayProgressBar').style.width = Math.min(recs.length / 4 * 100, 100) + '%';
  document.getElementById('todayTotalUF').textContent = totalUF;
  document.getElementById('todayTotalUF').style.color = totalUF >= 0 ? '#27ae60' : '#e74c3c';
  document.getElementById('todayExchangeCount').textContent = recs.length;

  if (recs.length === 0) {
    list.innerHTML = '<div class="text-center text-muted" style="padding:20px;">暂无今日记录</div>';
    return;
  }

  list.innerHTML = recs.map(r => {
    const uf = calcUF(r);
    const badgeClass = r.color === '清亮' ? 'badge-clear' : r.color === '淡黄' ? 'badge-yellow' : r.color === '浑浊' ? 'badge-turbid' : 'badge-bloody';
    return `<div class="record-card">
      <div class="rc-header">
        <span class="rc-time">第${r.seqNum}次 ${r.time}</span>
        <span class="rc-badge ${badgeClass}">${r.color}</span>
      </div>
      <div class="rc-body">
        <span>浓度: ${r.concentration}</span>
        <span>灌入: ${calcActualIn(r)}g</span>
        <span>引出: ${calcActualOut(r)}g</span>
        <span class="rc-uf ${uf >= 0 ? 'positive' : 'negative'}">超滤: ${uf > 0 ? '+' : ''}${uf}ml</span>
      </div>
      ${r.note ? '<div class="text-sm text-muted mt-12">备注: ' + r.note + '</div>' : ''}
      <div class="rc-actions">
        <button class="btn btn-danger btn-sm" onclick="deleteExchange('${r.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
}

// History exchanges
document.getElementById('historyDate').addEventListener('change', () => {
  renderHistoryExchanges();
});

function renderHistoryExchanges() {
  const date = document.getElementById('historyDate').value;
  const list = document.getElementById('historyExchangeList');
  if (!date) { list.innerHTML = ''; return; }
  const recs = getDayExchanges(date);
  if (recs.length === 0) {
    list.innerHTML = '<div class="text-center text-muted" style="padding:20px;">该日无记录</div>';
    return;
  }
  const totalUF = recs.reduce((s, r) => s + calcUF(r), 0);
  let html = `<div class="alert alert-info">${formatDateCN(date)} 共 ${recs.length} 次换液，累计超滤 ${totalUF} ml</div>`;
  html += recs.map(r => {
    const uf = calcUF(r);
    const badgeClass = r.color === '清亮' ? 'badge-clear' : r.color === '淡黄' ? 'badge-yellow' : r.color === '浑浊' ? 'badge-turbid' : 'badge-bloody';
    return `<div class="record-card">
      <div class="rc-header">
        <span class="rc-time">第${r.seqNum}次 ${r.time}</span>
        <span class="rc-badge ${badgeClass}">${r.color}</span>
      </div>
      <div class="rc-body">
        <span>浓度: ${r.concentration}</span>
        <span>灌入: ${calcActualIn(r)}g</span>
        <span>引出: ${calcActualOut(r)}g</span>
        <span class="rc-uf ${uf >= 0 ? 'positive' : 'negative'}">超滤: ${uf > 0 ? '+' : ''}${uf}ml</span>
      </div>
      ${r.note ? '<div class="text-sm text-muted mt-12">备注: ' + r.note + '</div>' : ''}
      <div class="rc-actions">
        <button class="btn btn-danger btn-sm" onclick="deleteExchange('${r.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
  list.innerHTML = html;
}

// Delete exchange
async function deleteExchange(id) {
  const ok = await showConfirm('删除记录', '确定要删除这条换液记录吗？');
  if (!ok) return;
  const records = getExchangeRecords().filter(r => r.id !== id);
  setExchangeRecords(records);
  renderTodayExchanges();
  renderHistoryExchanges();
  showToast('记录已删除');
}

// ===== Vital Tab =====
document.getElementById('vtDate').value = todayStr();
document.getElementById('vtDate').addEventListener('change', () => {
  updateVitalAutoFields();
  loadVitalForm();
});

['vtUrine', 'vtWaterIntake'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateVitalWaterBalance);
});

function updateVitalAutoFields() {
  const date = document.getElementById('vtDate').value;
  if (!date) return;
  const totalUF = getDayTotalUF(date);
  document.getElementById('vtTotalUF').innerHTML = totalUF + ' ml <span class="auto-tag">自动</span>';
  updateVitalWaterBalance();
}

function updateVitalWaterBalance() {
  const waterIntake = parseFloat(document.getElementById('vtWaterIntake').value) || 0;
  const urine = parseFloat(document.getElementById('vtUrine').value) || 0;
  const date = document.getElementById('vtDate').value;
  const totalUF = date ? getDayTotalUF(date) : 0;
  const balance = waterIntake + totalUF - urine;

  const el = document.getElementById('vtWaterBalance');
  el.className = 'wb-display ' + (balance > 200 ? 'positive' : balance < 0 ? 'negative' : 'zero');
  el.textContent = balance + ' ml';
  if (balance > 200) {
    el.textContent = balance + ' ml（蓄水偏多，注意！）';
  }
}

// Load vital form if exists
function loadVitalForm() {
  const date = document.getElementById('vtDate').value;
  if (!date) return;
  const rec = getVitalRecords().find(r => r.date === date);
  if (rec) {
    document.getElementById('morningSys').value = rec.morningSys || '';
    document.getElementById('morningDia').value = rec.morningDia || '';
    document.getElementById('eveningSys').value = rec.eveningSys || '';
    document.getElementById('eveningDia').value = rec.eveningDia || '';
    document.getElementById('vtWeight').value = rec.weight || '';
    document.getElementById('vtUrine').value = rec.urine || '';
    document.getElementById('vtWaterIntake').value = rec.waterIntake || '';
    document.getElementById('vtSymptom').value = rec.otherSymptom || '';
  }
  updateVitalAutoFields();
}

// Save vital
document.getElementById('saveVitalBtn').addEventListener('click', () => {
  const date = document.getElementById('vtDate').value;
  if (!date) { showToast('请选择日期'); return; }

  const record = {
    id: generateId(),
    date,
    morningSys: parseInt(document.getElementById('morningSys').value) || 0,
    morningDia: parseInt(document.getElementById('morningDia').value) || 0,
    eveningSys: parseInt(document.getElementById('eveningSys').value) || 0,
    eveningDia: parseInt(document.getElementById('eveningDia').value) || 0,
    weight: parseFloat(document.getElementById('vtWeight').value) || 0,
    urine: parseInt(document.getElementById('vtUrine').value) || 0,
    waterIntake: parseInt(document.getElementById('vtWaterIntake').value) || 0,
    otherSymptom: document.getElementById('vtSymptom').value.trim()
  };

  const records = getVitalRecords();
  const idx = records.findIndex(r => r.date === date);
  if (idx >= 0) {
    record.id = records[idx].id;
    records[idx] = record;
  } else {
    records.push(record);
  }
  setVitalRecords(records);

  syncToCloud({ type: 'vital', action: idx >= 0 ? 'update' : 'add', record });

  renderVitalHistory();
  showToast('体征记录已保存');
});

// Render vital history
function renderVitalHistory() {
  const records = getVitalRecords().sort((a, b) => b.date.localeCompare(a.date));
  const list = document.getElementById('vitalHistoryList');
  if (records.length === 0) {
    list.innerHTML = '<div class="text-center text-muted" style="padding:20px;">暂无体征记录</div>';

function renderSummary() {
  const [start, end] = getDateRange(currentRangeType);

  // Filter records
  const exchangeRecs = getExchangeRecords().filter(r => r.date >= start && r.date <= end);
  const vitalRecs = getVitalRecords().filter(r => r.date >= start && r.date <= end);

  // Generate date list
  const dates = [];
  const d = parseDate(start);
  const endDate = parseDate(end);
  while (d <= endDate) {
    dates.push(dateToStr(d));
    d.setDate(d.getDate() + 1);
  }

  // BP stats
  const bps = [];
  vitalRecs.forEach(r => {
    if (r.morningSys && r.morningDia) bps.push({ sys: r.morningSys, dia: r.morningDia });
    if (r.eveningSys && r.eveningDia) bps.push({ sys: r.eveningSys, dia: r.eveningDia });
  });
  if (bps.length > 0) {
    const avgSys = Math.round(bps.reduce((s, b) => s + b.sys, 0) / bps.length);
    const avgDia = Math.round(bps.reduce((s, b) => s + b.dia, 0) / bps.length);
    const maxSys = Math.max(...bps.map(b => b.sys));
    const minSys = Math.min(...bps.map(b => b.sys));
    document.getElementById('sumAvgBP').textContent = avgSys + '/' + avgDia;
    document.getElementById('sumBPRange').textContent = minSys + '-' + maxSys;
  } else {
    document.getElementById('sumAvgBP').textContent = '--';
    document.getElementById('sumBPRange').textContent = '--';
  }

  // Avg daily UF
  const ufByDay = {};
  exchangeRecs.forEach(r => {
    if (!ufByDay[r.date]) ufByDay[r.date] = 0;
    ufByDay[r.date] += calcUF(r);
  });
  const ufDays = Object.keys(ufByDay);
  const avgUF = ufDays.length > 0 ? Math.round(ufDays.reduce((s, d) => s + ufByDay[d], 0) / ufDays.length) : 0;
  document.getElementById('sumAvgUF').textContent = ufDays.length > 0 ? avgUF : '--';

  // Avg urine
  const urineRecords = vitalRecs.filter(r => r.urine > 0);
  const avgUrine = urineRecords.length > 0 ? Math.round(urineRecords.reduce((s, r) => s + r.urine, 0) / urineRecords.length) : 0;
  document.getElementById('sumAvgUrine').textContent = urineRecords.length > 0 ? avgUrine : '--';

  // Weight change
  const weightRecords = vitalRecs.filter(r => r.weight > 0).sort((a, b) => a.date.localeCompare(b.date));
  if (weightRecords.length >= 2) {
    const first = weightRecords[0].weight;
    const last = weightRecords[weightRecords.length - 1].weight;
    const change = (last - first).toFixed(1);
    document.getElementById('sumWeightChange').textContent = (change > 0 ? '+' : '') + change;
    document.getElementById('sumWeightChange').parentElement.className = 'summary-card ' + (change > 1 ? 'warning' : change < -1 ? 'good' : '');
  } else {
    document.getElementById('sumWeightChange').textContent = '--';
  }

  // Total exchanges
  document.getElementById('sumTotalExchanges').textContent = exchangeRecs.length || '--';

  // Draw charts
  drawBPChart(dates, vitalRecs);
  drawUFChart(dates, ufByDay);
  drawWeightChart(dates, vitalRecs);
  drawWaterBalanceChart(dates, vitalRecs, ufByDay);
}

// ===== Canvas Charts =====
function getCanvasCtx(canvasId) {
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 200 * dpr;
  canvas.style.height = '200px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w: rect.width, h: 200 };
}

function drawBPChart(dates, vitalRecs) {
  const { ctx, w, h } = getCanvasCtx('chartBP');
  ctx.clearRect(0, 0, w, h);
  const pad = { top: 20, right: 15, bottom: 35, left: 40 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  // Build data
  const data = dates.map(date => {
    const rec = vitalRecs.find(r => r.date === date);
    return {
      date,
      mSys: rec ? rec.morningSys : null,
      mDia: rec ? rec.morningDia : null,
      eSys: rec ? rec.eveningSys : null,
      eDia: rec ? rec.eveningDia : null
    };
  });

  const allVals = [];
  data.forEach(d => {
    if (d.mSys) allVals.push(d.mSys);
    if (d.mDia) allVals.push(d.mDia);
    if (d.eSys) allVals.push(d.eSys);
    if (d.eDia) allVals.push(d.eDia);
  });
  if (allVals.length === 0) { drawNoData(ctx, w, h); return; }

  const minV = Math.min(...allVals) - 10;
  const maxV = Math.max(...allVals) + 10;
  const range = maxV - minV || 1;

  // Grid
  ctx.strokeStyle = '#e8ecf0';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#999';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + ch - (ch * i / 4);
    const val = Math.round(minV + range * i / 4);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillText(val, pad.left - 4, y + 3);
  }

  // X labels
  ctx.textAlign = 'center';
  ctx.font = '9px sans-serif';
  const step = Math.max(1, Math.floor(data.length / 7));
  data.forEach((d, i) => {
    if (i % step === 0 || i === data.length - 1) {
      const x = pad.left + (cw * i / Math.max(data.length - 1, 1));
      ctx.fillText(d.date.slice(5), x, h - 8);
    }
  });

  // Draw lines
  function drawLine(getter, color, dashed) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash(dashed ? [4, 3] : []);
    ctx.beginPath();
    let started = false;
    data.forEach((d, i) => {
      const val = getter(d);
      if (val !== null) {
        const x = pad.left + (cw * i / Math.max(data.length - 1, 1));
        const y = pad.top + ch - (ch * (val - minV) / range);
        if (!started) { ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
    });
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawLine(d => d.mSys, '#e74c3c', false);
  drawLine(d => d.mDia, '#e74c3c', true);
  drawLine(d => d.eSys, '#3498db', false);
  drawLine(d => d.eDia, '#3498db', true);

  // Legend
  ctx.font = '9px sans-serif';
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(pad.left, 4, 12, 2);
  ctx.fillText('晨血压', pad.left + 16, 8);
  ctx.fillStyle = '#3498db';
  ctx.fillRect(pad.left + 60, 4, 12, 2);
  ctx.fillText('晚血压', pad.left + 76, 8);
}

function drawUFChart(dates, ufByDay) {
  const { ctx, w, h } = getCanvasCtx('chartUF');
  ctx.clearRect(0, 0, w, h);
  const pad = { top: 20, right: 15, bottom: 35, left: 45 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  const data = dates.map(d => ({ date: d, uf: ufByDay[d] || 0 }));
  if (data.every(d => d.uf === 0)) { drawNoData(ctx, w, h); return; }

  const maxVal = Math.max(Math.abs(Math.min(...data.map(d => d.uf))), Math.abs(Math.max(...data.map(d => d.uf))), 100);
  const barW = Math.min(30, cw / data.length * 0.7);
  const gap = cw / data.length;

  // Zero line
  const zeroY = pad.top + ch / 2;
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, zeroY);
  ctx.lineTo(w - pad.right, zeroY);
  ctx.stroke();

  // Grid
  ctx.fillStyle = '#999';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  [maxVal, maxVal / 2, 0, -maxVal / 2, -maxVal].forEach(val => {
    const y = pad.top + ch / 2 - (ch / 2 * val / maxVal);
    ctx.fillText(Math.round(val), pad.left - 4, y + 3);
    if (val !== 0) {
      ctx.strokeStyle = '#f0f2f5';
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
    }
  });

  // Bars
  data.forEach((d, i) => {
    const x = pad.left + gap * i + gap / 2 - barW / 2;
    const barH = (d.uf / maxVal) * (ch / 2);
    ctx.fillStyle = d.uf >= 0 ? '#27ae60' : '#e74c3c';
    ctx.fillRect(x, d.uf >= 0 ? zeroY - barH : zeroY, barW, Math.abs(barH));

    // X label
    ctx.fillStyle = '#999';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    if (data.length <= 14 || i % 2 === 0) {
      ctx.fillText(d.date.slice(5), pad.left + gap * i + gap / 2, h - 8);
    }
  });
}

function drawWeightChart(dates, vitalRecs) {
  const { ctx, w, h } = getCanvasCtx('chartWeight');
  ctx.clearRect(0, 0, w, h);
  const pad = { top: 20, right: 15, bottom: 35, left: 45 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  const data = dates.map(date => {
    const rec = vitalRecs.find(r => r.date === date);
    return { date, weight: rec && rec.weight ? rec.weight : null };
  }).filter(d => d.weight !== null);

  if (data.length === 0) { drawNoData(ctx, w, h); return; }

  const weights = data.map(d => d.weight);
  const minW = Math.min(...weights) - 1;
  const maxW = Math.max(...weights) + 1;
  const range = maxW - minW || 1;

  // Grid
  ctx.strokeStyle = '#e8ecf0';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#999';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + ch - (ch * i / 4);
    const val = (minW + range * i / 4).toFixed(1);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillText(val, pad.left - 4, y + 3);
  }

  // Line
  ctx.strokeStyle = '#8e44ad';
  ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((d, i) => {
    const x = pad.left + (cw * i / Math.max(data.length - 1, 1));
    const y = pad.top + ch - (ch * (d.weight - minW) / range);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Dots and labels
  data.forEach((d, i) => {
    const x = pad.left + (cw * i / Math.max(data.length - 1, 1));
    const y = pad.top + ch - (ch * (d.weight - minW) / range);
    ctx.fillStyle = '#8e44ad';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fill();

    // X label
    ctx.fillStyle = '#999';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.date.slice(5), x, h - 8);

    // Value label
    if (data.length <= 14) {
      ctx.fillStyle = '#8e44ad';
      ctx.font = '9px sans-serif';
      ctx.fillText(d.weight.toFixed(1), x, y - 8);
    }
  });
}

function drawWaterBalanceChart(dates, vitalRecs, ufByDay) {
  const { ctx, w, h } = getCanvasCtx('chartWaterBalance');
  ctx.clearRect(0, 0, w, h);
  const pad = { top: 20, right: 15, bottom: 35, left: 40 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  const data = dates.map(date => {
    const rec = vitalRecs.find(r => r.date === date);
    return {
      date,
      water: rec && rec.waterIntake ? rec.waterIntake : 0,
      urine: rec && rec.urine ? rec.urine : 0
    };
  });

  const maxVal = Math.max(...data.map(d => Math.max(d.water, d.urine)), 100);
  const barW = Math.min(18, cw / data.length * 0.35);
  const gap = cw / data.length;

  // Grid
  ctx.strokeStyle = '#e8ecf0';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#999';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + ch - (ch * i / 4);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillText(Math.round(maxVal * i / 4), pad.left - 4, y + 3);
  }

  // Bars (grouped)
  data.forEach((d, i) => {
    const cx = pad.left + gap * i + gap / 2;

    // Water bar
    const wh = (d.water / maxVal) * ch;
    ctx.fillStyle = '#3498db';
    ctx.fillRect(cx - barW - 2, pad.top + ch - wh, barW, wh);

    // Urine bar
    const uh = (d.urine / maxVal) * ch;
    ctx.fillStyle = '#f39c12';
    ctx.fillRect(cx + 2, pad.top + ch - uh, barW, uh);

    // X label
    ctx.fillStyle = '#999';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    if (data.length <= 14 || i % 2 === 0) {
      ctx.fillText(d.date.slice(5), cx, h - 8);
    }
  });

  // Legend
  ctx.font = '9px sans-serif';
  ctx.fillStyle = '#3498db';
  ctx.fillRect(pad.left, 4, 12, 10);
  ctx.fillStyle = '#3498db';
  ctx.textAlign = 'left';
  ctx.fillText('饮水', pad.left + 16, 12);
  ctx.fillStyle = '#f39c12';
  ctx.fillRect(pad.left + 55, 4, 12, 10);
  ctx.fillStyle = '#f39c12';
  ctx.fillText('尿量', pad.left + 71, 12);
}

function drawNoData(ctx, w, h) {
  ctx.fillStyle = '#ccc';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('暂无数据', w / 2, h / 2);
}

// ===== Download Helper =====
function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
