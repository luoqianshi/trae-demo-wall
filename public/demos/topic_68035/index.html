<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCL-GA Pixel Mentor - Web Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #252526;
            color: #ccc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #3c3c3c;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1e1e1e;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .toolbar {
            width: 160px;
            background: #2d2d30;
            padding: 8px;
            overflow-y: auto;
            border-right: 1px solid #1e1e1e;
        }

        .tool-group {
            margin-bottom: 12px;
        }

        .tool-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #888;
            margin-bottom: 4px;
            padding-left: 2px;
        }

        .tool-btn {
            width: 100%;
            padding: 6px 8px;
            margin-bottom: 2px;
            border: none;
            border-radius: 3px;
            background: #3c3c3c;
            color: #ccc;
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
        }

        .tool-btn:hover {
            background: #4a4a4d;
        }

        .tool-btn.active {
            background: #007acc;
            color: #fff;
        }

        .separator {
            height: 1px;
            background: #1e1e1e;
            margin: 8px 0;
        }

        .tool-options {
            margin-top: 8px;
            padding: 8px;
            background: #333;
            border-radius: 3px;
        }

        .option-row {
            margin-bottom: 6px;
        }

        .option-row label {
            display: block;
            font-size: 10px;
            color: #888;
            margin-bottom: 2px;
        }

        .option-row input[type="range"] {
            width: 100%;
            height: 4px;
            background: #444;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .option-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #007acc;
            border-radius: 50%;
            cursor: pointer;
        }

        .option-value {
            font-size: 10px;
            color: #aaa;
            font-family: Consolas, monospace;
            text-align: right;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
            overflow: hidden;
            position: relative;
        }

        #canvas {
            background: #2d2d30;
            border: 1px solid #3c3c3c;
            image-rendering: pixelated;
            cursor: crosshair;
        }

        .checkerboard {
            background-image: 
                linear-gradient(45deg, #3c3c3c 25%, transparent 25%),
                linear-gradient(-45deg, #3c3c3c 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #3c3c3c 75%),
                linear-gradient(-45deg, transparent 75%, #3c3c3c 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #2d2d30;
        }

        .right-panel {
            width: 220px;
            background: #2d2d30;
            padding: 8px;
            overflow-y: auto;
            border-left: 1px solid #1e1e1e;
            display: flex;
            flex-direction: column;
        }

        .panel-section {
            margin-bottom: 12px;
        }

        .panel-section label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #888;
            margin-bottom: 4px;
        }

        .color-picker {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .color-btn {
            width: 24px;
            height: 24px;
            border: 2px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .color-btn:hover {
            border-color: #888;
        }

        .color-btn.active {
            border-color: #007acc;
        }

        .color-input-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .color-input-row input[type="color"] {
            width: 32px;
            height: 28px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .color-input-row input[type="text"] {
            flex: 1;
            padding: 4px 6px;
            background: #3c3c3c;
            border: 1px solid #1e1e1e;
            border-radius: 3px;
            color: #ccc;
            font-size: 11px;
            font-family: Consolas, monospace;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px;
        }

        .palette-color {
            width: 100%;
            padding-bottom: 100%;
            background: #444;
            border: 1px solid #1e1e1e;
            border-radius: 2px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .palette-color:hover {
            transform: scale(1.1);
            z-index: 1;
        }

        .resolution-row {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }

        .resolution-row input[type="number"] {
            flex: 1;
            padding: 4px 6px;
            background: #3c3c3c;
            border: 1px solid #1e1e1e;
            border-radius: 3px;
            color: #ccc;
            font-size: 11px;
            font-family: Consolas, monospace;
        }

        .resolution-row button {
            padding: 4px 12px;
            background: #007acc;
            border: none;
            border-radius: 3px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
        }

        .preset-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .preset-btn {
            padding: 4px 8px;
            background: #3c3c3c;
            border: 1px solid #1e1e1e;
            border-radius: 3px;
            color: #ccc;
            font-size: 10px;
            font-family: Consolas, monospace;
            cursor: pointer;
        }

        .preset-btn:hover {
            background: #4a4a4d;
        }

        .status-bar {
            background: #007acc;
            padding: 4px 16px;
            display: flex;
            gap: 20px;
            font-size: 11px;
            color: #fff;
            border-top: 1px solid #005a9e;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-label {
            color: rgba(255,255,255,0.7);
        }

        .scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: #2d2d30;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #4a4a4d;
            border-radius: 3px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: #5a5a5d;
        }

        .brush-preview {
            width: 64px;
            height: 64px;
            background: #3c3c3c;
            border-radius: 3px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brush-grid {
            display: grid;
            gap: 1px;
            background: #2d2d30;
            padding: 2px;
        }

        .brush-cell {
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖌 SCL-GA Pixel Mentor</h1>
        <div style="display: flex; gap: 8px;">
            <button onclick="openImage()" style="padding: 4px 12px; background: #007acc; border: none; border-radius: 3px; color: #fff; font-size: 12px; cursor: pointer;">Open</button>
            <button onclick="exportPNG()" style="padding: 4px 12px; background: #3c3c3c; border: none; border-radius: 3px; color: #ccc; font-size: 12px; cursor: pointer;">Export PNG</button>
        </div>
    </div>

    <div class="main-container">
        <div class="toolbar scrollbar">
            <div class="tool-group">
                <label>Selection</label>
                <button class="tool-btn" onclick="setTool('select')">▢ Select</button>
                <button class="tool-btn" onclick="setTool('move')">✋ Move</button>
                <button class="tool-btn" onclick="setTool('magic_wand')">🪄 Magic Wand</button>
                <button class="tool-btn" onclick="setTool('lasso')">🪢 Lasso</button>
            </div>

            <div class="separator"></div>

            <div class="tool-group">
                <label>Painting</label>
                <button class="tool-btn active" onclick="setTool('brush')">🖌 Pen</button>
                <button class="tool-btn" onclick="setTool('eraser')">🧽 Eraser</button>
                <button class="tool-btn" onclick="setTool('transparent')">🕳 Void</button>
                <button class="tool-btn" onclick="setTool('fill')">🪣 Fill</button>
                <button class="tool-btn" onclick="setTool('picker')">🎯 Picker</button>
            </div>

            <div class="separator"></div>

            <div class="tool-group">
                <label>Shapes</label>
                <button class="tool-btn" onclick="setTool('line')">📏 Line</button>
                <button class="tool-btn" onclick="setTool('rect')">⬜ Rectangle</button>
                <button class="tool-btn" onclick="setTool('ellipse')">⭕ Ellipse</button>
            </div>

            <div class="separator"></div>

            <div class="tool-group">
                <label>Cleanup</label>
                <button class="tool-btn" onclick="setTool('bg_remove')">🧹 BG Remove</button>
                <button class="tool-btn" onclick="setTool('color_replace')">🔄 Replace Color</button>
            </div>

            <div class="separator"></div>

            <div class="tool-options">
                <div class="brush-preview" id="brushPreview"></div>
                <div class="option-row">
                    <label>Brush Size</label>
                    <input type="range" id="brushSize" min="1" max="32" value="1" oninput="updateBrushSize(this.value)">
                    <div class="option-value" id="brushSizeValue">1×1</div>
                </div>
                <div class="option-row">
                    <label>Tolerance</label>
                    <input type="range" id="tolerance" min="0" max="255" value="32" oninput="updateTolerance(this.value)">
                    <div class="option-value" id="toleranceValue">32</div>
                </div>
            </div>

            <div class="separator"></div>

            <div class="tool-group">
                <label>History</label>
                <button class="tool-btn" onclick="undo()">↩ Undo (Ctrl+Z)</button>
                <button class="tool-btn" onclick="redo()">↪ Redo (Ctrl+Y)</button>
            </div>
        </div>

        <div class="canvas-container" oncontextmenu="return false;">
            <canvas id="canvas" class="checkerboard"></canvas>
        </div>

        <div class="right-panel scrollbar">
            <div class="panel-section">
                <label>Colors</label>
                <div class="color-picker">
                    <button class="color-btn active" id="primaryColor" style="background: #000000;" onclick="setPrimary()"></button>
                    <button class="color-btn" id="secondaryColor" style="background: #ffffff;" onclick="setSecondary()"></button>
                </div>
                <div class="color-input-row">
                    <input type="color" id="colorPicker" value="#000000" onchange="updateColor(this.value)">
                    <input type="text" id="hexInput" value="#000000" onchange="updateColor(this.value)">
                </div>
            </div>

            <div class="panel-section">
                <label>Palette</label>
                <div class="palette-grid" id="paletteGrid"></div>
            </div>

            <div class="panel-section">
                <label>Resolution</label>
                <div class="resolution-row">
                    <input type="number" id="widthInput" value="64" min="1" max="8192">
                    <span style="color: #888;">×</span>
                    <input type="number" id="heightInput" value="64" min="1" max="8192">
                    <button onclick="resizeCanvas()">Apply</button>
                </div>
                <div class="preset-btns">
                    <button class="preset-btn" onclick="setResolution(32, 32)">32×32</button>
                    <button class="preset-btn" onclick="setResolution(64, 64)">64×64</button>
                    <button class="preset-btn" onclick="setResolution(128, 128)">128×128</button>
                    <button class="preset-btn" onclick="setResolution(256, 256)">256×256</button>
                    <button class="preset-btn" onclick="setResolution(512, 512)">512×512</button>
                    <button class="preset-btn" onclick="setResolution(64, 36)">64×36</button>
                </div>
            </div>

            <div class="panel-section">
                <label>Zoom</label>
                <div class="preset-btns">
                    <button class="preset-btn" onclick="setZoom(25)">25%</button>
                    <button class="preset-btn" onclick="setZoom(50)">50%</button>
                    <button class="preset-btn active" onclick="setZoom(100)">100%</button>
                    <button class="preset-btn" onclick="setZoom(200)">200%</button>
                    <button class="preset-btn" onclick="setZoom(400)">400%</button>
                    <button class="preset-btn" onclick="setZoom(800)">800%</button>
                </div>
            </div>

            <div class="panel-section">
                <label>Settings</label>
                <label style="font-weight: normal; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
                    <input type="checkbox" id="gridToggle" checked onchange="toggleGrid()"> Grid
                </label>
            </div>

            <div class="panel-section">
                <label>Info</label>
                <div style="font-size: 10px; color: #888; font-family: Consolas;">
                    <div>Size: <span id="canvasSize">64×64</span></div>
                    <div>Zoom: <span id="zoomValue">100%</span></div>
                    <div>Colors: <span id="colorCount">1</span></div>
                    <div>History: <span id="historyCount">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">Tool:</span>
            <span id="statusTool">Pen</span>
        </div>
        <div class="status-item">
            <span class="status-label">Canvas:</span>
            <span id="statusCanvas">64×64</span>
        </div>
        <div class="status-item">
            <span class="status-label">Zoom:</span>
            <span id="statusZoom">100%</span>
        </div>
        <div class="status-item">
            <span class="status-label">Mouse:</span>
            <span id="statusMouse">0, 0</span>
        </div>
        <div class="status-item">
            <span class="status-label">RGBA:</span>
            <span id="statusRGBA">0, 0, 0, 255</span>
        </div>
        <div class="status-item">
            <span class="status-label">HEX:</span>
            <span id="statusHEX">#000000</span>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="loadImage(this)">

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let width = 64;
        let height = 64;
        let zoom = 16;
        let gridVisible = true;
        let currentTool = 'brush';
        let brushSize = 1;
        let tolerance = 32;
        let primaryColor = '#000000';
        let secondaryColor = '#ffffff';
        let isDrawing = false;
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let offset = { x: 0, y: 0 };
        let mousePos = { x: 0, y: 0 };
        let pixelPos = { x: 0, y: 0 };
        let history = [];
        let historyIndex = -1;
        let selection = null;
        let lassoPoints = [];
        let dragStart = null;
        let isSpacePressed = false;

        const PALETTE = [
            '#000000', '#ffffff', '#ff0000', '#00ff00', '#0000ff', '#ffff00',
            '#ff00ff', '#00ffff', '#ff6600', '#9900ff', '#0099ff', '#99ff00',
            '#ff0099', '#666666', '#cccccc', '#333333'
        ];

        function init() {
            createCanvas(width, height);
            drawPalette();
            updateBrushPreview();
            updateStatus();
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);
            canvas.addEventListener('wheel', handleWheel);
        }

        function createCanvas(w, h) {
            canvas.width = w;
            canvas.height = h;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);
            pushHistory();
            updateInfo();
        }

        function drawPalette() {
            const grid = document.getElementById('paletteGrid');
            grid.innerHTML = '';
            PALETTE.forEach(color => {
                const el = document.createElement('div');
                el.className = 'palette-color';
                el.style.background = color;
                el.onclick = () => {
                    updateColor(color);
                };
                grid.appendChild(el);
            });
        }

        function updateBrushPreview() {
            const preview = document.getElementById('brushPreview');
            const size = Math.min(brushSize, 8);
            const gridSize = size * 6;
            preview.innerHTML = `
                <div class="brush-grid" style="grid-template-columns: repeat(${size}, 1fr);">
                    ${Array(size * size).fill('<div class="brush-cell"></div>').join('')}
                </div>
            `;
        }

        function updateBrushSize(value) {
            brushSize = parseInt(value);
            document.getElementById('brushSizeValue').textContent = `${brushSize}×${brushSize}`;
            updateBrushPreview();
        }

        function updateTolerance(value) {
            tolerance = parseInt(value);
            document.getElementById('toleranceValue').textContent = tolerance;
        }

        function updateColor(color) {
            if (!color.startsWith('#')) color = '#' + color;
            primaryColor = color;
            document.getElementById('colorPicker').value = color;
            document.getElementById('hexInput').value = color.toUpperCase();
            document.getElementById('primaryColor').style.background = color;
            updateStatusColor();
        }

        function setPrimary() {
            document.getElementById('colorPicker').value = primaryColor;
            document.getElementById('hexInput').value = primaryColor.toUpperCase();
        }

        function setSecondary() {
            [primaryColor, secondaryColor] = [secondaryColor, primaryColor];
            document.getElementById('primaryColor').style.background = primaryColor;
            document.getElementById('secondaryColor').style.background = secondaryColor;
            document.getElementById('colorPicker').value = primaryColor;
            document.getElementById('hexInput').value = primaryColor.toUpperCase();
            updateStatusColor();
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const toolNames = {
                brush: 'Pen', eraser: 'Eraser', transparent: 'Void', fill: 'Fill',
                picker: 'Picker', line: 'Line', rect: 'Rectangle', ellipse: 'Ellipse',
                select: 'Select', move: 'Move', magic_wand: 'Magic Wand', lasso: 'Lasso',
                bg_remove: 'BG Remove', color_replace: 'Replace Color'
            };
            document.getElementById('statusTool').textContent = toolNames[tool] || tool;
            
            updateCursor();
        }

        function updateCursor() {
            const cursorMap = {
                brush: 'crosshair', eraser: 'crosshair', transparent: 'crosshair',
                fill: 'crosshair', picker: 'crosshair', line: 'crosshair',
                rect: 'crosshair', ellipse: 'crosshair', magic_wand: 'crosshair',
                lasso: 'crosshair', select: 'crosshair',
                move: 'grab', bg_remove: 'crosshair', color_replace: 'crosshair'
            };
            canvas.style.cursor = cursorMap[currentTool] || 'crosshair';
        }

        function handleKeyDown(e) {
            if (e.code === 'Space') {
                isSpacePressed = true;
                canvas.style.cursor = 'grab';
            }
            if (e.ctrlKey && e.code === 'KeyZ') {
                e.preventDefault();
                undo();
            }
            if (e.ctrlKey && e.code === 'KeyY') {
                e.preventDefault();
                redo();
            }
            if (e.code === 'Delete' && selection) {
                deleteSelection();
            }
            if (e.code === 'Escape') {
                selection = null;
                draw();
            }
            const keyMap = {
                'KeyP': 'brush', 'KeyE': 'eraser', 'KeyV': 'transparent',
                'KeyF': 'fill', 'KeyI': 'picker', 'KeyN': 'line',
                'KeyR': 'rect', 'KeyO': 'ellipse', 'KeyW': 'magic_wand',
                'KeyL': 'lasso', 'KeyM': 'move', 'KeyS': 'select'
            };
            if (keyMap[e.code]) {
                setTool(keyMap[e.code]);
            }
        }

        function handleKeyUp(e) {
            if (e.code === 'Space') {
                isSpacePressed = false;
                updateCursor();
            }
        }

        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (isSpacePressed || e.button === 1) {
                isPanning = true;
                panStart = { x, y };
                canvas.style.cursor = 'grabbing';
                return;
            }

            const px = Math.floor((x - offset.x) / zoom);
            const py = Math.floor((y - offset.y) / zoom);

            if (px < 0 || px >= width || py < 0 || py >= height) return;

            isDrawing = true;
            dragStart = { x: px, y: py };
            lassoPoints = [{ x: px, y: py }];

            if (currentTool === 'picker') {
                const pixel = ctx.getImageData(px, py, 1, 1).data;
                const color = rgbToHex(pixel[0], pixel[1], pixel[2]);
                updateColor(color);
            } else if (currentTool === 'fill') {
                floodFill(px, py, hexToRgb(primaryColor));
                pushHistory();
                draw();
            } else if (currentTool === 'magic_wand') {
                magicWand(px, py);
                draw();
            } else if (currentTool === 'bg_remove') {
                removeBackground();
                pushHistory();
                draw();
            } else if (currentTool === 'color_replace') {
                const pixel = ctx.getImageData(px, py, 1, 1).data;
                replaceColor(pixel[0], pixel[1], pixel[2]);
                pushHistory();
                draw();
            } else if (currentTool === 'brush' || currentTool === 'eraser' || currentTool === 'transparent') {
                drawBrush(px, py);
            }
        }

        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (isPanning) {
                offset.x += x - panStart.x;
                offset.y += y - panStart.y;
                panStart = { x, y };
                draw();
                return;
            }

            const px = Math.floor((x - offset.x) / zoom);
            const py = Math.floor((y - offset.y) / zoom);

            mousePos = { x, y };
            pixelPos = { x: px, y: py };

            document.getElementById('statusMouse').textContent = `${px}, ${py}`;

            if (px >= 0 && px < width && py >= 0 && py < height) {
                const pixel = ctx.getImageData(px, py, 1, 1).data;
                document.getElementById('statusRGBA').textContent = `${pixel[0]}, ${pixel[1]}, ${pixel[2]}, ${pixel[3]}`;
                document.getElementById('statusHEX').textContent = rgbToHex(pixel[0], pixel[1], pixel[2]).toUpperCase();
            } else {
                document.getElementById('statusRGBA').textContent = '-';
                document.getElementById('statusHEX').textContent = '-';
            }

            if (!isDrawing) return;

            if (currentTool === 'brush' || currentTool === 'eraser' || currentTool === 'transparent') {
                drawBrush(px, py);
            } else if (currentTool === 'lasso') {
                lassoPoints.push({ x: px, y: py });
            }
        }

        function handleMouseUp(e) {
            if (isPanning) {
                isPanning = false;
                canvas.style.cursor = isSpacePressed ? 'grab' : (currentTool === 'move' ? 'grab' : 'crosshair');
                return;
            }

            isDrawing = false;

            if (currentTool === 'line') {
                drawLine(dragStart.x, dragStart.y, pixelPos.x, pixelPos.y);
                pushHistory();
                draw();
            } else if (currentTool === 'rect') {
                drawRect(dragStart.x, dragStart.y, pixelPos.x, pixelPos.y);
                pushHistory();
                draw();
            } else if (currentTool === 'ellipse') {
                drawEllipse(dragStart.x, dragStart.y, pixelPos.x, pixelPos.y);
                pushHistory();
                draw();
            } else if (currentTool === 'select') {
                selection = {
                    x: Math.min(dragStart.x, pixelPos.x),
                    y: Math.min(dragStart.y, pixelPos.y),
                    w: Math.abs(pixelPos.x - dragStart.x) + 1,
                    h: Math.abs(pixelPos.y - dragStart.y) + 1
                };
                draw();
            } else if (currentTool === 'lasso') {
                if (lassoPoints.length > 2) {
                    createLassoSelection();
                }
                draw();
            } else if (currentTool === 'brush' || currentTool === 'eraser' || currentTool === 'transparent') {
                pushHistory();
            }

            dragStart = null;
            lassoPoints = [];
        }

        function handleWheel(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const oldZoom = zoom;
            if (e.deltaY < 0) {
                zoom = Math.min(zoom * 2, 128);
            } else {
                zoom = Math.max(zoom / 2, 4);
            }

            offset.x = x - (x - offset.x) * (zoom / oldZoom);
            offset.y = y - (y - offset.y) * (zoom / oldZoom);

            draw();
            updateInfo();
        }

        function draw() {
            const displayWidth = width * zoom;
            const displayHeight = height * zoom;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.drawImage(canvas, 0, 0);
            ctx.restore();

            if (gridVisible) {
                ctx.strokeStyle = 'rgba(100, 100, 100, 0.3)';
                ctx.lineWidth = 1;
                for (let x = 0; x <= width; x++) {
                    ctx.beginPath();
                    ctx.moveTo(x * zoom, 0);
                    ctx.lineTo(x * zoom, displayHeight);
                    ctx.stroke();
                }
                for (let y = 0; y <= height; y++) {
                    ctx.beginPath();
                    ctx.moveTo(0, y * zoom);
                    ctx.lineTo(displayWidth, y * zoom);
                    ctx.stroke();
                }
            }

            if (selection) {
                ctx.strokeStyle = '#00aaff';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(selection.x * zoom, selection.y * zoom, selection.w * zoom, selection.h * zoom);
                ctx.setLineDash([]);
            }

            if (currentTool === 'brush' || currentTool === 'eraser' || currentTool === 'transparent') {
                drawBrushPreview(pixelPos.x, pixelPos.y);
            }
        }

        function drawBrushPreview(px, py) {
            if (px < 0 || px >= width || py < 0 || py >= height) return;
            
            const half = Math.floor(brushSize / 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 1;
            ctx.setLineDash([2, 2]);
            
            ctx.strokeRect(
                (px - half) * zoom,
                (py - half) * zoom,
                brushSize * zoom,
                brushSize * zoom
            );
            
            if (brushSize > 1) {
                for (let i = 1; i < brushSize; i++) {
                    ctx.beginPath();
                    ctx.moveTo((px - half + i) * zoom, (py - half) * zoom);
                    ctx.lineTo((px - half + i) * zoom, (py - half + brushSize) * zoom);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo((px - half) * zoom, (py - half + i) * zoom);
                    ctx.lineTo((px - half + brushSize) * zoom, (py - half + i) * zoom);
                    ctx.stroke();
                }
            }
            ctx.setLineDash([]);
        }

        function drawBrush(px, py) {
            const half = Math.floor(brushSize / 2);
            let color;
            
            if (currentTool === 'transparent') {
                color = [0, 0, 0, 0];
            } else if (currentTool === 'eraser') {
                color = [255, 255, 255, 255];
            } else {
                const rgb = hexToRgb(primaryColor);
                color = [rgb.r, rgb.g, rgb.b, 255];
            }

            for (let dy = 0; dy < brushSize; dy++) {
                for (let dx = 0; dx < brushSize; dx++) {
                    const x = px + dx - half;
                    const y = py + dy - half;
                    if (x >= 0 && x < width && y >= 0 && y < height) {
                        ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${color[3] / 255})`;
                        ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
                    }
                }
            }
        }

        function drawLine(x1, y1, x2, y2) {
            const rgb = hexToRgb(primaryColor);
            ctx.fillStyle = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);
            const sx = x1 < x2 ? 1 : -1;
            const sy = y1 < y2 ? 1 : -1;
            let err = dx - dy;

            while (true) {
                if (x1 >= 0 && x1 < width && y1 >= 0 && y1 < height) {
                    ctx.fillRect(x1 * zoom, y1 * zoom, zoom, zoom);
                }
                if (x1 === x2 && y1 === y2) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x1 += sx; }
                if (e2 < dx) { err += dx; y1 += sy; }
            }
        }

        function drawRect(x1, y1, x2, y2) {
            const rgb = hexToRgb(primaryColor);
            ctx.fillStyle = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);

            for (let y = minY; y <= maxY; y++) {
                for (let x = minX; x <= maxX; x++) {
                    if (x >= 0 && x < width && y >= 0 && y < height) {
                        ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
                    }
                }
            }
        }

        function drawEllipse(x1, y1, x2, y2) {
            const rgb = hexToRgb(primaryColor);
            ctx.fillStyle = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

            const cx = Math.floor((x1 + x2) / 2);
            const cy = Math.floor((y1 + y2) / 2);
            const rx = Math.abs(x2 - x1) / 2;
            const ry = Math.abs(y2 - y1) / 2;

            for (let y = cy - ry; y <= cy + ry; y++) {
                for (let x = cx - rx; x <= cx + rx; x++) {
                    if (x >= 0 && x < width && y >= 0 && y < height) {
                        const dx = (x - cx) / rx;
                        const dy = (y - cy) / ry;
                        if (dx * dx + dy * dy <= 1) {
                            ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
                        }
                    }
                }
            }
        }

        function floodFill(x, y, color) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            const target = data[(y * width + x) * 4];
            const targetG = data[(y * width + x) * 4 + 1];
            const targetB = data[(y * width + x) * 4 + 2];

            if (target === color.r && targetG === color.g && targetB === color.b) return;

            const stack = [{ x, y }];

            while (stack.length > 0) {
                const { x, y } = stack.pop();
                if (x < 0 || x >= width || y < 0 || y >= height) continue;

                const idx = (y * width + x) * 4;
                if (data[idx] !== target || data[idx + 1] !== targetG || data[idx + 2] !== targetB) continue;

                data[idx] = color.r;
                data[idx + 1] = color.g;
                data[idx + 2] = color.b;
                data[idx + 3] = 255;

                stack.push({ x: x - 1, y });
                stack.push({ x: x + 1, y });
                stack.push({ x, y: y - 1 });
                stack.push({ x, y: y + 1 });
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function magicWand(x, y) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            const targetR = data[(y * width + x) * 4];
            const targetG = data[(y * width + x) * 4 + 1];
            const targetB = data[(y * width + x) * 4 + 2];

            const visited = new Set();
            const stack = [{ x, y }];
            const selected = [];

            while (stack.length > 0) {
                const { x, y } = stack.pop();
                if (x < 0 || x >= width || y < 0 || y >= height) continue;

                const key = `${x},${y}`;
                if (visited.has(key)) continue;
                visited.add(key);

                const idx = (y * width + x) * 4;
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];

                const dist = Math.sqrt(
                    Math.pow(r - targetR, 2) + 
                    Math.pow(g - targetG, 2) + 
                    Math.pow(b - targetB, 2)
                );

                if (dist <= tolerance) {
                    selected.push({ x, y });
                    stack.push({ x: x - 1, y });
                    stack.push({ x: x + 1, y });
                    stack.push({ x, y: y - 1 });
                    stack.push({ x, y: y + 1 });
                }
            }

            if (selected.length > 0) {
                selection = {
                    x: Math.min(...selected.map(p => p.x)),
                    y: Math.min(...selected.map(p => p.y)),
                    w: Math.max(...selected.map(p => p.x)) - Math.min(...selected.map(p => p.x)) + 1,
                    h: Math.max(...selected.map(p => p.y)) - Math.min(...selected.map(p => p.y)) + 1
                };
            }
        }

        function createLassoSelection() {
            const minX = Math.min(...lassoPoints.map(p => p.x));
            const maxX = Math.max(...lassoPoints.map(p => p.x));
            const minY = Math.min(...lassoPoints.map(p => p.y));
            const maxY = Math.max(...lassoPoints.map(p => p.y));

            selection = {
                x: minX, y: minY,
                w: maxX - minX + 1,
                h: maxY - minY + 1
            };
        }

        function deleteSelection() {
            if (!selection) return;
            
            for (let y = selection.y; y < selection.y + selection.h; y++) {
                for (let x = selection.x; x < selection.x + selection.w; x++) {
                    if (x >= 0 && x < width && y >= 0 && y < height) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0)';
                        ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
                    }
                }
            }
            selection = null;
            pushHistory();
            draw();
        }

        function removeBackground() {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            const edgeColors = new Map();
            for (let x = 0; x < width; x++) {
                const idx = x * 4;
                edgeColors.set(`${data[idx]},${data[idx+1]},${data[idx+2]}`, 
                    (edgeColors.get(`${data[idx]},${data[idx+1]},${data[idx+2]}`) || 0) + 1);
                const idx2 = ((height - 1) * width + x) * 4;
                edgeColors.set(`${data[idx2]},${data[idx2+1]},${data[idx2+2]}`,
                    (edgeColors.get(`${data[idx2]},${data[idx2+1]},${data[idx2+2]}`) || 0) + 1);
            }
            for (let y = 0; y < height; y++) {
                const idx = y * width * 4;
                edgeColors.set(`${data[idx]},${data[idx+1]},${data[idx+2]}`,
                    (edgeColors.get(`${data[idx]},${data[idx+1]},${data[idx+2]}`) || 0) + 1);
                const idx2 = (y * width + width - 1) * 4;
                edgeColors.set(`${data[idx2]},${data[idx2+1]},${data[idx2+2]}`,
                    (edgeColors.get(`${data[idx2]},${data[idx2+1]},${data[idx2+2]}`) || 0) + 1);
            }

            let maxCount = 0;
            let bgColor = '';
            edgeColors.forEach((count, color) => {
                if (count > maxCount) {
                    maxCount = count;
                    bgColor = color;
                }
            });

            const [bgR, bgG, bgB] = bgColor.split(',').map(Number);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    if (data[idx] === bgR && data[idx + 1] === bgG && data[idx + 2] === bgB) {
                        data[idx + 3] = 0;
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function replaceColor(oldR, oldG, oldB) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const rgb = hexToRgb(primaryColor);

            for (let i = 0; i < data.length; i += 4) {
                if (data[i] === oldR && data[i + 1] === oldG && data[i + 2] === oldB) {
                    data[i] = rgb.r;
                    data[i + 1] = rgb.g;
                    data[i + 2] = rgb.b;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function pushHistory() {
            const imageData = ctx.getImageData(0, 0, width, height);
            history = history.slice(0, historyIndex + 1);
            history.push(imageData);
            historyIndex++;
            if (history.length > 50) {
                history.shift();
                historyIndex--;
            }
            updateInfo();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                ctx.putImageData(history[historyIndex], 0, 0);
                draw();
                updateInfo();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                ctx.putImageData(history[historyIndex], 0, 0);
                draw();
                updateInfo();
            }
        }

        function resizeCanvas() {
            const newWidth = parseInt(document.getElementById('widthInput').value);
            const newHeight = parseInt(document.getElementById('heightInput').value);
            
            if (newWidth < 1) document.getElementById('widthInput').value = 1;
            if (newHeight < 1) document.getElementById('heightInput').value = 1;
            
            width = Math.min(Math.max(1, newWidth), 8192);
            height = Math.min(Math.max(1, newHeight), 8192);
            
            const newCanvas = document.createElement('canvas');
            newCanvas.width = width;
            newCanvas.height = height;
            const newCtx = newCanvas.getContext('2d');
            newCtx.fillStyle = '#ffffff';
            newCtx.fillRect(0, 0, width, height);
            newCtx.drawImage(canvas, 0, 0);
            
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(newCanvas, 0, 0);
            
            offset = { x: 0, y: 0 };
            selection = null;
            pushHistory();
            updateInfo();
            draw();
        }

        function setResolution(w, h) {
            document.getElementById('widthInput').value = w;
            document.getElementById('heightInput').value = h;
        }

        function setZoom(percent) {
            zoom = Math.floor((percent / 100) * 16);
            offset = { x: 0, y: 0 };
            draw();
            updateInfo();
            
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function toggleGrid() {
            gridVisible = document.getElementById('gridToggle').checked;
            draw();
        }

        function openImage() {
            document.getElementById('fileInput').click();
        }

        function loadImage(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    width = img.width;
                    height = img.height;
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0);
                    offset = { x: 0, y: 0 };
                    selection = null;
                    pushHistory();
                    updateInfo();
                    draw();
                    
                    document.getElementById('widthInput').value = width;
                    document.getElementById('heightInput').value = height;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        function exportPNG() {
            const link = document.createElement('a');
            link.download = 'pixel-sprite.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function updateInfo() {
            document.getElementById('canvasSize').textContent = `${width}×${height}`;
            document.getElementById('statusCanvas').textContent = `${width}×${height}`;
            
            const percent = Math.round((zoom / 16) * 100);
            document.getElementById('zoomValue').textContent = `${percent}%`;
            document.getElementById('statusZoom').textContent = `${percent}%`;
            
            document.getElementById('historyCount').textContent = history.length;
            
            const colors = new Set();
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                colors.add(`${data[i]},${data[i+1]},${data[i+2]}`);
            }
            document.getElementById('colorCount').textContent = colors.size;
        }

        function updateStatus() {
            updateStatusColor();
            updateInfo();
        }

        function updateStatusColor() {
            const rgb = hexToRgb(primaryColor);
            document.getElementById('statusRGBA').textContent = `${rgb.r}, ${rgb.g}, ${rgb.b}, 255`;
            document.getElementById('statusHEX').textContent = primaryColor.toUpperCase();
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }

        init();
    </script>
</body>
</html>
