现在回看，康复从来不是一条直线。它有反复，有倒退，也有某个下午突然想哭的瞬间。但那束光，确实在慢慢照进来。我想告诉还在黑夜里的你：你不是一个人，光会来的。`,timeline:[{time:`2023年冬`,event:`被确诊中度抑郁，开始服药与心理咨询`},{time:`2024年春`,event:`第一次独自下楼散步，绕了小区一圈`},{time:`2024年夏`,event:`开始尝试恢复工作，从兼职做起`},{time:`2024年秋`,event:`停药，学会和偶尔的低谷共处`}],publishScope:`public`,createdAt:_r(62),warmResponses:[{id:`wr-story-1-1`,content:`谢谢你愿意把这段写下来，你已经很勇敢了。`,isPreset:!1,createdAt:_r(60)}]},{id:`story-2`,author:`匿名用户·山`,tag:`职场倦怠`,title:`我终于敢对"全力以赴"按下暂停`,content:`连续加班三个月后，我在工位上突然流下眼泪，自己都不知道为什么。那是我第一次承认：我累到了骨头里，不只是身体，是整个人。

我曾以为"全力以赴"是负责，后来才明白，把自己耗尽不是负责，是透支。我跟领导请了两周假，一开始满心愧疚，觉得地球离了谁都能转，唯独我不该停。可停下来的第三天，我睡了一个完整的觉，醒来时窗外的鸟叫得很清楚。

现在我会给自己设边界：下班就是下班，周末留给生活。工作还在，但我学会了对它说"先到这里"。`,timeline:[{time:`项目上线后`,event:`在工位上崩溃，意识到自己已经透支`},{time:`请假第一周`,event:`什么都不做，允许自己"空着"`},{time:`回到岗位后`,event:`重新划定边界，学会按时下班`}],publishScope:`public`,createdAt:_r(48),warmResponses:[]},{id:`story-3`,author:`匿名用户·雨`,tag:`失恋后重建`,title:`把心碎收进抽屉的那一年`,content:`分手那天我以为天塌了。之后的几个月，我反复翻看聊天记录，试图找出"到底是哪里出了问题"。直到有一天我删掉了那些记录，才意识到：我一直在用过去惩罚现在的自己。

我没有立刻好起来，也没有必要立刻好起来。我把难过收进了一个想象的抽屉，允许自己每天打开它哭一会儿，然后再合上。慢慢地，打开抽屉的次数变少了。

一年后我重新开始一个人吃饭、一个人看电影。我发现，一个人不等于孤独，而是终于可以把注意力放回自己身上了。`,timeline:[{time:`分手当月`,event:`删掉聊天记录，停止反复回看`},{time:`分手三个月`,event:`开始一个人旅行，走了三个城市`},{time:`分手半年`,event:`重新捡起搁置很久的画画`},{time:`分手一年`,event:`能够平静地谈起这段关系`}],publishScope:`public`,createdAt:_r(120),warmResponses:[{id:`wr-story-3-1`,content:`能好好告别的人，也一定能好好重新开始。抱抱你。`,isPreset:!1,createdAt:_r(118)},{id:`wr-story-3-2`,content:`你值得被温柔对待，包括来自自己的温柔。`,isPreset:!0,createdAt:_r(100)}]},{id:`story-4`,author:`匿名用户·风`,tag:`焦虑缓解`,title:`和身体里的那阵风和解`,content:`我的焦虑像一阵随时会刮起来的风。开会前心跳加快，半夜醒来脑子里全是没做完的事。我试过对抗它，结果越对抗越紧绷。

后来心理咨询师教我一个方法：当焦虑来的时候，不去赶走它，而是对自己说"哦，你又来了"。我把它当成一个会来串门的旧邻居，给它倒杯水，然后继续做手边的事。说来神奇，它来得反而少了。

我还学会了"478呼吸法"：吸气4秒、屏息7秒、呼气8秒。在地铁上、在电梯里，我都能悄悄做。身体慢慢相信了"此刻是安全的"。`,timeline:[{time:`第一次发作`,event:`在地铁里突然心慌，以为是生病`},{time:`开始咨询`,event:`学习识别焦虑信号，不再与之对抗`},{time:`练习呼吸`,event:`把478呼吸变成日常习惯`},{time:`现在`,event:`焦虑还会来，但我不再怕它`}],publishScope:`public`,createdAt:_r(30),warmResponses:[{id:`wr-story-4-1`,content:`和情绪做邻居这个比喻真好，谢谢你的分享。`,isPreset:!1,createdAt:_r(28)}]},{id:`story-5`,author:`匿名用户·林`,tag:`人际关系`,title:`我不再为别人的情绪买单`,content:`我曾是个很会察言观色的人。别人一个叹气，我就开始反思是不是自己哪里没做好。活得很累，也很委屈——我把太多不属于自己的情绪背在了身上。

【不评判原则】
- 不评判对错，不评价用户的决定、生活方式或情绪反应。
- 对方表达任何情绪（脆弱、愤怒、迷茫、疲惫）都先接纳，再回应。
- 不要告诉对方"应该"做什么，更不要给具体行动建议（"出门走走""和朋友聊聊"等）。
- 倾诉即释放：用户的情绪不需要被"解决"，只需要被"听见"。

【匿名与隐私保护】
- 用户的真实身份、姓名、联系方式等永远不会出现在你面前。
- 不要主动询问任何身份信息（姓名、地址、工作单位、家庭成员等）。
- 不要在回复中"复述"或"使用"用户输入里的真名、昵称、手机号、邮箱等可识别信息。
- 提醒：所有对话是匿名的，请对方放心地说出想说的话。
