<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片压缩器 - 离线批量压缩</title>
<script src="jszip.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0a0a0f;
    color: #e8e8ed;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 20px; }
  header { text-align: center; padding: 24px 0 16px; }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  header p { color: #6b7280; font-size: 13px; }

  .drop-zone {
    border: 2px dashed #2a2a35;
    border-radius: 16px;
    padding: 44px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .25s;
    background: #12121a;
    margin-bottom: 16px;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #0ea5e9;
    background: #1a1a2e;
  }
  .drop-zone .icon { font-size: 42px; margin-bottom: 10px; }
  .drop-zone .main-text { color: #d1d5db; font-size: 15px; margin-bottom: 4px; }
  .drop-zone .sub-text { color: #4b5563; font-size: 12px; }
  .drop-zone .clickable { color: #0ea5e9; text-decoration: underline; cursor: pointer; }
  #fileInput { display: none; }

  .controls {
    display: none;
    background: #12121a;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
    gap: 16px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .control-group { flex: 1; min-width: 160px; }
  .control-group label {
    display: block;
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .control-group .value-display {
    color: #0ea5e9;
    font-weight: 600;
  }
  input[type=range] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    background: #2a2a35;
    border-radius: 3px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: #0ea5e9;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #0a0a0f;
  }
  select {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #2a2a35;
    background: #0a0a0f;
    color: #e8e8ed;
    font-size: 13px;
    outline: none;
  }
  select:focus { border-color: #0ea5e9; }
  .btn-row { display: flex; gap: 10px; }
  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    color: #fff;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid #2a2a35;
    color: #9ca3af;
  }
  .btn-secondary:hover { border-color: #4b5563; color: #d1d5db; }
  .btn-success { background: #16a34a; color: #fff; }

  .progress-wrap {
    display: none;
    margin-bottom: 16px;
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #2a2a35;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
    width: 0%;
    transition: width .3s;
    border-radius: 3px;
  }
  .progress-text {
    text-align: center;
    font-size: 12px;
    color: #6b7280;
    margin-top: 6px;
  }

  .file-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .file-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #12121a;
    border: 1px solid #1a1a25;
    border-radius: 10px;
    padding: 10px 14px;
    transition: border-color .2s;
  }
  .file-card:hover { border-color: #2a2a35; }
  .file-card .thumb {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    object-fit: cover;
    background: #1a1a25;
    flex-shrink: 0;
  }
  .file-card .info { flex: 1; min-width: 0; }
  .file-card .name {
    font-size: 13px;
    color: #e8e8ed;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-card .meta {
    font-size: 11px;
    color: #4b5563;
    margin-top: 2px;
  }
  .file-card .status {
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    min-width: 56px;
    text-align: right;
  }
  .file-card .sizes {
    font-size: 11px;
    color: #4b5563;
    text-align: right;
    min-width: 110px;
  }
  .file-card .sizes .saved { color: #22c55e; }
  .st-wait { color: #6b7280; }
  .st-run  { color: #0ea5e9; }
  .st-ok   { color: #22c55e; }
  .st-err  { color: #ef4444; }

  .summary {
    display: none;
    background: #12121a;
    border: 1px solid #1a1a25;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
  }
  .summary h3 { font-size: 16px; margin-bottom: 14px; color: #e8e8ed; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat .num { font-size: 20px; font-weight: 700; color: #0ea5e9; }
  .stat .lbl { font-size: 11px; color: #4b5563; margin-top: 2px; }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .controls { flex-direction: column; align-items: stretch; }
    .btn-row { justify-content: stretch; }
    .btn-row .btn { flex: 1; }
  }

  .tips {
    margin-top: 20px;
    padding: 12px 16px;
    background: #12121a;
    border-radius: 10px;
    font-size: 12px;
    color: #4b5563;
    line-height: 1.7;
  }
  .tips strong { color: #9ca3af; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📷 照片压缩器</h1>
    <p>完全离线运行 · 拖拽即用 · 专为微信传图优化</p>
  </header>

  <div class="drop-zone" id="dropZone">
    <div class="icon">📁</div>
    <div class="main-text">拖拽照片到此处，或 <span class="clickable">点击选择</span></div>
    <div class="sub-text">支持 JPG、PNG、WebP、BMP、GIF（HEIC 请先用手机转换为 JPG）</div>
    <input type="file" id="fileInput" multiple accept="image/*">
  </div>

  <div class="controls" id="controls" style="display:none;">
    <div class="control-group">
      <label>压缩质量 <span class="value-display" id="qVal">30</span>%</label>
      <input type="range" id="quality" min="1" max="100" value="30">
    </div>
    <div class="control-group">
      <label>最大边长 <span class="value-display" id="sVal">不限制</span></label>
      <input type="range" id="maxSize" min="0" max="5" value="0" step="1">
    </div>
    <div class="control-group" style="min-width:110px;">
      <label>输出格式</label>
      <select id="outFormat">
        <option value="image/jpeg">JPG（推荐）</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WebP</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnCompress">开始压缩</button>
      <button class="btn btn-secondary" id="btnClear">清空</button>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">准备中...</div>
  </div>

  <div class="file-list" id="fileList"></div>

  <div class="summary" id="summary">
    <h3>压缩完成</h3>
    <div class="stats">
      <div class="stat"><div class="num" id="stOrig">0</div><div class="lbl">原始大小</div></div>
      <div class="stat"><div class="num" id="stComp">0</div><div class="lbl">压缩后</div></div>
      <div class="stat"><div class="num" id="stSave">0</div><div class="lbl">节省空间</div></div>
      <div class="stat"><div class="num" id="stRatio">0%</div><div class="lbl">压缩率</div></div>
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-success" id="btnDownloadAll">打包下载全部</button>
    </div>
  </div>

  <div class="tips">
    <strong>使用提示：</strong><br>
    · 质量 20-40% 适合微信传图，肉眼差异很小，体积可压缩 70-90%<br>
    · 限制最大边长可进一步减小体积（如 1920px 适合朋友圈）<br>
    · 所有处理在本地浏览器完成，图片不会上传到任何服务器<br>
    · 单次建议不超过 200 张，避免浏览器内存不足
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const files = [];
let compressed = [];
let busy = false;

const sizeLabels = ['不限制', '640px', '1080px', '1440px', '1920px', '2560px'];
const sizeValues = [0, 640, 1080, 1440, 1920, 2560];

function fmtSize(b) {
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(b)/Math.log(1024));
  return (b/Math.pow(1024,i)).toFixed(2)+' '+u[i];
}

function renderList() {
  $('fileList').innerHTML = files.map((f,i) => `
    <div class="file-card" data-i="${i}">
      <img class="thumb" src="${f.preview||''}" alt="" onerror="this.style.visibility='hidden'">
      <div class="info">
        <div class="name">${f.name}</div>
        <div class="meta">${fmtSize(f.size)} · ${f.type.split('/')[1]?.toUpperCase()||'?'}</div>
      </div>
      <div class="status st-wait" id="st-${i}">等待中</div>
      <div class="sizes" id="sz-${i}"></div>
    </div>
  `).join('');
}

async function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function compressOne(fileObj, quality, maxSide, outFormat) {
  const img = await loadImage(fileObj.preview);
  let w = img.width, h = img.height;

  if (maxSide > 0) {
    const ratio = Math.min(maxSide / w, maxSide / h, 1);
    w = Math.round(w * ratio);
    h = Math.round(h * ratio);
  }

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);

  const mime = outFormat;
  const q = quality / 100;

  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (!blob) return reject(new Error('压缩失败'));
      resolve(blob);
    }, mime, q);
  });
}

$('dropZone').addEventListener('click', () => $('fileInput').click());
$('dropZone').addEventListener('dragover', e => { e.preventDefault(); $('dropZone').classList.add('dragover'); });
$('dropZone').addEventListener('dragleave', () => $('dropZone').classList.remove('dragover'));
$('dropZone').addEventListener('drop', async e => {
  e.preventDefault();
  $('dropZone').classList.remove('dragover');
  await addFiles(Array.from(e.dataTransfer.files));
});
$('fileInput').addEventListener('change', async e => {
  await addFiles(Array.from(e.target.files));
  e.target.value = '';
});

async function addFiles(list) {
  const imgs = list.filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return alert('未检测到图片文件');

  for (const f of imgs) {
    const preview = await readFile(f);
    files.push({ file: f, name: f.name, size: f.size, type: f.type, preview });
  }

  $('controls').style.display = 'flex';
  renderList();
}

$('quality').addEventListener('input', e => $('qVal').textContent = e.target.value);
$('maxSize').addEventListener('input', e => $('sVal').textContent = sizeLabels[e.target.value]);

$('btnClear').addEventListener('click', () => {
  files.length = 0;
  compressed = [];
  $('controls').style.display = 'none';
  $('progressWrap').style.display = 'none';
  $('summary').style.display = 'none';
  $('fileList').innerHTML = '';
});

$('btnCompress').addEventListener('click', async () => {
  if (busy || !files.length) return;
  busy = true;
  compressed = [];

  const btn = $('btnCompress');
  btn.disabled = true;
  btn.textContent = '压缩中...';
  $('progressWrap').style.display = 'block';
  $('summary').style.display = 'none';

  const quality = parseInt($('quality').value);
  const maxSide = sizeValues[parseInt($('maxSize').value)];
  const outFormat = $('outFormat').value;

  let totalOrig = 0, totalComp = 0, done = 0;

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    $(`st-${i}`).textContent = '压缩中...';
    $(`st-${i}`).className = 'status st-run';

    try {
      const blob = await compressOne(f, quality, maxSide, outFormat);
      const ext = outFormat === 'image/png' ? 'png' : outFormat === 'image/webp' ? 'webp' : 'jpg';
      const newName = f.name.replace(/\.[^.]+$/, '') + '_compressed.' + ext;

      compressed.push({ blob, name: newName, origName: f.name });

      const saved = f.size - blob.size;
      const ratio = f.size > 0 ? Math.round((saved / f.size) * 100) : 0;

      $(`st-${i}`).textContent = '完成';
      $(`st-${i}`).className = 'status st-ok';
      $(`sz-${i}`).innerHTML = `${fmtSize(f.size)} → ${fmtSize(blob.size)}<br><span class="saved">-${ratio}%</span>`;

      totalOrig += f.size;
      totalComp += blob.size;
    } catch (err) {
      $(`st-${i}`).textContent = '失败';
      $(`st-${i}`).className = 'status st-err';
      $(`sz-${i}`).textContent = err.message || '错误';
    }

    done++;
    const pct = Math.round((done / files.length) * 100);
    $('progressFill').style.width = pct + '%';
    $('progressText').textContent = `正在压缩 ${done}/${files.length}`;
  }

  const saved = totalOrig - totalComp;
  const ratio = totalOrig > 0 ? Math.round((saved / totalOrig) * 100) : 0;

  $('stOrig').textContent = fmtSize(totalOrig);
  $('stComp').textContent = fmtSize(totalComp);
  $('stSave').textContent = fmtSize(saved);
  $('stRatio').textContent = '-' + ratio + '%';
  $('summary').style.display = 'block';
  $('progressText').textContent = `完成！共处理 ${files.length} 张`;

  btn.disabled = false;
  btn.textContent = '开始压缩';
  busy = false;
});

$('btnDownloadAll').addEventListener('click', async () => {
  if (!compressed.length) return;

  const btn = $('btnDownloadAll');
  btn.disabled = true;
  btn.textContent = '打包中...';

  const zip = new JSZip();
  for (const c of compressed) {
    zip.file(c.name, c.blob);
  }

  const content = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'compressed_photos.zip';
  a.click();
  URL.revokeObjectURL(url);

  btn.disabled = false;
  btn.textContent = '打包下载全部';
});
</script>
</body>
</html>
