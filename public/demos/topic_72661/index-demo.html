<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>数趣星球 - 数学思维启蒙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --bg2: rgba(16, 22, 45, 0.7);
      --ink: #e0e6f0;
      --muted: #6b7a9c;
      --rule: rgba(100, 180, 255, 0.15);
      --accent: #00d4ff;
      --accent-light: rgba(0, 212, 255, 0.1);
      --accent2: #7c3aed;
      --accent2-light: rgba(124, 58, 237, 0.1);
      --purple: #a855f7;
      --yellow: #fbbf24;
      --pink: #ec4899;
      --blue: #3b82f6;
      --red: #ef4444;
      --green: #22c55e;
      --neon-cyan: #00d4ff;
      --neon-purple: #b026ff;
      --neon-blue: #0066ff;
      --glass-bg: rgba(16, 22, 45, 0.6);
      --glass-border: rgba(0, 212, 255, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 科技网格背景 */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* 扫描线效果 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 212, 255, 0.015) 2px,
        rgba(0, 212, 255, 0.015) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* 霓虹发光文字 */
    .neon-text {
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.5), 0 0 20px rgba(0, 212, 255, 0.3);
    }

    /* 玻璃拟态卡片 */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* 霓虹边框 */
    .neon-border {
      position: relative;
    }
    .neon-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      opacity: 0;
      transition: opacity 0.3s;
      z-index: -1;
    }
    .neon-border:hover::before {
      opacity: 0.5;
    }

    /* 脉冲光环 */
    @keyframes techPulse {
      0%, 100% { box-shadow: 0 0 5px rgba(0, 212, 255, 0.3); }
      50% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.2); }
    }

    /* 数据流动画 */
    @keyframes dataFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* 科技感角标 */
    .tech-corner {
      position: absolute;
      width: 12px; height: 12px;
      border: 2px solid var(--neon-cyan);
      opacity: 0.6;
    }
    .tech-corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .tech-corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
    .tech-corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
    .tech-corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    /* ====== PAGE SYSTEM ====== */
    .page {
      display: none;
      min-height: 100vh;
      animation: pageIn 0.4s ease-out;
    }
    .page.active { display: block; }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ====== HOME PAGE ====== */
    .home-header {
      background: linear-gradient(135deg, #0c1445 0%, #1a1a5e 50%, #0d1b3e 100%);
      border-radius: 0 0 32px 32px;
      padding: 40px 24px 32px;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 30px rgba(0, 212, 255, 0.15);
    }
    .home-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .home-header::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(176, 38, 255, 0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .user-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }
    .avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFD93D, #F6AD55);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      border: 3px solid rgba(255,255,255,0.3);
      flex-shrink: 0;
    }
    .user-meta { flex: 1; }
    .user-name { font-size: 20px; font-weight: 700; }

    .grade-selector {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .grade-btn {
      display: inline-block;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(0, 212, 255, 0.1);
      color: rgba(0, 212, 255, 0.6);
      border: 1px solid rgba(0, 212, 255, 0.2);
      transition: all 0.25s ease;
      user-select: none;
    }
    .grade-btn.active {
      background: rgba(0, 212, 255, 0.25);
      color: #fff;
      border-color: rgba(0, 212, 255, 0.6);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }
    .grade-btn:active { transform: scale(0.95); }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      position: relative;
      z-index: 1;
    }
    .stat {
      text-align: center;
    }
    .stat-num {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 32px;
      display: block;
      line-height: 1;
    }
    .stat-label { font-size: 12px; opacity: 0.8; }

    .daily-challenge {
      margin: 20px 24px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.15) 0%, rgba(124, 58, 237, 0.15) 100%);
      border-radius: 20px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      border: 1px solid rgba(0, 212, 255, 0.2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 212, 255, 0.1);
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .daily-challenge::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
      transition: left 0.5s;
    }
    .daily-challenge:hover::before { left: 100%; }
    .daily-challenge:active { transform: scale(0.98); }
    .dc-title { font-size: 18px; font-weight: 700; }
    .dc-sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }
    .dc-btn {
      background: rgba(255,255,255,0.2);
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 28px 24px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
    }
    .section-title::before {
      content: '';
      width: 4px; height: 20px;
      background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }

    .planets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 0 24px;
    }

    .planet-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .planet-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0, 212, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.1);
      border-color: rgba(0, 212, 255, 0.4);
    }
    .planet-card.locked { opacity: 0.4; cursor: not-allowed; }
    .planet-card.locked:hover { transform: none; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }

    .planet-icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin-bottom: 12px;
      position: relative;
    }
    .planet-icon::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      opacity: 0.15;
    }

    .planet-name { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
    .planet-sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

    .planet-progress-bar {
      height: 6px;
      background: var(--rule);
      border-radius: 3px;
      overflow: hidden;
    }
    .planet-progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .planet-progress-text {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      text-align: right;
    }

    .lock-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    /* ====== PLANET PAGE ====== */
    .planet-header-bar {
      padding: 20px 24px;
      color: #fff;
      border-radius: 0 0 24px 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 30px rgba(0, 212, 255, 0.15);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      opacity: 0.9;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .planet-title-big { font-size: 28px; font-weight: 700; }
    .planet-sub-big { font-size: 14px; opacity: 0.85; margin-top: 4px; }
    .planet-overall-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }
    .planet-overall-progress .progress-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; }
    .planet-overall-progress .progress-fill { height: 100%; background: #fff; border-radius: 4px; }
    .planet-overall-progress .progress-text { font-size: 13px; font-weight: 600; min-width: 50px; text-align: right; }

    .levels-list { padding: 0 24px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; }

    .level-item {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.2s;
    }
    .level-item:hover { transform: translateX(4px); border-color: rgba(0, 212, 255, 0.3); }
    .level-item.current { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 212, 255, 0.15); }
    .level-item.locked { opacity: 0.4; cursor: not-allowed; }
    .level-item.locked:hover { transform: none; }

    .level-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .level-icon.done { background: var(--accent2-light); color: var(--accent2); }
    .level-icon.current { background: var(--accent-light); color: var(--accent); }
    .level-icon.locked { background: #F5F5F5; color: var(--muted); }

    .level-info { flex: 1; }
    .level-name { font-size: 16px; font-weight: 600; }
    .level-topic { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .level-stars { display: flex; gap: 4px; }
    .level-stars .star { font-size: 20px; opacity: 0.2; }
    .level-stars .star.on { opacity: 1; }

    /* ====== QUIZ PAGE ====== */
    .quiz-header {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 14, 26, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 212, 255, 0.15);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .quiz-back { font-size: 20px; cursor: pointer; padding: 8px; }
    .quiz-title { font-size: 16px; font-weight: 700; }
    .quiz-timer {
      background: var(--accent-light);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'ZCOOL KuaiLe', cursive;
    }

    .quiz-progress-track {
      height: 4px;
      background: var(--rule);
    }
    .quiz-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--yellow));
      transition: width 0.3s ease;
    }

    .quiz-body { padding: 24px; max-width: 600px; margin: 0 auto; }

    .question-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
      margin-bottom: 24px;
    }
    .question-num {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 500;
    }
    .question-text {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .question-tag {
      display: inline-block;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 500;
    }

    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .option {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option:hover { border-color: var(--neon-cyan); background: rgba(0, 212, 255, 0.08); }
    .option.selected { border-color: var(--neon-cyan); background: rgba(0, 212, 255, 0.12); box-shadow: 0 0 15px rgba(0, 212, 255, 0.1); }
    .option.correct { border-color: var(--green); background: rgba(34, 197, 94, 0.1); }
    .option.wrong { border-color: var(--red); background: rgba(239, 68, 68, 0.1); }
    .option.disabled { pointer-events: none; }

    .option-label {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }
    .option.correct .option-label { background: var(--green); color: #fff; }
    .option.wrong .option-label { background: var(--red); color: #fff; }
    .option-text { font-size: 16px; font-weight: 500; }

    .fill-area {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .fill-input {
      width: 100%;
      border: 2px solid var(--rule);
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 18px;
      text-align: center;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .fill-input:focus { border-color: var(--accent); }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.8), rgba(124, 58, 237, 0.8));
      color: #fff;
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 16px;
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }
    .submit-btn:hover { box-shadow: 0 0 30px rgba(0, 212, 255, 0.4); }
    .submit-btn:active { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    /* ====== FEEDBACK ====== */
    .feedback-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 18, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .feedback-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 36px 32px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 30px rgba(0, 212, 255, 0.1), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .feedback-icon {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 16px;
      display: block;
    }
    .feedback-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .feedback-explanation {
      background: var(--bg);
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0 24px;
      text-align: left;
    }
    .feedback-explanation .exp-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .feedback-explanation .exp-text {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }
    .next-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.8), rgba(124, 58, 237, 0.8));
      color: #fff;
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
      transition: all 0.3s;
    }
    .next-btn:hover { box-shadow: 0 0 30px rgba(0, 212, 255, 0.4); }

    /* ====== RESULT PAGE ====== */
    .result-header {
      text-align: center;
      padding: 48px 24px 32px;
    }
    .result-stars {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .result-star {
      font-size: 56px;
      opacity: 0.15;
      transition: all 0.5s ease;
    }
    .result-star.earned {
      opacity: 1;
      animation: starBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes starBounce {
      0% { transform: scale(0) rotate(-30deg); }
      60% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0); }
    }
    .result-title { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .result-sub { font-size: 15px; color: var(--muted); }

    .result-stats {
      display: flex;
      justify-content: space-around;
      padding: 0 24px;
      margin-bottom: 32px;
    }
    .result-stat {
      text-align: center;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px 28px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
      min-width: 90px;
    }
    .result-stat-num {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 36px;
      color: var(--accent);
      display: block;
      line-height: 1;
    }
    .result-stat-label { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .result-actions {
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary, .btn-secondary {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-align: center;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.8), rgba(124, 58, 237, 0.8));
      color: #fff;
      border: 1px solid rgba(0, 212, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }
    .btn-primary:hover { box-shadow: 0 0 30px rgba(0, 212, 255, 0.4); }
    .btn-secondary {
      background: transparent;
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 212, 255, 0.4);
    }
    .btn-secondary:hover { background: rgba(0, 212, 255, 0.1); box-shadow: 0 0 20px rgba(0, 212, 255, 0.15); }
    .btn-primary:active, .btn-secondary:active { opacity: 0.85; }

    .suggestion-card {
      margin: 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .suggestion-title { font-size: 15px; font-weight: 700; color: #D4A017; margin-bottom: 8px; }
    .suggestion-text { font-size: 14px; color: var(--muted); }

    /* ====== CONFETTI ====== */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 10px; height: 10px;
      animation: confettiFall 3s ease-out forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* ====== REPORT PAGE ====== */
    .report-overview {
      background: linear-gradient(135deg, #0c1445 0%, #1a1a5e 50%, #0d1b3e 100%);
      border-radius: 0 0 32px 32px;
      padding: 32px 24px;
      color: #fff;
      box-shadow: 0 4px 30px rgba(0, 212, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    .report-stats {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }
    .report-stat { text-align: center; }
    .report-stat-num { font-family: 'ZCOOL KuaiLe', cursive; font-size: 36px; }
    .report-stat-label { font-size: 12px; opacity: 0.8; }

    .knowledge-section { padding: 24px; }
    .knowledge-item { margin-bottom: 20px; }
    .knowledge-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .knowledge-name { font-size: 14px; font-weight: 600; }
    .knowledge-percent { font-size: 14px; font-weight: 700; color: var(--accent); }
    .knowledge-bar { height: 10px; background: var(--rule); border-radius: 5px; overflow: hidden; }
    .knowledge-fill { height: 100%; border-radius: 5px; transition: width 1s ease; }

    /* ====== WRONGBOOK ====== */
    .wrong-list { padding: 24px; }
    .wrong-item {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .wrong-planet { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
    .wrong-content { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
    .wrong-status { display: flex; gap: 8px; }
    .wrong-tag {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 10px;
      background: #FEF2F2;
      color: var(--red);
    }
    .wrong-tag.mastered { background: var(--accent2-light); color: var(--accent2); }

    /* ====== NAV BAR ====== */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 212, 255, 0.15);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 50;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 16px;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.2s;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 22px; }
    .nav-label { font-size: 11px; font-weight: 500; }

    .page-with-nav { padding-bottom: 70px; }

    /* ====== UTILS ====== */
    .hidden { display: none !important; }

    /* ====== CARTOON DECORATIONS ====== */
    /* 浮动气泡装饰 */
    .bubble-deco {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .bubble-deco.b1 {
      width: 18px; height: 18px;
      background: rgba(255,217,61,0.35);
      top: 15%; left: 8%;
      animation: floatBubble 4s ease-in-out infinite;
    }
    .bubble-deco.b2 {
      width: 12px; height: 12px;
      background: rgba(255,255,255,0.25);
      top: 60%; left: 85%;
      animation: floatBubble 5s ease-in-out infinite 1s;
    }
    .bubble-deco.b3 {
      width: 22px; height: 22px;
      background: rgba(255,255,255,0.2);
      top: 35%; left: 72%;
      animation: floatBubble 6s ease-in-out infinite 0.5s;
    }
    .bubble-deco.b4 {
      width: 10px; height: 10px;
      background: rgba(255,217,61,0.3);
      top: 75%; left: 15%;
      animation: floatBubble 4.5s ease-in-out infinite 2s;
    }
    @keyframes floatBubble {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.15); }
    }

    /* 星星粒子装饰 */
    .star-particle {
      position: absolute;
      pointer-events: none;
      font-size: 14px;
      opacity: 0.6;
      animation: twinkle 2s ease-in-out infinite;
    }
    .star-particle.s1 { top: 10%; right: 12%; animation-delay: 0s; }
    .star-particle.s2 { top: 45%; right: 6%; animation-delay: 0.7s; font-size: 10px; }
    .star-particle.s3 { top: 25%; left: 5%; animation-delay: 1.2s; font-size: 12px; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
      50% { opacity: 0.8; transform: scale(1.1) rotate(15deg); }
    }

    /* 波浪底部装饰 */
    .wave-deco {
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 30px;
      pointer-events: none;
      z-index: 1;
    }
    .wave-deco svg {
      width: 100%;
      height: 100%;
    }

    /* 卡通云朵 */
    .cloud-deco {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      opacity: 0.12;
    }
    .cloud-deco.c1 {
      top: 8%; right: -10px;
      font-size: 60px;
      animation: driftCloud 8s ease-in-out infinite;
    }
    .cloud-deco.c2 {
      top: 55%; left: -15px;
      font-size: 40px;
      animation: driftCloud 10s ease-in-out infinite 3s;
    }
    @keyframes driftCloud {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(10px); }
    }

    /* 星球卡片卡通增强 */
    .planet-card .planet-icon {
      transition: transform 0.3s ease;
    }
    .planet-card:not(.locked):hover .planet-icon {
      transform: scale(1.15) rotate(-5deg);
    }
    .planet-card:not(.locked):active .planet-icon {
      transform: scale(0.95) rotate(5deg);
    }
    .planet-card .planet-emoji {
      font-size: 28px;
      line-height: 1;
    }
    .planet-card .planet-icon-text {
      display: none;
    }

    /* 星球卡片装饰角标 */
    .planet-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* 关卡卡通增强 */
    .level-item .level-icon {
      transition: transform 0.3s ease;
      position: relative;
    }
    .level-item:not(.locked):hover .level-icon {
      transform: scale(1.1) rotate(-8deg);
    }
    .level-item:not(.locked):active .level-icon {
      transform: scale(0.9);
    }
    .level-item.current {
      animation: gentlePulse 2s ease-in-out infinite;
    }
    @keyframes gentlePulse {
      0%, 100% { box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
      50% { box-shadow: 0 2px 20px rgba(232,106,51,0.2); }
    }

    /* 答题页面卡通装饰 */
    .quiz-body { position: relative; }
    .quiz-deco {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }
    .quiz-deco.qd1 {
      top: -10px; right: -10px;
      font-size: 40px;
      animation: wiggle 3s ease-in-out infinite;
    }
    .quiz-deco.qd2 {
      bottom: 20px; left: -5px;
      font-size: 30px;
      animation: wiggle 4s ease-in-out infinite 1.5s;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(8deg); }
      75% { transform: rotate(-8deg); }
    }

    /* 题目卡片卡通边框 */
    .question-card {
      position: relative;
      border: 3px dashed var(--rule);
      border-radius: 24px;
    }
    .question-card::before {
      content: '';
      position: absolute;
      top: -6px; right: -6px;
      width: 16px; height: 16px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.4;
    }
    .question-card::after {
      content: '';
      position: absolute;
      bottom: -6px; left: -6px;
      width: 12px; height: 12px;
      background: var(--accent2);
      border-radius: 50%;
      opacity: 0.4;
    }

    /* 选项卡通化 */
    .option {
      border: 2.5px solid var(--rule);
      border-radius: 18px;
      position: relative;
    }
    .option::before {
      content: '';
      position: absolute;
      top: 4px; right: 8px;
      width: 6px; height: 6px;
      background: var(--rule);
      border-radius: 50%;
      opacity: 0.5;
      transition: all 0.2s;
    }
    .option.selected::before { background: var(--accent); opacity: 1; }
    .option.correct::before { background: var(--green); opacity: 1; }
    .option.wrong::before { background: var(--red); opacity: 1; }

    /* 结果页卡通增强 */
    .result-header { position: relative; overflow: visible; }
    .result-mascot {
      font-size: 80px;
      display: block;
      margin-bottom: 12px;
      animation: mascotBounce 1.5s ease-in-out infinite;
    }
    @keyframes mascotBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .result-star.earned {
      animation: starBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), starGlow 1.5s ease-in-out infinite 0.6s;
    }
    @keyframes starGlow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.2); }
    }

    /* 每日挑战卡通增强 */
    .daily-challenge {
      position: relative;
      overflow: hidden;
    }
    .daily-challenge .dc-emoji {
      font-size: 36px;
      margin-right: 12px;
      animation: wiggle 2s ease-in-out infinite;
    }

    /* 报告页卡通装饰 */
    .report-overview {
      position: relative;
      overflow: hidden;
    }
    .report-mascot {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 64px;
      opacity: 0.3;
    }

    /* 知识进度条卡通化 */
    .knowledge-bar {
      height: 14px;
      background: var(--rule);
      border-radius: 7px;
      overflow: hidden;
      position: relative;
    }
    .knowledge-fill {
      height: 100%;
      border-radius: 7px;
      transition: width 1s ease;
      position: relative;
    }
    .knowledge-fill::after {
      content: '';
      position: absolute;
      top: 3px; right: 4px;
      width: 8px; height: 8px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
    }

    /* 知识点总览页 */
    .knowledge-overview-header {
      background: linear-gradient(135deg, #0c1445 0%, #1a1a5e 50%, #0d1b3e 100%);
      border-radius: 0 0 32px 32px;
      padding: 32px 24px 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 30px rgba(0, 212, 255, 0.15);
    }
    .knowledge-overview-stat {
      text-align: center;
      flex: 1;
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 12px 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .knowledge-overview-num {
      font-size: 28px;
      font-weight: 900;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
    }
    .knowledge-overview-label {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    /* 知识点星球分组 */
    .ko-planet-group {
      margin-top: 20px;
    }
    .ko-planet-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .ko-planet-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .ko-planet-name {
      font-size: 17px;
      font-weight: 700;
    }
    .ko-planet-sub {
      font-size: 12px;
      color: var(--muted);
    }
    .ko-planet-progress {
      margin-left: auto;
      font-size: 13px;
      font-weight: 600;
      color: var(--neon-cyan);
    }

    /* 知识点卡片 */
    .ko-item {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .ko-item:hover {
      border-color: rgba(0, 212, 255, 0.3);
      transform: translateX(4px);
    }
    .ko-item.locked {
      opacity: 0.35;
    }
    .ko-item.locked:hover {
      transform: none;
      border-color: var(--glass-border);
    }
    .ko-status-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .ko-status-icon.mastered {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .ko-status-icon.learning {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .ko-status-icon.locked {
      background: rgba(100, 100, 120, 0.15);
      border: 1px solid rgba(100, 100, 120, 0.2);
    }
    .ko-info {
      flex: 1;
    }
    .ko-name {
      font-size: 15px;
      font-weight: 600;
    }
    .ko-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ko-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.2);
      transition: all 0.3s ease;
      flex-shrink: 0;
      user-select: none;
    }
    .ko-toggle-btn:hover {
      background: rgba(0, 212, 255, 0.2);
      border-color: rgba(0, 212, 255, 0.4);
    }
    .ko-toggle-btn:active {
      transform: scale(0.9);
    }
    .ko-detail {
      margin-top: 10px;
      padding: 12px 14px;
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.12);
      border-radius: 12px;
      animation: slideDown 0.3s ease;
    }
    .ko-detail.hidden {
      display: none;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ko-detail-desc {
      font-size: 13px;
      color: var(--ink);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .ko-detail-example {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
    }
    .ko-example-tag {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(0, 212, 255, 0.15);
      color: var(--neon-cyan);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .ko-example-text {
      color: var(--muted);
      line-height: 1.5;
    }
    .ko-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .ko-stars {
      display: flex;
      gap: 2px;
    }
    .ko-stars span {
      font-size: 14px;
      opacity: 0.25;
    }
    .ko-stars span.on {
      opacity: 1;
    }

    /* 知识点正确率环形图 */
    .ko-right {
      flex-shrink: 0;
    }
    .ko-rate-ring {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ko-rate-ring svg {
      display: block;
    }
    .ko-rate-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 9px;
      font-weight: 700;
      color: var(--ink);
    }

    /* 错题本空状态卡通 */
    .wrong-empty-emoji {
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
      animation: mascotBounce 2s ease-in-out infinite;
    }

    /* 导航栏卡通增强 */
    .nav-item .nav-icon {
      transition: transform 0.3s ease;
    }
    .nav-item.active .nav-icon {
      animation: navBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes navBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* 反馈弹窗卡通增强 */
    .feedback-card {
      border: 3px dashed var(--rule);
      position: relative;
    }
    .feedback-card .feedback-corner {
      position: absolute;
      font-size: 24px;
    }
    .feedback-card .feedback-corner.tl { top: -12px; left: -8px; transform: rotate(-15deg); }
    .feedback-card .feedback-corner.br { bottom: -12px; right: -8px; transform: rotate(15deg); }

    /* 填空输入框卡通化 */
    .fill-input {
      border: 2.5px dashed var(--rule);
      border-radius: 18px;
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 22px;
    }
    .fill-input:focus {
      border-color: var(--accent);
      border-style: solid;
      box-shadow: 0 0 0 4px rgba(232,106,51,0.15);
    }

    /* 背景图案 - 圆点 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: radial-gradient(circle, rgba(232,106,51,0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    @media (min-width: 768px) {
      body { max-width: 430px; margin: 0 auto; background: #050812; }
      .nav-bar, .feedback-overlay { max-width: 430px; left: 50%; transform: translateX(-50%); }
    }
  </style>
</head>
<body>

<!-- ==================== HOME PAGE ==================== -->
<div id="page-home" class="page active page-with-nav">
  <div class="home-header">
    <span class="bubble-deco b1"></span>

    { id:'p5l1q2', level:'l1', type:'choice', content:'三角形的底是 12cm，高是 8cm，面积是？', options:['96cm²','48cm²','24cm²','40cm²'], answer:1, explanation:'三角形面积 = 底 × 高 ÷ 2 = 12 × 8 ÷ 2 = 48（cm²）', point:'三角形面积' },
    { id:'p5l2q1', level:'l2', type:'fill', content:'梯形的上底是 5cm，下底是 9cm，高是 4cm，面积是？', answer:'28', explanation:'梯形面积 = (上底 + 下底) × 高 ÷ 2 = (5+9) × 4 ÷ 2 = 28（cm²）', point:'梯形面积' },
    { id:'p5l2q2', level:'l2', type:'choice', content:'一个平行四边形和一个三角形等底等高，平行四边形的面积是 36cm²，三角形的面积是？', options:['36cm²','18cm²','72cm²','9cm²'], answer:1, explanation:'等底等高的三角形面积是平行四边形的一半：36 ÷ 2 = 18（cm²）', point:'面积关系' },
    { id:'p5l3q1', level:'l3', type:'fill', content:'一个三角形的面积是 24cm²，底是 8cm，高是？', answer:'6', explanation:'高 = 面积 × 2 ÷ 底 = 24 × 2 ÷ 8 = 6（cm）', point:'综合练习' },
  ],
  p6: [
    { id:'p6l1q1', level:'l1', type:'choice', content:'长方体的长是 5cm，宽是 3cm，高是 2cm，体积是？', options:['30cm³','10cm³','25cm³','15cm³'], answer:0, explanation:'长方体体积 = 长 × 宽 × 高 = 5 × 3 × 2 = 30（cm³）', point:'长方体体积' },
    { id:'p6l1q2', level:'l1', type:'choice', content:'正方体的棱长是 4cm，表面积是？', options:['64cm²','96cm²','48cm²','16cm²'], answer:1, explanation:'正方体有6个面，每个面面积 = 4 × 4 = 16，表面积 = 16 × 6 = 96（cm²）', point:'正方体表面积' },
    { id:'p6l2q1', level:'l2', type:'choice', content:'一个长方体水箱，从里面量长 8dm，宽 5dm，高 6dm，这个水箱的容积是？', options:['240L','120L','48L','19L'], answer:0, explanation:'容积 = 8 × 5 × 6 = 240（dm³）= 240（L），1dm³ = 1L', point:'体积与容积' },
    { id:'p6l2q2', level:'l2', type:'fill', content:'一个正方体的体积是 64cm³，它的棱长是？', answer:'4', explanation:'4 × 4 × 4 = 64，所以棱长是 4cm', point:'综合练习' },
    { id:'p6l3q1', level:'l3', type:'choice', content:'把一个棱长 6cm 的正方体切成两个相同的长方体，表面积增加了多少？', options:['36cm²','72cm²','18cm²','48cm²'], answer:1, explanation:'切开后增加两个面，每个面面积 = 6 × 6 = 36，共增加 36 × 2 = 72（cm²）', point:'切割与表面积' },
  ],
};

// ==================== APP STATE ====================
const state = {
  currentPage: 'home',
  currentPlanet: null,
  currentLevel: null,
  selectedGrade: 4,
  quiz: {
    questions: [],
    currentIndex: 0,
    answers: [],
    timer: 0,
    timerInterval: null,
    selectedAnswer: null,
    fillAnswer: '',
    showResult: false,
  },
  progress: {},
  totalStars: 0,
  totalScore: 0,
  streakDays: 1,
  wrongBook: [],
};

// ==================== APP ====================
const app = {
  init() {
    this.loadProgress();
    this.renderGradeSelector();
    this.renderHome();
    this.renderReport();
    this.renderWrongBook();
    this.bindEvents();
  },

  bindEvents() {
    // 年级选择 - 事件委托
    document.getElementById('grade-selector').addEventListener('click', (e) => {
      const btn = e.target.closest('.grade-btn');
      if (btn) {
        const grade = parseInt(btn.dataset.grade);
        if (grade) this.selectGrade(grade);
      }
    });

    // 星球卡片点击 - 事件委托
    document.getElementById('planets-grid').addEventListener('click', (e) => {
      const card = e.target.closest('.planet-card');
      if (card && !card.classList.contains('locked')) {
        const planetId = card.dataset.planetId;
        if (planetId) this.goPlanet(planetId);
      }
    });

    // 关卡列表点击 - 事件委托
    document.getElementById('levels-list').addEventListener('click', (e) => {
      const item = e.target.closest('.level-item');
      if (item && !item.classList.contains('locked')) {
        const planetId = item.dataset.planetId;
        const levelId = item.dataset.levelId;
        if (planetId && levelId) this.startQuiz(planetId, levelId);
      }
    });
  },

  loadProgress() {
    const saved = localStorage.getItem('mathPlanetProgress');
    if (saved) {
      const data = JSON.parse(saved);
      state.progress = data.progress || {};
      state.totalStars = data.totalStars || 0;
      state.totalScore = data.totalScore || 0;
      state.streakDays = data.streakDays || 1;
      state.wrongBook = data.wrongBook || [];
      state.selectedGrade = data.selectedGrade || 4;
    }
  },

  saveProgress() {
    localStorage.setItem('mathPlanetProgress', JSON.stringify({
      progress: state.progress,
      totalStars: state.totalStars,
      totalScore: state.totalScore,
      streakDays: state.streakDays,
      wrongBook: state.wrongBook,
      selectedGrade: state.selectedGrade,
    }));
  },

  switchTab(page) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
    const pageMap = { home: 'page-home', knowledge: 'page-knowledge', report: 'page-report', wrongbook: 'page-wrongbook' };
    this.showPage(pageMap[page] || 'page-home');
    state.currentPage = page;
    if (page === 'report') this.renderReport();
    if (page === 'wrongbook') this.renderWrongBook();
    if (page === 'knowledge') this.renderKnowledgeOverview();
  },

  showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
  },

  goHome() {
    this.showPage('page-home');
    this.renderGradeSelector();
    this.renderHome();
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector('.nav-item[data-page="home"]').classList.add('active');
  },

  // ==================== HOME ====================
  renderGradeSelector() {
    const el = document.getElementById('grade-selector');
    el.innerHTML = [4, 5].map(g => `
      <span class="grade-btn ${state.selectedGrade === g ? 'active' : ''}" data-grade="${g}">${g}年级</span>
    `).join('');
  },

  selectGrade(grade) {
    if (state.selectedGrade === grade) return;
    state.selectedGrade = grade;
    this.saveProgress();
    this.renderGradeSelector();
    this.renderHome();
  },

  getFilteredPlanets() {
    return PLANETS.filter(p => p.grade === state.selectedGrade);
  },

  renderHome() {
    document.getElementById('home-stars').textContent = state.totalStars;
    document.getElementById('home-streak').textContent = state.streakDays;
    const filteredPlanets = this.getFilteredPlanets();
    const totalLevels = filteredPlanets.reduce((s, p) => s + p.levels, 0);
    const completed = filteredPlanets.reduce((s, p) => {
      const planetProg = state.progress[p.id] || {};
      return s + Object.values(planetProg).filter(l => l.completed).length;
    }, 0);
    document.getElementById('home-progress').textContent = (totalLevels > 0 ? Math.round((completed / totalLevels) * 100) : 0) + '%';

    const grid = document.getElementById('planets-grid');
    grid.innerHTML = filteredPlanets.map((planet, idx) => {
      const planetProg = state.progress[planet.id] || {};
      const completedLevels = Object.values(planetProg).filter(l => l.completed).length;
      const percent = Math.round((completedLevels / planet.levels) * 100);
      const isUnlocked = idx === 0 || (state.progress[filteredPlanets[idx-1].id] && Object.values(state.progress[filteredPlanets[idx-1].id]).filter(l => l.completed).length >= 2);

      return `
        <div class="planet-card ${isUnlocked ? '' : 'locked'}" data-planet-id="${planet.id}">
          <div class="planet-badge" style="background:${planet.bg}">${planet.badge}</div>
          <div class="planet-icon" style="background:${planet.bg};color:${planet.color}"><span class="planet-emoji">${planet.emoji}</span><span class="planet-icon-text">${planet.name[0]}</span></div>
          <div class="planet-name">${planet.name}</div>
          <div class="planet-sub">${planet.subject}</div>
          <div class="planet-progress-bar"><div class="planet-progress-fill" style="width:${percent}%;background:${planet.color}"></div></div>
          <div class="planet-progress-text">${completedLevels}/${planet.levels} 关</div>
          ${!isUnlocked ? '<div class="lock-overlay">&#128274;</div>' : ''}
        </div>
      `;
    }).join('');
  },

  goPlanet(planetId) {
    state.currentPlanet = planetId;
    const planet = PLANETS.find(p => p.id === planetId);
    const header = document.getElementById('planet-header');
    header.style.background = `linear-gradient(135deg, ${planet.color}, ${planet.color}dd)`;
    document.getElementById('planet-title').textContent = planet.name;
    document.getElementById('planet-sub').textContent = `${planet.grade}年级 · ${planet.subject}`;

    const planetProg = state.progress[planetId] || {};
    const completed = Object.values(planetProg).filter(l => l.completed).length;
    document.getElementById('planet-progress-fill').style.width = (completed / planet.levels * 100) + '%';
    document.getElementById('planet-progress-text').textContent = `${completed}/${planet.levels}`;

    const list = document.getElementById('levels-list');
    list.innerHTML = Array.from({ length: planet.levels }, (_, i) => {
      const levelId = `l${i + 1}`;
      const levelProg = planetProg[levelId];
      const isCompleted = levelProg?.completed;
      const isCurrent = !isCompleted && (i === 0 || planetProg[`l${i}`]?.completed);
      const isLocked = !isCompleted && !isCurrent;
      const stars = levelProg?.stars || 0;
      const topic = TOPICS[planetId]?.[i]?.name || '综合练习';

      return `
        <div class="level-item ${isLocked ? 'locked' : isCurrent ? 'current' : ''}" data-planet-id="${planetId}" data-level-id="${levelId}">
          <div class="level-icon ${isCompleted ? 'done' : isCurrent ? 'current' : 'locked'}">${isCompleted ? '🏆' : isLocked ? '🔒' : '🚀'}</div>
          <div class="level-info">
            <div class="level-name">第 ${i + 1} 关</div>
            <div class="level-topic">${topic}</div>
          </div>
          <div class="level-stars">
            ${[1,2,3].map(n => `<span class="star ${n <= stars ? 'on' : ''}">&#11088;</span>`).join('')}
          </div>
        </div>
      `;
    }).join('');

    this.showPage('page-planet');
  },

  goBackToPlanet() {
    if (state.currentPlanet) this.goPlanet(state.currentPlanet);
    else this.goHome();
  },

  // ==================== QUIZ ====================
  startQuiz(planetId, levelId) {
    state.currentPlanet = planetId;
    state.currentLevel = levelId;
    const planet = PLANETS.find(p => p.id === planetId);
    const levelNum = parseInt(levelId.replace('l', ''));
    document.getElementById('quiz-title').textContent = `第${levelNum}关 · ${planet.name}`;

    const allQuestions = QUESTIONS[planetId] || [];
    state.quiz.questions = allQuestions.filter(q => q.level === levelId);
    if (state.quiz.questions.length === 0) {
      state.quiz.questions = this.generateQuestions(planetId, levelId);
    }
    state.quiz.currentIndex = 0;
    state.quiz.answers = [];
    state.quiz.timer = 0;
    state.quiz.selectedAnswer = null;
    state.quiz.fillAnswer = '';
    state.quiz.showResult = false;

    this.startTimer();
    this.renderQuestion();
    this.showPage('page-quiz');
  },

  generateQuestions(planetId, levelId) {
    const templates = [
      { type: 'choice', content: '计算：12 + 25 = ?', options: ['35', '37', '36', '38'], answer: 1, explanation: '12 + 25 = 37', point: '基础运算' },
      { type: 'fill', content: '15 - 7 = ?', answer: '8', explanation: '15 - 7 = 8', point: '基础运算' },
    ];
    return templates.map((t, i) => ({ ...t, id: `${planetId}${levelId}g${i}`, level: levelId }));
  },

  startTimer() {
    if (state.quiz.timerInterval) clearInterval(state.quiz.timerInterval);
    state.quiz.timerInterval = setInterval(() => {
      state.quiz.timer++;
      const m = Math.floor(state.quiz.timer / 60).toString().padStart(2, '0');
      const s = (state.quiz.timer % 60).toString().padStart(2, '0');
      document.getElementById('quiz-timer').textContent = `${m}:${s}`;
    }, 1000);
  },

  stopTimer() {
    if (state.quiz.timerInterval) {
      clearInterval(state.quiz.timerInterval);
      state.quiz.timerInterval = null;
    }
  },

  renderQuestion() {
    const q = state.quiz.questions[state.quiz.currentIndex];
    const total = state.quiz.questions.length;
    document.getElementById('quiz-progress').style.width = ((state.quiz.currentIndex + 1) / total * 100) + '%';

    const body = document.getElementById('quiz-body');
    const decoHTML = '<span class="quiz-deco qd1">🚀</span><span class="quiz-deco qd2">💡</span>';
    if (q.type === 'choice') {
      body.innerHTML = `
        ${decoHTML}
        <div class="question-card">
          <div class="question-num">题目 ${state.quiz.currentIndex + 1} / ${total} · ${q.point}</div>
          <div class="question-text">${q.content}</div>
        </div>
        <div class="options-list">
          ${q.options.map((opt, idx) => `
            <div class="option" id="opt-${idx}" onclick="app.selectOption(${idx})">
              <div class="option-label">${['A','B','C','D'][idx]}</div>
              <div class="option-text">${opt}</div>
            </div>
          `).join('')}
        </div>
      `;
    } else {
      body.innerHTML = `
        ${decoHTML}
        <div class="question-card">
          <div class="question-num">题目 ${state.quiz.currentIndex + 1} / ${total} · ${q.point}</div>
          <div class="question-text">${q.content}</div>
        </div>
        <div class="fill-area">
          <input type="text" class="fill-input" id="fill-input" placeholder="请输入答案" onkeypress="if(event.key==='Enter')app.submitFill()">
          <button class="submit-btn" onclick="app.submitFill()">提交答案</button>
        </div>
      `;
      setTimeout(() => document.getElementById('fill-input')?.focus(), 100);
    }
  },

  selectOption(index) {
    if (state.quiz.showResult) return;
    state.quiz.selectedAnswer = index;
    document.querySelectorAll('.option').forEach((el, i) => {
      el.classList.toggle('selected', i === index);
    });
    setTimeout(() => this.checkAnswer(), 300);
  },

  submitFill() {
    const input = document.getElementById('fill-input');
    if (!input || !input.value.trim()) return;
    state.quiz.fillAnswer = input.value.trim();
    this.checkAnswer();
  },

  checkAnswer() {
    const q = state.quiz.questions[state.quiz.currentIndex];
    let isCorrect = false;
    let userAns = null;

    if (q.type === 'choice') {
      isCorrect = state.quiz.selectedAnswer === q.answer;
      userAns = state.quiz.selectedAnswer;
      document.querySelectorAll('.option').forEach((el, i) => {
        el.classList.add('disabled');
        if (i === q.answer) el.classList.add('correct');
        else if (i === state.quiz.selectedAnswer && !isCorrect) el.classList.add('wrong');
      });
    } else {
      isCorrect = state.quiz.fillAnswer === q.answer;
      userAns = state.quiz.fillAnswer;
    }

    state.quiz.answers.push({ questionId: q.id, isCorrect, userAnswer: userAns });

    if (!isCorrect) {
      state.wrongBook.push({ question: q, planetId: state.currentPlanet, wrongCount: 1, mastered: false });
    }

    setTimeout(() => this.showFeedback(isCorrect, q.explanation), 400);
  },

  showFeedback(isCorrect, explanation) {
    const overlay = document.getElementById('feedback-overlay');
    document.getElementById('feedback-icon').innerHTML = isCorrect ? '&#127775;' : '&#10060;';
    document.getElementById('feedback-title').textContent = isCorrect ? '回答正确！' : '回答错误';
    document.getElementById('feedback-title').style.color = isCorrect ? '#22C55E' : '#EF4444';
    document.getElementById('feedback-explanation').textContent = explanation;
    document.getElementById('feedback-btn').textContent = state.quiz.currentIndex >= state.quiz.questions.length - 1 ? '查看结果' : '下一题';
    overlay.classList.remove('hidden');
  },

  feedbackNext() {
    document.getElementById('feedback-overlay').classList.add('hidden');
    if (state.quiz.currentIndex >= state.quiz.questions.length - 1) {
      this.finishQuiz();
    } else {
      state.quiz.currentIndex++;
      state.quiz.selectedAnswer = null;
      state.quiz.fillAnswer = '';
      state.quiz.showResult = false;
      this.renderQuestion();
    }
  },

  finishQuiz() {
    this.stopTimer();
    const correct = state.quiz.answers.filter(a => a.isCorrect).length;
    const total = state.quiz.questions.length;
    const accuracy = Math.round((correct / total) * 100);
    let stars = accuracy >= 100 ? 3 : accuracy >= 70 ? 2 : accuracy >= 40 ? 1 : 0;
    const score = correct * 10 + stars * 5;

    // Save progress
    if (!state.progress[state.currentPlanet]) state.progress[state.currentPlanet] = {};
    const existing = state.progress[state.currentPlanet][state.currentLevel];
    const newStars = existing ? Math.max(existing.stars || 0, stars) : stars;
    const newScore = existing ? Math.max(existing.score || 0, score) : score;

    // 记录每道题的答题历史，用于知识点掌握度统计
    const history = state.quiz.questions.map((q, idx) => ({
      questionId: q.id,
      point: q.point,
      correct: state.quiz.answers[idx]?.isCorrect || false,
    }));

    // 合并历史记录（保留之前做过的不同题目记录）
    const prevHistory = existing?.history || [];
    const prevQIds = new Set(prevHistory.map(h => h.questionId));
    const mergedHistory = [...prevHistory];
    history.forEach(h => {
      if (!prevQIds.has(h.questionId)) {
        mergedHistory.push(h);
      }
    });

    state.progress[state.currentPlanet][state.currentLevel] = { completed: true, stars: newStars, score: newScore, history: mergedHistory };
    state.totalStars += (newStars - (existing?.stars || 0));
    state.totalScore += (newScore - (existing?.score || 0));
    this.saveProgress();

    // Render result
    document.querySelectorAll('.result-star').forEach((el, i) => {
      el.classList.toggle('earned', i < stars);
    });
    document.getElementById('result-title').textContent = stars === 3 ? '完美通关！' : stars >= 1 ? '挑战成功！' : '继续加油！';
    document.getElementById('result-sub').textContent = stars === 3 ? '你是真正的数学小达人！' : stars >= 1 ? '再接再厉，争取满分！' : '建议复习后再挑战';
    document.getElementById('result-mascot').textContent = stars === 3 ? '🏆' : stars >= 1 ? '🎉' : '💪';
    document.getElementById('result-score').textContent = score;
    document.getElementById('result-accuracy').textContent = accuracy + '%';
    const m = Math.floor(state.quiz.timer / 60);
    const s = (state.quiz.timer % 60).toString().padStart(2, '0');
    document.getElementById('result-time').textContent = `${m}:${s}`;

    const nextBtn = document.getElementById('result-next-btn');
    const planet = PLANETS.find(p => p.id === state.currentPlanet);
    const levelNum = parseInt(state.currentLevel.replace('l', ''));
    if (levelNum >= planet.levels) {
      nextBtn.textContent = '返回星球';
      nextBtn.onclick = () => app.goPlanet(state.currentPlanet);
    } else {
      nextBtn.textContent = '下一关';
      nextBtn.onclick = () => app.startQuiz(state.currentPlanet, `l${levelNum + 1}`);
    }

    const suggestion = document.getElementById('result-suggestion');
    if (accuracy < 80) {
      suggestion.style.display = 'block';
      document.getElementById('suggestion-text').textContent = accuracy < 50 ? '建议重新复习相关知识点后再挑战。' : '表现不错！再练习几道题巩固一下吧。';
    } else {
      suggestion.style.display = 'none';
    }

    if (stars >= 2) this.launchConfetti();
    this.showPage('page-result');
  },

  nextLevel() {
    // handled by onclick in finishQuiz
  },

  retryLevel() {
    this.startQuiz(state.currentPlanet, state.currentLevel);
  },

  goToDailyChallenge() {
    this.startQuiz('p1', 'l1');
  },

  // ==================== CONFETTI ====================
  launchConfetti() {
    const container = document.getElementById('confetti-container');
    container.classList.remove('hidden');
    container.innerHTML = '';
    const colors = ['#E86A33', '#4A9B8E', '#8B5CF6', '#F59E0B', '#EC4899', '#3B82F6', '#22C55E'];
    for (let i = 0; i < 50; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      el.style.width = (6 + Math.random() * 8) + 'px';
      el.style.height = (6 + Math.random() * 8) + 'px';
      el.style.animationDelay = (Math.random() * 2) + 's';
      el.style.animationDuration = (2 + Math.random() * 2) + 's';
      container.appendChild(el);
    }
    setTimeout(() => container.classList.add('hidden'), 4000);
  },

  // ==================== KNOWLEDGE OVERVIEW ====================

  // 获取某个知识点的答题统计
  getPointStats(planetId, pointName) {
    const questions = (QUESTIONS[planetId] || []).filter(q => q.point === pointName);
    const total = questions.length;
    // 从答题记录中查找该知识点的答题结果
    const levelId = questions[0]?.level;
    if (!levelId) return { total, correct: 0, wrong: 0, rate: 0 };
    const quizHistory = state.progress[planetId]?.[levelId]?.history || [];
    const pointQIds = new Set(questions.map(q => q.id));
    const relatedAnswers = quizHistory.filter(a => pointQIds.has(a.questionId));
    const correct = relatedAnswers.filter(a => a.correct).length;
    const wrong = relatedAnswers.filter(a => !a.correct).length;
    const answered = correct + wrong;
    const rate = answered > 0 ? Math.round((correct / answered) * 100) : 0;
    return { total, correct, wrong, answered, rate };
  },

  getKnowledgeMap() {
    const filteredPlanets = this.getFilteredPlanets();
    return filteredPlanets.map(planet => {
      const topics = TOPICS[planet.id] || [];
      const planetProg = state.progress[planet.id] || {};

      // 判断关卡解锁状态
      const allLevels = [];
      topics.forEach((topic, idx) => {
        const levelId = 'l' + (idx + 1);
        const prevLevel = 'l' + idx;
        const isUnlocked = idx === 0 || (planetProg[prevLevel] && planetProg[prevLevel].completed);
        const levelProg = planetProg[levelId];
        const isCompleted = levelProg && levelProg.completed;
        const stars = levelProg ? levelProg.stars || 0 : 0;
        allLevels.push({ levelId, levelIdx: idx + 1, isUnlocked, isCompleted, stars });
      });

      // 每个独立知识点的状态
      const knowledgePoints = topics.map((topicObj, idx) => {
        const stats = this.getPointStats(planet.id, topicObj.name);
        const level = allLevels[idx];
        let status = 'locked'; // locked | learning | mastered
        if (level.isUnlocked) {
          if (stats.answered > 0 && stats.rate >= 80) {
            status = 'mastered';
          } else if (stats.answered > 0) {
            status = 'learning';
          } else {
            status = 'learning'; // 解锁了但没做过也算学习中
          }
        }
        return { name: topicObj.name, desc: topicObj.desc, example: topicObj.example, stats, level, status };
      });

      const completedLevels = allLevels.filter(l => l.isCompleted).length;
      const masteredCount = knowledgePoints.filter(p => p.status === 'mastered').length;

      return { planet, topics, allLevels, knowledgePoints, completedLevels, masteredCount };
    });
  },

  toggleKoDetail(uid) {
    const el = document.getElementById('ko-detail-' + uid);
    if (!el) return;
    const isHidden = el.classList.contains('hidden');
    el.classList.toggle('hidden');
    // 旋转按钮
    const btn = el.closest('.ko-item').querySelector('.ko-toggle-btn');
    if (btn) btn.style.transform = isHidden ? 'rotate(180deg)' : '';
  },

  renderKnowledgeOverview() {
    const knowledgeMap = this.getKnowledgeMap();
    const gradeLabel = state.selectedGrade === 4 ? '四年级' : '五年级';

    // 统计全部知识点
    const allPoints = knowledgeMap.flatMap(g => g.knowledgePoints);
    const mastered = allPoints.filter(p => p.status === 'mastered').length;
    const learning = allPoints.filter(p => p.status === 'learning').length;
    const locked = allPoints.filter(p => p.status === 'locked').length;
    const total = allPoints.length;

    document.getElementById('knowledge-grade-label').textContent = `${gradeLabel} · 共${total}个知识点`;
    document.getElementById('ko-mastered').textContent = mastered;
    document.getElementById('ko-learning').textContent = learning;
    document.getElementById('ko-locked').textContent = locked;

    const list = document.getElementById('knowledge-overview-list');
    list.innerHTML = knowledgeMap.map(group => {
      const { planet, knowledgePoints, completedLevels, allLevels } = group;

      return `
        <div class="ko-planet-group">
          <div class="ko-planet-header">
            <div class="ko-planet-icon" style="background:${planet.bg}">${planet.emoji}</div>
            <div>
              <div class="ko-planet-name">${planet.name}</div>
              <div class="ko-planet-sub">${planet.subject}</div>
            </div>
            <div class="ko-planet-progress">${completedLevels}/${allLevels.length}</div>
          </div>
          ${knowledgePoints.map(kp => {
            const { name, desc, example, stats, level, status } = kp;
            const statusIcon = status === 'mastered' ? '✅' : status === 'learning' ? (stats.answered > 0 ? '📝' : '🔓') : '🔒';
            const statusLabel = status === 'mastered' ? '已掌握' : status === 'learning' ? (stats.answered > 0 ? '学习中' : '待挑战') : '未解锁';
            const rateText = stats.answered > 0 ? `${stats.rate}%` : '--';
            const rateColor = status === 'mastered' ? 'var(--green)' : stats.answered > 0 ? 'var(--yellow)' : 'var(--muted)';
            const uid = `${kp.name}_${level.levelIdx}`;

            return `
              <div class="ko-item ${status === 'locked' ? 'locked' : ''}">
                <div class="ko-status-icon ${status}">${statusIcon}</div>
                <div class="ko-info">
                  <div class="ko-name-row">
                    <span class="ko-name">${name}</span>
                    <span class="ko-toggle-btn" onclick="app.toggleKoDetail('${uid}')">💡</span>
                  </div>
                  <div class="ko-meta">
                    第${level.levelIdx}关 · ${stats.total}题
                    ${stats.answered > 0 ? ` · 答对${stats.correct}/${stats.answered}` : ''}
                  </div>
                  <div class="ko-detail hidden" id="ko-detail-${uid}">
                    <div class="ko-detail-desc">${desc}</div>
                    <div class="ko-detail-example">
                      <span class="ko-example-tag">例题</span>
                      <span class="ko-example-text">${example}</span>
                    </div>
                  </div>
                </div>
                <div class="ko-right">
                  ${stats.answered > 0 ? `
                    <div class="ko-rate-ring" style="--rate:${stats.rate}%;--ring-color:${rateColor}">
                      <svg viewBox="0 0 36 36" width="36" height="36">
                        <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
                        <circle cx="18" cy="18" r="15" fill="none" stroke="${rateColor}" stroke-width="3"
                          stroke-dasharray="${stats.rate * 0.9425} ${94.25 - stats.rate * 0.9425}"
                          stroke-dashoffset="23.56" stroke-linecap="round" transform="rotate(-90 18 18)"
                          style="transition:stroke-dasharray 0.8s ease"/>
                      </svg>
                      <span class="ko-rate-text">${rateText}</span>
                    </div>
                  ` : `
                    <div class="ko-stars">
                      ${[1,2,3].map(n => `<span class="${n <= level.stars ? 'on' : ''}">&#11088;</span>`).join('')}
                    </div>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }).join('');
  },

  // ==================== REPORT ====================
  renderReport() {
    const filteredPlanets = this.getFilteredPlanets();
    const totalLevels = filteredPlanets.reduce((s, p) => s + p.levels, 0);
    const completed = filteredPlanets.reduce((s, p) => {
      const planetProg = state.progress[p.id] || {};
      return s + Object.values(planetProg).filter(l => l.completed).length;
    }, 0);
    document.getElementById('report-levels').textContent = completed;
    document.getElementById('report-stars').textContent = state.totalStars;
    document.getElementById('report-streak').textContent = state.streakDays;

    const knowledgeData = filteredPlanets.map(p => ({
      name: p.subject,
      percent: this.calcPlanetProgress(p.id),
      color: p.color,
    }));

    document.getElementById('knowledge-list').innerHTML = knowledgeData.map(k => `
      <div class="knowledge-item">
        <div class="knowledge-header">
          <span class="knowledge-name">${k.name}</span>
          <span class="knowledge-percent">${k.percent}%</span>
        </div>
        <div class="knowledge-bar">
          <div class="knowledge-fill" style="width:${k.percent}%;background:${k.color}"></div>
        </div>
      </div>
    `).join('');
  },

  calcPlanetProgress(planetId) {
    const planet = PLANETS.find(p => p.id === planetId);
    const prog = state.progress[planetId] || {};
    const completed = Object.values(prog).filter(l => l.completed).length;
    return Math.round((completed / planet.levels) * 100);
  },

  // ==================== WRONGBOOK ====================
  renderWrongBook() {
    const list = document.getElementById('wrong-list');
    if (state.wrongBook.length === 0) {
      list.innerHTML = `
        <div style="text-align:center;padding:80px 20px">
          <span class="wrong-empty-emoji">📚</span>
          <div style="font-size:20px;font-weight:700;margin-bottom:8px">还没有错题</div>
          <div style="font-size:14px;color:var(--muted)">快去挑战关卡，错题会自动收录到这里</div>
        </div>
      `;
      return;
    }
    list.innerHTML = state.wrongBook.map((w, i) => {
      const planet = PLANETS.find(p => p.id === w.planetId);
      return `
        <div class="wrong-item">
          <div class="wrong-planet">${planet?.name || '未知星球'}</div>
          <div class="wrong-content">${w.question.content}</div>
          <div class="wrong-status">
            <span class="wrong-tag ${w.mastered ? 'mastered' : ''}">${w.mastered ? '已掌握' : '待复习'}</span>
            <span class="wrong-tag">错 ${w.wrongCount} 次</span>
          </div>
        </div>
      `;
    }).join('');
  },
};

// Init
app.init();
</script>
</body>
</html>
