<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证书水印管理系统 · 演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #0F3D2E;
    --green-mid: #1B5240;
    --green-soft: #2E6B56;
    --gold: #C9A24B;
    --gold-soft: #D9B870;
    --gold-dim: #8C7239;
    --cream: #F7F3EA;
    --cream-warm: #F1E9D6;
    --paper: #FBF8F1;
    --charcoal: #1F2421;
    --ink: #2A2F2C;
    --muted: #6B6F6B;
    --line: #E5DDC8;
    --danger: #B23A48;
    --success: #2E6B56;
    --shadow: 0 1px 3px rgba(15, 61, 46, 0.06), 0 8px 24px rgba(15, 61, 46, 0.08);
    --shadow-lg: 0 4px 12px rgba(15, 61, 46, 0.1), 0 24px 48px rgba(15, 61, 46, 0.14);
    --radius: 4px;
    --radius-md: 8px;
    --radius-lg: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* 全局文本防溢出：长中文字符串自动换行 */
  body { word-break: break-word; overflow-wrap: break-word; }
  /* flex/grid 子元素允许收缩，防止内容撑破容器 */
  .lib-row > *, .app-card > *, .cert-card > *, .case-card > *, .delegate-card > *, .delegate-pick > * { min-width: 0; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(201, 162, 75, 0.04) 0%, transparent 35%),
      radial-gradient(circle at 88% 82%, rgba(15, 61, 46, 0.04) 0%, transparent 38%);
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: var(--green-deep); text-decoration: none; }

  .app {
    display: grid;
    grid-template-columns: 248px 1fr;
    grid-template-rows: 68px 1fr;
    grid-template-areas: "sidebar topbar" "sidebar main";
    height: 100vh;
  }

  .sidebar {
    grid-area: sidebar;
    background: var(--green-deep);
    background-image:
      linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.15) 100%),
      radial-gradient(circle at 0% 0%, rgba(201, 162, 75, 0.12) 0%, transparent 50%);
    color: var(--cream);
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(201, 162, 75, 0.2);
  }
  .brand {
    padding: 18px 24px 22px;
    border-bottom: 1px solid rgba(201, 162, 75, 0.18);
    display: flex; align-items: center; gap: 12px;
  }
  .brand-mark {
    width: 36px; height: 36px;
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold);
    font-family: 'Noto Serif SC', serif;
    font-weight: 700; font-size: 18px;
    position: relative;
  }
  .brand-mark::after {
    content: '';
    position: absolute; inset: 3px;
    border: 0.5px solid rgba(201, 162, 75, 0.4);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text .t1 {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700; font-size: 15px;
    color: var(--gold); letter-spacing: 0.04em;
  }
  .brand-text .t2 {
    font-size: 10px;
    color: rgba(247, 243, 234, 0.5);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .nav { padding: 16px 12px; flex: 1; overflow-y: auto; }
  .nav-section-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(201, 162, 75, 0.7);
    padding: 14px 14px 8px;
    font-weight: 500;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    color: rgba(247, 243, 234, 0.78);
    cursor: pointer;
    border-radius: var(--radius);
    font-size: 13.5px; font-weight: 400;
    margin-bottom: 2px;
    transition: all 0.18s ease;
    position: relative;
    border-left: 2px solid transparent;
  }
  .nav-item:hover { background: rgba(201, 162, 75, 0.08); color: var(--cream); }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(201, 162, 75, 0.18) 0%, rgba(201, 162, 75, 0.04) 100%);
    color: var(--gold); font-weight: 500;
  }
  .nav-item.active::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 3px; background: var(--gold);
  }
  .nav-icon {
    width: 18px; height: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; opacity: 0.85;
  }
  .nav-badge {
    margin-left: auto;
    background: var(--gold);
    color: var(--green-deep);
    font-size: 10px; font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
    min-width: 18px; text-align: center;
  }
  .sidebar-foot {
    padding: 14px 24px;
    border-top: 1px solid rgba(201, 162, 75, 0.18);
    font-size: 11px;
    color: rgba(247, 243, 234, 0.4);
    letter-spacing: 0.08em;
  }

  .topbar {
    grid-area: topbar;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center;
    padding: 0 28px; gap: 18px;
    backdrop-filter: blur(8px);
  }
  .breadcrumb {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 12.5px;
    min-width: 0; overflow: hidden;
  }
  .breadcrumb > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .breadcrumb .sep { opacity: 0.4; }
  .breadcrumb .current { color: var(--green-deep); font-weight: 500; }
  .topbar-spacer { flex: 1; }
  .role-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 12px;
    background: var(--cream-warm);
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 11px;
    color: var(--green-deep);
    font-weight: 500; letter-spacing: 0.04em;
  }
  .role-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  .notif {
    position: relative;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--cream);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all 0.18s;
  }
  .notif:hover { background: var(--cream-warm); }
  .notif-dot {
    position: absolute; top: 8px; right: 8px;
    width: 7px; height: 7px;
    background: var(--danger);
    border-radius: 50%;
    border: 1.5px solid var(--paper);
  }
  .user-switcher {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 14px 5px 6px;
    background: var(--green-deep);
    border-radius: 22px;
    cursor: pointer;
    transition: all 0.18s;
    border: 1px solid var(--green-mid);
  }
  .user-switcher:hover { background: var(--green-mid); }
  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--green-deep);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    font-family: 'Noto Serif SC', serif;
  }
  .user-meta { color: var(--cream); }
  .user-meta .name { font-size: 13px; font-weight: 500; line-height: 1.1; }
  .user-meta .role { font-size: 10.5px; color: rgba(247, 243, 234, 0.6); letter-spacing: 0.06em; }
  .chev { color: var(--gold); font-size: 10px; }

  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 28px 32px 56px;
  }
  .page-head {
    margin-bottom: 24px;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  .page-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px; font-weight: 700;
    color: var(--green-deep);
    line-height: 1.2; letter-spacing: -0.01em;
  }
  .page-title .accent {
    display: inline-block;
    width: 28px; height: 2px;
    background: var(--gold);
    vertical-align: middle;
    margin-right: 10px;
  }
  .page-sub {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
    max-width: 640px;
  }
  .actions { display: flex; gap: 10px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px;
    border-radius: var(--radius-md);
    font-size: 13px; font-weight: 500;
    transition: all 0.18s;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .btn-primary { background: var(--green-deep); color: var(--cream); border-color: var(--green-deep); }
  .btn-primary:hover { background: var(--green-mid); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15, 61, 46, 0.22); }
  .btn-gold { background: var(--gold); color: var(--green-deep); border-color: var(--gold); font-weight: 600; }
  .btn-gold:hover { background: var(--gold-soft); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(201, 162, 75, 0.3); }
  .btn-outline { background: transparent; color: var(--green-deep); border-color: var(--line); }
  .btn-outline:hover { border-color: var(--gold); background: var(--cream-warm); }
  .btn-ghost { background: transparent; color: var(--muted); padding: 6px 10px; }
  .btn-ghost:hover { color: var(--green-deep); background: var(--cream-warm); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--line); }
  .btn-danger:hover { background: var(--danger); color: var(--cream); border-color: var(--danger); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .grid-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: var(--gold);
    transform: scaleX(0.3);
    transform-origin: left;
    transition: transform 0.3s;
  }
  .stat-card:hover::before { transform: scaleX(1); }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .stat-label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 8px; }
  .stat-value {
    font-family: 'Noto Serif SC', serif;
    font-size: 36px; font-weight: 700;
    color: var(--green-deep);
    line-height: 1;
  }
  .stat-value .unit { font-size: 13px; color: var(--muted); margin-left: 4px; font-family: 'Noto Sans SC'; font-weight: 400; }
  .stat-icon { position: absolute; top: 16px; right: 18px; font-size: 20px; opacity: 0.5; }
  .stat-trend { font-size: 11px; color: var(--success); margin-top: 8px; }

  .grid-cert {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 18px;
  }
  .cert-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: all 0.2s;
    display: flex; flex-direction: column;
  }
  .cert-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--gold-soft); }
  .cert-thumb {
    aspect-ratio: 4 / 3;
    background: var(--cream-warm);
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .cert-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cert-thumb .status-flag {
    position: absolute; top: 10px; left: 10px;
    background: var(--green-deep);
    color: var(--gold);
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 3px;
    letter-spacing: 0.06em;
    font-weight: 500;
  }
  .cert-thumb .status-flag.expired { background: var(--danger); color: var(--cream); }
  .cert-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; }
  .cert-name {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700; color: var(--green-deep);
    font-size: 15px; line-height: 1.35;
    margin-bottom: 4px;
    word-break: break-word; overflow-wrap: break-word;
  }
  .cert-type {
    font-size: 11.5px; color: var(--gold-dim);
    letter-spacing: 0.04em;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .cert-meta {
    font-size: 12px; color: var(--muted);
    line-height: 1.7;
    margin-bottom: 12px;
    flex: 1;
    min-width: 0;
  }
  .cert-meta .row { display: flex; gap: 6px; min-width: 0; }
  .cert-meta .k { color: var(--muted); min-width: 60px; flex-shrink: 0; }
  .cert-meta .v { color: var(--ink); word-break: break-all; overflow-wrap: break-word; min-width: 0; }
  .cert-actions {
    display: flex; gap: 6px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }

  .toolbar {
    display: flex; gap: 10px; align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    padding: 14px 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
  }
  .search-input {
    flex: 1; min-width: 200px;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--cream);
    color: var(--ink);
    transition: all 0.18s;
  }
  .search-input:focus { outline: none; border-color: var(--gold); background: var(--paper); }
  .filter-select {
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--cream);
    cursor: pointer;
  }
  .filter-select:focus { outline: none; border-color: var(--gold); }

  .library-table {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .lib-row {
    display: grid;
    grid-template-columns: 40px 60px minmax(120px, 2fr) minmax(80px, 1fr) minmax(100px, 1.2fr) minmax(90px, 110px) minmax(100px, auto);
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
  }
  .lib-row > div { min-width: 0; overflow: hidden; }
  .lib-row.header {
    background: var(--cream-warm);
    font-size: 11px;
    color: var(--green-deep);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 12px 20px;
  }
  .lib-row:not(.header):hover { background: var(--cream); }
  .lib-row:last-child { border-bottom: none; }
  .lib-thumb {
    width: 60px; height: 45px;
    background: var(--cream-warm);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--line);
    position: relative;
  }
  .lib-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .lib-name { font-family: 'Noto Serif SC', serif; font-weight: 700; color: var(--green-deep); font-size: 14px; word-break: break-word; overflow-wrap: anywhere; }
  .lib-type { color: var(--gold-dim); font-size: 12px; overflow-wrap: anywhere; }
  .lib-owner { display: flex; align-items: center; gap: 8px; font-size: 13px; overflow-wrap: anywhere; }
  .lib-owner .av { width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: var(--green-deep); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'Noto Serif SC', serif; flex-shrink: 0; }
  .lib-valid { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .lib-valid.expired { color: var(--danger); }

  /* 视图模式切换 */
  .view-toggle { display: inline-flex; background: var(--cream-warm); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
  .view-toggle .vt-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border: none; background: transparent;
    color: var(--muted); font-size: 12px; cursor: pointer;
    border-radius: 3px; transition: all 0.15s; font-family: inherit;
  }
  .view-toggle .vt-btn:hover { color: var(--green-deep); }
  .view-toggle .vt-btn.active { background: var(--green-deep); color: var(--gold); }

  /* 证书列表模式 */
  .cert-list-table { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .cert-list-row {
    display: grid;
    grid-template-columns: 60px minmax(120px, 1.6fr) minmax(120px, 1.4fr) minmax(90px, 1fr) minmax(180px, auto);
    align-items: center; gap: 16px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    transition: background 0.15s;
  }
  .cert-list-row:last-child { border-bottom: none; }
  .cert-list-row:not(.header):hover { background: var(--cream); }
  .cert-list-row.header {
    background: var(--cream-warm); font-size: 11px; color: var(--green-deep);
    letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; padding: 12px 20px;
  }
  .cert-list-row > div { min-width: 0; overflow: hidden; }
  .cert-list-row .cl-thumb { width: 50px; height: 38px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); position: relative; }
  .cert-list-row .cl-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cert-list-row .cl-thumb .status-flag { position: absolute; top: 3px; left: 3px; font-size: 8px; padding: 1px 5px; border-radius: 2px; }
  .cert-list-row .cl-thumb .thumb-page-badge { bottom: 2px; right: 2px; font-size: 8px; padding: 1px 5px; }
  .cert-list-row .cl-name .cl-title { font-family: 'Noto Serif SC', serif; font-weight: 700; color: var(--green-deep); font-size: 13px; word-break: break-word; overflow-wrap: anywhere; }
  .cert-list-row .cl-name .cl-type { color: var(--gold-dim); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .cert-list-row .cl-num { font-size: 12px; color: var(--ink); display: flex; flex-direction: column; gap: 3px; }
  .cert-list-row .cl-num .k { color: var(--muted); font-size: 11px; }
  .cert-list-row .cl-num .cl-empty { color: var(--muted); }
  .cert-list-row .cl-valid { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .cert-list-row .cl-valid.expired { color: var(--danger); }
  .cert-list-row .cl-tag { font-size: 10px; }
  .cert-list-row .cl-actions { display: flex; gap: 6px; flex-wrap: nowrap; justify-content: flex-end; overflow: visible; }
  .cert-list-row .cl-check { display: flex; justify-content: center; overflow: visible; }
  /* 含勾选列的列表（公司资质库、案例库）：多一列 */
  .cert-list-table.with-check .cert-list-row { grid-template-columns: 40px 60px minmax(120px, 1.6fr) minmax(120px, 1.4fr) minmax(90px, 1fr) minmax(180px, auto); }
  /* 案例库列表：无有效期列，5 列布局 */
  .cert-list-table.case-list .cert-list-row { grid-template-columns: 40px 60px minmax(120px, 1.6fr) minmax(140px, 1.6fr) minmax(180px, auto); }
  /* 公司资质库列表：多一列范围标识，7 列布局 */
  .cert-list-table.company-list .cert-list-row { grid-template-columns: 40px 60px 60px minmax(120px, 1.5fr) minmax(120px, 1.3fr) minmax(90px, 1fr) minmax(180px, auto); }
  .cert-list-row .cl-scope { display: flex; align-items: center; }
  .scope-tag-list {
    display: inline-block; padding: 2px 10px; border-radius: 3px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    background: rgba(201, 162, 75, 0.15); color: var(--gold-dim);
    border: 1px solid rgba(201, 162, 75, 0.4);
  }

  /* 团队证书库图例模式卡片 */
  .lib-gallery-card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius-lg); overflow: hidden;
    display: flex; flex-direction: column; transition: all 0.2s;
  }
  .lib-gallery-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--gold-soft); }
  .lib-gallery-card > .cert-thumb > .scope-flag { position: absolute; top: 10px; right: 10px; }

  /* 人员管理列表模式 */
  .pl-table { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .pl-row {
    display: grid;

/* 下载有效期：审批通过后 7 天内可下载，超过后水印图自动删除（仅保留申请记录） */
var DOWNLOAD_TTL_DAYS = 7;
function nowStr() {
  var d = new Date();
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function parseDate(s) {
  if (!s) return null;
  var str = String(s).replace(/-/g, '/');
  var d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}
function downloadExpiryInfo(app) {
  if (!app || app.status !== 'approved' || !app.decidedAt) return null;
  var decided = parseDate(app.decidedAt);
  if (!decided) return null;
  var ttl = DOWNLOAD_TTL_DAYS * 24 * 60 * 60 * 1000;
  var elapsed = Date.now() - decided.getTime();
  var remaining = ttl - elapsed;
  var expired = remaining <= 0;
  var remainDays = expired ? 0 : Math.ceil(remaining / (24 * 60 * 60 * 1000));
  return { expired: expired, remainDays: remainDays, decidedAt: app.decidedAt };
}
function downloadExpiryLabel(app) {
  var info = downloadExpiryInfo(app);
  if (!info) return '';
  if (info.expired) return '下载已过期';
  return '剩余 ' + info.remainDays + ' 天可下载';
}

function shouldBlurPreview(res) {
  if (!res) return false;
  var me = currentUser();
  if (res.ownerId === me.id) return false;
  if (res.scope === 'company' && me.role === 'admin') return false;
  return true;
}

  var me = currentUser();

  return false;
}
function pageCountOf(res) { return (res._images || [res._imageDataUrl]).length; }
function previewHTML(res, maxH, opts) {
  opts = opts || {};
  maxH = maxH || 340;
  var imgs = res._images || [res._imageDataUrl];
  var blur = !opts.forceClear && shouldBlurPreview(res);
  if (blur) {
    return '<div class="preview-blur-wrap" style="max-height:' + maxH + 'px">' +
      '<img class="preview-blurred" src="' + imgs[0] + '" alt="模糊预览">' +
      '<div class="preview-blur-badge">🔒 审批前仅可查看模糊预览<span class="sub">通过审批后可下载带水印清晰版</span></div>' +
    '</div>';
  }
  var note = opts.note ? '<div style="margin-top:8px;font-size:11px;color:var(--muted)">👁 ' + opts.note + '</div>' : '';
  if (imgs.length === 1) {
    return '<img src="' + imgs[0] + '" style="max-width:100%;max-height:' + maxH + 'px;border-radius:var(--radius-md);box-shadow:var(--shadow);border:1px solid var(--line)">' + note;
  }
  var pages = imgs.map(function(src, idx) {
    return '<div class="multi-page-item">' +
      '<img src="' + src + '" style="max-width:100%;max-height:' + Math.round(maxH / imgs.length) + 'px;border-radius:var(--radius-md);box-shadow:var(--shadow);border:1px solid var(--line)">' +
      '<div class="multi-page-badge">' + (idx + 1) + ' / ' + imgs.length + '</div>' +
    '</div>';
  }).join('');
  return '<div class="multi-page-preview">' + pages + '</div>' + note;
}

/* 返回某资源的所有审批申请人（持有人 + 代理授权人列表） */

  var owner = userById(ownerId);
  if (owner) list.push({ id: owner.id, name: owner.name, title: '证书持有人', isOwner: true });
  if (del.delegateToAdmin) {
    var admin = store.users.find(function(u) { return u.role === 'admin'; });
    if (admin && admin.id !== ownerId) list.push({ id: admin.id, name: admin.name, title: '管理员（代理）', isProxy: true });
  }
  (del.delegates || []).forEach(function(uid) {
    if (uid !== ownerId) {
      var d = userById(uid);
      if (d) list.push({ id: d.id, name: d.name, title: '代理授权人', isDelegate: true });

  return list;
}

/* ---------- 3. 证书图片生成（Canvas 占位，支持多页） ---------- */
function generateCertificateImage(cert, pageIdx, total) {
  pageIdx = pageIdx || 0;
  total = total || 1;
  var canvas = document.createElement('canvas');
  canvas.width = 900; canvas.height = 1240;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#FBF8F1');
  bg.addColorStop(1, '#F1E9D6');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#C9A24B';
  ctx.lineWidth = 6;
  ctx.strokeRect(50, 50, W - 100, H - 100);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(66, 66, W - 132, H - 132);

  ctx.fillStyle = '#C9A24B';
  var corners = [[80,80],[W-80,80],[80,H-80],[W-80,H-80]];
  corners.forEach(function(p) {
    var x = p[0], y = p[1];
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.strokeStyle = '#C9A24B'; ctx.lineWidth = 1; ctx.stroke();
  });

  ctx.fillStyle = '#8C7239';
  ctx.font = 'italic 18px "Cormorant Garamond", serif';
  ctx.textAlign = 'center';
  ctx.fillText('CERTIFICATE', W / 2, 175);

  ctx.fillStyle = '#0F3D2E';
  ctx.font = '500 22px "Noto Serif SC", serif';
  ctx.fillText('证    书', W / 2, 210);

  ctx.strokeStyle = '#C9A24B';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W/2 - 90, 235); ctx.lineTo(W/2 - 30, 235);
  ctx.moveTo(W/2 + 30, 235); ctx.lineTo(W/2 + 90, 235);
  ctx.stroke();
  ctx.fillStyle = '#C9A24B';
  ctx.beginPath(); ctx.arc(W/2, 235, 3, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#0F3D2E';
  ctx.font = 'bold 44px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText(cert.name, W / 2, 380);

  ctx.strokeStyle = '#C9A24B';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(W/2 - 200, 405); ctx.lineTo(W/2 + 200, 405);
  ctx.stroke();

  ctx.font = '22px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'left';
  var y = 520;
  function drawField(k, v) {
    ctx.fillStyle = '#6B6F6B';
    ctx.fillText(k, 200, y);
    ctx.fillStyle = '#1F2421';
    ctx.fillText(v || '—', 360, y);

function wrapText(ctx, text, x, y, maxW, lineH) {
  var chars = text.split(''); var line = '';
  for (var i = 0; i < chars.length; i++) {
    var test = line + chars[i];
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); line = chars[i]; y += lineH; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, y);
}

function pageCountFor(res) {
  if (!res._pageCount) {
    var hash = 0;
    var s = res.id || '';
    for (var i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) & 0xffff;
    res._pageCount = (hash % 3) + 1;
  }
  return res._pageCount;
}
function ensureCertImages() {
  store.certificates.forEach(function(c) {
    if (!c._images) {
      var total = pageCountFor(c);
      c._images = [];
      for (var p = 0; p < total; p++) c._images.push(generateCertificateImage(c, p, total));
      c._imageDataUrl = c._images[0];
    }
  });
  store.caseContracts.forEach(function(c) {
    if (!c._images) {
      var total2 = pageCountFor(c);
      c._images = [];
      for (var p2 = 0; p2 < total2; p2++) c._images.push(generateCaseImage(c, p2, total2));
      c._imageDataUrl = c._images[0];
    }
  });
}

var WATERMARK_COLORS = [
  { label: '深红', value: '#B23A48' },
  { label: '墨绿', value: '#0F3D2E' },
  { label: '亮金', value: '#C9A24B' },
  { label: '深蓝', value: '#1B3A5C' },
  { label: '炭灰', value: '#1F2421' },
  { label: '紫红', value: '#7B2D5E' }
];
var WATERMARK_DENSITIES = [
  { label: '稀疏', value: 'sparse', desc: '每排仅 1 个水印' },
  { label: '常规', value: 'normal', desc: '每排 1~2 个水印' },
  { label: '密集', value: 'dense', desc: '每排多个水印' }
];

function buildWatermarkedImage(resource, app) {
  var projectName = app.projectName;
  var year = app.year;
  var color = app.watermarkColor || '#B23A48';
  var density = app.watermarkDensity || 'normal';
  var images = resource._images || [resource._imageDataUrl];
  return new Promise(function(resolve) {
    var loaded = [];
    var pending = images.length;
    images.forEach(function(src, idx) {
      var img = new Image();
      img.onload = function() { loaded[idx] = img; pending--; if (pending === 0) drawAll(); };
      img.onerror = function() { loaded[idx] = img; pending--; if (pending === 0) drawAll(); };
      img.src = src;
    });
    function drawAll() {
      var pageW = loaded[0].width;
      var gap = 16;
      var pageHs = loaded.map(function(im) { return im.height; });
      var totalH = pageHs.reduce(function(a, b) { return a + b; }, 0) + gap * (loaded.length - 1);
      var canvas = document.createElement('canvas');
      canvas.width = pageW;
      canvas.height = totalH;
      var ctx = canvas.getContext('2d');
      var yOffset = 0;
      loaded.forEach(function(im, pageIdx) {
        ctx.drawImage(im, 0, yOffset);
        drawWatermarkOnPage(ctx, im.width, im.height, yOffset, projectName, year, color, density, pageIdx, loaded.length);
        yOffset += im.height + gap;
      });
      resolve(canvas.toDataURL('image/png'));
    }
  });
}
function drawWatermarkOnPage(ctx, W, H, yOffset, projectName, year, color, density, pageIdx, totalPages) {
  var text = year + '' + projectName + '专用';
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, yOffset, W, H);
  ctx.clip();
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = color;
  var fontSize = Math.max(22, Math.min(42, Math.round(W / 26)));
  ctx.font = 'bold ' + fontSize + 'px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(W / 2, yOffset + H / 2);
  ctx.rotate(-Math.PI / 6);
  var diag = Math.sqrt(W * W + H * H);
  var textWidth = ctx.measureText(text).width;
  var gap = fontSize * 1.5;
  var densityMult = density === 'sparse' ? 2.2 : density === 'dense' ? 0.85 : 1.3;
  var stepX = Math.max(textWidth + fontSize * 0.6, (textWidth + gap) * densityMult);
  var stepY = (fontSize * 3.5) * densityMult;
  for (var yy = -diag; yy < diag; yy += stepY) {
    var offset = (Math.floor(yy / stepY) % 2) * (stepX / 2);
    for (var xx = -diag; xx < diag; xx += stepX) {
      ctx.fillText(text, xx + offset, yy);
    }
  }
  ctx.restore();
  ctx.save();
  ctx.fillStyle = 'rgba(178, 58, 72, 0.9)';
  ctx.fillRect(0, yOffset, W, 50);
  ctx.fillStyle = '#FBF8F1';
  ctx.font = 'bold 20px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  var barText = year + '年「' + projectName + '」专用 · 禁止外传';
  if (totalPages > 1) barText += ' (第' + (pageIdx + 1) + '页/共' + totalPages + '页)';
  ctx.fillText(barText, W / 2, yOffset + 33);
  ctx.restore();
}

/* ---------- 7. 业务逻辑 ---------- */
function myCertificates() { return store.certificates.filter(function(c) { return c.scope !== 'company' && c.ownerId === store.currentUserId; }); }
function libraryCertificates() { return store.certificates.filter(function(c) { return c.scope !== 'company' && c.ownerId !== store.currentUserId; }); }
function companyCertificates() { return store.certificates.filter(function(c) { return c.scope === 'company'; }); }
function companyCases() { return store.caseContracts; }
function outgoingForMe() { return store.applications.filter(function(a) { return a.applicantId === store.currentUserId; }); }

function incomingForMe() {
  var me = currentUser();
  return store.applications.filter(function(a) {
    if (a.status !== 'pending') return false;
    var rt = a.resourceType || 'certificate';
    var rid = a.resourceId || a.certificateId;
    var res = resourceById(rt, rid);
    if (!res) return false;
    return canApproveResource(rt, rid, me);
  });
}

function processedByMe() {
  return store.applications.filter(function(a) { return a.approverId === store.currentUserId && a.status !== 'pending'; });
}

function createApplication(opts) {
  var rt = opts.resourceType || 'certificate';
  var rid = opts.resourceId;
  var res = resourceById(rt, rid);
  var del = store.delegations[res.ownerId] || { delegateToAdmin: false, delegates: [] };
  var approvers = getApprovers(res.ownerId);
  var routedTo;
  if (del.delegateToAdmin) routedTo = 'admin';
  else if ((del.delegates || []).length > 0) routedTo = 'delegate';
  else routedTo = 'owner';
  var app = {
    id: uid('a-'),
    applicantId: store.currentUserId,
    resourceType: rt,
    resourceId: rid,
    certificateId: rt === 'certificate' ? rid : null,
    projectName: opts.projectName.trim(),
    year: parseInt(opts.year, 10),
    purpose: opts.purpose.trim(),
    watermarkColor: opts.watermarkColor || '#B23A48',
    watermarkDensity: opts.watermarkDensity || 'normal',
    status: 'pending',
    approverId: null,
    isProxyApproved: false,
    createdAt: nowStr(),
    decidedAt: null,
    routedTo: routedTo,
    approversCount: approvers.length
  };
  store.applications.unshift(app);
  log('创建申请', 'application', app.id, { projectName: opts.projectName, year: opts.year, resourceName: res.name });
  return app;
}

function decideApplication(appId, decision, reason) {
  reason = reason || '';
  var app = appById(appId);
  if (!app) return;
  var me = currentUser();
  var rt = app.resourceType || 'certificate';
  var rid = app.resourceId || app.certificateId;
  var res = resourceById(rt, rid);
  var del = res ? (store.delegations[res.ownerId] || { delegateToAdmin: false, delegates: [] }) : null;
  var isProxy = res && del && del.delegateToAdmin && me.role === 'admin' && me.id !== res.ownerId;
  var isDelegate = res && del && (del.delegates || []).indexOf(me.id) >= 0 && me.id !== res.ownerId;
  app.status = decision;
  app.approverId = me.id;
  app.isProxyApproved = !!(isProxy || isDelegate);
  app.decidedAt = nowStr();
  if (decision === 'rejected') app.rejectReason = reason;
  log(decision === 'approved' ? '通过申请' : '驳回申请', 'application', app.id,
    { projectName: app.projectName, isProxy: app.isProxyApproved, approverName: me.name });
  if (res) {
    var ownerName = userById(res.ownerId).name;
    if (isProxy) toast('已代理审批（持有人 ' + ownerName + ' 已授权管理员）', 'success');
    else if (isDelegate) toast('已作为代理授权人审批（持有人 ' + ownerName + ' 已指定）', 'success');
    else toast('审批' + (decision === 'approved' ? '通过' : '已驳回'), decision === 'approved' ? 'success' : 'error');
  }
}

function setDelegation(userId, on) {
  var old = store.delegations[userId] || { delegateToAdmin: false, delegates: [] };
  store.delegations[userId] = {
    delegateToAdmin: on,
    delegates: old.delegates || [],
    updatedAt: nowStr()
  };
  log(on ? '开启代理授权' : '关闭代理授权', 'delegation', userId, { user: userById(userId).name });
  toast(on ? '已开启管理员代理审批' : '已关闭管理员代理审批', 'success');
}

function deleteCertificate(certId) {
  var idx = store.certificates.findIndex(function(c) { return c.id === certId; });
  if (idx < 0) return;
  var c = store.certificates[idx];
  store.certificates.splice(idx, 1);
  log('删除证书', 'certificate', certId, { name: c.name });
  toast('证书已删除', 'success');
}

function deleteCase(caseId) {
  var idx = store.caseContracts.findIndex(function(c) { return c.id === caseId; });
  if (idx < 0) return;
  var c = store.caseContracts[idx];
  store.caseContracts.splice(idx, 1);
  log('删除案例合同', 'case', caseId, { name: c.name });
  toast('案例合同已删除', 'success');
}

function filterLibrary() {

  var owner = $('#lib-owner').value;

    var name = (row.dataset.name || '').toLowerCase();
    var num = (row.dataset.num || '').toLowerCase();
    var t = row.dataset.type;
    var o = row.dataset.owner;
    var matchKw = !kw || name.indexOf(kw) >= 0 || num.indexOf(kw) >= 0;

    var matchOwner = !owner || o === owner;

  });
}

function renderAppCard(app) {
  var rt = app.resourceType || 'certificate';
  var rid = app.resourceId || app.certificateId;
  var res = resourceById(rt, rid);
  var applicant = userById(app.applicantId);
  var approver = app.approverId ? userById(app.approverId) : null;
  var owner = res ? userById(res.ownerId) : null;
  var del = res ? (store.delegations[res.ownerId] || { delegateToAdmin: false, delegates: [] }) : null;
  var isProxy = app.isProxyApproved;
  var me = currentUser();
  var showApproveBtn = app.status === 'pending' && canApproveResource(rt, rid, me);
  var isMyApprovedApp = app.status === 'approved' && app.applicantId === store.currentUserId;
  var showDownloadBtn = isMyApprovedApp;
  var expiry = downloadExpiryInfo(app);
  var downloadExpired = isMyApprovedApp && expiry && expiry.expired;
  var typeTag = '<span class="resource-type-tag ' + rt + '">' + resourceTypeLabel(rt) + '</span>';

  return '<div class="app-card">' +
    '<div class="left">' +
      '<div class="proj">' + typeTag + escapeHtml(app.projectName) + '<span class="year-tag">' + app.year + '年</span></div>' +
      '<div class="meta">' +
        '<span class="item"><span class="ic">' + (rt === 'case' ? '📑' : '❖') + '</span>' + resourceTypeLabel(rt) + '：' + escapeHtml(res ? res.name : '已删除') + '</span>' +
        '<span class="item"><span class="ic">👤</span>申请人：' + escapeHtml(applicant.name) + '</span>' +
        (owner ? '<span class="item"><span class="ic">🔑</span>持有人：' + escapeHtml(owner.name) + (del && del.delegateToAdmin ? ' · 已授权管理员' : ((del && del.delegates && del.delegates.length) ? ' · 已指定 ' + del.delegates.length + ' 名代理人' : ' · 须本人')) + '</span>' : '') +
        (approver ? '<span class="item"><span class="ic">✓</span>审批人：' + escapeHtml(approver.name) + (isProxy ? '（代理）' : '') + '</span>' : '') +
        '<span class="item"><span class="ic">🕐</span>' + (app.decidedAt || app.createdAt) + '</span>' +
      '</div>' +
      (app.purpose ? '<div style="font-size:12px;color:var(--muted);margin-top:4px">用途：' + escapeHtml(app.purpose) + '</div>' : '') +
      (app.rejectReason ? '<div style="font-size:12px;color:var(--danger);margin-top:4px">驳回理由：' + escapeHtml(app.rejectReason) + '</div>' : '') +
      (isMyApprovedApp && expiry ? '<div style="font-size:11.5px;margin-top:6px;color:' + (expiry.expired ? 'var(--muted)' : 'var(--gold-dim)') + '">⏳ ' + (expiry.expired ? '下载已过期（' + DOWNLOAD_TTL_DAYS + ' 天后水印图已自动删除，仅保留申请记录）' : '剩余 ' + expiry.remainDays + ' 天可下载带水印图') + '</div>' : '') +
    '</div>' +
    '<div class="right">' +
      '<span class="status-tag status-' + app.status + '">' + statusLabel(app.status) + '</span>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
        '<button class="btn btn-ghost btn-sm" onclick="openAppDetailModal(\'' + app.id + '\')">详情</button>' +
        (showApproveBtn ? '<button class="btn btn-primary btn-sm" onclick="openApproveModal(\'' + app.id + '\')">审批</button>' : '') +
        (showDownloadBtn && !downloadExpired ? '<button class="btn btn-gold btn-sm" onclick="openDownloadModal(\'' + app.id + '\')">下载水印图</button>' : '') +
        (downloadExpired ? '<button class="btn btn-outline btn-sm" disabled title="水印图已过期删除">已过期</button>' : '') +
      '</div>' +
    '</div>' +
  '</div>';
}

  if (!myDel.delegates) myDel.delegates = [];

/* ---------- 13. 弹窗系统 ---------- */
function openModal(html, wide) {
  var m = $('#modal');
  m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = html;
  $('#modal-overlay').classList.add('show');
}
function closeModal() {
  $('#modal-overlay').classList.remove('show');
  $('#modal').innerHTML = '';
}
$('#modal-overlay').addEventListener('click', function(e) {
  if (e.target === $('#modal-overlay')) closeModal();
});

/* 图片编辑器（弹窗内图片上传/删除） */
var _modalImages = [];
function resetModalImages(images) { _modalImages = (images || []).slice(); }
function imgEditorThumbsHTML() {
  var thumbs = _modalImages.map(function(src, idx) {
    return '<div class="img-editor-thumb">' +
      '<img src="' + src + '" alt="预览">' +
      '<div class="iet-badge">第' + (idx + 1) + '页</div>' +
      '<button class="iet-remove" onclick="removeModalImage(' + idx + ')" title="删除此页">×</button>' +
    '</div>';
  }).join('');
  var addBtn = '<label class="img-editor-add" title="添加图片">' +
    '<div class="icon">＋</div><div>添加图片</div>' +
    '<input type="file" accept="image/*" multiple style="display:none" onchange="onModalFilesPicked(this)">' +
  '</label>';
  return thumbs + addBtn;
}
function renderImgEditorThumbs() {
  var el = $('#img-editor-thumbs');
  if (el) el.innerHTML = imgEditorThumbsHTML();
}
function onModalFilesPicked(input) {
  var files = input.files;
  if (!files || !files.length) return;
  var remaining = files.length;
  for (var i = 0; i < files.length; i++) {
    (function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        _modalImages.push(e.target.result);
        remaining--;
        if (remaining === 0) { renderImgEditorThumbs(); toast('已添加 ' + files.length + ' 张图片', 'info'); }
      };
      reader.readAsDataURL(file);
    })(files[i]);
  }
  input.value = '';
}
function removeModalImage(idx) {
  _modalImages.splice(idx, 1);
  renderImgEditorThumbs();
}

function modalShell(opts) {
  return '<div class="modal-head"><div class="title-wrap"><div class="title">' + opts.title + '</div>' + (opts.sub ? '<div class="sub">' + escapeHtml(opts.sub) + '</div>' : '') + '</div><div class="modal-close" onclick="closeModal()">×</div></div>' +
    '<div class="modal-body">' + opts.body + '</div>' +
    (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '');
}

function runOCR() {
  var status = $('#ocr-status');
  var btn = $('#ocr-btn');
  if (!status) return;
  status.style.display = 'inline-flex';
  status.className = 'ocr-bar running';
  status.innerHTML = '<span class="spinner"></span>正在识别证书图片…';
  if (btn) btn.disabled = true;
  setTimeout(function() {
    var preset = OCR_PRESETS[Math.floor(Math.random() * OCR_PRESETS.length)];
    function fill(id, val) {
      var el = $(id);
      if (el) { el.value = val; el.classList.add('ocr-filled'); setTimeout(function() { el.classList.remove('ocr-filled'); }, 2200); }
    }
    fill('#f-name', preset.name);
    fill('#f-type', preset.type);
    fill('#f-number', preset.number);
    fill('#f-issuer', preset.issuer);
    fill('#f-valid', preset.validUntil);
    status.className = 'ocr-bar success';

    category: $('#k-category').value.trim(),
    summary: $('#k-summary').value.trim()
  };
  function applyCaseImages(c) {
    delete c._images; delete c._imageDataUrl; delete c._pageCount;
    if (_modalImages.length > 0) {
      c._images = _modalImages.slice();
      c._imageDataUrl = c._images[0];
      c._pageCount = c._images.length;

      c._imageDataUrl = c._images[0];

    applyCaseImages(k);
    log('编辑案例合同', 'case', caseId, { name: name });
    toast('案例合同已更新', 'success');
  } else {

        '2. 作废该成员发起的待审批申请（共 ' + pendingApps + ' 条）<br>' +
        '3. 从其他成员的代理授权人列表中移除<br>' +
        '4. 历史审批与审计记录予以保留<br>' +
        '已离职成员将无法登录系统，可在需要时恢复在职。' +
      '</div></div>',
    footer: '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="doResignUser(\'' + userId + '\')">确认离职</button>'
  }));
}

function doResignUser(userId) {
  var u = userById(userId);
  if (!u) return;
  var today = new Date().toISOString().slice(0, 10);
  var certs = store.certificates.filter(function(c) { return c.scope !== 'company' && c.ownerId === userId; });
  var removedCerts = certs.length;
  certs.forEach(function(c) {
    var idx = store.certificates.findIndex(function(x) { return x.id === c.id; });
    if (idx >= 0) store.certificates.splice(idx, 1);
  });
  var pendingApps = store.applications.filter(function(a) { return a.applicantId === userId && a.status === 'pending'; });
  pendingApps.forEach(function(a) {
    a.status = 'rejected';
    a.approverId = store.currentUserId;
    a.decidedAt = nowStr();
    a.rejectReason = '申请人已离职，申请自动作废';
  });
  store.users.forEach(function(other) {
    var del = store.delegations[other.id];
    if (del && del.delegates) {
      var i = del.delegates.indexOf(userId);
      if (i >= 0) del.delegates.splice(i, 1);
    }
  });
  u.status = 'inactive';
  u.leftAt = today;
  log('成员离职', 'user', userId, { name: u.name, removedCerts: removedCerts, cancelledApps: pendingApps.length });
  closeModal();
  if (store.currentUserId === userId) store.currentUserId = store.users.find(function(x) { return x.role === 'admin' && x.status !== 'inactive'; }).id;
  renderTopbar();
  render();
  toast('「' + u.name + '」已离职，已删除 ' + removedCerts + ' 份证书、作废 ' + pendingApps.length + ' 条申请', 'success');
}

function confirmRestoreUser(userId) {
  var me = currentUser();
  if (me.role !== 'admin') { toast('仅管理员可操作', 'error'); return; }
  var u = userById(userId);
  if (!u) return;
  openModal(modalShell({
    title: '恢复在职',
    sub: '确认操作',
    body: '<div style="padding:8px 0"><p>确定要将「<strong style="color:var(--green-deep)">' + escapeHtml(u.name) + '</strong>」恢复为在职状态吗？</p>' +
      '<div style="background:var(--cream-warm);padding:12px 16px;border-radius:var(--radius-md);font-size:12.5px;color:var(--muted);margin-top:12px;border-left:3px solid var(--gold)">恢复后该成员可重新登录系统。但此前离职时删除的个人证书不会自动恢复，需重新上传。</div></div>',
    footer: '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doRestoreUser(\'' + userId + '\')">确认恢复</button>'
  }));
}

function doRestoreUser(userId) {
  var u = userById(userId);
  if (!u) return;
  u.status = 'active';
  u.leftAt = '';
  log('成员恢复在职', 'user', userId, { name: u.name });
  closeModal();
  render();
  toast('「' + u.name + '」已恢复在职', 'success');
}

/* 个人信息编辑（每个用户编辑自己） */
function openProfileModal() {
  var me = currentUser();
  openModal(modalShell({
    title: '编辑个人信息',
    sub: '您可以更新自己的基本资料',
    body: '<div class="form-grid">' +
      '<div class="field"><label>姓名 <span class="req">*</span></label><input id="pf-name" value="' + escapeHtml(me.name) + '"></div>' +
      '<div class="field"><label>职位/头衔</label><input id="pf-title" value="' + escapeHtml(me.title || '') + '"></div>' +
      '<div class="field"><label>邮箱 <span class="req">*</span></label><input id="pf-email" value="' + escapeHtml(me.email || '') + '"></div>' +
      '<div class="field"><label>手机号</label><input id="pf-phone" value="' + escapeHtml(me.phone || '') + '"></div>' +
      '<div class="field full"><label>部门</label><input id="pf-dept" value="' + escapeHtml(me.department || '') + '"></div>' +
    '</div>' +
    '<div style="background:var(--cream-warm);padding:12px 16px;border-radius:var(--radius-md);font-size:12.5px;color:var(--muted);margin-top:14px;border-left:3px solid var(--gold)">角色和入职日期由管理员维护，如需修改请联系管理员。</div>',
    footer: '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveProfile()">保存</button>'
  }));
}

function saveProfile() {
  var me = currentUser();
  var name = ($('#pf-name').value || '').trim();
  var email = ($('#pf-email').value || '').trim();
  if (!name) { toast('请填写姓名', 'error'); return; }
  if (!email) { toast('请填写邮箱', 'error'); return; }
  var dup = store.users.find(function(u) { return u.email === email && u.id !== me.id; });
  if (dup) { toast('邮箱已被「' + dup.name + '」使用，请更换', 'error'); return; }
  var oldName = me.name;
  me.name = name;
  me.title = ($('#pf-title').value || '').trim();
  me.email = email;
  me.phone = ($('#pf-phone').value || '').trim();
  me.department = ($('#pf-dept').value || '').trim();
  regenInitials(me);
  log('编辑个人信息', 'user', me.id, { oldName: oldName, newName: name });
  closeModal();
  renderTopbar();
  render();
  toast('个人信息已更新', 'success');
}

/* ---------- 14. 导航事件绑定 ---------- */
$$('.nav-item').forEach(function(item) {
  item.addEventListener('click', function() { navigate(item.dataset.view); });
});
$('#menu-toggle').addEventListener('click', toggleSidebar);
$('#sidebar-close').addEventListener('click', closeSidebar);
$('#sidebar-overlay').addEventListener('click', closeSidebar);
window.addEventListener('resize', function() { if (window.innerWidth > 768) closeSidebar(); });
window.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeSidebar(); });

/* ---------- 15. 初始化 ---------- */
function init() {
  ensureCertImages();
  renderTopbar();
  render();
  updateNavBadge();
}
init();
</script>
