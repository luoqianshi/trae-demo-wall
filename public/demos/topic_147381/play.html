/* ============================================================
 *  Logic Module 1: slidingWindowCPS.js
 * ============================================================ */
function createSlidingWindow() { return { clickTimestamps: [] }; }
function recordClick(window, timestamp) {
  var newTimestamps = window.clickTimestamps.filter(function(t) { return timestamp - t <= 1000; });
  newTimestamps.push(timestamp);
  return { clickTimestamps: newTimestamps };
}
function getCPS(window, now) {
  var recent = window.clickTimestamps.filter(function(t) { return now - t <= 1000; });
  return recent.length;
}

/* ============================================================
 *  Logic Module 2: smoothComboManager.js
 * ============================================================ */
var ComboState = { Normal: 0, Burst: 1, Frenzy: 2, Quantum: 3, Cosmic: 4 };
var COOLDOWN_BUFFER = 800;
function createComboManager() {
  return { currentTargetState: 0, currentExecutedState: 0, lastStateChangeTime: 0 };
}
function updateComboMachine(mgr, currentCPS, now) {
  var targetState;
  if (currentCPS >= 12) targetState = 4;
  else if (currentCPS >= 10) targetState = 3;
  else if (currentCPS >= 8) targetState = 2;
  else if (currentCPS >= 5) targetState = 1;
  else targetState = 0;
  var newExecutedState = mgr.currentExecutedState;
  var newLastChangeTime = mgr.lastStateChangeTime;
  if (targetState > mgr.currentExecutedState) { newExecutedState = targetState; newLastChangeTime = now; }
  else if (targetState < mgr.currentExecutedState) {
    if (now - mgr.lastStateChangeTime >= COOLDOWN_BUFFER) { newExecutedState = mgr.currentExecutedState - 1; newLastChangeTime = now; }
  } else { newLastChangeTime = now; }
  return { currentTargetState: targetState, currentExecutedState: newExecutedState, lastStateChangeTime: newLastChangeTime };
}
function getMultiplierM(mgr) {
  switch (mgr.currentExecutedState) {
    case 4: return 40000; case 3: return 40000; case 2: return 4; case 1: return 2; default: return 1;
  }
}

/* ============================================================
 *  Logic Module 3: distanceCalculator.js
 * ============================================================ */
var BASE_UNIT = 10000;
var LIGHT_YEAR_KM = 9460730472580;
function createDistanceState() { return { totalDistance: 0 }; }
function addDistanceByMultiplier(state, m) { return { totalDistance: state.totalDistance + BASE_UNIT * m }; }
function getTotalDistance(state) { return state.totalDistance; }
function formatDistance(dist) {
  if (dist === 0) return '0 km';
  if (dist >= LIGHT_YEAR_KM) {
    var ly = dist / LIGHT_YEAR_KM;
    if (ly >= 10000) { var wanLy = ly / 10000; return (wanLy % 1 === 0 ? wanLy.toFixed(0) : wanLy.toFixed(1)) + '万光年'; }
    return (ly % 1 === 0 ? ly.toFixed(0) : ly.toFixed(1)) + '光年';
  }
  if (dist >= 100000000) return (dist / 100000000).toFixed(0).replace(/\.0$/, '') + '亿 km';
  if (dist >= 10000) { var wan = dist / 10000; return (wan % 1 === 0 ? wan.toFixed(0) : wan.toFixed(1)) + '万 km'; }
  return dist + ' km';
}

var PLANET_MAP = [
  { range: [0, 15], planets: [{ id: 'moon', name: '月球', emoji: '🌑', cosmicDistance: '38万km' }] },
  { range: [16, 30], planets: [{ id: 'venus', name: '金星', emoji: '🟡', cosmicDistance: '4100万km' }] },

    { id: 'neptune', name: '海王星', emoji: '🌐', cosmicDistance: '43.5亿km' },

  { range: [81, 90], planets: [
    { id: 'tatooine', name: '塔图因', emoji: '🏜️', cosmicDistance: '3光年' },
    { id: 'blackhole', name: '银河系中心黑洞', emoji: '⚫', cosmicDistance: '3光年' },

    { id: 'cybertron', name: '赛博坦', emoji: '🤖', cosmicDistance: '500光年' },
    { id: 'pandora', name: '潘多拉', emoji: '🌿', cosmicDistance: '4.37光年' },
  ]},
];
var M78_PLANET = { id: 'm78', name: 'M78星云', emoji: '🌌', cosmicDistance: '300万光年' };
var FALLBACK_PLANET = { id: 'moon', name: '月球', emoji: '🌑', cosmicDistance: '38万km' };
function getFinalPlanet(totalClicks, randomFn) {
  var random = randomFn || Math.random;
  if (totalClicks > 100) return Object.assign({}, M78_PLANET);
  for (var i = 0; i < PLANET_MAP.length; i++) {
    var entry = PLANET_MAP[i];
    if (totalClicks >= entry.range[0] && totalClicks <= entry.range[1]) {
      var candidates = entry.planets;
      if (candidates.length > 1) {
        var idx = random() < 0.5 ? 0 : 1;
        return Object.assign({}, candidates[idx]);
      }
      return Object.assign({}, candidates[0]);
    }
  }
  return Object.assign({}, FALLBACK_PLANET);
}

/* ============================================================
 *  Logic Module 5: gameSession.js
 * ============================================================ */
function createGameSession(startTime) {
  return { startTime: startTime, duration: 10000, totalClicks: 0, totalDistance: 0, lastClickTime: null, inputLocked: false, frozenClicks: null, frozenDistance: null, paused: false, pauseTime: null };
}
function registerClick(session, timestamp, distanceIncrement) {
  if (session.inputLocked) return session;
  var dist = distanceIncrement !== undefined ? distanceIncrement : 10000;
  return Object.assign({}, session, { totalClicks: session.totalClicks + 1, totalDistance: session.totalDistance + dist, lastClickTime: timestamp });
}
function getRemainingTime(session, currentTime) { return Math.max(0, session.duration - (currentTime - session.startTime)); }
function isTimeUp(session, currentTime) { return currentTime - session.startTime >= session.duration; }
function freezeSession(session, freezeTime) { return Object.assign({}, session, { inputLocked: true, frozenClicks: session.totalClicks, frozenDistance: session.totalDistance, freezeTime: freezeTime }); }
function getFinalResult(session, randomFn) {
  var clicks = session.frozenClicks !== null ? session.frozenClicks : session.totalClicks;
  var distance = session.frozenDistance !== null ? session.frozenDistance : session.totalDistance;
  var planet = getFinalPlanet(clicks, randomFn);
  return { totalClicks: clicks, rawDistanceKM: distance, planet: planet };
}
function pauseSession(session, currentTime) { return Object.assign({}, session, { paused: true, pauseTime: currentTime }); }
function resumeSession(session, currentTime) {
  var pauseDuration = currentTime - session.pauseTime;
  return Object.assign({}, session, { paused: false, pauseTime: null, startTime: session.startTime + pauseDuration });
}

/* ============================================================
 *  Logic Module 6: rankingSystem.js
 * ============================================================ */
var MAX_SIZE = 100;
function addScore(store, entry) {
  var newStore = store.slice(); newStore.push(entry);
  newStore.sort(function(a, b) { if (b.totalClicks !== a.totalClicks) return b.totalClicks - a.totalClicks; return a.timestamp - b.timestamp; });
  return newStore.slice(0, MAX_SIZE);
}
function getRank(store, totalClicks) { var higher = store.filter(function(e) { return e.totalClicks > totalClicks; }).length; return higher + 1; }
function getMaxClicks(storedValue) { return storedValue || 0; }
function updateMaxClicks(currentMax, newClicks) { return Math.max(currentMax, newClicks); }
function isNewRecord(currentMax, newClicks) { return newClicks > currentMax; }

var SHARE_TEXTS = {

};
function getShareText(planetId) { return SHARE_TEXTS[planetId] || '我把老板发射到了宇宙深处！你能送得更远吗？不服来战！'; }

/* ============================================================

var storage = {
  getHighScore: function() { var v = localStorage.getItem('alien_signal_high_score'); return v ? parseInt(v) : 0; },

/* ============================================================
 *  GameEngine
 * ============================================================ */
var COMBO_STATES = [
  { name: '普通', color: '#808080', boss: '🧑‍💼', label: '正常上班' },
  { name: '爆发', color: '#4dabf7', boss: '😰', label: '开始慌了' },
  { name: '狂暴', color: '#ff922b', boss: '😵‍💫', label: '头晕目眩' },
  { name: '量子', color: '#cc5de8', boss: '🚀', label: '直接发射' },
  { name: '宇宙', color: '#ff4444', boss: '🕳️', label: '消失殆尽' },
];
var DANMAKU = {
  0: ['嗯？', '...', '在吗？', '点啊', '就这？', '加油'],
  1: ['起飞！', '有了！', '稳住！', '别停！', '有点东西', '继续！'],
  2: ['太猛了！', '燃起来了！', '手速！', '快快快！', '烧CPU！', '刹不住！'],
  3: ['量子跃迁！', '次元突破！', '不科学！', '光速！', '离谱！', 'WTF'],
  4: ['黑洞吞噬！', '宇宙尽头！', '超越人类！', '神之手速！', '已消失', '终极流放！'],
};
var COMBO_BURST_TEXTS = ['爆发!', '狂暴!!', '量子跃迁!!!', '宇宙尽头!!!!'];
var COMBO_BURST_COLORS = ['#4dabf7', '#ff922b', '#cc5de8', '#ff4444'];

function createEngine(canvas) {
  var dpr = window.devicePixelRatio || 1;
  var logicalW = 375;
  var logicalH = 667;
  canvas.width = logicalW * dpr;
  canvas.height = logicalH * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  var engine = {
    canvas: canvas,
    ctx: ctx,
    screenWidth: logicalW,
    screenHeight: logicalH,
    currentScene: null,
    currentSceneName: null,
    sceneCache: {},
    lastTime: 0,
    stars: [],
    shakeAmount: 0,
    shakeTime: 0,
    flashAlpha: 0,
    flashColor: '#ffffff',
    pendingScene: null
  };

  // generate 80 stars
  for (var i = 0; i < 80; i++) {
    engine.stars.push({
      x: Math.random() * logicalW,
      y: Math.random() * logicalH,
      r: Math.random() * 1.3 + 0.3,
      tw: Math.random() * Math.PI * 2,
      twSpeed: Math.random() * 2 + 0.5,
      brightness: Math.random() * 0.5 + 0.5
    });
  }

  engine.roundRect = function(ctx, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  engine.hitTest = function(x, y, rect) {
    return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
  };

  engine.triggerShake = function(amount, time) {
    engine.shakeAmount = amount;
    engine.shakeTime = time;
  };

  engine.triggerFlash = function(color, alpha) {
    engine.flashColor = color;
    engine.flashAlpha = alpha;
  };

  engine.renderBackground = function(ctx) {
    // deep space gradient
    var grad = ctx.createLinearGradient(0, 0, 0, engine.screenHeight);
    grad.addColorStop(0, '#0a0a2a');
    grad.addColorStop(0.5, '#0d0d3a');
    grad.addColorStop(1, '#050514');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, engine.screenWidth, engine.screenHeight);
    // stars
    for (var i = 0; i < engine.stars.length; i++) {
      var s = engine.stars[i];
      s.tw += 0.05 * s.twSpeed;
      var alpha = s.brightness * (0.5 + 0.5 * Math.sin(s.tw));
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  engine.switchScene = function(name, data) {
    if (!engine.sceneCache[name]) {
      engine.sceneCache[name] = engine.createScene(name);
    }
    engine.currentScene = engine.sceneCache[name];
    engine.currentSceneName = name;
    engine.currentScene.init(data || {});
  };

  engine.createScene = function(name) {
    if (name === 'home') return createHomeScene(engine);
    if (name === 'gaming') return createGamingScene(engine);
    if (name === 'result') return createResultScene(engine);
    if (name === 'sector') return createSectorScene(engine);
    if (name === 'archive') return createArchiveScene(engine);
    return null;
  };

  engine.loop = function(timestamp) {
    if (!engine.lastTime) engine.lastTime = timestamp;
    var dt = timestamp - engine.lastTime;
    if (dt > 100) dt = 100;
    engine.lastTime = timestamp;

    var ctx = engine.ctx;
    ctx.save();

    // screen shake
    var sx = 0, sy = 0;
    if (engine.shakeTime > 0) {
      engine.shakeTime -= dt;
      var intensity = Math.min(engine.shakeAmount, engine.shakeTime / 10);
      sx = (Math.random() - 0.5) * intensity * 2;
      sy = (Math.random() - 0.5) * intensity * 2;
    }
    ctx.translate(sx, sy);

    engine.renderBackground(ctx);

    if (engine.currentScene) {
      engine.currentScene.update(dt);
      engine.currentScene.render(ctx);
    }

    // flash overlay
    if (engine.flashAlpha > 0) {
      ctx.fillStyle = engine.flashColor;
      ctx.globalAlpha = engine.flashAlpha;
      ctx.fillRect(-10, -10, engine.screenWidth + 20, engine.screenHeight + 20);
      ctx.globalAlpha = 1;
      engine.flashAlpha = Math.max(0, engine.flashAlpha - dt / 200);
    }

    ctx.restore();
    requestAnimationFrame(engine.loop);
  };

  // coordinate conversion
  engine.getCanvasPos = function(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = logicalW / rect.width;
    var scaleY = logicalH / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  };

  // mouse events
  canvas.addEventListener('mousedown', function(e) {
    e.preventDefault();
    var pos = engine.getCanvasPos(e.clientX, e.clientY);
    if (engine.currentScene && engine.currentScene.onTouchStart) {
      engine.currentScene.onTouchStart(pos.x, pos.y);
    }
  });
  canvas.addEventListener('mouseup', function(e) {
    e.preventDefault();
    var pos = engine.getCanvasPos(e.clientX, e.clientY);
    if (engine.currentScene && engine.currentScene.onTouchEnd) {
      engine.currentScene.onTouchEnd(pos.x, pos.y);
    }
  });
  // touch events
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    var pos = engine.getCanvasPos(t.clientX, t.clientY);
    if (engine.currentScene && engine.currentScene.onTouchStart) {
      engine.currentScene.onTouchStart(pos.x, pos.y);
    }
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    var pos = engine.getCanvasPos(t.clientX, t.clientY);
    if (engine.currentScene && engine.currentScene.onTouchEnd) {
      engine.currentScene.onTouchEnd(pos.x, pos.y);
    }
  }, { passive: false });

  // visibility change for pause/resume
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (engine.currentScene && engine.currentScene.onPause) {
        engine.currentScene.onPause();
      }
    } else {
      if (engine.currentScene && engine.currentScene.onResume) {
        engine.currentScene.onResume();
      }
    }
  });

  requestAnimationFrame(engine.loop);
  return engine;
}

/* ============================================================
 *  Scene: HomeScene
 * ============================================================ */
function createHomeScene(engine) {
  var scene = {};
  var ufoTime = 0;
  var shakeBtn = 0;
  var danmakuList = [];
  var danmakuTimer = 0;
  var danmakuPool = ['加班到死', '996福报', '老板画的饼', '007工作制', '无偿加班', 'PUA大师', '周报月报年报', '降本增效', '末位淘汰', '弹性工作制', '狼性文化', '奋斗逼'];
  var highScore = storage.getHighScore();
  var startBtn = { x: 87.5, y: 480, w: 200, h: 60 };

  function spawnDanmaku() {
    var text = danmakuPool[Math.floor(Math.random() * danmakuPool.length)];
    danmakuList.push({
      text: text,
      x: engine.screenWidth + 50,
      y: 120 + Math.random() * 320,
      speed: 40 + Math.random() * 30,
      alpha: 0.4 + Math.random() * 0.3,
      color: ['#8888bb', '#aa66cc', '#6688aa'][Math.floor(Math.random() * 3)]
    });
  }

  scene.init = function(data) {
    ufoTime = 0;
    shakeBtn = 0;
    danmakuList = [];
    danmakuTimer = 0;
    highScore = storage.getHighScore();
    for (var i = 0; i < 5; i++) spawnDanmaku();
  };

  scene.update = function(dt) {
    ufoTime += dt;
    shakeBtn = Math.sin(ufoTime / 100) * 3;
    // update danmaku
    danmakuTimer += dt;
    if (danmakuTimer > 800) {
      danmakuTimer = 0;
      spawnDanmaku();
    }
    for (var i = danmakuList.length - 1; i >= 0; i--) {
      danmakuList[i].x -= danmakuList[i].speed * dt / 1000;
      if (danmakuList[i].x < -100) danmakuList.splice(i, 1);
    }
  };

  scene.render = function(ctx) {
    // floating danmaku
    for (var i = 0; i < danmakuList.length; i++) {
      var d = danmakuList[i];
      ctx.globalAlpha = d.alpha;
      ctx.fillStyle = d.color;
      ctx.font = '13px sans-serif';
      ctx.fillText(d.text, d.x, d.y);
      ctx.globalAlpha = 1;
    }

    // UFO abducting boss loop
    var ufoY = 100 + Math.sin(ufoTime / 800) * 15;
    var ufoX = engine.screenWidth / 2;
    drawUFO(ctx, ufoX, ufoY, ufoTime, '#4dabf7', 0);

    // beam
    var bossY = 230 + Math.sin(ufoTime / 800) * 5;
    var beamAlpha = 0.3 + 0.15 * Math.sin(ufoTime / 200);
    ctx.fillStyle = 'rgba(77, 171, 247, ' + beamAlpha + ')';
    ctx.beginPath();
    ctx.moveTo(ufoX - 20, ufoY + 18);
    ctx.lineTo(ufoX + 20, ufoY + 18);
    ctx.lineTo(ufoX + 45, bossY);
    ctx.lineTo(ufoX - 45, bossY);
    ctx.closePath();
    ctx.fill();

    // boss being abducted (bobbing)
    var bossBob = Math.sin(ufoTime / 400) * 8;
    ctx.save();
    ctx.translate(ufoX, bossY + bossBob - 10);
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🧑‍💼', 0, 0);
    ctx.restore();

    // title
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px sans-serif';
    var titleGrad = ctx.createLinearGradient(0, 280, 0, 320);
    titleGrad.addColorStop(0, '#4dabf7');
    titleGrad.addColorStop(0.5, '#cc5de8');
    titleGrad.addColorStop(1, '#ff922b');
    ctx.fillStyle = titleGrad;
    ctx.fillText('呼叫外星人', engine.screenWidth / 2, 300);
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('全网抓老板大作战', engine.screenWidth / 2, 332);

    // subtitle
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#6666aa';
    ctx.fillText('疯狂点击10秒，把老板发射到宇宙尽头！', engine.screenWidth / 2, 360);

    // high score
    if (highScore > 0) {
      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#ffd700';
      ctx.fillText('🏆 最高记录: ' + highScore + ' 次点击', engine.screenWidth / 2, 390);
    }

    // start button with shake
    ctx.save();
    ctx.translate(shakeBtn, 0);
    var btnGrad = ctx.createLinearGradient(0, startBtn.y, 0, startBtn.y + startBtn.h);
    btnGrad.addColorStop(0, '#5c7cfa');
    btnGrad.addColorStop(1, '#7950f2');
    ctx.fillStyle = btnGrad;
    engine.roundRect(ctx, startBtn.x, startBtn.y, startBtn.w, startBtn.h, 30);
    ctx.fill();
    // glow
    ctx.shadowColor = '#7950f2';
    ctx.shadowBlur = 20;
    engine.roundRect(ctx, startBtn.x, startBtn.y, startBtn.w, startBtn.h, 30);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('🚀 即刻流放', engine.screenWidth / 2, startBtn.y + startBtn.h / 2);
    ctx.restore();

    // footer hint
    ctx.textAlign = 'center';
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#444466';
    ctx.fillText('点击按钮开始游戏', engine.screenWidth / 2, 570);
    ctx.fillText('© TRAE Demo', engine.screenWidth / 2, 590);
  };

  scene.onTouchStart = function(x, y) {
    if (engine.hitTest(x, y, startBtn)) {
      engine.switchScene('gaming', {});
    }
  };
  scene.onTouchEnd = function(x, y) {};

  return scene;
}

/* ============================================================
 *  Shared: drawUFO helper
 * ============================================================ */
function drawUFO(ctx, x, y, time, domeColor, comboLevel) {
  ctx.save();
  ctx.translate(x, y);
  // metal gray bottom ellipse
  ctx.fillStyle = '#7a8290';
  ctx.beginPath();
  ctx.ellipse(0, 14, 42, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  // dark chassis
  ctx.fillStyle = '#4a5060';
  ctx.beginPath();
  ctx.ellipse(0, 10, 38, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  // colored dome (changes with combo)
  ctx.fillStyle = domeColor;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.ellipse(0, 2, 22, 18, 0, Math.PI, 0);
  ctx.fill();
  ctx.globalAlpha = 1;
  // dome outline
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(0, 2, 22, 18, 0, Math.PI, 0);
  ctx.stroke();
  // white reflection
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(-8, -6, 7, 5, -0.5, 0, Math.PI * 2);
  ctx.fill();
  // 7 blinking lights
  for (var i = 0; i < 7; i++) {
    var angle = (i / 7) * Math.PI - Math.PI / 2 + Math.PI;
    var lx = Math.cos(angle) * 34;
    var ly = 12 + Math.sin(angle) * 7;
    var blink = 0.4 + 0.6 * Math.abs(Math.sin(time / 200 + i));
    var lightColor = i % 2 === 0 ? '#ffdd44' : '#44ff88';
    ctx.fillStyle = lightColor;
    ctx.globalAlpha = blink;
    ctx.beginPath();
    ctx.arc(lx, ly, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawBeam(ctx, x, y, width, height, color, time, intensity) {
  ctx.save();
  // wide outer beam
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.15 * intensity;
  ctx.beginPath();
  ctx.moveTo(x - width * 0.4, y);
  ctx.lineTo(x + width * 0.4, y);
  ctx.lineTo(x + width, y + height);
  ctx.lineTo(x - width, y + height);
  ctx.closePath();
  ctx.fill();
  // narrow inner beam
  ctx.globalAlpha = 0.3 * intensity;
  ctx.beginPath();
  ctx.moveTo(x - width * 0.2, y);
  ctx.lineTo(x + width * 0.2, y);
  ctx.lineTo(x + width * 0.5, y + height);
  ctx.lineTo(x - width * 0.5, y + height);
  ctx.closePath();
  ctx.fill();
  // 6 flowing particles going upward
  ctx.globalAlpha = 0.8 * intensity;
  for (var i = 0; i < 6; i++) {
    var t = ((time / 600 + i / 6) % 1);
    var py = y + height - t * height;
    var px = x + Math.sin(t * Math.PI * 3 + i) * width * 0.3 * t;
    var psize = 2 + (1 - t) * 2;
    ctx.fillStyle = i % 2 === 0 ? '#ffffff' : color;
    ctx.beginPath();
    ctx.arc(px, py, psize, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ============================================================
 *  Scene: GamingScene (CORE)
 * ============================================================ */
function createGamingScene(engine) {
  var scene = {};
  var session = null;
  var slidingWindow = null;
  var comboMgr = null;
  var distanceState = null;
  var elapsed = 0;
  var now = 0;
  var timeUp = false;
  var endingTimer = 0;
  var particles = [];
  var flyingNumbers = [];
  var danmakuEntities = [];
  var ripples = [];
  var comboBursts = [];
  var signalWaves = [];
  var lastComboState = 0;
  var cosmicBorderAngle = 0;
  var comboStateData = COMBO_STATES[0];
  var cps = 0;
  var bossRotation = 0;
  var bossScale = 1;
  var bossShake = 0;
  var bossLift = 0;
  var comboGlowPulse = 0;
  var danmakuTimer = 0;

  var clickArea = { x: 37.5, y: 540, w: 300, h: 100 };

  function getNow() { return performance.now(); }

  scene.init = function(data) {
    elapsed = 0;
    now = getNow();
    session = createGameSession(now);
    slidingWindow = createSlidingWindow();
    comboMgr = createComboManager();
    distanceState = createDistanceState();
    timeUp = false;
    endingTimer = 0;
    particles = [];
    flyingNumbers = [];
    danmakuEntities = [];
    ripples = [];
    comboBursts = [];
    signalWaves = [];
    lastComboState = 0;
    cosmicBorderAngle = 0;
    comboStateData = COMBO_STATES[0];
    cps = 0;
    bossRotation = 0;
    bossScale = 1;
    bossShake = 0;
    bossLift = 0;
    comboGlowPulse = 0;
    danmakuTimer = 0;
  };

  scene.onPause = function() {
    if (session && !timeUp) {
      session = pauseSession(session, getNow());
    }
  };
  scene.onResume = function() {
    if (session && session.paused) {
      session = resumeSession(session, getNow());
    }
  };

  function triggerComboBurst(newState) {
    var idx = newState - 1;
    if (idx < 0) return;
    var text = COMBO_BURST_TEXTS[idx];
    var color = COMBO_BURST_COLORS[idx];
    // big text popup
    comboBursts.push({
      text: text, color: color, x: engine.screenWidth / 2, y: 300,
      alpha: 1, scale: 0.3, vy: -30, life: 1200, maxLife: 1200
    });
    // particle ring
    var numParticles = 16 + newState * 4;
    for (var i = 0; i < numParticles; i++) {
      var angle = (i / numParticles) * Math.PI * 2;
      var speed = 80 + Math.random() * 60;
      particles.push({
        x: engine.screenWidth / 2, y: 280,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        r: 2 + Math.random() * 3, color: color, life: 800, maxLife: 800
      });
    }
    // expanding rings
    comboBursts.push({
      isRing: true, x: engine.screenWidth / 2, y: 280,
      radius: 10, maxRadius: 180, color: color, alpha: 0.8, life: 600, maxLife: 600
    });
    // screen shake
    engine.triggerShake(8 + newState * 2, 400);
    // flash
    engine.triggerFlash(color, 0.3);
  }

  function spawnDanmaku(state) {
    var pool = DANMAKU[state] || DANMAKU[0];
    var text = pool[Math.floor(Math.random() * pool.length)];
    var fromLeft = Math.random() < 0.5;
    danmakuEntities.push({
      text: text,
      x: fromLeft ? -60 : engine.screenWidth + 60,
      y: 130 + Math.random() * 200,
      vx: (fromLeft ? 1 : -1) * (60 + Math.random() * 40),
      alpha: 0.7,
      color: COMBO_STATES[state].color,
      size: 12 + state * 2,
      life: 3000
    });
  }

  function spawnFlyingNumber(m, state) {
    var labels = ['', '+2万', '+4万', '+4亿', '+4亿'];
    var label = '';
    if (state === 0) label = '+1万';
    else label = labels[state] || ('+' + (m * BASE_UNIT) + '');
    flyingNumbers.push({
      text: label,
      x: engine.screenWidth / 2 + (Math.random() - 0.5) * 80,
      y: 460 + (Math.random() - 0.5) * 30,
      vy: -50 - Math.random() * 30,
      alpha: 1, scale: 0.8 + state * 0.15,
      color: COMBO_STATES[state].color,
      life: 1000, maxLife: 1000
    });
  }

  scene.update = function(dt) {
    elapsed += dt;
    now = getNow();

    if (!timeUp) {
      // check time up
      if (isTimeUp(session, now)) {
        timeUp = true;
        session = freezeSession(session, now);
        endingTimer = 0;
      }

      if (!timeUp) {
        // update CPS
        cps = getCPS(slidingWindow, now);
        // update combo machine
        var newMgr = updateComboMachine(comboMgr, cps, now);
        var oldState = comboMgr.currentExecutedState;
        comboMgr = newMgr;
        var newState = comboMgr.currentExecutedState;

        if (newState > oldState) {
          triggerComboBurst(newState);
          lastComboState = newState;
        }
        comboStateData = COMBO_STATES[newState];

        // danmaku spawning
        danmakuTimer += dt;
        var danmakuInterval = Math.max(300, 1200 - newState * 200);
        if (danmakuTimer > danmakuInterval) {
          danmakuTimer = 0;
          spawnDanmaku(newState);
        }
      }
    } else {
      endingTimer += dt;
      if (endingTimer > 500) {
        var result = getFinalResult(session, Math.random);
        engine.switchScene('result', {
          totalClicks: result.totalClicks,
          rawDistanceKM: result.rawDistanceKM,
          planet: result.planet
        });
        return;
      }
    }

    // boss animations based on combo
    var cs = comboMgr.currentExecutedState;
    bossRotation += dt * (0.001 + cs * 0.002);
    var targetScale = 1 + cs * 0.15;
    bossScale += (targetScale - bossScale) * 0.1;
    bossShake = cs >= 2 ? (Math.random() - 0.5) * cs * 2 : 0;
    var targetLift = cs >= 3 ? (cs - 2) * 30 : 0;
    bossLift += (targetLift - bossLift) * 0.08;
    comboGlowPulse += dt * (0.003 + cs * 0.002);

    cosmicBorderAngle += dt * 0.002;

    // update particles
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      p.vy += 100 * dt / 1000;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // update flying numbers
    for (var j = flyingNumbers.length - 1; j >= 0; j--) {
      var fn = flyingNumbers[j];
      fn.y += fn.vy * dt / 1000;
      fn.vy += 30 * dt / 1000;
      fn.life -= dt;
      fn.alpha = Math.max(0, fn.life / fn.maxLife);
      if (fn.life <= 0) flyingNumbers.splice(j, 1);
    }

    // update danmaku
    for (var k = danmakuEntities.length - 1; k >= 0; k--) {
      var dm = danmakuEntities[k];
      dm.x += dm.vx * dt / 1000;
      dm.life -= dt;
      dm.alpha = Math.min(0.8, dm.life / 500);
      if (dm.life <= 0 || dm.x < -100 || dm.x > engine.screenWidth + 100) danmakuEntities.splice(k, 1);
    }

    // update ripples
    for (var r = ripples.length - 1; r >= 0; r--) {
      var rp = ripples[r];
      rp.radius += rp.speed * dt / 1000;
      rp.alpha -= dt / 600;
      if (rp.alpha <= 0) ripples.splice(r, 1);
    }

    // update combo bursts
    for (var b = comboBursts.length - 1; b >= 0; b--) {
      var cb = comboBursts[b];
      cb.life -= dt;
      if (cb.isRing) {
        cb.radius += (cb.maxRadius - cb.radius) * 0.1;
        cb.alpha = Math.max(0, cb.life / cb.maxLife) * 0.8;
      } else {
        cb.y += cb.vy * dt / 1000;
        cb.vy += 20 * dt / 1000;
        cb.scale += (1.5 - cb.scale) * 0.15;
        cb.alpha = Math.max(0, cb.life / cb.maxLife);
      }
      if (cb.life <= 0) comboBursts.splice(b, 1);
    }

    // update signal waves
    for (var sw = signalWaves.length - 1; sw >= 0; sw--) {
      var w = signalWaves[sw];
      w.t += dt / 500;
      w.alpha = Math.max(0, 1 - w.t);
      if (w.t >= 1) signalWaves.splice(sw, 1);
    }
  };

  scene.render = function(ctx) {
    var remaining = session ? getRemainingTime(session, now) : 0;
    var seconds = remaining / 1000;
    var cs = comboMgr ? comboMgr.currentExecutedState : 0;
    var stateData = COMBO_STATES[cs];

    // cosmic rainbow border when in Cosmic state
    if (cs === 4) {
      var rainbowColors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0099ff', '#4b0082', '#9400d3'];
      for (var bi = 0; bi < 7; bi++) {
        var ang = cosmicBorderAngle + (bi / 7) * Math.PI * 2;
        ctx.strokeStyle = rainbowColors[bi];
        ctx.lineWidth = 6;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(engine.screenWidth / 2, engine.screenHeight / 2, 190, ang, ang + Math.PI / 3.5);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // timer at top
    var timerColor = '#00ddff';
    if (seconds <= 3) timerColor = '#ff4444';
    else if (seconds <= 5) timerColor = '#ff922b';
    ctx.fillStyle = timerColor;
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = timerColor;
    ctx.shadowBlur = 20;
    ctx.fillText(seconds.toFixed(1), engine.screenWidth / 2, 45);
    ctx.shadowBlur = 0;
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#6666aa';
    ctx.fillText('剩余时间', engine.screenWidth / 2, 75);

    // combo gauge bar (5 segments)
    var gaugeX = 50, gaugeY = 90, gaugeW = 275, gaugeH = 12;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    engine.roundRect(ctx, gaugeX, gaugeY, gaugeW, gaugeH, 6);
    ctx.fill();
    var segW = gaugeW / 5;
    for (var si = 0; si < 5; si++) {
      if (si < cs + 1) {
        ctx.fillStyle = COMBO_STATES[si].color;
        engine.roundRect(ctx, gaugeX + si * segW + 1, gaugeY + 1, segW - 2, gaugeH - 2, 4);
        ctx.fill();
      }
    }
    // combo label
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = stateData.color;
    ctx.fillText(stateData.name + ' - ' + stateData.label, engine.screenWidth / 2, gaugeY + 26);

    // UFO with beam above boss
    var ufoX = engine.screenWidth / 2;
    var ufoY = 150 + Math.sin(elapsed / 500) * 8 - bossLift * 0.3;
    var beamIntensity = 0.5 + cs * 0.15;
    drawBeam(ctx, ufoX, ufoY + 16, 50 + cs * 10, 120 - bossLift, stateData.color, elapsed, beamIntensity);
    drawUFO(ctx, ufoX, ufoY, elapsed, stateData.color, cs);

    // boss emoji with transforms
    var bossY = 300 - bossLift;
    ctx.save();
    ctx.translate(ufoX + bossShake, bossY);
    ctx.rotate(bossRotation);
    ctx.scale(bossScale, bossScale);
    // glow
    if (cs >= 2) {
      ctx.shadowColor = stateData.color;
      ctx.shadowBlur = 20 + 10 * Math.sin(comboGlowPulse);
    }
    ctx.font = '52px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(stateData.boss, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    // danmaku
    for (var di = 0; di < danmakuEntities.length; di++) {
      var dm2 = danmakuEntities[di];
      ctx.globalAlpha = dm2.alpha;
      ctx.fillStyle = dm2.color;
      ctx.font = 'bold ' + dm2.size + 'px sans-serif';
      ctx.textAlign = dm2.x < engine.screenWidth / 2 ? 'left' : 'right';
      ctx.fillText(dm2.text, dm2.x, dm2.y);
      ctx.globalAlpha = 1;
    }

    // signal waves (from click area to UFO)
    for (var swi = 0; swi < signalWaves.length; swi++) {
      var sw2 = signalWaves[swi];
      ctx.strokeStyle = stateData.color;
      ctx.globalAlpha = sw2.alpha * 0.5;
      ctx.lineWidth = 2;
      ctx.beginPath();
      var waveY = clickArea.y + (ufoY - clickArea.y) * sw2.t;
      var waveW = 20 + sw2.t * 60;
      ctx.arc(ufoX, waveY, waveW, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // flying numbers
    for (var fni = 0; fni < flyingNumbers.length; fni++) {
      var fn2 = flyingNumbers[fni];
      ctx.globalAlpha = fn2.alpha;
      ctx.fillStyle = fn2.color;
      ctx.font = 'bold ' + Math.floor(18 * fn2.scale) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = fn2.color;
      ctx.shadowBlur = 8;
      ctx.fillText(fn2.text, fn2.x, fn2.y);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // click ripples
    for (var ri = 0; ri < ripples.length; ri++) {
      var rp2 = ripples[ri];
      ctx.strokeStyle = stateData.color;
      ctx.globalAlpha = rp2.alpha;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(rp2.x, rp2.y, rp2.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // combo bursts (rings and text)
    for (var bi2 = 0; bi2 < comboBursts.length; bi2++) {
      var cb2 = comboBursts[bi2];
      if (cb2.isRing) {
        ctx.strokeStyle = cb2.color;
        ctx.globalAlpha = cb2.alpha;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cb2.x, cb2.y, cb2.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = cb2.alpha;
        ctx.fillStyle = cb2.color;
        ctx.font = 'bold ' + Math.floor(36 * cb2.scale) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = cb2.color;
        ctx.shadowBlur = 15;
        ctx.fillText(cb2.text, cb2.x, cb2.y);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }

    // particles
    for (var pi = 0; pi < particles.length; pi++) {
      var pp = particles[pi];
      var pAlpha = pp.life / pp.maxLife;
      ctx.globalAlpha = pAlpha;
      ctx.fillStyle = pp.color;
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, pp.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // click area at bottom
    var areaGrad = ctx.createLinearGradient(0, clickArea.y, 0, clickArea.y + clickArea.h);
    areaGrad.addColorStop(0, 'rgba(77, 171, 247, 0.2)');
    areaGrad.addColorStop(1, 'rgba(77, 171, 247, 0.05)');
    ctx.fillStyle = areaGrad;
    engine.roundRect(ctx, clickArea.x, clickArea.y, clickArea.w, clickArea.h, 16);
    ctx.fill();
    ctx.strokeStyle = stateData.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(elapsed / 200);
    engine.roundRect(ctx, clickArea.x, clickArea.y, clickArea.w, clickArea.h, 16);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // button text
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('📡 发射信号', engine.screenWidth / 2, clickArea.y + 38);
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#8888bb';
    ctx.fillText('疯狂点击此区域', engine.screenWidth / 2, clickArea.y + 70);

    // click counter
    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('点击: ' + session.totalClicks + ' 次', engine.screenWidth / 2, 520);

    // CPS display
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#6666aa';
    ctx.fillText('CPS: ' + cps, engine.screenWidth / 2, 635);
  };

  scene.onTouchStart = function(x, y) {
    if (timeUp) return;
    if (engine.hitTest(x, y, clickArea) || y < 540) {
      // register click
      var clickTime = getNow();
      slidingWindow = recordClick(slidingWindow, clickTime);
      var m = getMultiplierM(comboMgr);
      var distInc = BASE_UNIT * m;
      session = registerClick(session, clickTime, distInc);
      distanceState = addDistanceByMultiplier(distanceState, m);

      var cs = comboMgr.currentExecutedState;
      // ripples
      ripples.push({ x: x, y: y, radius: 5, speed: 120, alpha: 0.8 });
      // flying number
      spawnFlyingNumber(m, cs);
      // signal wave
      signalWaves.push({ t: 0, alpha: 1 });
      // mini particles on click
      for (var i = 0; i < 3 + cs; i++) {
        var ang = Math.random() * Math.PI * 2;
        var spd = 30 + Math.random() * 50;
        particles.push({
          x: x, y: y,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 30,
          r: 1.5 + Math.random() * 2, color: COMBO_STATES[cs].color,
          life: 400, maxLife: 400
        });
      }
    }
  };
  scene.onTouchEnd = function(x, y) {};

  return scene;
}

/* ============================================================
 *  Scene: ResultScene
 * ============================================================ */
function createResultScene(engine) {
  var scene = {};
  var data = null;
  var timer = 0;
  var bossFlyX = -100;
  var bossRotation = 0;
  var trailSuitcase = [];
  var impactParticles = [];
  var planetScale = 0;
  var ringRotation = 0;
  var returnStarted = false;
  var returnDanmaku = [];
  var bgColorCycle = 0;
  var skipBtn = { x: 280, y: 600, w: 80, h: 36 };
  var autoAdvanceTimer = 0;
  var formattedDist = '';
  var confettiList = [];

  scene.init = function(d) {
    data = d;
    timer = 0;
    bossFlyX = -100;
    bossRotation = 0;
    trailSuitcase = [];
    impactParticles = [];
    planetScale = 0;
    ringRotation = 0;
    returnStarted = false;
    returnDanmaku = [];
    bgColorCycle = 0;
    autoAdvanceTimer = 0;
    confettiList = [];
    formattedDist = formatDistance(data.rawDistanceKM);
    // save ranking
    var store = storage.getRankingStore();
    var entry = { totalClicks: data.totalClicks, timestamp: Date.now(), planet: data.planet.name };
    store = addScore(store, entry);
    storage.saveRankingStore(store);
    // update high score
    var hs = storage.getHighScore();
    if (isNewRecord(hs, data.totalClicks)) {
      storage.setHighScore(data.totalClicks);
      // confetti for new record
      for (var i = 0; i < 40; i++) {
        confettiList.push({
          x: Math.random() * engine.screenWidth,
          y: -20 - Math.random() * 200,
          vx: (Math.random() - 0.5) * 40,
          vy: 80 + Math.random() * 60,
          r: 3 + Math.random() * 4,
          color: ['#ff4444', '#4dabf7', '#ffd700', '#51cf66', '#cc5de8'][Math.floor(Math.random() * 5)],
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 5,
          life: 5000
        });
      }
    }
  };

  function elasticOut(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    var p = 0.3;
    return Math.pow(2, -10 * t) * Math.sin((t - p / 4) * (2 * Math.PI) / p) + 1;
  }

  function spawnImpactParticles() {
    for (var i = 0; i < 20; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 60 + Math.random() * 100;
      impactParticles.push({
        x: engine.screenWidth / 2, y: 200,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        r: 2 + Math.random() * 3,
        color: ['#ffffff', '#ffd700', '#ff922b'][Math.floor(Math.random() * 3)],
        life: 800, maxLife: 800
      });
    }
  }

  function spawnReturnDanmaku() {
    var pool = ['我还会回来的！', '可恶！', '等我恢复...', '还没有结束！', '我会复仇的！'];
    var text = pool[Math.floor(Math.random() * pool.length)];
    returnDanmaku.push({
      text: text,
      x: Math.random() * (engine.screenWidth - 100) + 50,
      y: 100 + Math.random() * 300,
      vy: -20 - Math.random() * 20,
      alpha: 1, life: 2000, maxLife: 2000,
      color: ['#ff4444', '#ffd700', '#ff922b'][Math.floor(Math.random() * 3)]
    });
  }

  scene.update = function(dt) {
    timer += dt;
    ringRotation += dt * 0.001;

    // boss flies in from left (0-800ms)
    if (timer < 800) {
      var t = timer / 800;
      bossFlyX = -100 + t * (engine.screenWidth / 2 + 100);
      bossRotation = t * Math.PI * 4;
      // trailing suitcases
      if (Math.random() < 0.5) {
        trailSuitcase.push({
          x: bossFlyX - 20, y: 200 + Math.sin(timer / 100) * 10,
          rot: Math.random() * Math.PI * 2,
          vy: -20, life: 600, maxLife: 600
        });
      }
    } else if (timer < 850 && impactParticles.length === 0) {
      // impact at 800ms
      bossFlyX = engine.screenWidth / 2;
      bossRotation = 0;
      spawnImpactParticles();
      engine.triggerFlash('#ffffff', 0.7);
      engine.triggerShake(15, 500);
    }

    // update trail suitcases
    for (var i = trailSuitcase.length - 1; i >= 0; i--) {
      var ts = trailSuitcase[i];
      ts.y += ts.vy * dt / 1000;
      ts.life -= dt;
      if (ts.life <= 0) trailSuitcase.splice(i, 1);
    }

    // update impact particles
    for (var j = impactParticles.length - 1; j >= 0; j--) {
      var ip = impactParticles[j];
      ip.x += ip.vx * dt / 1000;
      ip.y += ip.vy * dt / 1000;
      ip.vy += 100 * dt / 1000;
      ip.life -= dt;
      if (ip.life <= 0) impactParticles.splice(j, 1);
    }

    // planet elastic scale (after impact)
    if (timer > 800) {
      var pt = (timer - 800) / 600;
      planetScale = elasticOut(Math.min(1, pt));
    }

    // return animation at 2200ms
    if (timer >= 2200 && !returnStarted) {
      returnStarted = true;
      engine.triggerShake(10, 300);
    }
    if (returnStarted) {
      bgColorCycle += dt * 0.005;
      if (Math.random() < 0.1) spawnReturnDanmaku();
    }

    // update return danmaku
    for (var k = returnDanmaku.length - 1; k >= 0; k--) {
      var rd = returnDanmaku[k];
      rd.y += rd.vy * dt / 1000;
      rd.life -= dt;
      rd.alpha = Math.max(0, rd.life / rd.maxLife);
      if (rd.life <= 0) returnDanmaku.splice(k, 1);
    }

    // confetti
    for (var ci = confettiList.length - 1; ci >= 0; ci--) {
      var cf = confettiList[ci];
      cf.x += cf.vx * dt / 1000;
      cf.y += cf.vy * dt / 1000;
      cf.rot += cf.rotSpeed * dt / 1000;
      cf.life -= dt;
      if (cf.life <= 0 || cf.y > engine.screenHeight + 20) confettiList.splice(ci, 1);
    }

    // auto advance to sector after 4500ms
    if (timer >= 4500) {
      autoAdvanceTimer += dt;
      if (autoAdvanceTimer > 100) {
        engine.switchScene('sector', { result: data });
      }
    }
  };

  scene.render = function(ctx) {
    // background color cycling during return
    if (returnStarted) {
      var bgColors = ['#2a0a0a', '#0a2a0a', '#0a0a2a', '#2a2a0a'];
      var idx = Math.floor(bgColorCycle) % bgColors.length;
      ctx.fillStyle = bgColors[idx];
      ctx.globalAlpha = 0.3;
      ctx.fillRect(0, 0, engine.screenWidth, engine.screenHeight);
      ctx.globalAlpha = 1;
    }

    // trailing suitcases
    for (var i = 0; i < trailSuitcase.length; i++) {
      var ts2 = trailSuitcase[i];
      var alpha = ts2.life / ts2.maxLife;
      ctx.globalAlpha = alpha;
      ctx.save();
      ctx.translate(ts2.x, ts2.y);
      ctx.rotate(ts2.rot);
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💼', 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // boss flying in / impact
    if (timer < 850) {
      ctx.save();
      ctx.translate(bossFlyX, 200);
      ctx.rotate(bossRotation);
      ctx.font = '48px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🚀', 0, 0);
      ctx.restore();
    }

    // impact text at 800ms
    if (timer >= 800 && timer < 1200) {
      var impactAlpha = Math.max(0, 1 - (timer - 800) / 400);
      ctx.globalAlpha = impactAlpha;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 20;
      ctx.fillText('砰！💥', engine.screenWidth / 2, 180);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // impact particles
    for (var j = 0; j < impactParticles.length; j++) {
      var ip2 = impactParticles[j];
      var iAlpha = ip2.life / ip2.maxLife;
      ctx.globalAlpha = iAlpha;
      ctx.fillStyle = ip2.color;
      ctx.beginPath();
      ctx.arc(ip2.x, ip2.y, ip2.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // planet with elastic scale + rotating ring (after impact)
    if (timer > 800) {
      var planetY = 220;
      // rotating ring
      ctx.save();
      ctx.translate(engine.screenWidth / 2, planetY);
      ctx.rotate(ringRotation);
      ctx.strokeStyle = 'rgba(77, 171, 247, 0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, 60, 20, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(204, 93, 232, 0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 75, 25, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // planet emoji
      ctx.save();
      ctx.translate(engine.screenWidth / 2, planetY);
      ctx.scale(planetScale, planetScale);
      ctx.font = '64px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(data.planet.emoji, 0, 0);
      ctx.restore();
    }

    // result text (after impact)
    if (timer > 1000) {
      ctx.textAlign = 'center';
      ctx.font = '15px sans-serif';
      ctx.fillStyle = '#aaaadd';
      ctx.fillText('老板被发射到了...', engine.screenWidth / 2, 310);

      // planet name with glow
      ctx.font = 'bold 26px sans-serif';
      ctx.fillStyle = '#00ddff';
      ctx.shadowColor = '#00ddff';
      ctx.shadowBlur = 15;
      ctx.fillText(data.planet.name, engine.screenWidth / 2, 345);
      ctx.shadowBlur = 0;

      // total clicks
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('总点击: ' + data.totalClicks + ' 次', engine.screenWidth / 2, 380);

      // cosmic distance with pulse
      var pulseScale = 1 + 0.1 * Math.sin(timer / 200);
      ctx.save();
      ctx.translate(engine.screenWidth / 2, 410);
      ctx.scale(pulseScale, pulseScale);
      ctx.font = 'bold 18px sans-serif';
      ctx.fillStyle = '#51cf66';
      ctx.shadowColor = '#51cf66';
      ctx.shadowBlur = 10;
      ctx.fillText('距离: ' + data.planet.cosmicDistance, 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();

      // raw distance
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#6666aa';
      ctx.fillText('(实际: ' + formattedDist + ')', engine.screenWidth / 2, 440);
    }

    // return animation at 2200ms
    if (returnStarted) {
      var rt = timer - 2200;
      ctx.save();
      ctx.translate(engine.screenWidth / 2, 300);
      // jagged octagon frame
      var octR = 50;
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (var oi = 0; oi <= 8; oi++) {
        var oang = (oi / 8) * Math.PI * 2;
        var ojag = oi % 2 === 0 ? octR : octR - 8;
        var ox = Math.cos(oang) * ojag;
        var oy = Math.sin(oang) * ojag;
        if (oi === 0) ctx.moveTo(ox, oy);
        else ctx.lineTo(ox, oy);
      }
      ctx.closePath();
      ctx.stroke();

      // impact lines
      ctx.strokeStyle = 'rgba(255, 68, 68, 0.6)';
      ctx.lineWidth = 2;
      for (var il = 0; il < 8; il++) {
        var ilAng = (il / 8) * Math.PI * 2 + Math.sin(rt / 200) * 0.1;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ilAng) * octR, Math.sin(ilAng) * octR);
        ctx.lineTo(Math.cos(ilAng) * (octR + 15), Math.sin(ilAng) * (octR + 15));
        ctx.stroke();
      }

      // boss emoji with damage
      ctx.font = '44px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🧑‍💼', 0, 0);

      // battle damage scars
      ctx.strokeStyle = '#ff6666';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-15, -10); ctx.lineTo(-5, 5);
      ctx.moveTo(10, -8); ctx.lineTo(18, 5);
      ctx.moveTo(-8, 10); ctx.lineTo(5, 15);
      ctx.stroke();

      // anger symbol
      ctx.font = '20px sans-serif';
      ctx.fillText('💢', 25, -25);

      // white text with black outline
      ctx.font = 'bold 13px sans-serif';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.strokeText('我一定会回来的', 0, 70);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('我一定会回来的', 0, 70);
      ctx.restore();
    }

    // return danmaku
    for (var dk = 0; dk < returnDanmaku.length; dk++) {
      var rd2 = returnDanmaku[dk];
      ctx.globalAlpha = rd2.alpha;
      ctx.fillStyle = rd2.color;
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(rd2.text, rd2.x, rd2.y);
      ctx.globalAlpha = 1;
    }

    // confetti
    for (var cf2 = 0; cf2 < confettiList.length; cf2++) {
      var cf3 = confettiList[cf2];
      var cfAlpha = Math.min(1, cf3.life / 1000);
      ctx.globalAlpha = cfAlpha;
      ctx.save();
      ctx.translate(cf3.x, cf3.y);
      ctx.rotate(cf3.rot);
      ctx.fillStyle = cf3.color;
      ctx.fillRect(-cf3.r, -cf3.r / 2, cf3.r * 2, cf3.r);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // skip button
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    engine.roundRect(ctx, skipBtn.x, skipBtn.y, skipBtn.w, skipBtn.h, 18);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    engine.roundRect(ctx, skipBtn.x, skipBtn.y, skipBtn.w, skipBtn.h, 18);
    ctx.stroke();
    ctx.fillStyle = '#aaaadd';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('跳过 ⏭', skipBtn.x + skipBtn.w / 2, skipBtn.y + skipBtn.h / 2);
  };

  scene.onTouchStart = function(x, y) {
    if (engine.hitTest(x, y, skipBtn)) {
      engine.switchScene('sector', { result: data });
    }
  };
  scene.onTouchEnd = function(x, y) {};

  return scene;
}

/* ============================================================
 *  Scene: SectorScene
 * ============================================================ */
function createSectorScene(engine) {
  var scene = {};
  var timer = 0;
  var ufoTime = 0;
  var result = null;
  var industries = [
    { id: 'internet', name: '互联网', emoji: '💻' },
    { id: 'finance', name: '金融', emoji: '💰' },
    { id: 'energy', name: '新能源', emoji: '⚡' },
    { id: 'education', name: '教育培训', emoji: '📚' },
    { id: 'medical', name: '医疗健康', emoji: '🏥' },
    { id: 'realestate', name: '房地产', emoji: '🏠' },
    { id: 'manufacturing', name: '制造业', emoji: '🏭' },
    { id: 'ecommerce', name: '电商物流', emoji: '📦' },
  ];
  var buttons = [];
  var randomBtn = { x: 37.5, y: 600, w: 300, h: 50 };

  scene.init = function(data) {
    timer = 0;
    ufoTime = 0;
    result = data.result;
    buttons = [];
    var cols = 2;
    var bw = 145, bh = 60, gap = 10;
    var startX = (engine.screenWidth - (bw * cols + gap)) / 2;
    var startY = 180;
    for (var i = 0; i < industries.length; i++) {
      var col = i % cols;
      var row = Math.floor(i / cols);
      buttons.push({
        x: startX + col * (bw + gap),
        y: startY + row * (bh + gap),
        w: bw, h: bh,
        industry: industries[i],
        wobble: 0,
        appearDelay: i * 80,
        appeared: false
      });
    }
  };

  scene.update = function(dt) {
    timer += dt;
    ufoTime += dt;
    for (var i = 0; i < buttons.length; i++) {
      var btn = buttons[i];
      if (timer > btn.appearDelay) {
        btn.appeared = true;
        btn.wobble = Math.sin(timer / 300 + i) * 2;
      }
    }
  };

  scene.render = function(ctx) {
    // UFO dragging boss at top
    var ufoX = engine.screenWidth / 2 + Math.sin(ufoTime / 600) * 20;
    var ufoY = 60 + Math.sin(ufoTime / 400) * 8;
    drawBeam(ctx, ufoX, ufoY + 16, 40, 50, '#4dabf7', ufoTime, 0.6);
    drawUFO(ctx, ufoX, ufoY, ufoTime, '#4dabf7', 0);
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🧑‍💼', ufoX, ufoY + 60);

    // title
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('请选择发配老板的苦力行业', engine.screenWidth / 2, 140);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#6666aa';
    ctx.fillText('选择行业决定老板的最终去向', engine.screenWidth / 2, 160);

    // industry buttons
    for (var i = 0; i < buttons.length; i++) {
      var btn = buttons[i];
      if (!btn.appeared) continue;
      var appearProgress = Math.min(1, (timer - btn.appearDelay) / 300);
      ctx.save();
      ctx.globalAlpha = appearProgress;
      ctx.translate(0, btn.wobble);
      var grad = ctx.createLinearGradient(0, btn.y, 0, btn.y + btn.h);
      grad.addColorStop(0, 'rgba(77, 171, 247, 0.3)');
      grad.addColorStop(1, 'rgba(77, 171, 247, 0.1)');
      ctx.fillStyle = grad;
      engine.roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(77, 171, 247, 0.5)';
      ctx.lineWidth = 1.5;
      engine.roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 12);
      ctx.stroke();
      // emoji
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(btn.industry.emoji, btn.x + 15, btn.y + btn.h / 2);
      // name
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(btn.industry.name, btn.x + 50, btn.y + btn.h / 2);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // random button
    var randPulse = 0.5 + 0.5 * Math.sin(timer / 200);
    ctx.fillStyle = 'rgba(204, 93, 232, ' + (0.2 + randPulse * 0.15) + ')';
    engine.roundRect(ctx, randomBtn.x, randomBtn.y, randomBtn.w, randomBtn.h, 25);
    ctx.fill();
    ctx.strokeStyle = '#cc5de8';
    ctx.lineWidth = 2;
    engine.roundRect(ctx, randomBtn.x, randomBtn.y, randomBtn.w, randomBtn.h, 25);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🎲 随机发配 (跳过选择)', engine.screenWidth / 2, randomBtn.y + randomBtn.h / 2);
  };

  scene.onTouchStart = function(x, y) {
    for (var i = 0; i < buttons.length; i++) {
      var btn = buttons[i];
      if (btn.appeared && engine.hitTest(x, y, btn)) {
        engine.switchScene('archive', { result: result, industry: btn.industry.name });
        return;
      }
    }
    if (engine.hitTest(x, y, randomBtn)) {
      var randomIdx = Math.floor(Math.random() * industries.length);
      engine.switchScene('archive', { result: result, industry: industries[randomIdx].name });
    }
  };
  scene.onTouchEnd = function(x, y) {};

  return scene;
}

/* ============================================================
 *  Scene: ArchiveScene
 * ============================================================ */
function createArchiveScene(engine) {
  var scene = {};
  var timer = 0;
  var data = null;
  var stampScale = 2.5;
  var stampDropped = false;
  var rankDisplay = 0;
  var targetRank = 1;
  var exceedPercent = 0;
  var totalParticipants = 0;
  var replayBtn = { x: 37.5, y: 530, w: 160, h: 50 };
  var shareBtn = { x: 212.5, y: 530, w: 125, h: 50 };
  var isNewRec = false;
  var confettiList = [];

  scene.init = function(d) {
    timer = 0;
    data = d;
    stampScale = 2.5;
    stampDropped = false;
    confettiList = [];

    // calculate ranking
    var store = storage.getRankingStore();
    targetRank = getRank(store, data.result.totalClicks);
    totalParticipants = store.length;
    exceedPercent = totalParticipants > 0 ? Math.round((1 - targetRank / (totalParticipants + 1)) * 100) : 100;
    if (exceedPercent < 0) exceedPercent = 0;

    var hs = storage.getHighScore();
    isNewRec = isNewRecord(hs, data.result.totalClicks) && data.result.totalClicks === hs;

    if (isNewRec) {
      for (var i = 0; i < 30; i++) {
        confettiList.push({
          x: Math.random() * engine.screenWidth,
          y: -20 - Math.random() * 100,
          vx: (Math.random() - 0.5) * 30,
          vy: 60 + Math.random() * 50,
          r: 3 + Math.random() * 3,
          color: ['#ff4444', '#4dabf7', '#ffd700', '#51cf66', '#cc5de8'][Math.floor(Math.random() * 5)],
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 4,
          life: 4000
        });
      }
    }
  };

  scene.update = function(dt) {
    timer += dt;

    // stamp slam animation
    if (timer < 400) {
      stampScale = 2.5 - (timer / 400) * 1.5;
    } else if (!stampDropped) {
      stampScale = 1;
      stampDropped = true;
      engine.triggerShake(8, 300);
      rankDisplay = 0;
    }

    // rank counting up
    if (stampDropped) {
      if (rankDisplay < targetRank) {
        rankDisplay += Math.max(1, Math.ceil((targetRank - rankDisplay) / 10));
        if (rankDisplay > targetRank) rankDisplay = targetRank;
      }
    }

    // confetti
    for (var i = confettiList.length - 1; i >= 0; i--) {
      var cf = confettiList[i];
      cf.x += cf.vx * dt / 1000;
      cf.y += cf.vy * dt / 1000;
      cf.rot += cf.rotSpeed * dt / 1000;
      cf.life -= dt;
      if (cf.life <= 0 || cf.y > engine.screenHeight + 20) confettiList.splice(i, 1);
    }
  };

  scene.render = function(ctx) {
    // stamp slam animation
    if (timer < 500) {
      ctx.save();
      ctx.translate(engine.screenWidth / 2, 100);
      ctx.scale(stampScale, stampScale);
      ctx.rotate(-0.15);
      ctx.fillStyle = '#ff4444';
      ctx.globalAlpha = Math.min(1, timer / 100);
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeText('绝密档案', 0, 0);
      ctx.fillText('绝密档案', 0, 0);
      // stamp border
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 3;
      ctx.strokeRect(-70, -22, 140, 44);
      ctx.globalAlpha = 1;
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(engine.screenWidth / 2, 100);
      ctx.rotate(-0.15);
      ctx.fillStyle = 'rgba(255, 68, 68, 0.8)';
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeText('绝密档案', 0, 0);
      ctx.fillText('绝密档案', 0, 0);
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 3;
      ctx.strokeRect(-70, -22, 140, 44);
      ctx.restore();
    }

    // planet emoji + arrived
    ctx.textAlign = 'center';
    ctx.font = '48px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(data.result.planet.emoji, engine.screenWidth / 2, 175);
    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = '#00ddff';
    ctx.fillText('已抵达: ' + data.result.planet.name, engine.screenWidth / 2, 215);

    // industry
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('老板 发配至: ' + (data.industry || '随机') + '行业', engine.screenWidth / 2, 245);

    // ranking card
    var cardX = 30, cardY = 270, cardW = 315, cardH = 130;
    ctx.fillStyle = 'rgba(77, 171, 247, 0.1)';
    engine.roundRect(ctx, cardX, cardY, cardW, cardH, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(77, 171, 247, 0.3)';
    ctx.lineWidth = 1;
    engine.roundRect(ctx, cardX, cardY, cardW, cardH, 12);
    ctx.stroke();

    ctx.fillStyle = '#aaaadd';
    ctx.font = '13px sans-serif';
    ctx.fillText('你在全网打工人中排名第', engine.screenWidth / 2, cardY + 25);

    // big rank number
    ctx.font = 'bold 42px sans-serif';
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 15;
    ctx.fillText(rankDisplay, engine.screenWidth / 2, cardY + 60);
    ctx.shadowBlur = 0;

    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#51cf66';
    ctx.fillText('超越全网 ' + exceedPercent + '% 的卷王', engine.screenWidth / 2, cardY + 95);

    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#6666aa';
    ctx.fillText('共有 ' + totalParticipants + ' 位打工人参与', engine.screenWidth / 2, cardY + 115);

    // click count + distance
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('点击: ' + data.result.totalClicks + ' 次  |  距离: ' + data.result.planet.cosmicDistance, engine.screenWidth / 2, 425);

    // new record banner
    if (isNewRec) {
      var bannerPulse = 1 + 0.05 * Math.sin(timer / 150);
      ctx.save();
      ctx.translate(engine.screenWidth / 2, 465);
      ctx.scale(bannerPulse, bannerPulse);
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 18px sans-serif';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 15;
      ctx.fillText('🏆 新纪录！', 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // confetti
    for (var i = 0; i < confettiList.length; i++) {
      var cf2 = confettiList[i];
      ctx.save();
      ctx.translate(cf2.x, cf2.y);
      ctx.rotate(cf2.rot);
      ctx.fillStyle = cf2.color;
      ctx.fillRect(-cf2.r, -cf2.r / 2, cf2.r * 2, cf2.r);
      ctx.restore();
    }

    // replay button
    var replayGrad = ctx.createLinearGradient(0, replayBtn.y, 0, replayBtn.y + replayBtn.h);
    replayGrad.addColorStop(0, '#5c7cfa');
    replayGrad.addColorStop(1, '#7950f2');
    ctx.fillStyle = replayGrad;
    engine.roundRect(ctx, replayBtn.x, replayBtn.y, replayBtn.w, replayBtn.h, 25);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 17px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔄 再抓一次', replayBtn.x + replayBtn.w / 2, replayBtn.y + replayBtn.h / 2);

    // share button
    ctx.fillStyle = 'rgba(81, 207, 102, 0.2)';
    engine.roundRect(ctx, shareBtn.x, shareBtn.y, shareBtn.w, shareBtn.h, 25);
    ctx.fill();
    ctx.strokeStyle = '#51cf66';
    ctx.lineWidth = 2;
    engine.roundRect(ctx, shareBtn.x, shareBtn.y, shareBtn.w, shareBtn.h, 25);
    ctx.stroke();
    ctx.fillStyle = '#51cf66';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText('📢 低调炫耀', shareBtn.x + shareBtn.w / 2, shareBtn.y + shareBtn.h / 2);
  };

  scene.onTouchStart = function(x, y) {
    if (engine.hitTest(x, y, replayBtn)) {
      engine.switchScene('home', {});
      return;
    }
    if (engine.hitTest(x, y, shareBtn)) {
      var text = getShareText(data.result.planet.id);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {}, function() {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
      return;
    }
  };
  scene.onTouchEnd = function(x, y) {};

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  return scene;
}

/* ============================================================
 *  Bootstrap
 * ============================================================ */
(function() {
  var canvas = document.getElementById('gameCanvas');
  var engine = createEngine(canvas);
  engine.switchScene('home', {});
})();





</script>
