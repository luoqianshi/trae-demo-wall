<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影戏乾坤 - 数字皮影工坊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'SimSun', sans-serif; background: #1a0a00; overflow: hidden; height: 100vh; width: 100vw; }

        /* ========== 标题页 ========== */
        #title-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #3a1a0a 0%, #1a0a00 70%);
            z-index: 5000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.8s ease;
        }
        #title-screen.hide { opacity: 0; pointer-events: none; }
        #title-screen h1 {
            font-size: 72px; color: #d4af37; letter-spacing: 20px;
            text-shadow: 0 0 30px rgba(212,175,55,0.6), 0 0 60px rgba(212,175,55,0.3);
            margin-bottom: 10px; animation: titleGlow 3s ease-in-out infinite alternate;
        }
        @keyframes titleGlow { 0% { text-shadow: 0 0 20px rgba(212,175,55,0.4); } 100% { text-shadow: 0 0 40px rgba(212,175,55,0.8), 0 0 80px rgba(212,175,55,0.4); } }
        #title-screen .subtitle { color: #8b6914; font-size: 18px; letter-spacing: 8px; margin-bottom: 50px; }
        #title-screen .title-puppet { width: 200px; height: 200px; margin-bottom: 30px; filter: drop-shadow(0 0 20px rgba(212,175,55,0.5)); animation: floatPuppet 4s ease-in-out infinite; }
        @keyframes floatPuppet { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .title-btn {
            padding: 14px 50px; font-size: 20px; margin: 8px;
            background: linear-gradient(135deg, #8b6914 0%, #6b5010 100%);
            border: 2px solid #d4af37; border-radius: 30px; color: #fff;
            cursor: pointer; transition: all 0.3s ease; letter-spacing: 4px;
        }
        .title-btn:hover { background: linear-gradient(135deg, #d4af37 0%, #8b6914 100%); box-shadow: 0 0 25px rgba(212,175,55,0.6); transform: scale(1.05); }

        /* ========== 主舞台 ========== */
        #stage { position: relative; width: 100%; height: 100%; background: linear-gradient(180deg, #2a1810 0%, #1a0f0a 100%); overflow: hidden; }
        #curtain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 50%, rgba(255,200,100,0.15) 0%, transparent 50%), radial-gradient(ellipse at 70% 50%, rgba(255,180,80,0.1) 0%, transparent 50%), repeating-linear-gradient(90deg, rgba(139,69,19,0.1) 0px, rgba(160,82,45,0.1) 2px, rgba(139,69,19,0.1) 4px); pointer-events: none; z-index: 1; }
        #lighting { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; mix-blend-mode: screen; background: radial-gradient(ellipse at 50% 40%, rgba(255,220,150,0.3) 0%, rgba(255,180,100,0.1) 30%, transparent 60%); filter: blur(20px); transition: background 0.5s ease; }
        #scene-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.3; transition: opacity 0.5s ease; }

        /* ========== 皮影角色 ========== */
        .puppet { position: absolute; cursor: grab; user-select: none; z-index: 10; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.8)); transition: filter 0.5s ease, opacity 0.5s ease; }
        .puppet.dim { filter: grayscale(80%) brightness(0.4) drop-shadow(2px 4px 6px rgba(0,0,0,0.8)); opacity: 0.7; }
        .puppet.lit { filter: drop-shadow(0 0 15px rgba(255,200,100,0.6)) drop-shadow(2px 4px 6px rgba(0,0,0,0.8)); opacity: 1; }
        .puppet:active { cursor: grabbing; }
        .puppet.dragging { opacity: 0.85; z-index: 100; }
        .puppet.snapped { animation: snapFlash 0.4s ease; }
        @keyframes snapFlash { 0% { filter: brightness(1); } 50% { filter: brightness(2.5) drop-shadow(0 0 25px rgba(255,220,100,1)); } 100% { filter: brightness(1); } }
        .puppet.selected { filter: brightness(1.3) drop-shadow(0 0 12px rgba(255,220,150,0.8)); }
        .puppet.near-match { filter: brightness(1.2) drop-shadow(0 0 15px rgba(255,255,100,0.7)); }
        .puppet.matched { filter: brightness(1.3) drop-shadow(0 0 15px rgba(100,255,100,0.6)); }

        /* 部件标签 */
        .part-label {
            position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
            background: rgba(20,10,5,0.9); color: #d4af37; padding: 2px 8px;
            border-radius: 4px; font-size: 11px; white-space: nowrap;
            border: 1px solid rgba(139,105,20,0.5); pointer-events: none; z-index: 25;
        }

        /* 关节 */
        .joint { position: absolute; width: 12px; height: 12px; background: radial-gradient(circle, #d4af37 0%, #8b6914 100%); border-radius: 50%; border: 2px solid #5a4a0a; cursor: pointer; z-index: 20; box-shadow: 0 0 4px rgba(212,175,55,0.6); }
        .joint:hover { transform: scale(1.3); box-shadow: 0 0 8px rgba(212,175,55,0.9); }

        /* 角度指示器 */
        .angle-indicator {
            position: absolute; top: -42px; left: 50%; transform: translateX(-50%);
            background: rgba(20,10,5,0.95); color: #d4af37; padding: 3px 8px;
            border-radius: 4px; font-size: 11px; white-space: nowrap;
            border: 1px solid rgba(139,105,20,0.5); pointer-events: none; z-index: 25; display: none;
        }
        .angle-indicator.show { display: block; }
        .angle-indicator.match { color: #4ade80; border-color: #4ade80; }
        .angle-indicator.close { color: #fbbf24; border-color: #fbbf24; }
        .angle-indicator.far { color: #ef4444; border-color: #ef4444; }

        /* 吸附目标 */
        .snap-target { position: absolute; border: 2px dashed rgba(212,175,55,0.5); border-radius: 50%; pointer-events: none; z-index: 5; animation: targetPulse 1.5s infinite; display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(212,175,55,0.6); }
        @keyframes targetPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.15); opacity: 0.8; } }
        .snap-target.near { border-color: rgba(100,255,100,0.8); box-shadow: 0 0 15px rgba(100,255,100,0.4); }

        /* 连接提示线 */
        .hint-line { position: absolute; z-index: 4; pointer-events: none; opacity: 0.3; }
        .hint-line.fade { animation: hintFade 0.5s ease forwards; }
        @keyframes hintFade { to { opacity: 0; } }

        /* 参考动作图（关卡二） */
        #reference-pose {
            position: absolute; top: 50%; right: 330px; transform: translateY(-50%);
            width: 180px; height: 320px; z-index: 8; pointer-events: none;
            display: none;
        }
        #reference-pose.show { display: block; }
        #reference-pose .ref-label {
            position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
            background: rgba(20,10,5,0.95); color: #d4af37; padding: 4px 12px;
            border-radius: 6px; font-size: 13px; white-space: nowrap;
            border: 1px solid #8b6914;
        }
        #reference-pose .ref-frame {
            width: 100%; height: 100%; border: 2px dashed rgba(212,175,55,0.3);
            border-radius: 12px; position: relative; overflow: visible;
            background: rgba(20,10,5,0.3);
        }
        #reference-pose .ref-part {
            position: absolute; transform-origin: center center;
            filter: brightness(0.7) opacity(0.5);
        }
        #reference-pose .ref-arrow {
            position: absolute; top: 50%; left: -30px; transform: translateY(-50%);
            font-size: 28px; color: rgba(212,175,55,0.5);
            animation: refArrowBounce 1.5s ease-in-out infinite;
        }
        @keyframes refArrowBounce { 0%, 100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(-8px); } }

        /* 匹配指示 */
        .match-indicator { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); font-size: 56px; color: #d4af37; text-shadow: 0 0 30px rgba(212,175,55,0.8); z-index: 2000; pointer-events: none; opacity: 0; }
        .match-indicator.show { animation: matchPop 1s ease forwards; }
        @keyframes matchPop { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; } 70% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

        /* ========== 控制面板 ========== */
        #control-panel { position: fixed; top: 20px; right: 20px; width: 280px; background: rgba(20, 10, 5, 0.95); border: 2px solid #8b6914; border-radius: 12px; padding: 20px; z-index: 1000; color: #d4af37; box-shadow: 0 4px 20px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto; }
        #control-panel h2 { text-align: center; margin-bottom: 15px; font-size: 18px; text-shadow: 0 0 10px rgba(212,175,55,0.5); }
        .control-section { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(139,105,20,0.3); }
        .control-section:last-child { border-bottom: none; }
        .control-label { display: block; margin-bottom: 8px; font-size: 14px; }

        input[type="range"] { width: 100%; height: 6px; background: #3a2510; border-radius: 3px; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: radial-gradient(circle, #d4af37 0%, #8b6914 100%); border-radius: 50%; cursor: pointer; box-shadow: 0 0 6px rgba(212,175,55,0.6); }

        .btn { display: inline-block; padding: 8px 16px; margin: 4px; background: linear-gradient(135deg, #8b6914 0%, #6b5010 100%); border: 1px solid #d4af37; border-radius: 6px; color: #fff; cursor: pointer; font-size: 13px; transition: all 0.3s ease; text-align: center; }
        .btn:hover { background: linear-gradient(135deg, #d4af37 0%, #8b6914 100%); box-shadow: 0 0 12px rgba(212,175,55,0.5); transform: translateY(-1px); }
        .btn:active { transform: translateY(1px); }
        .btn-record { background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%); border-color: #ff6b6b; }
        .btn-record:hover { background: linear-gradient(135deg, #ff6b6b 0%, #c41e3a 100%); box-shadow: 0 0 12px rgba(255,107,107,0.5); }
        .btn-record.recording { animation: pulse 1s infinite; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 5px rgba(255,0,0,0.5); } 50% { box-shadow: 0 0 20px rgba(255,0,0,0.8); } }

        /* 部件面板 */
        #parts-panel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(20, 10, 5, 0.95); border: 2px solid #8b6914; border-radius: 12px; padding: 15px; z-index: 1000; max-width: 90vw; flex-wrap: wrap; justify-content: center; }
        .part-item { width: 56px; height: 56px; background: rgba(139,105,20,0.2); border: 2px solid #8b6914; border-radius: 8px; cursor: grab; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; flex-shrink: 0; }
        .part-item:hover { background: rgba(212,175,55,0.3); transform: scale(1.1); box-shadow: 0 0 10px rgba(212,175,55,0.4); }
        .part-item svg { width: 80%; height: 80%; pointer-events: none; }

        /* 录制指示 */
        #record-indicator { position: fixed; top: 20px; left: 20px; display: none; align-items: center; gap: 10px; background: rgba(196,30,58,0.9); color: white; padding: 10px 20px; border-radius: 8px; z-index: 1001; font-weight: bold; }
        #record-indicator.active { display: flex; }
        .record-dot { width: 12px; height: 12px; background: #ff0000; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* 标题 */
        #title { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #d4af37; text-shadow: 0 0 20px rgba(212,175,55,0.5); z-index: 1000; pointer-events: none; letter-spacing: 8px; }

        /* 关卡系统 */
        #level-system { position: fixed; top: 55px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 12px; align-items: center; }
        .level-indicator { padding: 6px 16px; background: rgba(20, 10, 5, 0.9); border: 2px solid #5a4a0a; border-radius: 20px; color: #5a4a0a; font-size: 13px; transition: all 0.5s ease; cursor: pointer; }
        .level-indicator:hover { border-color: #8b6914; }
        .level-indicator.active { border-color: #d4af37; color: #d4af37; box-shadow: 0 0 15px rgba(212,175,55,0.4); }
        .level-indicator.completed { border-color: #4ade80; color: #4ade80; }
        .level-arrow { color: #5a4a0a; font-size: 16px; }

        /* 进度条 */
        #progress-bar { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); width: 400px; height: 6px; background: rgba(139,105,20,0.3); border-radius: 3px; z-index: 1000; overflow: hidden; display: none; }
        #progress-bar.show { display: block; }
        #progress-fill { height: 100%; background: linear-gradient(90deg, #8b6914, #d4af37); border-radius: 3px; transition: width 0.5s ease; width: 0%; }

        /* 进度文字 */
        #progress-text { position: fixed; top: 110px; left: 50%; transform: translateX(-50%); color: #d4af37; font-size: 12px; z-index: 1000; display: none; }
        #progress-text.show { display: block; }

        /* 动作计数器 */
        #action-counter { position: fixed; top: 140px; right: 20px; background: rgba(20, 10, 5, 0.95); border: 2px solid #8b6914; border-radius: 12px; padding: 15px 20px; z-index: 1000; color: #d4af37; display: none; max-width: 280px; }
        #action-counter.show { display: block; }
        #action-counter h3 { font-size: 13px; margin-bottom: 8px; }
        .action-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; color: #5a4a0a; transition: color 0.3s ease; }
        .action-item.current { color: #d4af37; }
        .action-item.completed { color: #4ade80; }
        .action-item .check { width: 16px; height: 16px; border: 2px solid currentColor; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }

        /* 旋转精度面板 */
        #rotation-panel { position: fixed; bottom: 100px; right: 20px; background: rgba(20, 10, 5, 0.95); border: 2px solid #8b6914; border-radius: 12px; padding: 15px; z-index: 1000; color: #d4af37; display: none; min-width: 200px; }
        #rotation-panel.show { display: block; }
        #rotation-panel h3 { font-size: 13px; margin-bottom: 8px; }
        .rotation-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
        .rotation-bar { flex: 1; height: 6px; background: #3a2510; border-radius: 3px; overflow: hidden; }
        .rotation-fill { height: 100%; border-radius: 3px; transition: width 0.2s ease, background 0.2s ease; }
        .rotation-label { width: 50px; font-size: 11px; }
        .rotation-value { width: 45px; font-size: 11px; text-align: right; }

        /* 环境切换面板 */
        #env-panel { position: fixed; bottom: 100px; right: 20px; background: rgba(20, 10, 5, 0.95); border: 2px solid #8b6914; border-radius: 12px; padding: 15px; z-index: 1000; color: #d4af37; display: none; }
        #env-panel.show { display: block; }
        #env-panel h3 { font-size: 13px; margin-bottom: 8px; text-align: center; }
        .env-btn { display: block; width: 100%; padding: 6px 12px; margin: 4px 0; background: rgba(139,105,20,0.3); border: 1px solid #8b6914; border-radius: 6px; color: #d4af37; cursor: pointer; font-size: 12px; transition: all 0.3s ease; }
        .env-btn:hover, .env-btn.active { background: rgba(212,175,55,0.3); border-color: #d4af37; }

        /* 模板面板 */
        #template-panel { position: fixed; bottom: 100px; left: 20px; background: rgba(20, 10, 5, 0.95); border: 2px solid #8b6914; border-radius: 12px; padding: 15px; z-index: 1000; color: #d4af37; display: none; max-width: 220px; }
        #template-panel.show { display: block; }
        #template-panel h3 { font-size: 13px; margin-bottom: 8px; text-align: center; }
        .template-btn { display: block; width: 100%; padding: 6px 12px; margin: 4px 0; background: rgba(139,105,20,0.3); border: 1px solid #8b6914; border-radius: 6px; color: #d4af37; cursor: pointer; font-size: 12px; transition: all 0.3s ease; text-align: left; }
        .template-btn:hover { background: rgba(212,175,55,0.3); border-color: #d4af37; }

        /* 文字弹幕 */
        #text-input-panel { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(20, 10, 5, 0.95); border: 2px solid #8b6914; border-radius: 12px; padding: 10px; z-index: 1000; display: none; gap: 8px; align-items: center; }
        #text-input-panel.show { display: flex; }
        #text-input-panel input { background: #3a2510; border: 1px solid #8b6914; border-radius: 4px; color: #d4af37; padding: 6px 10px; font-size: 13px; width: 200px; outline: none; }
        #text-input-panel input:focus { border-color: #d4af37; }
        .stage-text { position: absolute; z-index: 50; pointer-events: none; font-size: 24px; color: #d4af37; text-shadow: 0 0 10px rgba(0,0,0,0.8); animation: textFloat 5s ease-out forwards; }
        @keyframes textFloat { 0% { opacity: 0; transform: translateY(20px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }

        /* 粒子效果 */
        #particle-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
        .particle { position: absolute; border-radius: 50%; pointer-events: none; }
        .particle.snow { background: rgba(255,255,255,0.6); width: 4px; height: 4px; animation: snowFall linear infinite; }
        @keyframes snowFall { 0% { transform: translateY(-20px) translateX(0); } 100% { transform: translateY(100vh) translateX(30px); } }
        .particle.petal { background: rgba(255,183,197,0.7); width: 8px; height: 8px; border-radius: 0 100% 0 100%; animation: petalFall linear infinite; }
        @keyframes petalFall { 0% { transform: translateY(-20px) rotate(0deg); } 100% { transform: translateY(100vh) rotate(360deg) translateX(50px); } }
        .particle.spark { background: rgba(212,175,55,0.8); width: 3px; height: 3px; animation: sparkFloat ease-in-out infinite; }
        @keyframes sparkFloat { 0%, 100% { transform: translate(0, 0); opacity: 0.3; } 50% { transform: translate(20px, -30px); opacity: 1; } }

        /* 视频预览 */
        #video-preview { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20, 10, 5, 0.98); border: 3px solid #d4af37; border-radius: 16px; padding: 30px; z-index: 3000; text-align: center; color: #d4af37; display: none; max-width: 80vw; }
        #video-preview.show { display: block; animation: hintIn 0.5s ease; }
        #video-preview video { max-width: 100%; max-height: 60vh; border-radius: 8px; margin: 15px 0; }

        /* 遮罩 */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2500; display: none; }
        #overlay.show { display: block; }

        /* 关卡提示弹窗 */
        #level-hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20, 10, 5, 0.98); border: 3px solid #d4af37; border-radius: 16px; padding: 40px 60px; z-index: 3000; text-align: center; color: #d4af37; max-width: 600px; display: none; }
        #level-hint.show { display: block; animation: hintIn 0.5s ease; }
        @keyframes hintIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        #level-hint h2 { font-size: 28px; margin-bottom: 20px; text-shadow: 0 0 15px rgba(212,175,55,0.5); }
        #level-hint p { font-size: 15px; line-height: 1.8; margin-bottom: 12px; color: #c4a030; }
        #level-hint .btn { margin-top: 20px; padding: 12px 30px; font-size: 16px; }

        /* 庆祝动画 */
        .celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; }
        .confetti { position: absolute; width: 10px; height: 10px; animation: confettiFall 3s ease-out forwards; }
        @keyframes confettiFall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        /* 场景装饰 */
        .scene-prop { position: absolute; pointer-events: none; z-index: 5; }
        .flame { position: absolute; bottom: 0; width: 30px; height: 60px; background: radial-gradient(ellipse at 50% 80%, rgba(255,200,50,0.8) 0%, rgba(255,100,0,0.6) 40%, transparent 70%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation: flicker 0.5s infinite alternate; filter: blur(2px); }
        @keyframes flicker { 0% { transform: scaleY(1) scaleX(1); opacity: 0.8; } 100% { transform: scaleY(1.1) scaleX(0.9); opacity: 1; } }

        /* 操作提示 */
        #hints { position: fixed; bottom: 100px; left: 20px; color: rgba(212,175,55,0.7); font-size: 12px; line-height: 1.8; z-index: 1000; background: rgba(20, 10, 5, 0.8); padding: 10px; border-radius: 8px; border: 1px solid rgba(139,105,20,0.3); }

        /* 顶部工具栏 */
        #top-toolbar { position: fixed; top: 20px; left: 20px; z-index: 1000; display: flex; gap: 8px; }
        .tool-btn { width: 36px; height: 36px; background: rgba(20, 10, 5, 0.95); border: 2px solid #8b6914; border-radius: 8px; color: #d4af37; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .tool-btn:hover { border-color: #d4af37; box-shadow: 0 0 10px rgba(212,175,55,0.4); }

        /* Toast提示 */
        #toast { position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%); background: rgba(20, 10, 5, 0.95); border: 2px solid #d4af37; border-radius: 8px; padding: 10px 24px; color: #d4af37; font-size: 14px; z-index: 3000; display: none; animation: toastIn 0.3s ease; }
        #toast.show { display: block; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    </style>
</head>
<body>
    <!-- ========== 标题页 ========== -->
    <div id="title-screen">
        <svg class="title-puppet" viewBox="0 0 100 100">
            <ellipse cx="50" cy="40" rx="30" ry="35" fill="#8b4513" stroke="#d4af37" stroke-width="2"/>
            <circle cx="38" cy="35" r="6" fill="#fff"/><circle cx="62" cy="35" r="6" fill="#fff"/>
            <circle cx="38" cy="35" r="3" fill="#000"/><circle cx="62" cy="35" r="3" fill="#000"/>
            <path d="M 35 55 Q 50 68 65 55" stroke="#d4af37" stroke-width="2" fill="none"/>
            <path d="M 20 15 Q 50 0 80 15" stroke="#d4af37" stroke-width="3" fill="none"/>
            <circle cx="50" cy="10" r="7" fill="#c41e3a"/>
        </svg>
        <h1>影戏乾坤</h1>
        <div class="subtitle">数字皮影工坊</div>
        <button class="title-btn" onclick="startGame()">开始体验</button>
        <button class="title-btn" style="font-size:16px; padding:10px 30px;" onclick="startGame(3)">自由工坊</button>
    </div>

    <!-- ========== 主舞台 ========== -->
    <div id="stage">
        <div id="scene-bg"></div>
        <div id="curtain"></div>
        <div id="lighting"></div>
        <div id="particle-layer"></div>

        <!-- 场景装饰 -->
        <div class="scene-prop" style="bottom: 0; left: 8%; width: 80px; height: 120px;"><div class="flame" style="left: 25px;"></div></div>
        <div class="scene-prop" style="bottom: 0; right: 8%; width: 80px; height: 120px;"><div class="flame" style="left: 25px;"></div></div>

        <div id="title">影戏乾坤</div>

        <!-- 顶部工具栏 -->
        <div id="top-toolbar">
            <div class="tool-btn" onclick="toggleSound()" id="sound-btn" title="音效开关">🔊</div>
            <div class="tool-btn" onclick="restartLevel()" title="重新开始">🔄</div>
            <div class="tool-btn" onclick="showTitleScreen()" title="返回首页">🏠</div>
        </div>

        <!-- 关卡指示器 -->
        <div id="level-system">
            <div class="level-indicator active" id="level-1-ind" onclick="jumpToLevel(1)">第一关 · 匠心重塑</div>
            <div class="level-arrow">→</div>
            <div class="level-indicator" id="level-2-ind" onclick="jumpToLevel(2)">第二关 · 灯火戏梦</div>
            <div class="level-arrow">→</div>
            <div class="level-indicator" id="level-3-ind" onclick="jumpToLevel(3)">第三关 · 乾坤自载</div>
        </div>

        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-text"></div>

        <!-- 动作计数器 -->
        <div id="action-counter">
            <h3>动作完成度</h3>
            <div class="action-item current" id="action-1"><div class="check"></div><span>登场亮相</span></div>
            <div class="action-item" id="action-2"><div class="check"></div><span>武生作揖</span></div>
            <div class="action-item" id="action-3"><div class="check"></div><span>大圣远眺</span></div>
            <div class="action-item" id="action-4"><div class="check"></div><span>武将擎天</span></div>
            <div class="action-item" id="action-5"><div class="check"></div><span>谢幕答谢</span></div>
        </div>

        <!-- 旋转精度面板 -->
        <div id="rotation-panel">
            <h3>旋转精度</h3>
            <div id="rotation-rows"></div>
        </div>

        <div id="record-indicator"><div class="record-dot"></div><span>正在录制...</span><span id="record-time">00:00</span></div>
        <div class="match-indicator" id="match-indicator">对上了!</div>

        <!-- 参考动作图（关卡二） -->
        <div id="reference-pose">
            <div class="ref-label" id="ref-label">参考动作</div>
            <div class="ref-frame" id="ref-frame">
                <div class="ref-arrow">←</div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div id="control-panel">
            <h2>工坊控制台</h2>
            <div class="control-section">
                <label class="control-label">灯光色调</label>
                <input type="range" id="light-hue" min="0" max="360" value="30">
                <label class="control-label" style="margin-top: 8px;">灯光亮度</label>
                <input type="range" id="light-brightness" min="20" max="100" value="50">
            </div>
            <div class="control-section">
                <label class="control-label">幕布纹理</label>
                <button class="btn" onclick="changeTexture('smooth')">平滑</button>
                <button class="btn" onclick="changeTexture('rough')">粗糙</button>
                <button class="btn" onclick="changeTexture('pattern')">花纹</button>
            </div>
            <div class="control-section">
                <label class="control-label">场景操作</label>
                <button class="btn" onclick="clearStage()">清空舞台</button>
                <button class="btn" onclick="resetPuppets()">重置位置</button>
            </div>
            <div class="control-section" id="record-section" style="display:none;">
                <label class="control-label">录制剧场</label>
                <button class="btn btn-record" id="record-btn" onclick="toggleRecording()">开始录制</button>
                <button class="btn" onclick="downloadRecording()" id="download-btn" style="display:none;">下载视频</button>
            </div>
        </div>

        <!-- 环境切换面板 -->
        <div id="env-panel">
            <h3>环境切换</h3>
            <button class="env-btn active" onclick="changeEnvironment('day')">白昼</button>
            <button class="env-btn" onclick="changeEnvironment('dusk')">黄昏</button>
            <button class="env-btn" onclick="changeEnvironment('night')">深夜</button>
            <button class="env-btn" onclick="changeEnvironment('ink')">水墨风</button>
        </div>

        <!-- 模板面板 -->
        <div id="template-panel">
            <h3>场景模板</h3>
            <button class="template-btn" onclick="loadTemplate('warrior')">⚔️ 武将出征</button>
            <button class="template-btn" onclick="loadTemplate('scholar')">📚 才子佳话</button>
            <button class="template-btn" onclick="loadTemplate('moon')">🌙 月下独酌</button>
        </div>

        <!-- 文字弹幕输入 -->
        <div id="text-input-panel">
            <input type="text" id="stage-text-input" placeholder="输入台词..." maxlength="20">
            <button class="btn" onclick="addStageText()">发送</button>
        </div>

        <!-- 部件面板 -->
        <div id="parts-panel" style="display:none;">
            <div class="part-item" draggable="true" data-part="head" title="头部"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="45" rx="35" ry="40" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><circle cx="35" cy="40" r="8" fill="#fff"/><circle cx="65" cy="40" r="8" fill="#fff"/><circle cx="35" cy="40" r="4" fill="#000"/><circle cx="65" cy="40" r="4" fill="#000"/><path d="M 30 65 Q 50 80 70 65" stroke="#d4af37" stroke-width="2" fill="none"/><path d="M 20 20 Q 50 5 80 20" stroke="#d4af37" stroke-width="3" fill="none"/><circle cx="50" cy="15" r="8" fill="#c41e3a"/></svg></div>
            <div class="part-item" draggable="true" data-part="body" title="身体"><svg viewBox="0 0 100 120"><path d="M 30 10 L 70 10 L 80 100 L 20 100 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><path d="M 35 20 L 65 20 L 70 80 L 30 80 Z" fill="#a0522d"/><path d="M 40 30 L 60 30 L 60 50 L 40 50 Z" fill="#c41e3a"/><path d="M 45 60 L 55 60 L 55 90 L 45 90 Z" fill="#d4af37"/></svg></div>
            <div class="part-item" draggable="true" data-part="arm-left" title="左臂"><svg viewBox="0 0 80 100"><path d="M 40 10 L 60 10 L 50 90 L 30 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><circle cx="45" cy="15" r="12" fill="#a0522d"/><path d="M 35 50 L 55 50" stroke="#d4af37" stroke-width="1"/><path d="M 33 70 L 57 70" stroke="#d4af37" stroke-width="1"/></svg></div>
            <div class="part-item" draggable="true" data-part="arm-right" title="右臂"><svg viewBox="0 0 80 100"><path d="M 20 10 L 40 10 L 50 90 L 30 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><circle cx="35" cy="15" r="12" fill="#a0522d"/><path d="M 25 50 L 45 50" stroke="#d4af37" stroke-width="1"/><path d="M 23 70 L 47 70" stroke="#d4af37" stroke-width="1"/></svg></div>
            <div class="part-item" draggable="true" data-part="leg-left" title="左腿"><svg viewBox="0 0 60 100"><path d="M 20 10 L 40 10 L 35 90 L 25 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><ellipse cx="30" cy="15" rx="15" ry="10" fill="#a0522d"/><path d="M 22 40 L 38 40" stroke="#d4af37" stroke-width="1"/><path d="M 23 60 L 37 60" stroke="#d4af37" stroke-width="1"/></svg></div>
            <div class="part-item" draggable="true" data-part="leg-right" title="右腿"><svg viewBox="0 0 60 100"><path d="M 20 10 L 40 10 L 35 90 L 25 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><ellipse cx="30" cy="15" rx="15" ry="10" fill="#a0522d"/><path d="M 22 40 L 38 40" stroke="#d4af37" stroke-width="1"/><path d="M 23 60 L 37 60" stroke="#d4af37" stroke-width="1"/></svg></div>
            <div class="part-item" draggable="true" data-part="prop-sword" title="剑"><svg viewBox="0 0 100 120"><rect x="48" y="10" width="4" height="80" fill="#c0c0c0" stroke="#808080" stroke-width="1"/><rect x="40" y="85" width="20" height="4" fill="#d4af37"/><circle cx="50" cy="95" r="8" fill="#8b4513"/><path d="M 50 10 L 45 20 L 55 20 Z" fill="#c0c0c0"/></svg></div>
            <div class="part-item" draggable="true" data-part="prop-fan" title="扇"><svg viewBox="0 0 100 80"><path d="M 10 70 Q 50 10 90 70" fill="#c41e3a" stroke="#d4af37" stroke-width="2"/><path d="M 20 65 Q 50 20 80 65" fill="#8b0000" stroke="none"/><line x1="50" y1="70" x2="50" y2="40" stroke="#d4af37" stroke-width="2"/></svg></div>
            <div class="part-item" draggable="true" data-part="prop-cloud" title="云"><svg viewBox="0 0 100 60"><ellipse cx="30" cy="35" rx="25" ry="18" fill="rgba(200,200,210,0.6)" stroke="#aaa" stroke-width="1"/><ellipse cx="60" cy="30" rx="30" ry="20" fill="rgba(200,200,210,0.6)" stroke="#aaa" stroke-width="1"/><ellipse cx="80" cy="38" rx="18" ry="12" fill="rgba(200,200,210,0.6)" stroke="#aaa" stroke-width="1"/></svg></div>
            <div class="part-item" draggable="true" data-part="prop-mountain" title="山"><svg viewBox="0 0 120 80"><path d="M 10 70 L 40 20 L 60 50 L 80 15 L 110 70 Z" fill="#4a3a2a" stroke="#8b6914" stroke-width="2"/><path d="M 35 28 L 40 20 L 48 32 Z" fill="#fff" opacity="0.4"/><path d="M 75 23 L 80 15 L 88 28 Z" fill="#fff" opacity="0.4"/></svg></div>
            <div class="part-item" draggable="true" data-part="prop-moon" title="月"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="30" fill="rgba(255,250,200,0.8)" stroke="#d4af37" stroke-width="2"/><circle cx="50" cy="35" r="25" fill="rgba(20,10,5,0.9)"/></svg></div>
            <div class="part-item" draggable="true" data-part="prop-tree" title="树"><svg viewBox="0 0 80 100"><rect x="35" y="50" width="10" height="40" fill="#5a3a1a"/><circle cx="40" cy="35" r="25" fill="#3a5a2a" stroke="#5a4a1a" stroke-width="1"/><circle cx="25" cy="30" r="15" fill="#3a5a2a"/><circle cx="55" cy="30" r="15" fill="#3a5a2a"/></svg></div>
        </div>

        <div id="hints"><div id="hint-text">🎭 将散落的皮影碎片拖拽拼装成完整角色</div></div>

        <div id="level-hint"><h2 id="hint-title">第一关 · 匠心重塑</h2><p id="hint-desc"></p><p id="hint-detail"></p><button class="btn" onclick="closeLevelHint()">开始挑战</button></div>
        <div id="video-preview"><h2>你的皮影剧场</h2><video id="preview-video" controls></video><div><button class="btn" onclick="closeVideoPreview()">关闭</button><button class="btn btn-record" onclick="downloadRecording()">下载视频</button></div></div>
        <div id="overlay"></div>
        <div class="celebration" id="celebration"></div>
        <div id="toast"></div>
    </div>

    <script>
        // ==================== 全局状态 ====================
        let currentLevel = 1;
        let selectedPart = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let draggedElement = null;
        let puppetIdCounter = 0;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordStartTime = null;
        let recordTimer = null;
        let soundEnabled = true;
        let audioCtx = null;
        let maxUnlockedLevel = 1;

        // 关卡一状态
        let level1Parts = {};
        let level1Targets = {};
        let level1Completed = false;

        // 关卡二状态 - 扩展到5个动作
        let currentActionIndex = 0;
        let actionTargets = [
            { name: '登场亮相', desc: '双臂展开，威风登场', rotations: { head: 0, body: 0, 'arm-left': -25, 'arm-right': 25, 'leg-left': 0, 'leg-right': 0 }, difficulty: 1 },
            { name: '武生作揖', desc: '双手抱拳，行礼作揖', rotations: { head: 10, body: 15, 'arm-left': -40, 'arm-right': -40, 'leg-left': 0, 'leg-right': 0 }, difficulty: 2 },
            { name: '大圣远眺', desc: '侧身抬手，极目远望', rotations: { head: -20, body: -25, 'arm-left': -55, 'arm-right': 35, 'leg-left': 10, 'leg-right': -5 }, difficulty: 3 },
            { name: '武将擎天', desc: '一臂高举，气吞山河', rotations: { head: 15, body: 10, 'arm-left': -70, 'arm-right': 20, 'leg-left': -15, 'leg-right': 15 }, difficulty: 3 },
            { name: '谢幕答谢', desc: '弯腰拱手，答谢看客', rotations: { head: -15, body: -20, 'arm-left': -50, 'arm-right': 50, 'leg-left': 5, 'leg-right': -5 }, difficulty: 2 }
        ];
        let level2Completed = false;
        let level2CheckInterval = null;

        const stage = document.getElementById('stage');

        // ==================== 音频合成 ====================
        function getAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }

        function playSnapSound() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.05);
            osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
        }

        function playSuccessSound() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            [523, 659, 784, 1047].forEach((freq, i) => {
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
                gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.12 + 0.3);
                osc.start(ctx.currentTime + i * 0.12); osc.stop(ctx.currentTime + i * 0.12 + 0.3);
            });
        }

        function playDrumSound() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(120, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
        }

        function playMatchSound() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
        }

        // ==================== 皮影部件创建 ====================
        function createPuppetPart(type, x, y, options = {}) {
            const puppet = document.createElement('div');
            puppet.className = 'puppet' + (options.dim ? ' dim' : '');
            puppet.id = `puppet-${puppetIdCounter++}`;
            puppet.style.left = x + 'px';
            puppet.style.top = y + 'px';
            puppet.dataset.type = type;
            puppet.dataset.rotation = '0';
            puppet.dataset.color = options.color || 'default';

            let svgContent = '';
            let width = 100, height = 100;
            const colorScheme = getColorScheme(options.color);

            switch(type) {
                case 'head':
                    width = 100; height = 100;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 100 100"><defs><filter id="s${puppet.id}"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter></defs><g filter="url(#s${puppet.id})"><ellipse cx="50" cy="45" rx="35" ry="40" fill="${colorScheme.body}" stroke="${colorScheme.stroke}" stroke-width="2"/><circle cx="35" cy="40" r="8" fill="#fff"/><circle cx="65" cy="40" r="8" fill="#fff"/><circle cx="35" cy="40" r="4" fill="#000"/><circle cx="65" cy="40" r="4" fill="#000"/><path d="M 30 65 Q 50 80 70 65" stroke="${colorScheme.stroke}" stroke-width="2" fill="none"/><path d="M 20 20 Q 50 5 80 20" stroke="${colorScheme.stroke}" stroke-width="3" fill="none"/><circle cx="50" cy="15" r="8" fill="${colorScheme.accent}"/><path d="M 35 25 L 40 15 L 45 25" fill="${colorScheme.stroke}"/><path d="M 55 25 L 60 15 L 65 25" fill="${colorScheme.stroke}"/></g></svg>`;
                    break;
                case 'body':
                    width = 100; height = 120;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 100 120"><defs><filter id="s${puppet.id}"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter></defs><g filter="url(#s${puppet.id})"><path d="M 30 10 L 70 10 L 80 100 L 20 100 Z" fill="${colorScheme.body}" stroke="${colorScheme.stroke}" stroke-width="2"/><path d="M 35 20 L 65 20 L 70 80 L 30 80 Z" fill="${colorScheme.bodyLight}"/><path d="M 40 30 L 60 30 L 60 50 L 40 50 Z" fill="${colorScheme.accent}"/><path d="M 45 60 L 55 60 L 55 90 L 45 90 Z" fill="${colorScheme.stroke}"/><circle cx="50" cy="15" r="8" fill="${colorScheme.bodyLight}" stroke="${colorScheme.stroke}" stroke-width="1"/><circle cx="30" cy="25" r="6" fill="${colorScheme.bodyLight}" stroke="${colorScheme.stroke}" stroke-width="1"/><circle cx="70" cy="25" r="6" fill="${colorScheme.bodyLight}" stroke="${colorScheme.stroke}" stroke-width="1"/></g></svg>`;
                    break;
                case 'arm-left':
                    width = 80; height = 100;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 80 100"><defs><filter id="s${puppet.id}"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter></defs><g filter="url(#s${puppet.id})"><path d="M 40 10 L 60 10 L 50 90 L 30 90 Z" fill="${colorScheme.body}" stroke="${colorScheme.stroke}" stroke-width="2"/><circle cx="45" cy="15" r="12" fill="${colorScheme.bodyLight}" stroke="${colorScheme.stroke}" stroke-width="1"/><path d="M 35 50 L 55 50" stroke="${colorScheme.stroke}" stroke-width="1"/><path d="M 33 70 L 57 70" stroke="${colorScheme.stroke}" stroke-width="1"/><circle cx="40" cy="90" r="8" fill="${colorScheme.bodyLight}"/></g></svg>`;
                    break;
                case 'arm-right':
                    width = 80; height = 100;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 80 100"><defs><filter id="s${puppet.id}"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter></defs><g filter="url(#s${puppet.id})"><path d="M 20 10 L 40 10 L 50 90 L 30 90 Z" fill="${colorScheme.body}" stroke="${colorScheme.stroke}" stroke-width="2"/><circle cx="35" cy="15" r="12" fill="${colorScheme.bodyLight}" stroke="${colorScheme.stroke}" stroke-width="1"/><path d="M 25 50 L 45 50" stroke="${colorScheme.stroke}" stroke-width="1"/><path d="M 23 70 L 47 70" stroke="${colorScheme.stroke}" stroke-width="1"/><circle cx="40" cy="90" r="8" fill="${colorScheme.bodyLight}"/></g></svg>`;
                    break;
                case 'leg-left':
                case 'leg-right':
                    width = 60; height = 100;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 60 100"><defs><filter id="s${puppet.id}"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter></defs><g filter="url(#s${puppet.id})"><path d="M 20 10 L 40 10 L 35 90 L 25 90 Z" fill="${colorScheme.body}" stroke="${colorScheme.stroke}" stroke-width="2"/><ellipse cx="30" cy="15" rx="15" ry="10" fill="${colorScheme.bodyLight}" stroke="${colorScheme.stroke}" stroke-width="1"/><path d="M 22 40 L 38 40" stroke="${colorScheme.stroke}" stroke-width="1"/><path d="M 23 60 L 37 60" stroke="${colorScheme.stroke}" stroke-width="1"/><ellipse cx="30" cy="92" rx="12" ry="6" fill="${colorScheme.body}"/></g></svg>`;
                    break;
                case 'prop-sword':
                    width = 100; height = 120;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 100 120"><defs><filter id="s${puppet.id}"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter></defs><g filter="url(#s${puppet.id})"><rect x="48" y="10" width="4" height="80" fill="#c0c0c0" stroke="#808080" stroke-width="1"/><rect x="40" y="85" width="20" height="4" fill="#d4af37" stroke="#8b6914" stroke-width="1"/><circle cx="50" cy="95" r="8" fill="#8b4513" stroke="#d4af37" stroke-width="1"/><path d="M 50 10 L 45 20 L 55 20 Z" fill="#c0c0c0"/><line x1="50" y1="15" x2="50" y2="85" stroke="#fff" stroke-width="0.5" opacity="0.5"/></g></svg>`;
                    break;
                case 'prop-fan':
                    width = 100; height = 80;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 100 80"><defs><filter id="s${puppet.id}"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter></defs><g filter="url(#s${puppet.id})"><path d="M 10 70 Q 50 10 90 70" fill="${colorScheme.accent}" stroke="${colorScheme.stroke}" stroke-width="2"/><path d="M 20 65 Q 50 20 80 65" fill="${colorScheme.body}" stroke="none"/><line x1="50" y1="70" x2="50" y2="40" stroke="${colorScheme.stroke}" stroke-width="2"/><line x1="30" y1="68" x2="35" y2="45" stroke="${colorScheme.stroke}" stroke-width="1"/><line x1="70" y1="68" x2="65" y2="45" stroke="${colorScheme.stroke}" stroke-width="1"/><circle cx="50" cy="72" r="3" fill="${colorScheme.stroke}"/></g></svg>`;
                    break;
                case 'prop-cloud':
                    width = 100; height = 60;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 100 60"><ellipse cx="30" cy="35" rx="25" ry="18" fill="rgba(200,200,210,0.5)" stroke="rgba(160,160,180,0.6)" stroke-width="1"/><ellipse cx="60" cy="30" rx="30" ry="20" fill="rgba(200,200,210,0.5)" stroke="rgba(160,160,180,0.6)" stroke-width="1"/><ellipse cx="80" cy="38" rx="18" ry="12" fill="rgba(200,200,210,0.5)" stroke="rgba(160,160,180,0.6)" stroke-width="1"/></svg>`;
                    break;
                case 'prop-mountain':
                    width = 120; height = 80;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 120 80"><path d="M 10 70 L 40 20 L 60 50 L 80 15 L 110 70 Z" fill="#4a3a2a" stroke="#8b6914" stroke-width="2"/><path d="M 35 28 L 40 20 L 48 32 Z" fill="#fff" opacity="0.4"/><path d="M 75 23 L 80 15 L 88 28 Z" fill="#fff" opacity="0.4"/></svg>`;
                    break;
                case 'prop-moon':
                    width = 80; height = 80;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 80 80"><circle cx="40" cy="40" r="30" fill="rgba(255,250,200,0.7)" stroke="#d4af37" stroke-width="2"/><circle cx="50" cy="35" r="25" fill="rgba(20,10,5,0.9)"/></svg>`;
                    break;
                case 'prop-tree':
                    width = 80; height = 100;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 80 100"><rect x="35" y="50" width="10" height="40" fill="#5a3a1a"/><circle cx="40" cy="35" r="25" fill="#3a5a2a" stroke="#5a4a1a" stroke-width="1"/><circle cx="25" cy="30" r="15" fill="#3a5a2a"/><circle cx="55" cy="30" r="15" fill="#3a5a2a"/></svg>`;
                    break;
            }

            puppet.innerHTML = svgContent;
            puppet.style.width = width + 'px';
            puppet.style.height = height + 'px';

            // 关节点
            const joint = document.createElement('div');
            joint.className = 'joint';
            joint.style.left = (width / 2 - 6) + 'px';
            joint.style.top = (height / 2 - 6) + 'px';
            joint.title = '点击选中，滚轮旋转';
            puppet.appendChild(joint);

            // 部件标签
            if (options.label) {
                const label = document.createElement('div');
                label.className = 'part-label';
                label.textContent = options.label;
                puppet.appendChild(label);
            }

            // 角度指示器
            const angleInd = document.createElement('div');
            angleInd.className = 'angle-indicator';
            angleInd.textContent = '0°';
            puppet.appendChild(angleInd);

            puppet.addEventListener('mousedown', startDrag);
            puppet.addEventListener('click', selectPart);
            // 触摸支持
            puppet.addEventListener('touchstart', startDragTouch, { passive: false });

            stage.appendChild(puppet);
            return puppet;
        }

        function getColorScheme(color) {
            const schemes = {
                default: { body: '#8b4513', bodyLight: '#a0522d', stroke: '#d4af37', accent: '#c41e3a' },
                warrior: { body: '#8b0000', bodyLight: '#a52a2a', stroke: '#d4af37', accent: '#ffd700' },
                scholar: { body: '#2a3a5a', bodyLight: '#3a5a7a', stroke: '#c0c0c0', accent: '#4a8a9a' },
                princess: { body: '#8b4a6a', bodyLight: '#ab6a8a', stroke: '#d4af37', accent: '#ff69b4' },
            };
            return schemes[color] || schemes.default;
        }

        // ==================== 拖拽系统 ====================
        function startDrag(e) {
            if (e.target.classList.contains('joint')) return;
            if (currentLevel === 2 && !level2Completed) return;
            isDragging = true;
            draggedElement = e.currentTarget;
            const rect = draggedElement.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            draggedElement.classList.add('dragging');
            e.preventDefault();
        }

        function startDragTouch(e) {
            if (e.target.classList.contains('joint')) return;
            if (currentLevel === 2 && !level2Completed) return;
            isDragging = true;
            draggedElement = e.currentTarget;
            const rect = draggedElement.getBoundingClientRect();
            const touch = e.touches[0];
            dragOffset.x = touch.clientX - rect.left;
            dragOffset.y = touch.clientY - rect.top;
            draggedElement.classList.add('dragging');
            e.preventDefault();
        }

        function selectPart(e) {
            if (isDragging) return;
            document.querySelectorAll('.puppet').forEach(p => { p.classList.remove('selected'); const ai = p.querySelector('.angle-indicator'); if (ai) ai.classList.remove('show'); });
            e.currentTarget.classList.add('selected');
            selectedPart = e.currentTarget;
            const ai = selectedPart.querySelector('.angle-indicator');
            if (ai) ai.classList.add('show');
            e.stopPropagation();
        }

        document.addEventListener('mousemove', (e) => {
            if (isDragging && draggedElement) {
                moveDragged(e.clientX, e.clientY);
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (isDragging && draggedElement) {
                const touch = e.touches[0];
                moveDragged(touch.clientX, touch.clientY);
                e.preventDefault();
            }
        }, { passive: false });

        function moveDragged(clientX, clientY) {
            const stageRect = stage.getBoundingClientRect();
            let x = clientX - stageRect.left - dragOffset.x;
            let y = clientY - stageRect.top - dragOffset.y;
            x = Math.max(0, Math.min(x, stageRect.width - draggedElement.offsetWidth));
            y = Math.max(0, Math.min(y, stageRect.height - draggedElement.offsetHeight));
            draggedElement.style.left = x + 'px';
            draggedElement.style.top = y + 'px';
            if (currentLevel === 1) checkSnap(draggedElement);
        }

        document.addEventListener('mouseup', () => { if (draggedElement) draggedElement.classList.remove('dragging'); isDragging = false; draggedElement = null; });
        document.addEventListener('touchend', () => { if (draggedElement) draggedElement.classList.remove('dragging'); isDragging = false; draggedElement = null; });

        // ==================== 滚轮旋转 ====================
        document.addEventListener('wheel', (e) => {
            if (selectedPart) {
                e.preventDefault();
                let rotation = parseFloat(selectedPart.dataset.rotation) || 0;
                rotation += e.deltaY > 0 ? 5 : -5;
                selectedPart.dataset.rotation = rotation;
                selectedPart.style.transform = `rotate(${rotation}deg)`;
                updateAngleIndicator(selectedPart);
                if (currentLevel === 2) checkActionMatch();
            }
        }, { passive: false });

        function updateAngleIndicator(puppet) {
            const ai = puppet.querySelector('.angle-indicator');
            if (!ai) return;
            const rotation = parseFloat(puppet.dataset.rotation) || 0;
            ai.textContent = `${Math.round(rotation)}°`;
            ai.classList.remove('match', 'close', 'far');
            if (currentLevel === 2 && currentActionIndex < actionTargets.length) {
                const target = actionTargets[currentActionIndex];
                const type = puppet.dataset.type;
                const targetRot = target.rotations[type] || 0;
                const diff = Math.abs(rotation - targetRot);
                if (diff <= 30) ai.classList.add('match');
                else if (diff <= 60) ai.classList.add('close');
                else ai.classList.add('far');
            }
        }

        // ==================== 关卡一：匠心重塑 ====================
        function initLevel1() {
            clearStage();
            currentLevel = 1;
            level1Completed = false;
            level1Parts = {};
            level1Targets = {};

            const stageRect = stage.getBoundingClientRect();
            const centerX = stageRect.width / 2;
            const centerY = stageRect.height / 2;

            // 正确的拼装位置
            const targets = {
                'head':      { x: centerX - 50,  y: centerY - 170 },
                'body':      { x: centerX - 50,  y: centerY - 50  },
                'arm-left':  { x: centerX - 120, y: centerY - 40  },
                'arm-right': { x: centerX + 50,  y: centerY - 40  },
                'leg-left':  { x: centerX - 30,  y: centerY + 70  },
                'leg-right': { x: centerX + 20,  y: centerY + 70  }
            };
            level1Targets = targets;

            const labels = { 'head': '头', 'body': '身', 'arm-left': '左臂', 'arm-right': '右臂', 'leg-left': '左腿', 'leg-right': '右腿' };

            // 散落位置：靠近目标但不重叠（偏移150-200px）
            const scatterOffsets = {
                'head':      { dx: -160, dy: 80 },
                'body':      { dx: 180,  dy: -100 },
                'arm-left':  { dx: -120, dy: -120 },
                'arm-right': { dx: 100,  dy: 140 },
                'leg-left':  { dx: -180, dy: -60 },
                'leg-right': { dx: 160,  dy: 80 }
            };

            Object.keys(targets).forEach(type => {
                const tx = targets[type].x;
                const ty = targets[type].y;
                const offset = scatterOffsets[type];
                let sx = tx + offset.dx;
                let sy = ty + offset.dy;
                // 确保不超出边界
                sx = Math.max(20, Math.min(sx, stageRect.width - 120));
                sy = Math.max(180, Math.min(sy, stageRect.height - 200));

                const puppet = createPuppetPart(type, sx, sy, { dim: true, label: labels[type] });
                level1Parts[type] = { element: puppet, snapped: false };

                // 吸附目标指示器
                const sizes = { 'head': 100, 'body': 120, 'arm-left': 80, 'arm-right': 80, 'leg-left': 60, 'leg-right': 60 };
                const sz = sizes[type];
                const target = document.createElement('div');
                target.className = 'snap-target';
                target.style.left = (tx + sz/2 - 25) + 'px';
                target.style.top = (ty + sz/2 - 25) + 'px';
                target.style.width = '50px';
                target.style.height = '50px';
                target.textContent = labels[type];
                target.id = `target-${type}`;
                stage.appendChild(target);
            });

            updateLevelIndicator(1);
            document.getElementById('progress-bar').classList.add('show');
            document.getElementById('progress-text').classList.add('show');
            updateProgress(0, '0/6 部件已归位');
            document.getElementById('hint-text').textContent = '🧩 拖拽碎片到虚线圆圈处，靠近时自动吸附';
            document.getElementById('parts-panel').style.display = 'none';
            document.getElementById('record-section').style.display = 'none';
            document.getElementById('action-counter').classList.remove('show');
            document.getElementById('env-panel').classList.remove('show');
            document.getElementById('rotation-panel').classList.remove('show');
            document.getElementById('template-panel').classList.remove('show');
            document.getElementById('text-input-panel').classList.remove('show');

            showLevelHint('第一关 · 匠心重塑',
                '将散落的皮影碎片，按照正确的骨骼逻辑拼装成一个完整的角色。',
                '拖拽碎片到虚线圆圈处，靠近时会自动吸附并发出"咔哒"声。全部6个部件归位后，皮影将从灰暗变为点亮状态！');
        }

        function checkSnap(puppet) {
            const type = puppet.dataset.type;
            const target = level1Targets[type];
            if (!target) return;
            if (level1Parts[type] && level1Parts[type].snapped) return;

            const rect = puppet.getBoundingClientRect();
            const stageRect = stage.getBoundingClientRect();
            const currentX = rect.left - stageRect.left;
            const currentY = rect.top - stageRect.top;
            const distance = Math.sqrt(Math.pow(currentX - target.x, 2) + Math.pow(currentY - target.y, 2));

            // 高亮附近的目标
            const targetEl = document.getElementById(`target-${type}`);
            if (targetEl) {
                if (distance < 60) targetEl.classList.add('near');
                else targetEl.classList.remove('near');
            }

            if (distance < 45) {
                puppet.style.left = target.x + 'px';
                puppet.style.top = target.y + 'px';
                puppet.classList.add('snapped');
                puppet.classList.remove('dim');
                // 移除标签
                const label = puppet.querySelector('.part-label');
                if (label) label.remove();
                if (targetEl) targetEl.remove();
                playSnapSound();

                level1Parts[type].snapped = true;
                checkLevel1Complete();
            }
        }

        function checkLevel1Complete() {
            const snappedCount = Object.values(level1Parts).filter(p => p.snapped).length;
            const total = Object.keys(level1Parts).length;
            updateProgress((snappedCount / total) * 100, `${snappedCount}/${total} 部件已归位`);

            if (snappedCount === total) {
                level1Completed = true;
                Object.values(level1Parts).forEach(part => {
                    part.element.classList.remove('dim');
                    part.element.classList.add('lit');
                });
                playSuccessSound();
                createConfetti();
                showToast('皮影拼装完成！', 2000);
                setTimeout(() => {
                    showLevelComplete(1, '匠心重塑完成！', '你成功复原了传统皮影的骨骼结构，感受到了"断线成格、关节联动"的解构美学。');
                }, 1200);
            }
        }

        // ==================== 关卡二：灯火戏梦 ====================
        // 容差：±30度
        const L2_TOLERANCE = 30;

        function initLevel2() {
            clearStage();
            currentLevel = 2;
            currentActionIndex = 0;
            level2Completed = false;

            const stageRect = stage.getBoundingClientRect();
            // 玩家皮影偏左居中，参考图在右侧
            const playerX = stageRect.width * 0.35;
            const centerY = stageRect.height / 2;

            const partPositions = {
                'head':      { x: playerX - 50,  y: centerY - 170 },
                'body':      { x: playerX - 50,  y: centerY - 50  },
                'arm-left':  { x: playerX - 120, y: centerY - 40  },
                'arm-right': { x: playerX + 50,  y: centerY - 40  },
                'leg-left':  { x: playerX - 30,  y: centerY + 70  },
                'leg-right': { x: playerX + 20,  y: centerY + 70  }
            };
            const labels = { 'head': '头', 'body': '身', 'arm-left': '左臂', 'arm-right': '右臂', 'leg-left': '左腿', 'leg-right': '右腿' };
            Object.entries(partPositions).forEach(([type, pos]) => {
                createPuppetPart(type, pos.x, pos.y, { label: labels[type] });
            });

            // 显示参考动作图
            showReferencePose(0);
            updateRotationPanel();

            updateLevelIndicator(2);
            document.getElementById('progress-bar').classList.add('show');
            document.getElementById('progress-text').classList.add('show');
            updateProgress(0, `动作 1/${actionTargets.length}`);
            document.getElementById('hint-text').textContent = '🎭 照着右侧参考图旋转你的皮影，角度接近±30°即可';
            document.getElementById('parts-panel').style.display = 'none';
            document.getElementById('record-section').style.display = 'none';
            document.getElementById('action-counter').classList.add('show');
            document.getElementById('rotation-panel').classList.add('show');
            document.getElementById('env-panel').classList.remove('show');
            document.getElementById('template-panel').classList.remove('show');
            document.getElementById('text-input-panel').classList.remove('show');
            updateActionCounter();

            const counter = document.getElementById('action-counter');
            counter.innerHTML = '<h3>动作完成度</h3>' + actionTargets.map((a, i) =>
                `<div class="action-item ${i===0?'current':''}" id="action-${i+1}"><div class="check"></div><span>${a.name}</span></div>`
            ).join('');

            showLevelHint('第二关 · 灯火戏梦',
                '右侧会展示参考动作图，你需要旋转自己的皮影来模仿它。',
                '点击部件选中，滚动滚轮旋转。当你的角度与目标角度相差±30°以内时即为成功！连续完成5个动作即可过关。');
        }

        // 构建参考动作图：在右侧渲染一套完整皮影，各部件旋转到目标角度
        function showReferencePose(actionIndex) {
            const refFrame = document.getElementById('ref-frame');
            // 清除旧的参考部件
            refFrame.querySelectorAll('.ref-part').forEach(el => el.remove());

            if (actionIndex >= actionTargets.length) {
                document.getElementById('reference-pose').classList.remove('show');
                return;
            }

            const target = actionTargets[actionIndex];
            document.getElementById('ref-label').textContent = `参考：${target.name}`;
            document.getElementById('reference-pose').classList.add('show');

            // 参考图内的部件布局（缩小的皮影）
            const refLayout = {
                'head':      { x: 65,  y: 30,  w: 60, h: 60,  svg: '<ellipse cx="50" cy="45" rx="35" ry="40" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><circle cx="35" cy="40" r="6" fill="#fff"/><circle cx="65" cy="40" r="6" fill="#fff"/><circle cx="35" cy="40" r="3" fill="#000"/><circle cx="65" cy="40" r="3" fill="#000"/><path d="M 30 65 Q 50 78 70 65" stroke="#d4af37" stroke-width="2" fill="none"/><path d="M 20 20 Q 50 5 80 20" stroke="#d4af37" stroke-width="2" fill="none"/><circle cx="50" cy="15" r="6" fill="#c41e3a"/>' },
                'body':      { x: 65,  y: 100, w: 60, h: 72,  svg: '<path d="M 30 10 L 70 10 L 80 100 L 20 100 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><path d="M 40 30 L 60 30 L 60 50 L 40 50 Z" fill="#c41e3a"/><path d="M 45 60 L 55 60 L 55 90 L 45 90 Z" fill="#d4af37"/>' },
                'arm-left':   { x: 30,  y: 105, w: 48, h: 60,  svg: '<path d="M 40 10 L 60 10 L 50 90 L 30 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><circle cx="45" cy="15" r="10" fill="#a0522d"/>' },
                'arm-right':  { x: 102, y: 105, w: 48, h: 60,  svg: '<path d="M 20 10 L 40 10 L 50 90 L 30 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><circle cx="35" cy="15" r="10" fill="#a0522d"/>' },
                'leg-left':   { x: 48,  y: 195, w: 36, h: 60,  svg: '<path d="M 20 10 L 40 10 L 35 90 L 25 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><ellipse cx="30" cy="15" rx="12" ry="8" fill="#a0522d"/>' },
                'leg-right':  { x: 84,  y: 195, w: 36, h: 60,  svg: '<path d="M 20 10 L 40 10 L 35 90 L 25 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/><ellipse cx="30" cy="15" rx="12" ry="8" fill="#a0522d"/>' }
            };

            Object.entries(refLayout).forEach(([type, layout]) => {
                const part = document.createElement('div');
                part.className = 'ref-part';
                part.style.left = layout.x + 'px';
                part.style.top = layout.y + 'px';
                part.style.width = layout.w + 'px';
                part.style.height = layout.h + 'px';
                part.style.transform = `rotate(${target.rotations[type] || 0}deg)`;
                part.innerHTML = `<svg width="${layout.w}" height="${layout.h}" viewBox="0 0 100 100">${layout.svg}</svg>`;
                refFrame.appendChild(part);
            });

            showToast(`第${actionIndex + 1}幕：${target.name} - ${target.desc}`, 2500);
        }

        function updateRotationPanel() {
            const panel = document.getElementById('rotation-rows');
            if (!panel) return;
            if (currentLevel !== 2 || currentActionIndex >= actionTargets.length) {
                document.getElementById('rotation-panel').classList.remove('show');
                return;
            }
            const target = actionTargets[currentActionIndex];
            const labels = { 'head': '头部', 'body': '身体', 'arm-left': '左臂', 'arm-right': '右臂', 'leg-left': '左腿', 'leg-right': '右腿' };
            panel.innerHTML = '';
            Object.entries(target.rotations).forEach(([type, targetRot]) => {
                const row = document.createElement('div');
                row.className = 'rotation-row';
                row.id = `rot-row-${type}`;
                const puppet = document.querySelector(`.puppet[data-type="${type}"]`);
                const currentRot = puppet ? (parseFloat(puppet.dataset.rotation) || 0) : 0;
                const diff = Math.abs(currentRot - targetRot);
                // ±30度内算成功，进度条按距离换算
                const accuracy = Math.max(0, 100 - (diff / L2_TOLERANCE) * 100);
                const color = diff <= L2_TOLERANCE ? '#4ade80' : diff <= L2_TOLERANCE * 2 ? '#fbbf24' : '#ef4444';
                const status = diff <= L2_TOLERANCE ? ' ✓' : '';
                row.innerHTML = `<span class="rotation-label">${labels[type]}</span><div class="rotation-bar"><div class="rotation-fill" style="width:${accuracy}%;background:${color};"></div></div><span class="rotation-value">${Math.round(currentRot)}°/${targetRot}°${status}</span>`;
                panel.appendChild(row);
            });
        }

        function checkActionMatch() {
            if (currentActionIndex >= actionTargets.length) return;
            updateRotationPanel();
            const target = actionTargets[currentActionIndex];
            const puppets = document.querySelectorAll('.puppet');
            let allMatched = true;

            puppets.forEach(puppet => {
                const type = puppet.dataset.type;
                const targetRot = target.rotations[type];
                if (targetRot === undefined) return;
                const currentRot = parseFloat(puppet.dataset.rotation) || 0;
                const diff = Math.abs(currentRot - targetRot);
                puppet.classList.remove('near-match', 'matched');
                if (diff <= L2_TOLERANCE) puppet.classList.add('matched');
                else if (diff <= L2_TOLERANCE * 2) puppet.classList.add('near-match');
                if (diff > L2_TOLERANCE) allMatched = false;
            });

            if (allMatched) {
                showMatchIndicator();
                playMatchSound();
                document.getElementById(`action-${currentActionIndex + 1}`).classList.remove('current');
                document.getElementById(`action-${currentActionIndex + 1}`).classList.add('completed');
                document.querySelector(`#action-${currentActionIndex + 1} .check`).textContent = '✓';
                currentActionIndex++;
                updateProgress((currentActionIndex / actionTargets.length) * 100, `动作 ${currentActionIndex}/${actionTargets.length}`);
                if (currentActionIndex >= actionTargets.length) {
                    level2Completed = true;
                    document.getElementById('reference-pose').classList.remove('show');
                    setTimeout(() => { showLevelComplete(2, '剧目排演完成！', '你成功掌握了传统戏曲"欲左先右、形神兼备"的舞台身段！'); }, 1500);
                } else {
                    document.getElementById(`action-${currentActionIndex + 1}`).classList.add('current');
                    setTimeout(() => { showReferencePose(currentActionIndex); playDrumSound(); }, 1000);
                }
            }
        }

        function showMatchIndicator() {
            const ind = document.getElementById('match-indicator');
            ind.classList.remove('show');
            void ind.offsetWidth;
            ind.classList.add('show');
            setTimeout(() => ind.classList.remove('show'), 1000);
        }

        function updateActionCounter() {
            document.querySelectorAll('.action-item').forEach((item, i) => {
                item.classList.remove('current', 'completed');
                item.querySelector('.check').textContent = '';
                if (i < currentActionIndex) { item.classList.add('completed'); item.querySelector('.check').textContent = '✓'; }
                else if (i === currentActionIndex) item.classList.add('current');
            });
        }

        // ==================== 关卡三：乾坤自载 ====================
        function initLevel3() {
            clearStage();
            currentLevel = 3;
            const stageRect = stage.getBoundingClientRect();
            const centerX = stageRect.width / 2;
            const centerY = stageRect.height / 2;

            // 创建一个完整角色
            const positions = {
                'head':      { x: centerX - 50,  y: centerY - 170 },
                'body':      { x: centerX - 50,  y: centerY - 50  },
                'arm-left':  { x: centerX - 120, y: centerY - 40  },
                'arm-right': { x: centerX + 50,  y: centerY - 40  },
                'leg-left':  { x: centerX - 30,  y: centerY + 70  },
                'leg-right': { x: centerX + 20,  y: centerY + 70  }
            };
            Object.entries(positions).forEach(([type, pos]) => createPuppetPart(type, pos.x, pos.y));

            updateLevelIndicator(3);
            document.getElementById('progress-bar').classList.remove('show');
            document.getElementById('progress-text').classList.remove('show');
            document.getElementById('hint-text').textContent = '🎬 自由创作：拖拽部件、旋转关节、添加道具、录制剧场';
            document.getElementById('parts-panel').style.display = 'flex';
            document.getElementById('record-section').style.display = 'block';
            document.getElementById('action-counter').classList.remove('show');
            document.getElementById('rotation-panel').classList.remove('show');
            document.getElementById('env-panel').classList.add('show');
            document.getElementById('template-panel').classList.add('show');
            document.getElementById('text-input-panel').classList.add('show');

            showLevelHint('第三关 · 乾坤自载',
                '彻底解放限制，进入自由工坊模式，进行自主剧目创作与录制。',
                '拖拽部件、旋转关节，创造你的皮影故事。底部添加更多角色与道具，左侧选择场景模板，输入台词弹幕，点击录制保存作品！');
        }

        // ==================== 场景模板 ====================
        function loadTemplate(name) {
            clearStage();
            const stageRect = stage.getBoundingClientRect();
            const cx = stageRect.width / 2;
            const cy = stageRect.height / 2;

            switch(name) {
                case 'warrior':
                    // 武将出征 - 红色角色 + 剑 + 山
                    createPuppetPart('prop-mountain', cx - 250, cy + 50);
                    const wParts = {
                        'head':      { x: cx - 50, y: cy - 170 },
                        'body':      { x: cx - 50, y: cy - 50 },
                        'arm-left':  { x: cx - 120, y: cy - 40 },
                        'arm-right': { x: cx + 50, y: cy - 40 },
                        'leg-left':  { x: cx - 30, y: cy + 70 },
                        'leg-right': { x: cx + 20, y: cy + 70 }
                    };
                    Object.entries(wParts).forEach(([type, pos]) => createPuppetPart(type, pos.x, pos.y, { color: 'warrior' }));
                    createPuppetPart('prop-sword', cx + 130, cy - 20);
                    changeEnvironment('dusk');
                    showToast('已加载：武将出征', 2000);
                    break;
                case 'scholar':
                    // 才子佳话 - 蓝色角色 + 扇 + 树
                    createPuppetPart('prop-tree', cx - 280, cy + 20);
                    createPuppetPart('prop-tree', cx + 250, cy - 30);
                    const sParts = {
                        'head':      { x: cx - 50, y: cy - 170 },
                        'body':      { x: cx - 50, y: cy - 50 },
                        'arm-left':  { x: cx - 120, y: cy - 40 },
                        'arm-right': { x: cx + 50, y: cy - 40 },
                        'leg-left':  { x: cx - 30, y: cy + 70 },
                        'leg-right': { x: cx + 20, y: cy + 70 }
                    };
                    Object.entries(sParts).forEach(([type, pos]) => createPuppetPart(type, pos.x, pos.y, { color: 'scholar' }));
                    createPuppetPart('prop-fan', cx + 130, cy - 20, { color: 'scholar' });
                    changeEnvironment('day');
                    showToast('已加载：才子佳话', 2000);
                    break;
                case 'moon':
                    // 月下独酌 - 粉色角色 + 月 + 云
                    createPuppetPart('prop-moon', cx - 280, cy - 180);
                    createPuppetPart('prop-cloud', cx + 200, cy - 150);
                    createPuppetPart('prop-cloud', cx - 180, cy - 80);
                    const mParts = {
                        'head':      { x: cx - 50, y: cy - 170 },
                        'body':      { x: cx - 50, y: cy - 50 },
                        'arm-left':  { x: cx - 120, y: cy - 40 },
                        'arm-right': { x: cx + 50, y: cy - 40 },
                        'leg-left':  { x: cx - 30, y: cy + 70 },
                        'leg-right': { x: cx + 20, y: cy + 70 }
                    };
                    Object.entries(mParts).forEach(([type, pos]) => createPuppetPart(type, pos.x, pos.y, { color: 'princess' }));
                    changeEnvironment('night');
                    toggleParticles('spark');
                    showToast('已加载：月下独酌', 2000);
                    break;
            }
        }

        // ==================== 文字弹幕 ====================
        function addStageText() {
            const input = document.getElementById('stage-text-input');
            const text = input.value.trim();
            if (!text) return;
            const stageRect = stage.getBoundingClientRect();
            const textEl = document.createElement('div');
            textEl.className = 'stage-text';
            textEl.textContent = text;
            textEl.style.left = (Math.random() * (stageRect.width - 300) + 100) + 'px';
            textEl.style.top = (Math.random() * (stageRect.height - 300) + 100) + 'px';
            stage.appendChild(textEl);
            setTimeout(() => textEl.remove(), 5000);
            input.value = '';
        }

        // ==================== 粒子效果 ====================
        let particleInterval = null;
        function toggleParticles(type) {
            stopParticles();
            const layer = document.getElementById('particle-layer');
            particleInterval = setInterval(() => {
                const p = document.createElement('div');
                p.className = `particle ${type}`;
                p.style.left = Math.random() * 100 + '%';
                p.style.top = type === 'spark' ? Math.random() * 100 + '%' : '0px';
                p.style.animationDuration = (3 + Math.random() * 4) + 's';
                p.style.animationDelay = Math.random() * 2 + 's';
                layer.appendChild(p);
                setTimeout(() => p.remove(), 8000);
            }, 200);
        }

        function stopParticles() {
            if (particleInterval) { clearInterval(particleInterval); particleInterval = null; }
            document.getElementById('particle-layer').innerHTML = '';
        }

        // ==================== 关卡系统 ====================
        function updateLevelIndicator(level) {
            for (let i = 1; i <= 3; i++) {
                const ind = document.getElementById(`level-${i}-ind`);
                ind.classList.remove('active', 'completed');
                if (i < level || (i === level && i < maxUnlockedLevel)) ind.classList.add('completed');
                else if (i === level) ind.classList.add('active');
                if (i > maxUnlockedLevel) ind.style.opacity = '0.4';
                else ind.style.opacity = '1';
            }
        }

        function updateProgress(percent, text) {
            document.getElementById('progress-fill').style.width = percent + '%';
            if (text) document.getElementById('progress-text').textContent = text;
        }

        function showLevelHint(title, desc, detail) {
            document.getElementById('hint-title').textContent = title;
            document.getElementById('hint-desc').textContent = desc;
            document.getElementById('hint-detail').textContent = detail;
            // 每次显示时重置按钮为默认行为，防止残留的 onclick 导致无限弹窗
            const btn = document.querySelector('#level-hint .btn');
            btn.textContent = '开始挑战';
            btn.onclick = () => closeLevelHint();
            document.getElementById('level-hint').classList.add('show');
            document.getElementById('overlay').classList.add('show');
        }

        function closeLevelHint() {
            document.getElementById('level-hint').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
        }

        function showLevelComplete(level, title, message) {
            if (level >= maxUnlockedLevel) maxUnlockedLevel = level + 1;
            createConfetti();
            showLevelHint(title, message, level < 3 ? '准备好进入下一关了吗？' : '你可以继续自由创作，或重新挑战！');
            const btn = document.querySelector('#level-hint .btn');
            btn.textContent = level < 3 ? '进入下一关' : '继续创作';
            btn.onclick = () => {
                closeLevelHint();
                if (level === 1) initLevel2();
                else if (level === 2) initLevel3();
            };
        }

        function jumpToLevel(level) {
            if (level > maxUnlockedLevel) { showToast('请先完成前面的关卡！', 1500); return; }
            closeLevelHint();
            closeVideoPreview();
            if (level === 1) initLevel1();
            else if (level === 2) initLevel2();
            else if (level === 3) initLevel3();
        }

        function restartLevel() { jumpToLevel(currentLevel); }

        // ==================== 庆祝动画 ====================
        function createConfetti() {
