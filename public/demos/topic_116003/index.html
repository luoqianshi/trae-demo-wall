            const container = document.getElementById('celebration');
            container.innerHTML = '';
            const colors = ['#d4af37', '#c41e3a', '#8b4513', '#fff', '#ff6b6b', '#4ade80'];
            for (let i = 0; i < 60; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + '%';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDelay = Math.random() * 2 + 's';
                c.style.animationDuration = (2 + Math.random() * 2) + 's';
                container.appendChild(c);
            }
            setTimeout(() => container.innerHTML = '', 5000);
        }

        // ==================== 环境切换 ====================
        function changeEnvironment(env) {
            document.querySelectorAll('.env-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            else { const btns = document.querySelectorAll('.env-btn'); btns.forEach(b => { if (b.textContent.includes(env === 'day' ? '白' : env === 'dusk' ? '黄' : env === 'night' ? '深' : '水')) b.classList.add('active'); }); }

            const stg = document.getElementById('stage');
            const lighting = document.getElementById('lighting');
            const sceneBg = document.getElementById('scene-bg');
            stopParticles();

            switch(env) {
                case 'day':
                    stg.style.background = 'linear-gradient(180deg, #4a3728 0%, #2a1810 100%)';
                    lighting.style.background = 'radial-gradient(ellipse at 50% 40%, rgba(255,240,200,0.4) 0%, rgba(255,220,150,0.2) 30%, transparent 60%)';
                    sceneBg.style.opacity = '0.3';
                    sceneBg.innerHTML = '';
                    break;
                case 'dusk':
                    stg.style.background = 'linear-gradient(180deg, #5a3020 0%, #2a1008 100%)';
                    lighting.style.background = 'radial-gradient(ellipse at 50% 40%, rgba(255,180,100,0.35) 0%, rgba(255,120,50,0.15) 30%, transparent 60%)';
                    sceneBg.style.opacity = '0.4';
                    sceneBg.innerHTML = '<svg width="100%" height="100%" preserveAspectRatio="none"><defs><linearGradient id="duskGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b4513" stop-opacity="0.3"/><stop offset="100%" stop-color="#1a0a00" stop-opacity="0"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#duskGrad)"/></svg>';
                    break;
                case 'night':
                    stg.style.background = 'linear-gradient(180deg, #1a0a00 0%, #0a0500 100%)';
                    lighting.style.background = 'radial-gradient(ellipse at 50% 40%, rgba(255,200,100,0.2) 0%, rgba(255,150,50,0.1) 30%, transparent 60%)';
                    sceneBg.style.opacity = '0.5';
                    sceneBg.innerHTML = '<svg width="100%" height="100%"><circle cx="100" cy="80" r="2" fill="#fff" opacity="0.6"/><circle cx="300" cy="120" r="1.5" fill="#fff" opacity="0.5"/><circle cx="500" cy="60" r="2" fill="#fff" opacity="0.7"/><circle cx="700" cy="100" r="1" fill="#fff" opacity="0.4"/><circle cx="900" cy="70" r="1.5" fill="#fff" opacity="0.6"/><circle cx="1100" cy="110" r="2" fill="#fff" opacity="0.5"/></svg>';
                    toggleParticles('spark');
                    break;
                case 'ink':
                    stg.style.background = 'linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%)';
                    lighting.style.background = 'radial-gradient(ellipse at 50% 40%, rgba(200,200,200,0.2) 0%, rgba(150,150,150,0.1) 30%, transparent 60%)';
                    sceneBg.style.opacity = '0.2';
                    sceneBg.innerHTML = '';
                    document.querySelectorAll('.puppet').forEach(p => { p.style.filter = 'grayscale(100%) contrast(1.2) drop-shadow(2px 4px 6px rgba(0,0,0,0.8))'; });
                    return;
            }
            document.querySelectorAll('.puppet').forEach(p => { p.style.filter = ''; });
        }

        // ==================== 录制功能 ====================
        async function toggleRecording() {
            if (isRecording) stopRecording();
            else startRecording();
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { mediaSource: 'screen', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const video = document.getElementById('preview-video');
                    video.src = url;
                    document.getElementById('video-preview').classList.add('show');
                    document.getElementById('overlay').classList.add('show');
                    document.getElementById('download-btn').style.display = 'inline-block';
                    stream.getTracks().forEach(track => track.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                recordStartTime = Date.now();
                document.getElementById('record-btn').textContent = '停止录制';
                document.getElementById('record-btn').classList.add('recording');
                document.getElementById('record-indicator').classList.add('active');
                recordTimer = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
                    const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const s = (elapsed % 60).toString().padStart(2, '0');
                    document.getElementById('record-time').textContent = `${m}:${s}`;
                }, 1000);
            } catch (err) { showToast('录制失败: ' + err.message, 3000); }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('record-btn').textContent = '开始录制';
                document.getElementById('record-btn').classList.remove('recording');
                document.getElementById('record-indicator').classList.remove('active');
                clearInterval(recordTimer);
                document.getElementById('record-time').textContent = '00:00';
            }
        }

        function closeVideoPreview() {
            document.getElementById('video-preview').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
        }

        function downloadRecording() {
            if (recordedChunks.length > 0) {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `影戏乾坤_${new Date().toLocaleString().replace(/[/:]/g, '-')}.webm`;
                a.click();
                URL.revokeObjectURL(url);
            }
        }

        // ==================== 通用功能 ====================
        function clearStage() {
            document.querySelectorAll('.puppet, .shadow-silhouette, .snap-target, .stage-text, .ref-part').forEach(el => el.remove());
            document.getElementById('reference-pose').classList.remove('show');
            selectedPart = null;
            stopParticles();
        }

        function resetPuppets() {
            const stageRect = stage.getBoundingClientRect();
            const cx = currentLevel === 2 ? stageRect.width * 0.35 : stageRect.width / 2;
            const cy = stageRect.height / 2;
            const positions = {
                'head':      { x: cx - 50, y: cy - 170 },
                'body':      { x: cx - 50, y: cy - 50 },
                'arm-left':  { x: cx - 120, y: cy - 40 },
                'arm-right': { x: cx + 50, y: cy - 40 },
                'leg-left':  { x: cx - 30, y: cy + 70 },
                'leg-right': { x: cx + 20, y: cy + 70 }
            };
            document.querySelectorAll('.puppet').forEach(puppet => {
                const type = puppet.dataset.type;
                const pos = positions[type];
                if (pos) { puppet.style.left = pos.x + 'px'; puppet.style.top = pos.y + 'px'; }
                puppet.dataset.rotation = '0';
                puppet.style.transform = 'rotate(0deg)';
                updateAngleIndicator(puppet);
            });
        }

        function changeTexture(type) {
            const curtain = document.getElementById('curtain');
            switch(type) {
                case 'smooth':
                    curtain.style.background = `radial-gradient(ellipse at 30% 50%, rgba(255,200,100,0.15) 0%, transparent 50%), radial-gradient(ellipse at 70% 50%, rgba(255,180,80,0.1) 0%, transparent 50%)`;
                    break;
                case 'rough':
                    curtain.style.background = `radial-gradient(ellipse at 30% 50%, rgba(255,200,100,0.15) 0%, transparent 50%), radial-gradient(ellipse at 70% 50%, rgba(255,180,80,0.1) 0%, transparent 50%), repeating-linear-gradient(90deg, rgba(139,69,19,0.15) 0px, rgba(160,82,45,0.15) 1px, rgba(139,69,19,0.15) 2px)`;
                    break;
                case 'pattern':
                    curtain.style.background = `radial-gradient(ellipse at 30% 50%, rgba(255,200,100,0.15) 0%, transparent 50%), radial-gradient(ellipse at 70% 50%, rgba(255,180,80,0.1) 0%, transparent 50%), radial-gradient(circle at 20% 30%, rgba(139,105,20,0.1) 0%, transparent 20%), radial-gradient(circle at 80% 70%, rgba(139,105,20,0.1) 0%, transparent 20%)`;
                    break;
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
            showToast(soundEnabled ? '音效已开启' : '音效已关闭', 1200);
        }

        function showToast(message, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function showTitleScreen() {
            document.getElementById('title-screen').classList.remove('hide');
            clearStage();
        }

        function startGame(level) {
            document.getElementById('title-screen').classList.add('hide');
            setTimeout(() => {
                if (level === 3) { maxUnlockedLevel = 3; initLevel3(); }
                else initLevel1();
            }, 800);
        }

        // 灯光控制
        document.getElementById('light-hue').addEventListener('input', updateLighting);
        document.getElementById('light-brightness').addEventListener('input', updateLighting);

        function updateLighting() {
            const hue = document.getElementById('light-hue').value;
            const brightness = document.getElementById('light-brightness').value;
            document.getElementById('lighting').style.background = `radial-gradient(ellipse at 50% 40%, hsla(${hue}, 80%, ${brightness}%, 0.3) 0%, hsla(${hue}, 60%, ${brightness - 20}%, 0.1) 30%, transparent 60%)`;
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if ((e.key === 'Delete' || e.key === 'Backspace') && selectedPart && currentLevel === 3) {
                selectedPart.remove(); selectedPart = null;
            }
            if ((e.key === 'r' || e.key === 'R') && selectedPart) {
                selectedPart.dataset.rotation = '0';
                selectedPart.style.transform = 'rotate(0deg)';
                updateAngleIndicator(selectedPart);
                if (currentLevel === 2) checkActionMatch();
            }
            if (e.key === 'Enter' && currentLevel === 3) addStageText();
        });

        // 点击空白处取消选择
        stage.addEventListener('click', (e) => {
            if (e.target === stage || e.target.id === 'curtain' || e.target.id === 'lighting' || e.target.id === 'scene-bg' || e.target.id === 'particle-layer') {
                document.querySelectorAll('.puppet').forEach(p => { p.classList.remove('selected'); const ai = p.querySelector('.angle-indicator'); if (ai) ai.classList.remove('show'); });
                selectedPart = null;
            }
        });

        // 部件面板拖拽
        document.querySelectorAll('.part-item').forEach(item => {
            item.addEventListener('dragstart', (e) => { e.dataTransfer.setData('part-type', item.dataset.part); });
        });

        stage.addEventListener('dragover', (e) => { e.preventDefault(); });
        stage.addEventListener('drop', (e) => {
            e.preventDefault();
            const partType = e.dataTransfer.getData('part-type');
            if (partType && currentLevel === 3) {
                const stageRect = stage.getBoundingClientRect();
                const x = e.clientX - stageRect.left - 50;
                const y = e.clientY - stageRect.top - 50;
                createPuppetPart(partType, x, y);
            }
        });

        // 防止页面滚动
        document.addEventListener('wheel', (e) => { if (selectedPart) e.preventDefault(); }, { passive: false });

        // 文字输入回车
        document.getElementById('stage-text-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); addStageText(); }
        });
    </script>
</body>
