<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TriKnowledge · 三源知识引擎 · 交互演示</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #131a2e;
    --panel: #1a2240;
    --panel-2: #232c52;
    --border: #2c3760;
    --text: #e6ebff;
    --muted: #8b94bd;
    --accent: #5eead4;
    --accent-2: #818cf8;
    --warn: #fbbf24;
    --err: #f87171;
    --user: #3b82f6;
    --agent: #10b981;
    --tool: #a855f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    background: radial-gradient(circle at top left, #1e293b 0%, var(--bg) 60%);
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  /* —— 顶栏 —— */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: rgba(11, 16, 32, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
  }
  .logo-mark {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #0b1020; font-size: 18px;
    box-shadow: 0 4px 12px rgba(94, 234, 212, 0.25);
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.15; }
  .logo-text .t1 { font-weight: 700; font-size: 16px; }
  .logo-text .t2 { font-size: 11px; color: var(--muted); }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.35);
    font-size: 11px; color: var(--agent);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--agent);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.55); }
    70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }
  .scene-counter {
    font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* —— 主舞台 —— */
  .stage {
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 16px;
    gap: 12px;
  }
  .chat-window {
    flex: 1;
    max-width: 980px;
    width: 100%;
    margin: 0 auto;
    background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    background: rgba(0,0,0,0.25);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .chat-header .left { display: flex; gap: 18px; align-items: center; }
  .chat-header .endpoint {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--accent);
  }
  .chat-header .token {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--muted);
    font-size: 11px;
  }
  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    scroll-behavior: smooth;
  }
  .chat-body::-webkit-scrollbar { width: 8px; }
  .chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* —— 消息样式 —— */
  .msg-row {
    display: flex;
    margin-bottom: 14px;
    gap: 10px;
    animation: msgIn 0.35s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { justify-content: flex-end; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .avatar.agent {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1020;
  }
  .avatar.user {
    background: var(--user);
    color: white;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.55;
    word-wrap: break-word;
  }
  .bubble.user {
    background: var(--user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.agent {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.agent strong { color: var(--accent); }
  .bubble.agent code {
    background: rgba(94, 234, 212, 0.1);
    color: var(--accent);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px;
  }

  /* —— 工具调用卡片 —— */
  .tool-card {
    max-width: 86%;
    background: rgba(168, 85, 247, 0.08);
    border: 1px solid rgba(168, 85, 247, 0.35);
    border-radius: 10px;
    overflow: hidden;
    margin-left: 42px;
    animation: msgIn 0.4s ease-out;
  }
  .tool-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: rgba(168, 85, 247, 0.15);
    border-bottom: 1px solid rgba(168, 85, 247, 0.3);
    font-size: 12px;
  }
  .tool-name {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    color: #c084fc;
    font-weight: 600;
  }
  .tool-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(94, 234, 212, 0.15);
    color: var(--accent);
    border: 1px solid rgba(94, 234, 212, 0.3);
  }
  .tool-tag.llm { background: rgba(251, 191, 36, 0.15); color: var(--warn); border-color: rgba(251, 191, 36, 0.3); }
  .tool-tag.async { background: rgba(244, 114, 182, 0.15); color: #f472b6; border-color: rgba(244, 114, 182, 0.3); }
  .tool-body {
    padding: 10px 12px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.55;
    color: #cbd5e1;
    overflow-x: auto;
    max-height: 280px;
    overflow-y: auto;
  }
  .tool-body .k { color: #93c5fd; }
  .tool-body .s { color: #fcd34d; }
  .tool-body .n { color: #c4b5fd; }
  .tool-body .b { color: #86efac; }
  .tool-body .comment { color: #64748b; font-style: italic; }
  .tool-body pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .tool-status {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed rgba(168, 85, 247, 0.25);
    width: 100%;
    font-size: 11px;
    color: var(--muted);
  }
  .tool-status .ok { color: var(--agent); }
  .tool-status .pending { color: var(--warn); }

  /* —— 进度时间线 —— */
  .timeline {
    margin-left: 42px;
    padding: 10px 12px;
    background: rgba(251, 191, 36, 0.06);
    border: 1px dashed rgba(251, 191, 36, 0.3);
    border-radius: 8px;
    font-size: 12px;
    color: var(--warn);
    margin-bottom: 14px;
    animation: msgIn 0.4s ease-out;
  }
  .timeline-step {
    display: flex; align-items: center; gap: 8px;
    margin: 4px 0;
    opacity: 0.4;
    transition: opacity 0.4s;
  }
  .timeline-step.active { opacity: 1; }
  .timeline-step .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .timeline-step.active .dot {
    background: var(--warn);
    box-shadow: 0 0 8px var(--warn);
  }
  .timeline-step.done .dot { background: var(--agent); }
  .timeline-step .label { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .timeline-step .time { color: var(--muted); font-size: 10px; margin-left: auto; }

  /* —— 底部控制栏 —— */
  .control-bar {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 12px 18px;
    background: rgba(11, 16, 32, 0.85);
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
  }
  .scene-info {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
    min-width: 0;
  }
  .scene-info .label { color: var(--accent); font-weight: 600; }
  .nav-buttons { display: flex; gap: 8px; }
  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover:not(:disabled) {
    background: var(--panel-2);
    border-color: var(--accent);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1020;
    font-weight: 600;
    border: none;
  }
  .btn.primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(94, 234, 212, 0.35);
  }
  .arrow { font-size: 16px; line-height: 1; }

  /* —— 欢迎屏 —— */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    max-width: 720px;
    margin: 0 auto;
    animation: msgIn 0.5s ease-out;
  }
  .welcome h1 {
    font-size: 28px;
    margin: 16px 0 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .welcome .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 24px 0;
  }
  .feature {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: left;
  }
  .feature .icon { font-size: 20px; margin-bottom: 6px; }
  .feature .title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .feature .desc { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .start-hint {
    font-size: 13px; color: var(--accent);
    margin-top: 18px;
    animation: blink 1.6s infinite;
  }
  @keyframes blink { 50% { opacity: 0.5; } }

  /* —— 结束屏 —— */
  .finale {
    text-align: center;
    padding: 30px 20px;
    max-width: 800px;
    margin: 0 auto;
  }
  .finale h2 {
    font-size: 22px;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 18px 0;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .stat .num {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .tech-stack {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; margin: 14px 0;
  }
  .tech-chip {
    background: rgba(129, 140, 248, 0.12);
    border: 1px solid rgba(129, 140, 248, 0.3);
    color: var(--accent-2);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }

  /* 工具响应缩略 — 折叠 */
  .collapsible {
    border-top: 1px dashed var(--border);
    margin-top: 8px;
    padding-top: 6px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }
</style>
</head>
<body>
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark">TK</div>
      <div class="logo-text">
        <span class="t1">TriKnowledge</span>
        <span class="t2">三源知识引擎 · v0.1.0</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="status-pill">
        <span class="status-dot"></span>
        MCP Server Live · http://127.0.0.1:7710
      </span>
      <span class="scene-counter" id="sceneCounter">0 / 10</span>
    </div>
  </div>

  <!-- 舞台 -->
  <div class="stage">
    <div class="chat-window">
      <div class="chat-header">
        <div class="left">
          <span>📡 <span class="endpoint">POST /mcp</span></span>
          <span>🛡️ Bearer <span class="token">tk_demo-ua_qmFyu5xTN2ofkxkYjto6qg</span></span>
        </div>
        <div>
          <span style="color: var(--muted);">project:</span>
          <span class="endpoint">demo-ua</span>
        </div>
      </div>
      <div class="chat-body" id="chatBody"></div>
      <div class="control-bar">
        <div class="scene-info" id="sceneInfo">
          <span class="label">Scene:</span> 欢迎使用 TriKnowledge 演示。点击右箭头开始 →
        </div>
        <div class="nav-buttons">
          <button class="btn" id="prevBtn" disabled>← 上一幕</button>
          <button class="btn primary" id="nextBtn">下一幕 <span class="arrow">→</span></button>
        </div>
      </div>
    </div>
  </div>

<script>
// ============== 场景定义 ==============
const scenes = [
  // —— Scene 0: 欢迎屏 ——
  {
    title: "欢迎使用 TriKnowledge",
    render: () => `
      <div class="welcome">
        <div class="logo-mark" style="width:64px;height:64px;font-size:28px;margin:0 auto;">TK</div>
        <h1>TriKnowledge · 三源知识引擎</h1>
        <div class="subtitle">把项目文档、代码知识、运维经验统一编译为可查询、可追溯的知识图谱</div>
        <div class="feature-grid">
          <div class="feature">
            <div class="icon">📚</div>
            <div class="title">三源统一</div>
            <div class="desc">docs / code / exp 三个语义目录承接原始资料</div>
          </div>
          <div class="feature">
            <div class="icon">🧠</div>
            <div class="title">LLM 编译</div>
            <div class="desc">调用 deepseek-v4-flash 把资料编译为带双向链接的 wiki</div>
          </div>
          <div class="feature">
            <div class="icon">🔌</div>
            <div class="title">MCP 暴露</div>
            <div class="desc">通过 Streamable HTTP 把 16 个工具暴露给任意 Agent</div>
          </div>
        </div>
        <div class="start-hint">▶ 点击右下角箭头开始演示（共 10 幕，约 3 分钟）</div>
      </div>
    `
  },
  // —— Scene 1: 用户发起分析 ——
  {
    title: "用户发起项目分析",
    render: () => `
      <div class="msg-row user">
        <div class="bubble user">为我分析 D:/danwen/TriKnowledge/demos/ua-demo-repo 项目</div>
        <div class="avatar user">U</div>
      </div>
      <div class="msg-row">
        <div class="avatar agent">A</div>
        <div class="bubble agent">
          收到。我先把项目注册到 TriKnowledge 多项目命名空间，再触发 Understand-Anything 桥接 + 自动编译。整个流程是<strong>异步</strong>的，我会返回 <code>job_id</code> 让你轮询。
        </div>
      </div>
    `
  },
  // —— Scene 2: 注册项目 ——
  {
    title: "tk_register_project — 注册项目",
    render: () => `
      <div class="msg-row">
        <div class="avatar agent">A</div>
        <div class="bubble agent">第一步：调用 <code>tk_register_project</code> 创建 wiki 工作区 + 颁发 Bearer token。</div>
      </div>
      ${toolCard("tk_register_project", "project admin", `
  <span class="comment">// 请求参数</span>
  {
    <span class="k">"id"</span>: <span class="s">"demo-ua"</span>,
    <span class="k">"display_name"</span>: <span class="s">"UA Demo Repo"</span>,
    <span class="k">"repo_path"</span>: <span class="s">"D:/danwen/TriKnowledge/demos/ua-demo-repo"</span>
  }`, `
  <span class="comment">// 响应</span>
  {
    <span class="k">"project_id"</span>: <span class="s">"demo-ua"</span>,
    <span class="k">"wiki_root"</span>: <span class="s">"C:/Users/34161/.triknowledge/wiki-projects/demo-ua"</span>,
    <span class="k">"token"</span>: <span class="s">"tk_demo-ua_qmFyu5xTN2ofkxkYjto6qg"</span>
  }
  <div class="tool-status">
    <span class="ok">✓ schema 已初始化</span> ·
    <span>sources/{docs,code,exp}/ + wiki/concepts/ 已创建</span>
  </div>`)}
    `
  },
  // —— Scene 3: 触发 UA + 异步任务 ——
  {
    title: "tk_run_ua — 异步触发 UA 桥接 + 自动编译",
    render: () => `
      <div class="msg-row">
        <div class="avatar agent">A</div>
        <div class="bubble agent">
          第二步：调用 <code>tk_run_ua</code> 触发 <strong>ua-bridge.mjs</strong>，把 UA 输出的 knowledge-graph.json 转成 sources/code/*.md，再走 <code>ingest</code> + LLM 队列 <code>compile</code>。
        </div>
      </div>
      ${toolCard("tk_run_ua", "async job", `
  <span class="comment">// 请求参数（空）</span>
  {}`, `
  <span class="comment">// 响应（立即返回，不阻塞 MCP）</span>
  {
    <span class="k">"job_id"</span>: <span class="s">"job_1783236414904_f149a4c5"</span>,
    <span class="k">"status"</span>: <span class="s">"running_ua"</span>,
    <span class="k">"repo_path"</span>: <span class="s">"D:/danwen/TriKnowledge/demos/ua-demo-repo"</span>,
    <span class="k">"note"</span>: <span class="s">"Poll tk_job_status until status=done or failed"</span>
  }`)}
      <div class="timeline">
        <strong style="color:var(--warn);">⏳ 异步任务进度（4 分 28 秒）</strong>
        <div class="timeline-step done"><div class="dot"></div><div class="label">running_ua</div><div class="time">07:26:54</div></div>
        <div class="timeline-step done"><div class="dot"></div><div class="label">bridging_done · 3 nodes, 2 edges, 1 layer, 1 tour</div><div class="time">07:27:18</div></div>
        <div class="timeline-step done"><div class="dot"></div><div class="label">ingesting · 6 个 .md 写入 sources/code/</div><div class="time">07:27:20</div></div>
        <div class="timeline-step done"><div class="dot"></div><div class="label">compiling · 进入 LLM FIFO 队列</div><div class="time">07:27:22</div></div>
        <div class="timeline-step active"><div class="dot"></div><div class="label">done · 18 concept pages</div><div class="time">07:31:22</div></div>
      </div>
    `
  },
  // —— Scene 4: 编译完成 ——
  {
    title: "tk_job_status — 编译完成，18 页生成",
    render: () => `
      <div class="msg-row">
        <div class="avatar agent">A</div>
        <div class="bubble agent">
          轮询 <code>tk_job_status</code>，状态变为 <strong>done</strong>。从 UA 的 3 个节点编译出 <strong>18 个概念页</strong>，包含 6 个原始 source，全部建立双向链接。
        </div>
      </div>
      ${toolCard("tk_job_status", "async job", `
  <span class="comment">// 请求</span>
  { <span class="k">"job_id"</span>: <span class="s">"job_1783236414904_f149a4c5"</span> }`, `
  {
    <span class="k">"job_id"</span>: <span class="s">"job_1783236414904_f149a4c5"</span>,
    <span class="k">"project_id"</span>: <span class="s">"demo-ua"</span>,
    <span class="k">"status"</span>: <span class="s">"done"</span>,
    <span class="k">"compile_result"</span>: {
      <span class="k">"compiled"</span>: <span class="n">6</span>,
      <span class="k">"pages"</span>: [
        <span class="s">"ensuredirs-function"</span>, <span class="s">"slugification"</span>,
        <span class="s">"architecture-layers"</span>, <span class="s">"utilities-layer"</span>,
        <span class="s">"barrel-exports-pattern"</span>, <span class="s">"recommended-reading-tour"</span>,

// ============== 工具函数 ==============
function toolCard(name, tag, req, resp) {
  return `
    <div class="tool-card">
      <div class="tool-head">
        <span>🔧 <span class="tool-name">${name}</span>()</span>
        <span class="tool-tag ${tag === 'LLM queue' ? 'llm' : tag === 'async job' ? 'async' : ''}">${tag}</span>
      </div>
      <div class="tool-body">
        <pre>${req}</pre>
        ${resp ? `<div style="border-top:1px dashed rgba(168,85,247,0.25); margin:6px 0; padding-top:6px;"><pre>${resp}</pre></div>` : ''}
      </div>
    </div>
  `;
}

// ============== 渲染状态机 ==============
let currentScene = 0;
const chatBody = document.getElementById('chatBody');
const sceneInfo = document.getElementById('sceneInfo');
const sceneCounter = document.getElementById('sceneCounter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderScene(idx) {
  // 0 是欢迎屏（替换），其他场景追加
  if (idx === 0) {
    chatBody.innerHTML = scenes[0].render();
  } else {
    // 重新构建 [0..idx] 的全部消息（更直观）
    let html = '';
    for (let i = 1; i <= idx; i++) {
      html += scenes[i].render();
    }
    chatBody.innerHTML = html;
  }
  sceneInfo.innerHTML = `<span class="label">Scene ${idx}:</span> ${scenes[idx].title}`;
  sceneCounter.textContent = `${idx} / ${scenes.length - 1}`;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === scenes.length - 1;
  // 滚到底部
  requestAnimationFrame(() => { chatBody.scrollTop = chatBody.scrollHeight; });
}

prevBtn.addEventListener('click', () => {
  if (currentScene > 0) { currentScene--; renderScene(currentScene); }
});
nextBtn.addEventListener('click', () => {
  if (currentScene < scenes.length - 1) { currentScene++; renderScene(currentScene); }
});

// 键盘左右键支持
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextBtn.click();
  else if (e.key === 'ArrowLeft') prevBtn.click();
});

// 初始渲染
renderScene(0);
