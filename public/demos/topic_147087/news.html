  var newsView = window.TT.NewsView.create(appEl);
  newsView.renderFeed();

  var detailView = window.TT.EventDetailView.create(appEl);
  var canvasView = window.TT.TimelineCanvasView.create(appEl);

  function showNews() {
    detailView.hide();
    canvasView.hide();
    newsView.show();
  }

  function showDetail(nodeId) {
    newsView.hide();
    canvasView.hide();
    detailView.show(nodeId);
  }

  function showCanvas(nodeId, fromEl) {
    newsView.hide();
    detailView.hide();
    canvasView.triggerTransition(fromEl, function () {
      canvasView.show(nodeId);
    });
  }

  newsView.on('article:click', function (ev) {
    showDetail(ev.nodeId);
  });

  newsView.on('home:click', function () {
    window.location.href = 'index.html';
  });

  newsView.on('enter:about', function () {
    window.location.href = 'about.html';
  });

  detailView.on('back', function () {
    showNews();
  });

  detailView.on('article:click', function (ev) {
    // already handled in detailView.show()
  });

  detailView.on('timeline:click', function (ev) {
    var ctaBtn = document.querySelector('[data-role="detail-timeline-btn"]');
    showCanvas(ev.nodeId, ctaBtn);
  });

  canvasView.on('back', function () {
    showDetail(canvasView._focusNodeId);
  });

  canvasView.on('home:click', function () {
    showNews();
  });

  canvasView.on('node:click', function (ev) {
    showDetail(ev.nodeId);
  });

  newsView.renderFeed();
  showNews();

  window._app = { newsView: newsView, detailView: detailView, canvasView: canvasView, showNews: showNews, showDetail: showDetail, showCanvas: showCanvas };
})();
</script>
</body>
</html>
