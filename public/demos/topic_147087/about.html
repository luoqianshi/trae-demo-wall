<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 · 事刻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css?v=2">
<link rel="stylesheet" href="styles/base.css?v=2">
<link rel="stylesheet" href="styles/about.css?v=7">
<style>
  :root {
    --text-primary: #333333;
    --text-secondary: #888888;
    --text-muted: #bbbbbb;
    --bg-card: #ffffff;
    --bg-canvas: #f5f5f5;
    --border-light: #eeeeee;
    --border-subtle: #f5f5f5;
    --accent: #ff5a3c;
    --weight-strong: 600;
    --ease-out: cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    font-size: 14px;
    background: var(--bg-canvas);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
</style>
</head>
<body>

<div id="app" data-role="view-container"></div>

<script src="core/EventEmitter.js?v=8"></script>
<script src="components/views/AboutView.js?v=6"></script>

<script>
(function () {
  var container = document.getElementById('app');
  var aboutView = window.TT.AboutView.create(container);

  aboutView.on('navigate', function (ev) {
    if (ev.target === 'home') {
      window.location.href = 'index.html';
    } else if (ev.target === 'news') {
      window.location.href = 'news.html';
    } else if (ev.target === 'canvas') {
      window.location.href = 'index.html#canvas';
    }
  });
})();
</script>

</body>
</html>
