    'ft-stock':        { id:'ft-stock', title:'期权激励计划', summary:'向核心员工发放期权，覆盖率达80%。', startTime:'2023-01-20', importance:'important', tags:['团队'] },
    // === 用户增长 ===
    'ft-10k-users':    { id:'ft-10k-users', title:'用户破万', summary:'上线8个月，注册用户突破1万。', startTime:'2020-12-01', importance:'important', tags:['增长'] },
    'ft-100k-users':   { id:'ft-100k-users', title:'用户破十万', summary:'口碑传播效应显现，月新增超3万。', startTime:'2021-05-01', importance:'breakthrough', tags:['增长'] },
    'ft-1m-users':     { id:'ft-1m-users', title:'用户破百万', summary:'V2.0带动爆发，日活首次破百万。', startTime:'2022-12-01', importance:'breakthrough', tags:['增长'] },
    'ft-10m-users':    { id:'ft-10m-users', title:'用户破千万', summary:'V3.0全球化推动，海外用户占比40%。', startTime:'2024-03-01', importance:'breakthrough', tags:['增长'] }
  });

  store.loadRelations([
    { fromNodeId:'ft-founding', toNodeId:'ft-microservices', targetTimelineId:'tl-demo-tech', label:'技术基因' },
    { fromNodeId:'ft-founding', toNodeId:'ft-inference-refactor', targetTimelineId:'tl-demo-tech', label:'架构演进' },
    { fromNodeId:'ft-founding', toNodeId:'ft-seed-round', targetTimelineId:'tl-demo-main', label:'催生' },
    { fromNodeId:'ft-seed-round', toNodeId:'ft-10k-users', targetTimelineId:'tl-demo-growth', label:'驱动' },
    { fromNodeId:'ft-seed-round', toNodeId:'ft-v1-launch', targetTimelineId:'tl-demo-main', label:'依赖' },
    { fromNodeId:'ft-v1-launch', toNodeId:'ft-stargan-proto', targetTimelineId:'tl-demo-tech', label:'引擎' },
    { fromNodeId:'ft-v1-launch', toNodeId:'ft-series-a', targetTimelineId:'tl-demo-main', label:'助推' },
    { fromNodeId:'ft-series-a', toNodeId:'ft-team-grow', targetTimelineId:'tl-demo-team', label:'催生' },
    { fromNodeId:'ft-series-a', toNodeId:'ft-100k-users', targetTimelineId:'tl-demo-growth', label:'助力' },
    { fromNodeId:'ft-series-a', toNodeId:'ft-v2-launch', targetTimelineId:'tl-demo-main', label:'依赖' },
    { fromNodeId:'ft-v2-launch', toNodeId:'ft-multimodal-research', targetTimelineId:'tl-demo-tech', label:'奠基' },

    { fromNodeId:'ft-regulation', toNodeId:'ft-watermark', targetTimelineId:'tl-demo-side', label:'影响' },
    { fromNodeId:'ft-global-expand', toNodeId:'ft-series-b', targetTimelineId:'tl-demo-main', label:'助推' },
    { fromNodeId:'ft-series-b', toNodeId:'ft-watermark', targetTimelineId:'tl-demo-side', label:'协同' },
    { fromNodeId:'ft-series-b', toNodeId:'ft-market-regulation', targetTimelineId:'tl-demo-market', label:'呼应' },
    { fromNodeId:'ft-series-b', toNodeId:'ft-v3-launch', targetTimelineId:'tl-demo-main', label:'依赖' },
    { fromNodeId:'ft-v3-launch', toNodeId:'ft-10m-users', targetTimelineId:'tl-demo-growth', label:'引爆' },
    { fromNodeId:'ft-v3-launch', toNodeId:'ft-market-final', targetTimelineId:'tl-demo-market', label:'定局' },
    { fromNodeId:'ft-microservices', toNodeId:'ft-stargan-proto', targetTimelineId:'tl-demo-tech', label:'铺垫' },
    { fromNodeId:'ft-stargan-proto', toNodeId:'ft-multimodal-research', targetTimelineId:'tl-demo-tech', label:'演进' },
    { fromNodeId:'ft-multimodal-research', toNodeId:'ft-xinghe-train', targetTimelineId:'tl-demo-tech', label:'转化' },
    { fromNodeId:'ft-xinghe-train', toNodeId:'ft-inference-refactor', targetTimelineId:'tl-demo-tech', label:'落地' },
    { fromNodeId:'ft-inference-refactor', toNodeId:'ft-v3-launch', targetTimelineId:'tl-demo-main', label:'赋能' },
    { fromNodeId:'ft-competitor-a', toNodeId:'ft-price-war', targetTimelineId:'tl-demo-market', label:'引发' },
    { fromNodeId:'ft-price-war', toNodeId:'ft-ma-event', targetTimelineId:'tl-demo-market', label:'催化' },
    { fromNodeId:'ft-ma-event', toNodeId:'ft-market-regulation', targetTimelineId:'tl-demo-market', label:'连锁' },
    { fromNodeId:'ft-market-regulation', toNodeId:'ft-market-final', targetTimelineId:'tl-demo-market', label:'终局' },
    { fromNodeId:'ft-10k-users', toNodeId:'ft-100k-users', targetTimelineId:'tl-demo-growth', label:'积累' },
    { fromNodeId:'ft-100k-users', toNodeId:'ft-1m-users', targetTimelineId:'tl-demo-growth', label:'跃升' },
    { fromNodeId:'ft-1m-users', toNodeId:'ft-10m-users', targetTimelineId:'tl-demo-growth', label:'爆发' }
  ]);

  store.loadTimelines({
    'tl-demo-main': {
      id: 'tl-demo-main', title: '星辰创业全历程',
      nodes: [
        { time:'2020-03-15', nodeId:'ft-founding', importance:'breakthrough' },
        { time:'2020-08-20', nodeId:'ft-seed-round', importance:'important' },
        { time:'2021-02-10', nodeId:'ft-v1-launch', importance:'breakthrough' },
        { time:'2021-06-15', nodeId:'ft-series-a', importance:'important' },
        { time:'2022-03-20', nodeId:'ft-v2-launch', importance:'breakthrough' },
        { time:'2022-08-01', nodeId:'ft-global-expand', importance:'important' },
        { time:'2023-02-01', nodeId:'ft-regulation', importance:'important' },
        { time:'2023-09-20', nodeId:'ft-series-b', importance:'breakthrough' },
        { time:'2024-01-15', nodeId:'ft-v3-launch', importance:'breakthrough' }
      ]
    },
    'tl-demo-tech': {
      id: 'tl-demo-tech', title: '技术架构演进',
      nodes: [
        { time:'2020-06-10', nodeId:'ft-microservices', importance:'important' },
        { time:'2021-01-20', nodeId:'ft-stargan-proto', importance:'important' },
        { time:'2022-01-15', nodeId:'ft-multimodal-research', importance:'important' },
        { time:'2023-03-01', nodeId:'ft-xinghe-train', importance:'breakthrough' },
        { time:'2023-12-10', nodeId:'ft-inference-refactor', importance:'important' }
      ]
    },
    'tl-demo-market': {
      id: 'tl-demo-market', title: '市场竞争格局',
      nodes: [
        { time:'2020-10-01', nodeId:'ft-competitor-a', importance:'important' },
        { time:'2021-08-15', nodeId:'ft-price-war', importance:'important' },
        { time:'2022-06-30', nodeId:'ft-ma-event', importance:'important' },
        { time:'2023-07-20', nodeId:'ft-market-regulation', importance:'important' },
        { time:'2024-02-28', nodeId:'ft-market-final', importance:'breakthrough' }
      ]
    },
    'tl-demo-team': {
      id: 'tl-demo-team', title: '核心团队成长',
      nodes: [
        { time:'2021-09-01', nodeId:'ft-team-grow', importance:'important' },
        { time:'2022-05-15', nodeId:'ft-culture', importance:'minor' },
        { time:'2022-10-10', nodeId:'ft-hiring', importance:'minor' },
        { time:'2023-01-20', nodeId:'ft-stock', importance:'important' }
      ]
    },
    'tl-demo-side': {
      id: 'tl-demo-side', title: '合规与应对',
      nodes: [
        { time:'2023-03-05', nodeId:'ft-audit', importance:'minor' },
        { time:'2023-04-12', nodeId:'ft-policy-update', importance:'minor' },
        { time:'2023-05-10', nodeId:'ft-watermark', importance:'important' },
        { time:'2023-06-20', nodeId:'ft-training', importance:'minor' },
        { time:'2023-08-05', nodeId:'ft-external-audit', importance:'minor' }
      ]
    },
    'tl-demo-growth': {

      nodes: [
        { time:'2020-12-01', nodeId:'ft-10k-users', importance:'important' },
        { time:'2021-05-01', nodeId:'ft-100k-users', importance:'breakthrough' },
        { time:'2022-12-01', nodeId:'ft-1m-users', importance:'breakthrough' },
        { time:'2024-03-01', nodeId:'ft-10m-users', importance:'breakthrough' }
      ]
    }
  });

  T('DataStore 加载 32 个节点', store._nodes.size === 32);
  T('tl-demo-main 有 9 个节点', store.getTimeline('tl-demo-main').nodes.length === 9);
  T('tl-demo-tech 有 5 个节点', store.getTimeline('tl-demo-tech').nodes.length === 5);
  T('tl-demo-market 有 5 个节点', store.getTimeline('tl-demo-market').nodes.length === 5);
  T('tl-demo-team 有 4 个节点', store.getTimeline('tl-demo-team').nodes.length === 4);
  T('tl-demo-side 有 5 个节点', store.getTimeline('tl-demo-side').nodes.length === 5);
  T('tl-demo-growth 有 4 个节点', store.getTimeline('tl-demo-growth').nodes.length === 4);

  S('--- NarrativeCanvas 基础 ---');

  var stage = document.getElementById('stage');
  var canvas = window.TT.NarrativeCanvas.create(stage);

  T('NarrativeCanvas 实例可创建', canvas instanceof window.TT.NarrativeCanvas);
  T('getElement 返回 DOM', canvas.getElement() instanceof HTMLElement);

  S('--- 添加时间线列 ---');

  canvas.addColumn('tl-demo-main', 'main');

  var stageEl = canvas.getElement().querySelector('[data-role="canvas-stage"]');
  var colEls = stageEl.querySelectorAll('[data-role="timeline-column"]');
  T('默认只渲染 1 列', colEls.length === 1);

  S('--- ConnectionLayer ---');

  var clEl = stageEl.querySelector('[data-role="connection-layer"]');
  T('ConnectionLayer SVG 存在', !!clEl);
  T('SVG 在 stage 内', clEl && clEl.parentNode === stageEl);
  T('SVG 含 arrow marker', clEl && clEl.querySelector('marker') !== null);

  S('--- TimeAxis ---');

  var taEl = stageEl.querySelector('[data-role="time-axis"]');
  T('TimeAxis 存在', !!taEl);
  T('TimeAxis 在 stage 内', taEl && taEl.parentNode === stageEl);
  T('TimeAxis 是第一个子元素', taEl && stageEl.firstChild === taEl);

  var zr = document.getElementById('zoom-readout');
  canvas.on('zoom:changed', function (ev) { zr.textContent = '缩放: ' + Math.round(ev.zoom * 100) + '%'; });

  S('--- node:selected 事件转发 + 分支展开 ---');

  var selected = null;
  var nodeDetail = window.TT.NodeDetail.create();

  // 点击卡片其他区域 → 弹出详情面板
  canvas.on('node:selected', function (d) {
    selected = d;

    var nodeData = store.getNode(d.nodeId);
    if (nodeData) {
      // 获取关联详情列表
      var rels = store.getRelationsOf(d.nodeId);
      var relations = [];
      rels.forEach(function (r) {
        var targetNode = store.getNode(r.toNodeId);
        relations.push({
          label: r.label || '关联',
          targetNodeId: r.toNodeId,
          targetTitle: targetNode ? targetNode.title : r.toNodeId,
          direction: r.direction || 'out'
        });
      });

      var cardData = {
        id: nodeData.id,
        title: nodeData.title,
        summary: nodeData.summary,
        content: nodeData.content,
        startTime: nodeData.startTime,
        importance: nodeData.importance,
        confidence: nodeData.confidence,
        tags: nodeData.tags ? (Array.isArray(nodeData.tags) ? nodeData.tags : Object.keys(nodeData.tags)) : [],
        relationCount: relations.length,
        relations: relations,
        sources: nodeData.sources || [],
        comments: nodeData.comments || []
      };
      nodeDetail.open(cardData, d.nodeEl);
    }
  });

  // 点击关联圆点 → 展开分支事件线
  canvas.on('node:relation-click', function (d) {
    var tl = store.getTimeline(d.timelineId);
    if (!tl) return;
    var entry = null;
    for (var i = 0; i < tl.nodes.length; i++) {
      if (tl.nodes[i].nodeId === d.nodeId) { entry = tl.nodes[i]; break; }
    }
    if (!entry || !entry.relations) return;

    var branchTlIds = {};
    for (var j = 0; j < entry.relations.length; j++) {
      var r = entry.relations[j];
      if (r.direction !== 'out' && r.direction !== '→') continue;
      var targetTlId = r.targetTimelineId || d.timelineId;
      if (targetTlId !== d.timelineId && !canvas.getColumn(targetTlId)) {
        branchTlIds[targetTlId] = true;
      }
    }
    Object.keys(branchTlIds).forEach(function (branchId) {
      canvas.addColumn(branchId, 'extra');
    });
  });

  // 初始只渲染主列，不自动展开分支
  // 手动点击节点验证分支展开：
  //   - ft-regulation → 引出 tl-demo-side（合规与应对，5 节点）
  //   - ft-series-a   → 引出 tl-demo-team（团队成长，4 节点）
  //   - ft-global-expand → 引出 tl-demo-team
  T('初始只渲染主列（等待手动点击展开分支）', stageEl.querySelectorAll('[data-role="timeline-column"]').length === 1);

  S('--- 缩放功能 ---');

  T('默认 zoom = 1', canvas.getZoom() === 1);

  canvas.zoomIn();
  T('zoomIn() 缩放增大', canvas.getZoom() > 1);

  canvas.zoomOut();
  T('zoomOut() 恢复', canvas.getZoom() <= 1);

  canvas.setZoom(0.1);
  T('setZoom 下限钳制在 0.5', canvas.getZoom() === 0.5);

  canvas.setZoom(3);
  T('setZoom 上限钳制在 1.5', canvas.getZoom() === 1.5);

  canvas.setZoom(1);
  zr.textContent = '缩放: 100%';

  S('--- zoomToFit ---');

  canvas.zoomToFit();
  T('zoomToFit 后 zoom ≤ 1', canvas.getZoom() <= 1);
  canvas.setZoom(1);
  zr.textContent = '缩放: 100%';

  S('--- destroy 验证 ---');

  var testCanvas = window.TT.NarrativeCanvas.create(document.createElement('div'));
  testCanvas.destroy();
  T('destroy 后 getElement 返回 null', testCanvas.getElement() === null);

  S('结果: ' + pc + ' 通过, ' + fc + ' 失败');
  S('手动验证：点击 ft-regulation / ft-series-a / ft-global-expand 展开分支');
})();
</script>
</body>
</html>
