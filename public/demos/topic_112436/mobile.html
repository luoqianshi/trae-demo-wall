  var searchInput = document.getElementById('searchInput');

  var resultPage = document.getElementById('resultPage');
  var actionBar = document.getElementById('actionBar');
  var bottomSpacer = document.getElementById('bottomSpacer');
  var toastEl = document.getElementById('toast');
  var hotScroll = document.getElementById('hotScroll');
  var catList = document.getElementById('catList');
  var activeIndex = -1;
  var currentItem = null;

  // Hot chips — neutral style
  var hotItems = ['水晶疗愈','量子养生仪','量子波动速读','冥想','针灸','能量疗愈','益生菌','芳香疗法'];
  hotItems.forEach(function(name) {
    var chip = document.createElement('div');
    chip.className = 'hot-chip';
    chip.textContent = name;
    chip.onclick = function() { selectItem(name); };
    hotScroll.appendChild(chip);
  });

  // Category list — clean list without emoji
  var cats = {};
  data.forEach(function(d) {
    if (!cats[d.category]) cats[d.category] = [];
    cats[d.category].push(d);
  });
  Object.keys(cats).forEach(function(cat) {
    var first = cats[cat][0];
    var item = document.createElement('div');
    item.className = 'cat-item';
    item.onclick = function() { selectItem(first.name); };
    item.innerHTML =
      '<div class="cat-icon-wrap ' + first.tagClass + '">' + first.abbr + '</div>' +
      '<div class="cat-info">' +
        '<div class="cat-name">' + cat + '</div>' +
        '<div class="cat-desc">' + cats[cat].map(function(d){ return d.name; }).join('、') + '</div>' +
      '</div>' +
      '<span class="cat-arrow">&#8250;</span>';
    catList.appendChild(item);
  });

  // Search
  searchInput.addEventListener('focus', function() { searchInner.classList.add('focused'); });
  searchInput.addEventListener('blur', function() { searchInner.classList.remove('focused'); });
  searchInput.addEventListener('input', function() {
    var q = this.value.trim();
    searchClear.classList.toggle('show', q.length > 0);
    activeIndex = -1;
    if (!q) { suggestionsEl.classList.remove('active'); return; }
    var matches = data.filter(function(d) {
      return d.name.indexOf(q) > -1 || d.category.indexOf(q) > -1;
    });
    if (!matches.length) {
      suggestionsEl.innerHTML = '<div class="s-empty">未找到相关疗愈方式</div>';
      suggestionsEl.classList.add('active'); return;
    }
    var html = '';
    matches.forEach(function(m, i) {
      html += '<div class="suggestion-item" data-idx="' + i + '" data-name="' + m.name + '">'
        + '<span class="s-name">' + hl(m.name, q) + '</span>'
        + '<span class="s-tag ' + m.tagClass + '">' + m.tag + '</span>'
        + '<span class="s-cat">' + m.category + '</span></div>';
    });
    suggestionsEl.innerHTML = html;
    suggestionsEl.classList.add('active');
    suggestionsEl.querySelectorAll('.suggestion-item').forEach(function(el) {
      el.addEventListener('click', function() { selectItem(this.getAttribute('data-name')); });
    });
  });
  searchInput.addEventListener('keydown', function(e) {
    var items = suggestionsEl.querySelectorAll('.suggestion-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIndex = Math.min(activeIndex+1, items.length-1); highlightItem(items); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIndex = Math.max(activeIndex-1, 0); highlightItem(items); }
    else if (e.key === 'Enter' && activeIndex >= 0) { e.preventDefault(); selectItem(items[activeIndex].getAttribute('data-name')); }
    else if (e.key === 'Escape') { suggestionsEl.classList.remove('active'); searchInput.blur(); }
  });
  searchClear.addEventListener('click', function() {
    searchInput.value = ''; searchClear.classList.remove('show');
    suggestionsEl.classList.remove('active'); searchInput.focus();
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-wrap')) suggestionsEl.classList.remove('active');
  });

  function hl(text, q) {
    var i = text.indexOf(q);
    if (i === -1) return text;
    return text.substring(0,i) + '<strong style="color:var(--accent)">' + q + '</strong>' + text.substring(i+q.length);
  }
  function highlightItem(items) {
    items.forEach(function(el) { el.style.background = ''; });
    if (items[activeIndex]) items[activeIndex].style.background = 'var(--bg2)';
  }

  function selectItem(name) {
    var item = data.find(function(d) { return d.name === name; });
    if (!item) return;
    currentItem = item;
    searchInput.value = name;
    searchClear.classList.add('show');
    suggestionsEl.classList.remove('active');
    homeView.style.display = 'none';
    resultPage.classList.remove('active');
    void resultPage.offsetWidth;
    resultPage.classList.add('active');
    actionBar.classList.add('show');
    bottomSpacer.classList.add('show');
    document.getElementById('rTitle').textContent = item.name;
    var badge = document.getElementById('rBadge');
    badge.textContent = item.tag;
    badge.className = 'r-badge ' + item.tagClass;
    document.getElementById('rMetrics').innerHTML = item.metrics.map(function(m) {
      return '<div class="r-metric"><div class="r-metric-label">' + m.label + '</div><div class="r-metric-value ' + m.cls + '">' + m.value + '</div></div>';
    }).join('');
    document.getElementById('rEvidence').innerHTML = '<p>' + item.evidence + '</p>';
    document.getElementById('rRefs').innerHTML = '<ul class="refs">' + item.refs.map(function(r) { return '<li>' + r + '</li>'; }).join('') + '</ul>';
    document.getElementById('rNote').innerHTML = '<p>' + item.note + '</p>';
    document.getElementById('rSummary').textContent = item.summary;
    document.querySelectorAll('.r-section-header').forEach(function(h) { h.classList.remove('open'); });
    document.querySelectorAll('.r-section-body').forEach(function(b) { b.classList.remove('open'); });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('backBtn').addEventListener('click', function() {
    resultPage.classList.remove('active');
    actionBar.classList.remove('show');
    bottomSpacer.classList.remove('show');
    homeView.style.display = 'block';
    searchInput.value = '';
    searchClear.classList.remove('show');
    currentItem = null;
  });

  window.toggleSection = function(header) {
    var body = header.nextElementSibling;
    header.classList.toggle('open');
    body.classList.toggle('open');
  };

  window.copyResult = function() {
    if (!currentItem) return;
    var d = currentItem;
    var lines = [];
    lines.push('【假疗愈查证结果】');
    lines.push('');
    lines.push(d.name + '  ' + d.tag);
    lines.push('');
    d.metrics.forEach(function(m) { lines.push(m.label + '：' + m.value); });
    lines.push('');
    lines.push('结论：' + d.summary);
    lines.push('');
    lines.push('— 假疗愈 · 基于循证医学的查证工具');
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { showCopyFeedback(); }).catch(function() { fallbackCopy(text, true); });
    } else { fallbackCopy(text, true); }
  };
  function fallbackCopy(text, isCopy) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try {
      document.execCommand('copy');
      if (isCopy) showCopyFeedback(); else showToast('已复制，可粘贴分享');
    } catch(e) { showToast('复制失败'); }
    document.body.removeChild(ta);
  }
  function showCopyFeedback() {
    var btn = document.querySelector('.action-btn.secondary');
    var origHTML = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><polyline points="20 6 9 17 4 12"/></svg> 已复制';
    btn.style.borderColor = 'var(--accent2)';
    btn.style.color = 'var(--accent2)';
    showToast('查证结果已复制');
    setTimeout(function() { btn.innerHTML = origHTML; btn.style.borderColor = ''; btn.style.color = ''; }, 2000);
  }
  window.shareResult = function() {
    if (!currentItem) return;
    var d = currentItem;
    var shareText = '我在「假疗愈」查了「' + d.name + '」，结果是：' + d.tag + '。' + d.summary;
    if (navigator.share) {
      navigator.share({ title: '假疗愈 — ' + d.name + '（' + d.tag + '）', text: shareText }).catch(function() {});
    } else {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareText).then(function() { showShareFeedback(); }).catch(function() { fallbackCopy(shareText, false); });
      } else { fallbackCopy(shareText, false); }
    }
  };

    var btn = document.querySelector('.action-btn.primary');
    var origHTML = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg> 已复制分享文案';
    showToast('已复制分享文案，去微信粘贴发送吧');
    setTimeout(function() { btn.innerHTML = origHTML; }, 2500);
  }
  window.showToast = function(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function() { toastEl.classList.remove('show'); }, 2000);
  };
})();
</script>
