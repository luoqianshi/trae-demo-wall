<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>决策体检 - Decision Check</title>
    <meta name="description" content="先看到谁在替你做决定，再把决策主权拿回来">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #137aa8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 20px;
            color: #4a5568;
            font-size: 14px;
        }
        .loading-error {
            margin-top: 10px;
            color: #e53e3e;
            font-size: 12px;
        }
        #app {
            display: none;
        }
    </style>
    <script>
        window.CHART_JS_LOADED = false;
        
        function loadScript(url, callback) {
            var script = document.createElement('script');
            script.src = url;
            script.onload = function() {
                callback(true);
            };
            script.onerror = function() {
                console.warn('Failed to load script:', url);
                callback(false);
            };
            document.head.appendChild(script);
        }
        
        function loadChartJs() {
            return new Promise(function(resolve, reject) {
                loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js', function(success) {
                    if (success && typeof Chart !== 'undefined') {
                        window.CHART_JS_LOADED = true;
                        resolve(true);
                    } else {
                        console.warn('Chart.js failed to load, falling back to HTML charts');
                        resolve(false);
                    }
                });
            });
        }
        
        function loadStylesheet(url) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = url;
            document.head.appendChild(link);
        }
        
        loadStylesheet('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        loadStylesheet('css/style.css');
        
        var jsLoaded = 0;
        var jsTotal = 8;
        
        function checkAllLoaded() {
            jsLoaded++;
            if (jsLoaded >= jsTotal) {
                document.getElementById('loading-overlay').style.opacity = '0';
                setTimeout(function() {
                    document.getElementById('loading-overlay').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    document.dispatchEvent(new Event('DOMContentLoaded'));
                }, 500);
            }
        }
        
        function loadAppScripts() {
            var scripts = [
                'js/cases.js',
                'js/utils.js',
                'js/chart.js',
                'js/diagnosis.js',
                'js/demo.js',
                'js/pages.js',
                'js/main.js',
                'js/test-assessment.js'
            ];
            
            scripts.forEach(function(src) {
                loadScript(src, function(success) {
                    checkAllLoaded();
                });
            });
        }
        
        loadChartJs().then(function() {
            loadAppScripts();
        });
        
        setTimeout(function() {
            if (jsLoaded < jsTotal) {
                var errorMsg = document.querySelector('.loading-error');
                if (errorMsg) {
                    errorMsg.textContent = '资源加载较慢，请稍候...';
                }
            }
        }, 3000);
    </script>
</head>
<body>
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载决策体检...</div>
        <div class="loading-error"></div>
    </div>
    
    <div id="app" class="app">
        <div id="page-container" class="page-container"></div>
    </div>
</body>
</html>
