<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#fff8e7">
<title>AI 防骗陪练 · 老年人反诈对话模拟器</title>
<style>
  /* ===== 设计令牌 ===== */
  :root{
    --bg:#fff8e7;
    --bg-2:#ffefc4;
    --bg-card:#ffffff;
    --primary:#d4380d;          /* 安全红 */
    --primary-dark:#a8071a;
    --primary-soft:#fff1f0;
    --secondary:#1677ff;        /* 理性蓝 */
    --secondary-dark:#0958d9;
    --secondary-soft:#e6f4ff;
    --accent:#389e0d;           /* 墨绿 墨绿成功 */
    --accent-soft:#f6ffed;
    --warn:#fa8c16;
    --warn-soft:#fff7e6;
    --text:#4a2c0f;             /* 深棕 */
    --text-2:#6d4c2a;
    --text-mute:#9a7b5a;
    --border:#e8d5a8;
    --shadow-sm:0 2px 6px rgba(74,44,15,.08);
    --shadow-md:0 6px 18px rgba(74,44,15,.12);
    --shadow-lg:0 12px 32px rgba(74,44,15,.18);
    --radius:20px;
    --radius-lg:28px;
    --font-base:18px;
    --font-large:22px;
    --font:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',sans-serif;
    --maxw:760px;
  }
  html.large-text{
    --font-base:26px;
    --font-large:34px;
  }
  /* 大字模式：覆盖硬编码小字号，确保关键交互区全部放大 */
  html.large-text .scenario-card .preview{font-size:var(--font-base);}
  html.large-text .hero .stat .lbl{font-size:16px;}
  html.large-text .hero .badge{font-size:18px;}
  html.large-text .status-pill{font-size:16px;}
  html.large-text .quick-card .qd{font-size:16px;}
  html.large-text .score-cell .l{font-size:16px;}
  html.large-text .dict-card .cat-tag{font-size:15px;}
  html.large-text .hero .stat .num{font-size:calc(var(--font-large) + 12px);}
  html.large-text .chat-header .timer{font-size:18px;}
  html.large-text .chat-header .info .d{font-size:16px;}
  html.large-text .qr-btn{font-size:18px;}
  html.large-text .trick-item .flaw{font-size:var(--font-base);}
  html.large-text .trick-item .advice{font-size:var(--font-base);}
  html.large-text .redflag-list .rf{font-size:var(--font-base);}
  html.large-text .score-cell .n{font-size:calc(var(--font-large) + 4px);}
  html.large-text .msg .role-tag{font-size:15px;}
  html.large-text .toast{font-size:18px;}
  html.large-text .panel .row{font-size:var(--font-base);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    font-size:var(--font-base);
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 50% -200px,#ffe9b3 0%,transparent 60%),
      linear-gradient(180deg,#fff8e7 0%,#fff3d4 100%);
    background-attachment:fixed;
    min-height:100vh;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  input,textarea{font-family:inherit;color:inherit;}
  a{color:var(--secondary-dark);}

  /* ===== 顶栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,#d4380d 0%,#a8071a 100%);
    color:#fff;
    box-shadow:0 4px 16px rgba(168,7,26,.3);
  }
  .topbar-inner{
    max-width:var(--maxw);margin:0 auto;
    padding:14px 18px;
    display:flex;align-items:center;gap:12px;
  }
  .topbar-logo{
    font-size:calc(var(--font-large) + 4px);
    font-weight:900;
    letter-spacing:1px;
    display:flex;align-items:center;gap:10px;
    flex:1;
    text-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .topbar-logo .shield{
    display:inline-block;
    animation:shield-pulse 2.4s ease-in-out infinite;
  }
  @keyframes shield-pulse{
    0%,100%{transform:scale(1) rotate(0);}
    50%{transform:scale(1.12) rotate(-3deg);}
  }
  .topbar-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{
    width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.18);
    color:#fff;font-size:20px;
    display:flex;align-items:center;justify-content:center;
    transition:.2s;
    border:2px solid rgba(255,255,255,.25);
  }
  .icon-btn:hover{background:rgba(255,255,255,.32);transform:translateY(-1px);}
  .icon-btn.active{background:#fff;color:var(--primary-dark);}

  /* Ollama 状态徽章 */
  .status-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 12px;border-radius:999px;
    font-size:13px;font-weight:700;
    background:rgba(255,255,255,.2);
    color:#fff;
  }
  .status-pill .dot{width:8px;height:8px;border-radius:50%;background:#ff4d4f;animation:blink 1.4s infinite;}
  .status-pill.online .dot{background:#52c41a;animation:none;}
  @keyframes blink{50%{opacity:.3;}}

  /* ===== 主体容器 ===== */
  .app{
    max-width:var(--maxw);
    margin:0 auto;
    padding:20px 16px 110px;
    min-height:calc(100vh - 64px);
  }

  /* ===== 底栏 ===== */
  .footbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:linear-gradient(180deg,rgba(255,248,231,0) 0%,#fff8e7 30%);
    padding:24px 16px 14px;
    text-align:center;
    pointer-events:none;
  }
  .footbar span{
    display:inline-block;
    padding:8px 22px;border-radius:999px;
    background:var(--primary-dark);
    color:#fff;font-weight:800;letter-spacing:3px;
    font-size:calc(var(--font-base) - 2px);
    box-shadow:var(--shadow-md);
    pointer-events:auto;
  }

  /* ===== 首页 Hero ===== */
  .hero{
    text-align:center;
    padding:28px 16px 16px;
    animation:fadeUp .6s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  .hero .badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 16px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);
    border:2px solid var(--accent);
    font-weight:700;font-size:14px;
    margin-bottom:14px;
  }
  .hero h1{
    margin:0 0 10px;
    font-size:calc(var(--font-large) + 22px);
    font-weight:900;
    color:var(--primary);
    letter-spacing:2px;
    text-shadow:0 2px 0 rgba(212,56,13,.12);
  }
  .hero .sub{
    font-size:var(--font-large);
    color:var(--accent);
    font-weight:700;
    margin-bottom:6px;
  }
  .hero .desc{
    color:var(--text-2);
    font-size:var(--font-base);
    max-width:560px;margin:0 auto 8px;
  }
  .hero .stat-row{
    display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
    margin-top:18px;
  }
  .hero .stat{
    background:var(--bg-card);
    border-radius:var(--radius);
    padding:12px 18px;
    box-shadow:var(--shadow-sm);
    border:2px solid var(--border);
    min-width:110px;
  }
  .hero .stat .num{font-size:calc(var(--font-large) + 6px);font-weight:900;color:var(--primary);}
  .hero .stat .lbl{font-size:13px;color:var(--text-mute);font-weight:600;}

  /* ===== 区块标题 ===== */
  .section-title{
    display:flex;align-items:center;gap:10px;
    margin:30px 4px 16px;
    font-size:var(--font-large);font-weight:900;color:var(--text);
  }
  .section-title::before{
    content:"";width:6px;height:26px;border-radius:3px;background:var(--primary);
  }
  .section-title .tip{font-size:14px;color:var(--text-mute);font-weight:600;margin-left:auto;}

  /* ===== 场景卡片 ===== */
  .scenario-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  @media(max-width:560px){.scenario-grid{grid-template-columns:1fr;}}
  .scenario-card{
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    padding:22px 18px;
    box-shadow:var(--shadow-md);
    border:3px solid transparent;
    cursor:pointer;
    transition:.25s;
    position:relative;
    overflow:hidden;
    text-align:left;
    display:flex;flex-direction:column;gap:10px;
  }
  .scenario-card::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(135deg,transparent 60%,rgba(212,56,13,.06) 100%);
    pointer-events:none;
  }
  .scenario-card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-lg);
    border-color:var(--primary);
  }
  .scenario-card .icon{
    font-size:48px;line-height:1;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));
  }
  .scenario-card .name{
    font-size:var(--font-large);font-weight:900;color:var(--text);
  }
  .scenario-card .risk{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 10px;border-radius:999px;
    font-size:13px;font-weight:800;
    align-self:flex-start;
  }
  .risk-高{background:var(--primary-soft);color:var(--primary-dark);}
  .risk-中{background:var(--warn-soft);color:var(--warn);}
  .risk-低{background:var(--secondary-soft);color:var(--secondary-dark);}
  .scenario-card .preview{
    color:var(--text-2);font-size:15px;
    border-left:3px solid var(--primary);
    padding:4px 0 4px 10px;
    background:rgba(212,56,13,.04);
    border-radius:0 8px 8px 0;
  }
  .scenario-card .start{
    margin-top:4px;
    color:var(--primary);font-weight:800;
    display:flex;align-items:center;gap:6px;
  }

  /* ===== 功能入口横排 ===== */
  .quick-row{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;
  }
  @media(max-width:560px){.quick-row{grid-template-columns:1fr;}}
  .quick-card{
    background:var(--bg-card);
    border:2px solid var(--border);
    border-radius:var(--radius);
    padding:16px 12px;
    text-align:center;
    cursor:pointer;transition:.2s;
    box-shadow:var(--shadow-sm);
  }
  .quick-card:hover{border-color:var(--secondary);transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .quick-card .qi{font-size:32px;}
  .quick-card .qt{font-weight:800;margin-top:4px;color:var(--text);}
  .quick-card .qd{font-size:13px;color:var(--text-mute);}

  /* ===== 大字开关 ===== */
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-card);border:2px solid var(--border);
    border-radius:var(--radius);padding:14px 18px;margin-top:14px;
    box-shadow:var(--shadow-sm);
  }
  .toggle-row .label{font-weight:800;display:flex;align-items:center;gap:10px;}
  .switch{
    position:relative;width:64px;height:34px;border-radius:999px;
    background:#ccc;transition:.25s;cursor:pointer;flex-shrink:0;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;
    width:28px;height:28px;border-radius:50%;background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.25s;
  }
  .switch.on{background:var(--accent);}
  .switch.on::after{left:33px;}

  /* ===== 对话页 ===== */
  .chat-header{
    background:var(--bg-card);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow-sm);
    border:2px solid var(--border);
    display:flex;align-items:center;gap:12px;
    margin-bottom:12px;
  }
  .chat-header .back{
    width:44px;height:44px;border-radius:12px;
    background:var(--primary-soft);color:var(--primary);
    font-size:22px;display:flex;align-items:center;justify-content:center;
    font-weight:900;flex-shrink:0;
  }
  .chat-header .info{flex:1;min-width:0;}
  .chat-header .info .t{font-weight:900;font-size:var(--font-large);display:flex;align-items:center;gap:8px;}
  .chat-header .info .d{font-size:13px;color:var(--text-mute);}
  .chat-header .timer{
    background:var(--primary);color:#fff;
    padding:6px 12px;border-radius:999px;
    font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;
  }

  .chat-box{
    background:var(--bg-card);
    border-radius:var(--radius);
    border:2px solid var(--border);
    padding:16px 14px;
    min-height:300px;
    max-height:calc(100vh - 360px);
    overflow-y:auto;
    box-shadow:var(--shadow-sm);
    scroll-behavior:smooth;
  }
  .chat-box::-webkit-scrollbar{width:8px;}
  .chat-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .msg{
    display:flex;gap:10px;margin-bottom:14px;
    animation:msgIn .35s ease;
  }
  @keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .msg .avatar{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;
    box-shadow:var(--shadow-sm);
  }
  .msg.scammer .avatar{background:var(--primary);color:#fff;}
  .msg.user .avatar{background:var(--secondary);color:#fff;}
  .msg.ai-analysis .avatar{background:var(--accent);color:#fff;}
  .msg.system .avatar{background:var(--text-mute);color:#fff;}
  .msg .bubble-wrap{max-width:78%;min-width:0;}
  .msg .bubble{
    padding:14px 16px;border-radius:18px;
    font-size:var(--font-base);
    line-height:1.7;
    word-break:break-word;
    position:relative;
  }
  .msg.scammer .bubble{
    background:var(--primary-soft);
    border:2px solid var(--primary);
    color:var(--text);
    border-top-left-radius:4px;
  }
  .msg.user .bubble{
    background:var(--secondary);
    color:#fff;
    border-top-right-radius:4px;
  }
  .msg.ai-analysis .bubble{
    background:var(--accent-soft);
    border:2px solid var(--accent);
    border-top-left-radius:4px;
  }
  .msg.system .bubble{
    background:#f5f0e0;border:2px dashed var(--border);color:var(--text-2);
    font-style:italic;
  }
  .msg .role-tag{
    font-size:12px;font-weight:800;margin-bottom:4px;
    display:flex;align-items:center;gap:6px;
  }
  .msg.scammer .role-tag{color:var(--primary-dark);}
  .msg.user .role-tag{color:var(--secondary-dark);justify-content:flex-end;}
  .msg.ai-analysis .role-tag{color:var(--accent);}
  .msg .speak-btn{
    position:absolute;top:8px;right:8px;
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;opacity:0;transition:.2s;
  }
  .msg .bubble:hover .speak-btn{opacity:1;}
  .msg .speak-btn.speaking{opacity:1;background:var(--accent);color:#fff;}

  /* 打字中 */
  .typing{display:inline-flex;gap:4px;padding:4px 0;}
  .typing span{
    width:8px;height:8px;border-radius:50%;background:var(--primary);
    animation:typing 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-6px);opacity:1;}}

  /* ===== 操作栏 ===== */
  .chat-input{
    margin-top:12px;
    background:var(--bg-card);
    border-radius:var(--radius);
    border:2px solid var(--border);
    padding:12px;
    box-shadow:var(--shadow-sm);
  }
  .chat-input textarea{
    width:100%;border:none;outline:none;resize:none;
    font-size:var(--font-base);
    min-height:60px;padding:8px 6px;
    background:transparent;
  }
  .quick-replies{
    display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;
  }
  .qr-btn{
    padding:8px 14px;border-radius:999px;
    background:var(--secondary-soft);color:var(--secondary-dark);
    border:2px solid var(--secondary);
    font-weight:700;font-size:15px;
    transition:.2s;
  }
  .qr-btn:hover{background:var(--secondary);color:#fff;}
  .chat-actions{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;
  }
  .btn{
    padding:14px 16px;border-radius:18px;
    font-size:var(--font-base);font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:.2s;min-height:56px;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:linear-gradient(180deg,#ff4d4f 0%,#d4380d 100%);color:#fff;box-shadow:0 4px 0 var(--primary-dark),var(--shadow-md);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:active{box-shadow:0 1px 0 var(--primary-dark);transform:translateY(3px);}
  .btn-secondary{background:linear-gradient(180deg,#4096ff 0%,#1677ff 100%);color:#fff;box-shadow:0 4px 0 var(--secondary-dark),var(--shadow-md);}
  .btn-secondary:active{box-shadow:0 1px 0 var(--secondary-dark);transform:translateY(3px);}
  .btn-ghost{background:var(--bg-card);color:var(--text);border:2px solid var(--border);}
  .btn-ghost:hover{border-color:var(--secondary);color:var(--secondary-dark);}
  .btn-accent{background:linear-gradient(180deg,#52c41a 0%,#389e0d 100%);color:#fff;box-shadow:0 4px 0 #237804,var(--shadow-md);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .reveal-banner{
    background:linear-gradient(135deg,#fff1f0 0%,#fff7e6 100%);
    border:3px solid var(--primary);
    border-radius:var(--radius);
    padding:16px;margin:12px 0;
    text-align:center;
    animation:fadeUp .4s ease;
  }
  .reveal-banner .big{font-size:calc(var(--font-large) + 4px);font-weight:900;color:var(--primary);}
  .reveal-banner .small{color:var(--text-2);margin-top:4px;}

  /* ===== 复盘页 ===== */
  .score-card{
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    padding:24px 18px;
    box-shadow:var(--shadow-md);
    border:3px solid var(--primary);
    text-align:center;
    margin-bottom:16px;
  }
  .score-ring{
    width:160px;height:160px;margin:0 auto 12px;
    position:relative;
  }
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .num{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .score-ring .num .v{font-size:48px;font-weight:900;color:var(--primary);line-height:1;}
  .score-ring .num .g{font-size:16px;color:var(--text-2);font-weight:700;margin-top:4px;}
  .score-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;
  }
  .score-cell{
    background:var(--bg);border-radius:14px;padding:12px 8px;
    border:2px solid var(--border);
  }
  .score-cell .n{font-size:var(--font-large);font-weight:900;color:var(--secondary-dark);}
  .score-cell .l{font-size:13px;color:var(--text-mute);font-weight:600;}

  .analysis-card{
    background:var(--bg-card);
    border-radius:var(--radius);
    border:2px solid var(--border);
    padding:18px 16px;
    box-shadow:var(--shadow-sm);
    margin-bottom:14px;
  }
  .analysis-card h3{
    margin:0 0 12px;font-size:var(--font-large);font-weight:900;
    display:flex;align-items:center;gap:8px;
    color:var(--text);
  }
  .analysis-card h3::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--primary);}
  .trick-item{
    padding:14px;margin:10px 0;
    background:var(--bg);border-radius:14px;
    border-left:5px solid var(--primary);
  }
  .trick-item .step{font-weight:800;color:var(--primary-dark);margin-bottom:4px;display:flex;gap:8px;align-items:center;}
  .trick-item .step .idx{
    width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
  }
  .trick-item .flaw{color:var(--text);margin:6px 0;padding:6px 10px;background:var(--primary-soft);border-radius:8px;font-weight:600;}
  .trick-item .advice{color:var(--accent);font-weight:700;margin-top:6px;display:flex;gap:6px;align-items:flex-start;}
  .redflag-list .rf{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px;margin:6px 0;border-radius:12px;
    background:var(--primary-soft);
  }
  .redflag-list .rf .ic{color:var(--primary);font-weight:900;flex-shrink:0;}

  .next-actions{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;
  }

  /* ===== 词典页 ===== */
  .search-box{

/* ===== Ollama 客户端 ===== */
const OLLAMA_URL = 'http://localhost:11434/api/chat';
const OLLAMA_MODEL = 'qwen3:8b';

async function probeOllama(){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(),2500);
    const r = await fetch('http://localhost:11434/api/tags',{signal:ctrl.signal});
    clearTimeout(t);
    if(r.ok){State.ollamaOnline=true;return true;}
  }catch(e){}
  State.ollamaOnline=false;
  return false;
}

async function ollamaChat(messages, onToken){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(),30000);
  try{
    const r = await fetch(OLLAMA_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:OLLAMA_MODEL,messages,stream:true,options:{temperature:0.85,top_p:0.9}}),
      signal:ctrl.signal,
    });
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf='',full='';
    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const ln of lines){
        if(!ln.trim()) continue;
        try{
          const obj = JSON.parse(ln);
          if(obj.message && obj.message.content){
            full += obj.message.content;
            onToken && onToken(obj.message.content, full);
          }
        }catch(e){}
      }
    }
    return full;
  }catch(e){
    clearTimeout(t);
    throw e;
  }
}

/* ===== 降级对话引擎 ===== */
function detectIntent(text){
  if(!text) return 'neutral';
  if(/转账|卡号|验证码|密码|账号|配合|好的|行|可以|多少钱|转过去/.test(text)) return '顺从';
  if(/报警|警察|核实|110|儿子|女儿|家人|当面|派出所|不信|骗子|诈骗|这是骗局/.test(text)) return '怀疑';
  if(/不|拒绝|不要|挂|滚|别打|停|再见/.test(text)) return '拒绝';
  return 'neutral';
}

/* ===== TTS ===== */
const TTS = {
  synth: window.speechSynthesis,
  voice:null,
  speaking:false,
  curBtn:null,
  init(){
    if(!this.synth) return;
    const pick = ()=>{
      const vs = this.synth.getVoices();
      this.voice = vs.find(v=>/^zh/i.test(v.lang)) || vs.find(v=>/chinese/i.test(v.name)) || null;
    };
    pick();
    if(typeof speechSynthesis.onvoiceschanged !== 'undefined'){
      this.synth.onvoiceschanged = pick;
    }
  },
  speak(text, btn){
    if(!this.synth) {toast('浏览器不支持语音朗读');return;}
    this.stop();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.92; u.pitch = 1; u.volume = 1;
    if(this.voice) u.voice = this.voice;
    u.onend = ()=>{this.speaking=false; if(this.curBtn){this.curBtn.classList.remove('speaking');this.curBtn.innerHTML='🔊';this.curBtn=null;}};
    u.onerror = ()=>{this.speaking=false; if(this.curBtn){this.curBtn.classList.remove('speaking');this.curBtn.innerHTML='🔊';this.curBtn=null;}};
    this.speaking=true;
    if(btn){this.curBtn=btn;btn.classList.add('speaking');btn.innerHTML='⏸️';}
    this.synth.speak(u);
  },
  stop(){
    if(this.synth && this.synth.speaking){this.synth.cancel();}
    this.speaking=false;
    if(this.curBtn){this.curBtn.classList.remove('speaking');this.curBtn.innerHTML='🔊';this.curBtn=null;}
  }
};

/* ===== 评分 ===== */
function calcScore(){
  const rounds = State.history.filter(m=>m.role==='scammer').length;
  let speed;
  if(rounds<=3) speed=100;
  else if(rounds<=6) speed=80;
  else if(rounds<=10) speed=60;
  else speed=40;

  const avoided = !State.userComplied;
  const avoidScore = avoided?100:30;
  const flagScore = Math.min(100, State.userSuspected*40 + State.redFlagsFound*15);
  const total = Math.round(speed*0.5 + avoidScore*0.3 + flagScore*0.2);
  let grade = '需加强';
  if(total>=85) grade='优秀 🏆';
  else if(total>=65) grade='良好 👍';
  return {speed,avoided,avoidScore,redFlagsFound:State.redFlagsFound,total,grade,rounds};
}

  },1000);
}

function renderMessages(){
  const box = $('#chatBox');
  if(!box) return;
  box.innerHTML='';
  State.history.forEach(m=>{
    box.appendChild(buildMsg(m));
  });
  box.scrollTop = box.scrollHeight;
}

function buildMsg(m){
  const div = el('div','msg '+m.role);
  const avatars = {scammer:'🎭',user:'🧓','ai-analysis':'🔍',system:'📞'};
  const tags = {scammer:'骗子话术',user:'您','ai-analysis':'防骗分析',system:'系统'};
  const inner = `
    <div class="avatar">${avatars[m.role]||'💬'}</div>
    <div class="bubble-wrap">
      <div class="role-tag">${tags[m.role]||''}</div>
      <div class="bubble">${escapeHtml(m.text)}${m.role==='scammer'||m.role==='ai-analysis'?`<button class="speak-btn" title="朗读">🔊</button>`:''}</div>
    </div>
  `;
  div.innerHTML = inner;
  if(m.role==='scammer' || m.role==='ai-analysis'){
    const btn = div.querySelector('.speak-btn');
    btn.onclick = (e)=>{e.stopPropagation();TTS.speak(m.text,btn);};
  }
  return div;
}

function appendMsg(m){
  State.history.push(m);
  const box = $('#chatBox');
  if(box){
    box.appendChild(buildMsg(m));
    box.scrollTop = box.scrollHeight;
  }
}

function setTyping(on){
  const box = $('#chatBox');
  if(!box) return;
  const ex = $('#typingIndicator');
  if(on && !ex){
    const div = el('div','msg scammer');
    div.id='typingIndicator';
    div.innerHTML = `<div class="avatar">🎭</div><div class="bubble-wrap"><div class="role-tag">骗子话术</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  } else if(!on && ex){
    ex.remove();
  }
}

async function sendScammerOpening(){
  if(State.chatBusy) return;
  State.chatBusy=true;
  setTyping(true);
  let text;
  if(State.ollamaOnline){
    try{
      const sc = SCENARIOS[State.scenarioId];
      const messages = [
        {role:'system',content:sc.systemPrompt + '\n\n现在请开始第一句话，直接打电话给老人，进入角色。'},
      ];
      let acc='';
      text = await ollamaChat(messages, (delta,full)=>{
        acc = full;
        const ex = $('#typingIndicator .bubble');
        if(ex) ex.textContent = full;
        const box = $('#chatBox'); if(box) box.scrollTop = box.scrollHeight;
      });
      text = text || fallbackReply(State.scenarioId, 0);
    }catch(e){
      text = fallbackReply(State.scenarioId, 0);
      toast('Ollama 不可用，已切换预设剧本');
    }
  } else {
    await new Promise(r=>setTimeout(r,800));
    text = fallbackReply(State.scenarioId, 0);
  }
  setTyping(false);
  appendMsg({role:'scammer',text});
  State.chatBusy=false;
}

async function sendUserMessage(){
  if(State.chatBusy || State.revealed) return;
  const inp = $('#msgInput');
  const text = inp.value.trim();
  if(!text) return;
  inp.value='';
  appendMsg({role:'user',text});

  // 分析用户意图
  const intent = detectIntent(text);
  if(intent==='怀疑') {State.userSuspected++; checkRedFlagsFound(text);}
  if(intent==='顺从' && /卡号|转账|验证码|密码|账号/.test(text)) {State.userComplied=true;}

  // AI 回复
  State.chatBusy=true;
  $('#sendBtn').disabled=true;
  setTyping(true);
  let reply;
  const round = State.history.filter(m=>m.role==='scammer').length;
  if(State.ollamaOnline){
    try{
      const sc = SCENARIOS[State.scenarioId];
      const messages = [{role:'system',content:sc.systemPrompt}];
      State.history.filter(m=>m.role==='scammer'||m.role==='user').forEach(m=>{
        messages.push({role: m.role==='scammer'?'assistant':'user', content:m.text});
      });
      // 若用户已顺从（要转账），加强下一步诱导
      if(State.userComplied){
        messages.push({role:'system',content:'老人已经上钩准备配合，加大力度诱导其完成转账，但保持 1 个明显破绽。'});
      }
      let acc='';
      reply = await ollamaChat(messages, (delta,full)=>{
        acc = full;
        const ex = $('#typingIndicator .bubble');
        if(ex) ex.textContent = full;
        const box = $('#chatBox'); if(box) box.scrollTop = box.scrollHeight;
      });
      reply = reply || fallbackReply(State.scenarioId, round, text);
    }catch(e){
      reply = fallbackReply(State.scenarioId, round, text);
      toast('Ollama 不可用，已切换预设剧本');
    }
  } else {
    await new Promise(r=>setTimeout(r,900+Math.random()*600));
    reply = fallbackReply(State.scenarioId, round, text);
  }
  setTyping(false);
  appendMsg({role:'scammer',text:reply});
  State.chatBusy=false;
  const sb = $('#sendBtn'); if(sb) sb.disabled=false;
}

function checkRedFlagsFound(userText){
  const sc = SCENARIOS[State.scenarioId];
  const round = State.history.filter(m=>m.role==='scammer').length;
  // 简单：用户回复提到"安全账户""转账""个人账户""微信"等关键词 + 怀疑，则计为发现破绽
  if(/安全账户|个人账户|微信.*转账|不开发票|点链接|停药|主治医生.*账户|不让.*核实|保密|加微信/.test(userText)){
    State.redFlagsFound++;
  }
}

async function onReveal(){
  if(State.revealed) return;
  State.revealed=true;
  TTS.stop();
  if(chatTimer) clearInterval(chatTimer);

  appendMsg({role:'user',text:'🚨 这是骗局！我要识破你！'});

  // AI 切换分析角色
  const sc = SCENARIOS[State.scenarioId];
  State.chatBusy=true;
  setTyping(true);

  let analysisText = '';
  if(State.ollamaOnline){
    try{
      const analysisPrompt = `你现在是反诈分析专家。老人刚刚识破了一起"${sc.name}"诈骗。请基于以下对话历史，做一段简短客观的复盘（200字以内）：
1. 确认这确实是骗局
2. 指出骗子话术中 2-3 个最明显的破绽
3. 给老人一句话鼓励

对话历史：
${State.history.filter(m=>m.role==='scammer'||m.role==='user').map(m=>(m.role==='scammer'?'骗子':(m.role==='user'?'老人':''))+': '+m.text).join('\n')}

要求：客观、简短、口语化，不要列编号，直接像专家对老人说话。`;
      let acc='';
      analysisText = await ollamaChat([{role:'system',content:analysisPrompt}], (delta,full)=>{
        acc=full;
        const ex = $('#typingIndicator .bubble');
        if(ex) ex.textContent = full;
      });
    }catch(e){
      analysisText = '';
    }
  }
  if(!analysisText){
    await new Promise(r=>setTimeout(r,600));
    const foundFlags = sc.redFlags.slice(0,3).map(f=>'• '+f.text).join(' ');
    analysisText = `确实是骗局！这是一起典型的"${sc.name}"诈骗。最明显的破绽：${foundFlags}。老人家您识破得好，记住：凡是电话里要钱、要卡号、要保密的，一律先挂断核实！`;
  }
  setTyping(false);
  appendMsg({role:'ai-analysis',text:analysisText});

  // 显示评分横幅
  const score = calcScore();
  State.lastScore = score;
  const banner = el('div','reveal-banner');
  banner.innerHTML = `
    <div class="big">✅ 已识破骗局</div>
    <div class="small">综合评分：${score.total} 分 · ${score.grade}</div>
  `;
  $('#chatBox').appendChild(banner);
  $('#chatBox').scrollTop = $('#chatBox').scrollHeight;

  // 操作按钮区
  const next = el('div','chat-actions');
  next.innerHTML = `
    <button class="btn btn-accent" id="toReviewBtn">📊 查看详细复盘</button>
    <button class="btn btn-secondary" id="retryBtn">🔄 再练一次</button>
  `;
  $('#chatBox').appendChild(next);
  $('#toReviewBtn').onclick = ()=>go('/review/'+State.scenarioId);
  $('#retryBtn').onclick = ()=>{
    State.history=[];
    go('/chat/'+State.scenarioId);
  };

  State.chatBusy=false;
  $('#sendBtn').disabled=true;
  $('#revealBtn').disabled=true;
}

/* ===== 渲染：复盘页 ===== */
function renderReview(scenarioId){
  if(!State.lastScore){go('/chat/'+scenarioId);return;}
  const sc = SCENARIOS[scenarioId];
  const s = State.lastScore;
  State.view='review';
  const app = $('#app');
  app.innerHTML='';

  const circ = 2*Math.PI*70;
  const offset = circ * (1 - s.total/100);
  const card = el('div','score-card');
  card.innerHTML = `
    <h2 style="margin:0 0 8px;color:var(--primary);">📊 防骗演练评分</h2>
    <div style="color:var(--text-2);margin-bottom:8px;">场景：${sc.icon} ${sc.name}</div>
    <div class="score-ring">
      <svg width="160" height="160">
        <circle cx="80" cy="80" r="70" stroke="#ffe4cf" stroke-width="14" fill="none"/>
        <circle cx="80" cy="80" r="70" stroke="url(#g)" stroke-width="14" fill="none"
          stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringCircle"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff7a45"/>
            <stop offset="100%" stop-color="#d4380d"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="num"><div class="v">${s.total}</div><div class="g">${s.grade}</div></div>
    </div>
    <div class="score-grid">
      <div class="score-cell"><div class="n">${s.speed}</div><div class="l">识别速度分</div></div>
      <div class="score-cell"><div class="n">${s.avoided?'✅':'❌'}</div><div class="l">${s.avoided?'未被骗':'已被骗'}</div></div>
      <div class="score-cell"><div class="n">${s.redFlagsFound}</div><div class="l">发现破绽数</div></div>
    </div>
    <div style="margin-top:12px;color:var(--text-2);font-size:15px;">
      ${s.avoided ? '🎉 您成功识破骗局，守住了钱袋子！' : '⚠️ 您中途有泄露敏感信息，要更加警惕！'}
      共对话 ${s.rounds} 轮识破。
    </div>
  `;
  app.appendChild(card);

  // 动画
  setTimeout(()=>{
    const c = $('#ringCircle');
    if(c){c.style.transition='stroke-dashoffset 1.2s ease';c.style.strokeDashoffset=offset;}
  },100);

  // 套路拆解
  const an = el('div','analysis-card');
  an.innerHTML = `<h3>🎭 骗术套路拆解</h3>`;
  sc.tricks.forEach((t,i)=>{
    const it = el('div','trick-item');
    it.innerHTML = `
      <div class="step"><span class="idx">${i+1}</span>${escapeHtml(t.step)}</div>
      <div class="flaw">⚠️ 破绽：${escapeHtml(t.flaw)}</div>
      <div class="advice">✅ 应对：${escapeHtml(t.advice)}</div>
    `;
    an.appendChild(it);
  });
  app.appendChild(an);

  // 破绽清单
  const rf = el('div','analysis-card');
  rf.innerHTML = `<h3>🔍 本场景所有破绽</h3><div class="redflag-list"></div>`;
  const rfList = rf.querySelector('.redflag-list');
  sc.redFlags.forEach(f=>{
    const d = el('div','rf');
    d.innerHTML = `<span class="ic">▶</span><div><b>第 ${f.round} 轮：</b>${escapeHtml(f.text)}</div>`;
    rfList.appendChild(d);
  });
  app.appendChild(rf);

  // 下一步
  const na = el('div','next-actions');
  na.innerHTML = `
    <button class="btn btn-primary" id="againBtn">🔄 再练一次</button>
    <button class="btn btn-secondary" id="otherBtn">🎲 换个场景</button>
    <button class="btn btn-accent" id="dictBtn">📚 查话术词典</button>
    <button class="btn btn-ghost" id="homeBtn2">🏠 返回首页</button>
  `;
  app.appendChild(na);
  $('#againBtn').onclick = ()=>{State.history=[];go('/chat/'+scenarioId);};
  $('#otherBtn').onclick = ()=>go('/');
  $('#dictBtn').onclick = ()=>go('/dictionary');
  $('#homeBtn2').onclick = ()=>go('/');
}

function renderDictionary(){
  State.view='dictionary';
  const app = $('#app');
  app.innerHTML='';

  const t = el('div','section-title','📚 话术词典 · 24+ 条破解');
  app.appendChild(t);

  const search = el('div','search-box');
  search.innerHTML = `
    <input id="dictSearch" placeholder="🔍 搜索话术关键词，如：安全账户、中奖、手术费……" value="${escapeHtml(State.dictQuery)}">
    <div class="cat-tabs" id="catTabs"></div>
  `;
  app.appendChild(search);

  const cats = ['全部','公检法','保健品','中奖','亲情','投资'];
  const tabs = $('#catTabs');
  cats.forEach(c=>{
    const b = el('button',(c===State.dictCat||(c==='全部'&&State.dictCat==='all'))?'active':'',c);
    b.onclick = ()=>{State.dictCat = (c==='全部'?'all':c); updateDictTabs(); renderDictList();};
    tabs.appendChild(b);
  });

  const list = el('div','dict-list');
  list.id='dictList';
  app.appendChild(list);
  renderDictList();

  const inp = $('#dictSearch');
  inp.addEventListener('input',()=>{
    State.dictQuery = inp.value.trim();
    renderDictList();
  });
}

function updateDictTabs(){
  const tabs = $('#catTabs');
  if(!tabs) return;
  const cats = ['全部','公检法','保健品','中奖','亲情','投资'];
  [...tabs.children].forEach((b,i)=>{
    const c = cats[i];
    b.classList.toggle('active', c===State.dictCat||(c==='全部'&&State.dictCat==='all'));
  });
}

function renderDictList(){
  const list = $('#dictList');
  if(!list) return;
  list.innerHTML='';
  const q = State.dictQuery.toLowerCase();
  const filtered = DICTIONARY.filter(d=>{
    const okCat = State.dictCat==='all' || d.cat===State.dictCat;
    const okQ = !q || d.scam.toLowerCase().includes(q) || d.fix.toLowerCase().includes(q) || d.cat.toLowerCase().includes(q);
    return okCat && okQ;
  });

  if(filtered.length===0){
    list.innerHTML = `<div class="dict-empty">😕 没找到相关话术<br>试试搜索"转账""中奖""保健品"</div>`;
    return;
  }

  filtered.forEach((d,i)=>{
    const card = el('div','dict-card');
    card.style.animationDelay = (i*0.04)+'s';
    card.innerHTML = `
      <span class="cat-tag cat-${d.cat}">${d.cat}</span>
      <div class="line scam-line">
        <span class="ic">🚨</span>
        <div class="tx"><b>骗子话术：</b>${escapeHtml(d.scam)}</div>
      </div>
      <div class="line fix-line">
        <span class="ic">✅</span>
        <div class="tx"><b>破解方法：</b>${escapeHtml(d.fix)}</div>
      </div>
      <button class="speak">🔊 朗读这条</button>
    `;
    card.querySelector('.speak').onclick = (e)=>{
      const btn = e.currentTarget;
      TTS.speak('骗子话术：'+d.scam+'。破解方法：'+d.fix, btn);
    };
    list.appendChild(card);
  });
}
