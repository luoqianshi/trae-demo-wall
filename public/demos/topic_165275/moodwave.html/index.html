<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>此刻电台 · MoodWave</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23FFE066'/%3E%3Cstop offset='1' stop-color='%23FF6F91'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 22V10l7 6-7 6z' fill='%231a0f1f'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>

      <!-- ========== 1. 启动 / 心情选择 ========== -->
      <section id="boot" class="screen boot">
        <div class="mark fade-in">MoodWave<span class="dot"></span></div>
        <div class="tag fade-in">此刻电台 · 把心情唱给你听</div>

        <div class="search-bar" id="bootSearch">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="搜索歌曲或心情..." />
          <button class="search-clear" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="mood-grid stagger" id="moodGrid"></div>
        <div class="boot-hint fade-in"><span class="arrow">↘</span> 选择此刻的心情，进入你的电台</div>
      </section>

      <!-- ========== 2. 情绪电台 ========== -->
      <section id="radio" class="screen radio">
        <canvas id="radioCanvas" class="stage-canvas"></canvas>
        <div class="screen-header">
          <div>
            <div class="screen-title" id="radioTitle">心情电台</div>
            <div class="screen-sub" id="radioSub">在每个情绪里，给你一首歌的容身之处</div>
          </div>
          <button class="icon-btn" id="backFromRadio" aria-label="返回">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>

        <div class="search-bar" id="radioSearch">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="搜索歌曲..." />
          <button class="search-clear" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="section-title">
          <h3>为你挑选</h3>
          <small>滑动查看更多</small>
        </div>
        <div class="mood-pill" id="radioMoodPill" style="margin: 0 24px 12px;">
          <span class="dot"></span>
          <span class="label">此刻的心情</span>
        </div>

        <div class="song-list" id="songList"></div>

        <div class="now-bar" id="nowBar">
          <div class="cover"></div>
          <div class="meta">
            <div class="t">未播放</div>
            <div class="s">轻触进入 K 歌</div>
          </div>
          <button class="play" id="playToggle" aria-label="播放">▶</button>
        </div>
      </section>

      <!-- ========== 3. K 歌伴唱 ========== -->
      <section id="karaoke" class="screen karaoke">
        <canvas id="karaokeCanvas" class="karaoke-bg"></canvas>
        <div class="screen-header">
          <button class="icon-btn" id="backFromKaraoke" aria-label="返回">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div style="text-align: right;">
            <div class="screen-title" id="kTitle" style="font-size: 18px;">歌曲</div>
            <div class="screen-sub" id="kSub">艺人</div>
          </div>
        </div>

        <div class="song-hero" id="kHero">
          <div class="label" id="kMood">· 此刻电台</div>
          <div class="artist">—</div>
          <div class="title">—</div>
        </div>

        <div class="mode-switch">
          <div class="pill"></div>
          <button class="opt on" data-mode="original">原唱</button>
          <button class="opt" data-mode="accomp">伴奏 · 想唱就唱</button>
        </div>

        <div class="lyrics">
          <div class="lyrics-track" id="lyricsTrack"></div>
        </div>

        <div class="progress"><div class="bar" id="progressBar"></div></div>
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>

        <div class="controls">
          <button class="k-side-btn" id="kSide1" aria-label="收藏" title="收藏">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="record-btn" id="recordBtn">●  录制翻唱</button>
          <button class="k-side-btn" id="kSide2" aria-label="循环" title="循环">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
      </section>

      <!-- ========== 4. 翻唱卡片 ========== -->
      <section id="card" class="screen card">
        <div class="screen-header">
          <button class="icon-btn" id="backFromCard" aria-label="返回">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div style="text-align: right;">
            <div class="screen-title" style="font-size: 18px;">我的翻唱</div>
            <div class="screen-sub">已生成氛围卡片</div>
          </div>
        </div>
        <div class="card-canvas-wrap">
          <canvas id="coverCanvas" width="720" height="1080"></canvas>
        </div>
        <div class="card-actions">
          <button class="btn" id="shareBtn">分享到微信</button>
          <button class="btn primary" id="downloadBtn">保存到相册</button>
        </div>
      </section>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script src="assets/moods.js"></script>
  <script src="assets/songs.js"></script>
  <script src="core/store.js"></script>
  <script src="core/audio.js"></script>
  <script src="core/recorder.js"></script>
  <script src="core/particles.js"></script>
  <script src="core/app.js"></script>
</body>
</html>
