<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PPT制作 - AI教务智能处理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .ppt-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .sidebar {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .main-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .template-card {
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .template-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .template-card.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .template-color {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin: 0 auto 10px;
        }

        .template-name {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .slide-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .slide-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slide-item:hover {
            background: #f8f9ff;
        }

        .slide-item.selected {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .slide-thumbnail {
            width: 40px;
            height: 22px;
            border-radius: 4px;
            background: #ddd;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .slide-item.selected .slide-thumbnail {
            background: rgba(255,255,255,0.3);
        }

        .slide-info {
            flex: 1;
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .slide-delete {
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 1rem;
            padding: 4px;
        }

        .slide-item:hover .slide-delete {
            opacity: 1;
        }

        .slide-item.selected .slide-delete {
            opacity: 1;
        }

        .add-slide-btn {
            width: 100%;
            padding: 12px;
            border: 2px dashed #667eea;
            border-radius: 10px;
            background: none;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .add-slide-btn:hover {
            background: #f8f9ff;
        }

        .slide-type-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .type-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .type-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .type-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .type-label {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .preview-wrapper {
            display: flex;
            justify-content: center;
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .ppt-slide-preview {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .ppt-slide-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ppt-slide-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .editable-area {
            cursor: text;
            outline: none;
            min-height: 30px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .editable-area:hover {
            background: rgba(102, 126, 234, 0.08);
        }

        .editable-area:focus {
            background: rgba(102, 126, 234, 0.12);
            box-shadow: inset 0 0 0 2px rgba(102, 126, 234, 0.3);
        }

        .preview-title-area {
            flex: 0 0 auto;
            text-align: center;
            margin-bottom: 20px;
        }

        .preview-title-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            line-height: 1.3;
        }

        .preview-subtitle-area {
            text-align: center;
            margin-top: 20px;
        }

        .preview-subtitle-text {
            font-size: 1.2rem;
            color: #764ba2;
            text-align: center;
        }

        .preview-body-area {
            flex: 1;
            overflow-y: auto;
        }

        .preview-body-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 4px solid #667eea;
        }

        .preview-body-content {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .preview-list-item {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            font-size: 1.1rem;
            color: #333;
            position: relative;
            padding-left: 30px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .preview-list-item::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .preview-list-item:first-child {
            font-weight: 600;
            color: #667eea;
        }

        .list-item-input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1.1rem;
            background: transparent;
            outline: none;
        }

        .list-item-input:focus {
            border-color: #667eea;
        }

        .list-add-btn {
            width: 100%;
            padding: 12px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            background: none;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .list-add-btn:hover {
            background: #f8f9ff;
        }

        .list-delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .list-delete-btn:hover {
            background: #ee5a5a;
        }

        .preview-chart-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 1.5rem;
        }

        .banner-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 8px;
            background: #28a745;
            z-index: 3;
        }

        .title-banner {
            top: 120px;
        }

        .section-banner {
            top: 85px;
        }

        .editor-panel {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }

        .panel-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .chart-config {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 0.95rem;
            min-height: 100px;
            resize: vertical;
            transition: all 0.3s;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .action-bar {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #fd7e14;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .slide-type-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        @media (max-width: 900px) {
            .ppt-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }

            .preview-title-text {
                font-size: 1.5rem;
            }

            .preview-body-title {
                font-size: 1.2rem;
            }

            .ppt-slide-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI智能PPT制作</h1>
            <p>选择模板，创建精美演示文稿</p>
        </div>

        <div class="nav">
            <button class="nav-btn" onclick="navigateTo('video')">视频转码</button>
            <button class="nav-btn" onclick="navigateTo('data')">数据清洗</button>
            <button class="nav-btn" onclick="navigateTo('match')">学生匹配</button>
            <button class="nav-btn active" onclick="navigateTo('ppt')">PPT制作</button>
        </div>

        <div class="ppt-container">
            <div class="sidebar">
                <div class="sidebar-title">📋 模板选择</div>
                <div id="templateList"></div>

                <div class="sidebar-title" style="margin-top: 20px;">📄 幻灯片列表</div>
                <div class="slide-list" id="slideList">
                    <div class="empty-state" style="padding: 20px;">
                        <div class="empty-icon" style="font-size: 2rem;">📭</div>
                        <div>暂无幻灯片</div>
                    </div>
                </div>
                <button class="add-slide-btn" onclick="showAddSlideModal()">+ 添加幻灯片</button>
            </div>

            <div class="main-content">
                <div id="editorArea">
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <h3>选择或添加幻灯片开始编辑</h3>
                        <p>从左侧列表选择一张幻灯片，或点击"添加幻灯片"按钮创建新幻灯片</p>
                    </div>
                </div>

                <div class="action-bar">
                    <button class="btn btn-success" onclick="generatePPT()" id="generateBtn" disabled>
                        📥 生成PPT
                    </button>
                    <button class="btn btn-secondary" onclick="clearAllSlides()">
                        🗑️ 清空全部
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="addSlideModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('addSlideModal')">&times;</span>
            <div class="modal-title">选择幻灯片类型</div>
            
            <div class="slide-type-selector">
                <button class="type-btn" onclick="selectSlideType('title')">
                    <div class="type-icon">📌</div>
                    <div class="type-label">标题页</div>
                </button>
                <button class="type-btn" onclick="selectSlideType('content')">
                    <div class="type-icon">📝</div>
                    <div class="type-label">内容页</div>
                </button>
                <button class="type-btn" onclick="selectSlideType('list')">
                    <div class="type-icon">📋</div>
                    <div class="type-label">列表页</div>
                </button>
                <button class="type-btn" onclick="selectSlideType('chart')">
                    <div class="type-icon">📊</div>
                    <div class="type-label">图表页</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        let slides = [];
        let selectedSlideIndex = -1;
        let selectedTemplate = 'education';
        let templates = [];
        let currentSlideType = 'content';

        const templateStyles = {
            education: {
                primaryColor: '#667eea',
                secondaryColor: '#764ba2',
                accentColor: '#28a745',
                bgColor: '#f8f9ff'
            },
            student: {
                primaryColor: '#ff6b6b',
                secondaryColor: '#ee5a24',
                accentColor: '#ffc107',
                bgColor: '#fff8f0'
            },
            business: {
                primaryColor: '#212529',
                secondaryColor: '#3c4252',
                accentColor: '#3498db',
                bgColor: '#ffffff'
            }
        };

        async function init() {
            await loadTemplates();
            renderTemplateList();
            updateGenerateButton();
        }

        async function loadTemplates() {
            try {
                const response = await fetch('/api/ppt/templates');
                const data = await response.json();
                if (data.success) {
                    templates = data.templates;
                }
            } catch (error) {
                templates = [
                    { id: 'education', name: '教育汇报模板' },
                    { id: 'student', name: '学生展示模板' },
                    { id: 'business', name: '数据报告模板' }
                ];
            }
        }

        function renderTemplateList() {
            const container = document.getElementById('templateList');
            container.innerHTML = templates.map(tpl => `
                <div class="template-card ${selectedTemplate === tpl.id ? 'selected' : ''}" 
                     onclick="selectTemplate('${tpl.id}')">
                    <div class="template-color" style="background: ${getTemplateColor(tpl.id)}"></div>
                    <div class="template-name">${tpl.name}</div>
                </div>
            `).join('');
        }

        function getTemplateColor(templateId) {
            const colors = {
                education: 'linear-gradient(135deg, #667eea, #764ba2)',
                student: 'linear-gradient(135deg, #ff6b6b, #ee5a24)',
                business: 'linear-gradient(135deg, #212529, #3c4252)'
            };
            return colors[templateId] || colors.education;
        }

        function getStyle(prop) {
            return templateStyles[selectedTemplate][prop];
        }

        function selectTemplate(templateId) {
            selectedTemplate = templateId;
            renderTemplateList();
            if (selectedSlideIndex >= 0) {
                renderEditor();
            }
        }

        function showAddSlideModal() {
            document.getElementById('addSlideModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function selectSlideType(type) {
            currentSlideType = type;
            closeModal('addSlideModal');
            addSlide(type);
        }

        function addSlide(type) {
            const newSlide = {
                type: type,
                title: '',
                subtitle: '',
                content: '',
                items: [],
                chart_type: 'bar',
                data: {},
                categories: []
            };

            slides.push(newSlide);
            selectedSlideIndex = slides.length - 1;
            renderSlideList();
            renderEditor();
            updateGenerateButton();
        }

        function renderSlideList() {
            const container = document.getElementById('slideList');
            
            if (slides.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 20px;">
                        <div class="empty-icon" style="font-size: 2rem;">📭</div>
                        <div>暂无幻灯片</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = slides.map((slide, index) => `
                <div class="slide-item ${selectedSlideIndex === index ? 'selected' : ''}" 
                     onclick="selectSlide(${index})">
                    <div class="slide-thumbnail">${index + 1}</div>
                    <div class="slide-info">${slide.title || getSlideTypeLabel(slide.type)}</div>
                    <div class="slide-delete" onclick="event.stopPropagation(); deleteSlide(${index})">✕</div>
                </div>
            `).join('');
        }

        function getSlideTypeLabel(type) {
            const labels = {
                title: '标题页',
                content: '内容页',
                list: '列表页',
                chart: '图表页',
                image: '图文页'
            };
            return labels[type] || '内容页';
        }

        function selectSlide(index) {
            selectedSlideIndex = index;
            renderSlideList();
            renderEditor();
        }

        function deleteSlide(index) {
            if (confirm('确定要删除这张幻灯片吗？')) {
                slides.splice(index, 1);
                if (selectedSlideIndex >= slides.length) {
                    selectedSlideIndex = slides.length - 1;
                }
                renderSlideList();
                renderEditor();
                updateGenerateButton();
            }
        }

        function clearAllSlides() {
            if (confirm('确定要清空所有幻灯片吗？此操作不可恢复。')) {
                slides = [];
                selectedSlideIndex = -1;
                renderSlideList();
                renderEditor();
                updateGenerateButton();
            }
        }

        function renderEditor() {
            const container = document.getElementById('editorArea');
            
            if (selectedSlideIndex < 0 || !slides[selectedSlideIndex]) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <h3>选择或添加幻灯片开始编辑</h3>
                        <p>从左侧列表选择一张幻灯片，或点击"添加幻灯片"按钮创建新幻灯片</p>
                    </div>
                `;
                return;
            }

            const slide = slides[selectedSlideIndex];
            const style = getStyle;
            
            let previewHtml = '';
            let panelHtml = '';
            
            switch (slide.type) {
                case 'title':
                    previewHtml = renderTitlePreview(slide, style);
                    break;
                case 'list':
                    previewHtml = renderListPreview(slide, style);
                    break;
                case 'chart':
                    previewHtml = renderChartPreview(slide, style);
                    panelHtml = renderChartPanel(slide);
                    break;
                default:
                    previewHtml = renderContentPreview(slide, style);
            }

            container.innerHTML = `
                <div style="margin-bottom: 15px;">
                    <span class="slide-type-badge">${getSlideTypeLabel(slide.type)} - 第 ${selectedSlideIndex + 1} 页</span>
                </div>
                <div class="preview-wrapper">
                    <div class="ppt-slide-preview">
                        <div class="ppt-slide-bg" style="background-color: ${style('bgColor')}"></div>
                        ${slide.type === 'title' ? `<div class="banner-bar title-banner" style="background-color: ${style('accentColor')}"></div>` : ''}
                        ${slide.type !== 'title' && slide.type !== 'chart' ? `<div class="banner-bar section-banner" style="background-color: ${style('accentColor')}"></div>` : ''}
                        <div class="ppt-slide-content">
                            ${previewHtml}
                        </div>
                    </div>
                </div>
                ${panelHtml}
            `;
        }

        function renderTitlePreview(slide, style) {
            return `
                <div class="preview-title-area">
                    <div class="editable-area preview-title-text" 
                         contenteditable="true"
                         style="color: ${style('primaryColor')}"
                         onblur="updateSlide('title', this.innerText)">
                        ${slide.title || '点击编辑主标题'}
                    </div>
                </div>
                <div class="preview-subtitle-area">
                    <div class="editable-area preview-subtitle-text"
                         contenteditable="true"
                         style="color: ${style('secondaryColor')}"
                         onblur="updateSlide('subtitle', this.innerText)">
                        ${slide.subtitle || '点击编辑副标题'}
                    </div>
                </div>
            `;
        }

        function renderContentPreview(slide, style) {
            return `
                <div style="margin-bottom: 25px;">
                    <div class="editable-area preview-body-title"
                         contenteditable="true"
                         style="color: ${style('primaryColor')}; border-color: ${style('primaryColor')}"
                         onblur="updateSlide('title', this.innerText)">
                        ${slide.title || '点击编辑标题'}
                    </div>
                </div>
                <div class="preview-body-area">
                    <div class="editable-area preview-body-content"
                         contenteditable="true"
                         onblur="updateSlide('content', this.innerText)">
                        ${slide.content || '点击编辑正文内容...'}
                    </div>
                </div>
            `;
        }

        function renderListPreview(slide, style) {
            return `
                <div style="margin-bottom: 25px;">
                    <div class="editable-area preview-body-title"
                         contenteditable="true"
                         style="color: ${style('primaryColor')}; border-color: ${style('primaryColor')}"
                         onblur="updateSlide('title', this.innerText)">
                        ${slide.title || '点击编辑标题'}
                    </div>
                </div>
                <div class="preview-body-area">
                    ${slide.items.length > 0 ? slide.items.map((item, index) => `
                        <div class="preview-list-item">
                            <span style="color: ${style('primaryColor')}">•</span>
                            <input type="text" class="list-item-input" 
                                   value="${item}"
                                   style="color: ${index === 0 ? style('primaryColor') : '#333'}; font-weight: ${index === 0 ? '600' : 'normal'}"
                                   oninput="updateListItem(${index}, this.value)">
                            <button class="list-delete-btn" onclick="removeListItem(${index})">✕</button>
                        </div>
                    `).join('') : '<div style="color: #999; text-align: center; padding: 30px;">暂无列表项，点击下方按钮添加</div>'}
                    <button class="list-add-btn" onclick="addListItem()">+ 添加列表项</button>
                </div>
            `;
        }

        function renderChartPreview(slide, style) {
            return `
                <div style="margin-bottom: 25px;">
                    <div class="editable-area preview-body-title"
                         contenteditable="true"
                         style="color: ${style('primaryColor')}; border-color: ${style('primaryColor')}"
                         onblur="updateSlide('title', this.innerText)">
                        ${slide.title || '点击编辑标题'}
                    </div>
                </div>
                <div class="preview-chart-placeholder">
                    📊 图表预览（生成后可见）
                </div>
            `;
        }

        function renderChartPanel(slide) {
            return `
                <div class="editor-panel">
                    <div class="panel-title">⚙️ 图表配置</div>
                    <div class="chart-config">
                        <div class="form-group">
                            <label class="form-label">图表类型</label>
                            <select class="form-input" onchange="updateSlide('chart_type', this.value)">
                                <option value="bar" ${slide.chart_type === 'bar' ? 'selected' : ''}>柱状图</option>
                                <option value="pie" ${slide.chart_type === 'pie' ? 'selected' : ''}>饼图</option>
                                <option value="line" ${slide.chart_type === 'line' ? 'selected' : ''}>折线图</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">分类（逗号分隔）</label>
                            <input type="text" class="form-input" 
                                   value="${slide.categories.join(',')}" 
                                   placeholder="语文,数学,英语"
                                   oninput="updateCategories(this.value)">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">数据系列（JSON格式）</label>
                        <textarea class="form-textarea" 
                                  oninput="updateChartData(this.value)"
                                  placeholder='{"语文": [85, 90, 88], "数学": [92, 88, 95]}'>${JSON.stringify(slide.data, null, 2)}</textarea>
                    </div>
                </div>
            `;
        }

        function updateSlide(field, value) {
            if (selectedSlideIndex >= 0 && slides[selectedSlideIndex]) {
                slides[selectedSlideIndex][field] = value;
                renderSlideList();
                updateGenerateButton();
            }
        }

        function addListItem() {
            if (selectedSlideIndex >= 0 && slides[selectedSlideIndex]) {
                slides[selectedSlideIndex].items.push('');
                renderEditor();
            }
        }

        function updateListItem(index, value) {
            if (selectedSlideIndex >= 0 && slides[selectedSlideIndex]) {
                slides[selectedSlideIndex].items[index] = value;
                renderSlideList();
            }
        }

        function removeListItem(index) {
            if (selectedSlideIndex >= 0 && slides[selectedSlideIndex]) {
                slides[selectedSlideIndex].items.splice(index, 1);
                renderEditor();
            }
        }

        function updateCategories(value) {
            if (selectedSlideIndex >= 0 && slides[selectedSlideIndex]) {
                slides[selectedSlideIndex].categories = value.split(',').map(s => s.trim()).filter(s => s);
            }
        }

        function updateChartData(value) {
            if (selectedSlideIndex >= 0 && slides[selectedSlideIndex]) {
                try {
                    slides[selectedSlideIndex].data = JSON.parse(value);
                } catch (e) {
                    console.warn('Invalid JSON:', e);
                }
            }
        }

        function updateGenerateButton() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = slides.length === 0;
        }

        async function generatePPT() {
            if (slides.length === 0) return;

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ 生成中...';

            try {
                const response = await fetch('/api/ppt/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        template: selectedTemplate,
                        slides: slides
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('PPT生成成功！');
                    window.location.href = `/api/ppt/download/${result.filename}`;
                } else {
                    alert('生成失败: ' + (result.detail || '未知错误'));
                }
            } catch (error) {
                alert('生成失败: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '📥 生成PPT';
            }
        }

        function navigateTo(page) {
            window.location.href = `/${page}`;
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        init();
    </script>
</body>
</html>
