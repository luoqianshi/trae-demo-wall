<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>数据清洗 - AI教务智能处理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI智能数据清洗</h1>
            <p>自动识别Excel表头，清洗脏数据，标准化输出</p>
        </div>

        <div class="nav">
            <button class="nav-btn" onclick="navigateTo('video')">视频转码</button>
            <button class="nav-btn active" onclick="navigateTo('data')">数据清洗</button>
            <button class="nav-btn" onclick="navigateTo('match')">学生匹配</button>
            <button class="nav-btn" onclick="navigateTo('ppt')">PPT制作</button>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon" style="background: linear-gradient(135deg, #17a2b8, #6f42c1); color: white;">
                    📊
                </div>
                <div>
                    <h2 class="card-title">上传Excel文件</h2>
                </div>
            </div>
            
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽文件到此处</div>
                <div class="upload-hint">支持 .xlsx, .xls 格式</div>
            </div>
            <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls" multiple onchange="handleFileSelect(event)">
            
            <div class="file-list" id="fileList" style="display: none;">
                <h3 style="margin-bottom: 15px; color: #333;">已选择文件</h3>
                <div id="selectedFiles"></div>
            </div>
            
            <div style="margin-top: 20px;">
                <button class="btn" id="analyzeBtn" onclick="analyzeFiles()" disabled>分析文件</button>
                <button class="btn" id="cleanBtn" onclick="startClean()" disabled>开始清洗</button>
                <button class="btn btn-primary" id="cleanMergeBtn" onclick="startCleanAndMerge()" disabled>清洗并合并</button>
                <button class="btn btn-secondary" onclick="clearFiles()">清空文件</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon" style="background: linear-gradient(135deg, #ffc107, #fd7e14); color: white;">
                    🔍
                </div>
                <div>
                    <h2 class="card-title">分析结果</h2>
                </div>
            </div>
            
            <div id="analysisContainer" style="display: none;">
                <div id="analysisContent"></div>
            </div>
            <div id="noAnalysis" style="text-align: center; color: #999; padding: 40px;">
                点击"分析文件"查看数据结构分析
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon" style="background: linear-gradient(135deg, #28a745, #20c997); color: white;">
                    📥
                </div>
                <div>
                    <h2 class="card-title">处理结果</h2>
                </div>
            </div>
            
            <div class="results" id="resultsContainer">
                <div style="text-align: center; color: #999; padding: 40px;">
                    处理结果将显示在这里
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let analysisResults = {};

        function navigateTo(page) {
            window.location.href = `/${page}`;
        }

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                selectedFiles.push(file);
            });
            event.target.value = '';
            updateFileList();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const selectedFilesDiv = document.getElementById('selectedFiles');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const cleanBtn = document.getElementById('cleanBtn');
            const cleanMergeBtn = document.getElementById('cleanMergeBtn');
            
            if (selectedFiles.length > 0) {
                fileList.style.display = 'block';
                selectedFilesDiv.innerHTML = selectedFiles.map((file, index) => `
                    <div class="file-item">
                        <div class="file-info">
                            <span class="file-icon">📊</span>
                            <div>
                                <div class="file-name">${file.name}</div>
                                <div class="file-size">${formatFileSize(file.size)}</div>
                            </div>
                        </div>
                        <button class="btn btn-secondary" onclick="removeFile(${index})" style="padding: 6px 12px; font-size: 0.8rem;">删除</button>
                    </div>
                `).join('');
                analyzeBtn.disabled = false;
                cleanBtn.disabled = false;
                cleanMergeBtn.disabled = selectedFiles.length < 2;
            } else {
                fileList.style.display = 'none';
                analyzeBtn.disabled = true;
                cleanBtn.disabled = true;
                cleanMergeBtn.disabled = true;
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function clearFiles() {
            selectedFiles = [];
            analysisResults = {};
            updateFileList();
            document.getElementById('analysisContainer').style.display = 'none';
            document.getElementById('noAnalysis').style.display = 'block';
            document.getElementById('resultsContainer').innerHTML = `
                <div style="text-align: center; color: #999; padding: 40px;">处理结果将显示在这里</div>
            `;
            document.getElementById('cleanBtn').disabled = true;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        async function analyzeFiles() {
            const analyzeBtn = document.getElementById('analyzeBtn');
            const cleanBtn = document.getElementById('cleanBtn');
            const analysisContainer = document.getElementById('analysisContainer');
            const noAnalysis = document.getElementById('noAnalysis');
            const analysisContent = document.getElementById('analysisContent');
            
            analyzeBtn.disabled = true;
            analysisContainer.style.display = 'block';
            noAnalysis.style.display = 'none';
            analysisContent.innerHTML = '<div style="text-align: center; padding: 40px;">分析中...</div>';

            analysisResults = {};
            
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                
                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    const response = await fetch('/api/data/analyze', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    analysisResults[file.name] = result;
                } catch (error) {
                    analysisResults[file.name] = {
                        success: false,
                        error: error.message
                    };
                }
            }
            
            displayAnalysis();
            analyzeBtn.disabled = false;
            cleanBtn.disabled = false;
        }

        function displayAnalysis() {
            const analysisContent = document.getElementById('analysisContent');
            
            analysisContent.innerHTML = Object.keys(analysisResults).map(filename => {
                const result = analysisResults[filename];
                
                if (!result.success) {
                    return `
                        <div style="margin-bottom: 30px; padding: 20px; background: #f8f9ff; border-radius: 15px;">
                            <h3 style="color: #333; margin-bottom: 15px;">${filename}</h3>
                            <div style="color: #dc3545;">分析失败: ${result.error}</div>
                        </div>
                    `;
                }
                
                const fieldMatches = result.field_matches || [];
                const previewData = result.preview_data || [];
                
                return `
                    <div style="margin-bottom: 30px; padding: 20px; background: #f8f9ff; border-radius: 15px;">
                        <h3 style="color: #333; margin-bottom: 15px;">${filename}</h3>
                        
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-bottom: 20px;">
                            <div style="background: white; padding: 10px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: #667eea;">${result.dimensions.total_rows}</div>
                                <div style="font-size: 0.8rem; color: #999;">总行数</div>
                            </div>
                            <div style="background: white; padding: 10px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: #667eea;">${result.dimensions.columns}</div>
                                <div style="font-size: 0.8rem; color: #999;">列数</div>
                            </div>
                            <div style="background: white; padding: 10px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: #667eea;">${result.dimensions.data_rows}</div>
                                <div style="font-size: 0.8rem; color: #999;">数据行</div>
                            </div>
                        </div>
                        
                        <h4 style="color: #333; margin-bottom: 10px;">字段识别结果</h4>
                        <div style="overflow-x: auto; margin-bottom: 20px;">
                            <table class="data-table" style="font-size: 0.9rem;">
                                <thead>
                                    <tr>
                                        <th>原始字段</th>
                                        <th>匹配字段</th>
                                        <th>置信度</th>
                                        <th>状态</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${fieldMatches.map(match => `
                                        <tr>
                                            <td>${match.original_header}</td>
                                            <td>${match.matched_field === 'unknown' ? '未知' : match.matched_field}</td>
                                            <td>${match.confidence}%</td>
                                            <td>${match.is_primary ? '✅ 主字段' : '⬜ 辅助'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        
                        <h4 style="color: #333; margin-bottom: 10px;">数据预览 (前5行)</h4>
                        <div style="overflow-x: auto;">
                            <table class="data-table" style="font-size: 0.85rem;">
                                <thead>
                                    <tr>
                                        ${result.headers.map(h => `<th>${h}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${previewData.slice(0, 5).map(row => `
                                        <tr>
                                            ${Object.values(row).filter((_, i) => i > 0).map(cell => `<td>${cell !== undefined ? cell : ''}</td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function startClean() {
            const cleanBtn = document.getElementById('cleanBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            
            cleanBtn.disabled = true;
            resultsContainer.innerHTML = `<div style="text-align: center; color: #999; padding: 40px;">清洗中，请等待...</div>`;

            const results = [];
            
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                
                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    const response = await fetch('/api/data/clean', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        results.push({
                            success: true,
                            filename: file.name,
                            output_filename: result.output_filename,
                            original_rows: result.original_rows,
                            cleaned_rows: result.cleaned_rows,
                            removed_rows: result.removed_rows,
                            duplicate_count: result.duplicate_count || 0,
                            duplicate_details: result.duplicate_details || []
                        });
                    } else {
                        results.push({
                            success: false,
                            filename: file.name,
                            message: result.error || 'Clean failed'
                        });
                    }
                } catch (error) {
                    results.push({
                        success: false,
                        filename: file.name,
                        message: error.message
                    });
                }
            }
            
            displayResults(results);
            cleanBtn.disabled = false;
        }

        function displayResults(results) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            resultsContainer.innerHTML = results.map(result => {
                const className = result.success ? 'success' : 'error';
                const icon = result.success ? '✅' : '❌';
                
                if (result.success) {
                    let duplicateDetails = '';
                    if (result.duplicate_count > 0 && result.duplicate_details && result.duplicate_details.length > 0) {
                        duplicateDetails = `
                            <div style="margin-top: 15px; padding: 15px; background: #fff3cd; border-radius: 10px;">
                                <h4 style="color: #856404; margin-bottom: 10px; font-size: 1rem;">⚠️ 检测到 ${result.duplicate_count} 条完全重复行</h4>
                                <div style="max-height: 150px; overflow-y: auto;">
                                    ${result.duplicate_details.slice(0, 5).map((dup, idx) => {
                                        const rowData = Object.entries(dup).filter(([k]) => k !== 'row_index');
                                        return `
                                            <div style="padding: 8px; margin-bottom: 5px; background: #fff; border-radius: 5px; font-size: 0.85rem;">
                                                <div style="color: #333; font-weight: 600;">重复行 #${idx + 1} (第${dup.row_index + 2}行)</div>
                                                <div style="color: #666;">${rowData.map(([k, v]) => `${k}: ${v}`).join(' | ')}</div>
                                            </div>
                                        `;
                                    }).join('')}
                                    ${result.duplicate_details.length > 5 ? `<div style="color: #666; text-align: center; padding: 5px;">还有 ${result.duplicate_details.length - 5} 条...</div>` : ''}
                                </div>
                            </div>
                        `;
                    }
                    
                    return `
                        <div class="result-item ${className}">
                            <div class="result-title">${icon} ${result.filename}</div>
                            <div class="result-message">
                                原始: ${result.original_rows}行 | 清洗后: ${result.cleaned_rows}行 | 移除: ${result.removed_rows}行
                                ${result.duplicate_count > 0 ? `<br><strong>其中重复行: ${result.duplicate_count}条</strong>` : ''}
                            </div>
                            ${duplicateDetails}
                            <div style="margin-top: 10px;">
                                <button class="btn btn-secondary" onclick="downloadData('${result.output_filename}')" style="padding: 8px 20px; font-size: 0.9rem;">
                                    下载结果
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="result-item ${className}">
                            <div class="result-title">${icon} ${result.filename}</div>
                            <div class="result-message">错误: ${result.message}</div>
                        </div>
                    `;
                }
            }).join('');
        }

        function downloadData(filename) {
            window.location.href = `/api/data/download/${filename}`;
        }

        async function startCleanAndMerge() {
            const cleanMergeBtn = document.getElementById('cleanMergeBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            
            cleanMergeBtn.disabled = true;
            resultsContainer.innerHTML = `<div style="text-align: center; color: #999; padding: 40px;">清洗并合并中，请等待...</div>`;

            try {
                const formData = new FormData();
                selectedFiles.forEach(file => {
                    formData.append('files', file);
                });
                
                const response = await fetch('/api/data/clean_and_merge', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayCleanMergeResult(result);
                } else {
                    resultsContainer.innerHTML = `
                        <div class="result-item error">
                            <div class="result-title">❌ 清洗合并失败</div>
                            <div class="result-message">${result.error}</div>
                        </div>
                    `;
                }
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div class="result-item error">
                        <div class="result-title">❌ 请求失败</div>
                        <div class="result-message">${error.message}</div>
                    </div>
                `;
            }
            
            cleanMergeBtn.disabled = false;
        }

        function displayCleanMergeResult(result) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            let fileDetails = '';
            if (result.file_results && result.file_results.length > 0) {
                fileDetails = `
                    <div style="margin-top: 15px; padding: 15px; background: #e7f3ff; border-radius: 10px;">
                        <h4 style="color: #0c63e4; margin-bottom: 10px; font-size: 1rem;">📁 各文件处理详情</h4>
                        <div style="max-height: 200px; overflow-y: auto;">
                            ${result.file_results.map((fr, idx) => `
                                <div style="padding: 8px; margin-bottom: 5px; background: #fff; border-radius: 5px; font-size: 0.85rem;">
                                    <div style="color: #333; font-weight: 600;">${idx + 1}. ${fr.filename}</div>
                                    <div style="color: #666;">原始: ${fr.original_rows}行 | 清洗后: ${fr.cleaned_rows}行 | 移除: ${fr.removed_rows}行</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            resultsContainer.innerHTML = `
                <div class="result-item success">
                    <div class="result-title">✅ 清洗合并完成</div>
                    <div class="result-message">
                        <strong>文件数:</strong> ${result.total_files}个<br>
                        <strong>原始总行数:</strong> ${result.total_original_rows}行<br>
                        <strong>清洗后行数:</strong> ${result.total_cleaned_rows}行<br>
                        <strong>移除行数:</strong> ${result.total_removed_rows}行<br>
                        <strong>合并后学生数:</strong> ${result.merged_students}人<br>
                        ${result.removed_duplicates > 0 ? `<strong>移除重复行:</strong> ${result.removed_duplicates}条` : ''}
                    </div>
                    ${fileDetails}
                    <div style="margin-top: 15px;">
                        <button class="btn btn-secondary" onclick="downloadData('${result.output_filename}')" style="padding: 8px 20px; font-size: 0.9rem;">
                            下载合并结果
                        </button>
                    </div>
                </div>
            `;
        }

        document.getElementById('uploadArea').addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('dragover');
        });

        document.getElementById('uploadArea').addEventListener('dragleave', () => {
            document.getElementById('uploadArea').classList.remove('dragover');
        });

        document.getElementById('uploadArea').addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            files.forEach(file => {
                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    selectedFiles.push(file);
                }
            });
            updateFileList();
        });
    </script>
</body>
</html>
