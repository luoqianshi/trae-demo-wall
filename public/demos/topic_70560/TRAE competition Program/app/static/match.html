<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>学生匹配 - AI教务智能处理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>学生特征指纹匹配</h1>
            <p>基于班级+姓名生成特征指纹，精准匹配同名学生</p>
        </div>

        <div class="nav">
            <button class="nav-btn" onclick="navigateTo('video')">视频转码</button>
            <button class="nav-btn" onclick="navigateTo('data')">数据清洗</button>
            <button class="nav-btn active" onclick="navigateTo('match')">学生匹配</button>
            <button class="nav-btn" onclick="navigateTo('ppt')">PPT制作</button>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon" style="background: linear-gradient(135deg, #e84393, #fd79a8); color: white;">
                    👥
                </div>
                <div>
                    <h2 class="card-title">上传多学期Excel文件</h2>
                </div>
            </div>
            
            <p style="color: #666; margin-bottom: 20px;">
                请上传至少2个Excel文件（不同学期的成绩表），系统将自动识别同名学生并合并成绩记录。
            </p>
            
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽文件到此处</div>
                <div class="upload-hint">支持 .xlsx, .xls 格式，需上传至少2个文件</div>
            </div>
            <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls" multiple onchange="handleFileSelect(event)">
            
            <div class="file-list" id="fileList" style="display: none;">
                <h3 style="margin-bottom: 15px; color: #333;">已选择文件</h3>
                <div id="selectedFiles"></div>
            </div>
            
            <div style="margin-top: 20px;">
                <button class="btn" id="mergeBtn" onclick="startMerge()" disabled>合并记录</button>
                <button class="btn btn-secondary" onclick="clearFiles()">清空文件</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon" style="background: linear-gradient(135deg, #ffc107, #fd7e14); color: white;">
                    🔍
                </div>
                <div>
                    <h2 class="card-title">匹配统计</h2>
                </div>
            </div>
            
            <div id="statsContainer" style="display: none;">
                <div class="stats" id="statsContent"></div>
            </div>
            <div id="noStats" style="text-align: center; color: #999; padding: 40px;">
                合并完成后将显示匹配统计
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon" style="background: linear-gradient(135deg, #28a745, #20c997); color: white;">
                    📥
                </div>
                <div>
                    <h2 class="card-title">处理结果</h2>
                </div>
            </div>
            
            <div class="results" id="resultsContainer">
                <div style="text-align: center; color: #999; padding: 40px;">
                    处理结果将显示在这里
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFiles = [];

        function navigateTo(page) {
            window.location.href = `/${page}`;
        }

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                selectedFiles.push(file);
            });
            event.target.value = '';
            updateFileList();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const selectedFilesDiv = document.getElementById('selectedFiles');
            const mergeBtn = document.getElementById('mergeBtn');
            
            if (selectedFiles.length > 0) {
                fileList.style.display = 'block';
                selectedFilesDiv.innerHTML = selectedFiles.map((file, index) => `
                    <div class="file-item">
                        <div class="file-info">
                            <span class="file-icon">📊</span>
                            <div>
                                <div class="file-name">${file.name}</div>
                                <div class="file-size">${formatFileSize(file.size)}</div>
                            </div>
                        </div>
                        <button class="btn btn-secondary" onclick="removeFile(${index})" style="padding: 6px 12px; font-size: 0.8rem;">删除</button>
                    </div>
                `).join('');
                mergeBtn.disabled = selectedFiles.length < 2;
            } else {
                fileList.style.display = 'none';
                mergeBtn.disabled = true;
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function clearFiles() {
            selectedFiles = [];
            updateFileList();
            document.getElementById('statsContainer').style.display = 'none';
            document.getElementById('noStats').style.display = 'block';
            document.getElementById('resultsContainer').innerHTML = `
                <div style="text-align: center; color: #999; padding: 40px;">处理结果将显示在这里</div>
            `;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        async function startMerge() {
            const mergeBtn = document.getElementById('mergeBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const statsContainer = document.getElementById('statsContainer');
            const noStats = document.getElementById('noStats');
            
            mergeBtn.disabled = true;
            resultsContainer.innerHTML = `<div style="text-align: center; color: #999; padding: 40px;">合并中，请等待...</div>`;

            try {
                const formData = new FormData();
                selectedFiles.forEach(file => {
                    formData.append('files', file);
                });
                
                const response = await fetch('/api/match/merge', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayStats(result);
                    displayResults(result);
                } else {
                    resultsContainer.innerHTML = `
                        <div class="result-item error">
                            <div class="result-title">❌ 合并失败</div>
                            <div class="result-message">${result.error || 'Unknown error'}</div>
                        </div>
                    `;
                }
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div class="result-item error">
                        <div class="result-title">❌ 合并失败</div>
                        <div class="result-message">${error.message}</div>
                    </div>
                `;
            }
            
            mergeBtn.disabled = false;
        }

        function displayStats(result) {
            const statsContainer = document.getElementById('statsContainer');
            const noStats = document.getElementById('noStats');
            const statsContent = document.getElementById('statsContent');
            
            statsContainer.style.display = 'block';
            noStats.style.display = 'none';
            
            const duplicateInfo = result.duplicate_info || {};
            
            statsContent.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${result.source_files}</div>
                    <div class="stat-label">源文件数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${result.total_source_students}</div>
                    <div class="stat-label">原始学生数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${result.merged_students}</div>
                    <div class="stat-label">合并后学生数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${result.removed_duplicates || 0}</div>
                    <div class="stat-label">移除重复行数</div>
                </div>
                <div class="stat-card ${(duplicateInfo.exact_duplicates || 0) > 0 ? 'warning' : ''}">
                    <div class="stat-value">${duplicateInfo.exact_duplicates || 0}</div>
                    <div class="stat-label">完全重复行数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${duplicateInfo.same_name_different_class || 0}</div>
                    <div class="stat-label">同名不同班</div>
                </div>
            `;
        }

        function displayResults(result) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            const duplicateInfo = result.duplicate_info || {};
            
            let duplicateDetails = '';
            if (duplicateInfo.exact_duplicates && duplicateInfo.exact_duplicates > 0 && duplicateInfo.exact_duplicate_details) {
                duplicateDetails = `
                    <div style="margin-top: 15px; padding: 15px; background: #fff3cd; border-radius: 10px;">
                        <h4 style="color: #856404; margin-bottom: 10px;">⚠️ 检测到完全重复行</h4>
                        <div style="max-height: 200px; overflow-y: auto;">
                            ${duplicateInfo.exact_duplicate_details.slice(0, 10).map((dup, idx) => `
                                <div style="padding: 8px; margin-bottom: 5px; background: #fff; border-radius: 5px; font-size: 0.85rem;">
                                    <div style="color: #333;"><strong>重复 #${idx + 1}:</strong> ${dup.original.name} - ${dup.original.class}</div>
                                    <div style="color: #666;">原始: ${dup.original.source} 第${dup.original.row_index + 1}行</div>
                                    <div style="color: #e74c3c;">重复: ${dup.duplicate.source} 第${dup.duplicate.row_index + 1}行</div>
                                </div>
                            `).join('')}
                            ${duplicateInfo.exact_duplicate_details.length > 10 ? `<div style="color: #666; text-align: center; padding: 5px;">还有 ${duplicateInfo.exact_duplicate_details.length - 10} 条重复...</div>` : ''}
                        </div>
                    </div>
                `;
            }
            
            let sameNameWarning = '';
            if (duplicateInfo.groups && duplicateInfo.groups.length > 0) {
                sameNameWarning = `
                    <div style="margin-top: 15px; padding: 15px; background: #e7f3ff; border-radius: 10px;">
                        <h4 style="color: #0c63e4; margin-bottom: 10px;">ℹ️ 同名不同班学生提示</h4>
                        <ul style="color: #0c63e4; font-size: 0.9rem;">
                            ${duplicateInfo.groups.map(g => `
                                <li>${g.name}: ${g.count}名学生，班级: ${g.classes.join(', ')}</li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }
            
            resultsContainer.innerHTML = `
                <div class="result-item success">
                    <div class="result-title">✅ 合并完成</div>
                    <div class="result-message">
                        成功合并 ${result.source_files} 个文件中的 ${result.total_source_students} 条记录，合并后共 ${result.merged_students} 名学生。
                        ${result.removed_duplicates && result.removed_duplicates > 0 ? `<br><strong>已移除 ${result.removed_duplicates} 条完全重复行</strong>` : ''}
                    </div>
                    
                    ${duplicateDetails}
                    
                    ${sameNameWarning}
                    
                    <div style="margin-top: 15px;">
                        <button class="btn btn-secondary" onclick="downloadMatch('${result.output_filename}')" style="padding: 8px 20px; font-size: 0.9rem;">
                            下载合并结果
                        </button>
                    </div>
                </div>
            `;
        }

        function downloadMatch(filename) {
            window.location.href = `/api/match/download/${filename}`;
        }

        document.getElementById('uploadArea').addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('dragover');
        });

        document.getElementById('uploadArea').addEventListener('dragleave', () => {
            document.getElementById('uploadArea').classList.remove('dragover');
        });

        document.getElementById('uploadArea').addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            files.forEach(file => {
                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    selectedFiles.push(file);
                }
            });
            updateFileList();
        });
    </script>
</body>
</html>
