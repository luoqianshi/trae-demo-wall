<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>视频转码 - AI教务智能处理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI智能视频转码</h1>
            <p>自动识别视频编码，统一转为H.264格式</p>
        </div>

        <div class="nav">
            <button class="nav-btn active" onclick="navigateTo('video')">视频转码</button>
            <button class="nav-btn" onclick="navigateTo('data')">数据清洗</button>
            <button class="nav-btn" onclick="navigateTo('match')">学生匹配</button>
            <button class="nav-btn" onclick="navigateTo('ppt')">PPT制作</button>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon" style="background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white;">
                    🎬
                </div>
                <div>
                    <h2 class="card-title">上传视频文件</h2>
                </div>
            </div>
            
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽文件到此处</div>
                <div class="upload-hint">支持 MP4, MOV, AVI, MKV, FLV, WMV, WebM 格式</div>
            </div>
            <input type="file" id="fileInput" class="file-input" accept="video/*" multiple onchange="handleFileSelect(event)">
            
            <div class="file-list" id="fileList" style="display: none;">
                <h3 style="margin-bottom: 15px; color: #333;">已选择文件</h3>
                <div id="selectedFiles"></div>
            </div>
            
            <div style="margin-top: 20px;">
                <button class="btn" id="startBtn" onclick="startTranscode()" disabled>开始转码</button>
                <button class="btn btn-secondary" onclick="clearFiles()">清空文件</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon" style="background: linear-gradient(135deg, #28a745, #20c997); color: white;">
                    📊
                </div>
                <div>
                    <h2 class="card-title">处理进度</h2>
                </div>
            </div>
            
            <div id="progressContainer" style="display: none;">
                <div id="progressList"></div>
            </div>
            <div id="noProgress" style="text-align: center; color: #999; padding: 40px;">
                暂无处理任务，请上传文件并开始转码
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon" style="background: linear-gradient(135deg, #17a2b8, #6f42c1); color: white;">
                    📥
                </div>
                <div>
                    <h2 class="card-title">处理结果</h2>
                </div>
            </div>
            
            <div class="results" id="resultsContainer">
                <div style="text-align: center; color: #999; padding: 40px;">
                    处理结果将显示在这里
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFiles = [];

        function navigateTo(page) {
            window.location.href = `/${page}`;
        }

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                selectedFiles.push(file);
            });
            event.target.value = '';
            updateFileList();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const selectedFilesDiv = document.getElementById('selectedFiles');
            const startBtn = document.getElementById('startBtn');
            
            if (selectedFiles.length > 0) {
                fileList.style.display = 'block';
                selectedFilesDiv.innerHTML = selectedFiles.map((file, index) => `
                    <div class="file-item">
                        <div class="file-info">
                            <span class="file-icon">🎬</span>
                            <div>
                                <div class="file-name">${file.name}</div>
                                <div class="file-size">${formatFileSize(file.size)}</div>
                            </div>
                        </div>
                        <button class="btn btn-secondary" onclick="removeFile(${index})" style="padding: 6px 12px; font-size: 0.8rem;">删除</button>
                    </div>
                `).join('');
                startBtn.disabled = false;
            } else {
                fileList.style.display = 'none';
                startBtn.disabled = true;
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function clearFiles() {
            selectedFiles = [];
            updateFileList();
            document.getElementById('resultsContainer').innerHTML = `
                <div style="text-align: center; color: #999; padding: 40px;">处理结果将显示在这里</div>
            `;
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('noProgress').style.display = 'block';
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        async function startTranscode() {
            const startBtn = document.getElementById('startBtn');
            const progressContainer = document.getElementById('progressContainer');
            const noProgress = document.getElementById('noProgress');
            const progressList = document.getElementById('progressList');
            const resultsContainer = document.getElementById('resultsContainer');
            
            startBtn.disabled = true;
            progressContainer.style.display = 'block';
            noProgress.style.display = 'none';
            resultsContainer.innerHTML = `
                <div style="text-align: center; color: #999; padding: 40px;">处理中，请等待...</div>
            `;

            progressList.innerHTML = selectedFiles.map((file, index) => `
                <div style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <span>${file.name}</span>
                        <span id="progress-${index}">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill-${index}" style="width: 0%"></div>
                    </div>
                    <div id="status-${index}" style="color: #666; font-size: 0.9rem;"></div>
                </div>
            `).join('');

            const results = [];
            
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                updateProgress(i, 10, '正在上传...');
                
                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    updateProgress(i, 30, '正在分析视频编码...');
                    
                    const response = await fetch('/api/video/transcode', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        updateProgress(i, 100, result.message);
                        results.push({
                            success: true,
                            filename: file.name,
                            message: result.message,
                            output_filename: result.output_filename,
                            strategy: result.strategy
                        });
                    } else {
                        updateProgress(i, 100, '转码失败');
                        results.push({
                            success: false,
                            filename: file.name,
                            message: result.error || 'Unknown error'
                        });
                    }
                } catch (error) {
                    updateProgress(i, 100, '转码失败');
                    results.push({
                        success: false,
                        filename: file.name,
                        message: error.message
                    });
                }
            }
            
            displayResults(results);
            startBtn.disabled = false;
        }

        function updateProgress(index, percent, status) {
            const progressSpan = document.getElementById(`progress-${index}`);
            const progressFill = document.getElementById(`progress-fill-${index}`);
            const statusDiv = document.getElementById(`status-${index}`);
            
            if (progressSpan) progressSpan.textContent = `${percent}%`;
            if (progressFill) progressFill.style.width = `${percent}%`;
            if (statusDiv) statusDiv.textContent = status;
        }

        function displayResults(results) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            resultsContainer.innerHTML = results.map(result => {
                const className = result.success ? 'success' : 'error';
                const icon = result.success ? '✅' : '❌';
                
                if (result.success) {
                    return `
                        <div class="result-item ${className}">
                            <div class="result-title">${icon} ${result.filename}</div>
                            <div class="result-message">${result.message}</div>
                            <div style="margin-top: 10px;">
                                <button class="btn btn-secondary" onclick="downloadVideo('${result.output_filename}')" style="padding: 8px 20px; font-size: 0.9rem;">
                                    下载结果
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="result-item ${className}">
                            <div class="result-title">${icon} ${result.filename}</div>
                            <div class="result-message">错误: ${result.message}</div>
                        </div>
                    `;
                }
            }).join('');
        }

        function downloadVideo(filename) {
            window.location.href = `/api/video/download/${filename}`;
        }

        document.getElementById('uploadArea').addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('dragover');
        });

        document.getElementById('uploadArea').addEventListener('dragleave', () => {
            document.getElementById('uploadArea').classList.remove('dragover');
        });

        document.getElementById('uploadArea').addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            files.forEach(file => {
                if (file.type.startsWith('video/')) {
                    selectedFiles.push(file);
                }
            });
            updateFileList();
        });
    </script>
</body>
</html>
