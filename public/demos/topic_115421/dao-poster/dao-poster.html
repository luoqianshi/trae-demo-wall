<script>
// ==================== 道德经81章全文 ====================
const ttcFull=[
{ch:1,t:'道可道非常道名可名非常名无名天地之始有名万物之母故常无欲以观其妙常有欲以观其徼此两者同出而异名同谓之玄玄之又玄众妙之门'},
{ch:2,t:'天下皆知美之为美斯恶已皆知善之为善斯不善已有无相生难易相成长短相较高下相倾音声相和前后相随是以圣人处无为之事行不言之教万物作焉而不辞生而不有为而不恃功成而弗居夫唯弗居是以不去'},
{ch:3,t:'不尚贤使民不争不贵难得之货使民不为盗不见可欲使民心不乱是以圣人之治虚其心实其腹弱其志强其骨常使民无知无欲使夫智者不敢为也为无为则无不治'},
{ch:4,t:'道冲而用之或不盈渊兮似万物之宗挫其锐解其纷和其光同其尘湛兮似或存吾不知谁之子象帝之先'},
{ch:5,t:'天地不仁以万物为刍狗圣人不仁以百姓为刍狗天地之间其犹橐龠乎虚而不屈动而愈出多言数穷不如守中'},
{ch:6,t:'谷神不死是谓玄牝玄牝之门是谓天地根绵绵若存用之不勤'},
{ch:7,t:'天长地久天地所以能长且久者以其不自生故能长生是以圣人后其身而身先外其身而身存非以其无私邪故能成其私'},
{ch:8,t:'上善若水水善利万物而不争处众人之所恶故几于道居善地心善渊与善仁言善信政善治事善能动善时夫唯不争故无尤'},
{ch:9,t:'持而盈之不如其已揣而锐之不可长保金玉满堂莫之能守富贵而骄自遗其咎功遂身退天之道也'},
{ch:10,t:'载营魄抱一能无离乎专气致柔能如婴儿乎涤除玄览能无疵乎爱国治民能无为乎天门开阖能为雌乎明白四达能无知乎'},
{ch:11,t:'三十辐共一毂当其无有车之用埏埴以为器当其无有器之用凿户牖以为室当其无有室之用故有之以为利无之以为用'},
{ch:12,t:'五色令人目盲五音令人耳聋五味令人口爽驰骋畋猎令人心发狂难得之货令人行妨是以圣人为腹不为目故去彼取此'},
{ch:13,t:'宠辱若惊贵大患若身何谓宠辱若惊宠为下得之若惊失之若惊是谓宠辱若惊何谓贵大患若身吾所以有大患者为吾有身及吾无身吾有何患故贵以身为天下若可寄天下爱以身为天下若可托天下'},
{ch:14,t:'视之不见名曰夷听之不闻名曰希搏之不得名曰微此三者不可致诘故混而为一其上不皦其下不昧绳绳兮不可名复归于无物是谓无状之状无物之象是谓惚恍迎之不见其首随之不见其后'},
{ch:15,t:'古之善为士者微妙玄通深不可识夫唯不可识故强为之容豫兮若冬涉川犹兮若畏四邻俨兮其若客涣兮若冰之将释敦兮其若朴旷兮其若谷混兮其若浊孰能浊以静之徐清孰能安以动之徐生保此道者不欲盈夫唯不盈故能蔽而新成'},
{ch:16,t:'致虚极守静笃万物并作吾以观复夫物芸芸各复归其根归根曰静静曰复命复命曰常知常曰明不知常妄作凶知常容容乃公公乃全全乃天天乃道道乃久没身不殆'},
{ch:17,t:'太上不知有之其次亲而誉之其次畏之其次侮之信不足焉有不信焉悠兮其贵言功成事遂百姓皆谓我自然'},
{ch:18,t:'大道废有仁义智慧出有大伪六亲不和有孝慈国家昏乱有忠臣'},
{ch:19,t:'绝圣弃智民利百倍绝仁弃义民复孝慈绝巧弃利盗贼无有此三者以为文不足故令有所属见素抱朴少私寡欲'},
{ch:20,t:'绝学无忧唯之与阿相去几何善之与恶相去若何人之所畏不可不畏荒兮其未央哉众人熙熙如享太牢如春登台我独泊兮其未兆沌沌兮如婴儿之未孩累累兮若无所归众人皆有余而我独若遗我愚人之心也哉沌沌兮俗人昭昭我独昏昏俗人察察我独闷闷澹兮其若海飂兮若无止众人皆有以而我独顽且鄙我独异于人而贵食母'},
{ch:21,t:'孔德之容惟道是从道之为物惟恍惟惚惚兮恍兮其中有象恍兮惚兮其中有物窈兮冥兮其中有精其精甚真其中有信自今及古其名不去以阅众甫吾何以知众甫之状哉以此'},
{ch:22,t:'曲则全枉则直洼则盈敝则新少则得多则惑是以圣人抱一为天下式不自见故明不自是故彰不自伐故有功不自矜故长夫唯不争故天下莫能与之争古之所谓曲则全者岂虚言哉诚全而归之'},
{ch:23,t:'希言自然故飘风不终朝骤雨不终日孰为此者天地天地尚不能久而况于人乎故从事于道者同于道德者同于德失者同于失同于道者道亦乐得之同于德者德亦乐得之同于失者失亦乐得之信不足焉有不信焉'},
{ch:24,t:'企者不立跨者不行自见者不明自是者不彰自伐者无功自矜者不长其在道也曰余食赘形物或恶之故有道者不处'},
{ch:25,t:'有物混成先天地生寂兮寥兮独立而不改周行而不殆可以为天地母吾不知其名强字之曰道强为之名曰大大曰逝逝曰远远曰反故道大天大地大人亦大域中有四大而人居其一焉人法地地法天天法道道法自然'},
{ch:26,t:'重为轻根静为躁君子终日行不离辎重虽有荣观燕处超然奈何万乘之主而以身轻天下轻则失根躁则失君'},
{ch:27,t:'善行无辙迹善言无瑕谪善数不用筹策善闭无关楗而不可开善结无绳约而不可解是以圣人常善救人故无弃人常善救物故无弃物是谓袭明故善人者不善人之师不善人者善人之资不贵其师不爱其资虽智大迷是谓要妙'},
{ch:28,t:'知其雄守其雌为天下溪为天下溪常德不离复归于婴儿知其白守其黑为天下式为天下式常德不忒复归于无极知其荣守其辱为天下谷为天下谷常德乃足复归于朴朴散则为器圣人用之则为官长故大制不割'},
{ch:29,t:'将欲取天下而为之吾见其不得已天下神器不可为也为者败之执者失之故物或行或随或歔或吹或强或羸或挫或隳是以圣人去甚去奢去泰'},
{ch:30,t:'以道佐人主者不以兵强天下其事好还师之所处荆棘生焉大军之后必有凶年善有果而已不敢以取强果而勿矜果而勿骄果而勿不得已而勿强果而勿强物壮则老是谓不道不道早已'},
{ch:31,t:'夫佳兵者不祥之器物或恶之故有道者不处君子居则贵左用兵则贵右兵者不祥之器非君子之器不得已而用之恬淡为上胜而不美而美之者是乐杀人夫乐杀人者则不可以得志于天下矣吉事尚左凶事尚右偏将军居左上将军居右言以丧礼处之杀人之众以悲哀泣之战胜以丧礼处之'},
{ch:32,t:'道常无名朴虽小天下莫能臣侯王若能守之万物将自宾天地相合以降甘露民莫之令而自均始制有名名亦既有夫亦将知止知止可以不殆譬道之在天下犹川谷之于江海'},
{ch:33,t:'知人者智自知者明胜人者有力自胜者强知足者富强行者有志不失其所者久死而不亡者寿'},
{ch:34,t:'大道泛兮其可左右万物恃之以生而不辞功成而不名有衣养万物而不为主常无欲可名于小万物归焉而不为主可名为大以其终不自为大故能成其大'},
{ch:35,t:'执大象天下往往而不害安平太乐与饵过客止道之出口淡乎其无味视之不足见听之不足闻用之不足既'},
{ch:36,t:'将欲歙之必固张之将欲弱之必固强之将欲废之必固兴之将欲取之必固与之是谓微明柔弱胜刚强鱼不可脱于渊国之利器不可以示人'},
{ch:37,t:'道常无为而无不为侯王若能守之万物将自化化而欲作吾将镇之以无名之朴镇之以无名之朴夫将不欲不欲以静天下将自正'},
{ch:38,t:'上德不德是以有德下德不失德是以无德上德无为而无以为下德无为而有以为上仁为之而无以为上义为之而有以为上礼为之而莫之应则攘臂而扔之故失道而后德失德而后仁失仁而后义失义而后礼夫礼者忠信之薄而乱之首前识者道之华而愚之始是以大丈夫处其厚不居其薄处其实不居其华故去彼取此'},
{ch:39,t:'昔之得一者天得一以清地得一以宁神得一以灵谷得一以盈万物得一以生侯王得一以为天下正其致之也谓天无以清将恐裂地无以宁将恐发神无以灵将恐歇谷无以盈将恐竭万物无以生将恐灭侯王无以正将恐蹙故贵以贱为本高以下为基是以侯王自谓孤寡不谷此非以贱为本邪非乎故至誉无誉不欲琭琭如玉珞珞如石'},
{ch:40,t:'反者道之动弱者道之用天下万物生于有有生于无'},
{ch:41,t:'上士闻道勤而行之中士闻道若存若亡下士闻道大笑之不笑不足以为道故建言有之明道若昧进道若退夷道若类上德若谷大白若辱广德若不足建德若偷质真若渝大方无隅大器晚成大音希声大象无形道隐无名夫唯道善贷且成'},

{ch:55,t:'含德之厚比于赤子毒虫不螫猛兽不据攫鸟不搏骨弱筋柔而握固未知牝牡之合而全作精之至也终日号而不哑和之至也知和曰常知常曰明益生曰祥心使气曰强物壮则老谓之不道不道早已'},

/* 根据日期获取当前节气（近似计算） */
function getCurrentJieqi(){const n=new Date();const m=n.getMonth()+1;const d=n.getDate();let best=null;let bestDiff=999;
  for(let i=0;i<jieqiData.length;i++){const j=jieqiData[i];let diff=Math.abs((m-j.m)*30+(d-j.d));
    if(diff>180)diff=360-diff;
    if(diff<bestDiff){bestDiff=diff;best=j;}}return best;}
/* 模拟天气：基于节气和日期的伪随机 */
function getSimWeather(jq){const n=new Date();const seed=n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate();const w=jq.weather[seed%jq.weather.length];
  return w;}
function showDaily(idx){
  const jq=getCurrentJieqi();const n=new Date();const weather=getSimWeather(jq);
  const dateStr=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';
  const badge=dateStr+' · '+jq.name+' · '+weather;
  document.getElementById('dailyDate').textContent=badge;
  const daySeed=getDayOfYear();const chIdx=jq.ch[daySeed%jq.ch.length];
  const s=ttcFull.find(t=>t.ch===chIdx)||ttcFull[daySeed%ttcFull.length];
  document.getElementById('dailySutra').textContent=s.t;

  document.getElementById('dailyChapter').textContent='—— 《道德经》第'+s.ch+'章 · '+jq.desc;
}

// ==================== MEDITATION (引导音+478+localStorage) ====================
let medRunning=false,medInterval=null,medBreathTimeout=null,medDuration=180,medElapsed=0,breathMode='even';
let breathAudioCtx=null,breathGain=null,breathOsc=null;

function setDuration(el,sec){medDuration=sec;document.querySelectorAll('.med-opt-group:first-child .med-dur-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active')}
function setBreathMode(el,mode){breathMode=mode;document.querySelectorAll('.med-opt-group:last-child .med-dur-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active')}

function createBreathAudio(){
  breathAudioCtx=new(window.AudioContext||window.webkitAudioContext)();
  breathOsc=breathAudioCtx.createOscillator();breathOsc.type='sine';breathOsc.frequency.value=220;
  breathGain=breathAudioCtx.createGain();breathGain.gain.value=0;
  breathOsc.connect(breathGain);breathGain.connect(breathAudioCtx.destination);breathOsc.start();
}
function breathTone(freq,dur){
  if(!breathAudioCtx)return;
  const t=breathAudioCtx.currentTime;
  breathOsc.frequency.setValueAtTime(freq,t);
  breathGain.gain.setValueAtTime(0,t);
  breathGain.gain.linearRampToValueAtTime(.06,t+.3);
  breathGain.gain.linearRampToValueAtTime(.04,t+dur-.5);
  breathGain.gain.linearRampToValueAtTime(0,t+dur);
}

function toggleMeditation(){
  if(medRunning){pauseMeditation();return}
  medRunning=true;medElapsed=0;
  document.getElementById('medStartBtn').textContent='暂停';
  document.getElementById('medStopBtn').style.display='inline-block';
  if(!breathAudioCtx)createBreathAudio();
  updateTimer();
  medInterval=setInterval(()=>{medElapsed++;updateTimer();if(medElapsed>=medDuration)stopMeditation()},1000);
  startBreathing();
}
function pauseMeditation(){
  medRunning=false;clearInterval(medInterval);clearTimeout(medBreathTimeout);
  document.getElementById('medStartBtn').textContent='继续';
  document.getElementById('medInstruction').textContent='已暂停';
  if(breathGain)breathGain.gain.linearRampToValueAtTime(0,breathAudioCtx.currentTime+.3);
}
function stopMeditation(){
  const sessionSeconds=medElapsed;
  medRunning=false;clearInterval(medInterval);clearTimeout(medBreathTimeout);
  document.getElementById('medStartBtn').textContent='开始冥想';
  document.getElementById('medStopBtn').style.display='none';
  document.getElementById('medInstruction').textContent='冥想结束';
  document.getElementById('medTimer').textContent=formatTime(0);
  document.getElementById('medRing').className='med-ring';
  document.getElementById('medRingInner').className='med-ring-inner';
  if(breathGain)breathGain.gain.linearRampToValueAtTime(0,breathAudioCtx.currentTime+.5);
  medElapsed=0;
  if(sessionSeconds>=10)saveMedStats(1,sessionSeconds);
  loadMedStats();
}
function updateTimer(){document.getElementById('medTimer').textContent=formatTime(Math.max(0,medDuration-medElapsed))}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

function startBreathing(){
  const ring=document.getElementById('medRing'),inner=document.getElementById('medRingInner'),instr=document.getElementById('medInstruction');
  if(breathMode==='478'){start478(ring,inner,instr)}else{startEven(ring,inner,instr)}
}
function startEven(ring,inner,instr){
  function in_(){if(!medRunning)return;ring.className='med-ring breathe-in';inner.className='med-ring-inner breathe-in';instr.textContent='吸 · 气';breathTone(220,3500);medBreathTimeout=setTimeout(out,4000)}
  function out(){if(!medRunning)return;ring.className='med-ring breathe-out';inner.className='med-ring-inner breathe-out';instr.textContent='呼 · 气';breathTone(180,3500);medBreathTimeout=setTimeout(in_,4000)}
  in_();
}
function start478(ring,inner,instr){
  function inhale(){if(!medRunning)return;ring.className='med-ring breathe-in';inner.className='med-ring-inner breathe-in';instr.textContent='吸气 4秒';breathTone(220,3800);medBreathTimeout=setTimeout(hold,4000)}
  function hold(){if(!medRunning)return;instr.textContent='屏息 7秒';breathTone(260,6500);medBreathTimeout=setTimeout(exhale,7000)}
  function exhale(){if(!medRunning)return;ring.className='med-ring breathe-out';inner.className='med-ring-inner breathe-out';instr.textContent='呼气 8秒';breathTone(160,7500);medBreathTimeout=setTimeout(inhale,8000)}
  inhale();
}

}

const canvas=document.getElementById('runeCanvas');const ctx=canvas.getContext('2d');let particles=[];
const runes=['道','德','阴','阳','无','有','一','和','☯','水','山','风'];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
class P{constructor(x,y){this.x=x;this.y=y;this.text=runes[Math.floor(Math.random()*runes.length)];this.size=Math.random()*11+7;this.life=1;this.decay=Math.random()*.014+.007;this.vx=(Math.random()-.5)*.35;this.vy=(Math.random()-.5)*.35-.25;this.color=Math.random()>.5?'#c9a96e':'#c23a30'}update(){this.x+=this.vx;this.y+=this.vy;this.life-=this.decay}draw(){ctx.globalAlpha=this.life*.35;ctx.font=this.size+'px serif';ctx.fillStyle=this.color;ctx.fillText(this.text,this.x,this.y);ctx.globalAlpha=1}}
document.addEventListener('mousemove',e=>{if(Math.random()>.75)particles.push(new P(e.clientX,e.clientY))});
(function animP(){ctx.clearRect(0,0,canvas.width,canvas.height);particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animP)})();

function createAmbientSound(){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const o1=audioCtx.createOscillator();o1.type='sine';o1.frequency.value=60;const g1=audioCtx.createGain();g1.gain.value=.025;o1.connect(g1);g1.connect(audioCtx.destination);o1.start();
  const o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=180;const g2=audioCtx.createGain();g2.gain.value=.008;o2.connect(g2);g2.connect(audioCtx.destination);o2.start();
  const bs=audioCtx.sampleRate*2;const buf=audioCtx.createBuffer(1,bs,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*.5;
  const n=audioCtx.createBufferSource();n.buffer=buf;n.loop=true;const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=400;const gN=audioCtx.createGain();gN.gain.value=.012;n.connect(f);f.connect(gN);gN.connect(audioCtx.destination);n.start();
}
function toggleSound(){isSoundOn=!isSoundOn;if(isSoundOn){if(!audioCtx)createAmbientSound();else audioCtx.resume();document.querySelector('.sound-toggle').textContent='🔊'}else{if(audioCtx)audioCtx.suspend();document.querySelector('.sound-toggle').textContent='🔇'}}
