    <style id="theme-vars">
:root {
  /* ── Brand Colors ── */
  --color-primary: #D81B60;
  --color-primary-light: #F06292;
  --color-primary-dark: #AD1457;
  --color-primary-bg: #FCE4EC;
  --color-primary-bg-soft: #FFF0F5;

  --color-secondary: #1976D2;
  --color-secondary-light: #64B5F6;
  --color-secondary-dark: #0D47A1;
  --color-secondary-bg: #E3F2FD;
  --color-secondary-bg-soft: #F0F7FF;

  --color-accent-purple: #8B5CF6;
  --color-accent-cyan: #06B6D4;
  --color-accent-teal: #14B8A6;
  --color-accent-orange: #F97316;

  /* ── Neutral Scale ── */
  --color-bg: #FAFAFA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F3F4F6;
  --color-surface: #FFFFFF;
  --color-surface-dim: #F9FAFB;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F0;

  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #1976D2;

  /* ── State Colors ── */
  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography System ── */
  --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;

  --text-xs: 10px;
  --text-xs-lh: 14px;
  --text-sm: 12px;
  --text-sm-lh: 18px;
  --text-base: 14px;
  --text-base-lh: 22px;
  --text-lg: 16px;
  --text-lg-lh: 24px;
  --text-xl: 20px;
  --text-xl-lh: 28px;
  --text-2xl: 24px;
  --text-2xl-lh: 32px;
  --text-3xl: 30px;
  --text-3xl-lh: 38px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
}

/* Dark mode */
.dark {
  --color-bg: #111827;
  --color-bg-elevated: #1F2937;
  --color-bg-sunken: #0F172A;
  --color-surface: #1F2937;
  --color-surface-dim: #374151;

  --color-border: #374151;
  --color-border-light: #1F2937;
  --color-divider: #374151;

  --color-text-primary: #F9FAFB;
  --color-text-secondary: #9CA3AF;
  --color-text-tertiary: #6B7280;
  --color-text-inverse: #111827;
  --color-text-link: #64B5F6;

  --color-primary-bg: #4A1128;
  --color-primary-bg-soft: #3B0F20;
  --color-secondary-bg: #0C2D5E;
  --color-secondary-bg-soft: #0A244D;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.35);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.5);
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>

  <style>
    /* ── Hierarchy Page Scoped Styles ── */
    .app-shell {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        background-color: var(--color-bg);
        font-family: var(--font-sans);
        position: relative;
    }
    .app-frame { padding-bottom: 80px; min-height: 100vh; }
    .app-bar { position: sticky; top: 0; z-index: 100; background-color: var(--color-surface); border-bottom: 1px solid var(--color-border-light); }
    .app-bar-inner { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; min-height: 48px; }
    .app-bar-title { font-size: var(--text-lg); line-height: var(--text-lg-lh); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
    .app-bar-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: var(--radius-full); border: none; background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: background-color 0.2s; }
    .app-bar-btn:hover { background-color: var(--color-bg-sunken); }

    /* ── 树形目录 ── */
    .tree-root { padding: 12px 16px 0; }
    .tree-node { position: relative; }
    .tree-children {
        padding-left: 14px;
        margin-left: 22px;
        border-left: 2px solid var(--color-border-light);
        overflow: hidden;
        transition: max-height 0.3s ease;
    }
    .tree-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border-light);
        border-radius: var(--radius-lg);
        cursor: pointer;
        margin-bottom: 8px;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        animation: fade-in-up 0.3s ease-out backwards;
    }
    .tree-card:hover { border-color: var(--color-primary-light); box-shadow: var(--shadow-md); }
    .tree-card:active { transform: scale(0.98); }
    .tree-icon-circle {
        width: 36px; height: 36px;
        border-radius: var(--radius-full);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        color: var(--color-text-inverse);
    }
    .tree-icon-circle svg { width: 18px; height: 18px; }
    .tree-info { flex: 1; min-width: 0; }
    .tree-name {
        font-size: var(--text-base);
        line-height: var(--text-base-lh);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .tree-meta {
        font-size: var(--text-xs);
        line-height: var(--text-xs-lh);
        color: var(--color-text-tertiary);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .tree-expand-btn, .tree-menu-btn {
        width: 32px; height: 32px;
        border: none; background: transparent;
        border-radius: var(--radius-full);
        cursor: pointer; color: var(--color-text-secondary);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        transition: background-color 0.15s ease;
    }
    .tree-expand-btn:hover, .tree-menu-btn:hover { background: var(--color-bg-sunken); color: var(--color-text-primary); }
    .tree-expand-btn svg, .tree-menu-btn svg { width: 18px; height: 18px; }
    .tree-expand-btn svg { transition: transform 0.2s ease; }
    .tree-expand-btn.expanded svg { transform: rotate(90deg); }

    /* ── 分组小标题（房间/容器下同时有容器与物品时） ── */
    .tree-group-label {
        font-size: var(--text-xs);
        line-height: var(--text-xs-lh);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 10px 4px 4px;
    }
    .tree-empty-child {
        font-size: var(--text-xs);
        color: var(--color-text-tertiary);
        padding: 8px 4px 12px;
        font-style: italic;
    }

    /* ── 顶部添加房子按钮 ── */
    .add-house-btn {
        display: flex; align-items: center; justify-content: center; gap: 6px;
        margin: 4px 16px 24px;
        padding: 12px 20px;
        border: 1px dashed var(--color-primary);
        background: transparent;
        color: var(--color-primary);
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-medium);
        cursor: pointer;
        width: calc(100% - 32px);
        font-family: var(--font-sans);
        transition: background-color 0.15s ease;
    }
    .add-house-btn:hover { background-color: var(--color-primary-bg-soft); }
    .add-house-btn svg { width: 16px; height: 16px; }

    /* ── 空状态 CTA ── */
    .empty-state-cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 64px 24px 32px;
        color: var(--color-text-tertiary);
    }
    .empty-state-cta .empty-icon {
        width: 72px; height: 72px;
        border-radius: var(--radius-full);
        background-color: var(--color-primary-bg-soft);
        color: var(--color-primary-light);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 16px;
    }
    .empty-state-cta .empty-icon svg { width: 36px; height: 36px; }
    .empty-state-cta-title {
        font-size: var(--text-lg);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        margin-bottom: 6px;
    }
    .empty-state-cta-sub {
        font-size: var(--text-sm);
        color: var(--color-text-secondary);
        margin-bottom: 24px;
    }
    .btn-primary {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 12px 28px;
        background-color: var(--color-primary);
        color: var(--color-text-inverse);
        border: none;
        border-radius: var(--radius-full);
        font-size: var(--text-base);
        font-weight: var(--font-weight-semibold);
        cursor: pointer;
        font-family: var(--font-sans);
        transition: background-color 0.15s ease, transform 0.15s ease;
    }
    .btn-primary:hover { background-color: var(--color-primary-dark); }
    .btn-primary svg { width: 16px; height: 16px; }

    /* ── 浮动操作菜单 ── */
    .action-menu {
        position: fixed;
        background: var(--color-surface);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-float);
        z-index: 9999;
        min-width: 180px;
        padding: var(--space-1);
        border: 1px solid var(--color-border);
        animation: fade-in-up 0.15s ease-out;
    }
    .action-menu-item {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: var(--text-sm);
        line-height: var(--text-sm-lh);
        color: var(--color-text-primary);
        font-family: var(--font-sans);
        background: none;
        border: none;
        width: 100%;
        text-align: left;
        transition: background-color 0.12s ease;
    }
    .action-menu-item:hover { background: var(--color-bg-sunken); }
    .action-menu-item svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--color-text-secondary); }
    .action-menu-item.danger { color: var(--state-error); }
    .action-menu-item.danger svg { color: var(--state-error); }
    .action-menu-divider {
        height: 1px;
        background: var(--color-divider);
        margin: var(--space-1) 0;
    }

    /* ── Tab Bar (与其他页面一致) ── */
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 56px; padding-bottom: env(safe-area-inset-bottom, 16px); background-color: var(--color-surface); border-top: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-around; z-index: 1000; box-shadow: var(--shadow-md); }
    .tab-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; flex: 1; height: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent; text-decoration: none; transition: color 0.2s ease; }
    .tab-item .tab-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--color-text-tertiary); transition: color 0.2s ease; }
    .tab-item .tab-icon svg { width: 24px; height: 24px; }
    .tab-item .tab-label { font-size: var(--text-xs); line-height: var(--text-xs-lh); color: var(--color-text-tertiary); font-weight: var(--font-weight-regular); transition: color 0.2s ease, font-weight 0.2s ease; }
    .tab-item[data-active="true"] .tab-icon { color: var(--color-primary); }
    .tab-item[data-active="true"] .tab-label { color: var(--color-primary); font-weight: var(--font-weight-semibold); }

    /* 平板/桌面：树形单列居中，覆盖 app.css 的 room-list 多列 */
    @media (min-width: 768px) {
        .tree-root { max-width: 720px; margin: 0 auto; }
    }
    @media (min-width: 1024px) {
        .tree-root { max-width: 860px; margin: 0 auto; }
    }
  </style>
</head>

    <script>
    /* ============================================================
       hierarchy.html - 可展开/收起的嵌套树形目录
       URL 参数：?expand=<entityType>:<entityId>
       从其他页面跳转时自动展开到指定实体（含所有父级）
       ============================================================ */
    (function () {
      'use strict';
      var S = window.GuiweiStore;
      var App = window.GuiweiApp || { showToast: function (m) { alert(m); } };

      // ── 展开状态（source of truth）：{ 'house:<id>': true, ... }
      var expandedState = {};

      // ── 类型 → 图标背景色（按层级颜色区分） ──
      var TYPE_COLORS = {
        house: 'var(--color-primary)',
        floor: 'var(--color-secondary)',
        room: 'var(--color-accent-teal)',
        container: 'var(--color-accent-orange)',
        item: 'var(--color-accent-purple)'
      };

      // ── 内联 SVG 图标库 ──
      var ICONS = {
        house: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><polyline points="9 21 9 14 15 14 15 21"/></svg>',
        floor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="12" x2="21" y2="12"/></svg>',
        room: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 012 2v10"/><path d="M2 17h20"/></svg>',
        container: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
        item: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>',
        chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
        more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>',
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
        box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
        cube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>',
        qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="14" y2="14.01"/><line x1="17" y1="14" x2="21" y2="14"/><line x1="14" y1="17" x2="17" y2="17"/><line x1="17" y1="21" x2="21" y2="21"/><line x1="21" y1="17" x2="21" y2="21"/></svg>',
        edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>'
      };

      // ── 工具：HTML 转义 ──
      function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // ── 实体元信息 ──
      function getEntityMeta(entity, type) {
        try {
          if (type === 'house') {
            var floors = S.listFloorsByHouse(entity.id);
            return (entity.address || '无地址') + ' · ' + floors.length + ' 个楼层';
          }
          if (type === 'floor') {
            var rooms = S.listRoomsByFloor(entity.id);
            return 'Level ' + entity.level + ' · ' + rooms.length + ' 个房间';
          }
          if (type === 'room') {
            var containers = S.listContainersByRoom(entity.id);
            var items = S.listItemsByRoom(entity.id);
            return containers.length + ' 个容器 · ' + items.length + ' 个物品';
          }
          if (type === 'container') {
            var subs = S.listContainersByParent(entity.id);
            var itemsInC = S.listItemsByContainer(entity.id);
            var typeLabel = entity.type ? entity.type + ' · ' : '';
            return typeLabel + subs.length + ' 子容器 · ' + itemsInC.length + ' 物品';
          }
          if (type === 'item') {
            var tags = Array.isArray(entity.tags) ? entity.tags.join(', ') : '';
            return tags || '无标签';
          }
        } catch (e) { /* ignore */ }
        return '';
      }

      // ── 创建子节点容器 ──
      function createChildrenContainer() {
        var d = document.createElement('div');
        d.className = 'tree-children';
        d.setAttribute('data-children', '');
        return d;
      }

      // ── 创建一个实体节点（卡片 + 可能的子节点） ──
      function createNodeEl(type, entity, ctx) {
        var node = document.createElement('div');
        node.className = 'tree-node';
        node.setAttribute('data-node-key', type + ':' + entity.id);

        var card = document.createElement('div');
        card.className = 'tree-card';

        var iconCircle = document.createElement('div');
        iconCircle.className = 'tree-icon-circle';
        iconCircle.style.backgroundColor = TYPE_COLORS[type] || 'var(--color-text-secondary)';
        iconCircle.innerHTML = ICONS[type] || ICONS.box;
        card.appendChild(iconCircle);

        var info = document.createElement('div');
        info.className = 'tree-info';
        var nameEl = document.createElement('div');
        nameEl.className = 'tree-name';
        nameEl.textContent = entity.name || '(未命名)';
        var metaEl = document.createElement('div');
        metaEl.className = 'tree-meta';
        metaEl.textContent = getEntityMeta(entity, type);
        info.appendChild(nameEl);
        info.appendChild(metaEl);
        card.appendChild(info);

        // 更多操作按钮
        var menuBtn = document.createElement('button');
        menuBtn.className = 'tree-menu-btn';
        menuBtn.type = 'button';
        menuBtn.setAttribute('aria-label', '更多操作');
        menuBtn.innerHTML = ICONS.more;
        menuBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          showActionMenu(type, entity, ctx, menuBtn);
        });
        card.appendChild(menuBtn);

        if (type !== 'item') {
          // 展开按钮
          var expandBtn = document.createElement('button');
          expandBtn.className = 'tree-expand-btn';
          expandBtn.type = 'button';
          expandBtn.setAttribute('aria-label', '展开/收起');
          expandBtn.innerHTML = ICONS.chevron;
          if (expandedState[type + ':' + entity.id]) {
            expandBtn.classList.add('expanded');
            expandBtn.setAttribute('aria-expanded', 'true');
          } else {
            expandBtn.setAttribute('aria-expanded', 'false');
          }
          expandBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            toggleExpand(type, entity, ctx, node, expandBtn);
          });
          card.appendChild(expandBtn);
          // 卡片点击也触发展开（按钮已 stopPropagation）
          card.addEventListener('click', function () {
            toggleExpand(type, entity, ctx, node, expandBtn);
          });
        } else {
          // 物品：点击跳转详情
          card.addEventListener('click', function () {
            window.location.href = 'item-detail.html?id=' + entity.id + '&returnTo=' + encodeURIComponent(retTo('item', entity.id));
          });
        }

        node.appendChild(card);
        return node;
      }

      // ── 各层节点构建（递归，初始化时若有展开状态则一并构建子节点） ──
      function buildHouseNode(house) {
        var ctx = { houseId: house.id };
        var node = createNodeEl('house', house, ctx);
        if (expandedState['house:' + house.id]) {
          var ch = createChildrenContainer();
          renderChildrenInto(ch, 'house', house, ctx);
          node.appendChild(ch);
        }
        return node;
      }
      function buildFloorNode(floor, parentCtx) {
        var ctx = { houseId: parentCtx.houseId, floorId: floor.id };
        var node = createNodeEl('floor', floor, ctx);
        if (expandedState['floor:' + floor.id]) {
          var ch = createChildrenContainer();
          renderChildrenInto(ch, 'floor', floor, ctx);
          node.appendChild(ch);
        }
        return node;
      }
      function buildRoomNode(room, parentCtx) {
        var ctx = { houseId: parentCtx.houseId, floorId: parentCtx.floorId, roomId: room.id };
        var node = createNodeEl('room', room, ctx);
        if (expandedState['room:' + room.id]) {
          var ch = createChildrenContainer();
          renderChildrenInto(ch, 'room', room, ctx);
          node.appendChild(ch);
        }
        return node;
      }
      function buildContainerNode(container, parentCtx) {
        var ctx = {
          houseId: parentCtx.houseId,
          floorId: parentCtx.floorId,
          roomId: parentCtx.roomId,
          parentContainerId: container.id
        };
        var node = createNodeEl('container', container, ctx);
        if (expandedState['container:' + container.id]) {
          var ch = createChildrenContainer();
          renderChildrenInto(ch, 'container', container, ctx);
          node.appendChild(ch);
        }
        return node;
      }
      function buildItemNode(item, parentCtx) {
        var ctx = {
          houseId: parentCtx.houseId,
          floorId: parentCtx.floorId,
          roomId: parentCtx.roomId,
          containerId: parentCtx.containerId || null
        };
        return createNodeEl('item', item, ctx);
      }

      // ── 向某个子节点容器填充子节点 ──
      function appendGroupLabel(container, label) {
        var el = document.createElement('div');
        el.className = 'tree-group-label';
        el.textContent = label;
        container.appendChild(el);
      }
      function appendEmptyChild(container, msg) {
        var el = document.createElement('div');
        el.className = 'tree-empty-child';
        el.textContent = msg;
        container.appendChild(el);
      }

      function renderChildrenInto(container, type, entity, ctx) {
        if (type === 'house') {
          var floors = S.listFloorsByHouse(entity.id);
          if (floors.length === 0) { appendEmptyChild(container, '暂无楼层，点击右侧菜单新建'); return; }
          floors.forEach(function (f) { container.appendChild(buildFloorNode(f, ctx)); });
        } else if (type === 'floor') {
          var rooms = S.listRoomsByFloor(entity.id);
          if (rooms.length === 0) { appendEmptyChild(container, '暂无房间，点击右侧菜单新建'); return; }
          rooms.forEach(function (r) { container.appendChild(buildRoomNode(r, ctx)); });
        } else if (type === 'room') {
          var containers = S.listContainersByRoom(entity.id);
          var items = S.listItemsByRoom(entity.id);
          if (containers.length === 0 && items.length === 0) {
            appendEmptyChild(container, '暂无内容，点击右侧菜单新建容器或物品');
            return;
          }
          if (containers.length && items.length) appendGroupLabel(container, '容器');
          containers.forEach(function (c) { container.appendChild(buildContainerNode(c, ctx)); });
          if (containers.length && items.length) appendGroupLabel(container, '散放物品');
          items.forEach(function (it) { container.appendChild(buildItemNode(it, ctx)); });
        } else if (type === 'container') {
          var subs = S.listContainersByParent(entity.id);
          var itemsInC = S.listItemsByContainer(entity.id);
          if (subs.length === 0 && itemsInC.length === 0) {
            appendEmptyChild(container, '暂无内容，点击右侧菜单新建子容器或物品');
            return;
          }
          if (subs.length && itemsInC.length) appendGroupLabel(container, '子容器');
          subs.forEach(function (c) { container.appendChild(buildContainerNode(c, ctx)); });
          if (subs.length && itemsInC.length) appendGroupLabel(container, '物品');
          itemsInC.forEach(function (it) { container.appendChild(buildItemNode(it, ctx)); });
        }
      }

      // ── 展开/收起（带 max-height 动画，定向更新，不整体重渲染） ──
      function toggleExpand(type, entity, ctx, nodeEl, expandBtn) {
        var key = type + ':' + entity.id;
        var wasExpanded = !!expandedState[key];
        expandedState[key] = !wasExpanded;
        var existing = nodeEl.querySelector('[data-children]');

        if (!wasExpanded) {
          // 展开
          expandBtn.classList.add('expanded');
          expandBtn.setAttribute('aria-expanded', 'true');
          var ch = createChildrenContainer();
          renderChildrenInto(ch, type, entity, ctx);
          ch.style.maxHeight = '0px';
          nodeEl.appendChild(ch);
          // 强制重排后设置目标高度
          void ch.offsetHeight;
          ch.style.maxHeight = ch.scrollHeight + 'px';
          var done = false;
          var onEnd = function () {
            if (done) return;
            done = true;
            ch.style.maxHeight = 'none';
            ch.removeEventListener('transitionend', onEnd);
          };
          ch.addEventListener('transitionend', onEnd);
          setTimeout(function () { if (!done) onEnd(); }, 400);
        } else {
          // 收起
          expandBtn.classList.remove('expanded');
          expandBtn.setAttribute('aria-expanded', 'false');
          if (existing) {
            existing.style.maxHeight = existing.scrollHeight + 'px';
            void existing.offsetHeight;
            existing.style.maxHeight = '0px';
            var removed = false;
            var onColl = function () {
              if (removed) return;
              removed = true;
              if (existing.parentNode) existing.remove();
              existing.removeEventListener('transitionend', onColl);
            };
            existing.addEventListener('transitionend', onColl);
            setTimeout(function () { if (!removed) onColl(); }, 400);
          }
        }
      }

      // ── 全量渲染（初始化 / 删除后） ──
      function render() {
        var root = document.getElementById('tree-root');
        var emptyState = document.getElementById('empty-state');
        var addHouseBtn = document.getElementById('btn-add-house');
        root.innerHTML = '';
        var houses = S.listHouses();
        if (houses.length === 0) {
          emptyState.style.display = 'flex';
          addHouseBtn.style.display = 'none';
          return;
        }
        emptyState.style.display = 'none';
        addHouseBtn.style.display = 'flex';
        houses.forEach(function (h) {
          root.appendChild(buildHouseNode(h));
        });
      }

      // ── 浮动操作菜单 ──
      var activeMenuBtn = null;
      function hideMenu() {
        var menu = document.getElementById('action-menu');
        menu.style.display = 'none';
        menu.innerHTML = '';
        activeMenuBtn = null;
      }

      function addMenuItem(menu, iconHtml, label, onClick, isDanger) {
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'action-menu-item' + (isDanger ? ' danger' : '');
        item.innerHTML = iconHtml + '<span>' + escapeHtml(label) + '</span>';
        item.addEventListener('click', function (e) {
          e.stopPropagation();
          hideMenu();
          onClick();
        });
        menu.appendChild(item);
      }
      function addDivider(menu) {
        var d = document.createElement('div');
        d.className = 'action-menu-divider';
        menu.appendChild(d);
      }

      function showActionMenu(type, entity, ctx, btnEl) {
        // 切换：再次点击同一按钮则关闭
        if (activeMenuBtn === btnEl) { hideMenu(); return; }
        hideMenu();
        var menu = document.getElementById('action-menu');
        menu.innerHTML = '';

        // 新建下一层
        if (type === 'house') {
          addMenuItem(menu, ICONS.plus, '新建楼层', function () {
            go('form.html?type=floor&houseId=' + entity.id + '&returnTo=' + encodeURIComponent(retTo('house', entity.id)));
          });
        } else if (type === 'floor') {
          addMenuItem(menu, ICONS.plus, '新建房间', function () {
            go('form.html?type=room&floorId=' + entity.id + '&returnTo=' + encodeURIComponent(retTo('floor', entity.id)));
          });
        } else if (type === 'room') {
          addMenuItem(menu, ICONS.box, '新建容器', function () {
            go('form.html?type=container&roomId=' + entity.id + '&returnTo=' + encodeURIComponent(retTo('room', entity.id)));
          });
          addMenuItem(menu, ICONS.cube, '新建物品', function () {
            go('form.html?type=item&initialHouseId=' + ctx.houseId + '&initialFloorId=' + ctx.floorId +
              '&initialRoomId=' + entity.id + '&returnTo=' + encodeURIComponent(retTo('room', entity.id)));
          });
        } else if (type === 'container') {
          addMenuItem(menu, ICONS.box, '新建子容器', function () {
            go('form.html?type=container&roomId=' + ctx.roomId + '&parentContainerId=' + entity.id +
              '&returnTo=' + encodeURIComponent(retTo('container', entity.id)));
          });
          addMenuItem(menu, ICONS.cube, '新建物品', function () {
            go('form.html?type=item&initialHouseId=' + ctx.houseId + '&initialFloorId=' + ctx.floorId +
              '&initialRoomId=' + ctx.roomId + '&initialContainerId=' + entity.id +
              '&returnTo=' + encodeURIComponent(retTo('container', entity.id)));
          });
        }

        if (type !== 'item') addDivider(menu);

        // 查看位置标识
        addMenuItem(menu, ICONS.qr, '查看位置标识', function () {
          go('location-code.html?type=' + type + '&id=' + entity.id + '&returnTo=' + encodeURIComponent(retTo(type, entity.id)));
        });

        // 编辑
        addMenuItem(menu, ICONS.edit, '编辑', function () {
          go('form.html?type=' + type + '&id=' + entity.id + '&returnTo=' + encodeURIComponent(retTo(type, entity.id)));
        });

        addDivider(menu);

        // 删除
        addMenuItem(menu, ICONS.trash, '删除', function () {
          if (confirm('确认删除“' + (entity.name || '') + '”及其所有子内容？此操作不可恢复。')) {
            deleteEntity(type, entity.id);
            App.showToast('已删除');
            render();
          }
        }, true);

        // 定位（避免溢出视口）
        menu.style.display = 'block';
        var rect = btnEl.getBoundingClientRect();
        var menuW = menu.offsetWidth;
        var menuH = menu.offsetHeight;
        var x = rect.right - menuW;
        var y = rect.bottom + 6;
        if (y + menuH > window.innerHeight - 8) y = rect.top - menuH - 6;
        if (x < 8) x = 8;
        if (y < 8) y = 8;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        activeMenuBtn = btnEl;
      }

      // ── 删除实体（按类型分发） ──
      function deleteEntity(type, id) {
        if (type === 'house') S.softDeleteHouse(id);
        else if (type === 'floor') S.softDeleteFloor(id);
        else if (type === 'room') S.softDeleteRoom(id);
        else if (type === 'container') S.softDeleteContainer(id);
        else if (type === 'item') S.softDeleteItem(id);
      }

      // ── 跳转 ──
      function go(url) { window.location.href = url; }

      // ── returnTo（带 expand 参数，便于返回后自动展开到该实体） ──
      function retTo(type, id) {
        return 'hierarchy.html?expand=' + type + ':' + id;
      }

      // ── 路径解析（用于 expand 参数自动展开父级链） ──
      function resolvePath(type, id) {
        var path = { house: null, floor: null, room: null, containerChain: [], item: null };
        if (type === 'house') {
          path.house = S.getHouse(id);
          return path.house ? path : null;
        }
        if (type === 'floor') {
          var f = S.getFloor(id);
          if (!f) return null;
          path.floor = f;
          path.house = S.getHouse(f.houseId);
          return path.house ? path : null;
        }
        if (type === 'room') {
          var r = S.getRoom(id);
          if (!r) return null;
          path.room = r;
          path.floor = S.getFloor(r.floorId);
          if (path.floor) path.house = S.getHouse(path.floor.houseId);
          return path.house ? path : null;
        }
        if (type === 'container') {
          var c = S.getContainer(id);
          if (!c) return null;
          var chain = [c];
          var cur = c;
          while (cur.parentContainerId) {
            var parent = S.getContainer(cur.parentContainerId);
            if (!parent) break;
            chain.unshift(parent);
            cur = parent;
          }
          path.containerChain = chain;
          var rootC = chain[0];
          var room = S.getRoom(rootC.roomId);
          if (room) {
            path.room = room;
            path.floor = S.getFloor(room.floorId);
            if (path.floor) path.house = S.getHouse(path.floor.houseId);
          }
          return path.house ? path : null;
        }
        if (type === 'item') {
          var it = S.getItem(id);
          if (!it) return null;
          path.item = it;
          if (it.containerId) {
            var chain2 = [];
            var cur2 = S.getContainer(it.containerId);
            while (cur2) {
              chain2.unshift(cur2);
              cur2 = cur2.parentContainerId ? S.getContainer(cur2.parentContainerId) : null;
            }
            path.containerChain = chain2;
            if (chain2.length) {
              var rootC2 = chain2[0];
              var room2 = S.getRoom(rootC2.roomId);
              if (room2) {
                path.room = room2;
                path.floor = S.getFloor(room2.floorId);
                if (path.floor) path.house = S.getHouse(path.floor.houseId);
              }
            }
          } else if (it.roomId) {
            var room3 = S.getRoom(it.roomId);
            if (room3) {
              path.room = room3;
              path.floor = S.getFloor(room3.floorId);
              if (path.floor) path.house = S.getHouse(path.floor.houseId);
            }
          }
          return path.house ? path : null;
        }
        return null;
      }

      // ── 应用 URL 中的 expand 参数：展开父级链 ──
      function applyExpandParam() {
        var params = new URLSearchParams(window.location.search);
        var expand = params.get('expand');
        if (!expand) return null;
        var parts = expand.split(':');
        if (parts.length !== 2) return null;
        var type = parts[0];
        var id = parts[1];
        var path = resolvePath(type, id);
        if (!path) return null;
        if (path.house) expandedState['house:' + path.house.id] = true;
        if (path.floor) expandedState['floor:' + path.floor.id] = true;
        if (path.room) expandedState['room:' + path.room.id] = true;
        if (path.containerChain) {
          path.containerChain.forEach(function (c) { expandedState['container:' + c.id] = true; });
        }
        return { type: type, id: id };
      }

      // ── 顶部按钮事件 ──
      function goAddHouse() {
        go('form.html?type=house&returnTo=' + encodeURIComponent('hierarchy.html'));
      }
      document.getElementById('btn-add-house').addEventListener('click', goAddHouse);
      document.getElementById('btn-add-house-empty').addEventListener('click', goAddHouse);

      document.getElementById('btn-back').addEventListener('click', function () {
        if (window.history.length > 1) history.back();
        else window.location.href = 'home.html';
      });
      document.getElementById('btn-qr').addEventListener('click', function () {
        window.location.href = 'scan.html?returnTo=' + encodeURIComponent('hierarchy.html');
      });

      // ── 点击外部 / 滚动 / 视口变化时关闭菜单 ──
      document.addEventListener('click', function (e) {
        var menu = document.getElementById('action-menu');
        if (menu.style.display === 'none') return;
        if (!menu.contains(e.target) && !e.target.closest('.tree-menu-btn')) {
          hideMenu();
        }
      });
      window.addEventListener('scroll', hideMenu, true);
      window.addEventListener('resize', hideMenu);

      // ── 启动 ──
      var target = applyExpandParam();
      render();
      if (target) {
        // 等待渲染后滚动到目标
        requestAnimationFrame(function () {
          var el = document.querySelector('[data-node-key="' + target.type + ':' + target.id + '"]');
          if (el && el.scrollIntoView) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      }
    })();
    </script>
</body>
</html>
