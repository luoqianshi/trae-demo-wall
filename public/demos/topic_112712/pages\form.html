<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>表单 - 归位</title>
  <style id="theme-vars">
:root {
  --color-primary: #D81B60;
  --color-primary-light: #F06292;
  --color-primary-dark: #AD1457;
  --color-primary-bg: #FCE4EC;
  --color-primary-bg-soft: #FFF0F5;
  --color-secondary: #1976D2;
  --color-secondary-bg: #E3F2FD;
  --color-bg: #FAFAFA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F3F4F6;
  --color-surface: #FFFFFF;
  --color-surface-dim: #F9FAFB;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F0;
  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #1976D2;
  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --text-xs: 10px;
  --text-xs-lh: 14px;
  --text-sm: 12px;
  --text-sm-lh: 18px;
  --text-base: 14px;
  --text-base-lh: 22px;
  --text-lg: 16px;
  --text-lg-lh: 24px;
  --text-xl: 20px;
  --text-xl-lh: 28px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body class="min-h-screen font-sans antialiased">
  <main class="app-shell">
    <div class="app-frame" style="padding-bottom: 32px;">

      <!-- ── App Bar ── -->
      <header class="app-bar">
        <div class="app-bar-left">
          <button class="app-bar-back" data-dom-id="nav-back" type="button" aria-label="返回">
            <i data-lucide="arrow-left"></i>
          </button>
          <h1 class="app-bar-title" id="form-title">新建</h1>
        </div>
      </header>

      <!-- ── Form Body ── -->
      <div class="page-content" style="padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4);">

        <!-- Name Field (所有类型通用) -->
        <section class="section-card" id="card-name">
          <h2 class="section-card__title" id="name-label">名称</h2>
          <input
            id="input-name" type="text"
            placeholder="请输入名称"
            style="width:100%; border:1px solid var(--color-border); border-radius: var(--radius-md); padding: 10px 12px; font-size: var(--text-base); font-family: var(--font-sans); outline: none; background: var(--color-surface);"
          />
          <div id="name-error" style="color: var(--state-error); font-size: var(--text-sm); margin-top: var(--space-1); display: none;"></div>
        </section>

        <!-- Level Field (floor 专用) -->
        <section class="section-card" id="card-level" style="display: none;">
          <h2 class="section-card__title">楼层号</h2>
          <input
            id="input-level" type="number" step="1"
            placeholder="如 0, 1, -1"
            style="width:100%; border:1px solid var(--color-border); border-radius: var(--radius-md); padding: 10px 12px; font-size: var(--text-base); font-family: var(--font-sans); outline: none; background: var(--color-surface);"
          />
          <div id="level-error" style="color: var(--state-error); font-size: var(--text-sm); margin-top: var(--space-1); display: none;"></div>
        </section>

        <!-- Type Field (container 专用) -->
        <section class="section-card" id="card-container-type" style="display: none;">
          <h2 class="section-card__title">容器类型 (可选)</h2>
          <input
            id="input-container-type" type="text"
            placeholder="如 drawer, cabinet, box"
            style="width:100%; border:1px solid var(--color-border); border-radius: var(--radius-md); padding: 10px 12px; font-size: var(--text-base); font-family: var(--font-sans); outline: none; background: var(--color-surface);"
          />
        </section>

        <!-- Tags Field (item 专用) -->
        <section class="section-card" id="card-tags" style="display: none;">
          <h2 class="section-card__title">标签 (逗号分隔)</h2>
          <input
            id="input-tags" type="text"
            placeholder="如 kitchen, appliance"
            style="width:100%; border:1px solid var(--color-border); border-radius: var(--radius-md); padding: 10px 12px; font-size: var(--text-base); font-family: var(--font-sans); outline: none; background: var(--color-surface);"
          />
          <div id="tags-hint" style="color: var(--color-text-tertiary); font-size: var(--text-xs); margin-top: var(--space-1);">单个标签不超过 20 字符，自动去重</div>
        </section>

        <!-- Note Field (item 专用) -->
        <section class="section-card" id="card-note" style="display: none;">
          <h2 class="section-card__title">备注 (可选，≤500 字符)</h2>
          <textarea
            id="input-note" rows="4"
            placeholder="添加备注..."
            style="width:100%; border:1px solid var(--color-border); border-radius: var(--radius-md); padding: 10px 12px; font-size: var(--text-base); font-family: var(--font-sans); outline: none; background: var(--color-surface); resize: vertical;"
          ></textarea>
          <div id="note-count" style="color: var(--color-text-tertiary); font-size: var(--text-xs); margin-top: var(--space-1); text-align: right;">0 / 500</div>
        </section>

        <!-- Location Field (item 专用) -->
        <section class="section-card" id="card-location" style="display: none;">
          <h2 class="section-card__title">位置 <span style="color: var(--state-error);">*</span></h2>
          <div id="location-display" style="background: var(--color-bg-sunken); border-radius: var(--radius-md); padding: var(--space-3); min-height: 48px; display: flex; align-items: center; gap: var(--space-2); cursor: pointer; color: var(--color-text-secondary);" data-dom-id="btn-pick-location">
            <i data-lucide="map-pin" style="width: 18px; height: 18px;"></i>
            <span id="location-text">点击选择位置</span>
          </div>
          <div id="location-error" style="color: var(--state-error); font-size: var(--text-sm); margin-top: var(--space-1); display: none;"></div>
        </section>

        <!-- Submit Buttons -->
        <div style="display: flex; gap: var(--space-3); margin-top: var(--space-4);">
          <button id="btn-cancel" type="button" style="flex: 1; padding: 12px 20px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-secondary); font-size: var(--text-base); font-weight: var(--font-weight-medium); cursor: pointer;">
            取消
          </button>
          <button id="btn-submit" type="button" style="flex: 2; padding: 12px 20px; border-radius: var(--radius-md); border: none; background: var(--color-primary); color: var(--color-text-inverse); font-size: var(--text-base); font-weight: var(--font-weight-semibold); cursor: pointer; box-shadow: var(--shadow-sm);">
            保存
          </button>
        </div>

      </div>
    </div>
  </main>

  <!-- ── 位置选择 Modal ── -->
  <div id="location-modal" style="display:none; position:fixed; inset:0; background: rgba(0,0,0,0.5); z-index:9998; align-items:center; justify-content:center; padding: 16px;">
    <div id="location-modal-content" style="background: var(--color-surface); border-radius: var(--radius-xl); width: 100%; max-width: 380px; max-height: 80vh; display: flex; flex-direction: column; animation: modalFadeIn 0.2s ease;">
      <!-- Modal Header -->
      <div style="padding: var(--space-4); border-bottom: 1px solid var(--color-divider); display: flex; justify-content: space-between; align-items: center;">
        <h3 id="modal-title" style="font-size: var(--text-lg); font-weight: var(--font-weight-bold);">选择位置</h3>
        <button id="modal-close" type="button" style="width: 32px; height: 32px; border: none; background: transparent; cursor: pointer; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center;">
          <i data-lucide="x"></i>
        </button>
      </div>
      <!-- 扫描位置标识入口 -->
      <div style="padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--color-border-light); background: var(--color-primary-bg-soft);">
        <button id="modal-scan-location" type="button" style="display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border: 1px dashed var(--color-primary); background: transparent; color: var(--color-primary); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-weight-medium); cursor: pointer; width: 100%; font-family: var(--font-sans);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h7v7h-7z"/></svg>
          <span>扫描位置标识</span>
        </button>
      </div>
      <!-- Breadcrumb -->
      <div id="modal-breadcrumb" style="padding: var(--space-2) var(--space-4); display: flex; flex-wrap: wrap; gap: var(--space-1); border-bottom: 1px solid var(--color-border-light); background: var(--color-surface-dim);"></div>
      <!-- List -->
      <div id="modal-list" style="flex: 1; overflow-y: auto; padding: var(--space-2);"></div>
      <!-- Footer -->
      <div id="modal-footer" style="padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-divider); display: none;"></div>
    </div>
  </div>

  <script src="../assets/store.js"></script>
  <script>
  /* ============================================================
     form.html - 统一表单逻辑
     URL: form.html?type=<house|floor|room|container|item>&id=<edit>&houseId=&floorId=&roomId=&parentContainerId=
     ============================================================ */
  (function () {
    'use strict';
    var S = window.GuiweiStore;

    // ── 解析 URL query ──
    var params = new URLSearchParams(window.location.search);
    var type = params.get('type') || 'house';
    var editId = params.get('id');
    var houseId = params.get('houseId');
    var floorId = params.get('floorId');
    var roomId = params.get('roomId');
    var parentContainerId = params.get('parentContainerId');
    var returnTo = params.get('returnTo') || '';
    var scanResultType = params.get('scanResultType');
    var scanResultId = params.get('scanResultId');

    // 中文标签映射
    var TYPE_LABELS = {
      house: '房子', floor: '楼层', room: '房间',
      container: '容器', item: '物品'
    };

    // ── DOM 引用 ──
    var $ = function (id) { return document.getElementById(id); };
    var inputName = $('input-name');
    var inputLevel = $('input-level');
    var inputContainerType = $('input-container-type');
    var inputTags = $('input-tags');
    var inputNote = $('input-note');

    // ── 表单状态（编辑模式预填） ──
    var existing = null;
    var locationSelection = null; // {house, floor, room, container?}

    // ── 初始化表单 ──
    function initForm() {
      // 标题
      var action = editId ? '编辑' : '新建';
      $('form-title').textContent = action + TYPE_LABELS[type];

      // 名称标签微调
      var nameLabel = $('name-label');
      if (type === 'house') nameLabel.textContent = '房子名称';
      else if (type === 'floor') nameLabel.textContent = '楼层名称';
      else if (type === 'room') nameLabel.textContent = '房间名称';
      else if (type === 'container') nameLabel.textContent = '容器名称';
      else if (type === 'item') nameLabel.textContent = '物品名称';

      // 显示/隐藏字段卡片
      $('card-level').style.display = (type === 'floor') ? 'block' : 'none';
      $('card-container-type').style.display = (type === 'container') ? 'block' : 'none';
      $('card-tags').style.display = (type === 'item') ? 'block' : 'none';
      $('card-note').style.display = (type === 'item') ? 'block' : 'none';
      $('card-location').style.display = (type === 'item') ? 'block' : 'none';

      // 编辑模式：预填字段
      if (editId) loadExisting();

      // 新建模式：floor 自动建议 level
      if (!editId && type === 'floor' && houseId) {
        inputLevel.value = S.suggestFloorLevel(houseId);
      }

      // 监听 note 字数
      if (type === 'item') {
        inputNote.addEventListener('input', function () {
          $('note-count').textContent = (inputNote.value.length || 0) + ' / 500';
        });
      }

      // 位置选择按钮
      if (type === 'item') {
        $('location-display').addEventListener('click', openLocationModal);
        $('modal-scan-location').addEventListener('click', goToScanLocation);
        // 如果 URL 带了 initial location 参数（从层级浏览器跳入），预填
        var initHouseId = params.get('initialHouseId');
        var initFloorId = params.get('initialFloorId');
        var initRoomId = params.get('initialRoomId');
        var initContainerId = params.get('initialContainerId');
        if (initHouseId) {
          preselectLocation(initHouseId, initFloorId, initRoomId, initContainerId);
        }
        // 扫码返回预填：scanResultType/scanResultId 优先级高于 initial* 参数
        if (scanResultType && scanResultId) {
          preselectLocationByScan(scanResultType, scanResultId);
          // 清理 URL 中的扫码参数，避免刷新时重复加载
          cleanScanParamsFromUrl();
        }
      }
    }

    // ── 跳转到 scan.html 进行位置扫码 ──
    function goToScanLocation() {
      var currentUrl = window.location.pathname.split('/').pop() + window.location.search + window.location.hash;
      window.location.href = 'scan.html?mode=location&returnTo=' + encodeURIComponent(currentUrl);
    }

    // ── 清理 URL 中的 scanResultType / scanResultId ──
    function cleanScanParamsFromUrl() {
      var url = new URL(window.location.href);
      url.searchParams.delete('scanResultType');
      url.searchParams.delete('scanResultId');
      history.replaceState(null, '', url.toString());
    }

    // ── 扫码结果预填：根据 type/id 反向解析 house/floor/room/container 链 ──
    function preselectLocationByScan(sType, sId) {
      var sel = { house: null, floor: null, room: null, container: null };
      var entityName = '';
      if (sType === 'house') {
        var h = S.getHouse(sId);
        if (h) { sel.house = h; entityName = h.name; }
      } else if (sType === 'floor') {
        var f = S.getFloor(sId);
        if (f) {
          sel.floor = f;
          sel.house = S.getHouse(f.houseId);
          entityName = f.name;
        }
      } else if (sType === 'room') {
        var r = S.getRoom(sId);
        if (r) {
          sel.room = r;
          sel.floor = S.getFloor(r.floorId);
          if (sel.floor) sel.house = S.getHouse(sel.floor.houseId);
          entityName = r.name;
        }
      } else if (sType === 'container') {
        var c = S.getContainer(sId);
        if (c) {
          sel.container = c;
          sel.room = S.getRoom(c.roomId);
          if (sel.room) {
            sel.floor = S.getFloor(sel.room.floorId);
            if (sel.floor) sel.house = S.getHouse(sel.floor.houseId);
          }
          entityName = c.name;
        }
      }
      if (entityName) {
        locationSelection = sel;
        renderLocation();
        toast('已通过扫码识别位置：' + entityName);
      }
    }

    function loadExisting() {
      if (type === 'house') existing = S.getHouse(editId);
      else if (type === 'floor') existing = S.getFloor(editId);
      else if (type === 'room') existing = S.getRoom(editId);
      else if (type === 'container') existing = S.getContainer(editId);
      else if (type === 'item') existing = S.getItem(editId);

      if (!existing) {
        alert('未找到要编辑的' + TYPE_LABELS[type]);
        goBack();
        return;
      }
      inputName.value = existing.name || '';
      if (type === 'floor') inputLevel.value = String(existing.level);
      if (type === 'container' && existing.type) inputContainerType.value = existing.type;
      if (type === 'item') {
        inputTags.value = (existing.tags || []).join(', ');
        inputNote.value = existing.note || '';
        $('note-count').textContent = (inputNote.value.length || 0) + ' / 500';
        // 预填 location：从 item 反向解析
        var path = S.resolveItemPath(editId);
        if (path) {
          locationSelection = {
            house: path.house, floor: path.floor, room: path.room,
            container: path.container
          };
          renderLocation();
        }
      }
    }

    function preselectLocation(hId, fId, rId, cId) {
      var h = hId ? S.getHouse(hId) : null;
      var f = fId ? S.getFloor(fId) : null;
      var r = rId ? S.getRoom(rId) : null;
      var c = cId ? S.getContainer(cId) : null;
      if (h && f && r) {
        locationSelection = { house: h, floor: f, room: r, container: c || null };
        renderLocation();
      }
    }

    function renderLocation() {
      if (!locationSelection) {
        $('location-text').textContent = '点击选择位置';
        return;
      }
      var parts = [];
      if (locationSelection.house) parts.push(locationSelection.house.name);
      if (locationSelection.floor) parts.push(locationSelection.floor.name);
      if (locationSelection.room) parts.push(locationSelection.room.name);
      if (locationSelection.container) parts.push(locationSelection.container.name);
      $('location-text').textContent = parts.join(' / ');
      $('location-display').style.color = 'var(--color-text-primary)';
    }

    // ============================================================
    // 位置选择 Modal：4 步级联 house → floor → room → container(optional)
    // ============================================================
    var modalStep = 'house'; // house | floor | room | container
    var modalSelection = null; // 临时
    function openLocationModal() {
      $('location-modal').style.display = 'flex';
      // 初始化：从已有 selection 开始，否则从 house 步开始
      if (locationSelection && locationSelection.house) {
        modalSelection = JSON.parse(JSON.stringify(locationSelection));
        // 找到当前最深步骤
        if (modalSelection.container) modalStep = 'container';
        else if (modalSelection.room) modalStep = 'room';
        else if (modalSelection.floor) modalStep = 'floor';
        else modalStep = 'house';
      } else {
        modalSelection = {};
        modalStep = 'house';
      }
      renderModalStep();
    }

    function closeLocationModal() {
      $('location-modal').style.display = 'none';
    }

    function renderModalStep() {
      var title = '选择位置';
      var list = [];
      var breadcrumb = [];
      // 构造列表项
      if (modalStep === 'house') {
        title = '选择房子';
        list = S.listHouses().map(function (h) { return { id: h.id, name: h.name, sub: h.address || '', data: h }; });
      } else if (modalStep === 'floor') {
        title = '选择楼层';
        list = S.listFloorsByHouse(modalSelection.house.id).map(function (f) { return { id: f.id, name: f.name, sub: 'Level ' + f.level, data: f }; });
        breadcrumb.push({ label: modalSelection.house.name, step: 'house' });
      } else if (modalStep === 'room') {
        title = '选择房间';
        list = S.listRoomsByFloor(modalSelection.floor.id).map(function (r) { return { id: r.id, name: r.name, sub: '', data: r }; });
        breadcrumb.push({ label: modalSelection.house.name, step: 'house' });
        breadcrumb.push({ label: modalSelection.floor.name, step: 'floor' });
      } else if (modalStep === 'container') {
        title = '选择容器 (可选)';
        // 顶部"直接放在此房间"
        breadcrumb.push({ label: modalSelection.house.name, step: 'house' });
        breadcrumb.push({ label: modalSelection.floor.name, step: 'floor' });
        breadcrumb.push({ label: modalSelection.room.name, step: 'room' });
        // 列出根容器
        list = S.listContainersByRoom(modalSelection.room.id).map(function (c) { return { id: c.id, name: c.name, sub: c.type || '', data: c }; });
      }
      $('modal-title').textContent = title;

      // 渲染 breadcrumb
      var bcEl = $('modal-breadcrumb');
      bcEl.innerHTML = '';
      breadcrumb.forEach(function (b) {
        var chip = document.createElement('span');
        chip.textContent = b.label;
        chip.style.cssText = 'padding: 4px 10px; background: var(--color-primary-bg); color: var(--color-primary-dark); border-radius: var(--radius-full); font-size: var(--text-xs); cursor: pointer;';
        chip.addEventListener('click', function () {
          modalStep = b.step;
          // 清掉更深的 selection
          if (b.step === 'house') { modalSelection.floor = null; modalSelection.room = null; modalSelection.container = null; }
          else if (b.step === 'floor') { modalSelection.room = null; modalSelection.container = null; }
          else if (b.step === 'room') { modalSelection.container = null; }
          renderModalStep();
        });
        bcEl.appendChild(chip);
      });

      // 渲染 list
      var listEl = $('modal-list');
      listEl.innerHTML = '';
      if (modalStep === 'container') {
        // 顶部"直接放在此房间"选项
        var directItem = document.createElement('div');
        directItem.style.cssText = 'padding: 14px 16px; border-radius: var(--radius-md); cursor: pointer; background: var(--color-primary-bg-soft); color: var(--color-primary-dark); margin-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-2);';
        directItem.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span>直接放在此房间</span>';
        directItem.addEventListener('click', function () {
          modalSelection.container = null;
          finishLocationSelection();
        });
        listEl.appendChild(directItem);
      }
      if (list.length === 0) {
        var empty = document.createElement('div');
        empty.style.cssText = 'padding: 32px; text-align: center; color: var(--color-text-tertiary);';
        if (modalStep === 'house') {
          empty.textContent = '暂无房子。请先创建一个房子。';
        } else if (modalStep === 'floor') {
          empty.textContent = '此房子下暂无楼层。请先创建楼层。';
        } else if (modalStep === 'room') {
          empty.textContent = '此楼层下暂无房间。请先创建房间。';
        } else {
          empty.textContent = '此房间下暂无容器。可直接放在房间内。';
        }
        listEl.appendChild(empty);
      } else {
        list.forEach(function (item) {
          var row = document.createElement('div');
          row.style.cssText = 'padding: 14px 16px; border-radius: var(--radius-md); cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;';
          row.addEventListener('mouseenter', function () { row.style.background = 'var(--color-bg-sunken)'; });
          row.addEventListener('mouseleave', function () { row.style.background = 'transparent'; });
          var left = document.createElement('div');
          var name = document.createElement('div');
          name.textContent = item.name;
          name.style.cssText = 'font-size: var(--text-base); font-weight: var(--font-weight-medium); color: var(--color-text-primary);';
          left.appendChild(name);
          if (item.sub) {
            var sub = document.createElement('div');
            sub.textContent = item.sub;
            sub.style.cssText = 'font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: 2px;';
            left.appendChild(sub);
          }
          row.appendChild(left);
          var chev = document.createElement('span');
          chev.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="9 18 15 12 9 6"/></svg>';
          chev.style.color = 'var(--color-text-tertiary)';
          row.appendChild(chev);
          row.addEventListener('click', function () {
            // 进入下一步
            if (modalStep === 'house') {
              modalSelection.house = item.data;
              modalSelection.floor = null; modalSelection.room = null; modalSelection.container = null;
              modalStep = 'floor';
            } else if (modalStep === 'floor') {
              modalSelection.floor = item.data;
              modalSelection.room = null; modalSelection.container = null;
              modalStep = 'room';
            } else if (modalStep === 'room') {
              modalSelection.room = item.data;
              modalSelection.container = null;
              modalStep = 'container';
            } else if (modalStep === 'container') {
              modalSelection.container = item.data;
              finishLocationSelection();
            }
            renderModalStep();
          });
          listEl.appendChild(row);
        });
      }

      // Footer：room 步可选"直接放在此房间"
      var footerEl = $('modal-footer');
      if (modalStep === 'room') {
        footerEl.style.display = 'block';
        footerEl.innerHTML = '';
        var btn = document.createElement('button');
        btn.textContent = '直接放在此房间（不选容器）';
        btn.style.cssText = 'width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--color-primary); background: transparent; color: var(--color-primary); font-size: var(--text-base); font-weight: var(--font-weight-medium); cursor: pointer;';
        btn.addEventListener('click', function () {
          modalSelection.container = null;
          finishLocationSelection();
        });
        footerEl.appendChild(btn);
      } else {
        footerEl.style.display = 'none';
      }
    }

    function finishLocationSelection() {
      locationSelection = modalSelection;
      renderLocation();
      closeLocationModal();
    }

    $('modal-close').addEventListener('click', closeLocationModal);
    $('location-modal').addEventListener('click', function (e) {
      if (e.target === this) closeLocationModal();
    });

    // ============================================================
    // 提交保存
    // ============================================================
    function showFieldError(errorId, msg) {
      var el = $(errorId);
      el.textContent = msg;
      el.style.display = 'block';
    }
    function clearErrors() {
      ['name-error', 'level-error', 'location-error'].forEach(function (id) {
        $(id).style.display = 'none';
      });
    }

    function submit() {
      clearErrors();
      var name = inputName.value.trim();
      if (!name) {
        showFieldError('name-error', '名称不能为空');
        inputName.focus();
        return;
      }
      if (name.length > 100) {
        showFieldError('name-error', '名称不能超过 100 字符');
        return;
      }

      if (type === 'house') {
        if (editId) {
          S.upsertHouse({ id: editId, name: name, address: existing.address });
        } else {
          S.upsertHouse({ name: name });
        }
        toast('已保存');
        goBack();
        return;
      }

      if (type === 'floor') {
        var levelRaw = inputLevel.value.trim();
        if (levelRaw === '') { showFieldError('level-error', '楼层号不能为空'); inputLevel.focus(); return; }
        var level = parseInt(levelRaw, 10);
        if (isNaN(level)) { showFieldError('level-error', '楼层号必须是整数'); inputLevel.focus(); return; }
        if (editId) {
          S.upsertFloor({ id: editId, houseId: existing.houseId, name: name, level: level });
        } else {
          if (!houseId) { alert('缺少 houseId'); return; }
          S.upsertFloor({ houseId: houseId, name: name, level: level });
        }
        toast('已保存');
        goBack();
        return;
      }

      if (type === 'room') {
        if (editId) {
          S.upsertRoom({ id: editId, floorId: existing.floorId, name: name });
        } else {
          if (!floorId) { alert('缺少 floorId'); return; }
          S.upsertRoom({ floorId: floorId, name: name });
        }
        toast('已保存');
        goBack();
        return;
      }

      if (type === 'container') {
        var ctype = inputContainerType.value.trim() || null;
        if (editId) {
          S.upsertContainer({
            id: editId, roomId: existing.roomId,
            parentContainerId: existing.parentContainerId,
            name: name, type: ctype
          });
        } else {
          if (!roomId) { alert('缺少 roomId'); return; }
          S.upsertContainer({
            roomId: roomId, parentContainerId: parentContainerId || null,
            name: name, type: ctype
          });
        }
        toast('已保存');
        goBack();
        return;
      }

      if (type === 'item') {
        // tags 解析
        var tagsRaw = inputTags.value;
        var tags = tagsRaw.split(',').map(function (t) { return t.trim(); }).filter(function (t) { return t; });
        // 截断超长 tag
        tags = tags.map(function (t) { return t.length > 20 ? t.substring(0, 20) : t; });
        // 去重
        var seen = {}; tags = tags.filter(function (t) { if (seen[t]) return false; seen[t] = true; return true; });

        var note = inputNote.value.trim();
        if (note.length > 500) { alert('备注不能超过 500 字符'); return; }

        // location 必填
        if (!locationSelection || !locationSelection.room) {
          showFieldError('location-error', '请选择物品所在位置');
          return;
        }
        // XOR：选了 container 就只设 containerId，否则设 roomId
        var containerId = locationSelection.container ? locationSelection.container.id : null;
        var roomId_ = locationSelection.container ? null : locationSelection.room.id;

        if (editId) {
          S.upsertItem({
            id: editId, code: existing.code, name: name, tags: tags,
            note: note || null, containerId: containerId, roomId: roomId_,
            createdAt: existing.createdAt
          });
        } else {
          S.upsertItem({
            name: name, tags: tags, note: note || null,
            containerId: containerId, roomId: roomId_
          });
        }
        toast('已保存');
        goBack();
        return;
      }
    }

    function toast(msg) {
      var t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(function () { t.classList.add('show'); });
      setTimeout(function () {
        t.classList.remove('show');
        setTimeout(function () { t.remove(); }, 300);
      }, 1500);
    }

    function goBack() {
      if (returnTo) {
        window.location.href = returnTo;
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'home.html';
      }
    }

    // ── 事件绑定 ──
    $('btn-cancel').addEventListener('click', goBack);
    $('btn-submit').addEventListener('click', submit);
    $('nav-back') && $('nav-back').addEventListener('click', goBack);
    // Enter 提交
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type === 'text') {
        e.preventDefault();
        submit();
      }
    });

    // ── 启动 ──
    initForm();
    if (window.lucide) window.lucide.createIcons();
  })();
  </script>

  <style>
    .app-shell { max-width: 430px; margin: 0 auto; min-height: 100vh; background-color: var(--color-bg); font-family: var(--font-sans); position: relative; }
    .app-frame { padding-bottom: 32px; }
    .app-bar { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); padding-top: calc(var(--space-3) + env(safe-area-inset-top, 0px)); position: sticky; top: 0; z-index: 100; background-color: var(--color-surface); }
    .app-bar-left { display: flex; align-items: center; gap: var(--space-2); }
    .app-bar-back { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full); border: none; background: transparent; cursor: pointer; color: var(--color-text-primary); transition: background-color 0.2s ease; }
    .app-bar-back:hover { background-color: var(--color-bg-sunken); }
    .app-bar-back svg { width: 22px; height: 22px; }
    .app-bar-title { font-size: var(--text-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary); }
    .section-card { background-color: var(--color-surface); border-radius: var(--radius-lg); border: 1px solid var(--color-border); padding: var(--space-4); box-shadow: var(--shadow-sm); }
    .section-card__title { font-size: var(--text-sm); font-weight: var(--font-weight-semibold); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-3); }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</body>
</html>
