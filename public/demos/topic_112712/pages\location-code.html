<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>位置标识 - 归位</title>
  <style id="theme-vars">
:root {
  /* ── Brand Colors ── */
  --color-primary: #D81B60;
  --color-primary-light: #F06292;
  --color-primary-dark: #AD1457;
  --color-primary-bg: #FCE4EC;
  --color-primary-bg-soft: #FFF0F5;

  --color-secondary: #1976D2;
  --color-secondary-light: #64B5F6;
  --color-secondary-dark: #0D47A1;
  --color-secondary-bg: #E3F2FD;
  --color-secondary-bg-soft: #F0F7FF;

  --color-accent-purple: #8B5CF6;
  --color-accent-cyan: #06B6D4;
  --color-accent-teal: #14B8A6;
  --color-accent-orange: #F97316;

  /* ── Neutral Scale ── */
  --color-bg: #FAFAFA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F3F4F6;
  --color-surface: #FFFFFF;
  --color-surface-dim: #F9FAFB;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F0;

  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #1976D2;

  /* ── State Colors ── */
  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography ── */
  --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;

  --text-xs: 10px;
  --text-xs-lh: 14px;
  --text-sm: 12px;
  --text-sm-lh: 18px;
  --text-base: 14px;
  --text-base-lh: 22px;
  --text-lg: 16px;
  --text-lg-lh: 24px;
  --text-xl: 20px;
  --text-xl-lh: 28px;
  --text-2xl: 24px;
  --text-2xl-lh: 32px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
}

/* Dark mode */
.dark {
  --color-bg: #111827;
  --color-bg-elevated: #1F2937;
  --color-bg-sunken: #0F172A;
  --color-surface: #1F2937;
  --color-surface-dim: #374151;

  --color-border: #374151;
  --color-border-light: #1F2937;
  --color-divider: #374151;

  --color-text-primary: #F9FAFB;
  --color-text-secondary: #9CA3AF;
  --color-text-tertiary: #6B7280;
  --color-text-inverse: #111827;
  --color-text-link: #64B5F6;

  --color-primary-bg: #4A1128;
  --color-primary-bg-soft: #3B0F20;
  --color-secondary-bg: #0C2D5E;
  --color-secondary-bg-soft: #0A244D;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.35);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.5);
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <link rel="stylesheet" href="../assets/app.css" />
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      line-height: var(--text-base-lh);
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: var(--font-sans); }

    /* ── App Shell ── */
    .app-shell {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--color-bg);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .app-frame {
      flex: 1;
      padding-bottom: 32px;
    }

    /* ── App Bar ── */
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      padding-top: calc(var(--space-3) + env(safe-area-inset-top, 0px));
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border-light);
    }
    .app-bar-left { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
    .app-bar-back, .app-bar-action {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-full); border: none; background: transparent;
      cursor: pointer; color: var(--color-text-primary);
      transition: background-color 0.2s ease, transform 0.15s ease;
      flex-shrink: 0;
    }
    .app-bar-back:hover, .app-bar-action:hover { background-color: var(--color-bg-sunken); }
    .app-bar-back:active, .app-bar-action:active { transform: scale(0.95); }
    .app-bar-back svg, .app-bar-action svg { width: 22px; height: 22px; }
    .app-bar-title {
      font-size: var(--text-lg);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-bar-right { display: flex; align-items: center; gap: var(--space-1); flex-shrink: 0; }

    /* ── Page Content ── */
    .page-content {
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    /* ── Section Card ── */
    .section-card {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .section-card__title {
      font-size: var(--text-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .section-card__title svg { width: 16px; height: 16px; color: var(--color-primary); }

    /* ── Path breadcrumb ── */
    .path-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-1) var(--space-2);
    }
    .path-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background-color: var(--color-primary-bg);
      color: var(--color-primary-dark);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      line-height: var(--text-sm-lh);
    }
    .path-chip.path-secondary {
      background-color: var(--color-secondary-bg);
      color: var(--color-secondary-dark);
    }
    .path-chip.path-current {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: var(--color-text-inverse);
      font-weight: var(--font-weight-semibold);
    }
    .path-sep {
      color: var(--color-text-tertiary);
      display: flex;
      align-items: center;
    }
    .path-sep svg { width: 14px; height: 14px; }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-2) 0;
      border-bottom: 1px dashed var(--color-border-light);
      font-size: var(--text-sm);
    }
    .meta-row:last-child { border-bottom: none; }
    .meta-row .meta-label { color: var(--color-text-tertiary); }
    .meta-row .meta-value {
      color: var(--color-text-primary);
      font-weight: var(--font-weight-medium);
      word-break: break-all;
      text-align: right;
      max-width: 65%;
    }

    /* ── Code preview box ── */
    .code-box {
      background-color: var(--color-bg-sunken);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      word-break: break-all;
      line-height: 1.5;
    }
    .code-box code { font-family: inherit; }
    .code-label {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: var(--font-weight-semibold);
    }

    /* ── Buttons ── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: var(--color-text-inverse);
      font-size: var(--text-base);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-sans);
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
      box-shadow: 0 2px 8px rgba(216, 27, 96, 0.25);
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary svg { width: 16px; height: 16px; }

    .btn-outlined {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-full);
      background-color: transparent;
      color: var(--color-primary);
      font-size: var(--text-base);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-sans);
      border: 1.5px solid var(--color-primary);
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .btn-outlined:hover { background-color: var(--color-primary-bg-soft); }
    .btn-outlined:active { transform: scale(0.98); }
    .btn-outlined svg { width: 16px; height: 16px; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-full);
      background-color: var(--color-secondary);
      color: var(--color-text-inverse);
      font-size: var(--text-base);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-sans);
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.22);
    }
    .btn-secondary:hover { opacity: 0.9; }
    .btn-secondary:active { transform: scale(0.98); }
    .btn-secondary svg { width: 16px; height: 16px; }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      background-color: var(--color-bg-sunken);
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      font-family: var(--font-sans);
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn-ghost:hover { background-color: var(--color-border); }
    .btn-ghost svg { width: 14px; height: 14px; }

    /* ── Hero header card ── */
    .hero-card {
      background: linear-gradient(135deg, #D81B60 0%, #AD1457 45%, #8B5CF6 100%);
      border-radius: var(--radius-xl);
      padding: var(--space-5) var(--space-4);
      color: var(--color-text-inverse);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    .hero-card::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 20px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }
    .hero-eyebrow {
      font-size: var(--text-xs);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.8;
      font-weight: var(--font-weight-semibold);
      position: relative;
      z-index: 2;
      margin-bottom: var(--space-2);
    }
    .hero-name {
      font-size: var(--text-xl);
      font-weight: var(--font-weight-bold);
      position: relative;
      z-index: 2;
      margin-bottom: var(--space-1);
      word-break: break-all;
    }
    .hero-type {
      font-size: var(--text-sm);
      opacity: 0.85;
      position: relative;
      z-index: 2;
    }

    /* ── Code preview area ── */
    .code-preview-wrap {
      display: flex;
      justify-content: center;
      padding: var(--space-3);
      background-color: #FFFFFF;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border-light);
      margin: var(--space-3) 0;
    }
    .code-preview-wrap svg { max-width: 100%; height: auto; display: block; }

    /* ── NFC card ── */
    .nfc-hint {
      background-color: var(--color-secondary-bg-soft);
      border-left: 3px solid var(--color-secondary);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      line-height: var(--text-base-lh);
      margin-top: var(--space-2);
    }
    .nfc-hint code {
      display: block;
      margin-top: var(--space-2);
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: var(--text-xs);
      color: var(--color-secondary-dark);
      background-color: var(--color-surface);
      padding: var(--space-2);
      border-radius: var(--radius-sm);
      word-break: break-all;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      max-width: 80vw;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Error state ── */
    .error-state {
      padding: 80px 24px;
      text-align: center;
      color: var(--color-text-tertiary);
    }
    .error-state__icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background-color: var(--color-bg-sunken);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
    }
    .error-state__icon svg { width: 32px; height: 32px; }
    .error-state__title {
      font-size: var(--text-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: 6px;
    }
    .error-state__msg {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }

    .btn-block { width: 100%; }

    /* ── Pill badge (entity type) ── */
    .type-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--font-weight-semibold);
      background-color: rgba(255, 255, 255, 0.2);
      color: var(--color-text-inverse);
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">

  <script src="../assets/store.js"></script>
  <script>
  /* ============================================================
     location-code.html - 位置标识页
     URL: location-code.html?type=<house|floor|room|container|item>&id=<entityId>&returnTo=<url>
     ============================================================ */
  (function () {
    'use strict';

    var S = window.GuiweiStore;
    var contentRoot = document.getElementById('content-root');
    var btnBack = document.getElementById('btn-back');
    var btnCopyTop = document.getElementById('btn-copy-top');
    var toastEl = document.getElementById('toast');

    var VALID_TYPES = ['house', 'floor', 'room', 'container', 'item'];
    var TYPE_LABEL = {
      house: '住宅',
      floor: '楼层',
      room: '房间',
      container: '容器',
      item: '物品'
    };
    var TYPE_ICON_PATH = {
      house: '<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
      floor: '<rect x="3" y="6" width="18" height="4" rx="1"/><rect x="3" y="14" width="18" height="4" rx="1"/>',
      room: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',
      container: '<path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
      item: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>'
    };

    // ── 解析 URL ──
    var params = new URLSearchParams(window.location.search);
    var type = params.get('type');
    var id = params.get('id');
    var returnTo = params.get('returnTo') || '';

    // ── HTML 转义 ──
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ── 获取实体 ──
    function fetchEntity(t, entityId) {
      if (t === 'house') return S.getHouse(entityId);
      if (t === 'floor') return S.getFloor(entityId);
      if (t === 'room') return S.getRoom(entityId);
      if (t === 'container') return S.getContainer(entityId);
      if (t === 'item') return S.getItem(entityId);
      return null;
    }

    // ── 构造完整路径链 [{type, id, name}] ──
    function buildPathChain(t, entity) {
      var chain = [];
      try {
        if (t === 'house') {
          chain.push({ type: 'house', id: entity.id, name: entity.name });
        } else if (t === 'floor') {
          var h = entity.houseId ? S.getHouse(entity.houseId) : null;
          if (h) chain.push({ type: 'house', id: h.id, name: h.name });
          chain.push({ type: 'floor', id: entity.id, name: entity.name });
        } else if (t === 'room') {
          var f = entity.floorId ? S.getFloor(entity.floorId) : null;
          var rh = f && f.houseId ? S.getHouse(f.houseId) : null;
          if (rh) chain.push({ type: 'house', id: rh.id, name: rh.name });
          if (f) chain.push({ type: 'floor', id: f.id, name: f.name });
          chain.push({ type: 'room', id: entity.id, name: entity.name });
        } else if (t === 'container') {
          // 房间 + 楼层 + 住宅
          var room = entity.roomId ? S.getRoom(entity.roomId) : null;
          var cf = room && room.floorId ? S.getFloor(room.floorId) : null;
          var ch = cf && cf.houseId ? S.getHouse(cf.houseId) : null;
          if (ch) chain.push({ type: 'house', id: ch.id, name: ch.name });
          if (cf) chain.push({ type: 'floor', id: cf.id, name: cf.name });
          if (room) chain.push({ type: 'room', id: room.id, name: room.name });
          // 父容器链（从根到当前）
          var parents = [];
          var cur = entity.parentContainerId ? S.getContainer(entity.parentContainerId) : null;
          while (cur) {
            parents.unshift({ type: 'container', id: cur.id, name: cur.name });
            cur = cur.parentContainerId ? S.getContainer(cur.parentContainerId) : null;
          }
          parents.forEach(function (p) { chain.push(p); });
          chain.push({ type: 'container', id: entity.id, name: entity.name });
        } else if (t === 'item') {
          // 使用 store 的 resolveItemPath
          var path = S.resolveItemPath(entity.id);
          if (!path) {
            chain.push({ type: 'item', id: entity.id, name: entity.name });
            return chain;
          }
          if (path.house) chain.push({ type: 'house', id: path.house.id, name: path.house.name });
          if (path.floor) chain.push({ type: 'floor', id: path.floor.id, name: path.floor.name });
          if (path.room) chain.push({ type: 'room', id: path.room.id, name: path.room.name });
          if (path.container) {
            // 容器可能存在父容器链，但 resolveItemPath 只返回直接容器
            // 此处补充父容器链
            var itemContainer = path.container;
            var itemParents = [];
            var pc = itemContainer.parentContainerId ? S.getContainer(itemContainer.parentContainerId) : null;
            while (pc) {
              itemParents.unshift({ type: 'container', id: pc.id, name: pc.name });
              pc = pc.parentContainerId ? S.getContainer(pc.parentContainerId) : null;
            }
            itemParents.forEach(function (p) { chain.push(p); });
            chain.push({ type: 'container', id: itemContainer.id, name: itemContainer.name });
          }
          chain.push({ type: 'item', id: entity.id, name: entity.name });
        }
      } catch (e) {
        console.error('[location-code] buildPathChain failed', e);
      }
      return chain;
    }

    // ============================================================
    // QR 码生成（伪 QR，含 3 角定位符 + 中央数据矩阵）
    // ============================================================
    function generateQrSvg(text, size) {
      size = size || 240;
      var modules = 25; // 25x25 QR
      var cell = size / modules;
      var quiet = 0; // 安静区已包含在外部容器

      // 基于文本的种子 PRNG（mulberry32）
      function hashStr(s) {
        var h = 2166136261 >>> 0;
        for (var i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        return h >>> 0;
      }
      var seed = hashStr(text || 'guiwei');
      function rng() {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      // 初始化矩阵：false = 白，true = 黑
      var matrix = [];
      for (var r = 0; r < modules; r++) {
        matrix.push(new Array(modules).fill(false));
      }

      // 判断坐标是否落在 finder 区域（7x7）+ 1 模块分隔
      function inFinderArea(r, c) {
        // TL: 0..6
        if (r >= 0 && r <= 6 && c >= 0 && c <= 6) return 'TL';
        // TR: 0..6, modules-7..modules-1
        if (r >= 0 && r <= 6 && c >= modules - 7 && c <= modules - 1) return 'TR';
        // BL: modules-7..modules-1, 0..6
        if (r >= modules - 7 && r <= modules - 1 && c >= 0 && c <= 6) return 'BL';
        // 分隔区
        return null;
      }
      function inFinderOrSeparator(r, c) {
        // TL finder + separator (cols 0..7, rows 0..7)
        if (r >= 0 && r <= 7 && c >= 0 && c <= 7) return true;
        // TR finder + separator (cols modules-8..modules-1, rows 0..7)
        if (r >= 0 && r <= 7 && c >= modules - 8 && c <= modules - 1) return true;
        // BL finder + separator (cols 0..7, rows modules-8..modules-1)
        if (r >= modules - 8 && r <= modules - 1 && c >= 0 && c <= 7) return true;
        return false;
      }

      // 画 finder pattern（7x7 外框 + 5x5 白 + 3x3 黑心）
      function drawFinder(startR, startC) {
        for (var dr = 0; dr < 7; dr++) {
          for (var dc = 0; dc < 7; dc++) {
            var onBorder = (dr === 0 || dr === 6 || dc === 0 || dc === 6);
            var onInner = (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
            matrix[startR + dr][startC + dc] = onBorder || onInner;
          }
        }
      }
      drawFinder(0, 0);
      drawFinder(0, modules - 7);
      drawFinder(modules - 7, 0);

      // 画 timing pattern：第 6 行/列交替黑白（跳过 finder 区域）
      for (var i = 8; i < modules - 8; i++) {
        matrix[6][i] = (i % 2 === 0);
        matrix[i][6] = (i % 2 === 0);
      }

      // 填充数据区
      for (var rr = 0; rr < modules; rr++) {
        for (var cc = 0; cc < modules; cc++) {
          if (inFinderOrSeparator(rr, cc)) continue;
          // 跳过 timing 行/列（已设置）
          if (rr === 6 || cc === 6) continue;
          // 伪随机数据
          matrix[rr][cc] = rng() < 0.48;
        }
      }

      // 构造 SVG
      var rects = '';
      for (var r2 = 0; r2 < modules; r2++) {
        for (var c2 = 0; c2 < modules; c2++) {
          if (matrix[r2][c2]) {
            rects += '<rect x="' + (c2 * cell).toFixed(3) +
                     '" y="' + (r2 * cell).toFixed(3) +
                     '" width="' + cell.toFixed(3) +
                     '" height="' + cell.toFixed(3) + '" fill="#111827"/>';
          }
        }
      }
      var svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
        '" viewBox="0 0 ' + size + ' ' + size + '">' +
        '<rect width="' + size + '" height="' + size + '" fill="#FFFFFF"/>' +
        rects +
        '</svg>';
      return svg;
    }

    // ============================================================
    // Code128 风格条形码生成
    // ============================================================
    function generateBarcodeSvg(text, width) {
      width = width || 320;
      var height = 96;
      var textStr = String(text || '');
      if (!textStr) textStr = 'guiwei://code/empty';

      // 每个字符映射成 6 个 module（3 黑条 + 3 白条），宽度按 charCode 决定
      // 起始符 + 字符串 + 终止符
      var modules = []; // true=黑 false=白
      var widths = []; // 每个 module 的宽度（1 或 2）

      // 起始符：固定模式 [1,1,1,1,1,1]
      [true, true, true, false, true, false].forEach(function (m, i) {
        modules.push(m);
        widths.push(i % 2 === 0 ? 2 : 1);
      });

      for (var i = 0; i < textStr.length; i++) {
        var code = textStr.charCodeAt(i);
        // 基于 charCode 生成 6 个 module 模式
        var b1 = (code & 1) === 1;
        var b2 = (code & 2) === 2;
        var b3 = (code & 4) === 4;
        var b4 = (code & 8) === 8;
        var b5 = (code & 16) === 16;
        var b6 = (code & 32) === 32;
        // 黑白交替：黑-白-黑-白-黑-白
        var pattern = [b1, !b1, b2, !b2, b3, !b3];
        // 宽度变化：根据 charCode 派生
        var w1 = ((code >> 4) & 1) + 1;
        var w2 = ((code >> 5) & 1) + 1;
        var w3 = ((code >> 6) & 1) + 1;
        var w4 = ((code >> 0) & 1) + 1;
        var w5 = ((code >> 1) & 1) + 1;
        var w6 = ((code >> 2) & 1) + 1;
        var ws = [w1, w2, w3, w4, w5, w6];
        for (var k = 0; k < 6; k++) {
          modules.push(pattern[k]);
          widths.push(ws[k]);
        }
      }

      // 终止符：固定 [1,1,1,1,1,1,1] (7 modules)
      [true, true, true, false, true, true, false].forEach(function (m, i) {
        modules.push(m);
        widths.push(i < 3 ? 2 : 1);
      });

      // 计算总单位
      var totalUnits = 0;
      for (var w = 0; w < widths.length; w++) totalUnits += widths[w];
      var unitWidth = width / totalUnits;
      var padding = 8;

      // 构造 SVG bars
      var bars = '';
      var x = padding;
      for (var b = 0; b < modules.length; b++) {
        var w = widths[b] * unitWidth;
        if (modules[b]) {
          bars += '<rect x="' + x.toFixed(3) + '" y="' + padding +
                  '" width="' + w.toFixed(3) + '" height="' + (height - padding * 2 - 18) +
                  '" fill="#111827"/>';
        }
        x += w;
      }

      var totalWidth = width + padding * 2;

      // 文本标签（截断显示）
      var labelText = textStr.length > 40 ? textStr.slice(0, 38) + '…' : textStr;
      var svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + totalWidth + '" height="' + height +
        '" viewBox="0 0 ' + totalWidth + ' ' + height + '">' +
        '<rect width="' + totalWidth + '" height="' + height + '" fill="#FFFFFF"/>' +
        bars +
        '<text x="' + (totalWidth / 2) + '" y="' + (height - 4) +
        '" font-family="monospace" font-size="10" fill="#111827" text-anchor="middle">' +
        escapeHtml(labelText) + '</text>' +
        '</svg>';
      return svg;
    }

    // ============================================================
    // 下载 SVG（Blob + 临时 a 标签）
    // ============================================================
    function downloadSvg(svgString, filename) {
      try {
        var blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
        showToast('已下载：' + filename);
      } catch (e) {
        console.error('[downloadSvg]', e);
        showToast('下载失败');
      }
    }

    // ============================================================
    // 复制到剪贴板
    // ============================================================
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showToast('已复制到剪贴板');
        }).catch(function () {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(ok ? '已复制到剪贴板' : '复制失败');
      } catch (e) {
        showToast('复制失败');
      }
    }

    // ── Toast ──
    var toastTimer = null;
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toastEl.classList.remove('show');
      }, 2200);
    }

    // ── 返回 ──
    function goBack() {
      if (returnTo) {
        window.location.href = returnTo;
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'home.html';
      }
    }

    // ============================================================

    function renderPage(entity) {
      var typeLabel = TYPE_LABEL[type] || type;
      var payload = S.buildPayload(entity.code);
      var rawCode = entity.code;

      var chain = buildPathChain(type, entity);

      // 路径面包屑 HTML
      var pathHtml = '';
      if (chain.length === 0) {
        pathHtml = '<span style="font-size: var(--text-sm); color: var(--color-text-tertiary);">未设置位置</span>';
      } else {
        chain.forEach(function (node, i) {
          var cls = 'path-chip';
          if (i === chain.length - 1) cls += ' path-current';
          else if (i % 2 === 1) cls += ' path-secondary';
          var iconPath = TYPE_ICON_PATH[node.type] || '';
          pathHtml += '<span class="' + cls + '">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">' + iconPath + '</svg>' +
            escapeHtml(node.name || node.type) +
          '</span>';
          if (i < chain.length - 1) {
            pathHtml += '<span class="path-sep">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
            '</span>';
          }
        });

      // QR SVG
      var qrSvg = generateQrSvg(payload, 220);

        '<section class="section-card">' +

            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14"/><path d="M7 5v14"/><path d="M11 5v14"/><path d="M15 5v14"/><path d="M19 5v14"/></svg>' +
            '条形码下载' +
          '</div>' +
          '<div class="code-preview-wrap" id="barcode-preview" style="overflow-x: auto;">' + barcodeSvg + '</div>' +
          '<div style="font-size: var(--text-xs); color: var(--color-text-tertiary); text-align: center; margin-bottom: var(--space-3);">Code128 风格 · 仅用于视觉标识</div>' +
          '<button class="btn-primary btn-block" id="btn-download-barcode" type="button">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
            '下载条形码 (SVG)' +
          '</button>' +
        '</section>' +

        // NFC 卡片
        '<section class="section-card">' +
          '<div class="section-card__title">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>' +
            'NFC 录入' +
          '</div>' +
          nfcHtml +
        '</section>' +

        // 返回按钮
        '<section style="padding: var(--space-2) 0 var(--space-4);">' +
          '<button class="btn-outlined btn-block" id="btn-return" type="button">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
            '返回' +
          '</button>' +
        '</section>';

      // 绑定事件
      bindActions(entity, payload, qrSvg, barcodeSvg);
    }

    // ============================================================
    // 绑定事件
    // ============================================================
    function bindActions(entity, payload, qrSvg, barcodeSvg) {
      var safeName = (entity.name || type + '-' + (entity.id || 'x'))
        .replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 24);

      var btnCopyPayload = document.getElementById('btn-copy-payload');
      var btnCopyUuid = document.getElementById('btn-copy-uuid');
      var btnDownloadQr = document.getElementById('btn-download-qr');
      var btnDownloadBarcode = document.getElementById('btn-download-barcode');
      var btnNfcWrite = document.getElementById('btn-nfc-write');
      var btnNfcCopy = document.getElementById('btn-nfc-copy');
      var btnReturn = document.getElementById('btn-return');

      if (btnCopyPayload) btnCopyPayload.addEventListener('click', function () {
        copyToClipboard(payload);
      });
      if (btnCopyUuid) btnCopyUuid.addEventListener('click', function () {
        copyToClipboard(entity.code);
      });
      if (btnDownloadQr) btnDownloadQr.addEventListener('click', function () {
        downloadSvg(qrSvg, 'qr_' + safeName + '.svg');
      });
      if (btnDownloadBarcode) btnDownloadBarcode.addEventListener('click', function () {
        downloadSvg(barcodeSvg, 'barcode_' + safeName + '.svg');
      });
      if (btnNfcWrite) btnNfcWrite.addEventListener('click', function () {
        attemptNfcWrite(payload);
      });
      if (btnNfcCopy) btnNfcCopy.addEventListener('click', function () {
        copyToClipboard(payload);
      });
      if (btnReturn) btnReturn.addEventListener('click', function () {
        goBack();
      });
    }

    // ── NFC 写入尝试（即使 API 存在也可能抛错） ──
    function attemptNfcWrite(payload) {
      try {
        if (!navigator.nfc || !navigator.nfc.push) {
          showToast('本设备不支持 Web NFC');
          return;
        }
        var message = {
          records: [{ recordType: 'text', mediaType: 'text/plain', data: payload }]
        };
        navigator.nfc.push(message).then(function () {
          showToast('NFC 写入成功');
        }).catch(function (err) {
          console.warn('[nfc] push failed', err);
          showToast('NFC 写入失败：' + (err && err.message ? err.message : '未知错误'));
        });
      } catch (e) {
        showToast('NFC 写入失败');
      }
    }

    // ── 顶部复制按钮 ──
    var currentPayload = null;
    function setTopCopy(payload) { currentPayload = payload; }
    btnCopyTop.addEventListener('click', function () {
      if (currentPayload) copyToClipboard(currentPayload);
      else showToast('暂无可复制内容');
    });

    // ── 返回按钮 ──
    btnBack.addEventListener('click', function () { goBack(); });

    // ============================================================
    // 启动
    // ============================================================
    function start() {
      if (!type || !id) {
        renderError('参数错误', '缺少 type 或 id 参数', true);
        return;
      }
      if (VALID_TYPES.indexOf(type) === -1) {
        renderError('参数错误', 'type 必须为 house / floor / room / container / item', true);
        return;
      }
      var entity = fetchEntity(type, id);
      if (!entity) {
        renderError('未找到实体', '该' + (TYPE_LABEL[type] || '实体') + '不存在或已被删除', false);
        return;
      }
      var payload = S.buildPayload(entity.code);
      setTopCopy(payload);
      renderPage(entity);
    }

    start();
  })();
  </script>
</body>
</html>
